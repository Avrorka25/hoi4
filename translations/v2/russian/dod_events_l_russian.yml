l_russian:
 DOD_hungary.1.t:0 "[HUN.GetNameDefCap] требует проведения референдума"
 DOD_hungary.1.desc:0 "Выступая с речью в Будапеште, [HUN.GetLeader] потребовал позволить его подданным из [AUS.GetAdjective] вернуться под его власть. Однако в качестве жеста примирения он публично отметил, что народ [AUS.GetAdjective] должен самостоятельно сделать этот выбор."
 DOD_hungary.1.a:0 "Пусть народ выскажет свою волю."
 DOD_hungary.1.b:0 "Такие дела следует оставить профессионалам."
 DOD_hungary.1.c:0 "Мы обеспечим нужный результат."
 DOD_hungary.2.t:0 "Референдум одобрен"
 DOD_hungary.2.desc:0 "Результаты референдума подведены, и предварительный подсчёт показывает значительное большинство в пользу объединения с [HUN.GetNameDef]."
 DOD_hungary.2.a:0 "Народ высказался."
 DOD_hungary.3.t:0 "Референдум провален"
 DOD_hungary.3.desc:0 "Несмотря на хорошо организованную кампанию сторонников [HUN.GetAdjective] и монархистов, предварительные результаты показывают незначительное большинство в пользу сохранения нынешнего положения."
 DOD_hungary.3.a:0 "Мудрый выбор."
 DOD_hungary.4.t:0 "Референдум завершился успехом"
 DOD_hungary.4.desc:0 "Вскоре после полуночи [AUS.GetLeader] объявил, что народ [AUS.GetAdjective] проголосовал за объединение с [HUN.GetNameDef]. Прибыла телеграмма с официальным предложением [HUN.GetLeader] принять корону Австрии, что станет первым шагом к возрождению дуалистической монархии."
 DOD_hungary.4.a:0 "Превосходно."
 DOD_hungary.5.t:0 "Референдум проигран"
 DOD_hungary.5.desc:0 "Несмотря на все наши усилия, народ [AUS.GetNameDef] решил сохранить нынешнее положение."
 DOD_hungary.5.a:0 "Мы должны освободить страну и вернуть её законному правителю."
 DOD_hungary.5.b:0 "Мы признаем результат."
 DOD_hungary.6.t:0 "В референдуме отказано"
 DOD_hungary.6.desc:0 "Лидер [AUS.GetADjective] [AUS.GetLeader] публично заявил, что вся страна едина в своём неприятии Габсбургов и что сама идея референдума о независимости [AUS.GetAdjective] совершенно абсурдна. "
 DOD_hungary.6.a:0 "Посмотрим, насколько они в действительности едины."
 DOD_hungary.6.b:0 "Вот как работает «демократия»."
 DOD_hungary.7.t:0 "Управление референдумом"
 DOD_hungary.7.desc:0 "Предложение [HUN.GetAdjective] провести референдум поставило нас в сложное международное положение. Мы не можем открыто лишить народ выбора, но и доверить ему принять правильное решение тоже не можем. К счастью, существуют способы решить эту проблему. Какой результат референдума нам нужен?"
 DOD_hungary.7.a:0 "Народ откажется"
 DOD_hungary.7.b:0 "Народ согласится"
 DOD_hungary.10.t:0 "Австро-Венгрия предлагает гарантии"
 DOD_hungary.10.desc:0 "После недавних драматических перемен в политическом положении на Балканах вновь и вновь поднимается вопрос о наших отношениях с новой Австро-Венгерской империей. Сегодня посол [HUN.GetADjective] передал официальную ноту с формальным требованием обозначить нашу позицию по отношению к империи. Габсбурги утверждают, что Богемия и Моравия, являвшиеся прежде коронными землями, принадлежат им.\n\nОднако [HUN.GetLeader] дал понять, что готов принять компромиссное решение: он номинально станет главой нашей страны, но будет обладать лишь весьма ограниченной реальной властью."
 DOD_hungary.10.a:0 "Мы вернёмся в состав империи."
 DOD_hungary.10.b:0 "Мы примем компромисс."
 DOD_hungary.10.c:0 "Мы никогда не отдадим свободу в обмен на безопасность!"
 DOD_hungary.11.t:0 "Богемия возвращается под власть короны"
 DOD_hungary.11.desc:0 "После переговоров на высшем уровне, продолжавшихся до глубокой ночи, правительство [CZE.GetAdjective] решило принять наше предложение и провозгласило [HUN.GetLeader] королём Богемии и маркграфом Моравии. Солдаты бывшей чешской армии присягнули своему новому королю и императору, а гражданская администрация этих земель была полностью объединена."
 DOD_hungary.11.a:0 "Ещё один шаг к возвращению нашего наследия."
 DOD_hungary.12.t:0 "Богемия соглашается на более тесные отношения"
 DOD_hungary.12.desc:0 "Стараясь сохранить хрупкое равновесие между республиканской и монархической фракциями своего правительства, [CZE.GetLeader] выбрал компромиссное решение. [HUN.GetLeader] будет провозглашён королём Богемии и Моравии, однако конституция [CZE.GetAdjective] ограничит его полномочия, позволив ему действовать лишь с совета и согласия парламента."
 DOD_hungary.12.a:0 "Приемлемо."
 DOD_hungary.13.t:0 "[CZE.GetNameDefCap] отвергает наши предложения"
 DOD_hungary.13.desc:0 "[CZE.GetNameDefCap] отказалась рассматривать любые соглашения или договорённости относительно наших будущих отношений. Когда наш посол прибыл в министерство иностранных дел, чтобы обсудить ранее переданную им официальную ноту, ему сообщили, что обсуждать нечего, и быстро указали на дверь. Посол [CZE.GetAdjective] при нашем правительстве заявил, что, хотя его правительство желает мирных и дружественных отношений между нашими народами, о включении [CZE.GetNameDef] в состав Австро-Венгерской империи не может быть и речи."
 DOD_hungary.13.a:0 "Очень жаль."
 DOD_hungary.20.t:0 "Война в [HUN.GetNameDef]"
 DOD_hungary.20.desc:0 "После начала войны в [HUN.GetNameDef] неоднократно поднимался вопрос о поддержке этой страны. Консервативные газеты требуют оказать помощь [HUN.GetAdjective], заявляя, что король не может бездействовать, пока его сын, ныне король Венгрии, подвергается нападению. В прессу просочилось письмо анонимной группы армейских офицеров, утверждающих, что многие солдаты готовы отправиться в [HUN.GetNameDef] и сражаться, если правительство им это позволит.\n\nПравительство собралось, чтобы обсудить возможные действия."
 DOD_hungary.20.a:0 "Мы не можем позволить втянуть себя в этот конфликт."
 DOD_hungary.20.b:0 "Отправить в [HUN.GetNameDef] наблюдательную миссию. И побольше."
 DOD_hungary.20.c:0 "Их война — это наша война."
 DOD_hungary.21.t:0 "[SWE.GetNameDefCap] отказывает в помощи"
 DOD_hungary.21.desc:0 "Несмотря на многочисленные обращения [SWE.GetAdjective] короля и представителей [SWE.GetAdjective] вооружённых сил, правительство [SWE.GetNameDef] отказалось позволить кому-либо прийти нам на помощь. Даже частным лицам, желающим отправиться в [HUN.GetNameDef] и сражаться, отказывают в выездных визах, а правительство провело закон, запрещающий продавать нам оружие."
 DOD_hungary.21.a:0 "Мы остались одни."
 DOD_hungary.22.t:0 "[SWE.GetNameDefCap] отправляет поддержку"
 DOD_hungary.22.desc:0 "Хотя правительство [SWE.GetAdjective] официально сохраняет нейтралитет, оно позволило на удивление большому числу солдат и офицеров уйти в длительные отпуска и даже взять с собой оружие. Эти бойцы добрались до [HUN.GetNameDef] и теперь готовы вступить в ряды нашей армии."
 DOD_hungary.22.a:0 "Превосходно."
 DOD_hungary.23.t:0 "[SWE.GetNameDefCap] вмешивается"
 DOD_hungary.23.desc:0 "К удивлению даже опытных дипломатов, [SWE.GetAdjective] правительство объявило, что считает наше выживание одним из важнейших национальных интересов [SWE.GetNameDef]. По слухам, сам [SWE.GetAdjective] король вмешался в нашу защиту, пригрозив отречься от престола и лично отправиться в Венгрию, чтобы поступить на военную службу, если правительство не предложит ничего, кроме тёплых слов поддержки."
 DOD_hungary.23.a:0 "Успеют ли они прибыть вовремя?"
 DOD_hungary.24.t:0 "[SWE.GetNameDefCap] подвергается нападению"
 DOD_hungary.24.desc:0 "[SWE.GetNameDefCap] оказалась втянута в кровопролитный конфликт. Во время редкого выступления перед обеими палатами парламента король отметил, что обеспокоен судьбой своей прежней родины и особенно тем, что ждёт его отца и семью в случае поражения [SWE.GetNameDef]. В связи с этим правительство решило собраться и обсудить, какую помощь можно оказать [SWE.GetNameDef]."
 DOD_hungary.24.a:0 "Мы не можем позволить втянуть себя в их конфликт."
 DOD_hungary.24.b:0 "Отправить тайную помощь."
 DOD_hungary.24.c:0 "Мы будем сражаться плечом к плечу с [SWE.GetAdjective]."
 DOD_hungary.25.t:0 "[HUN.GetNameDefCap] отказывает в помощи"
 DOD_hungary.25.desc:0 "Несмотря на личное обращение короля [HUN.GetAdjective], парламент проголосовал против любой поддержки [SWE.GetNameDef]. Оппозиция пригрозила отстранить [HUN.GetLeader] посредством вотума недоверия, если он попытается предпринять что-либо, нарушающее нейтралитет [HUN.GetAdjective]."
 DOD_hungary.25.a:0 "Мы остались одни."
 DOD_hungary.26.t:0 "[HUN.GetNameDefCap] отправляет поддержку"
 DOD_hungary.26.desc:0 "[HUN.GetNameDefCap] открыла свои старые арсеналы и отправила нам несколько восстановленных винтовок и другое пехотное снаряжение. К нам также прибыло несколько тысяч добровольцев из [HUN.GetAdjective]."
 DOD_hungary.26.a:0 "Мы рады их прибытию."
 DOD_hungary.27.t:0 "[HUN.GetNameDefCap] вмешивается"
 DOD_hungary.27.desc:0 "Правительство [HUN.GetAdjective] выступило с заявлением, в котором провозгласило, что любое нападение на Швецию будет считаться нападением на [HUN.GetNameDef]. Вооружённые силы [HUN.GetAdjective] приведены в состояние повышенной боевой готовности и, как ожидается, вступят в войну сразу после завершения мобилизации."
 DOD_hungary.27.a:0 "Успеют ли они вовремя?"
 DOD_hungary.30.t:0 "[HUN.GetNameDefCap] предлагает сближение"
 DOD_hungary.30.desc:0 "Правительство [HUN.GetAdjective] предложило нам пересмотреть Трианонский договор. Согласно их предложению, ограничения численности армии будут изменены, что позволит [HUN.GetNameDef] полностью укомплектовать нынешние вооружённые силы. Кроме того, [HUN.GetNameDefCap] получит право направлять большую долю бюджета на расширение и модернизацию военной промышленности.\n\nПоскольку страной прочно управляет демократическое правительство, в нашей дипломатической службе это предложение пользуется значительной поддержкой."
 DOD_hungary.30.a:0 "Разумная просьба."
 DOD_hungary.30.b:0 "И для чего им нужна более крупная армия?"
 DOD_hungary.31.t:0 "Пересмотр Трианонского договора"
 DOD_hungary.31.desc:0 "Правительство [HUN.GetLeader] одержало крупную политическую победу: [From.GetNameDef] только что ратифицировала поправки к Трианонскому договору. Теперь нам разрешено восстановить воинскую повинность и открыто выделять бюджетные средства на строительство военных заводов."
 DOD_hungary.31.a:0 "Превосходно."
 DOD_hungary.32.t:0 "[From.GetNameDefCap] отказывается от переговоров"
 DOD_hungary.32.desc:0 "Правительство [From.GetNameDef] отказалось идти на уступки в вопросе перевооружения. Переговоры практически сразу зашли в тупик: делегация [From.GetAdjective] затягивает обсуждение при каждой возможности, превращая даже такие мелочи, как порядок рассадки, в многочасовые дебаты. Очевидно, нам не намерены позволять перевооружаться, но хотят, чтобы именно мы покинули переговоры."
 DOD_hungary.32.a:0 "Что ж, подыграем им."
 DOD_hungary.32.b:0 "Обратиться за помощью к [FRA.GetAdjective]."
 DOD_hungary.32.c:0 "Обратиться за помощью к [ENG.GetAdjective]."
 DOD_hungary.33.t:0 "[HUN.GetNameDefCap] обращается за поддержкой"
 DOD_hungary.33.desc:0 "Недавно [HUN.GetNameDefCap] начала выяснять отношение соседей к пересмотру некоторых ограничений, наложенных после последней войны. В частности, она хочет вновь ввести воинскую повинность и расширить военную промышленность. [HUN.GetADjective] утверждает, что мир с каждым днём становится всё опаснее и ей необходимы сильные вооружённые силы для собственной защиты. [From.From.GetNameDefCap] придерживается иного мнения."
 DOD_hungary.33.a:0 "Следует разрешить [HUN.GetNameDefCap] ограниченное перевооружение."
 DOD_hungary.33.b:0 "Мы не можем нарушать равновесие сил в регионе."
 DOD_hungary.34.t:0 "[From.GetNameDefCap] поддерживает [HUN.GetNameDef]"
 DOD_hungary.34.desc:0 "Посол [From.GetNameDef] ясно дал понять, что его правительство категорически не согласно с нашим решением отказать [HUN.GetAdjective] в праве на перевооружение. Он также уточнил, что, если мы продолжим настаивать на разоружении [HUN.GetNameDef], его правительство учтёт это при рассмотрении касающихся нас дипломатических вопросов в будущем.\n\nИными словами, ради этого они готовы поставить на кон наши нынешние хорошие отношения."
 DOD_hungary.34.a:0 "Будем надеяться, что они не ошибаются."
 DOD_hungary.34.b:0 "Мы должны проявить твёрдость в этом вопросе."
 DOD_hungary.35.t:0 "[From.GetNameDefCap] отказывает в поддержке"
 DOD_hungary.35.desc:0 "Правительство [From.GetNameDef] сообщило нам, что считает пересмотр Трианонского договора исключительно внутренним делом затронутых стран, и отказалось вмешиваться. Похоже, хорошие отношения с бывшими союзниками для них важнее справедливости."
 DOD_hungary.35.a:0 "Будь они прокляты."
 DOD_hungary.36.t:0 "[From.GetNameDefCap] продолжает упорствовать"
 DOD_hungary.36.desc:0 "Несмотря на сильное политическое давление со стороны [From.From.GetNameDef], [From.GetNameDef] категорически отказалась обсуждать этот вопрос. Похоже, там всё ещё опасаются, что мы обратим своё оружие против них.\n\nПоскольку все дипломатические пути перекрыты, нам остаётся ждать и надеяться, что в будущем появится новая возможность вернуться к этому вопросу."
 DOD_hungary.36.a:0 "Неужели мы выглядим настолько опасными?"
 DOD_hungary.40.t:0 "[HUN.GetNameDefCap] отказывается от Трианонского договора"
 DOD_hungary.40.desc:0 "Сегодня [HUN.GetLeader] публично заявил, что больше не считает [HUN.GetNameDef] связанной условиями договора. Более того, он объявил его недействительным, утверждая, что тот был навязан Венгрии под угрозой оружия и потому никогда не обладал законной силой. Правительство [HUN.GetAdjective] даже не сочло нужным официально уведомить нас о своём решении.\n\nМногие в правительстве выступают за жёсткий ответ. Если мы покажем [HUN.GetAdjective], что не боимся, она может отступить. Однако там также могут решить, что мы блефуем."
 DOD_hungary.40.a:0 "Немедленно предъявить ультиматум."
 DOD_hungary.40.b:0 "Сейчас мы не можем позволить себе войну."
 DOD_hungary.41.t:0 "[From.GetNameDefCap] предъявляет ультиматум"
 DOD_hungary.41.desc:0 "Наше недавнее решение отказаться от Трианонского договора встретило неожиданно жёсткий отпор со стороны [From.GetNameDef]. По имеющимся сведениям, [From.GetLeader] потребовал, чтобы вооружённые силы [From.GetAdjective] немедленно подготовили план интервенции. Тем временем посол [From.GetAdjective] потребовал разъяснить наши заявления относительно договора, дав понять, что военный вариант всё ещё рассматривается."
 DOD_hungary.41.a:0 "Они явно блефуют."
 DOD_hungary.41.b:0 "Похоже, произошло недоразумение."
 DOD_hungary.42.t:0 "[From.GetNameDefCap] уступает"
 DOD_hungary.42.desc:0 "Несмотря на наши жёсткие заявления относительно Трианонского договора, [From.GetNameDef] не предприняла никаких попыток остановить нас. На недавней пресс-конференции [From.GetLeader] не ответил ни на один вопрос о нашем решении отказаться от договора. Это ясно подтверждает то, что и так все подозревали: [From.GetNameDef] — не более чем бумажный тигр."
 DOD_hungary.42.a:0 "Как и ожидалось."
 DOD_hungary.43.t:0 "[HUN.GetNameDefCap] отказывается отступать"
 DOD_hungary.43.desc:0 "Похоже, наше предупреждение [HUN.GetNameDef] осталось без внимания. Сообщается, что вчера вечером на митинге в Будапеште толпа скандировала «Смерть [From.From.GetNameDef]!» и [HUN.GetLeader] публично поклялся, что любая попытка помешать [HUN.GetNameDef] вернуть законное место в мире приведёт к «войне, подобной которой мир ещё не видел, войне, на фоне которой великая бойня 1914–1918 годов покажется обычной кабацкой дракой».\n\nМы стоим на распутье. Нам придётся либо вступить в войну ради защиты своей чести и репутации, либо признать, что нас переиграли."
 DOD_hungary.43.a:0 "Если [HUN.GetAdjective] хочет войны, она её получит."
 DOD_hungary.43.b:0 "Они разоблачили наш блеф."
 DOD_hungary.44.t:0 "[HUN.GetNameDefCap] отступает"
 DOD_hungary.44.desc:0 "С угрозой войны на столе, [HUN.GetAdjective] Правительство вдруг стало более дружественным. Наш посол был приглашен на частный обед с [HUN.GetLeader]где он был уверен, что [HUN.GetNameDef] Мы не хотели ничего, кроме мира и дружеских отношений с нами.[HUN.GetLeader] Мы не должны воспринимать какие-либо заявления в сенсационной прессе как исходящие из [HUN.GetAdjective] Правительство, которое никогда не хотело войны."
 DOD_hungary.44.a:0 "Мы так и думали."
 DOD_hungary.45.t:0 "Интервенция в [HUN.GetNameDef]"
 DOD_hungary.45.desc:0 "[From.GetNameDefCap] объявляет о военной интервенции после того, как [HUN.GetNameDef] открыто отреклась от Трианонского договора. Нас призывают присоединиться и сокрушить [HUN.GetNameDef], прежде чем она вновь наберёт силу."
 DOD_hungary.45.a:0 "Мы должны нанести удар, пока не стало слишком поздно."
 DOD_hungary.45.b:0 "Мы не позволим втянуть себя в этот конфликт."
 DOD_hungary.46.t:0 "[From.GetNameDefCap] провозглашает нейтралитет"
 DOD_hungary.46.desc:0 "Предатели и трусы в [From.GetNameDef] Мы отказались отвечать на наш призыв к оружию. Вместо того, чтобы противостоять хулигану в Будапеште, они перевернулись и оставили нас лицом к лицу. [HUN.GetAdjective]Один."
 DOD_hungary.46.a:0 "Мы справимся сами."
 DOD_hungary.50.t:0 "[HUN.GetNameDefCap] требует Трансильванию"
 DOD_hungary.50.desc:0 "Трансильвания долгое время входила в состав Венгрии, прежде чем после Великой войны её жители свободно решили присоединиться к нам. К сожалению, Венгрия так и не смирилась с потерей этой территории. В разное время венгры публично объявляли Трансильванию неотъемлемой частью Венгрии. После недавних политических перемен они вновь решили выдвинуть свои притязания и требуют передать им всю Трансильванию. Иначе..."
 DOD_hungary.50.a:0 "Она не стоит кровопролития новой войны."
 DOD_hungary.50.b:0 "Иначе что?"
 DOD_hungary.51.t:0 "[ROM.GetNameDefCap] передаёт Трансильванию"
 DOD_hungary.51.desc:0 "Вместо того, чтобы противостоять мощи наших армий, трусливый [ROM.GetAdjective]Мы решили вернуть наши законные территории. Вся Трансильвания передана нашей администрации, и наши силы взяли под полный контроль."
 DOD_hungary.51.a:0 "Так и должно быть."
 DOD_hungary.52.t:0 "[ROM.GetNameDefCap] отказывается отдать Трансильванию"
 DOD_hungary.52.desc:0 "Возможно, наиболее показательно, что [ROM.GetAdjective] Посол на встрече с [HUN.GetLeader] Сегодня утром почувствовал необходимость добавить \"как всегда\" к своему плоскому отказу обсуждать возможность передачи оспариваемых территорий. Снова и снова, в [ROM.GetAdjective] Правительство публично отказалось от наших претензий, даже высмеивая их. В течение многих лет мы были слишком слабы, чтобы дать отпор.\n\nБольше нет."
 DOD_hungary.52.a:0 "Гнев — плохой советчик на войне. Мы выждем."
 DOD_hungary.52.b:0 "На этот раз они зашли слишком далеко."
 DOD_hungary.53.t:0 "[HUN.GetNameDefCap] проводит мобилизацию"
 DOD_hungary.53.desc:0 "[HUN.GetNameDefCap] Он поставил свои войска в состояние повышенной готовности.[HUN.GetAdjective] За последние несколько часов разведывательные самолеты десятки раз проникали в наше воздушное пространство. Наша разведывательная служба сообщает о больших перемещениях войск к границам и воздушном налете сирен, воющих в Будапеште. Похоже, что на этот раз венгры настроены серьезно. Мы можем начать войну."
 DOD_hungary.53.a:1 "Мы сделали свой жест. Никто не хочет войны."
 DOD_hungary.53.b:1 "Они не пройдут!"
 DOD_hungary.53.c:0 "Возможно, пришло время для компромисса."
 DOD_hungary.54.t:0 "[ROM.GetNameDefCap] проводит мобилизацию"
 DOD_hungary.54.desc:0 "В ответ на наши военные приготовления, [ROM.GetLeader] Подписал приказ No. 1, поставив на [ROM.GetAdjective] Военные на высокой боевой готовности. The [ROM.GetAdjective] Военно-воздушные силы заняли свои военные станции, а их бойцы вовлекли наших в имитацию собачьих боев. The [ROM.GetAdjective] Посол запросил у него паспорт. Пока не было сделано ни одного выстрела, но вопрос лишь в том, когда этот кризис разразится войной.\n\nНаши послы в [ENG.GetNameDef], [FRA.GetNameDef]и [GER.GetNameDef] Они сообщают о лихорадочной активности в своих соответствующих зарубежных офисах, что указывает на то, что эти страны могут быть заинтересованы в назревающем кризисе. Если мы хотим решить эту проблему силой, мы должны нанести быстрый удар."
 DOD_hungary.54.a:0 "Ситуация выходит из-под контроля."
 DOD_hungary.54.b:0 "Значит, будет война."
 DOD_hungary.54.c:0 "Предложить беспристрастное посредничество."
 DOD_hungary.55.t:0 "Выбор посредника"
 DOD_hungary.55.desc:0 "Несмотря на крайнюю напряжённость, вопрос всё ещё можно решить дипломатическим путём. Другая сторона связалась с нами по неофициальным каналам и дала понять, что не обязательно выступит против комиссии из незаинтересованных стран, которая разрешит спор. К кому нам обратиться, чтобы представить свои доводы?"
 DOD_hungary.55.a:0 "Обратиться к [GER.GetNameDef]"
 DOD_hungary.55.b:0 "Обратиться к [ENG.GetNameDef]"
 DOD_hungary.55.d:0 "Обратиться к [FRA.GetNameDef]"
 DOD_hungary.55.c:0 "Обратиться к [SOV.GetNameDef]"
 DOD_hungary.55.e:0 "Обратиться к [ITA.GetNameDef]"
 DOD_hungary.55.f:1 "Никто не желает выслушать наши доводы."
 DOD_hungary.57.t:0 "[HUN.GetNameDefCap] отступает"
 DOD_hungary.57.desc:0 "Несмотря на жесткую риторику, исходящую из Будапешта, [HUN.GetAdjective] Силы вблизи границы отступили. Нарушения нашего воздушного пространства прекратились. Похоже, что [HUN.GetLeader] Он хочет, чтобы это было как можно тише, и в министерстве иностранных дел есть консенсус, что ему следует позволить это сделать. Жест примирения — это небольшая цена, которую нужно заплатить, когда мы так узко избегаем войны."
 DOD_hungary.57.a:0 "Триумф."
 DOD_hungary.58.t:0 "[HUN.GetNameDefCap] ищет посредничества"
 DOD_hungary.58.desc:0 "Поскольку ситуация на Балканах стремительно движется к полномасштабной войне, [HUN.GetNameDef] решила обратиться за посредничеством в трансильванском споре. Нас попросили войти в комиссию, которая определит судьбу Трансильвании. Они полагают, что на предстоящей конференции мы выступим в их поддержку."
 DOD_hungary.58.a:0 "Мы с радостью согласимся."
 DOD_hungary.58.b:0 "Представлять их интересы нам невыгодно."
 DOD_hungary.59.t:0 "[ROM.GetNameDefCap] ищет посредничества"
 DOD_hungary.59.desc:0 "Столкнувшись с растущим давлением со стороны [HUN.GetNameDef], [ROM.GetNameDef] предложила создать беспристрастную комиссию для разрешения спора о Трансильвании. Нас спросили, готовы ли мы войти в эту комиссию. Несомненно, они считают, что мы защитим их притязания на этот регион."
 DOD_hungary.59.a:0 "Разумеется, защитим."
 DOD_hungary.59.b:0 "Мы не заинтересованы в их защите."
 DOD_hungary.60.t:0 "Балканский кризис"
 DOD_hungary.60.desc:0 "За последние несколько дней напряжённые отношения между [HUN.GetNameDef] и [ROM.GetNameDef] окончательно разрушились. [HUN.GetNameDefCap] потребовала от [ROM.GetNameDef] передать ей спорные территории Трансильвании. [ROM.GetNameDefCap] ответила отказом. Обе стороны уже мобилизовали свои войска, и война в регионе кажется неизбежной.\n\nМинистерство иностранных дел считает, что нам необходимо подготовить интервенцию для защиты своих интересов в регионе. Возможно также, что одной угрозы нашего вмешательства хватит, чтобы вернуть другую сторону за стол переговоров."
 DOD_hungary.60.a:0 "Нам следует поддержать [HUN.GetNameDef]."
 DOD_hungary.60.b:0 "Нам следует поддержать [ROM.GetNameDef]."
 DOD_hungary.60.c:0 "Очередная балканская глупость."
 DOD_hungary.61.t:0 "Балканский кризис — [From.GetNameDef] поддерживает [HUN.GetNameDef]"
 DOD_hungary.61.desc:0 "Сегодня утром, [From.GetAdjective] Посол прибыл в наше министерство иностранных дел, сообщив нам, что его правительство с серьезной озабоченностью наблюдает за нынешним кризисом. Наше решение рискнуть войной из-за Трансильвании вынудило нас пойти на это. [From.GetAdjective] Правительство рассмотрит военное вмешательство на стороне [HUN.GetNameDef]."
 DOD_hungary.61.a:0 "Мы не сможем противостоять им."
 DOD_hungary.61.b:0 "Теперь мы не можем отступить."
 DOD_hungary.61.c:0 "Запросить посредничество."
 DOD_hungary.62.t:0 "Балканский кризис — [From.GetNameDef] поддерживает [ROM.GetNameDef]"
 DOD_hungary.62.desc:0 "Наш посол в [From.GetNameDef] Он был вызван для консультаций. Во время встречи ему сообщили, что [From.GetNameDef] считает территориальную целостность [ROM.GetNameDef] быть в ее национальных интересах. В частности, нефтяные скважины Плоэсти имеют важное значение для [From.GetNameDef]. Должна ли Трансильвания упасть к нам или мы должны попытаться занять [ROM.GetNameDef] В целом, мы бы существенно поставили под угрозу поставки нефти. [From.GetAdjective] Правительство не готово пойти на риск и зашло так далеко, что пригрозило военным вмешательством. [ROM.GetNameDef] Если бы началась война."
 DOD_hungary.62.a:0 "Мы должны уступить."
 DOD_hungary.62.b:0 "Война закончится ещё до их прибытия."
 DOD_hungary.62.c:0 "Запросить посредничество."
 DOD_hungary.63.t:0 "Посредничество провалилось"
 DOD_hungary.63.desc_HUN_refused:0 "Несмотря на все наши усилия, нам не удалось заручиться поддержкой своих притязаний. Каждая страна, к которой мы обращались, отказала нам и заявила, что мы должны принять тот факт, что Трансильвания является частью [ROM.GetNameDef].\n\nНо как можно принять неприемлемое?"
 DOD_hungary.63.desc_HUN_nothing:0 "Итогом конференции по Трансильвании стала полная катастрофа. По неизвестным причинам было решено, что вся Трансильвания останется с [ROM.GetNameDef]. Хотя в окончательном договоре есть некоторые положения, которые призваны защищать права этнических меньшинств. [HUN.GetAdjective]Не может быть никаких сомнений в том, что мы потерпели полный дипломатический разгром."
 DOD_hungary.63.a:0 "Нас предали все!"
 DOD_hungary.63.b:0 "Мы вернём свои земли или погибнем, пытаясь это сделать!"
 DOD_hungary.64.t:0 "Посредничество провалилось"
 DOD_hungary.64.desc_ROM_refused:0 "Мы всеми силами пытались заручиться поддержкой, но, похоже, в наши дни мало кто готов защищать порядок, созданный Версальским и Трианонским договорами. Когда вокруг хозяйничают такие агрессоры, как [HUN.GetLeader], значение имеет только сила."
 DOD_hungary.64.desc_ROM_nothing:0 "Похоже, договоры и международные обычаи больше ничего не значат. Конференция по Трансильвании постановила передать [HUN.GetNameDef] все спорные территории. Вся государственная служба всё ещё не оправилась от потрясения, но мы должны принять решение: смириться с этим чудовищным исходом или сражаться?"
 DOD_hungary.64.a:0 "Чёрный день."
 DOD_hungary.64.b:0 "Мы ещё можем сражаться."
 DOD_hungary.65.t:0 "[HUN.GetNameDefCap] отказывается принять результаты посредничества"
 DOD_hungary.65.desc:0 "Сообщая о результатах арбитража на спорных территориях, [HUN.GetLeader] отказался принять их. По его словам, все меньше, чем полное восстановление старых границ. [HUN.GetNameDef] Это считается оскорблением для каждого. [HUN.GetAdjective]Живой или мертвый.\n\nОн пошел еще дальше, заявив, что время для переговоров и дипломатии прошло и что есть только один способ, которым он теперь может урегулировать этот вопрос.\n\nThe [ROM.GetAdjective] Правительство спросило, где мы находимся в этом споре, учитывая, что мы согласились поддержать их ранее."
 DOD_hungary.65.a:0 "Наше предложение не заходило настолько далеко."
 DOD_hungary.65.b:0 "The [HUN.GetAdjective]s должны быть остановлены, прежде чем они подчинят себе весь регион."
 DOD_hungary.66.t:0 "[ROM.GetNameDefCap] отказывается принять результаты посредничества"
 DOD_hungary.66.desc:0 "Условия договора, согласованные на недавней конференции, не были приняты Советом Безопасности. [ROM.GetAdjective] правительство.[ROM.GetLeader] Сообщается, что он даже не прочитал весь документ, прежде чем разорвать его и объявить, что он скорее отрежет руку, чем подпишет что-либо это унизительное.\n\nThe [HUN.GetAdjective] Правительство объявило, что оно полностью готово бороться за то, что было объявлено им, но они также спросили, где мы находимся в этом конфликте."
 DOD_hungary.66.a:0 "Желаем им победы."
 DOD_hungary.66.b:0 "Мы готовы оказать им поддержку."
 DOD_hungary.67.t:0 "Переговоры сорваны"
 DOD_hungary.67.desc:0 "Переговоры между великими державами полностью провалились, поскольку сторонам не удалось найти никаких точек соприкосновения. Взаимно неприемлемые требования сорвали все попытки достичь компромисса. Делегации вернулись на родину, оставив вопрос нерешённым."
 DOD_hungary.67.a:0 "Его решат огонь, кровь и сталь."
 DOD_hungary.68.t:0 "Трансильванский арбитраж"
 DOD_hungary.68.desc:0 "Обе стороны обратились к нам, чтобы мы решили, кому достанется Трансильвания. Министерство иностранных дел подготовило следующую справку:\n\n\"В нынешней ситуации было бы неразумно присуждать всю Трансильванию одной стороне. Чтобы не оскорбить одну из сторон настолько, что она отвергнет урегулирование, следует предпочесть компромиссное решение — непопулярное, но приемлемое для обеих сторон.\""
 DOD_hungary.68.a:0 "Передать всю Трансильванию [HUN.GetNameDef]."
 DOD_hungary.68.b:0 "Передать Северную Трансильванию [HUN.GetNameDef]."
 DOD_hungary.68.c:0 "Трансильвания остаётся у [ROM.GetNameDef]."
 DOD_hungary.69.t:0 "Трансильванский компромисс"
 DOD_hungary.69.desc:0 "После долгих часов переговоров стороны, похоже, близки к соглашению. Плохая новость состоит в том, что нам придётся уступить часть территории [HUN.GetNameDef]. Северная часть Трансильвании отойдёт им, а южные области останутся у нас. Это не тот исход, на который мы надеялись, но трезвая оценка ситуации показывает, что лучшего результата добиться невозможно."
 DOD_hungary.69.a:0 "Приемлемый исход. Едва ли."
 DOD_hungary.69.b:0 "Мы не уступим ни пяди земли!"
 DOD_hungary.70.t:0 "Трансильванский компромисс"
 DOD_hungary.70.desc:0 "В ранние утренние часы делегациям на конференции удалось достичь компромисса. В соответствии с этими условиями мы получим Северную Трансильванию, в то время как южные части области останутся на юге. [ROM.GetNameDef]. The [ROM.GetAdjective] Делегация уже согласилась с этим. Министерство иностранных дел предупреждает, что непринятие этого предложения изолирует нас дипломатическим путем."
 DOD_hungary.70.a:0 "Это лучшее, на что мы могли рассчитывать."
 DOD_hungary.71.t:0 "Трансильванская конференция — день 1"
 DOD_hungary.71.desc:0 "В отсутствие дипломатического протокола делегации [HUN.GetNameDef], [ROM.GetNameDef]и [ROM_mediator.GetNameDef] Мы договорились обсудить этот вопрос. Было решено, что в качестве представителей [HUN.GetAdjective] Мы можем сделать первое предложение."
 DOD_hungary.71.a:0 "Передать всю Трансильванию [HUN.GetNameDef]."
 DOD_hungary.71.b:0 "Передать Северную Трансильванию [HUN.GetNameDef]."
 DOD_hungary.71.c:0 "Трансильвания остаётся у [ROM.GetNameDef]."
 DOD_hungary.72.t:0 "Трансильванская конференция — день 2"
 DOD_hungary.72.desc_HUN_all:0 "The [HUN.GetAdjective] Сторона представила нам предложение по урегулированию надвигающегося кризиса. Неудивительно, что они потребовали, чтобы вся Трансильвания была передана [HUN.GetNameDef] Как можно скорее. Мы можем принять это предложение, но оно, несомненно, огорчит нас. [ROM.GetAdjective] союзники.\n\nМы также можем сделать встречное предложение. Наш главный дипломат решительно предлагает последнее. Компромиссное решение, возможно, было бы более приемлемым для обеих сторон."
 DOD_hungary.72.desc_compromise:0 "The [HUN.GetAdjective] Сторона представила нам предложение по урегулированию надвигающегося кризиса. В их предложении мы бы отдали северную часть Трансильвании [HUN.GetNameDef]Южная часть останется с [ROM.GetNameDef].\n\nНаш главный дипломат считает, что это показывает, что [HUN.GetAdjective] У нас холодные ноги, и мы должны настаивать на еще лучших условиях."
 DOD_hungary.72.desc_HUN_nothing:0 "The [HUN.GetAdjective] Сторона на удивление предложила примирительные условия. Трансильвания останется с [ROM.GetNameDef] В обмен на небольшие уступки этническим меньшинствам. The [ROM.GetAdjective] Представитель настоятельно призывает нас принять это предложение, обещая, что размещение будет перенесено в течение нескольких дней, если будет согласовано."
 DOD_hungary.72.a:0 "Принять предложение."
 DOD_hungary.72.b:0 "Добиваться лучших условий."
 DOD_hungary.73.t:0 "Трансильванская конференция — день 3"
 DOD_hungary.73.desc:0 "Поскольку мы решили отклонить предложение [HUN.GetADjective], теперь нам предстоит предложить иные условия."
 DOD_hungary.73.a:0 "Передать всю Трансильванию государству [HUN.GetNameDef]."
 DOD_hungary.73.b:0 "Передать Северную Трансильванию государству [HUN.GetNameDef]."
 DOD_hungary.73.c:0 "Трансильвания остаётся у государства [ROM.GetNameDef]."
 DOD_hungary.74.t:0 "Трансильванская конференция — день 4"
 DOD_hungary.74.desc_HUN_all:0 "Сторона [ROM.GetAdjective] испытывает огромное беспокойство и стремится как можно скорее завершить этот вопрос. Они отвергли наше предыдущее примирительное предложение и вместо этого предложили передать всю Трансильванию государству [HUN.GetNameDef]. В ходе закрытого обсуждения наши делегации не смогли понять, почему они сделали такое предложение, однако, похоже, оно искреннее. Нам следует его принять."
 DOD_hungary.74.desc_compromise:0 "Представители [ROM.GetAdjective] предложили компромиссное решение — разделить Трансильванию надвое. Учитывая напряжённость между двумя странами, это может быть лучшим выходом."
 DOD_hungary.74.desc_HUN_nothing:0 "Неудивительно, что сторона [ROM.GetAdjective] не уступила в вопросе Трансильвании. Похоже, они твёрдо намерены сохранить всю Трансильванию в составе государства [ROM.GetNameDef]. На этом этапе переговоров мы почти ничего не можем сделать — либо принять их предложение, либо покинуть конференцию."
 DOD_hungary.74.a:0 "Мы согласны."
 DOD_hungary.74.b:0 "Ответственность за последствия этого провала лежит на них!"
 DOD_hungary.75.a:0 "Мы сделали всё, что могли."
 DOD_hungary.80.t:0 "[HUN.GetNameDefCap] требует Южную Словакию"
 DOD_hungary.80.desc:0 "Правительство [HUN.GetAdjective] обратилось к нам с требованием передать ему Южную Словакию, заявив, что проживающие там венгры подвергаются притеснениям. В то же время при попытке пересечь границу государства [HUN.GetNameDef] были арестованы члены террористической группы под названием «Оборванная гвардия». Хотя эти люди утверждают, что никак не связаны с правительством [HUN.GetAdjective], при них обнаружили снаряжение с официальной маркировкой [HUN.GetAdjective].\n\nВ воздухе пахнет войной, но мы ещё можем добиться дипломатического решения, если заручимся поддержкой крупной державы."
 DOD_hungary.80.a:0 "Нам не победить в войне. Отдадим территорию."
 DOD_hungary.80.b:0 "Обратимся к нашим союзникам."
 DOD_hungary.80.c:0 "Обратимся к государству [GER.GetNameDef]."
 DOD_hungary.80.d:0 "Мы не позволим собой помыкать!"
 DOD_hungary.81.t:0 "[From.GetNameDefCap] возвращает Южную Словакию"
 DOD_hungary.81.desc:0 "[From.GetNameDefCap] уступило Южную Словакию и отвело войска за демаркационную линию. Теперь мы полностью контролируем этот регион."
 DOD_hungary.81.a:0 "Хорошо."
 DOD_hungary.82.t:0 "[CZE.GetNameDefCap] просит о помощи"
 DOD_hungary.82.desc:0 "Посол государства [CZE.GetNameDef] обратился к нам с настоятельной просьбой о помощи. Недавно государство [HUN.GetNameDef] развернуло масштабную кампанию по дестабилизации Южной Словакии. Их цель очевидна — создать предлог для вторжения под видом защиты людей, которых они считают своими гражданами.\n\nПравительство [CZE.GetAdjective] попросило нашей поддержки в этом вопросе."
 DOD_hungary.82.a:0 "Они её получат."
 DOD_hungary.82.b:0 "Это не наша война."
 DOD_hungary.83.t:0 "[SLO.GetNameDefCap] просит о помощи"
 DOD_hungary.83.desc:0 "В последнее время государство [SLO.GetNameDefCap] подвергается сильному давлению со стороны государства [HUN.GetNameDef], требующего вернуть районы на южной границе, некогда принадлежавшие Венгрии. Правительство [HUN.GetAdjective] дало понять, что при необходимости готово сражаться за них.\n\nМы не можем допустить, чтобы в этом регионе из-за столь незначительного вопроса вспыхнула война, и должны настаивать на дипломатическом решении."
 DOD_hungary.83.a:0 "Скажите государству [HUN.GetNameDef], что оно может действовать."
 DOD_hungary.83.b:0 "Скажите государству [HUN.GetNameDef], чтобы оно отступило."
 DOD_hungary.84.t:0 "[From.GetNameDefCap] отказывает"
 DOD_hungary.84.desc:0 "[From.GetNameDefCap] отказалось даже обсуждать наши требования, настаивая, что эта территория всегда была частью государства [From.GetNameDef] и будет защищаться «до последнего человека, до последней пули, до последнего вздоха»."
 DOD_hungary.84.a:0 "Наш шанс ещё представится, но не сейчас."
 DOD_hungary.84.b:0 "Тогда исполним их желание."
 DOD_hungary.85.t:0 "[From.GetNameDefCap] выносит предупреждение по поводу Южной Словакии"
 DOD_hungary.85.desc:0 "Правительство государства [From.GetNameDef] уведомило нас, что территориальная целостность Словакии не подлежит обсуждению. Оно также потребовало вывести из региона все регулярные и нерегулярные силы, иначе нам придётся столкнуться с последствиями."
 DOD_hungary.85.a:0 "Вот и вся идея национального самоопределения."
 DOD_hungary.85.b:0 "Мы возьмём то, что принадлежит нам."
 DOD_hungary.86.t:0 "[From.GetNameDefCap] отказывается нас поддержать"
 DOD_hungary.86.desc:0 "Правительство [From.GetAdjective] отклонило нашу просьбу о поддержке перед лицом неприкрытой агрессии [HUN.GetAdjective]. Хотя оно сочувствует нашему делу, оно не готово рисковать ради его защиты ни кровью, ни богатствами."
 DOD_hungary.86.a:0 "Одними тёплыми словами войну не выиграть."
 DOD_hungary.86.b:0 "Тогда мы будем сражаться в одиночку."
 DOD_hungary.90.t:0 "[HUN.GetNameDefCap] требует Воеводину"
 DOD_hungary.90.desc:0 "Правительство [HUN.GetAdjective] усилило давление в вопросе Воеводины, заявив, что во времена империи она входила в состав Венгрии и потому должна быть возвращена. Оно утверждает, что объединение с Сербией после Великой войны было «недействительным из-за внешнего давления», а следовательно, с юридической точки зрения эта территория по-прежнему принадлежит [HUN.GetAdjective]."
 DOD_hungary.90.a:0 "В этом конфликте нам не победить."
 DOD_hungary.90.b:0 "Мы не станем поддерживать их бредни."
 DOD_hungary.91.t:0 "[YUG.GetNameDefCap] передаёт Воеводину"
 DOD_hungary.91.desc:0 "\n[YUG.GetNameDefCap] согласилось уступить нам Воеводину. Наши войска полностью взяли её под контроль."
 DOD_hungary.91.a:0 "Хорошо."
 DOD_hungary.92.t:0 "[From.GetNameDefCap] отклоняет наши требования"
 DOD_hungary.92.desc:0 "На напряжённой встрече с [YUG.GetLeader] нашей делегации заявили, что суверенитет Воеводины не подлежит обсуждению. В любом случае правительство [YUG.GetAdjective] никогда не уступит такому давлению. Жители Воеводины высказались ещё в 1919 году и решили остаться в составе государства [YUG.GetNameDef]. С точки зрения правительства [YUG.GetAdjective], вопрос на этом закрыт."
 DOD_hungary.92.a:0 "Возможно, так и есть."
 DOD_hungary.92.b:0 "Попросить поддержки у государства [GER.GetNameDef]."
 DOD_hungary.92.c:0 "Попросить поддержки у государства [ITA.GetNameDef]."
 DOD_hungary.92.d:0 "Обратиться к государствам [GER.GetNameDef] и [ITA.GetNameDef]."
 DOD_hungary.92.e:0 "Мы доведём дело до конца сами."
 DOD_hungary.93.t:0 "[HUN.GetNameDefCap] предлагает переустроить Югославию"
 DOD_hungary.93.desc:0 "На встрече в Цюрихе представители правительства [HUN.GetAdjective] осторожно выяснили наше отношение к совместным действиям против государства [YUG.GetNameDef]. Правительство [YUG.GetAdjective] отказалось выполнить требования [HUN.GetAdjective] о возвращении территорий, присоединённых государством [YUG.GetNameDef] после Великой войны. Поскольку у нас тоже есть спорные территории с государством [YUG.GetNameDef], мы могли бы объединить силы и предъявить жёсткий ультиматум, но это может вынудить нас начать войну."
 DOD_hungary.93.a:0 "Они получат нашу полную поддержку."
 DOD_hungary.93.b:0 "Мы не станем вмешиваться в это дело."
 DOD_hungary.94.t:0 "[From.GetNameDefCap] предлагает поддержку против государства [YUG.GetNameDef]"
 DOD_hungary.94.desc:0 "\nЗакулисные переговоры с государством [From.GetNameDef] привели к принципиальному соглашению о том, что государство [YUG.GetNameDef] следует либо полностью расчленить, либо по меньшей мере значительно уменьшить.\n\nЗаручившись поддержкой новых покровителей, теперь мы можем вести переговоры с правительством [YUG.GetAdjective] с позиции подавляющей силы. Мы также можем решить вопрос силой, пока армия [YUG.GetAdjective] ещё не готова."
 DOD_hungary.94.a:0 "Отправить ультиматум в Белград!"
 DOD_hungary.94.b:0 "Нанести удар сейчас!"
 DOD_hungary.95.t:0 "[From.GetNameDefCap] отклоняет наше предложение"
 DOD_hungary.95.desc:0 "\nПосле нескольких раундов переговоров нам так и не удалось достичь соглашения с правительством [From.GetAdjective] по вопросу переустройства государства [YUG.GetNameDef]. В ноте, подписанной лично [From.GetLeader], говорится, что все нерешённые территориальные вопросы будут урегулированы на двусторонней основе, «когда того потребует ситуация»."
 DOD_hungary.95.a:0 "Жаль."
 DOD_hungary.95.b:0 "Тогда мы справимся сами!"
 DOD_hungary.96.t:0 "Ультиматум из Будапешта"
 DOD_hungary.96.desc_HUN_GER:0 "Вместо разрядки обстановки наш решительный ответ на последние требования [HUN.GetAdjective] по поводу Воеводины привёл к заключению пакта между государствами [HUN.GetNameDef] и [GER.GetNameDef]. В недавней речи [GER.GetLeader] назвал Словению «одной из старых, всё ещё не возвращённых провинций Рейха», которую следует как можно скорее вернуть. Послы [HUN.GetAdjective] и [GER.GetAdjective] вручили нам совместную ноту с требованием немедленно передать Воеводину и Словению под их контроль."
 DOD_hungary.96.desc_HUN_ITA:0 "Вместо разрядки обстановки наш решительный ответ на последние требования [HUN.GetAdjective] по поводу Воеводины привёл к заключению пакта между государствами [HUN.GetNameDef] и [ITA.GetNameDef]. В недавней речи [ITA.GetLeader] назвал Далмацию «неосвобождённым дальним берегом Адриатики». Послы [HUN.GetAdjective] и [ITA.GetAdjective] вручили нам совместную ноту с требованием немедленно передать Воеводину и Далмацию под их контроль."
 DOD_hungary.96.desc_HUN_both:0 "Наш отказ подчиниться требованиям [HUN.GetAdjective] не заставил Будапешт изменить позицию. К яростной риторике из столицы [HUN.GetAdjective] теперь добавились столь же тревожные заявления из Рима и Берлина. Обе страны выразили поддержку позиции [HUN.GetAdjective], одновременно выдвинув собственные требования. Послы трёх государств вместе явились в Министерство иностранных дел и официально вручили ноту с требованием передать Воеводину, Словению и Далмацию соответствующим претендентам."
 DOD_hungary.96.a:0 "У нас нет выбора, кроме как согласиться."
 DOD_hungary.96.b:0 "Лучше погибнуть в бою!"
 DOD_hungary.97.t:0 "[YUG.GetNameDefCap] проявляет непокорность"
 DOD_hungary.97.desc:0 "Несмотря на подавляющее превосходство противника, правительство [YUG.GetAdjective] отказалось внять доводам разума и заявило нашим представителям, что армия [YUG.GetAdjective] хорошо подготовлена и готова отразить попытку военного решения."
 DOD_hungary.97.a:0 "Значит, будет война."
 DOD_hungary.100.t:0 "[HUN.GetNameDefCap] требует Словакию"
 DOD_hungary.100.desc:0 "Правительство [HUN.GetAdjective] обратилось к нам по поводу будущего статуса Словакии. Оно твёрдо убеждено, что должно полностью распоряжаться судьбой Словакии, поскольку во времена империи та входила в состав Венгрии.\n\nХотя делегация [HUN.GetAdjective] избегала прямых угроз, наша разведка сообщает о тревожно высокой активности в армии [HUN.GetAdjective]."
 DOD_hungary.100.a:0 "У нас нет выбора."
 DOD_hungary.100.b:0 "Мы не уступим ни пяди."
 DOD_hungary.101.t:0 "Словакия передана"
 DOD_hungary.101.desc:0 "Словакия вернулась под наш контроль. Теперь предстоит решить, как её организовать. Многие в правительстве выступают за прямую аннексию, называя её «возвращением к историческим границам», но другие опасаются последствий попытки интегрировать в нашу страну столь большое число невенгров. Они предпочли бы создать в Братиславе автономное правительство, обладающее некоторыми полномочиями во внутренней политике, но во всех остальных вопросах тесно связанное с нами."
 DOD_hungary.101.a:0 "Мы вернёмся к старым границам."
 DOD_hungary.101.b:0 "Марионеточное правительство предпочтительнее."
 DOD_hungary.102.t:0 "[From.GetNameDefCap] отказывается передать Словакию"
 DOD_hungary.102.desc:0 "Переговоры о передаче Словакии почти сразу зашли в тупик. Делегация [From.GetAdjective] заявила, что выступает за сохранение статус-кво и не предлагает никаких существенных изменений. Наша делегация, разумеется, вновь подчеркнула, что мы считаем Словакию своей территорией, незаконно захваченной после Великой войны.\n\nПрогресса достичь не удалось, а растущее раздражение по обе стороны стола делает его маловероятным и в дальнейшем."
 DOD_hungary.102.a:0 "Оставить этот вопрос."
 DOD_hungary.102.b:0 "Предложить государству [GER.GetNameDef] разделить страну."
 DOD_hungary.103.t:0 "[HUN.GetNameDefCap] хочет разделить государство [CZE.GetNameDef]"
 DOD_hungary.103.desc:0 "Правительство [HUN.GetAdjective] предложило нам разделить государство [CZE.GetNameDef]. Мы получим западные районы страны, а государство [HUN.GetNameDef] — большую часть Словакии; демаркационная линия между нашими владениями пройдёт примерно через середину страны.\n\nОни заверили нас, что готовы позволить нам сделать первый шаг, если в конечном итоге получат свою долю."
 DOD_hungary.103.a:0 "Мы учтём их интересы."
 DOD_hungary.103.b:0 "Они не получат ничего."
 germany.55.do:0 "Сдержать обещание, данное государству [HUN.GetNameDef]."
 DOD_hungary.104.t:0 "[GER.GetLeader] соглашается"
 DOD_hungary.104.desc:0 "В секретной телеграмме правительство [GER.GetAdjective] заверило нас, что наши интересы будут учтены при решении судьбы государства [CZE.GetNameDef]. Когда именно это произойдёт, пока неизвестно."
 DOD_hungary.104.a:0 "Хорошо."
 DOD_hungary.105.t:0 "[GER.GetNameDefCap] отказывается делить государство [CZE.GetName]"
 DOD_hungary.105.desc:0 "\nУслышав наше предложение разделить государство [CZE.GetNameDef], [From.GetLeader], как сообщается, пришёл в ярость и назвал нас «пережитком прошлого, не имеющим ни малейшего представления о реалиях мира».\n\nНаше предложение не было принято."
 DOD_hungary.105.a:0 "Какая грубость."
 DOD_hungary.105.b:0 "Мы возьмём то, что принадлежит нам."
 DOD_hungary.106.t:0 "[From.GetLeader] нарушает обещание"
 DOD_hungary.106.desc:0 "Несмотря на письменное обещание [From.GetLeader], правительство [GER.GetAdjective] не выполнило своих обязательств перед нами. В недавних переговорах о судьбе государства [CZE.GetNameDef] нам не отвели никакой роли, кроме инструмента давления на других. Похоже, [From.GetLeader] никогда не собирался держать слово."
 DOD_hungary.106.a:0 "Выразить самый решительный протест."
 DOD_hungary.106.b:0 "Мобилизовать армию."
 DOD_hungary.107.t:1 "[HUN.GetNameDef] требует признать верховенство"
 DOD_hungary.107.desc_SLO_independent:0 "После нескольких недель лихорадочной активности в армии [HUN.GetAdjective] [HUN.GetLeader] издал прокламацию, объявив, что нынешняя ситуация в Словакии вызывает серьёзную обеспокоенность государства [HUN.GetNameDef], и потребовал от нас определённых гарантий.\n\nПомимо прочего, мы должны будем консультироваться с ними перед вступлением в любые союзы или подписанием договоров, а также принять военную миссию для координации наших вооружённых сил."
 DOD_hungary.107.desc_SLO_puppet:0 "Делегация [HUN.GetAdjective] прибыла для обсуждения вопроса Словакии. Они считают эту страну частью своей исторической сферы влияния и крайне обеспокоены нашим воздействием на словацкую политику.\n\nГлава делегации дошёл до утверждения, что территория Словакии может быть использована как плацдарм для вторжения в государство [HUN.GetNameDef].\n\nОни предлагают разрешить правительству [HUN.GetAdjective] оказывать на Словакию влияние, сопоставимое с нашим нынешним."
 DOD_hungary.107.a:0 "Хорошо."
 DOD_hungary.107.b:0 "Об этом не может быть и речи."
 DOD_hungary.108.t:0 "Словакия под нашим контролем"
 DOD_hungary.108.desc:0 "Наш полномочный представитель обосновался в Братиславе и следит за тем, чтобы словацкое правительство тесно согласовывало свою политику с нашей."
 DOD_hungary.108.a:0 "Хорошо."
 DOD_hungary.109.t:0 "В контроле над Словакией отказано"
 DOD_hungary.109.desc:0 "Несмотря на все наши усилия, правительство Словакии отказалось признать своё подчинённое положение по отношению к нам. Теперь мы должны рассмотреть возможность военных действий, чтобы обезопасить нашу северную границу."
 DOD_hungary.109.a:0 "Мы получим её — так или иначе."
 DOD_hungary.110.t:0 "[HUN.GetNameDefCap] хочет оказать давление на [ROM.GetNameDef]"
 DOD_hungary.110.desc:0 "[HUN.GetLeader] Он прибыл в Москву, чтобы обсудить вопрос [ROM.GetNameDef]. После Великой войны, [ROM.GetNameDef] Незаконно захватили несколько территорий, в том числе Бессарабию и Трансильванию. Наш [HUN.GetAdjective] Товарищи, мы оказываем давление. [ROM.GetNameDef] вернуть эти территории их законным владельцам."
 DOD_hungary.110.a:0 "Превосходное предложение, товарищи!"
 DOD_hungary.110.b:0 "Не сейчас."
 DOD_hungary.111.t:0 "Коммунистический ультиматум"
 DOD_hungary.111.desc:0 "Правительства [HUN.GetNameDef] и [SOV.GetNameDef] направили совместную ноту, в которой заявили, что считают нашу аннексию Трансильвании и Бессарабии незаконной. По их мнению, эти территории находятся под незаконной оккупацией, и нам предоставляют последнюю возможность вывести оттуда войска."
 DOD_hungary.111.a:0 "У нас нет выбора."
 DOD_hungary.111.b:0 "Возможно, мы сможем найти компромисс."
 DOD_hungary.111.c:0 "Коммунистическое правительство могло бы добиться лучших результатов."
 DOD_hungary.111.d:0 "Эти земли священны!"
 DOD_hungary.112.t:0 "[SOV.GetLeader] отвергает наше предложение"
 DOD_hungary.112.desc:0 "Во время недавней поездки в Москву [HUN.GetLeader] был вынужден выдержать несколько изнурительных часов переговоров с [SOV.GetLeader], который неоднократно называл его идиотом за столь ошибочную инициативу. По его словам, мы ещё не до конца поняли роль национальной территории в революционной борьбе и потому пришли к неверным выводам о нашей дальнейшей стратегии."
 DOD_hungary.112.a:0 "Мы продолжим действовать самостоятельно."
 DOD_hungary.112.b:0 "Мы учтём свои ошибки."
 DOD_hungary.113.t:0 "[ROM.GetAdjective] Предлагает компромисс"
 DOD_hungary.113.desc:0 "The [ROM.GetAdjective] Правительство под [ROM.GetLeader] Она направила в Москву делегацию для обсуждения вопроса о спорных территориях. Они считают, что могут прийти к компромиссному решению, когда они откажутся от одной части спорных областей, чтобы удержать другую. Если мы согласны, то какую часть мы должны требовать?"
 DOD_hungary.113.a:0 "Заставить их отказаться от Трансильвании."
 DOD_hungary.113.b:0 "Заставить их отказаться от Бессарабии."
 DOD_hungary.113.c:0 "Повторить наше первоначальное предложение в более жёсткой форме."
 DOD_hungary.114.t:0 "[ROM.GetNameDefCap] предлагает политические уступки"
 DOD_hungary.114.desc:0 "Неожиданным шагом [ROM.GetLeader] предложил разделить власть с Румынской коммунистической партией в обмен на гарантии неприкосновенности границ. Это может стать отличным способом расширить наше влияние в регионе без риска войны."
 DOD_hungary.114.a:0 "Революция неумолимо движется вперёд."
 DOD_hungary.114.b:0 "Настаивать на передаче территории."
 DOD_hungary.115.t:0 "Румыния отвергает требования"
 DOD_hungary.115.desc:0 "The [ROM.GetAdjective] Правительство отказалось вести переговоры по спорным территориям. На частной встрече, [ROM.GetAdjective] Министр иностранных дел зашел так далеко, что сказал нашему послу, что единственный способ получить эти земли - это пожертвовать миллионом человек."
 DOD_hungary.115.a:0 "Оно того не стоит."
 DOD_hungary.115.b:0 "Настаивать на передаче территории."
 DOD_hungary.115.c:0 "Что ж, они получат свой миллион."
 DOD_hungary.116.t:0 "[SOV.GetLeader] отвечает на предложение"
 DOD_hungary.116.desc_transylvania:0 "После встречи с нашей делегацией [SOV.GetLeader] предложил нам своего рода компромисс. [SOV.GetNameDefCap] в принципе согласен, что Бессарабия должна остаться у нас, однако «независимая пограничная комиссия», составленная из представителей [SOV.GetNameDef] и [TAN.GetNameDef], постановила передать большую часть Трансильвании государству [HUN.GetNameDef]."
 DOD_hungary.116.desc_bessarabia:0 "После встречи с нашей делегацией, [SOV.GetLeader] Он предложил нам своего рода компромисс. С этим [HUN.GetAdjective] В частности, отсутствующая делегация [SOV.GetAdjective]Сказал нам, что они готовы отказаться от трансфера Трансильвании, если мы согласимся отдать им Бессарабию."
 DOD_hungary.116.desc_no_deal:0 "В ходе встречи с нашей делегацией [SOV.GetAdjective]-[HUN.GetAdjective] Стороны подтвердили свои требования. Если Бессарабия и Трансильвания не будут переданы их соответствующим заявителям, они рассмотрят вопрос о военных мерах."
 DOD_hungary.116.a:0 "Приемлемо."
 DOD_hungary.116.b:0 "Мы никогда не согласимся на такие условия!"
 DOD_hungary.117.t:0 "[SOV.GetLeader] принимает предложение"
 DOD_hungary.117.desc:0 "The [SOV.GetAdjective]Они приняли наше предложение возложить ответственность за это на коммунистов.[SOV.GetLeader] Мы лично заверили нашу делегацию в том, что никаких дальнейших территориальных претензий к нам не будет, по крайней мере, со стороны Коминтерна."
 DOD_hungary.117.a:0 "Мы ему это припомним."
 DOD_hungary.118.t:0 "[SOV.GetAdjective]s Back Down скачать"
 DOD_hungary.118.desc:0 "Наш решительный ответ [SOV.GetAdjective]-[HUN.GetAdjective] Агрессия, похоже, принесла свои плоды. «Правда» недавно опубликовала основную статью, в которой выступила против «антисоциалистических ревизионистских претензий», особо отметив вопросы претензий к Бессарабии и Трансильвании как «империалистическое поведение, которым не занимаются развитые социалистические страны мира».\n\nТем не менее, реакция в Будапеште была очень сдержанной. Возможно, что [HUN.GetLeader] На наших территориях до сих пор есть проекты."
 DOD_hungary.118.a:0 "Пусть только попробуют."
 DOD_hungary.120.t:0 "[HUN.GetNameDefCap] предлагает поддержать [CZE.GetNameDef]"
 DOD_hungary.120.desc:0 "[HUN.GetLeader] прибыл в Москву с предложением совместно гарантировать безопасность [CZE.GetNameDef] в обмен на снятие ограничений с Коммунистической партии и передачу Южной Словакии под суверенитет [HUN.GetNameDef]."
 DOD_hungary.120.a:0 "Отличная идея."
 DOD_hungary.120.b:0 "Зачем нам вмешиваться в империалистические войны?"
 DOD_hungary.121.t:0 "Коминтерн предлагает гарантии"
 DOD_hungary.121.desc:0 "Послы [HUN.GetNameDef] и [SOV.GetNameDef] обратились к нам с совместным предложением гарантировать наши границы от любой внешней агрессии. Взамен мы должны обеспечить коммунистам места в правительстве. Кроме того, [HUN.GetNameDefCap] поставила своё участие в зависимость от возвращения Южной Словакии под её контроль."
 DOD_hungary.121.a:0 "Приемлемая цена."
 DOD_hungary.121.b:0 "Именно от таких требований нам и приходится защищаться!"
 DOD_hungary.122.t:0 "[CZE.GetNameDefCap] отвергает наше предложение"
 DOD_hungary.122.desc:0 "Наше предложение гарантии не было встречено с большим энтузиазмом. [CZE.GetAdjective]s. Политические уступки, о которых мы просили, вызвали бурю негодования. [CZE.GetNameDef]Несколько видных генералов и политических деятелей угрожали уйти в отставку, если правительство согласится.\n\nСсылаясь на серьезные опасения, что поддержка может прийти к ним вовремя, [CZE.GetAdjective] Правительство официально отклонило наше предложение."
 DOD_hungary.122.a:0 "Понятная реакция."
 DOD_hungary.122.b:0 "Подойди к делу. [GER.GetAdjective]s."
 DOD_hungary.123.t:0 "[SOV.GetLeader] отвергает наше предложение"
 DOD_hungary.123.desc:0 "Стоя перед большой картой Европы, [SOV.GetLeader] прочитал нашей делегации часовую лекцию, вновь и вновь указывая на недостатки и изъяны предложенного плана и подробно рассуждая о его исключительной глупости. Он даже обвинил нас в сговоре с империалистами.\n\nНаша делегация вернулась из Москвы с пустыми руками, но хотя бы живой."
 DOD_hungary.123.a:0 "Возможно, этот план и правда был не лучшим."
 DOD_hungary.123.b:0 "Подойди к делу. [GER.GetAdjective]s."
 DOD_hungary.124.t:0 "[From.GetNameDefCap] предлагает разделить [CZE.GetNameDef]"
 DOD_hungary.124.desc:0 "The [From.GetAdjective] Министр иностранных дел прибыл в Берлин, чтобы обсудить схему разделения [CZE.GetNameDef] на две части. Любая из сторон предлагаемого договора будет иметь полный контроль над своей частью территории. Естественно, мы получим западные части Богемии и Моравии, а они - Словакию."
 DOD_hungary.124.a:0 "Интригующий план."
 DOD_hungary.124.b:0 "Мы не потерпим их вмешательства в дела наших соседей!"
 DOD_hungary.126.t:0 "[CZE.GetAdjective]s Отказаться"
 DOD_hungary.126.desc:0 "The [CZE.GetAdjective] Правительство, как сообщается, отказалось от предоставления гарантии из-за «невыносимых» уступок, запрошенных взамен.\n\nТем не менее, наш посол [SOV.GetNameDef] Сообщает о высокой активности в [SOV.GetAdjective] Министерство иностранных дел. Слухи в дипломатических кругах указывают на возможную сделку [GER.GetNameDef]."
 DOD_hungary.126.a:0 "Посмотрим."
 DOD_hungary.127.t:0 "[GER.GetNameDefCap] соглашается разделить [CZE.GetNameDef]"
 DOD_hungary.127.desc:0 "[GER.GetLeader] Подписал секретный Берлинский договор. The [GER.GetAdjective] Правительство согласилось на раскол [CZE.GetNameDef] В двух сферах интересов и обещает уважать любое решение, принятое в отношении Словакии."
 DOD_hungary.127.a:0 "Победа дипломатии."
 DOD_hungary.127.b:0 "Мы рассчитывали не на такую сделку."
 DOD_hungary.128.t:0 "[GER.GetNameDefCap] отвергает предложение"
 DOD_hungary.128.desc:0 "На встрече с нашим послом [GER.GetLeader] предельно ясно дал понять, что его правительство считает [CZE.GetNameDef] целиком своей сферой интересов. Любое вмешательство в её границы будет расценено как враждебный акт."
 DOD_hungary.128.a:0 "Грубо."
 DOD_hungary.128.b:0 "Они явно блефуют."
 DOD_hungary.129.t:0 "[GER.GetAdjective] ультиматум"
 DOD_hungary.129.desc:0 "Сегодня, [GER.GetAdjective] Посол передал ноту от [GER.GetLeader]Требуя немедленной передачи ему правительственных полномочий в качестве нового «Рейхспротектора», до прибытия специально избранного администратора из Берлина. В то же время посол потребовал, чтобы [From.From.GetNameDef] Аналогичные права предусмотрены и в отношении Словакии.\n\nЕсли мы откажемся, записка обещает \"быстрые и решительные военные действия\"."
 DOD_hungary.129.a:0 "У нас нет выбора."
 DOD_hungary.129.b:0 "Выбросить его из окна!"
 DOD_hungary.130.t:0 "[From.GetAdjective]Отказ от разговоров"
 DOD_hungary.130.desc:0 "Несмотря на первые успехи, похоже, правительство [From.GetLeader] в последний момент изменило своё решение относительно предложенного договора. Точные причины они раскрывать не желают, но наша разведка предполагает, что дело в недостаточной готовности их вооружённых сил."
 DOD_hungary.130.a:0 "Жаль."
 DOD_hungary.140.t:0 "[HUN.GetNameDefCap] требует права на перевооружение"
 DOD_hungary.140.desc:0 "Ссылаясь на постоянно ухудшающуюся политическую ситуацию в Европе и полную неспособность Лиги Наций остановить это, [HUN.GetLeader] Он публично объявил, что его правительство будет стремиться заручиться поддержкой соседних стран, чтобы разрешить пересмотр Трианонского договора. Не говоря уже о территориальных претензиях, [HUN.GetLeader] Обсуждались только ограничения на [HUN.GetAdjective] Военные.\n\nДелегация из [HUN.GetNameDef] Мы прибыли в нашу столицу, чтобы обеспечить наше официальное соглашение. [HUN.GetAdjective] перевооружение."
 DOD_hungary.140.a:0 "Им необходимо позволить защищать себя."
 DOD_hungary.140.b:0 "Они уже однажды ввергли мир в войну!"
 DOD_hungary.141.t:0 "[HUN.getNameDefCap] Защищает [From.GetAdjective] Поддержка перевооружения"
 DOD_hungary.141.desc:0 "Не посоветовавшись с нами, [From.GetAdjective] Правительство подписало договор с [HUN.GetNameDef]изменение или снятие ограничений Трианонского договора.[HUN.GetNameDefCap] Теперь разрешено свободно перевооружаться и разрабатывать все виды военной техники, включая танки и самолеты.\n\nХотя это был открытый секрет, что [HUN.GetnameDef] Это новое соглашение вскоре приведет их к тому, что они могут снова стать военной угрозой для нас."
 DOD_hungary.141.a:0 "Мы должны нанести удар, пока не стало слишком поздно!"
 DOD_hungary.141.b:0 "Выразить дипломатический протест."
 DOD_hungary.141.c:0 "Следуй за мной. [From.GetAdjective] Ведущий."
 DOD_hungary.142.t:0 "Бледское соглашение"
 DOD_hungary.142.desc:0 "Нам удалось обеспечить [From.GetAdjective] - поддержка частичного пересмотра Трианонского договора. Все ограничения в отношении наших военных сняты. Международные инспекторы по вооружениям покинули страну, а военное министерство разработало первоначальные планы скромного расширения наших вооруженных сил."
 DOD_hungary.142.a:0 "Отлично."
 DOD_hungary.143.t:0 "[From.GetNameDefCap] выражает протест"
 DOD_hungary.143.desc:0 "The [From.GetAdjective] Посол передал следующую записку:\n\"Правительство [From.GetNameDef] Наблюдает за последними событиями в [HUN.GetNameDef] с серьезной озабоченностью. Трианонский договор уже давно гарантирует мир и стабильность в регионе. Пока что [From.GetAdjective] Правительство в принципе признает, что нации должны иметь возможность выбирать свою судьбу, мы должны призвать правительство к тому, чтобы оно могло принять ее. [HUN.GetNameDef] самым решительным образом соблюдать договор. Последствия дальнейшей дестабилизации региона могут очень быстро стать неконтролируемыми»."
 DOD_hungary.143.a:0 "Молодцы."
 DOD_hungary.144.t:0 "[From.GetNameDefCap] непреклонна в вопросе перевооружения"
 DOD_hungary.144.desc:0 "Переговоры о возможном пересмотре Трианонского договора почти не продвинулись дальше начального этапа. Правительство [From.GetNameDef] ясно дало понять, что не отступит от позиции сохранения статус-кво ни на шаг.\n\nМы можем либо смириться, либо заручиться поддержкой третьей стороны."
 DOD_hungary.144.a:0 "Мы должны уступить их давлению."
 DOD_hungary.144.b:0 "Обратиться за поддержкой к великой державе."
 DOD_hungary.145.t:0 "Обращение за поддержкой"
 DOD_hungary.145.desc:0 "Переговоры в Бледе зашли в полный тупик, и теперь нам необходимо вернуть дипломатическую инициативу, привлекая внешнюю сторону. Если нас поддержит великая держава, [From.From.GetLeader], возможно, ещё удастся убедить пойти на уступки. К кому обратиться?"
 DOD_hungary.145.a:0 "[GER.GetNameDefCap]."
 DOD_hungary.145.b:0 "[FRA.GetNameDefCap]."
 DOD_hungary.145.c:0 "[SOV.GetNameDefCap]."
 DOD_hungary.145.d:0 "[ITA.GetNameDefCap]."
 DOD_hungary.145.e:0 "[ENG.GetNameDefCap]"
 DOD_hungary.146.t:0 "[HUN.GetLeader] обращается за дипломатической поддержкой"
 DOD_hungary.146.desc:0 "The [HUN.GetAdjective] Правительство пытается изменить Трианонский договор, чтобы позволить [HUN.GetNameDef] Чтобы восстановить свою армию. Переговоры в Бледе зашли в тупик уже несколько дней. The [HUN.GetAdjective] Посол обратился к нашему правительству с просьбой оказать дипломатическое давление на другую сторону.\n\nМинистерство иностранных дел предупреждает, что на стороне [HUN.GetNameDef] Это, несомненно, негативно скажется на отношениях с соседями и изменит расстановку сил в регионе. Однако, отрицая [HUN.GetAdjective] Это может привести к тому, что они сделают агрессивный шаг и вообще откажутся от дипломатии, дестабилизируя весь регион."
 DOD_hungary.146.a:0 "«[HUN.GetNameDefCAp]» необходимо разрешить перевооружение."
 DOD_hungary.146.b:0 "«[HUN.GetNameDefCap]» нельзя разрешать перевооружение."
 DOD_hungary.147.t:0 "[From.GetNameDefCap] Вмешивается в [HUN.GetAdjective] Кризис перевооружения"
 DOD_hungary.147.desc:0 "[From.GetLeader] Мы призываем пересмотреть нашу позицию по этому вопросу. [HUN.GetAdjective] Вопрос о перевооружении в личном письме. В частности, он отмечает, что даже если сейчас будет разрешено перевооружиться, то это займет [HUN.GetAdjective]Годы, чтобы создать армию, достаточно мощную, чтобы угрожать всему в этом районе.\n\nОставшаяся твердость в этом вопросе изолирует нас дипломатически. Мы должны решить, стоит ли это дополнительной безопасности."
 DOD_hungary.147.a:0 "Будем молиться, чтобы они оказались правы."
 DOD_hungary.147.b:0 "Мы лучше знаем, что нам нужно."
 DOD_hungary.148.t:0 "Конференция в Бледе провалилась"
 DOD_hungary.148.desc:0 "После нескольких дней ожесточённых переговоров в Бледе так и не удалось добиться никакого прогресса, и делегации вернулись в свои страны. Даже вмешательство [From.From.GetLeader] ничего не изменило.\n\nВ дипломатической службе царит глубокое разочарование. Многие высокопоставленные дипломаты предлагают начать перевооружение, чтобы показать [From.GetLeader], к чему приводит отказ от переговоров."
 DOD_hungary.148.a:0 "Мы не можем рисковать войной."
 DOD_hungary.148.b:0 "Настало время дел, а не слов!"
 DOD_hungary.150.t:0 "Конкурс истребителей"
 DOD_hungary.150.desc:0 "Недавнее исследование современного воздушного боя выявило критическую слабость наших ВВС. Наши истребители значительно отстают от разработок других стран. Министерство авиации запустило срочную программу по приобретению современного истребителя в кратчайшие сроки. Поскольку отечественная разработка заняла бы неприемлемо много времени, было решено приобрести лицензию за рубежом. На это уже выделен дополнительный бюджет.\n\nЭксперты расходятся во мнениях относительно того, какой тип самолёта лучше всего подойдёт для модернизации наших истребительных авиакрыльев."
 DOD_hungary.150.a:0 "Небольшой лёгкий перехватчик."
 DOD_hungary.150.b:0 "Крупный тяжёлый истребитель."
 DOD_hungary.151.t:0 "Конкурс лёгких истребителей"
 DOD_hungary.151.desc_light_fighter:0 "Министерство авиации намерено приобрести новый лёгкий истребитель для наступательных зачисток воздушного пространства и объектовой ПВО, однако Министерство иностранных дел предлагает учитывать при выборе страны-поставщика также политические и дипломатические соображения."
 DOD_hungary.151.desc_light_fighter_refused:0 "Сославшись на соображения национальной безопасности, [From.GetAdjective] правительство отказалось предоставить производственную лицензию. Возможно, в другой стране нам повезёт больше, либо в качестве временной меры можно попытаться модернизировать имеющиеся самолёты."
 DOD_hungary.151.a:0 "Обратиться к [GER.GetNameDef]."
 DOD_hungary.151.b:0 "Обратиться к [ITA.GetNameDEf]."
 DOD_hungary.151.c:0 "Обратиться к [FRA.GetNameDef]."
 DOD_hungary.151.d:0 "Обратиться к [ENG.GetNameDef]."
 DOD_hungary.151.e:0 "Обратиться к [USA.GetNameDef]."
 DOD_hungary.151.f:0 "Использовать опыт конкурса для улучшения наших самолётов."
 DOD_hungary.152.t:0 "Конкурс тяжёлых истребителей"
 DOD_hungary.152.desc_heavy_fighter:0 "Министерство авиации намерено приобрести новый тяжёлый истребитель для дальнего перехвата и сопровождения бомбардировщиков, однако Министерство иностранных дел предлагает учитывать при выборе страны-поставщика также политические и дипломатические соображения."
 DOD_hungary.152.desc_heavy_fighter_refused:0 "Сославшись на соображения национальной безопасности, [From.GetAdjective] правительство отказалось предоставить производственную лицензию. Возможно, в другой стране нам повезёт больше, либо в качестве временной меры можно попытаться модернизировать имеющиеся самолёты."
 DOD_hungary.153.t:0 "[From.GetAdjective] конкурс истребителей"
 DOD_hungary.153.desc:0 "The [From.GetAdjective] В настоящее время ВВС проводят испытания нового легкого истребителя. По словам нашего атташе по авиации, наша последняя модель готова к победе. Официальный запрос от [From.GetAdjective] В ближайшее время ожидается правительство.\n\nПредставители производителя твердо выступают за продажу, но есть опасения национальной безопасности по поводу продажи нашего самого современного оборудования зарубежной стране. Должны ли мы позволить сделке пройти?"
 DOD_hungary.153.a:0 "Безусловно."
 DOD_hungary.153.b:0 "Мы не можем рисковать утечкой технологий."
 DOD_hungary.154.desc:0 "The [From.GetAdjective] В настоящее время ВВС проводят испытания нового тяжелого истребителя. По словам нашего атташе по авиации, наша последняя модель готова к победе. Официальный запрос от [From.GetAdjective] В ближайшее время ожидается правительство.\n\nПредставители производителя твердо выступают за продажу, но есть опасения национальной безопасности по поводу продажи нашего самого современного оборудования зарубежной стране. Должны ли мы позволить сделке пройти?"
 DOD_hungary.155.t:0 "Конкурс истребителей завершён"
 DOD_hungary.155.desc:0 "По итогам переговоров с производителем и государственными чиновниками нам удалось получить производственную лицензию на новый истребитель. Один экземпляр самолёта уже прибыл для обучения механиков его обслуживанию, а полный комплект чертежей и технической документации ожидается в ближайшее время. Производство можно начать в любой момент."
 DOD_hungary.155.a:0 "Отлично."
 DOD_hungary.160.t:0 "Конкурс бомбардировщиков"
 DOD_hungary.160.desc:0 "Исследование Министерства авиации показало, что наши военно-воздушные силы плохо оснащены для поддержки армии. Дальние воздушные удары и непосредственная авиационная поддержка определены как ключевые области, в которых мы испытываем критический недостаток. Правительство выделило средства на срочную программу приобретения современного бомбардировщика, но нам необходимо решить, какой именно самолёт закупать."
 DOD_hungary.160.a:0 "Небольшой бомбардировщик для непосредственной поддержки."
 DOD_hungary.160.b:0 "Более крупный самолёт с большей дальностью."
 DOD_hungary.161.t:0 "Конкурс лёгких бомбардировщиков"
 DOD_hungary.161.desc_cas:0 "Министерство авиации намерено приобрести новый лёгкий бомбардировщик для непосредственной поддержки наземных войск, однако Министерство иностранных дел предлагает учитывать при выборе страны-поставщика также политические и дипломатические соображения."
 DOD_hungary.161.desc_cas_refused:0 "Сославшись на соображения национальной безопасности, [From.GetAdjective] правительство отказалось предоставить производственную лицензию. Возможно, в другой стране нам повезёт больше, либо в качестве временной меры можно попытаться модернизировать имеющиеся самолёты."
 DOD_hungary.162.t:0 "Конкурс средних бомбардировщиков"
 DOD_hungary.162.desc_tac:0 "Министерство авиации намерено приобрести новый средний бомбардировщик для дальнего воспрещения и тактических воздушных ударов, однако Министерство иностранных дел предлагает учитывать при выборе страны-поставщика также политические и дипломатические соображения."
 DOD_hungary.162.desc_tac_refused:0 "Сославшись на соображения национальной безопасности, [From.GetAdjective] правительство отказалось предоставить производственную лицензию. Возможно, в другой стране нам повезёт больше, либо в качестве временной меры можно попытаться модернизировать имеющиеся самолёты."
 DOD_hungary.163.t:0 "[From.GetAdjective] конкурс бомбардировщиков"
 DOD_hungary.163.desc:0 "[From.GetAdjective] ВВС в настоящее время проводят испытания нового лёгкого бомбардировщика. По словам нашего авиационного атташе, последняя модель нашей страны имеет все шансы победить. В ближайшее время ожидается официальный запрос от [From.GetAdjective] правительства.\n\nПредставители производителя решительно поддерживают продажу, однако существуют опасения за национальную безопасность, связанные с передачей самой современной техники иностранному государству. Следует ли разрешить эту сделку?"
 DOD_hungary.164.t:0 "[From.GetAdjective] конкурс бомбардировщиков"
 DOD_hungary.164.desc:0 "[From.GetAdjective] ВВС в настоящее время проводят испытания нового среднего бомбардировщика. По словам нашего авиационного атташе, последняя модель нашей страны имеет все шансы победить. В ближайшее время ожидается официальный запрос от [From.GetAdjective] правительства.\n\nПредставители производителя решительно поддерживают продажу, однако существуют опасения за национальную безопасность, связанные с передачей самой современной техники иностранному государству. Следует ли разрешить эту сделку?"
 DOD_hungary.165.t:0 "Конкурс бомбардировщиков завершён"
 DOD_hungary.165.desc:0 "По итогам переговоров с производителем и государственными чиновниками нам удалось получить производственную лицензию на новый бомбардировщик. Один экземпляр самолёта уже прибыл для обучения механиков его обслуживанию, а полный комплект чертежей и технической документации ожидается в ближайшее время. Производство можно начать в любой момент."
 DOD_hungary.165.a:0 "Отлично."
 DOD_hungary.170.t:0 "Конец договора"
 DOD_hungary.170.desc:0 "После исчезновения прежних сторонников Трианонский договор не стоит даже бумаги, на которой он напечатан. Теперь никто не сможет отказать нам в праве носить оружие!"
 DOD_hungary.170.a:0 "Превосходно!"
 SWE_HUN_ALLIANCE:0 "Дом Бернадотов"
 DOD_romania.1.t:0 "[ROM.GetNameDefCap] хочет восстановить союз"
 DOD_romania.1.desc:0 "Старый союз с [ROM.GetNameDef] В последние годы она исчезла. Угроза со стороны [GER.GetNameDef] и [HUN.GetNameDef] Казалось, отдалённо. Но перед лицом меняющейся ситуации, [ROM.GetLeader] Приехал в Варшаву, чтобы обсудить возобновление [ROM.GetAdjective]-[POL.GetADjective] Альянс. Пока это соглашение носит лишь оборонительный характер, обе стороны обещают поддерживать друг друга в случае войны."
 DOD_romania.1.a:0 "Разумное предложение."
 DOD_romania.1.b:0 "Нас это не интересует."
 DOD_romania.2.t:0 "[From.GetNameDefCap] соглашается на союз"
 DOD_romania.2.desc:0 "Наша делегация вернулась из Варшавы с договором о взаимопомощи, подписанным [POL.GetLeader]. Теперь в случае войны мы обязаны защищать друг друга."
 DOD_romania.2.a:0 "Хорошо."
 DOD_romania.3.t:0 "[From.GetNameDefCap] отказывается от союза"
 DOD_romania.3.desc:0 "[From.GetLeader] Он отказался встретиться с нашей делегацией в Варшаве, направив лишь краткое сообщение о том, что более тесная связь с нашей страной не является исключением. [ROM.GetNameDef] в настоящее время не отвечает интересам [From.GetAdjective] правительства.\n\nПросьбы о дальнейших разъяснениях не были удовлетворены."
 DOD_romania.3.a:0 "Прискорбно."
 DOD_romania.10.t:0 "Санитарный кордон"
 DOD_romania.10.desc:0 "Первоначально предполагалось сдерживать распространение коммунизма и блокировать марш Красной Армии в Европу. [ROM.GetLeader] Недавно возродилась идея санитарного кордона, чтобы держать дипломатических изгоев в напряжении. [GER.GetNameDef] и [SOV.GetNameDef] отдельно.\n\nThe [ROM.GetAdjective]Мы уже говорили о присоединении к формальному союзу с ними."
 DOD_romania.10.a:0 "Вместе мы едины."
 DOD_romania.10.b:0 "Нейтралитет — лучшая защита."
 DOD_romania.11.t:0 "[From.GetNameDefCap] соглашается присоединиться к санитарному кордону"
 DOD_romania.11.desc:0 "Правительство [From.GetLeader] объявило о поддержке санитарного кордона. Делегация из [From.GetNameDef] прибыла для обсуждения подробностей вступления в наш альянс и подготовки планов военной поддержки на случай войны."
 DOD_romania.11.a:0 "Хорошо."
 DOD_romania.12.t:0 "[From.GetNameDefCap] отказывается"
 DOD_romania.12.desc:0 "Переговоры о вступлении [From.GetNameDef] в наш альянс провалились. Делегация из [From.GetNameDef] представила обширный список требований в качестве условия вступления, включая далеко идущие обязательства по военной поддержке.\n\nГенеральный штаб отклонил эти требования как невыполнимые. Министерство иностранных дел теперь считает, что [From.GetLeader] намеренно выдвинул их, чтобы отказаться от нашего предложения, не выглядя при этом виновником провала."
 DOD_romania.12.a:0 "Какая наглость."
 DOD_romania.20.t:0 "[ROM.GetNameDefCap] требует гарантий"
 DOD_romania.20.desc:0 "Уже несколько месяцев мы пытаемся заключить союз с [ROM.GetNameDef], хотя бы для того, чтобы их нефть не досталась врагу. Теперь [ROM.GetLeader] заявил, что его правительство даже не станет рассматривать вступление в наш альянс без официальной гарантии военной поддержки в случае войны."
 DOD_romania.20.a:0 "Они получат наши гарантии."
 DOD_romania.20.b:0 "Это лишь ещё сильнее растянет наши силы."
 DOD_romania.21.t:0 "[From.GetNameDefCap] Гарантии [ROM.GetAdjective] Границы"
 DOD_romania.21.desc:0 "Выступая перед собранием [ROM.GetAdjective]-[From.GetAdjective] Ассоциация Дружбы, [From.GetLeader] Он отметил, что нынешние границы [ROM.GetNameDef] Они «неизменны и постоянны», обещая, что его правительство сделает все возможное, чтобы защитить их, если начнется война."
 DOD_romania.21.a:0 "Хорошо."
 DOD_romania.22.t:0 "[From.GetNameDefCap] отказывается предоставить гарантии"
 DOD_romania.22.desc:0 "Наша недавняя дипломатическая инициатива встретила холодный отказ со стороны [From.GetNameDef]. Выступая перед парламентом, [From.GetLeader] заявил, что вопрос об официальных гарантиях для [ROM.GetNameDef] «будет решён тогда, когда станет актуальным»."
 DOD_romania.22.a:0 "Жестоко."
 DOD_romania.30.t:0 "[ROM.GetNameDefCap] предлагает военные базы"
 DOD_romania.30.desc:0 "С ростом напряженности в Европе, [ROM.GetLeader] Он пришел к нам с удивительным предложением: если мы берем на себя обязательство защищать [ROM.GetNameDef] От любой внешней угрозы нам будет позволено разместить войска на [ROM.GetAdjective] Почва.\n\n[ROM.GetLeader] Кроме того, ослабление ограничений в отношении Коммунистической партии является мерой доброй воли."
 DOD_romania.30.a:0 "Они получат наши гарантии."
 DOD_romania.30.b:0 "Никаких сделок с империалистами!"
 DOD_romania.31.t:0 "[From.GetNameDefCap] принимает предложение"
 DOD_romania.31.desc:0 "[SOV.GetLeader] лично приказал Красной армии подготовить планы обороны [ROM.GetNameDef] на случай войны. Небольшая военная миссия уже прибыла, чтобы подготовить базы и аэродромы к скорому размещению гарнизонных частей."
 DOD_romania.31.a:0 "Будем надеяться, что нам не придётся об этом пожалеть."
 DOD_romania.32.t:0 "[From.GetNameDefCap] отклоняет наше предложение"
 DOD_romania.32.desc:0 "Разговоры о базировании [SOV.GetAdjective] войска в [ROM.GetNameDef] Они закончились всего через несколько часов, после чего [SOV.GetAdjective]Они заявляют, что не заинтересованы в том, чтобы гарантировать наши границы.\n\nДовольно многие из наших генералов ухватились за тревожный вывод, что это может быть потому, что им не нравится их текущая форма и они стремятся изменить их."
 DOD_romania.32.a:0 "И впрямь тревожно."
 DOD_romania.40.t:0 "[ROM.GetAdjective] давление"
 DOD_romania.40.desc:0 "Наш посол в [ROM.GetNameDef] Его поспешно вызвали в офис [ROM.GetLeader]. Прежде чем он смог узнать о последних движениях [ROM.GetAdjective] Военные к нашей общей границе, ему был предъявлен ультиматум.[ROM.GetLeader] Настаивал на том, что [BUL.GetNameDef] Он не может больше вести себя без его явного согласия и должен представлять все важные политические решения для своего одобрения.\n\nОтказ будет встречен силой."
 DOD_romania.40.a:0 "Мы должны уступить их требованиям."
 DOD_romania.40.b:0 "Смерть прежде бесчестья!"
 DOD_romania.41.t:0 "[From.GetNameDefCap] подчиняется"
 DOD_romania.41.desc:0 "[BUL.GetNameDefCap] приняла наши требования и теперь консультируется с нами перед принятием политических решений.\n\nВ Софию прибыл специальный представитель для координации действий с их правительством."
 DOD_romania.41.a:0 "Хорошо."
 DOD_romania.42.t:0 "[From.GetNameDefCap] проявляет неповиновение"
 DOD_romania.42.desc:0 "Когда нам представят список наших требований, [BUL.GetLeader] По сообщениям, он рассмеялся, а затем разорвал газету, утверждая, что нет. [ROM.GetAdjective] Армия может быть лучше [BUL.GetAdjective] Один в бою."
 DOD_romania.42.a:0 "Это не стоит пролитой крови."
 DOD_romania.42.b:0 "Проверим, прав ли он."
 DOD_romania.50.t:0 "[ROM.GetNameDefCap] требует изменить правительство"
 DOD_romania.50.desc:0 "Когда [ROM.GetLeader] публично потребовал, чтобы ему было разрешено наложить вето на любое назначение [HUN.GetAdjective] Правительство, потому что оно было в [ROM.GetAdjective] Интерес, большинство людей на дипломатической службе считали это простой пропагандой, предназначенной для отечественной аудитории.\n\nС некоторым удивлением мы получили официальную ноту с тем же эффектом немного позже.\n\nУгроза применения военной силы, если мы не выполним требования, вызвала панику в Генеральном штабе, а верховное командование армии вызвало серьезные сомнения в том, сможем ли мы удержать войска. [ROM.GetAdjective]s на границе."
 DOD_romania.50.a:0 "У нас нет выбора."
 DOD_romania.50.b:0 "Мы можем пойти на некоторые уступки."
 DOD_romania.50.c:0 "Лучше умереть свободным, чем жить рабом."
 DOD_romania.51.t:0 "[From.GetNameDefCap] идёт на сближение"
 DOD_romania.51.desc:0 "Понимая, что военное сопротивление было бы одновременно невозможным и бессмысленным, [HUN.GetAdjective] Правительство решило последовать нашим предложениям и предоставить себя в наше распоряжение. [HUN.GetLeader] Он пообещал проконсультироваться с нами перед принятием какого-либо важного политического решения."
 DOD_romania.51.a:0 "Хорошо."
 DOD_romania.52.t:0 "[From.GetNameDefCap] предлагает договор о дружбе"
 DOD_romania.52.desc:0 "В ответ на нашу недавнюю просьбу о некоторых изменениях в [HUN.GetAdjective] правительство, [HUN.GetLeader] Мы предложили Договор о дружбе и взаимной помощи, который заставит их прийти нам на помощь во время войны, но также содержит пункт, в котором мы поклялись не вмешиваться. [HUN.GetAdjective] Политика."
 DOD_romania.52.a:0 "Приемлемый компромисс."
 DOD_romania.52.b:0 "Мы имели в виду не это."
 DOD_romania.53.t:0 "[From.GetNameDefCap] проявляет непокорность"
 DOD_romania.53.desc:0 "Несмотря на очевидное превосходство наших вооружённых сил, [HUN.GetLeader] отказался внять доводам разума и приказал своей армии занять оборонительные позиции вдоль нашей границы. По неизвестным причинам значительная часть их армии, похоже, выполнила эти приказы.\n\nПохоже, они хотят довести дело до боя."
 DOD_romania.53.a:0 "Это не стоит ни времени, ни усилий."
 DOD_romania.53.b:0 "Победа несомненна. К войне!"
 DOD_romania.60.t:0 "[ROM.GetNameDefCap] требует радикального переустройства"
 DOD_romania.60.desc:0 "С этим [ROM.GetAdjective] Армия, стоящая у наших границ, ходят слухи об их предназначении. Когда наш посол в Бухаресте спросил об этом вопросе, [ROM.GetAdjective]Он прямо сказал ему, что [ROM.GetLeader] Он решил, что единый [YUG.GetNameDef] Он больше не был в его интересах. Вместо этого наша страна должна быть разделена на несколько государств-клиентов под прямым управлением. [ROM.GetAdjective] Контроль.\n\nВ течение часа ожидается официальный ультиматум."
 DOD_romania.60.a:0 "Мы не можем надеяться выстоять против них."
 DOD_romania.60.b:0 "Никогда!"
 DOD_romania.61.t:0 "[From.GetNameDefCap] уступает"
 DOD_romania.61.desc:0 "За несколько минут до того, как ультиматум Белграду закончился, пришло официальное коммюнике, в котором говорилось, что [YUG.GetAdjective] Правительство распустило и передало свои полномочия нескольким местным органам власти, которые заявили о своей лояльности к нам."
 DOD_romania.61.a:0 "Хорошо."
 DOD_romania.62.t:0 "[From.GetNameDefCap] проявляет непокорность"
 DOD_romania.62.desc:0 "The [YUG.GetAdjective] Правительство выдвинуло ультиматум без ответа. Полеты разведчиков выявили перемещения войск на [YUG.GetAdjective] По другую сторону границы, что побудило Генеральный штаб пересмотреть планы вторжения. Ведущие военные советники отказались гарантировать, что мы победим. [YUG.GetNameDef] Быстро."
 DOD_romania.62.a:0 "Мы сокрушим их."
 DOD_romania.62.b:0 "Попросим поддержки."
 DOD_romania.63.t:0 "[From.GetLeader] намерен разделить [YUG.GetNameDef]"
 DOD_romania.63.desc:0 "Между [ROM.GetNameDef] и [YUG.GetNameDef] возник кризис, который может открыть перед нами новые возможности. [YUG.GetLeader] отказался выполнить требования [ROM.GetLeader] и сдать свою страну. В ответ [ROM.GetLeader] обратился к нам с предложением разделить [YUG.GetNameDef]. Он предложил нам Словению и независимое Хорватское государство под нашим контролем."
 DOD_romania.63.a:0 "Интригующий замысел."
 DOD_romania.63.b:0 "Зачем нам нужна их помощь?"
 DOD_romania.64.desc:0 "Между [ROM.GetNameDef] и [YUG.GetNameDef] возник кризис, который может открыть перед нами новые возможности. [YUG.GetLeader] отказался выполнить требования [ROM.GetLeader] и сдать свою страну. В ответ [ROM.GetLeader] обратился к нам с предложением разделить [YUG.GetNameDef]. Он предложил нам Далмацию и создание марионеточного государства в Черногории под нашим контролем."
 DOD_romania.65.t:0 "[From.GetNameDefCap] соглашается"
 DOD_romania.65.desc:0 "[From.GetLeader] Он дал понять о своем согласии с условиями. The [From.GetAdjective] Правительство поддержит наши действия в [YUG.GetNameDef]."
 DOD_romania.65.a:0 "Превосходно."
 DOD_romania.66.t:0 "[From.GetNameDefCap] отказывается"
 DOD_romania.66.desc:0 "Не предостерегая нас напрямую от вмешательства в дела [YUG.GetNameDef], правительство [From.GetNameDef] всё же отказалось одобрить наше предложение.\n\nВозможно, они ожидают нашего провала и намерены захватить [YUG.GetNameDef] для себя, устранив нас из уравнения."
 DOD_romania.66.a:0 "Нам будет жаль их разочаровывать."
 DOD_romania.67.t:0 "Ультиматум для [YUG.GetNameDef]"
 DOD_romania.67.desc:0 "Заручившись дополнительной дипломатической поддержкой, пора сообщить об этом. [YUG.GetAdjective]г что ситуация резко изменилась. Распространившись в попытках защитить длинные границы, их военное положение становится еще более безнадежным."
 DOD_romania.67.a:0 "Победа близка."
 DOD_romania.68.t:0 "Дипломатические усилия провалились"
 DOD_romania.68.desc:0 "Наши попытки выйти на [GER.GetNameDef] и [ITA.GetNameDef] Поддержка не была встречена успехом. Дыхательное пространство, которое он предоставляет [YUG.GetAdjective]Это, несомненно, повлияет на предстоящую кампанию. Однако Генштаб по-прежнему с осторожным оптимизмом смотрит на то, что мы быстро добьемся победы."
 DOD_romania.68.a:0 "К оружию!"
 DOD_romania.69.t:0 "Окружение"
 DOD_romania.69.desc_GER:0 "Был предъявлен второй ультиматум. На этот раз требования были подкреплены аналогичной запиской посла [GER.GetNameDef]который заявил о своей поддержке [ROM.GetAdjective] Он настаивал на том, чтобы наша армия не вмешивалась в оккупацию Словении и Хорватии. [GER.GetAdjective] Войска."
 DOD_romania.69.desc_ITA:0 "Был предъявлен второй ультиматум. На этот раз требования были подкреплены аналогичной запиской посла [ITA.GetNameDef]который заявил о своей поддержке [ROM.GetAdjective] Он настаивал на том, чтобы наша армия не вмешивалась в оккупацию Далмации и Черногории. [ITA.GetAdjective] Войска."
 DOD_romania.69.desc_GERITA:0 "Был предъявлен второй ультиматум. На этот раз требования были подкреплены аналогичной запиской от послов [GER.GetNameDef] и [ITA.GetNameDef]. Они заявили о своей поддержке [ROM.GetAdjective] Они настаивали на том, что наша армия не будет вмешиваться в оккупацию, чтобы избежать ненужного кровопролития."
 DOD_romania.69.a:0 "Сложить оружие."
 DOD_romania.69.b:0 "Мы будем сражаться до последнего вздоха!"
 DOD_romania.70.t:0 "[YUG.GetNameDefCap] разделена"
 DOD_romania.70.desc:0 "The [YUG.GetAdjective] Правительство приняло поражение. Силы союзных держав взяли страну под свой контроль и заняли обозначенные ими зоны."
 DOD_romania.70.a:0 "Ещё одна победа дипломатии."
 DOD_romania.71.t:0 "[YUG.GetNameDefCap] проявляет непокорность"
 DOD_romania.71.desc:0 "The [YUG.GetADjective] Армия заняла позиции вдоль нашей границы, и [YUG.GetADjective] Военно-воздушные силы заняли свои военные посты. Они, кажется, готовы к борьбе.\n\nОднако источник в [YUG.GetAdjective] Военное министерство утверждает, что это просто жест неповиновения, поскольку [YUG.GetLeader] Я твердо верю, что мы блефуем и что войны не будет."
 DOD_romania.71.a:0 "Мы не блефовали."
 DOD_romania.81.t:0 "Любовница короля покупает виллу"
 DOD_romania.81.desc:0 "Сообщается, что Магда Лупеску, любовница короля Кароля II, приобрела новую виллу в дорогом пригороде Бухареста. Вопрос о том, откуда у неё взялись средства, вызвал множество домыслов. Новые сведения в иностранной прессе убедительно указывают на то, что сам король одобрил покупку за государственный счёт.\n\nСкандал разрастается, и нам необходимо как можно скорее выступить с публичным заявлением."
 DOD_romania.81.a:0 "Правительство приобрело здание и разрешило госпоже Лупеску проживать в нём."
 DOD_romania.81.b:0 "Король взял деньги из аванса в счёт своего содержания."
 DOD_romania.82.t:0 "Король запрещает критическую книгу"
 DOD_romania.82.desc:0 "Недавно вышла новая книга известного социолога, подробно описывающая огромное влияние ближайшего окружения короля на политические решения. Большинство этих решений впоследствии приносит выгоду членам этого круга. Особое внимание уделено делам королевской любовницы, которая, как сообщается, использовала свои связи для личного обогащения. Король приказал арестовать автора.\n\nЛиберальная пресса и крайне правые пришли из-за этого в ярость, хотя и по совершенно разным причинам. Необходимо выступить с заявлением, прежде чем ситуация выйдет из-под контроля."
 DOD_romania.82.a:0 "Клевета является уголовным преступлением."
 DOD_romania.82.b:0 "Автор будет немедленно освобождён."
 DOD_romania.83.t:0 "Король устраивает роскошный приём"
 DOD_romania.83.desc:0 "Несмотря на то что официальные материалы о недавнем пиршестве в Королевском дворце были лично одобрены королём, их публикация вызвала серьёзное общественное недовольство. Фотографии королевской любовницы в дорогом французском вечернем платье и подробные описания обеда из семи блюд, поданных на золотых тарелках, ещё сильнее возмутили население, которое всё ещё страдает от последствий Великой депрессии.\n\nКороль требует, чтобы мы немедленно выступили с публичным заявлением в его поддержку."
 DOD_romania.83.a:0 "Король должен поддерживать подобающий его положению образ."
 DOD_romania.83.b:0 "Личная жизнь короля не касается правительства."
 DOD_romania.84.t:0 "Любовницу короля заметили в Париже"
 DOD_romania.84.desc:0 "[FRA.GetAdjective] Газеты были полны подвигов Магды Лупеску в Париже, где она, как сообщается, потворствовала обширному шопингу.\n\nХотя это и не является чем-то необычным само по себе, сообщается, что она заручилась помощью со стороны правительства. [ROM.GetADjective] Посольство перенесло свои покупки и попросило магазины отправить счет в посольство. [ROM.GetADjective] Правительство было подхвачено национальной прессой. Нас попросили прокомментировать эти сообщения."
 DOD_romania.84.a:0 "Госпожа Лупеску действовала по просьбе короля."
 DOD_romania.84.b:0 "Правительство не комментирует действия частных лиц."
 DOD_romania.85.t:0 "Король отправляется на отдых в Ниццу"
 DOD_romania.85.desc:0 "Король Кароль II прибыл на отдых в Ниццу в сопровождении своей любовницы и большей части ближайшего окружения. Поселившись в королевском люксе отеля «Негреско», король сообщил местным журналистам, что намерен провести следующие несколько недель, наслаждаясь лучшими блюдами и гостеприимством, а также посетить Оперу Ниццы и несколько раз съездить за покупками в Париж.\n\nМестная пресса задаёт неудобные вопросы о выбранном для поездки времени и о том, откуда предполагается взять деньги на её оплату."
 DOD_romania.85.a:0 "Это был официальный государственный визит."
 DOD_romania.85.b:0 "Король каждый год ездит отдыхать в Ниццу."
 DOD_romania.86.t:0 "Король замешан в скандале с хищением средств"
 DOD_romania.86.desc:0 "После появления слухов о коррупции в армейских закупках король пообещал провести беспристрастное расследование. Предварительный отчёт просочился в прессу и не только подтвердил слухи, но и напрямую связал с этим делом ближайших советников короля.\n\nВся эта история стала позором для правительства. Король требует принять меры, но при этом заявил о полной поддержке замешанных советников."
 DOD_romania.86.a:0 "Подписанный контракт неоспорим."
 DOD_romania.86.b:0 "Реформировать процедуру."
 DOD_romania.110.t:0 "[ROM.GetNameDefCap] предлагает разделить [CZE.GetNameDef]"
 DOD_romania.110.desc:0 "[ROM.GetLeader] обратился к нам с предложением разобраться с [CZE.GetNameDef]. Указав на общность наших интересов в этом регионе, он предложил разделить страну на три части: мы получим западные территории, [ROM.GetNameDef] возьмёт под контроль Словакию, а [HUN.GetNameDef] достанется крошечная полоска земли вдоль южной границы."
 DOD_romania.110.a:0 "Мы должны воспользоваться этой возможностью."
 DOD_romania.110.b:0 "Зачем вести переговоры о том, что мы можем взять сами?"
 DOD_romania.111.t:0 "Берлин соглашается"
 DOD_romania.111.desc:0 "Правительство в Берлине одобрило наш проект договора и предложенные демаркационные линии. Осталось лишь направить ультиматум Праге."
 DOD_romania.111.a:0 "Отправим ноту."
 DOD_romania.113.t:0 "Берлин отказывается"
 DOD_romania.113.desc:0 "На напряжённой встрече наш посол столкнулся с резким отказом обсуждать или согласовывать любые вопросы, касающиеся [CZE.GetNameDef]. Они считают эту страну полностью входящей в сферу своего влияния и предупредили, что любое вмешательство будет расценено как противодействие их политическим целям."
 DOD_romania.113.a:0 "Пора пересмотреть наш подход."
 DOD_romania.113.b:0 "Мы нанесём удар в одиночку."
 DOD_romania.114.t:0 "Берлинский ультиматум"
 DOD_romania.114.desc:0 "с [GER.GetAdjective] Послы из Берлина и Бухареста выдвинули совместный ультиматум: если мы не согласимся передать Словакию [HUN.GetNameDef] и [ROM.GetNameDef] Став «протектором» Берлина, люфтваффе готово «искоренить» Прагу. [HUN.GetAdjective] Войска готовятся вторгнуться в нашу страну с юга."
 DOD_romania.114.a:0 "У нас нет выбора."
 DOD_romania.114.b:0 "Мы предпочтём смерть бесчестью."
 DOD_romania.115.t:0 "[CZE.GetLeader] проявляет непокорность"
 DOD_romania.115.desc:0 "[CZE.GetAdjective]ое правительство проигнорировало наш ультиматум и мобилизовало армию. [CZE.GetLeader] пообещал, что любой захватчик столкнётся с войсками, готовыми защищать страну до последнего человека."
 DOD_romania.115.a:0 "Мы обдумаем возможные варианты."
 DOD_romania.120.t:0 "Пригласить иностранные автомобилестроительные компании"
 DOD_romania.120.desc:0 "Несколько иностранных производителей грузовиков выразили заинтересованность в открытии завода в [ROM.GetNameDef] для выпуска новых машин для гражданского рынка и армии. Выбор одной из компаний станет знаковой сделкой, после которой последует приобретение новых производственных лицензий.\n\nК кому нам следует обратиться?"
 DOD_romania.120.a:0 "«Воксхолл» — ради более быстрых машин."
 DOD_romania.120.b:0 "Opel - для надежного [GER.GetAdjective] Инженерия."
 DOD_romania.120.c:0 "«Форд» — ради массового производства."
 DOD_yugoslavia.1.t:0 "Военные совершают переворот"
 DOD_yugoslavia.1.desc:0 "После нашего решения подписать пакт с [GER.GetNameDef] группа офицеров военно-воздушных сил совершила переворот. Военные захватили ключевые объекты в Белграде. Король Пётр был объявлен совершеннолетним, что положило конец регентству [YUG.GetLeader].\n\nНаселение поддержало переворот, и толпы скандируют: «Лучше война, чем пакт, лучше могила, чем рабство!»\n\nПравительство оказалось на перепутье. Мы можем поддержать переворот, что будет означать войну с [GER.GetNameDef]. Или же можем попытаться подавить его, но тогда страна погрузится в кровавую гражданскую войну."
 DOD_yugoslavia.1.a:0 "Нам следовало прислушаться к офицерам."
 DOD_yugoslavia.1.b:0 "Мы не отступим от своего решения!"
 DOD_yugoslavia.2.t:0 "Переворот в государстве [YUG.GetNameDef]"
 DOD_yugoslavia.2.desc:0 "Сразу же после того, как правительство князя Павла подписало Трехсторонний пакт, группа [YUG.GetAdjective] Офицеры ВВС совершили хорошо спланированный переворот, который заменил законное правительство и поставил на трон несовершеннолетнего Петра II.\n\nThe [YUG.GetADjective] Правительство полностью свернулось, а новые лидеры объявили подпись принца Павла недействительной."
 DOD_yugoslavia.2.a:0 "Ввести в действие директиву фюрера № 25."
 DOD_yugoslavia.3.desc:0 "Сразу же после того, как правительство князя Павла подписало Трехсторонний пакт, группа [YUG.GetAdjective] Офицеры ВВС совершили хорошо спланированный переворот, который заменил законное правительство и поставил на трон несовершеннолетнего Петра II.\n\nЭлементы бывшего правительства осудили переворот и объявили чрезвычайное положение. Поскольку это работа иностранных агентов, они утверждают, что мы обязаны их защищать."
 DOD_yugoslavia.3.a:0 "Они глубоко заблуждаются."
 DOD_yugoslavia.3.b:0 "Мы спасём их."
 DOD_yugoslavia.10.t:0 "Пятая колонна"
 DOD_yugoslavia.10.desc:0 "Когда по стране распространилась новость об объявлении войны [GER.GetNameDef], быстро выяснилось, что многие не намерены браться за оружие против захватчиков. Большинство хорватских частей отказалось выполнять приказы о выдвижении к границе, а в нескольких случаях они даже открыли огонь по другим частям, исполнявшим приказы.\n\nПохоже, мы больше не можем рассчитывать на поддержку хорватов, из-за чего оборона границы с [GER.GetNameDEf], мягко говоря, стала крайне затруднительной."
 DOD_yugoslavia.10.a:0 "Предатели!"
 DOD_yugoslavia.20.t:1 "[YUG.GetNameDefCap] просит продать самолёты"
 DOD_yugoslavia.20.desc:0 "Осознавая стратегическую слабость, [YUG.GetAdjective] Военно-воздушные силы инициировали программу крушения для модернизации и расширения своих сил. Значительные денежные резервы были выделены для покрытия покупки. Комиссия путешествует по Европе в поисках новых источников истребителей и средних бомбардировщиков.\n\nУчитывая актуальность вопроса, [YUG.GetAdjective]s настаивали на немедленной поставке или передаче самолетов непосредственно от производителя."
 DOD_yugoslavia.20.a:0 "Одобрить продажу истребителей из наших резервов."
 DOD_yugoslavia.20.b:0 "Одобрить продажу бомбардировщиков из наших резервов."
 DOD_yugoslavia.20.d:0 "Перенаправить производство истребителей на выполнение их заказа."
 DOD_yugoslavia.20.e:0 "Перенаправить производство бомбардировщиков на выполнение их заказа."
 DOD_yugoslavia.20.c:0 "Мы не можем ничем поделиться."
 DOD_yugoslavia.21.t:0 "[From.GetNameDefCap] одобряет продажу истребителей"
 DOD_yugoslavia.21.desc:0 "Наша закупочная комиссия в [From.GetNameDef] добилась продажи нескольких истребителей для наших военно-воздушных сил. Первые самолёты уже получены, и наши пилоты приступили к переучиванию."
 DOD_yugoslavia.21.a:0 "Превосходно."
 DOD_yugoslavia.22.t:0 "[From.GetNameDefCap] одобряет продажу бомбардировщиков"
 DOD_yugoslavia.22.desc:0 "Наша закупочная комиссия в [From.GetNameDef] добилась продажи нескольких средних бомбардировщиков для наших военно-воздушных сил. Первые самолёты уже получены, и наши пилоты приступили к переучиванию."
 DOD_yugoslavia.30.t:0 "Вопрос о [YUG.GetNameDef]"
 DOD_yugoslavia.30.desc:0 "\nПосле возвращения Австрии в состав Рейха у нас появилась общая граница с [YUG.GetNameDef]. Правительство [YUG.GetLeader] пока почти не высказывалось о нашем предполагаемом переустройстве Европы. Возможно, стоит напомнить им, что настанет момент, когда придётся сделать выбор."
 DOD_yugoslavia.30.a:0 "Надавить на них."
 DOD_yugoslavia.30.b:0 "Их мнение не имеет значения."
 DOD_yugoslavia.31.t:0 "[GER.GetAdjective] давление"
 DOD_yugoslavia.31.desc:0 "The [GER.GetAdjective] Посол загнан в угол [YUG.GetLeader] Несколько дней назад на дипломатическом приеме. Вслед за аншлюсом Австрии он отметил: [YUG.GetNameDef] и [GER.GetNameDef] Теперь у нас общая граница. Посол заверил [YUG.GetLeader] это [GER.GetNameDEf] Он, конечно, очень интересовался дружескими отношениями.\n\nОн лишь просил, чтобы мы учитывали это при принятии политических решений в будущем."
 DOD_yugoslavia.31.a:0 "Как любезно с его стороны."
 DOD_yugoslavia.32.desc:0 "После исчезновения [CZE.GetNameDef] с политической карты баланс сил в Юго-Восточной Европе резко изменился. Многие страны опирались на чехословацкое оружие и деньги, а теперь нуждаются в новых покровителях. Возможно, пришло время напомнить [YUG.GetLeader] об этом."
 DOD_yugoslavia.32.a:0 "Надавить на него."
 DOD_yugoslavia.32.b:0 "У нас другие планы."
 DOD_yugoslavia.33.desc:0 "Через несколько часов после [GER.GetAdjective] Войска вошли в Прагу, а [CZE.GetAdjective] Посол по-прежнему прощался с ним, посол... [GER.GetNameDef] Позвонили в министерство иностранных дел.\n\nПо его словам, [GER.GetNamedef] Правительство искренне сожалеет о том, что ему пришлось принять такие меры в отношении [CZE.GetNameDef]и [GER.GetLeader] Радует, что действия [YUG.GetLeader] не давали ему оснований рассматривать такие действия в отношении [YUG.GetNameDEf].\n\nПосол закончил, выразив надежду, что так и останется в будущем."
 DOD_yugoslavia.33.a:0 "Как любезно с его стороны."
 DOD_yugoslavia.34.desc:0 "Сейчас мы стоим на вершине Европы. Франция долгое время была основой стабильности в Юго-Восточной Европе, но теперь вся область готова к захвату. Мы можем вытащить все страны на нашу орбиту, и никто не сможет нас остановить.\n\nПора рассказать [YUG.GetAdjective]Они должны сделать выбор. Либо они будут с нами, либо их сметут."
 DOD_yugoslavia.34.a:0 "Наше терпение подходит к концу."
 DOD_yugoslavia.34.b:0 "Тигру нет дела до мнения мышей."
 DOD_yugoslavia.35.desc:0 "На недавней встрече в Бергхофе [GER.GetLeader] и [YUG.GetLeader] обсудили положение в Европе и нашу роль в ней. [GER.GetLeader] настаивает, что [YUG.GetNameDef] не сможет избежать выбора стороны в надвигающейся борьбе не на жизнь, а на смерть. Кроме того, [GER.GetNameDef] не может терпеть неприсоединившуюся страну у своих границ.\n\nВ завершение он заявил, что было бы почти предпочтительнее, если бы [YUG.GetNameDef] встала на сторону Союзников, чтобы все наконец понимали, кто чего стоит."
 DOD_yugoslavia.35.a:0 "Время истекает."
 DOD_yugoslavia.36.t:0 "Судьба [YUG.GetNameDef]"
 DOD_yugoslavia.36.desc:0 "Несмотря на неоднократные требования определиться со стороной, правительство [YUG.GetLeader] по-прежнему цепляется за мысль, что [YUG.GetNameDef] сможет остаться в стороне от этого конфликта. Теперь им придётся столкнуться с последствиями собственной трусости."
 DOD_yugoslavia.36.a:0 "Кто не с нами, тот против нас!"
 DOD_yugoslavia.36.b:0 "Они были и навсегда останутся незначительными."
 DOD_yugoslavia.40.desc:0 "[YUG.GetNameDefCap] является краеугольным камнем нашей новой балканской стратегии. До сих пор страна избегала определённой позиции, торгуя с [GER.GetNameDef], но не вступая в Ось. Следует напомнить им, что в случае войны мы не потерпим торговли с врагом."
 DOD_yugoslavia.40.a:0 "Отправить им послание."
 DOD_yugoslavia.40.b:0 "Мы не можем вмешиваться в дела другой страны."
 DOD_yugoslavia.41.t:0 "[ENG.GetAdjective] давление"
 DOD_yugoslavia.41.desc:0 "[ENG.GetLeader] Недавно было объявлено о дипломатическом наступлении в Балканском регионе. Частью этого продвижения была личная встреча между ним и нашим послом в Лондоне. В ходе этой встречи он поинтересовался нашей позицией в отношении [GER.GetNameDef]. [GER.GetNameDefCap]Он отметил, что на его долю приходится значительный объем нашего несырьевого экспорта. Мы будем делать все, чтобы уменьшить нашу зависимость от [GER.GetNameDef]."
 DOD_yugoslavia.41.a:0 "Мы это рассмотрим."
 DOD_yugoslavia.42.desc:0 "Мюнхенский договор может означать мир в наше время, а может и нет.[GER.GetNameDef] Это далеко не единственная страна, которая пытается перекроить границы Европы. Правительство [YUG.GetLeader] До сих пор он был удивительно близок к судьбе своего ведущего поставщика оружия.\n\nЭто заставило многих людей на дипломатической службе задаться вопросом: [YUG.GetAdjective]Он знал, что произойдет, и, возможно, согласился на это.\n\nМы должны помнить, что любое соглашение с [GER.GetNameDef] Это будет рассматриваться как враждебный акт, если начнется война."
 DOD_yugoslavia.42.a:0 "Отправить специального представителя."
 DOD_yugoslavia.42.b:0 "Должно быть, они всё ещё в шоке."
 DOD_yugoslavia.43.desc:0 "Специальный представитель прибыл из [ENG.GetNameDef] Обсудить наше мнение по Мюнхенскому договору. Похоже, что [ENG.GetLeader] Мы надеялись на более твердое заявление о поддержке со стороны нас во время войны, которая сопровождала переговоры. Он напомнил нам, что судьба [CZE.GetNameDef] Они привязаны к нашим. Должен [CZE.GetNameDef] падать в [GER.GetAdjective]Мы все больше и больше изолируем себя на континенте."
 DOD_yugoslavia.43.a:0 "Они лишь ищут новых пешек."
 DOD_yugoslavia.44.desc:0 "Несмотря на то что война идёт уже несколько месяцев, [YUG.GetLeader] по-прежнему отказывается выбирать сторону и продолжает торговать с [GER.GetNameDef], соблюдая строгий нейтралитет. Хотя их поддержка [GER.GetNameDef], вероятно, пока не имеет решающего значения, нам следует решить, позволим ли мы им помогать стране, с которой ведём войну."
 DOD_yugoslavia.44.a:0 "Они должны сделать выбор."
 DOD_yugoslavia.44.b:0 "Их нейтралитет устраивает нас больше."
 DOD_yugoslavia.45.desc:0 "The [ENG.GetAdjective] Сегодня посол посетил министерство иностранных дел, потребовав узнать, почему мы до сих пор торговались с ним. [GER.GetNameDef]. The [ENG.GetAdjective] Нам сказали, что правительство считает это враждебным актом и рассмотрит «соответствующие меры», если мы не остановимся сразу."
 DOD_yugoslavia.45.a:0 "Мы должны сделать выбор."
 DOD_yugoslavia.46.desc:0 "Похоже, что наше давление на [YUG.GetNameDef] не оказали намеченного эффекта. Вместо того, чтобы прекратить торговлю с [GER.GetNameDef] или заявляя о своей поддержке союзнического дела, правительство [YUG.GetLeader] цепляется за свой нейтралитет и отказывается сдвинуться с места. В последнее время МИ-6 получила сообщения о том, что [YUG.GetAdjective] Правительство рассматривает вопрос о предоставлении [GER.GetNameDef] Право свободно перемещать войска через свою страну."
 DOD_yugoslavia.46.a:0 "Они уже почти враги."
 DOD_yugoslavia.46.b:0 "Сейчас нам не стоит наживать новых врагов."
 DOD_yugoslavia.181.t:0 "Коммунистические настроения распространяются в [This.GetNameDef]"
 DOD_yugoslavia.181.d:0 "С основанием Всеславянского Рабочего Конгресса, кажется, многие [This.GetNameDef]Рабочий класс начинает поддерживать идею [This.GetNameDef] вступление во фракцию как коммунистическое государство на основе [From.GetAdjective] Модель. Несмотря на небольшое движение, многие [This.GetAdjective] Чиновники опасаются, что если эти активисты не будут немедленно наказаны за пропаганду этой идеи. [This.GetNameDef] Вполне возможно, что она столкнется с общенациональными забастовками и даже ростом левого полумилитаризма."
 DOD_yugoslavia.182.t:0 "Панславянская пропаганда"
 DOD_yugoslavia.182.d:0 "По всей нашей стране сторонники Всеславянского рабочего конгресса начали украшать улицы. [This.Capital.GetName] с плакатами и листовками, продвигающими [From.GetAdjective] Модель социализма. Они аплодируют [From.GetLeader] и его режим, и считают, что [This.GetAdjective] Правительство выиграет от социальных реформ, подобных [From.GetNameDef]. Хотя многие подозревают, что это смелая попытка [From.GetLeader] подрывать [This.GetAdjective] Независимость, мы не можем игнорировать, что эта пропаганда оказывает значительное влияние на отношение среднего человека. [This.GetAdjective] Гражданин на пути к коммунизму и единому балканскому союзу."
 DOD_yugoslavia.183.t:0 "Панбалканское ополчение"
 DOD_yugoslavia.183.d:0 "По мере того, как коммунистические настроения продолжают назревать в нашей стране, среди крайне левых наших стран начинают формироваться многие небольшие военизированные группы. Оружие, о котором идет речь, должно быть [YUG.GetAdjective] Происхождение. Многие подозревают [From.GetLeader] Его режим планирует свергнуть [This.GetAdjective] Правительство в пользу еще одного, связанного с его новым [From.GetRulingIdeology] штат."
 DOD_yugoslavia.183.a:0 "Нам следует действовать осторожно."
 DOD_yugoslavia.184.t:0 "Коммунистические боевики требуют смены режима"
 DOD_yugoslavia.184.d:0 "Напряженность между [This.GetAdjective] Правительство и крестьянство достигли точки кипения — многие левые боевики вооружаются оружием, которое, как полагают, было приобретено у них. [From.GetNameDef]. Крестьяне теперь требуют, чтобы [This.GetLeader] Отречься от своего положения власти и предоставить его людям, которых он утверждает, что представляет. Их требования несут в себе неявное предупреждение о том, что неспособность сделать то, что они просят, приведет к тому, что крестьянство возьмет в руки оружие во имя нового. [From.GetRulingIdeology] правительство."
 DOD_yugoslavia.184.a:0 "Раз народ этого желает."
 DOD_yugoslavia.184.b:0 "Искоренить эту шайку невыносимых крестьян!"
 DOD_yugoslavia.50.t:0 "Гала-вечер в Гросвеноре"
 DOD_yugoslavia.50.desc:0 "Вопрос брака и престолонаследия в [YUG.GetNameDef] давно занимает политические круги. Столь долгий период без законного короля на престоле заставил некоторых усомниться в легитимности правления Карагеоргиевичей. Однако на недавнем гала-вечере в Лондоне сердце молодого короля Петра покорила прекрасная дворянка. Члены королевского кабинета уже обсуждают свадебные планы, чтобы скрепить романтическую привязанность короля браком. Несомненно, его избранница окажет долговременное дипломатическое влияние на нашу страну и, возможно, подтолкнёт другие державы к сближению с [YUG.GetNameDef]."
 DOD_yugoslavia.50.a:0 "Сердце короля принадлежит принцессе Александре Греческой."
 DOD_yugoslavia.50.b:0 "Принцесса Мария Франческа Итальянская."
 DOD_yugoslavia.50.c:0 "Принцесса Александрина Германская."
 DOD_yugoslavia.50.d:0 "Адельгейда фон Габсбург."
 DOD_yugoslavia.50.e:0 "Принцесса Мария-Франсуаза Испанская."
 DOD_yugoslavia.501.t:0 "[From.GetNameDefCap] ищет королеву"
 DOD_yugoslavia.501.desc:0 "Караджорджевичи из [From.GetNameDef] Они стремятся продолжить свою королевскую линию и свою нацию через королевская свадьба. Кажется, что [From.GetLeader] Он стал довольно увлеченным [Root.GetPrincessName]Королевская из [Root.GetFamilyName] Она попросила руки у своей семьи в браке. Если девушка согласится, они присоединятся. [From.GetNameDef] и [Root.GetNameDef] Вместе в крови. Хотя это не сразу приведет к совместному [From.GetAdjective]-[Root.GetAdjective] Альянс, это подтолкнет такую вещь стать возможной в ближайшем будущем."
 DOD_yugoslavia.501.a:0 "Свадьба звучит чудесно!"
 DOD_yugoslavia.501.b:0 "[Root.GetPrincessName] никогда не выйдет за [From.GetLeader]!"
 italian_princess_name:0 "Принцесса Мария"
 german_princess_name:0 "Принцесса Александрина"
 hungarian_princess_name:0 "Эрцгерцогиня Адельгейда"
 spanish_princess_name:0 "Принцесса Мария-Франсуаза"
 italian_dynasty_name:0 "Савойя"
 german_dynasty_name:0 "Гогенцоллерн"
 hungarian_dynasty_name:0 "Габсбург"
 spanish_dynasty_name:0 "Бурбон"
 DOD_yugoslavia.19.t:0 "Король [Root.GetLeader] достиг совершеннолетия!"
 DOD_yugoslavia.19.desc:0 "Взошедший на престол задолго до положенного срока из-за суровых обстоятельств мирового конфликта, король [Root.GetLeader] наконец достиг совершеннолетия и проявил себя мудрым и способным правителем. Теперь, когда на троне находится законный наследник надлежащего возраста, народ [YUG.GetNameDef] обрёл символ национального единства, вокруг которого можно сплотиться и за который стоит сражаться."
 DOD_yugoslavia.19.a:0 "Да здравствует король!"
 DOD_yugoslavia.502.t:0 "[From.GetPrincessName] согласна!"
 DOD_yugoslavia.502.desc:0 "Молодой король [Root.GetLeader] Он исповедовал свою любовь и преданность [From.GetPrincessName] публично через священные узы супружества на церемонии, проводимой в [Root.GetLondonBelgrade] Для того, чтобы порадовать толпу, свидетель сказочного романа двух влюбленных, сведенных вместе во время кризиса.[Root.GetWeddingGoodBad] Хотя эта свадьба не закрепляет создание каких-либо официальных церемоний. [yugoslavia_wedding_partner.GetAdjective]-[Root.GetAdjective] Альянс, кажется, уверен, что сотрудничество между этими странами здесь не заканчивается."
 DOD_yugoslavia.502.a:0 "Как романтично!"
 YUG_wedding_bad:0 "Назад домой [Root.GetNameDef]Однако молодой монарх сталкивается с большой критикой со стороны консерваторов. [Root.GetAdjective] Выбрать брак во время большого кризиса для нации."
 YUG_wedding_good:0 "От Белграда до Бухареста Балканы объединяются в праздновании Дня независимости. [Root.GetAdjective] Упорство монарха перед лицом растущей гибели."
 DOD_yugoslavia.503.t:0 "[From.GetPrincessName] отказывает!"
 DOD_yugoslavia.503.desc:0 "Хотя король [Root.GetLeader] Признавая свою любовь истинной, иноземная принцесса его мечты остается непоколебимой в его увлечении. После нескольких недель интенсивного ухаживания и романтики, [From.GetPrincessName] Она отклонила предложение короля о свадьбе, и ее решение было принято по публичному соглашению. [From.GetAdjective] правительство. Несмотря на то, что его презирали чувства, король по-прежнему решительно настроен на то, чтобы однажды найти подходящую королеву для своего королевства."
 DOD_yugoslavia.503.a:0 "Возможно, добрая принцесса Александра..."
 DOD_yugoslavia.60.t:0 "Коронация"
 DOD_yugoslavia.60.peter:0 "Впервые с начала 20-го века, [YUG.GetNameDef] видит своего монарха коронованного в Белградском соборе в несколько светском деле, отражающем религиозное разнообразие, присутствующее в современном мире. [YUG.GetAdjective] штат. Несмотря на то, что некоторые оспаривали способность молодого короля Петра править в столь юном возрасте, корона теперь покоится на его голове, и к лучшему или худшему будущему, она может быть использована для того, чтобы завладеть им. [YUG.GetNameDef] отдыхать в [YUG.GetHerHis] Руки."
 DOD_yugoslavia.60.paul:0 "Впервые с начала XX века монарх [YUG.GetNameDef] коронуется в Белградском соборе по традиционному сербскому православному обряду. Многие по-прежнему считают короля Павла узурпатором и скорее фашистским диктатором, чем достойным королём, но теперь корона покоится на его голове, и, к лучшему или худшему, будущее [YUG.GetNameDef] находится в [YUG.GetHerHis] руках."
 DOD_yugoslavia.60.a:1 "Да здравствует король!"
 DOD_yugoslavia.70.t:0 "[From.GetNameDefCap] желает подписать Тройственный пакт"
 DOD_yugoslavia.70.desc:0 "Телеграмма пришла из [From.GetLeader] то [Root.Capital.GetName] Сегодня выражается заинтересованность в подписании пакта о ненападении с фашистскими державами мира. Боязнь того, [SOV.GetAdjective] Вторжение и растущий национализм. [From.GetLeader] стремится выровнять [From.GetHerselfHimself] с [Root.GetNameDef]. Хотя это и не означает официального союза, но все же приводит к [From.GetNameDef] в сферу нашего влияния и ускорит процесс [From.GetAdjective] Вход в здание [Root.GetFactionName]."
 DOD_yugoslavia.70.a:0 "Мы согласны."
 DOD_yugoslavia.70.b:0 "У нас иные планы на [From.GetNameDef]."
 DOD_yugoslavia.701.t:0 "[From.GetNameDefCap] возражает!"
 DOD_yugoslavia.701.tripartite_rejection:0 "[From.GetLeader] Он откликнулся на [Root.GetAdjective] Предложение подписать Трехсторонний пакт с увольнением, заявив, что у них есть «другие идеи» для будущего нашего государства."
 DOD_yugoslavia.701.allied_objection:0 "Решение о подписании Трехстороннего пакта было глубоко спорным как внутри, так и за пределами нашей страны и бросило вызов легитимности. [Root.GetLeader]право выступать в качестве регента для короля Петра II, или если даже такое регентство необходимо. Группа офицеров из королевской [YUG.GetAdjective] Армия объявила Петра II совершеннолетним и [From.GetAdjective] Они вышли на Белград и потребовали немедленного удаления. [Root.GetLeader] от власти."
 DOD_yugoslavia.701.a:0 "У нас нет выбора, кроме как согласиться."
 DOD_yugoslavia.701.b:0 "К оружию!"
 DOD_yugoslavia.702.t:0 "[YUG.GetNameDefCap] подписывает Тройственный пакт"
 DOD_yugoslavia.702.desc:0 "Сегодня [YUG.GetAdjective] правительство присоединилось к фашистским странам и подписало Тройственный пакт. Хотя это и не означает, что [YUG.GetNameDef] вступает в [From.GetFactionName], данный шаг свидетельствует о растущем сближении двух стран и возможных симпатиях [YUG.GetLeader] к фашизму. Многие ожидают [Root.GetAdjective] ответа на это тревожное развитие событий, однако [Root.GetLeader] до сих пор хранит молчание…"
 DOD_yugoslavia.702.a:0 "[YUG.GetLeader] — незаконный правитель и трус!"
 DOD_yugoslavia.702.b:0 "Не вижу причин беспокоиться."
 DOD_yugoslavia.80.t:1 "[163.GetName] в обмен на союз"
 DOD_yugoslavia.80.desc:0 "Сегодня [From.GetLeader] объявил, что [From.GetNameDef] готова сблизиться с [Root.GetNameDef] и официально вступить в [Root.GetFactionName], но лишь в обмен на наш уход с Балкан и передачу контроля над регионом [163.GetName]."
 DOD_yugoslavia.80.a:0 "Звучит справедливо."
 DOD_yugoslavia.80.b:0 "Вместо этого им следует отдать [103.GetName]."
 DOD_yugoslavia.801.t:0 "[From.GetNameDefCap] требует [103.GetName]!"
 DOD_yugoslavia.801.desc:0 "Похоже, нашу делегацию в [From.GetNameDef] приняли недоброжелательно: посол в ответ потребовал передать им [103.GetName] в обмен на членство в [From.GetFactionName]."
 DOD_yugoslavia.801.a:0 "Что ж, хорошо."
 DOD_yugoslavia.801.b:0 "Ни в коем случае."
 DOD_yugoslavia.802.t:0 "[From.GetNameDefCap] соглашается!"
 DOD_yugoslavia.802.desc:0 "Напряжённость на границе с [From.GetNameDef] наконец будет устранена: [From.GetAdjective] правительство согласилось вернуть далматинские территории, находящиеся под [From.GetAdjective] оккупацией, их законным [YUG.GetAdjective] владельцам. Сегодня [Root.GetLeader] назвал [From.GetLeader] истинным другом [Root.GetAdjective] свободы и права на самоопределение, и отныне две страны будут двигаться вперёд как союзники."
 DOD_yugoslavia.802.a:0 "Всё идёт по плану."
 czech.1.t:0 "Членство в Коминтерне"
 czech.1.d:1 "В прошлом наши отношения с [CZE.GetAdjective] народом складывались неровно, но недавно его политика резко повернула в правильную сторону истории. В сочетании с растущим давлением со стороны [GER.GetNameDef] и недоверием к способности западных демократий защитить его это привело к официальной просьбе о вступлении в Коминтерн."
 czech.1.a:1 "Мы будем им только рады."
 czech.1.b:1 "Они ещё не готовы."
 czech.2.d:1 "[SOV.GetLeader] удовлетворил нашу просьбу о вступлении в Коминтерн. Наша делегация вошла в Исполнительный комитет с полным правом голоса."
 czech.3.d:1 "[SOV.GetLeader] отклонил нашу просьбу о вступлении в Коминтерн, не объяснив причин."
 czech.3.a:0 "Вот вам и славянское братство."
 czech.4.t:0 "[ROM.GetAdjective] проблема"
 czech.4.d:0 "Отношения с [ROM.GetNameDef] всегда были напряжёнными из-за оккупации нашей законной территории — Бессарабии. Но, словно этого было недостаточно, эта страна ещё и препятствует нам прийти на помощь нашим [From.GetAdjective] союзникам. Теперь те предложили решение: разделить [ROM.GetNameDEf] между нами и покончить с этой проблемой раз и навсегда!"
 czech.4.a:0 "Гениально в своей простоте."
 czech.4.b:0 "Мы найдём другое решение."
 czech.5.d:1 "[From.GetNameDefCap] одобряет наше решение [ROM.GetAdjective] проблемы. Армия готова, и мы можем начать кампанию в любой удобный момент."
 czech.6.d:1 "[From.GetLeader] отклонил наше предложение по [ROM.GetAdjective] проблеме. Похоже, у него всё ещё есть собственные планы на [ROM.GetNameDef]."
 czech.6.a:0 "Попытаться стоило."
 czech.7.t:0 "[POL.GetADjective] вопрос"
 czech.7.d:1 "С самого начала нашей борьбы за освобождение рабочих всего мира [POL.GetNameDef] лишь создавала нам проблемы. Наши [From.GetAdjective] союзники выдвинули заманчивое предложение: [POL.GetNameDef] отняла земли у обеих наших стран, так почему бы не отплатить ей той же монетой и не разделить [POL.GetNameDef] между нами?"
 czech.7.a:0 "И правда, почему бы и нет."
 czech.8.d:1 "[From.GetNameDefCap] одобряет предложенное нами решение [POL.GetAdjective] вопроса. Мы начнём операцию, как только будет отдан приказ."
 czech.9.d:1 "[From.GetNameDefCap] не одобряет наше предложение. Нам придётся выждать и рассмотреть другие варианты."
 czech.10.d:0 "Со времён окончания Великой войны Польша оккупирует немецкие земли. Более того, она постоянно нападала на соседей, стремясь расширить свою территорию. Наши [From.GetAdjective] союзники пришли к тому же выводу: ради мира в Европе мы должны уничтожить [POL.GetAdjective] государство."
 czech.10.a:0 "Приступим."
 czech.11.d:1 "[From.GetNameDefCap] одобряет наш план решения [POL.GetAdjective] вопроса. Мы сможем нанести удар сразу после завершения подготовки."
 czech.12.d:1 "[From.GetNameDefCap] отклоняет наше решение [POL.GetAdjective] вопроса. Время покажет, представится ли другая возможность."
 czech.14.t:0 "Словацкое восстание"
 czech.14.d:1 "С тех пор как мы отстранили их от власти, словацкие лидеры кипели от негодования и подстрекали население к насилию. Сегодня их слова наконец привели к войне, которой они так отчаянно добивались. Словацкое восстание началось."
 czech.14.a:0 "Раз они хотят войны, они её получат."
 czech.15.d:0 "Последние оплоты словацкой власти разгромлены. Восстанию положен конец."
 czech.15.a:0 "Победа!"
 czech.16.t:0 "[CZE.GetAdjective] народ в Оси?"
 czech.16.d:2 "Несмотря на первоначальные сомнения, [CZE.getAdjective] народ осознал, что большевизм действительно представляет непосредственную угрозу, и теперь просит принять страну в Ось. Правительство во главе с [CZE.GetLeader] прямо заявило, что это никак не влияет на вопрос Судетской области."
 czech.17.d:0 "[From.GetNameDefCap] принимает нашу просьбу о вступлении в Ось!"
 czech.17.a:0 "Превосходно!"
 czech.18.d:0 "[From.GetNameDefCap] отклоняет нашу просьбу о вступлении в Ось!"
 czech.18.a:0 "Досадно."
 czech.19.t:1 "Бесчестье вместо смерти"
 czech.19.d:1 "Правительство [From.GetLeader] наконец осознало то, что мы знали с самого начала: [From.GetNameDef] сможет продолжить существование только под нашей защитой. Хотя это исключает прямую оккупацию её земель, возможно, лучше обрести добровольного союзника и избежать вмешательства иностранных сил."
 czech.20.t:1 "Бесчестье вместо смерти"
 czech.20.d:1 "[From.GetLeader] принимает наше предложение. [From.GetAdjective] полномочный представитель прибыл в Прагу для координации политики."
 czech.20.a:0 "Это единственный путь."
 czech.21.t:1 "Бесчестье вместо смерти"
 czech.21.d:2 "Услышав наше предложение, [From.GetLeader], по сообщениям, воскликнул: «Да ни за тысячу лет!» — после чего разразился длинной тирадой о неполноценности нашего народа, нашей системы правления и лидерских качеств [CZE.GetLeader]. Официального отказа не последовало, но наш посол почти не питает надежд."
 czech.21.a:0 "Возможно, оно и к лучшему."
 czech.22.t:0 "Судетский вопрос"
 czech.22.d:1 "Правительство [From.GetNameDef] предложило передать нам Судетскую область в качестве первого шага к взаимопониманию. С одной стороны, это прекрасная возможность почти без затрат и риска получить богатую территорию. С другой — кризис вокруг Судетской области стал бы идеальным поводом показать миру, что так называемые великие державы, охраняющие Версальский договор, беззубы и морально ничтожны."
 czech.23.d:2 "[From.GetNameDefCap] принимает наше предложение. [From.GetAdjective] войска вошли в Судетскую область под приветственные возгласы местного населения."
 czech.23.a:0 "Теперь они наверняка не потребуют большего."
 czech.24.d:2 "[From.GetLeader] отклоняет наше предложение передать Судетскую область. Причин этого решения он не назвал, однако [From.GetAdjective] решение потрясло военных, которые полагают, что у [GER.GetNameDef] могут быть куда более масштабные планы в отношении нас."
 czech.24.a:0 "Поживём — увидим."
 czech.25.t:0 "[YUG.GetNameDef] в Антанте"
 czech.25.d:1 "Правительство [From.GetNameDef] решило восстановить союз «Малая Антанта», в последние годы пришедший в упадок на фоне растущего [GER.GetAdjective] влияния. Недавно министр иностранных дел этой страны посетил нашу столицу, чтобы обсудить наше вступление в союз в качестве постоянного участника."
 czech.26.d:1 "[From.GetNameDefCap] соглашается вступить в Антанту. Военная делегация прибыла для обсуждения оборонительных мер."
 czech.27.d:2 "Хотя [From.GetLeader] согласился встретиться с нашей делегацией, он отказался обязать свою страну вступить в Антанту. Похоже, [From.GetAdjective] сторона опасается, что присоединение к нашему союзу может нарушить хрупкий баланс сил в регионе."
 czech.28.t:0 "[ROM.GetNameDefCap] в Антанте"
 czech.32.t:0 "[CZE.GetAdjective]-[HUN.GetAdjective] сближение"
 czech.32.d:2 "Антанта во главе с [From.GetNameDef] долгое время была направлена на сдерживание нашей страны. Однако по мере роста могущества Германии [From.GetNameDef] всё сильнее ощущает угрозу с её стороны. Не желая противостоять опасности на два фронта, [From.GetLeader] теперь стремится достичь взаимопонимания с нами.\n\nНаше правительство расколото по этому вопросу. Одна группа считает, что соглашение с [From.GetNameDef] станет первым шагом к прорыву окружения, а другая указывает, что оно, несомненно, навлечёт на нас гнев [GER.GetLeader]."
 czech.32.a:1 "Мы принимаем их предложение."
 czech.32.b:0 "Никогда!"
 czech.33.d:2 "[From.GetLeader] оказался на удивление восприимчив к нашему предложению. Мы подписали Договор о взаимной дружбе, подтвердив, что ни одна из сторон не имеет территориальных претензий к другой."
 czech.33.a:0 "Лучше, чем мы ожидали!"
 czech.34.d:2 "Мало кого удивив, [From.GetLeader] отклонил наше предложение, сославшись на наше нежелание передать некоторые территории Венгрии."
 czech.34.a:1 "Значит, ничего нового."
 dod_news.1.t:1 "Малая Антанта восстановлена"
 dod_news.1.d:0 "Сегодня [From.GetName] объявила, что почти прекративший существование союз «Малая Антанта» вновь будет исполнять свои обязательства. В заявлении [From.GetAdjective] министерства иностранных дел говорится:\n«[From.GetName] — не великая, а региональная держава. Мы твёрдо верим, что союз региональных держав способен и будет препятствовать вмешательству так называемых великих держав в наши дела.»"
 dod_news.1.a:1 "Вместе мы — великая держава."
 dod_news.1.b:0 "Любопытное предложение."
 dod_news.1.c:0 "Мы не забыли, против кого он был создан."
 dod_news.1.e:0 "При необходимости мы всё равно быстро с ними расправимся."
 dod_news.1.f:0 "Поразительное развитие событий!"
 dod_news.2.a:0 "Мы будем сражаться бок о бок с новыми союзниками до самого конца."
 dod_news.2.b:0 "Они сделали мудрый выбор."
 dod_news.2.c:0 "Крайне тревожные новости."
 dod_news.2.t:0 "[CZE.GetNameDefCap] вступает в Ось"
 dod_news.2.d:0 "Потрясая большую часть Европы, [CZE.GetNameDef] подписывает союзный договор с [GER.GetNameDef]. В последние месяцы [CZE.GetNameDefCap], прежде твёрдо демократическая страна, всё дальше смещалась вправо."
 dod_news.3.t:0 "[CZE.GetNameDefCap] вступает в Коминтерн"
 dod_news.3.d:0 "Потрясая большую часть Европы, [CZE.GetNameDef] подписывает союзный договор с [SOV.GetNameDef]. В последние месяцы [CZE.GetNameDef], прежде твёрдо демократическая страна, всё дальше смещалась влево."
 dod_news.4.t:0 "[CZE.GetNameDefCap] уступает Судетскую область"
 dod_news.4.d:0 "Сегодня [CZE.GetNameDef], удивив многих, в одностороннем порядке передала Судетскую область государству [GER.GetNameDef]. На вопросы журналистов источник в [CZE.GetAdjective] министерстве иностранных дел ответил: «Было очевидно, куда дует ветер; это был единственный путь к национальному выживанию».\n\nПо сообщениям, неназванный [FRA.GetAdjective] министр осудил [CZE.GetAdjective] решение, заявив, что Запад поддержал бы [CZE.GetNameDef], если бы [GER.GetNameDef] оказала на неё давление."
 dod_news.4.a:0 "Иного выбора не было."
 dod_news.4.b:0 "Благодаря своей дальновидности они предотвратили кризис."
 dod_news.4.c:0 "Они выбрали мудро."
 dod_news.4.e:0 "Могли ли мы что-нибудь сделать?"
 DOD_romania.999.t:0 "Дань любви"
 DOD_romania.999.desc:0 "Необычайно пьяный и растроганный король Кароль II захватил сегодняшнее совещание по стратегии, потребовав всеобщего внимания к «гениальной» идее, пришедшей ему в голову прошлой ночью.\n\nБудучи в душе истинным романтиком, король со слезами на глазах заявил, что желает поведать женщинам в своей жизни о сильной и искренней любви, которую он к ним испытывает. Обратившись к начальникам штабов и членам кабинета с длинным, хотя и несколько невнятным монологом, он воззвал к их самым тонким и сердечным чувствам, а закончил торжественным требованием переименовать два великих вражеских города в честь самого необыкновенного и глубокого из известных человеку чувств — любви.\n\nКороль совершенно зациклился на этой идее и вряд ли легко отступит, если мы попытаемся его отговорить."
 DOD_romania.a:0 "Он и правда гений, сошедший с небес!"
 DOD_romania.b:0 "Лучше устроим праздник, чтобы его отвлечь. Очень большой праздник."
 DOD_romania.16.t:0 "[FROM.GetNameDefCap] стремится вступить в [ROOT.GetFactionName]"
 DOD_romania.16.desc:0 "Хотя сейчас страна состоит в союзе с [romania_former_ally_target.GetNameDef], перемены в [FROM.GetAdjective] правительстве сблизили её с [ROOT.GetAdjective] идеалами, и [FROM.GetLeader] выразил желание вступить в [ROOT.GetFactionName]. Это историческая возможность: пока враг повернулся к [FROM.GetNameDef] спиной, меньше всего он ожидает, что [FROM.GetAdjective] войска направят оружие против него."
 DOD_romania.16.a:0 "Добро пожаловать, [FROM.GetAdjective] друзья!"
 DOD_romania.161.t:0 "[FROM.GetNameDefCap] предаёт [ROOT.GetNameDef]!"
 DOD_romania.161.desc:0 "К несчастью, [FROM.GetAdjective] министр иностранных дел передал послание [FROM.GetNameDef], которое, вне всяких сомнений, является откровенным предательством [ROOT.GetFactionName] и [ROOT.GetRulingIdeology] идеалов! [FROM.GetNameDefCap] объявляет, что отныне будет сражаться на стороне [romania_new_ally_target.GetFactionName]."
 DOD_romania.161.a:0 "Нам следовало знать, что [FROM.GetLeader] нельзя доверять!"
 DOD_romania.162.t:0 "[romania_new_ally_target.GetNameDefCap] соглашается!"
 DOD_romania.162.desc:0 "Нам сообщили, что [romania_new_ally_target.GetNameDef] удовлетворила нашу просьбу о вступлении в [romania_new_ally_target.GetFactionName], и вскоре [romania_former_ally_target.GetLeader] узнает, как сражается настоящий [ROOT.GetAdjective] солдат."
 DOD_romania.162.a:0 "К оружию!"
 DOD_romania.163.t:0 "Кодряну умирает"
 DOD_romania.163.desc:0 "Кодряну представлял угрозу будущему Румынии. Ради стабильности его безрассудные действия послужили основанием для ареста. Его смерть станет ценным напоминанием о том, что каждый может стать либо хорошим примером, либо страшным предостережением. Румынских фашистов ждёт более сдержанный и ответственный лидер."
 DOD_romania.163.a:0 "Ушёл, но не забыт."
 DOD_romania.601.t:0 "[FROM.GetName] предлагает разделить [YUG.GetNameDef]"
 DOD_romania.601.desc:0 "Наблюдая за внутренними распрями, охватившими [YUG.GetNameDef], [ROM.GetLeader] решил продолжить [ROM.GetHerHis] политику господства на Балканах и разделить [YUG.GetAdjective] народ между несколькими местными державами. [Root.GetNameDefCap] входит в число стран, приглашённых к разделу [YUG.GetNameDef]. Хотя это заманчивая возможность расширить наши владения на Балканах, в случае отказа [YUG.GetNameDef] принять ультиматум мы будем обязаны вступить в конфликт."
 DOD_romania.601.a:0 "Превосходная идея!"
 DOD_romania.601.b:0 "Возможно, нам лучше не вмешиваться."
