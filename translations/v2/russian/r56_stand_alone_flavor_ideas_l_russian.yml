 ELS_banana_republic_desc:0 "Мы находимся под влиянием иностранных фруктовых компаний, контролирующих значительную часть экономики. Наша экономика сильно зависит от экспорта бананов, поэтому выделять ресурсы другим отраслям будет трудно."
