 AFG_graveyard_of_empires:0 "Кладбище империй"
 AFG_graveyard_of_empires_desc:0 "Вторжение в Афганистан на протяжении всей истории было проблематичным даже для самых сильных империй. Полное подчинение афганского народа — нелегкий подвиг!"
 ECU_chocolate_exports:0 "Экспорт какао"
 ECU_chocolate_exports_desc:0 "Пока многие страны мира испытывают экономические трудности, наш экспорт, особенно какао, вырос. Благодаря этому наша экономика остаётся стабильной."
