 raj_military_research:0 "Военные исследования"
 army_research_navy:0 "Фокус на морских исследованиях"
 army_research_navy_desc:0 "Индию никогда не считали великой морской державой, но, возможно, пришло время это изменить."
 army_research_airplane:0 "Фокус на авиационных исследованиях"
 army_research_airplane_desc:0 "Без надлежащей поддержки с воздуха наши линкоры и артиллерийские позиции уязвимы."
 army_research_armour:0 "Ориентация на исследования брони"
 army_research_armour_desc:0 "Пересечь большие равнины и пустыни Индии, чтобы обеспечить наших солдат бронетехникой, значительно повысит нашу эффективность."
 army_research_artillery:0 "Фокус на исследованиях артиллерии"
 army_research_artillery_desc:0 "Тактика пехотной атаки давно устарела и должна уступить место стратегическим обстрелам вражеских укреплений."
 army_research_infantry:0 "Фокус на исследованиях пехотного вооружения"
 army_research_infantry_desc:0 "Наше стрелковое оружие давно уступает иностранным образцам. Инвестиции в разработку винтовок помогут создать высокоэффективную армию."
