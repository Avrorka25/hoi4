 princely_state_independence_desc:0 "Индия скоро приближается к независимости, и вопрос о централизованном правительстве беспокоит многих принцев, правящих территорией, на которую претендует Индия.\nМы можем потребовать, чтобы они выбрали сторону в любое время, но если мы будем действовать слишком быстро, они, скорее всего, решат против объединения.[RAJ.GetVariableEnable]"
 princely_state_independence_variable:0 "\n\n§g[428.GetPrinceName]§! из §g[428.GetName]§! имеет §Y[?428.voting_chance]%§! Шанс принять решение в пользу.\n§g[433.GetPrinceName]§! из §g[433.GetName]§! имеет §Y[?433.voting_chance]%§! Шанс принять решение в пользу.\n§g[437.GetPrinceName]§! из §g[437.GetName]§! имеет §Y[?437.voting_chance]%§! Шанс принять решение в пользу.\n§g[427.GetPrinceName]§! из §g[427.GetName]§! имеет §Y[?427.voting_chance]%§! Шанс принять решение в пользу.\n§g[425.GetPrinceName]§! из §g[425.GetName]§! имеет §Y[?425.voting_chance]%§! Шанс принять решение в пользу.\n§g[1013.GetPrinceName]§! из §g[1013.GetName]§! имеет §Y[?1013.voting_chance]%§! Шанс принять решение в пользу.\n[RAJ.PakistanOwned]"
