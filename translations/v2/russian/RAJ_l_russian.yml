 pak01flat:0 "[PAK.GetFlag]§Yпакистанское§! §Yвлияние§! уменьшится на 1"
 ind07:0 "[RAJ.GetFlag]§Yиндийское§! ежедневное §Yвлияние§! увеличится на 0.07"
 indian_provincial_election:0 "Провинциальные выборы в Индии"
 indian_provincial_election_desc:0 "Провинциальные выборы в Индии уже близко, и крупнейшие политические движения борются за влияние в провинциях. Их результаты, предусмотренные Законом об управлении Индией, определят будущее субконтинента.\n\n§YИндийский национальный конгресс§! контролирует §Y[?inc_control]§!% провинций.\n§YЮнионистская партия§! контролирует §Y[?upa_control]§!% провинций.\n§YНезависимая рабочая партия§! контролирует §Y[?ifb_control]§!% провинций.\n§Y[?neutral_control]§!% провинций контролируются §gпартиями меньшинств§! или находятся в тупиковой ситуации.\n\nЧем больше провинций контролирует победившая партия, тем легче будет мирно добиться независимости."
 indian_provincial_election_map:0 "Мы можем увеличить влияние нашей партии в этих регионах"
 indian_provincial_enemy_election:0 "Кампания оппозиционной партии"
 indian_provincial_enemy_election_desc:0 "В человеке не хватает духа, чтобы описать, сколько различных политических партий и организаций принимают участие в провинциальных выборах, и хотя наши предвыборные достижения были впечатляющими, оппозиция не спала. Напротив, по всей Индии проходят постоянные митинги и дискуссии."
 indian_provincial_election_enemy_map:0 "Оппозиционная партия усиливает влияние в этом регионе"
 congress_majority:0 "Большинство Индийского национального конгресса"
 congress_majority_desc:0 "§O[From.GetName]§! §Wсейчас находится под влиянием §CИндийского национального конгресса§!\nВлияние §CИндийского национального конгресса§!: §G[?From.inc_state]§!\nВлияние §CЮнионистской партии§!: §G[?From.upa_state]§!\nВлияние §CНезависимой рабочей партии§!: §G[?From.ifb_state]§!\nВлияние §gмалых партий§!: §G[?From.neutral]§!\n"
 united_party_majority:0 "Большинство Юнионистской партии"
 united_party_majority_desc:0 "§O[From.GetName]§! §Wсейчас находится под влиянием §CЮнионистской партии§!\nВлияние §CИндийского национального конгресса§!: §G[?From.inc_state]§!\nВлияние §CЮнионистской партии§!: §G[?From.upa_state]§!\nВлияние §CНезависимой рабочей партии§!: §G[?From.ifb_state]§!\nВлияние §gмалых партий§!: §G[?From.neutral]§!\n"
 all_india_forward_bloc_majority:0 "Большинство Независимой рабочей партии"
 all_india_forward_bloc_majority_desc:0 "§O[From.GetName]§! §Wсейчас находится под влиянием §CНезависимой рабочей партии§!\nВлияние §CИндийского национального конгресса§!: §G[?From.inc_state]§!\nВлияние §CЮнионистской партии§!: §G[?From.upa_state]§!\nВлияние §CНезависимой рабочей партии§!: §G[?From.ifb_state]§!\nВлияние §gмалых партий§!: §G[?From.neutral]§!\n"
 neutral_stalemate:0 "Контроль меньшинств или тупик"
 neutral_stalemate_desc:0 "§O[From.GetName]§! §Wнаходится в тупиковой ситуации или под контролем §gпартий меньшинств§!\nВлияние §CИндийского национального конгресса§!: §G[?From.inc_state]§!\nВлияние §CЮнионистской партии§!: §G[?From.upa_state]§!\nВлияние §CНезависимой рабочей партии§!: §G[?From.ifb_state]§!\nВлияние §gмалых партий§!: §G[?From.neutral]§!\n"
 invite_george_orwell_to_speak:0 "Пригласить Джорджа Оруэлла выступить"
 invite_george_orwell_to_speak_desc:0 "Джордж Оруэлл, известный писатель и автор «Дней в Бирме», давно является заметным сторонником британской Независимой рабочей партии. Выступление столь образованного человека поможет распространению наших идей."
 princely_state_mod:0 "Княжеское государство"
 princely_state_mod_desc:0 "Княжеское государство — феодальный вассал Британского Раджа, обладающий некоторой автономией и монархическим устройством. Оно остаётся частью Раджа, не участвует в выборах и может сопротивляться объединению Индии."
 princely_state_independence_mod:0 "Независимое княжеское государство"
 princely_state_independence_mod_desc:0 "Княжеские государства были вассалами Британского Раджа. Однако после чрезмерных требований британской администрации и индийского правительства князья выступили против центральной власти и создали независимые владения."
 marginalized_muslims:0 "Маргинализированные мусульмане"
 marginalized_muslims_0:0 "Угнетённые мусульмане"
 marginalized_muslims_1:0 "Маргинализированные мусульмане"
 marginalized_muslims_2:0 "Оставленные без внимания мусульмане"
 marginalized_muslims_3:0 "Защищённые мусульмане"
 marginalized_muslims_4:0 "Мусульмане с расширенными правами"
 marginalized_muslims_desc:0 "Отношения между индуистами и мусульманами Южной Азии, живущими в одном государстве, всегда были напряжёнными. При подавляющем численном превосходстве индуистов в Индии необходимо тщательно уравновешивать интересы большинства и меньшинств."
 slight_religious_minority:0 "Религиозные меньшинства"
 placated_muslims:0 "Умиротворённые мусульмане"
 placated_muslims_desc:0 "Мы успешно улучшили отношения с мусульманами Синда, Пенджаба и Бенгалии, и теперь они гораздо охотнее сотрудничают."
 enraged_muslims:0 "Разъярённые мусульмане"
 enraged_muslims_desc:0 "Недавние действия администрации разгневали мусульманское население и надолго испортили наши отношения."
 princely_state_policing_action:0 "[From.GetOperationName]"
 princely_state_policing_action_default:0 "Полицейская операция в регионе [From.GetName]"
 princely_state_policing_action_desc:0 "Выходки [From.GetPrinceName] больше нельзя терпеть! Мы должны немедленно положить конец его средневековому владению."
 operation_or_cooldown:0 "Не проводит и недавно не проводило полицейскую операцию."
 integrated_princely_states:0 "Интегрированные княжеские государства"
 prince_state_force:0 "Открывает §Yрешения§! для захвата оставшихся §Yкняжеских государств§! военной силой."
 raj_lin_investment_running:0 "Сейчас ведётся поиск инвестиций"
 RAJ_Jinnahs_Kingdom_compliance:0 "Интеграция наших мусульманских товарищей"
 india.411.t:0 "Чрезвычайно успешная операция"
 india.411.desc:0 "Новообразованные индийские военные без труда прорвались сквозь жалкую оборону, созданную [?current_prince_state.GetPrinceName] из [?current_prince_state.GetName] с минимальными потерями. Его жалкое оправдание страны снова стало индийским."
 india.411.a:0 "Наша армия способна на всё."
 india.412.t:0 "Успешная операция"
 india.412.desc:0 "Новая индийская армия провела профессиональное тактическое вторжение на земли государства [?current_prince_state.GetName]. Войска, которыми командовал [?current_prince_state.GetPrinceName], были разгромлены, а наши потери оказались невелики."
 india.412.a:0 "Отличная работа, бойцы."
 india.413.t:0 "Ужасная операция"
 india.413.desc:0 "Новообразованные, дезорганизованные индийские вооруженные силы испытывали значительные трудности при прорыве впечатляющих оборонительных сооружений, созданных военными. [?current_prince_state.GetPrinceName] из [?current_prince_state.GetName]. После того, как погибло так много индейцев, пришло время примирить и восстановить местную администрацию."
 india.413.a:0 "Нужно расширить подготовку."
 india.414.t:0 "Катастрофическая операция"
 india.414.desc:0 "Индийская общественность возмущена последним отчётом о потерях. Небольшая полицейская операция превратилась в дорогостоящую битву, а тела индийских солдат усеяли окраины границ государства [?current_prince_state.GetName]. Международные наблюдатели поражены военной мощью, которую сумел собрать [?current_prince_state.GetPrinceName]. Государство [?current_prince_state.GetName] в итоге пало, но какой ценой?"
 india.414.a:0 "Позовите генерала."
 india.415.t:0 "Уход британцев"
 india.415.desc:0 "После того, как британцы отделились от континента, гордо после трех столетий порабощения, над зданием парламента в Нью-Дели был поднят индийский триколор. Англичане ушли, а Индия проснулась, решив отправиться в будущее и определить свою судьбу."
 india.415.a:0 "Светлый день."
 india.416.t:0 "Уход британцев"
 india.416.desc:0 "После того, как британцы отделились от континента, гордо после трех столетий порабощения, над зданием парламента в Нью-Дели был поднят индийский триколор. Но на северо-западе Индии это была совсем другая история. Над зданием Ассамблеи Синда пролетел исламский полумесяц на темно-зеленом фоне, узнаваемо не индийский флаг. Несмотря на то, что наши усилия по достижению независимости должны считаться монументальными, Всеиндийская мусульманская лига приобрела слишком большое влияние, чтобы мы могли сохранить наши западные и бенгальские провинции. Поскольку мечта о единой Индии лежит в руинах, давайте посмотрим в будущее."
 india.416.a:0 "Единой Индии больше нет."
 india.416.b:0 "Благородный способ защитить меньшинства."
 india.417.t:0 "Открылась пятьдесят вторая сессия Конгресса"
 india.417.desc:0 "Пять лет руководства Джавахарлала Неру были плодотворными для Индийского национального конгресса, однако после его длительного политического господства многие члены Конгресса желают нового лидера. Подсчитываются последние голоса, и..."
 india.417.a:0 "...Неру получает ещё пять лет!"
 india.417.b:0 "...Прасад стремительно занимает пост!"
 india.418.t:0 "Вопрос руководства"
 india.418.desc:0 "Сикандар Хаят Хан скончался и больше не может нести бремя руководства Индией. Юнионистская партия, строившаяся вокруг этого государственного деятеля, оказалась в смятении. Тем не менее необходимо смотреть в будущее и обеспечить эффективное руководство на ближайшие годы."
 india.418.a:0 "Президент Хизар Тивана!"
 india.419.t:0 "Бхопальский конгресс"
 india.419.desc:0 "Когда Амбедкар услышал слухи о широкой электоральной поддержке Коммунистической партии Индии, теперь, когда его основная цель ликвидации кастовой системы была в значительной степени достигнута, он задался вопросом, была ли его цель уже выполнена и могло ли новое руководство решить проблемы, которые он, возможно, не видел. Он был уверен, что на Бхопаловском конгрессе он должен публично объявить о своем решении."
 india.419.a:0 "Ещё пять лет!"
 india.419.b:0 "Возможно, новое руководство лучше послужит Индии."
 india.420.t:0 "Доклад ЦБР — Хайдарабад"
 india.420.desc:0 "Центральное бюро расследований подтвердило, что множество великих держав намерены поддержать независимость Хайдарабада, тем самым узаконив это жалкое подобие государства. Мы должны действовать быстро, прежде чем они создадут постоянные дипломатические представительства!"
 india.420.a:0 "Какие же они глупцы."
 india.430.t:0 "Доклад ЦБР — Сикким"
 india.430.desc:0 "Центральное бюро расследований подтвердило, что множество великих держав намерены официально признать независимость Сиккима, тем самым узаконив это жалкое подобие государства. Мы должны действовать быстро, прежде чем они создадут постоянные дипломатические представительства!"
 india.430.a:0 "Какие же они глупцы."
 india.421.t:0 "Участие Индии"
 india.421.desc:0 "Хотя наша администрация, корабли и войска покинули Индийский субконтинент, мы решили хотя бы на переходный период защищать суверенитет Индии и Пакистана. Большинство советников выступает за полное политическое невмешательство, но гарантии того, что Индия не попадёт в чужие руки, также могут быть полезны."
 india.421.a:0 "Сообщить послу."
 india.421.b:0 "Ситуация складывается идеально."
 india.422.t:0 "Мировая арена"
 india.422.desc:0 "Обеспечив внутреннюю стабильность, пора укрепить международное положение. Партия и страна были разделены во мнениях о вступлении в международные союзы, но решительное руководство добилось принятия решения. Теперь ведущие дипломаты ждут указаний, куда направить свои усилия."
 india.422.descalt:0 "Самое логичное или практичное решение нередко оказывается ловушкой. Переговоры идут не слишком хорошо, и, возможно, разумнее обратиться в другое место."
 india.422.c:0 "Отправляемся в Нанкин."
 india.422.j:0 "Отправляемся в Токио."
 india.422.s:0 "Отправляемся в Бангкок."
 india.422.i:0 "Отправляемся в Тегеран."
 india.422.e:0 "Отправляемся в Аддис-Абебу."
 india.422.p:0 "Отправляемся в Карачи."
 india.422.r:0 "Отправляемся в Москву."
 india.422.it:0 "Отправляемся в Рим."
 india.422.tu:0 "Отправляемся в Анкару."
 india.422.f:0 "Отправляемся в Париж."
 india.422.sp:0 "Отправляемся в Мадрид."
 india.423.t:0 "Индия стремится вступить в альянс [Root.GetFactionName]"
 india.423.desc:0 "После трёх веков британского господства Индия освободилась от оков колониализма и вступила на новый путь. Она создала демократическое правительство, укрепила внутреннюю политику и задумалась о своём месте на мировой арене. Индийцы пришли к выводу, что союз с нами принесёт им наибольшую пользу. Можем ли мы сказать то же самое?"
 india.423.a:0 "Конечно!"
 india.423.b:0 "Оппортунистическая попытка расширить влияние."
 india.424.t:0 "Приход к власти партии [RAJ.GetReigningGovernment]"
 india.424.d:0 "При подавляющей поддержке народа это было неизбежно для народа. [RAJ.GetReigningGovernment] Стать законной правящей партией Индии"
 india.424.a:0 "Президент Неру"
 india.424.b:0 "Президент Хаят Хан"
 india.424.c:0 "Президент Амбедкар"
 india.425.t:0 "Утрата статуса доминиона"
 india.425.d:0 "Из-за недавних политических событий наш статус государства [Root.GetName] больше не действует, и независимость будет достигнута без дальнейших формальностей."
 india.425.a:0 "Вперёд."
 RAJ_AFG_Railway_Alignment:0 "Железная дорога Пенджаб — Ташкент"
 RAJ_AFG_Railway_Alignment_desc:0 "Новый союз с Москвой требует перевозки товаров, войск и информации между нашими странами. Из-за последствий Большой игры Афганистан преграждает путь к этой цели. Подчинение его нашим интересам значительно укрепит связи с Советским Союзом."
 raj_first_five_year_plan:0 "Первый этап пятилетнего плана"
 RAJ_full_speed_ahead:0 "Пятилетний план"
 RAJ_failed_five_year_plan:0 "Провал пятилетнего плана"
 RAJ_reformed_airforce_command:0 "Централизованное командование ВВС"
 RAJ_deterrence:0 "Сдерживание"
 india.426.t:0 "Предложение от альянса [RAJ.GetFaction]"
 india.426.d:0 "С союзом между Индией и Советским Союзом мы, естественно, опасались совместного вмешательства, чтобы соединить их две экономики и вооруженные силы. С нынешним индийским предложением на столе [ROOT.GetLeader] Эти страхи догнали Афганистан. Строительство железной дороги, соединяющей Пенджаб с республиками Средней Азии Советского Союза, будет полностью финансироваться двумя державами с дополнительными экономическими стимулами для нашей экономики. Недостатком, естественно, было бы усиление контроля над нами со стороны Дели и Москвы.\n\nвечно растущий [AFG.GetCommunistParty] Он четко обозначил свою позицию в требовании [AFG.GetRulingParty] Правительство приняло это предложение."
 india.426.a:0 "Уступить давлению."
 india.426.b:0 "Советы не получат свой коридор."
 india.427.t:0 "Цели пятилетнего плана"
 india.427.d:0 "На письменном столе [RAJ_Leader_Description] [RAJ.GetLeader] Мы подготовили два предложения по реализации нашего первого пятилетнего плана. Первый план, хотя и менее амбициозный, предусматривает увеличение строительных мощностей для инфраструктурных проектов и производства оружия. Многие в нашем правительстве отдали предпочтение второму плану, в котором экономический рост наших отраслей тяжелой промышленности является наивысшим из всех приоритетов. Утверждается, что в настоящее время мы не представляем промышленной мощи для поддержки тех частей нашей экономики, которые были определены в первом предложении."
 india.427.a:0 "Разнообразить наши цели."
 india.427.b:0 "Ускорить промышленное производство."
 india.428.t:0 "Распределение средств"
 india.428.d:0 "Бывшие княжеские государства должны занять равное место в Индии наряду с бывшими провинциями как штаты союза. Хотя наша инициатива стремится достичь этой цели, экономические советники предлагают направить более глубокие инвестиции в один из двух конкретных штатов. Любопытно, что выбор рекомендуемого штата зависит от религии советника."
 india.428.a:0 "Инвестировать в западный регион."
 india.428.b:0 "Инвестировать в центральный регион."
 raj_five_year_goal_tt:0 "В течение следующего года мы планируем расширить нашу отрасль за пределы §G[?projected_factories_calc]§! §YГражданские заводы§!.\n\nВ случае успешного предоставления грантов на §Y1460§! Дни:\n"
 RAJ_industrial_mismanagement:0 "Неэффективное управление промышленностью"
 RAJ_industrial_mismanagement_desc:0 "После полного провала пятилетнего плана множество чиновников было уволено, а Комиссии экономического планирования потребуется время на восстановление."
 india.440.t:0 "Слухи о голоде"
 india.440.desc:0 "В последнее время сельскохозяйственное производство в Бенгалии находится в застое, несмотря на устойчивый рост населения и высокий спрос на работу. Этот застой часто связывают с отчуждением крестьян от обрабатываемой ими земли и откровенным стремлением землевладельцев к власти. Ситуация давно остаётся напряжённой, но провал муссонных дождей может привести к куда худшему исходу — голоду. Очевидно, Индия не способна произвести достаточно продовольствия для населения Бенгалии, и единственная надежда избежать катастрофы — импорт иностранных товаров. Мы должны как можно яснее донести миру всю тяжесть положения, иначе погибнут миллионы невинных людей."
 india.440.a:0 "У русского медведя найдётся чем поделиться."
 india.440.b:0 "Янки нас выручат."
 india.440.c:0 "Британцы наверняка желают нам добра."
 india.440.d:0 "Безосновательные слухи."
 india.441.t:0 "Голод в Индии"
 india.441.desc:0 "Из-за неудачных муссонов Индия, в частности Бенгалия, направляется к голоду, и администрация взывает о нашей помощи и поставках. Если мы ответим на этот призыв к действию, индийское правительство и население, безусловно, будут благосклонно относиться к нашей нации. Кроме того, доставка продуктов питания является моральным выбором, и некоторые могут сказать, что это наш моральный долг. Но если ресурсы доступны, мораль не должна решать."
 india.441.sov.desc:0 "Из-за безрассудной британской колониальной администрации Индия приближается к голоду, и многие местные политики обратились за помощью к нашему процветающему Союзу. По мнению специалистов, без внешних поставок миллионы людей могут погибнуть от голода. Помимо сомнительной нравственности отказа, помощь может пробудить индийский народ и показать ему пренебрежение и угнетение, которым он подвергался три столетия. Генеральный секретарь, выбор за вами."
 india.441.a:0 "Мы снабдим наших товарищей в Индии!"
 india.441.b:0 "Отправить припасы, а вместе с ними немного демократии."
 india.441.c:0 "Всё ради жемчужины империи."
 india.441.d:0 "У нас недостаточно ресурсов."
 india.442.t:0 "Ответ государства [From.GetAdjective]"
 india.442.desc:0 "Кажется, что [From.GetLeader] Он много думал о своем ответе и, к счастью, ради миллионов жизней, поставленных на карту, он выступил в пользу поставок продовольствия за счет своей собственной экономики."
 india.442.a:0 "Бенгалия вздыхает с облегчением"
 india.443.t:0 "Ответ государства [From.GetAdjective]"
 india.443.desc:0 "Мы получили трусливый ответ от [From.GetLeader], который сослался на якобы нехватку ресурсов, оправдывая решение позволить миллионам умереть напрасно. Индия этого не забудет."
 india.443.a:0 "Наступил ад."
 colony_of_burma:0 "Колония Бирма"
 colony_of_burma_desc:0 "В 1937 году колония Бирма была отделена от Британского Раджа и больше не подчиняется его администрации."
 india.444.t:0 "Начало Имперской конференции"
 india.444.desc:0 "После коронации король Георг VI и его супруга королева Елизавета созвали очередную Имперскую конференцию для обсуждения дел империи в эти трудные времена. Ожидаются переговоры о более единой экономической и военной политике."
 india.444.a:0 "Заманчивое предложение."
 india.445.t:0 "Приглашение в СААРК"
 india.445.d:0 "Недавно созданное государство [RAJ.GetNameDef] приступило к формированию экономического союза под названием «Ассоциация регионального сотрудничества Южной Азии», сокращённо СААРК, чтобы бороться с империализмом и отсталостью региона. Нас пригласили присоединиться к новому экономическому блоку."
 india.445.a:0 "Заманчивое предложение."
 india.445.b:0 "Мы не станем менять одного эксплуататора на другого."
 india.446.t:0 "Визит в государство [PRC.GetNameDef]"
 india.446.desc:0 "В наших недавних усилиях по борьбе с азиатским колониализмом мы сосредоточились на наших угнетенных братьях, непосредственно занятых европейскими державами. Но это критическая слабость игнорировать, например, народ Китая, который страдал от западного влияния, слабого управления и плохих условий жизни. До тех пор, пока не появится альтернатива в коммунистическом движении Маоса. На родине Китая мы должны решить, что китайский народ может использовать в качестве помощи."
 india.446.a:0 "Стрелковое оружие для защиты и освобождения Китая!"
 india.446.b:0 "Политическая поддержка для укрепления КНР."
 india.446.c:0 "Промышленная помощь для поддержки китайских рабочих."
 india.447.t:0 "Прибывает [RAJ.GetAdjective]ая помощь!"
 india.447.desc:0 "Новая демократическая, независимая и социалистическая Индия оказала нам бесценную помощь, которую китайский народ никогда не забудет."
 india.447.a:0 "Это индийское оружие остановит угнетателей."
 india.447.b:0 "Эта политическая поддержка значительно поможет Коммунистической партии Китая."
 india.447.c:0 "Новые предприятия поддержат китайских рабочих."
