 RAJ_Expanding_the_Indian_Air_Force:0 "Расширение ВВС Индии"
 RAJ_Expanding_the_Indian_Air_Force_desc:0 "Военно-воздушные силы Индии ускоряют подготовку пилотов и производство самолётов, чтобы очистить небо над субконтинентом."
 RAJ_Caste_Debuff_4:0 "Сегрегационная кастовая система"
 RAJ_Caste_Debuff_4_desc:0 "Очень спорный момент"
 RAJ_Caste_Debuff_3:0 "Кастовая система"
 RAJ_Caste_Debuff_3_desc:0 "Некоторые версии Кастовых систем существовали с древней Индии, но со временем они были преобразованы, чтобы лучше соответствовать нынешнему императору Индии и британскому раджу. На самом деле кастовая система была четко определена и широко использовалась британской администрацией. Он проникает во все аспекты индийского общества, от ограничения поступления в университеты до строго запланированных и ограничительных военных. Одни считают его безнравственным злом, другие — логической организацией общества."
 RAJ_Caste_Debuff_3_mit:0 "Смягчённая кастовая система"
 RAJ_Caste_Debuff_3_mit_desc:0 "Наихудшие излишества кастовой системы были смягчены, хотя неравенство между общинами и социальными классами по-прежнему широко распространено."
 RAJ_Caste_Debuff_2:0 "Реформированная кастовая система"
 RAJ_Caste_Debuff_2_desc:0 "Ликвидировать кастовую систему в столь традиционном обществе непросто, однако постоянное движение к равенству неизбежно приведёт к лучшему результату."
 RAJ_Caste_Debuff_1:0 "Кастовая система упразднена законом"
 RAJ_Caste_Debuff_1_desc:0 "Несмотря на сопротивление и протесты, мы наконец добились полного юридического равенства и будем обеспечивать его соблюдение всей необходимой решимостью."
 RAJ_Caste_Buff:0 "Полностью ликвидированная кастовая система"
 RAJ_Caste_Buff_desc:0 "Правовое равенство — это хорошо и хорошо, но из-за сотен лет дискриминации многие районы по-прежнему бедны и им все еще будет трудно вырваться из этого. Именно поэтому позитивные действия в отношении этих общин являются единственным моральным вариантом."
 RAJ_Establishing_National_Government:0 "Создание национального правительства"
 RAJ_Establishing_National_Government_desc:0 "Мы разрабатываем конституцию и вместе с ней впервые в истории создаём собственное демократическое правительство всего субконтинента, готовое противостоять любым испытаниям."
 RAJ_Expanded_Police_Force:0 "Расширенная полиция"
