 RAJ_provincial_election_countdown_desc:0 "Скоро провинциальные выборы завершатся, но положение индийцев почти не изменится. Выборы не дают местным партиям реальной власти для противодействия вице-королю. Этот тяжёлый факт может подтолкнуть радикальную часть населения к восстанию. Мы должны действовать крайне осторожно."
 english_departure:0 "§YИндийский флаг§! поднимается над Красным фортом, и §YИндия становится свободной§!."
 india.intro.t:0 "Начинаются провинциальные выборы в Индии"
 india.intro.desc:0 "Всего год назад Имперский законодательный совет сделал важный шаг к перестройке администрации Британского Раджа. Среди прочего он предусмотрел первые всеобщие выборы в Индии. Хотя избирательные права всё ещё ограничены, а землевладельцы сохраняют огромную власть, это первый шаг к демократии. Политический спектр участников первого проявления демократических прав в Индии чрезвычайно широк, поэтому у граждан есть множество вариантов. Но чем завершится это историческое политическое зрелище? Укрепят ли британцы своё господство? Поведут ли радикалы Индию к независимости? Покажет лишь время."
 india.intro.a:0 "Британское правление не обсуждается."
 india.intro.b:0 "Это подчинение длится слишком долго!"
 india.intro.c:0 "Перед лицом империализма выборы бессмысленны."
 india.1.t:0 "Великобритания берёт Аден под контроль"
 india.1.desc:0 "Порт Аден является одним из важнейших узлов торговли между Индией, Европой и Дальним Востоком. Закон об управлении Индией 1935 года предусматривал передачу порта под прямой контроль правительства в Лондоне, тогда как ранее он управлялся как провинция главного комиссара. Теперь британское правительство официально взяло порт под контроль и создало отдельную колонию."
 india.1.a:0 "Как и планировалось"
 india.4.t:0 "Итоги провинциальных выборов в Индии 1937 года"
 india.4.desc:0 "После года предвыборной борьбы выделились три крупные партии, сражавшиеся за влияние на будущее Индии, но только одна получила широкую поддержку в достаточном числе провинций и завоевала большинство. На неё ляжет ответственность за будущее Индии и защиту её граждан от любых испытаний."
 india.4.a:0 "Индийский национальный конгресс победил на выборах!"
 india.4.b:0 "Юнионистская партия победила на выборах!"
 india.4.c:0 "Независимая рабочая партия победила на выборах!"
 r56_raj.5.t:0 "Свободная Индия объявлена"
 r56_raj.5.d:0 "Субхас Чандра Бос давно создавал поддержку, особенно в Бенгалии, для вооружённого отделения от Британской империи. Теперь напряжение достигло предела, и «Азад Хинд» оказался в состоянии войны с Британским Раджем. Реакция населения неоднозначна: одни критикуют восстание за авторитарный характер правительства, другие хвалят его за продвижение независимости Индии.\n\nБританский Радж спешно организует оборону против мятежа, хотя уже ожидается, что диверсии парализуют администрацию. [ENG.GetLeader] уже заявил о безоговорочной поддержке Британского Раджа в подавлении восстания."
 r56_raj.5.a:0 "Наконец-то Свободная Индия."
 r56_raj.5.b:0 "Жалкая мечта."
 r56_raj.5.c:0 "Удар по Британской империи."
 r56_raj.6.t:0 "Масштабные протесты против испытаний INA"
 r56_raj.6.d:0 "После фактического поражения Индийской национальной армии, сражающейся за нелегитимную «Свободную Индию», их преступники предстают перед судом за подстрекательство к мятежу и военные преступления. Это, конечно, естественное следствие такого инфантильного бунта, цепляющегося за мелкие идеи самоуправления или «свараджа». Реакция индийского населения, однако, не в нашу пользу. Во всех крупных городах были организованы протесты, особенно Индийским национальным конгрессом, члены которого также защищали военных преступников и обострились по всей стране, что значительно дестабилизировало британский Радж."
 r56_raj.6.a:0 "Подавить беспорядки."
 r56_raj.7.t:0 "Призывы к самоопределению Бирмы"
 r56_raj.7.d:0 "Бои в знойных бирманских джунглях были тяжёлыми, и многие местные солдаты храбро отдали свои жизни. Их выжившие товарищи всё настойчивее требуют создать отдельное от Индии государство Бирма, союзное Свободной Индии. Будут ли услышаны их призывы?"
 r56_raj.7.a:0 "Нынешнее положение нас устраивает."
 r56_raj.7.b:0 "Следует создать марионеточное правительство."
 r56_raj.7.c:0 "Мы построим по-настоящему свободную Бирму."
 india.2.t:0 "Провинциальные выборы в Индии 1937 года"
 india.2.desc:0 "Политические партии, участвующие во всеобщих выборах, охватывают весь политический спектр, и на кону стоит будущее Индии.\n\nТому, кому выпадет возможность управлять страной, предстоит тяжёлая задача провести разделённый субконтинент через беспокойное будущее."
 india.2.a:0 "Индийский национальный конгресс поведёт страну вперёд."
 india.2.b:0 "Юнионистская партия приведёт нас к статусу доминиона."
 india.2.c:0 "Нам нужна Независимая рабочая партия, чтобы освободиться от эксплуатации."
 raj_election_start:0 "Разблокировать §YПовышение местного влияния§! Решения, с которыми большинство §Yпровинции§! должны быть заработаны.\n\nThe §Yполитическая партия§! В большинстве провинций под §Yконтроль§! будет иметь место §Gсформировать правительство§!."
 india.5.t:0 "Провинциальные выборы в Индии завершены"
 india.5.d:0 "На этой неделе [RAJ.GetLeader] объявил результаты долгожданных первых всеобщих выборов в Индии. В политической борьбе участвовало множество партий и движений, но победителем стала лишь одна сила.\n[RAJ.GetElectionNews]"
 india.5.a:0 "Важный шаг к независимости."
 india.5.b:0 "Тщетные усилия."
 india.5.c:0 "Удачи, товарищи."
 india.5.e:0 "Демократия в действии."
 india.5.f:0 "Любопытно."
 india.6.t:0 "Индия обретает независимость"
 india.6.d:0 "Когда последний британский конвой входит в порт и загружает оставшиеся припасы на уходящее судно Королевского флота «Джорджик», Индия вздыхает с облегчением. Её дни в роли жемчужины королевской короны завершены, и теперь коренные жители начинают возводить новое государство на пепле Британского Раджа.\n\nМасштаб предстоящей работы очевиден, учитывая множество религиозных, языковых и культурных меньшинств субконтинента. Тем не менее Индия непременно залечит эти раны и уверенно двинется в будущее."
 india.6.d.alt:0 "Последний британский конвой входит в порт, загружает оставшиеся припасы на уходящее судно Королевского флота и оставляет Индийский субконтинент нестабильным, разделённым и, по мнению некоторых, полностью разрушенным.\n\nМусульманские сепаратисты добились собственного государства, а переселение населения разжигает насилие и вызывает, возможно, крупнейший кризис беженцев в мировой истории. Что бы ни принесло будущее, части субконтинента встретят его раздельно."
 india.6.a:0 "Три долгих столетия..."
 india.6.b:0 "Возможно, дни империи сочтены."
 india.6.c:0 "Какая трагедия."
 india.6.e:0 "Любопытно."
 india.290.t:0 "Бомбейская конференция"
 india.290.desc:0 "С недавними успехами в избирательной политике, Независимая Лейбористская партия, кажется, находится в благоприятном положении, чтобы принести социализм в Индию. Поддержка многих других коммунистических организаций в Индии имеет жизненно важное значение для поддержания стабильной и функционирующей Индии после создания социалистической экономики. Чтобы заставить некоторых сторонников жесткой линии сотрудничать, нам, возможно, придется пойти на уступки.\n\nИнтернационалисты КПИ требуют нашего вступления в Коминтерн после обретения независимости, а их оппозиция национал-коммунисты требуют отрыва от Москвы. Всеиндийский профсоюзный конгресс требует представительства Союза в будущих правительственных делах. Ассоциация освобождения женщин требует полного и полного гендерного равенства."
 india.290.a:0 "Нужно осторожно распутать эту сеть."
 india.300.t:0 "INC набрал популярность у сельских индусов"
 india.300.desc:0 "Наша кампания отмечает недавние успехи Неру среди крайне важной электоральной группы сельских индуистов севера. Противодействовать этому будет трудно, но встречная кампания может ослабить их влияние."
 india.300.a:0 "Наша кампания и так перегружена."
 india.300.b:0 "Важная возможность."
 india.301.t:0 "Союзническая партия обеспечивает промышленную поддержку."
 india.301.desc:0 "Небольшая, но влиятельная группа индийской буржуазии в основном поддержала Юнионистскую партию, называя обещания стабильности главной причиной. Немного убеждения — и они могут изменить выбор."
 india.301.a:0 "Мы не можем предать индийских рабочих."
 india.301.b:0 "Эту возможность нельзя упустить."
 india.301.c:0 "Всего лишь прагматичное решение."
 india.302.t:0 "Международная поддержка независимой рабочей партии."
 india.302.desc:0 "Партия, которую поддерживающие её авторитарные режимы называют единственной силой, борющейся за свободу всех индийцев, получает иностранные средства и ораторов, несправедливо усиливая свою кампанию. Как нам поступить?"
 india.302.a:0 "Их лицемерие погубит их."
 india.302.b:0 "Мешать им всеми способами."
 inc_victory_news:0 "Победил Индийский национальный конгресс под руководством Джавахарлала Неру, завоевавший народную поддержку благодаря невероятно тяжёлой кампании по всему разделённому субконтиненту и каким-то образом объединивший его. Главным политическим препятствием на пути Индии в будущее станет Всеиндийская мусульманская лига, стремящаяся создать отдельное мусульманское государство."
 up_victory_news:0 "Победила Юнионистская партия, сумевшая заручиться широкой поддержкой в религиозно разнообразных провинциях благодаря подчёркиванию единства и братства на этом крайне неоднородном субконтиненте. Ещё одним важным источником поддержки стали промышленники, предпочитающие более реакционную социальную политику. [RAJ.GetAIMLUP]"
 ilp_victory_news:0 "Ответственность за управление досталась Независимой рабочей партии. Её радикальное видение будущего встревожило промышленную и колониальную основу страны. Пока неизвестно, сможет ли она осуществить свою программу, но в случае успеха британское правление в Индии может завершиться раньше, чем кто-либо ожидал. Неясным остаётся и будущее кастовой системы, против которой широко выступают беднейшие слои общества."
 RAJ_1936_naval_legacy:0 "Индианский королевский флот"
 RAJ_1936_naval_legacy_mtg:0 "Индианский королевский флот"
 raj_disable_focus_tree:0 "§RЭто отключит ваше дерево фокусов§!"
 the_bombay_uprising:0 "Бомбейское восстание"
 the_bombay_uprising_desc:0 "Недавно обретённая свобода народа Бенгалии выглядит привлекательно, а Бомбей, настоящий пороховой погреб, кажется готовым взорваться от одной небольшой искры."
 RAJ_SPR_arms_smuggling:0 "Контрабандой доставить оружие государству [FROM.GetNameDef]"
 RAJ_agrarian_economy:0 "Аграрная экономика"
 RAJ_agrarian_economy_desc:0 "Индия, некогда производственный центр мира, пострадала от британской политики, включавшей быструю деиндустриализацию, расширение добычи ресурсов и грабительское налогообложение. Исправление этих экономических проблем — задача, далеко выходящая за пределы ближайшего будущего. Постепенные шаги к продовольственной безопасности должны стать приоритетом любого правительства Индии."
