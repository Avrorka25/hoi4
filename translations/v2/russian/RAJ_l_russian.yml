 RAJ_Joint_Indo_Soviet_Railways:0 "Совместные Индо-Советские железные дороги"
 RAJ_Joint_Indo_Soviet_Railways_desc:0 "В духе международного сотрудничества государства [RAJ.GetNameDef] и [SOV.GetNameDef] объединят силы для совместного железнодорожного проекта. Это будет масштабное и долгосрочное строительство сети, соединяющей обе страны и способствующей экономическому росту. Проект ещё больше укрепит взаимовыгодные отношения и приблизит нас к общему светлому будущему. Единственным препятствием остаётся политическая ситуация в государстве [AFG.GetNameDef], но дипломатическое давление наверняка решит эту проблему."
