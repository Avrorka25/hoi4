 india.100.t:0 "Наша администрация разделена"
 india.100.desc:0 "Британское правительство только что объявило о создании колоний Аден и Бирма, тем самым значительно сократив размеры нашей администрации."
 RAJ_Tariff_Income:0 "Доход от пошлин"
 RAJ_Increased_Trade_Volume:0 "Увеличенный объём торговли"
 ENG_split_up_the_British_Raj:0 "Разделить Британский Радж"
 ENG_split_up_the_British_Raj_desc:0 "Мы создадим отдельные колонии в Бирме и Адене, чтобы сделать колониальное управление более эффективным."
 raj_port_operation:0 "Сейчас мы работаем над получением порта."
 india.295.t:0 "Индия приглашает нас в Коминтерн"
 india.295.desc:0 "Недавно Индия вступила в Коминтерн после изгнания европейских империалистических колонизаторов, расширила своё влияние в Южной Азии и теперь предлагает нам присоединиться к мировому пролетарскому союзу."
 india.295.a:0 "Пролетарии всех стран, соединяйтесь!"
 india.295.b:0 "Мы предпочитаем не следовать курсу Москвы."
 india.296.t:0 "Индия приглашает нас в альянс [RAJ.GetFactionName]"
 india.296.desc:0 "После изгнания европейских империалистических колонизаторов Индия создала альянс [RAJ.GetFactionName], расширила влияние в Южной Азии и теперь предлагает нам вступить в южноазиатский пролетарский союз."
 india.296.a:0 "Пролетарии всех стран, соединяйтесь!"
 india.296.b:0 "Мы предпочитаем не следовать курсу Дели."
 india.400.t:0 "Шёпот в Гоа"
 india.400.desc:0 "В колониальном городе Гоа ходят слухи о скором вторжении. Подобный сценарий может придумать любой, однако наше высшее командование заметило скрытное перемещение военных дивизий. Вторжение может иметь катастрофические последствия для местного населения, уже 450 лет верного Португалии. Международное сообщество, вероятно, поддержит нас, если мы решим обороняться, но сможет ли международная помощь остановить индийские войска? Готовы ли наши вооружённые силы? Задавать вопросы легко, отвечать на них гораздо труднее."
 india.400.a:0 "Они не пройдут!"
 india.400.b:0 "Мы предпочитаем не проливать кровь."
 india.401.t:0 "Индия успешно захватила Гоа"
 india.401.desc:0 "Один из немногих оставшихся оплотов европейского колониализма в Южной Азии пал перед недавно созданным государством [RAJ.GetNameDef]. Португальская империя, похоже, рушится."
 india.401.a:0 "Долой колонизаторов!"
 india.401.b:0 "Печальный день для Португалии."
 india.402.t:0 "Индия не смогла захватить Гоа"
 india.402.desc:0 "Португальцы бесстрашно отбили наступление индийской армии и сохранили небольшой осколок Португальской империи."
 india.402.a:0 "Проклятые колонизаторы."
 india.402.b:0 "Наша империя проживёт ещё один день."
 india.403.t:0 "Индия добивается референдума в регионе [320.GetName]"
 india.403.desc:0 "В нашей колонии Французская Индия возникло массовое протестное движение. Похоже, за этой волной беспорядков стоит недавно созданное индийское правительство. Большинство колониальных советников предлагает отказаться от нескольких портов и городов, поскольку они не приносят существенной экономической выгоды. Мы также можем попытаться подавить движение, но тогда следует готовиться к непредвиденным последствиям."
 india.403.a:0 "Позовите губернатора."
 india.403.b:0 "Пусть решит демократия."
 india.404.t:0 "Проблема Французской Индии"
 india.404.descre:0 "Протесты продолжают распространяться, а местная полиция устала от их подавления. С самого начала было ясно, что полностью усмирить движение почти невозможно. Тем не менее мы решили укрепить имперское правление. Это решение оказалось крайне непопулярным среди местной администрации, которая уступила требованиям населения и передала провинцию Индии."
 india.404.desc:0 "Референдум, как ни странно, вышел в пользу объединения с Индией, и мы бессильны остановить передачу. Местный [Root.GetAdjective] Войска будут выведены, администраторы передислоцированы, [Root.GetAdjective] Флаг опущен, и наконец индийский флаг поднят."
 india.404.a:0 "Мы ещё посмотрим."
 india.404.b:0 "После всего пережитого это довольно будничный финал."
 india.405.t:0 "Бирманский вопрос"
 india.405.desc:0 "Мы давно рассматриваем отделение Бирмы от Индии, и некоторые дипломаты уже составляют планы новой администрации. Правительство государства [Raj.GetNameDef] просит нас сохранить единство субконтинента по экономическим и административным причинам. Отказ от этих планов освободит наших дипломатов для работы в других направлениях."
 india.405.a:0 "У нас есть более важные дела."
 india.405.b:0 "Наши дипломаты продолжат работу."
 india.406.t:0 "Британцы приняли нашу просьбу"
 india.406.desc:0 "Британские дипломаты, разрабатывавшие планы отдельной бирманской администрации, переведены на другие задачи, и наша администрация остаётся неделимой."
 india.406.a:0 "Мудрое решение."
 india.407.t:0 "Британцы отклонили нашу просьбу"
 india.407.desc:0 "Британское правительство решительно отклонило нашу просьбу сохранить Индию единой, и его дипломаты продолжают разработку планов колонии Бирма."
 india.407.a:0 "Будь прокляты англичане."
 india.408.t:0 "Цейлонский вопрос"
 india.408.desc:0 "Наш новый равноправный союзник Индия оказывает всё большее давление по вопросу своих предполагаемых союзников на Шри-Ланке. В последние месяцы призывы к независимости звучат всё громче, но должны ли мы действительно отказаться от этой важнейшей части империи?"
 india.408.a:0 "Мы предоставим им статус доминиона."
 india.408.b:0 "Они не будут диктовать нам внутреннюю политику."
 india.409.t:0 "Британцы приняли нашу просьбу"
 india.409.desc:0 "Британское правительство предоставило бывшей коронной колонии Цейлон статус доминиона под новым названием [SRL.GetNameDef]. Это великая победа коренных народов Азии."
 india.409.a:0 "Мы немедленно приступим к открытию посольства."
 india.410.t:0 "Британцы отклонили нашу просьбу"
 india.410.desc:0 "Британцы ответили, что не намерены отказываться от колонии Цейлон. Это тяжёлый удар по коренным народам Азии."
 india.410.a:0 "Будь прокляты англичане."
 plead_against_seperation:0 "Выступить против создания колонии Бирма"
 plead_against_seperation_desc:0 "Британцы давно разрабатывают планы создания отдельной бирманской колонии, вырванной из нашей администрации. Следует ясно дать им понять нашу позицию."
 raj_prevent_state_modifier:0 "Не позволит §YБирме§! стать отдельной колонией и предотвратит §Rпотерю§! §Yбольшей части её ресурсов§!."
