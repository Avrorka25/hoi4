 RAJ_Request_British_Hurricanes:0 "Запросить британские «Харрикейны»"
 RAJ_Request_British_Hurricanes_desc:0 "Хранилища старых британских самолетов, бесполезных для них, найдут большое применение в наших слаборазвитых военно-воздушных силах."
