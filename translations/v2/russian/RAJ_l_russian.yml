 RAJ_subhas_chanda_bose_desc:0 "Индийский национальный конгресс подвёл Индию в деле независимости. Пришло время напрямую начать борьбу против британцев."
 RAJ_Krishna_Pillai:0 "П. Кришна Пиллаи"
 RAJ_Shripad_Amrit_Dange:0 "Шрипад Амрит Данге"
 RAJ_pramod_ranjan_sengupta:0 "Прамод Ранджан Сенгупта"
 india.279.t:0 "Положение женщин"
 india.279.desc:0 "Мы уже рассмотрели множество порядков и несправедливостей, унаследованных от прежней администрации, но всё ещё избегали вопроса гендерного равенства. Здесь необходимо учесть множество различных мнений, поэтому в наших интересах решить вопрос как можно скорее."
 india.279.a:0 "Не будем сохранять нашу отсталость."
 india.279.b:0 "Не будем торопиться."
 india.279.c:0 "Некоторые традиции лучше сохранить."
 india.280.t:0 "Вице-король начинает беспокоиться"
 india.280.desc:0 "Хотя должность вице-короля формально должна оставаться в стороне от провинциальных выборов, ходят слухи о попытках саботировать нашу кампанию. Очевидно, они оказались не слишком успешными, иначе мы бы здесь не находились. Тем не менее вице-король, похоже, размышляет, не использовать ли своё положение для отмены политики, которую сочтёт неприемлемой, и подрыва нашего движения. Чтобы избежать гнева генерал-губернатора, следует действовать осторожно."
 india.280.a:0 "К чёрту его."
 india.281.t:0 "Вмешательство в нашу политику"
 india.281.desc:0 "Голодные до власти колониальные пальцы вице-короля воспользовались этой возможностью после нашего захвата частных железных дорог и общей инфраструктуры, отбросив изменения и оставив распределительную сеть Индии на обочине, как он всегда это делал, и все ради чего? Небольшая, незначительная политическая выгода. В то время как сам этот шаг был широко раскритикован индийским населением, решение вице-короля дало эффектные результаты, и несколько туземцев, верящих в доброжелательность Британии, наконец, увидели их такими, какие они есть: эксплуататорскими, претенциозными империалистами."
 india.282.desc:0 "Голодные до власти колониальные пальцы вице-короля воспользовались этой возможностью после того, как мы захватили частные фабрики и предприятия общего назначения, для сотрудников и для работников, отказавшись от перемен и оставив экономику Индии на обочине, как он всегда делал, и все ради чего? Небольшая, незначительная политическая выгода. В то время как сам этот шаг был широко раскритикован индийским населением, решение вице-короля дало эффектные результаты, и несколько туземцев, верящих в добрую волю Великобритании, наконец, увидели их такими, какие они есть: эксплуататорскими, претенциозными империалистами."
 india.283.desc:0 "Голодные до власти колониальные пальчики вице-короля воспользовались этой возможностью после нашего захвата банковского сотрудничества, вернув изменения и оставив распределительную сеть Индии на обочине, как он всегда делал, и все ради чего? Небольшая, незначительная политическая выгода. В то время как сам этот шаг был широко раскритикован индийским населением, решение вице-короля дало эффектные результаты, и несколько туземцев, верящих в добрую волю Великобритании, наконец, увидели их такими, какие они есть: эксплуататорскими, претенциозными империалистами."
 india.291.t:0 "Шри-ланкийцы предлагают белый мир"
 india.291.d:0 "Делегации Шри-Ланки встретились с нашими представителями в Мадурае, сделав важный шаг к миру и процветанию обеих стран."
 india.292.t:0 "Непальцы предлагают белый мир"
 india.292.d:0 "Непальская делегация встретилась с нашей в Дели, сделав важный шаг к миру и процветанию обеих стран."
 india.293.t:0 "Бутанцы предлагают белый мир"
 india.293.d:0 "Бутанская делегация встретилась с нашей в Калькутте, сделав важный шаг к миру и процветанию обеих стран."
 india.294.t:0 "Правозащитные организации выполняют свои требования."
 india.294.d:0 "Во время выборов мы обещали нескольким группам защиты прав женщин полное равенство. Благодаря этому мы получили множество голосов и, возможно, даже победили. Теперь, нарушив обещание, мы позволили им вновь вынудить нас действовать."
 india.294.a:0 "Это была не лучшая идея."
 india.2940.t:0 "Группы защиты прав женщин требуют ответов"
 india.2940.d:0 "Во время выборов мы обратились за помощью к различным женским организациям по всей стране и пообещали им, что мы единственные, кто готов пойти достаточно далеко для защиты прав женщин. Хотя наше обещание остается невыполненным, что вызвало некоторые вопросы в наших рядах."
 india.2940.a:0 "Когда-нибудь мы этим займёмся."
 women_rights_demands_tt:0 "Разумно установить полное равенство, прежде чем нас вынудят к этому."
 india.291.a:0 "Наконец-то мир"
 india.291.b:0 "Никакой капитуляции — ради империи"
 RAJ_Immediate_Famine_Response:0 "Немедленные меры против голода"
 RAJ_Further_Recovery_Efforts:0 "Дальнейшие меры по преодолению голода"
 grant_concessions_to_the_british:0 "Предоставить уступки британцам"
 grant_concessions_to_the_british_desc:0 "Небольшие уступки британцам в вопросе ресурсов повысят их готовность отпустить нас."
 grant_concessions_to_the_british_2:0 "Предоставить британцам дополнительные уступки"
 grant_concessions_to_the_british_2_desc:0 "Более крупные уступки британцам в вопросе ресурсов повысят их готовность отпустить нас."
 organize_large_scale_strikes:0 "Организовать крупномасштабные забастовки"
 organize_large_scale_strikes_desc:0 "Рабочих эксплуатируют не только британцы, но избавление от колониального господства станет первым шагом к освобождению. Мы организуем широкомасштабные забастовки, чтобы вынудить британцев уступить."
 instigate_communal_violence:0 "Разжечь межобщинное насилие"
 instigate_communal_violence_desc:0 "Другие способы давления на колониальных хозяев провалились. Похоже, единственный оставшийся вариант — раздуть пламя напряжённости в этнически смешанных городах, надеясь на соответствующую реакцию британцев."
 promote_ethnic_harmony:0 "Содействовать межэтнической гармонии"
 promote_ethnic_harmony_desc:0 "Пока Джинна и его Мусульманская лига проповедуют разделение меньшинств, мы должны занять прямо противоположную позицию и выступить за постоянную этническую, культурную и религиозную гармонию."
 utilize_more_extrem_factions:0 "Использовать радикальные фракции"
 utilize_more_extrem_factions_desc:0 "Хотя основная кампания развивается успешно, тайная поддержка экстремистов может дать нам преимущество на переговорах."
 concede_to_capitalists:0 "Уступить капиталистам"
 concede_to_capitalists_desc:0 "Поддержав богатых промышленников страны, мы обеспечим их поддержку против британских делегаций."
 hinder_pak_influence:0 "Ослабить влияние Всеиндийской мусульманской лиги"
 hinder_pak_influence_desc:0 "Мы должны сорвать усилия пакистанских делегаций, стремящихся закрепиться на нашем субконтиненте."
 appeal_for_international_support:0 "Обратиться за международной поддержкой"
 appeal_for_international_support_desc:0 "Наши дипломаты стараются оказывать давление на британцев, но их усилия станут эффективнее при поддержке иностранного правительства."
 india.10.t:0 "[?RAJBACKER.GetName] требует свободы Индии"
 india.10.e:0 "Правительство государства [?RAJBACKER.GetAdjective] официально поддержало §Yиндийские§! делегации, добивающиеся независимости. Предоставление им права выступить облегчит сопротивление нашему колониальному правлению."
 india.10.a:0 "Хотя бы предоставить им возможность высказаться."
 india.10.b:0 "Мы не позволим государству [?RAJBACKER.GetNameDef] диктовать нам политику."
 indinfluence15:0 "§YИндийским делегациям§! будет легче оказывать давление ради §Yнезависимости Индии§!."
 increase_both_influence:0 "Сотрудничество со Всеиндийской мусульманской лигой"
 increase_both_influence_desc:0 "Объединив усилия, мы сможем эффективнее давить на британцев и быстрее освободить субконтинент от колониализма, хотя это повысит вероятность раздела нашей великой страны надвое."
 declare_independence_100_influence:0 "§Y[Root.GetReigningGovernmentColor]§! должно оказать на британцев §Y100 влияния§!."
 ind_pak_15:0 "[PAK.GetFlag]§Yпакистанское§! ежедневное §Yвлияние§! увеличится на 0.15\n[RAJ.GetFlag]§Yиндийское§! ежедневное §Yвлияние§! увеличится на 0.15"
 pak5:0 "[PAK.GetFlag]§Yпакистанское§! ежедневное §Yвлияние§! уменьшится на 0.05"
