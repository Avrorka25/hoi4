 India_Political:0 "Дерево фокусов Индии"
 RAJ_Reinforce_the_Government_of_India_Act:0 "Обеспечить исполнение Закона об управлении Индией"
 RAJ_Reinforce_the_Government_of_India_Act_desc:0 "Закон об управлении Индией 1935 года стал важной вехой в структурном переустройстве Раджа, и мы обеспечим его исполнение."
 RAJ_Linlithgows_Reign:0 "Правление Линлитгоу"
 RAJ_Linlithgows_Reign_desc:0 "Должность генерал-губернатора Индии последние пять лет занимал лорд Уиллингдон, однако британская администрация решила назначить лорда Линлитгоу и отправить Уиллингдона в отставку. Оппозиционные партии Раджа считают это застоем и всё сильнее выступают против сотрудничества. Если мы продолжим этот курс, индийский народ может прибегнуть к насилию. Однако столкновение оппозиционных партий между собой может дать нам преимущество."
 RAJ_Provincial_Elections:0 "Провинциальные выборы"
 RAJ_Provincial_Elections_desc:0 "С началом первых всеобщих выборов в Индии всем участвующим партиям предстоят долгие месяцы напряжённой предвыборной борьбы."
 RAJ_assert_control_over_lhoyu:0 "Установить контроль над регионом [434.GetName]"
 RAJ_assert_control_over_lhoyu_desc:0 "Северо-восточные пограничные пути были неправильно отображены на наших картах в течение почти двух десятилетий, что позволило государству Тибет контролировать область на нашей стороне линии МакМахон. Мы должны исправить ошибки на этом пути и обеспечить, чтобы состояние [434.GetName] остается под нашим контролем."
 RAJ_Independent_Labour_Party:0 "Независимая рабочая партия"
 RAJ_Independent_Labour_Party_desc:0 "Нашим главным приоритетом должно стать установление справедливости в Индии и уничтожение кастовой системы."
 RAJ_Indian_National_Congress:0 "Индийский национальный конгресс"
 RAJ_Indian_National_Congress_desc:0 "Мы должны объединиться, чтобы освободиться от британского правления."
 RAJ_Unionist_Party:0 "Юнионистская партия"
 RAJ_Unionist_Party_desc:0 "Только осторожные и продуманные политические действия позволят сохранить стабильность Индии."
 RAJ_Prepare_the_Lucknow_Session:0 "Подготовить Лакхнаускую сессию"
 RAJ_Prepare_the_Lucknow_Session_desc:0 "Мы должны собрать всех членов Конгресса, чтобы обсудить стоящие перед нами задачи."
 RAJ_Secure_Rural_Hindus:0 "Заручиться поддержкой сельских индуистов"
 RAJ_Secure_Rural_Hindus_desc:0 "Сельские индуисты были важнейшей опорой Конгресса с момента его основания."
 RAJ_Broaden_our_Coalition:0 "Расширить нашу коалицию"
 RAJ_Broaden_our_Coalition_desc:0 "Только привлекая в Конгресс новые лица, мы сможем обеспечить победу."
 RAJ_Nehrus_Campaign:0 "Кампания Неру"
 RAJ_Nehrus_Campaign_desc:0 "Необходимо собрать средства для поддержки кампании Неру."
 RAJ_An_Offer_for_Rajagopalachari:0 "Предложение Манохару"
 RAJ_An_Offer_for_Rajagopalachari_desc:0 "Мы наверняка заручимся его поддержкой, если после выборов предложим ему пост в кабинете министров."
 RAJ_Azads_Support:0 "Поддержка Райзмана"
 RAJ_Azads_Support_desc:0 "Хотя Райзман является сторонником Раджа и верно служит ему, он наверняка не откажется служить независимой Индии и применить свои способности на новом субконтиненте."
 RAJ_Nehrus_Candidacy:0 "Кандидатура Неру"
 RAJ_Nehrus_Candidacy_desc:0 "Популярный Джавахарлал Неру должен возглавить Индийский национальный конгресс, если мы хотим увидеть победу."
 RAJ_New_Leadership:0 "Переманить сторонников из Социалистической партии Конгресса"
 RAJ_New_Leadership_desc:0 "Социалистическая партия Конгресса считается «радикальным» крылом Индийского национального конгресса и включает многих социалистов, которые заняли оппортунистическую позицию и присоединились к партии мелкой буржуазии. Усилив критику в их адрес, мы наверняка убедим многих членов перейти на сторону справедливости."
 RAJ_Appeal_to_the_Lower_Castes:0 "Обратиться к низшим кастам"
 RAJ_Appeal_to_the_Lower_Castes_desc:0 "Хотя избирательные права низших каст ограничены, нам всё равно крайне важно получить большинство их голосов."
 RAJ_Subvert_Stalinist_Influence:0 "Обратиться к рабочим"
 RAJ_Subvert_Stalinist_Influence_desc:0 "Наша главная избирательная цель — уничтожение кастовой системы, но это, конечно, не единственная форма угнетения в индуистском обществе. Отношения между пролетариатом и буржуазией, работодателем и работником глубоко эксплуататорские и также должны быть упразднены."
 RAJ_Pillais_Influence:0 "Влияние Пиллаи"
 RAJ_Pillais_Influence_desc:0 "П. Кришна Пиллаи — ценный член Коммунистической партии Индии, и его идеи помогут нам выработать более эффективную стратегию."
 RAJ_Danges_Influence:0 "Влияние Данге"
 RAJ_Danges_Influence_desc:0 "Шрипад Амрит Данге, один из основателей Коммунистической партии Индии, обладает редким опытом и может оказаться незаменимым для достижения нашей конечной цели."
 RAJ_Local_Organization:0 "Сотрудничество с Индийским движением за независимость"
 RAJ_Local_Organization_desc:0 "Все достойные индийские партии стремятся к неизбежной цели — независимости Индии, и было бы глупо забывать о британской эксплуатации индийцев. Единым политическим блоком Индия сможет значительно быстрее добиться самоуправления."
 RAJ_Centralize_the_Party:0 "Революционный дух"
 RAJ_Centralize_the_Party_desc:0 "Если мы признаем мелкобуржуазные партии Индийского субконтинента равными партнёрами в борьбе с несправедливостью и откажемся от революционного марксистского духа, то навредим конечной цели — социалистическому обществу без эксплуатации."
 RAJ_Organize_a_Conference:0 "Бомбейская конференция"
 RAJ_Organize_a_Conference_desc:0 "В Индии существует множество левых организаций, но у них почти не было возможности совместно работать над одним вопросом. Наш успех объединяет стремления всех, кто желает равенства."
 RAJ_A_Society_of_All_Classes:0 "Неделимая Индия"
 RAJ_A_Society_of_All_Classes_desc:0 "Индия — разнообразный континент, и ею не могут править те, кто представляет только индуистов, мусульман или высшие классы. Управлять страной должна коалиция всех культур, языков, народов и каст."
 RAJ_Democracy_and_Socialism:0 "Победа демократии"
 RAJ_Democracy_and_Socialism_desc:0 "Основополагающее видение единой Индии может быть воплощено только многопартийной федеративной политической системой, ставящей во главу угла свободу."
 RAJ_Assemble_the_Constitutional_Assembly:0 "Учредительное собрание"
 RAJ_Assemble_the_Constitutional_Assembly_desc:0 "Теперь, когда Британский Радж окончательно ушёл в прошлое, у нас есть возможность и обязанность построить на его месте новое индийское государство."
 RAJ_Strengthen_Liberal_Elements:0 "Укрепить либеральные элементы"
 RAJ_Strengthen_Liberal_Elements_desc:0 "Индийский национальный конгресс и его социалистические взгляды помогли Индии пройти долгий путь к независимости, однако его экономическая политика неприемлема для страны, восстанавливающейся после столетия колониализма."
 RAJ_Nehrus_Vision_for_India:0 "Nehrus Vision для Индии"
 RAJ_Nehrus_Vision_for_India_desc:0 "Джавахарлал Неру и его сторонники в Индийском национальном конгрессе долго боролись против британского правления и одержали победу. Теперь именно ему естественно предстоит провести Индию через постколониальный мир."
 RAJ_Cut_down_on_Tariffs:0 "Снизить пошлины"
 RAJ_Cut_down_on_Tariffs_desc:0 "Экономика Индии долгое время оставалась аграрной у нашего британского повелителя, поэтому мы были в основном исключены из мирового рынка, за исключением экспорта джута и чая. Теперь мы реинтегрируемся в мировую экономику, облегчив торговлю с Индией."
 RAJ_Relieve_the_Administrative_Burden:0 "Освободить административное сожжение"
 RAJ_Relieve_the_Administrative_Burden_desc:0 "Из-за сделок британцев с местными князьями и общей стратегии «разделяй и властвуй» структура Британского Раджа стала чрезвычайно сложной. Перестроенная администрация позволит нам лучше подготовиться к будущему."
 RAJ_Thorough_Corruption_Audits:0 "Тщательные проверки на коррупцию"
 RAJ_Thorough_Corruption_Audits_desc:0 "Особенностью, также очень заметной при британском правлении в Индии, была коррупция. Многие бюрократические государственные служащие часто возводят искусственные барьеры для бизнеса, чтобы обогатиться. Мы проанализируем записи и найдем худших виновников."
 RAJ_Reconect_broken_up_Industries:0 "Восстановить разорванные промышленные связи"
 RAJ_Reconect_broken_up_Industries_desc:0 "Отделение Индии действительно не было приятным делом, и между пакистанским и индийским населением все еще существует недовольство. Но это не должно останавливать нас в стремлении к улучшению наших двух народов. Многие цепочки поставок были разрезаны пополам, когда граница была так небрежно прочерчена. Упрощение бизнеса через нашу границу может облегчить некоторые отрасли промышленности, разрушенные перегородкой."
 RAJ_Loosen_Rupee_Exchange:0 "Ослабить валютное регулирование рупии"
 RAJ_Loosen_Rupee_Exchange_desc:0 "Индийская рупия в настоящее время напрямую привязана к фунту стерлингов, что является отличным фактором для финансовой стабильности, хотя это серьезно препятствует способности индийского правительства занимать иностранные деньги, которые отчаянно необходимы, поскольку в настоящее время мы имеем значительный торговый дефицит. Передав контроль над рупией рынку, мы поднимем ветры либерализации на новые высоты процветания."
 RAJ_Reproachment_with_the_West:0 "Сближение с Западом"
 RAJ_Reproachment_with_the_West_desc:0 "Наш прежний опыт отношений с Европой, очевидно, был далеко не приятным, однако экономические выгоды сотрудничества перевешивают сохранившиеся обиды нынешнего правительства."
 RAJ_Extensive_Agricultural_Subsidies:0 "Масштабные сельскохозяйственные субсидии"
 RAJ_Extensive_Agricultural_Subsidies_desc:0 "Простой крестьянин — основа Индии. Хотя наша цель заключается в переходе к промышленной экономике, сельскохозяйственные рабочие по-прежнему должны получать экономическую поддержку."
 RAJ_Ties_Across_Asia:0 "Связи по всей Азии"
 RAJ_Ties_Across_Asia_desc:0 "Общий опыт европейской колонизации встречается у большинства народов Азии. Мы будем использовать эти общие черты для дальнейшего военного, экономического и политического сотрудничества."
 RAJ_Indo_Soviet_Friendship_Treaty:0 "Индо-[SOV.GetAdjective]ий договор о дружбе"
 RAJ_Indo_Soviet_Friendship_Treaty_desc:0 "[RAJ_Indo_Soviet_Treaty_Pakistan]Дружественные отношения с государством [SOV.GetNameDef] значительно укрепят наше международное положение и обеспечат более тесные экономические связи с одной из крупнейших экономик мира."
 RAJ_Want_Peace_Prepare_for_War:0 "Хочешь мира — готовься к войне"
 RAJ_Want_Peace_Prepare_for_War_desc:0 "Мир становится всё более жестоким, и для обеспечения мира и процветания нашей страны мы должны быть готовы защищать её. Это означает укрепление армии, создание союзов с другими государствами и постоянную бдительность перед угрозами безопасности. Только готовность к войне даёт надежду сохранить мир."
 RAJ_war_preparation:0 "Преимущество войны"
 RAJ_Foster_Mining_Jobs:0 "Создать рабочие места в горнодобывающей отрасли"
 RAJ_Foster_Mining_Jobs_desc:0 "Чтобы обеспечить развитие сельских общин Индии, мы будем способствовать развитию нескольких горнодобывающих отраслей по всей сельской местности, чтобы принести процветание там, где оно давно отсутствует."
 RAJ_Indo_Soviet_Friendship_Treaty_pakistan:0 "Поскольку внешнеполитический курс Пакистана становится всё менее предсказуемым, мы должны заручиться международной поддержкой для укрепления своего положения на субконтиненте."
 RAJ_Federalize_Education:0 "Федерализировать образование"
 RAJ_Federalize_Education_desc:0 "Мы разработаем общие учебные программы для всех индийских школ, чтобы каждый индеец, независимо от этнической принадлежности, религии или языка, мог иметь общее понимание мира."
 RAJ_Reform_the_Rupee:0 "Реформировать рупию"
 RAJ_Reform_the_Rupee_desc:0 "Мы столетие боролись за независимость от Британии, несмотря на то, что индийская рупия все еще привязана к фунту стерлингов. Вместо этого мы привяжем обменный курс к развивающимся мировым валютам, таким как иена, доллар и рубль."
 RAJ_Constitutional_Minority_Protections:0 "Конституционная защита меньшинств"
 RAJ_Constitutional_Minority_Protections_desc:0 "Индия, вероятно самый разнообразный и яркий субконтинент, состоит из регионов со значительными языковыми, религиозными и этническими меньшинствами. Обеспечивая их безопасность и процветание, мы укрепляем всю Индию."
 RAJ_Crackdown_on_Radicalism:0 "Подавить радикализм"
 RAJ_Crackdown_on_Radicalism_desc:0 "Борьба окончена, Индия независима. Некоторые ещё не осознали этого, поскольку десятки революционных организаций по-прежнему имеют миллионы последователей. Мы вернём этих людей в общее демократическое пространство и вместе построим будущее."
 RAJ_India_United_under_Britain:0 "Индия объединилась с Великобританией"
 RAJ_India_United_under_Britain_desc:0 "В отличие от партий, соперничающих в радикальных и утопических проектах, мы будем продвигать Индию вперёд взвешенно и спокойно."
 RAJ_Ally_with_the_Muslim_League:0 "Заключить союз с Мусульманской лигой"
 RAJ_Ally_with_the_Muslim_League_desc:0 "Пообещав отдельный Пакистан, мы заручимся поддержкой Всеиндийской мусульманской лиги и вместе выступим против социалистов."
 RAJ_Fight_the_Muslim_League:0 "Бороться с Мусульманской лигой"
 RAJ_Fight_the_Muslim_League_desc:0 "Идею Мусульманской лиги об отдельном мусульманском государстве необходимо искоренить из сознания народа."
 RAJ_Siphon_Congress_Ministers:0 "Переманить сторонников Конгресса"
 RAJ_Siphon_Congress_Ministers_desc:0 "Многие в Конгрессе считают, что социалистическая политика зашла слишком далеко. Небольшая агитационная кампания может заставить их перейти на нашу сторону."
 RAJ_Appeal_to_Anglo_Indians:0 "Обратиться к англо-индийцам"
 RAJ_Appeal_to_Anglo_Indians_desc:0 "Англо-индийцы субконтинента долго оставались забытым меньшинством как для индийских, так и для британских политиков. Мы можем воспользоваться этим и получить их голоса."
 RAJ_Content_for_British_Rule:0 "Довольство британским правлением"
 RAJ_Content_for_British_Rule_desc:0 "Мы не сможем построить стабильную Индию при радикальном и непредсказуемом руководстве, способном лишь разрушить основы страны."
 RAJ_Establish_a_Precense_in_Sindh:0 "Создать присутствие в Синде"
 RAJ_Establish_a_Precense_in_Sindh_desc:0 "К югу от родной провинции нашей великой партии лежит забытый и этнически разнообразный Синд, которому следует уделить больше внимания."
 RAJ_National_Unity:0 "Национальное единство"
 RAJ_National_Unity_desc:0 "Мы должны объединить всех жителей страны — индуистов, сикхов, буддистов и мусульман. Только тогда наступит мир."
 RAJ_Appeal_to_the_Peasentry:0 "Обратиться к крестьянству"
 RAJ_Appeal_to_the_Peasentry_desc:0 "Крестьянство — важнейшая часть Индии, и тот, кто его игнорирует, поплатится на выборах."
 RAJ_Implement_Equal_Education:0 "Ввести равное образование"
 RAJ_Implement_Equal_Education_desc:0 "Во всех обществах, разделённых на классы, качественное образование в основном доступно высшим слоям. В Индии положение низших слоёв особенно тяжёлое. Наш долг — наконец сделать образование равным, чтобы талантливые люди из всех слоёв общества могли добиться успеха."
 RAJ_Dismantle_the_Judicial_System:0 "Перестроить судебную систему"
 RAJ_Dismantle_the_Judicial_System_desc:0 "Индуистская судебная система представляет собой сложный, запутанный беспорядок, благоприятствующий высшему классу и пренебрегающий большинством. Справедливость для Индии может быть достигнута только в том случае, если наши суды будут иметь такое же видение, как и наше революционизированное общество."
 RAJ_Abolish_the_Reservation_System:0 "Отменить систему привилегий"
 RAJ_Abolish_the_Reservation_System_desc:0 "Высшие касты часто получают преимущество при найме на государственную службу, а некоторые должности доступны только им. Это уже привело к снижению эффективности бюрократии."
 RAJ_Seize_Influence_from_Upper_Castes:0 "Лишить высшие касты влияния"
 RAJ_Seize_Influence_from_Upper_Castes_desc:0 "Высшие классы железной рукой удерживали власть даже при британском правлении. В социалистическом обществе, свободном от эксплуатации, это недопустимо. Большинство силой отнимет их влияние."
 RAJ_Expand_Healthcare_Facilities:0 "Расширить университеты"
 RAJ_Expand_Healthcare_Facilities_desc:0 "Реформировав начальное и среднее образование и сделав его равным, мы займёмся высшей школой."
 RAJ_Establish_The_Revolutionary_Guard:0 "Создать Революционную гвардию"
 RAJ_Establish_The_Revolutionary_Guard_desc:0 "Революцию необходимо любой ценой защитить от контрреволюционных движений! Мы создадим армию по образцу Красной армии."
 RAJ_Invite_Soviet_Planners:0 "Пригласить советских плановиков"
 RAJ_Invite_Soviet_Planners_desc:0 "«Государство есть орган классового господства, орган угнетения одного класса другим; оно создаёт порядок, который узаконивает и упрочивает это угнетение, умеряя столкновение классов».\n— Владимир Ленин"
 RAJ_Invite_International_Theorists:0 "Пригласить зарубежных теоретиков"
 RAJ_Invite_International_Theorists_desc:0 "«Свобода только для сторонников правительства, только для членов партии — как бы многочисленны они ни были — вовсе не свобода. Свобода всегда есть свобода для инакомыслящих».\n— Роза Люксембург"
 RAJ_Agricultural_Collectivisation:0 "Сельскохозяйственная коллективизация"
 RAJ_Agricultural_Collectivisation_desc:0 "Наша главная цель — расширение индийского пролетариата, но кто будет его кормить? Нынешняя система частного земледелия устарела и неэффективна. Необходимо объединить мелкие крестьянские хозяйства в крупные коллективные хозяйства."
 RAJ_Expand_Soviet_Aid:0 "Расширить советскую помощь"
 RAJ_Expand_Soviet_Aid_desc:0 "Советы — это дающий народ, помогающий аграрной экономике развивать сильные отрасли, как у них есть. Мы должны просить больше помощи, чтобы резко увеличить темпы нашей индустриализации."
 RAJ_Rethink_Resource_Policy:0 "Пересмотреть ресурсную политику"
 RAJ_Rethink_Resource_Policy_desc:0 "Старый колониальный режим в основном сосредоточил свои усилия по добыче ресурсов на прибыльных экспортных продуктах и почти полностью проигнорировал тему индустриализации. Мы должны радикально изменить этот факт, чтобы поддержать наш растущий пролетариат."
 RAJ_Combat_Institutional_Corruption:0 "Бороться с институциональной коррупцией"
 RAJ_Combat_Institutional_Corruption_desc:0 "Коррупция глубоко проникла во все индийские учреждения. Она процветала при Британском Радже и продолжит разрастаться, если мы не положим ей конец."
 RAJ_Establish_a_Central_Committee:0 "Создать Центральный комитет"
 RAJ_Establish_a_Central_Committee_desc:0 "Навязывая предприятиям централизованно планируемые промышленные цели, мы получаем математическую эффективность, но ограничиваем свободу рабочих."
 RAJ_Incentivize_Workplace_Democracy:0 "Ввести демократию на рабочих местах"
 RAJ_Incentivize_Workplace_Democracy_desc:0 "Сосредоточившись на местном социализме, мы дадим рабочим больше свободы, пожертвовав общими промышленными целями."
 RAJ_The_Liberation_of_South_Asia:0 "Освобождение Южной Азии"
 RAJ_The_Liberation_of_South_Asia_desc:0 "В то время как индийский Пролетариат, возможно, получил уступку на выборах и избранное правительство, части Южной Азии не так повезло. Мы будем тонко поддерживать движения их рабочих различными средствами, включая переброску оружия, военное вмешательство и политическую подрывную деятельность.\nВишв ке кармачари экаджут хо гэ!"
 RAJ_Seize_the_Means:0 "Захватить средства..."
 RAJ_Seize_the_Means_desc:0 "Первым шагом к социализму должен стать захват средств производства, распределения и обмена. Однако без осторожности это может вызвать недовольство части страны."
 RAJ_of_Production:0 "...производства"
 RAJ_of_Production_desc:0 "Буржуазия слишком долго занимала львиную долю. Настало время рабочим попробовать плоды собственного труда."
 RAJ_of_Distribution:0 "...распределения"
 RAJ_of_Distribution_desc:0 "Фабрика бесполезна без возможности доставлять продукцию. Мы должны национализировать частные железные дороги на благо индийского народа."
 RAJ_of_Exchange:0 "...обмена"
 RAJ_of_Exchange_desc:0 "Для управления государственным бюджетом нам нужен общественный банк, регулирующий валюту, расчёты и финансовый контроль."
 RAJ_Connect_the_Rural_Areas:0 "Связать сельские районы"
 RAJ_Connect_the_Rural_Areas_desc:0 "Англичане только утруждали себя строительством железных дорог от наших портов до наших природных ресурсов, оставляя большую часть страны нетронутой. Теперь наша обязанность — задним числом исправить ошибки англичан."
 RAJ_The_Ceylon_Emergency:0 "Цейлонское восстание"
 RAJ_The_Ceylon_Emergency_desc:0 "Получив оружие и политическую поддержку, сингальцы готовы начать восстание против британцев и ждут лишь нашего приказа."
 RAJ_Overthrow_the_Rana_dynasty:0 "Непальское восстание"
 RAJ_Overthrow_the_Rana_dynasty_desc:0 "Непальский народ давно организуется, и теперь пришло время ударить по угнетающему режиму Рана."
 RAJ_The_Bhutanese_Revolt:0 "Бутанское восстание"
 RAJ_The_Bhutanese_Revolt_desc:0 "Династия Вангчук, какой бы любимой она ни была, не смогла помочь беднейшим слоям страны, и народ готов выступить против неё."
 RAJ_The_Remaining_Ports:0 "Оставшиеся порты"
 RAJ_The_Remaining_Ports_desc:0 "На субконтиненте все еще существуют неприятные ростки колониализма, которые должны быть приняты мирным или даже насильственным путем."
 RAJ_Jinnahs_Kingdom:0 "Наши мусульманские товарищи"
 RAJ_Jinnahs_Kingdom_desc:0 "Все религиозные, языковые и культурные группы субконтинента переплетены и зависят друг от друга. Отделение одной из них серьёзно ослабит Индию. Давно забытая, но крайне важная часть нашей нации — мусульмане Синда, Пенджаба и Бенгалии."
 RAJ_A_New_Movement:0 "Новое движение"
 RAJ_A_New_Movement_desc:0 "Сталинская Россия не смогла создать справедливое социалистическое общество. Мы должны отдалиться от неё и зажечь новое движение вперёд."
 RAJ_The_Third_International:0 "Третий интернационал"
 RAJ_The_Third_International_desc:0 "Сталинская Россия прошла долгий путь и выстояла много лет. Чтобы выжить, мы должны примкнуть к ней."
 RAJ_Asian_Anti_Colonialism:0 "Азиатский антиколониализм"
 RAJ_Asian_Anti_Colonialism_desc:0 "После стольких лет мы должны наконец изгнать европейцев с азиатского континента и обезопасить наше будущее."
 RAJ_Bind_South_Asia_Closer:0 "Сплотить Южную Азию"
 RAJ_Bind_South_Asia_Closer_desc:0 "Мы утвердили социализм в Южной Азии, и теперь должны объединить эти страны в военном отношении."
 RAJ_Socialist_Science:0 "Социалистическая наука"
 RAJ_Socialist_Science_desc:0 "Советский народ достиг больших успехов в науке и располагает технологиями, необходимыми новому индийскому рабочему государству. Программы научного обмена принесут пользу обоим обществам."
 RAJ_Military_Cooperation:0 "Военное сотрудничество"
 RAJ_Military_Cooperation_desc:0 "С нашими новообретенными союзниками мы будем координировать нашу оборонную стратегию и делиться нашими военными секретами."
 RAJ_Technological_Cooperation:0 "Технологическое сотрудничество"
 RAJ_Technological_Cooperation_desc:0 "Мы должны укреплять не только собственную науку, но и науку союзников."
 RAJ_Establish_a_National_Government:0 "Создать национальное правительство"
 RAJ_Establish_a_National_Government_desc:0 "После победы на выборах мы создадим централизованное правительство и сформируем кабинет министров."
 RAJ_Battle_the_Untouchables:0 "Бороться с неприкасаемостью"
 RAJ_Battle_the_Untouchables_desc:0 "Слабейшие касты отчаянно нуждаются в помощи, и демократическая Индия должна улучшить их положение."
 RAJ_Encourage_Rural_Education:0 "Поощрять сельское образование"
 RAJ_Encourage_Rural_Education_desc:0 "Чтобы стать промышленной державой, необходимо развивать образование среди всех слоёв населения."
 RAJ_Expand_Delhi_University:0 "Расширить Делийский университет"
 RAJ_Expand_Delhi_University_desc:0 "Спрос на высшее образование растёт, поэтому следует расширить наш крупнейший университет — Делийский университет."
 RAJ_Economic_Restructuring:0 "Перестройка экономики"
 RAJ_Economic_Restructuring_desc:0 "В нынешнем виде экономика не готова к будущему. Мы должны быстро реформировать её, иначе останемся аграрным обществом."
 RAJ_Expand_the_Public_Sector:0 "Расширить государственный сектор"
 RAJ_Expand_the_Public_Sector_desc:0 "Лучший способ расширить промышленность — прямое вмешательство государства, хотя это может оттолкнуть консервативных членов."
 RAJ_Soviet_Assistance:0 "Советская помощь"
 RAJ_Soviet_Assistance_desc:0 "В нынешней геополитической обстановке Советский Союз заинтересован в укреплении Индии как противовеса западным державам."
 RAJ_Agricultural_Investments:0 "Инвестиции в сельское хозяйство"
 RAJ_Agricultural_Investments_desc:0 "Повышая продуктивность сельского хозяйства, мы стимулируем переход сельского населения в другие отрасли и одновременно улучшаем уровень жизни обычного индийца."
 RAJ_Expell_the_Socialists:0 "Изгнать социалистов"
 RAJ_Expell_the_Socialists_desc:0 "Наша партия уже давно является зонтичным движением, но теперь, когда наша общая цель достигнута, мы будем изгонять крайние элементы нашей организации."
 RAJ_Unify_the_Courts:0 "Объединить суды"
 RAJ_Unify_the_Courts_desc:0 "Наша судебная система излишне сложна и насчитывает столетия. Мы объединим её, чтобы повысить эффективность."
 RAJ_Concessions_to_Princes:0 "Уступки князьям"
 RAJ_Concessions_to_Princes_desc:0 "Князья наверняка не согласны с новым правительством, но идеологические разногласия не должны заслонять прагматизм."
 RAJ_No_Compromises:0 "Никаких компромиссов"
 RAJ_No_Compromises_desc:0 "Столетним угнетающим институтам княжеских государств нельзя доверять место в современной стране. Компромисс с этими остатками феодализма неприемлем."
 RAJ_Integrate_the_Princely_States:0 "Интегрировать княжеские государства"
 RAJ_Integrate_the_Princely_States_desc:0 "По мере продвижения к независимости княжеские государства будут интегрированы — добровольно или нет."
 RAJ_Democratize_our_Institutions:0 "Демократизировать наши учреждения"
 RAJ_Democratize_our_Institutions_desc:0 "Наши учреждения поражены коррупцией, корни которой лежат в системах, созданных столетия назад. Мы должны перестроить и реформировать их ради стабильности."
 RAJ_Central_Bureau_of_Investigation:0 "Центральное бюро расследований"
 RAJ_Central_Bureau_of_Investigation_desc:0 "Новые учреждения необходимо защищать от всех угроз. Пора создать наш ответ Абверу, МИ-6 и ЦРУ."
 RAJ_Reform_our_Police_Force:0 "Реформировать полицию"
 RAJ_Reform_our_Police_Force_desc:0 "Индийская имперская полиция крайне непопулярна, и наш режим станет таким же, если сохранит её методы. Пора упразднить британскую полицейскую систему и создать собственную индийскую."
 RAJ_Revise_Taxation_Policies:0 "Пересмотреть налоговую политику"
 RAJ_Revise_Taxation_Policies_desc:0 "Британский Радж облагал население тяжёлыми и нередко несправедливыми налогами. Для здоровой экономики и общества мы должны заменить британскую налоговую систему индийской."
 RAJ_Reestablish_our_Armed_Forces:0 "Воссоздать вооружённые силы"
 RAJ_Reestablish_our_Armed_Forces_desc:0 "Британская Индийская армия была огромным учреждением, созданным прежде всего для защиты британского правления. Она должна уступить место новой армии, служащей Индии."
 RAJ_No_Resentments:0 "Без обид"
 RAJ_No_Resentments_desc:0 "Наши отношения с британцами трудно назвать мирными, но современная геополитика требует сближения с западными державами. Раны колониализма ещё болят, однако мы должны стоять вместе как равноправные партнёры."
 RAJ_Protect_the_Arabian_Sea:0 "Защитить Аравийское море"
 RAJ_Protect_the_Arabian_Sea_desc:0 "Между нами и Суэцким каналом, опорой британской системы глобальной обороны, лежит широкое и уязвимое Аравийское море. Пираты и вражеские подлодки вмешиваются в поставки на Ближний Восток и дальше. Совместные радиолокационные станции и авиабазы помогут вернуть контроль над Индийским океаном."
 RAJ_Equal_Partners:0 "Равноправные партнёры"
 RAJ_Equal_Partners_desc:0 "Теперь отношения колонии и метрополии сменились равноправным партнёрством. Мы займём более заметное место в мировой политике и будем защищать свободу там, куда не дотягиваются руки Британии."
 RAJ_A_New_Way_Forward:0 "Новый путь вперёд"
 RAJ_A_New_Way_Forward_desc:0 "Индии нечего выигрывать от участия в войнах. Даже если мы предотвратим всего одну войну, то спасём тысячи жизней."
 RAJ_Mutual_Investments:0 "Взаимные инвестиции"
 RAJ_Mutual_Investments_desc:0 "В то время как европейцы гораздо более индустриализированы, чем мы, эти инвестиции по-прежнему будут взаимовыгодными."
 RAJ_The_Non_Aligned_Movement:0 "Движение неприсоединения"
 RAJ_The_Non_Aligned_Movement_desc:0 "Мы создадим мировое сообщество, независимое от сверхдержав нашей эпохи, и вместе будем бороться за мир."
 RAJ_Bring_Democracy_to_South_Asia:0 "Принести демократию в Южную Азию"
 RAJ_Bring_Democracy_to_South_Asia_desc:0 "Индия стала сияющим бастионом демократии, но наш континент по-прежнему почти лишён демократии и полон тирании."
 RAJ_South_Asian_Economic_Integration:0 "Экономическая интеграция Южной Азии"
 RAJ_South_Asian_Economic_Integration_desc:0 "У Индийского субконтинента есть общие интересы на мировом рынке. Объединив и интегрировав экономики, мы принесём процветание всем, а переговоры с международными торговыми партнёрами станут эффективнее."
 RAJ_Pressure_the_British_about_Ceylon:0 "Надавить на британцев по вопросу Цейлона"
 RAJ_Pressure_the_British_about_Ceylon_desc:0 "Цейлонский народ уже давно выступает за независимость, надеясь, что независимость Индии также будет означать их свободу от британской эксплуатации. Хотя этого, возможно, не произошло, теперь мы можем помочь движению получить голос."
 RAJ_Armed_Neutrality:0 "Вооружённый нейтралитет"
 RAJ_Armed_Neutrality_desc:0 "Никто не хочет войны — лидеры желают лишь её добычи. Нейтральное суверенное государство должно сделать эту добычу максимально труднодоступной. Мы укрепим боевой дух армии и расширим производство вооружений."
 RAJ_Expand_its_Competences:0 "Расширить его полномочия"
 RAJ_Expand_its_Competences_desc:0 "Возможно, если мы расширим и объединим эту организацию, наши слова будут иметь больше поддержки, и мы будем более эффективными в защите прав малых стран."
 RAJ_Emphasise_Anti_Colonialist_Sentiment:0 "Подчеркните антиколониалистские настроения"
 RAJ_Emphasise_Anti_Colonialist_Sentiment_desc:0 "Колониализм — уродливый, устаревший и непопулярный институт, время которого давно прошло. Мы должны донести это послание до всего мира, иначе колонизированные народы ещё десятилетиями будут терпеть бессмысленные страдания."
 RAJ_Take_back_the_Ports:0 "Вернуть порты"
 RAJ_Take_back_the_Ports_desc:0 "Европейские порты — уродливое напоминание о колониальном прошлом. Мы надеемся решить проблему мирно, но одних слов может оказаться недостаточно."
 RAJ_Launch_The_Quit_India_Movement:0 "Начать движение «Прочь из Индии»"
 RAJ_Launch_The_Quit_India_Movement_desc:0 "Мы уже используем все доступные средства, чтобы изгнать британцев, но примирение с политическими противниками и общенациональная забастовка могут усилить давление."
 RAJ_Intervention_in_Pakistan:0 "Интервенция в Пакистан"
 RAJ_Intervention_in_Pakistan_desc:0 "Хрупкая видимость демократии Джинны рухнула, и мусульманам, сикхам и индуистам Пенджаба, Синда и Бенгалии навязана диктатура. Существование такого режима лишь приглашает иностранные державы вмешаться в дела Индийского субконтинента. Вооружённые силы Индии должны действовать, пока не стало слишком поздно."
 RAJ_Offer_the_British_Concessions:0 "Уступки британцам"
 RAJ_Offer_the_British_Concessions_desc:0 "Британские острова удерживают Индию по многим причинам, главная из которых — огромные природные богатства субконтинента. Переговоры пойдут легче, если мы пообещаем поделиться частью ресурсов."
 RAJ_Mutual_Security:0 "Взаимная безопасность"
 RAJ_Mutual_Security_desc:0 "В новом союзе мы согласуем военную стратегию ради общей безопасности."
 RAJ_The_Remains_of_South_Asia:0 "Оставшиеся страны Южной Азии"
 RAJ_The_Remains_of_South_Asia_desc:0 "Южная Азия всё ещё полна деспотических режимов, подавляющих свои народы. При помощи британцев мы принесём им демократию."
 RAJ_Outwards_to_the_World:0 "Навстречу миру"
 RAJ_Outwards_to_the_World_desc:0 "Мы должны искать внешние союзы, чтобы укрепить положение Индии."
 RAJ_The_Womens_Status:0 "Положение женщин"
 RAJ_The_Womens_Status_desc:0 "Женщины долго подвергались угнетению в нашем обществе. Им до сих пор навязывают варварские и устаревшие обычаи. Одних законов недостаточно, но это первый шаг к справедливой Индии."
 RAJ_Caste_Reform:0 "Кастовая реформа"
 RAJ_Caste_Reform_desc:0 "Кастовая система дискриминации давно тяготеет над Индией и по-прежнему господствует во многих её частях. В индуистском обществе она делит людей на жёсткие социальные группы, а низшие касты регулярно подвергаются эксплуатации."
 RAJ_Develop_the_Defense_Industry:0 "Развитие оборонной промышленности"
 RAJ_Develop_the_Defense_Industry_desc:0 "После наших недавних экономических реформ, связанных с национализацией, пришло время укрепить нашу национальную оборонную промышленность, чтобы помочь нашей экономике и нашим вооруженным силам."
 RAJ_Establishing_A_Indian_Navy:0 "Создание индийского флота"
 RAJ_Establishing_A_Indian_Navy_desc:0 "Индийский океан огромен и опасен. Для его патрулирования нужен крупный надводный флот, которого у нас пока нет. Необходимо резко нарастить кораблестроение."
 RAJ_Unity_in_India:0 "Единство Индии"
 RAJ_Unity_in_India_desc:0 "Мусульмане Индии долго оставались в стороне, но свободное, демократическое и справедливое общество не может терпеть такое зло. Мы должны пойти навстречу их требованиям и объединить страну."
 RAJ_The_Ones_Who_Got_Away:0 "Те, кто ускользнул"
 RAJ_The_Ones_Who_Got_Away_desc:0 "Хотя мы твёрдо требовали интеграции в Индию, нескольким князьям удалось ускользнуть. Теперь пора обеспечить единство субконтинента."
 RAJ_Relieve_Indias_Struggling_Food_Supply:0 "Облегчить продовольственное положение Индии"
 RAJ_Relieve_Indias_Struggling_Food_Supply_desc:0 "Продовольственное снабжение Индии сильно зависит от климата. Если муссоны окажутся слабее нормы, придётся импортировать зерно. Улучшение орошения и методов земледелия поможет предотвратить будущие голоды."
 RAJ_Placate_the_Nobles:0 "Умиротворить знать"
 RAJ_Placate_the_Nobles_desc:0 "Знать процветала при британском правлении и недовольна нашей независимостью. Некоторые уступки могут изменить её отношение."
 RAJ_Military_Research_Department:0 "Отдел военных исследований"
 RAJ_Military_Research_Department_desc:0 "Мы должны развивать военные возможности не за счёт количества, как предлагают многие генералы, а благодаря настоящему технологическому превосходству."
 RAJ_Sit_Down_with_the_Farmers:0 "Диалог с фермерами"
 RAJ_Sit_Down_with_the_Farmers_desc:0 "Самостоятельный крестьянин, обрабатывающий собственную землю, — жизненная сила нашей страны. Его нужды заслуживают гораздо большего внимания, чем уделяло колониальное правительство."
 RAJ_Token_Social_Reform:0 "Символическая кастовая реформа"
 RAJ_Token_Social_Reform_desc:0 "Кастовая система долго поддерживала порядок и стабильность, но после ухода британцев многие должности, требующие высокой квалификации, остались вакантными. Ослабив некоторые ограничения, мы сможем сохранить эффективность колониальной эпохи."
 RAJ_Expand_our_Ordance_Industry:0 "Расширить производство вооружений"
 RAJ_Expand_our_Ordance_Industry_desc:0 "В назревающих мировых конфликтах государство [RAJ.GetNameDef] должно быть готово защищать своих граждан и свободу всех народов."
 RAJ_Answer_The_Call:0 "Ответить на призыв"
 RAJ_Answer_The_Call_desc:0 "Британские острова ведут войну, которую не могут позволить себе проиграть: капитуляция обречёт миллионы людей на тиранию и мрак. Наш нравственный долг — защищать свободу везде, где она находится под угрозой. Пришло время ответить на призыв."
 RAJ_Institute_The_Draft:0 "Ввести призыв"
 RAJ_Institute_The_Draft_desc:0 "Хотя участие в войне является моральным долгом, не все граждане осознают серьёзность положения. Нам придётся призывать даже тех, кто не желает добровольно вступать в армию, чтобы освобождать людей по всему миру."
 RAJ_Industrial_Investments:0 "Промышленные инвестиции"
 RAJ_Industrial_Investments_desc:0 "Мы должны вкладывать значительные средства в фабрики по всей стране, чтобы экономика росла и процветала."
 RAJ_Aquire_War_Material:0 "Приобрести военные материалы"
 RAJ_Aquire_War_Material_desc:0 "Чтобы противостоять будущим врагам, необходимо обеспечить храбрых солдат современным и качественно произведённым оружием."
 RAJ_Internal_Security_Act:0 "Закон о внутренней безопасности"
 RAJ_Internal_Security_Act_desc:0 "Мы не можем позволить экстремистским фракциям разрушить страну. Мы продолжим британскую практику арестов тех, кто стремится уничтожить великую Индию."
 RAJ_Placate_the_British:0 "Умиротворить британцев"
 RAJ_Placate_the_British_desc:0 "Хотя независимость обеспечена, наша экономика всё ещё сильно зависит от британских инвестиций. Умиротворив англичан, мы сможем привлечь в Индию больше капитала."
 RAJ_Federalisation:0 "Народная грамотность"
 RAJ_Federalisation_desc:0 "Мы должны резко повысить грамотность, расширив систему образования. От этого зависит будущее Индии!"
 RAJ_A_Truly_Indian_Navy:0 "По-настоящему индийский флот"
 RAJ_A_Truly_Indian_Navy_desc:0 "Индийский океан огромен и опасен. Для его патрулирования нужен крупный надводный флот, которого у нас пока нет. Необходимо резко нарастить кораблестроение."
 RAJ_Fighting_Tyranny_whereever_it_may_be:0 "Борьба с тиранией повсюду"
 RAJ_Fighting_Tyranny_whereever_it_may_be_desc:0 "До сих пор вооружённые силы в основном защищали интересы Индии в Южной Азии, но мы упускали общую картину. Мы должны защищать свободу по всему миру и сражаться с теми, кто хочет обратить её в пепел."
 RAJ_Assemble_our_Cabinet:0 "Сформировать кабинет министров"
 RAJ_Assemble_our_Cabinet_desc:0 "Каждый новый вице-король формирует новый кабинет, поддерживающий его действия в Индии. Исполнительный совет вице-короля когда-то был лишь совещательным органом, но со временем получил больше влияния, поэтому нам нужны компетентные министры."
 RAJ_Meet_with_the_Legislative:0 "Встретиться с законодательной властью"
 RAJ_Meet_with_the_Legislative_desc:0 "Хотя представитель короны обладает значительной властью над законодательным органом, нам всё равно необходимо обеспечить нужное голосование."
 RAJ_Meet_with_the_Judiciary:0 "Встретиться с судебной властью"
 RAJ_Meet_with_the_Judiciary_desc:0 "Хотя английское общее право широко применяется в Индии, судебная система построена на местных основах. Если суды не будут нам противостоять, мы избежим будущих проблем."
 RAJ_Attend_the_Imperial_Conference:0 "Посетить Имперскую конференцию"
 RAJ_Attend_the_Imperial_Conference_desc:0 "Имперские конференции проходят регулярно, но нынешняя особенно важна. После королевского, скажем так, скандала многие доминионы оказались в смятении, и Лондон стремится вновь укрепить связи с империей."
 RAJ_Reinvigorate_Imperial_Shipping:0 "Возродить имперское судоходство"
 RAJ_Reinvigorate_Imperial_Shipping_desc:0 "Судоходные линии Индийского океана несколько сократились, что ударило по казне Британского Раджа. Мы должны добиваться дальнейших инвестиций в имперское судоходство."
 RAJ_Common_Defence_Policy:0 "Общая оборонная политика"
 RAJ_Common_Defence_Policy_desc:0 "Рост мировой напряжённости не ускользнул от британской администрации. Она предложила доминионам, Британским островам и Индии лучше координировать вооружённые силы ради защиты империи."
 RAJ_The_Indian_Merchant_Navy:0 "Индийский торговый флот"
 RAJ_The_Indian_Merchant_Navy_desc:0 "Индия исторически не была великой морской державой, однако она сильно зависит от торговли внутри империи. Чтобы лучше использовать ресурсы, необходимо расширить возможности флота по патрулированию Индийского океана."
 RAJ_An_Army_serving_the_Empire:0 "Армия на службе империи"
 RAJ_An_Army_serving_the_Empire_desc:0 "Хотя наша армия в основном использовалась в Южной Азии и лишь затем в Африке, Британские острова предлагают активнее привлекать индийских солдат к международным операциям."
 RAJ_Indianise_the_Royal_Indian_Navy:0 "Индианизировать Королевский индийский флот"
 RAJ_Indianise_the_Royal_Indian_Navy_desc:0 "Королевский индийский флот тайно считают лишь вспомогательным подразделением настоящего Королевского флота, поскольку большинство его личного состава — британцы. Продвижение индийцев на высокие должности придаст КИФ собственную цель."
 RAJ_Expand_the_Indian_Air_Force:0 "Расширить Военно-воздушные силы Индии"
 RAJ_Study_British_Armour:0 "Британские брони"
 RAJ_Study_British_Armour_desc:0 "В нашей пехотной армии очень не хватает бронетехники, важно изучать зарубежные образцы для модернизации нашей армии, чтобы защитить нас от иностранных угроз."
 RAJ_Expand_the_Indian_Air_Force_desc:0 "Война изменилась. Многие генералы всё ещё живут победой в Великой войне, но современная война ведётся не только на земле, но и в небе. Мы слишком долго пренебрегали этим полем боя. Пора изменить положение."
 RAJ_British_Arms_Shipments:0 "Британские поставки оружия"
 RAJ_British_Arms_Shipments_desc:0 "У нас множество преданных людей, готовых умереть за империю, но мы не можем вооружить их всех. Поставки с Британских островов значительно повысят эффективность."
 RAJ_British_Investments:0 "Британские инвестиции"
 RAJ_British_Investments_desc:0 "Индию трудно назвать промышленной державой, и быстро это не изменится, однако инвестиции британских компаний могут помочь нам двигаться вперёд."
 RAJ_Our_First_Order_of_Business:0 "Наше первое дело"
 RAJ_Our_First_Order_of_Business_desc:0 "После встреч со всеми ветвями власти мы можем внести первый законопроект администрации Линлитгоу в Имперский законодательный совет."
 RAJ_New_Excavation_Companies:0 "Новые добывающие компании"
 RAJ_New_Excavation_Companies_desc:0 "Благодаря расширенной инфраструктуре новые компании смогут начать добычу богатств индийской земли."
 RAJ_New_Industrial_Centers:0 "Новые промышленные центры"
 RAJ_New_Industrial_Centers_desc:0 "Расширение железных дорог также позволяет строить фабрики по всей стране и создавать новый индийский рабочий класс."
 RAJ_Expand_Urban_Centers:0 "Расширение городских центров"
 RAJ_Expand_Urban_Centers_desc:0 "Теперь, когда продовольственная безопасность в основном обеспечена, можно расширять города и создавать новые возможности для некогда бедных сельских масс."
 Railway_Expansion_Act_init:0 "Начата работа над законом о расширении железных дорог"
 Railway_Expansion_Act_passed:0 "Закон о расширении железных дорог принят"
 Railway_Expansion_Act_failed:0 "Закон о расширении железных дорог не принят"
 RAJ_Railway_Expansion_Act:0 "Закон о расширении железных дорог"
 RAJ_Railway_Expansion_Act_desc:0 "Инфраструктура страны недостаточно развита. До сих пор железные дороги строились только на прибыльных направлениях, но это должно измениться, если мы хотим конкурировать в мировой экономике."
 Agricultural_Stabilisation_Act_init:0 "Начата работа над законом о стабилизации сельского хозяйства"
 Agricultural_Stabilisation_Act_passed:0 "Закон о стабилизации сельского хозяйства принят"
 Agricultural_Stabilisation_Act_failed:0 "Закон о стабилизации сельского хозяйства не принят"
 RAJ_Agricultural_Stabilisation_Act:0 "Закон о стабилизации сельского хозяйства"
 RAJ_Agricultural_Stabilisation_Act_desc:0 "Индия всегда была аграрным обществом, но частые засухи разрушали продовольственное снабжение. Поскольку внешняя помощь нередко не поступает, мы сами должны обеспечить стабильное производство зерна."
 Educational_Reform_Act_init:0 "Начата работа над законом об образовательной реформе"
 Educational_Reform_Act_passed:0 "Закон об образовательной реформе принят"
 Educational_Reform_Act_failed:0 "Закон об образовательной реформе не принят"
 RAJ_Educational_Reform_Act:0 "Закон об образовательной реформе"
 RAJ_Educational_Reform_Act_desc:0 "Самые талантливые интеллектуалы уезжали на Британские острова ради лучшего образования под короной. Расширив местные университеты, мы сможем сохранить больше ярких умов Индии."
 Insurance_Act_init:0 "Начата работа над законом о страховании"
 Insurance_Act_passed:0 "Закон о страховании принят"
 Insurance_Act_failed:0 "Закон о страховании не принят"
 RAJ_Insurance_Act:0 "Закон о страховании"
 RAJ_Insurance_Act_desc:0 "Страховой бизнес в Индии долго оставался без внимания из-за слабой правовой базы и отсутствия стимулов. Лишь морская отрасль смогла воспользоваться страхованием, но этот закон может изменить положение."
 War_Powers_Act_init:0 "Начата работа над законом о военных полномочиях"
 War_Powers_Act_passed:0 "Закон о военных полномочиях принят"
 War_Powers_Act_failed:0 "Закон о военных полномочиях не принят"
 RAJ_War_Powers_Act:0 "Закон о военных полномочиях"
 RAJ_War_Powers_Act_desc:0 "Хотя индийцев не спрашивали о вступлении в войну, они наверняка поддержат благородную цель — победить фашизм, распространяющийся по всему миру."
 RAJ_His_Majesties_University:0 "Университет Его Величества"
 RAJ_His_Majesties_University_desc:0 "Делийский университет существует давно, но не удовлетворяет потребности индийских интеллектуалов, продолжающих учиться в Лондоне. Поддержка преподавательских кадров улучшит образование."
 RAJ_Department_of_War_Studies:0 "Кафедра военных исследований"
 RAJ_Department_of_War_Studies_desc:0 "Существует множество областей науки, но военные исследования особенно важны для защиты границ."
 RAJ_Open_for_Business:0 "Открыты для бизнеса"
 RAJ_Open_for_Business_desc:0 "Новая правовая база и страховые компании могут сделать Индию привлекательным рынком для международных предпринимателей. Это поможет испытывающей трудности экономике."
 RAJ_Healthcare_Investments:0 "Инвестиции в здравоохранение"
 RAJ_Healthcare_Investments_desc:0 "Нельзя отрицать плачевное состояние здравоохранения. Большинство индийцев не может позволить себе врача, что вредит обществу и экономике. Народное правительство не может мириться с этим. Мы должны действовать!"
 RAJ_Civil_Aviation_Expansion:0 "Объединить железные дороги"
 RAJ_Civil_Aviation_Expansion_desc:0 "Железнодорожная сеть местами разрознена и построена неэффективно. Пора устранить разрывы и улучшить перевозку грузов и снабжения."
 RAJ_Wheat_Exports:0 "Экспорт пшеницы"
 RAJ_Wheat_Exports_desc:0 "Теперь, несколько стабилизировав поставки продовольствия в Индию, экспорт зерна не помешал.\nВерно?"
 RAJ_Primary_Education:0 "Начальное образование"
 RAJ_Primary_Education_desc:0 "Большинство сельских индийцев необразованно лишь из-за слабого развития начальной и средней школы. Разумное вложение новых средств повысит квалификацию всей рабочей силы."
 RAJ_Drought_Prevention_Measures:0 "Меры по предотвращению засухи"
 RAJ_Drought_Prevention_Measures_desc:0 "Во время муссонов Индия является одним из самых плодородных регионов мира. Проблема — нестабильность сезонных дождей, вызывающая продовольственную неуверенность. Расширив орошение, мы снизим зависимость от ежегодных ливней."
 RAJ_Bolster_our_Security_Forces:0 "Укрепить силы безопасности"
 RAJ_Bolster_our_Security_Forces_desc:0 "Для нормальной работы бизнеса необходимо защищать предпринимателей от мошенников и воров. Неспособность обеспечить защиту, возможно, была главным препятствием для иностранных инвестиций — по крайней мере до сих пор."
 RAJ_Gather_Industrial_Funds:0 "Собрать промышленные средства"
 RAJ_Gather_Industrial_Funds_desc:0 "Наш главный соперник, Индийский национальный конгресс, пользуется широкой поддержкой простых людей. Мы можем компенсировать это крупными обещаниями землевладельцам и капиталистам. Их казна бездонна, а политическое будущее Индии стоит вложений."
 RAJ_Arms_Industry_Expansion:0 "Расширение военной промышленности"
 RAJ_Arms_Industry_Expansion_desc:0 "Индийская армия стала крупнейшей добровольческой армией в истории, но многим из этих новобранцев не хватает необходимого оборудования для поддержки их борьбы. Хотя в прошлом мы полагались на поставки британского оружия, сейчас пришло время облегчить оборонную промышленность в южных азиатских центральных районах."
 RAJ_Implement_Conscription:0 "Осуществление воинской повинности"
 RAJ_Implement_Conscription_desc:0 "Наша добровольческая армия велика, некоторые могут сказать, что она необычайно велика, особенно в условиях колониального правительства. Но все же Лондону нужно больше людей, чтобы выиграть эту войну, и если у нас есть что-то, то это люди. Возможно, это не очень хорошо для нашего населения, но это стоит того."
 RAJ_The_August_Offer:0 "Августовское предложение"
 RAJ_The_August_Offer_desc:0 "Отношения с местным населением субконтинента всегда были непростыми, но нельзя вечно исключать индийцев из управления. Особенно во время войны, когда миллионы страдают, необходимо предотвратить насильственное восстание Раджа. Несколько уступок должны удовлетворить стремление к реформам."
 RAJ_Expand_the_Burma_Road:0 "Расширить Бирманскую дорогу"
 RAJ_Expand_the_Burma_Road_desc:0 "Китай — естественный союзник в борьбе против Японской империи. Мы должны увеличить помощь по Бирманской дороге, чтобы освободить Азию от тирании воинствующего шовинизма."
 RAJ_Border_Fortifications:0 "Пограничные укрепления"
 RAJ_Border_Fortifications_desc:0 "В Азии немало империй, стремящихся к экспансии, поэтому защита восточного фронта должна стать главным приоритетом. Мы возведём укрепления вдоль гор и рек восточной Бирмы."
 raj_diverse_investments_tt:0 "Откроет частные инвестиции в §Yвоенные заводы§! и §Yалюминиевые предприятия§!."
 raj_invest_relations_10_tt:0 "Улучшает §Yотношения с инвесторами§! на §G10§!."
 raj_invest_relations_15_tt:0 "Улучшает §Yотношения с инвесторами§! на §G15§!."
 RAJ_Establish_the_Planning_Commission:0 "Создать Плановую комиссию"
 RAJ_Establish_the_Planning_Commission_desc:0 "Колониальная экономика была создана таким образом, чтобы эксплуатировать население в своих интересах. Настало время провести реформы, которые будут определять приоритеты потребностей и благосостояния всего индийского народа и восстановят устойчивую и справедливую экономику. Первым шагом в этом направлении будет создание национальной плановой комиссии для надлежащего развития экономики, а также обеспечение справедливой заработной платы и условий труда."
 RAJ_Common_Economic_Policy:0 "Общая экономическая политика"
 RAJ_Common_Economic_Policy_desc:0 "Как было определено на Имперской конференции, экономическая политика частей империи будет согласована ради общего экономического роста."
 RAJ_Foster_Private_Investment:0 "Поощрять частные инвестиции"
 RAJ_Foster_Private_Investment_desc:0 "Для роста и развития Индии необходимо поощрять частные инвестиции из внутренних и зарубежных источников. Налоговые льготы, упрощение правил ведения бизнеса и благоприятный инвестиционный климат помогут оживить экономику и стимулировать инновации."
 RAJ_Reform_the_Colonial_Economy:0 "Реформировать колониальную экономику"
 RAJ_Reform_the_Colonial_Economy_desc:0 "В прошлом экономическое планирование в [RAJ.GetNameDef] Она пренебрегла потребностями индийского населения в пользу максимизации добычи ресурсов и прибыли. Если мы хотим сохранить власть над Индией в такие трудные времена, это должно измениться."
 RAJ_Initiate_Land_Reform:0 "Начать земельную реформу"
 RAJ_Initiate_Land_Reform_desc:0 "Система владения и распределения земли в Индии глубоко несправедлива и чрезмерно благоприятствует богатым и влиятельным. Земельная реформа обеспечит более равное распределение и защитит права мелких фермеров и обездоленных общин, одновременно стимулируя развитие всей страны."
 RAJ_Centralise_the_Courts:0 "Централизовать суды"
 RAJ_Centralise_the_Courts_desc:0 "Судебная система Индии из-за наследия доколониальных королевств и британского вмешательства представляет собой неоправданно сложную сеть юрисдикций. Это серьёзно затрудняет ведение бизнеса."
 RAJ_Open_our_Markets:0 "Открыть наши рынки"
 RAJ_Open_our_Markets_desc:0 "Иностранные инвестиции в Индию из других источников, кроме Великобритании, были редкими из-за закрытого характера субконтинента. Эта новая администрация должна объявить миру, что Индия приветствует торговлю и инвестиции с распростертыми объятиями."
 RAJ_Rural_Education:0 "Сельское образование"
 RAJ_Rural_Education_desc:0 "Расширение деревенских школ поможет сельскому населению найти лучшую работу и развивать свои общины. Более образованные граждане ускорят экономический рост, улучшат местную бюрократию и помогут сократить бедность и неравенство."
 RAJ_Cross_Country_Railways:0 "Трансконтинентальные железные дороги"
 RAJ_Cross_Country_Railways_desc:0 "Соединив огромные и разнообразные регионы Индии сетью железных дорог, мы улучшим транспорт и связь между городами. Перевозки товаров и людей станут эффективнее, строительство создаст рабочие места, а страна станет более современной и единой."
 RAJ_Electrify_the_Network:0 "Электрифицировать сеть"
 RAJ_Electrify_the_Network_desc:0 "Железные дороги — основа транспортной системы и экономического развития. Электрификация повысит скорость и эффективность поездов, снизит зависимость от зарубежного топлива и укрепит внутреннюю экономику."
 RAJ_Cooperation_with_the_Princes:0 "Сотрудничество с князьями"
 RAJ_Cooperation_with_the_Princes_desc:0 "Для эффективного управления Индией необходимо наладить прочные отношения с местными князьями и их владениями. Совместное использование ресурсов, согласование политики и общие проекты обеспечат стабильность и процветание всех регионов."
 RAJ_Expand_Tata_Steel:0 "Расширить «Тата Стил»"
 RAJ_Expand_Tata_Steel_desc:0 "«Тата Стил» уже тридцать лет является опорой индустриализации Индии. Дальнейшее расширение и модернизация укрепят наше положение ведущего производителя стали, создадут рабочие места и ускорят экономический рост."
 RAJ_Rewrite_Business_Law:0 "Диверсифицировать частные инвестиции"
 RAJ_Rewrite_Business_Law_desc:0 "На пороге независимости необходимо диверсифицировать частные инвестиции, распределив их между разными отраслями. Это защитит страну от кризисов в отдельных секторах и поможет построить сильное и процветающее будущее."
 RAJ_Sideline_the_Unions:0 "Оттеснить профсоюзы"
 RAJ_Sideline_the_Unions_desc:0 "Профсоюзы Индии часто становились источником беспорядков и препятствовали прогрессу. Ограничив их влияние и найдя другие способы учитывать интересы рабочих, мы сможем сосредоточиться на модернизации страны и повысить производительность."
 RAJ_Commercial_Port_Expansion:0 "Расширение торговых портов"
 RAJ_Commercial_Port_Expansion_desc:0 "По мере роста и индустриализации экономики государства [RAJ.GetNameDef] необходимо расширять торговые порты. Повышение их пропускной способности облегчит международную торговлю, поддержит промышленность и создаст новые рабочие места."
 RAJ_Irrigation_Infrastructure:0 "Ирригационная инфраструктура"
 RAJ_Irrigation_Infrastructure_desc:0 "Развивающейся Индии нужна современная ирригационная инфраструктура. Каналы и водохранилища обеспечат посевы водой даже во время засухи, поддержат фермеров и укрепят экономику."
 RAJ_Foundations_for_the_First_Five_Year_Plan:0 "Основы первого пятилетнего плана"
 RAJ_Foundations_for_the_First_Five_Year_Plan_desc:0 "Недавно созданная Комиссия по планированию разработала планы экономического роста, которые в долгосрочной перспективе будут способствовать экономическому росту Индии. Невыполнение их может привести к некоторому экономическому спаду."
 RAJ_Seek_Trading_Partners:0 "Выдавать земельные наделы"
 RAJ_Seek_Trading_Partners_desc:0 "Мы раздадим разрешения на развитие, земельные приобретения и земельные гранты в масштабах, никогда ранее невиданных на этом субконтиненте. Это в значительной степени будет способствовать развитию индийской экономики."
 RAJ_Invite_Mining_Companies:0 "Пригласить горнодобывающие компании"
 RAJ_Invite_Mining_Companies_desc:0 "Природные богатства Индии огромны и мало освоены. Приглашённые горнодобывающие компании создадут рабочие места, принесут капитал, технологии и опыт, необходимые для полного использования ресурсов."
 RAJ_Development_funds_for_the_States:0 "Фонды развития штатов"
 RAJ_Development_funds_for_the_States_desc:0 "Помощь малым и слаборазвитым княжеским штатам в строительстве инфраструктуры и промышленности значительно укрепит промышленную базу Индии."
 RAJ_Bastions_of_Stablity:0 "Оплоты стабильности"
 RAJ_Bastions_of_Stablity_desc:0 "Во время политических потрясений мы должны опереться на порядок княжеских государств. Они имеют долгую историю управления и доказали надёжность в поддержании мира и процветания."
 RAJ_Industrial_Expertise:0 "Промышленный опыт"
 RAJ_Industrial_Expertise_desc:0 "Благодаря сочетанию образования, иностранной помощи и внутреннего развития, промышленная рабочая сила Индии имеет невиданный в этой части мира уровень знаний."
 RAJ_Mechanized_Agriculture:0 "Механизированное сельское хозяйство"
 RAJ_Mechanized_Agriculture_desc:0 "Мы внедрим механические плуги и другую технику на крупнейших фермах, значительно повысив сельскохозяйственное производство."
 RAJ_Minimum_Wage_Legislation:0 "Закон о минимальной заработной плате"
 RAJ_Minimum_Wage_Legislation_desc:0 "По мере того, как мы вступаем в новую эру для Индии и промышленного прогресса, очень важно защищать права и заработную плату нашего рабочего класса. Внедрение законодательства о минимальной заработной плате обеспечит всем работникам справедливую компенсацию за их труд, а также поможет смягчить бедность и неравенство в нашем обществе."
 RAJ_Protectionist_Tariffs:0 "Протекционистские пошлины"
 RAJ_Protectionist_Tariffs_desc:0 "Повышенные пошлины дадут индийским компаниям более равные условия конкуренции с зарубежными фирмами, защитят от внешнего давления, поддержат занятость и экономический рост."
 RAJ_Integrate_Princely_Economies:0 "Интегрировать экономики княжеств"
 RAJ_Integrate_Princely_Economies_desc:0 "Британский Радж позволял княжествам сохранять отдельные хозяйственные системы. Пора объединить их в единое целое ради эффективной торговли, роста и национального единства."
 RAJ_Solidify_Control_over_the_Banks:0 "Укрепить контроль над банками"
 RAJ_Solidify_Control_over_the_Banks_desc:0 "Индийские банки долго контролировались иностранными интересами, не замечавшими проблем населения. Теперь мы возьмём их под контроль и направим на развитие страны и благо народа."
 RAJ_Broad_Union_Support:0 "Масштабная национализация"
 RAJ_Broad_Union_Support_desc:0 "Независимая страна должна контролировать собственные ресурсы и отрасли. Национализация энергетики, транспорта и производства позволит направлять прибыль обратно в развитие Индии."
 RAJ_Ease_Agricultural_Regulations:0 "Смягчить сельскохозяйственные ограничения"
 RAJ_Ease_Agricultural_Regulations_desc:0 "Сельскохозяйственные правила долго обременяли фермеров и мешали производству и продаже продукции. Их смягчение даст больше свободы и укрепит аграрный сектор."
 RAJ_Rural_Development:0 "Развитие сельских районов"
 RAJ_Rural_Development_desc:0 "Для преобразования сельской Индии необходимо развивать инфраструктуру, образование, здравоохранение и местную экономику. Эти инвестиции выведут общины из бедности и укрепят страну."
 RAJ_Excavation_Investments:0 "Инвестиции в добычу ресурсов"
 RAJ_Excavation_Investments_desc:0 "Инвестиции в добывающие проекты по всей Индии откроют ценные ресурсы и создадут новые рабочие места."
 RAJ_Large_Scale_Privitizations:0 "Масштабная приватизация"
 RAJ_Large_Scale_Privitizations_desc:0 "Для стимулирования экономического роста и повышения эффективности планируем осуществить масштабные привития государственных производств. Это позволит частному сектору инвестировать и управлять, привнося в эти отрасли свежие идеи и инновации. Успех этой политики принесет большую пользу народу Индии, поскольку она приведет к созданию рабочих мест и повышению конкурентоспособности на мировом рынке."
 RAJ_Electrification_of_India:0 "Электрификация Индии"
 RAJ_Electrification_of_India_desc:0 "Стремясь модернизировать и улучшить качество жизни граждан по всей стране, мы реализуем план по доставке кучи электроэнергии в наши промышленные центры. Это включает в себя строительство новых электростанций, расширение линий электропередачи и обеспечение стабильного доступа к нашему промышленному сектору."
 RAJ_Manufacturing_Plants:0 "Промышленные предприятия"
 RAJ_Manufacturing_Plants_desc:0 "Для роста экономики и занятости необходимо создавать и расширять производственные предприятия по всей Индии — от товаров народного потребления до промышленного оборудования."
 RAJ_Arms_Foundries:0 "Оружейные заводы"
 RAJ_Arms_Foundries_desc:0 "Для снабжения растущей армии необходимо создать оружейные заводы по всей стране. Они обеспечат солдат снаряжением и повысят спрос на сталь, уголь и серу."
 RAJ_Import_Industrial_Machinery:0 "Импортировать промышленное оборудование"
 RAJ_Import_Industrial_Machinery_desc:0 "Радикальные экономические цели требуют импорта самого современного промышленного оборудования из ведущих держав. Это повысит производительность, конкурентоспособность и благосостояние."
 RAJ_Solidify_Business_Ties:0 "Укрепить деловые связи"
 RAJ_Solidify_Business_Ties_desc:0 "Оптимизм инвесторов угасает, когда они сталкиваются с трудностями слаборазвитой экономики. Серия встреч, на которых мы выслушаем их жалобы, должна их успокоить."
 RAJ_International_Division_of_Labour:0 "Международное разделение труда"
 RAJ_International_Division_of_Labour_desc:0 "Международное разделение труда относится к тому, как различные страны специализируются на производстве определенных товаров или услуг, основываясь на их уникальных преимуществах и ресурсах. Это позволяет обеспечить более эффективное и экономичное производство, поскольку страны могут сосредоточиться на своих областях знаний и торговли с другими странами для товаров и услуг, в которых они нуждаются. Приняв международное разделение труда, Индия может использовать свои сильные стороны и ресурсы для стимулирования экономического роста и процветания."
 RAJ_Soviet_Economic_Assistance:0 "Советская экономическая помощь"
 RAJ_Soviet_Economic_Assistance_desc:0 "Для укрепления экономики и процветания Индии мы обратимся к Советскому Союзу за экономической помощью и проектами развития. Это даст ресурсы и укрепит политические и хозяйственные связи."
 RAJ_Further_British_Investments:0 "Дополнительные британские инвестиции"
 RAJ_Further_British_Investments_desc:0 "По мере модернизации государства [RAJ.GetNameDef] важно сохранять хорошие отношения с Британией. Инвестиции с Британских островов принесут технологии и опыт, выгодные всему субконтиненту и империи."
 RAJ_Machinery_for_Textiles:0 "Оборудование для текстильной промышленности"
 RAJ_Machinery_for_Textiles_desc:0 "Текстильная промышленность Индии всегда была огромной, но с появлением ткацких станков и аналогичных машин ее производительность резко возросла, и рынки необходимы для заполнения запасов. Мы найдем те рынки в социалистических экономиках мира, многие из которых имеют развитые промышленные центры, из которых мы будем импортировать машины, необходимые для обеспечения нашего промышленного развития."
 RAJ_Raw_Material_Imports:0 "Импорт сырья"
 RAJ_Raw_Material_Imports_desc:0 "Индия богата ресурсами, но многие трудно добывать, а некоторые отсутствуют. Мы обратимся к братским странам за импортом сырья, которого не хватает производственным цепочкам."
 RAJ_Exchange_of_Luxury_Goods:0 "Обмен предметами роскоши"
 RAJ_Exchange_of_Luxury_Goods_desc:0 "В то время как Индия имеет переполненные запасы сахара и кофе, восточноевропейские экономики перенасыщены скотом и льном. Содействие торговле несущественными товарами значительно повысит уровень жизни для обеих стран."
 RAJ_Resources_for_the_Home_Isles:0 "Ресурсы для Британских островов"
 RAJ_Resources_for_the_Home_Isles_desc:0 "Угрозы безопасности Великобритании растут, и задача Империи — обеспечить ресурсы, необходимые для британского производства."
 RAJ_Agricultural_Subsidies:0 "Сельскохозяйственные субсидии"
 RAJ_Agricultural_Subsidies_desc:0 "Сельское хозяйство — основа экономики и источник жизни для миллионов, но оно сильно зависит от погоды и рынков. Субсидии поддержат фермеров и обеспечат устойчивость отрасли."
 RAJ_Continued_Expansion_of_the_Ordnance_Foundries:0 "Дальнейшее расширение оружейных заводов"
 RAJ_Continued_Expansion_of_the_Ordnance_Foundries_desc:0 "Индийские оружейные заводы жизненно важны для производства оружия и боеприпасов. Их расширение и модернизация обеспечат армию лучшим снаряжением."
 RAJ_Contributions_to_the_War_Effort:0 "Вклад в военные усилия"
 RAJ_Contributions_to_the_War_Effort_desc:0 "Во время Великой войны поддержка княжеств значительно помогла победить Германскую империю. На пороге новой большой войны мы снова можем рассчитывать на них."
 RAJ_Connect_the_Remote_Provinces:0 "Развивать отдалённые провинции"
 RAJ_Connect_the_Remote_Provinces_desc:0 "Сельское и изолированное население Индии часто игнорируется в пользу населенных пунктов субконтинента. Развитие этих заброшенных частей Раджа, где сельское хозяйство производит лишь небольшой избыток, должно помочь национальному продовольственному снабжению."
 RAJ_Expand_the_Diplomatic_Corps:0 "Расширить дипломатический корпус"
 RAJ_Expand_the_Diplomatic_Corps_desc:0 "Амбициозной внешней политике Индии нужен расширенный дипломатический корпус. Новые представительства улучшат отношения с партнёрами, усилят инициативу в мировых делах и помогут найти союз безопасности."
