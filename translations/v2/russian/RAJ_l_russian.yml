 raj_legislative_situation:0 "Законодательная ситуация"
 raj_legislative_situation_desc:0 "Если наша администрация хочет провести хоть один закон, ей придётся считаться с Имперским законодательным советом, в который входят как избранные, так и назначенные члены, представляющие разные группы интересов. Мы должны тщательно уравновешивать их требования, если хотим сохранить стабильность страны после завершения всех политических споров.\n\n[RAJ.Current_Act][RAJ.Legislative_Status]"
 finalize_the_vote:0 "Завершить голосование"
 legislative_status:0 "\n\tТекущее мнение индуистов о законе: [RAJ.ind_support_loc]\n\tТекущее мнение мусульман о законе: [RAJ.pak_support_loc]\n"
 FOCUS_FILTER_RAJ_PROVINCIAL_ELECTIONS:0 "Провинциальные выборы"
 legislative_railway:0 "В высших правительственных кругах идут ожесточённые споры о законе о расширении железных дорог. Его главная цель — строительство национализированных, не ориентированных на прибыль железнодорожных линий для дальнейшего промышленного развития."
 legislative_agriculture:0 "В высших правительственных кругах идут ожесточённые споры о законе о стабилизации сельского хозяйства. Его главные цели — улучшение местного орошения, а также регулирование производства и импорта зерна."
 legislative_education:0 "В высших правительственных кругах идут ожесточённые споры о законе об образовательной реформе. Его важнейшие цели — остановить отток индийской интеллигенции в английские университеты и улучшить сельское образование для подготовки специалистов в промышленности и сельском хозяйстве."
 legislative_insurance:0 "В высших правительственных кругах идут ожесточённые споры о законе о страховании. Его наиболее преданные сторонники считают главной проблемой слабое состояние индийских инвестиций и предлагают решить её путём государственного регулирования страхового бизнеса."
 legislative_war:0 "В высших правительственных кругах идут ожесточённые споры о законе о военных полномочиях. Вице-король подчёркивает, что сейчас не время для дискуссий: Индия воюет, и исполнительная власть должна получить полномочия для ведения войны. Любая задержка принятия закона играет на руку врагу!"
 legislative_idle:0 "Залы Имперского законодательного совета пустуют: в настоящее время ни один законопроект не обсуждается."
