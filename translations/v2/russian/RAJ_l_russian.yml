 r56_RAJ_militarized_hindutva_desc:0 "Клянёмся Шивой! Все индуисты должны служить Матери-Индии и защищать её богов от врагов."
 r56_RAJ_weapons_for_the_new_india:0 "Оружие для новой Индии"
 r56_RAJ_weapons_for_the_new_india_desc:0 "Революцию необходимо защитить!"
