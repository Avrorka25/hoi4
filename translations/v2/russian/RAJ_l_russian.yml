 upa_support:0 "Мы поддержали Юнионистскую партию"
 ifb_support:0 "Мы поддержали Независимую рабочую партию"
 raj_influencing_country:0 "Сейчас влияет на политику другой страны"
 r56_raj.1.t:0 "Назначение лорда Линлитгоу"
 r56_raj.1.d:0 "Двадцать второй вице-король и генерал-губернатор Индии Фримен Фримен-Томас Уиллингдон заменён недавно назначенным Виктором Хоупом Линлитгоу, который вскоре станет двадцать третьим вице-королём Индии. Современники описывали его как целеустремлённого и честолюбивого политика, унаследовавшего политическую страсть от отца, первого генерал-губернатора Австралии. Мир смотрит на Индию, гадая, как его правление повлияет на субконтинент."
 r56_raj.1.a:0 "Понятно."
 r56_raj.2.t:0 "Последние часы вице-короля"
 r56_raj.2.desc:0 "Последние пять лет были изнурительными для генерал-губернатора. Это было время гражданских волнений, с которыми лорд Уиллингдон хорошо умел бороться ещё со времён губернаторства в Бомбее. Приказы сверху требовали сотрудничества, но только с теми, кто действовал в правовых рамках Раджа. Следуя этому курсу, он развернул массовые аресты, до сих пор подрывающие его популярность. Несмотря на мнение индийского населения, сам он считал своё пребывание в Индии в целом успешным. Но, как и правление каждого предыдущего вице-короля, его срок подходит к концу."
 r56_raj.2.a:0 "Удачи преемнику — она ему понадобится."
 r56_raj.3.t:0 "Назначение Арчибальда Уэйвелла"
 r56_raj.3.d:0 "Назначение лорда Линлитгоу вице-королём и генерал-губернатором оказалось непростой задачей: народные волнения постоянно росли, и лишь временные политические уступки, завершившиеся провинциальными выборами 1937 года, смогли ненадолго их остановить. После высокой явки индийцев многие наиболее способные местные политики были приглашены в кабинет министров и впервые в истории превзошли числом британских чиновников. Но, как завершилось правление лорда Уиллингдона, так завершается и срок Линлитгоу."
 r56_raj.3.a:0 "Встречайте нового начальника..."
 r56_raj.4.t:0 "Назначение Луиса Маунтбеттена"
 r56_raj.4.d:0 "Большинство индийских политиков считало усилия Уэйвелла благородными, но ограниченными Лондоном. Вскоре после прибытия в резиденцию вице-короля в Дели он попытался облегчить продовольственное положение Бенгалии. Он также стал первым вице-королём и генерал-губернатором, обсуждавшим самоуправление с видными индийскими политическими лидерами, однако, к разочарованию многих, Лондон подрывал эти усилия, стремясь удержать Индию любой ценой."
 r56_raj.4.i:0 "Большинство индийских политиков считало усилия Уэйвелла благородными, но ограниченными Лондоном. Вскоре после прибытия в бывшую резиденцию вице-короля в Дели он попытался облегчить продовольственное положение Бенгалии. Он чрезвычайно тесно сотрудничал с индийским правительством и оставался верным представителем монарха в Лондоне. Однако, как это часто бывало в истории империи, его заменит Луис Маунтбеттен."
 r56_raj.4.a:0 "...такого же, как старый"
 r56_raj.101.t:0 "Провинциальные выборы завершились"
 r56_raj.101.desc:0 "Вице-король давно страшился этого дня: Имперский законодательный совет перестраивается, и теперь в законодательном органе преобладают вновь избранные представители и оппозиционеры, из-за чего нам станет труднее навязывать свою волю."
 r56_raj.101.a:0 "Новый рассвет для Индии."
 r56_raj.102.t:0 "Закон о расширении железных дорог принят"
 r56_raj.102.d:0 "После нескольких месяцев утомительных дебатов в правительственных залах Дели вице-король с гордостью объявляет о выделении крупных средств на строительство современных и эффективных железных дорог по всему субконтиненту."
 r56_raj.102.a:0 "Немедленно закажу билет на поезд!"
 r56_raj.103.t:0 "Закон о расширении железных дорог провалился"
 r56_raj.103.d:0 "Вице-король долго и упорно пытался провести этот проклятый закон, но не смог заручиться поддержкой Имперского законодательного совета. Ожидается, что он выступит с речью и неохотно признает провал законопроекта."
 r56_raj.103.a:0 "Похоже, с покупкой билета придётся подождать."
 r56_raj.104.t:0 "Закон о стабилизации сельского хозяйства принят"
 r56_raj.104.d:0 "Закон назвали последним гвоздём в крышку гроба частых голодовок в Индии, и вице-король не упустил случая подчеркнуть его преимущества. Благодаря этому поддержка среди индуистских и мусульманских законодателей оказалась подавляющей, и законопроект был принят довольно легко."
 r56_raj.104.a:0 "Индия вздыхает с облегчением."
 r56_raj.105.t:0 "Закон о стабилизации сельского хозяйства провалился"
 r56_raj.105.d:0 "Хотя этот закон считался революционной мерой по предотвращению голода, к разочарованию большинства индийцев он не получил достаточной поддержки в Имперском законодательном совете.\nУже подготовленные планы по улучшению защиты от засухи были отменены."
 r56_raj.105.a:0 "Печальное положение дел."
 r56_raj.106.t:0 "Закон об образовательной реформе принят"
 r56_raj.106.d:0 "Самые талантливые и одарённые жители Индии давно уезжают на Британские острова за лучшим образованием, оставляя родину. Вице-король давно подчёркивал важность создания общества, в котором интеллектуалы смогут по-настоящему процветать, и реформа школ и университетов является логичным первым шагом к этой цели."
 r56_raj.106.a:0 "Нас ждёт светлое будущее."
 r56_raj.107.t:0 "Закон о реформе образования провалился"
 r56_raj.107.d:0 "Непонятно, что привело к сокрушительному поражению закона об образовательной реформе, обещавшего так много. Ясно лишь одно: руки вице-короля в вопросах образования теперь связаны. Индия может только гадать, что могло бы произойти."
 r56_raj.107.a:0 "Похоже, тогда я поеду в Лондон."
 r56_raj.108.t:0 "Закон о страховании прошел"
 r56_raj.108.d:0 "Индию часто сравнивают с другими аграрными и слаборазвитыми экономиками. Во многом это связано с недостаточной поддержкой урбанизации и индустриализации. Однако иностранные инвестиции могут ускорить экономический рост. Поэтому многие представители оппозиции поддержали этот эпохальный законопроект."
 r56_raj.108.a:0 "Мы открыты для бизнеса."
 r56_raj.109.t:0 "Закон о страховании провалился"
 r56_raj.109.d:0 "Законопроект, который должен был открыть аграрный субконтинент для дальнейших иностранных инвестиций, с треском провалился в законодательном органе. Вице-король вложил в него много времени и сил, но не сумел убедить многих оппозиционеров в его преимуществах. Иностранные наблюдатели, готовые инвестировать, теперь отступили и предпочитают более стабильные рынки."
 r56_raj.109.a:0 "Похоже, моему предприятию придётся подождать."
 r56_raj.110.t:0 "Закон о военных полномочиях принят"
 r56_raj.110.d:0 "Когда германские Bf 110 сеяли разрушения в британской глубинке, стало ясно, что Британским островам нужна помощь империи. И империя ответила благодаря недавнему успеху закона о военных полномочиях в нашем почтенном Законодательном совете. Теперь индийская администрация сможет направлять значительно больше ресурсов на Вторую мировую войну."
 r56_raj.110.a:0 "Отправляемся на войну!"
 r56_raj.111.t:0 "Закон о военных полномочиях провалился"
 r56_raj.111.d:0 "Многим индийцам, как индуистам, так и мусульманам, этот закон было трудно принять. Их втянули в войну без консультаций и малейшего учёта их мнения, поэтому многие предсказывали, что недавно ставший преимущественно выборным Имперский законодательный совет проголосует против расширения полномочий исполнительной власти в военное время."
 r56_raj.111.a:0 "Что подумает Лондон?"
 r56_raj.112.t:0 "Встреча с законодательной властью"
 r56_raj.112.d:0 "Хотя большинство членов Имперского законодательного совета назначается, они верны не только вице-королю, но и собственным интересам, а также тем, кто финансирует их кампании. Тем не менее встреча с Советом оказалась далеко не бесполезной: мы обсудили многие будущие планы администрации и уже заручились некоторой поддержкой. Конечно, это ещё не обещание, но эти голоса понадобятся, если администрация Линлитгоу хочет быть продуктивной."
 r56_raj.112.a:0 "Когда-нибудь мы подчиним себе это место."
 r56_raj.113.t:0 "Встреча с судебной властью"
 r56_raj.113.d:0 "Правовая система Индии всегда была сложной для постороннего из-за множества местных судов низшей инстанции. Первой удобной точкой контакта станет Тайный совет в Лондоне. За ним остаётся последнее слово во всех вопросах, хотя он редко вмешивается в индийские дела. Второй нашей целью станут местные высшие суды, обладающие значительной властью в провинциях. Всё, что поможет обеспечить их лояльность, получит высший приоритет."
 r56_raj.113.a:0 "Запутанная сеть."
 r56_raj.114.t:0 "Наше первое дело"
 r56_raj.114.d:0 "Благодаря нашим контактам в Законодательном и Судебном органах мы теперь можем выбирать, с чего начать наши усилия. Наш кабинет изложил возможности расширения нашей железнодорожной системы или стабилизации нашего снабжения продовольствием, и все, что мы выберем сделать в первую очередь, будет иметь важное значение для Индии."
 r56_raj.114.a:0 "Транспорт отчаянно нуждается в реформе."
 r56_raj.114.b:0 "Положение сельского хозяйства критическое."
 r56_raj.114.c:0 "Вместо этого нужно сосредоточиться на войне!"
 r56_raj.115.t:0 "Министерство промышленности и труда"
 r56_raj.115.d:0 "Некоторые считают министра промышленности одним из самых влиятельных членов любого кабинета, поэтому необходимо тщательно решить, кто достоин этой должности."
 r56_raj.115.a:0 "Будем действовать осторожно."
 r56_raj.115.b:0 "Найти лучших экономистов страны."
 r56_raj.116.t:0 "Министерство обороны и военного снабжения"
 r56_raj.116.d:0 "В условиях высокой напряженности в мире война может начаться в любой момент, и мы должны иметь министра обороны для выполнения этой задачи."
 r56_raj.116.a:0 "Землевладелец укрепит мобилизацию."
 r56_raj.116.b:0 "Нам нужен промышленник, способный построить военную машину."
 r56_raj.117.t:0 "Министерство здравоохранения, образования и земель"
 r56_raj.117.d:0 "Другие министерства занимаются показателями промышленного развития и численностью призыва, но именно социальные ведомства наполняют сердце Индии и должны получать соответствующее внимание."
 r56_raj.117.a:0 "Консервативный выбор."
 r56_raj.117.b:0 "Прогрессивный выбор."
 RAJ_agricultural_shipments:0 "Поставки продовольствия"
 RAJ_agricultural_shipments_desc:0 "Мы выполнили свой долг, снабдив Индию продовольствием в это тяжёлое время. Вероятно, были спасены миллионы жизней, а кроме того, это принесло нам большой престиж среди других стран."
