 ilp_concessions_desc:0 "Индийские левые разделены и преследуют разные цели. \nНаше внимание к кастовой системе даёт широкие возможности для сотрудничества и компромисса с другими группами, требования которых могут противоречить друг другу. Если мы уравновесим общие интересы, это значительно поможет нашей избирательной стратегии."
