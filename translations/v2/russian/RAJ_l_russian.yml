 RAJ_a_new_indian_elite:0 "Новая индийская элита"
 RAJ_british_departure:0 "Уход британцев"
 RAJ_british_departure_desc:0 "По мере того, как британская автономия быстро рушится, настало время захватить день и организовать нашу политическую систему."
 RAJ_assemble_the_congress:0 "Созвать Конгресс"
 RAJ_assemble_the_congress_desc:0 "Теперь, когда свобода от Британии обеспечена, Индийский конгресс должен собраться и обсудить реформы."
 RAJ_concessions_to_the_untouchables:0 "Уступки неприкасаемым"
 RAJ_concessions_to_the_untouchables_desc:0 "Неприкасаемые, находящиеся на самом дне кастовой системы, презираются обществом, но представляют значительную силу, которую нельзя игнорировать. Движение Бхимрао Рамджи Амбедкара способно потрясти основы общества, если его не признать. Практические уступки гораздо проще, чем наблюдать их массовый переход в ислам, христианство или атеистический коммунизм."
 RAJ_modernization_program:0 "Программа модернизации"
 RAJ_modernization_program_desc:0 "После упразднения колониальных монополий мы сможем построить новую экономику. К 2020 году мы станем сверхдержавой!"
 RAJ_a_new_indian_elite_focus:0 "Новая индийская элита"
 RAJ_a_new_indian_elite_focus_desc:0 "Индийские промышленники действовали ещё при колониальном правлении, но были скованы его ограничениями. После ухода британцев пришло время подъёма индийской элиты."
 RAJ_towards_a_post_colonial_economy:0 "К постколониальной экономике"
 RAJ_towards_a_post_colonial_economy_desc:0 "Экономические реформы и освобождение индийского потенциала приведут к подъёму отечественного бизнеса."
 RAJ_influence_of_the_radicals:0 "Влияние радикалов"
 RAJ_influence_of_the_radicals_desc:0 "Радикалы Всеиндийского блока вперёд становятся всё активнее и оспаривают ненасильственную доктрину Конгресса."
 RAJ_indian_socialism:0 "Индийский социализм"
 RAJ_indian_socialism_desc:0 "Создание общего индийского общества, в котором религия и касты не будут разделять нас, приведёт нас к светлому будущему."
 RAJ_religious_equality:0 "Религиозное равенство"
 RAJ_religious_equality_desc:0 "Хотя марксизм выступает за упразднение религии, сейчас это невозможно. Но мы можем хотя бы устранить религию как источник общественного раскола."
 RAJ_popular_mobilization:0 "Народная мобилизация"
 RAJ_popular_mobilization_desc:0 "Лишённые прав далиты, бедные крестьяне и эксплуатируемые кули осознали политическое значение своего освобождения через служение революции. Пора создать армию, готовую защищать новую Индию."
 RAJ_collectivism:0 "Коллективизм"
 RAJ_land_reform:0 "Земельная реформа"
 RAJ_land_reform_desc:0 "Перераспределить землю!"
 RAJ_modernized_agriculture:0 "Модернизированное сельское хозяйство"
 RAJ_modernized_agriculture_desc:0 "Тракторы на полях позволят сохранить сельскохозяйственную производительность при меньшем числе крестьян."
 RAJ_collectivism_desc:0 "Мы всё ещё страдаем от последствий многолетнего колониализма, но теперь будущее в наших руках. Объединив имеющиеся ресурсы, мы быстрее модернизируем общество."
 RAJ_support_anti_imperialism_in_china:0 "Поддержать Китай"
 RAJ_support_anti_imperialism_in_china_desc:0 "Китай необходимо защитить! Теперь на нас лежит ответственность сохранить часть путей сообщения с Китаем, от которых зависит его будущее."
 RAJ_increased_chinese_cooperation:0 "Расширенное сотрудничество с Китаем"
 RAJ_increased_chinese_cooperation_desc:0 "Чтобы защитить Азию, мы должны защитить Китай и присоединиться к его военным усилиям!"
 RAJ_join_the_comintern:0 "Вступить в Коминтерн"
 RAJ_join_the_comintern_desc:0 "Для коммунистической страны логично обратиться к Москве и создать с ней неразрывный союз."
 RAJ_hindu_nationalism:0 "Индуистский национализм"
 RAJ_hindu_nationalism_desc:0 "Мы все должны любить Мать-Индию и признать индуизм силой, объединяющей нас."
 RAJ_substitution_technologies:0 "Технологии замещения"
 RAJ_substitution_technologies_desc:0 "Не имея доступа к некоторым ресурсам Британской империи, мы обязаны внедрить программы замещения и обеспечить автаркическую независимость."
 RAJ_redistribute_properties:0 "Перераспределить собственность"
 RAJ_redistribute_properties_desc:0 "Перераспределив британскую собственность и разделив землю, мы обеспечим будущее множеству обездоленных людей."
 RAJ_militarized_hindutva:0 "Милитаризированная хиндутва"
 RAJ_militarized_hindutva_desc:0 "Клянёмся Шивой! Все индуисты должны служить Матери-Индии и защищать её богов от врагов."
 RAJ_weapons_for_the_new_india:0 "Оружие для новой Индии"
 RAJ_weapons_for_the_new_india_desc:0 "Революцию необходимо защитить!"
 RAJ_dream_of_akhand_hindustan:0 "Мечта об Акханд Хиндустане"
 RAJ_dream_of_akhand_hindustan_desc:0 "На протяжении веков иностранцы разделяли Великую Индию, но теперь объединённый индийский народ разрушит их замыслы и завершит объединение страны."
 RAJ_invade_afghanistan:0 "Вторгнуться в Афганистан"
 RAJ_invade_afghanistan_desc:0 "Афганистан когда-то находился под индийским влиянием... и вновь окажется под ним."
 RAJ_the_mountain_frontier:0 "Горная граница"
 RAJ_the_mountain_frontier_desc:0 "Непал и Бутан являются частью субконтинента и должны быть включены в наш совершенный союз."
 RAJ_reclaim_treaty_ports:0 "Вернуть договорные порты"
 RAJ_reclaim_treaty_ports_desc:0 "Пондичерри и Гоа должны быть возвращены Матери-Индии."
 RAJ_bring_back_burma:0 "Вернуть Бирму"
 RAJ_bring_back_burma_desc:0 "Бирма — буддийская территория, некогда входившая в Радж, и потому является законной частью Великой Индии."
 RAJ_unify_dravidian_lands:0 "Объединить дравидийские земли"
 RAJ_unify_dravidian_lands_desc:0 "На юге лежат земли дравидийцев, ещё не присоединившихся к Матери-Индии. Пора это изменить."
 RAJ_operation_polo:0 "Операция «Поло»"
 RAJ_operation_polo_desc:0 "Накажем Хайдарабад за провозглашение независимости и объединим Индию!"
 RAJ_tfv_land_reform:0 "Земельная реформа"
 RAJ_crush_hyderabad:0 "Сокрушить Хайдарабад"
 RAJ_crush_hyderabad_desc:0 "Мусульманская элита государства [HYD.GetNameDef] угнетает благочестивых индуистов. Она препятствует полному освобождению индуистов и объединению всей Индии."
 RAJ_join_the_axis:0 "Вступить в Ось"
 RAJ_join_the_axis_desc:0 "Общий враг в лице англо-французского империализма объединяет Индию и новую Германию. Мы должны официально оформить этот союз."
 RAJ_reactivate_our_japanese_contacts:0 "Восстановить связи с Японией"
 RAJ_reactivate_our_japanese_contacts_desc:0 "Японская империя и её Сфера сопроцветания — единственная сила, способная сокрушить европейские империи и их порядки. Мы должны использовать старые связи для переговоров об условиях нового союза."
 RAJ_new_scientific_order:0 "Новый научный порядок"
 RAJ_new_scientific_order_desc:0 "Научные сообщества Индии и её союзников должны постоянно поддерживать связь ради непрерывных инноваций."
 RAJ_ideological_air_force:0 "Идеологизированные ВВС"
 RAJ_ideological_air_force_desc:0 "Наши ценности должны глубоко укорениться в ВВС, укрепляя сотрудничество с союзниками и другими родами войск."
 r56_RAJ_revolt_against_the_oppressors:0 "Восстание против угнетателей"
 r56_RAJ_revolt_against_the_oppressors_desc:0 "Время пришло. За оружие! За оружие! Каждый человек в каждой деревне должен бороться против колонизаторов."
 r56_RAJ_hindu_nationalism:0 "Индуистский национализм"
 r56_RAJ_hindu_nationalism_desc:0 "Мы все должны любить Мать-Индию и признать индуизм силой, объединяющей нас."
 r56_RAJ_substitution_technologies:0 "Технологии замещения"
 r56_RAJ_substitution_technologies_desc:0 "Не имея доступа к некоторым ресурсам Британской империи, мы обязаны внедрить программы замещения и обеспечить автаркическую независимость."
 r56_RAJ_redistribute_properties:0 "Перераспределить собственность"
 r56_RAJ_redistribute_properties_desc:0 "Перераспределив британскую собственность и разделив землю, мы обеспечим будущее множеству обездоленных людей."
