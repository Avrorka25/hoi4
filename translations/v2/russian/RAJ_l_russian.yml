 india_seperate_burma_tt:0 "§RБирма будет отделена от [RAJ.GetNameDef].§!"
 RAJ_port_of_yanoan:0 "Операция «Коэл»"
 RAJ_port_of_yanoan_desc:0 "Пообещав местному населению референдум об объединении с Индией, мы лишим французов возможности отказать в нашем требовании."
 RAJ_port_of_goa:0 "Операция «Врикша Дип»"
 RAJ_port_of_goa_desc:0 "Одно из последних порочных проявлений европейского колониализма должно быть возвращено законным владельцам. При необходимости — силой..."
