 RAJ_Demands_to_London_desc:0 "После невероятных жертв, принесённых населением государства [RAJ.GetNameDef] во имя короля, люди всё чаще задумываются о вознаграждении. Жизни, потерянные в обеих мировых войнах, где индийский народ поддерживал Британские острова, несомненно должны быть возмещены прекращением колониального господства, державшего субконтинент в подчинении целое столетие."
