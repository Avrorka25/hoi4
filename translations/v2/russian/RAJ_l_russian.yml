 post_election_struggle:0 "Борьба за независимость"
 post_election_struggle_desc:0 "Если мы когда-нибудь достигнем §YНезависимость§! Без кровопролития мы должны оказывать давление на людей. §Yбританский§!. Мы также должны оказывать большее влияние, чем наши соперники. §YВсеиндийская мусульманская лига§! Мы хотим вывести Пакистан из наших границ.\n\n\t[RAJ.GetFlag]текущий §Y[Root.GetReigningGovernmentColor]§! Влияние - это [?Root.ind_influence]\n\t[PAK.GetFlag]текущий §YВсеиндийская мусульманская лига§! Влияние - это [?Root.pak_influence]\n\nВ настоящее время мы ежедневно получаем §Y[?Root.ind_influence_daily] влияние§! Когда AIML получает §Y[?Root.pak_influence_daily] влияние§!.\n\nДля достижения §YНезависимость§! Мы должны оказать 100 влияние, но если §YЭймл§! Более 50% наших §Yвлияние§! Великобритания освободит Пакистан в качестве отдельного государства. Если §YЭймл§! Более 66% нашего влияния они также получат Кашмир."
