 south_asian_liberation:0 "Освобождение Южной Азии"
 south_asian_liberation_desc:0 "Чтобы посеять семена восстания в Южной Азии, мы должны направлять военную и политическую помощь угнетённым странам.\n\nПосле завершения любого фокуса, связанного с восстанием, политическая поддержка и оружие будут отправлены для защиты от возможного возмездия.\n\n[RAJ.GetSalVariable]"
 raj_sal_variable:0 "[SRL.GetFlag] §YШри-ланкийское§! оружие §Rдля восстания§!: §Y[?SRL_arms]§!.\n[SRL.GetFlag] Поддержка §YПартии Ланка Сама Самаджа§! §Rдля восстания§!: §Y[?SRL_pol]§!.\n\n[NEP.GetFlag] §YНепальское§! оружие §Rдля восстания§!: §Y[?NEP_arms]§!.\n[NEP.GetFlag] Поддержка §YКоммунистической партии Непала§! §Rдля восстания§!: §Y[?NEP_pol]§!.\n\n[SRL.GetFlag] §YБутанское§! оружие §Rдля восстания§!: §Y[?BHU_arms]§!.\n[BHU.GetFlag] Поддержка §YКоммунистической партии Бутана§! §Rдля восстания§!: §Y[?BHU_pol]§!."
