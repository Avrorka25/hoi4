 RAJ_Princely_States:0 "Княжеские государства"
 RAJ_Princely_States_desc:0 "Хотя администрация Британского Раджа находится в Дели, не вся его номинальная территория управляется из столицы. Местные князья добились значительной автономии, вступив в союз с британцами. К затронутым регионам относятся:\n\n§YГуджарат, Раджастхан, Индаур, Хайдарабад, Майсур, Кашмир, Сикким, Белуджистан, Одиша, Северный Кашмир, Мандалай, Пешавар и Шанские земли§!"
 RAJ_Princely_States_tt:0 "Скорость местного строительства в §Yкняжеских государствах§!: [?RAJ.prince_state_build_speed|%0=+].\nМестные людские ресурсы в §Yкняжеских государствах§!: [?RAJ.prince_state_manpower|%0=+].\nМестные ресурсы в §Yкняжеских государствах§!: [?RAJ.prince_state_resources|%0=+].\n"
