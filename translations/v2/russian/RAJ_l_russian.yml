 AIML_UP_COALITION:0 "Юнионистская партия состоит в коалиции со Всеиндийской мусульманской лигой."
 aiml_up_coalition_news:0 "Особенно подавляющей была их поддержка в провинциях с мусульманским большинством, где они заключили союз со спорной Всеиндийской мусульманской лигой, проложив путь к независимому Пакистану."
 aiml_up_fight_news:0 "Они мужественно боролись против крайне популярной Всеиндийской мусульманской лиги, которая предлагала создать отдельное государство для мусульман и благодаря этой идее привлекла множество голосов и внимания."
 aiml_up_neutral_news:0 "Они стали партией с самой широкой поддержкой меньшинств в соответствующих провинциях, поэтому, быть может, этот давно разделённый субконтинент наконец увидит мир."
 ifyouseethisreportitasabug:0 "\n\nЕсли вы видите это сообщение, сообщите об ошибке в Discord, желательно приложив файл сохранения."
