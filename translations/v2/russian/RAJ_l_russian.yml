 r56_RAJ_land_reform:0 "Земельная реформа"
 r56_RAJ_crush_hyderabad:0 "Сокрушить Хайдарабад"
 r56_RAJ_crush_hyderabad_desc:0 "Мусульманская элита государства [HYD.GetNameDef] угнетает благочестивых индуистов. Она препятствует полному освобождению индуистов и объединению всей Индии."
 r56_RAJ_join_the_axis:0 "Вступить в Ось"
 r56_RAJ_join_the_axis_desc:0 "Общий враг в лице англо-французского империализма объединяет Индию и новую Германию. Мы должны официально оформить этот союз."
 r56_RAJ_reactivate_our_japanese_contacts:0 "Восстановить связи с Японией"
 r56_RAJ_reactivate_our_japanese_contacts_desc:0 "Японская империя и её Сфера сопроцветания — единственная сила, способная сокрушить европейские империи и их порядки. Мы должны использовать старые связи для переговоров об условиях нового союза."
 r56_RAJ_new_scientific_order:0 "Новый научный порядок"
 r56_RAJ_new_scientific_order_desc:0 "Научные сообщества Индии и её союзников должны постоянно поддерживать связь ради непрерывных инноваций."
 r56_RAJ_ideological_air_force:0 "Идеологизированные ВВС"
 r56_RAJ_ideological_air_force_desc:0 "Наши ценности должны глубоко укорениться в ВВС, укрепляя сотрудничество с союзниками и другими родами войск."
 r56_RAJ_towards_a_post_colonial_economy:0 "К постколониальной экономике"
 r56_RAJ_towards_a_post_colonial_economy_desc:0 "Экономические реформы и раскрытие потенциала Индии приведут к подъёму индийского бизнеса."
 r56_RAJ_modernization_program:0 "Программа модернизации"
 r56_RAJ_modernization_program_desc:0 "После отмены колониальных монополий мы сможем построить новую экономику. К 2020 году Индия станет сверхдержавой!"
 r56_RAJ_indian_education:0 "Индийское образование"
 r56_RAJ_indian_education_desc:0 "Колонизаторы учили нас покорности и раболепию... Мы должны отбросить эти орудия господства и использовать знания для освобождения Индии!"
 r56_RAJ_establish_a_general_staff:0 "[ROOT.GetAdjective]ий генеральный штаб"
 r56_RAJ_establish_a_general_staff_desc:0 "У нашей армии нет правильной тактики и организации. Создание надлежащего генерального штаба укрепит ослабленный военный истеблишмент."
 r56_RAJ_army_reform:0 "Армейская реформа"
 r56_RAJ_army_reform_desc:0 " Реорганизация армии — это длительный процесс. Наш новый общий материал указывает на необходимость в военных маневрах для подготовки солдат и обучения офицеров."
 r56_RAJ_doctrine_effort:0 "Развитие доктрины"
 r56_RAJ_equipment_effort:0 "Развитие вооружения"
 r56_RAJ_equipment_effort_desc:0 "Возможности пехотного снаряжения постоянно расширяются. Мы сосредоточимся на оснащении войск лучшими доступными образцами."
 r56_RAJ_equipment_effort_2:0 "Модернизировать стрелковое оружие"
 r56_RAJ_equipment_effort_2_desc:0 "Мы продолжим работу, чтобы пехота и войска поддержки получили лучшее доступное современное снаряжение."
 r56_RAJ_mechanization_effort:0 "Развитие механизации"
 r56_RAJ_mechanization_effort_desc:0 "Переосмыслив возможности моторизованной пехоты, мы расширим пределы современного машиностроения."
 r56_RAJ_doctrine_effort_2:0 "Военные игры"
 r56_RAJ_doctrine_effort_2_desc:0 "В межвоенные годы и недавних конфликтах поле боя изменилось. Мы должны постоянно пересматривать доктрины с учётом нового опыта."
 r56_RAJ_establish_a_military_academy:0 "Создать военную академию"
 r56_RAJ_establish_a_military_academy_desc:0 "Новая военная академия упростит изучение доктрин и обмен военными знаниями."
 r56_RAJ_equipment_effort_3:0 "Исследования полевой артиллерии"
 r56_RAJ_equipment_effort_3_desc:0 "Вместо копирования и закупки иностранного оружия мы должны стать мировым лидером в области пехотного вооружения."
 r56_RAJ_doctrine_effort_desc:0 "Доктрины сухопутной войны времён Великой войны устарели. Лучшие умы страны должны сформировать военную мысль будущего."
 r56_RAJ_army_modernization:0 "Модернизация армии"
 r56_RAJ_army_modernization_desc:0 "Для тяжёлых манёвров и учений солдатам необходимы подходящая форма, инструменты и снаряжение."
 r56_RAJ_motorization_effort:0 "Развитие моторизации"
 r56_RAJ_motorization_effort_desc:0 "Мобильность и защита необходимы для безопасной доставки пехоты на поле боя и её эвакуации. Развитие этих направлений позволит действовать быстрее."
 r56_RAJ_establish_a_armor_corp:0 "Создать бронетанковый корпус"
 r56_RAJ_establish_a_armor_corp_desc:0 "Недавно приобретённая иностранная техника вдохновила местных инженеров на создание нового типа бронемашин — более быстрых, прочных и мощных, чем мы могли представить."
 r56_RAJ_field_hospitals:0 "Улучшить полевые госпитали"
 r56_RAJ_field_hospitals_desc:0 "В нынешних условиях потеря талантливых и опытных солдат в бою — непозволительная роскошь."
 r56_RAJ_special_forces:0 "Войска специального назначения"
 r56_RAJ_special_forces_desc:0 "Нам нужны элитные войска; приоритет следует отдать горным стрелкам и десантникам."
 r56_RAJ_signal_companies:0 "Роты связи"
 r56_RAJ_signal_companies_desc:0 "Удары и операции станут значительно эффективнее, если выделить дополнительный персонал со средствами связи."
 r56_RAJ_modern_logistics:0 "Современная логистика"
 r56_RAJ_modern_logistics_desc:0 "Лояльность армии зависит от её способности сражаться за наше дело. Если мы не сможем снабжать войска необходимым снаряжением, то рискуем столкнуться с мятежами и массовым дезертирством."
 r56_RAJ_expand_mazagon_dock:0 "Расширить верфь «Мазагон Док»"
 r56_RAJ_expand_mazagon_dock_desc:0 "Верфь «Мазагон Док» в Мумбаи — главный судостроитель западного побережья. В условиях мирового кризиса её мощности необходимо увеличить."
 r56_RAJ_found_scindia_shipyard:0 "Основать верфь «Сциндия»"
 r56_RAJ_found_scindia_shipyard_desc:0 "Нам нужна верфь на восточном побережье, поэтому создание предприятия «Сциндия» в Вишакхапатнаме станет разумным шагом для будущего флота."
 r56_RAJ_royal_indian_navy:0 "Королевский индийский флот"
 r56_RAJ_royal_indian_navy_desc:0 "Королевский индийский флот необходимо быстро расширить. Новые корабли и тактика должны стать приоритетом."
 r56_RAJ_screening_effort:0 "Развитие сил охранения"
 r56_RAJ_screening_effort_desc:0 "Индия играет важную роль в защите южного пути к Суэцкому каналу. Охранение и сопровождение помогут доставлять припасы и солдат на европейский и африканский театры."
 r56_RAJ_cruiser_effort:0 "Развитие крейсеров"
 r56_RAJ_cruiser_effort_desc:0 "На нынешнем этапе крейсеров будет достаточно для развития морской мощи Индии."
 r56_RAJ_submarine_effort:0 "Развитие подводных лодок"
 r56_RAJ_submarine_effort_desc:0 "Рост японской надводной мощи в Азии заставляет обратить внимание на подводную войну и удары субмарин."
 r56_RAJ_capital_ship_effort:0 "Развитие крупных кораблей"
 r56_RAJ_capital_ship_effort_desc:0 "Будучи британским форпостом, Индия видела, как крупные корабли господствуют на море. Нам следует построить собственные тяжёлые крейсеры и линкоры."
 r56_RAJ_modernizing_navy:0 "Модернизация флота"
 r56_RAJ_modernizing_navy_desc:0 "Более совершенные двигатели, больше места для экипажа, высокая скорость и крупные орудия позволят индийскому флоту сравниться с лучшими в Азии."
 RAJ_naval_equipment:0 "Пересмотреть корабельное оборудование"
 RAJ_naval_equipment_desc:0 "Различные системы на борту наших кораблей можно и нужно модернизировать."
 r56_RAJ_military_technologies:0 "Военные технологии"
 r56_RAJ_military_technologies_desc:0 "Мы должны использовать результаты модернизации и вкладываться в новые технологии."
 r56_RAJ_aviation_effort:0 "ВВС Свободной Индии"
 r56_RAJ_aviation_effort_desc:0 "Мы должны освободить не только землю, но и небо!"
 r56_RAJ_fighter_focus:0 "Развивать истребители"
 r56_RAJ_fighter_focus_desc:0 "Манёвренность и скорость необходимы для господства в воздухе."
 r56_RAJ_bomber_focus:0 "Развивать бомбардировщики"
 r56_RAJ_bomber_focus_desc:0 "Ударная мощь и дальность — лучший способ уничтожить врагов."
 r56_RAJ_torpedo_bombers:0 "Морская ударная авиация"
 r56_RAJ_torpedo_bombers_desc:0 "Способность самолётов атаковать корабли торпедами жизненно важна для нейтрализации британского флота."
 r56_RAJ_aviation_effort_2:0 "Передовая воздушная тактика"
 r56_RAJ_aviation_effort_2_desc:0 "Необходимо разработать новую тактику воздушного боя, чтобы повысить эффективность каждого самолёта и сократить потери пилотов."
 r56_RAJ_rocket_effort:0 "Реактивные двигатели"
 r56_RAJ_rocket_effort_desc:0 "Реактивные двигатели — будущее авиации!"
 r56_RAJ_revolt_against_the_oppressors_showcase:0 "Восстание против угнетателей"
 r56_RAJ_revolt_against_the_oppressors_showcase_desc:0 "Нам было отказано в нашем законном наследии и месте под горящим Солнцем слишком долго. Время пришло. За оружие, братья и сестры! За оружие, рабочих и фермеров! Каждый человек в каждой деревне, городе или поселке должен сражаться против колонизаторов."
 RAJ_ignore_and_then_support_hazad_hind_to_trigger_the_civil_war:0 "Чтобы открыть этот путь, проигнорируйте угрозу движения «Азад Хинд» и используйте решения для усиления его присутствия."
 r56_indian_revolt_focus:0 "Дерево фокусов восстания «Азад Хинд»"
 r56_india_generic:0 "Стандартное дерево фокусов Индии"
 india.500.t:0 "Интеграция Индии"
 india.500.desc:0 "Британцы управляли Индийским субконтинентом не в одиночку. Значительная часть земель до сих пор принадлежит старым династиям, для которых личное богатство важнее благополучия народа. Поэтому их интеграция без компромиссов или кровопролития будет трудной. Мы должны добиться полного включения этих владений в Индию ради нашего народа."
 india.500.a:0 "Вперёд."
 india.501.t:0 "Самые слабые князья с этим согласны."
 india.501.desc:0 "Многие князья, правившие лишь небольшими владениями, сразу согласились передать земли Индии. Большинство советников и ожидало, что монархи нескольких квадратных миль не захотят противостоять индийским вооружённым силам, хотя полной уверенности не было."
 india.501.a:0 "Разумеется."
 india.4270.t:0 "Асаф Джах отказывается от интеграции в Индию"
 india.4270.desc:0 "Асаф Джах VII категорически отказался войти в состав нового индийского государства. Мусульманская династия низамов правит преимущественно индуистским населением и использует религию как главный аргумент против интеграции."
 india.4270.a:0 "Остаток уходящего мира."
 india.4271.t:0 "Хайдарабад интегрируется в Индию"
 india.4271.desc:0 "Сегодня утром Асаф Джах VII согласился подписать акт о присоединении и тем самым войти в состав Индии."
 india.4271.a:0 "Победа Индии."
 india.4410.t:0 "Джамму и Кашмир отказываются интегрироваться в Индию"
 india.4410.desc:0 "Сообщается, что Хари Сингх публично заявил об отказе от интеграции в Индию при нынешних обстоятельствах."
 india.4410.a:0 "Со временем он за это заплатит."
 india.4411.t:0 "Джамму и Кашмир добровольно входят в состав Индии"
 india.4411.desc:0 "Прошлым вечером во дворце Хари Сингх наконец подписал акт о присоединении и согласился передать Джамму и Кашмир новому правительству Индии."
 india.4411.a:0 "Северная граница защищена."
 india.4250.t:0 "Майсур отказывается вступать в Индийский союз"
 india.4250.desc:0 "Двадцать пятый махараджа Майсура дольше многих размышлял о судьбе королевства, но в итоге принял неразумное решение отказаться от интеграции в Индию."
 india.4250.a:0 "Он слишком важен, чтобы отпустить."
 india.4251.t:0 "Королевство Майсур присоединяется к Индии"
 india.4251.desc:0 "Двадцать пятый махараджа Майсура дольше многих размышлял о судьбе королевства, но в конце концов понял, что его будущее связано с Индией."
 india.4251.a:0 "Важнейшая часть Индии!"
 india.10130.t:0 "Королевство Сикким движется к независимости"
 india.10130.desc:0 "11-й Чогьял Сиккима, наконец, ответил на наши требования и проявил себя нерешительным."
 india.10130.a:0 "Кому они нужны?"
 india.10131.t:0 "Королевство Сикким присоединяется к Индии"
 india.10131.desc:0 "Одиннадцатый чогьял Сиккима согласился на интеграцию, и его владение готовится стать штатом Индийского Союза."
 india.10131.a:0 "Важнейшая часть Индии!"
 india.4273.t:0 "Государство [SKK.GetNameDefCap] отказывается присоединиться к Индии"
 india.4440.t:0 "Белуджистан показал себя устойчивым"
 india.4440.desc:0 "Сегодня хан Калата принял опрометчивое решение сохранить свои окраинные владения отдельно от индийского народа."
 india.4440.a:0 "Мы должны обезопасить запад."
 india.4441.t:0 "Белуджистан присоединился к Индии"
 india.4441.desc:0 "Сегодня хан Калата принял взвешенное и разумное решение о вступлении себя и своих земель в Индийский Союз."
 india.4441.a:0 "Западная граница защищена."
 india.4370.t:0 "Гвалиор отвергает объединение"
 india.4370.desc:0 "Дживаджирао Синдия из Гвалиора отверг любые предложения об интеграции в Индию. Это серьёзно дестабилизировало его владение, поскольку большинство жителей желает объединения."
 india.4370.a:0 "Однажды мы их освободим."
 india.4371.t:0 "Гвалиор приветствует объединение"
 india.4371.desc:0 "Дживаджирао Синдия долго размышлял о будущем своём и Гвалиора и благодаря нашим доброжелательным уступкам решил войти в состав Индии."
 india.4371.a:0 "Славный день."
 india.4330.t:0 "Джайпур отвергает интеграцию"
 india.4330.desc:0 "Семнадцатый махараджа Джайпура Ман Сингх II, к сожалению, решил сохранить полный контроль над государством, несмотря на уличные протесты против этого эгоистичного решения."
 india.4330.a:0 "Какой позор."
 india.4331.t:0 "Государство Джайпур принимает интеграцию"
 india.4331.desc:0 "Семнадцатый махараджа Джайпура, человек образованный, услышал националистические призывы к единой Индии и признал своим нравственным долгом присоединиться к ней."
 india.4331.a:0 "По-настоящему разумный шаг."
 india.4280.t:0 "Лимбди отказывается от присоединения"
 india.4280.desc:0 "Даулатсинхджи Джашвантсинхджи из Лимбди — традиционный представитель династии Джхала, убеждённый консерватор, чьи владения состоят преимущественно из сельских общин. Неудивительно, что он придерживался старомодных взглядов и отказался от объединения."
 india.4280.a:0 "Печальная реальность."
 india.4281.t:0 "Лимбдийское государство признало аннексию"
 india.4281.desc:0 "В то время как принц Лимбди может быть сторонником жесткого традиционализма, он осознал геополитические последствия ошибочного решения и подписал документ о присоединении, тем самым спасая свой народ."
 india.4281.a:0 "Мудрое решение."
