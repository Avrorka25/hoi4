 danish_elections.1.t:0 "Муниципальные выборы 1937/38 годов — Зеландия"
 danish_elections.1.d:0 "Хотя выборы в Фолькетинг продемонстрировали сильную поддержку социал-демократов, особенно тяжело им пришлось в Зеландии, где, похоже, преимущество сохраняют консерваторы. Чтобы завоевать этот оплот, потребуются значительные политические усилия."
 danish_elections.1.a:0 "Социал-демократическая партия победила!"
 danish_elections.1.b:0 "Консервативная партия победила!"
 danish_elections.2.t:0 "Муниципальные выборы 1937/38 годов — Северная Ютландия"
 danish_elections.2.d:0 "Социал-демократы обязаны жителям Северной Ютландии своими прошлыми победами на выборах, поскольку этот регион считается их оплотом. Победа консерваторов стала бы настоящей сенсацией."
 danish_elections.2.a:0 "Коммунистическая партия победила!"
 danish_elections.3.t:0 "Муниципальные выборы 1937/38 годов — Южная Ютландия"
 danish_elections.3.d:0 "В датской Южной Ютландии громко заявляет о себе немецкое меньшинство, проживающее в Северном Шлезвиге. Его политическим представителем является Шлезвигская партия, имеющая национал-социалистические оттенки и неясные связи с германской НСДАП, из-за чего датское большинство считает её опасной. Разумеется, датское сопротивление окажется незначительным по сравнению с немецким недовольством."
 danish_elections.3.b:0 "Шлезвигская партия победила!"
 denmark.1.t:0 "Политическое насилие в [DEN.GetNameDef]"
 denmark.1.d:0 "Сейчас два политических движения готовятся к насильственному противостоянию: Коммунистическая партия Дании и Национал-социалистическая рабочая партия Дании, каждая из которых стремится укрепить свои позиции. Правительство при помощи полиции постарается сдержать насилие, но достаточно ли этого — ещё предстоит выяснить."
 denmark.1.a:0 "Пахнет Кровавым воскресеньем."
 denmark.7.t:0 "[DEN.GetNameDefCap] поддерживает связь с КПГ"
 denmark.7.d:0 "Из гестапо поступили новости. Раскрыт заговор недавно созданного датского большевистского правительства, намеренного реорганизовать и вооружить почти уничтоженную КПГ против власти [GER.GetRulingParty]. После долгих допросов захваченный партизан раскрыл план. В случае [GER.GetAdjective] вторжения в Ютландию датчане должны будут подтолкнуть КПГ к гражданской войне. Подготовка такого масштабного предприятия займёт недели, если не месяцы, поэтому падение датского правительства раньше срока лишит мятежников возможности нанести удар."
 denmark.7.a:0 "Крайне тревожно."
 denmark.8.t:0 "Диверсия КПГ в [?DEN.den_ger_current_sabotage_state.GetName]"
 denmark.8.d:0 "При поддержке [DEN.GetNameDefCap] партизаны КПГ проникли в [?DEN.den_ger_current_sabotage_state.GetName] и совершили диверсию. В конце концов они заплатят за свои преступления."
 denmark.8.a:0 "За это последует возмездие."
 denmark.9.t:0 "КПГ готовится к гражданской войне"
 denmark.9.d:0 "[DEN.GetNameDefCap] привело в действие резервный план по разжиганию гражданской войны в [GER.GetNameDef]. Если их правительство не будет уничтожено в ближайшие недели, нас ожидает крупномасштабное восстание в собственном тылу."
 denmark.9.a:0 "Это имеет высший приоритет."
 denmark.100.t:0 "[DEN.GetNameDefCap] отменяет Копенгагенскую конвенцию"
 denmark.100.d:0 "\n\nС момента заключения Копенгагенской конвенции 1857 года Датские проливы являлись международным водным путём, свободным для всех судов независимо от происхождения и назначения. При дипломатической поддержке [?DEN.copenhagen_backer.GetLeader] из [?DEN.copenhagen_backer.GetNameDef] [DEN.GetLeader] отказался от договора и заставил проходящие торговые суда платить пошлины датскому правительству. Великие державы Европы потрясены и возмущены: теперь Дания держит ключи от Балтики."
 denmark.100.a:0 "Господство над Балтийским морем!"
 denmark.100.b:0 "Безрассудное пренебрежение международным правом."
 denmark.100.c:0 "Событие, едва заслуживающее освещения."
 denmark.99.t:0 "Освобождение Дании"
 denmark.99.d:0 "После долгих лет [?DEN.occupation_target.GetAdjective] оккупации Дания была освобождена под ликование тысяч людей. Многонациональные силы, вступившие в страну и отбросившие войска [?DEN.occupation_target.GetNameDef], встречают как героев, а их флаги развеваются повсюду. Датское правительство также вернулось из изгнания, решив завершить войну как можно скорее."
 denmark.99.a:0 "Временная неудача."
 denmark.99.b:0 "Дания наконец свободна."
 christian_denmark.0.t:0 "Королевский переворот в Дании"
 christian_denmark.0.d:0 "Когда нарастающая волна фашизма и коммунизма захлестнула Данию, демократическое правительство оказалось неспособно справиться с экстремизмом. На улицах регулярно происходили столкновения полиции с коммунистами и фашистами. Опасаясь скорого прихода фашистов к власти, король Кристиан X воспользовался ситуацией, распустил правительство и, по крайней мере пока, сосредоточил в своих руках абсолютную власть. Согласно публичным заявлениям, он намерен жёстко подавить любой экстремизм. Исландское правительство пока отказалось от комментариев."
 christian_denmark.0.a:0 "Очередной провал демократии."
 christian_denmark.0.b:0 "Возвращение в Средневековье."
 christian_denmark.0.c:0 "Похоже, датский лев вновь поднимается."
 christian_denmark.0.e:0 "Есть прекрасная страна!"
 christian_denmark.1.t:0 "Антимонархическая оппозиция усиливается"
 christian_denmark.1.d:0 "После недавнего прихода к власти Его Величества короля Кристиана X возникло множество групп сопротивления. Фашисты, коммунисты и демократы — все они желают разрушить Данию и продать её европейским державам. Необходимо своевременно уничтожить эти группы, прежде чем они ещё сильнее разорвут ткань датского общества."
 christian_denmark.1.a:0 "Дания будет славной!"
 christian_denmark.10.t:0 "Первая встреча"
 christian_denmark.10.d:0 "Король Кристиан встретился с руководством консерваторов в их штаб-квартире. Ко всеобщему удивлению, он предложил распустить нынешнее правительство из-за неспособности справиться с радикальными движениями, распространяющимися в [DEN.GetNameDef]. Хотя такой шаг показался крайним, Кристмас Мёллер пообещал поддержку Консервативной партии роспуску правительства ради сохранения [DEN.GetNameDef]."
 christian_denmark.10.a:0 "Приятная встреча."
 christian_denmark.10.b:0 "Всё это кажется несколько чрезмерным."
 christian_denmark.11.t:0 "Укрепление поддержки"
 christian_denmark.11.d:0 "Кристиан как главнокомандующий вызвал высшее командование и командира Зеландской дивизии в королевский дворец, чтобы заручиться поддержкой армии на случай насильственной реакции КПД и ДНСАП. Они неохотно дали заверения и были отпущены."
 christian_denmark.11.a:0 "Будем надеяться, что они не понадобятся."
 christian_denmark.11.b:0 "Возможно, это чрезмерная реакция."
 christian_denmark.12.t:0 "Господин Торвальд, вы уволены"
 christian_denmark.12.d:0 "Я не смогу достойно написать это событие."
 christian_denmark.12.a:0 "Теперь продолжим с того места, где он остановился."
 christian_denmark.13.t:0 "Тишина в Атлантическом океане"
 christian_denmark.13.d:0 "Его Величество представил вторжение в Исландию как незначительное подавление восстания, но спустя несколько месяцев на острове всё ещё нет войск, а война продолжается. Многие требуют положить конец этой бессмысленной фиктивной войне."
 christian_denmark.13.a:0 "Операция была плохо рассчитана."
 christian_denmark.13.b:0 "До их капитуляции остались считаные недели."
 christian_denmark.2.t:0 "Смуты в Копенгагене"
 christian_denmark.2.d:0 "Глава личной унии Дании и Исландии сосредоточил абсолютную власть в Копенгагене и теперь требует от Рейкьявика заверений, что последствия датско-исландского Акта об унии 1918 года не будут изменены из-за недавней политической нестабильности в [DEN.GetNameDef]. Однако нынешняя риторика тревожно указывает, что наш суверен намерен править Исландией и подчинить её так же, как Данию. Перед нами два варианта."
 christian_denmark.2.a:0 "Провозгласить Республику Исландия!"
 christian_denmark.2.b:0 "Акт об унии по-прежнему действует."
 christian_denmark.3.t:0 "Провозглашение Республики Исландия"
 christian_denmark.3.d:0 "Премьер-министр Исландии [ICE.GetLeader], узнав о политической смуте в Копенгагене, провозгласил президентскую республику. Это явное нарушение датско-исландского Акта об унии 1918 года, и король пока не исключает военного вмешательства. Посмотрим, как будут развиваться события."
 christian_denmark.3.a:0 "Смелый, но глупый шаг."
 christian_denmark.3.b:0 "Однажды они столкнутся с нашим гневом."
 christian_denmark.4.t:0 "Исландия демонстрирует покорность"
 christian_denmark.4.d:0 "Теперь уже бывший премьер-министр Исландии вчера выступил перед Альтингом и призвал парламент разорвать все связи с [DEN.GetNameDef], провозгласить нелегитимную республику и, разумеется, поставить его во главе. Однако законодательный орган проявил благоразумие и отверг откровенно предательское предложение. Теперь следует задуматься о будущем унии."
 christian_denmark.4.a:0 "К дальнейшему датско-исландскому сотрудничеству."
 christian_denmark.5.t:0 "Семейное дело"
 christian_denmark.5.d:0 "Роспуск Дании-Норвегии в XIX веке стал настоящей трагедией. Норвежские земли нашего королевства были отторгнуты вероломными шведами после Наполеоновских войн, и с тех пор наши народы шли разными путями. К счастью, в 1905 году шведско-норвежская уния распалась, а брат Его Величества короля Кристиана X, датский принц Карл, был избран на норвежский престол. Теперь, когда королевская власть восстановлена в Дании, мы можем помочь Норвегии освободиться от парламентаризма."
 christian_denmark.5.a:0 "Привет из Копенгагена"
 christian_denmark.6.t:0 "Семейное дело"
 christian_denmark.6.d:0 "Недавнее установление абсолютной власти Кристиана X в [DEN.GetNameDef] вдохновило некоторых норвежских монархистов потребовать такой же перемены государственного строя. Кристиан X выдвинул схожую идею, предложив восстановить датско-норвежскую унию."
 christian_denmark.6.a:0 "Кристиан пользуется поддержкой короля."
 christian_denmark.6.b:0 "Времена абсолютизма прошли."
 christian_denmark.7.t:0 "Королевский переворот"
 christian_denmark.7.d:0 "Роспуск Дании-Норвегии шведами на востоке некоторые считают трагедией; среди них — брат Его Величества, Кристиан X Датский. Король получил от него заманчивое предложение. Его Величеству следует потребовать от [NOR.GetAdjective] гражданского правительства заслуженных абсолютных прав. Если начнётся гражданская война, датская королевская армия также поддержит монархию. Разумеется, эта помощь будет иметь цену, которой, как полагают некоторые, станет независимость [NOR.GetNameDef]."
 christian_denmark.7.a:0 "Король выступает против правительства."
 christian_iceland_annexation_tt:0 "§RЭто может привести к последующей аннексии Исландии Королевством Дания.§!"
 christian_iceland_war_tt:0 "§RЭто может привести к войне с Королевством Дания.§!"
 den_brothers_torn_apart_tt:0 "Если Хокон VII согласится сотрудничать, он возглавит королевский переворот; в противном случае мы получим цель войны против §Y[NOR.GetNameDef]§!."
 den_haakon_cooperation_tt:0 "Связи с §Yкоролём Норвегии§! могут пригодиться в будущем."
 den_integrated_norway:0 "§YНорвегия§! интегрирована решением"
 den_christian_cancel_coup_tt:0 "§YКоролевский переворот§! будет отменён."
 denmark.101.t:0 "Судьба Дании"
 denmark.101.d:0 "Датское правительство капитулировало, но, в отличие от других, похоже, готово сотрудничать с нами. Возможно, марионеточное правительство, сражающееся на нашей стороне во всех будущих конфликтах, предпочтительнее суровой и дорогостоящей оккупации."
 denmark.101.a:0 "Отправить ультиматум."
 denmark.101.b:0 "Наши войска сами справятся."
 denmark.102.t:0 "Судьба Дании"
 denmark.102.d:0 "После капитуляции под натиском неумолимого иностранного наступления [DEN.GetNameDef] стоит перед выбором: оказаться под чужой оккупацией или сотрудничать с захватчиками. Хорошего ответа нет, но [DEN.GetLeader] вскоре придётся его дать."
 denmark.102.a:0 "Сотрудничество стало бы предательством всех датчан."
 denmark.102.b:0 "Благо нации превыше всего."
 denmark.103.t:0 "Операция «Везерюбунг»"
 denmark.103.d:0 "[GER.GetNameDefCap], участвующее во Второй мировой войне в Европе, испытывает всё большие трудности с импортом [SWE.GetAdjective] железа и стали из-за [ENG.GetAdjective] атак на конвои. В ответ [GER.GetAdjective] правительство начало операцию «Везерюбунг», призванную обеспечить поставки стали. Из-за наших «дружественных» отношений нам предъявили ультиматум: либо мы пропускаем [GER.GetAdjective] войска через датскую территорию и разрешаем использовать наши порты, либо подвергаемся вторжению. Как ответить?"
 denmark.103.a:0 "Границы Дании должны соблюдаться."
 denmark.103.b:0 "Принять ультиматум."
 denmark.57.t:0 "Фашисты идут на Фолькетинг"
 denmark.57.d:0 "Наша политика провалилась, датский народ разгневан, и все последствия этого теперь стоят перед зданием парламента. Вооружённые до зубов и не встречающие сопротивления, поскольку полиция практически уничтожена постоянными уличными боями, они требуют отставки правительства [DEN.GetLeader]. Не имея иного выхода, правительство уходит и уступает безликой толпе."
 denmark.57.a:0 "Данию ждут мрачные времена."
 denmark.58.t:0 "Коммунисты идут на Фолькетинг"
 denmark.58.d:0 "Наша политика провалилась, датский народ разгневан, и все последствия этого теперь стоят перед зданием парламента. Кроме того, всеобщая забастовка парализовала экономику, и правительство, не имея другого выхода, уходит в отставку, уступая народным массам."
 denmark.58.a:0 "Данию ждут мрачные времена."
 denmark.59.t:0 "Лидерство Акселя Ларсена поставлено под сомнение"
 denmark.59.d:0 "Недавний отход от прежней политики в отношении Коминтерна и Советской России заставил многих членов партии усомниться в положении генерального секретаря Акселя Ларсена, который до революции был известен как убеждённый сторонник Москвы. Сегодня утром Верховный совет КПД проголосовал за его отстранение, и..."
 denmark.59.a:0 "...предложение отклонено с минимальным перевесом."
 denmark.59.b:0 "...Альфред Йенсен станет генеральным секретарём КПД."
 denmark.3.t:0 "Датские проливы"
 denmark.3.d:0 "Копенгагенская конвенция была позорным ограблением нашего суверенитета, предоставив всем странам право прохода через проливы без пошлины. Настало время вернуть территориальные воды и определить новую политику в отношении иностранных судов."
 denmark.3.a:0 "Добро пожаловать всем нейтральным странам."
 denmark.3.b:0 "Добро пожаловать всем странам, пользующимся расположением правительства."
 denmark.3.c:0 "Добро пожаловать всем идеологически близким странам."
 denmark.3.e:0 "Добро пожаловать всем союзным странам."
 denmark.10.t:0 "Консервативное правительство"
 denmark.10.d:0 "Социал-демократическая партия недавно утратила значительную часть общественной поддержки из-за экономических и внутренних проблем. После падения доверия к правительству король назначил Консервативную партию правящей в [DEN.GetNameDef]. Состав кабинета будет объявлен в ближайшее время."
 denmark.10.a:0 "Будем надеяться, что доверие к демократии удастся восстановить."
 denmark.20.t:0 "Возвращение социал-демократов"
 denmark.20.d:0 "Хотя обещания консерваторов были грандиозными, их воплощение оказалось слабым. Опасаясь дальнейшей радикализации из-за бездействия, король вновь передал власть социал-демократам, получившим относительное большинство."
 denmark.20.a:0 "Не будем повторять прежние ошибки."
 denmark.32.t:0 "Приглашение в Северный совет"
 denmark.32.d:0 "[DEN.GetNameDefCap] объявило о создании большого Северного совета для координации вооружённых сил и правительств северных стран. Следует ли [ROOT.GetNameDef] вступить в этот совет?"
 denmark.32.a:0 "Дальнейшее северное сотрудничество принесёт только пользу."
 denmark.32.b:0 "Никогда не доверяйте этим грязным датчанам."
 denmark.34.t:0 "Провал Северного совета"
 denmark.34.d:0 "После торжественного объявления о создании Северного совета наступила неловкая тишина: ни одно северное правительство не ответило положительно. Для [DEN.GetNameDef] это несомненный международный позор."
 denmark.34.a:0 "Дальнейшее северное сотрудничество принесёт только пользу."
 denmark.35.t:0 "Первое заседание Северного совета"
 denmark.35.d:0 "После в целом положительной реакции на объявление Северного совета состоялось его первое заседание. Организация укрепит позиции северных стран на международной арене."
 denmark.35.a:0 "Великолепно."
 denmark.36.t:0 "Приглашение в Северный таможенный союз"
 denmark.36.d:0 "Чтобы помочь восстановлению после Великой депрессии, датское правительство предложило путь выхода из кризиса для всех скандинавских экономик. [DEN.GetNameDefCap] отменит пошлины и ограничения между участниками, стимулируя экономическое сотрудничество."
 denmark.36.a:0 "Прекрасное соглашение."
 denmark.36.b:0 "[ROOT.GetAdjective] экономика останется [ROOT.GetAdjective]!"
 denmark.37.t:0 "[FROM.GetNameDefCap] соглашается вступить в Северный таможенный союз"
 denmark.37.d:0 "[FROM.GetAdjective] правительство увидело преимущества предложенного таможенного союза и приняло все его условия. Будущее сотрудничество принесёт процветание обеим сторонам."
 denmark.37.a:0 "Великолепно."
 denmark.38.t:0 "[FROM.GetNameDefCap] отказывается вступить в Северный таможенный союз"
 denmark.38.d:0 "[FROM.GetAdjective] правительство, похоже, ослеплено националистическим протекционизмом и отвергло важнейшие условия предложенного союза. Видимо, они намерены идти своим путём."
 denmark.38.a:0 "Трагично."
 denmark.39.t:0 "[DEN.GetNameDefCap] предлагает Североморское соглашение"
 denmark.39.d:0 "Чтобы ускорить восстановление после Великой депрессии, датское правительство предложило торговое соглашение между странами Северного моря. Оно упростит торговлю между нашими народами и поможет экономическому восстановлению."
 denmark.39.a:0 "Прекрасное соглашение."
 denmark.39.b:0 "Датчане думают только о собственной выгоде."
 denmark.42.t:0 "[FROM.GetNameDef] соглашается на Североморское торговое соглашение"
 denmark.42.d:0 "[FROM.GetAdjective] правительство увидело преимущества предложенного торгового соглашения и приняло все его условия. Будущее сотрудничество принесёт процветание обеим сторонам."
 denmark.42.a:0 "Великолепно."
 denmark.43.t:0 "[FROM.GetNameDef] отказывается от Североморского торгового соглашения"
 denmark.43.d:0 "[FROM.GetAdjective] правительство, похоже, ослеплено националистическим протекционизмом и отвергло важнейшие условия предложенного торгового соглашения. Видимо, они намерены идти своим путём."
 denmark.43.a:0 "Трагично."
 denmark.44.t:0 "[DEN.GetNameDefCap] предлагает датско-[SOV.GetAdjective] торговое соглашение"
 denmark.44.d:0 "[DEN.GetNameDefCap] предлагает заключить торговое соглашение, стремясь к экономическому господству в Балтийском море. Разумеется, это буржуазная республика, однако условия соглашения могут оказаться выгодными для нас."
 denmark.44.dc:0 "После Великой депрессии и недавней революции экономика Дании погрузилась в неопределённость. Наши товарищи в [DEN.GetNameDef] предложили способ одновременно стабилизировать датскую экономику и помочь [SOV.GetAdjective] хозяйству. Экономисты не видят причин отказываться."
 denmark.44.a:0 "Подписать соглашение!"
 denmark.44.b:0 "Нет."
 denmark.45.t:0 "[DEN.GetNameDefCap] предлагает пакт Мунка — Риббентропа"
 denmark.45.d:0 "[DEN.GetNameDefCap] направило предложение о переговорах по вопросам ненападения и экономического сотрудничества. Страна контролирует вход в Балтийское море, поэтому её стратегическая ценность под [GER.GetAdjective] оккупацией была бы огромна. Если они хотят соглашения, им придётся принять жёсткие условия."
 denmark.45.a:0 "Отправить наши требования!"
 denmark.45.b:0 "Мы не будем вести переговоры с [DEN.GetNameDef]."
 denmark.46.t:0 "Пакт Мунка — Риббентропа подписан"
 denmark.46.d:0 "[GER.GetAdjective] правительство приняло выгодные для себя условия и подписало гарантию независимости и договор о ненападении. Наши ответные уступки суровы, но необходимы."
 denmark.46.a:0 "Хорошо."
 denmark.47.t:0 "Пакт Мунка — Риббентропа отклонён"
 denmark.47.d:0 "[GER.GetAdjective] правительство отказалось от чрезвычайно выгодных условий. Наши советники не знают, как это понимать."
 denmark.47.a:0 "Вторжение наверняка неизбежно!"
 denmark.48.t:0 "Датско-[SOV.GetAdjective] торговое соглашение принято"
 denmark.48.d:0 "[SOV.GetAdjective] правительство приняло взаимовыгодные условия торгового соглашения, подписало гарантию нашей независимости и договор о ненападении."
 denmark.48.a:0 "К взаимному процветанию!"
 denmark.49.t:0 "Датско-[SOV.GetAdjective] торговое соглашение отклонено"
 denmark.49.d:0 "К нашему разочарованию, [SOV.GetAdjective] сторона отказалась от условий предложенного торгового соглашения."
 denmark.49.a:0 "Трагично."
 denmark.71.t:0 "[DEN.GetNameDefCap] предлагает Скандинавский план"
 denmark.71.d:0 "Датское правительство предложило провести клещевое наступление, чтобы объединить Скандинавию под властью Коминтерна. Риск велик, но союзник на защищённом северном фланге поможет в будущей обороне Союза."
 denmark.71.a:0 "Подготовить войска."
 denmark.71.b:0 "Слишком рискованно."
 denmark.72.t:0 "Отказ Советов"
 denmark.72.d:0 "[SOV.GetLeader] грубо отверг Скандинавский план, назвав его властолюбивой затеей, пренебрегающей жизнями советских и датских солдат."
 denmark.72.a:0 "Возмутительно."
 denmark.40.t:0 "Назревает крестьянское восстание"
 denmark.40.d:0 "Благодаря подавляющему влиянию низших классов фабричные рабочие городов и крестьяне объединились в борьбе за свержение короля и создание «Датской республики». Чтобы королевство выжило, необходимо ограничить их влияние на правительство."
 denmark.40.a:0 "Королевство под угрозой."
 denmark.41.t:0 "Назревает захват власти олигархами"
 denmark.41.d:0 "Промышленники и крупные землевладельцы всё активнее пытаются заменить демократически избранную [DEN.GetRulingParty] олигархической марионеткой. Если не пресечь их попытки, демократические принципы окажутся под угрозой."
 denmark.41.a:0 "Ужасающая мысль."
 denmark.62.t:0 "Горькое прощание короля"
 denmark.62.d:0 "Десятый датский монарх по имени Кристиан знал, что этот день наступит, с тех пор как Социал-демократическая партия одобрила совместную борьбу с фашистами бок о бок с коммунистами. Приведение к присяге нечестивой коалиции коммунистов и социал-демократов могло казаться низшей точкой его жизни. Но теперь его лишают титулов, а королевство, созданное его династией, будет уничтожено."
 denmark.62.a:0 "Конец эпохи."
 den_kpd_contacts:0 "Воспоминания о Германской революции"
 den_kpd_contacts_desc:0 "Для большинства [GER.GetNameDef] кажется страной, давно объединённой под властью жестокого режима, но не все [GER.GetAdjective] граждане довольны им; независимые ячейки сопротивления изо всех сил подрывают [GER.GetRulingParty]. Если восстановить организации довоенного времени и оказать им помощь, возможно, удастся обрушить [GER.GetNameDef].\n\n"
 DEN_KPD_Strength_Desc:0 ""
