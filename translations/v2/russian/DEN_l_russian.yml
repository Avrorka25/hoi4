 DEN_Stage_War_Games:0 "Провести военные игры"
 DEN_Stage_War_Games_desc:0 ""
 DEN_Move_past_the_Krag_Jorgesen:0 "Отказаться от «Крага — Йоргенсена»"
 DEN_Move_past_the_Krag_Jorgesen_desc:0 ""
 DEN_Produce_Domestic_Artillery:0 "Производить отечественную артиллерию"
 DEN_Produce_Domestic_Artillery_desc:0 ""
 DEN_Motorization_of_the_Army:0 "Моторизация армии"
 DEN_Motorization_of_the_Army_desc:0 ""
 DEN_Reassurences_from_Reyklavik:0 "Заверения из Рейкьявика"
 DEN_Reassurences_from_Reyklavik_desc:0 "Кристиан X является королём не только Дании, но и Исландии, которая в последние годы становится всё более республиканской и может не принять его абсолютную власть над [DEN.GetNameDef]."
 DEN_Dissolve_the_Folketing:0 "Распустить Фолькетинг"
 DEN_Dissolve_the_Folketing_desc:0 "С момента создания в XIX веке Фолькетинг превратился в соревнование по выдвижению самых возмутительных популистских предложений ради дополнительных голосов. Король распустит парламент и вернёт [DEN.GetNameDef] былую славу."
 DEN_Crackdown_on_Extremism:0 "Подавить экстремизм"
 DEN_Crackdown_on_Extremism_desc:0 "Гнусные идеологии, вынудившие Кристиана распустить правительство, получили широкую поддержку среди датчан. Священный долг короля — подавить лидеров этих движений и восстановить общую датскую политическую культуру."
 DEN_Consolidate_Iceland:0 "Закрепить контроль над Исландией"
 DEN_Consolidate_Iceland_desc:0 "Теперь, когда Исландия законно подчинилась Его Величеству, мы преобразуем Королевство Исландия в избирательный округ [DEN.GetNameDef]."
 DEN_Crush_the_Rebellion:0 "Подавить восстание"
 DEN_Crush_the_Rebellion_desc:0 "После глупого решения исландского правительства покинуть личную унию с [DEN.GetNameDef] другого выхода, кроме вторжения, похоже, не осталось."
 DEN_Proclaim_the_Danish_Empire:0 "Обратить внимание на Осло"
 DEN_Proclaim_the_Danish_Empire_desc:0 "Хокон VII, король Норвегии и брат Кристиана X, может вдохновиться абсолютной властью из Копенгагена и пожелать того же."
 DEN_Form_a_Cabinet:0 "Сформировать кабинет"
 DEN_Form_a_Cabinet_desc:0 "Теперь, когда неотложные политические проблемы решены, можно сосредоточиться на стабилизации [DEN.GetNameDef]. Первым шагом станет создание правительства и приглашение всех готовых участвовать политических деятелей."
 DEN_Approach_the_British:0 "Обратиться к [ENG.GetAdjective] стороне"
 DEN_Approach_the_British_desc:0 "[ENG.GetAdjective] сторона взяла на себя защиту Европы, и [DEN.GetNameDef] следует стремиться к более тесным отношениям."
 DEN_The_Stockholm_Communique:0 "Стокгольмское коммюнике"
 DEN_The_Stockholm_Communique_desc:0 "Нашими ближайшими союзниками являются королевства Скандинавии, к которым мы и обратимся."
 DEN_North_Sea_Trade_Agreement:0 "Североморское торговое соглашение"
 DEN_North_Sea_Trade_Agreement_desc:0 "Излишки сельскохозяйственной продукции всё труднее находят рынки сбыта. Либерализация торговли между странами Северного моря — Данией, Норвегией и Соединённым Королевством — может предоставить столь необходимые рынки."
 DEN_Nordic_Customs_Union:0 "Северный таможенный союз"
 DEN_Nordic_Customs_Union_desc:0 "Экономическая интеграция северных стран — Дании, Швеции, Норвегии и Финляндии — всегда была выше, чем в большинстве регионов, разделённых политическими границами, но мы пойдём ещё дальше. Оставшиеся пошлины и торговые ограничения между братскими народами будут устранены."
 DEN_Baltic_Trade:0 "Балтийская торговля"
 DEN_Baltic_Trade_desc:0 "Торговая политика в отношении соседей определена, и теперь мы готовы ещё активнее участвовать в торговых путях Балтийского моря."
 DEN_Approach_Germany:0 "Сблизиться с Германией"
 DEN_Approach_Germany_desc:0 "[GER.GetNameDefCap] вновь стало могущественной державой, и более тесные отношения кажутся необходимыми."
 DEN_Munch_Ribbentrop_Pakt:0 "Пакт Мунка — Риббентропа"
 DEN_Munch_Ribbentrop_Pakt_desc:0 "Дании приходится признать, что [GER.GetNameDef] является главной угрозой её существованию, а более лёгкой альтернативой стремительной милитаризации может стать сотрудничество. Германские требования будут суровы, но, возможно, оправданны, если позволят сохранить датское национальное государство."
 DEN_Approach_the_Soviets:0 "Обратиться к [SOV.GetAdjective] стороне"
 DEN_Approach_the_Soviets_desc:0 "Медведь на востоке, похоже, терпеливо ждёт возможности противостоять подъёму фашизма. Следует обратиться к нему и добиться сочувствия к нашему положению."
 DEN_Dano_Soviet_Trade_Agreement:0 "Датско-[SOV.GetAdjective] торговое соглашение"
 DEN_Dano_Soviet_Trade_Agreement_desc:0 "Безжалостная и продолжающаяся милитаризация [GER.GetNameDef] пугает датских политиков и граждан. Некоторые считают, что единственный способ противостоять угрозе у границы — сблизиться с крупнейшим континентальным противником Германии, [SOV.GetNameDef]. Масштабное торговое соглашение может побудить [SOV.GetAdjective] сторону гарантировать нашу независимость."
 DEN_Revoke_the_Copenhagen_Convention:0 "Отменить Копенгагенскую конвенцию"
 DEN_Revoke_the_Copenhagen_Convention_desc:0 "Копенгагенская конвенция трагически лишила Данию права взимать пошлины с торговых судов, проходящих через её воды. Мы отменим этот навязанный договор и восстановим суверенитет над нашими морями."
 DEN_Unify_the_Socialist_Movement:0 "Объединить социалистическое движение"
 DEN_Unify_the_Socialist_Movement_desc:0 "Как и в большинстве стран, множество социалистических движений соперничают за влияние и действуют друг против друга. Мы объединим всех, кто стремится добиться справедливости для пролетариата, чтобы у них появился реальный шанс на успех."
 DEN_Contacts_to_the_KPD:0 "Установить связи с КПГ"
 DEN_Contacts_to_the_KPD_desc:0 "После захвата рейхсканцелярии НСДАП в 1933 году КПГ была почти полностью разгромлена. Тем не менее мы свяжемся с её подпольными сетями и выясним, чем [DEN.GetNameDef] может помочь."
 DEN_Danish_Folksradrepublik:0 "Создать Народно-советскую республику"
 DEN_Danish_Folksradrepublik_desc:0 "Настало время оставить старый датский флаг и политическую систему в прошлом. Мы перестроим страну в соответствии с принципами Ленина. Первым шагом станет роспуск Фолькетинга и замена его центральным комитетом, назначаемым партией."
 DEN_The_Hammer_and_the_Sickle:0 "Серп и молот"
 DEN_The_Hammer_and_the_Sickle_desc:0 "Классовая война завершена, и пролетариат одержал победу. Но он не может управлять [DEN.GetNameDef] в одиночку: жизненно важная задача кормить население лежит на крестьянах. Мы заключим с ними классовый союз и вместе двинемся в будущее с серпом и молотом в руках."
 DEN_Break_the_Fasces:0 "Сломать фасции"
 DEN_Break_the_Fasces_desc:0 "Теперь, когда государственные инструменты находятся в руках коммунистического движения, мы используем их, чтобы разгромить фашистов и, возможно, вернуть мир в [DEN.GetNameDef]."
 DEN_Propaganda_Campaigns:0 "Пропагандистские кампании"
 DEN_Propaganda_Campaigns_desc:0 "Партия сосредоточится на распространении листовок, развешивании плакатов и проведении ярких выступлений, чтобы побудить датское население к действию."
 DEN_Nationalization_of_Key_Industries:0 "Национализировать ключевые отрасли"
 DEN_Nationalization_of_Key_Industries_desc:0 "В рамках первых экономических реформ мы возьмём под контроль жизненно важные отрасли экономики [DEN.GetNameDef], включая оружейные заводы, металлургию и судоходные компании."
 DEN_Introduce_Land_Reform:0 "Провести земельную реформу"
 DEN_Introduce_Land_Reform_desc:0 "Крупные землевладельцы и богатые капиталисты контролируют большую часть сельского хозяйства. После падения буржуазного правительства мы постепенно раздробим эти частные владения."
 DEN_Soviet_Military_Aid:0 "Советская военная помощь"
 DEN_Soviet_Military_Aid_desc:0 "Советская Красная армия — грозная сила, опирающаяся на впечатляющую оружейную промышленность. С [SOV.GetAdjective] помощью мы постараемся добиться того же и навсегда защитить революцию!"
 DEN_Soviet_Economic_Aid:0 "Советская экономическая помощь"
 DEN_Soviet_Economic_Aid_desc:0 "[SOV.GetAdjective] экономика является второй по величине в мире, и благодаря огромным объёмам производства их помощь значительно укрепит промышленность [DEN.GetNameDef]."
 DEN_Encourage_Collective_Bargaining:0 "Поощрять коллективные переговоры"
 DEN_Encourage_Collective_Bargaining_desc:0 "В противовес крупному бизнесу мы ещё сильнее укрепим профсоюзы законодательством, расширяющим возможности рабочих на переговорах."
 DEN_Invite_Select_Communist_Ministers:0 "Пригласить избранных министров-коммунистов"
 DEN_Invite_Select_Communist_Ministers_desc:0 "Хотя цели коммунистов неприемлемы и безответственны, включение некоторых из них в правительство повысит нашу поддержку среди низших слоёв. К тому же среди них есть талантливые люди."
 DEN_Align_the_Unions:0 "Подчинить профсоюзы"
 DEN_Align_the_Unions_desc:0 "Хотя большинство профсоюзов поддерживает курс правительства, во многих отраслях сохраняются консервативные и реакционные течения. Мы обеспечим единство направления рабочего движения."
 DEN_Encourage_Artisan_Production:0 "Поощрять ремесленное производство"
 DEN_Encourage_Artisan_Production_desc:0 "Принудительная централизация экономики вокруг нескольких одобренных государством предприятий может математически дать максимальный объём производства, но отдельный квалифицированный мастер, продающий товар по справедливой цене, будет гораздо меньше отчуждён от своего труда, чем фабричный рабочий."
 DEN_Forced_Heavy_Industrialization:0 "Принудительная тяжёлая индустриализация"
 DEN_Forced_Heavy_Industrialization_desc:0 "Мы сосредоточимся на централизации промышленной экономики, чтобы максимально повысить эффективность производства товаров, необходимых для процветания пролетариата."
 DEN_Alliegence_to_Moscow:0 "Верность Москве"
 DEN_Alliegence_to_Moscow_desc:0 "Россия, родина революции, создала невероятный прецедент первой марксистской революции и продолжает отстаивать её принципы. Союз наших стран понесёт факел пролетариата дальше в Европу."
 DEN_Icelandic_path_to_Socialism:0 "Исландский путь к социализму"
 DEN_Icelandic_path_to_Socialism_desc:0 "[ICE.GetNameDefCap] всегда поддерживало тесные связи с Данией благодаря различным королевским договорам. Этот дух сохраняется и после упразднения монархии, и мы постараемся вновь сблизиться с исландским народом."
 DEN_Scandinavian_Plan:0 "Скандинавский план"
 DEN_Scandinavian_Plan_desc:0 "Коммунисты Финляндии, Норвегии, Швеции и, разумеется, Дании давно мечтают о панскандинавском союзе по итальянскому или германскому образцу, но основанном на пролетарских принципах. К сожалению, без войны эту мечту не осуществить, однако при поддержке разделяющих наши взгляды скандинавских пролетариев она, будем надеяться, окажется короткой и бескровной."
 DEN_Defy_Russia:0 "Бросить вызов России"
 DEN_Defy_Russia_desc:0 "ДКП всегда была расколота по вопросу развития русской революции. Ларсен, конечно, всегда был сторонником Ленина, Сталина и всего остального их руководства, но ЦК, похоже, выступает за путь независимости от России. [SOV.GetNameDef]."
 DEN_Pan_Scandinavianism:0 "Панскандинавизм"
 DEN_Pan_Scandinavianism_desc:0 "Возрождение мечты о единой скандинавской нации, объединённой пролетарским духом, станет целью всех официальных каналов при подготовке более конкретных планов."
 DEN_International_Volunteers:0 "Интернациональные добровольцы"
 DEN_International_Volunteers_desc:0 "Из-за нашей удалённости от России многие анти-ленинские социалисты мира сочли наше правительство приемлемым и поклялись защищать независимую революцию."
 DEN_International_Theorists:0 "Интернациональные теоретики"
 DEN_International_Theorists_desc:0 "Коммунисты по всему миру, даже в так называемом «Союзе Советских Социалистических Республик», подвергаются преследованиям и лишены права выражать свои взгляды. Мы предоставим им убежище для дальнейшей разработки теорий и, возможно, пригласим помочь нашей революции."
 DEN_Overthrow_the_Faux_Revolution:0 "Положить конец фарсу"
 DEN_Overthrow_the_Faux_Revolution_desc:0 "После смерти Ленина стало всё яснее, что в результате Русской революции было создано ложное пролетарское государство, и теперь это очевидно всем за пределами КПСС. Наш долг — свергнуть эту фальшивую власть и показать советскому народу настоящую социалистическую свободу."
 DEN_Collectivization_of_Agriculture:0 "Коллективизация сельского хозяйства"
 DEN_Collectivization_of_Agriculture_desc:0 "Эксплуатация мелких крестьян крупными землевладельцами, владеющими всей землёй, является особенно жестокой формой угнетения, которой не должно быть места в социалистическом обществе."
 DEN_Invite_Gosplan_Planners:0 "Пригласить специалистов Госплана"
 DEN_Invite_Gosplan_Planners_desc:0 "До сих пор Центральная плановая комиссия создавалась и работала самостоятельно. Приглашение экспертов из [SOV.GetNameDef] значительно поможет повысить эффективность и принести Дании больше процветания."
 DEN_Primacy_of_the_Peasentry:0 "Главенство крестьянства"
 DEN_Primacy_of_the_Peasentry_desc:0 "Мы выполнили обещания классового союза между пролетариатом и крестьянами. Оба класса жизненно важны для общества и имеют равное представительство в правительстве."
 DEN_Rapid_Urbanisation:0 "Стремительная урбанизация"
 DEN_Rapid_Urbanisation_desc:0 "Рост городского пролетариата является необходимым условием процветания Дании и должен поощряться государством."
 DEN_Study_the_NEP:0 "Изучить новую экономическую политику"
 DEN_Study_the_NEP_desc:0 "Хотя новая экономическая политика Ленина не была идеальной и оставляла некоторые случаи эксплуатации без ответа, она кажется наиболее здоровым путём развития экономики. В отличие от Советского Союза, её полное использование может создать более сбалансированную и размеренную индустриализацию."
 DEN_Maintain_Rural_Relations:0 "Сохранить отношения с деревней"
 DEN_Maintain_Rural_Relations_desc:0 "Хотя нынешняя сельскохозяйственная система содержит элементы эксплуатации, коллективизация или иное полное разрушение порядка лишь снизит производство и ухудшит положение крестьян. Поэтому мы неохотно будем сотрудничать с крупными землевладельцами, чтобы кормить городской пролетариат."
 DEN_Puncture_the_Heart_of_Fascism:0 "Пронзить сердце фашизма"
 DEN_Puncture_the_Heart_of_Fascism_desc:0 "Фашизм. Какая от него польза?"
 DEN_Cut_off_the_Lions_Head:0 "Отрубить льву голову"
 DEN_Cut_off_the_Lions_Head_desc:0 "Крупнейшей империей на протяжении бог знает скольких лет была Британская империя, властвовавшая от Америки до Африки и Азии. Мы ударим в самое её сердце — Британские острова — и вместе с ними сокрушим империю."
 DEN_Control_the_Banking_Institutions:0 "Контролировать банковские учреждения"
 DEN_Control_the_Banking_Institutions_desc:0 "Банки необходимы для экономического развития Дании. Столь большая ответственность в руках немногочисленных частных компаний тревожит многих в правительстве. Мы начнём устанавливать государственный контроль над датскими банками."
 DEN_Abolish_the_Monarchy:0 "Упразднить монархию"
 DEN_Abolish_the_Monarchy_desc:0 "Благодаря новой широкой левой коалиции мы наконец оставим разлагающийся труп монархизма в XIX веке, где ему и место. Да здравствует республика!"
 DEN_Encourage_Foreign_Investment:0 "Поощрять иностранные инвестиции"
 DEN_Encourage_Foreign_Investment_desc:0 "Чрезмерные ограничения экономики в основном устранены, и Дания готова принять крупные инвестиции с англо-американских и французских кредитных рынков."
 DEN_Abolish_the_Unions:0 "[DEN_Union_Focus_Localisation] профсоюзы"
 DEN_Abolish_the_Unions_desc:0 "Профсоюзы всегда поощряли лень и низкую производительность, поэтому важно уменьшить их роль в обществе."
 DEN_Productivity_First:0 "Сначала производительность"
 DEN_Productivity_First_desc:0 "Лень, поощряемая профсоюзами, всегда мешала промышленному росту и процветанию в обществах, где профсоюзные лидеры обладали такой же властью, как в Дании. Следует напомнить рабочим, кто платит им зарплату."
 DEN_Crackdown_on_Political_Violence:0 "Защита [DEN_Government_Form]"
 DEN_Crackdown_on_Political_Violence_desc:0 "Нынешняя [DEN_Government_Form] противостоит внешним захватчикам и внутренним саботажникам. Мы не позволим КПД или ДНСАП навредить нашей прекрасной [DEN_Government_Form]."
 DEN_Safehaven_for_the_Scientists:0 "Убежище для учёных"
 DEN_Safehaven_for_the_Scientists_desc:0 "Растущая волна фашизма и сталинизма оставила европейских интеллектуалов без пристанища. Мы с радостью примем их в школах, университетах и исследовательских учреждениях."
 DEN_Tactical_Nationalizations:0 "Тактическая национализация"
 DEN_Tactical_Nationalizations_desc:0 "Недавно расширившаяся коалиция социалистов, разумеется, потребовала некоторых возмутительных мер. Но важнее то, что её политический капитал позволяет проводить ранее немыслимую политику, включая целевую национализацию убыточных или нарушающих закон предприятий."
 DEN_Agrarian_Reform:0 "Аграрная реформа"
 DEN_Agrarian_Reform_desc:0 "Сельскохозяйственный сектор сильно пострадал от Великой депрессии и остро нуждается в реформах. Мы полностью пересмотрим регулирование и постараемся оживить отрасль."
 DEN_Tax_Reform:0 "Налоговая реформа"
 DEN_Tax_Reform_desc:0 "Нынешняя налоговая система, введённая прошлыми социал-демократическими правительствами, сильно мешает бизнесу и состоятельным людям. Мы уменьшим прогрессивность налогов, чтобы укрепить экономику."
 DEN_Public_Investments:0 "Государственные инвестиции"
 DEN_Public_Investments_desc:0 "Целевые государственные вложения значительно поддержат отрасли с обычно низкой прибыльностью, что в итоге укрепит всю экономику."
 DEN_Armed_Neutrality:0 "Вооружённый нейтралитет"
 DEN_Armed_Neutrality_desc:0 "Хотя мы провозгласим односторонний нейтралитет, слова будут подкреплены усиленной милитаризацией и населением, готовым защищать Данию."
 DEN_Scandinavian_Connections:0 "Скандинавские связи"
 DEN_Scandinavian_Connections_desc:0 "Политические, общественные и экономические связи между скандинавскими странами всегда были прочны, но в эти тревожные времена для защиты Скандинавии необходим полноценный оборонительный союз."
 DEN_Look_towards_the_West:0 "Обратиться к Западу"
 DEN_Look_towards_the_West_desc:0 "Западный англо-французский союз поставил целью сдерживание агрессивной [GER.GetName], и участие в его оборонительном союзе поможет ещё сильнее окружить обезумевших германцев."
 DEN_Unified_Defence_Plan:0 "Единый план обороны"
 DEN_Unified_Defence_Plan_desc:0 "Мы скоординируем высшие командования Скандинавского союза и разработаем единый план защиты Скандинавии."
 DEN_Establish_the_Nordic_Council:0 "Создать Северный совет"
 DEN_Establish_the_Nordic_Council_desc:0 "Для дальнейшей политической и экономической интеграции Скандинавии мы создадим совет всех её стран, поощряющий общую политику и схожие меры."
 DEN_Reaffirm_British_Continental_Commitments:0 "Подтвердить [ENG.GetAdjective] обязательства в Европе"
 DEN_Reaffirm_British_Continental_Commitments_desc:0 "Временами кажется, что британское правительство сосредоточено прежде всего на колониальных владениях в Африке и Азии. Мы должны убедиться, что оно выполнит обязательства перед Европой."
 DEN_Reciprocal_Containment:0 "Общее бремя сдерживания"
 DEN_Reciprocal_Containment_desc:0 "Сдерживанием [GER.GetNameDef] главным образом занимались Франция и Англия, но теперь, став частью Союзников, мы также обязаны нести это бремя."
 DEN_Regional_Economic_Development:0 "Региональное экономическое развитие"
 DEN_Regional_Economic_Development_desc:0 "Чтобы укрепить контроль над недавно объединённой Скандинавией, мы направим ресурсы на развитие земель братских народов."
 DEN_Rail_Investments:0 "Инвестиции в железные дороги"
 DEN_Rail_Investments_desc:0 "Датские государственные железные дороги страдали от недостаточного финансирования и общего безразличия правительства. Необходимо изменить отношение и вновь связать страну."
 DEN_Steel_Investments:0 "Инвестиции в сталь"
 DEN_Steel_Investments_desc:0 "Дания бедна ресурсами, поэтому промышленность приходится строить вокруг немногих доступных запасов. Мы соберём остатки железной руды и вложимся в сталелитейные заводы, способные превращать её в прочную сталь."
 DEN_Business_Ties:0 "Деловые связи"
 DEN_Business_Ties_desc:0 "Правительство должно постоянно поддерживать связь с частным сектором, поскольку ограничения, вводимые изолированным Фолькетингом, часто серьёзно мешают предприятиям, создающим рабочие места и обеспечивающим экономический рост."
 DEN_Expand_Maersk_Shipping:0 "Расширить судоходство «Мэрск»"
 DEN_Expand_Maersk_Shipping_desc:0 "«Мэрск», жизненно важная часть отечественной экономики под руководством уважаемого А. П. Мёллера, министра промышленности и мореплавания, должна получить средства и разрешения для значительного расширения деятельности и укрепления датского судоходства. Хотя некоторые сочтут это конфликтом интересов, решение служит общему благу."
 DEN_Deregulate_Banking:0 "Дерегулировать банковскую систему"
 DEN_Deregulate_Banking_desc:0 "Бюрократические ограничения всегда мешали банковскому сектору эффективно инвестировать в общество. Новое консервативное правительство отменит эту практику."
 DEN_Shatter_the_Hammer:0 "Разбить молот"
 DEN_Shatter_the_Hammer_desc:0 "Волна большевизма остановлена здесь, в Дании, и необходимо предпринять все меры для дальнейшего разгрома КПД."
 DEN_Consolidate_Media_Institutions:0 "Консолидировать средства массовой информации"
 DEN_Consolidate_Media_Institutions_desc:0 "Мы вырвем средства массовой информации из рук слабых демократических владельцев и передадим их партийным пропагандистам."
 DEN_Invite_German_Advisors:0 "Пригласить германских советников"
 DEN_Invite_German_Advisors_desc:0 "[GER.GetAdjective] военная традиция восходит к прусским временам, хотя Великая война прервала череду славных побед. Однако вермахт уже разрабатывает тактику для следующей войны, и этот опыт значительно поможет датской армии."
 DEN_Invite_Italian_Advisors:0 "Пригласить итальянских советников"
 DEN_Invite_Italian_Advisors_desc:0 "[ITA.GetAdjective] королевская армия многому научилась в ходе кампании в Эфиопии и, похоже, готова поделиться опытом с нашим новым фашистским государством."
 DEN_Secure_the_Military:0 "Обеспечить лояльность армии"
 DEN_Secure_the_Military_desc:0 "Основа нашей власти заключается в способности контролировать вооружённые силы и использовать датскую мощь."
 DEN_Secure_Iceland:0 "Обеспечить контроль над Исландией"
 DEN_Secure_Iceland_desc:0 "Временная независимость Исландии не помешает нам вернуть её."
 DEN_Research_Efforts:0 "Финансировать военные исследования"
 DEN_Research_Efforts_desc:0 "После недавнего курса на расширение военно-промышленного комплекса вложения в военную науку кажутся вполне логичными."
 DEN_Join_the_Axis:0 "Вступить в Ось"
 DEN_Join_the_Axis_desc:0 "[GER.GetNameDefcap] к югу от нас несомненно обладает огромной военной и экономической мощью. Отказ от союза с ним стал бы колоссальной потерей для [DEN.GetNameDef]."
 DEN_German_Economic_Collaboration:0 "Германо-датское экономическое сотрудничество"
 DEN_German_Economic_Collaboration_desc:0 "Богатая углём и сталью [GER.GetName] и наши излишки сельскохозяйственной продукции прекрасно дополняют друг друга. Мы усилим зависимость от экономики [GER.GetNameDef]."
 DEN_Invite_the_Wehrwirtschaftsfuhrer:0 "Пригласить руководителей военной экономики"
 DEN_Invite_the_Wehrwirtschaftsfuhrer_desc:0 "Крупные промышленные монополии [GER.GetNameDef], такие как «ИГ Фарбен», «Мерседес» и «Крупп», будут приглашены в [DEN.GetNameDef], чтобы помочь развитию нашей экономики."
 DEN_Dano_German_Propaganda:0 "Датско-германская пропаганда"
 DEN_Dano_German_Propaganda_desc:0 "Датчане и [GER.GetAdjective] народы вместе войдут в будущее ради лучшей Европы."
 DEN_Fighter_Cooperation:0 "[DEN_fighter_coop_localisation]"
 DEN_Fighter_Cooperation_desc:0 "[DEN_air_localisation] испытывает нехватку качества, количества и опыта. Сотрудничество с союзниками позволит преодолеть нынешнее состояние военно-воздушных сил."
 DEN_Look_Elsewhere:0 "Дания прежде всего"
 DEN_Look_Elsewhere_desc:0 "Датская нация ни при каких обстоятельствах не должна подчиняться другой державе. Судьбу Дании определяем мы сами."
 DEN_Rapidly_Increase_Arms_Production:0 "К оружию, датчане!"
 DEN_Rapidly_Increase_Arms_Production_desc:0 "Фабричные рабочие возьмутся за молоты и создадут оружие, которым солдаты защитят [DEN.GetNameDef]!"
 DEN_Scandinavian_Intervention:0 "Скандинавская интервенция"
 DEN_Scandinavian_Intervention_desc:0 "Скандинавия не может терпеть тоталитарные правительства на своей территории. Мы должны обеспечить сохранение демократии в скандинавских странах!"
 DEN_Militarization_of_Society:0 "Милитаризация общества"
 DEN_Militarization_of_Society_desc:0 "Датское общество ослабло из-за пацифизма социал-демократических правительств последних десятилетий. Мы возродим боевой дух датчан."
 DEN_Expand_Military_Research:0 "Расширить военные исследования"
 DEN_Expand_Military_Research_desc:0 "После недавнего курса на расширение военно-промышленного комплекса мы также вложимся в военные исследования."
 DEN_Danish_Autarky:0 "Датская автаркия"
 DEN_Danish_Autarky_desc:0 "Хотя [DEN.GetNameDef] небогата ресурсами, она обладает экономической и военной мощью, с помощью которой мы обеспечим безопасность цепочек снабжения."
 DEN_Bolster_Danish_Corporations:0 "Поддержать датские корпорации"
 DEN_Bolster_Danish_Corporations_desc:0 "Необходимо позаботиться, чтобы промышленники, поддерживающие нашу партию, получили выгоду от военной экономики."
 DEN_Exploit_the_Conquered_Lands:0 "Эксплуатировать завоёванные земли"
 DEN_Exploit_the_Conquered_Lands_desc:0 "Враги датчан пали один за другим, и теперь их земли находятся под нашим контролем. Мы воспользуемся их ресурсами и промышленностью."
 DEN_Cross_the_Skagerrak:0 "Пересечь Скагеррак"
 DEN_Cross_the_Skagerrak_desc:0 "Национальные узы Дании и Норвегии неоспоримы, и теперь обе страны вновь объединятся под властью одного правителя."
 DEN_Return_to_England:0 "Вернуться в Англию"
 DEN_Return_to_England_desc:0 "После катастрофы у Стамфорд-Бриджа скандинавы больше не влияли на британские дела. Настало время готовить новое вторжение в Англию."
 DEN_Reclaim_our_Hibernian_Vassals:0 "Вернуть гибернийских вассалов"
 DEN_Reclaim_our_Hibernian_Vassals_desc:0 "В конце эпохи викингов многие ирландские княжества были вассалами датских королей. Некоторые считают это достаточным оправданием для вторжения на остров."
 DEN_Reestablish_the_Danelaw_Confederacy:0 "Восстановить конфедерацию Данелага"
 DEN_Reestablish_the_Danelaw_Confederacy_desc:0 "Вместо прямого господства над Британскими островами следует проявить благоразумие и обратиться к истории. Перестроив Англию по образцу Данелага, мы сможем внедрить датские административные обычаи в старые англосаксонские структуры, что будет проще, чем напрямую навязывать нашу систему."
 DEN_Rebirth_of_the_North_Sea_Empire:0 "Возрождение Империи Северного моря"
 DEN_Rebirth_of_the_North_Sea_Empire_desc:0 "Теперь, когда Англия, Норвегия и Дания находятся под властью одного правителя, настало время возродить образы прошлого и провозгласить Империю Северного моря."
 DEN_Never_Again_a_Battle_of_Copenhagen:0 "Никогда больше Копенгагенской битвы"
 DEN_Never_Again_a_Battle_of_Copenhagen_desc:0 "Неспровоцированная Копенгагенская битва уничтожила датский королевский флот, а вместе с ним и национальную гордость. Мы должны укрепить военно-морские силы, чтобы быть готовыми к следующему внезапному нападению."
 DEN_Fight_for_Denmark:0 "Сражаться за Данию"
 DEN_Fight_for_Denmark_desc:0 "Последнее столетие мира укоренило пацифизм среди обычных датчан, но в столь нестабильной обстановке он может стереть [DEN.GetNameDef] с карты."
 DEN_Dismantle_the_Unions:0 "Разрушить профсоюзы"
 DEN_Dismantle_the_Unions_desc:0 "Единственная цель профсоюзов — поощрять лень среди рабочих. Чтобы устранить эту неэффективность, мы полностью упраздним данный институт."
 DEN_Reascension_of_the_Aristrocracy:0 "Возвращение аристократии"
 DEN_Reascension_of_the_Aristrocracy_desc:0 "Нынешнее бесправное положение аристократии является позором и должно быть исправлено."
 DEN_Restore_Aristocratic_Land_Rights:0 "Восстановить земельные права аристократии"
 DEN_Restore_Aristocratic_Land_Rights_desc:0 "Неудивительно, что власть аристократии ослабла при демократическом правительстве. Сейчас землевладельческая знать не по своей вине почти ничего не имеет. Мы повысим её положение, предоставив щедрые земельные права."
 DEN_Retain_the_Welfare_State:0 "Сохранить государство всеобщего благосостояния"
 DEN_Retain_the_Welfare_State_desc:0 "Хотя демократические кабинеты прошлого столетия предприняли множество ошибочных попыток реформировать Данию, государство всеобщего благосостояния к ним не относится. Оно значительно повысило уровень жизни обычного датчанина, позволяя превосходить большинство индустриальных стран. Поэтому ради процветания [DEN.GetNameDef] мы сохраним эту систему."
 DEN_Social_Nationalism:0 "Социальный национализм"
 DEN_Social_Nationalism_desc:0 "Хотя датский парламентаризм упразднён, некоторые его разумные достижения для общества следует сохранить. Среди них — отдельные социальные программы, обеспечивающие процветание всей Дании. Их отмена серьёзно подорвёт поддержку монархии, чего необходимо избежать."
 DEN_Reinvigorate_the_Officer_Corp:0 "Возродить офицерский корпус"
 DEN_Reinvigorate_the_Officer_Corp_desc:0 "Со Средних веков одной из важнейших обязанностей датской знати была защита страны. Чтобы она вновь могла выполнять эту роль, мы расширим военное образование среди аристократов."
 DEN_Royal_Industries:0 "Королевская промышленность"
 DEN_Royal_Industries_desc:0 "В демократический период буржуазия контролировала большую часть промышленности, торговли и множества других отраслей. После политических перемен аристократия станет господствовать в промышленности [DEN.GetNameDef]."
 DEN_The_Royal_Academy:0 "Королевская академия"
 DEN_The_Royal_Academy_desc:0 "Теперь, когда положение аристократии вновь обеспечено, она сможет снова сосредоточиться на образовании и искусствах."
 DEN_Amnesty_for_Political_Prisoners:0 "Амнистировать политических заключённых"
 DEN_Amnesty_for_Political_Prisoners_desc:0 "Большинство сторонников социалистов и фашистов были лишь сильно введены в заблуждение политическими лидерами, и многие уже понесли наказание за свои ошибки."
 DEN_Norwegian_Economic_Developement:0 "Экономическое развитие Норвегии"
 DEN_Norwegian_Economic_Developement_desc:0 "Мы ещё сильнее интегрируем норвежскую экономику, инвестируя в королевство."
 DEN_Norwegian_War_Infrastructure:0 "Военная инфраструктура Норвегии"
 DEN_Norwegian_War_Infrastructure_desc:0 "Конфликт между [DEN.GetNameDef] и [SWE.GetNameDef] кажется неизбежным, поэтому подготовка фронтов будет необходима для победы над нашим вековым соперником."
 DEN_Swedish_Economic_Developement:0 "Экономическое развитие Швеции"
 DEN_Swedish_Economic_Developement_desc:0 "Шведы встретили наше вторжение без особого восторга. Возможно, целевое экономическое развитие убедит их, что датское правление выгоднее независимости."
 DEN_Reclaim_our_Baltic_Possessions:0 "Вернуть балтийские владения"
 DEN_Reclaim_our_Baltic_Possessions_desc:0 "Герцогство Эстляндия было передано Дании в ходе крестовых походов на востоке и играло важнейшую роль в балтийской торговле. Теперь, когда [DEN.GetNameDef] вновь усиливается, мы вернём Эстонию."
 DEN_Reclaim_the_Swedes:0 "Вернуть Королевство Швеция"
 DEN_Reclaim_the_Swedes_desc:0 "После шведской войны за независимость Швеция играла важную роль в политике Северной Европы, но теперь этому вновь придёт конец. Она снова станет избирательным округом [DEN.GetNameDef]."
 DEN_Reclaim_the_Finns:0 "Вернуть герцогство Финляндия"
 DEN_Reclaim_the_Finns_desc:0 "Финляндия всегда была беззащитна без покровительства другой державы. Без внешней власти она не способна процветать."
 DEN_Focus_Outwards:0 "Вернуться на мировую арену"
 DEN_Focus_Outwards_desc:0 "После унизительного мира 1814 года Дания почти не участвовала в международной политике. Более века спустя [DEN.GetNameDef] готова вернуться на мировую арену."
 DEN_Reestablish_French_Ties:0 "Восстановить [FRA.GetAdjective] связи"
 DEN_Reestablish_French_Ties_desc:0 "Мы храбро сражались бок о бок с наполеоновскими войсками Франции и, как в 1813 году, вновь будем стремиться к тесным отношениям с французами."
 DEN_Reestablish_Polish_Ties:0 "Восстановить [POL.GetAdjective] связи"
 DEN_Reestablish_Polish_Ties_desc:0 "Союзы поляков и датчан были многочисленны и служили серьёзным противовесом германским державам. В условиях нынешнего кризиса и подъёма [GER.GetName] тесные связи с польским правительством окажутся полезны."
 DEN_Reclaim_Schleswig:0 "Вернуть Шлезвиг"
 DEN_Reclaim_Schleswig_desc:0 "После поражения Германской империи в Великой войне слабое демократическое правительство отказалось от любых притязаний на земли, утраченные в Шлезвигских войнах. Мы силой исправим эту ошибку."
 DEN_The_Stolen_Kingdom:0 "Братья, разлучённые судьбой"
 DEN_The_Stolen_Kingdom_desc:0 "Скагеррак не сможет разделять Данию и Норвегию! Дания воссоединится с братским народом, а король Кристиан — с родным братом."
 DEN_Scandinavian_Cooperation:0 "Скандинавское сотрудничество"
 DEN_Scandinavian_Cooperation_desc:0 "Скандинавы разделяют общую историю, столь древнюю, что её почти невозможно постичь. Скандинавия должна объединиться для защиты полуострова от иностранного вторжения."
 DEN_Direct_Involvement:0 "Отправить советников в Норвегию"
 DEN_Direct_Involvement_desc:0 "В поддержку Хокона [NOR.GetAdjective] сторона получит лучших военных советников, которых может предложить [DEN.GetNameDef]."
 DEN_Legitimize_the_Kingdom_of_Norway:0 "Стабилизировать Королевство Норвегия"
 DEN_Legitimize_the_Kingdom_of_Norway_desc:0 "Политическая нестабильность после королевского переворота Хокона VII несколько навредила [NOR.GetNameDef]. Мы должны залечить эти раны."
 DEN_Coordinate_the_Staffs:0 "Координировать штабы"
 DEN_Coordinate_the_Staffs_desc:0 "Генеральные штабы нашего скандинавского союза должны установить прямые каналы связи и провести масштабную структурную перестройку, чтобы обеспечить координацию в случае худшего."
 DEN_Restoration_of_Denmark_Norway:0 "Восстановить Данию-Норвегию"
 DEN_Restoration_of_Denmark_Norway_desc:0 "Более чем через сто лет после распада датско-норвежской унии она вновь станет крупной силой на европейском театре."
 DEN_CIA_Contacts:0 "Связи с ЦРУ"
 DEN_CIA_Contacts_desc:0 "Наши дорогие американские союзники обладают значительным опытом в разведке и шпионаже. Ради собственных разведывательных целей мы будем развивать сотрудничество."
 DEN_Continue_the_Fight:0 "Продолжить борьбу"
 DEN_Continue_the_Fight_desc:0 "[DEN.GetNameDef] побеждена, но не сломлена! При [ENG.GetAdjective] поддержке мы продолжим сражаться за освобождение родины."
 DEN_Sabotage_German_Supply:0 "Саботировать [?occupation_target.GetAdjective] снабжение"
 DEN_Sabotage_German_Supply_desc:0 "Хотя правительство было вынуждено покинуть Ютландию и Зеландию, множество партизан, преданных свободе и [DEN.GetNameDef], остаётся в подполье и ждёт приказа. Мы превратим снабжение оккупационных сил в настоящий кошмар."
 DEN_Target_Danish_Collaborators:0 "Устранить датских коллаборационистов"
 DEN_Target_Danish_Collaborators_desc:0 "Хотя большинство оставшихся датчан с нетерпением ждут нашего возвращения, некоторые построили карьеру на предательстве нации и сотрудничестве с оккупантами."
 DEN_Scuttle_the_Ships:0 "Затопить корабли"
 DEN_Scuttle_the_Ships_desc:0 "Часть флота, к сожалению, осталась в портах Копенгагена и может быть захвачена оккупантами. Мы не допустим попадания судов в [GER.GetAdjective] руки, убедив «коллаборационистского» адмирала посадить их на мель."
 DEN_Alliance_with_the_Communists:0 "Союз с коммунистами"
 DEN_Alliance_with_the_Communists_desc:0 "До вторжения в [DEN.GetNameDef] отношения между демократическими партиями и КПД даже в лучшие времена оставались холодными. Но общий опыт оккупации позволяет забыть разногласия. Освободим [DEN.GetNameDef] вместе!"
 DEN_Local_Recruitment:0 "Местный набор"
 DEN_Local_Recruitment_desc:0 "Немногие оставшиеся у нас острова, защищённые [faction_leader.GetAdjective] флотом, малонаселены, но при правильной мотивации могут стать новым источником бойцов для [DEN_army_localisation]."
 DEN_BBC_Broadcasts_to_Denmark:0 "Трансляции Би-би-си для Дании"
 DEN_BBC_Broadcasts_to_Denmark_desc:0 "Ещё в мирное время Йон Кристмас Мёллер был пламенным оратором, а оккупация лишь усилила его рвение. Вместе с Би-би-си мы сделаем его голосом оккупированных датчан."
 DEN_British_Guns:0 "Британское оружие"
 DEN_British_Guns_desc:0 "Наше продолжающееся сопротивление вдохновило многих [ENG.GetAdjective] политиков в Лондоне, и [ENG.GetAdjective] правительство согласилось передать [DEN.GetNameDef] некоторое количество пехотного вооружения."
 DEN_Liberation:0 "Освобождение"
 DEN_Liberation_desc:0 "Многие сомневались, что этот день наступит, но вот он пришёл. Для оккупированных датчан настал День освобождения: они оставляют позади годы оккупации и с оптимизмом смотрят в будущее."
 likes_denmark:0 "Симпатизирует Дании"
