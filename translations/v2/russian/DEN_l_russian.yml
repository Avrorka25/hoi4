 den_establish_local_chapter:0 "Создать ячейку сопротивления в [FROM.GetName]"
 den_sabotage_industrial_centers:0 "Саботировать промышленность в [FROM.GetName]"
 den_sabotage_frontlines:0 "Саботировать германские линии фронта в [FROM.GetName]"
 den_call_upon_the_partisans:0 "Призвать партизан в [FROM.GetName]"
 den_german_propaganda_campaigns:0 "Пропагандистская кампания в [FROM.GetName]"
 den_kpd_partisan_uprising_tt:0 "§Y2 партизанских подразделения§! поднимут восстание и присоединятся к нам."
 DEN_Resistance_1:0 "Датское сопротивление"
 DEN_Resistance_2:0 "Массовое датское сопротивление"
 den_ships_seized:0 "Оставшиеся в Дании корабли конфискуются"
 den_ships_seized_desc:0 "Не весь датский [DEN_navy_localisation] смог избежать стремительного [GER.GetAdjective] наступления. Пока корабли ещё находятся в руках сотрудничающих датских моряков, однако [GER.GetAdjective] давление с целью их захвата постоянно растёт. Если действовать быстро, мы сможем вырвать датские суда из рук Оси и одновременно одержать крупную пропагандистскую победу."
 denmark:0 "Дерево фокусов Дании"
 denmark_focus:0 "Дерево фокусов Дании"
 free_denmark:0 "Дерево фокусов Свободной Дании"
 collab_denmark:0 "Дерево фокусов коллаборационистской Дании"
 DEN_King_Christian_Coup:0 "Переворот короля Кристиана"
 DEN_King_Christian_Coup_desc:0 "Датский образ жизни оказался под угрозой: экстремисты получили значительное политическое влияние, а демократическая система, похоже, не справляется с давлением. Ради сохранения души нации Его Высочество Кристиан X считает королевский переворот лучшим решением. Возвращение власти династии Глюксбургов будет сопряжено с серьёзными трудностями, но, похоже, иного пути нет."
 DEN_Changing_Times:0 "Меняющиеся времена"
 DEN_Changing_Times_desc:0 "Недавние примеры насильственных политических перемен — свержение Веймарской республики в Германии, Русская революция и последующая гражданская война в усиливающемся [SOV.GetName] — ясно показали, что традиционную датскую политику выборов и Фолькетинга всё чаще могут заменять выстрелы на улицах."
 DEN_Galvanise_the_German_Minority:0 "Воодушевить немецкое меньшинство"
 DEN_Galvanise_the_German_Minority_desc:0 "После возвращения Северного Шлезвига по итогам Великой войны в Дании проживает множество немцев, большинство из которых сочувствует Германскому рейху. Использовать их для подъёма датского фашизма вполне логично."
 DEN_Secure_Industrialists_Support:0 "Заручиться поддержкой промышленников"
 DEN_Secure_Industrialists_Support_desc:0 "Растущая нестабильность, вызванная политическим насилием, тревожит многих видных промышленников, опасающихся скорой коммунистической революции. Убедив их, что нынешнее правительство неспособно остановить рост коммунизма, мы наверняка получим их поддержку."
 DEN_Increase_Attacks_on_the_Communists:0 "Усилить нападения на коммунистов"
 DEN_Increase_Attacks_on_the_Communists_desc:0 "Коммунисты — общий враг датской нации, и в последнее время они стали активнее обычного. Наш долг — ограничить их влияние."
 DEN_Bolster_the_SA:0 "Усилить СА"
 DEN_Bolster_the_SA_desc:0 "Военизированное крыло нашей партии следует расширить, чтобы воля партии осуществлялась на улицах параллельно с парламентской работой руководства."
 DEN_Appeal_for_German_Funding:0 "Запросить [GER.GetAdjective] финансирование"
 DEN_Appeal_for_German_Funding_desc:0 "Наше нынешнее движение вдохновлено германским национал-социализмом, который уже заменил слабую Веймарскую республику и теперь обладает достаточной силой, чтобы финансировать наше дело."
 DEN_Press_the_Schleswig_Claim:0 "Настаивать на претензиях на Шлезвиг"
 DEN_Press_the_Schleswig_Claim_desc:0 "Германия жестоко отторгла Шлезвиг-Гольштейн после Шлезвигских войн между Пруссией и Германским союзом. Возрождающаяся [DEN.GetNameDef] не может бездействовать перед лицом этой несправедливости."
 DEN_Initiate_Economic_Reforms:0 "Начать экономические реформы"
 DEN_Initiate_Economic_Reforms_desc:0 "Политика социал-демократов не смогла справиться с Великой депрессией. Настало время консерваторам перестроить нашу экономику."
 DEN_Fuel_Nationalism:0 "Разжечь национализм"
 DEN_Fuel_Nationalism_desc:0 "Недавний непрочный мир резко снизил воинственность датчан и их преданность нации. Мы вновь вдохновим соотечественников быть готовыми умереть за свою страну."
 DEN_Increased_Protectionism:0 "Усилить протекционизм"
 DEN_Increased_Protectionism_desc:0 "Наше сельское хозяйство теряет богатство, не выдерживая конкуренции с иностранными товарами. Чтобы противостоять этому, необходимо повысить пошлины."
 DEN_Increase_Rural_Developement:0 "Расширить развитие сельских районов"
 DEN_Increase_Rural_Developement_desc:0 "Сельская местность — сердце датской нации, однако в последнее время её развитием пренебрегали ради роста городских экономик. Обратный курс жизненно важен для [DEN.GetNameDef]."
 DEN_Conservative_Majority:0 "Консервативное большинство"
 DEN_Conservative_Majority_desc:0 "Из-за одного провала политики за другим некогда широко популярные социал-демократы утратили общественный мандат и будут заменены ответственным консервативным правительством. Народ Дании снова сможет спать спокойно, зная, что республика защищена."
 DEN_Expand_Agricultural_Subsidies:0 "Расширить сельскохозяйственные субсидии"
 DEN_Expand_Agricultural_Subsidies_desc:0 "Наши фермеры находятся на грани разорения. Хотя субсидии не станут постоянным решением, они помогут пережить бурю Великой депрессии."
 DEN_Strengthen_the_Labour_Unions:0 "Укрепить профсоюзы"
 DEN_Strengthen_the_Labour_Unions_desc:0 "Главнейшим институтом для любого датского рабочего является профсоюз, обеспечивающий ему право голоса на рабочем месте. Укрепляя профсоюзы, мы укрепляем и нашу партию."
 DEN_Devalue_the_Krone:0 "Девальвировать крону"
 DEN_Devalue_the_Krone_desc:0 "Девальвация валюты даст конкурентное преимущество на европейском экспортном рынке и, возможно, оживит застойную экономику."
 DEN_Expand_the_Copenhagen_University:0 "Расширить Копенгагенский университет"
 DEN_Expand_the_Copenhagen_University_desc:0 "Копенгагенский университет — наше важнейшее научное учреждение, и его дальнейшее расширение поможет развитию растущего сообщества датских учёных."
 DEN_Bolster_Labour_Rights:0 "Расширить трудовые права"
 DEN_Bolster_Labour_Rights_desc:0 "Опираясь на укрепившееся положение профсоюзов, мы можем провести масштабные изменения и улучшить условия труда фабричных рабочих. Это значительно укрепит нашу электоральную базу, но вызовет недовольство промышленников."
 DEN_Social_Democratic_Majority:0 "Социал-демократическое большинство"
 DEN_Social_Democratic_Majority_desc:0 "После преодоления внутренних кризисов демократическая традиция [DEN.GetNameDef] сможет под руководством социал-демократов вступить в золотой век и стать маяком свободы."
 DEN_An_Appeal_to_the_Proletariat:0 "Обращение к пролетариату"
 DEN_An_Appeal_to_the_Proletariat_desc:0 "Безмолвные массы фабричных рабочих тяжело страдают от застоя экономики и требуют перемен. Перемен, которые может принести только Коммунистическая партия."
 DEN_Popular_Front_against_Fascism:0 "Народный фронт против фашизма"
 DEN_Popular_Front_against_Fascism_desc:0 "Угроза фашизма объединила множество социал-демократических и социалистических движений по всему миру, и то же произойдёт в [DEN.GetNameDef]. Боевое крыло Социал-демократической партии и Коммунистическая партия вместе сокрушат фашизм, поднявшийся в Германии."
 DEN_Channel_Economic_Frustrations:0 "Направить экономическое недовольство"
 DEN_Channel_Economic_Frustrations_desc:0 "Всё сильнее сосредотачивая риторику на экономических провалах нынешней администрации, мы сможем привлечь ещё больше трудящихся к коммунистическому делу."
 DEN_Ally_the_Peasents:0 "Заключить союз с крестьянами"
 DEN_Ally_the_Peasents_desc:0 "В [DEN.GetNameDef] эксплуатируют не только пролетариев: землевладельцы в сельской местности также наживаются на простых крестьянах. Два угнетённых класса объединятся и свергнут систему, отчуждающую их от собственного труда."
 DEN_Comintern_Support:0 "Поддержка Коминтерна"
 DEN_Comintern_Support_desc:0 "Коммунистический интернационал, третья попытка объединить социалистические движения мира, способен предоставить значительную политическую помощь различным освободительным движениям. Мы хорошо воспользуемся поддержкой товарищей."
 DEN_Organize_Nationwide_Strikes:0 "Разжечь революционный пыл"
 DEN_Organize_Nationwide_Strikes_desc:0 "«Революция близка», — гласит листовка, которую восторженная коммунистическая молодёжь раздаёт на многолюдных площадях Копенгагена. Эти настроения разделяют многие социалисты, с оптимизмом ожидающие прихода революции в [DEN.GetNameDef]."
 DEN_DNSAP_Takeover:0 "Марш на Копенгаген"
 DEN_DNSAP_Takeover_desc:0 "Этот день станет кульминацией последних месяцев политического насилия и уличных боёв. Население достаточно разочаровалось в нынешнем демократическом правительстве и достаточно испугалось растущих коммунистов, чтобы поддержать наше фашистское движение. Марш в центр Копенгагена ознаменует славную победу над большевиками и их союзниками."
 DEN_DKP_Takeover:0 "Всеобщая забастовка"
 DEN_DKP_Takeover_desc:0 "После трагического провала восстания спартакистов неизбежность революции европейского пролетариата оказалась под вопросом. Однако теперь датские коммунисты, похоже, получили возможность свергнуть эту буржуазную демократию."
 DEN_Denmark_in_Peril:0 "Дания в опасности"
 DEN_Denmark_in_Peril_desc:0 "После поражения в Наполеоновских войнах Дания словно спокойно проплывала мимо мировых конфликтов и внутренних потрясений. Но на фоне реваншистской [GER.GetName] и амбициозного [SOV.GetName] недавнее спокойствие Европы кажется недолговечным. Чтобы [DEN.GetNameDef] выжила в новых условиях, ей придётся приспособиться. Мир либо вынудит её к мучительной милитаризации, либо к унизительным уступкам."
 DEN_Reverse_the_Disarmament:0 "Отменить разоружение"
 DEN_Reverse_the_Disarmament_desc:0 "Спокойствие Европы быстро исчезает, и мы больше не можем полагаться на мир. Необходимо отказаться от многолетней политики разоружения."
 DEN_A_Modern_Hammershus:0 "Современный Хаммерсхус"
 DEN_A_Modern_Hammershus_desc:0 "Остров Борнхольм занимает стратегическое положение в Балтийском море и был серьёзно укреплён ещё в Средние века. Поскольку современное вторжение становится всё вероятнее, мы также должны защитить этот важнейший остров."
 DEN_Fortify_the_Southern_Islands:0 "Укрепить военно-морские базы"
 DEN_Fortify_the_Southern_Islands_desc:0 "[DEN_navy_localisation] и [DEN_army_localisation] должны совместно защищать [DEN.GetNameDef]. Укрепив военно-морские базы сухопутными силами, мы помешаем противнику обойти нас на родных островах."
 DEN_AA_Installations:0 "Зенитные установки"
 DEN_AA_Installations_desc:0 "Ведущие державы Европы всё активнее используют третье измерение современной войны. Чтобы защитить датские города и мирное население, мы должны быть готовы сбивать десятки «Штук»."
 DEN_Radar_Installations:0 "Радиолокационные установки"
 DEN_Radar_Installations_desc:0 "Необходимо внедрить систему обнаружения авиационных соединений по образцу [ENG.GetAdjective], чтобы знать, что происходит в датском воздушном пространстве."
 DEN_Fortress_Sjaelland:0 "Крепость Зеландия"
 DEN_Fortress_Sjaelland_desc:0 "Сосредоточившись на укреплении островов, мы сможем эффективнее сопротивляться агрессорам, но ценой отказа от защиты всех датчан Ютландии."
 DEN_The_Frederick_Line:0 "Возрождение Даневирке"
 DEN_The_Frederick_Line_desc:0 "Даневирке представлял собой систему укреплений, созданную викингами для сдерживания германских вторжений. В нынешнем положении его современное возрождение хорошо послужит Дании."
 DEN_Ramp_up_Conscription:0 "Расширить призыв"
 DEN_Ramp_up_Conscription_desc:0 "Воинская повинность является частью датского образа жизни со времён викингов, однако нынешнее положение требует её дальнейшего расширения."
