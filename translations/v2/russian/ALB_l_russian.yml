 albania_focus:0 "Национальные фокусы Албании"
 9_ALB_tt:0 "Существует вероятность, что это вызовет национальное восстание и гражданскую войну!"
 POLITICS_KING_ZOG_DESC:0 "Родившийся в 1895 году в знатной семье из замка Бургайет, Зог занимал министерские должности с 1920 по 1924 год, пока не был вынужден отправиться в изгнание в Югославию. Молодой Зог вернулся при югославской поддержке и 1 февраля 1925 года был избран президентом, а 1 сентября позднее принял королевский титул.\nХотя он умело использовал внутреннюю политику Албании в своих интересах, Зог сильно зависел от Италии Бенито Муссолини."
 likes_italy:0 "Симпатизирует Италии"
 ALB_head_of_the_comitee_of_kosovo:0 "Глава Комитета Косово"
 ALB_strengthen_zogs_rule:0 "Укрепить власть Зога"
 ALB_strengthen_zogs_rule_desc:0 "Наш король — защитник страны! Он станет символом борьбы против тех, кто угрожает королевству! Мы передадим будущим поколениям наследие Скандербега и нашего короля!"
 ALB_challenge_zogs_rule:0 "Бросить вызов власти Зога"
 ALB_challenge_zogs_rule_desc:0 "Король Зог не решит наших проблем! Правительство и сам король всё сильнее зависят от [ITA.GetNameDef] и подчиняются ей, тогда как племена и народ остаются бессильными. Пришло время перемен!"
 ALB_political_reforms:0 "Политические реформы"
 ALB_political_reforms_desc:0 "После завершения существования Первой республики король Зог основал Королевство Албания. Теперь мы стоим на распутье, и настало время сделать важный выбор. Мы приведём страну к процветанию!"
 ALB_the_peoples_republic:0 "Народная республика"
 ALB_the_peoples_republic_desc:0 "Наш народ слишком долго оставался в тени. Людям надоело голодать и жить в нищете. Пора пролетариату и племенам Албании подняться и создать Албанскую Народную Республику!"
 ALB_restore_the_republic:0 "Восстановить республику"
 ALB_restore_the_republic_desc:0 "Каждый [ALB.GetAdjective]ий гражданин должен иметь право свободно высказываться и жить свободно! Свобода должна восторжествовать в Албании, и ради каждого [ALB.GetAdjective]ого гражданина мы добьёмся этой мечты любой ценой."
 ALB_the_peoples_army:0 "Народная армия"
 ALB_the_peoples_army_desc:0 "Чтобы защитить коммунистическую мечту, народ должен массово взяться за оружие и встать на защиту Социалистической Республики! Мы больше не будем бессильны!"
 ALB_exile_the_king:0 "Изгнать короля"
 ALB_exile_the_king_desc:0 "Для успешного переворота необходимо изгнать короля Зога — символ диктатуры и политического краха. [ITA.GetNameDefCap] приняла наше предложение отправить бывшего короля на свою территорию."
 ALB_assassinate_the_king:0 "Убить короля"
 ALB_assassinate_the_king_desc:0 "Во время следующего переворота мы должны убить короля, ответственного за все страдания народа! Почему он должен безнаказанно отправиться в изгнание? Пусть король ощутит гнев пролетариата!"
 ALB_communist_diplomacy:0 "Коммунистическая дипломатия"
 ALB_communist_diplomacy_desc:0 "Теперь, когда наша Социалистическая Республика создана, необходимо искать дружбы с теми, кто разделяет наши идеи. Главными целями станут [SOV.GetNameDefCap] и [PRC.GetNameDef]."
 ALB_the_peoples_institute:0 "Народный институт"
 ALB_the_peoples_institute_desc:0 "После победы революции необходимо сосредоточиться на исследованиях и преодолеть технологическое отставание от соседей. Новый институт поможет нам достичь поставленных целей!"
 ALB_join_the_comintern:0 "Вступить в Коминтерн"
 ALB_join_the_comintern_desc:0 "Пора воплотить коммунистическую мечту и присоединиться к [SOV.GetNameDef]! Мы будем защищать и распространять коммунистическую идеологию по всему миру!"
 ALB_the_second_republic:0 "Вторая республика"
 ALB_the_second_republic_desc:0 "Подписав новую конституцию, мы поклялись защищать народ от фашистской и коммунистической угрозы! Мы никому не позволим отнять у нас свободу и основные права!"
 ALB_the_italian_threat:0 "[ITA.GetAdjective]ая угроза"
 ALB_the_italian_threat_desc:0 "[ITA.GetNameDefCap] обладала огромным влиянием на прежнее правительство короля и теперь активно стремится усилить контроль над нами. Как независимая страна, мы должны защитить народ от тех, кто угрожает нашей свободе!"
 ALB_tirana_institute_of_research:0 "Тиранский исследовательский институт"
 ALB_tirana_institute_of_research_desc:0 "Пора финансировать новый исследовательский институт, который поможет улучшить снаряжение солдат и модернизировать армию. Защита народа от внешних угроз — наш главный приоритет."
 ALB_join_the_allies:0 "Вступить в Союзники"
 ALB_join_the_allies_desc:0 "Демократический курс сблизил нас с великими державами Запада. Пора вступить в их альянс и сражаться против крайних и опасных идеологий — фашизма и коммунизма."
 ALB_albania_on_its_own:0 "Албания сама по себе!"
 ALB_albania_on_its_own_desc:0 "На данный момент [ALB.GETNameDefCap] остаётся одна. Однако мы сами соберём союзников и непременно возглавим одну из самых необыкновенных коалиций, когда-либо существовавших на Земле!"
 ALB_socialism_in_one_country:0 "Социализм в отдельно взятой стране"
 ALB_socialism_in_one_country_desc:0 "Доктрина социализма в отдельно взятой стране ставит защиту наших коммунистических идеалов и родины выше распространения революции по всему миру. Мы должны укрепиться и стать защитниками собственных убеждений, чтобы успешно выполнить миссию!"
 ALB_permanent_revolution:0 "Перманентная революция!"
 ALB_permanent_revolution_desc:0 "Доктрина перманентной революции сосредоточена на распространении революции в капиталистических странах по всему миру. Мы распространим идеалы превосходства и власти пролетариата!"
 ALB_army_of_the_republic:0 "Армия республики"
 ALB_army_of_the_republic_desc:0 "Чтобы защитить родину от [ITA.GetNameDef] и других возможных угроз, необходимо увеличить набор и создать настоящую армию, способную защитить страну от подобных [ITA.GetLeader]."
 ALB_institute_absolute_monarchy:0 "Установить абсолютную монархию"
 ALB_institute_absolute_monarchy_desc:0 "Мы должны объединить страну под властью короля! Он должен править без всякой оппозиции! Поэтому абсолютисты должны получать всё больше влияния в правительстве. Полный контроль над страной — лишь вопрос времени."
 ALB_a_constitutional_monarchy:0 "Конституционная монархия"
 ALB_a_constitutional_monarchy_desc:0 "Страной должны управлять представители высших слоёв общества, представленные в парламенте. Поэтому конституционалисты должны получать всё больше влияния в правительстве. Полный контроль над страной — лишь вопрос времени."
 ALB_cancel_the_constitution_of_1928:0 "Отменить конституцию 1928 года"
 ALB_cancel_the_constitution_of_1928_desc:0 "Отменив конституцию, мы передадим всю власть великому королю! Он приведёт страну к славе, процветанию и престижу! Вся ответственность за страну ляжет на его плечи."
 ALB_the_kings_army:0 "Королевская армия"
 ALB_the_kings_army_desc:0 "Народ должен мобилизоваться против врагов. Мы докажем миру, что [ALB.GetNameDef] — не повод для насмешек! Мы больше никогда не будем слабы, ведь наша отвага — непобедимое оружие!"
 ALB_stick_to_the_constitution_of_1928:0 "Сохранить конституцию 1928 года"
 ALB_stick_to_the_constitution_of_1928_desc:0 "Наш благородный король теперь правит страной с помощью парламента. Его полномочия ограничены, но он всё ещё является главой и символическим правителем [ALB.GetNameDef]. Да благословит Бог Скандербега III!"
 ALB_strategic_diplomacy:0 "Стратегическая дипломатия"
 ALB_strategic_diplomacy_desc:0 "[ITA.GetNameDefCap] оказывает нам большую помощь, но необходимо найти других союзников, чтобы не стать зависимыми от [ITA.GetNameDef]. Мы начнём дипломатические инициативы по всей Европе и найдём партнёров с общими целями."
 ALB_albanias_pact_of_defense:0 "Оборонительный пакт Албании"
 ALB_albanias_pact_of_defense_desc:0 "Наши дипломатические миссии приносят плоды. [YUG.GetNameDefCap], [POL.GetNameDef] и [ROM.GetNameDef] согласились гарантировать нашу независимость. Прекрасный день для страны!"
 ALB_tirana_royal_institute_of_technology:0 "Королевский технологический институт Тираны"
 ALB_tirana_royal_institute_of_technology_desc:0 "Мы не должны отставать от соседей в технологиях. Институт был построен для модернизации армии, флота и промышленности. Мы уверенно движемся к превращению в современную индустриальную страну!"
 ALB_faith_in_liberty:0 "Вера в свободу"
 ALB_faith_in_liberty_desc:0 "Мы верим в демократию и свободу и будем защищать эти ценности любой ценой. Народ готов отдать жизнь за страну. Мы — земля свободных!"
 ALB_trans_european_trade_agreement:0 "Трансъевропейское торговое соглашение"
 ALB_trans_european_trade_agreement_desc:0 "Благодаря дипломатическим миссиям нам удалось заключить выгодное для страны торговое соглашение. Оно поможет снабжать армию и усилит наше влияние в деловом мире."
 ALB_fascist_diplomacy:0 "Фашистская дипломатия"
 ALB_fascist_diplomacy_desc:0 "Несмотря на абсолютную монархию, именно фашисты разделяют наиболее близкие нам идеи. Поэтому стоит улучшить отношения с ними и обсудить союзы и экономическое сотрудничество."
 ALB_join_the_axis:0 "Вступить в Ось"
 ALB_join_the_axis_desc:0 "Присоединение к [GER.GetNameDef] и Оси поможет защититься от внешних угроз. Они также разделяют наши идеи, а высшие чиновники правительства в основном настроены на сотрудничество с [GER.GetAdjective]ими властями. Пора вступить в их альянс!"
 ALB_german_albanian_trade_pact:0 "[GER.GetAdjective]о-[ALB.GetAdjective]ий торговый пакт"
 ALB_german_albanian_trade_pact_desc:0 "Экономическое сотрудничество между нашими странами укрепит дружбу и принесёт взаимную выгоду. Торговое соглашение упростит снабжение и организацию войск."
 ALB_grand_kingdom_of_albania:0 "Великое Королевство Албания"
 ALB_grand_kingdom_of_albania_desc:0 "Пора задуматься о расширении в Европе. Верховное командование желает захватить Косово — албаноязычный регион [YUG.GetNameDef], — а также южные провинции [YUG.GetNameDef]. Некоторые генералы хотят пойти дальше и планируют завоевание северной Греции и [BUL.GetNameDef]. Да начнётся золотой век [ALB.GetNameDef]!"
 ALB_take_care_of_the_kingdom_of_yugoslavia:0 "Разобраться с [YUG.GetNameDef]"
 ALB_take_care_of_the_kingdom_of_yugoslavia_desc:0 "Страна, известная как [YUG.GetNameDef], владеет албаноязычными провинциями. Мы заберём их и вернём албаноязычный народ домой!"
 ALB_make_bulgaria_ours:0 "Сделать Болгарию нашей!"
 ALB_make_bulgaria_ours_desc:0 "Наши политические цели подталкивают к нападению на [BUL.GetNameDef]. Их армия сильна, но наша лучше! Мы сокрушим врага!"
 ALB_romanias_grand_invasion:0 "Великое вторжение в Румынию"
 ALB_romanias_grand_invasion_desc:0 "Румынские нефтяные месторождения чрезвычайно ценны. Контроль над ними позволит снабжать всю армию без зависимости от импорта. Мы сокрушим этого врага!"
 ALB_march_through_greece:0 "Марш через Грецию"
 ALB_march_through_greece_desc:0 "Греция обладает значительной торговой ценностью, поскольку через её земли проходят многочисленные торговые пути. Завоевание страны усилит наше торговое влияние!"
 ALB_the_spirit_of_skanderbeg:0 "Дух Скандербега"
 ALB_the_spirit_of_skanderbeg_desc:0 "В XV веке Османская империя вторглась в наши земли. В 1480 году она завершила завоевание, несмотря на ожесточённое сопротивление легендарного Скандербега и албанской армии. Сегодня пришло время отомстить во имя Скандербега!"
 ALB_ita:0 "Подчинить [ITA.GetLeader]"
 ALB_ita_desc:0 "Ещё недавно мы находились под влиянием [ITA.GetNameDef] и были на грани исчезновения. Сегодня мы стали сильной страной. Мы продолжим череду завоеваний и возьмём под контроль Апеннинский полуостров!"
 ALB_albania_or_iberia:0 "Албания или Иберия"
 ALB_albania_or_iberia_desc:0 "Мы должны расширить границы ещё сильнее. Правительство и верховное командование разработали планы вторжения в Испанию и на Кавказ. Нам предстоит подготовиться к борьбе с Испанией на западе и [SOV.GetNameDef] на востоке."
 ALB_send_diplomats_to_italy:0 "Отправить дипломатов в [ITA.GetNameDef]"
 ALB_send_diplomats_to_italy_desc:0 "Наша экономика и политическая ситуация всё сильнее зависят от [ITA.GetNameDef]. Как её друзья, мы должны улучшить отношения, укрепить дружбу и на всякий случай отправить несколько шпионов."
 ALB_the_italian_affair:0 "[ITA.GetAdjective]ое дело"
 ALB_the_italian_affair_desc:0 "Похоже, наши шпионы и дипломаты обнаружили нечто во время пребывания в [ITA.GetNameDef]. Возможно, это плохие новости, способные повлиять на страну. Мы должны готовиться к худшему."
 ALB_army_reforms:0 "Военные реформы"
 ALB_army_reforms_desc:0 "Наша армия сейчас слаба. Она дезорганизована, а войска плохо обучены. Правительство должно начать общую военную реформу, чтобы другие наконец считали наши вооружённые силы настоящей армией."
 ALB_economic_reforms:0 "Экономические реформы"
 ALB_economic_reforms_desc:0 "Великая депрессия нанесла экономике тяжёлый ущерб. Бедность широко распространена, безработица крайне высока, а хозяйство разрушено. Пора провести реформы и поставить страну на ноги."
 ALB_prepare_for_war:0 "Подготовиться к войне"
 ALB_prepare_for_war_desc:0 "Мы не будем вести переговоры с [ITA.GetAdjective]ими силами, которые осмелились готовить вторжение. Мы подготовим страну к противостоянию и покажем миру, что [ALB.GetNameDef] — не повод для насмешек!"
 ALB_negotiate_with_benito_mussolini:0 "Переговоры с [ITA.GetLeader]"
 ALB_negotiate_with_benito_mussolini_desc:0 "Нам следует начать переговоры с Италией. Мы сообщим о сделанном открытии и попытаемся заключить договор, который предотвратит войну между нашими странами. Разрыв в силах слишком велик, и мы не отправим тысячи молодых людей на смерть."
 ALB_treaty_of_milan:0 "Миланский договор"
 ALB_treaty_of_milan_desc:0 "Благодаря переговорам нам удалось предотвратить войну. Даже высокой ценой мы избежали уничтожения. Условия были бы гораздо суровее, если бы мы дождались нападения [ITA.GetNameDef]."
 ALB_mobilization_en_masse_desc:0 "В рамках подготовки к вторжению правительство объявит всеобщую мобилизацию народа. Мы будем сражаться за независимость [ALB.GetNameDef]!"
 ALB_mobilization_en_masse:0 "Всеобщая мобилизация"
 ALB_the_worst_is_behind_us:0 "Худшее позади!"
 ALB_the_worst_is_behind_us_desc:0 "Народ [ALB.GetNameDef] одобряет наши действия! Мы спасли жизни бесчисленного множества молодых людей, и люди благодарны. Они как никогда привержены ценностям правительства, охотнее вступают в армию и терпимее относятся к нормированию во время войны. Нам удалось добиться мира дипломатическим путём — подобное решение становится всё более редким в эпоху политической нестабильности в Европе. Теперь, когда мир обеспечен, мы можем заняться внутренним развитием и стать сильнее."
 ALB_the_will_to_fight:0 "Воля к борьбе"
 ALB_the_will_to_fight_desc:0 "Наша страна будет сражаться до конца! Ни шагу назад, только вперёд! Мы не утратим престиж и не унизимся до переговоров с [ITA.GetNameDef]! Мы будем сопротивляться и кусаться!"
 ALB_meritocratic_system:0 "Меритократическая система"
 ALB_meritocratic_system_desc:0 "Нужно заменить старую систему продвижения по социальному положению системой, основанной на способностях! Нашими армиями должны руководить компетентные люди."
 ALB_skanderbeg_military_academy:0 "Военная академия Скандербега"
 ALB_skanderbeg_military_academy_desc:0 "Нам необходимо обучать новобранцев. Армия должна быть профессиональной и организованной! Ради этого мы создадим в столице военную академию, которая превратит рекрутов в элитных солдат."
 ALB_promote_brilliant_officers:0 "Продвигать талантливых офицеров"
 ALB_promote_brilliant_officers_desc:0 "После создания академии мы будем повышать новобранцев и военнослужащих, отличившихся в учёбе и на практике. Одним из них стал Спиро Теодори Моисиу — молодой солдат чуть старше тридцати. Его способности удивили большинство членов верховного командования, и мы единогласно решили принять его в армию генералом."
 ALB_military_research:0 "Военные исследования"
 ALB_military_research_desc:0 "Наши армии должны получать лучшее оружие, которое способны дать технологии. Мы откроем центр для разработки новых образцов вооружения, артиллерии и всего, что связано с военным снаряжением."
 ALB_change_of_doctrine:0 "Смена доктрины"
 ALB_change_of_doctrine_desc:0 "Наша армия долгое время оставалась устаревшей. К счастью, теперь она быстро догоняет другие страны. Верховное командование решило, что пора изменить армейскую доктрину."
 ALB_strike_first:0 "Ударить первыми"
 ALB_strike_first_desc:0 "Ещё недавно мы находились под влиянием [ITA.GetNameDef] и были на грани исчезновения. Сегодня мы стали сильной страной. Мы защитимся от захватчиков с Апеннинского полуострова, нанеся удар, когда они меньше всего этого ожидают!"
 ALB_lightning_war:0 "Молниеносная война"
 ALB_lightning_war_desc:0 "Неважно, уступаем ли мы им в огневой мощи! Наша сила — в быстрых окружениях, перерезающих пути снабжения врага. Так мы нанесём противнику тяжёлый урон при минимуме боёв!"
 ALB_superior_firepower:0 "Превосходство огневой мощи"
 ALB_superior_firepower_desc:0 "Мы должны любой ценой нарастить огневую мощь. Её превосходство позволит побеждать с наименьшими потерями. Людские ресурсы страны бесценны, и мы не станем ими разбрасываться."
 ALB_ridding_the_army_of_foreign_influence:0 "Избавить армию от иностранного влияния"
 ALB_ridding_the_army_of_foreign_influence_desc:0 "Теперь, когда армия реформируется и набирает талантливых офицеров, [ITA.GetAdjective]ие советники нам больше не нужны. За время их пребывания организация нашей армии явно не была их приоритетом. Мы установим полный контроль над вооружёнными силами!"
 ALB_modern_army:0 "Современная армия"
 ALB_modern_army_desc:0 "После всех военных реформ нашу армию наконец можно считать современной, организованной и подготовленной. Правительство и народ должны гордиться её новым обликом."
 ALB_fortify_the_coastline:0 "Укрепить побережье"
 ALB_fortify_the_coastline_desc:0 "Было бы разумно укрепить побережье, поскольку в случае войны с иностранными державами морское вторжение весьма вероятно."
 ALB_fortify_the_kingdom_of_yugoslavia_border:0 "Укрепить границу с Югославией"
 ALB_fortify_the_kingdom_of_yugoslavia_border_desc:0 "Нам необходимо укрепить границы с [YUG.GetNameDef], чтобы выдержать внезапное вторжение. Форты задержат противника, пока мы мобилизуем основные силы на севере и востоке."
 ALB_balance_the_budget:0 "Сбалансировать бюджет"
 ALB_balance_the_budget_desc:0 "Сокращение государственных расходов и выравнивание бюджета позволит уменьшить налоги для простых людей и тем самым повысить потребление."
 ALB_invite_foreign_investors:0 "Пригласить иностранных инвесторов"
 ALB_invite_foreign_investors_desc:0 "Нам нужны инвесторы, чтобы экономика и предприятия работали должным образом."
 ALB_encourage_civilian_consumption:0 "Поощрять гражданское потребление"
 ALB_encourage_civilian_consumption_desc:0 "Рост потребления вызовет подъём предприятий. Тогда мы сможем выйти из экономического кризиса, продолжающегося с 1929 года. Мы приложим все усилия, чтобы граждане покупали больше товаров отечественного производства!"
 ALB_fund_industry:0 "Финансировать промышленность"
 ALB_fund_industry_desc:0 "Чтобы конкурировать с другими странами, нам необходима развитая промышленность. Мы небольшая и малонаселённая страна, но обладаем значительным промышленным потенциалом. У нас много природных ресурсов и достаточно рабочих рук."
 ALB_civ_1:0 "Открыть заводы в отдалённых районах"
 ALB_civ_1_desc:0 "Наша сельская местность почти не освоена. Там много безработных, поскольку предприятий мало. Строительство промышленности в этих районах повысит наш потенциал и улучшит положение сельского населения."
 ALB_civ_2:0 "Укрепить промышленность столицы"
 ALB_civ_2_desc:0 "Строительство новых гражданских фабрик снизит безработицу в столице и ускорит индустриализацию страны. Тирана станет одним из самых промышленно развитых городов мира!"
 ALB_mil_1:0 "Военные инвестиции в сельскую местность"
 ALB_mil_1_desc:0 "Для производства необходимого армии снаряжения нужна более многочисленная рабочая сила. Сельские районы идеально подходят для развития военной промышленности, поскольку значительная часть населения там безработна."
 ALB_mil_2:0 "Расширить военную промышленность Тираны"
 ALB_mil_2_desc:0 "Нашим армиям всё ещё не хватает снаряжения. Мы расширим военную промышленность, чтобы полностью обеспечить солдат всем необходимым для боя."
 ALB_infrastructure:0 "Создать Hekurudha Shqiptare"
 ALB_infrastructure_desc:0 "Hekurudha Shqiptare — Албанские железные дороги — станет нашим железнодорожным оператором и свяжет всю страну. Перебрасывать войска будет гораздо легче!"
 ALB_auxiliary_sections_of_the_army:0 "Вспомогательные рода войск"
 ALB_auxiliary_sections_of_the_army_desc:0 "Нам необходимо развить и создать армейские подразделения, обеспечивающие наземным войскам жизненно важную поддержку и превосходство в случае войны."
 ALB_academy_air:0 "Авиационный курс в военных академиях"
 ALB_academy_air_desc:0 "Нужно ввести авиационный курс в военных академиях страны, чтобы наши самолёты пилотировали компетентные лётчики. Качество важнее количества!"
 ALB_academy_navy:0 "Курс морских манёвров в военных академиях"
 ALB_academy_navy_desc:0 "Нужно ввести курс морских манёвров в военных академиях страны, чтобы кораблями командовали компетентные капитаны. Качество важнее количества!"
 ALB_establish_the_airforce:0 "Создать военно-воздушные силы"
 ALB_establish_the_airforce_desc:0 "У Албании никогда не было полноценных ВВС. Мы должны это изменить и создать их."
 ALB_fighters:0 "Истребители"
 ALB_fighters_desc:0 "Истребители — ключ к господству в воздухе, поэтому необходимо немедленно начать их производство."
 ALB_bombers:0 "Бомбардировщики"
 ALB_bombers_desc:0 "При грамотном применении уничтожение вражеской промышленности обеспечит нам промышленное превосходство."
 ALB_battleships:0 "Линкоры"
 ALB_battleships_desc:0 ""
 ALB_light_naval_warfare:0 "Лёгкие силы флота"
 ALB_light_naval_warfare_desc:0 ""
 ALB_tirana_ports:0 "Порты Тираны"
 ALB_tirana_ports_desc:0 ""
 ALB_invite_egyptian_exiles:0 "Пригласить [EGY.GetAdjective]их изгнанников"
 ALB_invite_egyptian_exiles_desc:0 "Зог, возможно, был слабым монархом, но тесные связи с [EGY.GetAdjective]ой культурой позволят без труда короновать изгнанного египетского монарха Аббаса II и создать для [ALB.GetNameDef] более законную и сильную монархию."
 ALB_reorganize_the_government:0 "Реорганизовать правительство"
 ALB_reorganize_the_government_desc:0 "Чтобы новая монархия оставалась сильной и централизованной, необходимо допустить к власти подходящих людей."
 ALB_fortify_our_position:0 "Укрепить наше положение"
 ALB_fortify_our_position_desc:0 "Внутренние и внешние силы могут враждебно отнестись к приходу [EGY.GetAdjective]ого монарха. Мы должны быть готовы к любой агрессии против нашей власти."
 ALB_egyptianize_the_army:0 "Египтизировать армию"
 ALB_egyptianize_the_army_desc:0 "До сих пор [ALB.GetAdjective]ая армия строилась на старой, слабой и устаревшей системе. Чтобы обеспечить безопасность, мы реорганизуем вооружённые силы по египетскому образцу и значительно их усилим."
 ALB_egyptian_industries:0 "[EGY.GetAdjective]ая промышленность"
 ALB_egyptian_industries_desc:0 "У Аббаса есть множество близких советников, готовых помочь промышленному развитию. Нам следует прислушаться к ним."
 ALB_liberate_our_homeland:0 "Освободить нашу родину"
 ALB_liberate_our_homeland_desc:0 "Более тридцати лет [EGY.GetAdjective]ой родиной несправедливо правят нелегитимные лидеры, вытеснившие Аббаса с престола. Пора исправить эту несправедливость и восстановить законного правителя всего Египта!"
 peoplearmy_focus:0 "Народная армия"
 peoplearmy_focus_desc:0 "Чтобы защитить коммунистическую мечту, народ должен массово взяться за оружие и встать на защиту Социалистической Республики! Мы больше не будем бессильны!"
 second_republic:0 "Вторая республика"
 second_republic_desc:0 "Мы должны подняться и защитить народ от фашистской и коммунистической угрозы! Мы никому не позволим отнять у нас свободу и основные права!"
 socialism_one_country_idea:0 "Социализм в отдельно взятой стране!"
 permanent_revolution_idea:0 "Перманентная революция!"
 permanent_revolution_idea_desc:0 "Доктрина перманентной революции сосредоточена на распространении революции в капиталистических странах по всему миру. Мы распространим идеалы превосходства и власти пролетариата!"
 democratic_army_focus:0 "Армия республики"
 democratic_army_focus_desc:0 "Чтобы защитить родину от [ITA.GetNameDef] и других возможных угроз, необходимо увеличить набор и создать настоящую армию, способную защитить страну от подобных [ITA.GetLeader]."
 absolute_influence:0 "Влияние абсолютистов"
 absolute_influence_desc:0 "Абсолютисты получают всё больше влияния в правительстве. Полный контроль над страной — лишь вопрос времени."
 constitution_influence:0 "Влияние конституционалистов"
 constitution_influence_desc:0 "Конституционалисты получают всё больше влияния в правительстве. Полный контроль над страной — лишь вопрос времени."
 italian_in_the_army:0 "[ITA.GetAdjective]ие офицеры в армии"
 italian_in_the_army_desc:0 "[ITA.GetAdjective]ие офицеры были направлены в нашу армию. Хотя они передают войскам опыт, их присутствие усложняет управление и снижает боевой дух солдат. Так будет продолжаться, пока мы не избавимся от иностранного влияния в армии."
 absolute_ruler:0 "Бесспорное правление"
 absolute_ruler_desc:0 "Отменив конституцию, мы передали всю власть великому королю! Он приведёт страну к славе, процветанию и престижу! Вся ответственность за страну лежит на его плечах."
 ALB_the_kings_army_idea:0 "Королевская армия"
 ALB_the_kings_army_idea_desc:0 "Народ должен мобилизоваться против врагов. Мы докажем миру, что [ALB.GetNameDef] — не повод для насмешек! Мы больше никогда не будем слабы, ведь наша отвага — непобедимое оружие!"
 righteous_ruler:0 "Справедливое правление"
 righteous_ruler_desc:0 "Наш благородный король теперь правит страной с помощью парламента. Его полномочия ограничены, но он всё ещё является главой и символическим правителем [ALB.GetNameDef]. Да благословит Бог Скандербега III!"
 ALB_great_depression:0 "Экономический кризис"
 ALB_great_depression_desc:0 "Великая депрессия, вызвавшая экономический хаос во всём мире, тяжело ударила по [ALB.GetNameDef]. Иностранные инвесторы покинули страну, а погашать займы и управлять государственным бюджетом становилось всё труднее."
 ALB_faith_in_liberty_idea:0 "Вера в свободу"
 ALB_faith_in_liberty_idea_desc:0 "Мы верим в демократию и свободу и будем защищать эти ценности любой ценой. Народ готов отдать жизнь за страну. Мы — земля свободных!"
 balkans_trade:0 "Трансъевропейское торговое соглашение"
 balkans_trade_desc:0 "Благодаря дипломатическим миссиям нам удалось заключить выгодное для страны торговое соглашение. Оно поможет снабжать армию и усилит наше влияние в деловом мире."
 german_alb_trade:0 "[GER.GetAdjective]о-[ALB.GetAdjective]ий торговый пакт"
 german_alb_trade_desc:0 "Экономическое сотрудничество между нашими странами укрепит дружбу и принесёт взаимную выгоду. Торговое соглашение упростит снабжение и организацию войск."
 italian_invasion_incoming_idea:0 "Грядущее [ITA.GetAdjective]ое вторжение"
 italian_invasion_incoming_idea_desc:0 "Наши шпионы и дипломаты в [ITA.GetNameDef] сообщили, что обнаружили план [ITA.GetAdjective]ого верховного командования по вторжению в нашу страну. Если сведения верны, необходимо как можно скорее подготовиться к войне!"
 alb_concessions_to_italy:0 "Компромисс с [ITA.GetNameDef]"
 alb_concessions_to_italy_desc:0 "Мы купили мир с [ITA.GetNameDef] сравнительно высокой ценой, но такова была стоимость нашей независимости."
 albanian_concessions:0 "[ALB.GetAdjective]ие уступки"
 economic_mobilisation:0 "Экономическая мобилизация"
 man_mobilisation:0 "Всеобщая мобилизация"
 economy_overloaded:0 "Перегруженная экономика"
 acknowledgments_of_the_nation:0 "Признательность народа"
 acknowledgments_of_the_nation_desc:0 "Народ [ALB.GetNameDef] одобряет наши действия! Мы спасли жизни бесчисленного множества молодых людей, и теперь люди благодарны нам. Они как никогда привержены ценностям правительства, охотнее вступают в армию и терпимее относятся к нормированию во время войны."
 will_to_fight:0 "Воля к борьбе"
 will_to_fight_desc:0 "Наша страна будет сражаться до конца! Ни шагу назад, только вперёд! Мы не утратим престиж и не унизимся до переговоров с [ITA.GetNameDef]! Мы будем сопротивляться и кусаться!"
 meritocracy_system:0 "Меритократическая система"
 meritocracy_system_desc:0 "Нужно заменить старую систему продвижения по социальному положению системой, основанной на способностях! Нашими армиями должны руководить компетентные люди."
 modern_army:0 "Современная армия"
 modern_army_desc:0 "После всех военных реформ нашу армию наконец можно считать современной, организованной и подготовленной. Правительство и народ должны гордиться новой армией."
 balanced_budget:0 "Сбалансированный бюджет"
 balanced_budget_desc:0 "Сокращение государственных расходов и выравнивание бюджета позволит уменьшить налоги для простых людей и тем самым повысить потребление."
 invite_investors:0 "Пригласить иностранных инвесторов"
 invite_investors_desc:0 "Нам нужны инвесторы, чтобы экономика и предприятия работали должным образом."
 go_with_ita:0 "Расширенная торговля с [ITA.GetNameDef]"
 go_with_fra:0 "Расширенная торговля с [ITA.GetNameDef]"
 no_go_with_ita:0 "Власть государства [ITA.GetNameDefCap] оспорена"
 civ_consommation:0 "Рост гражданского потребления"
 civ_consommation_desc:0 "Рост потребления вызовет подъём предприятий. Тогда мы сможем выйти из экономического кризиса, продолжающегося с 1929 года. Мы приложим все усилия, чтобы граждане покупали больше товаров отечественного производства!"
 ALB_Hekurudha_Shqiptare:0 "Hekurudha Shqiptare"
 ALB_Post_Telegraph:0 "Ministria e Postë-Telegrafë"
 commie_opinion:0 "Коммунистическая дипломатия"
 strategic_opinion:0 "Стратегическая дипломатия"
 britain.92.t:0 "[ALB.GetNameDefCap] желает вступить в Союзники"
 britain.92.d:0 "[ALB.GetAdjective]ие дипломаты направили просьбу о вступлении в Союзники. Как демократическая страна, они хотят вместе с нами выступить против фашистской и коммунистической угрозы. Кроме того, как ведущая демократическая держава, мы обязаны вести других и служить примером демократии."
 albania.1.t:0 "[ITA.GetAdjective]ое дело"
 albania.1.d:0 "Наши шпионы и дипломаты в [ITA.GetNameDef] сообщили, что обнаружили разработанный [ITA.GetAdjective]им верховным командованием план вторжения в нашу страну. [ALB.GetAdjective]ое правительство было потрясено: [ITA.GetAdjective]ие представители и [ALB.GetAdjective]ая сторона долгие годы поддерживали дружеские отношения и тесное военное и экономическое сотрудничество. В нынешнем состоянии у нашей страны лишь небольшой шанс отбить вторжение. Необходимо мобилизоваться и как можно скорее подготовиться к войне!"
 albania.1.a:0 "Будь проклята [ITA.GetNameDef]!"
 albania.2.t:0 "Конференция в Дурресе"
 albania.2.d:0 "[ITA.GetLeader] и [ITA.GetAdjective]ое правительство согласились обсудить договор в [ALB.GetAdjective]ом городе Дуррес. Узнав, что нам стало известно об их плане вторжения, они удивились, но, к счастью, не разгневались.\n\nОни открыли конференцию, выдвинув следующие требования:\nОни хотят получить полный контроль над внешней политикой государства [ALB.GetNameDef].\nТакже они требуют сделать итальянский язык обязательным в [ALB.GetAdjective]их школах.\n\nВ обмен мы сохраняем полный контроль над экономикой, а [ITA.GetNameDef] гарантирует нашу безопасность от внешних врагов. Вероятно, эти условия мягче тех, которые нам навязали бы после внезапного вторжения.\n\nЕсли бы их план удался, почти единственным вариантом стала бы полная аннексия. Как нам поступить?"
 albania.2.a:0 "Принять условия."
 albania.2.b:0 "О подчинении не может быть и речи, но мы можем предложить торговое партнёрство."
 albania.4.t:0 "Выборы председателя Çeta e Pezës"
 albania.4.d:0 "Переворот удался, и теперь мы контролируем правительственную штаб-квартиру. Поначалу главным кандидатом на пост президента Албании был Мюслим Пеза, командующий нашими вооружёнными силами. Однако молодой Ходжа, ещё недавно находившийся в Париже, становится всё популярнее. Его красноречие нельзя недооценивать. Центральная организация партии решила провести выборы и определить, кто будет править страной."
 albania.4.a:0 "Выберем Пезу!"
 albania.4.b:0 "Ходжа лучше!"
 albania.4.c:0 "Старая гвардия Малешовы приведёт нас к победе!"
 albania.5.t:0 "Бункеры Ходжи"
 albania.5.d:0 "Сегодня Ходжа представил коммунистическим лидерам и журналистам довольно неожиданный план: построить бункеры по всей стране. Официально он заявил, что они нужны для защиты от внешних угроз, и предупредил народ об опасности Запада. Однако партийное руководство понимает, что бункеры станут инструментом политической пропаганды. Страх народа позволит контролировать его ещё сильнее. Планируется построить около 173 000 сооружений."
 albania.5.a:0 "Пусть Ходжа защитит нас!"
 albania.5.b:0 "Наша экономика не может позволить себе такие расходы."
 albania.6.t:0 "Конференция иностранных инвесторов"
 albania.6.d:0 "Правительство пригласило инвесторов из разных стран обсудить возможные вложения. Однако представители двух государств не могут договориться о торговле с [ALB.GetNameDef]. [ITA.GetAdjective]ие инвесторы недовольны торговлей [FRA.GetNameDef] с нами и угрожают сократить собственные связи, если мы не прекратим отношения с [FRA.GetNameDef]. Как нам поступить?"
 albania.6.a:0 "Лучше ориентироваться на [ITA.GetNameDef]."
 albania.6.b:0 "Будь проклята [ITA.GetNameDef]! Мы выбираем [FRA.GetNameDef]!"
 albania.7.t:0 "Миланский договор"
 albania.7.d:0 "По итогам переговоров [ALB.GetAdjective]ое правительство и [ITA.GetLeader] решили подписать окончательный договор. Нам удалось избежать войны с [ITA.GetNameDef] дипломатическим путём. Народ благодарен за то, что мы не отправили его на смерть. Мы можем гордиться собой!\n\nПримечание: [ITA.GetNameDefCap] больше не нападёт на [ALB.GetNameDef] через дерево фокусов. Фокус «Оккупация Албании» теперь отключён."
 albania.7.a:0 "Отлично!"
 albania.8.t:0 "Положение [ALB.GetNameDef] в 1936 году"
 albania.8.d:0 "Наше королевство находится далеко не в лучшем положении. Экономический кризис 1929 года едва не разрушил хозяйство и сделал нас зависимыми от [ITA.GetNameDef]. Её влияние всё заметнее в повседневной жизни: финансовые вложения, присутствие в системе образования и политике оказались гораздо значительнее ожидаемого. На фоне роста напряжённости в Европе улучшение экономики и достижение полной независимости от [ITA.GetNameDef] должны стать приоритетами. Не менее важно наладить отношения с соседями, такими как [GRE.GetNameDef] и [YUG.GetNameDef]. Выполнение этих задач и расширение армии превратят нас в ведущую силу Адриатики. Пусть великий лидер укажет путь!"
 albania.8.a:0 "Вперёд!"
 albania.9.t:0 "Голодная забастовка февраля 1936 года"
 albania.9.d:0 "Рабочие и ремесленники Корчи поднялись и начали крупную забастовку. Они осуждают экономическое положение страны и собственную нищету. Если позволить демонстрации продолжаться, движение может распространиться и вызвать всеобщее восстание. Но подавление забастовки способно ударить по нашей репутации и отношениям с другими странами."
 albania.9.a:0 "Прекратить демонстрацию и арестовать лидеров!"
 albania.9.b:0 "Оставить их в покое."
 albania.11.t:0 "Восстание на севере!"
 albania.11.d:0 "Рабочие на севере поднялись, вооружились, разгромили местный гарнизон и захватили северную часть страны! Во главе с Мюслимом Пезой они поставили нас в крайне тяжёлое положение. Не стоило оставлять их в покое."
 albania.11.a:0 "Подготовить войска к бою!"
 albania.12.t:0 "Военные учения с [ITA.GetNameDef]?"
 albania.12.d:0 "Правительство [ITA.GetNameDef] предложило провести совместные военные учения в Неаполе. По их словам, это даст нашим войскам ценный опыт и улучшит дипломатические отношения."
 albania.12.a:0 "Принять предложение."
 albania.12.b:0 "Отклонить предложение."
 albania.13.t:0 "[ALB.GetNameDefCap] желает вступить в Коминтерн"
 albania.13.d:0 "Наши товарищи из Албанской партии труда добились значительного прогресса. [ALB.GetNameDefCap] готова вступить в Коминтерн."
 albania.13.a:0 "Пусть товарищи присоединяются!"
 albania.13.b:0 "Они ещё не готовы."
 albania.14.t:0 "[ALB.GetNameDefCap] просит гарантий"
 albania.14.d:0 "[ALB.GetAdjective]ое правительство, стремясь сохранить независимость в эти тревожные времена, желает углубить отношения между нашими странами и заключить оборонительный договор, который обеспечит неприкосновенность границ государства [ALB.GetNameDef]."
 albania.14.a:0 "[ALB.GetNameDefCap] находится под нашей защитой."
 albania.14.b:0 "Нам неинтересно защищать [ALB.GetNameDef]."
 albania.15.t:0 "Вопрос столицы"
 albania.15.d:0 "Многие в правительстве поднимают вопрос о единой столице. Тирана находится в центре страны, но после объединения Албании и Египта Александрия и Каир доказали, что столь же важны, а возможно, даже важнее Тираны.\n\nНаша страна стоит перед трудным выбором правильного ответа, если он вообще существует."
 albania.15.a:0 "Тирана — наша прежняя и нынешняя столица!"
 albania.15.b:0 "Каир — наш самый населённый город."
 albania.15.c:0 "Пусть будет Александрия!"
 ALB_reintegrate_gjirokaster:0 "Реинтегрировать Гирокастру"
 ALB_reintegrate_gjirokaster_desc:0 "Мы наконец освободили родину из мерзких когтей бывших хозяев! До освобождения наших братьев Гирокастра находилась под оккупацией [GRE.GetNameDef], а местное население подвергалось жестоким репрессиям и искусственной ассимиляции. На устранение последствий оккупации потребуется время, но это необходимо ради общего блага."
