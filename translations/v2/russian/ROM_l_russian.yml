 ROM_improve_the_ground_attack_role_desc:0 ""
 ROM_acquire_new_bombing_sights:0 "Получить новые бомбовые прицелы"
 ROM_acquire_new_bombing_sights_desc:0 ""
 ROM_a_superior_fighter:0 "Превосходный истребитель"
 ROM_a_superior_fighter_desc:0 ""
 ROM_increased_air_research:0 "Расширить авиационные исследования"
 ROM_increased_air_research_desc:0 "Чтобы не отставать в аэрокосмических технологиях, необходимо немедленно направить дополнительные ресурсы на расширение [ROM.GetAdjective]их авиационных исследований!"
