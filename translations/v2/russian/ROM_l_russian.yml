 ROM_break_our_shackles_tt:0 "Государство §Y[ROM.GetNameDefCap]§! провозглашает независимость.\n\nГосударство §Y[ROM.GetNameDefCap]§! объявляет войну государству §Y[SOV.GetNameDefCap]§!\n\nВ каждом регионе, где подготовлена §Yантисоветская ячейка§!, создаётся §Yантисоветский партизанский отряд§!.\n\nВ каждом подготовленном регионе §YУкраины§! повреждаются §Yинфраструктура§!, §Yгражданские фабрики§! и §Yузлы снабжения§!."
 ROM_break_our_shackles_bul_tt:0 "Государство §Y[ROM.GetNameDefCap]§! провозглашает независимость.\n\nГосударство §Y[ROM.GetNameDefCap]§! объявляет войну государству §Y[SOV.GetNameDefCap]§!\n\nВ каждом регионе, где подготовлена §Yантисоветская ячейка§!, создаётся §Yантисоветский партизанский отряд§!.\n\nВ каждом подготовленном регионе §YУкраины§! повреждаются §Yинфраструктура§!, §Yгражданские фабрики§! и §Yузлы снабжения§!.\n\nГосударство §Y[BUL.GetNameDefCap]§! становится владельцем и контролёром §YДобруджи§!"
