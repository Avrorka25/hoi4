 ROM_romanian_naval_forces_modifier_fi_desc:0 "Хотя у нас нет выхода к таким огромным морям, как Атлантика или Средиземное море, румынский флот жизненно важен для защиты побережья от вторжения. Сейчас он находится в плачевном состоянии и нуждается в модернизации, чтобы эффективно действовать на Чёрном море и за его пределами, если возникнет необходимость."
