 r56_rom_marxist_intellectual:0 "Марксистский интеллектуал"
 ROM_tatarescus_regime:0 "Режим Тэтэреску"
 ROM_tatarescus_regime_desc:0 "Георге Тэтэреску и НЛП руководят Румынией с 1933 года, и после Великой депрессии страна демонстрирует устойчивый рост. Но сможет ли он привести Румынию к процветающему будущему, когда приближаются следующие всеобщие выборы?"
 ROM_public_department_buildings:0 "Здания государственных ведомств"
 ROM_public_department_buildings_desc:0 "Нет ничего более раздражающего во взаимодействии с государством, чем неделями ждать ответа на письмо. Открыв специальные учреждения по работе с населением, мы дадим гражданам возможность напрямую обращаться к нужным подразделениям правительства."
 ROM_clamp_down_on_extremism:0 "Подавить экстремизм"
 ROM_clamp_down_on_extremism_desc:0 "Экстремизм — пагубная зараза, разъедающая не только Румынию, но и другие страны. Мы не можем изменить весь мир, зато можем изменить Румынию. Подавив экстремистские организации, призывающие к чудовищным преступлениям и революции, мы обеспечим стране безопасность и процветание!"
 ROM_restrict_freedom_of_press:0 "Ограничить свободу прессы"
 ROM_restrict_freedom_of_press_desc:0 "Стремясь стать оплотом демократии на Балканах, мы, к сожалению, вынуждены принимать некоторые неприятные меры. Ограничив свободу прессы, мы лишим тех, кто хочет ввергнуть Румынию в хаос, ещё одной площадки для распространения своих взглядов."
 ROM_finalize_the_tax_reforms:0 "Завершить налоговые реформы"
 ROM_finalize_the_tax_reforms_desc:0 "Румынская налоговая система начинает заметно отставать от систем других европейских стран. Чтобы правительство могло эффективно работать и обеспечивать растущее население, предложенные налоговые реформы необходимо завершить и ввести в действие."
 ROM_enforce_the_tariffs:0 "Ввести таможенные тарифы"
 ROM_enforce_the_tariffs_desc:0 "Чтобы стимулировать местную экономику, необходимо ввести выборочные тарифы, побуждающие компании инвестировать внутри страны и закупать отечественное сырьё вместо импорта."
 ROM_privatize_state_owned_enterprises:0 "Приватизировать государственные предприятия"
 ROM_privatize_state_owned_enterprises_desc:0 "Правительство владеет несколькими предприятиями, которые работали бы эффективнее после приватизации и продажи румынским инвесторам. Это не только создаст рабочие места и ускорит рост, но и позволит направить дополнительные средства на государственные программы."
 ROM_public_works_programs:0 "Программы общественных работ"
 ROM_public_works_programs_desc:0 "Средства, полученные благодаря налоговым реформам, тарифам и продаже отдельных предприятий, теперь можно направить на благо народа Румынии."
 ROM_a_flawed_democracy:0 "Несовершенная демократия"
 ROM_a_flawed_democracy_desc:0 "Пусть некоторые наши шаги кажутся недемократичными, мы обязаны поступать так, как лучше для страны и её народа. Небольшое ограничение отдельных прав — справедливая цена за сохранение свободы в целом."
 ROM_the_general_election:0 "Всеобщие выборы"
 ROM_the_general_election_desc:0 "Выборы приближаются, и будущее Румынии вновь поставлено на карту. Интриги других партий могут угрожать безопасности королевства, и ради будущего страны королю, возможно, придётся вмешаться."
 ROM_hold_emergency_election:0 "Провести досрочные выборы"
 ROM_hold_emergency_election_desc:0 "С каждым днём становится всё очевиднее, что некоторые партии не намерены уважать честность предстоящих выборов. Проведя их досрочно, мы сможем избежать подобных манипуляций и позволить демократии работать как положено."
 ROM_dissolve_the_parliament:0 "Распустить парламент"
 ROM_dissolve_the_parliament_desc:0 "Поскольку выборы не выявили явного победителя, король Кароль II публично объявил о роспуске парламента, чтобы перестроить его и обеспечить торжество демократии. Как именно будут развиваться события, покажет лишь время."
 ROM_enforce_royal_dictatorship:0 "Установить королевскую диктатуру"
 ROM_enforce_royal_dictatorship_desc:0 "Королю стало известно, что фашистская Железная гвардия собирается выйти из выборов, обеспечив большинство столь же экстремистской НХП. Поэтому король решил полностью взять правительство под контроль и предоставить себе чрезвычайные полномочия для стабилизации страны."
 ROM_preservation_of_greater_romania:0 "Сохранение Великой Румынии"
 ROM_preservation_of_greater_romania_desc:0 "Сохранение Великой Румынии теперь является нашей первостепенной задачей. Советский Союз угрожающе шевелится на востоке, а Германский рейх начинает показывать когти. Если начнётся война, Румыния должна отразить любое вторжение!"
 ROM_constitutional_reform:0 "Конституционная реформа"
 ROM_constitutional_reform_desc:0 "Король Кароль подготовил новую конституцию, которая юридически закрепит его право продолжать вести страну к новой эпохе процветания при поддержке нового правительства."
 ROM_build_the_carol_line:0 "Построить линию Кароля"
 ROM_build_the_carol_line_desc:0 "Протяжённые границы Румынии крайне плохо защищены. Взяв пример с французов, мы создадим собственную оборонительную линию, способную оградить страну от агрессоров."
 ROM_r56_german_romanian_trade_agreement:0 "Германо-румынское торговое соглашение"
 ROM_r56_german_romanian_trade_agreement_desc:0 "Подписав торговое соглашение с Германией, мы обеспечим себе надёжного партнёра и сможем ещё сильнее ускорить экономический рост."
 ROM_western_diplomacy:0 "Западная дипломатия"
 ROM_western_diplomacy_desc:0 "Хорошие отношения с Западом помогли Румынии закрепиться на Балканах в качестве региональной великой державы. Однако рядом находится русский медведь, жадно и мстительно поглядывающий на наши восточные земли. Официальная британская гарантия могла бы остудить эту жажду реванша."
 ROM_the_german_four_year_plan:0 "Германский четырёхлетний план"
 ROM_the_german_four_year_plan_desc:0 "Германия предложила нам четырёхлетний план, который, по её словам, обеспечит экономический рост и процветание румынского народа. Но чем внимательнее мы его изучаем, тем очевиднее становится, что он поставит нашу экономику в зависимость от Германии."
 ROM_invite_german_military_advisors:0 "Пригласить германских военных советников"
 ROM_invite_german_military_advisors_desc:0 "Германская армия является одной из лучших, если не лучшей, в мире, тогда как наша начинает устаревать. Пригласив немецких советников, мы получим свежий взгляд на проблемы вооружённых сил."
 ROM_anti_communist_measures:0 "Антикоммунистические меры"
 ROM_anti_communist_measures_desc:0 "Несмотря на наше отношение к коммунизму, угроза насильственной революции никуда не исчезла. Необходимо принять дополнительные меры, чтобы коммунисты не закрепились в Румынии."
 ROM_strengthen_the_sentinels:0 "Укрепить Стражей"
 ROM_strengthen_the_sentinels_desc:0 "Укрепив Стражей — личный проект Кароля по противодействию влиянию Железной гвардии на румынскую молодёжь, — мы расширим круг людей, готовых вступить в вооружённые силы и служить великому делу защиты Румынии."
 ROM_subvert_fascism_in_romania:0 "Подорвать фашизм в Румынии"
 ROM_subvert_fascism_in_romania_desc:0 "Мы должны продолжать борьбу с фашистским влиянием, скрывающимся за каждым углом. Будь оно итальянским, германским или даже румынским, его необходимо держать на расстоянии ради защиты основных ценностей страны."
 ROM_the_royal_guard:0 "Королевская гвардия"
 ROM_the_royal_guard_desc:0 "Королевская гвардия состоит из лучших солдат Румынии, поклявшихся защищать короля и каждую пядь румынской земли ценой собственной жизни."
 ROM_axis_membership:0 "Членство в Оси"
 ROM_axis_membership_desc:0 "Очевидно, нынешний режим не способен и не желает защищать собственно Румынию. Пришло время перемен. Союз с Германией обеспечит безопасность страны, а после победы в войне позволит вернуть ей законное величие."
 ROM_purchase_german_designs_and_equipment:0 "Закупить германские проекты и снаряжение"
 ROM_purchase_german_designs_and_equipment_desc:0 "Покупка проверенных проектов и оборудования даст вооружённым силам подходящие средства. Мы также сможем использовать германские исследования как основу для собственных и не повторять уже совершённые ими ошибки."
 ROM_joint_german_oil_exploitation:0 "Совместная германская нефтедобыча"
 ROM_joint_german_oil_exploitation_desc:0 "Наши нефтяные месторождения являются одними из крупнейших в Европе и крупнейшими за пределами коммунистических стран. С германской помощью мы сможем использовать их потенциал в полной мере."
 ROM_prepare_the_eastern_front:0 "Подготовить Восточный фронт"
 ROM_prepare_the_eastern_front_desc:0 "Очевидно, Германия готовит вторжение на восток, и мы должны быть готовы. Подготовив логистику и аэродромы, мы поможем наступлению на Москву и вернём утраченные земли."
 ROM_claims_in_the_east:0 "Претензии на востоке"
 ROM_claims_in_the_east_desc:0 "После потери Северной Трансильвании в пользу Венгрии мы должны доказать Германии, что достойны земель, которые принадлежат нам по праву."
 ROM_the_transnistrian_exchange:0 "Транснистрийский обмен"
 ROM_the_transnistrian_exchange_desc:0 "Новые восточные территории можно обменять с Германией. Она получит контроль над Транснистрией, а взамен потребует вернуть нам Трансильванию."
 ROM_royal_coup:0 "Королевский переворот"
 ROM_royal_coup_desc:0 "Поначалу союз с Германией казался хорошим планом, но теперь ход войны меняется, и мы должны обеспечить выживание Румынии. Делегация отправится в Стокгольм для переговоров с русскими и представит предложение, выгоду которого они, надеемся, признают."
 ROM_push_across_the_tisza_river:0 "Форсировать Тису"
 ROM_push_across_the_tisza_river_desc:0 "Пришло время вернуть утраченное. Сначала мы освободим Трансильванию, а затем прорвёмся к стенам Будапешта и ударим по Германии с юга!"
 ROM_the_percentage_question:0 "Вопрос о процентах"
 ROM_the_percentage_question_desc:0 "Пусть мы начали войну как враги, но, осознав ошибочность своего пути, сбросили фашистские оковы и помогли завершить конфликт. Почему же нас должны считать проигравшими, если мы сражались рядом с победителями?"
 ROM_the_romanian_peoples_republic:0 "Румынская Народная Республика"
 ROM_the_romanian_peoples_republic_desc:0 "Старое королевство пало, и после второй Великой войны мы освободились от оков капиталистической алчности и монархизма. Теперь Румынская Народная Республика будет гордо стоять рядом с Москвой, создавая новую Европу!"
 ROM_reconfigure_the_government:0 "Переустроить правительство"
 ROM_reconfigure_the_government_desc:0 "С новым рассветом приходит и новое правительство. Сбросив старые оковы, мы обрели свободу. Рабочие, ликуйте!"
 ROM_the_tilea_affair:0 "Дело Тилеа"
 ROM_the_tilea_affair_desc:0 "Ни для кого не секрет, что Германия планирует вторжение в Румынию через Венгрию. Мы должны обратиться к Британии с просьбой заключить официальный союз между нашими странами!"
 ROM_the_peace_front:0 "Фронт мира"
 ROM_the_peace_front_desc:0 "Создав Фронт мира, мы выступим против Германии и её воинственных союзников. Каждый наш шаг будет сделан во имя свободы и процветания!"
 ROM_allies_membership:0 "Членство в Союзниках"
 ROM_allies_membership_desc:0 "Вступив в Союзники, мы обеспечим демократии постоянный плацдарм на Балканах и сможем свергнуть любое тираническое правительство, которое осмелится нам противостоять."
 ROM_the_tisza_plan:0 "План Тисы"
 ROM_the_tisza_plan_desc:0 "Первые проекты после Великой войны предусматривали расширение Румынии до реки Тисы, но этого так и не произошло. Теперь мы можем исправить положение, заранее устранив возможность германо-венгерского союза."
 ROM_protect_yugoslavia:0 "Защитить Югославию"
 ROM_protect_yugoslavia_desc:0 "Германия и Италия положили глаз на Югославию, и мы обязаны вмешаться, ведь именно мы являемся защитниками Балкан."
 peace_front:0 "Фронт мира"
 ROM_anti_italian_aid_in_albania:0 "Антиитальянская помощь Албании"
 ROM_anti_italian_aid_in_albania_desc:0 "Королевство Албания уже практически превратилось в итальянскую марионетку. Гарантировав защиту королю Зогу и его правительству, мы, возможно, предотвратим полную аннексию страны."
 ROM_handle_bulgaria:0 "Разобраться с Болгарией"
 ROM_handle_bulgaria_desc:0 "Болгария претендует на значительную часть Балкан, несмотря на поражение в Великой войне. Следует напомнить ей о месте в регионе и не позволить развязать ещё одну Балканскую войну."
 ROM_safeguard_the_greeks:0 "Защитить греков"
 ROM_safeguard_the_greeks_desc:0 "Мы снова должны стать занозой в боку Италии. Защитив Грецию, мы продолжим мешать итальянским колониальным амбициям."
 ROM_coerce_the_turks:0 "Принудить Турцию"
 ROM_coerce_the_turks_desc:0 "Убедив турок вступить в союз против растущего экстремизма в Европе, мы получим союзника, уже побеждавшего превосходящие силы. Вместе с Турцией мы не позволим Балканам пасть перед фашизмом или коммунизмом!"
 ROM_romanias_final_stand:0 "Последний рубеж Румынии"
 ROM_romanias_final_stand_desc:0 "Наше мирное предложение отвергнуто. Нам остаётся сражаться до конца и надеяться, что враг будет отброшен."
 ROM_the_carpathian_trap:0 "Карпатская ловушка"
 ROM_the_carpathian_trap_desc:0 "Нельзя позволить врагу перейти Карпатские горы."
 ROM_dominate_the_black_sea:0 "Господствовать на Чёрном море"
 ROM_dominate_the_black_sea_desc:0 "Контроля над значительной частью побережья недостаточно. Мы должны обеспечить полное господство на самом Чёрном море."
 ROM_crush_the_fatherland_front:0 "Сокрушить Отечественный фронт"
 ROM_crush_the_fatherland_front_desc:0 "Болгарский Отечественный фронт захватил власть и теперь угрожает нашему южному флангу."
 ROM_the_new_greater_romania:0 "Новая Великая Румыния"
 ROM_the_new_greater_romania_desc:0 "Мир наконец наступил. Пришло время восстановить разрушенное войной и подготовиться к светлому будущему."
 ROM_the_capital_of_the_balkans:0 "Столица Балкан"
 ROM_the_capital_of_the_balkans_desc:0 "Наше региональное лидерство позволило Бухаресту стать ещё более влиятельным центром Балкан."
 ROM_strengthen_the_balkan_pact:0 "Укрепить Балканский пакт"
 ROM_strengthen_the_balkan_pact_desc:0 "Балканский пакт был подписан в феврале 1934 года Грецией, Турцией, Югославией и Румынией. Он был призван сохранять геополитический статус-кво, но ухудшение международной обстановки требует усилить обязательства его участников."
 ROM_preempt_the_bulgarian_threat:0 "Предупредить болгарскую угрозу"
 ROM_preempt_the_bulgarian_threat_desc:0 "Болгария ввергала регион в войну в 1913 и 1915 годах. Угроза болгарского ирредентизма сохраняется, и нельзя позволить ей перевооружиться и вновь напасть на нас."
 ROM_invite_bulgaria_to_the_pact:0 "Пригласить Болгарию в пакт"
 ROM_invite_bulgaria_to_the_pact_desc:0 "Хотя пакт явно окружает Болгарию, её всё же можно превратить в союзника при условии отказа от претензий на наши земли."
 ROM_formalize_the_balkan_entente:0 "Оформить Балканскую Антанту"
 ROM_formalize_the_balkan_entente_desc:0 "Расплывчатые обещания сохранять статус-кво выглядят всё слабее на фоне сгущающихся над Европой туч. Если мы хотим отвечать за собственную оборону, пакт необходимо превратить в настоящий союз с механизмами взаимной защиты."
 balkan_entente:0 "Балканская Антанта"
 ROM_invite_albania:0 "Пригласить Албанию"
 ROM_invite_albania_desc:0 "Албания также является частью Балканского полуострова и должна присоединиться к нам, чтобы обеспечить территориальную непрерывность."
 ROM_balkan_research_institute:0 "Балканский исследовательский институт"
 ROM_balkan_research_institute_desc:0 "Совместная работа лучших умов наших стран принесёт пользу всем."
 ROM_deal_with_the_hungarians:0 "Разобраться с венграми"
 ROM_deal_with_the_hungarians_desc:0 "Венгерский ирредентизм угрожает нашей территориальной целостности, поскольку Венгрия стремится вернуть Ардял. Ради безопасности страны этому необходимо помешать любой ценой."
 ROM_invite_ukraine_to_the_entente:0 "Пригласить Украину в Антанту"
 ROM_invite_ukraine_to_the_entente_desc:0 "Украинцы разделяют наше мнение о необходимости предотвратить возобновление [SOV.getAdjective]ой экспансии. Хотя Украина не относится непосредственно к Балканам, она может стать крайне ценным союзником."
 ROM_oppose_the_royal_dictatorship:0 "Противостоять королевской диктатуре"
 ROM_oppose_the_royal_dictatorship_desc:0 "Чтобы обеспечить Румынии настоящую свободу, мы должны всеми силами противостоять королевской диктатуре, которую пытаются установить покорные престолу силы. Каждый день во имя безопасности у нас отнимают свободы, но теперь этому придёт конец."
 ROM_the_iron_guard:0 "Железная гвардия"
 ROM_the_iron_guard_desc:0 "Единственная сила, способная оказать серьёзное сопротивление диктаторской монархии, — Железная гвардия. Кодряну был важным и громким участником оппозиции престолу, и теперь мы должны сплотиться вокруг него, чтобы сохранить свободы румын!"
 ROM_initial_political_reforms:0 "Первые политические реформы"
 ROM_initial_political_reforms_desc:0 "Победа Железной гвардии на выборах позволяет провести первые политические реформы, которые отдалят страну от угрозы монархического переворота и приблизят её к устройству других республик. Государство должно принадлежать народу и служить народу."
 ROM_total_ban_on_communism:0 "Полный запрет коммунизма"
 ROM_total_ban_on_communism_desc:0 "Одним из первых шагов к внутренней стабильности должно стать жёсткое подавление коммунистических крыс, скрывающихся в тени и угрожающих ввергнуть Румынию в разруху. Полностью запретив любую коммунистическую деятельность, мы обеспечим желанные стабильность и процветание!"
 ROM_crack_down_on_anti_legionary_activity:0 "Подавить антилегионерскую деятельность"
 ROM_crack_down_on_anti_legionary_activity_desc:0 "После победы Железной гвардии на выборах антилегионерская деятельность заметно усилилась. Она угрожает самой стабильности Румынии и, если оставить её без внимания, может даже привести к попытке коммунистического переворота. Поэтому подобную деятельность необходимо сокрушить."
 ROM_seize_royal_assets:0 "Конфисковать королевское имущество"
 ROM_seize_royal_assets_desc:0 "В жизни есть две истины: все смертны, а королевские семьи всегда присваивают богатства собственного народа. Конфисковав имущество бывшей династии, мы сможем финансировать будущие промышленные проекты и вернуть румынскому народу деньги, которые у него отняла монархия."
 ROM_exile_or_execution:0 "Изгнание или казнь"
 ROM_exile_or_execution_desc:0 "Стало ясно, что королевская семья пустила слишком глубокие корни и заручилась верными сторонниками, готовыми служить ей до смерти. Поэтому мы предложим компромисс: либо династия покинет Румынию, оставив богатства здесь, либо её представители лично ответят перед Богом."
 ROM_romanian_autarky:0 "Румынская автаркия"
 ROM_romanian_autarky_desc:0 "Сосредоточившись на ресурсах, которые можно производить внутри страны, мы приблизимся к автаркии. Тогда наша экономика перестанет зависеть от доброй воли других держав, сможет стоять на собственных ногах, а торговля станет лишь дополнением, а не её основой."
 ROM_seize_foreign_companies:0 "Конфисковать иностранные компании"
 ROM_seize_foreign_companies_desc:0 "После Великой войны многие компании пришли в Румынию, рассчитывая строить фабрики и эксплуатировать местное население. Конфисковав эти предприятия, мы сохраним получаемую ими прибыль внутри страны и не позволим ей утекать в Вашингтон, Париж или Лондон."
 ROM_nationalized_industrial_complex:0 "Национализированный промышленный комплекс"
 ROM_nationalized_industrial_complex_desc:0 "Национализация промышленного комплекса позволит максимально сократить цепочки поставок для новых строительных проектов и тем самым ускорить создание новых отраслей."
 ROM_militarized_industry:0 "Милитаризованная промышленность"
 ROM_militarized_industry_desc:0 "Развивая промышленность с учётом гибкости, мы обеспечим возможность быстро перепрофилировать любую фабрику, независимо от её первоначального назначения, в военное предприятие. Будь то боеприпасы, грузовики, винтовки или снаряды, каждая фабрика Румынии должна уметь перейти на военное производство в считаные минуты."
 ROM_simas_ascendancy:0 "Возвышение Симы"
 ROM_simas_ascendancy_desc:0 "При жизни Кодряну Хория Сима был его правой рукой. Теперь, после трагической гибели лидера, Сима должен возглавить Железную гвардию и повести партию и Румынию к славе!"
 ROM_expand_the_iron_guard:0 "Расширить Железную гвардию"
 ROM_expand_the_iron_guard_desc:0 "Железная гвардия была опорой партии, сыграла ключевую роль в подавлении антилегионерской деятельности в Трансильвании и помогла освободиться от угнетающей монархии, цеплявшейся за страну словно паразит. Расширяя её ряды, мы не только усилим вооружённые силы, но и обеспечим Румынии возможность защититься от иностранной агрессии!"
 ROM_service_abroad:0 "Служба за рубежом"
 ROM_service_abroad_desc:0 "Каждый мужчина имеет право сражаться за то, во что верит. Мы не должны мешать тем, кто желает отправиться за границу и защищать близкое ему дело."
 ROM_intervention_in_spain:0 "Интервенция в Испанию"
 ROM_intervention_in_spain_desc:0 "Гражданская война в Испании — одно из важнейших событий современности. Отправив официальных добровольцев, мы сможем извлечь ценные уроки и помочь дружественному режиму победить в этом конфликте!"
 ROM_military_law_enforcement:0 "Военные силы правопорядка"
 ROM_military_law_enforcement_desc:0 "Некоторые преступления и общественные угрозы выходят за пределы возможностей местной полиции. Специализированные военные подразделения смогут усилить правоохранительные органы или при необходимости полностью их заменить."
 ROM_alliance_with_the_germans:0 "Союз с немцами"
 ROM_alliance_with_the_germans_desc:0 "В последние годы Германия сыграла важную роль в румынской экономике и нашем приходе к власти. Теперь пора занять место рядом с ней, перекроить границы Европы и обеспечить долгосрочные мир и стабильность!"
 bucharest_pact:0 "Бухарестский пакт"
 ROM_alliance_with_the_italians:0 "Союз с итальянцами"
 ROM_alliance_with_the_italians_desc:0 "У нас много общего с итальянцами, и в прошлом они уже доказали, что могут быть ценными союзниками. Сблизившись с ними, мы сможем перестроить Южную Европу так, чтобы созданный порядок просуществовал тысячелетия!"
 ROM_divide_the_czechs:0 "Разделить чехов"
 ROM_divide_the_czechs_desc:0 "Объединение чехов и словаков на нашем Севере было жизненно важным союзником после Великой войны, однако нам стало ясно, что они наиболее вероятно подвергнутся нападению поляков и венгров. Таким образом, мы должны вмешаться и обеспечить, чтобы у чехов и словаков была родина для защиты."
 ROM_carve_up_yugo:0 "Разделить Югославию"
 ROM_carve_up_yugo_desc:0 "Создание Югославии было ошибкой, и лицемеры в Лондоне с паразитами в Париже это знают. Вместе с Италией мы перекроим Югославию и не позволим балканской пороховой бочке взорваться, заставив её постепенно угаснуть."
 ROM_demand_hungarian_submission:0 "Потребовать подчинения Венгрии"
 ROM_demand_hungarian_submission_desc:0 "Венгры и австрийцы развязали Великую войну, а теперь Венгрия вновь готовится ввергнуть Европу в хаос. Мы обязаны не допустить этого. У неё два выбора: преклонить колено или столкнуться с вторжением."
 ROM_invite_the_hungarians:0 "Пригласить венгров"
 ROM_invite_the_hungarians_desc:0 "Несмотря на прежние разногласия, ради предотвращения новой европейской войны мы должны оставить их в прошлом. Союз с Венгрией укрепит стабильность Восточной Европы и поможет вместе сдерживать даже Советы."
 balkan_sphere:0 "Балканская сфера"
 ROM_protect_our_eastern_front:0 "Защитить восточный фронт"
 ROM_protect_our_eastern_front_desc:0 "Ни для кого не секрет, что Советский Союз претендует на земли, освобождённые нами у умирающей Российской империи. Бессарабия всё чаще становится предметом споров, и мы обязаны обеспечить безопасность каждого живущего там румына, если русский медведь пробудится."
 ROM_spread_latin_influence_south:0 "Распространить латинское влияние на юг"
 ROM_spread_latin_influence_south_desc:0 "К югу от нас лежит Болгария — славянская страна с латинским меньшинством. Как защитники латинских народов Балкан, мы обязаны гарантировать их безопасность."
 ROM_align_greece:0 "Сблизиться с Грецией"
 ROM_align_greece_desc:0 "В прошлом греки были надёжными союзниками Румынии: во время Великой войны помогали сдерживать Османскую империю, а в Балканских войнах показали себя умелыми бойцами. Следует убедить их правительство теснее сотрудничать с нами, чтобы обрести ещё одного союзника, способного укрепить стабильность Балкан."
 ROM_align_turkey:0 "Сблизиться с Турцией"
 ROM_align_turkey_desc:0 "Хотя в Великую войну мы сражались против турок, они стали важным партнёром в сдерживании Болгарии. Их победа над британцами и французами также доказала боеспособность страны. Следует согласовать цели и вновь оказаться на одной — и правильной — стороне истории."
 ROM_codreanus_iron_guard:0 "Железная гвардия Кодряну"
 ROM_codreanus_iron_guard_desc:0 "Теперь, когда Румыния сбросила оковы монархии, Кодряну свободен вести страну к славному будущему. Объединённые общей целью и верой в Бога, мы под его руководством достигнем величия!"
 ROM_christian_education_centers:0 "Христианские образовательные центры"
 ROM_christian_education_centers_desc:0 "Чтобы бороться с неграмотностью, атеизмом и коммунизмом, мы откроем по всей Румынии христианские образовательные центры, которые будут преподавать Слово Божье и укреплять христианство среди населения!"
 ROM_ratify_traditional_gender_roles:0 "Закрепить традиционные гендерные роли"
 ROM_ratify_traditional_gender_roles_desc:0 "После борьбы с монархией необходимо вернуть общество к правильному устройству прошлого. Закрепив традиционные роли, мы дадим каждому ясное понимание обязанностей и целей."
 ROM_solidify_church_presence:0 "Укрепить влияние церкви"
 ROM_solidify_church_presence_desc:0 "Слишком долго церковь занимала второстепенное место в повседневной жизни простых румын. Необходимо исправить это упущение и вновь сделать её неотъемлемой частью общества."
 ROM_the_seat_of_balkan_orthodoxy:0 "Центр балканского православия"
 ROM_the_seat_of_balkan_orthodoxy_desc:0 "Нынешний центр православия находится в Москве, в самом сердце Советского Союза. Мы должны взять на себя роль центра Православной церкви на Балканах — там, где коммунизм не процветает, а искоренён!"
 ROM_establish_the_legion:0 "Учредить Легион"
 ROM_establish_the_legion_desc:0 "Создав Легион Архангела Михаила, мы сможем противостоять неверующим и тем, кто отвернулся от Божьей благодати. Вместе мы станем оплотом против гедонизма, атеизма и коммунизма!"
 legion_of_the_archangel_mihail:0 "Легион Архангела Михаила"
 ROM_crack_down_on_communism:0 "Подавить коммунизм"
 ROM_crack_down_on_communism_desc:0 "Каждая коммунистическая страна Европы должна ясно понимать нашу позицию: никаких дружественных отношений, никакого товарищества и никакой помощи тем, кто отвернулся от Бога!"
 ROM_restore_the_bulgarian_patriarchate:0 "Восстановить Болгарский патриархат"
 ROM_restore_the_bulgarian_patriarchate_desc:0 "Болгарский патриархат пал, и наш долг — восстановить его! Грязные руки коммунистов угрожают святыням Болгарии, и мы должны вмешаться, пока всё не уничтожено!"
 ROM_intervene_in_greece:0 "Вмешаться в Грецию"
 ROM_intervene_in_greece_desc:0 "После падения Греции под власть коммунизма обязанность восстановить там порядок ложится на нас. Мы должны сохранить святость церкви и, возможно, помочь греческому народу вновь обрести искупление в Божьей благодати!"
 ROM_yugoslav_intervention:0 "Интервенция в Югославию"
 ROM_yugoslav_intervention_desc:0 "Югославия, к сожалению, пала под власть коммунизма, и мы обязаны исправить положение! Это угрожает стабильности Балкан, а вскоре в её границах наверняка начнутся гонения на христиан. Ради их безопасности и веры мы должны действовать!"
 ROM_reclaim_the_mother_church:0 "Вернуть Материнскую церковь"
 ROM_reclaim_the_mother_church_desc:0 "Материнская церковь в Стамбуле, бывшем Константинополе, находится под угрозой со стороны турецких атеистов, мусульман и коммунистов. Чтобы защитить одну из святейших святынь города, мы обязаны выступить от имени христиан Турции!"
 ROM_the_holy_land:0 "Святая земля"
 ROM_the_holy_land_desc:0 "Иерусалим сейчас оккупирован подмандатной Палестиной — государственным образованием, созданным империалистами Лондона и Парижа. Мы должны исправить это и передать город под контроль Православной церкви!"
 ROM_seize_the_vatican:0 "Захватить Ватикан"
 ROM_seize_the_vatican_desc:0 "Ватикан находится в самом сердце Рима. Так называемый раскол разделил христианство и заставил единоверцев враждовать друг с другом. Чтобы вера пережила грядущие времена, мы должны захватить город и вновь объединить христианство!"
 ROM_deadlock_in_election:0 "Избирательный тупик"
 ROM_deadlock_in_election_desc:0 "Мы надеялись на ясный результат, но выборы завершились тупиком: ни одна партия не способна сформировать правительство самостоятельно, и никто не желает сотрудничать. Тем временем распространяются слухи о готовящейся революции..."
 ROM_contacts_in_moscow:0 "Связи в Москве"
 ROM_contacts_in_moscow_desc:0 "Чтобы свергнуть коррумпированный, самодовольный и отживший режим, нам необходима иностранная поддержка. Обратившись к связям в Москве, мы сможем наладить поставки снаряжения и материалов для грядущей революции!"
 ROM_form_a_coalition:0 "Сформировать коалицию"
 ROM_form_a_coalition_desc:0 "Если слухи о готовящейся революции правдивы, мы должны подготовиться. Нельзя позволить застать нас врасплох. Связавшись с ключевыми представителями оппозиции, мы создадим широкую коалицию, способную защитить Румынию от надвигающейся волны красного предательства!"
 ROM_seek_western_support:0 "Искать поддержку Запада"
 ROM_seek_western_support_desc:0 "Обратившись к бывшим союзникам и другим странам, осознающим угрозу коммунизма, мы сможем не остаться в одиночестве перед лицом революционеров."
 ROM_concessions_to_the_right:0 "Уступки правым"
 ROM_concessions_to_the_right_desc:0 "Хотя милитаристы вроде Железной гвардии ничем не лучше коммунистов, красных они ненавидят ещё сильнее, чем нас. Незначительные уступки позволят получить доступ к части их оружия на случай революции."
 ROM_recruit_the_iron_guard:0 "Привлечь Железную гвардию"
 ROM_recruit_the_iron_guard_desc:0 "Железная гвардия обладает большим опытом борьбы с коммунистами. Нам не следует стыдиться использования её знаний в приближающемся противостоянии."
 ROM_request_balkan_aid:0 "Запросить помощь Балкан"
 ROM_request_balkan_aid_desc:0 "Обратившись к соседним балканским странам, мы, надеемся, получим материальную помощь от тех, кто также противостоит красной угрозе."
 ROM_secure_the_home_front:0 "Обезопасить тыл"
 ROM_secure_the_home_front_desc:0 "Создав тайное ведомство, мы сможем узнавать о планах революционеров раньше, чем они начнут действовать. Нельзя ждать их удара неподготовленными — мы должны быть готовы ответить!"
 ROM_ensure_eastern_loyalties:0 "Обеспечить верность восточных регионов"
 ROM_ensure_eastern_loyalties_desc:0 "Восточные регионы Румынии долго оставались без внимания бухарестского правительства, сосредоточенного на завоёванной Трансильвании. Договорившись с влиятельными местными лидерами и пообещав им процветающее будущее, мы сможем привлечь их на свою сторону в грядущем конфликте."
 ROM_peasant_militias:0 "Крестьянские ополчения"
 ROM_peasant_militias_desc:0 "Каждый человек способен изменить будущее, осознаёт он это или нет. Если крестьянин продолжает работать на угнетающий режим, он становится солдатом его военной машины. Но если он скажет «довольно» и вместе с товарищами возьмётся за оружие против угнетателей, он станет революционером."
 ROM_contact_the_unions:0 "Связаться с профсоюзами"
 ROM_contact_the_unions_desc:0 "Румынские профсоюзы были в основном подавлены или ослаблены до состояния жалкой пародии. Но это не значит, что они не хотят изменить положение. Наладив с ними отношения, мы сможем доставить в страну больше оружия для революции ещё до того, как вспыхнет искра!"
 ROM_soviet_military_expertise:0 "Советский военный опыт"
 ROM_soviet_military_expertise_desc:0 "Советские добровольцы, готовые поддержать новую пролетарскую революцию, значительно усилят наше справедливое дело."
 ROM_the_romanian_communist_party:0 "Румынская коммунистическая партия"
 ROM_the_romanian_communist_party_desc:0 "Как авангард рабочей революции, партия обязана защитить диктатуру пролетариата от контрреволюционных буржуазных элементов."
 ROM_the_romanian_civil_war:0 "Гражданская война в Румынии"
 ROM_the_romanian_civil_war_desc:0 "Народ слишком долго угнетали феодальные и буржуазные плутократы. Пришло время действовать и возглавить освобождение народа."
 ROM_preempt_counter_revolution:0 "Предупредить контрреволюцию"
 ROM_preempt_counter_revolution_desc:0 "Остатки враждебных реакционных сил разбиты, но ещё не уничтожены полностью. Они по-прежнему действуют и стремятся вернуть себе власть, чтобы вновь угнетать рабочих."
 ROM_collectivized_farming_programs:0 "Программы коллективизации сельского хозяйства"
 ROM_collectivized_farming_programs_desc:0 "Землевладельцы веками эксплуатировали безземельных арендаторов, заставляя их выполнять самый тяжёлый труд. Коллективизация земли обеспечит каждому справедливую долю и позволит работать сообща ради общего блага."
 ROM_soviet_influenced_industry:0 "Промышленность под советским влиянием"
 ROM_soviet_influenced_industry_desc:0 "СССР сумел быстро провести индустриализацию благодаря полной мобилизации ресурсов страны на развитие тяжёлой промышленности. Он показал нам путь прогресса и будущее, которое действительно работает."
 ROM_empower_the_securitate:0 "Расширить полномочия Секуритате"
 ROM_empower_the_securitate_desc:0 "К сожалению, реакционное мышление сохраняется в умах и действиях некоторых враждебных революции элементов общества. Их необходимо найти и перевоспитать либо устранить более радикальными средствами."
 ROM_the_great_trial_of_year:0 "Великий процесс [GetYear] года"
 ROM_the_great_trial_of_year_desc:0 "Политбюро Румынской коммунистической партии установило, что некоторые её члены подрывают наши идеологические обязательства. Они не только поставили под сомнение партийную линию, но и осудили демократический централизм. Мы обязаны осудить виновных и обеспечить соблюдение доктрины демократического централизма, быстро нейтрализовав подрывные элементы."
 ROM_challenge_moscow:0 "Бросить вызов Москве"
 ROM_challenge_moscow_desc:0 "Московские бюрократы захватили аппарат Коммунистического интернационала и увели революционных левых с правильного пути. Мы должны восстановить истинное направление и вернуть надежду рабочим всего мира."
 ROM_subvert_moscow_authority:0 "Подорвать власть Москвы"
 ROM_subvert_moscow_authority_desc:0 "Прежде чем открыто объявлять о намерениях, следует ослабить советское влияние и подготовить почву для идеологического исправления."
 ROM_prepare_anti_soviet_cells:0 "Подготовить антисоветские ячейки"
 ROM_prepare_anti_soviet_cells_desc:0 "Революционные группы должны уметь действовать самостоятельно. С идеологической точки зрения Советы хуже буржуазии, поскольку вводят пролетариат в заблуждение."
 ROM_reestablish_foreign_connections:0 "Восстановить зарубежные связи"
 ROM_reestablish_foreign_connections_desc:0 "Другие представители коммунистической оппозиции по всему миру, вероятно, готовы помочь нам."
 ROM_break_our_shackles:0 "Разорвать оковы"
 ROM_break_our_shackles_desc:0 "Пришло время восстановить правильное понимание марксизма и вернуть народу революционный дух."
 ROM_establish_the_upla:0 "Создать У.Н.О.А."
 ROM_establish_the_upla_desc:0 "Советская власть принесла украинцам бесчисленные страдания вместо обещанного освобождения. Мы должны выполнить это обещание и дать им собственное правительство."
 ROM_arms_for_the_workers:0 "Оружие рабочим"
 ROM_arms_for_the_workers_desc:0 "«Ни при каких обстоятельствах оружие и боеприпасы не должны быть сданы; любая попытка разоружить рабочих должна быть сорвана, при необходимости силой».\n— Карл Маркс"
 ROM_tractors_to_tanks:0 "От тракторов к танкам"
 ROM_tractors_to_tanks_desc:0 "Наши производители тракторов должны перейти на выпуск бронетехники и поддержать военные усилия."
 ROM_bureau_of_warfare:0 "Военное бюро"
 ROM_bureau_of_warfare_desc:0 "Военному бюро следует поручить управление вооружёнными силами."
 ROM_bureau_of_economics:0 "Экономическое бюро"
 ROM_bureau_of_economics_desc:0 "Экономическое бюро должно отвечать за хозяйственное планирование и устранение проблем, возникших при его реализации."
 ROM_allegiance_to_moscow:0 "Верность Москве"
 ROM_allegiance_to_moscow_desc:0 "Да здравствует дело марксизма-ленинизма, воплощённое в победе Октябрьской революции! Да здравствует Коминтерн!"
 ROM_finalize_the_trials:0 "Завершить процессы"
 ROM_finalize_the_trials_desc:0 "Идеологическое инакомыслие внутри партии должно быть устранено."
 ROM_political_commissars:0 "Политические комиссары"
 ROM_political_commissars_desc:0 "Чтобы обеспечить политическую надёжность солдат, к воинским частям наряду с обычными офицерами необходимо прикрепить комиссаров."
 ROM_foundation_romanian_red_army:0 "Создание Румынской Красной армии"
 ROM_foundation_romanian_red_army_desc:0 "Вооружённый пролетариат является самой основой Румынской Красной армии, но для эффективной борьбы с враждебными реакционными силами его необходимо должным образом обучить и оснастить."
 ROM_pressure_fatherland_front:0 "Оказать давление на Отечественный фронт"
 ROM_pressure_fatherland_front_desc:0 "Наша идеологическая позиция должна быть ясно доведена до болгарского Отечественного фронта. Солидарность с его социалистическими целями не должна омрачаться мелкими реакционными и империалистическими разногласиями."
 ROM_romanian_bulgarian_ssr:0 "Румыно-Болгарская ССР"
 ROM_romanian_bulgarian_ssr_desc:0 "Чтобы символизировать возрождённую дружбу, мы должны объединить наши страны в неделимую Румыно-Болгарскую ССР, скреплённую социалистической солидарностью."
 ROM_restoration_of_order:0 "Восстановление порядка"
 ROM_restoration_of_order_desc:0 ""
 ROM_stabilize_the_new_government:0 "Стабилизировать новое правительство"
 ROM_stabilize_the_new_government_desc:0 "Теперь, когда королевская диктатура свергнута, необходимо восстановить прочные государственные институты."
 ROM_anti_revolutionary_policies:0 "Антиреволюционная политика"
 ROM_anti_revolutionary_policies_desc:0 "Коммунистические революционные террористические ячейки воспользовались беспорядками, чтобы подготовить собственный захват власти и установить красный террор. Этого нельзя допустить любой ценой. Они истекут кровью, потому что красными станем мы!"
 ROM_bedrock_of_balkan_democracy:0 "Оплот балканской демократии"
 ROM_bedrock_of_balkan_democracy_desc:0 "Мы показали соседям, что диктатуре можно сопротивляться и что работоспособная демократия действительно возможна."
 ROM_the_iron_guard_threat:0 "Угроза Железной гвардии"
 ROM_the_iron_guard_threat_desc:0 "Железная гвардия отвергает принципы многопартийной демократии и приветствует революционное насилие, а значит представляет угрозу нашим институтам."
 ROM_fate_of_codreanu:0 "Судьба Кодряну"
 ROM_fate_of_codreanu_desc:0 "Необходимо решить судьбу Корнелиу Кодряну, лидера Железной гвардии."
 ROM_handle_the_guard:0 "Разобраться с Гвардией"
 ROM_handle_the_guard_desc:0 "Легионерское движение необходимо взять под контроль, чтобы предотвратить фашистский переворот."
 ROM_total_ban_on_paramilitaries:0 "Полный запрет военизированных организаций"
 ROM_total_ban_on_paramilitaries_desc:0 "Радикальные военизированные формирования должны быть распущены и разоружены, а их лидеры при необходимости арестованы."
 ROM_the_old_kingdom:0 "Старое королевство"
 ROM_the_old_kingdom_desc:0 "Наши древнейшие территории, возникшие из союза Молдавии и Валахии, в основном равнинны и составляют ядро страны."
 ROM_the_new_kingdom:0 "Новое королевство"
 ROM_the_new_kingdom_desc:0 "Ардял, освобождённый в 1918 году, значительно более горист и обладает собственной спецификой. К нему необходим особый подход."
 ROM_the_east:0 "Восток"
 ROM_the_east_desc:0 "Территории на северо-востоке, ранее находившиеся под властью России, необходимо реформировать."
 ROM_rural_investments:0 "Инвестиции в сельскую местность"
 ROM_rural_investments_desc:0 "Нашему сельскому ядру необходимы инвестиции, чтобы увеличить объём сельскохозяйственного производства."
 ROM_balkan_diplomacy:0 "Балканская дипломатия"
 ROM_balkan_diplomacy_desc:0 "Балканский пакт был подписан в феврале 1934 года Грецией, Турцией, Югославией и Румынией. Он был призван сохранять геополитический статус-кво, но ухудшение международной обстановки требует усилить обязательства его участников."
 ROM_restore_the_balkan_pact:0 "Восстановить Балканский пакт"
 ROM_restore_the_balkan_pact_desc:0 "Наши внутренние потрясения дестабилизировали Балканский пакт, но теперь необходимо обозначить возвращение Румынии на международную арену."
 ROM_form_a_united_balkan_pact:0 "Создать единый Балканский пакт"
 ROM_form_a_united_balkan_pact_desc:0 "Расплывчатые обещания сохранять статус-кво выглядят всё слабее на фоне сгущающихся над Европой туч. Если мы хотим самостоятельно отвечать за оборону, пакт необходимо превратить в настоящий союз с механизмами взаимной защиты."
 balkan_defense_pact:0 "Балканский оборонительный пакт"
 ROM_handle_the_bulgarians:0 "Разобраться с болгарами"
 ROM_handle_the_bulgarians_desc:0 "Хотя пакт явно окружает Болгарию, её всё же можно превратить в союзника при условии отказа от претензий на наши земли."
 ROM_pan_balkan_economic_pact:0 "Панбалканский экономический пакт"
 ROM_pan_balkan_economic_pact_desc:0 "Региональная экономическая интеграция поможет развить наши экономики и справиться с трудными годами впереди."
 ROM_unite_the_balkan_defence_pact:0 "Объединить Балканский оборонительный пакт"
 ROM_unite_the_balkan_defence_pact_desc:0 "Расплывчатые обещания сохранять статус-кво выглядят всё слабее на фоне сгущающихся над Европой туч. Чтобы обеспечить коллективную оборону, необходимо превратить пакт в настоящий союз с механизмами защиты всех его участников."
 ROM_united_against_extremism:0 "Едины против экстремизма"
 ROM_united_against_extremism_desc:0 "Нельзя позволить тирании тоталитаризма победить!"
 ROM_the_german_eagle:0 "Германский орёл"
 ROM_the_german_eagle_desc:0 "Германия неоднократно угрожала миру на континенте, и её необходимо сдержать раз и навсегда."
 ROM_the_soviet_sickle:0 "Советский серп"
 ROM_the_soviet_sickle_desc:0 "Государство [SOV.GetnameDefCap] неоднократно угрожало нашей целостности и представляет опасность для страны."
 ROM_the_italian_cross:0 "Итальянский крест"
 ROM_the_italian_cross_desc:0 "Итальянцев необходимо наказать за безрассудное стремление построить новую империю."
 ROM_restore_the_little_entente:0 "Восстановить Малую Антанту"
 ROM_restore_the_little_entente_desc:0 "Малую Антанту необходимо восстановить, чтобы защититься от окружающих нас тиранов."
 ROM_handle_the_hungarians:0 "Разобраться с венграми"
 ROM_handle_the_hungarians_desc:0 "Венгерский ирредентизм никогда не перестанет угрожать нашей территориальной целостности, если венграм твёрдо не напомнить об их прошлых поражениях."
 ROM_german_romanian_trade_agreement:0 "Торговый договор с Германией"
 ROM_german_romanian_trade_agreement_desc:0 "Нам известно об экономическом интересе Германии к нашей стране. Увеличив поставки таких товаров, как нефть, мы сможем запросить германскую помощь в модернизации вооружённых сил."
 ROM_industrial_investments:0 "Промышленные инвестиции"
 ROM_industrial_investments_desc:0 "Экономика лишь недавно оправилась от последствий Великой депрессии. Разумные инвестиции помогут запустить новый рост."
 ROM_raw_resource_exploitation:0 "Разработка сырьевых ресурсов"
 ROM_raw_resource_exploitation_desc:0 "Горнодобывающая промышленность и нефтедобыча уже десятилетиями остаются основой экономики. Покупатели по-прежнему охотно приобретают нашу нефть, а промышленности требуется больше руды для дальнейшего развития."
 ROM_industrial_revitalization_program:0 "Программа промышленного возрождения"
 ROM_industrial_revitalization_program_desc:0 "Получив больше руды, мы сможем перерабатывать её и производить больше готовых товаров для внутреннего рынка."
 ROM_increase_mining_efforts:0 "Расширить добычу полезных ископаемых"
 ROM_increase_mining_efforts_desc:0 "Даёт бонус к технологии добычи ресурсов. Открывает новые решения по разработке месторождений."
 ROM_gold_mining:0 "Добыча золота"
 ROM_gold_mining_desc:0 "Добыча золота — самый простой способ обеспечить валюту достаточным запасом драгоценного металла."
 ROM_derrick_upgrades:0 "Модернизация нефтяных вышек"
 ROM_derrick_upgrades_desc:0 "Модернизация нефтяных вышек позволит эффективнее добывать нефть."
 ROM_coal_mining:0 "Добыча угля"
 ROM_coal_mining_desc:0 "Уголь приводит в движение поезда и большую часть промышленного оборудования, поскольку в некоторых отраслях нефть всё ещё остаётся вторичным источником энергии."
 ROM_uranium_discovery:0 "Открытие урана"
 ROM_uranium_discovery_desc:0 "Нам посчастливилось обнаружить залежи урана. Их разработка позволит ускорить ядерные исследования!"
 ROM_the_industrial_combines:0 "Промышленные комбинаты"
 ROM_the_industrial_combines_desc:0 "Концентрация промышленности позволит упростить производственные процессы и повысить общую эффективность."
 ROM_romanian_timber_industry:0 "Румынская лесная промышленность"
 ROM_romanian_timber_industry_desc:0 "Обширные леса Ардяла являются ценным ресурсом, из которого можно производить мебель, бумагу и множество других товаров."
 ROM_ford_bucuresti:0 "Ford București"
 ROM_ford_bucuresti_desc:0 "Местное отделение компании Ford является ключевой частью наших ограниченных возможностей по производству автотранспорта."
 ROM_agricultural_reforms:0 "Аграрные реформы"
 ROM_agricultural_reforms_desc:0 "Фермеры находятся в самом сердце экономики и тяжело пострадали во время Великой депрессии. Они уже начали восстанавливаться, но дополнительная помощь позволит им окончательно оправиться."
 ROM_agricultural_boom:0 "Сельскохозяйственный бум"
 ROM_agricultural_boom_desc:0 "Внедрение новых методов земледелия, тракторов и удобрений способно значительно расширить сельскохозяйственный потенциал. Однако для успеха потребуется обучить крестьянство и обеспечить хорошие урожаи."
 ROM_strei_river_hydroelectric_modernization:0 "Гидроэлектростанция на реке Стрей"
 ROM_strei_river_hydroelectric_modernization_desc:0 "Плотина на реке Стрей позволит регулировать поток воды и вырабатывать электроэнергию на месте."
 ROM_improve_rural_roads:0 "Улучшить сельские дороги"
 ROM_improve_rural_roads_desc:0 "Сельская инфраструктура необходима для доставки растущего объёма сельскохозяйственной продукции на соответствующие рынки."
 ROM_malaxa_bucuresti:0 "Malaxa București"
 ROM_malaxa_bucuresti_desc:0 "Проект Николае Малаксы по созданию первого румынского автомобиля не только перспективен, но и может быть переориентирован на военные нужды."
 ROM_expand_the_romanian_academy:0 "Расширить Румынскую академию"
 ROM_expand_the_romanian_academy_desc:0 "Румынская академия стала центром притяжения для лучших научных умов страны. Увеличение её исследовательского бюджета должно повысить число инноваций."
 ROM_atelierele_leonida:0 "Atelierele Leonida"
 ROM_atelierele_leonida_desc:0 "Мастерские Леонида — одно из немногих мест в стране, где можно модифицировать, ремонтировать или собирать бронетехнику."
 ROM_romanian_armed_forces:0 "Вооружённые силы Румынии"
 ROM_romanian_armed_forces_desc:0 "Несмотря на бесчисленные новшества современной войны, традиционные сухопутные силы государства [ROM.GetAdjective] остаются главным защитником нашей независимости. Независимо от того, выберем ли мы инновационные средства общевойсковой войны или удвоим ставку на уже доказавшие эффективность подходы, бездействовать нельзя."
 ROM_army_modernisation_program:0 "Программа модернизации армии"
 ROM_army_modernisation_program_desc:0 "Гражданская война в России, польско-советский конфликт и война за независимость Турции наглядно показали стремительные перемены на современном поле боя. Чтобы не отставать от других региональных держав, необходимо провести масштабную модернизацию армии."
 ROM_the_higher_war_school:0 "Высшая военная школа"
 ROM_the_higher_war_school_desc:0 ""
 ROM_the_nicolae_balcescu_academy:0 "Академия Николае Бэлческу"
 ROM_the_nicolae_balcescu_academy_desc:0 ""
 ROM_the_army_profession:0 "Военная профессия"
 ROM_the_army_profession_desc:0 ""
 ROM_increase_domestic_production:0 "Увеличить внутреннее производство"
 ROM_increase_domestic_production_desc:0 "С каждым днём становится всё яснее, что Версальский мир был временной роскошью, на которую больше нельзя полагаться. Чтобы сохранить границы Великой Румынии, необходимо выделить средства на укрепление оборонной промышленности."
 ROM_domestic_rifle_designs:0 "Отечественные проекты винтовок"
 ROM_domestic_rifle_designs_desc:0 "По мере экономического развития государства [ROOT.GetNameDef] следует расширять внутреннее производство вооружений. Никому нельзя доверить защиту Великого объединения больше, чем самим [ROOT.GetAdjective]им гражданам, которые сражались и проливали кровь ради его достижения."
 ROM_support_equipment_redesign:0 "Переработать вспомогательное снаряжение"
 ROM_support_equipment_redesign_desc:0 "Продолжая модернизацию вооружённых сил, необходимо внедрять новшества и в инструменты, которые помогают солдатам добиваться успеха на поле боя."
 ROM_romanian_weapons_research_institute:0 "Румынский институт исследований вооружений"
 ROM_romanian_weapons_research_institute_desc:0 "Чтобы стать передовой державой в разработке вооружений, нам необходима академия, способная взрастить таланты, нужные стране."
 ROM_defend_our_skies:0 "Защитить наше небо"
 ROM_defend_our_skies_desc:0 "Итальянец Джулио Дуэ предупреждал о невероятных разрушениях, которые стратегические бомбардировки способны причинить мирному населению воюющей страны. Чтобы избежать подчинения с помощью подобного оружия, необходимо немедленно модернизировать противовоздушную оборону."
 ROM_static_anti_air_defense:0 "Стационарная противовоздушная оборона"
 ROM_static_anti_air_defense_desc:0 "Хотя успехи в защите неба впечатляют, перед лицом надвигающейся бури необходимо сделать ещё больше!"
 ROM_the_modern_battlefield:0 "Современное поле боя"
 ROM_the_modern_battlefield_desc:0 "Армия может состоять из храбрейших людей и обладать всеми средствами современной войны, но всё равно рухнет под руководством некомпетентных и отсталых командиров. Чтобы вновь не пасть перед иностранной угрозой, необходимо изучать современное поле боя."
 ROM_heavy_firepower:0 "Тяжёлая огневая мощь"
 ROM_heavy_firepower_desc:0 "В Великую войну мы не выдержали чудовищных разрушений, причинённых [GER.GetAdjective]ими и [BUL.GetAdjective]ими артиллерийскими тактиками. Мы в полной мере воспроизведём их новшества. Любой враг государства [ROOT.GetNameDef] истечёт кровью и погибнет в глубине нашей местности, пока мы будем благоразумно держаться естественных оборонительных рубежей!"
 ROM_the_queen_of_battle:0 "Царица полей"
 ROM_the_queen_of_battle_desc:0 "Несмотря на все появившиеся средства войны, пехота остаётся первой линией обороны повсюду. Наши храбрые солдаты будут господствовать на поле боя благодаря дисциплине и гордости за великую страну!"
 ROM_modernize_our_artillery:0 "Модернизировать артиллерию"
 ROM_modernize_our_artillery_desc:0 "Крупные орудия Великой войны устарели по меркам Берлина и Лондона. Чтобы оставаться силой, внушающей страх на поле боя, необходимо модернизировать артиллерию."
 ROM_mobility_and_armor:0 "Мобильность и бронетехника"
 ROM_mobility_and_armor_desc:0 "Теории Клаузевица о манёвренной войне привели Королевскую прусскую армию к победе над некогда самой престижной армией Европы. Бронетехника и тактики, разработанные Берлином позднее, определят новую эпоху общевойсковой войны, в которой государство [ROOT.GetNameDef] обязано принять участие!"
 ROM_design_a_romanian_tank:0 "Разработать румынский танк"
 ROM_design_a_romanian_tank_desc:0 "Мы больше не можем зависеть от иностранных держав в вопросе проектов боевой техники. Престижной [ROOT.GetAdjective]ой армии нужны собственные мощные танки."
 ROM_study_foreign_tanks:0 "Изучить иностранные танки"
 ROM_study_foreign_tanks_desc:0 "Нам не хватает экономики и личного опыта, чтобы привнести значительные инновации в дизайн брони. Мы должны смотреть на такие страны, как [FRA.GetNameDef], [GER.GetNameDef] и тот [ENG.GetAdjective] Найти что-то, что подходит [ROM.GetNameDef]Это нужно."
 ROM_self_propelled_guns:0 "Самоходные орудия"
 ROM_self_propelled_guns_desc:0 "Огневая поддержка самоходной артиллерии выглядит чрезвычайно перспективно. Следует изучить это оружие и определить его место в армии."
 ROM_the_romanian_air_force:0 "Военно-воздушные силы Румынии"
 ROM_the_romanian_air_force_desc:0 "Оружие неба стремительно меняет поле боя, и эта тенденция несомненно сохранится в будущих конфликтах. Мы должны вслед за западными державами освоить новое измерение войны."
 ROM_expand_airbase_facilities:0 "Расширить аэродромную инфраструктуру"
 ROM_expand_airbase_facilities_desc:0 "У нас пока нет логистической инфраструктуры, необходимой для содержания крупных и хорошо оснащённых военно-воздушных сил. Следует выделить средства на строительство аэродромов в стратегически важных регионах страны."
 ROM_pilot_academies:0 "Авиационные академии"
 ROM_pilot_academies_desc:0 "Лётчикам требуется уникальный набор навыков для самостоятельных действий на поле боя. Следует открыть академии, которые воспитают новое поколение храбрых, целеустремлённых и умелых авиационных кадров!"
 ROM_home_defence_flying:0 "Авиация обороны родины"
 ROM_home_defence_flying_desc:0 "Поскольку война угрожает жизни и безопасности наших сограждан, необходимо защитить всех [ROM.GetAdjective]их граждан от опасности воздушных бомбардировок."
 ROM_funding_to_iar:0 "Финансировать IAR"
 ROM_funding_to_iar_desc:0 "The [ROM.GetAdjective] IAR была основана недавно, в основном с помощью государственных субсидий. С последствиями успокаивающей депрессии и конфликтами на горизонте, предоставление IAR ресурсов, необходимых для расширения наших исследований и производственного потенциала, является необходимостью для всех. [ROM.GetAdjective]С!"
 ROM_order_the_iar_81:0 "Заказать IAR 81"
 ROM_order_the_iar_81_desc:0 ""
