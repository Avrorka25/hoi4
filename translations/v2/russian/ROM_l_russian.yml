 r56_ROM_covert_border_crossings:0 "Тайные переходы границы"
 r56_ROM_covert_border_crossings_desc:0 "Ходят слухи, что неизвестный благодетель пытается укрепить §Rкоммунистические§! группы в нашей стране."
 r56_ROM_arming_militias:0 "Вооружение ополчений"
 r56_ROM_arming_militias_desc:0 "Различные группы и банды §Rкоммунистов§! были замечены с иностранным снаряжением, происхождение которого они отказываются объяснять."
 r56_ROM_funding_worker_gatherings:0 "Финансирование рабочих собраний"
 r56_ROM_funding_worker_gatherings_desc:0 "Некоторые рабочие в приграничных городах получают средства из-за рубежа для создания профсоюзов и объединения единомышленников."
 r56_ROM_exiled_francophiles:0 "Изгнанные франкофилы"
