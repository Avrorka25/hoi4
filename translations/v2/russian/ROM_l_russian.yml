 rt56.romania.1.t:0 "Государство [FROM.GetNameDefCap] предлагает торговое соглашение"
 rt56.romania.1.d:0 "Сегодня на встрече в Берлине румынское правительство предложило заключить торговое соглашение между нашими странами. Оно может оказаться особенно выгодным, поскольку румынские нефтяные месторождения в Мунтении представляют большую ценность для наших будущих планов."
 rt56.romania.1.a:0 "Хороший день, чтобы быть другом [FROM.GetAdjective]ой стороны."
 rt56.romania.1.b:0 "Нам не обязательно торговать с ними, чтобы получить их нефть."
 rt56.romania.2.t:0 "Государство [FROM.GetNameDefCap] принимает торговое предложение"
 rt56.romania.2.d:0 "В Бухарест только что прибыла телеграмма, сообщающая, что [FROM.GetAdjective]ая сторона согласилась на торговое предложение."
 rt56.romania.2.a:0 "Превосходно!"
 rt56.romania.3.t:0 "Государство [FROM.GetNameDefCap] отклоняет торговое предложение"
 rt56.romania.3.d:0 "После мрачного возвращения домой нам сообщили, что [FROM.GetAdjective]ая сторона не станет заключать предложенное торговое соглашение."
 rt56.romania.3.a:0 "Весьма прискорбно."
 rt56.romania.4.t:0 "Германский четырёхлетний план"
 rt56.romania.4.d:0 "Сегодня рано утром прибыл человек по имени Гельмут Вольт. [ROOT.Capital.GetCapitalVictoryPointName] с еще одним предложением от [GER.GetNameDef]. Точно так же, как и предыдущее торговое соглашение, которое мы подписали с Германией, вероятно, склоняется в их пользу, это тоже так, хотя еще более вопиюще. Согласно предложенному четырехлетнему плану, большая часть, если не вся, добычи нефти в Мунтении пойдет непосредственно на нефтяные месторождения. [GER.GetNameDef] В то же время мы видим небольшие промышленные прибыли, которые намного превышают реальную стоимость нефти.\n\nНесмотря на то, что это не было прямо заявлено, за его словами, несомненно, скрывается скрытая угроза."
 rt56.romania.4.a:0 "И подчиниться экономическому господству?! Никогда!"
 rt56.romania.4.b:0 "Лучше не злить орла..."
 rt56.romania.4.c:0 "Предложим встречные условия..."
 rt56.romania.5.t:0 "Государство [FROM.GetNameDefCap] уступает права на нефть"
 rt56.romania.5.d:0 "Вернувшись сегодня в город [ROOT.Capital.GetCapitalVictoryPointName], господин Гельмут Вольтат с удовлетворением сообщил, что государство [FROM.GetNameDef] согласилось на дальнейшее экономическое сотрудничество. Это гарантирует, что нефтяные месторождения Мунтении будут снабжать топливом наши будущие военные усилия."
 rt56.romania.5.a:0 "Какой приятный сюрприз."
 rt56.romania.6.t:0 "Встречное предложение государства [FROM.GetNameDefCap]"
 rt56.romania.6.d:0 "Это не совсем то, чего мы рассчитывали добиться от четырёхлетнего плана, предполагавшего полный доступ к нефти государства [FROM.GetNameDef]. Вместо этого нам предложили помочь развить синтетическую промышленность, чтобы мы могли производить больше топлива самостоятельно. Его будет значительно меньше, однако это временно решит проблему, пока румынские нефтяные месторождения не окажутся в нашей сфере более прочно."
 rt56.romania.6.a:0 "Звучит вполне разумно."
 rt56.romania.6.b:0 "Скоро они всё равно прибегут к нам."
 rt56.romania.7.t:0 "Государство [FROM.GetNameDefCap] принимает наше предложение"
 rt56.romania.7.d:0 "Сегодня из Берлина пришли хорошие новости: немцы объявили, что принимают наше встречное предложение. Это позволит и дальше развивать экономику, сохраняя независимость от Германии."
 rt56.romania.7.a:0 "Какое облегчение."
 rt56.romania.8.t:0 "Государство [FROM.GetNameDefCap] отклоняет встречное предложение"
 rt56.romania.8.d:0 "Хотя немцы не станут устанавливать над нами экономическое господство, они заявили, что предложенные встречные условия недостаточно выгодны, и потому не окажут помощи в развитии румынской экономики."
 rt56.romania.8.a:0 "Следует быть настороже."
 rt56.balkan_pact.1.t:0 "Государство [FROM.GetNameDefCap] хочет укрепить Балканский пакт"
 rt56.balkan_pact.1.d:0 "С момента подписания Балканского пакта в 1934 году его участники сдерживали возможную будущую агрессию Болгарии. Однако теперь, когда Италия и Германия пали под власть фашизма, необходимо укрепить пакт и убедиться, что мы готовы, если Болгария вновь попытается ввергнуть Балканы в хаос."
 rt56.balkan_pact.1.a:0 "Балканский пакт должен выстоять."
 rt56.balkan_pact.1.b:0 "И вновь рисковать взрывом пороховой бочки?"
 rt56.balkan_pact.2.t:0 "Государство [FROM.GetNameDefCap] согласно обновить пакт"
 rt56.balkan_pact.2.d:0 "Сегодня наш посланник вернулся из государства [FROM.GetNameDef] с приятными новостями: [FROM.GetAdjective]ая сторона возобновит свои обязательства по Балканскому пакту."
 rt56.balkan_pact.2.a:0 "Превосходно!"
 rt56.balkan_pact.3.t:0 "Государство [FROM.GetNameDefCap] предаёт пакт"
 rt56.balkan_pact.3.d:0 "Наши посланники вернулись из государства [FROM.GetNameDef] с мрачными известиями: [FROM.GetAdjective]ая сторона не станет возобновлять статус подписанта Балканского пакта..."
 rt56.balkan_pact.3.a:0 "Разжигатели войны!"
 rt56.balkan_pact.4.t:0 "Государство [FROM.GetNameDefCap] приглашает нас в Балканский пакт"
 rt56.balkan_pact.4.d:0 "Несмотря на то что Балканский пакт создавался как оборонительный союз против нас, государство [FROM.GetNameDef] сегодня предложило нам вступить в него. Приглашение предусматривает политику ненападения в отношении нынешних участников, но также требует отказаться от территориальных претензий."
 rt56.balkan_pact.4.a:0 "В долгосрочной перспективе сотрудничество принесёт пользу всем."
 rt56.balkan_pact.4.b:0 "Это лишь уловка."
 rt56.balkan_pact.5.t:0 "Государство [FROM.GetNameDefCap] вступает в Балканский пакт"
 rt56.balkan_pact.5.d:0 "Сегодня первый день, когда все Балканы могут смотреть вперед, не беспокоясь о своих соседях, вместо этого может начаться новая эра сотрудничества между нашими странами."
 rt56.balkan_pact.5.a:0 "Балканы едины."
 rt56.balkan_pact.6.t:0 "Государство [FROM.GetNameDefCap] отказывается подписывать пакт"
 rt56.balkan_pact.6.d:0 "Неудивительно, что государство [FROM.GetNameDef] отклонило наше приглашение вступить в Балканский пакт. Неясно, связано ли это с желанием реализовать территориальные претензии, но одно известно точно: доверять ему нельзя."
 rt56.balkan_pact.6.a:0 "Этого следовало ожидать."
 rt56.balkan_pact.7.t:0 "Государство [FROM.GetNameDefCap] предлагает оформить Балканскую Антанту"
 rt56.balkan_pact.7.d:0 "Сегодня на встрече всех участников Балканского пакта лидер [FROM.GetLeader] предложил официально преобразовать его в полноценный союз против любых внешних угроз стабильности региона. Несмотря на очевидные оборонительные преимущества, у создания альянса могут быть и недостатки..."
 rt56.balkan_pact.7.a:0 "За процветающие Балканы!"
 rt56.balkan_pact.7.b:0 "И рисковать внешним вмешательством?"
 rt56.balkan_pact.8.t:0 "Государство [FROM.GetNameDefCap] вступает в Балканскую Антанту"
 rt56.balkan_pact.8.d:0 "Увидев в предложении больше преимуществ, чем недостатков, [FROM.GetAdjective]ая сторона согласилась и вступила в наш альянс."
 rt56.balkan_pact.8.a:0 "За будущее!"
 rt56.balkan_pact.9.t:0 "Государство [FROM.GetNameDefCap] отклоняет приглашение"
 rt56.balkan_pact.9.d:0 "Утверждая, что создание ещё одного политического блока в Европе может дестабилизировать регион, а также не желая связывать себя альянсом, [FROM.GetAdjective]ая сторона вышла из переговоров."
 rt56.balkan_pact.9.a:0 "Крайне прискорбно."
 rt56.balkan_pact.20.t:0 "Балканский пакт подвергся нападению"
 rt56.balkan_pact.20.d:0 "До нас дошли сведения, что всего несколько дней назад наши союзники в [FROM.GetNameDefCap] подверглись нападению или вторжению со стороны сил [BUL.GetAdjective]! Согласно нашим соглашениям с правительством [FROM.GetAdjective], от нас ожидают вступления в войну и помощи нашим союзникам [FROM.GetAdjective]. Однако это может не отвечать нашим интересам. Мы должны решить быстро — времени почти не осталось."
 rt56.balkan_pact.20.a:0 "Мы победили их однажды и победим снова!"
 rt56.balkan_pact.20.b:0 "Мы не можем позволить себе ещё одну войну с [BUL.GetAdjective]ой стороной..."
 rt56.rom_west.1.t:0 "Государство [FROM.GetNameDefCap] требует военных гарантий"
 rt56.rom_west.1.d:0 "Пока на горизонте маячит война, мы уже несколько месяцев пытаемся заключить официальный союз с государством [FROM.GetNameDef], однако наши пожелания, похоже, оставались без ответа. Сегодня положение изменилось: на встрече между лидерами [FROM.GetLeader] и [THIs.GetLeader] первый заявил, что прежде чем рассматривать вступление в союз, ему необходимы военные гарантии."
 rt56.rom_west.1.a:0 "Хорошо, государство [FROM.GetNameDef] получит гарантии."
 rt56.rom_west.1.b:0 "И рисковать дестабилизацией региона?"
 rt56.rom_west.2.t:0 "Государство [FROM.GetNameDefCap] гарантирует военную поддержку"
 rt56.rom_west.2.d:0 "Со встречи лидеров [THIS.GetLeader] и [FROM.GetLeader] пришли хорошие новости: государство [FROM.GetNameDef] пообещало оказать нам военную поддержку, если мы окажемся в оборонительной войне."
 rt56.rom_west.2.a:0 "Великолепно!"
 rt56.rom_west.3.t:0 "Государство [FROM.GetNameDefCap] отклоняет просьбу"
 rt56.rom_west.3.d:0 "Хотя лидер [THIS.GetLeader] вернулся со многими хорошими новостями, он с сожалением сообщил, что не сумел заручиться военной поддержкой государства [FROM.GetNameDef]. Следовательно, в случае вторжения рассчитывать на него нельзя."
 rt56.rom_west.3.a:0 "Они нам не нужны."
 rt56.rom_stab_ger.1.t:0 "Государство [FROM.GetNameDefCap] готовится к миру..."
 rt56.rom_stab_ger.1.d:0 "Наши агенты в Стокгольме сообщили, что у союзника [FROM.GetNameDef] может произойти смена режима, а новое правительство собирается заключить перемирие с государством [SOV.GetNameDef]. Следует внимательно следить за возможным предательством."
 rt56.rom_stab_ger.1.a:0 "Проклятые трусы!"
 rt56.rom_stab_ger.2.t:0 "Государство [FROM.GetNameDefCap] просит мира"
 rt56.rom_stab_ger.2.d:0 "Сегодня наш министр иностранных дел встретился со своим [FROM.GetAdjective] коллега в Стокгольм. The [FROM.GetAdjective] Они выдвинули идею о том, что смена режима, скорее всего, состоится и что они хотели бы подать в суд за мир с Россией. [ROOT.GetNameDef] и готовы принять условия, которые были выдвинуты в качестве требований несколькими месяцами ранее, если мы окажем помощь в вождении [GER.GetAdjective]Вышел из своих земель."
 rt56.rom_stab_ger.2.a:0 "Это поможет задушить [GER.GetAdjective]ую сторону. Мы согласны."
 rt56.rom_stab_ger.2.b:0 "Нет! Кровь советского народа требует полной капитуляции!"
 rt56.rom_stab_ger.3.t:0 "Государство [FROM.GetNameDefCap] подписывает перемирие"
 rt56.rom_stab_ger.3.d:0 "После подписания перемирия мы вновь оказались в мире с государством [FROM.GetNameDef] и теперь можем обратить внимание на [HUN.GetAdjective]ую сторону и вернуть Трансильванию!"
 rt56.rom_stab_ger.3.a:0 "Если понадобится — до самого Берлина!"
 rt56.rom_stab_ger.4.t:0 "Государство [FROM.GetNameDefCap] отклоняет мирное предложение"
 rt56.rom_stab_ger.4.d:0 "Государство [FROM.GetNameDefCap] сообщило, что мира не будет, пока вся территория государства [ROOT.GetName] не склонится перед мощью Красной армии. Теперь нам предстоит последний рубеж — за Румынию."
 rt56.rom_stab_ger.4.a:0 "Румыния не падёт!"
 rt56.rom_general_election.1.t:0 "Всеобщие выборы"
 rt56.rom_general_election.1.d:0 "Всеобщие выборы уже проходят, и вскоре станет ясно, каким будет будущее Румынии. Национальная либеральная партия долго считалась фаворитом и, вероятно, покажет сильный результат, однако её соперница — Национальная крестьянская партия — выглядит не менее убедительно.\n\n\nНо, как всегда в политике, нельзя заранее знать, что произойдёт после подсчёта голосов."
 rt56.rom_general_election.1.a:0 "Как и ожидалось, королю придётся вмешаться."
 rt56.rom_general_election.1.b:0 "Отвлечём короля и позволим демократии работать..."
 rt56.rom_general_election.2.t:0 "Государство [FROM.GetNameDefCap] просит помощи в предстоящем кризисе"
 rt56.rom_general_election.2.d:0 "После избирательного тупика и слухов о возможной революции среди левых элементов румынское правительство обратилось к нам как к участнику Балканского пакта с просьбой предоставить материальную помощь. Оно просит передать любое доступное стрелковое оружие и тяжёлую артиллерию на случай, если коммунисты ввергнут страну в гражданскую войну.\n\nНазревающий в Румынии кризис может перекинуться и на наши земли, если его не остановить. Следует ли помочь сейчас, рискуя усилить коммунистическое государство в случае их поражения, или сохранить снаряжение и подготовиться противостоять коммунистам, если они победят?"
 rt56.rom_general_election.2.a:0 "Безусловно!"
 rt56.rom_general_election.2.b:0 "Мы ничем не можем поделиться..."
 rt56.rom_general_election.21.t:0 "Государство [FROM.GetNameDefCap] поставит оружие"
 rt56.rom_general_election.21.d:0 "Государство [FROM.GetNameDefCap] пообещало, что в случае попытки коммунистической революции передаст нам столько винтовок и тяжёлой артиллерии, сколько сможет выделить."
 rt56.rom_general_election.21.a:0 "Друг демократии."
 rt56.rom_general_election.22.t:0 "Государство [FROM.GetNameDefCap] не поддержит нас"
 rt56.rom_general_election.22.d:0 "Государство [FROM.GetNameDefCap] ясно дало понять, что вместо защиты демократии готово оставить нашу судьбу в руках коммунистов. Если мы выйдем победителями из этого кризиса, то запомним предательство."
 rt56.rom_general_election.22.a:0 "Вот вам и Балканский пакт."
 rt56.rom_general_election.3.t:0 "Государство [FROM.GetNameDefCap] просит поддержки в предстоящем кризисе"
 rt56.rom_general_election.3.d:0 "Сегодня рано утром представители Бухареста прибыли в состоянии паники. Попросив о закрытой встрече, они объявили, что, по их мнению, коммунистические элементы попытаются свергнуть правительство менее чем через полгода, и попросили помощи на случай, если опасения оправдаются."
 rt56.rom_general_election.3.a:0 "Безусловно!"
 rt56.rom_general_election.3.b:0 "Мы ничем не можем поделиться."
 rt56.rom_general_election.31.t:0 "Государство [FROM.GetNameDefCap] поддержит нас"
 rt56.rom_general_election.31.d:0 "Государство [FROM.GetNameDefCap] пообещало, что в случае попытки революции предоставит нам оружие и не станет препятствовать добровольцам, желающим прийти на помощь. Однако официальной поддержки не будет, чтобы не поставить под угрозу его политическое положение в случае нашего поражения."
 rt56.rom_general_election.31.a:0 "Горькая победа всё равно остаётся победой."
 rt56.rom_general_election.32.t:0 "Государство [FROM.GetNameDefCap] отклоняет нашу просьбу"
 rt56.rom_general_election.32.d:0 "Сославшись на необходимость сохранять вооружение и быть готовыми к конфликту, нависшему над Европой, [FROM.GetAdjective]ое правительство отказало нам в любой поддержке, кроме мыслей и молитв."
 rt56.rom_general_election.32.a:0 "Негодяи!"
 rt56.rom_general_election.4.t:0 "Избирательный тупик"
 rt56.rom_general_election.4.d:0 "В результате неожиданного поворота событий после не двух, а трёх пересчётов голосов выяснилось, что ни одна партия или фракция не способна самостоятельно сформировать правительство. Фактический избирательный тупик и нежелание партий сотрудничать друг с другом бросили тень сомнения на нынешний режим.\n\nПока различные политические силы ищут фигуру, вокруг которой можно сплотиться, начинают распространяться слухи о левой революции..."
 rt56.rom_general_election.4.a:0 "Мы должны действовать осторожно."
 rt56.rom_general_election.5.t:0 "Гражданская война в Румынии"
 rt56.rom_general_election.5.d:0 "Прошло чуть больше шести месяцев с тех пор, как тупик поставил Румынию на грань катастрофы. Теперь сформировались две заметные стороны, и будущее ещё никогда не было столь неопределённым.\n\nСвергнут ли революционеры старый режим или победит разношёрстная коалиция? Покажет лишь время, но сейчас остаётся сделать только одно..."
 rt56.rom_general_election.5.a:0 "К оружию!"
 rt56.rom_general_election.6.t:0 "Румынский тупик"
 rt56.rom_general_election.6.d:0 "После участия в борьбе румынских революционеров против старого режима мы пришли к выводу, что потери людей и снаряжения уже превосходят ценность ещё одной революции на нашей стороне. Наши войска начали покидать страну, пока мы подписываем перемирие."
 rt56.rom_general_election.6.a:0 "Это возмутительно."
 rt56.rom_general_election.7.t:0 "The [SOV.GetAdjective]Интервенция"
 rt56.rom_general_election.7.d:0 "Заявив, что не может просто сидеть и наблюдать, как революционеры восстают против угнетателей, государство [FROM.GetNameDef] объявило о начале миротворческой операции, целью которой станет стабилизация Румынии и возвращение порядка в регион."
 rt56.rom_general_election.7.a:0 "Красная армия приближается."
 rt56.rom_general_election.8.t:0 "Досрочные выборы"
 rt56.rom_general_election.8.d:0 "Пусть решение провести выборы раньше обычного и оказалось непопулярным, оно было жизненно необходимо для сохранения демократических институтов страны. Теперь остаётся лишь ждать и смотреть, куда демократия приведёт нас."
 rt56.rom_general_election.8.a:0 "Чтобы предотвратить королевскую диктатуру, мы должны действовать."
 rt56.rom_general_election.9.t:0 "Вмешаться в Румынию?"
 rt56.rom_general_election.9.d:0 "После тупика на румынских выборах между демократическими и коммунистическими силами началась гражданская война. Поскольку конфликт разворачивается прямо у нашей границы, возможно, стоит вмешаться на стороне коммунистов и укрепить наше влияние на Балканах."
 rt56.rom_general_election.9.a:0 "Мы поможем товарищам!"
 rt56.rom_general_election.9.b:0 "У нас есть более важные проблемы."
 rt56.rom_abdicate.1.t:0 "Отречение короля Кароля"
 rt56.rom_abdicate.1.d:0 "После вынужденных территориальных уступок общественность начала требовать отречения короля Кароля II. Куда он отправится и каковы его планы на будущее, неизвестно, но теперь Румыния обращает взор к его сыну, королю Михаю I, который должен провести страну через эти тревожные времена к более процветающему будущему!"
 rt56.rom_abdicate.1.a:0 "Он должен отречься!"
 rt56.rom_transylvania.1.t:0 "Румыния поднимает вопрос Северной Трансильвании"
 rt56.rom_transylvania.1.d:0 "После поддержанной нами венгерской аннексии Северной Трансильвании румынское правительство неоднократно просило разрешить вернуть эту территорию. Теперь оно представило новое предложение: передать нам Транснистрию в обмен на возвращение своих земель. Венграм это может не понравиться, но права голоса у них фактически нет."
 rt56.rom_transylvania.1.a:0 "Они хорошо себя проявили и получат её обратно."
 rt56.rom_transylvania.1.b:0 "Пусть оставят Транснистрию себе."
 rt56.rom_transylvania.2.t:0 "Государство [FROM.GetNameDefCap] требует вернуть Северную Трансильванию"
 rt56.rom_transylvania.2.d:0 "Сегодня из Берлина поступили требования вернуть Северную Трансильванию румынам, что стало неожиданным изменением позиции. Перед нами два варианта: передать земли Румынии или столкнуться с возможным гневом Германии после окончания войны."
 rt56.rom_transylvania.2.a:0 "Хорошо, подчинимся."
 rt56.rom_transylvania.2.b:0 "Нет, Северная Трансильвания — венгерская!"
 rt56.rom_transylvania.3.t:0 "Государство [FROM.GetNameDefCap] отклоняет наше торговое предложение"
 rt56.rom_transylvania.3.d:0 "Не слишком удивительно, что немцы решили не возвращать нам Северную Трансильванию и позволили венграм сохранить её. Это досадно, но нам остаётся ждать подходящей возможности."
 rt56.rom_transylvania.3.a:0 "Прискорбно."
 rt56.rom_tilea_affair.1.t:0 "Дело Тилеа"
 rt56.rom_tilea_affair.1.d:0 "Сегодня рано утром Виорел Тилеа ворвался в министерство иностранных дел и заявил, что Румыния находится под непосредственной угрозой совместного германо-венгерского вторжения.\n\nОн считает, что к началу лета они будут готовы войти в Трансильванию, а затем попытаться захватить огромные нефтяные запасы страны."
 rt56.rom_tilea_affair.1.a:0 "Государство [FROM.GetNameDefCap] необходимо защитить"
 rt56.rom_tilea_affair.1.b:0 "Мы не станем защищать государство [FROM.GetNameDef]."
 rt56.rom_tilea_affair.2.t:0 "Государство [FROM.GetNameDefCap] обещает защиту"
 rt56.rom_tilea_affair.2.d:0 "После панического визита Тилеа в лондонское министерство иностранных дел в Бухарест прибыла телеграмма с сообщением, что государство [FROM.GetNameDef] окажет вооружённую поддержку в случае кризиса."
 rt56.rom_tilea_affair.2.a:0 "Прекрасные новости."
 rt56.rom_tilea_affair.3.t:0 "Государство [FROM.GetNameDefCap] отклоняет просьбу"
 rt56.rom_tilea_affair.3.d:0 "Вместе с новостями о визите Тилеа в лондонское министерство иностранных дел пришло сообщение, что государство [FROM.GetNameDef] не окажет военной поддержки в грядущем кризисе, поскольку считает совместное германо-венгерское вторжение крайне маловероятным."
 rt56.rom_tilea_affair.3.a:0 "Чего ещё мы ожидали?"
 rt56.rom_peace_front.1.t:0 "Фронт мира"
 rt56.rom_peace_front.1.d:0 "Сегодня рано утром прибыл посланник из Бухареста с предложением о возможном военном сотрудничестве между нашими странами.\n\nИнициатива получила название «Фронт мира» — военный союз, призванный ограничить растущую германскую экспансию в Центральной Европе и, будем надеяться, удержать Германию от начала новой Великой войны.\n\nОднако, если немцы почувствуют угрозу, это также может подтолкнуть их к более агрессивным действиям..."
 rt56.rom_peace_front.1.a:0 "Мы будем сотрудничать с государствами [FROM.GetNameDef] и [ENG.GetNameDef]"
 rt56.rom_peace_front.1.b:0 "Мы не позволим утянуть себя на дно вместе с ними"
 rt56.rom_peace_front.2.t:0 "Государство [FROM.GetNameDefCap] подписывает соглашение о Фронте мира"
 rt56.rom_peace_front.2.d:0 "После долгих переговоров с [FROM.GetAdjective]им министром иностранных дел было принято решение присоединиться к инициативе Фронта мира. Вместе мы, возможно, сумеем сдержать Германию, если она попытается начать новую войну."
 rt56.rom_peace_front.2.a:0 "Прекрасные новости."
 rt56.rom_peace_front.3.t:0 "Государство [FROM.GetNameDefCap] отклоняет просьбу"
 rt56.rom_peace_front.3.d:0 "Несмотря на все усилия нашего посланника, [FROM.GetAdjective]ий министр иностранных дел отказался подписывать соглашение, способное укрепить инициативу Фронта мира. Он считает эту попытку бесполезной и даже способной стать поводом, необходимым Германии для начала войны."
 rt56.rom_peace_front.3.a:0 "Чего ещё мы ожидали?"
 rt56.rom_bulgaria_situation.1.t:0 "Государство [FROM.GetNameDefCap] требует изменить курс"
 rt56.rom_bulgaria_situation.1.d:0 "Сегодня в Бухаресте в публичном заявлении [FROM.GetLeader] Он потребовал, чтобы мы, [ROOT.GetNameDef] Мы должны перестроить нашу внешнюю политику и подчиниться правлению самого Бухареста. В своем заявлении [FROM.GetLeader] Он сказал, что если мы попытаемся сопротивляться требованию, то [FROM.GetAdjective] Армия была бы готова пройти через границу по самому раннему сигналу и намеку на отказ."
 rt56.rom_bulgaria_situation.1.a:0 "У нас нет другого выбора."
 rt56.rom_bulgaria_situation.1.b:0 "Мы не уступим ни пяди земли!"
 rt56.rom_bulgaria_situation.2.t:0 "Государство [FROM.GetNameDefCap] подчиняется"
 rt56.rom_bulgaria_situation.2.d:0 "Сегодня [FROM.GetLeader] В прямом эфире на радиостанциях по всему миру [FROM.GetNameDef] В связи с политической ситуацией на Балканах, [FROM.GetNameDef] Выполняйте требования, которые мы предъявляем, поскольку это будет наилучшей причиной действий, которая пощадит большинство жизней внутри вас. [FROM.GetNameDef]."
 rt56.rom_bulgaria_situation.2.a:0 "Прекрасно."
 rt56.rom_bulgaria_situation.3.t:0 "Государство [FROM.GetNameDefCap] бросает нам вызов"
 rt56.rom_bulgaria_situation.3.d:0 "Сегодня, [FROM.GetLeader] В прямом эфире на радиостанциях по всему миру [FROM.GetNameDef] Объявляя, что требования, предъявляемые [ROOT.GetLeader] Это была прямая угроза для [FROM.GetNameDef]Суверенитет государства и что если кто-либо из солдат попытается пересечь границу, [FROM.GetNameDef] Они будут встречены огнем и артиллерией!"
 rt56.rom_bulgaria_situation.3.a:0 "Какая наглость."
 rt56.rom_protect_yug.1.t:0 "[FROM.GetNameDefCap] настоятельно призывает к защите [YUG.GetNameDefCap]"
 rt56.rom_protect_yug.1.d:0 "Еще раз, когда у вас есть [FROM.GetAdjective] Министр Тилеа прибыл с очередной просьбой. Он боится, что [YUG.GetNameDef] будет подвергаться непосредственному нападению со стороны [GER.GetNameDef] Он призывает нас к защите, которую мы им предоставили. [YUG.GetName] Тоже самое."
 rt56.rom_protect_yug.1.a:0 "Хорошее предложение."
 rt56.rom_protect_yug.1.b:0 "Это лишь чрезмерно растянет наши силы."
 rt56.rom_protect_yug.2.t:0 "Государство [FROM.GetNameDefCap] отклоняет предложение"
 rt56.rom_protect_yug.2.d:0 "Из Лондона вновь пришли новости, на этот раз мрачные: государство [FROM.GetNameDef] не станет распространять предоставленную нам защиту на государство [YUG.GetNameDef], поскольку его вооружённые силы окажутся слишком растянутыми для эффективных действий."
 rt56.rom_protect_yug.2.a:0 "Тогда оставим их на произвол судьбы."
 rt56.rom_com_bul_dobruja_trade.1.t:0 "Государство [ROM.GetNameDefCap] предлагает Добруджу за поддержку в войне за независимость"
 rt56.rom_com_bul_dobruja_trade.1.d:0 "В ходе довольно неожиданного поворота событий к нам обратились представители [FROM.GetAdjective]ого бюро внутренней безопасности. Они хотят сбросить иго государства [SOV.GetNameDef] и готовы вернуть территорию, отнятую у нас во Второй Балканской войне, в обмен на поддержку против государства [SOV.GetNameDef]."
 rt56.rom_com_bul_dobruja_trade.1.a:0 "Рискованно, но это может сработать."
 rt56.rom_com_bul_dobruja_trade.1.b:0 "Нет, регион [77.GetName] всё равно рано или поздно вернётся к нам."
 rt56.rom_com_bul_dobruja_trade.2.t:0 "Государство [FROM.GetNameDefCap] принимает предложение"
 rt56.rom_com_bul_dobruja_trade.2.d:0 "Агенты, отправленные в государство [FROM.GetNameDef], вернулись с обещанием поддержки при условии, что после объявления войны мы выполним договорённость и передадим регион [77.GetName]."
 rt56.rom_com_bul_dobruja_trade.2.a:0 "Прекрасно. Горько, но прекрасно."
 rt56.rom_com_bul_dobruja_trade.3.t:0 "Государство [FROM.GetNameDefCap] отвергает предложение"
 rt56.rom_com_bul_dobruja_trade.3.d:0 "Агенты, отправленные в государство [FROM.GetNameDef], сообщили, что их встретили смехом, а затем поспешно выдворили из страны с простым посланием: регион [77.GetName] всё равно вскоре вернётся государству [FROM.GetNameDef], а участвовать в нашей попытке самоубийства они не станут."
 rt56.rom_com_bul_dobruja_trade.3.a:0 "Никогда не доверяйте [FROM.GetAdjective]ой стороне."
 rt56.rom_ger_divide_czech.1.t:0 "Государство [FROM.GetNameDefCap] предлагает разделить Чехословакию"
 rt56.rom_ger_divide_czech.1.d:0 "Сегодня в Берлин прибыл посланник от имени лидера [ROM.GetLeader] с картами предлагаемого раздела государства [CZE.GetNameDef]. Чехия должна отойти нам, а в словацких регионах румыны создадут новый режим. Этот план позволит объединиться с германским меньшинством Судетской области, а промышленный потенциал регионов [9.GetName] и [75.GetName] также хорошо соответствует нашим будущим планам."
 rt56.rom_ger_divide_czech.1.a:0 "Хорошо, отправим это [CZE.GetAdjective]ой стороне"
 rt56.rom_ger_divide_czech.1.b:0 "Нет, государство [ROM.GetNameDef] не входит в наши планы."
 rt56.rom_ger_divide_czech.2.t:0 "Государство [FROM.GetNameDefCap] согласно с предложением"
 rt56.rom_ger_divide_czech.2.d:0 "Сегодня из [GER.GetAdjective]ой столицы прибыла телеграмма: Германия весьма заинтересована в разделе государства [CZE.GetNameDef] и ожидает нашего решения и ответа [CZE.GetAdjective]ой стороны."
 rt56.rom_ger_divide_czech.2.a:0 "Прекрасно, отправим ультиматум."
 rt56.rom_ger_divide_czech.3.t:0 "Государство [FROM.GetNameDefcap] отклоняет предложение"
 rt56.rom_ger_divide_czech.3.d:0 "Сегодня наш посланник вернулся из государства [GER.GetNameDef] с прискорбными новостями: Германия не станет делить с нами государство [CZE.GetNameDef] и советует оставить определение границ Центральной Европы ей."
 rt56.rom_ger_divide_czech.3.a:0 "Какая недальновидность."
 rt56.rom_ger_divide_czech.4.t:0 "Государства [FROM.GetNameDefCap] и [GER.GetNameDefCap] требуют раздела"
 rt56.rom_ger_divide_czech.4.d:0 "В довольно шокирующем повороте событий, [ROM.GetNameDef] и [GER.GetNameDef] Мы собрались вместе и предъявили нам ультиматум. Подчиниться их соответствующим режимам или столкнуться с последствиями. Если граница с [GER.GetNameDef] сильно укреплена, граница с [ROM.GetNameDef] Он гораздо более незащищенный, чем естественные укрепления Карпат. Как мы понимаем ситуацию, у нас есть три варианта."
 rt56.rom_ger_divide_czech.4.a:0 "У нас нет другого выбора."
 rt56.rom_ger_divide_czech.4.b:0 "Мы будем сражаться!"
 rt56.rom_ger_divide_czech.4.c:0 "Призовём государство [FRA.GetNameDef] на помощь!"
 rt56.rom_ger_divide_czech.5.t:0 "Государство [FROM.GetNameDefCap] подчиняется"
 rt56.rom_ger_divide_czech.5.d:0 "В приятном повороте событий, [CZE.GetNameDef] Они увидели причину и решили подчиниться нашим объединенным требованиям. [GER.GetAdjective] Армии и наши начали подготовку к походу в [CZE.GetNameDef] обеспечение стабильности, поскольку мы обеспечиваем контроль над нашими регионами;"
 rt56.rom_ger_divide_czech.5.a:0 "Прекрасно!"
 rt56.rom_ger_divide_czech.6.t:0 "Государство [FROM.GetNameDefCap] мобилизуется"
 rt56.rom_ger_divide_czech.6.d:0 "Как и следовало ожидать, государство [CZE.GetNameDef] объявило всеобщую мобилизацию и готовится сопротивляться нашему наступлению."
 rt56.rom_ger_divide_czech.6.a:0 "Политика провалилась, как и ожидалось."
 rt56.rom_ger_divide_czech.7.t:0 "Государство [FROM.GetNameDefCap] просит помощи"
 rt56.rom_ger_divide_czech.7.d:0 "Шокирующие новости пришли сегодня в Париж. [CZE.GetNameDef] Они сталкиваются с экзистенциальной угрозой со стороны обоих. [GER.GetNameDef] и удивительно [ROM.GetNameDef]их бывшего союзника. The [CZE.GetAdjective] Министр здесь, [FRA.GetNameDef] Они умоляли нас помочь им отбить эти захватчики, как если бы они упали, остальная Европа наверняка упадет после них."
 rt56.rom_ger_divide_czech.7.a:0 "Государство [FRA.GetNameDefCap] не бросит государство [CZE.GetNameDef]"
 rt56.rom_ger_divide_czech.7.b:0 "Сейчас мы не можем рисковать войной с [GER.GetAdjective]ой стороной..."
 rt56.rom_ger_divide_czech.8.t:0 "Государство [FROM.GetNameDefCap] выступает на нашей стороне"
 rt56.rom_ger_divide_czech.8.d:0 "Государство [FRA.GetNameDefCap] объявило, что окажет военную помощь, если [ROM.GetAdjective]ая и [GER.GetAdjective]ая стороны осмелятся начать нападение.\n\nСегодня государство [CZE.GetNameDefCap] не падёт!"
 rt56.rom_ger_divide_czech.8.a:0 "Пусть приходят!"
 rt56.rom_ger_divide_czech.9.t:0 "Государство [FROM.GetNameDefCap] бросает нас"
 rt56.rom_ger_divide_czech.9.d:0 "Государство [FRA.GetNameDefCap] объявило, что не может предоставить запрошенную военную помощь, поскольку из-за внутреннего положения не готово рисковать войной с государством [GER.GetNameDef]. Мы остались по-настоящему одни."
 rt56.rom_ger_divide_czech.9.a:0 "В изоляции у нас не остаётся выбора."
 rt56.rom_ger_divide_czech.9.b:0 "Хорошо, тогда будем сражаться в одиночку!"
 rt56.rom_hun_submission.1.t:0 "Лидер [FROM.GetLeader] требует подчинения"
 rt56.rom_hun_submission.1.d:0 "Лидер [FROM.GetLeader] продолжает свою тираду и теперь предъявил ультиматум, требующий присутствия румынских чиновников в нашем государственном аппарате. Это превратит страну не более чем в марионетку."
 rt56.rom_hun_submission.1.a:0 "Между рысью и крестом — какой у нас выбор?"
 rt56.rom_hun_submission.1.b:0 "Они разобьются о Тису. Пусть приходят."
 rt56.rom_hun_submission.2.t:0 "Государство [FROM.GetNameDefCap] подчиняется"
 rt56.rom_hun_submission.2.d:0 "The [FROM.GetAdjective] Правительство решило принять наши требования. Нашим должностным лицам был предоставлен доступ к ключевым элементам их государственного аппарата, обеспечивающим наше влияние в их стране."
 rt56.rom_hun_submission.2.a:0 "Всё идёт по плану."
 rt56.rom_hun_submission.3.t:0 "Государство [FROM.GetNameDefCap] продолжает сопротивляться"
 rt56.rom_hun_submission.3.d:0 "The [FROM.GetAdjective] Правительство глупо решило сопротивляться нашему требованию, несмотря на риск, который оно вызывает для существования их нации."
 rt56.rom_hun_submission.3.a:0 "Мы не возражаем пролить [HUN.GetAdjective]ую кровь."
 rt56.rom_hun_invitation.1.t:0 "Государство [FROM.GetName] предлагает привлечь Венгрию"
 rt56.rom_hun_invitation.1.d:0 "[FROM.GetAdjective] Сегодня прибыли дипломаты с просьбой [FROM.GetLeader]Для того, чтобы попытаться завербовать [HUN.GetNameDef] В нашу фракцию."
 rt56.rom_hun_invitation.1.a:0 "Отличное предложение."
 rt56.rom_hun_invitation.1.b:0 "У нас другие планы на Венгрию."
 rt56.rom_hun_invitation.2.t:0 "Государство [FROM.GetName] отказывается приглашать Венгрию"
 rt56.rom_hun_invitation.2.d:0 "Лидер [GER.GetLeader] отверг наше предложение сблизиться с государством [HUN.GetNameDef], разразившись тирадой о том, что Венгрия может стать обузой и возможной целью экспансионистской пропаганды и планов."
 rt56.rom_hun_invitation.2.a:0 "Их потеря."
 rt56.rom_anti_legionary_activity.1.t:0 "Антилегионерская активность усиливается"
 rt56.rom_anti_legionary_activity.1.d:0 "После объявления о победе Железной гвардии на выборах по Трансильвании прокатилась волна антилегионерских протестов. Пока они сравнительно малочисленны, но могут выйти из-под контроля, если позволить им разрастаться."
 rt56.rom_anti_legionary_activity.1.a:0 "Отправить Железную гвардию."
 rt56.rom_embargo.1.t:0 "Государство [FROM.GetNameDef] вводит эмбарго против экстремистских стран"
 rt56.rom_embargo.1.d:0 "The [FROM.GetAdjective] Правительство призвало к международным экономическим санкциям против фашистских европейских стран."
 rt56.rom_embargo.1.a:0 "Мы присоединимся."
 rt56.rom_embargo.1.b:0 "Наша экономика этого не переживёт."
 rt56.rom_bulg_pressure.1.t:0 "Государство [FROM.GetName] связывается с БКП"
 rt56.rom_bulg_pressure.1.d:0 "Рано утром нам сообщили, что агенты государства [FROM.GetName] установили контакты с представителями Отечественного фронта. Похоже, революционный режим в Бухаресте намерен распространять влияние за пределы собственных границ.\n\nКак нам следует отреагировать?"
 rt56.rom_bulg_pressure.1.a:0 "Отправить связного."
 rt56.rom_bulg_pressure.1.b:0 "Арестовать и судить их контакты."
 rt56.rom_bulg_pressure.11.t:0 "БКП проявляет интерес"
 rt56.rom_bulg_pressure.11.d:0 "После долгого ожидания мы наконец получили подтверждение, что Отечественный фронт действительно заинтересован в сотрудничестве. Теперь можно должным образом подготовиться к будущему перевороту, который принесёт революцию [BUL.GetAdjective]ому народу."
 rt56.rom_bulg_pressure.11.a:0 "Прекрасно, наши планы продолжатся."
 rt56.rom_bulg_pressure.21.t:0 "Наши контакты в БКП казнены"
 rt56.rom_bulg_pressure.21.d:0 "Нам стало известно, что контакты внутри Отечественного фронта были казнены после раскрытия нашего участия. Показательный процесс длился всего несколько минут, после чего каждого поставили перед расстрельной командой.\n\nТеперь возникает новый вопрос: что делать дальше?"
 rt56.rom_bulg_pressure.21.a:0 "Их время придёт."
 rt56.rom_bulg_pressure.21.b:0 "Тогда мы должны действовать!"
 rt56.rom_bulg_pressure.5.t:0 "Государство [FROM.GetNameDefCap] настаивает на официальной аннексии"
 rt56.rom_bulg_pressure.5.d:0 "По мере того как интеграция с государством [FROM.GetNameDef] становится всё теснее, [FROM.GetAdjective]ое правительство начало добиваться формального объединения в более крупное и сильное государство, способное обеспечить безопасность обоих народов."
 rt56.rom_bulg_pressure.5.a:0 "Всё вело именно к этому."
 rt56.rom_bulg_pressure.5.b:0 "Обстоятельства изменились."
 rt56.rom_bulg_pressure.51.t:0 "Государство [FROM.GetNameDefCap] официально аннексировано"
 rt56.rom_bulg_pressure.51.d:0 "Сегодня [FROM.GetAdjective]ая сторона публично объявила, что наши две страны объединяются в единое государство со столицей правительства в Бухаресте. Месяцы усиливающейся интеграции и огромный объём проделанной работы наконец привели нас к этому результату."
 rt56.rom_bulg_pressure.51.a:0 "Наконец-то объединение."
 rt56.rom_bulg_pressure.52.t:0 "Государство [FROM.GetNameDefCap] выходит из соглашения"
 rt56.rom_bulg_pressure.52.d:0 "Несмотря на прежнее согласие объединить наши страны и месяцы подготовки к этому дню, [BUL.GetAdjective]ое правительство, похоже, изменило решение и вышло из соглашения. Все месяцы работы оказались потрачены впустую."
 rt56.rom_bulg_pressure.52.a:0 "Как досадно."
 rt56.rom_codreanu.1.t:0 "Смерть Корнелиу Кодряну"
 rt56.rom_codreanu.1.d:0 "Рано утром поступило сообщение, что прошлой ночью политический агитатор Корнелиу Кодряну был застрелен во время предполагаемой стычки между группой нападавших, самим Кодряну и сопровождавшими его людьми. Местонахождение тел якобы неизвестно, а по мере распространения новости его верные последователи начали собираться на похороны, несмотря на отсутствие тела.\n\n"
 rt56.rom_codreanu.1.a:0 "Конец противоречивого человека."
 rt56.rom_comintern.1.t:0 "Государство [FROM.GetNameDefCap] просит независимости"
 rt56.rom_comintern.1.d:0 "The [FROM.GetAdjective] Правительство требует большей автономии, оставаясь нашим братским союзником в борьбе за освобождение мирового пролетариата."
 rt56.rom_comintern.1.a:0 "Как пожелаете."
 rt56.rom_comintern.1.b:0 "При одном условии."
 rt56.rom_comintern.1.c:0 "Ни в коем случае."
 rt56.rom_comintern.2.t:0 "Государство [FROM.GetNameDefCap] предоставляет нам независимость"
 rt56.rom_comintern.2.d:0 "Государство [FROM.GetNameDefCap] согласилось предоставить нам полную независимость во имя дружбы между нашими народами."
 rt56.rom_comintern.2.a:0 "Какая радость."
 rt56.rom_comintern.3.t:0 "Государство [FROM.GetNameDefCap] предоставляет нам частичную независимость"
 rt56.rom_comintern.3.d:0 "Государство [FROM.GetNameDefCap] согласилось расширить нашу автономию во имя дружбы между нашими народами."
 rt56.rom_comintern.3.a:0 "Не совсем то, о чём мы просили, но достаточно близко."
 rt56.rom_comintern.4.t:0 "Государство [FROM.GetNameDefCap] отклоняет нашу просьбу"
 rt56.rom_comintern.4.d:0 "Лидер [FROM.GetLeader] желает сохранить существующее положение и считает, что наша партия пока не готова самостоятельно организовывать плановую экономику."
 rt56.rom_comintern.4.a:0 "Значит, мы связаны."
 rt56.rom_trial.1.t:0 "Великий процесс [GetYear] года"
 rt56.rom_trial.1.d:0 "Политбюро Румынской коммунистической партии установило, что некоторые её члены подрывали наше дело и всё это время были врагами народа. Они не только ставили под сомнение партийную линию, но и осуждали демократический централизм. Мы обязаны осудить виновных и обеспечить соблюдение доктрины демократического централизма, быстро нейтрализовав подрывные элементы."
 rt56.rom_trial.1.a:0 "Борис Стефанов привёл нас сюда — ему и руководить."
 rt56.rom_trial.1.b:0 "Ана Паукер — истинная сталинистка, ей и руководить."
 rt56.rom_trial.1.c:0 "Георге Георгиу-Деж обещает процветающее будущее, ему и руководить."
 rt56.rom_trial.1.e:0 "Руководить должен Пэтрэшкану — нам также нужна самостоятельность."
 rt56.rom_trial.2.t:0 "Последний процесс"
 rt56.rom_trial.2.d:0 "Новая волна арестов потрясла высшее руководство революционной партии. Ану Паукер и Георге Георгиу-Дежа обвинили в отклонении от партийной линии. Влиятельная фракция обсуждает их исключение из партии."
 rt56.rom_trial.2.a:0 "Они могут остаться."
 rt56.rom_trial.2.b:0 "Ради стабильности они должны уйти."
 rt56.rom_rebirth.1.t:0 "Регионы требуют внутренних реформ"
 rt56.rom_rebirth.1.d:0 "После завершения Гражданской войны различные регионы представили перечень требований, выполнение которых, по их мнению, необходимо, чтобы Румыния стала настоящей балканской демократией.\n\nТребования варьируются от более широкого представительства на выборах до гарантированных прав меньшинств, проживающих в наших границах. Они также требуют гарантий политических свобод, которых лишились бы в случае победы революционеров."
 rt56.rom_rebirth.1.a:0 "Хорошо."
