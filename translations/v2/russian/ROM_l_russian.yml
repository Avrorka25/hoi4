 ROM_set_aeronautical_plants:0 "Авиационные заводы SET"
 ROM_set_aeronautical_plants_desc:0 ""
 ROM_romanian_naval_forces:0 "Военно-морские силы Румынии"
 ROM_romanian_naval_forces_desc:0 "Хотя флот Румынии не является важнейшим элементом национальной обороны, для сдерживания противников и демонстрации силы на Чёрном море ему необходима программа модернизации и расширения. Следует приступить к ней, как только мы будем готовы."
