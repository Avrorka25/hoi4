 r56_ROM_BUL_strengthen_fatherland_idea:0 "Укрепление Отечественного фронта"
 r56_ROM_BUL_removing_opposition_to_fatherland_idea:0 "Устранение оппозиции Отечественному фронту"
 r56_ROM_carol_idea:0 "Кароль II"
 r56_ROM_carol_idea_desc:0 "Король Кароль II известен дорогими вкусами и готовностью потакать ещё более расточительным желаниям своей любовницы. В прошлом он уже становился причиной крупных скандалов и, вероятно, продолжит это делать, если его не заменить или не заставить осознать ошибки."
 r56_ROM_michael_idea:0 "Михай I"
 r56_ROM_michael_idea_desc:0 "После вынужденного отречения Кароля II роль короля государства [ROM.GetNonIdeologyName] отошла на второй план, а вся реальная власть теперь сосредоточена в руках премьер-министра."
