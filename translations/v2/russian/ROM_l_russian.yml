 ROM_gold_extraction_idea_desc:0 "Надёжные запасы золота заметно улучшают экономическое положение."
 ROM_extensive_coal_mining_idea:0 "Масштабная добыча угля"
 ROM_extensive_coal_mining_idea_desc:0 "Развитая угольная промышленность позволяет производить больше стали и повышает выпуск фабрик."
 ROM_uranium_supply_idea:0 "Запасы урана"
 ROM_uranium_supply_idea_desc:0 "Стабильные поставки урана позволят ускорить ядерные исследования."
