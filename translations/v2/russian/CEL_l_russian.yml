 WLS_david_john_williams:0 "Дэвид Джон Уильямс"
 WLS_david_john_williams_desc:0 "Дэвид Джон Уильямс родился в 1885 году и вырос на небольшой ферме в Абернанте, недалеко от Ридкимеро. В 1902 году он покинул дом и четыре года работал на угольных шахтах Южного Уэльса. Позднее он возобновил обучение и в 1925 году помог основать Уэльскую национальную партию, более известную как «Плайд Камри». Уильямс также был известным автором коротких рассказов, и всё его творчество вдохновлялось представлением о сплочённом сообществе, где общие ценности придают значимость каждому человеку."
