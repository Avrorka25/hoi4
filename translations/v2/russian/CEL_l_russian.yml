l_russian:
 r56_celtic_focus:0 "Кельтские национальные фокусы"
 CEL_pro_union_movement:0 "Движение за союз"
 CEL_pro_union_movement_desc:0 "Народы, которые [ROOT.GetNonIdeologyName] по-прежнему глубоко разделены в вопросе о [ROOT.GetAdjective] суверенитета. Несмотря на независимость от [ENG.GetAdjective] была достигнута, значительная фракция, большинство [ROOT.GetAdjective] «Электорат по-прежнему выступает за возобновление союза и тесного сотрудничества с нашими соседями через границу». Это чувство вызвало всплеск политической напряженности, поскольку видение объединенного будущего с будущим. [ENG.GetAdjective] Столкновения с устремлениями националистов-независимцев."
 CEL_pro_union_movement_remove:0 "будет §GУдаленный§! один раз §Y[ROOT.GetNonIdeologyName]§! находится в §Yфракция§! с §Y[ENG.GetNameDef]§!, §Y[ROOT.GetNonIdeologyName]§! является §YТема§! из §Y[ENG.GetNameDef]§! или §Y[ENG.GetNameDef]§! не делает §Yсуществующий§!."
 CEL_domestic_ammunition_production:0 "[GetAmmoFocusName]"
 CEL_domestic_ammunition_production_desc:0 "Чтобы уменьшить влияние иностранных держав на наши вооружённые силы, мы должны производить собственные боеприпасы."
 CEL_domestic_artillery_production:0 "[GetArtiFocusName]"
 CEL_domestic_artillery_production_desc:0 "Мы должны развивать собственную огневую мощь, а также производство артиллерийских снарядов."
 CEL_domestic_tank_production:0 "[GetTankFocusName]"
 CEL_domestic_tank_production_desc:0 "Наступила новая эпоха войны, и, чтобы не погибнуть, мы должны к ней приспособиться!"
 CEL_spirit_of_the_army:0 "[GetSpiritFocusName]"
 CEL_spirit_of_the_army_desc:0 "Наши солдаты должны быть пылкими и отважными в бою, а наша задача — обучить их и направить к этой цели."
 CEL_mechanical_computing:0 "[GetTechFocusName]"
 CEL_mechanical_computing_desc:0 "Этот производитель электронного оборудования может оказаться крайне важен, если предоставить ему исследовательские гранты."
 CEL_naval_effort:0 "[GetNavyFocusName]"
 CEL_naval_effort_desc:0 "Чтобы обеспечить безопасность [ROOT.GetNonIdeologyName] и его народа, мы должны вкладываться в военно-морские проекты."
 CEL_establish_the_army:0 "Создать армию"
 CEL_establish_the_army_desc:0 "С нашим новым политическим статусом пришло время сформировать собственные части на основе бывших британских полков."
 CEL_industrial_modernization:0 "Промышленная модернизация"
 CEL_industrial_modernization_desc:0 "[ROOT.GetNonIdeologyName] должна сохранять статус современной промышленной страны, чтобы уверенно занимать своё место в мире."
 CEL_redesign_small_arms:0 "Модернизировать стрелковое оружие"
 CEL_redesign_small_arms_desc:0 "Чтобы обеспечить эффективность нашей пехоты, стрелковое оружие необходимо постоянно совершенствовать."
 CEL_motorization_plan:0 "План моторизации"
 CEL_motorization_plan_desc:0 "Быстрое развитие прорыва способно развалить фронт. Именно этого не хватало во время Великой войны."
 CEL_convert_north_british_locomotive_factory:0 "Завод «Норт Бритиш Локомотив»"
 CEL_convert_north_british_locomotive_factory_desc:0 "Этот локомотивный завод можно перепрофилировать на производство бронетехники."
 CEL_dalmuir_shells:0 "Снаряды Далмьюра"
 CEL_dalmuir_shells_desc:0 "Наша артиллерия будет снабжаться снарядами, произведёнными в Далмьюре."
 CEL_artillery_modernization:0 "Модернизация артиллерии"
 CEL_artillery_modernization_desc:0 "Артиллерия убивает, пехота занимает."
 CEL_new_tactics:0 "Новая тактика"
 CEL_new_tactics_desc:0 "Лобовые атаки хайлендеров хорошо работали в прошлом, но Великая война показала их несостоятельность. В наши дни только безумец пойдёт на войну с клеймором и луком."
 CEL_planning_staff:0 "Основать Военную академию [ROOT.Capital.GetCapitalVictoryPointName]"
 CEL_planning_staff_desc:0 "Подготовленный план, вероятно, лучше неподготовленного."
 CEL_expand_the_construction_sector:0 "Расширить строительный сектор"
 CEL_expand_the_construction_sector_desc:0 "Для строительства лучшей страны необходимы мощные строительные возможности."
 CEL_utilize_our_resources:0 "Использовать наши ресурсы"
 CEL_utilize_our_resources_desc:0 "Ресурсы [ROOT.GetNonIdeologyName] в значительной степени не освоены. Инвестиции в эти скрытые богатства значительно укрепят нашу экономику."
 CEL_support_steel_sector:0 "Поддержать сталелитейный сектор"
 CEL_support_steel_sector_desc:0 "Сталь! Сталь для пушек, танков, кораблей — для любого оружия войны!"
 CEL_support_light_industry:0 "Поддержать лёгкую промышленность"
 CEL_support_light_industry_desc:0 "Лёгкая промышленность необходима для здорового баланса нашей экономики."
 CEL_improve_national_infrastructure:0 "Улучшить национальную инфраструктуру"
 CEL_improve_national_infrastructure_desc:0 "Наши шахты и промышленность почти бесполезны без хорошей инфраструктурной сети, упрощающей экспорт ресурсов."
 CEL_industrial_research:0 "Промышленные исследования"
 CEL_industrial_research_desc:0 "Наша промышленность должна совершенствоваться."
 CEL_project_taranis:0 "Проект «Таранис»"
 CEL_project_taranis_desc:0 "Недавно учёные всего мира пришли к одному выводу: теоретически атом действительно можно расщепить, высвободив огромное количество энергии. Возможно, нам следует вложиться в дальнейшее изучение этого вопроса..."
 CEL_develop_aluminium_industry:0 "Переработка алюминиевой руды"
 CEL_develop_aluminium_industry_desc:0 "Необработанная алюминиевая руда бесполезна для военных нужд."
 CEL_substitution_technologies:0 "Технологии замещения"
 CEL_substitution_technologies_desc:0 "Поскольку импорт может оказаться под угрозой во время войны, следует рассмотреть технологии замещения, например сжижение угля."
 CEL_establish_special_forces:0 "Создать силы специального назначения"
 CEL_establish_special_forces_desc:0 "Самых храбрых или самых безумных из нас следует тщательно отобрать для элитных частей, способных при необходимости бесшумно убивать врага даже луками."
 CEL_modern_logistics:0 "Современная логистика"
 CEL_modern_logistics_desc:0 "Без снабжения армия не может сражаться. Поэтому современная логистика жизненно важна для современной армии."
 CEL_signal_companies:0 "Роты связи"
 CEL_signal_companies_desc:0 "Связь, связь и ещё раз связь."
 CEL_field_hospitals:0 "Полевые госпитали"
 CEL_field_hospitals_desc:0 "Вылеченный солдат ещё может быть полезен обществу. Мёртвый — нет."
 CEL_mechanization_effort:0 "Механизация"
 CEL_mechanization_effort_desc:0 "Компромисс между танком и грузовиком позволит быстро и эффективно доставлять наши войска в бой."
 CEL_aviation_air_academy:0 "[ROOT.GetAdjective] авиационная академия"
 CEL_aviation_air_academy_desc:0 "[ROOT.GetAdjective] авиация должна стать отправной точкой инфраструктуры наших военно-воздушных сил."
 CEL_build_trainer_aircrafts:0 "Строить учебные самолёты"
 CEL_build_trainer_aircrafts_desc:0 "Прежде чем проектировать полноценный истребитель, разумнее начать с учебного прототипа."
 CEL_bimotor_aircrafts:0 "Двухмоторные самолёты"
 CEL_bimotor_aircrafts_desc:0 "Крупные самолёты — будущее. Разве не говорили, что бомбардировщик всегда прорвётся?"
 CEL_train_pilots:0 "Обучать пилотов"
 CEL_train_pilots_desc:0 "Как можно рассчитывать на действующие военно-воздушные силы без пилотов?"
 CEL_train_mechanics:0 "Обучать механиков"
 CEL_train_mechanics_desc:0 "Как можно рассчитывать на действующие военно-воздушные силы без механиков?"
 CEL_support_designers_innovations:0 "Поддержать инновации конструкторов"
 CEL_support_designers_innovations_desc:0 "Экспериментальные прототипы иногда приводят к выдающимся усовершенствованиям."
 CEL_naval_aviation:0 "Морская авиация"
 CEL_naval_aviation_desc:0 "В эпоху авианосцев самолёты, приспособленные к морской войне, становятся необходимостью."
 CEL_refine_air_doctrine:0 "Усовершенствовать воздушную доктрину"
 CEL_refine_air_doctrine_desc:0 "Опыт даёт нам лучшее понимание воздушной войны."
 CEL_radar_network:0 "Радарная сеть"
 CEL_radar_network_desc:0 "Раннее обнаружение противника позволяет гораздо эффективнее бороться с угрозами."
 CEL_the_shipyard_of_the_world:0 "Верфь мира"
 CEL_the_shipyard_of_the_world_desc:0 "Благодаря многочисленным огромным верфям, способным строить торговые и военные корабли для всего мира, [ROOT.GetNonIdeologyName] поистине является мировой верфью."
 CEL_shipbuilding_contacts:0 "Связи с судостроителями"
 CEL_shipbuilding_contacts_desc:0 "Поддержка верфей необходима, если мы хотим, чтобы они работали на наши военные нужды."
 CEL_national_admiralty:0 "Национальное адмиралтейство"
 CEL_national_admiralty_desc:0 "Нашему флоту нужен аналог армейского генерального штаба."
 CEL_the_fleet_of_old:0 "Флот старой школы"
 CEL_the_fleet_of_old_desc:0 "Линкоры станут основой нашего флота."
 CEL_battleship_focus:0 "Ставка на линкоры"
 CEL_battleship_focus_desc:0 "Большие орудия для больших кораблей. Четыре трёхорудийные башни: две в носу и две в корме."
 CEL_the_biggest_battleship:0 "Самый большой линкор"
 CEL_the_biggest_battleship_desc:0 "Зачем подражать линкорам других держав, если мы можем построить ещё больший?"
 CEL_the_blocade_doctrine:0 "Доктрина блокады"
 CEL_the_blocade_doctrine_desc:0 "Если мы потопим достаточно вражеских конвоев, то сможем подорвать их экономику."
 CEL_silent_service:0 "Безмолвная служба"
 CEL_silent_service_desc:0 "Для успеха разработанного плана необходимы современные подводные лодки."
 CEL_domestic_torpedo_production:0 "Отечественное производство торпед"
 CEL_domestic_torpedo_production_desc:0 "Чтобы наши подводные лодки и эсминцы были эффективны, им нужно чем-то стрелять."
 CEL_stealth_upgrades:0 "Улучшение скрытности"
 CEL_stealth_upgrades_desc:0 "Более скрытные подводные лодки смогут эффективнее сближаться с беззащитными вражескими конвоями."
 CEL_carrier_strikes:0 "Авианосные удары"
 CEL_carrier_strikes_desc:0 "Новая эпоха морской войны требует не только господства на море, но и превосходства в воздухе над полем боя, поэтому мы должны развивать авианосцы, чтобы защищать корабли и наносить врагу ещё более мощные удары."
 CEL_naval_air_groups:0 "Группы морской авиации"
 CEL_naval_air_groups_desc:0 "Чтобы наши авианосцы были эффективны, нам также нужно чем-то их оснащать."
 CEL_lessons_for_the_air_force:0 "Уроки для военно-воздушных сил"
 CEL_lessons_for_the_air_force_desc:0 "Наши эксперименты с морской авиацией могут оказаться полезными и для военно-воздушных сил."
 CEL_cruiser_focus:0 "Современные крейсеры"
 CEL_cruiser_focus_desc:0 "Новая эпоха приносит современное вооружение, современную броню и всё остальное, что позволит улучшить наши крейсеры."
 CEL_destroyer_focus:0 "Современные эсминцы"
 CEL_destroyer_focus_desc:0 "Новая эпоха приносит современные двигатели, гидрофоны, мины и всё остальное, что позволит улучшить наши эсминцы."
 CEL_increase_naval_production:0 "Увеличить кораблестроение"
 CEL_increase_naval_production_desc:0 "Нашему кораблестроению требуется небольшое повышение эффективности, чтобы сравниться с великими державами, и именно это мы должны ему обеспечить."
 CEL_a_s_warfare:0 "Противолодочная война"
 CEL_a_s_warfare_desc:0 "Современная морская война показала уязвимость конвоев и лёгких кораблей перед подводными лодками, охотящимися волчьими стаями. Мы должны устранить эту недавно выявленную слабость и развить возможности противолодочной борьбы."
 CEL_naval_mine_warfare:0 "Минная война на море"
 CEL_naval_mine_warfare_desc:0 "Чтобы лишить врага господства на море, разумно использовать минную войну."
 CEL_francois_recruited:0 "Вы обратились к бардовским кругам... что бы это ни значило."
 is_cel_tt:0 "Объединены все §Yкельтские§! земли"
 CEL_celtic_unification:0 "Кельтское объединение"
 CEL_celtic_unification_desc:0 "После столетий жизни под английской и французской властью кельтские народы наконец объединены!"
 CEL_strengthen_shipping_routes:0 "Укрепить морские торговые пути"
 CEL_strengthen_shipping_routes_desc:0 "Теперь мы контролируем некоторые из важнейших морских путей мира. Мы можем использовать это в своих интересах."
 CEL_naval_buildup:0 "Наращивание флота"
 CEL_naval_buildup_desc:0 "Учитывая земли, которыми мы владеем, для защиты от внешних угроз необходимо сильное военно-морское присутствие. Логично начать наращивание флота!"
 CEL_celtic_carriers:0 "Кельтские авианосцы"
 CEL_celtic_carriers_desc:0 "Мы должны защищать кельтский народ любой ценой! Строительство авианосцев позволит доставлять подкрепления на наши территории в случае нападения."
 CEL_defend_union:0 "Защитить союз"
 CEL_defend_union_desc:0 "После недавнего создания Кельтской армии мы должны укрепить её боевой дух. Мы будем защищать свои земли до самого конца!"
 CEL_rule_the_air:0 "Небо правит морями"
 CEL_rule_the_air_desc:0 "Наши территории со всех сторон окружены водой, поэтому Кельтскому флоту необходима дополнительная поддержка с воздуха! Это способно переломить ход любого будущего морского сражения."
 CEL_go_for_galicia:0 "Взяться за Галисию"
 CEL_go_for_galicia_desc:0 "Галисия слишком долго находилась не в тех руках. Пришло время захватить её и интегрировать в союз!"
 CEL_celtic_unity:0 "От Хайленда до Иберии"
 CEL_celtic_unity_desc:0 "Мы — Кельтский союз! Мы сильнее и сплочённее, чем когда-либо! Мы будем сражаться за земли, которые принадлежат нам по праву!"
 CEL_integrate_areas:0 "Кельтская интеграция"
 CEL_integrate_areas_desc:0 "После объединения всех кельтских земель следующим логичным шагом станет полная интеграция всех регионов и их ресурсов в союз."
 CEL_scottish_steel_sector:0 "Шотландские сталелитейные заводы"
 CEL_scottish_steel_sector_desc:0 "Шотландский сталелитейный сектор жизненно важен для нашего промышленного развития."
 CEL_develop_the_shale_oil_sector:0 "Развивать сланцевую нефтяную промышленность"
 CEL_develop_the_shale_oil_sector_desc:0 "Шотландская сланцевая нефтяная промышленность поможет нам добиться энергетической независимости."
 CEL_dingham_ammunition_factory:0 "Боеприпасный завод Дингхэм"
 CEL_dingham_ammunition_factory_desc:0 "Завод Дингхэм обладает всеми возможностями, чтобы стать центром нашего производства вооружений в Шотландии."
 CEL_develop_ireland:0 "Развивать Ирландию"
 CEL_develop_ireland_desc:0 "Ирландия, Изумрудный остров, обладает множеством ценных промышленных комплексов и ресурсов, которыми было бы неразумно пренебрегать! "
 CEL_appropriate_harland_and_wolff:0 "Присвоить «Харланд энд Вольф»"
 CEL_appropriate_harland_and_wolff_desc:0 "Верфи и заводы «Харланд энд Вольф» могут стать ценным вложением в усиление наших военно-морских сил."
 CEL_brittany_industry:0 "Развивать Бретань"
 CEL_brittany_industry_desc:0 "Все части нашего Кельтского союза должны быть одинаково развиты. Это относится к Ирландии, Шотландии, Уэльсу и Бретани, вновь воссоединившейся с Родиной."
 CEL_morgan_line:0 "Создать линию Моргана"
 CEL_morgan_line_desc:0 "Недавно построенная линия укреплений Моргана защитит наших граждан от любой угрозы с континента."
 CEL_Brest_Oil_Industry:0 "Нефтяная промышленность Бреста"
 CEL_Brest_Oil_Industry_desc:0 "Крупнейший бретонский город Брест также является важным торговым портом и военно-морской базой, защищающей Бискайский залив и Ла-Манш. Новейшая программа расширения порта предусматривает строительство нескольких нефтяных терминалов."
 CEL_coal_mining:0 "Уэльская угледобыча"
 CEL_coal_mining_desc:0 "Уэльс обладает одним из крупнейших угольных бассейнов мира. Мы должны сделать всё, чтобы он сохранял ведущие позиции."
 CEL_newport_artillery:0 "Ньюпортская артиллерия"
 CEL_newport_artillery_desc:0 "Мы построим в Ньюпорте завод, специализирующийся на разработке зенитного и противотанкового оружия. Это значительно поможет развитию нашей артиллерии."
 WLS_steel_company_of_wales:0 "Стил Компани оф Уэльс"
 WLS_generic_industrial_concern:0 "Ричард Томас энд Ко Лтд"
 WLS_generic_electronics_concern:0 "Смитс Инструментс"
 WLS_generic_artillery_manufacturer:0 "РОФ Ньюпорт"
 WLS_generic_infantry_equipment_manufacturer:0 "РОФ Хирвайн"
 WLS_generic_tank_manufacturer:0 "РОФ Кардифф"
 WLS_generic_heavy_aircraft_manufacturer:0 "РОФ Гласкоед"
 WLS_generic_light_aircraft_manufacturer:0 "Эклс энд Поллок"
 WLS_generic_medium_aircraft_manufacturer:0 "Виккерс Хаварден Фэктори"
