l_russian:
 r56w.event.30.t:0 "Странная книга"
 r56w.event.30.d:0 "Недавно в наши руки попали весьма необычные трофеи, самым примечательным из которых стала древняя книга, покрытая загадочными и причудливыми символами. Некоторые наши учёные полагают, что её стоит изучить, тогда как другие считают, что это может быть всего лишь мистификацией."
 r56w.event.30.a:0 "Связаться с тёмными силами? Я в деле!"
 r56w.event.30.b:0 "Нет, спасибо."
 r56w.event.31.t:0 "Отчёт наших учёных"
 r56w.event.31.d:0 "После некоторого изучения стало ясно, что книга описывает сложный ритуал, позволяющий обрести огромную силу. Для него требуются большие количества ароматических свечей, чёрный кот и очень много обогащённого урана.\n\n Вместе с переводом ритуала обнаружилось загадочное проклятие: \"Внимание! Если продолжить, это серьёзно испортит вашу игру и приведёт к чему-то очень глупому. Если сомневаетесь — сохранитесь сейчас.\" \n\nПродолжить или полностью отказаться от этого пути?"
 r56w.event.31.a:0 "Я ем опасность на завтрак."
 r56w.event.31.b:0 "...но историчность!"
 r56w.event.32.t:0 "Пространственное искажение"
 r56w.event.32.d:0 "Наши учёные провели ритуал в точности по инструкции. К сожалению, это вызвало небольшой ядерный ад, который, похоже, разорвал ткань пространства и времени. Из искажения хлынула армия существ, оттеснившая наши войска. Мы потеряли территорию Орегона, а вместе с ней и часть национального достоинства."
 r56w.event.32.a:0 "Вот д***мо."
 r56w.event.33.t:0 "Странные события"
 r56w.event.33.d:0 "Из Северной Америки поступают сообщения о необычной активности. Оккупационные силы отрицают любые странные предположения, однако их позицию несколько подрывает внезапный и довольно беспорядочный уход с территории Орегона. Только время покажет, что произошло на самом деле."
 r56w.event.33.a:0 "Интересно, что там происходит?"
 r56w.event.34.t:0 "Дипломатическая инициатива"
 r56w.event.34.d:0 "К нашим дверям прибыл представитель чудовищ и вежливо попросил встречи с вами. Хотя их язык странен и загадочен, нам удалось разобрать единственный вопрос:\n\n\"Можно?\""
 r56w.event.34.a:0 "Всё это слишком глупо. Ничего не отвечать!"
 r56w.event.34.b:0 "Можно... войну!"
 r56w.event.34.c:0 "Да, конечно. Без разницы."
 r56w.event.35.t:0 "Невозможная победа"
 r56w.event.35.d:0 "Армия чудовищ, неизвестно откуда явившаяся в наш мир, была разгромлена. Они пытались сеять хаос, но в конечном счёте их усилия оказались напрасны. Сегодня мир стал спокойнее и чуть разумнее."
 r56w.event.35.a:0 "Всё равно они были жутко имбовыми."
 r56w.event.36.t:0 "Военные игры"
 r56w.event.36.d:0 "Наше военное руководство играет в игру, чтобы определить, какую страну нам следует попытаться завоевать следующей. Если захотим, результат можно сделать обязательным и немедленно воплотить в жизнь."
 r56w.event.36.a:0 "Звучит вполне законно."
 r56w.event.36.b:0 "Может, позже..."
 r56w.event.36.c:0 "Хватит спрашивать!"
 r56w.event.37.t:0 "Они сделали что?"
 r56w.event.37.d:0 ""
 r56w.event.37.a:0 "Да!"
 r56w.event.38.t:0 "Бритва правосудия"
 r56w.event.38.d:0 "Наши министры предложили дерзкий план, чтобы немного сбить спесь с одного из наших врагов. Пора нанести удар по самому Адольфу Гитлеру и научить его ценить хорошее бритьё. \n\nНаши агенты готовы. Попробуем провести эту операцию?"
 r56w.event.38.a:0 "Звучит чудесно!"
 r56w.event.38.b:0 "Не сейчас."
 r56w.event.38.c:0 "Глупое предложение."
 r56w.event.40.t:0 "Катастрофа с усами"
 r56w.event.40.d:0 "Сегодня утром лидер Германского рейха проснулся и обнаружил, что над его растительностью на лице совершено настоящее злодеяние. Фюрер был вне себя от ярости и объявил, что отныне все усы запрещены, пока его собственные не отрастут вновь."
 r56w.event.40.a:0 "Национальный памятник осквернён."
 r56w.event.41.t:0 "Простое предложение"
 r56w.event.41.d:0 "Один из наших министров предложил дерзкий план внедрения агента в европейские силы. Что будем делать?"
 r56w.event.41.a:0 "Финансировать!"
 r56w.event.41.b:0 "Нет, спасибо. Я предпочитаю блинчики."
 r56w.event.42.t:0 "Доклад нашего агента"
 r56w.event.42.d:0 "Министр Думающая Вафля отчитался и уже прошёл необходимые изменения, чтобы слиться с бельгийским обществом. Теперь, став наполовину оборотнем, наполовину вафлей, он может нападать ночью и оставаться вкусным днём."
 r56w.event.42.a:0 "Гениально!"
 r56w.event.44.t:0 "Вкусная революция"
 r56w.event.44.d:0 "В Бельгии недавно совершенно неожиданно сменилось руководство. На пресс-конференции выступило нечто, похожее на разумную вафлю, которое затем превратилось в волка и растерзало стоявшего рядом заместителя министра. Обозреватели пока не знают, какой будет международная политика нового лидера, но сироп в ней почти наверняка не предусмотрен."
 r56w.event.44.a:0 "Завтрак уже никогда не будет прежним."
 r56w.event.45.t:0 "Доброе дело"
 r56w.event.45.d:0 "Прогуливаясь по длинной лондонской улице, Грейтэксперимент заметил бездомного котёнка. Тот тихо мяукнул, а затем попросил сигару. Пожалуй, его можно усыновить?"
 r56w.event.45.a:0 "Да! Да здравствует хаос!"
 r56w.event.45.b:0 "Нееет! Непредвиденные последствия!"
 r56w.event.46.t:0 "Недостаточно кошачьей мяты"
 r56w.event.46.d:0 "Ночью курящий сигары кот исчез из президентского дворца. Позже была найдена странная записка, в которой говорилось о необходимости завести лоток побольше."
 r56w.event.46.a:0 "Чувствую сюжетный поворот."
 r56w.event.48.t:0 "Восстание фантастических пушистиков"
 r56w.event.48.d:0 "Глубоко в пустынях Саудовской Аравии из ниоткуда появилась грозная и слегка раздражённая армия. Провозгласив своё существование и захватив территорию, они немедленно потребовали тунца и чтобы их гладили, когда они это разрешают."
 r56w.event.48.a:0 "Невозмурржно!"
 r56w.event.49.t:0 "Выпустить Крэйгена!"
 r56w.event.49.d:0 "Появился человек, утверждающий, что он супершпион из далёкого будущего. Не предоставив никаких подробностей и объяснений, он заявляет, что ради сохранения временной линии ему жизненно необходимо позволить захватить Тибет. От этого зависит судьба мира."
 r56w.event.49.a:0 "Да, конечно. Без разницы."
 r56w.event.49.b:0 "Пустить его на клей."
 r56w.event.51.t:0 "Грядёт нечто пушистое"
 r56w.event.51.d:0 "Недавно Грейтэксперимент решил отправиться в отпуск в Британию. Во время прогулки он наткнулся на довольно странную и подозрительную куклу, прятавшуюся за телефонной будкой. \n\n\"Надо бы наполнить эту штуку магией, чтобы она захватила страну и устроила полный хаос\", — сказал себе Грейтэксперимент."
 r56w.event.51.a:0 "Да, почему бы и нет?"
 r56w.event.51.b:0 "Не-а. Бросить её в реку."
 r56w.event.53.t:0 "Рука у власти"
 r56w.event.53.d:0 "По причинам, совершенно недоступным пониманию, суверенное правительство [ENG.GetNameDef], похоже, решило передать всю власть в фетровые руки разумной куклы. Боже, храни нас всех."
 r56w.event.53.a:0 "Вот такая политика."
 r56w.event.100.t:0 "Любопытная дверь"
 r56w.event.100.desc:0 "Сегодня в Рейхсканцелярии Бальдур фон Ширах предложил фюреру собственный проект строительства Германии.\n\nВсегда готовый обсуждать вопросы культуры, он втайне разработал новый тип двери, вызвавший споры в ближайшем окружении Гитлера. Альберт Шпеер считает этот проект недостойным столицы Европы. В то же время ходят слухи, что Гиммлер восхищается отсылками к скандинавской мифологии и считает их \"подлинно германскими\".\n\nСегодня Рейхсканцелярия не выполнила ни одной важной работы, поскольку всё нацистское руководство было слишком занято обсуждением Врат Бальдура."
 r56w.event.100.a:0 "Отправить чертежи Арно Брекеру."
 r56w.event.101.t:0 "Замечен танк «Комета»!"
 r56w.event.101.desc:0 "Когда экспериментальный вариант нашего нового танка «Комета» проезжал слишком близко к границе военной базы Бовингтон, его случайно заметили несколько проходивших мимо гражданских. Мы должны действовать быстро, чтобы дело было улажено с необходимой осторожностью. Военная полиция, понятное дело, раздражена, а механик-водитель танка, несомненно, получит выговор.\n\nЕсли болтливый язык топит корабли, то он способен пробить и броню."
 r56w.event.101.a:0 "Сделаем несколько звонков."
