l_russian:
 r56rp_specops_combined_1:0 "Строгое обучение"
 r56rp_specops_combined_1_desc:0 "Постоянно тренируясь и готовясь к любому сценарию, наши спецназовцы могут лучше поражать любые цели."
 r56rp_specops_combined_2:0 "Жестокое обучение"
 r56rp_specops_combined_2_desc:0 "Наши враги не будут добры к нашим SpecOps. Мы должны подготовить их к жестокости войны, даже если такое обращение может быть сочтено «варварским» гражданским населением."
 r56rp_specops_combined_3:0 "Современные методы обучения"
 r56rp_specops_combined_3_desc:0 "С появлением новых методов обучения наши силы SpecOps не будут ни наклоняться, ни ломаться против вражеского натиска."
 r56rp_gyro_gunsights_bba:0 "Гироскопические прицелы"
 r56rp_gyro_gunsights_bba_desc:0 "Отражательное зрение, соединенное с простым калькулятором. После ввода дальности и размера вражеского самолета, падение пули и требуемый свинец рассчитываются автоматически и отображаются для пилота."
 r56rp_gyro_gunsights:0 "$r56rp_gyro_gunsights_bba$"
 r56rp_gyro_gunsights_desc:0 "$r56rp_gyro_gunsights_bba_desc$"
 r56rp_radar_gunsights_bba:0 "Радарные оружейные прицелы"
 r56rp_radar_gunsights_bba_desc:0 "В то время как гироскопическое прицеливание само по себе не является новой идеей, передача информации о дальности для него автоматически бортовым радаром. Это значительно повысит точность наших пилотов, а также позволит использовать боеприпасы без трассировки."
 r56rp_radar_gunsights:0 "$r56rp_radar_gunsights_bba$"
 r56rp_radar_gunsights_desc:0 "$r56rp_radar_gunsights_bba_desc$"
 r56rp_air_to_air_nukes_bba:0 "Ядерные ракеты класса «воздух-воздух»"
 r56rp_air_to_air_nukes_bba_desc:0 "С недавним прогрессом в миниатюризации ядерных боеголовок мы теперь можем производить относительно легкую ракету класса «воздух-воздух» с огромной огневой мощью. Такая ракета довольно дорогая, но одна может надежно справиться с большим формированием вражеских бомбардировщиков."
 r56rp_air_to_air_nukes:0 "$r56rp_air_to_air_nukes_bba$"
 r56rp_air_to_air_nukes_desc:0 "$r56rp_air_to_air_nukes_bba_desc$"
 r56rp_nucular_depth_charge_mtg:0 "Обвинения в ядерной глубине"
 r56rp_nucular_depth_charge_mtg_desc:0 "Все, что создает ударную волну под водой, можно использовать в качестве глубинного заряда. Ничто не может подавить ударную волну, создаваемую ядерным устройством. Более дорогой по сравнению с обычными взрывчатыми веществами, однако непревзойденной в нем огневой мощи."
 r56rp_nucular_depth_charge:0 "$r56rp_nucular_depth_charge_mtg$"
 r56rp_nucular_depth_charge_desc:0 "$r56rp_nucular_depth_charge_mtg_desc$"
 r56rp_modern_rangefinder:0 "Современные противопожарные системы"
 r56rp_modern_rangefinder_desc:0 "С увеличением вычислительной мощности механических калькуляторов, а также с постоянно растущей точностью систем дальномерной разведки мы можем не только увеличить производительность наших корабельных систем, но и сделать миниатюрную систему FCS для наших танков."
 r56rp_airborne_rocketry:0 "Воздушно-десантная ракета"
 r56rp_airborne_rocketry_desc:0 "Поскольку ракетные двигатели становятся более надежными и простыми в изготовлении, мы можем рассмотреть возможность их использования в военных целях."
 r56rp_aa_rocket_rails:0 "Ракеты класса «воздух-воздух»"
 r56rp_aa_rocket_rails_desc:0 "Бомбардировщики противника все более и более устойчивы к оружию малого и среднего калибра. Чтобы исправить это, мы можем вооружить наши истребители неуправляемыми ракетами большого калибра."
 r56rp_aa_rocket_rails_2:0 "Ракеты класса \"воздух-воздух\""
 r56rp_aa_rocket_rails_2_desc:0 "Устанавливая современную электронику в наши ракеты, мы можем направлять их к воздушным целям противника, что значительно увеличивает вероятность поражения."
 r56rp_armor_upgrade_1:0 "Низкая плотность бронирования"
 r56rp_armor_upgrade_1_desc:0 ""
 r56rp_armor_upgrade_1_tt:0 "Позволяет модернизировать броню до уровня 1"
 r56rp_armor_upgrade_2:0 "Отчеты Battlefield"
 r56rp_armor_upgrade_2_desc:0 ""
 r56rp_armor_upgrade_2_tt:0 "Позволяет модернизировать броню до уровня 2"
 r56rp_armor_upgrade_3:0 "Выживший Биас"
 r56rp_armor_upgrade_3_desc:0 ""
 r56rp_armor_upgrade_3_tt:0 "Позволяет модернизировать броню до уровня 3"
 r56rp_armor_upgrade_4:0 "Современные сплавы"
 r56rp_armor_upgrade_4_desc:0 ""
 r56rp_armor_upgrade_4_tt:0 "Позволяет модернизировать броню до уровня 5"
 r56rp_speed_wings:0 "Крылья для околозвуковых скоростей"
 r56rp_speed_wings_desc:0 "Достижение скорости звука может звучать как научная фантастика, и это действительно создает много трудностей. Воздух на таких высоких скоростях значительно нагревает компоненты самолёта и переход от суб- до сверхзвуковых скоростей сопровождается огромной ударной волной."
 r56rp_wing_flyingwing:0 "Летающее крыло"
 r56rp_wing_flyingwing_desc:0 "Еще одна радикальная идея. Размещая все необходимое оборудование в главном крыле и перемещая некоторую авионику, мы можем полностью избавиться от фюзеляжа и выделенного хвоста, уменьшая сопротивление и повышая топливную экономичность. Такой дизайн сложно пилотировать из-за его новизны."
 r56rp_guided_anti_ship_bomb:0 "Противокорабельная планирующая бомба"
 r56rp_guided_anti_ship_bomb_desc:0 "Позволяя нашим бомбардировщикам дистанционно управлять своими бомбами, мы можем достичь беспрецедентного уровня точности против надводных целей. Это поможет нашим бомбардировщикам атаковать морские цели с безопасной высоты."
 r56rp_ir_guided_bombs:0 "Бомбы с инфракрасным наведением"
 r56rp_ir_guided_bombs_desc:0 "Изнашиваемое наведение позволяет бомбам проникать в источники тепла, такие как заводы и корабли."
 r56rp_improved_ir_guided_bombs:0 "Усовершенствованное инфракрасное наведение"
 r56rp_improved_ir_guided_bombs_desc:0 "Улучшения для искателей и наведения повышают точность и эффективность ИК-бомб против наземных целей."
 r56rp_aa_hmg_2:0 "Скорострельный крупнокалиберный пулемёт"
 r56rp_aa_hmg_2_desc:0 "В то время как наши предыдущие тяжелые пулеметы оказались способными сбивать вражеские самолеты, объем огня был признан недостаточным. Увеличение количества свинца, которое мы выбрасываем, увеличивает наш шанс нанести удар, а также наносит больший ущерб более устойчивым и менее маневренным вражеским подразделениям."
 r56rp_aa_cannon_4:0 "Шрэге Мусик"
 r56rp_aa_cannon_4_desc:0 "Смонтировав дополнительные пушки в фюзеляже, мы можем безопасно атаковать вражеские бомбардировщики снизу."
 r56rp_armor_tech_6:0 "Комбинированная броня"
 r56rp_armor_tech_6_desc:0 "С появлением современных химических боеприпасов сталь не может идти в ногу. Наши инженеры предложили использовать как керамику, так и сталь в слоях. Несмотря на более высокую стоимость, эта компоновка брони обеспечивает значительно большую защиту для того же веса брони по сравнению с чистой сталью."
 r56rp_ostketten:0 "Широкие гусеницы"
 r56rp_ostketten_desc:0 "В то время как стандартные трассы подходят для прочных грунтовых или мощеных дорог, грязь и снег оказались другой проблемой.  Увеличение ширины гусениц должно помочь нашим танкам, уменьшив проблему."
 r56rp_improved_crew_ergonomics:0 "Улучшенная эргономика экипажа"
 r56rp_improved_crew_ergonomics_desc:0 "Небольшие корректировки в компоновке салона танка, а также комфорт экипажа уменьшат усталость экипажа и позволят обеспечить более длительную пиковую производительность каждого отдельного члена экипажа."
 r56rp_improved_transmission:0 "Усовершенствованная трансмиссия"
 r56rp_improved_transmission_desc:0 "Улучшенные сплавы, отлаженная компоновка и новые смазочные материалы повысят производительность и надежность наших трансмиссий."
 r56rp_commander_cupola:0 "Командирская башенка"
 r56rp_commander_cupola_desc:0 "Добавление небольшой башни с бронированными смотровыми щелями к верхней части танка увеличит ситуационную стойкость танка, позволяя командиру беспрепятственно смотреть вокруг танка, не подвергая себя чрезмерной опасности."
 r56rp_strentghened_mantlets:0 "Утолщённые маски орудий"
 r56rp_strentghened_mantlets_desc:0 "Увеличение толщины стали вокруг пушки обеспечит башню, а вооружение будет адекватно защищено от современных боеприпасов."
 r56rp_automated_turret_traverse:0 "Механизированный привод поворота башни"
 r56rp_automated_turret_traverse_desc:0 "Используя электрические или гидравлические двигатели, мы можем значительно увеличить скорость вращения башни, не жертвуя точностью наводчика."
 r56rp_expanded_ready_racks:0 "Увеличенные укладки готовых боеприпасов"
 r56rp_expanded_ready_racks_desc:0 "Перестраивая планировку башни, мы можем увеличить количество боеприпасов, легко достижимых для наводчика, продлевая время пиковой скорости стрельбы для танка."
 r56rp_advanced_armor_techniques:0 "Усовершенствованные методы бронирования"
 r56rp_advanced_armor_techniques_desc:0 "Мы можем улучшить бронезащиту танка, используя радикально новые макеты брони при незначительном увеличении стоимости."
 r56rp_sam_1:0 "Зенитные ракеты"
 r56rp_sam_1_desc:0 "Возможность дистанционного управления нашим противовоздушным боеприпасом сводит на нет некоторые преимущества самолета и обеспечивает более высокое соотношение потерь. Из-за своего веса ЗРК пока не поддаются поэтапному развертыванию для нашей пехоты и транспортных средств, однако у кораблей такой проблемы нет."
