 RUT_trade_treaty_with_hungary:0 "Русинско-венгерская торговля"
 RUT_ROM_diplomacy_focus:0 "Русинско-румынские отношения"
 RUT_POL_diplomacy_focus:0 "Русинско-польские отношения"
 RUT_carpathian_sich:0 "Сформировать Карпатскую Сечь"
 RUT_carpathian_sich_desc:0 "Пора организовать собственные национальные вооружённые силы. Этот зародыш армии будет называться «Сечь» — в память о добровольцах Западно-Украинской Народной Республики."
 RUT_equipment_effort:0 "Улучшить пехотное снаряжение"
 RUT_equipment_effort_desc:0 "Важной частью превращения Карпатской Сечи в профессиональную армию станет стандартизация пехотного снаряжения и подготовки, что повысит эффективность и надёжность наших военнослужащих."
 RUT_offensive_weapons_focus:0 "Наступательное пехотное вооружение"
 RUT_offensive_weapons_focus_desc:0 "Конец Великой войны показал, что будущее за автоматическим оружием, и мы должны вооружить им хотя бы часть своих войск."
 RUT_mountain_brigades:0 "Горные бригады"
 RUT_mountain_brigades_desc:0 "Мы находимся у подножия Карпатских гор. Эти горы — наше убежище, но именно здесь нам предстоит научиться сражаться."
 RUT_recon_companies:0 "Разведывательные подразделения"
 RUT_recon_companies_desc:0 "Успешные военные операции возможны лишь при наличии надёжных сведений о текущей обстановке. Разведывательные роты — важнейшая часть современной войны."
 RUT_engineer_effort:0 "Военные инженеры"
 RUT_engineer_effort_desc:0 "Солдат на открытой местности уязвим. Чтобы надёжно его защитить, нужны сапёры, способные возвести укрепления. Укреплённую позицию противника трудно преодолеть, и для её уничтожения, скорее всего, тоже понадобятся инженеры. Вывод прост: в любой ситуации нельзя забывать о хорошо подготовленных сапёрах."
 RUT_support_bonus:0 "Оружие поддержки"
 RUT_support_bonus_desc:0 "Чтобы остановить и сдержать наступление противника, наша пехота должна обладать достаточной огневой мощью, способной затруднить его продвижение и подготовить контратаку. Тяжёлое вооружение, такое как пулемёты и мобильные миномёты, незаменимо как в наступлении, так и в обороне."
 RUT_motorization_effort:0 "Эксперименты с моторизацией"
 RUT_motorization_effort_desc:0 "Скорость станет решающим фактором в грядущей войне, поэтому нам необходимо создать моторизованный корпус, способный выполнять эту задачу."
 RUT_doctrine_effort:0 "Пересмотреть тактику"
 RUT_doctrine_effort_desc:0 "Военная теория непрерывно развивается в последние годы, и мы должны приложить все усилия, чтобы не отставать от новейших достижений."
 RUT_conscript_management_focus:0 "Управление призывниками"
 RUT_conscript_management_focus_desc:0 "Главная задача при создании эффективной армии — превратить призванных гражданских в боеспособных солдат. Необходимо установить строгую дисциплину и укоренить в сознании военнослужащих идеалы самопожертвования, защиты родины и культуры."
 RUT_modern_tactics_effort:0 "Современная тактика"
 RUT_modern_tactics_effort_desc:0 "Теперь, когда мы приняли военную доктрину, необходимо приспособить её к реальным условиям местности и регулярно получать точные отчёты от офицеров на местах, чтобы ежедневно реагировать на меняющуюся обстановку."
 RUT_armor_effort:0 "Проекты танков"
 RUT_armor_effort_desc:0 "Пора инженерному корпусу изучить возможность создания собственных современных танков. Обратная разработка вражеской техники — одно дело, но только собственные инновации способны дать по-настоящему решающее преимущество."
 RUT_mechanization_effort:0 "Механизация армии"
 RUT_mechanization_effort_desc:0 "Эксперименты с моторизацией показали успех, но ясно, что фронтовым войскам требуется дополнительная защита от вражеского огня. Поэтому нам необходимо разработать своего рода «бронированный грузовик», который сможет защищать и поддерживать пехоту на передовой."
 RUT_modern_artillery:0 "Современная артиллерия"
 RUT_modern_artillery_desc:0 "Снаряды, снаряды и ещё больше снарядов — и всё крупнее. Снаряды для разрушения вражеских укреплений, снаряды для пробития бронетехники... Девиз один: производить больше снарядов, чтобы выиграть войну!"
 RUT_anti_tank_defenses:0 "Противотанковая оборона"
 RUT_anti_tank_defenses_desc:0 "Бронетехника представляет постоянную угрозу для неподготовленной пехоты. Поэтому солдат необходимо поддержать самым экономичным специализированным средством борьбы с этой угрозой — противотанковой пушкой."
 RUT_special_forces:0 "Войска специального назначения"
 RUT_special_forces_desc:0 "Иногда ситуация оказывается слишком сложной для обычного пехотинца. Тогда приходится привлекать специально подготовленных бойцов. В горах, на воде или в воздухе такие подразделения способны изменить ход боя и совершить подвиги, недоступные рядовому солдату."
 RUT_military_modernization:0 "Военная модернизация"
 RUT_military_modernization_desc:0 "Теперь, когда мы освоили все приёмы современной войны, нельзя останавливаться. Только постоянно подвергая сомнению действенность и эффективность наших методов и снаряжения, мы сможем совершенствовать их в долгосрочной перспективе."
 RUT_short_range_fighter_focus:0 "Истребители малого радиуса действия"
 RUT_short_range_fighter_focus_desc:0 "Наша территория невелика, поэтому для защиты неба не придётся летать далеко. Мы можем сосредоточиться на небольших и манёвренных истребителях."
 RUT_long_range_fighter_focus:0 "Истребители большого радиуса действия"
 RUT_long_range_fighter_focus_desc:0 "Если мы хотим охватить всю Украину, нам понадобятся самолеты, способные летать дальше, но с оружием, способным переломить баланс в нашу пользу."
 RUT_low_altitude_flights:0 "Полёты на малой высоте"
 RUT_low_altitude_flights_desc:0 "Чем ближе самолёт к земле, тем точнее он может поражать цели. Кроме того, это покажет нашим солдатам, что небо принадлежит нам и авиация всегда рядом, чтобы поддержать их."
 RUT_offensive_bombing_strategy:0 "Стратегия наступательных бомбардировок"
 RUT_offensive_bombing_strategy_desc:0 "Слабое место врага — не сама армия, а заводы, создающие средства ведения войны. Если уничтожить их, противник не сможет продолжать борьбу."
 RUT_compromised_approach:0 "Компромиссный подход"
 RUT_compromised_approach_desc:0 "Если сбросить достаточно бомб на вражеские дивизии, от них ничего не останется. А если те же бомбы сбросить на заводы противника, мы подорвём его способность продолжать войну."
 RUT_form_mechanics:0 "Подготовить механиков"
 RUT_form_mechanics_desc:0 "В конце концов, какая разница, сбит ли самолёт вражескими пулями, загорелся ли у него двигатель или он не может подняться в воздух из-за технической неисправности, если мы не способны его починить? Единственный способ снизить риск поломок — иметь специализированных и хорошо подготовленных механиков, которые знают устройство самолёта лучше, чем хирург знает анатомию."
 RUT_aviation_effort:0 "Основать авиационную школу"
 RUT_aviation_effort_tt:0 "Недостаточно ячеек для строительства §Yавиабазы§!"
 RUT_aviation_effort_desc:0 "Ни в одной области технологический прогресс не идёт столь быстро, как в воздушной войне. Авиация — сфера, которой должна овладеть любая современная страна."
 RUT_fighter_focus:0 "Упор на истребители"
 RUT_fighter_focus_desc:0 "Воздушные бои Великой войны были далеко не последними. Опережая других в разработке истребителей, мы получим преимущество в будущем."
 RUT_bomber_focus:0 "Упор на бомбардировщики"
 RUT_bomber_focus_desc:0 "В будущем люди будут рассказывать об ужасах современных войн и вспоминать огонь, падающий с небес. Мы сделаем всё, чтобы эти истории рассказывали наши враги."
 RUT_aviation_effort_2:0 "Изучить иностранную тактику"
 RUT_aviation_effort_2_desc:0 "Для полноценного взаимодействия авиации с другими родами войск потребуются дальнейшие достижения в этой области."
 RUT_CAS_effort:0 "Пикирующие бомбардировщики"
 RUT_CAS_effort_desc:0 "Современной армии требуется поддержка техники как на земле, так и в воздухе."
 RUT_rocket_effort:0 "Ракетные двигатели"
 RUT_rocket_effort_desc:0 "Ракетные и реактивные двигатели позволяют пилотируемым и беспилотным аппаратам развивать невиданные прежде скорости. Освоив эти технологии первыми, мы сможем застать врага врасплох."
 RUT_NAV_effort:0 "Морские бомбардировщики"
 RUT_NAV_effort_desc:0 "Подобно тому как новая морская война ведётся под поверхностью воды, часть её теперь происходит и в воздухе над морем."
 RUT_foreign_port:0 "Начать кораблестроение на оккупированных территориях"
 RUT_naval_effort_tt:0 "Недостаточно ячеек для строительства §Yверфей§!"
 RUT_foreign_port_desc:0 "Расширение флота должно стать нашим приоритетом. Все доступные ресурсы следует направить на строительство новых верфей и исследования лёгких надводных кораблей."
 RUT_ukrainian_shipbuilding:0 "Строить корабли на Украине"
 RUT_flexible_navy:0 "Гибкий флот"
 RUT_flexible_navy_desc:0 "Переосмысление морской войны с учётом развития подводных лодок позволит эффективно наносить удары по вражеским конвоям."
 RUT_large_navy:0 "Крупный флот"
 RUT_large_navy_desc:0 "Адаптация военно-морских доктрин к применению крупных кораблей и обеспечение безопасности торговых конвоев помогут понять, какие именно корабли нам необходимы."
 RUT_submarine_effort:0 "Подводная война"
 RUT_submarine_effort_desc:0 "Подводная война — самое захватывающее новшество на море со времён изобретения торпедного катера. Нам следует научиться как защищаться от подлодок, так и использовать их против вражеского судоходства."
 RUT_cruiser_effort:0 "Разработать крейсеры"
 RUT_cruiser_effort_desc:0 "Прежде чем переходить к передовым исследованиям линкоров, необходимо заменить устаревшие малые крейсеры."
 RUT_destroyer_effort:0 "Разработать эсминцы"
 RUT_destroyer_effort_desc:0 "Изучая конструкцию и стратегическое применение подводных лодок, мы также научились противодействовать этой тактике. Эсминцы будут играть в этом решающую роль."
 RUT_capital_ships_effort:0 "Интерес к крупным кораблям"
 RUT_capital_ships_effort_desc:0 "Страна с наибольшим числом линкоров будет господствовать на морях. Линкоры и авианосцы воплощают старое и новое представления о превосходстве на море."
 RUT_food_processing_plant:0 "Предприятие пищевой промышленности"
 RUT_food_processing_plant_desc:0 "Поскольку сельское хозяйство сейчас является основой нашей экономики, лучший способ начать индустриализацию — обеспечить переработку продукции наших земель, чтобы её можно было хранить и продавать на внутреннем и внешнем рынках."
 RUT_construction_focus:0 "Строительные технологии"
 RUT_construction_focus_desc:0 "Возможно, Рим и не был построен за один день, но современные технологии должны помочь нам максимально приблизить эту поговорку к реальности. Будем надеяться, что недавние чехословацкие архитектурные программы смогут послужить образцом гражданского строительства."
 RUT_extraction_focus:0 "Небольшая горнодобывающая промышленность"
 RUT_extraction_focus_desc:0 "Наши земли, возможно, не слишком богаты ресурсами, но мы должны использовать всё доступное, чтобы уменьшить зависимость от зарубежной промышленности."
 RUT_industrial_technology:0 "Инновации в производстве"
 RUT_industrial_technology_desc:0 "Переход от аграрного общества к индустриальному может оказаться трудным, но несомненно одно: одной из основ этого процесса станет производство всё более эффективных машин."
 RUT_transcarpathian_infrastructure:0 "Местная инфраструктура"
 RUT_transcarpathian_infrastructure_desc:0 "Через горы, холмы, леса и ручьи необходимо проложить пути всеми доступными средствами, чтобы поезд мог пройти невредимым, а курьер — вовремя доставить тревожную весть. Кто-то считает этот проект безумием, но наша инфраструктура должна развиваться."
 RUT_build_industrial_area:0 "Создать промышленный район в Ужгороде"
 RUT_regional_industrialization:0 "Региональная индустриализация"
 RUT_regional_industrialization_desc:0 "Ужгород, несомненно, является нашим наиболее индустриализированным городом, и мы должны превратить его в региональный промышленный центр."
 RUT_small_arms_manufacturing:0 "Производство стрелкового оружия"
 RUT_small_arms_manufacturing_desc:0 "Хотя мы стремимся к мирному будущему, в наше время оружие остаётся необходимостью. Поэтому нужно организовать небольшие мастерские, готовые производить огнестрельное оружие и боеприпасы для защиты свободы нашей маленькой страны."
 RUT_military_production:0 "Военное производство"
 RUT_military_production_desc:0 "Чтобы противостоять опасностям войны, одних винтовок недостаточно. Нам следует рассмотреть более амбициозные планы по оснащению вооружённых сил."
 RUT_research_grants:0 "Исследовательские гранты"
 RUT_research_grants_desc:0 "Возможно, нам придётся полагаться лишь на нескольких специалистов, но по крайней мере мы можем обеспечить им достаточное финансирование для разработки современного и надёжного вооружения для наших солдат."
 RUT_a_free_rusyn_state:0 "Свободное русинское государство"
 RUT_a_free_rusyn_state_desc:0 "Одни называли нас чехословаками, другие — украинцами. И хотя украинцы действительно наши братья, мы всё же не совсем такие, как они. Мы — русины, последние из рутенов. Последние, кто пока ещё стоит свободным."
 RUT_claim_no_territories:0 "Не претендовать на чужие территории"
 RUT_claim_no_territories_desc:0 "Мы — маленькая страна в отдалённом регионе, окружённая армиями, способными сокрушить нас за считанные дни. Претендовать на чужие территории было бы величайшей глупостью. Мы — карпатские русины и хотим жить свободно в Карпатской Украине."
 RUT_unification_with_russian_federation:0 "Объединение с Российской Федерацией"
 RUT_unification_with_russian_federation_desc:0 "В нынешней политической обстановке независимость не выглядит жизнеспособным вариантом. Теперь, когда в России установлены демократические институты, возможно, разумнее искать безопасность в составе Российской Федерации на правах автономного региона."
 RUT_return_under_czech_protection:0 "Вернуться под чешскую защиту"
 RUT_return_under_czech_protection_desc:0 "Часть нашего населения с ностальгией вспоминает чехословацкий режим. Хотя некоторые права, обещанные ещё в 1919 году, очень долго оставались лишь обещаниями, стабильность институтов позволяла нашему народу жить спокойно и безопасно. Тем не менее даже сторонники подобного воссоединения настаивают, что предполагаемый регион должен получить автономию с собственными законами и институтами."
 RUT_defensive_preparation:0 "Подготовиться к обороне"
 RUT_defensive_preparation_desc:0 "Возможно, у нас нет таких же ресурсов, как у наших соседей, но мы можем исправить ситуацию с помощью одной простой вещи: планирования. Если мы заранее подготовим оборонительную стратегию и оборонительные укрепления, мы значительно увеличим наши шансы на выживание."
 RUT_ukraine_has_not_yet_perished:0 "«Ещё не умерла Украина»"
 RUT_ukraine_has_not_yet_perished_desc:0 "Этот популярный националистический лозунг должен служить и предупреждением о возможной гибели нашего государства, и лучом надежды в эти тёмные времена, напоминая, что мы всё ещё живы, горды и свободны."
 RUT_agrarian_reforms:0 "Аграрные реформы"
 RUT_agrarian_reforms_desc:0 "Земля — яблоко раздора Восточной Европы. Пока одни страны пытаются отхватить куски у соседей, внутри государств крестьянские движения выступают против могущественных землевладельцев, а недостаточное представительство сельского хозяйства в государственных институтах порождает требования земельной реформы и модернизации аграрного сектора."
 RUT_submit_to_hungary:0 "Подчиниться Венгрии"
 RUT_submit_to_hungary_desc:0 "После распада Чехословакии нам необходимо найти нового покровителя, если мы хотим выжить. Контакты, налаженные с правительством Будапешта через представителей нашего венгерского меньшинства, показывают, что они готовы включить нашу территорию в состав страны как автономный регион. Политики, поддерживающие этот проект объединения, так называемые «мадьяроны», займут ключевые должности."
 RUT_hungarian_officers:0 "Венгерские офицеры"
 RUT_hungarian_officers_desc:0 "Теперь, когда мы стали автономной частью Венгрии, наши сыновья будут служить в отдельных украиноязычных подразделениях венгерских вооружённых сил. Но этих новобранцев необходимо обучить и вооружить по венгерским стандартам. Именно поэтому мы попросили правительство Будапешта направить к нам специальную группу, желательно из двуязычных офицеров."
 RUT_economic_ties:0 "Экономические связи"
 RUT_economic_ties_desc:0 "Ранее мы входили в состав Чехословакии и имели значительное венгерское меньшинство. Теперь, когда мы интегрированы в венгерскую государственную систему, это меньшинство сможет полноценно развивать связи с остальной страной."
 RUT_technology_sharing_hungary:0 "Венгерские учёные"
 RUT_technology_sharing_hungary_desc:0 "Не будем скрывать: по сравнению с более индустриализированными регионами Карпатская Русь остаётся довольно отдалённой и отсталой. Поэтому, если мы хотим обучать призывников и развивать молодую промышленность в соответствии с зарубежными стандартами, нам потребуется помощь венгерских технических специалистов."
 RUT_economic_developments:0 "Экономическое развитие"
 RUT_economic_developments_desc:0 "Чехи могли считать нас отсталыми, но лишь потому, что мы ещё не раскрыли свой истинный потенциал. Продуманная поддержка растущей промышленности позволит увеличить общий объём производства."
 RUT_claim_new_farmlands:0 "Освоить новые земли"
 RUT_claim_new_farmlands_desc:0 "Русиния далеко не густонаселённый регион. Поэтому здесь хватает неиспользуемых земель, которые при необходимых инвестициях можно задействовать для промышленного развития."
 RUT_anti_air_defenses:0 "Противовоздушная оборона"
 RUT_anti_air_defenses_desc:0 "Угроза нападения с воздуха реальна, и её нельзя игнорировать. Поэтому необходимо заранее принять меры по укреплению важнейших объектов. Среди них — строительство бомбоубежищ, создание подготовленной службы воздушного наблюдения и формирование территориальных подразделений ПВО, оснащённых артиллерией для уничтожения приближающихся бомбардировщиков."
 RUT_mountain_fortress:0 "Горная крепость"
 RUT_mountain_fortress_desc:0 "Поскольку наше население намного меньше, чем у наших соседей, мы должны обеспечить, чтобы каждый наш солдат был буквально равен сотне из них. Поэтому в горной местности будут построены бункеры, чтобы обеспечить лучшую оборону для наших войск и дать нам возможность противостоять достаточно долго, чтобы могли вмешаться потенциальные союзники."
 RUT_coup_against_voloshyn:0 "Переворот против Волошина"
 RUT_coup_against_voloshyn_desc:0 "Распространяется слух среди рядовых наших военных. Волошин слаб, Волошин нас обречет. Мы должны отреагировать, пока не поздно! Эти офицеры готовы поставить под угрозу стабильность вновь созданного института, чтобы взять страну под контроль и сохранить ее автономию."
 RUT_contact_galician_ukrainians:0 "Связаться с галицкими украинцами"
 RUT_contact_galician_ukrainians_desc:0 "Хотя земли вокруг Львова в 1919 году перешли под контроль Польши, в начале Гражданской войны в России их жители создали Западно-Украинскую Народную Республику. Даже получив некоторую автономию в составе Польши, многие по-прежнему мечтают о новой украинской республике. Неофициальные контакты уже показали, что, если мы войдём во Львов, местное украинское население поддержит нас."
 RUT_unification_with_ukraine:0 "Объединение с Украиной"
 RUT_unification_with_ukraine_desc:0 "Некоторые предпочитают подчёркивать особенности русинов, но не могут отрицать, что мы являемся одной из групп украинского народа. Теперь, когда Украина свободна и стабильна, мы должны воссоединиться с семьёй и вместе строить новое будущее."
 RUT_unification_with_ukraine2:0 "Объединение с Украиной"
 RUT_unification_with_ukraine2_desc:0 "Некоторые предпочитают подчёркивать особенности русинов, но не могут отрицать, что мы являемся одной из групп украинского народа. Теперь, когда Украина свободна и стабильна, мы должны воссоединиться с семьёй и вместе строить новое будущее."
 RUT_west_ukrainian_veterans:0 "Западноукраинские ветераны"
 RUT_west_ukrainian_veterans_desc:0 "Теперь, когда столица Галиции находится под нашим контролем, необходимо собрать националистов региона и сформировать новые подразделения во имя новой западноукраинской республики. Кроме того, следует связаться с бывшими командирами: некоторые из них, возможно, согласятся возглавить вновь созданные части и сражаться за наше общее дело."
 RUT_claim_ukraine:0 "Предъявить права на Украину"
 RUT_claim_ukraine_desc:0 "Наше стремление освободить всех украинцев закономерно привело к тому, что особенности русинов Карпатской Украины отошли на второй план. Если мы претендуем на всю Украину, то должны выстроить национальную идею вокруг представления о том, что Карпатская Украина была лишь остаточным государством, пока сама Украина находится под игом иностранных оккупантов."
 RUT_industry_in_kiev:0 "Промышленность Киева"
 RUT_industry_in_kiev_desc:0 "Теперь, когда Киев находится под нашим контролем, мы можем использовать городскую инфраструктуру и увеличить её производительность при поддержке украинских националистов, которые не способны служить на фронте."
 RUT_railways_around_kiev:0 "Инфраструктура вокруг Киева"
 RUT_railways_around_kiev_desc:0 "Чтобы обеспечить безопасность важнейшего города Украины, необходимо восстановить транспортную и коммуникационную инфраструктуру."
 RUT_industry_in_odessa:0 "Промышленность Одессы"
 RUT_industry_in_odessa_desc:0 "Одесса, вероятно, является важнейшим украинским портом, и теперь, когда она находится под нашим контролем, мы должны как можно быстрее восстановить и даже расширить местное производство и портовую деятельность."
 RUT_a_train_to_odessa:0 "Поезд до Одессы"
 RUT_a_train_to_odessa_desc:0 "Чтобы обеспечить надёжную связь с нашим портом в Одессе, необходимо восстановить коммуникации между Галицией и Чёрным морем."
 RUT_donbas_heavy_industries:0 "Тяжёлая промышленность Донбасса"
 RUT_donbas_heavy_industries_desc:0 "Угольные шахты Донбасса дают нам чрезвычайно ценную возможность производить огромное количество стали и значительно увеличить военное производство."
 RUT_a_train_to_the_donbass:0 "Поезд на Восток"
 RUT_a_train_to_the_donbass_desc:0 "Чтобы обеспечить надёжные поставки угля и стали из промышленного региона Донбасса на наши заводы, необходимо создать безопасное железнодорожное сообщение с востоком."
 RUT_industry_in_lviv:0 "Промышленность Львова"
 RUT_industry_in_lviv_desc:0 "При поддержке русинских украинцев мы сможем повысить производительность и мобилизовать больше ресурсов для военных нужд."
 RUT_khust_lviv_railways:0 "Железная дорога Хуст—Львов"
 RUT_khust_lviv_railways_desc:0 "Чтобы надёжно связать освобождённые территории, необходимо проложить безопасную железную дорогу через горы между Карпатской Русью и Галицией."
 RUT_oun_moderates:0 "Поддержать умеренных ОУН"
 RUT_oun_moderates_desc:0 "Поддержка Организации украинских националистов является обязательной для достижения нашей цели. Вступая в ОУН-М, мы будем поддерживать силы, более открытые для умеренной формы власти над независимой Украиной."
 RUT_oun_radicals:0 "Поддержать радикалов ОУН"
 RUT_oun_radicals_desc:0 "Поддержка Организации украинских националистов необходима для достижения нашей цели. Став на сторону ОУН-Б, мы обеспечим поддержку наиболее фанатичных националистов. Они будут сражаться до последнего человека за свободу Украины, но могут также попытаться установить полный контроль над государственными институтами."
 RUT_ussr_war_goal:0 "Бросить вызов красному тирану"
 RUT_ussr_war_goal_desc:0 "Россия веками считала Украину частью своей территории. Советский Союз придерживается той же позиции, но вдобавок презирает нас и был готов погубить миллионы наших братьев, устроив великий голод, который мы называем «Голодомором»."
 RUT_our_patriotic_war:0 "Наша Отечественная война"
 RUT_our_patriotic_war_desc:0 "Германия вторглась в Восточную Европу и опустошила её, представляя смертельную угрозу самому нашему существованию. Если мы хотим однажды жить в мире, необходимо раз и навсегда уничтожить фашистскую угрозу."
 RUT_one_ukraine:0 "Единая Украина"
 RUT_one_ukraine_desc:0 "После почти нечеловеческих усилий мы наконец стоим на пороге победы. Казавшаяся несбыточной мечта целого поколения об объединённой Украине становится реальностью. На смену тирании иностранного угнетения придёт новое свободное государство."
 RUT_force_russia_abandon_claims:0 "Заставить Россию отказаться от претензий"
 RUT_force_russia_abandon_claims_desc:0 "Чтобы жертвы нашего народа не оказались напрасными, необходимо закрепить в договоре обязательство российского государства никогда больше не предъявлять претензий на украинские территории."
 RUT_move_to_kiev:0 "Перенести столицу в Киев"
 RUT_move_to_kiev_desc:0 "Теперь, когда Украина окончательно объединена, последним официальным шагом станет перенос администрации из ставшей отдалённой Карпатской Руси в исторический центр страны — Киев."
 RUT_reinforce_military_government:0 "Укрепить военное правительство"
 RUT_reinforce_military_government_desc:0 "Когда окончательное национальное освобождение наконец оказалось в наших руках, процесс принятия решений в армии ни в коем случае не должен тормозиться ограничениями гражданской политики."
 RUT_restore_civilian_government:0 "Восстановить гражданское правительство"
 RUT_restore_civilian_government_desc:0 "Теперь, когда важнейшие задачи выполнены, необходимо восстановить демократический орган власти, чтобы после окончания войны государственные институты не стали объектом злоупотреблений."
 RUT_ukraine_has_not_yet_perished2:0 "«Ещё не умерла Украина»"
 RUT_ukraine_has_not_yet_perished2_desc:0 "Этот популярный националистический лозунг должен служить и предупреждением о возможной гибели нашего государства, и лучом надежды в эти тёмные времена, напоминая, что мы всё ещё живы, горды и свободны."
 RUT_approach_poland:0 "Сблизиться с Польшей"
 RUT_approach_poland_desc:0 "У нас крепкие связи с украинским меньшинством на юге Польши, и необходимо использовать все доступные средства, чтобы убедить польское правительство: союз с нами отвечает его интересам."
 RUT_approach_romania:0 "Сблизиться с Румынией"
 RUT_approach_romania_desc:0 "В этом всё более безумном мире нам не обойтись без союзников. Румыния граничит с нами, имеет выход к морю и пользуется поддержкой Польши и Балканского пакта, а значит, может стать ценным партнёром."
 RUT_join_intermarium:0 "Присоединиться к Междуморью"
 RUT_join_intermarium_desc:0 "Чтобы обрести безопасность в этом всё более опасном мире, мы должны обратиться на север и искать защиты в составе так называемого польского «Междуморья»."
 RUT_join_cordon_sanitaire:0 "Присоединиться к Санитарному кордону"
 RUT_join_cordon_sanitaire_desc:0 "Чтобы обрести безопасность в этом всё более опасном мире, необходимо искать помощь по другую сторону гор и вступить в румынский союз."
 RUT_join_little_entente:0 "Присоединиться к Малой Антанте"
 RUT_join_little_entente_desc:0 "Франция пообещала помочь Чехословакии, и восстановление прежних связей может стать хорошим способом поддержать её в борьбе против иностранной агрессии."
 RUT_communist_influence:0 "Коммунистическое влияние"
 RUT_communist_influence_desc:0 "Всё началось с листовок, распространяемых на улицах. Затем появились ораторы и агитационные плакаты, призывающие пролетариат восстать против продажных капиталистов. Коммунистические идеи проникают во все сферы общества и принесут колоссальные перемены."
 RUT_request_to_join_big_brother:0 "Присоединиться к советскому старшему брату"
 RUT_request_to_join_big_brother_desc:0 "Мы должны присоединиться к Украинской ССР, входящей в славный Союз Советских Социалистических Республик. Светлое будущее возможно лишь под мудрым руководством председателя Президиума Верховного Совета Союза Советских Социалистических Республик."
 RUT_purge_the_army:0 "Провести чистку в армии"
 RUT_purge_the_army_desc:0 "Армия традиционно привлекала буржуазных и карьеристских реакционных офицеров. Теперь они представляют потенциальную угрозу славной пролетарской революции. Поэтому с ними необходимо разобраться, прежде чем они успеют создать проблемы."
 RUT_new_army:0 "Новая армия"
 RUT_new_army_desc:0 "После реорганизации армии мы наконец получили идеологически единые вооружённые силы, которые защитят пролетариат от фашистских плутократов."
 RUT_request_to_join_ukrainian_brother:0 "Попроситься в состав Украинской ССР"
 RUT_request_to_join_ukrainian_brother_desc:0 "Официальная политическая линия коммунистической партии Подкарпатской Руси утверждает, что русинов не существует. Напротив, все мы украинцы и потому должны закономерно присоединиться к Украинской Советской Социалистической Республике."
 RUT_economic_reorganization:0 "Экономическая реорганизация"
 RUT_economic_reorganization_desc:0 "Мы должны начать экономическую реорганизацию, которая освободит ремесленников от тиранических капиталистов, а крестьян — от жестоких и эксплуататорских землевладельцев. Враги революции не остановят коллективизацию!"
 RUT_central_planning:0 "Центральное планирование"
 RUT_central_planning_desc:0 "Теперь, когда экономика находится под нашим твёрдым контролем, можно приступить к грандиозной задаче индустриализации страны, перераспределяя ресурсы в пользу тяжёлой промышленности ради успеха первых «пятилетних планов». Русинские рабочие — вперёд!"
 RUT_technology_sharing_communism:0 "Общие социалистические открытия"
 RUT_technology_sharing_communism_desc:0 "Для успеха мировой революции жизненно важно, чтобы учёные-труженики объединились ради общего дела — прогресса человечества."
 RUT_technology_sharing_oun:0 "Украинские научные объединения"
