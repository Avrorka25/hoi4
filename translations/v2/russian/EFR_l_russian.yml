 EFR_de_lattre_de_tassigny:0 "Жан де Латтр де Тассиньи"
 idea_EFR_terms_of_compiegne_armistice:0 "Условия Компьенского перемирия"
 idea_EFR_terms_of_compiegne_armistice_desc:0 "Условия перемирия позволили нам выжить и начать «национальную революцию». Но экономическая цена оккупации, выплаты Германии и потеря стольких молодых людей стали почти невыносимым бременем. Именно поэтому нам нужен герой Вердена. Только его сила воли способна провести нас через эти тёмные времена."
 idea_EFR_shattered_economy:0 "Разрушенная экономика"
 idea_EFR_shattered_economy_desc:0 "Нехватка людей, реквизиции оккупационных сил и принудительное закрытие большей части арсеналов наносят удар как по гражданской экономике, так и по способности производить новое снаряжение."
 idea_EFR_shattered_economy2:0 "Разрушенная экономика"
 idea_EFR_shattered_economy2_desc:0 "Нехватка людей, реквизиции оккупационных сил и принудительное закрытие большей части арсеналов наносят удар как по гражданской экономике, так и по способности производить новое снаряжение."
 idea_EFR_hidden_rifles:0 "Спрятанные винтовки"
 idea_EFR_hidden_rifles_desc:0 "После капитуляции перед Германией некоторым военным удалось укрыть часть оружия. Позднее его можно будет быстро мобилизовать и увеличить численность армии сверх установленного лимита в 100 000 человек."
 EFR_aviation_effort:0 "Восстановить военно-воздушные силы"
 EFR_aviation_effort_desc:0 "Наши ВВС были разгромлены, но мы должны продолжить борьбу и восстановить боевую авиацию, чтобы защитить небо."
 EFR_light_fighters_focus:0 "Лёгкие истребители"
 EFR_light_fighters_focus_desc:0 "Поскольку самолёты можно размещать близко к районам ожидаемого перехвата, следует сосредоточиться на манёвренности одноместных машин."
 EFR_heavy_fighters_focus:0 "Тяжёлые истребители"
 EFR_heavy_fighters_focus_desc:0 "Авиационные доктрины 1930-х утверждали, что бомбардировщики способны полностью уничтожить вражескую страну. Чтобы этого избежать, мы должны уметь перехватывать любой самолёт, угрожающий нашему небу. Тяжёлый истребитель сможет нести более мощное вооружение, летать выше и сбивать самые крупные машины."
 EFR_bomber_focus:0 "Ставка на бомбардировщики"
 EFR_aviation_effort_2:0 "Передовая воздушная тактика"
 EFR_bombing_awareness:0 "Готовность к бомбардировкам"
 EFR_bombing_awareness_desc:0 "Без надлежащей противовоздушной обороны, защищающей наш «нейтралитет», мы станем беззащитной добычей вражеских бомбардировщиков."
 EFR_naval_effort:0 "Развитие флота"
 EFR_flexible_navy:0 "Гибкий флот"
 EFR_flexible_navy_desc:0 "Доктрины и способы атаки противника постоянно меняются. Поэтому мы должны применять гибкую систему, используя воздух и морские глубины для укрытия сил, а не просто занимая поверхность океана."
 EFR_pride_of_the_nation:0 "Гордость нации"
 EFR_pride_of_the_nation_desc:0 "Большая часть флота нейтрализована, но он по-прежнему остаётся гордостью страны. Если мы его модернизируем, то снова сможем оспаривать господство на море."
 EFR_submarine_effort:0 "Развитие подводного флота"
 EFR_submarine_effort_desc:0 "Незаметное под водой возрождение нашего флота начнётся с создания подводных сил."
 EFR_cruiser_effort:0 "Развитие крейсеров"
 EFR_cruiser_effort_desc:0 "Для плавания по Средиземному морю нет ничего лучше современного крейсера!"
 EFR_destroyer_effort:0 "Развитие эсминцев"
 EFR_destroyer_effort_desc:0 "Угрозе подводных торпед необходимо противопоставить новые «контр-миноносцы»."
 EFR_capital_ships_effort:0 "Крупные корабли"
 EFR_capital_ships_effort_desc:0 "Крупные корабли — драгоценности и ужас морей, и нам необходимо строить более современные образцы."
 EFR_marechal_nous_voila:0 "Маршал, вот мы!"
 EFR_marechal_nous_voila_desc:0 "Маршал, вот мы! Готовы служить Французскому государству и начать национальную революцию, которая возродит душу вечной Франции. Он спас нас при Вердене и защитит в самый мрачный час страны."
 EFR_travail:0 "Труд"
 EFR_travail_desc:0 "Французы, вы должны трудиться ради восстановления страны! Ручной труд — важнейшая ценность национальной революции, максимально далёкая от денежной коррупции, ставшей одной из причин нашего поражения."
 EFR_recycling:0 "Переработка отходов"
 EFR_recycling_desc:0 "Знаете ли вы, мадемуазель, что старую киноплёнку можно превратить в крем для обуви? Чулки слишком дороги? Нарисуйте их на ногах, и никто не заметит разницы!\nЕсли у вас есть металлический лом, сдайте его в пункт сбора и обменяйте на талоны — нашей промышленности он необходим. Некоторые магазины также могут обменивать металл на продукты, например 200 г меди на литр вина."
 EFR_gazogenes_and_michelin_tires:0 "Газогенераторы"
 EFR_gazogenes_and_michelin_tires_desc:0 "Нефть становится всё дефицитнее, поэтому мы должны искать заменители. Большинство граждан уже пересело на велосипеды, но автомобили тоже могут работать на альтернативном топливе. Газогенераторы позволяют использовать энергию сгорания угля и даже древесины."
 EFR_STO:0 "Ввести S.T.O."
 EFR_STO_desc:0 "«Обязательная трудовая служба» — система обмена, при которой рабочих отправляют в Германию, поскольку Рейху не хватает людей одновременно для дивизий и заводов. Благодаря этому были освобождены десятки тысяч солдат, хотя часть из них осталась в Германии уже как свободные рабочие."
 EFR_STO_2:0 "Отправить больше рабочих в Германию"
 EFR_STO_2_desc:0 "Рабочий! Трудясь ради Европы, ты защищаешь страну и дом. Ты станешь послом французского качества и обеспечишь финансовую стабильность своей семье."
 EFR_industrial_advisory_comitee:0 "Промышленный консультативный комитет"
 EFR_industrial_advisory_comitee_desc:0 "Руководители всех крупных производственных компаний должны быть представлены в общей организации, чтобы эффективно распределять исследовательские задачи. Их политическая надёжность гарантирована, поскольку большинство уже поддерживало крайне правые организации, например заговор «Кагуля»."
 EFR_famille:0 "Семья"
 EFR_famille_desc:0 "Маршал Петен каждый день думает обо всех семьях Франции, чьи мужья, сыновья и братья находятся в плену в Германии. Он думает о маленьких детях и их будущем в примирённой Европе.\nКроме того, он учредил День матери, чтобы каждый ребёнок Франции мог показать, насколько сильно любит свою маму."
 EFR_divine_surprise:0 "Божественный сюрприз"
 EFR_rationing:0 "Нормирование"
 EFR_rationing_desc:0 "Чтобы сберечь немногие оставшиеся ресурсы, необходимо ввести карточную систему. Список ограниченных продуктов велик и включает оливковое масло, хлеб, сливочное масло, мясо, молоко и яйца. Конфеты запрещены, а пресса должна публиковать советы по приготовлению блюд из заменителей: супа из брюквы, салата из тёртого чертополоха, кофе без кофе..."
 EFR_patrie_focus:0 "Отечество"
 EFR_patrie_focus_desc:0 "Мы должны восстановить государство, чтобы залечить недавние раны. Во-первых, франциска — боевой топор франков — станет символом нового режима. Во-вторых, администрацию необходимо очистить от врагов национальной революции. В-третьих, полиция должна присягнуть маршалу Петену. Да здравствует Петен, да здравствует Франция!"
 EFR_armistice_army:0 "Организовать армию перемирия"
 EFR_armistice_army_desc:0 "Хотя наши действия с остатками армии ограничены, её всё равно необходимо правильно организовать и пересмотреть тактику, чтобы быть готовыми сразиться с любым врагом Франции."
 EFR_hide_military_equipment:0 "Спрятать военное снаряжение"
 EFR_chantiers_de_la_jeunesse:0 "Молодёжные трудовые лагеря"
 EFR_chantiers_de_la_jeunesse_desc:0 "Поскольку военная служба отменена, молодёжь должна служить в так называемых «молодёжных трудовых лагерях». В этих открытых лагерях они будут выполнять небольшие инфраструктурные работы, участвовать в маршах по дикой местности и заниматься физической подготовкой."
 EFR_negociate_the_release_of_officers:0 "Договориться об освобождении офицеров"
 EFR_negociate_the_release_of_officers_desc:0 "Благодаря нашему отношению к европейскому сотрудничеству нам наконец удалось добиться крупной уступки от рейхсканцлера Гитлера: освобождения тысяч офицеров, находившихся в плену в Германии."
 EFR_LVF:0 "Легион французских добровольцев"
 EFR_secret_military_researches:0 "Тайные военные исследования"
 EFR_secret_military_researches_desc:0 "Хотя перемирие запрещает использовать часть техники, например танки, мы можем тайно продолжать эксперименты, применяя то, чем остальное общество пользуется в других сферах: эрзацы."
 EFR_bulldozer_experiments:0 "Эксперименты с бульдозерами"
 EFR_bulldozer_experiments_desc:0 "Нам запрещено иметь танки, но мы можем приобретать гусеничные машины под видом тяжёлой снегоуборочной техники или бульдозеров. Они не будут использоваться в бою, но дадут необходимые технические данные для будущих танков."
 EFR_contact_renault:0 "Связаться с Renault"
 EFR_contact_renault_desc:0 "Пока Renault производит грузовики для оккупационных сил, следует выяснить, сможет ли компания тайно разработать для нас современные машины."
 EFR_autorized_modernization:0 "Разрешённая модернизация"
 EFR_autorized_modernization_desc:0 "Наконец мы получили возможность проектировать новое снаряжение и полностью модернизировать вооружённые силы."
 EFR_restart_heavy_water_production:0 "Возобновить производство тяжёлой воды"
 EFR_restart_heavy_water_production_desc:0 "Одним из важнейших стратегических ресурсов, ускользнувших от немецких войск, стали запасы тяжёлой воды, эвакуированные в Британию во время вторжения. С возвращением военных амбиций необходимо возродить проект по использованию перспективных свойств урана."
 EFR_military_youth:0 "Военизированная молодёжь"
 EFR_military_youth_desc:0 "Молодёжь Франции! Эта борьба касается не только ваших родителей — это борьба за ваше собственное будущее! Пора выступить против англо-американских предателей! Как можно танцевать зазу в столь решающий час для будущего Европы и всего мира? Молодёжь Франции, во имя полной национальной и социалистической революции — поднимайся!"
 EFR_milice_francaise:0 "Французская милиция"
 EFR_milice_francaise_desc:0 "Французская милиция — инструмент репрессий режима против подрывных элементов: евреев, коммунистов, голлистов и партизан в целом."
 EFR_phalange_africaine:0 "Африканская фаланга"
 EFR_phalange_africaine_desc:0 "Африканская фаланга была создана для борьбы с силами Союзников в Северной Африке и набиралась из французского населения Алжира."
 EFR_ideological_fanaticism:0 "Идеологический фанатизм"
 EFR_ideological_fanaticism_desc:0 "Мы присягнули Петену и Франции. Мы не предадим это слово, как англичане, которые десятилетиями находились под еврейским влиянием."
 EFR_technology_sharing:0 "Обмен технологиями"
 EFR_technology_sharing_desc:0 "Сотрудничество помогает и в науке. Встреча французских и немецких учёных, мирно обменивающихся знаниями, — ещё один пример единства Европы перед лицом врагов."
 EFR_a_new_regime:0 "Новый режим"
 EFR_collectivist_ethos:0 "Коллективистский дух"
 EFR_internationalism_focus:0 "Интернационализм"
 EFR_political_correctness:0 "Политическая корректность"
 EFR_indoctrination_focus:0 "Индоктринация"
 EFR_political_commissars:0 "Политические комиссары"
 EFR_liberty_ethos:0 "Дух свободы"
 EFR_neutrality_focus:0 "Нейтралитет"
 EFR_deterrence:0 "Сдерживание"
 EFR_interventionism_focus:0 "Интервенционизм"
 EFR_volunteer_corps:0 "Добровольческий корпус"
 EFR_foreign_expeditions:0 "Зарубежные экспедиции"
 EFR_why_we_fight:0 "Почему мы сражаемся"
 EFR_collaboration:0 "Французский коллаборационизм"
 EFR_STO_idea:0 "Обязательная трудовая служба"
 EFR_STO_idea_desc:0 "«Обязательная трудовая служба» (S.T.O. по-французски) была способом Виши хоть что-то получить в принципиально неравных переговорах с оккупационными властями. Отправляя рабочих в Германию, режим добивался освобождения сотен тысяч военнопленных, но за каждого освобождённого солдата приходилось посылать нескольких работников. Для немцев это была небольшая уступка, позволявшая заполнять заводы и продолжать военное производство, пока призыв уводил всё больше людей из промышленности."
 EFR_STO2_idea:0 "Обязательная трудовая служба"
 EFR_STO2_idea_desc:0 "«Обязательная трудовая служба» (S.T.O. по-французски) была способом Виши хоть что-то получить в принципиально неравных переговорах с оккупационными властями. Отправляя рабочих в Германию, режим добивался освобождения сотен тысяч военнопленных, но за каждого освобождённого солдата приходилось посылать нескольких работников. Для немцев это была небольшая уступка, позволявшая заполнять заводы и продолжать военное производство, пока призыв уводил всё больше людей из промышленности."
 EFR_STO3_idea_desc:0 "«Обязательная трудовая служба» (S.T.O. по-французски) была способом Виши хоть что-то получить в принципиально неравных переговорах с оккупационными властями. Отправляя рабочих в Германию, режим добивался освобождения сотен тысяч военнопленных, но за каждого освобождённого солдата приходилось посылать нескольких работников. Для немцев это была небольшая уступка, позволявшая заполнять заводы и продолжать военное производство, пока призыв уводил всё больше людей из промышленности."
