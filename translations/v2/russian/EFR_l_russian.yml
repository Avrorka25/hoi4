 EFR_disjointed_government:0 "Разобщённое правительство"
 EFR_disjointed_government_desc:0 "Французская политика далека от стабильности. Хотя реформы необходимы и приветствуются, страна расколота, а втягивание в конфликт подвергнет её огромному риску."
 EFR_protected_by_the_maginot_line:0 "Под защитой линии Мажино"
 EFR_protected_by_the_maginot_line_desc:0 "Укреплённая граница позволяет Франции тщательно планировать и готовиться, но снижает гибкость при неожиданных событиях."
