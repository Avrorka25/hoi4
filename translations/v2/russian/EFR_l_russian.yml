 EFR_submarine_1:0 "Серия 600"
 EFR_submarine_1_desc:0 "Подводные лодки 600-тонной серии стали первыми современными французскими субмаринами, построенными после Первой мировой войны. Это были средние лодки водоизмещением около 600 тонн. Хотя они были мореходными, их классифицировали как прибрежные и использовали главным образом в тёплых водах Средиземного моря. Было построено три класса по четыре лодки: Sirène, Ariane и Circé. Они послужили основой для более крупной 630-тонной серии — классов Argonaute, Diane и Orion."
 EFR_submarine_2:0 "Класс Minerve"
 EFR_submarine_2_desc:0 "Подводные лодки класса Minerve (проект T2) основывались на 630-тонной серии, но имели улучшенные двигатели и иную компоновку торпедных аппаратов. Они стали первой частью программы стандартизации, основанной на централизованном проектировании DCAN, а не на отдельных проектах верфей, как в предыдущих классах."
 EFR_submarine_3:0 "Класс Roland Morillot"
 EFR_submarine_3_desc:0 "Подводные лодки класса Roland Morillot (проект Z2) были крупными океанскими субмаринами, основанными на более раннем классе Redoutable. Их водоизмещение составляло 1800–2400 тонн, а вооружение включало внушительные десять торпедных аппаратов. Падение Франции произошло до завершения хотя бы одной лодки."
 EFR_submarine_4:0 "Класс Phénix"
 EFR_submarine_4_desc:0 "Подводные лодки класса Phénix были средними океанскими лодками большой дальности, предусмотренными военно-морскими программами 1939–1940 годов. Начало войны и падение Франции привели к отмене их строительства. Они напоминали класс Redoutable, но были меньше и имели водоизмещение около 1200 тонн, сохраняя при этом мощное торпедное вооружение."
 EFR_destroyer_1:0 "Класс Bourrasque"
 EFR_destroyer_1_desc:0 "Эсминцы класса Bourrasque входили в 1500-тонную серию и были спущены на воду в середине 1920-х годов. Вместе с предшествующим классом Chacal и последующим L'Adroit они составляли основу нового современного французского флота после войны. Для своего времени корабли были быстрыми и хорошо вооружёнными, но уступали аналогам других флотов по торпедному вооружению."
 EFR_destroyer_2:0 "Класс Le Fantasque"
 EFR_destroyer_2_desc:0 "Эсминцы класса Le Fantasque представляли собой улучшенные версии более ранних суперэсминцев 2400-тонной серии — Guépard, Aigle и Vauquelin, построенных по программе 1930 года. Это были крупные, тяжело вооружённые и очень быстрые корабли, идеально подходившие для сопровождения новых скоростных соединений французского флота. Их вооружение включало новые орудия, приемлемую ПВО и торпедные аппараты."
 EFR_destroyer_3:0 "Класс L'Intrépide"
 EFR_destroyer_3_desc:0 "Эсминцы класса L'Intrépide были модифицированной версией более раннего класса Le Hardi. Их строительство утвердили в программах 1938 и 1939 годов, но война и падение Франции привели к отмене. Проект делал больший упор на противовоздушную оборону, предусматривал водоизмещение 2800–2900 тонн и более мощные двигатели."
 EFR_destroyer_4:0 "Класс Hoche"
 EFR_destroyer_4_desc:0 "Классы Hoche и Bayard стали последними проектами суперэсминцев французского флота. Оба основывались на классе Mogador, имели водоизмещение 4200 тонн, сходное главное вооружение, улучшенную ПВО и более мощные двигатели. Они были утверждены программами 1939–1940 годов, но начало войны и падение Франции привели к отмене строительства."
 EFR_light_cruiser_1:0 "Класс Duguay-Trouin"
 EFR_light_cruiser_1_desc:0 "Лёгкие крейсеры класса Duguay-Trouin стали первыми крупными французскими боевыми кораблями, построенными после Первой мировой войны по программе 1922 года. Они первыми среди лёгких крейсеров получили закрытые возвышенные башни главного калибра. Корабли обладали мощным торпедным вооружением, но практически не имели брони."
 EFR_light_cruiser_2:0 "Класс La Galissonnière"
 EFR_light_cruiser_2_desc:0 "Лёгкие крейсеры класса La Galissonnière создавались как ответ на итальянские крейсеры типа Condottieri и основывались на предыдущем классе Emile Bertin. Их строили по программам 1931 и 1932 годов, оснащая типичным главным калибром и достаточной для своего времени ПВО. Водоизмещение составляло 10 850 тонн; корабли несли больше разведывательных самолётов и развивали хорошую скорость."
 EFR_light_cruiser_3:0 "Класс De Grasse"
 EFR_light_cruiser_3_desc:0 "Крейсеры класса De Grasse были утверждены программами 1938 и 1939 годов и представляли собой улучшенные La Galissonnière. Они получили усиленную ПВО и более мощные двигатели. После падения Франции два последних корабля отменили, а головной после войны достроили по изменённому проекту. Немцы собирались переоборудовать его в лёгкий авианосец, но проект не осуществили."
 EFR_light_cruiser_4:0 "Класс Colbert"
 EFR_light_cruiser_4_desc:0 "Colbert был лёгким крейсером ПВО, спущенным на воду в 1956 году. Этот корабль строился по схеме, схожей с послевоенным De Grasse, и имел мощное зенитное вооружение ближнего и дальнего действия. По сравнению с De Grasse он получил менее мощные двигатели, более тонкую броню и немного меньшие размеры."
 EFR_heavy_cruiser_1:0 "Класс Suffren"
 EFR_heavy_cruiser_1_desc:0 "Тяжёлые крейсеры класса Suffren в основном повторяли предыдущий класс Duquesne с небольшими улучшениями мореходности. Оба класса отражали тогдашнюю французскую концепцию крейсера: очень тонкая броня, но высокая скорость и большая дальность. Стандартное водоизмещение составляло 10 000 тонн, а вооружение соответствовало нормам тяжёлого крейсера."
 EFR_heavy_cruiser_2:0 "Класс Algérie"
 EFR_heavy_cruiser_2_desc:0 "Тяжёлый крейсер класса Algérie стал дальнейшим развитием Suffren и Duquesne и создавался как противовес новым итальянским крейсерам класса Zara. Главный броневой пояс и подводная защита были значительно усилены. ПВО соответствовала своему времени, но из-за этих изменений стандартное водоизмещение превысило 10 000 тонн."
 EFR_heavy_cruiser_3:0 "Класс Saint Louis"
 EFR_heavy_cruiser_3_desc:0 "Тяжёлые крейсеры класса Saint Louis основывались на Algérie, но внешне были ближе к крупным кораблям классов Dunkerque и Richelieu. Три корабля заказали по программе 1940 года, однако из-за падения Франции ни один не заложили. Они должны были получить новые орудия и улучшенную ПВО при сохранении брони Algérie. Это был последний проект тяжёлого крейсера французского флота."
 EFR_heavy_cruiser_4:0 "Класс Forbin"
 EFR_heavy_cruiser_4_desc:0 "Тяжёлые крейсеры класса Forbin были гипотетическим развитием Saint Louis. Они предназначались для защиты торговых путей между метрополией и колониями, сочетая большую дальность, высокую скорость, тяжёлое вооружение в четырёх трёхорудийных башнях и достаточную ПВО. Общая компоновка отражала влияние как Saint Louis, так и британского класса Crown Colony."
 EFR_battle_cruiser_1:0 "Проект Durand-Viel"
 EFR_battle_cruiser_1_desc:0 "Проект линейного крейсера Durand-Viel был одним из серии исследований, начатых ещё до Первой мировой войны. По сути это были линейно-крейсерские версии линкоров классов Normandie и Lyon с теми же четырёхорудийными башнями, но в меньшем количестве. Как и аналогичные корабли других флотов, они должны были быть быстрее, но слабее бронированы, чем линкоры. Проект отменили до начала войны."
 EFR_battle_cruiser_2:0 "Класс Dunkerque"
 EFR_battle_cruiser_2_desc:0 "Корабли класса Dunkerque проектировались для противодействия немецким карманным линкорам класса Deutschland. Они стали вершиной серии исследований середины 1920-х — начала 1930-х годов. Утверждённые программами 1931 и 1934 годов, они напоминали британские линкоры класса Nelson: все башни главного калибра располагались в носовой части. Это позволяло сократить броневой пояс и уменьшить размеры корабля для соблюдения договорных ограничений."
 EFR_battleship_1:0 "Класс Courbet"
 EFR_battleship_1_desc:0 "Линкоры класса Courbet стали первыми супердредноутами французского флота, построенными до и во время Первой мировой войны. Их утвердили программами 1910 и 1911 годов. В Первую мировую они применялись ограниченно, но активно служили во Вторую. Хотя броня и орудия превосходили предыдущий класс Dante, корабли уступали современным американским и британским линкорам. Водоизмещение немного превышало 22 000 тонн, а модернизация до Второй мировой ограничилась усилением ПВО и обновлением котлов."
 EFR_battleship_2:0 "Класс Richelieu"
 EFR_battleship_2_desc:0 "Линкоры класса Richelieu стали последними линкорами, принятыми на вооружение французского флота. Они представляли собой улучшенный Dunkerque и были утверждены программами 1935 и 1938 годов. Отличные ПВО, скорость и дальность делали их превосходными крупными кораблями. Из четырёх заказанных только два спустили на воду, а до падения Франции завершили лишь один. Оставшиеся корабли пытались достроить по различным проектам — как линкоры ПВО, гибриды линкора и авианосца или полноценные авианосцы."
 EFR_battleship_3:0 "Класс Gascogne"
 EFR_battleship_3_desc:0 "Линкоры класса Gascogne были подклассом Richelieu. Три корабля заказали по программе 1940 года, но строительство ни одного не началось. Проект повторял Richelieu, однако главное вооружение равномерно размещалось в носу и корме, ПВО усиливалась, а более мощные двигатели улучшали общие характеристики."
 EFR_battleship_4:0 "Класс Alsace"
 EFR_battleship_4_desc:0 "Линкоры класса Alsace должны были сменить Richelieu. Было заказано четыре корабля; исследования завершили в 1939 году, проект утвердили в 1940-м, а закладку планировали на 1941 год, но падение Франции помешало этому. Проект превосходил Richelieu более тяжёлыми и многочисленными орудиями главного калибра, усиленной ПВО, толстой бронёй и мощными двигателями."
 EFR_SH_battleship_1:0 "Класс Charlemagne"
 EFR_SH_battleship_1_desc:0 "Сверхтяжёлые линкоры класса Charlemagne были гипотетическим проектом для противодействия крупнейшим кораблям других флотов. Они получали тяжёлое вооружение, полностью сосредоточенное в носовой части и расположенное возвышенно, мощную ПВО и толстую броню. Проект заимствовал элементы у Richelieu и британского Nelson."
 EFR_SH_battleship_2:0 "Класс Napoléon Bonaparte"
 EFR_SH_battleship_2_desc:0 "Линкоры класса Napoléon Bonaparte были гипотетическим проектом на основе Alsace и Gascogne. Тяжёлое вооружение равномерно распределялось между носом и кормой в трёхорудийных башнях, дополнялось возвышенной вспомогательной артиллерией и мощной ПВО. Толстая броня и сильные двигатели обеспечивали скорость и защиту, необходимые для действий вместе с флотом и борьбы с противником."
 EFR_carrier_1:0 "Класс Béarn"
 EFR_carrier_1_desc:0 "Béarn изначально заложили как линкор класса Normandie, но позднее достроили в качестве авианосца водоизмещением 22 100 тонн. Он служил в межвоенный период и во Вторую мировую. Как переоборудованный корабль, он был медленным и имел небольшую авиагруппу, но средний броневой пояс и большая дальность частично компенсировали недостатки. Его строительство дало конструкторам DCAN важный опыт и привело к последующим проектным исследованиям."
 EFR_carrier_2:0 "Класс Joffre"
 EFR_carrier_2_desc:0 "Авианосцы класса Joffre (проект PA-16) представляли следующее поколение французских авианосцев. Это был итог исследований, начатых в 1929 году и завершённых в 1937-м. Два корабля утвердили по программе 1938 года, но нарастающие конфликты замедлили строительство, а падение Франции окончательно помешало завершению. Водоизмещение должно было составить около 20 000 тонн. Корабли получали хорошую ПВО, броню и скорость, но авиагруппа была меньше средней. В целом это был бы сбалансированный и универсальный авианосец."
 EFR_carrier_3:0 "Класс Jean Bart"
 EFR_carrier_3_desc:0 "Авианосец Jean Bart был проектом середины войны по переоборудованию недостроенного линкора класса Richelieu в полноценный авианосец, подобно японскому IJN Shinano. Крупный корпус позволил бы разместить большую авиагруппу, а мощные двигатели обеспечили бы высокую скорость и дальность. Тяжёлое зенитное вооружение американского происхождения давало бы хорошую защиту от самолётов и небольших надводных кораблей."
 EFR_carrier_4:0 "Класс Clemenceau"
 EFR_carrier_4_desc:0 "Авианосцы класса Clemenceau (проект PA-28) стали первым послевоенным проектом французского флота. По конструкции они напоминали недостроенные авианосцы класса Joffre, но должны были оснащаться современным французским оборудованием и вооружением. Получение американских и британских эскортных авианосцев, а также тяжёлое экономическое положение послевоенной Франции не позволили заложить эти корабли. Не следует путать их с более поздними авианосцами класса Clemenceau (проект PA-54), заложенными в 1955 и 1957 годах."
 FRA_FREE_army:0 "Французская освободительная армия"
 FRA_FREE_henry_de_rancourt_de_mimerand:0 "Анри де Ранкур де Мимеран"
 VIC_gazogenes_and_michelin_tires:0 "Газогенераторы"
 VIC_gazogenes_and_michelin_tires_desc:0 "Нефть становится всё дефицитнее, поэтому мы должны искать заменители. Большинство граждан уже пересело на велосипеды, но автомобили тоже могут работать на альтернативном топливе. Газогенераторы позволяют использовать энергию сгорания угля и даже древесины."
 VIC_STO_desc:0 "«Обязательная трудовая служба» — система обмена, при которой рабочих отправляют в Германию, поскольку Рейху не хватает людей одновременно для дивизий и заводов. Благодаря этому были освобождены десятки тысяч солдат, хотя часть из них осталась в Германии уже как свободные рабочие."
 VIC_reinforce_the_STO:0 "Усилить S.T.O."
 VIC_reinforce_the_STO_desc:0 "Рабочий! Трудясь ради Европы, ты защищаешь страну и дом. Ты станешь послом французского качества и обеспечишь финансовую стабильность своей семье."
 VIC_rationing:0 "Нормирование"
 VIC_rationing_desc:0 "Чтобы сберечь немногие оставшиеся ресурсы, необходимо ввести карточную систему. Список ограниченных продуктов велик и включает оливковое масло, хлеб, сливочное масло, мясо, молоко и яйца. Конфеты запрещены, а пресса должна публиковать советы по приготовлению блюд из заменителей: супа из брюквы, салата из тёртого чертополоха, кофе без кофе..."
 VIC_armistice_army:0 "Организовать армию перемирия"
 VIC_armistice_army_desc:0 "Хотя наши действия с остатками армии ограничены, её всё равно необходимо правильно организовать и пересмотреть тактику, чтобы быть готовыми сразиться с любым врагом Франции."
 VIC_hide_military_equipment:0 "Спрятать военное снаряжение"
 VIC_chantiers_de_la_jeunesse:0 "Молодёжные трудовые лагеря"
 VIC_chantiers_de_la_jeunesse_desc:0 "Поскольку военная служба отменена, молодёжь должна служить в так называемых «молодёжных трудовых лагерях». В этих открытых лагерях они будут выполнять небольшие инфраструктурные работы, участвовать в маршах по дикой местности и заниматься физической подготовкой."
 VIC_negociate_the_release_of_officers:0 "Договориться об освобождении офицеров"
 VIC_negociate_the_release_of_officers_desc:0 "Благодаря нашему отношению к европейскому сотрудничеству нам наконец удалось добиться крупной уступки от рейхсканцлера Гитлера: освобождения тысяч офицеров, находившихся в плену в Германии."
 VIC_LVF:0 "Легион французских добровольцев"
 VIC_secret_military_researches:0 "Тайные военные исследования"
 VIC_secret_military_researches_desc:0 "Хотя перемирие запрещает использовать часть техники, например танки, мы можем тайно продолжать эксперименты, применяя то, чем остальное общество пользуется в других сферах: эрзацы."
 VIC_bulldozer_experiments:0 "Эксперименты с бульдозерами"
 VIC_bulldozer_experiments_desc:0 "Нам запрещено иметь танки, но мы можем приобретать гусеничные машины под видом тяжёлой снегоуборочной техники или бульдозеров. Они не будут использоваться в бою, но дадут необходимые технические данные для будущих танков."
 VIC_contact_renault:0 "Связаться с Renault"
 VIC_contact_renault_desc:0 "Пока Renault производит грузовики для оккупационных сил, следует выяснить, сможет ли компания тайно разработать для нас современные машины."
 VIC_autorized_modernization:0 "Разрешённая модернизация"
 VIC_autorized_modernization_desc:0 "Наконец мы получили возможность проектировать новое снаряжение и полностью модернизировать вооружённые силы."
 VIC_restart_heavy_water_production:0 "Возобновить производство тяжёлой воды"
 VIC_restart_heavy_water_production_desc:0 "Одним из важнейших стратегических ресурсов, ускользнувших от немецких войск, стали запасы тяжёлой воды, эвакуированные в Британию во время вторжения. С возвращением военных амбиций необходимо возродить проект по использованию перспективных свойств урана."
 VIC_military_youth:0 "Военизированная молодёжь"
 VIC_military_youth_desc:0 "Молодёжь Франции! Эта борьба касается не только ваших родителей — это борьба за ваше собственное будущее! Пора выступить против англо-американских предателей! Как можно танцевать зазу в столь решающий час для будущего Европы и всего мира? Молодёжь Франции, во имя полной национальной и социалистической революции — поднимайся!"
 VIC_milice_francaise:0 "Французская милиция"
 VIC_milice_francaise_desc:0 "Французская милиция — инструмент репрессий режима против подрывных элементов: евреев, коммунистов, голлистов и партизан в целом."
 VIC_phalange_africaine:0 "Африканская фаланга"
 VIC_phalange_africaine_desc:0 "Африканская фаланга была создана для борьбы с силами Союзников в Северной Африке и набиралась из французского населения Алжира."
 VIC_ideological_fanaticism:0 "Идеологический фанатизм"
 VIC_ideological_fanaticism_desc:0 "Мы присягнули Петену и Франции. Мы не предадим это слово, как англичане, которые десятилетиями находились под еврейским влиянием."
 VIC_technology_sharing:0 "Обмен технологиями"
 VIC_technology_sharing_desc:0 "Сотрудничество помогает и в науке. Встреча французских и немецких учёных, мирно обменивающихся знаниями, — ещё один пример единства Европы перед лицом врагов."
 VIC_police_nationale:0 "Национальная полиция"
 VIC_police_nationale_desc:0 "Чтобы защитить полицию от внутренних и внешних врагов, муниципальные силы необходимо реорганизовать в Национальную полицию. Она получит новые помещения, современное оснащение и новую форму, вдохновлённую полицией СС."
 EFR_strengthen_government_support_focus:0 "Укрепить поддержку правительства"
