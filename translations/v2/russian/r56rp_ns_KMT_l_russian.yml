 CHI_r56rp_manpower_for_the_offensive:0 "Сбор рабочей силы для резервных и активных подразделений"
 CHI_r56rp_political_goals:0 "Определить стратегические цели"
 CHI_r56rp_launch_the_offensive:0 "Запустите наступление!"
 CHI_r56rp_nra_1939_offensive:0 "Зимнее наступление 1939 года"
 CHI_r56rp_nra_1939_offensive_desc:0 "Японские собаки слишком долго недооценивали волю китайской армии и народа. Мы покажем империалистам, что китайская нация больше не будет увлажнена островными варварами!"
 r56rp_KMT_nra_1939_winter_offensive:0 "Зимнее наступление 1939"
 r56rp_KMT_nra_1939_winter_offensive_desc:0 "Мы слишком долго были на заднем крае этой войны, Национальная стрелковая ассоциация представила правительству Гоминьдана предложение о том, чтобы зарезервировать это и вернуть инициативу в войне."
 r56p_KMT_nra_1939_decision_unlock_tt:0 "Разблокирует решение подготовиться к массированному наступлению на японцев, у вас есть 90 дней, чтобы подготовить атаку, иначе наступление будет гораздо слабее, чем предполагалось."
 CHI_r56rp_industrial_evacuations_add_IC:0 "Добавить §YГражданские заводы§!\n"
