 r56rp_CHI_anti_corruption_crusader:0 "Обидный реформатор"
 r56rp_CHI_crime_boss:0 "Босс мафии"
 CHI_r56rp_already_addresing_yuesheng:0 "Мы уже имеем дело с [CHI.CHI_du_yuesheng.GetName]"
 CHI_r56rp_administrative_review:0 "Административный обзор"
 CHI_r56rp_administrative_review_desc:0 "Мы запустим серию случайных проверок в различные органы нашей гражданской администрации. Это должно раскрыть коррупцию."
 CHI_r56rp_arrest_yuesheng:0 "Арест [CHI.CHI_du_yuesheng.GetName]"
 CHI_r56rp_arrest_yuesheng_desc:0 "Поскольку коррупция близка к искоренению, мы можем заключить сделку путем тщательного судебного преследования. [CHI.CHI_du_yuesheng.GetName] В прошлом он занимался опиумом."
 CHI_r56rp_assasinate_yuesheng:0 "Убить [CHI.CHI_du_yuesheng.GetName]"
 CHI_r56rp_assasinate_yuesheng_desc:0 "Потенциально полезный, [CHI.CHI_du_yuesheng.GetName] Он более чем превзошел свой приветствие. Влияние различных элементов подземного мира достаточно низко, чтобы избавиться от него, отправив сообщение остальному миру преступности, активному в Китае."
 CHI_r56rp_utilize_cbis:0 "использовать [ROOT.GetAgency]"
 CHI_r56rp_utilize_cbis_desc:0 "Мы можем использовать наше разведывательное агентство, чтобы следить за различными политическими чиновниками, подозреваемыми в совершении правонарушений."
 r56rp_kmt.1.t:0 "Люди объединились против восходящего солнца."
 r56rp_kmt.1.d:0 "В свете японского вторжения мы приятно удивлены, заметив, что различные криминальные элементы замедляют свои различные «предприятия», бросая свой вес за усилия КМТ по отражению захватчика.\n\nЭтот пыл должен длиться до тех пор, пока мы находимся в состоянии войны с японской угрозой."
 r56rp_kmt.1.a:0 "Превосходно."
 r56rp_kmt.2.t:0 "Коррупция возвращается на довоенный уровень."
 r56rp_kmt.2.d:0 "С уходом общего врага коррупция вновь возобновила свои подлые махинации."
 r56rp_kmt.2.a:0 "Было приятно, пока это продолжалось."
 r56rp_KMT_national_institute_create_idea:0 "Университет Цзяо Тонг"
 r56rp_KMT_national_institute_create_idea_desc:0 "Университет Цзяо Тун получил дополнительное финансирование."
 KMT_improve_our_railways_tt:0 "Добавляет склад снабжения в §YЧунцин§!"
 KMT_arms_purchases_abroad:0 "Купить Материалы Заграницей"
 KMT_arms_purchases_abroad_desc:0 "Поскольку наша производственная способность такова, какова она есть, нам придется увеличить наше производство за счет закупок иностранной техники."
 KMT_trade_deal_with_germany_1:0 "Торговая сделка [GER.GetNameDef]"
 KMT_trade_deal_with_germany_1_desc:0 "Германскому правительству будет предложено соглашение об увеличении и без того большого объема торговли между нашими двумя народами. Мы будем торговать определенными нашими ресурсами, которых не хватает их стране для более выгодного государственного кредита. Это позволит нам увеличить наши производственные возможности за счет выделения этих новых средств как военному, так и гражданскому секторам."
 KMT_trade_deal_with_germany_2:0 "Технологический обмен с [GER.GetNameDef]"
 KMT_trade_deal_with_germany_2_desc:0 "Немцы на годы опережают нас в технологическом развитии, как гражданском, так и военном. Мы должны обеспечить технологический обмен."
 KMT_manchurian_question:0 "Вопрос о Маньчжурии"
 KMT_manchurian_question_desc:0 "С 1931 года мы мечтаем о возвращении утраченных земель. С нашей недавно выкованной связью с [JAP.GetNameDef]Это ставит нас в нестабильную ситуацию. Мы не можем продолжать до тех пор, пока не будет решен Маньчжурский вопрос, и мы либо воссоединимся с нашим северным братом, либо признаем Маньчурию отдельным государственным образованием и откажемся от наших притязаний на эти земли."
 KMT_manchurian_offer:0 "Предложение для Маньчжурии"
 KMT_manchurian_offer_desc:0 "Гражданская война в Японии предоставляет такую возможность, как никакая другая. Мы можем воссоединиться с нашими давно потерянными братьями, однако бывшие члены Императорской японской армии поселились там. Они должны знать, что даже после Гражданской войны новое правительство Японии не примет их."
 KMT_create_national_institute:0 "Университет Цзяо Тонг"
 KMT_create_national_institute_desc:0 "В течение многих лет Китай страдал от недостатка финансирования в области высшего образования, так как центральное правительство объявило об основании Университета Цзяо Тун, который обеспечит высшее образование для нашего народа, позволяя китайской нации процветать в области науки и догонять соседние страны, которые превзошли нас в грамотности и науке из-за надлежащего финансирования."
 KMT_continental_shipbuilding:0 "Военно-морская база Вэньчжоу"
 KMT_continental_shipbuilding_desc:0 "После отказа в законном восстановлении Тайваня у нас нет другого выбора, кроме как расширить наши военно-морские производственные возможности на материке. В связи с этим дальнейшее расширение шанхайских верфей и открытие новых верфеев в Вэньчжоу будут введены в эксплуатацию немедленно и по завершении начнется производство на новом республиканском китайском флоте."
 KMT_r56rp_industrialization_NW.tt:0 ""
