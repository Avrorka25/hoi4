 CHI_warlord_in_opposition:0 "Оппозиционный военачальник"
 improved_worker_conditions:0 "Улучшение рабочих условий"
 improved_worker_conditions_desc:0 "Работа на заводе тяжела и сопряжена со множеством опасностей. Улучшение условий труда временно снизит выпуск продукции, но долгосрочные выгоды того стоят."
 promises_of_peace:0 "Обещание мира"
 promises_of_peace_desc:1 "История научила нас ужасам войны. Мы не должны допустить их повторения. Настало время нашей стране познать мир и процветание."
 refuse_the_tribute:0 "Отказ платить дань"
 refuse_the_tribute_desc:0 "Требования [SOV.GetAdjective] стороны истощают нашу страну. Нельзя позволять так называемым «товарищам» эксплуатировать нас."
