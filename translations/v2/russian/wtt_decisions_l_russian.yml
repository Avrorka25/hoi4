 MAN_develop_kirin_aluminium_deposits:0 "Разработка месторождений бокситов в Цзилини"
 MAN_develop_liaotung_iron_ore_deposits:0 "Разработка месторождений железа в Ляодуне"
 targeted_race_for_the_bomb:0 "Ядерная гонка"
 targeted_race_for_the_bomb_desc:0 "Мы не можем позволить другим создать атомную бомбу раньше нас. Необходимо сделать всё возможное, чтобы сохранить технологическое превосходство."
 first_nuke_dropped:0 "Сброшена первая атомная бомба"
 CHI_border_clashes:0 "Пограничные стычки"
 CHI_border_clashes_desc:0 "Рельеф Китая заставляет всех тщательно выбирать места для сражений. Это позволяет нам захватывать уязвимые территории, не начиная полномасштабную войну."
