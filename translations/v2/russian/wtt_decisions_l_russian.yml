 recall_von_lettow_vorbeck:0 "Отозвать фон Леттова-Форбека"
 recall_von_lettow_vorbeck_desc:0 "После восстановления Гогенцоллернов на престоле старый Лев Восточной Африки предлагает свои услуги."
 GER_sharpen_air_safety_regulations:0 "Усилить правила воздушной безопасности"
 GER_sharpen_air_safety_regulations_desc:0 "Более строгие правила безопасности помогут предотвратить некоторые распространённые причины катастроф, в том числе с участием дирижаблей."
 MAN_recruit_bandits_north:0 "Завербовать северных бандитов"
 MAN_recruit_bandits_north_desc:0 "Каждая пуля, потраченная на охоту за бандитами, — это пуля, которой не будет в грядущей борьбе. Вместо войны с подданными следует дать им возможность искупить вину службой императору."
 MAN_recruit_bandits_west:0 "Завербовать западных бандитов"
 MAN_recruit_bandits_west_desc:0 "Каждая пуля, потраченная на охоту за бандитами, — это пуля, которой не будет в грядущей борьбе. Вместо войны с подданными следует дать им возможность искупить вину службой императору."
 MAN_recruit_bandits_east:0 "Завербовать восточных бандитов"
 MAN_recruit_bandits_east_desc:0 "Каждая пуля, потраченная на охоту за бандитами, — это пуля, которой не будет в грядущей борьбе. Вместо войны с подданными следует дать им возможность искупить вину службой императору."
 MAN_recruit_bandits_generic:0 "Завербовать оставшихся бандитов"
 MAN_recruit_bandits_generic_desc:0 "Наши тюрьмы и трудовые лагеря переполнены теми, кто прежде сражался против нас. В борьбе за свободу нужен каждый солдат и каждая винтовка. Император может проявить легендарные милосердие и великодушие, дав преступникам возможность искупить вину службой."
 MAN_release_bandits:0 "Отпустить бандитов"
 MAN_release_bandits_desc:0 "Бывшие преступники и отребье доказали готовность жертвовать собой ради императора и теперь могут быть безопасно возвращены в общество."
 MAN_war_preparations:0 "Война за независимость"
 MAN_raise_manchu_banner:0 "Создать отряды маньчжуров"
 MAN_raise_manchu_banner_desc:0 "В прежние времена цинские императоры могли призывать знаменные войска на свои войны. Хотя времена изменились, принцип остался прежним. Дому Цин вновь требуется служба знаменосцев."
 MAN_disband_the_banners:0 "Расформировать отряды маньчжуров"
 MAN_disband_the_banners_desc:0 "Их служба завершена, и маньчжурские знамёна вновь могут вернуться к домам и семьям — до следующего призыва."
 MAN_fund_underground_gun_shops:0 "Наладить кустарное производство"
 MAN_fund_underground_gun_shops_desc:0 "Мелкие мастерские не дают эффекта масштаба крупных заводов, а контроль качества в них крайне неоднороден. Однако распределение производства оружия между небольшими предприятиями по всей стране — лучший способ быстро увеличить выпуск."
 MAN_remove_underground_gun_shops:0 "Прекратить кустарное производство"
 MAN_remove_underground_gun_shops_desc:0 "Созданные нами оружейные мастерские выполнили задачу. Пора вернуться к более организованному производству вооружений."
 MAN_divert_machine_tools:0 "Перенаправить станки"
 MAN_divert_machine_tools_desc:0 "Контролируя железные дороги, мы можем проследить, чтобы некоторые партии станков «потерялись» из-за «административной ошибки»."
 MAN_prepare_to_seize_arms:0 "Подготовиться к захвату японских складов оружия"
 MAN_prepare_to_seize_arms_desc:0 "Склады и тайники с припасами по всей стране охраняются плохо. Хорошо спланированный и своевременный штурм позволит захватить их с минимальными потерями, получить современное оружие и одновременно лишить [JAP.GetAdjective] сторону боеприпасов и снабжения. Чем больше времени и ресурсов мы вложим, тем больше складов удастся захватить."
 MAN_seize_arms:0 "Выполнить план"
 MAN_seize_arms_desc:0 "Ударить стремительно! ЗА ИМПЕРАТОРА!"
 MAN_can_prepare_more_tt:0 "Можно провести дополнительные приготовления для захвата новых складов.\n"
