 JAP_war_conferences_cd:0 "Имперская военная конференция уже собиралась в последние 6 месяцев"
 war_propaganda_against_tension:1 "Военная пропаганда против [From.GetNameDef]"
 war_propaganda_against_tension_desc:0 "Мы должны противостоять угрозе со стороны [From.GetNameDef]. Безопасность страны зависит от участия каждого мужчины."
 war_propaganda_against_warmonger:1 "Военная пропаганда против [From.GetNameDef]"
 war_propaganda_against_warmonger_desc:0 "Страна призывает каждого мужчину, женщину и ребёнка. Такая же война, как у [From.GetNameDef], может прийти и к нам."
