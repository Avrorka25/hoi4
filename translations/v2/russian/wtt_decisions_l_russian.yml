 demob_manpower_mission:0 "Снижение призыва"
 demobilization_desc:0 "Поскольку угроза войны кажется далёкой, люди больше не желают терпеть тяготы законов военного времени. Следует пересмотреть законодательство и изменить его, чтобы успокоить протестующих до обострения ситуации."
 demobilization_economic_desc:0 "Поскольку угроза войны кажется далёкой, люди больше не желают терпеть тяготы военной экономики. Следует пересмотреть экономические законы и увеличить выпуск потребительских товаров, чтобы удовлетворить их требования."
 draft_dodging_mission:0 "Решение проблемы уклонистов"
 draft_dodging_mission_desc:0 "Если быстро не решить проблему отказа новобранцев от призыва, она лишь усугубится и может заставить людей усомниться в авторитете правительства."
