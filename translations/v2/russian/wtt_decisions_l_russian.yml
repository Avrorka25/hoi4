 institute_press_censorship_neutrality_state_desc:0 "Сейчас опасные времена, и мы не можем позволить инакомыслию разорвать страну. Ограничение свободы прессы необходимо, чтобы истина звучала громко и ясно."
 JAP_colonial_independence:0 "Независимость колоний"
 JAP_return_manchuria:0 "Возвращение Маньчжурии"
 PRC_return_manchuria_communist:0 "Требование возвращения Маньчжурии"
 PRC_return_manchuria_communist_desc:0 "Японские империалисты отняли Маньчжурию у её законных владельцев — свободного народа Китая. Теперь, когда наши товарищи в [JAP.GetNameDef] свергли угнетателей, следует потребовать вернуть её народу."
 JAP_liberate_manchuria_alliance_tt:0 "Отправляет предложение о союзе."
 JAP_interservice_rivalry:0 "Соперничество в войсках"
 JAP_interservice_rivalry_desc:0 "Императорский флот и Императорская армия ведут ожесточённую борьбу за ограниченные ресурсы. Мы создали регулярные совещания, чтобы распределять их правильно. Поддержка одной стороны в ущерб другой будет иметь далеко идущие последствия."
