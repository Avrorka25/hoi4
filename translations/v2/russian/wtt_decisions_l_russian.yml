 GER_reichskommissariats:0 "Рейхскомиссариаты"
 GER_reichskommissariats_desc:0 "Захват новых территорий приносит сопротивление и создаёт необходимость в эффективном управлении. Рейхсминистр Альфред Розенберг предложил создать особые оккупационные режимы — рейхскомиссариаты, которые позволят лучше контролировать местное население и бороться с сопротивлением на более низком уровне, чем обычные войска."
