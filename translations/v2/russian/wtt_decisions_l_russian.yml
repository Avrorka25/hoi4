 CHI_communist_infiltration:0 "Внедрение коммунистов"
 CHI_communist_infiltration_desc:0 "Поступают сообщения, что коммунистические группы создают опорные районы в отдалённых частях страны. Следует направить агентов, чтобы подтвердить это и нанести по ним удар.\n[Root.GetDiscoveredInfiltration]"
