 GER_austro_hungarian_empire:0 "Австро-Венгрия"
 GER_mefo_bills_category:0 "Векселя «МЕФО»"
 GER_mefo_bills_category_desc:0 "Чтобы финансировать растущую военную промышленность и скрыть это от [ENG.GetAdjective] и [FRA.GetAdjective] глаз, нам пришлось использовать фиктивную балансовую компанию для проведения платежей в форме векселей. Если мы не воспользуемся политическими связями и не продлим сроки их погашения, придётся выплатить долг и лишиться преимуществ."
 GER_mefo_bills_mission:0 "Срок оплаты векселей «МЕФО»"
 GER_can_delay_mefo_payment:0 "Можно отсрочить выплату по векселям МЕФО."
 GER_mefo_bills_mission_desc:0 "Срок погашения выпущенных нами векселей скоро наступит. Необходимо решить, продлевать их или начинать выплаты."
 GER_extend_mefo_bills:0 "Векселя «МЕФО»"
 GER_extend_mefo_bills_desc:0 "Продлить срок погашения векселей МЕФО ещё на три месяца и продолжить пользоваться их преимуществами. Однако это также повысит стоимость окончательных выплат."
 GER_extend_mefo_bills_tt:1 "Решить, продлить ли «§Yвекселя МЕФО§!» или начать выплаты.\n"
 GER_mefo_bills_mission_tt:1 "Продлить «§Yвекселя МЕФО§!» на шесть месяцев; продление вступит в силу после истечения срока текущей партии.\n\nСтоимость каждого последующего продления будет постепенно возрастать до начала войны. После её начала зависимость от векселей МЕФО исчезнет, а выплаты будут отложены до завершения войны.\n\n"
 GER_mefo_bills_effect_in_days:1 "Через [?Root.days_mission_timeout@GER_mefo_bills_mission|H0] дней произойдёт следующее:\n"
 GER_mefo_bills_extension_timer:0 "До срока погашения векселей МЕФО."
 GER_mefo_bills_extension:0 "С момента продления векселей МЕФО прошло менее 60 дней."
 GER_mefo_bills_extended:0 "Векселя МЕФО продлены"
 GER_renew_mefos:0 "Продлить векселя «МЕФО»"
 GER_renew_mefos_desc:0 "Рейхсбанк играет ключевую роль в восстановлении и перевооружении страны. Очевидно, решение выплатить долги было ошибкой, поэтому следует продлить векселя МЕФО ещё на несколько месяцев."
 GER_cancel_mefos:0 "Отменить векселя «МЕФО»"
 GER_cancel_mefos_desc:0 "Мы слишком долго полагались на Рейхсбанк при восстановлении военной промышленности. Пора выполнить долговые обязательства перед производителями вооружений и положить конец этому фарсу с «векселями МЕФО»."
 GER_case_anton_category:0 "Операция «Антон»"
 GER_case_anton_category_desc:0 "Вишистская Франция была создана, чтобы французские колонии и флот не достались союзникам. Однако это соглашение можно отменить в любой момент. У нас готов план силовой интеграции территории и молниеносного броска к базе французского флота в Тулоне."
 GER_case_anton:1 "Проведение операции «Антон»"
 GER_case_anton_tt2:1 "Не контролирует ни одного французского региона в Северной Африке."
 GER_case_anton_tt:0 "Аннексирует Вишистскую Францию через 7 дней и захватывает французский флот.\n\n§RФранция сможет затопить свой флот, если германские войска не окажутся в Тулоне в течение 2 дней!§!\n"
 GER_case_red:0 "План «Рот»"
 GER_operation_marita:0 "Операция «Марита»"
 political_actions:0 "Политические действия"
 ban_fascist_party:0 "Запрет фашизма"
 ban_fascist_party_desc:0 "В нынешней обстановке дальнейшая деятельность фашистских партий подрывает нашу способность эффективно управлять. Необходимо принять решительные меры."
 ban_fascist_party_tt:1 "Изменение популярности фашизма: §G-§![?.Root.party_popularity@fascism|%0G].\n"
 ban_democratic_party:1 "Запрет демократических партий"
 ban_democratic_party_desc:1 "Партии политического центра слишком долго мешали нашему правительству. Их настойчивые требования «прав» личности подрывают усилия по созданию лучшей страны для всего населения."
 ban_democratic_party_tt:1 "Изменение популярности демократии: §G-§![?.Root.party_popularity@democratic|%0G].\n"
 ban_communist_party:0 "Запрет коммунизма"
 ban_communist_party_desc:0 "Коммунистическая партия при каждом удобном случае протестует против правительства, сеет недовольство и мешает управлению. Пора положить этому конец."
 ban_communist_party_tt:1 "Изменение популярности коммунизма: §G-§![?.Root.party_popularity@communism|%0G].\n"
 ban_authoritarian_party:0 "Запретить авторитаризм"
 ban_authoritarian_party_desc:0 "Авторитарная партия при каждом удобном случае протестует против правительства, сеет недовольство и мешает управлению. Пора положить этому конец."
 ban_neutrality_party_tt:1 "Изменение популярности авторитаризма: §G-§![?.Root.party_popularity@neutrality|%0G].\n"
 anti_fascist_raids:0 "Антифашистские рейды"
 anti_fascist_raids_desc:0 "Ради долгосрочной внутренней стабильности необходимо подавить фашистские элементы в стране. Их влияние слишком велико и потенциально угрожает власти."
 anti_democratic_raids:0 "Антидемократические рейды"
 anti_democratic_raids_desc:0 "Ради долгосрочной внутренней стабильности необходимо подавить демократические элементы в стране. Их влияние слишком велико и потенциально угрожает власти."
 anti_communist_raids:0 "Антикоммунистические рейды"
 anti_communist_raids_desc:0 "Ради долгосрочной внутренней стабильности необходимо подавить коммунистические элементы в стране. Их влияние слишком велико и потенциально угрожает власти."
 anti_authoritarian_raids:0 "Антиавторитарные рейды"
 anti_authoritarian_raids_desc:0 "Ради долгосрочной внутренней стабильности необходимо подавить авторитарные элементы в стране. Их влияние слишком велико и потенциально угрожает власти."
 object_to_attaches:0 "Протесты против атташе"
 object_to_attaches_desc:0 "Наши враги получают иностранную помощь! Мы должны выразить решительный протест и потребовать отзыва всех атташе."
 infrastructure_building_slot:0 "Региональная промышленная интеграция"
 infrastructure_building_slot_flag:0 "Ещё не получена дополнительная ячейка строительства за инфраструктуру."
 war_building_slot:0 "Передача земель под промышленность"
 war_building_slot_flag:0 "Ещё не получена дополнительная ячейка строительства за изъятие земель."
 special_projects:0 "Особые проекты"
 CHI_xian_fired:0 "Китайские лидеры приглашены в Сиань"
 JAP_intervene_in_china_level_down:0 "Снизить уровень вмешательства в Китае"
 JAP_china_step_up_war_effort:0 "Эскалация военного конфликта в Китае"
 JAP_ichi_go:0 "Операция «Ити-Го»"
 JAP_ichi_go_desc:0 "Конец войны уже виден. Последним решительным наступлением мы можем быстро завершить конфликт. Однако если победа не будет достигнута в течение следующего года, усиление военных усилий может вызвать внутреннюю нестабильность и рост общественного недовольства."
 JAP_conquer_china:0 "Захват Китая"
 JAP_release_korea:0 "Независимость Кореи"
 JAP_southern_expansion:0 "Экспансия на юг"
 JAP_sue_for_peace_CHI:1 "Предложить условия сдачи [From.GetNameDef]"
 JAP_sue_for_peace_TT:0 "Ни один материковый национальный регион §YКитая§! или §YКореи§! не контролируется §YЯпонией§! или её зависимыми государствами."
 JAP_sue_for_peace_CHI_desc:0 "Мы утратили позиции на материке. Военные считают возвращение потерянных территорий маловероятным. Гражданское правительство предлагает добиваться условий, которые позволят сохранить суверенитет над островами."
 JAP_sue_for_peace_MAN:0 "Предложить условия сдачи [From.GetNameDef]"
 JAP_sue_for_peace_MAN_desc:0 "Мы утратили позиции на материке. Военные считают возвращение потерянных территорий маловероятным. Гражданское правительство предлагает добиваться условий, которые позволят сохранить суверенитет над островами."
 JAP_sue_for_peace_nuke:0 "Безоговорочная капитуляция"
 JAP_sue_for_peace_nuke_desc:0 "Враг применил новую и крайне жестокую бомбу. Война развивается не обязательно в нашу пользу. Мы должны вынести невыносимое."
 JAP_sue_for_peace_nuke_mission:0 "Нанести ядерные удары по [JAP.GetAdjective] территории"
 JAP_sue_for_peace_nuke_mission_desc:1 "Недавнее успешное испытание ядерной бомбы предлагает альтернативу полномасштабному вторжению на Японские острова. Разведка считает, что если мы отнимем у [JAP.GetAdjective] стороны Окинаву и Иводзиму, сократим её флот до 30 кораблей и быстро нанесём ядерные удары по двум целям на родных островах, [JAP.GetAdjective] правительство будет вынуждено безоговорочно капитулировать."
 JAP_request_soviet_support:0 "Попросить поддержку со стороны Советского Союза"
 JAP_request_soviet_support_desc:0 "В нынешней гражданской войне нам нужна помощь, и наиболее вероятными сторонниками нашего дела являются [SOV.GetAdjective] соседи на севере. Возможно, мы могли бы обменять Южный Сахалин на группу [SOV.GetAdjective] добровольческих дивизий."
 JAP_nuke_1:0 "Нанесён первый ядерный удар по Японии"
 JAP_nuke_2:0 "Нанесён второй ядерный удар по Японии"
 foreign_politics:0 "Внешняя политика"
 JAP_pressure_france:1 "Потребовать Индокитай"
 JAP_break_the_london_naval_treaty:0 "Разрыв Лондонского морского соглашения"
 JAP_break_the_london_naval_treaty_desc:0 "Возмутительные ограничения Лондонского морского договора угрожают безопасности страны. Мы должны получить свободу строить флот, способный противостоять любому государству, посягающему на то, что принадлежит нам по праву."
 JAP_tora_tora_tora:0 "Тора! Тора! Тора!"
 JAP_tora_tora_tora_desc:0 "Первый удар уже близок. Затем необходимо действовать стремительно и, используя набранный темп, сокрушить врагов прежде, чем они поймут, что произошло."
 JAP_war_with_soviet_union:0 "Объявить войну государству [SOV.GetNameDef]"
 JAP_war_with_soviet_union_desc:0 "Наши европейские союзники подписали с [SOV.GetNameDef] пакт о ненападении. Но наша война не может ждать: мы должны самостоятельно начать конфликт с коммунистами, даже рискуя оттолкнуть союзников."
 prospect_for_resources:1 "Разведка ресурсов"
 prospect_for_resources_desc:0 "Наши геологи обнаружили на территории страны несколько перспективных месторождений. Мы можем вложить средства в их разработку. Развитие технологий добычи сделает пригодными для эксплуатации и другие залежи."
 economy_decisions:0 "Экономическая политика"
 institute_press_censorship_fascist_state:0 "Цензура прессы"
 institute_press_censorship_fascist_state_desc:0 "Сейчас опасные времена, и мы не можем позволить инакомыслию разорвать страну. Ограничение свободы прессы необходимо, чтобы истина звучала громко и ясно."
 institute_press_censorship_democratic_state:0 "Цензура прессы"
 institute_press_censorship_democratic_state_desc:0 "Сейчас опасные времена, и мы не можем позволить инакомыслию разорвать страну. Ограничение свободы прессы необходимо, чтобы истина звучала громко и ясно."
