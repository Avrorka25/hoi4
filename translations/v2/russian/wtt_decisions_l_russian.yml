 hold_fight_on_the_beaches_speech:0 "Речь «Мы будем сражаться на пляжах»"
 hold_fight_on_the_beaches_speech_desc:0 "«Мы пойдём до конца. Мы будем сражаться во Франции, мы будем сражаться на морях и океанах, мы будем сражаться с растущей уверенностью и растущей силой в воздухе, мы будем защищать наш остров любой ценой. Мы будем сражаться на пляжах, мы будем сражаться на местах высадки, мы будем сражаться в полях и на улицах, мы будем сражаться на холмах; мы никогда не сдадимся...»"
 fight_on_the_beaches_speech:0 "Речь «Мы будем сражаться на пляжах»"
 operation_fork:0 "Операция «Форк»"
 operation_fork_desc:0 "Недавно ставшая независимой Исландия занимает чрезвычайно важное стратегическое положение в Северной Атлантике. Потеря Норвегии сделает беззащитный остров уязвимым. Мы должны опередить врагов и первыми вторгнуться в Исландию и оккупировать её, иначе они получат стратегические базы, с которых смогут угрожать нашим линиям снабжения. Только под нашей защитой [ICE.GetAdjective] народ будет в безопасности."
 invade_ireland:0 "Вторгнуться в [IRE.GetNameDef]"
 invade_ireland_desc:0 "Безопасность конвоев необходимо обеспечить любыми средствами. Вторжение в [IRE.GetNameDef] может показаться неприемлемым, но если только так можно получить доступ к её авиабазам, значит, так тому и быть."
 macdonald_proposal:0 "Предложение Макдональда"
 macdonald_proposal_desc:0 "Мы должны обеспечить безопасность конвоев, а для этого [IRE.GetAdjective] воздушные и военно-морские базы имеют первостепенное значение. Мы отправим посланника с предложением передать Северную Ирландию в обмен на немедленное вступление [IRE.GetNameDef] в войну на нашей стороне."
 hold_blood_toil_tears_sweat_speech:0 "Речь «Кровь, пот и слёзы»"
 hold_blood_toil_tears_sweat_speech_desc:0 "«Мне нечего предложить, кроме крови, тяжёлого труда, слёз и пота. [...] Вы спрашиваете, какова наша политика? Я отвечу: вести войну на море, на суше и в воздухе, всеми нашими силами и всей мощью, которую может дать нам Бог; вести войну против чудовищной тирании, равной которой не было в мрачном и скорбном перечне человеческих преступлений. Такова наша политика. Вы спрашиваете, какова наша цель? Я могу ответить одним словом: победа. Победа любой ценой — победа вопреки всем ужасам — победа, каким бы долгим и тяжёлым ни был путь, ибо без победы нет выживания»."
 blood_toil_tears_sweat_speech:0 "Речь «Кровь, тяжёлый труд, слёзы и пот»"
 hold_this_was_their_finest_hour_speech:0 "Речь «Их звёздный час»"
 hold_this_was_their_finest_hour_speech_desc:0 "«Так исполним же свой долг и будем держаться так, чтобы, если Британская империя и её Содружество просуществуют тысячу лет, люди всё равно говорили: это был их звёздный час»."
 this_was_their_finest_hour_speech:0 "Речь «Это был их звёздный час»"
 mers_el_kebir_raid:1 "Операция «Катапульта»"
 mers_el_kebir_raid_desc:0 "[FRA.GetAdjective] флот оказался в руках Вишистской Франции, и мы не можем допустить его передачи [GER.GetAdjective] стороне. Как бы отвратительно это ни было, необходимо потребовать немедленной сдачи флота нашего бывшего союзника под угрозой обстрела."
 FRA_vichy_france:0 "Вишистская Франция"
 FRA_scuttle_the_fleet:0 "Затопление флота"
 FRA_scuttle_the_fleet_desc:0 "Иностранные силы пытаются насильно захватить наш флот. Мы не можем этого допустить и должны затопить корабли!"
 FRA_case_anton_mission:0 "Проводится операция «Антон»"
 case_anton:0 "Операция «Антон»"
 FRA_case_anton_mission_tt:0 "Аннексии удастся избежать."
 war_measures:0 "Меры военного времени"
 women_in_the_workforce:0 "Женский труд"
 women_in_the_workforce_desc:0 "Пока мужчины уходят на войну, тысячи женщин занимают рабочие места на заводах, поддерживая работу военной машины."
 scientist_refuge:0 "Иммиграция ученых"
 scientist_refuge_desc:0 "Из-за нынешней политической обстановки в Европе некоторые учёные решили покинуть родные страны и запросили въездную визу у нас. Предоставление убежища даст бонус к исследованиям, но вызовет недовольство тех, кто считает это внутренним делом, в которое нам не следует вмешиваться."
 give_refuge_ger:0 "Предоставить убежище [GER.GetAdjective] учёным"
 give_refuge_ita:0 "Предоставить убежище [ITA.GetAdjective] учёным"
 operations:0 "Операции"
 GER_military_buildup:0 "Подготовка к военным действиям"
 GER_weserubung_sud:0 "Везерюбунг-Зюд"
 GER_weserubung_sud_desc:0 "Чтобы получить удобный плацдарм для вторжения в Норвегию, сначала необходимо занять Данию."
 GER_weserubung_nord:0 "Везерюбунг-Норд"
 GER_weserubung_nord_desc:0 "Норвегия является критически важной стратегической точкой и очевидной целью для любого врага, желающего нарушить нашу торговлю сталью со Швецией. Мы не можем допустить создания в этом регионе вражеских баз."
 GER_case_yellow_netherlands:0 "План «Гельб» — Нидерланды"
 GER_case_yellow_netherlands_desc:0 "Наступление только через Бельгию вынудит нас действовать на слишком узком фронте. Следует включить Нидерланды в военный план, чтобы не повторить ошибки 1914 года."
 GER_case_yellow_belgium_luxembourg:0 "План «Гельб» — Бельгия и Люксембург"
 GER_case_yellow_belgium_luxembourg_desc:0 "Атака через линию Мажино равносильна самоубийству. Мы обойдём её с севера и пройдём через Арденны, минуя самые мощные укрепления."
 GER_polish_ultimatum:0 "Предъявить ультиматум Польше"
 SOV_industry_relocation:0 "Эвакуация промышленности"
 SOV_relocate_industry_from_moscow:0 "Эвакуация промышленности из Москвы"
 SOV_relocate_industry_from_moscow_desc:0 "Эвакуация тяжёлого оборудования московских заводов на Урал — огромная задача, но она необходима для сохранения военного производства."
