 reinstate_wilhelm_iv_succession_rights:0 "Право наследования для принца Вильгельма"
 reinstate_wilhelm_iv_succession_rights_desc:1 "Сын кайзера Вильгельма III был вынужден отказаться от прав наследования из-за желания жениться вопреки воле тогдашнего главы семьи Вильгельма II. Теперь, когда Вильгельм III сам занял это место, он может убедить изгнанного отца поддержать отмену прежнего решения."
 reinstate_wilhelm_iv_succession_rights_tt:0 "Линия наследования изменена.\n"
 modernize_the_succession_laws:0 "Модернизация законов престолонаследия"
 modernize_the_succession_laws_desc:0 "У сына нынешнего кайзера, Вильгельма IV, наследниками являются лишь две дочери. Чтобы обезопасить линию престолонаследия, необходимо модернизировать законы и позволить принцессе Фелицитас взойти на престол, когда придёт время."
 modernize_the_succession_laws_tt:0 "Женщины смогут наследовать престол.\n"
 request_restoration_of_british_titles:0 "Требование возвращения британских титулов"
 request_restoration_of_british_titles_desc:0 "В 1917 году британский парламент лишил германские королевские и княжеские семьи всех британских пэрств и королевских титулов. Теперь, когда мы союзники и поддерживаем превосходные отношения, возможно, настало время попросить отменить это решение."
 hindenburg_destroyed_tt:0 "«Гинденбург» §YНЕ§! уничтожен.\n"
 request_restoration_of_british_titles_tt:0 "Это, несомненно, приведёт к беспрецедентным наградам...\n"
 GER_request_polish_war_participation:0 "Потребовать участия [POL.GetAdjective] стороны в войне"
 GER_request_polish_war_participation_desc:0 "Поскольку мы воюем с [SOV.GetNameDef], нашим армиям необходимо пройти через [POL.GetAdjective] территорию. Мы поклялись защищать их, поэтому вполне естественно, что они присоединятся к нашей войне."
 GER_reform_austro_hungarian_empire:1 "Возрождение Австро-Венгерской империи"
 GER_reform_austro_hungarian_empire_tt:0 "Обратиться к другим государствам — наследникам Австро-Венгрии с предложением восстановить империю.\n§RЕсли они согласятся, вы унаследуете все войны, в которых они участвуют!§!\n"
 GER_reformed_austro_hungarian_empire:0 "Австро-Венгерская империя восстановлена"
 GER_barbarossa_mission:0 "21-я директива фюрера"
 emergency_factory_conversion_defensive:0 "Вынужденная конверсия фабрик"
 emergency_factory_conversion_defensive_desc:0 "Фронт отчаянно нуждается в большем количестве снаряжения. Необходимо срочно переоборудовать дополнительные заводы для производства оружия и техники, нужных для защиты страны."
 emergency_factory_conversion_offensive:0 "Вынужденная конверсия фабрик"
 emergency_factory_conversion_offensive_desc:0 "Нашим войскам срочно требуется больше снаряжения. Для производства всего необходимого для победы в войне нужны дополнительные заводы."
 demolish_enemy_fortifications:0 "Снести вражеские укрепления"
 dismantle_maginot:0 "Уничтожение линии Мажино"
 propaganda_efforts:0 "Пропаганда"
 war_propaganda:0 "Военная пропаганда"
 war_propaganda_desc:0 "Пока мир вокруг нас охвачен пламенем, наш народ совершенно не готов к войне. Мы должны заручиться его поддержкой и призвать взяться за оружие ради страны."
 desperate_defense:0 "Отчаянная оборона"
 desperate_defense_desc:0 "Отступать больше некуда. Наши солдаты должны окопаться и удержать рубеж."
 war_bonds:0 "Облигации военного займа"
 war_bonds_desc:0 "Военной экономике нужны дополнительные ресурсы, и военные облигации — подходящий способ их получить."
 CHI_lessons_of_war:0 "Уроки войны"
 CHI_industrial_evacuations_from_beijing:0 "Эвакуация промышленности из Пекина"
 GER_barbarossa_mission_desc:0 "«Германские вооружённые силы должны быть готовы сокрушить Советскую Россию в ходе стремительной кампании. Основная масса русской армии будет уничтожена смелыми операциями, возглавляемыми бронетанковыми клиньями»."
 USA_war_measures:0 "Меры военного времени"
 USA_homeland_defense:0 "Чрезвычайный акт о защите родины"
 USA_homeland_defense_desc:1 "Враг ступил на землю нашей гордой страны. [USA.GetAdjective] народ поднимется и сбросит захватчиков обратно в море!"
 USA_aid_britain:0 "Помочь [ENG.GetNameDef]"
 USA_establish_personal_communication_with_former_naval_person:0 "Контакт с бывшим морским офицером"
 USA_establish_personal_communication_with_former_naval_person_desc:0 "В [ENG.GetNameDef] новый лидер занял пост первого министра. Нам следует установить с ним личный диалог, чтобы подготовиться и координировать действия перед нашим неизбежным вступлением в войну."
 USA_battle_domestic_isolationism:0 "Борьба с изоляционизмом"
 USA_battle_domestic_isolationism_desc:0 "Будь воля изоляционистов, мы остались бы беззащитны перед любой враждебной державой. Ради собственного блага необходимо начать разрушать распространённую изоляционистскую риторику."
 USA_emergency_arms_deliveries:0 "Экстренные поставки вооружения"
 USA_emergency_arms_deliveries_desc:0 "[FRA.GetNameDefCap] пала, а [ENG.GetNameDef] в одиночку противостоит агрессору и с трудом защищает берега от вторжения. Пламенные речи показывают, что их решимость остаётся непоколебимой и они не намерены тихо уйти во тьму. Наш долг перед демократией — дать им средства для защиты свободы."
 USA_arsenal_of_democracy_decision:0 "Арсенал демократии"
 USA_arsenal_of_democracy_decision_desc:0 "Пока нас ещё не втягивают в конфликт, мы можем помочь друзьям, став их арсеналом. Нужно объяснить народу, почему это необходимо."
 USA_women_in_the_workforce:1 "Клепальщица Рози"
 USA_women_in_the_workforce_desc:0 "Умеете пользоваться электрическим миксером? Тогда сможете научиться работать дрелью. За годы войны более шести миллионов [USA.GetAdjective] женщин пришли на заводы, стройки и другие тяжёлые работы. Они навсегда доказали, что способны трудиться не хуже мужчин."
 CAN_women_in_the_workforce:0 "Ронни, девушка с пулеметом Bren"
 CAN_women_in_the_workforce_desc:0 "Ронни говорит: «Давайте ещё!» Пока мужчины служат в армии, бремя военного производства ложится на плечи женщин нашей страны. За годы войны 800 000 [CAN.GetAdjective] женщин заняли рабочие места ушедших на фронт и навсегда доказали, что способны трудиться не хуже мужчин."
