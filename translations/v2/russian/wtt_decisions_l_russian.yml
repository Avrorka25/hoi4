 SOV_hold_moscow:0 "Удержать Москву"
 SOV_seize_manchuria:0 "Захват Маньчжурии"
 SOV_seize_manchuria_desc:0 "В результате гражданской войны в Японии [MAN.GetNameDef] освободилась от японского правления. Если действовать быстро, у нас есть прекрасная возможность окончательно установить [SOV.GetAdjective] контроль над регионом."
 SOV_return_manchuria:0 "Возвращение Маньчжурии"
 SOV_return_manchuria_desc:0 "Мы вернём Маньчжурию единственному законному народному режиму Китая."
 fascism_on_the_rise:0 "Фашизм на подъеме"
 fascism_on_the_rise_desc:0 "Влиятельные политические силы начали открыто выступать в поддержку фашистских ценностей и получают всё больше народной поддержки. Путь страны к фашизму открыт — остаётся лишь выбрать мирный или насильственный переход."
 prepare_for_fascist_civil_war:0 "Подготовка к гражданской войне"
 prepare_for_fascist_civil_war_desc:1 "У нас нет времени ждать медленного изменения общественных взглядов. Ради самих людей необходимо ускорить события, даже если некоторые погибнут. В отличие от мирного референдума, гражданская война нанесёт огромный ущерб вооружённым силам, промышленности и инфраструктуре, но она завершится быстрее и позволит впоследствии решительнее навязать нашу волю."
 expand_civil_fascism_support:0 "Расширение гражданской поддержки"
 expand_civil_fascism_support_desc:1 "Необходимо обеспечить дальнейшее распространение поддержки нашего дела среди народа и призвать его публично бросить вызов власти нынешнего правительства. По мере ослабления позиций правительства и роста беспорядков достигать целей станет легче. Особенно если вместо законной смены власти эти цели предполагают более зловещий способ изменения режима."
 army_support_for_fascist_civil_war:0 "Расширение военной поддержки"
 army_support_for_fascist_civil_war_desc:0 "Без достаточной поддержки военных надежды на победу в вооружённой идеологической борьбе тщетны. Нужно обеспечить лояльность удачно расположенных подразделений наших вооружённых сил."
 army_support_TT:0 "Каждое усиление поддержки армии добавляет 10% к силе вашей стороны в гражданской войне, вплоть до максимальных 70%.\n"
 ensure_general_loyalty_for_fascist_civil_war:1 "Лояльность низшего офицерского состава"
 ensure_general_loyalty_for_fascist_civil_war_desc:0 "Некоторые генералы могут тайно симпатизировать фашизму. Следует обратиться к ним и заручиться их верностью к началу боёв."
 ensure_marshal_loyalty_for_fascist_civil_war:0 "Лояльность верховного командования"
 ensure_marshal_loyalty_for_fascist_civil_war_desc:0 "Некоторые фельдмаршалы могут тайно симпатизировать фашизму. Следует обратиться к ним и заручиться их верностью к началу боёв."
 siphon_equipment_stockpiles_for_fascist_civil_war:0 "Переброска снаряжения"
 siphon_equipment_stockpiles_for_fascist_civil_war_desc:0 "Незаметно изымая часть снаряжения с государственных складов, мы создадим небольшой запас оружия для будущей борьбы."
 formulate_surprise_attack_plan_for_fascist_civil_war:0 "Подготовка плана внезапного нападения"
 formulate_surprise_attack_plan_for_fascist_civil_war_desc:0 "Враг не подозревает о приближающейся катастрофе. Нужно сохранить это в тайне и составить боевые планы так, чтобы максимально использовать фактор внезапности."
 formulate_surprise_attack_plan_for_civil_war_tt:0 "«План внезапной атаки» дает 25-процентный бонус за атаку всем дивизиям на основной территории в течение 30 дней.\n"
 ignite_the_fascist_civil_war:0 "Разжигание гражданской войны"
 ignite_the_fascist_civil_war_desc:0 "Настало время решительного шага. Все необходимые приготовления завершены. Пути назад больше нет."
 rebuild_the_nation_fascism:0 "Восстановить страну"
 rebuild_the_nation_fascism_desc:0 "После гражданской войны настало время восстановить разрушенную страну."
 open_up_political_discourse_fascism:0 "Начало политических дебатов"
 open_up_political_discourse_fascism_desc:1 "Следует допустить в правительстве различные точки зрения. Возможно, со временем это позволит мирно изменить политический курс страны."
 discredit_government_fascism:0 "Дискредитация правительства"
 discredit_government_fascism_desc:0 "Указывая на многочисленные недостатки нынешнего правительства, мы заставим людей задуматься об идеологических причинах его неудач."
 hold_the_fascist_national_referendum:0 "Проведение всенародного референдума"
 hold_the_fascist_national_referendum_desc:0 "При достаточной поддержке мы можем безопасно провести референдум и сменить правительство без кровопролития."
 democratic_on_the_rise:0 "Демократия на подъеме"
