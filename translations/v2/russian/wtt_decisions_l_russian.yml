 byz_triumph_for_italy:0 "Торжество в Италии"
 byz_triumph_for_italy_desc:0 "Италия перешла под наш контроль, и мы должны торжественно вернуть её в состав империи!"
 byz_triumph_for_middle_east:0 "Торжество в Леванте"
 byz_triumph_for_middle_east_desc:0 "Левант перешёл под наш контроль, и мы должны торжественно вернуть его в состав империи!"
 byz_triumph_for_egypt_and_tunis:0 "Торжество в Египте и Тунисе"
 byz_triumph_for_egypt_and_tunis_desc:0 "Египет и Тунис перешли под наш контроль, и мы должны торжественно вернуть их в состав империи!"
 form_arabia:0 "Объединить Аравию"
 form_malayan_confederation:0 "Объединить малайские народы"
 form_rattanakosin_kingdom:0 "Укрепить наследие Раттанакосина"
 form_hre:0 "Возродить Священную Римскую империю"
 form_scandinavia_category:0 "Восстановить Кальмарскую унию"
 form_scandinavia_category_desc:0 "После завоевания всех скандинавских территорий настало время возродить дух Кальмарской унии. Вся Скандинавия будет процветать под нашей властью."
 form_nordic_league_category:0 "Объявить о создании Северной унии"
 form_nordic_league_category_desc:0 "Северные народы издавна ощущали особое родство. Теперь, когда мы контролируем все земли составляющих их государств, это единство можно вывести на новый уровень."
 form_gran_colombia_category:0 "Возродить наследие Боливара"
 form_gran_colombia_category_desc:0 "Хотя опыт Великой Колумбии столетие назад оказался недолгим, теперь мы вновь установили контроль над её составными территориями. Мы можем снова воплотить мечту Боливара."
 form_austria_hungary_category:0 "Восстановить Австро-Венгерскую империю"
 form_austria_hungary_category_desc:0 "Земли старой Австро-Венгрии завоёваны, и как единственный оставшийся наследник мы обязаны восстановить империю. Не будем медлить."
 form_commonwealth_category:0 "Реформировать Содружество"
 form_commonwealth_category_desc:0 "Польшу и Литву связывает богатая история. Теперь, когда оружие вновь объединило нас, возможно, пора возродить самые славные дни прошлого."
 form_united_netherlands_category:0 "Аннулировать Лондонский договор"
 form_united_netherlands_category_desc:0 "Лондонский договор 1839 года позорно разделил север и юг Нидерландов после слишком краткого периода единства. Под нашим руководством мы можем вернуть те времена и занять предназначенное место противовеса Франции и Германии."
 form_united_central_america_category:0 "Воссоздать Федеративную республику"
 form_united_central_america_category_desc:0 "Столетие назад наша страна входила в могущественное государство, просуществовавшее слишком недолго. Теперь, когда мы покорили сепаратистские земли, ставшие причиной его гибели, можно восстановить федеративную республику и начать проецировать силу объединённой Центральной Америки."
 form_baltic_federation_category:0 "Объединить балтийские государства"
 form_baltic_federation_category_desc:0 "Теперь, когда вся Прибалтика находится под нашим контролем, мы можем развить прежние заявления о региональной солидарности и единой внешней политике. Интеграция бывших соседей обеспечит всем большую безопасность перед угрозами с Запада и Востока."
 form_ottoman_empire_category:0 "Реформировать Османскую империю"
 form_ottoman_empire_category_desc:0 "Силой оружия мы сумели вернуть потери, понесённые из-за слабости в Великой войне. Лучшим способом отметить этот исторический момент станет провозглашение восстановления Османской империи."
 form_european_union_category:0 "Создать Европейский cоюз"
 form_european_union_category_desc:0 "Хотя идея политически единой Европы получила заметную поддержку лишь в последние десятилетия, недавнее завоевание сильнейших держав континента неожиданно превратило её в реальность. Возможно, для использования новых возможностей требуется перестройка правительства."
 form_mutapa_category:0 "Воссоздать империю Зимбабве"
 form_mutapa_category_desc:0 "Избавив юг континента от колониального влияния, мы можем объединить народ вокруг образа великой империи прошлого. В этом регионе существовало несколько таких держав, и нам нужно лишь выбрать имя, которое станет символом."
 form_roman_empire_category:0 "Воплотить в жизнь римские амбиции"
 form_roman_empire_category_desc:0 "Идея империи, охватывающей Средиземноморье, в последние годы вновь завладела умами народа. Наши военные кампании превзошли самые смелые мечты даже наиболее ревностных сторонников, и теперь мы стоим на пороге воплощения этих амбиций. Roma Invicta!"
 form_persian_empire_category:0 "Воссоздать Персидскую империю"
 form_persian_empire_category_desc:0 "Недавние завоевания достигли границ древней Персидской империи. Учитывая богатую историю региона, как можно упустить возможность объявить нашу державу продолжением империй прошлого?"
 form_byzantine_empire_category:0 "Восстановить Византию"
 form_byzantine_empire_category_desc:0 "Освободив древние земли от турецкого ярма, мы можем с помощью пропаганды объявить себя наследниками той самой империи, которую турки уничтожили пять веков назад. Такое наследие наверняка значительно повысит наш международный престиж!"
 byz_turkey_integrated:0 "Турция интегрирована в Византию"
 triumph_for_middle_east:0 "Ближний Восток интегрирован в Византию"
 triumph_for_italy:0 "Италия интегрирована в Византию"
 form_arabia_category:0 "Объединить Аравию"
 form_arabia_category_desc:0 "Слишком долго арабские государства были разделены региональным соперничеством. Теперь, когда полуостров объединён под нашей властью, мы наконец можем провозгласить создание единой Аравии!"
 form_malayan_confederation_category:0 "Панмалайская конфедерация"
 form_malayan_confederation_category_desc:0 "В обширном Малайском архипелаге возникали и исчезали великие империи, но на протяжении веков и тысячелетий народы далёких островов оставались разделёнными, главным образом колонизаторами. Для процветания и стабильности региона необходима единая страна всех малайцев. Вперёд, к новому золотому веку Малайи!"
 form_rattanakosin_kingdom_category:0 "Укрепить наследие Раттанакосина"
 form_rattanakosin_kingdom_category_desc:0 "В последние годы мы отошли от традиционных ценностей, на которых изначально была основана наша страна. Теперь, когда достигнуты границы времён былой славы, возможно, пора крепче обратиться к собственной истории."
 form_hre_category:0 "Возродить Священную Римскую империю"
 form_hre_category_desc:0 "Великолепие нашей кайзерин не знает границ, как и рубежи страны. Теперь они охватывают пределы старой Священной Римской империи, а государства на нашем пути больше не способны возражать против нашей политики. Кайзерин постановила воспользоваться нынешней возможностью и принять роль духовного наследника Священной Римской империи. Aquila Elegit Iovis Omnia Vincit!"
 form_greater_german_reich_category:0 "Провозгласить Великий Германский рейх"
 form_greater_german_reich_category_desc:0 "Наши враги повержены, а цели экспансии на Востоке достигнуты. Настало время показать миру величие страны и начать превращение столицы в город, которым смогут гордиться все."
 form_greater_german_reich:0 "Провозгласить Великий Германский рейх"
 form_greater_proletarian_state:0 "Провозгласить Большое Германское пролетарское государство"
 form_country_andalusia_coring_states_tt:0 "Получить национальные территории на всех §Yиспанских§! и §Yпортугальских§! регионах.\n"
 form_country_polynesia_coring_states_tt:0 "Получить национальные территории на всех §Yполинезийских островах§!.\n"
