 prestigious_projects:0 "Национальный престиж"
 barbarossa_mission_tt:0 "Применяет национальный дух §Y«Операция „Барбаросса“»§! до завершения задания.\n"
 war_propaganda_campaign_running:0 "Уже проводится кампания военной пропаганды"
 JAP_test_the_soviets:0 "Тестировать [SOV.GetAdjective]s"
 JAP_test_the_soviets_desc:0 "У нас длинная общая граница с [SOV.GetNameDef] в Корее и Маньчжурии. Существует множество потенциальных очагов, где наши силы могут столкнуться в любой момент. Это даёт возможность проверить советскую реакцию на небольшую провокацию."
 JAP_border_conflict_warning_SOV:0 "Пограничная провокация на [JAP.GetAdjective] границе"
 JAP_border_conflict_warning_SOV_desc:0 "На общей границе в Корее произошло столкновение наших пограничников с [JAP.GetAdjective] солдатами. Источники в [JAP.GetNameDef] сообщают, что это может быть первым шагом к более серьёзному противостоянию. Нужно немедленно укрепить границу с [JAP.GetNameDef]."
 JAP_border_conflict_escalation_warning_SOV:0 "[JAP.GetAdjective] приготовления"
 JAP_border_conflict_escalation_warning_SOV_desc:0 "Воздушная разведка подтвердила значительные перемещения войск в районе [JAP.GetAdjective] По ту сторону границы. Мы не знаем, когда или если [JAP.GetAdjective] Мы решили нанести удар, но мы должны быть готовы."
 JAP_border_incident_forgotten:0 "Благоприятная возможность"
 JAP_border_incident_forgotten_desc:1 "Чтобы использовать инцидент на [SOV.GetAdjective] границе с Кореей, необходимо действовать быстро."
 JAP_escalate_incident_to_border_conflict_SOV:0 "Развить инцидент"
 JAP_escalate_incident_to_border_conflict_SOV_desc:0 "Похоже, [SOV.GetAdjective] сторона не отступает. Теперь мы должны либо довести дело до вооружённого столкновения, либо отступить сами."
 JAP_border_conflict_time_until_cancelled:0 "Завершить конфликт"
 JAP_border_conflict_time_until_cancelled_desc:0 "При нынешнем темпе мы сможем поддерживать боевые действия лишь ограниченное время, после чего придётся прекратить бой."
 JAP_border_conflict_escalate_conflict:0 "Развить конфликт"
 JAP_border_conflict_escalate_conflict_desc:0 "Конфликт на границе с [SOV.GetNameDef] зашёл в тупик. Возможно, дальнейшая эскалация и переброска дополнительных сил всё ещё позволят добиться победы."
 JAP_border_conflict_escalate_to_war:0 "Объявить войну"
 JAP_border_conflict_escalate_to_war_desc:0 "Бои в спорном регионе продолжаются уже некоторое время и не собираются прекращаться. Нужно быть готовыми к следующему шагу и рассматривать этот конфликт как начало всеобщей войны."
 JAP_border_conflict_back_out_of_conflict:0 "Отступить"
 JAP_border_conflict_back_out_of_conflict_desc:0 "Слишком велика опасность, что конфликт выйдет из-под контроля и перерастёт в полномасштабную войну. Следует зафиксировать потери и направить другой стороне дипломатические сигналы."
 ROOT_inherit_current_scope_wars_effect:0 "[Root.GetNameDef] присоединяется ко всем войнам.\n"
