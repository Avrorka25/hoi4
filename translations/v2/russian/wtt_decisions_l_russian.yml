 communism_on_the_rise_desc:0 "Влиятельные политические силы начали открыто выступать в поддержку коммунистических ценностей и получают всё больше народной поддержки. Путь страны к коммунизму открыт — остаётся лишь выбрать мирный или насильственный переход."
 prepare_for_communist_civil_war:0 "Подготовка к гражданской войне"
 prepare_for_communist_civil_war_desc:1 "У нас нет времени ждать медленного изменения общественных взглядов. Ради самих людей необходимо ускорить события, даже если некоторые погибнут. В отличие от мирного референдума, гражданская война нанесёт огромный ущерб вооружённым силам, промышленности и инфраструктуре, но она завершится быстрее и позволит впоследствии решительнее навязать нашу волю."
 expand_civil_communist_support:0 "Расширение гражданской поддержки"
 expand_civil_communist_support_desc:1 "Необходимо обеспечить дальнейшее распространение поддержки нашего дела среди народа и призвать его публично бросить вызов власти нынешнего правительства. По мере ослабления позиций правительства и роста беспорядков достигать целей станет легче. Особенно если вместо законной смены власти эти цели предполагают более зловещий способ изменения режима."
 army_support_for_communist_civil_war:0 "Расширение военной поддержки"
 army_support_for_communist_civil_war_desc:0 "Без достаточной поддержки военных надежды на победу в идеологической борьбе тщетны. Нужно обеспечить лояльность удачно расположенных подразделений наших вооружённых сил."
 ensure_general_loyalty_for_communist_civil_war:1 "Лояльность низшего офицерского состава"
 ensure_general_loyalty_for_communist_civil_war_desc:0 "Некоторые генералы могут тайно симпатизировать демократии. Следует обратиться к ним и заручиться их верностью к началу боёв."
 ensure_marshal_loyalty_for_communist_civil_war:0 "Лояльность верховного командования"
 ensure_marshal_loyalty_for_communist_civil_war_desc:0 "Некоторые фельдмаршалы могут тайно симпатизировать фашизму. Следует обратиться к ним и заручиться их верностью к началу боёв."
 siphon_equipment_stockpiles_for_communist_civil_war:0 "Переброска снаряжения"
 siphon_equipment_stockpiles_for_communist_civil_war_desc:0 "Незаметно изымая часть снаряжения с государственных складов, мы создадим небольшой запас оружия для будущей борьбы."
 formulate_surprise_attack_plan_for_communist_civil_war:0 "Подготовка плана внезапного нападения"
 formulate_surprise_attack_plan_for_communist_civil_war_desc:0 "Враг не подозревает о приближающейся катастрофе. Нужно сохранить это в тайне и составить боевые планы так, чтобы максимально использовать фактор внезапности."
 ignite_the_communist_civil_war:0 "Разжигание гражданской войны"
 ignite_the_communist_civil_war_desc:0 "Настало время решительного шага. Все необходимые приготовления завершены. Пути назад больше нет."
 rebuild_the_nation_communism:0 "Восстановить страну"
 rebuild_the_nation_communism_desc:0 "После гражданской войны настало время восстановить разрушенную страну."
 open_up_political_discourse_communist:0 "Начало политических дебатов"
 open_up_political_discourse_communist_desc:0 "Следует допустить в правительстве различные точки зрения. Возможно, со временем это позволит мирно изменить политический курс страны."
 discredit_government_communism:0 "Дискредитация правительства"
 discredit_government_communism_desc:0 "Указывая на многочисленные недостатки нынешнего правительства, мы заставим людей задуматься об идеологических причинах его неудач."
 hold_the_communist_national_referendum:0 "Проведение всенародного референдума"
 hold_the_communist_national_referendum_desc:0 "При достаточной поддержке мы можем безопасно провести референдум и сменить правительство без кровопролития."
 military_support_for_fascist_civil_war:0 "Есть военная поддержка для гражданской войны.\n"
 military_support_for_democratic_civil_war:0 "Есть военная поддержка для гражданской войны.\n"
 military_support_for_communist_civil_war:0 "Есть военная поддержка для гражданской войны.\n"
 demand_tribute_from_new_communist_china:0 "Растущие требования"
 blow_suez_canal:0 "Подрыв Суэцкого канала"
 blow_suez_canal_desc:0 "Мы не можем позволить врагам использовать стратегически важный Суэцкий канал. Следует подготовить точечные разрушения, которые надолго выведут его из строя. Это значительно ограничит способность противника перебрасывать корабли из Азии и Восточной Африки в Средиземное море."
 blow_panama_canal:0 "Подрыв Панамского канала"
 blow_panama_canal_desc:0 "Мы не можем позволить врагам использовать стратегически важный Панамский канал. Следует подготовить точечные разрушения, которые надолго выведут его из строя. Это значительно затруднит переброску вражеских кораблей между Тихим и Атлантическим океанами."
 rebuild_suez_canal:0 "Ремонт Суэцкого канала"
 rebuild_suez_canal_desc:0 "Суэцкий канал имеет первостепенное значение для наших военных усилий. Нужно выделить все необходимые ресурсы на восстановление этого грандиозного сооружения, чтобы свободно перемещать корабли и войска между Средиземным морем и Индийским океаном."
 rebuild_panama_canal:0 "Ремонт Панамского канала"
 rebuild_panama_canal_desc:0 "Панамский канал имеет первостепенное значение для наших военных усилий. Нужно выделить все необходимые ресурсы на восстановление этого грандиозного сооружения, чтобы свободно перемещать корабли и войска между Тихим и Атлантическим океанами."
 border_war_with_from:0 "Пограничная война с [From.GetNameDef]"
 MAN_banditry_category:0 "Бандиты"
 MAN_banditry_category_desc:0 "Квантунская армия почти не заинтересована в помощи жителям Маньчжурии и рассматривает её скорее как оккупированную военную зону, чем как строящуюся страну. Правительство Маньчжоу-го получило от японцев слишком мало ресурсов для поддержания порядка. Возникший вакуум власти заполняют всевозможные бандиты: иногда самопровозглашённые «борцы за свободу», убивающие и грабящие во имя отвлечённых идей вроде «национального освобождения» или «пролетарского интернационализма», но чаще — обычные преступники без всякой идеологии, прикрывающей их злодеяния."
 MAN_bandit_raids:0 "Налеты бандитов"
 MAN_bandit_raids_desc:0 "Бродячие разбойники и террористы крадут всё, что не приколочено, а остальное сжигают! Соберите больше войск и остановите их!"
 PRC_border_clashes:0 "Пограничные стычки"
 PRC_border_clashes_desc:0 "Рельеф Китая заставляет всех тщательно выбирать места для сражений. Это позволяет нам захватывать уязвимые территории, не начиная полномасштабную войну."
 MAN_pacify_bandits_mission_explanation:0 "Для усмирения бандитов держите дивизии в регионе в течение [?Root.MAN_maintain_control_timer|H0] дней.\n"
 MAN_pacify_bandits_in_the_northern_countryside:0 "Ликвидация бандитов в северных землях"
 MAN_hunt_down_northern_bandits:0 "Охота на северных бандитов"
 MAN_hunt_down_northern_bandits_tt:0 "Устраняет северных бандитов.\n"
 MAN_maintain_northern_control:0 "Удержание контроля над севером"
 MAN_pacify_bandits_in_the_eastern_countryside:0 "Ликвидация бандитов в восточных землях"
 MAN_hunt_down_eastern_bandits:0 "Охота на восточных бандитов"
 MAN_hunt_down_eastern_bandits_tt:0 "Устраняет восточных бандитов.\n"
 MAN_maintain_eastern_control:0 "Удержание контроля над востоком"
 MAN_pacify_bandits_in_the_western_countryside:0 "Ликвидация бандитов в западных землях"
 MAN_hunt_down_western_bandits:0 "Охота на западных бандитов"
