l_russian:
 maintenance_company_tech:0 "Роты технического обслуживания"
 axis_minors_balance_event_tooltip:0 "Это событие даёт политическую власть в зависимости от текущего года, чтобы частично компенсировать политическую власть, не полученную в период, когда страны не существовало.\n"
 aftermath_of_the_munich_agreement:0 "Последствия распада Чехословакии"
 aftermath_of_the_munich_agreement_desc:0 "Распад Чехословакии привёл к множеству событий и политических возможностей, которые всего несколько лет назад казались почти немыслимыми."
 RUT_puppet_yourself_to_survive:0 "Искать компромисс с [GER.GetNameDef]"
 SLO_seek_support_from_german_slovaks:0 "Заручиться поддержкой словацких фольксдойче"
 volkdeutsch_support:0 "Есть поддержка §Yфольксдойче§!"
 RUT_provide_autonomy_to_ruthenia:0 "Предоставить автономию Карпатской Украине"
 RUT_award_ruthenia_to_hungary:0 "Передать Подкарпатскую Русь [HUN.GetNameDef]"
 axis_minors_ruthenia.1.t:0 "Подкарпатская Русь провозглашает себя автономным регионом"
 axis_minors_ruthenia.1.desc:0 "Из-за ослабления центрального правительства Чехословакии регион Подкарпатская Русь, населённый главным образом русинами (рутенами), украинской подгруппой, объявил себя автономным регионом. Теперь он получит все права, обещанные при обретении страной независимости, но ограниченные правительством Праги."
 axis_minors_ruthenia.1.a:0 "Это их право."
 axis_minors_ruthenia.1.b:0 "(Играть за Подкарпатскую Русь) Мы наконец вернули себе некоторую автономию."
 axis_minors_ruthenia.1.c:0 "Пусть уходят."
 axis_minors_ruthenia.1.d:0 "(Играть за независимую Карпатскую Украину) Пусть следуют своей судьбе."
 axis_minors_ruthenia.2.t:0 "Угроза [HUN.GetAdjective]"
 axis_minors_ruthenia.2.desc:0 "После уничтожения Чехословакии риск вторжения растёт с каждым днём. Возможно, мы сможем пережить стремительные перемены, сотрясающие регион, если предложим присоединиться к [HUN.GetNameDef], сохранив максимальную автономию."
 axis_minors_ruthenia.2.a:0 "Отправить посланников в [HUN.Capital.GetName]."
 axis_minors_ruthenia.2.b:0 "Пусть приходят."
 axis_minors_ruthenia.2.c:0 "(Отложить атаку) Сейчас они не готовы нападать."
 axis_minors_ruthenia.3.t:0 "[RUT.GetNameDefCap] ищет защиты"
 axis_minors_ruthenia.3.desc:0 "Сегодня прибыла делегация из так называемой «[RUT.GetName]» и предложила неожиданную сделку. Осознавая угрозу вторжения и наши притязания на их территорию, они готовы отказаться от своей новообретённой независимости в обмен на автономию в составе [HUN.GetNameDef]. Хотя согласие ограничит наше влияние на этот небольшой регион и лишь частично восстановит границы исторической Венгрии, вторжение на эту территорию может привести к вмешательству соперничающих держав."
 axis_minors_ruthenia.3.a:0 "Интегрировать их как автономный регион."
 axis_minors_ruthenia.3.b:0 "Подкарпатье — часть исторической Венгрии, вторгнуться туда."
 axis_minors_ruthenia.4.t:0 "Вмешаться в дела [RUT.GetNameDef]?"
 axis_minors_ruthenia.4.desc:0 "Самопровозглашённая [RUT.GetName] молода и изолирована. Как часть исторической Венгрии, она должна находиться под властью [HUN.GetAdjective] правительства. С распадом Чехословакии этот крошечный регион теперь готов вернуться к своим законным владельцам."
 axis_minors_ruthenia.4.a:0 "Ничего не делать."
 axis_minors_ruthenia.4.b:0 "Начать операцию по вторжению."
 axis_minors_ruthenia.5.t:0 "Свободное общество"
 axis_minors_ruthenia.5.desc:0 "Со сменой политического руководства основные свободы вновь гарантированы по всей стране. В результате возникают объединения, а демократические идеи распространяются."
 axis_minors_ruthenia.5.a:0 "Мы должны ценить возвращение свободы."
 axis_minors_ruthenia.6.t:0 "[RUT.GetNameDefCap] просит компромисса"
 axis_minors_ruthenia.6.desc:0 "После исчезновения Чехословакии горные [RUT.GetAdjective], живущие на самой окраине бывшей Чехословакии, потребовали сохранить определённый уровень автономии."
 axis_minors_ruthenia.6.a:0 "Предоставить им автономию."
 axis_minors_ruthenia.6.b:0 "Передать их под влияние [SLO.GetAdjective]."
 axis_minors_ruthenia.6.c:0 "Атаковать их."
 axis_minors_ruthenia.7.t:0 "[RUT.GetNameDefCap] просит об объединении"
 axis_minors_ruthenia.7.desc:0 "[RUT.GetLeader], лидер самой восточной территории бывшей Чехословакии, потребовал включить регион [RUT.GetNameDef] в состав Украины."
 axis_minors_ruthenia.7.a:0 "Мы объединим всех украинцев."
 axis_minors_ruthenia.7.b:0 "Это не для нас."
 axis_minors_croatia.1.t:0 "Воссоединение с [YUG.GetNameDef]"
 axis_minors_croatia.1.desc:0 "Теперь, когда [YUG.GetLeader] возглавляет наши правительства, пришло время объединиться с [YUG.GetNameDef]."
 axis_minors_croatia.1.a:0 "Да здравствует [YUG.GetNameDef]!"
 axis_minors_croatia.2.t:0 "Хорватские коммунисты хотят присоединиться к нам"
 axis_minors_croatia.2.desc:0 "Хорватские коммунисты хотят присоединиться к нашему славному союзу южных славян."
 axis_minors_croatia.2.a:0 "Добро пожаловать обратно!"
 axis_minors_croatia.3.t:0 "Заявить права на Великую Хорватию"
 axis_minors_croatia.3.desc:0 "Босния исторически была частью Хорватии. Чтобы пойти по стопам Томислава, мы должны восстановить наши исторические границы."
 axis_minors_croatia.3.a:0 "Это по праву и наша земля!"
 axis_minors_croatia.4.t:0 "Судьба мастерской «Электра» решена"
 axis_minors_croatia.4.desc:0 "В память о народном герое, инженере-электрике и коммунистическом активисте Раде Кончаре завод электронных компонентов «Электра» будет переименован в «Кончар Электроиндустрия»."
 axis_minors_croatia.4.a:0 "Он был истинным мучеником нашего дела!"
 axis_minors_croatia.5.t:0 "Конец коммунистической тирании"
 axis_minors_croatia.5.desc:0 "Красный террор окончен! Коммунисты отстранены от власти, а их антиутопическая экономическая система теперь демонтируется."
 axis_minors_croatia.5.a:0 "Правление большевизма окончено."
 axis_minors_croatia.6.t:0 "Конец фашистской тирании"
 axis_minors_croatia.6.desc:0 "Чёрный террор окончен! Фашисты отстранены от власти, а их антиутопический режим теперь демонтируется."
 axis_minors_croatia.6.a:0 "Эпоха ультранационализма и расизма окончена."
 axis_minors_croatia.7.t:0 "Конец парламентского режима!"
 axis_minors_croatia.7.desc:0 "Из-за захвата общества радикальными элементами политический плюрализм остался в прошлом: революционеры формируют правительство и устанавливают свою диктатуру."
 axis_minors_croatia.7.a:0 "Нас ждут тёмные времена."
 axis_minors_croatia.8.t:0 "Коммунисты возвращаются к власти!"
 axis_minors_croatia.8.desc:0 "Революционное коммунистическое правительство вернулось к власти и быстро восстановило прежние политические реформы."
 axis_minors_croatia.8.a:0 "Коммунизм — это будущее!"
 axis_minors_croatia.9.t:0 "Фашизм вновь контролирует страну!"
 axis_minors_croatia.9.desc:0 "Ультранационалисты снова захватили власть в стране. Коллаборационистов уже разыскивают, а милитаристская пропаганда вновь пытается привлечь массы в их движение."
 axis_minors_croatia.9.a:0 "Мы — настоящие хорваты!"
 axis_minors_croatia.10.t:0 "Демократические силы одержали верх!"
 axis_minors_croatia.10.desc:0 "После борьбы эпического масштаба и жестоких репрессий сторонники свободы и демократии сформировали новое правительство."
 axis_minors_croatia.10.a:0 "Мы будем сражаться за нашу свободу!"
 axis_minors_croatia.11.t:0 "Наследие прошлого"
 axis_minors_croatia.11.desc:0 "Хотя наша нация вступает в новую эпоху, наши нынешние знания основаны на том, чему мы научились в прошлом."
 axis_minors_croatia.11.a:0 "Вперёд, к светлому будущему!"
 axis_minors_slovakia.1.t:0 "Наша граница со Словакией неудовлетворительна"
 axis_minors_slovakia.1.desc:0 "Мы взяли под контроль Кошице и включили Подкарпатскую Русь в наш состав, но даже после этих завоеваний присоединение Подкарпатской Руси остаётся незавершённым. Многие деревни, населённые русинами, которые по праву являются венгерскими подданными, всё ещё находятся под контролем Словакии. Поскольку граница со Словакией установлена совсем недавно, следует сейчас же изменить её в нашу пользу, пока она не стала постоянной и признанной."
 axis_minors_slovakia.1.a:0 "Провести ограниченное наступление, чтобы занять спорный регион."
 axis_minors_slovakia.1.b:0 "Только дипломатия вернёт нам законные земли."
 axis_minors_slovakia.2.t:0 "Мы проиграли Малую войну"
 axis_minors_slovakia.2.desc:0 "Несмотря на мужество наших войск, мы не смогли остановить наступление сил [HUN.GetAdjective]. [GER.GetNameDefCap] вынудила наши страны заключить перемирие и разрешила спор в пользу [HUN.GetNameDef]. В результате мы были вынуждены уступить им 78 муниципалитетов на территории площадью 1 697 км² с населением 69 930 человек."
 axis_minors_slovakia.2.a:0 "[GER.GetNameDefCap] обещала нам помочь!"
 axis_minors_slovakia.3.t:0 "Триумф в Карпатии!"
 axis_minors_slovakia.3.desc:0 "После наших успешных операций в восточной части Словакии [GER.GetNameDef] установила перемирие и изменила границу в нашу пользу! Теперь мы контролируем всю Карпатию и даже освободили несколько венгерских деревень. Солдаты поют, празднуя этот славный шаг на пути к восстановлению Надь-Мадьярорсага — Великой Венгрии."
 axis_minors_slovakia.3.a:0 "«Мы все солдаты [HUN.GetLeader]»."
 axis_minors_slovakia.4.t:0 "Наши войска потерпели неудачу против [SLO.GetNameDef]"
 axis_minors_slovakia.4.desc:0 "Похоже, мы недооценили армию [SLO.GetAdjective]. Они решительно ответили на наше наступление, продолжавшееся всю неделю. Хотя мы добились определённых успехов, [GER.GetNameDef] решила вмешаться и навязала перемирие, выгодное [SLO.GetNameDef]."
 axis_minors_slovakia.4.a:0 "Это лишь небольшая неудача."
 axis_minors_slovakia.5.t:0 "Мы отбросили подлых мадьяр"
 axis_minors_slovakia.5.desc:0 "После целой недели героического сопротивления наши силы отбросили вооружённые силы [HUN.GetAdjective], вероломно напавшие на нас. Вмешательство нашего защитника, [GER.GetLeader], положило конец конфликту, признало нашу победу и вынесло решение в нашу пользу."
 axis_minors_slovakia.5.a:0 "Мы хотим лишь того, что принадлежит нам по праву."
 axis_minors_slovakia.6.t:0 "[HUN.GetNameDefCap] атакует нас!"
 axis_minors_slovakia.6.desc:0 "После завоевания Подкарпатья [HUN.GetNameDef] заявила, что граница была проведена неправильно. Они начали против нас ограниченное наступление, чтобы силой добиться удовлетворения этих небольших претензий. Мы призвали [GER.GetNameDef] помочь нам, но сейчас они не готовы вмешиваться, поскольку, похоже, не хотят рисковать отношениями с [HUN.GetNameDef]."
 axis_minors_slovakia.6.a:0 "Мы должны защитить родину."
 axis_minors_slovakia.7.t:0 "[GER.GetNameDefCap] требует прекращения боевых действий"
 axis_minors_slovakia.7.desc:0 "Война продолжается уже неделю, и [GER.GetAdjective] теряет терпение из-за конфликта между [HUN.GetAdjective] и [SLO.GetAdjective]. [GER.GetNameDefCap] сначала не хотела раздражать [HUN.GetNameDef] и не вмешивалась в войну. Однако теперь, когда военные действия выявили победителя, пришло время положить конец этому конфликту между союзниками и решить, нужно ли вновь исправить карту Европы."
 axis_minors_slovakia.7.a:0 "Они наверняка поддержат нас."
 axis_minors_slovakia.8.t:0 "Наше завоевание Карпатии не завершено"
 axis_minors_slovakia.8.desc:0 "Хотя завоевание Карпатии стало огромным достижением, оно всё же остаётся незавершённым. По другую сторону границы, в самой восточной части Словакии, живут [RUT.GetAdjective], которые заслуживают присоединиться к нашей стране, даже если они не являются этническими словаками."
 axis_minors_slovakia.8.a:0 "Нужно заручиться поддержкой [GER.GetAdjective]."
 axis_minors_slovakia.9.t:0 "Вмешательство [SLO.GetAdjective] в Кошице"
 axis_minors_slovakia.9.desc:0 "После объявления о создании чешского государства-обрубка в южной части Чехословакии словацкое население взялось за оружие. Благодаря вмешательству словацкой армии территория теперь надёжно находится в руках Словакии."
 axis_minors_slovakia.9.a:0 "Мы претендуем лишь на то, что принадлежит нам по праву."
 axis_minors_slovakia.10.t:0 "Наследие прошлого"
 axis_minors_slovakia.10.desc:0 "Хотя наша нация вступает в новую эпоху, наши нынешние знания основаны на том, чему мы научились в прошлом."
 axis_minors_slovakia.10.a:0 "Вперёд, к светлому будущему!"
 axis_minors_vichy_france.2.t:0 "Феликс Эбуэ присоединяется к силам Свободной Франции"
 axis_minors_vichy_france.2.desc:0 "Феликс Эбуэ, губернатор Французской Экваториальной Африки, объявил, что продолжит борьбу против [GER.GetNameDef], уведя за собой Французскую Экваториальную Африку. Теперь эта территория станет базой для подготовки освобождения Франции."
 axis_minors_vichy_france.2.a:0 "Свободная Франция продолжит борьбу на суше, в воздухе и на море."
 axis_minors_vichy_france.3.t:0 "Единая законная Франция"
 axis_minors_vichy_france.3.desc:0 "После поражения маршалистов наше правительство смогло распространить свою власть на Францию и империю. Хотя некоторые коллаборационисты всё ещё находятся где-то в изгнании, репрессии против сторонников Петена со стороны «Французских внутренних сил» (FFI) привели к массовым арестам и казням. Кроме того, женщинам, вступавшим в связь с врагом, часто сбривали волосы, чтобы на месяцы заклеймить их позором."
 axis_minors_vichy_france.3.a:0 "Да здравствует Франция!"
 axis_minors_vichy_france.4.t:0 "Генерал Жюэн присоединяется к силам Свободной Франции"
 axis_minors_vichy_france.4.desc:0 "Генерал Альфонс Жюэн, служивший в армии перемирия Виши, решил продолжить борьбу против тирании фашизма."
 axis_minors_vichy_france.4.a:0 "Франция должна быть освобождена!"
 axis_minors_vichy_france.5.t:0 "Генерал Жюэн присоединяется к силам Свободной Франции"
 axis_minors_vichy_france.5.desc:0 "Генерал Альфонс Жюэн предал нас и присоединился к так называемым «Силам Свободной Франции». Теперь он наш враг, как и все те предатели, которые стремятся уничтожить национальную революцию и лишить Францию её места в новом европейском порядке, служа интересам [Root.GetFactionName]."
 axis_minors_vichy_france.5.a:0 "Предатели будут казнены!"
 axis_minors_vichy_france.6.t:0 "Генерал де Латтр де Тассиньи раскритиковал коллаборационизм"
 axis_minors_vichy_france.6.desc:0 "Один из наших самых известных офицеров, талантливый генерал Жан де Латтр де Тассиньи, раскритиковал нашу политику сотрудничества с [GER.GetNameDef]. Это серьёзная угроза, поскольку он может попытаться присоединиться к так называемым Силам Свободной Франции генерала де Голля или посеять смуту в остатках наших вооружённых сил."
 axis_minors_vichy_france.6.a:0 "Арестовать его!"
 axis_minors_vichy_france.6.b:0 "Оставить его на свободе."
 axis_minors_vichy_france.7.t:0 "Де Латтр де Тассиньи попытался сбежать из тюрьмы"
 axis_minors_vichy_france.7.desc:0 "Генерал де Латтр де Тассиньи, заключённый в тюрьму после критики наших отношений с [GER.GetNameDef], прошлой ночью попытался бежать."
 axis_minors_vichy_france.7.a:0 "Его необходимо поймать!"
 axis_minors_vichy_france.8.t:0 "Де Латтр сбежал!"
 axis_minors_vichy_france.8.desc:0 "Генерал де Латтр де Тассиньи ночью сбежал на автомобиле. Теперь мы получили подтверждение, что он присоединился к Силам Свободной Франции."
 axis_minors_vichy_france.8.a:0 "Ах, предатель!"
 axis_minors_vichy_france.9.t:0 "Генерал де Латтр де Тассиньи присоединяется к нам!"
 axis_minors_vichy_france.9.desc:0 "После успешного побега генерал де Латтр де Тассиньи благополучно присоединился к Силам Свободной Франции. Теперь он готов сражаться за освобождение Франции."
 axis_minors_vichy_france.9.a:0 "Ещё один шаг к освобождению Франции."
 axis_minors_vichy_france.10.t:0 "Генерал де Латтр де Тассиньи погиб при попытке побега из тюрьмы"
 axis_minors_vichy_france.10.desc:0 "Пока террористическая группа, поддерживаемая антифранцузскими иудео-[ENG.GetAdjective] силами, пыталась организовать сложный побег, мужество французской полиции позволило сорвать заговор. К сожалению, генерал де Латтр де Тассиньи погиб в ходе операции."
 axis_minors_vichy_france.10.a:0 "Всё равно он был предателем."
 axis_minors_vichy_france.11.t:0 "Генерал де Латтр де Тассиньи погиб при попытке побега из тюрьмы"
 axis_minors_vichy_france.11.desc:0 "Пока террористическая группа, поддерживаемая антифранцузскими иудео-британскими силами, пыталась организовать сложный побег, мужество французской полиции позволило сорвать заговор. К сожалению, генерал де Латтр де Тассиньи погиб в ходе операции."
 axis_minors_vichy_france.11.a:0 "Мученик освобождения."
 axis_minors_vichy_france.12.t:0 "Талантливый офицер повышен"
 axis_minors_vichy_france.12.desc:0 "Пока война продолжается, новые таланты получают возможность проявить свои командирские способности на поле боя. Один из таких талантливых офицеров недавно был произведён в генералы. Представители старшего поколения отвергают его смелые идеи, но он, похоже, понимает, что современное оружие при правильном применении позволяет избежать огромных потерь Великой войны."
 axis_minors_vichy_france.12.a:0 "«Да здравствует класс!»"
 axis_minors_vichy_france.13.t:0 "Талантливый офицер повышен"
 axis_minors_vichy_france.14.t:0 "Талантливый офицер повышен"
 axis_minors_vichy_france.17.t:0 "Подтверждение французской оккупационной зоны"
 axis_minors_vichy_france.17.desc:0 "Согласно статье II конвенции о перемирии между Французским государством и [GER.GetNameDef]: «Для защиты интересов [GER.GetNameDef] территория Французского государства к северу и западу от линии, проведённой на прилагаемой карте, будет оккупирована войсками [GER.GetAdjective]. В тех районах, которые подлежат оккупации, но ещё не находятся под контролем войск [GER.GetAdjective], оккупация будет осуществлена немедленно после заключения настоящего договора».\n\nСледовательно, любая территория, незаконно находящаяся под контролем французского правительства, должна быть передана под контроль Милитэрбефельсхабера ин Франкрайх."
 axis_minors_vichy_france.17.a:0 "Перемирие должно соблюдаться."
 axis_minors_vichy_france.18.t:0 "Сокрытие военного имущества"
 axis_minors_vichy_france.18.desc:0 "После перемирия некоторые военные начали готовить тайники, чтобы сохранить часть содержимого армейских арсеналов и иметь доступ к вооружению в будущем."
 axis_minors_vichy_france.18.a:0 "Подготовить тайники."
 axis_minors_vichy_france.18.b:0 "Перемирие должно соблюдаться."
 axis_minors_vichy_france.20.t:0 "[GER.GetNameDefCap] готовится вторгнуться в Свободную зону!"
 axis_minors_vichy_france.20.desc:0 "После потери нашей колониальной империи присутствие противника в Средиземном море вызвало в верховном командовании [GER.GetAdjective] опасения, что Союзники высадятся на юге Франции. Теперь они готовятся вторгнуться на нашу территорию, пока мы беззащитны, а большинство правительства желает продолжить сотрудничество."
 axis_minors_vichy_france.20.a:0 "Запретить офицерам оказывать вооружённое сопротивление — они здесь, чтобы защитить нас."
 axis_minors_vichy_france.20.b:0 "Это предательство — мы должны сопротивляться! К оружию!"
 axis_minors_vichy_france.20.c:0 "Улететь в Африку и присоединиться к де Голлю."
 axis_minors_vichy_france.20.d:0 "Убедить [GER.GetLeader] продолжить сотрудничество."
 axis_minors_vichy_france.21.t:0 "Танцевальные конкурсы зазу нарушают общественный порядок!"
 axis_minors_vichy_france.21.desc:0 "В последнее время группы зазу создают всё больше проблем. На первый взгляд это всего лишь странно одетые молодые люди, но на деле они представляют собой дестабилизирующую силу. Нося длинную одежду в условиях дефицита ткани, подражая любви [USA.GetAdjective] к костюмам-зут или пришивая к курткам жёлтую звезду с надписью «Свинг» или «Гой», они открыто бросают вызов властям. Недавно эти любители джаза организовали танцевальные конкурсы, которые привлекли ещё больше молодёжи на путь разврата."
 axis_minors_vichy_france.21.a:0 "Эти люди развращены физически и морально."
 axis_minors_vichy_france.22.t:0 "Новая надежда для Африки"
 axis_minors_vichy_france.22.desc:0 "После подписания перемирия большая часть Франции оказалась оккупирована или стала «нейтральной». Однако небольшая группа офицеров объединилась вокруг генерала де Голля, чтобы продолжить борьбу. Первый успех пришёл к ним, когда Феликс Эбуэ, колониальный губернатор Французской Экваториальной Африки, заявил о своей поддержке. Было создано правительство Свободной Франции — «Комитет обороны Империи», решивший продолжать борьбу с нацизмом и освободить Францию от иностранной оккупации."
 axis_minors_vichy_france.22.a:0 "Мы должны продолжать борьбу — Франция должна быть освобождена!"
