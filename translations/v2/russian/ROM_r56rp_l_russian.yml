l_russian:
 ROM_r56rp_integrate_romanians_in_ukraine:0 "Интеграция румын в Украину"
 ROM_r56rp_design_and_equipment_license:0 "Лицензия Axis Design and Equiment"
 ROM_purchase_axis_designs_and_equipment:0 "Покупка лицензий Axis Designs and снаряжение"
 ROM_purchase_axis_designs_and_equipment_desc:0 "Хотя мы изолировали себя от большей части Запада, когда дело доходит до исследований в области материального обеспечения, мы все еще можем полагаться на немцев и итальянцев. Приобретая у них официальные лицензии, мы сможем обеспечить наши вооруженные силы современной техникой, пока мы еще догоняем остальной мир."
 ROM_joint_oil_exploitation:0 "Совместная нефтяная эксплуатация"
 ROM_joint_oil_exploitation_desc:0 "Вместе с итальянцами и немцами мы сможем еще больше расширить наши промышленные возможности, когда речь идет о наших богатых нефтяных месторождениях."
 ROM_r56rp_oppose_tatarescus_regime:0 "Против режима Татареску"
 ROM_r56rp_oppose_tatarescus_regime_desc:0 "Для нас ясно, что Татареску и его режим станут концом Великой Румынии. Его политика откровенно поддерживает монархию, в то время как низший класс страдает от нищеты и лишений."
 ROM_r56rp_gather_the_dissenters:0 "Соберите несогласных"
 ROM_r56rp_gather_the_dissenters_desc:0 "Несмотря на наши различия, мы должны объединиться в единый блок и противостоять Татареску и монархии, независимо от того, являемся ли мы Железной гвардией или Революционером, у нас есть общая цель."
 ROM_r56rp_criticise_the_regime:0 "Критика режима"
 ROM_r56rp_criticise_the_regime_desc:0 "Делая публичные заявления о неодобрении нынешнего режима, мы сможем больше сплотиться в нашем деле и уйти от Монархии и его Пет Татареску."
 ROM_r56rp_radicalize_the_opposition:0 "Радикализовать оппозицию"
 ROM_r56rp_radicalize_the_opposition_desc:0 "По мере того, как мы становимся сильнее и наши голоса становятся громче, становится ясно, что нынешний режим не увидит смысла, и вместо этого нам придется принимать более радикальные меры."
 ROM_r56rp_denounce_tatarescus_ideals:0 "Откажитесь от идеалов Татареску"
 ROM_r56rp_denounce_tatarescus_ideals_desc:0 "«Идеальная» Румыния Татареску, к сожалению, не предназначена для простого народа, их вопиющий фаворитизм высшего класса - это то, что станет концом нашей нации."
 ROM_r56rp_smear_campaign_against_the_crown:0 "Клеветническая кампания против короны"
 ROM_r56rp_smear_campaign_against_the_crown_desc:0 "Запустив несколько клеветнических кампаний, направленных на то, чтобы королевская семья, мы можем показать, что мы, народ Румынии, больше не хотим их здесь видеть. Они больше не приветствуются."
