 AST_R56_incom_tax_assessment_act_idea:0 "Закон об оценке подоходного налога"
 AST_R56_incom_tax_assessment_act_idea_desc:0 "Действующие налоговые законы в последний раз пересматривались в 1915 году, во время Великой войны. Поскольку страна находится во власти депрессии, разумно вновь изучить их и внести необходимые изменения."
