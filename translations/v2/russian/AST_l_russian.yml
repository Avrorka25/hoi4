 AST_R56_naval_auxiliary_patrol_desc:0 "По всей Австралии существуют добровольческие подразделения военно-морского резерва, которые ещё не мобилизованы. Поручив им патрулирование рек, портов и других прибрежных районов, мы значительно укрепим защиту ключевых объектов страны."
