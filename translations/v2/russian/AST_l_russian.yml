 AST_R56_memories_of_gallipoli:0 "Память о Галлиполи"
 AST_R56_memories_of_gallipoli_desc:0 "§RВы не сможете повысить закон о призыве, пока не будут выполнены соответствующие фокусы. Подробнее смотрите в законе о призыве.§!\n\n[AST.GetAdjective] народ не забыл, как австралийская кровь проливалась на полях сражений Великой войны. Поэтому идея призывать [AST.GetAdjective] граждан на войну за рубежом в случае нового конфликта встречает серьёзное сопротивление."
