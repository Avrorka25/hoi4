 australian_focus:0 "Национальные фокусы Австралии"
 r56_australia.country_win:0 "Аграрная партия возглавляет коалицию."
 r56_australia.communist_win:0 "Коммунистическая партия Австралии побеждает."
 r56_australia.fascists_win:0 "Победа правых!"
 r56_australia.centre_win:0 "Центристская партия одерживает сокрушительную победу."
 r56_australia.australia_first_win:0 "«Австралия прежде всего» побеждает на выборах."
 r56_australia.1.t:0 "Назначение нового генерал-губернатора"
 r56_australia.1.d:0 "Срок полномочий Айзека Айзекса на посту генерал-губернатора завершён. Его запомнят как первого австралийца на этой должности и как человека исключительной бережливости.\n\nИз предложенных кандидатов премьер-министр решил вновь выбрать британского генерал-губернатора и выдвинул Александра Хор-Рутвена.\n\nРанее он занимал пост губернатора Нового Южного Уэльса, а до этого — Южной Австралии, где использовал своё влияние, чтобы помочь штату в начале Великой депрессии."
 r56_australia.1.a:0 "Лорд Гоури станет хорошим генерал-губернатором."
 r56_australia.2.d:0 "Срок Александра Хор-Рутвена на посту генерал-губернатора завершён. В знак признания его службы король даровал ему титул графа Гоури и назначил заместителем констебля и лейтенант-губернатором Виндзорского замка. Его влияние за последние девять лет наверняка будут помнить.\n\nИз представленных кандидатов на замену был выбран принц Генри, герцог Глостерский, третий сын короля Георга V."
 r56_australia.2.a:0 "Его Королевское Высочество герцог Глостерский станет хорошим генерал-губернатором."
 r56_australia.4.t:0 "Смерть Джозефа Лайонса"
 r56_australia.4.uap:0 "Премьер-министр Джозеф Лайонс перенёс сердечный приступ по дороге из Мельбурна в Сидней, когда ехал забрать сына из колледжа. Поскольку он стал первым премьер-министром, умершим при исполнении обязанностей, конституционного прецедента для назначения преемника нет. Отсутствие заместителя лидера ОАП усложнило ситуацию, и выбор нового главы партии займёт некоторое время. Лидер Аграрной партии и заместитель премьер-министра Эрл Пейдж назначен временным премьер-министром до голосования ОАП по новому руководителю.\n\nВ 59 лет Лайонс задумывался об уходе и хотел проводить больше времени с маленькими детьми. Однако отсутствие преемника заставило партию настаивать, чтобы он остался. Его будут помнить как человека, сохранившего единство страны в годы Великой депрессии."
 r56_australia.4.labor:0 "Бывший премьер-министр Джозеф Лайонс перенёс сердечный приступ, когда забирал сына из колледжа. После поражения на выборах 1937 года он, по сообщениям, наслаждался отставкой, много времени проводил с маленькими детьми и ремонтировал дом в Девонпорте.\n\nЛайонса будут помнить как человека, сохранившего единство страны в годы Великой депрессии."
 r56_australia.4.a:0 "Он достойно служил своей стране."
 r56_australia.5.t:0 "Роберт Мензис избран премьер-министром"
 r56_australia.5.d:0 "ОАП избрала бывшего заместителя лидера Роберта Мензиса новым главой партии, и он принёс присягу как премьер-министр Австралии. В поступке, потрясшем парламент, временный премьер-министр Эрл Пейдж отказался служить под началом Мензиса и выступил в Палате представителей с необычайно резкой атакой, обвинив его в некомпетентности и трусости за то, что тот не записался добровольцем во время Великой войны. Аграрная партия быстро отреагировала и сместила Пейджа с поста лидера.\n\nКак ни посмотри, начало премьерства вышло отвратительным."
 r56_australia.5.a:0 "Будем надеяться, что он объединит страну."
 r56_australia.7.t:0 "Смерть Джона Кэртина"
 r56_australia.7.uap:0 "Сегодня в возрасте 60 лет умер лидер Лейбористской партии Джон Кэртин. В последние месяцы его здоровье ухудшалось, а годом ранее он перенёс сердечный приступ. Многолетний глава лейбористов годами боролся с ОАП, а его социалистическая политика часто вызывала раскол. Его запомнят как великого лидера и человека, который делал всё возможное ради Австралии и её народа."
 r56_australia.7.labor:0 "Сегодня в возрасте 60 лет умер премьер-министр Джон Кэртин. В последние месяцы его здоровье ухудшалось, а годом ранее он перенёс сердечный приступ. Многолетний глава Лейбористской партии пользовался популярностью и объединил страну, добившись серьёзного снижения безработицы и вывода Австралии из Великой депрессии.\n\nЕго, несомненно, запомнят как великого лидера."
 r56_australia.7.a:0 "Он достойно служил своей стране."
 r56_australia.8.t:0 "Федеральные выборы 1937 года"
 r56_australia.8.d:0 "Настало время выборов. Правящая коалиция ОАП и Аграрной партии вновь противостоит лейбористам в борьбе за все 74 места в Палате представителей и 19 мест в Сенате. На выборах 1931 года лейбористы потерпели сокрушительное поражение от ОАП. Перед выборами 1934 года ОАП и Аграрная партия восстановили коалицию, тогда как внутренние проблемы привели к расколу лейбористов. Теперь же под руководством Джона Кэртина партия намерена вернуть утраченные позиции. Но сможет ли она завоевать поддержку масс?"
 r56_australia.8.a:0 "Коалиция ОАП и Аграрной партии сохраняет большинство."
 r56_australia.8.b:0 "Лейбористская партия получает большинство."
 r56_australia.9.t:0 "Федеральные выборы 1940 года"
 r56_australia.9.d:0 "Настало время выборов. Коалиция ОАП и Аграрной партии вновь борется с лейбористами за все 74 места в Палате представителей и 19 мест в Сенате. После смерти Джозефа Лайонса ОАП возглавил Роберт Мензис. Новый лидер не сумел добиться популярности предшественника. Тем временем число сторонников Джона Кэртина растёт. Кто получит большинство на этот раз?"
 r56_australia.9.a:0 "Коалиция ОАП и Аграрной партии всё ещё пользуется народной поддержкой."
 r56_australia.9.b:0 "Лейбористы получают контроль над Палатой представителей."
 r56_australia.10.t:0 "Федеральные выборы 1943 года"
 r56_australia.10.d:0 "Австралийцы хотят перемен. На выборах 1943 года позиции лейбористов выглядят сильными. Раскалывающие коалицию Аграрной партии и ОАП разногласия оставили у австралийцев горький осадок, и именно сильное лейбористское правительство кажется народу тем, что нужно. Но кто окажется впереди после подсчёта голосов?"
 r56_australia.10.a:0 "Коалиция ОАП и Аграрной партии побеждает."
 r56_australia.10.b:0 "Лейбористы получают больше всего голосов."
 r56_australia.10.c:0 "Коалиция Аграрной партии и ОАП побеждает."
 r56_australia.11.t:0 "Федеральные выборы 1946 года"
 r56_australia.11.d:0 "После смерти Джона Кэртина Бену Чифли предстоит сохранить набранный лейбористами темп. Тем временем Роберт Мензис возглавляет переименованную ОАП, теперь известную как Либеральная партия. Сможет ли коалиция либералов и Аграрной партии победить? Или популярность лейбористов сохранится?"
 r56_australia.11.a:0 "Коалиция Либеральной и Аграрной партий побеждает."
 r56_australia.11.b:0 "Лейбористы побеждают."
 r56_australia.12.t:0 "Федеральные выборы 1949 года"
 r56_australia.12.d:0 "В этом году разыгрывается 121 место в Палате представителей и 42 из 60 мест в Сенате. Изменит ли увеличение числа мандатов исход голосования?"
 r56_australia.12.a:0 "Коалиция Либеральной и Аграрной партий побеждает."
 r56_australia.12.b:0 "Лейбористы побеждают."
 r56_australia.13.t:0 "Роберт Мензис уходит в отставку"
 r56_australia.13.d:0 "Под растущим давлением оппозиции и в условиях парламентского тупика премьер-министр Мензис объявил о намерении уйти. В последней попытке удержать его у власти кабинет ОАП призвал сформировать правительство национального единства с лейбористами, но те отказались. Потеряв поддержку парламента, он подал в отставку.\n\nНесмотря на совет Мензиса генерал-губернатору назначить премьер-министром Джона Кэртина, совместная конференция ОАП и Аграрной партии выбрала нового лидера коалиции и премьер-министра — главу Аграрной партии Артура Фаддена. Озлобленный и подавленный Роберт Мензис едва не покинул политику, но его убедили стать министром координации обороны в новом кабинете Фаддена."
 r56_australia.13.a:0 "Будем надеяться, что Фадден сумеет сохранить единство [AST.GetNameDef]."
 r56_australia.14.t:0 "Вотум недоверия"
 r56_australia.14.d:0 "Всего через 40 дней после вступления в должность премьер-министр Артур Фадден потерпел поражение при голосовании о недоверии, инициированном лейбористской оппозицией. Не сумев заручиться доверием парламента, он окончательно лишился власти после того, как Палата представителей отвергла предложенный им бюджет. Неспособный преодолеть тупик, оставшийся от правительства Мензиса, он войдёт в историю как премьер-министр с самым коротким сроком на данный момент. Теперь Джон Кэртин и Лейбористская партия попытаются сформировать новое правительство."
 r56_australia.14.a:0 "Пора Джону Кэртину возглавить страну."
 r56_australia.15.t:0 "[AST.GetNameDefCap] просит передать защиту Сингапура"
 r56_australia.15.d:0 "Сингапур — одна из наших важнейших стратегических провинций в Азии. Однако он находится далеко от [ENG.GetNameDef] и подвергается угрозе вторжения. [AST.GetNameDef] предложила взять защиту Сингапура на себя, освободив [ENG.GetAdjective] войска для других районов мира, где они нужнее."
 r56_australia.15.a:0 "В их руках будет безопаснее."
 r56_australia.15.b:0 "Мы не станем доверять этим бывшим каторжникам."
 r56_australia.16.t:0 "[ENG.GetNameDefCap] принимает наше предложение"
 r56_australia.16.d:0 "[ENG.GetNameDefCap] согласилась на наше предложение взять на себя защиту Сингапура."
 r56_australia.16.a:0 "Превосходно."
 r56_australia.17.t:0 "[ENG.GetNameDefCap] отклоняет нашу просьбу"
 r56_australia.17.d:0 "[ENG.GetNameDefCap] отклонила наше предложение взять на себя защиту Сингапура."
 r56_australia.17.a:0 "Будем надеяться, что это не ослабит Империю."
 r56_australia.18.t:0 "[ENG.GetNameDefCap] передаёт управление [AST.GetNameDef]"
 r56_australia.18.d:0 "Переговоры между [ENG.GetNameDef] и [AST.GetNameDef] привели к тому, что [AST.GetAdjective] правительство взяло на себя управление Стрейтс-Сетлментс, Малайей и Британским Борнео. Теперь по всем вопросам мы будем отчитываться перед ними."
 r56_australia.18.a:0 "Новые хозяева, старые проблемы."
 r56_australia.19.t:0 "[AST.GetNameDefCap] просит интегрировать Новую Зеландию"
 r56_australia.19.d:0 "Идея превращения Новой Зеландии в штат Австралии существовала ещё до основания наших стран. Однако этого не произошло из-за расстояния, политических и экономических различий, а также отношения Австралии к коренному населению. Недавние переговоры дипломатов вновь подняли вопрос о присоединении Новой Зеландии в качестве [AST.GetAdjective] штата. Решение может оказаться непопулярным, но в этом всё более опасном мире выгоды способны быть значительными."
 r56_australia.19.a:0 "Пора забыть разногласия и объединиться."
 r56_australia.19.b:0 "Они что, шутят?"
 r56_australia.20.t:0 "Интеграция Новой Зеландии"
 r56_australia.20.d:0 "Переговоры в Окленде оказались успешными, и своим последним решением в качестве парламента независимой страны Новая Зеландия проголосовала за вступление в [AST.GetNameDef] на правах полноправного штата."
 r56_australia.20.a:0 "Добро пожаловать домой, Новая Зеландия."
 r56_australia.21.t:0 "[NZL.GetNameDefCap] проявляет неповиновение"
 r56_australia.21.d:0 "[NZL.GetNameDefCap] отвергла любые добровольные предложения о вступлении в [AST.GetNameDef] и покинула все переговоры о будущем статусе Новой Зеландии. Раз дипломатия провалилась, возможно, пора прибегнуть к более жестоким средствам."
 r56_australia.21.a:0 "Киви пожалеют о том дне, когда отклонили наше предложение."
 r56_australia.22.t:0 "[NZL.GetAdjective] кризис"
 r56_australia.22.d:0 "В последние месяцы между [AST.GetNameDef] и [NZL.GetNameDef] назревал кризис. [AST.GetNameDefCap] неоднократно требовала, чтобы [NZL.GetNameDef] вошла в [AST.GetNameDef] как штат. В [NZL.GetNameDef] эту идею отвергли, а дипломатические отношения между двумя доминионами разрушились. Поскольку война между ними выглядит всё вероятнее, пора определить нашу позицию."
 r56_australia.22.a:0 "Лучше не рисковать войной с [AST.GetNameDef]."
 r56_australia.22.b:0 "Мы поддержим [NZL.GetNameDef]!"
 r56_australia.23.t:0 "[AST.GetNameDefCap] просит передать остров Рождества"
 r56_australia.23.d:0 "Послы [AST.GetNameDef] попросили передать удалённый и стратегически важный остров Рождества под [AST.GetAdjective] управление. Остров, известный добычей фосфатов, был аннексирован Британией в 1888 году и с тех пор управлялся администрацией Стрейтс-Сетлментс. На нём живёт множество малайских рабочих, а его гавань служит безопасным убежищем для кораблей в восточной и южной частях Индийского океана. Благодаря близости [AST.GetNameDef] лучше подходит для управления островом и предлагает компенсацию потерь от добычи фосфатов. Следует ли согласиться?"
 r56_australia.23.a:0 "Под их управлением острову будет лучше."
 r56_australia.23.b:0 "Остров Рождества им не достанется."
 r56_australia.24.t:0 "Передача острова Рождества"
 r56_australia.24.d:0 "[From.GetNameDef] согласилась передать нам контроль над островом Рождества. Закон об острове Рождества уже подготовлен и передаст его под прямую власть Содружества."
 r56_australia.24.a:0 "Какой чудесный остров!"
 r56_australia.25.t:0 "[From.GetNameDef] отклоняет нашу просьбу"
 r56_australia.25.d:0 "Несмотря на предложенную компенсацию, [From.GetNameDef] отказалась передать нам остров Рождества."
 r56_australia.25.a:0 "Рождество переоценивают."
 r56_australia.26.t:0 "[AST.GetNameDefCap] предлагает договор о ненападении"
 r56_australia.26.d:0 "[AST.GetNameDefCap] предложила заключить между нашими странами договор о ненападении, чтобы сохранить мир и процветание в южной части Тихого океана. Этому предшествовали месяцы про-[JAP.GetAdjective] политики и умиротворения со стороны [AST.GetAdjective] правительства, стремившегося проводить «умиротворение в Азии» по образцу курса [ENG.GetAdjective] правительства в отношении [GER.GetNameDef]."
 r56_australia.26.a:0 "Это может быть нам выгодно."
 r56_australia.26.b:0 "Мы не можем давать ложные обещания."
 r56_australia.27.t:0 "[JAP.GetNameDefCap] принимает наш договор о ненападении"
 r56_australia.27.d:0 "Сегодня утром в [JAP.Capital.GetName] наши страны подписали официальный договор о ненападении между [AST.GetNameDef] и [JAP.GetNameDef]. [JAP.GetAdjective] посол преподнёс [AST.GetAdjective] послу дерево бонсай как символ мира."
 r56_australia.27.a:0 "Мир для нашего поколения."
 r56_australia.28.t:0 "[JAP.GetNameDefCap] отклоняет наш договор о ненападении"
 r56_australia.28.d:0 "Переговоры с [JAP.GetNameDef] провалились. Наши дипломаты столкнулись с холодным приёмом при обсуждении пакта о ненападении и в итоге вернулись ни с чем."
 r56_australia.28.a:0 "Это может означать только одно."
 r56_australia.29.t:0 "Иностранное вмешательство в [INS.GetNameDef]"
 r56_australia.29.desc:0 "В последнее время в [INS.GetNameDef] участились выступления повстанцев, требующих независимости. Местные власти обнаружили крупный склад [AST.GetAdjective] оружия, а захваченные мятежники сообщили, что его контрабандой доставили на острова [AST.GetAdjective] корабли. Воодушевлённые международной поддержкой, лидеры восстания привлекли под свои знамёна многих людей. Похоже, вскоре нас действительно ждёт конфликт."
 r56_australia.29.a:0 "За этими националистами нужно следить."
 r56_australia.30.t:0 "Восстание в [INS.GetNameDef]"
 r56_australia.30.desc:0 "Поддерживаемые и финансируемые [AST.GetNameDef] повстанцы, выступающие за независимость, поднялись по всей Ост-Индии. Они захватили несколько островов и сейчас собирают силы, чтобы изгнать лоялистов с оставшихся территорий."
 r56_australia.30.a:0 "Подавить этих мятежников!"
 r56_australia.31.t:0 "Иностранное вмешательство в [MAL.GetNameDef]"
 r56_australia.31.desc:0 "В последнее время в [MAL.GetNameDef] участились выступления повстанцев, требующих независимости. Местные власти обнаружили крупный склад [AST.GetAdjective] оружия, а захваченные мятежники сообщили, что его контрабандой доставили в [MAL.GetNameDef] на [AST.GetAdjective] кораблях. Воодушевлённые международной поддержкой, местные лидеры восстания привлекли под свои знамёна многих людей. Похоже, вскоре нас действительно ждёт конфликт."
 r56_australia.31.a:0 "За этими националистами нужно следить."
 r56_australia.32.t:0 "[MAL.GetAdjective] чрезвычайное положение"
 r56_australia.32.desc:0 "Поддерживаемые и финансируемые [AST.GetNameDef] повстанцы, выступающие за независимость, поднялись по всей [MAL.GetNameDef]. Они захватили значительную часть [MAL.GetAdjective] нагорий и джунглей и сейчас собирают силы для удара по Сингапуру."
 r56_australia.32.a:0 "Ох, беда."
 AST_R56_dingo_scout_car:0 "Разведывательный автомобиль «Динго»"
 AST_R56_dingo_scout_car_desc:0 "Сотрудничество с Ford Motor Company привело к созданию нового бронеавтомобиля [AST.GetAdjective] производства. Машина будет основана на укороченной версии существующей колёсной базы Ford, получит полный привод и мощный двигатель V8. Она станет ценным средством разведки благодаря пуленепробиваемой броне производства Victorian Railways, радиостанции и месту для пулемёта Bren."
 AST_R56_citizen_military_forces:0 "Гражданские вооружённые силы"
 AST_R56_citizen_military_forces_desc:0 "Гражданские вооружённые силы — основной резерв [AST.GetNameDef]. Тысячи бойцов этого ополчения готовы в любой момент встать на защиту [AST.GetNameDef]."
 AST_R56_royal_australian_artilery:0 "Королевская [AST.GetAdjective] артиллерия"
 AST_R56_royal_australian_artilery_desc:0 "Королевская австралийская артиллерия доказала свою ценность в Великой войне. Однако её оснащение словно забыло, что та закончилась более 18 лет назад. Необходимо отдать приоритет новому вооружению."
 AST_R56_the_owen_gun:0 "Пистолет-пулемёт Оуэна"
 AST_R56_the_owen_gun_desc:0 "Эвелин Оуэн создал «автоматический карабин» калибра .22. Сначала армия отвергла это оружие, и оно оказалось в мешке с сахаром. Позднее его вновь обнаружил Винсент Уорделл, управляющий крупным заводом в Порт-Кембле. Использовав свои связи, он добился представления Оуэном оружия Армейскому совету по изобретениям. Возможно, этот дешёвый автомат всё же окажется полезным."
 AST_R56_department_of_defence_coordination:0 "Департамент координации обороны"
 AST_R56_department_of_defence_coordination_desc:0 "Департамент координации обороны отвечает за согласование действий трёх видов вооружённых сил и наших союзников. Объединив усилия, мы обеспечим эффективную боевую силу на суше, на море и в воздухе."
 AST_R56_australian_womans_army_service:0 "[AST.GetAdjective] женская армейская служба"
 AST_R56_australian_womans_army_service_desc:0 "Каждый мужчина нужен на фронте, поэтому тысячи [AST.GetAdjective] женщин возьмут на себя вождение, связь и техническое обслуживание."
 AST_R56_australian_army_catering_corps:0 "[AST.GetAdjective] армейский корпус питания"
 AST_R56_australian_army_catering_corps_desc:0 "Качество питания в [AST.GetAdjective] армии оставляет желать лучшего, главным образом из-за подготовки поваров. Реорганизация этой системы повысит моральный дух и эффективность."
 AST_R56_services_reconnaissance_department:0 "Департамент разведки вооружённых сил"
 AST_R56_services_reconnaissance_department_desc:0 "Департамент разведки вооружённых сил (SRD) станет подразделением специальных операций [AST.GetNameDef] и будет отвечать за особые миссии по всему южнотихоокеанскому региону."
 AST_R56_z_special_unit:0 "Специальное подразделение Z"
 AST_R56_z_special_unit_desc:0 "[AST.GetNameDefCap] нуждается в подразделении коммандос, специализирующемся на рейдах по островам южной части Тихого океана. Подчиняясь Департаменту разведки вооружённых сил, эта элитная группа станет постоянной угрозой любому врагу, приблизившемуся к берегам [AST.GetNameDef]."
 AST_R56_jungle_warfare_training:0 "Подготовка к войне в джунглях"
 AST_R56_jungle_warfare_training_desc:0 "Боевые действия в джунглях представляют серьёзную угрозу для обычных войск. Разработка руководств, успешных тактик и программ подготовки для специализированных частей значительно повысит наши шансы на успех."
 AST_R56_m_special_unit:0 "Специальное подразделение M"
 AST_R56_m_special_unit_desc:0 "Департамент разведки вооружённых сил предложил создать новое подразделение глубинной разведки. Став преемником береговых наблюдателей, оно будет использовать местных рекрутов, действовать под прикрытием на островах Тихого океана и передавать сведения о вражеском судоходстве и передвижениях войск."
 AST_R56_school_of_unconventional_warefare:0 "Наследие АНЗАК"
 AST_R56_school_of_unconventional_warefare_desc:0 "Австралийско-новозеландский армейский корпус был создан во время Великой войны и участвовал в тяжелейших боях на склонах Галлиполи. [AST.GetAdjective] вооружённые силы и народ должны гордиться храбростью, самоотверженностью и стойкостью австралийских солдат, сражавшихся и погибших в его рядах."
 AST_R56_sentinal_tank:0 "Танк «Сентинел»"
 AST_R56_sentinal_tank_desc:0 "[AST.GetNameDefCap] не может вечно зависеть от иностранных поставок танков. Следует направить инженеров для изучения зарубежных проектов и разработки собственной модели. Танк «Сентинел» будет жизненно важен для обеспечения [AST.GetNameDef] бронетанковой мощью, необходимой для защиты от крупных военных держав."
 AST_R56_hmas_assault:0 "HMAS Assault"
 AST_R56_hmas_assault_desc:0 "Залив Нельсона в Новом Южном Уэльсе идеально подходит для учебного центра Королевского австралийского флота по высадке десанта. Он получит название HMAS Assault."
 AST_R56_aussie_paras:0 "[AST.GetAdjective] парашютный полк"
 AST_R56_aussie_paras_desc:0 "Подразделение, способное проводить воздушно-десантные операции, будет необходимо в наших владениях в южной части Тихого океана. Парашютный полк сможет устраивать засады и беспокоить любого врага [AST.GetNameDef]."
 AST_R56_rebuild_cockatoo_island:0 "Восстановить остров Какаду"
 AST_R56_rebuild_cockatoo_island_desc:0 "Остров Какаду в Сиднейской бухте — важная военно-морская база и ремонтный центр Королевского [AST.GetAdjective] флота. Однако в последнее время он пришёл в упадок и остро нуждается в восстановлении и расширении."
 AST_R56_commerce_protection:0 "Защита торговли"
 AST_R56_commerce_protection_desc:0 "[AST.GetNameDefCap] зависит от поставок, поступающих по морю из других стран. Враждебная держава, перерезавшая эту артерию, сможет медленно нас задушить. Защита конвоев и торговых путей — не просто стратегия, а необходимость."
 AST_R56_raid_overseas_commerce:0 "Рейды на зарубежную торговлю"
 AST_R56_raid_overseas_commerce_desc:0 "Подводные лодки способны перерезать вражеские морские пути снабжения. Большое число таких кораблей будет тревожить противника и серьёзно затруднит снабжение его вторжений на острова южной части Тихого океана."
 AST_R56_scrap_iron_flotilla:0 "Флотилия металлолома"
 AST_R56_scrap_iron_flotilla_desc:0 "Наш нынешний флот повидал лучшие времена, и враги насмешливо называют эти корабли плавающим металлоломом для учебной стрельбы. Приложив усилия, мы со временем докажем, что они ошибаются."
 AST_R56_royal_australian_submarine_service:0 "Королевская [AST.GetAdjective] подводная служба"
 AST_R56_royal_australian_submarine_service_desc:0 "Подводные лодки — оружие будущего и важнейшая часть сил наших союзников. Разработка более новых и совершенных моделей сыграет решающую роль в грядущих конфликтах."
 AST_R56_merchant_navy:0 "Торговый флот"
 AST_R56_merchant_navy_desc:0 "[AST.GetNameDefCap]Коммерческое судоходство и экипажи являются спасательными линиями островного государства. Укрепление их рядов и создание большего количества совместных колонн будет способствовать снабжению наших заморских войск."
 AST_R56_cruiser_modernisation:0 "Модернизация крейсеров"
 AST_R56_cruiser_modernisation_desc:0 "Разработка линкоров и современных крейсеров обеспечит наш флот универсальными кораблями для выполнения всех задач."
 AST_R56_submarine_hunters:0 "Охотники за подводными лодками"
 AST_R56_submarine_hunters_desc:0 "Решительный противник может проецировать морскую силу не крупными надводными соединениями, а подлодками, атакующими торговый флот. Возможно, создание противолодочных кораблей заставит его отказаться от дальнейших атак на наши конвои."
 AST_R56_project_cook:0 "Проект «Кук»"
 AST_R56_project_cook_desc:0 "Авианосцы — будущее морской мощи. Следует разработать собственный проект, чтобы защитить побережье [AST.GetNameDef] от иностранных захватчиков."
 AST_R56_royal_australian_navy:0 "Королевский [AST.GetAdjective] флот"
 AST_R56_royal_australian_navy_desc:0 "Недавние планы морского расширения превратили наш флот в грозную силу южной части Тихого океана. Строительство новых верфей и расширение учебных программ укрепят наши возможности и позволят с гордостью служить [AST.GetNameDef] и её интересам."
 AST_R56_commonwealth_aricraft_corporation:0 "Авиационная корпорация Содружества"
 AST_R56_commonwealth_aricraft_corporation_desc:0 "Недавно главный управляющий Broken Hill Proprietary вернулся из Европы с твёрдым убеждением, что на континенте скоро начнётся новая война. Обеспокоенный отсутствием у [AST.GetAdjective] промышленности достаточных производственных возможностей, он начал убеждать правительство создать современную авиационную отрасль. Идея выглядит разумной."
 AST_R56_cac_wirraway:0 "CAC Wirraway"
 AST_R56_cac_wirraway_desc:0 "Wirraway — первая попытка [AST.GetNameDef] создать собственные военно-воздушные силы и вывести региональное авиастроение на современный уровень. Эти самолёты хорошо послужат в роли лёгких бомбардировщиков и штурмовиков."
 AST_R56_cac_woomera:0 "CAC Woomera"
 AST_R56_cac_woomera_desc:0 "Woomera — всего лишь лёгкий самолёт, но он развивает идеи предыдущих моделей и сможет защищать родину, обеспечивая войска непосредственной авиационной поддержкой."
 AST_R56_ran_torped_factory:0 "Торпедный завод RAN"
 AST_R56_ran_torped_factory_desc:0 "Торпедный завод Королевского [AST.GetAdjective] флота в Ньютрал-Бей, Сидней, станет главным предприятием по производству, обслуживанию и хранению большей части торпед и других боеприпасов. Деловой совет уже приобрёл существующий промышленный объект. Нам остаётся только дать разрешение."
 AST_R56_cac_boomerang:0 "CAC Boomerang"
 AST_R56_cac_boomerang_desc:0 "Boomerang станет первым собственным лёгким истребителем [AST.GetNameDef] и страховкой на случай прекращения импорта самолётов. Его применение может понадобиться уже очень скоро."
 AST_R56_australian_beaufighter:0 "[AST.GetAdjective] Beaufighter"
 AST_R56_australian_beaufighter_desc:0 "Beaufighter — тяжёлый истребитель с отличными лётными характеристиками, мощным вооружением, высокой скоростью на малой высоте и очень тихим полётом. Местное производство этого дальнего высокоэффективного самолёта принесёт большую пользу вооружённым силам."
 AST_R56_womens_auxiliary_australian_air_force:0 "Женские вспомогательные [AST.GetAdjective] военно-воздушные силы"
 AST_R56_womens_auxiliary_australian_air_force_desc:0 "Женщины по всей Австралии готовы служить стране. Создав женские вспомогательные военно-воздушные силы, мы значительно увеличим численность и возможности Королевских австралийских ВВС, даже если женщины будут выполнять только небоевые задачи."
 AST_R56_royal_australian_air_force:0 "Королевские [AST.GetAdjective] военно-воздушные силы"
 AST_R56_royal_australian_air_force_desc:0 "Созданные в 1921 году и получившие королевское одобрение Георга V, Королевские австралийские ВВС стали вторыми королевскими военно-воздушными силами Британского Содружества. Несмотря на небольшую численность, их навыки и подготовка позволяют оказывать существенную поддержку в сухопутных и морских конфликтах."
 AST_R56_jet_development:0 "Разработка реактивной авиации"
 AST_R56_jet_development_desc:0 "Со временем становится всё очевиднее, что реактивные самолёты определят будущее как воздушной войны, так и гражданских перевозок. Было бы глупо отстать в этой гонке."
 AST_R56_uranium_mines:0 "Урановые рудники"
 AST_R56_uranium_mines_desc:0 "В Австралии находятся крупнейшие в мире залежи урана, но до сих пор они почти не использовались. Стоит разработать шахты для добычи этого ценного ресурса."
 AST_R56_the_ultimate_bomb:0 "Абсолютная бомба"
 AST_R56_the_ultimate_bomb_desc:0 "Потенциал оружия и оборудования на основе урана кажется безграничным. Раскрытие этих возможностей может стать ключом к победе."
 AST_R56_airbase_expansion:0 "Расширение авиабаз"
 AST_R56_airbase_expansion_desc:0 "Департамент гражданской авиации рекомендовал участки для строительства новых аэродромов. Эти аэродромы в Перте и по всей стране помогут развивать гражданскую и военную авиацию."
 AST_R56_government_aircraft_factories:0 "Государственные авиационные заводы"
 AST_R56_government_aircraft_factories_desc:0 "Не секрет, что Австралии не хватает крупного промышленного комплекса для выпуска военных самолётов, и ей приходится полагаться на британские Королевские ВВС. При государственном финансировании мы сможем начать производство самолётов в Австралии."
 AST_R56_volunteer_air_observers_corps:0 "Добровольческий корпус воздушных наблюдателей"
 AST_R56_volunteer_air_observers_corps_desc:0 "Королевские австралийские ВВС перегружены. Создав добровольческий корпус воздушных наблюдателей из гражданских, мы сможем круглосуточно следить за небом по всей стране, не расходуя столь необходимые людские ресурсы."
 AST_R56_air_defence_system:0 "Сеть противовоздушной обороны"
 AST_R56_air_defence_system_desc:0 "На правительство растёт давление с требованием инвестировать в противовоздушную оборону у потенциально уязвимых объектов Австралии, таких как порты и промышленные комплексы. Было бы разумно прислушаться."
 AST_R56_finish_railway_gauge_standardisation:0 "Завершить стандартизацию железнодорожной колеи"
 AST_R56_finish_railway_gauge_standardisation_desc:0 "На протяжении 1935 года велись масштабные работы по стандартизации ширины железнодорожной колеи. Это обеспечит быструю и эффективную перевозку людей и грузов."
 AST_R56_australian_wool_board:0 "[AST.GetAdjective] совет по шерсти"
 AST_R56_australian_wool_board_desc:0 "Со времён колониальной эпохи шерсть остаётся одной из крупнейших отраслей Австралии и обеспечивает 45 процентов экспортных доходов страны. Создание специального совета позволит расширить наши возможности и торговые отношения с другими странами."
 AST_R56_incom_tax_assessment_act:0 "Закон об оценке подоходного налога"
 AST_R56_incom_tax_assessment_act_desc:0 ""
 AST_R56_connect_south_australia:0 "Соединить Южную Австралию"
 AST_R56_connect_south_australia_desc:0 "Железная дорога Аделаида — Порт-Огаста поможет связать южное побережье Австралии."
 AST_R56_extend_the_northern_line:0 "Расширить северную линию"
 AST_R56_extend_the_northern_line_desc:0 "Северная Австралия имеет стратегическое значение, но железнодорожная сеть там развита недостаточно."
 AST_R56_australian_iron_and_steel:0 "Australian Iron & Steel"
 AST_R56_australian_iron_and_steel_desc:0 "Завод BHP Australian Iron & Steel в Порт-Кембле выставлен на продажу, а главным покупателем считается Lysaght. Это прекрасная возможность развить сталелитейное предприятие и прилегающий район."
 AST_R56_expand_lithgow:0 "Расширить завод стрелкового оружия в Литгоу"
 AST_R56_expand_lithgow_desc:0 "Завод производит оружие для Британского Содружества с 1912 года. Хотя во время Великой войны он получил значительные инвестиции, его производственные мощности всё ещё ограничены. Государственная субсидия позволит довести выпуск до максимума."
 AST_R56_greater_newcastle_act:0 "Закон о Большом Ньюкасле"
 AST_R56_greater_newcastle_act_desc:0 "Организация и управление Ньюкаслом в Новом Южном Уэльсе чрезмерно сложны и раздроблены. Объединив множество небольших городков и пригородов в город Большой Ньюкасл, мы значительно улучшим управление и производительность региона."
 AST_R56_national_stock_exchange_of_australia:0 "Национальная фондовая биржа Австралии"
 AST_R56_national_stock_exchange_of_australia_desc:0 "Учитывая рост и масштабы австралийской экономики, уместно создать Национальную фондовую биржу, которая упростит покупку и продажу акций и облигаций."
 AST_R56_industries_assistance_corporation:0 "Корпорация содействия промышленности"
 AST_R56_industries_assistance_corporation_desc:0 "Корпорация содействия промышленности предоставляет правительству важные отчёты о состоянии практически каждой отрасли страны. Поощряя её теснее сотрудничать с аналогичными организациями, мы ускорим промышленное развитие."
 AST_R56_overseas_telecommunications_commission:0 "Комиссия по зарубежным телекоммуникациям"
 AST_R56_overseas_telecommunications_commission_desc:0 "Создав комиссию для управления всеми видами телекоммуникаций в стране, мы устраним искусственные ограничения трафика и расширим общественный доступ к кабелю «Вся красная линия», соединяющему Британскую империю."
 AST_R56_australian_national_university:0 "[AST.GetAdjective] национальный университет"
 AST_R56_australian_national_university_desc:0 "Призывы создать Австралийский национальный университет звучат давно — эта идея обсуждается с начала века. Если вскоре начать строительство, мы сможем привлечь на должности нескольких видных австралийских и британских интеллектуалов."
 AST_R56_the_writers_revolution_idea:0 "Революция писателей"
 AST_R56_support_new_south_wales_oil_industry:0 "Поддержать [AST.GetAdjective] нефтяную промышленность"
 AST_R56_support_new_south_wales_oil_industry_desc:0 "Хотя австралийская нефтяная промышленность довольно крупна по сравнению с некоторыми странами, она не способна заметно влиять на мировой рынок. Государственная поддержка позволит сократить импорт нефти и приблизиться к большей самообеспеченности."
 AST_R56_national_security_act:0 "Закон о национальной безопасности"
 AST_R56_national_security_act_desc:0 "Нынешнее положение в мире стало худшим со времён Великой войны. Мы должны принять Закон о национальной безопасности, чтобы адаптироваться к этим вызовам."
 AST_R56_allied_works_council:0 "Союзный совет по строительным работам"
 AST_R56_allied_works_council_desc:0 "Для эффективного расширения военной промышленности необходимо создать совет, контролирующий этот процесс. Он будет обеспечивать рациональное распределение ресурсов и производство материалов и оборудования, необходимых войскам и победе."
 AST_R56_advisory_war_council:0 "Консультативный военный совет"
 AST_R56_advisory_war_council_desc:0 "Чтобы наилучшим образом поддержать военные усилия, мы создадим совет военного времени с участием всех основных политических партий страны."
 AST_R56_army_inventions_board:0 "Армейский совет по изобретениям"
 AST_R56_army_inventions_board_desc:0 "Создание Армейского совета по изобретениям позволит эффективнее разрабатывать передовое военное оборудование."
 AST_R56_classify_aliens:0 "Классифицировать иностранцев"
 AST_R56_classify_aliens_desc:0 "Хотя это может вызывать дискомфорт, одним из наиболее эффективных способов предотвращения вражеского шпионажа является наблюдение за проживающими в нашей стране гражданами враждебных государств."
 AST_R56_civil_constructional_corps:0 "Гражданский строительный корпус"
 AST_R56_civil_constructional_corps_desc:0 "Для лучшей поддержки военного строительства мы создадим гражданскую рабочую силу."
 AST_R56_squash_the_squander_bugs:0 "Раздавить жуков-расточителей"
 AST_R56_squash_the_squander_bugs_desc:0 "Чтобы помочь экономике, мы начнём пропагандистскую кампанию, призывающую граждан вкладывать средства в военные усилия."
 AST_R56_australian_womans_land_army:0 "[AST.GetAdjective] женская земельная армия"
 AST_R56_australian_womans_land_army_desc:0 "Население Австралии невелико, поэтому для войны необходимо мобилизовать все доступные ресурсы. Создание Женской земельной армии позволит увеличить наши силы, даже если эти женщины не будут участвовать в боях напрямую."
 AST_R56_fight_work_or_perish:0 "Сражайся, работай или погибни"
 AST_R56_fight_work_or_perish_desc:0 "Для победы каждый мужчина и каждая женщина Австралии должны внести свой вклад. Мы обязаны объединиться, чтобы выйти из войны победителями."
 AST_R56_reaffirm_commonwelth_commitments:0 "Обязательства перед Содружеством"
 AST_R56_reaffirm_commonwelth_commitments_desc:0 "Как гордый и активный член Британского Содружества, мы можем укрепить отношения с остальной Империей и получить доступ к имперским исследованиям, развивая связи через наших верховных комиссаров. Это также поможет заручиться общественной поддержкой."
 AST_R56_strengthen_british_ties:0 "Укрепить [ENG.GetAdjective] связи"
 AST_R56_strengthen_british_ties_desc:0 "С момента федерации в 1901 году Австралия остаётся британской нацией, а наша конституция получила одобрение королевы Виктории. Укрепляя связи с метрополией, мы добьёмся стабильности и общественной поддержки."
 AST_R56_csir:0 "CSIR"
 AST_R56_csir_desc:0 "В Британском Содружестве и Империи живут одни из величайших умов мира. Расширяя наше участие в CSIR, мы получим важные исследования по промышленности и инженерному делу."
 AST_R56_south_west_pacific_area_command:0 "Командование Юго-Западной Тихоокеанской зоны"
 AST_R56_south_west_pacific_area_command_desc:0 "Как наиболее развитой стране нашего региона, британцы и американцы доверяют нам защиту юго-западной части Тихого океана. Мы обязаны принять эту ответственность, особенно учитывая удалённость Великобритании и Соединённых Штатов."
 AST_R56_ask_for_the_christmas_islands:0 "Попросить остров Рождества"
 AST_R56_ask_for_the_christmas_islands_desc:0 "Сейчас остров Рождества управляется британскими колониальными властями в Малайе. Однако мы могли бы обсудить с британским правительством передачу острова под наше управление и защиту."
 AST_R56_dreams_of_a_republic:0 "Мечты о республике"
 AST_R56_dreams_of_a_republic_desc:0 "[AST.GetNameDefCap] заслуживает полной независимости от Вестминстера."
 AST_R56_australia_act:0 "Закон об Австралии"
 AST_R56_australia_act_desc:0 "Принятие Закона об Австралии означает, что британцы больше не обладают властью над австралийским парламентом. Для достижения полной независимости это было необходимо."
 AST_R56_look_to_america:0 "Обратиться к [USA.GetNameDef]"
 AST_R56_look_to_america_desc:0 "[USA.GetNameDefCap] — гигант на восточном берегу Тихого океана. Следует наладить отношения и открыть посольство в Вашингтоне."
 AST_R56_anzus:0 "АНЗЮС"
 AST_R56_anzus_desc:0 "Учитывая общие ценности свободных демократических стран, мы могли бы стремиться к более тесному военному сотрудничеству с Соединёнными Штатами."
 AST_R56_protect_indonesia:0 "Защитить Ост-Индию"
 AST_R56_protect_indonesia_desc:0 "Из-за близости Ост-Индии её захват иностранной державой или враждебной идеологией поставит нас в опасное положение. Официально взяв регион под защиту, мы лучше обеспечим свои интересы."
 AST_R56_the_japaneese_threat:0 "Японская угроза"
 AST_R56_the_japaneese_threat_desc:0 "В последние годы Япония доказала, что представляет серьёзную угрозу нашему суверенитету и образу жизни. Чтобы ослабить её мощь и военные усилия, можно убедить дружественные страны региона ввести торговое эмбарго."
 AST_R56_preemptive_strike:0 "Превентивный удар"
 AST_R56_preemptive_strike_desc:0 "Несмотря на эмбарго и дипломатические усилия, очевидно, что Япония не намерена менять курс. Мы должны сами защитить дипломатический мир, нанеся удар до того, как японцы нападут на нас."
 AST_R56_pacific_initiative:0 "Тихоокеанская инициатива"
 AST_R56_pacific_initiative_desc:0 "Теперь, когда мы обрели независимость, пора определить собственную внешнюю политику, не зависящую ни от британцев, ни от американцев. Начнём с Тихого океана."
 AST_R56_support_china:0 "Поддержать [CHI.GetNameDef]"
 AST_R56_support_china_desc:0 "Китай находится под серьёзной угрозой коммунистической экспансии со стороны соседей. Мы обязаны заключить с ним союз, чтобы не допустить поражения."
 AST_R56_support_japan:0 "Поддержать [JAP.GetNameDef]"
 AST_R56_support_japan_desc:0 "Вопреки обстоятельствам японцы доказали свою приверженность демократии. Поддержать их, а не автократическое китайское правительство, кажется очевидным выбором."
 AST_R56_research_cooperation:0 "Научное сотрудничество"
 AST_R56_research_cooperation_desc:0 "Независимость от Британии стоила нам доступа к важнейшим исследованиям. Для восстановления необходимо создать собственную исследовательскую группу при поддержке новых союзников."
 AST_R56_strengthen_the_coalition:0 "Укрепить коалицию"
 AST_R56_strengthen_the_coalition_desc:0 "[AST.GetNameDefCap] нуждается в национальном правительстве, а не во власти профсоюзных боссов. Партия Объединённой Австралии и Аграрная партия годами сотрудничают ради одной цели — не допустить лейбористов к власти. Однако отношения между ними часто были нестабильными."
 AST_R56_statute_of_westminster:0 "Вестминстерский статут"
 AST_R56_statute_of_westminster_desc:0 "Хотя мы сохраняем верность Британскому Содружеству, а население поддерживает Корону, австралийскому правительству пора принять Вестминстерский статут. Тогда британский парламент сможет принимать законы от имени Австралии только с согласия нашего собственного парламента."
 AST_R56_appeasment_in_asia:0 "Умиротворение в Азии"
 AST_R56_appeasment_in_asia_desc:0 "Поскольку [JAP.GetNameDef] проводит всё более милитаристскую политику в Азии, нам следует последовать примеру [ENG.GetNameDef] и искать умиротворения, чтобы не навлечь японский гнев."
 AST_R56_enforce_japanese_exports:0 "принуждение [JAP.GetAdjective] Экспорт"
 AST_R56_enforce_japanese_exports_desc:0 "Многие наши предприятия отказываются экспортировать товары в [JAP.GetNameDef], ухудшая отношения с [JAP.GetAdjective] друзьями. Следует сделать всё возможное, чтобы поставки не прерывались."
 AST_R56_non_agression_with_japan:0 "Пакт о ненападении с Японией"
 AST_R56_non_agression_with_japan_desc:0 "Нам удалось восстановить нормальные отношения с Японией, и при умелой дипломатии мы, возможно, убедим её подписать пакт о ненападении."
 AST_R56_appeasment_in_europe:0 "Поддержать политику умиротворения"
 AST_R56_appeasment_in_europe_desc:0 "Британское правительство выбрало политику умиротворения, чтобы укрепить силы до момента, когда сможет эффективно противостоять Германии. Мы должны поддерживать эту стратегию, пока Британия и Империя не станут достаточно сильными для вмешательства."
 AST_R56_down_with_the_communists:0 "Долой коммунистов"
 AST_R56_down_with_the_communists_desc:0 "Коммунизм напрямую угрожает нашему демократическому образу жизни. Мы должны ограничить влияние коммунистических партий в Австралии, иначе можем стать следующей жертвой красной революции."
 AST_R56_support_the_primary_industries:0 "Поддержать первичные отрасли"
 AST_R56_support_the_primary_industries_desc:0 "Государственное финансирование и субсидии позволят значительно увеличить квоты и производственные мощности."
 AST_R56_control_inflation:0 "Сдержать инфляцию"
 AST_R56_control_inflation_desc:0 "Если мы не приложим усилий для контроля инфляции, страна может так и не оправиться полностью от депрессии."
 AST_R56_the_labor_government:0 "Лейбористское правительство"
 AST_R56_the_labor_government_desc:0 "Наше правительство находится в шатком положении, поскольку нас не избирали. Прежде чем эффективно управлять страной, необходимо сплотить партию."
 AST_R56_reaffirm_white_australia:0 "Подтвердить политику Белой Австралии"
 AST_R56_reaffirm_white_australia_desc:0 "«Эта страна навсегда останется домом потомков тех людей, которые мирно прибыли сюда, чтобы создать в Южных морях форпост британской расы». — Джон Кэртин"
 AST_R56_legislate_the_indigenous_peoples:0 "Законодательство о коренных народах"
 AST_R56_legislate_the_indigenous_peoples_desc:0 "До сих пор коренное население Австралии не учитывалось в национальной переписи. Хотя изменение наверняка вызовет сильную негативную реакцию, этот шаг жизненно необходим."
 AST_R56_support_the_commonwelth_workers:0 "Поддержать рабочих Содружества"
 AST_R56_support_the_commonwelth_workers_desc:0 "Одна из главных целей австралийского рабочего движения — создание программ поддержки трудящихся. Теперь, придя к власти, мы можем осуществить меры помощи рабочим."
 AST_R56_australian_new_deal:0 "[AST.GetAdjective] новый курс"
 AST_R56_australian_new_deal_desc:0 "Теперь, когда мы у власти, можно реализовать ряд общественных программ и инициатив, направленных на улучшение повседневной жизни австралийцев."
 AST_R56_centralise_pensions:0 "Централизовать пенсионную систему"
 AST_R56_centralise_pensions_desc:0 "Сейчас размер пенсий определяется на уровне штатов, а не федерального правительства. Централизация сделает систему эффективнее и законнее."
 AST_R56_empower_the_trade_unions:0 "Расширить полномочия профсоюзов"
 AST_R56_empower_the_trade_unions_desc:0 "История профсоюзов в Австралии сложна и противоречива. Тем не менее, чтобы оставаться верными ценностям Австралийской лейбористской партии, мы должны дать им больше полномочий."
 AST_R56_forty_hour_work_week:0 "40-часовая рабочая неделя"
 AST_R56_forty_hour_work_week_desc:0 "Движение за 40-часовую рабочую неделю набирает популярность. Её введение в Австралии может повысить производительность и удовлетворённость работников."
 AST_R56_total_economic_control:0 "Полный контроль над экономикой"
 AST_R56_total_economic_control_desc:0 "Полная национализация экономики, означающая переход всех частных предприятий под контроль правительства, безусловно, является радикальной политикой. Она может вызвать сильное общественное возмущение, но нельзя отрицать, что это способно увеличить производство и помочь восстановлению после депрессии."
 AST_R56_nationalisation_of_the_banks:0 "Национализация банков"
 AST_R56_nationalisation_of_the_banks_desc:0 "Следующим логичным шагом станет национализация банков. Она может обеспечить большую экономическую безопасность, но способна вызвать крайнее общественное возмущение."
 AST_R56_nationalise_healthcare:0 "Национализировать здравоохранение"
 AST_R56_nationalise_healthcare_desc:0 "Здоровое население — счастливое и продуктивное население. Создав национальную службу здравоохранения, мы добьёмся того, чтобы никому больше не приходилось выбирать между едой и визитом к врачу."
 AST_R56_society_reorganised:0 "Общество реорганизовано"
 AST_R56_society_reorganised_desc:0 "[AST.GetNameDefCap] теперь стала маяком коммунистических идеалов, которым ей всегда суждено было быть. Несмотря на принесённые жертвы, общество полностью перестроено на марксистских принципах. Пусть наши дети вспоминают этот момент с гордостью."
 AST_R56_appeal_to_the_labour_dissidents:0 "Обратиться к лейбористским диссидентам"
 AST_R56_appeal_to_the_labour_dissidents_desc:0 "Многие в Лейбористской партии остаются убеждёнными антикоммунистами и вытесняют всех, кто сильнее привержен социалистическому делу. Мы должны обратиться к разочарованным нынешним курсом лейбористского правительства и привлечь их на нашу сторону."
 AST_R56_militarise_the_workers_defence_corps:0 "Вооружить Рабочий корпус обороны"
 AST_R56_militarise_the_workers_defence_corps_desc:0 "После нескольких громких случаев кражи оружия и взрывчатки Рабочему корпусу обороны приказали действовать исключительно в рамках закона. Это было ошибкой."
 AST_R56_the_workers_revolution:0 "Рабочая революция"
 AST_R56_the_workers_revolution_desc:0 "Что толку в революции, если она не даёт власть тем, ради кого совершается?"
 AST_R56_end_to_colonialism:0 "Положить конец колониализму"
 AST_R56_end_to_colonialism_desc:0 "Австралия больше никогда не будет колонией иностранной капиталистической монархии. [AST.GetNameDef] навсегда останется землёй свободных."
 AST_R56_support_communist_china:0 "Поддержать [PRC.GetAdjective] коммунистов"
 AST_R56_support_communist_china_desc:0 "[PRC.GetAdjective] коммунисты давно борются против диктатуры Чан Кайши. Поскольку полномасштабная война близка, мы должны поддержать [PRC.GetAdjective] товарищей в трудный час."
 AST_R56_support_vietnam:0 "Поддержать Вьетнам"
 AST_R56_support_vietnam_desc:0 "Во Вьетнаме растёт движение за независимость. Хо Ши Мин и его Вьетминь накапливают силы, готовясь восстать против колониальных угнетателей. Мы должны ускорить этот процесс."
