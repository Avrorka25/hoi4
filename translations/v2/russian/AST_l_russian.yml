 AST_R56_the_dismissal:0 "Отставка"
 AST_R56_the_dismissal_desc:0 "Генерал-губернатор может отправить в отставку действующего премьер-министра и его правительство. При достаточной поддержке он вовсе не обязан назначать им замену."
