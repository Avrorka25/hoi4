 AST_R56_empire_air_training_scheme:0 "Имперская программа подготовки лётчиков"
 AST_R56_empire_air_training_scheme_desc:0 "Королевские ВВС, одни из старейших в мире, способны предоставить Королевским австралийским ВВС подготовку и опыт мирового уровня. Расширяя участие в программе, мы воспользуемся этой возможностью."
