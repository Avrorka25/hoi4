 AST_R56_australia_first:0 "«Австралия прежде всего»"
 AST_R56_australia_first_desc:0 "Движение «Австралия прежде всего», выросшее из Рационалистической ассоциации Нового Южного Уэльса и Социалистической партии Виктории, было основано Перси Стивенсеном как антивоенное, антиколониальное и изоляционистское движение."
 AST_R56_remember_eureka:0 "Помнить об Эврике"
 AST_R56_remember_eureka_desc:0 ""
 AST_R56_never_another_gallipoli:0 "Никогда больше Галлиполи"
 AST_R56_never_another_gallipoli_desc:0 ""
 AST_R56_advance_australia_fair:0 "Вперёд, прекрасная Австралия"
 AST_R56_advance_australia_fair_desc:0 ""
 AST_R56_the_writers_revolution:0 "Революция писателей"
 AST_R56_the_writers_revolution_desc:0 "Различные писатели, включая Ксавье Герберта, Майлз Франклин и Элеонор Дарк, поддерживали движение с момента его основания. Мы должны принять эту идею и поощрять интеллектуализм."
 AST_R56_rationalist_education:0 "Рационалистическое образование"
 AST_R56_rationalist_education_desc:0 "Нельзя забывать наши рационалистические корни. Продвигая рационалистическую мысль и образование, мы поможем обеспечить будущее [AST.GetNameDef]."
 AST_R56_inderpendant_asia_movement:0 "Поддержать движение за независимую Азию"
 AST_R56_inderpendant_asia_movement_desc:0 ""
 AST_R56_australian_national_socalism:0 "[AST.GetAdjective] национал-социализм"
 AST_R56_australian_national_socalism_desc:0 "Национал-социалистические идеалы [GER.GetNameDef] служат прекрасным примером того, как [AST.GetNameDef] может стать маяком цивилизации в южной части Тихого океана."
 AST_R56_a_corporate_state:0 "Корпоративное государство"
 AST_R56_a_corporate_state_desc:0 "Нас поддерживают различные промышленники и предприниматели. С их помощью мы превратим [AST.GetNameDef] в национал-социалистическое корпоративное государство."
 AST_R56_encourage_the_arms_industralists:0 "Поощрять оружейных промышленников"
 AST_R56_encourage_the_arms_industralists_desc:0 "[AST.GetNameDefCap]Неоперившаяся оружейная промышленность — это то, чем мы должны гордиться. Литгоу станет всемирно известным именем наряду с Браунингом и Маузером."
 AST_R56_australias_natural_wealth:0 "Природные богатства Австралии"
 AST_R56_australias_natural_wealth_desc:0 ""
 AST_R56_support_the_coal_industry:0 "Поддержать угольную промышленность"
 AST_R56_support_the_coal_industry_desc:0 ""
 AST_R56_australiam_isolationism:0 "[AST.GetAdjective] изоляционизм"
 AST_R56_australiam_isolationism_desc:0 ""
 AST_R56_true_autarky:0 "[AST.GetAdjective] автаркия"
 AST_R56_true_autarky_desc:0 ""
 AST_R56_young_australian_league:0 "Молодая [AST.GetAdjective] лига"
 AST_R56_young_australian_league_desc:0 "Молодое поколение — наше будущее, и его необходимо правильно воспитывать. Следует направить наблюдателей в [GER.GetNameDef] и [JAP.GetNameDef], чтобы изучить, как там прививают молодёжи патриотические ценности, и применить эти уроки дома."
 AST_R56_control_the_abc:0 "Взять ABC под контроль"
 AST_R56_control_the_abc_desc:0 "Австралийская радиовещательная корпорация — государственное информационное агентство [AST.GetNameDef]. Мы должны добиться, чтобы она передавала только просветительские и правильные материалы и не распространяла про-[ENG.GetAdjective] ложь."
 AST_R56_japanese_cooportation:0 "[JAP.GetAdjective] сотрудничество"
 AST_R56_japanese_cooportation_desc:0 "[JAP.GetNameDef] — могущественная страна и лучший пример того, чего народы Тихого океана способны добиться без коррумпированного европейского вмешательства. Мы поддержим её стремление создать Сферу сопроцветания."
 AST_R56_southern_axis:0 "Южная ось"
 AST_R56_southern_axis_desc:0 "Несмотря на расстояние, [GER.GetNameDef] является нашим естественным другом и союзником. Мы станем её южной осью."
 AST_R56_south_pacific_independent_research_fund:0 "Южнотихоокеанский исследовательский фонд"
 AST_R56_south_pacific_independent_research_fund_desc:0 "Мы должны помочь друзьям в Азии превратить южную часть Тихого океана в настоящий маяк науки и образования."
 AST_R56_seize_the_seventh_state:0 "Захватить седьмой штат"
 AST_R56_seize_the_seventh_state_desc:0 "Новая Зеландия всегда занимала место в [AST.GetAdjective] конституции как наш седьмой штат, но продолжает провозглашать независимость. Если она не прислушается к разуму, мы заставим её."
 AST_R56_war_beyond_the_seas:0 "К войнам за морями"
 AST_R56_war_beyond_the_seas_desc:0 "Невозможно вечно держать конфликт на расстоянии. Ради прочного мира мы все должны отправиться на войну."
 AST_R56_work_fight_or_be_destroyed:0 "Сражайся, работай или будешь уничтожен"
 AST_R56_work_fight_or_be_destroyed_desc:0 ""
 AST_R56_third_time_lucky:0 "Бог любит троицу"
 AST_R56_third_time_lucky_desc:0 "Центристская партия распалась в 1935 году из-за падения поддержки. Похоже, [AST.GetAdjective] народ так и не нашёл общего языка с Эриком Кэмпбеллом. Но ему пора выйти из затворничества, восстановить партию и попробовать ещё раз. В конце концов, с третьего раза повезёт."
 AST_R56_reestablish_the_new_guard:0 "Восстановить Новую гвардию"
 AST_R56_reestablish_the_new_guard_desc:0 "Вдохновлённая европейскими фашистскими военизированными организациями, Новая гвардия привлекла в начале 1930-х множество ветеранов Великой войны. Но, как и Центристская партия, она потеряла членов и была распущена после выборов 1935 года. Теперь, когда австралийцы наконец приняли идеи Эрика Кэмпбелла, Новая гвардия должна стать той организацией, которой всегда предназначалось быть."
