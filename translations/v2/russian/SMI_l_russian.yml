 SMI_sideline_the_council_desc:0 "Бесполезность вечно препирающегося совета становится очевиднее с каждым днём. Фашизм означает сплочение вокруг видения лидера, чтобы проводить национальный курс ясно и решительно."
 SMI_ideological_consensus:0 "Идеологический консенсус"
 SMI_ideological_consensus_desc:0 "Контроль партии над советом стал почти полным: голоса оппозиции с каждым днём звучат всё тише либо подавляются изнутри партии. Это позволяет избегать долгих и унизительных дебатов так называемых парламентских «демократий»."
