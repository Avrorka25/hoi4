 FRA_r56rp_claim_rhineland_desc:0 ""
 FRA_r56rp_protection_benelaux:0 "Никогда больше Шлиффен"
 FRA_r56rp_protection_benelaux_desc:0 ""
 FRA_r56rp_protection_benelaux.tt:0 "Мы предоставим гарантии всем некоммунистических государствам в Бенело. Если они откажутся, у нас не будет иного выбора, кроме как обеспечить наш фланг силой оружия. Мы не будем вести переговоры с коммунистами."
 FRA_r56rp_war_germany:0 "Предварительная забастовка"
 FRA_r56rp_war_germany_desc:0 ""
 FRA_r56rp_anti_german:0 "Антигерманские стратегии"
 fra_expanisonism_category:0 "Достижение Франции в Европе"
 fra_expanisonism_category_desc:0 "В то время как реваншизм Франции ослабел в годы после Компьенского перемирия, наше влияние в Европе слабо по сравнению с нашими днями в качестве главной сухопутной державы Западной Европы. В свое время, возможно, наши законные земли будут возвращены, и Париж снова станет защитником ценностей, на которых стоит наша страна. Виве ла Франс!"
 fra_core_wll:0 "Реинтегрировать Валлонию"
 fra_core_wll_desc:0 "Долго-бельгийский регион Валлония имеет сильные культурные и исторические связи, а также лингвистическую связь с французским метропом. Несмотря на это, бельгийцы обладают сильной гражданской идентичностью, враждебностью к иностранному вмешательству и большим немецкоязычным меньшинством. На завершение интеграции во французский метроп потребуется время, но мы считаем, что это возможно."
 fra_core_lux:0 "Реинтегрировать Люксембург"
 fra_core_lux_desc:0 "Город-государство Люксембург много раз обменивался рукопожатием на протяжении всей истории, в первую очередь из-за его близости к множеству европейских держав. Несмотря на то, что он зарекомендовал себя как сильная личность, большая часть его населения говорит по-французски. На завершение интеграции во французский метроп потребуется время, но мы считаем, что это возможно."
 fra_core_jura_mountains:0 "Женев, объединяйся с Парижем!"
 fra_core_jura_mountains_desc:0 "Хотя Франция и не является неотъемлемой частью Франции на протяжении всей ее истории, почти все западная Швейцария — франкоязычная страна, этот факт мы можем использовать для оправдания интеграции во французский метроп. Несмотря на то, что швейцарцы зарекомендовали себя как сильные личности, мы считаем, что возможна интеграция."
 fra_core_western_swiss_alps:0 "Сион, объединяйся с Парижем!"
 fra_core_western_swiss_alps_desc:0 "Подавляющее большинство столичного района Сиона — франкоязычный, что мы можем использовать для оправдания интеграции во французский метрополитен. В то время как швейцарцы утвердили свою сильную идентичность, и несколько этнических меньшинств живут в окрестностях, мы считаем, что возможная интеграция возможна."
 fra_core_cataluna:0 "Предоставляет каталонской автономии"
 fra_core_cataluna_desc:0 "Хотя Каталония никогда не была неотъемлемой частью Французской империи, она была важным холдингом. Более того, каталонцы много раз на протяжении всей истории обращались к французам за защитой. Мы можем использовать этот факт для интеграции Каталонии с уровнем автономии, который испанцы не смогли предоставить."
 fra_cat_autonomy:0 "Каталонский автономный район"
 fra_core_other_catalan_territories:0 "Интеграция Валенсии и Балаерских островов"
 fra_push_germany_east:0 "Подтолкнуть Германию на Восток"
 fra_push_germany_east_desc:0 "Одним из положений Версальского договора была демилитаризация немецкого региона Рейнланд, которая была нарушена правительством в Берлине. Из-за невыполнения своих обязательств Рейнская область должна вернуться под контроль Франции."
 fra_push_italy_east:0 "Толкай Италию на восток"
 fra_push_italy_east_desc:0 "Первая французская империя имела полный контроль над Итало-Пенинсульским регионом Пьемонта. Хотя мы изначально признали это изменение границ, ситуация явно изменилась. В результате Италия должна быть отодвинута на восток."
 FRA_AFR:0 "Французская Западная Африка"
 FRA_MAFR:0 "Французская Экваториальная Африка"
 FRA_SAFR:0 "Французская Южная Африка"
 FRA_EAFR:0 "Французская Восточная Африка"
 FRA_MEA:0 "Французский Ближний Восток"
 FRA_AFR_colonies_tt:0 "Мы реорганизуем французские владения в Африке в единые колониальные администрации, чтобы облегчить процесс перехода к свободным и независимым нациям."
 r56rp_FRA_transitional_goverment:0 "Самоуправление"
 r56rp_FRA_transitional_goverment_desc:0 "С французским предложением о самоуправлении для его предметных государств начался переходный период."
 r56rp_france.1.t:0 "Разрядка с Германией"
 r56rp_france.1.d:0 "Осознавая ситуацию, в которой мы оказались, и политическую нестабильность нашей собственной страны, жизненно важно, чтобы мы выровняли Германию на свою сторону и поддерживали мир. Мы должны предложить решения для улучшения наших напряженных отношений."
 r56rp_france.1.a:0 "Предложить выплаты за военные репарации"
 r56rp_france.1.b:0 "Ремилитаризация Рейнской области"
 r56rp_france.2.t:0 "Договор с Германией"
 r56rp_france.2.d:0 "Таковы наши предложения к [GER.GetName] Будем надеяться, что они довольны результатами этих переговоров."
 r56rp_france.2.a:0 "Предложите короткое, но тяжелое погашение военных репараций."
 r56rp_france.2.b:0 "Предложите легкое, но долгое погашение военных репараций."
 r56rp_france.2.c:0 "Вернемся к работе с этими предложениями."
 r56rp_france.3.t:0 "Дипломатические переговоры"
 r56rp_france.3.d:0 "С напряженными отношениями между нашими двумя народами французы предложили нам вернуть нашу землю, взамен мы подпишем пакт о ненападении между нашими двумя странами в надежде на поддержание мира и стабильности на Западе."
 r56rp_france.3.a:0 "Ну, конечно же, мы принимаем!"
 r56rp_france.3.b:0 "Никогда! Французские собаки не предлагают ничего стоящего. Больше никаких переговоров не будет!"
 r56rp_france.4.t:0 "[FRA.GetName] Предложение тяжелая оплата"
 r56rp_france.4.d:0 "Французы предложили высокую цену за поддержание мира и снижение стресса на наших и без того напряженных отношениях. С нашей уже восстанавливающейся экономикой они предложили забыть о платежах по Версальскому договору, которые мы обязаны выплатить за «Великую войну» и отплатить нам!"
 r56rp_france.4.a:0 "Хмм.. Это будет выгодно нашей экономике, примите предложение!"
 r56rp_france.4.b:0 "У нас другие планы! Мы больше не будем беспокоиться об этих «репарациях»!"
 r56rp_france.5.t:0 "[FRA.GetName] Оплата Light Payment"
 r56rp_france.5.d:0 "Французы предложили нам долгую, но небольшую компенсацию за наши уже выплаченные военные репарации и их оккупацию Рейнской области в надежде обеспечить дружбу и восстановить и без того напряженные отношения между нашими народами."
 r56rp_france.5.a:0 "Это предложение будет выгодно для нашей экономики! Примите предложение!"
 r56rp_france.5.b:0 "Французские собаки? Привлекаешься к нам, чтобы завязать дружбу? Никогда!"
 r56rp_france.6.t:0 "The [GER.GetName] Они прислали свой ответ!"
 r56rp_france.6.d:0 "С нашими дипломатами в Берлине и успешными переговорами мы успокоили немцев."
 r56rp_france.6.a:0 "Да! Мы живём, чтобы сражаться в другой день!"
 r56rp_france.7.t:0 "Дипломатов выгнали с конференции"
 r56rp_france.7.d:0 "С нашим предложением на столе немецкие дипломаты отреагировали, смеясь над нашими дипломатами, прямо перед тем, как швырнуть в них клевету: Это не способ для дипломатов действовать! Мы будем осуждать действия [GER.GetName] Публично!"
 r56rp_france.7.a:0 "Безумие! Мы поделимся этим со всем миром!"
 r56rp_france.8.t:0 "Франция предлагает защиту Германии"
 r56rp_france.8.d:0 "К нам обратились французские дипломаты.[FRA.GetLeader] Он готов предложить защиту от «немецкой угрозы», как выразились французские дипломаты. Взамен они просят только, чтобы их армии были размещены вдоль немецкой границы, чтобы они могли быстро реагировать на любые попытки вторжения."
 r56rp_france.8.a:0 "Немцы непредсказуемы. Мы должны принять."
 r56rp_france.8.b:0 "Такая сделка только еще больше разозлит немцев."
 rp_versaille_payment_1:0 "Быстрое погашение военных репараций"
 rp_versaille_payment_2:0 "Медленное погашение военных репараций"
 r56rp_FRA_anti_german:0 "Антигерманские стратегии"
