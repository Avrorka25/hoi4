 usa_focus:0 "Национальный фокус США"
 USA_issue_war_bonds:0 "Выпуск военных облигаций"
 USA_issue_war_bonds_desc:0 "С помощью военных облигаций мы полагаемся на поддержку народа военными усилиями и патриотизмом для финансирования военных расходов."
 USA_office_of_strategic_services:0 "Управление стратегических служб"
 USA_wartime_industry:0 "Промышленность военного времени"
 USA_wartime_industry_desc:0 "У нас сильная промышленность, но не вся она хорошо приспособлена для производства военных материалов. Поиск эффективных процессов для содействия этим изменениям будет иметь ключевое значение для использования наших ресурсов."
 USA_first_special_service_force:0 "Первое подразделение специального назначения"
 USA_first_special_service_force_desc:0 "Операции за линией фронта противника на неприветливой территории будут частью любого глобального конфликта. Формирование подразделений коммандос для выполнения этих функций имеет важное значение для нашей будущей войны."
 USA_rubber_reserve_company:0 "Компания резервов каучука"
 USA_rubber_reserve_company_desc:0 "С началом войны мы потеряли почти все наши источники импортного каучука.\n\nС огромными скоординированными усилиями, каучуковые компании в Соединенных Штатах могут сотрудничать, чтобы найти лучшие способы производства синтетического каучука, возможно, даже удовлетворяя требованиям военных усилий."
 USA_manifest_destiny:0 "Манифестная судьба"
 USA_manifest_destiny_desc:0 "Особые обстоятельства, связанные с основанием и историей нашей страны, дают нам мандат действовать против несправедливости и угнетения в любой точке мира. Для создания безопасного международного сообщества нашим основным экспортом должна быть свобода."
 USA_manifest_destiny_tt:0 "§YДает боевые цели против всех фашистских и коммунистических наций.§!\n"
 USA_scientist_haven:0 "Убежище для учёных"
 USA_scientist_haven_desc:0 "Заявив о себе как о хранителях свободы в мире, мы можем приветствовать исследователей и интеллектуалов, изгнанных из репрессивных режимов за рубежом, давая им шанс преуспеть и помочь нашему делу в стране возможностей."
 USA_wpa:0 "WPA"
 USA_wpa_desc:0 "Миллионы людей по-прежнему страдают от безработицы, вызванной Великой депрессией. Агентство, которое может заставить этих людей работать над общественными проектами, может не решить проблему в полной мере, но Администрация прогресса работы - это шаг в правильном направлении."
 USA_committee_on_technocracy:0 "Комитет по технократии"
 USA_committee_on_technocracy_desc:0 "Мы должны заменить ряд политиков и бизнесменов учеными и инженерами. У них есть техническая экспертиза для управления экономикой, и мы увидим большой научный прогресс, который приведет к тому, что наша экономика снова будет процветать."
 USA_support_rock_island:0 "Поддержка Rock Island"
 USA_support_rock_island_desc:0 "Поддержка наших отважных войск любым способом является ключом к победе. Будь то ведение огня тяжелой артиллерии с расстояния или более прямой поддержки на поле боя. Мы должны убедиться, что наши войска имеют все необходимое."
 USA_military_construction:0 "Военное строительство"
 USA_military_construction_desc:0 "С супердержавами, угрожающими миру во всем мире, наши проекты общественных работ должны быть направлены на военные и гражданские вопросы."
 USA_USACE_projects:0 "Проекты USACE"
 USA_USACE_projects_desc:0 "Инженерный корпус армии США будет поставлен перед задачей заложить фундамент для многих будущих военных проектов, подобных которым мир никогда не видел. Эссейоны!"
 USA_arsenal_of_democracy:0 "Арсенал демократии"
 USA_arsenal_of_democracy_desc:0 "Независимо от того, хотим мы вмешаться в войну напрямую или нет, демократические страны должны знать, что мы будем вооружать и поддерживать их."
 USA_liberty_ships:0 "Корабли Свободы"
 USA_liberty_ships_desc:0 "Массовое производство грузовых судов должно сопровождать наши промышленные разработки, чтобы наши материалы и войска доходили до театров, где они необходимы."
 USA_war_propaganda:0 "Военная пропаганда"
 USA_war_propaganda_desc:0 "Наш народ не хочет посылать своих детей умирать на другой войне, но многие политики видят необходимость в вмешательстве. Пропаганда демонизации врага и призывы к открытому конфликту могут быть не только инструментом для тиранов."
 USA_war_plan_black:0 "План войны черный"
 USA_war_plan_black_desc:0 "Очевидно, что политика и экспансионизм Германии выходят далеко за рамки здравого смысла. Они должны быть остановлены до того, как их военная машина достигнет точки невозврата."
 USA_embargo_germany:0 "Посадить Германию"
 USA_embargo_germany_desc:0 "Германия зависит от нефти и других природных ресурсов для своих военных усилий. Отказ от их доступа к ним - это самое малое, что мы можем сделать."
 USA_destroyers_for_bases:0 "Разрушители для баз"
 USA_destroyers_for_bases_desc:0 "Великобритания нуждается в кораблях, и мы должны защитить нашу родную территорию. За право создания военных баз на нынешних британских территориях мы можем обменяться некоторыми Разрушителями, которые, надеюсь, будут также использованы."
 USA_destroyers_for_bases_tt:0 "§Y[USA.GetNameDef]§!: \n"
 USA_war_plan_white:0 "План войны Белый"
 USA_war_plan_white_desc:1 "The [GetSovietThreatName] Нельзя допустить, чтобы угроза беспрепятственно распространялась. Извне или изнутри, нет большей угрозы для нашей страны и мира в целом."
 USA_embargo_USSR:0 "Эмбарго СССР"
 USA_embargo_USSR_desc:0 "Лишение Советского Союза торговых возможностей с нами не позволит нам помочь их военным усилиям и доказать, что наша экономическая модель превосходит наши возможности."
 USA_war_plan_red:0 "Красный план войны"
 USA_war_plan_red_desc:0 "После того, как мы оказались на пути к уважению людей, наши старые угнетатели теперь расходятся с ветрами перемен, которые мы приняли. Британская империя показывает свои истинные цвета. Мы должны дать им знать, где мы находимся."
 USA_embargo_the_empire:0 "Эмбарго Империи"
 USA_embargo_the_empire_desc:0 "Несмотря на то, что у них были хорошие отношения в течение длительного времени, британцы предали идеалы, которые, как мы надеялись, они научились оправдывать. Пришло время сообщить им о последствиях."
 USA_war_plan_orange:0 "Военный план Оранжевый"
 USA_war_plan_orange_desc:0 "Для нас нет большей угрозы, чем империалистические амбиции Японии. Их усилия по расширению в Азию и Тихий океан быстро поставят их в противоречие с нашими интересами."
 USA_embargo_japan:0 "Посадка Японии"
 USA_embargo_japan_desc:0 "Мы должны показать Японии, что их агрессия не будет принята или поддержана США. Эмбарго станет первым шагом к тому, чтобы сорвать их планы на Тихом океане."
 USA_prepare_intervention:0 "Подготовить вмешательство"
 USA_prepare_intervention_desc:0 "Благодаря дипломатическим и торговым решениям наша позиция на международной арене перешла от нейтральной и изоляционистской к позиции по иностранным агрессиям. Наша военная политика будет отражать это в будущем."
 USA_extra_tech_team:0 "Дополнительная техническая команда"
 USA_manhattan_project:0 "Манхэттенский проект"
 USA_manhattan_project_desc:0 "Разработка замещающих материалов, невинно звучащий проект USACE, в конечном итоге будет известен как Манхэттенский проект. Одно из самых засекреченных и опасных начинаний в военной истории, его цель — создание первой атомной бомбы."
 USA_unholy_alliance:0 "Нечестивый союз"
 USA_unholy_alliance_desc:0 "Иногда нам приходится выбирать себе врагов. Зачастую выбор нелегкий. Будущее может судить нас за то, что мы стоим бок о бок с одним тираном, или хвалить нас за спасение его от другого."
 USA_unholy_alliance_tt:1 "Повысить мнение и торговое мнение с [SOV.GetNameDef] или Германии, если они находятся в состоянии войны, на стороне защитника."
 USA_limited_intervention:0 "Ограниченное вмешательство"
 USA_limited_intervention_desc:0 "Потребуется чрезвычайная агрессия, чтобы втянуть нас в войну в полную силу, но после недавних событий многие люди свободно готовы помогать в конфликтах за рубежом."
 USA_the_giant_wakes:0 "Гигант пробуждается"
 USA_the_giant_wakes_desc:0 "Народы обращаются к нам, чтобы защитить ценности демократии и свободы. Мира, в котором родилась неинтервенционистская Америка, больше не существует, и мы должны соответствующим образом адаптироваться."
 USA_pearl_harbor_gambit:0 "Перл-Харбор Гамбит"
 USA_pearl_harbor_gambit_desc:0 "Военно-морская база в Перл-Харборе является легкой мишенью для японцев. Размещая там флот, мы продемонстрируем нашу мощь в Тихом океане. Осмелятся ли они бросить вызов такому смелому шагу?"
 USA_pearl_harbor_gambit_tt:0 "§YПока идет фокусировка, у Японии будет возможность начать атаку.§!"
 USA_cancel_pearl_harbor_gambit:0 "Отменить Перл-Харбор Гамбит"
 USA_cancel_pearl_harbor_gambit_desc:0 "Размещение флота в Перл-Харборе ставит под угрозу жизнь наших моряков. Мы не будем рисковать ими, чтобы спровоцировать войну с Японией."
 USA_air_war_plans_division:0 "Дивизия военно-воздушных планов"
 USA_air_war_plans_division_desc:0 "Для того, чтобы сделать правильные приоритеты в авиации, а также в авиастроении, потребуется долгосрочное планирование. AWPD обеспечит нас материально-техническими средствами, организацией и стратегическими планами."
 USA_air_support:0 "Воздушная поддержка"
 USA_air_support_desc:0 "Воздушная война должна использоваться в первую очередь совместно с другими военными операциями."
 USA_strategic_bombing:0 "Стратегическая бомбардировка"
 USA_strategic_bombing_desc:0 "Способность выполнять точные бомбардировки позволит нам остановить военную машину любой страны на ее пути."
 USA_TAC:0 "Развитие тактических бомбардировщиков"
 USA_TAC_desc:0 "Строительство самолетов, построенных для атаки тактических целей, позволит нашим войскам продвигаться более безопасно."
 USA_combined_bomber_offensive:0 "Комбинированное наступление бомбардировщиков"
 USA_combined_bomber_offensive_desc:0 "С другой великой державой на нашей стороне у нас есть неожиданные преимущества в исследовании и применении крупномасштабных наступательных бомбардировок."
 USA_fund_the_navy:0 "Финансирование военно-морского флота"
 USA_fund_the_navy_desc:0 "Мы должны уметь приспосабливаться к тому, что бросают в нас наши враги. Увеличение финансирования военно-морских учений приведет к более эффективному военно-морскому флоту, который может тактически превзойти наших врагов."
 USA_bureau_of_ships:0 "Бюро судов"
 USA_bureau_of_ships_desc:1 "Мы объединим Бюро строительства и ремонта и Инженерное бюро в одно подразделение для наблюдения за будущими военно-морскими разработками. Возможно, пришло время расследовать слухи о неэффективной работе торпед, которые Бюро боеприпасов так яростно отрицает."
 USA_battleship_primacy:0 "Приоритет линкоров"
 USA_battleship_primacy_desc:0 "С денонсацией Японией Вашингтонского морского договора мы можем столкнуться с очередной гонкой вооружений в океанах. Мы гарантируем, что у нас будут как самые лучшие, так и самые лучшие линкоры."
 USA_advanced_mahanian_doctrine:0 "Продвинутая маханистическая доктрина"
 USA_advanced_mahanian_doctrine_desc:0 "Влияние Альфреда Тайера Махана на военно-морскую войну трудно недооценить. Опираясь на его работу, мы сможем эффективно использовать линкоры, что он считал решающим фактором."
 USA_carrier_primacy:0 "Приоритет авианосцев"
 USA_carrier_primacy_desc:0 "В грядущих сражениях потребуется авиация, а самый практичный способ расширить её радиус действия — использовать авианосцы. Мы должны создавать более совершенные и специализированные модели."
 USA_bureau_of_aeronautics:0 "Бюро аэронавтики"
 USA_bureau_of_aeronautics_desc:0 "Для удовлетворения потребностей в развитии морской авиации необходимо будет расширить Бюро воздухоплавания, которое десятилетиями отвечало за эти вопросы."
 USA_escort_effort:0 "Усилия по сопровождению"
 USA_escort_effort_desc:0 "Подводные лодки представляют опасность для наших торговых конвоев. Сосредоточение внимания на разработке новых моделей эсминцев позволит нам эффективно вести противолодочную войну."
 USA_convoy_tactics:0 "Тактика конвоев"
 USA_convoy_tactics_desc:0 "Защита наших торговых судов — это не только эскорт и эффективная разведка, но и тактический выбор в том, как организовать наши торговые маршруты и процедуры."
 USA_amphibious_operations:0 "Десантные операции"
 USA_amphibious_operations_desc:0 "Если наши худшие кошмары не сбудутся, эта война не закончится на американской земле. Хорошо выполненные посадки должны стать частью пути к победе."
 USA_expand_the_USMC:0 "Расширение USMC"
 USA_expand_the_USMC_desc:0 "Корпус морской пехоты США был решающей силой во многих прошлых войнах и может быть более актуальным, чем когда-либо для наших десантных кампаний. Semper fidelis!"
 USA_reinforce_monroe_doctrine:0 "Подтвердить доктрину Монро"
 USA_reinforce_monroe_doctrine_desc:0 "Доктрина Монро, датируемая более 100 лет назад, кодифицировала вмешательство США в случае европейских попыток колонизировать Америку, но держаться подальше от европейских дел. Укрепление нашей роли миротворцев на этих континентах повысит наше влияние в регионе."
 USA_carribean_sphere:0 "Карибская сфера"
 USA_carribean_sphere_desc:0 "Карибские острова являются идеальным местом для нанесения ударов по нашему восточному побережью или Панамскому каналу, поэтому, конечно, мы должны дать понять, что никакие враждебные захваты этого района не будут разрешены."
 USA_central_america:0 "Центральная Америка"
 USA_central_america_desc:0 "Было бы немыслимо позволить какой-либо иностранной державе взять под контроль Панамский канал или даже угрожать ему. Таким образом, мы гарантируем независимость всех центральноамериканских стран."
 USA_the_neighbors:0 "Соседи"
 USA_the_neighbors_desc:0 "Мы должны прежде всего следить за безопасностью ближайших к нам стран. Вместо того, чтобы враг пересекал наших соседей, чтобы добраться до нас, они будут пересекать нас, если они пересекают наших соседей."
 USA_south_america:0 "Южная Америка"
 USA_south_america_desc:0 "Колониальные империи никогда больше не смогут расширяться в Южную Америку, мы обеспечим независимость наших южных братьев, чтобы они были в безопасности."
 USA_pax_americana:0 "Пакс Американа"
 USA_pax_americana_desc:0 "Мир в Америке должен быть сохранен. У нас есть силы, чтобы мелкие дрязги между соседней нацией не обострились. Война у наших порогов — это именно то, чего хотят наши враги, и мы должны сделать все возможное, чтобы предотвратить ее."
 USA_pax_americana_tt:0 "@USA §YСоединенные Штаты§! Может вмешаться в войны между американскими странами"
 USA_black_chamber:0 "Черная камера / Black Chamber"
 USA_black_chamber_complete:0 "§RКЛАССИФИРОВАННЫЙ§!"
 USA_black_chamber_desc:0 "У нас есть информация о политической деятельности в ряде американских стран, которая не соответствует нашим интересам. К счастью, мы создали подпольную пропагандистскую сеть и готовы подтолкнуть эти страны в нашем направлении. Это то, что мы должны сделать, чтобы не оказаться под угрозой у себя дома."
 USA_preemptive_intervention:0 "Упреждающее вмешательство"
 USA_preemptive_intervention_desc:0 "Мы больше не можем сидеть сложа руки и смотреть, как соседние страны создают инструмент войны, предназначенный для подавления нас или наших союзников. Мы должны вмешаться во благо нашей могущественной страны и всего мира."
 construction_tech_bonus:0 "Премия за технологии строительства"
 air_sup_bonus:0 "Доктрина превосходства в воздухе бонус"
 op_dest_bonus:0 "Доктрины оперативного уничтожения бонус"
 bomber_bonus:0 "Бомбардировщики бонус"
