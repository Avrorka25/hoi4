 SOV_nkvd_upgrade_tooltip:1 "§YНКВД§! Теперь она более тесно интегрирована в нашу армию, обеспечивая высокий боевой дух и веру в партию.\n"
 ger_sov_buddies_tooltip_2:0 "\nЭто позволит распустить §H[Root.GetFactionName]§! и создавать §Hинформатор§!.\n"
 ger_sov_buddies_tooltip_3:0 "\nЭто позволит создать §Hинформатор§!.\n"
 ger_sov_buddies_tooltip:2 "§RЕсли [SOV.GetAdjective]Принимая наше предложение, мы понесем некоторую потерю стабильности из-за этого изменения политики. Излишне говорить, что наши фашисты и демократические державы также будут огорчены этим поворотом событий.§!\n"
