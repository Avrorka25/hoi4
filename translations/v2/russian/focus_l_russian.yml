l_russian:
 WHILE_FOCUSING:0 "Сосредоточив внимание на этом, мы получим следующие эффекты:\n$EFF$"
 generic_focus:0 "Национальный фокус"
 army_effort:0 "Развитие армии"
 army_effort_desc:0 "Несмотря на растущие возможности воздушной и морской войны, наземные бои по-прежнему играют ключевую роль в будущих войнах. При подготовке мы можем избежать повторения ада траншей."
 equipment_effort:0 "Усилия по оборудованию"
 equipment_effort_desc:0 "Ограничения на то, какое снаряжение может нести пехота, постоянно проталкиваются. Мы сосредоточимся на предоставлении нашим войскам наилучших доступных инструментов."
 motorization_effort:0 "Усилия по моторизации"
 motorization_effort_desc:0 "Мобильность и защита имеют решающее значение для безопасного попадания пехоты в поле боя и выхода из него. Сосредоточение внимания на этих событиях позволит нам быстро принять меры."
 doctrine_effort:0 "Развитие доктрины"
 doctrine_effort_desc:0 "Военные доктрины, которые определяли наземные бои в Великой войне, устарели. Мы должны направить наши величайшие умы на формирование военной мысли завтрашнего дня."
 equipment_effort_2:0 "Развитие снаряжения II"
 equipment_effort_2_desc:0 "Мы продолжим наши усилия по обеспечению наших пехотных и вспомогательных войск наилучшей техникой нашего времени."
 mechanization_effort:0 "Развитие механизации"
 mechanization_effort_desc:0 "Переосмыслив возможности моторизованной пехоты, мы можем раздвинуть границы того, какие машины могут быть построены сегодня."
 doctrine_effort_2:0 "Развитие доктрины II"
 doctrine_effort_2_desc:0 "Поле битвы изменилось не только в межвоенные годы, но и в ходе недавних конфликтов. Мы должны постоянно пересматривать наши доктрины, чтобы отразить это."
 equipment_effort_3:0 "Развитие снаряжения III"
 equipment_effort_3_desc:0 "Вместо того, чтобы подражать или покупать иностранную технику, мы должны стремиться стать мировым лидером в области пехотного оружия."
 armor_effort:0 "Развитие бронетехники"
 armor_effort_desc:0 "Используя то, что мы узнали от механизации нашей пехоты, мы также можем улучшить нашу бронетехнику."
 special_forces:0 "Спецназ"
 special_forces_desc:0 "Нам нужны элитные силы. Горные войска и десантники должны быть нашим приоритетом."
 aviation_effort:0 "Авиационные усилия"
 aviation_effort_tt:0 "Недостаточно строительных слотов для §YАвиабаза§!"
 aviation_effort_desc:0 "Нигде технологический прогресс не происходит быстрее, чем в воздушной войне. Авиация — это поле, которым должна овладеть любая современная нация."
 fighter_focus:0 "Фокус бойца"
 fighter_focus_desc:0 "Мы не видели этой последней битвы в Великой войне. Продолжение разработки истребителей даст нам преимущество в будущем."
 bomber_focus:0 "Бомбардировщик Focus"
 bomber_focus_desc:0 "Когда люди будущего будут говорить об ужасах сегодняшних войн, огонь, дождливый с неба, будет заметно выделяться. Мы сделаем все возможное, чтобы эти истории были рассказаны нашими врагами."
 aviation_effort_2:0 "Авиационные усилия II"
 aviation_effort_2_desc:0 "Дальнейшие успехи в авиации будут необходимы для интеграции наших ВВС с другими военными подразделениями."
 CAS_effort:0 "Развитие штурмовой авиации"
 CAS_effort_desc:0 "Современная армия нуждается в поддержке со стороны транспортных средств не только на земле, но и в воздухе."
 rocket_effort:0 "Развитие ракетной техники"
 rocket_effort_desc:0 "Ракетные и реактивные двигатели обеспечивают беспрецедентные скорости для беспилотных и пилотируемых судов. Новаторство этих технологий позволит нам застать врага врасплох."
 NAV_effort:0 "Развитие морской авиации"
 NAV_effort_desc:0 "Подобно тому, как новая морская война происходит частично под поверхностью воды, часть ее происходит в воздухе над водами."
 naval_effort:0 "Развитие флота"
 naval_effort_tt:0 "Недостаточно строительных слотов для §YМорские верфи§!"
 naval_effort_desc:0 "Расширение нашего флота должно быть нашим главным приоритетом. Назначьте все доступные ресурсы для новых верфей и исследований легких надводных кораблей."
 GER_naval_effort2:0 "Расширение объектов верфи"
 GER_naval_effort2_desc:0 "Чтобы действительно восстановить флот, достойный внимания, мы должны значительно расширить наши судостроительные мощности."
 GER_naval_effort2_tt:0 "строить §Y2 Морские верфи§! в §Y2§! Прибрежные государства, контролируемые в настоящее время §Y[ROOT.GetFlag][ROOT.GetNameDef]§!"
 flexible_navy:0 "Гибкий флот"
 flexible_navy_desc:0 "Переосмысление военно-морской войны с учетом достижений в подводной технике позволит нам эффективно наносить удары по вражеским конвоям."
 large_navy:0 "Большой флот"
 large_navy_desc:0 "Адаптация наших военно-морских доктрин для размещения больших кораблей и обеспечение безопасности наших торговых конвоев многое нам научат о том, какие корабли нам нужны."
 submarine_effort:0 "Подводные усилия"
 submarine_effort_desc:0 "Подводная война является самым захватывающим военно-морским развитием со времен изобретения торпедного катера. Мы не только защитим от подводных лодок, но и используем их против вражеского судоходства."
 cruiser_effort:0 "Развитие крейсеров"
 cruiser_effort_desc:0 "Перед тем, как совершить набеги на передовые исследования линкоров, меньшие крейсеры нуждаются в замене."
 destroyer_effort:0 "Развитие эсминцев"
 destroyer_effort_desc:0 "Изучая проектирование и стратегическое использование подводных лодок, мы также узнали, как противостоять этим стратегиям. Разрушители будут иметь решающее значение для этого."
 capital_ships_effort:0 "Развитие крупных кораблей"
 capital_ships_effort_desc:0 "Нация с наибольшим количеством линкоров будет править океанами. Боевые корабли и авианосцы представляют старое и новое в военно-морском превосходстве."
 industrial_effort:0 "Промышленные усилия"
 industrial_effort_desc:0 "Сосредоточьте все наши политические усилия на построении гражданской промышленности в большом скачке вперед."
 industrial_effort_2:0 "Промышленные усилия II"
 industrial_effort_2_desc:0 "С железной волей и неустанной трудовой этикой мы можем мобилизовать людей в еще одном великом промышленном усилии."
 construction_effort:0 "Развитие строительства"
 construction_effort_tt:0 "Недостаточно строительных слотов для §YГражданские заводы§!"
 construction_effort_desc:0 "Нельзя недооценивать гражданский промышленный потенциал, даже когда над миром нависает война."
 production_effort:0 "Усилия по вооружению"
 production_effort_tt:0 "Недостаточно строительных слотов для §YВоенная фабрика§!"
 production_effort_desc:0 "Если вы можете построить тракторы, вы можете построить танки. Мы не должны допустить отставания наших военных производственных мощностей."
 construction_effort_2:0 "Развитие строительства II"
 construction_effort_2_desc:0 "Продолжение расширения наших заводов позволит нам ускорить производство товаров для торговли и дальнейшие строительные работы."
 production_effort_2:0 "Усилия по вооружению II"
 production_effort_2_desc:0 "Приспосабливать гражданские фабрики для выпуска военного снаряжения неэффективно. Нам следует уже сейчас сосредоточиться на подготовке военного производства."
 production_effort_3:0 "Усилия по вооружению III"
 production_effort_3_desc:0 "Непрерывные усилия по расширению наших военных заводов необходимы для удовлетворения потребностей в новой технике."
 infrastructure_effort:0 "Развитие инфраструктуры"
 infrastructure_effort_desc:0 "Страна без надлежащей инфраструктуры не может заниматься передовыми проектами или строительством."
 infrastructure_effort_tt:0 "Недостаточно строительных слотов для §Yинфраструктура§!"
 synth_oil_effort_tt:0 "Недостаточно строительных слотов для §YСинтетический нефтеперерабатывающий завод§!"
 infrastructure_effort_2:0 "Инфраструктурные усилия II"
 infrastructure_effort_2_desc:0 "Расширение нашей инфраструктуры позволит обеспечить транспортировку и связь, необходимые для высокотехнологичных секретных проектов."
 construction_effort_3:0 "Строительные работы III"
 construction_effort_3_desc:0 "Расширение нашей инфраструктурной сети значительно улучшило наши возможности для строительства."
 nuclear_effort:0 "Ядерные усилия"
 nuclear_effort_desc:0 "Стоя на краю открытия, изменяющего мир, мы не можем позволить другим зажечь огонь, который однажды может поглотить Землю."
 extra_tech_slot:0 "Дополнительная ячейка исследований"
 extra_tech_slot_desc:0 "Наша промышленная экспансия и другие недавние достижения могут позволить нам проводить больше исследований и разработок параллельно."
 extra_tech_slot_2:0 "Дополнительная ячейка исследований II"
 extra_tech_slot_2_desc:0 "Быстрая индустриализация нашей страны открыла новые возможности в области НИОКР, которые мы должны использовать."
 technology_sharing:0 "Обмен технологиями"
 technology_sharing_desc:0 "Делясь технологическими достижениями с нашими союзниками, вся наша фракция сможет более эффективно проводить исследования и разработки военного времени."
 secret_weapons:0 "Секретное оружие"
 secret_weapons_desc:0 "Соблазнительно направить все дополнительные ресурсы на танки и самолёты, но секрет победы в войнах лежит в совершенно новых областях науки: электронике, ракетной технике и ядерных исследованиях."
 political_effort:0 "Политические усилия"
 political_effort_desc:0 "Чтобы добиться перемен в мире, мы должны быть в состоянии добиться изменений в нашей собственной стране. Укрепление нашей политической позиции должно быть на первом месте."
 collectivist_ethos:0 "Коллективистский дух"
 collectivist_ethos_desc:0 "Наши враги могут разделять и завоевывать меньшие нации, но наш народ будет един. Все для одного и один для всех."
 liberty_ethos:0 "Дух свободы"
 liberty_ethos_desc:0 "В это время идеологических фанатиков, стремящихся задушить человеческий дух, мы будем защищать индивидуальные свободы и свободу."
 militarism:0 "Милитаризм"
 militarism_desc:0 "Те, кто считает армию необходимым злом, обречены колебаться перед лицом войны. Мы будем внедрять милитаризм в нашу культуру, чтобы стать народом солдат."
 political_correctness:0 "Политкорректность"
 political_correctness_desc:0 "Люди, придерживающиеся слегка спорных или иным образом смущающих мнений, по-видимому, обеспокоены тем, что против них существует широкомасштабный заговор. Это кажется отличной идеей."
 neutrality_focus:0 "Фокус нейтральности"
 neutrality_focus_desc:0 "В то время как другие могут утверждать, что для того, чтобы принять сторону в глобальном конфликте, требуется мужество и мудрость, мы знаем, что для отказа требуется больше."
 interventionism_focus:0 "Фокус интервенционизма"
 interventionism_focus_desc:0 "Мы ценим свободу всех людей, а не только наших собственных граждан. Если предотвращение тирании означает войну, то так тому и быть."
 military_youth:0 "Военная молодежь"
 military_youth_desc:0 "Организации по содействию дисциплине и политическому воспитанию молодежи в нашей стране будут способствовать лояльности и самопожертвованию на раннем этапе."
 deterrence:0 "Сдерживание"
 deterrence_desc:0 "В одиночку мы редко выигрываем от войны. К счастью, мы знаем, что лучшая защита — это та, которую вы никогда не должны использовать."
 volunteer_corps:0 "Добровольческий корпус"
 volunteer_corps_desc:0 "Принуждение нашего народа к смерти за идеалы свободы было бы иронией, но создание средств для тех, кто хочет помочь людям за рубежом, — это не так."
 paramilitarism:0 "Парамилитаризм"
 paramilitarism_desc:0 "Военные принципы имеют применение вне военных. С развитием полумилитаризованных подразделений в дополнение к нашим вооруженным силам больше людей будут проходить военную подготовку."
 indoctrination_focus:0 "индоктринация"
 indoctrination_focus_desc:0 "Установив нашу идеологию как основанную на истине, ее можно учить как истину. Образование и средства массовой информации должны отражать этот урок."
 foreign_expeditions:0 "Зарубежные экспедиции"
 foreign_expeditions_desc:0 "Поскольку наши враги готовы вмешаться в отдаленные конфликты во имя своих идеалов, мы должны быть готовы сделать то же самое для наших."
 why_we_fight:0 "Почему мы воюем"
 why_we_fight_effect:0 "Если у нас не будет §YНейтральная внешняя политика§! Мы сможем создавать фракции.\n"
 why_we_fight_desc:0 "Мир становится всё опаснее. Наш народ должен увидеть зверства, совершаемые теми, кто жаждет власти. Настало время сплотить людей вокруг нашего дела и убедиться, что каждый готов сражаться за нашу свободу."
 political_commissars:0 "Политические комиссары"
 political_commissars_desc:0 "Для того, чтобы наша политика осуществлялась в военной практике, мы введем в воинские звания политически назначенных должностных лиц."
 internationalism_focus:0 "Фокус интернационализма"
 internationalism_focus_desc:0 "Идеология не знает границ. Другая нация может называть себя суверенной, но наши убеждения выше таких притязаний."
 nationalism_focus:0 "Фокус на национализм"
 nationalism_focus_desc:0 "Наша страна уникальна, и наши политические достижения могли произойти только здесь. Мы должны бороться за него любой ценой."
 ideological_fanaticism:0 "Идеологический фанатизм"
 ideological_fanaticism_desc:0 "Наши политически устоявшиеся ценности и цели стоят того, чтобы умереть за них так же, как и за любую древнюю веру. Любой последователь должен быть готов встретить смерть, а те, кто отклоняется, лучше подготовиться к смерти."
 air_innovation:0 "Воздушные инновации"
 air_innovation_desc:0 "Современные войны не могут быть выиграны без господства над небом. Мы должны сделать все, что в наших силах, для развития ВВС!"
 air_innovation_2:0 "Авиационные инновации II"
 air_innovation_2_desc:0 "Любое преимущество в воздухе бесценно. Следует сосредоточить все усилия на развитии истребителей."
 naval_air_effort:0 "Морские воздушные усилия"
 naval_air_effort_desc:0 "Эффективность авиаударов по морским целям была продемонстрирована американцами уже в 1921 году. Мы не должны пренебрегать этой ветвью ВВС, если мы намерены вести войну с военно-морской державой."
 german_focus:0 "Немецкий национальный фокус"
 GER_autobahn:0 "Рейхсаутобан"
 GER_autobahn_tt:0 "Добавить максимум §Yинфраструктура§! в §YБранденбург§!, §YГанновер§!, §YТюринген§! и §YФранкен§!"
 GER_autobahn_desc:2 "С момента своего основания в 1933 году, [GetAutobahnName] Проект имел славный успех. Строительные работы снизили безработицу, а широкие дороги стали памятником [GER.GetName]Экономическое восстановление. Однако предстоит еще много работы."
 GER_west_wall:0 "Вестфалл"
 GER_west_wall_desc:0 "Западная стена проходит параллельно хваленой французской линии Мажино, занимая большую часть той же земли, что и линия Зигфрида в предыдущем Вельткриге. Укрепление ее обороны позволит нам удерживать границу с меньшим количеством людей, освобождая дивизии для участия в любых потенциальных восточных кампаниях."
 GER_west_wall_tt:0 "§RЕсли Рейнская область ремилитаризована, вы также получите:§!\n"
 GER_west_wall_forts:0 "Добавить §Y12 Земельных фортов§! на французской границе.\n"
 GER_west_wall_forts_small:0 "Добавить §Y6 Земельные форты§! на французской границе.\n"
 GER_tactical_air_effort:0 "Тактические воздушные усилия"
 GER_tactical_air_effort_desc:0 "Победа будет достигнута путем уничтожения сухопутных войск противника. Мы должны сосредоточиться на поддержке наших собственных армий тактическими ударами по близким и глубоким целям."
 GER_long_range_escorts:0 "Длинные эскорты"
 GER_long_range_escorts_desc:0 "Наши тактические и стратегические бомбардировщики нуждаются в сопровождении на большие расстояния, чтобы обеспечить защиту на всем пути к цели и обратно."
 GER_strategic_air_effort:0 "Стратегические воздушные усилия"
 GER_strategic_air_effort_desc:0 "Победа будет достигнута за счет уничтожения вражеских производств. Мы должны сосредоточить наши усилия на проектировании и производстве стратегических бомбардировщиков."
 GER_army_innovation:0 "Армейские нововведения"
 GER_army_innovation_desc:1 "Хайнц Гудериан и другие радикальные теоретики настаивают на смелых новых доктринах, подчеркивающих связь, идентификацию «шверпанкте» и локальную концентрацию объединенных вооруженных сил. Предоставление им свободных поводков может помочь избежать ужасов Великой войны."
 GER_soviet_treaty:1 "Договор с [GER.GetTheUSSRName]"
 GER_soviet_treaty_desc:1 "Мы можем заключить новый исследовательский договор с [SOV.GetNameDef] Для того, чтобы развивать, в основном, лучшие танки. Если они согласятся, мы можем вновь открыть танковую школу, закрытую в Каме в 1933 году.[SOV.GetAdjective] Сотрудничество, конечно, будет означать, что они тоже выиграют от нововведений, которые были сделаны в рамках проекта."
 GER_air_innovation_2:0 "Авиационные инновации II"
 GER_air_innovation_2_desc:0 "Задачи министерства авиации рейха имеют первостепенное значение. Люфтваффе должны быть самыми передовыми военно-воздушными силами в мире!"
 GER_army_innovation_2:0 "Армейские инновации II"
 GER_army_innovation_2_desc:0 "Уроки, извлеченные на наших объектах в СССР, позволят нам и дальше совершенствовать наши доктрины и технику. Однако на этот раз мы сохраним авансы для себя!"
 GER_rocketry_focus:0 "Ракетная техника"
 GER_rocketry_focus_desc:0 "Ракетная двигательная установка является ключом к массовым инновациям во всех трех военных отраслях."
 GER_wunderwaffe:0 "Вундерваффе"
 GER_wunderwaffe_desc:0 "Гейзенберг и фон Браун пытаются исследовать некоторые идеи, которые у них есть для настоящего оружия Судного дня. Все, что им нужно, это дополнительные ресурсы."
 GER_mol_rib_pact:1 "[GER.GetMolotovRibbentropName]"
 GER_mol_rib_pact_desc:1 "Договор о дружбе и ненападении с [GER.GetTheUSSRName] Может перевернуть желудок, но это позволит их драгоценному маслу продолжать поступать в Германию. Тайное дополнение разделит территории Румынии, Польши, Литвы, Латвии, Эстонии и Финляндии на [GER.GetAdjective] и [SOV.GetAdjective] Сферы влияния..."
 GER_mol_rib_pact_tt:1 "Войди в один §Yпакт о ненападении§! с §YСоветский Союз§! и соглашаться на §YПольша разделила Польшу§! между [SOV.GetName] и Германии\n"
 SOV_MOLOTOV_RIBBENTROP_NAME_COMMUNIST:0 "пакт Молотова-Риббентропа"
 SOV_MOLOTOV_RIBBENTROP_NAME_EXILES:0 "Пакт о разделе Польши"
 GER_soviet_ally:1 "союз с [GER.GetTheUSSRName]"
 GER_soviet_ally_desc:1 "Возможно, мы можем отложить в сторону нашу [GER.GetUSSRAllianceDesc] Различия между ними [GER.GetRussiansDemonym] Вместо этого подчеркните то, что нас объединяет: ненависть к эгоистичному либерализму и упадочный Запад. с [GER.GetTheUSSRName] Как союзник, у нас был бы доступ ко всем ресурсам, которые нам нужны — помимо их военной мощи, конечно..."
 SOV_USSR_ALLIANCE_DESC_COMMUNIST:0 "идеологический"
 SOV_USSR_ALLIANCE_DESC_EXILES:0 "националист"
 GER_turkey_puppet:0 "марионеточная Турция"
 GER_turkey_puppet_desc:0 "Турция попала в порок между нами и Советским Союзом. При давлении турки, скорее всего, подчинятся нашей воле и станут марионеточным государством. В рамках сделки СССР получит некоторую территорию в восточной Турции. Но если они отвергнут наши требования, это будет означать войну."
 GER_rhineland:0 "Рейнланд"
 GER_rhineland_desc:0 "Рейнская область была демилитаризована после окончания Великой войны, но это оскорбление больше не будет стоять! Германия является суверенной страной и может свободно перемещать войска в любом месте в пределах своих границ."
 GER_rhineland_ultimatum:0 "§RРемилитаризация может быть обращена вспять, если вы столкнетесь и отступите.§!\n"
 GER_japan_friend:0 "Подружиться с Японией"
 GER_japan_friend_desc:0 "У нас давно были плодотворные отношения с Китаем, но нашим амбициям может быть лучше, если они будут соответствовать нашей родственной культуре воинов Японии, даже если это означает бросить Китай волкам."
 GER_japan_friend_tt:0 "Вспомнил фон Фалькенхаузена.\n"
 GER_china_friend:0 "Подружиться с Китаем"
 GER_china_friend_desc:0 "Давайте углубим нашу давнюю дружбу с Китаем. Это оттолкнет Японию, но что такое Япония, если не только Италия Востока?"
 GER_anti_comintern_pact:0 "Антикоминтерновский пакт"
 GER_anti_comintern_pact_desc:0 "Вмешательство Коммунистического Интернационала во внутренние дела наций не только ставит под угрозу их внутренний мир и социальное благополучие, но и является угрозой для мира во всем мире! Мы попросим многие некоммунистические страны подписать пакт и убедиться, что мы держим красную угрозу под контролем."
 GER_anti_soviet_pact:0 "Анти-[SOV.GetAdjective] Пакт"
 GER_anti_soviet_pact_desc:0 "Мы можем сделать еще один шаг вперед по Антикоминтерновскому пакту и попросить всех его членов взять на себя обязательство создать коалицию против Советского Союза. Если кто-либо из подписавших Конвенцию окажется в состоянии войны с СССР, все остальные члены должны также объявить войну."
 GER_anti_soviet_pact_tt:0 "§YПредлагает всем членам Антикоминтерновского пакта вступить в оборонительный союз против Советского Союза.§!"
 GER_anti_soviet_pact_tt_2:0 "§Y Оборонительный союз призовёт участников к войне, если один из них подвергнется нападению Коминтерна§!"
 GER_anti_soviet_pact_tt_3:0 "Обретение национального духа §YАнтисоветский пакт§!.\n"
 GER_ussr_war_goal:1 "Война с [GER.GetTheUSSRName]"
 GER_ussr_war_goal_desc:0 "Мы можем сосредоточить наши пропагандистские усилия на подготовке [GER.GetAdjective]ого народа - и всего мира - к праведной войне против [SOV.GetNameDef]."
 GER_anschluss_eq_trigger_tt:0 "Более §Y40000§! единиц пехотного снаряжения в армии"
 GER_demand_memel:0 "Восстановление восточных претензий"
 GER_demand_memel_desc:0 "Великая война привела к потере значительной части немецкой территории на Востоке с возрождением Польши и передачей Мемеля Литве. Ультиматум должен быть направлен обеим странам, но Польша, по крайней мере, не склонится перед простыми словами."
 GER_demand_memel_threat:0 "Германия подтвердила претензии на восток"
 GER_danzig_or_war:0 "Данциг или война"
 GER_danzig_or_war_POL_faction_GER_leader:0 "§R[This.GetName] должен одобрить соглашение о вступлении бонусов в силу. Они уйдут. [Root.GetFactionName] Если будет объявлена война.§!\n"
 GER_danzig_or_war_POL_faction_GER_noleader:0 "§R[This.GetName] должен одобрить соглашение о вступлении бонусов в силу. Ты уйдешь [Root.GetFactionName] фракции, если будет объявлена война.§!\n"
 GER_danzig_or_war_desc:0 "Данциг был немцем, Данциг остался немцем, и Данциг будет немцем отныне! Если Польша не уступит территорию, мы должны подготовить немецкий народ к неизбежной войне. Данциг и прилегающие земли вернутся в Германию!"
 GER_czech_friend:0 "Подружиться с Чехословакией"
 GER_czech_friend_desc:0 "Чехи и словаки — трудолюбивые и достойные восхищения народы. К сожалению, наши территориальные амбиции сталкиваются с их, но не слишком поздно стремиться к дружбе, а не к подчинению."
 GER_demand_sudetenland:0 "Спрос на Судеты"
 GER_demand_sudetenland_desc:0 "Судьба судетских немцев была одной из самых страшных несправедливостей Версальского договора. Они должны быть под нашей защитой, независимо от чешских возражений."
 GER_demand_sudetenland_threat:0 "Германия потребовала Судетскую область"
 GER_first_vienna_award:0 "Первый Венский арбитраж"
 GER_first_vienna_award_desc:0 "Венгры были одним из тех, кто пострадал больше всего после Великой войны. Во время резни Австро-Венгерской империи многие венгры были застряли на чужой земле, хотя их предки жили там веками. Мы могли бы значительно улучшить наши отношения с Венгрией, награждая их некоторыми территориями из Чехословакии."
 GER_end_of_czechoslovakia:0 "Судьба Чехословакии"
 GER_end_of_czechoslovakia_desc:0 "Пришло время разделить старые чешские земли между теми, кто может ими правильно управлять. Мы также должны рассмотреть вопрос о создании отдельного словацкого марионеточного государства на востоке."
 GER_second_vienna_award:0 "Вторая Венская премия"
 GER_second_vienna_award_desc:0 "Трансильвания имеет венгерское большинство и по праву должна принадлежать нашим друзьям в Венгрии. Однако трудно сказать, как отреагирует на это требование румынский режим и народ."
 GER_italy_ally:0 "Альянс с Италией"
 GER_italy_ally_desc:0 "Итальянцы могут быть ненадежными, как они доказали в Великой войне, но Муссолини и его фашистское движение показали, что надежда на Италию еще есть. Конечно, Германия только выиграет от союза с Италией, не так ли?"
 GER_nationalist_spain_ally:0 "Альянс с Испанией"
 GER_nationalist_spain_ally_desc:0 "Победа националистов в гражданской войне в Испании проложила путь к более тесным отношениям между нашими странами. Франко держит ключ от Средиземноморья."
 GER_nationalist_spain_ally_tt:0 "Укрепление дипломатических отношений с §YНационалистическая Испания§!"
 GER_danzig_vs_slovakia:0 "Данциг для Словакии"
 GER_danzig_vs_slovakia_desc:0 "Поляки стоят на пути наших планов по Лебенсрауму. Тем не менее, еще не поздно изменить наши долгосрочные приоритеты и вместо этого искать их дружбу. Единственный возможный путь к этому — торговля территориями. Данциг для Словакии. Польша уже проявила некоторый интерес к региону, оккупировав Заольцзе."
 GER_poland_friend:0 "Подружиться с Польшей"
 GER_poland_friend_desc:0 "Хотя Польша больше не имеет выхода к морю, мы доказали свои благие намерения, предоставив им Словакию. Возможно, мы сможем приблизить их к нам, дав туманные обещания будущих территориальных завоеваний на востоке."
 GER_war_with_france:0 "Война с Францией"
 GER_war_with_france_desc:0 "Теперь, когда Германия нашла удовлетворительное решение вопроса о своей восточной границе, настало время обратить наше внимание на запад. Потеря Эльзаса-Лотарингии — это пятно на чести немецкого народа, и только справедливой и праведной войной мы можем отомстить за это."
 GER_war_with_france_threat:0 "Претензии на территории Франции"
 GER_operation_tannenbaum:0 "Операция «Танненбаум»"
 GER_operation_tannenbaum_desc:0 "Швейцария обладает самым отвратительным и жалким народом и политической системой. Теперь у нас наконец-то есть время, чтобы увидеть этих смертельных врагов новой Германии."
 GER_reintegrate_luxemburg_and_alsace_lorraine:0 "Реинтеграция Люксембурга и Эльзаса-Лотарингии"
 GER_reintegrate_luxemburg_and_alsace_lorraine_desc:0 "С нашим успешным завоеванием исторически немецких территорий мы можем теперь начать процесс их реинтеграции в Германию. [Root.GetName]. Их население должно иметь возможность выполнять свой патриотический долг перед Отечеством."
 GER_naval_rearmament:0 "Перевооружение флота"
 GER_naval_rearmament_desc:0 "Англо-германское военно-морское соглашение, заключенное в 1935 году, позволяет нам значительно расширить наш флот. Мы не должны жалеть усилий для этого."
 GER_plan_z:0 "План Z"
 GER_plan_z_desc:0 "Адмирал Редер считает, что британцев лучше всего победить с помощью политики наземных рейдов. Построение достаточного количества линкоров и носителей для этого будет огромной задачей, и займет время. Возможно, слишком много времени... С другой стороны, наш нынешний надводный флот патетически неадекватен."
 GER_u_boat_effort:0 "Усилия подводных лодок"
 GER_u_boat_effort_desc:0 "Коммодор Дёниц выступает за стратегию неограниченной подводной войны как лучший способ поставить Британию на колени. С достаточным количеством подводных лодок мы могли бы лишить британскую промышленность всех необходимых ресурсов из ее обширной империи."
 GER_modular_construction:0 "Модульная конструкция"
 GER_modular_construction_desc:0 "Благодаря тому, что части наших подводных лодок построены на различных строительных объектах, скорость сборки и строительства значительно улучшилась."
 GER_denmark_friend:0 "Подружиться с Данией"
 GER_denmark_friend_desc:0 "Дипломатия канонерских лодок еще не умерла. Наши планы расширения флота хорошо известны нашему маленькому северному соседу. В сочетании с их страхом перед нашими превосходящими армиями, им должно быть достаточно легко запугать их в нашу сферу влияния."
 GER_norway_friend:0 "Подружиться с Норвегией"
 GER_norway_friend_desc:0 "Норвегия контролирует большую часть экспорта драгоценного железа из обширных шахт на севере Швеции. Мы должны запугать их в дружбе с угрозой нашего расширяющегося флота."
 GER_dutch_friend:0 "Подружитесь с Нидерландами"
 GER_dutch_friend_desc:0 "Голландцы прекрасно знают, как долго они продлятся в случае очередной Великой войны. Если они могут быть убеждены в том, что Германия может серьезно угрожать самой Британии, возможно, они могут выбрать союз с нами, чтобы избежать жесткой оккупации."
 GER_sweden_friend:0 "Подружиться со Швецией"
 GER_sweden_friend_desc:0 "Скандинавские страны похожи на домино. Они стоят и падают вместе. С Норвегией и Данией в нашей сфере Швеция, безусловно, последует."
 GER_improve_national_spirit:0 "Улучшение национального духа"
 GER_improve_national_spirit_desc:0 "Столичные города победителей Великой войны в наших руках могут окончательно отбросить тень нашего поражения. Для Германии наступает новый век!"
 GER_improve_national_spirit_tooltip:0 "Мы или члены нашей фракции должны контролировать Лондон, Париж и штаты, в которых они проживают."
 needs_approval:0 "§R[This.GetName] должен одобрить соглашение о вступлении бонусов в силу.§!\n"
 GER_demand_slovenia:0 "Спрос на Словению"
 GER_demand_slovenia_threat:0 "Германия потребовала Словению"
 GER_demand_slovenia_desc:0 "В Сен-Жерменском договоре многие исторические австрийские территории перешли к государствам-преемникам. Теперь, когда Австрия вновь объединилась с Германией, пришло время положить конец этой несправедливости. Исторические провинции Карниола и Штирия, которые теперь известны как Словения, должны быть возвращены домой."
 GER_first_ljubljana_award:0 "Первая премия Любляны"
 GER_first_ljubljana_award_desc:0 "Лицемерные западные державы проповедовали национальное самоопределение, передавая множество меньшинств сербам. Мы в состоянии исправить эту историческую ошибку и завести друзей одновременно. Для тех, кто хочет встать на нашу сторону в европейском порядке, мы можем быть очень щедрыми."
 GER_first_ljubljana_award_tt:0 "Все оригинальные [YUG.GetAdjective] Основные государства принадлежат либо §Y[YUG.GetName]§! или любой из его субъектов.\n"
 GER_fate_of_yugoslavia:0 "Судьба Югославии"
 GER_fate_of_yugoslavia_desc:0 "Югославское государство всегда было искусственным сооружением, и центральная власть начала разрушаться. Мы должны вмешаться, чтобы восстановить порядок. Единственный вопрос, с которым мы сталкиваемся, это то, как лучше всего это сделать."
 GER_second_ljubljana_award:0 "Вторая премия Любляны"
 GER_second_ljubljana_award_tt:0 "Это дает возможность требовать землю для [Root.GetName] или достойным союзником."
 GER_second_ljubljana_award_desc:0 "С решением югославского вопроса пора обратить наше внимание на Грецию. Они также были несправедливо превзойдены союзниками. Пришло время узнать, кто наши друзья на самом деле."
 GER_war_with_greece:0 "Война с Грецией"
 GER_war_with_greece_desc:0 "Если Греция уже находится в состоянии войны, то Германии было бы стыдно пропустить базу в Восточном Средиземноморье."
 GER_fate_of_greece:0 "Судьба Греции"
 GER_fate_of_greece_desc:0 "Греция доказала, что не может справиться с новыми силами, навязанными Европе. Настало время предложить им защиту, которую может обеспечить только Германия."
 GER_weserubung:0 "Операция «Везерюбунг»"
 GER_weserubung_desc:0 "Норвегия является критически важным стратегическим пунктом и будет очевидной точкой атаки для любого врага, желающего нарушить нашу торговлю сталью со Швецией. Мы не можем рисковать нашими врагами, создавая базы в этом регионе. Чтобы получить хорошую плацдарм для вторжения в Норвегию, нам нужно сначала двигаться по Дании."
 GER_around_maginot:0 "Вокруг Мажино"
 GER_around_maginot_desc:0 "Если мы хотим обеспечить тактическое преимущество против Франции, мы должны быть в состоянии поразить их со всех сторон. Они не будут ожидать нападения со стороны Севера, откуда мы точно нанесем удар, как только избавимся от нескольких препятствий."
 italian_focus:0 "Итальянский национальный фокус"
 GER_danzig_or_war_POL_civil_war:0 "Взять Данцига в обмен на поддержку"
 GER_danzig_trigger_polish_civil_war:0 "Польша находится в состоянии гражданской войны, и одно из следующих событий должно быть правдой.\n      Германия направила добровольцев на поддержку одной из сторон\n      Одна из сторон находится во фракции с Германией."
 GER_alone_or_peace_faction_tt:0 "не является фракцией, или находится во фракции в мире с [GER.GetNameDef]."
 GER_four_year_plan:0 "Четырёхлетний план"
 GER_four_year_plan_desc:0 "Нам нужен амбициозный план по обеспечению перевооружения и конечной самодостаточности нации. Это должно быть достигнуто в течение следующих четырех лет."
 GER_atlantikwall:0 "Атлантикволл"
 GER_atlantikwall_desc:0 "Теперь, когда мы завоевали Западную Европу, мы должны закрепиться против возможного натиска со стороны Атлантического океана. Огромная сеть укреплений вдоль берегов Европы должна обеспечить нам достаточную защиту."
 atlantikwall_tooltip:1 "Место §YПрибрежные форты§! в каждом из следующих атлантических прибрежных государств, которые полностью контролируются Вами:\n"
 atlantikwall_tooltip_2:0 "§YАквитания§!\n§YПуату§!\n§YЛуара§!\n§YБретань§!\n§YНормандия§!\n§YПас-де-Кале§!\n§YВлаандерен§!\n§YГолландия§!\n§YФрисландия§!\n§YВезер-Эмс§!\n§YГанновер§!\n§YШлезвиг-Гольштейн§!\n§YЮтландия§!\n§YОстландет§!\n§YВестландет§!\n§YТронделаг§!\n§YНорд-Нордж§!\n"
 GER_ostwall:0 "Остволл"
 GER_ostwall_desc:0 "Несмотря на наши успехи на Востоке, мы должны быть уверены, что если отлив повернется, мы сможем удержать вражеское наступление. Мы должны построить линию укреплений, пантеро-ватанский ствол, вдоль реки Днепр, от Черного моря до Балтийского."
 GER_ostwall_forts:1 "Место §YЗемельные форты§! вдоль реки Днепр до Балтийского моря, в каждом из следующих государств, которые полностью контролируются вашей фракцией:\n"
 GER_ostwall_forts_2:0 "§YТарту§!\n§YПсков§!\n§YНевероятный§!\n§YВитебск§!\n§YМинск§!\n§YБобруйск§!\n§YМозырь§!\n§YКиев§!\n§YЧеркассы§!\n§YДнепропетровск§!\n§YЗапорожье§!\n"
 GER_ostwall_tt:0 "Под контролем члена нашей фракции.\n"
 GER_autarky:0 "Автаркия"
 GER_autarky_desc:0 "Чтобы Германия была действительно великой, она должна быть самодостаточной. Мы должны лучше использовать наши ресурсы и стать более эффективными в строительстве."
 GER_hermann_goring_werke:0 "[Root.GetHermannGoringWerkeName]"
 GER_hermann_goring_werke_desc:0 "Мы должны избавиться от непостоянного влияния капиталистов. Поэтому мы сформируем под нашим контролем промышленный конгломерат, который будет контролировать рост в горнодобывающей и сталелитейной отраслях, так как это станет основой нашей военной промышленности."
 GER_HERMANN_GORING_WERKE_NAME_FASCIST:0 "Герман Геринг-Верке"
 GER_HERMANN_GORING_WERKE_NAME_KAISER:0 "Кайзер-Верке"
 GER_HERMANN_GORING_WERKE_NAME_COMMIE:0 "ВЭБ Верейнигте Машиненверке"
 GER_HERMANN_GORING_WERKE_NAME:0 "Контролируемая государством промышленность"
 GER_kdf_wagen:0 "[Root.GetKdfWagenName]"
 GER_kdf_wagen_desc:0 "Мы позволим нашим гражданам приобрести свой будущий народный автомобиль через сберегательную схему, которую, в свою очередь, будем использовать для финансирования строительства заводов, которые в конечном итоге будут способствовать строительству этих автомобилей."
 GER_KDF_WAGEN_NAME:0 "KdF-Wagen"
 GER_KAISER_WAGEN_NAME:0 "Вильгельм-Ваген"
 GER_VOLKS_WAGEN_NAME:0 "Volkswagen"
 GER_coal_liquidization:0 "Сжижение угля"
 GER_coal_liquidization_desc:0 "Германии не хватает нефти, поэтому необходимо удвоить усилия в области синтетического топлива."
 GER_synthetic_rubber:0 "Синтетический каучук"
 GER_synthetic_rubber_desc:0 "Крупномасштабная моторизация и авиация требуют больших количеств резины, источников которой у нас нет. Мы должны улучшить то, как мы создаем его синтетически."
 GER_german_war_economy:0 "Немецкая военная экономика"
 GER_german_war_economy_desc:0 "Народ нашей великой нации должен быть использован на благо военных усилий. Мы перейдем к полномасштабной военной экономике, где каждый человек будет играть свою роль."
 GER_grosraumwirtschaft:0 "Компания Großraumwirtschaft"
 GER_grosraumwirtschaft_desc:0 "Мы должны подготовить Германию к ее судьбе в качестве центрального элемента Европы. Наша инфраструктура свяжет Запад с Востоком, а Юг с Севером."
 GER_align_hungary:0 "Выравнивание Венгрии"
 GER_align_hungary_desc:0 "Венгрия уже находится в сфере нашего влияния, но мы могли бы легко склонить их к нашему образу мышления, сделав их еще более легко управляемыми в будущем."
 GER_align_romania:0 "Подключить Румынию"
 GER_align_romania_desc:0 "Румыния уже находится в сфере нашего влияния, но мы могли бы легко склонить их к нашему образу мышления, делая их еще более легко управляемыми в будущем."
 GER_integrate_war_economies:0 "Интеграция военных экономик"
 GER_integrate_war_economies_desc:0 "Нации в нашей сфере влияния стали испытывать крайнюю экономическую зависимость от нас. Мы могли бы использовать это для усиления нашего контроля над их экономикой и нашего влияния на их внешнюю политику."
 GER_integrate_war_economies_tt:2 "Если §Y[HUN.GetName]§! находится во фракции с §Y[Root.GetName]§!добавь §Y4 Военный завод§! каждому §Y[Root.GetName]§! и §Y[HUN.GetName]§!и §Y[HUN.GetName]§! становится марионеткой §Y[Root.GetName]§!.\n"
 GER_integrate_war_economies_tt2:2 "Если §Y[ROM.GetName]§! находится во фракции с §Y[Root.GetName]§!добавь §Y4 Военный завод§! каждому §Y[Root.GetName]§! и §Y[ROM.GetName]§!и §Y[ROM.GetName]§! становится марионеткой §Y[Root.GetName]§!.\n"
 GER_integrate_war_economies_tt3:0 "§R[HUN.GetName] должен одобрить соглашение о вступлении бонусов в силу.§!\n"
 GER_integrate_war_economies_tt4:0 "§R[ROM.GetName] должен одобрить соглашение о вступлении бонусов в силу.§!\n"
 GER_uplift_the_rosenberg_office:0 "Поднять офис Розенберга"
 GER_uplift_the_rosenberg_office_desc:0 "Есть много вещей, которые должны быть должным образом скоординированы в пределах Рейха, включая управление и контроль оккупированных территорий, а также внутренний надзор и все интеллектуальное и идеологическое образование нацистской партии. Все эти вопросы должны решаться централизованно и контролироваться Управлением Розенберга, поскольку Розенберг является важным партийным теоретиком и идеологом."
 GER_reichskommissariats_tt:0 "Позволяет формировать подвластные государства на завоёванных территориях.\n"
 GER_oppose_hitler:0 "Противостоять Гитлеру"
 GER_oppose_hitler_desc:0 "Правление Гитлера должно закончиться. Он хочет спровоцировать западные державы, ремилитаризовав Рейнскую область, но это даст нам оправдание, необходимое для захвата власти с помощью лояльных элементов вермахта."
 GER_oppose_hitler_civil_war:0 "§RФашисты начнут гражданскую войну.§!\n"
 GER_secure_the_new_state:0 "Обезопасить новое государство"
 GER_secure_the_new_state_desc:0 "В свете сложившейся гражданской войны временному правительству не хватает сил. Мы должны обеспечить ее безопасность и не допустить ее легкого свержения."
 GER_clamp_down_on_fascism:0 "Уничтожить фашизм"
 GER_clamp_down_on_fascism_desc:0 "В последние несколько лет при нацистском режиме репрессивный, диктаторский и антироялистический характер правительства и их фашистских идеологов и сторонников стал слишком очевидным. Мы должны обеспечить, чтобы их образ мышления был искоренен везде, где он может поднять голову."
 GER_revive_the_kaiserreich:0 "Возродить кайзеррейх"
 GER_revive_the_kaiserreich_desc:0 "События последнего десятилетия показали, что демократия слишком слаба, чтобы сдерживать гнусные внутренние элементы. Мы должны вернуться к сильному руководству кайзера, и, готовясь к его возвращению, мы вернем конституцию к немецкой Кайзеррейх."
 GER_revive_the_kaiserreich_tt:0 "§YНемецкая военная хунта§! будут известны как §YГерманская империя§!.\n"
 GER_mackensen_dead:0 "Фон Маккенсен мертв."
 GER_rebuild_the_nation:0 "Восстановить страну"
 GER_rebuild_the_nation_desc:1 "После разрушительных последствий гражданской войны мы должны стремиться к восстановлению нашей страны. Мы попросим людей на время отложить в сторону свои личные удобства, чтобы мы могли сосредоточить все наши ресурсы на достижении этой цели."
 GER_fan_the_prussian_militarism:0 "Фан-прусский милитаризм"
 GER_fan_the_prussian_militarism_desc:0 "Чтобы заменить потери нашей гражданской войны, мы должны обратиться к прусскому чувству милитаризма, чтобы улучшить набор и подготовку новобранцев. То, что наши военные освободили нас от нацистской диктатуры, гарантирует, что эти прусские идеалы сейчас более популярны, чем когда-либо."
 GER_a_new_and_better_germany:0 "Новая и лучшая Германия"
 GER_a_new_and_better_germany_desc:0 "Пока мы восстанавливаем нашу страну, мы должны стремиться выйти за рамки того, что необходимо, чтобы то, что мы строим сейчас, выдержало испытание временем."
 GER_bulwark_against_bolshevism:1 "[GER.GetBulwarkName]"
 GER_bulwark_against_bolshevism_desc:1 "Наша страна выступает в качестве щита против [GER.GetBulwarkBolshevismDesc]Защита Запада от [GER.GetBulwarkCommunismDesc] влияние. Мы должны носить эту мантию с гордостью и при необходимости готовиться к использованию оружия."
 GER_bulwark_against_bolshevism_tt:1 "§RЭтот Национальный Дух будет потерян, если во фракции или в войне на одной стороне. [SOV.GetNameDef].§!\n"
 SOV_BULWARK_NAME_COMMUNIST:0 "Булварк против большевизма"
 SOV_BULWARK_NAME_FASCISM:0 "Крепость против фашизма"
 SOV_BULWARK_NAME_NEUTRALITY:0 "Редут против России"
 SOV_BULWARK_BOLSHEVISM_DESC_COMMUNIST:0 "большевизм"
 SOV_BULWARK_BOLSHEVISM_DESC_FASCISM:0 "фашизм"
 SOV_BULWARK_BOLSHEVISM_DESC_NEUTRALITY:0 "Российский империализм"
 SOV_BULWARK_COMMUNISM_DESC_COMMUNIST:0 "коммунизма"
 SOV_BULWARK_COMMUNISM_DESC_FASCISM:0 "фашизма"
 SOV_BULWARK_COMMUNISM_DESC_NEUTRALITY:0 "российский"
 GER_return_of_the_kaiser:0 "Возвращение кайзера"
 GER_return_of_the_kaiser_desc:0 "Кайзеррейху нужен кайзер, а Вильгельм II до сих пор живет, сосланный в Нидерланды. Мы снимем его изгнание и пригласим его вернуться на трон, несмотря на то, что могут подумать западные демократии."
 GER_focus_on_the_true_enemy:0 "Сосредоточьтесь на истинном враге"
 GER_focus_on_the_true_enemy_desc:0 "Не внутренне, а внешне можно найти наших врагов. Продолжающееся преступление западной колониальной монополии лишь омрачается несправедливостью Версальского договора, которому мы подверглись после того, как попытались занять свое место под солнцем. Теперь все кончено."
 GER_rebuild_the_high_seas_fleet:0 "Восстановление флота открытого моря"
 GER_rebuild_the_high_seas_fleet_desc:0 "Нам нужна программа массового наращивания военно-морского флота, чтобы восстановить наш некогда славный флот в открытом море, если мы когда-либо сможем успешно бросить вызов Западу."
 GER_our_place_in_the_sun:0 "Наше место под солнцем"
 GER_our_place_in_the_sun_desc:0 "Пусть все знают, что Германская империя еще раз заявляет о своем праве занять свое место под солнцем! Наш народ больше не будет унижен в тени."
 GER_pride_of_the_modern_germany:0 "Гордость современной Германии"
 GER_pride_of_the_modern_germany_desc:0 "Потребуется много лет, чтобы соответствовать размеру Королевского британского флота. Поэтому мы должны превзойти его по качеству. Наши корабли будут самыми современными и мощными, которые когда-либо плавали по морям!"
 GER_prepare_for_the_next_blockade:0 "Приготовьтесь к следующей блокаде"
 GER_prepare_for_the_next_blockade_desc:0 "Адская британская блокада стоила нам последней войны. Мы не повторим ту же ошибку. На этот раз мы пойдем еще дальше, чтобы подготовить население к тому, что должно произойти."
 GER_break_the_anglo_french_colonial_hegemony:0 "Разрушить англо-французскую колониальную гегемонию"
 GER_break_the_anglo_french_colonial_hegemony_desc:0 "Настало время разрушить монополию Запада на колониализм."
 flag_franco_british_union:0 "Франко-британский союз"
 GER_schlieffen_once_more:0 "Снова план Шлиффена"
 GER_schlieffen_once_more_desc:0 "Мажино надо обходить. Мы снова пройдем через Бельгию и Люксембург быстрым ударом к победе."
 GER_reinstate_imperial_possessions:0 "Восстановление имперских владений"
 GER_reinstate_imperial_possessions_desc:0 "С нашим успешным завоеванием исторически немецких областей мы можем теперь начать процесс их восстановления в Германии. [Root.GetName] Как полноценные провинции. Последний позор Версаля наконец-то снят!"
 GER_crossing_the_atlantic:0 "Пересекая Атлантику"
 GER_crossing_the_atlantic_desc:0 "Победив все континентальные противники нашего правления, мы должны переориентировать наши производственные усилия на создание огромного военно-морского флота, чтобы мы могли довести борьбу до англичан и американцев. Мы не успокоимся до тех пор, пока, в Божье благое время, Старый Свет, со всей его силой и мощью, не перейдет к порабощению и унижению нового."
 GER_crossing_the_atlantic_trigger_tt:0 "Нет: любая страна-враг: \n  Считается одной из крупнейших стран \n  Любое контролируемое государство:\n     Это в §YЕвропа§!"
 GER_crossing_the_atlantic_2_factories_tt:0 "Удалить §Y2 Военный завод§! от внутреннего государства для каждого прибрежного государства, которое получает эти верфи.\n"
 GER_crossing_the_atlantic_1_factory_tt:0 "Удалить §Y1 Военный завод§! от внутреннего государства для каждого прибрежного государства, которое получает эти верфи.\n"
 GER_the_central_powers:0 "Центральные державы"
 GER_the_central_powers_desc:0 "Нам нужны союзники, чтобы противостоять Западу. Мы создадим свою фракцию, чтобы противостоять угнетению демократий."
 GER_prepare_italian_coup:0 "Подготовьте итальянский переворот"
 GER_prepare_italian_coup_desc:0 "Падение Италии на фашизм должно быть отменено. Мы при нашей поддержке подойдем к итальянским роялистам с предложением о перевороте."
 GER_prepare_italian_coup_tt:0 "Если они принимают наше предложение:\n"
 GER_assassinate_mussolini:0 "Убийство Муссолини"
 GER_assassinate_mussolini_desc:0 "Настало время положить конец итальянскому фашизму. Немецкие руки убьют вождя, после чего итальянские роялисты одним быстрым движением захватят власть."
 GER_rekindle_imperial_sentiment:0 "Воспроизведение имперских чувств"
 GER_rekindle_imperial_sentiment_desc:0 "Хотя Австро-Венгерская империя была разрушена после Великой войны, все еще можно найти тех, кто оплакивает кончину империи. Мы будем культивировать эти имперские настроения в надежде, что государства-преемники решат воссоединиться ради собственной силы."
 GER_rekindle_imperial_sentiment_tt:0 "Когда поддержка неприсоединившихся государств достаточно высока, эти страны могут принять решение о реформировании Австро-Венгерской империи и присоединении к Центральным державам.\n"
 GER_expatriate_the_communists:0 "Экспатриация коммунистов"
 GER_expatriate_the_communists_desc:0 "Внутренняя угроза коммунизма продолжает преследовать нашу страну. Мы должны избавиться от него, куда бы ни бежали приверженцы."
 GER_accept_british_naval_dominance:0 "Признать британское морское господство"
 GER_accept_british_naval_dominance_desc:0 "Нам нужны союзники для борьбы с коммунизмом, а британцы - главный кандидат. Мы смягчим их опасения, приняв их военно-морское превосходство и отказавшись от любого обширного наращивания военно-морского флота в интересах улучшения отношений."
 GER_ally_the_shade:0 "Альянс с теней"
 GER_ally_the_shade_desc:0 "Если мы не сможем занять их место на солнце, то мы станем союзниками тех, кто отбрасывает тень на нас."
 GER_carte_blanche_for_alsace_and_french_colonies:0 "Карте Бланш для Эльзаса и французских колоний"
 GER_carte_blanche_for_alsace_and_french_colonies_desc:0 "Мы должны обратиться к нашему новому союзнику с просьбой разрешить нам свободное правление в восстановлении наших законных территорий Эльзас-Лотарингии и нашей справедливой доли африканских колоний."
 GER_bypass_maginot_in_the_south:0 "Обход Maginot на юге"
 GER_bypass_maginot_in_the_south_desc:0 "У британцев есть свои интересы в Низких странах, и поэтому мы должны искать альтернативные маршруты вокруг Мажино. Юг, хотя и гористый и труднопроходимый, должен быть достаточным. Немецкая изобретательность нас проведёт."
 GER_see_to_the_eastern_front:0 "Посмотреть Восточный фронт"
 GER_see_to_the_eastern_front_desc:0 "Если мы чему-то научились в Великой войне, так это тому, что мы должны готовиться к нападению на наши отдаленные восточные владения. Эти владения должны быть восстановлены и укреплены против вторжения."
 GER_see_to_the_eastern_front_tt:1 "Добавить 6 §YЗемельные форты§! 3 провинции на восточной границе.\n"
 GER_see_to_the_eastern_front_tt2:1 "Добавить 8 §YЗемельные форты§! 4 провинции на восточной границе.\n"
 GER_danzig_for_guarantees:0 "Данциг в обмен на гарантии"
 GER_danzig_for_guarantees_desc:2 "Поляки, несомненно, должны почувствовать опасность того, что [GER.GetDanzigGuaranteesBolsheviksDesc]. Возможно, мы могли бы прийти к соглашению о возвращении Данцига, Познани и Силезского воеводства в обмен на гарантии военной поддержки в случае вторжения. [GER.GetDanzigGuaranteesRedsDesc]."
 SOV_DANZIG_GUARANTEES_BOLSHEVIKS_DESC_COMMUNIST:0 "большевики"
 SOV_DANZIG_GUARANTEES_BOLSHEVIKS_DESC_FASCISM:0 "Фашисты на Востоке"
 SOV_DANZIG_GUARANTEES_BOLSHEVIKS_DESC_NEUTRALITY:0 "русские"
 SOV_DANZIG_GUARANTEES_REDS_DESC_COMMUNIST:0 "Красные оттенки"
 SOV_DANZIG_GUARANTEES_REDS_DESC_NEUTRALITY:0 "с востока"
 GER_safeguard_the_baltic:0 "Защита Балтики"
 GER_safeguard_the_baltic_desc:1 "Прибалтика была частью Российской империи до нескольких десятилетий назад, и это вполне логично. [GER.GetRussiansDemonym] Может быть, еще раз попытаемся их аннексировать. Мы должны предотвратить это и предложить нашу военную поддержку в случае, если это произойдет. [SOV.GetAdjective] Вторжение."
 GER_support_the_finns:0 "Поддержать финнов"
 GER_support_the_finns_desc:1 "Финны оказались на линии огня [GER.GetRussiansDemonym]. Мы предоставим им гарантию от коммунистической угрозы и скромную промышленную помощь."
 GER_anti_comintern_pact_unaligned:0 "Идеологическая защита"
 GER_anti_comintern_pact_unaligned_desc:0 "Военная угроза — не единственная опасность, которой мы подвергаемся. Мы должны искать пути, чтобы держать коммунизм в страхе, и с этой целью мы создадим пакт с нашими товарищами-некоммунистами, решив бороться с его продвижением."
 GER_anti_soviet_pact_unaligned:1 "Официально оформить договор"
 GER_anti_soviet_pact_unaligned_desc:1 "Мы должны подготовиться к военному конфликту с коммунизмом, пригласив всех подписавших антикоминтерновский пакт согласиться на дополнительный пункт, призывающий к военной поддержке против любой советской агрессии. Поскольку мы уже привержены друг другу во многих отношениях, это должно быть не более чем формализацией."
 GER_tackle_the_communist_threat:1 "Справляйся. [GER.GetTackleCommunistThreatName] Угроза"
 GER_tackle_the_communist_threat_desc:1 "До тех пор пока [SOV.GetNameDef] Он существует, он будет представлять для нас угрозу. Вместо того, чтобы ждать их удара, мы возьмем инициативу в свои руки."
 SOV_TACKLE_COMMUNIST_THREAT_NAME_COMMUNIST:0 "коммунистический"
 SOV_TACKLE_COMMUNIST_THREAT_NAME_EXILES:0 "Восточный"
 GER_the_iberian_problem:0 "Иберийская проблема"
 GER_the_iberian_problem_desc:0 "Остались бастионы коммунизма. Мы должны обеспечить, чтобы все искоренились, начиная с коммунистической Испании."
 GER_spain_wargoal_tt:0 "Прибыль §YПриложение§! Цель войны против §YРеспубликанская Испания§!.\n"
 GER_reestablish_free_elections:0 "Восстановление свободных выборов"
 GER_reestablish_free_elections_desc:0 "Мы вернёмся к демократическим идеалам, восстановив свободные выборы, которые состоятся в ближайшем будущем."
 GER_the_monarchy_compromise:0 "Компромисс монархии"
 GER_the_monarchy_compromise_desc:0 "Военные, которые боролись за нашу свободу от нацистской тирании, имеют явные роялистические наклонности. Чтобы обеспечить их удовлетворение тем путем, которым идет нация, мы должны пойти на компромисс и допустить возвращение монархии."
 GER_the_great_red_menace:1 "Великий [GER.GetGreatRedMenaceName] угроза"
 GER_the_great_red_menace_desc:1 "Наши действия в предыдущей войне до сих пор остаются в памяти многих. Мы должны переориентировать страхи континента на истинную опасность: великую опасность. [GER.GetGreatRedMenaceDesc] Это вырисовывается на Востоке. Мы начнем масштабную пропагандистскую кампанию, чтобы открыть глаза континенту."
 SOV_GREAT_RED_MENACE_NAME_COMMUNIST:0 "красный"
 SOV_GREAT_RED_MENACE_NAME_EXILES:0 "Восточный"
 SOV_GREAT_RED_MENACE_DESC_COMMUNIST:0 "Коммунистическая угроза"
 SOV_GREAT_RED_MENACE_DESC_EXILES:0 "Угроза российского империализма"
 GER_central_european_alliance:0 "Центральноевропейский альянс"
 GER_central_european_alliance_desc:0 "Теперь, когда мы сосредоточили внимание континента на проблеме, мы должны предложить решение: мы возглавим альянс для всех малых стран в Европе, который обеспечит защиту от этой самой смертельной угрозы нашему образу жизни."
 GER_central_european_alliance_tt:0 "Если не во фракции:\n"
 GER_danubian_membership:0 "Дунайское членство"
 GER_danubian_membership_desc:1 "Дунайские страны-преемники Австро-Венгерской империи не забыли, что значит быть нашим союзником. Мы предложим им членство и защиту от угрозы [GER.GetDanubianMembershipDesc]."
 SOV_DANUBIAN_MEMBERSHIP_DESC_COMMUNIST:0 "коммунизм"
 SOV_DANUBIAN_MEMBERSHIP_DESC_EXILES:0 "Восточная агрессия"
 GER_danubian_expansion:0 "Дунайское расширение"
 GER_danubian_expansion_desc:1 "Мы должны стремиться расширить наше влияние на те балканские страны, которые склонны к тому, чтобы [SOV.GetAdjective] Агрессия. Мы предложим оставшимся нациям членство в Дунае и защиту от угрозы [GER.GetDanubianMembershipDesc]."
 invite_non_fascist_communist_only_TT:1 "Потенциальные государства-члены не должны быть фашистами или коммунистами и не должны быть членами фракции.\n"
 GER_no_balkan_communism:0 "Нет балканского коммунизма"
 GER_no_balkan_communism_desc:0 "Коммунистическое влияние проникло на Балканы, чего мы не можем допустить. Он должен быть уничтожен до того, как он приживется."
 GER_no_balkan_communism_tt:0 "Прибыль §Yсвергнуть правительство§! Цели войны против коммунистических стран на Балканах.\n"
 GER_no_balkan_communism_HUN_tt:0 "Прибыль §Yсвергнуть правительство§! Цель войны против §YВенгерская Народная Республика§!.\n"
 GER_no_balkan_communism_ROM_tt:0 "Прибыль §Yсвергнуть правительство§! Цель войны против §YРумынская Народная Республика§!.\n"
 GER_no_balkan_communism_YUG_tt:0 "Прибыль §Yсвергнуть правительство§! Цель войны против §YСФР Югославия§!.\n"
 GER_no_balkan_communism_BUL_tt:0 "Прибыль §Yсвергнуть правительство§! Цель войны против §YСоциалистическая Республика Болгария§!.\n"
 GER_low_countries_membership:0 "Низкие страны Членство"
 GER_low_countries_membership_desc:0 "Несмотря на то, что Нижняя Европа находится далеко от восточных границ Европы, она все же знает, что если Центральная Европа падет, то она будет следующей. Мы предложим им членство, чтобы они могли встать с нами против угрозы коммунизма."
 GER_no_reds_in_western_europe:0 "Красных в Западной Европе нет"
 GER_no_reds_in_western_europe_desc:0 "Коммунистическое влияние проникло в Западную Европу, чего мы не можем допустить. Он должен быть уничтожен до того, как он приживется."
 GER_no_reds_in_western_europe_tt:0 "Прибыль §Yсвергнуть правительство§! Цель войны против коммунистических стран в Низких странах и Франции.\n"
 GER_no_reds_in_western_europe_FRA_tt:0 "Прибыль §Yсвергнуть правительство§! Цель войны против §YФранцузская коммуна§!.\n"
 GER_no_reds_in_western_europe_HOL_tt:0 "Прибыль §Yсвергнуть правительство§! Цель войны против §YОбъединённые народные провинции§!.\n"
 GER_no_reds_in_western_europe_BEL_tt:0 "Прибыль §Yсвергнуть правительство§! Цель войны против §YКооператив Бельгии§!.\n"
 GER_no_reds_in_western_europe_LUX_tt:0 "Прибыль §Yсвергнуть правительство§! Цель войны против §YРоза Люксембург§!.\n"
 GER_scandinavian_membership:0 "Скандинавское членство"
 GER_scandinavian_membership_desc:1 "Горы и холод не являются защитой от холода. [GER.GetGreatRedMenaceName] Угроза, и скандинавы должны это знать. Мы предложим им членство и защиту от угрозы [GER.GetDanubianMembershipDesc]."
 GER_baltic_membership:0 "Балтийское членство"
 GER_baltic_membership_desc:1 "В течение двух десятилетий Прибалтика жила под смертельной двойной опасностью реаннексии. [GER.GetBalticMembershipDesc]. Мы предложим им членство и защиту от угрозы [GER.GetDanubianMembershipDesc]."
 SOV_BALTIC_MEMBERSHIP_DESC_COMMUNIST:0 "коммунизм"
 SOV_BALTIC_MEMBERSHIP_DESC_EXILES:0 "[SOV.GetAdjective] империализм"
 GER_polish_membership:0 "Польское членство"
 GER_polish_membership_desc:1 "Полякам есть за что не доверять всем соседям, но они знают, что наибольшая угроза исходит с Востока. Мы предложим им членство и защиту от угрозы [GER.GetDanubianMembershipDesc]."
 GER_finnish_membership:0 "Членство Финляндии"
 GER_finnish_membership_desc:1 "Далеко удаленные от центра Европы финны рискуют столкнуться с [GER.GetFinnishMembershipDesc] один. Но они не должны. Мы предложим им членство и защиту от угрозы [GER.GetDanubianMembershipDesc]."
 SOV_FINNISH_MEMBERSHIP_DESC_COMMUNIST:0 "Красные"
 SOV_FINNISH_MEMBERSHIP_DESC_EXILES:0 "русские"
 GER_strike_at_the_source:0 "Забастовка в источнике"
 GER_strike_at_the_source_desc:1 "Жизнь, прожитая в страхе, не есть жизнь вообще. Мы должны покончить с этой угрозой нашему образу жизни раз и навсегда. Источником [GER.GetStrikeAtTheSourceDesc] Европа должна быть уничтожена."
 GER_swedish_trade_agreement:0 "Немецко-шведское торговое соглашение"
 GER_swedish_trade_agreement_desc:0 "Наша сталь некачественная, и для заправки нашей боевой машины нам нужен лучший материал. К счастью [SWE.GetName] На севере – идеальный партнер. Доступные высококачественные ресурсы, нейтральные и вряд ли приведут к слишком большой шумихе, когда наши планы на будущее материализуются."
 SOV_STRIKE_AT_THE_SOURCE_DESC_COMMUNIST:0 "коммунистическое влияние"
 SOV_STRIKE_AT_THE_SOURCE_DESC_EXILES:0 "Российский империализм"
 GER_reverse_the_brain_drain:0 "Обратить утечку мозгов вспять"
 GER_reverse_the_brain_drain_desc:0 "Теперь, когда угнетатели и авторитарные режимы были побеждены, мы можем попытаться сделать привлекательным для тех ученых, которые покинули страну, чтобы вернуться и снова работать на своей родине."
 GER_shared_rd_programs:0 "Общие программы R&D"
 GER_shared_rd_programs_desc:0 "Для блага нашего дела мы должны объединить наши научные знания и поделиться нашими технологическими достижениями с нашими новыми союзниками."
 GER_the_mannheim_project:0 "Проект Мангейма"
 GER_the_mannheim_project_desc:1 "Поскольку заводы по производству тяжелой воды в Норвегии находятся под нашим контролем, мы можем удвоить наши усилия по раскрытию секретов атома и разработке оружия против него. [GER.GetDanzigGuaranteesBolsheviksDesc]."
 GER_the_mannheim_project_tt:0 "Этот фокус дает различные награды в зависимости от текущего уровня атомных исследований.\n\n"
 GER_pool_technical_know_how:0 "Бассейн Технические ноу-хау"
 GER_pool_technical_know_how_desc:0 "У каждой страны есть свои методы управления промышленностью и технического обслуживания оборудования. Мы можем учиться друг у друга, посылая технические команды для распространения этих знаний среди других членов альянса."
 GER_pool_technical_know_how_tt:0 "Каждая нация во фракции получит этот национальный дух."
 ITA_ethiopian_war_logistics:0 "Эфиопская военная логистика"
 ITA_ethiopian_war_logistics_desc:0 "Возможно, мы неправильно оценили материально-техническую ситуацию, связанную с нашим славным завоеванием Эфиопии. Мы должны сделать своей главной целью обеспечение наших отважных войск необходимыми запасами."
 ITA_fortification_effort:0 "Усилия по укреплению"
 ITA_fortification_effort_desc:0 "Мы должны защищать наши берега и границы от агрессии угасающих и декадентских имперских держав Франции и Великобритании."
 ITA_fortification_effort_forts:0 "Добавить §Y15 Земельных фортов§! на французской границе.\n"
 ITA_army_primacy:0 "Армейское первенство"
 ITA_army_primacy_desc:0 "Промышленно Италия все еще отстает от декадентских колониальных империй. Мы должны решить, стоит ли отдавать приоритет армии или флоту. Выбор кажется очевидным; Как и древняя Римская империя зависела от своих легионов, так и новая Итальянская империя!"
 ITA_modernized_artillery:0 "Модернизированная артиллерия"
 ITA_modernized_artillery_desc:0 "Regio Esercito является одной из крупнейших армий в мире. К сожалению, мы никак не можем обустроить всех этих людей должным образом. Хуже всего то, что большая часть нашей артиллерии - с 1918 года!"
 ITA_modernized_army:0 "Модернизированная армия"
 ITA_modernized_army_desc:0 "Лучшая артиллерия значительно повысит нашу боевую эффективность, но нам также нужны новые тактики и доктрины."
 ITA_armored_effort:0 "Бронированные усилия"
 ITA_armored_effort_desc:0 "Бои в Эфиопии — это хорошо, но наши танки просто не соответствуют стандартам, необходимым для борьбы с декадентскими, хотя и все еще мощными, плутодемократиями Европы."
 ITA_mare_nostrum:0 "Наше море"
 ITA_mare_nostrum_desc:0 "Наши ресурсы ограничены, и мы должны сделать болезненный выбор, но Британская империя держит нас в клетке в Средиземном море. Для выхода из кризиса потребуется флот, чтобы конкурировать даже со своими."
 ITA_carrier_effort:0 "Развитие авианосцев"
 ITA_carrier_effort_desc:0 "Современные боевые флоты будут строиться вокруг авианосцев, а не линкоров. Превосходство авиации над кораблями американцы продемонстрировали ещё в 1921 году!"
 ITA_capital_ships:0 "Развитие крупных кораблей"
 ITA_capital_ships_desc:0 "Страна с наибольшим числом линкоров будет господствовать на морях. Мы не должны позволить Королевскому флоту превзойти нас огневой мощью в Средиземном море..."
 ITA_bomber_effort:0 "Развитие бомбардировщиков"
 ITA_bomber_effort_desc:0 "Эпоха, когда армии могли выигрывать войны, не обращая внимания на небо, прошла. Необходимо развивать тактические бомбардировщики, чтобы обеспечить солдат необходимой поддержкой с воздуха."
 ITA_atlantic_fleet:0 "Атлантический флот"
 ITA_atlantic_fleet_desc:0 "Как только мы вырвемся из британской клетки, нам придётся проецировать силу через океаны. Это должно стать первоочередной задачей."
 ITA_marines_and_landing_craft:0 "Морская пехота и десантные суда"
 ITA_marines_and_landing_craft_desc:0 "Войны выигрываются не одной лишь морской мощью; мы также должны уметь перевозить армии через море и безопасно высаживать их на берег..."
 ITA_jet_engine_effort:0 "Развитие реактивных двигателей"
 ITA_jet_engine_effort_desc:0 "Италия должна быть на переднем крае разработки реактивных двигателей благодаря блестящей работе Секундо Кампини. Мы должны предоставить ему все ресурсы, необходимые для дальнейшего совершенствования его проектов для Regio Aeronautica."
 ITA_light_ship_effort:0 "Развитие лёгких кораблей"
 ITA_light_ship_effort_desc:0 "Конвои, идущие к нашим заморским территориям, нуждаются в защите. Необходимо развивать новые доктрины и более современные эсминцы."
 ITA_escort_effort:0 "Усилия по сопровождению"
 ITA_escort_effort_desc:0 "Мы должны прилагать дальнейшие усилия для защиты наших уязвимых конвоев в Средиземном море."
 ITA_sea_wolves:0 "Морские волки"
 ITA_sea_wolves_desc:0 "Наши германские союзники создали пугающе эффективные подводные лодки и доктрину «волчьих стай» для их применения. Нам следует перенять этот опыт."
 ITA_slovenia_dalmatia_claims:0 "Претензии к Югославии"
 ITA_slovenia_dalmatia_claims_desc:0 "В Югославии по-прежнему проживает значительное итальянское население, по крайней мере, начиная со славных дней Венеции. Восстановление этих регионов под властью Италии является важным шагом на пути к воссозданию Римской империи."
 ITA_slovenia_dalmatia_claims_threat:0 "Итальянские претензии к Югославии"
 ITA_yugoslavia_friend:0 "Подружиться с Югославией"
 ITA_yugoslavia_friend_desc:0 "Вместо того, чтобы сейчас враждовать с Югославией, мы можем отложить ее окончательное завоевание до более подходящего времени. Вместо этого мы могли бы подружиться с режимом и ввести страну в сферу нашего влияния."
 ITA_support_nationalist_spain:0 "Поддержать националистическую Испанию"
 ITA_support_nationalist_spain_desc:0 "Испания находится в разгаре гражданской войны, которая определит, будет ли она будущим возможным фашистским союзником или останется бесполезной республикой - или, что еще хуже, падет на коммунизм или анархию. Мы должны оказать поддержку истинным испанцам, пока не стало слишком поздно!"
 ITA_demand_balearic_islands:0 "Спрос на Балеарские острова"
 ITA_demand_balearic_islands_desc:0 "Доказав свою поддержку новому режиму Франко, мы можем просить уступить Италии одну из важных территорий, которые мы защищали, Балеарские острова, чтобы укрепить наше стратегическое владение Средиземноморьем."
 ITA_bulgaria_friend:0 "Подружиться с Болгарией"
 ITA_bulgaria_friend_desc:0 "Болгария находится в сфере нашего влияния. Их безопасная связь с Италией является ключом к нашим балканским амбициям."
 ITA_albania_war_goal:1 "Албанская оккупация"
 ITA_albania_war_goal_desc:1 "Албания является легкой мишенью для наших войск. Мы вряд ли столкнемся с большим сопротивлением. Мы должны показать миру мощь Италии и восстановить славу Римской империи!"
 ITA_pact_of_steel:0 "Пакт из стали"
 ITA_pact_of_steel_desc:0 "Наши отношения с нацистской Германией омрачены идеологическими разногласиями и противоречивыми целями. Иль Дуче крайне опасается немецких амбиций в Австрии и на Балканах. Однако реалии меняются..."
 ITA_germ_italy_same_tt:0 "§YИталия§! и §YГермания§! являются одинаковыми §YИдеология§!."
 ITA_german_millitary_cooperation:0 "Военное сотрудничество с Германией"
 ITA_german_millitary_cooperation_desc:0 "Благодаря тесному сотрудничеству с мощными немецкими военными мы можем объединить лучшую часть немецкой эффективности и итальянских инноваций. У нас будет стратегическое преимущество перед всеми, кто осмелится встретиться с нами."
 ITA_claims_on_france:0 "Претензии к Франции"
 ITA_claims_on_france_desc:0 "Выберите землю из Виши Франция. С немецким завоеванием Парижа и новым правительством, сформированным во Франции, настало время для нас претендовать на наш законный кусок Южной Европы. Германия сильно расширилась на севере, и справедливо, что нам предоставлен собственный кусочек."
 ITA_claims_on_france_tt:0 "§YВиши Франция§! существует и контролирует §YСавойский§! и §YКорсика§!"
 ITA_go_after_france:0 "Идите за Францией"
 ITA_go_after_france_desc:0 "Франция... Еще одна реакционная демократия Запада, которая в каждый момент стремится помешать продвижению вперед и часто ставит под угрозу само существование итальянского народа. Мы идем на битву во имя блага Италии и будущего Империи."
 ITA_claims_on_turkey:0 "Претензии к Турции"
 ITA_claims_on_turkey_desc:0 "Лондонский договор 1915 года обещал Италии турецкие земли в Анатолии в обмен на завоевания западных держав в Леванте. Они взяли на себя ответственность, утверждая, что они были просто мандатами Лиги Наций, в то время как Италии было отказано. Новая Италия намного сильнее старой, и мы заставим турок сдержать британские обещания."
 ITA_italy_first:0 "Италия первая"
 ITA_italy_first_desc:0 "Муссолини никогда не будет играть вторую скрипку с Гитлером! Мы должны прислушаться к урокам Римской империи. Тевтонское вмешательство в итальянские дела никогда не заканчивается хорошо."
 ITA_romania_friend:0 "Подружиться с Румынией"
 ITA_romania_friend_desc:0 "В наших интересах было бы привлечь наших дальних родственников в Румынию в сферу нашего влияния. Иль Дуче видит большой потенциал в своей «железной гвардии»."
 ITA_german_rd_treaty:0 "Договор с Германией"
 ITA_german_rd_treaty_desc:0 "Мы должны попросить немцев обменяться технологическими секретами на благо обеих наших великих наций."
 ITA_spanish_italian_faction:0 "Испано-итальянский альянс"
 ITA_spanish_italian_faction_desc:0 "Франко и испанские националисты - наши естественные союзники, объединенные религией, культурой и идеологией. Вместе мы могли бы захватить Гибралтар и сделать жизнь очень трудной для Королевского флота."
 ITA_italian_highways:0 "Итальянские автомагистрали"
 ITA_italian_highways_desc:0 "Мы должны расширить нашу инфраструктуру, чтобы обеспечить легкую мобильность войск по всей нашей империи. С врагами во всех уголках мира это важная часть способности защищать всю итальянскую землю."
 ITA_libyan_infrastructure:0 "Ливийская инфраструктура"
 ITA_libyan_infrastructure_desc:0 "Наши обширные земли в Северной Африке по-прежнему не отстают от остальной части нашей империи с точки зрения инфраструктуры. Мы должны сосредоточить наши усилия на том, чтобы привести их в соответствие."
 ITA_greece_war_goal:0 "Война с Грецией"
 ITA_greece_war_goal_desc:0 "Какую Римскую империю мы восстановим, если не включим Грецию? Это должна быть легкая цель..."
 ITA_greece_friend:0 "Подружиться с Грецией"
 ITA_greece_friend_desc:0 "Греки — это собратья древнего народа и колыбель западной цивилизации. Не должно быть невозможно согласовать их цели с нашими."
 ITA_turkey_friend:0 "Подружиться с Турцией"
 ITA_turkey_friend_desc:0 "У турок нет причин любить нас после итало-турецкой войны и Великой войны. Тем не менее, Realpolitik имеет приоритет над старыми захватами, и текущая ситуация в Средиземноморье может привести наши две звезды в соответствие."
 ITA_portugal_friend:0 "Подружиться с Португалией"
 ITA_portugal_friend_desc:0 "Португалия, наряду с Испанией, является естественным союзником итальянского народа. Мы должны укреплять эти узы дружбы."
 ITA_anti_uk_war_goals:0 "Война с Великобританией"
 ITA_anti_uk_war_goals_desc:0 "Разлагающаяся Британская империя держит нас в клетке в Средиземном море и никогда добровольно не даст нам ключи. Мы должны нанести удар по англичанам, как только придет время!"
 ITA_japan_friend:0 "Подружиться с Японией"
 ITA_japan_friend_desc:0 "Японцы очень похожи на нас. Молодая, голодная держава с позитивной демографией получила выкуп за торговлю от убывающих плутодемократий, таких как Великобритания и Нидерланды. Мы должны объединиться с ними, чтобы сформировать яркую военно-морскую ось через океаны!"
 soviet_focus:0 "Советский национальный фокус"
 SOV_move_industry_to_urals:0 "Перенесем промышленность на Урал"
 SOV_move_industry_to_urals_desc:0 "Нельзя допустить, чтобы гитлеровцы захватили наши драгоценные фабрики в западной части СССР. С огромными усилиями и самопожертвованием мы должны быть в состоянии быстро переместить самую ценную тяжелую технику и объекты в Челябинск и другие места на Урале."
 SOV_defense_of_moscow:0 "Оборона Москвы"
 SOV_defense_of_moscow_desc:0 "Фашисты стучат в ворота столицы! Москва не должна падать любой ценой. Мобилизируйте всех, от детей до стариков, чтобы поспешно возводить то, что мы можем защитить!"
 SOV_defense_of_moscow_forts:0 "Добавить §Y28 Земельные форты§! в Москве и вокруг нее.\n"
 SOV_infrastructure_effort:0 "Развитие инфраструктуры"
 SOV_infrastructure_effort_desc:1 "[ROOT.GetNameDefCap] Он огромный, но в основном пустой. Мы должны обеспечить возможность быстрой транспортировки товаров и оборудования по всей территории страны."
 SOV_tranformation_of_nature:0 "Преобразование природы"
 SOV_tranformation_of_nature_desc:0 "Необходимо претворить в жизнь великий план Сталина по преобразованию природы. Окружающая среда должна быть сформирована и сформирована в массовом масштабе, чтобы работать на благо народа."
 SOV_stalin_constitution:0 "Сталинская конституция"
 SOV_stalin_constitution_desc:0 "Пришло время обновить нашу старую конституцию и впечатлить мир правами, которыми пользовались рабочие и крестьяне Советского Союза!"
 SOV_militarized_schools:0 "Милитаризованные школы"
 SOV_militarized_schools_desc:0 "Советские дети должны быть воспитаны в военной дисциплине и социалистических добродетелях, таких как самопожертвование и солидарность. Молодые умы легче формируются."
 SOV_workers_culture:0 "Рабочая культура"
 SOV_workers_culture_desc:0 "Социализм — это не только экономическая система, а марксизм — не только наука. Мы должны преобразовать саму ткань советского общества, чтобы искоренить все остатки буржуазных нравов и традиций."
 SOV_new_soviet_man:0 "Новый советский человек"
 SOV_new_soviet_man_desc:0 "Новый советский человек бескорыстен, образован, дисциплинирован и здоров. Живой триумф над низменными инстинктами и ложным сознанием. Мужчины с радостью отдадут свои жизни на благо всех, а женщины будут рожать много детей для будущего советского общества."
 SOV_progress_cult:0 "Культ прогресса"
 SOV_progress_cult_desc:0 "Мы должны отметить инновации выдающихся советских ученых и поощрять правильный вид свободного мышления. СССР всегда будет опережать упадочный Запад, когда речь заходит о смелых новых областях науки. Только посмотрите на гениальную работу товарища Лысенко!"
 SOV_socialist_science:0 "Социалистическая наука"
 SOV_socialist_science_desc:0 "Мир, как и разум, находится в постоянном движении. Природа пребывает в состоянии непрерывного прогресса — даже революции. Принципы диалектического материализма применимы как к естественным наукам, так и к общественным..."
 SOV_aviation_cult:0 "Культ авиации"
 SOV_aviation_cult_desc:0 "Советский Союз впечатлит мир поразительными подвигами авиации. Наши героические летчики - рыцари большевистской культуры и прогресса, демонстрирующие наше технологическое мастерство над природой. Как далеко мы продвинулись со времен царя!"
 SOV_women_pilots:0 "Женщины в авиации"
 SOV_women_pilots_desc:0 "Товарищ Раскова, наш героический летчик дальнего радиуса действия, должна быть допущена к формированию некоторых женских авиаполков по своей программе Авиационной группы 122."
 SOV_night_witches_tt:0 "588-й. В Москве начинает действовать ночной бомбардировочный полк."
 SOV_improve_railway_network:0 "Улучшить железнодорожную сеть"
 SOV_improve_railway_network_desc:0 "Наш первый пятилетний план оказался слишком успешным. Массовое расширение тяжелой промышленности оставило Советский Союз в гораздо более сильной позиции, чтобы защитить себя, но советская железнодорожная сеть поразила некоторые критические узкие места. У Народного комиссариата железных дорог (НКПС) есть амбициозный план по закрытию этих узких мест и обеспечению того, чтобы мы могли защитить Родину."
 SOV_transpolar_flights:0 "Трансполярные полеты"
 SOV_transpolar_flights_desc:0 "Наши самые смелые пилоты только начинают доказывать, что дерзкие маршруты через Арктику возможны. Используя неожиданные ярлыки, подобные этим, при планировании воздушной войны, мы сможем удивить противника."
 SOV_ocean_going_navy:0 "Океанский флот"
 SOV_ocean_going_navy_desc:0 "Хотя Союз охватывает большую территорию, чем любая другая нация на планете, океаны мира еще не управляются нашими кораблями. Тяжело бронированные линкоры станут частью нашего будущего флота."
 SOV_peoples_commissariat:0 "Найдены PCDI"
 SOV_peoples_commissariat_desc:0 "Народный комиссариат оборонной промышленности СССР будет министерством тяжелой промышленности, которое будет заниматься нашими военно-промышленными проектами. В долгосрочной перспективе нагрузка на работу может потребовать дополнительных подразделений министерства."
 SOV_anti_fascist_diplomacy:0 "Антифашистская дипломатия"
 SOV_anti_fascist_diplomacy_desc:0 "Хотя все западные режимы репрессивны и коррумпированы, нет ничего хуже тех, кто притворяется прогрессивным. Или даже социализм! Продвигая такое ложное сознание среди пролетариата, они пытаются задержать революцию и удержать рабочих в вечной кабале."
 SOV_operation_zet:0 "Операция \"Зет\""
 SOV_operation_zet_desc:0 "Хоть Гоминьдан и реакционен, маловероятно, что Мао Цзэдун и его коммунистический стиль возобладают в Китае. Мы должны стремиться к улучшению отношений с Чангом. Нелепо анахроничная Японская империя в любом случае скоро рухнет."
 SOV_annex_tannu_tuva:0 "Приложение Tannu Tuva"
 SOV_annex_tannu_tuva_desc:0 "Хотя это и не имеет значения с экономической точки зрения, по политическим причинам мы должны официально аннексировать Народную Республику Танну-Тува как автономную область в составе Советского Союза."
 SOV_improve_stalin_line:0 "Улучшение сталинской линии"
 SOV_improve_stalin_line_desc:0 "Наша западная граница должна быть лучше защищена от фашистской агрессии. Линия Сталина должна быть расширена и модернизирована."
 SOV_far_east_fortification_forts_1:0 "Добавить §Y6 Земельные форты§! на японской границе.\n"
 SOV_far_east_fortification_forts_2:0 "Добавить §Y8 Земельные форты§! на японской границе.\n"
 SOV_far_east_fortification_forts_3:0 "Добавить §Y4 Земельные форты§! на японской границе.\n"
 SOV_xian_incident:0 "Сианьский инцидент"
 SOV_xian_incident_desc:0 "Благодаря нашим контактам с видными чиновниками Гоминьдана мы сможем похитить Чан Кайши и заставить его разделить власть с Мао, эффективно положив конец их разрушительной ссоре, чтобы Китай мог лучше противостоять хищничествам Японии."
 SOV_xian_incident_tt:0 "Если обе стороны согласятся, это приведет к перемирию между националистическим и коммунистическим Китаем."
 SOV_anti_capitalist_diplomacy:0 "Антикапиталистическая дипломатия"
 SOV_anti_capitalist_diplomacy_desc:0 "Наихудшими препятствиями для мировой революции являются, без сомнения, толстые банкиры США и безжалостные колониальные угнетатели Соединенного Королевства. Наша главная цель всегда должна заключаться в том, чтобы похлопать их по рукам и подорвать их либеральную пропаганду."
 SOV_expand_red_fleet:0 "Расширение Красного флота"
 SOV_expand_red_fleet_desc:0 "Красный флот патетически слаб по сравнению с флотами империалистических держав. Мы должны сделать ее расширение национальным приоритетом!"
 SOV_anti_colonialist_rebels:0 "Коминтерн"
 SOV_anti_colonialist_rebels_desc:0 "С приходом капиталистической системы в период окончательного краха правильная позиция всех коммунистических партий должна быть крайне агрессивной, воинственной, ультралевой. В частности, мы призываем коммунистические партии мира посвятить свою энергию уничтожению умеренных левых."
 SOV_southern_thrust:0 "южная струя"
 SOV_southern_thrust_desc:0 "Аннексия Ирана и Ирака обеспечила бы их огромные запасы нефти для революции и оказала бы прямое давление на британских империалистов в Египте и Индии."
 SOV_claim_on_sinkiang:0 "Истец Синьцзян"
 SOV_claim_on_sinkiang_desc:0 "При правлении тов. Шэн Шикай Синьцзян уже является виртуальным советским марионеточным государством. Мы должны сделать это официальным..."
 SOV_claim_on_sinkiang_threat:0 "Советский истец Синьцзян"
 SOV_pan_slavic_rhetoric:0 "Панславянская риторика"
 SOV_pan_slavic_rhetoric_desc:0 "Ленин зашел слишком далеко в своем отказе от русской, славянской идентичности в погоне за мировой революцией. Определенная степень национализма должна нам хорошо служить, и возрождение панславизма могло бы помочь приблизить нас к другим славянским народам."
 SOV_claims_on_baltic:0 "Претензии в Балтике"
 SOV_claims_on_baltic_desc:0 "Петр Великий был прав, когда искал доступ к западным портам. Прибалтийские государства, которые были потеряны после революции, должны быть реинтегрированы в Советский Союз."
 SOV_claim_bessarabia:0 "Претензия к Бессарабии"
 SOV_claim_bessarabia_desc:0 "Чёрное море ещё важнее для нашей экономики, чем Балтийское. Мы должны сделать всё возможное, чтобы обеспечить контроль над Босфором и Дарданеллами."
 SOV_claims_on_turkey:0 "Претензии к Турции"
 SOV_claims_on_turkey_desc:0 "Турки не просто последовательно отказывались от наших требований о взаимном контроле над проливами Босфора, они также отказываются обсуждать какие-либо корректировки границ на востоке. Возможно, пришло время преподать им урок!"
 SOV_offer_poland_protection_tt:0 "§YПольша будет предоставлена государствам, заявленным в этом соглашении, в случае советского завоевания.§!\n"
 SOV_great_purge:0 "Великая чистка"
 SOV_great_purge_bypass_tt:0 "Троцкий становится лидером Советского Союза"
 SOV_great_purge_desc:0 "Среди офицеров назревает опасный троцкистский заговор; Даже в высших эшелонах. Хотя личное участие Троцкого остается неизвестным, угроза велика. СССР может быть ввергнут в очередную гражданскую войну. Если только мы не готовы разбить яйца."
 SOV_great_purge_tt:0 "Серия из §Yпоказательные испытания§! Они должны были провести чистку подозреваемых троцкистских министров и лидеров.\n"
 SOV_great_purge_tt2:3 "Количество завершенных чисток повлияет на вероятность возобновления §Yгражданская война§! и масштабировать эффект от §HОфицеров очистили§!.\nНе выбирая этот фокус приведет к §Yгражданская война§! и потенциального возвращения §YЛев Троцкий§! Из изгнания.\n\n"
 SOV_permanent_revolution:0 "Постоянная революция"
 SOV_permanent_revolution_tt:0 "Троцкий вернулся"
 SOV_permanent_revolution_tt2:0 "§YТроцкий§! Получает лучшую лидерскую черту."
 SOV_permanent_revolution_desc:0 "Угнетающий демагог ушел! Истинная власть была восстановлена для народа нашей страны. Теперь все они могут отстаивать свои интересы самостоятельно и без компромиссов. Мы постоянно меняемся. Постоянная революция — это триумфальная революция."
 SOV_nkvd_divisions:0 "Подразделения НКВД"
 SOV_nkvd_divisions_desc:0 "НКВД должны быть предоставлены собственные подразделения, которые будут действовать как внутренние войска, защищая железные дороги и важные объекты."
 SOV_smersh_tt:0 "§YЭто сводит на нет риск переворота.§!\n"
 SOV_partisan_suppression:0 "Подавление партизан"
 SOV_partisan_suppression_desc:0 "СМЕРШ следует расширить, с тем чтобы он мог лучше проникать и безжалостно подавлять все формы партизанской деятельности на оккупированной территории."
 SOV_war_with_germany:0 "Война с Германией"
 SOV_war_with_germany_desc:0 "Угроза со стороны Германии продолжает расти. Мы можем и должны уничтожить немецкую армию и заставить ее поклониться своим новым повелителям."
 SOV_war_with_germany_tt:0 "Пакт Молотова-Риббентропа не действует"
 SOV_war_with_japan:0 "Война с Японией"
 SOV_has_not_officers_purged_tt:0 "У нас нет национального духа. §YОфицеров очистили§!"
 SOV_war_with_japan_desc:0 "Японцы, похоже, не планируют отступать. Единственным эффективным средством сдерживания будет война. Они будут сожалеть, что сопротивлялись нашим требованиям, когда Красная Армия потопит их."
 SOV_war_with_uk:0 "Война с Великобританией"
 SOV_war_with_uk_desc:0 "Империалистические британцы никогда не испытывали к нам никакого уважения. Нет никаких сомнений в том, что они обратятся к Советскому Союзу, когда закончат с остальным миром. Есть только один способ предотвратить их агрессивную экспансию. Война!"
 SOV_claim_on_the_straits:0 "Заявить о проливах"
 SOV_claim_on_the_straits_desc:0 "Проливы, ведущие из Черного моря в Эгейское море, являются ключевым стратегическим пунктом. Мы не можем допустить, чтобы эта территория контролировалась иностранными державами. Чтобы обеспечить актуальность Красного флота, нам нужно обезопасить проливы."
 SOV_ultimatum_to_greece:0 "Ультиматум Греции"
 SOV_ultimatum_to_greece_desc:0 "Эгейские острова — это последний стратегический объект, который нам нужен для того, чтобы Красный флот мог свободно действовать. На греков оказывают давление со всех сторон, и они скорее всего откажутся от небольшой территории, чтобы избежать тотальной войны."
 SOV_diversify_the_programme:0 "Диверсифицировать программу"
 SOV_diversify_the_programme_desc:0 "Мы многому научились за последние годы, и мы добились прогресса в области традиционной войны. Мы нация великих ученых, которые способны раскрыть методы войны, дающие огромные преимущества. Мы должны убедиться, что у них есть наилучшие условия для работы, если мы хотим видеть результаты."
 SOV_research_city_experiment:0 "Городской эксперимент"
 SOV_research_city_experiment_desc:0 "Один из наших ведущих ученых, Курчатов, отметил, что при расщеплении ядер в килограмме урана выделяемая энергия должна быть равна взрыву 20 тысяч тонн тротила. Мы должны использовать эту силу перед нашими врагами, чтобы обеспечить выживание Родины."
 SOV_closed_city_network:0 "Закрытая городская сеть"
 SOV_closed_city_network_desc:0 "Мы должны создать закрытые города для исследований, которые требуют больше места, чем у нас есть на наших военных базах. Ограничение доступа к городам гарантирует, что наши исследования остаются секретными, предоставляя нашим ученым достаточно места для крупномасштабных экспериментов."
 strike_usa_focus:0 "Ударь по США!"
 strike_usa_focus_desc:0 "Вероломные американцы отдают нас в свою милость, контролируя наши поставки нефти и других отчаянно необходимых ресурсов. Их промышленность значительно превосходит нашу, поэтому если мы нанесем удар, нам лучше нанести сильный удар! Мы не можем надеяться выиграть длительную войну против США."
 chinese_puppet_focus:0 "Китайская марионетка"
 chinese_puppet_focus_desc:1 "Китай доказал, что стремится избежать войны с нами. Возможно, их лидеры считают внутренний раскол большей угрозой. Мы могли бы предложить им нашу защиту от коммунистов и военачальников, как подданных в Сфере совместного процветания Большой Восточной Азии."
 chinese_war_focus:0 "Война с Китаем"
 chinese_war_focus_desc:0 "Инцидент с мостом Марко Поло доказал, что китайцы не заинтересованы в сотрудничестве. С ростом напряженности, угрожающей последующему прекращению огня, война может быть единственным средством наведения порядка в китайской нации."
 subdue_warlords_focus:0 "Подчините военачальников"
 subdue_warlords_focus_desc:0 "Китайцы позволили развалить свою некогда гордую империю, разбить ее на куски радикалами и военными кликами. Японская империя не выдержит такого разделения даже своих подданных."
 oust_germans_focus:0 "Несколько китайско-немецких связей"
 oust_germans_focus_desc:0 "Немецкие военные советники присутствуют в Китае, по крайней мере, с двадцатых годов, оказывая критическую поддержку Гоминьдану. Этого больше нельзя терпеть. Мы имеем право потребовать немедленного отказа от всякой германской поддержки китайцам. Настало время немцам выбрать сторону."
 found_own_faction_focus:0 "Найдена наша фракция"
 found_own_faction_focus_desc:1 "Мы уже предприняли усилия по созданию Сферы совместного процветания Большой Восточной Азии. Для того, чтобы обеспечить прочную победу, Япония должна быть достаточно сильной, чтобы руководить в одиночку, в Азии и за ее пределами."
 axis_leanings_focus:0 "Наклоны оси"
 axis_leanings_focus_desc:0 "У нас много общих интересов и ценностей с новой Германией, которая строит в Европе мощную базу. Присоединившись к ним в качестве союзников, мы получим могущественного друга, достаточно далекого, чтобы не соперничать с нашим правлением в Азии."
 subvert_india_focus:0 "Индийская национальная армия"
 subvert_india_focus_desc:0 "Если Британия будет судить о наших усилиях по созданию империи, мы покажем им, что их собственная уже рушится. Индийские военнопленные и экспатрианты сформируют основу движения, которое может свергнуть британский Радж."
 jap_improved_sprit_focus:0 "Улучшение национального духа"
 jap_improved_sprit_focus_desc:0 "Националистическая гордость и поддержка войны побеждает каждого подданного императора, доводя его до все больших высот преданности!"
 befriend_siam_focus:0 "Подруга Сиам"
 befriend_siam_focus_desc:0 "Сиам избежал европейской колонизации и не привык быть подданной нацией. Вместо того, чтобы подчинить их, мы должны убедить их сотрудничать с нами, чтобы это так и осталось."
 army_primancy_focus:0 "Армейское первенство"
 army_primancy_focus_desc:0 "Из двух основных родов войск именно Армия является сильной правой рукой Империи. Его способность занимать и удерживать позиции намного перевешивает незначительные услуги, которые может предоставить военно-морской флот. Признавая этот простой, очевидный факт и выделяя больше ресурсов для армии, возможности безграничны."
 JAP_army_primancy_focus_bypass_tt:0 "Недостаточно строительных слотов для §YВоенные заводы§! в домашней зоне."
 jap_sia_love:0 "Японско-сиамская дипломатия"
 jap_sia_love_desc:0 "Япония сосредоточила свои дипломатические усилия на улучшении отношений с Сиамом."
 navy_primancy_focus:0 "Военно-морское превосходство"
 JAP_navy_primancy_focus_bypass_tt:0 "Недостаточно строительных слотов для §YМорские верфи§! в домашней зоне."
 navy_primancy_focus_desc:0 "Из двух основных видов вооружения, это действительно военно-морской флот, который является сильной правой рукой Империи. Его способность контролировать моря намного превосходит те незначительные услуги, которые может предоставить армия. Признавая этот простой, самоочевидный факт и выделяя больше ресурсов флоту, возможности безграничны."
 army_innovations_focus:0 "Армейские инновации"
 army_innovations_focus_desc:0 "Теперь, когда армия является признанной главной службой Империи, мы должны посвятить больше ресурсов изучению Земельных Доктрин."
 army_air_innovations_focus:0 "Военно-воздушные инновации"
 army_air_innovations_focus_desc:0 "Основная миссия ВВС должна заключаться в поддержке нашей хваленой армии!"
 army_motorization_focus:0 "Моторизация армии"
 army_motorization_focus_desc:0 "Большее внимание к моторизации увеличит скорость, с которой пехота может достичь поля боя, по крайней мере, в районах с хорошими дорогами."
 air_base_expansion_focus:0 "Расширение авиабаз"
 air_base_expansion_focus_desc:0 "Чтобы лучше поддерживать армию, ВВС нужны более крупные авиабазы."
 armor_innovations_focus:0 "Инновации в бронетехнике"
 armor_innovations_focus_desc:0 "С ростом нашей армии некоторые генералы предложили инвестировать в ряд современных бронированных машин."
 naval_innovations_focus:0 "Морские инновации"
 naval_innovations_focus_desc:0 "Теперь, когда Военно-морской флот является признанной главной службой Империи, мы должны посвятить больше ресурсов проектированию новых классов кораблей."
 naval_air_innovations_focus:0 "Инновации в военно-морском воздухе"
 naval_air_innovations_focus_desc:0 "Основная миссия ВВС должна заключаться в поддержке нашего хваленого флота!"
 convoy_protection_focus:0 "Защита конвоев"
 convoy_protection_focus_desc:0 "Несмотря на трусливую и бесчестную тактику, вполне возможно, что вражеские страны могут нацелиться на торговые суда, которые перемещают запасы и ресурсы вокруг нашей Империи. Мы должны изучить, как лучше всего защитить эти корабли, если это произойдет."
 advanced_torpedoes_focus:0 "Передовые торпеды"
 advanced_torpedoes_focus_desc:0 "Используя сжатый кислород, а не сжатый воздух в двигательных установках, наши торпеды смогут двигаться дальше и нести боеголовку большего размера, чем любые предыдущие типы."
 shbb_focus:0 "Сверхтяжелые линкоры"
 shbb_focus_desc:0 "В краткосрочной перспективе мы вряд ли сможем построить в количестве линкоров Великобританию или США, но, возможно, нам это не нужно. Вместо этого, возможно, удастся построить гораздо более мощные боевые корабли, чем позволяет им строить Вашингтонский договор."
 naval_base_focus:0 "Расширение военно-морской базы"
 naval_base_focus_desc:0 "Для расширения флота требуется больше военных баз."
 carrier_focus:0 "Фокус перевозчика"
 carrier_focus_desc:0 "Япония нуждается в мощном военно-морском флоте, и авианосец должен быть ядром силы нашего флота. День линкора подходит к концу, как скоро обнаружат наши враги!"
 battleship_focus:0 "Боевой корабль Focus"
 battleship_focus_desc:0 "Япония нуждается в мощном флоте, и линкор должен быть ядром силы нашего флота. Пусть другие страны тратят свое богатство на непроверенные авианосцы, только линкоры могут доминировать в морях!"
 spiritual_mobilization_focus:0 "Духовная мобилизация"
 spiritual_mobilization_focus_desc:0 "Вся наша нация, а не только наши солдаты, должны быть духовно подготовлены к войне. С этой целью националисты были объединены в Национальное движение духовной мобилизации для повышения патриотизма и поддержки правительства."
 warrior_traditions_focus:0 "Воинские традиции"
 warrior_traditions_focus_desc:0 "На протяжении всей истории Япония сохраняла уникальный набор традиций среди воинов. Эти ценности должны быть оживлены и сохранены каждым солдатом, независимо от ранга."
 divine_wind_focus:0 "Божественный ветер"
 divine_wind_focus_desc:0 "От любого солдата ожидают бесстрашной перспективы смерти, но наш народ должен пойти дальше этого, готовясь принести себя в жертву без надежды на выживание во славу императора и нации."
 imperial_glory_focus:0 "Имперская слава"
 imperial_glory_focus_effect:0 "Позволяет производить §HYokosuka MXY7 Ohka§!"
 imperial_glory_focus_desc:0 "Камикадзе, тактика Специального ударного отряда, изменила самоубийственные атаки с импровизированной последней меры на устоявшуюся доктрину. С новыми самолетами, по сути пилотируемыми ракетами, эти атаки будут непреодолимыми."
 student_movement_focus:0 "Студенческое движение"
 student_movement_focus_desc:0 "Министерство образования является столь же важной частью Духовной Мобилизации, как и любая другая, и если педагоги и студенты сплотятся вокруг нации, то будет построена прочная военно-ориентированная система образования."
 extra_tech_focus:0 "Дополнительные исследования"
 synth_oil_focus:0 "Синтетический масляный фокус"
 synth_oil_focus_desc:0 "Собственная добыча нефти очень ограничена, а импорт нефти ставит нас на милость иностранных интересов. Самым безопасным решением было бы совершенствование технологии производства синтетического масла."
 JAP_synth_oil_focus_tt:0 "Idemitsu Kosan доступен в качестве отраслевого концерна"
 secret_weapon_focus:0 "Передовое вооружение"
 secret_weapon_focus_desc:0 "Как островная Империя, мы всегда должны быть в авангарде военно-морских исследований, но ракетостроение большой дальности также не может навредить."
 industrial_effort_focus:0 "Имперская строгость"
 industrial_effort_focus_desc:0 "Каждый подданный императора должен принести себя в жертву на благо империи."
 industrial_effort_focus2:0 "Промышленные усилия"
 industrial_effort_focus2_desc:0 "Япония является индустриализированной страной, и она еще не так сильна, как некоторые западные страны. Мы должны принять меры для того, чтобы сократить разрыв между нашими возможностями."
 infra_effort_focus:0 "Развитие инфраструктуры"
 infra_effort_focus_desc:0 "Строительство инфраструктуры в нашей горной стране было непростым делом, однако усилия должны продолжаться."
 fortress_japan_focus:0 "Крепость Япония"
 fortress_japan_focus_desc:0 "Если наши враги когда-нибудь покорят наш флот, наши укрепления сделают любую попытку вторжения гораздо более дорогостоящей, чем большинство стран могут себе позволить заплатить."
 crypto_bomb_focus:0 "Криптологическая бомба"
 crypto_bomb_focus_desc:0 "Поляки разработали блестящую машину, которую они называют «криптологической бомбой», которая может сломать немецкие шифры Энигмы. У нас есть ресурсы, чтобы развивать его дальше на нашем объекте в Блетчли-парке."
 tizard_mission_focus:0 "Миссия «Тизард»"
 tizard_mission_focus_desc:0 "Мы совершили много прорывов в технологиях, которые мы не можем полностью использовать из-за нехватки ресурсов и промышленного потенциала. Генри Тизард хотел бы возглавить делегацию, чтобы договориться о договоре о совместном использовании технологий с США."
 maud_focus:0 "Комитет МАУД"
 maud_focus_desc:0 "Комитет «Военное применение детонации урана» убежден, что теоретически возможно создать бомбу невероятной мощности, используя уран для достижения неконтролируемой реакции ядерного деления. Однако, возможно, мы не сможем разработать эту технологию самостоятельно. Мы должны поговорить с американцами."
 general_rearmament_focus:0 "Общее перевооружение"
 general_rearmament_focus_desc:1 "[Root.GetGeneralRearmamentDesc]"
 ENG_GENERAL_REARMAMENT_DESC_HISTORICAL:0 "Начинает казаться, что очередная Великая война неизбежна. Если это не Гитлер, то это будет Микадо или даже Советы. Общественное мнение достаточно развернулось, что мы можем инициировать программу всеобщего перевооружения."
 ENG_GENERAL_REARMAMENT_DESC_AHISTORICAL:0 "Наши предшественники слишком сильно пренебрегали нашим военным положением. Мы должны инициировать программу всеобщего перевооружения, чтобы устранить острую неадекватность наших вооруженных сил."
 air_defense_focus:0 "Воздушная оборона"
 air_defense_focus_tt:1 "Добавить максимум §Yпротивовоздушный§! в §YВосточная Англия§!, §YСассекс§! и §YЮго-Западная Англия§!"
 air_defense_focus_bypass_tt:0 "Недостаточно строительных слотов для §Yпротивовоздушный§!"
 air_defense_focus_desc:0 "Нет никакого вопроса, откуда будет исходить враг. Мы должны защитить побережье с помощью обширных противовоздушных батарей."
 radar_focus:0 "РАДАР"
 radar_focus_desc:0 "Способность обнаруживать вражеские бомбардировщики будет иметь решающее значение для военных действий. Мы не должны жалеть ресурсов на дальнейшее развитие радиолокационной техники и строительство сети станций обнаружения вдоль побережья."
 ENG_ROYAL_ORDNANCE_FACTORIES_NAME_HISTORICAL:0 "Королевские оружейные заводы"
 ENG_ROYAL_ORDNANCE_FACTORIES_NAME_COMMUNIST:0 "Революционные оружейные заводы"
 ENG_ROYAL_ORDNANCE_FACTORIES_DESC_HISTORICAL:0 "Королевского арсенала в Вулвиче, к сожалению, недостаточно для производства всех необходимых нам боеприпасов и стрелкового оружия. Мы должны создать еще много заводов по всей стране, желательно в относительно безопасных районах."
 ENG_ROYAL_ORDNANCE_FACTORIES_DESC_COMMUNIST:0 "Революционный арсенал в Вулвиче крайне недостаточен для производства всех необходимых нам боеприпасов и стрелкового оружия. Мы должны создать еще много заводов по всей стране, желательно в относительно безопасных районах."
 shadow_scheme_focus:0 "Схема теней"
 shadow_scheme_focus_desc:0 "Министерство авиации предложило упростить преобразование гражданских заводов в военные. При наличии соответствующих грантов и кредитов для различных ключевых компаний их заводы могут быть расширены и адаптированы заранее, чтобы сделать переход к военным приложениям намного более плавным."
 shadow_scheme_focus_tt:1 "Гранты §G4§! Строительные слоты и §Y4 Военные фабрики§! Всего в двух государствах при вступлении в войну.\n"
 uk_small_arms_focus:0 "Компания BSA"
 uk_small_arms_focus_desc:1 "[Root.GetBSACompanyDesc]"
 ENG_BSA_COMPANY_DESC_HISTORICAL:0 "Королевские оружейные заводы не производят достаточного количества стрелкового оружия, но, как и во время Великой войны, мы могли бы заключить контракт с Бирмингемской компанией по производству стрелковых вооружений и расширить их возможности."
 ENG_BSA_COMPANY_DESC_COMMUNIST:0 "Революционные оружейные заводы не производят достаточного количества стрелкового оружия, но, как и во время Великой войны, мы могли бы заключить контракт с Бирмингемской компанией по производству стрелковых вооружений и расширить их возможности."
 UK_secret_focus:0 "Секретное оружие"
 UK_secret_focus_desc:0 "Теперь у нас есть знания и инфраструктура, чтобы сосредоточиться на разработке различных секретных проектов оружия, которые раньше принадлежали к области научной фантастики."
 air_rearmament_focus:0 "Воздушное перевооружение"
 air_rearmament_focus_desc:1 "[Root.GetAirRearmamentDesc]"
 ENG_AIR_REARMAMENT_DESC_HISTORICAL:0 "В любой войне с континентальным врагом Королевские ВВС докажут ключ к победе. Во-первых, мы должны обеспечить, чтобы наши авиабазы могли поддержать наши планы перевооружения!"
 ENG_AIR_REARMAMENT_DESC_COMMUNIST:0 "В любой войне с континентальным противником народные военно-воздушные силы докажут ключ к победе. Во-первых, мы должны обеспечить, чтобы наши авиабазы могли поддержать наши планы перевооружения!"
 fighter_command_focus:0 "Командование бойцов"
 fighter_command_focus_desc:0 "Наш главный приоритет – контролировать собственное небо. Трудно выделить более важную область военных исследований, чем разработка истребителей."
 bomber_command_focus:0 "Командование бомбардировщиков"
 bomber_command_focus_desc:0 "Как всегда говорил Джулио Духет: «Бомбардировщик всегда прорвется!» Несмотря на достижения в области радиолокационных технологий и противовоздушной обороны, мы должны уделять приоритетное внимание разработке лучших бомбардировщиков."
 coastal_command_focus:0 "Береговое командование"
 coastal_command_focus_desc:1 "[Root.GetCoastalCommandDesc]"
 ENG_COASTAL_COMMAND_DESC_HISTORICAL:0 "Наша промышленность управляется ресурсами, поставляемыми в Британию из многих отдаленных частей Империи. Наши конвои являются нашей жизненной силой и должны быть защищены как Королевским флотом, так и Королевскими военно-воздушными силами. Мы должны создать специальное подразделение ВВС для защиты подходов к нашим портам."
 ENG_COASTAL_COMMAND_DESC_COMMUNIST:0 "Наша промышленность управляется ресурсами, поставляемыми в Британию из многих отдаленных частей Империи. Наши конвои являются нашей жизненной силой и должны быть защищены как Военно-морским флотом освобождения рабочих, так и Народно-воздушными силами. Мы должны создать специальную структуру для защиты подходов к нашим портам."
 aircraft_production_focus:0 "Производственная группа самолетов"
 aircraft_production_focus_desc:0 "Производство самолетов остается нашим главным приоритетом. Лондонская авиастроительная производственная группа (LAPG) должна быть создана для управления и координации всех имеющихся самолетов, связанных с производством."
 uk_jet_focus:0 "Самолет Jet самолёт"
 uk_jet_focus_desc:0 "Кажется почти уверенным, что реактивный двигатель придет на смену пропеллерным двигателям на самолетах. Потенциал огромен, и мы не должны позволить Великобритании отставать в этой важнейшей области исследований."
 naval_rearmament_focus:0 "Перевооружение флота"
 naval_rearmament_focus_desc:1 "[Root.GetNavalRearmamentDesc]"
 ENG_NAVAL_REARMAMENT_DESC_HISTORICAL:0 "Хотя мы пытались предотвратить гонку вооружений с помощью Второго Лондонского морского договора, даже подписавшие его стороны в основном игнорируют его. Королевский флот никогда не должен терять свое глобальное превосходство. Мы всегда должны быть уверены в том, что он остается самым большим в мире."
 ENG_NAVAL_REARMAMENT_DESC_COMMUNIST:0 "Хотя мы пытались предотвратить гонку вооружений с помощью Второго Лондонского морского договора, даже подписавшие его стороны в основном игнорируют его. Военно-морской флот освобождения рабочих никогда не должен терять своего глобального превосходства. Мы всегда должны быть уверены в том, что он остается самым большим в мире."
 uk_destroyer_focus:0 "Фокус разрушителя"
 uk_destroyer_focus_desc:0 "Современные линкоры поражают воображение, но нельзя забывать о важнейшей роли скромного эсминца в защите наших конвоев."
 uk_convoy_focus:0 "Конвой Escort Focus"
 uk_convoy_focus_desc:0 "Этого не может быть достаточно, наши конвои — наша жизненная сила. Мы должны сделать все, что в наших силах, чтобы защитить их и быстро заменить потерянный тоннаж."
 uk_waves_focus:0 "Британия управляет волнами"
 uk_waves_focus_desc:1 "[Root.GetBritanniaRulesTheWavesDesc]"
 ENG_BRITANNIA_RULES_THE_WAVES_DESC_HISTORICAL:0 "В длинной тени Королевского флота другие военно-морские силы вынуждены придумывать новые инновационные доктрины, чтобы компенсировать это. Мы не должны становиться самодовольными и полагаться исключительно на количество и качество отдельных судов."
 ENG_BRITANNIA_RULES_THE_WAVES_DESC_COMMUNIST:0 "В длинной тени Военно-морского флота освобождения рабочих другие военно-морские силы вынуждены придумывать новые инновационные доктрины, чтобы компенсировать это. Мы не должны становиться самодовольными и полагаться исключительно на количество и качество отдельных судов."
 uk_carrier_focus:0 "Фокус перевозчика"
 uk_carrier_focus_desc:0 "Среди военно-морских теоретиков существует интенсивный спор о дальнейшей жизнеспособности линкора. Есть те, кто утверждает, что современная авиация станет доминировать в военно-морской мощи, и что авианосец заменит линкор как король океанов."
 uk_spain_focus:0 "Принудить Испанию"
 uk_spain_focus_desc:0 "Испанцы лучше многих знают мощь Королевского флота, но, возможно, им стоит напомнить..."
 uk_battleship_focus:0 "Боевой корабль Focus"
 uk_battleship_focus_desc:0 "Пока теоретики спорят о превосходстве в воздухе и на море, никто не хочет видеть орудия линкора, наведённые на свой дворец. Даже если сторонники авианосцев в итоге окажутся правы, линкоры ещё долгие годы будут господствовать в океанах."
 uk_turkey_focus:0 "Принудить Турцию к сотрудничеству"
 uk_turkey_focus_desc:0 "Они не должны любить нас, но Джонни Турция должен знать достаточно, чтобы бояться наших линкоров."
 uk_amphibious_focus:0 "Десантная война"
 uk_amphibious_focus_desc:0 "Управлять волнами — это хорошо, но иногда нужно промокнуть ноги. Мы не должны пренебрегать нашей способностью высадить войска вторжения на вражеской территории."
 singapore_focus:0 "Сингапурская стратегия"
 singapore_focus_desc:0 "Сингапур должен оставаться нашей главной военно-морской базой на Востоке. Гонконг может пасть перед японцами, но Сингапур обязан оставаться неприступным до прибытия главного флота, который решительно разгромит врага."
 sp_landward_forts_focus:0 "Укрепления Landward"
 sp_landward_forts_focus_desc:0 "Нынешние оборонительные меры на острове Сингапур неадекватны. Мы должны сосредоточить наши усилия на укреплении укреплений!"
 peninsular_focus:0 "Полуостровная война"
 peninsular_focus_desc:0 "Мы должны предупредить и замедлить врага, спускающегося с севера через Малайю, прежде чем он достигнет Сингапура."
 hongkong_focus:0 "Держите Гонконг"
 hongkong_focus_desc:0 "Сингапурская стратегия устарела. Наш план должен быть более смелым и опираться на базу, расположенную гораздо ближе к Японии. С достаточным количеством укреплений и сооружений, Гонконг будет служить идеально!"
 hk_landward_forts_focus:0 "Укрепления Landward"
 hk_landward_forts_focus_desc:0 "Гонконгу придется стать городом-крепостью, чтобы выдержать устойчивую атаку со стороны материкового Китая."
 hk_air_focus:0 "Противовоздушная оборона"
 hk_air_focus_desc:0 "Мы должны значительно расширить и улучшить противовоздушные установки в Гонконге."
 uk_embargo_focus:0 "Политика эмбарго"
 uk_embargo_focus_desc:0 "Лучший способ победить диктаторов — красных или коричневых — это просто лишить их ресурсов, необходимых для ведения войны. Проблема заключается в том, чтобы просто побить банкиров и корпорации, которые ведут с ними бизнес."
 uk_sanction_italy_focus:0 "Санкции против Италии"
 uk_sanction_italy_focus_desc:0 "Муссолини мечтает о новой Римской империи и, как бы абсурдно это ни звучало, может однажды напасть на нас, чтобы осуществить свою мечту. Мы должны сделать все возможное, чтобы предотвратить это до того, как начнется война."
 uk_sanction_japan_focus:0 "Санкции против Японии"
 uk_sanction_japan_focus_desc:0 "Японцы, похоже, привержены созданию своей «Сферы совместного процветания Большой Восточной Азии»; Под их гегемонией, разумеется. Британская империя является главным препятствием, наряду с колониями других западных держав. Они должны быть лишены доступа к необходимым им ресурсам."
 uk_burma_focus:0 "Бирманская дорога"
 uk_burma_focus_desc:0 "Мы должны помочь китайцам в их борьбе против Японии, построив дорогу и связанную с ней инфраструктуру между Бирмой и Китаем, где поставки могут достичь их на суше, в безопасности от японского хищничества."
 uk_scandinavian_focus:0 "Скандинавская интервенция"
 uk_scandinavian_focus_desc:0 "Скандинавия имела бы мало стратегического импорта, если бы не одно. Шведский экспорт железа. Мы должны оказать давление как на Швецию, так и на Норвегию, чтобы не допустить попадания этого жизненно важного ресурса в Германию. Если они откажутся, нам придется быть готовыми к вторжению."
 uk_iraq_focus:0 "Безопасный Ирак"
 uk_iraq_focus_desc:0 "Мы предоставили Ираку независимость в 1932 году, но, учитывая нынешнюю глобальную ситуацию, это могло быть ошибкой. Иракская нефть никогда не должна доходить до наших врагов."
 uk_iran_focus:0 "Защищать Иран"
 uk_iran_focus_desc:0 "Иран не просто богат нефтью, которой должны отказать наши враги. Это также стратегическая связь между Индией, Ближним Востоком и Советским Союзом."
 uk_free_india_focus:0 "Независимость Индии"
 uk_free_india_focus_desc:0 "Япония активно разжигает восстание в Индии и даже сформировала «Национальную индийскую армию», состоящую из индийских новобранцев. Ситуация может стать опасной, если ничего не будет предотвращено. Мы можем либо быстро победить Японию, либо обещать независимость Индии через несколько лет."
 uk_colonial_focus:0 "Поощрение колониальной элиты"
 uk_colonial_focus_desc:0 "В нашей огромной, разросшейся империи живут одни из величайших умов в мире, но ее размер не позволяет многим из них когда-либо встретиться. Поощряя их к совместной работе над нашими наиболее важными проектами, мы можем достичь результатов быстрее."
 uk_asia_focus:0 "Укрепить Восточную Азию"
 uk_asia_focus_desc:0 "Многие из наших старых колоний на востоке находятся под угрозой гражданских войн и имперских амбиций местных стран. Мы не должны пренебрегать нашими оставшимися форпостами, но продолжать развивать эти регионы для обеспечения нашего глобального присутствия."
 uk_china_focus:0 "Влияние Китая"
 uk_china_focus_desc:0 "Хотя китайские националисты называют себя врагами наших колониальных усилий, они оказались в ловушке между врагами, у которых слишком мало союзников. Если мы обратимся к ним, они могут быть готовы изменить свою политику."
 uk_commonwealth_focus:0 "Связи Содружества"
 uk_commonwealth_focus_desc:0 "Объединённые общей верностью Короне, страны Британского Содружества являются первыми, на кого мы можем рассчитывать в случае очередного глобального конфликта. Обеспечение безопасности нашей дипломатической администрации будет иметь существенное значение."
 uk_india_focus:0 "Развивайте Радж"
 uk_india_focus_desc:0 "Состояние наших колоний в Индии остается спорным как за рубежом, так и внутри страны, но что бы ни ожидалось для них, укрепление их промышленного потенциала является приоритетом на современном этапе."
 northern_expansion_focus:0 "Северное расширение"
 northern_expansion_focus_desc:0 "Доктрина Северной экспансии, которую поддерживает Императорская армия, признает, что Советский Союз представляет наибольшую угрозу японским амбициям. С ростом напряженности в Европе благоприятный момент для нападения на российский Дальний Восток неизбежно наступит. Мы должны нанести быстрый удар."
 southern_expansion_focus:0 "Экспансия на юг"
 southern_expansion_focus_tt:0 "Добавить §Yпакт о ненападении§! с §YСоветский Союз§! когда выбран\n"
 southern_expansion_focus_desc:0 "Доктрина Южного расширения, одобренная Имперским флотом, диктует, что Япония должна расширить юг в Юго-Восточную Азию и Тихий океан. Богатые колонии европейских держав располагают ресурсами, критически важными для японской промышленности, но этот путь приведет к конфликту с США. Упреждающий удар в порядке."
 new_ideas:0 "Доступны новые министры.\n"
 available_political_advisor:0 "§GДоступный§! как §YПолитический советник§!:\n"
 available_chief_of_army:0 "§GДоступный§! как §YНачальник армии§!:\n"
