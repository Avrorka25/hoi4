 purge_2_group_b:0 " Очистил Сталин"
 counter_purge:0 " Очищен Троцким"
 SOV_war_since_purge:0 "У него была война с момента завершения Великой Чистки."
 FRA_metropolitan_france:2 "Инвестируйте в Metropolitan France"
 FRA_metropolitan_france_tt:0 "Недостаточно строительных слотов для §Yинфраструктура§! В Метрополитен-Франс"
 FRA_metropolitan_france_desc:0 "Метрополь всегда должен быть первым. Мы можем начать с улучшения нашей инфраструктуры, чтобы создать рабочие места и обеспечить более быстрое развертывание войск."
 FRA_algerie_france:2 "Инвестируйте в алжирскую Францию"
 FRA_algerie_france_tt:0 "Недостаточно строительных слотов для §Yинфраструктура§! Колониальная Франция"
 FRA_algerie_france_desc:0 "Европа переживает опасные времена. Мы должны сосредоточиться на улучшении наших земель к югу и обеспечить, чтобы мы всегда могли поддерживать материк."
 FRA_industrial_expansion:0 "Промышленное расширение"
 FRA_industrial_expansion_tt:0 "Недостаточно строительных слотов для §YГражданские заводы§! В Метрополитен-Франс"
 FRA_industrial_expansion_desc:0 "Нам нужно более сильное промышленное присутствие в стране. У нас много готовой рабочей силы, но нам нужно больше заводских линий."
 FRA_colonial_industry:0 "Колониальная промышленность"
 FRA_colonial_industry_tt:0 "Недостаточно строительных слотов для §YГражданские заводы§! Колониальная Франция"
 FRA_colonial_industry_desc:1 "Мы должны сосредоточиться на нашей промышленности в колониях. Если напряженность в Европе усилится, у нас все еще будет промышленный потенциал, недоступный вражеским бомбардировщикам."
 FRA_military_factories:0 "Военные заводы"
 FRA_military_factories_tt:0 "Недостаточно строительных слотов для §YВоенная фабрика§! В Метрополитен-Франс"
 FRA_military_factories_desc:1 "Наша боевая машина отстает по мощности. Нам нужно сосредоточиться на производстве военной техники на родной земле, чтобы наши силы постоянно получали новую технику."
 FRA_colonial_military_factories:0 "Колониальные военные фабрики"
 FRA_colonial_military_factories_tt:0 "Недостаточно строительных слотов для §YВоенная фабрика§! Колониальная Франция"
 FRA_colonial_military_factories_desc:0 "Размещение нашего военного производства за пределами Европы гарантирует, что даже если враг получит контроль над нашим воздушным пространством, мы будем поддерживать постоянный поток техники к нашим фронтовым войскам."
 FRA_extra_research_slot:2 "Поддержите Великие школы"
 FRA_extra_research_slot_desc:0 "Обещающие молодые умы появляются повсюду. Мы должны снабдить их оборудованием для проведения исследований. Достижения в области технологий могут дать нам преимущество там, где мы больше всего нуждаемся в этом."
 FRA_nuclear_effort:0 "Ядерные усилия"
 FRA_nuclear_effort_desc:0 "Первые испытания в ядерной науке показали многообещающие результаты. Использование его силы может дать нам оружие, отличное от всего, что видело человечество."
 FRA_extra_research_slot_2:2 "Формирование Национального исследовательского центра"
 FRA_extra_research_slot_2_desc:0 "Обещающие молодые умы появляются повсюду. Мы должны снабдить их оборудованием для проведения исследований. Достижения в области технологий могут дать нам преимущество там, где мы больше всего нуждаемся в этом."
 FRA_defensive_focus:0 "Оборонительный фокус"
 FRA_defensive_focus_desc:0 "В такие времена лучше всего укреплять нашу оборону. Если есть угрозы, пусть они придут к нам, чтобы мы могли справиться с ними на нашей собственной земле. У нас есть идеальный кандидат, чтобы возглавить нашу армию, все, что нам нужно, это ваше слово."
 FRA_aggressive_focus:0 "Агрессивный фокус"
 FRA_aggressive_focus_desc:0 "Мы не можем бездействовать, пока враги приближаются к нашим границам, и не можем бросить союзников на произвол судьбы в случае войны. Подготовить армию! Гамелен подходит для этой задачи."
 FRA_fortification_focus:0 "Упор на укрепления"
 FRA_fortification_focus_desc:0 "Какими бы важными ни были наши форты, нам нужно найти способы построить их более эффективно. Линия Мажино была мощным сдерживающим фактором вражеских сил, мы могли бы использовать безопасность большего количества защит, как это."
 FRA_heavy_armor_focus:0 "Шар Батай"
 FRA_heavy_armor_focus_desc:0 "Боевые танки - это путь вперед для французской армии. Мы хотим контролировать поле боя и для этого нам понадобятся новые мощные танки!"
 FRA_light_medium_armor:0 "Автомитральеза"
 FRA_light_medium_armor_desc:0 "По закону пехота контролирует все танковые силы. Более легкие и быстрые кавалерийские «транспортные средства» или автомитральезы лучше подходят для путешествий и все еще могут нанести некоторый ущерб своим установленным оружием."
 FRA_navy_focus:0 "Приоритет флота"
 FRA_navy_focus_tt:0 "Недостаточно строительных ячеек для §Yвоенно-морской базы§!"
 FRA_navy_focus_desc:0 "Если мы планируем расширить наш флот, то первым шагом будет улучшение и расширение наших военно-морских баз. Наши уникальные корабли требуют постоянного внимания, чтобы всегда быть готовыми к бою."
 FRA_improved_screen_ships:0 "Улучшенные корабли охранения"
 FRA_improved_screen_ships_desc:0 "Разрушители и более легкие крейсера играют ключевую роль в защите наших тяжелых линейных кораблей или авианосцев. Если мы потеряем нашу линию обороны на море, мы рискуем всеми кораблями и людьми. Мы должны быть уверены, что наши корабли построены с использованием новейших технологий."
 FRA_capital_ship_focus:0 "Ставка на крупные корабли"
 FRA_capital_ship_focus_desc:0 "Улучшение конструкции наших линкоров привело бы к большим тактическим преимуществам. С их дальностью и мощью, не оспариваемой, никто не сможет опередить их оружие."
 FRA_carrier_focus:0 "Фокус перевозчика"
 FRA_carrier_focus_desc:0 "Морские теоретики обратили наше внимание на наших устаревших носителей. У них есть предложения о том, как перевозчики могут быть использованы в дальнейшем, если развитие будет продвигаться в правильном направлении. Реальный прогресс невозможен без нашей полной поддержки."
 FRA_initiate_government_reform:0 "Государственная реформа"
 FRA_initiate_government_reform_desc:0 "Мир стал более опасным. Мы больше не можем быть связаны нашими собственными мелкими дрязгами. Настало время расширить возможности наших политиков и двигаться вперед во имя Франции."
 FRA_support_the_left:0 "Поддержите левых"
 FRA_support_the_left_desc:0 "Коминтерн становится все сильнее. Пришло время показать, что наши интересы могут быть согласованы и поддержать наши коммунистические организации."
 FRA_leftist_rhetoric:0 "Левая риторика"
 FRA_leftist_rhetoric_desc:0 "Цель ясна. равенства для всех. Мы не хотим капиталистических интересов во французской политике. Необходимо создать оптимальные условия для процветания наших коммунистических организаций."
 FRA_scw_intervention_republicans:0 "Республиканское вмешательство"
 FRA_scw_intervention_republicans_desc:0 "Республиканцы нуждаются в нашей помощи!\nЛюбой, кто готов бороться за дело, должен быть допущен. Мы не можем допустить, чтобы еще один фашистский режим набрал силу."
 FRA_national_mobilization:0 "Национальная мобилизация"
 FRA_national_mobilization_desc:0 "Наконец-то у нас есть правительство, способное действовать. Теперь настало время укрепить нашу армию и быть готовыми к борьбе за Францию."
 FRA_join_comintern:0 "Вступить в Коминтерн"
 FRA_join_comintern_desc:0 "С врагами повсюду, куда бы мы ни обратились, нам нужно укреплять свои позиции с некоторыми могущественными союзниками. Наши связи с Коминтерном укрепились, и пришло время полностью посвятить себя их делу."
 FRA_support_status_quo:0 "Поддержите статус-кво"
 FRA_support_status_quo_desc:0 "Франция является колыбелью и защитником свободы и должна оставаться таковой. Если мы когда-нибудь снова захотим достичь единства, то мы должны стабилизировать нашу демократию до того, как она ослабнет."
 FRA_strengthen_government_support:0 "Укрепить правительство"
 FRA_strengthen_government_support_desc:0 "Мы разработали планы на следующий год, которые будут отвечать пожеланиям людей во всех частях Франции. Покажите им, что мы способны действовать и достойны править Францией, чтобы мы снова могли быть едины."
 FRA_defensive_strategems:0 "Оборонительные стратагемы"
 FRA_defensive_strategems_desc:0 "Если мы хотим, чтобы народ Франции вел войну за нас, то как никогда важно, чтобы у нас было четкое направление. Мы должны перестать воевать между собой и бороться за Францию и «Либерте, égalité, fraternité»."
 FRA_polish_guarantee:0 "Польская гарантия"
 FRA_polish_guarantee_desc:0 "Польские дипломаты выразили обеспокоенность по поводу напряженности на их границах. Гарантия от нашей могущественной нации должна сдерживать любого, кто планирует вторжение."
 FRA_czech_guarantee:0 "Чешская гарантия"
 FRA_czech_guarantee_desc:0 "На чешской границе нарастает напряженность. Мы не можем позволить экспансивным нациям захватить свободную и демократическую нацию. Чехи должны оставаться свободным народом. С гарантией от нас любой, кто планирует вторжение, подумает дважды."
 FRA_revise_versailles:0 "Пересмотреть Версаль"
 FRA_revise_versailles_desc:0 "[GER.GetNameDefCap] превращается в силу, с которой приходится считаться. Мы можем согласовать их видение лучшего будущего с нашими интересами. Нужно поддержать их, и когда пыль уляжется, [FRA.GetNameDef] получит свою законную долю Европы."
 FRA_support_the_right:0 "Поддержать правых"
 FRA_support_the_right_desc:0 "Франция всегда была сильной и гордой страной, но отсутствие действий правительства разделило народ. Мы должны объединить Францию и утвердить наше превосходство и силу, чтобы не поддаться разложению."
 FRA_right_wing_rhetoric:0 "Правая риторика"
 FRA_right_wing_rhetoric_desc:0 "Мы должны сосредоточиться на том, чтобы достучаться до каждого француза и поднять его национальный дух. Покажите им, что мы можем быть сильными лидерами, в которых они нуждаются, и они станут гордыми гражданами нашей славной нации."
 FRA_scw_intervention_nationalists:0 "Вмешательство националистов"
 FRA_scw_intervention_nationalists_desc:0 " Националисты, наконец, набирают силу в Испании. Их дело – дело праведное, и любой желающий сражаться за них должен быть допущен к этому."
 FRA_army_of_aggression:0 "Армия агрессии"
 FRA_army_of_aggression_desc:0 "Мы больше не можем сидеть за устаревшей стеной, в то время как наши враги разгуливают по всей Европе. Настало время укрепить нашу армию и раздвинуть наши границы, чтобы Франция продолжала оставаться великой нацией."
 FRA_france_first:0 "Франция первая"
 FRA_france_first_desc:0 "Мы - Франция! Победители Великой войны! Спасители Европы! Мы являемся домом для величайших мыслителей, которых видел этот мир. Слишком много стран стремятся погрузить мир в хаос. Мы нужны, и мы прислушаемся к призыву. Мы возьмем штурвал, выдержим бурю и поведем человечество в безопасное место под нашим правлением!"
 FRA_dismantle_the_democracies:0 "Разрушить демократию"
 FRA_dismantle_the_democracies_desc:0 "Новый [GER.GetAdjective] Демократический альянс в Центральной Европе угрожает нашей новой позиции. Мы должны принять меры сейчас, прежде чем они станут более мощными."
 FRA_join_germany:0 "Присоединяйтесь к Германии"
 FRA_join_germany_desc:0 "Германский рейх становится силой, с которой нужно считаться. Их видение лучшего будущего может быть согласовано с нашими интересами. Мы должны поддержать их, и как только пыль осядет, Франция получит свой законный кусок Европы."
 FRA_naval_doctrine:0 "Военно-морская доктрина"
 FRA_naval_doctrine_desc:0 "Недавний прогресс в проектировании кораблей открыл новые возможности для тактических и стратегических маневров. Прежде чем рискнуть с этими новыми теориями, мы должны должным образом проверить их и закрепить планы."
 FRA_air_focus:0 "Приоритет авиации"
 air_focus_bypass_tt:0 "Недостаточно строительных слотов для §YАвиабаза§!"
 FRA_air_focus_desc:0 "Настало время расширить наши военно-воздушные силы! Уже разработаны планы по строительству новых авиабаз для поддержки значительного увеличения как личного состава, так и самолетов."
 FRA_cas_focus:0 "Фокус CAS"
 FRA_cas_focus_desc:0 "Самолеты, которые обеспечивают поддержку сухопутных войск и кораблей, были очень эффективным дополнением при относительно небольших инвестициях. Эти самолеты теперь имеют несколько предлагаемых улучшений. Наши инженеры могут разработать самолеты следующего поколения."
 FRA_fighter_focus:0 "Фокус бойца"
 FRA_fighter_focus_desc:0 "Некоторые революционные гражданские технологии могут быть применены на наших истребителях, чтобы улучшить их скорость, дальность и максимальную высоту. Мы должны сосредоточиться на этом, если хотим идти в ногу с достижениями других."
 FRA_bomber_focus:0 "Бомбардировщик Focus"
 FRA_bomber_focus_desc:0 "Поддержка с воздуха является важной частью наших оборонительных и наступательных возможностей. Если мы сосредоточим наши усилия на разработке быстрых, более гибких и точных бомбардировщиков, мы сохраним преимущество в любом сухопутном бою."
 FRA_heavy_fighter_focus:0 "Тяжелый истребитель Focus"
 FRA_heavy_fighter_focus_desc:0 "Наши тяжелые истребители должны быть в состоянии поддерживать более уязвимые самолеты-бомбардировщики. Это требует более тяжелого вооружения и большей дальности за счет некоторой скорости."
 FRA_air_doctrine:0 "Воздушная доктрина"
 FRA_air_doctrine_desc:0 "Мы накопили достаточно опыта, чтобы быстрее проверить новые теории в воздушной войне. Это позволит нам изучить новые тактические и стратегические возможности. Воздушные бои являются ключевыми в современной войне."
 FRA_heavy_bomber_focus:0 "Тяжелый бомбардировщик Focus"
 FRA_heavy_bomber_focus_desc:0 "Современные тяжелые бомбардировщики будут вооружены, чтобы справиться с меньшими воздушными стычками самостоятельно. Если мы позволим нашим инженерам сосредоточиться на разработке новейших технологий, у нас будет больше шансов уничтожить вражеские производственные объекты."
 FRA_naval_bomber_focus:0 "Упор на морские бомбардировщики"
 FRA_naval_bomber_focus_desc:0 "Корабли оказались чрезвычайно уязвимы перед авиацией. Следует продолжать совершенствовать технологии, чтобы опережать любые контрмеры."
 limited_rearmament_focus:0 "Ограниченное перевооружение"
 limited_rearmament_focus_desc:1 "[Root.GetLimitedRearmamentDesc]"
 ENG_LIMITED_REARMAMENT_HISTORICAL:0 "Недавние волнения со стороны Германии и других фашистских держав по всему миру свидетельствуют о том, что мы не можем наслаждаться миром в наше время. При подготовке мы должны начать приводить в движение части нашего собственного перевооружения, если ситуация ухудшится."
 ENG_LIMITED_REARMAMENT_AHISTORICAL:0 "Наш новый подход к внутренней политике и международным отношениям требует здоровой военной поддержки. При подготовке мы должны начать расширять нашу гражданскую промышленность, чтобы она могла в свое время сформировать стабильную основу для будущего расширения нашей военной промышленности."
 ENG_motorized_focus:0 "Моторизованная армия"
 ENG_motorized_focus_desc:0 "В последнее время армия экспериментирует с полностью моторизованными пехотными подразделениями. До сих пор они не сформировали полностью моторизованных дивизий, но с правильными словами госсекретарю по войне это вскоре может стать возможным."
 ENG_ROYAL_TANK_REGIMENT_NAME_HISTORICAL:0 "Королевский танковый полк"
 ENG_ROYAL_TANK_REGIMENT_NAME_COMMUNIST:0 "Республиканский гвардейский танковый полк"
 ENG_ROYAL_TANK_REGIMENT_DESC_HISTORICAL:0 "Британия изобрела танк, поэтому Королевский танковый полк должен иметь лучшие машины в мире, но сейчас это не так. Комитет по разработке специальных машин предлагает исследовать и создать современную модель, чтобы Британия оставалась впереди танкостроения."
 ENG_ROYAL_TANK_REGIMENT_DESC_COMMUNIST:0 "Великобритания изобрела танк, и поэтому Республиканский гвардейский танковый полк должен быть оснащен лучшими в мире танками, но это не так в настоящее время. Комитет по разработке специальных транспортных средств предлагает исследовать и разработать современный дизайн, чтобы держать Великобританию на переднем крае разработки танков."
 ENG_vickers_experimental_facility_focus:0 "Экспериментальные объекты Vickers"
 ENG_vickers_experimental_facility_focus_desc:0 "Для дальнейшего развития наших исследований и разработки специальных технологических проектов мы должны стремиться расширить экспериментальные мощности Vickers в Фоксваррене."
 ENG_vickers_experimental_facility_focus_tt:0 "Если нет другого §YЭкспериментальные сооружения§! в §Y[126.GetName]§!Мы выиграем §G1§! §YАэродинамика и авионика§! в §Y[126.GetName]§!."
 ENG_expand_the_secret_intelligence_service_focus:0 "Расширение секретной разведывательной службы"
 ENG_expand_the_secret_intelligence_service_focus_desc:0 "Секретная разведывательная служба, обычно называемая МИ-6, помогает защитить нашу родину от любой подрывной деятельности и иностранных угроз. Хотя они были сформированы во время Великой войны, они были реорганизованы в двадцатых годах. Однако в то время мы упустили некоторые важные детали и должны попытаться увеличить размер организации еще раз."
 uk_empire_focus:0 "Укрепить империю"
 uk_empire_focus_desc:0 "Наша Империя огромна и, несмотря на нашу мощь, слабо защищена. Чтобы бороться с этим, мы должны поощрять имперский патриотизм во всем мире."
 uk_service_focus:0 "Обслуживание за рубежом"
 uk_service_focus_desc:0 "Перемещая личный состав вооруженных сил на колониальные станции и возвращаясь домой, они могут узнать об условиях на разных фронтах, получить опыт и поделиться им со своими товарищами."
 uk_mediterranean_focus:0 "Средиземноморский бастион"
 uk_mediterranean_focus_desc:0 "Маршрут через Средиземное море является жизненно важным маршрутом в Индию и из нее. Поэтому крайне важно держать его открытым и в наших руках."
 uk_rock_focus:0 "Укрепить Скалу"
 uk_rock_focus_desc:0 "Помимо контроля над входом в Средиземное море, Гибралтар является хорошо защищенной гаванью, откуда суда могут работать как в Атлантике, так и в Средиземном море. Поэтому крайне важно, чтобы она была строго охраняемой."
 uk_greece_focus:0 "Принудить Грецию"
 uk_greece_focus_desc:0 "В наших интересах иметь права базирования в Греции, и, честно говоря, греки не в состоянии нам отказать."
 uk_malta_focus:0 "Укрепить Мальту"
 uk_malta_focus_desc:0 "Мальта занимает превосходное положение в центре Средиземного моря и служит важнейшим пунктом на пути через Египет и Суэцкий канал к Индии и Дальнему Востоку. Время, потраченное на её укрепление, никогда не будет потрачено впустую."
 ENG_mot_focus_tooltip:0 "Теперь мы можем развернуть мотострелковые дивизии."
 uk_canada_focus:0 "Развитие в Канаде"
 uk_canada_focus_desc:0 "Инвестиции в канадскую промышленность и судостроительные верфи дадут толчок их экономике и позволят им внести больший вклад в случае войны."
 uk_australia_focus:0 "Развитие в Австралии"
 uk_australia_focus_desc:0 "Инвестиции в австралийские верфи и промышленность дадут толчок их экономике и позволят им внести больший вклад в случае войны."
 uk_protect_suez:0 "Защитить Суэц"
 uk_protect_suez_desc:0 "Контроль над Суэцким каналом — одна из основ господства Британской империи на море. Потеря региона станет катастрофой. Необходимо принять меры по его укреплению."
 uk_balkan_strategy:0 "Балканская стратегия"
 uk_balkan_strategy_desc:0 "Многие страны на Балканах являются пробританскими и видят ту же угрозу со стороны Центральной Европы, что и мы. Если мы воспользуемся возможностью и поддержим их раньше, мы сможем обеспечить их лояльность, хотя и за счет гнева их соседей-реваншистов."
 uk_new_zealand_focus:0 "Развивающаяся Новая Зеландия"
 uk_new_zealand_focus_desc:0 "Новая Зеландия сохраняет тесную связь с нашей страной и предостерегает от фашистской угрозы. Их вклад в случае войны несомненен, и мы должны помочь им подготовиться соответствующим образом."
 uk_south_africa_focus:0 "Развивающаяся Южная Африка"
 uk_south_africa_focus_desc:0 "Политическая ситуация в Южной Африке остается неопределенной. Мы не можем полностью доверять тому, что они поддержат наши военные усилия, но, помогая им в укреплении их промышленности, мы можем надеяться на увеличение поддержки британского дела."
 FRA_strengthen_government_support_tooltip:0 "Идея «усиления государственной поддержки» уже в ходу."
 ITA_victoryinETH:0 "Триумф в Африке"
 ITA_victoryinETH_desc:0 "Провал в первой Итало-Эфиопской войне был пятном на итальянской чести в течение 40 лет, достигнув победы теперь, когда пятно будет удалено и сила железной воли фашизма будет доказана!"
 USA_reinforce_monroe_doctrine_tt:0 "Укрепление торгового мнения со всеми американскими странами.\n"
 1939_bookmark_threat:0 "Недавний фашистский экспансионизм"
 USA_civil_war_fired:0 "Началась Вторая американская гражданская война."
 USA_anti_imperialism:0 "Антиимпериализм"
 USA_anti_imperialism_desc:0 "Америка всегда была врагом империалистических угнетателей, но очевидно, что большинство так называемых демократий готовы поддерживать эти институты до тех пор, пока они извлекают из них выгоду. Революционеры Советского Союза являются лучшими союзниками."
 USA_fascist_menace:1 "Прусская угроза"
 USA_fascist_menace_desc:1 "Версальский договор и экономические санкции не остановили Германию, а прусский милитаризм вновь поднимает свою уродливую, агрессивную голову. Германия должна быть снова разгромлена и взята под наш контроль, по крайней мере на время."
 USA_crusade_against_communism:0 "Крестовый поход против коммунизма"
 USA_crusade_against_communism_desc:0 "Красный террор – это самая страшная угроза, с которой когда-либо сталкивался мир. В любом случае, деструктивная идеология, исходящая из Советского Союза, должна быть отрезана от своего происхождения, и мы будем теми, кто это сделает."
 USA_strike_at_the_empire:0 "Ударить по империи"
 USA_strike_at_the_empire_desc:0 "Подлинная угроза свободе в мире — это колониальные империи, построенные европейскими сверхдержавами. Они должны быть раздавлены и их население освобождено, начиная с Британской империи, от которой мы когда-то освободились."
 USA_defense_of_the_pacific:0 "Оборона Тихого океана"
 USA_defense_of_the_pacific_desc:0 "Японское правительство находится вне надежды, его экспансионизм угрожает как нашему народу, так и его азиатским соседям. Нация должна быть приведена под американскую администрацию, чтобы реформировать ее и не допустить повторения своих ошибок."
 ENG_home_defence:0 "Оборона родины"
 ENG_home_defence_desc:0 "Огромная империя бесполезна, если мы не можем защитить британский народ. Мы должны сосредоточить наши усилия на обеспечении безопасности Британских островов."
 ENG_issue_gasmasks:0 "Выдача гасмасок"
 ENG_issue_gasmasks_desc:0 "Мир становится все более опасным с каждым днем. Мы должны защитить гражданское население от любых атак с использованием отравляющего газа. Британия будет дышать спокойно."
 ENG_military_training_act:0 "Закон о военной подготовке"
 ENG_military_training_act_desc:0 "Великая война оставила у наших людей впечатление, что им не придется снова воевать. По мере того, как мир становится все более опасным, мы должны обеспечить, чтобы все способные молодые люди получали базовую военную подготовку."
 ENG_embargo_germany:0 "Посадить Германию"
 ENG_embargo_germany_desc:0 "Немецкое перевооружение является оскорблением и большой угрозой миру во всем мире. Мы не будем поставлять им ресурсы, необходимые для того, чтобы подпитывать их военную машину."
 ENG_war_with_germany:0 "Война с Германией"
 ENG_war_with_germany_desc:0 "Немцы не оставили нам другого выбора. Ради свободного мира и будущего наших детей. Настало время войны."
 ENG_swedish_intervention:0 "Шведское вмешательство"
 ENG_swedish_intervention_desc:0 "Шведские движения против демократии получили тревожное влияние. Мы не можем рисковать тем, что шведская сталь окажется в руках наших врагов. Шведы останутся свободными, но мы должны обеспечить определенную степень влияния на их страну."
 ENG_norwegian_intervention:0 "Норвежское вмешательство"
 ENG_norwegian_intervention_desc:1 "Норвежские движения против демократии продолжают набирать силу. Мы должны обеспечить, чтобы их политика оставалась в соответствии с нашими собственными интересами, даже если нам нужно применить силу."
 ENG_danish_intervention:0 "Датское вмешательство"
 ENG_danish_intervention_desc:0 "Датская поддержка врагов мира во всем мире продолжает расти. Есть только один способ, чтобы они оставались на нашей стороне. Мы должны использовать Данию для создания стратегического плацдарма в регионе на случай, если возникнет необходимость в наземном вторжении в Европу."
 ENG_benelux_intervention:0 "Вмешательство Бенилюкса"
 ENG_benelux_intervention_desc:0 "Политическая обстановка в регионе Бенилюкс становится все более враждебной по отношению к нам. Мы должны послать четкое предупреждение о том, что любой враг демократии не будет допущен, и мы готовы применить силу, если это необходимо."
 ENG_belgium_security:0 "Безопасная Бельгия"
 ENG_belgium_security_desc:0 "Предупреждения явно было недостаточно. Если политические тенденции продолжатся, как они есть до сих пор, Бельгия будет представлять прямую угрозу нашим водам. Мы должны вмешаться и установить стратегический плацдарм на материковой Европе."
 ENG_dutch_security:0 "Обеспечить безопасность Нидерландов"
 ENG_dutch_security_desc:0 "Политические движения в Нидерландах продолжают поддерживать наших врагов. Нидерланды должны быть покорены, чтобы обеспечить свободную Европу."
 ENG_war_with_japan:0 "Война с Японией"
 ENG_war_with_japan_desc:0 "Все остальные варианты исчерпаны, и японцы отказываются отказываться от своих экспансионистских путей. Для безопасности Британской империи и народов Азии мы должны подчинить себе японцев."
 ENG_war_with_italy:0 "Война с Италией"
 ENG_war_with_italy_desc:0 "Итальянцы отказываются отказываться от своих планов по созданию новой империи и готовы начать войну, чтобы расширить свои границы. Мы должны сделать все возможное, чтобы устранить эту угрозу, пока не стало слишком поздно."
 ENG_embargo_ussr:1 "Эмбарго против [SOV.Capital.GetCapitalVictoryPointName]"
 ENG_embargo_ussr_desc:1 "[SOV.GetNameDefCap] Он становится все более мощным и использует британские ресурсы для подпитки своих военных усилий. Мы должны лишить их доступа к нашей торговле."
 ENG_war_with_ussr:1 "Война с [SOV.GetAdjective]ой державой"
 ENG_war_with_ussr_desc:1 "Угроза со стороны [SOU.GetNameDef] Мы продолжаем расти, несмотря на наши возражения. Мы не можем мириться с агрессивным [SOU.GetName] У них нет другого выбора, кроме как отправиться на войну ради лучшего будущего."
 kamikaze_focus_tooltip:1 "Позволяет §YУдар Камикадзе§! Воздушные миссии, нападения террористов-смертников на вражеские корабли.\n"
 AST_commonwealth_aircraft_corporation:0 "Авиационная корпорация Содружества"
 AST_commonwealth_aircraft_corporation_desc:0 "Commonwealth самолёт Corporation является основным производителем авиационных и авиационных двигателей в Австралии. Он имеет проверенный послужной список, и поддержка его даст нашим пилотам необходимые материалы."
 AST_new_general_tt:0 "Новый §Y3 Навыки§! Генерал по имени §YИвен Маккей§! Появится."
 AST_homeland_defense_tt:0 "Укрепить Родину с помощью §Yприбрежные форты и сухопутные форты§! охрана вероятных посадочных площадок и портов."
 AST_swpi_research_tt:0 "Мы войдем в §YСоглашение о разделе технологий§! с США или с другими членами нашей фракции."
 AST_deal_with_japan_tt:1 "Мы будем предлагать передать повеление §YМалайя§! Япония в обмен на союз. Если это невозможно, мы предложим уступить государствам-членам. §YКалимантан§!, §YСулавеси§! и §YМолукки§! Вместо этого в Японию.\n"
 SAF_a_king_for_our_people_trigger_tt:0 "Король Эдуард был изгнан."
 NATIONAL_FOCUS_MUTUALLY_EXCLUSIVE_TREE:0 "Ветви являются взаимоисключающими."
 NATIONAL_FOCUS_EXCLUSIVE_INFO_DESC:0 "Взаимоисключительно с"
 NATIONAL_FOCUS_EXCLUSIVE_INFO_ENTRY:0 "$FOCUS|Y$"
 NATIONAL_FOCUS_NO_CURRENT_EFFECT:0 "В настоящее время этот фокус не имеет эффекта. Изменения в мировой ситуации могут повлиять на это."
 SAF_civil_war_tt:1 "§RГражданская война разразится§! между §YФашистские националисты§! в Юго-Западной Африке и §YДемократические юнионисты§! в остальной части страны."
 SAF_german_research_tt:0 "Мы заключим соглашение о совместном использовании технологий с Германией."
 scw_in_progress_tt:0 "Испания находится в гражданской войне."
 NZL_national_roads_board_desc:0 "Пересеченная местность Новой Зеландии препятствует созданию целостной системы дорожного строительства, но нам необходимо улучшить то, что у нас есть. Необходимо исследовать систему шоссе, проложить дороги и проложить новые пути через горы."
 NZL_bureau_of_industry:0 "Бюро промышленности"
 NZL_bureau_of_industry_desc:0 "Новая Зеландия является аграрным обществом с акцентом на ранчо. Бюро промышленности должно поощрять крупные инвестиции в капитальную инфраструктуру и производство."
 NZL_transfer_ships_tt:0 "[ENG.GetNameDefCap] переводы §Y2 Легкие крейсера§! Для нас."
 RAJ_provincial_elections:0 "Провинциальные выборы"
 RAJ_provincial_elections_desc:0 "Новый закон о правительстве Индии предусматривает проведение выборов в провинциях, устанавливая определенную меру местного самоуправления, ответственную перед индийским населением. Посмотрим, какое влияние это окажет на британское правление."
 RAJ_swaraj:0 "Сварадж"
 RAJ_swaraj_desc:0 "Концепция Ганди о самоуправлении — Сварадж — набирает популярность по всей Индии. Она выступает за полный разрыв с британскими институтами и обычаями, а в индийских школах агитируют группы свараджа."
 RAJ_indian_national_congress:0 "Индийский национальный конгресс"
 RAJ_indian_national_congress_desc:0 "Индийский национальный конгресс добился больших успехов на выборах по всему субконтиненту. Они являются сильным голосом независимой Индии или, по крайней мере, с большей автономией в пределах Империи."
 RAJ_quit_india_movement:0 "Бросить индийское движение"
 RAJ_quit_india_movement_desc:0 "Кампания Ганди за независимость Индии достигла кульминации с призывом к британцам покинуть Индию. Немыслимо, чтобы Радж мог закончиться до окончания войны, но ситуация на местах с каждым днем становится все более напряженной."
 RAJ_all_india_forward_bloc:0 "Вся Индия Блок вперед"
 RAJ_all_india_forward_bloc_desc:0 "Блок «Вся Индия вперед» считает, что выход Великобритании из Индии занимает слишком много времени. Необходимо занять более сильную, даже воинственную позицию."
 RAJ_seek_help_from_soviet:0 "Искать помощи у советских"
 RAJ_seek_help_from_soviet_promised:0 " Советский Союз пообещал свою помощь"
 RAJ_seek_help_from_soviet_desc:0 "Советский Союз – это естественный баланс между Британской имперской властью. Они утверждают, что являются двигателем революции, и мы должны поощрять их экспортировать свою революцию в Индию."
 RAJ_indian_peoples_army:0 "Индийская народная армия"
 RAJ_indian_peoples_army_effect:0 "Сторонники коммунизма начинают гражданскую войну за свободу. Размер зависит от поддержки партии и прогресса автономии."
 RAJ_indian_peoples_army_support:0 "[SOV.GetNameDefCap] поддержит их дело."
 RAJ_indian_peoples_army_desc:0 "Мы должны организовать военную силу, которая будет учиться у коммунистического дела и быть в союзе с ним."
 RAJ_research_city_excursions:0 "Экскурсии по исследовательским городам"
 RAJ_research_city_excursions_desc:0 "Советские исследовательские города — это чудо, и население Индии полно энергичных и умных умов. Отправка наших молодых инженеров в эти города поможет нам развивать отечественную научно-исследовательскую и промышленную базу."
 RAJ_combined_arms_academy:0 "Академия комбинированных вооружений"
 RAJ_combined_arms_academy_desc:0 "Советская военная подготовка может быть более эффективной благодаря новой Объединенной академии вооружений. Мы можем быть в курсе современных военных действий, используя воздушную, наземную и морскую мощь."
 RAJ_rani_of_jhans:0 "Рани из Джанси"
 RAJ_rani_of_jhans_desc:0 "Рани из Джанси был великим героем индийской революции 1857 года. Ее пример храбрости и национальной гордости является образцом для всех женщин Индии, которые хотят взять в руки оружие и сформировать свой собственный полк."
 RAJ_rebuilding_the_nation:0 "Восстановление нации"
 RAJ_rebuilding_the_nation_desc:0 "С изгнанием имперского угнетателя и мобилизацией индийского населения пришло время исправить ущерб, нанесенный двумя веками оккупации."
 RAJ_seek_help_from_germany:0 "Искать помощи у Германии"
 RAJ_seek_help_from_germany_promised:0 " Германский рейх пообещал свою помощь"
 RAJ_seek_help_from_germany_desc:0 "Германия никогда не причиняла нам вреда так, как это сделала Великобритания, а Рейх является наиболее правдоподобным вызовом британской власти. Мы должны приблизиться к силам оси."
 RAJ_indian_national_army:0 "Индийская национальная армия"
 RAJ_indian_national_army_effect:0 "Фашистские сторонники развязывают гражданскую войну за свободу. Размер зависит от поддержки партии и прогресса автономии."
 RAJ_indian_national_army_support:0 "[GER.GetNameDefCap] поддержит их дело."
 RAJ_indian_national_army_desc:0 "Была организована индийская национальная армия, отличная от британских контролируемых сил. Мы можем построить его в регионах, свободных от британского вмешательства, и выстроиться против союзников, потратив индийскую рабочую силу из Раджа."
 RAJ_battaglione_azad_hindoustan:0 "Батальоне Азад Хиндустан"
 RAJ_battaglione_azad_hindoustan_desc:0 "Италия сформировала Баттаглионе Азад Хиндустан, полк индийских бывших военнопленных. Обученный саботажу, парашютированию и проникновению, BAH может стать большим шагом для национальной гордости."
 RAJ_german_technology:1 "[Root.GetGermanTechnologyName]"
 RAJ_german_technology_german:0 "Немецкая технология"
 RAJ_german_technology_japan:0 "Японские технологии"
 RAJ_german_technology_desc:0 "Немецкие ученые являются лучшими в мире, а их военная машина основана на лучших современных инженерных методиках. Они готовы поделиться с нами своими достижениями."
 RAJ_japanese_army_air_force_academy:1 "[Root.GetJAAFAName]"
 RAJ_japanese_army_air_force_academy_german:0 "Авиационная школа Luftwaffe Air Training School"
 RAJ_japanese_army_air_force_academy_japan:0 "Академия ВВС японской армии"
 RAJ_japanese_army_air_force_academy_desc:0 "Японская академия военно-воздушных сил приняла решение приветствовать индийских новобранцев, которые хотят бороться с европейским господством в Азии."
 RAJ_cripps_mission:0 "Миссия Криппса"
 RAJ_cripps_mission_desc:0 "Мы должны сохранить верность Индии союзническому и британскому делу, несмотря на растущий националистический пыл к независимости. Сэр Стаффорд Криппс — опытный переговорщик, который может заверить лидеров националистов в том, что их требования будут удовлетворены."
 RAJ_two_nation_theory:0 "Теория двух наций"
 RAJ_two_nation_theory_effect:0 "Пакистан будет освобожден, когда Индия получит свободу.\n"
 RAJ_two_nation_theory_desc:0 "Хотя Индия долгое время управлялась как единая территория, имеет смысл рассматривать ее как две нации - одну индуистскую и одну мусульманскую. Раздел страны может быть не единственным ответом, но любая сделка для независимой Индии должна столкнуться с этой двойственной природой субконтинента."
 RAJ_princely_state_donations:0 "Государственные пожертвования Princely"
 RAJ_princely_state_donations_desc:0 "Княжеские штаты Индии предоставили солдат, которые долгое время служили основной индийской армией под командованием британцев. Дальнейшие пожертвования от этих местных правителей подчеркивают их поддержку Империи."
 RAJ_imperial_service_troops:0 "Имперские войска службы"
 RAJ_imperial_service_troops_desc:0 "Имперские войска набираются принцами Индии и могут насчитывать сотни тысяч человек. В эти трудные времена прекрасно знать, что Его Величество может рассчитывать на верность радж."
 RAJ_raf_funding:0 "Финансирование RAF"
 RAJ_raf_funding_desc:0 "Королевским военно-воздушным силам Индии будет предоставлено больше средств и средств из Великобритании."
 RAJ_navy_funding:0 "Финансирование ВМС"
 RAJ_navy_funding_effect:0 "§Y2 Легкие крейсера§! Вы будете добавлены в ваш флот, если у вас уже есть технология.\n"
 RAJ_navy_funding_effect_mtg:0 "§Y2 Легкие крейсера§! Этот тип будет добавлен к нашему флоту.\n"
 RAJ_navy_funding_desc:0 "Королевскому флоту Индии будет предоставлено больше средств и активов из Великобритании."
 RAJ_british_army_support:0 "Британская армия поддерживает"
 RAJ_british_army_support_desc:0 "Британская армия хорошо знает Индию после 200 лет оккупации. Они знают народ и землю, и смогут поддержать подготовку индийских солдат к бою у себя дома."
 RAJ_red_eagle_division:0 "Красный Орёл"
 RAJ_create_unit_red_eagles_tt:0 "В Дели сформирована элитная пехотная дивизия.\n"
 RAJ_red_eagle_division_desc:0 "Дивизия «Красный орел» станет первой индийской дивизией, которая будет обучена воевать за рубежом, готовой сражаться в суровых условиях. "
 RAJ_chindits:0 "Чиндиты"
 RAJ_orde_wingate_tt:0 "А. §Y4 Мастерство генерала§! названный §YОрда Уингейт§! Появится.\n"
 RAJ_chindits_desc:0 "Индии нужна дивизия спецназа, поэтому мы сформировали чиндитов, чтобы действовать в тылу врага в джунглях Азии. Это рискованная операция, которая будет иметь высокий уровень потерь, но может принести большую пользу военным усилиям."
 RAJ_jungle_training:0 "Подготовка к войне в джунглях"
 RAJ_jungle_training_effect:0 "Позволяет §HОбучение джунглям§!\n§HМорпехи\n    Джунгли§!\n      Атака: §G+5%§!\n      Движение: §G+10%§!\n§Hгорцы\n    Джунгли§!\n      Атака: §G+5%§!\n      Движение: §G+10%§!\n§HПарашютисты\n    Джунгли§!\n      Атака: §G+5%§!\n      Движение: §G+10%§!\n"
 RAJ_jungle_training_desc:0 "Индия, Бирма и Индокитай покрыты джунглями, и рекомендуется специальная подготовка, чтобы наши солдаты могли эффективно действовать на этой опасной местности."
 RAJ_lessons_of_the_great_war:0 "Уроки Великой войны"
 RAJ_lessons_of_the_great_war_desc:0 "Колониальные солдаты Индии участвовали в последней мировой войне, и уроки этого конфликта должны быть принесены на обучение и организацию армии."
 RAJ_indianisation_of_army:0 "Индианизация армии"
 RAJ_indianisation_of_army_desc:0 "Чтобы защитить Индию в тотальной войне, необходимо мобилизовать все население Индии. Это будет означать не только более широкое привлечение индийского населения, но и разрешение индийским офицерам взять на себя командование в каком-то месте в цепи полномочий."
 RAJ_indian_gurkhas:0 "Индийские гурхи"
 RAJ_indian_gurkhas_desc:0 "Гурхи Пенджаби и Непальского нагорья легендарны своим военным мастерством. Они преданно служили раджу в течение многих лет и преуспели во всех видах войны."
 RAJ_an_indian_sandhurst:0 "Индийский сандхерст"
 RAJ_an_indian_sandhurst_desc:0 "Индия требует собственную военную школу со времен последней войны, и в конце концов мы создали ее в 1932 году. Индийская военная академия уже несколько лет выпускает индийских офицеров, давая нам основную командную группу."
 RAJ_lions_of_the_great_war:0 "Львы Великой войны"
 RAJ_lions_of_the_great_war_desc:0 "Сикхи имеют сильную военную традицию и были высоко украшены в последней войне. Львы Пенджаба формируют сильный полк самостоятельно, и регион созрел для дальнейшей вербовки."
 RAJ_indian_gentlemen_officers:0 "Индийские джентльмены офицеры"
 RAJ_indian_gentlemen_officers_desc:0 "Джентльмены, которые служили раджу в тесном сотрудничестве с имперскими властями, являются готовым запасом командиров, если нам нужны верные люди, чтобы возглавить новую индийскую армию."
 RAJ_the_bangalore_torpedo:0 "Бангалорская торпеда"
 RAJ_the_bangalore_torpedo_desc:0 "Одним из величайших вкладов Британской Индии в военное искусство является Бангалорская торпеда, серия соединенных труб, которые могут быть использованы для уничтожения препятствий, пока инженеры находятся под огнем. Это устройство приобрело большую популярность во всем мире."
 RAJ_vickers_berthier_gun:0 "Оружие Виккерса-Бертье"
 RAJ_vickers_berthier_gun_desc:0 "Vickers-Berthier немного громоздкий, но имеет преимущество в том, что его легко быстро производить. Для такой страны, как Индия, это очень важная характеристика в оружии."
 RAJ_royal_indian_artillery:0 "королевский [ROOT.GetAdjective] артиллерия"
 RAJ_royal_indian_artillery_desc:0 "Королевская индийская артиллерия существует с тех пор, как Ост-Индская компания сформировала батальон пушек с индийскими артиллеристами в 1748 году. Мы можем использовать этот многолетний опыт."
 RAJ_army_motorization:0 "Моторизация армии"
 RAJ_army_motorization_desc:0 "Индия слишком велика, чтобы ее можно было эффективно покрыть поездом и лошадью. Армия должна иметь моторизованные дивизии и регулярный грузовой транспорт."
 RAJ_revive_the_screw_guns:0 "Скачать The Screw Guns"
 RAJ_revive_the_screw_guns_effect:0 "Открывает §Hгорное орудие§!\n§HАртиллерия§!:\n    Прорыв: §G+5%§!\n    §HГоры§!: атака: §G+10%§!\n§HПротивотанковая артиллерия§!:\n    Бронебойная атака: §G+5%§!\n    §HГоры§!: атака: §G+10%§!"
 RAJ_revive_the_screw_guns_desc:0 "Горная местность Северной Индии привела к разработке артиллерийского орудия, которое можно было демонтировать и переносить на мулабэке туда, где это было необходимо. Этот 7-пундер может быть немного устаревшим, но мы не должны игнорировать его полезность."
 mountain_guns_tt:0 "Позволяет §HГорный пистолет§!\n§HАртиллерия (горы)§!\n    Атака: §G+8%§!\n    Движение: §G+15%§!\n§HАнтитанк (горы)§!\n    Атака: §G+8%§!\n    Движение: §G+15%§!"
 RAJ_indian_armor:0 "Индийские доспехи"
 RAJ_indian_armor_desc:0 "Индия должна сосредоточиться на разработке собственной самодельной бронетанковой дивизии."
 RAJ_modernizing_army:0 "Модернизация армии"
 RAJ_modernizing_army_desc:0 "Слишком долго индийские вооруженные силы рассматривались как колониальный форпост, с небольшим количеством преимуществ и оборудования, доступных для домашней армии в Великобритании. Пришло время модернизировать то, что есть в Радже."
 RAJ_indian_defense_research:0 "Индийские оборонные исследования"
 RAJ_indian_defense_research_desc:0 "Теперь, когда Индия является полностью суверенной страной, мы больше не получаем доступ к передовым прототипам и чертежам, как это было раньше. Мы должны быть уверены, что всегда будем опережать своих врагов и не отстаем в технологиях."
 RAJ_british_pilot_training:0 "Британский пилотный тренинг"
 RAJ_british_pilot_training_desc:0 "Королевские военно-воздушные силы согласились принять индийских пилотов для обучения. Это образование будет большим подспорьем в развитии собственного воздушного крыла."
 RAJ_expand_air_bases:0 "Расширение авиабаз"
 RAJ_expand_air_bases_desc:0 "Индия очень большая, поэтому патрулирование и защита ее воздушного пространства означает, что мы должны увеличить наши воздушные возможности на базах по всему субконтиненту."
 RAJ_air_support_effort:0 "Усилия по авиационной поддержке"
 RAJ_air_support_effort_desc:0 "Комбинированная война — это новый способ ведения войны, поэтому мы должны сосредоточить некоторую энергию на обучении и производстве самолетов, которые могут поддерживать наземные и морские силы."
 RAJ_fighter_effort:0 "Усилия бойца"
 RAJ_fighter_effort_desc:0 "Нам нужны истребители для сопровождения бомбардировщиков и перехвата любых вражеских самолетов, которые угрожают нашей стране."
 RAJ_royal_indian_air_force:0 "Королевские ВВС Индии"
 RAJ_royal_indian_air_force_desc:0 "Настало время взять нашу небольшую воздушную дивизию и расширить ее на собственное подразделение вооруженных сил. Национальные военно-воздушные силы с независимым командованием смогут лучше служить индийскому народу и Империи."
 RAJ_the_smiling_buddha:0 "Улыбающийся Будда"
 RAJ_the_smiling_buddha_desc:0 "Ученые близки к раскрытию секрета атомной энергии - и это приведет к созданию очень мощных взрывчатых веществ. Мы не можем отставать в поисках атомного оружия."
 RAJ_great_indian_peninsula_railway:0 "Железная дорога Большого Индийского полуострова"
 RAJ_great_indian_peninsula_railway_desc:0 "Правительственный контроль над железной дорогой Большого Индийского полуострова в 1925 году означает, что ее расширение и улучшение падает на нас. Растущее население нуждается в лучшей транспортной инфраструктуре."
 RAJ_industrial_expansion:0 "Промышленное расширение"
 RAJ_industrial_expansion_desc:0 "Сотни миллионов людей называют Индию домом — нет никаких причин, по которым это население не должно быть основой промышленного гиганта."
 RAJ_tata_steel:0 "Tata Steel"
 RAJ_tata_steel_desc:0 "Tata Steel готовится стать крупнейшим производителем стали в империи. Увеличение производства будет способствовать дальнейшей модернизации Индии."
 RAJ_assam_oil:0 "Ассам Ойл"
 RAJ_assam_oil_desc:0 "Ассам является центром индийской нефтедобычи, особенно нефтеперерабатывающего завода в Дигбое. Необходимо расширить и использовать доступ к этому ресурсу."
 RAJ_indian_institute_of_science:0 "Индийский институт науки"
 RAJ_indian_institute_of_science_desc:0 "Кампус Индийского института науки в Бангалоре позволяет лучшему и ярчайшему населению Индии продвигаться вперед."
 RAJ_institute_of_fundamental_research:0 "Институт фундаментальных исследований"
 RAJ_institute_of_fundamental_research_desc:0 "Некоторые из наших ведущих ученых и промышленников выступают за новый Институт фундаментальных исследований, чтобы воспользоваться последними открытиями в области физических наук."
 RAJ_research_collaboration:0 "Научное сотрудничество"
 RAJ_research_collaboration_desc:0 "Англичане показали нам преимущество обмена научным прогрессом между близкими союзниками. Вся наша фракция сможет более эффективно проводить исследования и разработки военного времени, если мы предпримем шаги, необходимые для координации этого."
 RAJ_expand_mazagon_dock:0 "Расширить верфь «Мазагон Док»"
 RAJ_expand_mazagon_dock_desc:0 "Верфь «Мазагон Док» в Мумбаи — главный судостроитель западного побережья. В условиях мирового кризиса её мощности необходимо увеличить."
 RAJ_found_scindia_shipyard:0 "Основать верфь «Сциндия»"
 RAJ_found_scindia_shipyard_desc:0 "Нам нужна верфь на восточном побережье, поэтому создание предприятия «Сциндия» в Вишакхапатнаме станет разумным шагом для будущего флота."
 RAJ_royal_indian_navy:0 "Королевский индийский флот"
 RAJ_royal_indian_navy_desc:0 "Королевский индийский флот необходимо быстро расширить. Новые корабли и тактика должны стать приоритетом."
 RAJ_screening_effort:0 "Развитие сил охранения"
 RAJ_screening_effort_desc:0 "Индия играет важную роль в защите южного пути к Суэцкому каналу. Охранение и сопровождение помогут доставлять припасы и солдат на европейский и африканский театры."
 RAJ_cruiser_effort:0 "Развитие крейсеров"
 RAJ_cruiser_effort_desc:0 "На нынешнем этапе крейсеров будет достаточно для развития морской мощи Индии."
 RAJ_submarine_effort:0 "Подводные усилия"
 RAJ_submarine_effort_desc:0 "Рост японской надводной мощи в Азии заставляет обратить внимание на подводную войну и удары субмарин."
 RAJ_capital_ship_effort:0 "Развитие крупных кораблей"
 RAJ_capital_ship_effort_desc:0 "Будучи британским форпостом, Индия видела, как крупные корабли господствуют на море. Нам следует построить собственные тяжёлые крейсеры и линкоры."
 RAJ_modernizing_navy:0 "Модернизация флота"
 RAJ_modernizing_navy_desc:0 "Более совершенные двигатели, больше места для экипажа, высокая скорость и крупные орудия позволят индийскому флоту сравниться с лучшими в Азии."
 RAJ_east_india_railways:0 "Восточно-Индийские железные дороги"
 RAJ_east_india_railways_desc:0 "Правительственный контроль над Ост-Индской железной дорогой оставляет все решения о ее расширении и улучшении в руках наших министров."
 RAJ_integrate_princely_railways:0 "Интеграция железных дорог Princely"
 RAJ_integrate_princely_railways_desc:0 "Некоторые из индийских князей финансировали свои собственные железнодорожные системы, но до сих пор они плохо интегрировались с железнодорожными линиями, построенными раджем. Нужно что-то сделать, чтобы связать поезда страны."
 RAJ_ishapore_arsenal:0 "Ишапорский Арсенал"
 RAJ_ishapore_arsenal_desc:0 "Арсенал и стрелковая фабрика Ишапоре работают с 18-го века. Он отвечает за многие инновации в дизайне оружия и является центральным элементом нашей системы производства оружия."
 RAJ_clamp_down_on_corruption:0 "Уничтожить коррупцию"
 RAJ_clamp_down_on_corruption_desc:0 "Несмотря на усилия британской промышленности по расширению железнодорожной системы Индии, очень немногие из преимуществ расширения, кажется, приходят в Индию. В транспортном секторе существует эндемическая коррупция и двойные сделки, и мы должны быть замечены, чтобы что-то с этим сделать."
 RAJ_strengthen_ties_with_british_investors:0 "Укрепление связей с британскими инвесторами"
 RAJ_strengthen_ties_with_british_investors_desc:0 "Для расширения наших заводов и ресурсов мы по-прежнему в значительной степени полагаемся на британский капитал. Пока у нас нет собственного банковского сектора, мы должны идти на колени в Лондон, чтобы получить поддержку."
 RAJ_british_rail_investors:0 "Британские железнодорожные инвесторы"
 RAJ_british_rail_investors_desc:0 "Гражданская и транспортная инфраструктура Индии нуждается в больших денежных вливаниях от британских финансистов."
 RAJ_british_arms_investors:0 "Британские инвесторы в оружие"
 RAJ_british_arms_investors_desc:0 "Если мы хотим, чтобы наши оружейные заводы быстро двигались, нам нужно будет попросить британские банки инвестировать в нашу военную инфраструктуру."
 RAJ_indian_sandhurst_tt:0 "А. §Y4 Мастерство генерала§! названный §YКодандера Мадаппа Кариаппа§! Появится.\nА. §Y3 Мастерство генерала§! названный §YКодандера Субайя Тимайя§! Появится.\nА. §Y3 Мастерство генерала§! названный §YДжаянто Нат Чаудхури§! Появится."
 RAJ_create_unit_gurkas_tt:0 "Получите элитное подразделение гуркхов в Дели."
 RAJ_create_unit_rani_tt:0 "Найти пехотное подразделение в Дели."
 RAJ_create_unit_sikh_tt:0 "Найти пехотное подразделение в Дели."
 RAJ_create_general_rani_tt:0 "\nА. §Y3 Мастерство генерала§! названный §YЛакшми Сахгал§! появится"
 lemur_generic_focus:0 "Дополнительные непрерывные фокусы"
 continuous_naval_production:0 "Производство кораблей"
 continuous_naval_production_desc:0 "Сосредоточив ресурсы на верфях и освободив квалифицированных кораблестроителей от военной службы, мы сможем значительно сократить сроки строительства кораблей."
 continuous_air_production:0 "Авиационное производство"
 continuous_air_production_desc:0 "Мы можем реорганизовать авиационную промышленность, чтобы устранить потери и оптимизировать производство."
 continuous_non_factory_construct:0 "Строительная инженерия"
 continuous_non_factory_construct_desc:0 "В нашей строительной отрасли всё ещё имеются значительные неиспользованные резервы. Сосредоточив на ней внимание, мы сможем существенно повысить скорость строительства. К сожалению, производство станков оказалось главным узким местом при расширении тяжёлой промышленности, поэтому усилия в этой области не принесут ей пользы. "
 continuous_reduce_training_time:0 "Подготовка армии"
 continuous_reduce_training_time_desc:0 "Создав в каждой дивизии специализированные подразделения углублённой подготовки, мы сможем отправлять на фронт даже те дивизии, которые прежде задерживались в тылу до окончания обучения."
 continuous_suppression:0 "Подавление сопротивления"
 continuous_suppression_desc:0 "Внедрившись в крупнейшие группы сопротивления на оккупированных территориях и завербовав их руководителей, мы сможем значительно сократить наносимый ими ущерб."
 continuous_repair:0 "Ремонт сооружений"
 continuous_repair_desc:0 "Мы сформируем специализированные ремонтные бригады из работников заводов и строительной отрасли и централизованно организуем их развёртывание, чтобы ускорить восстановление повреждённой инфраструктуры."
 continuous_tech_share:0 "Обмен технологиями"
 continuous_tech_share_desc:0 "Мы будем поощрять наши научно-исследовательские институты и университеты к тому, чтобы они обращались к своим коллегам в странах-союзниках. Это даст нам бонус за обмен технологиями."
 continuous_boost_freedom:0 "Расширение автономии"
 continuous_boost_freedom_desc:0 "Реорганизовав колониальную бюрократию и привлекая местных администраторов, со временем мы сможем самостоятельно распоряжаться собственными делами."
 continuous_restrict_freedom:0 "Подавление субъектов"
 continuous_restrict_freedom_desc:0 "Нашим колониальным субъектам пришли в голову довольно нелепые идеи о таких вещах, как \"самоопределение\" или \"национальная независимость\". Пора избавить их от этих заблуждений."
 subject_autonomy_mod_tt:0 "Автономность в предметах: §G-0.5§!"
 continuous_special_facility:0 "Строительство объекта"
 continuous_special_facility_desc:0 "У нас есть возможность улучшить наши исследовательские центры, чтобы принять больше ученых, чтобы найти новый прорыв, который может изменить наше будущее."
 unlocks_decision:0 "Решение Unlocks: "
 USA_continue_the_new_deal:1 "Продолжить новый курс"
 USA_continue_the_new_deal_desc:1 "Политика Нового курса доказала свою эффективность. Мы не должны сейчас сбиться с пути."
 USA_suspend_the_presecution:0 "Приостановить преследование"
 USA_suspend_the_presecution_desc:0 "Преследование американских граждан за их политические взгляды, какими бы отвратительными они ни казались, в корне расходится с ценностями этой страны. Она должна быть немедленно прекращена."
 USA_desegregate_the_armed_forces:1 "Десегрегация вооруженных сил"
 USA_desegregate_the_armed_forces_desc:1 "Служить под оружием в вооруженных силах своей страны может быть нежелательным долгом, но это также может быть заветным правом. Это право, в котором многим нашим гражданам отказывают из-за их происхождения."
 USA_full_desegregation:1 "Полная десегрегация"
 USA_full_desegregation_desc:1 "Слишком долго некоторые наши государства относились к людям по-разному, исходя из старых, устаревших и бесчеловечных критериев. В свободной республике к каждому гражданину нужно относиться одинаково, а не по отдельности."
 USA_democratic_socialism_focus:1 "Демократический социализм"
 USA_democratic_socialism_focus_desc:1 "Ни один здравомыслящий человек не может отрицать, что социализм — это будущее человеческой цивилизации. В то же время ни один гордый и патриотичный гражданин этой республики не может поддерживать систему, в которой правительство больше не создается народом и народом. Как и наши гордые предки, мы создадим новую форму правления, которая объединит оба."
 USA_liberty_for_the_philippines:1 "Свобода для Филиппин"
 USA_liberty_for_the_philippines_desc:1 "Народ Филиппин продемонстрировал свою способность организовывать свои собственные дела, и настало время, чтобы последние остатки американского контроля над их страной были официально удалены."
 USA_pacific_decolonisation:1 "Тихоокеанская деколонизация"
 USA_pacific_decolonisation_desc:1 "Нет никакого оправдания — ни одного — для продолжающегося присутствия европейских держав в Тихом океане, ни для удержания народов тихоокеанских островов в рабстве у своих европейских хозяев. Америка больше не будет сидеть сложа руки, пока продолжается эта несправедливость."
 USA_union_representation_act:1 "Закон о представительстве Союза"
 USA_union_representation_act_desc:1 "Труд является неотъемлемой частью человеческой жизни, а объединение в союз является фундаментальной частью организации демократического общества. Мы должны признать это и обеспечить обязательное представительство профсоюзов в Конгрессе."
 USA_old_age_pension_act:1 "Пенсионный закон о престарелых"
 USA_old_age_pension_act_desc:1 "После всей жизни работы наши люди заслуживают того, чтобы в старости пользоваться финансовой безопасностью и уважением. То, что существует для их поддержки, явно недостаточно."
 USA_accumulated_wealth_tax_act:1 "Накопленный закон о налоге на богатство"
 USA_accumulated_wealth_tax_act_desc:1 "Некоторые люди в нашей стране накопили нелепые суммы капитала. Эти деньги пассивно лежат на банковских счетах или инвестируются в непрактично большие здания, позолоченную мебель и дорогие картины. Ни один из них не служит жизнеспособной экономической цели. Вводя новый налог, мы заставим тех наших граждан, которые накопили такое бесполезное богатство, реинвестировать деньги в экономику."
 USA_guarantee_the_american_dream:1 "Гарантия американской мечты"
 USA_guarantee_the_american_dream_desc:0 "Большинство наших людей не желают многого в жизни: стабильной работы, хорошего здоровья и места для создания семьи. Нет никаких причин, почему они не должны иметь этого."
 USA_worker_management_act:1 "Закон об управлении рабочими"
 USA_worker_management_act_desc:1 "Слишком часто фабриками и офисами управляют люди, которые никогда не работали на цехе. Не понимая реалий производства, они задают нереалистичные ожидания. Чтобы защитить нашу экономику от ущерба, который могут нанести такие некомпетентные менеджеры, мы будем обеспечивать управление рабочими для рабочих!"
 USA_militia_organization_act:1 "Закон об организации милиции"
 USA_militia_organization_act_desc:1 "Наша гордая республика имеет давние традиции гражданского солдата. Если в нашу страну когда-нибудь вторгнется иностранный нападающий, они столкнутся с хорошо организованной и хорошо вооруженной милицией мужчин и женщин, сражающихся на знакомой территории, чтобы защитить свои дома."
 USA_communal_property_act:1 "Закон о коммунальной собственности"
 USA_communal_property_act_desc:1 "Потребности многих никогда не должны перевешиваться желаниями немногих или даже одного. Для того, чтобы это произошло, мы примем новое законодательство, которое позволит местным общинам более легко выполнять выдающиеся домены."
 USA_reintegration:1 "Реинтеграция"
 USA_reintegration_desc:1 "Война разделила нашу нацию, но в конце концов даже те, кто восстал против нас, все еще могут быть искуплены. Когда население поймет, что его пути ошибочны, ему будет позволено вновь присоединиться к политическому процессу в нашей гордой республике."
 USA_reach_out_to_the_ware_group:1 "Обсуждение Ware Group"
 USA_reach_out_to_the_ware_group_desc:1 "В нашем правительстве есть небольшая группа преданных коммунистов. Они считают, что действуют тайно, но мы знаем их имена. Возможно, они увидят, что наша цель совпадает, и их можно будет убедить присоединиться к правительству."
 USA_us_ussr_economic_cooperation:1 "Экономическое сотрудничество США и СССР"
 USA_us_ussr_economic_cooperation_desc:1 "Несмотря на хаотичное и кровавое рождение, Советский Союз добился значительного прогресса в построении современного индустриального общества. Мы должны внести свой вклад, чтобы помочь им."
 USA_secure_china:1 "Безопасный Китай"
 USA_secure_china_desc:1 "Китай охвачен долгой, кровавой гражданской войной. Националистическое правительство глубоко коррумпировано и потеряло всякую поддержку населения. Настало время поддержать единственного действующего лица в Китае, который может объединить и усмирить страну - Коммунистическую партию."
 USA_end_monarchism:1 "Конец монархии"
 USA_end_monarchism_desc:1 "Монархии Европы уже ввергли мир в одну мировую войну — мы не можем позволить им сделать это снова. Наши предки воевали с королем Англии, чтобы получить свободу - мы навсегда освободим мир от его тирании!"
 USA_shatter_the_empires:1 "Разрушить империи"
 USA_shatter_the_empires_desc:1 "Когда-то мы были колонией глобальной империи, пока не приобрели свою свободу в крови. Наша республика не может по-настоящему чувствовать себя в безопасности до тех пор, пока в ней не будут заключены те, кто мечтает стать хозяевами этого мира."
 USA_agricultural_adjustment_act:1 "Закон о сельскохозяйственной корректировке"
 USA_agricultural_adjustment_act_desc:1 "Наши фермеры особенно сильно пострадали от депрессии. Мы должны обеспечить, чтобы люди, которые производят нашу еду, не были вытеснены из бизнеса неконтролируемым рынком."
 USA_fair_labour_standards_act:1 "Закон о справедливых трудовых стандартах"
 USA_fair_labour_standards_act_desc:1 "При первых признаках медленного восстановления настало время обеспечить участие в нем рабочих. Мы должны запретить эксплуататорскую практику, такую как неоплачиваемая сверхурочная работа, и ввести приемлемую минимальную заработную плату."
 USA_federal_housing_act:1 "Федеральный жилищный закон"
 USA_federal_housing_act_desc:1 "В рамках наших постоянных усилий по искоренению нищеты в Соединенных Штатах мы создадим программу федерально субсидируемого жилья."
 federal_housing_tt:0 "(§YПять случайных состояний§!Добавить §G1§! Строительство слотов."
 USA_office_of_scientific_research_and_development:1 "Офис научных исследований и разработок"
 USA_office_of_scientific_research_and_development_desc:1 "На горизонте маячит война, и мы должны сосредоточить наши научные усилия на том, чтобы ни один потенциальный противник не превзошел нас."
 USA_focus_on_europe:1 "Сосредоточься на Европе"
 USA_focus_on_europe_desc:1 "Великие державы Европы вновь готовы ввергнуть мир в мировую войну. Мы не можем, как это было раньше, ждать, пока это повлияет на нас. Мы должны быть готовы к решительному вмешательству, если какая-либо нация в Европе будет угрожать миру."
 USA_focus_on_asia:1 "Сосредоточься на Азии"
 USA_focus_on_asia_desc:1 "В то время как большинство людей с беспокойством смотрят на Европу, мы также сталкиваемся с неопределенностью и нестабильностью в Тихом океане. Возможно, в наших интересах вмешаться за границей, прежде чем мы нападем ближе к дому."
 USA_magic:1 "волшебный"
 USA_magic_desc:1 "ВМФ считает, что это может нарушить японские коды шифрования, которые позволят нам считывать весь их трафик сообщений, включая движения кораблей."
 USA_neutrality_act:1 "Закон о нейтралитете"
 USA_neutrality_act_desc:1 "Все больше уверенности в том, что в Европе разразится война. Во время Великой войны американские компании продавали союзникам большое количество оружия, и многие считают, что вступление американцев было в основном мотивировано желанием обеспечить оплату этих поставок. На этот раз не будет никакой военной прибыли."
 USA_lend_lease_act_neutrality_tt:0 "\n\nПринятие закона о нейтралитете будет §Rрезко увеличить§! Требования к принятию Закона о ленд-лизе"
 USA_lend_lease_act:1 "Закон об аренде"
 USA_lend_lease_act_desc:1 "Крупные демократические государства мира подвергаются нападкам. Если они проиграют битву, то вопрос лишь в том, когда война придет к нашим берегам. Мы должны сделать все возможное, чтобы поддержать их, даже если они не могут немедленно оплатить оборудование."
 USA_reestablish_the_gold_standard:1 "Восстановить золотой стандарт"
 USA_reestablish_the_gold_standard_desc:1 "Без золотого стандарта деньги существуют не более чем вероисповедание, в то время как безудержная инфляция съедает сбережения наших людей и обесценивает их работу. Мы должны отказаться от этого безответственного в финансовом отношении пути."
 USA_adjusted_compensation_act:1 "Скорректированный закон о компенсации"
 USA_adjusted_compensation_act_desc:1 "Нашим ветеранам Великой войны обещали справедливую пенсию. Многие из них в последнее время пережили тяжелые времена, когда началась депрессия. Мы должны сделать все возможное, чтобы помочь тем, кто откликнулся на призыв Республики в час нужды."
 USA_labour_management_relations_act:1 "Закон об отношениях между трудовыми ресурсами и управлением"
 USA_labour_management_relations_act_desc:1 "Предприятиям по всей Америке угрожают всевозможные профсоюзные мероприятия - забастовки, организация, требования повышения заработной платы. Мы не можем допустить, чтобы это продолжалось."
 USA_protectionist_tariffs:1 "Протекционистские пошлины"
 USA_protectionist_tariffs_desc:1 "Свободная торговля открыла наши рынки для иностранных конкурентов, многие из которых повысили собственные тарифы и пошлины. Наши компании сталкиваются с жесткой конкуренцией, в то время как они пользуются безопасностью таможенной стены. Это должно закончиться."
 USA_income_tax_reform:2 "Реформа подоходного налога"
 USA_income_tax_reform_desc:1 "Налог на прибыль забирает деньги из кошелька каждого американца — деньги, которые наши граждане могли бы потратить на покупку других вещей и поддержку своей местной экономики. Мы вернем американцам автономию над их собственными финансами."
 USA_institute_of_american_sciences:1 "Американский институт наук"
 USA_institute_of_american_sciences_desc:1 "Университеты и исследовательские лаборатории по всей стране до сих пор проводили свои исследования так, как они считали нужным. Это должно закончиться. Мы создадим новую организацию для координации усилий наших ученых мирового уровня."
 USA_america_first:0 "Америка первая"
 USA_america_first_desc:2 "Некоторые люди хотели бы, чтобы мы тратили наши сокровища и кровь нашей молодежи на иностранные войны. Мы не должны поддаваться влиянию этих поджигателей войны и вместо этого будем жить по простой максиме: Америка прежде всего — все остальные во втором."
 USA_extend_the_chinese_exclusion_acts:1 "Продление китайских законов об исключении"
 USA_extend_the_chinese_exclusion_acts_desc:2 "Поскольку Китай разорён войной, мы должны принять меры по ограничению китайской иммиграции, чтобы не утонуть в волнах беженцев."
 USA_empower_the_huac:1 "Уполномочить Huac"
 USA_empower_the_huac_desc:1 "Комитет Палаты представителей по делам неамериканской деятельности выполняет важную функцию в нашей здоровой демократии. Мы не должны допустить, чтобы нелояльные элементы пытались повлиять на политический процесс."
 USA_voter_registration_act:1 "Закон о регистрации избирателей"
 USA_voter_registration_act_desc:1 "Выборы являются самой важной частью демократии. Совершенно неразумно требовать, чтобы не было никаких проверок того, кто может в них участвовать — или, возможно, люди, которые выступают за неконтролируемые выборы, имеют более зловещие мотивы и хотят подорвать процесс фальсификацией голосования."
 USA_ally_with_the_silver_shirts:1 "Элли с серебряными рубашками"
 USA_ally_with_the_silver_shirts_desc:1 "Для того чтобы вернуть нашей нации ее надлежащее место в мире и претендовать на нашу явную судьбу, необходима более фундаментальная реорганизация. Серебряные рубашки помогут нам в этом."
 USA_national_prosperity_program:1 "Национальная программа процветания"
 USA_national_prosperity_program_desc:1 "Ключ к обеспечению быстрого восстановления и прочного процветания лежит не в неконтролируемых рынках, а в тщательно управляемых программах, соединяющих частные и государственные предприятия."
 USA_privatize_the_TVA:1 "Приватизировать ТВА"
 USA_privatize_the_TVA_desc:1 "Администрация долины Теннесси вытеснила частную конкуренцию и установила мертвую хватку на строительных работах в этом районе. Не может быть задачей правительства делать то, что частный сектор доказал, что делает лучше."
 USA_de_regulate_the_banking_sector:1 "Дерегулирование банковского сектора"
 USA_de_regulate_the_banking_sector_desc:1 "После коррекции на финансовых рынках, которая является совершенно нормальной в экономическом цикле, предыдущие правительства ввели довольно необоснованные ограничения на финансовую деятельность. Несмотря на то, что эти ограничения, несомненно, имеют благие намерения, они приносят больше вреда, чем пользы."
 USA_national_employment_strategy:1 "Национальная стратегия занятости"
 USA_national_employment_strategy_desc:1 "Безработица возникает из простого факта: люди не соответствуют предлагаемым рабочим местам. Заводы простаивают, потому что работодатели не находят нужных им людей, в то время как люди в других частях страны голодают. Мы введем новую стратегию, которая обеспечит, чтобы любой работодатель мог найти людей, которые ему нужны для управления его компанией."
 USA_invite_foreign_support:1 "Пригласить иностранную поддержку"
 USA_invite_foreign_support_desc:1 "В связи с поступающими тревожными сообщениями о лояльности военных и некоторых правительств штатов нам, возможно, придется искать поддержку за рубежом."
 USA_send_lindbergh_to_germany:1 "Отправить Линдберга в Германию"
 USA_send_lindbergh_to_germany_desc:1 "Знаменитый летчик предложил отправиться в Европу, чтобы расследовать, как Германия восстановила себя после последней войны. Это должно дать нам ценный опыт. Линдберг также заявил, что готов присоединиться к правительству в качестве консультанта."
 USA_work_with_the_bund:1 "Работа с Бундом"
 USA_work_with_the_bund_desc:1 "Немецко-американский Бунд предложил помочь нам донести наши позиции до многих американцев немецкого происхождения. Это обеспечит нам сочувственную базу в их государствах."
 USA_work_with_the_bund_tt:0 "Обеспечивает, чтобы следующие государства оставались с правительством в случае гражданской войны: Огайо, Миссури, Висконсин, Иллинойс, Индиана и Мичиган."
 USA_recruit_the_free_corps:1 "Нанять свободный корпус"
 USA_recruit_the_free_corps_desc:1 "С военными все чаще приходится обращаться к героям Великой войны. В час нужды на помощь Германской республике пришли германские фрейкорпы. Нам нужна подобная организация, которая будет оставаться верной нам, когда придет наш час нужды."
 USA_honor_the_confederacy:1 "Почитать Конфедерацию"
 USA_honor_the_confederacy_desc:1 "Слишком долго рассказывалась история Гражданской войны с северной точки зрения — история обреченного восстания. Пришло время услышать и другую сторону."
 USA_war_powers_act:1 "Закон о военных полномочиях"
 USA_war_powers_act_desc:1 "В мире все более быстрых самолетов, несущих все большие бомбовые нагрузки, в мире подводных лодок и химического оружия ограничение президента требовать согласия Конгресса на то, чтобы сделать то, что необходимо для защиты страны, вызывает катастрофу."
 USA_seize_cuba:1 "Захватить Кубу"
 USA_seize_cuba_desc:1 "Прямо у наших берегов лежит непотопляемый авианосец, готовый служить базой для агрессора. Мы не должны допустить этого."
 USA_eliminate_the_southern_threat:1 "Устранить южную угрозу"
 USA_eliminate_the_southern_threat_desc:1 "Мексика была нестабильной страной для последнего поколения. Не имеет значения, распространяется ли насилие на нашу границу или кто-то объединяет страну и идет на север - мы должны обеспечить наш южный фланг."
 USA_the_canadian_corridor:1 "Канадский коридор"
 USA_the_canadian_corridor_desc:1 "Небольшая полоса малонаселенной канадской территории отделяет Аляску от нижней части США. Поэтому его оборона зависит от канадской доброй воли. Наиболее вероятным нападающим является Канада. Это не может продолжаться."
 USA_north_american_dominion:1 "Североамериканский доминион"
 USA_north_american_dominion_desc:1 "Поскольку наши непосредственные границы находятся в безопасности, мы должны смотреть дальше, чтобы предотвратить любую угрозу для Северной Америки. Мы не можем терпеть ни одного государства-изгоя в регионе."
 USA_strategic_interests:1 "Стратегические интересы"
 USA_strategic_interests_desc:1 "Мир более связан, чем когда-либо прежде. Угроза в одной его части может легко расти, пока она не станет опасностью для всего мира. Мы должны создать сеть взаимоподдерживающих баз по всему миру, чтобы мы могли быстро реагировать на любую ситуацию."
 USA_protect_south_america:1 "Защита Южной Америки"
 USA_protect_south_america_desc:1 "Южная часть нашего двойного континента была игровой площадкой империй с тех пор, как она была обнаружена. Настало время, чтобы кто-то взял на себя ответственность за то, чтобы эти страны были спокойны и направлялись к более продуктивному будущему."
 USA_pacific_pacification:1 "Тихий океан"
 USA_pacific_pacification_desc:1 "Австралия и Новая Зеландия находятся слишком далеко от Великобритании, чтобы их можно было эффективно защитить. Мы не можем позволить, чтобы их захватила враждебная нации. [USA.GetNameDef]."
 USA_secure_asia:1 "Безопасная Европа"
 USA_secure_asia_desc:1 "Колониальные страны Европы либо не хотят, либо не могут эффективно защищать свои азиатские колонии. Мы должны взять на себя это бремя, чтобы эти районы не стали плацдармами дальнейшей агрессии."
 USA_global_hegemony:1 "Глобальная гегемония"
 USA_global_hegemony_desc:1 "Мы стоим на пороге достижения позиции глобального превосходства, которая позволит нам предотвратить конфликт только благодаря нашему существованию. Мы просто должны убедиться, что оставшиеся великие державы на планете признают нашу позицию."
 USA_war_plans_division:1 "Отдел военных планов"
 USA_war_plans_division_desc:1 "Хотя мы можем желать мира, мы должны готовиться к войне."
 USA_intervention_in_the_americas:1 "Вмешательство в Америку"
 USA_intervention_in_the_americas_desc:1 "Наша первая задача должна состоять в том, чтобы быть готовыми к любому развитию событий в нашем собственном полушарии."
 USA_war_plan_green:1 "План войны Зеленый"
 USA_war_plan_green_desc:1 "Поскольку Мексика находится в состоянии постоянной нестабильности после революции, мы должны быть готовы к решительному вмешательству."
 USA_war_plan_crimson:1 "Военный план Crimson"
 USA_war_plan_crimson_desc:1 "Хотя Канада сейчас может быть дружественным соседом, это не всегда так."
 USA_war_plan_gray:1 "Военный план Грей"
 USA_war_plan_gray_desc:1 "История показала, что страны Карибского бассейна довольно нестабильны. Возможно, нам придется действовать быстро, чтобы защитить американские интересы, если кто-то из них впадет в нестабильность."
 USA_hemisphere_defense:1 "Защита полушария"
 USA_hemisphere_defense_desc:1 "Независимо от каких-либо внешних запутанностей, мы должны в первую очередь смотреть на наш собственный район."
 USA_intervention_in_europe:1 "Вмешательство в Европу"
 USA_intervention_in_europe_desc:1 "Менее чем через два десятилетия после окончания Великой войны народы Европы вновь готовы к войне. Мы должны быть готовы, если ситуация потребует оперативного вмешательства."
 USA_war_plan_gold:1 "Военный план Золото"
 USA_war_plan_gold_desc:1 "Франция страдает от внутреннего раскола и растущего политического радикализма, но также является одной из величайших военных держав Европы. Такое сочетание делает многих людей неудобными."
 USA_war_plan_silver:0 "Военный план Silver"
 USA_war_plan_silver_desc:0 "Италия открыто заявила о своем стремлении править Средиземноморьем. Если их желания империи противоречат нашим интересам, мы должны быть готовы."
 USA_anti_bolshevist_aid:2 "Антисемит [GetSovietThreatNameAlt] Помощь"
 USA_anti_bolshevist_aid_desc:2 "Любое оружие, снаряд, пуля и пара ботинок мы можем дать тем, кто борется с распространением оружия. [GetSovietThreatNameAlt] Угроза в конечном итоге поможет нам защититься."
 USA_war_plan_ruby:1 "Военный план Руби"
 USA_war_plan_ruby_desc:1 "В Индии проживают несметные миллионы людей, с которыми мы должны быть готовы столкнуться в случае конфликта."
 USA_war_plan_scarlet_garnet:1 "Военный план Алый гранат"
 USA_war_plan_scarlet_garnet_desc:1 "В Тихом океане Австралия и Новая Зеландия вполне могут прийти на помощь своей родине. Любой план по урегулированию с Британией должен учитывать ее колонии."
 USA_intervention_in_asia:1 "Вмешательство в Азию"
 USA_intervention_in_asia_desc:1 "Часто омраченная событиями в Европе, Азия имеет свои собственные проблемные места, вынуждающие нас готовиться к интервенции."
 USA_war_plan_yellow:1 "Желтый план войны"
 USA_war_plan_yellow_desc:1 "Китай находится в состоянии гражданской войны уже не одно поколение. Неизвестно, когда ситуация ухудшится до такой степени, что нам придется вмешаться."
 USA_war_department:1 "Военный департамент"
 USA_war_department_desc:1 "В эпоху индустриализированной войны мы должны иметь администрацию, способную использовать ресурсы нашей великой нации в полной мере."
 USA_selective_training_act:1 "Закон о селективном обучении"
 USA_selective_training_act_desc:1 "Соединенные Штаты исторически не спешили принимать проект, даже во время войны. Мы больше не можем позволить себе такую роскошь."
 USA_louisiana_maneuvers:1 "Маневры Луизианы"
 USA_louisiana_maneuvers_desc:1 "Бюджетные ограничения заставили нас наблюдать за многими военными событиями издалека. Теперь мы можем, наконец, опробовать некоторые из наших теорий на практике."
 USA_airborne_divisions:1 "Воздушно-десантные дивизии"
 USA_airborne_divisions_desc:1 "Разработки в дальности и полезной нагрузке самолетов открыли ряд возможностей. Грузовые самолеты могли бы доставить полную дивизию войск далеко за линией фронта противника, где они нанесли бы ущерб."
 USA_army_of_the_united_states:1 "Армия Соединенных Штатов"
 USA_army_of_the_united_states_desc:1 "Для предстоящих боев армия США слишком мала. Для того, чтобы наблюдать за резким увеличением размера, мы должны будем создать новую организацию."
 USA_womens_armed_service_integration_act:1 "Закон об интеграции женской военной службы"
 USA_womens_armed_service_integration_act_desc:1 "Мы не можем позволить себе отвернуться от тех, кто хочет служить. Каждая женщина в военной форме освобождает мужчину для борьбы на фронте."
 USA_tank_experiments:1 "Танковые эксперименты"
 USA_tank_experiments_desc:1 "Танки незаменимы на современном поле боя. Мы должны выяснить, как их лучше всего использовать."
 USA_tank_destroyer_doctrine:1 "Доктрина разрушителя танков"
 USA_tank_destroyer_doctrine_desc:1 "Противоречивая теория, разработанная некоторыми офицерами артиллерии, утверждает, что лучшее оружие против броневых прорывов — это быстрая, легкобронированная, но сильно вооруженная машина."
 USA_main_battle_tanks:1 "Основные боевые танки"
 USA_main_battle_tanks_desc:1 "Опыт на местах ясно показал, что танк должен уметь выполнять большое количество задач, от поддержки пехоты до борьбы с танками противника. Проектирование транспортных средств для удовлетворения этих потребностей позволяет нам оптимизировать производство."
 USA_armored_infantry:1 "Бронированная пехота"
 USA_armored_infantry_desc:1 "Танки сами по себе не могут выиграть бой. Для захвата территории требуется пехота. Предоставление им бронетехники позволяет им идти в ногу с танками и пережить все, что бросается в них."
 USA_build_the_pentagon:1 "Построить Пентагон"
 USA_build_the_pentagon_desc:1 "Расширение наших вооруженных сил требует новой глобальной штаб-квартиры, чтобы командовать ею."
 USA_department_of_defense:1 "Министерство обороны"
 USA_department_of_defense_desc:1 "Переименование военного ведомства подчеркивает, что мы больше не можем игнорировать нашу защиту до тех пор, пока она не будет проверена. Мы всегда должны быть бдительными."
 USA_escort_fighters:1 "Эскорт-истребители"
 USA_escort_fighters_desc:1 "В то время как бомбардировщик всегда может прорваться, его ведомый может и не прорваться - если только они оба не защищены дружественными бойцами."
 USA_us_army_airforce:1 "Военно-воздушные силы США"
 USA_us_army_airforce_desc:1 "Основная цель военно-воздушных сил состоит в том, чтобы позволить сухопутным войскам взять и удержать землю. Все остальное — вспомогательное."
 USA_us_air_force:1 "Военно-воздушные силы США"
 USA_us_air_force_desc:1 "Основная цель военно-воздушных сил — выигрывать войны. Стратегические бомбардировки с применением все более разрушительного оружия либо сломают волю противника к сопротивлению, либо сделают его материально неспособным сделать это."
 USA_two_ocean_navy_act:1 "Закон о двух морских океанах"
 USA_two_ocean_navy_act_desc:1 "В условиях войны на горизонте мы должны обеспечить, чтобы ни один враг не смог ступить на американские берега. Наш флот должен быть в состоянии сражаться с любым врагом в любом из двух великих океанов, которые образуют наши границы."
 USA_maritime_commission:1 "Морская комиссия"
 USA_maritime_commission_desc:1 "В то время как большинство мирян сосредоточены только на военных кораблях, истинные эксперты знают, что именно скромное грузовое судно выигрывает войны. Чтобы увеличить количество судов, доступных во время войны, мы создадим специальную доску для координации строительства."
 USA_advanced_basing:1 "Продвинутая база"
 USA_advanced_basing_desc:1 "Чем дальше мы сможем удержать врага от наших берегов, тем лучше."
 USA_naval_radar:1 "Морской радар"
 USA_naval_radar_desc:1 "Радар предлагает захватывающие возможности, чтобы укрыться ночью от наших врагов и обнаружить их даже в плохую погоду."
 USA_fleet_submarines:1 "Подводные лодки флота"
 USA_fleet_submarines_desc:1 "Наши наиболее вероятные противники в морской войне полагаются на внешнюю торговлю, которая оказалась очень уязвимой для подводных лодок. Эти подводные лодки должны иметь очень большую дальность, чтобы они могли пересекать океаны и действовать вблизи берега противника."
 USA_unrestricted_submarine_warfare:1 "Неограниченная подводная война"
 USA_unrestricted_submarine_warfare_desc:1 "История показала, что любой договор, который был бы направлен на борьбу с подводными лодками, не стоит бумаги, на которой он написан. Мы не должны считать себя связанными чем-то, что наши враги будут игнорировать в любом случае."
 can_degaussing_tech:0 "Получить технологию Degaussing"
