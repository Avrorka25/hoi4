l_russian:
 ETH_recall_balco_safo_decision:0 "Отозвать из отставки $ETH_balcho_safo$"
 ETH_recall_balco_safo_decision_desc:0 "$ETH_balcho_safo$ может быть суровым противником императорских планов по реформированию и централизации [ROOT.GetName]. Но в то же время он герой, сражавшийся и в битве при Мэкэле, и в славной победе при Адуа. Кроме того, он популярен среди народа, поэтому, попросив его вновь взяться за оружие ради [ROOT.GetName], мы получим не только опытного командира, но и, вероятно, множество новых солдат под наши знамёна."
 balcho_safo_recalled_tt:0 "Получить 1 подразделение §Y$irregular_infantry$§!."
 ETH_bop_increase_mesafint_privileges:0 "Увеличить привилегии мэсафынт"
 ETH_bop_increase_mesafint_privileges_desc:1 "Местные расы лучше всего подходят для управления регионами. Центральной власти в [ROOT.capital.GetCapitalVictoryPointName] не следует заниматься мелочами. Однако нужно действовать осторожно: если продвигаться слишком быстро, они воспользуются своей властью, чтобы окончательно освободиться."
 ETH_bop_increase_the_power_of_the_mekwanint:0 "Увеличить влияние мэкуаннынт"
 ETH_bop_increase_the_power_of_the_mekwanint_desc:1 "Назначенным министрам необходимо предоставить больше власти над местными делами. Следует постепенно передавать полномочия от мэсафинтов к мэкванынтам, перенося контроль к центральному правительству и [ROOT.GetLeader]. Разумеется, это разгневает расов, но без этого невозможно построить сильную [ROOT.GetName]."
 ETH_bop_privileges_changed:0 "С момента последнего изменения привилегий прошло меньше года"
 ETH_bop_increase_anarchist_influence:0 "Повысить поддержку анархистов"
 ETH_bop_increase_communist_influence:0 "Повысить поддержку коммунистов"
 ETH_bop_increase_anarchist_influence_desc:0 "Необходимо обеспечить анархистам достаточное влияние, чтобы центральное правительство больше не смогло ограничивать права народа. Следует начать пропагандистскую кампанию и укрепить поддержку нашего дела среди населения."
 ETH_bop_increase_communist_influence_desc:0 "Необходимо обеспечить коммунистам влияние на решения центрального правительства. Следует начать пропагандистскую кампанию и укрепить поддержку нашего дела среди населения, пока страна не развалилась."
 ETH_placeholder_political_category:0 "ЗАПОЛНИТЕЛЬ — БУДЕТ УДАЛЁН"
 ETH_placeholder_political_category_desc:0 "ЗАПОЛНИТЕЛЬ — БУДЕТ УДАЛЁН\n— Децентрализация / централизация: [GetPlaceholderBopText]"
 war_escalation_text:0 "£generic_war_escalation_text_icon Уровень эскалации войны: §Y[?ETH.ETH_war_escalation_level]§!"
 war_escalation_level_tt:1 "§YТекущая эскалация войны§!\nУровень эскалации со временем растёт, а также повышается из-за различных действий Италии.\n\nПродолжительность войны: §Y+[?ETH.ETH_escalation_time_increase_total]§!\nИталия начала крупное наступление (+1) [GetItalianRenewedOffensiveText]\n\nИталия задействовала не менее 25 регулярных дивизий (+1) [GetItalian20DivisionsText]\n\nИталия задействовала не менее 300 самолётов (+1) [GetItalianAircraftsText] [GetDefendTheNorthMissionText][GetDefendTheSouthMissionText][GetDefendHararMissionText][GetDefendTheCapitalMissionText]"
 war_escalation_icon_tt:1 "§YЭскалация войны§!\nЭффекты повышения эскалации войны по уровням:\n Уровень 3:\n §YЛига Наций§!: открыта возможность запросить эмбарго.\n §YЭфиопия§!: растёт международная репутация\nУровень 4:\n §YЛига Наций§!: открыта закупка вооружения.\n §YИталия§!: итальянское общество обеспокоено\nУровень 5:\n §YЛига Наций§!: открыто закрытие Суэца.\n §YИталия§!: Африканская армия деморализована\nУровень 6:\n §YЛига Наций§!: открыты интернациональные бригады.\n §YЭфиопия§!: повышен боевой дух армии\n §YИталия§!: волнения в колониях\nУровень 7:\n §YЛига Наций§!: открыто международное посредничество.\n §YИталия§!: итальянское общество сомневается в войне\nУровень 8:\n §YЭфиопия§!: дезертирство противника\n §YИталия§!: массовое дезертирство\nУровень 9:\n §YЭфиопия§!: выживание вопреки всему\nУровень 10:\n §YЭфиопия§!: народная война\n §YИталия§!: возмущение в колониях"
 war_escalation_1_tt:0 "Уровень 1\n Никаких эффектов"
 war_escalation_2_tt:0 "Уровень 2\n Никаких эффектов"
 war_escalation_3_tt:1 "Уровень 3\n §YЛига Наций§!Эфиопия может потребовать эмбарго.\n §YЭфиопия§!Международная репутация растет, §YЗапросить эмбарго§! Фокус незаперт."
 war_escalation_4_tt:1 "Уровень 4\n §YЛига Наций§!: Эфиопия может запросить оружие.\n §YИталия§!: итальянское общество обеспокоено\n §YЭфиопия§!: открывается фокус §Y«Закупки вооружения»§!."
 war_escalation_5_tt:1 "Уровень 5\n §YЛига Наций§!: Эфиопия может запросить закрытие Суэца.\n §YИталия§!: Африканская армия деморализована\n §YЭфиопия§!: открывается фокус §Y«Закрытие Суэца»§!"
 war_escalation_6_tt:1 "Уровень 6\n §YЛига Наций§!: Эфиопия может запросить интернациональные бригады.\n §YЭфиопия§!: повышен боевой дух армии, открывается фокус §Y«Интернациональные бригады»§!.\n §YИталия§!: волнения в колониях"
 war_escalation_7_tt:2 "Уровень 7\n §YЛига Наций§!: Эфиопия может запросить международное посредничество.\n§YИталия§!: итальянское общество сомневается в войне\n§YЭфиопия§!: открывается фокус §Y«Международное посредничество»§!."
 war_escalation_8_tt:0 "Уровень 8\n §YЭфиопия§!: дезертирство противника\n §YИталия§!: массовое дезертирство"
 war_escalation_9_tt:1 "Уровень 9\n §YЭфиопия§!: выживание вопреки всему"
 war_escalation_10_tt:0 "Уровень 10\n §YЭфиопия§!: народная война\n §YИталия§!: возмущение в колониях"
 ETH_trigger_fulfilled:0 "£trigger_yes"
 ETH_trigger_not_fulfilled:0 "£trigger_no"
 ETH_war_escalation_threat:0 "Эскалация итало-эфиопской войны"
 ETH_major_offensive_threat:0 "Крупное наступление в итало-эфиопской войне"
 ETH_improve_country_category:0 "Наступление войск страны [ROOT.GetName]"
 ETH_improve_country_category_desc:0 "[ETH.GetNameDefCap] располагает преимущественно аграрной экономикой, основанной на натуральном хозяйстве. Для индустриализации необходимы огромные вложения в электрификацию и транспортную инфраструктуру, чтобы больше работников могли покинуть сельское хозяйство и перейти на фабрики."
 ETH_build_local_resistance_force:0 "Создать войска сопротивления в регионе [FROM.GetName]"
 ETH_build_local_resistance_force_desc:1 "Мы должны сделать всё возможное для поддержки движений сопротивления на оккупированных территориях. Это поможет ослабить [ITA.GetAdjective] контроль над регионом и свяжет силы противника, пока мы готовимся к неизбежному освобождению [ETH.GetName]."
 ETH_build_local_resistance_force_increase_tt:0 "Вербует §G1§! дивизию арбеньочей, которая сможет поднять восстание в регионе."
 ETH_build_local_resistance_force_cost:0 "£command_power  §G25§!"
 ETH_build_local_resistance_force_cost_blocked:0 "£command_power  §R25§!"
 ETH_building_local_resistance_flag:0 "Сейчас вербуются бойцы сопротивления"
 ETH_launch_large_scale_uprising:0 "Крупномасштабное восстание"
 ETH_launch_large_scale_uprising_desc:0 "Народ [ETH.GetName] жаждет свергнуть иностранные оккупационные силы по всей родине. Нам нужно лишь подтолкнуть его к этому."
 ETH_has_readied_uprising_tt:0 "Подготовлено восстание как минимум в 1 регионе"
 ETH_italian_uprising_warning_mission:0 "[ETH.GetName] ожидает неизбежного восстания"
 ETH_italian_uprising_warning_mission_desc:0 "Ходят слухи, что [ETH.GetLeader] призвал повстанцев по всей стране подняться и провести скоординированное нападение на [ROOT.GetName]."
 ETH_italian_uprising_warning_mission_tt:0 "Начинается восстание"
 ETH_coup_haile_selassie_imru:0 "Спровоцировать дворцовый переворот"
 ETH_coup_haile_selassie_imru_desc:0 "Сторонник демократии $ETH_ras_imru_haile_selassie$ управлял страной в отсутствие императора. Несомненно, народ считает его истинным героем [ROOT.GetName] после руководства страной во время войны. Призывы к более демократической [ROOT.GetName] звучат всё громче. Возможно, настало время действительно изменить [ROOT.GetNameDef]."
 ETH_palace_coup_tt:0 "§Y$ETH_ras_imru_haile_selassie$§! предпринимает попытку переворота"
 ETH_formal_request_to_host:0 "Составить официальный запрос [?ETH.host_nation.GetAdjective]ому правительству."
 ETH_formal_request_to_host_desc:0 "Следует обратиться к [?ETH.host_nation.GetAdjective] правительству и попросить его вступить в войну против [ITA.GetNameDef]. Это начнёт заключительный этап возвращения нашей страны."
 ETH_false_flag_operation_decision:0 "Начать операцию под чужим флагом"
 ETH_false_flag_operation_decision_desc:0 "Чтобы убедить принимающую сторону в ненадёжности [ITA.GetName], нужно инсценировать нападение на германский пограничный пост и обвинить итальянцев."
 ETH_throw_grand_party_for_host:0 "Устроить пышный прием"
 ETH_throw_grand_party_for_host_desc:0 "Большой приём в резиденции [ROOT.GetLeader] даст прекрасную возможность для неофициального лоббирования наряду с официальным."
 ETH_influence_host_cost:0 "§G10§! £GFX_ETH_imperial_treasury"
 ETH_influence_host_cost_blocked:0 "§R10§! £GFX_ETH_imperial_treasury"
 organization_of_african_unity_member_tt:0 "Является государством — членом Организации африканского единства"
 ETH_take_loans:0 "Личные кредиты"
 ETH_take_loans_desc:0 "Мы можем увеличить доступные средства, используя имперские активы в качестве залога."
 ETH_take_loans_tt:0 "£GFX_ETH_imperial_treasury Казна: §G+10§! \n"
 ETH_fundraising_campaign_decision:0 "Кампания по сбору средств"
 ETH_fundraising_campaign_decision_desc:0 "После радиообращения [ROOT.GetLeader] поддержка нашего дела в Америке значительно выросла. Следует воспользоваться этим и начать кампании по сбору средств там и в других странах, чтобы пополнить имперскую казну и финансировать возвращение родины."
 ETH_low_fundraising_effect_tt:0 "£GFX_ETH_imperial_treasury Казна: §G+5§! \n"
 ETH_medium_fundraising_effect_tt:0 "£GFX_ETH_imperial_treasury Казна: §G+15§! \n"
 ETH_high_fundraising_effect_tt:0 "£GFX_ETH_imperial_treasury Казна: §G+20§! \n"
 ETH_very_high_fundraising_effect_tt:0 "£GFX_ETH_imperial_treasury Казна: §G+30§! \n"
 ETH_set_up_gideon_force_decision:0 "Отряд «Гидеон»"
 ETH_set_up_gideon_force_decision_desc:0 "[?ETH.host_nation.GetAdjective] правительство, похоже, готово профинансировать небольшой экспедиционный корпус для непосредственной поддержки нашего наступления на оккупантов. Следует немедленно настаивать на создании такого подразделения!"
 ETH_set_up_gideon_force_decision_tt:0 "[?ETH.host_nation.GetAdjective] командир сил специального назначения временно присоединяется к [ROOT.GetAdjective] армии."
 ETH_recruit_mercenaries_host_cost:0 "§G[?ETH_recruit_mercenaries_cost]§! £GFX_ETH_imperial_treasury"
 ETH_recruit_mercenaries_host_cost_blocked:0 "§R[?ETH_recruit_mercenaries_cost]§! £GFX_ETH_imperial_treasury"
 ETH_recruit_mercenaries_from_host:0 "Вербовать наемников"
 ETH_recruiting_mercenaries_flag:0 "Идёт набор наёмников"
 ETH_recruit_mercenaries_from_host_desc:0 "Всегда найдутся люди, готовые сражаться за деньги."
 ETH_recruit_aircrews_from_host:0 "Завербовать [?ETH.host_nation.GetAdjective]их пилотов"
 ETH_recruit_aircrews_from_host_desc:0 "Наверняка найдутся [?ETH.host_nation.GetAdjective] пилоты и техники, готовые служить [ROOT.GetName], если плата будет достаточно высокой."
 ETH_recruit_merchant_marines_from_host:0 "Приобрести гражданские корабли"
 ETH_recruit_merchant_marines_from_host_desc:0 "Нам понадобятся корабли и моряки, чтобы перевезти армию обратно в Африку."
 ETH_buy_rifles_from_host:0 "Купить [?ETH.host_nation.GetAdjective]ие винтовки."
 ETH_buy_rifles_from_host_desc:0 "Для возвращения [ROOT.GetName] необходимы жертвы. Тратить личное богатство монарха на оружие — отчаянный шаг, но отчаянные времена требуют отчаянных мер."
 ETH_buy_rifles_from_host_cost:0 "§G[?ETH_buy_arms_from_host_cost]§! £GFX_ETH_imperial_treasury"
 ETH_buy_rifles_from_host_cost_blocked:0 "§R[?ETH_buy_arms_from_host_cost]§! £GFX_ETH_imperial_treasury"
 ETH_securing_arms_deals_flag:0 "Заключается оружейная сделка"
 ETH_will_be_re_enabled_tt:0 "После завершения это решение снова станет доступно через [?ETH_re_enable_time_international_actions] дней."
 ETH_buy_tanks_from_host:0 "Купить лишние [?ETH.host_nation.GetAdjective]ие танки"
 ETH_buy_tanks_from_host_desc:0 "[ROOT.GetAdjective] армии остро не хватает танков. На рынке доступны старые излишки техники, и часть имперской казны можно потратить на их приобретение. Старые танки лучше, чем никакие."
 ETH_buy_support_equipment_from_host:0 "Приобрести вспомогательное оснащение"
 ETH_buy_support_equipment_from_host_desc:0 "Одних винтовок недостаточно. Солдатам нужны каски, сапоги, гранаты и многое другое. Часть имперской казны можно направить на покупку этих предметов."
 ETH_chitet_category:0 "Читет"
 ETH_chitet_category_desc:0 "Созыв национального ополчения позволяет очень быстро получить большое количество войск. На протяжении веков ополчение верно служило стране. После окончания войны все бойцы смогут вернуться к мирной жизни."
 ETH_raise_the_chitet:0 "Собрать читет"
 ETH_raise_the_chitet_desc:0 "Собрать региональные ополчения во всех контролируемых эфиопских регионах."
 ETH_disband_the_chitet:0 "Расформировать читет"
 ETH_disband_the_chitet_desc:0 "После окончания войны пора позволить ополченцам вернуться домой."
 ETH_chitet_cooldown_tt:0 "Читет можно вновь созвать через [?var_ETH_chitet_cooldown] дней после роспуска."
 ETH_chitet_disband_tt:0 "С момента роспуска читета прошло [?var_ETH_chitet_cooldown] дней"
 ETH_disband_the_chitet_mission:0 "Ополчение возвращается домой"
 ETH_disband_the_chitet_mission_desc:0 "Пора распустить читет и позволить бойцам вернуться к мирной жизни."
 ETH_raise_the_chitet_effect_tt:0 "Созывает ополчение"
 ETH_number_levy_units_less_than_five:0 "Менее 5 действующих дивизий ополчения."
 ETH_second_italo_ethiopian_war_category:0 "Вторая итало-эфиопская война"
 ETH_second_italo_ethiopian_war_category_desc:0 "[Get2ndItaloEthiopianWarDesc] "
 ETH_2ndItaloEthiopianWar:1 "[ITA.GetName] незаконно вторглась на нашу родину. Хотя мы являемся полноправным членом Лиги Наций, мир бездействует и считает конфликт незначительной колониальной стычкой.\nМы должны доказать Лиге Наций, что это полномасштабная агрессивная война одного государства-члена против другого, и заставить мир выступить против [ITA.GetLeader]."
 ITA_2ndItaloEthiopianWar:0 "Лига Наций пока не предприняла против нас реальных действий, ограничившись символическим осуждением завоевания Эфиопии. Однако чем дольше длится конфликт и чем больше регулярных войск мы задействуем, тем выше риск их настоящего вмешательства. Необходимо закончить войну до того, как [ETH.GetLeader] убедит Лигу Наций действовать."
 ETH_christmas_offensive_mission:0 "Рождественское наступление"
 ETH_christmas_offensive_mission_desc:0 "Наши войска всё ещё продвигаются вперёд, но наступательный порыв ослабевает. Вскоре энергия контратаки окончательно иссякнет."
 ETH_time_based_war_escalation_mission:0 "Постепенная эскалация войны"
 ETH_time_based_war_escalation_mission_desc:0 "Чем дольше идёт война, тем сильнее беспокоится мир. За каждые шесть месяцев с начала войны в октябре 1935 года эскалация повышается на один уровень."
 ETH_hold_the_north_mission:0 "Удержать север"
 ETH_hold_the_north_mission_desc:0 "Рождественское наступление отбросило итальянцев, но нам не удалось сбросить их в море, как планировалось. Они перегруппируются и атакуют с ещё большей силой, поэтому мы должны показать, что способны удержать страну."
 ETH_hold_the_north_mission_success:0 "\n[ETH.GetName] успешно удержала север (+1) £trigger_yes\n"
 ITA_conquer_the_north_mission:0 "Захватить северную Эфиопию"
 ITA_conquer_the_north_mission_desc:0 "Пора вернуть земли, потерянные во время эфиопского наступления."
 ETH_war_escalation_inc_tt:0 "Эскалация войны повышается на §G1§!"
 ETH_war_deescalation_inc_tt:0 "Эскалация войны снижается на §R1§!"
 ITA_war_escalation_inc_tt:0 "Эскалация войны повышается на §R1§!"
 ITA_war_deescalation_inc_tt:0 "Эскалация войны снижается на §G1§!"
 ETH_hold_the_south_mission:0 "Удержать юг"
 ETH_hold_the_south_mission_desc:0 "До сих пор южный фронт оставался спокойным, но итальянцы наверняка готовят новое наступление из своих владений на юге. Мы должны сдержать их и показать миру незаконность заявлений Италии и её сомалийских марионеток."
 ETH_hold_the_south_mission_success:0 "\n[ETH.GetName] успешно удержала юг (+1) £trigger_yes\n"
 ITA_conquer_the_south_mission:0 "Захватить южную Эфиопию"
 ITA_conquer_the_south_mission_desc:0 "Эфиопы, вероятно, не ожидают наступления на юге. Быстрым захватом [837.GetName] и [836.GetName] мы должны деморализовать их армию и ослабить поддержку в Лиге Наций."
 ETH_hold_addis_ababa_mission:0 "Удержать Аддис-Абебу"
 ETH_hold_addis_ababa_mission_desc:0 "Если мы удержим столицу, международное сообщество, возможно, поймёт, что итальянцев необходимо остановить силой."
 ETH_hold_the_capital_mission_success:0 "\n[ETH.GetName] успешно удержала Аддис-Абебу (+1) £trigger_yes\n"
 ETH_conquer_addis_ababa_mission:0 "Захватить Аддис-Абебу"
 ETH_conquer_addis_ababa_mission_desc:0 "Необходимо захватить столицу и вынудить [ETH.GetName] капитулировать."
 ETH_hold_harar_mission:0 "Удержать регион [835.GetName]"
 ETH_hold_harar_mission_desc:0 "После потери юга следует удержать Харар и защитить путь к морю."
 ETH_harar_lost_tt:0 "Потеря контроля над Хараром снизит поддержку войны среди населения."
 ETH_conquer_harar_mission:0 "Захватить регион [835.GetName]"
 ETH_conquer_harar_mission_desc:0 "Эфиопы перегруппировываются в горах. Нужно захватить [835.GetCapitalVictoryPointName], прежде чем они успеют укрепить позиции."
 ETH_hold_harar_mission_success:0 "\n[ETH.GetName] успешно удержала [835.GetName] (+1) £trigger_yes\n"
 ETH_buy_rifles:0 "Купить стрелковое оружие"
 ETH_buy_rifles_desc:0 "Теперь, когда у нас есть доступ к международному рынку вооружений, необходимо заключить оружейные сделки. Главная потребность — винтовки для пехоты, чтобы она могла сражаться с захватчиками на равных."
 ETH_buy_artillery:0 "Закупить артиллерию"
 ETH_buy_artillery_desc:0 "Нам отчаянно нужна современная артиллерия для поддержки армии. Приоритетом должно стать заключение сделок на приобретение тяжёлых орудий."
 ETH_buy_support_equipment:0 "Закупить вспомогательное снаряжение"
 ETH_buy_support_equipment_desc:0 "Нам нужны не только оружие, но и средства связи и вспомогательное снаряжение в целом. Их приобретение является задачей высшей важности."
 ETH_buy_anti_tank_guns:0 "Закупить противотанковые орудия"
 ETH_buy_anti_tank_guns_desc:0 "Мы пытаемся бороться с итальянской бронетехникой канистрами с бензином и крупнокалиберными охотничьими ружьями. Чтобы победить итальянцев, необходимы большие количества качественных противотанковых орудий."
 ETH_request_sent_flag:0 "Ожидается ответ"
 ETH_host_confirmed_flag:0 "Подтверждена страна размещения правительства в изгнании"
 ETH_host_country_decision:0 "Попросить разрешение создать правительство в изгнании в государстве [FROM.GetName]."
 ETH_host_country_decision_desc:0 "Нужно готовиться к худшему. Если страна падёт, нам потребуется база для продолжения сопротивления. Следует обратиться к [FROM.GetAdjective] правительству и запросить разрешение на создание там правительства в изгнании."
 ETH_host_country_decision_tt:0 "§Y[ROOT.GetLeader]§! сможет создать §Yправительство в изгнании§! в §Y[FROM.GetNameWithFlag]§!, если фокус §Y$ETH_boarding_the_train$§! будет завершён до капитуляции.\n\nОткрывает дополнительные фокусы, доступные правительству в изгнании в [FROM.GetNameDef]."
 ITA_expand_regional_control:0 "Установить контроль над регионом [FROM.GetName]"
 ITA_expand_regional_control_desc:1 "Мы расширим [ITA.GetAdjective] контроль над [FROM.GetName]."
 ITA_discredit_haile_selassie_cd_tt:0 "[GetDecisionCooldownTooltip] §Y180§! дней.\n"
 expanding_regional_control_flag:0 "Расширяется региональный контроль"
 ETH_italian_occupation_category:0 "[ITA.GetAdjective]ая оккупация региона [ETH.GetName]"
 ETH_italian_occupation_category_desc:1 "Хотя мы были вынуждены покинуть родину, война далека от завершения. Мы используем все доступные средства, чтобы вновь вернуть свободу [ETH.GetAdjective] народу."
 ETH_italian_occupation_category_map_category_name:0 "Управление [ITA.GetAdjective] оккупацией [ETH.getNameDef]"
 ETH_italian_control_mission:0 "[ITA.GetName] интегрирует территорию региона [?ITA.state_integrated.GetName]"
 ETH_italian_control_mission_desc:1 "[ITA.GetName] пытается грубой силой установить контроль над нашей территорией. Мы должны отбросить их."
 ETH_italian_control_mission_tt:0 "[?ITA.state_integrated.GetName] перейдёт во владение [ITA.GetNameWithFlag]."
 ETH_retake_territory_mission:0 "Отбить территорию"
 ETH_retake_territory_mission_desc:0 "Половина [ROOT.GetName] находится под контролем врага. Местные расы возмущены оставлением их земель, а центральная власть подвергается сомнению. Ходят разговоры о сделке с итальянцами. Только возвращение [ROOT.GetAdjective] территории убедит народ в возможности победы."
 controls_50_percent_of_territory:0 "[ROOT.GetNameWithFlag] контролирует не менее §Y50%§! всех принадлежащих регионов.\n Сейчас под контролем: [?num_owned_controlled_states|Y0]\n Требуется: [?controlled_owned_50|Y0] "
 controls_more_than_50_percent_of_territory:0 "[ROOT.GetNameWithFlag] контролирует более §Y50%§! всех принадлежащих регионов.\n Сейчас под контролем: [?num_owned_controlled_states|Y0]\n Требуется: [?controlled_owned_more_than_50|Y0] "
 ETH_road_reform_BoP:0 "Улучшение дорог"
 ETH_Education_reform_decentralized_BoP:0 "Локальные реформы образования"
 ETH_Education_reform_decentralized_BoP_tt:0 "Образование находится в авангарде борьбы с устаревшими структурами власти. Нужно обучать молодёжь так, чтобы она ставила власть под сомнение и отвергала архаичные взгляды традиционалистов."
 ETH_Education_reform_centralized_BoP:0 "Государственные реформы образования"
 ETH_Education_reform_centralized_BoP_tt:0 "Разумеется, наш приоритет — подготовить следующее поколение к труду. Однако мы можем направить будущие поколения в более приемлемое моральное русло, обеспечив их верность [ETH.GetLeader]."
 ETH_road_reform_local_BoP:0 "Поддержать развитие местных дорог"
 ETH_road_reform_highways_BoP:0 "Поддержать развитие столичных шоссе"
 ETH_road_reform_local_BoP_desc:0 "Дорожная сеть [ETH.GetName] всё сильнее препятствует экономическому развитию. Теперь у нас есть политическое влияние, чтобы провести модернизацию дорог, которая принесёт пользу обычным людям по всей стране благодаря лучшему сообщению между городами и деревнями."
 ETH_road_reform_highways_BoP_tt:0 "Дорожная сеть [ETH.GetName] всё сильнее препятствует экономическому развитию. Используя новое влияние, следует ускорить экономический рост и централизацию строительством улучшенных магистралей вокруг столицы."
 ETH_officer_reforms_centralized_BoP:0 "Ввести институт политруков"
 ETH_officer_reforms_decentralized_BoP:0 "Повышение меритократии в армии"
 ETH_officer_reforms_centralized_BoP_tt:0 "Чтобы армия не выступила против режима, необходимо обеспечить её лояльность введением политических офицеров."
 ETH_officer_reforms_decentralized_BoP_tt:0 "Чтобы армия была эффективной, необходимо повысить меритократию в офицерском корпусе."
 ETH_BoP_purge_communists:0 "Изгнать коммунистов"
 ETH_BoP_purge_communists_tt:0 "Непрочный мир между «Чёрными львами» и коммунистическими офицерами начинает рушиться. Офицеры явно намерены централизовать власть и создать авторитарный режим, верный лишь им самим. Мы должны устранить их, пока они не уничтожили всё построенное нами."
 ETH_BoP_purge_anarchists:0 "Изгнать анархистов"
 ETH_BoP_purge_anarchists_tt:1 "Непрочный мир между армией и «Чёрными львами» рушится. Их наивные анархистские взгляды разлагают [ETH.GetNameDef] изнутри и делают нас уязвимыми. Чтобы сохранить революцию, мы раз и навсегда уничтожим «Чёрных львов».\n\n§Y$ETH_prov_mil_admin$§! станет лидером §Y[ROOT.GetFlag][ROOT.GetNameDefCap]§!."
 ETH_BoP_expand_black_lions:0 "Увеличить дивизии Черных львов"
 ETH_BoP_expand_black_lions_tt:0 "Коммунистам нельзя доверять. Мы должны быть готовы к их попытке захватить власть, поэтому увеличим число дивизий «Чёрных львов», чтобы удержать их от любых действий."
 ETH_BoP_expand_red_guards:0 "Увеличить дивизии Красной гвардии"
 ETH_BoP_expand_red_guards_tt:0 "«Чёрным львам» нельзя доверять управление страной, и в конечном итоге их придётся отстранить. Нужно увеличить число подразделений Красной гвардии, чтобы воспользоваться моментом, когда «Чёрные львы» неизбежно потерпят неудачу."
 ETH_electrify_state:0 "Электрификация страны [FROM.GetName]"
 ETH_electrify_state_desc:0 "Проведение электричества в местные деревни является важной частью модернизации страны."
 ETH_electrify_state_tt:0 "Изменить §Y$ETH_state_development_dynamic_modifier$§!:\n$MODIFIER_STATE_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+10%§!\n$MODIFIER_LOCAL_BUILDING_SLOTS$: §G+10%§!"
 ETH_improve_communications_in_state:0 "Улучшить инфраструктуру связи в государстве [FROM.GetName]"
 ETH_improve_communications_in_state_desc:0 "Эффективные средства связи жизненно важны для развития страны."
 ETH_improve_communications_in_state_tt:0 "Изменить §Y$ETH_state_development_dynamic_modifier$§!:\n$MODIFIER_STATE_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+15%§!"
 ETH_invest_in_state_industry:0 "Инвестиции в промышленность региона [FROM.GetName]"
 ETH_invest_in_state_industry_desc:0 "Для успешного развития промышленности в [FROM.GetName] необходимы государственные вложения — напрямую или через местных правителей."
 ETH_invest_in_state_industry_tt:0 "Изменить §Y$ETH_state_development_dynamic_modifier$§!:\n$MODIFIER_LOCAL_BUILDING_SLOTS$: §G+20%§!"
 prospecting_ongoing_flag:0 "Идёт разведка ресурсов"
 ETH_prospect_for_resources:0 "Добыча ресурсов"
 ETH_prospect_for_resources_desc:0 "В [FROM.GetName] можно найти природные ресурсы. Достаточно глубоко копая и буря, мы сделаем [ROOT.GetName] богаче."
 ETH_japanese_industrial_investments_decision:0 "Японские инвестиции в промышленность"
 ETH_japanese_industrial_investments_decision_desc:0 "Японские инвесторы ищут новые возможности в Африке. [FROM.GetName] может стать идеальным местом для промышленности, финансируемой Японией."
 ETH_japanese_investments_flag:0 "Сейчас осуществляются японские инвестиции"
 ETH_local_development_state_grows_mission:0 "Рост в регионе [?ETH.ETH_local_state.GetName]"
 ETH_local_development_state_grows_mission_desc:0 "[?ETH.ETH_local_state.GetName] процветает при нынешнем управлении. Сельскохозяйственное производство растёт, города и деревни расширяются."
 ETH_max_japanese_investments_tt:0 "Инвестиции можно провести максимум в §Y3§! регионах. Число регионов с инвестициями: §Y[?ETH_japanese_invesment_states]§!"
 ETH_japanese_infrastructure_investments_decision:0 "Японские инвестиции в инфраструктуру"
 ETH_japanese_infrastructure_investments_decision_desc:0 "Японские инвесторы ищут новые возможности в Африке. [FROM.GetName] может стать идеальным местом для инфраструктуры, финансируемой Японией."
 ETH_japanese_dockyard_investments_decision:0 "Японские инвестиции в кораблестроение"
 ETH_japanese_dockyard_investments_decision_desc:0 "Японские инвесторы ищут новые возможности в Африке. [FROM.GetName] может стать идеальным местом для судостроительных предприятий, финансируемых Японией."
 ETH_local_development_industry_grows_mission:0 "Промышленная экспансия в регионе [?ETH.ETH_local_state.GetName]"
 ETH_local_development_industry_grows_mission_desc:0 "Мелкое производство в [?ETH.ETH_local_state.GetName] переживает подъём. Если продолжить его поощрять, это принесёт пользу всей [ROOT.GetName]."
 ETH_local_development_arms_industry_grows_mission:0 "Производство оружия в регионе [?ETH.ETH_local_state.GetName]"
 ETH_local_development_arms_industry_grows_mission_desc:0 "Местные оружейники в [?ETH.ETH_local_state.GetName] значительно увеличили выпуск. Он достигает уровня, при котором пользу сможет получить вся страна."
 ETH_local_development_improved_production_mission:0 "В регионе [?ETH.ETH_local_state.GetName] формируются местные строительные комитеты"
 ETH_local_development_improved_production_mission_desc:0 "Местные комитеты в [?ETH.ETH_local_state.GetName] улучшают условия труда, инструменты и методы."
 ETH_local_development_improved_production_mission_tt:0 "Изменить §Y$ETH_state_development_dynamic_modifier$§!:\n$MODIFIER_STATE_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+10%§!"
 ETH_anti_colonialism_category:0 "Антиколониализм"
 ETH_anti_colonialism_category_desc:0 "Мы будем всеми силами поддерживать движения сопротивления по всему региону, пока империалистическое угнетение не будет окончательно уничтожено."
 ETH_anti_colonialism_map_category_name:0 "Колониальные регионы, где можно поддержать сопротивление"
 ETH_support_resistance_decision:0 "Поддержать [FROM.OWNER.GetAdjective]ое сопротивление в регионе [FROM.GetName]"
 ETH_support_resistance_decision_desc:0 "Поддержать бойцов сопротивления в борьбе против [FROM.Owner.GetAdjective] власти."
 ETH_arm_resistance_decision:0 "Вооружить людей, оказывающих сопротивление [FROM.OWNER.GetAdjective]ому государству в регионе [FROM.GetName]"
 ETH_arm_resistance_decision_desc:0 "Вооружить бойцов сопротивления в этом регионе."
 ETH_support_independence_decision:0 "Поддержать [FROM.GetAdjective]ую независимость"
 ETH_support_independence_decision_desc:0 "Поддержать независимость [FROM.GetAdjective] народа"
 ETH_independence_support_progress_flag:0 "Сейчас поддерживается движение за независимость"
 ETH_support_resistance_decision_cost:0 "£command_power §Y25§!"
 ETH_support_resistance_decision_cost_blocked:0 "£command_power §R25§!"
 ETH_anti_colonialism_decision:0 "Пропаганда против [FROM.GetAdjective]ого правления"
 ETH_anti_colonialism_decision_desc:0 "[FROM.GetAdjective] империализм в Африке должен закончиться. Мир обязан понять, что эпоха [FROM.GetAdjective] колониализма прошла. Народ [FROM.GetNameDef] должен потребовать от своих лидеров освобождения угнетённых африканских колоний."
 ETH_demand_peace_decision:0 "Потребовать у [?FROM.previous_overlord.GetAdjective]ого народа признать государство [FROM.GetNameDef]"
 ETH_demand_peace_decision_desc:0 "Храбрый народ [FROM.GetName] восстал против [?FROM.previous_overlord.GetAdjective] тирании. Следует действовать сейчас и всеми необходимыми средствами вынудить [?FROM.previous_overlord.GetNameDef] покинуть [FROM.GetAdjective] территорию."
 ETH_demand_peace_decision_tt:0 "§Y[?FROM.previous_overlord.GetNameWithFlag]§! подвергается давлению с требованием прекратить войну с §Y[FROM.GetNameWithFlag]§!"
 ETH_currently_demanding_peace_flag:0 "Сейчас выдвигается требование мира"
 ETH_social_reforms_category:0 "Анархо-коммунистические социальные реформы"
 ETH_social_reforms_category_desc:0 "Нам необходима волна социальных реформ, чтобы преодолеть культурные и религиозные разногласия в [ETH.GetName] и сохранить единство."
 ETH_education_reforms_decision:0 "Реформы системы образования"
 ETH_education_reforms_decision_desc:0 "Чтобы предотвратить появление реакционного движения в будущем, необходимо реформировать образование, чтобы дети вырастали свободно мыслящими людьми, а не прислужниками капиталистов."
 ETH_collectivization_reforms_decision:0 "Земельная реформа"
 ETH_collectivization_reforms_decision_desc:0 "Земли [ETH.GetNameDefCap] веками принадлежали аристократам, хотя обрабатывал их народ. Перераспределив землю, мы дадим каждому возможность стать хозяином самому себе."
 ETH_secularization_reforms_decision:0 "Секуляризация"
 ETH_secularization_reforms_decision_desc:0 "В [ETH.GetNameDefCap] существуют многочисленные культурные и религиозные разногласия, уходящие корнями в глубь веков. Чтобы предотвратить межконфессиональное насилие в будущем, необходимо разрушить власть суеверий."
 ETH_freedom_at_gunpoint_category:0 "Свобода под дулом пистолета"
 ETH_freedom_at_gunpoint_category_desc:0 "Наши соседи всё ещё находятся под ярмом империалистов. Настало время использовать военный опыт и новую экономическую мощь для освобождения Африки на единственном языке, который понимают колониальные державы: грубой силе."
 ETH_freedom_at_gunpoint_dynamic:0 "Освободить государство [FROM.GetName] от власти державы [FROM.Capital.OWNER.GetName]"
 ETH_freedom_at_gunpoint_dynamic_tt:0 "Получить §Yцель войны за освобождение§! против §Y[FROM.Capital.OWNER.GetName]§!"
 ETH_has_active_liberation_goal:0 "Есть активная цель войны за освобождение"
 form_ethiopian_empire_category:0 "Расширение [ETH.GetAdjective]ой империи"
 form_ethiopian_empire_category_desc:0 "[ROOT.GetNameDefCap] уже является могущественной империей, но уступает своему прошлому величию. При правильном руководстве она может стать сильнее, чем когда-либо."
 ETH_italo-ethiopian_empire_decisions:0 "Расширение Итало-[ETH.GetAdjective]ой империи"
 ETH_core_551:0 "[551.GetName] войдет в состав империи"
 ETH_core_886:0 "[886.GetName] войдет в состав империи"
 ETH_core_883:0 "[883.GetName] войдет в состав империи"
 ETH_core_269:0 "[269.GetName] войдет в состав империи"
 ETH_core_884:0 "[884.GetName] войдет в состав империи"
 ETH_core_906:0 "[906.GetName] войдет в состав империи"
 ETH_core_268:0 "[268.GetName] войдет в состав империи"
 ETH_core_293:0 "[293.GetName] войдет в состав империи"
 ETH_core_659:0 "[659.GetName] войдет в состав империи"
 form_empire_of_axum:0 "Восстановить Аксумскую империю"
 controls_ethiopian_cores_tt:0 "Контролирует все национальные регионы [ROOT.GetAdjective] стороны."
 ETH_move_capital_to_axum:0 "Перенести столицу в Аксум"
 ETH_move_capital_to_axum_desc:0 "Древний город Аксум должен стать новой столицей империи."
