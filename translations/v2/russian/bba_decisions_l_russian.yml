 SWI_military_readiness_decisions_category:1 "Швейцарское гражданское ополчение"
 SWI_military_readiness_decisions_category_desc:1 "Народ Швейцарии находится в самом центре фашистской бури, поэтому должен быть готов защищать демократический образ жизни.\n\n\nВоенная готовность: [?SWI.SWI_military_readiness]/[?SWI.SWI_max_mil_readiness]£GFX_SWI_military_readiness_text_icon"
 SWI_absolute_neutrality_decisions_category:1 "Абсолютная нейтральность"
 SWI_absolute_neutrality_decisions_category_desc:2 "Окруженный потенциальными захватчиками, [ROOT.GetNameDef] Мы должны быть осторожны, чтобы не нарушить наш слабый нейтралитет, иначе мы рискуем потерять наш остров демократии из-за нарастающих волн войны.\n\n"
