 ETH_offer_peace_ERI:0 "Предложить мир ради независимости [ERI.GetAdjective] народа"
 ETH_offer_peace_ERI_tt:0 "Предложить владельцу [ERI.GetAdjective] территории мир, если он согласится отказаться от претензий на земли, которые сейчас контролирует [ETH.GetName]. Контролируемая [ERI.GetAdjective] территория станет марионеткой [ETH.GetAdjective] стороны."
 ETH_offer_peace_SOM:0 "Предложить мир ради независимости [SOM.GetAdjective] народа"
 ETH_offer_peace_SOM_tt:0 "Предложить владельцу [SOM.GetAdjective] территории мир, если он согласится отказаться от претензий на земли, которые сейчас контролирует [ETH.GetName]. Контролируемая [SOM.GetAdjective] территория станет марионеткой [ETH.GetAdjective] стороны."
 ETH_offer_peace_UGA:0 "Предложить мир ради независимости [UGA.GetAdjective] народа"
 ETH_offer_peace_UGA_tt:0 "Предложить владельцу [UGA.GetAdjective] территории мир, если он согласится отказаться от претензий на земли, которые сейчас контролирует [ETH.GetName]. Контролируемая [UGA.GetAdjective] территория станет марионеткой [ETH.GetAdjective] стороны."
 ETH_freedom_at_gunpoint_offer_peace:0 "Предложить мир государству [FROM.Capital.OWNER.GetName] в обмен на независимость [FROM.GetAdjective]ой территории"
 ETH_freedom_at_gunpoint_offer_peace_tt:1 "§Y[FROM.Capital.OWNER.GetName]§! будет предложен мир в обмен на отказ от претензий на §Y[FROM.GetAdjective]§! территории, которые сейчас контролирует §Y[THIS.GetName]§!. В случае согласия §Y[THIS.GetName]§! получит зависимое государство на контролируемой территории, являющейся национальной для §Y[FROM.GetName]§!.\n\n§R[ROOT.GetFlag][ROOT.GetNameDefCap] покинет любую фракцию, в которой состоит, если мир будет принят и эта фракция воюет с [FROM.Capital.OWNER.GetFlag][FROM.Capital.OWNER.GetName]!§! \n\n§R[FROM.Capital.OWNER.GetFlag][FROM.Capital.OWNER.GetName] рассмотрит предложение мира только в том случае, если [ROOT.GetFlag][ROOT.GetName] контролирует [FROM.GetAdjective] территорию!§!"
 ETH_exploit_french_weakness_category:0 "Воспользоваться французской слабостью"
 ETH_exploit_french_weakness_category_desc:0 "Когда наступит подходящий момент, мы установим контроль над [268.GetName], пока [FRA.GetAdjective] сторона занята делами ближе к дому."
 ETH_take_DJI:0 "Занять Французский Берег Сомали"
 ETH_take_DJI_tt:0 "Необходимо дождаться подходящего момента для удара. Когда Французское Сомали останется без войск, мы сможем быстро захватить территорию. Франция, вероятно, признает наше владение, но всё же следует быть готовыми к более широкому конфликту."
 ETH_take_DJI_cancel_tt:0 "\n§RБудет отменено, если $FRA_VICHY_fascism$ перестанет контролировать Французское Сомали или разместит в регионе дивизии!§!"
 ETH_take_DJI_danger_tt:0 "\n§R$FRA_VICHY_fascism$ может отомстить за аннексию своей территории!§!"
 ETH_reintegrate_former_territory_category:0 "Заявить права на империю"
 ETH_reintegrate_former_territory_category_desc:0 "Перед нами стоит великая задача — вернуть законные земли и объединить [ETH.GetAdjective] народ под властью нашего великого лидера [ETH.GetLeader]."
 ETH_reintegrate_core:0 "Заявить права на регион [FROM.GetName]"
 ETH_reclaim_the_empire_targets:0 "Эти регионы могут быть возвращены [ETH.GetName]"
 ETH_consolidate_east_africa_category:0 "Объединить Восточную Африку"
 ETH_consolidate_ea_targets:0 "Эти регионы могут быть интегрированы в [ETH.GetName]:"
 ETH_form_horn_of_africa:0 "Провозгласить единство Восточной Африки"
 ETH_improve_the_horn_of_africa_category:0 "Улучшение Африканского Рога"
 ETH_improve_the_horn_of_africa_category_desc:0 "Улучшая инфраструктуру соседних стран, мы укрепим регион и теснее свяжем государства Африканского Рога."
 ETH_build_infrastructure:0 "Улучшить инфраструктуру в регионе [FROM.GetNameDef]"
 ETH_build_railway:0 "Улучшить железнодорожное сообщение с регионом [FROM.GetNameDef]"
 ETH_invest_horn_industry:0 "Инвестировать в [FROM.GetAdjective]ую промышленность"
 ETH_integrate_economies:0 "Интегрировать регион [FROM.GetNameDef]"
 ETH_investments_in_progress_flag:0 "Инвестиции уже осуществляются"
 ETH_core_east_african_states:0 "Интегрировать регион [FROM.GetName]."
 african_union_category:0 "Организация африканского единства"
 african_union_category_desc:0 "Мы создадим институты, объединяющие таланты и ресурсы всего континента, и будем всё ближе продвигаться к политическому объединению. Только совместными усилиями и сотрудничеством народы Африки смогут избежать нового порабощения."
 promote_org_of_african_unity:0 "Продвигать организацию в [FROM.GetName]"
 invite_to_org:1 "Пригласить [FROM.OWNER.GetName] в организацию"
 invite_to_org_tt:0 "Страны с отличающейся идеологией будут менее склонны принять предложение о членстве."
 invite_to_ACB:0 "Пригласить государство [FROM.GetName] в Африканский центральный банк"
 invite_to_ACB_tt:0 "Страны с отличающейся идеологией вряд ли согласятся на экономическую интеграцию."
 invite_to_org_alliance:0 "Предложить государству [FROM.GetName] соглашение о взаимной обороне"
 invite_to_org_alliance_tt:0 "Страны с отличающейся идеологией будут менее склонны подписать оборонное соглашение."
 invite_to_exec_council:0 "Пригласить государство [FROM.GetName] в Исполнительный совет"
 invite_to_exec_council_tt:0 "Страны с отличающейся идеологией не поддержат политическое объединение с нами."
 threaten_org_member:0 "Угрожать руководству [FROM.GetName]"
 integrate_into_org:0 "Интегрировать государство [FROM.GetName] в Африканский союз"
 leave_org_of_african_unity:0 "Выйти из Организации африканского единства"
 threaten_member_state:0 "Запугать [FROM.GetAdjective]ую верхушку"
 threaten_member_state_desc:0 "Мы передадим лидерам [FROM.GetNameDef], что отказ от более глубокой интеграции с Организацией африканского единства повлечёт серьёзные последствия лично для них..."
 threaten_member_state_tt:0 "\nРуководство запуганной страны будет охотнее принимать предложения об интеграции в течение §G60 дней§!, пока действует это решение."
 BBA_purchase_old_ships_category:0 "Закупки для флота"
 BBA_purchase_old_ships_category_desc:0 "Мир становится всё более нестабильным, поэтому необходимо расширить возможности проецирования морской силы. К счастью, некоторые крупные флоты могут согласиться расстаться со старыми кораблями."
 ITA_withdraw_from_ethiopia:0 "Выйти из Эфиопии"
 ITA_withdraw_from_ethiopia_desc:0 "Война против Эфиопии была ошибкой. Пора положить конец этому спорному делу."
 ITA_transfer_lost_states_tt:1 "§Y[550.GetName]§!, §Y[559.GetName]§! и §Y[844.GetName]§! будут переданы §Y[ETH.GetName]§!, если она полностью их контролирует. §Y[908.GetName]§! также будет передан, если принадлежит [ROOT.GetNameDef]."
 ITA_missiolinis:1 "Задания от дуче"
 ITA_missiolinis_desc:1 "У дуче грандиозные планы по возвращению гордой итальянской нации на законное место. Для воплощения мечты о Великой Италии он отдаёт соответствующие приказы и рассчитывает, что они будут выполнены своевременно.\n\n£ITA_missiolini_text_icon Активные задания: §Y[?ITA_missiolinis_active_missions]§! \n£ITA_missiolini_text_icon Успешные задания: §Y[?ITA_missiolinis_successful_missions]§! \n£ITA_missiolini_silver_text_icon Проваленные задания: §R[?ITA_missiolinis_failed_missions]§!"
 ITA_missiolini_conquer_ethiopia:0 "Захватить Эфиопию"
 ITA_missiolini_conquer_ethiopia_desc:1 "Необходимо уничтожить все оставшиеся абиссинские опорные пункты, чтобы обеспечить победу Италии."
 ITA_missiolini_pacify_ethiopia:0 "Усмирить Эфиопию"
 ITA_missiolini_pacify_ethiopia_desc:1 "Дуче приказал грубой силой подавить абиссинское сопротивление и ввести законы для контроля над населением. Он требует как можно скорее полностью усмирить страну и включить её в состав Италии."
 ITA_missiolini_pacify_ethiopia_vanilla:0 "$ITA_missiolini_pacify_ethiopia$"
 ITA_missiolini_pacify_ethiopia_vanilla_desc:0 "$ITA_missiolini_pacify_ethiopia_desc$"
 ITA_pacify_ethiopia_goal_tt:1 "Во всех изначальных эфиопских регионах подчинение превышает §Y60%§!"
 ITA_missiolini_strengthen_heavy_industry:0 "Программа индустриализации"
 ITA_missiolini_strengthen_heavy_industry_desc:1 "Чтобы Италия действительно процветала, необходимо строить новые фабрики для поддержания роста нашей бурлящей империи и расширения производственных возможностей."
 ITA_missiolini_strengthen_heavy_industry_trigger_tt:0 "$TRIGGER_NUM_OF_CIVILIAN_FACTORIES_MORE_THAN$§Y[?ITA_missiolinis_required_civs]§!. (Сейчас: §[GetColorNumOfCivsMissiolinis][?ROOT.num_of_civilian_factories]§!.)"
 ITA_missiolini_strengthen_the_army:0 "Усилить армию"
 ITA_missiolini_strengthen_the_army_desc:1 "Как и древняя Римская империя, наша растущая держава простирается всё дальше и нуждается в сильной армии для защиты от орд варваров за границами."
 ITA_missiolini_stockpile_trucks:0 "Запастись грузовиками"
 ITA_missiolini_stockpile_trucks_desc:1 "Нам нужны более мобильные войска, способные быстро преодолевать большие расстояния и не зависеть от отстающей логистики."
 ITA_missiolini_stockpile_fuel:0 "Увеличить запасы топлива"
 ITA_missiolini_stockpile_fuel_desc:1 "Современная армия движется не только на желудке, но и на горючем. Без него вся военная машина останавливается. Оно необходимо всем родам войск, поэтому для успеха на поле боя мы должны обеспечить крупные поставки топлива."
 ITA_missiolini_strengthen_the_airforce:0 "Усилить ВВС"
 ITA_missiolini_strengthen_the_airforce_desc:1 "«Аэронаутика» стала символом национальной гордости и некогда была одной из сильнейших воздушных сил мира. Нужно производить больше самолётов, чтобы усилить авиацию и вновь сделать её великой."
 ITA_missiolini_strengthen_the_airforce_fighters_goal_tt:1 "Произведено или получено §Y[?ROOT.ITA_missiolinis_fighters_to_produce]§! новых самолётов типа §Y$fighter_equipment$§!.\nРазвёрнуто истребителей: §G[?ROOT.num_deployed_planes_with_type@small_plane_airframe]§! — на складах: §G[?ROOT.num_equipment@small_plane_airframe]§! — итоговая цель: §Y[?ITA_missiolinis_fighters_goal]§!\n\n"
 ITA_missiolini_strengthen_the_airforce_bombers_goal_tt:1 "Произведено или получено §Y[?ROOT.ITA_missiolinis_bombers_to_produce]§! новых самолётов типа §Y$CAS_equipment$§!, §Y$nav_bomber_equipment$§! или §Y$tac_bomber_equipment$§! (только одного типа).\nРазвёрнуто штурмовиков: §G[?ROOT.num_deployed_planes_with_type@small_plane_cas_airframe]§! — на складах: §G[?ROOT.num_equipment@small_plane_cas_airframe]§! — итоговая цель: §Y[?ITA_missiolinis_cas_goal]§!\nРазвёрнуто морских бомбардировщиков: §G[?ROOT.num_deployed_planes_with_type@small_plane_naval_bomber_airframe]§! — на складах: §G[?ROOT.num_equipment@small_plane_naval_bomber_airframe]§! — итоговая цель: §Y[?ITA_missiolinis_naval_bombers_goal]§!\nРазвёрнуто тактических бомбардировщиков: §G[?ROOT.num_deployed_planes_with_type@medium_plane_airframe]§! — на складах: §G[?ROOT.num_equipment@medium_plane_airframe]§! — итоговая цель: §Y[?ITA_missiolinis_tactical_bombers_goal]§!"
 ITA_missiolini_industrial_research:0 "Исследования в промышленности"
 ITA_missiolini_industrial_research_desc:1 "Мы должны показать миру, с какой скоростью фашизм и итальянский народ способны совершать великие технологические скачки."
 ITA_missiolini_expand_intelligence_agency:0 "Усилить разведку"
 ITA_missiolini_expand_intelligence_agency_desc:1 "Расширив разведывательную службу, мы проникнем во все сферы итальянского общества, выведем на свет коммунистов, преступников и другие вредоносные элементы и привлечём их к ответственности, сделав Италию безопаснее."
 ITA_missiolini_occupy_albania:0 "Оккупировать Албанию"
 ITA_missiolini_occupy_albania_desc:1 "Прочные связи Италии и Албании уходят корнями на тысячелетия назад, к Римской империи. Мы должны включить Албанию в состав Италии, чтобы обезопасить вход в Адриатическое море."
 ITA_missiolini_firmly_established_italian_administration_autonomy_text:0 "Прочно установленная [ROOT.GetAdjective] администрация"
 ITA_missiolini_occupy_albania_occupation_effects:0 "Если [ROOT.GetFlag][ROOT.GetNameDef] контролирует национальные территории [ALB.GetFlag][ALB.GetAdjective] стороны:\n"
 ITA_missiolini_occupy_albania_subject_effects:0 "Если [ALB.GetFlag][ALB.GetNameDef] является зависимым государством §Y[ROOT.GetFlag][ROOT.GetNameDef]§!:\n"
 ITA_missiolini_occupy_dalmatia:0 "Оккупировать регион [103.GetName]"
 ITA_missiolini_occupy_dalmatia_desc:1 "Мы должны исправить тяжёлую несправедливость Великой войны и силой забрать то, что принадлежит нам по праву. Далмация должна стать итальянской!"
 ITA_missiolini_occupy_dalmatia_occupation_effects:0 "\nЕсли [ROOT.GetFlag][ROOT.GetNameDef] контролирует §Y[103.GetName]§!:\nКаждый национальный регион [YUG.GetFlag][YUG.GetAdjective] стороны, полностью контролируемый [ROOT.GetFlag][ROOT.GetNameDef]:\n   Подчинение: §G+5,0%§!.\n   Сопротивление: §G-5,0%§!"
 ITA_missiolini_occupy_dalmatia_subject_effects:0 "\nЕсли §Y[103.GetName]§! полностью контролируется зависимым от [ROOT.GetAdjective] стороны государством [YUG.GetAdjective] происхождения:\n   Все зависимые от [ROOT.GetAdjective] стороны государства [YUG.GetAdjective] происхождения:\n"
 ITA_missiolini_occupy_greece:0 "Оккупировать государство [GRE.GetName]"
 ITA_missiolini_occupy_greece_desc:1 "Подобно древним римским легионам, мы можем разрушить наложенные на нас ограничения, завоевав Грецию и объединив братские народы."
 ITA_missiolini_occupy_greece_occupation_effects:0 "\nКаждый национальный регион [GRE.GetFlag][GRE.GetAdjective] стороны, полностью контролируемый [ROOT.GetFlag][ROOT.GetNameDef]:\n   Подчинение: §G+5,0%§!.\n   Сопротивление: §G-5,0%§!\n\nТекущие эффекты:"
 ITA_missiolini_occupy_greece_subject_effects:0 "\nЕсли [GRE.GetFlag][GRE.GetName] является зависимым государством §Y[ROOT.GetFlag][ROOT.GetNameDef]§!:\n"
 ITA_missiolini_occupy_ticino:0 "Оккупировать регион [846.GetName]"
 ITA_missiolini_occupy_ticino_desc:1 "Со времён перехода Ганнибала через Альпы со слонами эти горы служили варварам прямой дорогой в сердце Италии. Мы должны обезопасить северную границу."
 ITA_missiolini_occupy_ticino_occupation_effects:0 "\n[846.GetName] и каждый национальный регион [SWI.GetFlag][SWI.GetAdjective] стороны, полностью контролируемый [ROOT.GetFlag][ROOT.GetNameDef]:\n   Подчинение: §G+5,0%§!.\n   Сопротивление: §G-5,0%§!\n\nТекущие эффекты:"
 ITA_missiolini_occupy_ticino_subject_effects:0 "\nЕсли [SWI.GetFlag][SWI.GetName] является зависимым государством §Y[ROOT.GetFlag][ROOT.GetNameDef]§!:\n"
 ITA_missiolini_bolster_political_cabinet:0 "Усилить политический кабинет"
 ITA_missiolini_bolster_political_cabinet_desc:1 "Подобрать подходящих людей на подходящие должности всегда трудно. В поисках самых умных и талантливых нельзя оставлять ни одного камня неперевёрнутым."
 ITA_missiolini_bolster_political_cabinet_trigger_tt:0 "Активны §Y3§! $political_advisor$, причём как минимум один из них — §Yиерарх§!"
 ITA_missiolini_bolster_military_high_command:0 "Усилить высшее военное командование"
 ITA_missiolini_bolster_military_high_command_desc:1 "Поиск и продвижение достойных кандидатов в высшее военное командование укрепит наше стратегическое и тактическое мышление в предстоящих конфликтах."
 ITA_missiolini_bolster_military_high_command_trigger_tt:0 "Активны §Y3§! советника $high_command$"
 ITA_victory_in_ethiopia_flag:0 "Итальянская победа в итало-эфиопской войне."
 ITA_balance_of_power_category:0 "$ITA_power_balance$"
 ITA_bop_take_over_ministry_of_foreign_affairs:0 "Возглавить Министерство иностранных дел"
 ITA_bop_take_over_ministry_of_foreign_affairs_desc:1 "Назначив себя министром иностранных дел, Бенито Муссолини сможет напрямую контролировать внешнюю политику и международные отношения Италии."
 ITA_bop_resign_ministry_of_foreign_affairs_position:0 "Покинуть пост министра иностранных дел"
 ITA_bop_resign_ministry_of_foreign_affairs_position_desc:1 "Отказ от поста министра иностранных дел откроет его для других и ослабит контроль Бенито Муссолини над внешней политикой и международными отношениями Италии."
 ITA_bop_take_over_ministry_of_justice:0 "Возглавить Министерство юстиции"
 ITA_bop_take_over_ministry_of_justice_desc:1 "Назначив себя министром милости и юстиции, Бенито Муссолини сможет напрямую контролировать судебную систему и учреждения Италии."
 ITA_bop_resign_ministry_of_justice_position:0 "Покинуть пост министра юстиции"
 ITA_bop_resign_ministry_of_justice_position_desc:1 "Отказ от поста министра милости и юстиции откроет его для других и ослабит контроль Бенито Муссолини над судебной системой и учреждениями Италии."
 ITA_bop_take_over_ministry_of_education:0 "Возглавить Министерство образования"
 ITA_bop_take_over_ministry_of_education_desc:1 "Назначив себя министром народного образования, Бенито Муссолини сможет напрямую контролировать образовательную систему и учреждения Италии."
 ITA_bop_resign_ministry_of_education_position:0 "Покинуть пост министра образования"
 ITA_bop_resign_ministry_of_education_position_desc:1 "Отказ от поста министра народного образования откроет его для других и ослабит контроль Бенито Муссолини над образовательной системой и учреждениями Италии."
 ITA_bop_take_over_ministry_of_corporations:0 "Возглавить Министерство корпораций"
 ITA_bop_take_over_ministry_of_corporations_desc:1 "Назначив себя министром корпораций, Бенито Муссолини сможет напрямую контролировать финансовую систему и учреждения Италии."
 ITA_bop_resign_ministry_of_corporations_position:0 "Покинуть пост министра корпораций"
 ITA_bop_resign_ministry_of_corporations_position_desc:1 "Отказ от поста министра корпораций откроет его для других и ослабит контроль Бенито Муссолини над финансовой системой и учреждениями Италии."
 ITA_mussolini_took_over_minister_of_foreign_affairs_flag:0 "С момента, когда §Y[ROOT.ITA_benito_mussolini.GetName]§! возглавил Министерство иностранных дел, прошло §Y365 дней§!\n(Сейчас прошло §Y[?ITA_mussolini_took_over_minister_of_foreign_affairs_flag:days|Y0]§! дней)"
