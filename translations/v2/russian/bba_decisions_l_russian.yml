 SWI_concessions_to_democrats_desc:0 "[SWI_concessions_to_political_party_desc]"
 SWI_concessions_to_political_party_desc:0 "Наша жёсткая позиция в отношении [ROOT.GetAdjective] движения [FROM.GetRulingIdeology] может оттолкнуть [FROM.GetAdjective] сторону и вызвать дипломатический инцидент или даже вторжение. Возможно, пора смягчить отношение к [FROM.GetRulingIdeologyNoun]."
 SWI_cancel_trade_agreement_prematurely:0 "Преждевременно отменить торговое соглашение"
 SWI_weapons_production_for_civilian_supplies:0 "Обменять части оружия на припасы"
 SWI_weapons_production_for_civilian_supplies_desc:0 "Запасы истощаются, и у нас нет иного выбора, кроме как разрешить части военной промышленности производить детали для [FROM.GetAdjective] военной машины. Так мы хотя бы обеспечим гражданские поставки и, возможно, удержим [FROM.GetNameDef] от вторжения в [ROOT.GetName]."
 SWI_country_angry_mission:0 "[SWI_get_country_angry_mission_title]"
 SWI_country_angry_mission_desc:0 "Похоже, [?SWI_angriest_country.GetNameDef] истолковало наши действия в отношении других стран как неприемлемое нарушение нейтралитета. Если вскоре его не умиротворить, оно наверняка использует это как повод для вторжения."
