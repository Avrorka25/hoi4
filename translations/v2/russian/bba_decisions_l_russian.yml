 SWI_offer_fascist_to_trade_gold:0 "Открыть банки для фашистской нации"
 SWI_offer_democratic_to_trade_gold:0 "Открыть банки для демократической нации"
 SWI_seize_democratic_gold:0 "Конфисковать золото демократической нации"
 SWI_seize_fascist_gold:0 "Конфисковать золото фашистской нации"
 SWI_cancel_fascism_ban:0 "Отменить запрет фашистских партий"
 SWI_embrace_communism:0 "Принять коммунизм"
 SWI_embrace_communism_desc:0 "Теперь, когда всё подготовлено, необходимо действовать быстро и воспользоваться уникальным шансом превратить [ROOT.GetNonIdeologyName] в рабочий рай."
 SWI_declare_the_alpine_confederation:0 "Провозгласить Альпийскую конфедерацию"
 SWI_declare_the_alpine_confederation_desc:0 "Теперь, когда наша демократия распространилась по Альпам, конфедерация принадлежит уже не только [SWI.GetNonIdeologyName], а всем народам и общинам Альп."
 SWI_declare_the_alpine_union:0 "Провозгласить Альпийский союз"
 SWI_declare_the_alpine_union_desc:0 "Волю рабочих и народов Альп не остановить. Продолжая освобождать земли от ярма буржуазии, мы вышли за пределы [SWI.GetNonIdeologyName], и название страны должно это отражать."
 SWI_ask_for_guarantees:0 "Спроси. [FROM.GetName] Для гарантий"
 SWI_purchase_foreign_fighters:0 "Закупить истребители у [FROM.GetName]"
 SWI_purchase_foreign_fighters_desc:0 "Оборона неба над [ROOT.GetName] не может ждать, пока мы сможем создать собственную авиационную промышленность, поэтому пока придётся полагаться на истребители из [FROM.GetName]."
 SWI_purchase_foreign_cas:0 "Закупить бомбардировщики у [FROM.GetName]"
 SWI_purchase_foreign_cas_desc:0 "Пока наши промышленные возможности ограничены, придётся полагаться на [FROM.GetName] в поставках бомбардировщиков, необходимых для поддержки войск на поле боя."
 SWI_purchase_foreign_planes_unlock_TT:0 "Открывает решения по закупке §Yистребителей и штурмовиков§! у §Y[THIS.GetFlag][THIS.GetNameDef]§!"
 SWI_fund_resistance_decision:0 "Финансировать группы сопротивления в государстве [SWI_FROM_or_fake_country_word]"
 SWI_oust_the_conferedation_president:1 "§Y[?SWI_confederation_president.GetName]§! будет отстранён от должности президента конфедерации"
 SWI_backchannel_negotiations:0 "Тайные переговоры"
 SWI_cost_5_mil_factories:0 "£mil_factory£ §Y5§!"
 SWI_cost_5_mil_factories_blocked:0 "£mil_factory£ §R5§!"
 SWI_cost_5_mil_factories_tooltip:0 "Для начала требуется не менее §Y5 £mil_factory£ военных заводов§!"
 SWI_seek_increased_trade:0 "Стараться нарастить торговлю"
 SWI_country_to_balance_TT:0 "Является потенциальным агрессором"
 SWI_max_gold_trade_TT:0 "§RДостигнут предел торговли золотом§!"
 SWI_max_country_gold_trade_TT:0 "§RДостигнут предел торговли золотом для этой страны§!"
 SWI_reducing_effects_from_seizing_gold_TT:0 "Бонусы от §Y$SWI_swiss_gold_market$§! будут §Rснижены§! в зависимости от размера [THIS.GetAdjective] резервов\n"
 SWI_gold_trading_partner:0 "Использует наши банки для торговли золотом"
 SWI_vacant_confederation_president_position:0 "Должность президента конфедерации вакантна"
 SWI_federal_council_decisions_category:0 "Федеральный совет"
 SWI_federal_council_decisions_category_desc:2 "[SWI_get_correct_council_category_description]"
 SWI_federal_council_decisions_category_desc_dem:0 "Федеральный совет Швейцарии с 1848 года остаётся непоколебимой вершиной швейцарской демократии. [SWI_get_temp_explanation_of_council_system]\n\n§YПрезидент Швейцарской конфедерации:§!\n[SWI_GetPresidentName]\n\n§YВедущие советники:§!\n[SWI_GetCouncilor1name]\n[SWI_GetCouncilor2name]\n[SWI_GetCouncilor3name]"
 SWI_federal_council_decisions_category_desc_fasc:0 "Возможно, это уже не прежний совет, но новому славному режиму во главе с [SWI.GetLeader] всё ещё нужен сильный орган, который будет проводить волю фюрера в [?SWI.SWI_biggest_fascist.GetNameDef].\n\n§YВедущие советники:§!\n[SWI_GetCouncilor1name]\n[SWI_GetCouncilor2name]\n[SWI_GetCouncilor3name]"
 SWI_federal_council_decisions_category_desc_alt:0 "Нельзя ожидать, что лидер [SWI.GetNameDef] [SWI.GetLeader] единолично выполнит все обязанности страны с такой важной миссией. Поэтому [SWI.GetLeader.GetSheHe] должен опираться на совет и передать ему часть функций упразднённого собрания.\n\n§YВедущие советники:§!\n[SWI_GetCouncilor1name]\n[SWI_GetCouncilor2name]\n[SWI_GetCouncilor3name]"
 SWI_recently_finished_president_initiative:0 "Недавно завершена инициатива Совета"
 SWI_recently_finished_president_initiative_desc:0 "Из-за ограниченной власти президента конфедерации и Федерального совета необходимо подождать, прежде чем предпринимать новую согласованную инициативу. Расширение полномочий совета позволит проводить их чаще, но следует подумать, совместимо ли это с глубоко укоренёнными демократическими ценностями Швейцарии."
 SWI_defense_fund_drive:0 "Сбор средств для Фонда обороны"
 SWI_defense_fund_drive_desc:0 "Для защиты от потенциальных захватчиков нужны деньги, которых у федерального правительства Швейцарии нет. Но мы можем призвать граждан страны собрать необходимые средства в рамках подлинной инициативы снизу."
 SWI_swiss_democratic_tradition_campaign:0 "Кампания за демократические традиции Швейцарии"
 SWI_swiss_democratic_tradition_campaign_desc:0 "Мы можем напомнить населению о богатой демократической традиции Швейцарии — старейшей демократии Европы и, возможно, единственной подлинной."
 SWI_rally_workers:0 "Сплотить рабочих"
 SWI_rally_workers_desc:0 "Рабочие могут стать важнейшей частью обороны [SWI.GetName]. Следует поощрять их активное участие в [SWI.GetAdjective] военной промышленности и готовность переносить необходимые жертвы."
 SWI_anti_fascist_drive:0 "Антифашистское движение"
 SWI_anti_fascist_drive_desc:0 "В [ROOT.GetName] нет места фашистам. Как страна, преданная самоопределению и местной демократической власти и стремящаяся стать народным раем, мы обязаны избавиться от всех оставшихся фашистов, где бы они ни скрывались."
 SWI_spouse_fascism:0 "Проповедовать идеалы фашизма"
 SWI_spouse_fascism_desc:0 "С учётом мировых событий сближение с фашистскими державами может оказаться самым безопасным выбором. Мы начнём распространять фашистскую пропаганду, чтобы подготовить народ к смене ценностей."
 SWI_focus_on_swiss_unity:0 "Сделать акцент на единстве швейцарцев"
 SWI_focus_on_swiss_unity_desc:0 "Мы можем убедить [SWI.GetAdjective] население, что обстоятельства требуют забыть различия в языке, классе, происхождении и политических взглядах и объединить ресурсы ради защиты единства и разнообразия, определяющих [SWI.GetNameDef]."
 SWI_isolate_switzerland:0 "Изолировать Швейцарию"
 SWI_isolate_switzerland_desc:0 "Следует сделать всё возможное, чтобы [SWI.GetName] могла существовать самостоятельно и независимо. Возможно, это единственный способ сохранить нашу драгоценную свободу."
 SWI_militarization_drive:0 "Милитаризация"
 SWI_militarization_drive_desc:0 "Можно сосредоточиться на расширении [SWI.GetAdjective] военной машины, чтобы защититься и, возможно, самим перехватить инициативу и нанести упреждающий удар."
 SWI_expand_covert_operations:0 "Увеличить число тайных операций"
 SWI_expand_covert_operations_desc:0 "Можно увеличить разведывательные ресурсы, чтобы влиять на мировые дела в свою пользу, сохраняя видимость нейтралитета."
 SWI_expand_arms_industry:0 "Усилить производство оружия"
 SWI_expand_arms_industry_desc:0 "Необходимо увеличить возможности разработки и быстрого производства нового оружия, чтобы не зависеть от иностранных держав в вопросах обороны."
 SWI_support_humanitarian_efforts:0 "Поддержать гуманитарные операции"
 SWI_support_humanitarian_efforts_desc:0 "Мы не можем бездействовать, пока вокруг совершаются зверства. Наш моральный долг — помогать угнетённым народам Европы и предоставлять им убежище."
 SWI_diplomatic_mission:0 "Дипломатическая миссия"
 SWI_diplomatic_mission_desc:0 "Мы можем совершать дипломатические поездки в другие страны, укрепляя отношения и развеивая сомнения в нашем нейтралитете, чтобы избежать возможного вторжения."
 SWI_appease_fascists:0 "Задобрить фашистов"
 SWI_appease_fascists_desc:0 "Мы можем принять новый европейский порядок и научиться сосуществовать с фашистскими соседями. Это позволит избежать войны и сохранить независимость и нейтралитет."
