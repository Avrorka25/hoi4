 ETH_offer_peace_DJI_tt:0 "Предложить владельцу [DJI.GetAdjective] территории мир, если он согласится отказаться от претензий на земли, которые сейчас контролирует [ETH.GetName]. Контролируемая [DJI.GetAdjective] территория станет марионеткой [ETH.GetAdjective] стороны."
