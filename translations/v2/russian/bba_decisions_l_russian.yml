 ITA_bop_slander_the_duce:0 "Оклеветать дуче"
 ITA_bop_slander_the_duce_desc:1 "Италия терпит трудности на нескольких фронтах из-за некомпетентности [ITA.GetLeader]. Возможно, пришло время сменить руководство?"
 ITA_bop_criticize_the_war:0 "Критиковать ведение войны"
 ITA_bop_criticize_the_war_desc:1 "Наши доблестные войска испытывают трудности из-за некомпетентного руководства, плохой логистики и недостаточного оснащения. Эти проблемы необходимо исправить!"
 ITA_bop_question_the_army:0 "Поставить под сомнение верность армии"
 ITA_bop_question_the_army_desc:1 "Недавние события продемонстрировали неэффективность армии, и многие задаются вопросом, насколько войска верны Италии и фашистской системе."
 ITA_bop_question_the_airforce:0 "Поставить под сомнение верность авиации"
 ITA_bop_question_the_airforce_desc:1 "Недавние события продемонстрировали неэффективность авиации, и многие задаются вопросом, насколько её личный состав верен Италии и фашистской системе."
 ITA_bop_question_the_navy:0 "Поставить под сомнение верность флота"
 ITA_bop_question_the_navy_desc:1 "Недавние события продемонстрировали неэффективность флота, и многие задаются вопросом, насколько моряки верны Италии и фашистской системе."
 ITA_bop_military_parade:0 "Провести военный парад"
 ITA_bop_military_parade_desc:1 "Настало время почтить победоносных и доблестных солдат и позволить итальянскому народу выразить им свою любовь."
 ITA_bop_send_support:0 "Отправить военную поддержку [FROM.GetName]"
 ITA_bop_send_support_desc:1 "Наши идеологические братья оказались на войне. Как основатели фашизма, мы обязаны обеспечить их победу!"
 ITA_bop_praise_the_army:0 "Воздать хвалу армии"
 ITA_bop_praise_the_army_desc:1 "Мужественные мужчины и женщины, служащие в нашей армии, являются основой безопасной и стабильной [ITA.GetName]. Они заслуживают обожания итальянского народа!"
 ITA_bop_praise_the_airforce:0 "Воздать хвалу авиации"
 ITA_bop_praise_the_airforce_desc:1 "Мужественные мужчины и женщины, служащие в наших военно-воздушных силах, являются основой безопасной и стабильной [ITA.GetName]. Они заслуживают обожания итальянского народа!"
 ITA_bop_praise_the_navy:0 "Воздать хвалу флоту"
 ITA_bop_praise_the_navy_desc:1 "Мужественные мужчины и женщины, служащие в нашем флоте, являются основой безопасной и стабильной [ITA.GetName]. Они заслуживают обожания итальянского народа!"
 ITA_discredit_haile_selassie:0 "Дискредитировать лидера, [ETH.GetLeader] недостоин править"
 ITA_discredit_haile_selassie_desc:1 "Рассказав эфиопам, что Хайле Селассие трусливо бежал и предаётся роскоши в далёкой стране, мы сможем склонить часть населения на нашу сторону и подорвать репутацию бывшего императора."
 ITA_electrify_state:0 "$ETH_electrify_state$"
 ITA_electrify_state_desc:0 "$ETH_electrify_state_desc$"
 ITA_vallo_alpino_del_littorio_dec_cat:0 "Прибрежный «Альпийский вал»"
 ITA_vallo_alpino_del_littorio_dec_cat_desc:1 "$ITA_vallo_alpino_del_littorio_desc$"
 ITA_vallo_alpino_occidentale:0 "Западный «Альпийский вал»"
 ITA_vallo_alpino_occidentale_desc:1 "Мы можем обезопасить западную границу, построив там систему укреплений."
 ITA_vallo_alpino_occidentale_tt:0 "Построить оборонительную линию в §Y[158.GetName]§! вдоль западной альпийской границы с [735.GetName] и [847.GetName].\n"
 ITA_vallo_alpino_settentrionale_west:0 "Северный «Альпийский вал» (запад)"
 ITA_vallo_alpino_settentrionale_west_desc:1 "Мы можем обезопасить северо-западную границу, построив там систему укреплений."
 ITA_vallo_alpino_settentrionale_west_tt:0 "Построить оборонительную линию в §Y[158.GetName]§! и §Y[159.GetName]§! вдоль северо-западной альпийской границы с [846.GetName] и [151.GetName].\n"
 ITA_vallo_alpino_settentrionale_east:0 "Северный «Альпийский вал» (восток)"
 ITA_vallo_alpino_settentrionale_east_desc:1 "Мы можем обезопасить северо-восточную границу, построив там систему укреплений."
 ITA_vallo_alpino_settentrionale_east_tt:0 "Построить оборонительную линию в §Y[850.GetName]§! и §Y[39.GetName]§! вдоль северо-восточной альпийской границы с [153.GetName].\n"
 ITA_vallo_alpino_orientale:0 "Восточный «Альпийский вал»"
 ITA_vallo_alpino_orientale_desc:1 "Мы можем обезопасить восточную границу, построив там систему укреплений."
 ITA_vallo_alpino_orientale_tt:0 "Построить оборонительную линию в §Y[160.GetName]§!, §Y[736.GetName]§! и §Y[852.GetName]§! вдоль восточной альпийской границы с [153.GetName], [102.GetName], [853.GetName] и [103.GetName].\n"
 ITA_vallo_alpino_project_ongoing_flag:0 "Уже ведётся проект расширения $ITA_vallo_alpino_del_littorio$."
 ITA_colonial_management_dec_cat:0 "Управление колониями"
 ITA_colonial_management_dec_cat_desc:1 "$ITA_ministry_of_italian_africa_desc$"
 ITA_disband_irregulars:0 "Расформировать нерегулярные части"
 ITA_disband_irregulars_desc:1 "Колониальные нерегулярные войска нам больше не нужны. Пусть возвращаются домой или туда, откуда пришли."
 ITA_disband_irregulars_tt:0 "§RВсе нерегулярные дивизии будут распущены§!.\n(Людские ресурсы и снаряжение не возвращаются)"
 ITA_train_irregulars:0 "Подготовить нерегулярные части"
 ITA_train_irregulars_desc:1 "Набор местных сил снизит нагрузку на наши людские ресурсы. Кроме того, уроженцы этих земель хорошо знают местные народы и географию."
 ITA_train_irregulars_create_units_tt:0 "Создать §Y[ROOT.GetFlag][ROOT.GetAdjective]§! нерегулярные части в принадлежащих и контролируемых колониях:"
 ITA_train_irregulars_eritrea_tt:0 "Создать §Y1 дивизию $irregular_infantry$§! и §Y1 дивизию $cavalry$§!."
 ITA_train_irregulars_libya_tt:0 "Создать §Y1 дивизию $cavalry$§! и §Y1 дивизию $camelry$§!."
 ITA_train_irregulars_somalia_tt:0 "Создать §Y1 дивизию $irregular_infantry$§! и §Y1 дивизию $cavalry$§!."
 ITA_train_irregulars_ethiopia_tt:0 "Создать §Y1 дивизию $irregular_infantry$§! и §Y1 дивизию $camelry$§!."
 ITA_train_irregulars_cd_tt:0 "\nЭто решение снова станет доступно через §Y[?ITA_colonial_management_cd] дней§!.\n"
 ITA_reorganize_irregulars:0 "Реорганизовать нерегулярные части"
 ITA_reorganize_irregulars_desc:1 "Реорганизация нерегулярных войск позволит усилить их и сделать более грозной силой."
 ITA_reorganize_irregulars_tt:1 "Добавляет §Y2 батальона $irregular_infantry$§! и §Y1 батальон $recon$§! во все шаблоны дивизий нерегулярной пехоты.\nДобавляет §Y2 батальона $cavalry$§! и §Y1 батальон $recon$§! во все шаблоны дивизий нерегулярной кавалерии.\nДобавляет §Y2 батальона $camelry$§! и §Y1 батальон $recon$§! во все шаблоны дивизий нерегулярной верблюжьей кавалерии."
 ITA_reorganize_ascari:0 "Реорганизовать аскари"
 ITA_reorganize_ascari_desc:1 "Реорганизация войск аскари позволит усилить их и сделать более грозной силой."
 ITA_reorganize_ascari_tt:1 "Добавляет §Y1 батальон $armored_car_recon$§! и §Y1 батальон $artillery_brigade$§! во все шаблоны колониальных пехотных дивизий.\nДобавляет §Y2 батальона $cavalry$§! и §Y1 батальон $recon$§! во все шаблоны колониальных кавалерийских дивизий.\nДобавляет §Y2 батальона $camelry$§! и §Y1 батальон $recon$§! во все шаблоны колониальных дивизий верблюжьей кавалерии."
 ITA_regional_development_in_state:0 "[FROM.GetName]: региональное развитие"
 ITA_regional_development_in_state_desc:1 "Развитие колониальных владений сделает их более пригодными для жизни и процветающими."
 ITA_naval_cooperation_programs_dec_cat:0 "Программа морского сотрудничества"
 ITA_naval_cooperation_programs_dec_cat_desc:1 "$ITA_cooperation_programs_desc$"
 ITA_cooperation_program_with_country:0 "Программа сотрудничества с государством [FROM.GetNameDef]"
 ITA_cooperation_program_with_country_desc:1 "Строительство и экспорт наших кораблей в другие страны может привести к более глубокому технологическому сотрудничеству."
 ITA_joint_maneuvers_with_country:0 "Совместные [ROOT.GetAdjective]о-[FROM.GetAdjective]ие маневры"
 ITA_joint_maneuvers_with_country_desc:1 "Любые вооружённые силы должны быть подготовлены и готовы к действиям. Совместные учения с другой страной как раз помогут этого добиться."
