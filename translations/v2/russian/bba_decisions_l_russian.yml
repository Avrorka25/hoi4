 ITA_mussolini_took_over_minister_of_education_flag:0 "С момента, когда §Y[ROOT.ITA_benito_mussolini.GetName]§! возглавил Министерство образования, прошло §Y365 дней§!\n(Сейчас прошло §Y[?ITA_mussolini_took_over_minister_of_education_flag:days|Y0]§! дней)"
 ITA_mussolini_resigned_minister_of_education_position_flag:0 "С момента, когда §Y[ROOT.ITA_benito_mussolini.GetName]§! покинул пост министра образования, прошло §Y365 дней§!\n(Сейчас прошло §Y[?ITA_mussolini_resigned_minister_of_education_position_flag:days|Y0]§! дней)"
 ITA_mussolini_took_over_minister_of_corporations_flag:0 "С момента, когда §Y[ROOT.ITA_benito_mussolini.GetName]§! возглавил Министерство корпораций, прошло §Y365 дней§!\n(Сейчас прошло §Y[?ITA_mussolini_took_over_minister_of_corporations_flag:days|Y0]§! дней)"
