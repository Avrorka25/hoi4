 SWI_renounce_guiding_principles_desc_cantons:0 "Наше первоначальное стремление и дальше передавать власть кантонам и Федеральному собранию, возможно, было преждевременным. Текущие обстоятельства ясно показывают, что для выживания необходим более деятельный и влиятельный Федеральный совет."
 SWI_renounce_guiding_principles_desc_council:0 "Наше первоначальное стремление сосредоточить власть в Федеральном совете, возможно, было ошибочным. Нынешняя ситуация требует более прямой и всеобъемлющей демократии, основанной на стабильности и участии граждан."
