 ETH_offer_peace_SUD:0 "Предложить мир ради независимости [SUD.GetAdjective] народа"
 ETH_offer_peace_SUD_tt:0 "Предложить владельцу [SUD.GetAdjective] территории мир, если он согласится отказаться от претензий на земли, которые сейчас контролирует [ETH.GetName]. Контролируемая [SUD.GetAdjective] территория станет марионеткой [ETH.GetAdjective] стороны."
