 GRE_divided_nation_category:0 "Страна в смятении"
 GRE_divided_nation_category_desc:0 "Наша страна находится на грани краха: многие боятся грядущей гражданской войны, другие пытаются покинуть родину ради лучшей жизни за рубежом. Чтобы вновь встать на ноги, придётся принимать трудные решения."
 GRE_work_on_stability:0 "Успокоить нацию"
 GRE_work_on_stability_desc:0 "Необходимо убедиться, что народ поддерживает нас в этой борьбе."
 GRE_work_on_economy:0 "Ускорить восстановление"
 GRE_work_on_economy_desc:0 "Мы можем ускорить восстановление, приняв новые законы, заключив более выгодные торговые соглашения и привлекая иностранные инвестиции."
 GRE_work_on_government:0 "Вернуть доверие к правительству"
 GRE_work_on_government_desc:0 "Нам трудно выйти из кризиса, поскольку министры слабы и неопытны и, скорее всего, не способны справиться с подобной ситуацией."
 GRE_honor_byzantium:0 "Почтить Византию"
 GRE_honor_byzantium_desc:0 "Византийская империя — предмет гордости греков. Хотя полностью восстановить её прежние границы невозможно, мы можем почтить её память и не позволить ей кануть в забвение."
 GRE_honor_byzantium_category:0 "Почтить византийцев"
 GRE_honor_byzantium_category_desc:0 "Византийская империя — предмет гордости греков. Хотя полностью восстановить её прежние границы невозможно, мы можем почтить её память и не позволить ей кануть в забвение."
