l_russian:
 greek_focus:0 "Национальные фокусы Греции"
 GRE_legislative_elections:0 "Парламентские выборы"
 GRE_demertzis_illing_health:0 "Ухудшение здоровья Демердзиса"
 GRE_communist_insurrection:0 "Надвигающиеся забастовки профсоюзов"
 GRE_communist_insurrection_desc:0 "Нынешнее слабое правительство ухудшило положение рабочих, что приведёт к забастовкам или даже к чему-то худшему — например, гражданской войне. Если политическая ситуация останется без внимания, следует готовиться к худшему.\n\n§RПоддержка бастующих приведёт к гражданской войне.§!"
 GRE_despotism_desc:0 "§YМетаксизм§! — тоталитарная националистическая идеология, связанная с греческим политиком §WИоаннисом Метаксасом§!. Она призывает к §Yвозрождению§! греческой нации и созданию §Hсовременной, культурно однородной Греции§!. Метаксизм отвергает либерализм и подчиняет личные интересы интересам страны, стремясь мобилизовать греческий народ в дисциплинированную массу ради создания §Bновой Греции§!."
 GRE_absolute_monarchism_desc:0 "§YШлезвиг-Гольштейн-Зондербург-Глюксбургский дом§! — датско-германская ветвь Ольденбургского дома. Он получил греческий престол в 1863 году, когда Георг I стал §Bкоролём эллинов§!."
 GRE_economic_recovery:0 "Восстановление экономики"
 GRE_economic_recovery_desc:0 "Как небольшая страна, [GRE.GetNameDef] должна быть готова выдержать любую возможную бурю. Стабилизация экономики поможет достичь этой цели."
 GRE_industrial_effort:0 "Расширение промышленности"
 GRE_industrial_effort_desc:0 "Мы начнём субсидировать и утверждать проекты по расширению гражданской промышленности, что позволит трудоустроить значительную часть населения и одновременно ускорить индустриализацию страны."
 GRE_industrial_effort_2:0 "Создание военно-промышленного комплекса"
 GRE_industrial_effort_2_desc:0 "Чтобы обеспечить закупки и быстрое развитие оружейной промышленности, необходимые армии, мы должны закрепить союз между вооружёнными силами и их поставщиками. Это позволит подготовиться к грядущему конфликту и улучшить состояние армии."
 GRE_infrastructure_effort:0 "Модернизация железнодорожной сети"
 GRE_infrastructure_effort_desc:0 "Хотя железные дороги удовлетворяют потребности экономики, они не соответствуют требованиям армии. Необходимо обновить и стандартизировать пути, составить расписания, исключающие заторы между поездами, и разработать специальные планы перевозки военнослужащих на случай войны."
 GRE_extra_tech_slot:0 "Остановить утечку умов"
 GRE_extra_tech_slot_desc:0 "Наши интеллектуалы уезжают в другие страны, предлагающие лучшие перспективы для их карьеры. Мы введём новые гранты для тех, кто останется, и начнём создавать и поддерживать больше учреждений, способных предоставить им работу на [GRE.GetAdjective] родине."
 GRE_further_development:0 "Ускорить промышленный рост"
 GRE_further_development_desc:0 "С помощью программ общественных работ и дополнительных субсидий компаниям, расширяющим деятельность в [GRE.GetNameDef], мы продолжим создавать промышленную основу для процветания экономики."
 GRE_jobs_for_the_people:0 "Субсидировать промышленный сектор"
 GRE_jobs_for_the_people_desc:0 "Для борьбы с массовой безработицей в [GRE.GetNameDef] потребуется дальнейшее вмешательство правительства. Субсидии, низкопроцентные кредиты и помощь нуждающимся компаниям позволят вновь запустить экономику."
 GRE_bullet_factories:0 "Расширить оружейный сектор"
 GRE_bullet_factories_desc:0 "Правительство предоставит гранты оружейным компаниям в [GRE.GetNameDef], поощряя расширение производства и строительство новых заводов."
 GRE_jet_engines:0 "Реактивные двигатели"
 GRE_jet_engines_desc:0 "Пропеллеры уходят в прошлое. Чтобы господствовать в воздухе, необходимо принять будущее."
 GRE_fight_depression:0 "Бороться с Великой депрессией"
 GRE_fight_depression_desc:0 "Великая депрессия тяжело ударила по греческому народу. Безработица, потеря сбережений и непосильные долги — лишь некоторые из ежедневных проблем граждан. Правительство должно действовать быстро, пока положение не ухудшилось ещё сильнее. Увеличив дефицит бюджета и стимулируя расходы, мы сможем направить страну к экономическому восстановлению."
 GRE_end_the_depression:0 "Покончить с Великой депрессией"
 GRE_end_the_depression_desc:0 "Хотя худший период Великой депрессии миновал, оставленные ею раны ещё не зажили. Необходимо заранее убедить граждан, что годы лишений остались в прошлом и страна принимает меры, чтобы лучше защитить население от будущих спадов и депрессий."
 GRE_naval_construction:0 "Индустриализация флота"
 GRE_naval_construction_desc:0 "Чтобы создать более крупный и современный [GRE.GetAdjective] флот, сначала необходимо расширить число верфей, построить новые и модернизировать существующие, обеспечив достаточную базу для будущих кораблей."
 GRE_light_ship_effort:0 "Модернизировать «Элли»"
 GRE_light_ship_effort_desc:0 "Суровая реальность такова, что [GRE.GetAdjective] экономика едва ли способна оплачивать массовое строительство линкоров, линейных крейсеров или авианосцев. Расширять и модернизировать флот придётся за счёт меньших и более манёвренных кораблей."
 GRE_submarine_effort:0 "Волки Эгейского моря"
 GRE_submarine_effort_desc:0 "Изобретение подводных лодок и развитие подводной войны доказали свою эффективность. Возможность наносить незаметные удары непосредственно по судоходству и транспортам окажет нам большую поддержку в грядущем конфликте."
 GRE_naval_air_effort:0 "Орлы Эгейского моря"
 GRE_naval_air_effort_desc:0 "Хотя это дорогостоящая затея, создание кораблей, способных нести и применять авиацию, поднимет наш флот на новый уровень. Господство в воздухе уже доказало свою ценность, а сочетание авиационного превосходства с морской изобретательностью сокрушит даже самый грозный флот мира."
 GRE_naval_way:0 "Великая морская держава"
 GRE_naval_way_desc:0 "Правительство разработает и распространит «новый курс» для флота. Массовые субсидии и увеличение бюджета позволят построить и развернуть гораздо более крупные военно-морские силы."
 GRE_carrier_focus:0 "Ставка на авианосцы"
 GRE_carrier_focus_desc:0 "Адмиралтейство оценило преимущества авианосцев и желает повысить их современность и стратегическую ценность. Мы предоставим необходимые средства."
 GRE_battleship_focus:0 "Ставка на линкоры"
 GRE_naval_artillery:0 "Морская артиллерия"
 GRE_naval_artillery_desc:0 "Наша страна способна производить лишь снаряды для крейсеров. Чтобы вооружать корабли более крупными башнями, необходимо освоить выпуск боеприпасов большего калибра."
 GRE_battleship_focus_desc:0 "Адмиралтейство считает использование авианосцев излишним. Более пяти тысяч островов страны дают достаточно баз для авиации. Вместо этого мы сосредоточимся на модернизации и строительстве линкоров, способных сражаться на равных с крупнейшими кораблями других флотов."
 GRE_bigger_navy:0 "Великая морская держава"
 GRE_bigger_navy_desc:0 "Наши афинские предки господствовали на морях с помощью боевых кораблей. Мы должны последовать их примеру и построить флот, способный победить любого, кто осмелится встать у нас на пути."
 GRE_better_navy:0 "Господство на море"
 GRE_better_navy_desc:0 "Во время морского сражения при Саламине персы значительно превосходили числом наших эллинских предков, но острый ум и смелая стратегия принесли им победу. Мы должны поощрять подобные новшества в адмиралтействе и следовать примеру предков."
 GRE_aviation_effort:0 "Авиация"
 GRE_aviation_effort_desc:0 "Хотя Греция относительно недавно познакомилась с воздушной войной, необходимо внедрять новшества во всех областях военного дела."
 GRE_fighter_focus:0 "Ставка на истребители"
 GRE_fighter_focus_desc:0 "Высшему командованию ясно, что истребители являются ключом к воздушной войне. Необходимо немедленно поддержать исследования и производство современных моделей."
 GRE_bomber_focus:0 "Ставка на бомбардировщики"
 GRE_bomber_focus_desc:0 "Высшее командование оценило преимущества крупных воздушных флотов бомбардировщиков. Возможность разрушать инфраструктуру, линии снабжения и промышленную базу врага представляет для нас огромную ценность."
 GRE_further_air_plans:0 "Дальнейшие планы развития авиации"
 GRE_further_air_plans_desc:0 "Чтобы продолжать внедрять новшества и модернизировать ВВС, высшее командование и исследователи должны тесно сотрудничать с пилотами и экипажами."
 GRE_heavy_cruiser_effort:0 "Модернизировать «Авероф»"
 GRE_heavy_cruiser_effort_desc:0 "Прежде чем адмиралтейство сможет задуматься о строительстве и включении в состав флота линкоров или авианосцев, необходимо улучшить основу военно-морских сил. Тяжёлые крейсеры хорошо нам служили, и их дальнейшее совершенствование создаст прочный фундамент для развития флота."
 GRE_base_strike:0 "Удар по базам"
 GRE_base_strike_desc:0 "Применение авиации в морской войне станет ключом к победе. Необходимо разработать соответствующую этой идее доктрину."
 GRE_fleet_in_being:0 "Флот как фактор сдерживания"
 GRE_fleet_in_being_desc:0 "Доктрина «флота как фактора сдерживания» хорошо служила стране в прошлом. Хотя нельзя впадать в самодовольство, мы сохраним её основные принципы."
 GRE_fund_the_navy:0 "Финансировать флот"
 GRE_fund_the_navy_desc:0 "Пренебречь [GRE.GetAdjective] флотом означало бы предать память предков. Мы должны быть готовы отбросить любого потенциального захватчика, осмелившегося войти в наши воды."
 GRE_final_plans:0 "Последние приготовления"
 GRE_final_plans_desc:0 "Флот построен, тактика отточена. Мы начнём последние приготовления, чтобы закрепить господство на Эгейском море."
 GRE_open_different_plans:0 "Содействовать военным инновациям"
 GRE_open_different_plans_desc:0 "Правительство готово расширять и реформировать вооружённые силы. Мы можем начать внедрение новшеств как в авиации, так и в сухопутной доктрине."
 GRE_divided_naval_industry:0 "Разделённая судостроительная промышленность"
 GRE_divided_naval_industry_desc:0 "Морское производство в [GRE.GetNameDef] разделено между военно-морским арсеналом и гражданскими судостроителями. Правительство не может оставаться безучастным и должно выбрать сторону, которую будет поддерживать для продолжения флотских проектов."
 GRE_focus_on_trade:0 "Поощрять торговлю и гражданские контракты"
 GRE_focus_on_trade_desc:0 "Мы должны поддержать гражданских судостроителей и внедрить программы, поощряющие торговлю и модернизацию портов."
 GRE_further_arsenal_plans:0 "Гранты военно-морскому арсеналу"
 GRE_further_arsenal_plans_desc:0 "Мы должны поддержать военно-морской арсенал и выделить ему дополнительные гранты на строительство и расширение верфей."
 GRE_collect_from_trade:0 "Пожинать плоды"
 GRE_collect_from_trade_desc:0 "Инвестировав в гражданское судостроение и развитие торговли, мы можем воспользоваться результатами вложений."
 GRE_cas_focus:0 "Ставка на штурмовую авиацию"
 GRE_cas_focus_desc:0 "Наиболее эффективно ВВС смогут действовать в тесном взаимодействии с сухопутными силами. Поддержка разработки соответствующих самолётов и доктрин принесёт нам большую пользу."
 GRE_army_reform:0 "Восстановить армию"
 GRE_army_reform_desc:0 "Офицерский корпус и общее состояние армии остаются неудовлетворительными со времён войны 1922 года. Необходимо избавиться от старых порядков и устаревшей тактики и привести вооружённые силы к новым, более высоким стандартам."
 GRE_support_equipment_modernization:0 "Развивать вспомогательные службы"
 GRE_support_equipment_modernization_desc:0 "Без коллективной поддержки врачей, поваров и множества других служб армия — лишь вооружённые люди. Необходимо признать важность вспомогательных подразделений и содействовать их развитию."
 GRE_support_artillery:0 "Огневая поддержка дивизий"
 GRE_support_artillery_desc:0 "Великая война показала решающую роль артиллерии в бою. Мы должны внедрить поддержку дивизий артиллерийскими батареями, способными открыть огонь в любой момент."
 GRE_new_plans:0 "Реформировать офицерский корпус"
 GRE_new_plans_desc:0 "В офицерском корпусе по-прежнему служат трусы, бездельники и самодовольные люди. Для проведения значимых армейских реформ их необходимо устранить и заменить."
 GRE_land_doctrine_1:0 "Развитие доктрины"
 GRE_land_doctrine_1_desc:0 "Нельзя полагаться на старые стратегии. Чтобы продолжать побеждать на поле боя, необходимо развивать и совершенствовать тактику."
 GRE_motorization_effort:0 "Моторизация армии"
 GRE_motorization_effort_desc:0 "Некоторые представители высшего командования предлагают моторизировать армию, обеспечив большему числу солдат прямой доступ к более быстрым средствам передвижения."
 GRE_mechanization_effort:0 "Механизация армии"
 GRE_mechanization_effort_desc:0 "Моторизация улучшит перевозку войск, но не их защиту. Необходимо исследовать и разрабатывать бронемашины, способные защищать солдат и одновременно усиливать их огневую мощь."
 GRE_armor_effort:0 "Создать бронетанковый корпус"
 GRE_armor_effort_desc:0 "Хотя ландшафт страны не идеален для бронетанковой войны, нельзя игнорировать тактическую пользу этих машин. Необходимо создать технику, способную относительно легко действовать на нашей местности, и сформировать бронетанковые войска в составе сухопутных сил."
 GRE_med_armor_effort:0 "Средние танки"
 GRE_med_armor_effort_desc:0 "Изучив статистику и сведения с поля боя, высшее командование пришло к выводу, что дальнейший путь лежит в создании более крупных бронемашин с более тяжёлым вооружением."
 GRE_special_forces:0 "Войска специального назначения"
 GRE_special_forces_desc:0 "Наши войска специального назначения должны продолжать развивать доктрину и расширять круг операций, которые способны успешно выполнять. Для этого необходимо выделить средства, личный состав и материальное обеспечение."
 GRE_political_awakening:0 "Политическое пробуждение"
 GRE_political_awakening_desc:0 "Тёмная пелена накрыла значительную часть мира. Теперь как никогда [GRE.GetNameDef] должна тщательно выбирать друзей и следить за потенциальными врагами."
 GRE_divided_nation:0 "Преодолеть раскол страны"
 GRE_divided_nation_desc:0 "Режиму Метаксаса уже некоторое время удаётся контролировать политическую обстановку в [GRE.GetNameDef]. Однако любое серьёзное изменение поддержки может нарушить равновесие сил. Сможет ли режим удержаться в условиях растущей нестабильности в Европе — неизвестно."
 GRE_autarky_effort:0 "Отказаться от демократии"
 GRE_autarky_effort_desc:0 "Наши предки когда-то приняли идею прямой демократии, что в итоге привело их к гибели. В период внутренней борьбы нельзя доверять таким политикам, как Цалдарис, или коммунистам. Мы должны восстановить порядок!"
 GRE_national_union:0 "Национальный союз"
 GRE_national_union_desc:0 "Национальный союз выступает за возвращение к риторике и ценностям, которые сделали наших предков великими. Чтобы вернуть дни славы, необходимо принять его руководство."
 GRE_glorify_race:0 "Прославлять эллинскую культуру"
 GRE_glorify_race_desc:0 "Эллинский народ на протяжении истории был истинно благословлён и избран вести мир в новую эпоху. Выйдя из древних городов-государств вроде Афин и Спарты, мы вдохновляли значительную часть западной цивилизации в культуре, философии и политике. Греческий язык распространён по всему региону, и наш народ должен вновь объединиться!"
 GRE_recruitment_focus:0 "Вербовочные агентства"
 GRE_recruitment_focus_desc:0 "Каждый мужчина обязан сражаться во славу страны. Вернуть былое величие можно лишь посредством завоеваний и военных действий."
 GRE_strategic_interests:0 "Стратегические интересы"
 GRE_strategic_interests_desc:0 "Настало время открыть новые фронты и вернуть принадлежащее нам по праву. Греческое население региона разделено, и мы должны объединить всех греков в одной великой стране."
 GRE_alliances:0 "Дипломатия"
 GRE_alliances_desc:0 "К сожалению, [GRE.GetNameDef] не способна достичь своих целей в одиночку. Чтобы вернуть утраченное и по-настоящему выйти на мировую арену, необходимо заключить союзы с окружающими странами. Выбирать следует осторожно."
 GRE_befriend_italy:0 "Пакт о ненападении с [ITA.GetNameDef]"
 GRE_befriend_italy_desc:0 "Хотя в последние годы отношения с Италией были полны противоречий и вражды, мы должны обратиться к общему наследию и культуре и восстановить связь, которую недавно забросили. С их поддержкой мы сможем по-настоящему процветать."
 GRE_dodecanese_for_membership:0 "Додеканес в обмен на членство"
 GRE_dodecanese_for_membership_desc:0 "Следует предложить [ITA.GetAdjective] стороне вступление в их союз в обмен на Додеканес. Тогда [GRE.GetAdjective] флаг наконец поднимется над Родосом без войны."
 GRE_befriend_germany:0 "Пакт о ненападении с [GER.GetNameDef]"
 GRE_befriend_germany_desc:0 "[GER.GetAdjective] военная машина — неудержимая сила, и сближение со страной такого уровня значительно снизит риск возможных конфликтов с [eng.getnamedef] или [FRA.GetnameDef]."
 GRE_join_the_axis:0 "Членство в Оси"
 GRE_join_the_axis_desc:0 "Настало время официально вступить в Ось. Наши ценности совпадают с ценностями [GER.GetNameDef], и, присоединившись к союзу, мы открыто продемонстрируем миру свою поддержку."
 GRE_expansionism:0 "Экспансионизм"
 GRE_expansionism_desc:0 "Настало время вновь перекроить границы региона. Мы расширимся и вернём то, что принадлежит нам по праву, дипломатией или, если потребуется, силой."
 GRE_reclaim_dodecanese:0 "Вернуть Додеканес"
 GRE_reclaim_dodecanese_desc:0 "Настало время воссоединить греков Додеканеса с их народом. Мы сбросим сапог [ITA.GetAdjective] угнетателей. В конце концов, кто может утверждать, что Додеканесские острова не являются греческими?"
 GRE_rival_britain:0 "Враг [ENG.GetAdjective] стороны"
 GRE_rival_britain_desc:0 "Принадлежность Кипра британцам давно вызывает разногласия внутри нашего кабинета. Киприоты ждут независимости, а энозис вновь объединит греков и киприотов как братьев!"
 GRE_enosis:0 "Энозис"
 GRE_enosis_desc:0 "Подготовка и планы возможного вторжения на Кипр завершены. Мы направим [ENG.GetAdjective] стороне ультиматум, и если она не уступит остров и не освободит наших кипрских братьев от своей власти, то столкнётся со всей мощью [GRE.GetAdjective] армии."
 GRE_megali_idea:0 "Великая идея"
 GRE_megali_idea_desc:0 "В мае 1453 года Константинополь, великая столица Византийской империи, пал перед османской армией Мехмеда Завоевателя. Греческое меньшинство продолжало жить под османской властью до 1922 года, когда его окончательно изгнали из родных домов. Настало время вернуть эти земли и полностью воплотить Великую идею."
 GRE_reinforce_4th_of_august_regime:0 "Укрепить режим 4 августа"
 GRE_reinforce_4th_of_august_regime_desc:0 "Метаксас доказал [GRE.GetAdjective] народу, что является способным и расчётливым лидером. Его стремление сохранить нейтралитет, усилить вооружённые силы и оживить экономику приведёт нас к светлому будущему. Мы должны политически укрепить режим и устранить любые угрозы его стабильности."
 GRE_begin_reconstruction:0 "Корпоративизм"
 GRE_begin_reconstruction_desc:0 "Метаксас лучше многих понимает, что должен успешно вывести [GRE.GetAdjective] народ из глубокой экономической депрессии. Коммунистическое движение будет скрываться в тени и питаться недовольством населения. Чтобы искоренить коммунистическую агитацию, необходимо позаботиться о людях."
 GRE_improve_roads:0 "Проекты общественных работ"
 GRE_improve_roads_desc:0 "Армия ничего не стоит без мобильности. Необходимо улучшить дороги, железнодорожные сети и другие виды транспорта, чтобы в случае войны войска можно было быстро развёртывать и перебрасывать."
 GRE_metaxas_industry:0 "Сократить безработицу"
 GRE_metaxas_industry_desc:0 "Метаксас видит будущее, в котором бедность и безработица не свирепствуют среди [GRE.GetAdjective] народа. Он разработал план создания рабочих мест и вливания крайне необходимых средств в экономику. Осталось лишь провести реформы и утвердить контракты."
 GRE_metaxas_bullet_industry:0 "Подчинить ПИРКАЛ"
 GRE_metaxas_bullet_industry_desc:0 "Метаксас понимает, что народ и армия должны быть едины, чтобы связь между солдатами и гражданскими стала нерушимой. Для этого необходимо расширить и развить военную промышленность, способную обеспечить растущие вооружённые силы."
 GRE_embrace_metaxism:0 "Принять метаксизм"
 GRE_embrace_metaxism_desc:0 "Иоаннис Метаксас давно продвигает новую авторитарную националистическую идеологию, основанную на монархизме, антикоммунизме и антиимпериализме. Он доказал преданность [GRE.GetAdjective] народу, и мы должны выразить благодарность, приняв подаренную им идеологию."
 GRE_create_EON:0 "Создать ЭОН"
 GRE_create_EON_desc:0 "Национальная молодёжная организация, также известная как ЭОН, была создана режимом Метаксаса. Она призывала к возрождению [GRE.GetAdjective] нации и созданию современной, культурно однородной [GRE.GetName]."
 GRE_metaxa_militarism:0 "Свобода — удел храбрых"
 GRE_metaxa_militarism_desc:0 "Иоаннис Метаксас служил генералом в межвоенный период и во время Анатолийской кампании, и каждый его шаг оказался верным. Опыт на поле боя и в политике делает его более чем способным провести военные реформы, которые обеспечат нашим войскам победу."
 GRE_military_teachings:0 "Эллинские военные традиции"
 GRE_military_teachings_desc:0 "Будущее страны неизбежно ляжет на плечи молодёжи. Необходимо поощрять лекции и обучение, воспитывающие боевой дух эллинского народа и понимание силы единства. Это медленно, но верно подорвёт основы коммунистов и анархистов, стремящихся навредить стране."
 GRE_create_the_IKA:0 "Народные экономические меры"
 GRE_create_the_IKA_desc:0 ""
 GRE_political_opposition:0 "Асфалия"
 GRE_political_opposition_desc:0 "Хотя политический фундамент режима прочен и стабилен, оппозиция продолжает наблюдать из тени и замышлять наше падение. Чтобы продолжать праведный путь, необходимо заставить эти элементы замолчать, при необходимости силой."
 GRE_dominant_ideology:0 "Создать УПЕ"
 GRE_dominant_ideology_desc:0 "Иоаннис Метаксас является спасителем [GRE.GetNameDef]Его народ и греческая культура. Мы закрепим его достижения, и оппозиционным силам будет трудно сфабриковать что-либо существенное, чтобы противостоять повествованию, которое мы поддержали."
 GRE_metaxas_line:0 "Построить линию Метаксаса"
 GRE_metaxas_line_desc:0 "В нынешние неспокойные времена северная граница наиболее уязвима. Метаксас разработал и утвердил план её укрепления, хотя некоторые считают проект слишком дорогостоящим."
 GRE_world_stage:0 "Метаксистский взгляд на мир"
 GRE_world_stage_desc:0 "В прошлом раскол между прогерманскими и пробританскими настроениями угрожал разорвать страну и погрузить её в гражданскую войну. Несмотря на это, мы не можем бездействовать и должны выбрать сторону."
 GRE_national_schism:0 "Две стороны Европы"
 GRE_national_schism_desc:0 "Настало время определиться и сделать выбор. Какую бы сторону мы ни выбрали, полумеры невозможны, а последствия решения будут ощущаться годами, если не десятилетиями."
 GRE_favoring_britain:0 "Союз с [ENG.GetNameDef]"
 GRE_favoring_britain_desc:0 "Иоаннис Метаксас говорил, что в случае войны победит тот, кто контролирует моря. Несмотря на прежние разногласия с [ENG.GetAdjective] стороной, необходимо смотреть в будущее и сблизиться с ней ради господства на море."
 GRE_favoring_germany:0 "Союз с [GER.GetNameDef]"
 GRE_favoring_germany_desc:0 "The [GER.GetAdjective]s продолжает внедрять инновации, расширяться и развиваться почти незаметно в последние годы. Окружающие их народы сжимаются от страха и страха. [GER.GetAdjective] Военная машина будет решающим фактором в предстоящем конфликте. Мы должны объединиться с [GER.GetAdjective]и укреплять наши позиции рядом с ними."
 GRE_different_approach:0 "Отойти от правых"
 GRE_different_approach_desc:0 "Мы устали от автаркии и её диктаторской политики. Народу Греции угрожает надвигающаяся гражданская война. Чтобы спасти страну от самоуничтожения, необходимо сменить правительство!"
 GRE_democratic_approach:0 "Демократия побеждает"
 GRE_democratic_approach_desc:0 "Демердзис оказался великим лидером Греции. Его идеи единства, свободы слова и либеральной экономической политики позволили стране сбросить бремя экономической депрессии. Мы должны продолжить его курс на свободную страну и последовать примеру афинских предков!"
 GRE_internal_affairs:0 "Внутренние дела"
 GRE_internal_affairs_desc:0 "Страна сталкивается с множеством внутренних проблем: экономическим кризисом, беженцами и многим другим. Чтобы эффективно управлять и заслужить доверие народа, необходимо провести реформы!"
 GRE_denounce_metaxism:0 "Искоренить экстремизм"
 GRE_denounce_metaxism_desc:0 "Мы — новая современная страна, полностью поддерживающая демократию и великое будущее. Метаксизм олицетворяет старые автократические идеи, разрушающие саму основу демократии. Следует удалить последние следы Метаксаса, устаревшего режима и пятна, оставленные им в истории страны."
 GRE_ensure_stability:0 "Административные реформы"
 GRE_ensure_stability_desc:0 "Реформы доказали свою успешность, и нам удалось завоевать доверие народа. Необходимо достичь целей правительства и создать более великую Грецию."
 GRE_democratic_economic_policy:0 "Экономическая либерализация"
 GRE_democratic_economic_policy_desc:0 "Настало время заменить старую экономическую политику более современной и либеральной. [GRE.GetNameDefCap] может стать привлекательным торговым партнёром для любой европейской страны. Мы должны воспользоваться этим."
 GRE_welfare_state:0 "Социальное государство"
 GRE_welfare_state_desc:0 "Оказывая населению экономическую поддержку и развивая здравоохранение, мы сможем значительно повысить его доверие."
 GRE_diplomatic_actions:0 "Активная внешняя дипломатия"
 GRE_diplomatic_actions_desc:0 "За рубежом немало стран, готовых сотрудничать с нами. Необходимо улучшить отношения с миром и обеспечить союзы ради экономического роста и защиты от возможных угроз."
 GRE_befriend_france:0 "Подружиться с [FRA.GetNameDef]"
 GRE_befriend_france_desc:0 "[FRA.GetNameDefCap] — маяк демократии. Её демократические идеи вдохновляли нас с первых дней независимой Греческой республики. Мы сражались на одной стороне в Великой войне и должны вновь поддержать её, если начнётся новая."
 GRE_french_innovations:0 "[FRA.GetAdjective] инвестиции"
 GRE_french_innovations_desc:0 "Разрешив [FRA.GetAdjective] компаниям работать и инвестировать в нашей стране, мы значительно ускорим экономический рост и создадим больше рабочих мест."
 GRE_befriend_britain:0 "Подружиться с [ENG.GetADjective] стороной"
 GRE_befriend_britain_desc:0 "[ENG.GetAdjective] флот — крупнейший из когда-либо существовавших, и мы никогда не смогли бы выступить против него. Они помогли греческому народу в войне за независимость, а мы поддержали их во время Великой войны. [ENG.GetNameDefCap] — истинный союзник [GRE.GetNameDef]."
 GRE_british_innovetions:0 "[ENG.GetAdjective] инвестиции"
 GRE_british_innovetions_desc:0 "Разрешив [ENG.GetAdjective] компаниям работать и инвестировать в нашей стране, мы значительно ускорим экономический рост и создадим больше рабочих мест."
 GRE_rival_germany:0 "Подготовка национальной обороны"
 GRE_rival_germany_desc:0 "[GER.GetAdjective] военная машина растёт с каждым днём, угрожая миру в Европе. Все стороны должны соблюдать Версальский договор. Осуждение их действий ухудшит отношения, но покажет таким державам, как [ENG.GetNameDef] и [FRA.GetNameDef], что мы на их стороне."
 GRE_rival_italy:0 "План обороны против [ITA.GetAdjective] угрозы"
 GRE_rival_italy_desc:0 "[ITA.GetAdjective] сторона продолжает считать Додеканес своим и отрицает любое [GRE.GetADjective] присутствие в регионе. Мы ответим тем же: осудим её притязания на Балканы и заверим [ENG.GetNameDef] и [FRA.GetNameDef] в поддержке против [ITA.GetAdjective] агрессии."
 GRE_allied_membership:0 "Членство в Союзниках"
 GRE_allied_membership_desc:0 "Мы решили, что ради сохранения суверенитета и независимости необходимо вступить в Союзники и заверить [ENG.GetAdjective] сторону в поддержке в случае войны."
 GRE_military_reforms:0 "Военные реформы"
 GRE_military_reforms_desc:0 "Наша армия слаба и лишена выдающегося руководства. Необходимо расширить военное командование и представить генералам планы создания более великой Греции."
 GRE_city_defenses:0 "Оборона городов"
 GRE_city_defenses_desc:0 "Столица и сопредельная столица вместе с окружающими районами — важнейшие города страны, и мы должны защищать их до последнего человека! Привлечём население к строительству, и городские укрепления появятся в кратчайшие сроки."
 GRE_surprise_attack_italy:0 "Операция «Диагор»"
 GRE_surprise_attack_italy_desc:0 "[ITA.GetAdjective] сторона по-прежнему отказывается возвращать Додеканесские острова. Внезапное нападение повысит шансы победить и вынудить её принять наши условия. Быстрая война — лучший вариант."
 GRE_demand_the_coasts:0 "Потребовать побережье"
 GRE_demand_the_coasts_desc:0 "[TUR.GetAdjective] сторона удерживает наши исконные земли в западной Анатолии. Несмотря на обмен населением и резню, там всё ещё сохраняется эллинское присутствие. Это можно использовать как повод для конфликта и при внешней поддержке получить желанные территории."
 GRE_ask_for_cyprus:0 "Попросить Кипр"
 GRE_ask_for_cyprus_desc:0 "Теперь, когда союз с [ENG.GetAdjective] стороной заключён, пора спросить, передаст ли она нам Кипр. Вероятность согласия высока, хотя столь важная военная база едва ли предназначена для продажи."
 GRE_aftermath_of_the_victory_of_the_people:0 "Последствия народной победы"
 GRE_aftermath_of_the_victory_of_the_people_desc:0 "Фашисты не смогли уничтожить мечту о [GRE.GetAdjective] коммунистической утопии! Отныне капиталисты больше никогда не будут мучить рабочих! Вперёд, товарищи, к красному будущему!"
 GRE_restaff_the_army_command:0 "Обновить армейское командование"
 GRE_restaff_the_army_command_desc:0 "После гражданской войны все генералы перешли на другую сторону, опасаясь мощи пролетариата. В результате народной армии почти некому командовать, поэтому необходимо повысить новых офицеров."
 GRE_restaff_the_army_command_tt:0 "§YОткрывает новых военных командиров\n§!"
 GRE_deal_with_klaras:0 "Разобраться с Кларасом"
 GRE_deal_with_klaras_desc:0 "Когда во время гражданской войны мы приняли предложение Атанасиоса Клараса, он стал верховным командующим армии. Это вызвало некоторые проблемы, и теперь необходимо найти способ с ними справиться."
 GRE_international_socialist_volunteers:0 "Международные социалистические добровольцы"
 GRE_international_socialist_volunteers_desc:0 "Пролетариат угнетают по всему миру, но вскоре он восстанет против корпоративных оков. Когда это произойдёт, мы должны помочь ему в войне за свободу."
 GRE_create_the_civil_guard:0 "Создать Гражданскую гвардию"
 GRE_create_the_civil_guard_desc:0 "Чтобы фашисты и им подобные не попытались захватить руководство Грецией, необходимо подготовиться заранее. Мы создадим Гражданскую гвардию, в которой мужчины и женщины будут служить Родине."
 GRE_found_opla:0 "Основать ОПЛА"
 GRE_found_opla_desc:0 "У народной борьбы много врагов внутри и за пределами партии. Для защиты революции необходимы военизированные силы безопасности. Их методы могут быть жестокими, но кто усомнится в их необходимости?"
 GRE_befriend_sov:0 "Сблизиться с [SOV.GetAdjective] стороной"
 GRE_befriend_sov_desc:0 "[SOV.GetADjective] сторона — родина революции, и если мы будем держаться от неё подальше, то окажемся не лучше фашистов."
 GRE_buy_sov_guns:0 "Купить [SOV.GetADjective] оружие"
 GRE_buy_sov_guns_desc:0 "Мы можем приобрести [SOV.GetADjective] оружие для армии. В запасах ведь никогда не бывает достаточно винтовок, не так ли?"
 GRE_form_new_government:0 "Сформировать новое правительство"
 GRE_form_new_government_desc:0 "Советский лидер Иосиф Сталин создал политическое учение, называемое «сталинизмом», одной из главных идей которого является развитие промышленности. С тех пор как Сталин возглавил страну в 1920-х годах, советская промышленность стремительно выросла. Нам также следует принять эту систему."
 GRE_join_comintern:0 "Вступить в Коминтерн"
 GRE_join_comintern_desc:0 "Мы должны вступить в Коминтерн, чтобы укрепить своё положение в мире."
 GRE_ally_the_balkans:0 "Объединить Балканы"
 GRE_ally_the_balkans_desc:0 "Мы стали первой страной на Балканах, где пролетариат захватил власть и создал социалистическую утопию, но другие народы всё ещё ждут освобождения! Мы должны создать новый союз и распространить коммунизм по Балканам."
 GRE_join_the_balkanic_revolution:0 "Присоединиться к Балканской революции"
 GRE_join_the_balkanic_revolution_desc:0 "Социалистическая революция уже подготовлена в соседних балканских странах. Присоединимся к ним и превратим регион в оплот против реакционных буржуазно-фашистских сил."
 GRE_invite_bulgaria:0 "Поддержать Георгия Димитрова"
 GRE_invite_bulgaria_desc:0 "БКП — Болгарская коммунистическая партия во главе с Георгием Димитровым — является самой влиятельной коммунистической партией [BUL.GetNameDef], поэтому следует попытаться заключить с ней союз."
 GRE_invite_albania:0 "Свергнуть Зога"
 GRE_invite_albania_desc:0 "Тиран король Зог правит [ALB.GetNameDef]. Мы должны свергнуть его как можно скорее."
 GRE_invite_yugoslavia:0 "Поддержать Тито"
 GRE_invite_yugoslavia_desc:0 "Тито возглавляет Коммунистическую партию Югославии. Он всеми силами пытался объединить рабочих, но пока безуспешно. Мы должны оказать ему полную поддержку."
 GRE_reform_agricultural_economy:0 "Реформировать аграрную экономику"
 GRE_reform_agricultural_economy_desc:0 "Первые экономические реформы должны быть аграрными, поскольку многие греки живут в сельской местности и занимаются земледелием."
 GRE_control_the_stocks:0 "Установить контроль над промышленностью"
 GRE_control_the_stocks_desc:0 "Чтобы промышленность успешно выполняла квоты, необходимо напрямую контролировать её управление."
 GRE_enforce_nationalization:0 "Провести национализацию"
 GRE_enforce_nationalization_desc:0 "Национализация необходима, чтобы капиталисты не контролировали промышленность и ресурсы."
 GRE_begin_internal_reforms:0 "Начать политические реформы"
 GRE_begin_internal_reforms_desc:0 "Настало время начать реформы, и лучше всего начать с распространения нашей идеологии внутри страны."
 GRE_create_a_new_economic_plan:0 "Разработать новый экономический план"
 GRE_create_a_new_economic_plan_desc:0 "Нам нужна новая экономическая политика, включающая национализацию. Для этого необходимо тщательно спланировать этапы реформы и осторожно провести её."
 GRE_protect_northern_minorities:0 "Защитить северные меньшинства"
 GRE_protect_northern_minorities_desc:0 "На севере Греции угнетают множество меньшинств, включая албанцев и болгар. Как это могло продолжаться так долго? Положение необходимо немедленно изменить."
 GRE_fate_of_the_royal_family:0 "Судьба королевской семьи"
 GRE_fate_of_the_royal_family_desc:0 "Греческая монархия, созданная в начале XIX века, всегда поддерживала неравенство, высшие классы и обрекала рабочих на страдания. Мы должны решить, как наказать её за всё это."
 GRE_look_outwards:0 "Обратить взгляд наружу"
 GRE_look_outwards_desc:0 "Весь мир полон рабочих, ожидающих революции. Мы должны найти способ поддержать их."
 GRE_a_new_police_force:0 "Новая полиция"
 GRE_a_new_police_force_desc:0 "Старая полиция была коррумпированной и некомпетентной. Необходимо создать новую службу, которая будет выполнять своё предназначение."
 GRE_peasants_debt_reform:0 "Реформа крестьянских долгов"
 GRE_peasants_debt_reform_desc:0 "Крестьянские долги ещё с древних времён разоряют хозяйства и оставляют земледельцев без крова. Мы должны найти решение."
 GRE_utopian_paradise:0 "Балканский утопический рай"
 GRE_utopian_paradise_desc:0 "Греция превратилась из буржуазной страны в социалистическую утопию, основанную на равенстве."
 GRE_olive_export:0 "Экспорт оливок"
 GRE_olive_export_desc:0 "Греция славится оливками. Следует начать торговую кампанию и обратить это преимущество себе на пользу."
 GRE_greater_greece:0 "Великая Греция"
 GRE_greater_greece_desc:0 "-"
 GRE_reinforce_royal_dictatorship:0 "Расширить королевские полномочия"
 GRE_reinforce_royal_dictatorship_desc:0 "Чтобы король сохранил положение единоличного правителя страны, необходимо расширить его полномочия и предотвратить коммунистическую революцию."
 GRE_establish_the_royal_armory:0 "Создать королевский арсенал"
 GRE_establish_the_royal_armory_desc:0 "Для защиты суверенитета королевства сильная военная промышленность не просто желательна, а необходима."
 GRE_royal_roads:0 "Военные дороги"
 GRE_royal_roads_desc:0 "Война приближается, и мы должны обеспечить быструю переброску войск к линии фронта."
 GRE_prepare_expansion:0 "Подготовить расширение страны"
 GRE_prepare_expansion_desc:0 "Многочисленные греческие общины остаются за пределами наших границ, подвергаются преследованиям и всё ещё ждут освобождения и воссоединения с матерью-Грецией. Мы слишком долго бездействовали. Настало время освободить наших братьев."
 GRE_devout_to_the_monarchy:0 "Преданность монархии"
 GRE_devout_to_the_monarchy_desc:0 "Мы должны укрепить священный институт монархии и привить народу роялистские ценности и убеждения. Он должен быть готов сражаться за короля!"
 GRE_king_general:0 "Принять прямое командование"
 GRE_king_general_desc:0 "Король Георг II обладает необходимой подготовкой и властью, чтобы стать главнокомандующим вооружёнными силами. Подобно своему отцу, он расширит королевство и станет настоящим королём-солдатом."
 GRE_demand_dodecanese:0 "Потребовать Додеканес"
 GRE_demand_dodecanese_desc:0 "Додеканесские острова остаются под [ITA.GetAdjective] контролем. Эта иностранная оккупация длится слишком долго."
 GRE_demand_east_thrace:0 "Потребовать Восточную Фракию"
 GRE_demand_east_thrace_desc:0 "Константинополь когда-то был столицей нашей страны. Пока великие державы заняты, мы можем вернуть принадлежащее нам по праву и отомстить за унижение последней войны."
 GRE_purge_republicans:0 "Провести чистку республиканцев"
 GRE_purge_republicans_desc:0 "Республиканская фракция остаётся сильной и мешает нашим попыткам создать могущественную Грецию. Мы больше не можем терпеть продолжение ужасного национального раскола. Для укрепления монархии необходима чистка."
 GRE_reclaim_cyprus:0 "Потребовать Кипр"
 GRE_reclaim_cyprus_desc:0 "Остров слишком долго страдал под британским колониальным правлением. Теперь, когда [ENG.GetAdjective] сторона занята борьбой с [GER.GetAdjective] стороной, необходимо потребовать энозис — объединение с Грецией."
 GRE_purchase_cyprus:0 "Купить Кипр"
 GRE_purchase_cyprus_desc:0 "[ENG.GetNameDefCap] контролирует Средиземное море и легко может превратиться в нашего злейшего врага. Возможно, лучше не злить её, а начать переговоры о мирном приобретении острова через торговую сделку."
 GRE_share_power:0 "Разделить власть с парламентом"
 GRE_share_power_desc:0 "Наша страна создала демократию. Мы должны почтить предков, разделив власть с парламентом под руководством и надзором мудрого короля. Это обеспечит столь необходимую стабильность в неспокойные времена."
 GRE_absolute_monarchy:0 "Абсолютная монархия"
 GRE_absolute_monarchy_desc:0 "Коррумпированная парламентская система потерпела крах и привела нас к нынешнему положению. Приостановив действие конституции, мы заставим замолчать всех противников. В конце концов, король помазан Богом, и только он знает, что лучше для страны."
 GRE_a_strong_kingdom:0 "Образцовое европейское королевство"
 GRE_a_strong_kingdom_desc:0 "Под руководством короля [GRE.GetNameDef] стала образцовым европейским королевством и оплотом монархии. Его божественное руководство укрепило страну и армию. Экономика процветает, а народ вновь гордится своей родиной. Внешние и внутренние проблемы успешно решены. Да здравствует Королевство!"
 GRE_polymer_effort:0 "Исследования полимеров"
 GRE_polymer_effort_desc:0 "Исследования полимеров помогут сократить дефицит нефти и зависимость от её импорта."
 GRE_industrial_innovations:0 "Промышленные инновации"
 GRE_industrial_innovations_desc:0 "Мы стали центром промышленных инноваций! Исследовательские усилия должны соответствовать этому положению!"
 GRE_establish_a_general_staff:0 "Создать Генеральный штаб"
 GRE_establish_a_general_staff_desc:0 "Последним этапом армейской реформы станет создание современного Генерального штаба, который будет руководить вооружёнными силами."
 GRE_no_allignment:0 "Нейтралитет"
 GRE_no_allignment_desc:0 "Как и в прошлую Великую войну, Греция должна сохранять нейтралитет и проводить соответствующую внешнюю политику. Министр кабинета Метаксас является главным сторонником этой идеи, и мы не можем так просто игнорировать призывы старых генералов."
 GRE_king_george_line:0 "Линия короля Георга"
 GRE_king_george_line_desc:0 "Все наши северные соседи претендуют на часть страны. Мы не можем этого допустить и должны построить линию укреплений, способную остановить любое вторжение."
 GRE_british_allignment:0 "Сближение с [ENG.GetAdjective] стороной"
 GRE_british_allignment_desc:0 "Как морской стране, нам выгоднее всего встать на сторону Британии. При поддержке её флота мы обеспечим господство в Эгейском море и защитим линии снабжения."
 GRE_royal_guards:0 "Создать Организацию X"
 GRE_royal_guards_desc:0 "Следует воспользоваться монархическими настроениями в армии, народе и жандармерии и принять предложение генерала Гриваса создать роялистскую организацию, которая защитит режим от коммунистической угрозы. Королевским указом мы учредим Организацию X, названную в честь монограммы короля Георга."
 GRE_spartan_spirit:0 "Спартанский дух"
 GRE_spartan_spirit_2:0 "Спартанский дух"
 GRE_continue_the_fight:0 "Продолжить борьбу"
 GRE_continue_the_fight_desc:0 "Мы капитулировали, но всё ещё можем сражаться и вернуть родину!"
