 GRE_integrate_north_epirus:0 "Интегрировать Северный Эпир"
 GRE_integrate_north_epirus_desc:0 "С 1914 года Албания незаконно оккупировала наши законные земли к северу от Эпира, но теперь мы наконец вернули свой народ домой! Однако ещё предстоит разобраться с так называемыми «гирокастритами», утверждающими, что Северный Эпир является неотъемлемой частью Албании."
 GRE_enosis_of_cyprus:0 "Энозис Кипра"
 greece.5.t:0 "Демердзис скончался"
 greece.5.d:0 "Наш премьер-министр Константинос Демердзис скончался от сердечного приступа. За время пребывания на посту он способствовал экономическому росту страны и пользовался особой популярностью. Его сменит пожилой генерал Иоаннис Метаксас, которому предстоит продолжить дело Демердзиса и сохранить Грецию в эти неспокойные времена.\n\n(Чтобы перейти к §Rкоммунистической§! ветви, выберите любого премьер-министра, но не продвигайтесь по его фокусам. Вместо этого дождитесь начала забастовок.)"
 greece.5.a:0 "Метаксас назначен премьер-министром."
 greece.5.b:0 "Король захватывает власть."
 greece.5.c:0 "Нам нужно более радикальное руководство."
 greece.5.e:0 "Народная партия возглавит новое правительство."
 greece.6.t:0 "[FROM.GetNameDefCap] отказывает"
 greece.6.d:0 "[FROM.GetAdjective] сторона отвергла наши притязания на Додеканес и назвала их возмутительными. Поскольку политика не решила вопрос, у нас остаются два варианта: объявить войну [FROM.GetLeader] или отступить."
 greece.6.a:0 "Додеканесские острова — [GRE.GetAdjective] земли!"
 greece.6.b:0 "Мы не можем позволить себе войну с [FROM.GetNameDef]! Отступить."
 greece.7.t:0 "[ENG.GetNameDefCap] отказывает"
 greece.7.d:0 "[ENG.GetAdjective] представители отвергли наш ультиматум и настаивают, что Кипр должен оставаться [ENG.GetAdjective] базой огромного военного значения. Они назвали наш шаг «глупостью»."
 greece.7.a:0 "Ударить по ним изо всех сил!"
 greece.7.b:0 "Стоп! Мы не можем вступать в бой с [ENG.GetAdjective] Королевским флотом."
 greece.10.t:0 "[TUR.GetNameDefCap] отказывает"
 greece.10.d:0 "[TUR.GetAdjective] премьер-министр назвал наши требования глупыми и заявил, что они не стоят его времени. Это оскорбление для нашей страны, и война между нами опасно близка. Однажды мы уже пытались воплотить знаменитую Великую идею, следуя экспансионистским планам Венизелоса и стремясь вернуть истинно греческий Константинополь. Однако кампания обернулась катастрофой из-за некомпетентного руководства. Теперь же мы объединили греческий дух и готовы отомстить за 1453 год!"
 greece.10.a:0 "Это было лишь временное перемирие."
 greece.8.t:0 "[TUR.GetAdjective] предложения"
 greece.8.d:0 "Наши враги хотят компромисса: они предлагают Константинополь и денежную выплату, но ничего более. После этого нам придётся заключить с ними пакт о ненападении, обеспечив мир в регионе."
 greece.8.a:0 "Что ж."
 greece.8.b:0 "Мы никогда не пойдём на такую глупость!"
 greece.11.t:0 "[ENG.GetNameDefCap] отказывает"
 greece.11.d:0 "Британский премьер-министр отказался принять нас в их союз. Мы не ожидали такого исхода."
 greece.11.a:0 "Что?!"
 greece.12.t:0 "[ENG.GetNameDefCap] отказывает"
 greece.12.d:0 "Похоже, наши союзники не собираются возвращать нам Кипр. Мы не ожидали этого после заключения союза."
 greece.12.a:0 "И что теперь?"
 greece.13.t:0 "[SOV.GetAdjective] сторона отказывает"
 greece.13.d:0 "Несмотря на щедрое предложение, [SOV.GetAdjective] сторона отказалась, заявив, что не желает провоцировать «разногласия с [ITA.GetNameDef]»."
 greece.13.a:0 "Серьёзно?!"
 greece.14.t:0 "Военный переворот!"
 greece.14.d:0 "Сегодня рано утром многочисленные солдаты и 50 танков штурмовали дом Метаксаса и старое здание эллинского парламента, потребовав капитуляции [GRE.GetAdjective] правительства и объявив себя новой властью! По всей стране люди были потрясены тем, что некогда надёжное военное командование захватило власть и свергло Метаксаса. Теперь главный вопрос — куда движется [GRE.GetNameDef]? Многие опасаются худшего."
 greece.14.a:0 "Чем всё это закончится?"
 greece.9.t:0 "Афинский договор"
 greece.9.d:0 "Афинский договор должен урегулировать спор между [TUR.GetNameDef] и нами по поводу законных притязаний в Анатолии. Его условия таковы: [TUR.GetNameDef] уступит [GRE.GetNameDef] регион Смирны; [GRE.GetAdjective] администрация будет одинаково относиться ко всему населению; [TUR.GetNameDefCap] признает эллинское господство над Смирной; Константинополь и Восточная Фракия станут демилитаризованными зонами."
 greece.9.a:0 "Прекрасно!"
 greece.15.t:0 "Скандал из-за женщины на Афоне"
 greece.15.d:0 "Сегодня молодая женщина по имени Зои Сарадопулу попыталась войти в автономную область Афона. Там расположены 20 монастырей под прямой юрисдикцией Вселенского патриарха Константинопольского. Одно из строжайших правил запрещает женщинам входить на эту территорию, поскольку последней женщиной, ступавшей на эту землю, считается сама Богородица. Зои заявила, что мы живём в современном и равноправном обществе и женщины должны иметь право войти туда несмотря ни на что."
 greece.15.a:0 "Это вызвало проблемы."
 greece.16.t:0 "Операция «Восстановление»"
 greece.16.d:0 "При поддержке высшего военного командования правительство решило продвинуться глубже в Анатолию и вернуть утраченные земли, включая Никомедию и дорогой нашим сердцам Константинополь. Хотя это наверняка значительно повысит мировую напряжённость, другого шанса осуществить мечту у нас не будет. Можно попросить помощи у [ENG.GetNameDef] и [FRA.GetNameDef], но многого ожидать не стоит — это даже может обернуться против нас."
 greece.16.a:0 "Сначала лучше попросить помощи."
 greece.16.b:0 "Не будем их втягивать."
 greece.17.t:0 "[GRE.GetNameDefcap] просит вмешательства"
 greece.17.d:0 "Сегодня, когда эллинские войска готовились атаковать [TUR.GetAdjective] границу, [GRE.GetAdjective] посол в нашей столице предложил вмешаться в грядущую войну между ними и [TUR.GetNameDef]. Это сильно разозлит соседей и навредит нашей репутации."
 greece.17.a:0 "Да, мы будем уважать наш союз с [GRE.GetADjective]s."
 greece.17.b:0 "Афинский договор предусматривал совсем не это!"
 greece.18.t:0 "Во вмешательстве отказано!"
 greece.18.d:0 "Несмотря на усилия нашего посла, договориться не удалось. Они точно не помогут нам и даже отказались защищать страну от возможных будущих врагов, поскольку мы не соблюдали Афинский договор."
 greece.18.a:0 "Вот дерьмо!"
 greece.19.t:0 "Римский договор"
 greece.19.d:0 "The [ITA.GetAdjective]Они согласились поддержать нас по новому вопросу, который вспыхнул между нами и Турцией в обмен на некоторые земли для урегулирования конфликта. [ITA.GetAdjective]s. Это единственный способ заставить их поддержать нас, и даже это беспокоило их."
 greece.19.a:0 "Браво, дуче!"
 greece.20.t:0 "[GRE.GetNameDefCap] просит [ITA.GetAdjective] вмешательства"
 greece.20.d:0 "[GRE.GetAdjective] посол в Риме потребовал полной поддержки [GRE.GetAdjective] кампании в Анатолии. Предложение тревожное, но это может быть нашим единственным шансом вновь заняться Анатолийской кампанией!"
 greece.20.a:0 "Да, это наш шанс!"
 greece.20.b:0 "Что?! Нет."
 greece.21.t:0 "Константинополь был отвоеван!"
 greece.21.d:0 "Наконец-то! Константинополь снова наш! Наконец-то регион освободился от [TUR.GetAdjective] Угнетение, и мы имеем право переименовать его."
 greece.21.a:0 "Наконец-то!"
 greece.22.t:0 "Смирна вернулась!"
 greece.22.d:0 "После нашей последней кампании в Анатолии возвращение Смирны греческими войсками было очень маловероятным. Тем не менее, теперь нам удалось осуществить нашу мечту о переименовании «Измира» обратно в Смирну, как это и должно быть, и создать сильную эллинскую администрацию."
 greece.22.a:0 "Великолепно!"
 greece.23.t:0 "Пруса вернулась!"
 greece.23.d:0 "После всех этих лет мы, наконец, вернули себе Проусу и создали новую администрацию греков. Наконец, наша мечта о восстановлении империи близка!"
 greece.23.a:0 "Прекрасно."
 greece.24.t:0 "Никомедия вернулась!"
 greece.24.d:0 "[GRE.GetADjective] войска захватили Дюздже, и теперь регион почти полностью находится под нашим контролем. Мы можем вернуть населённым пунктам их прежние названия."
 greece.24.a:0 "Однажды я мог бы снять там дом."
 greece.28.t:0 "[GRE.GetAdjective] сторона хочет вступить в Ось"
 greece.28.d:0 "Сегодня [GRE.GetADjective] министр иностранных дел встретился с нашими представителями и предложил вступить в Ось. Их принятие может ухудшить отношения с [ITA.GetNameDef], однако их авиабазы пригодятся для возможных кампаний в Северной Африке и создадут угрозу [ENG.GetAdjective] Королевскому флоту."
 greece.28.a:0 "Да, принять их."
 greece.28.b:0 "Нет, мы не хотим портить отношения с [ITA.GetLeader]."
 greece.31.t:0 "[GRE.GetNameDefCap] требует Додеканес"
 greece.31.d:0 "Сегодня [GRE.GetADjective] министр иностранных дел потребовал от наших представителей немедленно вернуть Родос и другие Додеканесские острова, которые, по его словам, «по праву являются [GRE.GetADjective]». Разумеется, отдавать им столь важную базу было бы глупостью."
 greece.31.a:0 "Да, отдать им острова."
 greece.31.b:0 "Нет, Додеканес останется нашим!"
 greece.25.t:0 "[GRE.GetNameDefCap] требует Кипр"
 greece.25.d:0 "Сегодня [GRE.GetAdjective] министр иностранных дел обсудил с нашими представителями серьёзный вопрос, резко влияющий на отношения с [GRE.GetNameDef]. [GRE.GetADjective] министр потребовал немедленно вернуть остров Кипр [GRE.GetNameDef]. Потеря столь важной стратегической базы кажется безумием, но их может поддерживать [GER.GetAdjective] сторона."
 greece.25.a:0 "Да, мы не хотим военного конфликта с [GRE.GetNameDef]."
 greece.25.b:0 "Что? Нет, Кипр необходимо защищать!"
 greece.26.t:0 "[GRE.GetNameDefCap] стремится вступить в Союзники"
 greece.26.d:0 "Сегодня [GRE.GetAdjective] посол в Лондоне встретился с нашим премьер-министром, рассказал, насколько [GRE.GetAdjective] народ восхищается [ENG.GetNameDef], и предложил союз между странами. Это может быть полезно: Крит станет крупной базой нашего Средиземноморского флота и поможет сократить [ITA.GetAdjective] влияние на Балканах."
 greece.26.a:0 "Да, принять их."
 greece.26.b:0 "Пожалуй, не стоит."
 greece.27.t:0 "[GRE.GetNameDefCap] просит Кипр"
 greece.27.d:0 "[GRE.GetAdjective] сторона не забыла обещание передать ей Кипр за участие в Великой войне и настаивает на его выполнении. Остров имеет огромное военное значение, но, поскольку они состоят в нашем альянсе, мы всё равно сможем пользоваться базами. Стоит ли его отдавать?"
 greece.27.a:0 "Мы держим обещания."
 greece.27.b:0 "Не помню никакого обещания."
 greece.29.t:0 "[GRE.GetAdjective] ультиматум"
 greece.29.d:0 "[GRE.GetADjective] министр иностранных дел встретился с нашим президентом и потребовал подписать договор о передаче нескольких регионов, включая Измир, Измит и Стамбул, их «законному владельцу». Эти нелепые требования не заслуживают серьёзного отношения, но их может поддерживать Ось. Возможно, стоит пойти на компромисс и получить средства."
 greece.29.a:0 "Никогда!"
 greece.29.b:0 "Предложить им «Константинополь», но ничего более!"
 greece.30.t:0 "[GRE.GetAdjective] сторона предлагает вступить в наш альянс"
 greece.30.d:0 "Сегодня [GRE.GetAdjective] представитель в Москве встретился с министром иностранных дел и предложил вступить в наш альянс, чтобы помогать нам. Однако это может вызвать конфликт с [ITA.GetLeader] или [GER.GetLeader], стремящимися расширить влияние на Балканах. Либо мы обеспечим контроль над южными Балканами, либо откажемся от него."
 greece.30.a:0 "Да, принять их."
 greece.30.b:0 "Нет, не стоит рисковать."
 greece.32.t:0 "Третья эллинская цивилизация"
 greece.32.d:0 "Сегодня Метаксас и его политики собрались в центре Афин у парламента, чтобы провозгласить Третью эллинскую цивилизацию. С самого начала правления его главной целью были модернизация и укрепление греческой нации. Толпа встретила объявление ликованием и скандированием «Докса стон Метакса!» — «Слава Метаксасу!»."
 greece.32.a:0 "Докса стон Метакса!"
 greece.33.t:0 "Кто возглавит фашистов?"
 greece.33.d:0 "Сейчас Фашистскую партию возглавляет Георгиос Меркурис. Однако его можно заменить другим кандидатом. Константинос Логофетопулос доказал свою ценность и хитрость, хотя и сам Меркурис остаётся столь же расчётливым. Есть и другие претенденты."
 greece.33.a:0 "Меркурис возглавит Фашистскую партию!"
 greece.33.b:0 "Раллис возглавит Фашистскую партию."
 greece.33.c:0 "Логофетопулос поведёт фашистов!"
 greece.34.t:0 "Великая Греция"
 greece.34.d:0 "Вместе мы восстали и завоевали законные [GRE.GetADjective] земли. В честь этого невероятного достижения будет учреждён новый национальный праздник. Оно окажет влияние на весь мир. Возможно, нас признают великой державой, но что бы ни случилось, [GRE.GetADjective] народ всегда останется единым и готовым ко всему."
 greece.34.a:0 "Во славу Эллады!"
 greece.35.t:0 "[GRE.GetNameDefCap] требует Стамбул"
 greece.35.d:0 "Король Греции Георг II недавно потребовал вернуть «законные» [GRE.GetAdjective] земли Восточной Фракии, включая Эдирне и древнюю столицу Стамбул. Как ответить на ультиматум?"
 greece.35.a:0 "Уступить [GRE.GetAdjective] требованиям."
 greece.35.b:0 "Они думают, что мы так легко подчинимся?"
 greece.37.t:0 "Ответ [TUR.GetADjective] стороны"
 greece.37.d:0 "[TUR.GetADjective] сторона согласилась выполнить наши требования о возвращении Восточной Фракии. Значительная экономическая ценность региона укрепит национализм и повысит промышленную эффективность."
 greece.37.a:0 "Константинополь снова наш!"
 greece.36.t:0 "Ответ [TUR.GetADjective] стороны"
 greece.36.d:0 "[TUR.GetADjective] сторона отказалась вернуть нам Восточную Фракию. [TUR.GetADjective] министр иностранных дел заявил, что подобные требования неприемлемы и Восточная Фракия останется [TUR.GetADjective]."
 greece.36.a:0 "Они нас недооценивают."
 greece.38.t:0 "[GRE.GetAdjective] сторона хочет купить Кипр"
 greece.38.d:0 "[GRE.GetNameDefCap] предложила значительную финансовую помощь и средства в обмен на Кипр. На этот раз [GRE.GetNameDef] ясно дала понять, что не нападёт в случае отказа. Как ответить?"
 greece.38.a:0 "Принять!"
 greece.38.b:0 "О чём они думают? Разумеется, отказать!"
 greece.39.t:0 "Успешная сделка!"
 greece.39.d:0 "[ENG.GetADjective] сторона приняла предложение. Наконец-то энозис!"
 greece.39.a:0 "Наконец-то мы едины!"
 greece.40.t:0 "[ENG.GetAdjective] сторона отказывает"
 greece.40.d:0 "[ENG.GetAdjective] сторона отвергла наше исключительно щедрое предложение. Этот возмутительный ответ будет иметь последствия, пусть даже и не с нашей стороны."
 greece.40.a:0 "Проклятье!"
 greece.41.t:0 "Панагис Цалдарис скончался"
 greece.41.d:0 "Сегодня нас покинул Панагис Цалдарис. Нам будет не хватать его популярного руководства во времена Второй эллинской республики. Однако его смерть оставила политический вакуум, и руководство консервативной Народной партией перейдёт к его племяннику Константиносу Цалдарису."
 greece.41.a:0 "Возможно, консерваторам как раз нужна свежая кровь?"
 greece.42.t:0 "Иоаннис Метаксас скончался"
 greece.42.d:0 "Смерть вновь поразила нашего лидера — на этот раз Иоанниса Метаксаса. Страна замерла: никто не ожидал этого дня. Однако вопрос преемственности оказался проще, чем предполагалось, поскольку Метаксас заранее выбрал преемника. Александрос Коризис одним из первых узнал о его смерти. Теперь он сформировал правительство и намерен вести [GRE.GetNameDef] тем же путём, что и предшественник."
 greece.42.a:0 "[GRE.GetNameDefCap] скорбит."
 greece.43.t:0 "Парламентские выборы 1936 года"
 greece.43.d:0 "На назначенных на сегодня выборах Демердзис и его кабинет столкнулись с Народной и Либеральной партиями, каждая из которых получила значительную долю голосов. Однако ожидается, что Демердзис сохранит мандат благодаря поддержке короля Георга."
 greece.43.a:0 "Демердзис и его кабинет остаются."
 greece.43.b:0 "Народная партия побеждает."
 greece.46.t:0 "Гражданская война!"
 greece.46.d:0 "После смерти Панагиса Цалдариса, влиятельного политика Второй эллинской республики и руководителя короткого переходного правительства после покойного премьер-министра Константиноса Демердзиса, фашистские и коммунистические группы поднялись по всей Греции, стремясь захватить власть. Георгиос Меркурис сумел объединить большинство крайне правых против коммунистов. Победа может быть близка, но без кровопролития её не добиться."
 greece.46.a:0 "Вперёд, патриоты!"
 greece.47.t:0 "Гражданская война окончена"
 greece.47.d:0 "Гражданская война, разорявшая страну, наконец завершилась. Будем надеяться на лучшее будущее при новом правительстве."
 greece.47.a:0 "Слава Богу."
 greece.48.t:0 "Предложение Клараса"
 greece.48.d:0 "Атанасиос Кларас, также известный как Арис Велухиотис, связался с нами и предложил назначить его командующим армией. Учитывая нехватку штабных офицеров, предложение выглядит заманчиво."
 greece.48.a:0 "Сейчас не время привередничать!"
 greece.48.b:0 "Он лишь создаст проблемы."
 greece.49.t:0 "Гражданская война окончена"
 greece.49.d:0 "Гражданская война, разорявшая страну, наконец завершилась. Будем надеяться на лучшее будущее при новом правительстве."
 greece.49.a:0 "Слава Богу."
 greece.50.t:0 "Король умер"
 greece.50.d:0 "Сегодня король Георг II умер от атеросклероза. Сначала многие приняли это за первоапрельскую шутку, но, узнав правду, народ оплакал старого короля. Он провёл страну через тяжёлые времена и ни разу не задумался об отречении."
 greece.50.a:0 "У трона новый хозяин!"
 greece.51.t:0 "Славная социалистическая победа"
 greece.51.d:0 "Фашисты не смогли уничтожить мечту о [GRE.GetAdjective] коммунистической утопии! Рабочие больше никогда не будут страдать от капиталистов. Вперёд, товарищи, к красному будущему!"
 greece.51.a:0 "Это только начало!"
 greece.52.t:0 "Разобраться с Кларасом"
 greece.52.d:0 "Когда во время гражданской войны мы приняли предложение Атанасиоса Клараса, он стал верховным командующим армии. Это вызвало некоторые проблемы, и теперь необходимо найти способ их решить."
 greece.52.a:0 "Узаконить его власть."
 greece.52.b:0 "Подавить его."
 greece.53.t:0 "[GRE.GetNameDefCap] стремится к более дружественным отношениям"
 greece.53.d:0 "Недавно созданная Социалистическая Республика Греция предложила нам сблизиться. Согласимся ли мы?"
 greece.53.a:0 "К коммунистическому миру!"
 greece.53.b:0 "Нет, они ничем не лучше фашистов."
 greece.54.t:0 "Новый друг"
 greece.54.d:0 "[SOV.GetADjective] сторона приняла наше предложение. Это может привести лишь к хорошему."
 greece.54.a:0 "Отлично."
 greece.55.t:0 "Они отказали"
 greece.55.d:0 "[SOV.GetADjective] сторона отказалась от сближения."
 greece.55.a:0 "У них вообще была причина?"
 greece.56.t:0 "Создание сталинистского правительства"
 greece.56.d:0 "Советский лидер Иосиф Сталин создал политическое учение «сталинизм», одной из главных идей которого является развитие промышленности. С тех пор как Сталин пришёл к власти в 1920-х годах, советская промышленность стремительно выросла. Нам также следует принять эту систему."
 greece.56.a:0 "[GRE.GetNameDefCap] больше никогда не столкнётся с экономическими проблемами!"
 greece.57.t:0 "[GRE.GetNameDefCap] хочет вступить в Коминтерн"
 greece.57.d:0 "[GRE.GetNameDefCap] попросила принять её в Коминтерн. Согласимся ли мы?"
 greece.57.a:0 "Добро пожаловать в Коминтерн."
 greece.57.b:0 "Это лишь ослабит нас."
 greece.58.t:0 "[SOV.GetAdjective] сторона соглашается"
 greece.58.d:0 "[SOV.GetADjective] сторона согласилась. Мы официально вступили в Коминтерн."
 greece.58.a:0 "Отлично!"
 greece.59.t:0 "[SOV.GetADjective] сторона отказывает"
 greece.59.d:0 "[SOV.GetADjective] сторона отказала, и мы не вступили в Коминтерн."
 greece.59.a:0 "Неважно."
 greece.60.t:0 "[GRE.GetNameDefCap] приглашает нас в свой альянс"
 greece.60.d:0 "[GRE.GetNameDefCap] пригласила нас в новый альянс, стремящийся объединить Балканы под социализмом. Согласимся ли мы?"
 greece.60.a:0 "Разумеется!"
 greece.60.b:0 "Это всего лишь очередная фашистская уловка."
 greece.61.t:0 "Они согласились"
 greece.61.d:0 "Один из новых коммунистических режимов принял приглашение в наш альянс."
 greece.61.a:0 "Фашисты будут дрожать."
 greece.62.t:0 "Они отказались"
 greece.62.d:0 "Новая балканская коммунистическая страна отвергла приглашение в наш альянс."
 greece.62.a:0 "Мы справимся и без них."
 greece.63.t:0 "[GRE.GetNameDefCap] приглашает нас в свой альянс"
 greece.63.d:0 "[GRE.GetNameDefCap] пригласила нас в новый альянс, стремящийся объединить Балканы под социализмом. Согласимся ли мы?"
 greece.63.a:0 "Разумеется!"
 greece.63.b:0 "Это всего лишь очередная фашистская уловка."
 greece.64.t:0 "Назначение нового начальника армии"
 greece.64.d:0 "С рассвета нового дня мы занимались набором и повышением офицеров для руководства армией и почти завершили эту работу. Однако нового начальника армии мы ещё не назначили. К настоящему моменту собралось немало кандидатов."
 greece.64.a:0 "Эксперт по наступлению Атанасиос Кларас"
 greece.64.b:0 "Эксперт по обороне Стефанос Сарафис"
 greece.65.t:0 "Судьба королевской семьи"
 greece.65.d:0 "Греческая монархия, созданная в начале XIX века, всегда поддерживала неравенство и высшие классы, обрекая рабочих на страдания. Мы должны решить, как наказать её за всё это."
 greece.65.a:0 "Казнить их!"
 greece.65.b:0 "Изгнать их!"
 greece.66.t:0 "Мы капитулировали"
 greece.66.d:0 "Нас вытеснили с родины, но борьба продолжается на оставшихся островных территориях!"
 greece.66.a:0 "Мы никогда не сдадимся!"
 greece.69.t:0 "Критское восстание!"
 greece.69.d:0 "Венизелистские настроения зародились на Крите в конце XIX века, когда его сторонники пытались освободить остров и объединить его с Первым Королевством Греция под властью Георга I. Теперь некоторые офицеры-венизелисты и региональные политики решили свергнуть правительство и восстановить венизелистский режим. Мы не можем этого допустить."
 greece.69.a:0 "Отправить армию и подавить их."
 greece.70.t:0 "Мятежники разгромлены"
 greece.70.d:0 "Несколько недель назад критские венизелисты попытались совершить переворот, и мы направили против них армию. Теперь они подавлены."
 greece.71.t:0 "Совершить налёт на вражеские арсеналы"
 greece.71.d:0 "Нашим армиям не хватает снаряжения, а промышленность не способна быстро исправить положение. Зато враг контролирует промышленные районы. Мы отправим партизанские отряды разграбить склады и снабдить войска."
 greece.71.a:0 "Приступайте."
 greece.72.t:0 "Налёт на арсеналы удался"
 greece.72.d:0 "Наши партизаны успешно разграбили вражеские склады и захватили множество винтовок. Это серьёзно нам поможет."
 greece.72.a:0 "Одной проблемой меньше."
 greece.73.t:0 "Налёт на арсеналы провалился"
 greece.73.d:0 "Партизаны не смогли разграбить вражеские запасы."
 greece.73.a:0 "Проклятье."
 greece.74.t:0 "Назначение нового начальника армии"
 greece.74.d:0 "С рассвета нового дня мы занимались набором и повышением офицеров для руководства армией и почти завершили эту работу. Однако нового начальника армии мы ещё не назначили. К настоящему моменту собралось немало кандидатов."
 greece.74.a:0 "Специалист по наступлению Манолис Мандакас."
 greece.74.b:0 "Эксперт по обороне Стефанос Сарафис."
 gre_news.1.t:0 "Гражданская война в Греции!"
 gre_news.1.d:0 "Хотя конфликт назревал уже несколько месяцев, смерть временного премьер-министра стала последней каплей и положила начало войне, продолжительность которой пока никому не известна. Все надеются, что она скоро закончится."
 gre_news.1.a:0 "А что насчёт долга?"
 gre_news.1.b:0 "Пусть это скорее закончится."
 gre_news.2.t:0 "Гражданская война в Греции окончена!"
 gre_news.2.d:0 "Недавно Грецию опустошила жестокая гражданская война, разорвавшая страну на части. Теперь боевые действия прекратились, новое правительство сформировано, а последние отряды оппозиции разоружены. Хотя спокойствие, кажется, восстановлено, напряжение остаётся высоким, и греческий народ надеется, что война не возобновится."
 gre_news.2.a:0 "И всё же, что насчёт долга?"
 gre_news.2.b:0 "Наконец-то!"
 gre_news.3.t:0 "Греция вступает в [ITA.GetFactionName]"
 gre_news.3.desc:0 "В совместном коммюнике [ITA.getleader] и [GRE.getleader] объявили, что их правительства достигли соглашения по пограничному спору и заключили вечный союз. [GRE.getnamedef] вступит в [ITA.GetFactionName], а [ITA.getadjective] правительство уступит Додеканесские острова [GRE.GetNameDef]."
 gre_news.3.a:0 "Интересно."
 gre_news.3.b:0 "Вместе мы сильнее."
 greece.75.t:0 "Кипр в обмен на войну!"
 greece.75.d:0 "Теперь, когда [ENG.GetAdjective] сторона воюет с [GER.GetAdjective] стороной, у нас появился шанс. Наши войска доказали мастерство и хорошо показали себя в боях. [ENG.GetAdjective] сторона много лет контролирует Кипр, но наши кипрские братья стремятся воссоединиться с нами. Мы можем попросить [ENG.GetNameDef] вернуть остров в обмен на гарантированную верность Союзникам."
 greece.75.a:0 "Отправить предложение."
 greece.75.b:0 "Лучше не вмешиваться."
 greece.76.t:0 "Предложение от [GRE.GetAdjective] правительства"
 greece.76.d:0 "Кипр всегда было трудно удерживать. Из-за близости к странам Оси снабжение острова страдает. Однако решение найдено: [GRE.GetAdjective] правительство предлагает принять Кипр в обмен на верность нашему альянсу и вступление в войну против [GER.GetNameDef]. Это избавит высшее командование от одной проблемы, но лишит вооружённые силы стратегического форпоста. Решение следует принять осторожно."
 greece.76.a:0 "Вполне приемлемая сделка."
 greece.76.b:0 "Такая помощь нам не нужна."
 greece.77.t:0 "[ENG.GetAdjective] сторона соглашается"
 greece.77.d:0 "Наконец-то мы воссоединились! Наши щедрые [ENG.GetADjective] союзники вернули нам Кипр. Однако теперь мы воюем с Осью и должны подготовить войска. За Грецию!"
 greece.77.a:0 "Прекрасно."
 greece.78.t:0 "[ENG.GetADjective] сторона отказывает"
 greece.78.d:0 "[ENG.GetAdjective] сторона отвергла наше предложение! Несмотря на щедрые условия, они отказались передать Кипр. Это серьёзный кризис в отношениях между [GRE.GetAdjective] и [ENG.GetAdjective] сторонами."
 greece.78.a:0 "Жаль."
 greece.79.t:0 "Наш курс на Балканах"
 greece.79.d:0 "Настало время выбрать способ распространения коммунизма среди соседей: действовать медленнее и дешевле либо вторгнуться и освободить балканских братьев и сестёр."
 greece.79.a:0 "Свяжемся с коммунистическими группами соседних стран."
 greece.79.b:0 "Подготовить планы вторжения. Мы идём на войну."
 greece.80.t:0 "Провозглашена диктатура!"
 greece.80.d:0 "После недавних аграрных и промышленных забастовок на севере премьер-министр Иоаннис Метаксас решил приостановить работу парламента и действие части конституции. После речи по национальному радио он провозгласил антидемократическую диктатуру. Теперь вся власть сосредоточена в его руках."
 greece.80.a:0 "Пути назад нет."
 greece.81.t:0 "Кровавый май"
 greece.81.d:0 "КПГ собрала рабочих в северных городах страны на протест против последних политических событий."
 greece.81.a:0 "Подавить бастующих. Мы должны сохранить единство и не можем разорвать страну на части!"
 greece.81.b:0 "Поддержать бастующих. Пролетариату пора объединиться!"
 greece.82.t:0 "[GRE.GetNameDefCap] предлагает защиту"
 greece.82.d:0 "[ITA.GetAdjective] сторона сейчас является главной угрозой нашей независимости, и [GRE.GetAdjective] сторона, похоже, разделяет наши опасения. Её премьер-министр предлагает защиту от [ITA.GetNameDef] в обмен на усиление влияния в нашей стране. Как ответить?"
 greece.82.a:0 "Это наш последний шанс."
 greece.82.b:0 "Ни за что."
 greece.83.t:0 "[ALB.GetNameDefCap] подчиняется"
 greece.83.d:0 "[ALB.GetNameDefCap] приняла наше предложение о защите."
 greece.83.a:0 "Прекрасно!"
 greece.84.t:0 "[ALB.GetNameDefCap] сохраняет независимость"
 greece.84.d:0 "Несмотря на щедрое предложение о защите, упрямая [ALB.GetAdjective] сторона отказалась.\nНавяжем ли мы ей вопрос Северного Эпира силой?"
 greece.84.a:0 "Мир для нашего времени!"
 greece.84.b:0 "У них был шанс. Теперь наш ход."
 greece.85.t:0 "[GRE.GetnameDefCap] предлагает пакт о ненападении"
 greece.85.d:0 "[GRE.GetAdjective] правительство предложило заключить пакт о ненападении. Хотя договор не выглядит особенно выгодным для [ITA.GetNamedef], он может открыть возможность усилить влияние в стране мирным путём."
 greece.85.a:0 "Принять их посла."
 greece.85.b:0 "Проигнорировать просьбу."
 greece.86.t:0 "[ITA.GetNameDefCap] соглашается"
 greece.86.d:0 "[ITA.GetAdjective] правительство согласилось на нашу просьбу, а [ITA.GetLeader] принял посла и подтвердил необходимость договора о вечной дружбе ради мира в Средиземноморье и на Балканском полуострове."
 greece.86.a:0 "Превосходно!"
 greece.87.t:0 "[ITA.getleader] отклоняет предложение"
 greece.87.d:0 "[ITA.getadjective] правительство отказалось даже рассматривать наш пакт, чем разгневало посла."
 greece.87.a:0 "Какая жалость."
 greece.88.t:0 "[GRE.GetNameDefCap] предлагает союз"
 greece.88.d:0 "В пространном письме [GRE.getadjective] посол сообщил, что [GRE.getleader] предлагает вступление [GRE.getnamedef] в [ITA.GetFactionName] в обмен на отказ от Додеканеса. Нам также гарантируют сохранение прав на использование портов островов и защиту прав местных колонистов в переходный период.\n\nКроме того, в письме отмечается, что [ITA.GetAdjective] инвестиции могли бы дополнительно укрепить договор."
 greece.88.a:0 "Союзникам всегда рады."
 greece.88.b:0 "Они глупцы."
 greece.89.t:0 "[ITA.getleader] принимает нас в [ITA.GetFactionName]"
 greece.89.d:0 "[ITA.getadjective] правительство согласилось на обмен и приняло нас в [ITA.GetFactionName]. Одновременно на Родосе под ликование населения был поднят [GRE.GetAdjective] флаг."
 greece.89.a:0 "Ещё одна возвращённая территория!"
 greece.90.t:0 "[ITA.getleader] отклоняет предложение"
 greece.90.d:0 "[ITA.getadjective] правительство отказалось даже рассматривать наш пакт, чем разгневало посла."
 greece.90.a:0 "Нелепость."
 GRE_engineering_push:0 "Промышленный рывок"
 GRE_depression_1:0 "«Мегали Ифеси»"
 GRE_depression_1_desc:0 "«Мегали Ифеси» означает «Великая депрессия» по-гречески. После провальной военной кампании в Анатолии Эллинская республика столкнулась с тяжёлой экономической катастрофой и огромным миграционным кризисом. Правительству придётся приложить немало усилий, чтобы вернуть экономику на правильный путь."
 GRE_depression:0 "«Мегали Ифеси»"
 GRE_depression_desc:0 "«Мегали Ифеси» означает «Великая депрессия» по-гречески. После провальной военной кампании в Анатолии Эллинская республика столкнулась с тяжёлой экономической катастрофой и огромным миграционным кризисом. Правительству придётся приложить немало усилий, чтобы вернуть экономику на правильный путь."
 GRE_depression_recovery:0 "Восстановление после депрессии"
 RE_depression_recovery_desc:0 "Правительство добивается успехов в преодолении экономического спада."
 GRE_naval_arsenal:0 "Улучшенный военно-морской арсенал"
 GRE_naval_arsenal_desc:0 "Чтобы удвоить размер флота, мы решили улучшить военно-морской арсенал вместо поддержки гражданских судостроителей. Это поможет подготовиться к возможному морскому вторжению."
 GRE_civilian_shipbuilders:0 "Довольные гражданские судостроители"
 GRE_civilian_shipbuilders_desc:0 "Ставка на гражданское судостроение стала одним из лучших решений. Мы получим значительные экономические и дипломатические выгоды."
 GRE_collecting_from_trade:0 "Доходы от торговли"
 GRE_collecting_from_trade_desc:0 "Теперь мы можем воспользоваться инвестициями и получить то, что принадлежит нам по праву."
 GRE_motorized_effort:0 "Моторизованная армия"
 GRE_motorized_effort_desc:0 "Армия получила новые грузовики и моторизованное снаряжение, что упростило переброску подкреплений на фронт и удержание позиций."
 GRE_infantry_weapons:0 "Производство винтовок"
 GRE_infantry_weapons_desc:0 "Иностранные компании передали нам более эффективные методы изготовления пехотных винтовок, благодаря чему мы сможем производить больше оружия за меньшее время."
 GRE_autarky_focus:0 "Отказаться от демократии"
 GRE_autarky_focus_desc:0 "Страна почти развалилась. Мы должны немедленно восстановить порядок!"
 GRE_recruitment_effort:0 "Вербовочные агентства"
 GRE_recruitment_effort_desc:0 "Каждый мужчина обязан сражаться во славу страны. Вернуть былое величие можно лишь посредством завоеваний и военных действий."
 GRE_national_youth_organisation:0 "Национальная молодёжная организация"
 GRE_IKA:0 "Экономические меры"
 GRE_national_split:0 "Национальный раскол"
 GRE_democratic_support:0 "Поддержка демократии"
 GRE_foreign_investments:0 "Иностранные инвестиции"
 GRE_foreign_investments_desc:0 "Правительство решило разрешить большему числу иностранных компаний инвестировать в страну ради экономического роста."
 GRE_low_stability:0 "Нестабильность внутри страны"
 GRE_low_stability_desc:0 "Народ утратил доверие к правительству. Мы должны что-то предпринять!"
 GRE_economic_downfall:0 "Экономический крах"
 GRE_economic_downfall_desc:0 "Огромные процентные ставки и низкий экспорт поставили Министерство финансов на грань краха. Нам нужны новые экономические соглашения, прежде чем страна окончательно обанкротится!"
 GRE_government_crisis:0 "Слабое правительство"
 GRE_government_crisis_desc:0 "Новое руководство сталкивается с высокими процентами по займам, а страна переживает рецессию. Великая депрессия 1929 года также серьёзно влияет на экономическое положение. Население обвиняет руководство в неспособности справиться с кризисом, в который мы оказались втянуты."
 GRE_patriarch_support:0 "Поддержка патриарха"
 GRE_metaxas_plan:0 "Корпоративизм"
 GRE_third_hellenic_civ:0 "Третья эллинская цивилизация"
 GRE_third_hellenic_civ_desc:0 "Народ восстал и превратил Грецию в новую силу. Третья эллинская цивилизация просуществует ещё долгие годы!"
 GRE_greater_greece_idea:0 "Провозглашена Великая Греция"
 GRE_greek_payments:0 "[GRE.GetADjective] выплаты"
 GRE_british_exchange:0 "[ENG.GetAdjective] обмен"
 GRE_semi_constitutional_monarchy:0 "Полуконституционная монархия"
 GRE_strong_kingdom:0 "Сильная монархия"
 GRE_naval_industry_rivalary:0 "Разделённая судостроительная промышленность"
 GRE_naval_industry_rivalary_desc:0 "Наша судостроительная промышленность разделена между двумя главными фракциями: военно-морским арсеналом и гражданскими судостроителями. Если мы хотим построить могущественный флот, необходимо удовлетворить интересы гражданского морского сектора."
 GRE_divided_nation_1:0 "Расколотая страна"
 GRE_divided_nation_1_desc:0 "Страна разделена между множеством идеологических фракций! Мы должны действовать быстро!"
 GRE_shadow_of_1921:0 "Тень 1922 года"
 GRE_shadow_of_1921_desc:0 "После Анатолийской кампании новым офицерам не хватает опыта и воли к борьбе на поле боя. Чтобы защитить страну от внешних угроз с востока и севера, необходимы новые планы и реформы."
