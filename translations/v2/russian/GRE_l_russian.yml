 GRE_join_balkan_entente:0 "Присоединиться к [ROM.GetAdjective] стороне"
 GRE_join_balkan_entente_desc:0 "Румыния берёт на себя ведущую роль на Балканах через [ROM.getFactionName], и для развития балканского сотрудничества жизненно важно присоединиться к ней."
