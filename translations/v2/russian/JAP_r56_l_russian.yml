 JAP_increase_our_effiency:0 "Повысить эффективность"
 JAP_increase_our_effiency_desc:0 "Использование иностранных производственных методов позволило улучшить качество снаряжения, но мы способны добиться ещё большего."
 JAP_looking_inwards:0 "Обратиться внутрь"
 JAP_looking_inwards_desc:0 "Союзники отказались помочь нам в трудный час. Они не оставили выбора — мы должны рассчитывать на себя."
 JAP_joint_industrial_planning:0 "Совместное промышленное планирование"
 JAP_joint_industrial_planning_desc:0 "По мере экономического сближения наших стран мы можем начать совместное промышленное планирование и укрепить хозяйство Азии."
