l_russian:
 JAP_caught_off_gruad:0 "Застигнуты врасплох"
 JAP_caught_off_gruad_desc:0 "Мы знали, что они придут, но не думали, что так скоро."
 r56_JAP_prepare_for_war_with_the_soviet_union:0 "Доктрина удара на север"
 r56_JAP_prepare_for_war_with_the_soviet_union_desc:0 "Мы должны устранить угрозу нашим северным границам. Необходимо начать подготовку к войне с [SOV.GetNameDef]."
 japan_wtt_focus:0 "Национальные фокусы Японии"
 JAP_revolutionary_fervour:0 "Революционный пыл"
 JAP_fascism_party:0 "Кёкоку Итчи Наикаку"
 JAP_imperial_rule_assistance_association_party:0 "Тайсэй Ёкусанкай"
 JAP_SOV_sakhalin_oil_agreement:0 "Сахалинское нефтяное соглашение"
 JAP_kawanishi:0 "Kawanishi"
 JAP_japan_international_aviation_industries:0 "Японская международная авиационная промышленность"
 JAP_japan_steel_works:0 "Japan Steel Works"
 JAP_nippon_oil:0 "Nippon Oil"
 JAP_hitachi_zosen:0 "Корпорация Hitachi Zōsen"
 JAP_teruhisa_komatsu:0 "Тэрухиса Комацу"
 JAP_minoru_takano:0 "Минору Такано"
 JAP_tomin_suzuki:0 "Томин Судзуки"
 JAP_machida_chuji:0 "Тюдзи Матида"
 JAP_ichiro_hatoyama:0 "Итиро Хатояма"
 mobilization_proponent:0 "Сторонник мобилизации"
 JAP_fascism_ideology_desc:0 "Премьер-министр Фумимаро Коноэ создал §YАссоциацию помощи трону§! (Тайсэй Ёкусанкай) для продвижения целей своего движения §BСинтайсэй§! («Новый порядок»). Она превратилась в правящую §Yэтатистскую§! политическую партию, стремившуюся устранить раздробленность в политике и экономике Японской империи и создать §Hтоталитарную однопартийную систему§!, максимально повысив эффективность японских усилий в §Rтотальной войне§!."
 JAP_germano_japanese_technological_exchange:0 "Германо-японский обмен технологиями"
 JAP_army_expansion_idea:0 "Расширение армии"
 JAP_the_boeitai:0 "Бойтай"
 JAP_the_volunteer_corps:0 "Добровольческий корпус"
 JAP_support_the_railways_and_shipping_section:0 "Поддержать отдел железных дорог и судоходства"
 JAP_support_the_railways_and_shipping_section_desc:0 "Логистика — мать войны, и пренебрежение ею нанесёт нашим войскам больше вреда, чем вражеские снаряды. Голодные и плохо оснащённые солдаты не могут эффективно сражаться, но эту проблему можно решить, вложившись в разработку новых транспортных средств."
 JAP_rocket_artillery:0 "Реактивная артиллерия"
 JAP_rocket_artillery_desc:0 "Государственные средства можно направить на разработку мобильных реактивных установок, способных накрывать большой район фугасными снарядами и наносить огромный урон наземным силам противника. Несколько прототипов уже отправлены на полигон для испытаний."
 JAP_kempetai_repression:0 "Репрессии кэмпэйтай"
 JAP_kempetai_repression_desc:0 "На территории страны кэмпэйтай подчиняется Министерству внутренних дел, а за рубежом — армии. Эта служба необходима для безопасности наших имперских владений."
 JAP_pack_guns:0 "Горные орудия"
 JAP_pack_guns_desc:0 "Крайне важно, чтобы артиллерийские полки использовали наиболее подходящее снаряжение. Уменьшив массу орудия и особенно снаряда, мы получим пушку, способную легко справляться с пехотными формированиями противника."
 JAP_expand_the_teishin_shudan:0 "Расширить Тэйсин Сюдан"
 JAP_expand_the_teishin_shudan_desc:0 "Императорская армия экспериментировала с воздушно-десантными войсками ещё в начале 1930-х, но программу закрыли из-за низкой эффективности и высокой уязвимости транспортной авиации. Времена меняются, а вместе с ними должны измениться и наши методы. Важно вложиться в эту ветвь вооружённых сил."
 JAP_defense_in_depth:0 "Глубокоэшелонированная оборона"
 JAP_defense_in_depth_desc:0 "Некоторые наши храбрые солдаты могут проводить почти самоубийственные операции во вражеском тылу, а чтобы безопасно вернуться в штаб, им приходится пересекать опасную линию фронта. Создание линий снабжения и подготовка войск к суровым условиям усилят подобные тактические манёвры и повысят их эффективность."
 JAP_lunge_mines:0 "Противотанковые мины на шесте"
 JAP_lunge_mines_desc:0 "Военные специалисты разработали крайне эффективное противотанковое оружие, способное при правильном применении пробить 6 дюймов, или 150 мм, наклонной брони. Солдат жертвует жизнью ради уничтожения вражеской бронемашины и её экипажа. Достойная мера для бедной ресурсами страны с преданным делу населением."
 JAP_lunge_mines_tt:0 "Открывает §Hпротивотанковые мины на шесте§!\n§HВся пехота\n    Атака по бронетехнике: §G+25%§!\n    Бронепробитие: §G+50%§!\n    Потери опытных солдат: §R+15%§!§!"
 JAP_raise_the_boeitai:0 "Собрать боэйтай"
 JAP_raise_the_boeitai_desc:0 "Чтобы защитить родину от жестоких захватчиков, необходимо создать Корпус обороны, способный встретить врага у порога каждого дома! Прежде призыв этих мужчин и женщин казался немыслимым, но суровые времена требуют всего и каждого ради выживания нации!"
 JAP_rethink_armor_design:0 "Пересмотреть конструкцию бронетехники"
 JAP_rethink_armor_design_desc:0 "Наши бронемашины оказались недостаточно эффективны против новейшего противотанкового оружия, поэтому исследовательские группы разработали танк, сочетающий высокую скорость, мощное орудие и серьёзную броню. Осталось лишь получить одобрение правительства, чтобы эти блестящие машины вышли на поле боя!"
 JAP_the_ultimate_tank:0 "Идеальный танк"
 JAP_the_ultimate_tank_desc:0 "Наши враги будут разбиты, столкнувшись с яростью и гневом полубога, несущегося по полю боя! Новый бронированный зверь уже разработан, и первые машины можно построить всего через несколько недель после официального одобрения."
 JAP_embrace_jungle_warfare:0 "Освоить войну в джунглях"
 JAP_embrace_jungle_warfare_desc:0 "Если наша страна войдёт в джунгли Юго-Восточной Азии, [ROOT.getAdjective] войска столкнутся не только с людьми, но и с самой природой. Жара, высокая влажность, опасные насекомые и болезни заставят даже сильнейшего солдата дважды подумать, прежде чем ступить в джунгли. Либо мы создадим специализированные части, способные эффективно воевать в таких условиях."
 JAP_protect_our_islands_skies:0 "Защитить небо над островами"
 JAP_protect_our_islands_skies_desc:0 "Нашу страну защищают храбрые солдаты на суше и умелые моряки на море, но она всё ещё остаётся возможной целью бомбардировок. Если мы не намерены создавать превосходящие ВВС, необходимо обезопасить промышленность и граждан, построив по всей стране зенитные установки."
 JAP_prepare_for_an_invasion:0 "Подготовиться к вторжению"
 JAP_prepare_for_an_invasion_desc:0 "Наши воды больше не безопасны, и жестокий враг может готовить очередную морскую высадку! Население будет мобилизовано для строительства бункеров и укреплённых огневых точек, способных выдержать удар с моря."
 JAP_form_the_volunteer_corps:0 "Создать добровольческий корпус"
 JAP_form_the_volunteer_corps_desc:0 "Обычных мужчин и женщин обучат основам пожаротушения и выдадут инструменты для спасения станков и оборудования из разрушенных или повреждённых заводов. Это снизит общий ущерб от вражеских бомбардировщиков, господствующих в ночном небе!"
 JAP_guard_the_revolution:0 "Защитить революцию"
 JAP_guard_the_revolution_desc:0 "Только идеологически надёжные агенты могут служить революции. Дома и за рубежом они будут преследовать контрреволюционеров и станут авангардом освобождения трудящихся Азии."
 JAP_smash_the_imperialists:0 "Сокрушить империалистов"
 JAP_smash_the_imperialists_desc:0 "Используя опыт некоторых перебежчиков, мы наконец сможем прорвать линии империалистов и ознаменовать торжество революции!"
 JAP_smash_the_imperialists_idea:0 "Сокрушить империалистов"
 JAP_showa_aircraft_industry:0 "Авиационная промышленность Сёва"
 JAP_showa_aircraft_industry_desc:0 "Созданная в 1937 году компания выпускала лицензированные американские транспортные самолеты DC-3."
 JAP_kantaro_suzuki:0 "Кантаро Судзуки"
 JAP_ichizo_kobayashi:0 "Итидзо Кобаяси"
 JAP_koyata_iwasaki:0 "Коята Ивасаки"
 ROOT_diplomatic_effort:0 "[ROOT.getAdjective] дипломатические усилия"
 JAP_alliance_expansion_plan:0 "План расширения альянса"
 JAP_stimulate_mongol_traditions:0 "Поддержать монгольские традиции"
 JAP_stimulate_mongol_traditions_desc:0 "Монголы десятилетиями страдали от коммунистических правителей, преследовавших их буддийские традиции. Восстановление храмов и уважение к вере принесут нам благодарность населения."
 JAP_pro_mongol_propaganda:0 "Промонгольская пропаганда"
 JAP_expand_the_alliance:0 "Расширить альянс"
 JAP_expand_the_alliance_desc:0 "Как истинные защитники демократических ценностей, мы должны создать союз государств региона, поддерживающих наше дело!"
 JAP_seek_alliances:0 "Искать союзников"
 JAP_seek_alliances_desc:0 "Сокрушить чудовище, в которое превратились большевики, будет нелегко. Но с дополнительной помощью мы сможем гораздо быстрее покончить с коммунистической угрозой."
 JAP_proclaim_philippines_liberation:0 "Провозгласить освобождение Филиппин"
 JAP_philippines_liberation_proclamation:0 "Прокламация об освобождении Филиппин"
 JAP_proclaim_philippines_liberation_desc:0 "Покажем Филиппинам, что эпоха варварского западного колониализма завершена и Азия восторжествует под благожелательным руководством Японии."
 JAP_proclaim_indonesian_liberation:0 "Провозгласить освобождение Индонезии"
 JAP_proclaim_indonesian_liberation_desc:0 "Покажем индонезийцам, что эпоха варварского западного колониализма завершена и Азия восторжествует под благожелательным руководством Японии."
 JAP_indian_independence_league:0 "Лига независимости Индии"
 JAP_indian_liberation_army:0 "Армия освобождения Индии"
 JAP_indian_liberation_army_desc:0 "Мы должны мобилизовать индийских националистов, чтобы они смогли изгнать иностранцев из Индии."
 JAP_support_burmese_liberation_movement:0 "Поддержать бирманское освободительное движение"
 JAP_support_burmese_liberation_movement_desc:0 "Бирманцам принадлежит своё место в Восточной Азии."
 JAP_support_the_indian_independence_league:0 "Поддержать Лигу независимости Индии"
 JAP_support_the_indian_independence_league_desc:0 "Мы должны создать армию, которая обеспечит освобождение Индии и всех её народов!"
 JAP_support_the_burmese_liberation_movement:0 "Поддержать бирманское освободительное движение"
 JAP_support_the_burmese_liberation_movement_desc:0 "Бирманцам принадлежит своё место в Восточной Азии."
 JAP_join_the_anti_bolshevik_pact:0 "Вступить в Антибольшевистский пакт"
 JAP_join_the_anti_bolshevik_pact_desc:0 "[TUR.GetNameDefCap] явно намерена бороться с ужасами советского большевизма. Наш союз ударит по ним с востока и запада."
 JAP_reinforce_cooperation_with_poland:0 "Укрепить сотрудничество с Польшей"
 JAP_reinforce_cooperation_with_poland_desc:0 "С момента обретения независимости Польша была ценным партнёром в сборе разведданных о СССР. Теперь, когда [SOV.getAdjective] армия вновь угрожает ей, как в 1920-е годы, гарнизоны в районе Владивостока должны быть ослаблены. Значит, пришло время атаковать."
 JAP_a_new_spirit_for_an_old_alliance:0 "Новый дух старого союза"
 JAP_a_new_spirit_for_an_old_alliance_desc:0 "Теперь, когда наши идеологии совпадают, следует задуматься о возрождении англо-японского союза."
 JAP_invite_malaysia:0 "Пригласить Малайзию"
 JAP_invite_malaysia_desc:0 "Морские пути вокруг Малайзии — артерии мировой торговли и перевозки полезных ископаемых. Союз и договор о взаимной обороне с [MAL.GetNameDef] откроют нашим рынкам доступ к ценным ресурсам и проливам."
 JAP_invite_indonesia:0 "Пригласить Индонезию"
 JAP_invite_indonesia_desc:0 "Архипелаг Нусантара жизненно важен для защиты пути в Индию и Европу. Дружба и приглашение в наш альянс принесут взаимную выгоду всем участникам."
 JAP_invite_canada:0 "Пригласить Канаду"
 JAP_invite_canada_desc:0 "Вы когда-нибудь пробовали поливать суши кленовым сиропом?"
 JAP_invite_the_philippines:0 "Пригласить Филиппины"
 JAP_invite_the_philippines_desc:0 "Теперь, когда США ушли, наша обязанность — защищать Филиппины от других колониальных держав."
 JAP_invite_australia:0 "Пригласить Австралию"
 JAP_invite_australia_desc:0 "Если Австралия будет на нашей стороне, мы сможем обеспечить мир в наше время вдали от вмешательства западных держав."
 JAP_invite_new_zealand:0 "Пригласить Новую Зеландию"
 JAP_invite_new_zealand_desc:0 "Мы должны заключить союз с Новой Зеландией! Это самый желательный и эффективный способ защитить морские пути, связывающие островные страны вроде наших."
 JAP_invite_the_pacific_states:0 "Пригласить тихоокеанские государства"
 JAP_invite_the_pacific_states_desc:0 "По отдельности эти государства прекрасны для путешествий и развлечений. Вместе они могут стать плацдармами для морского вторжения — скрытым ножом у самой спины Японии. Мы должны любой ценой заключить с ними союз и не допустить этого."
 JAP_side_with_the_balkan_league_against_the_ussr:0 "Поддержать Балканскую лигу против СССР"
 JAP_side_with_the_balkan_league_against_the_ussr_desc:0 "Балканы воюют с [SOV.getNameDef]; следует помочь им уничтожить одного из наших крупнейших соперников в Азии."
 JAP_obtain_polish_cryptological_data:0 "Получить [POL.getAdjective] криптографические данные"
 JAP_obtain_polish_cryptological_data_desc:0 "Работа криптографического отдела [POL.GetNameDef] может сыграть решающую роль в победе над нашими врагами."
 JAP_nippon_nordic_friendship_treaty:0 "Японо-скандинавский договор о дружбе"
 JAP_anglo_japanese_friendship_treaty:0 "Англо-японский договор о дружбе"
 JAP_nordic_strategy:0 "Скандинавская стратегия"
 JAP_nordic_strategy_desc:0 "В дополнение к Северной стратегии логично искать страны на севере, разделяющие наши взгляды на [SOV.getNameDef]. Скандинавия и Финляндия давно обеспокоены [SOV.getAdjective] деятельностью, и дипломатическое сближение, вероятно, завершится подписанием договора о сотрудничестве. Да здравствует Японо-скандинавский договор о дружбе!"
 JAP_sumitomo_rubber_industries:0 "Sumitomo Rubber Industries"
 JAP_sumitomo_rubber_industries_desc:0 "Изначально являясь лишь партнёром Dunlop Japan, резиновое подразделение дзайбацу Sumitomo может объединиться с химическим подразделением конгломерата и наладить производство японской резины."
 JAP_imperial_rule_assistance_association:0 "Ассоциация помощи трону"
 JAP_imperial_rule_assistance_association_desc:0 "Пора объединить различные политические партии правительств национального единства и превратить нашу страну в однопартийное государство, полностью посвящённое великой войне за освобождение Азии."
 JAP_diversified_tank_roles:0 "Разнообразить роли танков"
 JAP_diversified_tank_roles_desc:0 "Оснастив бронетехнику различными орудиями и ходовыми системами, мы сможем использовать её для более широкого круга задач на поле боя."
 JAP_diversified_tank_roles_ho_ni_3_tt:0 "Наличие §Yулучшенного среднего шасси§! также откроет шаблон §Yулучшенного среднего истребителя танков§!.\n"
 JAP_red_pacific_fleet:0 "Красный Тихоокеанский флот"
 JAP_red_pacific_fleet_desc:0 "Мы должны перестроить флот в соответствии с нашими идеологическими принципами."
 JAP_corporate_developments:0 "Корпоративное развитие"
 JAP_corporate_developments_desc:0 "Наше сотрудничество с дзайбацу, несомненно, принесёт плоды."
 JAP_airframe_supplies_improvements:0 "Улучшение снабжения авиастроения"
 JAP_airframe_supplies_improvements_desc:0 "Необходимость увеличить выпуск самолётов потребовала реформировать производство различных деталей истребителей."
 JAP_reform_airframe_production:0 "Реформировать производство планеров"
 JAP_reform_airframe_production_desc:0 "Необходимость увеличить выпуск самолётов потребовала реформировать производство различных деталей истребителей."
 JAP_submarine_modernization:0 "Модернизация подводного флота"
 JAP_submarine_modernization_desc:0 "Каким бы ни был исход спора между авианосцами и линкорами, подводные лодки остаются важнейшей частью японского флота: нарушение снабжения способно парализовать любую наступающую вражескую армию."
 JAP_supply_disruption:0 "Нарушение снабжения"
 JAP_supply_disruption_desc:0 "Вместо прямого столкновения с врагом мы можем задержать и ослабить его силы, атакуя морские линии снабжения."
 JAP_finance_the_naval_arsenals:0 "Финансировать военно-морские арсеналы"
 JAP_finance_the_naval_arsenals_desc:0 "Чтобы гарантировать безопасность Тихого океана, нам нужен более крупный флот."
 JAP_increased_repair_capabilities:0 "Расширенные ремонтные возможности"
 JAP_increased_repair_capabilities_desc:0 "Флот будет эффективен лишь в том случае, если повреждённые корабли быстро и качественно ремонтируются и возвращаются в строй раньше вражеских."
 JAP_trans_pacific_alliance:0 "Транстихоокеанская дружба"
 JAP_trans_pacific_alliance_desc:0 "В последние годы отношения Японии и Соединённых Штатов были напряжёнными. Но с новым правительством и образом жизни союз с ними становится естественным: вместе наши страны смогут создать достойный фронт защиты демократического мира."
 JAP_subsidise_the_zaibatsus:0 "Субсидировать дзайбацу"
 JAP_subsidise_the_zaibatsus_desc:0 "При должной поддержке дзайбацу могут стать основой могущества государства."
 JAP_expand_kobe_steel_works:0 "Расширить металлургические заводы Кобе"
 JAP_expand_kobe_steel_works_desc:0 "Для развития внутренней экономики и военно-промышленного комплекса необходимо увеличить производство Kobe Steel и получить ресурсы, нужные для достижения наших целей."
 JAP_preemptive_strike_soviet:0 "Упреждающий удар"
 JAP_preemptive_strike_soviet_desc:0 "Мы не можем ждать, пока станем жертвами очередного коммунистического заговора. Необходимо ударить первыми и всей мощью."
 JAP_crush_chinese_communists:0 "Сокрушить китайских коммунистов"
 JAP_crush_chinese_communists_desc:0 "Незаконные коммунистические правители Китая представляют огромную угрозу Восточной Азии и всему миру. Мы должны уничтожить их, прежде чем они успеют причинить вред."
 JAP_trans_pacific_faction:0 "Транстихоокеанский договор"
 JAP_liberate_korea:0 "Освободить Корею"
 JAP_liberate_korea_desc:0 "Корейский народ слишком долго страдал под капиталистическим и империалистическим гнётом. Мы имеем право освободить его от этой тирании!"
 JAP_soviet_technology_sharing:0 "Советско-японский обмен технологиями"
 JAP_soviet_technology_sharing_desc:0 "Чтобы сохранить единство, мы должны делиться исследованиями вооружений и вместе сдерживать любые угрозы."
 JAP_import_soviet_armor:0 "Импортировать советскую бронетехнику"
 JAP_import_soviet_armor_desc:0 "В последние годы Советский Союз добился значительных успехов в разработке бронетехники. Наши собственные бронетанковые силы ничтожны, поэтому нам есть чему у него поучиться."
 JAP_strike_the_old_oppressors:0 "Ударить по старым угнетателям"
 JAP_strike_the_old_oppressors_desc:0 "Соединённые Штаты слишком долго подавляли нас своей капиталистической и империалистической тиранией. Мы не можем позволить этому повториться. Пора покончить с ними раз и навсегда!"
 JAP_taiwan_fob_prepare_tt:0 "§YТайвань§! будет подготовлен как плацдарм, позволяющий также нанести удар по §YФилиппинам§!."
 JAP_develop_mengjiang:0 "Развивать [MEN.GetNonIdeologyName]"
 JAP_develop_mengjiang_desc:0 "Создание [MEN.GetNameDef] даёт нам ещё одну возможность развивать местную промышленность ради собственного экономического роста."
 JAP_nishina_okochi_directive:0 "Директива Нисины — Окоти"
 JAP_nishina_okochi_directive_desc:0 "Абсолютное оружие для уничтожения врагов уже почти в наших руках. Работы Ёсио Нисины и Масатоси Окоти доказали возможность применения ядерного оружия в войне. Мы должны позволить им продолжить исследования и получить столь могущественное средство."
 JAP_redesign_the_naval_guns:0 "Переработать корабельные орудия"
 JAP_redesign_the_naval_guns_desc:0 "Чтобы обеспечить превосходство наших кораблей, необходимо создать современные орудия с большей дальностью и эффективностью для специализированных флотов."
 JAP_black_dragon_society:0 "Общество Чёрного дракона"
 JAP_black_dragon_society_desc:0 "Общество Чёрного дракона — тайная организация, глубоко проникшая в наши спецслужбы. Некоторые её связи могут оказаться весьма полезными."
 JAP_divert_naval_guns_to_the_army:0 "Передать флотское вооружение армии"
 JAP_divert_naval_guns_to_the_army_desc:0 "Вместо башни линкора мы можем получить железнодорожную артиллерию."
 r56_japan.1.t:0 "Инцидент 26 февраля"
 r56_japan.1.desc:0 "Похоже, молодые армейские офицеры попытались совершить переворот. Провозгласив себя «Праведной армией», они убили многих политиков и критиков, не разделявших их чрезмерно националистическую риторику. Мы быстро отреагировали и подавили мятеж. Многие заговорщики принадлежали к фракции Кодоха в правительстве и армии."
 r56_japan.1.a:0 "Мятеж не останется безнаказанным."
 r56_japan.2.t:0 "Японское технологическое сотрудничество"
 r56_japan.2.desc:0 "Чтобы обеспечить военное превосходство, [JAP.GetAdjective] правительство поощряет технологическое сотрудничество с союзниками и уже готовит чертежи."
 r56_japan.2.a:0 "Превосходно."
 r56_japan.10.t:0 "Провести выборы"
 r56_japan.10.desc:0 "На протяжении десятилетий милитаристы оказывали огромное влияние на политическую жизнь и дипломатический курс страны. Усвоив ошибки прошлого, новое временное правительство после укрепления контроля объявило о проведении всеобщих выборов в этом месяце.\n\nСреди высших чиновников явно преобладают либеральные взгляды, поэтому демократическая коалиция почти наверняка получит большинство голосов. Тем не менее мы ещё можем провести несколько кампаний поддержки, чтобы обеспечить победу желаемого блока."
 r56_japan.10.a:0 "Риккэн Минсэйто — Конституционно-демократическая партия!"
 r56_japan.10.b:0 "Риккэн Сэйюкай — Общество друзей конституционного правления!"
 r56_japan.11.t:0 "[JAP.getAdjective] специалисты предлагают технологическое сотрудничество"
 r56_japan.11.desc:0 "Дипломаты [JAP.getNameDef] обратились к нашим чиновникам с предложением провести инспекцию предприятий, чтобы [JAP.getAdjective] инженеры могли изучить наши методы производства и повысить качество собственной продукции.\n\nИх представители уже гарантировали конфиденциальность и скрытность соглашения, предоставив письменные обещания защитить любые технологические новшества, обсуждаемые на месте.\nДелегация ожидает нашего ответа в обозримом будущем. Что мы скажем?"
 r56_japan.11.a:0 "Предоставить им полный доступ к нашим танковым заводам."
 r56_japan.11.b:0 "Разрешить проверку стрелкового оружия для подтверждения его качества."
 r56_japan.11.c:0 "Авиационные заводы могут выиграть от иностранного опыта."
 r56_japan.11.e:0 "Мы не заинтересованы в обмене секретами."
 JAP_reignite_the_chinese_civil_war:0 "Возобновить гражданскую войну в Китае"
 JAP_reignite_the_chinese_civil_war_desc:0 "Националисты и прочие реакционные силы слишком долго стояли на пути освобождения китайского народа!"
 JAP_hirohito:0 "Хирохито"
 JAP_hirohito_desc:0 "Император Сёва олицетворяет для [JAP.GetAdjective] народа победы и процветание, одновременно служа мощным объединяющим символом внутри [JAP.GetNameDef]."
 sino_jap_war_fail_naisen:0 "Найсэн"
 sino_jap_war_fail_naisen_desc:0 "Провал завоевания Китая вызвал раскол в правительстве и обществе. Наша страна стоит на грани полного краха!"
 sino_jap_war_fail_naisen_overthrow:0 "Какумэй Сэйсин"
 sino_jap_war_fail_naisen_overthrow_desc:0 "Провал завоевания Китая показал неспособность нынешнего правительства руководить Японией. Мы должны восстать против него и вывести страну из бездонной тьмы!"
 JAP_r56_nanshin_ron:0 "Нансин-рон"
 JAP_r56_nanshin_ron_desc:0 ""
 jap_r56_hokushin_ron:0 "Хокусин-рон"
 jap_r56_hokushin_ron_desc:0 "Мы будем сражаться с величайшим злом до конца времён!"
 jap.1.t:0 "Кодоха начала военный переворот!"
 jap.1.d:0 "Острое политическое соперничество вызвало волну убийств политиков по всей стране. Фракция Кодоха, стоящая за этими преступлениями, стремится уничтожить соперников из Тосэйха, считая их парламентский подход лишь помехой власти императора. Император признал произошедшее и выступил с публичной речью, заявив, что..."
 jap.1.a:0 "...насильственные методы Кодоха должны прекратиться!"
 jap.1.b:0 "...гражданам следует поддержать Кодоха в возвращении власти императору."
 jap.2.t:0 "Тайсэй Ёкусанкай"
 jap.2.d:0 "Создана Тайсэй Ёкусанкай — организация, призванная содействовать императорскому правлению."
 jap.2.a:0 "Бандзай Японии!"
 sfl.1.t:0 "Найсэн!"
 sfl.1.d:0 "Волнения среди населения и части чиновников достигли критической точки, и гражданская война кажется неизбежной! Хуже того, жители Тайваня и Кореи восстали, убили всех наших местных чиновников и вернулись под власть Китая!"
 sfl.1.a:0 "Защитить императора Хирохито любой ценой!"
 sfl.3.t:0 "Избранный полуостров"
 sfl.3.d:0 "Полуостров Избранный, первоначально родина Избранной Династии, пал на японцев в 1910. Возможно, пришло время дать им долгожданную независимость."
 sfl.3.a:0 "Они станут свободной нацией!"
 sfl.3.b:0 "Оставим их японцам."
 sfl.3.c:0 "Установим марионеточное правительство."
 sfl.4.t:0 "Япония возвращает территории"
 sfl.4.d:0 "После успешного демократического переворота новое японское правительство решило улучшить отношения с нами, вернув земли, оккупированные прежним фашистским режимом."
 sfl.4.a:0 "Эти земли по праву принадлежат нам!"
 sfl.5.t:0 "Япония демонстрирует дружбу"
 sfl.5.d:0 "После успешного демократического переворота новое японское правительство хочет улучшить отношения с нами, отказавшись от притязаний на спорные территории между нашими странами."
 sfl.5.a:0 "Они мудро поступили, отказавшись от этих земель."
 sfl.6.t:0 "Острова в море Бисмарка"
 sfl.6.d:0 "После успешного демократического переворота новое японское правительство решило улучшить отношения с нами, передав острова, захваченные у Германской империи во время Великой войны."
 sfl.6.a:0 "Мы принимаем этот жест дружбы."
 sfl_aftermath_chi_tt:0 "[Root.GetNameDefCap] получает контроль над китайскими регионами, принадлежащими [JAP.GetNameDef]."
 sfl.7.t:0 "Корея освобождена"
 sfl.7.d:0 "Полуостров Чосон оказался в руках иностранцев, и они освободили корейский народ."
 sfl.7.a:0 "Это безумие!"
 sfl.7.b:0 "У нас нет времени на эту корейскую помеху!"
 sfl.8.t:0 "Китайские территории"
 sfl.8.d:0 "Теперь, когда фашистский режим пал, следует исправить и совершённые им злодеяния. Оккупация Маньчжурии — одно из них. Вернём ли мы её китайскому народу?"
 sfl.8.a:0 "[CHI.GetNameDefCap] получит эти земли."
 sfl.8.b:0 "Мы должны угодить коммунистическому миру, иначе погибнем под мощью Советов."
 sfl.8.c:0 "Это не наш приоритет."
 sfl.9.t:0 "Спорные территории с [SOV.GetNameDef]"
 sfl.9.d:0 "Спорные земли на Сахалине дают прекрасную возможность задобрить красного гиганта на севере и обезопасить себя."
 sfl.9.a:0 "Мы не должны навлекать на себя гибель!"
 sfl.9.b:0 "Чепуха! Коммунистический мир никогда не победит мир свободы!"
 sfl.10.t:0 "Острова в Тихом океане"
 sfl.10.d:0 "Теперь, когда наши идеологии совпадают, [USA.GetNameDefCap] стала ценным союзником. Следует передать ей острова, захваченные у Германской империи во время Великой войны, и тем самым заручиться поддержкой."
 sfl.10.a:0 "Великий союзник бесценен."
 sfl.10.b:0 "Мы справимся сами!"
 sfl.11.t:0 "Япония отказалась вернуть нам Маньчжурию"
 sfl.11.d_prc:0 "[JAP.GetNameDefCap] решила передать оккупированные китайские территории [CHI.GetNameDef]. Это унижение для нашего правительства!"
 sfl.11.d_chi:0 "[JAP.GetNameDefCap] решила передать оккупированные китайские территории [PRC.GetNameDef]. Это унижение для нашего правительства!"
 sfl.11.a:0 "Мы не потерпим этого унижения!"
 sfl.12.t:0 "Маньчжурский вопрос проигнорирован"
 sfl.12.d:0 "Японское правительство объявило, что откладывает обсуждение Маньчжурии на неопределённый срок. Они не хотят возвращать эти земли!"
 sfl.12.a:0 "Если это можно стерпеть, то чего же нельзя?"
 sfl.13.t:0 "Корея"
 sfl.13.d:0 "Освободим ли мы корейцев и предоставим им самим решать свою судьбу?"
 sfl.13.a:0 "Безусловно."
 sfl.13.b:0 "Какая шутка."
 sfl.14.t:0 "Искать мира с Осью"
 sfl.14.d:0 "Теперь, когда Япония больше не воюет с нами, причины вступления других стран Оси в конфликт исчезли. Возможно, вместо продолжения боёв стоит предложить им мир."
 sfl.14.a:0 "Связаться с ними и предложить мир."
 sfl.14.b:0 "Мы ещё можем извлечь выгоду из этой войны."
 sfl.15.t:0 "[From.GetNameDefCap] призывает к миру"
 sfl.15.d:0 "Правительство [From.GetNameDef] обратилось к [Root.GetLeader] с предложением мирных переговоров. Поскольку оно больше не воюет с Японией, оно считает, что причин продолжать конфликт между нами не осталось."
 sfl.15.a:0 "Они правы — война между нами закончится."
 sfl.15.b:0 "Мы сражаемся за свои интересы!"
 sfl.16.t:0 "[From.GetNameDefCap] соглашается на мир с нами"
 sfl.16.d:0 "[From.GetLeader] решил, что больше нет причин воевать с нами, и подписал белый мир между нашими странами."
 sfl.16.a:0 "Они заслужили нашу искреннюю благодарность."
 sfl.17.t:0 "[From.GetNameDefCap] отвергает мирные переговоры"
 sfl.17.d:0 "[From.GetLeader] заявил, что у них есть иные интересы в продолжении этой войны!"
 sfl.17.a:0 "Проклятая империалистическая свинья!"
 kmt_kor_north_liberated:0 "В Пхеньяне восстают 5 подразделений"
 kmt_kor_south_liberated:0 "В Сеуле восстают 5 подразделений"
 sfl.18.t:0 "Отчаянное положение"
 sfl.18.d:0 "После освобождения Кореи, провала завоевания Китая и начала гражданской войны наши силы оказались чрезмерно растянуты. Император и военные решили отказаться от Континентальной политики и сосредоточиться на гражданской войне. Решение тяжёлое, но в нынешних обстоятельствах, возможно, наилучшее."
 sfl.18.a:0 "Да, император прав."
 sfl.18.b:0 "Какая чепуха!"
 sfl.19.t:0 "Япония ищет мира"
 sfl.19.d:0 "Провал войны вынудил Японию отказаться от Континентальной политики. Это означает, что она передаст китайские земли и сосредоточит силы на продолжающейся гражданской войне.\n\nКак нам ответить?"
 sfl.19.a:0 "С ними и так покончено — незачем тратить время."
 sfl.19.b:0 "Временное перемирие."
 sfl.19.c:0 "Никакой передышки империалистическим псам!"
 sfl_jap_forfeit_land:0 "[Root.GetNameDefCap] получает китайские земли, принадлежащие Японии\n"
 sfl_later_war_with_jap:0 "Через месяц вы сможете решить, начинать ли войну с Японией, §Rнезависимо от её идеологии.§!"
 sfl.20.t:0 "Мир с [CHI.GetNameDef]"
 sfl.20.d:0 "[CHI.GetNameDefCap] согласилась заключить с нами мир."
 sfl.20.a:0 "Теперь мы можем сосредоточиться на гражданской войне."
 sfl.22.t:0 "Никакого мира с [CHI.GetNameDef]"
 sfl.22.d:0 "[CHI.GetNameDefCap] отказалась заключить с нами мир."
 sfl.22.a:0 "Неужели такова наша судьба?"
 sfl.23.t:0 "Война с Японией?"
 sfl.23.d:0 "Пора решить, объявлять ли войну [JAP.GetNameDef]."
 sfl.23.a:0 "Японский народ заплатит за совершённые злодеяния!"
 sfl.23.b:0 "Крови уже пролито слишком много."
 sfl.24.t:0 "[CHI.GetNameDefCap] объявляет нам войну!"
 sfl.24.d:0 "Китайцы разорвали перемирие и объявили нам войну!"
 sfl.24.a:0 "Вероломные мерзавцы!"
 sfl_cant_peace_with_axis_later:0 "§RВ будущем вы не сможете заключить сепаратный мир с Осью.§!\n"
 sfl.25.t:0 "Судьба Индокитая"
 sfl.25.d:0 "Как нам поступить с Индокитаем?"
 sfl.25.a:0 "[FRA.GetNameDefCap] может получить его обратно."
 sfl.25.b:0 "[CHI.GetNameDefCap] может получить его."
 sfl.25.c:0 "Мы оставим его себе."
 sfl.26.t:0 "[From.GetNameDefCap] передаёт Индокитай"
 sfl.26.d:0 "[From.GetNameDefCap] решила передать Индокитай под наше управление."
 sfl.26.a:0 "Мудрое решение."
 sfl.27.t:0 "[From.GetNameDefCap] игнорирует наши притязания на Индокитай"
 sfl.27.d:0 "Несмотря на наши законные притязания, [From.GetNameDefCap] решила не передавать нам Индокитай."
 sfl.27.a:0 "Тогда мы возьмём его силой."
 sfl.28.t:0 "Рюкю"
 sfl.28.d:0 "После давней аннексии нашего королевства японцы переименовали родину в Окинаву. Теперь, когда мы свободны, следует вернуть городам прежние названия."
 sfl.28.a:0 "Долой японские названия!"
 sfl.28.b:0 "Это потребует слишком много усилий."
 r56_japan.11.t:0 "Япония требует проверки методов производства"
 r56_japan.11.d:0 "Мы могли бы позволить японским инженерам осматривать наши заводы и учиться на наших методах производства. Хотя это обычно было бы бесполезным требованием; теперь, когда [JAP.GetAdjective] Мы стали демократической нацией, и мы можем верить, что это не вызовет никаких проблем."
 JAP_rikken_minseito:0 "Риккэн Минсэйто"
 JAP_rikken_minseito_desc:0 "Риккэн Минсэйто — левоцентристская партия Японии."
 JAP_introducing_health_care:0 "Национализировать здравоохранение"
 JAP_introducing_health_care_desc:0 "Всеобщая система здравоохранения станет одним из шагов к устранению имущественного неравенства в Японии."
 JAP_conciliatory_foreign_policy:0 "Примирительная внешняя политика"
 JAP_conciliatory_foreign_policy_desc:0 "Следуя обязательствам по Лондонскому морскому договору, мы заверим великие державы в мирных намерениях ради благополучия региона."
 JAP_workers_compensation:0 "50-часовая рабочая неделя"
 JAP_workers_compensation_desc:0 "Установление стандартной продолжительности рабочего времени защитит людей от переработок и кароси."
 JAP_rikken_seiyukai:0 "Риккэн Сэйюкай"
 JAP_rikken_seiyukai_desc:0 "Риккэн Сэйюкай — правоцентристская партия Японии."
 JAP_the_bastion:0 "Оплот демократии"
 JAP_the_bastion_desc:0 "Япония должна стать оплотом демократии на Востоке. Мы обязаны защищать недавно обретённую свободу, иначе она погибнет."
 JAP_invite_the_militarist_back:0 "Вернуть милитаристов"
 JAP_invite_the_militarist_back_desc:0 "Следует попытаться договориться с милитаристами. Подчинённые новым правилам, они могут вновь оказаться полезными."
 JAP_economic_deals:0 "Экономические соглашения"
