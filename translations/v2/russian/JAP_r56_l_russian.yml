 JAP_factory_manchu:0 "Инвестировать в Маньчжурию"
 JAP_factory_manchu_desc:0 "Возможно, в будущем нам пригодится помощь Маньчжурии."
 JAP_resource_manchu:0 "Эксплуатировать Маньчжурию"
 JAP_resource_manchu_desc:0 "Чтобы Япония могла играть более значимую роль в мире, Маньчжурию необходимо эксплуатировать. Мы готовы заставить их заплатить эту цену."
 JAP_expanded_aluminium_in_manchu:0 "Расширить маньчжурские алюминиевые предприятия"
 JAP_expanded_aluminium_in_manchu_desc:0 "Нам нужно множество изделий из этого ресурса. Пусть добывают больше."
 JAP_manchu_oil:0 "Маньчжурские нефтяные месторождения"
 JAP_manchu_oil_desc:0 "Мы обнаружили новые залежи нефти. Кто знает, что найдётся дальше!"
 JAP_manchu_buff:0 "Маньчжурская армия"
 JAP_manchu_buff_desc:0 "Маньчжурской армии пригодились бы наши офицеры генерального штаба."
 JAP_manchu_buff1:0 "Маньчжурские войска специального назначения"
 JAP_manchu_buff1_desc:0 "Дополнительные специализированные подразделения могут оказаться полезными для военных усилий."
 JAP_island_investment:0 "Инвестиции в острова"
 JAP_island_investment_desc:0 "Покончив с экспансионизмом, мы можем направить ресурсы в другие регионы, прежде всего в наши колониальные владения."
 JAP_ally_korea:0 "Азиатский демократический пакт"
 JAP_ally_korea_desc:0 "Оставим разногласия в прошлом, протянем оливковую ветвь и поможем друг другу. Азия должна выйти на мировую арену на собственных условиях, без западного влияния."
 JAP_joint_civilian_investment:0 "Совместные гражданские инвестиции"
 JAP_joint_civilian_investment_desc:0 "Мы можем помочь и себе, и новому демократическому союзнику, открыв рынки обеих стран и ускорив экономический рост."
 JAP_east_asian_bank:0 "Восточноазиатский банк"
 JAP_east_asian_bank_desc:0 "Создание единой финансовой системы сблизит наши демократии."
 JAP_joint_military_cooperation:0 "Совместное военное сотрудничество"
 JAP_joint_military_cooperation_desc:0 "Совместные учения восточноазиатских армий позволят нам накопить больше опыта."
 JAP_korean_chaebols:0 "Инвестировать в корейские корпорации"
 JAP_korean_chaebols_desc:0 "Инвестиции в корейский бизнес обеспечат нам более выгодный рынок в будущем."
 JAP_expand_aluminium_plants:0 "Расширить алюминиевую промышленность Кансая"
 JAP_expand_aluminium_plants_desc:0 "Инвестиции во внутренние ресурсы укрепят нашу экспортно-ориентированную экономику."
 JAP_invest_in_allies_tt:0 "Если азиатские союзники входят в вашу фракцию, они также получат бонусы от этого фокуса."
