 PHI_defense_strategy_dynamic_modifier:0 "Оборонная стратегия"
 PHI_defense_strategy_dynamic_modifier_desc:0 "Будучи островом, Филиппины вполне оправданы. Это не означает, что мы не должны создавать дополнительные препятствия для любого захватчика."
