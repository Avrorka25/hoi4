 PHI_the_great_depression_temp_construction_speed:0 "Временный строительный бум"
 PHI_ruling_ideology_ideology_drift_tt:0 "Любой дрейф идеологии будет соответствовать правящей партии."
 PHI_ruling_ideology_ideology_drift_tt_2:0 " Ежедневный дрейф правящей партии: $RIGHT|+=2$"
 PHI_shaken_economy_dynamic_modifier:0 "Поколебленная экономика"
 PHI_shaken_economy_dynamic_modifier_desc:0 "Последствия Великой депрессии по-прежнему отражаются на всей нашей стране, а экономика остается потрясенной и неуязвимой. Не все плохо, но есть самые слабые проблески восстановления на горизонте."
