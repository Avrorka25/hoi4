 JAP_japanese_airforce_dm:0 "Японские ВВС"
 JAP_early_industrialization_efforts_dm:0 "Ранняя индустриализация"
 JAP_early_industrialization_efforts_dm_desc:0 "Наша промышленная революция началась только в 1870-х годах во время реставрации Мэйдзи, после того как миссия Ивакура принесла домой знания, необходимые для реализации наших проектов индустриализации. С тех пор наша экономика значительно расширилась, появились современные отрасли. Однако, несмотря на это, наша экономика все еще сильно отстает от западной, в основном из-за нехватки природных ресурсов."
 JAP_modify_early_industrialization_modifier_tt:0 "изменять §Y$JAP_early_industrialization_efforts_dm$§! посредством:"
 JAP_add_early_industrialization_modifier_tt:0 "Добавить §Y$JAP_early_industrialization_efforts_dm$§! которые предоставляют:\n"
 JAP_modify_economic_mirale_modifier_tt:0 "изменять §Y$JAP_the_economic_mirale_dm$§! посредством:"
 JAP_the_economic_mirale_dm:0 "Экономическое чудо"
 JAP_the_economic_mirale_dm_desc:0 "Легкая промышленность и сельское хозяйство больше не являются основой экономики, а тяжелая промышленность обогнала их. Кроме того, бедность и безработица были радикально сокращены в результате блестящих экономических реформ Осаму Шимомуры. Скоро мы станем одной из крупнейших экономик мира!"
