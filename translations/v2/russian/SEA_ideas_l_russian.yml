 JAP_national_army_dm:0 "Национальная армия"
 JAP_national_army_dm_desc:0 "NJLF является нашей основной сухопутной силой, сыграв центральную роль в нашей быстрой модернизации во время эпохи Мэйдзи и сражаясь в многочисленных конфликтах, включая войну между Японией и Цин, русско-японскую войну, а также Великую войну. Первоначально сформированный из доменных армий после реставрации Мэйдзи, он превратился в мощную современную армию под влиянием французских и немецких моделей."
 JAP_jungle_armor_tt:0 "\n§Y$category_all_armor$§!:\n§YДжунгли§!:\n Эффективные изменения атаки: §G+10%§!\n Эффективные изменения обороны: §G+10%§!"
