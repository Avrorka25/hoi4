 idea_CHI_a_new_chapter:0 "Новая глава"
 idea_CHI_a_new_middle_kingdom:0 "Новое Среднее Королевство"
 idea_CHI_cradle_of_civilization:0 "Колыбель цивилизации"
 idea_CHI_eternal_revolution:0 "Начало вечной революции"
 idea_CHI_cult_of_shek:0 "Культ Чан Кайши"
 idea_CHI_cult_of_shek_desc:0 "Даже после смерти Чан Кайши влияние отражается на всем высоком уровне китайской администрации, став маяком сопротивления и неповиновения перед лицом иностранной агрессии."
 idea_CHI_our_place:0 "Наше место"
 idea_CHI_our_place_desc:0 "Наше членство в [ROOT.GetFactionName] Мы укрепляемся, но мы должны стремиться к лидерству. Это просто наше право."
 CHI_whampoa_military_academy_spirit:0 "Преимущество Вампоа"
 CHI_whampoa_military_academy_spirit_desc:0 "Военная академия Гоминьдана в Вампоа обладает властью над новобранцами и продвижением по службе в армии. Несмотря на то, что он не является полностью неэффективным, в нем содержится большое количество институционализированной коррупции."
 CHI_the_political_tutelage_dm:0 "Политическая опека"
 CHI_the_political_tutelage_dm_desc:0 "Настало время в полной мере реализовать идеи Сунь Ят Сена, повысить грамотность китайского народа и пробудить его политическое сознание, позволив создать и выжить республике на нашей земле."
 CHI_modify_CHI_the_political_tutelage_dm_tt:0 "изменять §Y$CHI_the_political_tutelage_dm$§! посредством:"
 CHI_modify_CHI_the_political_tutelage_upgraded_dm_tt:0 "изменять §Y$CHI_the_political_tutelage_upgraded_dm$§! посредством:"
 CHI_saco:0 "САКО"
 CHI_saco_desc:0 "Китайско-американская кооперативная организация — это совместная группа, сосредоточенная на обмене разведданными, где мы можем учиться друг у друга."
 CHI_women_in_the_war_effort_idea:0 "Женщины в национальной борьбе"
 CHI_women_in_the_war_effort_idea_desc:0 "Современность — это не только круг мужчин и женщин нашей страны, которые поднялись и заняли свое законное место в вооруженных силах и своих батальонах."
 CHI_chinese_womens_national_war_relief_society:0 "Китайское женское общество помощи во время войны"
 CHI_chinese_womens_national_war_relief_society_desc:0 "Нация сильна лишь как самое слабое звено, и поэтому общество стремится укрепить ее."
 CHI_local_rural_reconstruction_modifier:0 "Инициативы Движения за восстановление сельских районов"
 CHI_new_culture_movement_idea:0 "Новое культурное движение"
 CHI_asian_bastion_of_liberty_idea:0 "Азиатский бастион свободы"
 CHI_republican_agitation:0 "Республиканская агитация"
 CHI_republican_agitation_tt:0 "§RГражданская война начнется, если §Yдемократический§! Поддержка превышает 40%!§!"
 CHI_correcting_a_hisotrical_wrong_idea:0 "Исправить историческую ошибку"
 CHI_liberated_by_democratic_china:0 "Освобожденный [CHI.GetNameDefCap]"
 CHI_liberated_by_democratic_china_desc:0 "Наша страна наконец-то получила свою законную независимость от колонизаторов. С помощью [CHI.GetNameDef] Мы снова свободная страна. Их действия так явно помогают нам, что коммунистические идеи, которые они проповедуют, начинают укорениться в нашем народе."
 CHI_declared_war_zone_idea:0 "Объявлена зона военных действий"
 CHI_bog_defensive_modifier:0 "Координированная оборона"
 CHI_shanghai_international_settlement:0 "Шанхайское международное урегулирование"
 CHI_shanghai_international_settlement_desc:0 "Иностранные державы установили свой контроль через договоры, сделав Шанхай открытой дверью."
