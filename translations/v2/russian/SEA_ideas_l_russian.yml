 JAP_state_shinotism_dm:0 "Государственный синтоизм"
 JAP_state_shinotism_dm_desc:0 "Со времен Реставрации Мэйдзи мы стремились использовать богослужение в синтоистских святынях, чтобы способствовать имперской лояльности и помощи в национальном строительстве. Это позволило нам построить страну, которая готова многим пожертвовать во имя государства."
 JAP_modify_state_shinotism_modifier_tt:0 "изменять §Y$JAP_state_shinotism_dm$§! посредством:"
 JAP_add_state_shinotism_modifier_tt:0 "Добавить §Y$JAP_state_shinotism_dm$§! которые предоставляют:\n"
 JAP_imperial_army_dm:0 "Имперская армия"
 JAP_imperial_army_dm_desc:0 "IJA является нашей основной сухопутной силой, сыграв центральную роль в нашей быстрой модернизации во время эпохи Мэйдзи и сражаясь в многочисленных конфликтах, включая войну между Японией и Цин, русско-японскую войну, а также Великую войну. Первоначально сформированный из доменных армий после реставрации Мэйдзи, он превратился в мощную современную армию под влиянием французских и немецких моделей."
