 MAN_korean_liberation_army:0 "Корейская освободительная армия"
 MAN_korean_liberation_army_desc:0 "Организовав вместе с бандитами, корейская Освободительная Армия теперь решила помочь нам своими знаниями и опытом в победе над японцами."
 MAN_yong_ying_idea:0 "Ён Инь"
 SIC_drive_out_the_japanese_idea:0 "Выгнать японцев"
 SIC_push_into_xikang_idea:0 "Назад Тибетцы"
 SIC_a_loose_unity:0 "Свободное единство"
 SIC_a_loose_unity_desc:0 "Хотя номинально они объединены под знаменем «Сычуаньской клики», в нашей провинции есть несколько различных правителей, которые имеют свои собственные цели и амбиции. Некоторые, как Лю Вэньхуэй, даже создали свою собственную маленькую область, которая функционально отделена от остальной части провинции, в то время как другие имеют свои собственные представления о том, как следует обращаться с армией."
 GXC_scorched_earth_policy:0 "Выжженная Земля"
 SIK_the_nkvd_no_lar:0 "НКВД"
 SIK_soviet_pilot_schools:0 "Советские пилотные школы"
 SIK_three_year_plan:0 "Трёхлетний план"
 SIK_transformation_of_nature_idea:0 "Преобразование природы"
 SIK_state_atheism_freedom_of_religion:0 "Государственный атеизм - индивидуальная свобода вероисповедания"
 SIK_detracting_from_party_line:0 "Отвлечение от партийной линии"
 SIK_if_war_with_sov_this_disappears_tt:0 "§RБудет устранен, если мы войдем в войну с [SOV.GetNameDef]§!"
 SIK_a_modern_province:0 "Современная провинция"
 SIK_the_six_policies:0 "Шесть великих политик"
 SIC_the_new_guominjun_idea:0 "Новый Гоминджун"
 SIK_state_autonomous_prefecture:0 "Автономная префектура"
 SIK_state_autonomous_prefecture_desc:0 "В префектуре, где правят местные лидеры, перенапряжение правительства уменьшается, и в случае войны эти лидеры могут оказаться не совсем лояльными."
 PRC_the_yulin_garrison:0 "Юлинский гарнизон"
 PRC_the_yulin_garrison_desc:0 "Несмотря на все наши усилия по их уничтожению, 86-я и 84-я дивизии под командованием Цзин Юэйсу и Гао Гуизи сумели отразить наши атаки и фактически сохранили север под контролем Гоминьдана. Избавиться от них будет непросто, так как их позиции очень укреплены."
 living_off_the_land_army_spirit:0 "Жить вне земли"
 living_off_the_land_army_spirit_desc:0 "Хорошо уничтожать врага собственным оружием, но еще лучше уничтожать его собственным оружием."
 rapid_emplacement_army_spirit:0 "Быстрое замещение"
 rapid_emplacement_army_spirit_desc:0 "Вся огневая мощь в мире ничего не значит, когда она находится не в том месте."
 direct_fire_support_army_spirit:0 "Прямая противопожарная поддержка"
 direct_fire_support_army_spirit_desc:0 "Спускайте его до нулевой высоты и атакуйте противника по открытым прицелам!"
 subsidized_contracts_army_spirit:0 "Субсидированные контракты"
 subsidized_contracts_army_spirit_desc:0 "Хотя замена лошади на танк желательна в долгосрочной перспективе, это не может быть сделано ценой национального экономического краха."
 subsidized_contracts_no_lar_army_spirit:0 "$subsidized_contracts_army_spirit$"
 subsidized_contracts_no_lar_army_spirit_desc:0 "$subsidized_contracts_army_spirit_desc$"
 all_arms_at_defense_army_spirit:0 "Всеоружие противотанковой обороны"
 all_arms_at_defense_army_spirit_desc:0 "Бронированные прорывы могут произойти в любое время и в любом месте. Бог войны помогает тем, кто помогает себе сам."
 spirit_of_defiance_army_spirit:0 "Дух неповиновения"
 spirit_of_defiance_army_spirit_desc:0 "Народ не может быть побежден до тех пор, пока он не признает, что он побеждён."
 proxy_wars_army_spirit:0 "Специалист по интервенциям"
 proxy_wars_army_spirit_desc:0 "Враг моего врага - мой друг."
 naval_tripwire_navy_spirit:0 "Морской Трипвайр"
 naval_tripwire_navy_spirit_desc:0 "Мы не можем полностью остановить противника от приближения к нашим берегам, но мы можем сделать его кровавым и дорогим для него."
 ship_to_shore_navy_spirit:0 "Корабль для тренировки"
 ship_to_shore_navy_spirit_desc:0 "Ни одна наземная артиллерия не может рассчитывать на то, что ее огневая мощь будет соответствовать десяткам тысяч тонн морской стали."
 scouting_force_navy_spirit:0 "Скаутская сила"
 scouting_force_navy_spirit_desc:0 "Море огромно. Победа в сражении обычно идет на сторону, которая первым обнаруживает и решительно наносит удар по другому."
 fleet_defense_navy_spirit:0 "Оборона флота"
 fleet_defense_navy_spirit_desc:0 "Боевое воздушное патрулирование и легкие корабли существуют для того, чтобы наши тяжелые нападающие могли выполнять свою работу без грубых помех."
 fleet_interoperability_navy_spirit:0 "Взаимодействие флота"
 fleet_interoperability_navy_spirit_desc:0 "Быстрое пополнение логистических запасов и эффективный контроль повреждений не выигрывают сражения самостоятельно, но они сохраняют оружие победы."
 rapid_concentration_navy_spirit:0 "Быстрая концентрация"
 rapid_concentration_navy_spirit_desc:0 "Быстро сходитесь на врага, как рой саранчи, стреляя из каждого имеющегося в вашем распоряжении оружия: самый быстрый путь к победе."
 aa_curtain_navy_spirit:0 "Зенитный занавес"
 aa_curtain_navy_spirit_desc:0 "Как древняя щитовая стена, каждый корабль в боевом флоте несет ответственность не только за свою собственную оборону, но и за помощь своему соседу."
 stay_at_your_posts_navy_spirit:0 "Оставайтесь на своих постах"
 stay_at_your_posts_navy_spirit_desc:0 "Пока одна опора поворачивается, а одна пушка остается над ватерлинией, мы все еще в борьбе."
 selective_engagement_navy_spirit:0 "Селективная вовлеченность"
 selective_engagement_navy_spirit_desc:0 "Дурак стоит на месте перед превосходящим врагом и позволяет себя уничтожить. Сокращение боев, которые вы не можете выиграть."
 sea_lane_denial_navy_spirit:0 "Отрицание морского переулка"
 sea_lane_denial_navy_spirit_desc:0 "Ничто не ест морского ежа, по уважительной причине."
 underdog_mentality_navy_spirit:0 "Менталитет аутсайдеров"
 underdog_mentality_navy_spirit_desc:0 "Если поначалу у вас не получится, торпеда снова."
 cult_of_heroism_army_spirit:0 "Культ героизма"
 cult_of_heroism_army_spirit_desc:0 "На протяжении всей истории и до наших дней солдаты и граждане одинаково чтят жертвы своих товарищей."
