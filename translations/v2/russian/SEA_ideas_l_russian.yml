 idea_CHI_production_efforts:0 "Национальные производственные усилия"
 idea_CHI_central_government_integration_pressure:0 "Интеграционное давление центрального правительства"
 idea_CHI_central_government_integration_pressure_desc:0 "Центральное правительство оказывает давление на наше руководство, чтобы оно полностью интегрировалось в его иерархию, фактически отказавшись от всей руководящей власти."
 idea_CHI_ban_immoral_entertainment:0 "Запрещенные аморальные развлечения"
 idea_CHI_expropriate_industrialists:0 "Экспроприированные промышленники"
 idea_CHI_opposition_censured:0 "Оппозиция застрахована"
 idea_CHI_sympathetic_judges:0 "Центральное правительство назначило сочувствующих судей"
 idea_CHI_rooting_out_hardliners:0 "Устранить сторонников жёсткой линии"
 idea_CHI_stabilized_government:0 "Стабилизированное правительство"
