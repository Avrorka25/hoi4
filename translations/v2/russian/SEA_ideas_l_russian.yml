 CHI_infiltrated_state_3:0 "Местные укрепленные главы"
 CHI_three_princpals_idea:0 "Три принципа народа"
 CHI_three_princpals_idea_desc:0 "Основатель республики, доктор. Сунь Ят-Сен установил три фундаментальных принципа, которые должны формировать его: Минзу, Минцюань и Миншэн — национализм, демократия и социальное обеспечение. Мы должны стремиться к реализации принципов нашего правительства."
 CHI_three_princpals_reorganized_idea:0 "Три принципа государства"
 CHI_three_princpals_reorganized_idea_desc:0 "Основатель республики, доктор. Сунь Ят-Сен установил три фундаментальных принципа, которые должны формировать его: Минзу, Минцюань и Миншэн — национализм, демократия и социальное обеспечение. Хотя мы и не полностью придерживаемся нашего подхода к тридемизму, тем не менее мы должны стремиться использовать его в своих интересах."
