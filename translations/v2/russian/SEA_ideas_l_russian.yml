 JAP_imperial_navy_dm:0 "Имперский флот"
 JAP_imperial_navy_dm_desc:0 "IJN был сформирован в 1868 году в начале Реставрации Мэйдзи и уже к 1920 году стал третьим по величине флотом в мире. Теперь наш могучий флот быстро расширяется, чтобы наша нация могла противостоять грядущим временам."
 JAP_modify_imperial_navy_modifier_tt:0 "изменять §Y$JAP_imperial_navy_dm$§! посредством:"
 JAP_add_imperial_navy_modifier_tt:0 "Добавить §Y$JAP_imperial_navy_dm$§! которые предоставляют:\n"
 JAP_japanese_navy_dm:0 "Японский флот"
 JAP_japanese_navy_dm_desc:0 "IJN был сформирован в 1868 году в начале Реставрации Мэйдзи и уже к 1920 году стал третьим по величине флотом в мире. Теперь наш могучий флот быстро расширяется, чтобы наша нация могла противостоять грядущим временам."
 JAP_modify_japanese_navy_modifier_tt:0 "изменять §Y$JAP_japanese_navy_dm$§! посредством:"
 JAP_army_and_naval_air_services_dm:0 "Армия и военно-морские воздушные службы"
 JAP_army_and_naval_air_services_dm_desc:0 "В настоящее время наши военно-воздушные силы разделены между Военно-воздушной службой Императорской армии Японии и Военно-воздушными силами Императорского флота Японии, которые разделены как в эксплуатации, производстве, так и в исследованиях и разработках между нашим флотом и армией. Из-за этого она сталкивается с большими логистическими узкими местами, некоторые из которых можно преодолеть только слиянием наших ВВС."
