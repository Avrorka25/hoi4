 PHI_the_great_depression_dynamic_modifier:0 "Великая депрессия"
 PHI_the_great_depression_dynamic_modifier_desc:0 "Великая Депрессия сильно ударила по Соединенным Штатам, и, будучи их предметом, мы не были избавлены от ее финансового разрушения."
