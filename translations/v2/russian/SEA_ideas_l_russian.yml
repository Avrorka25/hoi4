 JAP_first_strike_principle_dm_desc:0 "Пересмотренная политика национальной обороны, принятая в 1936 году, изложила доктрину, в которой мы устанавливаем принцип первого удара и краткосрочную операцию в военном случае как военный способ действий. Подготовка к военной силе в мирное время была так необходима для краткосрочной операции, подчеркиваемой с учетом длительной и тотальной войны. Мы быстро выиграем эту войну, иначе мы не сможем выиграть ее вообще!"
