 CHI_corruption_in_the_administration_desc:0 "Смазанные колеса поворачиваются легче, но это не приравнивается к эффективности. Пары людей обладают непропорциональной властью, которая оказывает влияние на национальное государство."
 CHI_reorganized_administration:0 "Реорганизованная администрация"
 CHI_reorganized_administration_desc:0 "Мы смазали колеса нашей администрации, чтобы они могли более эффективно поворачиваться, устраняя препятствия, которые лежали на нашем пути."
 CHI_switch_administration_modifiers_tt:0 "Улучшить §Y$CHI_corruption_in_the_administration$§! то §Y$CHI_reorganized_administration$§!"
 CHI_illicit_trade:0 "Незаконная торговля"
 CHI_illicit_trade_desc:0 "Подпольные рынки и сети контрабанды подрывают государственную власть и подрывают экономическую стабильность. Усилия по пресечению этой деятельности остаются бессистемными, а влияние незаконной торговли продолжает препятствовать национальному единству и реформам."
 CHI_inefficient_economy:0 "Неэффективная экономика"
 CHI_inefficient_economy_desc:0 "Наша индустриализация зарождается, поскольку предыдущие правительства не поддерживали должный рост. Однако мы можем решить эту проблему с помощью внутренних и внешних мер, наш потенциал поистине безграничн."
 CHI_neglected_countryside:0 "Забытый сельский"
 CHI_neglected_countryside_desc:0 "Десятилетие в Нанкине принесло действительно впечатляющие изменения в наше общество. Однако современность в основном ограничивается городскими районами, а сельская местность игнорируется. Это может привести к созданию основы для радикальных идей."
 CHI_corruption_in_the_armed_forces:0 "Коррупция в Вооруженных Силах"
 CHI_corruption_in_the_armed_forces_desc:0 "Национальная революционная армия вышла из рядов партии и, таким образом, несет тот же багаж, что и партия. Непотизм, взяточничество и растраты широко распространены, и если мы хотим одержать победу, нам придется искоренить их."
 CHI_blue_shirt_society:0 "Блуе Ширт Сокиеты"
 CHI_blue_shirt_society_desc:0 "Общество практики трех народных принципов, или Голубые рубашки, освещает наш особый путь и поразит тех, кто стоит на его пути."
 CHI_ROCAF:0 "Комиссия по авиационным делам"
 CHI_ROCAF_desc:0 "С момента своего создания в последнее десятилетие Комиссия по авиационным делам была организацией, через которую мы будем контролировать наше небо. Несмотря на то, что мы все еще не являемся централизованными военно-воздушными силами, прогресс продолжается, и благодаря упорству мы победим."
 CHI_an_appropriate_design_tt:0 "[GetAppropriateDesign]"
 CHI_appropriate_design_offensive_idea:0 "Наступательный дизайн"
 CHI_appropriate_design_defensive_idea:0 "Оборонительный дизайн"
 CHI_protracted_warfare_idea:0 "Затянувшаяся война"
 CHI_protracted_warfare_idea_desc:0 "Некоторые армии считают, что быстрый удар побеждает во всех войнах, а другие понимают, что отрицание этого означает, что их воля рушится. Продержавшись дольше в оборонительной позиции, любой захватчик будет отбит."
 CHI_decisive_battle_idea:0 "Решительная битва"
 CHI_decisive_battle_idea_desc:0 "Нет ни одного случая, когда страна выигрывала бы от длительной войны, и поэтому нам нужно быстро победить наших врагов, найдя, куда мы положим наши наступательные усилия. Быстрый удар должен быть, а сильный - падать."
 CHI_gung_ho_idea:0 "Движение Гун Хо"
 CHI_gung_ho_idea_desc:0 "Один из наших ресурсов — это люди, которые организованы в небольшие промышленные кооперативы. Эта низовая организация даст нам экономическое преимущество в нашем нынешнем конфликте."
 CHI_ROCN:0 "Военно-морской флот Китайской Республики"
 CHI_ROCN_desc:0 "С его традицией, проистекающей из всего пути назад в Цин, Центральный флот, перестроенный с Гоминьданом после Северной экспедиции, теперь позволит нам проецировать нашу энергию с континента."
