 FIN_r56rp_reach_out_to_the_monarchists:0 "Обратиться к монархистам"
 FIN_r56rp_reach_out_to_the_monarchists_desc:0 "Идея монархии в Финляндии может показаться кому-то странной, но на короткое время она у нас была. Несмотря на то, что мы уже некоторое время являемся республикой, многие стремятся к стабильности, которую может обеспечить монарх, мы должны обратиться к этим людям."
 FIN_r56rp_compromise_with_the_conservatives:0 "компромисс с консерваторами"
 FIN_r56rp_compromise_with_the_conservatives_desc:0 "Консерваторы были жизненно важны в нашей борьбе против красных после окончания Великой войны, теперь мы должны обратиться к ним еще раз, но не для борьбы с коммунистами, а чтобы помочь нам принести стабильность в Финляндию."
 FIN_r56rp_rally_public_support:0 "Ралли общественной поддержки"
 FIN_r56rp_rally_public_support_desc:0 "Единственное, что нам нужно сделать, чтобы установить монархию в Финляндии, — это собрать сердца и умы людей. Финансируя общественные работы и другие проекты для населения во имя монархии, мы поможем обеспечить их лояльность к новой короне."
 FIN_r56rp_form_a_monarchist_party:0 "Формирование монархической партии"
 FIN_r56rp_form_a_monarchist_party_desc:0 "Когда часть общественности поддерживает идею нового монарха, а консерваторы собрались на наше дело, мы можем сформировать новую политическую партию, которую вскоре возглавит наш новый монарх."
 FIN_r56rp_a_swedish_candidate:0 "Шведский кандидат"
 FIN_r56rp_a_swedish_candidate_desc:0 "Не секрет, что у нас долгая и легендарная история со шведами на западе, и в то время как мы находились под властью царя в течение многих десятилетий, большая часть нашего населения говорит по-шведски в качестве второго языка, что облегчает шведским кандидатам завоевание популярности."
 FIN_r56rp_the_german_heir:0 "Немецкий наследник"
 FIN_r56rp_the_german_heir_desc:0 "В течение короткого периода времени у нас был немецкий принц в качестве короля Финляндии, затем пришла Красная революция и идея монархии упала на обочину. Теперь, когда избранный король больше не может ходить по этой земле, его сын технически является наследником финского престола, если мы восстановим его."
 FIN_r56rp_a_junior_partner:0 "Младший партнер"
 FIN_r56rp_a_junior_partner_desc:0 "Теперь, когда на престоле стоит шведский король, мы должны принять во внимание, что многие страны могут не считать его законным. Таким образом, подчиняясь шведам в качестве младшего партнера, мы можем получить легитимность как королевство вместе с ними."
 FIN_r56rp_the_two_brothers:0 "Два брата"
 FIN_r56rp_the_two_brothers_desc:0 "С королем Бертилем Первым на троне Финляндии мы должны обратиться к его родине, Королевству Швеции, и помочь укрепить союз между нашими двумя народами. Шведы уже доказали, что готовы быть союзниками в прошлом, и теперь пришло время для альянса."
 FIN_r56rp_strengthen_crown_ties:0 "Укрепить коронные узы"
 FIN_r56rp_strengthen_crown_ties_desc:0 "С нашим новым монархом на троне мы должны обратиться к их семье и помочь укрепить связи между нашими двумя коронами."
 FIN_r56rp_generalstab_reform:0 "Реформа Генерал-штаба"
 FIN_r56rp_generalstab_reform_desc:0 "Немецкие исследования по Бевегунскригу после Великой войны, несомненно, оказались бы чрезвычайно полезными для нас. Подчеркивая наши новые монархические связи наряду с угрозой общего врага, мы должны попросить их помочь реформировать наши вооруженные силы в нечто подобное тому, с чем они сейчас экспериментируют."
 FIN_r56rp_finno_swedish_war_games:0 "Финно-шведские военные игры"
 FIN_r56rp_finno_swedish_war_games_desc:0 "Поскольку наши две страны теперь связаны в союз, мы должны стремиться провести некоторые совместные учения, чтобы помочь наращивать координацию между нашими вооруженными силами, если нам придется развернуть наши войска вместе."
 FIN_r56rp_industrial_support:0 "Промышленная поддержка"
 FIN_r56rp_industrial_support_desc:0 "С укреплением связей между нашими коронами мы должны обратиться за помощью в ускорении развития нашей промышленности в остальной Европе, с их помощью мы сможем получить импульс, необходимый для дальнейшего продвижения нашей экономики вперед."
 FIN_r56rp_military_support:0 "Поддержка военных"
 FIN_r56rp_military_support_desc:0 "Благодаря улучшению отношений между нашими двумя коронами, мы должны обратиться к нашим союзникам и попросить помощи в строительстве некоторых новых оружейных производств, чтобы мы могли помочь нашим братьям, если война придет к нашим границам."
 FIN_r56rp_royal_institute_of_technology:0 "Королевский технологический институт"
 FIN_r56rp_royal_institute_of_technology_desc:0 "С установлением монархии наш следующий шаг — поощрить наших людей стремиться быть лучшими. Создав Королевский технологический институт, мы можем направить лучшие и самые яркие умы Финляндии, чтобы помочь обеспечить наше место в мире."
 FIN_r56rp_finnish_auftagstaktik:0 "Финский Auftragstaktik"
 FIN_r56rp_finnish_auftagstaktik_desc:0 "Идея Auftragstaktik оказалась вполне способной во время Великой войны, это то, что мы должны попросить немцев помочь нам реализовать в нашем собственном армейском корпусе."
 FIN_r56rp_finno_swedish_naval_cooperation:0 "Финно-шведское морское сотрудничество"
 FIN_r56rp_finno_swedish_naval_cooperation_desc:0 "Если и есть что-то, что доказала Великая война, так это то, что выход к морю будет иметь решающее значение для выживания. К счастью для нас, шведы сделали значительный скачок в военно-морских исследованиях по сравнению с нами и, сотрудничая с ними, мы сможем создать новый и надлежащий Королевский флот, действительно подходящий для короля."
 FIN_r56rp_lockdown_the_baltic:0 "Блокировка Балтийского"
 FIN_r56rp_lockdown_the_baltic_desc:0 "Ни для кого не секрет, что перед нами на горизонте маячит война, и чтобы наши берега не были сметены десантными кораблями, как это сделали англичане в Анатолии, мы должны работать со шведами, чтобы помочь блокировать Балтийское море в случае новой войны."
 FIN_r56rp_prepare_the_russian_border:0 "Подготовить российскую границу"
 FIN_r56rp_prepare_the_russian_border_desc:0 "Мы хорошо знаем, что русские на нашем Востоке жаждут наших земель, и все более вероятно, что мы скоро будем втянуты в войну с ними. Таким образом, мы должны подготовиться и обеспечить, чтобы сила наших границ отразила любое российское вторжение."
 FIN_r56rp_invite_german_military_staff:0 "Пригласить германский военный штаб"
 FIN_r56rp_invite_german_military_staff_desc:0 "Поскольку структура нашей армии уже становится все более и более похожей на структуру германской армии, имеет смысл привлечь к ней только тех, кто действительно понимает ее. Мы надеемся, что, отправив приглашение немецкому верховному командованию, мы сможем получить надлежащую поддержку в перестройке наших вооруженных сил."
 FIN_r56rp_towards_a_greater_finland:0 "На пути к Великой Финляндии"
 FIN_r56rp_towards_a_greater_finland_desc:0 "Идея Великой Финляндии циркулировала среди населения в течение многих лет, особенно после Гражданской войны в России. Мы должны подготовиться к потенциальному вторжению в Россию, чтобы объединить все финские земли."
 FIN_r56rp_the_finnish_bear_trap:0 "Финская ловушка для медведя"
 FIN_r56rp_the_finnish_bear_trap_desc:0 "Никто не знает русских лучше, чем мы, и никто не знает финских земель так, как мы. Используя оба этих метода, мы сможем создать ловушку для русского медведя, которая навсегда искалечит медведя."
 FIN_r56rp_a_call_to_arms:0 "Призыв к оружию"
 FIN_r56rp_a_call_to_arms_desc:0 "Чтобы нанести удар по русским, нам нужен каждый боеспособный человек, который будет служить в наших вооруженных силах. Поэтому мы пошлем призыв к оружию каждому человеку, который готов отстаивать идею Великой Финляндии, чтобы заручиться поддержкой сейчас и бороться за великое дело!"
 FIN_r56rp_strike_the_russian_bear:0 "Забастовка [SOV.GetAdjective] Медведь"
 FIN_r56rp_strike_the_russian_bear_desc:0 "Настало время, мы нанесем удар по русским и заставим их истекать кровью."
 FIN_r56rp_greater_finland_achieved:0 "Большая Финляндия достигла своего"
 FIN_r56rp_greater_finland_achieved_desc:0 "Через кровь, пот и слезы мы достигли невозможного. Земли Великой Финляндии теперь под нашим контролем, и теперь нам нужно обезопасить наши новые земли."
 FIN_r56rp_an_ally_not_a_subject:0 "Союзник, а не субъект"
 FIN_r56rp_an_ally_not_a_subject_desc:0 "Хотя мы многому научились у нашего Повелителя, пришло время разорвать связь, хотя нам не нужно прекращать наш союз. Пришло время выйти из тени и встать высоко."
 FIN_r56rp_industrialize_our_new_lands:0 "Индустриализация новых земель"
 FIN_r56rp_industrialize_our_new_lands_desc:0 "Земли Карелии и Мурманска, хотя и обильные, сильно недоразвиты, мы должны инвестировать в эти земли, чтобы они были легче для нас защищать, а также дать им знать, что они являются жизненно важной частью нашего Королевства."
 FIN_r56rp_shorter_border_longer_peace:0 "Более короткая граница, более длительный мир"
 FIN_r56rp_shorter_border_longer_peace_desc:0 "Мы должны воплощать идею более короткой границы, более длительного мира, с нашими новыми границами, которые мы разделяем с русскими, это, надеюсь, будет действовать как естественный сдерживающий фактор против любой будущей агрессии со стороны них."
 FIN_r56rp_return_of_the_ingrian_finns:0 "Возвращение финнов из Ингрии"
 FIN_r56rp_return_of_the_ingrian_finns_desc:0 "В Ингрии проживает большое количество финнов, и мы должны позвонить им и сказать, чтобы они вернулись в Финляндию. Их дом больше не находится под угрозой со стороны русских, и они приветствуются здесь."
 FIN_r56rp_lay_claim_to_ingria:0 "Утверждать претензии на Ingria"
 FIN_r56rp_lay_claim_to_ingria_desc:0 "Большое финское население в Ингерманландии — это последняя часть, которую мы должны назвать Великой Финляндией, и русские знают, что мы придем за ними."
 FIN_r56rp_develop_murmansk_ship_building:0 "Развивать [213.GetName] Судостроение"
 FIN_r56rp_develop_murmansk_ship_building_desc:0 "Путем дальнейшего развития [213.GetName] Мы сможем создать новый судостроительный объект, который не так легко перекрыть через Датские проливы, хотя мы не сможем проплывать туда большие корабли в течение зимы, конвои и подводные лодки будут иметь больший доступ к Атлантике."
 FIN_r56rp_railway_expansion_project:0 "Проект расширения железных дорог"
 FIN_r56rp_railway_expansion_project_desc:0 "С нашими новыми землями мы должны соединить их с уже существующими железнодорожными сетями, позволяя товарам и персонеллам легко путешествовать по всей нашей стране, а не только по старым частям нашего Королевства."
 FIN_r56rp_independence_war:0 "Война за независимость"
 FIN_r56rp_independence_war_desc:0 "Мы надеялись, что до этого не дойдет. Но, похоже, наши Повелители забыли о наших вкладах и думают, что мы всего лишь пешки. Поэтому мы будем бороться за нашу независимость, и мы сделаем их кровоточащими."
 FIN_r56rp_strengthen_our_alliance:0 "Укрепить наш альянс"
 FIN_r56rp_strengthen_our_alliance_desc:0 "Теперь, с нашей вновь обретенной независимостью, мы снова можем смотреть вовне, не привязанные к чужой короне. Но это не означает, что мы можем отказаться от наших союзников, работая вместе с ними, мы сможем еще больше укрепить наш союз и создать действительно нерушимую связь между двумя странами."
 FIN_r56rp_appeal_to_moscow:0 "Обращение в Москву"
 FIN_r56rp_appeal_to_moscow_desc:0 "Нам ясно, что потребность в правильной революции сейчас сильнее, чем когда-либо. Однако, если мы хотим добиться успеха, нам нужно обратиться к московскому режиму, чтобы они могли оказать необходимую поддержку нашей революции."
 FIN_r56rp_the_second_finnish_revolution:0 "Вторая финская революция"
 FIN_r56rp_the_second_finnish_revolution_desc:0 "Настало время, на этот раз белые дезорганизованы и неподготовлены, и нам нужно нанести удар сейчас, прежде чем у них будет возможность реорганизоваться, чтобы мы не оказались застреленными расстрельными отрядами."
 FIN_r56rp_root_out_counter_revolutionaries:0 "Корень вне контрреволюционеров"
 FIN_r56rp_root_out_counter_revolutionaries_desc:0 "Теперь, когда революция прошла успешно, нам нужно искоренить тех, кто мог бы попытаться дестабилизировать нас. Соберите всех крупных политиков старого режима, соберите старую гвардию и расстреляйте их."
 FIN_r56rp_stabilize_the_new_regime:0 "Стабилизировать новый режим"
 FIN_r56rp_stabilize_the_new_regime_desc:0 "Первым шагом к обеспечению надлежащей безопасности Революции в Финляндии является стабилизация и укрепление позиций нового правительства. Запустив двухлетнюю программу, мы сможем искоренить тех, кто скрывается там, где они либо увидят глупость своих путей, либо предстанут перед судом."
 FIN_r56rp_establishment_of_the_fssr:0 "Создание ФССР"
 FIN_r56rp_establishment_of_the_fssr_desc:0 "Успехом нашей революции мы обязаны Советскому Союзу, а потому объявим о создании Финляндской Советской Социалистической Республики. Вместе с Советами революция не может провалиться."
 FIN_r56rp_found_the_finnish_red_army:0 "Найдена финская Красная армия"
 FIN_r56rp_found_the_finnish_red_army_desc:0 "Чтобы помочь распространить революцию за пределы Восточной Европы, мы должны создать революционную армию, которая сможет поддержать нормальные финские вооруженные силы и выступить в качестве авангарда революции."
 FIN_r56rp_commissariat_of_finnish_affairs:0 "Комиссариат по делам Финляндии"
 FIN_r56rp_commissariat_of_finnish_affairs_desc:0 "В условиях безопасности правительства нам предстоит проделать большую работу по обеспечению процветания в наших границах. Поэтому Комиссариат по делам Финляндии будет учреждаться в качестве главного политического центра при принятии всех решений, касающихся финских вопросов."
 FIN_r56rp_pc_of_heavy_industry:0 "PC тяжелой промышленности"
 FIN_r56rp_pc_of_heavy_industry_desc:0 "В настоящее время в Финляндии отсутствует знание тяжелой промышленности, и мы должны это ратифицировать. Создав ПК тяжелой промышленности, мы сможем черпать знания у Советов и создать новую экономику, которая сможет держать колеса революции в движении."
 FIN_r56rp_socialist_universities:0 "Социалистические университеты"
 FIN_r56rp_socialist_universities_desc:0 "Поскольку умы молодежи больше не скованы капиталистами и фашистами, мы можем обеспечить им доступ к образованию и знаниям, в которых они нуждаются. Вместе с этими молодыми умами мы сможем продвинуть нашу нацию вперед в будущее."
 FIN_r56rp_establish_the_finnish_guard_corps:0 "Создание финского гвардейского корпуса"
 FIN_r56rp_establish_the_finnish_guard_corps_desc:0 "С созданием финской Красной Армии мы обеспечили свою безопасность, но теперь нам нужно обеспечить возможность продвигать революцию вперед, помогать ей распространяться против врагов революции."
 FIN_r56rp_remodel_the_constitution:0 "Реконструкция Конституции"
 FIN_r56rp_remodel_the_constitution_desc:0 "Первым делом после создания Финляндской социалистической республики необходимо перестроить нашу конституцию таким образом, чтобы она более точно соответствовала Революции и Советскому Союзу."
 FIN_r56rp_propose_karelo_finnish_ssr:0 "Предложить Карело-Финскую ССР"
 FIN_r56rp_propose_karelo_finnish_ssr_desc:0 "К нашему востоку лежали земли Карелии, карелы и мы, финны, давно уже братья и пока они в хороших руках, нам следует выдвинуть идею формирования Карело-Финляндской ССР режиму в Москве."
 FIN_r56rp_introduce_collectivization:0 "Внедрить коллективизацию"
 FIN_r56rp_introduce_collectivization_desc:0 "Внедрение коллективизации оказалось большим благом для Советского Союза, их промышленная продукция с момента ее реализации взлетела до небес и говорит нам, что мы должны реализовать ее сами."
 FIN_r56rp_into_scandinavia:0 "В Скандинавию"
 FIN_r56rp_into_scandinavia_desc:0 "Поскольку наша страна стабилизировалась, наши границы защищались, а экономика укреплялась, мы должны смотреть на распространение революции в Скандинавии. Шведы, датчане и норвежцы утверждают, что они прорабы, но все же подавляют их. Мы должны положить конец этой шараде."
 FIN_r56rp_develop_sweden:0 "Развивается Швеция"
 FIN_r56rp_develop_sweden_desc:0 "С усилением нашего контроля над Швецией мы можем помочь стабилизировать страну и подготовить ее к нашей следующей цели."
 FIN_r56rp_develop_norway:0 "Развивается Норвегия"
 FIN_r56rp_develop_norway_desc:0 "Теперь, когда мы граничим с Атлантикой, мы должны развивать норвежские земли, чтобы убедиться, что они готовы к грядущему сдвигу в политике и что они готовы защищать Революцию, если враг попытается выйти на берег."
 FIN_r56rp_develop_denmark:0 "Развивающаяся Дания"
 FIN_r56rp_develop_denmark_desc:0 "Дания является воротами Балтийского моря, и поэтому мы должны еще больше увеличить их промышленный потенциал, чтобы они могли противостоять любым угрозам против Революции."
 FIN_r56rp_form_the_nssf:0 "Формирование N.S.S.F"
 FIN_r56rp_form_the_nssf_desc:0 "Идея объединенного Северного государства всегда была несбыточной мечтой, но здесь мы находимся на пороге достижения чего-то великого. Объединив наши народы в одно целое, мы создадим Советскую Социалистическую Федерацию Северных Стран и станем революционным маяком на Севере."
 sweden_auth_r56rp.1.a:0 "Вместо аннексии, как насчет личного союза?"
 sweden_auth.14.t:0 "[FROM.GetNameDefCap] принимает предложение"
 sweden_auth.14.d:0 "Хотя мы бы предпочли остаться независимой нацией, это, вероятно, лучший результат, чтобы избежать необходимости вести кровавую войну. Ведется подготовка к коронации принца Бертиля в качестве короля Финляндии Бертила I, хотя, если нам повезет, у нас может быть возможность в будущем отделиться от этой принудительной связи."
 sweden_auth.14.a:0 "Он бьет в кровавой войне"
 FIN_r56rp_monarchist.1.t:0 "Сделки с консерваторами"
 FIN_r56rp_monarchist.1.d:0 "Когда Великая война закончилась на Восточном фронте, Финляндия была на короткое время монархией, под домом Гессена. Однако следующая гражданская война, в которой красные и белые боролись за контроль над страной, и с поражением Германии идея немецкого монарха на троне Финляндии больше не была жизнеспособным вариантом. Так была создана республика, а идеи Финляндского королевства были убраны вместе с кайзером.\n\nОднако времена меняются, и нынешнее правительство не имеет поддержки со стороны людей, которых оно должно. Обратившись к консервативным элементам в стране, мы должны иметь возможность заключить с ними сделку и получить их поддержку."
 FIN_r56rp_monarchist.1.a:0 "Ограничивая полномочия короны, мы должны быть в состоянии завоевать их."
 FIN_r56rp_monarchist.1.b:0 "Какова работа короля, если он не правит?"
 FIN_r56rp_monarchist.2.t:0 "[FROM.GetNameDefCap] Предлагает политический союз"
 FIN_r56rp_monarchist.2.d:0 "С этим [FROM.GetNameDef] короновал шведского принца [FROM.GetLeader]Теперь они предложили партнерство между нашими двумя странами, чтобы помочь обеспечить стабильность здесь, в Северной Европе. Союз будет смотреть [FROM.GetNameDef] Они берут на себя более юношескую роль, сохраняя при этом свою армию, флот и ВВС.\n\nХотя политический союз между нашими двумя народами, безусловно, будет полезным, он также может рассматриваться как захват власти. [SOV.GetAdjective]s, и это может спровоцировать их на действия против нас."
 FIN_r56rp_monarchist.2.a:0 "Вместе мы сильнее"
 FIN_r56rp_monarchist.2.b:0 "Благородное дело, но, увы, мы не будем"
 FIN_r56rp_monarchist.3.t:0 "[FROM.GetNameDefCap] Согласен с Союзом"
 FIN_r56rp_monarchist.3.d:0 "[FROM.GetNameDefCap] согласилась на наше предложение, с этим мы сможем больше сосредоточиться на наших внутренних делах до нашего неизбежного столкновения с Россией. [SOV.GetAdjective]s."
 FIN_r56rp_monarchist.3.a:0 "Потрясающе, вместе мы сильнее!"
 FIN_r56rp_monarchist.4.t:0 "Государство [FROM.GetNameDefCap] отклоняет предложение"
 FIN_r56rp_monarchist.4.d:0 "[FROM.GetNameDefCap] Возможно, к счастью, мы отклонили наше предложение о политическом союзе между нашими двумя государствами. Это означает, что мы не можем рассчитывать на [SWE.GetAdjective]s должен быть [SOV.GetAdjective]Попробуй приехать к нам еще раз."
 FIN_r56rp_monarchist.4.a:0 "Мы должны поддерживать с ними хорошие отношения."
 FIN_r56rp_monarchist.5.t:0 "Ралли общественной поддержки"
 FIN_r56rp_monarchist.5.d:0 "Самым большим препятствием, с которым мы столкнемся внутри страны, будет общественная поддержка. Мы должны еще раз продать народу идею монархии, которая не похожа на бывшую Российскую империю, а выкована сердцем финского народа в ее основе.\n\nС умными инвестициями и тщательным планированием мы сможем воплотить идею монарха как главы Финляндии в сердцах и умах всех."
 FIN_r56rp_monarchist.5.a:0 "Для короля и страны"
 FIN_r56rp_independence.1.t:0 "[FROM.GetNameDefCap] Гарантии Альянса пост-независимости"
 FIN_r56rp_independence.1.d:0 "Сегодня посланник из [FROM.GetNameDef] прибывший в [ROOT.GetCapital] Обсудить вопрос независимости. Посланник приложил большие усилия, чтобы обеспечить нам [FROM.GetNameDef]лояльность к нашему альянсу и то, что они не будут стремиться дистанцироваться от нас, если они вернут свою независимость."
 FIN_r56rp_independence.1.a:0 "Хмм, очень интересно"
 FIN_r56rp_independence.2.t:0 "[FROM.GetNameDefCap] Абсолютный нейтралитет после независимости"
 FIN_r56rp_independence.2.d:0 "Сегодня посланник из [FROM.GetNameDef] прибывший в [ROOT.GetCapital] Обсудить вопрос независимости. Посол приложил большие усилия для обеспечения того, чтобы [FROM.GetNameDef] Получив независимость, они займут позицию абсолютного нейтралитета, фактически срубая на фронте на Восток, если мы в конечном итоге войдем в войну с Западом. [SOV.GetAdjective]s."
 FIN_r56rp_independence.2.a:0 "Довольно интригующе"
 FIN_r56rp_independence.3.t:0 "[FROM.GetNameDefCap] Требует независимости"
 FIN_r56rp_independence.3.d:0 "Сегодня [FIN.GetLeader] встретился с [ROOT.GetLeader] в частном порядке, где он выразил побуждение [FIN.GetNameDef] Стать независимым. Когда разговор между двумя лидерами, казалось, зашел в тупик, [FIN.GetLeader] Они решили уйти, но перед отъездом предъявили ультиматум. Либо уйти [FIN.GetNameDef] Или последствия могут быть ужасными."
 FIN_r56rp_independence.3.a:0 "Кем он себя возомнил?"
 FIN_r56rp_independence.3.b:0 "Это того не стоит."
 FIN_r56rp_independence.4.t:0 "[FROM.GetNameDefCap] Лобби за независимость"
 FIN_r56rp_independence.4.d:0 "Сегодня [FIN.GetLeader] встретился с [ROOT.GetLeader] в частном порядке, где он выразил побуждение [FIN.GetNameDef] Стать независимым. По мере того, как встреча двух лидеров затягивалась, казалось, что из нее исходил намек на оптимизм. [FIN.GetLeader]И когда он ушел, то пожелал [ROOT.GetLeader] Мы надеемся на благополучное будущее между нашими двумя странами."
 FIN_r56rp_independence.4.a:0 "Хорошо, они будут иметь это."
 FIN_r56rp_independence.4.b:0 "Они более полезны, чем наша тема."
 FIN_r56rp_independence.5.t:0 "Государство [FROM.GetNameDefCap] предоставляет нам независимость"
 FIN_r56rp_independence.5.d:0 "Сегодня наш посланник [FROM.GetCapital] И принес с собою радостную весть, [FROM.GetNameDef] Мы согласились с нашей просьбой, и нам была предоставлена независимость, мы снова являемся нашей собственной нацией, и люди празднуют это радостное событие. Хотя в настоящее время речь идет о том, что мы снова несем ответственность за нашу собственную внешнюю политику и нам придется иметь дело с тем, что было согласовано между нами и нашими бывшими повелителями."
 FIN_r56rp_independence.5.a:0 "Отличные новости!"
 FIN_r56rp_independence.6.t:0 "[FROM.GetNameDefCap] Отрицает нашу независимость"
 FIN_r56rp_independence.6.d:0 "Сегодня наш посланник [FROM.GetCapital] С ними вернулись неприятные новости.[FROM.GetNameDefCap] Мы отказались от нашей просьбы о независимости, и нам говорят помнить наше место в более крупной схеме в Европе.\n\nЭти известия не очень хорошо распространились среди нашего народа, и люди призывают к восстанию против наших Повелителей."
 FIN_r56rp_independence.6.a:0 "Ну, тогда у нас есть один путь вперед."
 FIN_r56rp_ssr.1.t:0 "[FROM.GetNameDefCap] Предлагается объединение с Карелией"
 FIN_r56rp_ssr.1.d:0 "[FROM.GetLeader] прибывший в [ROOT.GetCapital] с предложением об объединении [FROM.GetNameDef] С землями на восток, подчеркивая тот факт, что карельский народ имеет много общего со своими финскими братьями. Хотя мы потеряем потенциальных работников, это поможет поддержать нас. [FROM.GetNameDef] И обеспечить их лояльность."
 FIN_r56rp_ssr.1.a:0 "Новый концепт, конечно."
 FIN_r56rp_ssr.1.b:0 "Мы сохраним нашу землю"
 FIN_r56rp_ssr.2.t:0 "[FROM.GetNameDefCap] Объединяет нас с Карелией"
 FIN_r56rp_ssr.2.d:0 "[FROM.GetLeader] Мы согласились с нашим предложением объединиться. [ROOT.GetNameDef] Карельские земли на нашем востоке. Местной администрации было поручено теперь отчитываться перед [ROOT.GetCapital] вместо того, чтобы [FROM.GetCapital] Любые будущие запросы."
 FIN_r56rp_ssr.2.a:0 "Маревлоус!"
 FIN_r56rp_ssr.3.t:0 "[FROM.GetNameDefCap] Сохраняется контроль над Карелией"
 FIN_r56rp_ssr.3.d:0 "[FROM.GetLeader] К сожалению, мы отклонили нашу просьбу о предоставлении земель на востоке. Ссылаясь на то, что объем документов, которые должны быть сделаны, не будет стоить окончательного результата."
 FIN_r56rp_ssr.3.a:0 "Прискорбно."
 FIN_r56rp_ssr.4.t:0 "[FROM.GetNameDefCap] Предлагает совместное вторжение [SWE.GetNameDef]"
 FIN_r56rp_ssr.4.d:0 "Мы получили сообщение от [FROM.GetLeader] Они стремятся распространить революцию дальше и за пределы своих границ. Они стремятся распространить его на свои северные страны, и этот план предполагает совместное вторжение в Северные страны. [SWE.GetNameDef]Это поставило бы нас под угрозу, разозлив остальную Европу, но революция не должна быть остановлена только из-за того, что могут подумать угнетающие капиталисты."
 FIN_r56rp_ssr.4.a:0 "Разумное предложение"
 FIN_r56rp_ssr.4.b:0 "Наше внимание необходимо в другом месте."
 FIN_r56rp_ssr.5.t:0 "[FROM.GetNameDefCap] Согласен с планом вторжения"
 FIN_r56rp_ssr.5.d:0 "Приветствую. [FIN.GetLeader]Мы получили сообщение от [FROM.GetLeader]Наш план вторжения [SWE.GetNameDef] Он был одобрен и [FROM.GetAdjective] Армия готовится к началу вторжения."
 FIN_r56rp_ssr.5.a:0 "Подготовьте войска!"
 FIN_r56rp_ssr.6.t:0 "[FROM.GetNameDefCap] Сокращение предлагаемого плана"
 FIN_r56rp_ssr.6.d:0 ""
 FIN_r56rp_ssr.6.a:0 "Мы будем ждать своего времени"
 FIN_r56rp_ssr.7.t:0 "[FROM.GetNameDefCap] Предлагает совместное вторжение [NOR.GetNameDef]"
 FIN_r56rp_ssr.7.d:0 "Мы получили сообщение от [FROM.GetLeader] Они стремятся распространить революцию дальше и за пределы своих границ. Они стремятся распространить его на свои северные страны, и этот план предполагает совместное вторжение в Северные страны. [NOR.GetNameDef]Это поставило бы нас под угрозу, разозлив остальную Европу, но революция не должна быть остановлена только из-за того, что могут подумать угнетающие капиталисты."
 FIN_r56rp_ssr.7.a:0 "Разумное предложение"
 FIN_r56rp_ssr.7.b:0 "Наше внимание необходимо в другом месте."
 FIN_r56rp_ssr.8.t:0 "[FROM.GetNameDefCap] Согласен с планом вторжения"
 FIN_r56rp_ssr.8.d:0 "Приветствую. [FIN.GetLeader]Мы получили сообщение от [FROM.GetLeader]Наш план вторжения [NOR.GetNameDef] Он был одобрен и [FROM.GetAdjective] Армия готовится к началу вторжения."
 FIN_r56rp_ssr.8.a:0 "Подготовьте войска!"
