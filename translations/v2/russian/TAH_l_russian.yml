l_russian:
 TAH_generic_industrial_concern:0 "Сосьете Шимик дю Хром"
 TAH_mangoes:0 "Манго"
 TAH_mangoes_desc:0 "Возможно, преступная жизнь в конце концов того не стоила. Кто же не любит манго?"
 TAH_god_damn_plan:0 "План Датча выполнен..."
 tahiti.plan.1.t:0 "Прибывает загадочный незнакомец"
 tahiti.plan.1.d:0 "Небольшая, но довольно странная группа людей прибыла на наши берега на пароходе из неизвестного места в Соединенных Штатах. Их лидер, хорошо одетый мужчина, уже очаровал свой путь в пользу. [ROOT.GetLeader] И убедил их предоставить им убежище, а также их состояние в деньгах и золоте, которое они «получили» за несколько десятилетий до этого. Он утверждает, что это был весь его план на протяжении всего времени, и что теперь они будут проживать в нашей стране и начать бизнес по сбору манго на недавно приобретенной плантации, хотя неясно, каким образом они смогли получить его в этот момент времени."
 tahiti.plan.1.a:0 "Всё идёт по чёртову плану!"
