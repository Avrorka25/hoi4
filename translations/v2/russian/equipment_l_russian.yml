 gw_tank_equipment:0 "Большой военный танк"
 gw_tank_equipment_short:0 "Большой военный танк"
 gw_tank_equipment_desc:0 "Танки в Первой мировой войне разрабатывались отдельно и одновременно Великобританией и Францией как средство выхода из тупика окопной войны на Западном фронте. Название Tank было принято англичанами на ранних стадиях их разработки, как мера безопасности, чтобы скрыть их назначение. Ранние танки были вооружены пулеметами и небольшими пушками, двигались медленно и были бронированы только для того, чтобы остановить огонь из стрелкового оружия."
 GER_gw_tank_equipment:0 "Leichttraktor"
 GER_gw_tank_equipment_short:0 "Leichttraktor"
 GER_gw_tank_equipment_desc:0 "Leichttraktor был немецким экспериментальным танком. После Первой мировой войны Германия была ограничена в военном развитии Версальским договором, но секретная программа под прикрытием «Трактора» разрабатывала бронетехнику и артиллерию."
