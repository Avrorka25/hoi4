 medium_tank_equipment_desc:0 "Средние танки — это достаточно гибкие многоцелевые танки, которые могут выполнять множество функций, таких как разведчики, поддержка или даже фронтовые танки."
 medium_tank_equipment_1:0 "Средний танк I"
 medium_tank_equipment_1_short:0 "М. Танк I"
 medium_tank_equipment_1_desc:0 "Средние танки — это достаточно гибкие многоцелевые танки, которые могут выполнять множество функций, таких как разведчики, поддержка или даже фронтовые танки."
 GER_medium_tank_equipment_1:0 "Panzerkampfwagen III"
 GER_medium_tank_equipment_1_short:0 "Pz.Kpfw. III"
 GER_medium_tank_equipment_1_desc:0 "Уже в 1934/35 году генерал Хайнц Гудериан предполагал, что два основных типа будут выступать в качестве наиболее многочисленного оборудования для будущих немецких танковых дивизий. Первая машина должна была быть вооружена противотанковым орудием и двумя пулеметами, а вторая должна была быть опорной машиной, вооруженной орудием большего калибра. Первый танк в конечном итоге стал известен как Panzerkampfwagen III, который должен был стать стандартным танком для трех легких рот танкового батальона. Второй стал известен как Panzerkampfwagen IV."
