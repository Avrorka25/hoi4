 medium_tank_artillery_equipment_short:0 "М. SPG"
 medium_tank_artillery_equipment_desc:0 "Средняя артиллерийская пушка, установленная на шасси среднего танка, средняя САУ обладает респектабельной огневой мощью, но при этом довольно мобильна."
