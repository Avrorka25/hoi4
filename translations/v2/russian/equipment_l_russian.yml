 GER_light_tank_artillery_equipment_1:0 "Sturmpanzer I «Бизон»"
 GER_light_tank_artillery_equipment_1_short:0 "«Бизон»"
 GER_light_tank_artillery_equipment_1_desc:0 "Буксируемые пушки, которые были приписаны к ротам пехотных орудий мотострелковых полков, испытывали трудности с ведением танков во время боя. Проще всего было модифицировать запасное танковое шасси, чтобы нести его в бой. В случае с Bison он использует шасси Panzer I."
 GER_light_tank_artillery_equipment_2:0 "Sd. Kfz. 124 «Веспе»"
 GER_light_tank_artillery_equipment_2_short:0 "«Веспе»"
 GER_light_tank_artillery_equipment_2_desc:0 "Sd.Kfz. 124 Wespe (немецкий для Wasp), был немецкой самоходной артиллерийской машиной, основанной на модифицированном шасси Panzer II."
 GER_light_tank_artillery_equipment_3:1 "Ваффентрагер Леопард"
