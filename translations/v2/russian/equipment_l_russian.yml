 GER_land_cruiser_equipment_1:0 "Сверхтяжелый танк «Ландкройцер П.1000 Ратте»"
 GER_land_cruiser_equipment_1_short:0 "«Ратте»"
 GER_land_cruiser_equipment_1_desc:0 "P.1000 Ratte был немецким проектом сверхтяжёлого танка времён Второй мировой войны. Предложенная компанией Krupp в 1942 году конструкция представляла собой 1000-тонного бронированного гиганта с двумя 280-мм корабельными орудиями, многочисленным вспомогательным вооружением и бронёй толщиной до 360 мм. Ratte задумывался как мобильная крепость, способная подавить любое сопротивление на поле боя. Однако из-за огромных размеров, колоссального расхода топлива и логистической непрактичности проект признали нереализуемым и окончательно закрыли в 1943 году."
 helicopter_equipment:0 "Вертолет"
