 medium_tank_artillery_equipment_3:0 "Артиллерия СП III"
 medium_tank_artillery_equipment_3_short:0 "М. SPG III"
 medium_tank_artillery_equipment_3_desc:0 "Средняя артиллерийская пушка, установленная на шасси среднего танка, средняя САУ обладает респектабельной огневой мощью, но при этом довольно мобильна."
 GER_medium_tank_artillery_equipment_1:0 "«Грилле»"
 GER_medium_tank_artillery_equipment_1_short:0 "«Грилле»"
 GER_medium_tank_artillery_equipment_1_desc:0 "Sd.Kfz. 138/1 «Грилле» (по-немецки «сверчок») — самоходная артиллерийская установка, применявшаяся Германией во Второй мировой войне. Было выпущено около 490–500 машин. Они состояли на вооружении танковых дивизий, действовавших в Советском Союзе, а также частей в Польше и Франции. Эти установки использовались до 1945 года и также служили в Тунисе, где сражались с вражеской артиллерией и танками."
 GER_medium_tank_artillery_equipment_2:0 "«Хуммель»"
 GER_medium_tank_artillery_equipment_2_short:0 "«Хуммель»"
 GER_medium_tank_artillery_equipment_2_desc:0 "Hummel (немецкий: «шмелейная пчела») была самоходной артиллерийской пушкой на базе шасси Geschützwagen III/IV, вооруженной 15-сантиметровой гаубицей. Он использовался немецким вермахтом во время Второй мировой войны с начала 1943 года до конца войны."
