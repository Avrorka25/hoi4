 tank_armor_upgrade:0 "Броня"
 tank_armor_upgrade_desc:0 "Броня, которую противник не способен пробить, даёт дивизиям огромное преимущество, но, вероятно, снизит скорость."
 tank_gun_upgrade:0 "Главное орудие"
 tank_gun_upgrade_desc:0 "Важно иметь орудие, способное соответствовать прочности вражеской брони и пробивать её."
 tank_aa_upgrade:0 "Зенитное вооружение"
 tank_aa_upgrade_desc:0 "Необходимо, чтобы наше зенитное вооружение могло сбивать новейшие самолёты."
 tank_at_upgrade:0 "Противотанковое вооружение"
 tank_at_upgrade_desc:0 "Необходимо, чтобы наши истребители танков могли уничтожать новейшие вражеские танки."
 tank_art_upgrade:0 "Артиллерийское вооружение"
 tank_art_upgrade_desc:1 "Необходимо, чтобы наша самоходная артиллерия обладала огромной огневой мощью и сметала любого небронированного противника."
 tank_reliability_upgrade:0 "Надежность"
 tank_reliability_upgrade_desc:1 "Повышение надежности приводит к меньшему количеству сломанного оборудования, которое вам нужно будет заменить."
 mech_cost_upgrade:0 "Стоимость производства"
 mech_cost_upgrade_desc:0 "Оптимизация конструкции и замена менее важных материалов позволяют строить машину быстрее, но немного увеличивают количество дефектов."
 tank_engine_upgrade:0 "Двигатель"
 tank_engine_upgrade_desc:0 "Большая подвижность даёт тактические и стратегические преимущества, а также позволяет усилить броню без значительного снижения скорости."
 ac_engine_upgrade:0 "Двигатель"
 ac_engine_upgrade_desc:0 "Большая подвижность даёт тактические и стратегические преимущества, а также позволяет усилить броню без значительного снижения скорости."
 ship_gun_upgrade:0 "Орудия"
 ship_gun_upgrade_desc:0 "Важно иметь орудие, способное соответствовать прочности вражеской брони и пробивать её."
 ship_torpedo_upgrade:0 "Торпеды"
 ship_torpedo_upgrade_desc:0 "Торпеда — мощное оружие, которое меньшие корабли могут применять с близкой дистанции с высокой вероятностью критического попадания."
 ship_armor_upgrade:0 "Броня"
 ship_armor_upgrade_desc:0 "Дополнительная броня защищает корабль от вражеского огня."
 carrier_armor_upgrade:0 "Броня"
 carrier_armor_upgrade_desc:0 "Дополнительная броня защищает корабль от вражеского огня."
 ship_engine_upgrade:0 "Двигатель"
 ship_engine_upgrade_desc:0 "Корабль с более мощным двигателем способен контролировать дистанцию до противника в бою."
 ship_reliability_upgrade:0 "Надежность"
 ship_reliability_upgrade_desc:0 "Корабль с высокой надёжностью менее подвержен критическим попаданиям, способным нанести огромный ущерб плохо спроектированному судну."
 ship_anti_air_upgrade:0 "ПВО"
 ship_anti_air_upgrade_desc:0 "Чем больше орудий посылает свинец в небо, тем больше вражеских самолётов будет сбито!"
 ship_ASW_upgrade:0 "ПЛО"
 ship_ASW_upgrade_desc:0 "Противолодочное вооружение необходимо для обнаружения и уничтожения подводных лодок."
 destroyer_engine_upgrade:0 "Двигатель"
 destroyer_engine_upgrade_desc:0 "Корабль с более мощным двигателем способен контролировать дистанцию до противника в бою."
 sub_engine_upgrade:0 "Двигатель"
 sub_engine_upgrade_desc:0 "Корабль с более мощным двигателем способен контролировать дистанцию до противника в бою."
 sub_stealth_upgrade:0 "Незаметность"
 sub_stealth_upgrade_desc:0 "Главное преимущество подводной лодки — способность оставаться незамеченной и наносить удар только при выгодных условиях."
 sub_torpedo_upgrade:0 "Торпеды"
 sub_torpedo_upgrade_desc:0 "Торпеда — мощное оружие, которое меньшие корабли могут применять с близкой дистанции с высокой вероятностью критического попадания."
 ship_deckspace_upgrade:0 "Палуба"
 ship_deckspace_upgrade_desc:0 "Больше места для размещения и запуска палубной авиации."
 plane_gun_upgrade:0 "Вооружение"
 plane_gun_upgrade_desc:0 "Улучшенное вооружение для борьбы с другими самолётами."
 cv_plane_gun_upgrade:0 "Вооружение"
 cv_plane_gun_upgrade_desc:0 "Улучшенное вооружение для борьбы с другими самолётами."
 plane_engine_upgrade:0 "Двигатель"
 plane_engine_upgrade_desc:0 "Более высокая скорость даёт самолёту преимущество при выборе позиции и цели. Особенно важно для перехватчиков."
 plane_range_upgrade:0 "Дальность"
 plane_range_upgrade_desc:0 "Самолёт с большей дальностью способен выполнять задания в большем числе стратегических районов."
 cv_plane_range_upgrade:0 "Дальность"
 cv_plane_range_upgrade_desc:0 "Самолёт с большей дальностью способен выполнять задания в большем числе стратегических районов."
 plane_reliability_upgrade:0 "Надежность"
 plane_reliability_upgrade_desc:0 "Самолёт с низкой надёжностью может попадать в аварии во время заданий."
 plane_naval_upgrade:0 "Атака"
 plane_naval_upgrade_desc:0 "Повышенная грузоподъёмность для противокорабельного вооружения."
 cv_plane_naval_upgrade:0 "Атака"
 cv_plane_naval_upgrade_desc:0 "Повышенная грузоподъёмность для противокорабельного вооружения."
 plane_bomb_upgrade:0 "Бомбардировка"
 plane_bomb_upgrade_desc:0 "Увеличенный бомбоотсек для большей боевой нагрузки."
 plane_tac_bomb_upgrade:0 "Бомбардировка"
 plane_tac_bomb_upgrade_desc:0 "Увеличенный бомбоотсек для большей боевой нагрузки."
 plane_cas_upgrade:0 "Атака"
 plane_cas_upgrade_desc:0 "Улучшенное вооружение для ударов по наземным целям."
 plane_armor_upgrade:0 "Броня"
 plane_armor_upgrade_desc:0 "Протектированные топливные баки и бронеплиты повышают живучесть."
