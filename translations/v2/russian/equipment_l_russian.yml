 train_equipment:0 "Поезд"
 train_equipment_desc:0 "Поезда перевозят припасы от столицы снабжения к узлам снабжения, соединённым железной дорогой."
 train_equipment_1:0 "Гражданский поезд"
 train_equipment_1_desc:0 "Этот локомотив, изъятый армией из обычных гражданских грузовых перевозок, хорошо подходит для доставки большого количества припасов на дальние расстояния. Однако гражданская конструкция делает его уязвимым."
 train_equipment_2:0 "Военный упрощенный поезд"
 train_equipment_2_desc:0 "Упрощённая конструкция без многих элементов, характерных для обычных грузовых поездов, ради удешевления производства. Он столь же уязвим, как обычный состав, но его легче заменить."
 train_equipment_3:0 "Бронепоезд"
 train_equipment_3_desc:0 "Локомотив, защищённый тяжёлой бронёй и поэтому менее уязвимый для вражеских атак. Он способен перевозить столько же груза, сколько и другие поезда, но дороже в производстве."
 railway_gun_equipment:0 "Железнодорожная артиллерия"
 railway_gun_equipment_desc:0 "Тяжёлое орудие, установленное на железнодорожной платформе для перевозки."
 railway_gun_desc:0 "Железные дороги позволяют перемещать тяжёлые орудия далеко вглубь страны с приемлемой скоростью, обеспечивая эффективный обстрел позиций противника с большой дистанции."
 railway_gun_equipment_1:0 "Железнодорожное орудие"
 floating_harbor_equipment:0 "Плавучая гавань"
 floating_harbor_equipment_desc:1 "Система понтонов и сборных бетонных конструкций, которую можно перевезти по воде и за несколько часов собрать в защищённое место высадки для разгрузки припасов."
 floating_harbor_equipment_1:0 "Плавучая гавань"
 floating_harbor_equipment_1_desc:1 "Система понтонов и сборных бетонных конструкций, которую можно перевезти по воде и за несколько часов собрать в защищённое место высадки для разгрузки припасов."
