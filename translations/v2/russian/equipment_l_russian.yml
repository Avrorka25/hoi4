 light_tank_equipment:0 "Легкий танк"
 light_tank_equipment_desc:0 "Легкие танки — это небольшие, проворные танки, которые способны как разведывать, так и сражаться с легкобронированными противниками."
 light_tank_equipment_1:0 "Легкий танк I"
 light_tank_equipment_1_short:0 "Л. Танк I"
 light_tank_equipment_1_desc:0 "Легкие танки — это небольшие, проворные танки, которые способны как разведывать, так и сражаться с легкобронированными противниками."
 GER_light_tank_equipment_1:0 "Panzerkampfwagen I"
 GER_light_tank_equipment_1_short:0 "Panzer I"
 GER_light_tank_equipment_1_desc:0 "Panzer I — лёгкий танк, выпускавшийся в Германии в 1930-х годах. Проектирование Panzer I началось в 1932 году, а серийное производство началось в 1934 году. Предназначенный только в качестве учебного танка для введения концепции бронированной войны в германскую армию, PzKpfw I широко использовался в бою из-за отсутствия более современных танков."
