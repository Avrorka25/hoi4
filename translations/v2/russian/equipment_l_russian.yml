 artillery_equipment_1:0 "Буксируемая артиллерия"
 artillery_equipment_1_short:0 "Артиллерия"
 artillery_equipment_1_desc:0 "Артиллерия относится к крупнокалиберному оружию, такому как пушки и гаубицы, которыми управляют экипажи, которые могут проецировать боеприпасы далеко за пределы эффективного диапазона личного оружия."
 rocket_artillery_equipment_1:0 "Буксируемая реактивная артиллерия"
 rocket_artillery_equipment_1_short:0 "Ракетная артиллерия"
 rocket_artillery_equipment_1_desc:0 "Ракетная артиллерия менее точна и имеет гораздо более низкую устойчивую скорострельность, чем батареи традиционных артиллерийских орудий. Тем не менее, они имеют возможность одновременно поражать цель несколькими ракетами с разрушительным эффектом."
 infantry_equipment:0 "Пехотное снаряжение"
 infantry_equipment_short:0 "Пехотный экв."
 infantry_equipment_desc:0 "Персонал и экипаж служили оружием для пехоты, а также различными другими комплектами, необходимыми солдату."
 infantry_equipment_0:0 "Базовая пехотная техника"
 infantry_equipment_0_short:0 "Базовый экв."
 infantry_equipment_0_desc:0 "Базовая пехотная техника разрабатывалась до и во время Великой войны."
 infantry_equipment_1:0 "Пехотная техника I"
 infantry_equipment_1_short:0 "Оружие I"
 infantry_equipment_1_desc:0 "Персонал и экипаж служили оружием для пехоты, а также различными другими комплектами, необходимыми солдату."
 infantry_equipment_2:0 "Пехотное снаряжение II"
 infantry_equipment_2_short:0 "Оружие II"
 infantry_equipment_2_desc:0 "Персонал и экипаж служили оружием для пехоты, а также различными другими комплектами, необходимыми солдату. Модернизированы, чтобы включать большое количество суб-пулеметов и противотанковых винтовок."
 infantry_equipment_3:0 "Пехотное снаряжение III"
 infantry_equipment_3_short:0 "Оружие III"
 infantry_equipment_3_desc:0 "Персонал и экипаж служили оружием для пехоты, а также различными другими комплектами, необходимыми солдату. Дальнейшая модернизация включает в себя персональные штурмовые винтовки и противотанковые ракеты."
 gw_armored_car_equipment:1 "Межвоенный бронированный автомобиль"
 gw_armored_car_equipment_desc:0 "Там, где предыдущие бронированные автомобили были простыми коммерческими моделями с тонкой стальной обшивкой, эта модель была разработана с нуля для перевозки брони и легкого вооружения."
 armored_car_equipment_1:0 "Основной бронированный автомобиль"
 armored_car_equipment_1_desc:0 "Улучшенная внутренняя компоновка и дополнительное хранение боеприпасов создают более эффективный бронеавтомобиль."
 armored_car_equipment_2:0 "Улучшенный бронированный автомобиль"
 armored_car_equipment_2_desc:0 "Изменения на поле боя требуют гораздо более тяжелого вооружения и более толстой брони, чтобы победить легкие подразделения противника и выжить, чтобы отчитываться."
 armored_car_at_equipment:0 "Бронированный противотанковый автомобиль"
 armored_car_at_equipment_desc:0 "Наши легкие механизированные подразделения в какой-то момент вступят в контакт с танковыми войсками противника. Разработка специального противотанкового варианта дала бы им боевой шанс."
