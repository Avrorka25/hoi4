 medium_tank_equipment_3:0 "Средний танк III"
 medium_tank_equipment_3_short:0 "М. Танк III"
 medium_tank_equipment_3_desc:0 "Средние танки — это достаточно гибкие многоцелевые танки, которые могут выполнять множество функций, таких как разведчики, поддержка или даже фронтовые танки."
 GER_medium_tank_equipment_3:0 "Panzerkampfwagen V «Пантера»"
 GER_medium_tank_equipment_3_short:0 "«Пантера»"
 GER_medium_tank_equipment_3_desc:0 "Panther - общее название среднего танка, развернутого Германией во Второй мировой войне с середины 1943 года до конца европейской войны в 1945 году. Предназначена как противовес российскому Т-34, а также как замена танковым III и IV. Не заменяя последнего, он служил рядом с ним и более тяжелыми танками «Тигр» до конца войны. Превосходное сочетание огневой мощи, мобильности и защиты Пантеры послужило эталоном для послевоенных и послевоенных танков других стран, и он считается одним из лучших танков Второй мировой войны."
