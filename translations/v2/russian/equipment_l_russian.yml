 sam_missile:0 "Зенитная управляемая ракета"
 sam_missile_equipment:0 "Ракета класса «земля — воздух»"
 sam_missile_equipment_short:0 "РЗВ"
 sam_missile_equipment_desc:0 "Ракета, предназначенная для быстрого набора высоты, сближения с вражескими бомбардировщиками и взрыва в непосредственной близости от них."
