 medium_tank_destroyer_equipment:0 "Средняя ПТ-установка"
 medium_tank_destroyer_equipment_short:0 "Средняя ПТ"
 medium_tank_destroyer_equipment_desc:0 "Танковые эсминцы — это танки с более крупной, чем обычно пушкой в фиксированной установке вместо башни. Разрушители средних танков основаны на шасси средних танков, что означает, что они довольно мобильны и обладают респектабельной огневой мощью."
 medium_tank_destroyer_equipment_1:0 "Разрушитель средних танков I"
 medium_tank_destroyer_equipment_1_short:0 "М. TD I"
 medium_tank_destroyer_equipment_1_desc:0 "Танковые эсминцы — это танки с более крупной, чем обычно пушкой в фиксированной установке вместо башни. Разрушители средних танков основаны на шасси средних танков, что означает, что они довольно мобильны и обладают респектабельной огневой мощью."
 medium_tank_destroyer_equipment_2:0 "Средний танк-разрушитель II"
 medium_tank_destroyer_equipment_2_short:0 "М. TD II"
 medium_tank_destroyer_equipment_2_desc:0 "Танковые эсминцы — это танки с более крупной, чем обычно пушкой в фиксированной установке вместо башни. Разрушители средних танков основаны на шасси средних танков, что означает, что они довольно мобильны и обладают респектабельной огневой мощью."
 medium_tank_destroyer_equipment_3:0 "Средний танк-разрушитель III"
 medium_tank_destroyer_equipment_3_short:0 "М. TD III"
 medium_tank_destroyer_equipment_3_desc:0 "Танковые эсминцы — это танки с более крупной, чем обычно пушкой в фиксированной установке вместо башни. Разрушители средних танков основаны на шасси средних танков, что означает, что они довольно мобильны и обладают респектабельной огневой мощью."
 GER_medium_tank_destroyer_equipment_1:0 "Sturmgeschütz III"
 GER_medium_tank_destroyer_equipment_1_short:0 "StuG III"
 GER_medium_tank_destroyer_equipment_1_desc:0 "Штурмгешютц III был самой произведенной боевой бронированной машиной Германии во время Второй мировой войны. Он был построен на шасси проверенного танка Panzer III. Первоначально предназначенный как мобильное бронированное легкое орудие для поддержки пехоты, StuG постоянно модифицировался и широко использовался в качестве эсминца танков."
 GER_medium_tank_destroyer_equipment_2:0 "Jagdpanzer IV"
 GER_medium_tank_destroyer_equipment_2_short:0 "JagdPz IV"
 GER_medium_tank_destroyer_equipment_2_desc:0 "Jagdpanzer IV служил в противотанковых частях танковых и танковых дивизий СС. Они сражались в Нормандии, в битве при Балге и на Восточном фронте. Они были очень успешными эсминцами танков, но плохо действовали при использовании в качестве замены танков или штурмовых орудий, как и большинство истребителей танков. Однако на более поздних этапах войны они все чаще использовались в качестве замены танков, потому что больше ничего не было доступно."
 GER_medium_tank_destroyer_equipment_3:0 "«Ягдпантера»"
 GER_medium_tank_destroyer_equipment_3_short:0 "«Ягдпантера»"
 GER_medium_tank_destroyer_equipment_3_desc:0 "Jagdpanther (немецкий: «охотничья пантера») был эсминец танков, построенный нацистской Германией во время Второй мировой войны на основе шасси танка Panther. Он вступил в строй в конце войны (1944) и служил на Восточном и Западном фронтах. Ягдпантер сочетал в себе очень мощную 8,8 см пушку PaK 43 Tiger II и характерно отличную броню и подвеску шасси Panther, хотя он страдал от общего бедного состояния Германии в более поздней части войны, что привело к небольшому количеству производства, нехватке запасных частей и плохой подготовке экипажа."
