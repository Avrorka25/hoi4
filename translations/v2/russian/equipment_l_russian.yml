 USA_motorized_rocket_equipment_1_short:0 "Ксилофон"
 amphibious_mechanized_equipment:0 "Десантные машины-амфибии"
 amphibious_mechanized_equipment_short:0 "Амфибии"
 amphibious_mechanized_equipment_desc:0 "Плавающие транспортёры, или амтраки, позволяют морской пехоте высаживаться на берег под защитой брони. Цена такой защищённости — высокий расход топлива."
 amphibious_mechanized_equipment_1:0 "Основной амфибийный трактор"
 amphibious_mechanized_equipment_1_short:0 "Основной Amtrac"
 amphibious_mechanized_equipment_1_desc:0 "Плавающие транспортёры, или амтраки, позволяют морской пехоте высаживаться на берег под защитой брони. Цена такой защищённости — высокий расход топлива."
 amphibious_mechanized_equipment_2:0 "Улучшенный трактор-амфибия"
 amphibious_mechanized_equipment_2_short:0 "Улучшенный Amtrac"
 amphibious_mechanized_equipment_2_desc:0 "Эти амтраки получили ряд улучшений по сравнению с базовой моделью, включая кормовую аппарель, упрощающую высадку на берег."
 amphibious_tank_equipment:0 "Плавающие танки"
 amphibious_tank_equipment_short:0 "Плавающие танки"
 light_tank_amphibious_chassis:0 "Легкие плавающие танки"
 light_tank_amphibious_chassis_short:0 "Легк. плав. танки"
 medium_tank_amphibious_chassis:0 "Средние плавающие танки"
 medium_tank_amphibious_chassis_short:0 "Ср. плав. танки"
 heavy_tank_amphibious_chassis:0 "Тяжелые плавающие танки"
 heavy_tank_amphibious_chassis_short:0 "Тяж. плав. танки"
 amphibious_tank_equipment_1:0 "Основной десантный танк"
 amphibious_tank_equipment_2:0 "Улучшенный десантный танк"
 amphibious_tank_equipment_desc:0 "Танки, модифицированные для передвижения по воде. Они значительно лучше обычных танков подходят для морских десантов и форсирования рек, но расходуют больше топлива."
 amphibious_tank_equipment_1_desc:0 "По сути, легкий танк, модифицированный для плавания, этот автомобиль предлагает огневую поддержку подразделениям, устанавливающим плацдарм."
 amphibious_tank_equipment_2_desc:0 "Средний резервуар, модифицированный для перемещения по воде. Добавленная универсальность и мобильность достигается за счет снижения топливной эффективности."
