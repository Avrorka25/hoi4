 mechanized_equipment:0 "Бронетранспортёры"
 mechanized_equipment_short:0 "Бронетранспортёры"
 mechanized_equipment_desc:0 "Механизированная пехота оснащена бронетранспортёрами (БТР) или боевыми машинами пехоты (БМП), предназначенными как для перевозки, так и для ведения боя. От моторизованной пехоты она отличается тем, что её техника обеспечивает определённую защиту от вражеского огня, тогда как моторизованные части используют небронированные колёсные машины — грузовики и джипы."
 mechanized_equipment_1:0 "Механизированное оборудование I"
 mechanized_equipment_1_short:0 "Механизированный я"
 mechanized_equipment_1_desc:0 "Механизированная пехота оснащена бронетранспортёрами (БТР) или боевыми машинами пехоты (БМП), предназначенными как для перевозки, так и для ведения боя. От моторизованной пехоты она отличается тем, что её техника обеспечивает определённую защиту от вражеского огня, тогда как моторизованные части используют небронированные колёсные машины — грузовики и джипы."
 mechanized_equipment_2:0 "Механизированное оборудование II"
 mechanized_equipment_2_short:0 "Механизированный II"
 mechanized_equipment_2_desc:0 "Механизированная пехота оснащена бронетранспортёрами (БТР) или боевыми машинами пехоты (БМП), предназначенными как для перевозки, так и для ведения боя. От моторизованной пехоты она отличается тем, что её техника обеспечивает определённую защиту от вражеского огня, тогда как моторизованные части используют небронированные колёсные машины — грузовики и джипы."
 mechanized_equipment_3:0 "Механизированное оборудование III"
 mechanized_equipment_3_short:0 "Механизированный III"
 mechanized_equipment_3_desc:0 "Механизированная пехота оснащена бронетранспортёрами (БТР) или боевыми машинами пехоты (БМП), предназначенными как для перевозки, так и для ведения боя. От моторизованной пехоты она отличается тем, что её техника обеспечивает определённую защиту от вражеского огня, тогда как моторизованные части используют небронированные колёсные машины — грузовики и джипы."
 GER_mechanized_equipment_1:0 "Sonderkraftfahrzeug 11"
 GER_mechanized_equipment_1_short:0 "Sd.Kfz. 11"
 GER_mechanized_equipment_1_desc:0 "Sd.Kfz. 11 (Sonderkraftfahrzeug - специальный моторизованный автомобиль) был немецким полугусеничным транспортным средством, которое широко использовалось во Второй мировой войне. Он мог нести восемь военнослужащих в дополнение к буксировке пистолета или прицепа."
 GER_mechanized_equipment_2:0 "Sonderkraftfahrzeug 251"
 GER_mechanized_equipment_2_short:0 "Sd.Kfz. 251"
 GER_mechanized_equipment_2_desc:0 "Sd.Kfz. 251 полугусеничный бронеавтомобиль был разработан и впервые построен компанией Hanomag во время Второй мировой войны на основе их более раннего Sd.Kfz. 11 автомобилей."
