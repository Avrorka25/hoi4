 GER_medium_tank_aa_equipment_1:0 "Flakpanzer III Möbelwagen"
 GER_medium_tank_aa_equipment_1_short:0 "Мёбельваген"
 GER_medium_tank_aa_equipment_1_desc:0 "По прозвищу Möbelwagen (Мебельный фургон) из-за своей бокс-башни, когда она была закрыта, это была самоходная зенитная пушка, построенная из шасси танка Panzer III и вооруженная 20-мм квадроциклом."
 GER_medium_tank_aa_equipment_2:0 "Flakpanzer IV «Оствинд»"
 GER_medium_tank_aa_equipment_2_short:0 "«Оствинд»"
 GER_medium_tank_aa_equipment_2_desc:0 "Flakpanzer IV 'Ostwind' (немецкий: 'East Wind') был самоходной зенитной пушкой на основе танка Panzer IV. Он был разработан в 1944 году как преемник более раннего Flakpanzer IV. Башня Panzer IV была снята и заменена открытой шестиугольной башней, в которой размещался 3,7-сантиметровый FlaK 43. Конструкция с закрытым верхом была бы предпочтительнее, но это было невозможно из-за сильного дыма, создаваемого пистолетом."
