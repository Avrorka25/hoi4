 super_heavy_tank_equipment:0 "Сверхтяжелый танк"
 super_heavy_tank_equipment_desc:0 "Сверхтяжелые танки — это эволюция концепции тяжелого танка. Более крупные, лучше вооруженные, с большим количеством брони, они также медленнее и имеют серьезные проблемы с мягкой землей, и немногие мосты могут надеяться справиться со своим весом."
 super_heavy_tank_equipment_1:0 "Сверхтяжелый танк"
 super_heavy_tank_equipment_1_short:0 "Ш.Ш. Танк"
 super_heavy_tank_equipment_1_desc:0 "Сверхтяжелые танки — это эволюция концепции тяжелого танка. Более крупные, лучше вооруженные, с большим количеством брони, они также медленнее и имеют серьезные проблемы с мягкой землей, и немногие мосты могут надеяться справиться со своим весом."
 GER_super_heavy_tank_equipment_1:0 "Panzerkampfwagen VIII «Маус»"
 GER_super_heavy_tank_equipment_1_short:0 "«Маус»"
 GER_super_heavy_tank_equipment_1_desc:0 "Panzerkampfwagen VIII «Маус» (по-немецки «мышь») — немецкий сверхтяжёлый танк времён Второй мировой войны, постройку которого завершили в конце 1944 года. Это самая тяжёлая из когда-либо построенных боевых машин с полностью закрытым броневым корпусом. Основным вооружением «Мауса» была 128-мм пушка KwK 44 L/55, дополненная спаренным 75-мм орудием."
