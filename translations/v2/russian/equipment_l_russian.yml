 GER_modern_tank_equipment_1:0 "E-50 «Штандартпанцер»"
 GER_modern_tank_equipment_1_short:0 "E-50"
 GER_modern_tank_equipment_1_desc:0 "Серия Entwicklung была попыткой Германии создать стандартизированную серию танков. Стандартные конструкции должны были быть в шести различных весовых категориях. E-50 Standardpanzer был задуман как стандартный средний танк, заменив серии танков Panther и Tiger и переоборудование на основе этих танков."
