 GER_heavy_tank_destroyer_equipment_1_short:0 "«Штурер Эмиль»"
 GER_heavy_tank_destroyer_equipment_1_desc:0 "Selbstfahrlafette auf VK3001 (H) «Штурер Эмиль» («Упрямый Эмиль») — немецкое самоходное противотанковое орудие на основе шасси проекта VK3001 фирмы «Хеншель»."
 GER_heavy_tank_destroyer_equipment_2:0 "Panzerjäger «Тигр (P)»"
 GER_heavy_tank_destroyer_equipment_2_short:0 "«Элефант»"
 GER_heavy_tank_destroyer_equipment_2_desc:0 "«Элефант» («Слон») — тяжелый истребитель танков, построенный на шасси отклоненного проекта «Тигр» от «Порше» и вооруженный пушкой PaK 43/2 калибра 88 мм."
 GER_heavy_tank_destroyer_equipment_3:0 "Panzerjäger Tiger Ausf. B"
 GER_heavy_tank_destroyer_equipment_3_short:0 "«Ягдтигр»"
 GER_heavy_tank_destroyer_equipment_3_desc:0 "Jagdtiger был самой тяжелой боевой бронированной машиной, которая использовалась во время Второй мировой войны. Машина имела 128-мм пушку PaK 44 L/55 и тяжелую лобовую броню."
