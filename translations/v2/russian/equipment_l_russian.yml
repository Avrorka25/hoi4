 light_tank_equipment_3_desc:0 "Легкие танки — это небольшие, проворные танки, которые способны как разведывать, так и сражаться с легкобронированными противниками."
 GER_light_tank_equipment_3:0 "VK1602 «Леопард»"
 GER_light_tank_equipment_3_short:0 "«Леопард»"
 GER_light_tank_equipment_3_desc:0 "VK1602 Leopard был немецкой разведывательной машиной, разработанной в 1942 году. Планировалось вооружить машину 75-мм пушкой Kwk 41, хотя она была заменена на меньшую 50-мм канонерскую пушку. VK 1602 имел наклонную лобовую броню под влиянием среднего танка Panther. Для повышения производительности по пересеченной местности VK 1602 оснащался гусеницами шириной 350 мм."
