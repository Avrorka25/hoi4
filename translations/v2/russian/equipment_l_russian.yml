 GER_light_tank_equipment_2:0 "Panzerkampfwagen II"
 GER_light_tank_equipment_2_short:0 "Pz.Kpfw. II"
 GER_light_tank_equipment_2_desc:0 "Первоначально Panzer II разрабатывался как передовая машина, в то время как были разработаны более крупные, более продвинутые танки, но он широко использовался в бою из-за отсутствия более способных танков."
