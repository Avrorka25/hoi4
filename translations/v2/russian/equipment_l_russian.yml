 GER_heavy_tank_equipment_3:0 "Panzerkampfwagen IV Ausf. B"
 GER_heavy_tank_equipment_3_short:0 "«Королевский тигр»"
 GER_heavy_tank_equipment_3_desc:0 "Известный под неофициальным названием Königstiger, но часто полубуквально переводится как «Король Тигр» солдатами союзников, дизайн следовал той же концепции, что и «Тигр I», но был предназначен для еще более грозного. Тигр II соединил толстую броню Тигра I с наклонной броней, используемой на среднем танке Panther. Танк весил почти семьдесят метрических тонн, был защищен от 100 до 180 мм брони спереди и был вооружен длинноствольной 8,8 см пушкой Кампфвагенканоне 43 L/71."
