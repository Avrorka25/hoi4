 modern_tank_artillery_equipment_desc:0 "Современные самоходные артиллерийские установки внешне могут напоминать танки, но обычно имеют лёгкую броню, недостаточную для выживания в бою прямой наводкой. Тем не менее она защищает экипаж от осколков и стрелкового оружия."
