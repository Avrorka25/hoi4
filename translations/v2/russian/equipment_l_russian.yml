 artillery_equipment_2:0 "Улучшенная артиллерия"
 artillery_equipment_2_desc:0 "Новая конструкция гаубицы, использующая гидравлическое гашение отдачи и более длинный ствол."
 artillery_equipment_3:0 "Передовая артиллерия"
 artillery_equipment_3_desc:0 "Облегченная конструкция, предусматривающая разборку для транспортировки, что позволяет обеспечить огневой поддержкой труднодоступные места."
 anti_air_equipment_2:0 "Улучшенная ПВО"
 anti_air_equipment_2_desc:0 "Зенитные орудия с более длинными гильзами и стволами, способные поражать высотные самолёты."
 anti_air_equipment_3:0 "Передовая ПВО"
 anti_air_equipment_3_desc:1 "Усовершенствованное мобильное зенитное орудие с повышенной дальностью и огневой мощью для борьбы даже с самыми быстрыми и высотными самолётами противника."
 rocket_artillery_equipment_2:0 "Передовая реактивная артиллерия"
 rocket_artillery_equipment_2_desc:0 "Ракеты, стабилизируемые вращением, увеличивают дальность стрельбы лёгких артиллерийских батарей."
 anti_tank_equipment_2:0 "Улучшенная ПТО"
 anti_tank_equipment_2_desc:0 "Крупнокалиберные орудия, способные пробивать толстую и наклонную броню тяжелых танков."
 anti_tank_equipment_3:0 "Передовая ПТО"
 anti_tank_equipment_3_desc:0 "Повышение скорости снаряда вместе с разработками новых типов боеприпасов позволяют справиться с любой броней, которая может встретиться в бою."
 motorized_rocket_equipment:0 "Моторизованная реактивная артиллерия"
 motorized_rocket_equipment_short:0 "Мот. Р. артиллерия"
 motorized_rocket_equipment_desc:0 "Несколько ракетных установок, таких как эти, доставляют взрывчатку в район цели быстрее, чем обычная артиллерия, но с меньшей точностью и требуют более длительного времени для перезарядки. Будучи установленной на грузовиках, эта версия способна запускать атаки и менять позиции до того, как противник сможет вести ответный огонь."
 motorized_rocket_equipment_1:0 "Моторизованная реактивная артиллерия"
 motorized_rocket_equipment_1_short:0 "Мот. Р. артиллерия"
 motorized_rocket_equipment_1_desc:0 "Несколько ракетных установок, таких как эти, доставляют взрывчатку в район цели быстрее, чем обычная артиллерия, но с меньшей точностью и требуют более длительного времени для перезарядки. Будучи установленной на грузовиках, эта версия способна запускать атаки и менять позиции до того, как противник сможет вести ответный огонь."
