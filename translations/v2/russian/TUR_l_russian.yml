l_russian:
 TUR_tahsin_yazici:0 "Тахсин Языджы"
 TUR_bolstering_our_armed_forces:0 "Укрепление наших вооружённых сил"
 TUR_allow_women_in_the_airforce:0 "Разрешить женщинам служить в ВВС"
 cakmak_line:0 "Линия Чакмака"
 expand_the_soviet_turkish_borderdefenses:0 "Укрепить Карсскую линию"
 r56_TUR_turkish_revanchism:0 "Турецкий реваншизм"
 r56_TUR_turkish_revanchism_desc:0 "Вопреки всему воля Великого национального собрания привела Турцию к победе над державами региона, навсегда обеспечив нам право на национальную государственность. Несмотря на труды Ататюрка, другие страны по-прежнему контролируют часть земель, по праву принадлежащих нам. Будучи свободными и защищёнными, лишь мы сами должны решать судьбу своих территориальных притязаний."
 TUR_unlocks_integration_decisions_tt:0 "Открывает §Yрешения по интеграции§! после полного владения и контроля над территорией."
 pan_turkic_propaganda:0 "Пантюркистская пропаганда"
 r56_TUR_press_the_hatay_issue:0 "Поднять вопрос Хатая"
 r56_TUR_press_the_hatay_issue_desc:0 "Хотя Лозаннская конференция разрешила многие наши территориальные споры, вопрос по праву турецкой провинции Хатай остался в несправедливом статус-кво. Пока напряжённость в Европе вновь нарастает, мы, возможно, сумеем обратить неопределённость в возможность и мирно вернуть Хатай."
 r56_TUR_claim_mosul:0 "Предъявить претензии на Мосул"
 r56_TUR_claim_mosul_desc:0 "Анкарский договор 1926 года окончательно закрепил потерю исторически турецкой провинции Мосул в пользу недавно образованного Королевства Ирак. Времена изменились, и мы больше не можем мириться с этой реальностью. Мосул всегда был турецким и всегда им останется!"
 r56_TUR_connect_mosul:0 "Связать Мосул"
 r56_TUR_connect_mosul_desc:0 "Недавно приобретённый Мосул богат нефтью, но крайне слабо развит. Инвестиции в местную инфраструктуру помогут превратить Мосул в образцовую провинцию нашей молодой страны."
 r56_TUR_mosul_turkish_language_schooling:0 "Обучение на турецком языке (Мосул)"
 r56_kurdish_agitation:0 "Курдский сепаратизм"
 TUR_mosul_integratable_tt:0 "Открывает решение: §YИнтегрировать Мосул§!."
 r56_TUR_integrate_mosul:0 "Интегрировать Мосул"
 r56_TUR_claim_azerbaijan:0 "Предъявить претензии на Азербайджан"
 r56_TUR_claim_azerbaijan_desc:0 "Народ Азербайджана достаточно долго страдал под сапогом Москвы. Став Бисмарком тюркских народов, мы немедленно освободим своих национальных братьев от угнетателей!"
 r56_TUR_baku_pan_turk_propaganda:0 "Пантюркистская пропаганда (Азербайджан)"
 r56_TUR_connect_baku:0 "Связать Баку"
 TUR_azerbaijan_integratable_tt:0 "Открывает решение: §YИнтегрировать Азербайджан§!."
 r56_TUR_integrate_azerbaijan:0 "Интегрировать Азербайджан"
 r56_TUR_unshackle_tabriz:0 "Освободить Тебриз"
 r56_TUR_unshackle_tabriz_desc:0 "Азербайджанская диаспора Тебриза и его окрестностей достаточно долго страдала от политики централизации, проводимой Тегераном. Великий город Тебриз и его достойный народ будут освобождены от многолетнего гнёта!"
 r56_TUR_tabriz_pan_turk_propaganda:0 "Пантюркистская пропаганда (Тебриз)"
 r56_TUR_connect_tabriz:0 "Связать Тебриз"
 TUR_tabriz_integratable_tt:0 "Открывает решение: §YИнтегрировать Тебриз§!."
 has_completed_decision_connect_tabriz_tt:0 "Выполнено решение §YСвязать Тебриз§!"
 r56_TUR_integrate_tabriz:0 "Интегрировать Тебриз"
 r56_TUR_claim_crimea:0 "Освободить крымских татар!"
 r56_TUR_claim_crimea_desc:0 "Татары Крыма достаточно долго страдали под сапогом Москвы. Крымчане, ваше освобождение близко!"
 r56_TUR_crimea_pan_turk_propaganda:0 "Пантюркистская пропаганда (Крым)"
 r56_TUR_integrate_crimea:0 "Интегрировать Крым"
 r56_TUR_reclaim_thrace:0 "Вернуть Фракию"
 r56_TUR_reclaim_thrace_desc:0 "Несмотря на всё произошедшее, в недавно ставшей греческой провинции Фракия до сих пор проживает значительное турецкое меньшинство. Мы немедленно вернём эти земли!"
 r56_TUR_invite_thracian_resettlement:0 "Пригласить турецких переселенцев (Фракия)"
 r56_TUR_integrate_thrace:0 "Интегрировать Фракию"
 r56_TUR_reclaim_cyprus:0 "Вернуть Кипр"
 r56_TUR_reclaim_cyprus_desc:0 "Остров Кипр долгое время входил в состав Османской империи и по сей день населён значительным турецким меньшинством. Будь то Лондон, Афины или кто-либо ещё, мы больше не потерпим оккупацию нашего народа!"
 r56_TUR_invite_settlers_to_cyprus:0 "Пригласить турецких переселенцев (Кипр)"
 r56_TUR_integrate_cyprus:0 "Интегрировать Кипр"
 TUR_lingering_unrest:0 "Сохраняющиеся беспорядки"
 r56_TUR_connect_van:0 "Связать Ван"
 unlocks_bolstering_our_armed_forces_decisions_tt:0 "Открывает решения §YУкрепление наших вооружённых сил§!"
 unlocks_fortification_decisions_tt:0 "Открывает решения по §Yстроительству укреплений§! вдоль границ с Грецией и Советским Союзом."
 TUR_logistical_advancements_tt:0 "Если исследована §Yмоторизованная пехота§!, будет выдана дополнительная награда"
 TUR_strengthen_troop_coordination_tt:0 "Если исследованы §Yрадиостанции§!, будет выдана дополнительная награда"
 fortifies_all_provinces_against_SOV_tt:0 "Добавляет два уровня §Yукреплений§! и один уровень §YПВО§! в каждой провинции, граничащей с §YСоветским Союзом§!"
 fortifies_all_provinces_edirne_tt:0 "Добавляет два уровня §Yукреплений§! и один уровень §YПВО§! в каждой провинции §YЭдирне§!, граничащей с §YГрецией§! и §YБолгарией§!"
 has_researched_delay_tt:0 "Исследована технология §YСдерживание§!"
 unlocks_drill_decisions_tt:0 "Открывает решения §YРазведка нефтяных месторождений§!"
 r56_TUR_drill_diyakbir:0 "Провести бурение в Диярбакыре"
 r56_TUR_drill_hakkari:0 "Провести бурение в Хаккяри"
 r56_TUR_foreign_policy:0 "Внешняя политика"
 r56_TUR_the_saadabad_pact:0 "Саадабадский пакт"
 r56_TUR_the_saadabad_pact_desc:0 "Расширение связей с нашими восточными соседями сулит нам лишь выгоду. Мы не можем отказаться от инициативы, которая официально закрепит сложившуюся дружбу и продемонстрирует её всему миру."
 turkish_focus_r56:0 "Национальные фокусы Турции"
 TUR_continue_the_push_for_autarky:0 "Продолжить курс на автаркию"
 TUR_continue_the_push_for_autarky_desc:0 "Экономическая зависимость Османской империи от иностранных держав стала одной из её важнейших слабостей в последние годы упадка. Турция, опирающаяся исключительно на турецкий народ, — наш лучший путь к сохранению независимости от западных держав."
 TUR_expand_the_aegean_economic_heartland:0 "Расширить экономический центр Эгейского региона"
 TUR_expand_the_aegean_economic_heartland_desc:0 "Эгейские регионы долгое время были самой богатой частью Турции. Хотя это не оригинальный план, дальнейшие инвестиции в их экономику будут поддерживать страну в целом."
 TUR_expand_the_bursa_textile_industry:0 "Расширить текстильную промышленность Бурсы"
 TUR_expand_the_bursa_textile_industry_desc:0 "Эгейский регион Бурса накопил впечатляющую текстильную промышленность. В качестве важного блага мы должны и далее поощрять развитие текстильной промышленности Бурсы."
 TUR_expand_the_izmir_cement_industry:0 "Расширить цементную промышленность Измира"
 TUR_expand_the_izmir_cement_industry_desc:0 "Эгейский регион Измира накопил сильную цементную промышленность. Мы должны и дальше поощрять развитие цемента для укрепления строительной отрасли для всей страны."
 TUR_middle_east_institute_of_technology:0 "Ближневосточный технический институт"
 TUR_middle_east_institute_of_technology_desc:0 "Стремительная индустриализация нашей страны открыла новые возможности для научных исследований и разработок, которыми следует воспользоваться. Создав передовой технический университет в самом сердце страны, мы сможем проводить больше исследований."
 TUR_connecting_the_eastern_provinces:0 "Связать восточные провинции"
 TUR_connecting_the_eastern_provinces_desc:0 "Центральная и восточная Анатолия бедны по сравнению с нашими западными провинциями. Их развитие до уровня остальной страны имеет первостепенное значение для национального единства."
 TUR_modernize_rural_infrastructure:0 "Модернизировать сельскую инфраструктуру"
 TUR_modernize_rural_infrastructure_desc:0 "Значительная часть Анатолии испытывает поразительную нехватку базовой инфраструктуры. Ради блага страны эту проблему необходимо устранить как можно скорее."
 TUR_village_institutes_program:0 "Программа сельских институтов"
 TUR_village_institutes_program_desc:0 "Наши восточные провинции постоянно препятствовали централизации страны. Финансируемые правительством учреждения, призванные направлять социальное и экономическое развитие сельских общин, могут значительно сократить региональный разрыв по всей Турции."
 TUR_village_institutes_focus_days_tt:0 "С момента завершения фокуса §YПрограмма сельских институтов§! прошло не менее 400 дней"
 TUR_village_institutes_focus_current_days_tt:0 "Прошло дней: [?TUR_village_institutes_flag:days|Y0]"
 TUR_eradicate_rural_illiteracy:0 "Искоренить неграмотность в сельской местности"
 TUR_eradicate_rural_illiteracy_desc:0 "Программа сельских институтов уже доказала свою эффективность. Дальнейшее финансирование явно позволит обеспечить качественное образование сельскому населению."
 TUR_black_sea_grain_exports:0 "Экспорт зерна из Черноморского региона"
 TUR_black_sea_grain_exports_desc:0 "В экономике Черноморского региона преобладает сельское хозяйство. Мы должны сделать всё возможное, чтобы превратить эти северные провинции в житницу региона."
 TUR_expand_the_central_railway_networks:0 "Расширить центральную железнодорожную сеть"
 TUR_expand_the_central_railway_networks_desc:0 "Железные дороги — важнейшая часть любой современной страны. Мы должны теснее связать каждый уголок нашей страны."
 TUR_exploit_the_sivas_iron_mines:0 "Разработать рудники Сиваса"
 TUR_exploit_the_sivas_iron_mines_desc:0 "Регион Сиваса богат железной рудой и медью. Разработка этих богатых месторождений принесёт нашей стране значительную пользу."
 TUR_central_anatolian_heavy_industry:0 "Тяжёлая промышленность Центральной Анатолии"
 TUR_central_anatolian_heavy_industry_desc:0 "Тяжёлая промышленность становится важнейшим фактором экономического развития. Турецкая сталь, химическая продукция и материалы для судостроения несомненно найдут своё место на международном рынке."
 TUR_support_malatya_raw_exports:0 "Поддержать экспорт сырья из Малатьи"
 TUR_support_malatya_raw_exports_desc:0 "Юго-восточное побережье благодаря обилию природных ресурсов может стать крупным региональным торговым центром. Для этого нам следует развить местную инфраструктуру."
 TUR_expand_the_ergani_copper_industry:0 "Расширить медную промышленность Эргани"
 TUR_expand_the_ergani_copper_industry_desc:0 "Экспорт меди из Эргани способен стать важной частью турецкой экономики. Мы должны воплотить этот потенциал в жизнь."
 TUR_drill_southeast_anatolia:0 "Провести бурение в Юго-Восточной Анатолии"
 TUR_drill_southeast_anatolia_desc:0 "Во многих районах Ближнего Востока обнаружены богатые запасы нефти. Несомненно, и мы способны создать собственную нефтяную промышленность."
 TUR_expand_the_eastern_railway_networks:0 "Расширить восточную железнодорожную сеть"
 TUR_expand_the_eastern_railway_networks_desc:0 "Для соединения восточных провинций Анатолии предстоит сделать ещё очень многое. Следует выделить дополнительные средства на развитие железных дорог в наших беднейших регионах."
 TUR_develop_the_new_capital:0 "Развивать новую столицу"
 TUR_develop_the_new_capital_desc:0 "Анкара, ставшая центром нашей борьбы за выживание, более чем заслужила право быть столицей молодой республики. Развитие её экономики до уровня прежней османской столицы станет важным шагом национального возрождения Турции."
 TUR_the_industrialization_of_central_anatolia:0 "Индустриализация Центральной Анатолии"
 TUR_the_industrialization_of_central_anatolia_desc:0 "Чтобы сделать Турцию единой страной, необходимо провести индустриализацию по всей Анатолии."
 TUR_tenmak:0 "Основать ТАЭК"
 TUR_tenmak_desc:0 "Западные страны всё чаще рассматривают ядерное деление как источник колоссальной энергии — как для мирных целей, так и для сдерживания противников. Мы не можем позволить себе отстать в этой важнейшей области."
 TUR_funds_for_the_national_struggle:0 "Средства для национальной борьбы"
 TUR_funds_for_the_national_struggle_desc:0 "Мир вновь движется в опасном направлении. Пока европейцы разрывают друг друга на части, Турция должна подготовиться к собственному фронту в любом возможном конфликте. Турки лучше многих знают цену войны, и мы будем готовы."
 TUR_village_institute_program:0 "Программа сельских институтов"
 TUR_village_institute_program_desc:0 "Сельские районы Турции сталкиваются с рядом особых проблем. Многие в правительстве предлагают создать программу «сельских институтов», чтобы удовлетворять потребности сельских центров, не разрушая их экономику и привычный уклад жизни."
 TUR_village_institutes:0 "Сельские институты"
 TUR_village_institutes_desc:0 "Сельские районы сталкиваются с рядом особых проблем. Чтобы решить их, правительство в Анкаре создало программу сельских институтов, призванную улучшить жизнь и образование людей по всей Анатолии."
 TUR_national_struggle_funds:0 "Средства национальной борьбы"
 TUR_national_struggle_funds_desc:0 "Нас вновь ждёт великая национальная борьба. Чтобы двигаться вперёд, Турция должна быть единой и готовой!"
 TUR_implement_western_electronics:0 "Внедрить западную электронику"
 TUR_implement_western_electronics_desc:0 "Электроника — отрасль, которая определит будущее. Мы должны добиться собственного прогресса в этой области."
 TUR_army_of_the_grand_national_assembly_idea:0 "Армия Великого национального собрания"
 TUR_army_of_the_grand_national_assembly_idea_desc:0 "Военные реформы Ататюрка быстро превратили армию Великого национального собрания в профессиональные вооружённые силы, комплектуемые по призыву. Хотя работа ещё не завершена, турецкая армия уже внушает страх, а её солдаты отличаются храбростью и высокой мотивацией."
 TUR_streamline_conscription_idea:0 "Армия Великого национального собрания"
 TUR_streamline_conscription_idea_desc:0 "Военные реформы Ататюрка быстро превратили армию Великого национального собрания в профессиональные вооружённые силы, комплектуемые по призыву. Хотя работа ещё не завершена, турецкая армия уже внушает страх, а её солдаты отличаются храбростью и высокой мотивацией."
 TUR_expand_recruitment_idea:0 "Армия Великого национального собрания"
 TUR_expand_recruitment_idea_desc:0 "Военные реформы Ататюрка быстро превратили армию Великого национального собрания в профессиональные вооружённые силы, комплектуемые по призыву. Последние успехи ещё больше укрепили наши впечатляющие достижения: любой враг, достаточно глупый, чтобы напасть на нашу страну, столкнётся с яростью отлично мобилизованной и исключительно мотивированной армии!"
 TUR_maximize_orientation_idea:0 "Армия Великого национального собрания"
 TUR_maximize_orientation_idea_desc:0 "Военные реформы Ататюрка быстро превратили армию Великого национального собрания в профессиональные вооружённые силы, комплектуемые по призыву. Последние успехи лишь приумножили достигнутое, превратив турецкого солдата в поистине грозную силу на поле боя!"
 TUR_peace_at_home_peace_in_the_world:0 "Мир в стране, мир во всём мире"
 TUR_peace_at_home_peace_in_the_world_desc:0 "«Юртта сулх, джиханда сулх» — мир в стране, мир во всём мире — является основой кемалистской внешней политики. Она предполагает дипломатию, основанную на прагматизме, а не на продолжении исторического соперничества; мирное дипломатическое урегулирование наших разногласий; и, самое главное, понимание того, что внутренний мир и безопасность неизбежно способствуют миру во всём мире, тогда как их разрушение подрывает глобальную стабильность."
 TUR_sectarianism:0 "Разобщённость общества"
 TUR_sectarianism_desc:0 "Нашу молодую республику разделяет множество проблем. В экономическом отношении Эгейский регион во многом напоминает западные страны, тогда как Центральная и Восточная Анатолия обнищали за века неумелого правления. В политике консерваторы, особенно многочисленные в Центральной и Восточной Анатолии, в основном выступают против социальных реформ НРП. Но самой тяжёлой проблемой остаётся стремление этнических курдов на юго-востоке к автономии или даже созданию собственного государства на наших землях. Модернизация страны возможна лишь после преодоления этих разногласий и объединения народов Анатолии под одним флагом."
 TUR_sectarianism1:0 "Разобщённость общества"
 TUR_sectarianism1_desc:0 "Хотя острота общественных противоречий снизилась, многочисленные разногласия по всей стране всё ещё вызывают серьёзную тревогу у центрального правительства. Для превращения в действительно современную страну необходимо и дальше преодолевать эти расколы."
 TUR_sectarianism2:0 "Разобщённость общества"
 TUR_sectarianism2_desc:0 "Хотя разногласия в нашей стране в основном утихли, дальнейшее укрепление национального единства жизненно важно для безопасного и процветающего будущего."
 TUR_sectarianism_1:0 "Разобщённость общества"
 TUR_sectarianism_1_desc:0 "Нашу молодую республику разделяет множество проблем, и в последнее время они, похоже, лишь усугубились. Чтобы двигаться вперёд, необходимо немедленно сосредоточиться на укреплении национального единства."
 TUR_sectarianism_2:0 "Разобщённость общества"
 TUR_sectarianism_2_desc:0 "Разобщённость, без сомнения, стала величайшей проблемой нашей молодой страны и уже угрожает устойчивости турецкого правительства. Чтобы избежать отката, подобного последним годам Османской империи, необходимо немедленно сосредоточиться на укреплении национального единства."
 TUR_neutrality_through_deterrence:0 "Нейтралитет посредством сдерживания"
 TUR_neutrality_through_deterrence_desc:0 "Новый конфликт в Европе вновь становится реальной угрозой. Ради блага страны мы должны держаться подальше от ужасов, неизменно сопровождающих войну."
 TUR_unlocks_hatay_decision_tt:0 "Открывает решение: §YПоднять вопрос Хатая§!."
 TUR_unlocks_saadabad_decision_tt:0 "Открывает решение: §YСаадабадский пакт§!."
 TUR_anglo_turkish_friendship_agreement:0 "Англо-турецкое соглашение о дружбе"
 TUR_anglo_turkish_friendship_agreement_desc:0 "У британцев и нашей страны немало общих интересов, прежде всего забота о хрупком европейском балансе сил. На этой основе нам следует укреплять связи."
 TUR_german_turkish_treaty_of_friendship:0 "Германо-турецкий договор о дружбе"
 TUR_german_turkish_treaty_of_friendship_desc:0 "Германия обладает одной из крупнейших экономик и армий на континенте. Несмотря на возможные идеологические разногласия между нашими странами, поддержание дружественных отношений отвечает интересам обеих сторон."
 TUR_renew_the_soviet_non_aggression_pact:0 "Продлить советско-турецкий пакт о ненападении"
 TUR_renew_the_soviet_non_aggression_pact_desc:0 "Наши связи с Москвой укрепились со времён войны за независимость. Нам следует продолжить этот курс, официально продлив устаревающий пакт о ненападении."
 TUR_amend_the_montreux_convention:0 "Внести поправки в Конвенцию Монтрё"
 TUR_amend_the_montreux_convention_desc:0 "Советы ясно дали понять, что заинтересованы в черноморских проливах. Возможно, в обмен на промышленную помощь и укрепление связей мы сможем предоставить Советскому Союзу дополнительные уступки."
 TUR_renew_the_soviet_non_aggression_pact_focus_days_tt:0 "С момента завершения фокуса §YПродлить советско-турецкий пакт о ненападении§! прошло не менее 105 дней"
 TUR_renew_the_soviet_non_aggression_pact_current_days_tt:0 "Прошло дней: [?TUR_renew_the_soviet_non_aggression_pact_flag:days|Y0]"
 turkey.117.t:0 "Поправки к Конвенции Монтрё?"
 turkey.117.d:0 "[FROM.getAdjective] Мы обратились к нам с предложением о примирении в отношении Конвенции Монтрё, подписанной не несколько лет назад. Они предлагают предоставить нашим войскам свободный доступ в страну, в то время как мы должны защищать их от врагов народа.\nКонтроль над стратегически важными проливами может дать нам недостающее преимущество в Средиземноморье для борьбы с империалистическими амбициями великих держав в регионе. Каким должно быть окончательное решение?"
 turkey.117.a:0 "Эта инициатива нас устраивает. Мы согласны!"
 turkey.117.b:0 "Турки думают, что это их спасёт?"
 turkey.118.t:0 "Советы согласны"
 turkey.118.d:0 "Советы согласились. Хотя усиление их влияния в нашей стране, несомненно, вызовет недовольство, нормализация двусторонних советско-турецких отношений значительно поможет продлить мир в регионе."
 turkey.118.a:0 "Превосходно!"
 turkey.119.t:0 "Советы отказались"
 turkey.119.d:0 "Советы отказались. Хотя успешное заключение этого соглашения, несомненно, вызвало бы недовольство внутри страны, такой исход разочаровывает с точки зрения двусторонних отношений и в ближайшем будущем может создать угрозу миру в регионе."
 TUR_soviet_turkish_trade_agreement:0 "Советско-турецкое торговое соглашение"
 TUR_soviet_turkish_trade_agreement_desc:0 "Советский Союз — набирающая силу держава, с которой лишь немногие страны поддерживают хорошие отношения. Мы можем стать мостом между Советами и западным миром и использовать это положение в собственных интересах."
 TUR_black_sea_trade_agreement:0 "Черноморское торговое соглашение"
 turkey.120.t:0 "Турция предлагает Черноморское торговое соглашение"
 turkey.120.d:0 "Недавно турки предложили нам расширить двустороннюю торговлю. Военные нужды привели к нехватке таких ресурсов, как зерно, крупным экспортёром которого является Турция. Сами турки тем временем проводят индустриализацию. Наш посол считает, что такое соглашение может быть взаимовыгодным. Что мы ответим?"
 turkey.120.a:0 "Мы согласны. Это выгодно всем сторонам."
 turkey.120.b:0 "Нет, это пустая трата времени."
 turkey.121.t:0 "Советы приняли предложение"
 turkey.121.d:0 "Советы приняли наше предложение. Мы рассчитываем окончательно оформить соглашение в ближайшие недели."
 turkey.121.a:0 "Радостная весть."
 turkey.122.t:0 "Советы отклонили предложение"
 turkey.122.d:0 "Советы отклонили наше предложение. Какое разочарование для наших двусторонних отношений."
 turkey.122.a:0 "Разочаровывает."
 TUR_clodius_agreement_desc:0 "Военная экономика Германии зависит от непрерывных поставок хрома, которым богата Анатолия. Возможно, мы сможем использовать это обстоятельство для индустриализации нашей страны."
 turkey.147.t:0 "Соглашение Клодиуса"
 turkey.147.d:0 "В последние недели один из наших дипломатов, Карл Клодиус, заключил сделку с турками. В обмен на небольшую помощь в индустриализации и продолжение дружественных отношений турки предложили нам дешёвый доступ к значительной части своего экспорта хрома, которого нам остро не хватает."
 turkey.147.a:0 "Превосходные новости!"
 turkey.147.b:0 "Ни в коем случае. Немедленно отозвать предложение."
 turkey.148.t:0 "Немцы подписывают соглашение!"
 turkey.148.d:0 "Переговоры с германским министром иностранных дел завершились успешно, и мы достигли взаимовыгодного соглашения. Соглашение Клодиуса официально ратифицировано, и вскоре наша промышленность ощутит его преимущества!"
 turkey.148.a:0 "Луч надежды для нашей экономики!"
 turkey.149.t:0 "Немцы отказываются!"
 turkey.149.d:0 "Несмотря на недели переговоров и достижение, как нам казалось, взаимовыгодного соглашения, немцы в последний момент решили выйти из соглашения Клодиуса, которое значительно расширило бы наши экономические связи."
 turkey.149.a:0 "Позорно."
 TUR_regional_partnerships:0 "Региональные партнёрства"
 TUR_regional_partnerships_desc:0 "У нас появилось множество друзей в регионе. Следует и дальше укреплять эти связи."
 TUR_bicontinental_intervention:0 "Вмешательство на двух континентах"
 TUR_bicontinental_intervention_desc:0 "Мы находимся прямо между двумя величайшими очагами напряжённости в мире. Мы должны ясно дать понять всем странам Балкан и Ближнего Востока, что не станем ждать, пока война сама придёт к нам!"
 TUR_cooperation_against_moscow:0 "Сотрудничество против Москвы"
 TUR_cooperation_against_moscow_desc:0 "Российская империя, а позднее и Советский Союз угнетали тюркские народы, выдвигали нелепые притязания на наши проливы и представляли ещё большую угрозу независимым странам Восточной Европы. Мы должны противостоять этой опасности везде, где она возникает, и объединить тех, кто разделяет наши опасения."
 TUR_cooperation_against_moscow1_tt:0 "Открывает решение: §YПрисоединиться к Антикоминтерновскому пакту§!."
 r56_TUR_join_the_anti_comintern_pact:0 "Присоединиться к Антикоминтерновскому пакту"
 TUR_cooperation_against_berlin:0 "Сотрудничество против Берлина"
 TUR_cooperation_against_berlin_desc:0 "Германия уже нарушила несколько ограничений, наложенных на неё в Версале, и это только начало. Мы должны ясно выступить против её возмутительных притязаний по всей Европе и найти союзников, разделяющих это понимание."
 r56_TUR_renew_the_soviet_non_aggression_pact_decision:0 "Продлить советско-турецкий пакт о ненападении"
 TUR_cooperation_against_berlin1_tt:0 "Открывает решение: §YПродлить советско-турецкий пакт о ненападении§!."
 TUR_anti_colonial_action:0 "Антиколониальные действия"
 TUR_anti_colonial_action_desc:0 "Британцы и французы — раковая опухоль Ближнего Востока. Теперь, когда наша страна стала социалистической, мы должны освободить народы региона от мерзости колониализма!"
 TUR_take_the_shahs_head:0 "Потребовать голову шаха"
 TUR_take_the_shahs_head_desc:0 "Шах является символом британской колониальной эксплуатации иранских ресурсов. Мы потребуем положить этому конец!"
 r56_TUR_offer_kordestan_autonomy:0 "Предложить автономию Курдистану"
 TUR_destroy_iraqs_corrupt_monarchy:0 "Уничтожить коррумпированную монархию Ирака"
 TUR_destroy_iraqs_corrupt_monarchy_desc:0 "Иракская монархия — символ западного империализма в этой стране. Мы положим конец её правлению и создадим социалистическую республику, которая действительно разделяет наши ценности!"
 r56_TUR_offer_sulymaniyah_autonomy:0 "Предложить автономию Сулеймании"
 TUR_liberate_the_peninsula:0 "Освободить полуостров"
 TUR_liberate_the_peninsula_desc:0 "На Аравийском полуострове правят больные, тиранические марионеточные монархи. Мы положим конец этой гнусной тирании!"
 TUR_demand_french_withdrawal_from_syria:0 "Потребовать вывода французских войск из Сирии"
 TUR_demand_french_withdrawal_from_syria_desc:0 "После окончания Великой войны Франция официально получила мандат над исторической османской территорией Сирии. Сирийцы, ваше освобождение от упадочной Франции близко!"
 TUR_the_final_battle_against_global_imperialism:0 "Последняя битва с мировым империализмом!"
 TUR_the_final_battle_against_global_imperialism_desc:0 "Британцы принесли Ближнему Востоку неисчислимые бедствия. Наша последняя битва будет направлена против них и их отвратительной колониальной политики."
 TUR_regional_leadership:0 "Региональное лидерство"
 TUR_regional_leadership_desc:0 "Пока Запад проявляет трусость в час нужды, тираны и империалисты терзают соседние с нами малые страны. Анкара должна возглавить борьбу и стать силой, которой заслуживают малые народы Европы и Ближнего Востока."
 TUR_ankara_pact:0 "Анкарский пакт"
 TUR_join_the_international_community:0 "Присоединиться к международному сообществу"
 TUR_join_the_international_community_desc:0 "В одиночку наше дело обречено. Мы должны обратиться к великим державам мира и привлечь их на сторону нашего правого дела."
 TUR_unlocks_join_allies_decision_tt:0 "Открывает решение: §YПрисоединиться к Союзникам§!."
 TUR_unlocks_join_axis_decision_tt:0 "Открывает решение: §YПрисоединиться к Оси§!."
 r56_TUR_join_the_allies:0 "Присоединиться к Союзникам"
 r56_TUR_join_the_axis:0 "Присоединиться к Оси"
 r56_TUR_deal_for_the_oniki_islands:0 "Сделка по островам Оники"
 r56_TUR_deal_for_the_oniki_islands_desc:0 "Острова Оники у нашего побережья были отняты у нас и переданы похотливым итальянцам, но ещё прежде вероломные греки заявили на них свои права. Родос был турецким и вновь станет турецким!"
 r56_TUR_join_the_comintern:0 "Присоединиться к Коминтерну"
 r56_TUR_alliance_with_the_germans:0 "Союз с Германией"
 r56_TUR_alliance_with_the_french:0 "Союз с Францией"
 r56_TUR_alliance_with_the_russians:0 "Союз с Россией"
 r56_TUR_alliance_with_the_romanians:0 "Союз с Румынией"
 TUR_ally_the_balkan_states:0 "Заключить союз с балканскими странами"
 TUR_ally_the_balkan_states_desc:0 "Балканские страны стоят на перепутье. Мы укажем им путь к более надёжному будущему."
 solidify_the_balkan_pact_tt:0 "Открывает решения §YЗаключить союз с балканскими странами§!."
 r56_TUR_alliance_with_greece:0 "Союз с Грецией"
 r56_TUR_alliance_with_bulgaria:0 "Союз с Болгарией"
 r56_TUR_alliance_with_romania:0 "Союз с Румынией"
 r56_TUR_alliance_with_yugoslavia:0 "Союз с Югославией"
 turkey.123.t:0 "Союз с Турцией?"
 turkey.123.d:0 "Министр иностранных дел Турции обратился к нам с предложением о союзе между нашими странами в рамках их инициативы, направленной на панбалканское сотрудничество. Каким должен быть наш ответ?"
 turkey.123.a:0 "Разумеется. Укрепление связей пойдёт нам на пользу."
 turkey.123.b:0 "Нет, туркам нельзя доверять."
 turkey.124.t:0 "[FROM.GetAdjective] сторона приняла предложение"
 turkey.124.d:0 "The [FROM.GetAdjective] Министр иностранных дел выступил с официальным ответом, заявив о своем приятном принятии альянса."
 turkey.124.a:0 "Мы стоим вместе."
 turkey.125.t:0 "[FROM.GetAdjective] сторона отклонила предложение"
 turkey.125.d:0 "The [FROM.GetAdjective] Министр иностранных дел выступил с официальным ответом, заявив о своем неприятии идеи альянса в настоящее время."
 turkey.125.a:0 "Разочаровывает."
 TUR_militarize_the_saadabat_pact:0 "Военизировать Саадабадский пакт"
 TUR_militarize_the_saadabat_pact_desc:0 "Прочные отношения с другими странами Ближнего Востока являются основой нашей продуманной внешней политики. Пока мир погружается в хаос войны, необходимо ясно дать понять, что наши друзья неприкосновенны."
 has_formed_the_saadabad_pact_tt:0 "Сформирован Саадабадский пакт"
 turkey.126.t:0 "Расширить Саадабадский пакт?"
 turkey.126.d:0 "Министр иностранных дел Турции предложил заключить союз между нашими странами в рамках инициативы по расширению сотрудничества на Ближнем Востоке. Как нам ответить?"
 turkey.126.a:0 "Сообщить туркам, что они могут рассчитывать на нашу поддержку."
 turkey.126.b:0 "Нас это не интересует."
 turkey.127.t:0 "[FROM.GetAdjective] сторона приняла предложение"
 turkey.127.d:0 "Министр иностранных дел [FROM.GetAdjective] государства направил официальный ответ, с удовлетворением сообщив о согласии заключить союз."
 turkey.127.a:0 "Мы довольны."
 turkey.128.t:0 "[FROM.GetAdjective] сторона отклонила предложение"
 turkey.128.d:0 "Министр иностранных дел [FROM.GetAdjective] государства направил официальный ответ, сообщив, что в настоящее время идея заключения союза отклонена."
 turkey.128.a:0 "Разочаровывает."
 TUR_american_lend_lease:0 "Американский ленд-лиз"
 TUR_american_lend_lease_desc:0 "Соединённые Штаты обладают значительной военной промышленностью, которая уже используется для поддержки военных усилий нескольких европейских стран. Турция расположена между Германией и Россией и контролирует важнейшие водные пути, поэтому помощь в укреплении её сдерживающего потенциала, возможно, отвечает интересам обеих сторон."
 turkey.129.t:0 "Ленд-лиз для Турции?"
 turkey.129.d:0 "Турецкий посол "
 turkey.129.a:0 "Да, сохранение Турции как сдерживающей силы отвечает нашим интересам."
 turkey.129.b:0 "Нейтральной стране? Какая нелепость."
 turkey.130.t:0 "Соединённые Штаты согласились"
 turkey.130.d:0 "Соединённые Штаты приняли наше предложение и готовы предоставить небольшое количество снаряжения для содействия расширению наших сухопутных войск."
 turkey.130.a:0 "Соединённые Штаты всегда будут другом нашей страны."
 turkey.131.t:0 "Соединённые Штаты отказались"
 turkey.131.d:0 "Соединённые Штаты отклонили наше предложение, заявив, что не заинтересованы в оказании помощи нейтральной стране."
 turkey.131.a:0 "Разочаровывает."
 TUR_limited_mutual_assistance:0 "Ограниченная взаимная помощь"
 TUR_limited_mutual_assistance_desc:0 "Хотя мы не готовы сражаться с их врагами, очевидно, что контролируемые нами проливы имеют жизненно важное значение для Британии. В обмен на гарантии безопасности этих важных водных путей мы, возможно, сможем добиться от британцев уступок, которые помогут нашей индустриализации."
 TUR_anglo_turkish_friendship_agreement_focus_days_tt:0 "С момента завершения фокуса §YАнгло-турецкое соглашение о дружбе§! прошло не менее 105 дней"
 TUR_anglo_turkish_friendship_agreement_current_days_tt:0 "Прошло дней: [?TUR_anglo_turkish_friendship_agreement_flag:days|Y0]"
 TUR_standardization_idea:0 "Стандартизация"
 TUR_continue_the_military_reorganization:0 "Подготовиться к следующей великой войне"
 TUR_continue_the_military_reorganization_desc:0 "Турецкая Республика имеет мало общего с разваливающейся и небоеспособной поздней османской армией. Однако работа ещё не завершена, и мы не можем бездействовать, пока Европа вновь скатывается к нестабильности и конфликту. Мы должны оставаться силой сдерживания для любой внешней державы, которая попытается встать на пути Турции."
 TUR_found_an_air_war_academy:0 "Основать академию воздушной войны"
 TUR_found_an_air_war_academy_desc:0 "Со времени обретения независимости многие выдающиеся турецкие офицеры ВВС проходили подготовку во Франции и Германии. Теперь настало время создать в Анкаре собственную Турецкую академию военно-воздушных сил, чтобы развивать этот важнейший род современных вооружённых сил."
 TUR_paratrooper_developments:0 "Развитие воздушно-десантных войск"
 TUR_paratrooper_developments_desc:0 "Парашютисты — крайне экспериментальный, но весьма перспективный вид войск специального назначения. Нам следует изучить возможности их применения в нашей армии."
 TUR_medium_bomber_focus:0 "Продолжить импорт западных бомбардировщиков"
 TUR_medium_bomber_focus_desc:0 "Западные страны лидируют в разработке бомбардировочной авиации. Нам следует импортировать их образцы и изучать накопленный опыт."
 TUR_protecting_our_way_of_life:0 "Защитить наш образ жизни"
 TUR_protecting_our_way_of_life_desc:0 "Анатолия – это дом нашего народа, сейчас и навсегда. Наши военно-воздушные силы должны служить для защиты Турции от любой угрозы, с которой сталкивается наша страна."
 TUR_airland_battle:0 "Воздушно-наземное сражение"
 TUR_airland_battle_desc:0 "Бомбардировщики ближней воздушной поддержки оказались решающими в современных наземных атаках. Мы должны продолжать реструктуризацию наших ВВС с помощью координации воздушно-наземных операций в качестве основы."
 TUR_naval_bombers:0 "Вспомогательная авиация флота"
 TUR_naval_bombers_desc:0 "Такие страны, как Италия, уделяют большое внимание бомбардировщикам, действующим в поддержку надводного флота. Эта стратегия хорошо подходит условиям Турции, и, возможно, пришло время создать собственные программы морской бомбардировочной авиации."
 TUR_defending_our_skies:0 "Защитить наше небо"
 TUR_defending_our_skies_desc:0 "Бомбардировки гражданских и промышленных объектов представляют очевидную угрозу. В будущем мы должны быть готовы защищать население от воздушного террора."
 TUR_new_cannon_developments:0 "Разработка новых авиационных пушек"
 TUR_new_cannon_developments_desc:0 "Мы должны сделать всё возможное, чтобы турецкие истребители стали одними из лучших на континенте. Разработка новых авиационных пушек значительно приблизит нас к этой цели."
 TUR_continue_importing_western_designs:0 "Продолжить импорт западных истребителей"
 TUR_continue_importing_western_designs_desc:0 "Западная авиационная промышленность лидирует в производстве современных самолётов. Пока мы не наладим значительное отечественное производство, продолжение их импорта отвечает нашим интересам."
 TUR_rejuvenate_the_great_war_arsenal:0 "Обновить арсенал времён Великой войны"
 TUR_rejuvenate_the_great_war_arsenal_desc:0 "Устаревшее снаряжение остаётся главной проблемой турецких вооружённых сил. Время идёт, и отказ от обновления нашего арсенала времён Великой войны недопустим."
 TUR_begin_economic_mobilization:0 "Начать экономическую мобилизацию"
 TUR_begin_economic_mobilization_desc:0 "Пришло время подготовить турецкую промышленность к войне, в которую неизбежно окажется втянута любая неподготовленная страна."
 TUR_begin_domestic_aircraft_production:0 "Начать отечественное производство самолётов"
 TUR_begin_domestic_aircraft_production_desc:0 "Мы добились впечатляющих успехов в разработке авиации. Следует создать собственную авиационную промышленность, способную воспользоваться этими достижениями."
 TUR_expand_the_turkish_state_arsenal:0 "Расширить Турецкий государственный арсенал"
 TUR_expand_the_turkish_state_arsenal_desc:0 "Турецкий государственный арсенал не способен удовлетворить потребности военного времени. Необходимо развить тяжёлую промышленность до уровня, при котором ни одна разумная держава не решится нам угрожать."
 TUR_doctrine_on_western_lines:0 "Доктрина по западному образцу"
 TUR_doctrine_on_western_lines_desc:0 "Армия Великого национального собрания многому научилась у вооружённых сил европейских стран, особенно Франции и Германии. Анкара должна двигаться вперёд столь же стремительно, как Берлин и Париж."
 TUR_defending_our_borders:0 "Защитить наши границы"
 TUR_defending_our_borders_desc:0 "В то время как Турция обладает множеством естественных средств защиты, расширение укреплений на линии иностранных государств было бы мудрой стратегией в дальнейшем сдерживании враждебности."
 TUR_expand_officer_schools:0 "Расширить Турецкую военную академию"
 TUR_expand_officer_schools_desc:0 "Турецкая военная академия подготовила многих наших величайших офицеров. Её расширение позволит сформировать новое поколение компетентного и гибкого высшего командования."
 TUR_mass_army:0 "Расширить наземные силы"
 TUR_mass_army_desc:0 "Победы Пруссии в XIX веке и Франции в XX столетии во многом обеспечивались широким применением воинской повинности. Нам следует продолжить расширение армии, чтобы стать грозной силой на двух континентах."
 TUR_sharpen_troop_equipment:0 "Совершенствовать снаряжение войск"
 TUR_sharpen_troop_equipment_desc:0 "Современной армии требуется современное вооружение. Будущее турецких вооружённых сил зависит от решительного продвижения к созданию арсенала новейшего оружия."
 TUR_standardize_infantry_equipment:0 "Стандартизация"
 TUR_standardize_infantry_equipment_desc:0 "Стандартизация — важнейший путь к максимальному профессионализму и гибкости. В германской и французской армиях действуют чёткие стандарты, которые мы можем перенять."
 TUR_streamline_conscription:0 "Упорядочить систему призыва"
 TUR_streamline_conscription_desc:0 "Чтобы укомплектовать многочисленные границы действительно мощными сухопутными силами, необходимо упорядочить турецкую систему призыва."
 TUR_logistical_advancements:0 "Развитие военной логистики"
 TUR_logistical_advancements_desc:0 "Война за независимость доказала решающее значение логистики в современной войне. Для успеха армии её современный арсенал должен поддерживаться столь же современной системой снабжения."
 TUR_strengthen_troop_coordination:0 "Укрепить координацию войск"
 TUR_strengthen_troop_coordination_desc:0 "Во время борьбы за выживание мы своими глазами видели, как греческая армия погрузилась в хаос. Модернизация систем тактической связи поможет нам избежать повторения этой катастрофы."
 TUR_infantry_advancements:0 "Совершенствование стрелкового оружия"
 TUR_infantry_advancements_desc:0 "Следующим этапом модернизации армии должно стать доведение нашего стрелкового оружия до уровня Британии и Германии. Финансирование этой задачи имеет первостепенное значение."
 TUR_begin_mechanization_developments:0 "Начать развитие механизации"
 TUR_begin_mechanization_developments_desc:0 "Механизация — неизбежное направление развития войны. Мы должны признать это и стремиться механизировать всю нашу армию."
 TUR_infantry_is_our_backbone:0 "Основа нашей армии"
 TUR_infantry_is_our_backbone_desc:0 "Пехота — основа любой армии. Мы должны вновь уделить этому факту должное внимание и как можно сильнее улучшить её оснащение."
 TUR_tank_centered_force:0 "Будущее общевойсковых сил"
 TUR_tank_centered_force_desc:0 "Недавние конфликты показали, что будущее войны принадлежит тому, кто лучше всего объединит пехоту, бронетехнику и авиацию в единую силу, способную действовать на всех фронтах. Европейские армии уже движутся в этом направлении, и мы последуем за ними."
 TUR_combat_engineers:0 "Боевые инженеры"
 TUR_combat_engineers_desc:0 "В стремительно меняющихся условиях поля боя победит сила, способная импровизировать и приспосабливаться к непредвиденным обстоятельствам."
 TUR_troop_specialization:0 "Турецкие войска специального назначения"
 TUR_troop_specialization_desc:0 "Война на анатолийских рубежах потребует вести оборону на самой разной местности: от побережий, равнин и городов до горных районов. Чтобы добиться успеха на всех фронтах, необходимо перейти к специализации войск."
 TUR_expand_recruitment:0 "Расширить набор"
 TUR_expand_recruitment_desc:0 "Нам следует приложить усилия к дальнейшему расширению сухопутных войск. Крупная и мотивированная армия — лучшая сила сдерживания, на которую может рассчитывать наша страна."
 TUR_maximize_orientation:0 "Повысить стандарты подготовки войск"
 TUR_maximize_orientation_desc:0 "Крупные сухопутные силы обходятся дорого и, возможно, плохо соответствуют будущему войны. Вероятно, нам выгоднее сосредоточиться на улучшении подготовки и вооружения меньшей, но более надёжной армии."
 TUR_continue_the_naval_expansion:0 "Продолжить расширение флота"
 TUR_continue_the_naval_expansion_desc:0 "В отличие от сухопутных войск, турецкий флот почти не модернизировался с тех пор, как мы унаследовали устаревшие османские корабли. Необходимо обновить и усилить его, доведя до уровня остальных вооружённых сил."
 TUR_expand_black_sea_presence:0 "Расширить присутствие в Чёрном море"
 TUR_expand_black_sea_presence_desc:0 "Чёрное море — чрезвычайно важный для нас водный путь. Расширение присутствия вдоль его побережья станет разумным способом обеспечить господствующее положение в регионе."
 TUR_expand_mediteranean_bases:0 "Расширить средиземноморские базы"
 TUR_expand_mediteranean_bases_desc:0 "Средиземное море является важным водным путём для многих стран, включая нашу. Усиление нашего присутствия в регионе должно стать приоритетом."
 TUR_modern_radar:0 "Современные радиолокаторы"
 TUR_modern_radar_desc:0 "Радиолокация — технология, которая изменит мир. Мы должны принять это великое достижение и использовать его для укрепления национальной обороны."
 TUR_amphibious_warfare:0 "Десантная война"
 TUR_amphibious_warfare_desc:0 "Наши потенциальные враги находятся за легко обороняемыми границами. Мы должны уметь делать с ними то, что британцы пытались сделать с нами. Морские десантные операции рискованны, но, несомненно, являются будущим войны."
 TUR_expand_the_golcuk_shipyard:0 "Расширить верфь Гёльджюка"
 TUR_expand_the_golcuk_shipyard_desc:0 "Верфь Гёльджюка стала важной частью нашей судостроительной промышленности. Следует расширить её, чтобы развить достигнутый успех."
 TUR_new_shipyards:0 "Стамбульская военно-морская верфь"
 TUR_new_shipyards_desc:0 "Турция простирается от Чёрного моря до Средиземного. Возвышающейся державе необходим сильный флот, а расширение судостроительной промышленности является важнейшей частью этой задачи."
 TUR_doctrinal_advancement:0 "Извлечь урок из нашего унижения"
 TUR_doctrinal_advancement_desc:0 "В последние годы Османской империи наш флот подвергся жестокому унижению. Мы должны извлечь уроки из тяжёлого прошлого, чтобы ни одна страна больше не смогла принести нашему народу разорение."
 TUR_r56_the_path_of_the_wolf:0 "Путь волка"
 TUR_r56_the_path_of_the_wolf_desc:0 "Наша экономика едва ли способна содержать крупный надводный флот. Скромные и дешёвые подводные силы станут доступным и эффективным средством пережить затяжную войну с любой морской державой региона."
 TUR_balanced_navy:0 "Ведущий надводный флот"
 TUR_balanced_navy_desc:0 "Флот с единственным фокусом уязвим для вражеской адаптации. Несмотря на более высокую стоимость, пригодная для похудения поверхность необходима, чтобы удержаться в длительной войне."
 TUR_control_our_seas:0 "Контролировать наши моря"
 TUR_control_our_seas_desc:0 "Будучи стремительно возрождающейся державой, мы должны вновь добиться господствующего положения на окружающих нас водных путях. Гордой стране нужен гордый флот для защиты своих интересов."
 TUR_modern_sub_surface_peripherals:0 "Современное оборудование подводного флота"
 TUR_modern_sub_surface_peripherals_desc:0 "Благодаря новой специализации на морском сдерживании турецкие подводные лодки станут силой, которой будут бояться все, кто угрожает нашей стране."
 TUR_diplomatic_effort:0 "Дипломатические усилия"
 TUR_diplomatic_effort_desc:0 "Чтобы защищать свои интересы, мы должны активно действовать на международной арене."
 TUR_the_montreux_convention_r56:0 "Конвенция Монтрё"
 TUR_the_montreux_convention_r56_desc:0 "Район проливов остаётся демилитаризованным со времён Великой войны, но так не может продолжаться. Мы должны заручиться международной поддержкой для восстановления полного суверенитета."
 TUR_invite_to_faction_tooltip:0 "будет приглашено во фракцию [Root.GetFlag]§Y[Root.GetName]§!.\n"
 turkey.10.t:0 "[From.GetName] присоединяется к альянсу «[Root.GetFactionName]»!"
 turkey.10.d:0 "Признав необходимость единства перед лицом угроз, окружающих наши страны со всех сторон, [From.GetLeader] сегодня объявил всему миру, что [From.GetName] заключает договор с [Root.GetName] ради нашей общей безопасности."
 turkey.10.a:0 "[Root.GetName] и [From.GetName] отныне стоят плечом к плечу как братья."
 turkey.11.t:0 "[From.GetName] отказывается вступить в альянс «[Root.GetFactionName]»"
 turkey.11.d:0 "В глупой попытке мнимого самосохранения [From.GetLeader] сегодня объявил, что [From.GetName] воздержится от любых дипломатических действий, которые могут быть восприняты как угроза могущественным соседям. Поэтому наше предложение вступить в альянс «[Root.GetFactionName]» было отклонено."
 turkey.11.a:0 "Лишь единство обеспечит нам безопасность."
 turkey.23.t:0 "Хатай — Франция отказывает"
 turkey.23.d:0 "Французское правительство отклонило наши требования! Они утверждают, что у нас нет законного права на территорию Хатая."
 turkey.23.a:0 "Мы разберёмся с этим позже."
 turkey.4.t:0 "Вопрос о турецких проливах"
 turkey.4.d:0 "Район вокруг Босфора и Дарданелл был демилитаризован по Лозаннскому договору. Однако в нынешнем состоянии этот важный регион может попасть не в те руки. Лучше позволить туркам восстановить там полный суверенитет."
 turkey.4.a:0 "Согласны."
 turkey.3.t:0 "Конвенция Монтрё"
 turkey.3.d:0 "Международное сообщество разрешило нам вновь милитаризировать Босфорские проливы. Это, несомненно, огромное достижение для Анкары и турецкого народа, которое ускорит наше возрождение!"
 turkey.3.a:0 "Великая победа!"
 staunch_traditionalist:0 "Убеждённый традиционалист"
 TUR_imperialism_focus:0 "Империализм"
 TUR_traumatized_nation:0 "Травмированная нация"
 TUR_traumatized_nation_desc:0 "Наша война за независимость завершилась 24 июля 1923 года подписанием Лозаннского договора. Несмотря на победу, цена для страны оказалась сокрушительной. Никто не знает, как долго последствия войны будут преследовать наш народ..."
 TUR_generic_staunch_traditionalist:0 "Салих Бозок"
 turkish_research_name:0 "Турецкий обмен технологиями"
 turkish_research_desc:0 "Турецкий обмен технологиями"
 TUR_kemalism:0 "Кемализм"
 GER_agrees_to_friendship:0 "Германо-турецкий договор о дружбе подписан."
 TUR_turkish_neutrality:0 "Турецкий нейтралитет"
 TUR_english_industral_aid:0 "Британская промышленная помощь"
 TUR_english_industral_aid_rejected:0 "Британская промышленная помощь отклонена"
 TUR_GER_friendship_trade:0 "Германо-турецкий договор о дружбе"
 TUR_GER_friendship:0 "Германо-турецкий договор о дружбе"
 TUR_annex_korea_KOR_tt:0 "Имеет общую границу с [KOR.GetNameDef] или владеет Кореей."
 TUR_annex_korea_MAN_tt:0 "Имеет общую границу с [MAN.GetNameDef] или владеет Маньчжурией."
 TUR_kemalist_officers_loyalty_increase_by_half_tt:0 "После принятия этого решения §Y2§! раза улучшает национальный дух §YКемалистские офицеры§!.\n"
 TUR_the_sadabat_pact:0 "Саадабадский пакт"
 TUR_the_sadabat_pact_desc:0 "По приглашению короля Афганистана нас позвали во дворец Саадабад в Иране для обсуждения возможного пакта о ненападении между свободными и независимыми странами Ближнего Востока. Мы не можем позволить мелким распрям мешать нам, когда со всех сторон нависают куда более серьёзные угрозы."
 TUR_continue_the_moderate_course:0 "Продолжить умеренный курс"
 TUR_continue_the_moderate_course_desc:0 "НРП направила Турцию на путь процветания и восстановила наш статус в западном мире. Будущее Турции, несомненно, связано с продолжением курса Ататюрка и следованием его великим идеалам."
 r56_TUR_a_legacy_worth_fighting_for:0 "Наследие, за которое стоит сражаться"
 r56_TUR_a_legacy_worth_fighting_for_desc:0 "Война за независимость Турции завершилась 24 июля 1923 года, окончательно закрепив власть кемалистов в стране. Настали тяжёлые времена, и приближается война. Воля Ататюрка привела нас сюда и проведёт до самого конца!"
 TUR_instate_constitutional_secularism:0 "Закрепить светскость в конституции"
 TUR_instate_constitutional_secularism_desc:0 "Светскость — основополагающий принцип нашей страны. Закрепив эту важнейшую стрелу кемалистской политики в конституции республики, мы продемонстрируем этот факт всему миру!"
 TUR_instate_constitutional_secularism_tt:0 "Открывает решение: §YИнициатива государственного образования§!."
 TUR_nationalist_policies:0 "Националистическая политика"
 TUR_nationalist_policies_desc:0 "Главная обязанность турецкого правительства — служить интересам нации. Мы должны продолжить непоколебимую преданность НРП Турции!"
 r56tree_kurdish_separatism:0 "Курдский сепаратизм"
 r56tree_limited_kurdish_separatism:0 "Ограниченный курдский сепаратизм"
 TUR_nationalist_policies_tt:0 "Открывает решение: §YУсилия по умиротворению Тунджели§!."
 TUR_nationalist_policies2_tt:0 "Открывает решение: §YУсилия по умиротворению Вана§!."
 TUR_pacification_efforts_in_tunceli:0 "Усилия по умиротворению Тунджели"
 TUR_pacification_efforts_in_van:0 "Усилия по умиротворению Вана"
 TUR_further_agricultural_cooperative_reform:0 "Продолжить реформу сельскохозяйственных кооперативов"
 TUR_further_agricultural_cooperative_reform_desc:0 "Крестьяне нашей страны слишком долго жили, трудились и проливали кровь, пока собственное правительство лишь выжимало из них всё до последней капли! Одной из главных задач правительства станет защита уровня жизни людей, благодаря которым существует наша республика."
 TUR_mechanize_the_farming_sector:0 "Механизировать сельское хозяйство"
 TUR_mechanize_the_farming_sector_desc:0 "Механизация турецкого сельского хозяйства — масштабная и долгосрочная задача. Мы будем неуклонно двигаться вперёд, пока турецкий земледелец не станет настолько эффективным, насколько это возможно!"
 TUR_mechanization_efforts:0 "Усилия по механизации"
 TUR_continue_ataturks_reforms:0 "Продолжить реформы Ататюрка"
 TUR_continue_ataturks_reforms_desc:0 "Под руководством Исмета Инёню Турция находится в надёжных руках, необходимых для её дальнейшего развития. Ни один человек не способен полностью унаследовать мантию нашего Ататюрка, но мы твёрдо верим, что в руках Инёню страна обретёт лучшее будущее."
 TUR_ataturk_has_died_tt:0 "§YМустафа Кемаль Ататюрк§! умер"
 TUR_cult_of_the_marshal:0 "Культ маршала"
 TUR_cult_of_the_marshal_desc:0 "Для нас великая честь вновь увидеть великого маршала страны Февзи Чакмака в политике. Его преданность турецкому народу уступает лишь преданности самого Ататюрка. Но главное — его правление гарантирует одно: Турецкая Республика находится в надёжных руках!"
 r56_TUR_hail_to_the_marshal:0 "Слава маршалу!"
 r56_TUR_hail_to_the_marshal_desc:0 "Февзи Чакмак — единственный человек в нашей стране, действительно способный унаследовать мантию Ататюрка! Эта воля будет запечатлена повсюду!"
 TUR_war_bonds:0 "Военные облигации"
 TUR_war_bonds_desc:0 "Конфликт снова на подходе. Даже слепой человек видит опасность в том, чтобы остаться неподготовленным. Усилия по сбору средств через военные облигации на добровольной основе станут отличным способом начать расширение наших вооруженных сил!"
 TUR_war_bonds_tt:0 "Открывает решения по возобновлению §YСредств национальной борьбы§! после истечения срока действия."
 r56_TUR_renew_the_national_struggle_funds:0 "Возобновить средства национальной борьбы"
 TUR_turkish_grain_board:0 "Турецкое зерновое управление"
 TUR_turkish_grain_board_desc:0 "Хотя наша страна производит много зерна, она всё ещё уязвима перед дефицитом, который может привести к катастрофическим последствиям. Мы должны сделать всё возможное для стабилизации аграрного рынка и защиты этой хрупкой системы от краха."
 TUR_r56_turkish_grain_board_idea:0 "Турецкое зерновое управление"
 TUR_wartime_rationing:0 "Нормирование военного времени"
 TUR_wartime_rationing_desc:0 "Мир вновь охвачен хаосом. Несмотря на непопулярность этой меры, мы должны гарантировать армии доступ к ресурсам, необходимым для защиты страны."
 TUR_wealth_tax:0 "Налог на имущество"
 TUR_wealth_tax_desc:0 "Некоторые группы в нашей республике контролируют огромные капиталы, не приносящие никакой пользы народу или правительству. Предложено начать облагать эти активы налогом, и мы воплотим эту инициативу в жизнь."
 TUR_r56_varlik_vergisi:0 "Варлык вергиси"
 TUR_renew_the_democratic_reforms:0 "Возобновить демократические реформы"
 TUR_renew_the_democratic_reforms_desc:0 "Наконец настало время продолжить переход к демократии. Это великое начинание слишком долго откладывалось, но лучшего момента для его осуществления не найти!"
 TUR_renew_the_democratic_reforms_tt:0 "Открывает решение: §YЗаявить о необходимости оппозиции."
 r56_TUR_emphasize_the_need_for_opposition:0 "Подчеркнуть необходимость оппозиции"
 r56_TUR_emphasize_the_need_for_opposition_desc:0 "Мы не можем называть себя демократической страной, не допуская создания полноценной оппозиционной партии. Необходимо признать действительность и разрешить формирование значимого демократического движения вне кемализма."
 r56_TUR_end_the_cult_of_personality:0 "Покончить с культом личности"
 r56_TUR_end_the_cult_of_personality_desc:0 "Культ личности Ататюрка был необходимым злом во время нашего пути сквозь ад. Теперь, когда республика вступает в новую эпоху, настало время покончить с культом личности Инёню. Наследие НРП должно опираться на безупречное государственное управление, а не на пропагандистский вымысел!"
 TUR_expand_land_reform:0 "Расширить земельную реформу"
 TUR_expand_land_reform_desc:0 "Необходимость земельной реформы возникла ещё до появления самой Турецкой Республики. Мы должны продолжать добиваться успехов на этом важнейшем направлении!"
 TUR_r56_expand_land_reform_idea:0 "Меры по проведению земельной реформы"
 TUR_ministry_of_labor_and_social_security:0 "Министерство труда и социальной защиты"
 TUR_ministry_of_labor_and_social_security_desc:0 "Мы должны признать трудности, с которыми турецкие рабочие сталкиваются на своих рабочих местах. Нам следует трудиться ради народа столь же усердно, как он трудился ради нас."
 TUR_accomplishing_ataturks_dream:0 "Осуществить мечту Ататюрка"
 TUR_accomplishing_ataturks_dream_desc:0 "Ататюрк представлял Турцию по-настоящему свободной и демократической. Пришло время воплотить эту мечту в жизнь; сегодняшний день ознаменует начало золотого века нашей республики!"
 TUR_further_constitutional_reform:0 "Продолжить конституционную реформу"
 TUR_further_constitutional_reform_desc:0 "Наша демократия ещё молода и хрупка. Мы должны развить уже начатые преобразования и ещё решительнее продолжить курс на вестернизацию!"
 TUR_new_state_enterprise:0 "Новое государственное предприятие"
 TUR_new_state_enterprise_desc:0 "Обстановка становится стабильнее. Теперь мы можем выделить больше средств на создание новых турецких предприятий в важнейших промышленных центрах."
 TUR_expand_the_village_institute_program:0 "Расширить программу сельских институтов"
 TUR_expand_the_village_institute_program_desc:0 "Программа сельских институтов уже доказала свою успешность. Следует выделить дополнительные средства для расширения наших замыслов."
 TUR_expand_the_village_institutes_program_tt:0 "Открывает решения §YОбучение на турецком языке§!"
 TUR_turkish_language_schooling_tunceli:0 "Обучение на турецком языке (Тунджели)"
 turkish_language_schooling_tunceli_tt:0 "Выполнено решение §YУсилия по умиротворению Тунджели§!"
 TUR_turkish_language_schooling_van:0 "Обучение на турецком языке (Ван)"
 turkish_language_schooling_van_tt:0 "Выполнено решение §YУсилия по умиротворению Вана§!"
 TUR_turkish_language_schooling_diyakbir:0 "Обучение на турецком языке (Диярбакыр)"
 TUR_turkish_language_schooling_hakkari:0 "Обучение на турецком языке (Хаккяри)"
 TUR_expand_the_centralization_efforts:0 "Расширить меры по централизации"
 TUR_expand_the_centralization_efforts_desc:0 "Централизация, проведённая правительством Ататюрка, стремительно продвинула страну вперёд. Под нашим руководством этот курс будет продолжен."
 TUR_solidify_the_dictatorship:0 "Укрепить диктатуру"
 TUR_solidify_the_dictatorship_desc:0 "Чакмак окончательно утвердился в качестве преемника Ататюрка. Теперь настало время показать это всему миру!"
 TUR_befriend_the_fascist_council:0 "Сблизиться с фашистским советом"
 TUR_befriend_the_fascist_council_desc:0 "Среди различных европейских идеологий фашизм появился сравнительно недавно, но, что важнее, обладает огромным потенциалом для нашей страны. Он породил движения во всех уголках континента и поведёт Турцию вперёд!"
 TUR_relax_the_secular_policies:0 "Смягчить светскую политику"
 TUR_relax_the_secular_policies_desc:0 "Светская политика НРП оттолкнула слишком многих граждан нашей страны. Продолжая придерживаться республиканских и националистических ценностей, нам следует смягчить непримиримо светский курс Ататюрка."
 TUR_golden_age_of_the_republic:0 "Золотой век республики"
 TUR_golden_age_of_the_republic_desc:0 "Многовековой упадок Османской империи, годы ужасов после войны за независимость и республиканские внутренние конфликты остались позади. Несмотря на бесчисленные трудности, XX век войдёт в историю как время, когда народ из ничего создал для себя золотой век!"
 TUR_further_eastern_developments:0 "Продолжить развитие восточных областей"
 TUR_further_eastern_developments_desc:0 "Несмотря на труды Ататюрка, восточные провинции по-прежнему неузнаваемо отличаются от западных. Следует уделить ещё больше внимания их развитию и индустриализации Восточной Анатолии."
 TUR_consolidate_the_chp:0 "Укрепить НРП"
 TUR_consolidate_the_chp_desc:0 "Фашизм в Турции достиг невиданной прежде силы. Фашистское крыло НРП наконец получило возможность сосредоточить власть в своих руках, и мы немедленно ею воспользуемся!"
 r56_TUR_teach_the_sun_language_theory:0 "Преподавать теорию солнечного языка"
 r56_TUR_teach_the_sun_language_theory_desc:0 "Теория солнечного языка, официально поддержанная Ататюрком, выводит все современные языки из тюркских корней. Незначительная академическая поддержка за пределами нашей страны не помешает нам преподавать эту истину народу!"
 TUR_military_youth:0 "Военизированная молодёжь"
 TUR_military_youth_desc:0 "Такие страны, как Германия, создали военные молодёжные организации для укрепления грандиозной политики ревностного национализма. Мы последуем этим путём."
 TUR_pan_turkism:0 "Пантюркизм"
 TUR_pan_turkism_desc:0 "Тюркские народы Центральной Азии — наши братья, и право на самоопределение требует предоставить им возможность объединиться с нашей республикой. Нет более достойной цели для борьбы, чем освобождение наших собратьев!"
 TUR_reclaim_ataturks_home:0 "Вернуть родину Ататюрка"
 TUR_reclaim_ataturks_home_desc:0 "Захват упадочными греками Салоник у нашей ослабленной и разобщённой страны стал национальной трагедией. Теперь, объединившись, подготовившись и преисполнившись гордости, мы вернём то, что принадлежит нам по праву!"
 TUR_free_the_bulgarian_turks:0 "Освободить болгарских турок"
 TUR_free_the_bulgarian_turks_desc:0 "В Болгарии проживает значительное население турецкого происхождения, многие представители которого были лишены голоса центральным правительством. Они немедленно свяжут свою судьбу с Турцией!"
 TUR_strike_east:0 "Ударить на восток"
 TUR_strike_east_desc:0 "Персы удерживают земли, по праву принадлежащие нам. Наконец настало время освободить тюркские народы Ирана от многолетнего угнетения!"
 TUR_our_final_battle:0 "Наша последняя битва"
 TUR_our_final_battle_desc:0 "Мы больше никогда не потерпим, чтобы наши собратья оставались под чужеземным владычеством или становились жертвами навязанного «компромисса». Турция больше не будет второстепенной державой в мире сильных стран. Мы двинемся в Центральную Азию и освободим тех, кто принадлежит к нашему народу!"
 TUR_our_final_battle_tt:0 "Открывает решения §YИнтеграция Центральной Азии§!"
 r56_TUR_integrate_turkmenistan:0 "Интегрировать Туркменистан"
 r56_TUR_integrate_uzbekistan:0 "Интегрировать Узбекистан"
 r56_TUR_integrate_kazakhstan:0 "Интегрировать Казахстан"
 r56_TUR_integrate_kyrgyzstan:0 "Интегрировать Киргизию"
 r56_TUR_integrate_kazan:0 "Интегрировать Казань"
 TUR_support_the_conservative_opposition:0 "Поддержать консервативную оппозицию"
 TUR_support_the_conservative_opposition_desc:0 "Политика Ататюрка зашла слишком далеко и не отражает волю народа. Мы должны возвысить турецкий народ и покончить с недемократической светскостью НРП. Место ислама в нашей жизни очевидно, и даже если лишь мы признаём эту истину, то будем жить свободными или умрём!"
 TUR_the_fight_for_popular_mandate:0 "Борьба за народный мандат"
 TUR_the_fight_for_popular_mandate_desc:0 "Каждый шаг вперёд должен опираться на народный мандат. Наша организация ничего не значит без тех, кто нас поддерживает. Народная воля приведёт нас к победе и станет опорой страны!"
 r56_TUR_rally_across_the_countryside:0 "Провести митинги в сельской местности"
 r56_TUR_rally_across_the_countryside_desc:0 "Сельское население — наша крупнейшая опора, и мы должны ещё активнее привлекать его на свою сторону. Мы проведём митинги среди сторонников по всей сельской Анатолии и ясно покажем: мы служим им, а не наоборот."
 TUR_no_more_humiliations:0 "Больше никаких унижений"
 TUR_no_more_humiliations_desc:0 "Всякий раз, когда Османская империя проявляла хотя бы малейшую слабость, предатели внутри страны наносили удар. Ататюрк остановил наши потери лишь ценой постоянных уступок Западу. Довольно!"
 TUR_motion_with_four_signatures:0 "Предложение с четырьмя подписями"
 TUR_motion_with_four_signatures_desc:0 "Большинство в наших рядах разделяет недовольство правительством. Обращаясь к народу, мы должны столь же ясно изложить требования властям: после смерти Ататюрка турецкое общество готово к демократии, и мы не остановимся, пока не добьёмся её!"
 TUR_call_for_protests_in_the_capital:0 "Призвать к протестам в столице"
 TUR_call_for_protests_in_the_capital_desc:0 "Народ поддерживает консервативное дело. Мы должны ясно показать не только руководителям страны, но и всему миру, что граждане требуют положить конец однопартийному господству НРП!"
 TUR_protests_in_the_capital_idea:0 "Протесты в столице"
 TUR_lead_the_rural_masses:0 "Возглавить сельские массы"
 TUR_lead_the_rural_masses_desc:0 "Сельское население, благодаря которому существует наша страна, почти не имеет права голоса в управлении ею. Мы должны ясно показать, что намерены изменить это положение."
 TUR_demand_free_elections:0 "Потребовать свободных выборов"
 TUR_demand_free_elections_desc:0 "Наше влияние на политическую жизнь страны слишком велико, чтобы правительство могло нас остановить. Мы немедленно потребуем свободных выборов, лишив НРП чрезмерной власти!"
 r56_TUR_end_inonus_cult_of_personality:0 "Покончить с культом личности Инёню"
 r56_TUR_end_inonus_cult_of_personality_desc:0 "Прежде всего наш долг перед народом — отменить губительную политику НРП. Культ личности нашего «национального вождя» должен быть немедленно разрушен!"
 TUR_liberalize_the_national_economy:0 "Либерализовать национальную экономику"
 TUR_liberalize_the_national_economy_desc:0 "Политика этатизма выполнила свою задачу, а в других областях потерпела неудачу. Частные инвестиции поведут экономику вперёд!"
 TUR_specialization_led_development:0 "Развитие на основе специализации"
 TUR_specialization_led_development_desc:0 "Годы этатизма, построенного на необычной смеси различных экономических систем, недостаточно приблизили Турцию к современной экономике. Мы направим страну по новому пути, основывая хозяйство каждого региона на его специализированных отраслях."
 TUR_expand_foreign_trade:0 "Расширить внешнюю торговлю"
 TUR_expand_foreign_trade_desc:0 "История показывает, что наиболее процветают страны, признающие пределы собственного производства. Вместо дальнейшего следования провальной автаркии мы возродим баяристский курс на активную торговлю с западными державами!"
 TUR_amend_the_secular_policies:0 "Пересмотреть светскую политику"
 TUR_amend_the_secular_policies_desc:0 "Светская политика НРП зашла слишком далеко и показала полное пренебрежение народной волей. Мы немедленно ослабим её хватку над страной!"
 TUR_peace_between_turks_and_kurds:0 "Мир между турками и курдами"
 TUR_peace_between_turks_and_kurds_desc:0 "Большая часть турецко-курдского конфликта была вызвана избытком презренной светской политики. Мы немедленно прекратим этот конфликт, положив конец «прогрессу» ТЭЦ и объединив нацию под видом нашего мусульманского единства!"
 TUR_end_the_ban_on_the_arabic_adhan:0 "Отменить запрет на азан на арабском языке"
 TUR_end_the_ban_on_the_arabic_adhan_desc:0 "Запрет на азан на арабском языке противоречит принципам ислама, которым следует наш народ. Он будет немедленно отменён."
 TUR_overthrow_inonus_government:0 "Свергнуть правительство Инёню"
 TUR_overthrow_inonus_government_desc:0 "Упадок НРП больше не будет терпим. Мы официально поднимем восстание против этих предателей и восстановим утраченное!"
 TUR_stabilize_the_nation:0 "Стабилизировать страну"
 TUR_stabilize_the_nation_desc:0 "Наконец настало время восстановить то, чем мы некогда обладали, и вывести турецкий народ из кошмара республиканского правления!"
 TUR_lift_the_caliphates_exile:0 "Отменить изгнание халифа"
 TUR_lift_the_caliphates_exile_desc:0 "Наш законный халиф Абдул-Меджид II находится в изгнании с 1924 года и ныне живёт во Франции. Настало время вернуть халифу его место в судьбе нашей страны!"
 TUR_caliph_abdulmejid_ii:0 "Халиф Абдул-Меджид II"
 TUR_dismantle_the_republican_institutions:0 "Упразднить республиканские учреждения"
 TUR_dismantle_the_republican_institutions_desc:0 "Республиканцы осквернили нашу страну пороками светскости, прикрываясь стремлением к «прогрессу». Истинный прогресс заключается в верности самим себе и единстве действий, пока окружающие страны рушатся."
 TUR_restore_the_imperial_divan:0 "Восстановить Имперский диван"
 TUR_restore_the_imperial_divan_desc:0 "Военное правление принесло варварство и повлекло ненужные репрессии. Восстановление османской гражданской администрации имеет первостепенное значение для возвращения законной власти над народом!"
 TUR_bureaucratic_modernization:0 "Бюрократическая модернизация"
 TUR_bureaucratic_modernization_desc:0 "Нельзя просто воссоздать старую и разложившуюся османскую бюрократию, возвращаясь к прежним национальным ценностям. По мере движения времени вперёд мы должны оставить позади упадок коррупции и кумовства."
 TUR_bureaucratic_modernization_idea:0 "Бюрократическая модернизация"
 TUR_continue_military_rule:0 "Продолжить военное правление"
 TUR_continue_military_rule_desc:0 "Гражданские правительства раз за разом подводили Османскую империю. Освободителями нашего народа всегда становились непреклонные военные, и это доказывает, что руководство страной лучше всего доверить им!"
 TUR_military_first_policies:0 "Военные прежде всего"
 TUR_military_first_policies_desc:0 "Для осуществления своих замыслов в отношении страны военным требуется огромная доля наших ресурсов. Мы предоставим им всё необходимое."
 TUR_military_first_idea:0 "Военные прежде всего!"
 TUR_solidify_the_pan_islam_unity:0 "Укрепить панисламское единство"
 TUR_solidify_the_pan_islam_unity_desc:0 "Силы ислама раз за разом объединяли нас в самые тяжёлые времена. Так будет до самого конца!"
 TUR_solidify_the_pan_islam_unity_idea:0 "Панисламское единство"
 TUR_western_detente:0 "Разрядка с Западом"
 TUR_western_detente_desc:0 "Западные страны — необходимое зло. Наше будущее должно строиться на том, чтобы сталкивать их друг с другом, пока мы не станем достаточно сильны для иного курса."
 TUR_liberalize_the_economy:0 "Либерализовать экономику"
 TUR_liberalize_the_economy_desc:0 "Политика жесткого государственного вмешательства сделала нашу экономику вялой. Мы должны вновь сосредоточиться на расширении торговых связей и приватизации жизненно важных секторов, чтобы мы могли стать экономическим центром мусульманского мира!"
 TUR_liberal_economic_reforms_idea:0 "Либеральные экономические реформы"
 TUR_pragmatic_expansionism:0 "Прагматичный экспансионизм"
 TUR_pragmatic_expansionism_desc:0 "За прошедшие столетия наша империя лишилась значительной части территорий. Попытка вернуть эти земли войной породит лишь нестабильность, а затем приведёт к полному уничтожению русским медведем. Мы будем медленно возвращаться к величию, соблюдая мировой порядок."
 TUR_pragmatic_expansionism_tt:0 "Открывает решения §YПрагматичный экспансионизм§!"
 r56_TUR_syria_for_alliance:0 "Сирия в обмен на союз"
 turkey.141.t:0 "Дружба с османами?"
 turkey.141.d:0 "Османский посол обратился к нашему находящемуся в изгнании министру иностранных дел в Лондоне с просьбой официально принять их в Союзники, что значительно приблизило бы освобождение нашей метрополии. Однако их членство зависит от одного условия: мы должны отказаться от притязаний на историческую Французскую Сирию, которую они, вероятно, намерены присоединить. Как ответить на это неожиданное предложение?"
 turkey.141.a:0 "Нам нужны все друзья, каких только можно найти."
 turkey.141.b:0 "Сирия принадлежит нам, что бы ни говорили оккупанты!"
 turkey.142.t:0 "Французы согласились!"
 turkey.142.d:0 "Считая это неизбежным, [FROM.getAdjective] Дипломаты решили не испытывать свою судьбу и сочли положительным ответ на нашу скромную просьбу. Мы будем двигаться вперед и немедленно займем спорную территорию!"
 turkey.142.a:0 "Моё, моё, всё это моё!"
 turkey.143.t:0 "Французы отказались"
 turkey.143.d:0 "Наш посол получил от представителей [FROM.getAdjective] государства официальное осуждение нашей скромной просьбы. Возможно, придётся проглотить эту горькую пилюлю и смириться с немыслимым. Впрочем, сохранить достоинство в этой ситуации можно и при помощи агрессивной дипломатии."
 turkey.143.a:0 "Разочаровывает."
 turkey.143.b:0 "Тогда мы всё равно её заберём!"
 turkey.144.t:0 "The [TUR.GetAdjective] Запросить Кипр"
 turkey.144.d:0 "Посол [TUR.GetNameDefCap] обратился к нашему министру иностранных дел в Лондоне с официальной просьбой передать их новому государству средиземноморский остров Кипр, ссылаясь на положительное влияние этого шага на наши отношения. Мы не знаем, насколько далеко они готовы зайти ради получения Кипра, однако согласие заметно укрепило бы наши связи. Что ответить?"
 turkey.144.a:0 "Это меньшее, что мы можем сделать для новых друзей!"
 turkey.144.b:0 "Нет, Кипр принадлежит нам, и мы его заслужили."
 turkey.145.t:0 "Британцы согласились!"
 turkey.145.d:0 "Британцы приняли наше предложение, и сегодня остров Кипр был официально передан под наше управление."
 turkey.145.a:0 "Победа англо-[TUR.GetAdjective] Отношения!"
 turkey.146.t:0 "Британцы отказались"
 turkey.146.d:0 "К сожалению, британцы отклонили наше предложение передать Кипр нам в аренду."
 turkey.146.a:0 "Разочаровывает."
 TUR_restore_the_imperial_borders:0 "Восстановить имперские границы"
 TUR_restore_the_imperial_borders_desc:0 "Трагический многовековой упадок лишил нас важнейших территорий. Мы должны восстановить прежние владения и стать державой, которой нам было суждено быть!"
 TUR_amicable_ties_across_the_middle_east:0 "Дружественные связи на Ближнем Востоке"
 TUR_amicable_ties_across_the_middle_east_desc:0 "Нашим собратьям на Ближнем Востоке нужна настоящая держава, способная направить их. Мы станем такой державой."
 turkey.138.t:0 "Османская империя предлагает гарантии"
 turkey.138.d:0 "Министр иностранных дел Османской империи обратился к нам сегодня, предлагая безусловную поддержку против нападений иностранных держав, что имеет явное, косвенное значение: Расширение мощного британского и советского влияния по всему региону не будет допускаться. Что мы можем сказать о шокирующем развитии событий со стороны Османской империи?"
 turkey.138.a:0 "Разумеется!"
 turkey.138.b:0 "Почему они решили, что нам нужна их помощь?"
 turkey.139.t:0 "[FROM.GetAdjective] сторона согласилась!"
 turkey.139.d:0 "Министр иностранных дел [FROM.GetAdjective] государства направил официальный ответ, выразив готовность к дальнейшему сотрудничеству. Хотя это и было неожиданно, для нашей империи это несомненно великая дипломатическая победа!"
 turkey.139.a:0 "Мы довольны."
 turkey.140.t:0 "[FROM.GetAdjective] сторона отказалась."
 turkey.140.d:0 "Министр иностранных дел [FROM.GetAdjective] государства направил официальный ответ, заявив о желании избежать «нарушения регионального баланса сил»."
 turkey.140.a:0 "Разочаровывает."
 TUR_one_persian_ottoman_war_to_end_them_all:0 "Последняя персидско-османская война"
 TUR_one_persian_ottoman_war_to_end_them_all_desc:0 "Персы издавна соперничали с Османской империей. Теперь наконец представилась возможность подчинить их земли и окончательно утвердить наше господство над мусульманским миром!"
 TUR_one_persian_ottoman_war_to_end_them_all_requirement_tt:0 "Если фокус §YВосстановить имперские границы§! не выполнен:"
 TUR_arbiter_of_the_muslim_world:0 "Арбитр мусульманского мира"
 TUR_arbiter_of_the_muslim_world_desc:0 "19-й век травмировал мусульманский мир, когда народы вокруг нас поддались капризам западных держав. Как миры, действительно свободные от мусульманской власти, мы должны использовать нашу роль регионального лидера для защиты детей Аллаха от упадка и эксплуатации западного империализма."
 TUR_arbiter_of_the_muslim_world_idea:0 "Арбитр мусульманского мира"
 TUR_batum_and_the_muslim_caucasian_states:0 "Батум и мусульманские государства Кавказа"
 TUR_batum_and_the_muslim_caucasian_states_desc:0 "Россия издавна была великим соперником Османской империи. Однако собственный упадок вынудил её чрезмерно растянуть силы. Мы добьёмся успеха там, где столько раз терпели поражение, и вернём принадлежащее нам по праву!"
 TUR_batum_and_the_muslim_caucasian_states_tt:0 "Получает претензии на §YАрмению§!, §YГрузию§!, §YАбхазию§!, §YДагестан§!, §YЧечено-Ингушетию§!, §YСеверную Осетию§! и §YКабардино-Балкарию§!"
 TUR_batum_and_the_muslim_caucasian_states2_tt:0 "Открывает решения §YИнтеграция мусульманских государств Кавказа§!"
 TUR_r56integrate_dagestan:0 "Интегрировать Дагестан"
 TUR_r56integrate_chechnya:0 "Интегрировать Чечню"
 TUR_r56integrate_kabardinobalkaria:0 "Интегрировать Кабардино-Балкарию"
 TUR_claim_greater_syria:0 "Предъявить претензии на Великую Сирию"
 TUR_claim_greater_syria_desc:0 "Границы Великой Сирии 1914 года имеют важнейшее значение для нашего восстановления, и эти земли как раз находятся под властью упадочных и слабеющих западных держав. Мы немедленно двинемся на юг!"
 TUR_claim_greater_syria_reward_tt:0 "Открывает решения §YРеинтеграция Великой Сирии§!"
 TUR_reintegrate_syria:0 "Реинтегрировать Сирию"
 TUR_reintegrate_lebanon:0 "Реинтегрировать Ливан"
 TUR_reintegrate_jordan_and_palestine:0 "Реинтегрировать Иорданию и Палестину"
 TUR_reintegrate_palestine_tt:0 "Получает национальные территории во всех §Yпалестинских§! регионах"
 TUR_reintegrate_jordan_tt:0 "Получает национальные территории во всех §Yиорданских§! регионах"
 TUR_reintegrate_arabian_iraq:0 "Реинтегрировать арабский Ирак"
 TUR_reintegrate_iraq_tt:0 "Получает национальные территории во всех §Yиракских§! регионах, кроме §YМосула§! и §YЭрбиля§!"
 TUR_cross_the_suez:0 "Пересечь Суэц"
 TUR_cross_the_suez_desc:0 "Суэцкий канал — ключ к статусу великой державы, и уже долгое время он находится в руках разобщённой и чрезмерно растянутой Британской империи. Мы добьёмся успеха там, где однажды потерпели неудачу, вернём эту важнейшую землю и освободим арабов Северной Африки!"
 TUR_dominate_the_arabian_peninsula:0 "Подчинить Аравийский полуостров"
 TUR_dominate_the_arabian_peninsula_desc:0 "Аравийским полуостровом правят слабые марионетки западных «великих держав». Мы принесём полуострову подлинную свободу!"
 TUR_dominate_the_arabian_peninsula_tt:0 "Открывает решения §YИнтеграция полуострова§!"
 TUR_reintegrate_the_west_arabian_coast:0 "Реинтегрировать западное побережье Аравии"
 TUR_consolidating_the_peninsula:0 "Укрепление власти на полуострове"
 TUR_reincorporate_the_egyptian_lands:0 "Вернуть египетские земли"
 TUR_reincorporate_the_egyptian_lands_desc:0 "Египет, пожалуй, стал величайшей утратой в истории нашей империи. Когда его земли окажутся под нашим контролем, наши народы вновь объединятся!"
 TUR_reintegrate_egypt_tt:0 "Получает национальные территории во всех §Yегипетских§! регионах, кроме §Yсуданских§!"
 TUR_reintegrate_egypt2_tt:0 "Открывает решение: §YИнтегрировать Арабский Судан§!."
 TUR_reintegrate_egypt3_tt:0 "Открывает решение: §YРеинтегрировать Киренаику и Триполи§!."
 TUR_reintegrate_arabian_sudan:0 "Интегрировать Арабский Судан"
 TUR_reintegrate_cyrenica_and_tripoli:0 "Реинтегрировать Киренаику и Триполи"
 TUR_solidify_the_khedivate:0 "Укрепить хедиват"
 TUR_solidify_the_khedivate_desc:0 "Предельная централизация лишь приведёт к чрезмерному растяжению сил и погубит любую попытку восстановления. Возрождение Египетского хедивата — единственный путь вперёд!"
 TUR_reclaim_the_aegean_territories:0 "Вернуть территории в Эгейском море"
 TUR_reclaim_the_aegean_territories_desc:0 "Значительная часть наших эгейских владений была потеряна в Балканских войнах и до сих пор остаётся вне нашей досягаемости. Следует воспользоваться растущим расколом на Балканах и вернуть родину многих представителей нашего народа."
 TUR_claim_greater_bulgaria:0 "Предъявить претензии на Великую Болгарию"
 TUR_claim_greater_bulgaria_desc:0 "Болгары одними из последних среди европейских народов обрели независимость от нашей империи, и в их стране до сих пор проживает многочисленное турецкое меньшинство. Возвращение этих границ является необходимым условием нашего пути к статусу великой державы!"
 TUR_claim_greater_bulgaria_tt:0 "Получает претензии на все §Yболгарские§! и §Yмакедонские§! регионы, а также на §YЮжную Добруджу§!"
 TUR_befriend_the_bulgarians:0 "Подружиться с болгарами"
 TUR_befriend_the_bulgarians_desc:0 "Болгары были одной из последних стран, которые получили независимость от нашей империи. Мы должны смириться с тем, что конкретное господство над балканами невозможно. Османское и болгарское дело одно и то же, мы будем работать вместе, чтобы отомстить за наши территориальные потери!"
 turkey.132.t:0 "Тайное соглашение с османами?"
 turkey.132.d:0 "Османский министр иностранных дел встретился с нашим министром в Софии и сделал предложение относительно ситуации в Греции. Османы откажутся от дальнейших территориальных притязаний на Балканах и поддержат наши права на фракийское побережье. Взамен они хотят получить помощь в разгроме греков, чтобы удовлетворить собственные притязания на острова Эгейского моря и Крит. Что ответить?"
 turkey.132.a:0 "Во славу наших народов каждый получит принадлежащее ему по праву!"
 turkey.132.b:0 "Туркам нельзя доверять."
 turkey.133.t:0 "Болгары согласились!"
 turkey.133.d:0 "Болгары приняли наше предложение и обещали напасть на Грецию, когда мы сами объявим ей войну."
 turkey.133.a:0 "Превосходно."
 turkey.134.t:0 "Болгары отказались"
 turkey.134.d:0 "Болгары отказались. Нам не остаётся ничего, кроме как напасть самостоятельно."
 turkey.134.a:0 "Что ж."
 turkey.135.t:0 "Османско-болгарское соглашение о дружбе?"
 turkey.135.d:0 "Османский министр иностранных дел встретился со своим болгарским коллегой в Софии и сделал предложение относительно общего положения наших стран. Османы откажутся от всех территориальных притязаний на Балканах и официально подпишут с нами пакт о ненападении. Что ответить?"
 turkey.135.a:0 "Дружественные отношения отвечают нашим интересам!"
 turkey.135.b:0 "Эти глупцы думают, что это нас остановит?"
 turkey.136.t:0 "Болгары согласились!"
 turkey.136.d:0 "Болгары приняли наше предложение о пакте о ненападении. Пусть мир признает нашу приверженность миру на Балканском полуострове!"
 turkey.136.a:0 "К светлому будущему!"
 turkey.137.t:0 "Болгары отказались"
 turkey.137.d:0 "Болгары отказались. Зачем им вообще портить отношения с нашей возрождённой страной?"
 turkey.137.a:0 "Разочаровывает."
 TUR_subjugate_the_greeks:0 "Подчинить греков"
 TUR_subjugate_the_greeks_desc:0 "Греция давно является соперником нашей страны. Времена изменились, и существование «независимого» греческого государства больше нельзя терпеть."
 TUR_restore_dominion_over_albania:0 "Восстановить господство над Албанией"
 TUR_restore_dominion_over_albania_desc:0 "Албанцы были одним из последних народов Европы, добившихся независимости от нашей империи, и при этом одними из немногих, кто разделяет с нами исламскую веру. Они наши братья, и их освобождение близко!"
 TUR_restore_dominion_over_albania_tt:0 "Получает претензии на все §Yалбанские§! регионы, а также на §YДебар§!, §YКосово§! и §YМитровицу§!"
 TUR_r56integrate_albania:0 "Реинтегрировать албанские земли"
 TUR_restore_dominion_over_albania2_tt:0 "Открывает решение: §YРеинтегрировать албанские земли§!."
 TUR_avenge_the_1878_berlin_treaty:0 "Отомстить за Берлинский трактат 1878 года"
 TUR_avenge_the_1878_berlin_treaty_desc:0 "Берлинский трактат 1878 года положил начало концу нашего господства на Балканском полуострове. Наконец мы можем вернуть то, что принадлежит нам по праву, и сделаем это."
 TUR_avenge_the_1878_berlin_treaty_tt:0 "Получает претензии на все §Yбоснийские§! регионы"
 claims_montenegrin_states_tt:0 "Получает претензии на §YЧерногорию§! и §YЗападный Санджак§!"
 TUR_avenge_the_1878_berlin_treaty2_tt:0 "Открывает решение: §YРеинтегрировать боснийские земли§!."
 TUR_r56integrate_the_bosnian_lands:0 "Реинтегрировать боснийские земли"
 TUR_revolution_not_reform:0 "Революция, а не реформы"
 TUR_revolution_not_reform_tt:0 "Открывает решения §YПереход к социализму§!"
 TUR_revolution_not_reform_desc:0 "Несмотря на всё добро, которое Ататюрк сделал для турецкой нации, он под видом реформ препятствовал установлению социализма и подавлял наши движения. Мы будем нести факел свободы, пока весь турецкий пролетариат не станет свободным!"
 r56_TUR_the_transition_to_socialism:0 "Переход к социализму"
 r56_TUR_the_transition_to_socialism_desc:0 "Прошло более десяти лет решительного и почти абсолютного правления Ататюрка, и стало окончательно ясно, что его разновидность либерализма недостаточно радикальна. Путь вперёд очевиден: прогресс возможен лишь через возвышение пролетариата и установление социализма."
 r56_TUR_end_husnus_exile:0 "Прекратить изгнание Хюсню"
 r56_TUR_expand_union_protections:0 "Расширить защиту профсоюзов"
 r56_TUR_lift_the_ban_on_the_TKP:0 "Отменить запрет ТКП"
 r56_TUR_demand_legalization_of_the_TKP:0 "Потребовать легализации ТКП"
 r56_TUR_public_schooling_initiative:0 "Инициатива государственного образования"
 TUR_attack_the_CHPs_failures:0 "Обличить провалы НРП"
 TUR_attack_the_CHPs_failures_desc:0 "Даже слепой способен увидеть провалы республиканского правительства. Мы должны ясно показать турецкому пролетариату, что добьёмся успеха там, где либералы НРП потерпели неудачу."
 TUR_reorganize_the_kadro_movement:0 "Реорганизовать движение «Кадро»"
 TUR_reorganize_the_kadro_movement_desc:0 "Движение «Кадро» объединило основы марксизма и национализма в подлинно турецкую идеологию. Несмотря на его закрытие в 1934 году, классовый конфликт по-прежнему угрожает турецким рабочим. Возможно, стоит восстановить «Кадро», чтобы оно вновь влияло на пролетариат."
 TUR_kadro_idea:0 "Движение «Кадро»"
 TUR_two_red_banners:0 "Два красных знамени"
 TUR_two_red_banners_desc:0 "Народ нашей великой страны никогда не должен забывать, как скромно начался наш путь к величию. Продвигаясь к социализму, мы должны ясно показать миру, что остаёмся самостоятельной нацией и всегда будем преследовать лишь собственные интересы."
 TUR_lead_the_underground_komunist_partisi:0 "Возглавить подпольную ТКП"
 TUR_lead_the_underground_komunist_partisi_desc:0 "У Турции есть собственное социалистическое движение, уже более десяти лет действующее в подполье! Человек по имени Шефик Хюсню возглавляет ТКП с 1932 года и готов принести нашей стране подлинную свободу!"
 TUR_lead_the_underground_komunist_partisi_tt:0 "Разблокировать решение: §!Требование легализации ТКП§!."
 TUR_ally_kurdish_nationalist_groups:0 "Заключить союз с курдскими националистами"
 TUR_ally_kurdish_nationalist_groups_desc:0 "Курды преимущественно живут на юго-востоке Анатолии и многие годы сопротивляются попыткам центрального правительства ассимилировать их. Предложив курдскому народу автономию, мы, возможно, сумеем привлечь его на свою сторону в борьбе за освобождение всей Турции."
 TUR_ally_kurdish_nationalist_groups1_tt:0 "После завершения фокуса §YКовать светлое будущее§!:"
 TUR_ally_kurdish_nationalist_groups2_tt:0 "Все §Yкурдские§! национальные территории присоединятся к нам в случае гражданской войны"
 TUR_request_soviet_support:0 "Запросить поддержку Советского Союза"
 TUR_request_soviet_support_desc:0 "СССР — наш сосед и лидер коммунистического мира. Мы должны обратиться к нему с просьбой поддержать наше дело и предоставить рабочим необходимую помощь в час борьбы!"
 TUR_request_soviet_support_tt:0 "Если СССР согласится, во время революции мы получим от него снаряжение."
 TUR_kemalisms_next_step_forward:0 "Следующий шаг кемализма!"
 TUR_kemalisms_next_step_forward_desc:0 "Многие в НРП считают, что Ататюрк и его реформы зашли недостаточно далеко. Мы должны объединиться с этими левыми союзниками и вместе бороться за светлое будущее."
 TUR_kemalisms_next_step_forward_tt:0 "Открывает решение: §YОтменить запрет ТКП§!."
 TUR_expand_the_village_institutes_program_socialist:0 "Расширить программу сельских институтов"
 TUR_expand_the_village_institutes_program_socialist_desc:0 "Программа сельских институтов уже добилась значительных успехов. Её расширение несомненно поможет ещё сильнее объединить нашу страну."
 TUR_further_the_reforms:0 "Углубить реформы"
 TUR_further_the_reforms_desc:0 "Правительства Ататюрка и Инёню так и не сумели по-настоящему защитить турецкого рабочего. Мы должны пойти дальше и принести стране подлинные перемены!"
 TUR_further_the_reforms1_tt:0 "Открывает решение: §YРасширить защиту профсоюзов§!."
 TUR_further_the_reforms2_tt:0 "Открывает решение: §YИнициатива государственного образования§!."
 TUR_reconciliation_with_liberal_kemalists:0 "Примирение с либеральными кемалистами"
 TUR_reconciliation_with_liberal_kemalists_desc:0 "НРП — партия со множеством лиц. Поддержание дружественных отношений с либеральными кемалистами важно на нашем пути к руководству партией."
 TUR_cement_control_over_the_party:0 "Укрепить контроль над партией"
 TUR_cement_control_over_the_party_desc:0 "Левое крыло НРП явно получило возможность превратить наше дело в устойчивую силу. Нельзя терять время — настало время осуществить нашу судьбу!"
 TUR_backbone_of_the_party:0 "Опора партии"
 TUR_backbone_of_the_party_desc:0 "Восстановление «Кадро» принесло большой успех. Очевидно, что это движение служит мостом между государством и рабочими, и мы должны признать этот факт."
 TUR_backbone_of_the_party_idea:0 "Опора партии"
 TUR_pave_the_road_to_progress:0 "Проложить путь к прогрессу"
 TUR_pave_the_road_to_progress_desc:0 "Путь вперёд очевиден. Лишь социалистическое движение позволит нам двигаться дальше!"
 TUR_reward_the_working_class:0 "Вознаградить рабочий класс"
 TUR_reward_the_working_class_desc:0 "Наш переход к социализму был бы невозможен без помощи великого рабочего класса. Теперь, располагая политическим капиталом, мы должны наконец вознаградить народ за всё, чего он достиг!"
 TUR_continue_the_democratic_transition:0 "Продолжить демократический переход"
 TUR_continue_the_democratic_transition_desc:0 "Несмотря на годы политических репрессий при Ататюрке, НРП приблизила Турцию к настоящей демократии. Мы продолжим начатое предшественниками и объединим партийные цели вокруг принесения политической и социальной свободы!"
 TUR_continue_the_democratic_transition_tt:0 "Открывает решения §YПереход к демократии§!"
 TUR_the_transition_to_democracy_initial_idea:0 "Переход к демократии?"
 TUR_the_transition_to_democracy_initial_idea_desc:0 "Мы открыто поддержали свободные выборы, но почти не продвинулись к созданию такой системы. Если демократия действительно является конечной целью, в этой области предстоит ещё немало работы."
 TUR_the_transition_to_democracy_idea:0 "Переход к демократии"
 r56_TUR_lift_the_ban_on_opposition_parties:0 "Отменить запрет оппозиционных партий"
 r56_TUR_end_censorship_policies:0 "Отменить цензуру"
 TUR_free_elections_available_tt:0 "Открывает решение: §YПровести свободные выборы§!."
 r56_TUR_hold_free_elections:0 "Провести свободные выборы"
 TUR_free_elections_available_days_tt:0 "После завершения обоих решений §YПереход к демократии§! прошло не менее 200 дней"
 TUR_the_transition_to_democracy_fulfilled_idea:0 "Поборники демократии!"
 TUR_call_for_general_strike:0 "Призвать ко всеобщей забастовке"
 TUR_call_for_general_strike_desc:0 "Следующим шагом к революции станет парализация режима НРП. Наш путь к социализму зависит от того, поймут ли рабочие исключительную важность этого шага. Пять месяцев экономического спада стоят пяти столетий прогресса!"
 TUR_general_strike_idea:0 "Всеобщая забастовка"
 TUR_storm_the_grand_national_assembly:0 "Штурмовать Великое национальное собрание"
 TUR_storm_the_grand_national_assembly_desc:0 "Рабочие Анатолии, объединяйтесь ради лучшего будущего!"
 TUR_storm_the_grand_national_assembly_tt:0 "Выполнено решение §YПрекратить изгнание Хюсню§!"
 TUR_voice_of_the_people:0 "Голос народа"
 TUR_voice_of_the_people_desc:0 "Восстановление «Кадро» принесло большой успех. Очевидно, что именно этот инструмент необходим правительству для укрепления народного мандата."
 TUR_voice_of_the_people_idea:0 "Голос народа"
 TUR_the_question_of_nationalization:0 "Вопрос национализации"
 TUR_the_question_of_nationalization_desc:0 "Положение турецкой экономики сложно, а приведшее к нему управление ещё сложнее. Наш блок един в понимании конечной цели общества, но путь к ней вызывает разногласия. Двигаясь вперёд, мы должны объяснить народу, какую роль сохранят существующие рыночные механизмы."
 TUR_the_question_of_nationalization_tt:0 "Открывает решения §YНационализация§!"
 TUR_nationalization_no_position_declared:0 "Национализация — позиция не определена"
 TUR_nationalization_no_position_declared_desc:0 "По какой-то причине мы не изложили экономическую политику достаточно ясно. Будущие меры и заявления правительства должны исправить это упущение."
 TUR_mixed_economy_idea:0 "Смешанная экономика"
 TUR_mixed_economy_idea_desc:0 "Мир уже увидел провалы чрезмерно навязчивой коллективистской политики. Переход к подлинно социалистической экономике должен быть постепенным, чтобы расширять права рабочих, не разрушая всю систему."
 r56_TUR_approve_limited_private_farming:0 "Разрешить ограниченное частное земледелие"
 r56_TUR_approve_limited_private_farming_desc:0 "Мы не можем повторить провалы советской аграрной политики. Переход к социалистической экономике требует терпимости к наиболее производительным земледельцам, пока мы не сможем создать устойчивую систему коллективного хозяйства."
 r56_TUR_support_private_collectives:0 "Поддержать частные коллективы"
 r56_TUR_support_private_collectives_desc:0 "Рабочие во многих отраслях Турции создали коллективы, стремясь добиться больших прав в рамках капиталистической системы. Следует поощрять это развитие по мере перехода к социалистической экономике."
 r56_TUR_limited_redistribution:0 "Ограниченное перераспределение земель"
 r56_TUR_limited_redistribution_desc:0 "Ограниченное перераспределение земель среди крестьян давно является частью политики НРП, и социалистическое правительство должно продолжить эту работу."
 r56_TUR_limited_industrial_nationalization:0 "Ограниченная национализация промышленности"
 r56_TUR_limited_industrial_nationalization_desc:0 "Западные провинции накопили значительную промышленную базу. Следует начать включать эти конгломераты в государственную экономику."
 r56_TUR_relax_the_collectivist_policies:0 "Смягчить коллективистскую политику"
 r56_TUR_relax_the_collectivist_policies_desc:0 "Наша агрессивная национализация и экономическая централизация заходят слишком далеко и уже приводят к падению уровня жизни."
 TUR_moderate_collectivization_idea:0 "Умеренная коллективизация"
 TUR_heavy_handed_central_planning_idea:0 "Жёсткое централизованное планирование"
 TUR_overzealous_central_planning:0 "Чрезмерное централизованное планирование"
 TUR_central_planning_disaster:0 "Катастрофа централизованного планирования"
 TUR_forging_a_brighter_tomorrow:0 "Ковать светлое будущее"
 TUR_forging_a_brighter_tomorrow_desc:0 "Наш контроль над страной надёжен. Какой бы ни была цена и какие бы временные трудности нас ни ожидали, Турция должна двигаться вперёд любой ценой!"
 TUR_centralize_the_TKP:0 "Централизовать ТКП"
 TUR_centralize_the_TKP_desc:0 "Турецкая коммунистическая партия должна избежать внутреннего раскола, подобного тому, от которого пострадали Советы. Мы должны идти по стопам Ленина и Сталина: направить вперёд всех в наших рядах, оставив реакционеров позади!"
 TUR_centralizing_the_TKP:0 "Централизация партии"
 TUR_turkish_red_army:0 "Турецкая Красная армия"
 TUR_turkish_red_army_desc:0 "Турции нужна централизованная и дисциплинированная национальная армия, способная защищать новые коммунистические ценности. Мы последуем примеру русских и создадим собственную Красную армию."
 bftb_turkey.23.desc:0 "[FROM.GetLeader] обратился к [ROOT.GetLeader] с предложением подписать взаимный пакт о ненападении, оставив открытой возможность дальнейшего сотрудничества. Дипломаты [FROM.GetAdjective] государства тщательно подготовили предложение, подробно изложив общую историю и интересы наших стран, а затем искренне призвали к миру между братскими народами. Переговоры проходили в приятной обстановке, но окончательное решение о подписании пакта остаётся за нами."
 turkey_hatay.1.t:0 "Вопрос Хатая"
 turkey_hatay.1.d:0 "После Великой войны Франция оккупировала санджак Александретта и передала его под управление Сирийского мандата. В провинции, ныне известной как Хатай, проживает значительное турецкое население, хотя и не составляющее явного большинства. Споры о статусе Хатая обострились после того, как [TUR.GetLeader] потребовал полностью вернуть его Турции. Однако многочисленные армяне и алавиты провинции организовали крупные протесты против присоединения к Анкаре.\n\nОчевидно, что Турция относится к вопросу серьёзно, и отказ от её требований может привести к войне."
 turkey_hatay.1.a:0 "Хатай не стоит вражды с Турцией."
 turkey_hatay.1.b:0 "Мы не позволим запугивать себя: Хатай по праву является частью Сирии."
 turkey_hatay.2.t:0 "Возвращение Хатая"
 turkey_hatay.2.d:0 "После переговоров [From.GetNameDef] объявило о выводе своих сил из провинции Хатай. Турецкие войска и государственные служащие теперь могут беспрепятственно войти в провинцию и начать её присоединение.\n\nПередача проходит преимущественно мирно, однако в последние дни регион покинуло множество армян."
 turkey_hatay.2.a:0 "Сегодня восторжествовал разум."
 turkey_hatay.3.t:0 "[From.GetNameDef] отказывается передать нам Хатай"
 turkey_hatay.3.d:0 "Переговоры с [From.GetNameDef] сорвались: [From.GetAdjective] сторона объявила, что не позволит принудить себя к передаче территории без поддержки местного армянского и алавитского населения. В регионе вспыхнули протесты и демонстрации как в поддержку, так и против присоединения провинции к нам, а к границе направлены дополнительные подразделения охраны."
 turkey_hatay.3.a:0 "Пока отступим."
 turkey_hatay.3.b:0 "Это означает войну."
 turkey_sadabat.1.t:0 "Саадабадский пакт"
 turkey_sadabat.1.d:0 "Встреча во дворце Саадабад в Иране привела к предложению заключить пакт о ненападении между странами Ближнего Востока ради защиты нашего суверенитета. Перед лицом угрозы вмешательства западных держав со всех сторон разумнее всего отложить разногласия и вместе защищать свободу."
 turkey_sadabat.1.a:0 "Мы согласны на этот пакт."
 turkey_sadabat.1.b:0 "Нас это не интересует."
 turkey_sadabat.2.t:0 "[From.GetNameDef] соглашается на пакт"
 turkey_sadabat.2.d:0 "[From.GetNameDef] приняло условия Саадабадского пакта и пообещало соблюдать ненападение между нашими странами."
 turkey_sadabat.2.a:0 "Пусть между нами вечно царит мир."
 turkey_sadabat.3.t:0 "[From.GetNameDef] отклоняет пакт"
 turkey_sadabat.3.d:0 "Несмотря на все наши усилия, [From.GetNameDef] покинуло переговоры во дворце Саадабад, не подписав пакт о ненападении."
 turkey_sadabat.3.a:0 "Будем надеяться, что они не совершат ничего безумного."
 turkey.100.t:0 "Расширить англо-турецкую торговлю?"
 turkey.100.d:0 "Турки предложили нам соглашение, которое, по мнению их министра иностранных дел, принесёт выгоду обеим сторонам. В обмен на разрешение британским компаниям расширить деятельность в Турции они продолжат принимать меры для защиты этих предприятий от германского или советского контроля."
 turkey.100.a:0 "Похоже на выгодную сделку."
 turkey.100.b:0 "Мы не заинтересованы в помощи туркам."
 turkey.101.t:0 "[FROM.GetNameDef] соглашается оказать промышленную помощь"
 turkey.101.d:0 "Британское правительство разрешило британским предпринимателям инвестировать в нашу страну."
 turkey.101.a:0 "Превосходно."
 turkey.102.t:0 "[FROM.GetNameDef] отклоняет нашу просьбу о промышленной помощи"
 turkey.102.d:0 "Британское правительство заблокировало любые попытки расширить экономические связи с нашей страной."
 turkey.102.a:0 "От британцев? Невиданно."
 turkey.104.t:0 "Турция просит гарантий"
 turkey.104.d:0 "Занимая два континента и соседствуя с моими великими державами, Турция оказалась в стратегически важной, но опасной географической ситуации. Недавно к нам обратились турецкие дипломаты с просьбой о гарантиях от любых потенциально направленных против них угроз. Взамен они предлагают нам свою дружбу."
 turkey.104.a:0 "Мы должны помочь Турции избежать любого конфликта."
 turkey.104.b:0 "У нас другие планы на Турцию."
 turkey.105.t:0 "[FROM.GetNameDef] соглашается гарантировать нашу независимость"
 turkey.105.d:0 "Следуя указаниям своего правительства, посол [FROM.GetAdjective] государства был принят [ROOT.GetLeader], чтобы подписать договор, по которому вооружённые силы [FROM.GetAdjective] государства вмешаются в случае иностранной агрессии."
 turkey.105.a:0 "Это защитит нас от стервятников."
 turkey.106.t:0 "[FROM.GetNameDef] отказывается гарантировать нашу независимость"
 turkey.106.d:0 "Следуя указаниям своего правительства, представитель [FROM.GetAdjective] государства отрицательно ответил на предложение нашего правительства и отказался гарантировать нашу независимость."
 turkey.106.a:0 "Они явно что-то замышляют..."
 turkey.107.t:0 "Германо-турецкий договор о дружбе"
 turkey.107.d:0 "Недавно турецкие дипломаты обсуждали с нашим правительством статус турецкого нейтралитета. В обмен на гарантию того, что Германия не станет нападать на Турцию или посягать на её суверенитет, турки откроют нам свои рынки. Это обеспечит выгодные сделки и лёгкий доступ к богатствам Ближнего Востока, включая огромные запасы турецкого хрома."
 turkey.107.a:0 "Хорошо вновь видеть турок на нашей стороне."
 turkey.107.b:0 "У нас другие планы на Турцию."
 turkey.108.t:0 "Германия подписывает договор о дружбе"
 turkey.108.d:0 "Германия подписала и ратифицировала предложенный германо-турецкий договор о дружбе. Пока мы сохраняем нейтралитет в будущих конфликтах, Германия будет уважать наши границы и дипломатические устремления."
 turkey.108.a:0 "Отличная новость!"
 turkey.109.t:0 "Переговоры сорвались"
 turkey.109.d:0 "Несмотря на все попытки умиротворить немцев, наши слова остались без внимания. Дипломаты вернулись из Германии с пустыми руками."
 turkey.109.a:0 "Очевидно, у Германии на нас другие планы."
 turkey.110.t:0 "Турция требует вернуть Додеканес"
 turkey.110.d:0 "Додеканес — группа из более чем ста островов в южной части Эгейского моря. Крупнейший из них, Родос, с древности господствовал в регионе, а с 1522 года острова находились под властью турок, пока Италия не захватила их во время Итало-турецкой войны. Теперь турецкие послы потребовали вернуть острова, которые считают своей законной территорией. Они ясно дали понять, что рассматривают Додеканес как неотъемлемую часть страны и не примут отказа."
 turkey.110.a:0 "Их притязания на острова вполне обоснованны."
 turkey.110.b:0 "Они честно проиграли эти земли."
 turkey.111.t:0 "[From.GetNameDef] соглашается вернуть Додеканес"
 turkey.111.d:0 "Наши переговоры с [From.GetNameDef] завершились большим успехом: [From.GetNameDef] гарантировало возвращение Додеканеса. Сегодня рано утром последние государственные служащие и войска [From.GetNameDef] покинули острова после небольшой церемонии на Родосе."
 turkey.111.a:0 "Ещё одна часть нашей земли законно возвращена."
 turkey.114.t:0 "Турция просит принять её в Антикоминтерновский пакт"
 turkey.114.d:0 "Следуя своему недавнему курсу против Советского Союза, турки официально попросили принять их в Антикоминтерновский пакт. Хотя это почти ни к чему их не обяжет, такой шаг может открыть путь к более тесному сотрудничеству в будущем. Что ответить?"
 turkey.114.a:0 "Мы будем рады этому."
 turkey.114.b:0 "Нас это не интересует."
 turkey.115.t:0 "Немцы согласились"
 turkey.115.d:0 "Немцы согласились принять нас в Антикоминтерновский пакт. Хотя это почти ни к чему нас не обязывает, путь к более тесному сотрудничеству теперь открыт."
 turkey.115.a:0 "Мы довольны."
 turkey.116.t:0 "Немцы отказались"
 turkey.116.d:0 "Не предоставив никаких объяснений, немцы отклонили наше предложение. Что они вообще могут выиграть, упуская такую возможность?"
 turkey.116.a:0 "Разочаровывает."
 TUR_kurdish_rebellion_cat:0 "Курдское восстание"
 TUR_kurdish_rebellion_cat_desc:0 "Курды на востоке Турции давно не считают себя частью турецкой нации. Из-за нынешней политической нестабильности мятежные курды начали создавать подпольные ячейки и готовить восстание против нас."
 TUR_kurdish_rebellion_mission:0 "Курдское восстание"
 TUR_crackdown_on_kurds:0 "Разгромить курдские ячейки"
 TUR_launch_the_revolution_tt:0 "Начнётся гражданская война. Чем выше поддержка коммунистов, тем больше дивизий перейдёт на их сторону. При достаточно высокой поддержке коммунистов гражданской войны можно избежать."
 TUR_launch_the_revolution_soviet_support_tt:0 "Если Советский Союз пообещал нам поддержку, мы получим дополнительное оружие для революции."
 TUR_request_soviet_economic_aid:0 "Запросить советскую экономическую помощь"
 TUR_request_soviet_economic_aid_desc:0 "Советский Союз обладает огромной экономикой, которую наверняка можно использовать на благо нашего дела. Такая помощь также значительно поспособствует восстановлению нашей разорённой войной страны."
 TUR_request_soviet_military_aid:0 "Запросить советскую военную помощь"
 TUR_request_soviet_military_aid_desc:0 "Красная армия многочисленна и могущественна. Следует попросить Советы поделиться опытом и помочь нам создать армию, способную сравниться с их собственной."
 turkey.13.t:0 "Конец гражданской войны в Турции"
 turkey.13.d:0 "После капитуляции последних опорных пунктов оппозиции гражданская война в Турции завершилась. Люди празднуют на улицах, а солдаты возвращаются домой и складывают оружие. Многие разногласия всё ещё сохраняются, и для исцеления страны потребуется немало времени. Но наконец будущее выглядит светлым."
 turkey.13.a:0 "Победа всего народа!"
 turkey.14.t:0 "Переворот"
 turkey.14.d:0 "Рано утром коммунистические ополченцы захватили несколько важных зданий и объектов по всей Турции. Толпы людей под красными знамёнами штурмовали Великое национальное собрание, а многие ведущие деятели правительства были арестованы в собственных домах. Когда нас поддержала значительная часть армии, никто уже не мог помешать народу взять страну в свои руки."
 turkey.14.a:0 "К новой Турции!"
 turkey.15.t:0 "Турецкие коммунисты просят помощи"
 turkey.15.d:0 "Члены турецкой компартии прибыли в Москву с просьбой о помощи в запланированном восстании против правительства. Хотя они считают, что их план является полным доказательством, они просят гарантий оружия и военной поддержки, чтобы помочь турецким рабочим снести их репрессивное правительство.\n\nНезависимо от их планов, наличие на нашей южной границе лояльного коммунистического государства будет полезно для нашей национальной обороны."
 turkey.15.a:0 "Мы поддержим наших турецких друзей."
 turkey.15.b:0 "Пусть турки справляются сами."
 turkey.16.t:0 "Советский Союз гарантирует поддержку"
 turkey.16.d:0 "Наши переговоры с Советским Союзом завершились успешно, и советское правительство пообещало оказать помощь в предстоящей борьбе за освобождение."
 turkey.16.a:0 "Это очень нам поможет."
 turkey.17.t:0 "Советский Союз отклоняет нашу просьбу о поддержке"
 turkey.17.d:0 "К сожалению, наши представители вернулись из Советского Союза с пустыми руками. Похоже, Советы сочувствуют нашему положению, но не желают помогать восстанию против правительства."
 turkey.17.a:0 "Но почему?"
 turkey.20.t:0 "Турция требует деколонизации"
 turkey.20.d:0 "Представители турецкого правительства предъявили нам ультиматум: либо мы уйдём со всех территорий Ближнего Востока, либо столкнёмся с освободительной войной.\n\nПоначалу над ними лишь посмеялись, но, похоже, Турция настроена серьёзно и намерена освободить Ближний Восток от иностранного господства."
 turkey.20.a:0 "В наших интересах позволить народам обрести свободу."
 turkey.20.b:0 "Мы не отдадим Ближний Восток туркам."
 turkey.21.t:0 "[From.GetNameDef] уходит с Ближнего Востока"
 turkey.21.d:0 "Сегодня рано утром последние войска и государственные служащие [From.GetNameDef] покинули ближневосточные владения. Местное население уже начало создавать собственные правительства, некоторые из которых даже сохраняют верность нам."
 turkey.21.a:0 "Это победа всех свободных народов."
 turkey.22.t:0 "[From.GetNameDef] отказывается уходить с Ближнего Востока"
 turkey.22.d:0 "Похоже, наши требования к [From.GetNameDef] остались без внимания. Представителям дали лишь несколько часов на отъезд из страны, почти не выслушав их. Стало ясно, что [From.GetNameDef] ни при каких условиях не откажется от своих ближневосточных владений."
 turkey.22.a:0 "Тогда мы освободим их силой."
 turkey.22.b:0 "Возможно, сейчас не время для насилия."
 TUR_solidify_the_saadabad_pact_tt:0 "Все страны, подписавшие Саадабадский пакт, будут приглашены в нашу фракцию.\n"
 TUR_saadabad_pact:0 "Саадабадский пакт"
 TUR_saadabad_pact_member:0 "Подписан Саадабадский пакт"
 TUR_end_clodius_agreement:0 "Отменить соглашение Клодиуса"
 TUR_strategic_isolation:0 "Стратегическая изоляция"
 TUR_strategic_isolation_desc:0 "[ROOT.GetNameDefCap] достаточно сильно, чтобы самостоятельно защититься от большинства региональных врагов, однако вмешательство в местную политику создаёт риск столкновения с куда более серьёзными угрозами."
 TUR_turkish_leads_the_way:0 "Турция указывает путь"
 TUR_turkish_leads_the_way_desc:0 "Международная обстановка не позволяет Турции полагаться ни на нейтралитет, ни на какую-либо великую державу. Ради собственной защиты мы должны создать свой союз."
 TUR_the_balkan_pact:0 "Балканский пакт"
 TUR_the_balkan_pact_desc:0 "На Балканах расположено немало сильных стран, способных стать нашими друзьями. Нам следует обратиться к ним."
 TUR_join_with_romania:0 "Объединиться с Румынией"
 TUR_join_with_romania_desc:0 "Россия является мощным потенциальным союзником. Мы должны объединиться для защиты Балкан."
 TUR_reconcile_with_greece:0 "Примириться с Грецией"
 TUR_reconcile_with_greece_desc:0 "Греция долгое время была нашим соперником и врагом. Но, возможно, теперь мы способны стать друзьями."
 TUR_solidify_the_saadabad_pact:0 "Ополчение Саадабадского пакта"
 TUR_solidify_the_saadabad_pact_desc:0 "У нас много друзей на Ближнем Востоке. Мы должны превратить Саадабадский пакт в настоящий военный союз."
 TUR_a_city_of_spies:0 "Город шпионов"
 TUR_a_city_of_spies_desc:0 "У гостиничных баров, на террасах кафе и вдоль берегов Босфора — повсюду в городе встречаются иностранцы, обмениваются документами и слухами. Подозрительные личности передают друг другу бумаги. В некоторых дипломатических портфелях могут скрываться даже бомбы..."
 TUR_a_city_of_spies_r56:0 "Город шпионов"
 TUR_a_city_of_spies_desc_r56:0 "У гостиничных баров, на террасах кафе и вдоль берегов Босфора — повсюду в городе встречаются иностранцы, обмениваются документами и слухами. Подозрительные личности передают друг другу бумаги. В некоторых дипломатических портфелях могут скрываться даже бомбы..."
 TUR_tashin_yazici:0 "Тахсин Языджы"
 TUR_mehmet_sabit_noyan:0 "Мехмет Сабит Ноян"
 TUR_hulusi_gokdalay:0 "Хулуси Гёкдалай"
 TUR_istanbul_elektrik_anonim_sirketi:0 "Стамбульская электрическая акционерная компания"
 TUR_generic_electronics_concern:0 "Стамбульская электрическая акционерная компания"
 TUR_sukru_ali_ogel:0 "Шюкрю Али Огель"
 TUR_turkish_petroleum_company:0 "Управление по разведке и эксплуатации золота и нефти"
 TUR_mda:0 "МТА"
 TUR_koc:0 "Коч Тиджарет А. Ш."
 TUR_denizbank:0 "Денизбанк"
 TUR_sumerbank:0 "Сюмербанк"
 TUR_fuat_agrali:0 "Фуат Агралы"
 TUR_reaffirm_balkan_hegemony:0 "Подтверждена балканская гегемония"
