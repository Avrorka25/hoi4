 r56_tur_invest_reward_tt:0 "§YНаши инвестиции в [TUR.GetnameDEF] Мы предоставим вам: §!§WНациональный дух, который будет содержать§! §Gпреимущества§! §Wили§! §Rличинки§! §WВ зависимости от того, насколько хорошо были сделаны инвестиции.§!"
 TUR_the_italo_turkish_friendship_treaty:0 "Итало-турецкий договор о дружбе"
 TUR_the_italo_turkish_friendship_treaty_desc:0 "Итальянцы могут соперничать с нами в нашей сфере влияния и даже владеть некоторыми землями, по праву принадлежащими нам, однако сотрудничество с ними необходимо для укрепления турецкой нации и особенно её флота."
 bftb_turkey.144.t:0 "[From.GetNameDefCap] просит гарантий"
 bftb_turkey.144.d:0 "[From.GetNameDefCap] попросило нас гарантировать его суверенитет. Это может быть рискованно, но позволит не допустить, чтобы его ресурсы и стратегическое географическое положение — контроль над входом в Чёрное море и выходом из него, а также путями между Ближним Востоком и Европой — оказались в руках наших врагов."
 bftb_turkey.144.a:0 "Мы должны защитить свои интересы в Турции."
 bftb_turkey.144.b:0 "Мы не можем дать такое обещание."
 bftb_turkey.145.t:0 "[From.GetNameDefCap] предоставляет гарантии"
 bftb_turkey.145.d:0 "[From.GetNameDefCap] Мы осознали нашу стратегическую важность и согласились гарантировать наш суверенитет."
 bftb_turkey.145.a:0 "Это удержит наших врагов на расстоянии."
 bftb_turkey.146.t:0 "[From.GetNameDefCap] отказывается гарантировать нашу свободу"
 bftb_turkey.146.d:0 "[From.GetNameDefCap] решило не предоставлять нам гарантии, сочтя это слишком рискованным в нынешней мировой обстановке."
 bftb_turkey.146.a:0 "Они ещё пожалеют об этом."
 ottoman_info:0 "\n§CThe §!§YДемократ Парти§!§C должен иметь §YБолее 40% поддержки§! Он был избран для возрождения османских настроений.§!\n"
 bftb_turkey.148.t:0 "Отношения с [GRE.GetNameDef]"
 bftb_turkey.148.d:0 "Исторически наши отношения с [GRE.GetNameDef] и его правителями были долгими и сложными. Столетия взаимного подчинения разделили многие наши народы. Идеи Великой Греции и Великой Турции до сих пор живы среди различных ревизионистских кругов наших гордых и сильных наций. Однако вопрос о соотношении сил остаётся открытым.\n\nМустафа Кемаль стремился к сотрудничеству с новым греческим государством, и наше новое правительство может последовать его мудрому примеру, заключив союз с их режимом любыми необходимыми средствами. С другой стороны, мы всегда можем положиться на итальянских благодетелей и вместе разделить сферы влияния в регионе.\n\nКакое превосходное решение примет [ROOT.getLeader]?"
 bftb_turkey.148.a:0 "Им нет места в новом мировом порядке."
 bftb_turkey.148.b:0 "Это символ давней дружбы!"
 spy_city_turkey_tt:0 "[ROOT.GetNameDefCap] установило хорошие отношения с воюющими друг с другом великими европейскими державами."
 TUR_etatism_economy_law_idea:0 "Этатизм"
 TUR_etatism_economy_law_idea_desc:0 "Нынешнее строительство турецкого государства тесно связано с принципами кемализма. Этатизм, являющийся одной из шести стрел, призван объединить либеральную экономическую политику Запада с созданием государственных предприятий по примеру Италии и Германии на основе коммунистических пятилетних планов."
 muslim_league_faction:0 "Мусульманская лига"
 TUR_consolidating_minister_cabinet:0 "Укрепление кабинета министров"
 TUR_one_party_many_faces:0 "Одна партия, множество лиц"
 TUR_one_party_many_faces_desc:0 "НРП, будучи единственной партией республики, объединила несколько модернизаторских течений, которые далеко не всегда согласны друг с другом."
 TUR_modest_economic_liberalization:0 "Умеренная экономическая либерализация"
 TUR_modest_economic_liberalization_desc:0 "Государственный контроль над экономикой способен задушить личную инициативу. Именно поэтому необходима либерализация."
 TUR_solidify_the_seventh_inonu_government:0 "Укрепить седьмое правительство Инёню"
 TUR_solidify_the_seventh_inonu_government_desc:0 "В течение нового срока Инёню предстоит добиться очень многого."
 TUR_expand_the_university_education_network:0 "Расширить сеть университетского образования"
 TUR_expand_the_university_education_network_desc:0 "Расширение доступа к образованию необходимо для модернизации страны."
 TUR_reinforce_state_arsenals:0 "Укрепить государственные арсеналы"
 TUR_reinforce_state_arsenals_desc:0 "Государственные арсеналы являются краеугольным камнем системы снабжения наших вооружённых сил."
 TUR_traditionalize_the_ataturk_legacy:0 "Традиционализировать наследие Ататюрка"
 TUR_traditionalize_the_ataturk_legacy_desc:0 "Ататюрк хотел создать нацию для турок. Он был прав, однако этот проект должен учитывать и нашу многовековую историю."
 TUR_back_the_traditionalist_cause:0 "Поддержать традиционалистов"
 TUR_back_the_traditionalist_cause_desc:0 "Мы должны вернуться к своим имперским корням."
 TUR_the_true_muslim_unity:0 "Истинное мусульманское единство"
 TUR_the_true_muslim_unity_desc:0 "Лишь единство уммы гарантирует наш успех."
 TUR_institutional_reorganization:0 "Институциональная реорганизация"
 TUR_institutional_reorganization_desc:0 "Правительство должно быть реорганизовано, чтобы соответствовать нашим идеологическим целям."
 TUR_black_sea_swindle:0 "Черноморская афера"
 TUR_black_sea_swindle_desc:0 "Наши враги будут изгнаны далеко за пределы нашего моря."
 TUR_revert_mesopotamian_campaign:0 "Возобновить Месопотамскую кампанию"
 TUR_revert_mesopotamian_campaign_desc:0 "Настало время вернуться на Месопотамскую равнину."
 TUR_seize_the_peninsula:0 "Захватить полуостров"
 TUR_seize_the_peninsula_desc:0 "Наше господство на Балканах должно быть восстановлено."
 TUR_restore_suleinmans_heritage:0 "Восстановить наследие Сулеймана"
 TUR_restore_suleinmans_heritage_desc:0 "Стремления Сулеймана должны вдохновить нас на возрождение нашей великой державы."
 TUR_reapproachment_with_the_west:0 "Сближение с Западом"
 TUR_reapproachment_with_the_west_desc:0 "Несмотря на все свои недостатки, демократии всё ещё могут стать надёжными союзниками."
 TUR_region_security_initiative:0 "Инициатива региональной безопасности"
 TUR_region_security_initiative_desc:0 "Чтобы избежать новой катастрофы, мы обязаны победить!"
 TUR_push_for_the_forceful_militarization:0 "Добиваться принудительной милитаризации"
 TUR_push_for_the_forceful_militarization_desc:0 "Ради обеспечения победы народ должен быть поставлен под ружьё, даже если некоторые станут сопротивляться нашему правому делу."
 TUR_militarism_focus:0 "Милитаризм"
 TUR_fate_of_greece:0 "Судьба Греции"
 TUR_fate_of_greece_desc:0 "Греция доставляет нам проблемы с 1820 года. Больше этого не будет."
 TUR_solidify_the_iberian_flank:0 "Укрепить иберийский фланг"
 TUR_solidify_the_iberian_flank_desc:0 "Аль-Андалус наконец вновь присоединится к Дар аль-Исламу."
 TUR_engulf_the_akdeniz:0 "Поглотить Акдениз"
 TUR_engulf_the_akdeniz_desc:0 "Западные державы наконец научатся нас уважать."
 TUR_preempt_ideological_threat:0 "Предотвратить идеологическую угрозу"
 TUR_preempt_ideological_threat_desc:0 "Коммунистическая подрывная деятельность яростно противостоит нашему государственному строю. С этой угрозой необходимо покончить."
