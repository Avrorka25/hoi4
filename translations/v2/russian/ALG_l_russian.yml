 ALG_amar_imache:0 "Амар Имаш"
 ALG_mohammed_bellounis:0 "Мохаммед Беллунис"
 ALG_ben_ali_boukort:0 "Бен Али Букорт"
 algeria_focus:0 "Национальные фокусы Алжира"
 ALG_communism_party:0 "КПА"
 ALG_fascism_party:0 "Хунта АПНАФ"
 ALG_democratic_party:0 "СЕА"
 AFG_democratic_party_long:0 "Североафриканская звезда"
 ALG_neutrality_party:0 "ФНО"
 ALG_neutrality_party_long:0 "Фронт национального освобождения"
 ALG_mediterranean_bastion_idea:0 "Средиземноморский бастион"
 ALG_study_french_ships:0 "Опыт флота [FRA.GetAdjective]"
 ALG_depoliticized_army:0 "Деполитизированная армия"
 ALG_bousfer_air:0 "Авиационные заводы Бусфера"
 ALG_religious_freedom_buff:0 "Свобода вероисповедания"
 ALG_crackdown_on_extremist_groups:0 "Подавление пье-нуаров"
 ALG_malg_buff:0 "МАЛГ"
 ALG_reform_industries:0 "Промышленные реформы"
 ALG_land_reforms:0 "Земельные реформы"
 ALG_land_reforms_desc:0 "Налоговая реформа колониальной администрации серьёзно ограничила возможности землевладельцев и сельскохозяйственный потенциал наших земель. Новый режим должен извлечь уроки из прошлых ошибок, реформировав налоговую систему и обновив кадастровую карту страны."
 ALG_army_loyalty_idea:0 "Обеспеченная лояльность армии"
 ALG_hadj_is_great:0 "Курс Хаджа"
 ALG_abbas_is_great:0 "Единство под руководством Аббаса"
 ALG_communism_support:0 "Коммунистическое влияние"
 ALG_fascism_support:0 "Фашистское влияние"
 ALG_new_industries:0 "Поддержка тяжёлой промышленности"
 ALG_provisional_government:0 "Временное правительство [ALG.GetAdjective]"
 ALG_provisional_government_desc:0 "После обретения независимости Временное правительство пока состоит из представителей множества политических партий, включая ФНО, СЕА и даже КПА. В государстве [ALG.GetNameDef] сохранится крайне хрупкий баланс сил, пока мы не создадим легитимное правительство."
 ALG_pieds_noir:0 "Пье-нуары"
 ALG_pieds_noir_desc:0 "Колоны, или пье-нуары, — французские колонисты и лоялисты в Алжире. На протяжении многих лет они господствовали в правительстве и контролировали большую часть богатств Алжира. Они по-прежнему блокируют или затягивают любые попытки провести даже самые умеренные реформы, что станет серьёзным препятствием на пути к созданию легитимного правительства Алжира."
 ALG_national_guard:0 "Создаёт пять дивизий §HНациональной гвардии§! в сельских районах."
 ALG_national_guard2:0 "Формирует ещё три дивизии §HНациональной гвардии§! в столичном регионе."
 ALG_armed_forces:0 "Вооружённые силы [ALG.GetAdjective]"
 ALG_armed_forces_desc:0 "Защита страны опирается на три рода вооружённых сил: сухопутную армию, военно-морские части и авиацию. Создание отдельной и независимой структуры командования может оказаться трудным, но необходимым шагом для сохранения нашей самостоятельности."
 ALG_APNAF:0 "Создать АПНАФ"
 ALG_APNAF_desc:0 "Зависимость от колониального гарнизона — устаревшее наследие нашего колониального прошлого. Настало время выдвинуть генералов [ALG.GetAdjective] и превратить Народные национальные вооружённые силы [ALG.GetAdjective] в полноценную армию."
 ALG_first_air_force:0 "Первые военно-воздушные силы Алжира"
 ALG_first_air_force_desc:0 "Контроль над воздушным пространством нашей страны прежде зависел от иностранных держав. Возрождение Алжира и его былого наследия возможно лишь в том случае, если мы выделим дополнительные средства и создадим первую авиационную эскадрилью для защиты границ и воздушного пространства."
 ALG_ANN:0 "Создать АНФ"
 ALG_ANN_desc:0 "Протяжённое средиземноморское побережье нашей страны требует достаточных сил для отражения любой возможной агрессии с моря. Национальный флот [ALG.GetAdjective] получит государственные субсидии и будет выделен в отдельное ведомство."
 ALG_naval_effort:0 "Пересмотреть морские доктрины"
 ALG_naval_effort_desc:0 "Иностранные военно-морские атташе были приглашены в государство [ALG.GetNameDef], чтобы оценить состояние флота страны и его боеспособность. Через неделю отчёт был передан [ALG.GetLeader]: в нём говорилось, что морские доктрины требуют серьёзного улучшения, а адмиралы должны освоить применение новых тактик."
 ALG_destroyer_effort:0 "Современные эсминцы"
 ALG_destroyer_effort_desc:0 "Будучи одним из ведущих производителей и экспортёров стали в Средиземноморье, наша страна поддерживает тесные экономические связи со многими государствами региона. В случае войны торговым конвоям и транспортам потребуется защита, чтобы сохранить эти связи. Заказ нескольких новых эсминцев для флота должен решить проблему."
 ALG_submarine_focus:0 "Подводная война"
 ALG_submarine_focus_desc:0 "У противника могут быть большие и мощные корабли, но они медленнее и менее манёвренны, чем наши новейшие подводные лодки. Их дальнейшее совершенствование позволит распространить тактику охоты на конвои на Восточное Средиземноморье и Атлантику!"
 ALG_algiers_port:0 "Верфи Алжира"
 ALG_algiers_port_desc:0 "Порт Алжира известен безопасным расположением, хорошей защитой от ветра и двумя гаванями, способными обслуживать флотилию торговых и транспортных судов. Расширение порта и судостроительных мощностей позволит принимать больше конвоев и быстрее строить новые корпуса кораблей!"
 ALG_oran_port:0 "Расширить порт Орана"
 ALG_oran_port_desc:0 "Порт Орана — наше окно в Атлантику и второй по величине порт страны. Мы можем улучшить его, построив дополнительные гавани и центры военно-морского производства. Кроме того, там сможет базироваться большая часть нашего флота."
 ALG_bejaia_port:0 "Основать порт Беджая"
 ALG_bejaia_port_desc:0 "К востоку от Алжира находится город Беджая, служащий главным транспортным центром для регионов Константины и Батны. Создание военно-морского опорного пункта в этом районе значительно расширит возможный радиус действий нашего флота и позволит направить больше ресурсов в восточную часть страны."
 ALG_cruiser_focus:0 "Современные крейсеры"
 ALG_cruiser_focus_desc:0 "Корабли прикрытия, такие как лёгкие и тяжёлые крейсеры, представляют собой отличное сочетание огневой мощи, тоннажа и стоимости. Наши верфи уже строят несколько таких кораблей, однако их проекты выглядят устаревшими по сравнению с аналогами великих держав и требуют улучшения."
 ALG_carrier_focus:0 "Морская авиация"
 ALG_carrier_focus_desc:0 "Использование авианосцев позволит значительно расширить взаимодействие флота и авиации. Несколько таких кораблей мы уже видели в своих портах. Возможно, настало время попробовать построить их самостоятельно?"
 ALG_battleship_focus:0 "Большие орудия"
 ALG_battleship_focus_desc:0 "Линкоры не зря называют гордостью флота. Эти плавучие крепости воплощают мощь, броню и огневую силу. Мы должны вложиться в их разработку и совершенствование."
 ALG_marines:0 "Создать корпус морской пехоты"
 ALG_marines_desc:0 "Войска специального назначения представляют собой наиболее профессиональную, хорошо обученную и оснащённую часть наших вооружённых сил. Выделение отдельного бюджета на морские операции лишь повысит эффективность флота и наши военные возможности."
 ALG_bomber_focus:0 "Упор на бомбардировщики"
 ALG_bomber_focus_desc:0 "Господство в небе — лишь первый шаг к победе. После того как истребители обеспечат контроль воздушного пространства, мы направим эскадрильи новых бомбардировщиков, чтобы дезорганизовать войска противника и уничтожить его заводы."
 ALG_radar_focus:0 "Новые радиолокационные технологии"
 ALG_radar_focus_desc:0 "В случае военного конфликта мы должны любой ценой защитить промышленность страны. Даже если армии находятся далеко, над страной нависает угроза налётов бомбардировщиков на наши драгоценные заводы. Развитие радиолокационных технологий должно положить конец этой угрозе."
 ALG_fighter_focus:0 "Современные истребители"
 ALG_fighter_focus_desc:0 "Темп современной войны задаёт тот, кто первым оказывается на поле боя. Чтобы успешно вести воздушные бои, необходимо модернизировать устаревшие модели истребителей."
 ALG_cas_focus:0 "Упор на штурмовую авиацию"
 ALG_cas_focus_desc:0 "Враг познает ярость наших новых пикирующих бомбардировщиков: они сломят боевой дух его солдат и внесут хаос в ряды ничего не подозревающих армий."
 ALG_air_bases:0 "Расширить авиабазы Алжира"
 ALG_air_bases_desc:0 "Аэропорт Мезон-Бланш был построен в 1924 году как главный узел воздушного сообщения между метрополией Франции и Алжиром. Недавний рост наших военно-воздушных сил требует его расширения для военных нужд."
 ALG_bousfer_air_factory:0 "Открыть авиазавод в Бусфере"
 ALG_bousfer_air_factory_desc:0 "Бусфер — небольшой город рядом с Ораном, нашим вторым по величине промышленным центром. Он кажется идеальным местом для строительства нового промышленного предприятия, специализирующегося на производстве самолётов."
 ALG_develop_air_doctrines:0 "Развить воздушные доктрины"
 ALG_develop_air_doctrines_desc:0 "Даже современный истребитель в руках неопытного пилота, применяющего устаревшие доктрины, неизбежно станет жертвой вражеских асов, вооружённых лучшими тактическими знаниями. Отставание недопустимо, поэтому выпускников авиационных академий необходимо обучать новым методам применения самолётов."
 ALG_mediterranean_baiston:0 "Средиземноморский бастион"
 ALG_mediterranean_baiston_desc:0 "Пусть весь мир знает: именно государство [ALG.GetNameDef], а не Мальта, [GRE.GetNameDef] или [ITA.GetNameDef], будет называться «Средиземноморским бастионом», ведь у нас есть современные корабли, усовершенствованная тактика и умелые командиры!"
 ALG_study_ships:0 "Изучить корабли [FRA.GetAdjective]"
 ALG_study_ships_desc:0 "Как отметили чиновники [FRA.GetAdjective], независимо от состояния отношений между государствами [FRA.GetNameDef] и [ALG.GetNameDef], обеим странам будет выгодна координация разработки военно-морского оснащения. Несколько их кораблей специально пришвартованы в наших портах для этих целей."
 ALG_naval_bomber_focus:0 "Разработка морских бомбардировщиков"
 ALG_naval_bomber_focus_desc:0 "Изобретательность и творческий подход исследователей и теоретиков [ALG.GetAdjective] подарили миру совершенно новый класс самолётов — морские бомбардировщики. Предназначенные прежде всего для действий на море, они, похоже, являются последним недостающим звеном во взаимодействии флота и авиации."
 ALG_doctrine_effort:0 "Военный колледж Алжира"
 ALG_doctrine_effort_desc:0 "Недавно созданные АПНАФ используют устаревшие доктрины времён Великой войны, которые совершенно ненадёжны в современных вооружённых конфликтах. Следует расширить Военную академию, создав кафедру тактики, которая займётся модернизацией доктрин сухопутных войск."
 ALG_guns_focus:0 "Модернизировать стрелковое оружие"
 ALG_guns_focus_desc:0 "Колониальное ополчение не получало должного финансирования от французской оккупационной администрации. Правительство [ALG.GetAdjective] такой ошибки не повторит: тендер на новейший прототип винтовки уже объявлен, а отечественные производители вооружений напряжённо работают над созданием лучшего снаряжения для наших войск."
 ALG_french_tanks:0 "Изучить танки [FRA.GetAdjective]"
 ALG_french_tanks_desc:0 "Во время реорганизации одной из военных баз наши инженеры с удивлением обнаружили на складе забытые французские танки. У народа [FRA.GetAdjective] сейчас хватает других забот, поэтому мы можем найти хорошее применение этим 20 машинам, улучшив их конструкцию и приспособив к нашему пересечённому рельефу."
 ALG_artillery_focus:0 "Современная артиллерия"
 ALG_artillery_focus_desc:0 "Последние отчёты с учебных полигонов указывают на острую необходимость улучшить производимые нами артиллерийские орудия: их надёжность, огневая мощь и бронепробиваемость значительно уступают полученным иностранным образцам."
 ALG_mechanized_focus:0 "Механизировать армию"
 ALG_mechanized_focus_desc:0 "Пока войска осваивают новую моторизованную технику, танковые дивизии требуют кампании по механизации. Мы заменим лёгкие бронированные пехотные грузовики бронетранспортёрами: это несколько снизит общую скорость дивизий, но обеспечит пехотным полкам необходимую защиту."
 ALG_general_staff:0 "Реорганизовать Генеральный штаб"
 ALG_general_staff_desc:0 "Совершенствование армии бессмысленно, если солдатами командуют некомпетентные, идеологически обработанные или коррумпированные чиновники и военачальники. Небольшая реорганизация Генерального штаба повысит эффективность войск на поле боя."
 ALG_special_forces:0 "Львы пустыни"
 ALG_special_forces_desc:0 "Война может прийти с моря, суши или воздуха. В случае наземного нападения наши силы будут сражаться в бескрайних пустынях на западе и юге страны. Расширение ударных частей, способных действовать при экстремальной жаре и на песчаной местности, повысит боевые возможности армии."
 ALG_motorized:0 "План моторизации"
 ALG_motorized_desc:0 "Одной из причин опустошительных потерь Великой войны стало широкое применение пешей пехоты. Эпоха медленных пехотных батальонов уходит в прошлое — наступает век мобильных моторизованных частей, и наши нововведения принесут нам огромную пользу!"
 ALG_field_hospitals:0 "Новые полевые госпитали"
 ALG_field_hospitals_desc:0 "Суровые природные условия и болезни уносят больше жизней наших солдат, чем нынешний противник. Формирование улучшенных батальонов полевых госпиталей значительно повысит шансы бойцов пережить вооружённый конфликт."
 ALG_signal_companies:0 "Роты связи"
 ALG_signal_companies_desc:0 "Огромные пространства страны и постоянно меняющиеся природные условия вынуждают применять новые способы связи между сухопутными частями, такие как телефонные линии и радио. Новые роты связи значительно повысят скорость реакции и мобильность наземных войск."
 ALG_modern_logistics:0 "Современная логистика"
 ALG_modern_logistics_desc:0 "Заправка и снабжение гарнизонов и батальонов станут ещё эффективнее, если каждой дивизии придать отдельное подразделение, отвечающее за логистику и доставку припасов. Современные проблемы требуют современных решений, и это одно из них."
 ALG_election:0 "Первые всеобщие выборы"
 ALG_election_desc:0 "Срок полномочий Временного правительства Ферхата Аббаса подходит к концу. Для государства [ALG.GetNameDef] наступает время неопределённости: многие сомневаются в демократическом характере выборов, а некоторые радикалы требуют немедленной смены власти. Действующие чиновники и элиты прилагают все усилия, чтобы обеспечить легитимность и отсутствие коррупции на первых всеобщих выборах в государстве [ALG.GetNameDef]."
 ALG_hadj_victory:0 "Победа Хаджа"
 ALG_hadj_victory_desc:0 "Мессали Хадж, также известный как «отец» национализма [ALG.GetAdjective], получил большинство голосов. Он является одним из главных представителей партии «Североафриканская звезда», основные усилия которой направлены на борьбу с империализмом демократическими средствами."
 ALG_abbas_victory:0 "Победа Аббаса"
 ALG_abbas_victory_desc:0 "Под руководством Ферхата Аббаса Фронт национального освобождения теперь работает над формированием парламентского большинства. Аббас — сторонник умеренного национализма, временами прибегающий к оппортунистической политике. Он умеет маневрировать и создавать коалиции практически из ничего. Возможно, именно это принесёт стабильность государству [ALG.GetNameDef]?"
 ALG_army_loyalty:0 "Обеспечить лояльность армии"
 ALG_army_loyalty_desc:0 "Новое правительство стремится укрепить хрупкое государство [ALG.GetAdjective] и сохранить его независимость. Однако становится всё очевиднее, что армейские круги могут готовить заговор против нынешнего режима. Устранение ненадёжных руководителей обеспечит поддержку армии нашему делу."
 ALG_depoliticize_the_army:0 "Деполитизировать армию"
 ALG_depoliticize_the_army_desc:0 "Армия сыграла важнейшую роль в восстановлении статуса и легитимности нашей страны на мировой арене, однако её растущее вмешательство в государственные дела тревожит чиновников. Отделение армии от политики обеспечит независимость обеих сфер."
 ALG_malg:0 "Расширить МАЛГ"
 ALG_malg_desc:0 "Министерство вооружений и общих связей — МАЛГ — является государственной разведывательной службой, созданной при временном правительстве для защиты нового государства [ALG.GetAdjective] от иностранного влияния. Его роль в обеспечении безопасности неоспорима, поэтому необходимо расширить ведомство до уровня возможностей МИ-6, Абвера или НКВД."
 ALG_algiers_university:0 "Расширить Алжирский университет"
 ALG_algiers_university_desc:0 "Алжирский университет был основан в 1909 году и стал первым университетом на алжирской земле. Увеличение финансирования и расширение исследовательских кафедр повысят качество образования и дадут стране новое поколение талантливых специалистов."
 ALG_reorginize_industries:0 "Реорганизовать промышленность"
 ALG_reorginize_industries_desc:0 "Зависимость от метрополии была одним из краеугольных камней колониальной политики государства [FRA.GetNameDef]. Теперь, получив автономию, мы должны диверсифицировать и реформировать производственные и транспортные цепочки, чтобы максимально повысить эффективность нынешнего промышленного сектора."
 ALG_british_industrial_investments:0 "Британские промышленные инвестиции"
 ALG_british_industrial_investments_desc:0 "Демократическая ориентация нашего правительства и несколько дипломатических миссий убедили инвесторов [ENG.GetAdjective] профинансировать ряд промышленных проектов по всей стране, заложив новую основу национальной промышленности."
 ALG_western_technological_learnings:0 "Освоить западные технологии"
 ALG_western_technological_learnings_desc:0 "Иностранным учёным, инженерам и разработчикам было направлено множество приглашений к сотрудничеству с нашими научно-исследовательскими учреждениями, чтобы улучшить нынешнее состояние образования и производства в государстве [ALG.GetNameDef]."
 ALG_united_under_abbas:0 "Единство под руководством Аббаса"
 ALG_united_under_abbas_desc:0 "Политика правительства Аббаса резко укрепила веру народа в наше дело, доказав, что ФНО под его руководством поведёт страну к процветающему и светлому будущему!"
 ALG_crack_down_on_extremist_groups:0 "Подавить пье-нуаров"
 ALG_crack_down_on_extremist_groups_desc:0 "Мы не можем игнорировать волю народа и его требования, однако пье-нуары угрожают нашей конституции и стабильности нынешнего режима. У нас не остаётся выбора, кроме как сократить их влияние в промышленности."
 ALG_religious_freedom:0 "Свобода вероисповедания"
 ALG_religious_freedom_desc:0 "Хотя ислам на протяжении последней тысячи лет был краеугольным камнем нашей страны, настало время признать другие религиозные течения равноправными. Это может разгневать некоторых верующих, но без подобного шага любая демократическая система превращается в фарс."
 ALG_hadjs_guidance:0 "Курс Хаджа"
 ALG_hadjs_guidance_desc:0 "Демократизация, секуляризация и прочные связи с ведущими демократиями мира подняли популярность Хаджа и СЕА до невероятных высот. Многие граждане добровольно вступают в партию и помогают чиновникам распространять демократические ценности по всей стране!"
 ALG_turkish_relations:0 "Подтвердить связи с [TUR.GetAdjective]"
 ALG_turkish_relations_desc:0 "Турецкое правление над нашей страной было сравнительно недолгим, но оказалось одним из наименее жестоких среди всех колониальных режимов на нашей земле. Братские связи можно углубить ещё сильнее и, возможно, со временем создать движение неприсоединения или новую федерацию по всему Средиземноморью."
 ALG_deterrence:0 "Сдерживание иностранных держав"
 ALG_deterrence_desc:0 "Наша оборонительная позиция требует прочной основы. Дипломатия и хорошие отношения с другими странами идут нам на пользу, однако по мере роста мировой напряжённости мы обязаны сохранять бдительность."
 ALG_arab_independence:0 "Сияющий маяк арабской независимости"
 ALG_arab_independence_desc:0 "Будучи одной из первых полностью независимых арабских стран Средиземноморья, мы должны сделать всё, чтобы арабские народы больше не становились жертвами колониальных амбиций."
 ALG_interventionist_foreign_policy:0 "Интервенционизм: [ALG.GetAdjective]"
 ALG_interventionist_foreign_policy_desc:0 "Мы твёрдо выступаем за мир и поддерживаем пацифистские ценности, однако не можем безучастно смотреть, как демократии по всему миру страдают и гибнут в вооружённых конфликтах. Наши вооружённые силы будут направляться в кризисные регионы, чтобы защищать наши ценности за рубежом."
 ALG_collaboration_with_allies:0 "Сотрудничество с Союзниками"
 ALG_collaboration_with_allies_desc:0 "Крупнейшим демократиям мира потребуется помощь, если они хотят сохранить независимость и существующие государственные институты. Мы присоединимся к их борьбе за свободу и независимость под знамёнами Союзников!"
 ALG_aid_nuclear_programs:0 "Помочь ядерным программам Союзников"
 ALG_aid_nuclear_programs_desc:0 "В рамках Манхэттенского проекта ведётся разработка новых систем вооружения, способных уничтожать города и опустошать целые армии. Мы можем направить часть дипломатических ресурсов, чтобы обеспечить себе долю в этих исследованиях."
 ALG_algeria_liberated:0 "Освобождение: [ROOT.GetAdjective]"
 ALG_algeria_liberated_desc:0 "После почти столетия подчинения и множества испытаний, пережитых народом под колониальным владычеством, нация [ALG.GetAdjective] наконец вновь обрела свободу!"
 ALG_peasant_strike:0 "Великая крестьянская забастовка"
 ALG_peasant_strike_desc:0 "Законодательная и исполнительная власть временного правительства крайне хрупка и неустойчива. Малейший сбой в цепочках поставок, промышленный застой или спорное политическое решение вызовут массовые демонстрации и протесты, которыми мы сможем воспользоваться, если будем действовать быстро."
 ALG_new_type_of_nationalism:0 "Новый тип национализма"
 ALG_new_type_of_nationalism_desc:0 "Крестьяне пытались навязать стране свою власть и господство, что при нынешних обстоятельствах совершенно неприемлемо для элиты. Чтобы искоренить коммунистическую обработку масс, мы можем начать программу поощрения патриотических чувств среди населения."
 ALG_german_industries:0 "Сотрудничество с пье-нуарами"
 ALG_german_industries_desc:0 "Хотя пье-нуары тесно связаны с [FRA.GetAdjective] и колониальным порядком, они по-прежнему обладают огромным влиянием на промышленность нашей страны. Поэтому разумнее всего попытаться наладить с ними сотрудничество."
 ALG_expand_conscription:0 "Расширить призыв"
 ALG_expand_conscription_desc:0 "По мере роста напряжённости во всём мире, особенно в Европе и Азии, мы не можем оставаться безучастными. Для создания армии потребуются тысячи новых мужчин и женщин. Закон о воинской повинности будет серьёзно переработан в соответствии с требованиями Генерального штаба."
 ALG_mobolize_reserves:0 "Мобилизовать резервы"
 ALG_mobolize_reserves_desc:0 "Полноценный призыв новобранцев займёт много времени, но боеспособные силы нужны здесь и сейчас. Ветераны прежних войн и местные добровольцы могут сформировать военизированные отряды, которые после достаточной подготовки войдут в состав регулярной армии."
 ALG_new_heavy_industries:0 "Новая тяжёлая промышленность"
 ALG_new_heavy_industries_desc:0 "Сотрудничество с пье-нуарами помогло создать предприятия тяжёлой промышленности в наших городских центрах. К счастью, ресурсов у нас достаточно, чтобы поддержать такой экономический рывок!"
 ALG_expand_algeirs_university:0 "Военный колледж Алжира"
 ALG_expand_algeirs_university_desc:0 "Современным офицерам необходимо современное образование, которое способны дать военные учебные заведения высокого уровня. Создание соответствующего факультета обойдётся недёшево, однако долгосрочные преимущества с лихвой окупят эти расходы."
 ALG_join_axis:0 "Дело Оси"
 ALG_join_axis_desc:0 "Политика нынешнего режима показывает, что у нас немало общего с фашистскими державами мира. Возможно, союз с ними обеспечит нам достойное место под солнцем?"
 ALG_our_own_path:0 "Новый Алжир"
 ALG_our_own_path_desc:0 "Нынешняя напряжённая дипломатическая обстановка показывает, что было бы глупо примыкать к какой-либо великой державе ради второстепенной роли в чужом конфликте. Мы сами определим свою судьбу и создадим собственный дипломатический союз."
 ALG_comintern_membership:0 "Членство в Коминтерне"
 ALG_comintern_membership_desc:0 "Наша преданность коммунистическим идеям пересекла моря и достигла родины революции. Защищать общие идеи и идеалы будет гораздо проще под знаменем Коминтерна. Отправим посланников в Москву и официально запросим союз!"
 ALG_the_peasants_republic:0 "Коммуна: [ALG.GetAdjective]"
 ALG_the_peasants_republic_desc:0 "Уже давно было ясно, что воля народа, сила рабочих и поддержка крестьян приведут страну к желанному коммунистическому строю. Если мы хотим воплотить идеи рабочей революции, то должны полностью принять коммунизм!"
 ALG_seize_production:0 "Захватить средства производства"
 ALG_seize_production_desc:0 "Средства производства слишком долго находились в руках капиталистов. Чтобы обеспечить верность предприятий и благосостояние народа, мы должны взять под контроль часть промышленных активов."
 ALG_seize_arms:0 "Захватить оружейную промышленность"
 ALG_seize_arms_desc:0 "Оборонная промышленность слишком долго находилась в руках грязных капиталистов и фашистских прихвостней. Сильному коммунистическому государству необходимо оружие для распространения революции, и добиться этого можно посредством широкой программы национализации."
 ALG_federalize_nation:0 "Провести чистку пье-нуаров"
 ALG_federalize_nation_desc:0 "Пье-нуары были проблемой Алжира с тех пор, как страна оказалась под колониальным владычеством. Теперь, когда мы строим плановую экономику, присутствие капиталистов, разлагающих её изнутри, совершенно неприемлемо. Они должны уйти!"
 ALG_promote_atheism:0 "Продвигать атеизм"
 ALG_promote_atheism_desc:0 "Исламское общество представляло собой интересный этап исторического и научного революционного развития. Однако всему своё время, и наша новая революция диктует новые правила развития общества, в котором религиозным институтам отводится совсем немного места."
 ALG_socialist_science:0 "Социалистическая наука"
 ALG_socialist_science_desc:0 "Особая роль науки как средства борьбы с религиозным абсурдом и неграмотностью вывела нас на новый виток прогресса и величия, позволяя направлять ещё больше средств в научные учреждения!"
 ALG_liberate_morocco:0 "Освободить Марокко"
 ALG_liberate_morocco_desc:0 "Ганнибал был прав, распространяя своё влияние на земли так называемого Марокко. Чтобы исполнить наследие великих предков, мы вновь скрепим братство и сестринство наших двух народов!"
 ALG_liberate_libya:0 "Освободить Ливию"
 ALG_liberate_libya_desc:0 "Нас многое объединяет с нашими ливийскими братьями и сёстрами в культуре и национальном наследии. Чтобы закрепить их особое место в наших глазах, правительство [ALG.GetLeader] предложило смелый план объединить наши народы под знамёнами государства [ALG.GetNameDef]!"
 ALG_secure_suez:0 "Обеспечить контроль над Суэцем"
 ALG_secure_suez_desc:0 "Наши войска идут через пустыню, почти не встречая сопротивления, и освобождают угнетённые народы Северной Африки от колониальных захватчиков. Пришло время нанести последний удар и освободить Египет — колыбель цивилизации, которую столетиями терзали соседние державы!"
 ALG_oil_focus:0 "Инвестировать в «Сонатрак»"
 ALG_oil_focus_desc:0 "Недавнее открытие нефти в пустыне Сахара побудило наших инженеров и геологов предложить смелую инвестиционную программу по созданию нового национального предприятия, которое будет координировать разведку, переработку, транспортировку и эксплуатацию нефти и газа."
 ALG_trade_focus:0 "Открыть внешний рынок"
 ALG_trade_focus_desc:0 "Статус колониального протектората серьёзно ограничивал наш экспорт и импорт. Прежде ведущими инвесторами и партнёрами были исключительно французы, но времена меняются, и теперь мы должны широко открыть глаза и взглянуть на новый мир."
 ALG_mil_focus:0 "Открыть оружейные заводы"
 ALG_mil_focus_desc:0 "Не имея развитой промышленности, наша страна начнёт индустриальное развитие со строительства нескольких оружейных заводов, чтобы удовлетворить потребности растущей армии. Сначала безопасность — затем благосостояние."
 ALG_electronics_focus:0 "Электрификация сельской местности"
 ALG_electronics_focus_desc:0 "Широко распространено мнение, будто следы прогресса и научного развития можно найти только в городах нашей страны. Изменить это устаревшее представление поможет масштабная программа электрификации."
 ALG_steel_focus:0 "Расширить железные рудники Эль-Абеда"
 ALG_steel_focus_desc:0 "Эль-Абед — небольшой шахтёрский посёлок на западе страны, известный богатыми залежами железной руды. Если мы хотим и дальше расширять промышленность, следует рассмотреть возможность инвестиций в этот регион."
 ALG_mil_focus2:0 "Военная промышленность"
 ALG_mil_focus2_desc:0 "Пусть нашу страну нельзя назвать воинственной, мы обязаны быть готовы к любой буре, угрожающей нашим протяжённым границам. Люди у нас есть, и им требуется более новое и современное снаряжение, которое с радостью обеспечат новые предприятия."
 ALG_civ_focus:0 "Вновь открыть французские предприятия"
 ALG_civ_focus_desc:0 "После провозглашения нашей автономии многие французские инвесторы и предприниматели покинули страну, опасаясь мести со стороны населения. Нет необходимости национализировать предприятия, которые при этих обстоятельствах прекратили работу: государство может вновь запустить производство и обеспечить людей необходимыми рабочими местами."
 ALG_infrastructure_focus:0 "Расширить линию Оран—Алжир"
 ALG_infrastructure_focus_desc:0 "Линия Оран—Алжир, открытая в 1862 году и к 1871 году продлённая до конечного пункта, является одной из главных железнодорожных магистралей, соединяющих два крупнейших городских центра страны. Следует расширить линию и развить дополнительную инфраструктуру, чтобы укрепить связь между обоими городами."
 ALG_civ_focus2:0 "Расширить местные мануфактуры"
 ALG_civ_focus2_desc:0 "Сильная экономика — лишь первый шаг к нашей мечте: полностью независимой экономике, основанной на местных производителях!"
 ALG_reform_education:0 "Реформировать систему образования"
 ALG_reform_education_desc:0 "В нашем распоряжении более чем достаточно средств. Бурно развивающаяся промышленность и поддержка производителей позволяют направить ещё больше ресурсов на расширение научных учреждений."
 ALG_italy_trade:0 "Новые рынки: [ITA.GetAdjective]"
 ALG_italy_trade_desc:0 "Альпийский регион богат сталью и алюминием — важнейшими экспортными товарами для [ITA.GetAdjective]. Расширение торговли с государством [ITA.GetNameDef] может помочь сдержать исходящую от него растущую угрозу."
 ALG_britain_trade:0 "Торговые соглашения: [ENG.GetAdjective]"
 ALG_britain_trade_desc:0 "Влияние [ENG.GetAdjective] на мировые ресурсы огромно, поэтому вполне естественно стремиться стать одним из их надёжных торговых партнёров."
 ALG_seize_french_guns:0 "Захватить французское колониальное оружие"
 ALG_seize_french_guns_desc:0 "Государство [ALG.GetNameDef] теперь является сильной и независимой страной; дни колониального владычества остались позади. [FRA.GetAdjective] больше не нуждаются в этом оружии — теперь оно надёжно находится в руках [ALG.GetAdjective]!"
 ALG_end_france:0 "Положить конец тирании: [FRA.GetAdjective]"
 ALG_end_france_desc:0 "Государство [ALG.getNameDef] больше не может безучастно смотреть, как наших братьев и сестёр жестоко угнетает тирания государства [FRA.getNameDef]. Мы должны действовать и освободить арабский мир!"
 ALG_deport_pieds_noir:0 "Депортировать пье-нуаров"
 ALG_deport_pieds_noir_desc:0 "Мы не можем просто изгнать пье-нуаров без всяких оснований, но больше нельзя позволять им разлагать нашу экономику изнутри. Мы отправим их туда, откуда они пришли!"
 algeria.1.t:0 "Первые всеобщие выборы"
 algeria.1.d:0 "Временное правительство хорошо послужило стране, но теперь, когда государство [ALG.getNameDef] обрело полную независимость, настало время дать народу возможность избрать лидера нового правительства. \n\nКого выберет народ?"
 algeria.1.a:0 "Ферхат Аббас — сильный авторитарный лидер."
 algeria.1.b:0 "Мессали Хадж — отец алжирского национализма."
 algeriacivilwar.1:0 "§RЭто приведёт к гражданской войне!§!"
 algeria.2.t:0 "Великая крестьянская забастовка"
 algeria.2.d:0 "С момента обретения государством [ALG.getNameDef] независимости положение в стране остаётся нестабильным. Из-за отсутствия эффективного руководства обещания временного правительства всё больше кажутся пустыми словами.\n\nМногие крестьяне недовольны временным правительством, и коммунистические группы организовали в Алжире забастовки по всему городу. Недавно эти группы вооружились и вступили в столкновения с местной полицией. Ситуация стремительно выходит из-под контроля.\n\nТеперь остаётся решить, как поступить. Если действовать слишком жёстко, существует серьёзный риск, что конфликт перерастёт в полномасштабную гражданскую войну."
 algeria.2.a:0 "Отправить Национальную гвардию разобраться с этим!"
 algeria.2.b:0 "Пусть голос народа будет услышан."
 algeria.3.t:0 "Кровавый захват власти"
 algeria.3.d:0 "Национальная гвардия оказала в Алжире ожесточённое сопротивление и справилась с большей частью вооружённых мятежников. Однако те отчаянно сопротивлялись, нанеся гвардии серьёзные потери.\n\nПоступают сообщения, что оставшиеся группы объединились под знаменем КПА и готовят восстание на востоке страны."
 algeria.3.a:0 "Временное правительство провалилось. Армия должна взять власть полностью."
 algeria.4.t:0 "Беспорядки по всей стране"
 algeria.4.d:0 "Мятежники в Алжире сумели лучше организоваться и теперь почти полностью контролируют город. Национальная гвардия была вынуждена отступить из города и его окрестностей. Одновременно во многих других городах страны под знаменем КПА поднялись новые организации.\n\nНациональная гвардия теперь полностью дезорганизована, однако последние сообщения указывают, что оставшиеся солдаты отходят на восток страны, чтобы продолжить борьбу."
 algeria.4.a:0 "Наконец-то рабочие [ALG.GetAdjective] свободны."
