 ATJ_daoed_beoereoeh:0 "Дао Беэреох"
 ATJ_toeankoe_radja_ibrahim:0 "Туанку Раджа Ибрагим"
 INS_group_indische_partij:0 "Национальная партия Индий"
 INS_group_partai_nasional:0 "Национальная партия Индонезии"
 INS_group_stuwgroep:0 "«Де Стювгруп»"
 INS_group_psii:0 "Партия «Сарекат Ислам Индонезия»"
 INS_claim_guinea:0 "Продолжить экспедицию"
 INS_claim_guinea_desc:0 "Независимо от того, германская она или австралийская, Новая Гвинея уже давно находится под контролем тех, кому нет дела до её народа и кто не имеет на неё прав. Мы исправим это."
 INS_form_the_home_guard:0 "Сформировать внутреннюю гвардию"
 INS_form_the_home_guard_desc:0 "Любые военные действия сначала будут оборонительными и лишь затем наступательными. Поэтому первостепенно важно преобразовать внутреннюю гвардию в эффективную боевую силу."
 INS_interventionism:0 "Продвигать интервенционизм"
 INS_interventionism_desc:0 "КНИЛ имеет давнюю добровольческую традицию; вполне естественно перенести этот энтузиазм в XX век."
 INS_ambonese_auxilaries:0 "Набрать амбонцев"
 INS_ambonese_auxilaries_desc:0 "Хотя амбонцы составляют лишь малую часть населения, в боевых условиях они доказали свою надёжность. Поэтому логично организовать их во вспомогательные части."
 INS_city_fortifications:0 "Городские укрепления"
 INS_city_fortifications_desc:0 "Теперь, когда у нас есть отдельный гарнизон, пора поручить ему строительство первых укреплений вокруг городов. Даже самые скромные усилия сейчас принесут пользу, если случится худшее."
 INS_expand_the_officers_corps:0 "Расширить офицерский корпус"
 INS_expand_the_officers_corps_desc:0 "Сегрегация и расовый дисбаланс пронизывают всю командную структуру. Если обеспечить местным офицерам надлежащую подготовку и поддержку, командование значительно выиграет."
 INS_raaf_assistance:0 "Сотрудничать с К.В.В.С."
 INS_raaf_assistance_desc:0 "[AST.GetNameDefCap] — ближайший союзник, способный оказать настоящую помощь в кризисной ситуации. Расширение авиационного сотрудничества станет простым, но жизненно важным шагом."
 INS_indonesian_fighter_schools:0 "[INS.GetAdjective] школы истребительной авиации"
 INS_indonesian_fighter_schools_desc:0 "Одних теории и снабжения недостаточно. Для дальнейшего развития авиации необходимо подготовить новое поколение лётчиков-асов."
 INS_air_by_sea:0 "Добиться господства в воздухе над морем"
 INS_air_by_sea_desc:0 "Британские стратеги уже обращались к нам с предложением расширить военное сотрудничество ради защиты их азиатских колоний. Возможно, пришло время ответить."
 INS_the_flying_dutchmen:0 "Летучие голландцы"
 INS_the_flying_dutchmen_desc:0 "Мечтать никогда не вредно."
 INS_stay_with_the_netherlands:0 "Подтвердить нашу верность"
 INS_stay_with_the_netherlands_desc:0 "Хотя независимость привлекательна, в нынешней мировой обстановке слишком настойчиво добиваться её непрактично. По крайней мере пока гораздо разумнее придерживаться существующего порядка."
 INS_jewel_of_the_pacific:0 "Жемчужина Тихого океана"
 INS_jewel_of_the_pacific_desc:0 "Если [RAJ.GetNameDef] — жемчужина Британской империи, то Ост-Индия — наша жемчужина. Её богатства и ресурсы являются последним значительным наследием нидерландской морской империи, и мы должны сделать всё для её защиты."
 INS_empower_the_volksraad:0 "Реформировать Фольксраад"
 INS_empower_the_volksraad_desc:0 "Несмотря на громкое название, наш народный совет слаб, неэффективен и почти лишён власти. Для становления подлинной демократии необходимо расширить полномочия народа."
 INS_kebangkitan:0 "Радикализировать националистов"
 INS_kebangkitan_desc:0 "Пробудитесь, индонезийцы, и вновь откройте наследие родной земли. «Да здравствует моя земля, да здравствует моя страна, мой народ, моя родина — всё это; пусть воспрянет её дух, пусть пробудится её тело»."
 INS_PNI:0 "Путь к свободе"
 INS_PNI_desc:0 "Единственный путь вперёд и к выживанию — сильное националистическое государство, обещанное Партией Великой Индонезии. Сотрудничество лишь ослабляет наши шансы на свободу."
 INS_java_shipyards:0 "Расширить верфи [446.GetName]"
 INS_java_shipyards_desc:0 "Чтобы стать самостоятельной морской державой, нужно действовать соответственно. Строительство полноценных верфей станет первым шагом."
 INS_fortify_the_ports:0 "Укрепить порты"
 INS_fortify_the_ports_desc:0 "Наши военно-морские базы являются первой линией обороны, поэтому их защита должна быть приоритетом."
 INS_naval_autonomy:0 "Запросить военно-морскую автономию"
 INS_naval_autonomy_desc:0 "Хотя [HOL.GetAdjective] флот располагает значительными силами на наших берегах и защищает их, мы никак не влияем на его развёртывание. Запрос военно-морской автономии станет первым шагом к господству на море."
 INS_the_test_flight_service:0 "Служба испытательных полётов"
 INS_the_test_flight_service_desc:9 "С 1915 года КНИЛ присутствует в небе. Настало время обеспечить нашей «Службе испытательных полётов» заслуженное развитие."
 INS_knil_integration:0 "Координация сухопутных и воздушных сил"
 INS_knil_integration_desc:0 "С самого создания авиация предназначалась для поддержки основной армии. Строительство стратегически расположенных авиабаз позволит эффективнее помогать войскам на всей нашей территории."
 INS_coastal_entrenchment:0 "Береговые укрепления"
 INS_coastal_entrenchment_desc:0 "Грамотное инженерное обеспечение — последний шаг к надёжной береговой обороне. Наши берега станут неприступными для врага."
 INS_british_ship_designs:0 "Изучить [ENG.GetAdjective] проекты кораблей"
 INS_british_ship_designs_desc:0 "Наши [HOL.GetAdjective] коллеги недавно получили проекты кораблей у [ENG.GetAdjective] стороны. Было бы разумно запросить их и для нашей работы."
 INS_ABDA:0 "АБДА"
 INS_ABDA_desc:0 "Совместная координация между военно-морскими державами региона — лучший ответ на растущие угрозы. Вместе мы сильны."
 INS_joint_wargames:0 "Совместные военные игры"
 INS_joint_wargames_desc:0 "Пришло время продемонстрировать новую морскую мощь в регионе. Пусть все увидят наши возможности."
 INS_convoy_protection:0 "Защитить конвои"
 INS_convoy_protection_desc:0 "Все достижения мира не сделают нас хозяевами моря сами по себе. Чтобы действительно владеть своими водами, необходимо сосредоточиться на силе и защите."
 INS_ship_a_day_tactics:0 "Морские волки"
 INS_ship_a_day_tactics_desc:0 "Наши корабли — не исполины, а волки, готовые охотиться на ничего не подозревающего врага. Морская тактика должна это отражать."
 INS_koninklijk_nederlands_indisch_leger:0 "Армия [ROOT.GetNameDef]"
 INS_koninklijk_nederlands_indisch_leger_desc:0 "Наша армия, если её вообще можно так назвать, разобщена, запущена и почти устарела. Поэтому именно на ней следует сосредоточиться в первую очередь."
 INS_naval_warfare:0 "Изучать морскую войну"
 INS_naval_warfare_desc:0 "Без возможности высадить людей на сушу любое господство на море бесполезно. Наша стратегия должна это учитывать."
 INS_KNIL_marines:0 "Морская пехота КНИЛ"
 INS_KNIL_marines_desc:0 "Война ведётся на всех фронтах, а наше положение в Тихом океане означает прежде всего бои на побережье."
 INS_reform_the_knil:0 "Реорганизовать КНИЛ"
 INS_reform_the_knil_desc:0 "Наши реформы были долгими и болезненными, но завершились успехом! Наши сыновья понесут [INS.GetNameDef], подобно хищной птице, зорко следящей за каждым врагом."
 INS_non_discriminatory_conscription:0 "Призыв без дискриминации"
 INS_non_discriminatory_conscription_desc:0 "Последние три десятилетия набор в армию проводился бессистемно, а попытки сохранить европейское большинство при достаточной численности создали множество проблем. Отмена всех расовых квот — самый простой способ упорядочить структуру армии."
 INS_guerilla_tactics:0 "Партизанская тактика"
 INS_guerilla_tactics_desc:0 "Чтобы сохранить надежду на победу и выживание, мы должны подготовить войска сражаться за каждый клочок земли — в джунглях, горах и на равнинах."
 INS_preemptive_defense:0 "Упреждающая оборона"
 INS_preemptive_defense_desc:0 "Если нам предстоит вести войну, она должна быть по-настоящему современной. Только тогда победа будет гарантирована."
 INS_the_royal_batavian_society:0 "Королевское Батавское общество"
 INS_the_royal_batavian_society_desc:0 "Батавское общество существует уже более 150 лет и воплощает долгую общую историю колонии и научных исследований. Поддержка этой организации станет первым шагом к развитию научного духа страны."
 INS_phillips_radio:0 "Радио «Филипс»"
 INS_phillips_radio_desc:0 "Радиотехника давно является предметом гордости Нидерландов, а в 1927 году голос нашей королевы пересёк океаны и достиг наших берегов. Необходимо использовать полученные знания в дальнейшей работе."
 INS_royal_scientific_cooperation:0 "Научное сотрудничество"
 INS_royal_scientific_cooperation_desc:0 "Исследовательские группы из [HOL.GetNameDef] и Вест- и Ост-Индии должны объединить усилия и создать общий научный процесс. Когда все уголки земного шара работают вместе, нет задачи, которую мы не смогли бы решить."
 INS_knowledge_economy:0 "Экономика знаний"
 INS_knowledge_economy_desc:0 "Народ [INS.GetNameDefCap] — её величайший ресурс. Использование человеческого капитала позволит вывести экономику и технологии на новую высоту."
 INS_local_universities:0 "Местные университеты"
 INS_local_universities_desc:0 "Предоставив народу высшее образование, мы устранили корень проблемы. Благодаря светлым умам завтрашнего дня страна будет становиться всё сильнее."
 INS_scientific_exceptionalism:0 "Батавский университет"
 INS_scientific_exceptionalism_desc:0 "Заложив основу для будущих исследований, мы можем сосредоточиться на развитии научного духа страны и продвижении индонезийской научной исключительности."
 INS_foreign_experts:0 "Иностранные специалисты"
 INS_foreign_experts_desc:0 "Сотрудничая с учёными со всего мира, мы полностью используем научные и технологические ресурсы и укрепим положение страны в мировой науке."
 INS_industrial_centralisation:0 "Централизация промышленности"
 INS_industrial_centralisation_desc:0 "Хотя наши ресурсы значительны, настоящей гражданской экономики у нас нет, а большая часть богатства экспортируется без пользы для народа. Создание устойчивой гражданской экономики станет первым шагом к экономическому росту."
 INS_restore_the_arms_factories:0 "Возродить оружейные заводы"
 INS_restore_the_arms_factories_desc:0 "Крупное производство оружия на нашей территории не велось много лет. Необходимо восстановить оружейные предприятия, чтобы снабжать солдат современным вооружением."
 INS_colonial_infrastructure:0 "Восстановить колониальную инфраструктуру"
 INS_colonial_infrastructure_desc:0 "Существующие колониальные проекты по соединению владений станут идеальной отправной точкой для создания единой [INS.GetName]."
 INS_connect_the_islands:0 "Связать острова"
 INS_connect_the_islands_desc:0 "Нельзя полагаться лишь на инфраструктуру главного острова. Для подготовки к дальнейшей индустриализации необходимо проводить полноценные промышленные проекты на всех островах."
 INS_expand_our_industries:0 "Расширить промышленность"
 INS_expand_our_industries_desc:0 "С самого начала экспортные товары были основой экономики Ост-Индии. И хотя необходимо всеми силами диверсифицировать хозяйство, нет смысла отказываться от прибыльной отрасли, доставшейся нам в наследство."
 INS_economic_independence:0 "Экономическая независимость"
 INS_economic_independence_desc:0 "Самообеспечение — единственная настоящая автономия. Наш суверенитет будет полным лишь тогда, когда ресурсы станут принадлежать народу, а существование и выживание перестанут зависеть от других стран."
 INS_earthworks:0 "Использовать богатства земли"
 INS_earthworks_desc:0 "Научившись преобразовывать местность, мы сможем по-настоящему овладеть землёй великой родины и полностью раскрыть её потенциал."
 INS_continue_the_modernisation:0 "Продолжить модернизацию"
 INS_continue_the_modernisation_desc:0 "Нидерландская этическая политика принесла экономике большую пользу, обеспечив подданным столь необходимую помощь и социальную поддержку. Но этого недостаточно: для дальнейшей модернизации Ост-Индии требуется увеличить финансирование."
 INS_civilian_works:0 "Использовать гражданские проекты"
 INS_civilian_works_desc:0 "Масштабная вырубка лесов и строительство новых заводов запустят экономику и создадут новые промышленные центры страны."
 INS_airborne_industries:0 "Авиационная промышленность"
 INS_airborne_industries_desc:0 "Для островной страны развитая авиационная отрасль имеет первостепенное значение для связи между территориями. Национализация воздушных путей позволит этого добиться."
 INS_envoy_to_japan:0 "Посланник в [JAP.GetNameDef]"
 INS_envoy_to_japan_desc:0 "Единственная националистическая страна в нашем регионе одновременно является его крупнейшей державой. Логично укрепить отношения с ней, чтобы придать нашему движению законность внутри страны."
 INS_the_agreement:0 "Соглашение"
 INS_the_agreement_desc:0 "Ни для кого не секрет, что [JAP.GetAdjective] сторона заинтересована в нашей территории. Возможно, мы сможем использовать это в борьбе за свободу."
 INS_begin_the_transition:0 "Начать переход"
 INS_begin_the_transition_desc:0 "Великий дух [INS.GetNameDef] восторжествовал над всеми врагами. Но наша страна создана для народа, и теперь мы начнём возвращать её ему."
 INS_guided_democracy:0 "Направляемая демократия"
 INS_guided_democracy_desc:0 "Демократия Запада коррумпирована и не лучше фашизма. Настало время для создания новой системы руководства."
 INS_soeara_rakyat:0 "«Если бы я был голландцем»"
 INS_soeara_rakyat_desc:0 "Чтобы стать народным движением, мы должны прежде всего донести свою мысль до народа. Местные политические газеты и листовки станут рупором революции."
 INS_envoy_to_moscow:0 "Посланник в Москву"
 INS_envoy_to_moscow_desc:0 "Хотя [SOV.GetAdjective] сторона находится далеко, она может поддержать наше дело хотя бы ради того, чтобы помешать нам успешно объединиться с другой великой державой."
 INS_claim_timor:0 "Объединить остров Тимор"
 INS_claim_timor_desc:0 "[POR.GetAdjective] присутствие на Тиморе невелико, но всё равно остаётся колониальным влиянием. Если мы настоящие освободители, ни одна колониальная держава не должна контролировать наши острова."
 INS_military_indoctrination:0 "Военная идеологическая подготовка"
 INS_military_indoctrination_desc:9 "У нас есть свобода и сила, но обе хрупки. Для сохранения своего места в истории необходимо ещё сильнее укрепить власть военных."
 INS_collectivise_industry:0 "Обобществить промышленность"
 INS_collectivise_industry_desc:0 "Революция победила. Теперь плоды нашего труда должны вернуться народу, которому они принадлежат."
 INS_reunify_pppki:0 "Воссоединить ПППКИ"
 INS_reunify_pppki_desc:0 "Первая Ассоциация национальных политических организаций Индонезии была расформирована из-за внутренних разногласий между ее основателями Соэкароно и Соэкиманом. Но сейчас времена меняются, и оставшиеся националисты нуждаются в единстве как никогда перед лицом ужесточения голландского контроля. Мы вместе, мы вместе, мы падаем!"
 INS_one_country_one_people_one_language:0 "Одна страна, один народ, один язык"
 INS_one_country_one_people_one_language_desc:0 "Чтобы объединить народ, нельзя допускать разделения по незначительным вопросам языка или расы. В этой великой борьбе мы все — [INS.GetAdjective]."
 INS_our_own_path:0 "Собственный путь"
 INS_our_own_path_desc:0 "Ни [JAP.GetNameDef], ни [SOV.GetNameDef] не дадут нам средств для освобождения. Лишь самостоятельно мы сможем по-настоящему гарантировать суверенную независимость."
 INS_hari_kemerdekaan:0 "День независимости"
 INS_hari_kemerdekaan_desc:0 "Мы так долго ждали свободы, что трудно поверить: этот день наконец настал. Пусть [INS.GetAdjective] народ навсегда запомнит день нашей независимости!"
 INS_gather_the_opposition:0 "Собрать оппозицию"
 INS_gather_the_opposition_desc:0 "Наша борьба за свободу благородна и не основана на насилии или восстании. На каждом шагу мы показываем миру своё право на независимое и суверенное самоуправление."
 INS_allied_but_equal:0 "Союзники, но равные"
 INS_allied_but_equal_desc:0 "Лучший шанс обрести независимость — обратиться к [HOL.GetAdjective] стороне как к друзьям, а не противникам. Если убедить их, что как равные мы принесём больше пользы, чем как подданные, свобода будет обеспечена."
 INS_gapi_focus:0 "Габоэнганский политический деятель Индонезия"
 INS_gapi_focus_desc:0 "Разнообразие страны — повод для гордости, и лишь поддерживая и развивая наши культуры, мы сможем по-настоящему добиться свободы. Если объединить различные легально признанные националистические группы в единую политическую федерацию, наши голоса наверняка услышат!"
 INS_invite_foreign_investors:0 "Пригласить иностранных инвесторов"
 INS_invite_foreign_investors_desc:0 "Привлечение зарубежных инвестиций иностранных компаний является ключом к развитию зарождающегося внутреннего рынка и движению к глобализации."
 INS_koninklijk_paketvaart_maatschappij:0 "Королевское пакетное пароходство"
 INS_koninklijk_paketvaart_maatschappij_desc:0 "Торговые пути Индий когда-то приносили Ост-Индской компании огромные богатства. При должной государственной поддержке наша экономика сможет процветать так же."
 INS_maphilindo:0 "Панмалайская конфедерация"
 INS_maphilindo_desc:0 "Наша приверженность демократии и свободе всех народов безупречна. Настало время обратиться к великим державам и просить их объединить наших братьев и сестёр во имя свободы и единства."
 maphilindo:0 "Мафилиндо"
 INS_peacetime_economics:0 "Экономика мирного времени"
 INS_peacetime_economics_desc:0 "Мы долго шли к свободе, и теперь пора насладиться плодами тяжёлого труда. Народ [INS.GetNameDef] больше не будет знать беспорядков и войны — только мир и процветание."
 INS_unity_in_diversity:0 "Единство в многообразии"
 INS_unity_in_diversity_desc:0 "Хотя мы различны и разобщены, новая общая национальность служит прекрасной объединяющей силой в эти тревожные времена. Каждый мужчина и каждая женщина должны гордиться тем, что они [INS.GetAdjective]."
 INS_PKI:0 "Освободить ссыльных коммунистов"
 INS_PKI_desc:0 "Истинное зло колониализма заключается в том, что богатые и могущественные отнимают у коренных народов богатство и благополучие. Коммунистическая партия Индонезии исправит эту несправедливость."
 INS_political_concessions:0 "Политические уступки"
 INS_political_concessions_desc:0 "В нынешней раздробленной политической обстановке наши сторонники могут получить автономию в обмен на относительную стабильность, которую мы предлагаем."
 INS_defensive_politics:0 "Оборонительная политика"
 INS_defensive_politics_desc:0 "Стабилизировав внутреннюю обстановку, мы должны представить миру единый политический фронт. Оборонительный курс обеспечит высокую сплочённость политической сферы."
 INS_asian_superiority:0 "Превосходство Азии"
 INS_asian_superiority_desc:0 "Наш взлёт стремителен, а наследие обеспечено. Осталось лишь показать миру, кто является настоящей силой в морях Азии."
 INS_strike_japan:0 "Нанести удар по [JAP.GetNameDef]"
 INS_strike_japan_desc:0 "Фашистский поджигатель войны [JAP.GetNameDef] постоянно угрожает стабильности региона. Лишь устранив эту опасность, мы обеспечим дальнейшее процветание."
 INS_konfrontasi:0 "Начать конфронтацию"
 INS_konfrontasi_desc:0 "[MAL.GetNameDefCap] — не более чем марионеточное государство, отвратительное пятно на свободных народах Юго-Восточной Азии. Мы устраним его и ещё сильнее утвердим господство [INS.GetNameDef] в регионе."
 INS_liberate_the_philippines:0 "Освободить Филиппины"
 INS_liberate_the_philippines_desc:0 "[USA.GetAdjective] контроль над [PHI.GetNameDef] ничем не лучше колониального господства старых держав. Мы освободим братьев от [USA.GetAdjective] захватчиков!"
 INS_westernisation:0 "Продвигать политическое сотрудничество"
 INS_westernisation_desc:0 "Хотя наше колониальное правительство доброжелательно, оно остаётся крайне непопулярным. Если приспособить западные ценности и идеи к тому, что приемлемо для населения, оно, вероятно, будет гораздо благосклоннее относиться к нашей власти."
 INS_limited_autonomy:0 "Вопрос о Содружестве"
 INS_limited_autonomy_desc:0 "Несмотря на постоянные испытания, мы вновь и вновь доказывали верность [HOL.GetAdjective] правительству. Возможно, теперь оно предоставит нам настоящую автономию в обмен на более эффективное управление Ост-Индией."
 INS_join_allies:0 "Вступить в Союзники"
 INS_join_allies_desc:0 "Формализация оборонительных договорённостей с соседями означает отказ от регионального нейтралитета, но это малая цена за защиту."
 INS_modernize_the_military:0 "Модернизировать вооружённые силы"
 INS_braat_overvalwagen:0 "«Браат Овервалваген»"
 INS_braat_overvalwagen_desc:0 "Возможно, с материалами, предоставленными существующими автомобильными компаниями, мы должны создать свой собственный бронированный автомобиль, который больше подходит для нашей местности. От шумного города Соерабаджа до глубины джунгли Новой Гвинеи!"
 INS_spawn_landstorm_division:0 "Создать дивизию §Y«Ост-Индский ландсторм»§! в §Y[THIS.GetName]§!."
 INS_spawn_irregular_division:0 "Создать §Y2 дивизии «Иррегюльере дивизи»§! в §Y[THIS.GetName]§!."
 netherlands_research_name:0 "[HOL.GetNonIdeologyName]: исследования"
 netherlands_research_desc:0 "Международное сотрудничество Нидерландов и их колоний позволяет добиваться более значительных технологических достижений."
 INS_naval_autonomy_tooltip:0 "Даже если [HOL.GetNameDef] откажет, мы всё равно получим небольшую награду."
 INS_bunker_tooltip:0 "Добавляет укрепления в ключевых городских провинциях."
 INS_ports_tooltip:0 "Добавляет береговые укрепления на ключевых военно-морских базах."
 committed_colonialist:0 "Убеждённый колониалист"
 committed_colonialist_desc:0 "Этот лидер безоговорочно предан колониальной администрации и противится любым движениям за независимость."
 nationalist_uniter:0 "Объединитель националистов"
 nationalist_uniter_desc:0 "Этот лидер верит в право народов на самоопределение и охотно протянет им руку помощи."
 committed_revolutionary:0 "Убеждённый революционер"
 committed_revolutionary_desc:0 "Этот лидер предан международной революции и не остановится ни перед чем, чтобы принести соседям свободу."
 democratic_defender:0 "Защитник демократии"
 democratic_defender_desc:0 "Этот лидер считает демократию своей страны завоёванным с трудом правом и будет её защищать."
 raaf_assistance:0 "Помощь К.В.В.С."
 denied_freedom:0 "Отказ в свободе"
 INS_navy_reforms:0 "Реформы флота"
 INS_army_reforms:0 "Реформы армии"
 INS_science_reforms:0 "Научная реформа"
 INS_economy_reforms:0 "Экономическая реформа"
 INS_political_reforms:0 "Политические реформы"
 INS_knilm:0 "Королевские Нидерландско-Индийские авиалинии"
 INS_knilm_desc:0 "Основаны в 1928 году."
 INS_garuda:0 "Авиалинии «Гаруда»"
 INS_garuda_desc:0 "Активы получены после национализации КНИЛМ в 1949 году."
 INS_ptt:0 "Почтово-телеграфно-телефонная служба"
 INS_ptt_desc:0 "Почтово-телеграфно-телефонная служба, созданная в 1906 году как государственное ведомство."
 INS_postel:0 "ПН «Постел»"
 INS_postel_desc:0 "Индонезийская почтово-телекоммуникационная компания, получившая активы после национализации ПТТ в 1945–1949 годах."
 INS_braat:0 "Машиностроительный завод «Браат»"
 INS_braat_desc:0 "Машиностроительный завод «Браат», основанный в 1902 году."
 INS_barata:0 "Металлургическая и инженерная компания «Барата»"
 INS_barata_desc:0 "«Барата Индонезия», получившая активы после национализации машиностроительного завода «Браат» в 1961 году."
 INS_shell:0 "Батавская нефтяная компания"
 INS_shell_desc:0 "Основана в Батавии в 1907 году."
 INS_permina:0 "«Пермина»"
 INS_permina_desc:0 "Национальная нефтяная компания, получившая активы после национализации БНК в 1945–1957 годах."
 INS_caltex:0 "«Калтекс» — подразделение Риау"
 INS_koolhoven:0 "«Коолховен» — ост-индское подразделение"
 INS_fokker:0 "«Фоккер» — ост-индское подразделение"
 INS_merbaboe:0 "Мербабо Венуочап"
 INS_soerabaja_dm:0 "Соерабайя Другдок Маацаппидж"
 INS_soerabaja_dm_desc:0 "Исторически установленный в Соерабахе в 1910 году, с 1913 года здесь работает несколько доков, в том числе 14 000 тонн сухого дока, установленного в 1916 году."
 INS_pal_surabaya:0 "Пенатаран Ангкатан Лаоэт - Сурабая"
 INS_pal_surabaya_desc:0 "Первый индонезийский судостроительный сухой док, активы, приобретенные от национализации Soerabaja DM в различный момент через период времени 1945-1957."
 INS_ptdi:0 "Бюро авиационного проектирования и строительства"
 INS_ptdi_desc:0 "Основан с нуля в 1946 году в Мадиоэне, Восточная Ява."
 INS_nv_merbaboe:0 "Н.В. Мербабо"
 INS_sstw:0 "Государственные железные дороги и трамваи"
 INS_sstw_desc:0 "Основанная в 1875 году в Бандоэне, Государственная железнодорожная и трамвайная служба является правительственным аналогом частной железнодорожной компании Нидерландской Индии."
 INS_dkari:0 "Джаватан Керета Апи Репоблик Индонезия"
 INS_dkari_desc:0 "Создано в ходе Национальной революции и получило активы после национализации ГЖДТ и НИЖК."
 INS_daf:0 "Завод прицепов Дорна — ост-индское подразделение"
 INS_gm_java:0 "«Дженерал Моторс» — Яванская торговая компания"
 INS_gm_java_desc:0 "Основанная в 1927 году в Танджоэн Приоке, первая фабрика по производству грузовиков открылась в 1938 году."
 INS_toyota:0 "«Тойота»"
 INS_hanomag:0 "«Ганновер МАГ» — ост-индское подразделение"
 INS_acf:0 "Американская вагоностроительная и литейная компания — ост-индское подразделение"
 INS_acf_desc:0 "Производила знаменитые танки M4 «Шерман», применявшиеся в Ост-Индии в конце 1940-х годов."
 INS_artilerie_inrichtingen:0 "Артиллерия Инрихтинген Бандоэнг"
 INS_artilerie_inrichtingen_desc:0 "Основан в Бандоэнге в 1923 году."
 INS_psm:0 "Пабрик Сенджата дан Месиоэ"
 INS_psm_desc:0 "Первый индонезийский завод по производству вооружения, приобретенный в 1949 году в результате национализации AI Bandoeng"
 INS_aniem:0 "Всеобщая Нидерландско-Индийская электрическая компания"
 INS_aniem_desc:0 "Основан в Соерабахе в 1909 году."
 INS_pln:0 "Государственная электроэнергетическая компания"
 INS_pln_desc:0 "Первая индонезийская электроэнергетическая компания, получившая активы после национализации АНИЭМ в 1945–1954 годах."
