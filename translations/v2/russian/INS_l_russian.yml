 INS_sumitomo:0 "Торговая компания «Сумитомо»"
 INS_kawasaki:0 "Тяжёлая промышленность «Кавасаки»"
 INS_bank_java:0 "Яванский банк"
 INS_bank_java_desc:0 "Основан в Батавии в 1828 году."
 INS_bank_indonesia:0 "Банк Индонезии"
 INS_bank_indonesia_desc:0 "Активы получены после национализации Яванского банка и ряда других банков Ост-Индии в 1953 году."
 INS_gouvernmentsmarine:0 "Правительственный флот"
 INS_pelni:0 "Национальное судоходство Индонезии"
