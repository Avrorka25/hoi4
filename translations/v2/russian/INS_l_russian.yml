 INS_volunteers_idea:0 "Интервенционизм"
 INS_volunteers_idea_desc:0 "КНИЛ имеет давнюю добровольческую традицию; вполне естественно перенести этот энтузиазм в XX век."
 INS_army_idea_two:0 "Реформы армии"
 INS_army_idea_two_desc:0 "До настоящей реформы ещё далеко, но это первый шаг."
 INS_army_idea_two_1:0 "Реформы армии"
 INS_army_idea_two_1_desc:0 "До настоящей реформы ещё далеко, но это первый шаг."
 INS_army_idea_two_2:0 "Реформы армии"
 INS_army_idea_two_2_desc:0 "До настоящей реформы ещё далеко, но это следующий шаг."
 INS_army_idea_two_3:0 "Реформы армии"
 INS_army_idea_two_3_desc:0 "До настоящей реформы ещё далеко, но это последний шаг."
 INS_army_idea_six:0 "Картика Эка Пакси"
 INS_army_idea_six_desc:0 "Наши реформы были долгими и болезненными, но завершились успехом! Наши сыновья понесут [INS.GetNameDef], подобно хищной птице, зорко следящей за каждым врагом."
 INS_ace_idea:0 "Крылья родины"
 INS_ace_idea_desc:0 "[INS.GetNameDef] будет господствовать в своём небе."
 INS_coastal_entrenchment_idea:0 "Береговые укрепления"
 INS_coastal_entrenchment_idea_desc:0 "Наши возможности береговой обороны недостаточны, но при грамотном распределении ресурсов мы сможем построить ограниченное число укреплений на важных военно-морских базах архипелага."
 INS_abda_idea:0 "АБДА"
 INS_abda_idea_desc:0 "Американо-британо-нидерландско-австралийское командование"
 INS_science_idea_1:0 "Реформы образования"
 INS_science_idea_1_desc:0 "Несмотря на улучшения, образование по-прежнему доступно почти исключительно элитам, что вредит стране."
 INS_science_idea_two:0 "Местные университеты"
 INS_science_idea_two_desc:0 "Наши учебные заведения — гордость Юго-Восточной Азии. Мы достойно обучаем будущих лидеров на уроках сегодняшнего дня."
 INS_economy_idea_two:0 "Королевское пакетное пароходство"
 INS_economy_idea_two_desc:0 "Богатства Индонезии снова здесь — на этот раз для народа."
 INS_political_idea_two:0 "Колониальная верность"
 INS_political_idea_two_desc:0 "Сейчас не время говорить о насильственной революции. Все усилия должны быть направлены на мирное отделение от метрополии."
 INS_political_idea_two_1:0 "Колониальная верность"
 INS_political_idea_two_1_desc:0 "Сейчас не время говорить о насильственной революции. Все усилия должны быть направлены на мирное отделение от метрополии."
 INS_political_idea_democratic:0 "Поддержка демократии"
 INS_political_idea_democratic_desc:0 "Демократия — это будущее. Будем стремиться к ней."
 INS_political_idea_fascism:0 "Поддержка фашизма"
 INS_political_idea_fascism_desc:0 "Для достижения независимости нужна сильная страна и сильный лидер, который поведёт её."
 INS_political_idea_fascism_1:0 "Поддержка фашизма"
 INS_political_idea_fascism_1_desc:0 "Для достижения независимости нужна сильная страна и сильный лидер, который поведёт её."
 INS_political_idea_communism:0 "Поддержка коммунизма"
 INS_political_idea_communism_desc:0 "Слишком долго богачи господствовали над простым народом. Больше этого не будет."
 INS_political_idea_democratic_1:0 "Демократический переход"
 INS_political_idea_democratic_1_desc:0 "Мы добились свободы! Теперь необходимо вернуть правительство к мирной жизни."
 INS_political_idea_democratic_2:0 "Направляемая демократия"
 INS_political_idea_democratic_2_desc:0 "Ни западные, ни восточные традиции нам не подходят — наше решение будет собственным."
 INS_political_idea:0 "Национальное пробуждение"
 INS_political_idea_desc:0 "Националистические настроения охватили все слои индонезийского общества, особенно низшие классы. Из-за тяжёлых условий жизни, созданных многолетними колониальными злоупотреблениями, народ Индонезии радикализуется с каждым днём. Однако политическая картина не сводится к чёрному и белому: многие партии и движения всё ещё готовы сотрудничать с [HOL.GetAdjective] администрацией ради продвижения и защиты индонезийских интересов."
 INS_kebangkitan_nasional:0 "Национальное пробуждение"
 INS_kebangkitan_nasional_desc:0 "Националистические настроения охватили все слои индонезийского общества, особенно низшие классы. Из-за тяжёлых условий жизни, созданных многолетними колониальными злоупотреблениями, народ Индонезии радикализуется с каждым днём. Однако политическая картина не сводится к чёрному и белому: многие партии и движения всё ещё готовы сотрудничать с [HOL.GetAdjective] администрацией ради продвижения и защиты индонезийских интересов."
 INS_kebangkitan_nasional_2_desc:0 "Националистические настроения охватили все слои индонезийского общества, особенно низшие классы. Из-за тяжёлых условий жизни, созданных многолетними колониальными злоупотреблениями, народ Индонезии радикализуется с каждым днём. Однако политическая картина не сводится к чёрному и белому: многие партии и движения всё ещё готовы сотрудничать с [HOL.GetAdjective] администрацией ради продвижения и защиты индонезийских интересов."
 INS_kebangkitan_nasional_3_desc:0 "Националистические настроения охватили все слои индонезийского общества, особенно низшие классы. Из-за тяжёлых условий жизни, созданных многолетними колониальными злоупотреблениями, народ Индонезии радикализуется с каждым днём. Однако политическая картина не сводится к чёрному и белому: многие партии и движения всё ещё готовы сотрудничать с [HOL.GetAdjective] администрацией ради продвижения и защиты индонезийских интересов."
 INS_political_idea_4:0 "Единство в многообразии"
 INS_political_idea_4_desc:0 "Мы едины как народ благодаря миру, а не насилию."
 INS_political_idea_5:0 "Экономика мирного времени"
 INS_political_idea_5_desc:0 "Мы долго шли к свободе, и теперь пора насладиться плодами тяжёлого труда. Народ [INS.GetNameDef] больше не будет знать беспорядков и войны — только мир и процветание."
 INS_political_idea_five:0 "Независимость"
 INS_political_idea_five_desc:0 "Мы так долго ждали свободы, что трудно поверить: этот день наконец настал. Пусть [INS.GetAdjective] народ навсегда запомнит день нашей независимости!"
 INS_political_idea_five_1:0 "Независимость"
 INS_political_idea_five_1_desc:0 "Мы так долго ждали свободы, что трудно поверить: этот день наконец настал. Пусть [INS.GetAdjective] народ навсегда запомнит день нашей независимости!"
 INS_army_idea:0 "Разобщённая армия"
 INS_army_idea_desc:0 "Хотя наша армия пригодна для поддержания порядка, зависимость от [HOL.GetAdjective] поддержки и нехватка местных офицеров сделали её слабой и неэффективной. Необходимы серьёзные реформы."
 INS_economy_idea:0 "[Root.getinseconname]"
 INS_economy_idea_desc:0 "[Root.getinsecondesc]"
 INS_colonial_economy:0 "Малайз"
 INS_colonial_economy_desc:0 "Хотя наша страна богата, слишком большая часть продукции отправляется за море, из-за чего местная экономика страдает, пока мы пытаемся справиться с собственным экономическим кризисом."
 INS_postcolonial_economy:0 "Постколониальная экономика"
 INS_postcolonial_economy_desc:0 "Экономические разрушения, вызванные Малайзом и недавней революцией, оставили глубокий след. Мы должны исправить положение, прежде чем несостоятельность экономики превратится в политическую проблему."
 INS_science_idea:0 "Реформы образования"
 INS_science_idea_desc:0 "Несмотря на улучшения, образование по-прежнему доступно почти исключительно элитам, что вредит стране."
 indonesia.1.t:0 "Предложение из Ост-Индии"
 indonesia.1.desc:0 "Хотя главный город Сингапур хорошо защищён, ни для кого не секрет, что для обороны наших восточноазиатских колоний требуется более значительное военно-морское присутствие. Коммюнике колониального правительства Ост-Индии предлагает любопытную сделку: авиационное снабжение в обмен на военный доступ. Стоит ли соглашаться?"
 indonesia.1.a:0 "Великолепно!"
 indonesia.1.b:0 "Нынешняя оборона нас вполне устраивает, благодарим."
 indonesia.4.t:0 "Военно-морская автономия Ост-Индии?"
 indonesia.4.desc:0 "Хотя наши позиции в Ост-Индии защищены, верфи находятся далеко от Явы. Колониальное правительство запросило военно-морскую автономию и передачу под его командование эскадры наших кораблей. Следует ли удовлетворить просьбу?"
 indonesia.4.a:0 "Хорошо."
 indonesia.4.b:0 "Мы не можем позволить себе потерять ни одного корабля."
 indonesia.5.t:0 "[HOL.GetNameDefCap] соглашается!"
 indonesia.5.desc:0 "То ли из безразличия, то ли из искренней веры в наши усилия, [HOL.GetAdjective] правительство предоставило нам ограниченную военно-морскую автономию в регионе."
 indonesia.5.a:0 "Мы воспользуемся этой возможностью!"
 indonesia.6.t:0 "[HOL.GetNameDefCap] отказывает"
 indonesia.6.desc:0 "Предпочитая прямой контроль над регионом, Гаага отклонила наш запрос на военно-морскую автономию."
 indonesia.6.a:0 "Мы продолжим без них."
 indonesia.7.t:0 "Военно-морские учения в Юго-Восточной Азии"
 indonesia.7.desc:0 "В нынешней напряжённой обстановке в Азии неудивительно, что страны стремятся демонстрировать силу. [ROOT.GetNameDefCap] не исключение и начала показывать недавно приобретённую морскую мощь в регионе."
 indonesia.7.a:0 "Тревожно."
 indonesia.7.b:0 "Мы показали миру свою силу."
 indonesia.7.c:0 "Как быстро они растут."
 indonesia.7.d:0 "Появился новый соперник?"
 indonesia.8.t:0 "Петиция Сотарджо"
 indonesia.8.desc:0 "В то время как в наших колониях царят националистические симпатии, наше колониальное правительство сумело успокоить коренное население и сохранить его относительное содержание. Тем не менее, среди националистов и сторонников независимости по-прежнему много экстремистов и радикалов, которые призывали к усилению автономии Ост-Индии, если не к полной свободе. Таким образом, петиция Сотарджо была подана несколько дней назад в Фольксраде и попала сюда."
 indonesia.8.a:0 "Небольшая цена за стабильность."
 indonesia.8.b:0 "Нас устраивает нынешнее положение."
 indonesia.9.t:0 "[FROM.GetNameDefCap] принимает"
 indonesia.9.desc:0 "После, скорее всего, ожесточенных и пламенных дебатов по петиции Сотарджо было решено, что [ROOT.GetNameDefCap] (b) обеспечивает более высокую или даже полную автономию в пределах Содружества Нидерландов. Это оказалось большим успехом, и, конечно же, есть кто-то, кого можно поблагодарить за это, — Сотарджо Картохадикусумо, лидер Ассоциации коренных гражданских служащих и все его сторонники."
 indonesia.9.a:0 "Ещё один шаг к свободе!"
 indonesia.10.t:0 "Свобода для Ост-Индии?"
 indonesia.10.desc:0 "Националистические настроения в колониях достигли точки кипения. Демократические агитаторы в Ост-Индии требуют свободных выборов и освобождения от колониального контроля, но готовы к будущему союзу. Как нам реагировать?"
 indonesia.10.a:0 "Лучше они, чем коммунисты."
 indonesia.10.b:0 "Неблагодарные колониалы!"
 indonesia.33.t:0 "[INS.GetNameDefCap] предъявляет права на Новую Гвинею!"
 indonesia.33.desc:0 "Наша общая граница с Ост-Индией на острове Новая Гвинея всегда была напряжённой, но сдержанной. Теперь напряжение переросло в кризис: новое [INS.GetAdjective] правительство требует полного контроля и суверенитета над островом. Что нам делать?"
 indonesia.33.a:0 "Уступить их требованиям."
 indonesia.33.b:0 "Независимость вскружила им голову; проигнорировать."
 indonesia.34.t:0 "[AST.GetNameDefCap] уступает!"
 indonesia.34.desc:0 "Наши угрозы сработали: [Ast.GetNameDef] отказалась от всех притязаний на Новую Гвинею, и контроль немедленно передаётся нам."
 indonesia.34.a:0 "Победа дипломатии!"
 indonesia.35.t:0 "[AST.GetNameDefCap] отказывает!"
 indonesia.35.desc:0 "Несмотря на все усилия, дипломатия провалилась: [Ast.GetNameDef] проигнорировала требования и продолжает вести себя так, словно ничего не изменилось."
 indonesia.35.a:0 "Хорошо."
 indonesia.35.b:0 "Они заплатят за эту дерзость."
 indonesia.36.t:0 "[INS.GetNameDefCap] предъявляет права на Тимор!"
 indonesia.36.desc:0 "Наша общая граница с Ост-Индией на острове Тимор всегда была напряжённой, но сдержанной. Теперь напряжение достигло предела: новое [INS.GetAdjective] правительство требует полного контроля и суверенитета над островом. Что нам делать?"
 indonesia.36.a:0 "Уступить их требованиям."
 indonesia.36.b:0 "Независимость вскружила им голову; проигнорировать."
 indonesia.37.t:0 "[721.Owner.GetNameDefCap] уступает Тимор!"
 indonesia.37.desc:0 "[721.Owner.GetAdjective] правительство, не способное перебросить силы, решило принять наши требования вместо риска войны."
 indonesia.37.a:0 "Победа дипломатии!"
 indonesia.38.t:0 "[POR.GetNameDefCap] отказывает!"
 indonesia.38.desc:0 "Несмотря на все усилия, дипломатия провалилась: [POR.GetNameDef] проигнорировала требования и продолжает вести себя так, словно ничего не изменилось."
 indonesia.38.a:0 "Хорошо."
 indonesia.38.b:0 "Они заплатят за эту дерзость."
 indonesia.40.t:0 "[FROM.GetNameDefCap] просит свободы для колоний"
 indonesia.40.desc:0 "Со времён Великой войны мир сильно изменился, и эпоха колониальных империй всё больше выглядит пережитком прошлого. Недавно ставшая независимой [FROM.GetName] — яркий пример борьбы коренных народов под колониальным гнётом за свободу и независимость. Дипломаты [FROM.GetAdjective] правительства и администрации обратились к нам с просьбой предоставить независимость нашим владениям в Юго-Восточной Азии в обмен на гарантии [INS.GetAdjective] защиты. Что нам ответить?"
 indonesia.40.a:0 "Возможно, это отвечает интересам всех..."
 indonesia.40.c:0 "Наши колонии имеют огромное стратегическое и экономическое значение. Мы не согласимся."
 indonesia.41.t:0 "[FROM.GetNameDefCap] соглашается с нашей петицией!"
 indonesia.41.desc:0 "[FROM.GetAdjective] правительство согласилось вывести военные силы и дипломатов из своих колониальных владений в Юго-Восточной Азии. Вероятно, под давлением [ROOT.GetAdjective] стороны оно решило, что это действительно отвечает интересам всех, поскольку не желает видеть [ROOT.GetNameDef] своим врагом в регионе. Как бы то ни было, это ещё один шаг к свободе народов Азии!"
 indonesia.41.a:0 "Победа дипломатии!"
 indonesia.42.t:0 "Независимость [ROOT.GetAdjective] народа достигнута!"
 indonesia.42.desc:0 "Наши братья в [FROM.GetNameDef] не забыли о нас после обретения независимости. Они подали [OVERLORD.GetNameDef] прошение о полной независимости [ROOT.GetNameDef] и последующем выводе [OVERLORD.GetAdjective] войск из Юго-Восточной Азии. Конец колониализма близок, и наша независимость — ещё один шаг к нему!"
 indonesia.42.a:0 "Слава освобождению [ROOT.GetAdjective] народов!"
 indonesia.42.b:0 "Наше будущее связано с [OVERLORD.GetNameDef]..."
 indonesia.45.t:0 "[FROM.GetNameDefCap] отказывает!"
 indonesia.45.desc:0 "Несмотря на добрые намерения, наша петиция осталась без ответа. [FROM.GetNameDefCap] не собирается отказываться от контроля над колониальными владениями в Юго-Восточной Азии. Увы, колониализм и империализм проживут ещё один день!"
 indonesia.45.a:0 "Мы ничего не можем сделать..."
 indonesia.45.b:0 "Колониализм должен встретить свою судьбу — так или иначе!"
 indonesia.46.t:0 "Прохождение Доктора. Соэтомо"
 indonesia.46.d_1:0 "Из Соэрабаджи поступили сообщения о недавней смерти доктора Соетомо, лидера Париндры, прошлой ночью из-за рака печени.\n\nОснователь Boedi Oetomo, первого политического движения Boemipoetra в Индии. Соетомо последовательно доказал, что, превознося свою добродетель, независимость может быть принесена ненасильственными средствами по сравнению с более радикальными движениями, такими как Сарекат Ислам и Партай Насиональ Индонезии. Похоронная процессия должна была состояться в Соэрабадже со своими последователями в Париндре, такими как его преемник Верджанинграт и лидер националистической фракции в Фольксраде Мохаммад Хоэсни Тамрин."
 indonesia.46.d_2:0 "Из Соерабаджи поступили сообщения о недавней смерти президента Соэтомо, лидера нашей страны и нашей партии Париндра, прошлой ночью из-за рака печени.\n\nОснователь Boedi Oetomo, первого политического движения Boemipoetra в Индии. Соэтомо последовательно доказывал, что, хотя независимость может быть достигнута ненасильственными средствами, в конечном счете индонезийцы должны превозносить свои добродетели и заявлять о себе как о законных владельцах индонезионской родины.\n\nВ то время как Верьянинграт сменил его на посту лидера партии, проводится специальная конвенция для избрания следующего президента. [INS.GetNameDef]. По аккламации:"
 indonesia.46.a:0 "Ушла сила добра."
 indonesia.46.b:0 "Мохаммад Хоэсни Тамрин возглавит нашу страну!"
 indonesia.46.c:0 "Вёрджанинграт должен гарантировать, что переход будет происходить так, как задумано."
 indonesia.47.t:0 "Смена караула"
 indonesia.47.d:0 "После недавнего повышения контр-адмиралов Ферверды и Фюрстнера в Королевском флоте вице-адмирал Мартен ван Дюлм официально выходит в отставку в возрасте 57 лет, прослужив во флоте Ост-Индии с 1934 года."
 indonesia.47.a:0 "Королевству всё ещё нужна его служба."
 indonesia.47.b:0 "Благодарим за службу."
 indonesia.48.t:0 "Выбор королевского кандидата"
 indonesia.48.d:0 "Руководство Париндры собралось сегодня, чтобы избрать нашего будущего монарха для индонезийского султаната. В то время как решение, немедленно согласованное, состоит в том, чтобы выбрать Дом Матарама как нашу династию, положение самого монарха имеет два конкурирующих требования между старой ветвью во главе с Домом Pakoe Boewono и более молодой ветвь во главе с домом Hamengkoe Boowono. Какой из них будет избран монархом?"
 indonesia.48.a:0 "Старшая ветвь, Дом Пакоэ Боевоно"
 indonesia.48.b:0 "Младшая ветвь, Дом Хаменгкое Боэвоно"
 indonesia.49.t:0 "Оригинальное название: Pakoe Boewono X"
 indonesia.49.d_1:0 "Шри Соэсоэхонан Пакоэ Боевоно Десятый, Монарх Соеракарты, скончался после долгой битвы болезни из-за своей старости. В похоронной процессии приняли участие ряд яванских, индонезийских и даже голландских сановников, так как он широко уважаем за его принятие к процессу модернизации в Ост-Индии. Ожидается, что Раден Мас Онтосено, Пангеран Хангабехи, унаследует трон своего отца как Шри Соэсоэхонан Пакоэ Боевоно XI."
 indonesia.49.d_2:0 "Шри Соэсоэхонан Пакоэ Боевоно Десятый, наш нынешний монарх, скончался после долгой битвы болезни из-за своей старости. В похоронной процессии приняли участие многочисленные индонезийские официальные лица, в том числе сам первый министр Вержанинграт. Ожидается, что Раден Мас Онтосено, Пангеран Хангабехи, унаследует трон своего отца как Шри Соэсоэхонан Пакоэ Боевоно XI."
 indonesia.49.a:0 "Приносим соболезнования."
 indonesia.49.b:0 "Страна скорбит."
 indonesia.50.t:0 "Прохождение Hamengkoeboewono VIII"
 indonesia.50.d_1:0 "Шри Султан Хаменгкоэбоэвоно Восьмой, монарх Джогджакарты, скончался из-за внезапного сердечного приступа во время поезда домой. В похоронной процессии приняли участие ряд яванских, индонезийских и даже голландских сановников, в том числе Х. Джей. Ван Мук, который является личным помощником покойного султана в его дни в качестве сельскохозяйственного офицера в Джогджакарте. Ожидается, что Гести Раден Мас Дороджатоен унаследует трон своего отца как Шри Султан Хаменгкоэбоэвоно IX."
 indonesia.50.d_2:0 "Шри Султан Хаменгкоэбоэвоно Восьмой, монарх Джогджакарты, скончался из-за внезапного сердечного приступа во время поезда домой. В похоронной процессии приняли участие многочисленные индонезийские официальные лица, в том числе [INS.GetLeader] себя. Ожидается, что Гести Раден Мас Дороджатоен унаследует трон своего отца как Шри Султан Хаменгкоэбоэвоно IX."
 indonesia.50.d_3:0 "Шри Султан Хаменгкоэбоэвоно Восьмой, наш нынешний монарх, скончался из-за внезапного сердечного приступа во время поезда домой. В похоронной процессии приняли участие многочисленные индонезийские официальные лица, в том числе сам первый министр Вержанинграт. Ожидается, что Гести Раден Мас Дороджатоен унаследует трон своего отца как Шри Султан Хаменгкоэбоэвоно IX."
 indonesia.50.a:0 "Прощай, старый друг."
 indonesia.50.b:0 "Приносим соболезнования."
 indonesia.50.c:0 "Страна скорбит."
 indonesia.51.t:0 "Падение Ост-Индии"
 indonesia.51.d:0 "Нашему самому ценному острову всё сильнее угрожает враг, и вероятность скорого вторжения на Яву растёт. Из-за столь уязвимого положения некоторым ключевым чиновникам приказано эвакуироваться в более безопасное место и продолжить борьбу издалека. Что делать остальным, кто останется здесь?"
 indonesia.51.a:0 "Мы должны продолжить борьбу за границей!"
 indonesia.51.b:0 "Сражаться до самого конца!"
 indonesia.52.t:0 "Завоевание Южной ресурсной зоны"
 indonesia.52.d:0 "С падением Явы все усилия [INS.GetFactionName] в этом регионе полностью разгромлены, а Индийский океан открыт для нашего дальнейшего наступления. Несколько представителей индонезийских националистических групп явились к передовым силам вторжения и явно ищут сотрудничества в обмен на возможность свободно экспортировать их богатства для снабжения наших военных усилий — именно этого мы и добивались с самого начала."
 indonesia.52.a:0 "Необходимо сохранить прямой контроль."
 indonesia.53.t:0 "Смерть Фредерика де Хога"
 indonesia.53.d:0 "Ранее этим утром из Отечества пришла шокирующая новость. Фредерик Германус де Хуг, лидер индоевропейского вербонда, скончался из-за инсульта мозга во время своего отпуска там с целью выздоровления от сердечной недостаточности в начале этого года.\n\nФредерик де Хуг был выдающимся членом общества Ост-Индии, и многие его вклады помогли его коллеге Индосу в Малазии. Выпускники Лейденского университета, он был членом IEV с 1920 года, назначен главным офицером в Staatspoor en Tramwegen в 1922 году и, наконец, членом Volksraad в 1923 году, представляющим IEV. Во время своего пребывания в IEV и Volksraad, Де Хуг выступает за политическую и экономическую эмансипацию, как для обеспечения равных возможностей для всех слоев общества в Ост-Индии, так и для предотвращения более экстремальных идей.\n\nОн должен был быть похоронен в Бандоэнге, где присутствовали как члены IEV, так и члены Volksraad, а также чиновники из правительства Батавии."
 indonesia.53.a:0 "Покойся с миром, Фредерик."
 indonesia.54.t:0 "Революция расцветает!"
 indonesia.54.d:0 "Всего через несколько часов после провозглашения независимости остатки нидерландской власти захватили ключевые государственные учреждения в Батавии, Северной Суматре и Великом Востоке. Очевидно, они не остановятся, пока полностью не подавят наше сопротивление."
 indonesia.54.a:0 "Свобода или смерть!!!"
 INS_NATREV_aggressor_tt:0 "§RМы будем сражаться с иностранными угнетателями до последней капли крови!§!\n"
 indonesia.55.t:0 "Индонезийское восстание"
 indonesia.55.desc:0 "Попытки связаться с Батавией в течение последних шести часов после полуночи встретили жуткое молчание, но только в этот час пришло безумное сообщение из Соерабахи через Сингапур. После закрытия Volksraad, эскалация напряженности между боевиками Bumiputra и колониальным правительством, поддержанным сторонниками NSB, привела к революции во главе с остатками индонезийской коммунистической партии."
 indonesia.55.a:0 "Сейчас мы слишком заняты."
 indonesia.55.b:0 "Вернуть жемчужину нашей империи!"
 indonesia.55.c:0 "Мы должны взять ситуацию под прямой контроль!"
 indonesia.55.d:0 "Немедленно обезопасить Новую Гвинею!"
 indonesia.56.t:0 "[FROM.GetNameDefCap] отказывает"
 indonesia.56.desc:0 "После, скорее всего, ожесточенных и пламенных дебатов по петиции Сотарджо было решено, что [ROOT.GetNameDefCap] сохранит свое нынешнее административное и колониальное положение в составе Содружества Нидерландов. Похоже, что [FROM.GetNameDef] стремится сохранить статус-кво внутри [ROOT.GetNameDefCap] и, возможно, других колоний, опасаясь, что принятие может быть проявлением слабости."
 indonesia.56.a:0 "По крайней мере, они дали ответ."
 indonesia.56.b:0 "Хватит! Свободу нужно завоевать любыми средствами!"
 indonesia.100.t:0 "Устранение колониального влияния"
 indonesia.100.desc:0 "Теперь, когда мы независимы, хорошим первым шагом в демонстрации нашей автономии было бы изменение названий некоторых наших городов.[HOL.GetADjective] В нашей новой стране нет места влиянию."
 indonesia.100.a:0 "Так и будет!"
 indonesia.100.b:0 "Мне нравится Холландия."
 indonesia.105.t:0 "Новый губернатор"
 indonesia.105.desc:0 "Уход Корнелиса де Йонге с поста генерал-губернатора Ост-Индии знаменует конец эпохи. Сильный и упрямый человек, де Йонге решительно выступал против местной автономии и проводил подчёркнуто пронидерландскую политику, отвергая большинство попыток расширить самостоятельность колонии. Его преемник Старкенборг ещё не определил курс администрации, но многие надеются, что свежий ветер придаст силы движению за независимость."
 indonesia.105.a:0 "Пусть он правит достойно."
 indonesia.107.t:0 "Первая сила"
 indonesia.107.desc:0 "Исследовательский комитет по подготовке независимости разработал проект руководящих принципов молодой страны, известных как Панчасила, или Пять принципов. Однако возникли разногласия о том, какой принцип должен стать первым. От этого зависит место ислама в правительстве. Одни требуют введения шариата для мусульман, другие хотят пойти дальше и подчинить каждого гражданина нормам его собственной религии. Меньшинство комитета выступает за светскую Индонезию, а ещё одна группа — за монархическую. После тщательного обсуждения комитет решил, что первым принципом станет..."
 indonesia.107.a:0 "...следовать шариату и идти с Аллахом."
 indonesia.107.c:0 "...почитать Бога, султана и страну."
 indonesia.107.d:0 "...предложение сторонников светского строя."
 INS_reforming_the_army:0 "Реорганизация армии"
 INS_reforming_the_army_desc:0 "Наши реформы были долгими и болезненными, но скоро увенчаются успехом! Наши сыновья понесут [INS.GetNameDef], подобно хищной птице, зорко следящей за каждым врагом."
 INS_naval_autonomy_ships:0 "§Y[HOL.GetName]§! передаст [INS.GetNameDef] несколько эсминцев и лёгких крейсеров."
 INS_naval_autonomy_ships_desc:0 "Настало время получить большую военно-морскую автономию от Гааги, запросив передачу флота Ост-Индии. Это несомненно усилит наши морские возможности и станет первой линией обороны в случае внезапного нападения иностранного врага."
 INS_increase_convoy_production:0 "Увеличить производство конвоев"
 INS_increase_convoy_production_desc:0 "Наши острова многочисленны, а торговля простирается до Европы и даже Америки. Нужно значительно расширить возможности строительства торговых судов для будущего экспорта и импорта ценных товаров."
 INS_concessions_to_the_nationalists:0 "Уступки национальным элитам"
 INS_concessions_to_the_nationalists_desc:0 "Предоставив ограниченные уступки различным региональным лидерам Индий, мы одновременно обеспечим их верность Королевству и ослабим оставшиеся радикальные националистические настроения — как ост-индские, так и индонезийские."
 INS_promote_national_independence:0 "Продвигать национальную независимость"
 INS_promote_national_independence_desc:0 "Индии стали собственной нацией: люди всё больше воспринимают общую родину, а не религию или расу, как объединяющую силу. Мы должны и дальше укреплять это чувство, чтобы в трудный час Королевства стоять рядом с Нидерландами на равных!"
 INS_demand_volksraad_elections:0 "Потребовать выборы в Фольксраад"
 INS_demand_volksraad_elections_desc:0 "Лидер, действительно представляющий волю избирателей, — привилегия демократической страны, а наша, несомненно, такова! Настало время провести первые выборы в [INS.GetNameDef] и избрать премьер-министра, который будет представлять нашу нацию."
 INS_nationalize_the_factories:0 "Национализировать заводы"
 INS_nationalize_the_factories_desc:0 "Хотя на архипелаге существует множество заводов и верфей, большинство принадлежит частному сектору, приглашённому колониальным правительством для индустриализации земель. Мы должны заставить их служить интересам народа — так или иначе."
 INS_issue_emergency_powers:0 "Ввести чрезвычайные полномочия"
 INS_issue_emergency_powers_desc:0 "Нынешняя чрезвычайная ситуация требует чрезвычайных мер. Многие считают Хубертуса Йоханнеса ван Моока выдающимся человеком, особенно после его недавних переговоров с японскими экономическими делегациями. Настало время поручить ему защиту архипелага!"
 INS_implement_the_sharia:0 "Ввести шариат"
 INS_implement_the_sharia_desc:0 "Наша страна, без сомнения, религиозна: четыре пятых населения покорны Аллаху. Мы должны сохранить свободу вероисповедания, обязав при этом мусульман соблюдать нормы шариата."
 INS_equal_under_god:0 "Равные перед Богом"
 INS_equal_under_god_desc:0 "Как сказано в Писании, все люди созданы равными, хотя и не одинаковыми. Так и индонезийская нация, несмотря на религиозные различия, верит в единое высшее существо. Довольно эксплуатации человека человеком!"
 INS_death_to_colonialism:0 "Смерть колониализму!"
 INS_death_to_colonialism_desc:0 "Мы благодарны за свободу, но многие народы нашего региона всё ещё остаются в подчинении. Пусть наша свобода станет первым предсмертным хрипом колониализма!"
 INS_unite_the_ummah:0 "Объединить умму"
 INS_unite_the_ummah_desc:0 ""
 INS_liberate_the_northern_muslims:0 "Освободить мусульман севера"
 INS_liberate_the_northern_muslims_desc:0 "Наш старейший сосед долго находился под британским гнётом. Настало время сбросить ярмо с его земель и наконец объединиться с братьями!"
 INS_consolidate_the_right:0 "Консолидация правых"
 INS_consolidate_the_right_desc:0 "Индонезийские националисты долго оставались разобщёнными, несмотря на общую борьбу против нидерландцев. Объединим их, чтобы набраться сил и разбить оковы!"
 INS_favour_the_radicals:0 "Поддержать радикалов"
 INS_favour_the_radicals_desc:0 "Со времен Боэди Оэтомо наше национальное движение стремится сотрудничать с колониальным правительством для достижения свободы нашей нации. Больше нет. Мы не можем ждать, пока все мы будем депортированы в Дигоэль один за другим, и с продолжающимся кризисом мы должны нанести удар сейчас!"
 INS_reinvigorate_the_pfi:0 "Возродить ПФИ"
 INS_reinvigorate_the_pfi_desc:0 "В середине 1933 года Раден Нотоиндиото и его товарищи-ультрамонархисты основали Индонезийскую фашистскую партию, чтобы восстановить славу Маджапахита. Хотя старое руководство партии кануло в безвестность, мы сохраним её идею. За Великую Индонезию!"
 INS_choosing_royal_after_coup_tt:0 "После успешного переворота начнётся §Gпереходный период§! преобразования Индонезии в §Yмонархию§!."
 INS_utilize_the_youth:0 "Использовать молодёжь"
 INS_utilize_the_youth_desc:0 ""
 INS_reorganize_the_underground:0 "Реорганизовать КПИ"
 INS_reorganize_the_underground_desc:0 "Преобладающий политический и экономический кризис, вызванный капиталистической и империалистической некомпетентностью, привел к возрождению левых идей во всем рабочем классе. Возможно, мы были недостаточно сильны в 1926 году, но теперь с этим вторым шансом, возможно, мы наконец-то сможем вырваться на свободу!"
 INS_the_new_party_leadership:0 "Сменить руководство партии"
 INS_the_new_party_leadership_desc:0 "Вместо несостоявшихся сталинистов мы передадим революционное знамя все еще популярной индонезийской национальной партии. Имя Сёкарно и Хатта стало еще более популярным, поскольку они томятся в Восточной Индонезии. Пусть сбудутся все голландские кошмары."
 INS_launch_the_revolution:0 "Начать революцию"
 INS_launch_the_revolution_desc:0 "Пришло время восстать. Мы должны разорвать цепи, которыми нас сковали империалисты, и сражаться до последнего мужчины и женщины!\n«Пробудитесь, души и сердца, ради свободной Индонезии!»"
 INS_the_coup:0 "Переворот [GetMonth]"
 INS_the_coup_desc:0 "Настало время нанести последний удар по колониальной системе, слишком долго державшей нас в оковах. Душа и тело Индонезии, восстаньте ради Великой Индонезии!"
 INS_reinforce_the_national_identity:0 "Укрепить национальную идентичность"
 INS_reinforce_the_national_identity_desc:0 "Наш индонезийский национализм не строится вокруг одной этнической или религиозной общности, а рождается из любви к народу независимо от происхождения. Нужно научить этому всех индонезийцев, чтобы общая идентичность стала связующей силой."
 INS_implement_a_democratic_system:0 "Создать демократическую систему"
 INS_implement_a_democratic_system_desc:0 "Наша власть вырастает из образа жизни простых людей и в конечном счёте существует ради служения им. Все разногласия следует обсуждать, пока не будет найдено взаимоприемлемое решение."
 INS_establish_true_equality:0 "Установить подлинное равенство"
 INS_establish_true_equality_desc:0 "При нидерландском правлении существовали имущественное, сословное и этническое неравенство — всё это недостойно нашей революционной страны. Покончим с ним."
 INS_join_the_comintern:0 "Вступить в Коминтерн"
 INS_join_the_comintern_desc:0 "[SOV.GetName] помогла нам добиться независимости от нидерландского господства. Мы должны отблагодарить её, присоединившись к [SOV.GetFactionName], и вместе распространять пролетарскую революцию!"
 INS_popular_front:0 "Народный фронт"
 INS_popular_front_desc:0 "Наше национальное движение состоит из множества организаций, но все они стремятся к одной цели — независимости и суверенному самоуправлению!"
 INS_emergency_powers:0 "Чрезвычайные полномочия"
 INS_emergency_powers_desc:0 "Наше правительство ведёт войну, и мы обеспечим победу любыми необходимыми средствами."
 INS_equal_under_god_idea:0 "Равные перед Богом"
 INS_equal_under_god_idea_desc:0 "Как сказано в Писании, все люди созданы равными, хотя и не одинаковыми. Так и индонезийская нация, несмотря на религиозные различия, верит в единое высшее существо. Довольно эксплуатации человека человеком!"
 INS_unified_right:0 "Объединённые правые"
 INS_unified_right_desc:0 "Прежде разобщённые националистические движения теперь объединены под знаменем Партии Великой Индонезии. Вместе мы сильны, порознь — слабы!"
 INS_indonesian_national_identity:0 "Индонезийская национальная идентичность"
 INS_jewel_of_the_pacific_idea:0 "Жемчужина Тихого океана"
 INS_jewel_of_the_pacific_idea_desc:0 "Если [RAJ.GetNameDef] — жемчужина Британской империи, то Ост-Индия — наша жемчужина. Её богатства и ресурсы являются последним значительным наследием нидерландской морской империи, и мы должны сделать всё для её защиты."
 INS_sharia_idea:0 "Шариат"
 INS_sharia_idea_desc:0 "Наша страна, без сомнения, религиозна: четыре пятых населения покорны Аллаху. Мы должны сохранить свободу вероисповедания, обязав при этом мусульман соблюдать нормы шариата."
