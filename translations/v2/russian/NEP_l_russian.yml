 nepal.1.t:0 "[ENG.GetNameDefCap] вступила в войну"
 nepal.1.d:0 "Несколько дней назад в Европе, а возможно и во всём мире, вспыхнула новая война — продолжение того, что называли «Великой войной». У [ROOT.GetNameDefCap] есть причины поддержать [ENG.GetNameDef], и в некотором смысле мы обязаны сделать это по Непало-британскому договору 1923 года, согласно которому наши две страны признают суверенитет друг друга и обязуются его защищать."
 nepal.1.a:0 "Мы должны помочь союзникам. Немедленно объявить войну!"
 nepal.1.b:0 "Национальные интересы Непала прежде всего..."
