 BEL_recall_jules_pire_desc:0 "Жюль Пир, ранее командовавший Арденнскими егерями, несколько лет назад вышел в отставку. Однако по мере роста военных потребностей может оказаться разумным вернуть его на действительную службу и воспользоваться накопленным командным опытом."
 POLITICS_HUBERT_PIERLOT_DESC:0 "Занимая в последние годы пост премьер-министра Бельгии, этот человек продемонстрировал способность вести переговоры с великими державами Европы."
