 BEL_benelux_economic_cooperation:0 "Таможенный союз Бенилюкса"
 BEL_benelux_economic_cooperation_desc:0 "Хотя сегодня мы разделены на три страны, мы образуем особый регион между государствами [FRA.GetNameDef] и [GER.GetNameDef]. Не являясь ни [FRA.GetAdjective], ни [GER.GetAdjective] державой, мы можем создать таможенный союз, чтобы расширить торговлю и легче конкурировать с могущественными соседями."
