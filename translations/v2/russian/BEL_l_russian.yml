 BEL_jules_bastin:0 "Жюль Бастен"
 BEL_declaration_of_neutrality:0 "Декларация о нейтралитете"
 BEL_declaration_of_neutrality_desc:0 "На протяжении десятилетий Бельгия находится под защитой Франции. Это восходит к бельгийской революции, когда французский экспедиционный корпус помог отразить голландскую контратаку 1831 года и обеспечить независимость южных Нидерландов.\n\nПосле окончания Великой войны, [FRA.getAdjective] Генеральный штаб установил тесные связи с [BEL.GetAdjective] Координировать наши действия в случае конфликта.[FRA.getNameDefCap] Мы защищаем и гарантируем нашу независимость. Пока что.\n\nС другой стороны, постоянное военное сотрудничество с [FRA.GetAdjective] Правительство рискует [BEL.GetAdjective] Безопасность. Это может привести страну к новому конфликту. Чтобы избежать катастрофы, похожей на опустошение [GER.GetAdjective] Наступление 1914 года, от которого мы должны отказаться. [FRA.GetAdjective] Мы гарантируем и сообщаем о своем решении Лиге Наций."
 BEL_declaration_of_neutrality_dummy:0 "Декларация о нейтралитете"
 BEL_declaration_of_neutrality_dummy_desc:0 "На протяжении десятилетий Бельгия находится под защитой Франции. Это восходит к бельгийской революции, когда французский экспедиционный корпус помог отразить голландскую контратаку 1831 года и обеспечить независимость южных Нидерландов.\n\nПосле окончания Великой войны, [FRA.getAdjective] Генеральный штаб установил тесные связи с [BEL.GetAdjective] Координировать наши действия в случае конфликта.[FRA.getNameDefCap] Мы защищаем и гарантируем нашу независимость. Пока что.\n\nС другой стороны, постоянное военное сотрудничество с [FRA.GetAdjective] Правительство рискует [BEL.GetAdjective] Безопасность. Это может привести страну к новому конфликту. Чтобы избежать катастрофы, похожей на опустошение [GER.GetAdjective] Наступление 1914 года, от которого мы должны отказаться. [FRA.GetAdjective] Мы гарантируем и сообщаем о своем решении Лиге Наций."
 BEL_declared_neutrality:0 "Объявлен полный нейтралитет."
 BEL_leopold3:0 "Леопольд III"
 BEL_leopold3_desc:0 "Леопольд III, король бельгийцев, царствует, но не правит. Хотя он является верховным главнокомандующим бельгийской армии, фактическое командование осуществляет начальник генерального штаба."
 BEL_leopold3_captive:0 "Леопольд III в плену"
 BEL_leopold3_captive_desc:0 "Леопольд III находится в плену; чтобы освободить его, нам придётся глубоко продвинуться на вражескую территорию."
 BEL_leopold3_exile:0 "Леопольд III в изгнании"
 BEL_charles_regent:0 "Принц-регент Карл"
 BEL_charles_regent_desc:0 "Пока король не может править, его брат, принц Карл, займёт его место в качестве регента королевства."
 BEL_Pierre_Daye:0 "Пьер Дайе"
 BEL_Pierre_Daye_desc:0 "Пьер Дайе возглавлял рексистскую фракцию в бельгийском парламенте. Кроме того, он был единственным рексистом, которого королевский двор считал приемлемым, тогда как Дегреля воспринимали как смутьяна. Поскольку он был невысокого мнения о других представителях рексистов, ещё до войны он покинул движение."
 BEL_Charles_Someville:0 "Шарль Сомвиль"
 BEL_edgar_lalmand:0 "Эдгар Лальман"
 BEL_edgar_lalmand_desc:0 "Хотя Эдгар Лальман не входил в правящую тройку Ван ден Боома, Лао и Релекома, он часто действовал за кулисами. Будучи торговцем зерном, он обладал деловыми навыками, которые могли пригодиться при управлении общественными работами."
 BEL_henri_glineur:0 "Анри Глинёр"
 BEL_robert_desmet:0 "Робер Десмет"
 BEL_robert_desmet_desc:0 "Робер Десмет был лётчиком во время Великой войны. В 1930-е годы он служил инструктором будущих бельгийских военных пилотов."
 BEL_raoul_overstraeten_desc:0 "Рауль ван Оверстратен был одним из ближайших военных советников короля, за что получил прозвище «вице-король» — по крайней мере, в военных вопросах. Он также преподавал в Королевской военной школе и в 1920-е годы опубликовал несколько книг, в которых предвидел будущую роль танков в войне. При этом у него было весьма своеобразное мнение о бельгийских ВВС: он считал, что, поскольку авиация не способна противостоять немецкому нападению, армии вообще не следует вкладываться в военно-воздушные силы, а вместо этого нужно сосредоточиться на зенитной артиллерии."
 BEL_gustaaf_sap:0 "Густаф Сап"
 BEL_gustaaf_sap_desc:0 "Густаф Сап был экономистом и политиком крайне правого крыла Католической партии. Он тайно поддерживал Леона Дегреля, надеясь на победу рексистов. Сап планировал организовать избирательный успех Дегреля и вступить в его партию лишь после захвата власти. Однако после упадка движения «Рекс», последовавшего за успехом Дегреля на выборах 1936 года, Густаф Сап остался в Католической партии и в итоге вошёл в состав правительства в изгнании в Лондоне."
 BEL_victor_van_strydonck_de_burkel_desc:0 "Будучи одним из старейших генералов бельгийской армии, он мог оказаться не готов к технологическому прогрессу в области мобильности. Но после некоторых колебаний он согласился с программой моторизации, начатой в 1935 году, а затем стал её убеждённым сторонником."
 BEL_auguste_edouard_gilliaert:0 "Огюст-Эдуар Жиллиар"
 BEL_karel_bossart_desc:0 "Американцы предоставили одному из наших величайших специалистов в области ракетостроения щедрое финансирование. Мы наверняка сможем убедить его вернуться на родину, если предложим такие же возможности."
 BEL_joris_van_severen:0 "Йорис ван Северен"
 BEL_joris_van_severen_desc:0 "Йорис ван Северен не был партийным лидером, поскольку Вердинасо не являлось политической партией. Это было движение, стремившееся объединить весь Бенилюкс в единое корпоративистское государство. Несмотря на это, до 1935 года он оставался яростным фламандским националистом, а затем стал утверждать, что валлоны являются родственным народом одной крови и потому должны войти в союз. С практической точки зрения раздел Бельгии также означал бы раздел Бельгийского Конго, что полностью противоречило его мечтам о величии. В 1940 году бельгийские власти арестовали его как потенциального будущего коллаборациониста. Его вместе с другими фашистами перевезли на север Франции, где недовольные и пьяные французские охранники убили его."
 BEL_julien_lahaut_desc:0 "Будучи ветераном «Бельгийского экспедиционного корпуса бронеавтомобилей в России», Жюльен Лао познакомился с большевиками и разделил их идеи. Вернувшись в Бельгию, он стал одним из важнейших членов коммунистической партии."
 BEL_achille_van_acker_desc:0 "Ашиль (Ахил) ван Аккер был политиком-социалистом, который в 1945 году стал премьер-министром."
 BEL_yvan_gerard_desc:0 "Иван Жерар был командиром дивизии бельгийской армии. С учётом обстоятельств ему удалось отвести свои войска в относительно хорошем порядке."
 BEL_jean_de_lannoy:0 "Жан де Ланнуа"
 BEL_jean_de_lannoy_desc:0 "Происходивший из древнего дворянского рода Жан де Ланнуа был пожилым генералом, размышлявшим о природе современной войны. По сравнению с бельгийским военным истеблишментом он придерживался новаторских взглядов. В своих статьях он предлагал использовать танки для проведения сокрушительных контратак, способных остановить продвижение противника. Хотя исторически Бельгия никогда не располагала достаточным количеством танков для выполнения манёвров, описанных в его работах, очевидно, что он выступал за применение мобильной войны в Бельгии."
 BEL_henri_denis:0 "Анри Дени"
 BEL_henri_denis_desc:0 "Благодаря военному опыту отставного генерала Анри Дени занимал пост министра обороны в нескольких сменявших друг друга правительствах. Он руководил разработкой бельгийской оборонительной стратегии и создал территориальную противовоздушную охрану. В 1940 году он отказался следовать за правительством в изгнание в Лондон, предпочтя остаться с королём. Он даже заявил Леопольду III, что как единственный оставшийся в стране министр может подписать указ об отставке правительства. Такой шаг подорвал бы легитимность правительства Юбера Пьерло. К счастью, король отклонил его предложение."
 BEL_edouard_van_den_bergen:0 "Эдуар ван ден Берген"
 BEL_edouard_van_den_bergen_desc:0 "Эдуар ван ден Берген, прежде служивший генералом артиллерии, в 1935 году был назначен начальником генерального штаба. Как командующий вооружёнными силами после короля, он разработал план увеличения срока военной службы и, следовательно, повышения качества резервных дивизий. Однако этот план так и не был реализован, поскольку правительство сочло восстановление экономики более важным, чем подготовку к войне, которая всё ещё казалась лишь гипотетической. Он лишился должности и возглавил одну из армейских групп после того, как во время одной из многочисленных ложных тревог «Странной войны» без согласования с королём или правительством пригласил французские войска перейти бельгийскую границу."
 BEL_paul_hiernaux:0 "Поль Иерно"
 BEL_paul_hiernaux_desc:0 "Ветеран-лётчик Великой войны Поль Иерно в 1940 году был верховным командующим бельгийских ВВС. (Примечание: его портрет датирован 1918 годом.)"
 BEL_paul_van_waesberghe:0 "Поль ван Васберге"
 BEL_paul_van_waesberghe_desc:0 "Поль ван Васберге всё ещё был молодым лейтенантом, когда бельгийский флот восстановили. Благодаря своим способностям он был отобран для отправки в Великобританию, где прошёл более углублённую подготовку в Королевском флоте. Затем он сражался в бельгийском корпусе Королевского флота, а после войны стал одним из важнейших офицеров бельгийских военно-морских сил."
 BEL_gustave_fromont:0 "Гюстав Фромон"
 BEL_gustave_fromont_desc:0 "В 1940 году Гюстав Фромон вместе с Оливье Деруссо занимал должность заместителя начальника генерального штаба."
 BEL_gustave_fromont2:0 "Гюстав Фромон"
 BEL_gustave_fromont2_desc:0 "В 1940 году Гюстав Фромон вместе с Оливье Деруссо занимал должность заместителя начальника генерального штаба."
 BEL_olivier_derousseaux:0 "Оливье Деруссо"
 BEL_olivier_derousseaux_desc:0 "В 1940 году Оливье Деруссо вместе с Гюставом Фромоном занимал должность заместителя начальника генерального штаба. На него была возложена трудная задача вести переговоры о капитуляции бельгийской армии."
 BEL_olivier_derousseaux2:0 "Оливье Деруссо"
 BEL_olivier_derousseaux2_desc:0 "В 1940 году Оливье Деруссо вместе с Гюставом Фромоном занимал должность заместителя начальника генерального штаба. На него была возложена трудная задача вести переговоры о капитуляции бельгийской армии."
 BEL_jules_pire2:0 "Жюль Пир"
 BEL_jules_pire2_desc:0 "В 1940 году Жюль Пир командовал дивизией. Позднее он возглавил бельгийскую Тайную армию."
 BEL_franz_burniaux:0 "Франц Бюрньо"
 BEL_franz_burniaux_desc:0 "Инструктор бельгийских ВВС Франц Бюрньо после краткой остановки в Великобритании продолжил войну в Африке. С ним консультировались по вопросу возможности создания военно-воздушных сил Бельгийского Конго, но после отказа от этого проекта он служил в бельгийском корпусе ВВС Южной Африки."
 BEL_Fernand_Frenay:0 "Фернан Френе"
 BEL_xavier_relecom:0 "Ксавье Релеком"
 BEL_xavier_relecom_desc:0 "Будучи одним из важнейших членов Коммунистической партии Бельгии, после смерти Жозефа Жакмотта Ксавье Релеком стал ведущим участником тройки вместе с Жюльеном Лао и Жоржем ван ден Боомом. Оказавшись в заключении у гестапо, он заключил тайную сделку: жизнь руководства партии, включая его самого, сохранялась в обмен на то, что он убедит других коммунистических активистов сотрудничать."
 BEL_andor_berei:0 "Андор Береи"
 BEL_andor_berei_desc:0 "Андор Береи был венгром, оказавшимся в изгнании после победы контрреволюционеров, разгромивших Венгерскую Советскую Республику в 1919 году. Его направили в Бельгию в качестве представителя Коминтерна — и, соответственно, Сталина — при Коммунистической партии Бельгии."
 BEL_paul_nothomb:0 "Поль Нотом"
 BEL_paul_nothomb_desc:0 "У Поля Нотома были все задатки образцового представителя бельгийских высших классов. Он родился в состоятельной семье и окончил курс подготовки лётчиков первым в своём выпуске. Однако в процессе обучения он познакомился с марксистско-ленинскими идеями и принял сторону коммунизма. Нотом покинул армию, чтобы бороться с фашизмом в гражданской войне в Испании, где встретился с Андре Мальро. После возвращения в Бельгию немцы арестовали его вместе с другими влиятельными коммунистическими активистами, но благодаря соглашению между Релекомом и гестапо он избежал казни."
 BEL_Jose_Streel:0 "Жозе Стрел"
 BEL_rene_lagrou_desc:0 "Рене Лагру был «военным корреспондентом» фламандской автономистской и сепаратистской партии VNV. Он пытался побудить фламандскую молодёжь вступать во Фламандский легион СС. Кроме того, он является дедом одного из университетских преподавателей автора этих строк."
 BEL_Victor_Matthys:0 "Виктор Маттис"
 BEL_Victor_Matthys_desc:0 "Виктор Маттис был близким соратником Леона Дегреля, и ему доверили руководство партией рексистов, пока Дегрель воевал на Восточном фронте."
 BEL_lambert_chardome_desc:0 "Ламбер Шардом — весьма своеобразный случай. В 1940 году он командовал дивизией, но, возможно, вместе с Дегрелем планировал помочь его «походу на Брюссель» и организовать переворот. Однако мне удалось найти лишь утверждение самого Дегреля, которое выглядит очередным элементом его переписывания истории. Как бы то ни было, Шардома, как и большинство бельгийских генералов, отправили в лагерь для военнопленных. В 1944 году Леону Дегрелю потребовался офицер для командования «Валлонским легионом», поэтому он стал искать бельгийских офицеров-антикоммунистов. Шардома убедили, заявив ему, будто король одобряет борьбу против Советов — хотя Леопольд III, несомненно, не питал симпатий к коммунистам, подобных взглядов он никогда не высказывал. Но прежде чем отправиться на фронт, Шардом попросил разрешения вернуться в Бельгию и повидаться с семьёй. Там он увидел положение страны и, вероятно, получил больше сведений об общем ходе войны. Убедившись, что поступает неправильно, он вместо этого вернулся в свой шталаг. Хотя он так и не участвовал в деятельности легиона, после войны его приговорили к 15 годам тюремного заключения."
 BEL_jules_henri_vincotte:0 "Жюль-Анри Венкотт"
 BEL_jules_henri_vincotte_desc:0 "Директор военной академии."
 BEL_rene_legros:0 "Рене Легро"
 BEL_rene_legros_desc:0 "Рене Легро был генерал-майором авиации бельгийских ВВС."
 BEL_andre_becquet:0 "Андре Беке"
 BEL_alexandre_galopin:0 "Александр Галопен"
 BEL_alexandre_galopin_desc:0 "Александр Галопен был управляющим «Société Générale» — корпорации с названием столь же расплывчатым, как и сфера её деятельности. Она владела активами во многих важнейших отраслях бельгийской экономики, включая «Union Minière du Haut-Katanga» в Бельгийском Конго. Во время войны Галопен решил остаться в Бельгии, опасаясь, что без надлежащего руководства активы корпорации будут захвачены оккупационными властями. Впоследствии его именем назвали «доктрину Галопена». Она заключалась в том, что экономика должна продолжать работать, чтобы населению можно было выплачивать зарплату. Хотя это отчасти помогало немцам, бельгийское правительство в изгнании поддерживало такую политику, считая её необходимым злом по сравнению с угрозой голода. В 1944 году Галопена убили фламандские фашисты во главе с Робертом Яном Вербеленом, поскольку он олицетворял довоенную экономическую элиту."
 BEL_jean_terfve:0 "Жан Терфве"
 BEL_jean_terfve_desc:0 "Жан Терфве был доктором права и членом Коммунистической партии Бельгии. Он активно участвовал в бельгийском Сопротивлении, а после ареста других коммунистических руководителей Андор Береи выбрал его в число ведущих коммунистов страны."
 BEL_gustave_joassart:0 "Гюстав Жоассар"
 BEL_gustave_joassart_desc:0 "Будучи директором FN Herstal, Гюстав Жоассар находился в самом центре различных отраслей бельгийской военной промышленности. Например, он участвовал в совещаниях по строительству в Бельгии завода авиационных двигателей, которые бельгийские авиастроители до того систематически импортировали."
 BEL_constant_de_wulf:0 "Констан де Вюльф"
 BEL_maximilien_de_neve_de_roden:0 "Максимильен де Нев де Роден"
 BEL_maximilien_de_neve_de_roden_desc:0 "Максимильен де Нев де Роден был генералом кавалерии, который в 1936 году командовал «Арденнскими егерями», а в 1939 году — кавалерийским корпусом."
 BEL_auguste_lippens:0 "Огюст Липпенс"
 BEL_auguste_lippens_desc:0 "Огюст Липпенс, ранее занимавший должность генерал-губернатора Бельгийского Конго, в 1940 году предложил сформировать новое правительство вокруг короля."
 BEL_robert_de_foy:0 "Робер де Фуа"
 FLA_auguste_baesens:0 "Огюст Басенс"
 FLA_auguste_baesens_desc:0 "Огюст Басенс был командующим артиллерией 2-го армейского корпуса."
 FLA_alexis_vander_veken:0 "Алексис Вандер Векен"
 FLA_alexis_vander_veken_desc:0 "Алексис Вандер Векен командовал 1-м армейским корпусом."
 FLA_Robert_Jan_Verbelen:0 "Роберт Ян Вербелен"
 FLA_Robert_Jan_Verbelen_desc:0 "Роберт Ян Вербелен был фламандским националистом, который активно сотрудничал с гестапо в устранении оппозиции в оккупированной Бельгии. Он преследовал участников Сопротивления, коммунистов и всех, кто вставал у него на пути. Именно он стоял за убийством директора «Société Générale» Александра Галопена. После войны Вербелен бежал в Австрию, чтобы избежать правосудия, и предложил американцам свои услуги в качестве профессионального охотника на коммунистов. Так началась его новая карьера агента ЦРУ."
 FLA_jef_van_de_wiele:0 "Йеф ван де Виле"
 FLA_jef_van_de_wiele_desc:0 "Йеф ван де Виле был одним из самых ревностных коллаборационистов Бельгии. Он входил в число наиболее заметных членов «De Vlag» («Флаг») — организации, добивавшейся ни много ни мало присоединения Фландрии к Германии. Неудивительно, что немцы оказывали ей серьёзную поддержку, надеясь создать Großdeutschland, объединяющую все народы германского происхождения."
 FLA_Staf_De_Clercq:0 "Стаф Деклерк"
 FLA_war_van_overstraeten:0 "Вар ван Оверстратен"
 FLA_Dr_August_Borms:0 "Август Бормс"
 FLA_paul_le_roy:0 "Пол Ле Руа"
 FLA_jef_francois:0 "Йеф Франсуа"
 FLA_emile_van_dievoet:0 "Эмиль ван Дивут"
 FLA_frans_van_cauwelaert:0 "Франс ван Каувеларт"
 FLA_georges_van_den_boom:0 "Жорж ван ден Боом"
 FLA_Hendrik_Elias:0 "Хендрик Элиас"
 FLA_camille_huysmans:0 "Камиль Гюйсманс"
 FLA_jef_van_extergem:0 "Йеф ван Экстергем"
 WLL_auguste_buisseret:0 "Огюст Бюиссере"
 WLL_georges_thone:0 "Жорж Тон"
 WLL_arille_carlier:0 "Ариль Карлье"
 WLL_Prosper_Theugels:0 "Проспер Теугелс"
 WLL_fernand_rouleau:0 "Фернан Руло"
 WLL_Jules_Mahieu:0 "Жюль Маё"
 COG_albert_decoster:0 "Альбер Декостер"
 COG_albert_decoster_desc:0 "Альбер Декостер был директором «Journal du Katanga» — издания, которое с чрезвычайной точностью и регулярностью перепечатывало содержание советских военных сводок. Хотя отчасти это было позой, призванной угодить синдикалистам Жадовиля, сам он действительно симпатизировал левым идеям."
 COG_pierre_cattier:0 "Пьер Каттье"
 COG_pierre_cattier_desc:0 "Пьер Каттье управлял паромной компанией, действовавшей между Антверпеном и Леопольдвилем. В случае создания бельгийско-конголезского флота он оказался бы одним из немногих людей, обладавших опытом, необходимым для помощи в его управлении."
 COG_joseph_kasa_vubu_desc:0 "Жозеф Каса-Вубу уже сразу после войны выступал за признание культурной самобытности конголезцев. Позднее он стал первым президентом независимого Конго-Леопольдвиля."
 COG_gerard_greindl_desc:0 "Жерар Грейндль был бельгийским лётчиком, продолжившим войну в Африке. Из-за нехватки самолётов в Бельгийском Конго он служил в военно-воздушных силах Южной Африки."
 COG_charles_joseph_haas:0 "Шарль-Жозеф Хаас"
 COG_charles_joseph_haas_desc:0 "Шарль-Жозеф Хаас был офицером, продолжившим службу в Конго после Великой войны. В 1935 году он стал подполковником, а в 1941 году — полковником; в Абиссинии он сражался под командованием Жиллиара."
 COG_jules_cousin:0 "Жюль Кузен"
 COG_jules_cousin_desc:0 "Жюль Кузен был одним из управляющих Union Minière du Haut-Katanga."
 COG_leo_petillon:0 "Лео Петийон"
 COG_leo_petillon_desc:0 "Лео Петийон служил чиновником в министерстве колоний в Брюсселе — он был одним из основателей колониальной лотереи, предшественницы бельгийской национальной лотереи, — прежде чем попросил о переводе в Бельгийское Конго. В 1939 году он стал помощником генерал-губернатора Пьера Рикманса."
 COG_eugene_jungers_desc:0 "Эжен Юнгерс был колониальным администратором подмандатной территории Руанда-Урунди, состоявшей из современных Руанды и Бурунди. Эти земли теоретически считались отдельными от Бельгийского Конго, поскольку ранее являлись германскими колониями, а теперь управлялись по мандату Лиги Наций."
 COG_edgar_sengier:0 "Эдгар Сенжье"
 COG_edgar_sengier_desc:0 "Эдгар Сенжье был инженером, которому пришла идея отправить в Соединённые Штаты большие запасы урановой руды, добытой в Шинколобве, чтобы обезопасить их от европейской войны. Его действия напрямую повлияли на объём урана, доступного правительству США для запуска Манхэттенского проекта."
 COG_jean_beaudinet:0 "Жан Бодине"
 COG_jean_beaudinet_desc:0 "Жан Бодине был директором «государственной безопасности» — гражданской бельгийской спецслужбы — в колонии."
 COG_paul_ermens_desc:0 "Поль Эрменс был начальником штаба Общественных сил."
 COG_auguste_edouard_gilliaert:0 "Огюст-Эдуар Жиллиар"
 COG_leopold_dronkers_martens:0 "Леопольд Дронкерс-Мартенс"
 COG_leopold_dronkers_martens_desc:0 "Леопольд Дронкерс-Мартенс был одним из старших офицеров Абиссинской кампании. Позднее его вместе с конголезским корпусом направили на Ближний Восток."
 COG_edmond_van_der_meersch:0 "Эдмон ван дер Мерс"
 COG_edmond_van_der_meersch_desc:0 "Эдмон ван дер Мерс наиболее известен своей ролью в событиях, связанных с независимостью Конго в 1960 году, однако уже тогда он был высокопоставленным офицером Общественных сил."
 COG_robert_mauroy:0 "Робер Моруа"
 COG_robert_mauroy_desc:0 "Робер Моруа был начальником штаба Эмиля Эннекена. Он рассматривался как возможный кандидат на фактическое командование войсками, но вместо него выбрали Огюста-Эдуара Жиллиара."
 COG_emile_hennequin:0 "Эмиль Эннекен"
 COG_emile_hennequin_desc:0 "До генерала Эрменса Общественными силами командовал Эмиль Эннекен. Он руководил первыми реформами, благодаря которым после сокращения бюджета, вызванного Великой депрессией, началось перевооружение этих войск."
 COG_franz_burniaux:0 "Франц Бюрньо"
 COG_franz_burniaux_desc:0 "Инструктор бельгийских ВВС Франц Бюрньо после краткой остановки в Великобритании продолжил войну в Африке. С ним консультировались по вопросу возможности создания военно-воздушных сил Бельгийского Конго, но после отказа от проекта он служил в бельгийском корпусе ВВС Южной Африки."
 COG_nicolas_florine:0 "Николя Флорин"
 COG_n_cools:0 "Н. Коолс"
 COG_n_cools_desc:0 "Хотя исторически Н. Коолс играл относительно незначительную роль среди высших офицеров Общественных сил, примечательно, что он имел репутацию убеждённого германофила. За отсутствием более подходящей кандидатуры я выбрал его в качестве фашистского лидера Конго. Также следует отметить, что я долго искал его полное имя, но сумел найти лишь инициал."
 COG_m_heynen:0 "М. Хейнен"
 COG_m_heynen_desc:0 "М. Хейнен был синдикалистом, который в 1940 году вместе с М. Дютроном возглавил забастовки в Жадовиле. Разница между ними заключалась в том, что Хейнен выступал за победу Германии, тогда как Дютрон — за коммунистическую революцию. В то время эти позиции не противоречили друг другу из-за пакта Молотова — Риббентропа. В конце концов обоих заключили в тюрьму за «пораженческие речи»."
 COG_m_dutron:0 "М. Дютрон"
 COG_m_dutron_desc:0 "М. Дютрон был синдикалистом, который в 1940 году вместе с М. Хейненом возглавил забастовки в Жадовиле. Разница между ними заключалась в том, что Дютрон выступал за коммунистическую революцию, тогда как Хейнен желал победы Германии. В то время эти позиции не противоречили друг другу из-за пакта Молотова — Риббентропа. В конце концов обоих заключили в тюрьму за «пораженческие речи»."
 COG_m_dutron2:0 "М. Дютрон"
 COG_m_dutron2_desc:0 "М. Дютрон был синдикалистом, который в 1940 году вместе с М. Хейненом возглавил забастовки в Жадовиле. Разница между ними заключалась в том, что Дютрон выступал за коммунистическую революцию, тогда как Хейнен желал победы Германии. В то время эти позиции не противоречили друг другу из-за пакта Молотова — Риббентропа. В конце концов обоих заключили в тюрьму за «пораженческие речи»."
 COG_maurice_sluys:0 "Морис Слёйс"
 COG_maurice_sluys_desc:0 "Морис Слёйс был горным инженером, работавшим на американскую компанию в Югославии, а после вторжения как в Бельгию, так и в Югославию перебрался в Бельгийское Конго. Он возглавил «Управление военного горнодобывающего производства» («Direction de la production minière de guerre» по-французски). Позднее он вернулся в Бельгию и преподавал геологию в Льеже. Обратите внимание: использованная здесь фотография сделана в последние годы его жизни, задолго после отъезда из Африки."
 COG_union_miniere:0 "Union Minière du Haut-Katanga"
 COG_union_miniere_desc:0 "Union Minière du Haut-Katanga — горнодобывающая компания, основанная в Катанге, которую называли настоящим «геологическим скандалом». Она добывала медь, вольфрам и разрабатывала знаменитый урановый рудник Шинколобве."
 COG_idea_war_mining_production_directorate:0 "Управление военного горнодобывающего производства"
 COG_idea_war_mining_production_directorate2:0 "Управление военного горнодобывающего производства"
 COG_idea_war_mining_production_directorate3:0 "Управление военного горнодобывающего производства"
 BEL_linguistic_question_in_military:0 "Языковой вопрос в армии"
 BEL_linguistic_question_in_military_desc:0 "На протяжении многих лет фламандское движение требовало разделить армию по языковому принципу, утверждая, что фламандские солдаты не понимают приказов, отдаваемых на французском языке."
 BEL_divide_the_military:0 "Реорганизовать армию по языковому принципу"
 BEL_divide_the_military_desc:0 "Теперь, когда разработан план реорганизации вооружённых сил по языковому принципу, некоторым частям придётся переехать в другие казармы, а многие солдаты окажутся под командованием новых офицеров."
 BEL_army_linguistic_divide:0 "Языковое разделение армии"
 BEL_army_linguistic_divide_desc:0 "На протяжении многих лет фламандское движение требовало разделить армию по языковому принципу, утверждая, что фламандские солдаты не понимают приказов, отдаваемых на французском языке. Теперь пришло время изменить структуру армии и создать отдельные франкоязычные и фламандскоязычные дивизии."
 BEL_depillarize_the_belgians:0 "Депилларизовать бельгийское общество"
 BEL_depillarize_the_belgians_desc:0 "Косность нынешнего сегментированного общества препятствует революции и связанному с ней лучшему будущему."
 BEL_choose_Rex:0 "Выбрать «Рекс»"
 BEL_choose_Rex_desc:0 "«Рекс» — сильнейшая фашистская партия страны. «Рекс» хочет сохранить отечество сильным и единым. «Рекс» покажет, насколько славна Бельгия. «Рекс» победит!"
 BEL_choose_Verdinaso_desc:0 "VNV стремится лишь расколоть страну и не желает видеть, что валлоны — не наши враги, а наши братья по крови. Напротив, если мы сумеем сплотить народ вокруг объединения Нидерландов, то сможем создать Дитсланд — союз всех народов Нижних земель. Новая нация ознаменует наше вечное единство после пятисот лет разлуки."
 BEL_choose_Verdinaso:0 "Выбрать «Вердинасо»"
 BEL_go_left:0 "Поддержать KPB-PCB"
 BEL_go_left_desc:0 "Слишком долго нашей страной управляли банкиры и толстосумы. Настало время Коммунистической партии Бельгии выйти на первый план. Мы должны распространить пролетарскую революцию!"
 BEL_go_right:0 "Поддержать «Рекс» и «Вердинасо»"
 BEL_go_right_desc:0 "Слишком долго нашей страной управлял класс эгоистичных и коррумпированных политиков вместе с их друзьями-банкирами. Такое поведение лишь ускоряет нравственное разложение общества, позволяя мерзким красным псам отвращать наш народ от единой святой, католической и апостольской Церкви. Нашему отечеству пора пробудиться!"
 BEL_fascist_legions:0 "Бельгийские антибольшевистские легионы"
 BEL_fascist_legions_desc:0 "Нам необходимо мобилизовать сторонников для борьбы с красной угрозой в каждой стране, оказавшейся в опасности."
 BEL_belgian_militarism:0 "Бельгийский милитаризм"
 BEL_belgian_militarism_desc:0 "Бельгия творит историю уже две тысячи лет! Мы удивили великого Цезаря, разбили французов в Битве золотых шпор и господствовали над немцами во время Великой войны. Наше наследие героично, и армия должна ему соответствовать."
 BEL_claim_the_benelux:0 "Претендовать на старые Бургундские Нидерланды"
 BEL_claim_the_benelux_desc:0 "Когда-то Нидерланды были едины... но объединил их не король Виллем Оранский, а графы Фландрии и герцоги Брабанта и Бургундии, правившие из Брюгге, Брюсселя и Дижона. Народы Нидерландов принадлежат к одной благородной расе и разделяют общее наследие. Следовательно, они должны быть объединены под единой властью — нашей."
 BEL_burgundian_circuit:0 "Восстановить Бургундский округ"
 BEL_burgundian_circuit_desc:0 "«Имперский народ, пробудись!» — этими словами Леон Дегрель призывал всех бельгийцев возродить замысел герцогов Бургундских и создать государство между Францией и Германией по образцу Бургундского округа, учреждённого императором Карлом V. Тем не менее некоторые скептики начали называть его «Скромным I, королём Бургундии». (Примечание: эти скептики, как и он сам, служили солдатами Валлонского легиона на Восточном фронте.)"
 BEL_proclaim_thiois_empire:0 "Провозгласить Тиойскую империю"
 BEL_proclaim_thiois_empire_desc:0 "Теперь, когда наши главные цели достигнуты, мы наконец можем отказаться от старого названия «Бельгия» и заменить его новым, ясно отражающим могущество нашего имперского союза. Да здравствует Тиойская империя!"
 BEL_unite_dietsland:0 "Объединить Дитсланд"
 BEL_unite_dietsland_desc:0 "Объединение Дитсланда теперь возможно. Сначала необходимо восстановить границы Объединённого королевства Нидерландов. Затем мы сможем ударить по Франции, отменить позорные военные договоры Себастьена де Вобана и Людовика XIV и вновь объединить XVII провинций. Всё получится, ведь наш девиз гласит: «В единстве — сила»."
 BEL_proclaim_dietsland:0 "Провозгласить Дитсланд"
 BEL_proclaim_dietsland_desc:0 "Объединение Дитсланда теперь возможно. Сначала необходимо восстановить границы Объединённого королевства Нидерландов. Затем мы сможем ударить по Франции, отменить позорные военные договоры Себастьена де Вобана и Людовика XIV и вновь объединить XVII провинций. Всё получится, ведь наш девиз гласит: «В единстве — сила»."
 BEL_proclaim_dietsche_rijk:0 "Провозгласить Dietsche Rijk"
 BEL_proclaim_dietsche_rijk_desc:0 "Теперь, когда наши главные цели достигнуты, мы наконец можем отказаться от старого названия «Бельгия» и заменить его новым, ясно отражающим могущество нашего имперского союза. Да здравствует Dietsche Rijk!"
 BEL_fascist_youth_organizations:0 "Создать фашистские молодёжные организации"
 BEL_fascist_youth_organizations_desc:0 "На севере и юге мы можем говорить на разных языках, но нас объединяет общее германское происхождение. Эту древнюю истину необходимо внушить молодёжи, ведь именно она является будущим нашей страны, нашей расы и основой нового европейского порядка."
 BEL_colonial_claims:0 "Претендовать на бассейн Великого Конго"
 BEL_colonial_claims_desc:0 "На Берлинской конференции истинные границы Конго были урезаны лицемерными «великими державами». Пора пересмотреть эти решения и воплотить план, предложенный Стэнли: создать великое Конго, соединяющее оба океана и обеспечивающее торжество цивилизации в сердце Африки."
 BEL_germany_millitary_coop:0 "Военное сотрудничество с государством [GER.GetNameDef]"
 BEL_germany_millitary_coop_desc:0 "На фоне национального пробуждения в нашей стране и идеологической близости с государством [GER.GetNameDef] мы могли бы заключить договор о военном сотрудничестве."
 BEL_belgium_first:0 "Бог хранит свободную Бельгию и её короля"
 BEL_belgium_first_desc:0 "Строка «Dieu Protège la Libre Belgique et son Roi» взята из «Vers l'Avenir» («Навстречу будущему») — гимна рексистов. Несмотря на название, «Рекс» придерживался крайне монархических взглядов, да и сам Леопольд III не выступал однозначно против сильной исполнительной власти. Эта «нерешительность» привела к «королевскому вопросу», регентству принца Карла и отречению короля после войны."
 BEL_reactivate_caur_contacts:0 "Возобновить контакты с CAUR"
 BEL_reactivate_caur_contacts_desc:0 "Конвенция в Монтрё 1934 года дала членам «Вердинасо» возможность встретиться под покровительством агентов CAUR — Комитета действий за универсальность Рима — и обсудить создание новой Европы, вдохновлённой видением дуче."
 BEL_an_ally_across_the_channel:0 "Союзник по ту сторону Ла-Манша"
 BEL_an_ally_across_the_channel_desc:0 "Одновременный успех наших партий у себя на родине и в государстве [ENG.GetNameDef] сделал наши правительства естественными союзниками."
 BEL_propaganda_ministry:0 "Учредить министерство пропаганды"
 BEL_propaganda_ministry_desc:0 "Пропаганда — это не промывание мозгов... это лучший способ направить людей на правильный путь."
 BEL_communist_brigades:0 "Бельгийские коммунистические бригады"
 BEL_communist_brigades_desc:0 "Нам необходимо мобилизовать добровольцев для борьбы с фашистами."
 BEL_support_pcf:0 "Поддержать Французскую коммунистическую партию"
 BEL_support_pcf_desc:0 "Французская коммунистическая партия — важнейшая часть антифашистских сил Европы. Мы должны поддержать её всеми доступными средствами."
 BEL_support_pcf2:0 "Поддержать государство [FRA.GetNameDef]"
 BEL_support_pcf2_desc:0 "Французская коммунистическая партия — важнейшая часть антифашистских сил Европы. Мы должны поддержать её всеми доступными средствами."
 BEL_communist_army:0 "Политическая реорганизация армии"
 BEL_communist_army_desc:0 "Личные страдания необходимы ради славы нации. В такой стране, как Бельгия, интернационализм должен сперва утвердиться внутри государства, прежде чем распространиться по всему миру."
 BEL_sign_pact_with_soviets:0 "Пакт с государством [SOV.GetAdjective]"
 BEL_sign_pact_with_soviets_desc:0 "Главная угроза для нас исходит от государства [GER.GetNameDef]. [SOV.GetNameDefCap] предложило помочь усовершенствовать нашу бронетехнику, чтобы мы могли противостоять [GER.GetAdjective] танкам. Мы должны ухватиться за эту возможность обеими руками!"
 BEL_independent_revolution:0 "Независимая революция"
 BEL_independent_revolution_desc:0 "Эта революция — наша! Мы ничем не обязаны лидеру [SOV.GetLeader]!"
 BEL_invite_france:0 "Союз с государством [FRA.GetNameDef]"
 BEL_invite_france_desc:0 "Как две новые коммунистические державы Западной Европы, наши страны должны договориться о создании нерушимого военного союза."
 BEL_political_commissars:0 "Политические комиссары"
 BEL_political_commissars_desc:0 "Коммунистические революции подвергаются угрозе подрыва на каждом этапе пути к всеобщему изобилию. Чтобы враги не смогли остановить этот прогресс, хранители праведного пути должны бороться с агентами капиталистических держав."
 BEL_technology_sharing:0 "Обмен технологиями"
 BEL_puppet_netherlands:0 "Оказать давление на [HOL.GetAdjective] правительство"
 BEL_puppet_netherlands_desc:0 "Нижние земли должны быть освобождены от капитализма."
 BEL_communist_propaganda_Benelux:0 "Пролетарии Нижних земель, соединяйтесь!"
 BEL_communist_propaganda_Benelux_desc:0 "Нижние земли должны быть освобождены от капитализма. Для этого необходимо распространять пропаганду среди наших соседей и разжигать революцию."
 BEL_ideological_propaganda:0 "Идеологическая пропаганда"
 BEL_ideological_propaganda_desc:0 "Каждое коммунистическое движение — это потенциальная ячейка, готовая организовать массы."
 BEL_technology_sharing_desc:0 "Обмениваясь технологическими достижениями с союзниками, вся наша фракция сможет эффективнее проводить военные исследования и разработки."
 BEL_technology_sharing_democracy:0 "Обмен технологиями"
 BEL_technology_sharing_democracy_desc:0 "Обмениваясь технологическими достижениями с союзниками, вся наша фракция сможет эффективнее проводить военные исследования и разработки."
 BEL_technology_sharing_fascism:0 "Сила в знаниях"
 BEL_technology_sharing_fascism_desc:0 "Обмениваясь технологическими достижениями с союзниками, вся наша фракция сможет эффективнее проводить военные исследования и разработки."
 BEL_technology_sharing_communism:0 "Социалистическое научное сотрудничество"
 BEL_technology_sharing_communism_desc:0 "Обмениваясь технологическими достижениями с союзниками, вся наша фракция сможет эффективнее проводить военные исследования и разработки."
 BEL_form_coalition_government:0 "Сформировать коалиционное правительство"
 BEL_form_coalition_government_desc:0 "Коалиционные правительства — давняя бельгийская традиция, однако перед лицом фашистской угрозы все демократические партии должны войти в широкую коалицию, отложив мелкие разногласия."
 BEL_centralized_communist_government:0 "Централизованное коммунистическое правительство"
 BEL_urban_projects_capital:0 "Соединить брюссельские железные дороги"
 BEL_urban_projects_capital_desc:0 "Мы можем превратить столицу в по-настоящему современный город, проложив тоннели и объединив разрозненные железнодорожные линии в единую обширную сеть, проходящую через город, даже если это будет стоить Брюсселю части его архитектурного очарования."
 BEL_fortress_belgium:0 "Воссоздать пояс фортов Льежа"
 BEL_fortress_belgium_desc:0 "Форты Льежа сыграли важнейшую роль в обороне Бельгии от Германии в начале Великой войны. Необходимо как можно скорее начать масштабную строительную программу и превратить их в ключевой элемент сдерживания государства [GER.GetNameDef]. Главное — не забыть предусмотреть возможность атаки с использованием планеров."
 BEL_reinforce_antwerp_brussels:0 "Линия КВ"
 BEL_reinforce_antwerp_brussels_desc:0 "Брабант находится в самом сердце страны, и именно здесь расположены наши важнейшие города. Антверпен в прошлом был крупной крепостью, а Брюссель является центром нации. Укрепление обоих регионов превратит их в бастион против любого вторжения. Линия протянется от деревни Конингсхойкт до города Вавр и будет оборудована противотанковыми рвами, бункерами и противотанковыми заграждениями Куантэ."
 BEL_fortress_french_border:0 "Укрепить [FRA.GetAdjective] границу"
 BEL_fortress_french_border_desc:0 "[FRA.GetAdjective] государство — наш естественный враг, и мы должны быть готовы к возможной войне."
 congo_focus:0 "Дерево национальных фокусов Конго"
 BEL_Support_the_congo_railways:0 "Управление колониального транспорта"
 BEL_Support_the_congo_railways_desc:0 "Основанное в 1935 году «Office des transports coloniaux», или OTRACO («Управление колониального транспорта»), отвечало за железнодорожную систему Бельгийского Конго."
 BEL_congo_rubber:0 "Расширить каучуковые плантации"
 BEL_congo_rubber_desc:0 "Тропический климат Конго идеально подходит для выращивания каучуконосов. Использование новых сортов и расширение плантаций быстро увеличат производство. Мы уверены, что местные жители с радостью помогут нам в этом деле..."
 BEL_congo_rubber2:0 "Повысить продуктивность плантаций"
 BEL_congo_rubber2_desc:0 "Тропический климат Конго идеально подходит для выращивания каучуконосов. Использование новых сортов и расширение плантаций быстро увеличат производство. Мы уверены, что местные жители с радостью помогут нам в этом деле..."
 BEL_support_copper_mining:0 "Начать добычу [COG.GetAdjective] меди"
 BEL_support_copper_mining_desc:0 "Богатые месторождения, обнаруженные за многие годы в разных регионах Конго, лишь ждут, когда цивилизация добудет их и направит на благо нашей экономики."
 BEL_support_copper_mining2:0 "Расширить [COG.GetAdjective] медные рудники"
 BEL_support_copper_mining2_desc:0 "Богатые месторождения, обнаруженные за многие годы в разных регионах Конго, лишь ждут, когда цивилизация добудет их и направит на благо нашей экономики."
 BEL_support_tungsten_mining:0 "Начать добычу [COG.GetAdjective] вольфрама"
 BEL_support_tungsten_mining_desc:0 "Богатые месторождения, обнаруженные за многие годы в разных регионах Конго, лишь ждут, когда цивилизация добудет их и направит на благо нашей экономики."
 BEL_support_tungsten_mining2:0 "Расширить [COG.GetAdjective] вольфрамовые рудники"
 BEL_support_tungsten_mining2_desc:0 "Богатые месторождения, обнаруженные за многие годы в разных регионах Конго, лишь ждут, когда цивилизация добудет их и направит на благо нашей экономики."
 BEL_support_tungsten_mining3:0 "Продолжить расширение вольфрамовых рудников"
 BEL_support_tungsten_mining3_desc:0 "Богатые месторождения, обнаруженные за многие годы в разных регионах Конго, лишь ждут, когда цивилизация добудет их и направит на благо нашей экономики."
 BEL_support_tungsten_mining4:0 "Максимизировать добычу вольфрама"
 BEL_support_tungsten_mining4_desc:0 "Богатые месторождения, обнаруженные за многие годы в разных регионах Конго, лишь ждут, когда цивилизация добудет их и направит на благо нашей экономики."
 BEL_transform_the_congo:0 "Расширить колониальные возможности"
 BEL_transform_the_congo_desc:0 "Модернизировать порт Банана, чтобы расширить наши логистические возможности."
 BEL_transform_the_congo2:0 "Инвестировать в колониальную промышленность"
 BEL_transform_the_congo2_desc:0 "Хотя Конго прежде всего является эксплуатационной колонией, численность колониального населения и богатство полезных ископаемых уже позволяют начать их переработку перед экспортом."
 BEL_transform_the_congo3:0 "Расширить колониальную промышленность"
 BEL_transform_the_congo3_desc:0 "Хотя Конго прежде всего является эксплуатационной колонией, численность колониального населения и богатство полезных ископаемых уже позволяют начать их переработку перед экспортом."
 BEL_urbanize_wallonie:0 "Инвестировать в промышленную ось Самбры и Мааса"
 BEL_urbanize_wallonie_desc:0 "С начала XIX века Валлония была одним из самых индустриализированных регионов Европы. Река Маас и её приток Самбра служат жизненно важными артериями, по которым промышленная продукция перевозится по стране, а затем и в остальную Европу."
 BEL_invest_in_FN_Herstal:0 "Расширить военные заводы Льежа"
 BEL_invest_in_FN_Herstal_desc:0 "«Fabrique Nationale», «Fonderie Royale de Canons» и «Manufacture d'Armes de l'État», расположенные в Льеже и его окрестностях, являются важнейшими предприятиями нашей оружейной промышленности. Если мы хотим снабдить армию достаточным количеством вооружения, расширение этих заводов будет необходимостью."
 BEL_invest_in_FRC_Herstal:0 "Расширить «Fonderie Nationale de Canons»"
 BEL_invest_in_FRC_Herstal_desc:0 "«Fabrique Nationale» и «Fonderie Royale de Canons», расположенные в Эрстале близ Льежа, являются важнейшими предприятиями нашей военной промышленности. Чтобы увеличить выпуск артиллерийских орудий, необходимо расширить эти заводы."
 BEL_urban_projects_capital_industry:0 "Развивать промышленность Брюсселя"
 BEL_urban_projects_capital_industry_desc:0 "Новые железнодорожные линии, строящиеся в Брюсселе и его окрестностях, сделают экономический потенциал города ещё привлекательнее для промышленности и сферы услуг."
 BEL_Expand_the_port_of_Antwerp:0 "Расширить порт Антверпена"
 BEL_Expand_the_port_of_Antwerp_desc:0 "Будучи одним из ведущих портов Европы, Антверпен идеально подходит для развития промышленности, ориентированной на экспорт."
 BEL_urban_projects_capital2:0 "Промышленный район Антверпена"
 BEL_urban_projects_capital2_desc:0 "Будучи одним из ведущих портов Европы, Антверпен идеально подходит для развития промышленности, ориентированной на экспорт."
 BEL_revise_air_doctrine:0 "Пересмотреть воздушную доктрину"
 BEL_revise_air_doctrine_desc:0 "К середине 1930-х годов необходимость новой воздушной доктрины стала очевидной. Бельгийские ВВС изучали французскую воздушную тактику, но после неудач отечественных прототипов в основном приобретали британские лицензии."
 BEL_van_overstraeten_aa_guns:0 "Сделать упор на зенитную артиллерию"
 BEL_van_overstraeten_aa_guns_desc:0 "Рауль ван Оверстратен, один из самых влиятельных бельгийских военных теоретиков, был убеждён, что Бельгия слишком мала для собственных ВВС. Он считал, что воздушное пространство страны должны защищать союзники, а бельгийской армии следует сосредоточиться на зенитной артиллерии."
 BEL_aa_guns_expertise:0 "Опыт в зенитной артиллерии"
 BEL_aa_guns_expertise_desc:0 "Чтобы защититься от воздушных атак, мы должны производить больше зенитных батарей и прикрыть важнейшие объекты инфраструктуры средствами противовоздушной обороны."
 BEL_Renard_fighters:0 "Лёгкие самолёты Ренара"
 BEL_Renard_fighters_desc:0 "Альфред Ренар, отважный лётчик Великой войны, стал одним из важнейших бельгийских авиаконструкторов. Исторически его военные самолёты потерпели неудачу из-за аварий прототипов, но после устранения недостатков они могут стать лучшими бельгийскими истребителями."
 BEL_Foreign_aviation_studies:0 "Изучать зарубежную тактику"
 BEL_Foreign_aviation_studies_desc:0 "Изучая иностранные разработки и приобретая лицензии, мы сможем выявить недостатки наших самолётов и повысить их качество."
 BEL_experimental_weaponry:0 "Поддержать прототипы FN"
 BEL_experimental_weaponry_desc:0 "Гениальные изобретения и радикальные технологические прорывы позволяют нам создавать более необычные и эффективные виды военной техники. FN Herstal десятилетиями была пионером в области стрелкового оружия, и эту традицию необходимо продолжить ради нашей победы."
 BEL_establish_radio_stations:0 "Усовершенствовать радиолокационные станции"
 BEL_establish_radio_stations_desc:0 "[ENG.GetAdjective] опыт показывает, что станции радиообнаружения и определения дальности укрепляют оборону страны. Создадим собственные радиолокационные системы, чтобы эффективнее защищать наше государство."
 BEL_support_innovation:0 "Поддерживать инновации"
 BEL_support_innovation_desc:0 "Сражения выигрываются благодаря технологическому превосходству. Лучшие технологии означают больше побед, а лучшие технологии создаются в передовых исследовательских учреждениях."
 BEL_clear_lands_congo:0 "Расчистить новые земли"
 BEL_clear_lands_congo_desc:0 "Модернизировать порт Банана, чтобы расширить наши логистические возможности."
 BEL_invest_in_nuclear_program:0 "Ядерные исследования"
 BEL_invest_in_nuclear_program_desc:0 "Опираясь на теорию относительности Альберта Эйнштейна и исследования радиоактивного распада урана-238, мы выяснили, что расщепление атома высвобождает огромное количество энергии. Необходимо изучить возможность цепной реакции, а для этого потребуется добывать колоссальные объёмы урановой руды. Будем надеяться, что рудники Колвези и Шинколобве смогут обеспечить необходимое количество."
 BEL_further_nuclear_research:0 "Добывать и экспортировать уран"
 BEL_further_nuclear_research_desc:0 "Теперь, когда мы лучше понимаем природу атома и наращиваем добычу урановой руды, мы можем не только изучать её потенциал, но и экспортировать часть запасов главным союзникам, чтобы обеспечить окончательную победу нашей коалиции."
 BEL_start_rocket_program:0 "Начать ракетную программу"
 BEL_start_rocket_program_desc:0 "Ракетостроение — новая наука с огромным потенциалом. Исследование возможностей её военного применения может принести плоды. Чтобы обеспечить успех проекта, следует попытаться привлечь самого компетентного специалиста в этой области. Карел Ян Боссарт сейчас работает в государстве [USA.GetNameDef]; будем надеяться, что он согласится вернуться на родину и возглавить этот увлекательный проект."
 BEL_stay_neutral:0 "Политика свободных рук"
 BEL_stay_neutral_desc:0 "Мы не должны провоцировать Гитлера. Хотя союз с союзниками мог бы казаться безопаснее, он лишь повысил бы вероятность нового плана Шлиффена. Эта политика нейтралитета получила название «Mains Libres»/«Vrij Handen», то есть буквально «Свободные руки»."
 BEL_deterrence:0 "Сдерживание"
 BEL_deterrence_desc:0 "Растущая угроза европейского фашизма ясно показывает, что одних заявлений о нейтралитете недостаточно. Мы должны вооружиться, чтобы защитить свою независимость."
 BEL_democratic_influence:0 "Политический союз против фашизма"
 BEL_democratic_influence_desc:0 "Наша страна является демократической, и мы не должны поддаваться новым идеям национализма или коммунизма."
 BEL_begin_rearmement:0 "Следовать докладу Комиссии по обороне"
 BEL_begin_rearmement_desc:0 "Комиссия по обороне опубликовала подробный доклад о мерах, необходимых для адаптации наших вооружённых сил к нарастающей политической напряжённости. Этот документ должен стать основой амбициозной программы перевооружения."
 BEL_accept_van_den_den_bergen_plan:0 "Принять план ван ден Бергена"
 BEL_accept_van_den_den_bergen_plan_desc:0 "Генерал ван ден Берген предложил амбициозный план увеличения числа призывников, готовых к полной мобилизации. Хотя это позволило бы армии быстро вступить в бой, мобилизация столь большого количества людей, вероятно, замедлила бы нашу экономику, всё ещё хрупкую после потрясений Великой депрессии."
 BEL_lessons_from_wwi:0 "Организовать манёвры"
 BEL_lessons_from_wwi_desc:0 "Пришло время проверить теории плана модернизации на крупномасштабных манёврах."
 BEL_light_tank_destroyers:0 "Программа лёгких истребителей танков"
 BEL_light_tank_destroyers_desc:0 "У нас есть одно из лучших противотанковых орудий в мире — 47-мм пушка FRC. Однако быстрые машины могут обойти её с фланга. Чтобы противостоять этой угрозе, необходимо найти способ быстро перемещать наши противотанковые орудия. Возможно, стоит установить их на лёгкое гусеничное бронированное шасси и создать мобильные лёгкие истребители танков. Они смогут использовать пересечённую местность Арденн и устраивать засады на наступающие танковые колонны."
 BEL_restore_the_auto_canon_unit:0 "Восстановить подразделение бронеавтомобилей"
 BEL_restore_the_auto_canon_unit_desc:0 "Во время Первой мировой войны бронеавтомобили «Минерва» были отправлены в Россию для борьбы с австро-венгерской армией, где они использовали бреши в обороне и поддерживали пехоту. Проводя моторизацию частей, мы могли бы вновь включить бронеавтомобили в состав дивизий."
 BEL_motorised_support:0 "Моторизованное обеспечение"
 BEL_motorised_support_desc:0 "Чтобы создать систему, позволяющую максимально быстро перебрасывать войска на передовую, необходимо моторизовать значительную часть подразделений обеспечения наших пехотных дивизий."
 BEL_military_research_interest:0 "Расширить Управление военных исследований"
 BEL_military_research_interest_desc:0 "Недавние победы позволили захватить иностранные производственные мощности и некоторое количество военной техники. Чтобы все наши войска получали наиболее подходящее вооружение, необходимо расширить Управление военных исследований — подразделение министерства обороны, отвечающее за военные инновации."
 BEL_doctrines_of_the_present:0 "Доктрины современности"
 BEL_doctrines_of_the_present_desc:0 "Изучение успехов и неудач прошлого — хорошее начало, но нам также необходимо анализировать недавние войны и извлекать из них уроки."
 BEL_mechanized_infantry_investments:0 "Инвестиции в механизированную пехоту"
 BEL_mechanized_infantry_investments_desc:0 "Механизация пехоты — важнейший следующий шаг в новой эпохе мобильной войны."
 BEL_equipement_modernization:0 "Модернизация снаряжения"
 BEL_equipement_modernization_desc:0 "Недавние вложения в военную подготовку пробудили у людей гордость за нашу военную историю, и теперь молодые крепкие мужчины массово направляются в добровольческие центры."
 BEL_prototype_weapons:0 "Артиллерийские прототипы FRC"
 BEL_prototype_weapons_desc:0 "Чтобы обеспечить достаточную огневую мощь, необходимо разработать более совершенные артиллерийские системы. Поскольку FRC является единственным бельгийским производителем орудий, именно эта компания должна возглавить программу."
 BEL_modernize_tanks:0 "Модернизировать танки"
 BEL_modernize_tanks_desc:0 "Наши танки устарели. Необходимо разработать новые модели, соответствующие военным реалиям современности."
 BEL_continue_the_tank_destroyer_program:0 "Продолжить программу истребителей танков"
 BEL_continue_the_tank_destroyer_program_desc:0 "Программа лёгких истребителей танков оказалась успешной, но всегда есть возможности для улучшения. Новые методы позволят удешевить их производство и высвободить ресурсы для других проектов."
 BEL_daring_paratroopers:0 "Отважные парашютисты"
 BEL_specialized_divisions:0 "Специализированные дивизии"
 BEL_specialized_divisions_desc:0 "Последние изменения в военном деле показывают необходимость создания специализированной пехоты для действий на определённых типах местности."
 BEL_daring_paratroopers_desc:0 "Последние изменения в военном деле показывают необходимость создания специализированной пехоты. С ростом значения авиации в современной военной мысли, возможно, государству [BEL.GetNameDef] пора сформировать собственный корпус парашютистов. Если раньше в Бельгии с неба падали верёвки и алебарды, то теперь будут падать солдаты!"
 BEL_aerial_support:0 "Воздушная поддержка сухопутных войск"
 BEL_aerial_support_desc:0 "Разработка новых самолётов для поддержки наших войск даст им преимущество в бою."
 BEL_rule_the_sea_through_the_sky:0 "Господствовать на море с воздуха"
 BEL_rule_the_sea_through_the_sky_desc:0 "Для контроля над морем воздушная мощь имеет решающее значение, даже если некоторые продолжают отстаивать превосходство линкоров. В последние годы ряд теоретиков выступает за создание сильных ВВС, способных топить вражеские корабли."
 BEL_further_investments_fokker_company:0 "Увеличить инвестиции в «Фоккер»"
 BEL_further_investments_fokker_company_desc:0 "Дальнейшие вложения в проекты Антони Фоккера значительно повысят наши возможности ведения войны в воздухе."
 BEL_interest_in_rocket_technology:0 "Интерес к ракетам"
 BEL_interest_in_rocket_technology_desc:0 "Недавние инвестиции в авиационный корпус вызвали в стране настоящую ракетную «лихорадку». Нам следует воспользоваться этим."
 BEL_recreate_the_navy:0 "Воссоздать бельгийский флот"
 BEL_recreate_the_navy_desc:0 "Бельгийский флот не является даже тенью того, чем был прежде... что неудивительно, ведь его расформировали в 1927 году! Пока верфи будут строить первые за многие десятилетия бельгийские военные корабли, переоборудованные рыболовные суда с несколькими орудиями различных калибров позволят нам как можно скорее начать патрулирование и постановку мин."
 BEL_submarine_operations:0 "Подводные операции"
 BEL_submarine_operations_desc:0 "Мы должны сосредоточить морские усилия на силах, способных задушить противника, уничтожая его конвои."
 BEL_reinvigorate_naval_prowess_of_old:0 "Развивать флот"
 BEL_reinvigorate_naval_prowess_of_old_desc:0 "Нашему флоту остро не хватает огневой мощи тяжёлых кораблей. Победить на море можно разными способами, но морские крепости — линкоры и линейные крейсеры — остаются самым эффективным и славным из них. Мы должны стать морской силой, с которой придётся считаться."
 BEL_submarine_improvements:0 "Невидимый флот"
 BEL_submarine_improvements_desc:0 "Чтобы успешно реализовать новую стратегию, необходимо обеспечить флот самыми современными подводными лодками в мире."
 BEL_stealth_upgrades:0 "Усовершенствованные шноркели"
 BEL_stealth_upgrades_desc:0 "Шноркели позволят нашим подводным лодкам дольше действовать под водой, снизят вероятность обнаружения и сохранят преимущество первого удара."
 BEL_expand_the_navy:0 "Расширить флот"
 BEL_expand_the_navy_desc:0 "Линкоры и авианосцы — лучший способ защитить нашу разбросанную по миру империю от внешних угроз."
 BEL_cruisers_and_destroyers:0 "Сосредоточиться на малых кораблях"
 BEL_cruisers_and_destroyers_desc:0 "Крупные корабли — пустая трата ценных ресурсов. Зачем строить их, если наши морские пути можно эффективнее защищать большим количеством малых судов?"
 BEL_naval_mining:0 "Морское минирование"
 BEL_naval_mining_desc:0 "Морское минирование"
 BEL_naval_warfare_desc:0 "Мины позволяют сдерживать противника, не вступая с ним в прямой бой, что является значительным преимуществом в нашей стратегической ситуации."
 BEL_naval_artillery:0 "Корабельная артиллерия"
 BEL_naval_artillery_desc:0 "Для эффективности надводного корабля решающее значение имеет огневая мощь."
 BEL_dutch_marines:0 "[BEL.GetAdjective] морская пехота"
 BEL_dutch_marines_desc:0 "Для максимально эффективного проведения морских вторжений и захвата островов нам необходимы специальные дивизии морской пехоты."
 BEL_interest_in_carriers:0 "Авианосные амбиции"
 BEL_interest_in_carriers_desc:0 "Пора вывести [BEL.GetAdjective] флот в будущее! Воздушное прикрытие необходимо в современных морских операциях. Новая угроза мирового конфликта требует способности проецировать силу по всему миру... и государство [BEL.GetNameDef] должно быть готово получить свою долю."
 BEL_join_britain_alliance:0 "Вступить в Союзники"
 BEL_join_britain_alliance_desc:0 "В Европе существуют два лагеря: те, кто хочет защитить свободу, и те, кто желает её уничтожить. Пора обратиться к государству [ENG.GetNameDef] и отказаться от нейтралитета. За Союзников!"
 BEL_benelux_faction:0 "Создать Бенилюкс"
 BEL_benelux_faction_desc:0 "Вместо сохранения нейтралитета или присоединения к государствам [FRA.GetNameDef] и [ENG.GetNameDef], что наверняка втянет нас в войну против государства [GER.GetNameDef], следует сотрудничать с ближайшими соседями. После создания Таможенного союза Бенилюкса необходимо разработать совместный план обороны, который гарантирует независимость наших трёх львов как от орла, так и от петуха."
 BEL_invite_bel_lux:0 "Пригласить [HOL.GetNameDef] и [LUX.GetNameDef]"
 BEL_invite_bel_lux_desc:0 "Чтобы создать Бенилюкс, нам нужно добавить «Ни» и «Люкс»."
 BEL_communist_youth:0 "Двуязычное революционное молодёжное движение"
 BEL_communist_youth_desc:0 "Интернационализм порой начинается внутри собственной страны. Чтобы все будущие [BEL.GetAdjective] рабочие понимали друг друга, необходимо сделать двуязычие обязательным, даже если это возмутит часть франкоязычного населения."
 BEL_armed_neutrality:0 "Вооружённый нейтралитет"
 BEL_armed_neutrality_desc:0 "Чтобы сохранить нейтралитет в столь враждебные времена, мы должны показать, что не сдадимся без боя."
 BEL_british_ship_designs:0 "[ENG.GetAdjective] проекты кораблей"
 BEL_british_ship_designs_desc:0 "[ENG.GetAdjective] сторона передала нам несколько чертежей кораблей, чтобы увеличить темпы судостроения и эффективнее защищать наши морские владения."
 BEL_trick_german_scum:0 "Продемонстрировать нейтралитет"
 BEL_trick_german_scum_desc:0 "Строительством береговых укреплений мы покажем [GER.GetAdjective] стороне, что намерены защищаться от любой внешней угрозы, а не только от неё."
 BEL_pillarized_society:0 "Пилларизованное общество"
 BEL_pillarized_society_desc:0 "Пилларизация — один из важнейших факторов в политике государства [ROOT.GetAdjective]. Она представляет собой разделение общества на «политические пузыри», поскольку каждая влиятельная партия располагает собственными взаимными фондами, профсоюзами и другими организациями. В результате эта система закрепляет голоса от выборов к выборам и способствует возвращению одних и тех же политических коалиций."
 BEL_union_agreements:0 "Соглашения с профсоюзами"
 BEL_union_agreements_desc:0 "Недавние переговоры с профсоюзами завершились удовлетворительным результатом."
 BEL_reserve_mobilization:0 "Мобилизация резервов"
 BEL_reserve_mobilization_desc:0 "Мы можем привлечь в армию новое поколение, вдохновив его рассказами о нашем героическом сопротивлении немцам во время Великой войны."
 BEL_tank_destroyers_expertise:0 "Опыт в создании истребителей танков"
 BEL_tank_destroyers_expertise_desc:0 "Применение новых и усовершенствованных методов позволяет удешевить производство наших истребителей танков."
 BEL_communist_police:0 "Коммунистическая полиция"
 BEL_communist_police_desc:0 "Эти специальные полицейские подразделения будут подавлять недовольство среди новых граждан и повышать готовность войск сражаться за Родину!"
 BEL_aerial_interest:0 "Интерес к авиации"
 BEL_aerial_interest_desc:0 "Создание нового парашютного корпуса и возобновление инвестиций в компанию «Фоккер» пробудили общественный интерес к развитию авиации."
 BEL_armed_neutrality_idea:0 "Вооружённый нейтралитет"
 BEL_coalition_vs_fascism:0 "Союз против фашизма"
 BEL_why_we_fight:0 "Защита свободы"
 BEL_why_we_fight_desc:0 "За монарха, свободу и справедливость — за короля, закон и свободу!"
 BEL_exiled_intelligence_service:0 "Разведывательная служба в изгнании"
 BEL_exiled_intelligence_service_desc:0 "Борьба за освобождение отечества продолжается в тени."
 BEL_exiled_evacuated_industries:0 "Эвакуированная промышленность в изгнании"
 BEL_exiled_evacuated_industries_desc:0 "Мы можем использовать промышленность, которую успели эвакуировать после капитуляции, чтобы продолжить борьбу."
 BEL_launch_V_campaign:0 "Начать кампанию «V»"
 BEL_launch_V_campaign_desc:0 "Находясь в изгнании, мы должны продолжать информировать [BEL.GetAdjective] население и призывать его к сопротивлению иностранной оккупации. В качестве общего символа Робер де Лавеле предложил использовать букву V, поскольку с неё начинаются французское слово Victoire («Победа») и нидерландское Vrijheid («Свобода»)."
 BEL_armed_neutrality_idea_desc:0 "Хотя наша страна объявила нейтралитет, постоянная армия необходима для его защиты."
 BEL_british_ship_designs_idea:0 "[ENG.GetAdjective] проекты кораблей"
 BEL_british_ship_designs_idea_desc:0 "[ENG.GetAdjective] сторона передала нам несколько чертежей, позволяющих эффективнее производить эсминцы."
 BEL_Antwerp_Oil_Industry:0 "Антверпенские нефтеперерабатывающие мощности"
 BEL_Antwerp_Oil_Industry_desc:0 "Антверпен уже является важным портом для химической промышленности. Поскольку угроза международной торговле растёт с каждым днём, часть этих мощностей следует переоборудовать для превращения нашего любимого кондрозского угля в нефть."
 BEL_form_air_guard_of_the_territory:0 "Создать «Территориальную противовоздушную охрану»"
 BEL_form_air_guard_of_the_territory_desc:0 "«Территориальная противовоздушная охрана» (Garde Territoriale Antiaérienne, Territoriale Wacht voor Luchtafweer) была создана в 1937 году министром обороны Дени для защиты стратегических районов от воздушных атак. Она не подчинялась армии и располагала бюджетом в один миллиард франков. Поскольку FRC испытывала трудности с производством зенитных орудий, охрана получила 40-мм пушки Bofors, а также 75- и 94-мм орудия Vickers."
 BEL_belgian_navy_in_exile:0 "Создать [BEL.GetAdjective] флот в изгнании"
 BEL_belgian_navy_in_exile_desc:0 "Бельгия могла пасть, но война ещё не проиграна. Мы должны воссоздать флот, чтобы продолжить борьбу и подготовиться к освобождению страны."
 BEL_air_force_congo:0 "Авиационные части Общественных сил"
 BEL_air_force_congo_desc:0 "Бельгия может находиться под иностранной оккупацией, но война продолжается. Битва за Бельгию показала, что воздушная мощь имеет решающее значение, и впредь мы не должны отставать в этой области."
 BEL_fighter_license:0 "Получить лицензию на истребитель"
 BEL_fighter_license_desc:0 "Поскольку наши проекты истребителей недостаточно надёжны, чтобы конкурировать с иностранными машинами, необходимо обратиться к великим державам и выяснить, кто согласится предоставить лицензию на строительство современного истребителя для бельгийских ВВС."
 BEL_SABCAs_bombers:0 "Лицензионные бомбардировщики SABCA"
 BEL_SABCAs_bombers_desc:0 "В своих мастерских SABCA способна строить прочные и крупные современные самолёты. Однако не хватает одного важнейшего элемента — проектов, особенно военных. Если удастся убедить одну из великих держав лицензировать свои разработки, мы сможем создать собственные бомбардировочные силы."
 BEL_SABCAs_CAS:0 "SABCA S.47"
 BEL_SABCAs_CAS_desc:0 "SABCA S.47 — разведывательный самолёт непосредственной поддержки, разработанный [ITA.GetAdjective] авиастроительной компанией Caproni под пристальным контролем главного инженера SABCA."
 BEL_license_production:0 "Иностранные проекты"
 BEL_license_production_desc:0 "Поскольку наши собственные разработки не обладают большим потенциалом, необходимо искать за рубежом чертежи современных военных самолётов."
 BEL_multipurpose_bombers:0 "Многоцелевые бомбардировщики"
 BEL_multipurpose_bombers_desc:0 "Поскольку у нас отсутствуют тяжёлые военные самолёты, не считая транспортных, самым простым и экономичным решением будет создать один универсальный тип тяжёлой машины. Новый самолёт должен выполнять все задачи — от разведки до бомбардировок."
 BEL_king_reaction:0 "Объявить чрезвычайное положение"
 BEL_king_reaction_desc:0 "Перед лицом угрозы политического радикализма и всё возрастающих трудностей с поддержанием порядка король решил объявить военное положение. В этот судьбоносный час король и министр обороны задействовали армию для стабилизации страны. Тем самым они фактически приостановили действие конституции."
 BEL_purge_radical_opposition:0 "Устранить радикальную оппозицию"
 BEL_purge_radical_opposition_desc:0 "Для борьбы с коммунистами и фашистами необходимо организовать масштабные репрессии. В процессе власть гражданских институтов будет ограничена. Премьер-министра заменит преданный монархист, который не станет оспаривать исключительные, но необходимые меры, приказанные королём, Анри Дени и Огюстом Липпенсом."
 BEL_reduce_parlementarism:0 "Ограничить парламентаризм"
 BEL_reduce_parlementarism_desc:0 "Пока власть сосредоточена в руках исполнительной ветви, последним противовесом остаётся парламент. Хотя полностью упразднить этот институт в долгосрочной перспективе невозможно, его ослабление по сравнению с положением до начала политического кризиса очевидно. Пока на горизонте сгущаются тучи, король, как бдительный страж, будет защищать государство [BEL.GetNameDef] от внешних угроз."
 BEL_restore_constitution:0 "Восстановить конституцию"
 BEL_restore_constitution_desc:0 "После череды бедствий, сравнимых с Ноевым потопом, голубь мира наконец вернулся к ковчегу отечества. Пока тучи рассеиваются на горизонте, возможно, настало время отступить в сторону и восстановить конституцию — радугу между правительством и гражданами. С восстановлением верховенства закона власть вновь передана гражданскому правительству."
 BEL_aa_expertise:0 "Опыт производства зенитных орудий"
 BEL_national_union:0 "Политическое единство военного времени"
 BEL_national_union_desc:0 "Из-за войны было сформировано новое коалиционное правительство, объединившее демократические партии перед лицом внешней угрозы."
 BEL_peacetime_national_union:0 "Правительство национального единства"
 BEL_peacetime_national_union_desc:0 "Наше правительство объединяет все демократические партии в широкую коалицию, уменьшая политические разногласия."
 BEL_congo_uranium:0 "Уран Катанги"
 BEL_congo_uranium_desc:0 "Уранинит, или урановая смолка, добываемая на руднике Шинколобве в Катанге, является самой богатой урановой рудой в мире. Мы можем экспортировать её союзникам, чтобы помочь им выиграть войну.\n§RЭтот бонус будет удалён, если враждебная фракция захватит и удержит регион Леопольдвиль в Конго.§!"
 BEL_volunteer_corps:0 "[ROOT.GetAdjective] добровольцы"
 BEL_church_support:0 "Поддержка церкви"
 BEL_benelux_research_cooperation:0 "Научное сотрудничество Бенилюкса"
 BEL_efficient_license_production:0 "Эффективное лицензионное производство"
 BEL_support_pcf_politics:0 "Поддержка бельгийских коммунистов"
 BEL_support_pcf_diplomacy:0 "Бельгийская дипломатическая ориентация"
 BEL_repair_damages:0 "Возмещение ущерба"
 BEL_fascism_banned:0 "Фашизм запрещён"
 BEL_nationalism:0 "Национализм"
 BEL_french_advisors:0 "[FRA.GetAdjective] советники"
 BEL_royal_reaction:0 "Королевский переворот"
 BEL_monarchist_repression:0 "Монархические репрессии"
 BEL_extended_royal_powers:0 "Расширенные королевские полномочия"
 BEL_purge_the_army:0 "Провести чистку в армии"
 BEL_recovery_from_the_great_depression1:0 "Восстановление после Великой депрессии"
 BEL_recovery_from_the_great_depression1_desc:0 "Хотя экономическая ситуация улучшается, хозяйство всё ещё страдает от последствий Великой депрессии."
 BEL_recovery_from_the_great_depression2:0 "Восстановление после Великой депрессии"
 BEL_recovery_from_the_great_depression2_desc:0 "Хотя экономическая ситуация улучшается, хозяйство всё ещё страдает от последствий Великой депрессии."
 BEL_recovery_from_the_great_depression3:0 "Восстановление после Великой депрессии"
 BEL_recovery_from_the_great_depression3_desc:0 "Хотя экономическая ситуация улучшается, хозяйство всё ещё страдает от последствий Великой депрессии."
 BEL_recovery_from_the_great_depression4:0 "Восстановление после Великой депрессии"
 BEL_recovery_from_the_great_depression4_desc:0 "Хотя экономическая ситуация улучшается, хозяйство всё ещё страдает от последствий Великой депрессии."
 BEL_recovery_from_the_great_depression5:0 "Восстановление после Великой депрессии"
 BEL_recovery_from_the_great_depression5_desc:0 "Хотя экономическая ситуация улучшается, хозяйство всё ещё страдает от последствий Великой депрессии."
 BEL_digging_of_the_albert_canal:0 "Строительство канала Альберта"
 BEL_digging_of_the_albert_canal_desc:0 "Запланированный после Великой войны и начатый в 1930 году канал Альберта является дорогостоящим, но необходимым проектом, который соединит промышленные районы Валлонии с портом Антверпена."
 BEL_van_den_bergen_plan:0 "План призыва ван ден Бергена"
 BEL_military_linguistical_weaknesses:0 "Языковые проблемы в армии"
 BEL_military_linguistical_weaknesses_desc:0 "Даже после языкового разделения армии недостатки оставались очевидными. Хронически не хватало фламандскоязычных офицеров — вплоть до того, что некоторых приходилось убеждать сменить выбранный язык службы, — а местная привязка каждой дивизии означала, что порой им было трудно действовать за пределами привычных районов подготовки и операций."
 BEL_buy_back_the_railway_gun:0 "Выкупить железнодорожное орудие"
 BEL_buy_back_the_railway_gun_desc:0 "В 1924 году мы продали Франции наше железнодорожное орудие. Возможно, пришло время выкупить его обратно."
 BEL_supplementary_payments:0 "Дополнительные выплаты"
 belgium.1.t:0 "[From.GetNameDefCap] предлагает нам вступить в Бенилюкс"
 belgium.1.d:0 "Несколько часов назад национальная радиовещательная компания государства [From.GetNameDef] официально объявила, что его правительство стремится укрепить экономические и торговые связи между нашими странами. «Таможенный союз Бенилюкса является мощным инструментом торговли и научного обмена, однако он не способен защитить местное население от агрессии, если таковая возникнет у границ наших стран».\n\nРечь лидера [From.GetLeader] вызывает серьёзные опасения относительно положения региона Бенилюкс на фоне роста напряжённости в Европе и изменения политического климата не в пользу демократических стран.\n\nВступление в союз, несомненно, поможет сохранить нашу независимость, но может оттолкнуть некоторых соседей.\n\nСледует ли нам заключить официальный союз с государством [From.GetNameDef]?"
 belgium.1.a:0 "Только так мы сможем сохранить независимость."
 belgium.1.b:0 "У нас есть собственные союзники."
 belgium.2.t:0 "[From.GetNameDefCap] отказывается"
 belgium.2.d:0 "Несмотря на постоянные дипломатические миссии, экономические связи и растущую угрозу ревизионизма в Европе, лидер [From.GetLeader] открыто объявил, что государство [From.GetNameDef] не желает превращать Таможенный союз Бенилюкса в «милитаристский и разжигающий войну альянс» и стремится сохранить мир и процветание в своих владениях.\n\nНа фоне роста напряжённости и отказа ближайших потенциальных союзников государство [ROOT.GetNameDef] оказывается серьёзно ослабленным перед тёмными тучами, сгущающимися над Европой."
 belgium.2.a:0 "Они должны вступить — так или иначе."
 belgium.3.t:0 "[From.GetNameDefCap] соглашается"
 belgium.3.d:0 "Большинство руководителей страны с нетерпением ожидало ответа [From.GetAdjective] правительства. Недавняя телеграмма, полученная в Брюсселе, будет передана сегодня вечером по радио и телевидению: недавно созданный военный союз Бенилюкса пополнится новым участником — государством [From.GetNameDef].\n\nСоответствующий протокол о взаимной помощи будет подписан на следующей неделе делегациями обеих стран в нашей столице. В рамках соглашения генеральный штаб государства [ROOT.GetNameDef] получит полную поддержку и сможет сотрудничать с коллегами из государства [From.GetNameDef].\n\nФракция [Root.GetFactionName] крепнет с каждым днём. Кто знает, возможно, на этот раз великие державы отнесутся к нашему нейтралитету с уважением? Покажет лишь время..."
 belgium.3.a:0 "Отличные новости!"
 belgium.3.b:0 "Тогда справимся сами!"
 belgium.4.t:0 "[BEL.GetNameDefCap] предлагает военное сотрудничество"
 belgium.4.d:0 "Недавно установившийся режим в государстве [BEL.GetNameDef] сталкивается со множеством препятствий на пути к обеспечению стабильности и независимости от пристального внимания соседей. Растущая угроза империализма и реваншизма наверняка сделает государство [BEL.GetNameDef] целью военной агрессии, как это уже было во время Великой войны.\n\nХотя мы не можем напрямую поддержать их режим на родине, мы способны обеспечить нашим [BEL.GetAdjective] союзникам доступ к технологическим достижениям в области танкостроения. Сотрудничество станет ещё продуктивнее, если мы заключим союз и будем вместе бороться за наши народы и страны!\n\nС другой стороны, союз с такой страной, как [From.GetNameDef], расширит наше влияние и присутствие в Европе, что может вызвать нестабильность в регионе и даже ответные действия великих держав."
 belgium.4.a:0 "Нас объединяют общие ценности!"
 belgium.4.b:0 "Наши сферы влияния почти не пересекаются."
 belgium.5.t:0 "[From.GetNameDefCap] принимает предложенный нами пакт"
 belgium.5.d:0 "Осознав наше стратегическое значение в центре Западной Европы, государство [From.GetNameDef] передало нам технологически превосходящие проекты танков для защиты от внешнего вмешательства.\n\nНа следующий день было подписано дополнительное соглашение о сотрудничестве наших стран в экономической, научной и торговой сферах.\n\nСтоль тесное взаимодействие уже вызвало сильное недовольство в государствах [FRA.GetNameDef] и [ENG.GetNameDef]. Тем не менее они готовы открыто поддержать независимость государства [ROOT.GetNameDef], пока оно придерживается мирного сосуществования с соседями и не угрожает миру и стабильности в Западной Европе."
 belgium.5.a:0 "Приступить к работе над новыми проектами."
 belgium.6.t:0 "[From.GetNameDefCap] отклоняет предложенный нами пакт"
 belgium.6.d:0 "Официальный ответ государства [From.GetNameDef] прибыл в Брюссель в четыре часа утра и после долгих колебаний был передан непосредственно лидеру [ROOT.GetLeader] следующим утром. Вопреки ожиданиям нашего народа правительство государства [From.GetNameDef] поставило под сомнение мотивы государства [ROOT.GetNameDef] и его правительства, поскольку «...танки преимущественно используются в сухопутной войне, а государство [From.GetNameDef] в настоящее время стремится исключительно к миру».\n\nВ правительственных кабинетах воцарилась гробовая тишина, когда лидер [ROOT.GetLeader] открыто поставил под сомнение способность наших дипломатов вести надлежащие переговоры. Однако затем было объявлено решение лидера, и оно заключалось в следующем..."
 belgium.6.a:0 "Приведите ко мне виновного."
 belgium.6.b:0 "Все совершают ошибки."
 belgium.8.t:0 "[From.GetNameDefCap] хочет вступить во фракцию [Root.GetFactionName]"
 belgium.8.d:0 "Осознав, что демократические институты и свободы народа невозможно защитить одной лишь декларацией о нейтралитете, государство [From.GetNameDef] направило нашему правительству официальный запрос на вступление в военный союз, который возглавляет наша страна.\n\nОбстановка на континенте накаляется с каждым днём, а общая вера в волю народа, светское государство и свободу слова сблизила наши нации сильнее, чем когда-либо прежде! Объединение сил ради защиты свободы и справедливости — благородное дело, за которое стоит бороться.\n\nС другой стороны, наши ветераны всё ещё помнят ожесточённые сражения Великой войны, в которую страну втянули [ROOT.GetAdjective] союзники. Каким будет официальный ответ лидера [ROOT.GetLeader]?"
 belgium.8.a:0 "Мы помним наши связи времён Великой войны!"
 belgium.8.b:0 "Это слишком опасно."
 belgium.9.t:0 "[From.GetNameDefCap] соглашается"
 belgium.9.d:0 "В дополнение к Лондонскому договору 1839 года и нашей общей борьбе в Великой войне государство [From.GetNameDef] решило расширить гарантии защиты нашей страны до полномасштабного военного сотрудничества и обмена разведданными, в которых оборона государства [ROOT.GetNameDef] будет играть решающую роль.\n\nПервые [From.GetAdjective] подразделения должны прибыть на нашу территорию через несколько дней, чтобы помочь укрепить оборону страны, а [From.GetAdjective] военные атташе уже обсуждают меры защиты с нашими генералами и полевыми командирами.\n\n[From.GetAdjective] самолёты перебрасываются на наши аэродромы, а [From.GetAdjective] флот готов обеспечить безопасность наших вод."
 belgium.9.a:0 "Мы чрезвычайно рады это слышать!"
 belgium.10.t:0 "[From.GetNameDefCap] отказывается"
 belgium.10.d:0 "Усилия наших политиков, дипломатов и торговцев, похоже, мало что значат. Хотя [From.GetNameDef] Несомненно, они перевооружаются и готовятся к предстоящему военному конфликту, их послы в Брюсселе-Бруксельсе заявили, что \"это не просто так. [From.GetAdjective] материя и [From.GetAdjective] только\".\n\n[From.GetAdjective] Дипломаты также предложили демилитаризовать неопределенную границу и свести наше военное присутствие в регионе к минимуму, чтобы \"деэскалировать ситуацию\".\n\nОни надеются на мир, но все знают, что война - это просто вопрос времени, хочет кто-то этого или нет."
 belgium.10.a:0 "Что?! За кого они нас принимают?"
 belgium.11.t:0 "Начать процесс депилларизации"
 belgium.11.d:0 "В эти неспокойные времена нам не нужно пилларизованное общество. Разрушение общественных «столпов» является важнейшим шагом к укреплению государства."
 belgium.11.a:0 "Начать процесс."
 belgium.12.t:0 "Экономическое предложение"
 belgium.12.d:0 "Государство [BEL.GetNameDefCap] недавно предложило новые экономические соглашения, которые позволят нам снизить производственные издержки."
 belgium.12.a:0 "Принять."
 belgium.12.b:0 "Отказаться."
 belgium.13.t:0 "[From.GetAdjective] правительство соглашается"
 belgium.13.d:0 "Лидер [From.GetLeader] согласился сотрудничать с нами, чтобы снизить издержки и ещё сильнее сблизить наши страны."
 belgium.13.a:0 "Рад это слышать."
 belgium.14.t:0 "[From.GetAdjective] правительство отказывается"
 belgium.14.d:0 "К сожалению, государство [From.GetNameDef] отклонило наше предложение, заявив, что оно «лишит их суверенитета»."
 belgium.14.a:0 "Печальный день для Бенилюкса."
 belgium.15.t:0 "Все принимают экономическое предложение"
 belgium.15.d:0 "Все страны Бенилюкса приняли наше экономическое предложение, и в будущем мы будем становиться лишь ближе друг к другу."
 belgium.15.a:0 "Отличные новости!"
 belgium.22.t:0 "Рабочие бастуют после двойного убийства!"
 belgium.22.d:0 "Убийство двух социалистических активистов в Антверпене фашистами вызвало забастовку портовых докеров, к которой вскоре присоединилась вся страна. Число бастующих достигло 500 000 человек, и промышленность страны остановилась."
 belgium.22.a:0 "Следует пойти на уступки."
 belgium.22.b:0 "Пусть бастуют. При необходимости открыть огонь по толпе."
 belgium.23.t:0 "Поля ван Зеланда обвиняют в растрате!"
 belgium.23.d:0 "Депутат парламента Густаф Сап обвинил премьер-министра в растрате средств во время его работы в Национальном банке. Даже после опровержения ван Зеланда скандал оказал сильнейшее давление на правительство. Пока что трёхпартийная коалиция выдержит этот удар."
 belgium.23.a:0 "Безопаснее будет уйти в отставку."
 belgium.24.t:0 "Политические волнения угрожают правительству!"
 belgium.24.d:0 "Когда угроза рексистов стала казаться менее серьёзной, политическое соперничество вновь усилилось. Министр финансов Анри де Ман попытался объединить левые крылья Католической и Либеральной партий с Социалистической партией, чтобы ввести новый налог для высших слоёв общества. Затем де Ман подал в отставку «по состоянию здоровья». Этот проект вновь пошатнул парламентское большинство. Необходимо сформировать новую коалицию без католиков."
 belgium.24.a:0 "У Поля-Анри Спаака больше поддержки, чем у де Мана."
 belgium.25.t:0 "Назначение врача — фламандского националиста вызывает скандал!"
 belgium.25.d:0 "Король Леопольд III отказался подписывать назначение доктора Адриана Мартенса. Во время Первой мировой войны Мартенс сотрудничал с германскими имперскими войсками, возглавляя Фламандскую академию медицины. Предполагалось, что предложение предварительно одобрил совет министров, однако выяснилось, что этого не произошло и кто-то самовольно внёс его имя в королевский указ. Скандал привёл к отставке всего правительства."
 belgium.25.a:0 "Юбер Пьерло станет следующим форматором."
 belgium.26.t:0 "Король и правительство объединились для защиты страны — Юбер Пьерло утверждён в должности премьер-министра!"
 belgium.26.d:0 "Чтобы справиться с нынешней ситуацией и обеспечить единство страны, правительственная коалиция была расширена и теперь включает все демократические партии страны, а пост премьер-министра занимает Юбер Пьерло."
 belgium.26.a:0 "Будем надеяться, что однажды мы заживём в мире."
 belgium.27.t:0 "Король и правительство объединились для защиты страны — Юбер Пьерло утверждён в должности премьер-министра!"
 belgium.27.d:0 "Чтобы противостоять внезапной агрессии против нашей страны, правительственная коалиция была расширена и теперь включает все демократические партии страны, а пост премьер-министра занимает Юбер Пьерло."
 belgium.27.a:0 "Будем надеяться, что однажды мы заживём в мире."
 belgium.28.t:0 "[BEL.GetAdjective] ультиматум"
 belgium.28.d:0 "[BEL.GetAdjective] революционное правительство хочет навязать нашей стране коммунистический режим."
 belgium.28.a:0 "Принять."
 belgium.28.b:0 "Искать [ENG.GetAdjective] Помогите."
 belgium.28.c:0 "На войну!"
 belgium.38.t:0 "Начинается избирательная кампания 1936 года!"
 belgium.38.d:0 "Рост политической активности ясно показывает, что выборы близки. В конце мая [BEL.GetAdjective] народу предстоит голосование. За кулисами некоторые партии уже обсуждают избирательное соглашение, чтобы после дня выборов сформировать новую коалицию. Сумеют ли новые популистские движения — «Рекс», «Вердинасо» и VNV — отобрать голоса у традиционных партий?"
 belgium.38.a:0 "Мы организуем грандиозный митинг!"
 belgium.39.t:0 "Демократический союз распался!"
 belgium.39.d:0 "Из-за развития политической ситуации в государстве [BEL.GetNameDef] политическое единство в поддержку войны исчезло."
 belgium.39.a:0 "Хорошо."
 belgium.40.t:0 "Жозеф Жакмотт умер!"
 belgium.40.d:0 "Коммунистическая партия Бельгии объявила о внезапной смерти своего лидера Жозефа Жакмотта. Он возглавлял партию более десяти лет. Вскоре руководство партией перейдёт к тройке, состоящей из Жюльена Лао, Ксавье Релекома и Жоржа ван ден Боома."
 belgium.40.a:0 "Релеком — выбор Москвы; он возглавит партию."
 belgium.40.b:0 "Бельгийских коммунистов должен возглавить Жюльен Лао."
 belgium.41.t:0 "Отставка рексистских депутатов приводит к дополнительным выборам. Поль ван Зеланд выступит против Леона Дегреля!"
 belgium.41.d:0 "В ходе политического манёвра, сравнимого с отставкой депутатов POB в 1935 году, все рексистские представители Брюсселя одновременно сложили полномочия, вынудив провести дополнительные выборы. Чтобы противостоять рексистской угрозе, особенно после новости о личном выдвижении Леона Дегреля, Поль ван Зеланд решил баллотироваться против него. Так избирательная кампания превратилась в дуэль. Все остальные партии, включая коммунистов, поддержали премьер-министра. В ответ рексисты назвали ван Зеланда, бывшего банкира во главе консервативной Католической партии, марионеткой красных."
 belgium.41.a:0 "В единстве — сила!"
 belgium.41.b:0 "За чистый режим — голосуйте за Дегреля!"
 belgium.41.c:0 "Великая победа над фашизмом!"
 belgium.42.t:0 "Германские земли, украденные в 1919 году"
 belgium.42.d:0 "После окончания Великой войны даже Бельгия присоединила часть нашей территории. Запланированное наступление в обход линии Мажино станет прекрасной возможностью пересмотреть ещё одну главу Версальского диктата."
 belgium.42.a:0 "Эти земли тоже принадлежат Отечеству!"
 belgium.43.t:0 "Леон Дегрель провозглашает зарю Тиойской империи"
 belgium.43.d:0 "\n\nВ продолжительной речи, восхваляющей ценность нации и её армии, Леон Дегрель объявил, что после завершения объединения с государством [HOL.GetNameDef] для Нижних земель наступила новая эпоха. Чтобы подчеркнуть эту перемену, страна отныне будет называться Тиойской империей. Призывая воскресить дух императора Карла V, он потребовал воссоединить старый «Бургундский округ» в рамках нового политического образования."
 belgium.43.a:0 "Сегодня имперский народ наконец пробудился!"
 belgium.44.t:0 "Йорис ван Северен провозглашает зарю Dietsche Rijk"
 belgium.44.d:0 "\n\nВ продолжительной речи, восхваляющей ценность нации и её армии, Йорис ван Северен объявил, что после завершения объединения с государством [HOL.GetNameDef] для Нижних земель наступила новая эпоха. Чтобы подчеркнуть эту перемену, страна отныне будет называться Dietsche Rijk. Призывая возродить единство нидерландоязычных народов, он потребовал объединить всех наследников Нижних земель в рамках нового политического образования."
 belgium.44.a:0 "Сегодня, спустя столетия, мы наконец по-настоящему едины!"
 belgium.49.t:0 "Йорис ван Северен убит [FRA.GetAdjective] солдатами"
 belgium.49.d:0 "В начале вторжения правительство заключило [BEL.GetAdjective] фашистов под стражу, опасаясь, что они могут сотрудничать с врагом. Политических заключённых вывезли подальше от линии фронта, а затем отправили в государство [FRA.GetNameDef], где их охраняли [FRA.GetAdjective] солдаты.\n\nПрошлой ночью пьяные солдаты, разгневанные капитуляцией [BEL.GetAdjective] армии, убили своих заключённых, лишив жизни одного из важнейших лидеров фламандских фашистов — Йориса ван Северена."
 belgium.49.a:0 "Одна жертва среди тысяч погибших в этой войне."
 belgium.50.t:0 "Йорис ван Северен провозглашает воссоединение всей Фландрии"
 belgium.50.d:0 "Теперь, когда Фландрия вновь объединена, пора закрепить наше завоевание в самом облике края. Лилль отныне будет называться Рейселом, а Дюнкерк вернёт своё первоначальное имя — Дёйнкерке."
 belgium.50.a:0 "Всё для Фландрии, Фландрия — для Христа."
 belgium.50.b:0 "Они забыли фламандский язык — это безнадёжно."
 belgium.51.t:0 "Северная Франция освобождена"
 belgium.51.d:0 "Теперь, когда север вновь свободен, города должны вернуть свои законные названия. Де Голль родился в Лилле, а не в каком-то Ри-йе-зелле."
 belgium.51.a:0 "Франция вновь обретает своё неделимое единство."
 belgium.52.t:0 "Старые FT-17"
 belgium.52.d:0 "В резерве всё ещё находятся 14 танков Renault FT, не использовавшихся годами. Это остатки партии из 49 машин, купленных у Франции после Великой войны, и всем известно, что они давно устарели. Некоторые считают, что их стоит передать национальной жандармерии."
 belgium.52.a:0 "Пока передать их жандармерии."
 belgium.53.t:0 "Артиллерийские запасы"
 belgium.53.d:0 "На наших складах ждут распределения старые 75-мм орудия."
 belgium.53.a:0 "Мы должны передать их дивизиям."
 belgium.54.t:0 "Артиллерийские запасы — [SWE.GetAdjective] орудия"
 belgium.54.d:0 "Купленные в прошлом году горные орудия Bofors были добавлены к запасам старых 75-мм пушек и теперь ожидают распределения на наших складах."
 belgium.54.a:0 "Мы должны передать их дивизиям."
 belgium.55.t:0 "Юбер Пьерло подал в отставку"
 belgium.55.d:0 "Устав от долгих лет войны, Юбер Пьерло решил подать в отставку. Ашиль ван Аккер возглавит почти такое же правительство."
 belgium.55.a:0 "Обычная передача власти."
 belgium.56.t:0 "Поставки урана из Катанги прекращены"
 belgium.56.d:0 "Поскольку государство [BEL.GetNameDef] утратило контроль над Катангой или наше сотрудничество с [BEL.GetAdjective] правительством прекратилось, мы больше не имеем доступа к драгоценному урану Катанги. Это значительно осложнит наши исследования физических свойств урана и его многообещающего потенциала."
 belgium.56.a:0 "Придётся продолжать без него."
 belgium.57.t:0 "Получена партия урана из Катанги"
 belgium.57.d:0 "Благодаря сотрудничеству с [BEL.GetAdjective] правительством, контролирующим урановые рудники Катанги, мы получили партию этого драгоценного минерала."
 belgium.57.a:0 "Нужно попытаться раскрыть его потенциал."
 belgium.58.t:0 "Ксавье Релеком арестован"
 belgium.58.d:0 "Лидер Коммунистической партии Бельгии был арестован [GER.GetAdjective] войсками и заключён под стражу в форте Бреендонк."
 belgium.58.a:0 "Ещё одна жертва фашизма."
 belgium.59.t:0 "Жюльен Лао арестован"
 belgium.59.d:0 "Лидер Коммунистической партии Бельгии был арестован [GER.GetAdjective] войсками и заключён под стражу в форте Бреендонк."
 belgium.59.a:0 "Ещё одна жертва фашизма."
 belgium.60.t:0 "Александр Галопен убит"
 belgium.60.d:0 "Сегодня фламандские фашисты из группировки «De Vlag» («Флаг») убили директора «Société Générale de Belgique» — одной из крупнейших бельгийских компаний, игравшей важнейшую роль в экономике страны во время оккупации. Убийство организовал Роберт Ян Вербелен, один из самых влиятельных членов этой организации."
 belgium.60.a:0 "Ещё одна жертва фашизма."
 belgium.61.t:0 "Наконец-то мир!"
 belgium.61.d:0 "С возвращением мира правительство национального единства может сосредоточиться на будущих вызовах."
 belgium.61.a:0 "Будем надеяться, что мир продлится долго."
 belgium.62.t:0 "Леопольд III сдаётся"
 belgium.62.d:0 "После капитуляции король Леопольд III сдался вражеским войскам и теперь содержится под стражей в Лакенском дворце на севере Брюсселя. Тем временем правительство отмежевалось от решения короля и постановило продолжать войну, пока тот неспособен царствовать."
 belgium.62.a:0 "Страна должна быть освобождена."
 belgium.63.t:0 "Карл становится принцем-регентом"
 belgium.63.d:0 "Пока король не может царствовать, его младший брат Карл принимает на себя обязанности принца-регента. Он выразил готовность сотрудничать с правительством ради восстановления нормальной работы государственных институтов."
 belgium.63.a:0 "«Клянусь соблюдать Конституцию...»"
 belgium.64.t:0 "Демократический союз разрушен!"
 belgium.64.d:0 "Из-за развития политической ситуации в Бельгии политическое единство в поддержку войны исчезло."
 belgium.64.a:0 "Нас ждёт новый порядок!"
 belgium.64.b:0 "Рабочая революция торжествует!"
 belgium.64.c:0 "Радикальная оппозиция растёт с каждым днём."
 belgium.65.t:0 "Консерваторы обеспечили себе большинство в правительстве!"
 belgium.65.d:0 "Благодаря росту их влияния в политических кругах социалистическое правительство пало, и следующее валлонское правительство возглавят консерваторы."
 belgium.65.a:0 "Маё — священник и истинный валлонский активист."
 belgium.65.b:0 "Нам следует положиться на опытного политика вроде Пьерло."
 belgium.66.t:0 "Ограниченная колониальная автономия в [COG.GetNameDef]"
 belgium.66.d:0 "с ограниченной автономией в [COG.GetNameDef]Генерал-губернатор [COG.GetLeader] были наделены новыми полномочиями. Рекомендовано DLC «Вместе за победу»."
 belgium.66.a:0 "Держите [COG.GetNameDef] под [BEL.GetAdjective] Контроль."
 belgium.66.b:0 "Труд и прогресс!"
 belgium.67.t:0 "[COG.GetNameDefCap] профинансировало истребители"
 belgium.67.d:0 "[COG.GetNameDefCap] Собрали средства на финансирование строительства дополнительных истребителей для [BEL.GetAdjective] Пилоты, находящиеся на службе в ВВС."
 belgium.67.a:0 "Вместе мы победим!"
 belgium.67.b:0 "Только вместе мы сможем победить!"
 belgium.70.t:0 "Начало кампании «V»"
 belgium.70.d:0 "Во время трансляции Радио Бельгия, сегмент радиовещания Бельгии, посвященный [BEL.GetAdjective] Виктор де Лавели объявил, что каждый человек, недовольный оккупацией, должен выбрать букву V в качестве символа сопротивления. Это письмо было выбрано потому, что оно является первой буквой как Виктуара (Победа), так и Вриджхейда (Свобода), символа единства для всех свободных людей. [BEL.GetAdjective]s.[ENG.GetNameDefCap] Может быть заинтересован в продвижении партизанской деятельности по всей Европе."
 belgium.70.a:0 "V — значит победа!"
 belgium.70.b:0 "Мы раздавим террористов!"
 belgium.70.c:0 "Эта война с каждым днём становится всё жесточе."
 belgium.71.t:0 "Кампания «V» помогает партизанам"
 belgium.71.d:0 "По мере распространения поддержки кампании «V» на улицах наших городов появляется всё больше изображений этой буквы. Эти символы, замечаемые утром и быстро стираемые, напоминают населению, что оккупация — не судьба и наши враги будут побеждены."
 belgium.71.a:0 "V — значит победа!"
 belgium.72.t:0 "[COG.GetNameDefCap] стремится вступить в Коминтерн"
 belgium.72.d:0 "[COG.GetNameDefCap] Он обратился к нам с просьбой присоединиться к Коминтерну."
 belgium.72.a:0 "Ещё одна страна присоединяется к революции."
 belgium.72.b:0 "Отклонить их просьбу."
 belgium.73.t:0 "[COG.GetNameDefCap] стремится вступить в Союз народов Африки"
 belgium.73.d:0 "[COG.GetNameDefCap] Он обратился к нам с просьбой о вступлении в Союз африканского народа."
 belgium.73.a:0 "Ещё одна страна присоединяется к революции."
 belgium.73.b:0 "Отклонить их просьбу."
 belgium.74.t:0 "[COG.GetNameDefCap] стремится вступить во фракцию [Root.GetFactionName]"
 belgium.74.d:0 "[COG.GetNameDefCap]В настоящее время независимо от [BEL.GetNameDef]стремится присоединиться к [Root.GetFactionName] Помочь установить новый мировой порядок."
 belgium.74.a:0 "Ещё одна страна присоединяется к революции."
 belgium.74.b:0 "Отклонить их просьбу."
 belgium.74-2.a:0 "Ещё одна страна присоединяется к революции."
 belgium.74-2.b:0 "Отклонить их просьбу."
 belgium.75.t:0 "[BEL.GetAdjective] союз?"
 belgium.75.d:0 "[BEL.GetNameDefCap] Он предложил создать военный союз для защиты революции от ее врагов. Москва далеко, и нам нужно координировать между собой."
 belgium.75.a:0 "Разумеется!"
 belgium.75.b:0 "Отклонить их просьбу."
 belgium.76.t:0 "[BEL.GetNameDefCap] и [FRA.GetNameDef] договариваются о взаимной военной помощи"
 belgium.76.d:0 "\n\nДве коммунистические державы Запада сблизились, объявив о подписании договора о взаимной военной помощи, призванного гарантировать их безопасность. Новый союз, заключённый вчера утром в брюссельской ратуше, уже получил название «Брюссельский пакт» и может привлечь другие коммунистические державы, не желающие равняться на беспощадный [SOV.GetAdjective] режим."
 belgium.76.a:0 "Мы станем маяками революции."
 belgium.76.b:0 "Ещё одна угроза существующему порядку."
 belgium.76.c:0 "Дипломатия меняется так же быстро, как политика."
 belgium.77.t:0 "[FRA.GetAdjective]-[BEL.GetAdjective] переговоры об обороне провалились"
 belgium.77.d:0 "Хотя [FRA.GetAdjective] и [BEL.GetAdjective] дипломаты обсуждали соглашение о взаимной обороне, переговоры, похоже, закончились лишь крупным недоразумением. Две страны не смогли сблизить позиции и прийти к соглашению."
 belgium.77.a:0 "Мы были так близки к историческому соглашению!"
 belgium.77.b:0 "Этот союз не выглядит угрозой."
 belgium.77.c:0 "Пока они ссорятся между собой..."
 belgium.78.t:0 "[BEL.GetNameDefCap] влияет на нашу политику"
 belgium.78.d:0 "Недавно мы заметили, что государство [BEL.GetNameDef] пытается повлиять на наше население и некоторых политиков."
 belgium.78.a:0 "Поддержка всегда приветствуется."
 belgium.78.b:0 "Как они смеют!"
 belgium.79.t:0 "Возвращение Троцкого влияет на [BEL.GetAdjective] коммунистов"
 belgium.79.d:0 "С тех пор как Лев Троцкий вернулся к власти в государстве [SOV.GetNameDef], в [Root.GetAdjective] Коммунистической партии не утихают споры. Ранее оттеснённые на обочину троцкисты хотят заменить прежних лидеров партии, которые после падения Сталина остались без внешней поддержки."
 belgium.79.a:0 "Один коммунист сменяет другого — какая разница?"
 belgium.79.b:0 "У нас нет выбора, кроме как провести самокритику."
 belgium.79.c:0 "Мы примем даугизм — разновидность троцкизма."
 belgium.79.e:0 "Мы не откажемся от пути Сталина!"
 belgium.80.t:0 "Возвращение Троцкого влияет на [ROOT.GetAdjective] коммунистов"
 belgium.81.t:0 "Стаф Деклерк умер!"
 belgium.81.d:0 "Сообщения подтверждают, что прошлой ночью Стаф Деклерк скончался от внезапного сердечного приступа. Фламандские националисты оплакивают его как лидера движения за независимость Фландрии, выступавшего за создание фашистского фламандского государства. Он даже представлял себе великое нидерландское государство, объединяющее Французскую Фландрию, Фландрию и Нидерланды."
 belgium.81.a:0 "De Leider мёртв! Его никогда не забудут!"
 belgium.81.b:0 "Скатертью дорога!"
 belgium.84.t:0 "[COG.GetNameDefCap] влияет на нашу политику"
 belgium.84.d:0 "Недавно мы заметили, что государство [COG.GetNameDef] пытается повлиять на наше население и некоторых политиков."
 belgium.84.a:0 "Поддержка всегда приветствуется."
 belgium.84.b:0 "Как они смеют!"
 belgium.85.t:0 "Судьба короля"
 belgium.85.d:0 "Теперь, когда власть наконец находится в наших руках, необходимо решить, что делать с королём. Фанатики утверждают, что его должна постигнуть та же участь, что и российского Николая II; другие считают, что его следует заключить в тюрьму за подавление беспорядков несколькими годами ранее. Наконец, третья группа заявляет, что теперь он бессилен и ему следует позволить отправиться в изгнание."
 belgium.85.a:0 "Готовьте расстрельную команду!"
 belgium.85.b:0 "Угнетателей пролетариата следует заключить в тюрьму!"
 belgium.85.c:0 "Посадите этого ничтожного шута на корабль."
 belgium.86.t:0 "Возвращение Троцкого влияет на фламандских коммунистов"
 belgium.87.t:0 "Капитуляция Леопольда III"
 belgium.87.d:0 "После капитуляции [BEL.GetAdjective] армии их король сдался нам и теперь является нашим пленником."
 belgium.87.a:0 "Ценный заложник."
 belgium.88.t:0 "Король бельгийцев освобождён"
 belgium.88.d:0 "Леопольд III, король бельгийцев, был освобождён вражескими силами и больше не является нашим гостем."
 belgium.88.a:0 "У нас есть и другие заботы."
 belgium.89.t:0 "Возвращение короля?"
 belgium.89.d:0 "После освобождения Леопольда III нам необходимо решить вопрос о его возможном возвращении. Самым очевидным решением было бы призвать его обратно, однако брак с любовницей и отказ последовать за правительством в изгнание вызвали недовольство среди населения, и многие не желают его возвращения."
 belgium.89.a:0 "Пока он останется за границей."
 belgium.89.b:0 "Организовать его возвращение."
 belgium.90.t:0 "Монархия восстановлена!"
 belgium.90.d:0 "В результате успеха антикоммунистических сил король бельгийцев Леопольд III был освобождён из заключения и вновь обретёт королевскую власть. Чтобы сделать это надлежащим образом, он повторно принесёт перед новым парламентом присягу защищать свободы и законы [BEL.GetAdjective] народа."
 belgium.90.a:0 "За короля, закон и свободу! За монарха, свободу и справедливость!"
 belgium.90.b:0 "Бог хранит свободную Бельгию и её короля!"
 belgium.91.t:0 "Король бельгийцев освобождён и вновь возведён на престол!"
 belgium.91.d:0 "\nВ результате успеха антикоммунистических сил король бельгийцев Леопольд III был освобождён из камеры, которую в частной беседе назвал «сырой соломой тюрьмы Сен-Леонар». Он торжественно въехал в столицу по улицам, заполненным людьми, желавшими увидеть возвращение монарха. Однако шествие оказалось недолгим из-за опасений, что сторонники коммунистов могут попытаться его убить. Затем новый парламент приветствовал короля после того, как тот повторно принёс присягу защищать законы страны."
 belgium.91.a:0 "Любопытно!"
 belgium.91.b:0 "За короля, закон и свободу! За монарха, свободу и справедливость!"
 belgium.92.t:0 "Возвращение короля!"
 belgium.92.d:0 "После уничтожения коммунистической тирании монархия и свобода нашего народа были восстановлены!"
 belgium.92.a:0 "За короля, закон и свободу! За монарха, свободу и справедливость!"
 belgium.92.b:0 "Бог хранит свободную Бельгию и её короля!"
 belgium.93.t:0 "Король бельгийцев возвращается в страну и вновь занимает престол!"
 belgium.93.d:0 "\nВ результате успеха антикоммунистических сил король бельгийцев Леопольд III вернулся из изгнания. Он торжественно въехал в столицу по улицам, заполненным людьми, желавшими увидеть восстановленного монарха. Однако шествие оказалось сравнительно коротким из-за строжайших мер безопасности. Хотя впервые после смерти Альберта I король участвовал в параде верхом, из-за опасений покушения со стороны коммунистов ему пришлось продолжить путь в бронированном автомобиле. Новый парламент приветствовал его после того, как он вновь поклялся защищать законы и свободы [BEL.GetAdjective] народа."
 belgium.93.a:0 "Любопытно!"
 belgium.93.b:0 "За короля, закон и свободу! За монарха, свободу и справедливость!"
 belgium.94.t:0 "Король бельгийцев отправлен в изгнание!"
 belgium.94.d:0 "Избежав пленения во время захвата королевского дворца коммунистическими революционерами, Леопольд III, король бельгийцев, получил от нового правительства приказ отречься от престола и навсегда покинуть Бельгию. Для короля это печальный день, знаменующий его неспособность сдержать коммунизм в собственной стране, и, возможно, он в последний раз ступает на [BEL.GetAdjective] землю.\nТем временем революционеры приняли первые меры для начала коллективизации."
 belgium.94.a:0 "Ещё один тиран изгнан!"
 belgium.94.b:0 "Несомненно, перемены к худшему."
 belgium.95.t:0 "Король бельгийцев заключён революционерами в тюрьму!"
 belgium.95.d:0 "\nЗахваченный во время коммунистического переворота Леопольд III, король бельгийцев, был отправлен в тюрьму. Революционный комитет уже объявил, что его будут судить за угнетение пролетариата. Этот знаменитый заключённый — лишь один из множества политических узников, арестованных в первые часы после захвата власти коммунистами. Те, кто смог и был вовремя предупреждён, покинули страну. Похоже, некоторые уже обсуждают создание освободительного комитета для подрыва нового [BEL.GetADjective] коммунистического режима."
 belgium.95.a:0 "Ещё один тиран ответит за свои преступления!"
 belgium.95.b:0 "Эти коммунисты действительно вызывают тревогу."
 belgium.96.t:0 "Король бельгийцев казнён революционерами!"
 belgium.96.d:0 "\nКорреспонденты, освещающие события в государстве [BEL.GetNameDef], сообщили, что король Леопольд III был захвачен революционерами и вскоре казнён. Эта новость потрясла традиционалистов. Кардинал ван Руй, едва избежавший ареста, уже объявил Леопольда мучеником христианской веры и заявил, что обратится к Папе с просьбой о его беатификации.\n\nЭта казнь показывает решимость революционеров, готовых, подобно большевикам до них, прибегать к убийствам ради достижения своих целей и воплощения социалистической утопии."
 belgium.96.a:0 "Этот тиран больше не будет угнетать пролетариат!"
 belgium.96.b:0 "Ещё одно свидетельство коммунистического варварства."
 belgium.97.t:0 "Низкие страны открыли переговоры о взаимном оборонном сотрудничестве"
 belgium.97.d:0 "\nМинистры иностранных дел и обороны [BEL.GetNameDef], [HOL.GetNameDef]и [LUX.GetNameDef] Они объявили, что начали переговоры о расширении сотрудничества. Хотя ранее они отменили таможенные пошлины и уменьшили другие торговые ограничения, этот новый региональный саммит попытается выработать соглашение о расширении нашего партнерства на военном уровне.\n\nЕсли переговоры увенчаются успехом, любой акт агрессии против страны Бенилюкса будет считаться нападением на любую другую страну предлагаемого альянса."
 belgium.97.a:0 "Мы надеемся сохранить нейтралитет вместе."
 belgium.97.b:0 "Интересное развитие событий."
 belgium.98.t:0 "Трёхсторонние переговоры Нижних земель провалились!"
 belgium.98.d:0 "\nСегодня [BEL.GetAdjective] министр иностранных дел объявил, что трёхсторонний комитет, призванный заложить основы соглашения о взаимной обороне между государствами [BEL.GetNameDef], [HOL.GetNameDef] и [LUX.GetNameDef], потерпел неудачу, поскольку делегации не смогли договориться об общей стратегии. Теперь, когда военное сотрудничество выглядит невозможным, трём странам, вероятно, вскоре придётся рассчитывать лишь на себя и искать новых партнёров."
 belgium.98.a:0 "В любом случае виноваты они."
 belgium.98.b:0 "Так ли это важно?"
 belgium.101.t:0 "Конкурс истребителей"
 belgium.101.desc:0 "Недавнее исследование современной воздушной войны выявило критический недостаток наших ВВС: истребители серьёзно отстают от разработок других стран. Министерство авиации начало срочную программу приобретения современного истребителя в кратчайшие сроки. Поскольку отечественная разработка заняла бы недопустимо много времени, было решено купить лицензию за рубежом. На это выделен дополнительный бюджет.\n\nЭксперты расходятся во мнениях относительно того, какой тип самолёта лучше всего подойдёт для модернизации наших истребительных авиакрыльев."
 belgium.101.a:0 "Лёгкий перехватчик будет построен компанией Avions Fairey."
 belgium.101.b:0 "Крупный тяжёлый истребитель будет построен компанией SABCA."
 belgium.102.t:0 "Конкурс лёгких истребителей"
 belgium.102.desc_light_fighter:0 "Министерство обороны ищет новый лёгкий истребитель, который позволит защитить наше воздушное пространство. Министерство иностранных дел не возражает против проекта, но предлагает учитывать при выборе страны-поставщика также политические и дипломатические соображения."
 belgium.102.desc_light_fighter_refused:0 "Сославшись на соображения национальной безопасности, [From.GetAdjective] правительство отказалось предоставить производственную лицензию. Возможно, в другой стране нам повезёт больше, либо в качестве временной меры можно попытаться модернизировать имеющиеся самолёты."
 belgium.102.a:0 "Обратиться к государству [GER.GetNameDef]"
 belgium.102.b:0 "Обратиться к государству [ITA.GetNameDef]"
 belgium.102.c:0 "Обратиться к государству [FRA.GetNameDef]"
 belgium.102.d:0 "Обратиться к государству [ENG.GetNameDef]"
 belgium.102.e:0 "Обратиться к государству [USA.GetNameDef]"
 belgium.102.f:0 "Использовать опыт конкурса для улучшения собственных самолётов."
 belgium.103.t:0 "Конкурс тяжёлых истребителей"
 belgium.103.a:0 "Отдать предпочтение [GER.GetAdjective] проектам"
 belgium.103.b:0 "Выбрать [ITA.GetAdjective] самолёты"
 belgium.103.c:0 "Положиться на [FRA.GetAdjective] специалистов"
 belgium.103.d:0 "Купить [ENG.GetAdjective] самолёты"
 belgium.103.e:0 "Скопировать [USA.GetAdjective] модели"
 belgium.103.desc_heavy_fighter:0 "Министерство авиации стремится приобрести новый тяжёлый истребитель для дальнего перехвата и сопровождения бомбардировщиков. Однако Министерство иностранных дел предлагает учитывать при выборе страны-поставщика также политические и дипломатические соображения."
 belgium.103.desc_heavy_fighter_refused:0 "Сославшись на соображения национальной безопасности, [From.GetAdjective] правительство отказалось предоставить производственную лицензию. Возможно, в другой стране нам повезёт больше, либо в качестве временной меры можно попытаться модернизировать имеющиеся самолёты."
 belgium.104.t:0 "[From.GetAdjective] конкурс истребителей"
 belgium.104.desc:0 "[From.GetAdjective] ВВС в настоящее время проводят испытания нового лёгкого истребителя. По словам нашего авиационного атташе, последняя модель нашей страны имеет все шансы победить. В ближайшее время ожидается официальный запрос от [From.GetAdjective] правительства. \n\nПредставители производителя решительно поддерживают продажу, однако существуют опасения за национальную безопасность, связанные с передачей самой современной техники иностранному государству. Следует ли разрешить эту сделку?"
 belgium.104.a:0 "Безусловно."
 belgium.104.b:0 "Мы не можем рисковать утечкой данных."
 belgium.105.t:0 "Конкурс тяжёлых истребителей"
 belgium.105.a:0 "Согласиться участвовать."
 belgium.105.b:0 "Не в этот раз!"
 belgium.105.desc:0 "[From.GetAdjective] ВВС в настоящее время проводят испытания нового тяжёлого истребителя. По словам нашего авиационного атташе, последняя модель нашей страны имеет все шансы победить. В ближайшее время ожидается официальный запрос от [From.GetAdjective] правительства. \n\nПредставители производителя решительно поддерживают продажу, однако существуют опасения за национальную безопасность, связанные с передачей самой современной техники иностранному государству. Следует ли разрешить эту сделку?"
 belgium.106.t:0 "Конкурс истребителей завершён"
 belgium.106.desc:0 "После переговоров с производителем и государственными чиновниками нам удалось получить лицензию на производство нового истребителя. Один образец самолёта уже прибыл для обучения механиков техническому обслуживанию, а полный комплект чертежей и схем ожидается в ближайшее время. Производство можно начинать в любой момент."
 belgium.106.a:0 "Отлично."
 belgium.107.t:0 "Конкурс бомбардировщиков"
 belgium.107.desc:0 "Исследование Министерства авиации показало, что наши ВВС плохо приспособлены для поддержки армии. Дальние воздушные удары и непосредственная авиационная поддержка признаны ключевыми областями, в которых мы испытываем критический недостаток. Правительство выделило средства на срочную программу приобретения современного бомбардировщика, но нам необходимо решить, какой самолёт закупить."
 belgium.107.a:0 "Небольшой бомбардировщик для непосредственной поддержки."
 belgium.107.b:0 "Более крупный самолёт с увеличенной дальностью."
 belgium.108.t:0 "Конкурс лёгких бомбардировщиков"
 belgium.108.desc_cas:0 "Министерство авиации стремится приобрести новый лёгкий бомбардировщик для непосредственной поддержки сухопутных войск, однако Министерство иностранных дел предлагает учитывать при выборе страны-поставщика также политические и дипломатические соображения."
 belgium.108.desc_cas_refused:0 "Сославшись на соображения национальной безопасности, [From.GetAdjective] правительство отказалось предоставить производственную лицензию. Возможно, в другой стране нам повезёт больше, либо в качестве временной меры можно попытаться модернизировать имеющиеся самолёты."
 belgium.108.a:0 "Обратиться к государству [GER.GetNameDef]."
 belgium.108.b:0 "Обратиться к государству [ITA.GetNameDef]."
 belgium.108.c:0 "Обратиться к государству [FRA.GetNameDef]."
 belgium.108.d:0 "Обратиться к государству [ENG.GetNameDef]."
 belgium.108.e:0 "Обратиться к государству [USA.GetNameDef]."
 belgium.109.t:0 "Конкурс средних бомбардировщиков"
 belgium.109.desc_tac:0 "Министерство авиации стремится приобрести новый средний бомбардировщик для дальнего перехвата коммуникаций и тактических воздушных ударов, однако Министерство иностранных дел предлагает учитывать при выборе страны-поставщика также политические и дипломатические соображения."
 belgium.109.desc_tac_refused:0 "Сославшись на соображения национальной безопасности, [From.GetAdjective] правительство отказалось предоставить производственную лицензию. Возможно, в другой стране нам повезёт больше, либо в качестве временной меры можно попытаться модернизировать имеющиеся самолёты."
 belgium.109.a:0 "Обратиться к государству [GER.GetNameDef]."
 belgium.109.b:0 "Обратиться к государству [ITA.GetNameDef]."
 belgium.109.c:0 "Обратиться к государству [FRA.GetNameDef]."
 belgium.109.d:0 "Обратиться к государству [ENG.GetNameDef]."
 belgium.109.e:0 "Обратиться к государству [USA.GetNameDef]"
 belgium.109.f:0 "Поддержать отечественных авиаконструкторов"
 belgium.110.t:0 "[From.GetAdjective] конкурс бомбардировщиков"
 belgium.110.desc:0 "[From.GetAdjective] ВВС в настоящее время проводят испытания нового лёгкого бомбардировщика. По словам нашего авиационного атташе, последняя модель нашей страны имеет все шансы победить. В ближайшее время ожидается официальный запрос от [From.GetAdjective] правительства.\n\nПредставители производителя решительно поддерживают продажу, однако существуют опасения за национальную безопасность, связанные с передачей самой современной техники иностранному государству. Следует ли разрешить эту сделку?"
 belgium.110.a:0 "Покажем им наши проекты."
 belgium.110.b:0 "Нас это не интересует."
 belgium.111.t:0 "[From.GetAdjective] конкурс бомбардировщиков"
 belgium.111.desc:0 "[From.GetAdjective] ВВС в настоящее время проводят испытания нового среднего бомбардировщика. По словам нашего авиационного атташе, последняя модель нашей страны имеет все шансы победить. В ближайшее время ожидается официальный запрос от [From.GetAdjective] правительства.\n\nПредставители производителя решительно поддерживают продажу, однако существуют опасения за национальную безопасность, связанные с передачей самой современной техники иностранному государству. Следует ли разрешить эту сделку?"
 belgium.111.a:0 "Покажем им наши проекты."
 belgium.111.b:0 "Нас это не интересует."
 belgium.112.t:0 "Конкурс бомбардировщиков завершён"
 belgium.112.desc:0 "После переговоров с производителем и государственными чиновниками нам удалось получить лицензию на производство нового бомбардировщика. Мы получили один образец самолёта для обучения механиков техническому обслуживанию, а полный комплект чертежей и схем ожидается в ближайшее время. Производство можно начинать в любой момент."
 belgium.112.a:0 "Отлично."
 belgium.113.t:0 "[BEL.GetNameDefCap] хочет совместно разработать лёгкий бомбардировщик"
 belgium.113.desc:0 "Государство [BEL.GetNameDefCap] предложило обмен знаниями, который позволит SABCA разработать лёгкий бомбардировщик совместно с Caproni. Мы сможем получить ценный опыт, а [BEL.GetAdjective] сторона — современный самолёт непосредственной авиационной поддержки."
 belgium.113.a:0 "Мы ничего не теряем."
 belgium.113.b:0 "Мы предпочитаем самодостаточность."
 belgium.114.t:0 "[ITA.GetNameDefCap] принимает наше соглашение о совместной разработке"
 belgium.114.desc:0 "[ITA.GetAdjective] правительство разрешило сотрудничество SABCA и Caproni по созданию нового самолёта для [BEL.GetAdjective] армии."
 belgium.114.a:0 "Отличные новости."
 belgium.117.t:0 "[BEL.GetNameDefCap] отказывается от [FRA.GetAdjective] защиты"
 belgium.117.desc:0 "\nПосле жарких дебатов [BEL.GetAdjective] правительство решило придерживаться строгого нейтралитета и одинаково защищать все границы. Это решение было принято отчасти благодаря поддержке фламандских националистов, считавших гарантии и [FRA.GetAdjective] влияние на армию возмутительным вмешательством иностранного государства во внутренние дела страны."
 belgium.117.a:0 "Это их решение."
 belgium.117.b:0 "Это их решение."
 belgium.117.c:0 "Любопытно."
 belgium.118.t:0 "Фламандские представители требуют полного нейтралитета"
 belgium.118.desc:0 "«Больше никакого [FRA.GetAdjective] вмешательства!» Этот и другие лозунги стали новым девизом фламандских националистов, требующих отказаться от [FRA.GetAdjective] защиты и перейти к политике строгого нейтралитета. Этот курс, полностью разрывающий с дипломатическим положением Бельгии последних восемнадцати лет, якобы обеспечит безопасность, поскольку тесные отношения с государством [FRA.GetNameDef] лишь подтолкнут к повторению плана Шлиффена в случае нового [FRA.GetAdjective]-[GER.GetAdjective] конфликта. Однако эту позицию поддерживают не только фламандские националисты: она нашла сторонников и среди видных франкоязычных политиков, таких как Поль-Анри Спаак. По слухам из королевского дворца, сам король также поддерживает подобное решение."
 belgium.118.a:0 "Принять их требования."
 belgium.118.b:0 "Мы не подчинимся их воле."
 belgium.119.t:0 "Поль-Анри Спаак выдвигает ультиматум"
 belgium.119.desc:0 "Поль-Анри Спаак, один из ведущих политиков-социалистов, пригрозил уйти в отставку вместе с другими министрами-социалистами, если политика нейтралитета не будет введена в кратчайшие сроки. Если социалисты покинут правительство, трёхпартийная коалиция, составлявшая основу [BEL.GetAdjective] политики после последних парламентских выборов, распадётся. Логичным исходом станет формирование совместного правительства католиками и либералами с целью укрепления отношений с государствами [FRA.GetNameDef] и [ENG.GetNameDef]."
 belgium.119.a:0 "Согласиться с ультиматумом Спаака."
 belgium.119.b:0 "Мы сформируем правительство без них."
 belgium.120.t:0 "Вступить во Французскую Антанту?"
 belgium.120.desc:0 "The [FRA.GetAdjective] Приверженность защите других стран Европы кажется ясной и твердой. Они сформировали так называемую Антанту, чтобы защитить континент от угрозы тиранов. В силу нашей позиции и нашего явного про-[FRA.GetAdjective] Было бы естественно присоединиться к этому альянсу, чтобы обеспечить нашу безопасность. Единственной жизнеспособной альтернативой было бы установление прочной связи с [ENG.GetNameDef]Со временем мы сможем оказать конкретную поддержку нашей стратегии."
 belgium.120.a:0 "Но нашей песней всё равно не станет «Марсельеза»."
 belgium.120.b:0 "Вместо этого укрепим дипломатические связи с государством [ENG.GetNameDef]."
 belgium.121.t:0 "Коммунистические боевики срывают фашистский митинг"
 belgium.121.desc:0 "Прошлой ночью фашистский митинг был сорван насильственными действиями сторонников коммунистов, которые бросали камни и вступали в драки, пытаясь помешать собранию. Фашисты ответили тем же, что привело к крайне напряжённой ситуации, которую полиция старалась урегулировать как можно осторожнее."
 belgium.121.a:0 "Необходимая мера, чтобы остановить фашистов."
 belgium.121.b:0 "Вмешаться и прекратить насилие."
 belgium.122.t:0 "Коммунисты организуют массовые забастовки"
 belgium.122.desc:0 "Чтобы продемонстрировать своё влияние среди низших слоёв общества, Коммунистическая партия организовала масштабную, но, будем надеяться, недолгую забастовку по всей стране. Они называют это движение победой и подчёркивают раскол между коммунистами и демократическими партиями."
 belgium.122.a:0 "Пролетарии всех стран, соединяйтесь!"
 belgium.122.b:0 "Проклятые коммунисты!"
 belgium.122.c:0 "Хватит. Вводите войска!"
 belgium.123.t:0 "Коммунисты организуют поход на Брюссель"
 belgium.123.desc:0 "Коммунистическая партия Бельгии организовала поход на Брюссель против «голода» и в поддержку «социальной справедливости». Сторонники коммунистов требуют реформ в интересах рабочих и называют акцию необходимым протестом в защиту трудящихся, однако власти опасаются, что демонстрация перерастёт в беспорядки, направленные против демократических институтов."
 belgium.123.a:0 "Проклятые коммунисты!"
 belgium.123.b:0 "Хватит. Вводите войска!"
 belgium.124.t:0 "Ксавье Релеком арестован!"
 belgium.124.desc:0 "В ходе подавления забастовки, организованной Коммунистической партией, прошлой ночью был арестован один из её главных руководителей — Ксавье Релеком. Сейчас он находится под стражей, пока расследуется его причастность к происходящему."
 belgium.124.a:0 "Полиция выполняет свою работу."
 belgium.125.t:0 "Успешный митинг рексистов"
 belgium.125.desc:0 "Прошлой ночью лидер «Рекса» Леон Дегрель собрал полный зал сторонников и произнёс длинную речь о коррумпированности государственных институтов и разложении национального духа."
 belgium.125.a:0 "«Рекс победит», — говорят они..."
 belgium.126.t:0 "Массовый митинг рексистов"
 belgium.126.desc:0 "Вчера днём Леон Дегрель провёл крупный митинг под открытым небом. Он прибыл в чёрном кабриолете и проехал вдоль строя рексистской милиции, принимая парад. Затем он произнёс длинную речь, обрушившись на парламентскую систему и слабость демократических представителей. Эта впечатляющая демонстрация силы должна была показать решимость сторонников поддерживать движение. В то же время для нефашистской части населения она выглядела как огромный военный парад и прямая угроза демократии."
 belgium.126.a:0 "Наша поднятая рука — знак готовности служить отечеству."
 belgium.126.b:0 "Хватит. Вводите войска!"
 belgium.127.t:0 "Массовый митинг «Вердинасо»"
 belgium.127.desc:0 "Вчера Йорис ван Северен продемонстрировал силу своего движения, собрав на массовом митинге многочисленную и хорошо организованную толпу. В своей речи он осудил нынешний политический строй как коррумпированную и неэффективную систему, разрушающую нацию."
 belgium.127.a:0 "Это движение растёт с каждым днём."
 belgium.127.b:0 "Хватит. Вводите войска!"
 belgium.128.t:0 "Крупные беспорядки между фашистами и антифашистами"
 belgium.128.desc:0 "Группа организованных фашистских громил неоднократно нападала на сторонников антифашистов, протестовавших против их последнего митинга. Вскоре столкновения переросли в массовые беспорядки, в ходе которых была повреждена инфраструктура и пострадало множество участников... а также несколько несчастных, случайно оказавшихся между ними."
 belgium.128.a:0 "Политическое насилие — не выход."
 belgium.128.b:0 "Вмешаться как можно скорее и прекратить беспорядки."
 belgium.129.t:0 "Леон Дегрель арестован после последнего митинга"
 belgium.129.desc:0 "Из-за беспорядков, произошедших после последнего фашистского митинга, полиция арестовала Леона Дегреля, чтобы расследовать его ответственность за недавние столкновения."
 belgium.129.a:0 "Полиция выполняет свою работу."
 belgium.130.t:0 "Часть населения опасается фашизма"
 belgium.130.desc:0 "Похоже, последний фашистский митинг дал обратный эффект: эта демонстрация силы убедила часть населения в необходимости защищать демократию."
 belgium.130.a:0 "Кто сможет их осудить?"
 belgium.131.t:0 "Фашистская пятая колонна"
 belgium.131.desc:0 "The [GER.GetAdjective] Агрессия вынуждает нас арестовывать потенциальных сочувствующих внутри страны. По словам властей, Леон Дегрель официально заявил, что они не поддерживают...[GER.GetAdjective]Риск был слишком велик, чтобы его игнорировать. Следовательно, известные националистические деятели, профсоюзные деятели и сепаратисты, такие как Август Бормс, Леон Дегрель и Йорис ван Северен были арестованы."
 belgium.131.a:0 "Они могут сотрудничать с врагом."
 belgium.131.b:0 "Разногласия — часть демократического процесса."
 belgium.131.c:0 "Продолжайте, это не имеет большого значения."
 belgium.132.t:0 "Профсоюзный деятель распространяет марксистские идеи"
 belgium.132.desc:0 "Местный профсоюзный деятель организовал активную кампанию по распространению коммунистических идей. Похоже, ему удалось привлечь на нашу сторону множество новых сторонников."
 belgium.132.a:0 "Будущее за нами!"
 belgium.133.t:0 "Буржуазные реакционеры пытаются защитить капиталистические институты"
 belgium.133.desc:0 "В ответ на рост нашего влияния агенты капиталистов решили защищать так называемую «свободу», чтобы обеспечить выживание институтов, созданных буржуазией. Вероятно, это лишь временная мера, ведь ничто не остановит рабочих на пути к власти и захвату средств производства."
 belgium.133.a:0 "Мы видели будущее, а они борются с неизбежным."
 belgium.134.t:0 "Фашисты объединяются против подъёма коммунистов"
 belgium.134.desc:0 "Пытаясь обратить неизбежное вспять, банды фашистских реакционеров, вероятно управляемые капиталистами, организовались и напали на коммунистических активистов."
 belgium.134.a:0 "В конце концов мы победим!"
 belgium.135.t:0 "Мобилизация в поддержку демократии"
 belgium.135.desc:0 "Угроза со стороны фашистских и коммунистических движений заставила многих встать на защиту демократических институтов. Были созданы объединения, осуждающие посягательства на гражданские свободы и стремящиеся сохранить основы [BEL.GetAdjective] общества."
 belgium.135.a:0 "Свободы необходимо защищать."
 belgium.136.t:0 "Общественные силы запрашивают современные винтовки"
 belgium.136.desc:0 "Общественные силы, обеспечивающие безопасность государства [COG.GetNameDef], уже много лет не получали современного вооружения. Как боевое соединение они постепенно устаревают и теперь с трудом выполняют повседневные задачи по поддержанию порядка в отдалённых районах колонии.\nЧтобы исправить положение, в рамках общего плана восстановления возможностей колониальных войск был направлен запрос на современное снаряжение."
 belgium.136.a:0 "Передать распоряжение управлению снабжения."
 belgium.136.b:0 "Мы отправим им техническую документацию."
 belgium.136.c:0 "Мы не можем выделить ни одной винтовки."
 belgium.137.t:0 "[BEL.GetNameDefCap] соглашается отправить современные винтовки"
 belgium.137.desc:0 "[BEL.GetAdjective] правительство согласилось отправить часть запрошенных винтовок FN для модернизации вооружения Общественных сил."
 belgium.137.a:0 "Отличные новости."
 belgium.138.t:0 "[BEL.GetNameDefCap] отклоняет наш запрос"
 belgium.138.desc:0 "[BEL.GetAdjective] правительство отказалось отправить нам запрошенные винтовки. Без инвестиций Общественным силам будет всё сложнее эффективно выполнять повседневные задачи."
 belgium.138.a:0 "Тогда придётся производить их самостоятельно."
 belgium.139.t:0 "Стрелковое оружие для Общественных сил"
 belgium.139.desc:0 "Первая партия оружия, которую мы обещали передать Общественным силам для модернизации их вооружения, наконец готова."
 belgium.139.a:0 "Отправить без задержек."
 belgium.139.b:0 "Отменить поставку и оставить оружие себе."
 belgium.140.t:0 "Вторая партия оружия для Общественных сил"
 belgium.140.desc:0 "Вторая партия оружия, предназначенного для Общественных сил, готова."
 belgium.140.a:0 "Вы знаете порядок. Продолжайте."
 belgium.141.t:0 "Последняя [COG.GetAdjective] поставка вооружения"
 belgium.141.desc:0 "Последняя партия стрелкового оружия, предназначенная для отправки в государство [COG.GetNameDef], наконец готова."
 belgium.141.a:0 "Надеюсь, им понравятся новые винтовки."
 belgium.142.t:0 "[BEL.GetNameDefCap] отказывается поставлять оружие!"
 belgium.142.desc:0 "В результате неожиданного поворота событий государство [BEL.GetNameDef] решило оставить себе оружие, которое обещало поставить, и отменить будущие отправки. Это решение вызвало гнев среди офицеров Общественных сил и [COG.GetAdjective] правительства. Отсутствие поддержки и ненадёжность [BEL.GetAdjective] властей усилили мнение о том, что колонии необходима более широкая автономия, чтобы добиваться реалистичных целей независимо от согласия министерства колоний."
 belgium.142.a:0 "Это скандал."
 belgium.143.t:0 "Первая партия винтовок прибыла"
 belgium.143.desc:0 "Мы получили первую часть вооружения, обещанного [BEL.GetAdjective] правительством."
 belgium.143.a:0 "Будем надеяться, что остальное прибудет быстро."
 belgium.144.t:0 "Прибыла ещё одна партия винтовок"
 belgium.144.desc:0 "Прибыла вторая партия стрелкового оружия."
 belgium.144.a:0 "Давно пора."
 belgium.145.t:0 "Последняя часть обещанного оружия доставлена"
 belgium.145.desc:0 "Последняя партия огнестрельного оружия, обещанного [BEL.GetAdjective] правительством, только что прибыла в Матади."
 belgium.145.a:0 "Хорошо, что они сдержали слово."
 belgium.146.t:0 "[BEL.GetNameDefCap] объявляет чрезвычайное положение"
 belgium.146.desc:0 "Чтобы противостоять растущей угрозе радикальных политиков, король Бельгии Леопольд III решил мобилизовать военных. Как ни удивительно, слухи говорят, что это радикальное решение было одобрено. [ENG.GetAdjective] Давление на страну. Военное положение в настоящее время введено в [BEL.GetNameDef]Начались репрессии против фашистских политиков и сочувствующих. Тем не менее, многие из них, больше роялистов, чем фашистов, признали, что их мнения были близорукими.\n\nМежду тем, демократические партии расходятся во мнениях по этому вопросу. В то время как многие из них испытывают облегчение от разгрома врагов государства, другие опасаются, что чрезвычайные полномочия могут быть продлены, а демократические институты устареют."
 belgium.146.a:0 "Любопытно."
 belgium.146.b:0 "Да здравствует король!"
 belgium.147.t:0 "[BEL.GetNameDefCap] объявляет чрезвычайное положение"
 belgium.147.desc:0 "Чтобы противостоять растущей угрозе радикальных политиков, король Бельгии Леопольд III решил мобилизовать военных. Как ни удивительно, некоторые слухи говорят, что это радикальное решение было одобрено. [ENG.GetAdjective] Давление на страну. Военное положение в настоящее время введено в [BEL.GetNameDef]Начались репрессии против коммунистических политиков и сторонников.\n\nМежду тем, демократические партии расходятся во мнениях по этому вопросу. В то время как многие из них испытывают облегчение от разгрома врагов государства, другие опасаются, что чрезвычайные полномочия могут быть продлены, а демократические институты устареют."
 belgium.147.a:0 "Любопытно."
 belgium.147.b:0 "Да здравствует король!"
 belgium.148.t:0 "Король бельгийцев предлагает дипломатическое соглашение"
 belgium.148.desc:0 "Зная о наших планах вмешательства в их страну с целью обеспечить её переход на нашу сторону, король Леопольд III предложил более мирное решение. Он объявит военное положение и сам разберётся с радикальными политиками, а мы сохраним независимость и нейтралитет его страны."
 belgium.148.a:0 "Разумное решение."
 belgium.148.b:0 "Мы не должны отказываться от возможности вторжения."
 belgium.149.t:0 "[ENG.GetNameDefCap] отклоняет наше предложение"
 belgium.149.desc:0 "[ENG.GetNameDefCap] Он сообщил нам, что они отказались от нашего предложения. Как [ENG.GetAdjective] Вмешательство остается возможным, мы должны активизировать наши усилия по борьбе с фашистами и коммунистами, пока они находятся на тропе войны."
 belgium.149.a:0 "Пора мобилизоваться!"
 belgium.150.t:0 "Демонстрация верности"
 belgium.150.desc:0 "В последнее время монархическая пропаганда усилилась и встретила горячую поддержку среди сторонников короля, готовых защищать страну. В Руселаре люди стихийно собрались, чтобы возложить цветы перед большим портретом короля и выразить ему свою преданность."
 belgium.150.a:0 "Да здравствует Леопольд!"
 belgium.151.t:0 "Угроза [ENG.GetAdjective] вмешательства"
 belgium.151.desc:0 "[ENG.GetAdjective] парламент одобрил план вмешательства в государство [BEL.GetNameDef]. Поэтому вероятность вторжения становится всё более реальной. Поскольку они остаются глухи к нашим дипломатическим просьбам избежать нового европейского конфликта, мы оказались зажаты между антидемократической риторикой внутри страны и угрозой [ENG.GetAdjective] высадки. Чтобы найти выход из кажущейся безвыходной ситуации, король встретился с правительством и начальником генерального штаба для обсуждения радикального плана действий. Он должен показать государству [ENG.GetNameDef] нашу решимость бороться с фашистами и коммунистами и тем самым предотвратить ненужную войну."
 belgium.151.a:0 "Приступить к плану. Объявить военное положение."
 belgium.151.b:0 "Это слишком опасно."
 belgium.152.t:0 "Военное положение вступает в силу"
 belgium.152.desc:0 "Как было объявлено в длинной и суровой речи, переданной [BEL.GetAdjective] радиостанциями, военное положение официально вступило в силу. Дивизии мобилизованы и размещены вокруг стратегических объектов, а король руководит всей операцией из штаба верховного командования в форте Бреендонк. Полиция при поддержке военных проводит обыски в штаб-квартирах «Рекса», VNV, Коммунистической партии Бельгии и других организаций, связанных с крайне левыми и крайне правыми.\n\nКороль фактически взял страну под свой контроль, намереваясь защитить её независимость и одновременно сохранить престол."
 belgium.152.a:0 "Удар в самое сердце наших врагов."
 belgium.153.t:0 "Пилларизация возвращается"
 belgium.153.desc:0 "С восстановлением нормальной демократической политики общество вновь организуется по партийным линиям. Поэтому ожидается, что пилларизация в той или иной форме снова будет определять структуру общества."
 belgium.153.a:0 "Общество, которое мы знаем и любим, возвращается."
 belgium.156.t:0 "Конец Бельгии"
 belgium.156.desc:0 "Из-за утраты половины исторических территорий страны прежнее разделение населения на фламандцев и валлонов внезапно исчезло. Поэтому правительство должно учесть эти перемены и признать, что институты бельгийского государства больше не являются представительными."
 belgium.156.a:0 "Логичное развитие событий..."
 belgium.156.b:0 "Логичное развитие событий..."
 belgium.156.c:0 "Логичное развитие событий..."
 belgium.156.d:0 "Логичное развитие событий..."
 belgium.157.t:0 "Конец Бельгии"
 belgium.157.desc:0 "Из-за утраты половины исторических территорий страны прежнее разделение населения на фламандцев и валлонов внезапно исчезло. Поэтому правительство должно учесть эти перемены и признать, что институты бельгийского государства больше не являются представительными."
 belgium.157.a:0 "Логичное развитие событий."
 belgium.157.b:0 "Логичное развитие событий."
 belgium.157.c:0 "Логичное развитие событий."
 belgium.157.d:0 "Логичное развитие событий."
 belgium.158.t:0 "Восхождение фламандского льва"
 belgium.158.desc:0 "После утраты валлонских территорий прежнее бельгийское правительство распалось. Нарушение языкового равновесия, ранее благоприятствовавшего франкоязычному населению, при подавляющем большинстве фламандских граждан заставило страну перестроиться во Фландрию. Фламандские националисты назвали этот день вторым по значимости в истории Фландрии после Битвы золотых шпор 1302 года."
 belgium.158.a:0 "Любопытно."
 belgium.159.t:0 "Валлонский конгресс провозглашает преобразование Бельгии"
 belgium.159.desc:0 "\n\nПосле утраты фламандских территорий, включая прежнюю столицу Брюссель, бельгийское правительство оказалось в смятении. Чтобы приспособиться к новым политическим реалиям, в Льеже был созван Валлонский конгресс, призванный заложить основы валлонского государства."
 belgium.159.a:0 "Любопытно."
 belgium.161.t:0 "Борьба за власть в государстве [COG.GetNameDef]"
 belgium.161.desc:0 "Под влиянием другой коммунистической страны разгорелись споры о руководстве коммунистическим движением в государстве [COG.GetNameDef]. Некоторые считают Альбера Декостера нелегитимным из-за его европейского происхождения. Они предпочли бы видеть во главе африканской страны африканца, даже если тот будет лишь номинальной фигурой."
 belgium.161.a:0 "Африкой должны править африканцы."
 belgium.161.b:0 "Оставить его в правительстве."
 belgium.161.c:0 "Оставить его у власти."
 belgium.164.t:0 "Доклад министерства колоний за 1935 год"
 belgium.164.desc:0 "Мы в целом удовлетворены работой Пьера Рикманса в государстве [COG.GetNameDef], поскольку он достаточно добросовестно соблюдает колониальную хартию, хотя время от времени поступают сообщения о злоупотреблениях.\nЭкономика восстанавливается, а положение коренного населения значительно улучшилось с 1909 года. Кроме того, добыча полезных ископаемых и каучука приносит существенные доходы. Однако горнодобывающее оборудование устаревает, что в будущем может угрожать экономической эффективности колонии.\nЧто касается Общественных сил, они почти полностью дезорганизованы. Солдаты вооружены преимущественно совершенно устаревшими винтовками, а офицеры лишены мотивации. Поэтому сейчас возможно проводить лишь самые простые операции по обеспечению безопасности.\n\nТем временем Лига Наций одобрила доклад Эжена Юнгерса о его работе в подмандатных колониях Руанда и Урунди. Надзор за королевствами Мутары III в Руанде и Мвамбутсы IV в Урунди должен продолжаться без происшествий. Поэтому сейчас мы не видим необходимости заменять гражданскую администрацию, однако срочная реформа сил безопасности необходима."
 belgium.164.a:0 "Нам предстоит многое сделать!"
 belgium.165.t:0 "Канал Альберта завершён"
 belgium.165.desc:0 "После десятилетия работ канал Альберта наконец был открыт."
 belgium.165.a:0 "Великолепное достижение."
 belgium.166.t:0 "Строительство канала Альберта остановлено"
 belgium.166.desc:0 "Из-за войны строительство канала Альберта было остановлено незадолго до завершения."
 belgium.166.a:0 "Мы выиграем войну, восстановим мир и достроим канал."
 belgium.167.t:0 "Брюссель обещал техническую помощь"
 belgium.167.desc:0 "Мы просили новые винтовки, но правительство вместо этого направило техническую помощь."
 belgium.167.a:0 "Лучше, чем ничего."
 belgium.news.1.t:0 "[HOL.GetAdjective] правительство принимает требования государства [BEL.GetAdjective]!"
 belgium.news.1.d:0 "\n\n[HOL.GetAdjective] правительство приняло условия [BEL.GetAdjective] ультиматума, открыв страну для сильного коммунистического влияния."
 belgium.news.1.a:0 "Отличные новости!"
 belgium.news.1.b:0 "Проклятые [BEL.GetAdjective] подданные! Их страны вообще не должно существовать."
 belgium.news.1.c:0 "Радуйтесь, рабочие! Революция распространяется!"
 belgium.news.1.e:0 "Ещё одна страна опозорилась перед иностранным агрессором."
 belgium.news.2.t:0 "[HOL.GetAdjective] правительство отвергает требования государства [BEL.GetAdjective]!"
 belgium.news.2.d:0 "\n\nThe [HOL.GetAdjective] Правительство отвергло [BEL.GetAdjective] Ультиматум, заявляя, что они не подчинятся этим нелепым требованиям. The [HOL.GetAdjective] Правительство добавило, что они готовы защищать каждый свой участок земли от воды и других захватчиков."
 belgium.news.2.a:0 "[HOL.GetAdjective] народ противостоит агрессии!"
 belgium.news.2.b:0 "Нашим [HOL.GetAdjective] союзникам понадобится помощь. Будем готовы."
 belgium.news.2.c:0 "Это не остановит ход истории!"
 belgium.news.2.e:0 "Тревожно!"
 belgium.news.3.t:0 "[HOL.GetAdjective] правительство просит помощи у Союзников!"
 belgium.news.3.d:0 "\n\nСтолкнувшись с требованиями государства [BEL.GetAdjective], [HOL.GetAdjective] правительство отвергло их и попросило Союзников оказать военную помощь в случае [BEL.GetAdjective] агрессии."
 belgium.news.3.a:0 "Объединённые Нации защитят свободу!"
 belgium.news.3.b:0 "Враги наших врагов — почти наши друзья."
 belgium.news.3.c:0 "Это не остановит ход истории!"
 belgium.news.3.e:0 "Война будет короткой, правда?"
 belgium.news.43.t:0 "Леон Дегрель провозглашает Тиойскую империю"
 belgium.news.43.d:0 "В продолжительной речи, восхваляющей ценность нации и её армии, Леон Дегрель объявил, что после завершения объединения с Нидерландами для Нижних земель началась новая эпоха. Чтобы подчеркнуть перемены, страна отныне будет называться Тиойской империей. Призывая возродить дух императора Карла V, он потребовал объединить старый «Бургундский округ» в рамках нового политического образования."
 belgium.news.43.a:0 "Сегодня имперский народ наконец пробудился!"
 belgium.news.43.b:0 "После несуществующей страны — несуществующая империя!"
 belgium.news.43.c:0 "Придётся переделывать карты."
 belgium.news.44.t:0 "Йорис ван Северен провозглашает Dietsche Rijk"
 belgium.news.44.d:0 "В продолжительной речи, восхваляющей ценность нации и её армии, Йорис ван Северен объявил, что после завершения объединения с Нидерландами для Нижних земель началась новая эпоха. Чтобы подчеркнуть перемены, страна отныне будет называться Dietsche Rijk. Призывая возродить единство нидерландоязычных народов, он потребовал объединить всех наследников Нижних земель в рамках нового политического образования."
 belgium.news.44.a:0 "Сегодня имперский народ наконец пробудился!"
 belgium.news.44.b:0 "После несуществующей страны — несуществующая империя!"
 belgium.news.44.c:0 "Придётся переделывать карты."
