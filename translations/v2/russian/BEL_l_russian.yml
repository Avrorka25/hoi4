 BEL_benelux_tech_sharing_group_desc:0 "Поскольку у нас не так много людей для мобилизации, технологическое превосходство остаётся единственным способом противостоять военной угрозе современности. Тесное сотрудничество стран Бенилюкса позволит полностью раскрыть потенциал наших трёх армий."
