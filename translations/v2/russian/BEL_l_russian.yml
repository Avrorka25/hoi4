 FLA_Antwerp_Oil_Industry_desc:0 "Антверпен уже является важным портом для химической промышленности. Поскольку угроза международной торговле растёт, часть этих мощностей следует переоборудовать для превращения нашего любимого кондрозского угля в нефть."
 FLA_reinforce_antwerp_brussels:0 "Линия КО"
 FLA_reinforce_antwerp_brussels_desc:0 "Брабант находится в самом сердце страны, и именно здесь расположены наши важнейшие города. Антверпен в прошлом был крупной крепостью, а Брюссель является центром нации. Укрепление обоих регионов превратит их в бастион против любого вторжения. Линия протянется от Конингсхойкта до Оттенбурга и будет оборудована противотанковыми рвами, бункерами и противотанковыми заграждениями Куантэ."
