 form_united_netherlands_category2_desc:0 "Если не считать недолговечного Объединённого королевства Нидерландов 1815–1830 годов, Нижние земли оставались разделёнными со времени отделения семи северных провинций и заключения Утрехтской унии в конце XVI века. Пришло время вновь объединить их и не повторять ошибок прошлого."
