 BEL_light_tank_destroyer_equipment_1_short:0 "Т-13"
 BEL_light_tank_destroyer_equipment_1_desc:0 "Эта танкетка стала первой попыткой создать бельгийский истребитель танков. Британская танкетка Carden-Loyd Mk.VI была вооружена 47-мм противотанковой пушкой F.R.C."
