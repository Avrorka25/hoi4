 van_den_bergen_promotion_tt:0 "§YГенерал Ван ден Берген§! станет начальником штаба армии со специализацией §Y«Армейская подготовка (гений)»§! и получит черты §Y«Медийная личность»§! и §Y«Организатор»§!."
 COG_italian_research_name:0 "Конголезско-итальянское научное сотрудничество"
 COG_italian_research_desc:0 "Совместная программа разработок, направленная на укрепление связей между Африкой и Европой."
 recruit_dutch_generals_tooltip:0 "Пока это решение активно, к нашему делу смогут присоединиться до 3 генералов."
