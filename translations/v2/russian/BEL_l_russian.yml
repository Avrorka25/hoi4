 bel_cityfall.1.t:0 "Падение Берлина"
 bel_cityfall.1.d:0 "Победоносные [BEL.GetAdjective] солдаты маршируют по улицам Берлина после ожесточённых боёв у Бранденбургских ворот, Рейхстага и Рейхсканцелярии.\n\nНад Рейхстагом теперь развевается [BEL.GetAdjective] флаг. Тем временем специальные группы прочёсывают город, разыскивая [GER.GetAdjective] чиновников, оказавшихся в осаждённой столице."
 bel_cityfall.1.a:0 "[BEL.GetAdjective] лев вновь рычит!"
 bel_cityfall.1.b:0 "[BEL.GetAdjective] лев вновь рычит!"
 bel_cityfall.1.c:0 "Бельгийские свиньи!"
 bel_cityfall.2.t:0 "Падение Лондона"
 bel_cityfall.2.d:0 "Победоносные [BEL.GetAdjective] солдаты маршируют по улицам Лондона после ожесточённых боёв, продолжавшихся большую часть дня. Хотя большинство городских памятников уцелело, Тауэрский мост был разрушен: отступавшие [ENG.GetAdjective] войска попытались прорваться через Темзу, но [BEL.GetAdjective] артиллерия уничтожила центральный пролёт прежде, чем они достигли другого берега.\n\nБукингемский дворец теперь служит новым штабом наступающих [BEL.GetAdjective] сил."
 bel_cityfall.2.a:0 "[BEL.GetAdjective] лев вновь рычит!"
 bel_cityfall.2.b:0 "[BEL.GetAdjective] лев вновь рычит!"
 bel_cityfall.2.c:0 "Зачем мы помогали им в 1914 году?"
 bel_cityfall.3.t:0 "Падение Москвы"
 bel_cityfall.3.d:0 "Победоносные [BEL.GetAdjective] солдаты маршируют по улицам Москвы после ожесточённых боёв, продолжавшихся большую часть дня. [BEL.GetAdjective] батальоны заняли позиции вокруг Красной площади и в повреждённых зданиях Кремля. Башни собора Василия Блаженного чудом пережили артиллерийский обстрел, подобно башне брюссельской ратуши в 1695 году."
 bel_cityfall.3.a:0 "[BEL.GetAdjective] лев вновь рычит!"
 bel_cityfall.3.b:0 "[BEL.GetAdjective] лев вновь рычит!"
 bel_cityfall.3.c:0 "[BEL.GetAdjective] войска? Здесь?"
 bel_cityfall.4.t:0 "Падение Амстердама"
 bel_cityfall.4.d:0 "Победоносные [BEL.GetAdjective] солдаты маршируют по улицам Амстердама после ожесточённых боёв, продолжавшихся большую часть дня. [BEL.GetAdjective] батальоны заняли позиции на мостах и главных городских площадях."
 bel_cityfall.4.a:0 "[BEL.GetAdjective] лев вновь рычит!"
 bel_cityfall.4.b:0 "[BEL.GetAdjective] лев вновь рычит!"
 bel_cityfall.4.c:0 "Нужно было разгромить их ещё в 1830 году."
 bel_cityfall.5.t:0 "Падение Парижа"
 bel_cityfall.5.d:0 "Сегодня утром победоносные [BEL.GetAdjective] солдаты прошли по Елисейским Полям. [BEL.GetAdjective] батальоны заняли позиции у Эйфелевой башни, Матиньонского дворца и Люксембургского дворца.\n\nПока [FRA.GetAdjective] войска отступали, некоторые [BEL.GetAdjective] офицеры воспользовались возможностью посетить Лувр, хотя почти все ценности были эвакуированы. Командующий [BEL.GetAdjective] силами обратился к парижанам с воззванием, призвав их не бояться наступающей армии, которая будет вести себя гуманно. Он также назвал этот день первой оккупацией Парижа со времён вступления бургундских войск в город в 1418 году — странное замечание, учитывая последовавшую тогда резню."
 bel_cityfall.5-2.d:0 "Сегодня утром победоносные [BEL.GetAdjective] солдаты прошли по Елисейским Полям. [BEL.GetAdjective] батальоны заняли позиции у Эйфелевой башни, Матиньонского дворца и Люксембургского дворца.\n\nПока [FRA.GetAdjective] войска отступали, некоторые [BEL.GetAdjective] офицеры воспользовались возможностью посетить Лувр, хотя почти все ценности были эвакуированы. Командующий [BEL.GetAdjective] силами обратился к парижанам с воззванием, призвав их не бояться наступающей армии, которая будет вести себя гуманно. Он также объявил, что эта историческая победа положила конец [FRA.GetAdjective] господству над Фландрией, завоёванной и угнетаемой [FRA.GetAdjective] империалистами на протяжении последних трёх столетий."
 bel_cityfall.5.a:0 "[BEL.GetAdjective] лев вновь рычит!"
 bel_cityfall.5.b:0 "[BEL.GetAdjective] лев вновь рычит!"
 bel_cityfall.5.c:0 "Они даже считать не умеют — и всё же побеждают нас?"
 bel_cityfall.6.t:0 "Падение Парижа"
 bel_cityfall.6.d:0 "Сегодня утром победоносные [BEL.GetAdjective] солдаты прошли по Елисейским Полям. [BEL.GetAdjective] батальоны заняли позиции у Эйфелевой башни, Матиньонского дворца и Люксембургского дворца.\n\nПока [FRA.GetAdjective] войска отступали, некоторые [BEL.GetAdjective] офицеры воспользовались возможностью посетить Лувр, хотя почти все ценности были эвакуированы. Командующий [BEL.GetAdjective] силами обратился к парижанам с воззванием, призвав их не бояться наступающей армии, которая будет вести себя гуманно."
 bel_cityfall.6.a:0 "[BEL.GetAdjective] лев вновь рычит!"
 bel_cityfall.6.b:0 "[BEL.GetAdjective] лев вновь рычит!"
 bel_cityfall.6.c:0 "Они даже считать не умеют — и всё же побеждают нас?"
 bel_cityfall.7.t:0 "Падение Иерусалима"
 bel_cityfall.7.d:0 "Сегодня утром победоносные [BEL.GetAdjective] солдаты вошли в Старый город Иерусалима. Батальоны заняли позиции на Храмовой горе, вокруг неё и у храма Гроба Господня.\n\nПока [ENG.GetAdjective] войска отступали, [BEL.GetAdjective] офицеры вошли в храм Гроба Господня, чтобы помолиться у гробницы Христа и почтить Готфрида Бульонского, завоевателя Иерусалима времён Первого крестового похода. Леон Дегрель назвал эту великую победу знаком того, что Бог поддерживает его в борьбе святой европейской цивилизации против иудео-большевистского плутократического варварства."
 bel_cityfall.7.a:0 "[BEL.GetAdjective] лев вновь рычит!"
 bel_cityfall.7.b:0 "Такова воля Бога!"
 bel_cityfall.7.c:0 "Контратака обязательна!"
 bel_cityfall.8.t:0 "Падение Рима"
 bel_cityfall.8.d:0 "Отчеты подтвердили, что [BEL.GetAdjective] Войска взяли Рим под свой контроль. Последних защитников пытались остановить [BEL.GetAdjective] Войска перед Понте-Мильвио, но были быстро разгромлены. [BEL.GetAdjective] Войска вошли в Рим через Порта-дель-Пополо. Отряд был незамедлительно направлен в Ватикан и заверил папу в своей безопасности."
 bel_cityfall.8.a:0 "Эти [BEL.GetAdjective] войска повсюду!"
 bel_cityfall.8.b:0 "Мы проявили ту же храбрость, что и Амбиорикс!"
 bel_cityfall.8.c:0 "Мы не должны оставлять Рим варварам!"
 bel_cityfall.9.d:0 "Отчеты подтвердили, что [BEL.GetAdjective] Войска взяли Рим под свой контроль. Последних защитников пытались остановить [BEL.GetAdjective] Войска перед Понте-Мильвио, но были быстро разгромлены. [BEL.GetAdjective] Войска вошли в Рим через Порта-дель-Пополо. The [BEL.GetAdjective] Командир объявил, что это знаменует собой новый шаг в римской истории, поскольку народ Рима теперь свободен от господства любого плутократического сената или деспотического религиозного лидера! Впоследствии систематически уничтожаются надписи и памятники, напоминающие фашизм. Местонахождение Папы Римского неизвестно, но верующие всего мира уже сравнивают это событие с разграблением Рима вандалами."
 bel_cityfall.9.b:0 "Это доказывает, что никакой бог не защищает Папу!"
