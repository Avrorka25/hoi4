 SAF_ossewabrandwag_sabotages:0 "Саботаж Оссевабрандвага"
 SAF_representation_of_natives:0 "Закон о представительстве коренного населения"
 SAF_joint_air_training_scheme:0 "Схема совместных авиационных тренировок"
 SAF_joint_air_training_scheme_desc:0 "Страны Содружества объединяют свои ресурсы и опыт для облегчения и ускорения подготовки пилотов и экипажей воздушных судов."
 SAF_voortrekker_monument:0 "Памятник Вурреккеру"
 SAF_voortrekker_monument_desc:0 "Памятник Вуртреккерам, которые совершили Великий путь, укрепит национальный дух и единство в эти тревожные времена."
 SAF_railway_development:0 "Развитие железных дорог"
 SAF_railway_development_desc:1 "Первая железнодорожная система Южной Африки была построена в 1859 году и соединила Дурбан с Харбор-Пойнтом. Теперь перед нами стоит задача модернизировать железные дороги и связать их с другими районами страны ради повышения производительности. Пришло время заложить основу этого проекта."
 SAF_mining_development:0 "Горнодобывающий бум"
 SAF_mining_development_desc:1 "Земли нашей страны богаты ресурсами. Однако от них не будет никакой пользы, пока они лежат под землёй. Необходимо модернизировать методы добычи и горнодобывающую промышленность, чтобы использовать скрытые в нашей земле богатства."
 SAF_develop_gold_extraction:0 "Развивать добычу золота"
 SAF_develop_gold_extraction_desc:1 "Йоханнесбург называют «Городом золота», и не без причины. Огромные месторождения золота долгое время поддерживали нашу экономику. Теперь необходимо активнее разрабатывать эти запасы и увеличить экспорт, чтобы укрепить экономику."
 SAF_amcor_thabazimbi_iron_mine:0 "Железный рудник «Амкор» в Табазимби"
 SAF_amcor_thabazimbi_iron_mine_desc:0 "«Амкор», англо-американская компания, открыла железный рудник в Табазимби и добывает железо на нашей территории. Нам следует расширить шахты, чтобы увеличить запасы стали как для экспорта, так и для нужд армии."
 SAF_amcor_plate_mill:0 "Прокатный завод «Амкор»"
 SAF_amcor_plate_mill_desc:0 "Теперь, когда у нас появился стабильный источник железной руды, можно приступить к строительству предприятий, способных обеспечить непрерывное производство высококачественной стали [Root.GetAdjective]!"
 SAF_transvaal_urbanization:0 "Урбанизация Трансвааля"
 SAF_transvaal_urbanization_desc:1 "Трансвааль расположен возле реки Вааль, что делает его подходящим местом для урбанизации. Мы приступим к развитию региона, чтобы создать условия для его дальнейшей индустриализации."
 SAF_economic_expansion:0 "Экономическое расширение"
 SAF_economic_expansion_desc:1 "Экономика Южной Африки оставляет желать лучшего. После образования Союза она оказалась в тяжёлом состоянии. Пришло время собрать её разбитые части и вновь сложить из них прекрасный сосуд — более сильную экономику."
 SAF_expand_iscor_pretoria_works:0 "Расширить заводы «Искор» в Претории"
 SAF_expand_iscor_pretoria_works_desc:1 "Первый завод «Искор» в Претории создавался прежде всего ради новых рабочих мест и начал выпуск стали в 1934 году. Теперь пора превратить его из средства борьбы с безработицей в полноценный промышленный объект, продукция которого будет использоваться государством."
 SAF_magazine_hill_ammunition_plant:0 "Завод боеприпасов Мэгэзин-Хилл"
 SAF_magazine_hill_ammunition_plant_desc:1 "Мэгэзин-Хилл остаётся прекрасным местом для размещения завода боеприпасов. Близость к реке Вааль и недавние проекты развития региона помогут предприятию процветать."
 SAF_industrial_innovations:0 "Промышленные инновации"
 SAF_industrial_innovations_desc:1 "Для создания крупной и процветающей промышленности необходимо идти в ногу с последними достижениями науки и техники. Для этого следует развивать собственные инновации и увеличить финансирование учёных."
 SAF_sasol_synthetic_fuel_researches:0 "Топливные проекты Сасолбурга"
 SAF_sasol_synthetic_fuel_researches_desc:1 "Топливо и синтетическая нефть жизненно важны для любой страны. Необходимо использовать возможности Сасолбурга для развития производства синтетического топлива."
 SAF_local_manufacturing_industry:0 "Местная обрабатывающая промышленность"
 SAF_local_manufacturing_industry_desc:1 "Местная промышленность важна для любой страны. Она не только отражает местную культуру, но и создаёт рабочие места и способствует развитию сельских районов. Для укрепления сельской экономики необходимо поддерживать такие предприятия."
 SAF_expand_around_magazine_hill:0 "Расширить комплекс Мэгэзин-Хилл"
 SAF_expand_around_magazine_hill_desc:1 "За последние годы Мэгэзин-Хилл был значительно милитаризован. Следует продолжить этот курс и расширить расположенный там завод боеприпасов."
 SAF_atomic_energy_board:0 "Совет по атомной энергии"
 SAF_atomic_energy_board_desc:1 "После недавнего открытия ядерного деления в Берлине нам также необходимо научиться использовать эту энергию. Это не только поможет укрепить экономику, но и, возможно, позволит разработать собственное секретное оружие..."
 SAF_war_technologies:0 "Военные технологии"
 SAF_war_technologies_desc:1 "На фоне стремительного развития смертоносной войны и крупных инвестиций в промышленность становится ясно: если мы хотим пережить этот конфликт, необходимо разработать собственные новые тактики и технологии."
 SAF_uranium_mining:0 "Добыча урана"
 SAF_uranium_mining_desc:0 "Геологическая разведка показала, что в некоторых районах нашей территории имеются залежи урановой руды. Они могут иметь жизненно важное значение для обеспечения стратегической независимости в снабжении этим ценным минералом."
 SAF_air_expansion_plan:0 "План расширения авиации"
 SAF_air_expansion_plan_desc:0 "В современном мире поддержка с воздуха играет ключевую роль в победе, однако наши ВВС можно описать одним словом — «неэффективные». Чтобы выжить в нынешнем мире, нам необходимо модернизировать и заново выстроить военно-воздушные силы."
 SAF_patrol_the_sea:0 "Патрулировать моря"
 SAF_patrol_the_sea_desc:1 "Наша страна связывает два океана — Индийский и Атлантический. Необходимо патрулировать моря, чтобы союзники могли безопасно продолжать торговлю, а враги держались подальше!"
 SAF_mobilize_the_bernard_institute:0 "Мобилизовать Институт Бернарда Прайса"
 SAF_mobilize_the_bernard_institute_desc:1 "Институт геофизических исследований Бернарда Прайса — одно из старейших и наиболее престижных научных учреждений Южной Африки. В условиях современных перемен необходимо обеспечить его полноценное участие в наших начинаниях."
 SAF_appoint_new_commander:0 "Назначить нового командующего"
 SAF_appoint_new_commander_desc:1 "Командующие решают исход сражений. Однако нынешнее руководство состоит из некомпетентных пораженцев. Нам необходимо назначить новых верховных командующих, способных эффективно руководить армиями!"
 SAF_aircraft_modernization:0 "Модернизация авиации"
 SAF_aircraft_modernization_desc:1 "Отправьте пять Эйрко DH.2 против одного Bf 109 — и получите ещё пять потерь среди союзников. Это наглядно показывает значение модернизации авиации. Чтобы иметь шанс против врага в небе, необходимо обновить наши ВВС и выбить противника из воздуха!"
 SAF_replace_imperial_airways:0 "Заменить «Импириал Эйруэйз»"
 SAF_replace_imperial_airways_desc:1 "«Импириал Эйруэйз» создавалась для связи британских заморских владений. Однако, мягко говоря, она оказалась «неэффективной»: авиационные происшествия случаются слишком часто. Необходимо немедленно заменить эту позорную авиакомпанию и создать собственную, действительно надёжную."
 SAF_seize_south_african_airways_aircrafts:0 "Изъять самолёты Южноафриканских авиалиний"
 SAF_seize_south_african_airways_aircrafts_desc:1 "Южноафриканские авиалинии считаются образцом эффективных воздушных перевозок. Однако большая часть их самолётов построена нашим врагом — Германией. Мы должны немедленно изъять эти машины и переоборудовать их для службы в Имперских военно-воздушных силах Южной Африки."
 SAF_formalize_air_doctrine:0 "Оформить воздушную доктрину"
 SAF_formalize_air_doctrine_desc:1 "Пришло время южноафриканским пилотам показать своё мастерство. Но как именно мы их готовили? Совершенно необходимо оформить единую воздушную доктрину, чтобы наши лётчики могли действовать в небе с максимальной эффективностью."
 SAF_air_training_scheme:0 "Программа авиационной подготовки"
 SAF_air_training_scheme_desc:1 "Британцы — наши друзья. Необходимо готовить наших пилотов совместно с британскими лётчиками, чтобы обе стороны получили преимущество над врагом, когда придёт время."
 SAF_national_air_training:0 "Национальная авиационная подготовка"
 SAF_national_air_training_desc:1 "Британцы предали нас. Теперь необходимо создать национальную программу подготовки пилотов и подготовить их к худшему из того, что ждёт впереди..."
 SAF_the_prides_of_the_nation:0 "Отважные пилоты Южной Африки"
 SAF_the_prides_of_the_nation_desc:1 "Наши пилоты проявили храбрость повсюду — в Европе, Африке и Азии. Некоторые особенно отличились в воздушных боях. Следует отметить их заслуги, присвоив им статус асов. Они помогут защищать страну в небе и станут примером для остальных лётчиков."
 SAF_organize_district_commands:0 "Организовать окружные командования"
 SAF_organize_district_commands_desc:0 "Армия [Root.GetAdjective] находится в плачевном состоянии и не готова к суровым требованиям современной войны. Реформирование можно начать с переподчинения имеющихся частей отдельным окружным командованиям вместе с соответствующими подразделениями поддержки."
 SAF_mission_to_europe:0 "Миссия в Европу"
 SAF_mission_to_europe_desc:0 "Нынешнему армейскому руководству остро не хватает новых идей и методов ведения успешных боевых действий. Следует организовать военную миссию в несколько союзных стран Европы, чтобы познакомить наших офицеров с современными тактиками и подходами."
 SAF_prepare_for_bush_warfare:0 "Подготовиться к войне в буше"
 SAF_prepare_for_bush_warfare_desc:0 "Изучение местности нашей страны показывает, что пехотинец с надёжным оружием остаётся самым экономичным средством обороны. Следует предусмотреть модернизацию пехоты."
 SAF_jungle_specialization:0 "Специализация на войне в джунглях"
 SAF_jungle_specialization_desc:0 "Джунгли Южной Африки относятся к числу самых суровых видов местности, где любая армия будет нести тяжёлые потери от истощения. Мы обучим войска успешно действовать и побеждать там, где другие потерпят неудачу."
 SAF_desert_specialization:0 "Специализация на войне в пустыне"
 SAF_desert_specialization_desc:0 "Пустыни Юго-Западной Африки — идеальное место для обучения войск действиям в пустыне. Мы сформируем специализированные части и научим обычных солдат переносить пустынную жару!"
 SAF_reform_staff_officers_training:0 "Реформировать подготовку штабных офицеров"
 SAF_reform_staff_officers_training_desc:0 ""
 SAF_elite_training:0 "Элитная подготовка"
 SAF_elite_training_desc:0 "Армия [Root.GetName] выиграет от создания дополнительных специализированных подразделений, способных проводить штурмы и возглавлять наступление на труднопроходимой местности. Для удовлетворения этих потребностей будет организована масштабная программа подготовки."
 SAF_military_innovations:0 "Военные инновации"
 SAF_military_innovations_desc:0 "Расширение армии показало, что одной лишь стойкости и храбрости для современной войны уже недостаточно. Необходимо вооружить наших бойцов новейшим оружием, способным полностью уничтожить врага!"
 SAF_reorganize_the_artillery:0 "Реорганизовать артиллерию"
 SAF_reorganize_the_artillery_desc:0 "В 1934 году управление всей артиллерией государства [Root.GetName] было объединено в составе артиллерийского корпуса [Root.GetAdjective]. Благодаря развитию отечественного производства вооружения мы сможем модернизировать снаряжение этого рода войск."
 SAF_modernize_infantry_equipment:0 "Модернизировать комплект пехотного снаряжения"
 SAF_modernize_infantry_equipment_desc:0 "Пехотинцам [ROOT.GetAdjective] предстоит сражаться на самой разной местности, поэтому для успеха в бою необходимо создать современный комплект снаряжения!"
 SAF_prioritize_q_service_corps:0 "Отдать приоритет корпусу службы Q"
 SAF_prioritize_q_service_corps_desc:0 "Корпус службы Q отвечает за важнейший аспект деятельности армии — логистику. Мы не можем позволить себе пренебрегать этой частью вооружённых сил."
 SAF_prioritize_t_service_corps:0 "Отдать приоритет корпусу службы T"
 SAF_prioritize_t_service_corps_desc:0 "Техническая служба отвечает за полевое обслуживание армейских машин и строительство полевых укреплений. Возможности этого рода службы необходимо как можно скорее расширить!"
 SAF_locally_built_armored_cars:0 "Бронеавтомобили местного производства"
 SAF_locally_built_armored_cars_desc:0 "Эпоха конной кавалерии подходит к концу с появлением бронированных стальных автомобилей. Эти колёсные машины будут доставлять нас в бой, обеспечивая достойную защиту от вражеского огня."
 SAF_local_tank_program:0 "Отечественная танковая программа"
 SAF_local_tank_program_desc:0 "Танки находятся на переднем крае современной войны. Мы не можем позволить армии идти в бой на устаревших машинах! Следует начать программу модернизации танков для собственных войск и наших союзников."
 SAF_SAR_and_H_brigade:0 "Бригада Южноафриканских железных дорог и портов"
 SAF_SAR_and_H_brigade_desc:0 "Безопасность наших железных дорог и гаваней гарантирована храбрыми бойцами бригады. Настало время для дальнейшего расширения их возможностей, чтобы лучше удовлетворять наши потребности."
 SAF_cadets_of_the_general_botha:0 "Кадеты «Генерала Боты»"
 SAF_cadets_of_the_general_botha_desc:0 "Десять лет назад богатый филантроп Томас Бенджамин Фредерик Дэвис пожертвовал нам корабль, предназначенный для подготовки нового поколения военно-морских кадетов к жизни в море. Теперь мы вновь призовём его на службу, чтобы готовить наших кадетов к войне на морях."
 SAF_establish_seaward_defense_force:0 "Создать Силы морской обороны"
 SAF_establish_seaward_defense_force_desc:0 "Силы морской обороны станут первой линией защиты от агрессора на море. Мы должны расширить их возможности."
 SAF_torpedo_development:0 "Развитие торпед"
 SAF_torpedo_development_desc:0 "Торпеда вместе со своим давним спутником — подводной лодкой — представляет серьёзную угрозу для любого вражеского судоходства. Развитие этой скрытой под морской поверхностью силы вселит страх в любую державу, желающую причинить нам вред."
 SAF_anti_submarine_equipment:0 "Противолодочное снаряжение"
 SAF_anti_submarine_equipment_desc:0 "Угроза того, что вражеский флот перекроет торговые пути у берегов Южной Африки, вызывает серьёзную тревогу. Необходимо начать программу модернизации флота и переоборудовать существующие корабли для борьбы с этой угрозой."
 SAF_expand_cape_town_yards:0 "Расширить верфи Кейптауна"
 SAF_expand_cape_town_yards_desc:0 "Нашим военным кораблям нужны верфи для ускорения ремонта и технического обслуживания. Строительство дополнительных мощностей в Кейптауне прекрасно удовлетворит эти потребности."
 SAF_expand_durban_yards:0 "Расширить верфи Дурбана"
 SAF_expand_durban_yards_desc:0 "Прибрежный Дурбан хорошо подходит для строительства военно-морских верфей и обеспечит стабильный приток рабочей силы, необходимой нашему флоту."
 SAF_a_true_navy:0 "Настоящий флот"
 SAF_a_true_navy_desc:0 "Южная Африка теперь располагает значительным числом верфей и опытом, необходимым для создания военно-морской силы, с которой придётся считаться. Пора выйти в море!"
 SAF_naval_ambition:0 "Военно-морские амбиции"
 SAF_naval_ambition_desc:0 "У нас никогда не было крупного флота, но начать ещё не поздно. Строительство огромных морских исполинов вселит страх в сердца наших врагов."
 SAF_salisbury_island_base:0 "База на острове Солсбери"
 SAF_salisbury_island_base_desc:0 "Нашему флоту нужна база для проведения операций. Остров Солсбери станет нашим Скапа-Флоу и будет обеспечивать безопасность окружающих морей."
 SAF_naval_aviation:0 "Морская авиация"
 SAF_naval_aviation_desc:0 "Эпоха больших корабельных орудий подходит к концу. Наступает время авианосцев и их авиационных групп, которым предстоит господствовать на море и в небе над ним."
 SAF_ethnic_legislation_category:0 "Этническое законодательство"
 SAF_representation_of_natives_act:0 "Принять закон о представительстве коренного населения"
 SAF_native_trust_and_land_act:0 "Принять закон о земельном фонде коренного населения"
 SAF_support_colonial_seperatists:0 "Поддержать колониальных сепаратистов"
 SAF_support_angolans:0 "Поддержать Анголу"
 SAF_support_the_congo:0 "Поддержать Конго"
 SAF_support_kenya:0 "Поддержать Кению"
 SAF_support_mozambique:0 "Поддержать Мозамбик"
 SAF_support_zimbabwe:0 "Поддержать Зимбабве"
 SAF_give_smuts_field_command:0 "Дать Яну Смэтсу полевое командование"
 SAF_republicanism:0 "Южноафриканский республиканизм"
 SAF_hertzog_in_power:0 "Герцог у власти"
 SAF_smuts_in_power:0 "Смэтс у власти"
 SAF_ethnic_legislation:0 "Этническое законодательство"
 SAF_ethnic_legislation_desc:0 "Мы должны чётко определить права наших граждан, что позволит в дальнейшем принимать новые законы и постановления с далеко идущими последствиями."
 SAF_sensibilize_the_africans:0 "Пробудить политическое сознание африканцев"
 SAF_sensibilize_the_africans_desc:0 "Народы Африки должны знать о своих правах и начать борьбу за власть большинства в собственных странах."
 SAF_organize_the_party:0 "Организовать нашу партию"
 SAF_organize_the_party_desc:0 "Мы должны начать объединять единомышленников — тех, кто добровольно присоединится к нашей борьбе за равные права для каждого человека в этой стране. Сын африканерского председателя суда уже предложил администрации свои услуги именно ради этой цели."
 SAF_rally_the_indians:0 "Сплотить индийцев"
 SAF_rally_the_indians_desc:0 "Индийцы — наши соотечественники в этой борьбе. Мы не должны жалеть сил, чтобы заручиться их помощью в будущих сражениях."
 SAF_paralyze_the_country:0 "Революция коренных народов"
 SAF_paralyze_the_country_desc:0 "Время пришло. Теперь мы будем сражаться за все народы и все расы этой земли!"
 SAF_liberation_revolution:0 "Единая революция"
 SAF_liberation_revolution_desc:0 "Теперь, когда мы освободили страну от угнетателей-капиталистов, необходимо вновь объединить рабочих в единый народ, движимый общей целью!"
 SAF_alliance_with_ussr:0 "Союз с Советским Союзом"
 SAF_alliance_with_ussr_desc:0 "Родина коммунизма всегда будет нашим самым верным союзником в этом жестоком мире!"
 SAF_side_by_side_as_equals:0 "Жить как равные"
 SAF_side_by_side_as_equals_desc:0 "Независимо от расы или вероисповедания, все мы живём на одной земле и имеем одинаковые желания и потребности. Мы донесём эту истину до рабочих нашей страны."
 SAF_black_republic:0 "Чёрная республика"
 SAF_black_republic_desc:0 "Мечта о собственной стране для нашего народа наконец осуществилась. Мы объявим всему миру о создании нового государства."
 SAF_redistribute_the_land:0 "Реорганизовать землепользование"
 SAF_redistribute_the_land_desc:0 "Земля больше не будет доставаться лишь привилегированному меньшинству. Теперь она принадлежит тем, кто будет трудиться на ней под нашим надзором."
 SAF_control_former_exploiters:0 "Взять под контроль бывших эксплуататоров"
 SAF_control_former_exploiters_desc:0 "Мы начнём перераспределение предприятий, техники и производств, прежде принадлежавших нашим бывшим хозяевам. Теперь контроль над ними находится в наших руках."
 SAF_support_african_seperatists:0 "Поддержать колониальных сепаратистов"
 SAF_support_african_seperatists_desc:0 "Теперь мы начнём освобождение наших братьев от других колониальных угнетателей на этом континенте!"
 SAF_policy_of_cooperation:0 "Политика сотрудничества"
 SAF_policy_of_cooperation_desc:0 "[ROOT.GetName] должна позаботиться о том, чтобы наши отношения с метрополией оставались крепкими и дружественными."
 SAF_research_cooperation:0 "Научное сотрудничество Содружества"
 SAF_research_cooperation_desc:0 "Южная Африка не должна отставать в научных исследованиях. Мы начнём координировать исследовательские программы со странами Содружества."
 SAF_commonwealth_industrial_cooperation:0 "Промышленная помощь Содружества"
 SAF_commonwealth_industrial_cooperation_desc:0 "[ROOT.GetName] начнёт программу промышленной модернизации при поддержке Великобритании."
 SAF_finance_legislation:0 "Финансовое законодательство"
 SAF_finance_legislation_desc:0 "Рост наших городов и поселений должен продолжаться благодаря финансированию новой инфраструктуры и заводов, которые будут поддерживать это развитие."
 SAF_guard_the_cape:0 "Защитить Капскую область"
 SAF_guard_the_cape_desc:0 "Мыс Доброй Надежды расположен на важнейшей артерии морской торговли. Мы должны укрепить оборону этих берегов, чтобы никто не смог нарушить работу наших предприятий."
 SAF_remobilize_the_cape_corps:0 "Вновь мобилизовать Капский корпус"
 SAF_remobilize_the_cape_corps_desc:0 "Капский корпус, наш стойкий защитник на протяжении многих лет, в последнее время пришёл в упадок. Необходимо переломить эту тенденцию и начать быстрое расширение вооружённых сил, чтобы сокрушать будущие угрозы ещё до того, как они успеют проявиться."
 SAF_crush_ossewabrandwag:0 "Ликвидировать Оссевабрандваг"
 SAF_crush_ossewabrandwag_desc:0 "Оссевабрандваг представляет собой совершенно неприемлемую пятую колонну на нашей территории. Мы искореним его влияние везде, где оно обнаружится."
 SAF_the_aliens_act:0 "Принять закон об иностранцах"
 SAF_the_aliens_act_desc:0 "Иммиграция иностранных граждан в государство [ROOT.GetName] представляет угрозу национальной безопасности, поэтому на некоторое время её необходимо серьёзно ограничить."
 SAF_expand_the_union:0 "Расширить Союз"
 SAF_expand_the_union_desc:0 "Укрепление связей с государством [ENG.GetName] и расширение нашей обороны наконец дали нам реальные возможности защищать общие интересы на континенте. Мы добьёмся объединения нескольких территорий под нашим контролем, чтобы значительно повысить эффективность управления ими."
 SAF_push_the_unp_towards_independence:0 "Подтолкнуть Объединённую партию к независимости"
 SAF_push_the_unp_towards_independence_desc:0 "Объединённая партия остаётся нашим лучшим шансом добиться независимости от метрополии. Мы должны предпринять необходимые шаги для достижения этой цели."
 SAF_radicalize_the_afrikaner_broederbond:0 "Радикализировать Национальную партию"
 SAF_radicalize_the_afrikaner_broederbond_desc:0 "Национальная партия станет следующим шагом на пути к установлению нашего господства в стране."
 SAF_celebrate_the_voortrekkers:0 "Прославлять фуртреккеров"
 SAF_celebrate_the_voortrekkers_desc:0 "Основатели нашей страны первыми освободились от ярма колониализма. Наше будущее движение последует их примеру и проявит такую же смелость, разрывая отношения с прежними хозяевами."
 SAF_form_the_ossewabrandwag:0 "Сформировать Оссевабрандваг"
 SAF_form_the_ossewabrandwag_desc:0 "Далеко не все поддерживают британское господство над Южной Африкой. Разрозненные группы уже начинают сопротивляться власти далёких хозяев. Оссевабрандваг объединит всех этих людей ради общего дела!"
 SAF_solidify_german_contacts:0 "Объединить радикальных африканеров"
 SAF_solidify_german_contacts_desc:0 "Либерализм и капитализм больше не способны служить нашим целям. Мы объединим единомышленников, готовых завоевать независимость прямыми действиями."
 SAF_return_to_republicanism:0 "Вернуться к республиканизму"
 SAF_return_to_republicanism_desc:0 "Страна создаётся не указом, а негласным согласием её народа. [ROOT.GetName] вернётся к своим истокам, передав идею государственности от далёкого монарха к гораздо более близкому источнику власти — народу, живущему на нашей собственной земле."
 SAF_stormjaers_militias:0 "Профессионализировать стормъягеров"
 SAF_stormjaers_militias_desc:0 "Стормъягерам потребуется официальное одобрение администрации, если они должны защищать её интересы внутри наших границ. Профессионализация этих отрядов станет основой для создания более элитной части вооружённых сил."
 SAF_sharpshooting_tradition:0 "Традиции меткой стрельбы"
 SAF_sharpshooting_tradition_desc:0 "Наши вооружённые силы унаследовали традиции прежних колонистов, успешно воевавших при помощи дальнобойного оружия и мобильной тактики. Если мы хотим добиться успеха, следует идти по их стопам."
 SAF_get_rid_of_the_british:0 "Избавиться от британцев"
 SAF_get_rid_of_the_british_desc:0 "Мы больше не потерпим влияния Британских островов. Мы сокрушим их, чтобы навсегда положить конец их вмешательству в наши дела!"
 SAF_contact_rhodesian_afrikaners:0 "Африканерское руководство в Родезии"
 SAF_contact_rhodesian_afrikaners_desc:0 "Пришло время взять под свой контроль бывшие колонии нашего прежнего сюзерена. Интеграция этих земель и их народов пройдёт под нашим бесспорным руководством на континенте!"
 SAF_axis_alliance:0 "Укрепить контакты с Германией"
 SAF_axis_alliance_desc:0 "В последнее время германское правительство предпринимает шаги к сохранению дружественных отношений с нами. Наши судьбы переплетены — пора и нам занять своё место под солнцем!"
 SAF_build_a_new_state:0 "Перестроить правительство"
 SAF_build_a_new_state_desc:0 "Наш путь больше не ведёт через Вестминстер. Мы проведём референдум о прекращении британского влияния на наше управление."
 SAF_separation_policy:0 "Политика разделения"
 SAF_separation_policy_desc:0 "Наши народы всё ещё несут на себе шрамы апартеида."
 SAF_relax_racial_laws:0 "Смягчить расовую политику"
 SAF_relax_racial_laws_desc:0 "Сила республики заключается в её народах. Мы больше не можем мириться с угнетением людей из-за искусственных границ, проведённых привилегированным меньшинством."
 SAF_relax_racial_laws_tt:0 "Открывает многочисленных чернокожих политических советников, генералов и адмиралов."
 SAF_laager_doctrine:0 "Доктрина лаагера"
 SAF_laager_doctrine_desc:0 "Наши народы теперь объединены под общим флагом и больше не подчиняются заморскому хозяину!"
 NMB_graveyard_coast:0 "Берег Скелетов"
 NMB_graveyard_coast_desc:0 "Это побережье усеяно естественными препятствиями и отличается суровым рельефом, из-за чего строительство портов и организация снабжения здесь чрезвычайно затруднены."
 SAF_event.1.t:0 "Падение консервативного правительства!"
 SAF_event.1.desc:0 "После того как парламент проголосовал за вступление в войну на стороне Британии, политика нейтралитета консервативного правительства была полностью дискредитирована. Либералу Яну Смэтсу, выступавшему за объявление войны, поручено сформировать новое правительство. Для создания армии ему также передано командование всеми вооружёнными силами Южной Африки."
 SAF_event.1.a:0 "Империя будет защищена!"
 SAF_event.2.t:0 "Организация партии"
 SAF_event.2.d:0 "Наша Коммунистическая партия очень слаба, и прежде чем захватить власть, необходимо как следует её организовать."
 SAF_event.2.a:0 "Табо Эдвин Мофутсаньяна возглавит нашу партию."
 SAF_event.2.b:0 "Мозес Котане возглавит нашу партию."
 SAF_event.3.t:0 "Свержение колониального правительства"
 SAF_event.3.d:0 "Мы свергли прежнее колониальное правительство и полностью разорвали ВСЕ связи с Британией. Теперь необходимо создать собственную республику!"
 SAF_event.3.a:0 "Прекрасно."
 SAF_event.4.t:0 "Африканерский переворот"
 SAF_event.4.d:0 "Со временем об африканерах начали забывать, но теперь, когда мы создали такие организации, как Африканер Брудербонд и Оссевабрандваг, можно свергнуть правительство и восстановить африканерскую республику, когда-то уничтоженную британцами!"
 SAF_event.4.a:0 "Им нас не победить!"
 SAF_event.5.t:0 "Референдум о независимости"
 SAF_event.5.d:0 "С точки зрения государственного управления мы уже стали независимыми, однако вопрос отношений с Соединённым Королевством остаётся открытым. Мы можем стать их равноправным союзником, но в таком случае премьер-министр Герцог уйдёт в отставку вместе с пробританским командующим и политиком Яном Смэтсом."
 SAF_event.5.a:0 "Британцы нам всё ещё нужны."
 SAF_event.5.b:0 "Они нам не нужны."
 SAF_event.6.t:0 "Ян Смэтс уходит в отставку"
 SAF_event.6.desc:0 "Под давлением правительства из-за своей очевидной идеологической позиции Ян Смэтс был вынужден оставить командную должность и покинуть страну."
 SAF_event.6.a:0 "Мы не будем о нём жалеть."
 SAF_event.7.t:0 "Предложение издалека"
 SAF_event.7.desc:0 "С нами связался Робей Лейббрандт — африканерский боевик, утверждающий, что представляет организацию под названием Оссевабрандваг. Он готов вернуться на родину и освободить свою страну от иностранного угнетения. Он надеется, что мы поддержим борьбу африканерского народа за землю и свободу. Лейббрандт хочет поступить на службу в нашу разведку и вернуться домой, чтобы продолжить борьбу."
 SAF_event.7.a:0 "Организовать встречу с офицером связи."
 SAF_event.7.b:0 "Вежливо отказаться."
 unite_tanganyika_zanzibar:0 "Объединить [TZN.GetNonIdeologyName] и [ZAN.GetNonIdeologyName]"
