 SAF_lenz_bomb_factory:0 "Бомбовый завод в Лензе"
 SAF_lenz_bomb_factory_desc:1 "Ленз расположен в высокоиндустриализированном районе Йоханнесбурга. Местные ресурсы могут помочь в производстве взрывчатки и бомб, поэтому нам необходимо немедленно приступить к их разработке и открыть там новый «бомбовый завод»."
