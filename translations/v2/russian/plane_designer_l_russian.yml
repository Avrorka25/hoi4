 medium_plane_scout_plane_airframe_4_desc:0 "$medium_plane_airframe_4_desc$"
 large_plane_airframe_0:0 "Корпус большого самолета межвоенных лет"
 large_plane_airframe_0_desc:0 "В этом очень большом планере достаточно места для бомб и топливных баков. Однако очевидно, что возможности его дальнейшего развития крайне ограничены. Новые поколения стратегических бомбардировщиков уже не за горами."
 large_plane_airframe_1:0 "Базовый корпус большого самолета"
 large_plane_airframe_1_desc:0 "Этот планер был создан для проверки возможностей настоящего стратегического бомбардировщика, способного поражать промышленные объекты в глубине вражеской территории и возвращать экипаж домой живым."
 large_plane_airframe_2:0 "Улучшенный корпус большого самолета"
 large_plane_airframe_2_desc:0 "Теперь, когда концепция стратегического бомбардировщика доказала свою состоятельность, этот планер был создан для увеличения полезной нагрузки и дальности полёта, сохраняя достаточный потенциал для дальнейшего развития."
 large_plane_airframe_3:0 "Усовершенствованный корпус большого самолета"
 large_plane_airframe_3_desc:0 "Этот планер, оптимизированный для полётов на очень большие расстояния и на большой высоте, способен доставлять значительную полезную нагрузку в самое сердце вражеской территории."
 large_plane_airframe_4:0 "Корпус современного большого самолета"
 large_plane_airframe_4_desc:0 "Реактивная тяга обеспечивает колоссальный прирост характеристик. Этот планер создан именно для того, чтобы воспользоваться её преимуществами."
 large_plane_maritime_patrol_plane_airframe_0:0 "Планер морского патрульного самолёта межвоенного периода"
 large_plane_maritime_patrol_plane_airframe_0_desc:1 "Флоту нужны самолёты большой дальности, способные обнаруживать противника вдали от берега. Хотя этот планер несколько устарел, он обладает необходимой дальностью для патрулирования обширных участков океана."
 large_plane_maritime_patrol_plane_airframe_1:0 "Базовый планер морского патрульного самолёта"
 large_plane_maritime_patrol_plane_airframe_1_desc:0 "Появление более мощной палубной авиации требует обнаруживать и уничтожать вражеские флоты вдали от берега. Первым шагом к этому является их поиск в открытом океане, для чего необходим новый тип самолёта."
 large_plane_maritime_patrol_plane_airframe_2:0 "Улучшенный планер морского патрульного самолёта"
 large_plane_maritime_patrol_plane_airframe_2_desc:0 "Двойная угроза со стороны подводных лодок и крейсеров-рейдеров требует патрулировать огромные пространства океана. Этот планер оптимизирован именно для такой задачи."
 large_plane_maritime_patrol_plane_airframe_3:0 "Усовершенствованный планер морского патрульного самолёта"
 large_plane_maritime_patrol_plane_airframe_3_desc:0 "Радары и другие датчики позволяют обнаруживать вражеские флоты даже в плохую погоду или тёмной ночью, однако для размещения всего нового оборудования требуется более крупный планер."
 large_plane_maritime_patrol_plane_airframe_4:0 "Современный корпус самолета морского патрулирования"
 large_plane_maritime_patrol_plane_airframe_4_desc:0 "С наступлением ракетной эпохи морские патрульные самолёты должны действовать ещё дальше от берега и оставаться в воздухе ещё дольше."
 cv_small_plane_airframe_0:0 "Корпус палубного самолета межвоенных лет"
 cv_small_plane_airframe_0_desc:0 "Этот планер оснащён посадочным гаком и усиленным шасси, благодаря чему способен действовать с авианосца."
 cv_small_plane_airframe_1:0 "Базовый корпус палубного самолета"
 cv_small_plane_airframe_1_desc:0 "Этот планер использует новые технологии, разработанные для самолётов наземного базирования, и не уступает им по возможностям, но при этом может взлетать с палубы авианосца."
 cv_small_plane_airframe_2:0 "Улучшенный корпус палубного самолета"
 cv_small_plane_airframe_2_desc:0 "Чтобы не отставать от развития наземной авиации, при создании этого планера были применены новые технологии, увеличивающие дальность и лётные характеристики."
 cv_small_plane_airframe_3:0 "Усовершенствованный корпус палубного самолета"
 cv_small_plane_airframe_3_desc:0 "Жёсткие требования палубной авиации ограничивают размеры и возможности планера. Эта модель представляет собой абсолютный предел того, чего можно достичь с традиционной силовой установкой."
 cv_small_plane_airframe_4:0 "Корпус современного палубного самолета"
 cv_small_plane_airframe_4_desc:0 "Этот планер разработан с расчётом на повышенную тягу реактивных двигателей и позволяет внедрить их в морскую авиацию."
