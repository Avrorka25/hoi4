 medium_plane_airframe_0:0 "Корпус среднего самолета межвоенных лет"
 medium_plane_airframe_0_desc:0 "Хотя этот планер способен нести значительную полезную нагрузку на большое расстояние, возможности его дальнейшего развития крайне ограничены."
 medium_plane_airframe_1:0 "Базовый корпус среднего самолета"
 medium_plane_airframe_1_desc:0 "Благодаря применению ряда недавно разработанных технологий этот планер значительно превосходит по возможностям более ранние самолёты аналогичного размера."
 medium_plane_airframe_2:0 "Улучшенный корпус среднего самолета"
 medium_plane_airframe_2_desc:0 "Применение современных производственных технологий позволяет этому планеру нести более тяжёлую полезную нагрузку на большее расстояние."
 medium_plane_airframe_3:0 "Усовершенствованный корпус среднего самолета"
 medium_plane_airframe_3_desc:0 "Этот планер, спроектированный для достижения максимальных характеристик и грузоподъёмности, представляет собой вершину развития самолётов с традиционной силовой установкой."
 medium_plane_airframe_4:0 "Корпус современного среднего самолета"
 medium_plane_airframe_4_desc:0 "Поскольку реактивные самолёты, вероятно, вскоре займут господствующее положение, инженеры начинают разрабатывать планеры с учётом реактивной тяги."
 medium_plane_fighter_airframe_0:0 "Планер тяжёлого истребителя межвоенного периода"
