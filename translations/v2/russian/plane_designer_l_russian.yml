 engine_1_1x:0 "1 двигатель I"
 engine_1_1x_desc:0 "Этот базовый двигатель надёжен и дёшев, но не отличается высокой мощностью."
 engine_1_2x:0 "2 двигателя I"
 engine_1_2x_desc:0 "Два двигателя обеспечивают самолёту значительный прирост тяги, но требуют дополнительных затрат."
 engine_1_3x:0 "3 двигателя I"
 engine_1_3x_desc:0 "Три двигателя дают больше тяги, чем два, не требуя при этом затрат на четвёртый двигатель."
 engine_1_4x:0 "4 двигателя I"
 engine_1_4x_desc:0 "Четыре двигателя обеспечивают достаточно тяги, чтобы поднять тяжёлый самолёт и позволить ему нести значительную полезную нагрузку."
 engine_1_6x:0 "6 двигателей I"
 engine_1_6x_desc:0 "Шесть двигателей позволяют любому самолёту нести значительную полезную нагрузку на большое расстояние с приемлемой скоростью."
 engine_2_1x:0 "1 двигатель II"
 engine_2_1x_desc:0 "Более крупный и мощный двигатель позволяет увеличить скорость и полезную нагрузку."
 engine_2_2x:0 "2 двигателя II"
 engine_2_2x_desc:0 "$engine_1_2x_desc$"
 engine_2_3x:0 "3 двигателя II"
 engine_2_3x_desc:0 "$engine_1_3x_desc$"
 engine_2_4x:0 "4 двигателя II"
 engine_2_4x_desc:0 "$engine_1_4x_desc$"
 engine_2_6x:0 "6 двигателей II"
 engine_2_6x_desc:0 "$engine_1_6x_desc$"
 engine_3_1x:0 "1 двигатель III"
 engine_3_1x_desc:0 "Благодаря таким передовым решениям, как впрыск метанола и автоматическое регулирование топливной смеси, этот двигатель способен развивать значительно большую мощность."
 engine_3_2x:0 "2 двигателя III"
 engine_3_2x_desc:0 "$engine_1_2x_desc$"
 engine_3_3x:0 "3 двигателя III"
 engine_3_3x_desc:0 "$engine_1_3x_desc$"
 engine_3_4x:0 "4 двигателя III"
 engine_3_4x_desc:0 "$engine_1_4x_desc$"
 engine_3_6x:0 "6 двигателей III"
 engine_3_6x_desc:0 "$engine_1_6x_desc$"
 engine_4_1x:0 "1 двигатель IV"
 engine_4_1x_desc:0 "Всесторонняя инженерная доработка, направленная на использование любого возможного прироста характеристик, делает этот двигатель вершиной технологии поршневых авиационных двигателей."
 engine_4_2x:0 "2 двигателя IV"
