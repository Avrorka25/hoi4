 early_bombs:0 "Авиационные бомбы"
 early_bombs_desc:0 "С первых дней Великой войны самолёты всё чаще использовались для сбрасывания взрывчатки на вражеские цели. Со временем это превратилось в один из основополагающих элементов воздушной войны."
 heavy_bombs:0 "Тяжелые бомбы"
 heavy_bombs_desc:0 "Современная война требует применения самолётами всё более крупных бомб против вражеских целей. Со временем это превратилось в один из основополагающих элементов воздушной войны."
 armor_piercing_bombs:0 "Бронебойные бомбы"
 armor_piercing_bombs_desc:0 "Броневая защита палуб военных кораблей постоянно усиливается, поэтому для её пробития необходимо разработать специальные бомбы."
 air_torpedoe_1:0 "Авиационные торпеды"
 air_torpedoe_1_desc:0 "Необходимо разработать облегчённые торпеды, которые смогут нести наши самолёты."
 air_torpedoe_2:0 "Улучшенные авиационные торпеды"
 air_torpedoe_2_desc:0 "Развитие авиации позволяет создавать более крупные и мощные торпеды."
 air_torpedoe_3:0 "Модернизированные авиационные торпеды"
 air_torpedoe_3_desc:0 "Объединив новейшие технологии, мы сможем создать для нашей авиации чрезвычайно совершенные торпеды."
 photo_reconnaisance:1 "Воздушная фоторазведка"
 photo_reconnaisance_desc:0 "Первой очевидной военной задачей самолёта был поиск противника и передача его местоположения генералам на земле. Это и сегодня остаётся одной из самых распространённых задач военной авиации."
 aa_lmg:0 "Лёгкий авиационный пулемёт"
 aa_lmg_desc:0 "Пулемёты винтовочного калибра составляли основу вооружения класса «воздух — воздух» ещё со времён Великой войны."
 survivability_studies:0 "Расчет живучести"
 survivability_studies_desc:0 "Тщательно анализируя боевые повреждения вернувшихся самолётов, мы можем точно определить, какие их части действительно жизненно важны."
 aircraft_construction:0 "Строительство самолетов"
 aircraft_construction_desc:0 "Со времён использования фанеры и ткани в самолётостроении мы прошли долгий путь. Новые технологии позволяют создавать самолёты, лучше приспособленные для выполнения определённых задач."
 aa_hmg:0 "Крупнокалиберный авиационный пулемёт"
 aa_hmg_desc:0 "Современные самолёты способны выдерживать значительно больше повреждений, чем старые модели, а попасть по ним стало сложнее. Поэтому каждое попадание должно наносить максимальный урон, что требует патрона большего калибра."
 aa_cannon_1:0 "Авиационные пушки I"
 aa_cannon_1_desc:0 "Пушечный снаряд способен пробить даже самый прочный самолёт и при этом нести достаточно взрывчатки, чтобы при попадании нанести сокрушительный урон."
 aa_cannon_2:0 "Крупнокалиберные пушки"
 aa_cannon_2_desc:0 "Благодаря увеличенному калибру и более тяжёлому снаряду эти пушки могут сбить даже большой самолёт одним попаданием."
 aa_cannon_3:0 "Современные авиационные пушки "
 aa_cannon_3_desc:0 "Современная пушка, стреляющая крупными снарядами с высокой начальной скоростью, позволяет сбивать даже самые прочные самолёты."
 engines_1:0 "Авиационные двигатели I"
 engines_1_desc:0 "Авиационные двигатели должны быть мощными, но при этом лёгкими и надёжными. Этот тип двигателя обеспечивает достаточную мощность для взлёта, однако несколько ограничивает возможность самолёта полностью раскрыть свой потенциал."
 engines_2:0 "Авиационные двигатели II"
 engines_2_desc:0 "Стремительное развитие авиации требует соответствующего увеличения мощности двигателей."
 engines_3:0 "Авиационные двигатели III"
 engines_3_desc:0 "$engine_3_1x_desc$"
 engines_4:0 "Авиационные двигатели IV"
 engines_4_desc:0 "$engine_4_1x_desc$"
 range_improvements:0 "Улучшение дальности"
 range_improvements_desc:0 "Очевидно, что увеличение запаса топлива повышает дальность полёта самолёта, однако разместить дополнительное топливо без существенного ухудшения лётных характеристик далеко не просто."
 sp_centrifugal_jet_tech:0 "Центробежный реактивный двигатель"
 sp_centrifugal_jet_tech_desc:0 "Центробежные реактивные двигатели используют одноступенчатый компрессор для сжатия поступающего воздуха, после чего выбрасывают его наружу, создавая тягу. В результате получаются более компактные и простые в обслуживании двигатели."
 jet_engine_axial_1x:0 "Реактивный двигатель с 1 осью"
 jet_engine_axial_1x_desc:0 "Благодаря последовательной установке нескольких компрессоров осевой двигатель способен многократно увеличить тягу по сравнению с простым одноступенчатым реактивным двигателем."
