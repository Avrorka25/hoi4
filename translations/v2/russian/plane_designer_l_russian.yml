 AIR_TITLE_MOTHERSHIP_DESC:0 "Материнские корабли - это большие самолеты, предназначенные для перевозки и развертывания небольших самолетов в бою, значительно расширяя их операционную дальность за пределы того, что отдельные истребители могли бы достичь самостоятельно."
