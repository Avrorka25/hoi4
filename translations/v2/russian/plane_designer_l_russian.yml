 jet_engine_6x_desc:0 "$engine_1_6x_desc$"
 rocket_engine_1:0 "Ракетный двигатель I"
 rocket_engine_1_desc:0 "Используя несколько крайне летучих видов топлива и столь же нестабильный окислитель, этот двигатель способен развивать огромную тягу и разгонять самолёт до высокой скорости, жертвуя дальностью полёта."
 rocket_engine_2:0 "Ракетный двигатель II"
 rocket_engine_2_desc:0 "Улучшение камеры сгорания и небольшие изменения топливной смеси позволяют добиться ещё более высоких характеристик, но дополнительно сокращают дальность полёта."
 rocket_engine_3:0 "Ракетный двигатель III"
 rocket_engine_3_desc:0 ""
 light_mg_2x:0 "2 легких пулемета"
 light_mg_2x_desc:0 "Два пулемёта винтовочного калибра дают небольшую прибавку огневой мощи против воздушных целей при весьма умеренной стоимости."
 light_mg_4x:0 "4 легких пулемета"
 light_mg_4x_desc:0 "Недостаток убойной силы у этой установки из четырёх пулемётов винтовочного калибра компенсируется плотностью огня."
 aircraft_cannon_1_1x:0 "1 орудие I"
 aircraft_cannon_1_1x_desc:0 "Автоматическая пушка обеспечивает значительную огневую мощь против воздушных целей, но дополнительный вес делает самолёт медленнее и менее манёвренным."
 aircraft_cannon_1_2x:0 "2 орудия I"
 aircraft_cannon_1_2x_desc:0 "Две автоматические пушки дают самолёту грозное курсовое вооружение против воздушных и небронированных наземных целей, но значительно увеличивают вес и снижают манёвренность."
 bomb_locks:0 "Бомбодержатели"
 bomb_locks_desc:0 "Крепления для небольших бомб под крыльями или фюзеляжем позволяют самолёту с некоторой надеждой на успех атаковать наземные цели."
 heavy_bomb_locks:0 "Держатели для тяжелых бомб"
 heavy_bomb_locks_desc:0 "Крепления для крупных бомб под крыльями или фюзеляжем позволяют самолёту эффективно атаковать наземные цели."
 armor_piercing_bomb_locks:0 "Держатели для бронебойных бомб"
 armor_piercing_bomb_locks_desc:0 "Крепления для крупных бронебойных бомб под крыльями или фюзеляжем позволяют самолёту эффективно атаковать морские цели."
 torpedo_mounting:0 "Крепления для легких торпед"
 torpedo_mounting_desc:0 "Узлы подвески позволяют закрепить под фюзеляжем лёгкую торпеду. Она становится мощным оружием против вражеских кораблей."
 torpedo_mounting_2:0 "Крепления для средних торпед"
 torpedo_mounting_2_desc:0 "Узлы подвески позволяют закрепить под фюзеляжем торпеду среднего веса. Она становится мощным оружием против вражеских кораблей."
 torpedo_mounting_3:0 "Крепления для тяжелых торпед"
 torpedo_mounting_3_desc:0 "Узлы подвески позволяют закрепить под фюзеляжем тяжёлую торпеду. Она становится мощным оружием против вражеских кораблей."
 armor_plate_small:0 "Броневые пластины"
 armor_plate_small_desc:0 "Стальные плиты за креслом пилота и вокруг двигателя повышают живучесть самолёта при обстреле с земли и атаках сзади."
 heavy_mg_2x:0 "2 тяжелых пулемета"
 heavy_mg_2x_desc:0 "Пара тяжёлых пулемётов позволяет пробивать усиленную обшивку современных самолётов."
 heavy_mg_4x:0 "4 тяжелых пулемета"
 heavy_mg_4x_desc:0 "Четыре тяжёлых пулемёта обеспечивают устрашающую огневую мощь как за счёт эффективности каждого оружия, так и благодаря плотности огня."
 aircraft_cannon_2_1x:0 "1 орудие II"
 aircraft_cannon_2_1x_desc:0 "Благодаря более крупному и мощному снаряду, чем у прежних автопушек, это оружие способно одним попаданием сбить даже крупный самолёт."
 aircraft_cannon_2_2x:0 "2 орудия II"
 aircraft_cannon_2_2x_desc:0 "Две пушки придают самолёту значительную ударную мощь, а повышенная плотность огня облегчает нанесение критических повреждений."
 large_aircraft_cannon_1x:0 "1 крупная пушка"
 large_aircraft_cannon_1x_desc:0 "Это оружие стреляет более крупными и мощными снарядами, чем прежние автопушки, хотя и с меньшей начальной скоростью, и способно одним попаданием сбить даже крупный самолёт."
 large_aircraft_cannon_2x:0 "2 крупные пушки"
 large_aircraft_cannon_2x_desc:0 "Две пушки придают самолёту значительную ударную мощь, а повышенная плотность огня облегчает нанесение критических повреждений."
 small_bomb_bay:0 "Маленький бомбовый отсек"
 small_bomb_bay_desc:0 "Небольшой внутренний отсек для бомб снижает сопротивление, но необходимые изменения конструкции не позволяют самолёту выполнять резкие манёвры в воздушном бою."
 medium_bomb_bay:0 "Средний бомбовый отсек"
 medium_bomb_bay_desc:0 "Бомбоотсек среднего размера позволяет нести достаточно боеприпасов для поражения самых разных целей."
 large_bomb_bay:0 "Большой бомбовый отсек"
 large_bomb_bay_desc:0 "Большой бомбоотсек вмещает достаточно боеприпасов, чтобы повредить или уничтожить даже обширные заводские комплексы и другие укреплённые цели."
 tank_buster_1:0 "Бортовая противотанковая пушка I"
 tank_buster_1_desc:0 "Эта пушка создана на основе армейского противотанкового орудия и при точном попадании способна уничтожать даже современные танки. Однако большой вес и громоздкая конструкция серьёзно ухудшают характеристики самолёта."
 tank_buster_2:0 "Противотанковая пушка II"
 tank_buster_2_desc:0 "Для борьбы с поступившими на вооружение более тяжёлыми танками требуется значительно более крупное орудие. Несмотря на огромный вес и неповоротливость, оно крайне эффективно при атаках вражеских позиций."
 fuel_tanks_small:0 "Дополнительные топливные баки"
 fuel_tanks_small_desc:0 "Выделение большего внутреннего объёма планера под топливо увеличивает дальность самолёта, но также заметно повышает его пожароопасность."
 self_sealing_fuel_tanks_small:0 "Протектированные топливные баки"
 self_sealing_fuel_tanks_small_desc:0 "Слой специально обработанной резины вокруг топливных баков позволяет им со временем затягивать пробоины, предотвращая потерю топлива и не давая одному попаданию вывести самолёт из строя."
 armor_plate_medium:0 "$armor_plate_small$"
 armor_plate_medium_desc:0 "Бронирование двигателей и наиболее уязвимых частей фюзеляжа значительно повышает живучесть самолёта, но сокращает дальность полёта."
 fuel_tanks_medium:0 "$fuel_tanks_small$"
 fuel_tanks_medium_desc:0 "$fuel_tanks_small_desc$"
 self_sealing_fuel_tanks_medium:0 "$self_sealing_fuel_tanks_small$"
 self_sealing_fuel_tanks_medium_desc:0 "$self_sealing_fuel_tanks_small_desc$"
 armor_plate_large:0 "$armor_plate_small$"
 armor_plate_large_desc:0 "Массивная стальная броня защищает двигатели, топливные баки и кабину экипажа, позволяя самолёту выдерживать всё, кроме прямого попадания зенитного снаряда, и сильно затрудняя его уничтожение истребителями."
 fuel_tanks_large:0 "$fuel_tanks_small$"
 fuel_tanks_large_desc:0 "$fuel_tanks_small_desc$"
 self_sealing_fuel_tanks_large:0 "$self_sealing_fuel_tanks_small$"
 self_sealing_fuel_tanks_large_desc:0 "$self_sealing_fuel_tanks_small_desc$"
 lmg_defense_turret:0 "Защитная турель с легким пулеметом"
 lmg_defense_turret_desc:0 "Хотя лёгкий пулемёт в турели слабоват для воздушного боя, он делает любую атаку на этот самолёт более опасной."
 lmg_defense_turret_2x:0 "2 защитные турели с легким пулеметом"
 lmg_defense_turret_2x_desc:0 "Два лёгких пулемёта в турелях с электроприводом перекрывают больше направлений и делают самолёт гораздо более сложной целью."
 hmg_defense_turret:0 "Защитная турель с тяжелым пулеметом"
 hmg_defense_turret_desc:0 "Тяжёлый пулемёт во вращающейся турели позволяет обороняющемуся с некоторой надеждой на успех отвечать истребителю, вооружённому схожим оружием."
 hmg_defense_turret_2x:0 "2 защитные турели с тяжелым пулеметом"
 hmg_defense_turret_2x_desc:0 "Две турели с электроприводом и тяжёлыми пулемётами превращают самолёт в опасную цель для любого атакующего истребителя."
 cannon_defense_turret:0 "Орудийная защитная турель"
 cannon_defense_turret_desc:0 "Современная пушка во вращающейся турели заметно меняет соотношение сил между обороняющимся и атакующим в воздушном бою. Немногие истребители способны выдержать прямое попадание современной пушки и продолжить бой."
 cannon_defense_turret_2x:0 "2 орудийных защитных турели"
 cannon_defense_turret_2x_desc:0 "Две турели с автоматическими пушками обеспечивают самолёту грозную оборонительную мощь и делают атаку на него крайне опасной для любого истребителя."
 rocket_rails:0 "Ракетные направляющие"
 rocket_rails_desc:0 "Неуправляемые ракеты подвешиваются под крыльями и запускаются вперёд по курсу самолёта, поэтому пилоту гораздо проще наводить их на цель, чем бомбы."
 bomb_sights_1:0 "Прицел для бомбометания I"
 bomb_sights_1_desc:0 "Сложный механический вычислитель учитывает снос ветром, конечную скорость и высоту, позволяя бомбардиру сбрасывать бомбы с высокой точностью."
 bomb_sights_2:0 "Прицел для бомбометания II"
 bomb_sights_2_desc:0 "Предыдущие поколения бомбовых прицелов часто требовали долгой настройки, прежде чем выдавали решение для сброса. Полностью стабилизированный прицел справляется за несколько секунд и способен учитывать даже пологое пикирование."
 radio_navigation_1:0 "Радионавигация I"
 radio_navigation_1_desc:0 "Радиопостановщик, слушающий пересечение двух довольно простых радионавигационных лучей, позволяющих найти цель даже в совершенной темноте."
 radio_navigation_2:0 "Радионавигация II"
 radio_navigation_2_desc:0 "Радиопостановщик, который также включает в себя ряд помощников по измерению расстояния, сообщает бомбардиру точный момент, когда бомбы должны быть выпущены, даже если он не может видеть цель."
 air_ground_radar_1:0 "Радар «воздух-земля» I"
 air_ground_radar_1_desc:0 "Бортовая радиолокационная станция даёт штурману точное изображение поверхности под самолётом, обеспечивая точную навигацию даже ночью или в плохую погоду."
 air_ground_radar_2:0 "Радар «воздух-земля» II"
 air_ground_radar_2_desc:0 "Более высокое разрешение по сравнению с предыдущими моделями позволяет этому радару обеспечивать точное бомбометание даже сквозь облачность."
 air_air_radar_1:0 "Радар «воздух-воздух» I"
 air_air_radar_1_desc:0 "Комплект радиолокационных антенн на самолёте позволяет обученному оператору обнаруживать воздушные цели даже в темноте."
 air_air_radar_2:0 "Радар «воздух-воздух» II"
 air_air_radar_2_desc:0 "Более мощный передатчик позволяет этому радару обнаруживать цели на большей дистанции."
 non_strategic_materials_small:0 "Использование нестратегических материалов"
 non_strategic_materials_small_desc:0 "Заменяя алюминий специально обработанной древесиной или тканью везде, где это возможно, можно резко сократить расход стратегических материалов. Однако дерево и ткань плохо выдерживают воздействие современного оружия."
 drop_tanks:0 "Сбрасываемые топливные баки"
 drop_tanks_desc:0 "Небольшие сбрасываемые баки с дополнительным топливом увеличивают дальность истребителей при наступательных вылетах. Поскольку перед боем их сбрасывают, они не ухудшают боевые характеристики."
 dive_brakes_small:0 "Аэродинамический тормоз"
 dive_brakes_small_desc:0 "Интерцепторы на задней кромке крыла раскрываются при входе в пикирование, снижая скорость и позволяя выйти из крутого пикирования, не разрушив крылья. Это даёт возможность атаковать почти вертикально и значительно повышает точность."
 non_strategic_materials_medium:0 "$non_strategic_materials_small$"
 non_strategic_materials_medium_desc:0 "$non_strategic_materials_small_desc$"
 non_strategic_materials_large:0 "$non_strategic_materials_small$"
 non_strategic_materials_large_desc:0 "$non_strategic_materials_small_desc$"
 floats:0 "Поплавки"
 floats_desc:0 "Комплект поплавков под планером позволяет самолёту садиться на воду. Это облегчает поиск вражеских морских сил, но резко снижает манёвренность."
 flying_boat_medium:0 "Летающая лодка"
 flying_boat_medium_desc:0 "Вместо установки шасси нижней части самолёта придают форму, позволяющую садиться на воду. Это значительно облегчает разведывательные полёты над морем."
 flying_boat_large:0 "$flying_boat_medium$"
 flying_boat_large_desc:0 "$flying_boat_medium_desc$"
 guided_anti_ship_missile:0 "Управляемая противокорабельная ракета"
 guided_anti_ship_missile_desc:0 "По сути это противокорабельная бомба с ракетным двигателем и радиоуправлением. Новое оружие представляет серьёзную угрозу для любого находящегося на плаву корабля."
 bouncing_bomb_release:0 "Механизм сброса прыгающей бомбы"
 bouncing_bomb_release_desc:0 "Бомбодержатель для перевозки и сброса специальных прыгающих бомб, которые скользят по поверхности воды до столкновения с целью. При сбросе механизм придаёт бомбе обратное вращение, повышая вероятность попадания в намеченный элемент конструкции."
 earthshaker_bomb_release:0 "Механизм сброса сейсмической бомбы"
 earthshaker_bomb_release_desc:0 "Бомбодержатель и механизм сброса гигантских сейсмических бомб, предназначенных для проникновения в грунт при ударе и подземного взрыва, наносящего цели тяжёлые конструкционные повреждения."
 rocket_propelled_bombs:0 "Реактивные бомбы"
 rocket_propelled_bombs_desc:0 "Неуправляемые бомбы с ракетным ускорителем способны наносить значительный ущерб кораблям и другим крупным бронированным целям."
 improved_rocket_propelled_bombs:0 "Тяжелые реактивные бомбы"
 improved_rocket_propelled_bombs_desc:0 "Ещё более крупные неуправляемые бомбы с ракетным ускорителем несут усиленный заряд и способны ещё эффективнее пробивать цель."
 fixed_explosive_charge:0 "Прикрепленный взрывной заряд"
 fixed_explosive_charge_desc:0 "Неподвижный кумулятивный заряд превращает самолёт в летающую бомбу. Если направить его во вражеский корабль, разрушения будут огромными, но самолёт и экипаж неизбежно погибнут."
 recon_camera:0 "Камера разведки"
 recon_camera_desc:0 "Комплект камер со специальными объективами позволяет самолёту делать точные снимки вражеских соединений и объектов даже с большой высоты."
 airdropped_mines:0 "Сбрасываемые мины"
 airdropped_mines_desc:0 "Комплект морских мин с парашютами, позволяющими сбрасывать их с самолёта."
 demining_coil:0 "Саперная катушка"
 demining_coil_desc:0 "Крупная катушка на планере создаёт мощное магнитное поле, вызывающее подрыв магнитных мин на пути самолёта."
 small_plane_airframe_0:0 "Корпус маленького самолета межвоенных лет"
 small_plane_airframe_0_desc:0 "Со времён начала Великой войны авиация развивалась семимильными шагами. Этот планер воплощает итог всех этих разработок, однако очевидно, что возможности его дальнейшего совершенствования ограничены."
 small_plane_airframe_1:0 "Базовый корпус маленького самолета"
 small_plane_airframe_1_desc:0 "В последние годы появился целый ряд новых технологий, позволяющих создавать весьма эффективные самолёты небольшого размера. Этот планер представляет собой лишь первый шаг на этом пути."
 small_plane_airframe_2:0 "Улучшенный корпус маленького самолета"
 small_plane_airframe_2_desc:0 "Благодаря улучшенной аэродинамике и более прочной конструкции этот планер является заметным шагом вперёд по сравнению с базовой моделью."
 small_plane_airframe_3:0 "Усовершенствованный корпус маленького самолета"
 small_plane_airframe_3_desc:0 "Этот планер, тщательно оптимизированный для достижения максимальных характеристик, представляет собой предел возможностей самолёта с поршневым двигателем."
 small_plane_airframe_4:0 "Корпус современного маленького самолета"
 small_plane_airframe_4_desc:0 "Этот планер создан с расчётом на высокие скорости, обеспечиваемые современными двигателями, и позволяет решить некоторые конструктивные проблемы, возникающие при полёте на высоких дозвуковых скоростях."
 small_plane_airframe_5:0 "Корпус маленького сверхзвукового самолета"
 small_plane_airframe_5_desc:0 "Этот передовой планер, способный развивать сверхзвуковую скорость в 1 Мах, воплощает вершину инженерной мысли человечества."
