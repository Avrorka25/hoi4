 kazakhstan.1.t:0 "[FROM.GetName] предлагает сотрудничество в области вооружений"
 kazakhstan.1.desc:0 "Наш союзник [FROM.GetNameDef] предложил сотрудничать в области ракетной техники и ядерного оружия. У них имеются стратегические залежи делящихся материалов, а географическое положение и демография делают их территорию идеальной для секретных испытаний ракет."
 kazakhstan.1.a:0 "Мы должны вложиться в эти отношения."
 kazakhstan.1.b:0 "Нам не нужна их помощь."
 kazakhstan.2.t:0 "[FROM.GetAdjective] принимают сотрудничество"
 kazakhstan.2.desc:0 "[FROM.GetNameDefCap] приняла наше предложение о сотрудничестве в разработке новых видов вооружений и планирует инвестировать в нас и обеспечить нашу защиту."
 kazakhstan.2.a:0 "Отлично."
 kazakhstan.3.t:0 "[FROM.GetAdjective] отказываются от сотрудничества"
 kazakhstan.3.desc:0 "[FROM.GetNameDefCap] отклонила наше предложение о сотрудничестве в разработке новых видов вооружений."
 kazakhstan.3.a:0 "Мы справимся и сами."
