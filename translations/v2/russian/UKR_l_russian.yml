l_russian:
 UKR_generic_naval_manufacturer:0 "Николаевский судостроительный завод"
 UKR_generic_industrial_concern:0 "Азовсталь"
 UKR_generic_medium_aircraft_manufacturer:0 "Харьковский авиационный завод"
 UKR_generic_light_aircraft_manufacturer:0 "Завод гражданской авиации № 410"
 UKR_generic_heavy_aircraft_manufacturer:0 "Государственный авиационный завод № 12"
 UKR_generic_motorized_equipment_manufacturer:0 "Завод № 183"
 UKR_generic_artillery_manufacturer:0 "Завод «Арсенал»"
 UKR_generic_infantry_equipment_manufacturer:0 "Шосткинский пороховой завод"
 UKR_shostka_powder_plant:0 "Шосткинский пороховой завод"
 UKR_generic_electronics_concern:0 "Харьковский радиозавод"
 UKR_dzerzhinsky_phenol_plant:0 "Фенольный завод имени Дзержинского"
 UKR_cult_of_action_idea:0 "Культ действия"
 UKR_cossack_heritage_idea:0 "Казацкое наследие"
 UKR_united_ukraine:0 "Единая Украина"
 UKR_ukrainian_unification_category:0 "Объединение Украины"
 UKR_unite_ukraine_decision:0 "Объединить Украину"
 UKR_claim_greater_ukraine:0 "Предъявить права на Великую Украину"
 UKR_proclaim_greater_ukraine:0 "Провозгласить Великую Украину"
 UKR_restore_ukranian_placenames:0 "Восстановить [UKR.GetNonIdeologyAdjectiveCap] топонимы"
 UKR_contact_west_ukrainians:0 "[UKR.GetNonIdeologyAdjectiveCap] Запад — установить связь"
 UKR_ukranianize_the_west:0 "[UKR.GetNonIdeologyAdjectiveCap]Знать Запад"
 UKR_multinational_army_command:0 "Многонациональное армейское командование"
 UKR_join_integrated_army_command:0 "Присоединиться к объединённому армейскому командованию"
 UKR_integrated_air_workshops:0 "Объединённые авиационные мастерские"
 UKR_mykola_lebed:0 "Микола Лебедь"
 UKR_reborn_through_war:0 "Возрождены войной"
 UKR_reborn_through_war_desc:0 "Украинский народ снова свободен, теперь мы защитим свой дом!"
 UKR_free_and_at_peace:0 "Свободны и живём в мире"
 UKR_free_and_at_peace_desc:0 "Украина теперь свободна и живёт в мире, настало время начать индустриализацию."
 UKR_industrial_technologies:0 "Промышленные технологии"
 UKR_industrial_technologies_desc:0 "Наша промышленность безнадёжно устарела, мы должны принять меры, чтобы догнать остальной мир."
 UKR_industrial_development:0 "Промышленное развитие"
 UKR_industrial_development_desc:0 "Теперь, когда наша страна должным образом обустроена, настало время инвестировать в гражданский сектор экономики."
 UKR_construction_technologies:0 "Строительные технологии"
 UKR_construction_technologies_desc:0 "Наша экономика растёт устойчивыми темпами, и мы не должны позволить этому росту пропасть впустую."
 UKR_develop_the_west:0 "Развивать Запад"
 UKR_develop_the_west_desc:0 "Украинская экономика быстро растёт, и мы должны воспользоваться этой возможностью, чтобы удвоить усилия по развитию гражданского сектора."
 UKR_railway_construction:0 "Строительство железных дорог"
 UKR_railway_construction_desc:0 "Наши железные дороги были построены давно и нуждаются в модернизации."
 UKR_road_construction:0 "Строительство дорог"
 UKR_road_construction_desc:0 "Чтобы наша экономика была эффективной с точки зрения логистики, мы должны вкладываться в общественные дороги."
 UKR_invest_along_the_coast:0 "Инвестиции вдоль побережья"
 UKR_invest_along_the_coast_desc:0 "Наши прибрежные города являются одним из важнейших факторов роста экономики, и мы должны инвестировать в них."
 UKR_azovstal:0 "Азовсталь"
 UKR_azovstal_desc:0 "После открытия «Азовстали» в 1930 году она быстро стала краеугольным камнем сталелитейной отрасли Украины, и мы должны продолжать развивать это преимущество."
 UKR_coal_mining:0 "Добыча угля"
 UKR_coal_mining_desc:0 "Как и наша первоначальная промышленность, наши шахты устарели и были недостаточно развиты; мы должны это исправить."
 UKR_heavy_steel_production:0 "Производство тяжёлой стали"
 UKR_heavy_steel_production_desc:0 "Чтобы повысить наш потенциал в кораблестроении и бронетехнике, нам необходимо инвестировать в производство более тяжёлых сортов стали."
 UKR_integrated_weapon_developments:0 "Объединённые разработки вооружений"
 UKR_integrated_weapon_developments_desc:0 "Используя знания, полученные на поле боя, мы можем больше инвестировать в наши исследовательские проекты."
 UKR_organize_the_army:0 "Организовать армию"
 UKR_organize_the_army_desc:0 "Наша армия молода и неопытна, ей необходима надлежащая организация."
 UKR_use_the_morozov_design_bureau:0 "Использовать конструкторское бюро Морозова"
 UKR_use_the_morozov_design_bureau_desc:0 "Конструкторское бюро Морозова было основано в 1927 году и теперь находится под нашим контролем. Настало время использовать его для наших собственных проектов."
 UKR_diversify_factory_183:0 "Диверсифицировать завод № 183"
 UKR_diversify_factory_183_desc:0 "Завод Малышева, или «Завод № 183», как его недавно переименовали, в прошлом в основном использовался для производства локомотивов. Теперь настало время диверсифицировать его работу и уделить больше внимания моторизации."
 UKR_motorized_support:0 "Моторизованная поддержка"
 UKR_motorized_support_desc:0 "Мобильность и защита имеют решающее значение для безопасной доставки пехоты на поле боя и её вывода оттуда. Сосредоточившись на этих разработках, мы сможем действовать быстрее."
 UKR_kharkiv_locomotive_plant:0 "Харьковский паровозостроительный завод"
 UKR_kharkiv_locomotive_plant_desc:0 "Завод Малышева исторически производил локомотивы; нам следует расширить это направление и модернизировать локомотивную промышленность."
 UKR_railway_artillery:0 "Железнодорожная артиллерия"
 UKR_railway_artillery_desc:0 "Установленные на железнодорожных платформах артиллерийские орудия — смелая, но эффективная идея, появившаяся во время Великой войны; мы должны инвестировать в неё и модернизировать её под наши нужды."
 UKR_arsenal_factory:0 "Оружейный завод «Арсенал»"
 UKR_arsenal_factory_desc:0 "Наша страна отчаянно нуждается в оружии, и эту проблему необходимо решить."
 UKR_diversify_artillery_types:0 "Разнообразить виды артиллерии"
 UKR_diversify_artillery_types_desc:0 "Со времён Великой войны артиллерия прошла долгий путь; теперь настало время разнообразить и модернизировать нашу собственную."
 UKR_small_arms_equipment:0 "Стрелковое вооружение"
 UKR_small_arms_equipment_desc:0 "Запасы нашего стрелкового оружия сокращаются, а само оно устаревает; обе эти проблемы необходимо решить."
 UKR_infantry_anti_tank_tactics:0 "Противотанковая тактика пехоты"
 UKR_infantry_anti_tank_tactics_desc:0 "Мы должны использовать опыт борьбы с советскими танками и разработать надлежащий ответ на более тяжёлую бронетехнику."
 UKR_winter_equipment:0 "Зимнее снаряжение"
 UKR_winter_equipment_desc:0 "У нас есть опыт суровых зим, подобных российским; мы должны приспособиться к ним и использовать этот фактор против наших врагов."
 UKR_forest_training:0 "Подготовка к боям в лесах"
 UKR_forest_training_desc:0 "Украина густо покрыта лесами, а наши войска знакомы с этой местностью; мы должны использовать эти знания."
 UKR_modern_combat_doctrine:0 "Современные боевые доктрины"
 UKR_modern_combat_doctrine_desc:0 "Используя знания, полученные после Великой войны, мы можем привести наш военный опыт в соответствие с современностью."
 UKR_look_to_the_skies:0 "Взглянуть в небеса"
 UKR_look_to_the_skies_desc:0 "Кто никогда не мечтал летать?"
 UKR_build_trainer_aircrafts:0 "Строить учебные самолёты"
 UKR_build_trainer_aircrafts_desc:0 "Надо же с чего-то начинать, верно? Пулемёты добавим потом..."
 UKR_kharkiv_aviation_factory:0 "Харьковский авиационный завод"
 UKR_kharkiv_aviation_factory_desc:0 "Харьковский авиационный завод был основан в 1926 году и сыграл важнейшую роль в нашем авиационном производстве; его следует развивать дальше."
 UKR_kyiv_aviation_plant_12:0 "Киевский авиационный завод № 12"
 UKR_kyiv_aviation_plant_12_desc:0 "Серийный завод Антонова был основан в 1920 году и сыграл важнейшую роль в нашем авиационном производстве; его следует развивать дальше."
 UKR_train_pilots:0 "Обучать пилотов"
 UKR_train_pilots_desc:0 "В украинских ВВС нет сколько-нибудь выдающихся пилотов; мы должны принять программу, которая это изменит."
 UKR_support_designers_innovations:0 "Поддержать инновации конструкторов"
 UKR_support_designers_innovations_desc:0 "Нам необходимо поддерживать инновации наших конструкторов."
 UKR_train_mechanics:0 "Обучать механиков"
 UKR_train_mechanics_desc:0 "Нам необходимо должным образом обучать механиков для наших авиационных предприятий."
 UKR_refine_air_doctrine:0 "Усовершенствовать воздушные доктрины"
 UKR_refine_air_doctrine_desc:0 "Мы должны выделить значительные ресурсы на разработку новых теорий воздушной войны. Если начнётся война, созданные нами теории окажутся бесценными."
 UKR_radar_network:0 "Создать радиолокационную сеть"
 UKR_radar_network_desc:0 "Сейчас в Украине отсутствует радиолокационная сеть, и это необходимо исправить."
 UKR_naval_aviation:0 "Морская авиация"
 UKR_naval_aviation_desc:0 "У Украины почти нет опыта создания морских самолётов; если мы хотим оспаривать господство в Чёрном море, это должно измениться."
 UKR_elect_the_verkhovna_rada:0 "Избрать Верховную Раду"
 UKR_elect_the_verkhovna_rada_desc:0 "Если Украина действительно хочет быть свободной, мы должны провести выборы в парламент и закрепить своё положение как процветающего демократического государства."
 UKR_economic_reforms:0 "Экономические реформы"
 UKR_economic_reforms_desc:0 "После учреждения Верховной Рады её первой задачей должно стать проведение экономических реформ."
 UKR_encourage_exports:0 "Поощрять экспорт"
 UKR_encourage_exports_desc:0 "Украина всегда служила житницей великих империй; теперь мы воспользуемся этим преимуществом сами и будем поощрять дальнейший рост экспорта."
 UKR_invite_foreign_investors:0 "Пригласить иностранных инвесторов"
 UKR_invite_foreign_investors_desc:0 "Если мы хотим, чтобы наша экономика процветала в сравнении с коммунистической, нам необходимо привлекать иностранных инвесторов."
 UKR_protect_crimea:0 "Защитить Крым"
 UKR_protect_crimea_desc:0 "Крым считается одним из наших братьев, и мы должны защитить его."
 UKR_why_we_fight:0 "Почему мы сражаемся"
 UKR_why_we_fight_desc:0 "Мир становится всё опаснее. Наш народ должен увидеть зверства, совершаемые теми, кто жаждет власти. Настало время сплотить людей вокруг нашего дела и убедиться, что каждый готов сражаться за нашу свободу."
 UKR_join_the_allies:0 "Присоединиться к Союзникам"
 UKR_join_the_allies_desc:0 "Наши демократические взгляды сблизили нас с великими державами Запада. Теперь настало время присоединиться к их союзу и бороться против крайних и опасных идеологий — фашизма и коммунизма."
 UKR_approach_poland:0 "Сблизиться с Польшей"
 UKR_approach_poland_desc:0 "Польша и Украина всегда были тесно связаны; мы должны закрепить эту идею и вступить в переговоры с польским правительством в Варшаве."
 UKR_join_intermarium:0 "Киевский договор"
 UKR_join_intermarium_desc:0 "Пилсудский выдвинул идею Междуморья; теперь настало время воплотить её в жизнь."
 UKR_a_condominium_in_western_ukraine:0 "Кондоминиум в Западной Украине"
 UKR_a_condominium_in_western_ukraine_desc:0 "Поскольку поляки контролируют территорию со значительным украинским меньшинством, нам следует убедить их предоставить ему автономию и содействовать дальнейшей интеграции в наше государство."
 UKR_military_cooperation_with_poland:0 "Военное сотрудничество с Польшей"
 UKR_military_cooperation_with_poland_desc:0 "Для дальнейшего развития наших вооружённых сил нам следует теснее сотрудничать с поляками, чтобы повысить возможности обеих стран на случай войны."
 UKR_common_doctrinal_development:0 "Совместное развитие доктрины"
 UKR_common_doctrinal_development_desc:0 "После создания кондоминиума мы должны обеспечить единый подход к военному делу, чтобы повысить сплочённость перед лицом внешних угроз."
 UKR_continue_communist_rule:0 "Продолжить коммунистическое правление"
 UKR_continue_communist_rule_desc:0 "Несмотря на независимость от Москвы, лучший путь вперёд — сохранить Украинскую ССР и следовать коммунистической модели."
 UKR_encourage_the_proletariat:0 "Поддержать пролетариат"
 UKR_encourage_the_proletariat_desc:0 "Пролетариат Украины следует поощрять к труду на благо государства."
 UKR_political_batallions:0 "Политические батальоны"
 UKR_political_batallions_desc:0 "Следует призвать пролетариат Украины взяться за оружие и сформировать политические батальоны для службы в армии."
 UKR_political_commissars:0 "Политические комиссары"
 UKR_political_commissars_desc:0 "После создания полностью независимой Украинской ССР нам следует поощрять пролетариат Украины занимать политические должности на благо государства."
 UKR_red_army:0 "Красная армия [ROOT.GetAdjective]"
 UKR_red_army_desc:0 "Все патриоты, любящие родину, должны исполнить свой долг и защищать её. По примеру наших советских соседей мы сформируем Украинскую Красную армию, которая будет защищать нашу молодую революцию."
 UKR_revolutionary_guards:0 "Революционная гвардия"
 UKR_revolutionary_guards_desc:0 "После создания полностью независимой Украинской ССР нам следует учредить ведомство для борьбы с буржуазией как внутри Украины, так и за её пределами."
 UKR_empower_the_head_of_state:0 "Расширить полномочия главы государства"
 UKR_empower_the_head_of_state_desc:0 "Один лидер и никаких противостояний, идеал для всех быть свободными и счастливыми. Правда? Правильно???"
 UKR_we_were_born_in_a_great_hour:0 "Мы родились в великий час"
 UKR_we_were_born_in_a_great_hour_desc:0 "Это гимн ОУН, как «это был их лучший час», но немного более злой и как песня. Да, мои работы потеряли всю последовательность в этот момент, так что я ломаю 4-ю стену, веселитесь."
 UKR_cement_military_rule:0 "Укрепить военное правление"
 UKR_cement_military_rule_desc:0 "Униформа, оружие, война. Это игра в войну, вы, вероятно, хотите эти вещи."
 UKR_cult_of_action:0 "Культ действия"
 UKR_cult_of_action_desc:0 "Культ действия ради самого действия — распространённая черта фашизма; это не является особенностью ОУН, и не проверялось, насколько она была для них характерна. Полагаю, политические убийства и терроризм в Восточной Польше/Западной Украине можно считать примером."
 UKR_oun_militias:0 "Ополчение ОУН"
 UKR_oun_militias_desc:0 "Знаешь, что нам нужно в нашей армии? Младшие мальчики!"
 UKR_join_the_axis:0 "Присоединиться к Оси"
 UKR_join_the_axis_desc:0 "Они хорошие ребята, я имею в виду, посмотрите на их униформу. Только хорошие парни носят только коричневое или черное, нет?"
 UKR_demand_ukrainian_bessarabia:0 "Потребовать украинскую Бессарабию"
 UKR_demand_ukrainian_bessarabia_desc:0 "Буковина и Южная Бессарабия по праву наши. Фраза, которую мы быстро позаимствовали из любого другого националистического дискурса."
 UKR_embrace_the_1919_map:0 "Принять карту 1919 года"
 UKR_embrace_the_1919_map_desc:0 "В 1919 году украинская делегация представила в Версале карту Украины. Не все заявленные территории в то время контролировались украинским правительством: притязания простирались на север до Брест-Литовска и включали Кубань на востоке."
 UKR_restore_the_hetmanate:0 "Восстановить Гетманат"
 UKR_restore_the_hetmanate_desc:0 "Знаете, кто должен нами руководить? Казак, который отрёкся от власти спустя несколько месяцев двадцать лет назад... что вообще может пойти не так?"
 UKR_obtain_church_blessings:0 "Получить благословение Церкви"
 UKR_obtain_church_blessings_desc:0 "Давайте помолимся иконам, чтобы спасти гетмана."
 UKR_cossack_heritage:0 "Казацкое наследие"
 UKR_cossack_heritage_desc:0 "Казаки идут на войну верхом, возможно, при поддержке татчанков..."
 UKR_defy_the_polish_cossack:0 "Бросить вызов польскому казаку"
 UKR_defy_the_polish_cossack_desc:0 "Павел Бермондт-Авалов - живое противоречие. Казачий король Польши? Какое абсурдное утверждение, это звучит как выдумка. Только гетман должен руководить казаками."
 UKR_ally_with_bermondt_avalov:0 "Союз с Бермондтом-Аваловым"
 UKR_ally_with_bermondt_avalov_desc:0 "Павел Бермондт-Авалов предлагает возможность из проказного казачьего союза против [SOV.GetNameDef]."
 UKR_our_place_in_the_world:0 "Наше место в мире"
 UKR_our_place_in_the_world_desc:0 "Наше место в мире - в Украине, легко нет?"
 UKR_free_the_oppressed_cossacks:0 "Освободить угнетённых казаков"
 UKR_free_the_oppressed_cossacks_desc:0 "Русские угнетали украинцев почти три столетия. Она должна прекратиться раз и навсегда. Хуже того, они использовали кубанских казаков в качестве головорезов царизма. Им пора заново научиться истинной свободе и оправиться от советской декозакизации."
 UKR_take_a_pro_russian_stance:0 "Занять пророссийскую позицию"
 UKR_take_a_pro_russian_stance_desc:0 "Россия хорошая, Западная Европа плохая. Я устала, будущая я больше не могу писать серьезные тексты. (Надеюсь, вам понравится игра)."
 UKR_alliance_with_the_kaiserreich:0 "Союз с Кайзеррейхом"
 UKR_alliance_with_the_kaiserreich_desc:0 "Возвращение Гогенцоллернов на германский престол даёт возможность вступить в их союз, чтобы защищать божественное право на власть."
 UKR_revise_the_defence_industry:0 "Пересмотреть оборонную промышленность"
 UKR_revise_the_defence_industry_desc:0 "Только оружие защитит вновь обретённую нами свободу."
 UKR_legacy_of_the_sich_riflemen:0 "Наследие сечевых стрельцов"
 UKR_legacy_of_the_sich_riflemen_desc:0 "Сечевые стрельцы были украинцами, служившими во время Великой войны. Одним из самых известных их командиров является наш нынешний король, который, разумеется, очень дорожит этим подразделением и его престижем."
 UKR_rally_around_the_king:0 "Сплотиться вокруг короля"
 UKR_rally_around_the_king_desc:0 "Он наш король!"
 UKR_unite_ukraine:0 "[ROOT.GetNonIdeologyName] в едином государстве"
 UKR_unite_ukraine_desc:0 "Теперь, когда мы обрели независимость, пришло время вернуть наши законные территории и объединить наш народ в единой стране."
 UKR_mykhailo_omelianovych_pavlenko:0 "Михайло Омелянович-Павленко"
 UKR_pavlo_shandruk:0 "Павло Шандрук"
 UKR_nikolai_belichkovsky:0 "Николай Величковский"
 UKR_andriy_melnyk:0 "Андрей Мельник"
 UKR_samiylo_pidgirsky:0 "Самийло Пидгирский"
 UKR_stepan_vytvytskyj:0 "Степан Витвицкий"
 UKR_antin_hobachevsky:0 "Антин Горбачевский"
 UKR_wolodymyr_zahajkewycz:0 "Володимир Загайкевич"
 UKR_eugene_archipenko:0 "Евгений Архипенко"
 UKR_polycarp_sikorsky:0 "Поликарп Сикорский"
 UKR_klepachivskyi_iosypovych:0 "Клепачивский Иосипович"
 UKR_revolt:0 "[UKR.GetNonIdeologyAdjectiveCap] восстание"
 ukraine.1.t:0 "[UKR.GetNonIdeologyName] провозглашает независимость"
 ukraine.1.d:0 "Пока Красная армия была полностью мобилизована для подавления мятежа белых войск Власова, Украина считалась малозначимым регионом, где восстание представлялось маловероятным из-за многочисленных кампаний по умиротворению, проведённых здесь.\n\nПохоже, мы недооценили влияние восстания на регион: советские флаги уже начали снимать и заменять сине-жёлтыми, а чрезвычайное правительство, собравшееся в [UKR.Capital.GetCapitalVictoryPointName], в одностороннем порядке объявило о воссоздании [UKR.GetNameDef].\n\nТеперь очевидно, что вернуть этот регион можно лишь силой."
 ukraine.1.a:0 "Эти предатели будут разгромлены!"
 ukraine.1.b:0 "Заключить мир — лучший выбор."
 ukraine.2.t:0 "Мир с [UKR.GetNonIdeologyName]"
 ukraine.2.d:0 "То, что начиналось как простое восстание, превратилось в настоящую войну за независимость Украины. Наши солдаты не смогли удержать [UKR.Capital.GetCapitalVictoryPointName], а [UKR.GetNonIdeologyAdjectiveCap] армия теперь достаточно организована, чтобы начать входить на территории, до сих пор находившиеся под нашим контролем.\n\nМы не можем позволить себе продолжать войну, которая уже обошлась нам так дорого, поэтому пригласили министра иностранных дел временного [UKR.GetNonIdeologyAdjectiveCap] правительства для переговоров о мире между нашими двумя странами, признавая независимость [UKR.GetNonIdeologyName] и передавая им все территории, которые они считают [UKR.GetNonIdeologyAdjectiveCap] и которые находятся в их руках."
 ukraine.2.a:0 "Мы заключим мир"
 ukraine.2.b:0 "Никогда! [UKR.GetNonIdeologyName] останется [SOV.GetNonIdeologyAdjectiveCap]!"
 ukraine.3.t:0 "Компромисс в Западной [UKR.GetNonIdeologyName]?"
 ukraine.3.desc:0 "[UKR.GetAdjective] правительство предлагает создать [UKR.GetNonIdeologyAdjectiveCap] кондоминиум на Волыни и в Восточной Галиции. Он предоставит автономию [UKR.GetNonIdeologyAdjectiveCap] населению Западной Украины, разрешив этническую напряжённость между [UKR.GetNonIdeologyAdjectiveCap] и [POL.GetNonIdeologyAdjectiveCap] общинами. Предложение предусматривает создание правительства, в основном укомплектованного членами Украинского национально-демократического объединения, но под надзором Генрика Юзевского как представителя польского правительства. Помимо местной автономии, [UKR.GetNonIdeologyAdjectiveCap] требуют некоторых экономических уступок."
 ukraine.3.a:0 "Небольшая уступка в общей картине."
 ukraine.3.b:0 "Польша не будет разделена."
 ukraine.4.t:0 "[POL.GetNonIdeologyName] принимает наше предложение"
 ukraine.4.desc:0 "После нашего обращения Польша создала автономный регион в Западной Украине. Была образована [DOU.GetNameDefCap]. Хотя технически она всё ещё находится за пределами Украины, это обеспечит равные права для всех и позволит нам углубить сотрудничество с поляками, одновременно удерживая наиболее националистические элементы ОУН в относительном спокойствии."
 ukraine.4.a:0 "Да здравствует украинско-польская дружба!"
 ukraine.5.t:0 "[POL.GetNonIdeologyName] отклоняет наше предложение"
 ukraine.5.desc:0 "В ответ на наше предложение создать кондоминиум в Западной Украине [POL.GetAdjective] правительство отвергло эту идею и намерено сохранять регион под своим контролем в обозримом будущем."
 ukraine.5.a:0 "Будь они прокляты!"
 ukraine.6.t:0 "Присоединиться к объединённому командованию?"
 ukraine.6.desc:0 "[UKR.GetAdjective] военные разработали план повышения эффективности наших объединённых вооружённых сил. Если членов [ROOT.GetFactionName] объединить под единым командованием, они смогут эффективнее использовать общие ресурсы."
 ukraine.6.a:0 "Присоединиться к объединённому командованию."
 ukraine.6.b:0 "Вежливо отказаться."
 ukraine.7.t:0 "Украина требует заявленные территории"
 ukraine.7.d:0 "\n[UKR.GetLeader] угрожает войной и требует передать территории со значительным украинским населением: [80.GetName] и [766.GetName]."
 ukraine.7.a:0 "Небольшая цена за мир."
 ukraine.7.b:0 "Немыслимо"
 ukraine.8.t:0 "[766.Owner.GetNonIdeologyName] принимает наши требования"
 ukraine.8.d:0 "Украинские территории возвращены, а местные украинцы радуются этой внезапной политической перемене."
 ukraine.8.a:0 "Ура"
 ukraine.9.t:0 "[766.Owner.GetAdjective] правительство отвергло наши требования"
 ukraine.9.d:0 "[766.Owner.GetNonIdeologyName] отверг наш ультиматум, заявив, что дипломатия не должна вестись посредством угроз и что они готовы защищать свои границы."
 ukraine.9.a:0 "Что ж, хорошо."
 ukraine.10.t:0 "Дискуссия о монархии"
 ukraine.10.desc:0 "Если мы собираемся восстановить монархию для нашей славной нации, нам необходимо сплотиться вокруг человека, способного повести наших героев в бой. Появились два законных кандидата. Павел Скоропадский, гетман 1919 года, пользуется поддержкой кавалерии, тогда как ветераны Карпатской Сечи с теплотой вспоминают руководство Вильгельма фон Габсбурга, которого его люди называли Василем Вышиваным."
 ukraine.10.a:0 "Павел Скоропадский станет нашим гетманом!"
 ukraine.10.b:0 "Василя Вышиваного нужно вернуть из изгнания!"
