 NOR_nordic_research_name:0 "Северное исследовательское сотрудничество"
 NOR_nordic_research_desc:0 "Северные страны объединились в соглашение об обмене исследованиями ради общего блага. В целом сотрудничество крепкое, а в некоторых областях северные страны являются первопроходцами, поэтому оно может стать мировым лидером."
 NOR_royal_norwegian_society_name:0 "Королевское норвежское общество"
 NOR_royal_norwegian_society_desc:0 "Королевское норвежское общество пригласило союзные страны к международному сотрудничеству в науке и технологиях. С благословения норвежского монарха наши исследования стали престижнее, чем когда-либо."
 NOR_allied_research_name:0 "Исследовательское сотрудничество союзников"
 NOR_allied_research_desc:0 "Исследовательское сотрудничество с британцами через море принесёт пользу всем и особенно поможет малым союзникам догнать ведущие державы."
 NOR_german_research_name:0 "Германское исследовательское сотрудничество"
 NOR_german_research_desc:0 "Сотрудничество с крупнейшей промышленной державой Центральной Европы поможет всем участникам привести технологии и снаряжение к современному уровню."
 NOR_soviet_research_name:0 "Советское исследовательское сотрудничество"
 NOR_soviet_research_desc:0 "Советы, живущие в огромной и разнообразной стране Восточной Европы и Северной Азии, сами стали первопроходцами в ряде технологий и могут быть сильным лидером исследований, у которого многим есть чему учиться."
 NOR_mountain_tactics:0 "Тактика лыжной пехоты"
 NOR_mountain_tactics_desc:0 "Норвежская тактика для высокогорья и холодного климата включает рейдовые атаки лыжной пехоты и использование пересечённой местности для укрытия или обзора.\n\nНаши части смогут двигаться быстрее и наносить более сильные удары в горах!"
 NOR_concealed_skirmishers:0 "Замаскированные стрелки"
 NOR_concealed_skirmishers_desc:0 "Пока враг наступает, наши стрелки ведут точный огонь из винтовок и пулемётов с укрытых позиций, заставляя противника остановиться. Пока он готовит контратаку, стрелки успевают отойти."
 NOR_asw_equipment_bonus:0 "Бонус к противолодочному оборудованию"
 NOR_torpedo_equipment_bonus:0 "Бонус к торпедному оборудованию"
 NOR_naval_gunnery_equipment_bonus:0 "Бонус к корабельной артиллерии"
 NOR_naval_technology_bonus:0 "Бонус к военно-морским технологиям"
 NOR_bomber_plane_bonus:0 "Бонус к бомбардировщикам"
