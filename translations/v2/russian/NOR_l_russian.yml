l_russian:
 norwegian_focus:0 "Национальные фокусы Норвегии"
 FOCUS_FILTER_NAW_UNIQUE_TACTICS:0 "Уникальные тактики и технологии"
 NOR_wip_tt:0 "\n§RРАБОТА В ПРОЦЕССЕ§! — Полная функциональность этого §Yфокуса§! ещё не реализована. Пока лучше выбрать другой путь, так как сейчас он работает лишь частично.\n"
 NOR_wip_light_tt:0 "\n§RРАБОТА В ПРОЦЕССЕ§! — Основная функциональность этого §Yфокуса§! уже реализована, но он ещё не проработан полностью. Тем не менее фокус можно выбирать без проблем, и часть игрового содержимого уже добавлена.\n"
 NOR_enable_puppet_states_tt:0 "Позволяет создавать §Yмарионеточные государства§! на мирных конференциях.\n"
 NOR_icelandic_subject_benefits_tt:0 "\nЕсли §YИсландия§! существует как наш автономный §Yсубъект§! или входит в наш §Yальянс§!, она также получит преимущества этой политики.\n\n"
 NOR_political_advisor_needed_tt:0 "\nДля завершения перехода к новой §Yформе правления§! понадобится §Yполитический советник§! — через выборы, референдум или силой.\n\n"
 NOR_new_commanders_enabled_tt:0 "\nПосле завершения будут доступны новые §Yкомандующие§! для службы в полевых войсках.\n"
 NOR_enable_british_naval_procurements_tt:0 "\nСоглашение с британцами позволит принимать §Yрешения§! о закупке британских §Yкораблей§! и §Yподводных лодок§! для норвежского флота.\n"
 NOR_enable_german_naval_procurements_tt:0 "\nСоглашение с немцами позволит принимать §Yрешения§! о закупке германских §Yкораблей§! и §Yподводных лодок§! для норвежского флота.\n"
 NOR_cosmetic_tag_enabled_tt:0 "\nПозволяет переключаться на внешний вид традиционного средневекового §YКоролевства Норвегия§! и обратно за высокую цену. Обдумайте это внимательно: кроме иного оформления, никаких преимуществ это не даёт.\n"
 NOR_cosmetic_tag_switch_tt:0 "\nПереключает внешний вид на традиционное средневековое §YКоролевство Норвегия§!. Поскольку момент особенно подходящий, здесь и только здесь действует мощная §Gодноразовая скидка§!..."
 NOR_not_making_faction_warning_tt:0 "§RВнимание! Выбор этого варианта заблокирует фокусы «Сближение», поскольку для них требуется возглавлять собственный альянс.§!\n"
 NOR_encourage_fishing:0 "Поощрять рыболовство"
 NOR_encourage_fishing_desc:0 "Использование длинного побережья и богатых окружающих промысловых районов принесёт пользу нашей экономике."
 NOR_establish_nortraship:0 "Создать «Нортрашип»"
 NOR_establish_nortraship_desc:0 "Норвежские судовладельцы располагают сотнями современных торговых судов, перевозящих грузы по всему миру. Нам следует создать государственную организацию для их реквизиции и управления в случае необходимости."
 NOR_establish_nortraship_tt:0 "\nПосле создания §Y«Нортрашипа»§! мы сможем не только напрямую контролировать торговый флот, но и при необходимости передавать управление им важным союзникам.\n"
 NOR_landing_crafts:0 "Десантные суда «Нортрашипа»"
 NOR_landing_crafts_desc:0 "«Нортрашип» и наши морские компании разрабатывают новые десантные суда. Флот рассматривает возможность создания специализированных войск для их использования."
 NOR_navy:0 "Расширить флот"
 NOR_navy_desc:0 "Флот всегда был силой Норвегии. Мы не должны пренебрегать этим великим наследием."
 NOR_nortraship_production_incentives:0 "Стимулы для производства «Нортрашипа»"
 NOR_nortraship_production_incentives_desc:0 "Торговые суда и конвои беззащитны сами по себе. Следует стимулировать кораблестроение и, возможно, привлечь конструкторов, специализирующихся на нуждах торгового флота."
 NOR_coastal_defense_specialization:0 "Специализация на береговой обороне"
 NOR_coastal_defense_specialization_desc:0 "Сосредоточив усилия развитой судостроительной промышленности и военно-морского флота, мы сможем создать корабли и тактики специально для норвежских условий. Вероятнее всего, это будет флот береговой обороны, способный поддерживать сухопутные войска вдоль побережья и проводить ограниченные рейдовые операции в открытом море."
 NOR_naval_conferences:0 "Военно-морские конференции"
 NOR_naval_conferences_desc:0 "Проведение конференций с союзными морскими державами даст нам недостающие знания для совершенствования действий наших адмиралов. Мы должны выступить инициаторами."
 NOR_escorts:0 "Современные корабли сопровождения"
 NOR_escorts_desc:0 "Нашему крупному торговому флоту нужны современные корабли сопровождения для защиты от рейдеров."
 NOR_submarines:0 "Развитие подводного флота"
 NOR_submarines_desc:0 "Подводные лодки отлично подходят для скрытного патрулирования побережья. Следует использовать возможности современных субмарин в полной мере."
 NOR_develop_naval_tactics:0 "Продолжить наследие Торденшельда"
 NOR_develop_naval_tactics_desc:0 "Смелые и изобретательные морские тактики отличали карьеру нашего национального героя, вице-адмирала Петера Весселя Торденшельда. Как он доказал, новаторство и хитрость на море способны выигрывать сражения и даже войны. Почтим его наследие."
 NOR_capital_ships:0 "Крупные корабли"
 NOR_capital_ships_desc:0 "Нам стоит построить собственные крупные корабли для поддержки лёгких сил сопровождения. Улучшение производственных мощностей позволит выпускать их без серьёзных затруднений."
 NOR_capital_ships_tt:0 "\nБудет открыт улучшенный вариант §YХортенской военно-морской верфи§!.\nЕсли она уже выбрана как §Yконструктор кораблей§!, этот фокус §Gбесплатно заменит её улучшенной версией§!.\n\n"
 NOR_naval_equipment:0 "Военно-морское оборудование"
 NOR_naval_equipment_desc:0 "Модернизация морского оборудования необходима, чтобы флот мог противостоять великим державам. Современный корпус может быть быстрым и прочным, но без подходящих орудий, боеприпасов и систем управления это лишь дрейфующий кусок металла."
 NOR_navy_wing:0 "Морское авиационное крыло"
 NOR_navy_wing_desc:0 "Следует развивать морскую авиацию, чтобы она могла поддерживать флот в операциях у побережья."
 NOR_carriers:0 "Авианосцы"
 NOR_carriers_desc:0 "Хотя длинное побережье обеспечивает самолётам хороший радиус действия, авианосный флот даст ещё большую дальность благодаря подвижным аэродромам."
 NOR_air_bases:0 "Авиабазы"
 NOR_air_bases_desc:0 "Из-за больших расстояний внутри страны нам необходимо строить авиабазы по всей Норвегии, чтобы обеспечить самолёты топливом и инфраструктурой."
 NOR_merge_the_air_wings:0 "Объединить авиационные крылья"
 NOR_merge_the_air_wings_desc:0 "Наши небольшие авиационные силы и разрозненное командование стоит объединить под одним руководством. Создадим третий вид вооружённых сил — Королевские военно-воздушные силы Норвегии."
 NOR_light_fighters:0 "Лёгкие истребители"
 NOR_light_fighters_desc:0 "Лёгкие истребители доступны, манёвренны и быстры. Они могут поддерживать войска, сражаться с вражеской авиацией и перехватывать бомбардировщики."
 NOR_fortify_military_bases:0 "Укрепить военные базы"
 NOR_fortify_military_bases_desc:0 "Следует создать оборонительные сооружения, бункеры и зенитные позиции вокруг военных баз, чтобы армия, флот и ВВС сохраняли снабжение и боеспособность."
 NOR_medium_aircraft:0 "Средняя авиация"
 NOR_medium_aircraft_desc:0 "Нам стоит создать самолёты с большей дальностью, чтобы защищать моря и действовать вдоль норвежского побережья."
 NOR_resurrect_norsk_aeroplanfabrik:0 "Возродить Norsk Aeroplanfabrik"
 NOR_resurrect_norsk_aeroplanfabrik_desc:0 "Возрождение отечественного авиазавода Norsk Aeroplanfabrik снизит зависимость от импорта и обеспечит постоянные поставки новых самолётов, запасных машин и деталей."
 NOR_army:0 "Норвежская армия"
 NOR_army_desc:0 "Hæren, или армия, несмотря на хроническое недофинансирование, всё ещё располагает значительным опытом и талантливыми людьми. Следует развивать этот потенциал, несмотря на экономические ограничения."
 NOR_army_wing:0 "Армейское авиационное крыло"
 NOR_army_wing_desc:0 "Следует развивать армейскую авиацию, чтобы она могла поддерживать сухопутные операции."
 NOR_ski_infantry:0 "Лыжная пехота"
 NOR_ski_infantry_desc:0 "В 1747 году в Норвегии был создан первый в мире официальный лыжный корпус, и с тех пор лыжи широко применяются в армии. Польза таких навыков особенно заметна зимой и в горах."
 NOR_ski_infantry_tt:0 "\nОткрывает §Hлыжную пехоту§!\n§HВся пехота и мот./мех. части:\nХолмы§!: атака: §G+5%§!\n§H    Холмы§!: защита: §G+5%§!\n§H    Холмы§!: скорость передвижения: §G+10%§!\n§H    Горы§!: атака: §G+10%§!\n§H    Горы§!: защита: §G+10%§!\n§H    Горы§!: скорость передвижения: §G+20%§!\n"
 NOR_mountaineers:0 "Горнострелковые части"
 NOR_mountaineers_desc:0 "Хотя многие жители страны умеют передвигаться в горах, военная специализация позволит отдельным бойцам по-настоящему преуспеть в горных операциях. Во время Великой войны такие войска помогли немцам нанести итальянцам тяжёлые поражения, доказав ценность специализированной подготовки."
 NOR_mountaineers_tt:0 "\nТеперь мы можем развёртывать §Yгорнострелковые дивизии§!.\n\n"
 NOR_urban_defenses:0 "Оборона городов"
 NOR_urban_defenses_desc:0 "Следует укрепить важнейшие города от возможного вторжения. Помимо отдельных укреплённых районов, необходимо создать оборонительную линию от Халдена до реки Гломма, чтобы остановить наступление со стороны шведской границы на города внутренней части Осло-фьорда."
 NOR_urban_defenses_tt:0 "\nОткрывает §Yрешения§! по строительству §Yоборонительной линии Гломма — Халден§! и §Yлинии Люнгена§!.\n"
 NOR_merge_jegerbataljonene:0 "Объединить егерские батальоны"
 NOR_merge_jegerbataljonene_desc:0 "В начале 1930 года егерский полк Jegerkorpset IR 2 был разделён на три батальона: 1-й, 2-й и 3-й егерские батальоны. Чтобы усилить ограниченные силы, следует сосредоточить их в более крупном соединении и объединить батальоны в новую 1-ю егерскую дивизию."
 NOR_merge_jegerbataljonene_tt:0 "Получить §Yэлитную пехотную дивизию§! в Эстланне.\n"
 NOR_continued_motorization_efforts:0 "Продолжить моторизацию"
 NOR_continued_motorization_efforts_desc:0 "Хотя моторизация армии уже началась, её дальнейшее развитие позволит большему числу частей быстро реагировать на угрозы. Грузовики смогут перевозить не только войска, но и снабжение, а также служить основой мобильных полевых госпиталей."
 NOR_bicycle_battalions:0 "Велосипедные батальоны"
 NOR_bicycle_battalions_desc:0 "Топливо дорого, и нехватка горючего может остановить войска. Универсальные велосипеды позволят армии свободнее передвигаться по городам и сельской местности, поэтому стоит создать новые велосипедные батальоны."
 NOR_armored_battalions:0 "Бронетанковые батальоны"
 NOR_armored_battalions_desc:0 "Чтобы прорвать тупик Великой войны, Британия и Франция создали мощные бронированные машины, устойчивые к пулемётному огню. Новые тактики, двигатели, корпуса и орудия сделали бронетехнику ещё сильнее, и нам следует догнать великие державы, несмотря на высокие расходы топлива."
 NOR_armored_battalions_tt:0 "\n\nНорвежская танковая программа по достижению уровня ведущих держав Европы и Северной Америки значительно выиграет от членства в §Yальянсе§! с крупной танкостроительной страной или участия в §Yгруппе обмена технологиями§!. Лучше всего — и то и другое.\n"
 NOR_equipment_effort:0 "Развитие снаряжения"
 NOR_equipment_effort_desc:0 "Пехота — основа любой армии. Мы должны обеспечить её лучшим снаряжением."
 NOR_encourage_recreational_shooting:0 "Поощрять спортивную стрельбу"
 NOR_encourage_recreational_shooting_desc:0 "В Норвегии многие используют оружие для спорта и охоты. Поддержка этих занятий повысит общую оружейную подготовку и навыки выживания населения."
 NOR_encourage_recreational_shooting_tt:0 "\nЗавершение фокуса откроет §YПерекрёстный огонь§! — новую оборонительную тактику, использующую точный огонь стрелкового оружия с замаскированных позиций для задержки врага.\n"
 NOR_establish_heimevernet:0 "Создать Хеймеверн"
 NOR_establish_heimevernet_desc:0 "Создадим боевое формирование, которое примет на себя первый удар вторжения. При регулярной подготовке быстро развёртываемая территориальная гвардия может оказаться удивительно полезной."
 NOR_fund_the_rearmament:0 "Финансировать перевооружение"
 NOR_fund_the_rearmament_desc:0 "Необходимо исправить пренебрежение и нехватку ресурсов, от которых страдают вооружённые силы."
 NOR_fund_the_rearmament_tt:0 "Некоторые наши командиры станут доступны как §Yтеоретики§!.\n\n"
 NOR_a_serious_defense_budget:0 "Серьёзный оборонный бюджет"
 NOR_a_serious_defense_budget_desc:0 "Ещё одно увеличение расходов должно подготовить вооружённые силы к худшему."
 NOR_armament_investments:0 "Начальные инвестиции в вооружение"
 NOR_armament_investments_desc:0 "Начнём перевооружение, направив часть средств на отечественное производство вооружений."
 NOR_armament_investments_2:0 "Продолжить расширение производства вооружений"
 NOR_armament_investments_2_desc:0 "После первого рывка следует и дальше расширять оружейные предприятия и разнообразить производство."
 NOR_armament_investments_3:0 "Создать военно-промышленные парки"
 NOR_armament_investments_3_desc:0 "Строительство крупных промышленных парков обеспечит внутреннюю производственную цепочку от мельчайшего болта или патрона до крупнейшей машины или корабля и создаст процветающую военную промышленность."
 NOR_kongsberg_research:0 "Исследования в Конгсберге"
 NOR_kongsberg_research_desc:0 "Дополнительное финансирование позволит оружейным разработчикам Конгсберга расширить исследовательское подразделение и не отставать от современных достижений."
 NOR_de_norske_statsbaner:0 "Норвежские государственные железные дороги"
 NOR_de_norske_statsbaner_desc:0 "Норвежские государственные железные дороги были созданы в 1883 году как объединённая государственная компания для всех линий, открытых с 1861 года. Финансирование новых проектов в Южной Норвегии принесёт долгосрочную пользу экономике."
 NOR_nordlandsbanen:0 "Завершить Нурланнскую железную дорогу"
 NOR_nordlandsbanen_desc:0 "Нурланнская линия строится Норвежскими государственными железными дорогами с 1920-х годов. Дополнительное финансирование ускорит работы и свяжет малонаселённые, но богатые ресурсами северные округа с остальной страной."
 NOR_railroad_development_add_2_tt:0 "\nЗавершение добавит §G2§! уровня §Yразвития железных дорог§!."
 NOR_norsk_jernverk:0 "A/S Norsk Jernverk"
 NOR_norsk_jernverk_desc:0 "Создадим общую компанию для снабжения страны железом, сталью и другими металлами."
 NOR_expand_domestic_steel_production:0 "Расширить внутреннее производство стали"
 NOR_expand_domestic_steel_production_desc:0 "Следует поручить Norsk Jernverk расширить внутреннее производство стали за счёт новых шахт и металлургических заводов с современной технологией."
 NOR_access_the_small_deposits:0 "Освоить небольшие месторождения"
 NOR_access_the_small_deposits_desc:0 "Хотя они недостаточно велики для прибыльной разработки, месторождения Южной Норвегии могут пригодиться в чрезвычайной ситуации."
 NOR_statmin:0 "Statmin"
 NOR_statmin_desc:0 "Объединив все горнодобывающие компании под одной крышей, мы позволим им обмениваться знаниями и опытом."
 NOR_lumber_industries:0 "Развивать лесную промышленность"
 NOR_lumber_industries_desc:0 "Леса есть по всей стране, и древесина была одним из факторов процветания Норвегии к началу Великой войны. Следует расширить эту прибыльную отрасль. Кто знает, возможно, однажды норвежская компания станет крупнейшим производителем бумаги в мире?"
 NOR_invest_in_district_industries:0 "Инвестиции в округа"
 NOR_invest_in_district_industries_desc:0 "Следует вкладываться в округа и сельские районы. Местные производители и службы позволят использовать каждый уголок страны."
 NOR_nth:0 "NTH"
 NOR_nth_desc:0 "Значительная часть национальной экспертизы сосредоточена в Norges tekniske høiskole, Норвежском технологическом институте в Тронхейме. Поддержка этого учебного заведения принесёт процветание, а со временем, возможно, позволит превратить его в университет."
 NOR_tungtvann:0 "Инвестировать в производство тяжёлой воды"
 NOR_tungtvann_desc:0 "Промышленные объекты и лаборатории Norsk Hydro в Веморке и Рьюкане уже обеспечивают нас энергией и химикатами, а излишки тяжёлой воды помогут продвинуться в ещё не изученных областях науки. Возможно, у неё есть и военное применение, хотя пока лучше не заострять на этом внимание."
 NOR_norsk_hydro_focus:0 "Поддержать Norsk Hydro"
 NOR_norsk_hydro_focus_desc:0 "Компания Norsk Hydro — один из пионеров норвежской науки и промышленности, работающий в связанных областях электричества, химии, удобрений и тяжёлой воды."
 NOR_hydroelectric_power_generation:0 "Гидроэнергетика"
 NOR_hydroelectric_power_generation_desc:0 "С 1890-х годов мы уже построили множество гидроэлектростанций, некоторые из которых были крупнейшими в мире. Но потенциал ещё не исчерпан: новые станции увеличат производство электроэнергии, принесут современные удобства населению и обеспечат тяжёлую промышленность. Чего мы ждём?"
 NOR_expanded_aluminium_production:0 "Расширить производство алюминия"
 NOR_expanded_aluminium_production_desc:0 "Следует использовать избыточную энергию гидроэлектростанций для расширения алюминиевой промышленности. Компания Norsk Aluminium Co. уже добилась большого успеха в Хёйангере."
 NOR_til_dovre_faller:0 "Едины и верны, пока не падут горы Довре"
 NOR_til_dovre_faller_desc:0 "«Едины и верны, пока не падут горы Довре» — так говорили наши предки при создании конституции 1814 года. Куда бы ни привёл нас путь, Норвегия была и останется страной, созданной общими усилиями единого народа и единой волей."
 NOR_affirm_constitutional_monarchy:0 "Подтвердить конституционную монархию"
 NOR_affirm_constitutional_monarchy_desc:0 "Подтверждая нынешнее сочетание старого и нового, мы гарантируем, что Королевская гвардия всегда будет готова защищать монарха и вдохновлять народ. Безопасность всех слоёв общества — основа достойного государства."
 NOR_continuous_politics:0 "Политическая преемственность"
 NOR_continuous_politics_desc:0 "Выразим нынешнему правительству постоянное доверие к его политическому курсу. В конце концов, страна построена на взаимном доверии."
 NOR_continuous_politics_tt:0 "\nОткрывает §Yрешение§! по завершению социальных программ правительства Нюгорсволла, направленных на борьбу с Великой депрессией и её последствиями.\n\n"
 NOR_change_starts_within:0 "Перемены начинаются изнутри..."
 NOR_change_starts_within_desc:0 "Вместо продолжения рискованного курса или свержения правительства можно провести внутренние перестановки и привлечь представителей других партий. Переход к более умеренной политике Крестьянской партии вместо курса Рабочей партии может помочь."
 NOR_motion_of_no_confidence:0 "Вотум недоверия"
 NOR_motion_of_no_confidence_desc:0 "Правительство оказалось слепо к растущей напряжённости в мире. Нужен новый курс."
 NOR_seek_a_british_alliance:0 "Искать союза с Британией"
 NOR_seek_a_british_alliance_desc:0 "Вступим в альянс с Британской империей. Королевский флот на нашей стороне отпугнёт многих агрессоров, а тесные исторические связи повышают шансы на успех."
 NOR_allied_technology_sharing:0 "Обмен технологиями с союзниками"
 NOR_allied_technology_sharing_desc:0 "Расширим сотрудничество с Британией и Британским Содружеством через взаимовыгодное исследовательское соглашение."
 NOR_allied_technology_sharing_tt:0 "Пригласить государство [ENG.GetNameDef] создать с нами §Yгруппу обмена технологиями§!.\n\nОчень §Gхорошие отношения§! почти гарантируют согласие.\n\n"
 NOR_expand_allied_technology_sharing:0 "Расширить обмен технологиями с союзниками"
 NOR_expand_allied_technology_sharing_desc:0 "Пригласить британских специалистов для помощи нашим исследованиям."
 NOR_delegate_control_of_the_merchant_fleet:0 "Передать управление торговым флотом"
 NOR_delegate_control_of_the_merchant_fleet_desc:0 "Теперь, когда мы воюем на одной стороне с британцами, стоит договориться о передаче им управления нашим крупным торговым флотом. Для нас важно, чтобы судоходная отрасль сохранила конкурентоспособность после победы, а моряки получали справедливую зарплату. Взамен британцы могут предоставить скидки на закупку малых боевых кораблей и подлодок."
 NOR_north_atlantic_defense_focus:0 "Североатлантическая оборонная инициатива"
 NOR_north_atlantic_defense_focus_desc:0 "Предложив Североатлантическую оборонную инициативу, мы защитим побережья союзников и своё собственное от вторжения и нарушения торговли. Совместное командование и учения также принесут пользу армиям, особенно нашей из-за разницы в мощи."
 NOR_north_atlantic_defense_focus_tt:0 "Создаёт §YСевероатлантическую оборонную инициативу§! со странами Североатлантического Содружества. Тесное сотрудничество и общее командование со временем улучшат действия союзных войск и командиров. Союзники также могут вдохновиться нашим перевооружением.\n\nХарактер политики будет зависеть от ранее выбранного курса перевооружения.\n\n"
 NOR_american_military_support:0 "Искать военной поддержки США"
 NOR_american_military_support_desc:0 "Теперь, когда Соединённые Штаты стали союзником, мы можем обратиться к их специалистам. Огромные ресурсы американцев наверняка дадут нам ценные знания, а усиление союзника выгодно и им."
 NOR_british_military_support:0 "Искать военной поддержки Британии"
 NOR_british_military_support_desc:0 "Теперь, когда Великобритания стала союзником, мы можем обратиться к её специалистам. Ресурсы и военный опыт британцев наверняка дадут нам ценные знания, а усиление союзника выгодно и им."
 NOR_request_allied_favors:0 "Попросить союзников об одолжениях"
 NOR_request_allied_favors_desc:0 "Хотя мы не великая держава, наш торговый флот, региональная морская сила, возможности для баз, разведка и движение сопротивления приносят союзникам значительную пользу. В обмен мы можем попросить некоторые уступки."
 NOR_request_allied_favors_tt:0 "Это позволит получать от союзников §Yвнешнюю промышленность§!, §Yлюдские ресурсы§!, §Yснаряжение§! и многое другое.\n"
 NOR_a_beacon_among_democracies:0 "Маяк среди демократий"
 NOR_a_beacon_among_democracies_desc:0 "Война вновь принесла огромные страдания Европе и миру. Возможно, новые международные организации, глобальная торговля и сотрудничество смогут навсегда сделать крупные войны невозможными. Если это достижимо, почему бы не стремиться к этому? Как стабильная демократия, мы можем вести мир к демократизации и гуманитарным инициативам."
 NOR_revise_the_treaty_of_kiel:0 "Пересмотреть Кильский договор"
 NOR_revise_the_treaty_of_kiel_desc:0 "Поскольку мы и государство [DEN.GetName] оказались втянуты в войну, а наши заслуги могут быть полезны великим державам, открывается возможность пересмотреть Кильский договор после Наполеоновских войн. Тогда Дания получила острова, исторически входившие в Королевство Норвегия: §YФареры§!, §YИсландию§! и §YГренландию§!. Было бы справедливо вернуть их."
 NOR_revise_the_treaty_of_kiel_tt:0 "§Y[ROOT.GetName]§!: имеет больше £legitimacy §Yлегитимности§!, чем §Y[DEN.GetName]§!"
 NOR_armed_neutrality_once_more:0 "Снова вооружённый нейтралитет"
 NOR_armed_neutrality_once_more_desc:0 "Многие политики и государственные деятели считают, что лучшим ответом на будущие конфликты станет продолжение политики вооружённого нейтралитета времён Великой войны. Достаточно сильная армия отпугнёт агрессоров, а в случае нападения мы сможем объединиться с врагами наших противников."
 NOR_armed_neutrality_once_more_tt:0 "\nПопытка сохранить нейтралитет государства [Root.GetNameDef]. Если агрессор нарушит нашу §Yнейтральность§!, фокус вооружённого нейтралитета откроет §Yрешения§! по обращению к великим державам за союзом.\n\n"
 NOR_three_brothers:0 "Три брата"
 NOR_three_brothers_desc:0 "В шестом куплете национального гимна мы поём о трёх братьях. Давайте воплотим эти слова и создадим союз со Швецией и Данией. Панскандинавизм заслуживает возрождения."
 NOR_three_brothers_tt:0 "\nЧем хуже отношения, тем меньше вероятность, что другие страны вступят в наш альянс; хорошие отношения почти гарантируют согласие.\n"
 NOR_nordic_technology_sharing:0 "Северный обмен технологиями"
 NOR_nordic_technology_sharing_desc:0 "Расширим сотрудничество с соседями через исследовательское соглашение. Близкие связи, сходные экономические модели и культуры облегчат взаимодействие."
 NOR_nordic_technology_sharing_tt:0 "Пригласить государства [DEN.GetNameDef] и [SWE.GetNameDef] создать с нами §Yгруппу обмена технологиями§!.\n\nОчень §Gхорошие отношения§! почти гарантируют согласие.\n\n"
 NOR_expand_nordic_technology_sharing:0 "Расширить северный обмен технологиями"
 NOR_expand_nordic_technology_sharing_desc:0 "Пригласить специалистов из соседних стран и ещё больше расширить обмен технологиями."
 NOR_expand_nordic_technology_sharing_tt:0 "\nДаёт Норвегии и её союзникам §Yбонусы к исследованиям§!.\nКоличество §Yбонусов§! растёт с числом северных стран в нашем альянсе.\n\n"
 NOR_fourth_brother:0 "Четвёртый брат"
 NOR_fourth_brother_desc:0 "Хотя Финляндия не упоминается в гимне, её следует включить благодаря историческим связям со Скандинавией, сходной культуре и приятному обществу. Панскандинавизм уступает место паннордизму. Что это означает для Эстонии, пока неизвестно."
 NOR_fourth_brother_tt:0 "\nЧем хуже отношения, тем меньше вероятность, что другие страны вступят в наш альянс; хорошие отношения почти гарантируют согласие.\n"
 NOR_invite_finland:0 "Пригласить Финляндию"
 NOR_invite_finland_desc:0 "С Финляндией в альянсе логично включить её и в исследовательское соглашение. Сходная культура, но иные условия местности, соседи и дипломатическое положение дадут ей уникальные представления о приоритетах."
 NOR_invite_finland_tt:0 "Пригласить Финляндию присоединиться к §YСеверному исследовательскому сотрудничеству§!.\n\nОчень §Gхорошие отношения§! почти гарантируют согласие.\n\n"
 NOR_the_dano-norwegian_deal:0 "Датско-норвежская сделка"
 NOR_the_dano-norwegian_deal_desc:0 "Предложим датчанам обмен: наши старые острова — Фареры и Исландия — возвращаются нам, а мы отказываемся от притязаний на Гренландию и поддерживаем датские претензии на Шлезвиг-Гольштейн, если появится возможность вернуть его."
 NOR_the_dano-norwegian_deal_tt:0 "\nЧтобы §Yпередача территорий§! и появление у §Y[DEN.GetAdjective]§! национальной территории в Шлезвиг-Гольштейне вступили в силу, государство §Y[DEN.GetNameDef]§! должно согласиться. §GЛучшие отношения§! повысят вероятность успеха.\n\n"
 NOR_the_fennoscandian_deal:0 "Фенноскандинавская сделка"
 NOR_the_fennoscandian_deal_desc:0 "После вступления Швеции и Финляндии в альянс прагматики трёх стран достигли тайного соглашения о смещении границ Фенноскандии на восток и укреплении восточной границы Финляндии. Швеция передаёт Норвегии бывший норвежский Бохуслен, Финляндия отказывается от Аландской конвенции, а в случае отражения советского нападения получает Карелию."
 NOR_the_fennoscandian_deal_tt:0 "\nВ отличие от датско-норвежской сделки, фенноскандинавское соглашение настолько §Gвзаимовыгодно§!, что все стороны гарантированно согласятся, пока §YШвеция§! и §YФинляндия§! остаются в нашем альянсе. Однако защита восточных границ Финляндии может усилить §Rнастороженность России§! к нашему альянсу.\n\n"
 NOR_seek_american_support:0 "Искать поддержки США"
 NOR_seek_american_support_desc:0 "Используя торговые связи, помощь американцев северного происхождения и сходные ценности, мы можем попытаться заручиться благосклонностью США. Возможно, позднее они поддержат или защитят нас, хотя гарантий нет: американцы дорожат нейтралитетом и миром."
 NOR_pragmatic_diplomacy:0 "Прагматичная дипломатия"
 NOR_pragmatic_diplomacy_desc:0 "Даже объединённая Северная Европа не сможет противостоять одновременному нападению Германии и России. Чтобы выжить, придётся просить помощи у великих держав, хотя и этого может оказаться недостаточно. Возможно, единственный выбор — занять сторону..."
 NOR_stand_against_communism:0 "Выступить против коммунизма"
 NOR_stand_against_communism_desc:0 "Сближение с Германией, включающее пакты о ненападении, свободную торговлю и свободное судоходство по Балтике, возможно, будет разумным шагом. Однако датчанам это может не понравиться, ведь мы обещали им Шлезвиг. И русским это точно не понравится..."
 NOR_stand_against_communism_tt:0 "\nВыбор стороны может оказаться необходимым, чтобы избежать войны на два фронта. Те, с кем мы сблизимся, скорее всего оставят нас в покое или даже §Gподружатся§! с нами. Но отвергнутая сторона будет более склонна §Rнапасть§!.\n"
 NOR_stand_against_fascism:0 "Выступить против фашизма"
 NOR_stand_against_fascism_desc:0 "Сближение с Россией, включающее пакты о ненападении, свободную торговлю и частично закреплённые восточные границы, возможно, будет разумным шагом. Однако финнам не понравится, что мы встаём на сторону России против Германии: они считают, что это не их война и что после поражения Германии русские вернутся. И немцам это точно не понравится..."
 NOR_stand_against_fascism_tt:0 "\nВыбор стороны может оказаться необходимым, чтобы избежать войны на два фронта. Те, с кем мы сблизимся, скорее всего оставят нас в покое или даже §Gподружатся§! с нами. Но отвергнутая сторона будет более склонна §Rнапасть§!.\n"
 NOR_end_foreign_influence:0 "Покончить с иностранным влиянием"
 NOR_end_foreign_influence_desc:0 "Пусть политики и пресса нашего альянса противодействуют иностранному влиянию на наш народ. Мы сами решаем свою политику!"
 NOR_end_foreign_influence_tt:0 "Устраняет иностранное политическое влияние у нас и наших ближайших союзников.\n"
 NOR_nordic_joint_defense_focus:0 "Северная инициатива совместной обороны"
 NOR_nordic_joint_defense_focus_desc:0 "Некоторые из лучших государственных деятелей и оборонных экспертов северных стран давно выступают за совместное оборонное сотрудничество с единым верховным командованием и общими учениями. Возможно, пришло время проявить инициативу и пригласить союзников. Это может стать тем, что сохранит нашу свободу и процветание."
 NOR_nordic_joint_defense_focus_tt:0 "Создаёт §YСеверную инициативу совместной обороны§! с другими участниками северного альянса. Тесное сотрудничество и единое командование со временем улучшат действия войск и командиров. Союзники также могут вдохновиться нашим перевооружением.\n\nХарактер северной оборонной политики будет зависеть от выбранного ранее курса перевооружения.\n\n"
 NOR_the_brotherhood_of_nations:0 "Братство демократических наций"
 NOR_the_brotherhood_of_nations_desc:0 "Наш альянс давно нуждается в новом названии, особенно теперь, когда он перестал быть союзом лишь трёх братьев. Переименование в Братство демократических наций и привлечение ещё нескольких мирных европейских стран поможет сохранить дипломатический импульс."
 NOR_the_brotherhood_of_nations_tt:0 "\nЧем хуже отношения, тем меньше вероятность вступления других стран в наш альянс; хорошие отношения почти гарантируют согласие.\n"
 NOR_support_neighbors:0 "Поддержать соседей"
 NOR_support_neighbors_desc:0 "Мы должны быть готовы помочь соседям в случае иностранного вторжения."
 NOR_gutta_paa_skauen:0 "Национальное сопротивление"
 NOR_gutta_paa_skauen_desc:0 "Есть люди, готовые скрываться среди врагов, внедряться в их ряды и сражаться за короля и наше дело. Они также нередко добровольно помогают нашим друзьям во время войны. Следует поддержать их."
 NOR_gutta_paa_skauen_tt:0 "\n§YЛидер партизан§! в роли советника усилит движение сопротивления и сбор разведданных, а также даст войскам дополнительное преимущество на нашей территории.\n\n"
 NOR_saboteurs:0 "Диверсанты"
 NOR_saboteurs_desc:0 "Раз движение сопротивления уже существует, пора обучить часть партизан тайным диверсионным операциям в тылу врага. После подготовки эти смельчаки смогут выполнять тщательно спланированные задания. Возможно, впереди их ждёт операция всей жизни."
 NOR_saboteurs_tt:0 "Открывает §Yрешения§! по проведению §Yпартизанских операций§! против врагов, оккупирующих норвежскую территорию.\n"
 NOR_traditions_and_monarchy:0 "Возродить монархические традиции"
 NOR_traditions_and_monarchy_desc:0 "Многие призывают к осторожности в эти нестабильные времена. А что может быть надёжнее, чем возвращение к проверенным корням? Возрождение традиций уже давно важно для тех, кто находится у власти."
 NOR_traditions_and_monarchy_tt:0 "\n§YУбеждённый монархист§! в роли советника откроет особые §Yрешения§! для подготовки к §Rгражданской войне§! или иному монархическому перевороту.\n\n"
 NOR_develop_the_kingdom:0 "Развивать королевство"
 NOR_develop_the_kingdom_desc:0 "Начнём путь к созданию идеального королевства с прочной инфраструктуры. Надёжный фундамент необходим государству, народу и нашим ценностям."
 NOR_traditions_worth_fighting_for:0 "Традиции, за которые стоит сражаться"
 NOR_traditions_worth_fighting_for_desc:0 "Монархизм и традиционные ценности с каждым днём набирают популярность. Теперь нужно решить, как привести их к власти: ждать выборов, устроить переворот или сражаться, если придётся?"
 NOR_traditions_worth_fighting_for_tt:0 "\nМожет привести к §Rгражданской войне§!.\n\n"
 NOR_matters_of_presentation:0 "Вопросы представления"
 NOR_matters_of_presentation_desc:0 "После восстановления традиционного королевства возникает вопрос, как представлять страну внешнему миру и собственному народу. Следует решить, сохранять ли отказ от аристократии и менять ли национальную символику, прежде всего флаг."
 NOR_the_location_of_power:0 "Местонахождение власти"
 NOR_the_location_of_power_desc:0 "Ещё один вопрос символики и представления касается столицы: как она должна выглядеть в глазах мира и, что важнее, где именно должна находиться?"
 NOR_a_prosperous_kingdom:0 "Процветающее королевство"
 NOR_a_prosperous_kingdom_desc:0 "После восстановления большей части «Norgesveldet», великого королевства прошлого, укрепления экономики и устранения непосредственных угроз можно отпраздновать успех и перенести внимание народа с созидания на сохранение достигнутого."
 NOR_matters_of_practicality:0 "Практические вопросы"
 NOR_matters_of_practicality_desc:0 "Наши сторонники провели нас через первые важные шаги восстановления государства традиционных ценностей. Но теперь нужно решить, кто возглавит монархическую коалицию на этапе первых реформ."
 NOR_the_extent_of_power:0 "Пределы власти"
 NOR_the_extent_of_power_desc:0 "Когда коалиция готова действовать, остаётся определить полномочия монарха. Что именно сможет решать король? Останемся ли мы современной конституционной монархией, будет ли у короля реальная власть, подчинится ли ему премьер-министр и что станет с выборами?"
 NOR_foreign_relations:0 "Укрепить внешние связи"
 NOR_foreign_relations_desc:0 "Надёжные дипломатические и торговые связи с другими странами повысят наши шансы остаться в стороне от новой европейской войны, если мы сохраним нейтралитет."
 NOR_foreign_relations_tt:0 "\nУмиротворение §YБритании§! и §YГермании§! снизит вероятность немедленной агрессии против нас.\n\n"
 NOR_the_nordic_policy:0 "Северная политика"
 NOR_the_nordic_policy_desc:0 "Самые важные внешнеполитические вопросы всегда связаны с соседями. Следует ли дружить с другими северными странами или Норвегия впервые за более чем пять столетий должна применить силу за рубежом?"
 NOR_reclaim_the_islands:0 "Вернуть острова"
 NOR_reclaim_the_islands_desc:0 "Чтобы Королевство Норвегия вновь обрело былую славу, мы должны вернуть Фареры, Исландию и Гренландию — бывшие норвежские острова, несправедливо переданные Дании Кильским договором."
 NOR_icelandic-faroese_revolt:0 "Исландско-фарерское восстание"
 NOR_icelandic-faroese_revolt_desc:0 "Раз мы воюем с датчанами, можно поднять восстания в Исландии и на Фарерах — бывших норвежских островах, исторически и культурно более связанных с Норвегией. Фареры будут присоединены, а Исландия примкнёт к нам как зависимая, но автономная территория."
 NOR_icelandic-faroese_revolt_tt:0 "\nПередаёт нам §YФарерские острова§! и делает §YИсландию§! нашим автономным §Yсубъектом§!.\n\n"
 NOR_develop_iceland:0 "Развивать Исландию"
 NOR_develop_iceland_desc:0 "После установления контроля над Исландией следует развивать этот просторный остров, богатый водой, выносливыми рабочими, рыбой и овцами. Отдалённые территории тоже должны вносить вклад в наши усилия."
 NOR_develop_the_faroes:0 "Развивать Фареры"
 NOR_develop_the_faroes_desc:0 "После возвращения Фарер нет причин не использовать их рыбу, китовый промысел и овцеводство в промышленности."
 NOR_develop_the_jarldom_of_orkney:0 "Развивать ярлство Оркни"
 NOR_develop_the_jarldom_of_orkney_desc:0 "Древнее ярлство Оркни под нашим контролем само по себе престижно, но дополнительная промышленность позволит ему вносить и материальный вклад."
 NOR_reclaim_the_mainland:0 "Вернуть материковые земли"
 NOR_reclaim_the_mainland_desc:0 "Хотя Норвегия владела множеством островов, материк всегда был центром власти, экономики и населения. В середине XVII века Швеция отторгла часть исторических норвежских земель, и теперь пора вернуть то, что принадлежит нам по праву."
 NOR_subjugate_finland:0 "Подчинить Финляндию"
 NOR_subjugate_finland_desc:0 "Финляндия никогда не владела исконно норвежскими землями, но после возвращения части старых территорий мы можем вновь оправдать применение силы, включить её в нашу сферу и обезопасить восточный фланг. В долгосрочной перспективе финны тоже выиграют от нашей защиты. Следует ли выдвинуть ультиматум?"
 NOR_approach_denmark:0 "Сблизиться с Данией"
 NOR_approach_denmark_desc:0 "Датчане лучше всего подходят нам как друзья. Они не отнимали земли силой, а получили их по договорам великих держав, и торговля во времена унии приносила пользу. Поэтому предложение союза выглядит разумно."
 NOR_approach_sweden:0 "Сблизиться со Швецией"
 NOR_approach_sweden_desc:0 "Шведы могут стать прекрасными друзьями Норвегии. В прошлом они вторгались лишь из-за чрезмерного вмешательства датчан, и сами нередко дорого за это платили. Простим братьев на востоке: во времена унии со Швецией и её мягкого правления наша экономика и культура процветали."
 NOR_approach_finland:0 "Сблизиться с Финляндией"
 NOR_approach_finland_desc:0 "Финны никогда добровольно не были врагами Норвегии: вторгавшиеся к нам финские солдаты выполняли приказы агрессивных шведских королей. И разве не квенская женщина рисковала собой, чтобы сорвать одно из таких вторжений? Финны — одни из самых естественных союзников норвежцев."
 NOR_the_european_policy:0 "Европейская политика"
 NOR_the_european_policy_desc:0 "Разобравшись с внутренними делами, разумно следить за меняющейся политикой Европы. Лучше держать проблемы подальше, чем ждать, пока они придут к нам."
 NOR_take_no_sides:0 "Не принимать ничью сторону"
 NOR_take_no_sides_desc:0 "За исключением Финляндии, входившей в Российскую империю, северные страны успешно остались в стороне от Великой войны. Хотя нейтральное судоходство понесло потери, Норвегия получила компенсации от Антанты за использование её флота. Почему бы вновь не попытаться сохранить Северную Европу вне разрушительных конфликтов?"
 NOR_a_piece_in_the_greater_game:0 "Фигура в большой игре"
 NOR_a_piece_in_the_greater_game_desc:0 "Чтобы нас воспринимали всерьёз, мы должны активно участвовать в формировании мира. Для этого следует поддержать одну из великих держав, близкую нашим взглядам, или объединиться с региональными силами против угроз традиционному государству."
 NOR_the_british_empire:0 "Британская империя"
 NOR_the_british_empire_desc:0 "Если мы встанем на сторону величайшей империи в истории, то наверняка не проиграем. Это безопасный выбор, если британцы примут нас, а союз с победителями всегда приносит влияние их помощникам, пусть и ограниченное по сравнению с могуществом лидеров."
 NOR_a_deal_with_britain:0 "Сделка с Британией"
 NOR_a_deal_with_britain_desc:0 "Помогая Великобритании сохранить империю, мы можем потребовать возвращения старых островов, незаконно заложенных Данией. Что значат Шетландские и Оркнейские острова для мировой империи?"
 NOR_a_deal_with_britain_tt:0 "\nОтправляет Британии предложение передать нам §YШетландские§! и §YОркнейские острова§!. Она может §Gсогласиться§!, ограничиться только §YШетландами§! или §Rотказать§!. §GХорошие отношения§! и наша полезность как союзника повысят вероятность §Gблагоприятного исхода§!.\n"
 NOR_the_north_sea_deal:0 "Североморская сделка"
 NOR_the_north_sea_deal_desc:0 "Поскольку Германия и Британия сближаются, мы тоже должны присоединиться к этому союзу наций. Возможно, в обмен на помощь великим державам удастся договориться о возвращении Шетландов."
 NOR_the_north_sea_deal_tt:0 "\nОтправляет Британии предложение вернуть нам §YШетланды§!. Она может §Gсогласиться§! или §Rотказать§!. §GХорошие отношения§! и наша полезность как союзника повысят вероятность §Gблагоприятного исхода§!.\n"
 NOR_the_german_kaiserreich:0 "Германская империя"
 NOR_the_german_kaiserreich_desc:0 "Союз с возрождающейся Германской империей может значительно усилить наше влияние. В отличие от Британии, это более рискованный выбор: нынешняя империя пока уступает второй Германской империи по силе и влиянию, но потенциальная награда для нас выше."
 NOR_a_deal_with_germany:0 "Сделка с Германией"
 NOR_a_deal_with_germany_desc:0 "Если мы поможем Германии пересмотреть Версальский договор, справедливо будет получить часть старых островов — Шетланды и Оркни. Кайзер наверняка согласится с такими разумными требованиями."
 NOR_baltic_anti-communist_league:0 "Балтийская антикоммунистическая лига"
 NOR_baltic_anti-communist_league_desc:0 "Коммунизм может быть величайшей угрозой монархии и традиционным семейным ценностям. Союз с единомышленниками в Восточной Европе и Прибалтике способен создать мощный заслон против разлагающего влияния большевизма."
 NOR_baltic_league_strikes_west:0 "Великий западный удар"
 NOR_baltic_league_strikes_west_desc:0 "Изначально союз создавался для сдерживания большевиков на востоке, но западные фашисты и агрессоры сами стали огромной угрозой. Не следует ли уничтожить её совместным ударом, пока она не вышла из-под контроля?"
 NOR_baltic_league_deterrence:0 "Политика сдерживания Балтийской лиги"
 NOR_baltic_league_deterrence_desc:0 "Наш альянс носит прежде всего оборонительный характер. Отпугнём любого агрессора и заставим его дорого заплатить за нападение на великий союз по обе стороны Балтики."
 NOR_baltic_league_strikes_east:0 "Великий восточный удар"
 NOR_baltic_league_strikes_east_desc:0 "Балтийская лига была создана главным образом в ответ на большевистскую угрозу суверенитету и образу жизни умеренных государств. Пора покончить с этой угрозой, прежде чем она уничтожит всё, что нам дорого."
 NOR_reject_constitutional_monarchy:0 "Отвергнуть конституционную монархию"
 NOR_reject_constitutional_monarchy_desc:0 "Король стоит на пути к истинному будущему. Как убирают дорожные преграды, так и упрямая монархия должна отречься! Пропагандой современного авторитаризма и коллективизма мы свергнем архаичную систему и добьёмся настоящих перемен."
 NOR_support_radical_nationalism:0 "Поддержать радикальный национализм"
 NOR_support_radical_nationalism_desc:0 "Следует поддержать единственную подлинно националистическую партию — «Национальное единение» во главе с энергичным Видкуном Квислингом."
 NOR_hirden_paramilitary:0 "Вооружить Хирд"
 NOR_hirden_paramilitary_desc:0 "Личная свита и телохранители средневековых королей назывались Хирдом. Возродим такую гвардию, но верную националистическим идеалам и партийным лидерам, а не монарху. Для начала современный политический Хирд должен стать военизированной организацией."
 NOR_rinnanbanden:0 "Сотрудничать с бандой Риннана"
 NOR_rinnanbanden_desc:0 "Некоторые преданные нашему делу люди предлагают помощь во внедрении в возможные движения сопротивления и группы недовольных."
 NOR_rinnanbanden_tt:0 "\n§YКнязь террора§! в роли советника позволит эффективнее бороться с сопротивлением и вражеской подрывной деятельностью, а также даст больше людских ресурсов с ненaциональных территорий.\n\n"
 NOR_norway_first:0 "Норвегия прежде всего"
 NOR_norway_first_desc:0 "Мы должны вернуть Норвегии былую славу."
 NOR_reclaim_danish:0 "Вернуть земли, удерживаемые Данией"
 NOR_reclaim_danish_desc:0 "Пора вернуть территории, потерянные после Наполеоновских войн и Кильского договора."
 NOR_reclaim_swedish:0 "Вернуть земли, удерживаемые Швецией"
 NOR_reclaim_swedish_desc:0 "Пора вернуть территории, потерянные в войнах между Данией и Швецией."
 NOR_join_axis:0 "Вступить в Ось"
 NOR_join_axis_desc:0 "Союз с братским народом Третьего рейха может принести лишь пользу. Начнём с улучшения отношений и обеспечения мира между нашими странами."
 NOR_invite_terboven:0 "Пригласить Тербовена"
 NOR_invite_terboven_desc:0 "Маленькая страна не может всё делать сама. Пригласим германских специалистов для помощи в управлении, строительстве и укреплении страны."
 NOR_invite_terboven_tt:0 "\n§YИнженер по фортификациям§! в роли советника позволит дешевле строить оборонительные сооружения.\n\n"
 NOR_festung_norwegen:0 "Крепость Норвегия"
 NOR_festung_norwegen_desc:0 "Превратить всё побережье в крепость возможно, но это потребует огромных усилий. Мы и не ожидали иного."
 NOR_german_puppet:0 "Принять германское правление"
 NOR_german_puppet_desc:0 "Пока германская армия наступает на нашу страну, некоторые фашисты предлагают уступить. Германия может благосклонно принять наше признание её влияния и использование военно-морских баз в обмен на мягкие условия."
 NOR_german_technology_sharing:0 "Обмен технологиями с Германией"
 NOR_german_technology_sharing_desc:0 "Расширим сотрудничество с немцами через исследовательское соглашение. Их опыт в промышленности, шифровании и бронетехнике принесёт нам огромную пользу."
 NOR_german_technology_sharing_tt:0 "Пригласить государство [GER.GetNameDef] создать с нами §Yгруппу обмена технологиями§!.\n\nОчень §Gхорошие отношения§! почти гарантируют согласие.\n\n"
 NOR_expand_german_technology_sharing:0 "Расширить обмен технологиями с Германией"
 NOR_expand_german_technology_sharing_desc:0 "Пригласить германских специалистов и ещё теснее связать нас с Германией и её союзниками."
 NOR_german_naval_coordination:0 "Координация с германским флотом"
 NOR_german_naval_coordination_desc:0 "Наш крупный торговый флот станет ценным активом для Германии. В обмен на передачу части управления мы сможем закупать корабли и подлодки со скидкой. Сильное норвежское присутствие на море значительно поможет альянсу."
 NOR_at_any_cost:0 "Любой ценой"
 NOR_at_any_cost_desc:0 "Воодушевлённые идеологией и высшим благом, некоторые лётчики готовы пожертвовать всем. Мы почтим их жертву, приведя страну к величию."
 NOR_demand_the_northern_isles:0 "Потребовать Северные острова"
 NOR_demand_the_northern_isles_desc:0 "Потребовать земли, утраченные из-за незаконных датских залогов и принадлежавшие нам до позднего Средневековья. Шетланды и Оркни сохраняют значительное норвежское наследие и хорошо впишутся в наше государство. Кейтнесс был частью норвежского ярлства Оркни и тоже должен последовать за ними."
 NOR_demand_overseas_colonies:0 "Потребовать заморские колонии"
 NOR_demand_overseas_colonies_desc:0 "Норвегия всегда была морской державой и могла бы стать колониальной империей, если бы датчане не сдерживали нас три тёмных столетия. Потребуем законную долю Британской колониальной империи."
 NOR_demand_scottish_lands:0 "Потребовать шотландские земли"
 NOR_demand_scottish_lands_desc:0 "Части Шотландии принадлежали Норвегии со времён викингов и в Средние века. Используем это как основание потребовать Шотландию на мирных переговорах."
 NOR_demand_russian_territories:0 "Потребовать русские территории"
 NOR_demand_russian_territories_desc:0 "Видкун Квислинг хочет основать норвежские колонии в Северной России как награду за борьбу с большевизмом. Один из средневековых королей заявлял права на все земли до Белого моря, поэтому начнём с ближайших к нам областей."
 NOR_demand_russian_territories_tt:0 "\nЭтот фокус также направит §YФинляндии§! требование передать §YПетсамо§!, если она владеет регионом. Вероятность согласия возрастёт при членстве в одном §Yальянсе§!, §Gхороших отношениях§! или наличии §Gсильной армии§!.\nГарантировать передачу можно, если Финляндия является нашей §Yмарионеткой§!, либо если одновременно выполнены условия общего §Yальянса§!, §Gхороших отношений§! и §Gсильной армии§!.\n"
 NOR_support_radical_socialism:0 "Поддержать радикальный социализм"
 NOR_support_radical_socialism_desc:0 "Следует поддержать истинный путь Норвежской коммунистической партии. Партия Адама Эгеде-Ниссена приведёт народ к власти и равенству."
 NOR_join_comintern:0 "Вступить в Коминтерн"
 NOR_join_comintern_desc:0 "Союз с могущественным Советским Союзом, провозглашающим равенство, может принести лишь пользу. Начнём с улучшения отношений и обеспечения мира."
 NOR_soviet_technology_sharing:0 "Обмен технологиями с Советами"
 NOR_soviet_technology_sharing_desc:0 "Расширим сотрудничество с Советами через исследовательское соглашение. Их промышленные методы и опыт в бронетехнике принесут нам пользу."
 NOR_soviet_technology_sharing_tt:0 "Пригласить государство [SOV.GetNameDef] создать с нами §Yгруппу обмена технологиями§!.\n\nОчень §Gхорошие отношения§! почти гарантируют согласие.\n\n"
 NOR_expand_soviet_technology_sharing:0 "Расширить обмен технологиями с Советами"
 NOR_expand_soviet_technology_sharing_desc:0 "Пригласить советских специалистов и укрепить связи с СССР и другими друзьями революции."
 NOR_collectivism:0 "Коллективизм"
 NOR_collectivism_desc:0 "Каждый мужчина и женщина должны трудиться ради общего блага. В долгосрочной перспективе коллективизм окупится."
 NOR_heavy_industry_plan:0 "План тяжёлой промышленности"
 NOR_heavy_industry_plan_desc:0 "Лишь укрепление рабочего класса и промышленной базы государства обеспечит победу пролетариата и революции."
 NOR_prepare_the_proletariat_for_war:0 "Подготовить пролетариат к войне"
 NOR_prepare_the_proletariat_for_war_desc:0 "Война с контрреволюционными силами неизбежна, и пролетариат должен быть мобилизован к грядущему конфликту."
 NOR_a_communist_alternative:0 "Коммунистическая альтернатива СССР"
 NOR_a_communist_alternative_desc:0 "Авангардистские большевики были развращены бюрократической фракцией, проникшей в партию. Движение предало рабочих и принципы революции. Лишь новый Интернационал вернёт надежду трудящимся мира и объединит их."
 NOR_folkearmeen:0 "Народная сила"
 NOR_folkearmeen_desc:0 "Создадим «Folkestyrken», Народную силу — крупное и преданное формирование для охраны партийных руководителей."
 NOR_unite_the_scandinavian_workers:0 "Объединить скандинавских рабочих"
 NOR_unite_the_scandinavian_workers_desc:0 "Теперь, когда мы идём по пути истинного равенства, было бы эгоистично не поделиться им со скандинавскими братьями. Объединим Скандинавию любыми средствами!"
 NOR_pressure_finland:0 "Оказать давление на Финляндию"
 NOR_pressure_finland_desc:0 "Поражение наших скандинавских соседей не осталось незамеченным. Баланс сил на Севере изменился, а ресурсы и промышленность Скандинавии сделали нас серьёзной державой. Почему же Финляндия должна мешать углублению связей с Советами? Её лучший выбор — подчиниться."
 NOR_pressure_finland_tt:0 "\nПопытаться заставить Финляндию стать нашим §Yсубъектом§!. Сильная армия увеличит вероятность согласия.\nГарантировать успех можно при очень хороших отношениях, общем альянсе с Советским Союзом и наличии сильных армий у нас и СССР.\n\nЕсли Финляндия уже наш субъект, фокус снизит её §Yавтономию§!.\n\n"
 NOR_establish_a_secret_police:0 "Создать тайную полицию"
 NOR_establish_a_secret_police_desc:0 "Используем опыт русских товарищей и создадим тайную полицию по образцу их НКВД. Это поможет контролировать внутренние проблемы и общественное мнение, сделав страну стабильнее. Разве интересы отдельного человека могут быть важнее безопасности всего государства?"
 NOR_perfect_state_propaganda:0 "Совершенствовать государственную пропаганду"
 NOR_perfect_state_propaganda_desc:0 "Пропаганда — искусство. Чтобы превратить государство и народ в отлаженный механизм, мы должны довести это искусство до совершенства. Когда каждый знает своё место и долг, общество пожнёт плоды нашей утопии."
 NOR_secret_departments:0 "Тайные отделы"
 NOR_secret_departments_desc:0 "Уничтожение буржуазных реакционных элементов, подрывающих революцию, невозможно без практики диктатуры пролетариата."
 NOR_expand_the_intelligence_service:0 "Расширить агентство [NOR.getAgency]"
 NOR_expand_the_intelligence_service_desc:0 "Более крупные управления и привилегированные агенты станут авангардом партии и рабочих в построении равного и справедливого общества."
 NOR_recover_from_civil_war:0 "Восстановиться после гражданской войны"
 NOR_recover_from_civil_war_desc:0 "Победив врагов в недавней гражданской войне, мы можем сосредоточиться на восстановлении разрушенной страны и инфраструктуры. Также придётся заново выстроить доверие между регионами и народом Норвегии."
 NOR_state_investments:0 "Государственные инвестиции"
 NOR_state_investments_desc:0 "Норвежское государство недавно профинансировало проект, поэтому временно остаётся меньше средств на другие задачи."
 NOR_large_state_investments:0 "Крупные государственные инвестиции"
 NOR_large_state_investments_desc:0 "Норвежское государство недавно вложило значительные средства в проект. Потребуется время, чтобы освободить новый бюджет."
 NOR_large_armament_investments:0 "Крупные инвестиции в вооружение"
 NOR_large_armament_investments_desc:0 "Мы недавно профинансировали масштабное расширение военной промышленности. Заводы построены, но нужны дополнительные средства для запуска производственных линий. Будем надеяться, этого хватит для победы."
 NOR_aftermath_of_the_depression:0 "Последствия Великой депрессии"
 NOR_aftermath_of_the_depression_desc:0 "Хотя Норвегия пережила несколько кризисов в 1920-е годы, Великая депрессия ударила по ней слабее, чем по другим западным странам. Безработица остаётся высокой, но экспорт и судоходство начинают расти, а основы полной индустриализации уже заложены. Разумные инвестиции сейчас могут окончательно вывести страну из кризиса."
 NOR_fishing:0 "Поощрение рыболовства"
 NOR_fishing_desc:0 "Современный рыболовный флот и перерабатывающие предприятия вдоль побережья позволят использовать богатые промысловые районы."
 NOR_dockyard_investments:0 "Расширенная судостроительная промышленность"
 NOR_dockyard_investments_desc:0 "Инвестиции в верфи и военно-морские объекты позволят оставаться в авангарде морских инноваций и производства."
 NOR_grand_naval_expansion:0 "Масштабное расширение флота"
 NOR_grand_naval_expansion_desc:0 "Государство, «Нортрашип», Хортенская верфь и другие морские отрасли объединили ресурсы для резкого роста военно-морских возможностей."
 NOR_specialized_naval_industry:0 "Специализированная военно-морская промышленность"
 NOR_specialized_naval_industry_desc:0 "Наша морская промышленность создаёт инновационные корабли для береговой обороны и ограниченных операций. Тяжёлые крейсеры и крупные суда обеспечивают огневую поддержку лёгких сил и сухопутных войск у побережья. Флот также принял соответствующие тактики. Эти корабли эффективнее, но несколько дороже в производстве."
 NOR_policy_of_disarmament:0 "Сохраняющаяся политика разоружения"
 NOR_policy_of_disarmament_desc:0 "За исключением атак германских подлодок на нейтральное судоходство в Великой войне, Норвегия почти не сталкивалась с военными угрозами в XX веке. Правительство всё меньше тратило на оборону, особенно при Юхане Нюгорсволле, освобождая средства для гражданских нужд."
 NOR_meager_defense_budget:0 "Скудный оборонный бюджет"
 NOR_meager_defense_budget_desc:0 "Недавние вложения остановили дальнейший упадок вооружённых сил, но наша доля военных расходов всё ещё непропорционально мала по сравнению с более осторожными странами."
 NOR_new_defense_budget:0 "Новый оборонный бюджет"
 NOR_new_defense_budget_desc:0 "Возможно, заметив угрозу на горизонте, правительство наконец отказалось от прежнего разоружения. Новый бюджет позволит оснащать и обучать вооружённые силы темпами, невиданными десятилетиями."
 NOR_winter_training:0 "Зимняя подготовка"
 NOR_winter_training_desc:0 "Лыжи используются в Норвегии веками, и армия давно применяет их. Хотя умение ходить на лыжах уже почти обязательно для солдат, дополнительная сезонная подготовка вместе с обучением выживанию сделает войска ещё выносливее и даст общее преимущество зимой и в заснеженных горах."
 ICE_norwegian_advisors:0 "Норвежские советники"
 ICE_norwegian_advisors_desc:0 "Благодаря тесной интеграции Исландских сил безопасности и норвежской армии стороны договорились, что присутствие норвежских советников улучшит тактическую подготовку и устойчивость наших войск на островах, что выгодно и Исландии, и Норвегии."
 NOR_recreational_shooting:0 "Поощрение спортивной стрельбы"
 NOR_recreational_shooting_desc:0 "Правительство поддерживает использование оружия для спорта и охоты. Это повысит общую стрелковую подготовку населения и знание местности."
 NOR_heimevernet:0 "Хеймеверн"
 NOR_heimevernet_desc:0 "Хеймеверн, норвежская территориальная гвардия, должен стать первой линией обороны страны. Регулярная подготовка позволит населению взяться за оружие в случае необходимости."
 NOR_district_investments:0 "Инвестиции в округа"
 NOR_district_investments_desc:0 "Вложения в сельское хозяйство, местных производителей и доступные по всей стране услуги обеспечат благосостояние населения, снизят риск уничтожения всей промышленности одним ударом и позволят использовать все ресурсы. Государственные расходы ещё никогда не были столь выгодными."
 NOR_heavy_water:0 "Тяжёлая вода из Рьюкана"
 NOR_heavy_water_desc:0 "Объекты и лаборатории по производству тяжёлой воды в Рьюкане принесут пользу нашим учёным."
 NOR_haakon:0 "Хокон VII"
 NOR_haakon_desc:0 "Хотя он родился датским принцем, с 1905 года Хокон VII доказал верность и преданность стране и заслужил уважение норвежского народа. Теперь король стал настоящим символом единства независимой Норвегии.\n\n«Alt for Norge!» («Всё для Норвегии!»)\n— девиз короля Хокона VII"
 NOR_kongens_garde:0 "Королевская гвардия Его Величества"
 NOR_kongens_garde_desc:0 "Королевская гвардия, обученная и церемониальной, и боевой службе и непоколебимая в исполнении долга.\n\n«Alt for Kongen!» («Всё для короля!»)\n— девиз Королевской гвардии"
 NOR_wave_of_monarchism:0 "Волна монархизма"
 NOR_wave_of_monarchism_desc:0 "Страну охватывает волна монархических и традиционалистских настроений. Возможно, это даст шанс восстановить более традиционную форму правления."
 NOR_building_the_kingdom:0 "Строительство королевства"
 NOR_building_the_kingdom_desc:0 "Чтобы защитить традиционное королевство, мы должны совместно укрепить его фундамент — инфраструктуру и промышленность."
 NOR_preserving_the_kingdom:0 "Сохранение королевства"
 NOR_preserving_the_kingdom_desc:0 "В значительной степени восстановив «Norgesveldet», великое Норвежское королевство Средневековья, мы решили сосредоточиться на его сохранении и защите, чтобы это достижение пережило века."
 NOR_diplomatic_efforts:0 "Дипломатические усилия"
 NOR_diplomatic_efforts_desc:0 "Дипломаты и послы королевства работают над укреплением связей с важными торговыми партнёрами. Это временно потребует административных ресурсов, но создаст возможность приобрести хороших друзей."
 NOR_deterrence_investments:0 "Инвестиции в балтийское сдерживание"
 NOR_deterrence_investments_desc:0 "Великий балтийский антиэкстремистский и антибольшевистский союз инвестирует в военное сдерживание, чтобы любая агрессивная держава дважды подумала перед нападением на суверенитет и территориальную целостность его участников."
 NOR_national_collectivism:0 "Национальный коллективизм"
 NOR_national_collectivism_desc:0 "Будем поощрять национальный коллективизм: совместный труд ради страны и её превосходства над всем остальным."
 NOR_socialist_collectivism:0 "Социалистический коллективизм"
 NOR_socialist_collectivism_desc:0 "Будем поощрять социалистический коллективизм: совместный труд ради радикальных социалистических идеалов и создания рабочего государства."
 NOR_german_advisors:0 "Германские советники"
 NOR_german_advisors_desc:0 "Германские советники помогают норвежской армии внедрять новейшие тактики, технологии и достижения европейской войны."
 NOR_festung:0 "Крепость Норвегия"
 NOR_festung_desc:0 "«Крепость Норвегия» — план превращения всего побережья в неприступную линию обороны от западных атак. Поскольку идею предложили немцы, название тоже осталось за ними."
 NOR_hirden:0 "Хирд"
 NOR_hirden_desc:0 "Хирд получил название от свиты и телохранителей средневековых королей. В новом виде он охраняет партийных деятелей и при необходимости сражается за наше дело."
 NOR_hirdens_air_corps:0 "Воздушный корпус Хирда"
 NOR_hirdens_air_corps_desc:0 "Современный Хирд перестал быть лишь политической, символической и военизированной организацией и превращается в профессиональную силу, способную дополнять вооружённые силы. Для борьбы за господство в воздухе он создал собственный воздушный корпус с упором на наступательные тактики."
 NOR_rinnanbanden_idea:0 "Банда Риннана"
 NOR_rinnanbanden_idea_desc:0 "Банда Риннана — группа преданных нашему делу людей, добровольно внедряющихся в организации недовольных. Название происходит от имени их лидера Генри Риннана."
 NOR_folkestyrken:0 "Народная сила"
 NOR_folkestyrken_desc:0 "Народная гвардия для защиты партийных руководителей и их интересов, способная при необходимости сражаться и за государство."
 NOR_secret_police_idea:0 "Тайная полиция"
 NOR_secret_police_idea_desc:0 "Собственная тайная полиция по образцу советского НКВД и германского гестапо позволяет лучше контролировать население и защищаться от врагов. Однако контрразведку и пропаганду ещё предстоит улучшить."
 NOR_secret_police_idea_2:0 "Тайная полиция"
 NOR_secret_police_idea_2_desc:0 "Собственная тайная полиция по образцу советского НКВД и германского гестапо позволяет контролировать население и защищаться от врагов. Тайные операции и пропаганда уже принесли огромную пользу."
 NOR_gutta_paa_skauen_idea:0 "Парни из леса"
 NOR_gutta_paa_skauen_idea_desc:0 "«Gutta på skauen» — группа верных стране людей, готовых добровольно участвовать в зарубежных войнах, действовать как партизаны или шпионы ради нашего дела."
 NOR_continuous:0 "Политическая преемственность"
 NOR_continuous_desc:0 "Строить мир — лучший путь. Если начнётся война, друзья придут на помощь. Верно?"
 NOR_pro-rearmament_politics:0 "Политика перевооружения"
 NOR_pro-rearmament_politics_desc:0 "Наконец появилась государственная воля вкладываться в прежде забытые вооружённые силы. Используем эту возможность."
 NOR_change:0 "Беспорядки перемен"
 NOR_change_desc:0 "Вотум недоверия вызвал серьёзные споры. Критики сочли его чрезмерным, а многие политики и граждане увидели в нём корыстный шаг консерваторов, а не необходимость. Однако со временем и при должных усилиях положение стабилизируется."
 NOR_atlantic_balanced_policy:0 "Сбалансированная атлантическая оборонная политика"
 NOR_atlantic_balanced_policy_desc:0 "После Атлантической оборонной инициативы правительство признало необходимость вносить вклад в оборону альянса и выбрало баланс между гражданскими нуждами и перевооружением флота. Совместное командование и учения быстро повысят профессионализм армии, хотя выгода для великих держав будет ограниченной."
 NOR_atlantic_defense_policy:0 "Оборонная политика с упором на Северную Атлантику"
 NOR_atlantic_defense_policy_desc:0 "Новая Атлантическая оборонная инициатива подтвердила правильность перевооружения, хотя часть усилий придётся направить на согласование потребностей союзников и развитие флота. Совместное командование и учения быстро повысят профессионализм армии."
 NOR_nordic_balanced_policy:0 "Сбалансированная оборонная политика"
 NOR_nordic_balanced_policy_desc:0 "После Северной оборонной инициативы правительство выбрало баланс между гражданскими нуждами и военным перевооружением. Совместное командование и учения быстро повысят профессионализм армии."
 NOR_nordic_defense_policy:0 "Оборонная политика с упором на Север"
 NOR_nordic_defense_policy_desc:0 "Новая Северная оборонная инициатива подтвердила правильность перевооружения, хотя часть усилий придётся направить на согласование оборонных потребностей союзников. Совместное командование и учения быстро повысят профессионализм армии."
 NOR_intelligence_gathered:0 "Собранные разведданные"
 NOR_intelligence_gathered_desc:0 "Норвежские агенты и сопротивление раскрыли планы оккупантов. Это даст представление об их ресурсах и ближайших намерениях."
 NOR_intelligence_compromised:0 "Разведданные скомпрометированы"
 NOR_intelligence_compromised_desc:0 "Иностранным агентам удалось похитить документы с важной информацией. Теперь они смогут точнее оценивать наши ресурсы и ближайшие планы."
 NOR_resistance_strengthened:0 "Норвежское сопротивление усилено"
 NOR_resistance_strengthened_desc:0 "Наше сопротивление и верные агенты усилили давление на врага на оккупированной норвежской территории. Поддержка гражданского населения сделает положение оккупантов менее устойчивым."
 NOR_north_atlantic_joint_defense:0 "Совместная оборона Северной Атлантики"
 NOR_north_atlantic_joint_defense_desc:0 "Североатлантическая оборонная инициатива теснее связала нас с соседями за морем. Норвежцы быстро перевооружаются, и мы не позволим им превзойти нас. Чтобы соответствовать ожиданиям новых друзей, придётся увеличить производство и набор. Но совместное командование и учения также принесут пользу нашей армии."
 NOR_nordic_joint_defense:0 "Северная инициатива совместной обороны"
 NOR_nordic_joint_defense_desc:0 "Новая Северная оборонная инициатива теснее связала нас с соседями. Норвежцы быстро перевооружаются, и мы не позволим им превзойти нас. Чтобы соответствовать ожиданиям союзников, придётся увеличить производство и набор. Совместное командование и учения также улучшат нашу армию."
 NOR_norwegian_destroyer_order:0 "Норвежский заказ на эсминцы"
 NOR_norwegian_destroyer_order_desc:0 "Норвежские союзники заказали эсминцы на наших верфях. Мы получим оплату и усилим союзника, но до завершения строительства собственные проекты замедлятся."
 NOR_norwegian_destroyer_order_strong_shipbuilding:0 "Норвежский заказ на эсминцы (мощное судостроение)"
 NOR_norwegian_destroyer_order_strong_shipbuilding_desc:0 "Норвежские союзники заказали эсминцы на наших верфях. Мы получим справедливую оплату и усилим союзника. Благодаря развитой судостроительной промышленности строительство нескольких малых кораблей не слишком задержит наши проекты."
 NOR_thunes_mekaniske_verksted:0 "Механические мастерские Туне"
 NOR_thunes_mekaniske_verksted_desc:0 "Важным производителем турбин и различных локомотивов для наших железных дорог может быть назначена наша отечественная танковая мастерская. Поскольку их объекты уже построены, чтобы иметь возможность управлять большими транспортными средствами, они кажутся лучшим выбором для такого начинания.\n"
 NOR_kjeller_flyfabrikk:0 "Авиазавод Кьеллер"
 NOR_det_norske_luftfartselskap:0 "Норвежское авиационное общество"
 NOR_horten_naval_yard:0 "Хортенская военно-морская верфь"
 NOR_horten_naval_yard_desc:0 "Horten Verft, или Хортенская военно-морская верфь, служит главной базой Королевского норвежского флота и отечественной судоверфью. В прошлом веке база называлась Карлйохансверн в честь короля Швеции-Норвегии и с 1850 года унаследовала функции Фредриксверна в Ставерне.\n"
 NOR_marinens_hovedverft:0 "Главная верфь флота"
 NOR_marinens_hovedverft_desc:0 "Horten Verft, или Horten Naval Yard, служит как основной базой Королевского норвежского флота, так и внутренней верфью для военно-морского флота. В прошлом веке сама база была названа Karljohansvern в честь короля бывшей Швеции-Норвегии. Его функции были унаследованы от Фредриксверна в Ставерне с 1850 года.\n\nСейчас расширены мощности по внутреннему производству капитальных кораблей, возможно, в первую очередь кораблей береговой обороны. \"Пансерскип\"Постмониторская эпоха броненосных кораблей. Эти тяжелые крейсера должны хорошо работать как универсальные, бронированные и доступные корабли береговой обороны для нашего флота.\n"
 NOR_nortraship_dock_limited:0 "Верфи сопровождения «Нортрашипа»"
 NOR_nortraship_dock_limited_desc:0 "Используя опыт судовладельцев и их заинтересованность в защите вложений, мы можем создать новую компанию для охраны морской торговли."
 NOR_tandbergs_radiofabrikk_desc:0 "Tandbergs Radiofabrikk была основана в 1933 году инженером Вебьёрном Тандбергом. Радиозавод в Осло быстро расширяется и выглядит перспективным для норвежской электроники, особенно радиосвязи и звукозаписи.\n"
 NOR_norsk_hydro_desc:0 "Компания, первоначально называвшаяся Norsk Hydro-Elektrisk Kvælstofaktieselskab, была основана Самом Эйде и Кристианом Биркеландом в декабре 1905 года при поддержке семьи Валленбергов и французских банков. Она использовала энергоёмкий процесс Биркеланда — Эйде для производства нитратов из электрической дуги. Благодаря дешёвой норвежской гидроэнергии технология была жизнеспособна, но позднее компания перешла к менее затратным методам и в 1927 году совместно с IG Farben внедрила процесс Габера — Боша.\n\nПредприятия Norsk Hydro в Рьюкане и Нутоддене производили жидкий аммиак, который отправлялся в Херёйю для выпуска кальциевой селитры, известной как норвежская селитра. В 1934 году в Веморке был построен первый в мире коммерческий завод тяжёлой воды.\n"
 NOR_christiania_spigerverk:0 "Christiania Spigerverk"
 NOR_christiania_spigerverk_desc:0 "«Christiania Spiger- og Valtse Værk» была основана в столице Норвегии в 1853 году как гвоздильная мастерская. Сначала она использовала импортное железо, затем металлический лом, а позднее внедрила новаторские машины Коутса для горячей ковки гвоздей. Эффективные методы позволили мастерской менее чем за три десятилетия стать крупным и уважаемым заводом.\n\nС расширением рынков предприятие в Осло начало выпускать инструменты и другие железные изделия, а во время Великой войны и в 1920-е годы обзавелось собственными металлургическими мощностями.\n"
 NOR_kongsberg:0 "Конгсберг"
 NOR_raufoss_ammunisjonsfabrikker:0 "Боеприпасные заводы Рауфосса"
 NOR_haakon_vii_hc:0 "Хокон VII"
 NOR_haakon_vii_hc_desc:0 "Служивший морским офицером король Хокон VII может привнести в командование флотом опыт, полученный в Королевском датском флоте."
 NOR_otto_ruge_ac:0 "Отто Руге"
 NOR_otto_ruge_ac_desc:0 "С 1933 года Отто Руге занимает пост начальника генерального штаба Норвегии и является одним из высших командиров страны. При необходимости он готов предоставлять молодым офицерам широкую свободу действий, следуя принципам децентрализованного командования."
 NOR_kristian_laake_ac:0 "Кристиан К. Лаке"
 NOR_kristian_laake_ac_desc:0 "Кристиан Кристиансен Лаке, один из ведущих командиров и человек твёрдых взглядов, неоднократно критиковал пренебрежение вооружёнными силами. Во время поездки в Германию он увидел масштабное перевооружение и с тревогой доложил о нём политикам. Он предпочитает оборону через подготовку и предупреждение, а не импровизацию в момент опасности."
 NOR_kristian_laake_theorist:0 "Кристиан К. Лаке"
 NOR_kristian_laake_theorist_desc:0 "Кристиан Кристиансен Лаке неоднократно критиковал пренебрежение вооружёнными силами. Во время поездки в Германию он увидел масштабное перевооружение и с тревогой доложил о нём политикам. Это внимательный и способный командир, умеющий планировать будущее."
 NOR_carl_gustav_fleischer_theorist:0 "Карл Густав Флейшер"
 NOR_carl_gustav_fleischer_theorist_desc:0 "Даже когда правительство сокращало военные расходы, Флейшер разрабатывал способы обороны Норвегии. Теперь он сосредоточен на тактике отсечения вражеских плацдармов."
 NOR_wilhelm_von_tangen_hansteen_ac:0 "Вильгельм фон Танген Ханстен"
 NOR_wilhelm_von_tangen_hansteen_hc:0 "Вильгельм фон Танген Ханстен"
 NOR_carsten_tank-nielsen:0 "Карстен Танк-Нильсен"
 NOR_edvard_christian_danielsen_nc:0 "Эдвард Кристиан Даниельсен"
 NOR_skule_storheill_theorist:0 "Скуле Сторхейлл"
 NOR_josef_terboven_desc:0 "Человек Гитлера в Норвегии с масштабными и вполне конкретными планами для страны."
 NOR_henry_oliver_rinnan:0 "Генри Оливер Риннан"
 NOR_henry_oliver_rinnan_desc:0 "Невысокий, но обаятельный, общительный, лживый и убеждённый антикоммунист Генри Оливер Риннан может быть очень полезен режиму. Он добровольно предлагает внедряться в группы сопротивления и выявлять недовольных."
 NOR_gunnar_soensteby:0 "Гуннар Ф. Т. Сёнстебю"
 NOR_gunnar_soensteby_desc:0 "Гуннар Фридтьоф Турман Сёнстебю — молодой и разносторонний любитель природы, недавно завершивший службу в Королевской гвардии. Теперь он вновь добровольно готов служить независимости и процветанию Норвегии."
 NOR_fredrik_wedel_jarlsberg:0 "Фредрик Ведель Ярлсберг"
 NOR_fredrik_wedel_jarlsberg_desc:0 "Фредрик \"Фриц\" Х. Х. Ведель Ярльсберг — норвежский аристократ, юрист и дипломат. Он был одним из немногих норвежцев, хорошо знавших международные отношения во время провозглашения независимости Норвегии в 1905 году. Затем он высказался за то, чтобы Норвегия управлялась королем, а не президентом, когда появился новый вариант независимости Норвегии, поскольку это был гораздо более безопасный и дипломатический выбор.\n\nСам Ведель Ярльсберг принадлежит к известной норвежской и датской дворянской семье, а как аристократ сам он держит титул барона из своих владений в Дании. В Норвегии, однако, он не имеет таких формальных титулов, поскольку аристократия была прекращена с Законом о дворянстве 1821 года. Как опытный дипломат, Ведель сыграл центральную роль в приобретении Норвегией архипелага Шпицберген. Острова были присуждены Норвегии (частично) в качестве компенсации за потери, понесенные торговым флотом нейтрального королевства, поскольку он оказал тонкую помощь Антанте во время Великой войны."
 NOR_haakon_steen_lie:0 "Хокон Стен Ли"
 NOR_rolf_joergen_fuglesang:0 "Рольф Йёрген Фуглесанг"
 NOR_just_ebbesen_von_der_lippe:0 "Юст Эббесен фон дер Липпе"
 LOI_douglas_neil_wimberley_ac:0 "Дуглас Нил Уимберли"
 LOI_andrew_miller_nc:0 "Эндрю Миллер"
 LOI_arthur_william_tedder_ac:0 "Артур Уильям Теддер"
 LOI_john_william_balfour_paul_theorist:0 "Джон Уильям Балфур Пол"
 NOR_johan_nygaardsvold_desc:0 "Юхан Нюгорсволл, сын фермера из Хоммельвика, начал работать на лесопилке в двенадцать лет. В 1902 году эмигрировал в Канаду, а затем США, где трудился в Британской Колумбии, Монтане и Вашингтоне.\n\nВернувшись через пять лет, он посвятил себя политике и с 1910 года представлял Рабочую партию. Он участвовал в заключении «кризисного соглашения» с Крестьянской партией, позволившего сформировать правительство в 1935 году. Его кабинет активно смягчал последствия депрессии социальными программами, но уделял меньше внимания обороне и внешним угрозам."
 NOR_nils_traedal:0 "Нильс Тредал"
 NOR_nils_traedal_desc:0 "Нильс Тредал, сын фермера из Сунндала, накопил богатый политический и управленческий опыт. Он был священником, политиком, мэром, министром церкви и образования в правительствах Колстада и Хуннейда, временным премьер-министром и министром иностранных дел, представителем Мёре-ог-Ромсдала и членом Либеральной партии.\n\nОн также был сооснователем предшественницы Крестьянской партии и теперь возглавляет её. Сторонник аграрных реформ, он приносит стране пользу своим разнообразным опытом."
 NOR_ivar_lykke:0 "Ивар Люкке"
 NOR_ivar_lykke_desc:0 "Ивар Люкке родился в Тронхейме в семье торговца. Работая в семейном деле, он пришёл в местную политику как представитель торговли, а в 1916 году был избран в парламент. Его считали умеренным и рассудительным защитником практического бизнеса.\n\nПоддержка социальных реформ и скромность обеспечили ему доверие. Он отказался от первого предложения стать премьер-министром, но в 1926 году возглавил собственное правительство. Позднее участвовал в споре о названии родного города, предложив компромиссное «Тронхейм»."
 NOR_carl_joachim_hambro:0 "Карл Йоахим Хамбро"
 NOR_carl_joachim_hambro_desc:0 "Карл Йоахим Хамбро родился в Бергене в 1885 году. Большую часть взрослой жизни он был журналистом и главным редактором Morgenbladet, первой ежедневной газеты страны. Он также талантливый оратор и с 1919 года избирался в стортинг, занимая посты лидера фракции Хёйре, председателя и заместителя председателя парламента.\n\nНаграждённый Большим крестом ордена Святого Олафа и прекрасно знающий литературу, Хамбро умеет добиваться результатов быстро и правильно."
 NOR_johan_ludwig_mowinckel_desc:0 "Юхан Людвиг Мовинкель родился в Бергене в 1870 году в одной из старейших торговых семей Норвегии. Он изучал языки и торговлю в Германии, Англии и Франции, в 1898 году купил первый корабль и создал судоходную компанию. Вскоре вошёл в городской совет Бергена и был мэром во время расторжения унии со Швецией. В 1907 году впервые избран в парламент.\n\nПозднее он трижды занимал пост премьер-министра, а также был председателем стортинга, министром промышленности, торговли и иностранных дел. Это одна из ключевых фигур норвежской политики."
 NOR_haakon_vii:0 "Хокон VII"
 NOR_haakon_vii_desc:0 "Король Хокон VII родился в 1872 году как датский и исландский принц Кристиан Фредерик Карл Георг Вальдемар Аксель. В молодости служил в датском флоте, с 1893 года в звании лейтенанта. В 1896 году женился в Букингемском дворце на британской принцессе Мод.\n\nПосле распада унии со Швецией норвежские политики предложили принцу Карлу стать королём независимой Норвегии. 18 ноября 1905 года он объявил, что принимает имя Хокон VII, а его сын Александр станет Олавом. 25 ноября он прибыл в Норвегию, а 27 ноября принёс присягу как первый независимый король за 518 лет.\n\nТеперь демократически настроенный Хокон оказался более абсолютным и традиционным монархом, чем когда-либо. Кто мог стоять за таким развитием событий?"
 NOR_monarchist_coalition:0 "Монархическая коалиция"
 NOR_monarchist_coalition_desc:0 "Политики и неполитики, жители деревень и городов, аграрии, консерваторы и монархические либералы объединены в широкую коалицию. Их взгляды различаются, но общая цель — монархизм, традиционализм и восстановление Королевства Норвегия как подлинно независимого государства."
 NOR_vidkun_quisling_desc:0 "Видкун Квислинг родился в Фюресдале и проявил талант в гуманитарных, исторических и естественных науках. В 1905 году поступил в Военную академию с лучшим результатом среди 250 кандидатов и позднее стал офицером. Во время Великой войны презирал пацифизм, но смягчил взгляды после осознания масштабов потерь.\n\nОн был военным атташе и специалистом по России, помогал Фритьофу Нансену организовывать гуманитарную помощь, дважды женился, сближался с коммунистическим движением, занимал пост министра обороны в аграрном правительстве Колстада и в итоге создал партию «Национальное единение» на основе движения «Nordisk folkereisning i Norge». Теперь он представляет собственную смесь национализма и социализма."
 NOR_adam_egede_nissen_desc:0 "Адам Хьялмар Эгеде-Ниссен родился на ферме в муниципалитете Фроль. В юные годы изучал философию, работая в почтовой службе, в 1897 году стал начальником местного распределительного центра Варде, недалеко от российской границы. В 1900 году его политическая карьера впервые привела его в парламент Норвегии в качестве представителя Либеральной партии. В 1905 г. он перешел в лейбористскую партию, где в 1912 г. отказался от участия в парламенте в пользу дальнейшей работы на норвежскую почтовую службу.\n\nИмея опыт работы и политики, Эгеде-Ниссен был не чужд более радикальных подходов к тому, чтобы делать вещи, незаконно провозя и печатая революционную литературу, а также сформировал радикальный Союз Шахтера в 1906 году. Его пребывание в Варде дало ему представление о растущем революционном настроении в России, которое он с тех пор поддерживает в значительной степени. С 1915 по 1919 год был мэром Ставангера, в ходе которого был оштрафован за участие в всеобщей забастовке 1919 года в поддержку русской революции. В 1918 году он также отправился в Россию и встретился с Лениным, а также присутствовал на совещании, посвященном становлению ныне известного Коминтерна. Когда лейбористская партия раскололась в 1923 году, Эгеде-Ниссен последовал за более радикальными политиками и присоединился к норвежской коммунистической партии НКП."
 NOR_monarch_has_advisor_role:0 "Монарх является советником"
 NOR_monarch_has_field_marshal_role:0 "Монарх является фельдмаршалом"
 NOR_monarch_has_naval_commander_role:0 "Монарх является командующим флотом"
 NOR_naval_commander_has_improved_maneuver:0 "Командующий флотом обладает улучшенной манёвренностью"
 naw_norway.1.t:0 "Норвегия приглашает в «Три брата»"
 naw_norway.1.d:0 "В шестом куплете норвежского гимна говорится, что скандинавы должны вместе стоять в войнах. Теперь Норвегия возрождает панскандинавизм и обращается к нам."
 naw_norway.1.a:0 "Братья в жизни и смерти!"
 naw_norway.1.b:0 "Может быть, не в смерти..."
 naw_norway.2.t:0 "Государство [From.GetName] вступает в «Три брата»"
 naw_norway.2.d:0 "Наш брат, государство [From.GetName], вступил в альянс. Пусть наши народы вместе идут к победе."
 naw_norway.2.a:0 "Мы едины!"
 naw_norway.3.t:0 "Государство [From.GetName] отвергает нашу руку"
 naw_norway.3.d:0 "Государство [From.GetName] почему-то решило держаться подальше от нашей блестящей идеи товарищества."
 naw_norway.3.a:0 "Может быть, в другой раз..."
 naw_norway.4.t:0 "Предложение о четырёхлетних сроках принято"
 naw_norway.4.d:0 "Норвежский парламент решил, что выборы теперь будут проходить раз в четыре года вместо трёх. Вероятно, правительство надеется добиться большего за дополнительный год, хотя представители наверняка оценят и лишний год гарантированной работы."
 naw_norway.4.a:0 "Хорошо."
 naw_norway.4.b:0 "Хех, хитрые мерзавцы."
 naw_norway.4.c:0 "А теперь вернёмся к спору о «самнорске»..."
 naw_norway.6.t:0 "Государство [From.GetName] поддерживает новое Братство"
 naw_norway.6.d:0 "Наш брат, государство [From.GetName], поддержал расширение альянса. Пусть свободные нации стоят вместе как братья."
 naw_norway.6.a:0 "Мы действительно едины в воле!"
 naw_norway.7.t:0 "Норвегия предлагает Северное исследовательское сотрудничество"
 naw_norway.7.d:0 "Наш сосед приглашает нас в совместное Северное исследовательское сотрудничество, утверждая, что оно принесёт пользу всем скандинавским странам. Доступ к достижениям соседей будет полезен, но стоит ли давать им доступ к нашим?"
 naw_norway.7.a:0 "Больше технологий в руках скандинавов пойдёт нам на пользу!"
 naw_norway.7.b:0 "Исследовательское сотрудничество выгодно. Почему бы периодически не направлять им наших химиков?"
 naw_norway.7.c:0 "Наши технологии в чужих руках? Слишком рискованно..."
 naw_norway.8.t:0 "Государство [From.GetName] присоединилось к Северному исследовательскому сотрудничеству"
 naw_norway.8.d:0 "Государство [From.GetName] мудро решило присоединиться к нашему исследовательскому сотрудничеству."
 naw_norway.8.a:0 "И теперь мы все станем ещё мудрее."
 naw_norway.9.t:0 "Государство [From.GetName] отказывается вступить в Северное исследовательское сотрудничество"
 naw_norway.9.d:0 "Государство [From.GetName] оказалось более ревнивым к своим технологиям, чем мы ожидали."
 naw_norway.9.a:0 "Мы ожидали от них большего."
 naw_norway.10.t:0 "Приглашение в Северное исследовательское сотрудничество"
 naw_norway.10.d:0 "Норвегия пригласила нас в Северное исследовательское сотрудничество, которое должно принести взаимную пользу всем северным странам через обмен технологическими достижениями."
 naw_norway.10.a:0 "Разумеется, Финляндия присоединится. Loistava aloite!"
 naw_norway.10.b:0 "Хорошими идеями нужно делиться. Loistava aloite!"
 naw_norway.10.c:0 "Хорошее предложение, но мы не можем рисковать попаданием технологий не в те руки."
 naw_norway.11.t:0 "Государство [From.GetName] присоединилось к Северному исследовательскому сотрудничеству"
 naw_norway.11.d:0 "Государство [From.GetName] мудро решило присоединиться к нашему исследовательскому сотрудничеству."
 naw_norway.11.a:0 "Наш брат-финн теперь с нами."
 naw_norway.12.t:0 "Государство [From.GetName] отказывается вступить в Северное исследовательское сотрудничество"
 naw_norway.12.d:0 "Государство [From.GetName] оказалось более ревнивым к своим технологиям, чем мы ожидали."
 naw_norway.12.a:0 "Наш брат-финн ударил нас по голени?"
 naw_norway.13.t:0 "Норвегия хочет сотрудничать с учёными Содружества"
 naw_norway.13.d:0 "Скандинавская страна по другую сторону моря предлагает исследовательское сотрудничество со странами Содружества. Их учёные будут тесно работать с нашими и делиться достижениями."
 naw_norway.13.a:0 "Обмен технологиями будет взаимовыгодным."
 naw_norway.13.b:0 "Сотрудничать с друзьями — единственно верный выбор."
 naw_norway.13.c:0 "Это слишком односторонне. Зачем менять тузы на тройки?"
 naw_norway.14.t:0 "Государство [From.GetName] согласилось заключить исследовательское соглашение"
 naw_norway.14.d:0 "Государство [From.GetName] любезно заключило исследовательское соглашение и пригласило наших учёных участвовать, вносить вклад и учиться."
 naw_norway.14.a:0 "За здоровье."
 naw_norway.15.t:0 "Государство [From.GetName] отказывает нам в доступе к исследованиям Содружества"
 naw_norway.15.d:0 "Государство [From.GetName] не желает делиться передовой электроникой и кораблями и отказало нам в доступе к исследованиям Содружества."
 naw_norway.15.a:0 "Проклятые мерзавцы."
 naw_norway.16.t:0 "Норвегия хочет сотрудничать с учёными Оси"
 naw_norway.16.d:0 "Наши северогерманские друзья предлагают исследовательское сотрудничество между странами Оси. Их учёные будут тесно работать с нашими и делиться достижениями."
 naw_norway.16.a:0 "Обмен технологиями будет взаимовыгодным."
 naw_norway.16.b:0 "Сотрудничать с друзьями — единственно верный выбор."
 naw_norway.16.c:0 "Nein. Им придётся довольствоваться арендой или лицензированием нашей техники."
 naw_norway.17.t:0 "Государство [From.GetName] согласилось заключить исследовательское соглашение"
 naw_norway.17.d:0 "Государство [From.GetName] любезно заключило исследовательское соглашение и пригласило наших учёных участвовать, вносить вклад и учиться."
 naw_norway.17.a:0 "Большое спасибо."
 naw_norway.18.t:0 "Государство [From.GetName] отказывает нам в доступе к исследованиям Оси"
 naw_norway.18.d:0 "Государство [From.GetName] не желает делиться передовыми методами шифрования, танками и оружием и отказало нам в доступе к исследованиям Оси."
 naw_norway.18.a:0 "Ах, вот как..."
 naw_norway.19.t:0 "Норвегия хочет сотрудничать с учёными Коминтерна"
 naw_norway.19.d:0 "Наши социалистические товарищи на западе предлагают исследовательское сотрудничество между нашими странами. Их учёные будут тесно работать с нашими и делиться достижениями."
 naw_norway.19.a:0 "Обмен технологиями будет взаимовыгодным."
 naw_norway.19.b:0 "Сотрудничать с друзьями — единственно верный выбор."
 naw_norway.19.c:0 "Нет. В наши дни осторожность не бывает лишней."
 naw_norway.20.t:0 "Государство [From.GetName] согласилось заключить исследовательское соглашение"
 naw_norway.20.d:0 "Государство [From.GetName] любезно заключило исследовательское соглашение и пригласило наших учёных участвовать, вносить вклад и учиться."
 naw_norway.20.a:0 "Мы не зря верили в товарищей."
 naw_norway.21.t:0 "Государство [From.GetName] отказывает нам в доступе к исследованиям Коминтерна"
 naw_norway.21.d:0 "Государство [From.GetName] не желает делиться эффективными промышленными методами и удачными вариантами бронетехники и отказало нам в доступе к исследованиям Коминтерна."
 naw_norway.21.a:0 "Будь что будет."
 naw_norway.22.t:0 "Норвегия приглашает нас в Братство демократических наций"
 naw_norway.22.d:0 "Норвежцы и их союзники, до недавнего времени известные как союз «Трёх братьев», «Четырёх братьев» или Северное братство, пригласили нас в переименованный альянс. Они явно хотят сохранить дипломатический импульс. Союз может повысить нашу безопасность и влияние, но потребует обязательств перед новыми друзьями."
 naw_norway.22.a:0 "Мы братья!"
 naw_norway.22.b:0 "Останемся просто добрыми знакомыми."
 naw_norway.22.c:0 "Мы братья, а братья важнее нынешних друзей."
 naw_norway.22.p:0 "Мы не можем предать нынешних союзников!"
 naw_norway.23.t:0 "Государство [From.GetName] вступает в Братство демократических наций"
 naw_norway.23.d:0 "Наш брат, государство [From.GetName], вступил в Братство. Пусть наши народы вместе идут к победе."
 naw_norway.23.a:0 "Нас много, но мы едины!"
 naw_norway.24.t:0 "Государство [From.GetName] отвергает нашу протянутую руку"
 naw_norway.24.d:0 "Государство [From.GetName] решило не вступать в наше братство дружелюбных, сильных и свободолюбивых наций. Кто знает, о чём они думали?"
 naw_norway.24.a:0 "Разочаровывает..."
 naw_norway.25.t:0 "Государство [From.GetName] переименовало наш альянс в Демократическое братство наций"
 naw_norway.25.d:0 "Для дальнейшего расширения альянса нужно более всеобъемлющее название."
 naw_norway.25.a:0 "Возможно, действительно нужен новый глобальный курс."
 naw_norway.26.t:0 "Государство [From.GetName] требует Петсамо"
 naw_norway.26.d:0 "Наш сосед, государство [From.GetName], заявил старые права на Кольский полуостров и хочет получить непрерывную границу с преимущественно русским регионом. Для этого от нас требуют передать Петсамо. Район малонаселён, но богат никелем и остаётся нашим единственным выходом к Баренцеву морю. Как поступить?"
 naw_norway.26.a:0 "Уступить Петсамо. Пусть дразнят медведя, если хотят..."
 naw_norway.26.b:0 "Пусть друзья получат его, но мы ожидаем компенсации."
 naw_norway.26.c:0 "Петсамо принадлежит финнам."
 naw_norway.27.t:0 "Государство [From.GetName] уступает Петсамо"
 naw_norway.27.d:0 "Финны мудро передали нам малонаселённый, но богатый ресурсами Петсамо. Теперь у нас есть непрерывная граница с нашими средневековыми притязаниями. Это доказательство высокого положения страны и мастерства дипломатов."
 naw_norway.27.a:0 "Слава Норвегии и хвала нашим государственным деятелям!"
 naw_norway.28.t:0 "Государство [From.GetName] отвергает требования по Петсамо"
 naw_norway.28.d:0 "Финны заявили, что их границы не подлежат обсуждению, и отказались передавать Петсамо. Похоже, их природа — разочаровывать нас. Мы направили официальную ноту протеста, но пока придётся принять решение."
 naw_norway.28.a:0 "В ноте указано, насколько сильно они нас разочаровали?"
 naw_norway.29.t:0 "Государство [From.GetName] требует подчиниться революции"
 naw_norway.29.d:0 "Норвежцы, недавно победившие датчан и шведов, требуют нашего подчинения их власти и коммунистическим идеалам. Контроль над Скандинавией, растущая армия и связи с Советами делают отказ опасным. Но при любом выборе независимость под угрозой."
 naw_norway.29.a:0 "Придётся подчиниться: с врагами по обе стороны другого выхода нет..."
 naw_norway.29.b:0 "Придётся подчиниться: с врагами по обе стороны другого выхода нет..."
 naw_norway.29.c:0 "Норвежцы усилили контроль над нашей страной."
 naw_norway.29.p:0 "Норвежцы усилили контроль над нашей страной."
 naw_norway.29.e:0 "Здесь мы дадим бой. Независимая Финляндия останется свободной."
 naw_norway.30.t:0 "Государство [From.GetName] подчиняется нам"
 naw_norway.30.d:0 "Финны решили передать нам контроль над значительной частью государственных дел. Теперь все северные страны находятся под нашим руководством."
 naw_norway.30.a:0 "Отлично."
 naw_norway.31.t:0 "Государство [From.GetName] отказывается подчиниться"
 naw_norway.31.d:0 "Финны отказались от нашего щедрого предложения подчиниться, сохранив автономию. Похоже, они предпочитают раздел между нами и Советами, а крепкий алкоголь слишком доступен финским политикам. Стоит ли распространение революции войны?"
 naw_norway.31.a:0 "К войне."
 naw_norway.31.b:0 "Или не к войне?"
 naw_norway.32.t:0 "Государство [From.GetName] встаёт на сторону Германии после обещания нам Шлезвига"
 naw_norway.32.d:0 "Норвежцы решили поддержать Германию, чтобы избежать её нападения. Датчане возмущены: мы уступили североатлантические острова в обмен на помощь в возвращении Шлезвига и, возможно, Гольштейна. Если Германия победит великие державы, как мы защитимся, находясь прямо у её границы? Следует хотя бы выразить протест."
 naw_norway.32.a:0 "Направить жалобу норвежскому правительству."
 naw_norway.32.b:0 "Не жаловаться: по крайней мере, сейчас мир."
 naw_norway.33.t:0 "Государство [From.GetName] понимает наш выбор в пользу Германии"
 naw_norway.33.d:0 "Датчане расстроены нарушенным обещанием по Шлезвигу, но понимают прагматизм союза с Германией: немедленная безопасность важнее. Если Германия начнёт проигрывать, дружба может и не продлиться..."
 naw_norway.33.a:0 "Государство [From.GetName] понимает наш прагматизм."
 naw_norway.34.t:0 "Государство [From.GetName] выражает протест против союза с Германией"
 naw_norway.34.d:0 "Датское руководство возмущено нашим выбором. Мы обещали помочь вернуть Шлезвиг, а Германия всё равно может угрожать нам и датской части региона. Как ответить?"
 naw_norway.34.a:0 "Компенсировать их! Деньги и Гренландия в качестве залога."
 naw_norway.34.b:0 "Временно вернуть им Гренландию в качестве залога."
 naw_norway.34.c:0 "Глупцы! Неужели не понимают, что иначе было нельзя? Они ничего не получат."
 naw_norway.35.t:0 "Норвежцы соглашаются на огромную компенсацию"
 naw_norway.35.d:0 "Норвежцы действительно поняли наши жалобы. Они временно вернули Гренландию и выплатили крупную денежную компенсацию, которую мы направим в промышленность."
 naw_norway.35.a:0 "Справедливо, что они заплатили. Спасибо."
 naw_norway.36.t:0 "Норвежцы передают Гренландию"
 naw_norway.36.d:0 "Норвежцы временно вернули нам Гренландию в качестве залога до возвращения остального Шлезвига. Мы не зря выиграли спор о Гренландии, и общество пока успокоено."
 naw_norway.36.a:0 "Приемлемо."
 naw_norway.37.t:0 "Норвежцы отказали в компенсации"
 naw_norway.37.d:0 "Заявив, что действовали ради выживания всех наших народов, норвежцы отказались компенсировать союз с Германией. Это трудно сгладить, а их нежелание идти на компромисс ещё сильнее подорвало доверие к норвежским политикам."
 naw_norway.37.a:0 "Это худшая торговая сделка в истории торговых сделок."
 naw_norway.38.t:0 "Выполнить нашу часть сделки"
 naw_norway.38.d:0 "Шлезвиг-Гольштейн наш, и норвежцы выполнили обязательства. Теперь мы возвращаем им Гренландию согласно договору."
 naw_norway.38.a:0 "Берегите гренландцев!"
 naw_norway.39.t:0 "Государство [From.GetName] возвращает нам Гренландию"
 naw_norway.39.d:0 "Датчане признали выполнение нашей части сделки по возвращению Шлезвига и вновь передали нам Гренландию. Теперь это постоянная часть Норвежского королевства, а инуиты станут норвежскими гражданами."
 naw_norway.39.a:0 "Прекрасно. Часто ли цепочка событий заканчивается моралью?"
 naw_norway.40.t:0 "Государство [From.GetName] встаёт на сторону России после обещания нам Карелии"
 naw_norway.40.d:0 "Норвежцы поддержали Россию, чтобы избежать нападения. Финны возмущены: мы отказались от балтийских островов в обмен на помощь в возвращении Карелии и устранении восточной угрозы. Если Россия победит великие державы, как мы защитим огромную общую границу? Следует хотя бы выразить протест."
 naw_norway.40.a:0 "Направить жалобу норвежскому правительству."
 naw_norway.40.b:0 "Не жаловаться: по крайней мере, сейчас мир."
 naw_norway.41.t:0 "Государство [From.GetName] понимает наш выбор в пользу России"
 naw_norway.41.d:0 "Финны недовольны нарушенным обещанием по Карелии и союзом с потенциальной угрозой, но понимают прагматизм: немедленная безопасность важнее. Если Россия начнёт проигрывать, дружба может и не продлиться..."
 naw_norway.41.a:0 "Государство [From.GetName] понимает наш прагматизм."
 naw_norway.42.t:0 "Государство [From.GetName] выражает протест против союза с Советским Союзом"
 naw_norway.42.d:0 "Финское руководство возмущено нашим выбором. Мы обещали помочь вернуть Карелию, а Советы всё равно могут угрожать Финляндии и нам. Как ответить?"
 naw_norway.42.a:0 "Компенсировать их денежными выплатами."
 naw_norway.42.b:0 "Сейчас компенсация невозможна: ресурсы нужны для собственной обороны."
 naw_norway.43.t:0 "Норвежцы соглашаются на компенсацию"
 naw_norway.43.d:0 "Норвежцы поняли наши жалобы и выплатят денежную компенсацию, которую мы направим в промышленность."
 naw_norway.43.a:0 "Пока сойдёт, спасибо."
 naw_norway.44.t:0 "Норвежцы отказали в компенсации"
 naw_norway.44.d:0 "Заявив, что союз с Советами необходим для выживания всех наших народов, норвежцы отказали в компенсации. Расширение в Карелию — одно, но главная проблема — защита от России в будущем. Особенно обидно, что норвежцы, находящиеся далеко от угрозы, даже не желают платить."
 naw_norway.44.a:0 "Наивные глупцы в безопасности..."
 naw_norway.45.t:0 "Вотум недоверия — кто возглавит новое правительство?"
 naw_norway.45.d:0 "Старое правительство отправлено в отставку. Новую коалицию возглавит консервативная партия Хёйре, но необходимо выбрать премьер-министра. Остались два достойных кандидата."
 naw_norway.45.a:0 "Ивар Люкке — опытен и умеет идти на компромисс."
 naw_norway.45.b:0 "К. Й. Хамбро — хочет эту должность и обладает разносторонним политическим и литературным опытом."
 naw_norway.50.t:0 "Государство [From.GetName] предлагает сделку"
 naw_norway.50.d:0 "После того, как Норвегия была отделена от Датского королевства в 1814 году, Кильский договор дал нам владение их бывшими североатлантическими островами, Гренландией, Исландией и Фарерскими островами. Несмотря на разногласия по этому поводу с временной оккупацией восточной Гренландии норвежскими ирредентистами, норвежцы теперь пришли к нам дипломатическим путем, хотя и с разными требованиями.\n\nВ обмен на передачу им своих бывших островов Фарерских островов и Исландии норвежцы откажутся от своих претензий на Гренландию, защитят нас в случае нападения со стороны немцев, а также помогут договориться о возвращении Слесвига и частей Холстена, если представится возможность. Хотя требования довольно обширны, Североатлантические острова не являются наиболее экономически важной областью нашей страны, и возвращение Слесвига оказалось бы гораздо более выгодным. Должны ли мы принять или отвергнуть это предложение, или, возможно, предложить компромисс, учитывая, что требования довольно обширны?"
 naw_norway.50.a:0 "Согласиться и добавить Гренландию. Дружба с северными родственниками важнее всего!"
 naw_norway.50.b:0 "Согласиться. Острова были норвежскими, а Шлезвиг-Гольштейн для нас ценнее."
 naw_norway.50.c:0 "Переговоры о сохранении Исландии. В настоящее время сделка находится в пользу Норвегии."
 naw_norway.50.e:0 "Отказаться. Немедленную выгоду получат только норвежцы."
 naw_norway.51.t:0 "Государство [From.GetName] принимает сделку"
 naw_norway.51.d:0 "Данно-норвежская сделка была одобрена [From.GetName]И наши старые острова теперь снова под нашим контролем. Если мы когда-нибудь сможем вернуть Слесвига в Данию, мы должны будем сделать это, чтобы выполнить нашу сделку."
 naw_norway.51.a:0 "Датчане — действительно хорошие союзники, помогающие исправить несправедливость Кильского договора."
 naw_norway.52.t:0 "Государство [From.GetName] принимает сделку с условием"
 naw_norway.52.d:0 "Датчанам понравилась общая идея, но они справедливо сочли соглашение односторонним, поскольку немедленную выгоду получаем только мы. Они предложили оставить Исландию себе, и наши дипломаты приняли разумный компромисс."
 naw_norway.52.a:0 "Не идеально, но вполне приемлемо."
 naw_norway.53.t:0 "Государство [From.GetName] отвергает сделку"
 naw_norway.53.d:0 "Не цитируя немедленную выгоду для [From.GetName] Датчане отвергли нашу просьбу о возвращении наших островов для поддержки в отвоевании Слезвиг-Гольстена. Несмотря на то, что это является значительным препятствием для нашего дипломатического пути к усилению влияния, мы играем этот рискованный путь и провоцируем восстания в Исландии и Фарерских островах, поскольку жители были родом с норвежского материка и части нашего Королевства. Однако это может привести к риску нашего союза с Данией, и если Дания не отступит, может начаться война."
 naw_norway.53.a:0 "Не будем рисковать дружбой с Данией. Пусть оставят острова."
 naw_norway.53.b:0 "Это неприемлемо. Поднять восстания и ясно изложить требования!"
 naw_norway.54.t:0 "Государство [From.GetName] разжигает сепаратизм на островах!"
 naw_norway.54.d:0 "Коварные норвежцы не смирились с нашей властью и подняли сепаратистские восстания в Исландии и на Фарерах, используя национальные движения и культурные связи. Гренландия пока безопасна. Следует принять прежнюю сделку, признать новый статус-кво или выйти из альянса и вернуть острова силой?"
 naw_norway.54.a:0 "Добавить Гренландию и спасти первоначальную сделку в обмен на поддержку по Шлезвигу."
 naw_norway.54.b:0 "Не рисковать. Признать новый статус-кво без обязательств по Шлезвигу."
 naw_norway.54.c:0 "Нарушение нашей территории недопустимо. К войне!"
 naw_norway.55.t:0 "Государство [From.GetName] сдаётся и передаёт Гренландию"
 naw_norway.55.d:0 "Восстание было полным успехом. Датчане свернули, чтобы спасти первоначальную сделку, не желая рисковать войной, и видя, что линии снабжения в Гренландию долгое время стоили того, чтобы их поддерживать. Поскольку первоначальное соглашение было в значительной степени в нашу пользу, мы должны простить их нарушения и поддержать их право на Слесвига, если это когда-либо будет актуальной проблемой."
 naw_norway.55.a:0 "Исландский гамбит сработал."
 naw_norway.56.t:0 "Государство [From.GetName] неохотно принимает новый статус-кво"
 naw_norway.56.d:0 "Датчане, хотя и возмущены нашей грязной игрой, принимают новый статус-кво и остаются в альянсе, если их корабли снабжения Гренландии смогут заходить на Фареры и в Исландию. Обязательство поддерживать их претензии на Шлезвиг отменяется."
 naw_norway.56.a:0 "Получить что-то даром? Какие у нас государственные деятели мирового уровня."
 naw_norway.57.t:0 "Государство [From.GetName] объявляет нам войну!"
 naw_norway.57.d:0 "Исландский гамбит обернулся худшим образом! Датчане объявили островные восстания незаконным вмешательством Норвегии, мобилизовали войска и начали войну. Единственный плюс — именно они сделали первый наступательный шаг, что может убедить союзников прийти нам на помощь."
 naw_norway.57.a:0 "Иногда получаешь больше, чем рассчитывал. Датчане вынудили нас действовать..."
 naw_norway.58.t:0 "Государство [From.GetName] принимает сделку — и даже больше!"
 naw_norway.58.d:0 "Датско-норвежская сделка принята государством [From.GetName], и старые острова, включая добавленную в знак доброй воли Гренландию, вернулись под наш контроль. Если появится возможность вернуть Шлезвиг Дании, мы обязаны выполнить свою часть соглашения."
 naw_norway.58.a:0 "Датчане действительно хорошие союзники, помогающие исправить ущерб несправедливого Кильского договора."
 naw_norway.59.t:0 "Фенноскандинавская сделка"
 naw_norway.59.d:0 "Опасаясь вторжения на восточные границы, Норвегия, Швеция и Финляндия договорились о взаимных гарантиях. Финляндия передала населённые преимущественно шведами Аландские острова Швеции, а Швеция вернула Норвегии Бохуслен.\n\nНорвегия получила стимул защищать более уязвимых союзников, Швеция ограничила возможное расширение прежнего врага, а Финляндия заручилась защитой восточных границ, включая Карельский перешеек."
 naw_norway.59.a:0 "Друзья всегда могут договориться. Теперь сделаем нашу армию настоящей частью системы сдерживания."
 naw_norway.59.b:0 "Они нам не доверяют? В любом случае стоит опасаться этих интригующих соседей..."
 naw_norway.60.t:0 "Хокон VII отрекается"
 naw_norway.60.d:0 "На фоне роста радикальной напряжённости в Норвегии уважаемый и демократически настроенный король Хокон решил уступить давлению сторонников нового государственного порядка. Отречение вступило в силу немедленно. Он правил Норвегией с 1905 по [GetYear] год."
 naw_norway.60.a:0 "Каким бы хорошим ни был король, монархия устарела."
 naw_norway.60.b:0 "Что происходит с нашими друзьями?"
 naw_norway.60.c:0 "Народу монархия не нужна."
 naw_norway.60.p:0 "Похоже, в Норвегии действуют радикальные силы..."
 naw_norway.61.t:0 "Государство [From.GetName] предлагает условия"
 naw_norway.61.d:0 "Столкнувшись с мощью нашей военной машины, руководство государства [From.GetAdjective] решило просить мира и предлагает стать нашим сателлитом. Это прекратит войну, а как наш субъект оно будет участвовать во всех текущих конфликтах на нашей стороне. Что ответить?"
 naw_norway.61.a:0 "Принять косвенное управление государством [From.GetName]."
 naw_norway.61.b:0 "Подойдёт только полная аннексия..."
 naw_norway.62.t:0 "Государство [From.GetName] принимает наши условия"
 naw_norway.62.d:0 "Государство [From.GetName] приняло условия капитуляции, и отныне мы его сателлит. Теперь придётся участвовать во всех войнах, в которые оно нас втянет. Возможно, свобода и мир ещё видны на далёком горизонте?"
 naw_norway.62.a:0 "К сожалению, других вариантов не осталось..."
 naw_norway.63.t:0 "Государство [From.GetName] отвергает наши условия"
 naw_norway.63.d:0 "Государство [From.GetName] отвергло капитуляцию, решив, что его устроит лишь прямое правление. Теперь это может стать борьбой за нашу независимость и само существование!"
 naw_norway.63.a:0 "Значит, боя не избежать, а ставки стали ещё выше..."
 naw_norway.64.t:0 "Националистический альянс государства [Root.GetNameDef]"
 naw_norway.64.d:0 "Мы уже продвигаем свои ценности в мире. После трудов представителей и государственных деятелей может родиться новый альянс. Как назвать этот сильный союз?"
 naw_norway.64.a:0 "«Северное сияние» — мы озарим завистливый мир."
 naw_norway.64.b:0 "«Северное собрание» — под нашим руководством соберутся лучшие."
 naw_norway.64.c:0 "«Каменный пакт» — прежде всего мы непоколебимы, как наши горы."
 naw_norway.64.p:0 "Хм... Покажите другие варианты."
 naw_norway.65.t:0 "Националистический альянс государства [Root.GetNameDef]"
 naw_norway.65.d:0 "Мы уже продвигаем свои ценности в мире. После трудов представителей и государственных деятелей может родиться новый альянс. Как назвать этот сильный союз?"
 naw_norway.65.a:0 "«Северное царство» — просто, понятно и по-домашнему."
 naw_norway.65.b:0 "«Северный союз» — ведь альянс и есть объединение родственных наций."
 naw_norway.65.c:0 "Начнём выбор заново."
 naw_norway.65.p:0 "Пока не будем выбирать."
 naw_norway.70.t:0 "Возрождение старых традиций"
 naw_norway.70.d:0 "В государстве [ROOT.GetNameDef] романтически возрождаются старые традиции. Люди и политики спорят о возвращении аристократических титулов, хотя без прежних привилегий. Некоторые предлагают вернуть старые названия городов и флаг средневекового Королевства Норвегия. Как поступить?"
 naw_norway.70.a:0 "Аристократия устарела, а нынешний норвежский флаг следует сохранить."
 naw_norway.70.b:0 "Вернуть титулы самым достойным гражданам, но сохранить нынешний флаг."
 naw_norway.70.c:0 "Уважим традиции! Вернём и аристократию, и славный старый флаг."
 naw_norway.71.t:0 "Местонахождение власти"
 naw_norway.71.d:0 "В прошлом столицами государства [ROOT.GetNameDef] были разные города, прежде всего Осло, Берген, ранее Бьёргвин, и Тронхейм, ранее Нидарос. Теперь можно вернуть столицу в один из старых центров. Но Осло остаётся крупнейшим городом, близким к сельскохозяйственным районам и большинству учреждений, поэтому перенос будет непопулярен."
 naw_norway.71.a:0 "Сохранить Осло столицей."
 naw_norway.71.b:0 "Выбрать Берген — бывшую столицу и важный торговый город."
 naw_norway.71.c:0 "Выбрать Тронхейм — бывшую столицу и важный религиозный центр."
 naw_norway.72.t:0 "Старые названия городов?"
 naw_norway.72.d:0 "Решив основные символические вопросы, можно подумать о возвращении старых топонимов. Оставить привычные названия, переименовать крупнейшие города или начать широкую кампанию переименований?"
 naw_norway.72.a:0 "Оставить всё как есть. Главное, что больше нет Кристиании."
 naw_norway.72.b:0 "Переименовать крупные города. Вернуть Бьёргвин и Нидарос."
 naw_norway.72.c:0 "Нужен полный ребрендинг. Начать с Бергена, Тронхейма, Олесунна и Хамара."
 naw_norway.73.t:0 "Монархическая коалиция"
 naw_norway.73.d:0 "Теперь, когда монархическая коалиция у власти, кто поведёт её в первые годы преобразований: старейшая Либеральная партия, традиционалистская Крестьянская партия или консерваторы?"
 naw_norway.73.a:0 "Либеральная партия."
 naw_norway.73.b:0 "Крестьянская партия."
 naw_norway.73.c:0 "Консервативная партия."
 naw_norway.74.t:0 "Пределы власти"
 naw_norway.74.d:0 "С возрождением традиций возник вопрос об устройстве обновлённого государства. Насколько премьер-министр подчиняется королю? Сколько полномочий сохраняет парламент? Как часто проводить выборы? И какой властью должен обладать монарх?"
 naw_norway.74.a:0 "Обычные выборы и традиционная, но конституционная монархия."
 naw_norway.74.b:0 "Больше власти королю, но сохранить конституцию и выборы."
 naw_norway.74.c:0 "Премьер-министр отвечает перед королём, но выборы сохраняются."
 naw_norway.74.p:0 "Король получит широкую власть — настоящая традиционная монархия."
 naw_norway.75.t:0 "Традиции, за которые стоит сражаться?"
 naw_norway.75.d:0 "Волна монархизма привлекла множество сторонников. Следует ли захватить власть силой или ждать, пока народ добровольно примет наши взгляды?"
 naw_norway.75.a:0 "Сражаемся на рассвете!"
 naw_norway.75.b:0 "Может быть, через месяц. Нужно подготовиться."
 naw_norway.75.c:0 "Королю не понравится война ради него. Убедим народ со временем."
 naw_norway.76.t:0 "Готовы сражаться?"
 naw_norway.76.d:0 "Прошёл месяц с первой встречи монархистов. Настал ли момент нанести удар, рискуя гражданской войной?"
 naw_norway.76.a:0 "Мы готовы. К войне!"
 naw_norway.76.b:0 "Возможно, это всё-таки была плохая идея..."
 naw_norway.77.t:0 "Норвегия приглашает нас в свой альянс"
 naw_norway.77.d:0 "В шестом куплете норвежского гимна говорится, что скандинавы должны вместе стоять в войнах. Норвежцы возрождают панскандинавское, или паннордическое, движение и обращаются к нам."
 naw_norway.77.a:0 "Братские королевства в жизни и смерти!"
 naw_norway.77.b:0 "Может быть, не в смерти..."
 naw_norway.78.t:0 "Государство [From.GetName] вступает в [Root.GetFactionName]"
 naw_norway.78.d:0 "Наш брат, государство [From.GetName], вступил в альянс. Пусть наши народы вместе идут к победе!"
 naw_norway.78.a:0 "Ещё несколько хороших карт — и получим королевский флеш."
 naw_norway.79.t:0 "Государство [From.GetName] отвергает нашу руку"
 naw_norway.79.d:0 "Государство [From.GetName] почему-то решило отвергнуть наш союз, основанный на традициях."
 naw_norway.79.a:0 "Королевское фиаско..."
 naw_norway.80.t:0 "Фарерские острова реинтегрированы"
 naw_norway.80.d:0 "Возродив связь с родственными народами Фарер, мы помогли им вновь почувствовать себя частью исторической родины. Государство [Root.GetName] приветствует их возвращение. Как теперь называть острова?"
 naw_norway.80.a:0 "На букмоле, письменном языке большинства."
 naw_norway.80.b:0 "На нюнорске, наиболее близком к диалектам и древненорвежскому."
 naw_norway.80.c:0 "Используем родной фарерский язык."
 naw_norway.81.t:0 "Исландия реинтегрирована"
 naw_norway.81.d:0 "Судьба вновь соединила нас с островом саг. Изначально его заселили норвежцы, бежавшие от власти и налогов первого короля, позднее остров вернулся в Норвежское королевство, но датская уния и Кильский договор вновь отняли его. Общая культура, история и происхождение снова объединяют нас."
 naw_norway.81.a:0 "Событие, достойное новой саги."
 naw_norway.82.t:0 "Гренландия реинтегрирована"
 naw_norway.82.d:0 "Первоначальные норвежско-исландские поселенцы Гренландии исчезли, но в 1720-х годах датско-норвежская миссия вернула остров в сферу королевства. Кильский договор отнял его без нашего согласия, а спор о Гренландии завершился неудачей. Теперь судьба вернула остров. Инуиты уже приняли христианство и интегрировались, хотя процесс был сложнее, чем на Фарерах и в Исландии."
 naw_norway.82.a:0 "Гренландцы прекрасно впишутся в нашу страну."
 naw_norway.83.t:0 "Емтланд реинтегрирован"
 naw_norway.83.d:0 "Суровые и красивые земли Емтланда вместе с населением вновь вошли в Норвегию. Остаётся решить, как назвать регион: на современном норвежском, на более традиционном нюнорске, близком местным диалектам и Трёнделагу, или вернуть древнескандинавское название."
 naw_norway.83.a:0 "Использовать язык большинства — вариант на букмоле."
 naw_norway.83.b:0 "Сохранить традиции и местные диалекты — вариант на нюнорске."
 naw_norway.83.c:0 "Вернуться к общим корням — древнескандинавский вариант."
 naw_norway.84.t:0 "Бохуслен реинтегрирован"
 naw_norway.84.d:0 "Бохуслен был норвежской землёй восемь столетий, пока не был потерян в одной из датско-шведских войн. Теперь он вновь принадлежит нам, а жители готовы служить новой стране, чему помогают общая история и наследие."
 naw_norway.84.a:0 "Растут и население, и береговая линия."
 naw_norway.84.b:0 "Наша очень старая норвежская береговая линия."
 naw_norway.84.c:0 "Очень-очень старая..."
 naw_norway.85.t:0 "Шетланды реинтегрированы"
 naw_norway.85.d:0 "Шетландские острова некогда входили в норвежское ярлство Оркни. После возвращения под наш контроль их реинтеграция завершилась успешно. Но как назвать регион: Шетланд или Хьялтланд?"
 naw_norway.85.a:0 "Шетланд — хорошая современная версия старого названия."
 naw_norway.85.b:0 "Но оригинал не превзойти. Пусть будет Хьялтланд!"
 naw_norway.86.t:0 "Оркни реинтегрированы"
 naw_norway.86.d:0 "Оркнейские острова были центром ярлства Оркни, одного из высших титулов Норвежского королевства. Теперь они вновь под нашей властью. Население смешанного норвежского, кельтского и шотландского происхождения интегрировано и готово стать гражданами. Как назвать регион: современно, традиционно или совсем по-древнему?"
 naw_norway.86.a:0 "Современный букмол подойдёт. Благодаря самнорску он достаточно норвежский."
 naw_norway.86.b:0 "Разумеется, нюнорск! Язык должен основываться на норвежской речи, а не датском письме."
 naw_norway.86.c:0 "Продолжим с того места, где остановились, — на древнескандинавском."
 naw_norway.100.t:0 "Московские процессы"
 naw_norway.100.d:0 "Советский Союз переживает крупные и жестокие внутренние перемены. На печально известных Московских процессах многие влиятельные люди получили приговоры.\n\nМеждународная пресса отмечает, что удивительно многие признавались в тяжких преступлениях. Их могли принудить? Генеральный секретарь устраняет противников?\n\nВ Норвегии пресса и общество осуждают процессы как несправедливые и подозрительные. Многие партии отдаляются от Коминтерна и становятся умереннее. Как реагировать?"
 naw_norway.100.a:0 "Осудить несправедливые процессы и позволить прессе свободно сообщать о них."
 naw_norway.100.b:0 "Скрыть худшие подробности: рабочим нужен социализм."
 naw_norway.100.c:0 "Использовать этот фарс для продвижения национализма и антикоммунизма."
 naw_norway.100.p:0 "Это доказывает необходимость твёрдых традиций против экстремизма."
 naw_norway.101.t:0 "Норвегия стремится к сближению с Германией"
 naw_norway.101.d:0 "[From.GetLeader] Объявили, что [From.GetName] Он должен развивать взаимодружественные и родственные отношения со своим братом народом в германской нации. Немецкие министры очень довольны этим, и в ходе недавнего государственного визита в Германию министры иностранных дел Германии выразили свое удовлетворение по этому поводу. [From.GetLeader]Они договорились содействовать взаимному сотрудничеству между двумя странами."
 naw_norway.101.a:0 "Мы сделали мудрый выбор."
 naw_norway.101.b:0 "Что задумали наши соседи?"
 naw_norway.101.c:0 "Несите шнапс — выпьем за новых друзей!"
 naw_norway.101.p:0 "Друзья наших друзей тоже могут стать друзьями."
 naw_norway.101.e:0 "В Северо-Западной Европе принимают сомнительные решения."
 naw_norway.101.f:0 "Следует отметить это развитие."
 naw_norway.102.t:0 "Норвегия стремится к сближению с Советами"
 naw_norway.102.d:0 "\n[From.GetLeader] Объявил о дружбе и взаимном сотрудничестве между [From.GetName] и их восточные соседи. Несомненно, норвежцы стали могущественным другом, и революция распространилась дальше. Российские министры рады этому событию, и в ходе недавнего государственного визита [From.GetLeader]Взаимная добрая воля была очевидна."
 naw_norway.102.a:0 "Мы сделали мудрый выбор."
 naw_norway.102.b:0 "Что задумали наши соседи?"
 naw_norway.102.c:0 "Несите водку — выпьем за новых друзей!"
 naw_norway.102.p:0 "Друзья наших друзей тоже могут стать друзьями."
 naw_norway.102.e:0 "В Северо-Западной Европе принимают сомнительные решения."
 naw_norway.102.f:0 "Следует отметить это развитие."
 naw_norway.140.t:0 "Гражданская война в Норвегии"
 naw_norway.140.d:0 "В эпоху стремительных политических перемен Норвегия выбрала иной путь, чем Советский Союз, Италия и Германия с их новыми идеологиями. В парламентской конституционной монархии многие требуют возвращения традиций, старых ценностей и старомодного королевства, но без власти Копенгагена или Стокгольма.\n\nКонсерваторы, центристы, аграрии и монархисты объединились с большей частью армии, чтобы восстановить такое государство. В столице им оказали массовое сопротивление, а из Европы прибывают добровольцы. Гражданская война началась."
 naw_norway.140.a:0 "Семья и традиции прежде всего!"
 naw_norway.140.b:0 "Братство и демократия прежде всего!"
 naw_norway.140.c:0 "Гражданская война у соседа? Нужно быть осторожнее, раз даже Норвегия может погрузиться в хаос..."
 naw_norway.140.p:0 "Бороться за монархию? Как это пойдет на пользу массам? Норвежские монархисты заблуждаются."
 naw_norway.140.e:0 "Как это могло произойти в Норвегии?"
 naw_norway.141.t:0 "Гражданская война окончена — оппозиция захвачена!"
 naw_norway.141.d:0 "После взятия Осло и последних опорных пунктов мы захватили лидеров вооружённой оппозиции. Одни требуют наказать виновников страданий гражданской войны, другие призывают к снисхождению: смелые люди, сражавшиеся за убеждения, могут пригодиться новому королевству. Как поступить?"
 naw_norway.141.a:0 "Массовые каторжные работы для тех, кто поднял народ с оружием!"
 naw_norway.141.b:0 "Каторга только для главных виновников."
 naw_norway.142.t:0 "Гражданская война в Норвегии завершена"
 naw_norway.142.d:0 "После взятия Осло победа монархистов стала лишь вопросом времени. Традиционалисты сражались за восстановление монархии, и теперь путь к реформам открыт.\n\nГлавных противников будут судить, а король Хокон, изначально выступавший против войны, выразил радость возвращению мира. Пусть начнётся исцеление."
 naw_norway.142.a:0 "Этот день наш!"
 naw_norway.142.b:0 "Хорошо. Норвежский народ больше не будет страдать от войны."
 naw_norway.142.c:0 "Хорошо знать."
 naw_norway.145.t:0 "Сепаратисты на Фарерах и в Исландии"
 naw_norway.145.d:0 "В войне Норвегии и Дании произошёл новый поворот. Норвежцы вместе с влиятельными исландцами и фарерцами подняли восстания против датского правления на бывших норвежских островах. Это серьёзно ослабит Данию."
 naw_norway.145.a:0 "Дипломатическая победа даже во время войны. Наше дело правое."
 naw_norway.145.b:0 "Грязная игра даже по военным меркам."
 naw_norway.145.c:0 "Хм... Возможно, у норвежцев всё же были основания."
 naw_norway.146.t:0 "Управление Гренландией передано государству [ICE.GetNameDef]"
 naw_norway.146.d:0 "\nТеперь автономное герцогство [NOR.GetNameDef]Администрация Гренландии была передана [ICE.GetNameDef] от [NOR.GetAdjective] Правительство, вероятно, с согласия [NOR.GetAdjective] Монарх. Возможно, одной из причин этого было то, что материковые норвежцы сосредоточили свои усилия в другом месте. Несмотря на то, что все еще остается доверие, консультанты [NOR.GetNameDef] Ранее они были интегрированы в исландские силы безопасности, чтобы обеспечить надлежащую защиту своих зон ответственности."
 naw_norway.146.a:0 "Гренландия уже была владением исландцев. Мы справимся."
 naw_norway.146.b:0 "Гренландия уже была владением исландцев. Уверены, они справятся."
 naw_norway.146.c:0 "Передаёте полномочия местным правительствам? Похоже, кто-то перегружен."
 naw_norway.150.t:0 "Монархический альянс государства [Root.GetNameDef]"
 naw_norway.150.d:0 "Мы уже продвигаем свои ценности в мире. После трудов представителей и государственных деятелей может родиться новый амбициозный альянс. Как его назвать?"
 naw_norway.150.a:0 "«Королевская лига». А теперь простите, хочется немного отдохнуть за футболом."
 naw_norway.150.b:0 "«Монархический союз». Зачем оставлять что-то воображению?"
 naw_norway.150.c:0 "«Союз королей». Множественное число важно, чтобы датчане или шведы не возомнили лишнего."
 naw_norway.150.p:0 "Хм... Покажите другие варианты."
 naw_norway.151.t:0 "Монархический альянс государства [Root.GetNameDef]"
 naw_norway.151.d:0 "Мы уже продвигаем свои ценности в мире. После трудов представителей и государственных деятелей может родиться новый амбициозный альянс. Как его назвать?"
 naw_norway.151.a:0 "«Родственные королевства» звучит хорошо. В этом есть приятное звучание."
 naw_norway.151.b:0 "«Северное царство», без сомнений. Географию недооценивают."
 naw_norway.151.c:0 "«Северный союз». Просто и оставляет место для традиционалистских республик. Hei Suomi!"
 naw_norway.151.p:0 "Хм... Покажите ещё варианты."
 naw_norway.152.t:0 "Монархический альянс государства [Root.GetNameDef]"
 naw_norway.152.d:0 "Мы уже продвигаем свои ценности в мире. После трудов представителей и государственных деятелей может родиться новый амбициозный альянс. Как его назвать?"
 naw_norway.152.a:0 "«Великий северный альянс» — в монархии всё-таки есть величие."
 naw_norway.152.b:0 "«Княжеский пакт» — просто и изящно."
 naw_norway.152.c:0 "Начнём выбор заново."
 naw_norway.152.p:0 "Пока не будем выбирать."
 naw_norway.153.t:0 "Приглашение в Королевское норвежское общество"
 naw_norway.153.d:0 "Королевское Норвежское общество является старейшим научным и научным учреждением в Норвегии. [From.GetNameDef]. Теперь, с [From.GetNameDef] проявляя все больший интерес за пределами своих границ, [From.GetName] Теперь это прежнее внутреннее общество, которое раздавало награды за инновации в Норвегии, превратилось в международное академическое общество. Престижное учреждение, монарх Норвегии является покровителем учреждения, к которому мы получили приглашение присоединиться. Сотрудничество в этой области может привести к обмену технологиями между всеми государствами-членами. Как мы ответим?"
 naw_norway.153.a:0 "Разумеется, вступим. Для нас это честь."
 naw_norway.153.b:0 "Хотя это выгодно всем, мы дорожим независимостью и вынуждены отказаться."
 naw_norway.153.c:0 "Звучит хорошо, но мы вынуждены отказаться."
 naw_norway.154.t:0 "Государство [From.GetName] направляет учёных в Королевское норвежское общество"
 naw_norway.154.d:0 "Государство [From.GetName] решило вступить в наше престижное академическое учреждение. Внешние идеи могут помочь нам, а наши учёные — им."
 naw_norway.154.a:0 "Приветствуем их учёных в нашем обществе!"
 naw_norway.155.t:0 "Государство [From.GetName] отказывается вступить в Королевское норвежское общество"
 naw_norway.155.d:0 "Государство [From.GetName] решило не вступать в наше престижное академическое общество. Хотя сотрудничество принесло бы пользу всем, оно предпочитает держать лучших специалистов при себе."
 naw_norway.155.a:0 "Жаль. Мы были бы рады их учёным."
 naw_norway.160.t:0 "Государство [From.GetName] хочет объединиться с Германской империей"
 naw_norway.160.d:0 "Государство [From.GetName] просит принять его в альянс. Если мы согласимся, к нам присоединятся традиционное северное королевство и его зависимые государства."
 naw_norway.160.a:0 "Согласиться. Германской империи пригодятся новые друзья."
 naw_norway.160.b:0 "Отказать. Нас устраивает нынешнее положение."
 naw_norway.161.t:0 "Государство [From.GetName] принимает нас в свой альянс"
 naw_norway.161.d:0 "Германский кайзер и его представители согласились принять нас в альянс. Вместе построим лучший мир."
 naw_norway.161.a:0 "Прекрасные новости."
 naw_norway.162.t:0 "Государство [From.GetName] отказывается принять нас в альянс..."
 naw_norway.162.d:0 "Германский кайзер отклонил наше щедрое предложение объединить силы."
 naw_norway.162.a:0 "Разочаровывающие новости."
 naw_norway.163.t:0 "Государство [From.GetName] хочет объединиться с империей"
 naw_norway.163.d:0 "Государство [From.GetName] просит принять его в альянс. Если мы согласимся, к нам присоединятся традиционное северное королевство и его зависимые государства."
 naw_norway.163.a:0 "Согласиться. Империи пригодятся новые друзья."
 naw_norway.163.b:0 "Отказать. Нас устраивает нынешнее положение."
 naw_norway.164.t:0 "Государство [From.GetName] принимает нас в свой альянс"
 naw_norway.164.d:0 "Британский король и его представители согласились принять нас в альянс. Вместе построим лучший мир."
 naw_norway.164.a:0 "Прекрасные новости."
 naw_norway.165.t:0 "Государство [From.GetName] отказывается принять нас в альянс..."
 naw_norway.165.d:0 "Британский король отклонил наше щедрое предложение объединить силы."
 naw_norway.165.a:0 "Разочаровывающие новости."
 naw_norway.170.t:0 "Государство [From.GetName] требует компенсацию за помощь"
 naw_norway.170.d:0 "Норвежцы, присоединившись к нам, теперь требуют компенсацию за помощь в защите наших земель и империи. Их поддержка полезна, поэтому они просят вернуть старое владение — Шетландские острова."
 naw_norway.170.a:0 "Справедливо. Пусть получат Шетланды."
 naw_norway.170.b:0 "Не будем расставаться с островами."
 naw_norway.171.t:0 "Государство [From.GetName] соглашается передать Шетланды"
 naw_norway.171.d:0 "Британцы приняли сделку, и Шетландские острова вскоре будут переданы нам. Морские границы определят позднее."
 naw_norway.171.a:0 "Большое спасибо."
 naw_norway.172.t:0 "Государство [From.GetName] отказывается передать Шетланды"
 naw_norway.172.d:0 "Британцы сочли сделку неприемлемой, и Шетландские острова пока останутся у них."
 naw_norway.172.a:0 "Какое разочарование."
 naw_norway.173.t:0 "Государство [From.GetName] требует компенсацию за помощь"
 naw_norway.173.d:0 "Норвежцы требуют компенсацию за защиту наших земель и империи, конкретно Оркнейские и Шетландские острова. Согласиться, предложить меньшую компенсацию или полностью отказать?"
 naw_norway.173.a:0 "Пусть друзья получат свои старые острова."
 naw_norway.173.b:0 "Передадим только Шетланды. Рано или поздно они согласятся."
 naw_norway.173.c:0 "Отказать в передаче островов."
 naw_norway.174.t:0 "Государство [From.GetName] соглашается передать Шетланды и Оркни"
 naw_norway.174.d:0 "Британцы сочли сделку справедливой и начали передачу наших старых островов. Морские границы определят позднее."
 naw_norway.174.a:0 "Большое спасибо."
 naw_norway.175.t:0 "Государство [From.GetName] передаёт Шетланды, но не Оркни"
 naw_norway.175.d:0 "Британцы почти приняли сделку, но решили сохранить Оркни. Наши дипломаты согласились, опасаясь остаться ни с чем. Морские границы определят позднее."
 naw_norway.175.a:0 "Спасибо."
 naw_norway.176.t:0 "Государство [FROM.GetName] отказывается передать любые острова"
 naw_norway.176.d:0 "Британцы сочли сделку неприемлемой и решили сохранить все острова. Наши дипломаты вернулись ни с чем."
 naw_norway.176.a:0 "Спасибо, что выслушали..."
 naw_norway.180.t:0 "Совместный антибольшевистский альянс?"
 naw_norway.180.d:0 "Видя растущую угрозу старому порядку и традициям, государство [FROM.GetNameDef] приглашает нас в новый союз монархических и традиционалистских стран. Альянс должен противостоять политическому экстремизму и агрессии, прежде всего большевизму.\n\nВступить ли нам? Наши субъекты последуют за нами, а другие участники нынешнего альянса смогут выбирать самостоятельно."
 naw_norway.180.a:0 "Да. Пусть великий альянс станет реальностью!"
 naw_norway.180.b:0 "Не лучше ли им присоединиться к нам? Сделаем встречное предложение."
 naw_norway.180.c:0 "Чем малонаселённый Север вообще может помочь?"
 naw_norway.181.t:0 "Государство [FROM.GetName] вступает в традиционалистский альянс"
 naw_norway.181.d:0 "Приветствуем новых друзей из государства [FROM.GetName]. Великий день для наших ценностей."
 naw_norway.181.a:0 "Мы становимся ещё сильнее!"
 naw_norway.182.t:0 "Государство [FROM.GetName] отказывается вступить в традиционалистский альянс"
 naw_norway.182.d:0 "Государство [FROM.GetName] решило идти собственным путём без нас."
 naw_norway.182.a:0 "Похоже, они не готовы."
 naw_norway.183.t:0 "Дипломатическое встречное предложение государства [FROM.GetName]"
 naw_norway.183.d:0 "Государство [FROM.GetNameDefCap], само возглавляющее альянс, не захотело напрямую вступать к нам, но не против сотрудничества. Оно предлагает, чтобы мы и наши зависимые государства вступили в их союз. Как ответить?"
 naw_norway.183.a:0 "Приемлемо. Последуем за ними."
 naw_norway.183.b:0 "Интересно, но подчиниться их руководству означало бы недооценить себя."
 naw_norway.184.t:0 "Государство [FROM.GetName] принимает наше встречное предложение"
 naw_norway.184.d:0 "Руководство государства [FROM.GetAdjective] приняло щедрое встречное предложение вступить в наш альянс вместо того, чтобы мы вошли под их руководство. Разумный компромисс снова победил."
 naw_norway.184.a:0 "Мудрый выбор."
 naw_norway.185.t:0 "Государство [FROM.GetName] отвергает наше встречное предложение"
 naw_norway.185.d:0 "Руководство государства [FROM.GetAdjectiveCap] отклонило предложение вступить в наш альянс. Жаль, что они не смогли пойти на компромисс."
 naw_norway.185.a:0 "Похоже, они не умеют договариваться."
 naw_norway.186.t:0 "Лидер альянса вступает в союз государства [FROM.FROM.GetNameDef]"
 naw_norway.186.d:0 "Наш бывший лидер, государство [FROM.GetName], решил усилить союз, вступив в альянс государства [FROM.FROM.GetName]. Остальным участникам, включая нас, также предложено присоединиться."
 naw_norway.186.a:0 "Разумеется, последуем за ними."
 naw_norway.186.b:0 "Нет, останемся на месте."
 naw_norway.187.t:0 "Участник альянса государства [FROM.FROM.GetNameDef] присоединяется"
 naw_norway.187.d:0 "Кроме бывшего лидера фракции [FROM.FROM.GetName]Другие страны в их фракции также имели возможность присоединиться к нам. Теперь [FROM.GetNameDef] Решил подружиться."
 naw_norway.187.a:0 "Что ж, добро пожаловать в наш альянс."
 naw_norway.188.t:0 "Участник альянса государства [FROM.FROM.GetNameDef] остаётся в стороне"
 naw_norway.188.d:0 "Кроме бывшего лидера фракции [FROM.FROM.GetName]Другие страны в их фракции также имели возможность присоединиться к нам. В данном случае, [FROM.GetNameDef] К сожалению, он решил остаться на месте."
 naw_norway.188.a:0 "Что ж, пожелаем им удачи."
 naw_norway.199.t:0 "Множество обязанностей короля"
 naw_norway.199.d:0 "С уменьшением риска того, что ему придется сражаться с родной родиной, [DEN.getName]Король Хокон VII теперь доступен и потенциально готов играть более прямую роль во время войны. В то время как служение в качестве монарха и главы государства уже имеет много обязанностей, некоторые из них могут быть делегированы другим членам королевской семьи, а также связанным государственным деятелям. Это освободит нашего монарха на одну дополнительную роль, которая может вдохновить наших военных и граждан в любых конфликтах, в которые они могут быть втянуты.\n\nВ то время как теоретически высший главнокомандующий страны, непосредственное командование силами на практике оставлено на самый высокий ранг карьерных офицеров ветвей вооруженных сил. Роль советника была бы самым безопасным выбором, но служба в качестве командующего армией высшего ранга могла бы вдохновить наши войска, хотя сам Хаакон опасается этого, поскольку это не его область знаний. Другим вариантом может быть предоставление королю возможности служить в качестве командующего военно-морским флотом, так как он был формально образован и служил офицером военно-морского флота.\nИтак, должны ли мы переложить обязанности короля на поддержку военных или продолжать, как раньше?"
 naw_norway.199.a:0 "Король Хокон VII должен стать §Yсоветником§!: это разумно и безопасно."
 naw_norway.199.b:0 "Король Хокон VII должен стать §Yкомандующим армией§!: это вдохновит войска."
 naw_norway.199.c:0 "Король Хокон VII должен стать §Yкомандующим флотом§!: это его область знаний."
 naw_norway.199.p:0 "Пусть король Хокон VII продолжит выполнять нынешние обязанности. Пожалуй, это была плохая идея."
 naw_norway.200.t:0 "[ROOT.GetAdjective]ая стража нейтралитета"
 naw_norway.200.d:0 "Чувствуя опасность и потенциальный конфликт, назревающий в Европе, [ROOT.GetLeader] и [ROOT.GetRulingParty] Приняли решение сохранить [ROOT.GetNameDef] Он вышел из конфликта теми же средствами, которые когда-то использовались для того, чтобы обе страны и остальная часть Скандинавии не вступали в конфликт во время Великой войны. В то время как обе стороны были тогда удовлетворены нейтральной Скандинавией (несмотря на торговое давление на Норвегию и Данию со стороны Антанты и Центральных держав соответственно), есть надежда, что в очередной раз любые европейские державы, вовлеченные в крупные конфликты, придут к тому же выводу, но если нет, сильные вооруженные силы в форме Охраны нейтралитета до настоящего времени. [GetYear] Это может быть сдерживание, необходимое для поддержания мира среди потенциальных нападающих.\n\nОхрана нейтралитета для страны за рубежом от любых крупных держав будет двоякой: военно-морское сдерживание в виде патрульных катеров и на суше, обученные и хорошо оснащенные военные, готовые защищать страну."
 naw_norway.200.a:0 "Хорошо. Сильная сухопутная армия отпугнёт любого захватчика."
 naw_norway.200.b:0 "Хорошо. Нужен сбалансированный курс: важны и армия, и флот."
 naw_norway.200.c:0 "Хорошо. Сильный флот сделает попытку высадки слишком опасной."
 naw_norway.201.t:0 "Государство [From.GetName] объявляет вооружённый нейтралитет"
 naw_norway.201.d:0 "[From.GetNameDefCap] Она решила, что будет лучше, если страна снова будет стремиться к нейтралитету, как это было во время Великой войны. Это и есть надежда на [ROOT.GetAdjective] Правительство в [ROOT.GetLeader] Это позволит избежать опасного конфликта на пороге норвежского народа. Эта четкая позиция также должна быть подкреплена возросшей военной готовностью защищать страну и ее территориальные воды. Но вопрос остается, может ли [From.GetNameDef] Доверить миру уважать этот нейтралитет?"
 naw_norway.201.a:0 "Пока им не угрожает непосредственная опасность."
 naw_norway.201.b:0 "Спасёт ли это государство [From.GetName] от региональной агрессии?"
 naw_norway.201.c:0 "Что ж, они хотя бы попытались..."
 naw_norway.201.p:0 "Если в прошлый раз сработало..."
 naw_norway.202.t:0 "Государство [GER.GetName] нарушает [NOR.GetAdjective]ий нейтралитет!"
 naw_norway.202.d:0 "Государство [GER.GetName] решило, что не желает видеть государство [NOR.GetNameDef] нейтральным соседом в грядущей войне. Возможно, оно не доверяет Норвегии из-за скрытой помощи Британии во второй половине Великой войны. Какова бы ни была причина, стране угрожает индустриальная держава с юга."
 naw_norway.202.a:0 "К счастью, мы хорошо подготовлены."
 naw_norway.202.b:0 "По крайней мере, наши силы в какой-то мере готовы."
 naw_norway.202.c:0 "К сожалению, мы совершенно не готовы."
 naw_norway.202.p:0 "Когда дойдёт до дела, норвежцы встанут на сторону наших врагов..."
 naw_norway.202.e:0 "Похоже, государство [GER.GetNameDef] совсем не верило в норвежский нейтралитет..."
 naw_norway.203.t:0 "Государство [ENG.GetName] нарушает [NOR.GetAdjective]ий нейтралитет!"
 naw_norway.203.d:0 "[ENG.GetName] Он решил, что в его интересах избежать [NOR.GetNameDef] Как нейтральный сосед в предстоящем конфликте. Могут ли действия [ENG.GetName] Они хотят отрезать немецкие поставки железа из Северной Швеции? Какова бы ни была причина, Норвегия сейчас находится под угрозой со стороны своего соседа по Северному морю."
 naw_norway.203.a:0 "К счастью, мы хорошо подготовлены."
 naw_norway.203.b:0 "По крайней мере, наши силы в какой-то мере готовы."
 naw_norway.203.c:0 "К сожалению, мы совершенно не готовы."
 naw_norway.203.p:0 "Мы не можем рисковать их торговлей или снабжением наших врагов. Их нужно остановить..."
 naw_norway.203.e:0 "Похоже, государство [ENG.GetNameDef] совсем не верило в норвежский нейтралитет..."
 naw_norway.204.t:0 "Агрессоры нарушают [NOR.GetAdjective]ий нейтралитет!"
 naw_norway.204.d:0 "Казалось бы, враги [NOR.GetNameDef] Они решили, что в их интересах избежать [NOR.GetNameDef] Как нейтральная страна Северо-Западной Европы. Это стало неожиданностью для внешних наблюдателей, которые могли только предполагать, почему это произошло. Разве они не любили [NOR.GetNameDef]Торговля с некоторыми странами? Или они не доверяли ему, чтобы он оставался нейтральным?"
 naw_norway.204.a:0 "К счастью, мы хорошо подготовлены."
 naw_norway.204.b:0 "По крайней мере, наши силы в какой-то мере готовы."
 naw_norway.204.c:0 "К сожалению, мы совершенно не готовы."
 naw_norway.204.p:0 "Пусть наблюдатели недоумевают. Пока наш великий план должны понимать только мы!"
 naw_norway.204.e:0 "Что могло заставить их внезапно пойти на такие крайние меры?"
 naw_norway.205.t:0 "Государство [From.GetName] просит принять его в наш альянс"
 naw_norway.205.d:0 "После нарушения нейтралитета иностранными агрессорами государство [From.GetNameDef] просит принять его в альянс и защитить от тех, кто попрал его нейтралитет. Согласиться?"
 naw_norway.205.a:0 "Да. Государство [From.GetName] может рассчитывать на нашу защиту."
 naw_norway.205.b:0 "Нет. Государство [From.GetName] станет лишь обузой..."
 naw_norway.206.t:0 "Государство [From.GetName] принимает нас в свой альянс"
 naw_norway.206.d:0 "Друзья из государства [From.GetNameDef] приняли нас в альянс в трудный час. Теперь агрессоры узнают, что их наглости противостоят и другие!"
 naw_norway.206.a:0 "Настоящие друзья отвечают на призыв."
 naw_norway.207.t:0 "Государство [From.GetName] отказывается принять нас в свой альянс"
 naw_norway.207.d:0 "Государство [From.GetName] решило, что спасать нас в трудный час слишком хлопотно..."
 naw_norway.207.a:0 "Похоже, здесь нам не повезло. Искать помощь в другом месте?"
 naw_norway.210.t:0 "Государство [From.GetName] требует пересмотра Кильского договора"
 naw_norway.210.d:0 "Кильский договор после Наполеоновских войн отделил от Норвегии её исторические части после поражения датско-норвежской унии. Норвежцы утверждают, что североатлантические острова были тесно связаны с Норвегией и почти не связаны с Данией. Исландский, фарерский и норвежский происходят от западноскандинавских языков, в отличие от датского и шведского. Сейчас Норвегия полезнее нам, чем государство [DEN.GetName], поэтому момент может быть подходящим."
 naw_norway.210.a:0 "Хорошо. Поддержим возвращение островов государству [FROM.GetName]."
 naw_norway.210.b:0 "Нет. Не будем нарушать статус-кво даже ради государства [FROM.GetName]."
 naw_norway.211.t:0 "Государство [From.GetName] разрешает пересмотр Кильского договора"
 naw_norway.211.d:0 "Кильский договор отделил от Норвегии исторические территории после поражения датско-норвежской унии. Мы доказали, что североатлантические острова тесно связаны с нами и мало связаны с Данией, а исландский, фарерский и норвежский происходят от западноскандинавских языков. Учитывая наши убедительные доводы и большую практическую пользу в войне по сравнению с государством [DEN.GetName], государство [FROM.GetName] поддержало нас!"
 naw_norway.211.a:0 "Прекрасно. Великая несправедливость исправлена благодаря капле оппортунизма."
 naw_norway.212.t:0 "Государство [From.GetName] отказывает в пересмотре Кильского договора"
 naw_norway.212.d:0 "Кильский договор был договором после наполеоновских войн, который отделил бывшие неотъемлемые части Королевства Норвегия от них, когда датско-норвежский союз был закончен, поскольку они вышли на проигравшую сторону войн. Мы утверждали, что североатлантические острова имели тесные связи с нами и практически не имели связей с Данией в то время. Действительно, исландский, фарерский и норвежский языки являются западно-норвежскими языками потомков в отличие от датского и шведского языков. Даже на основе наших твердых аргументов и более практического использования, чем в случае с другими людьми. [DEN.GetName] Во время военных действий, [FROM.GetName] Он решил сохранить статус-кво..."
 naw_norway.212.a:0 "Ужасные новости. Великая несправедливость останется нерешённой."
 naw_norway.213.t:0 "Государство [From.GetName] разрешает пересмотр Кильского договора"
 naw_norway.213.d:0 "Кильский договор был договором после наполеоновских войн, который отделил бывшие неотъемлемые части Королевства Норвегия от них, когда датско-норвежский союз был закончен, поскольку они вышли на проигравшую сторону войн. Норвежцы утверждали, что североатлантические острова имели тесные связи с ними и практически не имели связей с нами в то время. Действительно, исландский, фарерский и норвежский языки являются западно-норвежскими языками потомков в отличие от датского и шведского языков. С другой стороны, мы удерживали их в течение столетия, и вы могли бы подумать, что нарушение статус-кво, как это пойдет против [FROM.GetName]Природа. Но, увы, [FROM.GetName] Он выразил готовность поддержать предложение норвежцев... Давайте хотя бы надеяться, что они освободит Данию как следует и компенсируют нам иными способами."
 naw_norway.213.a:0 "Плохие новости. Почему это вообще стало приоритетом в такие тяжёлые времена?"
 naw_norway.214.t:0 "Государство [From.GetName] разрешает пересмотр Кильского договора"
 naw_norway.214.d:0 "Кильский договор после Наполеоновских войн отделил от Норвегии её исторические территории после распада датско-норвежской унии. Норвежцы утверждают, что североатлантические острова были тесно связаны с ними и почти не связаны с нами. Исландский, фарерский и норвежский действительно происходят от западноскандинавских языков, в отличие от датского и шведского. Учитывая меньшую пользу государства [DEN.GetName] в войне по сравнению с норвежцами, государство [FROM.GetName] поддержало притязания государства [NOR.GetName]. Вероятно, это сблизит нас с Норвегией. Хорошо это или плохо, пока неизвестно, но, надеемся, будет лучше датского правления."
 naw_norway.214.a:0 "Хорошо. Из дальней родни станем близкой семьёй."
 naw_norway.214.b:0 "Нет. Даже если это не датчане, мы должны отказаться. Будем надеяться, они на этом остановятся."
 naw_norway.215.t:0 "Государство [From.GetName] соглашается на воссоединение"
 naw_norway.215.d:0 "Жителей государства [FROM.GetAdjectiveCap] можно считать одними из самых истинных сынов государства [ROOT.GetNameDef], особенно с учётом древней истории. Они согласились на воссоединение, хотя получили определённую автономию."
 naw_norway.215.a:0 "С возвращением, братья!"
 naw_norway.216.t:0 "Государство [From.GetName] отвергает воссоединение"
 naw_norway.216.d:0 "Жителей государства [FROM.GetAdjectiveCap] можно считать одними из самых истинных сынов государства [ROOT.GetNameDef], но они отказались от воссоединения государств [FROM.GetName] и [ROOT.GetName], даже несмотря на обещанную автономию."
 naw_norway.216.a:0 "Наши братья не вернулись..."
 naw_norway.230.t:0 "Создание «Нортрашипа»"
 naw_norway.230.d:0 "С началом войны предложено создать единое управление для нашего огромного современного торгового флота. Через представительства в дружественных странах им можно будет управлять с нейтральной или союзной территории.\n\nОрганизация получила название Norwegian Shipping and Trade Mission, сокращённо «Нортрашип». Она может стать крайне важной не только для моряков и страны, но и для крупных союзников государства [ROOT.GetNameDef]. [ROOT.GetAdjective]ий торговый флот относится к лучшим в мире и включает старые пароходы, современные теплоходы, танкеры, китобойные и фруктовые суда. Благодаря этому поток снабжения через Атлантику не прекратится."
 naw_norway.230.a:0 "План управления торговым флотом подготовлен."
 naw_norway.231.t:0 "Государство [FROM.GetName] координирует торговый флот с государством [ENG.GetNameDef]"
 naw_norway.231.d:0 "\nВовлеченный в конфликт, [FROM.GetNameDef] Создал совместную администрацию судоходства, чтобы направлять обширные [FROM.GetAdjective] Торговый флот в военное время назывался Норвежской Морской и Торговой Миссией, или Нортрашипом. В связи с этим интересы [FROM.GetNameDef] и [FROM.GetAdjective] Моряки должны быть защищены, обеспечивая при этом поставки своим основным союзникам.\n\nСделка между [FROM.GetAdjective] и [ENG.GetAdjective] В конце концов делегаты были подписаны, хотя и с компромиссами по управлению флотом и заработной плате моряков.[ENG.GetName]Обеспокоенность по поводу получения достаточного количества нефти и поставок через Атлантику в настоящее время значительно сократилась."
 naw_norway.231.a:0 "Даже при сильном давлении государства [ENG.GetNameDef] это хорошая сделка."
 naw_norway.231.b:0 "Государство [FROM.GetName] выдвигало жёсткие требования, но по важному вопросу удалось договориться."
 naw_norway.231.c:0 "[FROM.GetAdjective]ий торговый флот теперь работает против нас — значительная победа врагов."
 naw_norway.231.p:0 "[FROM.GetAdjective]ий торговый флот теперь работает на государство [ENG.GetNameDef], принося ему большую пользу."
 naw_norway.232.t:0 "Государство [FROM.GetName] координирует торговый флот с государством [GER.GetNameDef]"
 naw_norway.232.d:0 "\nВовлеченный в конфликт, [FROM.GetNameDef] Создал совместную администрацию судоходства, чтобы направлять обширные [FROM.GetAdjective] Торговый флот в военное время назывался Норвежской Морской и Торговой Миссией, или Нортрашипом. В связи с этим интересы [FROM.GetNameDef] и [FROM.GetAdjective] Моряки должны быть защищены, обеспечивая при этом поставки своим основным союзникам.\n\nСделка между [FROM.GetAdjective] и [GER.GetAdjective] В конце концов делегаты были подписаны, хотя и с компромиссами по управлению флотом и заработной плате моряков. Хотя [FROM.GetNameDef] Возможно, в силу сложившихся обстоятельств, норвежско-германская координация военно-морских сил все еще реальна."
 naw_norway.232.a:0 "Даже при сильном давлении государства [GER.GetNameDef] это хорошая сделка."
 naw_norway.232.b:0 "Государство [FROM.GetName] выдвигало жёсткие требования, но по важному вопросу удалось договориться."
 naw_norway.232.c:0 "[FROM.GetAdjective]ий торговый флот теперь работает против нас — значительная победа врагов."
 naw_norway.232.p:0 "[FROM.GetAdjective]ий торговый флот теперь работает на государство [GER.GetNameDef], принося ему большую пользу."
 naw_norway.233.t:0 "Государство [FROM.GetName] координирует торговый флот с государством [GER.GetNameDef]"
 naw_norway.233.d:0 "\nВовлеченный в конфликт, [FROM.GetNameDef] Создал совместную администрацию судоходства, чтобы направлять обширные [FROM.GetAdjective] Торговый флот в военное время назывался Норвежской Морской и Торговой Миссией, или Нортрашипом. В связи с этим интересы [FROM.GetNameDef] и [FROM.GetAdjective] Моряки должны быть защищены, обеспечивая при этом поставки своим основным союзникам.\n\nСделка между [FROM.GetAdjective] и [GER.GetAdjective] В конце концов делегаты были подписаны, хотя и с компромиссами по управлению флотом и заработной плате моряков. Несмотря на тесные исторические связи с [ENG.GetNameDef]Последние политические события привели к [FROM.GetNameDef] выравниваться с [GER.GetNameDef]."
 naw_norway.233.a:0 "Даже при сильном давлении государства [GER.GetNameDef] это хорошая сделка."
 naw_norway.233.b:0 "Государство [FROM.GetName] выдвигало жёсткие требования, но по важному вопросу удалось договориться."
 naw_norway.233.c:0 "[FROM.GetAdjective]ий торговый флот теперь работает против нас — значительная победа врагов."
 naw_norway.233.p:0 "[FROM.GetAdjective]ий торговый флот теперь работает на государство [GER.GetNameDef], принося ему большую пользу."
 naw_news.100.t:0 "Падение Копенгагена"
 naw_news.100.d:0 "Норвежские войска, наступавшие через Зеландию, захватили Копенгаген.\n\nОтдельные бои продолжаются, но к моменту достижения Фредериксстадена с дворцом Амалиенборг ожесточённое сопротивление и артиллерийский огонь уже сменились перестрелками, поэтому архитектура рококо почти не пострадала.\n\nЧасть датчан эвакуировалась до и во время вторжения, намереваясь продолжить сопротивление. Город в основном молчит, пока норвежцы укрепляют контроль.\n\nБорьба Дании против государства [NOR.GetNameDef] может продолжиться, но потеря столицы серьёзно ударит по правительству и армии."
 naw_news.100.a:0 "Дания не смогла противостоять государству [NOR.GetNameDef]."
 naw_news.100.b:0 "Славная победа сынов Норвегии!"
 naw_news.100.c:0 "Будто шведского вторжения в Копенгаген было недостаточно."
 naw_news.101.t:0 "Падение Стокгольма"
 naw_news.101.d:0 "Пока бои продолжаются в других частях государства [SWE.GetNameDef], поступили сообщения о вступлении норвежских частей в Стокгольм.\n\nШведские граждане и норвежские солдаты пребывают в странном настроении после неожиданной войны. После захвата основных учреждений норвежцы провели короткий парад. Бои быстро свелись к перестрелкам, поэтому город сохранился удивительно хорошо, хотя старая телефонная башня частично обрушилась от миномётного огня.\n\nЭти новости серьёзно ослабят решимость Швеции."
 naw_news.101.a:0 "Похоже, государство [NOR.GetNameDefCap] наносит удар сильнее своей весовой категории."
 naw_news.101.b:0 "Баланс сил наконец сместился обратно к Западной Скандинавии."
 naw_news.101.c:0 "В это невозможно поверить!"
 naw_news.102.t:0 "Падение Хельсинки"
 naw_news.102.d:0 "Сообщения из Южной Финляндии подтверждают захват столицы наступающими норвежскими войсками.\n\nВ некоторых районах и на окраинах ещё слышна стрельба, но крупных финских сил в городе не замечено.\n\nНорвежские снайперы заняли позиции возле Хельсинкского университета, ограничив возможности контратак. Правительство и высокопоставленные чиновники, похоже, эвакуировались до начала боёв."
 naw_news.102.a:0 "Похоже, [NOR.GetAdjectiveCap]ая армия продолжает наступление."
 naw_news.102.b:0 "Теперь финны должны подчиниться."
 naw_news.102.c:0 "Чего вообще хотят здесь норвежцы?"
 naw_news.200.t:0 "Государство [ENG.GetNameDef] пересматривает Кильский договор"
 naw_news.200.d:0 "\n\nКильский договор после Наполеоновских войн отделил от Норвегии её исторические территории после распада датско-норвежской унии. Норвежцы утверждали, что североатлантические острова были тесно связаны с Норвегией и почти не связаны с Данией. Исландский, фарерский и норвежский происходят от западноскандинавских языков, в отличие от датского и шведского. Теперь государство [NOR.GetNameDef] успешно убедило государство [ENG.GetNameDef] пересмотреть договор и вернуть острова под [NOR.GetAdjective]ий контроль."
 naw_news.200.a:0 "Великая несправедливость против государства [FROM.GetNameDef] исправлена. Мы благодарны."
 naw_news.200.b:0 "Они исправляют даже старые ошибки ради государства [FROM.GetName]. Теперь пусть хорошо помогает нам."
 naw_news.200.c:0 "[ENG.GetAdjectiveCap]ая сторона явно очень заинтересована удержать государство [FROM.GetName] на своей стороне."
 naw_news.200.p:0 "[ENG.GetAdjectiveCap]ая сторона ударила нас, когда мы были слабы. Со временем потребуем компенсацию..."
