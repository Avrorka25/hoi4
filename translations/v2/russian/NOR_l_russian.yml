 NOR_pull_strings_with_british_industrialists:0 "Использовать связи с британскими промышленниками"
 NOR_request_aid_for_englandsfarerne:0 "Запросить помощь для «Englandsfarerne»"
 NOR_finish_the_post-depression_recovery:0 "Завершить восстановление после депрессии"
 NOR_finish_the_post-depression_recovery_desc:0 "Поскольку страна и экономика находятся в сравнительно хорошем состоянии, мы можем выделить значительные средства на устранение последних последствий депрессии и объявить социальную программу правительства Нюгорсволла безусловным успехом. Норвежский народ ещё долгие годы будет благодарен за этот шаг."
 NOR_procure_british_destroyers:0 "Закупить британские эсминцы"
 NOR_procure_british_destroyers_desc:0 "Благодаря военно-морскому сотрудничеству с британцами мы сможем приобрести у них эсминцы по весьма разумной цене, ведь сильный норвежский флот отвечает интересам всех сторон."
 NOR_procure_british_destroyers_tt:0 "После завершения строительства нам передадут два британских §Yэсминца§!. Исследование §Yулучшенных эсминцев§! позволит получить более современные корабли."
 NOR_procure_german_destroyers:0 "Закупить германские эсминцы"
 NOR_procure_german_destroyers_desc:0 "Благодаря военно-морскому сотрудничеству с немцами мы сможем приобрести у них эсминцы по весьма разумной цене, ведь сильный норвежский флот отвечает интересам всех сторон."
 NOR_procure_german_destroyers_tt:0 "После завершения строительства нам передадут два германских §Yэсминца§!. Исследование §Yулучшенных эсминцев§! позволит получить более современные корабли."
 ENG_GER_stop_procurements:0 "Прекратить дальнейшие закупки кораблей Норвегией"
 ENG_GER_reallow_procurements:0 "Снова разрешить дальнейшие закупки кораблей Норвегией"
 NOR_glomma-halden_line:0 "Построить линию Гломма — Халден"
 NOR_glomma-halden_line_desc:0 "Найм подрядчиков для строительства линии бункеров и укреплений к востоку от Осло защитит этот важный город от агрессоров. Традиционный путь вторжения из Швеции в сердце страны должен быть перекрыт серьёзными препятствиями."
 NOR_lyngen_line:0 "Построить линию Люнгена"
 NOR_lyngen_line_desc:0 "При нейтральной Швеции мы можем остановить сухопутные атаки через Северную Норвегию, построив укрепления и бункеры в горах Люнгена в Тромсе. Узкие границы также направят любого агрессора, опасающегося нарушить шведский нейтралитет."
 NOR_railroad_development:0 "Развитие железных дорог"
 NOR_railroad_development_desc:0 "С XIX века в Норвегии построено множество железных дорог, соединяющих разбросанное население страны через суровую местность быстрее, чем когда-либо прежде, за исключением отдельных морских, озёрных и речных участков.\nТекущий уровень §Yразвития железных дорог§!:\n\nЭто также важно для перемещения армии и позволит быстрее реагировать на угрозы при правильной интеграции военных перевозок. При достаточном развитии станут доступны новые проекты и особые преимущества. Проекты открываются при уровне §Yразвития железных дорог§!:\nУровень 1: §Y0+§!    Уровень 2: §Y6+§!    Уровень 3: §Y12+§!"
 NOR_railroad_development_icon_value:0 "[?NOR.railroad_development|0H]"
 NOR_railroad_development_full_breakdown:0 "Государство [Root.GetNameDefCap] сейчас имеет [?NOR.railroad_development|+0] ед. §Hразвития железных дорог§!. При дальнейшем росте могут открыться новые решения и преимущества.\n"
 NOR_railroad_development_add_1_tt:0 "\nЗавершение добавит §G1§! ед. §Yразвития железных дорог§!."
 NOR_continued_electrification_of_dovrebanen:0 "Продолжить электрификацию Довребанен"
 NOR_continued_electrification_of_dovrebanen_desc:0 "Продолжающийся проект электрификации новых участков Довребанен сделает перевозки эффективнее и надёжнее и станет шагом к общей электрификации Норвегии."
 NOR_electrification_of_central_norways_railroads:0 "Электрификация железных дорог Центральной Норвегии"
 NOR_electrification_of_central_norways_railroads_desc:0 ""
 NOR_electrification_of_eastern_norways_railroads:0 "Электрификация железных дорог Восточной Норвегии"
 NOR_electrification_of_eastern_norways_railroads_desc:0 "После почти полной электрификации Довребанен следующим шагом станет электрификация других линий Восточной Норвегии. Сразу охватить все дороги не получится, но значительная часть даст нам гораздо более эффективную инфраструктуру."
 NOR_electrification_of_northern_norways_railroads:0 "Электрификация железных дорог Северной Норвегии"
 NOR_electrification_of_northern_norways_railroads_desc:0 ""
 NOR_electrification_of_southern_norways_railroads:0 "Электрификация железных дорог Южной Норвегии"
 NOR_electrification_of_southern_norways_railroads_desc:0 ""
 NOR_electrification_of_western_norways_railroads:0 "Электрификация железных дорог Западной Норвегии"
 NOR_electrification_of_western_norways_railroads_desc:0 "Западная Норвегия обладает отличными условиями для гидроэнергетики, поэтому электрификация главных железных дорог региона станет особенно разумным вложением."
 NOR_electrify_border_region_jamtland:0 "Электрифицировать приграничный Емтланд"
 NOR_electrify_border_region_jamtland_desc:0 "Шведы были одними из пионеров электрификации железных дорог благодаря большому гидроэнергетическому потенциалу. Линия Кируна — Стокгольм стала приоритетной и оказалась успешной. Теперь после крупных проектов в наших центрах населения и производства можно выделить ресурсы приграничным районам. Жители Емтланда оценят это, а движение станет эффективнее."
 NOR_electrify_border_region_vaestergoetland:0 "Электрифицировать приграничный Вестергётланд"
 NOR_electrify_border_region_vaestergoetland_desc:0 "Шведы были одними из пионеров электрификации железных дорог благодаря большому гидроэнергетическому потенциалу. После успеха линии Кируна — Стокгольм и наших собственных крупных проектов можно вложиться в приграничный Вестергётланд. Если регион останется под шведским контролем, они наверняка оценят шаг, а движение через него станет эффективнее."
 NOR_extend_nordlandsbanen_to_narvik:0 "Продлить Нурланнскую линию до Нарвика"
 NOR_extend_nordlandsbanen_to_narvik_desc:0 "Теперь, когда линия достигла Будё, её продление до важного незамерзающего порта Нарвик позволит перевозить ресурсы и людей между ним и большей частью Норвегии без морского сообщения. Несмотря на политические споры о дальнейшем продвижении на север, соединение будет полезным."
 NOR_extend_nordlandsbanen_to_tromsoe:0 "Продлить Нурланнскую линию до Тромсё"
 NOR_extend_nordlandsbanen_to_tromsoe_desc:0 "Продление линии к Люнгена и Тромсё окончательно свяжет население и экономические центры Северной Норвегии с остальной страной. Местность сурова, а политические споры не менее суровы, но район Тромсё выглядит разумной конечной точкой."
 NOR_extend_raumabanen_to_molde_and_aalesund:0 "Продлить Раумабанен до Молде и Олесунна"
 NOR_extend_raumabanen_to_molde_and_aalesund_desc:0 "Линия уже достигла Ондалснеса во внутреннем Ромсдале, но дальнейшее продвижение к Кристиансунну, Молде или Олесунну застопорилось из-за споров прибрежных городов. Следует преодолеть политический тупик и всё же связать крупные населённые пункты побережья. Когда-нибудь это обязательно произойдёт. Верно?"
 NOR_finalize_the_conversion_of_roerosbanen_to_standard-gauge:0 "Завершить перевод Рёрусбанен на стандартную колею"
 NOR_finalize_the_conversion_of_roerosbanen_to_standard-gauge_desc:0 "Рёрусбанен — одна из старейших железных дорог Норвегии, построенная по прежним узкоколейным стандартам. Сейчас она поэтапно переводится на современную стандартную колею. Завершение работ повысит скорость и эффективность использования старой линии."
 NOR_invest_in_the_cross-iceland_railroad:0 "Инвестировать в трансисландскую железную дорогу"
 NOR_invest_in_the_cross-iceland_railroad_desc:0 "Железная дорога через Исландию до недавнего времени была лишь теорией, но развитие нашей сети позволяет вложить излишки промышленности, материалов и средств в её строительство, сразу используя местную гидроэнергию. Такие инвестиции укрепят торговые и инвестиционные связи с исландцами."
 NOR_prepare_bergensbanen_for_military_use:0 "Подготовить Бергенсбанен к военному использованию"
 NOR_prepare_bergensbanen_for_military_use_desc:0 "Линия между Осло и Бергеном всегда имела огромную важность для политиков, населения и бизнеса. Несмотря на высокую стоимость строительства через холмы, плато и горы, она окупилась. Армия уже может использовать её в крайнем случае, но дополнительная модернизация оправданна."
 NOR_prepare_dovrebanen_for_military_use:0 "Подготовить Довребанен к военному использованию"
 NOR_prepare_dovrebanen_for_military_use_desc:0 "Довребанен пересекает большую часть Восточной Норвегии и связывает её с важным центром страны, имея множество ответвлений. Дальнейшая модернизация позволит быстрее перемещаться через крупнейшие сельскохозяйственные районы, а связь с Тронхеймом может стать началом соединения Северной Норвегии с остальной страной."
 NOR_prepare_raumabanen_for_military_use:0 "Подготовить Раумабанен к военному использованию"
 NOR_prepare_raumabanen_for_military_use_desc:0 "Хотя на карте Раумабанен выглядит короткой и непримечательной, она проходит через высокогорные и местами альпийские районы Оппланна и Суннмёре, соединяя восток и запад. Быстрое перемещение войск здесь может стать разницей между продолжением борьбы и гибелью или пленом."
 NOR_prepare_soerlandsbanen_for_military_use:0 "Подготовить Сёрланнсбанен к военному использованию"
 NOR_prepare_soerlandsbanen_for_military_use_desc:0 "Сёрланнсбанен связывает морской промышленный Ставангер на западе с Южной Норвегией и далее с административным и финансовым центром Осло. Возможность быстро перебрасывать войска с запада на юг и восток может оказаться крайне важной."
 NOR_nordic_research:0 "Приглашения в Северную исследовательскую группу"
 NOR_invite_country_into_nordic_research:0 "Пригласить государство [From.GetName] в Северную исследовательскую группу"
 NOR_invite_country_into_nordic_research_desc:0 "§YСеверное исследовательское сотрудничество§! можно расширить, пригласив больше стран из нашей сферы в основную группу научного взаимодействия. Это одновременно практичный и солидарный шаг."
 NOR_fund_the_royal_norwegian_society:0 "Финансировать Королевское норвежское общество"
 NOR_fund_the_royal_norwegian_society_desc:0 "Основанное в 1760 году «Det Kongelige Norske Videnskabers Selskab» является старейшим научным учреждением Норвегии. В него избираются лучшие умы страны, а за выдающиеся открытия и достижения вручаются награды.\n\nРасширив общество, предоставив ему новые помещения, наладив сотрудничество с учебными заведениями и пригласив зарубежных учёных, мы сможем обмениваться методами и знаниями и организовывать совместные исследования самых перспективных тем. В долгосрочной перспективе это принесёт знания и престиж, хотя первоначально расширение элитарного учреждения встретит сопротивление."
 NOR_fund_additional_scientific_equipment:0 "Финансировать дополнительное научное оборудование"
 NOR_fund_additional_scientific_equipment_desc:0 "Дополнительное испытательное оборудование позволит членам §YКоролевского норвежского общества§! воспроизводить перспективные исследования и проверять их достоверность. Это сделает сотрудничество ещё эффективнее."
 NOR_invite_foreign_academics_to_the_royal_norwegian_society:0 "Пригласить иностранных учёных в Королевское норвежское общество"
 NOR_invite_foreign_academics_to_the_royal_norwegian_society_desc:0 "Теперь, когда общество расширено и в нём уже работают иностранные учёные, пригласить специалистов новых участников альянса будет несложно, если мы захотим ещё шире делиться знаниями."
 NOR_share_military_tactics_with_iceland:0 "Поделиться военными тактиками с Исландией"
 NOR_share_military_tactics_with_iceland_desc:0 "Поскольку §YИсландия§! входит в наш альянс, разумно поделиться общими военными знаниями в столь серьёзной ситуации, когда вопрос может стоять о жизни и смерти. Географическая близость и общая история делают сотрудничество естественным."
 NOR_share_specialized_tactics_with_iceland:0 "Поделиться специализированными тактиками с Исландией"
 NOR_share_specialized_tactics_with_iceland_desc:0 "Теперь §YИсландия§! фактически является автономной частью нашей страны, а не просто союзником. Мы можем передать ей горные тактики и опыт зимней войны. Интеграция норвежских советников в Исландские силы безопасности повысит их способность защищаться и обеспечит безопасность Северной Атлантики."
 NOR_the_kings_choice:0 "Выбор короля"
 NOR_the_kings_choice_desc:0 "Взволнованный король получил требование врага о капитуляции и назначении коллаборационистского правительства. Он со слезами заявил правительству и парламенту, что отречётся, если они согласятся. Поэтому ответим врагу королевским «Нет» и поддержим борьбу за независимость."
 NOR_expand_the_kings_responsibilities:0 "Расширить обязанности короля"
 NOR_expand_the_kings_responsibilities_desc:0 "Даже символический монарх несёт множество обязанностей. Часть можно передать другим членам королевской семьи или государственным деятелям, освободив время для более важных задач. В нашей монархической стране король может советовать армии или вдохновлять войска и граждан во время войны."
 NOR_rebrand_into_the_modern_kingdom:0 "Перейти к облику современного королевства"
 NOR_rebrand_into_the_modern_kingdom_desc:0 "При желании можно вернуть современный флаг и внешний облик государства. Это потребует больших усилий от государственных деятелей, а проводить ребрендинг часто невозможно."
 NOR_rebrand_into_the_traditional_kingdom:0 "Перейти к облику традиционного королевства"
 NOR_rebrand_into_the_traditional_kingdom_desc:0 "При желании можно принять традиционный флаг и внешний облик старого Норвежского королевства. Внезапная смена потребует значительных административных ресурсов и не может быть быстро отменена, но она возможна."
 NOR_expand_the_duchy_of_icelands_administrative_duties:0 "Расширить административные обязанности герцогства Исландия"
 NOR_expand_the_duchy_of_icelands_administrative_duties_desc:0 "Наше автономное герцогство Исландия уже управляет расширенными владениями. Разумно поручить ему Гренландию — соседний остров, с которым оно исторически знакомо. Это освободит нас для других театров и может улучшить долгосрочное развитие Гренландии."
 NOR_petition_the_british_for_an_alliance:0 "Просить Британию об альянсе"
 NOR_petition_the_british_for_an_alliance_desc:0 "Вооружённый нейтралитет не удержал войну вдали от наших земель. Лучшим выходом может стать союз с врагами нашего противника. Поддержка Британии выглядит наиболее разумной."
 NOR_petition_the_french_for_an_alliance:0 "Просить Францию об альянсе"
 NOR_petition_the_french_for_an_alliance_desc:0 "Вооружённый нейтралитет не удержал войну вдали от наших земель. Лучшим выходом может стать союз с врагами нашего противника. Поддержка Франции выглядит наиболее разумной."
 NOR_petition_the_germans_for_an_alliance:0 "Просить Германию об альянсе"
 NOR_petition_the_germans_for_an_alliance_desc:0 "Вооружённый нейтралитет не удержал войну вдали от наших земель. Лучшим выходом может стать союз с врагами нашего противника. Поддержка Германии выглядит наиболее разумной."
 NOR_petition_the_russians_for_an_alliance:0 "Просить Россию об альянсе"
 NOR_petition_the_russians_for_an_alliance_desc:0 "Вооружённый нейтралитет не удержал войну вдали от наших земель. Лучшим выходом может стать союз с врагами нашего противника. Поддержка России выглядит наиболее разумной."
 NOR_petition_the_americans_for_an_alliance:0 "Просить США об альянсе"
 NOR_petition_the_americans_for_an_alliance_desc:0 "Вооружённый нейтралитет не удержал войну вдали от наших земель. Лучшим выходом может стать союз с врагами нашего противника. Поддержка США выглядит наиболее разумной."
 NOR_initiate_cooperation_with_the_british:0 "Начать сотрудничество с Британией"
 NOR_initiate_cooperation_with_the_british_desc:0 "Оказавшись в британском альянсе, следует теснее сотрудничать в области связи, транспорта и, разумеется, войны."
 NOR_initiate_cooperation_with_the_germans:0 "Начать сотрудничество с Германией"
 NOR_initiate_cooperation_with_the_germans_desc:0 "Оказавшись в германском альянсе, следует теснее сотрудничать в области связи, транспорта и, разумеется, войны."
 NOR_initiate_cooperation_with_the_russians:0 "Начать сотрудничество с Россией"
 NOR_initiate_cooperation_with_the_russians_desc:0 "Оказавшись в российском альянсе, следует теснее сотрудничать в области связи, транспорта и, разумеется, войны."
 develop_petsamo_nickel_deposits:0 "Разработать никелевые месторождения Петсамо"
 NOR_as_norsk_aeroplanfabrik:0 "A/S Norsk Aeroplanfabrik"
 NOR_vestlandske_cementstoberi:0 "Vestlandske Cementstøberi"
 NOR_norges_statsbaner:0 "Norges Statsbaner"
