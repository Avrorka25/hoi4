 NOR_reintegrate_orknoeyane:0 "Реинтегрировать Оркнёяне"
 NOR_fully_incorporate_orknoeyane:0 "Полностью включить Оркнёяне"
 NOR_recreate_the_kingdom_of_the_isles:0 "Воссоздать Королевство Островов"
 NOR_recreate_the_kingdom_of_the_isles_desc:0 "Захватив Гебриды и Шотландское нагорье, мы можем создать зависимое государство по образцу старого Королевства Островов. Под нашей властью оно станет автономным герцогством, продвигающим норвежско-гэльские связи для привлечения населения.\n\nЭто потребует усилий и ресурсов, но косвенное управление через местных лордов, землевладельцев и политиков может окупиться."
 NOR_lords_of_the_isles_propaganda_lanark:0 "Распространить пропаганду лордов Островов в Ланарке"
 NOR_lords_of_the_isles_propaganda_lanark_desc:0 "Продвигая не только норвежско-гэльские, но и связи горцев и прибрежных шотландцев, мы сможем включить жителей Ланарка в наше зависимое государство [LOI.GetNameDef]. Это расширит его мобилизационную базу и значительно укрепит наших сторонников на Британских островах."
 NOR_partisan_operations:0 "Партизанские операции"
 NOR_partisan_operations_desc:0 "Пока враг оккупирует норвежскую территорию, мы можем направлять подготовленных коммандос и партизан для проникновения в занятые районы и саботажа военных усилий противника."
