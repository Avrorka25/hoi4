 NOR_monarchism_on_the_rise:0 "Рост норвежского монархизма"
 NOR_monarchism_on_the_rise_desc:0 "Вокальные политические элементы начали высказываться в пользу наших традиционных ценностей и Королевства Старого, найдя поддержку со стороны все большего числа населения. Путь королевства к безопасным и разумным ценностям просто ждет выбора перехода, будь то мирный или иной."
 NOR_prepare_for_monarchist_civil_war:0 "Подготовиться к гражданской войне"
 NOR_prepare_for_monarchist_civil_war_desc:0 "У нас нет времени ждать медленного изменения взглядов народа государства [Root.GetName]. Ради его же блага нужно действовать быстро, даже если кому-то придётся погибнуть."
 NOR_expand_civil_monarchism_support:0 "Расширить гражданскую поддержку"
 NOR_expand_civil_monarchism_support_desc:0 "Необходимо обеспечить дальнейший рост поддержки среди народа государства [Root.GetName], даже если это дестабилизирует общество."
 NOR_ensure_command_loyalty_for_monarchist_civil_war:0 "Обеспечить лояльность армейского командования"
 NOR_ensure_command_loyalty_for_monarchist_civil_war_desc:0 "Вероятно, многие командиры разделяют традиционалистские ценности и хотят укрепить их в обществе. Следует обратиться к каждому и заручиться их верностью в случае внутреннего конфликта."
 NOR_ensure_command_loyalty_for_monarchist_civil_war_tt:0 "Обеспечивает верность наших §Yармейских§! и §Yфлотских командующих§! в случае §Rгражданской войны§! за §Yмонархизм§!.\n"
 NOR_preliminary_monarchist_armament_industry:0 "Предварительная военная промышленность лоялистов"
 NOR_preliminary_monarchist_armament_industry_desc:0 "Подготовить ограниченные мощности §Yвоенной промышленности§! в лояльных регионах.\n"
 NOR_open_up_political_discourse_monarchism:0 "Открыть политическую дискуссию"
 NOR_open_up_political_discourse_monarchism_desc:0 "Необходимо допустить различные взгляды в правительстве. Возможно, со временем это позволит мирно изменить политический курс страны."
 NOR_discredit_government_monarchism:0 "Дискредитировать правительство"
 NOR_discredit_government_monarchism_desc:0 "Указывая на многочисленные недостатки нынешнего правительства, мы заставим людей задуматься об идеологических причинах его неудач."
 NOR_ignite_the_monarchist_civil_war:0 "Разжечь гражданскую войну"
 NOR_ignite_the_monarchist_civil_war_desc:0 "Пришло время решительного шага. Все необходимые приготовления завершены. Пути назад нет. «For Fedrelandet!»"
 NOR_land_reintegration:0 "Реинтеграция норвежских земель"
 NOR_land_reintegration_desc:0 "Когда-то Норвежское королевство простиралось по Северной Европе, но войны и договоры лишили его исторических земель. Швеция, Дания и в меньшей степени Великобритания владеют бывшими островами, владениями, ландшафтами и приграничными районами. Однако надежда ещё не потеряна.\n\nЕсли мы вновь получим эти территории, современное норвежское государство с крепкой экономикой и опытными деятелями сможет их реинтегрировать и вернуть часть славного прошлого."
 NOR_reintegrate_faeroeyane:0 "Реинтегрировать Фэрёйане"
