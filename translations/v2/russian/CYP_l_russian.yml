l_russian:
 cyprus_tree:0 "Дерево фокусов Кипра"
 CYP_shortcut_industry:0 "Развитие городов / деревни"
 CYP_shortcut_army:0 "Армия"
 CYP_begin_urbanisation_efforts:0 "Начать урбанизацию"
 CYP_begin_urbanisation_efforts_desc:0 "Мы наблюдаем, как все окружающие нас страны обгоняют нас по объёму промышленного производства. Чтобы не остаться позади, мы должны последовать их примеру."
 CYP_continue_farming_reliance:0 "Продолжить опору на сельское хозяйство"
 CYP_continue_farming_reliance_desc:0 "Не меняя наш традиционный уклад, мы сможем использовать накопленный отечественный опыт и создать процветающую экономику."
 CYP_railways:0 "Импортировать железнодорожные технологии"
 CYP_railways_desc:0 "Хотя у нас нет средств самостоятельно создать железнодорожную систему, мы можем импортировать необходимые материалы и построить первую железнодорожную линию на острове."
 CYP_urban_investments:0 "Инвестиции в города"
 CYP_urban_investments_desc:0 "Ускорение урбанизации имеет решающее значение для дальнейшей реализации нашей экономической политики. Поэтому инвестиции являются логичным следующим шагом."
 CYP_coastal_investments:0 "Развивать побережье"
 CYP_coastal_investments_desc:0 "Будучи островом, [183.GetName] нуждается в развитом побережье для связи с остальным миром, а также для перевозок по самому острову."
 CYP_subsidise_fruit_farming:0 "Субсидировать выращивание фруктов"
 CYP_subsidise_fruit_farming_desc:0 "Наш средиземноморский климат идеально подходит для выращивания различных фруктов. Если субсидировать их производство, они смогут стать важной статьёй экспорта."
 CYP_mining_effort:0 "Развитие горнодобычи"
 CYP_mining_effort_desc:0 "Несмотря на нашу ставку на сельское хозяйство, мы всё равно должны оставаться конкурентоспособными в производстве сырья."
 CYP_construct_power_plants:0 "Строить электростанции"
 CYP_construct_power_plants_desc:0 "Чтобы поддержать растущие городские районы и предприятия, необходимо расширить нашу энергосистему."
 CYP_link_the_cities:0 "Соединить города"
 CYP_link_the_cities_desc:0 "Экономика может работать как единое целое лишь при надлежащей взаимосвязи между её частями. Этому должна способствовать надёжная дорожная сеть."
 CYP_national_industries:0 "Национальная промышленность"
 CYP_national_industries_desc:0 "Чтобы контролировать экономику и прекратить неэффективное управление, мы можем создать государственные отрасли промышленности."
 CYP_natural_build_up:0 "Отдать приоритет естественному росту"
 CYP_natural_build_up_desc:0 "Если мы будем слишком сильно вмешиваться в экономику, то рискуем вызвать экономический крах. Чтобы предотвратить подобную катастрофу, необходимо обеспечить более естественный и постепенный рост."
 CYP_water_infrastructure:0 "Развивать водную инфраструктуру"
 CYP_water_infrastructure_desc:0 "Климат острова делает надёжную систему водоснабжения практически обязательной, если мы не хотим, чтобы урожаи засыхали."
 CYP_rural_infrastructure:0 "Развивать сельскую инфраструктуру"
 CYP_rural_infrastructure_desc:0 "До сельских общин зачастую очень трудно добраться. Чтобы исправить это, мы должны построить дороги даже к самым отдалённым деревням."
 CYP_resource_prospecting:0 "Разведка ресурсов"
 CYP_resource_prospecting_desc:0 "Мы ещё не разведали все доступные ресурсы на [183.GetName]. Теперь это будет исправлено."
 CYP_construct_argaka_dam:0 "Построить плотину Аргака"
 CYP_construct_argaka_dam_desc:0 "Мы обследовали подходящее место для строительства крупной плотины. Работы займут немало времени, но результат того стоит."
 CYP_develop_heavy_industry:0 "Развивать тяжёлую промышленность"
 CYP_develop_heavy_industry_desc:0 "Мы не можем построить экономику исключительно на сфере услуг и переработке. Развитие тяжёлой промышленности создаст рабочие места и новый сектор экономики."
 CYP_trade_port:0 "Создать торговый порт"
 CYP_trade_port_desc:0 "Благодаря нашему положению в Средиземном море у нас огромный торговый потенциал. Чтобы воспользоваться им, следует построить торговый порт."
 CYP_utilise_stengths:0 "Использовать наши сильные стороны"
 CYP_utilise_stengths_desc:0 "Продолжая заниматься тем, чем мы занимались тысячелетиями, наша нация сможет достичь настоящего процветания."
 CYP_education_effort:0 "Развивать образование"
 CYP_education_effort_desc:0 "Образование нашего народа всегда должно быть приоритетом. Во времена прежних оккупаций этому уделялось недостаточно внимания, поэтому нам следует начать образовательную кампанию."
 CYP_research_sector:0 "Создать исследовательский сектор"
 CYP_research_sector_desc:0 "У нас есть средства для создания отдельного исследовательского сектора, который способен превратить нашу страну в передовую экономику и современное государство."
 CYP_trade_economy:0 "Торговая экономика"
 CYP_trade_economy_desc:0 "Торговля уже принесла нашей экономике огромную пользу. Следует ещё больше усилить этот эффект, сделав на неё дополнительную ставку."
 CYP_educated_nation:0 "Образованная нация"
 CYP_educated_nation_desc:0 "Наши усилия принесли замечательные результаты, и тот небольшой уровень неграмотности, который ещё сохранялся, теперь почти полностью исчез. Мы успешно превратились в современную и образованную нацию."
 CYP_arms_for_nation_tt:0 "\n§HЭтот национальный дух исчезнет, когда у нас будет два военных завода.§!"
 CYP_professional_army_training_tt:0 "Объединяет §HСпециализацию на морских вторжениях§!, §HКорпус морской пехоты [ROOT.GetAdjectiveCap]§! и §HНаступательный генеральный штаб§! в национальный дух §HПрофессиональная армия§!."
 CYP_found_army:0 "Создать армию"
 CYP_found_army_desc:0 "Мы лишь недавно обрели независимость, поэтому нам необходима армия для защиты этой недавно освобождённой земли."
 CYP_across_sea:0 "Через море"
 CYP_across_sea_desc:0 "Мы окружены морем, а значит, чтобы вести свои войны, нам придётся его пересекать."
 CYP_island_defense:0 "Подготовить оборону острова"
 CYP_island_defense_desc:0 "Когда придёт время, мы должны быть готовы защитить наш драгоценный остров."
 CYP_general_staff_attack:0 "Наступательный генеральный штаб"
 CYP_general_staff_attack_desc:0 "Поскольку большинство наших сражений будет происходить за морем, нам редко придётся обороняться, что позволяет нашим тактикам сосредоточиться на разработке наступательных стратегий."
 CYP_marine_corp:0 "Создать корпус морской пехоты"
 CYP_marine_corp_desc:0 "Морской десант редко является задачей для обычного солдата. Для этого лучше подходят специально обученные экспедиционные силы, специализирующиеся на морских штурмах."
 CYP_war_mobilisation:0 "Мобилизоваться на войну"
 CYP_war_mobilisation_desc:0 "Когда война приходит в [ROOT.GetNameDef], мы должны мобилизовать на борьбу каждого трудоспособного мужчину!"
 CYP_equipment_modernisation:0 "Модернизировать оснащение"
 CYP_equipment_modernisation_desc:0 "Основная часть нашего оснащения осталась со времён британской оккупации. Следует закупить новые винтовки, а также разработать собственное стрелковое оружие."
 CYP_grand_defense_plan:0 "Разработать генеральный план обороны"
 CYP_grand_defense_plan_desc:0 "В случае иностранного вторжения необходимо заранее учесть каждую деталь предстоящей борьбы и подготовить ответ на любую угрозу."
 CYP_trench_warfare:0 "Использовать окопную войну"
 CYP_trench_warfare_desc:0 "Ужасы Великой войны мало что дали миру. Но они показали, что для лучшей обороны необходимо рыть траншеи."
 CYP_professional_army_training:0 "Подготовка профессиональной армии"
 CYP_professional_army_training_desc:0 "Наша неопытная армия должна регулярно проводить учения, если хочет иметь шанс в открытом бою."
 CYP_invasion_plans:0 "Подготовить планы вторжения"
 CYP_invasion_plans_desc:0 "Когда неизбежное вторжение на [183.GetName] начнётся, население острова должно защищать свою землю, пока мы готовим полноценную оборону."
 CYP_prepare_coastal_defenses:0 "Подготовить береговую оборону"
 CYP_prepare_coastal_defenses_desc:0 "Наше побережье необходимо защищать любой ценой. Если оно падёт, на пути вражеских сил почти ничего не останется."
 CYP_arms_for_nation:0 "Оружие для нации"
 CYP_arms_for_nation_desc:0 "Как нация, мы должны вооружиться!"
 CYP_adopt_british_guns:0 "Принять британское оружие"
 CYP_adopt_british_guns_desc:0 "Хотя оставленные британцами многочисленные винтовки являются символом оккупации, мы всё же должны ими воспользоваться."
 CYP_create_armoured_corp:0 "Создать бронетанковый корпус"
 CYP_create_armoured_corp_desc:0 "Современная армия использует различные бронемашины, прежде всего танки, чтобы превосходить противника в манёвренности и огневой мощи."
 CYP_deep_defense:0 "Глубокая оборона"
 CYP_deep_defense_desc:0 "Глубокоэшелонированная оборона — инновационное решение для защиты [183.GetName]."
 CYP_war_lessons:0 "Уроки войны"
 CYP_war_lessons_desc:0 "Лучший учитель — война. Мы можем многому у неё научиться."
 CYP_guerilla_war:0 "Использовать партизанскую войну"
 CYP_guerilla_war_desc:0 "Как победить врага, который повсюду, появляется лишь тогда, когда уже подготовил ловушку, а затем бесследно исчезает? Никак. Именно поэтому такая тактика хорошо подходит для защиты наших земель."
 CYP_support_equipment:0 "Вспомогательное оснащение [ROOT.GetAdjectiveCap]"
 CYP_support_equipment_desc:0 "Сегодня война ведётся не только оружием — она ведётся также радиостанциями, палатками и лопатами."
 CYP_motorisation_drive:0 "Курс на моторизацию"
 CYP_motorisation_drive_desc:0 "Автомобили можно использовать для перевозки войск, снабжения, а иногда даже как боевые машины. Грузовики играют всё более важную роль в современной войне."
 CYP_develop_tank_variants:0 "Разработать варианты танков"
 CYP_develop_tank_variants_desc:0 "Танки столь же универсальны, сколь и эффективны. После сравнительно небольших модификаций их можно использовать против авиации, для поддержки пехоты и даже в качестве инженерных машин."
 CYP_island_fortress:0 "Остров-крепость"
 CYP_island_fortress_desc:0 "При правильном строительстве укреплений [183.GetName] можно превратить в неприступную крепость, способную сдержать даже сильнейшего врага."
 CYP_create_nicosia_arsenal:0 "Создать Никосийский арсенал"
 CYP_create_nicosia_arsenal_desc:0 "Если оружие хранится в столице, оно легко доступно и находится в самом важном месте страны."
 r56_CYP_aftermath_october_events:0 "Последствия Октябрьских событий"
 r56_CYP_aftermath_october_events_desc:0 "В октябре 1931 года остров [183.GetName] потрясло крупное восстание, во главе которого стояла смешанная группа греков-киприотов, требовавших §HЭнозиса§!. Тогдашний губернатор Рональд Сторрс подавил эти выступления, что привело к краткому периоду столкновений между протестующими и местной полицией. В результате погибли несколько мирных жителей, многие были ранены, а участники протеста подверглись уголовным наказаниям. Кроме того, десять человек были отправлены в изгнание.\n\nБританская администрация возложила ответственность за разжигание восстания на Алексиса Киру, генерального консула в Лимасоле, направленного греческим правительством. Он действительно создал подпольную оппозицию британскому правлению, однако правительство Греции отрицало всякую причастность к его деятельности. Поэтому его перевели на другую должность — секретаря греческой делегации в Германии, где использовали его опыт во внешней политике.\n\nПоследствия этого восстания до сих пор ощущаются на острове, поскольку недавно назначенный губернатор [183.GetName], Ричмонд Палмер, установил период автократического правления, также известный как «Палмерократия». Хотя он помог снизить риск голода после двух лет засухи и расширил порт Фамагусты, его правление было суровым и фактически положило конец всем прямым призывам к §HЭнозису§!.\n\n§HЧтобы убрать этот национальный дух, необходимо либо добиться Энозиса, либо сформировать другую национальную идентичность.§!"
 r56_CYP_orthodox_church_idea:0 "Влиятельная православная церковь"
 r56_CYP_orthodox_church_idea_desc:0 "Православная христианская вера является частью истории Кипра с I века н. э., когда [183.GetName] стал одной из первых стран под властью христианского правителя. К концу IV века н. э. религия распространилась ещё шире и на протяжении последующих тысячелетий прочно закрепилась как одна из основ островной жизни.\n\nСегодня она играет важную роль в кипрской идентичности, и большинство жителей обращается к ней за духовным руководством. После оккупации острова Великобританией местное духовенство стало также активно участвовать в кипрской политике. В 1931 году епископ Китиона призвал к гражданскому неповиновению до достижения §HЭнозиса§!, что несколько дней спустя положило начало Октябрьским событиям. Сейчас престол архиепископа [183.GetName] пустует, поскольку почти все епископы острова были высланы как подстрекатели восстания. Будучи единственным оставшимся епископом, [CYP.CYP_leontios.GetName] занимает должность архиепископа в качестве местоблюстителя до избрания нового."
 r56_CYP_ideological_turmoil:0 "Идеологическая смута"
 r56_CYP_ideological_turmoil_desc:0 "Хотя кипрское население почти едино в стремлении к §HЭнозису§!, сплочённым его назвать нельзя. На острове существует множество политических течений, и между ними почти нет согласия. Это привело к идеологической борьбе за будущее острова.\n\nХотя запрещённая КПК годами действует в подполье, а её идеи распространились по всему острову, до большинства ей далеко. Православная церковь обладает огромным влиянием на население, и её поддержка демократического правления также получила наибольшее распространение. Однако долгая и тяжёлая британская оккупация радикализировала многих людей. Это укрепило националистические группы, готовые поставить §HЭнозис§! превыше всего."
 r56_CYP_ethno_religious_conflict:0 "Этнорелигиозный конфликт"
 r56_CYP_ethno_religious_conflict_desc:0 "[183.GetName] издавна является домом для многих народов. Большинство составляют православные греки, однако долгое правление Османской империи и близость Анатолийского полуострова привели к появлению на острове значительного турецкого меньшинства, преимущественно исповедующего ислам. Поскольку турок почти в десять раз меньше, они в основном живут обособленными общинами.\n\nПочти враждебные отношения между Грецией и Турцией, а также события последнего десятилетия сделали гармоничное сосуществование почти невозможным. Решительные призывы греческого населения к §HЭнозису§! воспринимаются турецким меньшинством как катастрофа, тогда как националисты считают остров греческой родиной, а другие народы — чужаками. Это противостояние регулярно приводит к конфликтам между турками и греками, которые редко заканчиваются мирно."
 r56_CYP_urbanisation_campaign:0 "Кампания урбанизации"
 r56_CYP_urbanisation_campaign_desc:0 "Поскольку на острове доминирует сельскохозяйственный сектор, пришло время направить промышленность к более развитому состоянию."
 r56_CYP_hydroelectricity:0 "Гидроэнергетика"
 r56_CYP_hydroelectricity_desc:0 "[ROOT.GetNonIdeologyName] обладает большим потенциалом гидроэнергетики благодаря географии острова."
 r56_CYP_naval_industry:0 "Морская промышленность [ROOT.GetAdjectiveCap]"
 r56_CYP_naval_industry_desc:0 "Поскольку морской путь — единственный способ экспортировать большие объёмы товаров, морская промышленность [ROOT.GetNonIdeologyName] жизненно важна для всей страны."
 r56_CYP_national_industries:0 "Национальная промышленность"
 r56_CYP_national_industries_desc:0 "Несколько важных компаний в [ROOT.GetName] были национализированы или основаны государством."
 r56_CYP_growing_economy:0 "Растущая экономика"
 r56_CYP_growing_economy_desc:0 "По мере дальнейшего развития промышленности [ROOt.GetName] экономика переживает продолжительный период роста."
 r56_CYP_trade_hub:0 "Средиземноморский торговый узел"
 r56_CYP_trade_hub_desc:0 "[183.GetName] стратегически расположен на важном торговом пути в Азию. Мы можем извлечь выгоду из этого потока."
 r56_CYP_farming_focus:0 "Ставка на сельское хозяйство"
 r56_CYP_farming_focus_desc:0 "Поскольку большая часть населения занята в первичном секторе экономики, сельское хозяйство имеет приоритет в [ROOT.GetName]."
 r56_CYP_mine_expansion:0 "Расширение шахт"
 r56_CYP_mine_expansion_desc:0 "[183.GetName] богат ресурсами — остаётся лишь добыть их."
 r56_CYP_dyn_mod_accessible_countryside:0 "Доступная сельская местность"
 r56_CYP_dyn_mod_accessible_countryside_desc:0 "Благодаря масштабным усилиям по соединению отдалённых общин с остальной частью острова передвигаться по [183.GetName] стало проще, чем когда-либо."
 r56_CYP_agrarian_economy:0 "Аграрная экономика"
 r56_CYP_agrarian_economy_desc:0 "Ставка на земледелие и экономическая база [ROOT.GetNonIdeologyName] привели к процветанию аграрного сектора, прокладывающего путь к экономическому подъёму."
 r56_CYP_education_initiative:0 "Образовательная инициатива"
 r56_CYP_education_initiative_desc:0 "Населению необходимо надлежащее образование, чтобы работать с максимальной эффективностью, а высокий уровень образования также является признаком высокого развития. Образовательная инициатива позволит улучшить оба показателя."
 r56_CYP_dyn_mod_national_guard:0 "Национальная гвардия [ROOT.GetAdjectiveCap]"
 r56_CYP_dyn_mod_national_guard_desc:0 "Национальная гвардия — военная структура, созданная для защиты [ROOT.GetNonIdeologyName] и способная специализироваться именно на этой задаче."
 CYP_naval_invasion_specialisation:0 "Специализация на морских вторжениях"
 CYP_naval_invasion_specialisation_desc:0 "Вооружённые силы [ROOT.GetAdjectiveCap] специализируются на заморских вторжениях, что сделало их грозным противником в Восточном Средиземноморье."
 CYP_war_mobilisation_i:0 "Мобилизация"
 CYP_war_mobilisation_i_desc:0 "Война пришла в [ROOT.GetNameDef]. Необходимо провести все возможные приготовления к победе, чтобы наша страна выстояла."
 CYP_marine_corp_i:0 "Корпус морской пехоты [ROOT.GetAdjectiveCap]"
 CYP_marine_corp_i_desc:0 "Морские силы специального назначения [ROOT.GetNameDef] прекрасно подготовлены к десантным операциям и способны с лёгкостью высадиться практически на любом побережье."
 CYP_war_industrialisation:0 "Военная индустриализация"
 CYP_war_industrialisation_desc:0 "Нацию необходимо защищать, а, как всем известно, нацию защищает оружие. Поэтому военная промышленность жизненно важна не только для обороны страны, но и для большей свободы во внешней политике.\n\n§HЭтот национальный дух исчезнет, когда у нас будет два военных завода.§!"
 CYP_equipment_modernisation_i:0 "Модернизация оснащения"
 CYP_equipment_modernisation_i_desc:0 "Ни одну войну нельзя выиграть с устаревшим оснащением!"
 CYP_general_staff_attack_i:0 "Наступательный генеральный штаб"
 CYP_general_staff_attack_i_desc:0 "Хотя некоторые считают, что принцип «лучшая защита — нападение» плохо подходит для обороны страны, генеральный штаб [ROOT.GetAdjectiveCap] принял именно эту парадигму."
 CYP_professional_army:0 "Профессиональная армия"
 CYP_professional_army_desc:0 "Вооружённые силы [ROOT.GetAdjectiveCap] долго и упорно тренировались, чтобы достичь нынешнего уровня дисциплины. Они преуспевают в различных видах боевых действий, прежде всего в морских десантах."
 r56_CYP_dyn_mod_coastal_defense_preparations:0 "Подготовка береговой обороны"
 r56_CYP_dyn_mod_coastal_defense_preparations_desc:0 "Когда наша страна сталкивается с потенциальным вторжением, [ROOT.GetAdjectiveCap] Он будет укреплен, чтобы сделать посадку более благоприятной для обороны."
 CYP_homeland_defense:0 "Оборона родины"
 CYP_homeland_defense_desc:0 "Каждый трудоспособный мужчина должен вносить вклад в защиту нашей любимой страны — если не военной службой, то поддержкой национальной обороны."
 r56_CYP_dyn_mod_island_fortress:0 "Остров-крепость"
 r56_CYP_dyn_mod_island_fortress_desc:0 "Остров [183.GetName] укреплён настолько, что высадить на нём войска почти невозможно, а вести сухопутные бои — ещё труднее."
 r56_CYP_mining_corporation:0 "Горнодобывающая корпорация [183.GetName]"
 r56_CYP_mining_corporation_desc:0 "Эта горнодобывающая компания, основанная американцем Чарльзом Г. Гюнтером в 1914 году, добывает большие объёмы меди и продаёт её по всему миру."
 r56_CYP_aetk:0 "Архис Эсотерикон Тилепикинонион Кипру"
 r56_CYP_aetk_desc:0 "AETK, или Кипрское управление внутренних телекоммуникаций, является первой телекоммуникационной компанией страны. Будучи полугосударственной компанией, оно отвечает за связь Кипра с остальным миром."
