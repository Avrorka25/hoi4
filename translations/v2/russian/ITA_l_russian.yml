l_russian:
 balbo_dead:0 "Итало Бальбо мёртв."
 ITA_dino_alfieri:0 "Дино Альфьери"
 ITA_pietro_koch:0 "Пьетро Кох"
 ITA_manlio_morgagni:0 "Манлио Морганьи"
 ITA_pietro_gazzera:0 "Пьетро Гадзера"
 ITA_umberto_zanotti_bianco:0 "Умберто Дзанотти Бьянко"
 r56_ITA_vanquish_ethiopia_failed:0 "Италия капитулирует перед Эфиопией и заключает белый мир."
 soldier_king:0 "Король-солдат"
 ITA_royal_intervention_tt:0 "Монархические сторонники и военнослужащие, верные королю, начнут §Yгражданскую войну§! против фашистов!"
 aoi_founded_tt:0 "§Y[AOI.GETNAME]§! будет §Yосвобождена§! как §Yсубъект§! в Эфиопии"
 r56_aoi_founded_warning_tt:0 "Владение §Y[AOI.GETNAME]§! эфиопскими регионами будет §Rоспариваться§! из-за нашей §Rвойны§! с §Y[ETH.GETNAMEDEF]§!."
 ITA_foreign_policy_fascism:0 "Фашистская внешняя политика"
 ITA_foreign_policy_fascism_desc:0 "Более активная внешняя политика позволит лучше защищать наши интересы и гарантировать сохранение и расширение нашего влияния."
 ITA_renew_the_italo_yemeni_treaty:0 "Возобновить итало-йеменский договор"
 ITA_renew_the_italo_yemeni_treaty_desc:0 "Итало-йеменский договор, также известный как договор в Сане, был заключён в 1926 году. Он признавал имама Яхью Мухаммада Хамида эд-Дина королём Йемена, закреплял дружбу между нашими странами и признавал притязания Йемена на Аден. После аннексии Эфиопии и расширения нашего влияния в Красном море следует возобновить этот договор."
 ITA_renew_the_italo_yemeni_treaty_diplomacy:0 "Возобновлён итало-йеменский договор"
 ITA_renew_the_italo_yemeni_treaty_tt:0 "Откроет §Yрешения§!, позволяющие вовлечь Йемен в нашу §Yсферу влияния§!"
 ITA_seize_the_balearic_islands:0 "Захватить Балеарские острова"
 ITA_seize_the_balearic_islands_desc:0 "Гражданская война в Испании даёт нам прекрасную возможность захватить Балеарские острова и усилить контроль над западной частью Средиземного моря. Однако столь грубый захват территории не останется незамеченным, а победившее в Испании правительство вряд ли оценит то, что мы воспользовались его слабостью."
 ITA_seize_the_balearic_islands_tt:0 "§RВы больше не сможете заключить союз с Испанией§!\n"
 seized_the_baleares_flag:0 "Балеарские острова захвачены"
 ITA_temporarly_occupy_the_baleares:0 "Временно оккупировать Балеарские острова"
 ITA_temporarly_occupy_the_baleares_desc:0 "Балеарские острова слишком важны стратегически, чтобы оставлять их в руках потенциально коммунистического режима. Мы отправим войска для их оккупации, пообещав националистам вернуть острова после окончания гражданской войны. Разумеется, если националистов к тому времени уже не останется, возвращать их будет некому."
 ITA_temporarly_occupy_the_baleares_tt:0 "Вы обещаете вернуть острова §Gнационалистам§! §Iпосле окончания гражданской войны§!. Если победят §Yреспубликанцы§!, острова можно будет оставить себе, но отказ вернуть их §Gнационалистам§! приведёт к §Rсерьёзным штрафам§!"
 ITA_cede_884_to_HUN:0 "Передать Прекмурье [HUN.GetNameDef]"
 r56_italy.1.t:0 "Король отстраняет Муссолини от власти"
 r56_italy.1.d:0 "После экстренного совещания, созванного королём Виктором Эммануилом III, монарх встретился с Муссолини и потребовал его отставки. Особое внимание он обратил на огромный долг, в котором оказалась [ITA.GetNameDef] и который Муссолини не смог решить почти за пятнадцать лет власти, на экономическую пропасть, вызванную Эфиопской кампанией, и на проблемы из-за последовавших после вторжения эмбарго.\n\nПод давлением Большого фашистского совета, начавшего отворачиваться от него, особенно под влиянием монархистов, стремившихся занять более заметное место, Муссолини не оставалось ничего, кроме как подчиниться, если он не хотел оказаться в тюрьме. Премьер-министром был назначен Пьетро Бадольо. Несмотря на многочисленные связи с фашистской администрацией, Бадольо считается гораздо более умеренной фигурой.\n\nКороль пытается спасти лицо [ITA.GetNameDef], чьё положение продолжает разваливаться."
 r56_italy.1.a:0 "Будем надеяться, что ситуацию ещё можно исправить."
 r56_italy.2.t:0 "Перемирие с Эфиопией"
 r56_italy.2.d:0 "Одной из первых целей Бадольо стало прекращение дорогостоящих конфликтов в Эфиопии. Новый министр иностранных дел Альфредо Ковелли был направлен для переговоров об окончании боевых действий между нашими странами и сумел добиться мира, но нам пришлось выплатить некоторые репарации за многочисленные разрушения гражданской инфраструктуры во время войны."
 r56_italy.2.a:0 "Лучше несколько выплат сейчас, чем вечная экономическая пропасть."
 r56_italy.3.t:0 "Новый кабинет"
 r56_italy.3.d:0 "Через несколько дней после назначения премьер-министром Пьетро Бадольо сформировал новое правительство. Хотя он всё ещё заявляет, что действует от имени Национальной фашистской партии, влияние фашистов в министерствах сократилось, а в кабинет вошло множество монархистов — вероятно, по инициативе короля, обеспокоенного новыми проблемами, к которым может привести сохранение фашистской экономической и социальной политики."
 r56_italy.3.a:0 "Старое — вон, новое — вперёд!"
 r56_italy.4.t:0 "Предложение Джованни Мессе"
 r56_italy.4.d:0 "Сегодня генерал-майор Джованни Мессе, бывший командир Третьей кавалерийской дивизии и министр внутренних дел в правительстве Пьетро Бадольо, обратился к последнему с весьма конкретным предложением. Мессе было ясно, что конечной целью Бадольо является устранение фашистов от власти.\n\nОн предложил использовать потенциальных монархистов в рядах чернорубашечников и других организациях, близких к руководству Национальной фашистской партии, чтобы устранить ведущих партийных деятелей изнутри. Лишив движение руководства, можно будет уничтожить последние его элементы без излишнего кровопролития."
 r56_italy.4.a:0 "Уничтожив жизненно важные узлы, мы обрушим всё движение."
 r56_italy.4.b:0 "А если всё обернётся против нас? Не следует прибегать к столь опасным методам!"
 r56_italy.5.t:0 "Смерть Артуро Боккини"
 r56_italy.5.d:0 "Артуро Боккини, руководитель полиции и особенно Организации по надзору и подавлению антифашизма — тайной полиции Национальной фашистской партии, — был найден мёртвым в своём доме с двумя пулевыми ранениями в голову.\n\nБоккини выбрали первой целью из опасения, что ОВРА раскроет правительственный заговор. Теперь должность вакантна, и риск разоблачения со стороны ОВРА значительно снизился."
 r56_italy.5.a:0 "Превосходно."
 r56_italy.6.t:0 "Фашисты обвиняют коммунистов в убийстве"
 r56_italy.6.d:0 "Убийство Артуро Боккини потрясло многих руководителей Национальной фашистской партии. В официальной партийной газете «Il Popolo d'Italia» крупными буквами появилась фраза «Возрождение коммунистической угрозы», возлагающая вину на возможных членов Итальянской коммунистической партии.\n\nЛуиджи Руссо, руководитель чернорубашечников, призвал усилить бдительность против любых элементов, признанных «антифашистскими»."
 r56_italy.6.a:0 "По крайней мере, нас не подозревают."
 r56_italy.7.t:0 "Убийство братьев Росселли"
 r56_italy.7.d:0 "Карло Росселли и Сабатино Росселли, два антифашистских активиста в изгнании, участвовавшие в гражданской войне в Испании на стороне республиканцев, были убиты французской организацией «Кагуль», когда находились в Баньоль-де-л'Орне в Нормандии на лечении флебита, полученного во время боёв в Испании.\n\nСовместно с другими эмигрантами — противниками Муссолини, особенно республиканцами, — они основали движение «Справедливость и свобода», чьи идеи варьировались от либерализма до социализма."
 r56_italy.7.a:0 "Двумя проблемами меньше."
 r56_italy.8.t:0 "Дипломатический инцидент в Лиге Наций"
 r56_italy.8.d:0 "Во время выступления императора Эфиопии Хайле Селассие I в Лиге Наций, где он осудил итальянское вторжение и попросил дипломатической помощи для прекращения конфликта, присутствующие итальянские журналисты начали насмехаться над императором.\n\nВ ответ на то, что он счёл «глупостью», присутствовавший румынский дипломат Николае Титулеску потребовал удалить журналистов, заявив: «Дикарей — за дверь!»"
 r56_italy.8.a:0 "Кем он себя возомнил?"
 ITA_diplomatic_incident_at_the_league_of_nations:0 "Дипломатический инцидент в Лиге Наций"
 r56_italy.9.t:0 "Милитаризация Римских протоколов"
 r56_italy.9.d:0 "Римские протоколы, впервые подписанные в 1934 году правительствами Австрии, Венгрии и Италии, были соглашениями, главным образом посвящёнными экономическому сотрудничеству трёх стран и направленными против территориальной целостности Югославии. Под руководством [FROM.GetNameDef] была подписана вторая версия протоколов, включавшая военный союз между тремя странами.\n\nМногие считают это попыткой [ITA.GetNameDef] найти себе место в Европе после выхода из Лиги Наций и помешать [GER.GetNameDef] включить [AUS.GetNameDef] в свой состав."
 r56_italy.9.a:0 "Возможно, это обеспечит стабильность Центральной Европы."
 r56_italy.10.t:0 "Второй фронт Стрезы"
 r56_italy.10.d:0 "Столкнувшись с тем, что они назвали «растущей [GER.GetAdjective] угрозой», правительства [ITA.GetAdjective], [FRA.GetAdjective] и [ENG.GetAdjective] сторон вновь встретились в городе Стреза и объявили о восстановлении одноимённого фронта, распавшегося после итальянского вторжения в Абиссинию. В обмен [FRA.GetAdjective] и [ENG.GetAdjective] правительства согласились снять эмбарго с [ITA.GetNameDef].\n\nИх целью является сохранение территориальной целостности [AUS.GetNameDef] перед лицом [GER.GetNameDef] и обеспечение соблюдения последней Версальского договора."
 r56_italy.10.a:0 "Радикально разные правительства объединяются ради сохранения прежней победы."
 r56_italy.11.t:0 "Стальной пакт"
 r56_italy.11.d:0 "Эмбарго, введённые против [ITA.GetNameDef] после вторжения в Абиссинию, подтолкнули её к сближению со странами, отличными от традиционных союзников, прежде всего с [GER.GetNameDef]. Отношения потеплели после того, как Италия отказалась от гарантий Австрии, которую Германия в итоге намеревалась аннексировать, несмотря на нарушение Версальского договора.\n\nПодписав Пакт дружбы и союза между [GER.GetNameDef] и [ITA.GetnameDef], страны обязались оказывать друг другу военную поддержку в ближайшие годы."
 r56_italy.11.a:0 "Что это будет означать для Европы?"
 r56_italy.12.t:0 "[ITA.GetNameDefCap] хочет восстановить фронт Стрезы"
 r56_italy.12.d:0 "Опасаясь, что [GER.GetNameDef] попытается нарушить Версальский договор, прежде всего из-за реваншистской риторики, [ITA.GetNameDef] призвала нас восстановить фронт Стрезы и гарантировать, что неспровоцированная агрессия, подобная произошедшей в Абиссинии, больше не повторится.\n\nМы обязуемся гарантировать территориальную целостность [AUS.GetNameDef] и соблюдение условий Версальского договора, что при необходимости может привести к военному ответу."
 r56_italy.12.a:0 "Версальский договор необходимо защищать любой ценой!"
 r56_italy.12.b:0 "Мы больше не можем доверять [ITA.GetNameDef]."
 r56_italy.13.t:0 "[ITA.GetNameDefCap] хочет восстановить фронт Стрезы"
 r56_italy.13.d:0 "Опасаясь, что [GER.GetNameDef] попытается нарушить Версальский договор, прежде всего из-за реваншистской риторики, [ITA.GetNameDef] призвала нас восстановить фронт Стрезы и гарантировать, что неспровоцированная агрессия, подобная произошедшей в Абиссинии, больше не повторится.\n\nМы обязуемся гарантировать территориальную целостность [AUS.GetNameDef] и соблюдение условий Версальского договора, что при необходимости может привести к военному ответу."
 r56_italy.13.a:0 "Было бы разумно согласиться."
 r56_italy.13.b:0 "[ITA.GetNameDefCap] уже однажды перешла черту. Что гарантирует, что это не повторится?"
 r56_italy.14.t:0 "Восстановление фронта Стрезы"
 r56_italy.14.d:0 "[FRA.GetNameDefCap] и [ENG.GetNameDef] согласились восстановить наш общий фронт против [GER.GetNameDef].\n\nБудем надеяться, что это позволит защитить всё, за что мы сражались в Великой войне, и гарантировать мир в Европе."
 r56_italy.14.a:0 "Антанта возрождена!"
 r56_italy.15.t:0 "[FROM.GetNameDefCap] хочет милитаризировать Римские протоколы"
 r56_italy.15.d:0 "Ссылаясь прежде всего на растущий реваншизм в [GER.GetNameDef], который может угрожать интересам [AUS.GetNameDef], [HUN.GetNameDef] и [ITA.GetNameDef], [FROM.GetLeader] предложил расширить Римские протоколы, включив в них оборонительный и наступательный военный союз.\n\nПо их мнению, создание нового блока в Центральной и Южной Европе позволит сдержать агрессивные державы."
 r56_italy.15.a:0 "Было бы разумно согласиться."
 r56_italy.15.b:0 "Это может привести к ещё более крупной войне. Мы откажемся!"
 r56_italy.16.t:0 "[ITA.GetAdjective] ультиматум"
 r56_italy.16.d:0 "[ITA.GetAdjective] посол объявил Румынию стратегически важным регионом для Римского пакта, особенно для [ITA.GetNameDef] и [HUN.GetNameDef], и предъявил ультиматум [ROM.GetAdjective] правительству.\nОни требуют передать всю Трансильванию [HUN.GetNameDef], гарантировать [ITA.GetAdjective] интересы на нефтяных месторождениях и предоставить [ITA.GetAdjective] правительству право контроля над решениями кабинета, включая право вето для посла.\n\n[ITA.GetNameDefCap] ясно дала понять, что отказ может привести к военным действиям."
 r56_italy.16.a:0 "У нас нет выбора, кроме как согласиться."
 r56_italy.16.b:0 "Мы не отдадим независимость так легко!"
 r56_italy.17.t:0 "[ROM.GetNameDefCap] отвергает ультиматум!"
 r56_italy.17.d:0 "Назвав [ITA.GetAdjective] требования «абсурдными», [ROM.GetAdjective] правительство отвергло направленный несколько дней назад ультиматум и отказалось от любых новых переговоров. В случае отказа мы угрожали военными мерами.\n\nТеперь необходимо решить, исполнить ли угрозы или отложить их."
 r56_italy.17.a:0 "Они сами выбрали свою судьбу."
 r56_italy.17.b:0 "Сейчас мы не можем позволить себе войну."
 r56_italy.18.t:0 "[ITA.GetNameDefCap] предлагает более тесное военное сотрудничество"
 r56_italy.18.d:0 "В последние месяцы наши отношения с [ITA.GetNameDef] потеплели, поскольку её дипломатически и экономически оставили прежние союзники, прежде всего бывшие державы Антанты.\n[ITA.GetAdjective] посол предложил заключить военный союз между нашими странами, предназначенный в первую очередь для взаимопомощи в гипотетической войне с [ENG.GetNameDef], [FRA.GetNameDef] или [SOV.GetNameDef].\n\nСближение с [ITA.GetNameDef] несомненно позволит обезопасить южные Альпы, а также даст некоторый контроль над Средиземноморьем и Африкой — регионами, которые мы больше не можем контролировать.\n\nОднако не стоит забывать о первом предательстве в начале Великой войны и о многочисленных конфликтах из-за пересекающихся сфер влияния."
 r56_italy.18.a:0 "Ось Рим—Берлин никогда не будет побеждена!"
 r56_italy.18.b:0 "К чему это приведёт, кроме нового удара в спину?"
 r56_italy.19.t:0 "[GER.GetNameDefCap] принимает пакт"
 r56_italy.19.d:0 "[GER.GetAdjective] правительство положительно ответило на наше предложение о военном союзе, официально закрепив дружбу и сотрудничество между странами и доказав, что нам не нужно подчиняться требованиям демократий Антанты."
 r56_italy.19.a:0 "Рождается новая Ось!"
 r56_italy.20.t:0 "[GER.GetNameDefCap] отвергает пакт!"
 r56_italy.20.d:0 "Заявив, что сотрудничество между нашими странами не принесёт [GER.GetNameDef] выгоды, они отклонили предложение о военном союзе."
 r56_italy.20.a:0 "Нас снова бросили!"
 r56_italy.21.t:0 "[FROM.GetNameDefCap] требует контроля над внутренней политикой"
 r56_italy.21.d:0 "[FROM.GetAdjective] посол передал нам требование непосредственно из [FROM.GetCapitalVictoryPointName]. [FROM.GetAdjective] правительство требует права контроля и вето над нашей внутренней и внешней политикой, заявляя, что хочет защищать «интересы [FROM.GetAdjective] нации в [ROOT.GetName]».\n\nДипломат уточнил, что отказ может повлечь суровые экономические санкции или даже военные действия в случае того, что они сочтут «серьёзным посягательством на многочисленные [FROM.GetAdjective] усилия, предпринятые в [ROOT.GetName]».\n\nПринятие этих требований означало бы значительную потерю [ROOT.GetAdjective] независимости."
 r56_italy.21.a:0 "Мы не боимся никакой армии. Пусть приходят!"
 r56_italy.21.b:0 "У нас нет выбора, кроме как согласиться."
 r56_italy.22.t:0 "[FROM.GetNameDefCap] отвергает ультиматум"
 r56_italy.22.d:0 "Назвав наши требования «настоящим оскорблением [FROM.GetAdjective] нации и её народа», [FROM.GetAdjective] правительство отказалось предоставить нам более строгий контроль над своей политикой. Как нам ответить?"
 r56_italy.22.a:0 "Они знали о последствиях. Вторгнуться!"
 r56_italy.22.b:0 "У нас нет времени на войну с [FROM.GetNameDef]."
 r56_italy.23.t:0 "[ITA.GetNameDefCap] требует Далмацию"
 r56_italy.23.d:0 "Ссылаясь на историческое присутствие [ITA.GetAdjective] населения в Далмации, [ITA.GetAdjective] правительство потребовало передать всю провинцию Далмация [ITA.GetNameDef] и вывести [Root.GetAdjective] войска в течение 72 часов после передачи территории. В случае отказа оно пригрозило военными мерами."
 r56_italy.23.a:0 "Если это предотвратит войну, пусть будет так."
 r56_italy.23.b:0 "Далмация по праву принадлежит нам!"
 r56_italy.24.t:0 "[103.Owner.GetNameDefCap] отказывается покинуть Далмацию!"
 r56_italy.24.d:0 "[103.Owner.GetAdjective] правительство заявило, что не «преклонит колено перед правительством, не желающим уважать жителей Далмации». В регионе и вдоль границы с нами заметно усиливается военное присутствие. Что нам делать?"
 r56_italy.24.a:0 "Им следовало отдать её мирно. Мы воссоединимся силой!"
 r56_italy.24.b:0 "Мы вернёмся к этому позже!"
 r56_italy.25.t:0 "Гарантии фронта Стрезы для [AUS.GetNameDef]"
 r56_italy.25.d:0 "Назвав это «приоритетом фронта Стрезы», [ITA.GetAdjective] правительство предложило подписать официальную декларацию о защите [AUS.GetNameDef], позволяющую ей рассчитывать на нашу помощь в случае конфликта, особенно с [GER.GetNameDef]."
 r56_italy.25.a:0 "[AUS.GetNameDefCap] находится под нашей защитой."
 r56_italy.25.b:0 "У нас нет интереса защищать [AUS.GetNameDef]."
 r56_italy.26.t:0 "[ITA.GetNameDefCap] захватывает Балеарские острова"
 r56_italy.26.d:0 "Заявив о намерении «защитить [ITA.GetAdjective] интересы в Средиземном море и прежде всего сами острова», [ITA.GetAdjective] правительство решило захватить Балеарские острова и направило туда несколько гарнизонов."
 r56_italy.26.a:0 "Мы этого не разрешали!"
 r56_italy.27.t:0 "[ITA.GetNameDefCap] оккупирует Балеарские острова от нашего имени"
 r56_italy.27.d:0 "[ITA.GetAdjective] правительство решило направить гарнизон на Балеарские острова, чтобы не допустить их перехода под контроль республиканцев. Оно заявило, что лишь защищает наши интересы и не позволяет республиканцам установить господство в Средиземном море."
 r56_italy.27.a:0 "Будем надеяться, что они вернут острова."
 r56_italy.28.t:0 "Фронт Стрезы отклонён"
 r56_italy.28.d:0 "Правительство [From.GetNameDefCap] решило отклонить наше предложение о восстановлении фронта Стрезы. Нам придётся продолжить без их помощи."
 r56_italy.28.a:0 "Наш путь продолжится без них."
 r56_italy.29.t:0 "Вопрос бюджета Королевских ВМС"
 r56_italy.29.d:0 "После окончания Великой войны итальянское правительство поставило цель добиться господства в Средиземном море и ради этого начало крупные проекты модернизации флота. Однако они требуют значительных расходов. Часть бюджета, обычно предназначавшегося армии, была передана Королевским ВМС, что вызвало дисбаланс в производстве снаряжения.\n\nМожно скорректировать бюджет и вновь распределить его поровну между тремя видами вооружённых сил. Но, возможно, ключ к победе лежит в господстве на море?"
 r56_italy.29.a:0 "Вернуться к сбалансированному бюджету!"
 r56_italy.29.b:0 "Бюджет и так приемлем."
 r56_italy.29.c:0 "Увеличить финансирование Королевских ВМС!"
 r56_italy.30.t:0 "Событие, определяющее судьбу Итало Бальбо"
 r56_italy.30.d:0 "Вы не должны видеть это событие. Если оно появилось, сообщите об ошибке!"
 r56_italy.30.a:0 "Хорошо. Сообщу!"
 r56_italy.31.t:0 "Итало Бальбо погиб в результате несчастного случая"
 r56_italy.31.d:0 "Итало Бальбо находился на борту самолёта Savoia-Marchetti SM.79, заходившего на посадку в Тобруке, Ливия. Самолёт приняли за вражеский истребитель и сбили зенитные батареи, защищавшие аэродром.\n\nГерой итальянской авиации, один из главных организаторов Национальной фашистской партии и Марша на Рим, он также был одним из крупнейших популяризаторов авиации в Италии."
 r56_italy.31.a:0 "Сегодня мы потеряли не просто лётчика, а легенду."
 r56_italy.32.t:0 "[GRE.GetNameDefCap] защищает Албанию"
 r56_italy.32.d:0 "[GRE.GetNameDefCap] оккупировала Албанию — наш будущий плацдарм на Балканах. Как нам ответить?"
 r56_italy.32.a:0 "Начать войну раньше!"
 r56_italy.32.b:0 "Пока не наносить удар."
 r56_italy.100.t:0 "Официальное оформление фронта Стрезы"
 r56_italy.100.d:0 "Дипломаты [ITA.GetNameDef], [FRA.GetNameDef] и [ENG.GetNameDef] вновь собрались в Стрезе, [SWI.GetNameDef], для заключительного раунда переговоров о фронте Стрезы против [GER.GetNameDef]. На обсуждении находится предложение превратить фронт в официальный военный союз против германской агрессии и влияния в Европе. Хотя отношения между демократическими державами и фашистским правительством Италии в последние годы были напряжёнными, последние переговоры прошли успешно. [FRA.GetNameDef], похоже, готова присоединиться, но существуют опасения, что этот блок ограничит дипломатическую самостоятельность [ENG.GetNameDef]."
 r56_italy.100.a:0 "Вместе мы выступим против [GER.GetNameDef]."
 r56_italy.100.b:0 "Нас устраивает нынешнее соглашение."
 r56_italy.101.t:0 "Союзники вступают во фронт Стрезы"
 r56_italy.101.d:0 "[ENG.GetNameDefCap] и [ENG.GetAdjective] Содружество согласились официально оформить фронт Стрезы."
 r56_italy.101.a:0 "Превосходно."
 r56_italy.102.t:0 "Союзники отказываются вступить во фронт Стрезы"
 r56_italy.102.d:0 "[ENG.GetNameDefCap] и [ENG.GetAdjective] Содружество отклонили наше предложение официально оформить фронт Стрезы."
 r56_italy.102.a:0 "Прискорбно."
 r56_italy.103.t:0 "Официальное оформление фронта Стрезы"
 r56_italy.103.d:0 "Дипломаты [ITA.GetNameDef], [FRA.GetNameDef] и [ENG.GetNameDef] вновь собрались в Стрезе, [SWI.GetNameDef], для заключительного раунда переговоров о фронте Стрезы, призванном противостоять растущей [GER.GetAdjective] агрессии и влиянию в Европе. Хотя отношения между демократическими державами и фашистским правительством Италии в последние годы были напряжёнными, недавние переговоры завершились совместной декларацией об официальном военном союзе всех участников фронта Стрезы."
 r56_italy.103.a:0 "Вместе к победе!"
 r56_italy.103.b:0 "Они сбились вместе, как овцы перед волком."
 r56_italy.103.c:0 "Будем надеяться, что они смогут действовать сообща во благо."
 r56_italy.107.t:0 "Виктор Эммануил III принимает власть"
 r56_italy.107.d:0 "После полного восстановления Италии король Виктор Эммануил временно принял власть. Он пообещал, что через год правительство проведёт референдум о судьбе монархии."
 r56_italy.107.a:0 "Интересное развитие событий."
 ITA_referendum_year_tt:0 "Через год состоится §Yреферендум о монархии§!. Если большинство проголосует против неё, будут проведены новые выборы."
 r56_italy.107.b:0 "Да здравствует Виктор Эммануил III!"
 r56_italy.108.t:0 "Референдум о монархии"
 r56_italy.108.desc:0 "Последние годы были крайне тяжёлыми для [ITA.GetNameDef], но теперь, когда власть вновь сосредоточена, а стабильность восстановлена, можно обратиться к главному вопросу — итальянской монархии.\n\nМонархия руководила страной и служила объединяющей силой полуострова, однако в последние годы подверглась резкой критике за открытую поддержку Национальной фашистской партии Муссолини. Одни требуют упразднить её и создать полностью независимую Итальянскую республику. Другие хотят, чтобы Виктор Эммануил сохранил престол и продолжал объединять новую Италию. Некоторые предлагают компромисс: его отречение в пользу сына Умберто II.\n\nОкончательное решение будет принято на свободном всенародном референдуме, от которого зависит судьба многолетней итальянской монархии."
 r56_italy.108.d2:0 "Сегодня наступил исторический день: итальянцы проголосовали за упразднение монархии. Судьба короля Умберто и его семьи остаётся неизвестной."
 r56_italy.108.a:0 "Несмотря на ошибки, Виктор Эммануил III — единственный король Италии."
 r56_italy.108.b:0 "Заставить Виктора Эммануила отречься в пользу сына Умберто II."
 r56_italy.108.c:0 "Монархия поставила Италию на колени. Она должна исчезнуть."
 r56_italy.108.d:0 "Умберто II станет более достойным королём."
 r56_italy.109.t:0 "Виктор Эммануил отрекается"
 r56_italy.109.d:0 "После сокращения полномочий под давлением Союзников и из-за скандальной поддержки Муссолини король Эммануил решил отречься. Монархия, которую теперь представляет его более популярный сын Умберто II, получила больше шансов победить на предстоящем референдуме."
 r56_italy.109.a:0 "Хорошо."
 ITA_lack_of_powered_planes:0 "Нехватка мощных двигателей"
 ITA_lack_of_powered_planes_desc:0 "Одна из главных слабостей [ITA.GetADjective] ВВС — недостаточная мощность двигателей производимых самолётов, сводящая на нет достоинства остального оборудования.\nДля решения проблемы требуется серьёзная модернизация производства авиационных двигателей. Недостаточная скорость самолётов может стать губительной в эпоху, когда авиация с каждым годом становится всё быстрее."
 ITA_bloated_military_bureaucracy:0 "Раздутая военная бюрократия"
 ITA_bloated_military_bureaucracy_desc:0 "Чрезмерная склонность армии предпочитать внешний блеск эффективности серьёзно затрудняет модернизацию.\nЛюбые технические или организационные новшества, способные поставить под сомнение престиж высшего командования, отвергаются, и армия вынуждена применять тактику времён Великой войны."
 ITA_bloated_military_bureaucracy_end_corruption:0 "Раздутая военная бюрократия"
 ITA_fresh_doctrines:0 "Новые доктрины"
 ITA_the_backbone_of_the_party_2:0 "Опора партии"
 ITA_stresa_front_idea:0 "Фронт Стрезы"
 ITA_excessive_regia_marina_budget:0 "Чрезмерный бюджет Королевских ВМС"
 ITA_excessive_regia_marina_budget_desc:0 "Из трёх видов вооружённых сил Королевские ВМС получают наибольшую долю бюджета, что упрощает их модернизацию за счёт остальных."
 ITA_excessive_regia_marina_budget_2:0 "Чрезмерный бюджет Королевских ВМС"
 ITA_excessive_regia_marina_budget_2_desc:0 "Из трёх видов вооружённых сил Королевские ВМС получают наибольшую долю бюджета, что упрощает их модернизацию за счёт остальных."
 ITA_scientific_cooperation_with_germany:0 "Научное сотрудничество с [GER.GetNameDef]"
 ITA_invite_andorra:0 "Пригласить [ADR.GetNameDef]"
 ITA_invite_andorra_desc:0 "Мы расширим Иберийский союз, пригласив [ADR.GetNameDef] в наш альянс."
 ITA_giannini_sarnow_protocols_ger:0 "Протоколы Джаннини—Сарнова"
 ITA_army_of_east_africa:0 "Армия Итальянской Восточной Африки"
 ITA_governor_commissariats:0 "Губернаторские комиссариаты"
 ITA_collaborators_in_the_hills:0 "Коллаборационисты в горах"
 ITA_collaborators_in_the_hills_desc:0 "Хотя многие желают бороться против оккупации, многочисленные этнические меньшинства в [AOI.GETNAME] не хотят возвращения старого режима. Подчинение [ITA.GETNAME] может быть не их первым выбором, но оно предпочтительнее возвращения под власть [ETH.GETNAMEDEF]."
 soldier_king_2:0 "Король-солдат"
 umberto:0 "Умберто II"
 ITA_our_own_sphere:0 "Собственная сфера влияния"
 ITA_our_own_sphere_desc:0 ""
 ITA_territorial_deal_with_yugoslavia:0 "Территориальная сделка с [YUG.GetNameDef]"
 ITA_territorial_deal_with_yugoslavia_desc:0 ""
 ITA_approach_hungary:0 "Сблизиться с [HUN.GetNameDef]"
 ITA_approach_hungary_desc:0 "У [HUN.GetNameDefCap] есть общий с нами интерес — раздел [YUG.GetNameDef]. Её вступление в наш союз также позволит втянуть [ROM.GetNameDef] в нашу сферу влияния."
 ITA_our_latin_brothers:0 "Наши латинские братья"
 ITA_our_latin_brothers_desc:0 "У нас много общих культурных корней с [ROM.GetNameDef], а её значительные запасы нефти делают страну слишком ценным потенциальным союзником, чтобы её игнорировать. Союз с ней может принести нам лишь пользу."
 ITA_garantee_austria:0 "Гарантировать независимость Австрии"
 ITA_guarantee_austria:0 "Гарантировать независимость [AUS.GetNameDef]"
 ITA_guarantee_austria_desc:0 ""
 ITA_align_bulgaria:0 "Сблизиться с [BUL.GetNameDef]"
 ITA_align_bulgaria_desc:0 ""
 ITA_claims_on_france2:0 "Претензии к Франции"
 ITA_claims_on_france2_desc:0 "Закрепив господство на востоке, мы можем вернуть все законные итальянские земли, которые французы всегда отказывались нам передать: Корсику, Савойю и Тунис."
 ITA_expand_aviation_research_facilities:0 "Расширить авиационные исследовательские центры"
 ITA_expand_aviation_research_facilities_desc:0 ""
 ITA_expand_aviation_research:0 "Расширить авиационные исследования"
 ITA_expand_aviation_research_desc:0 ""
 ITA_reclaim_antalya:0 "Вернуть Анталью"
 ITA_reclaim_antalya_desc:0 ""
 ITA_ally_spain:0 "Заключить союз с Испанией"
 ITA_ally_spain_desc:0 ""
 ITA_intervene_in_spain:0 "Вмешаться в Испанию"
 ITA_intervene_in_spain_desc:0 "Поражение националистов в Испании и приход к власти режима коммунистической ориентации угрожают безопасности всей Европы. Если он не рухнет изнутри, мы сокрушим его снаружи."
 ITA_approach_portugal:0 "Сблизиться с Португалией"
 ITA_approach_portugal_desc:0 ""
 ITA_victory_in_ethiopia:0 "Победа в Эфиопии"
 ITA_victory_in_ethiopia_desc:0 "После десятилетий унижения мы наконец преодолели последствия поражения от Эфиопии. Такая победа может лишь укрепить доверие народа к правительству Муссолини."
 ITA_the_desillusion_of_fascism:0 "Роспуск фашизма"
 ITA_the_desillusion_of_fascism_desc:0 ""
 ITA_ratify_the_stresa_front_tt:0 "Мы попросим §Y[ENG.GetNameDef]§! и §Y[FRA.GetNameDef]§! восстановить §Yфронт Стрезы§! против §Y[GER.GetNameDef]§!. Обе страны должны согласиться, иначе фокус будет §Rотменён§!.\n"
 ITA_stresa_front_refused_flag:0 "В восстановлении фронта Стрезы отказано."
 ITA_leave_the_league_of_nations:0 "Покинуть Лигу Наций"
 ITA_leave_the_league_of_nations_desc:0 "Лига Наций, уже доказавшая свою неспособность действовать, всё же сочла нужным осудить наше вторжение в Эфиопию. Нам не требуется её поддержка или одобрение, чтобы знать, что полезно для [ITA.GetnameDef], поэтому следует выйти из организации."
 ITA_move_toward_autarky:0 "Двигаться к автаркии"
 ITA_move_toward_autarky_desc:0 "Различные эмбарго вынуждают нас перейти к автаркии в обеспечении ресурсами."
 ITA_the_stab_in_the_back:0 "Триумф в Африке"
 ITA_the_stab_in_the_back_desc:0 "Несмотря на кровь, пролитую нашими храбрыми солдатами в Великой войне, державы-победительницы дали нам слишком малую компенсацию и лишили земель с итальянским населением. Мы исправим эту несправедливость и наконец завершим объединение Италии!"
 ITA_the_lega_latina:0 "Латинская лига"
 ITA_the_lega_latina_desc:0 "Мы создадим военный союз, чтобы больше никто не смог нас предать. Мир увидит, что [ITA.GetNameDef] — держава, которую следует уважать и которая способна навязать свою волю любому противнику."
 ITA_cooperation_with_germany:0 "Сотрудничество с [GER.GetNameDef]"
 ITA_cooperation_with_germany_desc:0 "Подобно нам, [GER.GetAdjective] сторона стремится отомстить державам Антанты. Нам выгодно сблизиться и создать общий фронт."
 ITA_joint_austrian_gaurantee:0 "Совместная гарантия [AUS.GetNameDef]"
 ITA_joint_austrian_gaurantee_desc:0 "Германия уже много лет претендует на Австрию в рамках проекта «аншлюса», несмотря на явное нарушение Версальского и Сен-Жерменского договоров. Совместная гарантия с нашими союзниками должна её сдержать."
 protected_by_the_stresa_front_flag:0 "Под защитой фронта Стрезы"
 ITA_joint_austrian_gaurantee_tt:0 "[AUS.GetNameDef] теперь §Gвсегда§! будет отказываться от §Yаншлюса§!\n"
 ITA_scientific_cooperation_r56:0 "Научное сотрудничество"
 ITA_scientific_cooperation_r56_desc:0 "[GER.GetAdjective] учёные добились значительных успехов, включая разработки бронетехники и ракет. Научное сотрудничество между странами может принести нам большую пользу."
 ITA_the_italian_tiger:0 "Итальянский тигр"
 ITA_the_italian_tiger_desc:0 "[GER.GetAdjective] тяжёлые танки доказали смертельную эффективность на поле боя. Чтобы добиться подобных побед, мы должны создать собственную машину, не уступающую [GER.GetAdjective] образцам."
 ITA_ultimatum_to_albania:0 "Ультиматум [ALB.GetNameDef]"
 ITA_ultimatum_to_albania_desc:0 "Мы уже много лет присматриваемся к Албании, фактически превратив её в протекторат. Теперь настало время полностью включить её в нашу империю, потребовав отставки нынешнего правительства."
 ITA_alliance_with_austria:0 "Союз с [AUS.GetNameDef]"
 ITA_alliance_with_austria_desc:0 "Лучший способ удержать [GER.GetNameDef] от вторжения в [AUS.GetNameDef] — заключить союзный договор с [AUS.GetNameDef] и тем самым гарантировать её границы от любой агрессии."
 ITA_claims_on_yugoslavia:0 "Претензии к Югославии"
 ITA_claims_on_yugoslavia_desc:0 "Настало время исправить одну из величайших несправедливостей, причинённых Италии: отделение от Далмации, где итальянское население проживало на протяжении многих веков."
 ITA_the_new_spain:0 "Новая Испания"
 ITA_the_new_spain_desc:0 "Победа националистов в гражданской войне в Испании сблизила наши страны, теперь объединённые культурно и политически. Несомненно, включение Испании в наш военный союз отвечает нашим интересам."
 ITA_expanding_our_influence:0 "Расширение нашего влияния"
 ITA_invade_greece:0 "Вторгнуться в Грецию"
 ITA_invade_greece_desc:0 "Установление контроля над Грецией завершит наше господство на Балканах и создаст лучшую основу для контроля над восточной частью Средиземного моря."
 ITA_the_spanish_question:0 "Испанский вопрос"
 ITA_the_spanish_question_desc:0 "Гражданская война глубоко изменила Испанию. Полуостров следует поставить под наш прямой контроль, чтобы обеспечить доступ к Атлантике, прежде чем положение станет по-настоящему опасным."
 ITA_claims_in_africa:0 "Претензии в Африке"
 ITA_claims_in_africa_desc:0 ""
 ITA_influence_iberia:0 "Влиять на Иберию"
 ITA_influence_iberia_desc:0 ""
 ITA_officialize_the_albanian_protectorate:0 "Узаконить албанский протекторат"
 ITA_formalize_the_albanian_protectorate:0 "Официально оформить албанский протекторат"
 ITA_formalize_the_albanian_protectorate_desc:0 "Не прибегая к прямой аннексии, достаточно усилить итальянский надзор за политическими решениями Албании, чтобы официально превратить её в протекторат и не вызвать гнев Союзников."
 ITA_demand_dalmatia:0 "Потребовать Далмацию"
 ITA_demand_dalmatia_desc:0 "Один вопрос всё ещё не решён — судьба Далмации, обещанной Италии после Великой войны. При поддержке союзников мы без труда убедим [YUG.GetNameDef] передать нам эту провинцию."
 ITA_preventive_intervention:0 "Превентивное вмешательство"
 ITA_preventive_intervention_desc:0 "Ни договоры, ни санкции, ни предупреждения не остановят [GER.GetNameDef]. Ради безопасности всей Европы необходимо вмешаться против неё."
 ITA_prevent_the_spread_of_communism:0 "Предотвратить распространение коммунизма"
 ITA_prevent_the_spread_of_communism_desc:0 "Опасность распространения коммунизма вполне реальна, что показала гражданская война в Испании. Мы должны вмешаться, прежде чем всё выйдет из-под контроля."
 ITA_expand_ond_membership:0 "Расширить членство в ОНД"
 ITA_expand_ond_membership_desc:0 "Opera Nazionale Dopolavoro, или Национальная организация досуга, была создана в 1925 году для организации свободного времени рабочих. Формально оставаясь аполитичной, она всё больше превращалась во вспомогательный орган партии и тем самым укрепляла верность рабочих фашизму."
 ITA_revive_the_opera_nazionale_balilla:0 "Возродить Opera Nazionale Balilla"
 ITA_revive_the_opera_nazionale_balilla_desc:0 "Opera Nazionale Balilla — молодёжная образовательная организация, основанная в 1926 году под прямым контролем Национальной фашистской партии и одновременно служившая военизированной структурой для подготовки нового поколения к военной службе и верности фашистскому режиму."
 ITA_opera_nazionale_balilla:0 "Opera Nazionale Balilla"
 ITA_opera_nazionale_balilla_desc:0 "Opera Nazionale Balilla — молодёжная образовательная организация, основанная в 1926 году под прямым контролем Национальной фашистской партии и одновременно служившая военизированной структурой для подготовки нового поколения к военной службе и верности фашистскому режиму."
 ITA_mobilize_womens:0 "Новая итальянка"
 ITA_mobilize_womens_desc:0 "Завоевание Эфиопии даёт прекрасную возможность привлечь женщин к строительству Итальянской империи. Фашистские женские организации расширят свои обязанности и займутся, например, проведением курсов по борьбе с расточительством в домашнем хозяйстве."
 ITA_expand_the_OVRA:0 "Расширить ОВРА"
 ITA_expand_the_OVRA_desc:0 "Организация по надзору и подавлению антифашизма представляет собой сеть тайной полиции, предназначенную для выявления антифашистов, борьбы с партизанами и защиты режима Муссолини. Впереди могут быть тяжёлые времена, поэтому необходимо расширить её деятельность и ещё сильнее укрепить режим."
 ITA_reorganize_the_unpa:0 "Реорганизовать УНПА"
 ITA_reorganize_the_unpa_desc:0 "Национальный союз противовоздушной защиты был создан в 1934 году для гражданской обороны, но теперь его необходимо реорганизовать и определить роль в мирное время."
 ITA_resume_food_importation:0 "Возобновить импорт продовольствия"
 ITA_resume_food_importation_desc:0 "После Великой депрессии мы стремились сократить импорт, особенно пшеницы, предпочитая выращивать её самостоятельно. Это произошло за счёт производства овощей и фруктов и не улучшило положение фермеров. Теперь, когда эмбарго сняты, следует вернуться к прежней структуре производства и возобновить импорт [CAN.GetAdjective] и [USA.GetAdjective] пшеницы."
 ITA_decrease_tariffs:0 "Снизить пошлины"
 ITA_decrease_tariffs_desc:0 "Можно снизить пошлины, введённые после Великой депрессии, чтобы стимулировать экономику и сделать страну привлекательнее для торговли. В конце концов, Италия всегда славилась торговлей."
 ITA_joint_naval_exercises:0 "Совместные морские учения"
 ITA_joint_naval_exercises_desc:0 "Учения с королевским флотом позволят модернизировать Королевские ВМС, постоянно отстающие в технологическом отношении."
 ITA_militarize_the_rome_protocols:0 "Милитаризировать Римские протоколы"
 ITA_militarize_the_rome_protocols_desc:0 "Римские протоколы были соглашениями с Австрией и Венгрией об экономическом сотрудничестве трёх стран и общей позиции против территориальной целостности Югославии. Превращение этих соглашений в военный союз позволит защитить [AUS.GetNameDef], на которую претендует [GER.GetNameDef], а также расширить [ITA.GetAdjective] влияние в Европе."
 ITA_invite_bulgaria:0 "Пригласить [BUL.GetNameDef]"
 ITA_invite_bulgaria_desc:0 "Приглашение [BUL.GetNameDef] в наш союз поможет обезопасить южную часть Балканского полуострова и Чёрное море."
 ITA_operazione_dacia:0 "Операция «Дакия»"
 ITA_operazione_dacia_desc:0 "Стратегическое положение Румынии и нефтяные ресурсы означают, что мы не можем позволить себе, чтобы она перешла в сферу одного из наших врагов. Мы выдвинем ультиматум на [ROM.GetAdjective] Правительство просит [ITA.GetAdjective] мониторинг его дипломатических и внутренних действий, гарантия [ITA.GetAdjective] Привилегия на доступ к своей нефти и, наконец, возвращение Трансильвании [HUN.GetNameDef]."
 ITA_end_yugoslavia:0 "Покончить с Югославией"
 ITA_partition_yugoslavia:0 "Разделить Югославию"
 ITA_partition_yugoslavia_desc:0 "Югославия — чудовище, созданное волей держав Антанты. Настало время положить ей конец."
 ITA_end_yugoslavia_desc:0 "Югославия — чудовище, созданное волей держав Антанты. Настало время положить ей конец."
 ITA_fight_the_reich:0 "Сразиться с [GER.GetNameDef]"
 ITA_fight_the_reich_desc:0 "Очевидно, что [GER.GetAdjective] амбиции сталкиваются с нашими и вскоре могут стать для нас смертельной угрозой. Лучше всего нанести первый удар и устранить опасность."
 ITA_complete_the_latin_alliance:0 "Завершить создание Латинского союза"
 ITA_complete_the_latin_alliance_desc:0 "После присоединения [ROM.GetNameDef] и Испании к нашему союзу пора расширить партнёрство латинских стран, пригласив Португалию. Это даст нам выгоднейшую позицию для господства в Атлантике и Африке."
 ITA_expand_the_oil_fields:0 "Расширить нефтяные месторождения"
 ITA_expand_the_romanian_oil_fields:0 "Расширить румынские нефтяные месторождения"
 ITA_expand_the_romanian_oil_fields_desc:0 "Румынская нефть позволила снабжать значительную часть армии, но топлива всё ещё не хватает. Расширение нефтяной инфраструктуры должно решить эту проблему."
 italy_flag_romania_accepted_ultimatum:0 "Румыния приняла наш ультиматум"
 ITA_operazione_achaicus:0 "Операция «Ахайкос»"
 ITA_operazione_achaicus_desc:0 "Если мы хотим восстановить Римскую империю, очевидно, что Греция должна войти в её состав."
 ITA_operazione_trajan:0 "Операция «Траян»"
 ITA_operazione_trajan_desc:0 "Стратегическое положение и нефтяные ресурсы Румынии не позволяют нам допустить её попадание в сферу влияния одного из врагов. Мы предъявим румынскому правительству ультиматум с требованиями предоставить Италии контроль над дипломатической и внутренней политикой, гарантировать привилегированный доступ к нефти и вернуть Трансильванию Венгрии."
 ITA_italianize_dalmatia:0 "Итальянизировать Далмацию"
 ITA_italianize_dalmatia_desc:0 "Программы итальянизации местного населения и переселения итальянских семей в Далмацию за несколько лет превратят её в полностью итальянскую провинцию."
 ITA_operazione_cesare:0 "Операция «Цезарь»"
 ITA_operazione_cesare_desc:0 "С тех пор как Франция захватила нашу любимую Корсику, живущие там итальянцы постоянно страдают, прежде всего из-за программ насильственной франкофонизации населения. Настало время воссоединиться с братьями."
 ITA_operazione_vulso:0 "Операция «Вульсон»"
 ITA_operazione_vulso_desc:0 "Севрский договор обещал нам обширные земли в Анатолии, но после поражения от войск Ататюрка от них пришлось отказаться. Настало время исправить эту последнюю ошибку нашей военной истории."
 ITA_operazione_tiberio:0 "Операция «Тиберий»"
 ITA_operazione_tiberio_desc:0 "Югославия — чудовище, созданное волей держав Антанты. Настало время положить ей конец."
 ITA_operazione_druso:0 "Операция «Друз»"
 ITA_operazione_druso_desc:0 "Очевидно, что германские амбиции сталкиваются с нашими и вскоре могут стать смертельной угрозой. Лучше всего нанести первый удар и устранить опасность."
 ITA_operazione_costantino:0 "Операция «Константин»"
 ITA_operazione_costantino_desc:0 "Ничто не пугало мир так сильно, как большевистский террор, затаившийся в холодной России. Настало время покончить с коммунистической угрозой и обеспечить итальянскую гегемонию во всей Европе."
 ITA_increase_wheat_production:0 "Увеличить производство пшеницы"
 ITA_increase_wheat_production_desc:0 "Различные эмбарго ещё сильнее осложняют нашу зависимость от импортного продовольствия. Мы проведём эффективную программу по переводу фермеров на выращивание пшеницы."
 ITA_expand_the_comando_supremo:0 "Расширить роль Верховного командования"
 ITA_expand_the_comando_supremo_desc:0 "Высшее командование играет незначительную роль в принятии армейских решений, особенно в доведении ожиданий правительства до отдельных командиров. Следует повысить его значение и расширить состав."
 ITA_maintain_the_three_branches_independence:0 "Сохранить независимость трёх родов войск"
 ITA_maintain_the_three_branches_independence_desc:0 "Нынешняя организация вооружённых сил позволяет избежать вмешательства между тремя основными родами войск и тем самым ускоряет принятие решений."
 ITA_war_of_rapid_decision:0 "Война быстрых решений"
 ITA_war_of_rapid_decision_desc:0 "Моторизованная и мобильная армия идеально подойдёт для Восточной Европы и Северной Африки."
 ITA_focus_on_firepower:0 "Сосредоточиться на огневой мощи"
 ITA_focus_on_firepower_desc:0 "Усиление роли артиллерии позволит избежать ненужных потерь и одновременно повысить огневую мощь армии."
 ITA_war_of_positions:0 "Позиционная война"
 ITA_war_of_positions_desc:0 "Повышение эффективности обычной пехоты станет прекрасным компромиссом между наступательными и оборонительными возможностями."
 ITA_resolve_the_automobile_gap:0 "Устранить нехватку автотранспорта"
 ITA_resolve_the_automobile_gap_desc:0 "Производство автомобилей остаётся сравнительно низким, и лишь немногие части полностью ими оснащены. Необходимо увеличить выпуск автотранспортного снаряжения и одновременно модернизировать его."
 ITA_increase_the_number_of_ncos:0 "Увеличить число унтер-офицеров"
 ITA_increase_the_number_of_nco:0 "Устранить нехватку унтер-офицеров"
 ITA_increase_the_number_of_nco_desc:0 "Унтер-офицеры — основа любой армии, и нашим дивизиям их серьёзно не хватает. Мы приложим усилия к их набору, чтобы обеспечить качественное командование."
 ITA_modern_era_artillery:0 "Современная артиллерия"
 ITA_modern_era_artillery_desc:0 "Значительная часть используемой артиллерии всё ещё относится ко времени Великой войны. Необходимо начать общую программу модернизации производства, чтобы солдаты получили современное вооружение."
 ITA_review_the_military_budget:0 "Пересмотреть военный бюджет"
 ITA_review_the_military_budget_desc:0 "Для поддержки армии необходимо увеличить выделяемый ей бюджет."
 ITA_the_new_arditi:0 "Новые ардити"
 ITA_the_new_arditi_desc:0 "«Штурмовые части», также известные как «ардити», были особым корпусом итальянской армии во время Первой мировой войны. Они стали первыми современными ударными войсками и внушали страх всем Центральным державам. Многие их участники впоследствии заняли важные посты в итальянской армии, поэтому стоит создать современный аналог."
 ITA_carro_armato:0 "Танк P 40"
 ITA_carro_armato_desc:0 "Моторизацию армии необходимо сопровождать более широким применением танков. Большинство наших машин относятся ещё ко времени Великой войны, поэтому следует поддерживать их на современном уровне."
 ITA_modello_1938:0 "Модель 1938 года"
 ITA_modello_1938_desc:0 "После сообщений о неудовлетворительной эффективности как на коротких, так и на дальних дистанциях, особенно во время войны с Эфиопией, армия получит новую модель винтовки разработки Carcano, исправляющую недостатки прежнего образца."
 ITA_alpini:0 "Альпини"
 ITA_cannone_da_75_32:0 "Пушка 75/32"
 ITA_cannone_da_47_32:0 "Пушка 47/32"
 ITA_cannone_da_47_32_desc:0 "Разработанную австрийской фирмой Böhler пушку 47/32 мы будем использовать для поддержки пехоты и как противотанковое орудие. Следует договориться о лицензии для оснащения армии."
 ITA_alpini_desc:0 "Альпини — войска, специализирующиеся на горной войне и доказавшие свою ценность в боях против Австро-Венгрии. Настало время их модернизировать."
 ITA_modernise_the_fanti_dell_aria:0 "Модернизировать "
 ITA_modernize_the_fanti_dell_aria:0 "Модернизировать воздушную пехоту"
 ITA_nationalize_the_banking_sector:0 "Национализировать банковский сектор"
 ITA_nationalize_the_banking_sector_desc:0 "Финансовые трудности Великой депрессии, жёсткая дефляция и стоимость войны в Эфиопии показывают, что финансовый сектор способен нормально работать лишь под строгим государственным надзором. Мы подпишем указ о передаче банковского сектора под контроль государства."
 ITA_expand_the_iri_role:0 "Расширить роль ИРИ"
 ITA_end_the_army_corruption:0 "Покончить с коррупцией в армии"
 ITA_end_the_army_corruption_desc:0 "Политика покровительства партийцам обеспечила нам лояльную армию. Однако одновременно она оказалась коррумпированной и управляется людьми, заботящимися прежде всего о собственном влиянии, а не о модернизации. Настало время прекратить это и вернуться к системе заслуг."
 ITA_end_the_army_corruption_tt:0 "Некоторые генералы будут §Yуволены§!"
 ITA_the_backbone_of_the_party:0 "Опора партии"
 ITA_the_backbone_of_the_party_desc:0 "Армия и её прославление сделали Национальную фашистскую партию могущественной. Следует продолжить возвеличивание военных и офицеров, укрепляя политический контроль."
 ITA_adapt_great_war_tactics_to_our_era:0 "Адаптировать тактику Великой в"
 ITA_adapt_great_war_tactics:0 "Адаптировать тактику Великой войны"
 ITA_adapt_great_war_tactics_desc:0 "Высшее командование по-прежнему убеждено, что можно использовать те же приёмы, которые принесли победу в Великой войне. Полностью переубедить его невозможно, но можно хотя бы достаточно адаптировать эти методы."
 ITA_reshuffle_the_officer_corps:0 "Перестроить офицерский корпус"
 ITA_reshuffle_the_officer_corps_desc:0 "Соперничество в высшем командовании привело к тому, что офицеров повышают исключительно благодаря принадлежности и верности одному из армейских руководителей. Необходимо провести проверки и при необходимости заменить таких офицеров."
 ITA_extend_officers_autonomy:0 "Расширить самостоятельность офицеров"
 ITA_extend_officers_autonomy_desc:0 "Необходимо расширить самостоятельность офицеров в бою, чтобы они могли применять более подходящую тактику."
 ITA_pride_of_the_nation:0 "Гордость нации"
 ITA_pride_of_the_nation_desc:0 "Военная пропаганда должна стать ещё масштабнее. Итальянский народ обязан гордиться своей армией, и мы должны убедить его, что служба в ней — не просто долг, а вопрос личной чести."
 ITA_follow_pariani_plan:0 "Следовать плану Париани"
 ITA_follow_pariani_plan_desc:0 "Альберто Париани, начальник Генерального штаба, продвигал доктрину быстрого мобильного наступления при поддержке тяжёлой артиллерии."
 ITA_appoint_graziani_desc:0 "Родольфо Грациани, известный прежде всего жестокими репрессиями в колониях, особенно в Ливии, выступает за более стремительную войну и усиление роли танков в армии. Его назначение во главе сухопутных сил позволит начать модернизацию механизации."
 ITA_appoint_graziani:0 "Назначить Грациани"
 ITA_study_the_spanish_civil_war:0 "Изучить гражданскую войну в Испании"
 ITA_study_the_spanish_civil_war_desc:0 "Гражданская война в Испании даёт прекрасную возможность изучить современное ведение боя."
 ITA_question_the_high_command:0 "Поставить под сомнение высшее командование"
 ITA_question_the_high_command_desc:0 "Высшее командование состоит из старых ветеранов Великой войны, после неё знавших лишь колониальные столкновения. Не обязательно увольнять их, но молодым офицерам следует предоставить больший вес."
 ITA_focus_on_mobilisation:0 "Сосредоточиться на мобилизации"
 ITA_focus_on_mobilization:0 "Сосредоточиться на мобилизации"
 ITA_focus_on_mobilization_desc:0 "Следует направить усилия на повышение способности мобилизовать солдат, чтобы встретить будущий конфликт во всеоружии."
 ITA_further_doctrinal_innovation:0 "Дальнейшее развитие доктрин"
 ITA_further_doctrinal_innovation_desc:0 "План модернизации уже действует, и теперь пора ускорить обновление наших боевых доктрин."
 ITA_high_command_loyalty:0 "Верность высшего командования"
 ITA_high_command_loyalty_desc:0 "Наши усилия по укреплению позиций высшего командования обеспечили его непоколебимую верность."
 ITA_war_without_bloodshed:0 "Война без кровопролития"
 ITA_war_without_bloodshed_desc:0 "Насилие решило бы проблему быстрее, но могло бы обернуться тяжёлыми последствиями, а в столь критический момент мы не можем себе этого позволить. Политическая стратегия постепенного ослабления влияния фашистов обеспечит плавный переход."
 ITA_war_without_bloodshed_tt:0 "§GФашисты§! будут слабеть значительно дольше, но это укрепит позиции §gмонархистов§!"
 ITA_meet_with_messe:0 "Встретиться с Мессе"
 ITA_meet_with_messe_desc:0 "Джованни Мессе, наш министр внутренних дел и убеждённый монархист, пользуется огромным уважением и, главное, влиянием. Мы можем использовать потенциальных роялистов, внедрённых в фашистские учреждения, чтобы разрушить их изнутри."
 ITA_meet_with_messe_tt:0 "§GФашисты§! значительно ослабеют, но это не обязательно пойдёт на пользу §gмонархистам§! и может обернуться против нас."
 ITA_victory_in_the_civil_war:0 "Победа в гражданской войне"
 ITA_victory_in_the_civil_war_desc:0 "Мы наконец уничтожили фашистских предателей нашей прекрасной итальянской нации. Восстановление займёт время, но мы движемся вперёд, зная, что избежали худшего из возможных исходов."
 ITA_restore_elections:0 "Восстановить выборы"
 ITA_restore_elections_desc:0 ""
 ITA_a_guiding_hand:0 "Направляющая рука"
 ITA_a_guiding_hand_desc:0 ""
 ITA_expand_the_iri_role_desc:0 "ИРИ была создана для спасения, перестройки и финансирования банков и компаний, обанкротившихся во время Великой депрессии, и в итоге получила контроль над множеством итальянских банков. Расширение её влияния на более значительную часть экономики сделает институт центральным элементом послекризисной перестройки."
 ITA_po_valley_mettalurgy:0 "Металлургия долины По"
 ITA_po_valley_mettalurgy_desc:0 "В долине По сосредоточена значительная часть итальянской промышленности, особенно металлообработка в Турине и Генуе. Эта отрасль жизненно важна и должна получить первоочередную поддержку."
 ITA_expand_hydroelectricity_production:0 "Расширить производство гидроэнергии"
 ITA_expand_hydroelectricity_production_desc:0 "Чтобы решить проблемы с электроэнергией, главным образом вызванные нехваткой угля, мы уже несколько лет реализуем программы строительства плотин для гидроэлектростанций."
 ITA_increase_marble_exportations:0 "Увеличить экспорт мрамора"
 ITA_increase_marble_exportations_desc:0 "Между Ла-Специей и Ливорно возвышаются Апуанские Альпы с огромными запасами мрамора. Каррарский или сераваццский, с голубыми или чёрными прожилками — мрамор остаётся одним из главных экспортных товаров."
 ITA_prepare_the_economy_for_war:0 "Подготовить экономику к войне"
 ITA_prepare_the_economy_for_war_desc:0 "Из-за относительно слабой индустриализации, сосредоточенной преимущественно на севере, мы значительно отстаём от других европейских стран по военному производству. Чтобы снабжать армию на должном уровне, потребуются серьёзные экономические усилия."
 ITA_colonial_investments:0 "Инвестиции в колонии"
 ITA_colonial_investments_desc:0 "Наши колонии открывают огромные экономические возможности: от богатых нефтью земель Ливии до запасов железа и золота в Эритрее. Следует увеличить колониальные инвестиции."
 ITA_bring_industry_to_the_mezzogiorno:0 "Принести промышленность в Меццоджорно"
 ITA_bring_industry_to_the_mezzogiorno_desc:0 "Меццоджорно, южная часть Италии, всегда отставала в индустриализации, а большинство жителей занимались сельским хозяйством. Настало время сравнять юг с севером по уровню промышленного развития."
 ITA_expand_libyan_oil_production:0 "Общество «Петролибия»"
 ITA_expand_libyan_oil_production_desc:0 "Под великой пустыней Ливии скрываются огромные нетронутые запасы нефти. Благодаря интенсивной колонизации и значительному итальянскому присутствию расширить нефтедобычу будет несложно."
 ITA_increase_settlements_in_eritrea:0 "Увеличить число поселений в Эритрее"
 ITA_increase_settlements_in_eritrea_desc:0 "Эритрея богата возможностями благодаря климату, благоприятному для животноводства, и недрам с месторождениями от железа до золота. Сейчас там проживает лишь несколько тысяч итальянцев — слишком мало для прибыльной работы колониальной экономики. Программы переселения семей, подобные ливийским, должны решить проблему нехватки населения."
 ITA_establish_the_sme_desc:0 "Società Mineraria dell'Eritrea станет государственной компанией, отвечающей за разработку месторождений в Эритрее и получение прибыли от них."
 ITA_establish_the_sme:0 "Учредить СМЭ"
 ITA_profits_from_eritrea:0 "Прибыль от Эритреи"
 ITA_eritrean_coast_oil_extraction:0 "Добыча нефти на побережье Эритреи"
 ITA_eritrean_coast_oil_extraction_desc:0 "Исследования обнаружили нефтяные залежи в прибрежном районе Эритреи. Было бы разумно создать там нефтедобывающую инфраструктуру."
 ITA_increase_north_south_links:0 "Улучшить связи между севером и югом"
 ITA_increase_north_south_links_desc:0 "Улучшение дорог, соединяющих север и юг, принесёт пользу обеим частям страны."
 ITA_incease_fiat_presence_in_the_south:0 "Расширить присутствие Fiat на юге"
 ITA_incease_fiat_presence_in_the_south_desc:0 "Fiat, один из крупнейших производителей автомобилей и танков, уже хорошо закрепился на севере. Мы можем поощрить строительство предприятий на юге и тем самым увеличить промышленный потенциал."
 ITA_finish_the_litoranea_libica:0 "Завершить Литоренеа Либика"
 ITA_finish_the_litoranea_libica_desc:0 "Во время Великой депрессии правительство активно развивало инфраструктуру и общественные работы по всей Ливии, улучшая условия жизни поселенцев. В 1930-х годах был начат проект «Литоренеа Либика» — дороги вдоль всего средиземноморского побережья. Теперь её можно завершить и соединить большинство крупных ливийских городов."
 ITA_tripoli_explosives_factory:0 "Завод взрывчатых веществ в Триполи"
 ITA_tripoli_explosives_factory_desc:0 "Итальянские поселенцы открыли множество предприятий в Триполитании и Киренаике. Среди них — производство взрывчатых веществ в Триполи, которое может оказаться весьма полезным для итальянской армии."
 ITA_expand_libyan_manufactures:0 "Расширить ливийскую промышленность"
 ITA_expand_libyan_manufactures_desc:0 "Теперь, когда поселенцы прочно обосновались в Ливии, пора развивать гражданскую промышленность колонии, строя заводы, особенно винокурни, предприятия Fiat и цементные заводы."
 ITA_modernize_ethiopian_roads:0 "Модернизировать дороги Эфиопии"
 ITA_modernize_ethiopian_roads_desc:0 "Наша новая колония Эфиопия обладает устаревшей железнодорожной системой. Лучший пример — франко-эфиопская линия, поездка по которой из Аддис-Абебы в Джибути занимает более 36 часов. Мы модернизируем пути с помощью новых автомотрис Fiat."
 ITA_imperial_line:0 "Имперская линия"
 ITA_imperial_line_desc:0 "Имперская линия станет предполагаемым воздушным маршрутом, соединяющим Аддис-Абебу, Могадишо, Асмэру, Бенгази и Рим. Она свяжет всю Итальянскую колониальную империю и улучшит экономические связи между её частями."
 ITA_compagnia_etiopica_degli_esplosivi:0 "Compagnia Etiopica Degli Esplosivi"
 ITA_compagnia_etiopica_degli_esplosivi_desc:0 "Для поддержки войск, защищающих Восточную Африку, и всей армии необходимо расширить производство взрывчатых веществ. Эфиопия, чьё экономическое развитие ускорилось после модернизации дорог, идеально подходит для этого."
 ITA_cementerie_d_etiopia:0 "Cementerie d'Etiopia"
 ITA_cementerie_d_etiopia_desc:0 "Развитие цементной промышленности увеличит наши строительные возможности в Эфиопии."
 ITA_colonial_rifles_production:0 "Производство винтовок в колониях"
 ITA_colonial_rifles_production_desc:0 "Развитие производства взрывчатых веществ по всей колониальной империи показывает, что следует увеличить выпуск оружия в колониях для снабжения войск, охраняющих эти территории."
 ITA_expand_addis_ababa:0 "Расширить Аддис-Абебу"
 ITA_expand_addis_ababa_desc:0 "Мы собрали множество архитекторов для подготовки проекта расширения Аддис-Абебы и превращения её в столицу Итальянской Восточной Африки. Пора приступить к реализации."
 ITA_expand_taranto_steelwork:0 "Расширить металлургические предприятия Таранто"
 ITA_expand_taranto_steelwork_desc:0 "Таранто — один из крупнейших и наиболее экономически значимых городов юга, прежде всего благодаря многочисленным предприятиям чёрной металлургии. Развитие этой отрасли важно не только для армии, но и для общего подъёма Меццоджорно."
 ITA_operazione_plautius:0 "Операция «Плавтий»"
 ITA_operazione_plautius_desc:0 "Годами нам приходилось считаться с Королевским флотом, обречённым оставлять нас на вторых ролях в Средиземном море. Победы в «Средиземноморском кризисе» недостаточно для уважения — лишь война позволит Италии господствовать на море!"
 ITA_regia_aeronautica_focus:0 "Королевские ВВС"
 ITA_regia_aeronautica_focus_desc:0 "Война в Абиссинии впервые позволила использовать созданные в 1923 году военно-воздушные силы в настоящем конфликте. Однако многие самолёты, включая бипланы, всё ещё устарели и требуют модернизации."
 newfocus_99_desc:0 "Разработанный и произведённый компанией Savoia-Marchetti трёхмоторный SM.79 Sparviero первоначально задумывался как транспортный самолёт, но заинтересовал правительство благодаря возможности стать значительно более быстрым бомбардировщиком, чем существующие машины."
 ITA_sm_79:0 "Savoia-Marchetti SM.79"
 ITA_sm_79_desc:0 "Разработанный и произведённый компанией Savoia-Marchetti трёхмоторный SM.79 Sparviero первоначально задумывался как транспортный самолёт, но заинтересовал правительство благодаря возможности стать значительно более быстрым бомбардировщиком, чем существующие машины."
 ITA_ba_65:0 "Breda Ba.65"
 ITA_ba_65_desc:0 "Улучшенная версия Ba.64 — Ba.65 — была разработана Антонио Парано и Джузеппе Панцери. Как и предшественники, самолёт предназначен для нескольких ролей: истребителя, разведчика и штурмовика."
 ITA_g_50_desc:0 "Fiat G.50 по прозвищу «Стрела» стал поворотным проектом для Fiat: его разработал Джузеппе Габриэлли, тогда как прежде компания полагалась на главного инженера Челестино Розателли."
 ITA_g_50:0 "Fiat G.50"
 ITA_increase_aircraft_production:0 "Увеличить производство самолётов"
 ITA_increase_aircraft_production_desc:0 "Несмотря на технологические достижения, производство самолётов остаётся сравнительно низким из-за ограниченной промышленной базы. Чтобы полностью оснастить военно-воздушные силы, необходимо удвоить усилия по выпуску авиации!"
 ITA_cant_z_1011:0 "CANT Z.1011"
 ITA_cant_z_1011_desc:0 "Разработанный Филиппо Дзаппатой CANT Z.1011 — настоящее маленькое чудо: двухмоторный низкоплан-бомбардировщик. Первые испытания показали высокую эффективность в уничтожении инфраструктуры, что сделает его особенно полезным в войне."
 ITA_further_pilots_training:0 "Расширить подготовку пилотов"
 ITA_further_pilots_training_desc:0 "Последняя область, требующая модернизации ВВС, — подготовка лётчиков. Развитие обучения воздушному бою позволит вырастить новое поколение пилотов, значительно более талантливых, чем предыдущее."
 ITA_crocco_mission:0 "Миссия Крокко"
 ITA_crocco_mission_desc:0 "Гаэтано Крокко, пионер итальянского ракетостроения и основатель Итальянского ракетного общества, взял на себя сложную задачу разработки ракетной системы для армии."
 ITA_satisfy_the_branches_needs:0 "Удовлетворить потребности родов войск"
 ITA_satisfy_the_branches_needs_desc:0 "Флот и авиация давно испытывают нехватку ресурсов и с завистью смотрят на привилегии армии. Настало время удовлетворить их требования."
 ITA_appoint_messe_2:0 "Назначить Мессе"
 ITA_appoint_messe_2_desc:0 "Во время войны в Абиссинии Джованни Мессе командовал моторизованной дивизией, что принесло ему звание бригадного генерала. Он отлично знаком с быстрыми соединениями — кавалерийскими и моторизованными. Назначение его главой армии позволит провести реформу на основе мобильной доктрины."
 ITA_restructure_the_divisions:0 "Перестроить дивизии"
 ITA_restructure_the_divisions_desc:0 "Пехотные дивизии необходимо перевести с трёхполковой структуры на двухполковую, сделав их более управляемыми, мобильными и приспособленными к манёвренной войне."
 ITA_general_equipment_modernization:0 "Общая модернизация снаряжения"
 ITA_general_equipment_modernization_desc:0 "Армия по-прежнему в основном оснащена техникой времён Великой войны, поскольку с тех пор участвовала лишь в колониальных конфликтах. Следует начать исследовательские проекты, уделив первоочередное внимание артиллерии и в меньшей степени винтовкам."
 ITA_winter_training_in_finland:0 "Зимняя подготовка в Финляндии"
 ITA_winter_training_in_finland_desc:0 "Благодаря хорошим отношениям с Финляндией мы направили туда одну альпийскую дивизию для изучения зимней войны. Миссия принесла ценный опыт, который пригодится в случае боёв в холодных землях."
 ITA_expand_the_elite_forces:0 "Расширить элитные войска"
 ITA_expand_the_elite_forces_desc:0 "Элитные части показали выдающиеся результаты во время Великой войны и внушали страх всем державам Оси. Многие их бойцы поднялись по военной иерархии и теперь могут подготовить новое поколение таких формирований."
 ITA_spa_as_37:0 "SPA AS.37"
 ITA_spa_as_37_desc:0 "Производимый Fiat SPA AS.37 основан на артиллерийском тягаче TL.37 и специально разработан для войны в Северной Африке, в частности по инициативе губернатора Ливии Итало Бальбо."
 ITA_german_military_assistance:0 "Германская военная помощь"
 ITA_german_military_assistance_desc:0 "Мы можем многому научиться у вермахта. Приглашённые германские офицеры проведут инспекцию наших войск и помогут довести их подготовку до собственного уровня."
 ITA_giannini_sarnow_protocols:0 "Протоколы Джаннини—Сарнова"
 ITA_giannini_sarnow_protocols_desc:0 "Для борьбы с безработицей мы заключили соглашение с Германией, позволяющее тысячам итальянских рабочих трудиться там, особенно на предприятиях Volkswagen."
 ITA_redirect_military_fundings:0 "Перенаправить военное финансирование"
 ITA_redirect_military_fundings_desc:0 "Несмотря на высокий военный бюджет, армия тратит больше средств на собственное содержание и войска, чем на производство вооружений. Следует направить большую долю этих и без того значительных расходов на расширение оружейной промышленности."
 ITA_war_with_britain:0 "Война с Британией"
 ITA_war_with_britain_desc:0 "Настало время разгромить Британию, добиться превосходства в Средиземном море и превратить его в итальянское озеро!"
 ITA_regia_marina_2:0 "Королевские ВМС"
 ITA_regia_marina_2_desc:0 "Итальянское правительство долгое время уделяло модернизации Королевских ВМС значительно больше внимания, чем армии или авиации, стремясь установить полный контроль над Средиземным морем."
 ITA_cavagnari_plan:0 "План Каваньяри"
 ITA_cavagnari_plan_desc:0 "В 1933 году мы назначили Доменико Каваньяри начальником штаба флота, а позднее — секретарём военно-морского ведомства. Он придерживается консервативного подхода к морской войне, основанного на строительстве крейсеров, эсминцев и подводных лодок."
 ITA_new_navy_leadership:0 "Новое руководство флота"
 ITA_submarines_suppremacy:0 "Господство подводных лодок"
 ITA_appoint_campioni:0 "Назначить Кампиони"
 ITA_appoint_campioni_desc:0 "Иниго Кампиони был бы гораздо лучшим руководителем флота. Вместо увеличения числа малых кораблей и подводных лодок следует сделать приоритетом развитие линкоров."
 ITA_develop_naval_aviation:0 "Развивать морскую авиацию"
 ITA_develop_aircraft_carriers:0 "Развивать авианосцы"
 ITA_develop_aircraft_carriers_desc:0 "Чтобы проецировать в Средиземном море достаточно силы и действовать на равных с Великобританией или Францией, необходимо развивать авиационное крыло флота."
 ITA_naval_war_of_attrition:0 "Морская война на истощение"
 ITA_naval_war_of_attrition_desc:0 "Развитие подводных лодок позволит изматывать вражеский флот постоянными нападениями."
 ITA_improve_the_fleet_projection:0 "Улучшить проецирование силы флота"
 ITA_improve_the_fleet_projection_desc:0 "Нельзя надеяться, что одних подводных лодок хватит для господства в Средиземном море. Чтобы превратить его в нашу сферу влияния, необходимо проецировать туда как можно больше силы при помощи крупных кораблей."
 ITA_auxiliary_cruisers:0 "Вспомогательные крейсеры"
 ITA_auxiliary_cruisers_desc:0 "Лёгкость вспомогательных крейсеров позволит им сопровождать подводные лодки в кампаниях по изматыванию противника."
 ITA_la_decima:0 "Первая флотилия МАС"
 ITA_la_decima_desc:0 "«Первая флотилия МАС» станет нашим особым подразделением боевых пловцов, специализирующимся на рейдах против вражеских кораблей."
 ITA_mare_nostrum_2:0 "Наше море"
 ITA_develop_southern_ports:0 "Развивать южные порты"
 ITA_develop_southern_shipyards:0 "Развивать южные верфи"
 ITA_develop_southern_shipyards_desc:0 "Чтобы удовлетворить новые потребности военного кораблестроения, необходимо расширить морские производственные мощности. Южные верфи смогут обеспечить необходимый объём."
 ITA_naval_guerilla:0 "Морская герилья"
 ITA_naval_guerilla_desc:0 "Столкнувшись с флотами, значительно превосходящими наш, мы должны прибегнуть к более коварной тактике: использовать небольшие морские соединения для изматывания вражеских кораблей быстрыми и лёгкими атаками."
 ITA_shift_toward_an_offensive_force:0 "Перейти к наступательному флоту"
 ITA_shift_toward_an_offensive_force_desc:0 "Чтобы компенсировать численное отставание, мы должны уметь наносить первый удар."
 ITA_royal_intervention:0 "Королевское вмешательство"
 ITA_royal_intervention_desc:0 "Нельзя доверять фашистскому режиму вести Италию к славе. Неудачи на раннем этапе войны в Эфиопии ясно показали неспособность Национальной фашистской партии руководить страной. Мы должны отстранить фашистов и передать власть нашему великому королю!"
 ITA_empower_the_monarchists:0 "Усилить монархистов"
 ITA_empower_the_monarchists_desc:0 "После многих лет политических потрясений стало ясно, что лишь королю Виктору Эммануилу III можно доверить твёрдое руководство страной и объединение её в стабильную и могущественную державу!"
 ITA_secure_control_over_parliament:0 "Обеспечить контроль над парламентом"
 ITA_secure_control_over_parliament_desc:0 "Парламент стал причиной многих внутренних политических кризисов и не раз ставил страну на колени. Чтобы предотвратить новые потрясения, мы не станем распускать его напрямую, но дадим каждому понять, кому он обязан хранить верность."
 ITA_restore_the_statuto_albertino:0 "Восстановить Альбертинский статут"
 ITA_restore_the_statuto_albertino_desc:0 "Альбертинский статут служит конституцией страны с 1848 года, однако при фашистском режиме его настолько исказили, что он почти утратил первоначальные принципы. Мы должны восстановить его исходный вид и вновь освободить парламент."
 ITA_royal_militarism:0 "Королевский милитаризм"
 ITA_royal_militarism_desc:0 "Королевская армия вспомнит победы Великой войны и последует примеру нашего славного короля-солдата."
 ITA_control_the_industrial_elites:0 "Подчинить промышленную элиту"
 ITA_control_the_industrial_elites_desc:0 "Промышленная коррупция уже наносила огромный ущерб экономике. Мы должны напомнить промышленным элитам, кому они обязаны хранить верность."
 ITA_rebuild_the_north:0 "Восстановить север"
 ITA_rebuild_the_north_desc:0 "Жестокая гражданская война нанесла огромный ущерб промышленному северу страны. Если не исправить положение, регион может стать рассадником коммунистического сопротивления, поэтому необходимо вернуть ему прежнее величие."
 ITA_reopen_the_markets:0 "Снова открыть рынки"
 ITA_reopen_the_markets_desc:0 "Политика самообеспечения Муссолини серьёзно ограничила торговлю со многими странами. Такие глупые идеи вскоре погубят нашу экономику, поэтому необходимо вновь открыть рынки."
 ITA_strengthen_the_coalition:0 "Укрепить коалицию"
 ITA_strengthen_the_coalition_desc:0 "Теперь, когда фашисты изгнаны из Италии, можно объединить силы итальянских левоцентристских партий в мощную коалицию, стремящуюся восстановить демократию и создать новую Итальянскую республику!"
 ITA_referendum_on_the_monarchy:0 "Референдум о монархии"
 ITA_referendum_on_the_monarchy_desc:0 "Теперь, когда гражданская война окончена, можно обратиться ко второму вопросу — судьбе монархии, более десяти лет поддерживавшей фашистский режим."
 ITA_christian_democracy_r56:0 "Христианская демократия"
 ITA_christian_democracy_r56_desc:0 "Новая республика будет следовать христианским ценностям, чтобы улучшить жизнь народа и защитить свободную демократию."
 ITA_disband_the_partisans:0 "Распустить партизан"
 ITA_disband_the_partisans_desc:0 "Коммунистические партизаны хорошо нам послужили, но после окончания гражданской войны стали слишком опасны. Их необходимо распустить, прежде чем у них появятся собственные замыслы."
 ITA_liberalize_our_industries:0 "Либерализовать промышленность"
 ITA_liberalize_our_industries_desc:0 "Национализация и жёсткий контроль над промышленностью сначала показали хорошие результаты, но в долгосрочной перспективе оказались неэффективными. Ради экономической стабильности мы вновь позволим предприятиям действовать свободно."
 ITA_defenders_of_southern_europe:0 "Защитники Южной Европы"
 ITA_defenders_of_southern_europe_desc:0 ""
 ITA_formalise_the_front:0 "Официально оформить фронт"
 ITA_formalise_the_front_desc:0 "Пора превратить фронт Стрезы из обещания в реальность. Мы объединим страны в общий военный союз, чтобы сдержать германского зверя."
 ITA_formalise_the_front_tt:0 "§YКаждая страна§!, состоящая в одном альянсе с §Y[ENG.GetNameDef]§!, вступает во §Yфронт Стрезы§! под руководством §Y[ITA.GetNameDef]§!."
 ITA_invite_croatia:0 "Пригласить Хорватию"
 ITA_invite_croatia_desc:0 "Несмотря на разногласия из-за наших притязаний на Далмацию, союз с Хорватией может обезопасить фланг и расширить нашу сферу влияния на Балканах."
 ITA_finance_anic:0 "Финансировать АНИК"
 ITA_finance_anic_desc:0 "АНИК должна стать крупнейшей нефтехимической компанией Италии. Дополнительные ресурсы позволят ей производить топливо, значительно превосходящее импортные масла."
 ITA_a_way_out:0 "Выход"
 ITA_second_risorgimento:0 "Второе Рисорджименто"
 ITA_second_risorgimento_desc:0 "Мечта об объединённой Италии вновь в наших руках. Братья Италии, Италия пробудилась!"
 POLITICS_ITALO_BALBO:0 "Итало Бальбо"
 POLITICS_ITALO_BALBO_DESC:0 "Итало Бальбо"
 ITA_giuseppe_rosini:0 "Джузеппе Розини"
 ITA_pietro_barone:0 "Пьетро Бароне"
 ITA_oscar_di_giamberadino:0 "Оскар Ди Джамбернардино"
 ITA_liberalize_our_industries_idea:0 "Либерализация промышленности"
 ITA_liberalize_our_industries_idea_desc:0 "Национализация и жёсткий контроль над промышленностью сначала показали хорошие результаты, но в долгосрочной перспективе оказались неэффективными. Ради экономической стабильности мы вновь позволим предприятиям действовать свободно."
 italo_balbo_pol:0 "Итало Бальбо"
 victor_emmanuel:0 "Виктор Эммануил III"
 ITA_military_research_stretched_thin:0 "Перегруженные военные исследования"
 ITA_military_research_stretched_thin_desc:0 "Наши военные исследования чрезмерно распылены в попытке не отстать от технологий соперников. Чем-то пришлось пожертвовать, и первой пострадала способность своевременно развивать сухопутные вооружения. Единственное решение — значительно расширить и без того перегруженную военную промышленность, чтобы высвободить ресурсы для более эффективной работы над экспериментальными проектами."
 ITA_military_research_stretched_thin_tt:0 "\n§WЭто§! §YНациональный дух§! будет §GУдаленный§! §WКак только у нас есть§! 50 §YВоенные заводы§!"
