 ITA_ally_yugoslavia:0 "Сблизиться с Югославией"
 ITA_ally_yugoslavia_desc:0 ""
 ITA_pressure_country_government_YUG:0 "Оказать давление на [FROM.GetAdjective] правительство"
 ITA_pressure_country_government_YUG_desc:0 "Мы окажем давление на [FROM.GetAdjective] правительство, чтобы оно приняло политику, лучше соответствующую нашим интересам."
 ITA_promote_ideology_rallies_YUG:0 "Продвигать идеологические митинги в [FROM.GetNameDef]"
 ITA_promote_ideology_rallies_YUG_desc:0 "[ROOT.GetAdjective] агенты проведут политические митинги по всей [FROM.GetNameDef], продвигая [ROOT.GetIdeologyNameWithCaps] среди [FROM.GetAdjective] населения."
 BBA_generic_purchase_ships_events.01.t:0 "[FROM.GetAdjective] закупка кораблей"
 BBA_generic_purchase_ships_events.01.desc:0 "[FROM.GetNameDefCap] обратилась к нам с предложением приобрести часть законсервированных кораблей. Эти суда больше не используются из-за возраста и отсутствия современного оборудования."
 BBA_generic_purchase_ships_events.01.a:0 "Взаимовыгодное соглашение."
 BBA_generic_purchase_ships_events.01.b:0 "Мы не можем отказаться ни от одного корабля."
 BBA_generic_purchase_ships_events.02.t:0 "[FROM.GetNameDefCap] соглашается на продажу кораблей"
 BBA_generic_purchase_ships_events.02.desc:0 "[FROM.GetAdjective] дипломаты и представители флота сообщили, что готовы передать законсервированное оборудование, которое мы предложили купить. Это позволит быстро расширить наш молодой флот."
 BBA_generic_purchase_ships_events.02.a:0 "Прекрасные новости!"
 BBA_generic_purchase_ships_events.03.t:0 "[FROM.GetNameDefCap] отказывается продавать корабли"
 BBA_generic_purchase_ships_events.03.desc:0 "[FROM.GetAdjective] дипломаты сообщили, что не готовы расстаться с законсервированным оборудованием, которое мы предложили приобрести. Неясно, связано ли решение с их собственными планами на корабли или является выражением неодобрения нашей политики."
 BBA_generic_purchase_ships_events.03.a:0 "Прискорбно."
