 r56i.event.01.title:0 "Беспорядки на улицах"
 r56i.event.01.description:0 "Похоже, нужды народа слишком долго игнорировались. Возмущённые нынешним положением и больше не способные терпеть, люди прибегли к насилию. Хотя их требования сравнительно умеренны, их выполнение, несомненно, обойдётся дорого."
 r56i.event.01.default:0 "Крайне тревожно."
 r56i.event.01.democratic:0 "Наши граждане страдают."
 r56i.event.01.communism:0 "Нашими братьями манипулируют."
 r56i.event.01.fascism:0 "Народу нужна твёрдая рука."
 r56i.event.02.title:0 "Беспорядки возвращаются"
 r56i.event.02.description:0 "Беспорядки продолжаются и становятся всё серьёзнее. Всё больше представителей интеллигенции поддерживают протестующих, а требования, которые прежде считались крайними, теперь звучат гораздо чаще."
 r56i.event.02.default:0 "Что мы можем сделать?"
 r56i.event.02.democratic:0 "Наверняка должно существовать решение?"
 r56i.event.02.communism:0 "Это не настоящие коммунисты!"
 r56i.event.02.fascism:0 "Возможно, нужны крайние меры."
 r56i.event.04.title:0 "Подавление прошло успешно"
 r56i.event.04.description:0 "Недовольные, возможно, всё ещё придерживаются своих убеждений, но они на собственном опыте поняли, что лучше держать их при себе. Хотя напряжение по-прежнему ощущается, полиция и военная полиция разогнали протесты, а люди вернулись к повседневной жизни."
 r56i.event.04.default:0 "Не разбив яиц, омлет не приготовишь."
 r56i.event.04.democratic:0 "И не забудьте проголосовать за нас!"
 r56i.event.04.communism:0 "Цена революции высока."
 r56i.event.04.fascism:0 "Пусть слабаки трепещут."
 r56i.event.05.title:0 "Подавление провалилось"
 r56i.event.05.description:0 "Хотя отправленная нами военная полиция теоретически могла восстановить порядок, несколько наших людей, направленных разбираться с беспорядками, сами присоединились к протестующим. Те немногие, кто сохранил верность, похоже, лишь сильнее разозлили остальную общественность. Похоже, мы только подлили масла в огонь."
 r56i.event.05.default:0 "За что мы им вообще платим?"
 r56i.event.05.democratic:0 "Мы предали свои ценности впустую."
 r56i.event.05.communism:0 "Им наверняка помогают извне."
 r56i.event.05.fascism:0 "В следующий раз отправим НАСТОЯЩУЮ армию."
 r56i.event.06.title:0 "Переговоры успешны"
 r56i.event.06.description:0 "Организаторы протестов, как и любые люди, небезупречны. Некоторых лидеров удалось умиротворить расплывчатыми и пустыми обещаниями, других пришлось подкупить пожертвованиями на мирные инициативы из государственной казны. Как бы то ни было, протесты, похоже, выдохлись из-за отсутствия организации."
 r56i.event.06.default:0 "Перо могущественно."
 r56i.event.06.democratic:0 "Демократия вновь победила."
 r56i.event.06.communism:0 "Диалектика хорошо нам служит."
 r56i.event.06.fascism:0 "Массы легко успокоить."
 r56i.event.07.title:0 "Переговоры провалились"
 r56i.event.07.description:0 "Оказалось, что убедить одного человека гораздо проще, чем целую группу — урок, который усвоил наш министр внутренних дел, пытаясь уговорить всех значимых лидеров протестов распустить свои движения. Одни не поверили нашим обещаниям, другие были возмущены попытками подкупа, и, похоже, нам удалось лишь укрепить единство и сплочённость руководителей беспорядков."
 r56i.event.07.default:0 "Почему они не могут быть неприсоединившимися, как мы?"
 r56i.event.07.democratic:0 "Это оскорбление нашей демократии."
 r56i.event.07.communism:0 "Но наше государство способно дать всё!"
 r56i.event.07.fascism:0 "Что ж, мы пытались решить дело по-хорошему."
 r56i.event.08.title:0 "Участники беспорядков умиротворены"
 r56i.event.08.description:0 "Хотя цена оказалась высокой, теперь, когда выбоины на городских улицах заделаны, а социальные программы улучшены, народ достаточно доволен, чтобы прекратить организованные беспорядки. Некоторые всё ещё жалуются, но большинство удовлетворено."
 r56i.event.08.default:0 "Ну, если они довольны..."
 r56i.event.08.democratic:0 "Деньги вращают мир."
 r56i.event.08.communism:0 "У капитала всё ещё есть применение."
 r56i.event.08.fascism:0 "Овцы никогда не представляли угрозы."
 r56i.event.09.title:0 "Участники беспорядков требуют большего"
 r56i.event.09.description:0 "Несмотря на выполнение первоначальных требований лидеров протестов, верх взяли экстремисты. Теперь они требуют от государства ещё большего, а народ, воодушевлённый мнимой победой, всё охотнее следует каждому их слову."
 r56i.event.09.default:0 "Пустая трата ценных средств."
 r56i.event.09.democratic:0 "Совсем распустившиеся социалисты."
 r56i.event.09.communism:0 "Принудительный труд оказался напрасным!"
 r56i.event.09.fascism:0 "Как они СМЕЮТ так оскорблять нашу великую нацию?"
 strikes_rt56.t:0 "Арестованы рабочие, планировавшие забастовки"
 strikes_rt56.desc:0 "Недавно правоохранительные органы раскрыли план рабочих множества фабрик по всей стране устроить забастовку. К счастью, нам удалось вовремя узнать о заговоре, а его зачинщики были арестованы. Будем надеяться, это предотвратит перебои в производстве."
 strikes_rt56.a:0 "Мы ударили по источнику этого неповиновения."
 r56i.event.10.title:0 "Новый дипломатический курс?"
 r56i.event.10.description:0 "Создание нового правительства вызывает вопросы о будущем [ROOT.getnameDef]. [ROOT.GetLeader] настороженно относится к идеологической направленности [ROOT.GetFactionName] и опасается, что такое сотрудничество может привести к войне против стран, сочувствующих делу [ROOT.GetRulingIdeology] и политическому курсу [ROOT.GetRulingParty]."
 r56i.event.10.a:0 "Это были союзники прежнего правительства."
 r56i.event.10.b:0 "Соблюдать наши дипломатические обязательства."
 r56i.event.11.title:0 "[From.GetNameDefCap] покидает [From.GetFactionName]"
 r56i.event.11.description:0 "\nРешив радикально изменить свой дипломатический курс, новое [FROM.GetAdjective] [FROM.GetRulingIdeology] правительство вышло из [FROM.GetFactionName]. Эта новость вызвала потрясение среди членов [FROM.GetFactionName], которые опасаются, что дальнейшие выходы могут привести к распаду их союза.\n\n[FROM.GetLeader] заявил, что необходимость переориентировать политику страны в соответствии с программой [ROOT.GetRulingParty] побудила его принять это решение, добавив, что его правительство сделает всё возможное для сохранения [From.GetAdjective] независимости."
 r56i.event.11.a:0 "Мир меняется."
 r56i.event.12.title:0 "Историческая возможность"
 r56i.event.12.description:0 "Создание нашего правительства вызывает вопросы о будущем [ROOT.GetNameDef]. Для большинства из нас ответ очевиден: пришло время обрести независимость. Наш приход к власти — ясное доказательство правоты дела [ROOT.GetRulingIdeology], и мы должны привести наше дипломатическое положение в соответствие с политическим манифестом [ROOT.GetRulingParty]."
 r56i.event.12.a:0 "Наконец-то мы свободны!"
 r56i.event.12.b:0 "Это слишком рискованно."
 r56i.event.13.title:0 "[From.GetLeader] провозглашает независимость [From.GetAdjective]"
 r56i.event.13.description:0 "\nНовое [FROM.GetAdjective] [FROM.GetRulingIdeology] правительство решило в одностороннем порядке провозгласить независимость. [FROM.GetLeader] объявил это решение окончательным и бескомпромиссным. Поэтому [FROM.GetNameDef] откажется от своих военных обязательств и пересмотрит внешнюю политику. Это, несомненно, разгневает их бывшего сюзерена, поскольку [FROM.GetLeader] ясно заявил, что прежние договоры его не связывают и что этот день ознаменует начало новой эпохи в [FROM.GetAdjective] истории."
 r56i.event.13.a:0 "Ещё одна революция."
 r56i.event.14.title:0 "[From.GetNameDefCap] восстаёт!"
 r56i.event.14.description:0 "\nПриход к власти [FROM.GetRulingIdeology] привёл к провозглашению [FROM.GetAdjective] независимости лидером [FROM.GetLeader]. Их вызывающий отказ соблюдать установленный порядок может создать опасный прецедент."
 r56i.event.14.a:0 "Мы должны ответить!"
 r56i.event.15.title:0 "[From.GetNameDefCap] распускает свою фракцию!"
 r56i.event.15.description:0 "\nНе сумев найти дипломатических партнёров, [FROM.GetAdjective] правительство объявило, что больше не намерено возглавлять международную коалицию. Теперь оно открыто для дипломатических предложений о присоединении к более сильному союзу.\n\nЭто развитие событий, несомненно, привлечёт внимание различных канцелярий. Иностранные дипломаты, вероятно, уже пытаются склонить [FROM.GetLeader] и его правительство на свою сторону."
 r56i.event.15.a:0 "Интересно."
 r56i.event.16.t:0 "The [alliance_inviter.GetFactionName] и тот [alliance_applicant.GetAdjective] Фракция объединяется в единый альянс!"
 r56i.event.16.d:0 "\n\nМировая политика меняется стремительными темпами, и поэтому лидеры [alliance_inviter.GetFactionName] и [alliance_applicant.GetLeader] признали бессмысленным существование раздельных коалиций. Вместо этого они решили сражаться бок о бок.\n\nВероятно, это встревожит иностранные канцелярии, поскольку их объединённая мощь может стать гораздо более серьёзной угрозой."
 r56i.event.16.a:0 "Вместе мы сильнее."
 r56i.event.16.b:0 "Они ищут силу в единстве."
 r56i.event.16.c:0 "Это им не поможет!"
 r56i.event.16.e:0 "Война разрастается..."
 r56i.event.16.f:0 "Наш союз становится сильнее."
 r56i.event.17.t:0 "Вражеские войска высадились!"
 r56i.event.17.desc:0 "\nСегодня утром с патрульных катеров береговой охраны и многочисленных наблюдательных постов поступили сообщения о том, что у побережья [ROOT.getnameDef] собралась группа вражеских кораблей. От основного флота отделились многочисленные десантные суда, которые направились к нашему берегу с целью высадки.\n\nПо быстро поступающим разведывательным данным, масштаб высадки слишком велик для обычного рейда: вражеские силы уже подавили небольшой гарнизон, встретившийся им на пути. Противник стремительно создаёт небольшой плацдарм и выгружает на берег большое количество техники."
 r56i.event.17.a:0 "Мы должны действовать быстро!"
 r56i.event.18.t:0 "Высадился вражеский воздушный десант!"
 r56i.event.18.desc:0 "\nНад нашей территорией были замечены самолёты, после чего произошла массовая выброска десантных войск. Первые сообщения пока не позволяют определить полный масштаб сил противника. Кроме того, эта операция, вероятно, является частью более крупного наступления."
 r56i.event.18.a:0 "Мы должны действовать быстро!"
 r56i.event.19.t:0 "Отчёт армейской исследовательской лаборатории"
 r56i.event.19.desc:0 "Сегодня утром в правительственное управление поступил свежий отчёт нашей Армейской исследовательской лаборатории. В отчёте говорится, что нынешний бюрократический аппарат серьёзно ограничивает любую возможную модернизацию старых систем вооружения и внедрение новых технологий поля боя.\n\nОтдел исследований и разработок [ROOT.GetAdjective] не способен обработать нынешний объём отчётов, поступающих от наших военнослужащих. Увеличение их числа также было бы бесполезным, поскольку они слишком похожи друг на друга. Специалисты предлагают выделить бюджет на совершенствование военного оснащения с учётом огромного объёма данных, полученных благодаря боевому опыту.\n\n Наш генеральный штаб также поддерживает подобные разработки, признавая, что это несомненно повысит боеспособность армии [Root.GetAdjective]."
 r56i.event.19.a:0 "Попробуем извлечь из этого пользу!"
 r56i.event.20.t:0 "Отчёт военно-морской исследовательской лаборатории"
 r56i.event.20.desc:0 "Сегодня утром в правительственное управление поступил свежий отчёт нашей Военно-морской исследовательской лаборатории. В отчёте говорится, что нынешний бюрократический аппарат серьёзно ограничивает любую возможную модернизацию старых систем вооружения и внедрение новых военно-морских технологий.\n\nОтдел исследований и разработок [ROOT.GetAdjective] не способен обработать нынешний объём отчётов, поступающих от командиров нашего флота. Увеличение их числа также было бы бесполезным, поскольку они слишком похожи друг на друга. Специалисты предлагают выделить бюджет на совершенствование военно-морского оснащения с учётом огромного объёма данных, накопленных благодаря боевому опыту.\n\nАдмиралтейство также поддерживает подобные разработки, признавая, что это несомненно повысит боеспособность флота [Root.GetAdjective]."
 r56i.event.20.a:0 "Попробуем извлечь из этого пользу!"
 r56i.event.21.t:0 "Большой опыт в авиации"
 r56i.event.21.desc:0 "Сегодня утром в правительственное управление поступил свежий отчёт нашей Авиационной исследовательской лаборатории. В отчёте говорится, что нынешний бюрократический аппарат серьёзно ограничивает любую возможную модернизацию, вынуждая нас анализировать боевые отчёты вместо проведения полноценных испытаний. Директор настаивает, что технологии для улучшения наших самолётов уже существуют и должны быть рассмотрены как можно скорее."
 r56i.event.21.a:0 "Попробуем извлечь из этого пользу!"
