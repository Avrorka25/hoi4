 CUB_liberate_the_dominican_republic_desc:0 "Жестокий диктатор Доминиканской Республики Рафаэль Трухильо слишком долго терроризировал и угнетал народ. Мы должны освободить наших давно потерянных братьев!"
 CUB_deal_with_haitian_oppressors:0 "Разобраться с гаитянскими угнетателями"
