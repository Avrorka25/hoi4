 CUB_fascism_party_long:0 "Кубинская фаланга"
 cuba.1.t:0 "Всеобщие выборы"
 cuba.1.d:0 "Настало время призвать [CUB.GetAdjective] народ к избирательным урнам, чтобы он выбрал своего лидера.\nВ этом году главными соперниками стали две силы. Трёхпартийная коалиция, состоящая из Либеральной партии, Национального единства и Республиканского действия, пользуется поддержкой многих участников революции 1933 года, прежде всего генерала Фульхенсио Батисты.\nЕй противостоит сравнительно консервативная Национально-демократическая ассоциация во главе с бывшим президентом Марио Гарсией Менокалем, руководившим Кубой в годы Первой мировой войны."
 cuba.1.a:0 "Мигель Мариано Гомес"
 cuba_tripartite_coalition_party_long:0 "Трёхпартийная коалиция"
 cuba.1.b:0 "Марио Гарсия Менокаль"
 cuba_democratic_national_association_party_long:0 "Национально-демократическая ассоциация"
 cuba.2.t:0 "Инаугурация Мигеля Мариано Гомеса"
 cuba.2.d:0 "После победы на выборах в начале этого года Мигель Мариано Гомес вступил в должность седьмого президента Кубы.\nПользуясь идеологической поддержкой сил, стоявших за революцией 1933 года, он намерен продолжить социальные реформы, проводившиеся сменявшими друг друга администрациями со времён стодневного правительства Рамона Грау."
 cuba.2.a:0 "Мы действуем ради [CUB.GetAdjective] народа."
 cuba.3.t:0 "Инаугурация Марио Гарсии Менокаля"
 cuba.3.d:0 "Сегодня Марио Гарсия Менокаль вступил в должность седьмого президента Кубы после победы на выборах в начале этого года. Менокаля помнят по времени его пребывания на посту третьего президента Кубы как твёрдого союзника корпораций и бизнеса.\n \nВо время своего правления Менокаль значительно превысил федеральный бюджет, оставив страну с долгом более 40 000 000 долларов, и обвинялся в фальсификации выборов 1916 года ради переизбрания. Это привело к неудачному армейскому восстанию под руководством бывшего президента Хосе Мигеля Гомеса.\n \nВозвращение Менокаля к власти наверняка вызовет новую волну нестабильности и неопределённости."
 cuba.3.a:0 "Будем надеяться на лучшее..."
 cuba.4.t:0 "Батиста идёт на Гавану!"
 cuba.4.d:0 "Заявив, что правительство Марио Гарсии Менокаля предало не только революцию 1933 года, но и весь [CUB.GetAdjective] народ, Фульхенсио Батиста призвал армию выступить против правительства и свергнуть его.\nДж. Батлер Райт, [USA.GetAdjective] посол в [CUB.GetNameDef], объявил, что [USA.GetNameDef] поддерживает действующее правительство.\nГаванский гарнизон ещё не выбрал сторону, но его решение может изменить всё."
 cuba.4.a:0 "Гарнизон поддерживает правительство, и переворот проваливается."
 cuba.4.b:0 "Гарнизон поддерживает Батисту, и переворот удаётся."
 cuba_revolutionnary_party_long:0 "Кубинская революционная партия"
 cuba.5.t:0 "Президенту Гомесу объявлен импичмент!"
 cuba.5.d:0 "Несмотря на обещанные Мигелем Мариано Гомесом масштабные программы, он столкнулся с растущей оппозицией, особенно в Конгрессе и со стороны командующего армией Фульхенсио Батисты, хотя тот поддерживал его на выборах.\n\nПосле наложения вето на закон о девяти центах Конгресс официально отстранил Мигеля Мариано Гомеса, а вице-президент Федерико Ларедо Бру вступил в должность президента Кубы."
 cuba.5.a:0 "Будем надеяться, что он оправдает ожидания Конгресса и народа."
 cuba.6.t:0 "[CUB.GetNameDefCap] предлагает войну против Испании"
 cuba.6.d:0 "Заявив, что показной нейтралитет испанского режима на деле лишь прикрывает тайную помощь военным усилиям, [CUB.GetAdjective] правительство предложило объявить войну фашистской Испании.\n\nТакое решение нельзя принимать легкомысленно, особенно в отношении страны, пока сохраняющей нейтралитет. Однако почти не вызывает сомнений, что Испания поддерживает силы Оси."
 cuba.6.a:0 "Пора отомстить за Вторую республику."
 cuba.6.b:0 "Это слишком опасно."
 cuba.7.t:0 "В войне с Испанией отказано!"
 cuba.7.d:0 "Заявив, что война и без того длится слишком долго, а объявление войны такой крупной стране, как Испания, сделает её лишь ещё более жестокой и кровопролитной, наш план войны против националистической Испании отклонили."
 cuba.7.a:0 "По крайней мере, мы попытались."
 cuba.8.t:0 "Сочувствующие коммунистам пытаются захватить власть"
 cuba.8.d:0 "Сегодня в Санто-Доминго собрались представители многих коммунистических партий, включая бывших изгнанников, и потребовали отставки правительства и установления социалистического строя. Их очень много, и, похоже, они получили иностранное оружие."
 cuba.8.a:0 "Правительство падает, и коммунисты приходят к власти."
 cuba.8.b:0 "Правительство удерживает власть."
 cuba.9.t:0 "[DOM.GetAdjective] революция подавлена"
 cuba.9.d:0 "Несмотря на нашу материальную поддержку, [DOM.GetAdjective] революционерам, похоже, не удалось свергнуть правительство. Сумевшие бежать рассказывают, что многие участники событий в Санто-Доминго были арестованы и вполне могут быть казнены. Что нам делать?"
 cuba.9.a:0 "Если мы не можем освободить их изнутри, сделаем это снаружи!"
 cuba.9.b:0 "Мы вернёмся к этому позже."
 cuba.14.t:0 "Судьба Батисты"
 cuba.14.d:0 "Фульхенсио Батиста остаётся противоречивой фигурой в [ROOT.GetAdjective] политике и обладает огромным влиянием по всей стране. Это создаёт нам множество проблем, поэтому в наших интересах как можно скорее найти решение."
 cuba.14.a:0 "Отправить его в изгнание!"
 cuba.14.b:0 "Лучшим исходом станет компромисс."
 cuba.15.t:0 "Предложение об объединении Эспаньолы"
 cuba.15.d:0 "[ROOT.GetAdjective] и [DOM.GetAdjective] правительства обратились к нам с интересным предложением: объединить остров Эспаньола под властью единого правительства — [DOM.GetAdjective]. Как нам ответить?"
 cuba.15.a:0 "Вместе мы сильнее."
 cuba.15.b:0 "Ха! Что они задумали?"
 cuba.16.t:0 "Карибское единство?"
 cuba.16.d:0 "Правительство Фульхенсио Батисты предложило нам расширить сотрудничество путём установления власти единого правительства над островами Карибского моря. Хотя это будет означать отказ от собственной власти, такой шаг несомненно укрепит и объединит Карибский регион."
 cuba.16.a:0 "Хорошее предложение."
 cuba.16.b:0 "Мы предпочитаем сохранить автономию."
 cuba.17.t:0 "[FROM.GetAdjective] сторона предлагает сахар в обмен на нефть"
 cuba.17.d:0 "[FROM.GetAdjective] правительство сделало нам весьма заманчивое предложение. Будучи одним из немногих источников сахара, оно предлагает стабильные поставки в обмен на небольшую долю нашей нефтедобычи. Согласимся?"
 cuba.17.a:0 "Интересная инициатива."
 cuba.17.b:0 "Сахар — богатство прошлого."
 cuba.18.t:0 "[SOV.GetAdjective] сторона принимает наше предложение"
 cuba.18.d:0 "Наш посол в Москве получил ответ от Центрального секретаря Коммунистической партии и немедленно телеграфировал об этом. [SOV.getAdjective] Готовность к сотрудничеству на международных сырьевых рынках!\n\nДоставка первых 200 000 тонн сахара может быть немедленно отправлена с еще миллионом скважин на пути к гаваням нашей страны."
 cuba.18.a:0 "Выгодная сделка."
 cuba.19.t:0 "[SOV.GetAdjective] сторона отклоняет наше предложение"
 cuba.19.d:0 "В недавней телеграмме [SOV.getLeader] заявил, что «в их коммунистической утопии и так достаточно сладостей», намекая, что такая сделка не принесёт пользы [SOV.getAdjective] потребительскому обществу. Наш посол отказался цитировать следующую часть ответа генерального секретаря."
 cuba.19.a:0 "Досадно."
 cuba.20.t:0 "[CUB.GetName] захватывает [1050.GetName]"
 cuba.20.d:0 "[CUB.GetAdjective] войска начали дерзкую атаку на военно-морскую базу [1050.GetName], успешно высадились и закрепились на берегу, быстро подавив небольшой гарнизон и затем захватив главную базу.\n\nПозднее на пресс-конференции [CUB.GetAdjective] лидер [CUB.GetLeader] заявил, что [1050.GetName] по праву является частью [CUB.GetNonIdeologyName], и потребовал изгнать всех империалистов с [CUB.GetAdjective] земли. Это очевидный абсурд; вопрос лишь в нашей реакции. Одни призывают к войне против [CUB.GetNonIdeologyName], другие сомневаются, стоит ли терять жизни ради небольшой военно-морской базы."
 cuba.20.a:0 "Мы не позволим так с собой обращаться!"
 cuba.20.b:0 "Нам есть чему поучиться."
 cuba.20.c:0 "Великая победа!"
 cuba.21.t:0 "Победа [1050.Owner.GetName] у [1050.GetName]"
 cuba.21.d:0 "Защитники [1050.GetName] успешно отбили [VEN.GetAdjective] высадку и не позволили создать плацдарм. [CUB.GetAdjective] войска были вынуждены отступить, и военно-морская база прочно осталась в руках [1050.Owner.GetNameDef]."
 cuba.21.a:0 "Это их проучит!"
 cuba.21.b:0 "Катастрофа!"
 cuba.22.t:0 "[CUB.GetAdjective] провокация у [1050.GetName]"
 cuba.22.d:0 "Недавно [CUB.GetNameDef] начала пробные атаки на наши силы в [1050.GetName]. Разведка также сообщает о постепенном сосредоточении её войск поблизости. Похоже, [CUB.GetAdjective] сторона вскоре начнёт полномасштабное наступление."
 cuba.22.a:0 "Мы должны это остановить!"
 cuba.23.t:0 "[CUB.GetNameDefCap] предлагает пакт о ненападении"
 cuba.23.d:0 "[CUB.GetNameDefCap] предложила заключить между нашими странами пакт о ненападении ради мира и сотрудничества в Карибском регионе. [CUB.GetAdjective] лидер [CUB.GetLeader] сослался на личные связи с [ROOT.GetLeader] как на основу дальнейшего сотрудничества."
 cuba.23.a:0 "Для нас [CUB.GetAdjective] Друзья!"
 cuba.23.b:0 "Мы с вами не родня, [CUB.GetLeader]."
 cuba.24.t:0 "[DOM.GetNameDefCap] подписывает пакт"
 cuba.24.d:0 "[DOM.GetNameDefCap] приняла наше предложение о пакте ненападения. [DOM.GetLeader] назвал его важным шагом к сотрудничеству между странами. Карибское взаимодействие кажется вероятнее, чем когда-либо."
 cuba.24.a:0 "Я всегда знал, что [DOM.GetLeader] — наш друг."
 cuba.25.t:0 "[DOM.GetNameDefCap] отказывается"
 cuba.25.d:0 "[DOM.GetNameDefCap] отклонила наше предложение о пакте ненападения. [DOM.GetLeader] заявил, что не видит причин сотрудничать с нами, несмотря на личные связи между лидерами. Карибское взаимодействие кажется менее вероятным, чем когда-либо."
 cuba.25.a:0 "Что они задумали?"
 cuba_election_flag_1936:0 "Президентские выборы состоялись"
 gomez_inaugurated_flag:0 "Мигель Мариано Гомес вступил в должность"
 garcia_menocal_inaugurated_flag:0 "Марио Гарсия Менокаль вступил в должность"
 CUB_results_of_the_presidential_election:0 "Результаты президентских выборов"
 CUB_results_of_the_presidential_election_desc:0 "Результаты выборов объявлены. Новым президентом [CUB.GetNameDef] становится..."
 CUB_victory_for_gomez:0 "Победа Гомеса"
 CUB_the_nine_cent_law:0 "Закон о девяти центах"
 CUB_the_nine_cent_law_desc:0 "Закон о девяти центах вводит налог на каждый мешок сахара весом более 250 фунтов. Полученные средства пойдут на финансирование сельских школ, большинство которых будет находиться под контролем армии."
 CUB_minimum_wage_laws:0 "Законы о минимальной заработной плате"
 CUB_minimum_wage_laws_desc:0 "Принятие законов о минимальной заработной плате поможет повысить качество жизни рабочих, многие из которых сейчас получают крайне мало."
 CUB_taxation_reforms:0 "Налоговые реформы"
 CUB_taxation_reforms_desc:0 ""
 CUB_retirement_pensions:0 "Пенсии по старости"
 CUB_reduce_american_influence:0 "Сократить американское влияние"
 CUB_reduce_american_influence_desc:0 "На протяжении десятилетий Соединённые Штаты обладали значительным влиянием на нашу страну, особенно на экономику и политику. Хотя в прошлом они принесли некоторую пользу, для уважения к нам как к суверенной стране необходимо научиться стоять на собственных ногах и свести иностранное влияние к минимуму."
 CUB_confederation_of_cuban_workers:0 "Легализовать CTC"
 CUB_confederation_of_cuban_workers_desc:0 "[ROOT.GetAdjective] конфедерация трудящихся приобрела значительную популярность после реформ, поддержавших объединение сельскохозяйственных рабочих в профсоюзы. Легализация организации может помочь экономике и обеспечить сильную поддержку на будущих выборах."
 CUB_a_new_constitution:0 "Новая конституция"
 CUB_batista_in_office:0 "Батиста у власти"
 CUB_modernize_medical_care:0 "Модернизировать медицинскую помощь"
 CUB_establish_rural_hospitals:0 "Создать сельские больницы"
 CUB_military_improvements:0 "Улучшить вооружённые силы"
 CUB_military_improvements_desc:0 "Наши вооружённые силы уже долгое время выглядят довольно слабо. Повышение жалования и улучшение питания поднимут боевой дух и побудят больше отважных граждан записаться на службу!"
 CUB_increase_education_funding:0 "Увеличить финансирование образования"
 CUB_establish_soviet_diplomatic_relations:0 "Установить [SOV.GetAdjective] Дипломатические отношения"
 CUB_winning_the_battle_of_the_caribbean:0 "Защитить судоходство в Карибском море"
 CUB_winning_the_battle_of_the_caribbean_desc:0 "Благодаря нашему стратегическому положению в Карибском море и постоянной угрозе подводных лодок для конвоев Союзников военно-морские силы должны быть готовы к продолжающейся опасности, а инфраструктуру необходимо расширить для лучшего обслуживания кораблей."
 CUB_gift_sugar_to_the_british:0 "Подарить сахар британцам"
 CUB_american_air_bases:0 "[USA.GetAdjective] авиабазы"
 CUB_american_air_bases_desc:0 "Мы разрешили [USA.GetNameDef] строить авиабазы в [CUB.GetNameDef] для защиты Карибского моря от вражеских подводных лодок. Разрешение охватывает оба конца острова, а взамен нам передали самолёты для обеспечения безопасности региона."
 CUB_suggest_operation_hemingway:0 "Предложить операцию «Хемингуэй»"
 CUB_suggest_operation_hemingway_desc:0 "Несмотря на показной нейтралитет, которым гордится режим Франко, очевидно, что он поддерживает державы Оси. Мы предложим Лиге Наций объявить войну националистической Испании, считая её членом Оси из-за симпатий к ним."
 CUB_join_the_allies:0 "Вступить в Союзники"
 CUB_join_the_allies_desc:0 "Союзникам нужна наша помощь в защите мирового мира и свободы! Мы должны поддержать демократию перед лицом тирании!"
 CUB_rewrite_the_constitution:0 "Переписать конституцию"
 CUB_rewrite_the_constitution_desc:0 "Конституция 1933 года была составлена военными и для военных. Её необходимо изменить, чтобы она лучше представляла [CUB.GetAdjective] демократию."
 CUB_law_of_sugar_coordination:0 "Закон о координации сахарной отрасли"
 CUB_law_of_sugar_coordination_desc:0 "Закон о координации сахарной отрасли объединит мелкие хозяйства в кооперативы и организует сельскохозяйственных рабочих, гарантирует арендаторам долю урожая и защитит их от лишения обрабатываемых земель."
 CUB_issue_amnesties:0 "Объявить амнистию"
 CUB_issue_amnesties_desc:0 "Амнистия будет предоставлена, в том числе бывшему президенту Херардо Мачадо. Так мы продемонстрируем добрую волю правительства."
 CUB_victory_for_gomez_desc:0 "Мигель Мариано Гомес, бывший мэр Гаваны, был избран президентом Кубы. Связанный с революционерами 1933 года, он пользуется их полной поддержкой в проведении политики, соответствующей курсу стодневного правительства."
 CUB_victory_for_garcia_menocal:0 "Победа Гарсии Менокаля"
 CUB_victory_for_garcia_menocal_desc:0 "Марио Гарсия Менокаль, бывший президент Кубы, в том числе в годы Великой войны, вновь был избран президентом. Представляя консервативную оппозицию революционерам 1933 года, он уже столкнулся с сопротивлением в вооружённых силах."
 CUB_seek_falangist_support:0 "Заручиться поддержкой фалангистов"
 CUB_seek_falangist_support_desc:0 "Президент Менокаль обратился к нам с заманчивым предложением... Теперь, когда он у власти, ему противостоит сильная левая оппозиция, прежде всего Коммунистическая партия. Он понял, что без нашей поддержки далеко не продвинется. Это может стать прекрасной возможностью усилить наше влияние..."
 CUB_exert_influence_over_the_military:0 "Распространить влияние на армию"
 CUB_exert_influence_over_the_military_desc:0 "Теперь, когда мы получили влияние в администрации Менокаля, можно начать распространять его на ключевые для захвата власти области, начиная с армии."
 CUB_repeal_liberal_policies:0 "Отменить либеральные законы"
 CUB_repeal_liberal_policies_desc:0 "Многие меры прежних президентов слишком либеральны для нас. Следует заставить Менокаля отменить часть из них, иначе они будут мешать нашим планам."
 CUB_gather_political_support:0 "Заручиться политической поддержкой"
 CUB_gather_political_support_desc:0 "Поддержка нашего дела в армии растёт. Теперь необходимо получить влияние и поддержку политиков."
 CUB_encourage_anti_communist_violence:0 "Поощрять антикоммунистическое насилие"
 CUB_encourage_anti_communist_violence_desc:0 "Коммунисты — главная угроза нашему образу жизни. Долг каждого патриота — бороться с красным террором, даже если кто-то при этом пострадает!"
 CUB_secure_power:0 "Закрепить власть"
 CUB_secure_power_desc:0 "Наши силы и численность выросли достаточно, чтобы захватить власть и установить полный контроль над армией и правительством!"
 CUB_deal_with_batista:0 "Разобраться с Батистой"
 CUB_deal_with_batista_desc:0 "Фульхенсио Батиста непредсказуем. Он одновременно обладает огромным влиянием в [ROOT.GetAdjective] политике и серьёзно контролирует вооружённые силы. Теперь, когда наш режим пришёл к власти, следует решить, что с ним делать."
 CUB_stabilize_internal_politics:0 "Стабилизировать внутреннюю политику"
 CUB_stabilize_internal_politics_desc:0 "Наш приход к власти вызвал политический и общественный хаос. Пора решить возникшие внутренние проблемы и реорганизовать страну."
 CUB_strengthen_catholic_identity:0 "Укрепить католическую идентичность"
 CUB_strengthen_catholic_identity_desc:0 "Католическая идентичность — один из главных элементов фалангизма. Следует поощрять католицизм и укреплять церковь по всей стране!"
 CUB_encourage_spanish_immigration:0 "Поощрять испанскую иммиграцию"
 CUB_encourage_spanish_immigration_desc:0 "Политика паниспанизма подразумевает открытость к нашим братьям и родственникам в регионе и по всему миру. Поощрение их переселения в нашу страну лишь сделает нас сильнее!"
 CUB_panhispanic_diplomacy:0 "Паниспанская дипломатия"
 CUB_panhispanic_diplomacy_desc:0 "Одним из идеалов фалангистского движения является паниспанизм. Для его воплощения необходимо установить полноценные дипломатические отношения с многочисленными испаноязычными правительствами региона."
 CUB_spanish_civil_war_involvement:0 "Участие в гражданской войне в Испании"
 CUB_spanish_civil_war_involvement_desc:0 "Наши братья в Испании охвачены ужасной гражданской войной. Мы должны оказать им всю возможную помощь!"
 CUB_intervene_ACW:0 "Вмешаться в гражданскую войну в США"
 CUB_intervene_ACW_desc:0 "Соединённые Штаты Америки больше не едины. Появилась новая фракция с идеологией, близкой нашей. Следует отправить войска и помощь, чтобы обеспечить благоприятный исход."
 CUB_subvert_american_influence:0 "Подорвать американское влияние"
 CUB_subvert_american_influence_desc:0 "Соединённые Штаты слишком долго вмешивались в нашу внутреннюю политику и экономику! Ради независимости и силы необходимо ослабить их влияние."
 CUB_nationalize_foreign_sugar_mills:0 "Национализировать иностранные сахарные заводы"
 CUB_nationalize_foreign_sugar_mills_desc:0 "Национализация сахарных заводов, контролируемых иностранными корпорациями, позволит восстановить нашу сахарную промышленность!"
 CUB_deal_with_the_united_fruit_company:0 "Договориться с United Fruit Company"
 CUB_deal_with_the_united_fruit_company_desc:0 "United Fruit Company имеет значительные интересы и влияние в Центральной Америке и проявляет большой интерес к нашей сахарной промышленности. Возможно, удастся заключить взаимовыгодную сделку..."
 CUB_united_fruit_company_coup:0 "Переворот United Fruit Company"
 CUB_united_fruit_company_coup_desc:0 "Заручившись достаточной поддержкой в Гондурасе, мы можем помочь United Fruit Company полностью захватить власть!"
 CUB_a_fruitful_partnership:0 "Плодотворное партнёрство"
 CUB_a_fruitful_partnership_desc:0 "Н/Д"
 CUB_invite_german_companies:0 "Пригласить немецкие компании"
 CUB_command_the_caribbean:0 "Возглавить Карибский регион"
 CUB_command_the_caribbean_desc:0 "Теперь ясно, что нельзя полагаться на руководство иностранных держав, которые могут пренебречь нашими интересами. Необходимо создать собственный союз с более близкими по духу странами..."
 CUB_invite_our_spanish_brothers:0 "Пригласить испанских братьев"
 CUB_invite_our_spanish_brothers_desc:0 "Много веков назад испанские предки колонизировали эту землю. В последние десятилетия мы наконец обрели независимость от Испании и стали уважаемой самостоятельной страной. Теперь, когда гражданская война в Испании завершилась и там установилось новое правительство, пришло время нашим путям вновь пересечься — на этот раз как братьям!"
 CUB_caribbean_dominance:0 "Господство в Карибском море"
 CUB_caribbean_dominance_desc:0 "Н/Д"
 CUB_join_the_reich:0 "Вступить в союз с [GER.GetNameDef]"
 CUB_join_the_reich_desc:0 "Хотя национал-социалисты придерживаются несколько иных идеалов, они обладают большой силой и имеют схожие с нами цели. Союз с ними может помочь в достижении наших задач."
 CUB_join_with_japan:0 "Вступить в союз с Японией"
 CUB_join_with_japan_desc:0 "Хотя японцы не полностью разделяют наши идеалы, это компенсируют их мощный флот и стойкая армия. Япония наверняка приветствует союз с новой державой, растущей прямо на заднем дворе Соединённых Штатов."
 CUB_subjugate_hispaniola:0 "Подчинить Эспаньолу"
 CUB_subjugate_hispaniola_desc:0 "Остров Эспаньола к востоку является естественным продолжением нашей территории. Мы потребуем от незаконных правительств подчиниться, иначе придётся захватить их силой."
 CUB_demand_the_eastern_isles:0 "Потребовать восточные острова"
 CUB_demand_the_eastern_isles_desc:0 "Дальнейшее расширение территории потребует новых требований."
 CUB_demand_jamaica_and_the_bahamas:0 "Потребовать Ямайку и Багамы"
 CUB_demand_jamaica_and_the_bahamas_desc:0 "Дальнейшее расширение территории потребует новых требований."
 CUB_lay_claim_to_curacao_and_trinidad:0 "Предъявить права на Кюрасао и Тринидад"
 CUB_lay_claim_to_curacao_and_trinidad_desc:0 "Последние острова Карибского моря, остающиеся в чужих руках, должны быть переданы нам как законная территория, которую мы обязаны защищать."
 CUB_seize_venezuela:0 "Захватить Венесуэлу"
 CUB_seize_venezuela_desc:0 "Наша военная мощь и региональное влияние достигли впечатляющего уровня! Внутренняя нестабильность Венесуэлы может позволить запугать её слабое правительство и заставить объединиться с нами."
 CUB_threaten_colombia:0 "Угрожать Колумбии"
 CUB_threaten_colombia_desc:0 "Колумбия играет решающую роль в планах создания Великого Карибского государства. Теперь, когда у нас общая сухопутная граница, можно предъявить ей ультиматум, как Венесуэле, и заставить признать наше правительство единственной законной властью!"
 CUB_expand_ufc_influence:0 "Расширить влияние UFC"
 CUB_seize_control_in_guatemala:0 "Захватить власть в Гватемале"
 CUB_overthrow_the_salvadorian_government:0 "Свергнуть правительство Сальвадора"
 CUB_our_holdings_in_panama:0 "Наши владения в Панаме"
 CUB_takeover_in_nicaragua:0 "Переворот в Никарагуа"
 CUB_take_control_of_costa_rica:0 "Взять под контроль Коста-Рику"
 CUB_corporate_incorporation:0 "Корпоративная интеграция"
 CUB_stage_a_conflict_at_the_canal:0 "Спровоцировать конфликт у канала"
 CUB_entrust_central_america_to_the_ufc:0 "Доверить Центральную Америку UFC"
 CUB_negotiate_for_belize:0 "Провести переговоры о Белизе"
 CUB_legitimize_zemurrays_government:0 "Легитимизировать правительство Земуррея"
 CUB_amphibious_invasion_preparation:0 "Подготовка к морскому вторжению"
 CUB_amphibious_invasion_preparation_desc:0 "Мы — островная страна, окружённая множеством островов и прибрежных регионов, поэтому должны быть хорошо подготовлены к морским десантным операциям."
 CUB_special_amphibious_training:0 "Специальная подготовка к морским десантам"
 CUB_special_amphibious_training_desc:0 "Строгая специальная программа подготовки к морским операциям обеспечит войскам навыки, необходимые в самых разных условиях на воде."
 CUB_falangist_ideas_in_schools:0 "Фалангистские идеи в школах"
 CUB_falangist_ideas_in_schools_desc:0 "Преподавание наших ценностей в школах поможет обеспечить верность молодёжи!"
 CUB_devotion_to_falangism:0 "Преданность фалангизму"
 CUB_devotion_to_falangism_desc:0 "Н/Д"
 CUB_the_caribbean_guard:0 "Карибская гвардия"
 CUB_the_caribbean_guard_desc:0 "Теперь наше влияние и территории охватывают весь Карибский регион. Необходимо создать специальную гвардию для защиты островов!"
 CUB_army_expansion:0 "Расширение армии"
 CUB_army_expansion_desc:0 "Для достижения целей необходимо увеличить численность армии."
 CUB_island_fortification_project:0 "Проект укрепления островов"
 CUB_island_fortification_project_desc:0 "При таком количестве новых территорий потребуется масштабная программа укреплений, чтобы обеспечить их безопасность."
 CUB_island_development_plan:0 "План развития островов"
 CUB_island_development_plan_desc:0 "Теперь, когда мы контролируем законные карибские территории, необходимо развивать острова для поддержки постоянно растущей промышленности!"
 CUB_develop_the_bahamas_and_jamaica:0 "Развивать Ямайку и Багамы"
 CUB_develop_the_bahamas_and_jamaica_desc:0 "Разумные инвестиции в Ямайку и Багамы позволят увеличить промышленный потенциал."
 CUB_develop_the_eastern_isles:0 "Развивать восточные острова"
 CUB_develop_the_eastern_isles_desc:0 "Инвестиции в Антильские острова помогут расширить промышленность и улучшить недавно приобретённые территории."
 CUB_developing_curacao_and_trinidad:0 "Развивать Кюрасао и Тринидад"
 CUB_developing_curacao_and_trinidad_desc:0 "Кюрасао и Тринидад, наши самые недавние приобретения, выиграют от новых промышленных вложений."
 CUB_venezuelan_development:0 "Развитие Венесуэлы"
 CUB_begin_colombian_industrial_development:0 "Начать промышленное развитие Колумбии"
 CUB_expand_colombian_coffee_plantations:0 "Расширить кофейные плантации Колумбии"
 CUB_upgrade_venezuelan_oil_facilities:0 "Модернизировать нефтяную инфраструктуру Венесуэлы"
 cuba.11.t:0 "[CUB.GetNameDef] требует наши территории"
 cuba.11.d:0 "Теперь, когда [ROOT.GetAdjective] фалангистское движение захватило власть, оно приступило к расширению территории, намереваясь включить в неё весь остров Эспаньола.\n\nВ рамках этого курса наше правительство получило требование подчиниться и войти в состав Кубы. Как мы ответим?"
 cuba.10.d:0 "Куба, некогда наша ценная колония в Карибском море, обратилась с неожиданным предложением. Она предлагает заключить официальный союз между странами, надеясь укрепить наши связи.\n\nХотя это несколько неожиданно, идея заслуживает рассмотрения и может вернуть нам влияние в Америках."
 cuba.12.t:0 "Националистическая Испания принимает наше предложение!"
 cuba.12.d:0 "Испания приняла наше недавнее предложение о союзе!"
 cuba.13.t:0 "Испания отклоняет наше предложение!"
 cuba.13.d:0 "К удивлению многих, испанское правительство решило отклонить наше предложение об официальном союзе."
 CUB_oppose_the_presidency:0 "Выступить против президента"
 CUB_oppose_the_presidency_desc:0 "Новая администрация президента Менокаля прямо противоречит нашим убеждениям. Открытое противодействие — единственная надежда не только выжить, но и привести наше дело к победе!"
 CUB_seek_communist_support_desc:0 "Президент Менокаль был вынужден опереться на нашу поддержку, чтобы победить на выборах. Теперь мы можем использовать это для продвижения собственных целей и тайной подготовки настоящей революции!"
 CUB_galvanize_the_ctc:0 "Мобилизовать CTC"
 CUB_galvanize_the_ctc_desc:0 "Мобилизация [ROOT.GetAdjective] рабочего движения через Конфедерацию [ROOT.GetAdjective] трудящихся поможет получить необходимую поддержку против нынешней администрации. Поддержка CTC также позволит установить контроль над национальной промышленностью."
 CUB_seek_soviet_support:0 "Заручиться поддержкой СССР"
 CUB_hold_ctc_rallies:0 "Проводить митинги CTC"
 CUB_hold_ctc_rallies_desc:0 "Крупные митинги CTC позволят показать народу наши идеи и значительно повысить общественную поддержку!"
 CUB_ctc_recruitment:0 "Набор в CTC"
 CUB_unionize_the_sugar_mills:0 "Объединить рабочих сахарных заводов в профсоюзы"
 CUB_unionize_the_sugar_mills_desc:0 "Создание сильных профсоюзов на сахарных заводах поможет заручиться дополнительной поддержкой и показать рабочим, что мы защищаем их интересы."
 CUB_form_an_alliance_with_batista:0 "Заключить союз с Батистой"
 CUB_form_an_alliance_with_batista_desc:0 "Хотя Батиста непредсказуем, он готов сотрудничать с нами в социальных реформах, если сохранит власть. Однако заключив эту сделку, мы надолго окажемся связаны с ним."
 CUB_overthrow_the_menocal_government:0 "Свергнуть правительство Менокаля"
 CUB_overthrow_the_menocal_government_desc:0 "Правительство Менокаля ослабло и больше не способно остановить наше движение. Пора захватить власть, свергнуть старое правительство и установить своё! ¡Viva la revolución!"
 CUB_reaffirm_comintern_ties:0 "Подтвердить связи с Коминтерном"
 CUB_establish_the_dgi:0 "Создать DGI"
 CUB_state_visit_to_the_soviet_union:0 "Государственный визит в Советский Союз"
 CUB_radio_mil_diez:0 "Радио Mil Diez"
 CUB_radio_mil_diez_desc:0 "После прихода к власти мы получили одну из крупнейших радиостанций острова. Отсюда можно не только распространять идеи нашего дела, но и познакомить остров с разновидностью [ROOT.GetAdjective] джаза, обогащая культуру!"
 CUB_imprison_batista:0 "Заключить Батисту в тюрьму"
 CUB_continued_collaboration_with_batista:0 "Продолжить сотрудничество с Батистой"
 CUB_purge_the_falangists:0 "Провести чистку фалангистов"
 CUB_purge_the_falangists_desc:0 "Хотя мы прочно удерживаем власть, всё ещё остаются небольшие группы фалангистов, угрожающие нашему образу жизни и новому правительству. С ними необходимо расправиться быстро и тихо!"
 CUB_recruit_civilian_informants:0 "Вербовать гражданских информаторов"
 CUB_soviet_military_advisors:0 "Советские военные советники"
 CUB_soviet_tank_factories:0 "Советские танковые заводы"
 CUB_study_soviet_tactics:0 "Изучить советскую тактику"
 CUB_create_a_central_committee:0 "Создать Центральный комитет"
 CUB_diplomacy_with_the_prc:0 "Дипломатия с КНР"
 CUB_the_cuban_politburo:0 "[ROOT.GetAdjective] Политбюро"
 CUB_education_for_the_masses:0 "Образование для масс"
 CUB_adapt_the_five_year_plan:0 "Адаптировать пятилетний план"
 CUB_collectivize_the_sugar_plantations:0 "Коллективизировать сахарные плантации"
 CUB_seize_foreign_sugar_mills:0 "Захватить иностранные сахарные заводы"
 CUB_rural_industrialization:0 "Индустриализация сельской местности"
 CUB_new_rural_roads:0 "Новые сельские дороги"
 CUB_expand_the_plantations:0 "Расширить плантации"
 CUB_industrialize_the_islands:0 "Индустриализировать острова"
 CUB_sugar_for_oil:0 "Сахар в обмен на нефть"
 CUB_sugar_for_oil_desc:0 "У наших советских товарищей есть большие запасы нефти, которые принесут нам огромную пользу, а у нас имеется избыток сахара, который пригодится Советам. Возможно, удастся заключить взаимовыгодное торговое соглашение?"
