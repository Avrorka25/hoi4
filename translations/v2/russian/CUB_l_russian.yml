 r56_is_caribbean_country:0 "Является карибской страной"
 cuba.100.d:0 "Херардо Мачадо, бывший президент Кубы в 1925–1933 годах, скончался в Майами-Бич, штат Флорида, в возрасте 69 лет во время операции, призванной отсрочить его смерть от рака.\n \nПравление Мачадо было в лучшем случае катастрофическим. Большинство считало его диктатором: он отказывался покидать пост, цеплялся за власть и несколько лет подавлял повстанческие группы.\n \nДаже после вмешательства правительства США, пытавшегося договориться о мирной смене режима, Мачадо продолжал сопротивляться, пока [ROOT.GetAdjective] армия не подняла мятеж и не вынудила его бежать из страны."
 cuba.101.t:0 "Прибытие MS St. Louis в Гавану"
 cuba.101.d:0 "Сегодня в гавань Гаваны прибыл немецкий пассажирский лайнер MS St. Louis с 973 пассажирами, многие из которых — беженцы, ищущие на Кубе убежище от нацистского режима Германии.\n\nЕсли сейчас отказать им, мы можем вынудить их вернуться в Германию навстречу неминуемой гибели.\n\nЧто нам делать?"
