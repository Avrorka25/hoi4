 CUB_military_coup:0 "Военный переворот"
 CUB_military_coup_desc:0 "Фульхенсио Батиста поддержал Гомеса на выборах, зная, что тот слабый лидер. План заключался в создании кризиса с импичментом, чтобы отстранить Гомеса в пользу вице-президента Федерико Бру, согласившегося сотрудничать с Батистой. Однако позднее Бру отказался от решения, вынудив нас прибегнуть к более радикальным мерам."
 CUB_reassure_the_population:0 "Успокоить население"
 CUB_reassure_the_population_desc:0 "Военный переворот серьёзно дестабилизировал страну и встревожил население, опасающееся нового режима в стиле Мачадо. Мы должны убедить людей, что по-прежнему действуем в их интересах."
 CUB_ensure_military_loyalty:0 "Обеспечить верность армии"
 CUB_ensure_military_loyalty_desc:0 "Сильное влияние Батисты на армию и политическое положение Кубы уже было необходимо для переворота. Однако среди военных остаются сомнения, которые нужно устранить ради полной верности."
 CUB_government_reshuffle:0 "Перестановки в правительстве"
 CUB_government_reshuffle_desc:0 "Поскольку мы пришли к власти через переворот, многие чиновники всё ещё преданы прежней администрации. Следует перевести их на менее влиятельные должности, а власть отдать более верным нам людям."
 CUB_reach_out_to_trujillo:0 "Обратиться к Трухильо"
 CUB_reach_out_to_trujillo_desc:0 "Рафаэль Трухильо — давний друг Батисты и теперь, когда тот у власти, может быть открыт к различным дипломатическим переговорам."
 CUB_invite_american_corporations:0 "Пригласить американские корпорации"
 CUB_invite_american_corporations_desc:0 "Открытое приглашение американских корпораций инвестировать в экономику может открыть перед страной множество возможностей."
 CUB_american_sugar_investments:0 "Американские инвестиции в сахарную отрасль"
 CUB_american_sugar_investments_desc:0 "Многие американские корпорации с радостью вложатся в нашу огромную сахарную промышленность. Несколько удачных инвестиций значительно укрепят экономику."
 CUB_deal_with_the_mafia:0 "Договориться с мафией"
 CUB_deal_with_the_mafia_desc:0 "Американская мафия — могущественная и крайне влиятельная организация. Хотя она коррумпирована и опасна, её значительные финансовые ресурсы могут помочь укрепить экономику."
 CUB_invite_meyer_lansky:0 "Пригласить Мейера Лански"
 CUB_invite_meyer_lansky_desc:0 "Мейер Лански, «бухгалтер мафии», обладает большим влиянием как в еврейской, так и в итальянской мафии. Он уже заметно влияет на Кубу, но мы можем заключить новые взаимовыгодные сделки..."
 CUB_implement_a_new_constitution:0 "Принять новую конституцию"
 CUB_implement_a_new_constitution_desc:0 "Старая конституция оказалась слабым документом, раз за разом подводившим народ. Нам нужна новая конституция для современности, учитывающая ошибки прошлого. Не помешает и добавить несколько лазеек для укрепления нашей власти."
