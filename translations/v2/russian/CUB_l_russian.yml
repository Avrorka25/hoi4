 CUB_batistas_influence:0 "Влияние Батисты"
 CUB_batistas_influence_desc:0 "Фульхенсио Батиста, так называемый «сильный человек Кубы», влияет на нашу политику со времён Восстания сержантов, которое привело его к власти. Стремление к власти и контролю вызвало множество внутренних проблем и, вероятно, будет продолжать вызывать их, пока он не добьётся своего или с ним наконец не разберутся."
