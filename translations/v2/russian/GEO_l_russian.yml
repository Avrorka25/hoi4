 GEO_event.1.t:0 "Добровольцы хотят домой!"
 GEO_event.1.desc:0 "Добровольческие части были сформированы для борьбы с [SOV.GetName] и освобождения Грузии. После поражения [SOV.GetAdjective] государства они считают свою миссию выполненной и хотят вернуться домой."
