l_russian:
 fate_of_georgia_category:0 "Судьба Грузии"
 fate_of_georgia_category_desc:0 "Грузия, древнее царство с богатой историей, уходящей в Средневековье, ненадолго освободилась от российского ига после Великой войны. С приходом большевиков установилась другая форма российского господства. Опираясь на добровольцев внутри страны и представителей старой элиты в изгнании, мы могли бы восстановить свободу земли Тамары."
 GEO_liberators:0 "Освободитель Грузии"
 GEO_form_georgian_national_council:0 "Сформировать Грузинский национальный совет"
