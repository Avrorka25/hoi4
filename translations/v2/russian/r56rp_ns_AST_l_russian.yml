l_russian:
 AST_r56rp_the_kings_exile:0 "Изгнание королей"
 AST_r56rp_the_kings_exile_desc:0 "С приходом коммунистов в Британию король бежал сюда в поисках безопасности."
 AST_r56rp_invite_british_upper_class:0 "Приглашаем представителей британского высшего класса"
 AST_r56rp_invite_british_upper_class_desc:0 "С приходом коммунистов к власти в Британии верхушка бежала. Мы должны предложить им более безопасное место."
 AST_r56rp_invite_commonwealth_intellectuals:0 "Пригласите интеллектуалов Содружества"
 AST_r56rp_invite_commonwealth_intellectuals_desc:0 "Мы должны приглашать людей со всего содружества к расширению идей!"
 AST_r56rp_invite_british_upper_politicians:0 "Пригласите политиков"
 AST_r56rp_invite_british_upper_politicians_desc:0 "Мы должны пригласить элиту высшего класса из Великобритании, которая избежала кровопролития! Идея добавить их в правительство - это еще один вопрос."
 AST_r56rp_invite_british_upper_class_generals:0 "Пригласите генералов"
 AST_r56rp_invite_british_upper_class_generals_desc:0 "Мы должны найти останки генералов высшего класса. У большинства из них были хорошие планы."
 AST_r56rp_boost_troops_morale:0 "Мораль солдата"
 AST_r56rp_boost_troops_morale_desc:0 "После инцидента в Галлиполи мы должны подготовить наши войска к очередному военно-морскому вторжению на чужую землю!"
 AST_r56rp_plan_for_the_retaking:0 "План нашего возвращения"
 AST_r56rp_plan_for_the_retaking_desc:0 "Мы должны планировать возвращение наших островов. Огромная коммунистическая угроза должна быть уничтожена!"
 AST_r56rp_gather_sympatheizers_for_the_cause:0 "Соберите сочувствующих для причины"
 AST_r56rp_gather_sympatheizers_for_the_cause_desc:0 "Мы должны собрать сочувствующих со всего мира и из Великобритании, чтобы бороться за то, чтобы мы вернули то, что принадлежит нам."
 AST_r56rp_destory_the_pretenders:0 "Похитители The Pretenders"
 AST_r56rp_destory_the_pretenders_desc:0 "Мы должны уничтожить фальшивое коммунистическое правительство, претендующее на роль Британии. Они не больше Британия, чем Ирландия!"
 AST_r56rp_claim_what_is_ours:0 "Утверждаем, что наше!"
 AST_r56rp_claim_what_is_ours_desc:0 "С королем, ответственным за нацию, у нас есть сильные претензии на Британию. Мы должны использовать это в своих интересах."
 AST_r56rp_return_of_the_king:0 "Возвращение короля"
 AST_r56rp_return_of_the_king_desc:0 "Мы вернулись на родные острова! Пришло время снова короновать короля как короля Англии, Шотландии, Уэльса и Северной Ирландии!"
 AST_r56rp_invite_british_upper_class_industrialist:0 "Приглашаем промышленников"
 AST_r56rp_invite_british_upper_class_industrialist_desc:0 "Мы должны предложить промышленникам высшего класса место в Австралии. Их идеи должны пригодиться."
 AST_r56rp_open_the_market:0 "Откройте рынок"
 AST_r56rp_open_the_market_desc:0 "Будучи окруженными странами с таким количеством ресурсов, мы должны воспользоваться этим и открыть наши рынки для большей торговли."
 AST_r56rp_allow_refugees_and_foreign_workers:0 "Разрешить беженцам и иностранным рабочим"
 AST_r56rp_allow_refugees_and_foreign_workers_desc:0 "Будучи так близко к Азии, мы должны открыться для большего числа рабочих в этой стране, чтобы управлять производственной линией."
 AST_r56rp_destory_socialist_reforms:0 "Предыстория социалистических реформ"
 AST_r56rp_destory_socialist_reforms_desc:0 "Мы должны уничтожить идеи социализма, захватившего Британию. Теперь мы знаем, что происходит, когда вы пытаетесь уступить профсоюзам!"
 AST_r56rp_expand_arms_manufacturing:0 "Расширить производство оружия"
 AST_r56rp_expand_arms_manufacturing_desc:0 "Мы должны расширить наш сектор производства оружия, если мы сможем противостоять более экстраординарным державам."
 AST_r56rp_austarlians_only:0 "Только австралийцы"
 AST_r56rp_austarlians_only_desc:0 "Это Австралия, а не Великобритания. Мы не должны позволять этим новоприбывшим диктовать нам политику!"
 AST_r56rp_allowed_to_serve:0 "Разрешено служить"
 AST_r56rp_allowed_to_serve_desc:0 "Мы должны позволить этому господину служить в правительстве. Их идеи могут быть плодотворными в будущем."
 AST_r56rp_encourage_austarlian_intellectuals:0 "Поощрение австралийских интеллектуалов"
 AST_r56rp_encourage_austarlian_intellectuals_desc:0 "Мы должны поощрять и продвигать лучшие и самые яркие технологии Австралии, чтобы увеличить наши технологии."
 AST_r56rp_royalist_education:0 "Роялистское образование"
 AST_r56rp_royalist_education_desc:0 "Мы должны повышать наши образовательные стандарты, обучая их идеям элиты!"
 AST_r56rp_request_new_zealand:0 "Запросить Новая Зеландия"
 AST_r56rp_request_new_zealand_desc:0 "У Новой Зеландии и Австралии много общего. Мы должны попросить их присоединиться к нам на благо империи!"
 AST_r56rp_purge_opposition:0 "Провести чистку оппозиции"
 AST_r56rp_purge_opposition_desc:0 "Избавьтесь от неверующих в правительстве. Мы не должны допускать никаких шансов на переворот."
 AST_r56rp_southern_bastion:0 "Южный бастион"
 AST_r56rp_southern_bastion_desc:0 "Мы должны стремиться стать южным бастионом Британской империи! Мы должны быть более сильными, чтобы взять на себя мантию Юга, как мы сейчас стоим."
 AST_r56rp_purchase_shield_islands:0 "Купить Щитовые острова"
 AST_r56rp_purchase_shield_islands_desc:0 "Мы должны защищать наш северный фланг любыми средствами, мы постараемся приобрести острова-щиты, как они называются."
 AST_r56rp_develop_shield_islands:0 "Развивайте Щитовые острова"
 AST_r56rp_develop_shield_islands_desc:0 "Развитие наших новых островов было бы отличным способом сделать нашу покупку стоящей."
 AST_r56rp_develop_oil_in_malaya:0 "Малайская нефть"
 AST_r56rp_develop_oil_in_malaya_desc:0 "Поскольку нефть найдена в Малайе, мы должны искать больше нефти в регионе."
 AST_r56rp_southern_bastion_realized:0 "Южный бастион реализовывался"
 AST_r56rp_southern_bastion_realized_desc:0 "Мы — Южный бастион Британской империи, Драгоценность Юга!"
 AST_r56rp_increase_trade_with_commonwealth:0 "Увеличение торговли с Содружеством"
 AST_r56rp_increase_trade_with_commonwealth_desc:0 "Мы должны увеличить нашу торговлю с Соединенным Королевством, чтобы устранить депрессию."
 AST_r56rp_research_better_equipment:0 "Исследование лучшего оборудования"
 AST_r56rp_research_better_equipment_desc:0 "Мы должны исследовать лучшее оборудование, чтобы быть более ценным для торговли."
 AST_r56rp_exploit_finds:0 "Эксплуатация находит"
 AST_r56rp_exploit_finds_desc:0 "Мы должны использовать новые находки, которые мы получаем от нашего лучшего оборудования, даже если это будет стоить нашим заводам."
 AST_r56rp_open_new_mines:0 "Открытие новых рудников"
 AST_r56rp_open_new_mines_desc:0 "С этими новыми находками мы должны открыть новые шахты в новых областях, которые, как мы знаем, имеют потенциал."
 AST_r56rp_exploit_new_mines:0 "Эксплуатировать новые шахты"
 AST_r56rp_exploit_new_mines_desc:0 "С открытием новых рудников мы должны копать глубже, чтобы использовать их в полной мере."
 AST_r56rp_exports_to_the_empire:0 "Экспорт в империю"
 AST_r56rp_exports_to_the_empire_desc:0 "Мы должны отказаться от заводов, чтобы работать над добычей новых и уже открытых ресурсов в полном объеме."
 AST_r56rp_increase_reliance_on_trade:0 "Повышение зависимости от торговли"
 AST_r56rp_increase_reliance_on_trade_desc:0 "Мы должны расширяться вместе с империей, чтобы продолжать бороться с депрессией."
 AST_r56rp_full_reliance_on_trade:0 "Полная зависимость от торговли"
 AST_r56rp_full_reliance_on_trade_desc:0 "Мы должны полностью полагаться на торговлю с Содружеством. Они не должны нас подводить!"
 AST_r56rp_the_freer_the_market_freer_the_economy:0 "Чем свободнее рынок, тем свободнее экономика"
 AST_r56rp_the_freer_the_market_freer_the_economy_desc:0 "Свободный рынок — это будущее, и мы будем полностью полагаться на него, чтобы собрать наши ресурсы!"
 AST_r56rp_investors_from_new_markets:0 "Инвесторы с новых рынков"
 AST_r56rp_investors_from_new_markets_desc:0 "С появлением новых инвестиционных возможностей новые покупатели войдут в экономику, и мы должны поощрять их к покупке."
 AST_r56rp_secure_trade_routes:0 "Безопасные торговые пути"
 AST_r56rp_secure_trade_routes_desc:0 "Находясь так далеко от Великобритании, мы должны обеспечить, чтобы наши конвои могли легче добраться до них, не затонув."
 AST_r56rp_moderate_policies:0 "Умеренная политика"
 AST_r56rp_moderate_policies_desc:0 "Мы должны свернуть нашу радикальную политику и встретиться посередине."
 AST_r56p_ideas_of_a_southern_empire:0 "Идеи Южной империи"
 AST_r56p_ideas_of_a_southern_empire_desc:0 "Южная Империя звучит как хорошая идея. Может быть, мы наконец-то сможем выйти из того положения, в котором находимся сейчас."
 AST_r56rp_approve_the_idea:0 "Утвердить идею"
 AST_r56rp_approve_the_idea_desc:0 "Это звучит как идеальный вариант для австралийцев, и мы постараемся удовлетворить их потребности!"
 AST_r56rp_start_of_new_empire:0 "Начало новой империи"
 AST_r56rp_start_of_new_empire_desc:0 "Сегодня мы – новая империя. Мы — южная империя, стремящаяся продемонстрировать свою мощь в регионе."
 AST_r56rp_claim_the_indies:0 "Утверждать Индию"
 AST_r56rp_claim_the_indies_desc:0 "Мы должны требовать от Индии новую империю за то, что она так близка нам и богата ресурсами!"
 AST_r56rp_claim_the_raj:0 "Заявить Радж"
 AST_r56rp_claim_the_raj_desc:0 "Мы должны претендовать на коронную жемчужину Британской империи."
 AST_r56rp_claim_indochina:0 "Иск Индокитая"
 AST_r56rp_claim_indochina_desc:0 "Мы должны заявить о себе Индокитай. Близость к Китаю позволяет нам получить доступ к китайским рынкам для прямой торговли нашими товарами."
 AST_r56rp_a_content_empire:0 "Империя контента"
 AST_r56rp_a_content_empire_desc:0 "Мы получили много новых земель, и с этой землей мы теперь будем поселяться как настоящая империя юга."
 AST_r56rp_second_scramble_for_africa:0 "Вторая битва за Африку"
 AST_r56rp_second_scramble_for_africa_desc:0 "Мы должны взять африканское побережье, чтобы доминировать в Индийском океане."
 AST_r56rp_imperial_managment:0 "Имперское управление"
 AST_r56rp_imperial_managment_desc:0 "С новой землей, необходимой нам, мы должны начать управлять ими, чтобы закрепить нашу власть над ними."
 AST_r56rp_develop_new_territories:0 "Развитие новых территорий"
 AST_r56rp_develop_new_territories_desc:0 "Мы должны развивать эти новые территории, чтобы улучшить нашу экономику и соответствовать нашему статусу."
 AST_r56rp_purchase_the_philippines:0 "Купить Филиппины"
 AST_r56rp_purchase_the_philippines_desc:0 "Мы должны попытаться убедить Америку отдать нам эти территории за определенную цену."
 AST_r56rp_proclaim_new_emperor:0 "Провозгласить нового императора"
 AST_r56rp_proclaim_new_emperor_desc:0 "Теперь, будучи по-настоящему империей, мы должны провозгласить нового императора юга."
 AST_R56_the_true_southern_bastion:0 "Истинный Южный Бастион"
 AST_R56_commonwealth_trade_0:0 "Торговля Содружеством"
 AST_R56_commonwealth_trade_1:0 "Эксплуатация находок"
 AST_R56_commonwealth_trade_2:0 "Экспорт в Империю!"
 AST_R56_commonwealth_trade_3:0 "Повышение надежности"
 AST_R56_commonwealth_trade_4:0 "Полная уверенность"
 AST_R56_commonwealth_trade_5:0 "Свободные рынки"
 AST_R56_commonwealth_trade_6:0 "Умеренная политика"
 AST_R56_secure_trade:0 "Охраняемые конвои"
 AST_R56_encourage_austarlian_intellectuals:0 "Австралийские интеллектуалы"
 AST_R56_invite_commonwealth_intellectuals:0 "Интеллектуалы Содружества"
 AST_R56_australians_only:0 "Только австралийцы"
 AST_R56_industrial_revolution_idea_1:0 "Промышленное начало"
 AST_R56_industrial_revolution_idea_1a:0 "Промышленное начало"
 AST_R56_industrial_revolution_idea_1b:0 "Промышленное начало"
 AST_R56_industrial_revolution_idea_2:0 "Промышленный бум"
 AST_R56_industrial_revolution_idea_3:0 "Промышленное отмена"
 AST_prepare_for_british_invasion_0:0 "Готовьтесь к вторжению"
 AST_prepare_for_british_invasion_1a:0 "Готовьтесь к вторжению"
 AST_prepare_for_british_invasion_1b:0 "Готовьтесь к вторжению"
 AST_prepare_for_british_invasion_1c:0 "Готовьтесь к вторжению"
 AST_r56rp_new_emperor:0 "Новый император"
 AST_r56rp_the_kings_left_hand_man:0 "Король левой руки человек"
 AST_r56rp_shield_islands_payments:0 "Платежи острова Щит"
 AST_r56rp_shield_islands_payment_1:0 "Платежи острова Щит"
 r56rp_ast.33.t:0 "Вопрос короля"
 r56rp_ast.33.d:0 "Кто должен руководить нашей страной в это время нужды? Король Эдуард или король Георг?"
 r56rp_ast.33.a:0 "Король Эдвард!"
 r56rp_ast.33.b:0 "Король Джордж!"
 r56rp_ast.34.t:0 "Запрос на покупку островов Щит"
 r56rp_ast.34.d:0 "Австралийское правительство просит купить у нас самые южные острова за определенную цену."
 r56rp_ast.34.a:0 "Мы отдадим их за правильную цену."
 r56rp_ast.34.b:0 "Нет, эти территории слишком важны!"
 r56rp_ast.35.t:0 "Покупка Филиппин"
 r56rp_ast.35.d:0 "Эй, человек, ищущий внутри Кода Событий Я вижу тебя, Фокус - это Ай, только если ты видишь этот Ик, ты ищешь его Это нормально Это дерево было сделано канадским Гусом для дороги до 56 rp (не сбрасывающий материал То), если дерево украдено, и никто не проверяет локализацию я буду знать"
 r56rp_ast.35.a:0 "Дорога в 56 rp Превосходство"
 r56rp_ast.35.b:0 "Воруя дерево, я вижу такую боль."
 r56rp_ast.36.t:0 "Филлиппины соглашаются"
 r56rp_ast.36.d:0 "Филиппины приняли нашу «покупку» своей страны для более значительного расширения этой нации. Мы объявляем это крупной победой и будем продолжать продвигаться вперед с нашими планами внутри империи»."
 r56rp_ast.36.a:0 "Большой успех для империи!"
 r56rp_ast.37.t:0 "Филиппины упали"
 r56rp_ast.37.d:0 "Филиппины отказались присоединиться к нашей великой империи. Что нам делать с таким поступком, чтобы бросить вызов империи!"
 r56rp_ast.37.a:0 "Мы должны объявить войну"
 r56rp_ast.37.b:0 "Не беспокойтесь о таких вещах"
 r56rp_ast.38.t:0 "Покупка удачная!"
 r56rp_ast.38.d:0 "Они согласились продать нам свои активы по цене. Мы вернёмся от этой выплаты достаточно скоро, но земля, которую мы приобрели, представляет большой стратегический интерес."
 r56rp_ast.38.a:0 "Время платить"
 r56rp_ast.39.t:0 "Покупка снизилась"
 r56rp_ast.39.d:0 "Они отказались позволить нам купить острова, это потеря для них."
 r56rp_ast.39.a:0 "Незначительные неудачи"
