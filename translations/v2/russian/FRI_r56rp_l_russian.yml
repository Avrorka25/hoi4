 FRI_r56rp_rough_terrain_warfare_experts_tech:0 "Грубая война на суше Эксперты"
 FRI_r56rp_rough_terrain_warfare_experts_tech_tt:0 "Позволяет §HГрубая война на суше Эксперты§!\n§HПехота джунглей§!\n    Мягкая атака: §G+10%§!\n    Защита: §G+10%§!\n    §Hлес§!:\n        Атака: §G+10%§!\n        Защита: §G+10%§!\n        Движение: §G+10%§!\n    §HДжунгли§!:\n        Атака: §G+10%§!\n        Защита: §G+10%§!\n        Движение: §G+10%§!§!"
 FRI_r56rp_jungle_moto_tt:0 "Позволяет §HМобильная война джунглей§!\n§Hмоторизованный\n    Джунгли§!\n      Атака: §G+5%§!\n      Движение: §G+10%§!\n§Hмеханизированный\n    Джунгли§!\n      Атака: §G+5%§!\n      Движение: §G+10%§!\n§HЛегкая броня\n  Джунгли§!\n      Атака: §G+5%§!\n      Движение: §G+10%§!\n"
 r56rp_news.1.t:0 "Инцидент в Паксе"
 r56rp_news.1.d:0 "После рейда в г. [FRI.GetAdjective] пограничная деревня Паксе, в которой погибли несколько гражданских лиц, [FRI.GetAdjective] Теперь он требует, чтобы [SIA.GetAdjective] Подчинить правителю двух пограничных штатов Исана и Ланны [FRI.GetAdjective]. Однако, [SIA.GetAdjective] Остается твердым, что они только вытесняли войска, исходящие из [FRI.GetAdjective] Они не отдадут свою землю колониальной державе.\n\nНапряженность в настоящее время растет вдоль границы между обеими странами, и очень вероятно, что между ними разразится война."
 r56rp_news.1.a:0 "Границы могут быть перекрашены в ближайшее время"
 r56rp_news.1.b:0 "Очень хорошо, мы захватим все это"
 r56rp_news.1.c:0 "Мы вытесним французов с этого полуострова."
 FRI_r56rp.1.t:0 "[FROM.GetAdjective] Войска вторгаются на нашу землю"
 FRI_r56rp.1.d:0 "С момента реорганизации [FROM.GetNameDef] Они становятся все более враждебными по отношению к нам, проявляя свои истинные колониальные корни. Теперь, когда поступили сообщения о том, что их войска пересекли границу в Исане, мы уже направили подразделение для отражения их действий."
 FRI_r56rp.1.a:0 "Проклятые французы!"
 FRI_r56rp.2.t:0 "Успех в Isan"
 FRI_r56rp.2.d:0 "Перед боем нашим войскам в Исане удалось занять тактически превосходящее положение, позволив нашим войскам засадить противника. Руководитель написал довольно подробный отчет о действиях, который следует изучить и посмотреть, что мы можем узнать из него."
 FRI_r56rp.2.a:0 "Как и ожидалось!"
 FRI_r56rp.3.t:0 "Поражение в Исане"
 FRI_r56rp.3.d:0 "Получается, что вражеские войска успели занять перед нашим боем превосходящие позиции и наши войска были отбиты. Нам нужно будет изучить отчет о последующих действиях и посмотреть, что мы можем улучшить до реального участия."
 FRI_r56rp.3.a:0 "Интересный..."
 FRI_r56rp.4.t:0 "Инцидент в Паксе"
 FRI_r56rp.4.d:0 "После еще одного [FROM.GetAdjective] Пытаясь вторгнуться в Исан, наши подразделения преследовали свои подразделения в Чампасаке, где произошла еще одна стычка, в результате которой внутри пограничной деревни Паксе разгорелся пожар. Теперь, [FROM.GetAdjective] Они требуют репараций в виде перекройки границы, чтобы защитить граждан Лаоса от возможных дальнейших вторжений.\n\nThe [FROM.GetAdjective] Мы потребовали вывести наши войска из штатов Ланна и Исан и передать контроль над ними правительству в Ханое. [FROM.GetAdjective] По его словам, отказ от этого будет рассматриваться как акт войны."
 FRI_r56rp.4.a:0 "И подчиниться колониальному угнетению?! Никогда!"
 FRI_r56rp.4.b:0 "Мы не можем позволить себе войну прямо сейчас."
 FRI_r56rp.5.t:0 "[FROM.GetNameDefCap] Отказаться от наших требований"
 FRI_r56rp.5.d:0 "После инцидента, который поджег приграничную деревню Паксе, мы выдвинули наши требования к сиамскому правительству, требуя, чтобы они отвели свои войска от штатов Ланна и Исан, а также передали их под наш контроль. Однако, поскольку они отказались, мы вынуждены объявить войну, чтобы защитить наши интересы здесь, в Юго-Восточной Азии."
 FRI_r56rp.5.a:0 "Похоже, администрация расширяется."
 FRI_r56rp.6.t:0 "[FROM.GetNameDefCap] Седес Ланна и Исан"
 FRI_r56rp.6.d:0 "После инцидента в Паксе сиамское правительство увидело причину для нашего требования уступить Ланну и Исана нам, это серьезно ослабит сиамскую нацию, и теперь у нас будет более легкое время, чтобы захватить полный контроль над страной, с casus belli стабилизации страны."
 FRI_r56rp.6.a:0 "Как мы и надеялись"
