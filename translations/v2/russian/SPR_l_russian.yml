 SPR_naval_equipment_desc:0 "Чтобы республиканский флот мог противостоять современным угрозам, необходимо улучшить предоставляемое ему оснащение."
 SPA_naval_equipment:0 "Военно-морское оснащение"
 SPA_naval_equipment_desc:0 "Новому флоту требуется самое современное оснащение, чтобы бросить вызов соперникам. Возродим Армаду."
