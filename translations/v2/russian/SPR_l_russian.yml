 SPA_spanish_austrian_diplomatic_unity:0 "Испано-австрийское дипломатическое единство"
 SPA_spanish_austrian_diplomatic_unity_desc:0 "Хотя короны Австрии и Испании не связаны династическими узами с начала XVIII века, угрозы современного мира ясно показывают необходимость крепкого союза европейских монархов."
