 spanish_civil_war_started_flag:0 "Гражданская война в Испании началась"
 sided_with_the_nationalists_spanish_civil_war_flag:0 "Поддержаны националисты"
 sided_with_the_republicans_spanish_civil_war_flag:0 "Поддержаны республиканцы"
 SPR_neutrality_party_house_of_bourbon_long:0 "Бурбонский дом"
 SPR_neutrality_party_house_of_bourbon_parma_long:0 "Дом Бурбон-Парма"
 SPR_nationalist_victory:0 "Победа националистов"
 SPR_nationalist_victory_desc:0 "Националистические силы под руководством генерала Франко сумели разгромить войска, верные Второй республике. Для Испании начинается новая эпоха, свободная от угрозы марксизма."
 SPR_republican_victory:0 "Победа республиканцев"
 SPR_republican_victory_desc:0 "Силы, верные Второй республике, сумели разгромить участников государственного переворота. Республика никогда не умрёт в сердцах испанцев!"
 SPR_cement_franco_rule:0 "Укрепить власть Франко"
 SPR_cement_franco_rule_desc:0 "Франко кажется наиболее подходящим человеком для руководства Испанией в период восстановления и преобразований. До дальнейших распоряжений он станет высшим должностным лицом испанского правительства."
 SPR_restore_the_monarchy:0 "Восстановить монархию"
 SPR_restore_the_monarchy_desc:0 "После окончательного погребения республики Испании пора вернуться к традиционной форме правления — монархии. Остаётся решить, кто станет новым королём: монархисты разделены между альфонсистами, желающими видеть на троне Хуана, и карлистами, избравшими своим новым претендентом регента Хавьера."
 SPR_king_juan_iii:0 "Король Хуан III"
 SPR_king_juan_iii_desc:0 "Инфант Хуан был избран новым королём Испании. Как назначенного наследника Альфонсо, многие недооценивают его частично либеральные взгляды, в частности намерение частично восстановить испанскую демократию."
 SPR_king_javier_I:0 "Король Хавьер I"
 SPR_king_javier_I_desc:0 "Франсиско Хавьер де Бурбон-Парма-и-де-Браганса, бывший карлистский регент, назначенный самим движением, был избран новым испанским монархом. Будучи убеждённым карлистом, он олицетворяет победу традиционалистского движения, глубоко укоренённого в Испании."
 SPR_restore_democracy:0 "Восстановить демократию"
 SPR_adapt_the_constitution_of_1876:0 "Адаптировать конституцию 1876 года"
 SPR_british_alignment:0 "Ориентация на Великобританию"
 SPR_british_alignment_desc:0 "Пока тень войны расползается по Европе, Великобритания остаётся твёрдой и непоколебимой. Пора возобновить добрые отношения с ней и заключить официальный союзный договор между нашими странами."
 SPR_stay_out_of_conflicts:0 "Держаться в стороне от конфликтов"
 SPR_stay_out_of_conflicts_desc:0 "Нейтралитет во время Великой войны позволил нам добиться значительного экономического роста и избежать множества внутренних проблем. Нам следует поступить так же и в этот раз."
 SPR_the_transition:0 "Переход"
 SPR_the_transition_desc:0 "Настало время переписать испанскую конституцию и восстановить власть Кортесов, а значит — и испанского народа. "
 SPR_support_the_free_market:0 "Поддержать свободный рынок"
 SPR_support_the_free_market_desc:0 "Хорошим способом восстановления испанской экономики станет сокращение государственного вмешательства. Это позволит привлечь иностранные инвестиции."
 SPR_dios:0 "Бог"
 SPR_patria:0 "Родина"
 SPR_patria_desc:0 "Испанский народ образует единую и неделимую нацию. Все народы — каталонцы, баски, галисийцы и кастильцы — должны объединиться ради сохранения своих традиций"
 SPR_dios_desc:0 "Карлизм признаёт важность Католической церкви не только в общественной жизни, но и в принятии государственных решений. Создание министерства по делам религии позволит обеспечить её влияние на нашу политику."
 ITA_align_with_italy:0 "Сблизиться с Италией"
 ITA_align_with_italy_desc:0 "Расширение Римских протоколов показывает, что Италия желает занять достойное место в мире. Нам следует сблизиться с ней, чтобы вместе противостоять и нацизму, и западному либерализму."
 SPR_fueros:0 "Фуэрос"
 SPR_rey:0 "Король"
 SPR_establish_traditional_cortes:0 "Учредить традиционные Кортесы"
 SPR_establish_traditional_cortes_desc:0 "Несмотря на всю законность власти короля над Испанией, она должна быть ограничена прежде всего стоящей над ним церковью, а также созданием нижней палаты, призванной поддерживать испанские традиции."
 SPR_decentralize_the_kingdom:0 "Децентрализовать королевство"
 SPR_decentralize_the_kingdom_desc:0 "Хотя многие сепаратисты из различных областей Испании поддержали республику, мы должны проявить добрую волю к этим народам. Мы восстановим систему фуэрос — особых прав, дарованных этим регионам ещё в Средние века. Так они получат определённую степень автономии."
 SPR_claim_gibraltar:0 "Предъявить права на Гибралтар"
 SPR_issue_political_amnesties:0 "Объявить политическую амнистию"
 SPR_issue_political_amnesties_desc:0 "Чтобы полностью объединить испанский народ, мы должны проявить милосердие к прежним врагам. Амнистировав многих республиканцев, не принадлежавших к наиболее радикальным течениям, мы покажем, что новое правительство действует в интересах всех испанцев."
 SPR_claims_against_italy:0 "Претензии к Италии"
 SPR_claims_against_italy_desc:0 "Сардиния и Сицилия некогда принадлежали испанской короне. Мы можем воспользоваться противостоянием Великобритании с Италией, чтобы вновь заявить права на эти территории."
 SPR_expand_pyrenees_fortifications:0 "Расширить укрепления в Пиренеях"
 SPR_expand_pyrenees_fortifications_desc:0 "Франция, вероятно, окажется на передовой грядущей войны, откуда бы та ни пришла. Чтобы удержать желающих перенести конфликт на Иберийский полуостров, мы возведём новые укрепления вдоль Пиренеев."
 SPR_reclaim_gibraltar:0 "Вернуть Гибралтар"
 SPR_reclaim_gibraltar_desc:0 "Гибралтар — неотъемлемая часть Испании! Британские предатели столетиями оккупируют эту территорию, унижая всю испанскую нацию. Пора положить этому конец."
 SPR_ministry_of_religous_affairs:0 "Министерство по делам религии"
 SPR_ministry_of_religous_affairs_desc:0 "Карлизм признаёт важность Католической церкви не только в общественной жизни, но и в принятии государственных решений. Создание министерства по делам религии позволит обеспечить её влияние на нашу политику."
 SPR_pursue_autarky_policies:0 "Продолжить политику автаркии"
 SPR_pursue_autarky_policies_desc:0 "На протяжении десятилетий многие группы поддерживали идею экономической независимости. Мы должны продолжать нашу политику в пользу местного производства и уменьшения нашей зависимости от других стран, особенно в том, что касается вооружений."
 SPR_policia_armada:0 "Вооружённая полиция"
 SPR_policia_armada_desc:0 "Мы разгромили республиканских предателей на поле боя, но многие их сторонники по-прежнему скрываются в тени и, вероятно, готовят выступление против нового режима. Этому необходимо положить конец."
 SPR_sindicato_vertical:0 "Вертикальный синдикат"
 SPR_sindicato_vertical_desc:0 "Вместо запрещённых профсоюзов необходимо создать организацию, основанную на принципах корпоративизма. Работники и работодатели должны сотрудничать ради построения национальной экономики."
 SPR_common_front_against_nazism:0 "Единый фронт против нацизма"
 SPR_common_front_against_nazism_desc:0 "Как бы мы ни презирали их либерализм, в нынешнем мировом конфликте нашим интересам отвечает победа Великобритании. Мы отложим разногласия и объединимся с ней, чтобы положить конец германской угрозе."
 SPR_join_italy:0 "Присоединиться к Италии"
 SPR_join_italy_desc:0 "Италия оказала огромную помощь в нашей победе над республиканцами и стала источником вдохновения для режима. Наши интересы явно совпадают, поэтому следует выступить единым фронтом."
 SPR_join_the_axis:0 "Вступить в Ось"
 SPR_join_the_axis_desc:0 "Новый мировой конфликт кажется неизбежным, а Германия сильнее и грознее, чем когда-либо. Было бы разумно сблизиться с ней и обеспечить Испании законное место рядом с ней."
 SPR_francoist_neutrality:0 "Франкистский нейтралитет"
 SPR_francoist_neutrality_desc:0 "Сближение с любой из сторон скорее погубит хрупкий режим, чем принесёт пользу. По крайней мере пока нейтралитет представляется лучшим выбором."
 SPR_further_the_iberian_pact:0 "Расширить Иберийский пакт"
 SPR_further_the_iberian_pact_desc:0 "С Португалией уже подписан договор о дружбе и ненападении. Следует расширить его, гарантировав взаимную защиту и нейтралитет Иберии в случае общеевропейского конфликта."
 SPR_retake_gibraltar:0 "Отвоевать Гибралтар"
 SPR_retake_gibraltar_desc:0 "Пора вернуть Гибралтар — территорию, по праву принадлежащую Испании!"
 SPR_unify_iberia:0 "Объединить Иберию"
 SPR_unify_iberia_desc:0 "Чтобы продемонстрировать союзникам наше величие и могущество, следует вновь объединить Португалию и Испанию, как во времена Иберийской унии."
 SPR_claim_sardinia_and_sicily:0 "Предъявить права на Сардинию и Сицилию"
 SPR_claim_sardinia_and_sicily_desc:0 "Италия, несмотря на прежнюю роль источника нашего вдохновения, решила поддержать нацистскую Германию. Этот союз можно использовать как основание для притязаний на Сицилию и Сардинию, некогда принадлежавшие Испании."
 SPR_uphold_the_1931_constitution:0 "Отстоять конституцию 1931 года"
 SPR_rebuild_the_republic:0 "Восстановить республику"
 SPR_rebuild_the_republic_desc:0 "Теперь, когда путч подавлен, настало время восстановить республиканские институты."
 SPR_get_rid_of_azana:0 "Избавиться от Асаньи"
 SPR_get_rid_of_azana_desc:0 "Несмотря на добрые намерения в отношении республики, Асанья слишком умерен в социальных и экономических вопросах. КПИ и ИСРП обрели достаточно влияния, чтобы без особых затруднений вынудить его уйти в отставку."
 SPR_the_third_republic:0 "Третья республика"
 SPR_the_third_republic_desc:0 "Следует воспользоваться революционной атмосферой после нашей победы и преобразовать правительство, создав новую, более сильную народную республику."
 SPR_psoe_leadership:0 "Руководство ИСРП"
 SPR_psoe_leadership_desc:0 "В разработке"
 SPR_PCE_leadership:0 "Руководство КПИ"
 SPR_PCE_leadership_desc:0 "В разработке"
 SPR_continue_azana_work:0 "Продолжить дело Асаньи"
 SPR_continue_azana_work_desc:0 "В разработке"
 SPR_continue_the_secularization_policies:0 "Продолжить политику секуляризации"
 SPR_continue_the_secularization_policies_desc:0 "Поддержав националистов, Католическая церковь доказала, что является пятой колонной внутри республики. Мы продолжим реформы, ограничивающие её влияние и препятствующие религиозной деятельности."
 SPR_the_reformist_wing:0 "Реформистское крыло"
 SPR_appease_the_workers:0 "Умиротворить рабочих"
 SPR_appease_the_workers_desc:0 "В разработке"
 SPR_the_left_front:0 "Левый фронт"
 SPR_the_left_front_desc:0 "Все партии и профсоюзы, выступающие против капитализма, должны объединиться ради рабочей революции. Совместные действия позволят избежать тупика из-за внутренней оппозиции."
 SPR_socialize_the_means_of_production:0 "Обобществить средства производства"
 SPR_socialize_the_means_of_production_desc:0 "В разработке"
 SPR_purge_the_liberals:0 "Провести чистку либералов"
 SPR_purge_the_liberals_desc:0 "В разработке"
 SPR_begin_collectivization:0 "Начать коллективизацию"
 SPR_begin_collectivization_desc:0 "В разработке"
 SPR_establish_soviet_democracy:0 "Установить советскую демократию"
 SPR_establish_soviet_democracy_desc:0 "Настало время заменить буржуазную парламентскую систему коммунизмом советов, гораздо лучше отвечающим задачам социальной революции"
 SPR_establish_the_oraa_desc:0 "«Организация по подавлению антиреволюционной деятельности» будет создана по образцу советского НКВД и займётся розыском противников нового коммунистического режима."
 SPR_establish_the_oraa:0 "Создать ОПАД"
 SPR_uphold_the_1931_constitution_desc:0 "Конституцию 1931 года необходимо защищать любой ценой. Испанская демократия не позволит уничтожить себя ни изнутри, ни извне."
 SPR_repair_relations_with_the_west:0 "Восстановить отношения с Западом"
 SPR_repair_relations_with_the_west_desc:0 "Теперь, когда республика утвердилась как единственная власть на испанской земле, а наиболее коммунистические элементы сдержаны, можно попытаться восстановить дружественные отношения с западными демократиями."
 SPR_align_with_the_new_france:0 "Сблизиться с новой Францией"
 SPR_align_with_the_new_france_desc:0 "Новый французский режим весьма скептически относится к сотрудничеству с Советами. Возможно, нам стоит поступить так же."
 SPR_join_the_comintern:0 "Вступить в Коминтерн"
 SPR_join_the_comintern_desc:0 "Советский Союз оказался нашим главным союзником в победе над националистами. Естественным шагом станет дальнейшее сближение с ним."
 SPR_intervention_in_portugal:0 "Интервенция в Португалию"
 SPR_intervention_in_portugal_desc:0 "Режим «Эстадо Ново» активно сотрудничал с националистами. Оставить это без последствий невозможно."
 SPR_confront_the_hearth_of_fascism:0 "Противостоять очагу фашизма"
 SPR_confront_the_hearth_of_fascism_desc:0 "Италия была одним из главных сторонников Франко и явно намерена продолжать поддержку фашизма. Пора положить конец режиму Муссолини."
 SPR_convince_portugal:0 "Убедить Португалию"
 SPR_demand_gibraltar:0 "Потребовать Гибралтар"
 SPR_demand_gibraltar_desc:0 "Британское присутствие в Гибралтаре представляет угрозу в случае конфликта в Средиземноморье. Скала будет гораздо безопаснее в руках Комитета, поэтому мы потребуем её возвращения."
 SPR_a_permanent_legion_condor:0 "Постоянный легион «Кондор»"
 SPR_a_permanent_legion_condor_desc:0 "Мы можем многому научиться на успехах германского легиона «Кондор». Запросив военную делегацию из Германии, мы сможем модернизировать свои военно-воздушные силы по его примеру."
 SPR_claims_on_france:0 "Претензии к Франции"
 SPR_claims_on_france_desc:0 "У нас множество требований к Франции, прежде всего контроль над Марокко. Можно также попытаться вернуть Руссильон, который остаётся частью исторической Каталонии, а значит — и великой Испании."
 SPR_learn_from_the_regia_marina:0 "Перенять опыт Реджиа Марина"
 SPR_learn_from_the_regia_marina_desc:0 "Италия располагает одним из наиболее развитых военно-морских флотов Европы. Нам следует перенять её опыт для совершенствования собственного флота."
 SPR_help_the_royal_navy:0 "Помочь Королевскому флоту"
 SPR_help_the_royal_navy_desc:0 "Испания занимает прекрасное положение для контроля Атлантики и Средиземноморья. Поэтому разумно улучшить наш флот, опираясь на британский опыт."
 SPR_take_gibraltar_by_force:0 "Захватить Гибралтар силой"
 SPR_western_economic_cooperation:0 "Экономическое сотрудничество с Западом"
 SPR_learn_from_the_royal_navy:0 "Перенять опыт Королевского флота"
 SPR_post_depression_recovery:0 "Восстановление после Великой депрессии"
 SPR_post_depression_recovery_desc:0 "Хотя Великая депрессия затронула Испанию слабее, чем другие страны, она всё же породила множество экономических проблем. Теперь, когда её последствия более или менее преодолены, можно ускорить экономическое развитие."
 SPR_increase_public_investments:0 "Увеличить государственные инвестиции"
 SPR_increase_public_investments_desc:0 "Рост государственных вложений в общественный сектор обеспечит большую стабильность и экономическую независимость."
 SPR_surevaluate_the_peseta:0 "Переоценить песету"
 SPR_surevaluate_the_peseta_desc:0 "Завышенный курс валюты сдержит рост цен и снизит стоимость зарубежных инвестиций, позволив Испании вернуть место на мировом рынке. "
 SPR_repair_the_national_roads:0 "Восстановить национальные дороги"
 SPR_repair_the_national_roads_desc:0 "Гражданская война разрушила множество дорог и железнодорожных линий. Для возрождения национальной экономики их необходимо восстановить и построить новые."
 SPR_create_the_ini:0 "Создать ИНИ"
 SPR_create_the_ini_desc:0 "«Национальный институт промышленности» будет финансировать и ускорять экономическое восстановление Испании, чтобы возродить эффективный промышленный сектор. "
 SPR_create_instalaza:0 "Основать «Инсталасу»"
 SPR_create_instalaza_desc:0 "«Инсталаса» станет компанией по производству стрелкового оружия и поможет развить вооружённую промышленность."
 SPR_save_the_education_budget:0 "Восстановить бюджет образования"
 SPR_save_the_education_budget_desc:0 "Реконструкция вынудила сократить расходы на образование, что серьёзно ударило по этой сфере. Следует вернуть прежний бюджет или даже увеличить его."
 SPR_public_work_projects:0 "Проекты общественных работ"
 SPR_support_the_heavy_industry:0 "Поддержать тяжёлую промышленность"
 SPR_support_the_heavy_industry_desc:0 "Для удовлетворения потребностей армии в вооружении необходимо глубже развивать тяжёлую промышленность."
 SPR_expand_the_mines:0 "Расширить шахты"
 SPR_expand_the_mines_desc:0 "Наши недра богаты ресурсами, особенно вольфрамом. Улучшение добывающих мощностей позволит использовать их для промышленного развития."
 SPR_una_grande_y_libre:0 "Единая, великая и свободная"
 SPR_una_grande_y_libre_desc:0 "Испания свободна от любого иностранного влияния, и для утверждения своего места в мире ей не нужна помощь других держав!"
 SPR_befriend_portugal:0 "Подружиться с Португалией"
