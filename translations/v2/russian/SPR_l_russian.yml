 SPR_juan_iii:0 "Хуан III"
 SPR_jose_maria_fernandez_fadreda:0 "Хосе Мария Фернандес-Ладреда"
 SPA_prepare_the_merge_of_falanga_with_carlists:0 "Подготовить объединение Фаланги с карлистами"
 SPA_prepare_the_merge_of_falanga_with_carlists_desc:0 "Разногласия между антиреспубликанскими группировками могут выйти из-под контроля, если их не сдерживать. Используя влияние новой объединяющей политической фигуры, мы можем заложить основы партии, способной представлять интересы всех участников этого вынужденного союза."
 SPA_appease_anti_secular_elements:0 "Умиротворить антиклерикальные элементы"
 SPA_appease_anti_secular_elements_desc:0 "Ультракатолическая и антисекулярная «Комунион Традиционалиста» пользуется широкой поддержкой духовенства и традиционалистов страны. Приняв несколько антисекулярных законов, мы ещё больше укрепим их благосклонность к правительству."
 SPR_back_the_ceda:0 "Поддержать СЭДА"
 SPR_back_the_ceda_tt:0 "§W§! §YНационалисты§! §Wначнут гражданскую войну с §G75§! §Wед. политической власти.§! §W§! §YРеспубликанцы§! §Wначнут гражданскую войну с§! §Y0§! §Wед. политической власти.§!\n "
 SPR_back_the_ceda_2_tt:0 "§RМы вернем назад§! §YНационалисты§! §RКогда начинается гражданская война§!\n "
 SPR_civil_war_load_tt:0 "§WФокусы§! §Yгражданской войны§! §Wстановятся§! §Gдоступны§!\n "
 SPR_back_the_ceda_desc:0 "Поддержать СЭДА. За Испанию!"
 SPR_establish_a_conspiracy:0 "Расширить военный заговор"
 SPR_establish_a_conspiracy_tt:0 "§W§! §YНационалисты§! §Wначнут гражданскую войну с дополнительным бонусом:\nОпыт армии:§! §G+10§!§W.§!"
 SPR_establish_a_conspiracy_desc:0 "Нужно действовать быстро, пока враги не прознали о нашем заговоре!"
 SPR_strike_first:0 "Ударить первыми"
 SPR_strike_first_desc:0 "Если мы хотим победить врагов, инициатива должна быть у нас. Нужно нанести удар первыми!"
 SPR_r56_strike_first:0 "Инициатива в гражданской войне"
 SPR_r56_strike_first_desc:0 "Мы выступили первыми и временно получили преимущество над врагами!"
 SPR_maintain_the_popular_front:0 "Поддержать Народный фронт"
 SPR_maintain_the_popular_front_desc:0 "Поддержать Народный фронт. За Испанию!"
 SPR_maintain_the_popular_front_tt:0 "§W§! §YРеспубликанцы§! §Wначнут гражданскую войну с §G75§! §Wед. политической власти.§! §W§! §YНационалисты§! §Wначнут гражданскую войну с §Y0§! §Wед. политической власти.§!\n "
 SPR_maintain_the_popular_front_2_tt:0 "§RМы поддержим§! §Yреспубликанцев§! §Rпосле начала гражданской войны§!\n "
 SPR_the_army_of_africa_connection:0 "Связи с Африканской армией"
 SPR_the_army_of_africa_connection_desc:0 "Лучшие подготовленные войска Испании помогут нам в борьбе с республиканцами и поддержат военный заговор."
 SPR_the_army_of_africa_connection_tt:0 "§W§! §YНационалисты§! §Wначнут гражданскую войну с дополнительными:\n§Y1,00 тыс.§! §Wед.§! §Yпехотного снаряжения§!."
 SPR_maintain_the_civil_guards_loyality:0 "Сохранить верность Гражданской гвардии"
 SPR_maintain_the_civil_guards_loyality_desc:0 "Гражданская гвардия защищает республику! Мы должны обеспечить её верность."
 SPR_r56_civil_war_tt:0 "§RНачнётся гражданская война!§!"
 SPR_maintain_the_civil_guards_loyality_tt:0 "§W§! §YРеспубликанцы§! §Wначнут гражданскую войну с дополнительным бонусом:\nОпыт армии:§! §G+10§!§W.§!"
 SPR_proclaim_a_general_strike:0 "Объявить всеобщую забастовку"
 SPR_proclaim_a_general_strike_desc:0 "Объявим всеобщую забастовку и начнём собирать и раздавать оружие! Это позволит превратить профсоюзы в военные подразделения для предстоящей борьбы!"
 SPR_proclaim_a_general_strike_tt:0 "§W§! §YРеспубликанцы§! §Wначнут гражданскую войну с дополнительными:\n§Y1,00 тыс.§! §Wед.§! §Yпехотного снаряжения§!."
 SPR_strike_first_tt:0 "§WВ начале§! §Yгражданской войны§! §Wподдержанная нами сторона:§!"
 SPR_unionify_the_faction:0 "Объединить нашу фракцию"
 SPR_unionify_the_faction_desc:0 "Чтобы победить в гражданской войне, необходимо добиться единства всех участников нашей фракции."
 SPR_solidify_the_fronts:0 "Укрепить линии фронта"
 SPR_solidify_the_fronts_desc:0 "Теперь, когда линии фронта определились, пора окопаться и закрепить контроль над занятыми территориями."
 SPR_equipment_shipments_r56:0 "Поставки снаряжения"
 SPR_equipment_shipments_r56_desc:0 "Многие мировые державы любезно «жертвуют» оружие в поддержку нашего дела."
 SPR_tackle_the_weak_fronts_r56:0 "Ударить по слабым участкам фронта"
 SPR_tackle_the_weak_fronts_r56_desc:0 "Мы гораздо лучше республиканцев знаем, какие участки фронта уязвимы и могут быть использованы. Значит, можно начать новое наступление!"
 SPR_new_approach_r56:0 "Новый подход"
 SPR_new_approach_r56_desc:0 "Чтобы выиграть эту войну, нам нужны новые тактики."
 SPR_international_brigdes_r56:0 "Интернациональные бригады"
 SPR_international_brigdes_r56_desc:0 "Люди со всего мира прибывают в республику, чтобы остановить националистическую мразь!"
 SPR_excavate_the_gold_reserves:0 "Изъять золотой запас"
 SPR_excavate_the_gold_reserves_desc:0 "В начале гражданской войны нам удалось захватить государственный золотой запас. К сожалению, почти ни одна страна не готова что-либо нам предоставить в обмен на него, кроме русских. Фашисты давят со всех сторон, и, возможно, пора вывезти золото за границу, передав его в надёжные руки государства [SOV.GetNameDef]. В любом случае оно готово оказать нам некоторую помощь."
 SPR_excavated_gold_reserves:0 "Изъятый золотой запас"
 SPR_expand_axis_aide:0 "Расширить помощь Оси"
 SPR_expand_axis_aide_desc:0 "Увеличение помощи, предоставляемой странами Оси, станет логичным шагом к победе."
 SPR_join_the_communist_opposition:0 "Присоединиться к коммунистической оппозиции"
 SPR_join_the_communist_opposition_desc:0 "Сталинизм предал идеалы революции, но другие сохранили её истинный дух."
 SPR_unionify_the_faction_idea:0 "Объединённая фракция"
 SPR_unionify_the_faction_idea_desc:0 "Несмотря на разногласия, нашу сторону объединяет общая цель — победа."
 SPR_solidify_the_fronts_idea:0 "Укреплённые линии фронта"
 SPR_solidify_the_fronts_idea_desc:0 "Теперь, когда линии фронта определились, обороняться гораздо легче, чем наступать. Нам следует воспользоваться этим."
 SPR_weak_fronts:0 "Удары по слабым участкам фронта"
 SPR_international_brigdes_r56_idea:0 "Интернациональные бригады"
 SPR_anarchist_insurrection:0 "Анархистское восстание"
 SPR_anarchist_insurrection_desc:0 "Наш союз с анархистами распался и привёл к восстанию в тылу, подавление которого займёт некоторое время."
 r56_SPR_anarchist_insurrection_mission:0 "Надвигающееся анархистское восстание"
 r56_SPR_anarchist_insurrection_mission_desc:0 "Наш союз с анархистами рано или поздно прекратится. Когда это случится, нам придётся с ними разобраться."
 r56_SPR_nationalist_check:0 "Мы — националисты"
 r56_i_am_the_nat_start_up_and_bypass:0 "Гражданская война началась"
 SPR_back_the_ceda_finished:0 "Мы поддержали националистов"
 r56_i_am_the_spr_start_up_and_bypass:0 "Мы — республиканцы"
 r56_SPR_republican_check:0 "Мы поддержали Народный фронт"
 SPR_pcd_democratic_party:0 "ПЦД"
 SPR_pcd_democratic_party_long:0 "Партидо дель Сентро Демократико"
 SPR_izquierda_republicana_party:0 "ИР"
 SPR_izquierda_republicana_party_long:0 "Искьерда Републикана"
 SPR_spain.1.t:0 "Реакционеры разгромлены!"
 SPR_spain.1.desc:0 "Благодаря героическим усилиям испанский народ при поддержке антифашистов со всего мира разгромил фашистских мятежников и обеспечил победу Народного фронта. Наша победа избавила нас от тирании реакционеров, однако боевые действия и необходимые меры безопасности серьёзно подорвали экономику. После всех страданий ясно, что народ желает лишь одного — мира."
 SPR_spain.1.a:0 "Наконец-то мир!"
 SPR_democratic_party_ceda_long:0 "Конфедерасьон Эспаньола де Деречас Аутономас"
 SPR_democratic_party_ceda:0 "СЭДА"
 SPR_spain.2.t:0 "СЭДА становится демократической партией"
 SPR_spain.2.desc:0 "Это событие делает СЭДА демократической партией, если идеология Испании меняется на демократическую, в частности из-за британского фокуса на поддержку демократии в Испании. Таким образом оно предотвращает появление пустого портрета у Испании."
 SPR_spain.2.a:0 "Хорошо"
 SPR_spain.3.t:0 "Смерть Мануэля Асаньи"
 SPR_spain.3.desc:0 "Мануэль Асанья, президент Испанской республики, скончался прошлой ночью.\n\nБудучи важнейшей фигурой Второй республики, особенно во время гражданской войны, он всю жизнь боролся за демократическое равенство всех граждан перед законом и создание современной политической системы, способной отвечать требованиям современной демократии на стыке президентской и парламентской моделей.\n\nЕго преемником избран Хосе Хираль, один из ближайших соратников Асаньи и бывший премьер-министр."
 SPR_spain.3.a:0 "Больше чем президент — символ республики"
 SPR_spain.4.t:0 "Испания предлагает договор о взаимной обороне"
 SPR_spain.4.desc:0 "После установления режима Франко отношения между Испанией и Португалией заметно потеплели, а сотрудничество двух стран становилось всё теснее.\n\nИспанское правительство предложило подписать соглашение, которое гарантирует общую границу, взаимную помощь в случае оборонительной войны и отказ от поддержки третьей державы в случае более масштабного конфликта."
 SPR_spain.4.a:0 "Это принесёт пользу обеим сторонам"
 SPR_spain.4.b:0 "Это противоречит интересам Португалии"
 SPR_spain.5.t:0 "Испания требует Гибралтар"
 SPR_spain.5.desc:0 "Испанское правительство, опираясь на советскую поддержку своих притязаний, направило нам ультиматум с требованием вернуть Гибралтар Испании и угрозой военных действий в случае отказа.\n\nНейтралитет Великобритании во время гражданской войны не способствовал восстановлению дружественных отношений между Соединённым Королевством и новым коммунистическим правительством Испании, которое поэтому сблизилось с Советским Союзом и Коминтерном.\n\nГибралтар имеет огромное военное значение: контролирующий скалу способен контролировать вход и выход кораблей из Средиземного моря, что делает её ключевой точкой в случае конфликта с любой средиземноморской державой.\n\nНо стоят ли все эти преимущества риска войны с Испанией и Советским Союзом?"
 SPR_spain.5.a:0 "Гибралтар был и останется британским"
 SPR_spain.5.b:0 "Разумнее будет уступить его"
 SPR_spain.6.t:0 "Великобритания отказывается вернуть Гибралтар"
 SPR_spain.6.desc:0 "Британское правительство отклонило требование о возвращении Гибралтара. Мы угрожали военным ответом в случае отказа, но, возможно, безопаснее будет отступить?"
 SPR_spain.6.a:0 "Гибралтар станет испанским, при необходимости силой!"
 SPR_spain.6.b:0 "Этот ультиматум был ошибкой"
 SPR_spain.7.t:0 "Вернулся старый знакомый"
 SPR_spain.7.desc:0 "Наши службы установили, что Александр Михайлович Орлов, по нашим данным родившийся под именем Лейба Лазаревич Фельдбин, вернулся в Соединённые Штаты после окончания гражданской войны в Испании. Источники указывают, что он был агентом НКВД, но отказался вернуться в государство [SOV.getnamedef]."
 SPR_spain.7.a:0 "Раз он хочет скрыться от коммунистов, оставим его в покое."
 SPR_spain.7.b:0 "Попытаться завербовать его!"
 spain.10.t:0 "Кортесы распущены"
 spain.10.a:0 "Выборы объединят всех"
 spain.21.t:0 "Прибытие Висенте Рохо"
 spain.21.d:0 "Висенте Рохо принял наше приглашение и прибыл в страну. Мы ещё не решили, в каком качестве он будет работать, и теперь должны принять это решение."
 spain.21.a:0 "Его навыки нужны нам на поле боя"
 spain.21.b:0 "Его опыт принесёт нам пользу"
 spain.21.c:0 "Достаточно предоставить ему убежище"
 spain.22.t:0 "Прибытие республиканских генералов"
 spain.22.d:0 "Хосе Миаха и другие испанские генералы приняли наше приглашение и прибыли в страну. Мы ещё не решили, в каком качестве они будут работать, и теперь должны принять это решение."
 spain.22.a:0 "Поддержать их антифашистское движение"
 spain.22.b:0 "Принять их в армию"
 spain.23.t:0 "Испанский золотой запас"
 spain.23.d:0 "Под давлением фашистов и международного сообщества Испания решила передать нам свой золотой запас в обмен на символическую помощь вооружением. Они утверждают, что это лишь временно, но лучшей платой за нашу помощь будет хранение золота у нас в обозримом будущем."
 spain.23.a:0 "Разумеется, мы обязательно всё вернём."
 SPR_the_black_years:0 "Чёрные годы"
 SPR_the_black_years_desc:0 "Основания молодой республики с каждым днём становятся всё более хрупкими. Беспорядки неуклонно усиливаются со времени забастовки астурийских шахтёров 1934 года. Правые радикализуются, СЭДА всё сильнее разочаровывается в демократической системе, а популярность фалангистов продолжает расти. Слухи о военном заговоре вызвали у левых такую паранойю, что профсоюзы начали формировать импровизированные ополчения. Это привело к столкновениям политических противников, которые нередко заканчиваются насилием.\n\nИспания миновала точку невозврата — гражданская война практически неизбежна."
