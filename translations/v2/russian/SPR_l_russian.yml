 SPA_ally_the_french:0 "Заключить союз с французами"
 SPA_ally_the_french_desc:0 "Новое французское правительство под мудрым руководством [FRA.getleader], похоже, разделяет наши интересы. Следует рассмотреть возможность союза."
 SPR_naval_design_bureau:0 "Военно-морское конструкторское бюро"
 SPR_naval_design_bureau_desc:0 "Объединение инженеров в военно-морском конструкторском бюро позволит лучшим умам переосмыслить оснащение нашего флота."
