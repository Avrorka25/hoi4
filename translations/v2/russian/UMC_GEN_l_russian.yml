 ABC_army_effort:0 "Развитие армии"
 ABC_army_effort_desc:0 "Мир балансирует на грани хаоса, и на горизонте вновь маячит война. По мере роста глобальной напряжённости жизненно важно укрепить и модернизировать вооружённые силы в соответствии с требованиями новой эпохи. Только готовность и модернизация позволят защитить нашу страну и народ!"
