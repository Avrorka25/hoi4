 GEN_Shared_Research_group:0 "Программа обмена технологиями"
 GEN_Shared_Research_group_n:0 "Программа обмена технологиями"
 GEN_Shared_Research_group_d:0 "Чтобы сравняться с мировыми державами, мы должны объединить усилия в научных исследованиях."
 UMC_GEN_tank_purchase_cat:0 "Покупка иностранной бронетехники"
 UMC_GEN_tank_purchase_cat_desc:0 "Благодаря успешному развитию экономики мы теперь можем позволить себе вооружать армии по современным стандартам. Где бы ни проходили сражения будущих войн, бронетанковые войска будут играть решающую роль.\nПоэтому мы должны направить ресурсы на разработку собственных танков или, что ещё лучше, закупать их."
 GEN_light_tank_ger:0 "Закупить германские лёгкие танки"
 GEN_medium_tank_ger:0 "Закупить германские средние танки"
 GEN_heavy_tank_ger:0 "Закупить германские тяжёлые танки"
