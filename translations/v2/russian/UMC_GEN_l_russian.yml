 GEN_Mass_Units_I:0 "Массовая мобилизация"
 GEN_Mass_Units_I_desc:0 "Хорошая подготовка и снаряжение переоценены. В сражениях побеждает численность."
 GEN_Licences_I:0 "Покупка иностранных лицензий"
 GEN_Licences_I_desc:0 "Теперь, когда мы способны производить современное снаряжение, можно приобретать самые передовые проекты других стран. Хотя за них придётся заплатить определённую цену, это наверняка того стоит."
