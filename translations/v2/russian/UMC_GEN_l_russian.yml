l_russian:
 GEN_personal_affair:0 "Личное дело"
 GEN_personal_affair_desc:0 "Нынешняя война, в которой участвует [ROOT.GetName], носит скорее личный, чем политический характер. Поэтому другим странам незачем в неё вмешиваться — и им не следует этого делать."
 GEN_non_escalation_pact:0 "Пакт о неэскалации"
 GEN_seeking_expansive_t:0 "Проводить экспансионистскую политику"
 GEN_begin_industrial_buildup:0 "Начать промышленное строительство"
 GEN_begin_industrial_buildup_desc:0 "Наступает эпоха перемен. В страну приходят инвестиции, изобретаются новые машины, и нам необходимо приспосабливаться к этим изменениям."
 GEN_improve_state_infrastructure:0 "Улучшить государственную инфраструктуру"
 GEN_improve_state_infrastructure_desc:0 "Хорошо развитая инфраструктурная сеть связывает нашу страну воедино и имеет решающее значение для национальной обороны."
 GEN_encorage_foreign_investors:0 "Поощрять иностранных инвесторов"
 GEN_encorage_foreign_investors_desc:0 "Промышленность иностранных держав намного превосходит нашу, поэтому нам следует воспользоваться их знаниями."
 GEN_expand_civilian_manufacturers:0 "Расширить гражданское производство"
 GEN_expand_civilian_manufacturers_desc:0 "Новые заводы необходимы современной стране."
 GEN_improve_civilian_industry_capacity:0 "Повысить потенциал гражданской промышленности"
 GEN_improve_civilian_industry_capacity_desc:0 "Наша промышленность должна быть модернизирована, чтобы соответствовать требованиям времени."
 GEN_new_schools_and_modern_teaching:0 "Новые школы и современные методы обучения"
 GEN_new_schools_and_modern_teaching_desc:0 "Образование — основа науки и ключ к приспособлению к современному миру."
 GEN_reveal_mineral_wealth:0 "Раскрыть минеральные богатства"
 GEN_reveal_mineral_wealth_desc:0 "Необходимые для войны богатства могут скрываться глубоко под нашей землёй, и наш долг — отыскать их."
 GEN_focus_on_synthetic_processing:0 "Сосредоточиться на синтетическом производстве"
 GEN_focus_on_synthetic_processing_desc:0 "Производство нефти и каучука из угля позволяет снизить зависимость от импорта нефти и контроля над нефтяными месторождениями. Однако синтетическое топливо намного сильнее загрязняет окружающую среду и обходится дороже."
 GEN_reform_the_taxes:0 "Реформировать налоги"
 GEN_reform_the_taxes_desc:0 "Более организованный административный аппарат позволит эффективнее справляться с нынешними трудностями."
 ABC_establish_a_general_staff:0 "Генеральный штаб: [ROOT.GetAdjective]"
 ABC_establish_a_general_staff_desc:0 "Нашей армии недостаёт надлежащей тактики и организации. Создание полноценного генерального штаба укрепит ослабленный военный аппарат."
 ABC_army_reform:0 "Реформа армии"
 ABC_army_reform_desc:0 "Реорганизация армии — долгий процесс. Новый генеральный штаб указывает на необходимость проведения военных манёвров для подготовки солдат и обучения офицеров."
 ABC_doctrine_effort:0 "Развитие доктрины"
 ABC_equipment_effort:0 "Развитие снаряжения"
 ABC_equipment_effort_desc:0 "Пределы того, какое снаряжение способна нести пехота, постоянно расширяются. Мы сосредоточимся на обеспечении войск лучшими доступными средствами."
 ABC_infantry_camouflage:0 "Камуфляж пехоты"
 ABC_infantry_camouflage_desc:0 "Тщательно подбирая материалы для формы пехотных подразделений, можно добиться лучшей маскировки. Этот метод наверняка окажется полезным на ровной и открытой местности."
 ABC_equipment_effort_2:0 "Модернизировать стрелковое оружие"
 ABC_equipment_effort_2_desc:0 "Мы продолжим работу, чтобы пехота и вспомогательные части были вооружены лучшим снаряжением своего времени."
 ABC_mechanization_effort:0 "Развитие механизации"
 ABC_mechanization_effort_desc:0 "Переосмысливая возможности моторизованной пехоты, мы можем расширить границы современной конструкции военной техники."
 ABC_doctrine_effort_2:0 "Военные игры"
 ABC_doctrine_effort_2_desc:0 "За межвоенные годы и в ходе последних конфликтов поле боя изменилось. Необходимо постоянно пересматривать наши доктрины с учётом этих перемен."
 ABC_establish_a_military_academy:0 "Основать военную академию"
 ABC_establish_a_military_academy_desc:0 "Изучение доктрин и обмен военными знаниями станет проще в стенах недавно основанной военной академии."
 ABC_equipment_effort_3:0 "Исследовать полевые орудия"
 ABC_equipment_effort_3_desc:0 "Вместо копирования или закупки иностранного снаряжения мы должны стать мировым лидером в области пехотного вооружения."
 ABC_doctrine_effort_desc:0 "Военные доктрины, определявшие сухопутные сражения Великой войны, устарели. Наши лучшие умы должны сформировать военную мысль завтрашнего дня."
 ABC_army_modernization:0 "Модернизация армии"
 ABC_army_modernization_desc:0 "Чтобы выдерживать самые тяжёлые манёвры и учебные мероприятия, нашим солдатам необходимы подходящая форма, инструменты и снаряжение."
 ABC_motorization_effort:0 "Развитие моторизации"
 ABC_motorization_effort_desc:0 "Мобильность и защита имеют решающее значение для безопасной переброски пехоты на поле боя и обратно. Развитие этих направлений позволит действовать быстрее."
 ABC_establish_a_armor_corp:0 "Создать бронетанковый корпус"
 ABC_establish_a_armor_corp_desc:0 "Недавно приобретённая иностранная военная техника вдохновила местных инженеров на разработку нового типа бронемашины, который обещает быть быстрее, надёжнее и мощнее, чем мы могли представить."
 ABC_field_hospitals:0 "Улучшить полевые госпитали"
 ABC_field_hospitals_desc:0 "В нынешних обстоятельствах потеря талантливых и опытных солдат в бою — непозволительная роскошь."
 ABC_special_forces:0 "Войска специального назначения"
 ABC_special_forces_desc:0 "Нам нужны элитные войска; горные части и десантники должны стать приоритетом."
 ABC_signal_companies:0 "Роты связи"
 ABC_signal_companies_desc:0 "Координация ударов и военных операций станет значительно эффективнее, если выделить дополнительный персонал, оснащённый средствами связи. "
 ABC_modern_logistics:0 "Современная логистика"
 ABC_modern_logistics_desc:0 "Лояльность армии зависит от её способности сражаться за наше дело. Если мы не сможем снабжать войска необходимым снаряжением, то рискуем столкнуться с мятежами и массовым дезертирством."
 GEN_expand_military_capacity:0 "Расширить военное производство"
 GEN_expand_military_capacity_desc:0 "Вооружённым силам требуется огромное количество нового снаряжения. Расширение промышленного сектора непременно поможет удовлетворить эти потребности."
 GEN_invite_german_investors:0 "Пригласить инвесторов [GER.getAdjective]"
 GEN_invite_german_investors_desc:0 "Многие корпорации [GER.getAdjective] заинтересованы в расширении своего влияния и присутствия по всему миру. Мы можем воспользоваться хорошими отношениями и попросить о небольших инвестициях."
 GEN_german_heavy_industry_expansion:0 "Расширение тяжёлой промышленности: [GER.getAdjective]"
 GEN_german_heavy_industry_expansion_desc:0 "Стабильное промышленное сотрудничество с союзниками [GER.getAdjective] помогает нам модернизировать тяжёлую промышленность."
 GEN_invite_american_investors:0 "Пригласить инвесторов [USA.getAdjective]"
 GEN_invite_american_investors_desc:0 "Великие державы всегда заинтересованы в распространении своего влияния по всему миру. Мы можем воспользоваться хорошими отношениями и попросить о небольших инвестициях."
 GEN_american_air_industry_expansion:0 "Расширение авиационной промышленности: [USA.getAdjective]"
 GEN_american_air_industry_expansion_desc:0 "Авиация — будущее торговли, туризма и войны. Под руководством государства [USA.getNameDef] мы сможем продолжить промышленное развитие."
 GEN_invite_soviet_planners:0 "Пригласить планировщиков [SOV.getAdjective]"
 GEN_invite_soviet_planners_desc:0 "Уникальные архитектура и градостроительство [SOV.getAdjective] наверняка применимы и к множеству объектов в нашей стране. Первым шагом сотрудничества станет строительство совершенно нового промышленного комплекса."
 GEN_soviet_heavy_industry:0 "Тяжёлая промышленность: [SOV.getAdjective]"
 GEN_soviet_heavy_industry_desc:0 "Наши друзья [SOV.getAdjective] предлагают совместно расширить тяжёлую промышленность."
 GEN_automobile_industry:0 "Автомобильная промышленность"
 GEN_Automobile_tt:0 "Получить небольшое количество §Hмоторизованной техники§! от приглашённых компаний."
 GEN_automobile_industry_desc:0 "Отечественные производители автомобилей сейчас поощряются к сотрудничеству со своими зарубежными коллегами."
 GEN_purchase_foreign_licenses:0 "Приобрести иностранные лицензии"
 GEN_Licences_EXPL:0 "Открывает решения §H«Покупка иностранной бронетехники»§!."
 GEN_purchase_foreign_licenses_desc:0 "Теперь мы готовы начать местное производство передового снаряжения и даже закупать современные проекты у других стран. Это потребует расходов, но они наверняка себя оправдают."
 GEN_industrial_boom:0 "Промышленный бум"
 GEN_industrial_boom_desc:0 "Дальнейшее промышленное развитие — единственный способ обеспечить благосостояние наших граждан."
 GEN_nation_wide_industrial_expansion:0 "Общенациональное расширение промышленности"
 GEN_nation_wide_industrial_expansion_desc:0 "Новая государственная программа направлена на увеличение числа производственных предприятий по всей стране."
 GEN_modernize_railway_system:0 "Модернизировать железнодорожную систему"
 GEN_modernize_railway_system_desc:0 "Промышленности необходима надёжная инфраструктура для дальнейшего роста. Следует развивать железнодорожную сеть, чтобы удовлетворить этот спрос."
 GEN_modern_electronic_devices:0 "Современные электронные устройства"
 GEN_modern_electronic_devices_desc:0 "Новое поколение вычислительных машин произведёт революцию в способах получения и обработки информации."
 GEN_new_research_complex:0 "Новый исследовательский комплекс"
 GEN_new_research_complex_desc:0 "Смелых и дерзких умов будут активно приглашать в наши новые институты, университеты и исследовательские центры."
 GEN_Shared_Research:0 "Совместное научное сотрудничество"
 GEN_Shared_Research_desc:0 ""
 GEN_Army_Effort:0 "Расширить армию"
 GEN_Army_Effort_desc:0 ""
 GEN_Units_Mass_One:0 "Улучшить пехотное снаряжение"
 GEN_Units_Mass_One_desc:0 ""
 GEN_Units_Mass_Two:0 "Сосредоточиться на численности"
 GEN_Units_Mass_Two_desc:0 "Хорошая подготовка и снаряжение переоценены. В сражениях побеждает численность."
 GEN_Artilery:0 "Современные проекты артиллерии"
 GEN_Artilery_desc:0 ""
 GEN_Cheap:0 "Удешевить снаряжение"
 GEN_Cheap_desc:0 ""
 GEN_Better:0 "Улучшить снаряжение"
 GEN_Better_desc:0 ""
 GEN_Units_Good_One:0 "Улучшить поддержку и логистику полевой армии"
 GEN_Units_Good_One_desc:0 ""
 GEN_Units_Good_Two:0 "Сосредоточиться на качестве"
 GEN_Units_Good_Two_desc:0 ""
 GEN_Mechanized:0 "Расширить модельный ряд механизированной техники"
 GEN_Mechanized_tt:0 "Получить шаблон дивизии с 2 батальонами §Hлёгких танков§! и 3 батальонами §Hмоторизованной пехоты§!."
 GEN_Mechanized_desc:0 ""
 GEN_Armor_Sov:0 "Миссия по изучению советской бронетехники"
 GEN_Armor_Sov_desc:0 ""
 GEN_Armor_French:0 "Миссия по изучению французской бронетехники"
 GEN_Armor_French_desc:0 ""
 GEN_Armor_Purchase:0 "Закупить устаревшие танки"
 GEN_Armor_Purchase_desc:0 ""
 GEN_Armor_Own:0 "Разработать собственную бронетехнику"
 GEN_Armor_Own_desc:0 ""
 GEN_Exercises:0 "Армейские манёвры"
 GEN_Exercises_desc:0 ""
 GEN_Aviation_Effort:0 "Расширить военно-воздушные силы"
 GEN_Aviation_Effort_desc:0 "Первый шаг к развитию авиационной промышленности — расширение сети аэропортов страны."
 GEN_Foreign_Design:0 "Сосредоточиться на иностранных проектах"
 GEN_Foreign_Design_desc:0 "Возможно, у нас просто недостаточно специалистов для разработки новых самолётов. Сотрудничество с иностранными инженерами — единственный способ не отставать."
 GEN_aircraft_england:0 "Изучить британские самолёты"
 GEN_aircraft_england_desc:0 "Британские коллеги поделились с нами несколькими чертежами лёгких самолётов."
 GEN_aircraft_american:0 "Изучить американские самолёты"
 GEN_aircraft_american_desc:0 "Американские инженеры предложили помощь и предоставили несколько прототипов истребителей."
 GEN_aircraft_italian:0 "Изучить итальянские самолёты"
 GEN_aircraft_italian_desc:0 "Совместные учения позволили нам увидеть, а затем и приобрести несколько итальянских пикирующих бомбардировщиков."
 GEN_aircraft_japanese:0 "Изучить японские самолёты"
 GEN_aircraft_japanese_desc:0 "При создании новых истребителей нас во многом вдохновили скорость и манёвренность японских проектов."
 GEN_aircraft_soviet:0 "Изучить советские самолёты"
 GEN_aircraft_soviet_desc:0 "С этими современными советскими проектами трансполярные полёты наших тяжёлых бомбардировщиков станут обычным явлением."
 GEN_aircraft_german:0 "Изучить германские самолёты"
 GEN_aircraft_german_desc:0 "Германская инженерная школа новаторска во всём. Мы получили чертежи нового пикирующего бомбардировщика, и исследователи ждут нашего одобрения."
 GEN_Fighter_Competition:0 "Конкурс истребителей"
 GEN_Fighter_Competition_desc:0 "Мы проведём авиашоу, чтобы определить самую быструю и манёвренную модель истребителя. "
 GEN_Fighter_Competition_EXPL:0 "Получить некоторое количество §Hсамолётов§! от стран, куда направлялись наши авиационные миссии.\n"
 GEN_Close_Air_Support:0 "Модификации для непосредственной авиационной поддержки"
 GEN_Close_Air_Support_desc:0 "Теперь, когда у нас есть лицензии на иностранные истребители, мы легко сможем модифицировать их для оказания непосредственной поддержки армии."
 GEN_Bomber_Competition:0 "Конкурс бомбардировщиков"
 GEN_Bomber_Competition_desc:0 "Наши бомбардировщики соревнуются в надёжности, дальности и грузоподъёмности."
 GEN_German_Rocketry:0 "Германское ракетостроение"
 GEN_German_Rocketry_desc:0 "Одна из недавно разработанных германских ракет благополучно приземлилась на нашей территории. Мы можем изучить её, прежде чем вернуть германцам."
 GEN_Shared_Air_Doctrine:0 "По образцу иностранных воздушных доктрин"
 GEN_Shared_Air_Doctrine_desc:0 "На последнем конкурсе многие опытные пилоты продемонстрировали мастерство, что вдохновило нас на развитие нынешней воздушной доктрины."
 GEN_Own_Design:0 "Разработать собственные проекты"
 GEN_Own_Design_desc:0 "Развитие отечественных авиационных исследований сохранит самобытность и независимость наших военно-воздушных сил."
 GEN_Own_Fighter:0 "Упор на истребители"
 GEN_Own_Fighter_desc:0 "Проектирование быстрых и манёвренных истребителей — сложная задача, которую наше авиационное бюро успешно решило."
 GEN_Own_Bomber:0 "Упор на бомбардировщики"
 GEN_Own_Bomber_desc:0 "Когда наши великолепные новые бомбардировщики поднимутся в воздух, враг больше не увидит солнца!"
 GEN_Own_Naval_Bomber:0 "Упор на морские бомбардировщики"
 GEN_Own_Naval_Bomber_desc:0 "Последний недостающий элемент — грамотно спроектированный самолёт для действий над морем."
 GEN_Own_Air_Doctrine:0 "Собственная воздушная доктрина"
 GEN_Own_Air_Doctrine_desc:0 "Уникальные проекты самолётов вдохновили нас и на создание уникальной доктрины воздушной войны."
 GEN_aircraft_design_cooperation:0 "Сотрудничество в проектировании самолётов"
 GEN_aircraft_design_cooperation_desc:0 "Нам есть чему поучиться у союзников, но и им есть чему поучиться у нас. Взаимная выгода ещё сильнее сблизит наши авиационные исследования."
 GEN_Naval_Effort:0 "Развитие военно-морских верфей"
 GEN_Naval_Effort_desc:0 "Доступ к морю открывает новые торговые возможности и расширяет наше присутствие в мире."
 GEN_Small_Navy:0 "Сосредоточиться на рейдерском флоте"
 GEN_Small_Navy_desc:0 "Наш флот будет сеять хаос и нарушать работу конвоев в открытом океане, выслеживая свою добычу."
 GEN_Submarine:0 "Новые современные подводные лодки"
 GEN_Submarine_desc:0 "Эффективный современный рейдерский флот строится вокруг подводных лодок."
 GEN_stealth_upgrades:0 "Улучшить скрытность"
 GEN_stealth_upgrades_desc:0 "Наносить удары и исчезать в открытом море гораздо проще, если противник не может обнаружить подлодку. Оснастить флот шноркелями будет разумным решением."
 GEN_Sea_Dominance:0 "Сосредоточиться на господстве на море"
 GEN_Sea_Dominance_desc:0 "Наш флот будет отважно стоять на поверхности и уничтожать любую вражескую эскадру, появившуюся на горизонте. Мы покажем миру, что линкоры — будущее войны."
 GEN_Study_Ships:0 "Изучить иностранные проекты кораблей"
 GEN_Study_Ships_desc:0 "Наши порты постоянно посещают иностранные корабли. Несколько «проверок безопасности» наверняка позволят узнать больше о новейших типах кораблей."
 GEN_Ships_American:0 "Миссия на верфи [USA.GetAdjective]"
 GEN_Ships_American_desc:0 "Наши хорошие отношения с США стали ещё теплее после совместных посещений военно-морских верфей."
 GEN_Ships_England:0 "Миссия на верфи [ENG.GetAdjective]"
 GEN_Ships_England_desc:0 "Британские военно-морские инженеры показали нам несколько способов повысить качество и сократить время строительства лёгких кораблей."
 GEN_Purchase_Ships:0 "Заказать строительство крупных кораблей"
 GEN_Purchase_Ships_desc:0 ""
 GEN_Dockyards:0 "Расширить мощности верфей"
 GEN_Dockyards_desc:0 "Для создания полноценного флота необходимо расширить мощности верфей на новых побережьях."
 GEN_Carrier:0 "Упор на авианосцы"
 GEN_Carrier_desc:0 "Наше военно-морское бюро разрабатывает новый прототип авианосца."
 GEN_Navy_Aircrafts:0 "Модели палубной авиации"
 GEN_Navy_Aircrafts_desc:0 "Авианосец без самолётов — всего лишь металлическая коробка, плавающая по океану. Оснащение его новыми морскими бомбардировщиками займёт время, но оно того стоит."
 GEN_Battleship:0 "Упор на линкоры"
 GEN_Battleship_desc:0 "По недавно разработанным проектам будет построен новый блестящий линейный крейсер. Пусть враги узнают, что у нас есть огонь и ярость морей!"
 GEN_Destroyer:0 "Упор на эсминцы"
 GEN_Destroyer_desc:0 "Тяжёлые корабли особенно уязвимы для торпедных атак. Развитие и строительство эсминцев решит эту проблему."
 GEN_Cruisers:0 "Упор на крейсеры"
 GEN_Cruisers_desc:0 "Хотя тяжёлый крейсер не так мощен, как линкор или авианосец, он прекрасно усиливает огневую мощь флота и заслуживает дополнительного финансирования."
 GEN_Naval_Doctrine:0 "Улучшить военно-морскую доктрину"
 GEN_Naval_Doctrine_desc:0 "Новые корабли бесполезны без подходящей тактики — необходимо немедленно улучшить нашу доктрину!"
 GEN_Generals:0 "Расширить Генеральный штаб"
 GEN_Generals_EXPL:0 "Мы §Hрасширим Генеральный штаб§! и получим подготовленных §Hгенералов§! и §Hадмиралов§!.\nКоличество и качество генералов зависит от §Hвыполненных§! фокусов."
 GEN_Generals_Other_tt:0 "\nЗавершение этого фокуса даст дополнительного командира при выполнении фокуса §H«Расширить Генеральный штаб»§!."
 GEN_Generals_Other_nav_tt:0 "\nЗавершение этого фокуса даст дополнительного адмирала при выполнении фокуса §H«Расширить Генеральный штаб»§!."
 GEN_Generals_desc:0 "Вооружённым силам нашей страны недостаёт должной организации. Создание национального генерального штаба повысит эффективность действующих армий."
 GEN_State_Matter:0 "Сосредоточиться на внутренних делах"
 GEN_State_Matter_desc:0 "Никогда прежде наша страна не была настолько разделена и раздираема внутренней борьбой за власть. Создание сильного и единого правительства должно стать первоочередной задачей."
 GEN_Collectivist_Ethos:0 "Коллективистский дух"
 GEN_Collectivist_Ethos_desc:0 "Сильное государство — это однопартийное государство. Подавление любой демократической оппозиции лишь укрепит нынешний режим."
 GEN_Organise_Youth:0 "Организовать молодёжь"
 GEN_Organise_Youth_desc:0 "Во всех уголках нашей страны слышны голоса молодых людей, восхваляющих нынешний режим. Их общую поддержку можно использовать, чтобы укрепить веру народа в наше дело. "
 GEN_Com_Generals:0 "Расширить коммунистическое военное командование"
 GEN_Com_Generals_desc:0 "Многие образованные крестьяне и рабочие охотно вступают в армию, пополняя нехватку офицерских кадров."
 GEN_Collectivist_Propaganda:0 "Рабочая культура"
 GEN_Collectivist_Propaganda_desc:0 "Перераспределённые богатства успешно направляются на улучшение работы заводов и увеличение объёмов производства."
 GEN_Conquer:0 "Экспансионистская политика"
 GEN_Conquer_desc:0 "Военная сила и мощь нашего режима в сочетании со слабостью и некомпетентностью правительств соседей не оставляют нам выбора, кроме как принести им правильный порядок."
 GEN_Intervene:0 "Политика вмешательства"
 GEN_Intervene_desc:0 "Наше дело можно продвигать по всему миру при помощи небольших бригад, которые будут поддерживать дружественные режимы идеологической подготовкой, штабным планированием и военной помощью. "
 GEN_Isolated:0 "Изолированное государство"
 GEN_Isolated_desc:0 "Наше правление станет синонимом политической стабильности и национального процветания. Но если кто-то пренебрежёт нашим нейтралитетом, ему придётся дорого за это заплатить!"
 GEN_Forced_Conscription:0 "Закон о воинской повинности"
 GEN_Forced_Conscription_desc:0 "Если мы хотим выжить в мире, превратившемся в пороховую бочку, нам потребуется намного больше солдат для защиты наших ценностей."
 GEN_Fanaticism:0 "Идеологический фанатизм"
 GEN_Fanaticism_desc:0 "Нет нужды ограничивать нашу пропаганду. Если люди готовы умереть за наше дело, зачем мешать им?"
 GEN_Liberty_Ethos:0 "Дух свободы"
 GEN_Liberty_Ethos_desc:0 "Новое правительство будет работать эффективнее, если станет прислушиваться ко всем группам населения, невзирая на пол, расу или политическую принадлежность."
 GEN_Strenghten_Monarchy:0 "Автократия"
 GEN_Strenghten_Monarchy_desc:0 "Сильная фигура во главе страны, доносящая идеи нынешнего правительства до общества, в конце концов не такая уж плохая мысль. Пока сохраняются свобода слова и собраний, всё будет в порядке."
 GEN_Strenghten_Democracy:0 "Укрепить демократию"
 GEN_Strenghten_Democracy_desc:0 "Доверие народа и его преданность нашему делу неоспоримы: новый законодательный период принесёт массам ещё больше либеральных ценностей!"
 GEN_Defence_Act:0 "Закон о национальной безопасности"
 GEN_Defence_Act_desc:0 "Продвижение лояльных сотрудников полиции, военных и специалистов разведки укрепит положение правительства и защитит законодательный аппарат от иностранного влияния."
 GEN_Brigades:0 "Сформировать интернациональные бригады"
 GEN_Brigades_desc:0 "Если мы хотим, чтобы наши военные возможности воспринимали всерьёз на мировой арене, следует увеличить присутствие наших добровольцев по всему миру."
 GEN_Military_Build:0 "Оружие защищает нацию"
 GEN_Military_Build_desc:0 "Безопасность страны связана с численностью её армии. Чтобы удовлетворить растущие потребности солдат, необходимо расширить военную промышленность!"
 GEN_Anti_Invasion:0 "Укрепления защищают нацию"
 GEN_Anti_Invasion_desc:0 "Оборона ключевых промышленных и исследовательских центров станет эффективнее, если укрепить наиболее уязвимые позиции и увеличить их гарнизоны."
 GEN_red_army:0 "Красная армия: [ROOT.GetAdjective]"
 GEN_red_army_desc:0 "Только вооружённые массы смогут освободить себя."
 ARCTIC_winter_readiness:0 "Готовность к зиме"
 ARCTIC_recruit_penguins:0 "Призвать пингвинов"
 ARCTIC_recruit_penguins_desc:0 "В Арктике людей мало и они живут далеко друг от друга, поэтому нам придётся призвать наших самых нарядных соотечественников — люриков. Знаю, вам обещали пингвинов, но бескрылая гагарка (Pinguinus impennis) тоже когда-то жила в Арктике, а по-французски и её, и люрика называют «pingouin». В английском же пингвины живут в Южном полушарии. Арктические птицы милы и воинственны, а языки устроены сложно."
 ARCTIC_the_day_before_the_storm_hit:0 "День перед ударом бури"
 ARCTIC_the_day_before_the_storm_hit_desc:0 "Пингвинья сверхдержава почти два десятилетия после окончания прошлой войны готовилась вторгнуться в Китай, и теперь, когда весь мир снова оказался в горячей воде, всё очень быстро вышло на свет."
 ARCTIC_organize_army_structure:0 "Организовать структуру армии"
 ARCTIC_organize_army_structure_desc:0 "Мы реорганизуем новую армию, чтобы упростить связь и централизовать власть генерального штаба."
 ARCTIC_winter_training:0 "Зимняя подготовка"
 ARCTIC_winter_training_desc:0 "Холодная погода — реальность, к которой мы должны быть готовы во время боевых действий."
 ARCTIC_sharpshooting_tradition:0 "Традиции меткой стрельбы"
 ARCTIC_sharpshooting_tradition_desc:0 "В тайге или тундре рекомендуется всегда иметь при себе винтовку. Для армии это верно вдвойне."
 ARCTIC_start_them_young:0 "Учить с юных лет"
 ARCTIC_start_them_young_desc:0 "При нашей малочисленности и суровых природных условиях умение стрелять является жизненно важным навыком."
 ARCTIC_komi_can_communicate:0 "Коми умеют связываться"
 ARCTIC_komi_can_communicate_desc:0 "Огромные расстояния на землях народа коми затрудняют координацию частей, поэтому инвестиции в средства связи необходимы для улучшения нашей армии."
