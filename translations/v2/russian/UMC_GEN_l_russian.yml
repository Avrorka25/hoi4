 collectivist_ethos_focus_desc:0 ""
 AE_PA_treaty_prospective_member:0 "Кандидат в Панафриканский договор"
 AE_PA_treaty_prospective_member_desc:0 "Эта страна приглашена присоединиться к Панафриканскому договору и имеет право стать его полноправным участником, пока сохраняет мир."
 AE_PA_treaty_member:0 "Участник Панафриканского договора"
 AE_PA_treaty_member_desc:0 "Эта страна официально ратифицировала все соглашения Панафриканского договора."
 r56_generic_invest_reward_1:0 "Убытки от инвестиций"
 r56_generic_invest_reward_1_desc:0 "Наши инвестиционные усилия обернулись неудачей и обходятся нам дороже, чем первоначально планировалось."
 r56_generic_invest_reward_2:0 "Низкая доходность инвестиций"
 r56_generic_invest_reward_2_desc:0 "Наши инвестиционные усилия обернулись неудачей и возвращают меньше средств, чем было вложено изначально."
 r56_generic_invest_reward_3:0 "Безубыточные инвестиции"
 r56_generic_invest_reward_3_desc:0 "Наши инвестиции едва окупаются и возвращают примерно столько же, сколько было вложено."
 r56_generic_invest_reward_4:0 "Доход от инвестиций"
 r56_generic_invest_reward_4_desc:0 "Наши недавние инвестиции приносят плоды и возвращают больше средств, чем было вложено."
 r56_generic_invest_reward_5:0 "Доход от инвестиций"
 r56_generic_invest_reward_5_desc:0 "Наши недавние инвестиции приносят плоды и возвращают больше средств, чем было вложено."
 r56_generic_invest_reward_6:0 "Доход от инвестиций"
 r56_generic_invest_reward_6_desc:0 "Наши недавние инвестиции приносят плоды и возвращают больше средств, чем было вложено."
 r56_generic_invest_reward_7:0 "Великолепная доходность инвестиций"
 r56_generic_invest_reward_7_desc:0 "Наши недавние инвестиции приносят плоды и возвращают намного больше средств, чем было вложено."
 abc.1.t:0 "Доктрина Генерального штаба"
 abc.1.desc:0 "Теперь, когда мы создаём Генеральный штаб, перед нами два пути. Можно тщательно планировать и готовиться к будущим войнам: это займёт гораздо больше времени, зато даст огромное преимущество в хаосе боевых действий. Либо мы можем практиковать быстрое планирование непосредственно на месте и развивать способность армии к импровизации, делая реакцию на действия противника гораздо быстрее и решительнее. Вопрос лишь в том, какой подход лучше всего подходит армии [ROOT.GetAdjective]?"
 abc.1.a:0 "Наши военные планы должны быть тщательно продуманы, сколько бы времени это ни заняло."
 abc.1.b:0 "Реагировать на действия врага нужно быстро, чтобы избежать катастрофических последствий!"
