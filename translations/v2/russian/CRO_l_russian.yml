l_russian:
 croatia_focus:0 "Национальные фокусы Хорватии"
 CRO_become_croatia:0 "Стать Хорватией"
 CRO_ivan_orsanic:0 "Иван Оршанич"
 CRO_milan_budak:0 "Милан Будак"
 CRO_vladimir_nazor:0 "Владимир Назор"
 CRO_bozidar_magovac:0 "Божидар Маговац"
 CRO_andrija_hebrang:0 "Андрия Хебранг"
 CRO_august_kosutic:0 "Август Кошутич"
 CRO_mladen_lorkovic:0 "Младен Лоркович"
 CRO_ante_vokic:0 "Анте Вокич"
 CRO_djuro_jakcin2:0 "Джуро Якчин"
 CRO_djuro_jakcin3:0 "Джуро Якчин"
 CRO_vjekoslav_vrancic:0 "Векослав Вранчич"
 CRO_franjo_dzal:0 "Франьо Джал"
 CRO_ivan_tomasevic:0 "Иван Томашевич"
 CRO_vlado_popovic:0 "Владо Попович"
 CRO_slavko_stancer2:0 "Славко Штанцер"
 CRO_rafael_boban:0 "Рафаэль Бобан"
 CRO_tomislav_II:0 "Томислав II"
 CRO_tomislav_II_desc:0 "Принц Аймоне Савойский, двоюродный брат короля Италии Виктора Эммануила III, принял хорватскую корону. Чтобы отметить это событие как возрождение хорватской монархии, он выбрал имя Томислав II, объявив себя преемником Томислава — основателя Хорватии."
 CRO_idea_communist_militias:0 "Коммунистическое ополчение"
 CRO_idea_economic_centralization:0 "Экономическая централизация"
 CRO_idea_license_production:0 "Лицензионное производство"
 CRO_idea_trained_mechanics:0 "Подготовленные механики"
 cro_diplomacy_focus:0 "Дипломатия: [CRO.GetAdjective]"
 CRO_home_guard:0 "Создать Хорватское домобранство"
 CRO_home_guard_desc:0 "Чтобы обеспечить безопасность страны, необходимо создать постоянную армию для защиты нашей территории — Хорватское домобранство."
 CRO_small_arms:0 "Повысить практичность стрелкового оружия"
 CRO_small_arms_desc:0 "Пределы того, какое снаряжение способна нести пехота, постоянно расширяются. Мы сосредоточимся на обеспечении войск лучшими доступными средствами."
 CRO_improve_conscripts_equipment:0 "Улучшить снаряжение призывников"
 CRO_improve_conscripts_equipment_desc:0 "Хотя призывников невозможно вооружить лучшим доступным оружием, необходимо обеспечить их достаточным количеством снаряжения, чтобы они могли сражаться максимально эффективно."
 CRO_motorization_effort:0 "Моторизованный корпус"
 CRO_motorization_effort_desc:0 "Мобильность и защита имеют решающее значение для безопасной переброски пехоты на поле боя и обратно. Развитие этих направлений позволит нам действовать быстрее."
 CRO_structured_logistics:0 "Структурированная логистика"
 CRO_structured_logistics_desc:0 "Из-за ограниченных производственных возможностей мы не можем позволить себе терять ценное снаряжение, поэтому структурированная и прозрачная система логистики жизненно важна для сохранения способности вести войну."
 CRO_recovery_teams:0 "Эвакуационные команды"
 CRO_recovery_teams_desc:0 "Чтобы ещё сильнее сократить потери снаряжения, необходимо организовать команды для сбора оружия и техники на полях сражений."
 CRO_army_maneuvers:0 "Армейские манёвры"
 CRO_army_maneuvers_desc:1 "Чтобы привести армию в надлежащую форму, необходимо провести новые манёвры. Полученный опыт, несомненно, даст и новые представления о современной войне."
 CRO_supremacy_of_offense:0 "Превосходство наступления"
 CRO_supremacy_of_offense_desc:1 "Наступательные действия — ключ к победе, и именно они должны определять нашу общую стратегию и развитие новых доктрин."
 CRO_supremacy_of_defense:0 "Превосходство обороны"
 CRO_supremacy_of_defense_desc:1 "Окружённые врагами со всех сторон, мы должны продержаться достаточно долго, чтобы союзники отвлекли на себя основное давление. Разработка новых военных доктрин должна быть сосредоточена на защите нашей родины."
 CRO_artillery_regiments:0 "Артиллерийские полки"
 CRO_artillery_regiments_desc:1 "Введение мощных артиллерийских полков в состав наших дивизий значительно повысит их общую боеспособность."
 CRO_domestic_artillery_production:0 "Отечественное производство артиллерии"
 CRO_domestic_artillery_production_desc:1 "Стимулируя разработку современных отечественных артиллерийских систем, мы сможем обеспечить войска лучшей огневой поддержкой, на которую способны."
 CRO_anti_tank_defenses:0 "Противотанковая оборона"
 CRO_anti_tank_defenses_desc:1 "Танк занял центральное место в современной войне, поэтому необходимы новые разработки в области полевых противотанковых орудий, которые позволят пехоте уничтожать этих бронированных исполинов."
 CRO_mountain_brigades:0 "Горные бригады"
 CRO_mountain_brigades_desc:1 "Значительная часть нашей страны покрыта горами, поэтому необходимо сформировать специальные бригады, подготовленные к боям на такой местности."
 CRO_armored_cavalry:0 "Бронированная кавалерия"
 CRO_armored_cavalry_desc:0 "Механизация кавалерии и переход на полугусеничную технику обеспечат высокую мобильность и дополнительную защиту бойцам подразделений. Хотя такой переход, несомненно, будет дорогостоящим для промышленности, мы должны сделать всё возможное ради быстрой победы на поле боя."
 CRO_tank_conversions:0 "Переделка танков"
 CRO_tank_conversions_desc:1 "Сегодня нам могут понадобиться танки, а уже в следующем месяце — самоходная артиллерия или истребители танков на том же шасси. Наша бронетехника должна оставаться гибкой и легко приспосабливаться к текущим потребностям."
 CRO_modern_tanks:0 "Современные танки"
 CRO_modern_tanks_desc:1 "С появлением крупнокалиберного основного вооружения бронетехника ушла далеко вперёд от простой идеи безопасной перевозки войск из точки А в точку Б. Чтобы соперничать с соседями, мы должны создать собственные современные танки."
 CRO_equipment_effort_2:0 "Развитие снаряжения II"
 CRO_equipment_effort_2_desc:0 "Мы продолжим работу, чтобы пехота и вспомогательные части были вооружены лучшим снаряжением своего времени."
 CRO_mechanization_effort:0 "Развитие механизации"
 CRO_mechanization_effort_desc:0 "Переосмысливая возможности моторизованной пехоты, мы можем расширить пределы того, какую технику способны создавать сегодня."
 CRO_doctrine_effort_2:0 "Развитие доктрины II"
 CRO_doctrine_effort_2_desc:0 "За межвоенные годы и в ходе последних конфликтов поле боя изменилось. Необходимо постоянно пересматривать наши доктрины с учётом этих перемен."
 CRO_equipment_effort_3:0 "Развитие снаряжения III"
 CRO_equipment_effort_3_desc:0 "Вместо копирования или закупки иностранного снаряжения мы должны стать мировым лидером в области пехотного вооружения."
 CRO_armor_effort:0 "Развитие бронетехники"
 CRO_armor_effort_desc:0 "Применив опыт механизации пехоты, мы сможем усовершенствовать и бронетехнику."
 CRO_special_forces:0 "Войска специального назначения"
 CRO_special_forces_desc:0 "Нам нужны элитные войска; горные части и десантники должны стать приоритетом."
 CRO_aviation_effort:0 "Основать Хорватскую авиационную школу"
 CRO_aviation_effort_tt:0 "Недостаточно ячеек для строительства §Yавиабазы§!"
 CRO_aviation_effort_desc:0 "Ни в одной области технологический прогресс не идёт столь быстро, как в воздушной войне. Авиация — сфера, которой должна овладеть любая современная страна."
 CRO_fighter_focus:0 "Упор на истребители"
 CRO_fighter_focus_desc:0 "Воздушные бои Великой войны были далеко не последними. Опережая других в разработке истребителей, мы получим преимущество в будущем."
 CRO_bomber_focus:0 "Упор на бомбардировщики"
 CRO_bomber_focus_desc:0 "В будущем люди будут рассказывать об ужасах современных войн и вспоминать огонь, падающий с небес. Мы сделаем всё, чтобы эти истории рассказывали наши враги."
 CRO_airplanes_licenses:0 "Лицензии на самолёты"
 CRO_airplanes_licenses_desc:0 "Поскольку наши конструкторские возможности ограничены, следует приобрести лицензии на самолёты и оснастить военно-воздушные силы современными истребителями."
 CRO_form_mechanics:0 "Подготовить механиков"
 CRO_form_mechanics_desc:0 "В конце концов, какая разница, сбит ли самолёт вражескими пулями, загорелся ли у него двигатель или он не может подняться в воздух из-за технической неисправности, если мы не способны его починить? Чтобы снизить риск поломок, необходимы специализированные и хорошо подготовленные механики, знающие устройство самолётов лучше, чем хирург знает анатомию."
 CRO_aviation_effort_2:0 "Передовая воздушная доктрина"
 CRO_aviation_effort_2_desc:0 "Для полноценного взаимодействия авиации с другими родами войск потребуются дальнейшие достижения в этой области."
 CRO_CAS_effort:0 "Развитие штурмовой авиации"
 CRO_CAS_effort_desc:0 "Современной армии требуется поддержка техники как на земле, так и в воздухе."
 CRO_rocket_effort:0 "Развитие ракетной техники"
 CRO_rocket_effort_desc:0 "Ракетные и реактивные двигатели позволяют пилотируемым и беспилотным аппаратам развивать невиданные прежде скорости. Освоив эти технологии первыми, мы сможем застать врага врасплох."
 CRO_NAV_effort:0 "Развитие морской авиации"
 CRO_NAV_effort_desc:0 "Подобно тому как новая морская война ведётся под поверхностью воды, часть её теперь происходит и в воздухе над морем."
 CRO_expand_the_split_shipyards:0 "Расширить верфи Сплита"
 CRO_expand_the_split_shipyards_desc:0 "Наша существующая судостроительная промышленность в Далмации прекрасно подходит для расширения и располагает достаточными мощностями для строительства более крупных военных кораблей."
 CRO_coastal_defense:0 "Оборона Далмации"
 CRO_coastal_defense_desc:0 "Мы не можем надеяться соперничать с флотами противников в Адриатике. Вместо этого необходимо подготовить побережье к отражению любых морских вторжений."
 CRO_contest_the_adriatic:0 "Оспорить господство в Адриатике"
 CRO_contest_the_adriatic_desc:0 "Оборона наших берегов начинается в море перед ними. Необходимо разработать новые военно-морские тактики и стратегии, чтобы установить контроль над Адриатическим морем или хотя бы оспаривать его."
 CRO_light_cruiser:0 "Разработать лёгкие крейсеры"
 CRO_light_cruiser_desc:1 "Нам нужен новый современный крейсер, который станет основой Адриатического флота."
 CRO_naval_bombers:0 "Морские бомбардировщики"
 CRO_naval_bombers_desc:1 "Адриатическое море длинное, но узкое, поэтому самолёты с наших аэродромов легко могут действовать над ним. Разработка специализированных морских бомбардировщиков значительно повысит шансы флота в борьбе с более сильными противниками."
 CRO_heavy_cruiser_project:0 "Проект тяжёлого крейсера"
 CRO_heavy_cruiser_project_desc:1 "Чтобы достойно противостоять вражеским флотам, нам нужны корабли большего водоизмещения и с более тяжёлым вооружением. Тяжёлые крейсеры станут хорошим шагом вперёд по сравнению с лёгкими крейсерами, которые до сих пор служили основой нашего флота."
 CRO_modern_destroyers:0 "Современные эсминцы"
 CRO_modern_destroyers_desc:1 "Эсминцы являются основой любого флота, и мы должны убедиться, что наши корабли не уступают вражеским."
 CRO_skilled_pilots:0 "Опытные пилоты"
 CRO_skilled_pilots_desc:0 "Множество островов у далматинского побережья требует тщательно координировать каждый приказ и чётко передавать его, чтобы избегать аварий и максимально использовать особенности местности."
 CRO_adriatic_specialization:0 "Адриатическая специализация"
 CRO_adriatic_specialization_desc:0 "Множество островов у далматинского побережья представляет собой особенность, которую мы можем использовать, чтобы застать врагов врасплох."
 CRO_build_the_nation:0 "Строить нацию"
 CRO_build_the_nation_desc:0 "Сосредоточить все политические усилия на стремительном развитии гражданской промышленности."
 CRO_research_collaboration:0 "Научное сотрудничество: [YUG.GetAdjective]"
 CRO_research_collaboration_desc:0 "Будучи автономным регионом, мы обязаны делиться всеми важными открытиями с центральным правительством [YUG.GetAdjective]."
 CRO_prospect_for_resources:0 "Разведать ресурсы"
 CRO_prospect_for_resources_desc:0 "В нашей земле скрываются ресурсы, которые пригодятся в борьбе нынешней эпохи. Мы должны как можно скорее извлечь их и использовать с максимальной пользой."
 CRO_construction_effort_tt:0 "Недостаточно ячеек для строительства §Yгражданских фабрик§!"
 CRO_construction_effort:0 "Развитие строительства"
 CRO_construction_effort_desc:0 "Развитие строительства"
 CRO_production_effort:0 "Развитие производства"
 CRO_production_effort_tt:0 "Недостаточно ячеек для строительства §Yвоенных заводов§!"
 CRO_production_effort_desc:0 "Если можно строить тракторы, можно строить и танки! Мы не должны допустить отставания военного производства."
 CRO_construction_effort_2:0 "Развитие строительства II"
 CRO_construction_effort_2_desc:0 "Дальнейшее расширение фабрик позволит ускорить производство товаров для торговли и последующего строительства."
 CRO_industrial_planning:0 "Промышленное планирование"
 CRO_industrial_planning_desc:0 "Чтобы продолжать промышленное развитие, необходимо разработать долгосрочные стратегии и найти подходящие территории."
 CRO_expand_the_sarajevo_arsenals:0 "Расширить арсеналы Сараева"
 CRO_expand_the_sarajevo_arsenals_desc:1 "Нам нужны дополнительные производственные мощности, чтобы удовлетворять растущие потребности армии. Арсеналы Сараева прекрасно подходят для расширения, и мы немедленно выделим на это ресурсы."
 CRO_production_effort_2:0 "Поддержать промышленность тяжёлой техники"
 CRO_production_effort_2_desc:0 "Будучи одним из ведущих европейских портов, Антверпен прекрасно подходит для развития промышленности, ориентированной на экспорт."
 CRO_production_effort_3:0 "Поддержать производителей военных самолётов"
 CRO_production_effort_3_desc:0 "Необходимо и дальше расширять военные заводы, чтобы удовлетворить спрос на новое снаряжение."
 CRO_infrastructure_effort:0 "Развитие инфраструктуры"
 CRO_infrastructure_effort_desc:0 "Страна без надлежащей инфраструктуры не способна осуществлять передовые проекты или крупное строительство."
 CRO_infrastructure_effort_tt:0 "Недостаточно ячеек для строительства §Yинфраструктуры§!"
 CRO_extract_chromium:0 "Добывать хром"
 CRO_extract_chromium_desc:0 "Хром — наш главный ресурс, и мы должны довести его добычу до максимума."
 CRO_extract_oil:0 "Добывать нефть"
 CRO_extract_oil_desc:0 "Мы подтвердили наличие нефти в регионе после открытия нескольких небольших месторождений на Паннонской равнине. Теперь, когда существование этих ресурсов окончательно подтверждено, необходимо как можно скорее начать их разработку, чтобы снизить зависимость от дорогого импорта."
 CRO_expand_the_university_of_zagreb:0 "Расширить Загребский университет"
 CRO_expand_the_university_of_zagreb_desc:0 "Загребский университет уже является крупнейшим в стране с большим отрывом. Но если выделить больше средств на исследования, особенно в областях, способных привести к военным инновациям, мы сможем получить решающее преимущество на поле боя."
 CRO_develop_bosnia:0 "Развивать Боснию"
 CRO_develop_bosnia_desc:0 "Боснийцев не существует; это просто мусульмане народа [CRO.GetAdjective]. Следовательно, Босния населена народом [CRO.GetAdjective], и её жители заслуживают такой же заботы, как и все остальные представители [CRO.GetAdjective]."
 CRO_construction_effort_3:0 "Развитие промышленности III"
 CRO_construction_effort_3_desc:0 "Расширение инфраструктурной сети значительно повысило наши возможности в строительстве."
 CRO_nuclear_effort:0 "Мощь Томислава"
 CRO_nuclear_effort_desc:0 "Неужели физики зашли слишком далеко?"
 CRO_extra_tech_slot:0 "Дополнительная ячейка исследований"
 CRO_extra_tech_slot_desc:0 "Расширение промышленности и другие недавние достижения могут позволить нам одновременно вести больше исследований и разработок."
 CRO_extra_tech_slot_2:0 "Дополнительная ячейка исследований II"
 CRO_extra_tech_slot_2_desc:0 "Стремительная индустриализация страны открыла новые возможности для исследований и разработок, которыми следует воспользоваться."
 CRO_technology_sharing:0 "Обмен технологиями"
 CRO_technology_sharing_desc:0 "Обмениваясь технологическими достижениями с союзниками, весь наш альянс сможет эффективнее проводить исследования и разработки военного времени."
 CRO_secret_weapons:0 "Секретное оружие"
 CRO_secret_weapons_desc:0 "Соблазнительно направить все дополнительные ресурсы на разработку танков и самолётов, но секрет победы в войнах лежит в совершенно новых областях науки: электронике, ракетостроении и ядерных исследованиях."
 CRO_political_effort:0 "Организовать новое государство"
 CRO_political_effort_desc:0 "Наша первоочередная задача — создать основные органы государственной власти по всей стране."
 CRO_collectivist_ethos:0 "Усилить синдикаты"
 CRO_collectivist_ethos_desc:0 "Наши враги могут разделять и покорять слабые страны, но наш народ останется един — один за всех и все за одного."
 CRO_liberty_ethos:0 "Демократический консенсус"
 CRO_liberty_ethos_desc:0 "В эпоху идеологических фанатиков, стремящихся задушить человеческий дух, мы будем защищать личные свободы и права человека."
 CRO_militarism:0 "Создать ополчение усташей"
 CRO_militarism_desc:0 "Чтобы бороться с врагами государства, необходимо набирать бойцов среди воинственно настроенных добровольцев и направлять их против наших смертельных идеологических противников, особенно коммунистов."
 CRO_political_correctness:0 "Политическая корректность"
 CRO_political_correctness_desc:0 "Люди, придерживающиеся слегка спорных или попросту неудобных взглядов, похоже, обеспокоены существованием всеобъемлющего заговора против них. Кажется, это превосходная идея."
 CRO_neutrality_focus:0 "Курс на нейтралитет"
 CRO_neutrality_focus_desc:0 "Пусть другие утверждают, что для выбора стороны в мировом конфликте требуются храбрость и мудрость, мы знаем: ещё больше их нужно, чтобы отказаться выбирать."
 CRO_interventionism_focus:0 "Курс на интервенционизм"
 CRO_interventionism_focus_desc:0 "Мы ценим свободу всех людей, а не только собственных граждан. Если для предотвращения тирании потребуется война — так тому и быть."
 CRO_military_youth:0 "Усташская молодёжь"
 CRO_military_youth_desc:0 "Организации, прививающие молодёжи дисциплину и политические знания, с ранних лет воспитают преданность и готовность к самопожертвованию."
 CRO_deterrence:0 "Сдерживание"
 CRO_deterrence_desc:0 "Действуя в одиночку, мы редко извлекаем пользу из войны. К счастью, нам известно: лучшая оборона — та, чья сила настолько очевидна, что применять её не приходится."
 CRO_volunteer_corps:0 "Добровольческий корпус"
 CRO_volunteer_corps_desc:0 "Принуждать людей умирать за идеалы свободы было бы иронично, но ничто не мешает создать возможности для тех, кто добровольно хочет помочь народам за рубежом."
 CRO_paramilitarism:0 "Парамилитаризм"
 CRO_paramilitarism_desc:0 "Военные принципы применимы и за пределами армии. Создание полувоенных формирований в дополнение к вооружённым силам позволит дать военную подготовку большему числу людей."
 CRO_indoctrination_focus:0 "Идеологическая обработка"
 CRO_indoctrination_focus_desc:0 "Мы установили, что наша идеология основана на истине, а значит, её можно преподавать как истину. Образование и средства массовой информации должны отражать этот урок."
 CRO_foreign_expeditions:0 "Зарубежные экспедиции"
 CRO_foreign_expeditions_desc:0 "Раз враги готовы вмешиваться в далёкие конфликты ради своих идеалов, мы должны быть готовы делать то же самое ради наших."
 CRO_why_we_fight:0 "За что мы сражаемся"
 CRO_why_we_fight_effect:0 "Если у нас нет национального духа §Y«Нейтральная внешняя политика»§!, мы можем создавать альянсы.\n"
 CRO_why_we_fight_desc:0 "Мир становится всё опаснее. Наш народ должен увидеть зверства тех, кто жаждет власти. Мы объединим людей вокруг нашего дела и убедимся, что каждый готов сражаться за нашу свободу."
 CRO_political_commissars:0 "Политические комиссары"
 CRO_political_commissars_desc:0 "Чтобы наша политика исполнялась и в военной сфере, мы введём в ряды вооружённых сил политически назначаемых должностных лиц."
 CRO_organized_partizans:0 "Организованные партизаны"
 CRO_organized_partizans_desc:0 "Чтобы противостоять угрозе вторжения, необходимо заранее организовать ячейки сопротивления. Эти группы подготовят тайники, возможные площадки для сброса грузов и завербуют местных жителей для сбора разведданных. Всё это позволит оказывать максимальное давление на тылы противника."
 CRO_internationalism_focus:0 "Курс на интернационализм"
 CRO_internationalism_focus_desc:0 "Идеология не знает границ. Другая страна может называть себя суверенной, но наши убеждения стоят выше подобных притязаний."
 CRO_nationalism_focus:0 "Национальное возрождение"
 CRO_nationalism_focus_desc:0 "На протяжении веков нами правили иностранные князья, считая нас частью своих владений. Этой эпохе пришёл конец: Хорватия вновь обретёт истинный дух Томислава I и станет господствовать на Балканах."
 CRO_ideological_fanaticism_communism:0 "Идеологический фанатизм"
 CRO_ideological_fanaticism_communism_desc:0 "Наши политические ценности и цели заслуживают смерти за них не меньше любой древней веры. Каждый последователь должен быть готов встретить смерть, а отступникам тоже следует приготовиться к ней."
 CRO_ideological_fanaticism_ustasha:0 "Идеологический фанатизм"
 CRO_ideological_fanaticism_ustasha_desc:0 "Наши политические ценности и цели заслуживают смерти за них не меньше любой древней веры. Каждый последователь должен быть готов встретить смерть, а отступникам тоже следует приготовиться к ней."
 CRO_anti_partizan_tactics:0 "Антипартизанская тактика"
 CRO_anti_partizan_tactics_desc:0 "Партизан необходимо разбить и изгнать из гор. Чтобы перенести борьбу в самое сердце контролируемых ими земель, регулярные патрули должны обеспечивать безопасность деревень, а мы — собирать разведданные у лояльных местных жителей. Другого выбора нет, если мы хотим победить коммунистов и раз и навсегда завершить эту борьбу."
 CRO_faithful_ally:0 "Верный союзник"
 CRO_faithful_ally_desc:0 "Своей решимостью защищать родную землю и кровью, пролитой ради общей европейской победы над иудео-большевизмом, мы заслужили признание в качестве полноправного участника Оси. Этому помогла блестящая работа наших френологов, доказавших, что, в отличие от этих грязных сербов, мы являемся прямыми потомками арийцев, переселившихся на юг."
 CRO_catholic_dominance_focus:0 "Господство католицизма"
 CRO_catholic_dominance_focus_desc:0 "На протяжении веков хорваты следовали учению Римско-католической церкви. После насильственного объединения с Сербией многие ради личной выгоды перешли в православие. Этому необходимо положить конец: каждый христианин народа [CRO.GetAdjective] должен признать власть Его Святейшества Папы Римского."
 CRO_secularism_focus:0 "Секуляризм"
 CRO_secularism_focus_desc:0 "Вера ни в коем случае не должна вмешиваться в государственные дела. Она должна оставаться исключительно личным вопросом, а духовенству следует запретить участие в политике."
 CRO_integrate_muslim_croats_focus:0 "Интегрировать мусульман народа [CRO.GetAdjective]"
 CRO_integrate_muslim_croats_focus_desc:0 "Мусульмане могут исповедовать другую религию, но они всё равно являются частью народа и должны быть полностью приняты как представители [CRO.GetAdjective]."
 CRO_bosnian_muslim_conscription_focus:0 "Призвать боснийских мусульман"
 CRO_bosnian_muslim_conscription_focus_desc:0 "Поскольку мусульмане Боснии принадлежат к народу [CRO.GetAdjective], они должны служить в армии вместе со своими этническими братьями."
 CRO_integrate_orthodox_croats_focus:0 "Интегрировать православных народа [CRO.GetAdjective]"
 CRO_integrate_orthodox_croats_focus_desc:0 "Хотя мы плохо обращались с православными представителями [CRO.GetAdjective], необходимо признать: даже если добропорядочные представители [CRO.GetAdjective] принадлежат к Римско-католической церкви, те представители [CRO.GetAdjective], которые приняли религию сербов, всё равно остаются представителями [CRO.GetAdjective] и должны быть интегрированы в национальное сообщество."
 CRO_deny_citizenship_to_muslims_focus:0 "Лишить мусульман прав"
 CRO_deny_citizenship_to_muslims_focus_desc:0 "Католицизм является центральным элементом идентичности [CRO.GetAdjective], а мусульмане, выдающие себя за представителей [CRO.GetAdjective], не заслуживают места среди нас."
 CRO_integrate_religious_minorities_focus:0 "Интегрировать религиозные меньшинства"
 CRO_integrate_religious_minorities_focus_desc:0 "В нашей стране живут религиозные меньшинства, и мы должны уважать их особенности."
 CRO_a_king_for_our_people_focus:0 "Король для нашего народа"
 CRO_a_king_for_our_people_focus_desc:0 "Чтобы восстановить величие свободного хорватского королевства прошлого, необходимо выбрать короля, который поведёт возрождённый народ [CRO.GetAdjective]."
 CRO_enforce_pavelic_rule:0 "Утвердить власть Павелича"
 CRO_enforce_pavelic_rule_desc:0 "Теперь, когда усташи наконец пришли к власти, мы можем добиться того, чтобы наш дорогой лидер, Подлавник Анте Павелич, был признан законным правителем страны всеми верными представителями [CRO.GetAdjective]."
 CRO_italian_influence_focus:0 "Влияние: [ITA.GetAdjective]"
 CRO_italian_influence_desc:0 "Теперь, когда представитель [ITA.GetAdjective] занимает престол государства [CRO.GetNameDef], наша страна связана с государством [ITA.GetNameDef] теснее, чем когда-либо прежде."
 CRO_italo_croat_legion:0 "Легион [ITA.GetAdjective]—[CRO.GetAdjective]"
 CRO_italo_croat_legion_desc:0 "Мы должны помогать союзникам всеми возможными способами. Представители [ITA.GetAdjective] пообещали оснастить моторизованную дивизию, если мы сможем набрать добровольцев."
 CRO_dalmatian_question_focus:0 "Далматинский вопрос"
 CRO_dalmatian_question_focus_desc:0 "Хотя кому-то на его месте союз с государством [ITA.GetNameDef] мог показаться очевидным выбором, Анте Павелич считает иначе. В последнее время он всё чаще подчёркивает необходимость вернуть законные земли народа [CRO.GetAdjective], удерживаемые представителями [ITA.GetAdjective]."
 CRO_zagreb_investments_focus:0 "Инвестиции в Загреб"
 CRO_zagreb_investments_focus_desc:0 "Загреб — наша столица и важный промышленный центр; он должен занимать центральное место в промышленной политике."
 CRO_trading_infrastructures:0 "Торговая инфраструктура"
 CRO_trading_infrastructures_desc:0 "Путь по морю — путь вперёд. Развивая порты далматинского побережья, мы увеличим экспорт."
 CRO_industrial_support:0 "Поддержка промышленности"
 CRO_industrial_support_desc:0 "Мы должны заручиться поддержкой промышленников и убедить их работать на общее благо общества."
 CRO_economic_optimization:0 "Оптимизация экономики"
 CRO_economic_optimization_desc:0 "Некоторые отрасли нашего военно-промышленного комплекса плохо управляются, поэтому необходимо реформировать их и повысить производительность."
 CRO_research_grants:0 "Исследовательские гранты"
 CRO_research_grants_desc:0 "Финансирование инженерных компаний позволит быстрее разрабатывать новое снаряжение для вооружённых сил."
 CRO_yugoslav_scientific_cooperation:0 "Научное сотрудничество: [YUG.GetAdjective]"
 CRO_form_peasant_councils:0 "Сформировать крестьянские советы"
 CRO_form_peasant_councils_desc:0 "Крестьяне по всей стране долгие годы подвергались угнетению. Если побудить их объединиться и организоваться под нашим идеологическим руководством, мы получим множество новых сторонников."
 CRO_join_yugoslavia:0 "Присоединиться к государству [YUG.GetNameDef]"
 CRO_join_yugoslavia_desc:0 "Мы должны показать, что [YUG.GetNameDef] действительно является союзом южных славян. Следует продемонстрировать наше единство и присоединиться к государству [YUG.GetNameDef]."
 CRO_economic_centralization:0 "Экономическая централизация"
 CRO_economic_centralization_desc:0 "Мы должны полностью перестроить экономику, чтобы пролетариат смог взять власть."
 CRO_nationalize_factories:0 "Национализировать заводы"
 CRO_nationalize_factories_desc:0 "Индустриализация — путь в будущее, а капиталисты мешают ей, эксплуатируя труд пролетариата. Чтобы раскрыть истинный потенциал рабочих, необходимо лишить жестоких и угнетающих капиталистов их экономического влияния."
 CRO_local_steel_production:0 "Местное производство стали"
 CRO_local_steel_production_desc:0 "Для поддержки военной промышленности жизненно важно производить сталь внутри страны. Мы должны всеми возможными средствами выполнить это решение центрального политического комитета коммунистической партии."
 CRO_local_militias:0 "Местное ополчение"
 CRO_local_militias_desc:0 "Активистов крестьянских советов необходимо мобилизовать и вооружить, чтобы они стали основой идеологически преданной армии."
 CRO_reclaim_the_coast:0 "Вернуть побережье"
 CRO_reclaim_the_coast_desc:0 "Оккупация наших земель стороной [103.Owner.GetAdjective] день за днём подвергает наших братьев невыносимой тирании. Пора вернуть родину."
 CRO_religious_minorities:0 "Религиозные меньшинства"
 CRO_religious_minorities_happy:0 "Интегрированные религиозные меньшинства"
 CRO_croat_muslims_angry:0 "Мусульмане [CRO.GetAdjective] подвергнуты остракизму"
 CRO_croat_muslims_happy:0 "Интегрированные мусульмане [CRO.GetAdjective]"
 CRO_secularism:0 "Секуляризм"
 CRO_catholic_dominance:0 "Господство католицизма"
 CRO_idea_anti_partizan_tactics:0 "Антипартизанская тактика"
 CRO_liberate_bosnian_croats:0 "Освободить боснийских хорватов"
 CRO_idea_ustashe_militia:0 "Ополчение усташей"
 CRO_idea_ustashe_militia_desc:0 "Режим считает ополчение усташей своими наиболее лояльными и надёжными войсками. В действительности их боевые качества довольно низки, а недоверие руководства усташей к домобранству создавало больше проблем, чем приносило пользы. В то же время ополчение оказалось эффективным инструментом репрессий, поскольку его участников отбирали за политическую преданность партии и её доктрине. Именно поэтому они несут ответственность за худшие зверства режима Павелича."
 CRO_militarism_focus:0 "Мобилизация усташей"
 CRO_idea_industrial_support:0 "Поддержка промышленности"
 CRO_idea_economic_optimization:0 "Оптимизация экономики"
 CRO_idea_research_grants:0 "Исследовательские гранты"
 CRO_veteran_partisans:0 "Партизаны-ветераны"
 CRO_brodosplit:0 "Бродосплит"
 CRO_lazarus_shipyard:0 "Лазарус"
 CRO_kraljevica_shipyard:0 "Бродоградилиште Кралевица"
 CRO_saponia:0 "Сапония"
 CRO_elektra:0 "Электра"
 CRO_koncar_elektroindustrija:0 "Кончар Электроиндустрия"
 tzv_gredelj:0 "ТЖВ Гредель"
 yugoslav_research_name:0 "Исследования: [YUG.GetAdjective]"
 yugoslav_research_desc:0 "Вполне логично, что автономное правительство государства [CRO.GetNameDef] сотрудничает в научной сфере с центральным правительством [YUG.GetAdjective]."
 axis_minors_croatia_home_guard_tooltip:0 "Создать Хорватское домобранство, состоящее из 3 пехотных дивизий."
 axis_minors_croatia_ustashe_militia_tooltip:0 "Создать два подразделения ополчения усташей. Эти части лёгкой пехоты беспощадны в борьбе с партизанами."
 axis_minors_croatia_italo_croat_tooltip:0 "Передать государству [ROOT.GetNameDef] моторизованный итало-хорватский легион."
 CRO_ivan_gosnjak:0 "Иван Гошняк"
 CRO_gojko_nikolis:0 "Гойко Николиш"
 CRO_andrija_bozanic:0 "Андрия Божанич"
 CRO_juraj_boanci:0 "Юрай Боначи"
 CRO_benko_matulic:0 "Бенко Матулич"
 CRO_viktor_bubanj:0 "Виктор Бубань"
