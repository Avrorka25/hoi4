 MNC_Louis_II:0 "Луи II"
 MNC_Rainier_III:0 "Ренье III"
 MNC_rainier_iii_of_monaco_idea:0 "Ренье III, князь Монако"
 MNC_rainier_iii_of_monaco_fascism_idea:0 "Ренье III, князь Монако"
 MNC_Rainier_III_fascism:0 "Ренье III"
 MNC_Rainier_III_fascism_desc:0 "Хотя князь решительно выступает против нынешнего правительства, его удерживают в роли марионетки, к его великому негодованию."
 monaco.1.t:0 "Итальянские войска входят в Монако!"
 monaco.1.d:0 "Несмотря на наши заверения в нейтралитете, [ITA.GetLeader] объявил об интервенции в Монако, заявив, что французские оборонительные сооружения, построенные ещё до войны, доказывают наши планы нарушить нейтралитет. Положение тяжёлое, но не лучше ли подчиниться Италии?"
 monaco.1.a:0 "Мы должны подчиниться."
 monaco.1.b:0 "Сплотить всех [MNC.GetAdjective], мы должны сопротивляться!"
 monaco.2.t:0 "Италия выводит войска из Монако"
 monaco.2.d:0 "Поскольку война складывается против Италии, итальянская армия начала отход из Монако. Хотя итальянцы оставили след в нашей стране, возможно, теперь всё начнёт налаживаться."
 monaco.2.a:0 "Превосходно!"
 monaco.3.t:0 "Немецкие войска входят в Монако!"
 monaco.3.d:0 "Пустоту, оставленную итальянским гарнизоном, только что заполнили немецкие войска. Мы снова превратились в марионеточное государство фашистской державы. Правительство, опасаясь последствий, умоляет [Root.GetLeader] сотрудничать с немцами и выполнять все их требования в надежде на более мягкое обращение."
 monaco.3.a:0 "Мы снова должны подчиниться."
 monaco.3.b:0 "Сплотить всех [MNC.GetAdjective], мы должны сопротивляться!"
 monaco.4.t:0 "Германия выводит войска из Монако"
 monaco.4.d:0 "И снова, когда война оборачивается против них, немецкие войска отступили. Население недовольно действиями нашего правительства, но, возможно, сотрудничество спасло нас от ужасов, пережитых другими европейскими городами."
 monaco.4.a:0 "Надеюсь, теперь всё закончилось."
 monaco.5.t:0 "[ROOT.GetAdjective] войска оккупируют Монако"
 monaco.5.d:0 "После короткой кампании [ROOT.GetAdjective] войска пересекли [MNC.GetAdjective] границу и заняли [MNC.GetNameDef]. Хотя эта территория не особенно важна, оккупация устраняет фактор неопределённости: наши враги могли бы использовать её как плацдарм для наступления на Южную Францию."
 monaco.5.a:0 "Заглянем в эти казино."
 monaco.6.t:0 "Италия оккупирует Монако"
 monaco.6.d:0 "Заявив, что [MNC.GetAdjective] правительство нарушило нейтралитет, [ITA.GetLeader] начал небольшое вторжение в крошечное город-государство Монако. Оккупация выглядит относительно мягкой: правительству позволили остаться у власти, а имущество граждан не было конфисковано."
 monaco.6.a:0 "Война продолжается."
 monaco.7.t:0 "Германия оккупирует Монако"
 monaco.7.d:0 "После ухода Италии из города немецкая армия вошла в Монако, и крошечное город-государство оказалось под новой оккупацией. \n\nХотя режим остаётся сравнительно мягким, немецкое правительство вынудило [MNC.GetAdjective] власти выполнить ряд требований."
 monaco.7.a:0 "Монако никак не дают передышки."
 monaco.8.t:0 "Умирает Луи II"
 monaco.8.d:0 "Сегодня в своём замке скончался Луи Оноре Шарль Антуан Гримальди, известный как Луи II. \n\nСледующим главой дома Гримальди становится Ренье Луи Анри Максанс Бертран Гримальди, внук Луи II, после того как его дочь Шарлотта отказалась от прав на престол. Он принял тронное имя «Ренье III»."
 monaco.8.a:0 "Князь умер! Да здравствует князь!"
 monaco.8.b:0 "Кого волнуют эти автократы."
 monaco.9.t:0 "Будущее дома Гримальди"
 monaco.9.d:0 "После недавней смены правительства начались обсуждения новой конституции и демократизации страны. Одним из главных вопросов стала судьба самого княжества. \n\nХотя республиканское движение в Монако не столь велико, как во Франции, часть населения требует устранить князя и превратить Монако в республику. \n\nПротивники этой идеи указывают на Великобританию и Норвегию, сумевшие найти компромисс и использовать монарха как объединяющую фигуру."
 monaco.9.a:0 "Сохраним князя."
 monaco.9.b:0 "Долой князя!"
 monaco.10.t:0 "Марионеточная монархия?"
 monaco.10.d:0 "Недавняя реорганизация правительства вызвала скепсис у князя и его ближайших союзников. \n\nРазумеется, он не в том положении, чтобы сопротивляться, но некоторые в правительстве задаются вопросом, стоит ли вообще оставлять его рядом."
 monaco.10.a:0 "Он всё ещё нам полезен."
 monaco.10.b:0 "Он нам не нужен."
 monaco.11.t:0 "Падение династии Гримальди"
 monaco.11.d:0 "После политических потрясений в маленьком княжестве Монако династия Гримальди, правившая здесь с 1297 года, была свергнута. Более того, власти переписали конституцию, нарушив многие договоры между нашими странами. \n\nЭто ставит под угрозу наши интересы в городе и может позволить предприимчивым врагам настроить маленькую страну против нас. Но стоит ли интервенция затраченных усилий?"
 monaco.11.a:0 "У нас есть дела поважнее."
 monaco.11.b:0 "Выдвинуть ультиматум."
 monaco.12.t:0 "Судьба Монако"
 monaco.12.d:0 "Одержав победу над французскими войсками, мы теперь оккупируем Савойю. Однако крошечное государство Монако, окружённое нами, позволило французам построить на своей территории оборонительные сооружения. \n\nЭто нарушает их предполагаемый нейтралитет, и, несмотря на заверения, враг может использовать Монако как плацдарм для вторжения на наши земли."
 monaco.12.a:0 "Быстро вторгнемся."
 monaco.12.b:0 "Зачем утруждаться."
 monaco.13.t:0 "Монако бросает нам вызов"
 monaco.13.d:0 "Неожиданно крошечная [MNC.GetName] не только отвергла наши требования, но и силами ополчения и армии отбила первое вторжение. \n\nМы легко можем раздавить их крошечные вооружённые силы, но этот небольшой провал уже подпортил нашу репутацию: критики отмечают, что даже такая маленькая страна, как Монако, больше нас не боится."
 monaco.13.a:0 "Они заплатят за дерзость!"
 monaco.14.t:0 "Оккупация Монако"
 monaco.14.d:0 "После нашей победы во Франции и их контроля над Савойей Италия вторглась и оккупировала небольшую нацию Монако, установив марионеточное правительство, чтобы обеспечить возможный въезд союзников.\n\nС поворотом войны и вынужденным отступлением Италии за Савойю мы должны решить, что делать с маленьким городом. Вторжение было бы тривиальным, и нынешнее правительство Монако, вероятно, сотрудничало бы с нами так же, как они сотрудничали с Италией. Но стоит ли это усилий?"
 monaco.14.a:0 "Начать вторжение."
 monaco.14.b:0 "Эти войска пригодятся в другом месте."
 Monaco_French_Intervention_TT:0 "§RФранцузам это не понравится, и они могут принять меры.§!"
