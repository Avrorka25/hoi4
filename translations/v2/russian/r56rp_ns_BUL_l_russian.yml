l_russian:
 bul_become_yugoslavia:0 "Наследование мантии Югославии"
 bul_become_yugoslavia_desc:0 "В то время как сегодня София находится далеко ниже, чем раньше, Болгария на ее высоте была джаггернаутом на Балканах. Глобальная ситуация быстро меняется, может быть, теперь мы наконец-то сможем шагнуть вперед и стать лидером других южнославянских национальностей, которыми нам суждено было быть!"
 bul_initial_yugoslavia_formable:0 "Стать Югославией"
 bul_demcom_integrate_the_yugoslav_states:0 "Федерализация югославских государств"
 bul_demcom_integrate_the_yugoslav_states_desc:0 "София, наконец, одержала победу над другими южными славянами Европы, в результате чего все они оказались под ее досягаемостью. Но если мы хотим избежать распада нашего нового союза, мы должны учиться на неудачах Белграда. Благодаря решительной федерализации королевства мы можем, наконец, привести южных славян в будущее!"
 bul_r56tree_integrate_serbia:0 "Интеграция Центральной Сербии"
 bul_comdemintegrate_debar_and_kosovo:0 "Создание автономных албанских регионов"
 bul_demcom_integrate_montenegro:0 "Предложение федерализации Черногории"
 bul_demcom_integrate_bosnia:0 "Создание боснийских автономных районов"
 bul_demcom_integrate_croatia:0 "Хорватская федерализация"
 bul_demcom_integrate_vojvodina:0 "Предлагаю автономию Воеводины"
 bul_demcom_integrate_slovenia:0 "Словенская федерализация"
 BUL_controls_required_yugoslavia_states_tt:0 "Контроль всех выделенных государств"
 BUL_unlocks_yugoslav_integration_decisions_tt:0 "Притязания на все §YЮгославия§! ядра и разблокирует решения для их интеграции"
 bul_become_byzantine:0 "Наследие Византии"
 bul_become_byzantine_desc:0 "Болгарская история тесно переплетается с историей Византийской империи, что приводит к значительному византийскому культурному и религиозному наследию. Восстановив эту великую мантию, мы можем сплотить народы Балкан для болгарского дела!"
 bul_initial_byzantium_formable:0 "Стать Византией"
 bul_byzantium_claims_tt:0 "Претензии и разблокировка решений для интеграции всех §Yюгославский§!, §Yгреческий§!и §Yалбанский§! стержни."
 bul_claims_anatolia_and_romania_tt:0 "Требовать все §Yтурецкий§!и §Yрумынский§! штатов."
 bul_autfas_integrate_the_balkan_states:0 "Болгария, факелоносец Византии!"
 bul_autfas_integrate_the_balkan_states_desc:0 "София одержала победу над другими народами Балкан, доведя многие из них до наших пределов. Объединив их судьбу с болгарской, мы можем нанести удар выше нашего веса и показать народам мира, почему Болгария является силой страха."
