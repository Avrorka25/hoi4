 TIB_mountainous_people:0 "Горный народ"
 TIB_mountainous_people_desc:0 "The [ROOT.GetAdjective] Люди, как правило, живут на больших высотах и поэтому используются для путешествий в таких суровых условиях, что значительно облегчает пересечение менее дружественной и суровой местности, давая им серьезный адватанж во время боев на пересеченной местности."
 TIB_montainous_people_effect:0 "§HПехота§!:\n    §HГоры§!:\n        Защита: §G+2%§!\n        Передвижение: §G+5%§!\n§HГорнострелковые войска§!:\n    §HГоры§!:\n        Атака: §G+5%§!\n        Передвижение: §G+10%§!"
 TIB_poorly_organized_army:0 "Плохо организованная армия"
 TIB_poorly_organized_army_desc:0 "Из-за давления аристократии, стремящейся не допустить сильной центральной власти, тибетская армия совершенно не оснащена и не подготовлена. Из некоторых винтовок не стреляли годами, и лишь гвардия Далай-ламы организована более или менее должным образом."
 TIB_army_reform_in_progress:0 "Реформа армии в процессе"
 TIB_army_reform_in_progress_desc:0 "С помощью иностранных советников мы реформируем организацию нашей армии."
 TIB_enlist_the_educated_as_officers:0 "Улучшенная подготовка доб-добов"
 TIB_british_school:0 "Британская школа в Гьянце"
 TIB_dual_education:0 "Двойная система образования"
 TIB_modernized_education:0 "Модернизированное образование"
 TIB_dob_dobs_vigilance_idea:0 "Бдительность доб-добов"
 TIB_dob_dobs_vigilance_idea_desc:0 "Доб-добы — монахи, отвечающие за контроль над другими монахами. Обычно они следят за порядком во время праздников, но при необходимости могут наказывать тех, кто поддался пагубным идеям."
 TIB_backward_industry:0 "Отсталая промышленность"
 taring_jigme_military:0 "Таринг Джигме вступил в армию"
 tibetan_army_reform_started:0 "Идёт первый этап армейской реформы"
 TIB_dalai_lama:0 "Далай-лама"
 TIB_dalai_lama_desc:0 "Далай-лама — сын крестьянской семьи из небольшой деревни в Амдо, на что указали направление ритуальных шарфов оракулов и видения регента."
 TIB_dalai_lama_phawpon:0 "Юный Далай-лама"
 TIB_dalai_lama_phawpon_desc:0 "Далай-лама — сын Ябши Пхавпёна. Его выбрали потому, что конь предыдущего Далай-ламы сбежал и остановился перед домом ребёнка, ожидая своего перерождённого хозяина, подобно тому как Тибет ожидал возвращения правителя."
 TIB_monasteries_furious:0 "Разъярённые монастыри"
 TIB_monasteries_unhappy:0 "Недовольные монастыри"
 TIB_monasteries_neutral:0 "Удовлетворённые монастыри"
 TIB_monasteries_happy:0 "Довольные монастыри"
 TIB_monasteries_elated:0 "Ликующие монастыри"
 recovery_teams:0 "Спасательные команды"
 TIB_centralize_power_idea:0 "Централизованная власть"
 TIB_soviet_military_mission_idea:0 "Советская военная миссия"
 TIB_chinese_commissars_idea:0 "Китайские политические комиссары"
 TIB_military_faction:0 "Военная фракция"
 TIB_build_strong_state_idea:0 "Строительство сильного государства"
 TIB_build_greater_tibet:0 "Великий Тибет"
 TIB_call_for_reform:0 "Призвать к реформам"
 TIB_call_for_reform_desc:0 "Поскольку регент желает отречься, внезапно появилась возможность глубоко реформировать страну. Будущее Тибета теперь висит на волоске, и перед самой высокогорной страной мира открывается новый путь."
 TIB_chinese_model:0 "Китайская модель"
 TIB_chinese_model_desc:0 "Если мы хотим найти подходящую модель азиатской модернизации, следует обратиться к Китаю."
 TIB_study_british_constitution:0 "Изучить британскую конституцию"
 TIB_study_british_constitution_desc:0 "Если мы хотим создать современное государство, необходимо выстроить сбалансированную правовую систему. Для этого можно адаптировать британскую модель: тонкое равновесие между сильным парламентом и монархом. Так мы обеспечим будущее Далай-ламы и получим полную поддержку реформистов и британцев."
 TIB_free_lungshar_and_implement_reforms:0 "Освободить Лунгшара и провести реформы"
 TIB_free_lungshar_and_implement_reforms_desc:0 "Несколько лет назад аристократ Лунгшар попытался провести демократические реформы. Его «заговор» был раскрыт, его арестовали и жестоко лишили зрения. Хотя тогда его пытали и заключили в тюрьму, его план всё ещё остаётся лучшим ориентиром для проведения демократических реформ в стране."
 TIB_reopen_british_school:0 "Вновь открыть британскую школу в Гьянце"
 TIB_reopen_british_school_desc:0 "В течение нескольких лет в 1920-х годах в Гьянце существовала британская школа, которая помогла сформировать будущее тибетской элиты, открыв ей глаза на современную науку и практики внешнего мира. Школу закрыли после жалоб монастырей, потерявших монополию на знания, но теперь пора открыть её вновь и воспитать новое поколение тибетцев на основе современного образования."
 TIB_a_tibetan_parliament:0 "Реформировать Национальное собрание"
 TIB_a_tibetan_parliament_desc:0 "При традиционной системе Национальное собрание обладало немногими полномочиями, но всё же играло важную роль, представляя интересы аристократии перед Далай-ламой и его регентом. После надлежащих реформ и введения парламентаризма оно откроется новым группам и получит право противостоять решениям монарха."
 TIB_constitutional_theocracy:0 "Конституционная теократия"
 TIB_constitutional_theocracy_desc:0 "Объединив конституционные и теократические элементы, мы сможем гарантировать демократические права, сохранив Его Святейшество Далай-ламу во главе страны. Новая конституция одобрена Национальным собранием и теперь должна получить печати Ганден Трипы и двух наставников Далай-ламы, чтобы образовать нерушимую «великую клятву» (mna' gan mthu mo che) и стать законом."
 TIB_british_guarantees:0 "Британские гарантии"
 TIB_british_guarantees_desc:0 "Благодаря тесным связям с британцами мы можем попросить официальный договор о гарантиях, чтобы обеспечить безопасность в это трудное время."
 TIB_ask_for_a_british_commander:0 "Попросить британского командующего"
 TIB_ask_for_a_british_commander_desc:0 "Чтобы обеспечить надлежащее руководство армией, следует попросить британцев разрешить Филипу Ниму контролировать наши военные планы."
 TIB_reduce_monasteries_influence:0 "Снизить влияние монастырей"
 TIB_reduce_monasteries_influence_desc:0 "Монахи, ранее владевшие монополией на знания и привилегированным доступом к политическим структурам, теперь видят, как их влияние уменьшается с каждым днём. Их гнев понятен, но он мешает модернизации, и это препятствие необходимо преодолеть."
 TIB_dual_educational_system:0 "Двойная система образования"
 TIB_dual_educational_system_desc:0 "Монахи, ранее владевшие монополией на знания и привилегированным доступом к политическим структурам, теперь видят, как их влияние уменьшается с каждым днём. Их гнев понятен, и нам следует найти компромисс между религиозным и западным образованием."
 TIB_education_reform:0 "Реформировать школы Цикханг и Це Лаптра"
 TIB_education_reform_desc:0 "После бесчисленных реформ мы наконец начали открываться современным учениям и наукам. Нам остаётся лишь признать собственную отсталость и стараться исправить положение."
 TIB_restart_mondo_field_survey:0 "Возобновить полевые исследования Мёндё"
 TIB_restart_mondo_field_survey_desc:0 "Вернувшись из Англии, Мёндё начал искать в Тибете ценные руды, особенно золото. Но его обвинили в беспокойстве духов и порче урожая, после чего запретили продолжать. Теперь, когда влияние монахов снижено, следует поощрить его к возобновлению работ."
 TIB_exploit_the_findings:0 "Использовать результаты исследований"
 TIB_exploit_the_findings_desc:0 "Теперь, когда обнаружены новые месторождения руды, мы можем начать их разработку и использовать на благо производства."
 TIB_empower_the_military_faction:0 "Расширить влияние военной фракции"
 TIB_empower_the_military_faction_desc:0 "Когда был провозглашён курс на реформы, первой естественным образом откликнулась армия. Военные годами требовали перемен, но их политические стремления постоянно блокировались и даже подавлялись из-за сопротивления монахов, боявшихся потерять ключевую роль в тибетском обществе. Теперь их время настало, и на плато за высокими горами начинается новая эпоха."
 TIB_secularization:0 "Секуляризация"
 TIB_secularization_desc:0 "Чтобы построить более современное государство, необходимо отделить религиозные учреждения от власти и ограничить влияние духовенства на светские дела. Слабость регента и юность Далай-ламы создают уникальное окно возможностей для преобразования Тибета."
 TIB_fair_treatment_of_the_dalai_lama:0 "Справедливое обращение с Далай-ламой"
 TIB_fair_treatment_of_the_dalai_lama_desc:0 "Подобно китайскому императору после революции 1911 года, мы не хотим устранять Далай-ламу, а намерены контролировать его, ограничив Потальским дворцом."
 TIB_control_the_monasteries:0 "Взять монастыри под контроль"
 TIB_control_the_monasteries_desc:0 "Учитывая сопротивление монахов и их стремление вернуть власть, мы не можем позволить им готовить переворот ради восстановления абсолютистского теократического правления."
 TIB_invite_chinese_officials:0 "Пригласить китайских чиновников"
 TIB_invite_chinese_officials_desc:0 "Учитывая тесные связи между военной фракцией и Гоминьданом в Китае, логично пригласить китайских чиновников и снизить напряжённость на границе."
 TIB_join_the_front:0 "Присоединиться к фронту"
 TIB_join_the_front_desc:0 "Китайцы в опасности, и как одна из пяти наций мы обязаны помочь им отразить японских захватчиков."
 TIB_negotiated_chinese_suzerainty:0 "Согласовать китайский сюзеренитет"
 TIB_negotiated_chinese_suzerainty_desc:0 "Хотя мы являемся одной из наций Китайского союза, у нас есть собственные особенности. Чтобы их сохранить, необходимо договориться о выгодных условиях нашего будущего в составе Республики."
 TIB_road_to_china:0 "Дорога в Китай"
 TIB_road_to_china_desc:0 "Чтобы связь с Китаем стала быстрее и надёжнее, необходимо обследовать и перестроить великую дорогу на восток."
 TIB_mobilization_measures:0 "Мобилизационные меры"
 TIB_mobilization_measures_desc:0 "Чтобы защитить свои интересы, мы должны обеспечить стране способность противостоять нападению."
 TIB_radical_reforms:0 "Радикальные реформы"
 TIB_radical_reforms_desc:0 "Мы не будем вечно жить под гнётом монахов и лам. Они удерживают всех нас в феодальной отсталости, чтобы сохранить власть. Это больше нельзя терпеть! Мы должны уничтожить феодальную систему и обеспечить модернизацию страны."
 TIB_build_strong_modern_state:0 "Построить сильное современное государство"
 TIB_build_strong_modern_state_desc:0 "Да, некоторые монахи подверглись нападениям... но посмотрите на результат! Теперь у нас развязаны руки, и мы можем приглашать промышленных советников и поддерживать модернизацию страны."
 TIB_centralize_power:0 "Централизовать власть"
 TIB_centralize_power_desc:0 "Слишком многие сомневаются в наших убеждениях! Слишком многие с ностальгией смотрят на тираническое прошлое и не видят светлого будущего, которое нас ожидает. Если мы хотим полностью осуществить перемены, с ними нужно разобраться быстро."
 TIB_crush_the_reactionaries:0 "Сокрушить реакционеров"
 TIB_crush_the_reactionaries_desc:0 "Учитывая сопротивление монахов и их стремление вернуть власть, мы не можем позволить им готовить переворот ради восстановления абсолютистского теократического правления. Поэтому с ними необходимо разобраться быстро и эффективно."
 TIB_claim_qinghai:0 "Заявить права на Цинхай"
 TIB_claim_qinghai_desc:0 "Цинхай включает тибетскую провинцию Амдо. Исторически она является неотъемлемой частью Великого Тибета и должна быть освобождена от нынешних угнетателей."
 TIB_modernization_with_tibetan_characteristics:0 "Модернизация с тибетской спецификой"
 TIB_modernization_with_tibetan_characteristics_desc:0 "Я обещал вам прогресс! Я обещал вам процветание! Это важнейший шаг! Современность ждёт нас!"
 TIB_restart_mondo_field_survey2:0 "Возобновить полевые исследования Мёндё"
 TIB_restart_mondo_field_survey2_desc:0 "Вернувшись из Англии, Мёндё начал искать в Тибете ценные руды, особенно золото. Но его обвинили в беспокойстве духов и порче урожая, после чего запретили продолжать. Теперь, когда влияние монахов снижено, следует поощрить его к возобновлению работ."
 TIB_exploit_the_findings2:0 "Использовать результаты исследований"
 TIB_exploit_the_findings2_desc:0 "Теперь, когда обнаружены новые месторождения руды, мы можем начать их разработку и использовать на благо производства."
 TIB_compassion_for_the_masses:0 "Возвышение Бапы Вангьяла"
 TIB_compassion_for_the_masses_desc:0 "Родившийся в приграничном регионе, населённом тибетцами под китайской властью, молодой Бапа Вангьял создал небольшую группу студентов, решивших распространять марксистско-ленинские идеи и освободить тибетцев от гнёта монахов и лам."
 TIB_get_rid_of_the_spiritual_opiates:0 "Избавиться от духовного опиума"
 TIB_get_rid_of_the_spiritual_opiates_desc:0 "Духовенство веками эксплуатировало крестьянство, заставляя их каторжно трудиться, пока они искали иллюзию. Это должно прекратиться, и новый Тибет должен быть создан из коллективной рабочей силы освобожденного крестьянства."
 TIB_red_monasteries:0 "Красные монастыри"
 TIB_red_monasteries_desc:0 "В конце 1920-х годов монахов наказывали за приверженность коммунизму. Это доказывает, что коммунизм способен укорениться в монастырях и превратить их в крепости — авангард революции."
 TIB_invite_chinese_commissars:0 "Пригласить китайских комиссаров"
 TIB_invite_chinese_commissars_desc:0 "Китайские коммунисты — прекрасный пример для нас! Они освободили крестьян и защищают их от врагов трудящихся. Если они согласятся направить нам советников, качество нашей армии наверняка возрастёт."
 TIB_invite_soviet_advisors:0 "Пригласить советских советников"
 TIB_invite_soviet_advisors_desc:0 "Чтобы повысить качество армии, мы должны попросить помощи у Советского Союза. Если они согласятся, то смогут направить военную миссию, которая заменит британскую и поможет реорганизовать наши вооружённые силы."
 TIB_accept_the_unity_of_china:0 "Признать единство Китая"
 TIB_accept_the_unity_of_china_desc:0 "Мы должны признать, что, хотя мы и не ханьцы, подобно маньчжурам, хуэйцам и монголам мы всё же являемся частью великого союза, на котором основан Китай."
 TIB_great_socialist_tibet:0 "Великий Социалистический Тибет"
 TIB_great_socialist_tibet_desc:0 "Пора воплотить мечту Бапы Вангьяла: объединить все земли, населённые тибетцами, освободив их как от тирании лживых монахов, так и от китайских угнетателей."
 TIB_state_atheism:0 "Государственный атеизм"
 TIB_state_atheism_desc:0 "Монахи — угнетатели народа! Они порют крестьян за малейшие проступки, а регент вдобавок оказался развратным и коррумпированным человеком. Этому фарсу нужно положить конец раз и навсегда. Монастыри должны быть уничтожены ради освобождения трудящихся."
 TIB_climbing_the_mountain_of_progress:0 "Восхождение на гору прогресса"
 TIB_climbing_the_mountain_of_progress_desc:0 "Наука имеет решающее значение для освобождения трудящихся. Мы должны обеспечить доступ к новейшим научным достижениям, чтобы просвещать народ и избавиться от феодальной отсталости."
 TIB_restart_mondo_field_survey_communism:0 "Возобновить полевые исследования Мёндё"
 TIB_restart_mondo_field_survey_communism_desc:0 "Вернувшись из Англии, Мёндё начал искать в Тибете ценные руды, особенно золото. Но его обвинили в беспокойстве духов и порче урожая, после чего запретили продолжать. Теперь, когда влияние монахов снижено, следует поощрить его к возобновлению работ."
 TIB_exploit_the_findings_communism:0 "Использовать результаты исследований"
 TIB_exploit_the_findings_communism_desc:0 "Теперь, когда обнаружены новые месторождения руды, мы можем начать их разработку и использовать на благо производства."
 TIB_search_the_dalai_lama:0 "Начать поиски Далай-ламы"
 TIB_search_the_dalai_lama_desc:0 "Само существование регента оправдано необходимостью найти Далай-ламу. После проведённой в прошлом году особой медитации и консультаций с оракулами настало время начать поиски его перерождения."
 TIB_traditional_government:0 "Традиционное правительство"
 TIB_traditional_government_desc:0 "Чтобы обеспечить будущее Далай-ламы, собрание и правительство регента должны сотрудничать ради сохранения стабильности страны."
 TIB_dob_dobs_vigilance:0 "Бдительность доб-добов"
 TIB_dob_dobs_vigilance_desc:0 "Доб-добы — монахи, отвечающие за руководство другими монахами. Обычно они контролируют толпы во время праздников, но также имеют право наказывать тех, кто поддался пагубным идеям."
 TIB_renounce_to_abdicate:0 "Отказаться от отречения"
 TIB_renounce_to_abdicate_desc:0 "Некоторое время регент размышлял об уходе. Однако делегация собрания встретилась с ним и убедила остаться у власти, чтобы сохранить стабильность регентства, пока Далай-лама только начинает обучение."
 TIB_monasteries_influence:0 "Опереться на монастыри"
 TIB_monasteries_influence_desc:0 "Монастыри составляют основу ламаистского государства, и их поддержка необходима для проведения политических действий при сохранении общественного порядка."
 TIB_reintroduce_monastic_tax:0 "Обложить монастыри поборами"
 TIB_reintroduce_monastic_tax_desc:0 "Чтобы финансировать страну и роскошный образ жизни регента, монастыри должны вносить вклад в государственный бюджет."
 TIB_guard_the_borders:0 "Охранять границы"
 TIB_guard_the_borders_desc:0 "Наша безопасность окажется под угрозой, если Китай решит нам угрожать. Пограничные заставы необходимо укрепить, чтобы эффективнее контролировать горные перевалы."
 TIB_denounce_regents_corruption:0 "Осудить коррупцию регента"
 TIB_denounce_regents_corruption_desc:0 "Джампел Еше Гьялцен — не религиозный человек! Он устраивал оргии с мужчинами и женщинами и присваивал деньги ради непомерно роскошной жизни. Его необходимо немедленно заставить уйти!"
 TIB_religious_harmony:0 "Религиозная гармония"
 TIB_religious_harmony_desc:0 "Теперь, когда нравственно сомнительный регент смещён, мы можем обеспечить полную поддержку монастырей."
 TIB_foreign_advices:0 "Иностранные рекомендации"
 TIB_foreign_advices_desc:0 "Чтобы не отставать от иностранцев, необходимо привезти в страну зарубежные технологии. Лучший способ добиться этого — положиться на нескольких западных советников, за которыми можно тщательно наблюдать."
 TIB_army_review:0 "Смотр армии [GetYear] года"
 TIB_army_review_desc:0 "Пригласив иностранных военных советников для проверки наших войск, мы сможем начать реформу армии и приблизить её к уровню зарубежных держав."
 TIB_officers_professionalism:0 "Профессионализировать вооружённые силы"
 TIB_officers_professionalism_desc:0 "Одна из главных проблем Тибета заключается в том, что чиновников переводят с военной службы на гражданскую и обратно, не позволяя им накапливать ценный долгосрочный опыт. Для создания боеспособной армии необходимо закрепить офицеров на военной службе и переобучить их."
 TIB_modern_army_structure:0 "Современная структура армии"
 TIB_modern_army_structure_desc:0 "Чтобы завершить армейскую реформу, необходимо перестроить структуру войск и включить часть ополчений в чёткую военную организацию."
 TIB_train_monks_and_clerks_as_officers:0 "Подготовить доб-добов"
 TIB_train_monks_and_clerks_as_officers_desc:0 "Призыв образованных граждан для пополнения офицерского корпуса будет непопулярным, но необходимым решением."
 TIB_build_air_strip:0 "Построить взлётную полосу"
 TIB_build_air_strip_desc:0 "Строительство полноценной взлётной полосы станет первым шагом к созданию современных военно-воздушных сил, подобных тем, которыми располагают другие страны."
 TIB_small_airframes:0 "Малые планеры"
 TIB_small_airframes_desc:0 "Поскольку для поддержки наземных войск потребуется лишь локальное превосходство в воздухе, дешёвые небольшие самолёты будут лучшим выбором."
 TIB_large_airframes:0 "Большие планеры"
 TIB_large_airframes_desc:0 "Учитывая размеры страны и сложность полётов среди высоких гор, предпочтительнее самолёты с большей дальностью и высотой полёта, способные перелетать хребты, а не огибать многочисленные вершины."
 TIB_invest_into_the_air_force:0 "Инвестировать в военно-воздушные силы"
 TIB_naval_effort:0 "Финансировать кораблестроение"
 TIB_naval_effort_tt:0 "Недостаточно ячеек строительства для §Yвоенно-морских верфей§!"
 TIB_naval_effort_desc:0 "Расширение флота должно стать нашим приоритетом. Направьте все доступные ресурсы на новые верфи и исследования лёгких надводных кораблей."
 TIB_flexible_navy:0 "Гибкий флот"
 TIB_flexible_navy_desc:0 "Переосмысление морской войны с учётом развития подводных технологий позволит эффективно наносить удары по вражеским конвоям."
 TIB_large_navy:0 "Большой флот"
 TIB_large_navy_desc:0 "Адаптация военно-морских доктрин к крупным кораблям и защите торговых конвоев поможет понять, какие именно суда нам нужны."
 TIB_submarine_effort:0 "Подводная война"
 TIB_submarine_effort_desc:0 "Подводная война — самое захватывающее развитие морского дела со времён изобретения торпедного катера. Нам следует защищаться от подлодок и использовать их против вражеского судоходства."
 TIB_cruiser_effort:0 "Разработать крейсеры"
 TIB_cruiser_effort_desc:0 "Прежде чем переходить к передовым исследованиям линкоров, необходимо заменить устаревшие малые крейсеры."
 TIB_destroyer_effort:0 "Спроектировать эсминцы"
 TIB_destroyer_effort_desc:0 "Изучая конструкцию подводных лодок и способы их применения, мы также узнали, как противодействовать этой стратегии. Эсминцы будут играть в этом ключевую роль."
 TIB_capital_ships_effort:0 "Интерес к крупным кораблям"
 TIB_capital_ships_effort_desc:0 "Страна с наибольшим числом линкоров будет править океанами. Линкоры и авианосцы воплощают старое и новое морского превосходства."
 TIB_buy_machines_in_india:0 "Купить оборудование в Индии"
 TIB_buy_machines_in_india_desc:0 "Путь модернизации начинается с приобретения того, что мы не можем построить сами. Чтобы обновить фабрику Драбши Лехунг, необходимо отправиться в Индию и закупить станки, повышающие производительность и создающие прочную промышленную основу."
 TIB_increase_drabshi_lekhoung_output:0 "Увеличить выпуск Драбши Лехунг"
 TIB_increase_drabshi_lekhoung_output_desc:0 "Теперь, когда новые станки прибыли, мы можем установить их и действительно начать производство."
 TIB_drabshi_lekhoung_arms_production:0 "Производство оружия в Драбши Лехунг"
 TIB_drabshi_lekhoung_arms_production_desc:0 "Благодаря большому числу новых станков мы можем запланировать расширение военного отдела промышленного комплекса."
 TIB_new_production_chains:0 "Новые производственные линии"
 TIB_new_production_chains_desc:0 "Новые рабочие и производственные линии позволят увеличить выпуск оружия."
 TIB_drabshi_lekhoung_power_plant:0 "Расширить гидроэнергетику"
 TIB_drabshi_lekhoung_power_plant_desc:0 "Электростанция в долине Доде — единственный источник электричества в стране. Её необходимо расширить, чтобы снабжать энергией больше заводов и развивать промышленность."
 TIB_steel_bridges_on_the_way_to_lhasa:0 "Стальные мосты на пути в Лхасу"
 TIB_steel_bridges_on_the_way_to_lhasa_desc:0 "Чтобы облегчить поездки в Лхасу и обратно, необходимо построить новые стальные мосты и включить их в существующую дорожную сеть."
 TIB_new_industrial_complex:0 "Новый промышленный комплекс"
 TIB_new_industrial_complex_desc:0 "Поскольку в комплексе Драбши Лехунг больше не осталось места для расширения, дальнейшее развитие промышленности потребует создания нового комплекса в другом месте."
 TIB_optimize_production:0 "Оптимизировать производство"
 TIB_optimize_production_desc:0 "Сосредоточившись на улучшении производственных методов, мы сможем лучше выявлять ошибки, повышать качество и увеличивать выпуск."
 TIB_equipment_effort:0 "Обновить завод боеприпасов в Драпчи"
 TIB_equipment_effort_desc:0 "В прошлом мы пытались производить патроны калибра .303, но потерпели неудачу. Они были слишком ненадёжны, повреждали оружие и ранили солдат. Современные методы позволят учесть прежние ошибки и на этот раз правильно выпускать необходимые боеприпасы."
 TIB_our_own_artillery:0 "Разработать собственную артиллерию"
 TIB_our_own_artillery_desc:0 "В 1936 году у нас было всего шесть артиллерийских орудий, причём из двух было опасно стрелять. Пора изменить ситуацию и разрешить Драбши Лехунг производить снаряды и новые пушки."
 TIB_mountain_artillery_training:0 "Подготовка горной артиллерии"
 TIB_mountain_artillery_training_desc:0 "Горы — наша стихия, и для эффективного использования артиллерии необходимо специально тренироваться в таких условиях."
 TIB_improve_logistics:0 "Улучшить логистику"
 TIB_improve_logistics_desc:0 "Для эффективной войны прежде всего нужна лучшая система снабжения, доставляющая припасы в нужные места. Развив транспорт, мы обеспечим каждого необходимым вооружением там и тогда, где оно требуется."
 TIB_spare_parts_recycling:0 "Переработка запасных частей"
 TIB_spare_parts_recycling_desc:0 "Сражения оставляют отходы и повреждённое оружие. Мы не можем позволить себе расточительство и должны ремонтировать вооружение и собирать оставшиеся после боёв материалы."
 TIB_combat_mountain_climbers:0 "Боевые альпинисты"
 TIB_combat_mountain_climbers_desc:0 "Теперь, когда армия приблизилась к современным стандартам, мы можем оснастить отобранных солдат как альпинистов, чтобы атаковать врага с самых неожиданных направлений."
 TIB_military_modernization:0 "Военная модернизация"
 TIB_military_modernization_desc:0 "Достигнутый прогресс в военном производстве позволяет экспериментировать с новыми идеями и проектами, приступая к созданию более совершенного снаряжения."
 TIB_modern_research:0 "Современные исследования"
 TIB_modern_research_desc:0 "Чтобы сократить научное отставание от остального мира, мы должны овладеть современной наукой."
 drabshi_lekhoung_arsenal_section:0 "Драпчи Лехунг — арсенал"
 drabshi_lekhoung_manufacturing_section:0 "Драпчи Лехунг — производство"
 himalaya_tibet.1.t:0 "Тибет просит официальный договор о гарантиях"
 himalaya_tibet.1.desc:0 "Тибет является важным рубежом против любых китайских притязаний на Индию. Недавно там начали реформы, основанные на британской модели правления, и теперь хотят официально закрепить более тесные отношения договором о гарантиях, частично основанным на Пунакхском договоре 1910 года между Британской Индией и королевской династией Бутана."
 himalaya_tibet.1.a:0 "Мы гарантируем их независимость."
 himalaya_tibet.1.b:0 "Мы не можем рисковать быть втянутыми в войну!"
 himalaya_tibet.2.t:0 "Британия обещает защищать территорию Тибета"
 himalaya_tibet.2.desc:0 "Чтобы укрепить связи с Тибетом, британское правительство объявило о защите его независимости и суверенитета. Ламаистское государство провело ряд беспрецедентных демократических реформ, открываясь современному миру и создавая современные учреждения, пока следующий правитель, Далай-лама, ещё слишком молод для личного правления. Договор, согласованный британской миссией в Лхасе за последние месяцы, частично основан на Пунакхском договоре 1910 года между Британской Индией и королевской династией Бутана. Новый договор показывает решимость британского правительства защищать свои интересы в Индии, что особенно важно на фоне хронической нестабильности Китая после революции 1912 года."
 himalaya_tibet.2.a:0 "Что дальше — заголовки о Бутане?"
 himalaya_tibet.3.t:0 "Пустые обещания... только ими они и оказались..."
 himalaya_tibet.3.desc:0 "В ответ на нашу просьбу о договоре британской защиты сэр Бэзил Гулд сообщил, что британское правительство готово поддерживать хорошие отношения с Тибетом и желает успеха программе модернизации, однако не хочет давать обещания, которые, возможно, не сможет выполнить, и потому отвергает предложение."
 himalaya_tibet.3.a:0 "Нам придётся отказаться от этих надежд."
 himalaya_tibet.4.t:0 "Тибет просит иностранного военного командующего"
 himalaya_tibet.4.desc:0 "Молодое тибетское государство просит британской помощи в укреплении обороны, желая разместить у себя опытного командира для модернизации войск."
 himalaya_tibet.4.a:0 "Разрешить бригадиру Ниму командовать тибетскими частями."
 himalaya_tibet.4.b:0 "Сейчас мы не можем пойти на такой риск."
 himalaya_tibet.5.t:0 "Британцы разрешили военную поддержку!"
 himalaya_tibet.5.desc:0 "Британское правительство согласилось расширить полномочия своей военной миссии и позволило бригадиру Филипу Ниму, уже руководящему модернизацией нашей армии, непосредственно участвовать в командовании операциями."
 himalaya_tibet.5.a:0 "Его опыт будет бесценен!"
 himalaya_tibet.6.t:0 "Британцы отказались расширить военную миссию"
 himalaya_tibet.6.desc:0 "Британское правительство отклонило нашу просьбу разрешить офицерам военной миссии в Лхасе непосредственно участвовать в планировании операций."
 himalaya_tibet.6.a:0 "Разочарование не должно перерасти в гнев."
 himalaya_tibet.7.t:0 "Великий смотр тибетской армии"
 himalaya_tibet.7.desc:0 "Впервые за многие годы значительная часть армии собралась для учений. Кроме того, впервые с начала века на них присутствует западный советник, который должен оценить состояние войск и дать рекомендации.\n\nК удивлению иностранного специалиста, из некоторых винтовок не стреляли годами, и ему стало ясно, что потребуется полная реорганизация. Этот долгий процесс может укрепить обороноспособность Тибета, но религиозная элита способна выступить против любой модернизации, опасаясь, что офицерский корпус использует профессиональную армию для угрозы традиционным теократическим учреждениям."
 himalaya_tibet.7.a:0 "Этот процесс займёт время..."
 himalaya_tibet.9.t:0 "Поиски Далай-ламы"
 himalaya_tibet.9.desc:0 "Всего несколько лет назад, зимой 1933 года, предыдущий Далай-лама скончался. После каждой смерти он перерождается где-то на бескрайних землях Тибета. Поэтому поиск Далай-ламы является важнейшей задачей регентского правительства, необходимой для сохранения теократической системы. Регент только что созвал Цонгду, чтобы определить, где искать новое воплощение. В этом процессе решающее значение имели два элемента: знаки и предзнаменования должны были указать общее направление, а видения регента — более точное место. Он рассказал, что в прошлом году у озера Лхамо-Лацо увидел буквы «а», «ка» и «ма», монастырь с трёхъярусной бирюзовой крышей и позолоченной вершиной, похожей на пагоду, а также извилистую тропу, ведущую к востоку от монастыря, к голому холму напротив небольшого одноэтажного дома с синей крышей. Эти картины напомнили ему далёкий регион Тибета — Амдо. Уверенность укреплял и тот факт, что после смерти голова прежнего Далай-ламы повернулась на восток. Кроме того, на восточной стороне деревянной колонны в северо-восточной части тронного зала за одну ночь вырос большой гриб в форме звезды. Также сообщалось, что государственные оракулы Нечунг, Гадонг и Самье в нескольких случаях во время транса бросали церемониальные шарфы на восток.\n\nЧасть собрания убеждена, что поисковые отряды нужно отправить в Амдо. Однако это может оказаться крайне опасным как для самих отрядов, так и для Далай-ламы, если его действительно найдут. Тем не менее ясно одно: Далай-лама должен быть найден!"
 himalaya_tibet.9.a:0 "Как можно скорее отправить поисковые отряды."
 himalaya_tibet.9.b:0 "Связаться с местными властями — сначала нужно получить их разрешение."
 himalaya_tibet.10.t:0 "Тибетские посланники ищут Далай-ламу на нашей территории"
 himalaya_tibet.10.desc:0 "Похоже, тибетские посланники ищут перерождение своего лидера, Далай-ламы, среди этнических тибетцев, живущих на нашей территории."
 himalaya_tibet.10.a:0 "У меня есть дела поважнее."
 himalaya_tibet.10.b:0 "Мы не можем допустить иностранных агентов на нашу территорию."
 himalaya_tibet.11.t:0 "Далай-лама найден!"
 himalaya_tibet.11.desc:0 "В маленькой и уединённой деревне Такцер, расположенной на холме среди нескольких полей и бескрайней степной пустоши, где кочуют пастухи, находился один из всего семнадцати домов. Это было прямоугольное одноэтажное здание, части которого располагались вокруг широкого внутреннего двора, под плоской прямоугольной крышей. Во внешних стенах не было проёмов, кроме входной двери. На крыше стояли три дымохода и два вентиляционных отверстия. По краям крыши проходили небольшие желоба со стоками во двор. Над входом в крыше находилось гнездо для десятифутового флагштока.\n\nПоисковый отряд прибыл сюда потому, что буква «а» из видения Ретинга Ринпоче указывала на провинцию Амдо, а буква «ка», несомненно, означала монастырь Кумбум. Это трёхэтажное здание с синей черепичной крышей полностью соответствовало описанию регента. Последняя часть видения указывала на дом с необычным деревом. И вот перед ними оказался дом с искривлённым кустом можжевельника на плоской крыше...\n\nЧтобы провести проверку, возглавлявший отряд Кевцанг Ринпоче переоделся слугой, а путники попросились остаться на ночь. В доме жили крестьянин с женой и детьми; старший сын находился в монастыре Кумбум, поскольку его признали перерождением Такцер Ринпоче. Один из детей внезапно узнал Кевцанга и несколько раз назвал его «ламой из Серы», словно знал его монастырь. Через несколько дней отряд вернулся с предметами, привезёнными из Лхасы, и ребёнок опознал те, что принадлежали прежнему Далай-ламе. Затем группа отправилась в Кумбум, взяв с собой новое воплощение Авалокитешвары."
 himalaya_tibet.11.a:0 "Они должны вернуться как можно скорее."
 himalaya_tibet.12.t:0 "Похоже, тибетцы нашли ребёнка"
 himalaya_tibet.12.desc:0 "Один из тибетских поисковых отрядов, возможно, нашёл Далай-ламу в небольшой деревне Такцер. Ребёнка доставили в монастырь Кумбум, и, судя по всему, они готовятся отправиться в Лхасу."
 himalaya_tibet.12.a:0 "Пусть уходят."
 himalaya_tibet.12.b:0 "Отправить им небольшой дипломатический подарок."
 himalaya_tibet.12.c:0 "Послать охрану и не выпускать их, пока они не заплатят нам 100 000 серебряных монет!"
 himalaya_tibet.18.t:0 "Возвращение Далай-ламы"
 himalaya_tibet.18.desc:0 "Роскошная процессия путешествовала уже много дней. Каждое утро после того, как святой ребёнок покидал место ночлега, местные жители превращали комнату в часовню. Он ехал в золотом паланкине, окружённый огромной свитой и множеством верующих, желавших приблизиться к живому воплощению Авалокитешвары, бодхисаттвы сострадания. Подготовку к его прибытию в священный город Лхасу пришлось значительно ускорить. Теперь мы можем лишь радоваться, что Далай-лама действительно находится в безопасности."
 himalaya_tibet.18.a:0 "Вечный правитель вернулся!"
 himalaya_tibet.20.t:0 "Возведение Далай-ламы на престол"
 himalaya_tibet.20.desc:0 "Великолепная процессия, состоявшая из всего двора Далай-ламы, покинула дворец Норбулинка и медленно двинулась по церемониальной дороге к Потале. Там Далай-лама был официально возведён на престол и окончательно признан духовным и светским правителем Тибета. Однако ребёнок пока не может править: ему ещё предстоит стать монахом и много лет изучать религиозные тексты, прежде чем регентство сможет сложить полномочия."
 himalaya_tibet.20.a:0 "Да здравствует Далай-лама!"
 himalaya_tibet.23.t:0 "Истинный Далай-лама раскрыт"
 himalaya_tibet.23.desc:0 "После видения одного из важнейших оракулов выяснилось, что истинный Далай-лама выбран не был. Использование золотой урны для нового выбора показало, что настоящим Далай-ламой является Чао Кунг — настоятель из Китая, уже некоторое время заявлявший о своём титуле."
 himalaya_tibet.23.a:0 "Слава истинному Далай-ламе!"
 himalaya_tibet.25.t:0 "Прибытие немецкой экспедиции"
 himalaya_tibet.25.desc:0 "В Лхасу прибыла иностранная научная экспедиция из страны неподалёку от Британских островов, называемой Германией. Она намерена изучать антропологические и этнические особенности тибетцев. Участники охотно общались со многими аристократами и вскоре даже были приняты в Норбулинке. Однако в разговорах выяснилось, что эти люди состоят в немецких СС и, возможно, связаны с высшим военным руководством. Было бы разумно воспользоваться этим, пока есть возможность..."
 himalaya_tibet.25.a:0 "Эти учёные очень милы, пусть продолжают исследования."
 himalaya_tibet.25.b:0 "«Послушайте, Шефер, Германия готова продать Тибету оружие?»"
 himalaya_tibet.26.t:0 "[TIB.GetAdjective] правительство просит продать оружие"
 himalaya_tibet.26.desc:0 "Мы получили весьма интересные новости от научной экспедиции в Тибет, направленной туда для изучения гипотезы о том, что этот регион является прародиной нашего народа. Кроме того, она намерена встретиться с древними мудрецами и исследовать таинственную силу — вриль. Однако ответ тибетцев оказался неожиданным: [TIB.GetAdjective] правительство спросило участников экспедиции, нельзя ли приобрести некоторое количество [GER.GetAdjective] огнестрельного оружия — исключительно для защиты, разумеется..."
 himalaya_tibet.26.a:0 "Не стоит беспокоиться — Тибет будет в безопасности!"
 himalaya_tibet.26.b:0 "У Германии нет интересов в Тибете."
 himalaya_tibet.27.t:0 "Германия согласилась"
 himalaya_tibet.27.desc:0 "Немцы приняли нашу просьбу и продадут нам некоторое количество огнестрельного оружия."
 himalaya_tibet.27.a:0 "Прекрасные новости!"
 himalaya_tibet.28.t:0 "Германия отвергла наше предложение"
 himalaya_tibet.28.desc:0 "Немцы отказали нам в просьбе приобрести их огнестрельное оружие."
 himalaya_tibet.28.a:0 "Какое разочарование..."
 himalaya_tibet.31.t:0 "Отставка Тримёна"
 himalaya_tibet.31.desc:0 "Наконец мы получили письмо об отставке Тримёна. Он возглавлял Кашаг во время смерти XIII Далай-ламы и был одним из немногих, кто сопровождал регента в паломничестве к озеру Лхамо-Лацо летом 1935 года, но в последнее время стал лишь тенью прежнего себя. Раньше он был высокомерен, а теперь его поведение всё больше напоминает безумие. Однажды ночью его слышали плачущим и неистово кричащим, пока он колотил в деревянные двери храма Джоканг. Этот скандал и другие странности усилили давление с требованием его отставки."
 himalaya_tibet.31.a:0 "Он достойно служил своей стране!"
 himalaya_tibet.32.t:0 "Нас шантажируют!"
 himalaya_tibet.32.desc:0 "После того как вероятного кандидата нашли и доставили в монастырь Кумбум, по региону разнеслась весть, что там находится Далай-лама. В тот же вечер к монастырю прибыли вооружённые солдаты якобы для защиты ребёнка. Теперь мы знаем, что произошло после обнаружения этого весьма убедительного кандидата, но, к сожалению, солдаты не позволяют экспедиции отправиться обратно торжественной процессией. Вместо этого они требуют 100 000 серебряных монет за его освобождение. Очевидно, мы стали жертвой жестокого шантажа и почти не имеем выбора, кроме как согласиться на возмутительные требования."
 himalaya_tibet.32.a:0 "Будем надеяться, что больше никогда о нём не услышим."
