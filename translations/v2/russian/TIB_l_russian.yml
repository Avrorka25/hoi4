 TIB_army_reforms:0 "Реформы армии"
 TIB_army_reforms_desc:0 "Наша армия годами оставалась без внимания и едва была способна сражаться. Тем не менее, с помощью западных советников мы, возможно, сумеем создать относительно эффективные вооружённые силы."
 TIB_apply_neames_guidelines:0 "Применить рекомендации Нима"
 TIB_professionalize_the_officers:0 "Профессионализировать офицерский корпус"
 TIB_revise_officers_fighting_techniques:0 "Пересмотреть боевые методы офицеров"
 TIB_religious_decisions:0 "Религиозные решения"
 TIB_religious_decisions_desc:0 "Наша политика, общественная структура и цели целиком определяются религиозной элитой. Монастыри находятся в самом сердце экономики и политики и обладают куда большей властью, чем аристократия."
