 POLITICS_CHAO_KUNG_DESC:0 "Настоятель в Китае Чао Кунг объявил себя истинным Далай-ламой и получил поддержку Германии и Японии. Однако немногие знают, что на самом деле этот человек — уроженец Венгрии Игнац Требич, который под именем Требич-Линкольн был депутатом британского парламента, некоторое время шпионил в пользу Германии, затем перебрался в Китай, принял буддизм и стал настоятелем... и лишь после всего этого заявил, что является перерождением Далай-ламы."
