 TIB_chaos_and_confusion:0 "Хаос и неразбериха"
 himalaya_tibet.33.t:0 "Отставка Джампела Еше Гьялцена"
 himalaya_tibet.33.desc:0 "Сегодня в 9:15 утра Ретинг Ринпоче Джампел Еше Гьялцен ушёл с поста регента Тибета. Это не стало неожиданностью ни для тибетского народа, ни для управляющей страной аристократии, поскольку некоторое время назад он уже заявил, что подаст в отставку, если Тримёну Шаппе позволят уйти и не назначат главным министром. Похоже, именно это и произошло, поэтому решение регента также не удивляет. Однако правительство оказалось в ужасном состоянии хаоса и неразберихи. Для разрешения кризиса необходимо немедленно созвать новую сессию Цонгду — Национального собрания!"
 himalaya_tibet.33.a:0 "Всё было напрасно..."
 himalaya_tibet.34.t:0 "Цонгду собирается"
 himalaya_tibet.34.desc:0 "Сегодня Цонгду, Национальное собрание Тибета, собралось, чтобы разрешить кризис и выбрать нового регента, которому предстоит найти Далай-ламу и стать его наставником. Это далеко не простая задача, поэтому решение должно быть взвешенным. Однако министры Цонгду вступили в ожесточённый спор вокруг двух кандидатов, и соглашение или компромисс пока кажутся недостижимыми... Невозможно предсказать, что ждёт Тибет."
 himalaya_tibet.34.a:0 "Довольно! Немедленно прекратите этот балаган!"
 himalaya_tibet.34.b:0 "В столь тяжёлом положении нужен компромисс."
 himalaya_tibet.35.t:0 "[TIB.GetNameDefCap] просит военную помощь"
 himalaya_tibet.35.desc:0 "После завершения [ENG.GetAdjective] военной миссии в Тибет в 1936 году тибетцы попросили о военной помощи. Возможно, стоит удовлетворить их просьбу, поскольку это сблизит Тибет с [ROOT.GetNameDef]. Как поступить?"
 himalaya_tibet.35.a:0 "[ENG.GetLeader] держит слово!"
 himalaya_tibet.35.b:0 "Сейчас мы ничем не можем поделиться."
 himalaya_tibet.36.t:0 "[ENG.GetAdjective] правительство предоставляет военную помощь"
 himalaya_tibet.36.desc:0 "[ENG.GetAdjective] правительство согласилось предоставить нам военную помощь. Это прекрасная новость и для внешней политики Тибета, и для его обороноспособности, которая значительно возрастёт благодаря [ENG.GetAdjective] поддержке!"
 himalaya_tibet.36.a:0 "Благодарим вас, господин [ENG.GetLeader]!"
 himalaya_tibet.37.t:0 "[ENG.GetAdjective] правительство отклоняет нашу просьбу"
 himalaya_tibet.37.desc:0 "[ENG.GetAdjective] правительство отказалось предоставить нам военную помощь. Это крайне разочаровывающая новость как для внешней политики Тибета, так и для его способности защищаться, ведь она может означать, что [ENG.GetAdjective] сторона вовсе не заинтересована в Тибете!"
 himalaya_tibet.37.a:0 "Какое разочарование..."
 himalaya_tibet.38.t:0 "[FROM.GetNameDefCap] устанавливает контроль над [434.GetName]"
 himalaya_tibet.38.desc:0 "Несколько часов назад подразделения [FROM.GetAdjective] армии вошли на [TIB.GetAdjective] территорию. Хотя [FROM.GetAdjective] администрация её не признаёт, эта земля фактически служила административной границей между Тибетом и [FROM.GetNameDef]. Для тибетского правительства это стало полной неожиданностью, и мы должны как можно скорее ответить на эти агрессивные действия!"
 himalaya_tibet.38.a:0 "Мы ничего не можем сделать."
 himalaya_tibet.38.b:0 "Необходимо направить дипломатический протест!"
 himalaya_tibet.38.c:0 "Немедленно мобилизовать армию! Это акт агрессии!"
 himalaya_tibet.39.t:0 "[FROM.GetNameDefCap] уступает [434.GetName]"
 himalaya_tibet.39.desc:0 "Не видя надежды в дефекации [434.GetName]ни дипломатическим, ни военным путем, [FROM.GetAdjective] Правительство пришло к выводу, что оно должно сдаться [434.GetName] нашим военным. Воистину великая стратегическая победа [ROOT.GetNameDef]."
 himalaya_tibet.39.a:0 "Они поступили правильно."
 himalaya_tibet.40.t:0 "[FROM.GetNameDefCap] направляет дипломатический протест"
 himalaya_tibet.40.desc:0 "Несколько часов назад подразделения [ROOT.GetAdjective] армии вошли на территорию [434.GetName] и объявили её [ROOT.GetAdjective] владением. [FROM.GetAdjective] правительство ответило дипломатическим протестом. Однако беспокоиться не о чем: в дипломатических отношениях преимущество на нашей стороне, а наши притязания на [434.GetName] весьма сильны."
 himalaya_tibet.40.a:0 "Пусть попробуют..."
 himalaya_tibet.41.t:0 "[FROM.GetNameDefCap] мобилизует войска"
 himalaya_tibet.41.desc:0 "Несколько часов назад подразделения [ROOT.GetAdjective] армии вошли на территорию [434.GetName] и объявили её [ROOT.GetAdjective] владением. [FROM.GetAdjective] правительство ответило объявлением мобилизации. Однако беспокоиться не о чем: наши войска наверняка превосходят [FROM.GetAdjective] армию, а присутствие в [434.GetName] лишь укрепляет эту уверенность."
 himalaya_tibet.42.t:0 "[ROOT.GetAdjective] победа при [434.GetName]"
 himalaya_tibet.42.desc:0 "Наши войска доказали своё превосходство в битве за [434.GetName]. Мы отбили противника и продвинулись дальше. Эти столкновения также дадут нам немало полезного опыта и сведений!"
 himalaya_tibet.42.a:0 "Теперь они поймут!"
 himalaya_tibet.43.t:0 "[ROOT.GetAdjective] поражение при [434.GetName]"
 himalaya_tibet.43.desc:0 "Наши войска были разгромлены и разбиты в битве за [434.GetName]. Мы отразили множество атак, но натиск и боевой дух противника оказались выше. Тем не менее из этих столкновений всё ещё можно извлечь немало уроков и сведений..."
 himalaya_tibet.43.a:0 "Какое разочарование."
 himalaya_tibet.44.t:0 "Тупик при [434.GetName]"
 himalaya_tibet.46.desc:0 "Нашим войскам не удалось продвинуться в битве за [434.GetName]. Мы отразили множество атак противника, но собственных атак и боевого духа не хватило, чтобы прорвать его линии. Тем не менее из этих столкновений всё ещё можно извлечь немало уроков и сведений..."
 himalaya_tibet.46.a:0 "Пустая трата крови и слез..."
