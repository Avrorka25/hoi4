 CHI_KR_fd:0 "Дипломатический курс Китая"
 KMT_into_fascism:0 "Движение за новую жизнь"
 KMT_into_fascism_desc:0 "Возглавляемое правительством общественное движение, призванное противостоять коммунистической пропаганде по всей стране."
 kmt_military_youth:0 "Военизированная молодёжь"
 kmt_military_youth_desc:0 "Молодёжь поощряют создавать националистические организации и военизированные формирования."
 KMT_communism_banned:0 "Новый белый террор"
 KMT_communism_banned_desc:0 "Мы искореним любые коммунистические мысли в сознании народа."
 KMT_powerful_blueshirts:0 "Могущественные синерубашечники"
 KMT_powerful_blueshirts_desc:0 "Бюро расследований и статистики — разведывательная служба, подчинённая синерубашечникам, сыгравшая важнейшую роль в приходе нынешнего режима к власти. Теперь, когда нынешний правитель предоставил им ещё больше полномочий, никто не сможет вырваться из их хватки."
 KMT_empire_plan:0 "Имперский план"
 KMT_empire_plan_desc:0 "Мы возродим славу Китая из пепла наших врагов!"
 KMT_framed_mongolia:0 "Ненадёжный чужак"
 KMT_framed_mongolia_desc:0 "Наш бывший лидер альянса поверил документам неизвестного происхождения, и теперь мы предоставлены сами себе. Возмущённые граждане сформировали движение, направленное на изгнание чужаков."
 KMT_infiltrated_mongol:0 "Закрытая внешняя политика"
 KMT_infiltrated_mongol_desc:0 "Мы должны сражаться за себя сами — полагаться больше не на кого!"
 KMT_militarism:0 "Национальная военная индоктринация"
 KMT_militarism_desc:0 "Подчиняйся приказам и сражайся с бесчеловечным врагом во славу государства — это твоё единственное предназначение, солдат!"
 KMT_war_propaganda_idea:0 "Военная пропаганда"
 KMT_war_propaganda_idea_desc:0 "Пусть враг страшится нашей мощи и доблести!"
 KMT_war_propaganda_idea_2:0 "Военная пропаганда"
 KMT_war_propaganda_idea_2_desc:0 "Пусть враг страшится нашей силы и отваги!"
 KMT_military_first_idea:0 "Армия превыше всего"
 KMT_military_first_idea_desc:0 "Всё для наших солдат, наших защитников, наших спасителей. Всё для фронта!"
 KMT_war_fanaticism_idea:0 "Военный фанатизм"
 KMT_war_fanaticism_idea_desc:0 "[CHI.GetLeader]... [CHI.GetNameDef]... десять тысяч лет жизни... десять тысяч по десять тысяч лет! "
 KMT_jap_military_advisors:0 "Японские военные советники"
 KMT_jap_military_advisors_desc:0 "Нашим генералам есть чему поучиться у наших новых [JAP.GetAdjective] союзников.\n\n§YОткрывает атаку «Банзай»§!"
 KMT_into_democracy:0 "Принцип миньцюань"
 KMT_into_democracy_desc:0 "Только демократия в том виде, в каком её понимал Сунь Ятсен, спасёт государство [CHI.GetNameDef] от распада."
 KMT_parliament:0 "Движение за реконструкцию деревни"
 KMT_parliament_desc:0 "Под руководством нынешнего правительства санитарные нормы и условия жизни постепенно улучшаются."
 KMT_universal_sufferage_ns:0 "Три народных принципа"
 KMT_universal_sufferage_ns_desc:0 "Национализм, демократия и народное благосостояние!"
 KMT_people_knowledge:0 "Гражданское просвещение"
 KMT_people_knowledge_desc:0 "Мы должны как можно скорее искоренить неграмотность."
 KMT_westernization_ns:0 "Вестернизация"
 KMT_westernization_ns_desc:0 "Культурный и технологический обмен с Западом приносит нашей стране огромную пользу."
 KMT_firm_belief:0 "Непоколебимая вера"
 KMT_firm_belief_desc:0 "Уникальные основы [Root.GetAdjective] демократии невозможно ни согнуть, ни сломить."
 KMT_stay_non_aligned:0 "Политическая опека народа"
 KMT_stay_non_aligned_desc:0 "Партия [CHI.GetRulingParty] будет руководить государством и учить народ тому, как построить подлинно демократическую страну."
 KMT_central_power:0 "Централизованная власть"
 KMT_central_power_desc:0 "Если бы вся власть была сосредоточена в одном месте, а не распылена по всей стране, гражданская война в Китае, возможно, никогда бы не началась."
 KMT_despotism:0 "Деспотизм"
 KMT_despotism_desc:0 "[CHI.GetLeader] обладает всей полнотой власти, необходимой для управления государством [CHI.GetNameDef] и ведения его к предначертанной славе."
 KMT_propaganda:0 "Пропаганда национальной обороны"
 KMT_propaganda_desc:0 "Поскольку японцы угрожают самому нашему существованию, весь китайский народ должен объединиться против них."
 KMT_propaganda_busted:0 "Дискредитированная пропаганда национальной обороны"
 KMT_propaganda_busted_desc:0 "Наш народ чувствует себя обманутым. Некоторые солдаты отказались сражаться, заявив, что вступили в армию, чтобы защищать Китай, а не вести захватническую войну против других китайцев."
 taiwan_returned:0 "Тайвань возвращён"
 taiwan_returned_desc:0 "Вернув Тайвань китайцам, мы разгневали многих политиков-националистов и офицеров. Наш народ требует ответов и считает нас предателями."
 KMT_united_front:0 "Единый фронт"
 KMT_united_front_desc:0 "Второй единый фронт защитит китайский народ от вторжения сил государства [JAP.GetNameDef].\n\n§RЕсли вы играете за одного из военачальников, после капитуляции вас автоматически аннексирует государство [CHI.GetNameDef] или [PRC.GetNameDef].§!"
 KMT_rear:0 "План большого тыла"
 KMT_rear_desc:0 "Наша промышленность находится в безопасном месте, и [JAP.GetAdjective] захватчики никогда до неё не доберутся!\n\n§RЭтот национальный дух исчезнет после окончания войны с Японией.§!"
 KMT_lure_them_in:0 "Стратегия заманивания вглубь"
 KMT_lure_them_in_desc:0 "Заманить их вглубь и отрезать врага от источников его силы!\n\n§RЭтот национальный дух исчезнет после окончания войны с Японией.§!"
 KMT_lure_them_in_1:0 "Стратегия заманивания вглубь"
 kmt_dare_to_die_corps_idea:0 "Корпуса смертников"
 kmt_dare_to_die_corps_idea_desc:0 "Наши храбрые солдаты готовы пожертвовать жизнью ради безопасности страны!"
 kmt_national_treasure_ransacked:0 "Утрата национальных сокровищ"
 kmt_defend_the_treasures:0 "Защитить национальные сокровища!"
 kmt_planning_the_civil_war:0 "Планирование гражданской войны"
 kmt_planning_the_civil_war_desc:0 "Государство [PRC.getNameDefCap] не желает, чтобы кто-либо извлёк выгоду из грядущей гражданской войны между китайцами: это внутреннее дело Китая."
 KMT_chinese_matter:0 "Внутреннее дело Китая"
 KMT_harsh_takeover:0 "Жёсткое установление контроля"
 KMT_harsh_takeover_desc:0 "Война оставила промышленность нашей страны в руинах, науку — в состоянии хаоса, а народ — обессиленным. Мы как никогда прежде уязвимы для иностранного влияния."
 KMT_jinyuanquan_inflation:0 "Гиперинфляция"
 KMT_jinyuanquan_inflation_desc:0 "Наша практика печатать всё больше золотых юаней для оплаты войны с коммунистами без дополнительного золотого обеспечения вызвала тяжёлую инфляцию! Недовольные граждане и солдаты теперь переходят на сторону коммунистов!"
 KMT_corrupted_kmt:0 "Укреплённая решимость"
 KMT_corrupted_kmt_desc:0 "Коррумпированные чиновники нашего врага укрепили решимость наших товарищей сокрушить их прогнивший строй!"
 KMT_aid_to_xsm:0 "Помощь из Китая"
 KMT_aid_to_xsm_desc:0 "В борьбе против коммунистической угрозы мы едины!"
 KMT_retreat_to_taiwan_idea:0 "Отступление на Тайвань!"
 KMT_warlord_cliques_pre_war:0 "Клики военачальников"
 KMT_warlord_cliques_pre_war_desc:0 "Многочисленные клики военачальников, разбросанные по всему Китаю, ослабили центральное правительство."
 KMT_warlord_cliques_war:0 "Армии военачальников"
 KMT_warlord_cliques_war_desc:0 "Хотя армии военачальников были включены в состав наших сил, они сохраняют верность лишь своим хозяевам."
 KMT_effective_integration:0 "Эффективная интеграция"
 KMT_effective_integration_desc:0 "Плавная и эффективная интеграция сил военачальников даёт нам больше контроля над армией и ускоряет принятие решений."
 KMT_focus_on_own_army:0 "Опора на Центральную армию"
 KMT_focus_on_own_army_desc:0 "Силы военачальников слишком плохо оснащены и недисциплинированны. Нам следует больше полагаться на Центральную армию, чем на них, чтобы не растрачивать жизненно важные средства."
 KMT_sino_german_joint_research:0 "Совместные китайско-германские военные исследования"
 KMT_science_funding:0 "Академия Синика"
 KMT_science_funding_desc:0 "Первый финансируемый государством научно-исследовательский институт, напрямую подчинённый Исполнительному юаню."
 public_iliteracy:0 "Массовая неграмотность"
 public_iliteracy_desc:0 "После долгих лет потрясений и гражданской войны китайская система образования лежит в руинах."
 KMT_national_institute_ns:0 "Убежище для евреев"
 KMT_national_institute_ns_desc:0 "Многие еврейские беженцы в знак благодарности за спасение помогают нашей промышленности и научным исследованиям."
 incompetent_industry_real:0 "Недееспособная промышленность"
 incompetent_industry_real_desc:0 "[ROOT.getAdjective] Молодая и неопытная промышленность не готова к грядущему шторму.\n\n§YИспользуйте решения для улучшения промышленных возможностей страны.§!"
 incompetent_industry_real_navy:0 "Недееспособная судостроительная промышленность"
 incompetent_industry_real_navy_desc:0 "Государство [ROOT.GetNameDefCap] всегда было сухопутной державой. Океанский флот остаётся лишь несбыточной мечтой.\n\n§YИспользуйте решения, чтобы улучшить промышленный потенциал страны.§!"
 KMT_weak_army:0 "Недееспособная армия"
 KMT_weak_army_desc:0 "Национально-революционная армия состоит из плохо обученных солдат и некомпетентных командиров.\n\n§YИспользуйте решения, чтобы устранить недостаток организованности НРА.§!"
 KMT_chennault:0 "Американский авиационный советник"
 KMT_chennault_desc:0 "Благодаря отставному лётчику Воздушного корпуса армии США Клэру Ли Шеннолту, назначенному нашим авиационным советником, наши ВВС будут эффективнее действовать на поле боя."
 KMT_the_flying_tigers_idea:0 "Летающие тигры"
 KMT_the_flying_tigers_idea_desc:0 "[USA.GetAdjective] лётчики поддерживают наше дело и сражаются плечом к плечу с нашими пилотами."
 KMT_sichuan_famine_no_aid:0 "Голод в Сычуани"
 KMT_sichuan_famine_no_aid_desc:0 "Народ теряет доверие к правительству из-за его безразличия к проблемам населения."
 KMT_sichuan_famine_aid:0 "Борьба с голодом"
 KMT_sichuan_famine_aid_desc:0 "Перенаправленные на борьбу с голодом средства улучшили образ правительства в глазах народа."
 KMT_corrupted_government:0 "Коррумпированная экономика"
 KMT_continue_the_national_revolution:0 "Продолжить Национальную революцию"
 KMT_fight_for_survival:0 "Борьба за выживание"
 KMT_sino_german_joint_research_ger_adv:0 "Совместные китайско-германские военные исследования"
 KMT_aggresion:0 "Агрессия"
 navy_air_est:0 "Морская авиация"
 cg_warlords:0 "Является военачальником"
 KMT_student_soldiers:0 "Принудительный призыв"
 KMT_treasure_abroad_idea:0 "Артефакты отправлены за границу"
 KMT_wai_chingkuo:0 "Цзян Цзинго"
 CHI_technological_cooperation_idea:0 "Технологическое сотрудничество"
 CHI_technological_cooperation_idea_desc:0 "Нам есть чему поучиться у наших братьев по оружию."
 KMT_internal_stability:0 "Приоритет внутренней стабильности"
 KMT_internal_stability_desc:0 "Японцы — болезнь кожи, а коммунистические бандиты — болезнь сердца. Чтобы спасти Китай, мы должны прежде всего очистить его от всех предателей."
 KMT_SHX_offer:0 "Предложение Шаньси"
 KMT_SHX_offer_desc:0 "Владения Яня не предоставляют нам права прохода войск. Если заставить его подчиниться, мы сможем окружить коммунистов и покончить с ними раз и навсегда."
 KMT_preparation:0 "Антикоммунистическое строительство"
 KMT_preparation_desc:0 "После почти полного уничтожения во время Великого похода коммунистические бандиты скрываются в районе Шэньси. Мы должны атаковать прежде, чем они оправятся!"
 KMT_strike_PRC:0 "Удар по коммунистическим бандитам"
 KMT_strike_PRC_desc:0 "Бандиты всё ещё восстанавливаются после Великого похода. Мы должны нанести удар, пока они слабы!"
 KMT_warlord:0 "Объединить Китай"
 KMT_warlord_desc:0 "Теперь, когда коммунистические бандиты уничтожены, пришло время военачальникам встретиться с нашим мечом. Они слишком долго грабили народ. Мы должны завершить Национальную революцию!"
 KMT_deal_with_SIK:0 "Синьцзянский вопрос"
 KMT_deal_with_SIK_desc:0 "Синьцзян — неотъемлемая часть Китая, а его местный губернатор доказал, что является сепаратистом. Мы потребуем его быстрого и безоговорочного подчинения; если ультиматум не подействует, нашей армии будет достаточно, чтобы заставить его сдаться."
 KMT_external_defense:0 "Приоритет внешней угрозы"
 KMT_external_defense_desc:0 "Хотя коммунисты представляют серьёзную угрозу, Япония способна уничтожить всю китайскую нацию. Она не удовлетворится одной Маньчжурией и однажды попытается захватить остальной Китай. Мы должны сделать всё возможное, чтобы подготовиться к буре."
 KMT_fortify_land:0 "Построить линию Сунь Ятсена"
 KMT_fortify_land_desc:0 "Японские действия в районе Пекина ясно показывают их намерения. Мы должны укрепить границы. Мы не отдадим им ни пяди священной китайской земли!"
 KMT_fortify_coast:0 "Центральные укрепления"
 KMT_fortify_coast_desc:0 "Учитывая господство Японии на море, в случае войны она наверняка предпримет высадки на побережье. Мы должны подготовиться, пока ещё есть время. Мы не отдадим Восточный Париж без боя!"
 KMT_national_def_propaganda:0 "Пропаганда национальной обороны"
 KMT_national_def_propaganda_desc:0 "Чтобы защититься от японской угрозы, мы должны объединить китайский народ. Как бы мы ни ненавидели коммунистических бандитов и военачальников, каждый мужчина, каждая женщина и каждый ребёнок должны быть готовы вместе сражаться и умереть за Китай."
 KMT_tibet_march:0 "Потребовать Тибет"
 KMT_tibet_march_desc:0 "Тибет имеет решающее значение для обороны Китая и его будущего расширения. Однако после революции 1911 года регион остаётся независимым от китайской власти. Мы должны исправить эту ошибку."
 KMT_tibet_friend:0 "Подружиться с Тибетом"
 KMT_tibet_friend_desc:0 "Тибет имеет решающее значение для обороны Китая и его будущего расширения. Однако после революции 1911 года он обрёл независимость. Мы должны заключить союз с Далай-ламой и обезопасить свои фланги."
 KMT_redraw_mcmahon:0 "Пересмотреть линию Мак-Магона"
 KMT_redraw_mcmahon_desc:0 "Тибет согласился на позорную Симлскую конвенцию, изменившую его границу с Индией. Мы должны добиться пересмотра этой линии в нашу пользу."
 KMT_industrial_effort:0 "Инвестиции в промышленность"
 KMT_industrial_effort_desc:0 "Китайская промышленность всегда отставала от западной и японской. Чтобы сохранить независимость, мы должны увеличить промышленное производство. Также можно разрешить иностранным компаниям инвестировать в нашу промышленность."
 KMT_armament_effort:0 "Возродить Цзяннаньский арсенал"
 KMT_armament_effort_desc:0 "Цзяннаньский арсенал снабжал династию Цин современным вооружением. Нам следует позаимствовать это название для военно-промышленного комплекса, который станет ядром растущей оружейной промышленности."
 KMT_gain_control_of_the_sea:0 "Расширить военно-морской флот"
 KMT_gain_control_of_the_sea_desc:0 "Мы давно утратили превосходство на море после разгрома в битве на реке Ялу. Японский флот угрожает нашей торговле, поэтому мы должны постараться защитить торговые суда в открытом море."
 KMT_the_big_rear_concept:0 "План «Большого тыла»"
 KMT_the_big_rear_concept_desc:0 "Пока война бушует на востоке Китая, запад страны остаётся сравнительно безопасным. Мы должны развивать эти отсталые районы, чтобы и они могли внести вклад в борьбу Китая."
 KMT_increase_funding_of_german_weaponary:0 "Перенять германское снаряжение"
 KMT_increase_funding_of_german_weaponary_desc:0 "Несмотря на помощь германских советников, таких как фон Фалькенхаузен, и некоторое количество импортного германского снаряжения, качество наших отечественных образцов ужасно. Используя германское вооружение в качестве образца для производства, мы сможем повысить качество в восемь раз!"
 KMT_lure_them_in_strategy:0 "Стратегия заманивания врага вглубь"
 KMT_lure_them_in_strategy_desc:0 "Огромная территория и сложный рельеф нашей страны позволяют нам отступать и заманивать захватчиков на выбранные нами поля сражений. Пусть империалисты попробуют преследовать нас! За каждым углом их будет ждать засада, а на каждом шагу — ловушка!"
 KMT_air_base_expansion:0 "Расширение авиабаз"
 KMT_air_base_expansion_desc:0 "Нам нужны авиабазы, с которых самолёты смогут взлетать и на которые смогут садиться; иначе они так и останутся музейными экспонатами на складах."
 KMT_national_resources_commission:0 "Национальная комиссия по ресурсам"
 KMT_national_resources_commission_desc:0 "Национальная комиссия по ресурсам отвечает за поиск и добычу полезных ископаемых в Китае. Её создание значительно повысит эффективность наших усилий по освоению природных ресурсов."
 KMT_national_defense_council:0 "Совет национальной обороны"
 KMT_national_defense_council_desc:0 "Японцы и коммунистические бандиты наносят вред нашей стране, поэтому мы должны найти способ организовать оборону против них. Нам также следует попытаться импортировать современное зарубежное снаряжение."
 KMT_revive_jiangnan_shipyard:0 "Расширить Цзяннаньскую судостроительную группу"
 KMT_revive_jiangnan_shipyard_desc:0 "Нам следует расширить возможности Цзяннаньского арсенала по строительству кораблей; это позволит создать более сильный флот для противостояния будущим угрозам."
 KMT_revive_hanyang_armory:0 "Возродить Ханьянский арсенал"
 KMT_revive_hanyang_armory_desc:0 "Ханьянский арсенал был одним из важнейших и наиболее успешных оружейных предприятий Движения за самоусиление, начатого чиновниками династии Цин. Мы можем возродить его, чтобы снабжать армию снаряжением достойного качества."
 KMT_air_effort:0 "Реорганизовать ВВС Китайской Республики"
 KMT_air_effort_desc:0 "Мы всегда пренебрегали военно-воздушными силами. Чтобы успешно вести войну в воздухе, этот род войск необходимо серьёзно реформировать."
 KMT_air_reform:0 "«Летающие тигры»"
 KMT_air_reform_desc:0 "Осознав справедливость нашего дела, группа американских лётчиков добровольно вступила в наши военно-воздушные силы. Нам следует сделать этих хорошо подготовленных людей элитным ядром обновлённых ВВС."
 KMT_study_foreign_ship:0 "Изучить иностранные конструкции кораблей"
 KMT_study_foreign_ship_desc:0 "В кораблестроении мы отстаём от других государств. Чтобы однажды создать первоклассный флот, мы должны понять, что делает их корабли лучше наших."
 KMT_demand_taiwan:0 "Потребовать Тайвань"
 KMT_demand_taiwan_desc:0 "Народ Тайваня должен быть освобождён от нынешнего правителя и возвращён в состав нашей страны. Нация слишком долго была разделена и теперь должна объединиться."
 KMT_taiwan_fleet_hub:0 "Тайваньский центр флота"
 KMT_taiwan_fleet_hub_desc:0 "Иностранцы оставили на Тайване обширную инфраструктуру. Нам следует расширить эту базу и превратить весь остров в единый военно-морской узел и промышленный центр."
 KMT_pacific_fleet:0 "Прорвать первую островную цепь"
 KMT_pacific_fleet_desc:0 "Чтобы Китай полностью раскрыл свой потенциал, мы не должны ограничиваться этой стороной Тихого океана. Нам нужен флот, способный пройти дальше Тайваня и Японии."
 KMT_sea_fleet:0 "Провести линию девяти пунктиров"
 KMT_sea_fleet_desc:0 "Через Южно-Китайское море проходят многие важнейшие торговые пути. Установив контроль над этим морским коридором, мы сможем двигаться к господству в Юго-Восточной Азии. Однако для подкрепления наших притязаний и отправки всей вражеской торговли на морское дно нам потребуется соответствующий флот."
 KMT_naval_equipment:0 "Военно-морское оснащение"
 KMT_naval_equipment_desc:0 "Современному флоту необходимо современное оснащение."
 KMT_pacific_expansion:0 "Прорвать вторую островную цепь"
 KMT_pacific_expansion_desc:0 "Теперь, когда у нас есть флот, способный вести боевые действия за пределами Японии, мы должны построить силы, которые заставят любую тихоокеанскую державу ощутить гнев Китая. Мы заставим Чжэн Хэ гордиться нами."
 KMT_sea_expansion:0 "Обеспечить соблюдение линии девяти пунктиров"
 KMT_sea_expansion_desc:0 "Похоже, одного заявления наших притязаний на Южно-Китайское море оказалось недостаточно. Мы должны продолжить расширение флота, чтобы силой заставить империалистов признать справедливость нашего дела!"
 KMT_modernize_army:0 "Модернизировать армию"
 KMT_modernize_army_desc:0 "Одного боевого духа и мастерства недостаточно для победы в войне. Нам также необходимо современное снаряжение."
 KMT_north_plan:0 "Вернуть Маньчжурию"
 KMT_north_plan_desc:0 "Дунбэй, который жители Запада называют Маньчжурией, всего несколько лет назад пал перед японцами и их марионетками. Мы должны вернуть его!"
 KMT_pioneering_the_north_east:0 "Основать Агентство развития Северо-Востока"
 KMT_pioneering_the_north_east_desc:0 "Хотя японцы развили некоторые районы Маньчжурии, огромные пространства всё ещё остаются нетронутыми. Нам следует начать масштабную кампанию по приобщению этих некогда варварских земель к современному миру."
 KMT_science_effort:0 "Академия Синика"
 KMT_science_effort_desc:0 "Основанная в 1928 году Академия Синика контролирует и координирует научные, общественные и гуманитарные исследования во всех государственных научных институтах и университетах Китайской Республики. В отличие от других финансируемых государством научных учреждений, Академия Синика подчиняется непосредственно президенту."
 KMT_extra_research_slot:0 "Расширить Пекинский университет"
 KMT_extra_research_slot_desc:0 "Пекинский университет — учреждение мирового уровня. Нам следует увеличить его финансирование и предоставить стипендии талантливой молодёжи, чтобы вырастить новое поколение умелых учёных и руководителей."
 KMT_national_institute:0 "Убежище для евреев"
 KMT_national_institute_desc:0 "Многие евреи начали селиться в Шанхае, спасаясь от преследований и смерти в Европе. Нам следует открыть границы для всех еврейских беженцев, чтобы воспользоваться их знаниями и опытом. Еврейские инженеры уже привезли нам польские и германские проекты вооружения. Что ещё они смогут сделать для своих новых покровителей?"
 KMT_military_science:0 "Военная наука"
 KMT_military_science_desc:0 "И гражданская, и военная наука жизненно важны для силы государства. Достаточное финансирование исследований сделает нашу армию грознее."
 KMT_ballistic_weapon:0 "Ракетная система «Гуаньди»"
 KMT_ballistic_weapon_desc:0 "Наступила заря применения ракет в войне. Если наши армии хотят выжить на современном поле боя, мы должны принять на вооружение эту новую систему. Пусть враги ощутят ярость бога войны!"
 KMT_electronics_research:0 "Национализировать электронную компанию"
 KMT_electronics_research_desc:0 "Хотя электричество ещё не добралось до деревень, наши учёные уже заняты созданием отечественной электроники для рынков Шанхая и Гонконга. Нам следует взять под контроль компанию «Чэнгун» и использовать её для государственных исследований."
 KMT_extra_research_slot_2:0 "Образование для нации"
 KMT_extra_research_slot_2_desc:0 "Недостаточно допускать в университеты только тех, кто достаточно богат, чтобы оплатить обучение. Мы должны национализировать все университеты Китая и принимать студентов по способностям, а не по достатку."
 KMT_bold_hypothesis:0 "Смелая наука"
 KMT_bold_hypothesis_desc:0 "Наши учёные страдают от комплекса неполноценности и считают, что никогда не превзойдут Запад, как бы ни старались. Нам необходимо начать пропагандистскую кампанию, чтобы восстановить их боевой дух."
 KMT_nuclear_physics:0 "Ядерная физика"
 KMT_nuclear_physics_desc:0 "Если теории Эйнштейна верны, расщепление атома может привести к созданию оружия невообразимой мощи. Нам следует глубже изучить эту возможность."
 KMT_jet:0 "Реактивный двигатель «Тяньлун»"
 KMT_jet_desc:0 "Развитие реактивных технологий обеспечит наше господство в небе. Дни, когда китайский пехотинец оставался беззащитным перед ударами с воздуха, наконец закончатся. Наша мощь взмоет ввысь, словно летящий дракон."
 KMT_fighter_focus:0 "Ставка на истребители"
 KMT_fighter_focus_desc:0 "Завоевание превосходства в воздухе — наша главная задача в воздушной войне, и именно истребители способны её выполнить."
 KMT_bomber_focus:0 "Ставка на бомбардировщики"
 KMT_bomber_focus_desc:0 "Уничтожение вражеских линий снабжения и заводов — лучший способ ведения воздушной войны. Поэтому нам следует сосредоточиться на бомбардировщиках."
 KMT_cas_effort:0 "Развитие штурмовой авиации"
 KMT_cas_effort_desc:0 "Непосредственная авиационная поддержка крайне полезна для наступления сухопутных войск. Эти штурмовики помогут нам выиграть войну."
 KMT_nav_effort:0 "Развитие морской авиации"
 KMT_nav_effort_desc:0 "Морские бомбардировщики превосходно уничтожают вражеские корабли и порты; они являются неотъемлемой частью войны на море."
 KMT_political_effort:0 "Национальная реформа"
 KMT_political_effort_desc:0 "Простой народ почти не испытывает любви к нашему правительству; чтобы выжить, мы должны начать искоренять коррупцию."
 KMT_government_reform:0 "Переосмыслить республику"
 KMT_government_reform_desc:0 "Нынешняя форма правления нас не устраивает; мы должны найти другой путь."
 KMT_strengthen_the_republic:0 "Укрепить республику"
 KMT_strengthen_the_republic_desc:0 "Наши граждане довольны республикой. Чтобы укрепить их доверие, мы должны твёрдо придерживаться идей Сунь Ятсена."
 KMT_democratic_republic:0 "Завершить период политической опеки"
 KMT_democratic_republic_desc:0 "Наши граждане теперь готовы к демократии. Во исполнение воли Сунь Ятсена мы положим конец однопартийному правлению и проведём выборы, как только сможем должным образом их организовать."
 KMT_unitary_semi_presidential_republic:0 "Продолжить политическую опеку"
 KMT_unitary_semi_presidential_republic_desc:0 "Несмотря на значительный прогресс, народ всё ещё не готов к демократии. Руководящая роль Гоминьдана должна сохраняться."
 KMT_promote_nationalism:0 "Возродить движение «Новая жизнь»"
 KMT_promote_nationalism_desc:0 "Над нашей страной долго насмехались из-за её слабости и неспособности постоять за себя. Нам следует продолжить прежние усилия по воспитанию национально сознательных граждан, чтобы вновь сделать Китай великим."
 KMT_centralizing_power:0 "Централизация власти"
 KMT_centralizing_power_desc:0 "Период политической опеки постепенно позволяет нам сосредоточить всю местную и региональную власть в руках центрального правительства. Мы не повторим ошибок 1912 и 1916 годов. В едином Китае не может быть федерализма."
 KMT_into_despotism:0 "Объявить военное положение"
 KMT_into_despotism_desc:0 "По указу Чана Китай не пойдёт путём демократии, фашизма или коммунизма. Китай последует за Гоминьданом, который поведёт Срединное государство в будущее. Враги называют это деспотизмом. Мы называем это прогрессом."
 KMT_social_experiment:0 "Расширить государственную лабораторию"
 KMT_social_experiment_desc:0 "Чтобы развивать технологический потенциал страны, мы должны расширить государственную лабораторию и нанять больше учёных."
 KMT_voting_rights:0 "Новая конституция"
 KMT_voting_rights_desc:0 "Нынешняя конституция не способна предотвратить тиранию и коррупцию. Для полного перехода к демократической республике мы должны написать новую конституцию. Необходимо закрепить право голоса, право на свободу и систему сдержек и противовесов. Китай должен стать государством законов, а не государством людей."
 KMT_implement_parliamentary_system:0 "Движение за реконструкцию деревни"
 KMT_implement_parliamentary_system_desc:0 "Опорой коммунистов служит недовольное крестьянство. Чтобы демократия в Китае выжила, мы должны лишить коммунистов поддержки, улучшив жизнь крестьян. Следует разделить помещичьи владения, внедрить новые сельскохозяйственные методы, строить школы и обеспечить медицинскую помощь; Китаю пора начать заботиться о своём народе."
 KMT_universal_sufferage:0 "Три народных принципа"
 KMT_universal_sufferage_desc:0 "Центральное место в учении Сунь Ятсена занимают три народных принципа: национализм, народовластие и народное благосостояние. В прошлом нам удалось воплотить лишь национализм, но теперь мы движемся к окончательному осуществлению мечты Суня."
 KMT_european_friend:0 "Присоединиться к Союзникам"
 KMT_european_friend_desc:0 "На Западе демократия укоренилась гораздо прочнее, чем в Китае. Нам следует присоединиться к блоку западных демократий, чтобы учиться на их примере и укрепить коалицию свободных народов."
 KMT_alone_in_the_east:0 "Первая демократия в Азии"
 KMT_alone_in_the_east_desc:0 "Западные демократии охвачены хаосом. Присоединение к ним сейчас погубит нашу молодую и хрупкую республику. Мы должны в одиночку стоять в Азии маяком свободы на Востоке."
 KMT_knowledge_of_the_citizens:0 "Воспитание граждан"
 KMT_knowledge_of_the_citizens_desc:0 "В прошлом образование было недоступно многим людям. Мы расширим национальную школьную систему и введём программу, которая будет воспитывать граждан, а не подданных."
 KMT_westernization:0 "Вестернизация"
 KMT_westernization_desc:0 "Знания западного мира превосходят наше воображение; для их освоения потребуется целая национальная кампания."
 KMT_fascism_focus:0 "Власть синерубашечникам"
 KMT_fascism_focus_desc:0 "Сила, продемонстрированная Германским рейхом, чрезвычайно впечатляет. Наша страна должна последовать его путём к славе. Мы обязаны поддержать тех, кто проявил величайшую преданность нашей родине."
 KMT_militarism_focus:0 "Национальное военное воспитание"
 KMT_militarism_focus_desc:0 "В народе говорят: «Из хорошего железа не делают гвоздей, из хороших людей не делают солдат». Такое презрение к армии недопустимо. Мы должны поднять престиж вооружённых сил в глазах народа."
 KMT_ban_communism:0 "Возродить Белый террор"
 KMT_ban_communism_desc:0 "Мы не можем допустить, чтобы коммунистические ячейки проникли на подконтрольные нам территории и подняли восстание. Необходимо возобновить гражданские и военные чистки, чтобы в наших владениях не осталось и следа коммунизма."
 KMT_planning_our_empire:0 "Восстановить империю"
 KMT_planning_our_empire_desc:0 "На протяжении большей части истории цивилизации Китай был самым могущественным государством на Земле. Мы должны вернуть себе место под солнцем."
 KMT_isolation_tactic:0 "Тактика изоляции СССР"
 KMT_isolation_tactic_desc:0 "Коминтерн распространяется по Центральной Азии, и красная угроза постепенно окружает нас. Мы должны посеять недоверие в их системе союзов, чтобы восстановить прежние границы."
 KMT_war_propaganda:0 "Военная пропаганда"
 KMT_war_propaganda_desc:0 "Промывание мозгов народу рассказами о пользе войны и победы — прекрасный способ сплотить страну и создать сильную армию."
 KMT_military_first:0 "Армия прежде всего"
 KMT_military_first_desc:0 "«Просвещение» народа о преимуществах войны и экспансии обеспечит нам возможность уничтожать чудовищ за рубежом."
 KMT_war_fanaticism:0 "Военный фанатизм"
 KMT_war_fanaticism_desc:0 "Недостаточно просто сражаться и умирать. Мы должны сражаться и побеждать любой ценой. Пусть наша кровь вновь сделает Китай центром мира! ЧЖУНГО ВАНЬСУЙ!"
 KMT_claim_territory:0 "Притязания даннической системы"
 KMT_claim_territory_desc:0 "Мы потеряли из-за империалистов и земли, и данников. Поскольку государства-данники формально становились вассалами престола, мы можем предъявить права на множество территорий в Восточной Азии."
 KMT_demand_soviet_puppets:0 "Потребовать Центральную степь и Синьцзян"
 KMT_demand_soviet_puppets_desc:0 "Территориальные споры не обязательно должны заканчиваться кровопролитными войнами; если другая сторона готова к компромиссу, дипломатические методы вполне жизнеспособны."
 KMT_demand_indochina:0 "Потребовать Индокитай"
 KMT_demand_indochina_desc:0 "Территориальные споры не обязательно должны заканчиваться кровопролитными войнами; дипломатические методы вполне жизнеспособны, если стороны готовы к компромиссу."
 KMT_special_force_training:0 "САКО"
 KMT_special_force_training_desc:0 "Китайско-американская организация сотрудничества призвана оказывать разведывательную поддержку нашей армии и обучать силы специальных операций."
 KMT_improve_burma_road:0 "Улучшить Бирманскую дорогу"
 KMT_improve_burma_road_desc:0 "Хотя британцы построили Бирманскую дорогу для помощи в войне против японцев, сама она не слишком эффективна; нам следует её улучшить."
 KMT_trade_port_neutral:0 "Отменить неравноправные договоры"
 KMT_trade_port_neutral_desc:0 "Из-за многочисленных неравноправных договоров, подписанных некомпетентной династией Цин с западными державами, часть наших земель всё ещё находится в чужих руках. Мы должны объединить наш народ под одним знаменем!"
 KMT_trade_port_demo:0 "Торговые порты в обмен на помощь"
 KMT_trade_port_demo_desc:0 "Поскольку и западные страны, и мы придерживаемся демократии, мы должны помогать друг другу в трудный час. Однако за такую помощь придётся заплатить — в возмещение унижения, которому они подвергли нас, когда мы были слабы."
 KMT_trade_port_fascism:0 "Китайские порты"
 KMT_trade_port_fascism_desc:0 "Уступка торговых портов по неравноправным договорам стала величайшим унижением для китайцев: западные державы ограничивают нашу торговлю и делят наши земли. Мы должны вернуть эти территории и вновь сделать Китай великим!"
 KMT_industrialization_NW:0 "Местная индустриализация: Северо-Запад"
 KMT_industrialization_NW_desc:0 "Северо-западный регион пока может казаться бесплодной землёй. Но вскоре он станет одним из самых индустриализированных районов страны."
 KMT_excavation_NW:0 "Разработка месторождений Северо-Запада"
 KMT_excavation_NW_desc:0 "Мы должны разведать новые ресурсы на нашей земле, чтобы избавиться от зависимости от импорта."
 KMT_industrialization_S:0 "Местная индустриализация: Юг"
 KMT_industrialization_S_desc:0 "Юг уже может считаться одним из самых индустриализированных регионов, но его ещё можно значительно развить."
 KMT_excavation_S:0 "Каучуковые плантации"
 KMT_excavation_S_desc:0 "Климат юга отлично подходит для выращивания каучуконосов; нам следует воспользоваться этим преимуществом."
 KMT_excavation_NE:0 "Разведка ресурсов Северо-Востока"
 KMT_excavation_NE_desc:0 "Японцы оставили в этом районе множество инструментов; мы можем использовать их для поиска новых ресурсов."
 KMT_ledo_road:0 "Дорога Ледо"
 KMT_ledo_road_desc:0 "Захватчики перерезали Бирманскую дорогу; нам необходимо проложить новый путь снабжения из Индии."
 KMT_dare_to_die_corps:0 "Корпус смертников"
 KMT_dare_to_die_corps_desc:0 "Если мы хотим победить захватчиков, наш народ должен быть достаточно храбр, чтобы не бояться смерти, и готов на всё ради защиты страны."
 KMT_reuse_captured_weaponary:0 "Повторное использование трофейного оружия"
 KMT_reuse_captured_weaponary_desc:0 "Чтобы выдержать долгую войну на истощение, крайне важно в полной мере использовать захваченное в боях снаряжение и тем самым поддерживать боеспособность наших армий."
 KMT_cbis:0 "Расширить ЦБРС"
 KMT_cbis_desc:0 "Центральное бюро расследований и статистики является разведывательной службой Гоминьдана. Недавно мы провели его реорганизацию, а теперь должны расширить деятельность бюро, чтобы внутренние подрывные элементы Китая не угрожали режиму."
 KMT_zhonghua_minzu:0 "Чжунхуа миньцзу"
 KMT_zhonghua_minzu_desc:0 "Наш принцип «пяти народов в едином союзе» объединяет ханьцев и все меньшинства Китая. Все они являются потомками одного народа, стоявшего у истоков Китая. Вместе мы сможем вернуть величие нашей стране и почтить предков."
 KMT_cement_control_on_the_economy:0 "Укрепить контроль над экономикой"
 KMT_cement_control_on_the_economy_desc:0 "Мы можем выступать против коммунистов, но это не означает, что мы должны склоняться перед капиталистами. Сосредоточившись прежде всего на государственных предприятиях, мы обязаны добиться верности экономики и тех, кто ею управляет, правительству Гоминьдана."
 KMT_georgist_tax_reform:0 "Джорджистская налоговая реформа"
 KMT_georgist_tax_reform_desc:0 "Джорджизм лежит в основе значительной части экономической теории Сунь Ятсена. Одним из её ключевых положений является введение налога на земельную собственность, который он называл «единственным способом содержания правительства — бесконечно справедливым, разумным и равномерно распределённым налогом, на котором мы и построим нашу новую систему»."
 KMT_monetary_reform:0 "Денежная реформа"
 KMT_monetary_reform_desc:0 "Гиперинфляция разрушает нашу экономику. Мы должны немедленно взять ситуацию под контроль."
 KMT_preemptive_preparation:0 "Подготовиться к гражданской войне"
 KMT_preemptive_preparation_desc:0 "Нам необходимо готовиться к столкновению с коммунистами, ведь они, вероятно, тоже готовятся выступить против нас."
 KMT_warlord_after_civil_war:0 "Объединить Китай"
 KMT_warlord_after_civil_war_desc:0 "Теперь, когда коммунистические бандиты уничтожены, пришло время военным правителям встретиться с нашим клинком."
 KMT_the_yangtze_partition:0 "Предложить раздел по Янцзы"
 KMT_the_yangtze_partition_desc:0 "Война складывается не в нашу пользу, и мы терпим тяжёлые поражения. Поскольку [PRC.getAdjective] войска не способны прорвать наши оборонительные рубежи на Янцзы, мы можем предложить дипломатическое решение этой мучительной гражданской войны, если готовы выжить и сохранить наши истощённые войска."
 KMT_taiwan_bastion:0 "Тайваньский бастион"
 KMT_taiwan_bastion_desc:0 "Есть вероятность, что мы проиграем эту войну. На такой случай мы должны превратить Тайвань в национальный бастион, где сможем переждать, подготовиться и однажды вернуть материк."
 KMT_placate_former_puppet_government:0 "Сотрудничать с коллаборационистами"
 KMT_placate_former_puppet_government_desc:0 "Бывшие японские марионетки — предатели, и это известно всем. Но теперь, когда японцы ушли, они могут послужить новым хозяевам."
 KMT_harsh_takeover_focus:0 "Захватить имущество ханьцзяней"
 KMT_harsh_takeover_focus_desc:0 "С предателями незачем церемониться. Мы арестуем их всех и передадим их ресурсы в наше распоряжение."
 KMT_development_of_taiwan:0 "Развивать Тайвань"
 KMT_development_of_taiwan_desc:0 "Японцы уделяли Тайваню немало внимания. Поскольку его экономическая база значительно превосходит остальной Китай, разумно развивать остров и дальше, чтобы он стал образцом эффективности нашего управления."
 KMT_incorporate_warlord_forces:0 "Интегрировать войска военных правителей"
 KMT_incorporate_warlord_forces_desc:0 "Нынешняя армия состоит как из Центральной армии, так и из войск военных правителей. Однако последние не слишком охотно подчиняются нашему командованию. Если нам удастся завоевать их доверие, армия станет гораздо эффективнее."
 KMT_focus_on_our_own_army:0 "Сосредоточиться на Центральной армии"
 KMT_focus_on_our_own_army_desc:0 "Недисциплинированные войска военных правителей не заслуживают нашего внимания. Они годятся лишь на роль пушечного мяса и приманки, пока Центральная армия наносит решающий удар по врагу."
 KMT_increase_sino_german_cooperation:0 "Расширить китайско-германское сотрудничество"
 KMT_increase_sino_german_cooperation_desc:0 "Нам следует теснее сотрудничать с Германией. Это даст нам преимущество над врагами."
 KMT_support_pro_japanese_faction:0 "Поддержать прояпонскую фракцию"
 KMT_support_pro_japanese_faction_desc:0 "Возможно, вместо того чтобы враждовать с японцами, мы сумеем найти более мирное решение?"
 KMT_re_elaborate_hakko_ichiu:0 "Предложить китайско-японский союз"
 KMT_re_elaborate_hakko_ichiu_desc:0 "Чтобы создать подлинную «Сферу сопроцветания Азии», мы должны заключить союз с Японией. Её передовая промышленность несомненно даст нам преимущество над врагами."
 KMT_introduce_shipbuilding_technology:0 "Внедрить кораблестроительные технологии"
 KMT_introduce_shipbuilding_technology_desc:0 "Благодаря мощной судостроительной промышленности нашего друга мы можем попросить его помочь развитию нашей собственной."
 KMT_introduce_shipbuilding_technology_usa:0 "Внедрить кораблестроительные технологии"
 KMT_introduce_shipbuilding_technology_usa_desc:0 "Благодаря мощной судостроительной промышленности нашего друга мы можем попросить его помочь развитию нашей собственной."
 KMT_force_japan_to_accept_peace:0 "Запросить вмешательство [GER.GetAdjective] государства"
 KMT_force_japan_to_accept_peace_desc:0 "Учитывая наши нынешние отношения с Германией, мы можем попросить её вмешаться в нашу войну с Японией."
 KMT_force_japan_to_cede_land:0 "Снова запросить вмешательство [GER.GetAdjective] государства"
 KMT_force_japan_to_cede_land_desc:0 "Несмотря на согласие с условиями мира, японцы всё ещё отказываются вернуть наши земли. Возможно, пора вновь обратиться к Германии за вмешательством."
 KMT_pincer_soviet:0 "Взять [SOV.GetAdjective] войска в клещи"
 KMT_pincer_soviet_desc:0 "Пока [SOV.GetAdjective] силы заняты на другом направлении, мы можем ударить там, где они меньше всего этого ожидают."
 KMT_japanese_advisors:0 "Японские советники"
 KMT_japanese_advisors_desc:0 "Мы можем попросить нашего [JAP.GetAdjective] друга прислать советников для помощи армии."
 KMT_draw_closer_to_the_empire:0 "Улучшить отношения с государством [ENG.GetNameDef]"
 KMT_draw_closer_to_the_empire_desc:0 "Учитывая историю наших отношений с британцами, мы можем предпринять шаги для их улучшения и, возможно, даже заключить союз."
 KMT_trans_pacific_friendship_focus:0 "Транстихоокеанская дружба"
 KMT_trans_pacific_friendship_focus_desc:0 "В ходе нынешнего перехода к демократии мы можем укрепить связи с США по другую сторону Тихого океана."
 KMT_oust_the_colonizers:0 "Изгнать колонизаторов"
 KMT_oust_the_colonizers_desc:0 "Колониализм ещё хуже империализма; поэтому мы освободим наших азиатских братьев от зла западных колонизаторов!"
 KMT_pursuade_britain:0 "Убедить государство [ENG.GetNameDef]"
 KMT_pursuade_britain_desc:0 "Стремясь добыть ресурсы для своей военной машины, [JAP.GetAdjective] государство несомненно нападёт на британские и нидерландские колонии в Азии. Зная это, мы можем убедить Британию нанести удар первой. В случае успеха мы приобретём могущественного союзника."
 KMT_join_the_axis:0 "Присоединиться к Оси"
 KMT_join_the_axis_desc:0 "Пришло время укрепить связи с нашими германскими друзьями."
 KMT_develop_the_rear:0 "Завершить план «Большого тыла»"
 KMT_develop_the_rear_desc:0 "Чем больше земель мы теряем, тем настойчивее должны проводить и завершать план «Большого тыла»."
 kmt.1.t:0 "Предложение Шаньси"
 kmt.1.d:0 "Китайское правительство требует нашего подчинения. Они заявляют, что сопротивление приведёт к кровопролитию."
 kmt.1.a:0 "Второго шанса не будет! Мы должны подчиниться, пока не пролилась кровь."
 kmt.1.b:0 "Лучше стать марионеткой, чем быть полностью аннексированными."
 kmt.1.c:0 "Никогда!"
 kmt.2.t:0 "Шаньси аннексирована"
 kmt.2.d:0 "Военный правитель Шаньси принял наше предложение. Следующими станут бандиты."
 kmt.2.a:0 "Теперь, когда их тыл открыт, разгромить бандитов будет легче."
 kmt.3.t:0 "Предложение сделать Шаньси марионеткой"
 kmt.3.d:0 "Хотя они согласились подчиниться, они потребовали автономии."
 kmt.3.a:0 "Приемлемое требование; пусть станут нашими вассалами."
 kmt.3.b:0 "Неприемлемо! Нам нужен полный контроль!"
 kmt.4.t:0 "Шаньси отказалась"
 kmt.4.d:0 "Военный правитель Шаньси отказался сотрудничать. [Root.GetLeader] не может стерпеть подобного унижения центрального правительства. Мы должны разобраться с военным правителем Шаньси."
 kmt.4.a:0 "Они пожалеют о своём решении."
 kmt.5.t:0 "Предложение стать марионеткой отклонено"
 kmt.5.d:0 "Китайское правительство отвергло наше встречное предложение. Они требуют полного контроля над регионом. Если мы не подчинимся, они могут начать наступление."
 kmt.5.a:0 "У нас недостаточно сил для борьбы. Мы должны подчиниться."
 kmt.5.b:0 "Мы не подчинимся!"
 kmt.6.t:0 "Пропаганда дискредитирована"
 kmt.6.d:0 "Наша пропаганда национальной обороны дискредитирована. Народ считает нас лжецами, поскольку мы нападаем на других китайцев."
 kmt.6.a:0 "Глупцы, неспособные увидеть общую картину."
 kmt.8.t:0 "Государство [FROM.GetNameDefCap] требует подчинения"
 kmt.8.d:0 "Государство [FROM.GetNameDefCap] считает Тибет своей территорией. Оно требует нашей полной и немедленной аннексии."
 kmt.8.a:0 "Они слишком сильны, чтобы сопротивляться"
 kmt.8.b:0 "Далай-лама никогда не подчинится!"
 kmt.9.t:0 "Тибетский компромисс"
 kmt.9.d:0 "Далай-лама согласился на наши условия. Теперь Тибет принадлежит нам."
 kmt.9.a:0 "Тибет принадлежит нам по праву!"
 kmt.10.t:0 "Тибет отказался"
 kmt.10.d:0 "Тибетский лидер отверг наше щедрое предложение. Они утверждают, что никогда не подчинятся нашей «тирании»."
 kmt.10.a:0 "Это мы ещё посмотрим."
 kmt.11.t:0 "Государство [FROM.GetNameDefCap] требует пересмотреть линию Мак-Магона"
 kmt.11.d:0 "Теперь, когда Тибет находится под контролем государства [FROM.GetAdjective], оно требует пересмотреть линию Мак-Магона в свою пользу."
 kmt.11.a:0 "Бесполезная земля для бесполезного народа"
 kmt.11.b:0 "Передать вопрос государству [ENG.GetNameDef]"
 kmt.11.c:0 "Мы не уступим им ни пяди!"
 kmt.11.c_tt:0 "§RМожет привести к войне с государством [FROM.GetNameDef]§!"
 kmt.12.t:0 "Линия Мак-Магона пересмотрена"
 kmt.12.d_1:0 "Государство [RAJ.GetNameDefCap] согласилось пересмотреть линию Мак-Магона в нашу пользу. Теперь наши владения расширяются дальше на запад."
 kmt.12.d_2:0 "Государство [ENG.GetNameDefCap] согласилось пересмотреть линию Мак-Магона в нашу пользу. Теперь наши владения расширяются дальше на запад."
 kmt.12.a:0 "Прекрасный день для народа государства [ROOT.GetAdjective]"
 kmt.13.t:0 "Государство [CHI.GetNameDefCap] требует пересмотреть линию Мак-Магона"
 kmt.13.d:0 "Теперь, когда Тибет находится под контролем государства [CHI.GetAdjective], оно требует пересмотреть линию Мак-Магона в свою пользу."
 kmt.13.a:0 "Мы пойдём на компромисс. Пока что"
 kmt.13.b:0 "Мы должны защитить свои интересы!"
 kmt.13.b_tt:0 "§RМожет привести к войне с государством [CHI.GetNameDef]§!"
 kmt.14.t:0 "Пересмотр отклонён"
 kmt.14.d_1:0 "Государство [RAJ.GetNameDefCap] отклонило наше предложение пересмотреть линию Мак-Магона. Оно настаивает, что граница должна остаться неизменной."
 kmt.14.d_2:0 "Государство [ENG.GetNameDefCap] отклонило наше предложение пересмотреть линию Мак-Магона. Оно настаивает, что граница должна остаться неизменной."
 kmt.14.a:0 "Сейчас нам не нужна ещё одна война."
 kmt.14.b:0 "Эти варвары познают нашу ярость! Китай станет ещё больше."
 kmt.15.t:0 "Государство [CHI.GetNameDefCap] требует Тайвань"
 kmt.15.d_2:0 "Когда-то Тайвань был частью Китая, и государство [CHI.GetNameDef] требует «вернуть» остров под своё правление."
 kmt.15.d_1:0 "Хотя мы были одними из первых, кто правил Тайванем, Китай требует отдать остров ему. Как нам поступить?"
 kmt.15.a_1:0 "Мы хотим сохранить мир между нашими странами."
 kmt.15.a_2:0 "Пусть забирают эту влажную дыру, раз так сильно хотят."
 kmt.15.b_1:0 "Как смеют эти варвары предъявлять такие требования? Тайвань принадлежит нам по праву завоевания!"
 kmt.16.t:0 "Тайвань возвращён"
 kmt.16.d:0 "Тайвань возвращён китайскому народу. Наши граждане празднуют его возвращение."
 kmt.16.a:0 "Лучшего исхода мы и желать не могли."
 kmt.17.t:0 "Тайвань остаётся в рабстве"
 kmt.17.d:0 "Они отвергли наше требование вернуть то, что принадлежит нам по праву; их тирания очевидна."
 kmt.17.a:0 "Мы сокрушим их!"
 kmt.21.t:0 "Китай хочет вступить в Союзники"
 kmt.21.d:0 "Демократические силы в государстве [CHI.GetNameDef] пришли к власти. Они хотят вступить в Союзники в знак доверия и дружбы."
 kmt.21.a:0 "Союзник на Востоке — почему бы и нет?"
 kmt.21.b:0 "Сейчас неподходящий момент."
 kmt.22.t:0 "Государство [ENG.GetNameDefCap] согласилось"
 kmt.22.d:0 "Государство [ENG.GetNameDefCap] позволило нам вступить в Союзники. Теперь нас объединяет борьба за свободу."
 kmt.22.a:0 "Демократический мир стал сильнее."
 kmt.23.t:0 "Государство [ENG.GetNameDefCap] отказало"
 kmt.23.d:0 "Причину отказа нам не сообщили, но, похоже, сейчас у них и без того хватает забот."
 kmt.23.a:0 "Надменные глупцы! Возможно, позже они осознают свою ошибку."
 kmt.25.t:0 "Получены секретные документы"
 kmt.25.d:0 "Мы получили секретные документы неизвестного происхождения. Из них следует, что государство [MON.GetNameDef] недовольно нашим руководством альянсом и намерено свергнуть нас!"
 kmt.25.a:0 "Государство [MON.GetNameDefCap] — надёжный союзник. Эти документы наверняка являются жалкой уловкой наших врагов."
 kmt.25.b:0 "Тогда мы исключим их из нашего альянса."
 kmt.25.c:0 "Мы не потерпим этой попытки узурпации."
 kmt.26.t:0 "Лишение членства в альянсе"
 kmt.26.d_1:0 "Бывший лидер нашего альянса решил исключить нас на основании сведений из неких секретных документов. Похоже, нашим врагам удалось изолировать нас."
 kmt.26.d_2:0 "Наш бывший лидер альянса решил исключить нас из него и объявить нам войну, основываясь на сведениях из неких секретных документов. Похоже, нашим врагам удалось изолировать нас."
 kmt.26.a:0 "Теперь мы должны полагаться только на себя."
 kmt.27.t:0 "Нейтральная внешняя политика"
 kmt.27.d:0 "Наши правительственные чиновники выступают за политику нейтралитета. Мы будем держаться в стороне от мелочной паутины мировых союзов. Пусть менее значимые государства убивают друг друга в бессмысленных войнах."
 kmt.27.a:0 "Неопределённый план в неопределённом мире."
 kmt.28.t:0 "Получены секретные документы"
 kmt.28.d:0 "Мы получили секретные документы неизвестного происхождения. Из них следует, что [SIK.GetNameDef] недовольно тем, что мы возглавляем наш альянс. Они хотят свергнуть нас!"
 kmt.28.a:0 "[SIK.GetNameDefCap] — надёжный союзник. Эти документы наверняка являются жалкой уловкой наших врагов."
 kmt.28.b:0 "Тогда мы вычистим их из нашего альянса."
 kmt.28.c:0 "Мы не потерпим этой попытки узурпации."
 kmt.29.t:0 "Лишение членства в альянсе"
 kmt.29.d_1:0 "Наш бывший лидер альянса решил исключить нас из него, основываясь на сведениях из неких секретных документов. Похоже, нашим врагам удалось изолировать нас."
 kmt.29.d_2:0 "Наш бывший лидер альянса решил исключить нас из него и объявить нам войну, основываясь на сведениях из неких секретных документов. Похоже, нашим врагам удалось изолировать нас."
 kmt.29.a:0 "Теперь мы должны полагаться только на себя."
 kmt.30.t:0 "Получены секретные документы"
 kmt.30.d:0 "Мы получили секретные документы неизвестного происхождения. Из них следует, что [TAN.GetNameDef] недовольно тем, что мы возглавляем наш альянс. Они хотят свергнуть нас!"
 kmt.30.a:0 "[TAN.GetNameDefCap] — надёжный союзник. Эти документы наверняка являются жалкой уловкой наших врагов."
 kmt.30.b:0 "Тогда мы вычистим их из нашего альянса."
 kmt.30.c:0 "Мы не потерпим этой попытки узурпации."
 kmt.31.t:0 "Лишение членства в альянсе"
 kmt.31.d_1:0 "Наш бывший лидер альянса решил исключить нас из него, основываясь на сведениях из неких секретных документов. Похоже, нашим врагам удалось изолировать нас."
 kmt.31.d_2:0 "Наш бывший лидер альянса решил исключить нас из него и объявить нам войну, основываясь на сведениях из неких секретных документов. Похоже, нашим врагам удалось изолировать нас."
 kmt.31.a:0 "Теперь мы должны полагаться только на себя."
 kmt.49.t:0 "[FROM.getNameDefCap] Хочет присоединиться к Коминтерну"
 kmt.49.d:0 "Наши товарищи из КПК добились значительного прогресса. Они действительно готовы всерьёз присоединиться к мировой революции."
 kmt.49.a:0 "Желанное пополнение."
 kmt.49.b:0 "Нет! Мао — левый оппортунист!"
 kmt.52.t:0 "[FROM.getNameDefCap] Требуется территория"
 kmt.52.d:0 "Заявив права на эти земли, [FROM.GetNameDef] потребовало безоговорочно передать их ему."
 kmt.52.a:0 "У нас нет шансов против всей их мощи."
 kmt.52.b:0 "скупой [FROM.getAdjective] подонок! У них не будет ни дюйма!"
 kmt.53.t:0 "Национальные территории возвращены"
 kmt.53.d:0 "Наши законные территории вновь принадлежат нам!"
 kmt.53.a:0 "Теперь нам следует задуматься о дальнейшем расширении."
 kmt.54.t:0 "Требование отклонено"
 kmt.54.d:0 "Эти варвары отвергли наши мирные требования и вынудили нас прибегнуть к насилию для разрешения ситуации."
 kmt.54.a:0 "Варвары должны быть уничтожены!"
 kmt.56.t:0 "[FROM.getNameDefCap] Требуется территория"
 kmt.56.d:0 "Заявив права на эти земли, [FROM.GetNameDef] потребовало безоговорочно передать их ему."
 kmt.56.a:0 "У нас нет шансов против всей их мощи."
 kmt.56.b:0 "скупой [FROM.getAdjective] подонок! У них не будет ни дюйма!"
 kmt.57.t:0 "Национальные территории возвращены"
 kmt.57.d:0 "Наши законные территории вновь принадлежат нам!"
 kmt.57.a:0 "Теперь нам следует задуматься о дальнейшем расширении."
 kmt.58.t:0 "Требование отклонено"
 kmt.58.d:0 "Эти варвары отвергли наши мирные требования и вынудили нас прибегнуть к насилию для разрешения ситуации."
 kmt.58.a:0 "Варвары должны быть уничтожены!"
 kmt.62.t:0 "Франко-китайское соглашение"
 kmt.62.d:0 "После войны китайские чиновники связались с нами, чтобы обсудить вопрос управления Гуанчжоуванем."
 kmt.62.a:0 "Они столь многим пожертвовали на войне; будем считать это компенсацией."
 kmt.62.b:0 "Франция — законный владелец!"
 kmt.63.t:0 "Франция отказалась вернуть Гуанчжоувань"
 kmt.63.d:0 "Французы настояли на том, что Гуанчжоувань останется французской концессией."
 kmt.63.a:0 "Проклятые свиньи!"
 kmt.64.t:0 "Неудержимая китайская армия"
 kmt.64.d:0 "В ходе нынешней войны все наши азиатские владения оказались в руках Китая. Нам стоит подумать о передаче ему всех наших земель в Азии в обмен на мир, пока китайцы не высадились на нашей родной земле!"
 kmt.64.a:0 "Поднять белый флаг..."
 kmt.64.b:0 "Франция будет сражаться до последнего!"
 kmt.65.t:0 "Франция предлагает мир"
 kmt.65.d:0 "Опасаясь, что мы ступим на их родную землю, французские чиновники предложили заключить мир и уступить нам все свои владения в Азии."
 kmt.65.a:0 "Мы не должны проявлять жадность; примем предложение."
 kmt.65.b:0 "Их государство должно быть сокрушено!"
 kmt.66.t:0 "Предложение отклонено"
 kmt.66.d:0 "Китайцы отвергли наше мирное предложение; теперь нам придётся сражаться до конца."
 kmt.66.a:0 "Дерьмо."
 kmt.67.t:0 "Совместная китайско-британская декларация"
 kmt.67.d:0 "Наше правление в Гонконге подошло к концу; теперь мы должны вернуть его китайцам."
 kmt.67.a:0 "Договор есть договор."
 kmt.67.b:0 "Гонконг останется частью Империи!"
 kmt.68.t:0 "Британцы нарушают обещание"
 kmt.68.d:0 "Британцы отказались вернуть Гонконг после 99 лет своего правления, предусмотренных Нанкинским договором. Это унижение не останется без ответа!"
 kmt.68.a:0 "Проклятые свиньи!"
 kmt.69.t:0 "Возвращение Макао?"
 kmt.69.d:0 "Хотя в 1974 году мы признали Макао «китайской территорией под (временным) управлением Португалии», вскоре китайцы возьмут его под свой контроль. Некоторые наши чиновники утверждают, что Макао должен оставаться португальской территорией несмотря ни на что."
 kmt.69.a:0 "Эти чиновники сошли с ума."
 kmt.69.b:0 "Португалия сильна! Макао станет законной португальской землёй!"
 kmt.70.t:0 "Португалия отказалась вернуть Макао"
 kmt.70.d:0 "Португальское правительство отказалось вернуть Макао!"
 kmt.70.a:0 "Мы покажем им последствия этого решения."
 kmt.71.t:0 "Гуанчжоувань возвращён"
 kmt.71.d:0 "Гуанчжоувань вернулся к своему законному владельцу!"
 kmt.71.a:0 "Ура!"
 kmt.72.t:0 "Гонконг возвращён"
 kmt.72.d:0 "Гонконг вернулся к своему законному владельцу!"
 kmt.72.a:0 "Ура!"
 kmt.73.t:0 "Макао возвращён"
 kmt.73.d:0 "Макао вернулся к своему законному владельцу!"
 kmt.73.a:0 "Ура!"
 kmt.74.t:0 "[FROM.GetNameDefCap] требует подчинения"
 kmt.74.d:0 "[FROM.GetNameDefCap] направило всем военным правителям ультиматум с требованием немедленно подчиниться. Получив это предписание, [Root.GetLeader] уже несколько часов проводит закрытое совещание со всеми доверенными офицерами.\n\nК какому решению они придут?"
 kmt.74.a:0 "Чтобы избежать кровопролития, мы примем их требование. Мы сдаёмся."
 kmt.74.b:0 "Тираны не восторжествуют!"
 kmt.75.t:0 "Ультиматум — военный правитель уступает"
 kmt.75.d:0 "[From.GetLeader] осознал, что сопротивление нам не приведёт ни к чему хорошему, и мирно подчинился."
 kmt.75.a:0 "Ещё один шаг к объединению!"
 kmt.752.t:0 "Ультиматум — военный правитель отказался"
 kmt.752.d:0 "[From.GetLeader] отказался подчиниться. Более того, он даже заявил, что настоящие «тираны» — это мы!"
 kmt.752.a:0 "Как они смеют!"
 kmt_lzr_join:0 "Ли Цзунжэнь присоединится к нашей армии"
 kmt_yxs_join:0 "Янь Сишань присоединится к нашей армии"
 kmt_ly_join:0 "Лун Юнь присоединится к нашей армии"
 kmt.93.t:0 "Давление Китая"
 kmt.93.d:0 "В последнее время Китай оказывает на нас сильное давление. Мы должны выбрать между переходом к демократии и уничтожением нашей страны!"
 kmt.93.a:0 "Мы должны сохранить существование нашей страны!"
 kmt.93.b:0 "Демократия — лишь ещё одна форма тирании!"
 kmt.94.t:0 "Синьцзян перешёл к демократии"
 kmt.94.d:0 "Под нашим недавним давлением Синьцзян наконец осознал, какое светлое будущее ждёт его при демократии. И именно мы поведём его за руку."
 kmt.94.a:0 "Сила демократии!"
 kmt.94.b:0 "Так и должно быть."
 kmt.95.t:0 "Синьцзян отказался переходить к демократии"
 kmt.95.d:0 "Несмотря на наше сильное давление, правительство Синьцзяна по-прежнему не осознаёт преимуществ демократии и отвергает наше щедрое предложение."
 kmt.95.a:0 "Пора действовать жёстко."
 kmt.96.t:0 "Ультиматум от [CHI.GetLeader]"
 kmt.96.d:0 "[CHI.GetLeader] потребовал нашего немедленного подчинения. Он утверждает, что сопротивление приведёт к кровопролитию. После многочасовых закрытых совещаний с высокопоставленными чиновниками [SIK.GetLeader] объявляет, что народ Синьцзяна будет защищён от..."
 kmt.96.a:0 "Войны"
 kmt.96.b:0 "Тирании"
 kmt.97.t:0 "Синьцзян подчиняется"
 kmt.97.d:0 "Спустя десятилетия [ROOT.GetNameDef] наконец вновь обрело контроль над Синьцзяном!"
 kmt.97.a:0 "Китай становится больше!"
 kmt.98.t:0 "Ультиматум отклонён"
 kmt.98.d:0 "Синьцзян отказался подчиниться; теперь мы силой заберём то, что принадлежит нам по праву!"
 kmt.98.a:0 "Мы уничтожим этих мятежников!"
 kmt.100.t:0 "Ультиматум [CHI.GetLeader]"
 kmt.100.t_2:0 "Требование Китая"
 kmt.100.d:0 "Китайское правительство направило нам ультиматум с требованием вернуть Гуанчжоувань. В случае отказа ожидаются военные действия."
 kmt.100.a:0 "Мир всегда предпочтительнее."
 kmt.100.b:0 "Им с нами не сравниться!"
 kmt.101.t:0 "Гуанчжоувань возвращён"
 kmt.101.d:0 "Гуанчжоувань возвращён; западные державы не зря боятся нашей мощи!"
 kmt.101.a:0 "Мудрое решение."
 kmt.102.t:0 "Ультиматум отклонён"
 kmt.102.d:0 "Эти мерзкие западные варвары отказались сотрудничать мирным путём! Народу Гуанчжоуваня придётся подождать ещё немного."
 kmt.102.a:0 "Их высокомерие станет причиной их гибели!"
 kmt.103.d:0 "Китайское правительство направило нам ультиматум с требованием вернуть Макао. В случае отказа ожидаются военные действия."
 kmt.104.t:0 "Макао возвращён"
 kmt.104.d:0 "Макао возвращён; западные державы не зря боятся нашей мощи!"
 kmt.105.d:0 "Эти мерзкие западные варвары отказались сотрудничать мирным путём! Народу Макао придётся подождать ещё немного."
 kmt.106.d:0 "Китайское правительство направило нам ультиматум с требованием вернуть Гонконг. В случае отказа ожидаются военные действия."
 kmt.107.t:0 "Гонконг возвращён"
 kmt.107.d:0 "Гонконг возвращён; западные державы не зря боятся нашей мощи!"
 kmt.108.d:0 "Эти мерзкие западные варвары отказались сотрудничать мирным путём! Народу Гонконга придётся подождать ещё немного."
 kmt.109.t:0 "Предложение Китая"
 kmt.109.d:0 "Китай предложил оказать нам помощь в обмен на возвращение торгового порта в Гуанчжоуване, который находится под нашим контролем."
 kmt.109.a:0 "Помощи много не бывает."
 kmt.109.b:0 "Оно того не стоит."
 kmt.110.t:0 "Гуанчжоувань возвращён"
 kmt.110.d:0 "[From.GetNameDefCap] согласилось на предложение, и мы заключили сделку: Гуанчжоувань теперь официально является китайской территорией, а они получают обещанную нами помощь."
 kmt.110.a:0 "Демократический мир должен держаться вместе!"
 kmt.111.t:0 "[From.GetNameDefCap] отказалось"
 kmt.111.d:0 "Несмотря на нашу щедрость, [From.GetAdjective] правительство отвергло предложение и решило обойтись без нашей помощи."
 kmt.111.a:0 "Большое разочарование."
 kmt.112.d:0 "Китай предложил оказать нам помощь в обмен на возвращение торгового порта в Макао, который находится под нашим контролем."
 kmt.113.t:0 "Макао возвращён"
 kmt.113.d:0 "[From.GetNameDefCap] согласилось на предложение, и мы заключили сделку: Макао теперь официально является китайской территорией, а они получают обещанную нами помощь."
 kmt.115.d:0 "Китай предложил оказать нам помощь в обмен на возвращение торгового порта в Гонконге, который находится под нашим контролем."
 kmt.116.t:0 "Гонконг возвращён"
 kmt.116.d:0 "[From.GetNameDefCap] согласилось на предложение, и мы заключили сделку: Гонконг теперь официально является китайской территорией, а они получают обещанную нами помощь."
 kmt.122.t:0 "Китай стремится укрепить связи с нами"
 kmt.122.d:0 "Поскольку Гуанчжоувань теперь находится под нашим контролем, Китай хочет использовать его как символ дружбы и просит вернуть территорию ради укрепления отношений между нашими странами."
 kmt.122.a:0 "Сильный союзник будет весьма кстати."
 kmt.122.b:0 "Они нам не нужны! Мы прекрасно справимся сами."
 kmt.123.t:0 "Китай требует Гуанчжоувань"
 kmt.123.d:0 "Китай заявляет, что Гуанчжоувань является необходимым жизненным пространством для китайского народа, а потому мы обязаны его вернуть."
 kmt.123.a:0 "Мы не можем позволить себе войну с ними."
 kmt.123.b:0 "Какая чушь."
 kmt.124.t:0 "Китай оккупирует Гуанчжоувань"
 kmt.124.d:0 "Китай направил войска в Гуанчжоувань и вскоре оккупировал его, а затем объявил, что территория официально вернулась под китайское управление. Этот акт агрессии вызвал в стране ожесточённые споры."
 kmt.124.a:0 "Несмотря на унижение, мы должны отступить."
 kmt.124.b:0 "Это очевидное вторжение! Мы должны готовить людей к войне!"
 kmt.125.t:0 "Укрепление отношений с государством [From.GetNameDef]"
 kmt.125.d:0 "Теперь, когда [From.GetAdjective] правительство решило вернуть нам Гуанчжоувань, мы можем приступить к улучшению наших отношений."
 kmt.125.a:0 "Всё во славу Родины!"
 kmt.126.t:0 "[From.GetNameDefCap] отказалось"
 kmt.126.d:0 "Несмотря на наше щедрое предложение, [From.GetAdjective] правительство отказалось вернуть Гуанчжоувань. Теперь им придётся испить «штрафную чашу»..."
 kmt.126.a:0 "Никто не устоит перед Родиной!"
 kmt.127.t:0 "[From.GetNameDefCap] согласилось"
 kmt.127.d:0 "[From.GetNameDefCap] согласилось с нашим требованием вернуть Гуанчжоувань!"
 kmt.127.a:0 "Родина приветствует своих детей!"
 kmt.128.t:0 "[From.GetNameDefCap] отказалось"
 kmt.128.d:0 "[From.GetNameDefCap] отвергло наше требование вернуть Гуанчжоувань!"
 kmt.128.a:0 "Родина вернёт его так или иначе!"
 kmt.130.t:0 "[From.GetNameDefCap]Обличение"
 kmt.130.d:0 "[From.GetNameDefCap] каким-то образом обнаружило доказательства нашей причастности к недавней неудавшейся попытке переворота в Гуанчжоуване и публично осудило нас!"
 kmt.130.a:0 "Мы отплатим им тем же и прекратим торговлю!"
 kmt.130.b:0 "Новая возможность захватить Гуанчжоувань!"
 kmt.130.c:0 "Просто проигнорируем это."
 kmt.135.t:0 "Китай стремится укрепить связи с нами"
 kmt.135.d:0 "Поскольку Макао теперь находится под нашим контролем, Китай хочет использовать его как символ дружбы и просит вернуть территорию ради укрепления отношений между нашими странами."
 kmt.135.a:0 "Сильный союзник будет весьма кстати"
 kmt.135.b:0 "Они нам не нужны! Мы прекрасно справимся сами."
 kmt.136.t:0 "Китай требует Макао"
 kmt.136.d:0 "Китай заявляет, что Макао является необходимым жизненным пространством для китайского народа, а потому его необходимо вернуть."
 kmt.136.a:0 "Мы не можем позволить себе войну с ними"
 kmt.136.b:0 "Какая чушь."
 kmt.137.t:0 "Китай оккупирует Макао"
 kmt.137.d:0 "Китай направил войска в Макао и вскоре оккупировал его, а затем объявил, что территория официально вернулась под китайское управление. Этот акт агрессии вызвал в стране ожесточённые споры."
 kmt.137.a:0 "Несмотря на унижение, в этот раз мы должны отступить"
 kmt.137.b:0 "Это очевидное вторжение! Мы должны готовить людей к войне!"
 kmt.138.t:0 "Укрепление отношений с государством [From.GetName]"
 kmt.138.d:0 "Теперь, когда [From.GetAdjective] правительство решило вернуть нам Макао, мы можем приступить к улучшению наших отношений."
 kmt.138.a:0 "Всё во славу Родины!"
 kmt.139.t:0 "[From.GetName] отказалось"
 kmt.139.d:0 "Несмотря на наше щедрое предложение, [From.GetAdjective] правительство отказалось вернуть Макао. Теперь им придётся испить «штрафную чашу»..."
 kmt.139.a:0 "Никто не устоит перед Родиной!"
 kmt.140.t:0 "[From.GetName] согласилось"
 kmt.140.d:0 "[From.GetName] согласилось с нашим требованием вернуть Макао!"
 kmt.140.a:0 "Родина приветствует своих детей!"
 kmt.141.t:0 "[From.GetName] отказалось"
 kmt.141.d:0 "[From.GetName] отвергло наше требование вернуть Макао!"
 kmt.141.a:0 "Родина вернёт это тем или иным способом!"
 kmt.143.t:0 "Осуждение со стороны государства [From.GetName]"
 kmt.143.d:0 "Государству [From.GetName] каким-то образом удалось найти доказательства нашей причастности к недавнему неудавшемуся перевороту в Макао, и теперь оно публично осудило нас!"
 kmt.143.a:0 "Мы отплатим им тем же и прекратим торговлю!"
 kmt.143.b:0 "Новая возможность захватить Макао!"
 kmt.143.c:0 "Просто проигнорируем это..."
 kmt.146.t:0 "Успешный переворот в государстве [FROM.getName]"
 kmt.146.d_1:0 "Недавний переворот сверг нашу местную администрацию в государстве [FROM.getName]. Новые власти также провели референдум о возвращении под власть Китая. Однако наша разведка сообщает, что этот переворот был организован китайским правительством.\n\nКак нам ответить?"
 kmt.146.d_2:0 "Наш переворот в государстве [FROM.getName] увенчался успехом. После установления прокитайской местной администрации состоялся референдум, по итогам которого Гуанчжоувань вернулся под нашу власть. Однако праздновать некогда: варвары наверняка уже готовят ответные меры."
 kmt.146.a:0 "Мы немедленно уничтожим эту назойливую страну!"
 kmt.146.b:0 "Умиротворение принесёт мир нам обоим..."
 kmt.146.c:0 "Мы должны сохранять бдительность."
 kmt.147.t:0 "Переворот подавлен"
 kmt.147.d_1:0 "Недавно в одном из наших договорных портов и прилегающих районах был подавлен переворот. Хотя серьёзного ущерба он не нанёс, некоторые считают, что его организовало правительство государства [FROM.getAdjective], стремясь вернуть эту территорию."
 kmt.147.d_2:0 "Наш переворот потерпел сокрушительный провал. Мы должны уничтожить любые доказательства, способные связать нас с ним, и сохранить произошедшее в тайне от общественности."
 kmt.147.a:0 "Мы должны осудить государство [FROM.getAdjective] за столь мерзкий поступок!"
 kmt.147.b:0 "Есть дела поважнее, требующие нашего внимания."
 kmt.147.c:0 "Ну почему..."
 kmt.148.t:0 "Государство [FROM.getNameDefCap] стремится к сближению с нами"
 kmt.148.d:0 "Поскольку мы контролируем важный договорной порт, государство [FROM.getNameDefCap] предлагает использовать его как символ дружбы и просит вернуть территорию ради укрепления отношений между нашими странами."
 kmt.148.a:0 "Сильный союзник нам пригодится"
 kmt.148.b:0 "Они нам не нужны! Мы справимся сами."
 kmt.149.t:0 "Китай требует Гонконг"
 kmt.149.d:0 "Китай заявляет, что Гонконг является необходимым жизненным пространством для китайского народа, а потому должен быть возвращён."
 kmt.149.a:0 "Мы не можем позволить себе войну с ними"
 kmt.149.b:0 "Что за чушь."
 kmt.150.t:0 "Китай оккупирует Гонконг"
 kmt.150.d:0 "Китай ввёл войска в Гонконг и вскоре оккупировал его, после чего официально объявил о возвращении территории под китайскую власть. Этот акт агрессии вызвал в нашей стране бурные споры."
 kmt.150.a:0 "Несмотря на унижение, в этот раз мы должны отступить"
 kmt.150.b:0 "Это явное вторжение! Мы должны готовить людей к войне!"
 kmt.151.t:0 "Сближение с государством [From.GetName]"
 kmt.151.d:0 "Теперь, когда правительство государства [From.GetAdjective] решило вернуть нам Гонконг, мы можем приступить к улучшению отношений."
 kmt.151.a:0 "Всё во славу Родины!"
 kmt.152.t:0 "Государство [From.GetName] отказалось"
 kmt.152.d:0 "Правительство государства [From.GetAdjective] отказалось вернуть Гонконг, несмотря на наше щедрое предложение. Теперь ему придётся испить «штрафную чарку»..."
 kmt.152.a:0 "Никто не устоит перед Родиной!"
 kmt.153.t:0 "Государство [From.GetName] согласилось"
 kmt.153.d:0 "Государство [From.GetName] приняло наше требование о возвращении Гонконга!"
 kmt.153.a:0 "Родина приветствует своих детей!"
 kmt.154.t:0 "Государство [From.GetName] отказалось"
 kmt.154.d:0 "Государство [From.GetName] отклонило наше требование о возвращении Гонконга!"
 kmt.154.a:0 "Родина вернёт его тем или иным способом!"
 kmt.156.t:0 "Осуждение со стороны государства [From.GetName]"
 kmt.156.d:0 "Государству [From.GetName] каким-то образом удалось найти доказательства нашей причастности к недавнему неудавшемуся перевороту в Гонконге, и теперь оно публично осудило нас!"
 kmt.156.a:0 "Мы отплатим им тем же и прекратим торговлю!"
 kmt.156.b:0 "Новая возможность захватить Гонконг!"
 kmt.156.c:0 "Просто проигнорируем это..."
 kmt.179.t:0 "Промышленность улучшена"
 kmt.179.d:0 "С ростом числа фабрик повысилось и качество продукции."
 kmt_incompetent_indus_tt:0 "Снизит штраф от национального духа §Y«Некомпетентная промышленность»§!\nДобавит свободные ячейки для строительства в каждом принадлежащем нам регионе."
 kmt.179.a:0 "Скоро наша промышленная мощь станет одной из величайших!"
 kmt_incompetent_indus_remove_tt:0 "Удалит национальный дух §Y«Некомпетентная промышленность»§!\nДобавит 1 свободную ячейку для строительства в каждом принадлежащем нам регионе."
 kmt.186.t:0 "Гоминьдан ищет мира"
 kmt.186.d:0 "Ввиду японского вторжения [From.GetLeader] решил пригласить лидера [Root.GetLeader] на мирные переговоры, чтобы сосредоточиться на борьбе с японскими захватчиками."
 kmt.186.a:0 "Между нами будет мир, но в их войну мы не вступим."
 kmt.186.b:0 "В конце концов, все мы китайцы..."
 kmt.186.c:0 "Между нами не будет мира!"
 kmt.186.e:0 "Мы можем заключить союз с японцами!"
 kmt.187.t:0 "Мир!"
 kmt.187.d_1:0 "[From.GetLeader] согласился на белый мир. Теперь мы сможем уделить больше внимания японским захватчикам."
 kmt.187.d_2:0 "[From.GetLeader] согласился на белый мир и присоединился к нам в борьбе против японских захватчиков!"
 kmt.187.a:0 "С ними всегда можно разобраться позже."
 kmt.188.t:0 "Государство [From.GetName] отказывается от мира"
 kmt.188.d:0 "[From.GetLeader] отказался заключать с нами мир, чем привёл лидера [Root.GetLeader] в ярость."
 kmt.188.a:0 "Мы сотрём их с лица земли!"
 kmt.189.t:0 "Государство [From.GetName] хочет сражаться вместе с нами"
 kmt.189.d:0 "Действия лидера [CHI.GetLeader] возмутили лидера [From.GetLeader], и теперь он хочет вместе с нами преподать ему урок."
 kmt.189.a:0 "Великая восточноазиатская сфера сопроцветания расширяется!"
 kmt.189.b:0 "Люди, которые предают свой народ, не имеют чести!"
 kmt.190.t:0 "Государство [JAP.GetName] согласилось"
 kmt.190.d:0 "Государство [JAP.GetName] приняло наше предложение. Теперь мы свергнем лидера [CHI.GetName]!"
 kmt.190.a:0 "Смерть лидеру [CHI.GetLeader]!"
 kmt.191.t:0 "Государство [JAP.GetName] отказалось"
 kmt.191.d:0 "[JAP.GetName] Мы отвергли наше предложение и осудили наш поступок, заявив, что [Root.GetLeader] У меня нет чести."
 kmt.191.a:0 "Похоже, мы разгневали сразу двух гигантов..."
 kmt.192.t:0 "Государство [From.GetName] присоединяется к японской агрессии"
 kmt.192.d:0 "[From.GetLeader] присоединился к японскому вторжению на китайскую территорию!"
 kmt.192.a:0 "Ханьцзянь! Цзоугоу!"
 kmt.193.t:0 "Попытка государства [From.GetName] присоединиться к Японии провалилась"
 kmt.193.d:0 "разведданные утверждает, что [From.GetLeader] Японцы попытались связаться с японцами для объединения сил против нас, но им было отказано, и они были осуждены японцами как безчестные."
 kmt.193.a:0 "Предателей родины не ждёт ничего хорошего."
 kmt_fascism_tp_728_coup_tt:0 "Будет организован переворот. Чем выше национальное единство, тем больше вероятность его успеха."
 kmt_manpower_transfer_tt:0 "Передаст 20 000 людских ресурсов"
 kmt_fascism_tp_728_inc_tt:0 "Гуанчжоувань будет занят нашими войсками. Это может привести к войне."
 kmt_fascism_tp_729_inc_tt:0 "Макао будет занят нашими войсками. Это может привести к войне."
 kmt_fascism_tp_326_inc_tt:0 "Гонконг будет занят нашими войсками. Это может привести к войне."
 kmt.197.t:0 "Государство [FROM.GetName] улучшает отношения с нами"
 kmt.197.d:0 "[FROM.GetLeader] пытается улучшить наши отношения, отказавшись от претензий на Тибет. Наши чиновники предупреждают о возможном обмане и уловках, однако окончательное решение должен принять сам лидер [TIB.GetLeader]."
 kmt.197.a:0 "Относись к другим хорошо — и они ответят тем же."
 kmt.197.b:0 "Партия [FROM.GetRulingParty] приведёт нас к величию!"
 kmt.197.c:0 "Мы не попадёмся на столь наивную уловку!"
 kmt.198.t:0 "Государство [TIB.GetName] вступает в наш альянс"
 kmt.198.d:0 "[TIB.GetLeader] решил, что ради светлого будущего мы должны действовать сообща."
 kmt.198.a:0 "Никто не хочет кровопролития"
 kmt.199.t:0 "Государство [TIB.GetName] становится нашей марионеткой"
 kmt.199.d:0 "[TIB.GetLeader] решил, что партия [Root.GetRulingParty] приведёт их к величию, и потому передал нам управление их политическими делами."
 kmt.199.a:0 "Мы их не разочаруем"
 kmt.201.t:0 "Государство [TIB.GetName] отвергло нашу доброту"
 kmt.201.d:0 "[TIB.GetLeader] считает наш жест дружбы жалкой уловкой и отказался продолжать обсуждение этого вопроса. "
 kmt.201.a:0 "Почему они не желают слушать доводы разума!"
 kmt.203.t:0 "Враг приближается к региону [KMT_treasure_state.GetName]"
 kmt.203.d:0 "Враг всё ближе подбирается к региону [KMT_treasure_state.GetName], где хранятся наши национальные сокровища. Если противник обнаружит их, он наверняка нанесёт им непоправимый ущерб. Мы должны сохранить реликвии и перевезти их в безопасное место!"
 kmt.203.a:0 "Это можно использовать для укрепления боевого духа солдат."
 kmt.203.b:0 "Мы должны сохранить эти артефакты!"
 kmt.204.t:0 "Артефакты разграблены"
 kmt.204.d:0 "Из-за того, что мы не успели вовремя вывезти артефакты, враг разграбил их. Говорят, некоторые реликвии даже разбили на части, чтобы облегчить перевозку. Эти новости нанесли тяжёлый удар по нашей стране и духу народа."
 kmt.204.a:0 "Как они могли!"
 KMT_will_be_destination_tt:0 "Станет новым местом хранения артефактов\n"
 kmt.208.t:0 "Жалование коммунистической армии"
 kmt.208.d:0 "Восьмая маршрутная армия и Новая четвёртая армия внесли огромный вклад в нашу войну против Японии. Однако сейчас у нас недостаточно средств, чтобы выплатить всем бойцам заслуженное жалование."
 kmt.208.a:0 "Напечатаем больше золотых юаней, чтобы облегчить положение."
 kmt.208.b:0 "Всю работу выполнила НАША армия — коммунисты не заслуживают оплаты!"
 kmt_probable_inflation:0 "§RЭто приведёт к тяжёлой инфляции, поскольку у нас нет дополнительного золотого обеспечения!§!"
 kmt.209.t:0 "Начинается инфляция"
 kmt.209.d:0 "Наша политика количественного смягчения вызвала тяжёлую инфляцию. Мы теряем поддержку граждан, особенно среднего класса, а некоторые солдаты дезертируют к коммунистам!"
 kmt.209.a:0 "Надо было думать раньше..."
 kmt.210.t:0 "Партия [CHI.GetRulingParty] отказывается выплачивать жалование"
 kmt.210.d:0 "Партия [CHI.GetRulingParty] заявила, что наши солдаты ничего не сделали во время войны и потому не заслуживают жалования."
 kmt.210.a:0 "Это возмутительно!"
 kmt.212.t:0 "Раздел по Янцзы"
 kmt.212.d:0 "Армия партии [CHI.GetRulingParty] находится на грани поражения, однако нам трудно переправиться через Янцзы. Партия [CHI.GetRulingParty] использует это в своих интересах и предлагает разделить Китай, проведя границу по реке."
 kmt.212.a:0 "Их поражение — лишь вопрос времени. Мы можем подождать."
 kmt.212.b:0 "Они на последнем издыхании — нельзя давать им время на восстановление!"
 kmt.213.t:0 "Государство [PRC.GetName] соглашается на раздел"
 kmt.213.d:0 "Государство [PRC.GetName] приняло наше предложение разделить Китай по реке Янцзы."
 kmt.213.a:0 "Ложный мир..."
 kmt_yangtze_partition_tt_prc:0 "Мы получим китайские регионы к северу от Янцзы, а они — регионы к югу от неё."
 kmt.214.t:0 "Государство [PRC.GetName] отвергает раздел"
 kmt.214.d:0 "Государство [PRC.GetName] отклонило наше предложение разделить Китай по реке Янцзы."
 kmt.214.a:0 "Мы должны найти другой способ сохранить своё существование!"
 kmt.217.t:0 "Статус-кво"
 kmt.217.d:0 "Сложившийся на фронте статус-кво создал между нами и коммунистами подобие перемирия."
 kmt.217.a:0 "Нельзя терять бдительность!"
 kmt.218.t:0 "Разногласия по поводу линии укреплений"
 kmt.218.d:0 "Некоторые наши генералы и фон Фалькенхаузен расходятся во мнениях о том, где следует сосредоточить основные усилия по строительству укреплений. Все согласны, что Шанхай должен стать главным приоритетом, но вопрос о японском вторжении с севера вызывает споры. Часть генералов предлагает защищать Пекин до последнего человека. Однако фон Фалькенхаузен считает, что равнины Северного Китая дадут механизированным японским войскам огромное преимущество, и потому предлагает укрепиться вдоль Хуанхэ.\n\nЧьего мнения нам следует придерживаться?"
 kmt.218.a:0 "Пекин не падёт!"
 kmt.218.b:0 "В словах Александра есть смысл: Хуанхэ может стать естественной преградой."
 KMT_fortify_land_hn_tt:0 "Добавит §Y9 наземных укреплений§! вдоль реки Хуанхэ в регионе §YХэнань§!\n"
 KMT_fortify_land_sd_tt:0 "Добавит §Y9 наземных укреплений§! вдоль реки Хуанхэ в регионе §YШаньдун§!\n"
 kmt.220.t:0 "Рост прояпонской фракции в государстве [CHI.GetName]"
 kmt.220.d:0 "В последнее время прояпонские чиновники усилили свои позиции в правительстве партии [CHI.GetRulingParty] в государстве [CHI.GetName]. Если мы поддержим их, то сможем превратить Китай в союзника, не начиная войны, и получим доступ к его ресурсам."
 kmt.220.a:0 "Это сбережёт пули и жизни."
 kmt.220.b:0 "Они лишь косвенно пытаются сохранить свою жалкую страну."
 kmt.221.t:0 "Дипломат из государства [CHI.GetName]"
 kmt.221.d_1:0 "К нашему двору прибыл дипломат из государства [CHI.GetName] и подробно изложил идеологию паназиатизма. После его выступления остатки Кодоха вновь заручились поддержкой общественности, поставив Тосэйха в трудное положение."
 kmt.221.d_2:0 "К нашему двору прибыл дипломат из государства [CHI.GetName] и подробно изложил идеологию паназиатизма. После его выступления члены Кодоха подготовили предложение о китайско-японском союзе."
 kmt.221.a:0 "Примем новую идею и последуем за нашими китайскими товарищами."
 kmt.221.b:0 "Мы поведём Азию к славе."
 kmt.221.c:0 "Новую идею необходимо остановить!"
 kmt.222.t:0 "Государство [JAP.GetName] отвергает новую идею"
 kmt.222.d:0 "[JAP.GetLeader] отверг новую идею паназиатизма и уничтожил поддерживавшую её Кодоха. Наши попытки создать китайско-японский союз провалились."
 kmt.222.a:0 "Жаль, что я не живу в более просвещённые времена..."
 kmt.224.t:0 "Государство [From.GetName] просит помощи в развитии военно-морской промышленности"
 kmt.224.d:0 "Наши китайские товарищи просят поделиться с ними некоторыми технологиями кораблестроения, чтобы они могли создать более совершенный флот."
 kmt.224.a:0 "Азиаты должны помогать друг другу"
 kmt.224.b:0 "Технологии государства [Root.GetAdjective] принадлежат нам, а не им!"
 kmt.225.t:0 "Государство [From.GetName] предоставляет помощь"
 kmt.225.d:0 "Государство [From.GetName] согласилось помочь нашей военно-морской промышленности."
 kmt.225.a:0 "Будем строить корабли!"
 kmt.226.t:0 "Государство [From.GetName] отказывает в помощи"
 kmt.226.d:0 "Государство [From.GetName] отказалось помогать нашей военно-морской промышленности."
 kmt.226.a:0 "Будь они прокляты!"
 kmt.233.t:0 "Государство [CHI.GetName] просит нашего вмешательства"
 kmt.233.d:0 "Учитывая наши хорошие отношения с государством [CHI.GetName] и нахождение государства [JAP.GetName] в нашем альянсе, лидер [CHI.GetLeader] попросил нас вмешаться в их конфликт и обуздать агрессию государства [JAP.GetName]."
 kmt.233.a:0 "Этого требует китайско-германская дружба."
 kmt.233.b:0 "Сейчас мы слишком заняты. Китайцам придётся справляться самим."
 kmt.234.t:0 "Вмешательство государства [GER.GetAdjective]"
 kmt.234.d:0 "[GER.GetLeader] направил лидеру [Root.GetLeader] официальное письмо с требованием немедленно прекратить агрессию против государства [CHI.GetName]."
 kmt.234.a:0 "Если подумать, вторжение в Китай может оказаться не столь выгодным, как утверждала пропаганда."
 kmt.234.b:0 "К чёрту этих немцев."
 kmt.235.t:0 "Государство [GER.GetName] отказалось вмешиваться"
 kmt.235.d:0 "Будучи занятым множеством других проблем, лидер [Ger.GetLeader] отказался вмешиваться в наш конфликт с японцами."
 kmt.235.a:0 "Жаль."
 kmt.236.t:0 "Мир с государством [JAP.GetName]"
 kmt.236.d:0 "После вмешательства Германии японские войска покидают оккупированные территории. Однако Маньчжурию они по-прежнему отказываются возвращать."
 kmt.236.a:0 "Они ещё увидят."
 kmt.236.b:0 "Вот какие мы миротворцы!"
 kmt.237.t:0 "Мир между государствами [CHI.GetName] и [JAP.GetName]"
 kmt.237.d:0 "После вмешательства Германии японские войска покидают оккупированные территории. Однако Маньчжурию они по-прежнему отказываются возвращать."
 kmt.237.d_2:0 "После нашего вмешательства японские войска покидают оккупированные территории."
 kmt.237.a:0 "Они ещё увидят."
 kmt.237.b:0 "Мудрое решение."
 kmt.238.t:0 "Государство [JAP.GetName] отказывается успокоиться"
 kmt.238.d:0 "Несмотря на вмешательство, японское правительство по-прежнему отказывается сложить оружие."
 kmt.238.a:0 "Это их выбор."
 kmt.238.b:0 "Мы не потерпим такого унижения."
 kmt.240.t:0 "Государство [CHI.GetName] вновь просит нашего вмешательства"
 kmt.240.d:0 "После нашего последнего вмешательства между японцами и китайцами всё ещё сохраняются серьёзные трения, особенно по вопросам Маньчжурии и Тайваня. Поэтому лидер [CHI.GetLeader] вновь направил лидеру [GER.GetLeader] официальное письмо с просьбой о новом вмешательстве."
 kmt.240.a:0 "Будем надеяться, что это случилось в последний раз."
 kmt.241.t:0 "[GER.GetName] снова вмешивается"
 kmt.241.d:0 "[GER.GetLeader] вновь направил официальное письмо [Root.GetLeader], заявив, что мы должны вернуть Тайвань и Маньчжурию государству [CHI.GetName]."
 kmt.241.a:0 "Ради прочного мира в Азии."
 kmt.243.t:0 "[JAP.GetName] идёт на уступки"
 kmt.243.d:0 "После долгих раздумий [JAP.GetLeader] решил вернуть Маньчжурию и Тайвань государству [CHI.GetName], а также распустить созданные в этих регионах марионеточные правительства."
 kmt.245.t:0 "[JAP.GetName] отказывается возвращать территории"
 kmt.245.d:0 "Несмотря на вмешательство, японское правительство по-прежнему отказывается возвращать оккупированные территории."
 kmt.247.t:0 "Китай хочет вступить в наш альянс"
 kmt.247.d:0 "Сильные лидеры RNGROC добились значительных успехов и предлагают присоединиться к нашему делу. Китай готов сражаться за Рейх."
 kmt.247.a:0 "Союзник с Востока"
 kmt.247.b:0 "Нет!"
 kmt.248.t:0 "Наши колонии в Азии вырвались на свободу!"
 kmt.248.d:0 "Коммунистические революционеры в наших колониях подняли восстание и свергли колониальное правительство прежде, чем мы успели отреагировать. Теперь они полностью контролируют эту территорию и провозгласили независимость!"
 kmt.248.a:0 "Мы должны исправить эту ошибку!"
 kmt.248.b:0 "У нас нет на это времени..."
 kmt.249.t:0 "Уговоры лидера [CHI.GetLeader]"
 kmt.249.d:0 "[CHI.GetLeader] лично прибыл на встречу с [Root.GetLeader] в надежде убедить [Root.GetName] присоединиться к войне против Японии."
 kmt.249.a:0 "Вместе мы выступим против фашизма!"
 kmt.249.b:0 "Мы не хотим иметь к этому отношения."
 kmt.250.t:0 "[ENG.GetName] отказывается"
 kmt.250.d:0 "[ENG.GetName] отказалось присоединиться к нашей войне против Японии."
 kmt.250.a:0 "Если падём мы, вскоре последуют и они."
 kmt.251.t:0 "Новый курс государства [CHI.GetName]"
 kmt.251.d:0 "Узнав о новой программе китайского правительства, некоторые наши чиновники задумались о том, чтобы отказаться от азиатских колоний, прежде чем Китай растопчет их."
 kmt.251.a:0 "Нам следует отказаться от колоний."
 kmt.251.b:0 "Вздор! Неужели они забыли, как мы в своё время вернули Макао?"
 kmt.263.t:0 "Вьетнамцы освобождены"
 kmt.263.d:0 "Вьетнамское население недавно завоёванных регионов было освобождено и присоединилось к своей стране."
 kmt.263.a:0 "Азия вновь станет великой!"
 kmt.264.t:0 "Малайцы освобождены"
 kmt.264.d:0 "Малайское население недавно завоёванных регионов было освобождено и присоединилось к своей стране."
 kmt.265.t:0 "Индонезийцы освобождены"
 kmt.265.d:0 "Индонезийское население недавно завоёванных регионов было освобождено и присоединилось к своей стране."
 kmt.266.t:0 "Предложение из-за моря"
 kmt.266.d:0 "После освобождения большей части азиатских народов от западных колонизаторов китайские офицеры обратились к нам с предложением раз и навсегда положить конец этой кровопролитной войне."
 kmt.266.a:0 "Война?! Для чего она вообще нужна?"
 kmt.266.b:0 "За кого они нас принимают?"
 kmt.267.t:0 "Поддержка Японии"
 kmt.267.d:0 "Японское правительство поддержало наши усилия по укреплению прояпонской фракции в правительстве. Отношения между нашими странами улучшились."
 kmt.267.a:0 "Вместе мы приведём Азию к славе!"
 kmt.268.t:0 "Япония проявляет враждебность"
 kmt.268.d:0 "Наши попытки укрепить прояпонскую фракцию в правительстве вызвали враждебную реакцию Японии. Они заявляют, что мы лишь пытаемся избежать войны, а не искренне стремимся к сотрудничеству, и что у нас нет чести."
 kmt.268.a:0 "Они слишком узколобы."
 kmt.269.t:0 "Освободить Малайзию?"
 kmt.269.d:0 "Теперь, когда британское колониальное правительство в Малайзии капитулировало, мы можем освободить малайский народ от гнёта британских хозяев."
 kmt.269.a:0 "Теперь малайцы сами будут управлять своей страной и больше не будут угнетены британцами!"
 kmt.270.t:0 "Освободить Индонезию?"
 kmt.270.d:0 "Теперь, когда голландское колониальное правительство в Индонезии капитулировало, мы можем освободить индонезийский народ от гнёта голландских хозяев."
 kmt.270.a:0 "Теперь индонезийцы сами будут управлять своей страной и больше не будут угнетены голландцами!"
 kmt.275.t:0 "Возвращение монархии"
 kmt.275.d:0 "Провозгласив независимость от государства [JAP.GetName], [MAN.GetLeader] объявил о возрождении [MAN.GetNameDef].\n\nМы уже однажды освободили Китай от монархии. Как же нам поступить с этим так называемым государством «[MAN.GetNameDef]»?"
 kmt.275.a:0 "Смерть угнетателям!"
 kmt.275.b:0 "Возможно, мы всё-таки сможем сосуществовать."
 kmt.275.c:0 "Сейчас наше внимание требуется в другом месте."
 kmt.276.t:0 "[From.GetName] предлагает пакт о ненападении"
 kmt.276.d:0 "Дипломат из государства [From.GetName] привёз документы о заключении пакта о ненападении между нашей империей и его страной."
 kmt.276.a:0 "Это означает, что другие признали нашу силу."
 kmt.276.b:0 "Империя будет править ими всеми!"
 kmt.277.t:0 "Пакт подписан"
 kmt.277.d:0 "[From.GetName] подписало пакт о ненападении."
 kmt.277.a:0 "Действительно ли это принесёт мир?"
 kmt.278.t:0 "Пакт отклонён"
 kmt.278.d:0 "[From.GetName] отказалось подписывать пакт о ненападении."
 kmt.278.a:0 "Мы должны подготовить наших солдат!"
 kmt.272.t:0 "Война!"
 kmt.272.d:0 "Наше правительство признало нынешнюю войну важнейшей проблемой. Поскольку всё внимание чиновников сосредоточено на войне, коррупция стала менее серьёзной."
 kmt.272.a:0 "Нужно найти способ полностью искоренить коррупцию."
 kmt.273.t:0 "Коррупция вернулась к довоенному уровню"
 kmt.273.d:0 "После окончания войны чиновники вновь начали наживаться на народе."
 kmt.279.t:0 "Выборы"
 kmt.279.d:0 "Сейчас проходят наши первые выборы, и большинство граждан проголосовало за смену правительства. Однако некоторые предпочли, чтобы у власти остался Гоминьдан, а не Демократическая лига Китая."
 kmt.279.a:0 "Под руководством Гоминьдана Китай вновь станет великим."
 kmt.279.b:0 "Коррупция Гоминьдана всем известна — нам не нужно подобное «руководство»."
 kmt.78.d:0 "Лун Юнь попал в плен после разгрома его клики. Теперь мы должны решить его судьбу. Одни считают, что он станет ценным пополнением в наших рядах, другие требуют казнить его в назидание остальным."
 kmt.77.d:0 "Бывший правитель Гуансийской клики Ли Цзунжэнь попал в плен после её разгрома. Теперь мы должны решить его судьбу. Одни считают, что он станет ценным пополнением в наших рядах, другие требуют казнить его в назидание остальным."
 kmt.76.d:0 "Бывший «король Шаньси» попал в плен после разгрома его клики. Теперь мы должны решить его судьбу. Одни считают, что он станет ценным пополнением в наших рядах, другие требуют казнить его в назидание остальным."
 kmt.284.t:0 "Недостатки нашей армии"
 kmt.284.d:0 "Продолжая наблюдать за действиями наших войск на поле боя, мы всё яснее видим их слабости, которые становятся всё заметнее и для противника. Если мы и дальше будем игнорировать эти недостатки, выживание нашей страны в грядущих бурях окажется под большим вопросом."
 kmt.284.a:0 "Мы должны что-то предпринять."
 kmt.285.t:0 "Армия усовершенствована"
 kmt.285.d:0 "Недавние реформы армии принесли плоды — теперь наши вооружённые силы стали значительно лучше."
 kmt.285.a:0 "Приятно видеть прогресс."
 kmt.286.t:0 "Синерубашечники"
 kmt.286.d:0 "Общество синерубашечников и подчинённое ему Бюро расследований и статистики сыграли важную роль в нашем приходе к власти. Было бы естественно наградить их за старания, предоставив больше полномочий. Однако [Root.GetLeader], опасаясь, что однажды их силу могут обратить против него, похоже, задумал нечто иное..."
 kmt.286.a:0 "Им можно доверять"
 kmt.286.b:0 "Распустить синерубашечников!"
 kmt.287.t:0 "План воздушного налёта"
 kmt.287.d:0 "На недавнем совещании с Объединённым комитетом начальников штабов в Белом доме [Root.GetLeader] выразил желание провести воздушный налёт на Японские острова. В случае успеха операция значительно поднимет боевой дух армии и позволит отомстить за погибших в Пёрл-Харборе."
 kmt.287.a:0 "Начать подготовку."
 kmt.287.b:0 "Слишком рискованно"
 kmt.288.t:0 "Успешный воздушный налёт"
 kmt.288.d:0 "Налёт под командованием Джеймса Х. Дулиттла оказался успешным. Хотя большинство B-25 разбилось или совершило вынужденную посадку в Китае, несколько японских заводов подверглись серьёзной бомбардировке. Это значительно подняло боевой дух наших солдат."
 kmt.288.a:0 "Вот это да!"
 kmt.289.t:0 "Провал"
 kmt.289.d:0 "Воздушный налёт на Токио обернулся катастрофой. Наш авианосец был обнаружен вражескими радарами, и противник успел поднять тревогу. Бомбардировщики встретил плотный зенитный огонь, многие машины были сбиты. Гибель Джеймса Х. Дулиттла подтверждена."
 kmt.289.a:0 "Дело плохо."
 kmt.290.t:0 "[From.GetAdjective] воздушный налёт"
 kmt.290.d:0 "Воздушный налет, совершаемый [From.GetAdjective] Это привело к хаосу в [Root.Capital.GetName] Регион. Фабрики были разрушены, а гражданам нанесен ущерб."
 kmt.290.a:0 "Бака-яро!"
 kmt.291.t:0 "[From.GetAdjective] пилоты совершили посадку"
 kmt.291.d:0 "Несколько [From.GetAdjective] пилотов после воздушного налёта на Японию приземлились на нашей территории. Наши войска обнаружили их, и теперь чиновники обсуждают, как поступить в этой ситуации."
 kmt.291.a:0 "Помочь им вернуться в государство [From.GetName]"
 kmt.291.b:0 "Задержать этих белых свиней!"
 kmt.292.t:0 "[From.GetAdjective] пилот приземлился во Владивостоке"
 kmt.292.d:0 "Пилот из государства [From.GetNameDef] после воздушного налёта на Японские острова приземлился во Владивостоке. Местное ополчение взяло его под стражу. Если мы вернём пилота государству [From.GetNameDef], это может ухудшить наши отношения с Японией. Как нам решить эту проблему?"
 kmt.292.a:0 "Оставить пилота под стражей"
 kmt.292.b:0 "Помочь пилоту вернуться в государство [From.GetName]"
 kmt.292.c:0 "Передать пилота Японии"
 kmt.293.t:0 "[From.GetAdjective] воздушный налёт"
 kmt.293.d:0 "Сегодня воздушный налет, направленный [From.GetAdjective] Это вызвало некоторую панику у общественности. Однако их усилия оказались тщетными, так как наши хорошо подготовленные войска с легкостью сбрасывают свои самолеты с неба. Мы практически не понесли потерь, эта жалкая операция является твердым доказательством того, что мы победим в войне против этих варварских свиней!"
 kmt.293.a:0 "Муда-муда-муда!"
 kmt.294.t:0 "[From.GetAdjective] Помогите нашим пилотам"
 kmt.294.d:0 "The [From.GetAdjective] Правительство предложило помощь нашим пилотам, которые приземлились на их территории, и они вернутся домой в кратчайшие сроки. Их действия, безусловно, улучшат отношения между нашими двумя странами."
 kmt.294.a:0 "Это очень великодушно с их стороны."
 kmt.295.t:0 "[From.GetName] задерживает наших пилотов"
 kmt.295.d:0 "Пилоты приземлились в [From.GetAdjective] Территории были задержаны [From.GetName]. Они также отказываются от любых переговоров."
 kmt.295.a:0 "Да пребудет с ними Бог."
 kmt.296.t:0 "[From.GetName] помогает [USA.GetAdjective] пилотам"
 kmt.296.d:0 "[From.GetName] помогло [USA.GetAdjective] пилотам, приземлившимся во Владивостоке, вернуться в государство [USA.GetName]. Это ухудшило отношения между нашими странами."
 kmt.296.a:0 "Я знал, что варвары станут помогать варварам!"
 kmt.297.t:0 "[From.GetName] передаёт нашего пилота Японии"
 kmt.297.d:0 "Наш пилот, приземлившийся во Владивостоке, был передан государству [JAP.GetName] властями государства [From.GetName]. Это ухудшит отношения между нашими странами."
 kmt.297.a:0 "Надеемся, они понимают, что помогают дьяволу."
 kmt.298.t:0 "[USA.GetAdjective] пилот из государства [From.GetName]"
 kmt.298.d:0 "[From.GetName] решило передать нам [USA.GetAdjective] пилота, приземлившегося во Владивостоке. Пусть это станет знаком доверия между нашими странами."
 kmt.298.a:0 "Поприветствуем нашего «друга»."
 kmt.299.t:0 "Проблемы в Сычуани"
 kmt.299.d:0 "В газетах начали появляться сообщения о голоде и засухе в Сычуани. Некоторые организации собирают средства для помощи пострадавшим. Если мы поддержим жителей Сычуани, то сможем усилить своё политическое влияние в этом регионе."
 kmt.299.a:0 "Мне всё равно."
 kmt.299.b:0 "Отправить помощь."
 kmt.300.t:0 "Падение государства [From.GetName]"
 kmt.300.d:0 "После капитуляции государства [From.GetName] в нынешней войне мы можем ещё сильнее централизовать власть в Китае, «включив» остатки его войск в состав наших сил..."
 kmt.300.a:0 "Им следует радоваться, что мы предлагаем им места в нашей армии!"
 kmt.301.t:0 "Вторая гражданская война в Китае"
 kmt.301.d_1:0 "Между [PRC.GetRulingParty] и [CHI.GetRulingParty] началась Вторая гражданская война в Китае. Следует ли нам поддержать [PRC.GetRulingParty], чтобы положить конец тираническому правлению [CHI.GetRulingParty]?"
 kmt.301.d_2:0 "Между [CHI.GetRulingParty] и [PRC.GetRulingParty] началась Вторая гражданская война в Китае. Следует ли нам поддержать [CHI.GetRulingParty] в борьбе с коммунистическими бандитами?"
 kmt.301.a:0 "Разумеется!"
 kmt.301.b:0 "Я предпочту остаться рыбаком, наблюдающим за этой схваткой."
 kmt.302.t:0 "[From.GetName] присоединяется к нашему делу"
 kmt.302.d_1:0 "[From.GetName] решило встать на нашу сторону в борьбе с коммунистическими бандитами!"
 kmt.302.d_2:0 "[From.GetName] решило присоединиться к нам, чтобы освободить китайских крестьян от тирании [CHI.GetRulingParty]!"
 kmt.302.a:0 "Смерть коммунистам!"
 kmt.302.b:0 "Вставай, кто рабства больше не хочет!"
 kmt.303.t:0 "Судьба Пу И"
 kmt.303.d:0 "Айсиньгёро Пу И был обнаружен на железнодорожной станции, где ожидал поезд, на котором собирался бежать. После гибели японских телохранителей он сдался нашей армии. Как нам поступить с этим «последним императором»?"
 kmt.303.a:0 "Пощадить его — он всего лишь пешка."
 kmt.303.b:0 "Умри, предатель!"
 kmt.320.t:0 "[SOV.GetAdjective] поддержка"
 kmt.320.d:0 "[SOV.GetName] отправило нам дополнительное снаряжение для борьбы с врагом!"
 kmt.320.a:0 "Ура!"
 kmt.323.t:0 "Подготовка Чунцина"
 kmt.323.a:0 "Теперь мы займём Чунцин"
 kmt.323.d:0 "Нанкин пал под натиском врага, поэтому нам необходимо найти новое место для размещения верховного командования. К этой роли следует подготовить Чунцин.\n\nТакже пришло известие, что генерал Лю Сян скончался от болезни, которой давно страдал."
 kmt.324.t:0 "Промышленность эвакуирована"
 kmt.324.d:0 "После японского вторжения часть оборудования и предприятий, находившихся вблизи линии фронта, была перевезена в Сычуань."
 kmt.324.a:0 "Здесь они будут в безопасности."
 KMT_will_die_if_nanking_fall_tt:0 "§RЕсли Нанкин падёт, государство [CHI.GetName] безоговорочно аннексирует вас.§!"
 kmt.325.t:0 "[KMT_central_gov_tag.GetName] подвергается нападению!"
 kmt.325.d:0 "[KMT_central_gov_tag.GetName] подверглось нападению иностранных захватчиков. Мы должны прийти ему на помощь!"
 kmt.325.a:0 "Мы изгоним их с китайской земли!"
 kmt.325.b:0 "Думаю, они справятся и без нас."
 kmt.326.t:0 "[From.GetName] присоединяется к нам"
 kmt.326.d:0 "[From.GetName] присоединилось к нашей войне против японских захватчиков!"
 kmt.330.t:0 "Германия отзывает военную миссию"
 kmt.330.d:0 "[GER.GetNameDef] решило прекратить военную помощь и отозвать своих советников. Мы не можем заставить их остаться, поэтому вынуждены наблюдать за их отъездом и лишиться ценной поддержки."
 kmt.330.a:0 "Реформирование армии всё равно продолжится."
 kmt.331.d:0 "Наши военные советники отозваны из Китая и вскоре вернутся в Отечество."
 kmt.331.a:0 "Подготовиться к их возвращению."
 kmt.332.t:0 "Китай просит расширить нашу военную миссию"
 kmt.332.d:0 "Китайский посол направил нам коммюнике с просьбой расширить участие наших советников в подготовке Китайской национальной армии. Наши военные специалисты находятся в этой стране с 1926 года. Согласие на просьбу значительно улучшит отношения с китайским националистическим правительством."
 kmt.332.a:0 "Отправить больше военных советников."
 kmt.332.b:0 "Мы не можем себе этого позволить."
 kmt.333.t:0 "Германия расширяет военную миссию"
 kmt.333.d:0 "посредством прямого решения [GER.GetLeader], [GER.GetAdjective] Правительство согласилось увеличить число военных советников. Прекрасная новость, которая поможет перестроить наши вооруженные силы и сплотить наши народы."
 kmt.333.a:0 "Направить их в штабы дивизий."
 kmt.334.t:0 "Германия отказывается расширять военную миссию"
 kmt.334.d:0 "Мы получили краткое сообщение от нашего посла в Германии, в котором говорится, что [GER.GetAdjective] правительство не станет присылать дополнительных военных советников."
 kmt.334.a:0 "Какое разочарование."
 KMT_burma_rd_forts_tt:0 "§YВместо фабрики мирного назначения вдоль южной границы провинции Юньнань будут построены укрепления.§!"
 kmt.336.t:0 "Встреча с коммунистами?"
 kmt.336.d:0 "Война с японцами окончена, и теперь наши цели больше не совпадают с целями коммунистических бандитов. Однако немедленное начало прямого наступления в нынешней обстановке может отрицательно сказаться на нашей репутации. Возможно, стоит провести встречу с [PRC.GetLeader] и отложить решительные действия на потом."
 kmt.336.a:0 "Отправить кого-нибудь на встречу."
 kmt.336.b:0 "Мы устроим им засаду, когда они прибудут."
 kmt.336.c:0 "Нам следует сосуществовать."
 kmt.336.e:0 "Кого волнует такая чепуха, как «репутация»?"
 kmt.337.t:0 "Приглашение"
 kmt.337.d:0 "[Root.GetLeader] получил приглашение от партии [From.GetRulingParty] на встречу. Утверждается, что она будет посвящена будущему Китая и поиску более мирного решения наших нынешних напряжённых отношений. Однако некоторые считают, что это ловушка, цель которой — избавиться от [Root.GetLeader]."
 kmt.337.a:0 "Нам нечего бояться."
 kmt.337.b:0 "Мы перехватим инициативу и устроим им засаду."
 kmt.337.c:0 "Ударим прямо сейчас — они этого не ожидают!"
 kmt.339.t:0 "Засада!"
 kmt.339.d_rep_killed:0 "Грязные подонки из [From.GetRulingParty] Засадили нас! Они повсюду размещают охрану и начинают стрелять в наших людей после того, как мы вошли в зал заседаний. К счастью, [Root.GetLeader] Выжил в засаде с незначительными ранениями, вызванными бродячими пулями.[Root.GetLeader] Успешно сел в самолет и вернулся обратно. [Root.Capital.GetName]. Огонь гражданской войны возрождается."
 kmt.339.d_fight:0 "Мерзавцы из партии [From.GetRulingParty] задумали то же самое и привели к месту встречи вооружённые силы! Как только обе стороны раскрыли свои истинные намерения уничтожить друг друга на месте, зал заседаний и прилегающая территория превратились в поле боя. Пламя гражданской войны разгорелось вновь."
 kmt.339.a:0 "Смерть [From.GetLeader]!"
 kmt.340.d_rep_killed:0 "Наша засада удалась, и на месте было уничтожено множество врагов государства. Однако их лидер получил лишь лёгкие ранения и сумел скрыться в безопасном месте."
 kmt.340.d_fight:0 "Наш враг тоже пытался устроить нам засаду! Наши силы столкнулись с их войсками, и в этом районе начались бои. Следует организовать наших людей и подготовиться к дальнейшим действиям."
 kmt.340.a:0 "Неважно, в конце концов мы победим."
 kmt.341.t:0 "[From.GetName] принимает приглашение"
 kmt.341.d:0 "[From.GetLeader] принял наше приглашение и сообщил, что прибудет на встречу."
 kmt.341.a:0 "Посмотрим..."
 kmt.342.t:0 "[From.GetName] объявляет нам войну"
 kmt.342.d_p:0 "[From.GetName] объявляет нам войну! Похоже, они покончили с сотрудничеством и хотят избавиться от нас раз и навсегда!"
 kmt.342.d_k:0 "[From.GetName] объявляет нам войну! Проклятые бандиты отказались слушать доводы разума и показали свою варварскую сущность!"
 kmt.342.a:0 "Мы так и знали!"
 kmt.343.t:0 "Встреча"
 kmt.343.d:0 "Представители обеих сторон прибыли к месту встречи. Как должен поступить наш представитель?"
 kmt.343.a:0 "Выиграть для нас время на подготовку."
 kmt.343.b:0 "Предложить сотрудничество"
 kmt.343.c:0 "Тогда мы тоже потянем время..."
 kmt.344.d_stall:0 "Люди начинают подозревать, что представители партии [From.GetRulingParty] на самом деле лишь тянут время, чтобы подготовиться. Если это действительно так, мы должны принять меры для собственной защиты."
 kmt.344.d_c:0 "Партия [From.GetRulingParty] выразила желание создать совместное правительство. Следует ли нам принять их предложение и вместе управлять Китаем?"
 kmt.344.a:0 "Перехватим инициативу и нападём первыми!"
 kmt.344.b:0 "Совместное правительство звучит неплохо."
 kmt.345.d:0 "[From.GetName] переходит в наступление и начинает атаковать нас!"
 kmt.346.t:0 "[From.GetName] соглашается"
 kmt.346.d:0 "[From.GetName] соглашается создать совместное правительство."
 kmt.346.a:0 "Это пойдёт всем на пользу"
 KMT_united_chinese_gov:0 "Объединённое правительство Китая"
 kmt.347.t:0 "Отступить на Тайвань?"
 kmt.347.d:0 "Нынешняя война складывается для нас не лучшим образом. Некоторые предлагают отступить на Тайвань и уже оттуда подготовить контрнаступление."
 kmt.347.a:0 "Это всего лишь тактическое отступление..."
 kmt.347.b:0 "Никогда!"
 kmt.348.t:0 "Раздел по Янцзы"
 kmt.348.d:0 "Нынешняя война складывается для нас неудачно. Некоторые предлагают заключить с коммунистами мир и разделить Китай. Мы сможем использовать это время, чтобы перегруппироваться и уничтожить их, когда наша армия вновь будет готова."
 kmt.348.a:0 "Звучит неплохо."
 kmt.349.t:0 "[From.GetName] бросает нас"
 kmt.349.d:0 "[From.GetLeader] Он решил уступить в [JAP.GetAdjective] Требуйте и откажитесь от нас."
 kmt.349.a:0 "Мы не способны противостоять столь великому злу..."
 kmt.349.b:0 "Мы скорее умрём, чем станем марионеткой великого зла!"
 kmt.350.t:0 "Неповиновение государства [From.GetName]"
 kmt.350.d:0 "[From.GetName] решает отвергнуть оккупацию своей территории, несмотря на разрешение, данное [CHI.GetLeader]."
 kmt.350.d_2:0 "[From.GetName] выбирает мудрый путь и становится нашей марионеткой."
 kmt.350.a:0 "Бакамонога! Нихон-но пава ва сэкайити!"
 kmt.351.t:0 "[From.GetName] хочет построить укрепления на нашей территории"
 kmt.351.d:0 "[From.GetName] пытается направить солдат и военных инженеров на нашу территорию, чтобы построить укрепления против возможных захватчиков и не позволить им овладеть стратегически важными позициями. Хотя это может усилить нашу местную оборону, допуск их войск в наши владения поставит положение [Root.GetLeader] под серьёзную угрозу."
 kmt.351.a:0 "НЕТ! Пусть строят укрепления где-нибудь ещё!"
 kmt.351.b:0 "Ради общего блага китайской нации..."
 kmt.352.t:0 "Совет от [From.GetLeader]"
 kmt.352.d:0 "[From.GetLeader] Он заявил, что [From.Capital.GetName] Сейчас он находится в очень нестабильном состоянии и \"рекомендовал бы\" нашим людям туда не ходить.[From.GetLeader] Они также заявили, что будут строить укрепления самостоятельно. Но мы все знаем, почему он хочет держать наших людей у дверей."
 kmt.352.a:0 "Он подвергает опасности всю страну — мы должны от него избавиться!"
 kmt.352.b:0 "В столь критический момент мы не должны направлять оружие против собственных братьев..."
 kmt.353.t:0 "Укрепления построены"
 kmt.353.d:0 "[From.GetLeader] радушно встретил наших людей, когда они вошли в провинцию Шаньдун, чтобы построить укрепления, необходимые для выживания нашей страны."
 kmt.353.a:0 "Рад это слышать."
 KMT_CQ_stall_time_tt:0 "§RПоследующих событий не будет§!\n"
 PRC_stall_time_tt:0 "На послевоенной встрече с партией [CHI.GetRulingParty] было решено тянуть время"
 kmt.355.t:0 "Принудительный призыв"
 kmt.355.d:0 "Некоторые чиновники предложили насильно призывать мужчин, включая студентов, на военную службу."
 kmt.355.a:0 "Неогранённый самоцвет не засияет."
 kmt.355.b:0 "Звучит ужасно."
 kmt.356.t:0 "Встреча с соседом"
 kmt.356.d:0 "После недавних событий вокруг нас появились новые соседи. Мы могли бы построить хорошие отношения с ними и укрепить нашу власть в этом районе."
 kmt.356.a:0 "Звучит неплохо."
 kmt.356.b:0 "В одиночку мы справимся лучше."
 kmt.357.t:0 "[From.GetAdjective] Делегация"
 kmt.357.d:0 "[From.GetName] направляет к нам делегацию, чтобы добиться установления тесных отношений."
 kmt.357.a:0 "Мы будем сотрудничать"
 kmt.357.b:0 "Лучше искать защиты в тени великана."
 kmt.357.c:0 "Мы не позволим дьяволу протянуть свои щупальца ещё дальше!"
 kmt.358.t:0 "Вместе мы сильнее"
 kmt.358.d:0 "[From.GetName] соглашается сотрудничать с нами."
 kmt.358.d_p:0 "[From.GetName] решает искать нашей защиты и передаёт нам часть своей автономии."
 kmt.358.a:0 "Мудрое решение."
 kmt.359.t:0 "[From.GetName] отказывается"
 kmt.359.d:0 "[From.GetName] решает отклонить наше предложение."
 kmt.359.a:0 "Мы должны защитить свои интересы в регионе, даже силой!"
 kns.1.t:0 "Гражданская война в Японии"
 kns.1.d:0 "Провал попытки завоевать Китай вызвал массовые волнения среди японского народа. Это серьёзное поражение Японии дало демократам возможность организовать революцию и свергнуть нынешнее фашистское правительство. Из-за проигранной войны и недовольства населения мечта Хирохито теперь лопнула, словно мыльный пузырь.\n\nНекоторые союзники Японии бросили её на произвол судьбы, поскольку больше не могут на неё полагаться."
 kns.1.a:0 "Это полное поражение фашистских ублюдков!"
 kns.1.b:0 "Интересное развитие событий."
 kns.1.c:0 "Наш союзник пал, теперь мы не можем на него полагаться."
 kns.2.t:0 "Конец гражданской войны в Японии"
 kns.2.d_f:0 "Несмотря на многочисленные партизанские акции и поддержку народа, сторонники демократии потерпели поражение в гражданской войне в Японии. Все подозреваемые были задержаны или казнены. Стремясь стабилизировать обстановку, император Хирохито выступил перед японским народом и заявил, что война — их единственная судьба. Однако реакция толпы свидетельствовала об обратном."
 kns.2.d_d:0 "После многочасового штурма императорского бункера фашистский режим капитулировал перед сторонниками демократии. Победив в гражданской войне, демократический кабинет теперь пытается залечить раны, нанесённые прежним фашистским режимом. «Мы не надеемся, что нас простят, но всё равно исполним свой долг», — заявил один из японских демократических революционеров."
 kns.2.a:0 "Будем надеяться, японцы понимают, что делают..."
 kns.5.t:0 "[CHI.GetNameDefCap] нарушает перемирие с государством [JAP.GetNameDef]"
 kns.5.d:0 "\n[CHI.GetName] нарушает перемирие с государством [JAP.GetName] и объявляет ему войну. Обе страны вновь оказываются втянуты в боевые действия, но на этот раз наступление начинает [CHI.GetName]. Этот вероломный поступок государства [CHI.GetName] вызвал обеспокоенность во всём мире."
 kns.5.a:0 "Смерть империалистическим псам!"
 kns.5.b:0 "Их воинственность ввергнет мир в новую эпоху тьмы!"
 kns.6.t:0 "Альянс «[From.GetFactionName]»"
 kns.6.d:0 "Сегодня азиатская политика перевернулась с ног на голову: китайские и японские дипломаты объявили о заключении военного пакта между государствами [CHI.GetName] и [JAP.GetName]. Они заявили, что уже пролито слишком много крови, тогда как существуют и другие силы, стремящиеся уничтожить обе страны.\n\n[JAP.GetName] призвало всех задуматься о том, что вместо взаимного ослабления давние враги теперь станут лишь сильнее вместе."
 kns.6.a:0 "Ничто не сможет угрожать альянсу «[From.GetFactionName]»!"
 kns.6.b:0 "Неожиданный переворот в азиатской дипломатии."
 kns.7.t:0 "[CHI.GetName] вступает в альянс «[From.GetFactionName]»!"
 kns.7.d:0 "Китайские и немецкие дипломаты недавно подписали в городе [GER.Capital.GetName] военный пакт, укрепив связи между двумя странами.\n\nНекоторые предполагают, что цель этого союза — взять в клещи государство [SOV.GetName], однако официальные лица государств [CHI.GetName] и [GER.GetName] не подтвердили и не опровергли эти слухи."
 kns.7.c:0 "Возникает новая великая держава."
 kns.8.t:0 "[GER.GetName] отвергает союз с Китаем!"
 kns.8.d:0 "Отказ [CHI.GetAdjective] дипломатические достижения, [From.GetLeader] публично объявляя, что [From.GetName] Не будет заключать военный договор с [CHI.GetName]."
 kns.8.b:0 "И всё же я один..."
 lti.1.t:0 "Стратегия заманивания противника"
 lti.1.d:0 "Наши солдаты начинают следовать указаниям новой стратегии заманивания противника вглубь страны. Если всё пойдёт по плану, вскоре это должно изменить ход войны."
 lti.1.a:0 "Будем надеяться на лучшее."
 lti.2.d:0 "Новая стратегия оказалась весьма успешной. Теперь наши солдаты гораздо эффективнее обороняются от врага."
 lti.2.a:0 "Хороший знак"
 lti.6.t:0 "Вражеские партизаны"
 lti.6.d:0 "В последнее время поступают сообщения об отдельных действиях вражеских партизан за линией нашего фронта. Пока они не представляют серьёзной угрозы, но некоторые чиновники предлагают сокрушить врага прежде, чем партизаны начнут угрожать нашим линиям снабжения."
 lti.6.a:0 "Посмотрим..."
 lti.7.d:0 "Поступает всё больше сообщений о действиях партизан. Положение ухудшается!"
 lti.7.a:0 "Проклятье!"
 lti.11.t:0 "Неумелое командование на фронте"
 lti.11.d:0 "Недостатки нашего фронтового командования как никогда очевидны для государства [From.GetName]. Его войска пользуются этой возможностью, чтобы перейти в контрнаступление."
 lti.11.a:0 "Этим бездарным генералам следует совершить сэппуку!"
 KMT_diable_central_government_tt:0 "§RОтключает механику центрального правительства§!"
 low_l:0 "Низкая легитимность"
 cairoC.1.t:0 "Провести конференцию с государствами [CHI.GetName] и [ENG.GetName]?"
 cairoC.1.d:0 "Учитывая продолжающуюся войну с государством [JAP.GetName], вполне разумно объединиться перед лицом [JAP.GetAdjective] угрозы. Для этого следует обсудить ситуацию с лидерами этих стран и добиться более тесного сотрудничества."
 cairoC.1.a:0 "Отправить сообщение."
 cairoC.1.b:0 "В этом нет необходимости."
 cairoC.2.t:0 "Послание от государства [From.GetName]"
 cairoC.2.d:0 "[From.GetLeader] направил послание лидеру [Root.GetLeader], выразив желание наладить более тесное сотрудничество между странами, способными помешать амбициям государства [JAP.GetName]. [CHI.GetLeader] также приглашён."
 cairoC.2.d_2:0 "[From.GetLeader] направил послание [Root.GetLeader], выразив желание наладить более тесное сотрудничество между странами, способными помешать амбициям [JAP.GetName]. [ENG.GetLeader] также приглашён."
 cairoC.2.a:0 "Мы можем извлечь из этого некоторую выгоду."
 cairoC.2.b:0 "Мы можем победить [JAP.GetName] и без их помощи."
 cairoC.3.t:0 "[From.GetName] принимает приглашение"
 cairoC.3.d:0 "[From.GetLeader] ответил [Root.GetLeader] и заявил, что примет участие в конференции."
 cairoC.3.a:0 "Вместе мы сильнее."
 cairoC.4.t:0 "[From.GetLeader] отказывается"
 cairoC.4.d:0 "[From.GetLeader] отклонил наше приглашение, заявив, что наше сотрудничество совершенно не нужно."
 cairoC.4.a:0 "Какое разочарование."
 cairoC.5.t:0 "Условия"
 cairoC.5.d:0 "Все участники прибыли, и подготовка завершена — обсуждение началось. На рассмотрение были представлены следующие условия, ожидающие одобрения."
 cairoC.5.a:0 "Выглядит приемлемо."
 cairoC.5.b:0 "Это что, какая-то афера?!"
 cairoC.6.t:0 "Конференция в государстве [CairoC_venue.GetName]"
 cairoC.6.d_fail:0 "Несмотря на попытку [USA.GetLeader] наладить более тесное сотрудничество между странами, способными остановить амбиции государства [JAP.GetName], эта идея полностью провалилась. Участникам так и не удалось прийти к соглашению, и некоторые опасаются, что после поражения государства [JAP.GetName] это может привести к будущим конфликтам между приглашёнными на конференцию странами."
 cairoC.6.d_noUS:0 "Несмотря на то, что [USA.GetLeader]Идея, конференция заканчивается [USA.GetLeader]Сиденье пустое.[CHI.GetLeader] и [ENG.GetLeader] достигли соглашения, которое [USA.GetLeader] Не выдержала. Однако, [ENG.GetLeader] Мне кажется, что это вызывает отвращение к тому, что [CHI.GetName] Они могут получить политическую выгоду от этих условий.\n\nНекоторые эксперты говорят, что эта конференция будет означать, что [ENG.GetName]Отношения с [USA.GetName] В последующие годы ситуация довольно быстро ухудшится и может даже привести к возникновению блоков в демократическом мире."
 cairoC.6.d_noBR:0 "[CHI.GetLeader] и [USA.GetLeader] достигли соглашения о совместной борьбе против [JAP.GetAdjective]ой угрозы. Однако [ENG.GetLeader], также приглашённый на конференцию, покинул её до подписания соглашения по причинам, которые не были раскрыты.\n\nСчитается, что [ENG.GetLeader] ушёл потому, что обсуждавшиеся условия противоречили его личным интересам: они предоставили бы государству [CHI.GetName] огромные политические преимущества, способные нанести ущерб колониальным интересам государства [ENG.GetName] в этом регионе."
 cairoC.6.d_noCN:0 "После долгих жарких споров [CHI.GetLeader] с недовольством покинул конференцию, поскольку представитель государства [CHI.GetName] назвал предложенные условия \"неприемлемыми\". Тем временем в государстве [CairoC_venue.GetName] лидеры [ENG.GetLeader] и [USA.GetLeader] подписали соглашение, которое поможет им в войне против государства [JAP.GetName]."
 cairoC.6.d_suc:0 "Все приглашенные лидеры достигли соглашения в более тесном сотрудничестве против международного сообщества. [JAP.GetAdjective] Угроза после долгих обсуждений. Некоторые эксперты говорят, что эта конференция ознаменует падение [JAP.GetName] В недалеком будущем три самые могущественные страны мира решили выступить против... [JAP.GetName] вместе. Если бы это было правдой, то [JAP.GetAdjective] Может быть, им будет трудно их ждать."
 cairoC.6.a:0 "Долой [JAP.GetAdjective]их псов!"
 cairoC.6.b:0 "Детские забавы..."
 cairoC.6.c:0 "Интересное развитие событий..."
 cairoC.8.d:0 "Следующие условия были одобрены, и теперь мы вместе выступим против [JAP.GetAdjective]ой угрозы!"
 KMT_no_seperate_peace_with_JAP:0 "Будет невозможно заключить сепаратный мир с государством [JAP.GetName]\n"
 kmt_western_volunteers:0 "Китайские добровольцы"
 kmt_chinese_support:0 "Китайские группы поддержки"
 incompetent_government:0 "Некомпетентное правительство"
 KMT_resist_the_reds:0 "Противостоять коммунизму"
 KMT_resist_the_reds_desc:0 "§YДаёт усиление во время войны с коммунистическим правительством.§!"
 KMT_anti_communism_sentiment:0 "Антикоммунистические настроения"
 KMT_anti_communism_sentiment_desc:0 "§RБудет удалено, если страна не воюет с коммунистами.§!"
 JAP_kodoha_idea:0 "Кодоха у власти"
 JAP_toseiha_idea:0 "Тосэйха у власти"
 GXC_huang_xuchu:0 "Хуан Сюйчу"
 GXC_huang_shaohong_pa:0 "Хуан Шаохун"
 KMT_doolittle_failed:0 "Воздушный налёт отражён"
 KMT_doolittle_raid:0 "Рейд Дулиттла"
 KMT_central_government_idea:0 "Центральное правительство"
 KMT_central_government_idea_desc:0 "Эта страна провозглашена единственным законным правительством Китая."
 KMT_central_government_lost:0 "Утрата статуса центрального правительства"
 KMT_central_government_lost_desc:0 "Эта страна утратила статус центрального правительства Китая, что оказывает на неё неблагоприятное влияние."
