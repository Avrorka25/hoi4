 kmt_no_remove_warlord_army_tt:0 "Национальный дух §YАрмии милитаристов§! отныне не будет удалён."
 KMT_jap_navy_indus_assist_tt:0 "Добавляет §Y2 военно-морские верфи§! в двух случайных подконтрольных регионах.\n"
 KMT_oust_colonisers_available_tt:0 "Любой национальный регион следующих стран:\n        §YВьетнам§!\n        §YКамбоджа§!\n        §YЛаос§!\n        §YМалайзия§!\n        §YИндонезия§!\n        §YИндия§!\n    Не принадлежит своему законному владельцу.\n    Либо эти страны являются марионетками неазиатских держав."
 KMT_oust_the_colonizers_tt:0 "Получить цели войны против всех колонизаторов в Азии.\n\n§YКогда вы возьмёте под контроль национальный регион каждой из перечисленных выше азиатских стран, появится возможность освободить её.§!"
 kmt_harsh_takover_oob_tt:0 "Формирует 3 пехотные дивизии из §Y8 пехотных полков§! в §YНанкине§! и §Yкаждом соседнем подконтрольном регионе§!."
 kmt_xsm_militia_rising_up_tt:0 "Формирует 5 отрядов ополчения из §Y2 полков ополчения§!.\n"
 KMT_receive_lendlease_tt:0 "§YСледующий эффект будет происходить каждые 30 дней.§!\n\n"
 kmt_no_incompetent_tt:0 "Нет национального духа §YНекомпетентная промышленность§!"
 kmt_no_incompetent_navy_tt:0 "Нет национального духа §YНекомпетентная судостроительная промышленность§!"
 KMT_fortify_land_tt:0 "Добавляет §Y16 наземных укреплений§! вдоль северной границы.\n"
 kmt_dtdc_tt:0 "Открывает §HКорпуса смертников§!.\nВся линейная пехота: \n    Жёсткая атака: §G+5%§!\n    Бронебойность: §G+5%§!\n    Прорыв: §G+5%§!"
