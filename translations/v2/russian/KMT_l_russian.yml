 chi_jap_alliance_threat:0 "Китайско-японский альянс"
 chi_jap.1.t:0 "Предательство [CHI.GetLeader]"
 chi_jap.1.d:0 "[CHI.GetLeader] предал свою страну и народ, заключив союз с подлыми японцами! Мы должны что-то предпринять, пока не стало слишком поздно!"
 chi_jap.1.a:0 "Мы должны сотрудничать с военными кликами!"
 chi_jap.1.b:0 "Мы будем действовать в одиночку."
 chi_jap.2.t:0 "Послание от государства [From.GetName]"
 chi_jap.2.d:0 "В связи с недавним предательством китайского народа государством [CHI.GetName], [From.GetLeader] направил послание с просьбой о сотрудничестве в создании единого фронта против этой угрозы."
 chi_jap.2.a:0 "Вставайте, кто рабства не хочет!"
 chi_jap.2.b:0 "Возможно, сотрудничество со Страной восходящего солнца сулит нам более светлое будущее."
 chi_jap.2.c:0 "Никогда!"
 chi_jap.3.t:0 "Китайский военачальник — [From.GetLeader]"
 chi_jap.3.d:0 "[From.GetLeader] направил послание, заявив о желании стать частью Сферы сопроцветания."
 chi_jap.3.a:0 "Они явно понимают, куда дует ветер."
 chi_jap.3.b:0 "Они не заслуживают места в Сфере сопроцветания."
 chi_jap.4.t:0 "Запрос принят"
 chi_jap.4.d:0 "Государство [From.GetName] предоставило нам место в Сфере сопроцветания!"
 chi_jap.4.a:0 "Сфера сопроцветания расширяется!"
 chi_jap.5.t:0 "Запрос отклонён"
 chi_jap.5.d:0 "Наш запрос на вступление в альянс [From.GetFactionName] был отклонён!"
 chi_jap.5.a:0 "Мы сами загнали себя в тупик..."
 chi_jap.6.t:0 "[From.GetName] присоединяется к нашей борьбе"
 chi_jap.6.d:0 "[From.GetLeader] также осознал угрозу, исходящую от предателя [CHI.GetLeader] и японцев, и присоединился к нашим усилиям по их уничтожению."
 chi_jap.6.a:0 "Китайцы должны объединиться!"
 chi_jap.7.t:0 "[From.GetName] отказывается присоединиться к нам"
 chi_jap.7.d:0 "[From.GetLeader] отказался присоединиться к нашим усилиям по спасению нации!"
 chi_jap.7.a:0 "Это всего лишь ещё одна форма предательства!"
