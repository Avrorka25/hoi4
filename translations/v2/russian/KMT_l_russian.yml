 political.9.d_nl:0 "Некоторые скажут, что предвидели это. И те, кто предупреждал об опасности фашизма, и те, кто превозносил его как спасение государства [Root.GetName], сегодня увидели, как их пророчества воплотились в жизнь: находясь в городе [Root.Capital.GetName], [Root.GetLeader] объявил, что государство [CHI.GetName] пойдёт по пути фашизма. Вся оппозиция была подавлена за считаные часы.\n\n[Root.GetLeader] также не намерен позволить сопротивлению окрепнуть. Введено военное положение, и с учётом происходящих перемен всё, что последует дальше, едва ли будет сильно отличаться."
 political.18.d_nl:1 "Стремительно растущее [Root.GetAdjective]ое фашистское движение никогда не утверждало, что ему необходима поддержка большинства для захвата власти. Тем не менее его общественная поддержка, похоже, быстро возросла. Теперь [Root.GetLeader] призывает к переходу к фашизму.\n\nДо сих пор некоторые члены партии [Root.GetRulingParty] отвергали призыв к референдуму как типичную попытку нарушить работу системы, но это сильно разгневало лидера [Root.GetLeader]. Если мы не предпримем действий сейчас, [Root.GetLeader] может решить, что вооружённая борьба — более подходящий путь к власти."
 political.10.d_nl:1 "Хотя попытки фашистского движения возродить националистические настроения принесли определённый успех, сопротивление этим идеям остаётся сильным. [Root.GetLeader] разочарован тем, насколько мало [Root.GetAdjective]ое население верит в партию [Root.GetRulingParty].\n\n[Root.GetLeader] по-прежнему уверен, что народ со временем вновь обретёт чувство гордости, но пока не решается выбрать дальнейший курс. Некоторые сторонники призывают совершить переворот прямо сейчас, прежде чем враги государства [Root.GetName] успеют действовать. Однако при ограниченной поддержке общества это ввергнет страну в гражданскую войну."
