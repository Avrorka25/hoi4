 CHI_improve_the_army_situation:0 "Улучшить положение армии"
 CHI_improve_the_army_situation_desc:0 "Национально-революционная армия находится в плачевном состоянии из-за повсеместной коррупции и крайне неудовлетворительной подготовки солдат, что делает её совершенно неэффективной.\n\nЕсли мы не хотим, чтобы Китай был стёрт в порошок, необходимо провести реформы и превратить НРА в настоящую, обученную и должным образом управляемую силу."
 CHI_improve_the_NRA:0 "Улучшить НРА"
 chi_improve_the_nra_decision:0 "§H100§!£army_experience"
 chi_improve_the_nra_decision_blocked:0 "§R100§!£army_experience"
 CHI_war_of_resistance:0 "Война сопротивления"
 CHI_war_of_resistance_desc:0 "На нашей родине снова бушует война, и Центральная равнина уже не безопасна для простолюдина. The [JAP.getAdjective] Агрессия может поглотить всю Восточную Азию, если мы не остановим этих поджигателей войны и жаждущих власти империалистов!\n\nЕсли мы хотим защитить дорогого Чжунго, мы должны быть готовы сделать все возможное, чтобы обеспечить его безопасность."
 CHI_Huayuankou_embankment_breach_incident:0 "Организовать прорыв дамбы в Хуаюанькоу"
 CHI_Huayuankou_embankment_breach_incident_desc:0 "Враг уже совсем близко к Чжэнчжоу; возможно, нам стоит открыть дамбы на Хуанхэ и использовать наводнение, чтобы остановить противника."
 CHI_scorched_earth_policy_map:0 "В этих регионах сейчас можно применить политику §Hвыжженной земли§!."
 CHI_scorched_earth_policy:0 "Тактика выжженной земли в регионе [FROM.getName]"
 CHI_scorched_earth_policy_desc:0 "Наступающие захватчики заняли наши города и деревни, вынудив армии отступить ради сохранения сил. Однако мы можем приказать им уничтожить местную инфраструктуру перед уходом из региона [FROM.getName], тем самым замедлив продвижение врага."
 CHI_redirect_investments_for_burma_road:0 "Перенаправить инвестиции на Бирманскую дорогу"
 CHI_redirect_investments_for_burma_road_desc:0 "Некоторые специалисты советуют направить часть ресурсов на строительство цепи укреплений на юге Юньнани, которые смогут эффективно сдержать врага, если тот решит вторгнуться с юга."
 CHI_prioritize_external_threat:0 "Сосредоточиться на внешней угрозе"
 CHI_prioritize_external_threat_desc:0 "Японцы начали наступление, пока мы всё ещё боремся с внутренней угрозой! Неужели нам стоит перестать направлять оружие на соотечественников и обратить его против империалистических захватчиков?"
 CHI_prepare_provisional_capital:0 "Подготовить временную столицу"
 CHI_prepare_provisional_capital_desc:0 "Враг стремительно наступает на Нанкин! Нельзя позволить ему захватить руководство страны. Мы должны создать основу для временной столицы в глубине страны, чтобы управлять государством в эти суровые времена; однако сделать это будет непросто."
 CHI_join_united_front:0 "Присоединение к единому фронту"
 CHI_join_united_front_desc:0 "[JAP.getNameDefCap] сделала свой ход и решила стереть китайскую нацию с лица Земли. Мы должны всеми возможными средствами поддержать Единый фронт, чтобы обеспечить безопасность собственно Китая!"
 CHI_strife_for_survival:0 "Бороться за выживание!"
 CHI_strife_for_survival_desc:0 "Всё больше наших солдат и генералов осознают, что победить в нынешней войне можно лишь полностью посвятив себя ей; это в той или иной степени повысило боеспособность нашей армии."
 CHI_most_desperate_hours:0 "Самые отчаянные часы!"
 CHI_most_desperate_hours_desc:0 "Наша страна находится на грани краха под натиском захватчиков! Выживание [CHI.getAdjective]ой цивилизации зависит от храбрости нашего народа!"
 CHI_united_front_strategy:0 "Стратегия Единого фронта"
 CHI_united_front_strategy_desc:0 "Подобно кошке, Япония продвигалась вперёд и захватила Корею. Она пыталась унизить нас своими двадцатью одним требованием, оккупировала Маньчжурию, а теперь вновь наступает. Довольно; Китай будет сражаться до последнего ради свободы. В обращении к народу [Root.GetLeader] призовёт всех [Root.GetAdjective]их граждан сплотиться, иначе каждого поодиночке ждёт неминуемая гибель."
 CHI_unequal_treaties:0 "Неравноправные договоры"
 CHI_unequal_treaties_desc:0 "Договорные порты — один из последних остатков унижения империи Цин на мировой арене — олицетворяют стремление европейских и японских империалистов эксплуатировать и подчинить [ROOT.getAdjective]ий народ в период нашей слабости. \n\nИспользуя ситуацию в своих интересах, мы можем сблизиться с теми, кто разделяет наши ценности, и одновременно свергнуть незаконные режимы, владеющие нашими законными землями!"
 CHI_dealing_with_trade_port_decision:0 "[FROM.getName]"
 CHI_success_chance_depends_on_stability_tt:0 "§HВысокая стабильность§! повышает вероятность §Gуспешного переворота§!!"
 hk_returned_tp:0 "Договорный порт возвращён"
 CHI_liberation_of_asia:0 "Освобождение Азии"
 CHI_liberation_of_asia_desc:0 "Многие народы Южной и Юго-Восточной Азии сейчас страдают под гнётом европейских колонизаторов.\nХотя нам удалось сохранить независимость и укрепить власть над Центральной равниной, мы не забыли о борьбе наших братьев и сестёр по оружию! К оружию, братья, ваше освобождение близко!"
 CHI_liberate_country:0 "Освободить государство [FROM.getNameDef]"
 CHI_raises_three_miltiia_divisions_tt:0 "Будет сформировано три дивизии из §Y5 батальонов ополчения§!."
 CHI_raises_five_miltiia_divisions_tt:0 "Будет сформировано пять дивизий из §Y5 батальонов ополчения§!."
 CHI_raises_ten_miltiia_divisions_tt:0 "Будет сформировано десять дивизий из §Y5 батальонов ополчения§!."
 CHI_liberation_of_asia_here_tt:0 "Освобождение этих территорий станет возможным"
 CHI_asia_decolonized:0 "Азия деколонизирована"
 CHI_asia_decolonized_desc:0 "Наши военные и идеологические победы привели к шаткому положению, при котором мы не можем достичь европейских и американских метрополий, но и враги не способны вернуть свои колонии.\nТеперь, когда мы наконец достигли цели освобождения Азии, какое решение примет [ROOT.getLeader]? Стоит ли нам заключить мир с этими назойливыми колонизаторами?"
 CHI_expand_industrial_capabilities:0 "Расширить промышленные возможности"
 CHI_expand_industrial_capabilities_desc:0 "Экономический потенциал обширных земель собственно Китая долгое время оставался без внимания властей. Последние технологические и экономические достижения дают нам уникальную возможность укрепить промышленную мощь страны и ослабить последствия экономического застоя последних лет."
 CHI_weapons_purchases_category:1 "Закупка [USA.GetAdjective]ого оружия"
 CHI_weapons_purchases_category_desc:0 "Пока наша промышленность всё ещё пытается наверстать упущенное, закупка современного оружия за рубежом может оказаться единственным способом привести вооружённые силы к современным стандартам."
