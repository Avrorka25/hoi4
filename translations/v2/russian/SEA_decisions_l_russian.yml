 MEN_army_reform:0 "Армейская реформа"
 MEN_army_reform_desc:0 "Коррупция, некомпетентность и трусость распространены на всех уровнях управления в нашей армии, и в ней нет надлежащих центральных командных структур. Решение этой проблемы будет долгим процессом."
