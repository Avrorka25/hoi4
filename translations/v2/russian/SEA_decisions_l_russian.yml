 XIC_war_in_yanan_desc:0 "С наступлением возобновившейся войны в провинции Шэньси это лишь вопрос времени, когда войска Подавляющей Бандитской армии сдадутся и дезертируют. Если мы хотим победить, мы должны нанести удар быстро и решительно."
