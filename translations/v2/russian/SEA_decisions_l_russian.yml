 JAP_state_shinto_in_education_decision:0 "Шинто в образовании"
 JAP_the_co_prosperity_sphere_decisions:0 "Сфера совместного процветания"
 JAP_the_co_prosperity_sphere_decisions_desc:0 "Наша конечная цель – контроль над Азией – сближается, и через формирование паназиатского союза мы можем укрепить связи между различными странами, которые мы стремимся подвести под наши крылья. Мы должны сделать все, что в наших силах, чтобы эта мечта стала реальностью."
