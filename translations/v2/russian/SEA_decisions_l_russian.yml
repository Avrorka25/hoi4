 MEN_coring_state_in_progress:0 " Интеграция государства продолжается."
 greater_hui_state_category:0 "Объединение штатов Хуэй"
 greater_hui_state_category_desc:0 "Китайский мусульманский Хуэй в настоящее время разбросан по всем северо-западным провинциям и в регионе Чжунъюань. Есть много тех, кто желает единого государства, которое может защитить их от военачальничества и иностранной агрессии, и даже дунганы, пантеи и чин-хоу ищут нашей помощи. Мы должны стремиться как можно быстрее объединить наш народ."
