 JAP_spiritual_mobilization_decisions:0 "Духовная мобилизация"
 JAP_spiritual_mobilization_decisions_desc:0 "The [ROOT.GetAdjective] Люди стойки и готовы поддерживать наше правительство в каждом его решении, пока есть достаточная мотивация. Мы должны мобилизовать население, как духовно, так и физически, чтобы вы могли внести свой вклад в военные усилия."
