 SOV_cancel_the_japanese_resource_rights_to_sakhalin_decision:0 "Отменить [JAP.GetAdjective] Ресурсные права на §Y[655.GetName]§!"
 JAP_kodoha_insurgency_decisions:0 "Имперский путь"
 JAP_kodoha_insurgency_decisions_desc:0 "Фракция Кодоха, фракция в нашей Императорской армии, в настоящее время движется против своих врагов, о чем свидетельствует их убийство военного офицера Тецузана Нагаты в августе 1935 года. Если они решат принять меры в более широком масштабе, то это произойдет только после того, как закончится суд над их офицером Айдзавой. Возможно, лучше всего усилить безопасность вокруг определенных людей, которые, по их утверждению, угрожают Кокутаю, душе нашей нации."
 JAP_aizawa_trial_ongoing:0 "Суд над Сабуро Айдзавой продолжается"
 JAP_aizawa_trial_ongoing_desc:0 "Подполковник Сабуро Айзава в настоящее время находится под домашним арестом, пока продолжается его суд по делу об убийстве военного офицера Тецузана Нагаты. Однако, поскольку судебный процесс стал сенсацией для СМИ, когда судьи вступили в сговор со своей фракцией и превратили его в мыльный ящик, из которого можно было бы транслировать их идеологию, ясно, что он не получит никакого ощутимого приговора. Как основной член Кодохи, если группа собирается сделать шаг, они не сделают этого до тех пор, пока домашний арест Айдзавы не закончится."
 JAP_aizawas_trial_over_flag:0 "Суд над Сабуро Айдзавой завершился, и §Y26 февраля Инцидент§! имело место"
 JAP_takahashi_korekiyo_was_killed:0 " Такахаси Корекиё был убит повстанцами"
 JAP_jotaro_watanabe_was_killed:0 " Дзётаро Ватанабе был убит повстанцами"
 JAP_aizawa_trial_ongoing_tt:0 "Результат инцидента решит, какой политический путь мы сможем выбрать."
 JAP_increase_takahashi_korekiyo_security_decision:0 "Повышение безопасности вокруг $JAP_takahashi_korekiyo$"
 JAP_increase_takahashi_korekiyo_security_decision_tt:0 "Безопасность вокруг Такахаси Корекиё будет усилена, чтобы защитить его в случае любых атак армейских радикалов, но в результате они могут перераспределить свой список целей и направить больше сил на то, чтобы уничтожить кого-то другого."
 JAP_will_not_impact_focus_choices_tt:0 "Это не повлияет на выбор фокуса"
 JAP_increase_jotaro_watanabe_security_decision:0 "Повышение безопасности вокруг Джотаро Ватанабе"
 JAP_increase_jotaro_watanabe_security_decision_tt:0 "Безопасность вокруг Джотаро Ватанабе будет усилена, чтобы защитить его в случае любых нападений армейских радикалов, но в результате они могут перераспределить свой список целей и направить больше сил на то, чтобы уничтожить кого-то другого."
 JAP_kwantung_army_decisions:0 "Квантунская армия"
 JAP_kwantung_army_decisions_desc:0 "Наши силы, действующие в Маньчжурии и Китае, Канто-гун, в настоящее время действуют очень автономно и известны тем, что предпринимают действия без одобрения высшего порядка. Первоначально созданные для работы в качестве сил безопасности на арендованной территории Квантунга, они теперь намного превысили свои первоначальные размеры и могут втянуть нас в крупномасштабный конфликт, если мы не возьмем под жесткий контроль ситуацию."
 JAP_kwantung_army_impatience:0 "Армия Квантуна становится нетерпеливой"
 JAP_kwantung_army_impatience_desc:0 "Квантунская армия быстро становится нетерпеливой к нынешнему статус-кво в Китае и, похоже, продолжит расширять свою сферу влияния без одобрения правительства."
 JAP_the_suiyuan_offensive_mission:0 "Суйюаньская кампания"
 JAP_began_the_suiyuan_campaign:0 "Началась Суйюаньская кампания"
 JAP_the_suiyuan_offensive_mission_tt:0 "§Y[ROOT.GetNameDefCap]§! или любой из наших союзников должен захватить §Y[621.GetName]§! или §Y[746.GetName]§! Прежде чем кампания закончится"
 JAP_growing_unrest_in_the_shanghai_concession:0 "Растущие беспорядки в Шанхайской концессии"
 JAP_growing_unrest_in_the_shanghai_concession_desc:0 "После того, как мы сдали нам большие участки земли, кажется, что [CHI.GetAdjective] Жизнь в условиях международной уступки становится все более беспокойной и нетерпеливой по отношению к трусости режима. Они могут попробовать что-то в короткие сроки..."
 JAP_strike_down_chinese_warlord_decision:0 "Забастовка §Y[FROM.GetNameWithFlag]§!"
 JAP_state_shintoism_decisions:0 "Государственный Синтоист"
 JAP_state_shintoism_decisions_desc:0 "Синтоизм был религией японцев, по крайней мере, с периода Яёй, со временем синкретизируясь с дзен-буддизмом. В эпоху Мэйдзи святыни находились под растущим влиянием правительства, и гражданам было предложено поклоняться императору как ками. Благодаря этому теперь мы можем усилить государственный контроль над богослужением и согнуть желания людей к нашим собственным."
 JAP_incorporate_imperial_way_buddhism_decision:0 "Имперский путь буддизм"
