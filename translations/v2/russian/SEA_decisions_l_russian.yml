 greater_mongolia_category:0 "Воссоединение Великой Монголии"
 greater_mongolia_category_desc:0 "Идея воссоединения рассеянного монгольского народа существует со времен Великой Монгольской империи и династии Юань в Китае. Настало время, когда разделенные племена вновь соберутся вместе, чтобы отметить новый рассвет для народа Монголии."
