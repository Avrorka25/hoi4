 CHI_war_in_liangguang_desc:0 "С наступлением войны в провинции Лянгуан это только вопрос времени, пока наши войска не устанут сражаться друг с другом и не пожелают расставить приоритеты перед лицом войны. [JAP.GetAdjective] Угрозы вместе. Если мы хотим победить, мы должны нанести удар быстро и решительно."
