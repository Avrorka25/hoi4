 scientist_trait_r56_reckless_prototyper:0 "Безрассудный прототипист"
 scientist_trait_r56_reckless_prototyper_desc:0 "Быстро учиться на своих ошибках и неудачах, чтобы доставить новейшую итерацию. Все остальные на объекте просто хотят, чтобы они не оставили горящую кучу металлолома после их работы."
 scientist_trait_r56_stubborn:0 "Упрямый руководитель проекта"
 scientist_trait_r56_stubborn_desc:0 "Он упорно держится своего подхода — и к лучшему, и к худшему. Однако проекты часто сдаёт раньше срока и в рамках бюджета."
 scientist_trait_r56_research_focused:0 "Сосредоточен на исследованиях"
 scientist_trait_r56_research_focused_desc:0 "Слишком увлекается исследовательской частью работы, из-за чего весь проект начинает отставать."
 scientist_trait_r56_political_dancer:0 "Политический навигатор"
 scientist_trait_r56_political_dancer_desc:0 "Этот человек всегда знает, что сказать власть имущим, чтобы ему позволили спокойно продолжать работу."
 scientist_trait_r56_old_guard:0 "Старая гвардия"
 scientist_trait_r56_old_guard_desc:0 "Он поддерживает работу в движении, но научить старого пса новым трюкам занимает немного больше времени."
 scientist_trait_r56_SPR_republican_loyalties:0 "Республиканская лояльность"
 scientist_trait_r56_SPR_republican_loyalties_desc:0 "Этот учёный верен республиканскому правительству."
 scientist_trait_r56_SPA_nationalist_sympathies:0 "Националистические симпатии"
 scientist_trait_r56_SPA_nationalist_sympathies_desc:0 "Этот учёный симпатизирует многочисленным националистическим группировкам страны."
