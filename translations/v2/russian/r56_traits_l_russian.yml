l_russian:
 attentive_surgeon:0 "Внимательный хирург"
 attentive_surgeon_desc:0 "§LЭтот человек — квалифицированный врач-хирург, способный выполнять самые сложные задачи даже под огромным давлением. Он заботится о своих товарищах и не остановится ни перед чем, чтобы позаботиться о них.§!"
 caring_leader:0 "Заботливый командир"
 caring_leader_desc:0 "§LЭтот человек искренне заботится о здоровье и относительном комфорте простого солдата. Его подчиненные быстро умеют снова воевать, но эта \"роскошь\" обходится дорого.§!"
 artillerist:0 "Артиллерист"
 artillerist_desc:0 "§LЭтот человек изучал применение артиллерии и знает, как ею пользоваться. Иногда он может злоупотреблять любимым оружием и стрелять чуть больше, чем нужно.§!"
 air_force_ties:0 "Связи с ВВС"
 air_force_ties_desc:0 "§LЭтот человек когда-то служил в ВВС или имеет тесные связи с офицерами ВВС, усиливая координацию между своими войсками и авиацией.§!"
 meticulous:0 "Дотошный"
 meticulous_desc:0 "§LЭтот человек любит проверять каждую минуту детали своих планов и тактики, теряя много времени, но замечая и исправляя мелкие ошибки в процессе.§!"
 obsessed_by_artillery:0 "Одержимый артиллерией"
 obsessed_by_artillery_desc:0 "§LСтрасть этого человека к артиллерии, скорее всего, не имеет предела. Он будет постоянно проверять их работоспособность и настаивать на том, что они должны быть развернуты в любой ситуации, даже когда более быстрая и легкая реакция была бы предпочтительнее.§!"
 decided_planner:0 "Решительный планировщик"
 decided_planner_desc:0 "§LЭтот командир способен быстро разрабатывать операции... но из-за поспешности их общее качество страдает.§!"
 homeland_connoisseur:0 "Знаток родины"
 homeland_connoisseur_desc:0 "§LЭтот человек очень хорошо знает свою родную страну, что позволяет ему пользоваться преимуществами местной местности.§!"
 unpopular:0 "Противоречивая фигура"
 unpopular_desc:0 "§LПротив этого командира сформировалась внутренняя фракция, которая не позволит ему получить более высокий чин. Причиной могут быть враги среди равных или старших чинов, политический характер его назначения или публичные высказывания. К сожалению, его карьера дальше не продвинется.§!"
 funnies_inventor:0 "Изобретатель «забавных машин»"
 funnies_inventor_desc:0 "§LПерси Хобарт прославился созданием узкоспециализированных танков, сведённых в подразделение, которым он командовал лично.§!"
 bad_staffer:0 "Плохой штабист"
 bad_staffer_desc:0 "§LЭтот человек либо плохо подбирает офицеров, либо ему не хватает компетентных советников, либо их обоих. В любом случае это ограничивает его способность командовать большим количеством подразделений.§!"
 walloon:0 "Валлон"
 walloon_desc:0 "§LВ случае распада Бельгии этот командир присоединится к Валлонии.§!"
 flemish:0 "Фламандец"
 flemish_desc:0 "§LВ случае распада Бельгии этот командир присоединится к Фландрии.§!"
 military_governor:0 "Военный губернатор"
 military_governor_desc:0 "§LЭтот командир — специалист по обеспечению законности и поддержанию порядка на оккупированных территориях.§!"
 retraining:0 "Переподготовка"
 retraining_desc:0 "§LЭтот командир проходит дополнительные военные курсы, чтобы улучшить свои командирские навыки.§!"
 front_line_commander:0 "Фронтовой командир"
 front_line_commander_desc:0 "§LЭтот командир привык руководить войсками как можно ближе к линии фронта. Это позволяет ему видеть бой целиком, однако для управления крупными операциями он подходит не лучшим образом. Он склонен к риску, но, несмотря на недостатки, пользуется уважением солдат и коллег.§!"
 jumping_general:0 "Прыгающий генерал"
 jumping_general_desc:0 "§LЭтот командир привык руководить своими десантниками как можно ближе к месту боя, порой буквально прыгая в самое пекло вместе с ними. Это помогает ему следить за сражением, сохранять инициативу и боевой дух войск, но для крупных операций он подходит не лучшим образом. Он склонен к риску, однако бойцы им восхищаются, а коллеги уважают.§!"
 lucky_desc:0 "§LЭтот человек, кажется, был выбран судьбой, его способность выживать в опасных ситуациях еще может быть ему неизвестна, но судьба знает и ждет момента, чтобы тонко помочь ему.§!"
 vigorous:0 "Крепкий"
 vigorous_desc:0 "§LЭтот человек известен своим крепким здоровьем, что делает его выносливым и готовым бороться со своими людьми даже в самых суровых условиях.§!"
 promising:0 "Перспективный"
 promising_desc:0 "Этот человек, кажется, обладает большим талантом и довольно быстро научится основам."
 promising_tooltip:0 "§RЭта черта будет устранена, если лидер достигнет уровня 3.§!"
 fighting_with_at_least_23_units:0 "контролировать хотя бы §H23§! армии"
