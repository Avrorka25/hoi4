 form_peru_bolivia_category_category:0 "Возродить Перуано-Боливийскую конфедерацию"
 form_peru_bolivia_category_category_desc:0 "Большую часть своей истории Перу и Боливия существовали раздельно, однако был короткий период, когда они объединились в единую конфедерацию, способную соперничать с соседями. Теперь, когда обе наши страны вновь находятся под одним флагом, мы можем провозгласить восстановление Перуано-Боливийской конфедерации."
