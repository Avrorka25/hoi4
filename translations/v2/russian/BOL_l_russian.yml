 south_american_events.63.t:0 "Смерть Германа Буша Бесерры"
 south_american_events.63.d:0 "После ожесточенного и непрекращающегося давления СМИ на правительство Бесерры, стало известно, что Герман Буш-Бесерра покончил с собой только сегодня днем. Многие члены его семьи, а также его коллеги говорили, что в поведении Бесерры не было ничего необычного или странного. Тем не менее, это поставило страну в полный шок, и многие политические соперники Бесерры уже борются за власть. Будущее Боливии неопределенно."
 south_american_events.63.a:0 "Выборы должны состояться немедленно!"
 south_american_events.63.b:0 "Создать временное правительство."
