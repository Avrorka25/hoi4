 NIU_memories_from_ww1:0 "Воспоминания о Великой войне"
 NIU_memories_from_ww1_desc:0 "В 1915 году мы отправили контингент из 150 человек сражаться в войне, в которой не имели ни права, ни необходимости участвовать. \nХрабрые [NIU.GetAdjective] солдаты сражались во Франции, но в 1917 году из-за болезней их пришлось отправить домой. С тех пор мы остаёмся на своём острове и не вмешиваемся в иностранные конфликты. И намерены сохранить такое положение. \n\n§YЧтобы убрать этот национальный дух, необходимо создать армию, состоящую из одного батальона.§!"
