l_russian:
 SOV_power_struggle:0 "Борьба за власть после переворота"
 SOV_power_struggle_desc:0 "После переворота вопрос руководства остаётся открытым, и за власть борются несколько фракций: сторонники монархии, фашисты, вернувшиеся из Маньчжурии, и те, кто хочет создать республику на основе левых идеалов. Лишь время покажет, кто победит."
 SOV_imprint_succession_into_law:0 "Закрепить порядок престолонаследия в законе"
 SOV_imprint_succession_into_law_desc:0 "С возвращением царя главной задачей становится раз и навсегда решить вопрос престолонаследия. Многие оспаривали его права, но теперь мы должны положить конец сомнениям и признать его законным государем."
 SOV_purge_splinter_factions:0 "Уничтожить раскольнические монархические фракции"
 SOV_purge_splinter_factions_desc:0 "Монархическое движение далеко от единства: ложные претенденты пытаются превзойти друг друга. Настало время очистить от них наши земли."
 SOV_new_vozhd:0 "Новый вождь"
 SOV_new_vozhd_desc:0 "Константин Родзаевский спасёт страну в эти тревожные времена, и Россия вновь вернёт себе статус сверхдержавы. Единственный человек, способный это сделать, — наш новый вождь."
 SOV_form_the_white_emigres:0 "Сформировать отряды белой эмиграции"
 SOV_form_the_white_emigres_desc:0 "Создав международную группу из бывших русских изгнанников, мы сможем влиять на любые зарубежные конфликты."
 SOV_promote_the_asno_detachment:0 "Продвинуть отряд АСНО"
 SOV_promote_the_asno_detachment_desc:0 "Во время изгнания этот отряд доказал свою ценность как средство разведки. Получив власть, мы сможем полностью использовать его навыки."
 SOV_follow_corportism:0 "Доктрина корпоративизма"
 SOV_follow_corportism_desc:0 "Корпоративизм — единственная устойчивая экономическая модель нового мира. Чтобы вновь сделать Россию великой, необходимо принять её."
 SOV_impose_national_unions:0 "Навязать национальные профсоюзы"
 SOV_impose_national_unions_desc:0 "Чтобы модернизировать промышленность, необходимо предоставить рабочим определённую автономию."
 SOV_reject_cosmopolitanism:0 "Отвергнуть космополитизм"
 SOV_reject_cosmopolitanism_desc:0 "Ужасная философия старой системы должна быть искоренена, поскольку нашей стране она больше не нужна."
 SOV_russian_women_fascist_movement:0 "Русское женское фашистское движение"
 SOV_russian_women_fascist_movement_desc:0 "Женщины столь же важны для новой страны, как и все остальные. Их поддержка принесёт только пользу."
 SOV_commit_to_the_orthodox_church:0 "Поддержать Православную церковь"
 SOV_commit_to_the_orthodox_church_desc:0 "В лучшие времена Православная церковь была могущественной силой. Теперь, после нашего возвращения, мы можем вновь восстановить её положение."
 SOV_union_of_fascist_little_ones:0 "Союз фашистских крошек"
 SOV_union_of_fascist_little_ones_desc:0 "Дети — ценный ресурс современного мира. Начав готовить их сейчас, мы вырастим закалённых взрослых, способных служить стране."
 SOV_all_russian_alligences:0 "Всероссийская верность"
 SOV_all_russian_alligences_desc:0 "Раса, пол и происхождение не имеют значения. По-настоящему важна верность каждого гражданина стране, и все обязаны исполнить свой долг."
 SOV_white_exiles:0 "Интегрировать белых эмигрантов"
 SOV_white_exiles_desc:0 "Некоторые изгнанные офицеры окажутся полезными для укрепления армии. Их верность уже обеспечена, остаётся лишь повысить их."
 SOV_adopt_soviet_policies:0 "Перенять отдельные советские меры"
 SOV_adopt_soviet_policies_desc:0 "Не вся политика прежнего режима была вредной. Некоторые меры действительно помогали стране процветать, и их следует сохранить."
 SOV_orthadox_resurgance:0 "Православное возрождение"
 SOV_orthadox_resurgance_desc:0 "Православная церковь является важным сторонником нашего дела. Следует вновь вкладывать в неё средства."
 SOV_reinstate_royal_exiles:0 "Восстановить титулы царских изгнанников"
 SOV_reinstate_royal_exiles_desc:0 "Теперь мы можем вернуть дворянские титулы тем, кто покинул страну. Им больше не придётся бояться преследований."
 SOV_accept_constituion:0 "Автономия для масс"
 SOV_accept_constituion_desc:0 "Чтобы не повторить прежних ошибок, необходимо дать народу больше самостоятельности, даже если это ослабит власть государства."
 SOV_imperial_legacy:0 "Имперское наследие"
 SOV_imperial_legacy_desc:0 "Россия всегда была экспансионистской державой. После восстановления стабильности мы можем вновь возродить этот дух."
 SOV_peoples_virtue:0 "Добродетель народа"
 SOV_peoples_virtue_desc:0 "В республике именно народ управляет страной, и его добродетель приведёт нас к успеху."
 SOV_solidify_the_provisional_government:0 "Укрепить Временное правительство"
 SOV_solidify_the_provisional_government_desc:0 "Лишь привлекая старых сторонников прежнего либерального режима, мы сможем обеспечить стабильность молодого российского государства. Чтобы гарантировать демократическое будущее страны, необходимо подчеркнуть важность прогрессивных реформ!"
 SOV_hold_emergency_elections:0 "Провести чрезвычайные выборы"
 SOV_hold_emergency_elections_desc:0 "Во время Русской революции 1917 года такие выдающиеся мыслители, как Александр Керенский и Павел Милюков, видели Россию не под коммунистической тиранией и не под железной рукой царя, а полностью независимой республикой, где каждый имеет право голоса. После долгих лет борьбы настало время воплотить эту мечту!"
 SOV_form_solider_committees:0 "Создать солдатские комитеты"
 SOV_form_solider_committees_desc:0 "Переустройство армии на более современную систему управления может оказаться полезным."
 SOV_solider_committees:0 "Солдатские комитеты"
 SOV_solider_committees_desc:0 "Переустройство армии на более современную систему управления может оказаться полезным."
 SOV_the_new_russian_army:0 "Новая русская армия"
 SOV_the_new_russian_army_desc:0 "Армия сыграла огромную роль в освобождении страны от коммунистов, но в истории она также не раз приносила России насилие и тиранию. Чтобы страна стала по-настоящему свободной, вооружённые силы должны находиться под контролем."
 SOV_amnesty_for_political_opponents:0 "Амнистия политическим противникам"
 SOV_amnesty_for_political_opponents_desc:0 "Зачем казнить и арестовывать верных Советам людей, если их навыки ещё могут послужить нам?"
 SOV_rebuild_the_duma:0 "Восстановить Думу"
 SOV_rebuild_the_duma_desc:0 "Созданная императорским указом в 1905 году [ROOT.getAdjective] Дума была лишь подобием свобод, о которых народ мечтал веками. Демократические основы страны станут ещё прочнее, если мы восстановим обе палаты на основе честных и свободных выборов."
 SOV_cultural_autonomy:0 "Культурная автономия"
 SOV_cultural_autonomy_desc:0 "Наша страна огромна и объединяет множество культур от востока до запада. Чтобы дать людям больше свободы, следует позволить им сохранять свои традиции."
 SOV_abolish_death_penalty:0 "Отменить смертную казнь"
 SOV_abolish_death_penalty_desc:0 "Смертная казнь — бесполезный пережиток прошлого, и её следует упразднить."
 SOV_agrarian_socialism:0 "Аграрный социализм"
 SOV_agrarian_socialism_desc:0 "Проведение социальных реформ в промышленности — необходимый шаг к достижению наших целей."
 SOV_verkhovsky_funds:0 "Фонды Верховского"
 SOV_verkhovsky_funds_desc:0 "После долгих лет непрерывных войн и вторжений меньше всего народ ожидает их продолжения. Тем не менее мы должны всегда быть готовы к тяжёлым временам."
 SOV_rebuild_the_republic:0 "Восстановить республику"
 SOV_rebuild_the_republic_desc:0 "Чтобы новая Россия стала процветающей, необходимо вложить огромные усилия в восстановление родины после долгих лет конфликтов."
 SOV_create_a_national_directory:0 "Вновь создать Национальную директорию"
 SOV_create_a_national_directory_desc:0 "Крупный орган, контролирующий и распределяющий денежные средства по стране, поможет экономике расти и создаст дополнительный стимул."
 SOV_purge_religous_beurocracy:0 "Очистить религиозную бюрократию"
 SOV_purge_religous_beurocracy_desc:0 "Хотя полностью упразднять Православную церковь не следует, необходимо ограничить её влияние."
 SOV_pupulisms_guidance:0 "Руководство популизма"
 SOV_new_union_treaty:0 "Новый союзный договор"
 SOV_new_union_treaty_desc:0 "Теперь, когда великая республика укрепилась внутри страны, пора обратить внимание на остальные территории и братские республики. Чтобы восстановить отношения, мы подпишем новый союзный договор и продолжим сосуществовать в одной стране. Впрочем, некоторые могут счесть это предательством."
 SOV_deterrence_treaty:0 "Новый договор о сдерживании"
 SOV_deterrence_treaty_desc:0 ""
 SOV_dissolve_the_treaty_agreement:0 "Расторгнуть союзный договор"
 SOV_dissolve_the_treaty_agreement_desc:0 "Долгие годы конфликтов с другими народами бывшей Российской империи, а затем Советского Союза ясно показали, что Союз не может существовать дальше, особенно учитывая, что большинство этих территорий вошло в него без согласия населения. Ради мира и процветания мы должны предоставить братским республикам полную независимость."
 SOV_autonomy_for_the_west:0 "Автономия для Запада"
 SOV_autonomy_for_the_west_desc:0 ""
 SOV_autonomy_for_the_caucasus:0 "Автономия для Кавказа"
 SOV_autonomy_for_the_caucasus_desc:0 ""
 SOV_autonomy_for_central_asia:0 "Автономия для Средней Азии"
 SOV_autonomy_for_central_asia_desc:0 ""
 SOV_returned_our_territory:0 "Наша территория возвращена"
 SOV_peaceful_liberation:0 "Мирное освобождение"
 SOV_dissolve_the_ussr:0 "Распустить СССР"
 SOV_dissolve_the_ussr_desc:0 "Мы долго помогали братским республикам обрести самоопределение и создать собственные органы власти. Теперь пришло время предоставить им полную независимость и официально распустить прежнюю систему. Для всех нас начинается новая глава."
 SOV_return_russian_industries:0 "Вернуть российскую промышленность"
 SOV_return_russian_industries_desc:0 "За долгие годы мы вложили огромные средства в братские республики. Теперь, когда они идут своим путём, эти инвестиции должны вернуться домой."
 SOV_evacuate_russian_military_assets:0 "Эвакуировать российские военные силы"
 SOV_evacuate_russian_military_assets_desc:0 "Теперь, когда братские республики идут собственным путём, мы можем вывести оттуда войска и сосредоточиться исключительно на родине."
 SOV_support_young_republics:0 "Поддержать молодые республики"
 SOV_support_young_republics_desc:0 "Новым независимым республикам вокруг нас может понадобиться помощь в развитии экономики. Чтобы укрепить отношения, следует оказать им поддержку."
 SOV_industrial_assistance:0 "Российская промышленная помощь"
 SOV_industrial_assistance_desc:0 "Россия направляет нам помощь для развития страны и стабилизации политической обстановки."
 SOV_baltic_freedom:0 "Подлинная свобода Прибалтики"
 SOV_baltic_freedom_desc:0 "Прибалтийские страны нестабильны и слабы. Мы могли бы предложить им защиту в обмен на сотрудничество."
 SOV_polish_autonomy:0 "Предложить сотрудничество Польше"
 SOV_polish_autonomy_desc:0 "Отношения Польши и России всегда были сложными с момента возникновения обеих стран. Возможно, стоит предложить ей союз."
 SOV_move_towards_isolationism:0 "Двигаться к изоляционизму"
 SOV_move_towards_isolationism_desc:0 "Долгие годы конфликтов научили нас, что ни одна война не стоит той цены, которую платит народ. Мы постараемся никогда больше не втягивать русских в бессмысленную войну."
 SOV_the_free_russian_people:0 "ОДКБ"
 SOV_the_free_russian_people_desc:0 "Россия всегда обладала собственной сферой влияния, отдельной от британской и французской. Теперь, избавившись от тиранического прошлого, мы можем заключать союзы с соседями, а не господствовать над ними."
 SOV_emigres_tt:0 "Мы сможем отправлять мощные добровольческие силы"
 SOV_union_of_fascist_little_ones_2:0 "Союз фашистских крошек"
 SOV_russian_women_fascist_movement_2:0 "Русское женское фашистское движение"
 SOV_alligences_tt:0 "Этот фокус усилит либо идею «Русское женское фашистское движение», либо идею «Союз фашистских крошек»"
 SOV_strike_the_eagle:0 "Ударить по орлу"
 SOV_strike_the_eagle_desc:0 "Расширение германского государства необходимо остановить ради Европы, здоровья и будущего нашей страны."
 SOV_civil_war_konev:0 "Восстановление прежнего порядка"
 SOV_civil_war_konev_desc:0 "Теперь, когда война наконец окончена, мы можем восстановить порядок в стране."
 SOV_civil_war_suppress_regional_insurections:0 "Подавить региональные восстания"
 SOV_civil_war_implament_recovery_programs:0 "Ввести программы восстановления"
 SOV_civil_war_implament_recovery_programs_desc:0 "Промышленность страны была разорена войной. Необходимо немедленно начать программы восстановления."
 SOV_civil_war_conduct_mass_arrests:0 "Провести массовые аресты"
 SOV_civil_war_conduct_mass_arrests_desc:0 "В стране всё ещё остаются сторонники несоветских идей. Их необходимо заставить замолчать."
 SOV_civil_war_rehabilitate_military:0 "Восстановить армию"
 SOV_civil_war_rehabilitate_military_desc:0 "Гражданская война вызвала глубокий раскол в организации и верности армии. Мы должны заново укомплектовать и вооружить её."
 SOV_civil_war_empower_khrushchev:0 "Усилить Хрущёва"
 SOV_civil_war_empower_khrushchev_desc:0 "Хрущёв — лучший преемник Сталина. Настало время ему занять своё место и продолжить расширение страны."
 SOV_resotration_tt:0 "Завершение этой ветви вернёт нас к советскому дереву фокусов"
 SOV_ukrainian_reclaimation:0 "Возвращение Украины"
 SOV_reclaim_ukraine:0 "Вернуть Украину"
 free_russian_peoples_faction:0 "ОДКБ"
 SOV_reclaim_polish_overlordship:0 "Восстановить власть над Польшей"
 SOV_reclaim_polish_overlordship_desc:0 "Жалкий Советский Союз позорно потерял все русские владения в Польше. Настало время законному правительству России вернуть Королевство Польское."
 SOV_return_to_the_baltics:0 "Вернуться в Прибалтику"
 SOV_return_to_the_baltics_desc:0 "Россия утвердила влияние в Прибалтике при Петре Великом, когда он повёл русские войска против шведских и польских захватчиков. Двухсотлетнее русское правление завершилось во время Гражданской войны, когда эти страны провозгласили независимость и вышли из нашей сферы влияния. Мы не можем терпеть такое унижение: Прибалтика должна вновь войти в состав империи."
 SOV_solve_the_karelian_question:0 "Решить карельский вопрос"
 SOV_solve_the_karelian_question_desc:0 "Санкт-Петербург, важнейший незамерзающий порт Балтийского моря, постоянно находится под угрозой со стороны незаконной Финляндской республики. Лучше решить этот вопрос, пока преимущество ещё на нашей стороне."
 SOV_reclaim_bessarabia:0 "Вернуть Бессарабию"
 SOV_reclaim_bessarabia_desc:0 "Чёрное море ещё важнее для нашей экономики, чем Балтийское. Мы должны сделать всё возможное, чтобы обеспечить контроль над Босфором и Дарданеллами."
 SOV_rule_over_the_mongols:0 "Покорить монголов"
 SOV_rule_over_the_mongols_desc:0 "Монгольские племена всегда были занозой в боку империи. Только их завоевание позволит защитить Сибирь."
 SOV_crush_our_eastern_rival:0 "Сокрушить восточного соперника"
 SOV_crush_our_eastern_rival_desc:0 "За Амуром расположилась коварная империя, всё ближе подбирающаяся к Китаю и России. Её ненасытная армия постоянно ищет новые земли, призывников и ресурсы. Однажды она придёт за нами, поэтому ради тактического преимущества следует ударить первыми и обезопасить сибирскую границу."
 SOV_our_american_holding:0 "Наше американское владение"
 SOV_our_american_holding_desc:0 "После Крымской войны, в период слабости, мы продали драгоценную Аляску вместе со всеми её ресурсами и землями. Настало время вернуть бывшее владение и восстановить колонии."
 SOV_interventionism_focus:0 "Иностранные интервенции"
 SOV_neutrality_focus:0 "Обратиться внутрь"
 SOV_Brigades:0 "Добровольческие бригады"
 SOV_why_we_fight:0 "Почему мы сражаемся"
 controversial_figurehead:0 "Спорная номинальная фигура"
 new_vozhd:0 "Новый вождь"
 SOV_bypass_tt:0 "Этот фокус будет завершён после победы Керенского в борьбе за власть"
 SOV_czar_flag:0 "Царь победил в борьбе за власть"
 SOV_demo:0 "Российская Федерация"
 SOV_civil_war_power_struggle:0 "Борьба за власть после войны"
 SOV_civil_war_power_struggle_desc:0 "После войны вопрос руководства остаётся открытым, и за власть борются несколько фракций: сторонники монархии, фашисты, вернувшиеся из Маньчжурии, и те, кто хочет создать республику на основе левых идеалов. Лишь время покажет, кто победит."
 SOV_civil_war_in_the_name_of_the_czar:0 "Закрепить порядок престолонаследия в законе"
 SOV_civil_war_in_the_name_of_the_czar_desc:0 "С возвращением царя главной задачей становится раз и навсегда решить вопрос престолонаследия. Многие оспаривали его права, но теперь мы должны окончательно признать его законным государем."
 SOV_civil_war_purge_splinter_factions:0 "Уничтожить раскольнические монархические фракции"
 SOV_civil_war_purge_splinter_factions_desc:0 "Монархическое движение далеко от единства: ложные претенденты пытаются превзойти друг друга. Настало время очистить от них наши земли."
 SOV_civil_war_new_vozhd:0 "Новый вождь"
 SOV_civil_war_new_vozhd_desc:0 "Константин Родзаевский спасёт страну в эти тревожные времена, и Россия вновь вернёт себе статус сверхдержавы. Единственный человек, способный это сделать, — наш новый вождь."
 SOV_civil_war_form_the_white_emigres:0 "Сформировать белую эмиграцию"
 SOV_civil_war_form_the_white_emigres_desc:0 "Создав международную группу из бывших русских изгнанников, мы сможем влиять на любые зарубежные конфликты."
 SOV_civil_war_promote_the_asno_detachment:0 "Продвинуть отряд АСНО"
 SOV_civil_war_promote_the_asno_detachment_desc:0 "Во время изгнания этот отряд доказал свою ценность как средство разведки. Получив власть, мы сможем полностью использовать его навыки."
 SOV_civil_war_follow_corportism:0 "Доктрина корпоративизма"
 SOV_civil_war_follow_corportism_desc:0 "Корпоративизм — единственная устойчивая экономическая модель нового мира. Чтобы вновь сделать Россию великой, необходимо принять её."
 SOV_civil_war_impose_national_unions:0 "Навязать национальные профсоюзы"
 SOV_civil_war_impose_national_unions_desc:0 "Чтобы модернизировать промышленность, необходимо предоставить рабочим определённую автономию."
 SOV_civil_war_reject_cosmopolitanism:0 "Отвергнуть космополитизм"
 SOV_civil_war_reject_cosmopolitanism_desc:0 "Ужасная философия старой системы должна быть искоренена, поскольку нашей стране она больше не нужна."
 SOV_civil_war_russian_women_fascist_movement:0 "Русское женское фашистское движение"
 SOV_civil_war_russian_women_fascist_movement_desc:0 "Женщины столь же важны для новой страны, как и все остальные. Их поддержка принесёт только пользу."
 SOV_civil_war_commit_to_the_orthodox_church:0 "Поддержать Православную церковь"
 SOV_civil_war_commit_to_the_orthodox_church_desc:0 "В лучшие времена Православная церковь была могущественной силой. Теперь, после нашего возвращения, мы можем вновь восстановить её положение."
 SOV_civil_war_union_of_fascist_little_ones:0 "Союз фашистских крошек"
 SOV_civil_war_union_of_fascist_little_ones_desc:0 "Дети — ценный ресурс современного мира. Начав готовить их сейчас, мы вырастим закалённых взрослых, способных служить стране."
 SOV_civil_war_all_russian_alligences:0 "Всероссийская верность"
 SOV_civil_war_all_russian_alligences_desc:0 "Раса, пол и происхождение не имеют значения. По-настоящему важна верность каждого гражданина стране, и все обязаны исполнить свой долг."
 SOV_civil_war_restore_the_republic_desc:0 ""
 SOV_civil_war_secure_the_nation:0 "Обезопасить страну"
 SOV_civil_war_secure_the_nation_desc:0 ""
 SOV_civil_war_white_exiles:0 "Интегрировать белых эмигрантов"
 SOV_civil_war_white_exiles_desc:0 "Некоторые изгнанные офицеры окажутся полезными для укрепления армии. Их верность уже обеспечена, остаётся лишь повысить их."
 SOV_civil_war_adopt_soviet_policies:0 "Перенять отдельные советские меры"
 SOV_civil_war_adopt_soviet_policies_desc:0 "Не вся политика прежнего режима была вредной. Некоторые меры действительно помогали стране процветать, и их следует сохранить."
 SOV_civil_war_orthadox_resurgance:0 "Православное возрождение"
 SOV_civil_war_orthadox_resurgance_desc:0 "Православная церковь является важным сторонником нашего дела. Следует вновь вкладывать в неё средства."
 SOV_civil_war_reinstate_royal_exiles:0 "Восстановить титулы царских изгнанников"
 SOV_civil_war_reinstate_royal_exiles_desc:0 "Теперь мы можем вернуть дворянские титулы тем, кто покинул страну. Им больше не придётся бояться преследований."
 SOV_civil_war_accept_constituion:0 "Автономия для масс"
 SOV_civil_war_accept_constituion_desc:0 "Чтобы не повторить прежних ошибок, необходимо дать народу больше самостоятельности, даже если это ослабит власть государства."
 SOV_civil_war_imperial_legacy:0 "Имперское наследие"
 SOV_civil_war_imperial_legacy_desc:0 "Россия всегда была экспансионистской державой. После восстановления стабильности мы можем вновь возродить этот дух."
 SOV_civil_war_imperial_policy:0 "Имперская политика"
 SOV_civil_war_imperial_policy_desc:0 ""
 SOV_civil_war_strike_the_riech:0 "Ударить по Рейху"
 SOV_civil_war_strike_the_riech_desc:0 ""
 SOV_civil_war_peoples_virtue:0 "Добродетель народа"
 SOV_civil_war_peoples_virtue_desc:0 "В республике именно народ управляет страной, и его добродетель приведёт нас к успеху."
 SOV_civil_war_form_solider_committees:0 "Создать солдатские комитеты"
 SOV_civil_war_form_solider_committees_desc:0 "Переустройство армии на более современную систему управления может оказаться полезным."
 SOV_civil_war_amnesty_for_political_opponents:0 "Амнистия политическим противникам"
 SOV_civil_war_amnesty_for_political_opponents_desc:0 "Зачем казнить и арестовывать верных Советам людей, если их навыки ещё могут послужить нам?"
 SOV_civil_war_cultural_autonomy:0 "Культурная автономия"
 SOV_civil_war_cultural_autonomy_desc:0 "Наша страна огромна и объединяет множество культур от востока до запада. Чтобы дать людям больше свободы, следует позволить им сохранять свои традиции."
 SOV_civil_war_abolish_death_penalty:0 "Отменить смертную казнь"
 SOV_civil_war_abolish_death_penalty_desc:0 "Смертная казнь — бесполезный пережиток прошлого, и её следует упразднить."
 SOV_civil_war_agrarian_socialism:0 "Аграрный социализм"
 SOV_civil_war_agrarian_socialism_desc:0 "Проведение социальных реформ в промышленности — необходимый шаг к достижению наших целей."
 SOV_civil_war_create_a_national_directory:0 "Создать Национальную директорию"
 SOV_civil_war_create_a_national_directory_desc:0 "Крупный орган, контролирующий и распределяющий денежные средства по стране, поможет экономике расти и создаст дополнительный стимул."
 SOV_civil_war_purge_religous_beurocracy:0 "Очистить религиозную бюрократию"
 SOV_civil_war_purge_religous_beurocracy_desc:0 "Хотя полностью упразднять Православную церковь не следует, необходимо ограничить её влияние."
 SOV_civil_war_pupulisms_guidance:0 "Руководство популизма"
 SOV_civil_war_baltic_freedom:0 "Подлинная свобода Прибалтики"
 SOV_civil_war_baltic_freedom_desc:0 "Прибалтийские страны нестабильны и слабы. Мы могли бы предложить им защиту в обмен на сотрудничество."
 SOV_civil_war_polish_autonomy:0 "Предложить сотрудничество Польше"
 SOV_civil_war_polish_autonomy_desc:0 "Отношения Польши и России всегда были сложными с момента возникновения обеих стран. Возможно, стоит предложить ей союз."
 SOV_civil_war_the_free_russian_people:0 "Московское соглашение"
 SOV_civil_war_solve_the_karelian_question:0 "Решить карельский вопрос"
 SOV_civil_war_reclaim_bessarabia:0 "Вернуть Бессарабию"
 SOV_civil_war_reclaim_polish_overlordship:0 "Восстановить власть над Польшей"
 SOV_civil_war_our_american_holding:0 "Наши американские владения"
 SOV_civil_war_crush_our_eastern_rival:0 "Сокрушить восточных соперников"
 SOV_civil_war_rule_over_the_mongols:0 "Покорить монголов"
 SOV_restore_the_triple_entente:0 "Восстановить Тройственную Антанту"
 SOV_restore_the_triple_entente_desc:0 "Мы должны обратиться к западным державам и обеспечить взаимную защиту от сил в Центральной Европе, способных угрожать родине."
 r56.soviet.31.t:0 "Россия предлагает сотрудничество"
 r56.soviet.31.d:0 "Российское правительство предложило защищать суверенитет нашей страны от любых иностранных захватчиков. Новое правительство России показало готовность действовать в наших интересах и пока не проявляло агрессии. Возможно, следует согласиться."
 r56.soviet.31.a:0 "Нам следует сблизиться с Россией ради защиты."
 r56.soviet.31.b:0 "Возможно, мы сможем договориться без полного сближения."
 r56.soviet.31.c:0 "Польша способна защитить себя сама и не нуждается в помощи."
 r56.soviet.33.t:0 "Польша соглашается"
 r56.soviet.33.d:0 "Переговоры завершились успехом: польское правительство согласилось на определённую форму союза, заявив, что это «принесёт пользу обеим странам»."
 r56.soviet.33.a:0 "Превосходно!"
 r56.soviet.34.t:0 "Польша отказывается"
 r56.soviet.34.d:0 "Польские дипломаты отвергли любое предложение о защите, опасаясь, что оно посягнёт на статус независимой страны. Они совершенно не намерены сотрудничать с российскими властями."
 r56.soviet.34.a:0 "Хуже только им."
 r56.soviet.38.t:0 "Приглашение в ОДКБ"
 r56.soviet.38.d:0 "С образованием Организации Договора о коллективной безопасности, [SOV.GetNameDEF] Правительство открыто для защиты своих слабых соседей, они предложили защиту нашей нации. Мы могли бы согласиться, так как это было бы явной выгодой для нас самих."
 r56.soviet.38.a:0 "Это укрепит нашу безопасность."
 r56.soviet.38.b:0 "Мы сами решаем, кому хранить дипломатическую верность."
 r56.soviet.41.t:0 "[FROM.GetNameDefCap] соглашается!"
 r56.soviet.41.d:0 "Дипломаты [FROM.GetName] согласились сотрудничать с нашим правительством, признав дипломатические связи и укрепив отношения."
 r56.soviet.41.a:0 "Превосходно!"
 r56.soviet.42.t:0 "[FROM.GetNameDefCap] отклоняет наше предложение"
 r56.soviet.42.d:0 "Представители [FROM.GetNameDef] отвергли помощь и отказались разговаривать с дипломатами."
 r56.soviet.42.a:0 "Хуже только им."
 r56.soviet.43.t:0 "Кирилл Владимирович скончался"
 r56.soviet.43.d:0 "Сегодня Кирилл Владимирович скончался. После возвращения престола и закрепления порядка наследования в современном российском законодательстве его сын Владимир Кириллович принял мантию государя."
 r56.soviet.43.a:0 "Пусть Владимир Кириллович приведёт нас к славе."
 r56.soviet.44.t:0 "Лев Троцкий скончался"
 r56.soviet.44.d:0 "Неустанно сражавшийся за рабочих и победу мировой революции товарищ Лев Троцкий скончался. Политбюро собралось и избрало его преемником Леонида Серебрякова."
 r56.soviet.44.a:0 "Революция никогда не умрёт!"
 r56.soviet.92.t:0 "Советский ультиматум"
 r56.soviet.92.d:0 "Наше руководство надеялось, что недавний рост влияния Коминформа по всему миру и углубление разрыва между ведущими демократиями и коммунистическими странами оставят [CUB.GetNameDef] в стороне. Недавний доклад, переданный нашему послу в Москве, развеял эти надежды.\n\nСоветский Союз предложил нам место в своём экономическом партнёрстве, которое, по его словам, «будет очень выгодно нам и нашей стране». В обмен он требует помочь в борьбе с «капиталистической угрозой», разрешить свободное перемещение войск и авиации, а при необходимости — аренду военно-морских баз в ближайшем будущем.\n\nОднако предложение сопровождается плохо скрытой угрозой насильственного включения в их блок в случае отказа. Мы можем отклонить его, рассчитывая на поддержку [USA.GetNameDef], если [SOV.getAdjective] сторона решит обострить ситуацию."
 r56.soviet.92.a:0 "Справедливый обмен"
 r56.soviet.92.b:0 "Передайте им, куда они могут засунуть своё проклятое предложение."
 r56.soviet.93.t:0 "Советско-китайский договор"
 r56.soviet.93.d:0 "Даже если [SOV.GetNameDef] и [PRC.GetNameDef] Имеют некоторые разногласия по поводу внешней политики и взаимных союзников, коммунистическая борьба и борьба за крестьянские свободы и независимость рабочих привели обе страны к процветанию до сих пор.\n\nВо второй половине дня советский посол Александр Семёнович Панюшкин вручил нашему посланнику письмо от [SOV.GetLeader] Раскрывая свое стремление к союзничеству и взаимовыгодным экономическим сделкам с нашей страной под эгидой Cominform.\n\nБез [SOV.getAdjective] Мы не смогли бы обеспечить нашу независимость в результате гражданской войны в Китае. Кроме того, дополнительные [SOV.getAdjective] Экономическая, промышленная и научная помощь только поможет преодолеть бремя борьбы за власть последних лет.\n\nКаким будет официальный ответ [PRC.GetLeader]?"
 r56.soviet.93.a:0 "Согласиться на их просьбу"
 r56.soviet.93.b:0 "Вежливо отказаться"
 r56.soviet.94.t:0 "Куба соглашается"
 r56.soviet.94.d:0 "[CUB.getLeader] и его [CUB.GetRulingIdeologyNoun] революционеры успешно перерезали связь между зданием парламента, резиденцией президента и армейскими гарнизонами в черте города. В последней отчаянной попытке королевская гвардия открыла огонь по толпе, но была уничтожена вооружёнными бойцами народной милиции.\n\nТеперь из окон свисают красные флаги, а [CUB.getLeader] произнёс первую речь, объявив о свержении капиталистического правительства и желании [CUB.getName] поддержать наше коммунистическое дело.\n\nНаши дипломаты и специалисты уже направляются на помощь новому западному союзнику."
 r56.soviet.94.a:0 "Это выгодно нам обоим."
 r56.soviet.95.t:0 "Куба отказывается"
 r56.soviet.95.d:0 "После официального прибытия нашего ультиматума в Гавану агенты в [CUB.getName] перестали выходить на связь с Родиной.\n\nСегодня утром [CUB.getLeader] заявил в официальной речи: «В последние дни был раскрыт крупный заговор с целью свержения законного правительства [CUB.GetName], а его главные руководители арестованы. Установлено, что попытка переворота была организована и поддержана агентами [SOV.GetNameDef]».\n\nНаши планы раскрыты. Остался лишь один способ навязать требования [CUB.GetNameDef]."
 r56.soviet.95.a:0 "Тогда подчиним их силой."
 r56.soviet.95.b:0 "Лучше не обострять ситуацию."
 r56.soviet.96.t:0 "Китай соглашается"
 r56.soviet.96.d:0 "С нашей стороны ожидалось, что [PRC.GetNameDef] ратифицирует их [SOV.getAdjective]-[PRC.getAdjective] Договор о взаимной помощи и [PRC.GetName] Мы будем сотрудничать в экономическом и научном партнерстве.\n\nОднако это стало большим сюрпризом для [SOV.getLeader] Помимо официального союза, [PRC.GetName] Кроме того, будут разорваны любые связи с [CHI.GetName] и [JAP.GetName]. \n\n[PRC.getAdjective] делегация во главе с [PRC.getLeader] Он прибудет в Москву через несколько недель, чтобы обсудить экономическое сотрудничество и обмен учеными между нашими странами.\n\nЭтот исторический союз наших великих наций усилит коммунистическое влияние в Юго-Восточной Азии и подвергнет многие территории колониальных держав воздействию Рабочей революции."
 r56.soviet.96.a:0 "Вперёд!"
 r56.soviet.97.t:0 "Китай отказывается"
 r56.soviet.97.d:0 "Незначительные идеологические разногласия и вызывавшая недовольство внешняя политика последних лет, по-видимому, не показались [PRC.getLeader] здоровой основой будущего сотрудничества.\n\nПосле долгого и утомительного телефонного разговора между великими революционерами [PRC.getLeader] был вынужден вежливо отклонить приглашение, заявив, что «[PRC.GetNameDef] и её правительство в нынешних обстоятельствах предпочитают сосредоточиться на внутренней политике и укреплять уже существующие связи».\n\nВозможно, общий враг поможет вернуть уважение и симпатию [PRC.getAdjective] стороны?"
 r56.soviet.97.a:0 "Какая жалость."
 r56.soviet.98.t:0 "Вопрос Балканской федерации"
 r56.soviet.98.d:0 "[SOV.GetNameDef] сообщила о плане снизить напряжённость на Балканском полуострове путём создания Балканской федерации, которая объединит [BUL.GetNameDef], [ROM.GetNameDef], [GRE.GetNameDef] и [ALB.GetNameDef] под руководством [YUG.GetNameDef] на принципах интернационализма, социализма, общественной солидарности и экономического равенства. Взамен нам предлагают союз под знаменем Коминформа."
 r56.soviet.98.a:0 "Согласиться"
 r56.soviet.98.b:0 "Отказаться"
 r56.soviet.99.t:0 "Югославия соглашается"
 r56.soviet.99.d:0 "Югославия согласилась с планом Балканской федерации и гордо объявила нашим дипломатам об укреплении дружбы между [SOV.GetLeader] и [YUG.GetLeader]."
 r56.soviet.99.a:0 "Замечательно."
 r56.soviet.101.t:0 "Югославия отказывается"
 r56.soviet.101.d:0 "Югославия отвергла план Балканской федерации. На пресс-конференции следующим утром [YUG.GetLeader] заявил: «Югославия пойдёт собственным путём без какого-либо иностранного вмешательства во внутреннюю политику»."
 r56.soviet.101.a:0 "Прискорбно."
 r56.soviet.102.t:0 "[FROM.GetNameDefCap] предлагает восстановить Тройственную Антанту"
 r56.soviet.102.d:0 "Дипломаты [FROM.GetNameDefCap] обратились к нам с предложением восстановить Тройственную Антанту и пообещали взаимную защиту."
 r56.soviet.102.a:0 "Рады вновь видеть их на нашей стороне."
 r56.soviet.102.b:0 "В прошлый раз это закончилось не слишком хорошо."
 SOV_trotskyite_victory:0 "Победа троцкистов"
 SOV_trotskyite_victory_desc:0 "Свергнув тирана Иосифа Сталина и очистив страну от его приспешников и жалких подхалимов, мы наконец можем начать перестраивать Советский Союз по образцу, которым гордились бы Ленин и Маркс. Это будет нелегко, но объединённая сила рабочих справится с задачей!"
 SOV_solidify_internal_control:0 "Укрепить внутренний контроль"
 SOV_solidify_internal_control_desc:0 "Мы сделали первые шаги к установлению жёсткого контроля над страной, беспощадно очистив её от опасных элементов сталинского режима. Теперь необходимо заменить снятых с должностей людьми, лояльными новому руководству."
 SOV_initial_reforms:0 "Первые реформы"
 SOV_initial_reforms_desc:0 "Культ личности Сталина глубоко укоренился в обществе, поэтому советское общество необходимо перестроить с самого основания. Это потребует времени и усилий, но начать можно с пересмотра политики, не соответствующей новому курсу Советского Союза."
 SOV_industrial_strategy:0 "Реорганизация промышленности"
 SOV_industrial_strategy_desc:0 "Хотя сама идея пятилетнего плана выглядит разумной, недостатки его исполнения сталинским режимом хорошо известны, даже если до сих пор о них не говорили открыто. При новом руководстве мы должны проверить каждый аспект пятилетнего плана, выявить слабые места и уничтожить их, как любого другого врага Союза."
 SOV_begin_destalinization:0 "Начать десталинизацию"
 SOV_begin_destalinization_desc:0 "Иосиф Сталин годами создавал культ собственной личности среди народов Советского Союза. Чтобы распространить по миру подлинные социалистические ценности, необходимо устранить все остатки его обанкротившегося режима. Мы сотрём его наследие со страниц истории."
 SOV_trotskyite_narrative:0 "Троцкистское повествование"
 SOV_trotskyite_narrative_desc:0 "Покойный тиран Сталин кормил народ ложью и клеветой. Мы поручим министерствам донести правдивую историю нашего лидера Льва Троцкого. Все граждане должны знать, каким неправедным путём Сталин пришёл к власти и что истинным наследником Ленина в Советском Союзе был именно Лев Троцкий."
 SOV_our_hero_our_saviour:0 "Наш герой, наш спаситель"
 SOV_our_hero_our_saviour_desc:0 "О борьбе нашего великого вождя должен узнать каждый! Героизм Льва Троцкого наполнит кинотеатры, плакаты, страницы газет и книг. Все смогут озариться светом подлинной истории нашего спасителя Льва Троцкого."
 SOV_conduct_nationwide_inspections:0 "Провести общенациональные проверки"
 SOV_conduct_nationwide_inspections_desc:0 "После первоначального анализа исполнения пятилетнего плана при Сталине необходимо отдельно проверить каждую затронутую им отрасль. Наши неутомимые инспекторы изучат каждый завод, перерабатывающий центр и железную дорогу, чтобы удостовериться в соответствии установленным стандартам."
 SOV_recalibration_of_quotas:0 "Пересмотреть квоты"
 SOV_recalibration_of_quotas_desc:0 "Троцкистскому руководству ясно, что Сталин предпочитал устанавливать нереалистичные нормы, ухудшая качество и достоверность отчётности не только заводов, но и всех отраслей, затронутых пятилетним планом. Снижение квот до реалистичного и достижимого уровня даст более точные данные и спасёт человеческие жизни."
 SOV_localized_quality_control:0 "Местный контроль качества"
 SOV_localized_quality_control_desc:0 "При тираническом режиме Сталина качество материалов, техники и оружия варьировалось от ужасающего до едва приемлемого. Проверяя каждый завод раз в полгода и вводя единые стандарты контроля качества по всей стране, мы обеспечим стабильность производства."
 SOV_status_of_labour_unions:0 "Статус профсоюзов"
 SOV_status_of_labour_unions_desc:0 "Неспособность Сталина использовать власть рабочего класса через профсоюзы ясно видна любому наблюдателю. Мы должны превратить этот класс из жертв государства в локомотив, который помогает коллективному благу нашей нации."
 SOV_enshrine_labour_unions:0 "Закрепить профсоюзы"
 SOV_enshrine_labour_unions_desc:0 "Мы нарисуем славную картину рабочего класса для всех. Профсоюзы являются достоянием нации и не должны становиться жертвами плохого обращения со стороны государства. Скорее, они должны быть закреплены, любимы и взращены государством за их усилия по содействию перманентной революции!"
 SOV_nationalization_of_labour_unions:0 "Национализация профсоюзов"
 SOV_nationalization_of_labour_unions_desc:0 "Предоставив профсоюзам истинное место в нашей социалистической утопии, пришло время полностью интегрировать их в государственный аппарат. Они будут коллективизированы и управляться государством для большего блага Советского Союза!"
 SOV_siberian_railnetworks:0 "Улучшить сибирские железные дороги"
 SOV_siberian_railnetworks_desc:0 "Наша огромная восточная граница защищена недостаточно. Следует направить больше ресурсов и расширить железные дороги Сибири, обеспечив войска на востоке снабжением и мобильностью."
 SOV_improve_western_railnetworks:0 "Улучшить западные железные дороги"
 SOV_improve_western_railnetworks_desc:0 "Железнодорожная линия Ленинград—Москва является главной артерией между двумя крупнейшими промышленными центрами. Её модернизация должна стать первоочередной задачей!"
 SOV_Improve_TransSiberian_Railway:0 "Улучшить Транссибирскую магистраль"
 SOV_Improve_TransSiberian_Railway_desc:0 "Следует продолжить развитие железных дорог, связывающих восток и запад страны, включая Транссибирскую магистраль и прилегающие линии. Для обороны необходимо эффективно перевозить снабжение и другие грузы через всю страну."
 SOV_Siberian_Industry:0 "Развивать промышленность Сибири"
 SOV_Siberian_Industry_desc:0 "Сибирский промышленный регион расположен далеко от границ и потому является идеальным местом для строительства заводов и развития новых технологий."
 SOV_Develop_Vladivstok:0 "Развивать Владивосток"
 SOV_Develop_Vladivstok_desc:0 "Владивосток — наше окно в Тихий океан. Чтобы защитить тыл, город необходимо расширить и серьёзно укрепить."
 SOV_industrial_cities:0 "Создать дополнительные промышленные города"
 SOV_industrial_cities_desc:0 "Россия всегда считалась аграрной державой. Это должно измениться: правительство утвердило новый план создания множества промышленных центров и сетей закрытых городов по всей нашей великой Родине."
 SOV_steel_industry_improvements:0 "Улучшить сталелитейную промышленность"
 SOV_steel_industry_improvements_desc:0 "Наша быстро растущая промышленность зависит от множества ресурсов, и сталь не исключение. К счастью, несколько геологических исследований обнаружили крупные залежи железной руды вдоль Уральских гор. Мы должны воспользоваться этим открытием."
 SOV_Invest_in_Engineering:0 "Инвестировать в инженерное дело"
 SOV_Invest_in_Engineering_desc:0 "«Чтобы иметь больше, необходимо больше производить. Чтобы больше производить, необходимо больше знать». Эти слова должны характеризовать каждого члена нашего рабочего общества!"
 SOV_urbanization:0 "Принудительная урбанизация"
 SOV_urbanization_desc:0 "Государство лучше знает, где будут жить люди, трудящиеся и крестьянские хозяйства. Переселение больших масс людей по всей стране может быть трудным, но это, безусловно, окупится в будущем, не так ли?"
 SOV_Social_Welfare:0 "Социальное обеспечение"
 SOV_Social_Welfare_desc:0 "Современному индустриальному обществу требуется современная система социальной защиты. Она включает право граждан на достойную пенсию, медицинское страхование и оплачиваемый больничный."
 SOV_Education_Initiative:0 "Образовательная инициатива"
 SOV_Education_Initiative_desc:0 "В большинстве стран правящая элита удерживает рабочих в подчинении, лишая их доступа к образованию. Наш народ не должен знать подобных преград."
 SOV_Mass_Immunizations_2:0 "Массовая иммунизация"
 SOV_Mass_Immunizations_2_desc:0 "Угроза заболеваний может оказаться губительной для населения страны. Необходимо принять меры, чтобы этого не произошло."
 SOV_rocket_focus:0 "Ракетные эксперименты"
 SOV_rocket_focus_desc:0 "Попробуем установить ускорители на самолёты и выяснить, дадут ли они преимущество. Эти новые двигатели сложны в производстве, но обладают выдающимся потенциалом."
 SOV_nuke_focus:0 "Лаборатория № 2"
 SOV_nuke_focus_desc:0 "Недавние исследования Игоря Курчатова дали многообещающие результаты в разработке нового типа оружия. Эта технология может стать весомым аргументом при установлении подходящего нам мирового порядка."
 SOV_further_the_progress_cult:0 "Развивать культ прогресса"
 SOV_further_the_progress_cult_desc:0 "И всё же мы стоим на вершине цивилизации, на пике прогресса, у предела человеческих возможностей. Мы возьмём за руку Матушку-науку и вместе, как единое целое, последуем за ней в светлое будущее!"
 SOV_move_capital_to_sverdlovsk:0 "Перенести столицу в Свердловск"
 SOV_move_capital_to_sverdlovsk_desc:0 "Кремль может находиться в руках врага, но вера и доверие народа остаются с нами. Мы продолжим борьбу из новой столицы на Урале. Никогда не сдаваться!"
 SOV_bt7_development:0 "Разработка БТ-7"
 SOV_bt7_development_desc:0 "Харьковское конструкторское бюро машиностроения имени Морозова — перспективное предприятие, основанное в 1927 году и уже предоставившее оружейной промышленности проекты лёгких танков Т-12 и Т-24. Дополнительное финансирование обеспечит его верность и может дать нам новое поколение бронетехники."
 SOV_improve_our_naval_doctrine:0 "Улучшить военно-морскую доктрину"
 SOV_improve_our_naval_doctrine_desc:0 "Недавно расширенному флоту требуются умелые командиры и современная тактика. К счастью, два наших адмирала — Николай Кузнецов и Александр Немитц — уже работают над этим вопросом."
 SOV_into_the_plateau:0 "На плато"
 SOV_into_the_plateau_desc:0 "В 1895 году распадающаяся Российская империя подписала протоколы Памирской разграничительной комиссии, фактически перераспределив российскую и британскую сферы влияния в Средней Азии. Наша славная страна не будет считаться с этими устаревшими договорами. Создание нового фронта в Тибете также откроет Индию для Рабочей революции!"
 SOV_world_revolution:0 "Мировая революция"
 SOV_world_revolution_desc:0 "Настало время воплотить видение Маркса о мировой социалистической республике. С нашей помощью рабочие мира наконец сбросят цепи, правящие классы будут свергнуты, а угнетение останется далёким воспоминанием. Пролетарии всех стран, соединяйтесь!"
 SOV_state_of_perpetual_warfare:0 "Состояние вечной войны"
 SOV_state_of_perpetual_warfare_desc:0 "Мы не можем позволить, чтобы продвижение к цели замедлялось, и добьёмся её любыми средствами. Каждая секунда бездействия лишь продлевает рабство и страдания рабочего класса."
 SOV_a_gun_in_every_hand:0 "Оружие в каждые руки"
 SOV_a_gun_in_every_hand_desc:0 "Как говорил сам Маркс: «Ни под каким предлогом нельзя сдавать оружие и боеприпасы. Любая попытка разоружить рабочих должна быть сорвана... при необходимости силой»."
 SOV_workers_of_the_world_unite:0 "Пролетарии всех стран, соединяйтесь"
 SOV_workers_of_the_world_unite_desc:0 "Народы мира сражаются за общее дело. Революцию не остановят языковые, географические или государственные границы. Только тогда мы сможем создать мировую социалистическую республику."
 SOV_strike_the_gaint:0 "Ударить по гиганту"
 SOV_strike_the_gaint_desc:0 ""
 SOV_form_a_fifth_column:0 "Сформировать пятую колонну"
 SOV_form_a_fifth_column_desc:0 "Очевидно, что Иосиф Сталин — лишь жестокий угнетатель нашего народа. Настало время устранить его от власти любыми необходимыми средствами. Чтобы добиться успеха, нужно действовать быстро, пока наши намерения не раскрыты."
 SOV_counter_coup:0 "Контрпереворот"
 SOV_counter_coup_desc:0 "Теперь, когда террор Сталина наконец завершён, следует признать: замена его Троцким сделает всю борьбу за свободу бессмысленной. Истинной причиной страданий был не только Сталин, но и сам социализм!"
 SOV_poor_railnetworks_tt:0 "§RИз-за чрезмерной нагрузки на железнодорожную сеть периодически будет происходить замедление промышленности.§!"
 SOV_trotskyit_plot_tt:0 "§RЕсли своевременно не решить политическую проблему, страна погрузится в гражданскую войну.§!"
 SOV_revolutionized_industry_ghost_tt:0 "§WЧтобы §!§Gубрать§!§W эту идею, необходимо §!§Yпродвигаться§! §Wпо текущей промышленной программе.§!"
 SOV_revolutionized_industry_tt:0 "§RЗавершение§! §Yфокусов§!, §Rиспользующих промышленные ресурсы, увеличивает длительность действия этой идеи.§!"
 SOV_social_welfare_focus:0 "Социальное обеспечение"
 SOV_social_welfare_focus_desc:0 "Необходимо финансировать программы помощи бедным семьям, больным рабочим и пожилым гражданам."
 SOV_low_literacy_rate_idea:0 "Низкий уровень грамотности"
 SOV_invest_in_engineering_focus:0 "Инвестиции в инженерное дело"
 SOV_invest_in_engineering_focus_desc:0 "Индустриализация [SOV.GetName] требует масштабных государственных вложений в разработку лучших инструментов, транспортных средств и научных методов."
 SOV_urbanization_focus:0 "Урбанизация"
 SOV_urbanization_focus_desc:0 "Быстрый рост городов требует более качественного планирования и эффективной инфраструктуры, и обе задачи успешно решаются."
 SOV_urbanization_focus_debuff:0 "Принудительное переселение"
 SOV_urbanization_focus_debuff_desc:0 "Требования свободы передвижения, демонстрации и протесты против политики принудительного переселения и расселения вредят общественному образу действующего правительства."
 SOV_poor_railnetworks_0:0 "Слабая железнодорожная сеть"
 SOV_poor_railnetworks_0_desc:0 "Растущая промышленность перегружает недостаточно развитую железнодорожную сеть."
 SOV_poor_railnetworks_1:0 "Слабая железнодорожная сеть"
 SOV_poor_railnetworks_1_desc:0 "Растущая промышленность перегружает недостаточно развитую железнодорожную сеть."
 SOV_poor_railnetworks_2:0 "Слабая железнодорожная сеть"
 SOV_poor_railnetworks_2_desc:0 "Растущая промышленность перегружает недостаточно развитую железнодорожную сеть."
 SOV_revolutionized_industry_ghost:0 "Революционная промышленность"
 SOV_revolutionized_industry_ghost_desc:0 "Мы стремительно индустриализируем великую страну, хотя порой цена этого оказывается высокой."
 SOV_revolutionized_industry_1:0 "Революционная промышленность"
 SOV_revolutionized_industry_1_desc:0 "Мы стремительно индустриализируем великую страну, хотя порой цена этого оказывается высокой."
 SOV_revolutionized_industry_2:0 "Революционная промышленность"
 SOV_revolutionized_industry_2_desc:0 "Мы стремительно индустриализируем великую страну, хотя порой цена этого оказывается высокой."
 SOV_industry_slow_down:0 "Замедление промышленности"
 SOV_industry_slow_down_desc:0 "Из-за серьёзных задержек на железных дорогах материалы и рабочие не прибыли на строительные площадки и заводы вовремя."
 SOV_risk_of_disease:0 "Риск заболевания"
 SOV_risk_of_disease_desc:0 "Среди чиновников и населения распространены опасения, что программы урбанизации приведут к крупным вспышкам инфекционных заболеваний. Но разве подобные страхи не бессмысленны?\nЗавершение фокуса §H«Массовая иммунизация»§! предотвратит дальнейшие эпидемии."
 SOV_proliferation_of_disease:0 "Распространение заболеваний"
 SOV_proliferation_of_disease_desc:0 "Рост числа заболевших показывает, что без своевременного решения проблемы может начаться полномасштабная эпидемия. Если засекретить случаи, общественность ведь ничего не узнает, верно?\nЗавершение фокуса §H«Массовая иммунизация»§! предотвратит дальнейшие эпидемии."
 SOV_widespread_outbreaks:0 "Массовые вспышки"
 SOV_widespread_outbreaks_desc:0 "Многие города и сельские районы не справляются с продолжающейся эпидемией без прямого вмешательства правительства. Специалисты требуют немедленно запустить государственную программу массовой иммунизации, прежде чем положение ухудшится ещё сильнее.\nЗавершение фокуса §H«Массовая иммунизация»§! предотвратит дальнейшие эпидемии."
 SOV_engineering_push:0 "Промышленный рывок"
 SOV_engineering_push_desc:0 "Пропаганда, поощряющая стахановское движение во всех его формах, успешно приносит плоды."
 SOV_poorly_educated_population:0 "Низкий уровень грамотности"
 SOV_poorly_educated_population_desc:0 "Общий уровень образования населения растёт медленнее промышленности. Это уже начинает вредить технологическому прогрессу и военно-воздушным силам."
 progress_cult_focus_2:0 "Культ прогресса"
 progress_cult_focus_2_desc:0 "Образование для масс — ни одного неграмотного!"
 SOV_transpolar_flights_idea:0 "Продолжающиеся трансполярные перелёты"
 SOV_transpolar_flights_idea_desc:0 "[SOV.GetAdjective] лётчики-первопроходцы ищут более безопасные и выгодные полярные воздушные маршруты."
 SOV_socialism_in_one_country_idea:0 "Социализм в одной стране"
 SOV_socialism_in_one_country_idea_desc:0 "Рабочая революция не сможет победить без внешней помощи. Чтобы помогать рабочим за рубежом, мы должны быть уверены, что наши собственные рабочие полностью принимают коммунизм."
 SOV_world_revolution_idea:0 "Мировая революция"
 SOV_world_revolution_idea_desc:0 "Ограничение революции одной страной уничтожит надежду в сердцах угнетённых крестьян и рабочих за рубежом. Народы [SOV.GetName] будут поддерживать революцию повсюду!"
 SOV_state_of_perpetual_warfare_idea:0 "Состояние вечной войны"
 SOV_state_of_perpetual_warfare_idea_desc:0 "Борьба за Рабочую революцию будет охватывать мир до тех пор, пока каждый не поддержит коммунизм!"
 SOV_a_gun_in_every_hand_idea:0 "Оружие в каждые руки"
 SOV_a_gun_in_every_hand_idea_desc:0 "И каждый человек — король"
 officers_purged_civil_war:0 "Офицеры оппозиции подвергнуты чистке"
 officers_purged_civil_war_desc:0 "Мы очистили ряды от офицеров и чиновников, которых подозревали в симпатиях к оппозиции."
 SOV_workers_of_the_world_unite_idea:0 "Пролетарии всех стран, соединяйтесь!"
 SOV_workers_of_the_world_unite_idea_desc:0 "Освобождение рабочих на освобождённых территориях усилит нашу поддержку среди эмансипированного населения."
 r56_nkvd_cleanup:0 "Перестановки в НКВД"
 r56_nkvd_cleanup_desc:0 "Массовые аресты руководства НКВД наконец начали рассеивать атмосферу паранойи в правительстве и любимом Советском Союзе. Однако стране потребуется время, чтобы залечить раны Великих чисток, а нам следует сохранять бдительность из-за возможных пробелов в безопасности после ослабления разведывательных служб."
 SOV_internal_chaos_1:0 "Внутренний хаос"
 SOV_internal_chaos_1_desc:0 "Последствия недавних чисток почти преодолены, а политическая и военная лояльность новому руководству обеспечена."
 SOV_internal_chaos_2:0 "Внутренний хаос"
 SOV_internal_chaos_2_desc:0 "Мы постепенно укрепляем контроль правительства над страной."
 SOV_internal_chaos_3:0 "Внутренний хаос"
 SOV_internal_chaos_3_desc:0 "Стремительные чистки, проведённые правительством [SOV.GetLeader], оставили глубокие раны в политической системе и командной структуре."
 SOV_nationwide_inspections_1:0 "Общенациональные проверки"
 SOV_nationwide_inspections_1_desc:0 "Огромные объёмы ресурсов и множество специалистов направлены на проведение длительных проверок."
 SOV_destalinization:0 "Десталинизация"
 SOV_destalinization_desc:0 "Иосиф Сталин годами создавал культ собственной личности среди народов Советского Союза. Чтобы распространить по миру подлинные социалистические ценности, необходимо устранить все остатки его обанкротившегося режима. Мы сотрём его наследие со страниц истории."
 SOV_quality_control:0 "Местный контроль качества"
 SOV_quality_control_desc:0 "При тираническом режиме Сталина качество материалов, техники и оружия варьировалось от ужасающего до едва приемлемого. Проверяя каждый завод раз в полгода и вводя единые стандарты контроля качества по всей стране, мы обеспечим стабильность производства."
 SOV_status_of_labour_unions_idea:0 "Усиленные профсоюзы"
 SOV_status_of_labour_unions_idea_desc:0 "Неспособность Сталина использовать власть рабочего класса через профсоюзы ясно видна любому наблюдателю. Мы должны превратить этот класс из жертв государства в локомотив, который помогает коллективному благу нашей нации."
 r56.soviet.1.t:0 "Промышленный отчёт Госплана за 1935 год"
 r56.soviet.1.d:0 "Госплан рад сообщить Центральному комитету, что текущий пятилетний план по-прежнему выполняется с опережением графика! За прошлый год мы добились огромных успехов в производстве стали, превзойдя многие другие страны. Также выросла добыча нефти и угля.\nГосплан превращает нашу великую страну из крестьянской в промышленную державу, способную соперничать с капиталистическими мерзавцами Запада! Однако у Госплана есть вопрос к Центральному комитету: следует ли и дальше уделять основное внимание производственным показателям или направить часть ресурсов на расширение гражданской промышленности?"
 r56.soviet.1.a:0 "Сохранить упор на производственные показатели."
 r56.soviet.1.b:0 "Перенаправить усилия на развитие гражданской промышленности."
 r56.soviet.2.t:0 "Замедление железнодорожных перевозок"
 r56.soviet.2.d:0 "Госплан сообщает, что задержки на железных дорогах мешают своевременно выполнять производственные квоты и поставки, вызывая общее замедление производства. Нынешняя железнодорожная система не справляется с масштабом промышленности и объёмом перевозимых грузов."
 r56.soviet.2.a:0 "Отговорки."
 r56.soviet.3.t:0 "Новые задержки на железных дорогах"
 r56.soviet.3.d:0 "Госплан сообщает, что задержки на железных дорогах по-прежнему мешают своевременно выполнять производственные квоты и поставки, вызывая общее замедление производства. Нынешняя система не справляется с масштабом промышленности и объёмом грузов. Госплан рекомендует как можно скорее улучшить железные дороги."
 r56.soviet.3.a:0 "Неужели так трудно заставить поезда ходить по расписанию?"
 r56.soviet.4.t:0 "Новые задержки на железных дорогах"
 r56.soviet.4.d:0 "Госплан сообщает, что задержки на железных дорогах по-прежнему мешают своевременно выполнять производственные квоты и поставки, вызывая общее замедление производства. Более того, положение продолжает ухудшаться. Нынешняя система не справляется с масштабом промышленности и объёмом грузов. Госплан рекомендует как можно скорее улучшить железные дороги, поскольку проблемы наверняка повторятся."
 r56.soviet.4.a:0 "Это неприемлемо."
 r56.soviet.5.t:0 "Очередные задержки на железных дорогах"
 r56.soviet.5.d:0 "Госплан сообщает, что задержки на железных дорогах по-прежнему мешают своевременно выполнять производственные квоты и поставки, вызывая общее замедление производства. Положение продолжает ухудшаться: железнодорожная система не справляется с масштабом промышленности и объёмом грузов. Госплан рекомендует как можно скорее исправить ситуацию, иначе проблема повторится."
 r56.soviet.5.a:0 "Это тот же отчёт, что и в прошлый раз. Вы просто поменяли дату."
 r56.soviet.6.t:0 "Задержки на железных дорогах продолжаются"
 r56.soviet.6.d:0 "В пятый раз Госплан сообщает, что задержки на железных дорогах по-прежнему мешают своевременно выполнять производственные квоты и поставки, вызывая общее замедление производства. Положение продолжает ухудшаться, а система не справляется с масштабом промышленности и объёмом грузов. Госплан снова рекомендует как можно скорее её улучшить."
 r56.soviet.6.a:0 "Хватит! Кого-нибудь из Госплана расстреляют!"
 r56.soviet.7.t:0 "Железные дороги замедляют производство"
 r56.soviet.7.d:0 "В шестой раз Госплан сообщает, что задержки на железных дорогах по-прежнему мешают своевременно выполнять производственные квоты и поставки, вызывая общее замедление производства. Положение продолжает ухудшаться, а система не справляется с масштабом промышленности и объёмом грузов. Госплан рекомендует как можно скорее улучшить железные дороги."
 r56.soviet.7.a:0 "Хватит говорить о железных дорогах!"
 r56.soviet.8.t:0 "Задержки на железных дорогах парализуют производство"
 r56.soviet.8.d:0 "В седьмой раз Госплан сообщает, что задержки на железных дорогах по-прежнему мешают своевременно выполнять производственные квоты и поставки, вызывая общее замедление производства. Положение продолжает ухудшаться, а система не справляется с масштабом промышленности и объёмом грузов. Госплан снова рекомендует как можно скорее улучшить железные дороги."
 r56.soviet.8.a:0 "Железные дороги всё равно глупость."
 r56.soviet.9.t:0 "Сообщается о вспышках заболеваний"
 r56.soviet.9.d:0 "Похоже, наши города охвачены вспышками множества смертельных болезней. Врачи рекомендуют немедленно провести общенациональную массовую иммунизацию, пока положение не ухудшилось."
 r56.soviet.9.a:0 "Тревожное развитие событий."
 r56.soviet.11.t:0 "Эпидемии усиливаются"
 r56.soviet.11.d:0 "Без принятия мер вспышки, охватившие нашу великую страну, продолжают усиливаться. Затронут почти каждый крупный городской центр, а ущерб экономике невозможно измерить."
 r56.soviet.11.a:0 "Тревожное развитие событий."
 r56.soviet.16.t:0 "Сроки пятилетнего плана сорваны"
 r56.soviet.16.d:0 "Госплан сообщил, что текущий пятилетний план отстаёт от графика. Хотя изначально промышленная программа шла с опережением, мы потеряли темп и не уложились в установленный партией срок. Это повлияло и на будущие промышленные усилия. Для Коммунистической партии это позор."
 r56.soviet.16.a:0 "Приведите ко мне ответственного."
 r56.soviet.16.b:0 "Просто продлите срок — все совершают ошибки."
 r56.soviet.18.t:0 "Ежов формирует коалицию для свержения [ROOT.GetLeader]"
 r56.soviet.18.d:0 "С момента прихода к власти в 1924 году [ROOT.GetLeader] постоянно устраняет любую политическую оппозицию своему правлению над [SOV.GetNameDef]. Зиновьев, Бухарин, Троцкий и Киров уже стали жертвами борьбы за власть либо были вынуждены скрываться от агентов НКВД. Гнев генсека может обрушиться на любого, кто слишком быстро или слишком медленно продвигается по партийной лестнице.\n\nНиколай Ежов начал опасаться, что его положение в НКВД находится под угрозой и [ROOT.GetLeader] может снять его с должности или поступить ещё хуже. Теперь он использует мероприятия по выявлению врагов народа как прикрытие для вербовки офицеров и чиновников в заговор с целью свергнуть Сталина."
 r56.soviet.18.a:0 "Нужно действовать быстро."
 r56.soviet.19.t:0 "Агенты НКВД связались с Троцким"
 r56.soviet.19.d:0 "Изгнанный с Родины и забытый простыми людьми с февраля 1929 года Лев Троцкий остаётся одним из главных идеологических противников сталинского правления над [SOV.GetNameDef]. Его проповеди о притеснении рабочего класса уже сделали его персоной нон грата в [TUR.GetNameDef], [ITA.GetNameDef], [FRA.GetNameDef] и, наконец, в [NOR.GetNameDef], где он жил с 1935 года.\n\nНедавнее письмо было перехвачено агентами НКВД, которые связались с Троцким и теперь тайно переправляют его обратно в Россию. Это потребует времени: необходимо избежать обнаружения иностранными агентами и сторонниками [ROOT.GetLeader]. Возвращение Троцкого придаст перевороту столь необходимую легитимность и опытное руководство."
 r56.soviet.19.a:0 "Засекретить операцию."
 r56.soviet.20.t:0 "Андрей Власов предлагает дополнительную помощь"
 r56.soviet.20.d:0 "Ожидалось, что формирование Пятой колонны не может оставаться в тайне, однако слухи о столь быстром распространении сюжета также не предвосхищались. Наши агенты сообщают о том, что многие письма поддержки приходят в офис Ежова из анонимных источников. Письма одного из писем были признаны одним из сотрудников нашего комиссариата принадлежащими выдающемуся молодому генералу Андрею Власову. Его немедленно вызвали в Москву для обсуждения продолжающейся операции по свержению диктатора Сталина.\n\nКогда НКВД пригласили Власова на небольшое заседание, он, казалось, проявил большой интерес к нашему сюжету и хотел оказать всю возможную помощь. Хотя он, казалось, слишком интересовался деталями наших агентских счетов."
 r56.soviet.20.a:0 "Нам пригодится любая помощь."
 r56.soviet.20.b:0 "Он может быть лоялистом, пытающимся сорвать планы. Рисковать нельзя."
 r56.soviet.21.t:0 "Связаться с политическими эмигрантами?"
 r56.soviet.21.d:0 "Несколько видных руководителей Временного правительства России были вынуждены эмигрировать после окончания Гражданской войны в 1922 году. Их программа была неприемлема во времена коммунистической обработки пролетариата в 1920-х и начале 1930-х годов, но теперь неопределённость действующего правительства очевидна. Наши информаторы встретились в Париже с Павлом Милюковым и посвятили бывшего министра иностранных дел в план. После долгого вечернего обсуждения он согласился поддержать нас при условии бескровной революции без иностранного вмешательства.\n\nКроме того, несколько агентов НКВД предложили тайно вернуть исключённых коммунистов и других политиков-эмигрантов, чтобы сделать послепереворотное правительство стабильнее и придать режиму международную легитимность."
 r56.soviet.21.a:0 "Они помогут укрепить новое советское государство!"
 r56.soviet.21.b:0 "Они в изгнании не без причины."
 r56.soviet.22.t:0 "Связаться с генералами-эмигрантами?"
 r56.soviet.22.d:0 "После окончания Гражданской войны многие видные представители Русской императорской армии и Белого движения покинули страну, опасаясь советской мести или надеясь вернуть прежнюю славу за рубежом. Большинство сменили имена и скрыли военный опыт под видом природного таланта, но некоторых агенты всё же узнали. Среди них Анатолий Рогожин, ныне служащий в югославской пограничной полиции, и генерал Константин Нечаев, помогавший китайскому правительству как военный советник. Долгие переговоры и обещания восстановить звания и вернуть конфискованное имущество склонили их на нашу сторону.\n\nАгенты НКВД предлагают тайно переправить изгнанных генералов и других военных путём десантирования в малонаселённых районах. Эта операция укрепит послепереворотную армию."
 r56.soviet.22.a:0 "Рисковать нельзя."
 r56.soviet.22.b:0 "Превосходная идея!"
 r56.soviet.24.t:0 "Троцкий вернулся!"
 r56.soviet.24.d:0 "Новости об аресте и скорой казни Сталина достигли Перманентного революционера и его телохранителей, когда они ехали поездом в Стокгольм, чтобы сесть на подготовленный корабль и через несколько дней прибыть в Ленинград.\n\nПри сходе с корабля Троцкого лично встретил Ежов, а в честь его возвращения устроили небольшой военный парад. Оба революционера согласились немедленно вылететь в Москву, чтобы как можно скорее передать власть.\n\nБыл созван новый съезд Всесоюзной коммунистической партии, на котором революционер произнёс первую крупную речь после изгнания в 1929 году. На лице Троцкого появились слёзы радости, когда он страстно заявил, что крестьяне и рабочие вскоре вкусят плоды мировой революции. Он также сказал: «Я принесу надежду рабочим всего мира и верну революцию на верный путь!»"
 r56.soviet.24.a:0 "Да здравствует Троцкий!"
 r56.soviet.26.t:0 "Заполнение вакуума власти"
 r56.soviet.26.d:0 "Двадцатилетнее правление Коммунистической партии в России наконец завершилось. Старое советское руководство предано суду за преступления против русского народа, а законодательная, исполнительная и судебная системы лежат в руинах после жестоких чисток последних лет.\n\nНовое правительство восприимчиво к различным политическим программам, распространяющимся среди интеллигенции, военных и рабочих. Трудовики популярны среди образованных кругов, Российская фашистская партия пользуется поддержкой многих военачальников, а эмигранты выступают за возвращение монархии под властью Романовых.\n\nЧтобы страна вновь не погрузилась в хаос, необходимо поддержать одну из фракций и передать ей руководство. Каково будет решение правительства [SOV.GetLeader]?"
 r56.soviet.26.a:0 "Сторонники демократии выражают чаяния народа!"
 r56.soviet.26.b:0 "Все остальные системы потерпели крах — необходимо восстановить монархию!"
 r56.soviet.26.c:0 "Националисты приведут страну к славе!"
 r56.soviet.27.t:0 "Сталин отстранён от власти"
 r56.soviet.27.d:0 "Сталин был арестован и вскоре казнён членами Коммунистической партии. [SOV.GetLeader] вошёл в его кабинет вместе с агентами НКВД, арестовал его и перечислил преступления против русского народа. На следующий день состоялся суд, приговоривший Сталина к смерти, и уже после полудня его повесили. Многие чиновники российского правительства, обвинённые в соучастии в преступлениях Сталина, также подвергаются арестам, заключению или казни. Никто не знает, кто теперь возглавит [SOV.GetNameDefCap]. Ходят слухи, что [SOV.GetLeader] пригласил Троцкого вернуться и принять руководство."
 r56.soviet.27.a:0 "Лжереволюционер мёртв!"
 r56.soviet.27.b:0 "Карточный домик Сталина наконец рухнул."
 r56.soviet.28.t:0 "Конец коммунистического правления в России"
 r56.soviet.28.d:0 "\nПочти сразу после возвращения Троцкого к руководству советским правительством после Сталина его свергла крупная фракция антикоммунистических чиновников и офицеров. Она быстро обрела широкую поддержку в армии и правительстве и буквально за одну ночь устранила сторонников коммунизма. Некоторые специалисты полагают, что чистки троцкистами сталинских сторонников и последовавший за переворотом хаос ослабили Коммунистическую партию до необратимого состояния. Руководитель свержения [SOV.GetLeader] теперь стоит перед почти невозможной задачей стабилизировать новое правительство [SOV.GetName] и множество его фракций."
 r56.soviet.28.a:0 "Теперь мы должны повести соотечественников к лучшему будущему."
 r56.soviet.28.b:0 "Хорошо, что этот маленький «эксперимент» закончился."
 r56.soviet.28.c:0 "Мы сами продолжим революцию."
 r56.soviet.29.t:0 "[SOV.GetLeader] призывает к мировой революции"
 r56.soviet.29.d:0 "[SOV.GetLeader] призвал коммунистов всего мира сбросить оковы, свергнуть капиталистические правительства и взяться за оружие, поддержав борьбу [SOV.GetName] за «мировую революцию»."
 r56.soviet.29.a:0 "Теперь наше видение станет реальностью!"
 r56.soviet.29.b:0 "Это не сулит ничего хорошего..."
 r56.soviet.29.c:0 "Давно пора!"
 r56.soviet.30.t:0 "Результаты выборов"
 r56.soviet.30.d:0 "Двадцатилетнее правление Коммунистической партии в России наконец завершилось. Старое советское руководство предано суду за преступления против русского народа, а законодательная, исполнительная и судебная системы лежат в руинах после жестоких чисток последних лет.\n\nНовое правительство восприимчиво к различным политическим программам, распространяющимся среди интеллигенции, военных и рабочих. Трудовики популярны среди образованных кругов и сумели привлечь народ обещаниями государственных реформ и уважения права на самоопределение.\n\nЧтобы страна вновь не погрузилась в хаос, необходимо поддержать одну из фракций и передать ей руководство."
 r56.soviet.30.a:0 "Сторонники демократии выражают чаяния народа!"
 SOV_prepare_to_hunt_the_bear:0 "Подготовиться к охоте на медведя"
 SOV_prepare_to_hunt_the_bear_desc:0 "Стремительные перемены в политических и военных структурах оставили глубокие раны в обществе. Чтобы система вновь не скатилась в бездну тоталитаризма, стоит собрать группу верных людей в высших эшелонах власти, способную свергнуть тирана прежде, чем он уничтожит нас поодиночке."
 SOV_look_to_the_east:0 "Обратить взгляд на Восток"
 SOV_look_to_the_east_desc:0 "Многие бывшие военные офицеры всё ещё скитаются по стране в поисках своего места в эти неопределённые времена. Наши информаторы в [JAP.getNameDef] добыли несколько важных документов, которые могут подсказать, как свергнуть Сталина в ближайшем будущем."
 SOV_forge_new_future:0 "Выковать новое будущее"
 SOV_forge_new_future_desc:0 "Потенциальный деспот Сталин ушёл из жизни, и те, кто прежде боялся открыто говорить о его преступлениях, теперь объединяются вокруг Никиты Хрущёва — исполнительного проводника его воли на Украине. Товарищ Хрущёв обладает талантом и здравомыслием, необходимыми, чтобы остановить стремление других тиранов к власти над советскими народами. Ему будет нетрудно заручиться достаточной поддержкой и стать новым генеральным секретарём ЦК КПСС."
 SOV_military_chairman:0 "Военный председатель"
 SOV_military_chairman_desc:0 "Некогда гордый товарищ Сталин покоится в могиле. Нетрудно вспомнить, что пока партия плела интриги и занималась саморазрушением, Красная армия ценой огромных усилий доказывала свою ценность и важность. В эти опасные времена нам нужны не двуличные бюрократы, а сильное и гордое руководство Рабоче-крестьянской Красной армии — одновременно меча и щита пролетариата."
 SOV_prolong_the_stalin_legacy:0 "Продлить наследие Сталина"
 SOV_prolong_the_stalin_legacy_desc:0 "Гордый товарищ Сталин покинул нас. Председатель Совета министров Советского Союза Георгий Максимилианович Маленков должен заручиться достаточной поддержкой, чтобы его не оттеснили ревизионисты. Как последователь Сталина, он обладает твёрдостью, необходимой для сдерживания безрассудных людей вроде Берии, не знающих требуемой от главы правительства умеренности."
 SOV_strike_the_NKVD_positions:0 "Ударить по позициям НКВД"
 SOV_strike_the_NKVD_positions_desc:0 "После бесчисленных чисток последних лет Лаврентий Берия обладает огромной властью. Настало время устранить эту переменную и гарантировать, что Союз больше никогда не станет свидетелем его злодеяний."
 SOV_denounce_stalinist_crimes:0 "Осудить преступления сталинизма"
 SOV_denounce_stalinist_crimes_desc:0 "Распространены слухи, что товарищ Хрущев в ближайшее время планирует провести внеочередной съезд партии для рассмотрения дел товарища Сталина и его ставленников в народных республиках. Посмотрим, что скажет цивилизованный мир о новом коммунистическом правлении в СССР!"
 SOV_rehabilitate_stalins_legacy:0 "Реабилитировать наследие Сталина"
 SOV_rehabilitate_stalins_legacy_desc:0 "Наследие Сталина противоречиво: многие презирают его за репрессии, сопоставимые со старым царским режимом. Однако мы не можем изменить прошлое — только будущее, и не позволим ошибочным действиям подпитывать многочисленные контрреволюционные силы, ищущие слабости Союза. Поэтому мы отодвинем прошлое ради будущего и преуменьшим его ошибки, пока мир не будет готов понять, что они совершались с благими намерениями."
 r56.soviet.200.t:0 "[FROM.getAdjective] сторона хочет снабдить нас разведданными"
 r56.soviet.200.d:0 "\nНаше разведывательное подразделение, действующее на Дальнем Востоке у озера Хасан, обнаружило [FROM.getAdjective] агента НКВД, который, по всей видимости, искал встречи с одним из высокопоставленных офицеров, чтобы «как можно скорее обсудить вопросы чрезвычайной важности и высочайшей актуальности».\n\nПосле нескольких часов допроса и проверки предоставленных сведений агенты подтвердили, что намерения молодого человека более чем благородны: он хочет передать нам военную информацию о размещении [SOV.getAdjective] вооружённых сил на Дальнем Востоке в обмен на символическую поддержку предстоящей операции по свержению безжалостного диктатора Сталина."
 r56.soviet.200.a:0 "Посмотрим, что он может предложить."
 r56.soviet.200.b:0 "Нас это не интересует. Прогнать его."
 r56.soviet.201.t:0 "Обмен разведданными с покровителем обеспечен"
 r56.soviet.201.d:0 "Источники подтверждают, что покровитель охотно поможет в деле скорого свержения фактического русского царя.\n\nНаш посол запросил политическое убежище в одном из их небольших городов и теперь передаёт важнейшие сведения, чтобы всё прошло по плану."
 r56.soviet.201.a:0 "Превосходно! Передать согласованный знак нашей дружбы."
 r56.soviet.202.t:0 "Информатор возвращается с пустыми руками"
 r56.soviet.202.d:0 "Наши покровители, похоже, не заинтересованы в обмене важной информацией, что бы мы ни предлагали. Можно лишь гадать, почему [JAP.getAdjective] сторона отказалась от сделки, но одно ясно: здесь придётся полагаться на другие источники поддержки.\n\nИнформатор всё же подслушал разговор сотрудников, и эти сведения могут пригодиться."
 r56.soviet.202.a:0 "По крайней мере, у нас хоть что-то есть..."
