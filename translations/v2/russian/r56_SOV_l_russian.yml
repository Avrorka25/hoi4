 SOV_every_nation_with_negative_opinion_against_us_tt:0 "Каждая страна с отрицательным отношением к нам:"
 r56_kill_stalin.1.t:0 "Сталин погиб в автокатастрофе!"
 r56_kill_stalin.1.desc:0 "Во время одной из обычных прогулок к особняку в Мацесте Иосиф Сталин был замечен на улице неким радикалом, который попытался выхватить револьвер и выстрелить во вождя, но телохранители быстро его обезоружили. Офицеры НКВД убедили Сталина сесть в автомобиль и отправиться домой, пока ситуация не обострилась ещё сильнее.\n\nНа крутом повороте машину неожиданно протаранил тяжело нагруженный грузовик. Сталин получил тяжёлые ранения и скончался на месте. Водителя грузовика сейчас допрашивают на предмет участия в заговоре.\n\nПосле получения новостей в Москве Верховный Совет назначил Георгия Маленкова первым секретарём до проведения новых выборов."
 r56_kill_stalin.1.a:0 "Совпадение? Вряд ли..."
 r56_kill_stalin.2.t:0 "Сталина нашли с пулевым ранением!"
 r56_kill_stalin.2.desc:0 "Потрясённые граждане [SOV.getNameDef] с недоверием слушали по радио и уличным громкоговорителям страшную новость для всех сторонников коммунизма: Иосиф Сталин найден убитым в своём особняке.\n\nНеизвестное число убийц проникло в особняк в Мацесте через недавно проложенные трубы и расстреляло всех встреченных внутри, не оставив свидетелей. Потрясённые сотрудники полиции и НКВД всё ещё пытаются установить подозреваемых и понять, как им удалось обойти остальные посты безопасности вокруг города."
 r56_kill_stalin.2.a:0 "Провал общественной безопасности..."
 r56_kill_stalin.3.t:0 "Сталин скончался от сердечного приступа!"
 r56_kill_stalin.3.desc:0 "Облака темнеют над [SOV.getNameDef] Как только по всей стране распространились новости: Иосиф Виссарионович Сталин, единственный лидер коммунистической партии за последние несколько лет, мирно скончался в своем особняке в Мацесте.\n\nСтрадая от сердечного заболевания в последние недели, он решил отдохнуть от пыльных офисов Политбюро на солнечном побережье Черного моря, чтобы вернуть свои силы. Сотрудники особняка были проинформированы, чтобы не беспокоить лидера, поскольку он хотел не торопиться. Если бы только кто-то знал, какие последствия это может иметь...\nГеоргий Маленков взял власть на время, стремясь стабилизировать страну в смятении от такой потери."
 r56_kill_stalin.3.a:0 "Крайне прискорбно. Крайне."
 r56_kill_stalin.4.t:0 "Сталин погиб в результате обстрела береговой охраны!"
 r56_kill_stalin.4.desc:0 "Ясный солнечный день в Мацесте превратился в огненный кошмар после того, как береговая охрана приняла лодку Иосифа Сталина за судно контрабандистов и открыла огонь, когда она не передала обычные коды безопасности на этот день.\nНескольких выстрелов корабельных орудий хватило, чтобы превратить маленькую яхту в горящие обломки, ушедшие на дно Чёрного моря. Тело секретаря нашли час спустя.\n\nЭкипаж береговой охраны сейчас находится под следствием НКВД по подозрению в заговоре против генералиссимуса. Тем временем Георгий Маленков назначен первым секретарём в эти неспокойные для [SOV.getNameDef] времена."
 r56_kill_stalin.4.a:0 "Вот что бывает, когда не выполняешь приказы..."
 SOV_invest_in_enigneering_tooltip:0 "§YПромышленные фокусы§! теперь дополнительно дают национальный дух §Y«Промышленный рывок»§! со следующим §Yэффектом§!:\n(Скорость строительства: §G+5,00%§!, объём заводского производства: §G+5,00%§!) на §Y30 дней§!.\n"
 SOV_move_capital_to_sverdlovsk_effect:0 "§YСвердловск§!:\n  становится столицей;\n  добавляет §Y12 наземных укреплений§! в Свердловске и вокруг него;\n  добавляет §G4§! ячейки строительства.\n"
 SOV_fifth_column_tt:0 "Агенты НКВД будут тайно работать над §Yсвержением сталинского режима§! и §Yвозвращением Троцкого§! к власти. §YРешения§!, принятые до переворота, изменят эффекты этого §Yфокуса§!. Некоторые §Yварианты§! приведут к §Rповышенной нестабильности после переворота§! и создадут возможность §Yконтрпереворота§!. Другие §Yварианты§! §Gснизят нестабильность после переворота§!, но вызовут иные §Rотрицательные последствия§!."
 SOV_fifth_column_nsb_tt:0 "Агенты НКВД будут тайно работать над §Yсвержением сталинского режима§! и §Yвозвращением Троцкого§! к власти. Политический хаос позволит провести дальнейшие реформы."
 SOV_world_revolution_tt:0 "Каждая некоммунистическая страна:\n   получает §Y«Влияние Коминтерна»§!, дающее (ежедневная поддержка коммунизма: §G+0,05§!) на §Y365§! дней."
