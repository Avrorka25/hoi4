l_russian:
 TAN_Industrial_Start:0 "Начать индустриальное развитие"
 TAN_Industrial_Start_desc:0 "Наступает эпоха перемен. В страну приходят инвестиции, появляются новые машины, и нам необходимо приспособиться к этим изменениям."
 TAN_increase_sedentarization:0 "Ускорить переход к оседлости"
 TAN_increase_sedentarization_desc:0 "Кочевое население менее продуктивно с экономической точки зрения, поэтому для ускорения индустриализации необходимо перевести его к оседлому образу жизни."
 TAN_Futher_Investments:0 "Поощрять иностранных инвесторов"
 TAN_Futher_Investments_desc:0 "Промышленность иностранных держав значительно превосходит нашу, поэтому нам придётся опереться на их знания."
 TAN_Civilian_One:0 "Расширить гражданское производство"
 TAN_Civilian_One_desc:0 "Современной стране необходимы новые фабрики."
 TAN_Civilian_Two:0 "Увеличить мощности гражданской промышленности"
 TAN_Civilian_Two_desc:0 "Чтобы соответствовать требованиям эпохи, нашу промышленность необходимо модернизировать."
 TAN_Research:0 "Новые школы и современное образование"
 TAN_Research_desc:0 "Образование — основа науки и ключ к приспособлению к современному миру."
 TAN_Excavation:0 "Раскрыть минеральные богатства"
 TAN_Excavation_desc:0 "Необходимые для войны ресурсы могут скрываться глубоко под землёй, и наш долг — обнаружить их."
 TAN_Refinery:0 "Сосредоточиться на переработке синтетических материалов"
 TAN_Refinery_desc:0 "Производство нефти и каучука из угля позволяет избавиться от необходимости импортировать нефть или контролировать нефтяные месторождения. Однако синтетическое топливо значительно сильнее загрязняет окружающую среду и обходится дороже."
 TAN_Autarky:0 "Реформировать налоги"
 TAN_Autarky_desc:0 "Более организованный административный аппарат позволит лучше справляться с нынешними трудностями."
 TAN_Military_Buildup:0 "Расширить военные мощности"
 TAN_Military_Buildup_desc:0 "Вооружённым силам требуется огромное количество нового снаряжения. Строительство нескольких заводов наверняка удовлетворит их потребности."
 TAN_Invite_Japanese:0 "Пригласить японских инвесторов"
 TAN_Invite_Japanese_desc:0 "Многие японские корпорации стремятся расширять своё влияние и присутствие по всему миру. Мы можем воспользоваться хорошими отношениями и попросить о скромных инвестициях."
 TAN_Japanese_Heavy:0 "Расширить тяжёлую промышленность при помощи Японии"
 TAN_Japanese_Heavy_desc:0 "Стабильное промышленное сотрудничество с японскими союзниками помогает модернизировать тяжёлую промышленность."
 TAN_Invite_American:0 "Пригласить американских инвесторов"
 TAN_Invite_American_desc:0 "Великие державы Западного полушария всегда стремятся распространять своё влияние и идеалы свободы по всему миру. Мы можем воспользоваться хорошими отношениями и попросить о скромных инвестициях."
 TAN_American_Air:0 "Расширить авиационную промышленность при помощи США"
 TAN_American_Air_desc:0 "Самолёты — будущее торговли, туризма и войны. Под руководством США мы сможем открыть ещё больше новых предприятий."
 TAN_Invite_Soviets:0 "Пригласить советских планировщиков"
 TAN_Invite_Soviets_desc:0 "Уникальная советская архитектура и градостроительные методы наверняка применимы и в нашей стране. Первым шагом сотрудничества должно стать строительство совершенно нового промышленного комплекса."
 TAN_Soviet_Heavy_Industry:0 "Коммунистическая тяжёлая промышленность"
 TAN_Soviet_Heavy_Industry_desc:0 "Наши коммунистические друзья предлагают согласованно расширить тяжёлую промышленность."
 TAN_Automobile:0 "Автомобильная промышленность"
 TAN_Automobile_tt:0 "Получить небольшое количество §Hмоторизированного снаряжения§! от приглашённых компаний."
 TAN_Automobile_desc:0 "Отечественных автопроизводителей сейчас поощряют сотрудничать с зарубежными коллегами."
 TAN_Licences:0 "Приобрести иностранные лицензии"
 TAN_Licences_EXPL:0 "Открывает решения §H«Приобрести иностранную бронетехнику»§!."
 TAN_Licences_desc:0 "Теперь мы способны производить современное снаряжение и можем приобрести новейшие проекты у других стран. Хотя за них придётся заплатить, они наверняка того стоят."
 TAN_State_Matter:0 "Сосредоточиться на внутренних делах"
 TAN_State_Matter_desc:0 "Никогда прежде страна не была настолько расколота внутренней борьбой за власть. Создание сильного и единого правительства должно стать главным приоритетом."
 TAN_Collectivist_Ethos:0 "Коллективистский дух"
 TAN_Collectivist_Ethos_desc:0 "Сильная страна должна быть однопартийной. Подавление любой демократической оппозиции лишь укрепит власть режима."
 TAN_Organise_Youth:0 "Организовать молодёжь"
 TAN_Organise_Youth_desc:0 "Во всех уголках страны слышны голоса молодых людей, восхваляющих нынешний режим. Их совместную поддержку можно использовать для укрепления веры народа в наше дело. "
 TAN_Com_Generals:0 "Расширить коммунистическое военное командование"
 TAN_Com_Generals_desc:0 "Многие образованные крестьяне и рабочие охотно вступают в армию, восполняя нехватку офицеров."
 TAN_Collectivist_Propaganda:0 "Культура рабочего класса"
 TAN_Collectivist_Propaganda_desc:0 "Перераспределённые богатства успешно используются для улучшения работы фабрик и увеличения объёмов производства."
 TAN_revolutionary_guards:0 "Революционная гвардия"
 TAN_revolutionary_guards_desc:0 "Для подавления контрреволюционных элементов нужна тайная полиция. Борьба товарища Токи с прояпонскими данчайцами внутри партии не может быть напрасной!"
 TAN_red_army:0 "Тувинская народно-революционная армия"
 TAN_red_army_desc:0 "Под командованием страны находится Тувинская народно-революционная армия — доблестная сила солдат, сражающихся и жертвующих собой ради революции. Они поистине достойны памяти всех грядущих поколений."
 TAN_Conquer:0 "Экспансионистская политика"
 TAN_Conquer_desc:0 "Военная сила нашего режима в сочетании со слабостью и некомпетентностью правительств соседей не оставляет нам выбора, кроме как установить у них правильный порядок."
 TAN_Intervene:0 "Политика вмешательства"
 TAN_Intervene_desc:0 "Наше дело можно распространять по всему миру при помощи небольших бригад, которые будут поддерживать подходящие режимы идеологическим обучением, штабным планированием и военной помощью. "
 TAN_Isolated:0 "Изолированная страна"
 TAN_Isolated_desc:0 "Наше правление будет связано с политической стабильностью и национальным процветанием. Но если кто-нибудь пренебрежёт нашим нейтралитетом, он дорого за это заплатит!"
 TAN_Forced_Conscription:0 "Закон о воинской повинности"
 TAN_Forced_Conscription_desc:0 "Чтобы выжить в превратившемся в пороховую бочку мире, нам потребуется гораздо больше солдат для защиты наших ценностей."
 TAN_Fanaticism:0 "Идеологический фанатизм"
 TAN_Fanaticism_desc:0 "Нет смысла ограничивать пропаганду. Если люди готовы умереть за наше дело, почему мы должны им мешать?"
 TAN_tuvan_nationalism:0 "Тувинский национализм"
 TAN_tuvan_nationalism_desc:0 "Советы пытались подчинить нас. В прошлом контролировать нас пытались и китайцы. Настало время утвердить себя как нацию, противостоящую иностранным державам."
 TAN_Liberty_Ethos:0 "Дух свободы"
 TAN_Liberty_Ethos_desc:0 "Новое правительство будет действовать эффективнее, если прислушается ко всем группам населения и отбросит разделение по полу, расе и политическим взглядам."
 TAN_rehabilitate_pre_revolutionary_practices:0 "Возродить урянхайские традиции"
 TAN_rehabilitate_pre_revolutionary_practices_desc:0 "Политика Тувинской народно-революционной партии уничтожила саму сущность тувинского народа. Но пусть все знают: мы не придаток бездушного «Советского Союза», порождения идеологии, а не культуры; мы гордые тывалар — сыновья и дочери могучих гор и безмятежных рек!"
 TAN_Strenghten_Democracy:0 "Укрепить демократию"
 TAN_Strenghten_Democracy_desc:0 "Доверие и преданность народа нашему делу неоспоримы. Новый законодательный период принесёт массам ещё больше либеральных ценностей!"
 TAN_Defence_Act:0 "Закон о национальной безопасности"
 TAN_Defence_Act_desc:0 "Продвижение верных полицейских, военных и разведчиков укрепит позиции правительства и защитит законодательный аппарат от иностранного влияния."
 TAN_Brigades:0 "Сформировать интернациональные бригады"
 TAN_Brigades_desc:0 "Чтобы наши военные возможности воспринимали всерьёз во всём мире, необходимо расширить присутствие добровольцев за рубежом."
 TAN_Military_Build:0 "Оружие защищает страну"
 TAN_Military_Build_desc:0 "Внешняя безопасность страны связана с численностью её армии. Чтобы удовлетворить растущие потребности солдат, необходимо расширить военную промышленность!"
 TAN_Anti_Invasion:0 "Укрепления защищают страну"
 TAN_Anti_Invasion_desc:0 "Оборона ключевых промышленных и научных центров станет эффективнее, если укрепить наиболее уязвимые места и увеличить их гарнизоны."
 TAN_restore_monastic_prerogatives:0 "Восстановить монастырские привилегии"
 TAN_restore_monastic_prerogatives_desc:0 "В то время как «правая» фракция ТПРП поддерживала буддизм, переворот 1929 года, который поставил во главе московских предателей-лоялистов, поставил нашу страну на путь самого предосудительного государственного атеизма. Сейчас монастыри еле держатся, но, к счастью, есть еще люди, симпатизирующие вере нашего народа, которые могут вернуть их на свое законное место."
 TAN_adopt_nichirenist_principles:0 "Принять принципы нитирэнизма"
 TAN_adopt_nichirenist_principles_desc:0 "Японский монах стал объединяющей фигурой для японских националистов, готовых вести священную войну против врагов буддизма. Недавняя история показала, насколько опасным оказалось почти полное уничтожение нашего духовенства. Угроза всё ещё сохраняется, поэтому заимствование этих идей может сплотить народ и превратить Туву в сильную страну."
 TAN_mobilize_for_a_holy_war:0 "Мобилизовать народ для священной войны"
 TAN_mobilize_for_a_holy_war_desc:0 "Настало время подготовить наше население к Священной войне, окончательной борьбе за очищение мира. Это будет большой вызов, но мы знаем, что нет более благородной причины вести войну, чем это."
 TAN_appropriate_the_gokturks:0 "Присвоить наследие гёктюрков"
 TAN_appropriate_the_gokturks_desc:0 "Мы должны установить новую гегемонию над степью и прилегающими землями. Только мы несём правильные идеалы и только мы достойны унаследовать величие древних империй."
 TAN_call_for_army_readiness:0 "Объявить боевую готовность армии"
 TAN_call_for_army_readiness_desc:0 "Мы должны пробудиться к возможности того, что враждебная армия может достичь нашей страны."
 TAN_cavalry_tradition:0 "Кавалерийская традиция"
 TAN_cavalry_tradition_desc:0 "Верховая езда была единственным способом путешествовать и контролировать наши стада."
 TAN_establish_the_ministry_of_war:0 "Учредить военное министерство"
 TAN_establish_the_ministry_of_war_desc:0 "Для дальнейшего роста армии необходимо создать министерство, которое будет ею управлять."
 TAN_improve_officer_training_formation:0 "Улучшить подготовку офицеров"
 TAN_improve_officer_training_formation_desc:0 "Только хорошо обученные офицеры способны правильно руководить людьми в бою."
 TAN_uphold_the_cavalry_primacy:0 "Сохранить первенство кавалерии"
 TAN_uphold_the_cavalry_primacy_desc:0 "Чтобы эффективно сражаться в степи, мы должны довести мастерство верховой езды до совершенства."
 TAN_scavenge_battlefield_equipment:0 "Собирать снаряжение на поле боя"
 TAN_scavenge_battlefield_equipment_desc:0 "Захват техники на поле боя, несмотря на ее ненадежность в качестве источника, немного ослабил бы давление со стороны нашего военного ведомства."
 TAN_gold_mining:0 "Добыча золота"
 TAN_gold_mining_desc:0 "Золотые резервы Тувы - это то, что принесло россиянам в страну в первую очередь. Эта традиция присутствует и по сей день."
 TAN_exploit_the_ulugh_khem_coal_basin:0 "Освоить Улуг-Хемский угольный бассейн"
 TAN_exploit_the_ulugh_khem_coal_basin_desc:0 "Помимо золота, под нашими ногами скрывается второе сокровище — огромные запасы угля. Его добыча и использование станут важнейшей основой индустриализации."
 TAN_coal_based_industry:0 "Угольная промышленность"
 TAN_coal_based_industry_desc:0 "Освоение угольных запасов позволит развернуть масштабную программу индустриализации."
 TAN_assimilate_altai:0 "Ассимилировать алтайцев"
 SIB_unified_tt:0 "Сибирское государство сформировано"
 TAN_disorganized_military:0 "Дезорганизованная армия"
 TAN_disorganized_military_2:0 "Дезорганизованная армия"
 TAN_true_heirs_of_the_gokturks_idea:0 "Истинные наследники гёктюрков"
 TAN_true_heirs_of_the_gokturks_idea_desc:0 "Мы прикоснулись к вечному наследию далёких предков — Небесных тюрков. Мир становится свидетелем создания современного Тюрк эля, ставшего возможным благодаря несравненно сильному духу нашего народа!"
 TAN_bank_of_tuva:0 "Тувинский торгово-промышленный банк"
 kamby_lama:0 "Камбы-лама"
 TAN_salchak_toka:0 "Салчак Тока"
 TAN_adyg_tulush_oldukai_oglu_khemchik_ool:0 "Адыг-Тулуш Хемчик-оол"
 TAN_sat_churmit_dazhy:0 "Сат-Чурмит Дажи"
 TAN_lanzy_nazynchap:0 "Лэнзи Назынчап"
 TAN_kamby_lama:0 "Камбы-лама"
 TAN_kenden_khomushku:0 "Кенден Хомушку"
 TAN_seren_kuzhuget:0 "Серен Кужугет"
 TAN_m_bayyskylan:0 "Монгуш Байыскылан"
 TAN_amelchenko:0 "Тимофей Амельченко"
 TAN_kuular_davaa_sambuu:0 "Куулар Даваа-Самбуу"
 TAN_kidispey_choodu:0 "Кидиспей Чооду"
 TAN_mongush_suwaku:0 "Монгыш Суваку"
 TAN_lakpa_oyun:0 "Оюн Лакпа"
 TAN_khertek_anchimaa_toka:0 "Хертек Анчимаа"
 TAN_sat_bazyr_ool_oglu_lopsan:0 "Сат Лопсан"
 TAN_oiun_danchai:0 "Оюн Данчай"
 TAN_polat_oyun:0 "Оюн Полат"
 TAN_saryg_donggak_chymba:0 "Сарыг-Донгак Чымба"
 TAN_nikolay_comrade:0 "Николай Чолдак-Олович"
 TAN_saaya_ala:0 "Саая Ала"
 TAN_naval_preparatory_committee:0 "Комитет по подготовке флота"
