 SOV_r56rp_formalize_ssr_category:0 "Создание Советских Социалистических Республик"
 SOV_r56rp_formalize_ssr_category_desc:0 "Для того, чтобы обеспечить мировую революцию, мы должны распространить ее, а затем двигаться дальше, чтобы помочь коммунизму не колебаться в регионе, где мы можем создать социалистические республики, которые верны нашему делу и будут отвечать нашему правительству, когда будет сделан призыв к ним принять участие в революции."
 SOV_r56rp_establish_united_baltic_ssr:0 "Установить §YОбъединенная Балтийская ССР§!"
 r56rp_SOV_ask_for_nep:0 "Усыновить [SOV.GetAdjectiveCap] НЭП"
 r56rp_SOV_ask_for_nep_desc:0 "Старое временное решение Ленина хорошо послужит нашей экономике."
 SOV_r56rp_the_final_moscow_trial:0 "Заключительный Московский процесс"
 SOV_r56rp_the_final_moscow_trial_desc:0 "Пришло время уничтожить последнего сталиниста в Советском Союзе. Мы сделаем это, выслеживая их и предав суду за их преступления против партии. Тогда мы сможем окончательно объявить победу над этой темной эпохой в советской истории."
 SOV_r56rp_a_star_Reborn:0 "Возрожденная звезда"
 SOV_r56rp_a_star_Reborn_desc:0 "Лев Каменев, известный как выцветшая звезда, был выбран следующим лидером Советского Союза. Он больше не является звездой. Вместо этого он стал звездой, которая возродилась снова."
 SOV_r56rp_great_agitator:0 "Великий агитатор"
 SOV_r56rp_great_agitator_desc:0 "Советский Союз – это лишь плацдарм для мировой революции! Мы должны расширить революцию за пределы Советского Союза! Мы сделаем это, «поощряя» революционеров за пределами наших границ."
 the_star_reborn:0 "Звезда возрождается"
 SOV_r56rp_great_agitators:0 "Великие агитаторы"
