 SOV_r56rp_save_the_right_tt:0 "§Y$SOV_nikolay_bukharin$§!, §Y$SOV_aleksey_rykov$§!и §Y$SOV_mikhail_tomsky$§! Они больше не будут потенциальными мишенями для чисток."
