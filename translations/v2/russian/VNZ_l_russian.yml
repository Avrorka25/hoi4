 VNZ_giovanni_ponti:0 "Джованни Понти"
 VNZ_italico_corradino_capellotto:0 "Италико Коррадино Каппеллотто"
 VNZ_giovanni_battista_gianquinto:0 "Джованни Баттиста Джанквинто"
 VNZ_giovanni_mercello:0 "Джованни Марчелло"
 VNZ_quirino_armellini:0 "Квирино Армеллини"
 VNZ_arnaldo_azzi:0 "Арнальдо Ацци"
 VNZ_riccardo_fedel:0 "Риккардо Федель"
 VNZ_giacomo_zanussi:0 "Джакомо Занусси"
 VNZ_integrate_trieste:0 "Интегрировать Триест"
 VNZ_integrate_zara:0 "Интегрировать Зару"
 VNZ_integrate_trentino:0 "Интегрировать Трентино"
 VNZ_integrate_dalmatia:0 "Интегрировать Далмацию"
 VNZ_democratic_party:0 "ЛД"
 VNZ_democratic_party_long:0 "Лега Демократика"
 VNZ_neutrality_party:0 "ЛСМ"
 VNZ_neutrality_party_long:0 "Леоне ди Сан-Марко"
 VNZ_communism_party:0 "ПКВ"
 VNZ_communism_party_long:0 "Партито Комуниста дель Венето"
 VNZ_fascism_party:0 "ПФР"
 VNZ_fascism_party_long:0 "Партито Фашиста Репуббликано"
 sade:0 "САДЕ"
 VNZ_generic_industrial_concern:0 "ИЭНПВ"
 VNZ_generic_industrial_concern_desc:0 "Импрезе электрометаллурджике э навали нель порто ди Венеция"
 VNZ_IENPV_battlefleet:0 "ИЭНПВ"
 VNZ_porto_industriale_di_venezia:0 "Порто Индустриале ди Венеция"
 VNZ_army_effort:0 "Организовать вооружённые силы"
 VNZ_army_effort_desc:0 "Несмотря на растущие возможности воздушной и морской войны, наземные сражения по-прежнему будут иметь решающее значение в войнах будущего. Подготовившись заранее, мы сможем избежать повторения ада окопов."
 VNZ_equipment_effort:0 "Модернизировать оснащение"
 VNZ_equipment_effort_desc:0 "Пределы того, какое снаряжение способна нести пехота, постоянно расширяются. Мы сосредоточимся на обеспечении наших войск лучшим доступным оснащением."
 VNZ_motorization_effort:0 "Моторизованная поддержка"
 VNZ_motorization_effort_desc:0 "Мобильность и защита имеют решающее значение для безопасной доставки пехоты на поле боя и её вывода оттуда. Сосредоточившись на этих разработках, мы сможем действовать быстрее."
 VNZ_field_hospitals:0 "Позаботиться о войсках"
 VNZ_field_hospitals_desc:0 "Вылеченные люди не умирают и могут отпраздновать это, снова нуждаясь в лекарствах."
 VNZ_modern_logistics:0 "Обеспечить солдат "
 VNZ_modern_logistics_desc:0 "Крайне важно, чтобы наши солдаты получали надлежащее снабжение оружием, продовольствием и медикаментами. Мы вложимся в улучшение логистики."
 VNZ_doctrine_effort:0 "Разработать новую тактику"
 VNZ_doctrine_effort_desc:0 "Военные доктрины, определявшие наземные бои Великой войны, устарели. Мы должны поручить нашим лучшим умам сформировать военную мысль завтрашнего дня."
 VNZ_equipment_effort_2:0 "Реформа вспомогательного оснащения"
 VNZ_equipment_effort_2_desc:0 "Мы продолжим усилия, чтобы наша пехота и вспомогательные части были вооружены лучшим доступным оснащением современности."
 VNZ_mechanization_effort:0 "Механизированная пехота"
 VNZ_mechanization_effort_desc:0 "Переосмыслив возможности моторизованной пехоты, мы сможем расширить пределы того, какие машины способны создавать сегодня."
 VNZ_doctrine_effort_2:0 "Крупномасштабные учения"
 VNZ_doctrine_effort_2_desc:0 "Поле боя изменилось за межвоенные годы и в ходе недавних конфликтов. Мы должны постоянно пересматривать наши доктрины с учётом этих перемен."
 VNZ_equipment_effort_3:0 "Завершить военную модернизацию"
 VNZ_equipment_effort_3_desc:0 "Вместо копирования или закупки иностранного оснащения мы должны стать мировым лидером в области пехотного вооружения."
 VNZ_armor_effort:0 "Разработать бронетехнику"
 VNZ_armor_effort_desc:0 "Применив знания, полученные при механизации пехоты, мы сможем улучшить и нашу бронетехнику."
 VNZ_special_forces:0 "Силы специального назначения"
 VNZ_special_forces_desc:0 "Нам нужны элитные войска; горные части и десантники должны стать нашим приоритетом."
 VNZ_aviation_effort:0 "Основать авиашколу [VNZ.getAdjective]"
 VNZ_aviation_effort_tt:0 "Недостаточно ячеек строительства для §Yавиабазы§!"
 VNZ_aviation_effort_desc:0 "Нигде технологический прогресс не идёт так быстро, как в воздушной войне. Авиация — область, которой обязана овладеть любая современная нация."
 VNZ_fighter_focus:0 "Ставка на истребители"
 VNZ_fighter_focus_desc:0 "Воздушные дуэли Великой войны были далеко не последними. Опережая других в разработке истребителей, мы получим преимущество в будущем."
 VNZ_bomber_focus:0 "Ставка на бомбардировщики"
 VNZ_bomber_focus_desc:0 "Когда люди будущего будут говорить об ужасах нынешних войн, одним из главных образов станет огонь, падающий с небес. Мы сделаем всё, чтобы именно наши враги рассказывали эти истории."
 VNZ_long_range_naval_bomber:0 "Дальние морские бомбардировщики"
 VNZ_aviation_effort_2:0 "Изучить иностранную тактику"
 VNZ_aviation_effort_2_desc:0 "Для эффективного взаимодействия военно-воздушных сил с другими родами войск потребуются дальнейшие достижения в авиации."
 VNZ_CAS_effort:0 "Пикирующие бомбардировщики"
 VNZ_CAS_effort_desc:0 "Современной армии необходима поддержка техники как на земле, так и в воздухе."
 VNZ_jet_focus:0 "К реактивной авиации"
 VNZ_jet_focus_desc:0 "Турбореактивная тяга — будущее авиации."
 VNZ_rocket_effort:0 "Ракетные двигатели"
 VNZ_rocket_effort_desc:0 "Ракетные и реактивные двигатели позволяют достигать невиданных скоростей как беспилотным, так и пилотируемым аппаратам. Развивая эти технологии первыми, мы сможем застать врага врасплох."
 VNZ_NAV_effort:0 "Морские бомбардировщики"
 VNZ_NAV_effort_desc:0 "Подобно тому как новая морская война идёт под поверхностью воды, часть её разворачивается и в воздухе над морями."
 VNZ_naval_effort:0 "Расширить военно-морские базы"
 VNZ_naval_effort_tt:0 "Недостаточно ячеек строительства для §Yверфей§!"
 VNZ_naval_effort_desc:0 "Расширение нашего флота должно стать приоритетом. Направим все доступные ресурсы на новые верфи и исследования лёгких надводных кораблей."
 VNZ_flexible_navy:0 "Гибкий флот"
 VNZ_flexible_navy_desc:0 "Переосмысление морской войны с учётом развития подводных лодок позволит нам эффективно наносить удары по вражеским конвоям."
 VNZ_large_navy:0 "Большой флот"
 VNZ_large_navy_desc:0 "Адаптация морских доктрин к использованию крупных кораблей и обеспечению безопасности торговых конвоев многому научит нас относительно того, какие корабли нам нужны."
 VNZ_naval_mine_warfare:0 "Минная война"
 VNZ_naval_mine_warfare_desc:0 "Морские мины позволяют наносить врагу ущерб без прямого столкновения."
 VNZ_stealth_upgrades:0 "Современные шноркели"
 VNZ_stealth_upgrades_desc:0 "Шноркели улучшат наши подводные лодки."
 VNZ_naval_gunnery:0 "Морская артиллерия"
 VNZ_naval_gunnery_desc:0 "Морская артиллерия необходима для эффективного флота."
 VNZ_naval_infantry:0 "Морская пехота"
 VNZ_naval_infantry_desc:0 "Для народа, тесно связанного с морем, вполне естественно иметь в составе флота собственные пехотные части."
 VNZ_military_intelligence:0 "Военная разведка"
 VNZ_military_intelligence_desc:0 "Знание — сила."
 VNZ_military_academy:0 "Реформировать военную академию"
 VNZ_military_academy_desc:0 "Хорошо подготовленные офицеры необходимы для командования армией."
 VNZ_reorient_towards_land_artillery:0 "Переориентироваться на сухопутную артиллерию"
 VNZ_reorient_towards_land_artillery_desc:0 "Мы должны применить опыт морской артиллерии на суше для нужд нашей армии."
 VNZ_reorganize_the_arsenals:0 "Реорганизовать арсеналы"
 VNZ_reorganize_the_arsenals_desc:0 "Теперь арсеналы должны производить вооружение для армии."
 VNZ_submarine_effort:0 "Подводная война"
 VNZ_submarine_effort_desc:0 "Подводная война — самое захватывающее развитие военно-морского дела со времён изобретения торпедного катера. Нам следует как защищаться от подводных лодок, так и использовать их против вражеского судоходства."
 VNZ_cruiser_effort:0 "Разработать крейсеры"
 VNZ_cruiser_effort_desc:0 "Прежде чем переходить к исследованиям передовых линкоров, необходимо заменить более лёгкие крейсеры."
 VNZ_destroyer_effort:0 "Разработать эсминцы"
 VNZ_destroyer_effort_desc:0 "Изучая конструкцию и стратегическое применение подводных лодок, мы также узнали, как противодействовать такой тактике. Эсминцы будут играть здесь решающую роль."
 VNZ_capital_ships_effort:0 "Интерес к крупным кораблям"
 VNZ_capital_ships_effort_desc:0 "Страна с наибольшим числом линкоров будет господствовать на морях. Линкоры и авианосцы олицетворяют старое и новое в военно-морском превосходстве."
 VNZ_skilled_pilots:0 "Опытные пилоты"
 VNZ_skilled_pilots_desc:0 "Наши моряки столь же хороши, как [GER.GetAdjective] инженерное дело!"
 VNZ_a_new_grand_fleet:0 "Новый великий флот"
 VNZ_a_new_grand_fleet_desc:0 "Наш флот должен господствовать на море, как в те времена, когда мы победили при Лепанто!"
 VNZ_industrial_effort:0 "Развитие промышленности"
 VNZ_industrial_effort_desc:0 "Сосредоточим все политические усилия на стремительном развитии гражданской промышленности."
 VNZ_industrial_effort_2:0 "Развитие промышленности II"
 VNZ_industrial_effort_2_desc:0 "Железной волей и неустанным трудом мы сможем вновь мобилизовать народ на великий промышленный рывок."
 VNZ_construction_effort_tt:0 "Недостаточно ячеек строительства для §Yфабрик§!"
 VNZ_construction_effort:0 "Аграрная реформа"
 VNZ_construction_effort_desc:0 "."
 VNZ_production_effort:0 "Развивать военное производство"
 VNZ_production_effort_tt:0 "Недостаточно ячеек строительства для §Yвоенного завода§!"
 VNZ_production_effort_desc:0 "Если можно строить тракторы, можно строить и танки! Мы не должны позволить нашим военным производственным мощностям отставать."
 VNZ_construction_effort_2:0 "Реконструкция порта Маргера"
 VNZ_construction_effort_2_desc:0 "Дальнейшее расширение фабрик позволит ускорить производство товаров для торговли и дальнейшего строительства."
 VNZ_production_effort_2:0 "Поддержать промышленность тяжёлой техники"
 VNZ_production_effort_3:0 "Поддержать авиастроение"
 VNZ_production_effort_2_desc:0 "Верхняя часть Адриатики отлично подходит для развития промышленности, ориентированной на экспорт."
 VNZ_production_effort_3_desc:0 "Необходимо и дальше расширять наши военные заводы, чтобы удовлетворить спрос на новое оснащение."
 VNZ_marghera_chemical_industry:0 "Химическая промышленность Маргеры"
 VNZ_marghera_chemical_industry_desc:0 "Это наш единственный шанс получить достаточно топлива для развёртывания флота."
 VNZ_expand_mining:0 "Расширить добычу полезных ископаемых"
 VNZ_expand_mining_desc:0 "Копать глубже! Выиграть войну за ресурсы!"
 VNZ_deterrence_policy:0 "Политика сдерживания"
 VNZ_deterrence_policy_desc:0 "Мы должны быть готовы к неизбежному."
 VNZ_infrastructure_effort:0 "Обновить железные дороги"
 VNZ_infrastructure_effort_desc:0 "Страна без надлежащей инфраструктуры не может осуществлять передовые проекты и строительство."
 VNZ_infrastructure_effort_tt:0 "Недостаточно ячеек строительства для §Yинфраструктуры§!"
 VNZ_synth_oil_effort_tt:0 "Недостаточно ячеек строительства для §Yнефтеперерабатывающего завода§!"
 VNZ_infrastructure_effort_2:0 "Обновить дороги"
 VNZ_infrastructure_effort_2_desc:0 "Расширение инфраструктуры обеспечит транспорт и связь, необходимые для секретных высокотехнологичных проектов."
 VNZ_construction_effort_3:0 "Строить ради будущего"
 VNZ_construction_effort_3_desc:0 "Расширение инфраструктурной сети значительно повысило наши строительные возможности."
 VNZ_nuclear_effort:0 "Пакс Тиби Марце Евангелиста Меус"
 VNZ_nuclear_effort_desc:0 "Стоя на пороге открытия, способного изменить мир, мы не можем позволить другим зажечь огонь, который однажды может поглотить Землю."
 VNZ_extra_tech_slot:0 "Гранты на исследования"
 VNZ_extra_tech_slot_desc:0 "Расширение промышленности и другие недавние достижения могут позволить нам вести больше исследований и разработок параллельно."
 VNZ_extra_tech_slot_2:0 "Комитет координации инноваций"
 VNZ_extra_tech_slot_2_desc:0 "Стремительная индустриализация страны открыла новые возможности в исследованиях и разработках, которыми нам следует воспользоваться."
 VNZ_technology_sharing:0 "Обмен технологиями"
 VNZ_technology_sharing_desc:0 "Обмениваясь технологическими достижениями с союзниками, вся наша фракция сможет эффективнее вести исследования и разработки военного времени."
 VNZ_secret_weapons:0 "Секретное оружие"
 VNZ_secret_weapons_desc:0 "Соблазнительно направить все дополнительные ресурсы на разработку танков и самолётов, но секрет победы в войне кроется в совершенно новых областях науки: электронике, ракетной технике и ядерных исследованиях."
 VNZ_political_effort:0 "Организовать правительство"
 VNZ_political_effort_desc:0 "Чтобы изменить мир, сначала нужно изменить собственную страну. Укрепление наших политических позиций должно стать первым шагом."
 VNZ_collectivist_ethos:0 "Расширить полномочия синдикатов"
 VNZ_collectivist_ethos_desc:0 "Наши враги могут разделять и покорять слабые нации, но наш народ останется един — один за всех и все за одного."
 VNZ_liberty_ethos:0 "Демократический консенсус"
 VNZ_liberty_ethos_desc:0 "Во времена идеологических фанатиков, стремящихся задушить человеческий дух, мы будем защищать личные свободы и права."
 VNZ_militarism:0 "Багаду Стурм"
 VNZ_militarism_desc:0 "Те, кто считает армию неизбежным злом, обречены колебаться перед лицом войны. Мы укореним милитаризм в нашей культуре и станем народом солдат."
 VNZ_political_correctness:0 "Политическая корректность"
 VNZ_political_correctness_desc:0 "Люди, придерживающиеся слегка спорных или просто неловких взглядов, похоже, обеспокоены существованием масштабного заговора против них. Звучит как отличная идея."
 VNZ_neutrality_focus:0 "Ставка на нейтралитет"
 VNZ_neutrality_focus_desc:0 "Другие могут утверждать, что для выбора стороны в мировом конфликте требуются храбрость и мудрость, но мы знаем, что ещё больше их требуется, чтобы отказаться от выбора."
 VNZ_interventionism_focus:0 "Ставка на интервенционизм"
 VNZ_interventionism_focus_desc:0 "Мы ценим свободу всех людей, а не только собственных граждан. Если для предотвращения тирании потребуется война — пусть будет так."
 VNZ_military_youth:0 "Кадервенн"
 VNZ_military_youth_desc:0 "Организации, призванные прививать молодёжи дисциплину и политическое образование, с ранних лет воспитают верность и готовность к самопожертвованию."
 VNZ_deterrence:0 "Сдерживание"
 VNZ_deterrence_desc:0 "Оставаясь в одиночестве, мы редко получаем выгоду от войны. К счастью, мы знаем, что лучшая оборона — та, о которой всем известно настолько хорошо, что применять её никогда не приходится."
 VNZ_volunteer_corps:0 "Добровольческий корпус"
 VNZ_volunteer_corps_desc:0 "Принуждать людей умирать за идеалы свободы было бы иронией, но дать возможность тем, кто добровольно хочет помочь людям за рубежом, — совсем другое дело."
 VNZ_paramilitarism:0 "Интегрировать ополчение"
 VNZ_paramilitarism_desc:0 "Военные принципы применимы и за пределами армии. Если мы создадим полувоенные формирования в дополнение к вооружённым силам, больше людей получит военную подготовку."
 VNZ_indoctrination_focus:0 "Идеологическая обработка"
 VNZ_indoctrination_focus_desc:0 "Раз уж установлено, что наша идеология основана на истине, её следует преподавать как истину. Образование и средства массовой информации должны отражать этот урок."
 VNZ_foreign_expeditions:0 "Зарубежные экспедиции"
 VNZ_foreign_expeditions_desc:0 "Раз наши враги готовы вмешиваться в далёкие конфликты ради своих идеалов, мы должны быть готовы делать то же самое ради наших."
 VNZ_why_we_fight:0 "Почему мы сражаемся"
 VNZ_why_we_fight_effect:0 "Если у нас нет национального духа §YНейтральная внешняя политика§!, мы сможем создавать фракции.\n"
 VNZ_why_we_fight_desc:0 "Мир становится всё опаснее. Наш народ должен увидеть зверства, совершаемые теми, кто жаждет власти. Мы сплотим людей вокруг нашего дела и добьёмся того, чтобы каждый был готов сражаться за нашу свободу."
 VNZ_political_commissars:0 "Политические комиссары"
 VNZ_political_commissars_desc:0 "Чтобы гарантировать выполнение нашей политики в военной практике, мы введём политически назначаемых чиновников в армейские ряды."
 VNZ_internationalism_focus:0 "Ставка на интернационализм"
 VNZ_internationalism_focus_desc:0 "Идеология не знает границ. Другая нация может называть себя суверенной, но наши убеждения выше подобных притязаний."
 VNZ_nationalism_focus:0 "Бретонская национальная партия"
 VNZ_ultra_nationalism_focus:0 "Брейз Атао"
 VNZ_nationalism_focus_desc:0 "Наша нация уникальна, и наши политические достижения могли свершиться только здесь. Мы должны сражаться за неё любой ценой."
 VNZ_ideological_fanaticism:0 "Идеологический фанатизм"
 VNZ_ideological_fanaticism_desc:0 "Наши политически утверждённые ценности и цели столь же достойны смерти, как любая древняя вера. Каждый сторонник должен быть готов встретить смерть, а тем, кто сбился с пути, лучше тоже приготовиться к ней."
 VNZ_conservatism_focus:0 "Влияние католицизма"
 VNZ_conservatism_focus_desc:0 "Влияние католицизма."
 VNZ_welfare_focus:0 "Социальные реформы"
 VNZ_political_coalition_focus:0 "Политическая коалиция"
 VNZ_political_coalition_focus_desc:0 "Политическая коалиция."
 VNZ_rearmement_agreement:0 "Соглашение о перевооружении"
 VNZ_rearmement_agreement_desc:0 "На фоне роста мировой напряжённости крайне важно улучшить нашу военную организацию и гражданскую оборону."
 VNZ_coastal_defense:0 "Береговая оборона"
 VNZ_coastal_defense_desc:0 "Защитить порты!"
 VNZ_power_to_the_people:0 "Власть народу"
 VNZ_power_to_the_people_desc:0 "Большинство должно править!"
 VNZ_strikes_for_democracy:0 "Забастовки за демократию"
 VNZ_strikes_for_democracy_desc:0 "Тираны должны пасть!"
 VNZ_representative_grand_council:0 "Учредить представительный Большой совет"
 VNZ_representative_grand_council_desc:0 "Наш новый Большой совет должен стать ведущей силой эффективной демократии."
 VNZ_secure_international_protection:0 "Обеспечить международную защиту"
 VNZ_secure_international_protection_desc:0 "Наш режим слишком хрупок, чтобы вступать в военный союз с какой-либо иностранной державой. Но мы всегда можем заручиться их дипломатической поддержкой нашего дела иным способом."
 VNZ_secure_security_ministry:0 "Взять под контроль Министерство безопасности"
 VNZ_secure_security_ministry_desc:0 "Контроль над Министерством безопасности будет необходим в нашем походе на свержение буржуазии."
 VNZ_enforce_atheism:0 "Насаждать атеизм"
 VNZ_enforce_atheism_desc:0 "Простые мужчины и женщины не должны следовать сомнительным верованиям, внушаемым каким-то стариком в нарядных одеждах. Если кто-то откажется от этого, мы не должны колебаться и заставим его."
 VNZ_take_over_the_government:0 "Захватить правительство"
 VNZ_take_over_the_government_desc:0 "Время пришло; красные звёзды сошлись."
 VNZ_internal_security_initiative:0 "Инициатива внутренней безопасности"
 VNZ_internal_security_initiative_desc:0 "Совет десяти постановил арестовать тех, кого сочтут угрозой Светлейшей Республике."
 VNZ_leone_di_san_marco_party:0 "Партия Леоне ди Сан-Марко"
 VNZ_leone_di_san_marco_party_desc:0 "Партия Леоне ди Сан-Марко"
 VNZ_defenders_of_saint_marc:0 "Защитники Святого Марка"
 VNZ_defenders_of_saint_marc_desc:0 "Мы должны мобилизовать население на защиту Святого Марка и его государства."
 VNZ_expand_the_terra_ferma:0 "Расширить Терраферму"
 VNZ_expand_the_terra_ferma_desc:0 "Когда-то мы были едины с Ломбардией; вероятно, они будут рады нашему правлению."
 VNZ_reintegrate_dalmatia:0 "Реинтегрировать Далмацию"
 VNZ_reintegrate_dalmatia_desc:0 "Мы контролировали Далмацию веками и снова будем ею владеть."
 VNZ_union_with_italy:0 "Союз с Италией"
 VNZ_union_with_italy_desc:0 "Словно снова наступили 1860-е. Объединимся с Италией!"
 VNZ_absolute_dedication:0 "Абсолютная преданность"
 VNZ_absolute_dedication_desc:0 "Всё ради Святого Марка!"
 VNZ_rally_the_industrialists:0 "Сплотить промышленников"
 VNZ_rally_the_industrialists_desc:0 "Промышленные магнаты, вероятно, предпочтут стабильный режим демократической и социалистической нестабильности."
 VNZ_venitian_fascism:0 "Венецианский фашизм"
 VNZ_venitian_fascism_desc:0 "Наше движение не итальянское — оно по-настоящему венецианское!"
 VNZ_economic_mobilisation:0 "Экономическая мобилизация"
 VNZ_economic_mobilisation_desc:0 "Мы должны подготовиться к войне."
 VNZ_find_fascist_allies:0 "Найти фашистских союзников"
 VNZ_find_fascist_allies_desc:0 "Мы, националисты всех стран, объединились на международном конгрессе, чтобы бороться против возмутительных интернационалистских настроений рабочих!"
 VNZ_form_mechanics:0 "Подготовленные механики"
 VNZ_form_mechanics_desc:0 "Хорошо смазанная машина — работающая машина."
 VNZ_industrial_modernization:0 "Промышленная модернизация"
 VNZ_industrial_modernization_desc:0 "Я пишу это, пока жду COH2"
