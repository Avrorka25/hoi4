 CAN_degauss_ship_hulls:0 "Судно Degauss корабль Hulls"
 CAN_degauss_ship_hulls_desc:0 "Мы начнем размагничивать корпуса наших кораблей, уменьшая их магнитную сигнатуру. Это защищает их от магнитных мин и уменьшает электронный профиль кораблей."
