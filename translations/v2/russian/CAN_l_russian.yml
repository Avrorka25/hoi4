 r56_CAN_royal_twenty_centers:0 "[Root.GetTwentyCentersName]"
 r56_CAN_royal_twenty_centers_desc:0 "Из-за §YВеликой депрессии§! правительство утвердило спорную общенациональную систему лагерей, предоставляющих работу одиноким, безработным и бездомным [CAN.GetAdjective] мужчинам. Их называют Королевскими двадцатицентовыми центрами из-за ежедневной платы в 20 центов. Они работают много часов в неделю за мизерную оплату, поэтому трудовая дисциплина оставляет желать лучшего. Эти лагеря уже становились причиной нескольких беспорядков, и в будущем их может быть ещё больше, если мы не закроем их.\n\n§YВ будущем возможны беспорядки.§!"
 R56_CAN_TWENTY_CENTERS_ROYAL:0 "Королевские двадцатицентовые центры"
 R56_CAN_TWENTY_CENTERS:0 "Двадцатицентовые центры"
 r56_CAN_royal_twenty_centers_angered:0 "[Root.GetTwentyCentersAngeredName]"
 r56_CAN_royal_twenty_centers_angered_desc:0 "Из-за §YВеликой депрессии§! правительство утвердило спорную общенациональную систему лагерей, предоставляющих работу одиноким, безработным и бездомным [CAN.GetAdjective] мужчинам. Их называют Королевскими двадцатицентовыми центрами из-за ежедневной платы в 20 центов. Они работают много часов в неделю за мизерную оплату, поэтому трудовая дисциплина оставляет желать лучшего. Эти лагеря уже становились причиной нескольких беспорядков, и в будущем их может быть ещё больше, если мы не закроем их.\n\nПоскольку для подавления бунта была применена сила, обитатели двадцатицентовых центров разгневаны ещё сильнее. §RВ будущем возможны серьёзные беспорядки§!"
