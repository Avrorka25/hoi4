 r56_CAN_secure_the_economy_idea:0 "Обеспечение экономики"
 r56_CAN_modernize_industry:0 "Модернизировать промышленность"
 r56_CAN_modernize_industry_desc:0 "Наши промышленные мощности и методы отстали; необходимо наверстать упущенное."
 r56_can_rifle_association:0 "Стрелковая ассоциация Доминиона Канада"
 r56_can_rifle_association_desc:0 "Стрелковая ассоциация Доминиона Канада была основана в 1868 году и официально учреждена парламентским актом в 1900 году. Следует поддержать расширение организации, чтобы больше канадских мужчин научились обращаться с огнестрельным оружием."
 r56_CAN_wheat_board:0 "[CAN.GetAdjective] пшеничное управление"
 r56_CAN_wheat_board_desc:0 "Создание [CAN.GetAdjective] пшеничного управления для установления цен на пшеницу и ячмень наших трудолюбивых фермеров стабилизирует рынок и улучшит экономику."
 r56_CAN_depression_recovery:0 "Продолжить восстановление после депрессии"
 r56_CAN_depression_recovery_desc:0 "Великая депрессия нанесла нам тяжёлый урон. Нужно продолжать адаптировать и изменять политику, чтобы двигаться по пути восстановления."
 r56_CAN_national_housing_act:0 "Национальный жилищный закон"
 r56_CAN_national_housing_act_desc:0 "Последствия Великой депрессии оставили многих [CAN.GetAdjective] без жилья и работы. Программы и правила по ремонту и модернизации существующих домов, а также строительству нового жилья помогут пострадавшим вновь встать на ноги."
 r56_CAN_shutdown_relief_camps:0 "Закрыть лагеря помощи"
 r56_CAN_shutdown_relief_camps_desc:0 "Лагеря помощи безработным не оправдали себя. Следует закрыть их, пока не вспыхнули новые беспорядки."
 r56_CAN_dollar_a_year_men:0 "Люди за доллар в год"
 r56_CAN_dollar_a_year_men_desc:0 "Несколько опытных руководителей компаний предложили свои услуги правительству за символический доллар в год. Следует привлечь их к работе в Министерстве боеприпасов и снабжения и Управлении военных цен и торговли, где они предоставят [CAN.GetAdjective] промышленности столь необходимый опыт мобилизации экономики и увеличения производства."
 r56_CAN_canadian_pacific_railways:0 "Канадские тихоокеанские железные дороги"
 r56_CAN_canadian_pacific_railways_desc:0 "Канадская тихоокеанская железная дорога предоставила свои пути и транспорт для военных нужд. Наши войска и необходимые им припасы будут без задержек пересекать великий Доминион между морями и континентом."
 r56_CAN_national_steel_car:0 "National Steel Car"
 r56_CAN_national_steel_car_desc:0 "Несмотря на тяжёлые последствия депрессии для компании, National Steel Car готова использовать свои знания и опыт для производства транспорта, который будет перевозить войска и армейское снаряжение по расширенной железнодорожной сети."
 r56_CAN_cbc_focus:0 "Канадская радиовещательная корпорация"
 r56_CAN_cbc_focus_desc:0 "Канадская радиовещательная корпорация является национальной сетью радиовещания и регулирует радиоэфир в [CAN.GetNameDef]. Используя её для распространения сообщений о государственной политике и программах, мы укрепим доверие общества к правительству."
 r56_CAN_bank_of_canada:0 "Национализировать Банк Канады"
 r56_CAN_bank_of_canada_desc:0 "После Великой депрессии потребность в центральном банке стала ещё важнее. Национализация позволит напрямую управлять государственными финансами и улучшить экономику."
 r56_CAN_john_inglis_company:0 "John Inglis and Company"
 r56_CAN_john_inglis_company_desc:0 "Во время Великой депрессии компания John Inglis and Company переживала тяжёлые времена, но давно является важной частью наших производственных возможностей. Следует поручить ей выпуск новых пулемётов и артиллерии для вооружения войск."
 r56_CAN_national_railway:0 "Расширить железные дороги в Квебеке"
 r56_CAN_national_railway_desc:0 "Улучшение инфраструктуры и железных дорог Квебека может стимулировать дальнейший рост промышленности."
 r56_CAN_research_grants:0 "Исследовательские гранты"
 r56_CAN_research_grants_desc:0 "Благодаря значительно расширившейся промышленности и производственным возможностям больше [CAN.GetAdjective] учёных и изобретателей смогут вести собственные исследования и разработки."
 r56_CAN_debt_adjustment_act:0 "Закон об урегулировании долгов"
 r56_CAN_debt_adjustment_act_desc:0 "Среди [CAN.GetAdjective] фермеров распространилась тревожная волна банкротств и задолженности. В интересах [CAN.GetNameDef] помочь им, чтобы они продолжали обрабатывать землю."
 r56_CAN_alcan:0 "Алюминиевая компания Канады"
 r56_CAN_alcan_desc:0 "Алюминий лёгок и устойчив к коррозии. Расширяя его добычу и производство, мы сможем постоянно снабжать заводы и сборочные линии."
 r56_CAN_imperial_oil_focus:0 "Расширение НПЗ Дартмут"
 r56_CAN_imperial_oil_focus_desc:0 "В прошлом конфликте в Дартмуте работал нефтеперерабатывающий завод, обеспечивавший наши потребности в топливе. Его расширение жизненно важно для неизбежных переходов конвоев через Северную Атлантику."
 r56_CAN_establish_the_polymer_corporation:0 "Основать Polymer Corporation"
 r56_CAN_establish_the_polymer_corporation_desc:0 "Если доступ к натуральному каучуку будет отрезан, необходимо развить производство и переработку синтетического каучука, используемого повсюду — от шин до деталей самолётов."
 r56_CAN_uranium_mining:0 "Добыча урана"
 r56_CAN_uranium_mining_desc:0 "Особая руда, добываемая в [CAN.GetNameDef], является ключом к оружию невероятной разрушительной силы. Мы первыми начнём максимально использовать этот ресурс."
 r56_CAN_resources_for_war_effort:0 "Ресурсы для военных нужд"
 r56_CAN_resources_for_war_effort_desc:0 "Постоянное совершенствование методов добычи ресурсов позволяет работать эффективнее."
 r56_CAN_enlist_the_unemployed:0 "Призвать безработных"
 r56_CAN_enlist_the_unemployed_desc:0 "Вопрос военной службы остаётся болезненным для [CAN.GetAdjective]. Чтобы удовлетворить потребность вооружённых сил в людях и не расколоть [CAN.GetNameDef], мы будем поощрять безработных вступать в армию и заверим их, что не отправим за границу."
 r56_CAN_war_economy:0 "Экономика военного времени"
 r56_CAN_war_economy_desc:0 "Наша промышленность и заводы оправились от худших последствий Великой депрессии. Пора переориентировать их на производство достаточного количества вооружений для нас и союзников."
 r56_CAN_war_measures_act:0 "Вновь ввести Закон о военных мерах"
 r56_CAN_war_measures_act_desc:0 "Закон о военных мерах определяет чрезвычайные меры, которые можно принять при объявлении войны, вторжении или восстании."
 r56_CAN_wartime_prices_and_trade_board:0 "Управление военных цен и торговли"
 r56_CAN_wartime_prices_and_trade_board_desc:0 "Управление военных цен и торговли — первая линия защиты от инфляции и социальных волнений в [CAN.GetNameDef]. Для предотвращения спекуляции и накопительства введён контроль цен, делающий товары доступными большинству [CAN.GetAdjective]."
 r56_CAN_nrma:0 "Закон о мобилизации национальных ресурсов"
 r56_CAN_nrma_desc:0 "Канада огромна, а население рассредоточено по всей стране. Следует создать систему учёта занятости, чтобы находить всех, кто пригоден к службе за рубежом."
 r56_CAN_conscription_crisis:0 "Принудительный призыв"
 r56_CAN_conscription_crisis_desc:0 "Как и в 1917 году, наши франкоканадские граждане в Квебеке сопротивляются идее всеобщего призыва для пополнения армии. Мы не позволим одному меньшинству бросить вызов воле [CAN.GetNameDef]."
 r56_CAN_replace_men_in_the_industry:0 "Заменить мужчин в промышленности женщинами"
 r56_CAN_replace_men_in_the_industry_desc:0 "Пока мужчины нужны стране для службы за рубежом, промышленным предприятиям по-прежнему необходимы рабочие руки. Возможно, настало время женщинам внести свой вклад, производя вооружение, которым вскоре воспользуются эти мужчины."
 r56_CAN_department_of_munitions_and_supply:0 "Министерство боеприпасов и снабжения"
 r56_CAN_department_of_munitions_and_supply_desc:0 "Производство вооружения и снаряжения жизненно важно для военных усилий. Мы передадим национальные ресурсы [CAN.GetNameDef] под управление К. Д. Хау в Министерстве боеприпасов и снабжения."
 r56_CAN_bits_and_pieces_program:0 "Программа «По частям»"
 r56_CAN_bits_and_pieces_program_desc:0 "Программа «По частям» мобилизует для военных нужд несколько небольших фабрик, ранее выпускавших простые потребительские товары. Даже скромный велосипедный завод способен наладить производство пулемётов."
 r56_CAN_nrc_expansion:0 "Расширить Национальный исследовательский совет"
 r56_CAN_nrc_expansion_desc:0 "Национальный исследовательский совет доказал свою эффективность в повышении качества жизни в Канаде. Учитывая его научные достижения и растущую потребность в исследователях, настало время значительно усилить его ради защиты [CAN.GetNameDef]."
 r56_CAN_defence_of_canada_regulations:0 "Правила обороны Канады"
 r56_CAN_defence_of_canada_regulations_desc:0 "В военное время гражданские права необходимо ограничить, чтобы предотвратить подрыв военных усилий. Это означает ограничения для прессы, оппозиционных групп и юридических прав."
 r56_CAN_british_designs:0 "[Root.GetBritishDesignsName]"
 r56_CAN_british_designs_desc:0 "[Root.GetBritishDesignsDesc]"
 R56_CAN_ENG_KEY:0 "[ENG.GetAdjective] разработки"
 R56_CAN_FREE_KEY:0 "Наши разработки"
 R56_CAN_SOV_KEY:0 "[SOV.GetAdjective] разработки"
 R56_CAN_USA_KEY:0 "[USA.GetAdjective] разработки"
 R56_CAN_GER_KEY:0 "[GER.GetAdjective] разработки"
 R56_CAN_ENG_DESC_KEY:0 "Следует импортировать и использовать [ENG.GetAdjective] разработки пехотного и артиллерийского вооружения."
 R56_CAN_FREE_DESC_KEY:0 "Следует самостоятельно разрабатывать пехотное и артиллерийское вооружение."
 R56_CAN_SOV_DESC_KEY:0 "Следует импортировать и использовать [SOV.GetAdjective] разработки пехотного и артиллерийского вооружения."
 R56_CAN_USA_DESC_KEY:0 "Следует импортировать и использовать [USA.GetAdjective] разработки пехотного и артиллерийского вооружения."
 R56_CAN_GER_DESC_KEY:0 "Следует импортировать и использовать [GER.GetAdjective] разработки пехотного и артиллерийского вооружения."
 r56_CAN_army_modernisation:0 "Модернизация армии"
 r56_CAN_army_modernisation_desc:0 "Слишком долго Канада считала себя в безопасности в своём несгораемом доме, вдали от легковоспламеняющихся материалов, и позволяла армии довольствоваться устаревшими снаряжением и подготовкой. Необходимо начать модернизацию, пока не стало слишком поздно."
 r56_CAN_increase_budget:0 "Увеличить военный бюджет"
 r56_CAN_increase_budget_desc:0 "Мы слишком долго лишали вооружённые силы средств на модернизацию снаряжения и проведение учений. В условиях приближающегося конфликта пора подготовиться настолько хорошо, насколько позволяют наши возможности."
 r56_CAN_increase_budget_more:0 "Продолжить увеличение военного бюджета"
 r56_CAN_increase_budget_more_desc:0 "Поскольку напряжённость по всему миру продолжает расти, разумно и дальше вкладываться в безопасность [CAN.GetNameDef]."
 r56_CAN_cmp_truck:0 "Грузовик CMP"
 r56_CAN_cmp_truck_desc:0 "[CAN.GetNameDef] располагает крупной автомобильной промышленностью, способной выпускать огромное количество транспорта для вооружённых сил. Наш грузовик CMP универсален и подходит для различных климатических условий и типов местности."
 r56_CAN_valentine_tank:0 "Танк «Валентайн»"
 r56_CAN_valentine_tank_desc:0 "Мы получили лицензию на производство танка «Валентайн» — надёжной средней машины [ENG.GetAdjective] разработки."
 r56_CAN_retool_angus_shops:0 "Переоборудовать мастерские CPR Angus"
 r56_CAN_retool_angus_shops_desc:0 "Мастерские Ангус были известны производством, ремонтом и продажей железнодорожных вагонов для CPR. Небольшие инвестиции и переоснащение позволят использовать их оборудование и опыт для выпуска танков, крайне необходимых современной механизированной армии."
 r56_CAN_canadian_armoured_corps:0 "[Root.GetArmouredCorpsName]"
 r56_CAN_canadian_armoured_corps_desc:0 "Наша автомобильная промышленность накопила достаточно опыта в производстве бронетехники. Теперь можно заняться собственными проектами для оснащения бронетанкового корпуса."
 R56_CAN_ARMOURED_CORPS:0 "[CAN.GetAdjective] бронетанковый корпус"
 R56_CAN_ARMOURED_CORPS_ROYAL:0 "Королевский [CAN.GetAdjective] бронетанковый корпус"
 r56_CAN_kangaroo:0 "«Кенгуру»"
 r56_CAN_kangaroo_desc:0 "Несмотря на внушительную огневую мощь, танк уязвим без поддержки пехоты. К счастью, войска можно перевозить на быстрых бронированных машинах, чтобы захватывать цели и совместно поддерживать танки. Необходимо разрешить производство такой техники."
 r56_CAN_the_ram:0 "«Рэм»"
 r56_CAN_the_ram_desc:0 "Мы получили от южного соседа чертежи для создания местного варианта надёжного и достаточно хорошо бронированного танка."
 r56_CAN_royal_canadian_artillery:0 "[Root.GetArtilleryCorpsName]"
 r56_CAN_royal_canadian_artillery_desc:0 "Несмотря на нехватку современных орудий, необходимо начать готовить артиллеристов к современной войне, включая применение зенитных пушек и новых 25-фунтовых орудий."
 R56_CAN_ARTILLERY_CORPS:0 "[CAN.GetAdjective] артиллерия"
 R56_CAN_ARTILLERY_CORPS_ROYAL:0 "Королевская [CAN.GetAdjective] артиллерия"
 r56_CAN_royal_canadian_corps_of_signals:0 "[Root.GetSignalCorpsName]"
 r56_CAN_royal_canadian_corps_of_signals_desc:0 "[Root.GetSignalCorpsDesc]"
 R56_CAN_SIGNAL_CORPS:0 "[CAN.GetAdjective] корпус связи"
 R56_CAN_SIGNAL_CORPS_ROYAL:0 "Королевский [CAN.GetAdjective] корпус связи"
 R56_CAN_SIGNAL_CORPS_DESC:0 "Канадский корпус связи был создан в 1903 году, а после изобретения переносной радиостанции станет ещё полезнее."
 R56_CAN_SIGNAL_CORPS_ROYAL_DESC:0 "Королевский канадский корпус связи был создан в 1903 году, а после изобретения переносной радиостанции станет ещё полезнее."
 r56_CAN_small_arms_limited:0 "Small Arms Ltd."
 r56_CAN_small_arms_limited_desc:0 "Мы обеспечили финансирование и привлекли обученных за рубежом специалистов по производству огнестрельного оружия. Для удовлетворения потребности в пехотном вооружении компания с подходящим названием получит землю и инфраструктуру для его выпуска."
 r56_CAN_camp_borden:0 "Лагерь Борден"
 r56_CAN_camp_borden_desc:0 "Во время Великой войны лагерь Борден использовался для подготовки частей Канадского экспедиционного корпуса. Расширение лагеря для обучения бронетанкового корпуса и пехоты станет первым шагом к повышению эффективности войск."
 r56_CAN_land_mattress:0 "«Наземный матрас»"
 r56_CAN_land_mattress_desc:0 "Эти метко названные установки обстреливают территорию ракетами, превосходя обычную артиллерию по дальности и мощности взрыва."
 r56_CAN_first_special_service_force:0 "Первое подразделение специального назначения"
 r56_CAN_first_special_service_force_desc:0 "Для необычных и опасных заданий потребуется специальное подразделение коммандос. Мы создадим его при помощи союзников."
 r56_CAN_walkie_talkie:0 "Переносная радиостанция"
 r56_CAN_walkie_talkie_desc:0 "Дональд Хингс изобрёл и патентует новое переносное устройство двусторонней радиосвязи. Оно значительно улучшит связь и целеуказание."
 r56_CAN_start_the_expansion_of_the_rcaf:0 "[Root.GetRCAFArmamentName]"
 r56_CAN_start_the_expansion_of_the_rcaf_desc:0 "Канадский авиационный корпус — самый молодой род канадских вооружённых сил. Следует подготовить новое поколение пилотов к грядущим конфликтам."
 R56_CAN_RCAF:0 "Начать расширение ККВВС"
 R56_CAN_CAF:0 "Начать расширение КВВС"
 r56_CAN_western_air_command:0 "Западное авиационное командование"
 r56_CAN_western_air_command_desc:0 "Западная часть страны малонаселена, и её трудно полностью охватить патрулями. Для обнаружения подозрительной активности над Тихим океаном придётся полагаться на системы раннего предупреждения, например сеть радиолокационных станций."
 r56_CAN_hurricane:0 "«Харрикейн»"
 r56_CAN_hurricane_desc:0 "[ENG.GetNameDefCap] разрешила нам развернуть производство истребителей «Харрикейн». Эти самолёты станут основой наших авиационных частей."
 r56_CAN_canadian_car_and_foundry:0 "Canadian Car and Foundry"
 r56_CAN_canadian_car_and_foundry_desc:0 "Компания CC&F давно производит автомобили и другую моторизованную технику. Предоставление ей ресурсов и контрактов на выпуск планеров для авиационного корпуса станет правильным шагом в развитии военного производства."
 r56_CAN_fairchild_aircraft_company:0 "Fairchild Aircraft Company"
 r56_CAN_fairchild_aircraft_company_desc:0 "Авиационный завод Fairchild в Квебеке следует обеспечить ресурсами для увеличения производства деталей бомбардировщиков. Это позволит создать на предприятии тысячи новых рабочих мест."
 r56_CAN_victory_aircraft_company:0 "Victory Aircraft"
 r56_CAN_victory_aircraft_company_desc:0 "Компании Victory Aircraft поручено строить наш бомбардировочный флот. «Ланкастеры» для всех!"
 r56_CAN_bomber_group_no_6:0 "Бомбардировочная группа № 6"
 r56_CAN_bomber_group_no_6_desc:0 "Наши храбрые лётчики накопили огромный опыт бомбардировок заводов враждебных стран. Следует сохранить их на службе и назначить инструкторами для подготовки нового поколения пилотов бомбардировочной авиации."
 r56_CAN_toronto_island_airport:0 "Аэропорт Торонто-Айленд"
 r56_CAN_toronto_island_airport_desc:0 "Дополнительные аэропорты одновременно обеспечат гражданские перевозки и размещение самолётов для подготовки пилотов."
 r56_CAN_toronto_air_command:0 "Учебное авиационное командование Торонто"
 r56_CAN_toronto_air_command_desc:0 "Благодаря расширенной инфраструктуре и новому оборудованию мы наконец можем всерьёз начать подготовку [CAN.GetAdjective] лётчиков."
 r56_CAN_eastern_air_command:0 "Восточное авиационное командование"
 r56_CAN_eastern_air_command_desc:0 "В случае глобального конфликта нам, вероятно, придётся защищать конвои в Северной Атлантике. Строительство авиабаз для экипажей и самолётов станет разумным вложением в защиту конвоев на этом театре действий."
 r56_CAN_rcaf_womens_division:0 "[Root.GetRCAFWomensDivisionName]"
 r56_CAN_rcaf_womens_division_desc:0 "Допуск [CAN.GetAdjective] женщин к службе в военно-воздушных силах освободит больше мужчин для участия в дополнительных операциях."
 R56_CAN_RCAF_WOMEN:0 "Женская дивизия ККВВС"
 R56_CAN_CAF_WOMEN:0 "Женская дивизия КВВС"
 r56_CAN_rcaf_station_borden:0 "[Root.GetRCAFStationBordenName]"
 r56_CAN_rcaf_station_borden_desc:0 "Канадский авиационный корпус зародился в Бордене, провинция Онтарио, и эту базу следует использовать для подготовки нового поколения пилотов."
 R56_CAN_RCAF_STATION_BORDEN:0 "Станция ККВВС Борден"
 R56_CAN_CAF_STATION_BORDEN:0 "Станция КВВС Борден"
 r56_CAN_appoint_air_chief:0 "Назначить начальника штаба ВВС"
 r56_CAN_appoint_air_chief_desc:0 "Хотя военно-воздушные силы значительно моложе других родов войск, они представляют серьёзную мощь, всё ещё скованную подчинением армии. Назначение начальника штаба ВВС станет первым шагом к их расширению и модернизации."
 r56_CAN_complete_separation_from_army:0 "Полностью отделить ВВС от армии"
 r56_CAN_complete_separation_from_army_desc:0 "[CAN.GetAdjective] военно-воздушные силы теперь обладают чёткой структурой и собственными уникальными возможностями. Пришло время сделать их самостоятельным родом войск!"
 r56_CAN_rebuilding_the_royal_canadian_navy:0 "[Root.GetRebuildCanadianNavyName]"
 r56_CAN_rebuilding_the_royal_canadian_navy_desc:0 "После многолетних сокращений бюджета наш флот находится в плачевном состоянии. Растущая международная напряжённость требует восстановить его для достижения наших целей."
 R56_CAN_REBUILD_RCN:0 "Восстановить Королевский [CAN.GetAdjective] флот"
 R56_CAN_REBUILD_CN:0 "Восстановить [CAN.GetAdjective] флот"
 r56_CAN_halifax_shipyards:0 "Верфи Галифакса"
 r56_CAN_halifax_shipyards_desc:0 "Удобно расположенные напротив Европы доки Галифакса строят новые корабли рекордными темпами. Мы способны выиграть битву за Атлантику."
 r56_CAN_sorel_shipyards:0 "Верфи Сореля"
 r56_CAN_sorel_shipyards_desc:0 "В Сореле расположена крупная металлообрабатывающая промышленность. Инвестиции и контракты на строительство кораблей стимулируют экономику и предоставят флоту верфи для выпуска новых судов."
 r56_CAN_reopen_toronto_shipyards:0 "Вновь открыть верфи Торонто"
 r56_CAN_reopen_toronto_shipyards_desc:0 "Восстановление судостроительных мощностей Торонто жизненно важно для увеличения числа кораблей."
 r56_CAN_sorel_industries_naval_artillery:0 "Морская артиллерия Sorel Industries"
 r56_CAN_sorel_industries_naval_artillery_desc:0 "Sorel Industries объединяет верфи и заводы тяжёлого вооружения в одном месте. Вполне логично устанавливать эти орудия на корабли."
 NIR_naval_grade_steel:0 "Корабельная сталь"
 NIR_naval_grade_steel_desc:0 "Благодаря новым инвестициям и опыту в судостроении Sorel Industries улучшила металлообработку, что позволяет устанавливать на корабли более совершенную броню."
 CAN_pykrete_carrier:0 "Авианосец из пайкрита"
 CAN_pykrete_carrier_desc:0 "Изобретатель Джеффри Пайк предложил создать необычный корабль из спрессованного льда, смешанного с древесной массой. На первый взгляд это звучит безумно, но в случае успеха позволит построить колоссальное судно изо льда. Кодовое название уже выбрано: «проект Хабаккук»."
 r56_CAN_focus_on_destroyers:0 "Сосредоточиться на эсминцах"
 r56_CAN_focus_on_destroyers_desc:0 "Угроза атак подводных лодок на конвои снабжения и перевозки войск требует сосредоточиться на строительстве эсминцев для поиска и уничтожения этих подводных опасностей."
 r56_CAN_protect_atlantic_shipping:0 "Защитить судоходство в Атлантике"
 r56_CAN_protect_atlantic_shipping_desc:0 "Новые тактики и подготовка по сопровождению конвоев хорошо послужат нам в грядущих сражениях."
 r56_CAN_merchant_fleet:0 "Торговый флот"
 r56_CAN_merchant_fleet_desc:0 "Конвои станут жизненно важной линией снабжения наших зарубежных войск и союзников. Мы создадим торговый флот."
 r56_CAN_fight_the_uboats:0 "Борьба с подводными лодками"
 r56_CAN_fight_the_uboats_desc:0 "Подводную угрозу невозможно отрицать. Наши войска получат дополнительную подготовку и необходимое снаряжение для борьбы с ней."
 r56_CAN_degaussing:0 "Размагничивание"
 r56_CAN_degaussing_desc:0 "Мы начнём размагничивать корпуса кораблей, уменьшая их магнитную сигнатуру. Это защитит их от магнитных мин и снизит электронную заметность."
 r56_CAN_expand_the_navy:0 "Расширить флот"
 r56_CAN_expand_the_navy_desc:0 "Строительство новых верфей поможет осуществить планы расширения военно-морских сил."
 r56_CAN_wrens:0 "[Root.GetWrensName]"
 r56_CAN_wrens_desc:0 "Создание в составе флота подразделения, позволяющего женщинам служить, поможет его расширению и привлечёт больше добровольцев."
 R56_CAN_WRENS_NAME:0 "Женская королевская [CAN.GetAdjective] военно-морская служба"
 R56_CAN_WENS_NAME:0 "Женская [CAN.GetAdjective] военно-морская служба"
 r56_CAN_the_pacific_ocean:0 "Тихий океан"
 r56_CAN_the_pacific_ocean_desc:0 "Наш западный фланг омывается Тихим океаном — огромным пространством для действий врагов. Необходимо подготовиться ко всем возможным обстоятельствам."
 r56_CAN_ships_for_the_pacific:0 "Корабли для Тихого океана"
 r56_CAN_ships_for_the_pacific_desc:0 "Мы можем строить флот вокруг лёгких и тяжёлых крейсеров, располагая достаточным числом портов для осуществления этой стратегии."
 r56_CAN_invasion_transports:0 "Десантные транспорты"
 r56_CAN_invasion_transports_desc:0 "Одного нарушения вражеских морских коммуникаций недостаточно для устранения угрозы [CAN.GetNameDef]. Мы должны нанести первый и быстрый удар, обеспечив войска подходящим снаряжением."
 r56_CAN_rural_class_carriers:0 "Авианосцы типа «Рурал»"
 r56_CAN_rural_class_carriers_desc:0 "Наше географическое положение уникально: между двумя океанами и рядом с великой державой. Для обеспечения господства на море необходимо начать строительство авианосцев, способных доставлять самолёты в бой и защищать морские пути."
 r56_CAN_trust_in_the_commonwealth:0 "Довериться Содружеству"
 r56_CAN_trust_in_the_commonwealth_desc:0 "Другие доминионы — наши самые надёжные друзья, и все мы должны вместе выступить в поддержку Его Величества."
 r56_CAN_commonwealth_air_training_plan:0 "План авиационной подготовки Содружества"
 r56_CAN_commonwealth_air_training_plan_desc:0 "Мы согласуем подготовку лётчиков с союзниками по Содружеству и другими доминионами. Это эффективнее и позволяет безопасно обучать большие группы на наших аэродромах."
 r56_CAN_build_fighters_for_the_empire:0 "Строить истребители для империи"
 r56_CAN_build_fighters_for_the_empire_desc:0 "Империя остро нуждается в лёгких самолётах. Благодаря нашей автомобильной промышленности поставки этих машин станут вкладом в общее дело Содружества."
 r56_CAN_CAMP_X:0 "Лагерь X"
 r56_CAN_CAMP_X_desc:0 "Мы сосредоточим сбор разведданных и подготовку агентов в секретном месте возле Ошавы. Оно удобно расположено для приёма сигналов как из [ENG.GetNameDef], так и из [USA.GetNameDef]."
 r56_CAN_hydra:0 "«Гидра»"
 r56_CAN_hydra_desc:0 "Бенджамин де Форест Бейли построил в лагере X ретрансляционную станцию связи, способную принимать радиопередачи Союзников со всего мира. Теперь мы также можем расшифровывать и читать вражескую почту и радиосообщения вдали от посторонних глаз. Не говорите об этом никому, даже премьер-министру."
 r56_CAN_permanent_joint_defence_board:0 "Постоянный объединённый совет обороны"
 r56_CAN_permanent_joint_defence_board_desc:0 "География и общее наследие связывают нас с [USA.GetNameDef], но континент слишком велик, чтобы одна из наших стран могла защитить его в одиночку. Для консультаций и планирования обороны Северной Америки необходим объединённый совет."
 r56_CAN_british_ships:0 "Приобрести [ENG.GetAdjective] корабли"
 r56_CAN_british_ships_desc:0 "Нам крайне нужны корабли для защиты конвоев. Возможно, мы сможем приобрести несколько у метрополии?"
 r56_CAN_forge_our_own_future:0 "Создать собственное будущее"
 r56_CAN_forge_our_own_future_desc:0 "[CAN.GetNameDefCap] — суверенная страна, и только мы вправе решать, каким путём идти в этом мире."
 r56_CAN_shadow_factories:0 "Теневые заводы"
 r56_CAN_shadow_factories_desc:0 "На нас и наших союзников надвигается буря. Подготовка инфраструктуры и экономики к возможному переходу на военные рельсы будет долгим и тяжёлым процессом."
 r56_CAN_frogmen_of_burma:0 "Боевые пловцы"
 r56_CAN_frogmen_of_burma_desc:0 "При помощи союзников мы можем создать новое элитное подразделение, способное использовать стратегический потенциал подводных пловцов. Лорд Маунтбеттен уже проявил интерес к этому проекту."
 r56_CAN_tizard_visit:0 "Визит Тизарда"
 r56_CAN_tizard_visit_desc:0 "Учёный из метрополии предложил нам по-настоящему многообещающее сотрудничество технических групп и обмен изобретениями, способными выиграть войну."
 r56_CAN_montreal_laboratory:0 "Монреальская лаборатория"
 r56_CAN_montreal_laboratory_desc:0 "Монреальская лаборатория располагает интеллектуальными возможностями для разработки и создания бомбы невероятной мощности, использующей уран для неконтролируемой цепной реакции ядерного деления. Мы воплотим это в жизнь."
 r56_CAN_construct_the_cape_spear_forts:0 "Построить укрепления Кейп-Спир"
 r56_CAN_construct_the_cape_spear_forts_desc:0 "Следует ожидать морского вторжения на наше побережье. Строительство береговых укреплений станет лучшей защитой и эффективным средством сдерживания этой угрозы."
 r56_CAN_fascism:0 "Великая Канада"
 r56_CAN_fascism_desc:0 "Сильная Канада черпает мощь в сильном лидере. Мы объясним народу Канады эту истину."
 r56_CAN_national_social_christian_party:0 "Национальная социал-христианская партия"
 r56_CAN_national_social_christian_party_desc:0 "Возникла партия, провозглашающая идеалы более чистой Канады. Поддержим её и сокрушим коварных коммунистов."
 r56_CAN_the_canadian_fuhrer:0 "[CAN.GetAdjective] фюрер"
 r56_CAN_the_canadian_fuhrer_desc:0 "Появился человек с безграничной любовью к Канаде и железной волей защищать её права. Да здравствует партия! Да здравствует наш вождь!"
 r56_CAN_restrict_immigration:0 "Ограничить иммиграцию"
 r56_CAN_restrict_immigration_desc:0 "[CAN.GetNameDefCap] принадлежит [CAN.GetAdjective] народу, и иначе не будет. Достойные граждане страны не будут утоплены в потоке беженцев с сомнительной верностью."
 r56_CAN_quell_quebec_nationalism:0 "Подавить квебекский национализм"
 r56_CAN_quell_quebec_nationalism_desc:0 "Квебек — неотъемлемая часть [CAN.GetNameDef]. В великой стране [CAN.GetNameDef] вопроса сепаратизма не существует."
 r56_CAN_a_united_canada:0 "Единство [CAN.GetAdjective] народа"
 r56_CAN_a_united_canada_desc:0 "Объединив народ, мы можем распространить нашу славу по всему полушарию. Да здравствует Великая Канада!"
 r56_CAN_arrest_the_anti_fascists:0 "Арестовать антифашистов"
 r56_CAN_arrest_the_anti_fascists_desc:0 "Предательские левые элементы пытаются противостоять естественному порядку вещей. Мы укажем им истинный путь к славе."
 r56_CAN_canadian_union_of_fascists:0 "Канадский союз фашистов"
 r56_CAN_canadian_union_of_fascists_desc:0 "На политической сцене появилась партия, поддерживающая экономическое процветание через союз с деловыми кругами. [CAN.GetNameDefCap] следует помочь этой фракции прийти к победе!"
 r56_CAN_arcand_in_the_government:0 "Аркан в правительстве"
 r56_CAN_arcand_in_the_government_desc:0 "Адриен Аркан — один из немногих людей в [CAN.GetNameDef], кто осознаёт внутренние и внешние проблемы страны. Несмотря на некоторые идеологические разногласия, следует предложить ему место в правительстве."
 r56_CAN_unite_the_fascist_parties:0 "Объединить фашистские организации"
 r56_CAN_unite_the_fascist_parties_desc:0 "Наши методы могут различаться, но конечная цель одна. Мы пройдём этот путь вместе с новыми союзниками."
 r56_CAN_form_the_blue_shirts:0 "Создать синерубашечников"
 r56_CAN_form_the_blue_shirts_desc:0 "Синерубашечники станут главной оборонительной силой и идеологическим стержнем нашего режима. Легализация движения даст достаточно преданных кадров для поддержания работы военной машины."
 r56_CAN_create_youth_wing:0 "Создать молодёжное крыло"
 r56_CAN_create_youth_wing_desc:0 "Молодёжь страны — ключ к воплощению мечты о Великой Канаде."
 r56_CAN_a_one_party_state:0 "Однопартийное государство"
 r56_CAN_a_one_party_state_desc:0 "Многопартийность порождает лишь разногласия и разрушает страну изнутри. Отныне [CAN.GetNameDef] будет управляться единым славным движением масс, созданным массами и для масс."
 r56_CAN_anti_democracy:0 "Антидемократическая страна"
 r56_CAN_anti_democracy_desc:0 "Демократия — пятно на истории, лишающее страны дарованного Богом права на славу."
 r56_CAN_strength_through_conquest_idea:0 "Сила через завоевания"
 r56_CAN_canadian_nationalism:0 "[CAN.GetAdjective] национализм"
 r56_CAN_canadian_nationalism_desc:0 "[CAN.GetNameDefCap] теперь независимая страна с самостоятельным народом. Осознание этого гражданами укрепит их дух против внешнего влияния."
 r56_CAN_strenght_through_conquest:0 "Сила через завоевания"
 r56_CAN_strenght_through_conquest_desc:0 "Только пройдя через горнило конфликта, [CAN.GetNameDef] сможет процветать."
 r56_CAN_seek_closer_ties_to_germany:0 "Укрепить связи с [GER.GetNameDef]"
 r56_CAN_seek_closer_ties_to_germany_desc:0 "[GER.GetLeader] показал себя разумным человеком, выдвигающим разумные требования и укрепляющим свою страну. Мы присоединимся к [GER.GetNameDef] ради новой золотой эпохи."
 r56_CAN_demand_newfoundland_and_labrador:0 "Потребовать Ньюфаундленд и Лабрадор"
 r56_CAN_demand_newfoundland_and_labrador_desc:0 "Ньюфаундленд — неудавшийся доминион, которому пришлось вернуться к колониальному статусу. Его законное место — в составе [CAN.GetNameDef]. Мы больше не потерпим их власть над нашими землями и заберём их любой ценой."
 r56_CAN_form_our_own_alliance:0 "Создать альянс"
 r56_CAN_form_our_own_alliance_desc:0 "Метрополия приняла собственную разновидность фашизма, и на этот раз наши устремления совпадают. Пройдём этот путь вместе, как добрые товарищи."
 r56_CAN_support_the_british_union_of_fascists:0 "Поддержать Британский союз фашистов"
 r56_CAN_support_the_british_union_of_fascists_desc:0 "Британский союз фашистов, возможно, остаётся одной из последних линий обороны против тирании демократий. Мы должны оказать ему полную поддержку ради победы."
 r56_CAN_strict_anti_communism:0 "Антикоммунизм"
 r56_CAN_strict_anti_communism_desc:0 "Красная чума большевизма не получит власти над [CAN.GetNameDef]. Мы вычистим левых из каждого укрытия, где их обнаружим."
 r56_CAN_follow_mosleys_ideas:0 "Следовать идеям Мосли"
 r56_CAN_follow_mosleys_ideas_desc:0 "Сэр Освальд Мосли предложил радикальную экономическую идею, заслуживающую применения в нашем доминионе. Мы насладимся процветанием обновлённой и славной Канады."
 r56_CAN_restructure_the_government:0 "Реорганизовать правительство"
 r56_CAN_restructure_the_government_desc:0 "Наше правительство заражено политиками, служащими корыстным частным спекулянтам. Мы больше не можем терпеть их ядовитое влияние!"
 r56_CAN_full_equality_for_women:0 "Права женщин"
 r56_CAN_full_equality_for_women_desc:0 "Женщины — опора и фундамент общества. Предоставление им полных и равных прав вознесёт [CAN.GetNameDef] к предназначенному величию."
 r56_CAN_fascist_corporatism:0 "Фашистский корпоративизм"
 r56_CAN_fascist_corporatism_desc:0 "Частные предприятия действуют по принципам невмешательства, предполагающим, что рынок сам заставит их удовлетворять нужды общества. Великая депрессия доказала ложность этого предположения, поэтому частный капитал должен быть подчинён национальным интересам."
 r56_CAN_join_the_british:0 "Вступить в Британскую империю"
 r56_CAN_join_the_british_desc:0 "Наши связи с метрополией переплетены навеки. Куда ты пойдёшь, туда пойду и я; где ты поселишься, там поселюсь и я. Твой народ станет моим народом, а твой Бог — моим Богом."
 r56_CAN_secure_greenland_and_iceland:0 "Обезопасить Гренландию и Исландию"
 r56_CAN_secure_greenland_and_iceland_desc:0 "Гренландия и Исландия могут стать плацдармом для вторжения в наш доминион. Их захват защитит наши фланги."
 r56_CAN_ask_for_newfoundland_and_labrador:0 "Попросить Ньюфаундленд и Лабрадор"
 r56_CAN_ask_for_newfoundland_and_labrador_desc:0 "Мы потребуем возвращения Ньюфаундленда и Лабрадора нашей стране. Наш народ больше не будет трудиться под властью чужеземцев."
 r56_CAN_intervene_ACW:0 "Помочь в гражданской войне в Америке"
 r56_CAN_intervene_ACW_desc:0 "Наши братья на юге остро нуждаются в помощи. Следует вмешаться, ведь дом, разделившийся сам в себе, не устоит."
 r56_CAN_send_weapons:0 "Отправить оружие в Америку"
 r56_CAN_send_weapons_desc:0 "Современные войны ведутся людьми, но выигрываются средствами, созданными на заводах. Мы отправим южным союзникам столь необходимые боеприпасы."
 r56_CAN_defence_scheme_no1:0 "Оборонительный план № 1"
 r56_CAN_defence_scheme_no1_desc:0 "Орёл на юге наконец показал истинные цвета. Что ж, раскрасим его в красный."
 r56_CAN_take_down_america:0 "Нанести удар по [USA.GetNameDef]"
 r56_CAN_take_down_america_desc:0 "[USA.GetNameDefCap] стала препятствием для нашего мирового порядка. Мы нанесём быстрый удар."
 r56_CAN_join_the_axis:0 "[Root.GetFascismAllianceName]"
 r56_CAN_join_the_axis_desc:0 "[Root.GetFascismAllianceDesc]"
 R56_CAN_JOIN_AXIS:0 "Вступить в Ось"
 R56_CAN_JOIN_FASCIST_ALLIANCE:0 "Найти союзников"
 R56_CAN_JOIN_AXIS_DESC:0 "Следует попытаться вступить в союз [GER.GetNameDef]."
 R56_CAN_JOIN_FASCIST_ALLIANCE_DESC:0 "Следует найти фашистский альянс стран: он усилит нас и поможет защититься от внешних угроз."
 r56_CAN_the_grizzly:0 "«Гризли»"
 r56_CAN_the_grizzly_desc:0 "Теперь мы способны производить достаточно танков, чтобы оснастить бронетанковую дивизию машинами с собственными модификациями."
 r56_CAN_alliance_with_america:0 "Союз с [USA.GetNameDef]"
 r56_CAN_alliance_with_america_desc:0 "Наши страны объединяют язык, культура и континент. Естественно заключить союз для взаимной защиты во время конфликтов."
 r56_CAN_acquire_american_ships:0 "Приобрести [USA.GetAdjective] корабли"
 r56_CAN_acquire_american_ships_desc:0 "Военно-морские силы США — одна из величайших морских держав мира. Следует попросить разрешения приобрести несколько кораблей для защиты доминиона."
 r56_CAN_follow_american_neutrality:0 "Следовать [USA.GetAdjective] нейтралитету"
 r56_CAN_follow_american_neutrality_desc:0 "Орёл поднялся высоко, увидел приближающиеся тучи конфликта и выбрал нейтралитет. Нам следует принять схожую политику, поскольку мы не хотим первыми открывать огонь."
 r56_CAN_follow_american_interventionism:0 "Следовать [USA.GetAdjective] интервенционизму"
 r56_CAN_follow_american_interventionism_desc:0 "Орёл решил тушить угли до того, как вспыхнет пожар. Мир уже не тот, каким мы его знали; вместе с [USA.GetAdjective] народом мы предпримем активные шаги к созданию нового мирового порядка."
 r56_CAN_defence_scheme_no2:0 "Оборонительный план № 2"
 r56_CAN_defence_scheme_no2_desc:0 "Угроза за Тихим океаном усиливается с каждым днём. Необходимо подготовиться к её неизбежному появлению."
 r56_CAN_install_democracy_in_the_americas:0 "Обеспечить демократию в Америках"
 r56_CAN_install_democracy_in_the_americas_desc:0 "Правительство, не представляющее взгляды граждан, не является народным. Мы навяжем этим тираническим режимам Америки свободу личности."
 r56_CAN_protect_the_coast:0 "Защитить Атлантическое побережье"
 r56_CAN_protect_the_coast_desc:0 "Наш восточный фланг остаётся открытым и незащищённым в случае высадки противника. Попросим метрополию разрешить нам оборонять его."
 r56_CAN_reduce_the_tariffs:0 "Снизить тарифы"
 r56_CAN_reduce_the_tariffs_desc:0 "Тарифы на торговлю с южным союзником оказались чрезмерным бременем для свободной торговли. Это несправедливо и недемократично и не должно продолжаться."
 r56_CAN_build_navy_for_defence:0 "Оборонительный флот"
 r56_CAN_build_navy_for_defence_desc:0 "Наш флот может выглядеть скромно на фоне других стран, но станет лучшей линией обороны против любого агрессора, пытающегося вторгнуться с моря."
 r56_CAN_get_ready_for_intervention:0 "Перевооружиться для вмешательства"
 r56_CAN_get_ready_for_intervention_desc:0 "Международная обстановка слишком нестабильна, чтобы мы могли спокойно наблюдать. Последуем примеру [USA.GetAdjective] народа и перевооружимся перед неизбежным."
 r56_CAN_allow_free_access:0 "Открыть границы"
 r56_CAN_allow_free_access_desc:0 "Нет причин сохранять границу между [USA.GetNameDef] и нами. Нас объединяют культура и язык, а историческая граница была произвольно проведена империалистами прошлого."
 r56_CAN_west_coast_military_command:0 "Военное командование Западного побережья"
 r56_CAN_west_coast_military_command_desc:0 "Наш союз долго не продержится без согласованных действий ради общей цели. Соответствующие планы уже разрабатываются."
 r56_CAN_new_deal:0 "Следовать [USA.GetAdjective] политике"
 r56_CAN_new_deal_desc:0 "Следует перенять успешную экономическую политику соседа ради блага народа, который мы представляем."
 r56_CAN_communism:0 "Народный фронт"
 r56_CAN_communism_desc:0 "Благородна идея [CAN.GetName], где все люди равны. Мы должны обеспечить рождение новой Канады!"
 r56_CAN_anti_war_policy:0 "Антивоенная политика"
 r56_CAN_anti_war_policy_desc:0 "В прошлую войну нас силой втянули остатки империалистической державы. Мы исправим это твёрдой политикой: никогда не объявлять войну и не вступать в альянсы ради её ведения."
 r56_CAN_organize_the_trade_unions:0 "Объединить профсоюзы"
 r56_CAN_organize_the_trade_unions_desc:0 "Профсоюзы — могущественный союзник, представляющий права рабочих. Следует объединить их в единую политическую организацию."
 r56_CAN_workers_rights:0 "Права рабочих"
 r56_CAN_workers_rights_desc:0 "Скупые капиталисты слишком долго угнетали [CAN.GetAdjective] рабочих! Мы защитим их права и производственные потребности, улучшая условия труда и прислушиваясь к тем, кто действительно важен."
 r56_CAN_public_ownership:0 "Средства производства"
 r56_CAN_public_ownership_desc:0 "Капиталисты стремятся использовать военный потенциал исключительно ради прибыли. Наши товарищи больше не будут это терпеть, как и мы. Мы конфискуем средства производства ради общего блага!"
 r56_CAN_unemployment_insurance_scheme:0 "Система страхования от безработицы"
 r56_CAN_unemployment_insurance_scheme_desc:0 "Безработные — симптом неэффективной системы. Обеспечивая тех, кто не может найти работу в тяжёлые времена, мы можем рассчитывать на их верную службу в лучшие дни."
 r56_CAN_young_communist_league_of_canada:0 "Лига молодых коммунистов Канады"
 r56_CAN_young_communist_league_of_canada_desc:0 "Молодые коммунисты объединяют школы и клубы, представляющие рабочих независимо от возраста, вероисповедания и расы. Их предупреждения о страшной угрозе фашизма звучат по всей [CAN.GetNameDef]. Ради рабочих мы поддержим рост этой организации!"
 r56_CAN_the_canadian_youth_congress:0 "[CAN.GetAdjective] молодёжный конгресс"
 r56_CAN_the_canadian_youth_congress_desc:0 "Настало время предоставить молодёжи надлежащие каналы для выражения жалоб и тревог, а также для прямых действий."
 r56_CAN_repeal_the_padlock_law:0 "Отменить Закон о навесном замке"
 r56_CAN_repeal_the_padlock_law_desc:0 "Согласно Закону о навесном замке, любое заведение или имущество, где распространяются жалобы угнетённых рабочих, может быть закрыто и опечатано, чтобы заглушить их голоса. Эти варварские законы попирают права рабочих, и мы отменим их!"
 r56_CAN_imprison_the_trotskyists:0 "Заключить троцкистов в тюрьму"
 r56_CAN_imprison_the_trotskyists_desc:0 "Троцкисты являются язвой на нашей славной идеологии, дестабилизируя коммунизм и его воплощения по всему миру. Мы исключим из своих рядов всех, кто открыто следует его идеям."
 r56_CAN_strike_the_quebecois_anti_communists:0 "Ударить по квебекским антикоммунистам"
 r56_CAN_strike_the_quebecois_anti_communists_desc:0 "Реакционер Морис Дюплесси и его сторонники подрывают стабильность страны. Мы покажем ему славу коммунизма."
 r56_CAN_form_a_canadian_red_guard:0 "Сформировать [CAN.GetAdjective] Красную гвардию"
 r56_CAN_form_a_canadian_red_guard_desc:0 "Чтобы выжить, нашему молодому коммунистическому строю нужны преданные и эффективные кадры для защиты самого его существования. Красная гвардия будет защищать [CAN.GetNameDef] до последнего вздоха."
 r56_CAN_the_mac_paps:0 "Батальон Маккензи — Папино"
 r56_CAN_the_mac_paps_desc:0 "Батальоны Маккензи — Папино состояли из канадцев, готовых распространять славу коммунизма по всему миру. Следует оказать им поддержку."
 r56_CAN_abandon_anti_war_policy:0 "Отказаться от антивоенной политики"
 r56_CAN_abandon_anti_war_policy_desc:0 "Ясно, что, хотя мы не стремимся к войне, некоторые страны желают причинить нам вред. Необходимо соответствующим образом изменить нашу политику."
 r56_CAN_plebiscite_committees:0 "Плебисцитные комитеты"
 r56_CAN_plebiscite_committees_desc:0 "Вовлекая народ в процесс реализации государственной политики, мы сможем смягчить резкую реакцию на некоторые решения."
 r56_CAN_support_the_soviets:0 "Поддержать [SOV.GetAdjective] сторону"
 r56_CAN_support_the_soviets_desc:0 "[SOV.GetNameDefCap] является подлинным воплощением коммунизма в мире. Мы не станем безучастно смотреть, как угасает пламя революции."
 r56_CAN_join_the_communist_international:0 "[Root.GetCommunistAlliance]"
 R56_CAN_JOIN_COMMUNISM:0 "Вступить в Коммунистический интернационал"
 R56_CAN_COMMUNISM_ALLIANCE:0 "Альянс"
 r56_CAN_join_the_communist_international_desc:0 "Пламя революции вспыхнуло по всему миру. Мы должны объединиться с братьями и сёстрами и принять Рабочую революцию."
 r56_CAN_destroy_imperialism:0 "Уничтожить империализм"
 r56_CAN_destroy_imperialism_desc:0 "Когда-то мы сами были страной, скованной цепями безразличного сюзерена. Теперь пора помогать всем народам, желающим разрушить последние оковы империализма — пережиток ушедших эпох."
 r56_CAN_join_our_british_comrades:0 "Присоединиться к нашим [ENG.GetAdjective] товарищам"
 r56_CAN_join_our_british_comrades_desc:0 "Наши друзья за морем также сбросили цепи презренной аристократии. Союз возрождённых рабочих стран станет союзом на века."
 r56_CAN_strike_britain:0 "Нанести удар по [ENG.GetNameDef]"
 r56_CAN_strike_britain_desc:0 "Устаревшая бывшая метрополия теперь выступает против славной [CAN.GetName]. Мы сокрушим её мощью объединённого пролетариата."
 r56_CAN_strike_mexico:0 "Обеспечить второй фронт"
 r56_CAN_strike_mexico_desc:0 "Мы не можем надеяться пронзить орла в прямом столкновении. Создание второго фронта для продолжения борьбы является нашим главным приоритетом."
 r56_CAN_strike_america:0 "Сокрушить [USA.GetNameDef]"
 r56_CAN_strike_america_desc:0 "Орёл научится бояться серпа и молота [CAN.GetAdjective] рабочего."
 r56_CAN_emergency_assembly:0 "Созвать парламент"
 r56_CAN_emergency_assembly_desc:0 "Наша молодая независимая демократия стоит на распутье. Необходимо собрать народных представителей и выработать путь, по которому мы пойдём в этом новом мире."
 r56_CAN_a_new_constitution:0 "Разработать новую конституцию"
 r56_CAN_a_new_constitution_desc:0 "Демократическая страна немыслима без конституции, устанавливающей систему сдержек и противовесов. Мы обеспечим её создание ради общего блага."
 r56_CAN_an_independent_democracy:0 "Независимая демократия"
 r56_CAN_an_independent_democracy_desc:0 "[CAN.GetNameDefCap]Сила его заключается в принятии и терпимости к различным идеям и людям. Демократия должна быть нашей торжественной клятвой и источником власти, даже в периоды раздоров и конфликтов."
 r56_CAN_post_colonial_rule:0 "После [ENG.GetAdjective] влияния"
 r56_CAN_post_colonial_rule_desc:0 "Когда-то мы были имперским доминионом, но мирно обрели [CAN.GetAdjective] независимость. Мы сохраним мир с ними, одновременно ясно заявив о своей самостоятельности."
 r56_CAN_secure_the_economy:0 "Обеспечить экономику"
 r56_CAN_secure_the_economy_desc:0 "Экономика нашей молодой республики слишком шатка, чтобы надёжно поддерживать народ. Необходимо принять меры для решения этой проблемы."
 r56_CAN_our_own_way:0 "Иной путь"
 r56_CAN_our_own_way_desc:0 "Демократия будет нашим путём в этом мире. Мы никому ничего не должны."
 r56_CAN_development_of_new_territories:0 "Развитие новых территорий"
 r56_CAN_development_of_new_territories_desc:0 "Укрепив экономику, мы наконец можем развивать неиспользуемые и недостаточно освоенные земли [CAN.GetNameDef]."
 r56_CAN_modernise_the_nation:0 "Модернизировать страну"
 r56_CAN_modernise_the_nation_desc:0 "Для дальнейшего экономического роста стране остро необходимы инвестиции в инфраструктуру. Мы выделим на это все необходимые средства."
 r56_CAN_independent_military:0 "Независимые вооружённые силы"
 r56_CAN_independent_military_desc:0 "Теперь, когда наши вооружённые силы самостоятельны, мы больше не можем полагаться на доктринальные изменения, навязанные сюзереном. Их развитие полностью зависит от нас."
 r56_CAN_independent_industry:0 "Независимая промышленность"
 r56_CAN_independent_industry_desc:0 "Развитие промышленных возможностей — один из главных приоритетов укрепления дорогой [CAN.GetName]."
 r56_CAN_self_sufficiency:0 "Самодостаточность"
 r56_CAN_self_sufficiency_desc:0 "Для работы промышленности нужны минералы и сырьё. Мы выделим необходимые средства на их добычу."
 r56_CAN_assert_canadian_involvment:0 "Утвердить [CAN.GetAdjective] участие"
 r56_CAN_assert_canadian_involvment_desc:0 "Несмотря на нашу веру в самоопределение, мы обязаны действовать, когда дружественные страны оказываются в опасности."
 r56_CAN_secure_american_democracy:0 "Обеспечить демократию в Америке"
 r56_CAN_secure_american_democracy_desc:0 "Орёл пал жертвой тяжёлой болезни. Мы исцелим его и вновь даруем свободу."
 r56_CAN_reenforce_the_commonwealth:0 "Укрепить Содружество"
 r56_CAN_reenforce_the_commonwealth_desc:0 "В изоляции страны рушатся. Мы создадим альянс, участники которого будут защищать друг друга в случае нападения."
 r56_CAN_our_best_friend:0 "Наш лучший друг"
 r56_CAN_our_best_friend_desc:0 "[USA.GetNameDefCap] всегда была верным другом [CAN.GetNameDef]. Мы пригласим её в наш оборонительный союз."
 r56_CAN_unite_with_the_french:0 "Объединиться с [FRA.GetAdjective] стороной"
 r56_CAN_unite_with_the_french_desc:0 "[FRA.GetNameDefCap] всегда защищала либеральные идеалы и демократию. Следует предложить ей вступить в наш альянс."
 r56_CAN_liberate_the_british_isles:0 "Освободить Британские острова"
 r56_CAN_liberate_the_british_isles_desc:0 "Наша бывшая метрополия пала. Наш моральный долг — освободить британский народ от оков угнетателей."
 r56_CAN_fuel_the_arms_sector:0 "Поддержать сектор вооружений"
 r56_CAN_fuel_the_arms_sector_desc:0 "Мир не продлится долго, если слова не подкреплять действиями. Иногда такими действиями становятся артиллерия и танки, поэтому необходимо сохранять промышленность, способную массово выпускать их при необходимости."
 r56_CAN_arms_exports:0 "Экспорт вооружений"
 r56_CAN_arms_exports_desc:0 "Мы можем не желать отправлять молодых [CAN.GetAdjective] людей умирать на чужих полях, но всегда можем отправлять [CAN.GetAdjective] продукцию дружественным нам странам, чтобы уравнять их шансы."
 r56_CAN_suppress_the_separatists:0 "Подавить сепаратистов"
 r56_CAN_suppress_the_separatists_desc:0 "Мы никогда не признаем мятежную страну Квебек. Квебек — [CAN.GetAdjective] земля, и точка."
 r56_CAN_strengthen_british_ties:0 "Укрепить [ENG.GetAdjective] связи"
 r56_CAN_strengthen_british_ties_desc:0 "Наша верность принадлежит метрополии. Мы добьёмся, чтобы политика и действия полностью соответствовали её курсу."
 r56_CAN_governor_general_in_power:0 "Генерал-губернатор у власти"
 r56_CAN_governor_general_in_power_desc:0 "В эти смутные времена нам нужна твёрдая рука у штурвала. Никто не подходит лучше Джона Бьюкена, нашего генерал-губернатора."
 r56_CAN_empower_the_military_faction:0 "Усилить военную фракцию"
 r56_CAN_empower_the_military_faction_desc:0 "Наша сила исходит не от комитетов и долгих обсуждений, а от прямых действий и решительных решений. Мы усилим людей, воплощающих эти ценности в административном аппарате [CAN.GetNameDef]."
 r56_CAN_strategic_nationalizations:0 "Стратегическая национализация"
 r56_CAN_strategic_nationalizations_desc:0 "Национализация отдельных отраслей и компаний повысит нашу популярность среди населения и передаст контроль над ними [CAN.GetNameDef]."
 r56_CAN_integrate_the_canadian_cadet_corps:0 "Интегрировать [CAN.GetAdjective] кадетский корпус"
 r56_CAN_integrate_the_canadian_cadet_corps_desc:0 "Молодёжь страны проявила замечательную инициативу, вступая в организации, хорошо готовящие её к жизни. Следует легализовать эту организацию в доминионе и превратить её кредо в клятву, которую каждое утро будут произносить все молодые канадцы."
 r56_CAN_root_out_traitors:0 "Искоренить предателей"
 r56_CAN_root_out_traitors_desc:0 "Те, кто требует больше свободы во времена испытаний, мешают нашему пути к величию. В [CAN.GetNameDef] не будет терпимости к инакомыслию."
 r56_CAN_claims_on_america:0 "Претензии на [USA.GetNameDef]"
 r56_CAN_claims_on_america_desc:0 "Мы больше не можем терпеть существование мятежной страны на юге. Однажды мы уже сжигали их города, и настало время сделать это снова."
 r56_CAN_the_defense_of_canada:0 "Оборона Канады"
 r56_CAN_the_defense_of_canada_desc:0 "Длинная граница с южной страной — лишь воображаемая линия, поддерживаемая историей. Мы ясно обозначим её укреплениями и подготовкой к войне."
 r56_CAN_national_defense_funding:0 "Финансирование национальной обороны"
 r56_CAN_national_defense_funding_desc:0 "Наш суверенитет можно защитить только силой оружия. Мы вложим в безопасность все доступные средства."
 r56_canada.1.t:0 "Изменение законов"
 r56_canada.1.d:0 "После недавней смены правительства наши законы и политические меры были обновлены в соответствии с новым курсом."
 r56_canada.1.a:0 "Необходимое изменение."
 r56_canada.4.t:0 "Проблема призыва в Квебеке"
 r56_canada.4.d:0 "Нам отчаянно нужны люди для армии, флота и авиации, но франкоканадцы не уступают и не соглашаются на принудительный призыв."
 r56_canada.4.a:0 "Мы сделаем то, что должны. Ввести принудительный призыв."
 r56_canada.4.b:0 "Возможно, удастся договориться."
 r56_canada.5.t:0 "Джек Бикелл возвращается из [ENG.GetNameDef]"
 r56_canada.5.d:0 "После двух лет службы в Британском совете авиационного снабжения Джек Бикелл вернулся из [ENG.GetNameDef]. Председатель совета Victory Aircraft Ltd. желает привлечь его к работе."
 r56_canada.5.a:0 "Что ж, найдём ему достойное применение!"
 r56_canada.6.t:0 "Бунт в двадцатицентовых центрах!"
 r56_canada.6.d:0 "Рабочие лагерей помощи безработным вновь подняли бунт, требуя повысить оплату. Как нам поступить?"
 r56_canada.6.a:0 "Следует просто закрыть лагеря."
 r56_canada.6.b:0 "Применить силу для подавления беспорядков."
 r56_canada.6.c:0 "Пусть бунтуют."
 r56_canada.7.t:0 "Бунт разгневанных двадцатицентовых центров!"
 r56_canada.7.d:0 "Во время прошлого бунта рабочих лагерей мы применили силу. Теперь они вновь подняли беспорядки и требуют компенсации за применение силы, а также закрытия лагерей."
 r56_canada.7.a:0 "Силой подавить бунт и навсегда закрыть лагеря."
 r56_canada.7.b:0 "Уступить требованиям и выплатить компенсацию."
 r56_canada.8.t:0 "Протестующие продолжают беспорядки"
 r56_canada.8.d:0 "Рабочие лагерей вновь организовали протест и повредили имущество."
 r56_canada.8.a:0 "Какой позор."
 r56_canada.9.t:0 "[CAN.GetNameDefCap] просит Ньюфаундленд и Лабрадор!"
 r56_canada.9.d:0 "[CAN.GetAdjective] сторона попросила нас передать ей Ньюфаундленд и Лабрадор, считая эти земли своей законной территорией."
 r56_canada.9.a:0 "Пусть забирают; войска нужны нам в другом месте."
 r56_canada.9.b:0 "Нет, это наша законная территория."
 r56_canada.10.t:0 "[FROM.GetNameDefCap] передаёт нам Ньюфаундленд и Лабрадор!"
 r56_canada.10.d:0 "[FROM.GetNameDefCap] передала нам Ньюфаундленд и Лабрадор после нашей вежливой просьбы."
 r56_canada.10.a:0 "Хорошие новости!"
 r56_canada.11.t:0 "[FROM.GetNameDefCap] отказывает!"
 r56_canada.11.d:0 "[FROM.GetNameDefCap] отказалась передать нам Ньюфаундленд и Лабрадор!"
 r56_canada.11.a:0 "Какой позор."
 r56_canada.11.b:0 "Они пожалеют об этом."
 r56_canada.12.t:0 "[CAN.GetNameDefCap] предлагает союз!"
 r56_canada.12.d:0 "[CAN.GetNameDefCap] обратилась к нам с предложением заключить союз."
 r56_canada.12.a:0 "Хорошая идея; вместе мы сильны."
 r56_canada.12.b:0 "Нет, они лишь хотят воспользоваться нашей военной мощью."
 r56_canada.13.t:0 "[USA.GetNameDefCap] согласилась на наш союз!"
 r56_canada.13.d:0 "[USA.GetNameDefCap] приняла предложение о североамериканском союзе! [USA.GetLeader] обеспечил большинство в Конгрессе в его поддержку, поскольку союз не угрожает [USA.GetAdjective] дипломатической независимости. Напротив, с [USA.GetAdjective] точки зрения он уменьшает угрозу войны с [ENG.GetNameDef]."
 r56_canada.13.a:0 "Хорошие новости!"
 r56_canada.14.t:0 "[USA.GetNameDefCap] отказывает!"
 r56_canada.14.d:0 "[USA.GetNameDefCap] отвергла предложение о создании союза, заявив, что мы хотим воспользоваться её военной мощью!"
 r56_canada.14.a:0 "Проклятые [USA.GetAdjective] люди!"
 r56_canada.15.t:0 "Права рабочих"
 r56_canada.15.d:0 "Улучшение прав рабочих позволило воспользоваться преимуществами возросшей морали и удовлетворённости трудящихся."
 r56_canada.15.a:0 "Превосходно!"
 r56_canada.16.t:0 "Экономический кризис"
 r56_canada.16.d:0 "Похоже, мы оказались в небольшой передряге. Народ устал и возмущён тем, что наша администрация не уделяет экономике должного внимания!"
 r56_canada.16.a:0 "Похоже, канадцам какое-то время придётся жить на пособие, ребята."
 r56_canada.17.t:0 "Экономическая стабильность"
 r56_canada.17.d:0 "Недавние инвестиции в важнейшие отрасли и социальное благополучие окупились. [CAN.GetAdjective] люди по всей стране ощущают процветание и безопасность в эти смутные времена."
 r56_canada.17.a:0 "Отличные новости!"
 r56_canada_governor_general.1.t:0 "Смерть генерал-губернатора Джона Бьюкена"
 r56_canada_governor_general.1.d:0 "Наш выдающийся генерал-губернатор, долго поддерживавший Доминион Канада и представлявший его интересы перед Короной, ушёл из жизни. Пусть он покоится с миром."
 r56_canada_governor_general.1.a:0 "Его наследие не будет забыто."
 r56.news_event.1001.t:0 "Королевский тур по [CAN.GetNameDef], [GetYear] год"
 r56.news_event.1001.d:0 "Впервые в истории Канады правящий монарх посетил страну: король Георг VI и королева Елизавета отправились в тур по [CAN.GetNameDef]. Королевская чета прибыла на лайнере Канадской тихоокеанской компании «Императрица Австралии» в сопровождении двух эсминцев и двух крейсеров Королевского канадского флота.\n\nИх поездка на сине-серебряном королевском поезде должна охватить все канадские провинции, начиная с города Квебек, затем Доминион Ньюфаундленд и далее западные регионы Канады, включая Ванкувер и Викторию. [CAN.GetLeader] будет сопровождать королевскую чету в путешествии по стране. Тур завершится визитом в [USA.GetNameDef]."
 r56.news_event.1001.a:0 "Для нас большая честь принять такой визит."
 r56.news_event.1001.b:0 "Надеемся, визит будет приятным!"
 r56.news_event.1001.c:0 "Сейчас не время для поездок."
 r56.news_event.1002.t:0 "День «Если»"
 r56.news_event.1002.d:0 "Сегодня организация военного займа Большого Виннипега провела имитацию вторжения [GER.GetAdjective] войск в [CAN.GetNameDef]. Это стало крупнейшими военными учениями в истории Виннипега и позволило за один день собрать 3 миллиона долларов на военные нужды. Мероприятие включало учебные бомбардировки, перестрелки, аресты протестующих, [GER.GetAdjective] парады и многое другое. День завершился освобождением «пленных», парадами и речами. Посол де Моргенстьерне рассказал о своём опыте [GER.GetAdjective] оккупации и заявил, что эта имитация вторжения и оккупации достоверно показала, как выглядит [GER.GetAdjective] оккупация."
 r56.news_event.1002.a:0 "День прошёл успешно."
