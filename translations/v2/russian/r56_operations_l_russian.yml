l_russian:
 operation_targeted_attack_officers:0 "Атаковать вражеских офицеров"
 operation_targeted_attack_officers_desc:0 "Атакуя вражеских офицеров, мы можем серьёзно нарушить цепочку командования и ослабить командные возможности вражеского командира."
 targeted_attack_theater:0 "Атаковать военный театр"
 targeted_attack_theater_desc:0 "Место, где собирается множество офицеров, чтобы отдохнуть, идеально подходит для внезапного удара и устранения как врагов, так и пособников. На этот раз представление будет не на сцене..."
 targeted_attack_theater_outcome:0 "Бомба, заложенная посреди публики, имела разрушительный эффект: многие офицеры генерального штаба дивизии, размещённой в этом районе, были убиты или ранены, что серьёзно снизило её боеспособность."
 targeted_bomb_officers_mess:0 "Атаковать офицерскую столовую"
 targeted_bomb_officers_mess_desc:0 "Где ещё найти множество офицеров, если не в столовой? Если превратить её в настоящий бардак, местные подразделения наверняка будут дезорганизованы."
 targeted_assassinate_division_commander:0 "Устранить генерала"
 targeted_assassinate_division_commander_desc:0 "Нет лучшего способа дезорганизовать дивизию, чем обезглавить её командование. Это деморализует войска и вынудит [FROM.getAdjective] армию назначить менее опытную замену."
 targeted_assassinate_divison_commander_outcome:0 "Используя скрытность и внезапность, агенты забросали гранатами машину командира, а затем открыли огонь, чтобы избавиться от преследователей."
 operation_outcome_officers_assassinated_tt:0 "Случайный §Yкомандир§! [FROM.GetNameWithFlag], ведущий войска, получит черту §YРанен§! на §Y90 дней§!"
 operation_targeted_plant_false_new_order_intel:0 "Подбросить фальшивую немецкую карту"
 operation_targeted_plant_false_new_order_intel_desc:0 "Если организовать обнаружение поддельной карты, якобы отражающей немецкие планы в Западном полушарии, мы сможем разозлить [USA.GetLeader] и заставить его занять более жёсткую позицию по отношению к [GER.getNameDef]."
 operation_outcome_new_order_map_planted_tt:0 "§Y[FROM.GetNameWithFlag]§! получит §G+5%§! поддержки войны и ухудшит своё отношение к §Y[GER.GetNameDef]§!!"
 r56_leader_events.1.t:0 "[From.GetNameDefCap] чудом избежал гибели"
 r56_leader_events.1.desc:0 "Командуя войсками, [From.GetRank] [From.GetName] подверг [From.GetHerselfHimself] опасности, и некоторое время опасались, что [From.GetSheHe] был лично ранен. Но, несмотря на попытки врага, судьба распорядилась иначе: [From.GetRank] [From.GetName] остался невредим и готов продолжать войну."
 r56_leader_events.1.a:0 "Вот уж повезло, хех"
