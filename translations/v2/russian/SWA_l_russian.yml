l_russian:
 SWA_sobhuza_ii:0 "Собуза II"
 SWA_sobhuza_ii_desc:0 "Нхотфотджени Мона был единственным сыном короля Нгване V и родился в 1899 году в деревне Зомбодзе. Он потерял отца в чрезвычайно раннем возрасте. После неожиданной смерти отца королевский совет сделал Нхотфотджени королём Свазиленда, когда ему было всего 4 месяца, и в знак отличия ему дали имя Собуза II. \n\nИз-за юного возраста Собузы его близкие родственники исполняли обязанности регентов до его совершеннолетия в конце 1921 года, после чего передали ему власть, официально ознаменовав начало правления Собузы в Свазиленде. \n\nС самого начала своего правления он и делегация свазийцев обращались к королю Георгу IV с просьбой вернуть Королевству Свазиленд прежние земли, утраченные в пользу британцев. Хотя британцы сохранили контроль над этими территориями, такая настойчивая позиция обеспечила Собузе поддержку на родине. Происходили и внутренние изменения. Понимая, что колониальное правление в Свазиленде однажды закончится, Собуза готовил свой народ посредством образования, чтобы население было готово взять на себя ответственность за управление страной. \n\nПо мере роста мировой напряжённости Собуза стремится сохранить нейтралитет Свазиленда и не допустить его вовлечения в конфликты за пределами страны, придерживаясь дипломатии неприсоединения."
