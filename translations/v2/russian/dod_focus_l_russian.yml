l_russian:
 HUN_balanced_budget:0 "Сбалансированный бюджет"
 HUN_balanced_budget_desc:0 "Мы должны сделать все возможное, используя имеющиеся в нашем распоряжении ресурсы. Хорошо спланированный и сбалансированный бюджет является залогом успеха нашего правительства."
 HUN_strengthen_the_monarchists:0 "Укрепление монархистов"
 HUN_strengthen_the_monarchists_desc:0 "Первый шаг к возвращению Венгрии прежнего престижа — укрепление тех партий, которые требуют возвращения к монархии."
 HUN_elect_a_king:0 "Избрать короля"
 HUN_elect_a_king_desc:0 "Народная поддержка возвращения нации к монархической форме правления теперь достаточна, чтобы мы могли начать думать о начале процесса избрания нового короля."
 HUN_invite_the_habsburg_prince:0 "Пригласите князя Габсбурга"
 HUN_invite_the_habsburg_prince_desc:1 "Давно Габсбурги правили Венгрией, и под их властью страна была частью одной из величайших империй Европы. Возвращение Габсбурга к власти, несомненно, приведет Венгрию к величию."
 HUN_demand_a_referendum:0 "Требуем референдума"
 HUN_demand_a_referendum_desc:0 "Распад Австро-Венгрии был ошибкой. Австрия и Венгрия вместе сильнее, и для достижения величия требуется сочетание того и другого. Австрийцы должны провести референдум по предложению о мирном присоединении наших двух народов."
 HUN_take_austria_by_force:0 "Взять Австрию силой"
 HUN_take_austria_by_force_desc:0 "Первым шагом на пути возвращения славы Венгрии является реинтеграция австрийских земель. Мы не можем рисковать провалом в достижении этого дипломатическим путем, поэтому мы должны сделать это силой."
 HUN_proclaim_the_restoration_of_austria_hungary:0 "Восстановление Австро-Венгрии"
 HUN_proclaim_the_restoration_of_austria_hungary_desc:0 "С воссоединением наших двух народов и Габсбургом на троне мы можем теперь торжественно объявить о восстановлении Австро-Венгрии и увидеть, как вернуть наши законные исторические провинции!"
 HUN_protect_czechoslovakia:0 "Защита Чехословакии"
 HUN_protect_czechoslovakia_desc:0 "Чехословакия с момента обретения независимости стала могущественной и трудолюбивой, но соседи жадно смотрят на ее земли. Мы предоставим им нашу защиту от этих угроз, либо вновь приняв их как неотъемлемую часть нашей Империи, либо предоставив им статус ассоциации."
 HUN_claim_transylvania:0 "Претензия Трансильвания"
 HUN_claim_transylvania_desc:0 "Район Сибенбюргена был несправедливо отнят у нас после последней войны. Пришло время вернуть его."
 HUN_march_to_the_shore:0 "Марш к берегу"
 HUN_march_to_the_shore_desc:0 "Истинная великая держава требует выхода к морям. Побережье Адриатики – наше право от рождения."
 HUN_reclaim_venetia:0 "Восстановить Венецию"
 HUN_reclaim_venetia_desc:0 "Предательство итальянцев в Великой войне не было забыто. Пришло время поставить их на место и восстановить империю до ее естественных границ."
 HUN_claim_galicia:0 "Утверждать Галиция"
 HUN_claim_galicia_desc:0 "Польское государство — не что иное, как искусственная конструкция. Его можно создавать и демонтировать по мере необходимости."
 HUN_claim_the_bucovina:0 "Заявить Буковину"
 HUN_claim_the_bucovina_desc:0 "Это, возможно, не самое важное в экономическом отношении из наших широко распространенных владений, но это все еще часть нашей Империи. И мы его вернем."
 HUN_reclaim_the_empire:0 "Восстановление империи"
 HUN_reclaim_the_empire_desc:0 "Для того, чтобы завершить наши де-юре территориальные требования, мы должны претендовать на различные титулы в Германии, Италии и Палестине, которые наш Габсбургский монарх имеет к своему имени."
 HUN_elect_a_democratic_king:0 "Избрать демократического короля"
 HUN_elect_a_democratic_king_desc:0 "Мы должны искать Короля, который будет отстаивать демократические принципы нашей нации и права нашего народа."
 HUN_responsible_government:0 "Ответственное правительство"
 HUN_responsible_government_desc:1 "Традиционно правительство в конечном счете отвечало королю, позволяя ему игнорировать волю народа. Мы изменим конституцию, чтобы гарантировать, что ответственность за это несет народ, а не правитель."
 HUN_rapproachement_with_little_entente:0 "Сближение с Малой Антантой"
 HUN_rapproachement_with_little_entente_desc:0 "Нас окружают враждебные идеологии, и мы должны вновь подтвердить наши связи с нашими соседями по Малой Антанте. Мы спросим их, хотят ли они, чтобы мы перевооружались."
 HUN_join_allies:0 "Присоединяйтесь к союзникам"
 HUN_join_allies_desc:0 "Будущее Венгрии и ее демократических ценностей лежит в основе основных западных демократий и их альянса. Как член этого альянса, мы можем придать свою силу их силам, а также рассчитывать на их поддержку."
 HUN_the_balkan_pact:0 "Дунайский пакт"
 HUN_the_balkan_pact_desc:0 "Западные демократии слишком далеко, чтобы помочь нам, поэтому союзников следует искать ближе к дому. Как лидер Дунайского пакта, мы предложим им защиту и поведём к победе!"
 HUN_an_unlikely_alliance:0 "Невероятный альянс"
 HUN_an_unlikely_alliance_desc:0 "Мы коренным образом изменили нашу страну. Мы больше не воины прошлого. Пришло время обратиться к нашему старому врагу и создать новую судьбу - вместе."
 HUN_joint_oil_exploitation_company:0 "Совместная нефтяная эксплуатация компании"
 HUN_joint_oil_exploitation_company_desc:0 "С перспективой возможных нефтяных месторождений на нашей территории мы привлекли иностранное внимание. Дружественные державы стремятся поддержать нашу нефтяную промышленность своими техническими ноу-хау, и это будет прибыльной возможностью учиться на их достижениях."
 HUN_elect_a_fascist_king:0 "Избрать фашистского короля"
 HUN_elect_a_fascist_king_desc:0 "Наша страна нуждается в сильном лидере, чтобы провести ее через предстоящие бурные годы. Наш правитель должен быть тем, на кого люди могут смотреть свысока, а наши враги могут бояться."
 HUN_economic_intervention:0 "Экономическое вмешательство"
 HUN_economic_intervention_desc:0 "Мы должны направить достаточно политических ресурсов на управление нашей экономикой. Несмотря на то, что он адекватный, мы можем сделать его сильнее и эффективнее."
 HUN_strengthen_fascists:0 "Укрепление фашистов"
 HUN_strengthen_fascists_desc:0 "Фашистские элементы в нашей стране должны быть усилены и предоставлены общественная платформа для распространения их идеологии. Их взгляды на будущее Венгрии с наибольшей вероятностью приведут страну к величию еще раз."
 HUN_renounce_the_treaty_of_trianon:0 "Отказ от Трианонского договора"
 HUN_renounce_the_treaty_of_trianon_tt:0 "§YМиклош Хорти§! или §YФридрих Франц Мекленбург-Шверин§! становится лидером страны.\n"
 HUN_renounce_the_treaty_of_trianon_desc:0 "Несправедливость, навязанная нашей нации в конце Великой войны, отнимающая две трети территории и населения нашей некогда великой нации, соперничает с позором, который посетил Германию в Версальском договоре, и она должна быть отменена."
 HUN_renew_the_rome_protocols:0 "Возобновление Римского протокола"
 HUN_renew_the_rome_protocols_desc:0 "В свете продолжающегося ревизионизма Германии мы должны возобновить Римские протоколы, составленные и подписанные в 1934 году. Эти соглашения послужат не только дальнейшей изоляции германской и югославской угроз, но и в качестве возможного предшественника фактического альянса."
 HUN_protect_austria:0 "Защита Австрии"
 HUN_protect_austria_desc:0 "Чтобы противостоять Германии, мы должны сопротивляться их открытым амбициям по объединению с Австрией. Мы можем предоставить им гарантию, давая нынешней власти политическую силу, которая им нужна, чтобы противостоять прогерманским элементам."
 HUN_alliance_with_italy:0 "Альянс с Италией"
 HUN_alliance_with_italy_desc:0 "Первоначальные шаги к союзу, которые были сделаны в Римских протоколах, теперь могут быть расширены. Мы направим делегацию в Италию для обсуждения обязательного соглашения о широком военном сотрудничестве как в оборонительном, так и в наступательном плане."
 HUN_trade_deal_with_germany:0 "Торговая сделка с Германией"
 HUN_trade_deal_with_germany_desc:0 "Выгоды для нашей промышленности от расширения торговых отношений с Германией очевидны, а претензии на потенциальную чрезмерную зависимость нашей экономики от немцев преувеличены. Мы продолжим работу и подпишем обширное торговое соглашение."
 HUN_joint_aluminum_mining_company:0 "Совместная алюминиевая горнодобывающая компания"
 HUN_joint_aluminum_mining_company_desc:0 "Поскольку алюминий является неотъемлемой частью современной военной промышленности, мы могли бы легко получить немецкую поддержку для расширения шахт на севере нашей страны."
 HUN_join_axis:0 "Присоединяйтесь к оси"
 HUN_join_axis_desc:0 "Поскольку наша экономика уже настолько зависит от немцев, логично будет следовать за ними в войне. Мы направим им запрос о формальном вступлении в альянс Оси."
 HUN_reaffirm_territorial_claims:0 "Подтвердить территориальные претензии"
 HUN_reaffirm_territorial_claims_desc:0 "С отказом от Трианонского договора мы должны теперь приступить к подтверждению наших притязаний на территории, которые были у нас украдены."
 HUN_demand_transylvania:0 "Спрос на Трансильванию"
 HUN_demand_transylvania_desc:0 "Если мы сможем вернуть наши территории без кровопролития, тем лучше. Румынии будет предъявлен ультиматум с требованием передачи наших законных земель."
 HUN_demand_southern_slovakia:0 "Южная Словакия Спросить"
 HUN_demand_southern_slovakia_desc:0 "Если мы сможем вернуть наши территории без кровопролития, тем лучше. Чехословакии будет предъявлен ультиматум с требованием передачи наших законных земель."
 HUN_demand_the_vojvodina:0 "Требовать Воеводину"
 HUN_demand_the_vojvodina_desc:0 "Если мы сможем вернуть наши территории без кровопролития, тем лучше. Югославии будет предъявлен ультиматум с требованием передачи наших законных земель."
 HUN_claim_overlordship_over_slovakia:0 "Претензии на господство над Словакией"
 HUN_claim_overlordship_over_slovakia_desc:0 "Остальная часть Словакии должна быть также реинтегрирована в венгерское государство, либо напрямую, либо став зависимой страной. Мы выдвинем еще один ультиматум."
 HUN_proclaim_greater_hungary:0 "Провозглашение Великой Венгрии"
 HUN_proclaim_greater_hungary_desc:0 "Восстановив ту территорию, которую мы должны были отвоевать, размеры нашей страны увеличились до наших исторических границ. Теперь мы можем с полной уверенностью заявить миру о формировании Великой Венгрии и поставить перед собой новые цели."
 HUN_GREATER_tt:0 "Измените свое имя на §YВеликая Венгрия§!\n"
 HUN_demands_tt:0 "При требовании территории другая сторона с большей вероятностью сдаст ее без кровопролития, если у вас будет сильная армия. Однако они могут по-прежнему верить, что могут противостоять нам, если они находятся во фракции.\n"
 HUN_assassinate_horthy:0 "Убийца Хорти"
 HUN_assassinate_horthy_desc:0 "Старый адмирал Великой войны обладает слишком большой властью и влиянием в своем нынешнем качестве регента Венгерского королевства, и его позиция против коммунизма оказывается довольно проблематичной для усилий наших товарищей. Он должен быть отстранен от власти, если наша нация хочет найти свой путь к революции."
 HUN_council_of_peoples_commissars:0 "Совет Народных Комиссаров"
 HUN_council_of_peoples_commissars_desc:0 "Должен быть создан руководящий орган, который будет контролировать переход Венгрии в коммунистическое государство. Как только это будет сделано, Совет станет аналогом западной системы кабинета министров."
 HUN_the_hungarian_red_army:0 "Венгерская Красная армия"
 HUN_the_hungarian_red_army_desc:0 "Все патриоты, любящие Родину, должны выполнять свой долг по защите Родины. Мы создадим венгерскую Красную Армию по примеру Советов на Востоке, которая защитит нашу молодую революцию."
 HUN_soviet_hungarian_military_academy:0 "Советско-венгерская военная академия"
 HUN_soviet_hungarian_military_academy_desc:0 "Наша армия — ничто без ее руководства. Советы имеют гораздо больше опыта в военных вопросах, поэтому может быть полезно сотрудничать с ними в подготовке наших лучших военных умов. С этой целью мы создадим военную академию с самыми квалифицированными инструкторами из обеих наших стран."
 HUN_join_comintern:0 "Вступить в Коминтерн"
 HUN_join_comintern_desc:0 "Путь к революции лежит через Коминтерн. Вместе с нашими товарищами мы отметим капиталистическую несправедливость и фашистскую угрозу, которая надвигается на Западе."
 HUN_the_revolutionary_council:0 "Революционный совет"
 HUN_the_revolutionary_council_desc:0 "Коминтерн отказался от борьбы с империализмом, вместо этого предпочтя согласиться на сосуществование. Если рабочие мира хотят быть свободными, мы должны нести факел Маркса и Ленина вперед — даже против Советского Союза, если это необходимо."
 HUN_FACTION_COMMIE:0 "Союз коммунистических Советов"
 HUN_pressure_romania:0 "Давление Румынии"
 HUN_pressure_romania_desc:0 "Сосредоточив внимание на фашистской опасности на Западе, мы не можем допустить, чтобы потенциальная угроза продолжала существовать в нашем тылу, особенно когда она лежит между нами и нашими союзниками на Востоке. Румыния должна быть обеспечена как одно коммунистическое государство, или важные сухопутные пути к нашим союзникам должны быть переданы, чтобы мы могли получить их поддержку."
 HUN_intervene_in_czechoslovakia:0 "Вмешательство в Чехословакию"
 HUN_intervene_in_czechoslovakia_desc:0 "Чехословаки получили часть территорий, отнятых у нас по Трианонскому договору. В то же время мы знаем о немецких проектах на их землях. Возможно, мы сможем организовать сделку; Наши законные земли в обмен на гарантии советской военной поддержки в случае немецкой агрессии."
 HUN_industrial_revitalization:0 "Промышленная активизация"
 HUN_industrial_revitalization_desc:0 "Наша промышленная база в последние годы опасно разложилась. Мы должны приложить усилия для внедрения новых технологий, чтобы компенсировать потери."
 HUN_support_urbanization:0 "Поддержка урбанизации"
 HUN_support_urbanization_desc:0 "Все больше и больше людей покидают деревни и небольшие города, чтобы переехать в крупные городские центры в поисках работы на новых заводах. Даже если мы не сможем сразу предложить им работу, мы можем построить новые кварталы в городе, чтобы подготовить почву для дальнейшего расширения."
 HUN_institute_for_industrial_techniques:0 "Институт промышленных технологий"
 HUN_institute_for_industrial_techniques_desc:0 "Специальный характер промышленных исследований привел к замедлению роста и снижению производительности. Мы должны создать новый институт, который будет заниматься всеми исследованиями новых промышленных методов."
 HUN_announce_the_gyor_program:0 "Объявить программу Дьёра"
 HUN_announce_the_gyor_program_desc:0 "Наши вооруженные силы опасно слабы, и крайне важно увеличить их численность и боевые возможности. Для этого мы должны существенно укрепить нашу промышленность, идти в ногу с растущими требованиями к оборудованию. Пятилетняя программа Györ увеличит государственные расходы не только на сами военные, но и на вспомогательные сектора, такие как промышленность, сельское хозяйство, инфраструктура и образование."
 HUN_civilian_industry:0 "Гражданская промышленность"
 HUN_civilian_industry_desc:0 "Несмотря на необходимость увеличения военной промышленности, мы не должны пренебрегать нашими гражданскими потребностями. Поэтому необходимо расширение гражданской промышленности."
 HUN_reintegrate_the_railroads:0 "Реинтеграция железных дорог"
 HUN_reintegrate_the_railroads_desc:0 "Железнодорожные сети, охватывающие старую Австро-Венгерскую империю, стали фрагментированными с момента ее распада в независимых странах. Мы должны подойти к другим бывшим государствам-членам и предложить реинтеграцию наших железнодорожных сетей, чтобы улучшить инфраструктуру в целом."
 HUN_invite_foreign_investors:0 "Пригласить иностранных инвесторов"
 HUN_invite_foreign_investors_desc:0 "Венгрия находится в самом сердце Восточной Европы, и мы могли бы использовать наше центральное местоположение для привлечения иностранных инвесторов, заинтересованных в улучшении нашей инфраструктуры и промышленности."
 HUN_expand_the_manfred_weiss_steel_works:0 "Расширение сталелитейных заводов Manfred Weiss"
 HUN_expand_the_manfred_weiss_steel_works_desc:0 "Массивные сталелитейные заводы Manfed Weiss стали неотъемлемым оборонным подрядчиком с тех пор, как началась Великая война. Если мы хотим увеличить наши вооруженные силы для подготовки следующей войны, гордость нашей национальной промышленности должна быть еще раз увеличена."
 HUN_expand_the_aluminum_industry:0 "Расширение алюминиевой промышленности"
 HUN_expand_the_aluminum_industry_desc:0 "Нам нужны все имеющиеся ресурсы, как для экспорта, так и для внутреннего использования. Наша алюминиевая промышленность, хотя и уже обширная, имеет дополнительные возможности для улучшения, и мы должны немедленно направить ресурсы на эту цель."
 HUN_expand_the_technical_university_of_budapest:0 "Расширение Технического университета Будапешта"
 HUN_expand_the_technical_university_of_budapest_desc:0 "Нам нужны более яркие умы, чтобы придумать прорывные открытия, которые помогут нам в предстоящих конфликтах. Расширяя наш столичный университет, мы можем увеличить количество квалифицированных инженеров и ученых для нашей военной промышленности."
 HUN_support_domestic_industry:0 "Поддержка отечественной промышленности"
 HUN_support_domestic_industry_desc:0 "Военным нужно больше техники, и наша промышленность должна идти в ногу со временем. Мы направим новые ресурсы на расширение нашей военной промышленности."
 HUN_domestic_arms_industry:0 "Отечественная оружейная промышленность"
 HUN_domestic_arms_industry_desc:0 "Наша оружейная промышленность должна опираться на мощную гражданскую промышленную базу не только для производства промышленного оборудования, но и для создания новых заводов."
 HUN_autarky:0 "Автаркия"
 HUN_autarky_desc:0 "Мы слишком зависим от иностранных источников нефти. Мы должны подражать усилиям Германии по разработке синтетического масла."
 HUN_synthetic_industry:0 "Синтетическая промышленность"
 HUN_synthetic_industry_desc:0 "Теперь, когда мы освоили технологию сжижения угля, мы можем построить пилотный завод для начала производства."
 HUN_synthetic_oil_tt:0 "Добавляет синтетический нефтеперерабатывающий завод в случайное состояние. Место будет отображаться после того, как исследования докажут, что производство синтетического масла возможно.\n"
 HUN_aeronautic_technology_institute:0 "Институт аэронавтических технологий"
 HUN_aeronautic_technology_institute_desc:0 "Воздух стал новым аспектом войны, и многие недооценивают его важность. Мы должны научиться овладевать этим новым измерением и выделять ресурсы на разработку новых доктрин и оборудования, которые позволяют нам это делать."
 HUN_boost_hungarian_aviation_industry:0 "Развитие венгерской авиационной промышленности"
 HUN_boost_hungarian_aviation_industry_desc:0 "Наша промышленная база должна быть укреплена, чтобы обеспечить производство новых моделей самолетов в достаточном количестве для освоения воздушного пространства."
 HUN_secret_rearmament:0 "Тайное перевооружение"
 HUN_secret_rearmament_desc:0 "Ограничения, наложенные на нас Трианонским договором, запрещают нам увеличивать размеры нашей армии. Несмотря на это, политический климат в мире становится все более бурным, и конфликты маячат над горизонтом. Мы не можем оставаться беззащитными, и мы должны начать перевооружаться, даже если это означает тайное нарушение условий мирного договора, навязанного нам после Великой войны."
 HUN_secret_rearmament_tt:0 "§GРазблокировать §YЧастная мобилизация§! Закон.§!\n"
 HUN_secret_rearmament_tt_2:0 "§RДух будет устранен при увеличении воинской повинности за пределами §YТолько добровольцы§!.§!\n"
 HUN_war_games:0 "Военные игры"
 HUN_war_games_desc:0 "Занимаясь небольшими военными играми, мы можем обнаружить недостатки в нашей нынешней военной структуре и использовать полученный опыт для корректировки недостатков."
 HUN_theoretical_air_efforts:0 "Теоретические воздушные усилия"
 HUN_theoretical_air_efforts_desc:0 "Мы должны потратить достаточно ресурсов на разработку новых теорий, касающихся воздушной войны. Если мы вступим в войну, теории, которые могут быть разработаны, будут бесценны."
 HUN_bled_agreement:0 "Соглашение Бледа"
 HUN_bled_agreement_desc:0 "Маломасштабного тайного перевооружения недостаточно. Мы должны обратиться к нашим соседям с просьбой о возмещении ущерба по договору, заключенному после Великой войны. Венгрия имеет равное право на вооружение."
 HUN_bled_agreement_custom_effect_tooltip:0 "Это может привести к замене §HТрианонский договор§!."
 HUN_establish_the_air_force:0 "Учреждать Военно-воздушные силы"
 HUN_establish_the_air_force_desc:0 "Теперь, когда законодательные ограничения не действуют, пришло время официально создать венгерские военно-воздушные силы."
 HUN_indigenous_designs:0 "Конструкции коренных народов"
 HUN_indigenous_designs_desc:0 "Наши собственные технические знания достаточны для наших нужд. Контроль над собственным конструкторским бюро позволяет выделять на него больше ресурсов, тем самым увеличивая скорость разработки новых конструкций."
 HUN_heavy_fighter_effort:0 "Усилия тяжелого истребителя"
 HUN_heavy_fighter_effort_desc:0 "Наши истребители должны быть в состоянии поддерживать более уязвимые бомбардировщики. Это требует более тяжелого вооружения и большей дальности за счет некоторой скорости и маневренности."
 HUN_light_fighter_effort:0 "Развитие лёгких истребителей"
 HUN_light_fighter_effort_desc:0 "Нам нужна истребительная авиация, чтобы получить превосходство в небе над нашими силами и перехватить любые вражеские самолеты, которые угрожают нашей стране."
 HUN_cas_focus:0 "Фокус CAS"
 HUN_cas_focus_desc:0 "Современная армия нуждается в поддержке со стороны транспортных средств на земле и в воздухе."
 HUN_tac_focus:1 "Тактический бомбардировщик Focus"
 HUN_tac_focus_desc:0 "Победа будет достигнута путем уничтожения сухопутных войск противника. Мы должны сосредоточиться на поддержке наших собственных армий тактическими ударами по близким и глубоким целям."
 HUN_license_foreign_designs:0 "Лицензия Иностранный дизайн"
 HUN_license_foreign_designs_desc:0 "Иностранные военно-воздушные силы уже показали, что обладают проверенными образцами очень высокого качества. Вместо того, чтобы искушать судьбу и полагаться на наш зарождающийся авиационный опыт, мы должны попросить разрешить производить эти иностранные модели по лицензии."
 HUN_fighter_competition:0 "Конкурс истребителей"
 HUN_fighter_competition_desc:0 "Для того, чтобы мы могли выбрать лучшую модель истребителя для производства по лицензии, мы должны противопоставить соперников друг другу. Мы организуем соревнование истребителей и приглашаем все крупные державы прислать к участию свои самые современные модели истребителей."
 HUN_bomber_competition:0 "Конкурс бомбардировщиков"
 HUN_bomber_competition_desc:0 "Для того, чтобы мы могли выбрать лучшую модель самолета-бомбардировщика для производства по лицензии, мы должны противопоставить соперников друг другу. Мы организуем конкурс бомбардировщиков и приглашаем все крупные державы прислать к участию свои самые современные модели бомбардировщиков."
 HUN_joint_air_development:0 "Совместное развитие авиации"
 HUN_joint_air_development_desc:0 "Лучшим средством разработки новых моделей самолетов является сотрудничество с нашими союзниками. Объединив самые светлые умы всех наших народов, мы достигнем наилучших результатов."
 HUN_army_maneuvers:0 "Армейские манёвры"
 HUN_army_maneuvers_desc:0 "Наша армия должна быть приведена в форму для потенциальных будущих вооруженных конфликтов. Мы направим их на маневры для разработки новых тактик и стратегий."
 HUN_mobile_focus:0 "Мобильный фокус"
 HUN_mobile_focus_desc:0 "Мобильная армия, способная наносить удары, когда и где она нанесет наибольший ущерб, является ключом к военному успеху."
 HUN_the_botond:0 "Ботонд"
 HUN_the_botond_desc:0 "Для того, чтобы удовлетворять наши потребности в поставках и транспортировке, нам нужен новый вид грузового автомобиля. Первоначальные версии Rába 38M Botond оказались успешными в испытаниях, и с соответствующими ресурсами мы можем завершить проектирование и начать производство."
 HUN_develop_tanks:0 "Развивайте танки"
 HUN_develop_tanks_desc:0 "Окружающие нас страны определили важность танка и производят его в большом количестве. Мы должны разработать свои собственные танки и попытаться идти в ногу с нашими союзниками и противниками."
 HUN_assault_gun_focus:0 "Обсуждение Assault Gun Focus"
 HUN_assault_gun_focus_desc:0 "Вместо полноценных танков мы будем полагаться на штурмовые орудия для поддержки пехоты при прорывах как на более экономичную альтернативу."
 HUN_joint_tank_procurement:0 "Совместные закупки танков"
 HUN_joint_tank_procurement_desc:0 "Вместе с нашими союзниками мы можем гораздо эффективнее разрабатывать новые модели танков. Мы создадим совместное закупочное бюро, где наши инженеры смогут работать вместе, чтобы определить лучшие проекты для продвижения вперед."
 HUN_armored_warfare:0 "Бронированная война"
 HUN_armored_warfare_desc:0 "Нашим моторизованным дивизиям потребуется бронетанковая поддержка, чтобы быть по-настоящему эффективными. Мы должны вкладывать больше ресурсов в разработку новых конструкций брони."
 HUN_mobile_corps_doctrine:0 "Доктрина мобильного корпуса"
 HUN_mobile_corps_doctrine_desc:0 "В настоящее время в производстве находятся как моторизованные, так и бронетехнические элементы, поэтому мы должны рассмотреть новые теоретические подходы к тому, как они могут работать вместе на поле боя."
 HUN_home_defense:0 "Оборона родины"
 HUN_home_defense_desc:0 "Небольшие мобильные силы не смогут защитить нашу страну в случае нападения. Мы должны сформировать непроницаемую линию фронта и разработать новые доктрины для повышения эффективности такого подхода."
 HUN_danuvia_submachine_guns:0 "Danuvia Submachine Guns (недоступная ссылка)"
 HUN_danuvia_submachine_guns_desc:0 "Наша пехота нуждается в хорошем вооружении, чтобы повысить свою эффективность. Первоначальные прототипы Danuvia 43M показали хорошие результаты в испытаниях, и, увеличив финансирование на его разработку, мы вскоре сможем начать массовое производство оружия."
 HUN_artillery_effort:0 "Развитие артиллерии"
 HUN_artillery_effort_desc:0 "Артиллерия – это ключ к повышению эффективности наших сил. Мы будем разрабатывать современные артиллерийские модели, чтобы они имели наилучшую артиллерийскую поддержку, которую мы можем обеспечить."
 HUN_motorized_logistics:0 "Моторизованная логистика"
 HUN_motorized_logistics_desc:0 "Ключом к мобильной войне является способность быстро перемещать людей и материалы на большие расстояния. Даже самый лучший танк быстро станет бесполезным, если его не пополнить."
 HUN_light_infantry_divisions_doctrine:0 "Доктрина лёгкой пехоты"
 HUN_light_infantry_divisions_doctrine_tech_tt:0 "Позволяет §HДоктрина лёгкой пехоты§!\n§Hпехота\n    лес§!\n      Атака: §G+2%§!\n      Движение: §G+5%§!\n    §Hгородской§!\n      Атака: §G+5%§!\n      Движение: §G+5%§!\n"
 HUN_light_infantry_divisions_doctrine_unit_tt:0 "\nПолучить §Yпехота§! Подразделение с 6 батальонами.\n"
 HUN_light_infantry_divisions_doctrine_desc:0 "Мы должны обойтись ограниченными людскими ресурсами, имеющимися в нашем распоряжении. Если мы хотим больше делений, они обязательно должны быть меньше. Легкие пехотные дивизии обеспечивают оптимальное сочетание ударной мощи и размеров, и мы сделаем его основой наших военных."
 HUN_form_parachute_battalions:0 "Форма парашютных батальонов"
 HUN_form_parachute_battalions_desc:0 "Пехота, высаженная воздушным ударом, даст нам возможность быстро реагировать на любую неожиданную угрозу или тактическую возможность."
 HUN_naval_warfare:0 "Морская война"
 HUN_naval_warfare_desc:0 "После восстановления береговой линии мы должны сосредоточить наши усилия на восстановлении флота, пригодного для крупной державы."
 HUN_restauration:0 "Реставрация"
 HUN_restauration_desc:0 "Мы не можем тратить время на эксперименты с новыми и недоказанными технологиями. Мы будем придерживаться проверенных и проверенных проектов со времен старой Империи."
 HUN_reform:0 "Реформа"
 HUN_reform_desc:0 "Нет смысла создавать флот, построенный на устаревших идеях. Мы получили возможность создать новый флот с нуля, без багажа старого. Мы должны использовать его для создания самого современного и способного военно-морского флота, который мы можем."
 HUN_capital_ships:0 "Крупные корабли"
 HUN_capital_ships_desc:0 "Ядром военно-морского флота является линкор. Мы должны наверстать упущенное время и как можно скорее приступить к строительству новых судов."
 HUN_destroyer:0 "Эсминцы"
 HUN_destroyer_desc:0 "Разрушители являются важной, но часто упускаемой из виду частью флота. Вместе с низкой стоимостью они являются хорошим стартом для любой программы военно-морского расширения."
 HUN_cruisers:0 "крейсеры"
 HUN_cruisers_desc:0 "Даже самая мощная сила бесполезна, если она не может найти врага или защитить себя от самолетов. Проектирование новых легких и тяжелых крейсеров помогает нам превратить коллекцию кораблей в настоящий флот."
 HUN_submarines:0 "Подводные лодки"
 HUN_submarines_desc:0 "В прошлой войне подводные лодки едва не победили самый мощный флот планеты. Нас не смогут воспринимать всерьёз как современную морскую державу, если у нас не будет собственных подводных лодок."
 HUN_carriers:0 "Авианосцы"
 HUN_carriers_desc:0 "Линкор является реликтом давно ушедшего времени. Будущее военно-морской войны — авианосец и самолет. Мы будем на переднем крае этого развития."
 fighter_tt:0 "Нужно иметь современного бойца, чтобы предложить и быть в мире с ним. [Root.GetName]"
 bomber_tt:0 "Должен иметь современный бомбардировщик, чтобы предложить и быть в мире с [Root.GetName]"
 ROM_preserve_greater_romania:0 "Сохранение Великой Румынии"
 ROM_preserve_greater_romania_desc:0 "Наконец-то нам удалось объединить всех румынских спикеров в нашей стране. Теперь мы должны обеспечить, чтобы наши дети могли унаследовать наше наследие Румынии для всех румын."
 ROM_a_deal_with_the_devil:0 "Сделка с дьяволом"
 ROM_a_deal_with_the_devil_desc:0 "Коммунизм угрожает нашей восточной границе, и территориальные требования могут быть только за горизонтом. Может быть, лучше присоединиться к Советам, чем воевать с ними."
 ROM_form_peasant_militias:0 "Формирование крестьянских милиций"
 ROM_form_peasant_militias_desc:0 "С коммунистическими идеалами, которые мы берем у нашего соседа, каждый человек обязан защищать своих товарищей, свою страну и революцию."
 ROM_basing_rights_for_soviet_union:0 "Основные права для Советского Союза"
 ROM_basing_rights_for_soviet_union_desc:0 "Мы знаем, что Советы хотят нашу территорию, но мы могли бы предотвратить любые военные действия, предложив нашим соседям права базирования."
 ROM_romanian_volunteer_brigades:0 "Румынские добровольческие бригады"
 ROM_romanian_volunteer_brigades_desc:0 "Мы создадим добровольческие бригады для поддержки новых революций в других странах."
 ROM_join_comintern:0 "Вступить в Коминтерн"
 ROM_join_comintern_desc:0 "Настало время, наконец, подать прошение о членстве в Коминтерне. Это защитит нашу территорию от притязаний с Востока и позволит нам более активно отстаивать дело коммунизма во всем мире."
 ROM_german_romanian_trade_agreement:0 "Торговый договор с Германией"
 ROM_german_romanian_trade_agreement_desc:0 "Нам известно об экономическом интересе Германии к нашей стране. Увеличив поставки таких товаров, как нефть, мы сможем запросить германскую помощь в модернизации вооружённых сил."
 ROM_german_romanian_oil_exploitation_company:0 "Немецко-румынская нефтяная эксплуатация"
 ROM_german_romanian_oil_exploitation_company_desc:0 "Немецкая потребность в нефти огромна, что дает нам возможность расширить наши нефтеперерабатывающие заводы."
 ROM_invite_german_advisors:0 "Пригласить германских советников"
 ROM_invite_german_advisors_desc:0 "Немецкая помощь необходима, если мы хотим модернизировать наши вооруженные силы. Они обладают техническими ноу-хау, которые нам необходимы, и поэтому мы должны обратиться за помощью к их советникам."
 ROM_invite_german_advisors_tt:0 "Разрешить Германии разместить войска на румынской земле.\n"
 ROM_license_german_equipment:0 "Лицензия на немецкое оборудование"
 ROM_license_german_equipment_desc:0 "Немецкая техника превосходит нашу собственную, но, возможно, мы могли бы получить лицензии на производство этого оружия сами."
 ROM_join_axis:0 "Присоединяйтесь к оси"
 ROM_join_axis_desc:0 "Настало время присоединиться к Оси, чтобы мы могли вместе с немцами построить славное румынское будущее."
 ROM_demand_transnistria:0 "Приднестровье требует"
 ROM_demand_transnistria_desc:0 "Теперь, когда мы сильны и имеем немецкую поддержку, пришло время потребовать регион Приднестровья, включив его в Большую Румынию."
 ROM_renew_the_romanian_polish_alliance:1 "Возобновление румынско-польского альянса"
 ROM_renew_the_romanian_polish_alliance_desc:0 "Наши старые связи с Польшей за последние годы охладились. По мере того, как угрозы, окружающие нас, не уменьшаются, а глобальная политическая ситуация становится все более бурной, настало время возродить наш союз с нашим северным соседом."
 ROM_the_cordon_sanitaire:0 "Санитарный кордон"
 ROM_the_cordon_sanitaire_desc:0 "Нас граничат опасные идеологии как на востоке, так и на западе. Вместе с нашими соседями на севере и юге мы установим барьер, карантин этих догм и не позволим им продвинуться дальше."
 ROM_demand_a_western_guarantee:0 "Требование западной гарантии"
 ROM_demand_a_western_guarantee_desc:0 "Если мы хотим противостоять как коммунизму, так и фашизму, нам потребуется помощь Запада. Мы будем использовать все имеющиеся в нашем распоряжении политические рычаги для получения такой гарантии."
 ROM_military_modernization:0 "Военная модернизация"
 ROM_military_modernization_desc:0 "Даже при поддержке Запада мы должны стремиться к модернизации армии, чтобы у наших союзников было время поддержать нас до того, как все будет потеряно."
 ROM_join_allies:0 "Присоединяйтесь к союзникам"
 ROM_join_allies_desc:0 "Гарантии недостаточно — пора заявить о западных демократиях в полной мере и встать с ними на защиту свободы."
 ROM_joint_allied_staff_college:0 "Объединенный союзный штаб-колледж"
 ROM_joint_allied_staff_college_desc:0 "В свете наших общих интересов мы должны сотрудничать с западными державами в разработке военной техники и тактики."
 ROM_civil_works:0 "Гражданские работы"
 ROM_civil_works_desc:0 "Для поддержки крупномасштабного наращивания военной мощи Великой Румынии потребуется обширная программа промышленного развития. Мы начнем это сейчас."
 ROM_national_defense_industry:0 "Национальная оборонная промышленность"
 ROM_national_defense_industry_desc:0 "Мы должны значительно расширить нашу национальную оружейную промышленность, если мы хотим идти в ногу с возросшими требованиями."
 ROM_danubian_transport_network:0 "Дунайская транспортная сеть"
 ROM_danubian_transport_network_desc:0 "Наши транспортные возможности вдоль Дуная могут быть значительно улучшены, как за счет более эффективного использования самой реки, так и за счет того, как она связана с нашими автомобильными и железнодорожными сетями."
 ROM_malaxa:0 "Малакса"
 ROM_malaxa_desc:0 "Мы должны расширить отечественную автомобильную промышленность, чтобы она могла быть легко переделана и при необходимости приспособлена для военных целей. С этой целью у одного из наших бизнес-магнатов есть несколько довольно интересных идей, которые мы могли бы использовать в своих целях."
 ROM_invite_foreign_motor_companies:0 "Пригласить иностранные автомобилестроительные компании"
 ROM_invite_foreign_motor_companies_desc:0 "Вместо того, чтобы тратить ресурсы на увеличение производства недоказанных отечественных автомобилей, мы могли бы получить больше выгоды от производства проверенных иностранных образцов по лицензии."
 ROM_hunedoara_steel_works:0 "Сталелитейные заводы Hunedoara"
 ROM_hunedoara_steel_works_desc:0 "Для удовлетворения потребностей нашего производства оружия необходимо модернизировать и значительно расширить крупные сталелитейные заводы в Трансильвании."
 ROM_invest_in_the_iar:0 "Инвестировать в IAR"
 ROM_invest_in_the_iar_desc:0 "Важно не отставать от требований современных ВВС. Наша промышленность должна быть способна не только создавать машины, которые нам нужны в первую очередь, но и делать это достаточно быстро, чтобы заменить эксплуатационные потери."
 ROM_expand_ploiesti_oil_production:0 "Расширение добычи нефти Ploiesti"
 ROM_expand_ploiesti_oil_production_desc:0 "Мы обладаем одними из крупнейших нефтяных месторождений Европы в Плоешти, и они имеют огромное значение не только для нас самих, но и для наших союзников и других стран региона. Мы должны увеличить добычу на месторождениях, чтобы лучше удовлетворять потребности."
 ROM_expand_the_university_of_bucharest:0 "Расширить Университет Бухареста"
 ROM_expand_the_university_of_bucharest_desc:0 "Улучшая качество и возможности нашего университета, мы можем увеличить пул лучших и самых ярких, на которые мы полагаемся для наших технологических достижений."
 ROM_exploit_the_baita_mines:0 "Эксплуатация рудников Baita"
 ROM_exploit_the_baita_mines_desc:0 "Становится ясно, что уран имеет жизненно важное значение для некоторых из самых решительных технологических достижений в области вооружения со времен изобретения огнестрельного оружия. Нам повезло, что у нас есть большой запас этого материала в наших границах, и мы должны создать шахту для его эксплуатации."
 ROM_balkans_dominance:0 "Господство на Балканах"
 ROM_balkans_dominance_desc:0 "Ключ к процветающему будущему Румынии лежит не у революционеров Востока и не у демократий или фашистов Запада, а в румынском господстве на Балканах."
 ROM_puppet_bulgaria:0 "Кукольная Болгария"
 ROM_puppet_bulgaria_desc:0 "Наводнение Болгарии уже давно стало занозой в сторону соседей. Мы должны подчинить их раз и навсегда."
 ROM_align_hungary:0 "Выравнивание Венгрии"
 ROM_align_hungary_desc:0 "Венгрия должна увидеть нашу точку зрения. Их правительство во главе с ошибочными элементами, которые могут только привести страну к гибели. Они будут сильнее с нами."
 ROM_HUN_aligned:0 "Венгрия выровнялась"
 ROM_secure_greece:0 "Безопасная Греция"
 ROM_secure_greece_desc:0 "Греция, хотя в прошлом она часто была союзником, должна согласиться с доминированием Румынии в регионе."
 ROM_divide_yugoslavia:0 "Разделить Югославию"
 ROM_divide_yugoslavia_desc:0 "Нынешнее устройство балканских государств, составляющих Югославию, нежизнеспособно. Мы предъявим ультиматум с требованием реорганизовать их составные части под руководством Румынии."
 ROM_split_czechoslovakia:0 "Раскол Чехословакии"
 ROM_split_czechoslovakia_desc:0 "Чехословакия — это искусственное сооружение, которое не может выжить самостоятельно. Мы не можем позволить этой части погрузиться в хаос и должны вмешаться, прежде чем ситуация станет несостоятельной."
 ROM_secure_the_bosporus:0 "Установить контроль над Босфором"
 ROM_secure_the_bosporus_desc:0 "Сейчас наш флот имеет выход только в Чёрное море. Турция, контролирующая Босфор, в случае войны может перекрыть нам путь в Средиземное море, поэтому мы должны обеспечить свободный проход тогда, когда он понадобится."
 ROM_institute_royal_dictatorship:0 "Королевская диктатура Института"
 ROM_institute_royal_dictatorship_desc:0 "Настало время еще больше увеличить и без того обширные полномочия короля, обеспечив политическую стабильность нации и позволив ей сосредоточиться на угрозах извне."
 ROM_fortify_the_borders:0 "Укрепить границы"
 ROM_fortify_the_borders_desc:0 "Сейчас, когда ситуация внутри страны находится под контролем, мы должны смотреть на улучшение защиты наших границ от внешних угроз."
 ROM_flexible_foreign_policy:0 "Гибкая внешняя политика"
 ROM_flexible_foreign_policy_desc:0 "Мы должны отказаться от наших принципов и наладить отношения с теми, с кем это было бы более практично. От этого зависит наше выживание."
 ROM_his_majestys_loyal_government:0 "Лояльное правительство Его Величества"
 ROM_his_majestys_loyal_government_desc:0 "Внутренняя лояльность имеет первостепенное значение, и до тех пор, пока страна стоит за своим королем, прагматичная внешняя политика не нужна."
 ROM_militarize_the_sentinels:0 "Милитаризовать Стражей"
 ROM_militarize_the_sentinels_desc:0 "Военизированные Стражи могут быть легко преобразованы в полноценную военную организацию при условии выделения соответствующих ресурсов."
 ROM_all_parties_must_end:0 "Все стороны должны прекратить"
 ROM_all_parties_must_end_desc:0 "Ни одна партия не длится вечно, и нынешняя геополитическая ситуация требует безраздельного внимания нашего короля. Он может бросить одного взломщика партии, как только война закончится, но пока он должен оставить свои гедонистические пути позади."
 ROM_revise_the_constitution:0 "Пересмотреть конституцию"
 ROM_carol_current_leader_trigger:0 "§YКароль II§! является нынешним лидером страны."
 ROM_carol_not_leader_trigger:0 "§YКароль II§! Он не является лидером страны."
 ROM_revise_the_constitution_desc:0 "Конституция должна быть переписана, чтобы укрепить позицию короля как лидера нации. Кроме того, опасные ультраправые движения могут быть подорваны путем предоставления более безопасной альтернативы в молодежной организации «Королевский Страж Родины»."
 ROM_the_royal_foundation:0 "Королевский фонд"
 ROM_the_royal_foundation_desc:0 "Король любезно согласился создать фонд от его имени для изучения румынской культуры и создания науки нации."
 ROM_appoint_soviet_friendly_government:1 "Назначить просоветское правительство"
 ROM_appoint_soviet_friendly_government_desc:0 "Будущее Румынии зависит от хороших отношений с нашим коммунистическим восточным соседом. Мы должны назначить правительство, которое понимает эту реальность."
 ROM_securitate:0 "секьюритизировать"
 ROM_securitate_desc:0 "Мы должны создать обширную тайную полицейскую организацию для подавления внутренних угроз нашему новому правительству."
 ROM_appoint_german_friendly_government:1 "Назначение правительства Pro-Axis"
 ROM_appoint_german_friendly_government_desc:0 "Будущее Румынии зависит от хороших отношений с фашистскими державами на Западе. Мы должны назначить правительство, которое понимает эту реальность."
 ROM_appoint_german_friendly_government_tooltip:0 "Убирает §Y«Конституционные гарантии»§! и §Y«Секуритате»§!\n"
 ROM_appoint_allied_friendly_government_tooltip:0 "Убирает §Y«Железную гвардию»§! и §Y«Секуритате»§!\n"
 ROM_appoint_soviet_friendly_government_tooltip:0 "Убирает §Y«Конституционные гарантии»§! и §Y«Железную гвардию»§!\n"
 ROM_iron_guard:0 "Железная гвардия"
 ROM_iron_guard_desc:0 "Пришло время пересмотреть нашу политику в отношении Железной гвардии. С нашим новым правительством движение теперь гораздо больше соответствует нашей официальной точке зрения и может служить отличным инструментом для повышения политической стабильности страны."
 ROM_force_abdication:0 "Отречение от силы"
 ROM_force_abdication_desc:0 "Король Кэрол II больше не нужен, и, действительно, оказывается более хлопотным, чем лидером. Хотя он все еще имеет обширный контроль над правительством и финансами страны, его необходимо заставить отречься от престола ради долгосрочного блага Румынии."
 ROM_appoint_allied_friendly_government:1 "Назначение просоюзного правительства"
 ROM_appoint_allied_friendly_government_desc:0 "Будущее Румынии зависит от хороших отношений с нашими старыми союзниками на Западе - Францией и ее союзниками. Мы должны назначить правительство, которое будет продолжать эти отношения."
 ROM_constitutional_guarantees:0 "Конституционные гарантии"
 ROM_constitutional_guarantees_desc:0 "Конституционные шансы, которые были реализованы Королем, должны быть возвращены, а гарантии и балансы должны быть введены, чтобы это не повторилось. В противном случае, все, что у нас осталось, - это издевательство над демократией."
 ROM_handle_the_king:0 "Разобраться с королём"
 ROM_handle_the_king_desc:0 "Необходимо принять законы, ограничивающие расточительный образ жизни короля. Национальная казна больше не может использоваться для оплаты его личных расходов."
 ROM_king_michaels_coup:0 "Переворот короля Майкла"
 ROM_king_michaels_coup_desc:0 "Нынешнее правительство разоряет Румынию. Необходима твердая рука, чтобы увести страну от катастрофы — рука принца Майкла."
 ROM_expand_the_air_force:0 "Расширить военно-воздушные силы"
 ROM_expand_the_air_force_desc:0 "Современные войны не могут быть выиграны без господства над небом. Мы должны сделать все, что в наших силах, для развития российских ВВС."
 ROM_acquire_licenses:0 "Приобретать лицензии"
 ROM_acquire_licenses_desc:0 "Зарубежные авиационные технологии превосходят наши, и мы должны смотреть на получение лицензий, чтобы мы могли производить самолеты с их инновациями, сами."
 ROM_air_defense:0 "Воздушная оборона"
 ROM_air_defense_desc:0 "Мы должны защищать наши границы с помощью обширных зенитных батарей, чтобы снять нагрузку на наши малые военно-воздушные силы."
 ROM_heavy_interceptors:0 "Тяжелые интерцепторы"
 ROM_heavy_interceptors_desc:1 "Наша страна не может поддерживать крупные ВВС. Мы должны сосредоточить как можно больше огневой мощи в каждом самолете, чтобы уничтожить любого нападающего."
 ROM_ground_support:0 "Наземная поддержка"
 ROM_ground_support_desc:0 "Комбинированное оружие является важным принципом современной войны. Военно-воздушные силы должны быть обучены для поддержки наших сухопутных войск, когда это необходимо."
 ROM_medium_bombers:0 "Средние бомбардировщики"
 ROM_medium_bombers_desc:0 "Эпоха, когда армии могли выигрывать войны, не обращая внимания на небо, прошла. Необходимо развивать тактические бомбардировщики, чтобы обеспечить солдат необходимой поддержкой с воздуха."
 ROM_cas:0 "Штурмовики"
 ROM_cas_desc:0 "Нам нужны специальные модели самолетов, специально предназначенные для поддержки с близкого расстояния, если мы хотим получить максимальную отдачу от наших объединенных сил."
 ROM_acquire_fighters:0 "Приобрести бойцов"
 ROM_acquire_fighters_desc:0 "Превосходство в воздухе является ключевым для нашей обороны, и поэтому важно, чтобы мы расширяли наши истребители любыми возможными способами."
 ROM_local_development:0 "Местное развитие"
 ROM_local_development_desc:0 "Мы будем полагаться на отечественную авиационную промышленность Румынии для производства самолетов, которые нам нужны."
 ROM_air_superiority:0 "Воздушное превосходство"
 ROM_air_superiority_desc:0 "Освоение воздушного пространства является необходимым требованием для военных операций, и именно на этом аспекте воздушной войны мы должны сосредоточиться."
 ROM_strategic_bomber_force:0 "Стратегические бомбардировщики"
 ROM_strategic_bomber_force_desc:0 "Военные действия вторичны только по отношению к разрушению промышленности и инфраструктуры противника. Стратегические бомбардировки — это средства, с помощью которых мы добьемся этого."
 ROM_heavy_bombers:0 "Тяжелые бомбардировщики"
 ROM_heavy_bombers_desc:0 "Наши стратегические бомбардировочные силы требуют достаточной дальности и бомбовых нагрузок. Крупные бомбардировщики являются единственным жизнеспособным вариантом для достижения этих требований."
 ROM_nuclear_bomb_project:0 "Проект ядерной бомбы"
 ROM_nuclear_bomb_project_desc:0 "Мы никогда не можем надеяться на то, что сможем бомбить наших вероятных врагов обычными средствами. Поэтому мы должны сосредоточиться на техническом прогрессе, который позволит нам добиться большего разрушения с меньшими затратами. Гораздо больше."
 ROM_iar_80:0 "IAR 14"
 ROM_iar_80_desc:0 "У наших инженеров есть отличные идеи, которые они хотят воплотить в новый дизайн истребителя. Они просто нуждаются в финансировании и поддержке."
 ROM_army_maneuvers:0 "Армейские манёвры"
 ROM_army_maneuvers_desc:0 "Наша армия должна быть приведена в форму для потенциальных будущих вооруженных конфликтов. Мы направим их на маневры для разработки новых тактик и стратегий."
 ROM_army_war_college:0 "Армейский военный колледж"
 ROM_army_war_college_desc:0 "Нам нужны самые светлые умы, которые будут командовать нашими вооруженными силами, а это значит, что военный колледж должен быть расширен."
 ROM_war_college_tt:0 "А. §Y2 Навыки§! Генерал по имени §YБарбу Парайану§! Появится."
 ROM_the_zb_53:0 "ZB-53"
 ROM_the_zb_53_desc:0 "Современная техника является ключевым элементом в войне, и мы должны стремиться к модернизации нашего пехотного вооружения."
 ROM_vanatori_de_munte:0 "Ванатори де Мунте"
 ROM_vanatori_de_munte_unit_tt:0 "\nПолучить §Yгорец§! Подразделение с 9 батальонами.\n"
 ROM_vanatori_de_munte_desc:0 "Vanatori De Munte — горные охотники — наша элитная горная пехота. Их репутация предшествует им, даже за рубежом, и мы будем делать все возможное, чтобы увеличить их число с помощью лучшего, что мы можем найти."
 ROM_artillery_modernization:0 "Модернизация артиллерии"
 ROM_artillery_modernization_desc:0 "Пехота не работает при должной поддержке артиллерии. Обеспечение современными, качественными орудиями будет иметь большое значение для повышения эффективности наших сил."
 ROM_modern_at_guns:0 "Современные AT Guns"
 ROM_modern_at_guns_desc:0 "Наступил возраст танка, и нашей пехоте требуются современные средства для защиты от этих стальных бегемотов."
 ROM_mountain_artillery:0 "Горная артиллерия"
 ROM_mountain_artillery_tech_tt:0 "Позволяет §HГорный пистолет§!\n§Hартиллерия\n    Гора§!: Движение: §G+15%§!\n§Hпротивотанковый\n    Гора§!: Движение: §G+15%§!"
 ROM_mountain_artillery_desc:0 "Наши альпинисты должны получить артиллерийскую поддержку, если мы хотим сохранить их превосходство. Поэтому наша артиллерия должна быть приспособлена для использования в горах."
 ROM_reserve_divisions:0 "Резервные дивизии"
 ROM_reserve_divisions_desc:0 "Румыния - маленькая страна, и мы должны выделить соответствующие количества для резервирования дивизий, если наша армия хочет иметь какую-либо оставшуюся силу в поле."
 ROM_royal_guards_divisions:0 "Королевские гвардейские дивизии"
 ROM_royal_guards_divisions_tt:0 "Получить единицу с §Y7 Пехота§! и §Y2 Артиллерия§! Батальоны.\n"
 ROM_royal_guards_divisions_desc:0 "Наша королевская гвардия должна быть расширена, как это уместно для нашего великого короля."
 ROM_the_armored_division:0 "бронетанковая дивизия"
 ROM_the_armored_division_tt:0 "Получить подразделение с §Y4 батальонами средних танков§! и §Y4 моторизованными батальонами§!.\n"
 ROM_the_armored_division_desc:0 "Танки - это путь вперед, и мы должны создать специальные дивизии, которые используют сильные стороны этого нового оружия."
 ROM_acquire_modern_tanks:0 "Приобретение современных танков"
 ROM_acquire_modern_tanks_desc:0 "Развитие танков продолжается быстрыми темпами, и приобретать устаревшие модели не получится."
 ROM_mobile_tank_destroyers:0 "Мобильные разрушители танков"
 ROM_mobile_tank_destroyers_desc:0 "Мы не обладаем промышленностью для того, чтобы перепроизводить наших врагов по танкам. Вместо этого мы должны сосредоточиться на производстве оружия, которое может свести на нет превосходство противника в бронетанковых частях."
 ROM_the_maresal:0 "Марезальский"
 ROM_the_maresal_desc:0 "Наши инженеры придумали идею разместить советскую 122-мм гаубицу в закрытом каземате. Благодаря дальнейшему совершенствованию этой конструкции, мы вполне можем быть на пути к созданию высокоэффективной модели танка."
 ROM_expand_the_galati_shipyards:0 "Расширение верфей Galati"
 ROM_expand_the_galati_shipyards_desc:0 "Наши уже существующие верфи в Галати должны быть значительно расширены, если мы хотим проецировать нашу мощь на Черное море."
 ROM_coastal_defense_navy:0 "ВМС береговой обороны"
 ROM_coastal_defense_navy_desc:0 "Имея ограниченные ресурсы, мы можем стремиться только к тому, чтобы обеспечить безопасность наших берегов. Все усилия должны быть направлены на достижение этой цели."
 ROM_coastal_defense_ships:0 "Корабли береговой обороны"
 ROM_coastal_defense_ships_tech_tt:0 "Позволяет §HКорабли береговой обороны§!\n§HТяжёлые крейсеры§!\n    Броня: §G+20%§!\n    Морская огневая мощь: §G+10%§!\n    Издержки производства: §G-10%§!"
 ROM_coastal_defense_ships_desc:0 "Новые конструкции должны быть созданы для кораблей, которые превосходят береговую оборону."
 ROM_modern_destroyers:0 "Современные эсминцы"
 ROM_modern_destroyers_desc:0 "Разрушители являются основой любого военно-морского флота, и наш не исключение. Наш морской хребет должен быть приведен в соответствие с современными стандартами."
 ROM_torpedo_boats:0 "Лодки-торпеды"
 ROM_torpedo_boats_desc:0 "Торпеды — великий уравнитель морской войны. Обеспечивая их перевозку всеми нашими кораблями, мы можем удивить и уничтожить превосходящую силу благодаря дерзости и объему торпедного огня."
 ROM_modern_submarines:0 "Современные подводные лодки"
 ROM_modern_submarines_desc:0 "Подводная война является самым захватывающим военно-морским развитием со времен изобретения торпедного катера. Мы будем хорошо защищаться от подводных лодок и использовать их против вражеского судоходства."
 ROM_black_sea_dominance:0 "Преобладание Черного моря"
 ROM_black_sea_dominance_desc:0 "Наша первоначальная нехватка ресурсов не должна быть препятствием для будущего полного румынского господства в Черном море. При наличии соответствующей политической воли мы сделаем это реальностью."
 ROM_capital_ships:0 "Крупные корабли"
 ROM_capital_ships_desc:0 "Если мы хотим, чтобы нас воспринимали всерьез как военно-морскую державу, нам потребуются столичных кораблей для руководства нашим Черноморским флотом."
 ROM_torpedo_bombers:0 "Торпедоносцы"
 ROM_torpedo_bombers_desc:0 "Мы можем восполнить свою морскую слабость, присвоив часть наших военно-воздушных сил военно-морским обязанностям. Для этого потребуется новая модель самолета, способная нести торпеду."
 ROM_expand_the_marine_regiment:0 "Расширить полк морской пехоты"
 ROM_expand_the_marine_regiment_desc:0 "Овладение Черным морем открывает новые возможности для атак. Морские вторжения теперь являются жизнеспособным вариантом, требующим создания новых моделей транспорта, а также выделенных морских дивизий, которые могут специализироваться на этой форме войны."
 CZE_fortification_studies:0 "Укрепительные исследования"
 CZE_fortification_studies_desc:0 "Необходимость укрепления нашей границы очевидна, но вопрос в том, как? Французы недавно построили невероятную укрепленную линию, линию Мажино, и, отправив делегацию для изучения своих методов, мы сможем решить наши собственные проблемы защиты границ."
 CZE_fallback_line:0 "Линия Fallback"
 CZE_fallback_line_desc:0 "Если граница не может быть удержана, было бы хорошо иметь вторую линию укрепления, чтобы отступить, прежде чем любое нападение с запада может достичь нашего сердца."
 CZE_sudeten_1:0 "Судетские ранние укрепления"
 CZE_sudeten_1_desc:0 "Судетская область, наша горная граница с Германией, является идеальным местом для пограничных укреплений. Изучив французскую линию Мажино, мы можем построить подобную линию."
 CZE_sudeten_2:0 "Укрепления Sudetenland Advanced"
 CZE_sudeten_2_desc:0 "Судетская область теперь может похвастаться достойной оборонительной линией, но приличная недостаточно хороша, когда на карту поставлено наше национальное выживание."
 CZE_sudeten_3:0 "Заключительные укрепления Судетов"
 CZE_sudeten_3_desc:0 "Судеты имеют сильную систему укреплений, но они все еще могут быть сильнее!"
 CZE_hungarian_line:0 "Венгерская линия"
 CZE_hungarian_line_desc:0 "Венгерский ирредентизм представляет собой постоянную угрозу для нашей нации, система укреплений вдоль нашей взаимной границы поможет обеспечить нашу безопасность."
 CZE_polish_line:0 "Польская линия"
 CZE_polish_line_desc:0 "Польская агрессия не знает границ, но, надеюсь, хорошо укрепленная граница заставит их искать более легкую цель."
 CZE_internal_redoubts:0 "Внутренние редуты"
 CZE_internal_redoubts_desc:0 "Любая система укреплений может быть нарушена. Чтобы избежать этого, мы можем построить сильные точки вокруг наших самых важных городов, чтобы они не могли быть легко захвачены врагом, который прорывается через наши линии."
 CZE_industrial_legacy:0 "Промышленное наследие"
 CZE_industrial_legacy_desc:0 "Skoda Works была крупнейшим производителем оружия в Австро-Венгрии, и с момента обретения независимости она стала лидером во многих областях промышленности. Наличие такой высокой концентрации как опыта, так и тяжелой промышленности в значительной степени помогает всем промышленным предприятиям."
 CZE_favor_czechs_1:0 "Чешская промышленность"
 CZE_favor_czechs_1_desc:0 "Между чехами и словаками в нашей стране всегда была напряженность, не в последнюю очередь потому, что большая часть нашей промышленной мощи сосредоточена в чешских провинциях Богемия и Моравия. Тем не менее, эта промышленная власть значительно облегчает строительство большего количества заводов в этих районах, несмотря на то, что это может еще больше расстроить словаков."
 CZE_favor_czechs_2:1 "Промышленные Хартленды"
 CZE_favor_czechs_2_desc:1 "Дальнейшие инвестиции, направленные на Богемию и Моравию, улучшат нашу отрасль гораздо больше, чем более широкий подход."
 CZE_favor_czechs_3:1 "Новые индустриальные города"
 CZE_favor_czechs_3_desc:1 "После развития старых промышленных районов в Богемии и Моравии пришло время строить новые города для размещения рабочих для наших растущих отраслей промышленности."
 CZE_balanced_1:1 "Сбалансированные инвестиции в промышленность"
 CZE_balanced_1_desc:0 "Стремясь ослабить напряженность в отношениях между чехами и словаками, было предложено, чтобы будущий промышленный рост был равномерно разделен между их соответствующими частями страны, несмотря на то, что это менее эффективно в целом."
 CZE_balanced_2:1 "Совместная Чехословацкая плановая комиссия"
 CZE_balanced_2_desc:1 "Создавая объединенный орган политиков из обеих частей страны, мы можем гарантировать, что каждый сможет в равной степени участвовать в промышленном росте нашей нации."
 CZE_balanced_3:1 "Местная специализация"
 CZE_balanced_3_desc:1 "С продолжающимися инвестициями в промышленность всех регионов страны некоторые направления стали специализироваться на тех или иных товарах и услугах. Мы можем поощрять это и дальше."
 CZE_united_population:0 "Объединенное население"
 CZE_united_population_desc:0 "Ряд недавних политических инициатив в сочетании с нашей политикой сбалансированного промышленного роста привели к тому, что чехи и словаки по всей стране чувствуют себя гораздо более сплоченными в своих целях."
 CZE_arms_exports_1:0 "Экспорт вооружений"
 CZE_arms_exports_1_desc:0 "Skoda Works уже давно является крупным поставщиком оружия по всей Европе, производя оружие в масштабах, намного превышающих потребности только нашей страны. Производство в таких масштабах приводит к эффективности производства, о которой мало кто может мечтать."
 CZE_arms_exports_2:1 "Экспортные субсидии"
 CZE_arms_exports_2_desc:1 "По мере того, как угроза войны нависает, все больше и больше стран стремятся приобрести танки. Правительственные гарантии по кредитам и другие меры могут стимулировать другие страны покупать чехословацкие товары, а также еще больше улучшить экономику масштаба."
 CZE_arms_exports_3:1 "Гарантия равного доступа"
 CZE_arms_exports_3_desc:1 "Спрос на оружие находится на рекордно высоком уровне, как и объемы производства наших производственных линий. Чтобы поддержать продажу оружия, мы можем публично заявить, что продадим его кому угодно с наличными деньгами, чтобы заплатить за него, а затем использовать эти деньги для инвестиций в наше собственное перевооружение."
 CZE_political_direction:0 "Политическое направление"
 CZE_political_direction_desc:0 "Наша демократия молода и еще не прошла строгих испытаний. С ростом фашизма и коммунизма по всей Европе, необходимо задать вопрос: правильное ли это направление, или если нет, то что?"
 CZE_go_left:0 "Влево."
 CZE_go_left_desc:0 "Коммунизм – это будущее! Все усилия должны быть направлены на то, чтобы перестроить наше правительство и общество в соответствии с марксистскими идеалами."
 CZE_czech_socialism:0 "Чешский социализм"
 CZE_czech_socialism_desc:1 "Центральный контроль, безусловно, хорош для экономики, но, возможно, можно иметь слишком много хорошего. Благодаря децентрализации в чешских и словацких советах может преобладать большее общее единство."
 CZE_communism_with_a_human_face:0 "Коммунизм с человеческим лицом"
 CZE_communism_with_a_human_face_desc:1 "Призывая к более широкому участию народа в местной и сельской политике под эгидой Коммунистической партии, мы вдохнем новую жизнь в идеалы коммунизма."
 CZE_communist_support:0 "Коммунистическая поддержка"
 CZE_communist_support_desc:0 "Наш левый поворот набирает обороты. Поддержка коммунизма растет по всей стране, и этот показатель будет только увеличиваться, поскольку мы оказываем ему большую поддержку со стороны правительства."
 CZE_join_comintern:0 "Вступить в Коминтерн"
 CZE_join_comintern_desc:0 "На наших менее прогрессивных бывших союзников больше нельзя полагаться. Пора заключить союз с СССР для обеспечения нашей безопасности от фашистско-империалистической агрессии."
 CZE_the_romanian_question:0 "Румынский вопрос"
 CZE_the_romanian_question_desc:0 "Румыния стоит между нами и нашим другом и защитником, Советским Союзом. Поскольку они не позволят советским войскам перейти на нашу оборону, необходимо рассмотреть более радикальное решение."
 CZE_the_polish_division:0 "Польская дивизия"
 CZE_the_polish_division_desc:0 "Польша не только отказывается от прохода советских войск в случае, если нам понадобится их помощь, но и по-прежнему питает негодование по поводу нашего освобождения Заольцие и вполне может мстить. Упреждающая защита была бы разумной."
 CZE_democratic_bastion:0 "Демократический бастион"
 CZE_democratic_bastion_desc:0 "Чехословакия является оплотом демократии в Центральной Европе и останется таковым, что может случиться!"
 CZE_beacon_of_liberty:0 "Маяк Свободы"
 CZE_beacon_of_liberty_desc:0 "Наша приверженность демократии вдохновляет как наших собственных граждан, так и тех, кому пришлось бежать от более деспотичных режимов."
 CZE_defensive_preparations:0 "Оборонительная подготовка"
 CZE_defensive_preparations_desc:0 "Кажется, что война идет независимо от того, хотим мы этого или нет. Поэтому лучше всего, чтобы мы были к этому готовы."
 CZE_bonus_research_slot_1:0 "Чешский технический университет"
 CZE_bonus_research_slot_1_desc:0 "С надвигающейся войной, больший акцент на практических технологиях будет стоять на нашей стороне."
 CZE_go_right:0 "Вправо."
 CZE_go_right_desc:0 "Только при фашизме чешский народ может возвыситься до величия! Демократия в Европе обречена на вымирание, и только сильные нации, фашистские нации, будут сидеть за столом переговоров, когда слабые государства будут вырезаны!"
 CZE_czech_fascism:0 "Чешский фашизм"
 CZE_czech_fascism_desc:0 "Поддержка фашизма растет по всей стране, и по мере того, как все больше власти попадает в фашистские руки, большее давление может быть оказано на диссидентов, которые сопротивляются."
 CZE_aggressive_wars:0 "Агрессивные войны"
 CZE_aggressive_wars_desc:0 "С триумфом фашизма может начаться наш подъем к власти!"
 CZE_the_polish_question:0 "Польский вопрос"
 CZE_the_polish_question_desc:0 "Поляки никогда не простили нам Заольцие, и если мы проявим какую-либо слабость, они, несомненно, набросятся. Почему такая великая страна, как Чехословакия, должна страдать от такой угрозы? Больше нет! Необходимо принять решительные меры!"
 CZE_exclude_the_slovaks:0 "Чешская консолидация"
 CZE_exclude_the_slovaks_desc:1 "Со дня образования нашей страны словаки были недовольны. Они всегда стремятся к большей политической власти, всегда требуют большего, чем их справедливая доля национальных ресурсов. Больше нет! Отныне власть будет сосредоточена в руках Чехии.§RЭто приведет к гражданской войне.§!"
 CZE_national_fascism:0 "Национальный фашизм"
 CZE_national_fascism_desc:0 "Чехи и словаки полностью объединены под знаменем фашизма. Вместе мы продвигаемся вперед! Вместе мы неудержимы!"
 CZE_german_minor_ally:0 "Немецкий союзник"
 CZE_german_minor_ally_desc:0 "Германия — это растущая держава, за которой мы можем следовать во славу. Там, где Германия ведет, мы будем следовать и собирать наши цели на пути."
 CZE_german_minor_ally_tt:0 "Станьте немецким спутником, предоставляя бонусы за лицензирование немецких технологий, а также предоставляя Германии господство над нашей страной."
 CZE_german_ally:0 "Немецкий партнер"
 CZE_german_ally_desc:0 "Германия – это фашистская держава, путешествующая по пути к славе. Вместе мы заставим мир вращаться вокруг Пражско-Берлинской оси!"
 CZE_strategy_decisions:0 "Стратегические решения"
 CZE_strategy_decisions_desc:0 "Над Европой надвигается буря, угроза войны нависает, но как Чехословакия справится с предстоящими вызовами?"
 CZE_german_leanings:0 "Германское умиротворение"
 CZE_german_leanings_desc:0 "Немецкая власть находится на подъеме, и их заявленная цель состоит в том, чтобы объединить всех немецкоязычных людей в пределах одного рейха. Как нация со значительным немецким меньшинством, это тревожные события. Если мы не сможем обеспечить себе сильных союзников, нам будет выгодно остаться в благодати Германии."
 CZE_german_puppet:0 "Немецкая марионетка"
 CZE_german_puppet_desc:0 "Германия не может быть умиротворена, она не остановится до тех пор, пока не будет править нами. И все же, возможно, сгибая колено, мы сможем сохранить некоторую автономию?"
 CZE_hungarian_situation:0 "Венгерская ситуация"
 CZE_hungarian_situation_desc:0 "Венгрия долгое время была занозой на нашей стороне, но со всей мощью фашизма позади нас время Венгрии подошло к концу."
 CZE_deliver_sudetenland:0 "Доставка Судетов"
 CZE_deliver_sudetenland_desc:0 "Германия хочет наших немцев. Кажется, что если мы хотим предотвратить войну, единственный способ - это передать Судетскую область."
 CZE_german_technology:0 "Немецкая технология"
 CZE_german_technology_desc:0 "Сейчас, когда мирные отношения между нашими странами обеспечены, было высказано предположение, что взаимный обмен технологиями может принести пользу обеим сторонам."
 CZE_trust_in_the_west:0 "Доверие на Западе"
 CZE_trust_in_the_west_desc:0 "Франция и Великобритания будут защищать мир в Европе. В конце концов, они не выиграли Великую войну только для того, чтобы позволить Германии угрожать и расчленить суверенные государства двадцать лет спустя!"
 CZE_doctrinal_innovation:0 "Доктринальные инновации"
 CZE_doctrinal_innovation_desc:0 "Мы многому научились в ходе обменов офицерами и стратегических сессий с нашими союзниками. Сочетание таких разрозненных точек зрения поставило нас на грань прорыва."
 CZE_bonus_research_slot_2:1 "Команды по обмену знаниями"
 CZE_bonus_research_slot_2_desc:0 "Обмен знаниями между союзниками принес такие большие выгоды, что теперь он предлагается в качестве постоянного учреждения."
 CZE_secret_weapons:0 "Секретное оружие"
 CZE_secret_weapons_desc:0 "Будущее чешской войны заключается в освоении нескольких передовых технологий и использовании их в наших интересах."
 CZE_nukes:0 "Ядерное оружие"
 CZE_nukes_desc:0 "Будущее чешской войны заключается в овладении силой расщепленного атома."
 CZE_an_entente_of_our_own:0 "Антанта нашей собственной"
 CZE_an_entente_of_our_own_desc:0 "«Маленькая Антанта» в последние годы исчезла, но она может снова подняться, если наши бывшие союзники захотят."
 CZE_invite_yugoslavia:0 "Приглашение Югославии"
 CZE_invite_yugoslavia_desc:0 "Пригласить Югославию в Антанту."
 CZE_invite_romania:0 "Приглашение Румынии"
 CZE_invite_romania_desc:0 "Пригласить Румынию в Антанту."
 CZE_faction_tech_sharing:0 "Пакт Организации"
 CZE_faction_tech_sharing_desc:0 "Для того чтобы хорошо работать вместе, армии Антанты должны быть оснащены на аналогичном уровне. Для этого мы предлагаем всем членам нашей фракции свободно делиться друг с другом своими технологиями."
 CZE_security_council:0 "Совет Безопасности"
 CZE_security_council_desc:0 "Совет безопасности Антанты обеспечит координацию действий всех членов при планировании совместных военных операций."
 CZE_deal_with_hungary:0 "Распад Венгрии"
 CZE_deal_with_hungary_desc:0 "По мере того, как мир рушится по всей Европе, Антанта не может позволить Венгрии снова стать угрозой. Только постоянное решение может позволить нам сосредоточиться на более крупных проблемах."
 CZE_deal_with_bulgaria:0 "Распад Болгарии"
 CZE_deal_with_bulgaria_desc:0 "Болгария вновь вооружилась и вновь угрожает безопасности Балкан. Это угроза, которую нельзя терпеть, если Антанта сосредоточится на общем конфликте в Европе."
 CZE_rapprochement_with_hungary:0 "Сближение с Венгрией"
 CZE_rapprochement_with_hungary_desc:0 "Венгерский ирредентизм представляет собой постоянную угрозу, но, возможно, можно приложить последние усилия для мирного урегулирования вопроса?"
 CZE_czechoslovak_legion:0 "Чехословацкий легион"
 CZE_czechoslovak_legion_desc:0 "Чехословацкий легион воевал по всей Европе во время Великой войны и глубоко внутри России во время их гражданской войны. Теперь, когда конфликт распространяется по всей Европе, Легион может снова пройти маршем."
 CZE_military_research_institute:0 "Военно-технический институт"
 CZE_military_research_institute_desc:0 "Военно-технический институт существует для обеспечения чехословацких вооруженных сил военными научно-исследовательскими, опытно-конструкторскими и испытательными возможностями."
 CZE_mountain_bonus:0 "Горные войска"
 CZE_mountain_bonus_desc:0 "Когда большая часть нашей границы состоит из холмов и гор, потребность в специализированных солдатах для полиции и защиты этих районов очевидна."
 CZE_inf_and_artillery_advancement:1 "Продвижение пехоты"
 CZE_inf_and_artillery_advancement_desc:1 "Пехота является важнейшим подразделением в нашей армии, поэтому совершенствование их вооружения является жизненно важным шагом на пути к успешной национальной обороне."
 CZE_support_bonus:1 "Подразделения поддержки"
 CZE_support_bonus_desc:1 "Для того чтобы наша пехота действовала с максимальной эффективностью, необходимо также модернизировать опорные ветви."
 CZE_inf_and_artillery_advancement_2:1 "Артиллерийский прогресс"
 CZE_inf_and_artillery_advancement_2_desc:1 "Королева поля боя, современная артиллерия будет большим умножителем силы в нашей армии."
 CZE_doctrine_bonus:0 "Доктринальные открытия"
 CZE_doctrine_bonus_desc:0 "Оружие само по себе не делает армию мощной, нужны эффективные доктрины. Военно-технический институт хорошо это понимает и предлагает ряд предложений."
 CZE_motorization_scheme:0 "Схема моторизации"
 CZE_motorization_scheme_desc:0 "Несмотря на то, что у нас нет самой большой армии вокруг, моторизация дает возможность более быстро сосредоточить наши силы в районе."
 CZE_armour_bonus_1:1 "LT vz. 38"
 CZE_armour_bonus_1_desc:0 "Наша армия может похвастаться одними из самых передовых танков в мире, но технологии в этой области быстро развиваются, и мы не можем позволить себе остаться позади."
 CZE_mechanization:0 "Механизация"
 CZE_mechanization_desc:0 "В то время как моторизация предлагала нашим солдатам скорость, механизация предлагала им скорость, защиту и огневую мощь."
 CZE_armour_bonus_ii:1 "Модернизация брони"
 CZE_armour_bonus_ii_desc:0 "Военно-технический институт продолжает тесно сотрудничать с компанией Skoda Works в разработке новых и более совершенных танков."
 CZE_doctrine_bonus_2:0 "Доктрина открытия II"
 CZE_doctrine_bonus_2_desc:0 "Оружие само по себе не делает армию мощной, необходимы и эффективные доктрины. Военно-технический институт хорошо это понимает и предлагает ряд предложений."
 CZE_war_college:0 "Военный колледж"
 CZE_war_college_desc:0 "Военный колледж предоставляет нашей армии хорошо подготовленных лидеров, которые должны привести ее к победе."
 CZE_war_college_effect_tt:0 "§YЕсли у вас уже есть 5 слотов для исследований, вы не получите дополнительную плату.§!\n"
 CZE_military_aeronautical_institute:0 "Военный авиационный институт"
 CZE_military_aeronautical_institute_desc:0 "Военный авиационный институт предоставляет чехословацким ВВС исследовательские и конструкторские предложения."
 CZE_import_foreign_fighters:0 "Импорт иностранных бойцов"
 CZE_import_foreign_fighters_desc:0 "Импортируя для тестирования и оценки различные иностранные самолеты-истребители, наши собственные авиаконструкторы извлекут ценные уроки."
 CZE_light_fighter_focus:0 "Фокус Light истребитель"
 CZE_light_fighter_focus_desc:0 "Военный авиационный институт пришел к выводу, что легкие истребители являются наиболее полезными и должны составлять ядро наших ВВС."
 CZE_heavy_fighter_focus:0 "Тяжелый истребитель Focus"
 CZE_heavy_fighter_focus_desc:0 "Военный авиационный институт пришел к выводу, что тяжелые истребители являются наиболее полезными и должны составлять ядро наших ВВС."
 CZE_air_is_our_sea:0 "Воздух – это наше море"
 CZE_air_is_our_sea_desc:0 "Другие страны зависят от военно-морского флота для защиты своих границ и проецирования силы, для нас эта роль выполняется нашими военно-воздушными силами."
 CZE_rule_the_air:0 "Управляй воздухом"
 CZE_rule_the_air_desc:0 "Наша приверженность военно-воздушным силам позволила нам нарастить замечательную эффективность производства."
 CZE_import_foreign_bombers:0 "Импортировать иностранные бомбардировщики"
 CZE_import_foreign_bombers_desc:0 "Импортируя для испытаний и оценки различные иностранные бомбардировщики, наши собственные авиаконструкторы получат ценные уроки."
 CZE_cas_focus:0 "Ставка на штурмовики"
 CZE_cas_focus_desc:0 "Заключение испытаний Военно-авиационного института указывает на то, что мы должны сосредоточиться на самолетах ближней воздушной поддержки."
 CZE_tac_focus:0 "Тактический бомбардировщик Focus"
 CZE_tac_focus_desc:0 "Заключение испытаний Военного авиационного института указывает на то, что мы должны сосредоточиться на тактических бомбардировщиках."
 CZE_access_to_the_sea:0 "Доступ к морю"
 CZE_access_to_the_sea_desc:0 "Мы больше не не имеющие выхода к морю! Теперь, когда у нас есть береговая линия, мы должны изучить морские вопросы и разработать план создания военно-морского флота."
 CZE_sudden_shipyard:0 "Внезапная верфь"
 CZE_sudden_shipyard_desc:0 "Военно-морскому флоту нужна верфь. Мы не планировали этого, но крупные инженерные проекты для нас ничего нового. При правильном усилии верфь не должна занимать времени."
 CZE_shipbuilding_legacy:0 "Судостроительное наследие"
 CZE_shipbuilding_legacy_desc:0 "Несмотря на то, что собственный военно-морской флот является новым, Skoda Works имеет долгую историю создания компонентов для кораблей австро-венгерского флота. Теперь они могут использовать тот же опыт для производства кораблей для нашего собственного флота."
 CZE_battleship_catchup_1:1 "Броненосец Breakthrough"
 CZE_battleship_catchup_1_desc:1 "Наша новая потребность в военно-морском флоте привела к внезапному шквалу дизайна линкора."
 CZE_destroyer_catchup_1:1 "Прорыв разрушителя"
 CZE_destroyer_catchup_1_desc:1 "Наша новая потребность в военно-морском флоте привела к внезапному шквалу конструкции эсминца."
 CZE_cruiser__catchup_1:1 "Круизный прорыв"
 CZE_cruiser__catchup_1_desc:1 "Наша новая потребность в военно-морском флоте привела к внезапному шквалу дизайна крейсер."
 CZE_raiding_focus:0 "Рейдовый фокус"
 CZE_raiding_focus_desc:1 "Наш флот должен сосредоточиться на косвенном подходе к предотвращению боевых действий и преследованию судоходства наших противников."
 CZE_capital_focus:0 "Фокус на капитал"
 CZE_capital_focus_desc:1 "Наш флот должен сосредоточиться на прямых и решительных сражениях."
 yugoslavian_focus:0 "Югославское дерево фокуса"
 YUG_western_focus:0 "Западный фокус"
 YUG_western_focus_desc:1 "Ключ к будущему Югославии лежит в руках западных держав, которые географически и экономически ближе к нашей стране."
 YUG_friendship_treaty_with_italy:0 "Договор о дружбе с Италией"
 YUG_friendship_treaty_with_italy_desc:1 "Будучи нашим самым могущественным ближайшим соседом, Италия должна видеть в нас друзей. Мы начнем переговоры о декларации о дружбе между нашими двумя народами."
 YUG_reinforce_old_alliances:0 "Укрепление старых альянсов"
 YUG_reinforce_old_alliances_desc:1 "С момента основания нашей страны мы пользовались поддержкой великих европейских демократий Франции и Великобритании. Настало время укрепить эти отношения в рамках подготовки будущих союзов."
 YUG_attract_foreign_capital:0 "Привлечение иностранного капитала"
 YUG_attract_foreign_capital_desc:1 "Мы можем воспользоваться нашими тесными дипломатическими связями, способствуя притоку иностранного капитала и инвестиций."
 YUG_ban_slovene_nationalist_parties:0 "Запрет словенским националистам"
 YUG_ban_slovene_nationalist_parties_desc:1 "Любой призыв к независимости должен быть подавлен на благо нашей нации. Националистические политические элементы будут объявлены вне закона, а их сторонники будут преследоваться, чтобы они не ослабили нас внутри страны."
 YUG_traditional_values:0 "Традиционные ценности"
 YUG_traditional_values_desc:1 "Традиционные ценности, которым учит православная религия, являются краеугольным камнем нашего общества. Продвижение этих идей не только принесет нам поддержку Православной Церкви, но и сплотит наш народ."
 YUG_claim_bulgaria:0 "Претендовать на Болгарию"
 YUG_claim_bulgaria_desc:0 "Мы не можем успокоиться, пока все южные славяне не объединятся под нашим знаменем. Болгары, возможно, и не считают себя частью нашей нации, но мы определённо считаем иначе."
 YUG_establish_union_with_sofia:0 "Создать союз с Софией"
 YUG_proclaim_greater_yugoslavia:0 "Провозгласить Великую Югославию"
 YUG_proclaim_greater_yugoslavia_desc:0 "Когда значительная часть земель, принадлежащих нам по праву, оказалась под властью Белграда, настало время провозгласить создание Великой Югославии! Все исторические угнетатели наших народов содрогнутся от масштаба наших свершений!"
 YUG_all_yugoslavian_regiments:0 "Всеюгославские полки"
 YUG_all_yugoslavian_regiments_desc:1 "Хотя наши народы могут быть разными, все они должны служить защите нашей нации. При организации наших полков мы не будем делать различий по этническому признаку."
 YUG_crush_the_ustasa:0 "Crush the Ustasa скачать"
 YUG_crush_the_ustasa_desc:1 "Хорватское ультранационалистическое движение «Устаса» становится все более занозой в наших рядах. Она больше не может считаться ничем иным, как террористической организацией, и должна быть искоренена на благо нации."
 YUG_invite_german_military_mission:0 "Пригласить немецкую военную миссию"
 YUG_invite_german_military_mission_desc:1 "Неприязнь наших военных к немцам должна быть преодолена. Приглашение на военную миссию будет иметь большое значение для того, чтобы показать нашим руководителям, что совместная работа приносит большую пользу."
 YUG_join_axis:1 "Подписание Трехстороннего пакта"
 YUG_join_axis_desc:2 "Хотя многие хотели бы, чтобы Югославия присоединилась к союзным державам и сопротивлялась фашизму, мы знаем, что это безнадежная амбиция, которая должна закончиться только войной и хаосом. Нам была предоставлена возможность присоединиться к немцам, итальянцам и японцам в пакте о взаимном военном и экономическом сотрудничестве, и мы должны немедленно извлечь из этого выгоду."
 YUG_invite_italian_naval_experts:0 "Пригласите итальянских военных экспертов"
 YUG_invite_italian_naval_experts_desc:1 "Наши средиземноморские союзники обладают превосходными знаниями в области проектирования и строительства кораблей. Мы приглашаем итальянских специалистов завещать нам свои знания."
 YUG_limited_self_government:0 "Деволюция"
 YUG_limited_self_government_desc:2 "Разногласия внутри нашей страны явно слишком глубоки и слишком велики, чтобы справиться с простыми реформами. Только предоставляя автономию различным народам, составляющим нашу нацию, мы можем сохранить наш союз вместе без применения силы."
 YUG_guarantee_religious_liberties:0 "Гарантия религиозных свобод"
 YUG_guarantee_religious_liberties_desc:1 "Всем должно быть позволено следовать своей религии. Мы введем юридические гарантии на этот счет."
 YUG_local_militias:0 "Местные милиции"
 YUG_local_militias_desc:1 "Народу будет предложено сформировать ополченцев для защиты своей родины. Это позволит более значительной части населения позднее получить право на призыв на военную службу."
 YUG_concessions_for_macedonians:0 "Концессии для македонцев"
 YUG_concessions_for_macedonians_desc:1 "Обратившись к ведущим группам македонцев, мы рассмотрим их жалобы и заработаем их лояльность государству."
 YUG_establish_the_banovina_of_croatia:0 "Учреждение Бановины Хорватии"
 YUG_establish_the_banovina_of_croatia_desc:1 "Создав полуавтономный хорватский банат, мы можем надеяться, что сможем подавить призывы к подлинной независимости."
 YUG_non_discriminating_officer_promotions:0 "Недискриминационные должности офицеров"
 YUG_non_discriminating_officer_promotions_desc:1 "Наша дискриминационная политика должна быть отменена, и отныне всем этническим группам должно быть позволено продвигаться вверх по служебной лестнице. Это позволит нам получить самое мощное военное руководство."
 YUG_join_allies:2 "Королевский альянс"
 YUG_royal_alliance_tt:0 "Мы попытаемся присоединиться к фракции нашего королевского брачного партнера.\nВ случае, если нашим партнером будет принцесса Александра, мы попытаемся присоединиться к союзникам."
 carlist_text:0 "карлики"
 YUG_join_allies_desc:3 "Теперь, когда наш король счастлив в браке, мы должны публично заявить о своей верности, чтобы мы могли полагаться на их военную силу, если станем мишенью наших соседей."
 YUG_reclaim_istria_and_zadar:0 "Восстановление Истрии и Задара"
 YUG_reclaim_istria_and_zadar_desc:1 "Италия по-прежнему владеет территориями Истрии и Зандара. Пришло время вернуть их домой."
 YUG_press_bulgarian_claims_on_thrace:0 "Настаивать на болгарских притязаниях на Фракию"
 YUG_press_bulgarian_claims_on_thrace_desc:1 "Некоторые части Македонии, а также Добруджа всё ещё находятся за пределами наших границ. Поскольку все болгары — славяне, они принадлежат нашей нации."
 YUG_allied_air_combat_school:0 "Школа боевых действий авиации союзников"
 YUG_allied_air_combat_school_desc:1 "Наши новые союзники имеют большой опыт ведения воздушных боев. Стремясь к созданию совместной авиационной боевой школы союзников, мы можем гарантировать, что наши новобранцы-пилоты будут свободно обучаться ценным урокам, которые наши союзники должны выучить."
 YUG_recognize_the_soviet_union:0 "Признать Советский Союз"
 YUG_recognize_the_soviet_union_desc:1 "Хотя мы исторически отказывались признавать большевистское государство на Востоке, нам, возможно, пришло время пересмотреть нашу позицию по этому вопросу. В то время как западные демократии кажутся слишком слабыми, чтобы защищать второстепенные державы, Советский Союз вполне может оказаться более надежным другом."
 YUG_form_peasant_councils:0 "Формирование крестьянских советов"
 YUG_form_peasant_councils_desc:1 "Рабочий должен получить более широкое присутствие в местной политике. Создание крестьянских советов будет иметь большое значение для того, чтобы их голоса были услышаны."
 YUG_mutual_economic_aid:0 "Взаимная экономическая помощь"
 YUG_mutual_economic_aid_desc:1 "Советский Союз и Югославия могут многое предложить друг другу в экономическом плане. Установив выгодные торговые соглашения и договоренности об оказании экономической помощи, мы можем принести друг другу большую пользу."
 YUG_abolish_the_monarchy:0 "Упразднить монархию"
 YUG_abolish_the_monarchy_desc:1 "Монархия вряд ли является подходящей формой правления в наше время, не говоря уже о том, что она полностью несовместима с нашими общественными взглядами. Его надо отменить, а царское правление заменить голосом простого человека."
 YUG_join_comintern:0 "Вступить в Коминтерн"
 YUG_join_comintern_desc:1 "Лучший путь к продвижению революции — это стоять вместе с нашими товарищами по коммунистическому государству в Коминтерне."
 YUG_yugoslavian_path_to_communism:0 "Югославский путь к коммунизму"
 YUG_yugoslavian_path_to_communism_desc:1 "Мы не нуждаемся в руководстве в нашей борьбе за дело рабочих. Мы соберем тех, кто примет наше руководство, и вместе распространим версию Революции."
 YUG_form_the_federal_republic:0 "Формировать Федеративную Республику"
 YUG_form_the_federal_republic_desc:1 "Настало время создать настоящее федералистское государство, в котором будут приветствоваться все народы-члены. Внутренне раздробленная нация, которой мы были последние десятилетия, больше не будет."
 YUG_pan_slavic_workers_congress:0 "Панславянский рабочий конгресс"
 YUG_pan_slavic_workers_congress_desc:1 "Славянские рабочие должны объединиться, чтобы бороться за свое дело, и поскольку Советский Союз не понимает бедственного положения балканских рабочих, мы сами возьмем на себя мантию руководства."
 YUG_research_collaboration:0 "Научное сотрудничество"
 YUG_research_collaboration_desc:1 "Наши союзники располагают гораздо большими ресурсами, чем мы, поэтому мы должны стремиться к научно-исследовательскому сотрудничеству, которое позволит нам участвовать в их технологических прорывах."
 YUG_federal_defense_council:0 "Федеральный совет обороны"
 YUG_federal_defense_council_desc:1 "Все регионы должны иметь голос в защиту нашей великой нации. Это будет иметь большое значение для обеспечения того, чтобы большинство голосов было услышано, и чтобы дискриминация не останавливала заслуги в младенчестве."
 YUG_invite_bulgaria:0 "Приглашаем Болгарию"
 YUG_invite_bulgaria_desc:1 "Наши славянские братья в Болгарии требуют от нашего руководства найти свой путь к коммунизму. Кроме того, поскольку они занимают наш восточный фланг, их втягивание в лоно позволит нам перестать беспокоиться о большом участке наших границ, и их военная мощь будет очень полезна для распространения Революции."
 YUG_pan_balkan_workers_congress:0 "Панбалканская инициатива"
 YUG_pan_balkan_workers_congress_desc:0 "В то время как мы обеспечили идеалы социализма в наших ближайших южных соседях, есть бесчисленное множество людей, страдающих от монархических и буржуазных диктатур на Балканах. Только освободив рабочих Румынии, Венгрии и Греции, можно сказать, что мы освободили рабочих Балкан."
 YUG_invite_albania:0 "Пригласить Албанию"
 YUG_invite_albania_desc:1 "Албания занимает хоть и небольшую, но стратегически важную для нас территорию. Привлекая их в наш Конгресс, мы можем обезопасить большую часть нашей южной границы, при этом добавляя их силу нашей."
 YUG_invite_romania:0 "Пригласить Румынию"
 YUG_invite_romania_desc:0 "Румыны живут в аристократическом обществе, которое видело ущерб, который аристократия и капитализм могут нанести стране. Они больше не будут страдать под непостоянными руками своих коррумпированных монархов. Они будут хозяевами своей судьбы!"
 YUG_invite_hungary:0 "Пригласить Венгрию"
 YUG_invite_hungary_desc:0 "Венгерское государство было неопределенным и менялось с момента распада монархии Габсбургов. С нашей помощью венгерский народ найдет истинную форму своего государства в единой коммунистической диктатуре!"
 YUG_invite_turkey:0 "Приглашаем Турцию"
 YUG_invite_turkey_desc:0 "Турецкий народ освободился от халифа более десяти лет назад, но до сих пор не освобождён от буржуазных хозяев. Хотя Республиканская народная партия Турции называет себя «социал-демократической», на деле она полностью провалила задачу освобождения народа, и лишь прямое вмешательство Югославии позволит по-настоящему освободить всех рабочих Балкан."
 YUG_united_autonomous_croatia:0 "Объединенная автономная Хорватия"
 YUG_united_autonomous_croatia_desc:0 "Объединив хорватскую Бановину в автономное государство, уже давно предлагается решение проблемы роста хорватского сепаратизма. Предоставив Хорватии определенную степень автономии, мы можем сделать из нашего потенциального врага сильного союзника."
 YUG_devolved_croatia:0 "Покинутая Хорватия"
 YUG_devolved_croatia_desc:0 "В оппозиции к союзу нет никого более громкого, чем хорваты. В настоящее время Хорватия разделена между Банатом Савы на севере и Банатом Литторала на юге. Если мы предоставим этим банатам индивидуальную автономию, мы сможем как успокоить хорватскую оппозицию, так и помешать хорватам стать слишком влиятельными в союзе."
 YUG_safeguard_bosnia:0 "Защита Боснии"
 YUG_safeguard_bosnia_desc:0 "На нашей границе есть много стран, которые хотели бы видеть боснийцев оккупированными и угнетенными. Мы не должны допустить этого, и боснийцы и герцеговины должны быть поддержаны в любых усилиях по вооружению и индустриализации."
 YUG_divide_bosnia:0 "Разделите Боснию"
 YUG_divide_bosnia_desc:0 "Существуют культурные и религиозные различия в ландшафте боснийского региона. Сербы, хорваты, мусульмане, христиане и бесчисленное множество других народов. Единственный способ обеспечить надлежащую защиту региона — это надлежащим образом разделить его между отдельными боснийскими и герцеговинскими государствами, работающими в гармонии с нашим союзом."
 YUG_dissolve_serbia:0 "Распустить банат Сербии"
 YUG_dissolve_serbia_desc:0 "Регион, который мы называем «Сербией», на самом деле населяют многие люди, не считающие себя сербами. Македонцы, албанцы и черногорцы живут на территориях, которые мы считаем сербскими. Мы не должны выглядеть захватчиками их культуры и обязаны пересмотреть, что именно считаем по праву сербским."
 YUG_banat_for_support:0 "Банат для поддержки"
 YUG_banat_for_support_desc:0 "Не секрет, что венгры и румыны стремятся аннексировать северную Сербию и при отсутствии иностранной поддержки нашего государства мы могли бы уступить эти территории в обмен на некоторую степень признания и поддержки."
 YUG_autonomous_transylvania:0 "Автономия для славянской Трансильвании"
 YUG_autonomous_transylvania_desc:0 "В регионе Банат и Воеводина проживают не только сербы, но и румыны и венгры. Предложив этим регионам автономию и самоуправление, мы можем положить конец румынским и венгерским притязаниям на эти регионы."
 YUG_fortify_banat:0 "Укрепить Банат"
 YUG_fortify_banat_desc:0 "Венгры и румыны с тревогой приближаются к нашим врагам. Быстрые укрепления на севере необходимы, если мы хотим защитить Сербию и ее автономные протектораты."
 YUG_evolution:0 "Эволюция"
 YUG_evolution_desc:0 "Хотя некоторые утверждают, что наша нация представляет собой нестабильный союз различных культур, живущих в враждебности, мы точно знаем, что только стоя вместе как единое целое, мы сможем отразить иностранных захватчиков. Мы должны приложить усилия, чтобы объединить наш народ и сокрушить тех, кто стремится нас разделить."
 YUG_slovenia_for_support:0 "Словения для поддержки"
 YUG_slovenia_for_support_desc:0 "Державы оси задумали разделить нашу страну между собой. Возможно, уступив Словению Италии, мы сможем как избавиться от разрушительных элементов в Словении, так и продемонстрировать нашу дружелюбие к делу оси."
 YUG_surrender_macedonia:0 "Сдаться Македонии"
 YUG_surrender_macedonia_desc:0 "У Болгарии тоже есть причины соперничать с нами: она претендует на районы южной Сербии и Македонии. Уступив ей эти претензии, мы одновременно устраним угрозу на южной границе и сделаем македонский национализм проблемой Болгарии."
 YUG_zara_for_axis:0 "Зара для членства в Axis"
 YUG_zara_for_axis_desc:0 "Итальянцы утверждают, что правительство в Заре является законным контролером Далмации, но, возможно, уверяя итальянцев, что мы боремся за то же самое дело, они могут быть готовы уступить Зару обратно нам и отказаться от своих балканских амбиций, по крайней мере на время."
 YUG_surrender_italian_claims:0 "Итальянские претензии сдаются"
 YUG_surrender_italian_claims_desc:0 "Зара и Истрия остаются в руках итальянцев, но мы не можем рисковать ухудшением ситуации. [ITA.GetLeader] Мы продолжаем настаивать на том, что они по праву наши. Возможно, мы получим доступ к Оси в обмен на отказ от претензий за пределами нашей границы."
 YUG_end_the_regency:0 "Конец регентства"
 YUG_end_the_regency_desc:0 "Князь Павел достаточно долго исполнял свой долг перед короной. На горизонте войны наш народ должен увидеть, как его король будет противостоять фашистам и коммунистам, которые сломают нашу нацию."
 YUG_coronation:0 "Коронация"
 YUG_coronation_desc:0 "Наш народ долгое время был без короля, и настало время показать вечность короны. Увенчав нашего короля в соборе Белого города, мы предоставим нашему народу уверенность в том, что корона вечна и мы не падем на чужих захватчиков."
 YUG_royal_wedding:0 "Королевская свадьба"
 YUG_royal_wedding_desc:0 "Королевские браки уже давно являются способом обеспечить союзы, и со многими престижными принцессами, не имеющими короля, наш молодой подходящий король Питер мог бы обеспечить нам союз с мировой державой."
 YUG_enforced_neutrality:0 "Принудительный югославский нейтралитет"
 YUG_enforced_neutrality_desc:0 "Мы не можем допустить, чтобы Балканы стали частью этого разжигающегося глобального конфликта. Мы должны заявить о своем нейтралитете и избегать любых действий, которые выровняли бы нас с враждующими мировыми державами."
 YUG_fortress_yugoslavia:0 "Крепость Югославия"
 YUG_fortress_yugoslavia_desc:0 "Мы не можем позволить, чтобы нацистская угроза на нашей границе оставалась без контроля! С итальянцами в Заре и немцами в Австрии мы должны обеспечить защиту наших границ, а солдаты там имеют все необходимое для борьбы с фашистами."
 YUG_ban_fascists:0 "Запрет фашистских партий"
 YUG_ban_fascists_desc:0 "Даже сейчас в нашей стране есть партии, которые ставят одну культуру выше всех других и стремятся к доминированию в югославском союзе. Этим людям нет места в нашей стране, и их нужно заставить замолчать."
 YUG_towards_independence:0 "К независимости"
 YUG_towards_independence_desc:0 "Теперь, когда мы распустили союз на ряд автономных государств, мы должны сделать следующий шаг; Независимость. Мы больше не можем править как диктаторы над нашими собратьями, мы должны доверять им управлять собой, свободные от сербского вмешательства."
 YUG_defence_army_of_yugoslavia:0 "Оборонная армия Югославии"
 YUG_defence_army_of_yugoslavia_desc:0 "Просить обычного гражданина сражаться за наш союз трудно, но защищать собственный дом — долг каждого мужчины. В преддверии обещанной независимости наш союз полон людей, готовых сражаться с врагом; им нужна лишь государственная поддержка."
 YUG_defence_league:0 "Югославская Лига Обороны"
 YUG_defence_league_desc:0 "Членам нашего государства предоставлена большая автономия. Все, что осталось, — это последний шаг. Официально признав независимость всех балканских стран, мы превратим Югославию из нации в экономическое и военное сотрудничество многих наций."
 YUG_united_kingdom:0 "Соединенное Королевство"
 YUG_united_kingdom_desc:0 "Теперь, когда у нашего народа появилась возможность почувствовать себя независимым и достойно представленным в нашем союзе, пришло время предпринять шаги для создания того чувства паннационализма и единства, которого так не хватало в нашем бывшем государстве."
 YUG_reunite_the_kingdom:0 "Воссоединение королевств"
 YUG_reunite_the_kingdom_desc:0 "Хотя многие обеспокоены тем, что эти действия могут привести к разобщению и культурным конфликтам, которые характеризовали Югославию, мы должны объединить нашу нацию обратно в единое целое, чтобы противостоять более серьезным угрозам на нашей границе."
 YUG_attract_allied_capital:0 "Привлекайте союзническую столицу"
 YUG_attract_allied_capital_desc:0 "У британцев есть причины поддержать нашу страну. Мы были союзниками еще до первой Великой войны, и, привлекая инвесторов из союзных стран, мы заверим их в том, что отношения между нашими странами неразрывны."
 YUG_attract_axis_capital:0 "Привлекаем столицу Оси"
 YUG_attract_axis_capital_desc:0 "Наша экономика находится в плачевном состоянии, и хотя мы знаем, что итальянцы не скрывают своих амбиций у нас дома, мы должны поощрять торговлю с нашими соседями, если мы хотим быть экономически готовыми противостоять им."
 YUG_industrialization_program:0 "Программа индустриализации"
 YUG_industrialization_program_desc:1 "Программа быстрой индустриализации необходима, если мы хотим идти в ногу с программами перевооружения наших соседей."
 YUG_expand_the_mining_industry:0 "Расширить горнодобывающую промышленность"
 YUG_expand_the_mining_industry_desc:1 "Нам нужны достаточные ресурсы, чтобы подпитывать нашу многообещающую военную машину. Мы должны стремиться к расширению нашей отечественной горнодобывающей промышленности."
 YUG_rare_minerals_exploitation:0 "Редкая эксплуатация полезных ископаемых"
 YUG_rare_minerals_exploitation_desc:1 "Ранее неиспользуемые месторождения редких металлов внезапно приобрели большое значение. Мы должны немедленно построить необходимые мины и инфраструктуру, чтобы воспользоваться ими."
 YUG_exploit_the_pannonian_deposits:0 "Эксплуатация Паннонских депозитов"
 YUG_exploit_the_pannonian_deposits_desc:1 "Мы должны эксплуатировать нефтяные месторождения, которые находятся на нашей территории. Несмотря на то, что их количество невелико, нам нужно все, что мы можем получить для нашей военной машины."
 YUG_develop_civilian_industry:0 "Развивать гражданскую промышленность"
 YUG_develop_civilian_industry_desc:1 "Наша гражданская промышленность должна идти в ногу со своим военным коллегой, снабжать его техникой и другими необходимыми вещами."
 YUG_integrated_rail_network:0 "Интегрированная железнодорожная сеть"
 YUG_integrated_rail_network_desc:1 "Мы должны в равной степени расширить национальные железнодорожные сети во всех частях страны. Нет ни одной части нашей страны, которая была бы более важной, чем другие."
 YUG_improve_light_industry:0 "Улучшение легкой промышленности"
 YUG_improve_light_industry_desc:1 "У нас уже есть внутренние волнения, и поэтому мы не позволим легкой промышленности отставать, лишая людей необходимого в повседневной жизни."
 YUG_develop_slovenian_industry:0 "Развитие словенской промышленности"
 YUG_develop_slovenian_industry_desc:1 "Несмотря на то, что Словения долгое время оставалась без внимания, у нее есть достаточно пространства для создания нового промышленного центра. Это, кроме того, очень понравится словенцам."
 YUG_local_self_management_desc:1 "Расширение местного самоуправления позволит улучшить использование местных ресурсов и повысить эффективность новых строительных проектов."
 YUG_expand_the_university_of_ljubljana:0 "Расширить Университет Любляны"
 YUG_expand_the_university_of_ljubljana_desc:1 "Расширяя наш университет в Словении, у нас будет еще одно учреждение, через которое мы будем обучать наше население."
 YUG_develop_military_industry:1 "Развитие военной промышленности"
 YUG_develop_military_industry_desc:2 "Современная армия нуждается в тяжелой промышленной базе для поддержки необходимого производства новых самолетов."
 YUG_improve_serbian_rail_network:0 "Сеть сербских железных дорог"
 YUG_improve_serbian_rail_network_desc:1 "Мы можем не строить железнодорожные сети в отдаленных провинциях. Наиболее важными районами являются центр и восток."
 YUG_serbian_steel:0 "Сербская сталь"
 YUG_serbian_steel_desc:1 "Мы должны начать производство стали в Сербии. Мы всегда нуждаемся в большем количестве средств для ведения войны."
 YUG_expand_the_university_of_belgrad:0 "Расширить Белградский университет"
 YUG_expand_the_university_of_belgrad_desc:1 "Расширяя наш самый престижный университет, мы можем увеличить приток ярких умов в наши исследовательские и опытно-конструкторские команды."
 YUG_expand_the_university_of_zagreb:0 "Расширить Загребский университет"
 YUG_expand_the_university_of_zagreb_desc:1 "Старый университет Загреба уже давно является одним из ведущих высших учебных заведений. Дополнительное финансирование позволит ему также проводить ценные исследования."
 YUG_central_management:0 "Центральное управление"
 YUG_central_management_desc:1 "Сильный центральный контроль над всеми аспектами управления повысит нашу способность поддерживать производственные квоты."
 YUG_expand_the_sarajevo_arsenals:0 "Расширить арсеналы Сараева"
 YUG_expand_the_sarajevo_arsenals_desc:1 "Нам нужны дополнительные производственные мощности, чтобы удовлетворять растущие потребности армии. Арсеналы Сараева прекрасно подходят для расширения, и мы немедленно выделим на это ресурсы."
 YUG_modernize_the_air_force:0 "Модернизация ВВС"
 YUG_modernize_the_air_force_desc:1 "Наши военно-воздушные силы ужасно устарели. Если мы хотим иметь какие-то разумные шансы на защиту воздушного пространства над нашей собственной территорией, а тем более не доводить борьбу до противника, нам нужна радикальная программа модернизации."
 YUG_local_developers:0 "Местные разработчики"
 YUG_local_developers_desc:1 "Мы должны увеличить поддержку развития местной авиации, что позволит нам лучше контролировать модели самолетов и обеспечит стимул для нашей отрасли."
 YUG_ikarus:0 "Икарус"
 YUG_ikarus_desc:1 "Наше старейшее авиастроительное предприятие — заводы «Икарус» в Нови-Саде — необходимо расширить, чтобы подготовить их к росту производства, требуемому для наших новых ВВС."
 YUG_designer_tt:0 "Открывает эту компанию в качестве авиаконструктора.\n"
 YUG_rogozarski_desc:1 "Основанная вскоре после «Икаруса» «Первая сербская авиационная фабрика Живоина Рогожарского» нуждается в расширении, если хочет соответствовать современным требованиям производства."
 YUG_zmaj_desc:1 "Белградским авиационным мастерским «Змай» необходимо выделить новые территории для расширения. Хотя компания моложе других наших предприятий, после увеличения мощностей «Змай» обладает всем потенциалом, чтобы удовлетворить наши производственные потребности."
 YUG_the_ik_3:0 "ИК-3 / IK-3"
 YUG_the_ik_3_desc:1 "Работая в тайне в свободное время, три инженера придумали замечательное предложение о замене нашего нынешнего истребителя иностранного производства. При соответствующей поддержке производство, скорее всего, скоро станет возможным."
 YUG_heavy_fighter_project:0 "Проект Heavy истребитель"
 YUG_heavy_fighter_project_desc:1 "Наши истребители должны быть в состоянии поддерживать более уязвимые бомбардировщики. Это требует более тяжелого вооружения и большей дальности за счет некоторой скорости и маневренности."
 YUG_bomber_project:0 "Проект бомбардировщика"
 YUG_bomber_project_desc:1 "Для того, чтобы довести борьбу до противника, нужны бомбардировщики. Перед нашими инженерами должна быть поставлена задача по разработке новых отечественных образцов этого типа."
 YUG_purchase_foreign:0 "Купить иностранный"
 YUG_purchase_foreign_desc:1 "Есть другие страны, которые потратили гораздо больше ресурсов на разработку хороших истребителей, чем мы когда-либо могли. Мы должны покупать их самолеты, а не проходить через кропотливый процесс проб и ошибок, чтобы развивать свои собственные."
 YUG_license_production:0 "Лицензионное производство"
 YUG_license_production_desc:1 "Процесс приобретения новых самолетов можно было бы облегчить, если бы мы сами их производили по лицензии. Мы создадим такую договоренность как можно скорее."
 YUG_fighter_license:0 "Лицензия истребитель"
 YUG_fighter_license_desc:1 "Мы должны сосредоточиться на лицензионном производстве истребителей для наших ВВС, так как бомбардировщики бесполезны без прикрытия истребителей."
 YUG_bomber_license:0 "Лицензия бомбардировщика"
 YUG_bomber_license_desc:1 "Воздух открывает новые возможности для борьбы с противником, и поэтому бомбардировщики — это то, на чем мы должны сосредоточить все наше лицензионное производство."
 YUG_army_modernization:0 "Модернизация армии"
 YUG_army_modernization_desc:1 "Пути войны изменились со времен последнего конфликта, и мы должны обеспечить, чтобы наша армия шла в ногу со временем, модернизируя свою технику и тактику."
 YUG_motorize_the_cavalry:0 "Моторизовать кавалерию"
 YUG_motorize_the_cavalry_desc:1 "Новые разработки в автомобильной технике произвели революцию в скорости и мобильности армейских подразделений. Наши кавалерийские части должны отказаться от лошади и быть оснащены грузовиками."
 YUG_motorized_logistics:0 "Моторизованная логистика"
 YUG_motorized_logistics_desc:1 "Моторизация открывает перспективные новые пути обеспечения голыми предметами первой необходимости, а специализированное оборудование идет в ногу с фронтовыми войсками. Это позволяет нам гарантировать, что наши силы всегда находятся в наилучшем боевом состоянии."
 YUG_armored_cavalry:0 "Бронированная кавалерия"
 YUG_armored_cavalry_desc:1 "Пощечина бронетехнике на наших войсковых транспортах значительно повышает их живучесть, боевую силу и моральный дух. Это, однако, требует нового типа по крайней мере частично гусеничного транспортного средства, которое может нести дополнительный вес, не застревая в местности, а также собственное спортивное оружие."
 YUG_tank_conversions:0 "Преобразования танков"
 YUG_tank_conversions_desc:1 "Сегодня нам могут требоваться танки, а уже в следующем месяце — самоходная артиллерия или истребители танков на том же шасси. Наша бронетехника должна оставаться гибкой и приспосабливаться к текущим потребностям."
 YUG_modern_tanks:0 "Современные танки"
 YUG_modern_tanks_desc:1 "Благодаря установке крупнокалиберного основного вооружения бронетехника далеко вышла за рамки простой безопасной перевозки войск из точки А в точку Б. Мы должны создать собственные современные танки, чтобы не отставать от соседей."
 YUG_tank_licenses:0 "Лицензии на танки"
 YUG_tank_licenses_desc:1 "Вместо того, чтобы тратить ограниченные ресурсы на разработку собственных танковых моделей, мы могли бы гораздо эффективнее просто производить иностранные модели по лицензии."
 YUG_small_arms:0 "Стрелковое оружие"
 YUG_small_arms_desc:1 "Пехота является основой любой армии, и мы должны обеспечить ее оснащение в меру наших возможностей. Мы должны стимулировать разработку новых и современных моделей оружия."
 YUG_domestic_artillery_production:0 "Отечественное производство артиллерии"
 YUG_domestic_artillery_production_desc:1 "Стимулируя развитие современных отечественных артиллерийских образцов, мы можем обеспечить нашим силам наилучшую огневую поддержку, которую мы можем обеспечить."
 YUG_anti_tank_defenses:0 "Противотанковая оборона"
 YUG_anti_tank_defenses_desc:1 "Поскольку танки заняли центральное место в современной войне, необходимы новые разработки в области полевых противотанковых орудий, которые позволят нашей пехоте уничтожать этих бронированных гигантов."
 YUG_mountain_brigades:0 "Горные бригады"
 YUG_mountain_brigades_desc:1 "Большая часть нашей страны покрыта горами, поэтому необходимо формировать специальные бригады, подготовленные к бою в такой местности."
 YUG_independent_engineer_regiments:0 "Независимые инженерные полки"
 YUG_independent_engineer_regiments_desc:1 "Мобильность является ключевым фактором в современной военной доктрине, хотя местность не всегда позволяет это сделать. Специальные инженерные полки, встроенные в наши дивизии, будут работать над тем, чтобы облегчить передвижение дивизии по любой местности."
 YUG_motorized_recon_companies:0 "Моторные компании разведка"
 YUG_motorized_recon_companies_desc:1 "Чтобы получить адекватную информацию о вражеских формированиях и их позициях, нам нужны специализированные, моторизованные разведывательные роты, способные преодолевать большие расстояния перед наступлением нашего основного корпуса."
 YUG_form_parachute_battalions:0 "Форма парашютных батальонов"
 YUG_form_parachute_battalions_desc:1 "Используя третье измерение, мы можем наносить удары с неожиданных направлений, далеко за линией фронта противника. Создание специализированных батальонов ВДВ позволит нам максимально эффективно использовать наши воздушные силы."
 YUG_army_maneuvers:0 "Армейские манёвры"
 YUG_army_maneuvers_desc:1 "Чтобы привести нашу армию в форму, необходимо провести новые манёвры. Полученный опыт, несомненно, даст и новые представления о современной войне."
 YUG_supremacy_of_offense:0 "Превосходство наступления"
 YUG_supremacy_of_offense_desc:1 "Наступательные действия — ключ к победе, поэтому именно они должны определять нашу общую стратегию и развитие новых доктрин."
 YUG_supremacy_of_defense:0 "Превосходство обороны"
 YUG_supremacy_of_defense_desc:1 "Зажатые врагами со всех сторон, мы должны продержаться достаточно долго, чтобы наши союзники сняли с нас жару. Развитие новых военных доктрин должно быть сосредоточено на обороне нашей Родины."
 YUG_artillery_regiments:0 "Артиллерийские полки"
 YUG_artillery_regiments_desc:1 "Введение мощных артиллерийских полков в состав дивизий значительно повысит их общую боевую мощь."
 YUG_expand_the_split_shipyards:0 "Расширить верфи Сплита"
 YUG_expand_the_split_shipyards_desc:1 "Наша ранее существовавшая судостроительная промышленность в Далмации является основным кандидатом на расширение и имеет достаточно возможностей для более крупных военных кораблей. Тем не менее, хорватский призыв к большей автономии вполне может привести к тому, что в конечном итоге мы потеряем прямой контроль над объектами."
 YUG_contest_the_adriatic:0 "Оспорить господство в Адриатике"
 YUG_contest_the_adriatic_desc:1 "Защита наших берегов начинается в море, которое лежит за ними. Мы должны разработать новые тактики и стратегии для борьбы с Адриатическим морем."
 YUG_replace_the_dalmacija:0 "Заменить Далмачью"
 YUG_replace_the_dalmacija_desc:1 "Старый немецкий крейсер Dalmacija имеет стареющий дизайн. Нам нужен новый, современный корабль крейсерского типа, чтобы заменить его и служить основой нашего адриатического флота."
 YUG_naval_bombers:0 "Морские бомбардировщики"
 YUG_naval_bombers_desc:1 "Адриатика длинная, но узкая, поэтому её легко перекрыть авиацией с наших аэродромов. Разработка специализированных морских бомбардировщиков может значительно повысить шансы нашего флота против более сильных противников."
 YUG_heavy_cruiser_project:0 "Проект тяжёлого крейсера"
 YUG_heavy_cruiser_project_desc:1 "Чтобы адекватно противостоять вражеским флотам, нам нужны большие тоннажи и более тяжелое вооружение. Тяжелые крейсера были бы хорошим шагом вперед по сравнению с легкими крейсерами, которые мы до сих пор использовали в качестве основы для нашего флота."
 YUG_modern_destroyers:0 "Современные эсминцы"
 YUG_modern_destroyers_desc:1 "Разрушители являются основой любого военно-морского флота, и мы должны обеспечить, чтобы наши собственные силы не уступали нашим противникам."
 YUG_expand_the_serbian_shipyards:0 "Расширение сербских верфей"
 YUG_expand_the_serbian_shipyards_desc:1 "Несмотря на то, что в регионе нет объектов, позволяющих легко производить более крупные военные корабли, размещение обширных верфей в регионе Черногории обеспечит нам контроль над ними независимо от нашей будущей политики в отношении хорватской автономии."
 YUG_coastal_defense:0 "Береговая оборона"
 YUG_coastal_defense_effect_tt1:0 "Добавить §Y2 Прибрежные форты§! на береговой линии\n"
 YUG_coastal_defense_effect_tt2:0 "Добавить §Y1 Прибрежный форт§! то §YВоенно-морская база§! места расположения\n"
 YUG_coastal_defense_desc:1 "Мы не можем надеяться на то, что будем оспаривать флот наших противников в Адриатике. Вместо этого мы должны подготовить наши берега к отражению любых военно-морских вторжений, которые они могут предпринять."
 YUG_expand_the_submarine_fleet:0 "Расширение подводного флота"
 YUG_expand_the_submarine_fleet_desc:1 "Вместо того, чтобы бросать вызов врагу с помощью нашего неполноценного флота, мы должны сосредоточиться на подводных лодках, чтобы преследовать врага и нацеливаться на их торговое судоходство."
 panslavic_workers_congress:0 "Панславянский рабочий конгресс"
 panbalkan_workers_congress:0 "Большой балканский рабочий конгресс"
 create_one_units_tt:0 "создавать §Y1 Милиция§! подразделение."
 create_two_units_tt:0 "создавать §Y2 Милиция§! единицы."
 create_three_units_tt:0 "создавать §Y3 Милиция§! единицы."
 create_four_units_tt:0 "создавать §Y4 Милиция§! единицы."
 release_dalmatia_tt:0 "Выпуск §YДалмация§! Как марионетка."
 release_transylvania_tt:0 "Выпуск §YТрансильвания§! Как марионетка."
 release_vojvodina_tt:0 "Выпуск §YВоеводина§! Как марионетка."
 release_dalmatia_units_tt:0 "(§YДалмация§!) Создать §Y1 Милиция§! подразделение."
 transylvania_create_one_units_tt:0 "(§YТрансильвания§!) Создать §Y1 Милиция§! подразделение."
 vojvodina_create_one_units_tt:0 "(§YВоеводина§!) Создать §Y1 Милиция§! подразделение."
 all_subjects_become_fascist_tt:0 "Все субъекты наций в §YЕвропа§! становиться §Yфашистский§!."
 neutral_to_fascist_tt:0 "Все §Yнейтральный§! Популярность становится §Yфашистский§! популярность."
 YUG_towards_independence_mod:0 "Югославия настаивает на независимости"
 YUGOSLAV_DEFENCE_LEAGUE:0 "Балканская лига обороны"
 YUG_crush_ustasa:0 "Надвигающееся восстание усташей"
 YUG_crush_ustasa_desc:0 "Решение правительства подавить фашистскую организацию усташей взбудоражило сторонников хорватской независимости, и усташи быстро готовятся к вооружённому восстанию. Если мы своевременно не ликвидируем эту фашистскую организацию, усташи могут захватить местное хорватское правительство и поднять знамя мятежа против нашего государства."
 YUG_ustasa_uprising:0 "Восстание усташей"
 YUG_ustasa_uprising_desc:0 "Если мы не сможем вовремя обуздать восстание усташей, мы столкнемся с крупным хорватским восстанием против нашего государства."
 YUG_ustasa_crushed_mission:0 "Окружите восстание усташей"
 YUG_ustasa_crushed_mission_desc:0 "Если мы сможем усилить контроль над Хорватией, восстание усташей будет обойдено, и все трудности с хорватскими националистами будут устранены."
 YUG_delay_ustasa_uprising:0 "Отсрочить восстание"
 YUG_delay_ustasa_uprising_desc:0 "В связи с подъемом Устасы крайне важно, чтобы правительство приняло меры для отсрочки хорватского восстания. Хотя такие усилия также задержат наши собственные операции по прекращению хорватского национализма раз и навсегда, отсрочка восстания может оказаться необходимой."
 YUG_croat_concessions:0 "Концессии для хорватов"
 YUG_croat_concessions_desc:0 "Наше отношение к хорватскому населению со времени нашего решения расправиться с Устасой было широко расценено как жестокое и бесчеловечное. Возможно, придавая немного снисходительности хорватскому населению, они могут начать относиться к нам более благосклонно."
 YUG_croat_concessions_cooldown:0 "Концессии для хорватов"
 YUG_croat_concessions_cooldown_desc:0 "Наше отношение к хорватскому населению со времени нашего решения расправиться с Устасой было широко расценено как жестокое и бесчеловечное. Возможно, придавая немного снисходительности хорватскому населению, они могут начать относиться к нам более благосклонно."
 YUG_positive_discrimination_croat:0 "Позитивная дискриминация хорватов"
 YUG_positive_discrimination_croat_desc:0 "Сама Хорватия является домом для многих культур и народов, кроме хорватов. Возможно, путем введения законов, которые благоприятствуют хорватам в плане возможностей трудоустройства и налогового снисхождения, мы можем предоставить им иллюзии самоопределения, которые обещают им усташи."
 YUG_positive_discrimination_croat_cooldown:0 "Позитивная дискриминация хорватов"
 YUG_positive_discrimination_croat_cooldown_desc:0 "Сама Хорватия является домом для многих культур и народов, кроме хорватов. Возможно, путем введения законов, которые благоприятствуют хорватам в плане возможностей трудоустройства и налогового снисхождения, мы можем предоставить им иллюзии самоопределения, которые обещают им усташи."
 YUG_listening_posts_croatia:0 "Формирование прослушивающих сообщений в Хорватии"
 YUG_listening_posts_croatia_desc:0 "Устасы теперь действуют под землей, избегая обнаружения и планирования своей измены за закрытыми дверями. Возможно, убедив некоторых югославских лоялистов присоединиться к Устасе, мы сможем выслушать и сорвать их операции и пропагандистские кампании в регионе."
 YUG_listening_posts_cooldown:0 "Формирование прослушивающих сообщений в Хорватии"
 YUG_listening_posts_cooldown_desc:0 "Устасы теперь действуют под землей, избегая обнаружения и планирования своей измены за закрытыми дверями. Возможно, убедив некоторых югославских лоялистов присоединиться к Устасе, мы сможем выслушать и сорвать их операции и пропагандистские кампании в регионе."
 YUG_progress_crushing_decisions:0 "Скачать игру Crack Down on the Ustasa"
 YUG_progress_crushing_decisions_desc:0 "Настало время ликвидировать фашистскую усташскую группировку, и хотя многие могут считать эти действия актами фашизма сами по себе, мы знаем, что эти меры строго необходимы для обеспечения дальнейшей стабильности нашего государства."
 YUG_raid_croat_villages:0 "Рейды по хорватским деревням"
 YUG_raid_croat_villages_desc:0 "Устасы везде и нигде одновременно, и любой мог бы быть сторонником их брэнда фашизма. Мы должны напасть на все города и деревни в регионе Хорватии и вынюхать там предателей."
 YUG_shut_down_recruitment_centers:0 "Закрыть рекрутинговые центры Ustasa"
 YUG_shut_down_recruitment_centers_desc:0 "Устаса тоже есть свои центры по подбору персонала; Тренировать и вооружать любое способное тело настолько глупо, чтобы сражаться и умирать за свое дело. Мы должны найти и ликвидировать эти центры вербовки и сделать Устасу без средств, чтобы привлечь больше тел в свои ряды."
 YUG_arrest_ustasa_leaders:0 "Арестованы лидеры Устаса"
 YUG_arrest_ustasa_leaders_desc:0 "У нас есть список имен важных фигур в движении усташей, и настало время воспользоваться этим и произвести некоторые аресты."
 YUG_croatian_recruitment:0 "Хорватский вербовочный двигатель"
 YUG_croatian_recruitment_desc:0 "Вопрос о независимости стоит на устах каждого хорвата, но не все поддерживают правительство усташей по сравнению с югославским. Настало время набрать горстку лоялистов в свои ряды и показать хорватскому населению, что есть те, кто предпочёл бы, чтобы Хорватия благополучно оставалась в теплых объятиях Югославии."
 YUG_croat_raid_cooldown:0 "Рейды по хорватским деревням"
 YUG_croat_raid_cooldown_desc:0 "Устасы везде и нигде одновременно, и любой мог бы быть сторонником их брэнда фашизма. Мы должны напасть на все города и деревни в регионе Хорватии и вынюхать там предателей."
 YUG_shut_down_recruitment_centers_cooldown:0 "Закрыть рекрутинговые центры Ustasa"
 YUG_shut_down_recruitment_centers_cooldown_desc:0 "Устаса тоже есть свои центры по подбору персонала; Тренировать и вооружать любое способное тело настолько глупо, чтобы сражаться и умирать за свое дело. Мы должны найти и ликвидировать эти центры вербовки и сделать Устасу без средств, чтобы привлечь больше тел в свои ряды."
