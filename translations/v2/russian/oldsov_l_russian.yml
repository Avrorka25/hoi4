 soviet.54.t:0 "Под новым руководством"
 soviet.54.d_nopurge:0 "С ослаблением власти коммунистической партии уже давно стало ясно, что сталинская система неустойчива.\nПоднялись новые силы, чтобы захватить власть, призвав российские идеалы вести нашу страну по новому пути.\n\nСимволизируя этот переход, [Root.GetLeader] Сталин был свергнут и помещен под домашний арест, вдали от залов власти, где он разработал так много своих опасных проектов.\nПо мере того, как новая российская система вырастает на замену разлагающемуся трупу партии, тайна, паранойя и политические интриги старого генерального секретаря заканчиваются."
 soviet.54.d_purge:0 "Стало ясно, что самая большая угроза для российского государства — не заговорщики против коммунистической партии, а сама партия. С разочарованием в коммунистической мечте в России новые силы захватили власть, чтобы привести нашу страну в будущее.\n\nПосле свержения Сталина [Root.GetLeader]Старому генеральному секретарю был дан целесообразный суд. Его параноидальная охота на ведьм описывается как уничтожение руководства страны в момент отчаянной необходимости, Сталин был приговорен к смертной казни за измену. Старая система уходит с ним в безымянную могилу."
 soviet.54.a:0 "Новый рассвет для российской политики."
 SOV_oh_no_purge:0 "Плохой знак"
