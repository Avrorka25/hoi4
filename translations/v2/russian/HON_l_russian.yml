l_russian:
 hon_focus:0 "Национальные фокусы Гондураса"
 HON_internships:0 "Стажировки"
 HON_internships_desc:0 "Работа в Отделе защиты от переворотов «Юнайтед Фрут» будет отлично смотреться в резюме многих молодых людей."
 HON_empower_domestic_competition:0 "Поддержать внутреннюю конкуренцию"
 HON_empower_domestic_competition_desc:0 "Самуэль Земуррей не позволял другим предприятиям развиваться в нашей стране; здоровая конкуренция необходима, чтобы экономика не пришла в упадок."
 r56_HON_empower_domestic_competition:0 "Внутренняя конкуренция"
 HON_protect_our_private_businesses:0 "Защитить частный бизнес"
 HON_protect_our_private_businesses_desc:0 "Мы должны защитить частные предприятия и собственность от безжалостной хватки Земуррея!"
 HON_free_our_markets:0 "Освободить наши рынки"
 HON_free_our_markets_desc:0 "Самуэль Земуррей должен быть свергнут. Мы должны создать строй, в котором частные предприятия не подчинены авторитарной власти, а свобода рынка превыше всего!"
 HON_free_other_latin_markets:0 "Освободить другие латиноамериканские рынки!"
 HON_free_other_latin_markets_desc:0 "Без свободных рынков не может быть свободных людей. Поэтому мы должны освободить мировые рынки от коммунистического и фашистского господства."
 ANC_name_l:0 "Договорное общество"
 ANC_name_l_long:0 "Анархо-капиталистическое договорное общество"
 ANC_name_l_n:0 "Советы потребителей"
 ANC_name_l_n_long:0 "Волюнтаристские советы потребителей"
 r56_HON_protect_our_private_businesses:0 "Защита частного бизнеса"
 r56_idea_capitalism_anarchist_society:0 "Анархо-капиталистическое общество"
 RTR_AGENCIES_DESC:0 "Агентства передачи реституции и возмещения, сокращённо АПРВ, — это частные предприятия, специализирующиеся на охране правопорядка и обороне. Другие компании в «Зоне свободного предпринимательства» нанимают их для оказания соответствующих услуг."
 HON_ANCAP_DESC:0 "Советы потребителей действуют коллективно, влияя на предприятия и регулируя их деятельность в Зоне свободного предпринимательства. Они могут влиять на агентства передачи реституции и возмещения и нанимать их для работы на Совет потребителей, тем самым закрепляя контроль советов над Зоной свободного предпринимательства."
 r56_HON_free_other_latin_markets:0 "Освободить больше рынков!"
 r56_HON_free_other_latin_markets_desc:0 "Мы должны освободить рынки от коммунистического и фашистского господства!"
 HON_empower_the_consumer_council:0 "Расширить полномочия советов потребителей"
 HON_empower_the_consumer_council_desc:0 "Советы потребителей коллективно влияют на предприятия и регулируют их работу. Таким образом, они являются жизненной силой Зоны свободного предпринимательства. Если мы поддержим их, они, в свою очередь, помогут агентствам передачи реституции и возмещения освобождать новые рынки от коммунистов и фашистов."
 r56_HON_empower_the_consumer_council:0 "Влиятельные советы потребителей"
 r56_HON_empower_the_consumer_council_desc:0 "Советы потребителей коллективно влияют на предприятия и регулируют их деятельность в Зоне свободного предпринимательства. Они могут контролировать агентства передачи реституции и возмещения, а также наёмников, и нанимать их для работы на Совет потребителей, что делает советы крайне влиятельной силой в Зоне свободного предпринимательства."
 HON_support_the_spanish_monarchy:0 "Поддержать испанскую монархию"
 HON_support_the_spanish_monarchy_desc:0 "Нельзя сказать, что мы питаем особую симпатию к карлистам. Однако мы обязаны поддержать любую возможность восстановления испанской монархии, ведь это может привести к возвращению законных прав Хуана III."
 HON_form_honduran_requetes:0 "Сформировать гондурасские рекете"
 HON_form_honduran_requetes_desc:0 "Несколько военнослужащих Гондураса выразили желание помочь карлистам в войне. Находясь там, они смогут изучить тактику обеих сторон и получить ценный боевой опыт."
 HON_join_the_fight:0 "Вступить в борьбу карлистов"
 HON_join_the_fight_desc:0 "Лучший способ обеспечить победу карлистов в гражданской войне в Испании — самим сражаться за рекете и разгромить остальные испанские фракции."
 HON_continue_the_fight:0 "Битва проиграна, но не война"
 HON_continue_the_fight_desc:0 "Мы могли проиграть битву за Испанию, но война ещё не проиграна. Необходимо восстановиться, набраться сил и вернуться ещё могущественнее!"
 HON_reform_the_spanish_empire:0 "Восстановить Испанскую империю"
 HON_reform_the_spanish_empire_desc:0 "Закрепим победу в гражданской войне в Испании, начав восстановление Испанской империи."
 HON_spanish_millitary_mission:0 "Запросить испанских советников"
 HON_spanish_millitary_mission_desc:0 "В Испании много опытных офицеров, чьи знания и опыт помогут укрепить нашу армию."
 HON_renounce_throne_rights:0 "Отказаться от прав на престол"
 HON_renounce_throne_rights_desc:0 "Теперь, когда законный монарх Испании находится у власти, откажемся от притязаний на трон ради укрепления нашей империи."
 HON_restore_colonial_suzrenity:0 "Восстановить колониальный сюзеренитет"
 HON_restore_colonial_suzrenity_desc:0 "Мы официально признаем испанский сюзеренитет над нашей страной, поскольку это пойдёт на пользу полноценному вице-королевству."
 HON_invite_carlists:0 "Пригласить карлистских эмигрантов"
 HON_invite_carlists_desc:0 "Многие лидеры карлистов, бежавшие из Испании после поражения в гражданской войне, обладают знаниями, способными помочь достижению наших целей. Мы должны воспользоваться этим."
 HON_integrate_requetes:0 "Интегрировать рекете"
 HON_integrate_requetes_desc:0 "Карлистских рекете, наиболее близких к нашим взглядам, следует теснее включить в вооружённые силы. Их опыт и подготовка окажутся бесценными в грядущей борьбе."
 HON_carlist_coup:0 "Карлистский переворот"
 HON_carlist_coup_desc:0 "При поддержке недавно прибывших карлистов мы можем свергнуть претендента в пользу законного короля. Да здравствует Хавьер I!"
 HON_fight_alongside_the_carlists:0 "Сражаться вместе с карлистами"
 HON_carlist_volunteers:0 "Карлистские добровольцы"
 r56_HON_political_instability:0 "Политическая нестабильность"
 r56_HON_political_instability_desc:0 ""
 r56_HON_indebted_to_the_west:0 "Зависимость от Запада"
 r56_HON_indebted_to_the_west_desc:0 ""
 HON_banana_republic:0 "Банановая республика"
 HON_banana_republic_desc:0 "[ROOT.GetNonIdeologyName] находится под влиянием компании «Юнайтед Фрут», контролирующей значительную часть экономики. [ROOT.GetAdjective] экономика сильно зависит от экспорта бананов, поэтому направлять ресурсы в другие отрасли будет трудно."
 HON_better_banana_republic:0 "Банановая республика"
 HON_better_banana_republic_desc:0 "Гондурас полностью контролируется компанией «Юнайтед Фрут». Экономика по-прежнему сильно зависит от экспорта бананов, но теперь компания сосредоточилась на совершенствовании методов производства."
 HON_best_banana_republic:0 "Банановая республика"
 HON_best_banana_republic_desc:0 "Никто не может оспорить гегемонию «Юнайтед Фрут» в Центральной Америке, но нам наконец удалось завоевать сердца и умы местного населения. По крайней мере, теперь можно утверждать, что мы действуем в интересах народа, одновременно получая рекордную прибыль."
 HON_banana_empire:0 "Банановая империя"
 HON_banana_empire_desc:0 "Компания «Юнайтед Фрут» теперь контролирует значительную долю почти всей мировой сельскохозяйственной продукции и обладает почти полной монополией на бананы. Успех первого настоящего корпоративного государства принёс нам прозвище «Банановая империя»."
 HON_united_fruit_long:0 "Компания «Юнайтед Фрут»"
 HON_united_fruit:0 "«Юнайтед Фрут»"
 HON_american_business:0 "Поддержка [USA.GetAdjective] деловых кругов"
 HON_soviet_assist:0 "Поддержка со стороны [SOV.GetNameDef]"
 HON_belize_refused:0 "Оскорблены нашим предложением купить Белиз"
 HON_canal_refused:0 "Оскорблены нашим предложением купить Панамский канал"
 HON_banana_boat_payment:0 "Плата за Белиз"
 HON_banana_boat_payment_desc:0 "Поскольку [ENG.GetNameDef] приняло наше предложение о покупке Белиза, мы передаём обещанные банановозы. Это временно снизит производственные возможности, но в долгосрочной перспективе Белиз станет превосходным вложением."
 HON_banana_boat_payment2:0 "Плата за Панамский канал"
 HON_banana_boat_payment2_desc:0 "[USA.GetAdjective] сторона продала нам Панамский канал, но цена оказалась высокой. Пришлось отправить годовой запас банановозов, что сильно ударило по прибыли. Однако после того, как дядя Сэм наестся бананов, нас ждут рекордные доходы."
 HON_motorized_discount:0 "Помощь «Форда»"
 HON_motorized_discount_desc:0 "Компания «Форд Мотор» теперь присутствует в Центральной Америке, а её опыт позволяет быстрее выпускать моторизованную технику."
 HON_convoy_discount:0 "Банановозы"
 HON_convoy_discount_desc:0 "Банановозы являются основой нашей деятельности, и мы разработали методы их массового производства. Благодаря эффекту масштаба мы способны выпускать больше транспортных судов, чем большинство великих держав."
 HON_sovmission:0 "[SOV.GetAdjective] военная миссия"
 HON_sovmission_desc:0 "Наши товарищи из [SOV.GetNameDef] делятся с нами своим военным опытом."
 HON_soviet_spies:0 "Помощь НКВД"
 HON_soviet_spies_desc:0 "[SOV.GetNameDefCap] направило советников НКВД, улучшающих наши разведывательные возможности."
 HON_peoples_war_idea:0 "Партизанская тактика"
 HON_peoples_war_idea_desc:0 "Суровые джунгли Центральной Америки затруднят снабжение армии в случае вторжения. К счастью, наши войска обучены сражаться при нехватке припасов."
 HON_campo_republic:0 "Крестьянская республика"
 HON_campo_republic_desc:0 "Передав власть кампесинос, мы позволили им разработать новые и новаторские методы производства. Наш успех показал миру, что крестьяне способны на всё, когда средства производства находятся в их руках."
 HON_ok_banana_republic:0 "Банановая республика"
 HON_ok_banana_republic_desc:0 "Компания «Юнайтед Фрут» влияет на [HON.GetNameDef], а экономика сильно зависит от экспорта бананов, поэтому направлять ресурсы в другие отрасли трудно. Однако недавние реформы смягчили худшие последствия этой системы."
 HON_legacy_carias:0 "Гондурас силён!"
 HON_legacy_carias_desc:0 "Когда выбор самой скучной части дерева фокусов внезапно окупается."
 HON_better_research:0 "Улучшенные методы исследований"
 HON_better_research_desc:0 "Благодаря улучшениям в [HON.GetAdjective] системе образования мы наконец можем соответствовать темпам технологического развития крупных держав."
 HON_infantry_discount:0 "Производство стрелкового оружия"
 HON_infantry_discount_desc:0 "Изучение оружейных технологий позволило эффективнее производить стрелковое оружие."
 HON_fah:0 "Военная авиационная школа и Военно-воздушные силы Гондураса"
 HON_jungle_infantry:0 "Пехота джунглей"
 HON_jungle_infantry_desc:0 "Особая подготовка, позволяющая моторизованным и механизированным дивизиям эффективно действовать в джунглях."
 HON_jungle_motor:0 "Пехота джунглей"
 HON_jungle_motor_desc:0 "Особая подготовка, позволяющая танкам эффективно действовать в джунглях."
 HON_jungle_tanks:0 "Пехота джунглей"
 HON_jungle_tanks_desc:0 "Особая подготовка, позволяющая танкам эффективно действовать в джунглях."
 HON_monarch_influence:0 "Монархическое влияние"
 HON_monarch_influence_desc:0 "Наш народ тоскует по славным временам вице-королевства."
 HON_hacienda_system:0 "Система асьенд"
 HON_hacienda_system_desc:0 "Асьенды — крупные поместья аристократов, составлявшие основу экономики вице-королевства Новая Испания. Возвращение к этой системе позволит экспортировать больше товаров и восстановить былую славу знати."
 HON_rereconquista:0 "Ререконкиста"
 HON_rereconquista_desc:0 "Наши армии готовы вернуть Испанской империи былое величие."
 HON_better_hacienda_system:0 "Система асьенд"
 HON_better_hacienda_system_desc:0 "Асьенды — крупные поместья аристократов, составлявшие основу экономики вице-королевства Новая Испания. Возвращение к этой системе позволит экспортировать больше товаров и восстановить былую славу знати."
 HON_spaninquisition:0 "Новая испанская инквизиция"
 HON_spaninquisition_desc:0 "Никто её не ожидает."
 HON_samuel_diaz_zelaya:0 "Самуэль Диас Селайя"
 HON_samuel_diaz_zelaya_desc:0 "Самуэль Диас Селайя — гондурасский журналист, регулярно публиковавшийся в журналах «Тегусигальпа» и «Диарио Комерсиаль». В 1937 году он стал литературным редактором журнала «Эксельсиор», служившего апологетическим изданием режима Тибурсио Кариаса."
 HON_lowell_yerex:0 "Лоуэлл Йерекс"
 HON_lowell_yerex_desc:0 "Лоуэлл Йерекс родился в Новой Зеландии, учился в Соединённых Штатах и во время Великой войны служил в британском Королевском лётном корпусе. В 1931 году он основал компанию «Транспортес Аэреос Сентроамериканос», ставшую крупной авиакомпанией Гондураса."
 HON_juan_manuel_galvez:0 "Хуан Мануэль Гальвес"
 HON_juan_manuel_galvez_desc:0 "Хуан Мануэль Гальвес Дурон занимал пост министра войны, флота и авиации при президенте Кариасе, а в 1949 году сменил его на посту президента. Во время своего правления он создал Центральный банк Гондураса и Национальный банк развития, ныне БАНДЕСА, унифицировал подоходный налог и официально объявил лемпиру национальной валютой Гондураса."
 HON_julio_lozano_diaz:0 "Хулио Лосано Диас"
 HON_julio_lozano_diaz_desc:0 "Хулио Лосано Диас начал карьеру в горнодобывающей компании «Росарио», где занимал почти все административные должности. Позднее он стал министром экономики, финансов и государственного кредита при Тибурсио Кариасе и пересмотрел условия долга Гондурасской железной дороги перед английскими держателями облигаций. Впоследствии он основал ПНЕ и стал президентом в 1954 году."
 HON_taca:0 "Авиакомпания ТАКА"
 HON_taca_desc:0 "«Транспортес Аэреос дель Континенте Американо» была основана Лоуэллом Йерексом в 1931 году и начала работу с одного одномоторного самолёта «Стинсон». Её маршруты охватывали всю территорию Гондураса, а позднее распространились на остальную Латинскую Америку. В 1945 году авиакомпания ТАКА перенесла штаб-квартиру в Сальвадор, где провела модернизацию и расширение."
 hon_fnh:0 "Национальная железная дорога Гондураса"
 hon_fnh_desc:0 "Национальная железная дорога Гондураса была построена на средства, полученные в долг от Великобритании и Франции в середине XIX века. Однако в начале XX века главным инициатором железнодорожного строительства в стране стала компания «Юнайтед Фрут». За прокладку новых линий она получила земельные участки на севере Гондураса."
 HON_rmc:0 "Горнодобывающая компания «Росарио»"
 HON_rmc_desc:0 "Нью-Йоркская и гондурасская горнодобывающая компания «Росарио» была основана в 1880 году и получила права на разработку месторождений возле Сан-Хасинто. Позднее она приобрела контрольные доли в нескольких других шахтах Гондураса, а со временем распространила интересы на Северную и Южную Америку и Северное море."
 HON_mateo_ortega:0 "Матео Ортега"
 HON_salvador_alvarado:0 "Сальвадор Альварадо"
 HON_gregorio_ferrera:0 "Грегорио Феррера"
 HON_soviets_gave_guns:0 "Поддерживает кампесинос"
 HON_soviets_no_guns:0 "Игнорирует кампесинос"
 HON_soviet_acceptance:0 "[SOV.GetNameDefCap] поддерживает нашу революцию"
 HON_mirco:0 "Микроуправление"
 HON_mirco_desc:0 "Хотя расширение нашей компании превзошло международные ожидания, оно всё ещё не соответствует высоким требованиям президента Земуррея. На недавнем совещании он сказал генералам: «Вы, господа, достаточно долго портили это дело. Теперь я сам наведу порядок», — и отныне будет лично контролировать ситуацию."
 HON_army:0 "[HON.GetAdjective] армия"
 HON_army_desc:0 "Чтобы выжить в Центральной Америке, необходимо укрепить армию."
 HON_conscription:0 "[HON.GetAdjective] солдаты"
 HON_conscription_desc:0 "[HON.GetAdjective] вооружённые силы недостаточно активно ведут набор. Необходимо сделать военную службу привлекательнее для молодого поколения."
 HON_arms:0 "Стрелковое оружие"
 HON_arms_desc:0 "Новые образцы стрелкового оружия появляются почти каждый год, поэтому следует обеспечить войска лучшим доступным вооружением."
 HON_arms_2:0 "Оружие поддержки"
 HON_arms_2_desc:0 "Мы продолжим обеспечивать пехоту и подразделения поддержки первоклассным снаряжением."
 HON_army_support:0 "Вспомогательное снаряжение"
 HON_army_support_desc:0 "Вместо копирования или покупки иностранной техники следует стремиться стать мировым лидером в области пехотного вооружения."
 HON_faster_small_arms:0 "Улучшенное производство стрелкового оружия"
 HON_faster_small_arms_desc:0 "Усилия по улучшению оснащения армии приносят плоды, и теперь мы способны эффективно выпускать оружие для пехотных дивизий."
 HON_tank_effort:0 "Развитие бронетехники"
 HON_tank_effort_desc:0 "Очевидно, что бронетанковая война — это будущее, и игнорировать данный факт нельзя. Улучшим технологии бронетехники и добавим в армию современные танковые дивизии."
 HON_mech_effort:0 "Развитие механизации"
 HON_mech_effort_desc:0 "Изучив бронетанковые технологии, исследователи поняли, что механизированные части также сыграют решающую роль в будущих войнах. Следует вложиться в исследования механизации и стремиться создать полностью механизированную армию."
 HON_special_forces:0 "Создать [HON.GetAdjective] силы специального назначения"
 HON_special_forces_desc:0 "Поскольку в армии почти нет специалистов, можно создать дивизию специального назначения."
 HON_special_forces_2:0 "[HON.GetAdjective] морская пехота"
 HON_special_forces_2_desc:0 "Центральная Америка полна опасной местности; возможно, разумнее высаживаться с моря, чем вести армию через джунгли. Разумеется, прежде чем планировать такие вторжения, нам потребуются боеспособные части морской пехоты."
 HON_jungle_training:0 "Спецназ для джунглей"
 HON_jungle_training_desc:0 "Тропические леса Центральной Америки — одни из самых густых в мире, и нашей армии придётся проводить в них много времени. Следует начать подготовку войск к боям в джунглях. Разумеется, силы специального назначения идеально подойдут для первого этапа обучения."
 HON_jungle_infant:0 "Пехота джунглей"
 HON_jungle_infant_desc:0 "Теперь, когда силы специального назначения обучены действиям в джунглях, можно подготовить к такой войне и обычные части."
 HON_jungle_infant_effect:0 "Открывает §Hподготовку к боям в джунглях§!\n§HПехота\n    Джунгли§!\n      Атака: §G+5%§!\n      Скорость передвижения: §G+10%§!\n"
 HON_jungle_moto:0 "Техника для джунглей"
 HON_jungle_moto_desc:0 "Провести танки и моторизованную пехоту через джунгли будет непросто, однако генеральный штаб разработал способ перемещения таких дивизий. Обучение мобильных частей действиям в джунглях позволит нам господствовать в этой местности."
 HON_jungle_moto_effect:0 "Открывает §Hподготовку к боям в джунглях§!\n§HМоторизованные части\n    Джунгли§!\n      Атака: §G+5%§!\n      Скорость передвижения: §G+10%§!\n§HМеханизированные части\n    Джунгли§!\n      Атака: §G+5%§!\n      Скорость передвижения: §G+10%§!\n§HБронетехника\n  Джунгли§!\n      Атака: §G+5%§!\n      Скорость передвижения: §G+10%§!\n"
 HON_land_doc:0 "Развитие армии"
 HON_land_doc_desc:0 "Несмотря на рост возможностей воздушной и морской войны, наземные сражения останутся важнейшей частью будущих конфликтов. Подготовившись заранее, мы избежим повторения окопного ада."
 HON_land_doc_2:0 "Развитие тактики"
 HON_land_doc_2_desc:0 "Наша страна десятилетиями не вела сухопутных войн, и армия начинает расслабляться. Необходимо изменить это, сделав упор на качество войск."
 HON_land_doc_3:0 "Развитие строевой подготовки"
 HON_land_doc_3_desc:0 "За межвоенные годы и в последних конфликтах поле боя изменилось. Необходимо постоянно пересматривать доктрины с учётом нового опыта."
 HON_navy:0 "Создать [HON.GetAdjective] флот береговой обороны"
 HON_navy_desc:0 "Сейчас наше побережье совершенно не защищено, и мы уязвимы перед морскими десантами. Следует исправить это, создав инфраструктуру для строительства сил береговой обороны."
 HON_invest_in_subs:0 "Развитие подводного флота"
 HON_invest_in_subs_desc:0 "Подводная война — самое захватывающее развитие флота со времён изобретения торпедного катера. Нам следует как защищаться от подлодок, так и применять их против вражеских перевозок."
 HON_invest_in_subs_2:0 "Развитие подводного флота II"
 HON_invest_in_subs_2_desc:0 "Поскольку большинство вторжений придётся осуществлять с моря, океанские волки могут стать мощным рубежом обороны. Скрытный подводный флот, охотящийся стаями, защитит наши морские пути."
 HON_invest_in_subs_3:0 "Развитие подводного флота III"
 HON_invest_in_subs_3_desc:0 "Совершенствуя методы производства подлодок, мы сможем строить одни из самых эффективных субмарин в мире!"
 HON_invest_in_destroyers:0 "Развитие эсминцев"
 HON_invest_in_destroyers_desc:0 "Изучая конструкцию и применение подводных лодок, мы также научились противостоять их тактике. Эсминцы сыграют в этом решающую роль."
 HON_invest_in_cruisers:0 "Развитие крейсеров"
 HON_invest_in_cruisers_desc:0 "Прежде чем переходить к исследованиям современных линкоров, необходимо заменить устаревшие крейсеры."
 HON_invest_in_carriers:0 "Развитие авианосцев"
 HON_invest_in_carriers_desc:0 "Современные боевые флоты будут строиться вокруг авианосцев, а не линкоров. Для господства на океанах нам понадобится несколько авианосцев."
 HON_invest_in_battleships:0 "Развитие линкоров"
 HON_invest_in_battleships_desc:0 "Страна с наибольшим числом линкоров будет править океанами. Линкоры и авианосцы воплощают старое и новое морского превосходства."
 HON_naval_doctrines:0 "Улучшенные военно-морские доктрины"
 HON_naval_doctrine_desc:0 "Современный флот важен, но корабли бесполезны, если моряки не умеют ими пользоваться. Следует обучить офицеров современной морской тактике."
 HON_navy_infrastructure:0 "Расширенная военно-морская инфраструктура"
 HON_navy_infrastructure_desc:0 "Чтобы флот мог соперничать с другими державами, необходимо модернизировать судостроительные мощности и построить дополнительные базы. Начнём масштабный проект развития военно-морской инфраструктуры."
 HON_airforce:0 "Создать [HON.GetAdjective] военно-воздушные силы"
 HON_airforce_desc:0 "Поскольку авиация в Центральной Америке ещё только развивается, мы можем превзойти соседей, став одной из первых стран региона с собственными военно-воздушными силами."
 HON_aviation:0 "Упор на истребители"
 HON_aviation_desc:0 "Некоторые революционные гражданские инженерные решения можно применить к истребителям, повысив их скорость, дальность и практический потолок. Чтобы не отстать от других стран, необходимо сосредоточиться на этом."
 HON_naval_aviation:0 "Морские бомбардировщики"
 HON_naval_aviation_desc:0 "Корабли оказались чрезвычайно уязвимы перед авиацией. Следует продолжать совершенствовать технологии, чтобы опережать любые контрмеры."
 HON_army_aviation:0 "Самолёты поддержки армии"
 HON_army_aviation_desc:0 "Самолёты поддержки сухопутных войск и флота показали высокую эффективность при сравнительно небольших затратах. Был предложен ряд улучшений, и инженеры могут создать новое поколение такой авиации."
 HON_army_aviation_2:0 "Упор на бомбардировщики"
 HON_army_aviation_2_desc:0 "Авиационная поддержка является неотъемлемой частью оборонительных и наступательных возможностей. Разрабатывая более быстрые, манёвренные и точные бомбардировщики, мы сохраним преимущество в наземных боях."
 HON_air_doctrine:0 "Улучшенные воздушные доктрины"
 HON_air_doctrine_desc:0 "Даже если мы способны строить современные самолёты, большинство пилотов не умеет на них летать. Исправим это, изучив воздушные доктрины."
 HON_air_bases:0 "Дополнительные авиабазы"
 HON_air_bases_desc:0 "В Центральной Америке трудно снабжать авиацию, особенно при нехватке инфраструктуры. Построим дополнительные авиабазы, чтобы увеличить дальность действия военно-воздушных сил."
 HON_politics:0 "Изучить политическую обстановку"
 HON_politics_desc:0 "После того как Тибурсио Кариас Андино едва победил на президентских выборах 1932 года, он подавил все формы политической оппозиции. Теперь [HON.GetNameDef] оказалось на распутье."
 HON_suggest_fascism:0 "Рассмотреть полный захват власти компанией «Юнайтед Фрут»"
 HON_suggest_fascism_desc:0 "Компания «Юнайтед Фрут» работает в Гондурасе с 1899 года, когда приобрела семь местных производителей бананов и начала экспорт в Новый Орлеан. С тех пор она всё активнее вмешивается в политику страны; возможно, настало время оценить выгоды полного захвата власти компанией."
 HON_invite_zemurray:0 "Пригласить Самуэля Земуррея"
 HON_invite_zemurray_desc:0 "Самуэль Земуррей фактически руководит компанией «Юнайтед Фрут» с 1932 года. Более двадцати лет он активно участвовал в политике Гондураса, в том числе организовал переворот, приведший Мануэля Бонилью к власти. Он недоволен результатами Кариаса, и его можно убедить стать следующим президентом."
 HON_american_support:0 "Американские деловые круги"
 HON_american_support_desc:0 "Свержение правительства обходится недёшево, а без поддержки инвесторов на родине шансы на успех невелики. Убедим их, что государство «Юнайтед Фрут» обеспечит более дешёвые фрукты, новые рабочие места и рекордную прибыль."
 HON_united_fruit_coup:0 "Свергнуть правительство Кариаса"
 HON_united_fruit_coup_desc:0 "Хотя идея захвата власти компанией «Юнайтед Фрут» поначалу казалась безумной, совет директоров и американские деловые круги быстро её поддержали. Настало время отстранить Кариаса и создать настоящее корпоративное государство. Это будет не первый переворот в Гондурасе при поддержке «Юнайтед Фрут», но, возможно, последний."
 HON_american_arms:0 "Импортировать [USA.GetAdjective] оружие"
 HON_american_arms_desc:0 "Недавняя смена руководства Гондураса получила поддержку совета директоров, но местное население не в восторге. Несколько американских оружейных компаний выразили поддержку и предложили свою продукцию. Было бы разумно принять их предложение."
 HON_fruit_security:0 "Создать подразделение безопасности «Юнайтед Фрут»"
 HON_fruit_security_desc:0 "Хотя «Юнайтед Фрут» много лет нанимала вооружённую охрану, недавнее расширение требует усиления безопасности. Создадим официальное подразделение безопасности компании, которое наймёт [USA.GetAdjective] наёмников для защиты наших интересов."
 HON_improved_production:0 "Улучшить методы производства"
 HON_improved_production_desc:0 "Пока мы контролировали лишь сельскохозяйственный сектор экономики Гондураса, другие отрасли нас почти не интересовали. Теперь необходимо диверсифицировать деятельность ради защиты интересов."
 HON_corporate_consolidation:0 "Подготовить корпоративную консолидацию"
 HON_corporate_consolidation_desc:0 "Теперь, когда у «Юнайтед Фрут» есть боеспособные силы защиты, пора задуматься об объединении активов в других странах. Оказывая давление в нужных местах, мы сможем установить контроль над Центральной Америкой. Однако мир сочтёт нас агрессором, и [USA.GetAdjective] правительство больше не сможет оправдывать нашу защиту."
 HON_take_guatemala:0 "Консолидировать [GUA.GetAdjective] активы"
 HON_take_guatemala_desc:0 "Настало время передать все центральноамериканские активы под прямой контроль. Компания «Юнайтед Фрут» особенно влиятельна в [GUA.GetNameDef], и вскоре мы подпишем с [GUA.GetLeader] 99-летнюю концессию и откроем новую плантацию в Тикисате. Однако теперь наша переговорная позиция сильнее, и мы можем потребовать контроля над всей страной."
 HON_take_elsalvador:0 "Интегрировать [ELS.GetNameDef]"
 HON_take_elsalvador_desc:0 "Теперь, когда у нас появились собственные вооружённые силы, можно начать экспансию в Центральной Америке. Совет директоров считает [ELS.GetNameDef] идеальной целью для следующего враждебного поглощения."
 HON_take_nicaragua:0 "Интегрировать [NIC.GetNameDef]"
 HON_take_nicaragua_desc:0 "Теперь, когда у нас появились собственные вооружённые силы, можно начать экспансию в Центральной Америке. Совет директоров считает [NIC.GetNameDef] идеальной целью для следующего враждебного поглощения."
 HON_take_costa_rica:0 "Расшириться в [COS.GetNameDef]"
 HON_take_costa_rica_desc:0 "Когда-то в Коста-Рике работал наш конкурент «Атлантик Фрут», но мы довели его до банкротства и приобрели активы в 1912 году. Однако полный контроль над новыми владениями возможен лишь после подчинения [COS.GetAdjective] правительства."
 HON_purchase_belize:0 "Купить Белиз"
 HON_purchase_belize_desc:0 "[ENG.GetNameDefCap] сосредоточилось на создании военной экономики, и ему наверняка нужны дополнительные суда. Поскольку Белиз выгоден нам, следует предложить [ENG.GetNameDef] купить его в обмен на банановозы."
 HON_take_panama:0 "Включить [PAN.GetNameDef] в состав"
 HON_take_panama_desc:0 "[PAN.GetNameDEfCap] — последняя страна, отделяющая нас от полного контроля над Центральной Америкой. Настало время потребовать её подчинения."
 HON_buy_canal:0 "Купить Панамский канал"
 HON_buy_canal_desc:0 "Панамский канал — один из важнейших мировых торговых путей, и его приобретение значительно сократит расходы. Предложим [USA.GetAdjective] правительству купить канал в обмен на огромную партию банановозов."
 HON_irca:0 "Объединиться с МЖЦА"
 HON_irca_desc:0 "Мы производим рекордные объёмы продукции, но нуждаемся в лучшей инфраструктуре. К счастью, Майнор Кит предложил объединить Международные железные дороги Центральной Америки с «Юнайтед Фрут». Слияние соединит несколько плантаций современными железными дорогами."
 HON_invite_ford:0 "Пригласить «Форд Мотор» в Центральную Америку"
 HON_invite_ford_desc:0 "Значительная часть структуры «Юнайтед Фрут» основана на принципах управления Генри Форда, а теперь он считает наше государство идеальным воплощением корпоративного руководства. Строительство завода «Форд» в Центральной Америке может стать выгодной сделкой."
 HON_great_white:0 "Продвигать Великий белый флот"
 HON_great_white_desc:0 "Великий белый флот — круизная линия, перевозящая гражданских к различным владениям «Юнайтед Фрут» и показывающая им светлую сторону работы на компанию. Туристы видят лишь небольшие части плантаций, но уезжают с лучшим мнением о нас и нашей деятельности."
 HON_banana_boats:0 "Массовое производство банановозов"
 HON_banana_boats_desc:0 "Банановозы перевозят бананы из Центральной Америки по всему миру. Почти вся наша экономическая деятельность и безопасность зависят от этих судов, поэтому их необходимо выпускать массово. Через несколько лет наш торговый флот превзойдёт флоты великих держав!"
 HON_agricola:0 "Основать Панамериканскую сельскохозяйственную школу"
 HON_agricola_desc:0 "Квалифицированных работников трудно найти, особенно среди местного населения. Президент Земуррей попытался решить проблему, основав Панамериканскую сельскохозяйственную школу — бесплатный университет, специализирующийся на аграрных исследованиях. Новое учреждение обеспечит государство способными кадрами на поколения вперёд."
 HON_corporate_alliance:0 "Союз настоящих корпоративных государств"
 HON_corporate_alliance_desc:0 "Хотя идеи Муссолини и Гитлера были новаторскими, эти фашистские режимы упустили главное — прибыль. Постоянные войны и расовые законы показывают, что только мы способны правильно управлять экономикой крупного фашистского государства. Следует создать собственную фракцию и попытаться объединить мир под корпоративной властью."
 HON_fruitful_partnership:0 "Плодотворное партнёрство"
 HON_fruitful_partnership_desc:0 "Новый курс подорвал [USA.GetAdjective] Корпоративный класс, от которого мы больше не можем зависеть [USA.GetNameDef] Как бизнес-партнер.[GER.GetNameDefCap]Растущая власть впечатлила многих членов совета директоров, и согласование с Осью может быть полезным."
 HON_go_communist:0 "Возродить Рабоче-крестьянский блок"
 HON_go_communist_desc:0 "Рабоче-крестьянский блок был основан Мануэлем Каликсом Эррерой в конце 1920-х годов, но Кариас запретил его после прихода к власти. Хотя организация была разгромлена, многие по-прежнему верят в её идеалы. Следует усилить рабочий класс и вновь легализовать Рабоче-крестьянский блок."
 HON_herrera_jailbreak:0 "Освободить Эрреру из тюрьмы"
 HON_herrera_jailbreak_desc:0 "Мануэль Каликс Эррера был основателем Рабоче-крестьянского блока и его единственным кандидатом в президенты. К сожалению, после организации забастовки его схватила компания «Юнайтед Фрут» и заключила на островах Баия. Его руководство необходимо революции, поэтому следует как можно скорее организовать побег."
 HON_soviet_support:0 "Запросить [SOV.GetAdjective] финансирование"
 HON_soviet_support_desc:0 "Президент Кариас пользуется поддержкой землевладельцев и компании «Юнайтед Фрут», поэтому самостоятельно свергнуть его невозможно. Однако можно убедить товарищей из [SOV.GetNameDef] поддержать наше дело."
 HON_peasant_revolution:0 "Крестьянская революция"
 HON_peasant_revolution_desc:0 "Кампесинос охвачены волнением, и большинство вступило в Рабоче-крестьянский блок. Опора власти Кариаса разрушена, и момент для революции настал. Свергнем феодальных землевладельцев, изгоним компанию «Юнайтед Фрут» и создадим первую в мире крестьянскую республику!"
 HON_seize_plantations:0 "Захватить плантации «Юнайтед Фрут»"
 HON_seize_plantations_desc:0 "Компания «Юнайтед Фрут» слишком долго действовала в нашей стране. Необходимо изгнать эту паразитическую корпорацию и конфисковать её имущество. Захват плантаций станет первым шагом к переходу средств производства в руки кампесинос."
 HON_collectivization:0 "Коллективизировать частную собственность"
 HON_collectivization_desc:0 ""
 HON_five_year_plan:0 "[HON.GetAdjective] пятилетний план"
 HON_five_year_plan_desc:0 ""
 HON_establish_a_secret_police_communist:0 "Финансировать тайную полицию"
 HON_establish_a_secret_police_communist_desc:0 "Наблюдение за населением не позволит возникнуть оппозиции правительству и его политике, благодаря чему мы сможем добиваться целей без лишних помех."
 HON_peoples_army:0 "[HON.GetAdjective] народная армия"
 HON_peoples_army_desc:0 "Хотя народ теперь контролирует страну, успех революции ещё не гарантирован. Буржуазия по-прежнему угнетает другие государства Центральной Америки, а нам угрожает вторжение гринго или [ENG.GetAdjective] империалистов. К счастью, многие кампесинос вступают в недавно созданную Народную армию Гондураса, чтобы защитить обретённую свободу."
 HON_soviet_guns:0 "Поставка [SOV.GetAdjective] оружия"
 HON_soviet_guns_desc:0 "[SOV.GetNameDefCap] рассматривает нас как полезного союзника в Америке, поскольку мы можем снабжать его, не опасаясь бомбардировок наших заводов со стороны [GER.GetNameDef]. [SOV.GetAdjective] сторона отправила нам оружие для защиты революции, рассчитывая, что мы отплатим тем же, когда она вступит в войну."
 HON_soviet_milmission:0 "[SOV.GetAdjective] военная миссия"
 HON_soviet_milmission_desc:0 "Теперь, когда [SOV.GetNameDef] продемонстрировало поддержку нашей революции, мы можем укрепить связи между двумя союзами. [SOV.GetNameDefCap] с радостью направит военную миссию для обучения наших армий и подготовки их к борьбе с империалистами."
 HON_liberate_central:0 "Освободительные войны в Центральной Америке"
 HON_liberate_central_desc:0 "Гондурас — не единственная страна Центральной Америки, угнетаемая буржуазией. Каждым из наших соседей управляют землевладельцы и деловые круги гринго. Объединим Центральную Америку и освободим угнетённых кампесинос!"
 HON_liberate_mexico_again:0 "Ударить на север"
 HON_liberate_mexico_again_desc:0 ""
 HON_support_the_prc:0 "Поддержать НОАК"
 HON_support_the_prc_desc:0 "Китайские коммунисты более десяти лет борются за свержение диктатуры [CHI.GetLeader]. Их популярность растёт с каждым днём, поэтому мы должны поддержать их усилия и помочь объединить китайскую родину!"
 HON_support_the_indochinese_communists:0 "Поддержать индокитайских коммунистов"
 HON_support_the_indochinese_communists_desc:0 "Вьетнамцы и их товарищи в Индокитае подвергались жестокому обращению и угнетению со стороны империалистического французского правительства и его союзников. Поскольку их движение близко нашей идеологии, мы должны поддержать освободительную войну и помочь угнетённым обрести свободу!"
 HON_a_call_to_arms:0 "Мировая революция"
 HON_a_call_to_arms_desc:0 ""
 HON_destroy_fascism_communist:0 "Искоренить фашизм"
 HON_destroy_fascism_communist_desc:0 ""
 HON_against_imperialism:0 "Долой империализм!"
 HON_against_imperialism_desc:0 ""
 HON_study_soviet_tactics:0 "Изучить советскую тактику"
 HON_study_soviet_tactics_desc:0 ""
 HON_liberate_guatemala:0 "Освободить [GUA.GetAdjective] кампесинос"
 HON_liberate_guatemala_desc:0 "Слишком долго Гватемалу угнетали компания «Юнайтед Фрут» и буржуазное правительство. Настало время распространить революцию на [GUA.GetNameDef] и обеспечить свободу местным кампесинос!"
 HON_borderwar_with_belize_communist:0 "Освободить [311.GetName]"
 HON_borderwar_with_belize_communist_desc:0 ""
 HON_borderwar_with_canal_communist:0 "Захватить канал"
 HON_liberate_salvador:0 "Освободить Сальвадор"
 HON_liberate_salvador_desc:0 "[ELS.GetNameDefCap] находится под властью особенно репрессивного режима, и его народ взывает к освобождению. Мы должны ответить на этот призыв и принять сальвадорских крестьян в нашу республику."
 HON_liberate_nicaragua:0 "Распространить революцию на Никарагуа"
 HON_liberate_nicaragua_desc:0 "[NIC.GetNameDefCap] контролируется семьёй Сомоса, управляющей Никарагуа словно организованный преступный синдикат. Мы должны поставить Сомос на место и предать их суду за преступления против никарагуанских кампесинос!"
 HON_liberate_costarica:0 "Коллективизировать Коста-Рику"
 HON_liberate_costarica_desc:0 "[COS.GetAdjective] буржуазное правительство менее жестоко, чем никарагуанский режим, но кампесинос на коста-риканских плантациях всё ещё страдают. Распространим революцию на Коста-Рику и освободим работников кофейных плантаций!"
 HON_liberate_panama:0 "Уничтожить [PAN.GetAdjective] олигархию"
 HON_liberate_panama_desc:0 "Хотя Панама называет себя демократией, на деле ею правит олигархия. Землевладельцы и буржуазия господствуют в этом строе, и ради освобождения Центральной Америки мы должны свергнуть коррумпированный режим."
 HON_land_reform:0 "Земельная реформа"
 HON_land_reform_desc:0 "На протяжении почти всей истории Гондураса практически все плодородные земли контролировались землевладельцами или иностранными компаниями вроде «Юнайтед Фрут». Сегодня мы ликвидируем крупные поместья и распределим землю между кампесинос. Теперь народ сможет владеть землёй, которую он неустанно обрабатывал."
 HON_soviet_intel:0 "Пригласить советников НКВД"
 HON_soviet_intel_desc:0 "Империалисты могут нанести удар в любой момент, и мы должны быть готовы. К сожалению, наша разведка малоэффективна, и мы не можем узнать, готовит ли буржуазия нападение. Однако друзья из [SOV.GetNameDef] могут направить советников НКВД для укрепления наших разведывательных возможностей."
 HON_collective_agriculture:0 "Коллективные методы земледелия"
 HON_collective_agriculture_desc:0 "После того как кампесинос установили контроль над плантациями, они разработали улучшенные методы производства. Это позволило прокормить население и отправлять излишки товарищам за рубеж."
 HON_peoples_war:0 "Развивать тактику партизанской войны"
 HON_peoples_war_desc:0 "Хотя мы не сможем победить армии империалистов в открытом бою, их можно постепенно измотать. Однако прежде чем вести настоящую партизанскую войну, необходимо решить проблему снабжения в труднопроходимой местности. Обучим армию сражаться даже при полном отсутствии припасов."
 HON_peoples_university:0 "Народный университет Центральной Америки"
 HON_honduran_red_army:0 "Красная армия Гондураса"
 HON_honduran_red_army_desc:0 ""
 HON_peoples_university_desc:0 "Буржуазия Центральной Америки почти не интересовалась образованием кампесинос, поэтому значительная часть населения неграмотна. Революция принесла образование массам, а новое высшее учебное заведение позволит продолжить эту программу."
 HON_socialist_block:0 "Создать союз социалистических стран"
 HON_socialist_block_desc:0 "Хотя значительной частью успеха мы обязаны [SOV.GetAdjective] поддержке, полностью подчиняться сталинистам было бы неразумно. Создадим собственный блок и пригласим все подлинно социалистические страны."
 HON_join_soviets:0 "Вступить в Коминтерн"
 HON_join_soviets_desc:0 "С самого начала [SOV.GetAdjective] сторона поддерживала нашу революцию, и теперь мы готовы вступить в Коминтерн. Вместе мы принесём социализм в восточное и западное полушария!"
 HON_campesino_republic:0 "Крестьянская республика Центральной Америки"
 HON_campesino_republic_desc:0 "Мы освободили народы Центральной Америки и создали крестьянское государство, способное соперничать с империалистами. Коллективное производство доказало превосходство над всем, что могли придумать капиталисты, и позволило создать мощную промышленную базу. Теперь мы можем освободить всю Латинскую Америку или даже поставить на колени империалистов-гринго."
 HON_status_quo:0 "Укрепить власть Кариаса"
 HON_status_quo_desc:0 "[HON.GetNameDefCap] Формально это демократия при Кариасе, даже если нынешнее правительство более авторитарно, чем большинство западных демократий.[HON.GetNameDefCap] Возможно, у нас не самая лучшая система управления, но альтернативы слишком опасны. Давайте не будем раскачивать лодку и защищать позицию Кариаса."
 HON_appoint_brooks:0 "Назначить полковника Брукса"
 HON_appoint_brooks_desc:0 "Недавно созданной Военной авиационной школе не хватает руководства, но связи президента Кариаса с [USA.GetNameDef] помогли найти подходящего кандидата. Полковник Брукс, [USA.GetAdjective] наёмник, способен возглавить новую авиационную академию."
 HON_stabilize_economy:0 "Стабилизировать экономику"
 HON_stabilize_economy_desc:0 "Великая депрессия нанесла удар по экспорту Гондураса, а безработица стремительно растёт. Однако президент может провести экономические реформы и стабилизировать положение. По крайней мере, это поможет избежать худших последствий кризиса."
 HON_liberal_amnesty:0 "Амнистировать Либеральную партию"
 HON_liberal_amnesty_desc:0 "Хотя Коммунистическая партия запрещена, президент Кариас готов терпеть ограниченную оппозицию со стороны Либеральной партии. Её программа мало отличается от курса Кариаса, а амнистия участников восстания 1935 года позволит нам выглядеть демократичнее."
 HON_fortifications:0 "Защитить страну"
 HON_fortifications_desc:0 "Гондурас, вероятно, сохранит нейтралитет в грядущей войне, но укрепить оборону всё же разумно. [GER.GetNameDefCap] или [JAP.GetNameDef] могут попытаться использовать нашу страну как базу для вторжения в [USA.GetNameDef], однако несколько укреплений должны их отпугнуть."
 HON_better_industry:0 "Улучшенное сельскохозяйственное оборудование"
 HON_better_industry_desc:0 "Промышленность всё ещё находится в зачаточном состоянии, а большая часть иностранных инвестиций направляется в сельское хозяйство. Однако исследования в области индустриального земледелия позволят улучшить [HON.GetADjective] экономику."
 HON_against_axis:0 "Объединить народ против фашизма"
 HON_against_axis_desc:0 "[USA.GetNameDefCap], вероятно, вступит в войну против Оси и после этого попросит нас о помощи. Используем средства массовой информации, чтобы осудить державы Оси и сделать участие в мировой войне приемлемым для граждан."
 HON_join_allies:0 "Поддержать [USA.GetNameDef]"
 HON_join_allies_desc:0 "[USA.GetNameDefCap] вступило в войну после нападения на Пёрл-Харбор и ожидает, что союзники в Латинской Америке объявят войну [GER.GetNameDef] и внесут вклад в общие усилия. Покажем [USA.GetNamedef], что мы надёжные союзники, и присоединимся к борьбе."
 HON_usa_naval_bases:0 "[USA.GetAdjective] военно-морские базы"
 HON_usa_naval_bases_desc:0 "[USA.GetAdjective] сторона предложила построить в нашей стране новую военно-морскую базу, чтобы эффективнее поддерживать военные усилия. Планируется расширить небольшую базу в Трухильо для защиты от [GER.GetAdjective] подлодок, действующих в Карибском море. Поможем [USA.GetAdjective] стороне защитить море и построить базу."
 HON_usa_naval_doctrine:0 "[USA.GetADjective] военно-морская тактика"
 HON_usa_naval_doctrine_desc:0 "Хотя [USA.GetNameDef] не ожидает от нас отправки большого числа солдат, оно рассчитывает на помощь в защите судоходства от подводной войны Оси. Чтобы мы могли потопить несколько подлодок, [USA.GetAdjective] сторона предложила обучить наших морских офицеров новейшей тактике."
 HON_carias_legacy:0 "Наследие президента Кариаса"
 HON_carias_legacy_desc:0 "Историкам будет непросто оценить наследие Тибурсио Кариаса Андино. Он подавлял большинство форм политической оппозиции и боролся с [HON.GetAdjective] профсоюзами, но обеспечил стабильность [HON.GetAdjective] экономики во время Великой депрессии. Однако кумовство Кариаса и покровительство иностранным деловым интересам подорвали демократические институты Гондураса, и стране потребуется время, чтобы прийти к полноценной демократии."
 HON_examine_industry:0 "[HON.GetAdjective] экономика"
 HON_examine_industry_desc:0 "[HON.GetAdjective] экономика сильно зависит от экспорта, особенно фруктов вроде бананов. Тем не менее страна способна создать промышленную базу, даже если придётся строить её с нуля."
 HON_build_infra1:0 "Построить новые дороги"
 HON_build_infra1_desc:0 "[HON.GetNameDefCap] страдает от плохой инфраструктуры, но строительство новых дорог должно решить проблему. Соединим города и плантации [HON.GetNameDef] единой дорожной сетью и сделаем экономику эффективнее."
 HON_build_milfact1:0 "Создать оружейную промышленность"
 HON_build_milfact1_desc:0 "Поскольку [HON.GetAdjective] экономика основана на сельскохозяйственном экспорте, до сих пор почти не было причин развивать оружейную промышленность. Однако [HON.GetAdjective] армии требуется снаряжение, поэтому необходимо создать промышленную базу для снабжения войск."
 HON_build_civfact1:0 "Развивать промышленную базу"
 HON_build_civfact1_desc:0 "[HON.GetNameDefCap] импортирует большую часть промышленных товаров, но ради самодостаточной экономики это должно измениться. Построим дополнительные фабрики в одном из регионов."
 HON_build_milfact2:0 "Расширить оружейную промышленность"
 HON_build_milfact2_desc:0 "Создание оружейной промышленности — отличный первый шаг, однако для соперничества с остальным миром необходимо увеличить военное производство."
 HON_build_infra2:0 "Связать страну"
 HON_build_infra2_desc:0 "Инфраструктура должна соответствовать растущей промышленной базе. Построим дополнительные дороги и железнодорожные линии, чтобы связать страну. После завершения работ продукцию можно будет легко перевозить через джунгли."
 HON_build_docks1:0 "Создать судостроительную промышленность"
 HON_build_docks1_desc:0 "Поскольку значительная часть экономики зависит от морских перевозок, нам нужен флот для защиты интересов. К счастью, промышленная база уже достаточно велика для производства военных кораблей."
 HON_new_university:0 "Национальный автономный университет Гондураса"
 HON_new_university_desc:0 "Национальный автономный университет Гондураса был основан в 1847 году и является старейшим университетом страны. Следует выделить больше средств на его содержание и сделать лучшим высшим учебным заведением Латинской Америки."
 HON_build_civfact2:0 "Расширить промышленную базу"
 HON_build_civfact2_desc:0 "[HON.GetNameDefCap]Индустриализация идет по правильному пути, но мы могли бы извлечь выгоду из дополнительных заводов. Расширим нашу промышленную базу и сделаем [HON.GetNameDef] Известный экспортер промышленных товаров."
 HON_tech_industry:0 "Создать электронную промышленность"
 HON_tech_industry_desc:0 "Чтобы сохранять экономическую конкурентоспособность, [HON.GetNameDefCap] должно продолжать диверсификацию. Разовьём знания в области электроники и начнём производить высокотехнологичные товары."
 HON_build_milfact3:0 "Военно-промышленный комплекс"
 HON_build_milfact3_desc:0 "[HON.GetADjective] военное производство наконец достигло уровня, позволяющего переориентировать экономику на выпуск вооружений. Теперь мы можем создать национальный военно-промышленный комплекс, который, несомненно, не приведёт ни к каким непредвиденным последствиям."
 HON_improved_research:0 "Улучшенные методы исследований"
 HON_improved_research_desc:0 "Благодаря значительному расширению системы образования мы способны догнать остальной мир. Дополнительные вложения позволят развивать технологии ещё быстрее и превзойти некоторые великие державы."
 HON_power_research:0 "Технологическое превосходство"
 HON_power_research_desc:0 "Контроль над Центральной Америкой сделал нас великой державой, однако технологии всё ещё отстают. Удвоим финансирование науки и образования, чтобы расширить исследовательские возможности."
 HON_suggest_monarchy:0 "Имперская ностальгия"
 HON_suggest_monarchy_desc:0 "С момента обретения независимости от Испании наша страна приходит в упадок, и отдельные голоса предлагают возродить вице-королевство Новая Испания. Идея может казаться безумной, но события в Испании показали, что истинному испанскому королю нужен новый престол."
 HON_invite_juan:0 "Пригласить инфанта Хуана"
 HON_invite_juan_desc:0 "Инфант Хуан надеялся сменить отца на испанском престоле, но последние события показали, что коронация маловероятна. Предложим ему трон Гондураса и возможность восстановить вице-королевство Новая Испания."
 HON_monarchist_coup:0 "Монархический переворот"
 HON_monarchist_coup_desc:0 "Теперь, когда инфант Хуан прибыл из Испании, свергнем президента Кариаса. Мы можем короновать инфанта как Хуана I и начать подготовку к восстановлению вице-королевства Новая Испания. Новый король — единственный Хуан, способный вернуть ему былую славу."
 HON_spanish_guns:0 "Испанское оружие"
 HON_spanish_guns_desc:0 "Хотя коронация Хуана в Испании была маловероятна, у него оставалось множество сторонников. Если король вежливо попросит, они смогут вложить свои надежды и оружие в [HON.GetNameDef]."
 HON_kings_finest:0 "Лучшие воины короля"
 HON_kings_finest_desc:0 "Чтобы Хуан I удержал престол, необходимо создать королевскую гвардию для защиты от демократов, коммунистов и бывших территорий вице-королевства. К счастью, многие молодые люди в [HON.GetNameDef] готовы умереть за короля и страну."
 HON_haciendas:0 "Восстановить систему асьенд"
 HON_haciendas_desc:0 "Многие международные компании в [HON.GetNameDef] фактически превратили плантации в асьенды. Однако прибыль уходит капиталистам, а не короне. Исправим это, восстановив настоящую систему асьенд и передав плантации аристократии."
 HON_restoration_wars:0 "Реставрационные войны"
 HON_restoration_wars_desc:0 "Прежде чем провозгласить восстановление вице-королевства, необходимо вернуть большую часть земель, входивших в его состав. Восстановление границ 1820 года станет первым шагом к возвращению имперской славы."
 HON_reclaim_salvador:0 "Вернуть Сальвадор"
 HON_reclaim_salvador_desc:0 "Хотя Сальвадор был лишь небольшой частью вице-королевства, он всё же представлял ценность для генерал-капитанства Гватемала. Вернём Сальвадор короне и включим его в состав королевства."
 HON_reclaim_nicaragua:0 "Вернуть Никарагуа"
 HON_reclaim_nicaragua_desc:0 "Никарагуа была неотъемлемой частью генерал-капитанства Гватемала, и для восстановления вице-королевства Новая Испания её придётся завоевать. Захватим Никарагуа и передадим её под управление нашей знати."
 HON_reclaim_guatemala:0 "Вернуть Гватемалу"
 HON_reclaim_guatemala_desc:0 "Гватемала была столицей одноимённого генерал-капитанства и служит воротами к восстановлению контроля над сердцем Новой Испании — Мексикой. Её захват станет важнейшим шагом к осуществлению наших замыслов."
 HON_reclaim_belize:0 "Британцы отвлечены — захватить Белиз"
 HON_reclaim_belize_desc:0 "Коварный Альбион отнял Белиз у испанцев, позволив пиратам поселиться среди бейменов, а в 1786 году окончательно признал его своей колонией. Испанская корона попыталась вернуть Белиз в битве у Сент-Джорджс-Ки в 1798 году, но потерпела поражение из-за британского коварства. Однако сейчас [ENG.GetADjective] сторона занята войной, и, возможно, настал идеальный момент для возвращения Белиза."
 HON_reclaim_costarica:0 "Вернуть Коста-Рику"
 HON_reclaim_costarica_desc:0 "Коста-Рика была южной окраиной вице-королевства Новая Испания и является его неотъемлемой частью. Хотя эти земли не особенно ценны, мы должны занять их ради безопасности южной границы."
 HON_reclaim_cuba:0 "Вернуть Кубу"
 HON_reclaim_cuba_desc:0 "Куба была одной из немногих территорий, сохранивших верность Испании во время революционных войн, но американцы захватили её в ходе Испано-американской войны. Недавно они предоставили Кубе независимость, а значит, теперь мы можем вернуть остров испанской короне."
 HON_reclaim_hispanola:0 "Вернуть Эспаньолу"
 HON_reclaim_hispanola_desc:0 "Когда-то вся Эспаньола принадлежала Испанской империи, но в XVII веке западная половина перешла к Франции, а восточная в 1795 году была утрачена по Базельскому миру. Исправим эти исторические несправедливости, восстановив контроль над островом."
 HON_reclaim_mexico:0 "Захватить Мексику"
 HON_reclaim_mexico_desc:0 "Мексика была сердцем и душой вице-королевства Новая Испания. Никто не воспримет наши притязания всерьёз, пока мы не восстановим власть над этим регионом. Вернув Мексику, мы наконец сможем провозгласить возрождение вице-королевства."
 HON_intendancies:0 "Восстановить интендантства"
 HON_intendancies_desc:0 "Интенданты были администраторами, чьи должности появились в ходе реформ Бурбонов XVIII века. После обретения независимости управление колониями пришло в упадок, и восстановление системы интендантств позволит эффективнее управлять королевством."
 HON_coastal_forts:0 "Укрепить береговую оборону"
 HON_coastal_forts_desc:0 "Одной из главных угроз вице-королевству были морские вторжения, и подобные атаки могут уничтожить наше возрождающееся государство. Построим систему береговых укреплений для защиты от любой державы, решившей высадить армию на наших берегах."
 HON_refined_goods:0 "Промышленное сельское хозяйство"
 HON_refined_goods_desc:0 "Отсутствие индустриализации стало одной из причин падения Испании, и мы не должны повторять эту ошибку. Поскольку у нас уже один из крупнейших сельскохозяйственных секторов мира, разумно построить несколько предприятий для переработки аграрной продукции."
 HON_economica:0 "Поддержать Экономическое общество"
 HON_economica_desc:0 "Экономические общества друзей страны представляли собой частные объединения, основанные в различных городах Испанской империи. Они успешно поощряли хозяйственную деятельность и новаторство, но пришли в упадок после распада Новой Испании. Государственное финансирование их восстановления позволит нашей научной инфраструктуре соперничать с великими державами."
 HON_reconquista:0 "Ререконкиста"
 HON_reconquista_desc:0 "Последние два столетия принесли Испанской империи одни унижения, и настало время отомстить за её падение. Мы должны восстановить Новую Испанию — жемчужину империи — и в конечном счёте вернуть Хуана I на законный испанский престол. Эта Ререконкиста не будет бескровной, но лишь она способна вернуть империи былое величие."
 HON_inquisition:0 "Новая испанская инквизиция"
 HON_inquisition_desc:0 "Испанская инквизиция была одним из самых могущественных орудий империи и обеспечивала верность подданных короне и католической вере. Восстановив её, мы не только спасём души подданных от вечного проклятия, но и искореним политических противников."
 HON_proclaim_new_spain:0 "Провозгласить вице-королевство Новая Испания"
 HON_proclaim_new_spain_desc:0 "Многие считали короля безумцем, когда он обещал вновь объединить вице-королевство Новая Испания, но ему удалось добиться цели. Сегодня наше королевство простирается от Коста-Рики до Нижней Калифорнии, и никто не может отрицать, что мы стали великой державой. Международное сообщество признает наши притязания, и отныне мы официально станем вице-королевством Новая Испания."
 HON_reclaim_america:0 "Отвоевать северные территории"
 HON_reclaim_america_desc:0 "Испаноязычный мир постоянно терпел унижения от англосаксов с тех пор, как они потопили Непобедимую армаду. Двумя величайшими поражениями стали договор Адамса — Ониса, по которому была уступлена Флорида, и договор Гуадалупе-Идальго, отнявший северную половину Мексики. Отомстим за эти поражения и вернём земли, захваченные американцами."
 HON_reclaim_spain:0 "Вернуть испанский престол"
 HON_reclaim_spain_desc:0 "Теперь, когда Хуан I полностью контролирует Новую Испанию, он может готовить возвращение в Испанию. Пересечь Атлантику будет непросто, но это не остановило конкистадоров. Возвращение Испании к монархическим истокам позволит восстановить былую славу империи."
 HON_gran_colombia:0 "Подготовить освобождение Великой Колумбии"
 HON_gran_colombia_desc:0 "Великая Колумбия остаётся разделённой со времён смерти Симона Боливара, и это позволило буржуазии янки пользоваться слабостью наших колумбийских товарищей. Мы должны восстановить её как крестьянскую республику, но сначала необходимо установить в Колумбии дружественное правительство."
 HON_liberate_mexico:0 "Освободить Мексику"
 HON_liberate_mexico_desc:0 "Хотя наши товарищи в Мексике предприняли меры, вызвавшие недовольство империалистов-гринго, включая национализацию нефти, большинство людей всё ещё страдает. Освободим мексиканских кампесинос и установим правительство, преданное нашей борьбе."
 HON_real_gran_colombia:0 "Объединить Великую Колумбию"
 HON_real_gran_colombia_desc:0 "Теперь, когда в Колумбии установлено дружественное правительство, сделаем её законной наследницей Боливара. К сожалению, [VEN.GetADjective] и [ECU.GetADjective] правительства не понимают мудрости нашего предложения, поэтому придётся убедить их силой."
 HON_liberate_brazil:0 "Освободить бразильцев"
 HON_liberate_brazil_desc:0 "Хотя революция 1930 года ослабила бразильских олигархов, сельское население страны всё ещё угнетается военными и городской буржуазией. Мы должны свергнуть этот режим и заменить его властью, действующей в интересах народа."
 HON_prepare_the_liberation:0 "Подготовить освобождение"
 HON_caribfed:0 "Начать Карибскую революцию"
 HON_caribfed_desc:0 "Европейские империалисты веками господствовали на островах Карибского моря, и большинство местных народов никогда не знало подлинного суверенитета. Мы должны освободить карибских земледельцев и объединить их под одним знаменем. Поскольку в ходе последней революции кубинцев предали империалисты-гринго, они, вероятно, согласятся стать центром новой Карибской революции."
 HON_libperbol:0 "Принести революцию в Анды"
 HON_libperbol_desc:0 "Перуано-боливийская конфедерация пыталась защититься от янки и хищнических государств Бразилии и Аргентины. Тогда она потерпела неудачу, но новая Перу-Боливия может добиться успеха при нашей поддержке. Освободим товарищей в Перу и продолжим распространение революции по Южной Америке."
 HON_libbolivia:0 "Перуано-боливийская конфедерация"
 HON_libbolivia_desc:0 "Перуано-боливийская конфедерация мало чего стоит без Боливии. Освободим эту страну и передадим её земли дружественному правительству, установленному в Перу."
 HON_libargent:0 "Марш на Патагонию"
 HON_libargent_desc:0 "Когда наше влияние распространится глубоко в Южную Америку, можно будет создать новую крестьянскую республику Ла-Плата. Однако прежде чем объединять этот регион, следует установить дружественное правительство в Аргентине."
 HON_liblaplata:0 "Объединить Ла-Плату"
 HON_liblaplata_desc:0 "Наши товарищи в Аргентине поддерживают восстановление Ла-Платы и готовы помочь освободить остальную Южную Америку. Если революция охватит Уругвай, Парагвай и Чили, Латинская Америка наконец сможет оправиться от столетий угнетения."
 HON_support_the_south_american_communists:0 "Распространить революцию на Великую Колумбию"
 HON_support_the_south_american_communists_desc:0 ""
 HON_soviet_military_buildup:0 "Запустить военную промышленность Гондураса"
 HON_soviet_military_buildup_desc:0 ""
 HON_corporate_expansion:0 "Корпоративная экспансия"
 HON_corporate_expansion_desc:0 "Компания «Юнайтед Фрут» ведёт значительную деятельность в Колумбии с 1900 года, однако её работа столкнулась с препятствиями. Наши сотрудники в [COL.GetNameDef] всё ещё помнят Банановую бойню 1928 года, в которой погибло до трёх тысяч рабочих. Чтобы не допустить повторения, следует установить прямой контроль над [COL.GetAdjective] и [ECU.GetAdjective] предприятиями."
 HON_eliminate_competition:0 "Устранить конкурентов"
 HON_eliminate_competition_desc:0 "Даже если [RAJ.GetnameDef] Является одним из крупнейших в мире производителей бананов, на него не оказывает влияния Объединенная фруктовая компания. The [RAJ.GetAdjective] Банановая промышленность является нашим самым сильным конкурентом, и мы должны захватить контроль над этой отраслью, чтобы обеспечить нашу монополию. Наши директора решительно выступают против прямого вторжения. [RAJ.GetNameDef]Но мы могли бы инвестировать в развитие корпоратократии. [RAJ.GetNameDef]."
 hon.1.t:0 "[HON.GetNameDefCap] требует аннексии!"
 hon.1.d:0 "После захвата власти в Гондурасе компания «Юнайтед Фрут» пытается объединить все свои владения в Центральной Америке. Поскольку в [GUA.GetNameDef] у неё больше собственности, чем в любой другой стране региона, мы стали первой целью."
 hon.1.a:0 "Они уже контролируют нашу экономику; захват власти — лишь формальность."
 hon.1.b:0 "Никогда! Мы будем сражаться с фашистами всеми силами!"
 hon.2.t:0 "[GUA.GetAdjective] правительство соглашается на консолидацию"
 hon.2.d:0 "Наши переговорщики использовали контроль «Юнайтед Фрут» над [HON.GetNameDef] как рычаг давления, и [GUA.GetAdjective] правительство полностью подчинилось компании."
 hon.2.a:0 "Превосходно!"
 hon.3.t:0 "[GUA.GetADjective] правительство отказывается от консолидации"
 hon.3.d:0 "Переговорщики попытались использовать контроль «Юнайтед Фрут» над [HON.GetNameDef] как средство давления, но [GUA.GetAdjective] правительство отвергло наши требования. Придётся силой вернуть владения в этой стране."
 hon.3.a:0 "Объявим войну и покажем им мощь корпоративного государства!"
 hon.3.b:0 "Силы безопасности не готовы к полномасштабной войне. Подождём."
 hon.4.t:0 "[HON.GetNameDefCap] требует аннексии!"
 hon.4.d:0 "Теперь, когда компания «Юнайтед Фрут» контролирует Гватемалу, она стремится установить гегемонию над всей Центральной Америкой. К сожалению, следующей целью выбрали нас."
 hon.4.a:0 "Сопротивление бесполезно. Слава корпорации!"
 hon.4.b:0 "Никогда! Мы будем сражаться всеми силами!"
 hon.5.t:0 "[ELS.GetNameDefCap] капитулирует"
 hon.5.d:0 "[ELS.GetAdjective] правительство оценило выгоды превращения в дочернюю структуру компании «Юнайтед Фрут». Поприветствуем их с распростёртыми объятиями."
 hon.5.a:0 "Превосходно!"
 hon.6.t:0 "[ELS.GetAdjective] правительство отвергло наши требования!"
 hon.6.d:0 "К сожалению, [ELS.GetAdjective] правительство отказывается подчиниться корпоративной власти. Придётся сделать это враждебное поглощение ещё более враждебным."
 hon.6.a:0 "Объявим войну и покажем им мощь корпоративного государства!"
 hon.6.b:0 "С [ELS.GetAdjective] армией шутки плохи. Подождём."
 hon.7.t:0 "[HON.GetNameDefCap] требует аннексии!"
 hon.7.d:0 "Теперь, когда компания «Юнайтед Фрут» контролирует Гватемалу, она стремится установить гегемонию над всей Центральной Америкой. К сожалению, следующей целью выбрали нас."
 hon.7.a:0 "Сопротивление бесполезно. Слава корпорации!"
 hon.7.b:0 "Никогда! Мы будем сражаться всеми силами!"
 hon.8.t:0 "[NIC.GetNameDefCap] капитулирует"
 hon.8.d:0 "[NIC.GetAdjective] правительство оценило выгоды превращения в дочернюю структуру компании «Юнайтед Фрут». Поприветствуем их с распростёртыми объятиями."
 hon.8.a:0 "Превосходно!"
 hon.9.t:0 "[NIC.GetAdjective] правительство отвергло наши требования!"
 hon.9.d:0 "К сожалению, [NIC.GetAdjective] правительство отказывается подчиниться корпоративной власти. Придётся сделать это враждебное поглощение ещё более враждебным."
 hon.9.a:0 "Объявим войну и покажем им мощь корпоративного государства!"
 hon.9.b:0 "С [NIC.GetAdjective] армией шутки плохи. Подождём."
 hon.10.t:0 "Компания «Юнайтед Фрут» требует подчинения!"
 hon.10.d:0 "Компания «Юнайтед Фрут» только что установила контроль над Никарагуа и теперь стремится объединить бывшие владения «Атлантик Фрут» в [COS.GetNameDef]. Она требует, чтобы [COS.GetNameDef] подчинилось корпоративному управлению."
 hon.10.a:0 "Ладно, сыграем по их правилам."
 hon.10.b:0 "Никогда! Мы будем сражаться всеми силами!"
 hon.11.t:0 "[COS.GetNameDefCap] подчиняется"
 hon.11.d:0 "Наблюдая за последними событиями в Центральной Америке, [COS.GetAdjective] правительство увидело выгоды интеграции в компанию «Юнайтед Фрут»."
 hon.11.a:0 "Превосходно!"
 hon.12.t:0 "[COS.GetAdjective] правительство отказывается подчиниться!"
 hon.12.d:0 "К сожалению, [COS.GetAdjective] правительство отвергло наши требования. Придётся сделать это враждебное поглощение ещё более враждебным."
 hon.12.a:0 "Мы уничтожим их правительство так же, как уничтожили «Атлантик Фрут»."
 hon.12.b:0 "Меня беспокоят последствия. Подождём."
 hon.13.t:0 "[ROOT.GetNameDefCap] предлагает купить Белиз"
 hon.13.d:0 "[ROOT.GetNameDefCap] объединяет свои владения в Центральной Америке и проявило интерес к покупке Белиза. Один из их руководителей предложил приобрести территорию в обмен на несколько транспортных судов и столько бананов, сколько мы сможем съесть."
 hon.13.a:0 "Отличное предложение, нашим военным усилиям пригодятся банановозы."
 hon.13.b:0 "У нас достаточно кораблей, а Белиз слишком ценен для продажи."
 hon.14.t:0 "[ENG.GetNameDefCap] соглашается"
 hon.14.d:0 "[ENG.GetNameDefCap] приняло наше щедрое предложение и немедленно передаст нам Белиз. Мы отправим обещанные банановозы и значительную часть урожая."
 hon.14.a:0 "Эй, мистер счётчик, пересчитай мои бананы."
 hon.15.t:0 "[ENG.GetNameDefCap] отказывается продавать Белиз!"
 hon.15.d:0 "[ENG.GetNameDefCap] отклонило предложение, заявив, что не сможет включить наши банановозы в свой торговый флот."
 hon.15.a:0 "К сожалению, совет директоров пока не поддержит войну с [ENG.GetNameDef] за Белиз."
 hon.16.t:0 "[FROM.GetNameDefCap] требует нашей аннексии!"
 hon.16.d:0 "[FROM.GetNameDefCap] контролирует почти всю Центральную Америку, а мы остаёмся последним независимым государством региона. Однако [FROM.GetLeader] не согласится ни на что меньшее, чем полный контроль, и потребовал присоединения нашей страны."
 hon.16.a:0 "Сопротивляться бессмысленно."
 hon.16.b:0 "Никогда! Мы будем сражаться за свободную Центральную Америку!"
 hon.17.t:0 "[PAN.GetNameDefCap] соглашается на присоединение"
 hon.17.d:0 "[PAN.GetAdjective] правительство считает, что не сможет противостоять нам, и согласилось войти в наши владения."
 hon.17.a:0 "Центральная Америка принадлежит нам!"
 hon.18.t:0 "[PAN.GetAdjective] правительство отказывается от присоединения!"
 hon.18.d:0 "[PAN.GetNameDefCap] считает, что способно противостоять нам, хотя все остальные страны Центральной Америки уже пали. Нужно наказать их за высокомерие."
 hon.18.a:0 "Пора упасть последней костяшке домино."
 hon.18.b:0 "Добраться до их столицы будет непросто; подождём более выгодного момента."
 hon.19.t:0 "Компания «Юнайтед Фрут» предлагает купить Панамский канал"
 hon.19.d:0 "Компания «Юнайтед Фрут» объединяет свои судоходные операции в Центральной Америке и считает, что владение Панамским каналом значительно повысит их эффективность. Один из её руководителей лоббирует в Конгрессе продажу канала за множество банановозов и фруктов. Следует ли принять предложение?"
 hon.19.a:0 "Отличное предложение: эти банановозы позволят верфям сосредоточиться на военных кораблях."
 hon.19.b:0 "Они совсем спятили, если думают, что мы продадим им Панамский канал!"
 hon.20.t:0 "[USA.GetNameDefCap] соглашается"
 hon.20.d:0 "[USA.GetNameDefCap] приняло наше щедрое предложение и немедленно передаст Панамский канал. Мы отправим им банановозы и годовой запас фруктов."
 hon.20.a:0 "Фрукты должны течь рекой."
 hon.21.t:0 "[USA.GetNameDefCap] отказывается продавать Панамский канал!"
 hon.21.d:0 "К сожалению, [USA.GetNameDef] отклонило предложение, заявив, что Панамский канал жизненно важен для его интересов."
 hon.21.a:0 "Похоже, [USA.GetAdjective] правительство больше нас не поддерживает. Придётся действовать самостоятельно."
 hon.22.t:0 "[HON.GetNameDefCap] пытается захватить Белиз!"
 hon.22.d:0 "[HON.GetAdjective] правительство заметило, что мы заняты нынешней войной, и попыталось захватить Белиз, пока мы отвлеклись. Поскольку эта колония не слишком ценна, можно смириться и сосредоточиться на войне. Но можно также перебросить войска, защитить Белиз и избавиться от надоедливой [HON.GetAdjective] страны."
 hon.22.a:0 "Мы не можем позволить себе отправлять солдат умирать в джунглях; пусть забирают Белиз."
 hon.22.b:0 "Каждая колония этой империи ценна! Отправить военный ответ!"
 hon.23.t:0 "[ENG.GetAdjective] сторона смиряется с потерей"
 hon.23.d:0 "[ENG.GetAdjective] сторона решила, что Белиз не стоит ещё одной войны. Она признала его освобождение и сохранила с нами отношения."
 hon.23.a:0 "Мы всегда будем помнить их щедрость."
 hon.24.t:0 "[ENG.GetAdjective] сторона отвечает силой!"
 hon.24.d:0 "[ENG.GetAdjective] сторона решила не выпускать Белиз из империи и отправила армию для его защиты. В ответ на наше требование объявлена война, и теперь нас пытаются сокрушить. Однако они могут отступить, если мы захватим Белиз и удержим его достаточно долго."
 hon.24.a:0 "Сбросим империалистов обратно в море!"
 hon.25.t:0 "Мир ради Белиза?"
 hon.25.d:0 "Несмотря на то, что [ENG.GetAdjective] Мы решили бороться за Белиз, мы успешно заняли этот район и предотвратили его. [ENG.GetAdjective] Высадка в Центральной Америке. Если мы подадим в суд на мир, они, вероятно, согласятся."
 hon.25.a:0 "Нам нужен только Белиз; предложим мир."
 hon.25.b:0 "Никогда! Мы сокрушим всю [ENG.GetAdjective] империю!"
 hon.26.t:0 "[HON.GetNameDefCap] предлагает мир"
 hon.26.d:0 "[HON.GetNameDefCap] предлагает мир в обмен на признание его контроля над Белизом."
 hon.26.a:0 "Ладно! Пусть забирают этот бесполезный клочок земли!"
 hon.26.b:0 "Мы никогда не отдадим им Белиз!"
 hon.27.t:0 "[ENG.GetNameDefCap] соглашается"
 hon.27.d:0 "[ENG.GetNameDefCap] приняло наше мирное предложение и передаст Белиз. Мы одержали великую победу, пусть даже [ENG.GetAdjective] сторона потеряла лишь малую часть империи."
 hon.27.a:0 "Превосходно!"
 hon.28.t:0 "[ENG.GetNameDefCap] отказывается"
 hon.28.d:0 "[ENG.GetNameDefCap] отвергло наше мирное предложение и будет сражаться до полного уничтожения одной из сторон. [ENG.GetAdjective] сторона по глупости решила вести тотальную войну за Белиз."
 hon.28.a:0 "Хорошо! Мы заставим их сесть за стол переговоров в Лондоне!"
 hon.29.t:0 "[HON.GetNameDefCap] пытается захватить Панамский канал!"
 hon.29.d:0 "[HON.GetADjective] коммунистическое правительство заметило, что мы втянуты в крупную войну, и воспользовалось этим, чтобы захватить Панамский канал. Такое нельзя оставить без ответа, но вторжение в Центральную Америку может оказаться трудным."
 hon.29.a:0 "Мы всегда сможем вторгнуться позже; пусть забирают канал."
 hon.29.b:0 "Потеря Панамского канала парализует нашу логистику! Выбьем коммунистов из Америки!"
 hon.30.t:0 "[USA.GetNameDefCap] не отвечает"
 hon.30.d:0 "Хотя мы опасались [USA.GetAdjective] военного ответа, нам позволили захватить Панамский канал без единого выстрела."
 hon.30.a:0 "Теперь, когда канал принадлежит нам, океаны принадлежат народу."
 hon.31.t:0 "[USA.GetAdjective] сторона отвечает силой!"
 hon.31.d:0 "[USA.GetAdjective] сторона использовала попытку захвата Панамского канала как предлог для вторжения в Центральную Америку. Они хотят свергнуть наше правительство и очистить обе Америки от коммунистов!"
 hon.31.a:0 "Покажем этим гринго, чем заканчивается вмешательство в политику Латинской Америки!"
 hon.32.t:0 "Мир с [USA.GetNameDef]?"
 hon.32.d:0 "Хотя [ENG.GetADjective] сторона решила воевать с нами за Белиз, мы успешно заняли этот район и не позволили [USA.GetAdjective] силам высадиться в Центральной Америке. Если предложить мир, они, вероятно, согласятся."
 hon.32.a:0 "Нам нужен только Панамский канал; предложим мир."
 hon.32.b:0 "Никогда! Мы уничтожим всё [USA.GetName]!"
 hon.33.t:0 "[HON.GetNameDefCap] предлагает мир"
 hon.33.d:0 "[HON.GetNameDefCap] предлагает мир в обмен на признание его контроля над Панамским каналом."
 hon.33.a:0 "Ладно! Придётся построить канал где-нибудь ещё!"
 hon.33.b:0 "Мы никогда не отдадим им Панамский канал!"
 hon.34.t:0 "[USA.GetNameDefCap] соглашается"
 hon.34.d:0 "[USA.GetNameDefCap] приняло наше мирное предложение и передаст Панамский канал. Мы одержали великую победу, ведь владение каналом позволяет господствовать на морских путях обеих Америк."
 hon.34.a:0 "Превосходно!"
 hon.35.t:0 "[USA.GetNameDefCap] отказывается"
 hon.35.d:0 "[USA.GetNameDefCap] отвергло наше мирное предложение и будет сражаться до полного уничтожения одной из сторон. [USA.GetAdjective] сторона решила, что Панамский канал стоит тотальной войны."
 hon.35.a:0 "Хорошо! Мы заставим их сесть за стол переговоров в Вашингтоне!"
 hon.36.t:0 "Наследие президента Кариаса"
 hon.36.d:0 "Президент Кариас был... Погодите, вы действительно прошли демократическую ветку? Серьёзно? Я потратил время на две интересные ветви фокусов, а вы выбрали скучную? Вы либо преданы исторической игре, либо просто очень странный человек. Как бы то ни было, вы заслужили награду за то, что высидели всю демократическую ветку и почти ничего не делали всю игру. Как насчёт армии божественного уровня и огромной кучи людских ресурсов?"
 hon.36.a:0 "Ты чё, серьёзно?"
 hon.36.b:0 "Я просто ИИ, пожалуйста, оставьте меня в покое."
 hon.37.t:0 "Великая Колумбия требует наши северные территории"
 hon.37.d:0 "Великая Колумбия воссоединилась как марионеточное государство Центральной Америки и требует земли, отнятые у неё в начале XIX века. Их притязаниям больше ста лет, но за ними стоит центральноамериканская армия. Следует ли уступить?"
 hon.37.a:0 "Мы не можем рисковать войной; передать территории."
 hon.37.b:0 "Мы не отдадим ни пяди [PRU.GetAdjective] земли!"
 hon.38.t:0 "[PRU.GetNameDefCap] уступает"
 hon.38.d:0 "[PRU.GetAdjective] правительство приняло наше разумное требование и вернёт южные территории Великой Колумбии."
 hon.38.a:0 "Ещё один шаг к освобождению Латинской Америки!"
 hon.39.t:0 "[PRU.GetNameDefCap] отказывается"
 hon.39.d:0 "[PRU.GetAdjective] правительство отказалось возвращать бывшие территории Великой Колумбии. Это может быть лишь очередной заговор гринго."
 hon.39.a:0 "Тогда заберём их земли по старинке."
 hon.40.t:0 "Карибская федерация требует Кюрасао"
 hon.40.d:0 "Центральноамериканские революционеры попытались объединить Карибы под властью марионеточного правительства в Гаване. Теперь они требуют передать наши карибские владения. Требование нелепо, но, может быть, стоит отказаться от островов, чтобы сосредоточиться на европейских и азиатских проблемах?"
 hon.40.a:0 "Мы не можем рисковать войной; передать острова."
 hon.40.b:0 "Целостность [HOL.GetAdjective] империи жизненно важна! Отказать!"
 hon.41.t:0 "Уступки со стороны [HOL.GetAdjective] властей"
 hon.41.d:0 "[HOL.GetAdjective] сторона согласилась на наши требования и предпочла сосредоточиться на внутренних проблемах."
 hon.41.a:0 "До победы всегда!"
 hon.42.t:0 "[HOL.GetAdjective] сторона отказывается!"
 hon.42.d:0 "[HOL.GetAdjective] сторона отвергла наши требования. Она готова отправить ещё больше солдат на смерть, лишь бы не отдать часть империи."
 hon.42.a:0 "Тогда пора покончить с [HOL.GetAdjective] империей!"
 hon.43.t:0 "Карибская федерация требует Пуэрто-Рико"
 hon.43.d:0 "Центральноамериканские революционеры попытались объединить Карибы под властью марионеточного правительства в Гаване. Теперь они требуют передать Пуэрто-Рико. Требование нелепо, но, может быть, стоит отказаться от острова, чтобы сохранить нейтралитет и сосредоточиться на Европе и Азии?"
 hon.43.a:0 "Мы не можем рисковать войной; передать остров."
 hon.43.b:0 "Никогда! Мы и так слишком долго терпели это выскочку в Америке!"
 hon.44.t:0 "Уступки со стороны гринго"
 hon.44.d:0 "Гринго согласились на наши требования и передадут Пуэрто-Рико."
 hon.44.a:0 "До победы всегда!"
 hon.45.t:0 "Гринго отказываются!"
 hon.45.d:0 "Гринго отвергли наши требования. Они готовы отправить ещё больше солдат на смерть, лишь бы больше не умиротворять нашу революцию."
 hon.45.a:0 "Тогда пора раз и навсегда покончить с империализмом янки!"
 hon.46.t:0 "Карибская федерация требует Вест-Индию"
 hon.46.d:0 "Центральноамериканские революционеры попытались объединить Карибы под властью марионеточного правительства в Гаване. Теперь они требуют передать наши карибские владения. Требование нелепо, но, может быть, стоит отказаться от островов, чтобы сосредоточиться на европейских и азиатских проблемах?"
 hon.46.a:0 "Мы не можем рисковать войной; передать острова."
 hon.46.b:0 "Целостность [ENG.GetAdjective] империи жизненно важна! Отказать!"
 hon.47.t:0 "Уступки со стороны [ENG.GetAdjective] властей"
 hon.47.d:0 "[ENG.GetAdjective] сторона согласилась на наши требования и предпочла сосредоточиться на внутренних проблемах."
 hon.47.a:0 "До победы всегда!"
 hon.48.t:0 "[ENG.GetAdjective] сторона отказывается!"
 hon.48.d:0 "[ENG.GetAdjective] сторона отвергла наши требования. Она готова отправить ещё больше солдат на смерть, лишь бы не отдать часть империи."
 hon.48.a:0 "Тогда пора покончить с [ENG.GetAdjective] империей!"
 hon.49.t:0 "Карибская федерация требует Вест-Индию"
 hon.49.d:0 "Центральноамериканские революционеры попытались объединить Карибы под властью марионеточного правительства в Гаване. Теперь они требуют передать наши карибские владения. Требование нелепо, но, может быть, стоит отказаться от островов, чтобы сосредоточиться на европейских и азиатских проблемах?"
 hon.49.a:0 "Мы не можем рисковать войной; передать острова."
 hon.49.b:0 "Целостность [FRA.GetAdjective] империи жизненно важна! Отказать!"
 hon.50.t:0 "Уступки со стороны [FRA.GetAdjective] властей"
 hon.50.d:0 "[FRA.GetAdjective] сторона согласилась на наши требования и предпочла сосредоточиться на внутренних проблемах."
 hon.50.a:0 "До победы всегда!"
 hon.51.t:0 "[FRA.GetAdjective] сторона отказывается!"
 hon.51.d:0 "[FRA.GetAdjective] сторона отвергла наши требования. Она готова отправить ещё больше солдат на смерть, лишь бы не отдать часть империи."
 hon.51.a:0 "Тогда пора покончить с [FRA.GetAdjective] империей!"
 hon.52.t:0 "[HON.GetNameDefCap] предлагает мир"
 hon.52.d:0 "[HON.GetNameDefCap] предлагает мир в обмен на признание его контроля над Кюрасао."
 hon.52.a:0 "Этот остров не стоит жизней, которые потребуются для его возвращения."
 hon.52.b:0 "Мы не позволим им откусывать куски от нашей империи!"
 hon.53.t:0 "[HOL.GetNameDefCap] соглашается"
 hon.53.d:0 "[HOL.GetNameDefCap] приняло наше мирное предложение и передаст Кюрасао Карибской федерации. Мы одержали великую победу, а наши товарищи в Карибах стали ещё сильнее."
 hon.53.a:0 "Ура!"
 hon.54.t:0 "[HOL.GetNameDefCap] отказывается"
 hon.54.d:0 "[HOL.GetNameDefCap] отвергло наше мирное предложение и будет сражаться до полного уничтожения одной из сторон. [HOL.GetAdjective] сторона решила, что её карибские колонии стоят тотальной войны."
 hon.54.a:0 "Тогда встретимся в Амстердаме!"
 hon.55.t:0 "[HON.GetNameDefCap] предлагает мир"
 hon.55.d:0 "[HON.GetNameDefCap] предлагает мир в обмен на признание его контроля над Пуэрто-Рико."
 hon.55.a:0 "Я уже даже не помню, зачем мы вообще захватили Пуэрто-Рико."
 hon.55.b:0 "Война ещё не проиграна, и до Рождества мы победим."
 hon.56.t:0 "[USA.GetNameDefCap] соглашается"
 hon.56.d:0 "[USA.GetNameDefCap] приняло наше мирное предложение и передаст Пуэрто-Рико Карибской федерации. Мы одержали великую победу, а наши товарищи в Карибах стали ещё сильнее."
 hon.56.a:0 "Ура!"
 hon.57.t:0 "[USA.GetNameDefCap] отказывается"
 hon.57.d:0 "[USA.GetNameDefCap] отвергло наше мирное предложение и будет сражаться до полного уничтожения одной из сторон. [USA.GetAdjective] сторона решила, что Пуэрто-Рико стоит тотальной войны."
 hon.57.a:0 "Пора раз и навсегда покончить с империей янки!"
 hon.58.t:0 "[HON.GetNameDefCap] предлагает мир"
 hon.58.d:0 "[HON.GetNameDefCap] предлагает мир в обмен на признание его контроля над Вест-Индией."
 hon.58.a:0 "Вторгаться на эти острова слишком утомительно."
 hon.58.b:0 "Мы не позволим им откусывать куски от нашей империи!"
 hon.59.t:0 "[ENG.GetNameDefCap] соглашается"
 hon.59.d:0 "[ENG.GetNameDefCap] приняло наше мирное предложение и передаст бывшую Вест-Индию Карибской федерации. Мы одержали великую победу, а наши товарищи в Карибах стали ещё сильнее."
 hon.59.a:0 "Ура!"
 hon.60.t:0 "[ENG.GetNameDefCap] отказывается"
 hon.60.d:0 "[ENG.GetNameDefCap] отвергло наше мирное предложение и будет сражаться до полного уничтожения одной из сторон. [ENG.GetAdjective] сторона решила, что её карибские колонии стоят тотальной войны."
 hon.60.a:0 "Тогда Британия больше не будет править волнами!"
 hon.61.t:0 "[HON.GetNameDefCap] предлагает мир"
 hon.61.d:0 "[HON.GetNameDefCap] предлагает мир в обмен на признание его контроля над Вест-Индией."
 hon.61.a:0 "Вторгаться на эти острова слишком утомительно."
 hon.61.b:0 "Мы не позволим им откусывать куски от нашей империи!"
 hon.62.t:0 "[FRA.GetNameDefCap] соглашается"
 hon.62.d:0 "[FRA.GetNameDefCap] приняло наше мирное предложение и передаст бывшую Вест-Индию Карибской федерации. Мы одержали великую победу, а наши товарищи в Карибах стали ещё сильнее."
 hon.62.a:0 "Ура!"
 hon.63.t:0 "[FRA.GetNameDefCap] отказывается"
 hon.63.d:0 "[FRA.GetNameDefCap] отвергло наше мирное предложение и будет сражаться до полного уничтожения одной из сторон. [FRA.GetAdjective] сторона решила, что её карибские колонии стоят тотальной войны."
 hon.63.a:0 "Не могу поверить, что [FRA.GetAdjective] сторона на этот раз не капитулировала."
 hon.64.t:0 "Коронация Хуана I"
 hon.64.d:0 "После вступления нашего славного правителя Хуана I в Мадрид началась подготовка к коронации. Хуан I, сын свергнутого Альфонсо XIII, милостиво принял испанскую корону и будет править вице-королевством Новая Испания из Мадрида. Мы положили конец смуте в Испании и заложили основу для восстановления Испанской империи."
 hon.64.a:0 "Хуан может быть только один!"
 hon.65.t:0 "Вице-король Новой Испании"
 hon.65.d:0 "Теперь, когда Хуан I официально стал королём Испании, следует найти другого человека для управления вице-королевством Новая Испания. Подходящим кандидатом станет младший брат Хуана I — Хайме, герцог Сеговийский."
 hon.65.a:0 "Пусть всё останется в семье."
 hon.66.t:0 "[HON.GetNameDefCap] просит помощи"
 hon.66.d:0 "Кампесинос Гондураса свергли буржуазное правительство Тибурсио Кариаса и надеются распространить революцию по Латинской Америке. Они понимают, что шансы не в их пользу, и просят нашей помощи. Несколько партий оружия дадут им силы изгнать империалистов, а кампесинос могут стать ценными союзниками."
 hon.66.a:0 "Несколько единиц оружия им не повредят."
 hon.66.b:0 "Почему нас вообще должна волновать Центральная Америка?"
 hon.67.t:0 "[SOV.GetNameDefCap] поддерживает нас"
 hon.67.d:0 "Мы только что получили ответ от [SOV.GetNameDef] на просьбу о стрелковом оружии. Они согласились и отправят несколько тысяч винтовок, чтобы помочь распространить революцию. При поддержке [SOV.GetNameDef] вся Центральная Америка станет нашей."
 hon.67.a:0 "До победы всегда!"
 hon.68.t:0 "[SOV.GetNameDefCap] не поддержит нас"
 hon.68.d:0 "Мы только что получили ответ от [SOV.GetNameDef] на просьбу о стрелковом оружии. Нам сообщили, что эти винтовки нужны для вооружения собственной армии и защиты от угроз в Европе и Азии. Похоже, придётся справляться самим."
 hon.68.a:0 "Хорошо! Сделаем собственное оружие!"
 hon.69.t:0 "Хуан отказывается от прав на престол"
 hon.69.d:0 "Хуан III официально отказался от притязаний на испанский престол, ещё больше укрепив легитимность нашего монарха."
 hon.69.a:0 "Превосходно."
 hon.70.t:0 "Ответ из Мадрида"
 hon.70.desc:0 "Узнав о нашем отказе от притязаний, король Испании прислал дары и официально назначил нас вице-королём Новой Испании. Пусть никто не сомневается в нашей законности, а также в законности вице-королевства и его администрации."
 hon.70.a:0 "Превосходно."
 hon.71.t:0 "Новая Испания просит военных советников"
 hon.71.desc:0 "Наши друзья из Новой Испании попросили направить нескольких офицеров в качестве военных советников."
 hon.71.a:0 "Разумеется; всё ради колоний."
 hon.71.b:0 "К сожалению, мы не можем выделить ни одного офицера."
 hon.72.t:0 "Испания направила советников"
 hon.72.desc:0 "Испанская корона направила военных советников для помощи нашему верховному командованию."
 hon.72.a:0 "Мы знали, что на них можно положиться."
 hon.73.t:0 "Испания не направила советников"
 hon.73.desc:0 "Испанская корона отказалась направить нам военных советников."
 hon.73.a:0 "Прискорбно."
 hon.74.t:0 "[HON.GetNameDefCap] просит инвестиций"
 hon.74.desc:0 "На фоне недавнего подъёма коммунизма в Гондурасе наши товарищи из Центральной Америки попросили помочь им в борьбе против нелегитимного, поддерживаемого Америкой режима [HON.GetLeader]."
 hon.74.a:0 "За рабочих и революцию!"
 hon.74.b:0 "У нас есть более неотложные дела."
 hon.75.t:0 "[SOV.GetNameDefCap] принимает нашу просьбу об инвестициях"
 hon.75.desc:0 "Наша недавняя просьба о помощи к [SOV.GetNameDef] была удовлетворена!"
 hon.75.a:0 "Революция распространяется!"
 hon.76.t:0 "[SOV.GetNameDefCap] отклоняет нашу просьбу об инвестициях"
 hon.76.desc:0 "Наша недавняя просьба о помощи к [SOV.GetNameDef] была отклонена."
 hon.76.a:0 "Попытаться стоило."
 hon.77.t:0 "[311.GetName] освобождён!"
 hon.77.desc:0 "Наша стычка с оккупантами в [311.GetName] завершилась победой и последующим освобождением территории от иностранного господства."
 hon.77.a:0 "Ещё одна победа революции."
 hon.78.t:0 "Поражение!"
 hon.78.desc:0 "Сражение в [311.GetName] завершилось уничтожением наших сил и вынудило нас отступить."
 hon.78.a:0 "Мы ещё вернёмся."
 hon.79.t:0 "Ничья!"
 hon.79.desc:0 "После тяжёлого сражения столкновения завершились ничьей."
 hon.79.a:0 "Я не проиграл! Я просто не смог победить."
 hon.80.t:0 "Победа над [HON.GetNameDef]"
 hon.80.desc:0 "Недавно [HON.GetNameDef] попыталось захватить нашу территорию в Центральной Америке. Однако благодаря превосходству наших сил нам удалось отбросить их и сохранить контроль над регионом."
 hon.80.a:0 "Глупцы."
 hon.81.t:0 "Победа у [685.GetName]"
 hon.81.desc:0 "Попытка захватить канал увенчалась успехом. Теперь мы контролируем один из важнейших торговых путей мира. Возможно, это даст нам новые рычаги давления..."
 hon.81.a:0 "Ещё один шаг к изгнанию империалистов."
 hon.82.t:0 "[HON.GetAdjective] войска у [311.GetName]"
 hon.82.desc:0 "Недавно [HON.GetNameDef] сосредоточило множество войск у нашей границы в [313.GetName]. Это акт агрессии, и мы должны быть готовы ко всему!"
 hon.82.a:0 "Они играют с огнём."
 hon.83.t:0 "[HON.GetAdjective] войска у [685.GetName]"
 hon.83.desc:0 "Новое [HON.GetAdjective] правительство уже некоторое время присматривается к нашей территории в Панаме, и, похоже, теперь готовится захватить канал."
 hon.83.a:0 "Они играют с огнём."
 HON_adds_coastal_forts_tt:0 "Добавляет §Hбереговые укрепления 2-го уровня§! вдоль контролируемого побережья:"
 banana_decisions:0 "Корпоративная дипломатия"
 honpeace_decisions:0 "Предложить мир"
 honlib_decisions:0 "Освобождение"
 honspanishempire_decisions:0 "Реставрация"
 honresources_decisions:0 "Инвестировать в добычу ресурсов"
 hongrabstuff_decisions:0 "Англосаксы отвлечены"
 HON_bboat_diplomacy:0 "Дипломатия банановозов"
 HON_bboat_diplomacy_desc:0 "Отправить часть наших банановозов за границу в обмен на промышленные материалы.\n"
 HON_corporate_raj:0 "Организовать корпоративный переворот в [RAJ.GetNameDef]"
 HON_corporate_raj_desc:0 "Проникнув в [RAJ.GetAdjective] экономику и подкупив [ENG.GetAdjective] колониальных администраторов, мы получили достаточно поддержки для попытки переворота в [RAJ.GetNameDef] и установления дружественного корпоративного правительства. Это будет непросто, и ради успеха придётся отправить часть наёмников. Тем не менее перед нами прекрасная возможность устранить крупнейшего конкурента.\n"
 HON_team_building:0 "Провести командообразующее мероприятие"
 HON_team_building_desc:0 "Руководство заметило слишком много понурых плеч в офисе и придумало новаторский способ поднять корпоративный дух. Мы можем вывезти сотрудников на совместное мероприятие, где они лучше узнают друг друга и сблизятся благодаря общей любви к компании «Юнайтед Фрут». Участие и веселье, разумеется, обязательны.\n"
 HON_raj_puppet:0 "Взять Индию под контроль"
 HON_raj_puppet_desc:0 "Наш переворот в Индии завершился оглушительным успехом, а новое независимое индийское правительство полностью лояльно компании «Юнайтед Фрут». Закрепим это официально, превратив Индию в дочернюю структуру компании.\n"
 HON_consolidate_colecu:0 "Включить новые активы"
 HON_consolidate_colecu_desc:0 "Теперь, когда компания «Юнайтед Фрут» полностью контролирует активы в Колумбии и Эквадоре, их можно окончательно включить в состав предприятия. Местные жители вряд ли будут довольны, зато акционеры получат значительную выгоду.\n"
 HON_panamapeace:0 "Мир за Панамский канал"
 HON_panamapeace_desc:0 "Если мы отразим [USA.GetAdjective] вторжения и достаточно долго удержим Панамский канал, [USA.GetNameDef] может признать наше право собственности.\n"
 HON_belizepeace:0 "Мир за Белиз"
 HON_belizepeace_desc:0 "Если мы отразим [ENG.GetADjective] вторжения и достаточно долго удержим Белиз, [ENG.GetNameDef] может признать наше право собственности.\n"
 HON_curcaopeace:0 "Мир за Кюрасао"
 HON_curcaopeace_desc:0 "Если мы отразим [HOL.GetAdjective] вторжения и достаточно долго удержим Кюрасао, [HOL.GetAdjective] сторона может признать наше право на остров.\n"
 HON_puertopeace:0 "Мир за Пуэрто-Рико"
 HON_puertopeace_desc:0 "Если мы отразим [USA.GetAdjective] вторжения и достаточно долго удержим Пуэрто-Рико, [USA.GetAdjective] сторона может признать наше право на остров.\n"
 HON_engindiespeace:0 "Мир за Британскую Вест-Индию"
 HON_engindiespeace_desc:0 "Если мы отразим [ENG.GetAdjective] вторжения и достаточно долго удержим их карибские острова, [ENG.GetAdjective] сторона может признать наше господство в Карибском море.\n"
 HON_fraindiespeace:0 "Мир за Французскую Вест-Индию"
 HON_fraindiespeace_desc:0 "Если мы отразим [FRA.GetAdjective] вторжения и достаточно долго удержим их карибские острова, [FRA.GetAdjective] сторона может признать наше господство в Карибском море.\n"
 HON_libven:0 "Передать Венесуэлу"
 HON_libven_desc:0 "Теперь, когда Венесуэла освобождена от буржуазных угнетателей, можно передать её территории друзьям в Колумбии, чтобы они провозгласили Великую Колумбию.\n"
 HON_libecu:0 "Передать Эквадор"
 HON_libecu_desc:0 "Теперь, когда Эквадор освобождён от буржуазных угнетателей, можно передать его территории друзьям в Колумбии, чтобы они провозгласили Великую Колумбию.\n"
 HON_libgranperu:0 "Потребовать юг Великой Колумбии"
 HON_libgranperu_desc:0 "Великая Колумбия воссоединена, а наследие Боливара восстановлено. Однако [PRU.GetNameDef] всё ещё удерживает её южные территории, и новый союзник не будет в безопасности, пока эти земли не возвращены. Потребуем от [PRU.GetNameDef] передать законные земли Великой Колумбии.\n"
 HON_libhai:0 "Объединить Эспаньолу"
 HON_libhai_desc:0 "Теперь, когда Гаити освобождено от буржуазных угнетателей, можно передать его территорию нашим друзьям в [DOM.GetNameDef] и раз и навсегда объединить остров Эспаньола!"
 HON_libnedisles:0 "Потребовать Нидерландские Карибы"
 HON_libnedisles_desc:0 "Карибская федерация создана, и теперь мы можем освободить Нидерландскую Вест-Индию от колониальных угнетателей. Потребуем их карибские владения и посмотрим на реакцию. Если они уже капитулировали перед другой страной, то, вероятно, отдадут острова без боя.\n"
 HON_libusaisles:0 "Потребовать Пуэрто-Рико"
 HON_libengisles:0 "Потребовать Британскую Вест-Индию"
 HON_libengisles_desc:0 "Карибская федерация создана, и теперь мы можем освободить Британскую Вест-Индию от колониальных угнетателей. Потребуем их карибские владения и посмотрим на реакцию. Если они уже капитулировали перед другой страной, то, вероятно, отдадут острова без боя.\n"
 HON_libfraisles:0 "Потребовать Французские Карибы"
 HON_libfraisles_desc:0 "Карибская федерация создана, и теперь мы можем освободить Французскую Вест-Индию от колониальных угнетателей. Потребуем их карибские владения и посмотрим на реакцию. Если они уже капитулировали перед другой страной, то, вероятно, отдадут острова без боя.\n"
 HON_form_the_west_indies_federation:0 "Создать Демократическую Республику Вест-Индия"
 HON_establish_west_indies_federation_tt:0 "§YВест-Индия будет освобождена как марионеточное государство§!"
 HON_give_curacao_to_venezuela:0 "Передать [695.GetName] Венесуэле"
 HON_give_guantanamo_to_cuba:0 "Передать [1050.GetName] Кубе"
 HON_newspain:0 "Занять испанский престол"
 HON_newspain_desc:0 "Наш славный король успешно освободил Испанию и вернул монархии подобающее положение. Теперь пора короновать Хуана I и перенести столицу обратно в Мадрид."
 HON_new_north:0 "Реинтегрировать северные территории"
 HON_new_north_desc:0 "Мы одержали славную победу над гринго, и земли, украденные ими во время Американо-мексиканской войны, вновь принадлежат нам. Теперь можно вернуть давно утраченные регионы в состав вице-королевства. Хотя прежде эти земли были захолустьем Новой Испании, теперь они могут стать жемчужиной восстановленной империи!\n"
 HON_develop_mexoil:0 "Мексиканская нефть"
 HON_develop_mexoil_desc:0 "Мексика уже несколько лет экспортирует нефть, но пора направить больше ресурсов на наши нужды. Расширим нефтедобычу в Мексике, чтобы обеспечить страну топливом.\n"
 HON_develop_panoil:0 "Бурение в Панаме"
 HON_develop_panoil_desc:0 "Сейчас в Панаме действует крошечное нефтяное месторождение, но армии требуется гораздо больше топлива. Вложимся в добычу и обеспечим стабильное снабжение нефтью.\n"
 HON_develop_aluminium:0 "Производить алюминий в Коста-Рике"
 HON_develop_aluminium_desc:0 "Хотя в Коста-Рике есть залежи алюминия, их переработка почти никого не интересовала. Однако военно-воздушным силам остро нужен этот металл, и строительство алюминиевого завода должно обеспечить новые авиадивизии необходимым сырьём.\n"
 HON_develop_rubber:0 "Субсидировать каучуковые плантации"
 HON_develop_rubber_desc:0 "Климат Центральной Америки идеально подходит для выращивания каучуконосов, но до сих пор никто не проявлял интереса к созданию плантаций. Теперь армии нужен каучук, поэтому разумно вложить государственные средства в их развитие внутри наших границ.\n"
 HON_develop_tungsten:0 "Добывать вольфрам в Сальвадоре"
 HON_develop_tungsten_desc:0 "Разведчики сообщили о небольших запасах вольфрама в Сальвадоре. Если найти и разработать месторождения, этого хватит для снабжения армии.\n"
 HON_develop_steel:0 "Гватемальская металлургия"
 HON_develop_steel_desc:0 "В Гватемале есть железные рудники, но большая часть руды отправляется на переплавку за границу. Построив несколько металлургических предприятий, мы обеспечим страну стабильными поставками стали.\n"
 HON_develop_chromium:0 "Расширить добычу хрома в Гондурасе"
 HON_develop_chromium_desc:0 "Хотя в Гондурасе существует небольшая горнодобывающая отрасль, она всегда уступала место сельскому хозяйству. Следует выделить государственные средства на её расширение, чтобы меньше зависеть от импорта минералов.\n"
 HON_seize_belize:0 "Отнять Белиз у [ENG.GetAdjective] стороны"
 HON_seize_belize_desc:0 "Белиз является колонией [ENG.GetNameDef], а его крестьяне взывают к освобождению. Обычно нападение на [ENG.GetNameDef] было бы немыслимо, но англосаксы ведут войну, которую могут проиграть. Поскольку Белиз не имеет решающего значения для [ENG.GetAdjective] военных усилий, возможно, его удастся забрать без лишнего шума. Однако они наверняка объявят войну, если ценят Белиз выше, чем мы думаем.\n"
 HON_seize_canal:0 "Захватить Панамский канал"
 HON_seize_canal_desc:0 "Панамский канал играет центральную роль в судоходстве обеих Америк, а [USA.GetADjective] контроль даёт гринго значительное экономическое преимущество. Однако [USA.GetNameDef] сейчас воюет, и мы можем захватить канал, пока они отвлечены.\n"
 HON_solidarity_march:0 "Провести марш солидарности кампесинос"
 HON_solidarity_march_desc:0 "Хотя наше дело справедливо, многие товарищи страдают от низкого боевого духа. Напомним им, за что они сражаются, призвав кампесинос выйти на улицы и продемонстрировать любовь к революции.\n"
 HON_royal_parade:0 "Организовать монархический парад"
 HON_royal_parade_desc:0 "Многие подданные забыли о славе старой Испанской империи и вице-королевства Новая Испания. Поддержим монархические настроения, устроив парад в столице. Участники пройдут в костюмах эпохи Золотого века и вспомнят радость и счастье, принесённые конкистадорами Латинской Америке.\n"
 HON_core_guat:0 "Интегрировать Гватемалу"
 HON_core_guat_desc:0 "После захвата Гватемалы в спонтанной войне необходимо включить её в состав нашего растущего центральноамериканского государства.\n"
 HON_core_salvador:0 "Интегрировать Сальвадор"
 HON_core_salvador_desc:0 "После захвата Сальвадора в спонтанной войне необходимо включить его в состав нашего растущего центральноамериканского государства.\n"
 HON_core_nicaragua:0 "Интегрировать Никарагуа"
 HON_core_nicaragua_desc:0 "После захвата Никарагуа в спонтанной войне необходимо включить её в состав нашего растущего центральноамериканского государства.\n"
 HON_core_costarica:0 "Интегрировать Коста-Рику"
 HON_core_costarica_desc:0 "После захвата Коста-Рики в спонтанной войне необходимо включить её в состав нашего растущего центральноамериканского государства.\n"
 HON_core_panama:0 "Интегрировать Панаму"
 HON_core_panama_desc:0 "После захвата Панамы в спонтанной войне необходимо включить её в состав нашего растущего центральноамериканского государства.\n"
