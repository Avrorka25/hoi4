 r56_ELS_coffee_republic:0 "Кофейная республика"
 r56_ELS_coffee_republic_desc:0 "Кофе впервые начали выращивать в Сальвадоре для внутреннего потребления в начале XIX века. К середине столетия его торговый потенциал стал очевиден, и были посеяны семена будущей «Кофейной республики». В конце XIX века торговлю кофе монополизировали, что усилило неравенство между рабочим классом и элитами — так называемыми «Четырнадцатью семьями», которые в определённый момент владели почти 90% всей земли страны и оказывали огромное влияние на внутреннюю и внешнюю политику. Всего четыре года назад казалось, что ситуация достигла предела: крестьяне были недовольны низкой оплатой и ухудшением условий жизни, обвиняя землевладельческую элиту. В январе 1932 года они подняли восстание, вошедшее в историю как «Ла Матанса». Хотя военный режим жестоко подавил его, дух сопротивления элитам продолжает жить в сердцах и умах многих сальвадорцев..."
