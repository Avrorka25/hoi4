 SIA_Pao_Pienlert_Boripanyutakit:0 "Пао Пиенлерт Борипанъютхакит"
 SIA_Luang_Chuangsakram:0 "Луанг Чуангсакрам"
 SIA_phraya_ritthiakhaney:0 "Пхрая Риттхиакханей"
 SIA_plaek_phibunsongkhram:0 "Плек Пибунсонгкхрам"
 SIA_luang_supachalasai:0 "Луанг Супхачаласай"
 SIA_luang_chamnanyutthasin:0 "Луанг Чамнанъюттхасин"
 SIA_luang_chawengsaksongkhram:0 "Луанг Чавенгсаксонгкхрам"
 SIA_luang_nawawichit:0 "Луанг Нававичит"
 SIA_luang_sangworayutthakit:0 "Луанг Сангвораюттхакит"
 SIA_chalit_kunkamthon:0 "Чалит Кункамтхон"
 SIA_khun_wimonsorakit:0 "Кхун Вимонсоракит"
 SIA_chai_prathipasen:0 "Чай Пратхипасен"
 SIA_France_war_in_indochina:0 "Война в Индокитае"
 SIA_France_restore_order_in_indochina:0 "Восстановить порядок"
 SIA_France_restore_order_in_indochina_desc:0 "В Индокитае вспыхнуло масштабное коммунистическое восстание, желавшее изгнать французскую администрацию. Они хорошо вооружены и пользуются поддержкой Сиама. Мы должны восстановить контроль над нашими колониями."
 SIA_revolutionnary_women:0 "Революционные женщины"
 SIA_revolutionnary_women_desc:0 "Конец капитализма должен также означать конец маргинализации женщин. Последние должны быть поставлены наравне с людьми, будь то дома, на фабриках или в армии."
