 SIA_generic_motorized_equipment_manufacturer:0 "Шайсери"
 SIA_rama_viii:0 "Рама VIII"
 SIA_rama_viii_desc:0 "После революции 1932 года король Рама VII отрекся от престола под давлением квазидемократического правительства. Его преемник Рама VIII все еще молод и учится за границей, и в результате роль Короля Римской империи. [ROOT.GetNonIdeologyName] Она впала в политическую безвестность. Понадобится сильный монарх, чтобы восстановить прежний престиж титула."
 absent_monarch:0 "Отсутствующий монарх"
 SIA_fascism_party:0 "Хана Рацадон (М-Р)"
 SIA_fascism_party_long:0 "Хана Рацадон (военные радикалы)"
 SIA_democratic_party:0 "Кхана Ратсадон (Г)"
 SIA_democratic_party_long:0 "Хана Рацадон (гражданская)"
 SIA_communism_party:0 "ПСС"
 SIA_communism_party_long:0 "Коммунистическая партия Сиама"
 SIA_peaceful_pan_thaiism_category:0 "Мирный пантайизм"
 SIA_peaceful_pan_thaiism_category_desc:0 "Различные тайские народы, разбросанные между штатами Сиам, Лаос и Камбоджа, были разделены после колониальных войн. Теперь, когда каждое из трех государств обрело какую-то независимость, должны быть предприняты большие усилия, чтобы убедить население в том, что объединение наших трех наций необходимо для блага нашего народа.\n\nПопулярность пан-тайизма в Лаосе: §Y[?SIA.laos_pan_thai_popularity]%§!\n\nПопулярность пан-тайизма в Камбодже: §Y[?SIA.cambodia_pan_thai_popularity]%§!"
 SIA_hold_a_pan_thai_exposition:0 "Проведите пантайскую выставку §G+7% для всех"
 SIA_glorify_thai_culture:0 "Прославляйте тайскую культуру §G+5% для всех"
 SIA_support_pan_thaiists_in_laos:0 "Поддержка пан-тайцев в Лаосе §G+5%§! В Лаосе"
 SIA_support_pan_thaiists_in_cambodia:0 "Поддержка пан-тайцев в Камбодже §G+5%§! в Камбодже"
 SIA_treaty_of_vientiane:0 "Вьентьянский договор"
 hundred_percent_in_all_thai_nations:0 "§R100% популярности пантаиизма в Лаосе и Камбодже§!"
 SIA_tooltip_treaty_of_vientiane:0 "§YВы присоедините все три тайские нации и получите ядра на их землях.§!"
 SIA_disturbing_indochina_decision:0 "Тревожный Индокитай"
 SIA_disturbing_indochina_decision_desc:0 "Наши индокитайские товарищи продолжают страдать под игом французских колонистов. Они нуждаются в нашей помощи, и мы здесь для них! Как только они будут достаточно подготовлены, мы сможем начать окончательное восстание, которое освободит Индокитай от империалистического контроля!\n\nАгитация во Вьетнаме: §Y[?SIA.vietnam_agitation]%§!\n\nАгитация в Лаосе: §Y[?SIA.laos_agitation]%§!\n\nАгитация в Камбодже: §Y[?SIA.cambodia_agitation]%§!"
 SIA_smuggle_weapons_in_vietnam:0 "Контрабанда оружия во Вьетнаме:\n§RАгитация во Вьетнаме +10%§!"
 SIA_smuggle_weapons_in_laos:0 "Контрабанда оружия в Лаосе:\n§RАгитация +10% в Лаосе§!"
 SIA_smuggle_weapons_in_cambodia:0 "Контрабанда оружия в Камбодже:\n§RАгитация в Камбодже +10%§!"
 SIA_launch_the_insurrection:0 "Запустите восстание!"
 SIA_sabotage_campaign:0 "Саботажная кампания:\n§R+8% Агитация повсюду§!"
 SIA_ask_for_soviet_help:0 "Попросите советскую помощь:\n§RЗависит от их реакции§!"
 SIA_invade_indochina:0 "Вторжение в Индокитай:\n§RВойна с Францией!§!"
 SIA_join_the_allies:0 "Вступить в Союзники"
 SIA_join_the_allies_desc:0 "Великобритания является одной из доминирующих держав в мире, и в прошлом было много войн между нашими двумя странами за главным образом бирманские территории. Но по мере появления новых угроз, таких как японская империя, в наших интересах было бы искать военный союз с ними, по крайней мере до тех пор, пока такие опасности, как фашизм, не будут преодолены."
 SIA_woo_australia:0 "Вау, Австралия"
 SIA_woo_australia_desc:0 "Австралия, недавно получившая независимость от Великобритании, основала собственный военный альянс, в основном ориентированный на Тихий океан, чтобы сдержать японскую угрозу. Подписание с ними договора о союзе могло бы позволить нам быть в безопасности."
 SIA_treaty_with_japan:0 "Договор с Японией"
 SIA_treaty_with_japan_desc:0 "В Японии было создано новое правительство, демократическое и выступающее против экспансионизма. Теперь, когда они больше не представляют угрозы, мы должны подписать с ними союзный договор, чтобы защитить друг друга от новых угроз, которые могут возникнуть."
 SIA_alliance_with_china:0 "Альянс с Китаем"
 SIA_alliance_with_china_desc:0 "Китайское правительство, недавно разгромив японскую империю, решило создать свой собственный альянс, в основном ориентированный на Азию. В наших интересах объединить усилия с этой развивающейся державой."
 SIA_ally_with_the_united_states:0 "Союзник с США"
 SIA_ally_with_the_united_states_desc:0 "Соединенные Штаты являются главным защитником идеалов свободы и демократии, и они решили создать свой собственный политический альянс. Им лучше всего противостоять японскому империализму, поэтому было бы разумно договориться о вступлении в их союз."
 SIA_help_france:0 "Помогите Франции"
 SIA_help_france_desc:0 "Правда, Франция была одним из наших главных расчленителей во время колонизации Индокитая. Но сегодня на горизонте гораздо более серьезные опасности. Мы уладим наши территориальные разногласия позже, сейчас самое время защищать наши народы."
 SIA_join_the_axis:0 "Присоединяйтесь к оси"
 SIA_join_the_axis_desc:0 "Германия перевооружилась и, похоже, готова бороться с бывшими державами Антанты. Наши цели являются общими, поэтому в наших интересах объединить усилия с ними."
 SIA_treaty_with_italy:0 "Договор с Италией"
 SIA_treaty_with_italy_desc:0 "Италия, страна происхождения фашизма, является моделью, на которой мы строим нашу новую нацию. Последняя решила сформировать свой военный альянс, и было бы интересно стремиться к его интеграции."
 SIA_alliance_with_japan:0 "Альянс с Японией"
 SIA_alliance_with_japan_desc:0 "Япония является главной державой в Азии и, похоже, намерена противостоять западным империалистам. Наши цели одинаковы, мы должны объединить усилия с ними."
 SIA_alliance_with_japan_monarchist:0 "Ищите японскую защиту"
 SIA_alliance_with_japan_monarchist_desc:0 "Японская империя продолжает расширять свое влияние по всей Азии, противостоя западным державам. Если мы не хотим оказаться под их игом, то лучше подписать союзный договор."
 SIA_alliance_with_britain_monarchist:0 "Альянс с Соединенным Королевством"
 SIA_alliance_with_britain_monarchist_desc:0 "Ясно, что японская империя хочет только господства над Азией и намерена однажды напасть на нашу страну. Единственный способ избежать этого - это вступить в союз с Соединенным Королевством и надеяться, что мы сможем победить его."
 SIA_join_the_communist_faction:0 "Присоединяйся [FROM.getFactionName]"
 SIA_join_the_communist_faction_desc:0 "[FROM.getNameDefCap] Считается одной из главных коммунистических держав в мире. Если мы хотим, чтобы революция победила, мы должны объединиться."
 SIA_reintegrate_cambodia:0 "Реинтеграция Камбоджи"
 SIA_reintegrate_cambodia_desc:0 "В течение нескольких столетий Камбоджа находилась под нашим контролем, и наши два народа имеют много общих корней. Теперь, когда мы снова обладаем этим регионом, пришло время реорганизовать их администрацию, чтобы сделать его провинцией нашей страны."
 SIA_reintegrate_laos:0 "Реинтеграция Лаоса"
 SIA_reintegrate_laos_desc:0 "Лаос вернулся под наш контроль. Лаосцы имеют те же тайские корни, что и наш народ, и пришло время полностью интегрировать их в нашу страну."
 siam.1.t:0 "Речь Нонтхабури"
 siam.1.d:0 "Приди Баномёнг, член гражданского крыла Ханы Рацадона, известный своими радикальными идеями, иногда близкими к марксизму, земельных реформ, выступил сегодня с речью в городе Нонтхабури.\nДорогие жители Сиама, наша славная революция, которая сделала нас переходом от декадентской и устаревшей политической системы к системе, в которой люди наконец-то имеют свой голос, кажется, проходит сегодня испытание. Я сам заметил, что в той же партии, из которой я прихожу, некоторые элементы хотели бы установить свою собственную форму тирании, с той разницей, что короля и дворян заменят генералы и солдаты. Но я верю в сиамский народ, который никогда не допустит такого. Мы победили тиранию один раз, мы победим ее снова».\nМногие считают, что речь шла о Прайе Фахонфонфаюхасене, который стал премьер-министром после государственного переворота против бывшего премьер-министра Прайи Манопакорна Нититады, с которым Приди был близок, но которого обвинили в коммунизме из-за его планов реформ. Никто не знает, будет ли эта речь иметь влияние или нет, но нам придется следить за Приди."
 siam.1.a:0 "Какой вред может нанести простой учитель?"
 siam.2.t:0 "Радио Серифаф"
 siam.2.d:0 "Похоже, что Свободному Таиланду удалось взять под контроль радиостанцию на севере страны, где они имеют наибольший контроль. Они используют его для трансляции своего собственного радио «Радио Серифаф», означающего «Свобода радио», с яростными атаками на режим, а также призывом каждый раз присоединяться к ним. Некоторые из их передач также связаны с дебатами о том, как Сиам должен быть реорганизован после поражения правительства, где существует явный раскол между либералами и коммунистами, которые, похоже, равны в членстве в повстанцах."
 siam.2.a:0 "Заткнись!"
 siam.3.t:0 "Приглашение Хо Ши Мина"
 siam.3.d:0 "С начала процесса разработки новой конституции Сиама некоторые члены временного правительства выразили восхищение человеком Хо-Чи-Минха, известного вьетнамского революционера, чья борьба за независимость Вьетнама многократно сравнивалась с борьбой против Ханы Рацадон. Многие выразили желание получить совет от того, кто считается величайшим и мудрейшим индокитайского революционера.\nОднако более умеренные члены выразили недоверие, ссылаясь на связь между Хо и коммунизмом, и опасаясь, что визит с его стороны приведёт к тому, что большая часть правительства и населения захотят принять революцию по образцу большевиков."
 siam.3.a:0 "Добро пожаловать, дядя Хо!"
 siam.3.b:0 "Мы не можем рисковать его присутствием"
 siam.4.t:0 "Красный марш"
 siam.4.d:0 "Казалось бы, простого перехода к парламентской системе недостаточно. Хотя это должен был быть еще один понедельник, Коммунистическая партия Сиама выступила с гигантским призывом к восстанию против капитализма, поощряя жителей самостоятельно захватывать средства производства. Приди Фонмайонг, ставший с тех пор главным мыслителем Коммунистической партии, выступил с большой речью перед толпой, заявив, что Сиам теперь принадлежит рабочим.\nСени Прамой, видя масштабы протестов, но отказавшись следовать коммунистической системе, был вынужден уйти в отставку, и говорят, что он взял самолет с семьей в США. Фонмайонг заявил о создании Коммунистической партии Сиама и объявил о создании новой политической системы. \"Больше подходит для нашей революции\""
 siam.4.a:0 "Да здравствует революция!"
 siam.5.t:0 "Декларация Республики"
 siam.5.d:0 "Глава Временного правительства Дирек Джаянама обратился сегодня к толпе в Бангкоке, собравшейся для участия в его первой речи в качестве главы правительства.\n\"Люди Сиама, кровь многих из ваших братьев должна была течь так, чтобы остальные могли жить в мире и жить свободно. Именно за свободу они сражались и приносили себя в жертву, и именно за эти ценности мы будем их уважать. Народ Сиама, свобода восторжествовала над тьмой тирании, и я с гордостью объявляю, что мы построим республику, основанную на наших ценностях, за которые мы доказали наше мужество.\"."
 siam.5.a:0 "Да здравствует республика!"
 siam.6.t:0 "На склад оружия напали!"
 siam.6.d:0 "В течение ночи один из наших главных складов оружия, расположенный недалеко от Бангкока, был атакован повстанцами, идентифицированными как принадлежащие Свободным Тайцам. Похоже, что большинство охранников были убиты незаметно, так как тревога никогда не срабатывала, что также подразумевало, что среди охранников должен был быть союзник. Склад был полностью опустошен, взяв с собой винтовку и боеприпасы."
 siam.6.a:0 "Это не сулит ничего хорошего..."
 siam.7.t:0 "Письмо от Pridi"
 siam.7.d:0 "Один из армейских генералов отправился к премьер-министру Фоту Фахониотину, чтобы рассказать ему о своих опасениях по поводу возможного проникновения в армию антиправительственных революционеров. Он утверждает, что нашел в одном из общежитий сообщение, написанное Приди Баномёнгом. Это послание побуждало солдат мирно противостоять правительству, объявляя их отказ командовать тем, что они называют «адаптацией фашизма».\nГенерал предложил использовать это письмо в качестве оправдания для ареста Приди Баномёна за разжигание беспорядков и попытаться предотвратить распространение идей бунта."
 siam.7.a:0 "Мы покажем ему, что мы делаем с псевдореволюционерами!"
 siam.8.t:0 "Сахрейский инцидент"
 siam.8.d:0 "Прошлой ночью полицейский участок в деревне в северо-восточном районе Сахраи подвергся нападению банды из десяти вооруженных мужчин. Двое полицейских, присутствовавших на месте происшествия, по-видимому, исчезли, были убиты или похищены, а нападавшие покинули место происшествия через несколько минут, по словам свидетеля, которого удалось не увидеть. Он рассказал, что слышал, как один из мужчин жаловался на отсутствие официальной радиостанции.\nНовость об этом нападении вызвала много реакций в правительстве, некоторые думали, что они могли быть вдохновлены призывом Приди Баномёна к сопротивлению, который власти всё ещё ищут, но который остаётся неучтенным. Ходят слухи о том, что создается обширная сеть сопротивления, и Прайя Фахонфонфаюхасена объявил о своем намерении увеличить число сотрудников полиции в регионе."
 siam.8.a:0 "Надеюсь, это был всего лишь изолированный акт."
 siam.9.t:0 "Свободные тайцы"
 siam.9.d:0 "Хотя это должно было быть только один день, как и любой другой, по военному радио можно было услышать очень особое сообщение:\n\"Мы - Свободное Тайское Движение. Солдаты Ханы Ратсадон — предатели, которые использовали революцию для того, чтобы вместо царской тирании восторжествовала их собственная тирания. Мы хотим принести справедливость и демократию в нашу страну, и мы не будем колебаться, чтобы наконец дать сиамскому народу свободу. Если вы союзник правительства, то вы наш враг. Если вы против, то вы наш союзник. Мы не хотим навредить ни одному невинному народу, но хотим помешать нашей прекрасной нации попасть в ловушку фашизма. Мы видели, что произошло в Италии, Германии или Венгрии. Властвуют террор, ненависть, фанатизм и отчаяние. Мы хотим избежать этой участи для нашей прекрасной страны и построить новое правительство, которое действовало бы с намерением удовлетворить потребности народа, ибо мы — народ».\nГолос был услышан не кем иным, как голосом Дирека Джаянамы, другого бывшего члена гражданского крыла Ханы Рацадона, который стал одним из главных критиков охоты на Приди Баномёна. Похоже, что он решил присоединиться к последнему в попытке свергнуть правительство посредством масштабного восстания. В настоящее время мы не знаем об их количестве, и, похоже, они в основном прячутся на северо-востоке страны, что затрудняет их выслеживание."
 siam.9.a:0 "И мы будем вести против них войну!"
 siam.10.t:0 "Восстание Дибабхи"
 siam.10.d:0 "То, что должно было быть простым восстанием, превратилось в настоящий бунт. Объявив, что он нашел письмо премьер-министра нескольким членам Ханы Рацадон, в котором указывалось на его амбиции отменить монархию в ближайшие месяцы, принц Адитья Дибабха, который был регентом от имени Рамы VIII, обратился с большим призывом к восстанию ко всем, кто все еще верен королю. Многие думали, что он будет подавлен так же, как восстание принца Боурадета в 1933 году, которое потерпело неудачу, потому что бангкокские гарнизоны отказались присоединиться к нему.\nНо на этот раз это было не так. Гарнизон сразу же уехал, чтобы присоединиться к повстанцам, которые смогли взять под контроль Бангкок в течение нескольких часов.\nГлавные члены бывшего правительства, в частности Прайя Фахонфонпхойхасена, премьер-министр и Плаек Фибунсонгхрам, были арестованы и ожидают суда, а принц объявил об отмене Конституции 1932 года и о своем намерении восстановить Раму VII как короля Сиама, объявив его отречение недействительным из-за военного давления."
 siam.10.a:0 "Коррумпированное правительство было побеждено."
 SIA_provisional_monarchist_governement_party:0 "Временное монархическое правительство"
 SIA_provisional_monarchist_governement_party_long:0 "Временное монархическое правительство"
 siam.11.t:0 "Битва за Бангкок"
 siam.11.d:0 "Началась последняя битва против режима. После «Декларации восстания», изданной самим Приди Баномёнгом всем свободным тайцам с Радио Серифаф, подавляющее большинство повстанцев сошлись на Бангкоке, надеясь взять под контроль правительственные органы. Две трети ополченцев напали на город с севера, а остальные прибыли с востока, причем небольшая группа, по-видимому, пыталась атаковать из портов с помощью лодок, полученных в результате мятежа военно-морского флота. Между тем, лояльная правительству армия во главе с Плаеком Фибунсонгхрамом развернулась в городе, где до дальнейшего уведомления был установлен комендантский час, и самолет готовится к взлету для обеспечения разведывательной поддержки. Судьба Сиама будет решена в ближайшие дни."
 siam.11.a:0 "Давай покончим с этим!"
 siam.12.t:0 "Возвращение Рамы VII"
 siam.12.d:0 "Рама VII, находившийся в изгнании в Европе, согласился вернуться в Сиам и вернуть себе трон. Когда он прибыл в аэропорт Бангкока, его ждала огромная толпа, скандирующая лозунги во славу короля и монархии. Принц Адитья Дибабха, глава Временного правительства, также присутствовал и сопровождал Раму VII до церемонии коронации несколько часов спустя.\nПоэтому Рама VII вновь стал королем Сиама и объявил о своем намерении провести реформы, которые он провел до переворота 1932 года, в частности, Верховный Совет, и о своем намерении установить большую децентрализацию администрации."
 siam.12.a:0 "Да здравствует Рама VII!"
 SIA_monarchy_party:0 "Династия Чакри"
 SIA_monarchy_party_long:0 "Династия Чакри"
 siam.13.t:0 "Монархический вопрос"
 siam.13.d:0 "Официально Сиам является конституционной монархией с момента государственного переворота 1932 года, и король по-прежнему имеет некоторую власть над правительством. Но после отречения Праджадхипока, также известного как Рама VII, после разногласий с военными, которые стали главной силой политики, Сиам оказался без короля. Его преемник, Ананда Махидол или Рама VIII, является всего лишь ребенком, обучающимся в Швейцарии, и его регенты имеют лишь очень ограниченное влияние. Однако некоторые члены правительства опасаются, что в долгосрочной перспективе новый король рискнет снова поставить дубинки в колеса военных, и поэтому предложили упразднить монархию. Но упразднение столь важного института, как монархия, не следует воспринимать легкомысленно."
 siam.13.a:0 "Для блага страны его необходимо сохранить."
 siam.13.b:0 "Нам это больше не нужно."
 siam.14.t:0 "Конституционная реставрация Рамы VII"
 siam.14.d:0 "После народного референдума, на котором более половины людей решили вернуть короля Раму VII на его трон, он прибыл в аэропорт Бангкока два дня спустя, приветствовал премьер-министр Сени Прамой. Через несколько часов состоялась церемония его коронации, поклявшись соблюдать ограничения, наложенные новой сиамской конституцией."
 siam.14.a:0 "Да здравствует король! Да здравствует Конституция!"
 siam.15.t:0 "Победа повстанцев!"
 siam.15.d:0 "Битва за Бангкок бушевала в течение нескольких дней подряд, с оружием и винтовками, которые никогда не прекращали огонь, солдаты и повстанцы сражались от района к району. После захвата здания Национальной ассамблеи последние правительственные силы согласились сложить оружие. По мнению некоторых солдат, Плейк Фибунсонгхрам, командовавший антиреволюционными войсками, предпочел покончить жизнь самоубийством, а не стать свидетелем разгрома собственных сил. Бывшему премьер-министру Прайе Фахонфонфаюхасене, по-видимому, удалось взять корабль и бежать в Камбоджу. Лидер революционеров Приди Баномён выступил с речью по радио.\n\"Дорогие жители Сиама, военная тирания уже позади. Народ показал, что, несмотря на все репрессии и боевые действия, он может сохранить свою решимость и победить угнетателя. Отныне власть будет передана народу, крестьянину, рабочему, они будут окончательно освобождены. Мы находимся на заре новой эры, мы идем к светлому и обнадеживающему будущему.\""
 siam.15.a:0 "Ура революции!"
 siam.16.t:0 "Создание Социалистической Республики Сиам"
 siam.16.d:0 "Настало время официально объявить Сиам республикой, которая будет следовать социалистической мысли. То, чего добился Ленин в России, мы добьемся здесь, в Сиаме, построим новую нацию, свободную от цепей капитализма."
 siam.16.a:0 "Красная звезда поднимается над Сиамом!"
 siam.18.t:0 "Плаек Фибунсонгхрам избран премьер-министром"
 siam.18.d:0 "Похоже, что Прайя Фахонфонфаюхасена больше не в состоянии руководить страной. Скандал только что поразил его: он, как сообщается, продавал королевские товары офицерам по гораздо более низким ценам, чем обычно. Кроме того, его сторонники оказались в меньшинстве в Народном собрании после первых прямых выборов. Наконец, его кабинет не смог провести бюджетную реформу и рухнул. Были проведены новые выборы, и Плейк Фибунсонгхрам был выбран для руководства страной."
 siam.18.a:0 "Человек с большими амбициями!"
 siam.19.t:0 "Повстанцы оккупируют Исана"
 siam.19.d:0 "Повстанцы Свободных Тайцев начали крупное наступление в Исане и преуспели в захвате важного города Накхон Ратчасима, крупнейшего в регионе. Сейчас граничащие с Лаосом многие опасаются, что повстанцы попытаются установить связи с Патет Лао или даже с Вьетмином.\nМинистр обороны Плаек Фибунсонгхрам предложил использовать разведку, чтобы найти их основные базы, а затем бомбардировать их с воздуха, чтобы повлиять на их мораль, но подобное действие на нашей собственной земле и людях может иметь очень сильные последствия."
 siam.19.a:0 "Сожгите эти леса! Убей их до последнего!"
 siam.19.b:0 "Отойдите на юг!"
 SIA_kill_pridi_tooltip:0 "Это откроет демократический путь."
 SIA_dont_kill_pridi_tooltip:0 "Это откроет путь коммунистам."
 siam.20.t:0 "Приди Баномён убит воздушными рейдами"
 siam.20.d:0 "Наш воздушный налет на Исан смог повредить два тренировочных лагеря повстанцев, но также и то, что казалось их штабом. Сегодня утром на радио «Серифаф» Дирек Джаянама объявил, что Приди Баномён был убит воздушными налетами, и что он должен «выполнить задачу, которую этот великий человек увидит, как мы выполним с небес» Потеря лидера повстанцев, похоже, не уменьшила их моральный дух, даже хуже, говорят, что многие фермеры решили присоединиться к ним после потери их культур после воздушных налетов, которые вызвали много пожаров."
 siam.20.a:0 "Мы отрезали одну голову, а две отросли!"
 siam.21.t:0 "Восстание в Индокитае!"
 siam.21.d:0 "Коммунистические повстанческие группировки захватили большую часть городов Индокитая. Вероятно, с помощью коммунистического соседа Сиама последний стремился изгнать французскую колониальную администрацию. Пришло время восстановить порядок..."
 siam.21.a:0 "Вперёд!"
 siam.22.t:0 "Битва за Бангкок"
 siam.22.d:0 "Началась последняя битва против режима. После «Декларации восстания», выпущенной самим Диреком Джаянамой всем свободным тайцам с Радио Серифаф, подавляющее большинство повстанцев собрались в Бангкоке, надеясь взять под контроль правительственные органы. Две трети ополченцев напали на город с севера, а остальные прибыли с востока, причем небольшая группа, по-видимому, пыталась атаковать из портов с помощью лодок, полученных в результате мятежа военно-морского флота. Между тем, лояльная правительству армия во главе с Плаеком Фибунсонгхрамом развернулась в городе, где до дальнейшего уведомления был установлен комендантский час, и самолет готовится к взлету для обеспечения разведывательной поддержки. Судьба Сиама будет решена в ближайшие дни."
 siam.22.a:0 "Давай покончим с этим!"
 siam.23.t:0 "Победа повстанцев!"
 siam.23.d:0 "Битва за Бангкок бушевала в течение нескольких дней, с оружием и винтовками, которые никогда не прекращали огонь, солдаты и повстанцы сражались от района к району. После захвата здания Национальной ассамблеи последние правительственные силы согласились сложить оружие. По мнению некоторых солдат, Плейк Фибунсонгхрам, командовавший антиреволюционными войсками, предпочел покончить жизнь самоубийством, а не стать свидетелем разгрома собственных сил. Бывшему премьер-министру Прайе Фахонфонфаюхасене, по-видимому, удалось взять корабль и бежать в Камбоджу. Лидер революционеров Дирек Джаянама выступил с речью по радио.\n\"Дорогие жители Сиама, военная тирания уже позади. Народ показал, что, несмотря на все репрессии и боевые действия, он может сохранить свою решимость и победить угнетателя. Отныне власть будет передана народу, крестьянину, рабочему, они будут окончательно освобождены. Мы находимся на заре новой эры, мы идем к светлому и обнадеживающему будущему.\""
 siam.23.a:0 "Ура революции!"
 siam.24.t:0 "День выборов"
 siam.24.d:0 "Сегодня день всеобщих выборов, которые определят первое правительство новой республики. Два кандидата являются одними из наиболее вероятных вариантов. Дирек Джаянама, лидер сери-тайцев после смерти Приди, который основал \"Народная радикальная партия\"В качестве примера можно привести французский радикализм, а также политику Франклина Делано Рузвельта, который хочет организовать государственное вмешательство в экономику, чтобы гарантировать благосостояние народа. С другой стороны, Сени Прамой, еще один член сери-тайцев, основал консервативную партию. \"Демократическая партия\"Сам Сени, будучи королевским достоянием, хотел бы восстановить монархию, при этом ограничив её гораздо больше, чем сделали первые революционеры в 1932 году. В экономическом плане он гораздо ближе к бриттанским тори и считает, что неинтервенционистская экономическая политика будет полезна для нации и народа."
 siam.24.a:0 "Народная радикальная партия"
 siam.24.b:0 "Демократическая партия"
 siam.25.t:0 "Сиам просит о помощи"
 siam.25.d:0 "Посол Сиама привез с собой специальное письмо, предназначенное исключительно для того, чтобы [SOV.GetLeader]. В этом письме разъясняется план сиамского правительства по поддержке коммунистических движений, выступающих против французской колонизации Индокитая.\nПисьмо заканчивается призывом о помощи от Сиама, объясняющим, что из-за его низкой по сравнению с нашей промышленной мощности отгрузка оружия и техники медленная и очень дорогая, и они надеются, что мы отправим им оборудование для распространения коммунистических идеалов в Индокитае."
 siam.25.a:0 "Борьба с империализмом пользуется нашей полной поддержкой."
 siam.25.b:0 "Надвигается война, но мы не можем оставить их позади."
 siam.25.c:0 "Мы не можем позволить себе бросить ружье ради проигранного дела."
 siam.26.t:0 "Советский Союз готов оказать помощь"
 siam.26.d:0 "Советский Союз согласился направить нам большое количество винтовок и другой военной техники, чтобы помочь нам в нашей борьбе против колонизации Индокитая.\nПриобретение современной военной техники значительно увеличит мощь нашей сети сопротивления."
 siam.26.a:0 "Превосходно!"
 SIA_soviet_union_sends_many_guns:0 "§R+25% агитация повсюду§!"
 siam.27.t:0 "Советский Союз согласился на небольшую помощь"
 siam.27.d:0 "Советский Союз согласился направить нам на помощь небольшое количество военной техники, однако заявил, что полная помощь может прийти на время из-за опасной ситуации, в которой оказался СССР.\nПолучение дополнительной военной техники все равно позволит нам улучшить нашу сеть сопротивления."
 siam.27.a:0 "Лучше, чем ничего, что я угадаю."
 SIA_soviet_union_sends_some_guns:0 "§R10 % агитация повсюду§!"
 siam.28.t:0 "Советский Союз отказался поставлять оборудование."
 siam.28.d:0 "Советский Союз заявил, что из-за ситуации, в которой он оказался, он не может позволить себе отделиться от какой-либо военной техники на данный момент и ограничился желанием нам успехов в нашем восстании.\nЯсно, что мы будем одни на этом."
 siam.28.a:0 "По крайней мере, они придерживаются своих \"Социализм в одной стране\""
 siam.29.t:0 "Испытание Phraya Phahonphonphayuhasena"
 siam.29.d:0 "Первым членом Хана Рацадона, которого будут судить, является Прайя Фахонфонфаюхасена, бывший премьер-министр, обвиняемый в республиканских настроениях и желании использовать свою должность главы правительства, чтобы попытаться отменить монархию.\nПреступление такого рода будет считаться государственной изменой не только против короля, но и против всего королевства Сиам, и смертный приговор представляется логичным выбором.\nНо нельзя забывать, что он тоже очень грамотный солдат и вполне может оказаться важным для будущего ввиду приближающихся потенциальных конфликтов..."
 siam.29.a:0 "Он заслуживает только смерти."
 siam.29.b:0 "Он нам все еще нужен!"
 siam.30.t:0 "Суд над Плаеком Фибунсонгхрамом"
 siam.30.d:0 "Плаек Фибунсонгхрам является вторым членом Ханы Рацадон, которого судят за его роль в подавлении восстания принца Боударета, первую попытку восстановить власть короля и за его участие в защите города Бангкок во время восстания принца Дибабхи. Поэтому он виновен в защите правительства Ханы Рацадон, что можно считать изменой монархии. Но можно было бы задаться вопросом, если бы он не просто следовал приказам правительства того времени и поэтому не имел бы никаких моральных проблем после наших."
 siam.30.a:0 "Если бы он хотел нашей помощи, он бы с самого начала встал на нашу сторону!"
 siam.30.b:0 "Мы не можем быть отделены от такого компетентного человека, как он."
 siam.31.t:0 "Вьентьянский договор"
 siam.31.d:0 "После долгих переговоров с французским правительством последний согласился провести референдум в Камбодже и Сиаме, чтобы определить, хотят ли они снова присоединиться к Сиаму. Голосование «да» набрало более 80% голосов, и суверенитет над этими территориями будет передан нам. Правительство успокоило Францию, гарантировав, что она будет иметь право на экономические выгоды в регионе."
 siam.31.a:0 "Мы снова вместе с братьями!"
 siam.32.t:0 "Поражение в Индокитае"
 siam.32.d:0 "Не сумев победить мятеж в Индокитае, казалось бы, исчезла всякая надежда вновь увидеть эти территории под нашим контролем. Мы подписали мирный договор с четырьмя индокитайскими странами, чтобы положить конец военным действиям между нашими странами, положив конец нескольким десятилетиям французского присутствия в регионе."
 siam.32.a:0 "Единственная прибыльная колония..."
 siam.33.t:0 "Поражение в Индокитае"
 siam.33.d:0 "Не сумев победить мятеж в Индокитае, казалось бы, исчезла всякая надежда вновь увидеть эти территории под нашим контролем. Мы подписали мирный договор с четырьмя индокитайскими странами, чтобы остановить военные действия, положив конец нескольким десятилетиям французского присутствия в регионе."
 siam.33.a:0 "Самая прибыльная колония..."
 siam.34.t:0 "Сиам требует проведения референдума в Лаосе и Камбодже"
 siam.34.d:0 "Различные недавние усилия сиамского правительства по содействию мирному пантайизму теперь завершились очень конкретной просьбой: проведением референдума в Лаосе и Камбодже о присоединении последнего к Сиаму. Сиамский посол пообещал, что французские экономические интересы будут сохранены в регионе, и пообещал, в случае успешного референдума, что договоры будут заключены, чтобы дать Франции определенное экономическое преимущество в регионе."
 siam.34.a:0 "Хорошо, мы проведем провинциальные референдумы."
 siam.34.b:0 "И зачем нам это делать?"
 siam.35.t:0 "Франция отказалась от референдума"
 siam.35.d:0 "Несмотря на наши многочисленные усилия по пропаганде пантайизма, который принес бы пользу и Франции, и Сиаму, реакция Франции была отрицательной в отношении проведения референдума."
 siam.35.a:0 "По крайней мере, мы попытались."
 siam.36.t:0 "[SIA.GetNameDefCap] Требуется конец колониализма в Индокитае"
 siam.36.d:0 "[SIA.GetNameDefCap] Требуется конец колониализма в Индокитае"
 siam.36.a:0 "Независимость и свобода – это так!"
 siam.36.b:0 "Мы направим их к свободе."
 SIA_fascist_sympathies_in_the_army:0 "Фашистские симпатии в армии"
 SIA_fascist_sympathies_in_the_army_desc:0 "Благодаря влиянию Плейка Фибунсонгхрама фашистские идеалы получили большую поддержку в армии, что было подчеркнуто уже существующей авторитарной политикой. Весьма вероятно, что последний, уже имеющий большую часть политической власти, подтолкнет Сиам к сближению с державами, разделяющими эту идеологию."
 SIA_civilian_wing_opposition:0 "Гражданское крыло оппозиции"
 SIA_civilian_wing_opposition_desc:0 "После революции 1932 года Хана Рацадон, «Народная партия», была разделена на два основных крыла: одно гражданское, в пользу демократии и социальных реформ, другое военное, в пользу расширения государства и милитаризации общества. Демократы постоянно критиковали и выступали против расширения нашего военного потенциала, что-то должно быть сделано, если мы хотим завершить реализацию наших планов."
 SIA_democratic_opposition:0 "Демократическая оппозиция"
 SIA_cultural_revolution_idea_1:0 "Культурная революция"
 SIA_cultural_revolution_idea_2:0 "Культурная революция"
 SIA_artistic_propaganda:0 "Художественная пропаганда"
 SIA_artistic_propaganda_desc:0 ""
 SIA_small_depression_effects:0 "Оставшиеся последствия депрессии"
 SIA_small_depression_effects_desc:0 "Великая депрессия оказала сильное влияние на экономику Сиама, особенно с точки зрения его экспорта после девальвации фунта стерлингов, что сделало наш рис намного дороже на рынке. После многих экономических реформ нам удалось смягчить многие из его последствий, но некоторые из них все еще видны и потребуют окончательного вмешательства государства, чтобы избавиться от них навсегда."
 SIA_greater_thai_ambitions_1:0 "Большие тайские амбиции"
 SIA_greater_thai_ambitions_2:0 "Большие тайские амбиции"
 SIA_increased_education_budget:0 "Увеличение бюджета на образование"
 SIA_revolutionary_republic:0 "Революционная республика"
 SIA_socialist_secret_police:0 "Секретная социалистическая полиция"
 SIA_army_opposition:0 "Армейская оппозиция"
 SIA_capitalist_resistance:0 "Капиталистическое сопротивление"
 SIA_anti_fascism:0 "Антифашизм"
 SIA_rama_vii_constitutional:0 "Рама VII"
 SIA_loyal_army:0 "Верная армия"
 SIA_purged_army:0 "Очистили армию"
 SIA_resist_the_governement:0 "Сопротивление Хане Рацадон"
 SIA_resist_the_governement_desc:0 "Правительство Ханы Рацадон с каждым днем все больше склоняется к авторитаризму, националистической и джингоистской риторике. Сиам никогда не будет фашистской нацией, и лучший способ убедиться в этом - избавиться от них!"
 SIA_the_democratic_cause:0 "Демократическое дело"
 SIA_the_democratic_cause_desc:0 "Проблема нашей первой революции заключалась в том, что военные имели в ней слишком большое значение. Стремясь создать более гражданское правительство, мы добьемся свободы и демократии, которых так долго ждал наш народ."
 SIA_the_monarchist_cause:0 "Монархистская причина"
 SIA_the_monarchist_cause_desc:0 "Революция, конституция... Все это не устраивает нашу страну. Желание изменить систему, которая работала идеально, было плохим решением, но еще есть время обратить вспять ее последствия, начиная с восстановления трона Раме VII, законному королю Сиама, который был вынужден покинуть страну из-за военных."
 SIA_write_a_new_constitution:0 "Написать новую конституцию"
 SIA_write_a_new_constitution_desc:0 "Новая конституция, обеспечивающая гораздо больший гражданский контроль над правительством, будет написана для того, чтобы навсегда избавиться от военного влияния на наше законодательство."
 SIA_restore_rama_vii:0 "Восстановление Рамы VII"
 SIA_restore_rama_vii_desc:0 "Рама VII официально вернулся в Сиам и готовится к церемонии коронации, где его трон будет возвращен ему и где конституция 1932 года будет отменена."
 SIA_closer_to_the_west:0 "Ближе к Западу"
 SIA_closer_to_the_west_desc:0 "Если мы хотим защитить наши с трудом завоеванные ценности свободы, нам понадобятся союзники, способные защитить себя от экспансионистских угроз, таких как Японская империя."
 SIA_opening_the_economy:0 "Открыт для бизнеса!"
 SIA_opening_the_economy_desc:0 "Приняв экономическую модель, аналогичную многим либеральным демократиям во всем мире, мы можем показать, что Сиам также может быть страной инвестиций."
 SIA_the_yellow_cover_dossier:0 "Желтое досье обложки"
 SIA_the_yellow_cover_dossier_desc:0 "Еще в 1933 году Приди Паномёнг попытался передать «Желтое обложку», план экономической реформы, основанный на социалистической модели борьбы с последствиями Великой депрессии, но король и военные были против этого, зайдя так далеко, что совершили новый государственный переворот, чтобы ослабить гражданское крыло Ханы Рацадон, которая была лояльна Приди. Теперь, когда последний полностью контролирует республику, он способен осуществить свои реформы и реформировать экономику, чтобы сделать ее полезной для сиамского народа."
 SIA_monitor_the_army:0 "Мониторинг армии"
 SIA_monitor_the_army_desc:0 "Для того чтобы армия больше никогда не брала власть, мы будем проводить крупные реформы, в частности то, что солдаты подчиняются правительству перед своими генералами, тем самым снижая влияние последних."
 SIA_a_model_democracy:0 "Модель демократии"
 SIA_a_model_democracy_desc:0 "После многих лет автократических режимов Сиам смог оправиться от своих ошибок и теперь является одной из самых демократических стран в Азии."
 SIA_denounce_fascism:0 "Обличать фашизм"
 SIA_denounce_fascism_desc:0 "Фашизм — это идеология, призванная преподносить и разделять народы. Многие люди в Хана-Рацадоне симпатизировали этим движениям, и наш долг — противостоять любому правительству, желающему причинить своему народу те же страдания, что и мы."
 SIA_negociations_with_france:0 "Переговоры с Францией"
 SIA_negociations_with_france_desc:0 "Действительно, Франция была страной, которая больше всего противостояла нам и в то же время унижала нас, особенно заставив нас потерять Камбоджу или Лаос. Но это было во времена нашей абсолютной монархии. Мы изменились, и мы готовы мирно подойти к Франции. Взамен, возможно, мы будем иметь право воссоединиться с нашими братьями Лаосскими и Камбоджийскими?"
 SIA_boom_in_foreign_investments:0 "Бум иностранных инвестиций"
 SIA_boom_in_foreign_investments_desc:0 "Наши дипломатические маневры хорошо послужили нам, так как инвестиции, которые мы получаем, значительно увеличились, что подчеркивается новой стабильностью нашего режима. Мы находимся на заре новой эры для нашей экономики!"
 SIA_the_british_military_mission:0 "Британская военная миссия"
 SIA_the_british_military_mission_desc:0 "Нам удалось договориться о направлении военной делегации из Соединенного Королевства. Наличие людей, которые видели поля сражений по всему миру в качестве учителей для наших солдат, будет большим преимуществом."
 SIA_a_westernised_nation:0 "Западная нация"
 SIA_a_westernised_nation_desc:0 "Мы достигли уровня экономических, военных и правительственных исследований и разработок, сопоставимого со многими западными странами. Мы заняли свое место среди важных народов мира."
 SIA_the_oligarchic_governement:0 "Олигархическое правительство"
 SIA_the_oligarchic_governement_desc:0 "ВИП"
 SIA_supreme_council:0 "Верховный Совет Государства Сиам"
 SIA_supreme_council_desc:0 "Верховный совет Сиама был законодательным советом, который в то время состоял из принцев династии Чакри, чтобы помочь Раме VII в его решениях. Переселение позволило бы нам быть окруженными компетентными и важными должностными лицами в такие неспокойные времена."
 SIA_municipalism:0 "Муниципализм"
 SIA_municipalism_desc:0 "Прачафибан, или Муниципализм, — это концепция, которую Рама VII разработал в течение нескольких лет. Муниципалитетам будет разрешено повышать собственные налоги и иметь собственные бюджеты."
 SIA_consolidate_Khana_Ratsadon:0 "Консолидация Хана Рацадон"
 SIA_consolidate_Khana_Ratsadon_desc:0 "Несмотря на многочисленные возражения, правительству Прайи Фахонфонпхойхасены удалось укрепить свой контроль над Сиамом. С его милитаристской и однопартийной политикой Сиам, кажется, медленно скатывается к своей собственной адаптации европейского фашизма или японского милитаризма."
 SIA_increase_the_artistic_propaganda:0 "Увеличить художественную пропаганду"
 SIA_increase_the_artistic_propaganda_desc:0 "Уже несколько лет на культурном уровне предпринимаются большие усилия по развитию националистического духа среди нашего населения. Фильмы, театральные спектакли, все создано для того, чтобы тайский народ развивал воинский дух, и в ответ мы могли бы увеличить количество новобранцев."
 SIA_weaken_the_civilian_wing:0 "Ослабление гражданского крыла"
 SIA_weaken_the_civilian_wing_desc:0 "Гражданское крыло партии было лишь еще одним препятствием на нашем пути, осуждая сильное военное присутствие и желая более пацифистской внешней политики. Ясно, что реорганизация партии необходима для того, чтобы исключить любой риск раскола."
 SIA_fate_of_the_monarchy:0 "Судьба монархии"
 SIA_fate_of_the_monarchy_desc:0 "Многие помнят протесты Рамы VII против правительства, которые в конечном итоге привели его в изгнание. В рядах партии звучат голоса, призывающие к полной отмене монархических институтов, но другие опасаются, что создание республики могло бы поощрить демократические или коммунистические движения."
 SIA_phibun_ascension:0 "Вознесение Фибуна"
 SIA_phibun_ascension_desc:0 "Маршал Плаек Фибунсонгхрам, бывший министр обороны и, следовательно, второй в правительстве, кажется, имеет все шансы возглавить нашу страну. Его идеалы могут быть схожи с некоторыми европейскими фашистскими движениями, такими как в Италии или Германии. Фибун, по сути, великий патриот, желающий возрождения тайского народа против европейских империалистов, которые никогда не переставали расчленять и разделять этот народ."
 SIA_anti_chinese_rethoric:0 "Антикитайская риторика"
 SIA_pan_thai_propaganda:0 "Маха Аначак Тай"
 SIA_pan_thai_propaganda_desc:0 "Маха Аначак Тай, что означает «Великая тайская империя», является концепцией, в основном разработанной Луангом Вичитватхаканом, верным союзником Фибуна и националистическим и ирредентистским идеологом. Если мы хотим, чтобы тайский народ занял свое место среди великих держав, мы должны начать с воссоединения нашего народа, несправедливо разделенного западными империалистами."
 SIA_economic_nationalism:0 "Экономический национализм"
 SIA_economic_nationalism_desc:0 "Мы должны добиться экономической самодостаточности и избавиться от китайского капитала, признака зависимости от народа, который не является нашим собственным. Будут повышены налоги на коммерческую прибыль, а также введены государственные компании, в частности связанные с вооружением."
 SIA_dictatorial_control:0 "Диктаторский контроль"
 SIA_dictatorial_control_desc:0 "Теперь, когда большинство наших соперников были арестованы или изгнаны, Фибун сможет создать Таиланд таким, каким он его видит, не рискуя тем, что его власть будет оспорена кем-либо."
 SIA_prepare_for_the_reconquest:0 "Подготовьтесь к завоеванию"
 SIA_prepare_for_the_reconquest_desc:0 "И правительство, и тайский народ должны приложить большие усилия для подготовки к завоеванию наших территорий, которые мы потеряли десятилетия назад. Огромная пропаганда для работы в военной промышленности или в военной карьере будет развернута, чтобы гарантировать, что мы готовы идти на войну."
 SIA_choosing_a_side:0 "Выбираем сторону"
 SIA_choosing_a_side_desc:0 "Чтобы победить империалистические державы, нам нужны союзники с теми же целями, что и мы. На востоке — Япония, которая имеет преимущество быть близкой и иметь флот, способный конкурировать с флотом бриттанов, а на западе — Германия, страной, которой Фибун никогда не переставал восхищаться, но расположенной очень далеко от нас. Некоторые члены меньшинства пытались сказать, что нам не нужны альянсы, и что умственная подготовка — это все, что нам нужно, но шансы на то, что их выслушают, низки, но не отсутствуют."
 SIA_increase_the_military_budget:0 "Увеличение военного бюджета"
 SIA_increase_the_military_budget_desc:0 "Все наши экономические усилия должны быть направлены на создание военного арсенала, способного оснастить наших солдат достаточно современным оборудованием, чтобы они могли противостоять нашим противникам."
 SIA_retake_our_lands:0 "Отвоевать наши земли"
 SIA_retake_our_lands_desc:0 "Пришло время стереть то пятно в нашей истории, которое было колонизацией многих наших бывших земель европейцами. Скоро мы объединим все тайские народы и подтвердим наш статус державы в Азии и мире!"
 SIA_winds_of_the_revolution:0 "Ветры революции"
 SIA_winds_of_the_revolution_desc:0 "Коммунистические движения с каждым днем получают все большую поддержку в Азии. Если мы действительно хотим освободить наш народ, мы должны также победить капитализм, который никогда не переставал угнетать народы через колониальные империи."
 SIA_massive_land_reforms:0 "Массовые земельные реформы"
 SIA_massive_land_reforms_desc:0 "На протяжении веков крестьяне страдали от феодальных систем, где земля, которую они обрабатывают, даже не принадлежала им. Мы исправим эту несправедливость, национализировав землю и справедливо распределив ее среди тех, кто ее обрабатывает."
 SIA_finding_allies:0 "Поиск союзников"
 SIA_finding_allies_desc:0 "Для того чтобы завершить революцию в Азии, а затем и в мире, мы должны искать поддержки других коммунистических стран, в частности Советского Союза, который долгое время считался родиной и бастионом революции."
 SIA_the_socialist_secret_police:0 "Секретная социалистическая полиция"
 SIA_the_socialist_secret_police_desc:0 "Чтобы защитить нашу нацию от любого потенциально контрреволюционного элемента, мы создадим полицию, которая будет заниматься контрразведкой и наблюдением за людьми, которые считаются опасными."
 SIA_remove_the_monarchist_system:0 "Устранение монархической системы"
 SIA_remove_the_monarchist_system_desc:0 "Декадентская монархическая система является символом угнетения сиамского народа, который так долго должен был соответствовать ожиданиям лидера, единственной заслугой которого было родиться в королевской семье. Наша новая революция очистит все это и заменит эту систему истинной меритократией."
 SIA_defending_the_revolution:0 "Защищать революцию"
 SIA_guerilla_units:0 "Партизанские подразделения"
 SIA_guerilla_units_desc:0 "Весь наш народ должен научиться бороться и противостоять капиталистическим силам, которые попытаются остановить нашу славную революцию. Наш народ должен быть вооружен, чтобы каждый мог выполнить свой патриотический долг по защите революции!"
 SIA_housing_program:0 "Жилищная программа"
 SIA_establish_a_new_bureaucracy:0 "Создать новую бюрократию"
 SIA_revolutionnary_education:0 "Революционное образование"
 SIA_revolutionnary_education_desc:0 ""
 SIA_crush_the_remaining_capitalists:0 "Уничтожить оставшихся капиталистов"
 SIA_crush_the_remaining_capitalists_desc:0 "Мы почти избавились от последних капиталистических элементов, которые отравляли нашу нацию. Банки будут национализированы, как и все заводы, и наконец фермы."
 SIA_army_purge:0 "Армейская чистка"
 SIA_army_purge_desc:0 "Армия вполне может состоять из элементов, верных монархии или Хана Рацадону. Ради революции необходима чистка, чтобы контрпереворот не состоялся."
 SIA_disturb_indochina:0 "Беспокойство в Индокитае"
 SIA_disturb_indochina_desc:0 "Наши индокитайские товарищи много лет боролись против французской колонизации региона. Оказывая им официальную поддержку, политическую или военную, мы вполне могли бы добиться успеха в организации восстания во всем регионе, чтобы избавить Индокитай от французского присутствия."
 SIA_exporting_the_revolution:0 "SIA_exporting_the_revolution"
 SIA_bring_the_revolution_to_asia:0 "Принесите революцию в Азию"
 SIA_bring_the_revolution_to_asia_desc:0 "Многие народы до сих пор страдают из-за колониальных империй, решивших разделить Азию. Эти люди нуждаются в нашей помощи, и мы им ее дадим! Азиатские рабочие, объединяйтесь!"
 SIA_a_new_bastion_of_communism:0 "Новый бастион коммунизма"
 SIA_a_new_bastion_of_communism_desc:0 "Наша революция теперь прекрасно укоренена в умах сиамского народа. Нам удалось доказать миру, что коммунистическая революция способна функционировать даже в такой стране, как наша."
 SIA_the_siamese_leap_forward:0 "Сиамский скачок вперед"
 SIA_the_siamese_leap_forward_desc:0 "Пришло время начать план модернизации всего нашего общества и нации, чтобы в долгосрочной перспективе было достигнуто самое полное равенство и более справедливое общество взяло верх."
 SIA_begin_industrialisation_projects:0 "Начало проектов индустриализации"
 SIA_end_the_depression:0 "Покончить с депрессией"
 SIA_end_the_depression_desc:0 "Великая депрессия оказала сильное влияние на наш экспорт, особенно рис, и вызвала резкий рост инфляции. Благодаря различным экономическим реформам и смене экспортных партнеров нам удалось вернуться на экономический уровень, аналогичный докризисному."
 SIA_begin_industrialisation_plans:0 "Развитие промышленности"
 SIA_begin_industrialisation_plans_desc:0 "Создание промышленного комплекса необходимо, если мы хотим оставаться экономически конкурентоспособными. Будущее не только на полях, но и на заводах."
 SIA_increase_the_education_budget:0 "Увеличить бюджет на образование"
 SIA_increase_the_education_budget_desc:0 "В течение нескольких десятилетий предпринимались многочисленные усилия по обеспечению большей части населения доступом к образованию. Увеличивая бюджет, выделяемый на государственное образование, мы обеспечим, чтобы количество выпускников ежегодно только увеличивалось."
 SIA_improve_our_roads:0 "План развития дорог"
 SIA_improve_our_roads_desc:0 "В некоторых регионах инфраструктура все еще относительно неразвита, что серьезно замедляет их экономический потенциал. Запустив крупный проект по улучшению этих же дорог, мы могли бы обеспечить улучшение государственного контроля над этими районами."
 SIA_improve_the_rubber:0 "SIA_improve_rubber"
 SIA_improve_the_rubber_extraction:0 "Улучшить вытяжку резины"
 SIA_develop_rubber_extraction:0 "Разработка Rubber Extraction"
 SIA_develop_rubber_extraction_desc:0 "Резина — очень богатый ресурс в Сиаме. Многие объекты, предназначенные для его сбора, уже существуют, но могут быть значительно улучшены с точки зрения урожайности."
 SIA_electronic_research:0 "Электронные исследования"
 SIA_electronic_research_desc:0 "Электроника развивается с большой скоростью и вполне может занять важное место в следующей войне. Стремление глобализировать себя в этом может быть полезным."
 SIA_abandon_the_gold_standard:0 "Откажитесь от золотого стандарта"
 SIA_attract_investments:0 "Привлекать инвестиции"
 SIA_attract_investments_desc:0 "Проявляя готовность модернизировать нашу страну и предлагая политику, благоприятную для иностранных инвестиций, мы могли бы начать видеть, как наша страна строит промышленный арсенал."
 SIA_state_sponsored_civilian_construction:0 "Государственное спонсируемое гражданское строительство"
 SIA_state_sponsored_civilian_construction_desc:0 "Роль государства заключается в строительстве заводов, которые могут быть использованы для производства гражданского материала, а также благоустройства зданий."
 SIA_dig_for_tungsten:0 "Для вольфрама"
 SIA_dig_for_tungsten_desc:0 "Наши подвалы полны металлов, особенно вольфрама, материала, который необходим для производства некоторой военной техники. Извлечение его позволило бы нам в меньшей степени зависеть от мировой торговли для производства артиллерии или других предметов, требующих ее."
 SIA_electrification_effort:0 "Завершить электрификацию"
 SIA_electrification_effort_desc:0 "Электричество по-прежнему относительно недоступно в большинстве сельских районов страны. Развивая производство и распределение энергии, мы могли бы строить заводы в других областях."
 SIA_urbanisation_effort:0 "Поощрение урбанизации"
 SIA_urbanisation_effort_desc:0 "Большая часть нашего населения по-прежнему состоит из фермеров, что делает их недоступными для наших заводов. Создавая программу жилищного строительства в крупнейших городах и поощряя людей к переезду, рабочая сила для наших заводов будет увеличена."
 SIA_open_new_universities:0 "Открыть новые университеты"
 SIA_open_new_universities_desc:0 "Увеличение городского населения привело к увеличению спроса на университетские места. Наш долг – строить новые, чтобы все желающие получить высшее образование могли это сделать."
 SIA_artillery_factories:0 "Артиллерийские заводы"
 SIA_artillery_factories_desc:0 "Имея ресурсы, необходимые для строительства артиллерии, целесообразно было бы воспользоваться этой возможностью и создать заводы, предназначенные для их производства."
 SIA_armament_effort:0 "SIA_armament_effort"
 SIA_establish_military_factories:0 "Создание военных заводов"
 SIA_establish_military_factories_desc:0 "Создание реального промышленного комплекса, способного обеспечить все необходимое оборудование для наших войск, необходимо, если мы хотим пережить следующую войну."
 SIA_second_siamese_revolution:0 "Вторая сиамская революция"
 SIA_second_siamese_revolution_desc:0 "Хана Рацадон воспользовался концом абсолютной монархии, чтобы навязать сиамскому народу свою собственную тиранию. Казалось бы, нужна новая революция, чтобы избавить Сиам от тиранов"
 SIA_naval_developement_plan:0 "План развития военно-морского флота"
 SIA_naval_developement_plan_desc:0 "Морская война по-прежнему является важным элементом войны, усиленной нашей позицией, что делает нас уязвимыми для потенциальных морских набегов. Создание военно-морского флота, способного потенциально противостоять нашим врагам, имеет важное значение."
 SIA_reform_our_tactics:0 "Реформа нашей тактики"
 SIA_reform_our_tactics_desc:0 "Независимо от времени, победа в морском сражении принадлежит тому, кто владеет самыми большими и сильными кораблями. Сосредоточив нашу политику в области качества, мы сможем лучше защитить наши побережья."
 SIA_adopt_new_tactics:0 "Принять новую тактику"
 SIA_adopt_new_tactics_desc:0 "Технологическое развитие последних лет полностью изменило облик морской войны. Подводные, радарные, минные, если мы хотим выйти из него, мы должны адаптироваться к этим новым технологиям."
 SIA_quality_over_quantity:0 "Качество превыше количества"
 SIA_quality_over_quantity_desc:0 "Победа кроется в строительстве кораблей, способных выдержать любой другой корабль. Необходима модернизация линкоров"
 SIA_develop_naval_fortifications:0 "Развитие военно-морских укреплений"
 SIA_develop_naval_fortifications_desc:0 "Если бы враг потопил наш флот, мы были бы готовы защищать наши порты, чтобы отразить любое потенциальное военно-морское вторжение!"
 SIA_modernise_our_battleships:0 "Модернизация наших боевых кораблей"
 SIA_modernise_our_battleships_desc:0 "Боевые корабли - это то, что нужно нашему флоту. Мощные, устойчивые, с ними мы не можем ошибаться."
 SIA_study_submarines:0 "Изучение подводных лодок"
 SIA_study_submarines_desc:0 "Подводная война позволила бы нам нарушить или даже отрезать линии снабжения наших врагов, а также незаметно атаковать некоторые из его крупнейших кораблей."
 SIA_naval_mass_production:0 "Морское массовое производство"
 SIA_naval_mass_production_desc:0 "Успех военно-морского флота заключается в его способности всегда стоять и быть в состоянии эффективно преследовать наших врагов. Сосредоточив внимание на массовом производстве, мы сможем сохранить постоянное военно-морское присутствие."
 SIA_develop_cruisers:0 "Развивать крейсеры"
 SIA_develop_cruisers_desc:0 "Разработка крейсеров необходима для поддержки нашего подводного флота."
 SIA_destroyers_effort:0 "Усилия разрушителей"
 SIA_destroyers_effort_desc:0 "Чтобы защитить нас от вражеских подводных лодок, должны быть разработаны корабли, специально предназначенные для слежения и устранения их."
 SIA_establish_a_naval_college:0 "Создать военно-морской колледж"
 SIA_establish_a_naval_college_desc:0 "Для того, чтобы у нас не закончились квалифицированные моряки, мы создадим новую военно-морскую школу."
 SIA_naval_fortifications:0 "Морские укрепления"
 SIA_naval_fortifications_desc:0 "Если наш флот не в порядке, мы должны строить укрепления в наших портах, чтобы избежать военно-морских вторжений."
 SIA_increase_the_naval_production:0 "Увеличение военно-морского производства"
 SIA_increase_the_naval_production_desc:0 "Наши производственные мощности по судам явно недостаточны. Организовав строительство новых верфей, мы могли бы обеспечить рост нашего производства."
 SIA_increase_navy_fundings:0 "Увеличение финансирования ВМС"
 SIA_increase_navy_fundings_desc:0 "Мы должны выделять большую долю нашего бюджета на модернизацию нашего флота, чтобы он имел все необходимые ресурсы."
 SIA_army_reform_plan:0 "План реформирования армии"
 SIA_army_reform_plan_desc:0 "Наша армия не видела никаких новых конфликтов со времен Великой войны, и в результате она не очень современна по сравнению с другими армиями, в том числе в регионе. Необходимо внедрение современного оборудования и использование новых технологий, таких как танки."
 SIA_new_rifles:0 "Новые винтовки"
 SIA_new_rifles_desc:0 "Винтовка всегда была оружием солдата. Мы не можем позволить себе использовать устаревшие винтовки, поэтому мы должны разрабатывать новые модели."
 SIA_listen_to_new_officers:0 "Слушайте новых офицеров"
 SIA_listen_to_new_officers_desc:0 "Война постоянно меняется, выдумывается новая тактика и от других надо отказаться. Придавая большее значение идеям новых офицеров, мы будем избегать использования тактики, которая больше не нужна."
 SIA_jungle_training:0 "Подготовка к войне в джунглях"
 SIA_jungle_training_desc:0 "Специальная подготовка к боевым действиям в джунглях позволит нам лучше защищаться в условиях, которые мы знаем."
 SIA_improve_logistics:0 "Улучшить логистику"
 SIA_improve_logistics_desc:0 "Способность должным образом перемещать наши войска и их оборудование имеет важное значение в войне. Развитие таких технологий, как радио, поможет нам лучше координировать наши армии."
 SIA_artillery_developement:0 "Развитие артиллерии"
 SIA_artillery_developement_desc:0 "Добавление артиллерийских полков в нашу армию дало бы ей гораздо лучшую способность прорываться, что нам отчаянно нужно."
 SIA_anti_tank_research:0 "Антитанковые исследования"
 SIA_anti_tank_research_desc:0 "Нам будет очень трудно противостоять танкам с простыми винтовками, поэтому мы должны разработать новый тип артиллерии, способной пробить броню."
 SIA_tanks_research:0 "Исследование танков"
 SIA_study_tanks:0 "Учебные танки"
 SIA_study_tanks_desc:0 "Танки — это дорогостоящая технология, эффективность которой трудно обсуждать. Стремление к разработке собственных моделей должно быть приоритетом."
 SIA_improved_r_d:0 "Улучшение R&D"
 SIA_improved_r_d_desc:0 "С течением времени технологический прогресс становится все более важным для победы в войнах. Увеличивая инвестиции в исследования и разработки, мы повысим наш исследовательский потенциал."
 SIA_doctrines_improvement:0 "Доктрины совершенствования"
 SIA_doctrines_improvement_desc:0 "Нам нужно определить четкую стратегию для нашей армии, а затем сосредоточить все наши усилия на совершенствовании той же стратегии."
 SIA_national_mobilisation:0 "Национальная мобилизация"
 SIA_national_mobilisation_desc:0 "Нам нужно ввести более строгий призыв, чтобы у нас не закончились резервисты."
 SIA_ready_for_war:0 "Готовы к войне"
 SIA_ready_for_war_desc:0 "Наша армия наконец готова к новым конфликтам. Наши враги будут дрожать при виде наших солдат!"
 SIA_the_siamese_air_force:0 "Сиамские ВВС"
 SIA_the_siamese_air_force_desc:0 "Авиация была настоящей революцией, как на гражданском, так и на военном уровне, с самолётами, способными к разведке или бомбардировке. Мы должны создать реальные военно-воздушные силы, чтобы противостоять врагам!"
 SIA_build_new_airports:0 "Постройте новые аэропорты"
 SIA_build_new_airports_desc:0 "Прежде чем мы начнем производство всех наших самолетов, нам придется построить авиабазы, с которых мы можем их отправить."
 SIA_rule_the_skies:0 "Править небом"
 SIA_rule_the_skies_desc:0 "Прежде всего, мы должны думать о защите наших войск и инфраструктуры, о разработке все более быстрых самолетов, способных атаковать вражеские бомбардировщики."
 SIA_death_from_the_skies:0 "Смерть сверху"
 SIA_death_from_the_skies_desc:0 "Разрабатывая более мощные бомбардировщики, мы могли бы нанести ущерб вражеской инфраструктуре, чтобы нарушить ее промышленность и поставки."
 SIA_establish_aviation_school:0 "Создать авиационную школу"
 SIA_establish_aviation_school_desc:0 "Школа, посвященная подготовке наших будущих пилотов, необходима для того, чтобы те, кто управляет нашими машинами, были как можно более квалифицированными."
 SIA_anti_air_protection:0 "Антивоздушная защита"
 SIA_anti_air_protection_desc:0 "Возможно, мы не сможем сбить все вражеские самолеты собственными силами. Вот почему мы собираемся построить наземные пушки, которые можно использовать с земли, чтобы помочь им."
 SIA_long_range_fighters:0 "Истребители большого радиуса действия"
 SIA_long_range_fighters_desc:0 "Нам нужны более быстрые охотники! Сильнее! И это идет дальше!"
 SIA_troops_destruction:0 "Уничтожение войск"
 SIA_troops_destruction_desc:0 "Мы могли бы нанести большой урон противостоящим войскам, атакуя их сверху, что облегчило бы наземный бой."
 SIA_a_new_bureaucracy:0 "Новая бюрократия"
 SIA_ensure_loyalty_in_the_army:0 "Обеспечить лояльность в армии"
 SIA_ensure_loyalty_in_the_army_desc:0 "Армия была главной силой, стоящей за государственным переворотом 1932 года, доказав, что в ее рядах существует нелояльность. После суда над главными зачинщиками первого государственного переворота мы должны будем обеспечить, чтобы в армии больше не было предателей в ее рядах."
 SIA_a_new_bureaucracy_desc:0 "Бюрократия, созданная военными, совершенно не соответствует потребностям нашего королевства. Нам нужно будет переписать то, как работают многие юрисдикции."
 SIA_the_devoted_king:0 "Преданный король"
 SIA_the_devoted_king_desc:0 "Рама VII — благожелательный король, желающий своему народу только самого лучшего. Он читает петиции и слушает людей. Это укрепляет доверие людей к монархии, в чем мы отчаянно нуждаемся в эти неспокойные времена."
 SIA_stay_on_guard:0 "Оставайтесь на страже"
 SIA_stay_on_guard_desc:0 "В эти неспокойные времена любой союзник может упасть, и любой может стать нашим врагом. Сохраняя прагматичную внешнюю политику, мы сможем адаптироваться к геополитическим изменениям, и мы можем пережить следующую войну."
 SIA_the_royal_cult:0 "Королевский культ"
 SIA_the_royal_cult_desc:0 "Рама VII — благожелательный король, желающий своему народу только самого лучшего. Он читает петиции и слушает людей. Это укрепляет доверие людей к монархии, в чем мы отчаянно нуждаемся в эти неспокойные времена."
 SIA_surpass_the_nobility:0 "Превзойти дворянство"
 SIA_surpass_the_nobility_desc:0 "Мы не должны забывать контролировать дворянство и препятствовать тому, чтобы оно получало слишком большое влияние в правительстве. В конце концов, они должны ответить королю и ему одному."
 SIA_royal_youth_leagues:0 "Королевские молодежные лиги"
 SIA_the_royal_research_foundation:0 "Королевский исследовательский фонд"
 SIA_the_royal_research_foundation_desc:0 "Создание новой научно-исследовательской организации, непосредственно отвечающей на просьбы короля о военном и техническом прогрессе, улучшило бы наш имидж среди интеллектуального сообщества страны."
 SIA_a_better_kingdom:0 "Лучшее королевство"
 SIA_a_better_kingdom_desc:0 "Благодаря своим реформам и решениям Рама VII продолжил традицию своих предшественников и сделал Сиам современной и более справедливой нацией. Мы находимся на заре новой эры для нашей страны!"
 SIA_cement_sector_improvement:0 "Цементный сектор"
 SIA_cement_sector_improvement_desc:0 "Цемент является одним из основных неаграрных экспортных товаров. Финансово поддерживая компании, занимающиеся его производством, мы обеспечим, чтобы в этом секторе было все больше и больше рабочих мест."
 SIA_ammunitions_production:0 "Производство боеприпасов"
 SIA_ammunitions_production_desc:0 "Наши боекомплекты уже не достаточны, необходимо создавать новые заводы, предназначенные для их производства, чтобы наши войска не испытывали недостатка в них."
 SIA_mechanization_of_agriculture:0 "Механизация сельского хозяйства"
 SIA_mechanization_of_agriculture_desc:0 "Большинство наших граждан – фермеры. Мы обязаны помочь им в решении их задач, облегчив им доступ к новым технологиям, таким как тракторы."
 SIA_wellfare_program:0 "Программа благосостояния"
 SIA_wellfare_program_desc:0 "Обязанность государства и избранных представителей состоит в том, чтобы улучшить условия жизни своего народа как можно лучше. Мы будем продвигать реформы, чтобы сделать образование и медицинское страхование бесплатными, чтобы помочь тем, кто больше всего в этом нуждается."
 SIA_the_war_has_changed:0 "Война изменилась"
 SIA_the_war_has_changed_desc:0 "В последние годы мы стали свидетелями развития многих технологий, которые были нам еще неизвестны во время Великой войны. Необходимы исследования этих новых изобретений."
 SIA_import_foreign_tanks:0 "Импортировать иностранные танки"
 SIA_import_foreign_tanks_desc:0 "Мы должны попытаться договориться с иностранными державами о приобретении танков, затем изучить их и попытаться создать свои собственные модели."
 SIA_terrain_analysis:0 "Анализ местности"
 SIA_terrain_analysis_desc:0 "Полевые исследования необходимы, если война приближается к нашему порогу. Мы должны быть готовы использовать любую возможность, предлагаемую окружающей средой, которая даст нам преимущество перед врагом, который не знает об этом."
 SIA_support_our_troops:0 "Поддержите наши войска"
 SIA_support_our_troops_desc:0 "Компании, призванные не воевать, а помогать нашим войскам посредством разведки, укрепления или управления снабжением, позволят нашим солдатам использовать все свои возможности."
 SIA_royal_thai_marines:0 "Королевские тайские морские пехотинцы"
 SIA_royal_thai_marines_desc:0 "Нас окружает вода, поэтому мы должны постараться максимально использовать ее и создать подразделения, специально предназначенные для борьбы в морской среде."
 SIA_a_faster_army:0 "Быстрая армия"
 SIA_a_faster_army_desc:0 "Использование моторизованной пехоты может быть интересным в ситуациях, когда скорость является определяющим фактором для победы."
 SIA_remembering_the_great_war:0 "Вспоминая Великую войну"
 SIA_remembering_the_great_war_desc:0 "Мы послали экспедиционные войска воевать в Европе во время Великой войны, и это принесло с собой большой опыт в боевой тактике, используемой великими державами. Мы должны использовать эти знания в нашем плане модернизации армии."
 SIA_a_cannon_on_a_car:0 "Канон на автомобиле"
 SIA_a_canon_on_a_car:0 "Канон на автомобиле"
 SIA_a_canon_on_a_car_desc:0 "Наша мотопехота могла бы оказаться гораздо более эффективной и грозной, если бы мы снабдили ее более мощным оборудованием, например ракетами."
 SIA_adapt_to_the_new_conflicts:0 "SIA_adapt_to_the_new_conflicts"
 SIA_adapt_to_everything:0 "Адаптация ко всему"
 SIA_adapt_to_everything_desc:0 "Мы должны постоянно уметь приспосабливаться к противостоящей тактике, чтобы не удивляться."
 SIA_negotiations_with_france:0 "Переговоры с Францией"
 SIA_negotiations_with_france_desc:0 "Действительно, Франция была страной, которая больше всего противостояла нам и в то же время унижала нас, особенно заставив нас потерять Камбоджу или Лаос. Но это было во времена нашей абсолютной монархии. Мы изменились, и мы готовы мирно подойти к Франции. Взамен, возможно, мы будем иметь право воссоединиться с нашими братьями Лаосскими и Камбоджийскими?"
 SIA_welfare_program:0 "Программа благосостояния"
 SIA_welfare_program_desc:0 "Обязанность государства и избранных представителей состоит в том, чтобы улучшить условия жизни своего народа как можно лучше. Мы будем продвигать реформы, чтобы сделать образование и медицинское страхование бесплатными, чтобы помочь тем, кто больше всего в этом нуждается."
 SIA_cultural_revolution:0 "Культурная революция"
 SIA_cultural_revolution_desc:0 "Будет создан ряд мандатов, направленных на обновление и модернизацию тайской культуры. Страна будет переименована в «Таиланд», что означает «Земля тайцев», жители будут вынуждены говорить на тайском, а не на местном языке, дресс-код будет модернизирован, чтобы быть ближе к европейским. Это покажет, что тайский народ - цивилизованный и развитый народ."
 SIA_the_cult_of_the_marshall:0 "Культ Маршалла / The Cult of the Marshall"
 SIA_the_cult_of_the_marshall_desc:0 "Фибун стал образцом добродетели, мужества и преданности нации. Своими вдохновляющими речами, обещаниями и действиями по защите конституционализма от роялистов или коммунистических заговорщиков он стал духовным лидером, превзойдя даже короля."
 SIA_eliminate_songsuradet:0 "Изгнание Сонгсурадета"
 SIA_eliminate_songsuradet_desc:0 "Прайя Сонгсурадет, хотя и отошел от политической жизни, все же играет важную роль в армии. Чтобы помешать ему заговорить против правительства, все его военные обязанности будут отняты у него, и он будет выслан из страны. Близкие к нему люди, такие как принц Рангсит Прайурасакди, будут арестованы и предстанут перед судом."
 SIA_replace_the_national_hymn:0 "Заменить национальный гимн"
 SIA_replace_the_national_hymn_desc:0 "Новый национальный гимн, просто называемый «Тайским национальным гимном», написанный Пхра Чендуриян и Луанг Саранупрафан, подчеркивающий милитаризм и жертвенность тайской расы, будет поставлен на место, чтобы в конечном итоге полностью заменить старый королевский гимн. Одушевленные патриотической песней, мы дадим нашим войскам всю необходимую мотивацию для восстановления славы нашего народа."
 SIA_replace_the_national_anthem:0 "Заменить национальный гимн"
 SIA_replace_the_national_anthem_desc:0 "Новый национальный гимн, просто называемый «Тайским национальным гимном», написанный Пхра Чендуриян и Луанг Саранупрафан, подчеркивающий милитаризм и жертвенность тайской расы, будет поставлен на место, чтобы в конечном итоге полностью заменить старый королевский гимн. Одушевленные патриотической песней, мы дадим нашим войскам всю необходимую мотивацию для восстановления славы нашего народа."
 SIA_spiritual_mobilisation:0 "Мобилизируйте Ювачон Тахан"
 SIA_spiritual_mobilisation_desc:0 "Ювачон Тахан — молодёжная военная организация, созданная Фибуном в 1934 году. Теперь, когда война близка, мы должны мобилизовать их и отправить на фронт."
 SIA_the_cult_of_the_marshal:0 "Культ маршала"
 SIA_the_cult_of_the_marshal_desc:0 "Фибун стал образцом добродетели, мужества и преданности нации. Своими вдохновляющими речами, обещаниями и действиями по защите конституционализма от роялистов или коммунистических заговорщиков он стал духовным лидером, превзойдя даже короля."
 SIA_our_own_democracy:0 "Собственная «демократия»"
 SIA_our_own_democracy_desc:0 "Рама VII знает, как создать демократическую систему, которая будет работать для такой страны, как Сиам. Такие реформы, как «универсальное избирательное право», не нужны и могут принести больше вреда, чем пользы."
 SIA_the_only_true_guide:0 "Единственный истинный гид"
 SIA_the_only_true_guide_desc:0 "Такие требования, как «универсальное избирательное право», не имеют никакого смысла для нашей страны. Король и дворянство обладают всеми необходимыми навыками, чтобы понять, какие реформы необходимо осуществить."
 SIA_a_new_era:0 "Новая эра"
 SIA_a_new_era_desc:0 "Мы находимся на заре новой эры для Сиама. Демократия и свобода победили тоталитаризм. Мы никогда больше не погрузимся во тьму фашизма."
 SIA_a_liberal_governement:0 "Либеральное правительство"
 SIA_a_liberal_governement_desc:0 "Народная радикальная партия Дирек Джаянамы победила на выборах. Основываясь на платформе социального прогрессивизма, партия намерена осуществить расширение прав личности, а также определенное экономическое вмешательство."
 SIA_a_conservative_governement:0 "Консервативное правительство"
 SIA_conservatism_and_democracy:0 "Консерватизм и демократия"
 SIA_conservatism_and_democracy_desc:0 "Демократическая партия Сени Прамоя победила на выборах. Желая сохранить тайские традиции, одновременно продвигая демократическую систему, одним из главных её решений было восстановление монархии в чисто конституционной форме, где королевская семья была бы лишена всякой власти."
 SIA_a_constitutional_monarchy:0 "Конституционная монархия"
 SIA_a_constitutional_monarchy_desc:0 "Республиканская система не годится для Сиама. Мы народ, который гордится своими традициями и своим прошлым, и наша монархия является частью этих традиций. Настало время вернуть Раму VII на престол."
 SIA_state_invervention:0 "Государственное вмешательство"
 SIA_state_invervention_desc:0 "Вмешательство государства в экономику необходимо для того, чтобы избежать эксплуатации наиболее слабых наиболее сильными. Будут приняты законы, защищающие работников от льгот"
 SIA_the_freer_the_market:0 "Чем свободнее рынок"
 SIA_the_freer_the_market_desc:0 "Первый шаг на пути к большей свободе для наших граждан — это избегать вмешательства государства в экономические дела и позволить компаниям регулировать себя."
 SIA_follow_the_soviet_model:0 "Следуйте советской модели"
 SIA_follow_the_soviet_model_desc:0 "Советский Союз — это пример коммунистической партии, которому мы должны следовать. За несколько лет большевики превратили Россию из крестьянской нации в полностью индустриализированную и современную нацию, и мы сделаем все возможное, чтобы сделать то же самое!"
 SIA_peasant_communism_desc:0 "Мы не Россия, и мы не можем позволить себе полностью изменить образ жизни наших граждан, выведя их с полей в города, но мы не можем оставить их под системой, которая злоупотребляет ими. Мы построим социализм, рассчитанный на наших крестьян, где каждый фермер будет равен и сможет жить достойной жизнью."
 SIA_peasant_communism:0 "Крестьянский коммунизм"
 SIA_healthcare_for_the_people:0 "Здравоохранение для людей"
 SIA_healthcare_for_the_people_desc:0 "Доступ к здравоохранению иногда может быть затруднен для самых слабых и самых обездоленных, и именно с ними мы боремся. Общественные клиники будут открыты везде, особенно в самых сельских районах, для улучшения общего состояния здоровья нашего населения."
 SIA_a_gun_in_every_home:0 "Оружие в каждом доме"
 SIA_a_gun_in_every_home_desc:0 "Если мы хотим, чтобы наш народ смог защититься от капиталистов, мы должны обеспечить, чтобы у них было достаточно для этого. Любой гражданин, который об этом попросит, будет иметь право иметь огнестрельное оружие в своем доме."
 SIA_centralised_production:0 "Централизованное производство"
 SIA_centralised_production_desc:0 "Централизовав управление экономикой, мы обеспечим правильное распределение ресурсов на благо государства."
 SIA_state_atheism:0 "Государственный атеизм"
 SIA_state_atheism_desc:0 "Религия не может играть роль в новой стране, которую мы строим. Мы должны избавиться от влияния буддизма на наш народ и таким образом освободить его от еще одной цепи."
 SIA_negotiate_indochinese_freedom:0 "Переговоры об индокитайской свободе"
 SIA_negotiate_indochinese_freedom_desc:0 "Присутствие колониализма в Восточной Азии, несмотря на французское принятие коммунизма, создает идеологическое противоречие, которое должно быть решено."
 SIA_communist_victory:0 "Мы провозгласили Социалистическую Республику Сиам"
 SIA_democratic_victory:0 "Мы провозгласили Республику Сиам"
 SIA_liberals_win_election:0 "Либералы победили на выборах"
 SIA_conservatives_win_election:0 "Консерваторы победили на выборах"
 SIA_second_siamese_revolution_flag:0 "§RЕще не закончено§!"
 SIA_phibun_killed_during_revolution:0 "Фибун был убит во время революции"
 SIA_buy_ships_tooltip:0 "§YРазблокировать§! £decision_icon_small Решения о покупке лодок у наших союзников"
 SIA_closer_to_the_west_tooltip:0 "§YРазблокировать§! £decision_icon_small Решения о присоединении к демократическим фракциям"
 SIA_finding_allies_tooltip:0 "§YРазблокировать§! £decision_icon_small Решения о союзе коммунистических стран§!"
 SIA_second_siamese_revolution_tooltip:0 "§RПроизойдет новая революция...§!\n"
 SIA_negotiations_with_france_tooltip:0 "§YРазблокировать§! £decision_icon_small Решения по усилению пан-тайизма в Лаосе и Камбодже побуждают Францию вернуть их нам"
 SIA_choosing_a_side_tooltip:0 "§YРазблокировать§!£decision_icon_small решения о союзе с Германией, Италией или Японией"
 SIA_disturb_indochina_tooltip:0 "§YРазблокировать§! £decision_icon_small Решения подпитывать коммунистическое сопротивление в Индокитае"
 SIA_stay_on_guard_tooltip:0 "§YРазблокировать§! £decision_icon_small Решения о присоединении к фракциям, если вам угрожает опасность"
 SIA_follow_the_soviet_model_tooltip:0 "§YПриди Баномёнг§! прибыль:\n  §YОшеломленный сталинист§!\n  - Производительность: §G+10.00%§!\n  Идеология защиты от дрейфа: §G+15.00%§!"
 SIA_peasant_communism_tooltip:0 "§YПриди Баномёнг§! прибыль:\n  §YАграрный марксист§!\n  - Отделение истощения: §G-10.00%§!\n  - Из поставки: §G-50.00%§!"
 SIA_cultural_revolution_tooltip:0 "Страна будет переименована в §YТаиланд§!"
 minister_of_education:0 "Министр образования"
 agrarian_marxist:0 "Аграрный марксист"
 mediator:0 "Посредник"
 SIA_phayom_chulanont:0 "Пхаём Чуланонт"
 SIA_seni_pramoj:0 "Сени Прамот"
