 claim_quebec_tt:0 "Притязания на все §YКвебек§! государств и разблокирует решение об их интеграции."
 core_quebec_tt:0 "Получить ядра на всех §YКвебек§! Устраняет отрицательные локальные модификаторы."
 core_newfoundland_laborador_tt:0 "Получает национальные регионы: §YНьюфаундленд§! и §YЛаборатория§!"
 usa_claim_northwest_mexico:0 "Заявка на северо-запад Мексики"
 usa_claim_northwest_mexico_desc:0 "Большинство северо-западных мексиканских штатов сравнительно богаты и менее урбанизированы по сравнению с остальной частью страны. Оба эти фактора делают их способными к интеграции в союз. Их сильное национальное единство было бы ответственностью, но этого недостаточно, чтобы остановить нас."
 us_claim_and_unlock_decision_on_nwmexico:0 "Притязания на прибыль §YБая Калифорния§!, §YСонора§!и §YЧихуахуа§!и разблокирует решение об их интеграции."
 usa_integrate_northwest_mexico:0 "Интеграция Северо-Запада Мексики"
 usa_cored_nw_mexico_tt:0 "Приобретает ядра и удаляет §YПоследняя битва Мексики§! из §YБая Калифорния§!, §YСонора§!и §YЧихуахуа§!"
 usa_claim_central_northeast_mexico:0 "На юг до реки Сантьяго"
 usa_claim_central_northeast_mexico_desc:0 "Мексика оказалась слишком хлопотной для нас, чтобы выдержать ее дольше. Для их же блага они должны быть вытеснены на юг. Рио-Гранде-де-Сантьяго на нашем юге станет новой естественной границей Америки."
 usa_claim_cuba:0 "Утверждать Куба"
