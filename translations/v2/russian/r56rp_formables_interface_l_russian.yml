 quebecs_last_stand:0 "Последняя битва Квебека"
 mexicos_last_stand:0 "Последняя битва Мексики"
 americas_last_stand:0 "Последняя битва Америки"
 home_of_the_american_revolution:0 "Дом американской революции"
 formable_nations_himyar_category:0 "Химьяритское королевство"
 formable_nations_himyar_category_desc:0 "The §YХимьяритское королевство§! или §YХимьяр§!Это было государство в южных высокогорьях §YЙемен§!а также название региона, на который он претендует.\n§R- Предупреждение--§!\nЭто §Yформируемый§! Это полностью вымышленное, поскольку Гимьяриты были уничтожены Королевством Аксум и впоследствии включены в арабскую культуру."
 formable_himyar_kingdom:0 "Химьяритское королевство"
 formable_nations_sabaean_kingdom_category:0 "Сабайское царство"
 formable_nations_sabaean_kingdom_category_desc:0 "The §Yсабайцы§! или §YСабины§!Они были древней группой южноаравийцев, говорили на сабайском, одном из древних южноарабских языков. Они основали §YКоролевство Саба§! В современном Йемене, который считается библейской землей Саввы и «самым старым и самым важным из южноаравийских королевств».\n§R- Предупреждение--§!\nЭто §Yформируемый§! Это полностью вымышленное возрождение указанного Царства."
 formable_sabaean_kingdom:0 "Королевство Саба"
 formable_nations_palmyrene_empire_category:0 "Империя Пальмиры"
 formable_nations_palmyrene_empire_category_desc:0 "§YИмперия Пальмиры§! Это было недолговечное отколовшееся государство от §YРимская империя§! В результате кризиса третьего века. Назван в честь столицы, §YПальмира§!Он охватывал римские провинции §YСирия Палестина§!, §YАравийская Петрезия§!и §YЕгипет§!Как и большие части §YМалая Азия§!.\n§R- Предупреждение--§!\nЭто §Yформируемый§! Это полностью вымышленное возрождение империи."
 formable_nations_palmyrene_empire:0 "Империя Пальмиры"
 formable_nations_gupta_empire_category:0 "Империя Гупта"
 formable_nations_gupta_empire_category_desc:0 "§YИмперия Гупта§! Это был древний §YИндийская империя§! который существовал с начала 4-го века н.э. до начала 6-го века нашей эры. В зените, примерно с 319 по 467 год н.э., он охватывал большую часть Индийского субконтинента.\n§R- Предупреждение--§!\nЭто §Yформируемый§! Это полностью вымышленное возрождение империи."
 formable_nations_gupta_empire:0 "Империя Гупта"
 formable_nations_germany_extra:0 "Германия"
 formable_nations_melanasia_category:0 "Меланезия"
 formable_nations_melanasia:0 "Меланезия"
 formable_nations_thunder_dragon_empire_category:0 "Империя Гром-Дракона"
 formable_nations_thunder_dragon_empire_category_desc:0 "§YИмперия Громового Дракона§! Это вымышленная империя, возникшая из §YБутан§!Для него характерны смелые претензии на весь Китай. Вы можете подтвердить свои претензии и объединить их. §Yкитайский§! Люди под твоим знаменем.\n§R- Предупреждение--§!\nЭто §Yформируемый§! Это полностью вымышленный фильм, основанный на дереве фокуса Бутана, это все для удовольствия!"
 formable_nations_thunder_dragon_empire:0 "Империя Гром-Дракона"
 formable_nations_thunder_dragon_empire_category_extra:0 "Империя Гром-Дракона возрождается"
 formable_nations_thunder_dragon_empire_category_extra_desc:0 "§YИмперия Гром-Дракона§! С нашим толчком к китайским провинциям и легитимизацией нашей собственности на вновь приобретенные государства, наши военные готовы, мы можем спросить себя, почему остановимся на этом?\nУ нас есть возможность претендовать на право собственности на §YЮжноазиатский регион§!."
 formable_nations_thunder_dragon_empire_extra:0 "Нажмите на Единую Небесную Азиатскую Империю!"
 formable_nations_himalayas_category:0 "Гималаи"
 formable_nations_himalayas:0 "Гималаи"
 formable_nations_tibetan_empire_category:0 "Тибетская империя"
 formable_nations_tibetan_empire:0 "Тибетская империя"
 formable_nations_greater_liberia_category:0 "Большая Либерия"
 formable_nations_greater_liberia:0 "Большая Либерия"
 r56rp_LIB_home_of_the_free:0 "Дом Свободных"
 r56rp_LIB_home_of_the_free_desc:0 "Либерия была основана Американским обществом колонизации в 1821 году как поселение для свободных чернокожих американцев. В 1847 году она провозгласила независимость, став первой чернокожей республикой Африки с конституцией по образцу США. Мы теперь гордый народ, представляющий западные африканские связи с Америкой, конец рабства вернул многих наших людей обратно в Африку, и с колониальными державами под рукой мы должны бороться, чтобы освободить всех людей под империалистическим угнетением на нашей родине."
 formable_nations_middle_africa_category:0 "Средняя Африка"
 formable_nations_middle_africa:0 "Средняя Африка"
 formable_nations_cuban_imperial_legacy_category:0 "Испанское императорское наследие"
 formable_nations_cuban_imperial_legacy_category_desc:0 "§YГенерал-капитанство Кубы§! Это был административный район Испанской империи, созданный в 1607 году в рамках попытки Габсбурга лучше защитить и управлять своими карибскими владениями.\nНаследие испанского империализма до сих пор в сердцах многих кубинцев и наших людей, пересекающих океан вдоль побережья. §YЗемля свободных§! Мы можем призвать к законным притязаниям на бывшую испанскую Имперскую Землю и провозгласить возрожденную кубинскую гегемонию.\n§R- Предупреждение--§!\nЭто §Yформируемый§! Это полностью вымышленное возрождение кубинского капитанства."
 formable_nations_cuban_imperial_legacy:0 "Генеральный Капитан де Куба"
 formable_nations_bosporan_kingdom_category:0 "Боспорское королевство"
 formable_nations_bosporan_kingdom_category_desc:0 "§YБоспорское королевство§!, также известный как Королевство киммерийского Боспора, был древним греко-скифским государством, расположенным на востоке. §YКрым§! и тот §YТаманский полуостров§! на берегах киммерийского Боспора, сосредоточенного в современном Керченском проливе\n§R- Предупреждение--§!\nЭто §Yформируемый§! Это полностью вымышленное возрождение этого состояния, это все для удовольствия!\nМожет быть, будет больше решений для просмотра, если вы решите сформировать Боспорское королевство."
 formable_nations_bosporan_kingdom:0 "Боспорское королевство"
 r56rp_legacy_of_rome:0 "Римская империя как государство-победитель"
 r56rp_legacy_of_rome_desc:0 "С возрождением Боспорского государства, как нации формально подданного государства Рима, мы хорошо служили нашим союзникам, Теперь мы можем служить нашей собственной судьбе, свободному и безопасному состоянию Черного моря!"
 formable_nations_crimean_khanate_category:0 "Крымское ханство"
 formable_nations_crimean_khanate:0 "Крымское ханство"
 formable_nations_bosporan_kingdom_extra_category:0 "Будущее Боспорского государства"
 formable_nations_bosporan_kingdom_extra_category_desc:0 "С реформацией нашего государства мы, возможно, захотим расширить наши возможности! Во имя нашего будущего и во имя всех народов мира. §YЧерное море§!.\n§R-Примечание--§!\nЭтот вариант откроет новые возможности для дальнейшего развития государственности наших стран."
 claim_the_black_sea:0 "Утверждаем гегемонию над Черным морем!"
 formable_nations_bosporan_kingdom_mountainous_republic:0 "Гегемония над Каспийским морем."
 claim_the_caspian_and_mountainous_republics:0 "Заявите о Каспийском море и горных республиках!"
 formable_nations_median_category:0 "Империя Средней династии Персии"
 formable_nations_median_category_desc:0 "§YМидийские§! Это древний иранский народ, который говорил на медианском языке и населял область, известную как СМИ между западным и северным Ираном. Около 11-го века до нашей эры они заняли горный регион северо-западного Ирана и северо-восточный и восточный регион Месопотамии в окрестностях Экбатаны (современный Хамадан).\n§R- Предупреждение--§!\nЭто §Yформируемый§! Это полностью вымышленное возрождение реформирования общества. §YСредняя империя.§!"
 formable_nations_median:0 "Медианная империя"
 formable_nations_parthia_category:0 "Парфянская империя"
 formable_nations_parthia_category_desc:0 "§YПарфянская империя§!Также известный как §YИмперия Арсакидов§!Это была крупная иранская политическая и культурная держава в древности. §YИран§! от 247 г. до н.э. до 224 г.\n§R- Предупреждение--§!\nЭто §Yформируемый§! Это полностью вымышленное возрождение реформирования общества. §YПарфянская империя.§!"
 formable_nations_parthia:0 "Парфия"
 formable_nations_pashtun_state_category:0 "Объединенное пуштунское государство"
 formable_nations_pashtun_state_category_desc:0 "§YОбъединенное пуштунское государство§! Это концепция, предусматривающая объединение регионов с пуштунским большинством, выходящих за пределы национальных границ. Это новообразованное государство объединит пуштунов из §YАфганистан§! и §YПакистан§!\n§R- Предупреждение--§!\nЭто §Yформируемый§! Это совершенно вымышленное объединение пуштунского народа, §YРП§! Они могут быть построены на этом факте, поскольку они также населяют многие районы Индии и Советского Союза. §YТаджикистан§!"
 formable_nations_pashtun_state:0 "Государство пуштун"
 formable_nations_khalji_sultanate_category:0 "Хаджли Султанат"
 formable_nations_khalji_sultanate_category_desc:0 "§YСултанат Хаджли§!Видное средневековое царство в Южной Азии, охватывало обширное пространство территорий. Управляемый султанами, он процветал как значительная политическая и экономическая власть, способствуя торговле, искусству и интеллектуальным занятиям.\n§R- Предупреждение--§!\nЭто §Yформируемый§! Это полностью вымышленное возрождение реформирования общества. §YСултанат.§!"
 formable_nations_khalji_sultanate:0 "Наследники султаната Хаджли"
 formable_nations_ghurid_empire_category:0 "Империя Гуридов"
 formable_nations_ghurid_empire_category_desc:0 "§YДинастия Гуридов§! Это была династия персидского происхождения, предположительно восточного иранского таджикского происхождения, которая правила с 8-го века до 1215 года. Гуриды были сосредоточены в горах региона Гор в современном центральном Афганистане, где они первоначально начинались как местные вожди. Они постепенно перешли в суннитский ислам после завоевания Гора правителем Газнавидов Махмудом Газни в 111 году. Гуриды в конце концов захватили Газнавидов, когда Мухаммед из Гора захватил Лахор и изгнал Газнавиды из их последнего оплота.\n§R- Предупреждение--§!\nЭто §Yформируемый§! Это полностью вымышленное возрождение реформирования общества. §YИмперия Гуридов.§! Твой §YРП§! Каким-то образом это должно включать в себя возрождение упомянутой Династии, когда лидер вашей страны утверждает, что он является преемником упомянутой Правящей Династией."
 formable_nations_ghurid_empire:0 "Возрожденная империя Гуридов"
 formable_nations_cossack_category:0 "Объединенное казачье государство"
 formable_nations_dravidian_category:0 "Объединённое Дарвидское государство"
 formable_nations_spanish_philiphines_category:0 "Имперское наследие"
 formable_nations_spanish_philiphines_category_desc:0 "§YИспанская Ост-Индия§!Это была испанская колония, в основном расположенная в Филиппинах, люди никогда не склонялись перед своими новыми повелителями, и это сформировало их в ближайшие годы.\nПравило того, §Yиспанцы§! Испанское правление, охватывающее более трех веков с 1565 по 1898 год, оставило неизгладимый след на архипелаге, поскольку это наследие исчезает, и мы можем вернуть старые земли, которые находились под нашим управлением.\n§R- Предупреждение--§!\nЭто §Yформируемый§! Это полностью вымышленное провозглашение иррендетистских претензий филиппинцев на ранее существовавшие испанские колонии на Востоке."
 formable_nations_spanish_philiphines:0 "Восстановление земель Испанской Ост-Индии"
 formable_nations_german_austria_category:0 "Реформа германо-австрийского государства"
 formable_nations_german_austria_category_desc:0 "§YГерманско-австрийская Республика§! Это было непризнанное государство, которое было создано после Первой мировой войны в качестве первоначального государства для областей с преимущественно немецкоязычным и этническим немецким населением в пределах того, что было ранее. §YАвстро-Венгерская империя§!с планами возможного объединения с Германией.\n§R- Предупреждение--§!\nЭто §Yформируемый§! Это полностью вымышленное возрождение реформирования общества. §YГерманско-австрийское государство§!"
 formable_nations_german_austria:0 "Реформа германо-австрийского государства"
 formable_nations_greek_colonial_empire_category:0 "Пан-Хеллас - наследие греческих городов"
 formable_nations_greek_colonial_empire_category_desc:0 "В древнем мире, §YГреческие колонии§! Они были созданы по всему Средиземноморью и за его пределами. Эти колонии часто сохраняли связь со своим родным городом-государством, но развивались в отдельные образования с различной степенью автономии.\n§R- Предупреждение--§!\nЭто §Yформируемый§! Формирование единого панэллинского союза ранее существовавших греческих городов, колоний и государств.\n§R-Примечание--§!\nНо если вы будете обладать силой, чтобы вернуть государства, вы будете благословлены наградой. Тот, который скрыт от глаз"
 formable_nations_reclaim_greek_colonies:0 "Восстановление наших прошлых холдингов"
 formable_nations_hafsid_empire_category:0 "Султанат Хафсид"
 formable_nations_hafsid_empire_category_desc:0 "The §YХафсид§! Суннитская мусульманская династия берберского происхождения, правившая §YИфрикия§! (современный Тунис, западная Ливия и восточный Алжир) с 1229 по 1574 год - их правление принесло процветание и способствовало развитию исламской цивилизации. §YУниверситет Эз-Зитоуна§! Это делает его одним из основных центров исламского обучения, где были разработаны многие разработки в различных областях. Их правление оставило след в истории Ливии, Туниса и Алжира.\n§R- Предупреждение--§!\nЭто §Yформируемый§! Это полностью вымышленное возрождение династии и их притязания на бывшие земли, которыми они владели."
 formable_nations_hafsid_empire:0 "Султанат Хафсид в Тунисе"
 formable_nations_francosphere_category:0 "Франкосфера"
 formable_nations_francosphere_category_desc:0 "The §YФранкосфера§! Это страны, где французский является официальным языком. Эти страны часто упоминаются как §Y\"Франкофон\"§! нации. Наиболее заметными среди них являются §YФранция§!, §YКанада§! (особенно в провинции) §YКвебек§!а также в ряде стран Африки, таких как §YСенегал§!, §YКот-д'Ивуар§!, §YМарокко§! и многие другие.\n§R- Предупреждение--§!\nЭто §Yформируемый§! Это полностью вымышленный союз всех этих наций, и он будет известен как §Y\"Франкосфера\"§!."
 formable_nations_francosphere:0 "Франкосфера"
 formable_nations_greater_brazil_category:0 "Большая Бразилия"
 formable_nations_greater_brazil_category_desc:0 "The §YБольшой бразильский штат§! Это включает в себя вымышленные ирредентистские претензии Бразилии, где часть португальского языка находится в упомянутых штатах.\n§R- Предупреждение--§!\nЭто §Yформируемый§! Это полностью вымышленное создание §YБольшее государство Бразилия§! Притязания на соседние государства Бразилии."
 formable_nations_greater_brazil:0 "Большая Бразилия"
 formable_nations_spanish_empire_category:0 "Большая Испания"
 formable_nations_spanish_empire_category_desc:0 "The §YБольше испанского государства§! Включает в себя вымышленные ирредентистские претензии Испании, где часть испанской диаспоры находится в упомянутых государствах.\n§R- Предупреждение--§!\nЭто §Yформируемый§! Это полностью вымышленное создание §YБольше испанского государства§! Притязания на соседние с Испанией государства."
 formable_nations_spanish_empire:0 "Большая Испания"
