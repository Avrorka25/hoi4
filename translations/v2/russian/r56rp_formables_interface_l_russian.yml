 formable_nations_west_indies:0 "Британская Вест-Индия"
 formable_nations_umayyad_caliphate_category:0 "Халифат Омейядов"
 formable_nations_umayyad_caliphate:0 "Халифат Омейядов"
 formable_nations_rashidun_caliphate_category:0 "Праведный халифат"
 formable_nations_rashidun:0 "Праведный халифат"
 formable_nations_amazonia_category:0 "Амазония"
 formable_nations_amazonia_category_desc:0 "The §YДождевые леса Амазонки§! Это источник конфликта для многих южноамериканских стран, претендующих на огромные ресурсы, которые они могут предоставить. §Yформируемый§! Это полностью вымышленно."
 formable_nations_amazonia:0 "Амазония"
 formable_nations_illyria_category:0 "Иллирия"
 formable_nations_illyria_category_desc:0 "§YИллирия§! Он был заселен различными древними иллирийскими племенами, прежде чем он был в конечном итоге включен в Римскую империю.\nЭто §Yформируемый§! Это выдумка, потому что не было единого иллирийского государства."
 formable_nations_illyria:0 "Иллирия"
 formable_nations_northwestern_china_category:0 "Северо-Западный Китай"
 formable_nations_northwestern_china:0 "Северо-Западный Китай"
 form_empire_of_zion_category:0 "Империя Сиона"
 formable_nations_empire_of_solomon_category:0 "Империя Соломона"
 formable_nations_maya_kingdom_category:0 "Королевство майя"
 formable_nations_maya_kingdom:0 "Королевство майя"
 formable_nations_teutonic_category:0 "Тевтонский орден"
 formable_nations_teutonic_category_desc:0 "Тевтонский Орден — католическое религиозное учреждение, основанное как Военное Общество. §YПруссия§! и §YЛивония§! Как территория, однако они пришли в упадок к 16-му веку. Этот формируемый является вымышленным воссозданием Тевтонского государства."
 formable_nations_teutonic:0 "Тевтонский орден"
 r56rp_major_exports:0 "Торговля Британской Вест-Индии"
 r56rp_major_exports_desc:0 "Британская Вест-Индия была важнейшим центром торговли в колониальную эпоху, поставляя в Европу сахар, ром, табак и другие товары. Они снова стали большой пользой для империи!"
 r56rp_riches_of_the_amazon:0 "Богатство Амазонки"
 r56rp_riches_of_the_amazon_desc:0 "Дождевые леса Амазонки - это сокровищница ресурсов. Его пышные просторы таят в себе удивительное разнообразие биоразнообразия, от уникальной флоры и фауны до неисследованного потенциала для фармацевтических препаратов. Древесина из ее древних деревьев, экзотических фруктов и лекарственных растений имеет экономическую ценность. Река Амазонка с ее обширной сетью притоков обеспечивает пресную воду и поддерживает разнообразную водную жизнь. Однако добыча этих ресурсов должна быть сбалансирована с усилиями по сохранению этой бесценной экосистемы."
 DEN_reclaim_the_west_indies:0 "Восстановление датской Вест-Индии"
 DEN_reclaim_the_danish_east_indies:0 "Восстановление датской Ост-Индии"
 DEN_reclaim_the_danish_east_indies_desc:0 "Датская Ост-Индия, когда-то под знаменем Датской Ост-индской компании, манила нас неиспользованными богатствами. Мы решительно должны восстановить и использовать их богатство, обеспечить наше господство в регионе и максимально увеличить использование ресурсов для национального процветания."
 DEN_reclaim_the_west_indies_desc:0 "Датская Вест-Индия, состоящая из островов Св. Томас, Св. Джон и Св. Круа, бывшая датская колониальная территория в Карибском бассейне, не так давно проданная Соединенным Штатам, пришло время вернуть их! Создайте новую колонию для улучшения нашего народа!"
 DEN_reclaim_the_gold_coast:0 "Восстановление датского золотого побережья"
 DEN_reclaim_the_gold_coast_desc:0 "Датское Золотое Побережье, расположенное в регионе, ныне называемом миром «Гана», было нашим колониальным владением с 17 по 19 века. Она сыграла значительную роль в торговле золотом и другими ресурсами, а ее восстановление и экспорт говорят о том, что огромные ресурсы будут полезны для нашей экономики."
 SWE_reclaim_new_sweden:0 "Восстановление колониального поселения Нья Свериге"
 SWE_reclaim_new_sweden_desc:0 "Нья Свериге, когда-то наша колония в Северной Америке, символизирует наше богатое наследие. Мы стремимся вернуть его наследие, способствуя культурному росту и чтению истории, которая связывает нас с нашими предками."
 SWE_reclaim_the_gold_coast:0 "Восстановление шведского золотого побережья"
 SWE_reclaim_the_gold_coast_desc:0 "Шведское золотое побережье с его богатыми ресурсами требует от нас ответственного освоения и развития. Мы стремимся использовать его потенциал для процветания и устойчивого роста нашей страны."
 ICE_reclaim_vinland:0 "Возвращение Винланда"
 ICE_claim_the_kingdom_of_the_isles:0 "Заявить Королевство Островов"
 ICE_claim_the_kingdom_of_the_isles_desc:0 "Норвежское Королевство Островов, расположенное в Северной Атлантике, охватило группу изрезанных островов, включая Оркнейские, Шетландские и Фарерские острова. Он процветал как морская культура, погруженная в традиции викингов: Как наследники скандинавов, мы вернем трон нашим предкам!"
 ICE_reclaim_vinland_desc:0 "Винланд был областью прибрежной Северной Америки, исследованной нашими предками викингами. Лейф Эрикссон высадился там около 1 г. н.э. и потребовал земли для Содружества Исландии: Мы по праву претендуем на Винландию и должны подготовить партию, чтобы снова поставить на ней исландский флаг!"
 ICE_varangian_adventures:0 "Исландские варягские приключения"
 ICE_varangian_adventures_desc:0 "Наши предки сражались и умирали за византийский двор, мы имеем право претендовать на «Константинополь» как на город скандинавский!, С нашим могучим флотом и армией, подготовленными, мы должны требовать его для себя!"
 reclaim_livonia:0 "Возвращение Ливонии"
 formable_nations_crusade_category:0 "Цари крестоносцев"
 formable_nations_crusade_category_desc:0 "Эти §YРешения§! Это вымышленное изображение возрождения государств крестоносцев в 2 веке, дающее возможность расширить Царство Небесное и претендовать на земли, которые когда-то были непокорены оригиналом. §YКрестоносцы§!"
 reclaim_tripoli:0 "Восстановление графства Триполи"
 reclaim_tripoli_desc:0 "Графство Триполи было последним из государств крестоносцев. Он был основан в Леванте в современном регионе Триполи, северном Ливане и некоторых частях западной Сирии."
 reclaim_antioch:0 "Восстановить княжество Антиохия"
 reclaim_antioch_desc:0 "Антиохийское княжество было одним из государств-крестоносцев, созданных во время Первого крестового похода, который включал части современной Турции и Сирии."
 reclaim_edessa:0 "Восстановление графства Эдесса"
 reclaim_edessa_desc:0 "Графство Эдесса было государством крестоносцев 12-го века в Верхней Месопотамии.Его местом был город Эдесса - современная Шанлыурфа недалеко от города Урфа."
 claim_cyprus:0 "Заявить кипрское королевство"
 claim_cyprus_desc:0 "Королевство Кипр было средневековым королевством государств крестоносцев, существовавшим между 1192 и 1489 годами, правители королевства претендовали на титул «Король и Королевы» Иерусалима."
 reclaim_cyprian_antalya:0 "Вернуть Анталью"
 reclaim_cyprian_antalya_desc:0 "Кипрское королевство имело плацдарм в Анталье и небольшую крепость, расположенную в южной современной провинции Мерсин."
 push_christianity_east:0 "Проталкивайте христианство на Восток"
 push_christianity_east_desc:0 "С неудачной кампанией Болдуина против Дамаска, живущего в сердцах всех христиан, мы имеем божественное право продвигать христианство на восток, укрепляя наше новое Царство Небесное."
 expand_edessa:0 "Расширить графство Эдесса"
 expand_edessa_desc:0 "С восстановлением графства Эдесса, чтобы обеспечить наше новое королевство, мы должны подтолкнуть турок на запад и соединиться с кипрскими притязаниями на Анталью."
 r56rp_deus_vult:0 "Деус Вульт"
 r56rp_deus_vult_desc:0 "Христианский девиз, примерно переводится как «Бог хочет этого» [ROOT.GetNameDefCap] Восстановленные, христиане стекаются в новообразованное государство для Отпущения грехов, счастливо вступая в штаты новообразованных Военных, христианские Ордена уже начали жертвовать средства на поднятие оружия для нового государства. Создание стабильной обороны для любых стран, ставящих под сомнение свободу новых государств."
 formable_nations_numidia_category:0 "Нумидийское королевство"
 formable_nations_numidia:0 "Нумидийское королевство"
 formable_nations_numidia_category_desc:0 "Нумидийцы были древним царством, состоящим из территории, которая теперь составляет. §YАлжир§! Но позже частично расширился на территории, которые теперь известны как День модерна. §YТунис§! и части современного дня §YЛивия§!"
 formable_nations_numidia_category_extra:0 "Нумидийское реформатское королевство"
 formable_nations_numidia_category_extra_desc:0 "С реформированием этого §YНумидийское королевство§!Чтобы обеспечить наше выживание, мы должны подтолкнуть бывшего §YКарфагенские владения§!"
 push_former_carthage:0 "Претендуйте на лордство над Карфаго"
 claim_morrocan_posessions:0 "Претензии лордства на владения марроканов"
 r56rp_numidian_cavalry:0 "Наследственность Нумидийской кавалерии"
 r56rp_numidian_cavalry_desc:0 "Нумидийские кавалеристы были известны своим непревзойденным всадничеством, быстрой мобильностью и смертельной точностью в бою. Их ловкость и мастерство сделали их грозными противниками в древней войне. Сегодня мы будем сражаться на стальных шпильках!"
 formable_nations_teutonic_extras_category:0 "Возрождение тевтонского ордена"
 formable_nations_teutonic_extras_category_desc:0 "С возрождением этого §YТевтонский орден§! Пришло время расширить наше присутствие в чужих странах. §YЛивония§! и §YЛитва§! Когда-то они были нашими, возможно, настало время снова вернуть их."
 TUT_connect_our_possesions:0 "Соедините Ливонию с Пруссией"
 TUT_connect_our_possesions_desc:0 "Крайне важно, чтобы в Эстонии возродились и восстановились ливийские братья меча, без легитимности прежних поз Святого Ордена мы столкнемся с отпором за наше недавнее формирование."
 TUT_push_out_the_grand_duchy_desc:0 "Тевтонский орден построил в современной Литве замки, пропагандирующие католицизм в регионе. Мы должны укрепить границы нашего новообразованного католического королевства."
 TUT_push_out_the_grand_duchy:0 "Продвиньте наши границы на юг"
 formable_nations_gaul_category:0 "Галлия"
 formable_nations_gaul_category_desc:0 "§YГаллия (лат. - Gallia)§! Это был регион Западной Европы, впервые четко описанный римлянами, охватывающий современную Францию, Бельгию, Нидерланды, Люксембург и части Швейцарии, Германии и Северной Италии.\nЭто §Yформируемый§! Полностью вымышленный, так как «Гаульская идентичность» была объединена в «Галло-римскую идентичность», которая еще больше разбавлена франками после завоевания Галлии в начале 5-го века."
 formable_nations_gaul:0 "Объединенное неогалическое государство"
 formable_nations_gaul_category_extra:0 "Неогалические амбиции"
 formable_nations_gaul_category_extra_desc:0 "С реформированием §YГаллия§! Мы можем претендовать на земли старых §YГалльские королевства§! И дальше, чем раньше, раздвигать границы нашей империи."
 r56rp_ancestors_of_brennus:0 "Потомки Бреннуса"
 claim_liguria:0 "Заявить Лигурийские Позиции"
 claim_liguria_desc:0 "Лигурийцы были древним индоевропейским народом, населявшим прибрежные районы северо-западной Италии и юго-восточной Франции. Они были известны своими морскими навыками, торговлей и взаимодействием с соседними культурами."
 claim_the_lands_of_the_adriatic_veneti:0 "Убедитесь, что венети запоминаются"
 claim_the_lands_of_the_adriatic_veneti_desc:0 "Адриатическая Венеция была древним народом на северо-востоке Италии. Восстановление их земель может принести пользу неогалльскому королевству через территориальную экспансию, увеличение ресурсов и рабочей силы всех реформированных граждан королевства."
 claim_the_lands_of_the_belgae:0 "Заявить Бывшие земли Белга"
 claim_the_lands_of_the_belgae_desc:0 "Белги были древним кельтским племенем, населявшим регион современной Бельгии, северной Франции и части Нидерландов. Как претенденты на земли старых, мы должны объединить их земли, чтобы обеспечить будущее Галлии!"
 formable_nations_latin_empire_category:0 "Латинская империя"
 formable_nations_latin_empire_category_desc:0 "§YЛатинская империя§! Это было недолговечное средневековое государство, основанное в 124 году во время Четвертого крестового похода. Он сосредоточился в Константинополе и правил частями Византийской империи до 1261 года. Как сторонники итальянских крестоносцев, которые шли на Констанинополь, мы имеем божественное право претендовать на такую небесную империю.\n§R- Предупреждение--§!\nЭто §Yформируемый§! Это полностью вымышленная история, так как Латинская империя была намного меньше на своем пике, это просто для забав."
 formable_nations_latin_empire:0 "Латинская империя"
 formable_nations_latin_empire_extras_category:0 "Реформированные амбиции Латинской империи"
 formable_nations_latin_empire_extras_category_desc:0 "С нашим недавним воссоединением и восстановлением §YХристианское царство§! Мы можем захотеть подтолкнуть наших предков §YПретензия§!"
 formable_nations_latin_empire_extras:0 "Объявляйте прежние претензии Империи Никеи!"
 formable_nations_latin_empire_extras_desc:0 "Никейская империя, основанная после падения Константинополя в 124 году, сыграла ключевую роль в Византийской реставрации, в конечном итоге вернув город в 1261 году и восстановив Византию."
 formable_nations_achaea:0 "Восстановление княжества Ахея"
 formable_nations_achaea_desc:0 "Княжество Ахея, основанное крестоносцами в 13 веке, управляло частями Пелопоннеса в Греции. Это было ключевое государство крестоносцев в регионе."
 formable_nations_armenian_kingdom_category:0 "Армянское царство"
 formable_nations_armenian_kingdom_category_desc:0 "§YАрмения§!также Королевство §YБольшая Армения§!или просто §YБольшая Армения§! §Y(лат.: Армения Майор)§! Иногда упоминается как §YАрмянская империя§!Это было королевство на Древнем Ближнем Востоке, которое существовало с 331 года до н.э. до 428 года нашей эры.\n§R- Предупреждение--§!\nЭто §Yформируемый§! Это полностью вымышленное, так как армянское королевство было намного меньше на своем пике, это просто для веселья."
 formable_nations_armenian_kingdom:0 "Армянское царство"
 formable_nations_north_africa_category:0 "Северная Африка"
 formable_nations_north_africa:0 "Северная Африка"
 formable_nations_visigothic_kingdom_of_spain_category:0 "Вестготское царство"
 formable_nations_visigothic_kingdom_of_spain_category_desc:0 "§YВестготское царство§! (лат.: Regnum Gothorum) — то, что сейчас §YЮго-западная Франция§! и тот §YПиренейский полуостров§! с 5-го по 8-й века. Один из германских государств-преемников Западной Римской империи, он был первоначально создан поселением вестготов при короле Валлии в провинции Галлия Аквитания на юго-западе Галлии римским правительством, а затем расширен завоеванием всей Испании.\n§R- Предупреждение--§!\n Это §Yформируемый§! Это совершенно вымышленное, как и многие другие. Это только для веселья."
 formable_nations_visigothic_kingdom_of_spain:0 "Вестготское царство"
 formable_nations_visigothic_kingdom_of_spain_extras_category:0 "Реформированные амбиции вестготского королевства"
 formable_nations_visigothic_kingdom_of_spain_extras_category_desc:0 "§YКоролевство Суэби (лат. Regnum Suevorum)§! или §YSuebi Kingdom of Galicia (лат.: Galicia suevorum regnum)§!Это было германское пост-римское королевство, которое одним из первых отделилось от Римской империи. Основанное в бывших римских провинциях Галлеция и северная Лузитания, королевство де-факто было основано Суэби около 49 лет.\n§YРеформированное вестготское королевство§! Как государство-посредник, оба этих государства могут теперь претендовать на свое законное право собственности на эти государства!"
 claim_the_suebi:0 "Заявите о королевстве Суэби!"
 usa_complete_the_manifest_destiny:0 "Завершите явную судьбу"
 usa_complete_the_manifest_destiny_desc:0 "Наш союз сделал широкий экспансионизм важным приоритетом на протяжении всего 2-го века, к ужасу наших соседей. Но наш союз, несмотря на все имеющиеся у него проблемы, является более мощным, чем когда-либо; Возможно, сейчас самое время закончить то, что мы начали так давно."
 usa_integrate_pacific_canada:0 "Интеграция Британской Колумбии и Юкона"
 USA_claim_pacific_canada_tt:0 "Притязания на прибыль §YБританская Колумбия§!, §YВерхняя Британская Колумбия§!, §YОстров Ванкувер§!, §YЮкон§!и §YХайда Гвайи§!"
 USA_core_pacific_canada_tt:0 "Получение ядер по всему миру §Yканадский§! штаты"
