l_russian:
 formable_nations_mod_category:0 "Создать новое государство"
 formable_nations_mod_category_desc:0 "§RНапоминание:§!\nВы можете только сформировать §YНовая нация§! Однажды, после чего вы обнаружите, что объединиться не так-то просто. Также важно отметить, что после того, как вы оформите форму, вы будете считаться §YВеликая держава§!Это может привести к войне в вашей стране\n§RПожалуйста, обратите внимание:§!\nЕсли вы обнаружили какие-либо проблемы с выбранным вами формируемым или хотели бы внести свой вклад в создание более «реалистичных» формируемых наций, не стесняйтесь предлагать или сообщать об ошибке в Интернете. §Yраздор§!."
