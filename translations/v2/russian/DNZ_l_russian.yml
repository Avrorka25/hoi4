 danzig.5.t:0 "Данциг провозгласил независимость"
 danzig.5.d:0 "Сегодня [DNZ.Getleader] сделал шокирующее заявление, провозгласив городское правительство независимым от [POL.GetNameDef] и объявив Данциг продолжением Пруссии. Пока неясно, продержится ли этот безумный эксперимент и вмешаются ли соседние страны.\n\nПока небольшой город остаётся один. Судьба Данцига неизвестна."
 danzig.5.a:0 "Они сошли с ума?"
 danzig.5.b:0 "Мы движемся вперёд."
 danzig.6.t:0 "Правительство Данцига присоединяется к [GER.GetNameDef]"
 danzig.6.desc:0 "Сегодня [DNZ.Getleader] объявил, что город Данциг независим от [POL.GetNameDef]. Вместо этого он заявил, что Вольный город намерен присоединиться к [GER.GetNameDef]. Он пригласил [GER.GetLeader] направить войска для обеспечения безопасности территории."
 danzig.6.a:0 "Какая неожиданность."
