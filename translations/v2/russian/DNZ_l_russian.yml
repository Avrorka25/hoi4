l_russian:
 danzig_focus:0 "Национальные фокусы Данцига"
 form_prussia_category:0 "Сформировать Пруссию"
 form_prussia_category_desc:0 "История Данцига во многом переплетается с историей Пруссии. Теперь, когда мы контролируем исторически связанные с ней территории, возможно, пришло время принять наше прусское наследие."
 form_prussia:0 "Сформировать Пруссию"
 DNZ_join_germany:0 "Присоединиться к [GER.GetNameDef]"
 r56_unite_DNZ_with_ger:0 "Распустить город-государство"
 r56_DNZ_prussia_legacy:0 "Данциг провозгласил независимость"
 danzigerwerft:0 "Данцигерверфт"
 ernst_stieberitz:0 "Эрнст Штибериц"
 Danzig_ist_Deutsch:0 "Данциг ист Дойч!"
 Danzig_ist_Deutsch_desc:0 "Большинство населения города Данцига составляют немцы. Они хотят лишь воссоединиться с германским государством. Однако местные политики пока стараются не афишировать эти настроения."
 DNZ_sean_lester:0 "Шон Лестер — верховный комиссар"
 DNZ_sean_lester_desc:0 "Шон Лестер является верховным комиссаром Данцига. Он был назначен на эту должность Лигой Наций в 1934 году. С тех пор он постоянно вступает в конфликт с местным правительством Данцига и проводимой им политикой. Добиться его смещения и замены новым верховным комиссаром, более гибким и лояльным правительству Данцига, должно стать одной из наших первоочередных задач."
 DNZ_reliance_on_militia:0 "Опора на ополчение"
 DNZ_reliance_on_militia_desc:0 "Статус Вольного города под защитой Лиги Наций запрещает нам иметь что-либо похожее на вооружённые силы. Порядок в пределах города сейчас поддерживается местной полицией, также известной как шуцполиция. §YПарамилитаризация§! корпуса обеспечит безопасность города перед угрозой [POL.getAdjective] или [GER.getAdjective] агрессии."
 DNZ_maintain_infrastructure_idea:0 "Поддержание инфраструктуры"
 DNZ_carl_jacob_burckhardt:0 "Карл Буркхардт — верховный комиссар"
 DNZ_carl_jacob_burckhardt_desc:0 "Буркхардт будет куда более внимателен к нуждам Данцига."
 DNZ_invite_foreign_investors:0 "Пригласить иностранных инвесторов"
 DNZ_invite_foreign_investors_desc:0 "Мандат Лиги Наций предоставляет [DNZ.GetNameDef] особые права в вопросах налогообложения и контроля торговли, чем мы можем воспользоваться для привлечения иностранных инвестиций."
 DNZ_generic_democratic_reformer:0 "Герман Раушнинг"
 DNZ_generic_fascist_demagogue:0 "Вильгельм фон Внук"
 DNZ_albert_forster:0 "Альберт Форстер"
 DNZ_edmund_beyl:0 "Эдмунд Бейль"
 DNZ_helmut_froboss:0 "Гельмут Фробёсс"
 DNZ_helmut_froboss2:0 "Гельмут Фробёсс"
 danzig.1.t:0 "Вольный город Данциг"
 danzig.1.desc:0 "После Великой войны был создан Вольный город Данциг, чтобы обеспечить недавно возрождённому польскому государству доступ к порту. Такой компромисс оказался необходим вместо полной аннексии, поскольку подавляющее большинство населения Данцига составляли этнические немцы.\n\nРост ультранационализма в Германии привёл к тому, что НСДАП получила полный контроль над местными институтами. Пока стремление этих нацистских политиков к воссоединению с Германией остаётся относительно скрытым, но вскоре всё может измениться. В случае кризиса город-государство, скорее всего, исчезнет и будет аннексирован либо Польшей, либо Германией."
 danzig.1.a:0 "Скоро наше желание станет реальностью."
 danzig.3.t:0 "Данциг просит поддержки в замене комиссара города"
 danzig.3.desc:0 "У города Данцига накопилось множество проблем с нынешним комиссаром Лестером. Он активно пытался блокировать политику города и препятствовал принятию некоторых его законов. Данциг просит нашей поддержки в обращении к Лиге Наций с просьбой назначить нового комиссара города, который будет более сговорчив."
 danzig.3.a:0 "Что угодно ради наших немецких братьев."
 danzig.3.b:0 "Лучше не нарушать существующий порядок."
 danzig.4.t:0 "Данциг добивается замены комиссара города!"
 danzig.4.desc:0 "\nСенат Данцига недавно обратился к [GER.GetNameDef] за помощью в замене нынешнего городского комиссара Лестера. Германия подала от имени Данцига петицию в Лигу Наций, и Лига может уступить немецким требованиям. Если это произойдёт, городского комиссара заменят новым бесхребетным чиновником, который будет соглашаться со всем, чего пожелает местное правительство Данцига!\n\nОчевидно, что Данциг больше не действует как «Вольный город»."
 danzig.4.a:0 "Возможно, пришло время вмешаться."
 DNZ_danzig_senate:0 "Укрепить контроль Сената"
 DNZ_danzig_senate_desc:0 "Безработица во Вольном городе достигла рекордного уровня, а значительную часть населения составляют этнические немцы, поэтому убедить жителей Данцига проголосовать за нас будет несложно. Получив официальный контроль над Сенатом, мы уже не отдадим его без боя; я и есть Сенат!"
 DNZ_remove_lester:0 "Добиваться отстранения Лестера"
 DNZ_remove_lester_desc:0 "Лестер на каждом шагу вступает в конфликт с местным правительством Данцига и его политикой. Добиться его смещения и замены новым верховным комиссаром, более гибким и лояльным правительству Данцига, должно стать одной из первоочередных задач."
 DNZ_prussia_legacy:0 "Прусское наследие"
 DNZ_prussia_legacy_desc:0 "Мы не можем доверить свою судьбу ни [POL.GetAdjective], ни [GER.GetAdjective]. Мы должны добиться независимости и полагаться только на себя. Мы должны создать собственное государство!"
 DNZ_maintain_status_quo:0 "Сохранить статус-кво"
 DNZ_maintain_status_quo_desc:0 "Хотя это и не самый желанный вариант, в неспокойные времена только [POL.GetAdjective] заслуживают нашего доверия. Было бы разумно попытаться улучшить отношения с ними."
 DNZ_reconcile_with_lester:0 "Примириться с Лестером"
 DNZ_reconcile_with_lester_desc:0 "Возможно, Лестер на самом деле не наш враг, а просто неправильно понятый человек с иным представлением о том, что лучше для [DNZ.GetNonIdeologyName]. Возможно, сотрудничество с ним вместо противостояния принесёт куда более продуктивные отношения."
 DNZ_cooperate_with_league_of_nations:0 "Сотрудничать с Лигой Наций"
 DNZ_cooperate_with_league_of_nations_desc:0 ""
 DNZ_industrial_investments:0 "Субсидировать промышленность"
 DNZ_industrial_investments_desc:0 "Если однажды мы хотим достичь цели и объединиться с [GER.GetNameDef], нужно заранее подготовиться, инвестируя капитал в местную промышленность. Чем больше мы сделаем сейчас, тем значительнее будет наш вклад в [GER.GetNameDef]."
 DNZ_workers_front:0 "[ROOT.GetAdjective] Арбайтсфронт"
 DNZ_workers_front_desc:0 "Мы последуем примеру Отечества и создадим собственный Арбайтсфронт. Это позволит сплотить сторонников нашего дела в промышленных кругах."
 DNZ_maintain_infrastructure:0 "Улучшить инфраструктуру"
 DNZ_maintain_infrastructure_desc:0 "Из-за ожесточённого противодействия [POL.GetAdjective] тиранов во многих государственных вопросах нам придётся рассчитывать только на себя. Мы должны убедиться, что наши дороги хорошо обслуживаются и соответствуют современным стандартам."
 DNZ_building_industry:0 "Развивать местные мастерские"
 DNZ_building_industry_desc:0 "Получив влияние над промышленным сектором, мы можем значительно больше инвестировать в будущие проекты."
 DNZ_modernize_the_port:0 "Модернизировать порт Данцига"
 DNZ_modernize_the_port_desc:0 "Порт Данцига все эти годы был центром нашего существования. Мы должны сделать всё возможное для его модернизации и укрепления."
 DNZ_business_contacts_abroad:0 "Пригласить иностранных инвесторов"
 DNZ_business_contacts_abroad_desc:0 "Международное признание в качестве суверенного государства жизненно важно для нашего выживания перед лицом [POL.GetAdjective] агрессора. Мы встретимся с максимально возможным числом инвесторов и предпринимателей, чтобы добиться этой цели."
 DNZ_support_german_businesses:0 "Поддержать [GER.GetAdjective] предприятия"
 DNZ_support_german_businesses_desc:0 "Как ещё лучше сблизить жителей Данцига с [GER.GetNameDef], если не поддержкой предприятий Отечества на нашей территории? Мы немедленно разработаем планы их строительства и интеграции."
 DNZ_german_industrial_ties:0 "Связи, объединяющие нас"
 DNZ_german_industrial_ties_desc:0 "Наши связи с Отечеством более чем очевидны для [POL.GetAdjective]. Это позволит нам продолжать расширяться и развиваться как независимому суверенному государству, терпеливо ожидая момента, когда Отечество нанесёт удар."
 DNZ_german_technology:0 "Учёные из Отечества"
 DNZ_german_technology_desc:0 "Наше Отечество великодушно предоставило нам доступ к некоторым своим исследователям. Мы воспользуемся их советами и начнём создавать собственный институт."
 DNZ_hanseatic_ingenuity:0 "Ганзейская изобретательность"
 DNZ_hanseatic_ingenuity_desc:0 "Подобно старой Ганзейской лиге, мы сделаем всё возможное, чтобы продвигать исследования и получать любое технологическое преимущество над врагами."
 DNZ_deutsches_physik:0 "Дойчес Физик"
 DNZ_deutsches_physik_desc:0 "Мысль о том, что неарийцам можно позволить быть частью наших исследовательских усилий, абсурдна. Мы позаботимся о том, чтобы наши команды были наполнены Мастер-гонкой и следовали идеям, заложенным Филиппом Ленардом."
 DNZ_modernize_the_police:0 "Модернизировать шуцполицию"
 DNZ_modernize_the_police_desc:0 "Хотя официально мы не можем иметь настоящую армию, никто не запрещает нам максимально модернизировать и вооружить полицию. Это позволит нам противостоять любым попыткам [POL.GetAdjective] агрессии на нашей территории."
 DNZ_civic_guard:0 "Создать Гражданскую гвардию"
 DNZ_civic_guard_desc:0 "По мере расширения полицейских сил Вольного города Данцига протесты [POL.GetAdjective] против наших партийных формирований становятся всё громче. Мы создадим Гражданскую гвардию и скроем её истинное назначение, чтобы избежать международного давления."
 DNZ_strenghten_the_security_apparatus:0 "Усилить шуцполицию"
 DNZ_strenghten_the_security_apparatus_desc:0 "Чтобы и дальше укреплять нашу самооборону против локальной [POL.GetADjective] агрессии, мы увеличим штат каждого округа безопасности и при необходимости создадим новые."
 DNZ_dissolve_the_zentrum_party:0 "Распустить Центрумспартай"
 DNZ_dissolve_the_zentrum_party_desc:0 "Партия Центрум лишь привносит в политические дискуссии пустые идеалы и шаткие убеждения. Пришло время полностью удалить её из Сената."
 DNZ_planned_militarization:0 "Милитаризировать шуцполицию"
 DNZ_planned_militarization_desc:0 "Чтобы переход от полицейских сил к военным прошёл максимально гладко, мы будем регулярно проводить совещания и лекции по новейшей военной тактике и боевым построениям."
 DNZ_danzig_military_institute:0 "Данцигский военный институт"
 DNZ_danzig_military_institute_desc:0 "Мы должны следить за военными достижениями иностранных государств и внедрять их в собственной армии!"
 DNZ_smuggle_weapons:0 "Использовать иностранное вооружение"
 DNZ_smuggle_weapons_desc:0 "Хотя печальная и утомительная Лига Наций юридически не разрешает нам производить оружие на месте, мы начнём получать вооружение из Отечества и создадим небольшие склады снабжения по всему Данцигу."
 DNZ_home_defense_unit:0 "Силы самообороны Данцига"
 DNZ_home_defense_unit_desc:0 "Пока наши силы шуцполиции продолжают модернизироваться и расширяться, некоторые представители руководства НСДАП считают, что их будет недостаточно для грядущей борьбы. Некоторые даже утверждают, что полиция уклонится от своих обязанностей. Поэтому мы создадим собственные силы самообороны, напрямую подчинённые руководству данцигской НСДАП."
 DNZ_equipment_effort:0 "Модернизировать оснащение"
 DNZ_equipment_effort_desc:0 "Пределы того, какое снаряжение может нести пехота, постоянно расширяются. Мы сосредоточимся на обеспечении войск лучшими доступными средствами."
 DNZ_motorization_effort:0 "Моторизировать армию"
 DNZ_motorization_effort_desc:0 "Мобильность и защита крайне важны для безопасной доставки пехоты на поле боя и её вывода оттуда. Развитие этих направлений позволит нам действовать быстро."
 DNZ_doctrine_effort:0 "Разработать новую тактику"
 DNZ_doctrine_effort_desc:0 "Военные доктрины, определявшие наземные бои Великой войны, устарели. Мы должны поручить лучшим умам сформировать военную мысль будущего."
 DNZ_equipment_effort_3:0 "Развивать местную артиллерию"
 DNZ_equipment_effort_3_desc:0 "Вместо копирования или закупки иностранного оснащения мы должны стать мировым лидером в области пехотного вооружения."
 DNZ_armor_effort:0 "Разрабатывать бронетехнику"
 DNZ_armor_effort_desc:0 "Применив знания, полученные при механизации пехоты, мы сможем улучшить и нашу бронетехнику."
 DNZ_special_forces:0 "Силы специального назначения"
 DNZ_special_forces_desc:0 "Нам нужны элитные войска; горные части и десантники должны стать нашим приоритетом."
 DNZ_aviation_effort:0 "Основать авиационную школу"
 DNZ_aviation_effort_tt:0 "Недостаточно ячеек строительства для §Yавиабазы§!"
 DNZ_aviation_effort_desc:0 "Нигде технологический прогресс не идёт так быстро, как в воздушной войне. Авиация — область, которой обязана овладеть любая современная нация."
 DNZ_fighter_focus:0 "Ставка на истребители"
 DNZ_fighter_focus_desc:0 "Воздушные дуэли Великой войны были далеко не последними. Опережая других в разработке истребителей, мы получим преимущество в будущем."
 DNZ_bomber_focus:0 "Ставка на бомбардировщики"
 DNZ_bomber_focus_desc:0 "Когда люди будущего будут говорить об ужасах нынешних войн, одним из главных образов станет огонь, падающий с небес. Мы сделаем всё, чтобы именно наши враги рассказывали эти истории."
 DNZ_aviation_effort_2:0 "Изучить иностранную тактику"
 DNZ_aviation_effort_2_desc:0 "Для эффективного взаимодействия военно-воздушных сил с другими родами войск потребуются дальнейшие достижения в авиации."
 DNZ_CAS_effort:0 "Пикирующие бомбардировщики"
 DNZ_CAS_effort_desc:0 "Современной армии необходима поддержка техники как на земле, так и в воздухе."
 DNZ_rocket_effort:0 "Ракетные двигатели"
 DNZ_rocket_effort_desc:0 "Ракетные и реактивные двигатели позволяют достигать невиданных скоростей как беспилотным, так и пилотируемым аппаратам. Развивая эти технологии первыми, мы сможем застать врага врасплох."
 DNZ_NAV_effort:0 "Морские бомбардировщики"
 DNZ_NAV_effort_desc:0 "Подобно тому как новая морская война идёт под поверхностью воды, часть её разворачивается и в воздухе над морями."
 DNZ_establish_the_danzig_navy:0 "Создать [ROOT.GetAdjective] флот"
 DNZ_establish_the_danzig_navy_desc:0 "Расширение нашего флота должно стать приоритетом. Направим все доступные ресурсы на новые верфи и исследования лёгких надводных кораблей."
 DNZ_flexible_navy:0 "Гибкий флот"
 DNZ_flexible_navy_desc:0 "Переосмысление морской войны с учётом развития подводных лодок позволит нам эффективно наносить удары по вражеским конвоям."
 DNZ_large_navy:0 "Большой флот"
 DNZ_large_navy_desc:0 "Адаптация морских доктрин к использованию крупных кораблей и обеспечению безопасности торговых конвоев многому научит нас относительно того, какие корабли нам нужны."
 DNZ_submarine_effort:0 "Подводная война"
 DNZ_submarine_effort_desc:0 "Подводная война — самое захватывающее развитие военно-морского дела со времён изобретения торпедного катера. Нам следует как защищаться от подводных лодок, так и использовать их против вражеского судоходства."
 DNZ_cruiser_effort:0 "Разработать крейсеры"
 DNZ_cruiser_effort_desc:0 "Прежде чем переходить к исследованиям передовых линкоров, необходимо заменить более лёгкие крейсеры."
 DNZ_destroyer_effort:0 "Разработать эсминцы"
 DNZ_destroyer_effort_desc:0 "Изучая конструкцию и стратегическое применение подводных лодок, мы также узнали, как противодействовать такой тактике. Эсминцы будут играть здесь решающую роль."
 DNZ_capital_ships_effort:0 "Интерес к крупным кораблям"
 DNZ_capital_ships_effort_desc:0 "Страна с наибольшим числом линкоров будет господствовать на морях. Линкоры и авианосцы олицетворяют старое и новое в военно-морском превосходстве."
 autonomy_mandate_city:0 "Мандатный город"
 autonomy_free_city:0 "Вольный город"
 autonomy_protectorate:0 "Протекторат"
 autonomy_r56_defence_pact_member:0 "Участник оборонительного пакта"
 DNZ_commissioner_removed:0 "Комиссар Данцига заменён"
 POL_unlock_pressure_tt:0 "§Y Выполнено одно из условий для фокуса «Давление на Данциг»"
 DNZ_GER_betrayal:0 "Немецкое предательство"
