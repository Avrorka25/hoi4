 CZKE_minority_mobilization_plan_desc:0 "План призыва меньшинств введён в действие."
 CZKE_field_medics:0 "Завершить военный госпиталь Масарика"
 CZKE_field_medics_desc:0 "Военная медицинская служба Чехословакии мирного времени состояла из сети 12 дивизионных госпиталей.\n\nВ 1925 году, к 75-летию президента Томаша Гаррига Масарика, парламент решил построить новый военный госпиталь, однако строительство началось лишь в 1936 году."
 CZKE_field_medics_tooltip_reward:0 "\n§YОпыт армии§! и §Yбонус к исследованиям§!, связанным с §Yполевыми госпиталями§!."
 czke.402.t:0 "Военный госпиталь Масарика в Праге"
 czke.402.d:0 "Военно-медицинские службы мирного времени в так называемой Первой республике состояли из сети 12 дивизионных больниц. Дивизионная больница No. 1 располагался на Карловой площади в Праге, и он стал в то время ведущим военно-медицинским институтом страны.\n\nВ 1925 году, в 75-й день рождения президента Томаша Гаррига Масарика, парламент принял решение о строительстве нового военного госпиталя.\n\nНо строительство новых помещений Масарыкского военного госпиталя началось спустя более десяти лет. Наиболее удачный проект, разработанный архитектором Б. Адамек из Дейвицкого района Праги в 1930 году выполнял обе роли современного медицинского и военного центра с фактическими мобилизационными функциями.\n\nСтроительство началось в марте 1936 года, а первый этап был закончен в 1938 году. Было построено главное здание больницы, включающее хирургические и внутренние клиники, котельные и дома для военных наемников.\n\nВоенный госпиталь «Масарик» был официально открыт 1 августа 1938 года, а первые его пациенты — месяц спустя. Планировались дополнительные расширения; Однако строительство было прервано Второй мировой войной, и госпиталь был оккупирован немецкой армией, которая использовала его в качестве резервного госпиталя (резерв Лазарет I, Праг).\n\nВ настоящее время объект известен как Военно-университетская больница Праги и служит учебным, образовательным и профессиональным медицинским учреждением армии Чешской Республики, которое обеспечивает комплексное медицинское обслуживание на уровне университетских больниц."
 czke.402.a:0 "Открыть военный госпиталь Масарика."
 CZKE_sokol_movement:0 "Поддержать движение «Сокол»"
 CZKE_sokol_movement_desc:0 "Движение «Сокол», названное в честь славянского слова «сокол», — всевозрастная гимнастическая организация, основанная в Праге в 1862 году Мирославом Тыршем и Йиндржихом Фюгнером. Она опиралась на принцип «в здоровом теле — здоровый дух» и сыграла важную роль в возрождении чешской национальной идентичности."
 CZKE_sokol_movement_tooltip_reward:0 "\n§YНациональный дух§!, связанный со §Yстабильностью§! ИЛИ §Yлюдскими ресурсами§!."
 czke.403.t:0 "История движения «Сокол»"
 czke.403.d:0 "Движение «Сокол» было основано в Праге в 1862 году Мирославом Тыршем и Йиндржихом Фюгнером. Оно строилось на принципе «в здоровом теле — здоровый дух» и сыграло важную роль в возрождении чешской национальной идентичности.\n\nПатриотизм проявлялся с самого начала: члены организации участвовали в церемониях, публичных упражнениях и поездках в национальных костюмах.\n\nГлавным мероприятием был всесокольский слёт, проходивший раз в шесть лет. Первый состоялся в июне 1882 года и собрал более 700 участников.\n\nВ межвоенный период движение процветало и насчитывало более миллиона членов. В нём состояли Масарик, Бенеш и другие влиятельные политики.\n\nОднако рост национализма сопровождался дискриминацией и антисемитизмом. Члены «Сокола» участвовали в чехизации немцев в пограничных районах и вместе с другими чешскими и немецкими организациями способствовали межнациональной вражде.\n\n«Сокол» запрещали трижды: в 1915 году, при нацистской оккупации и после прихода коммунистов к власти в 1948 году. После подавления попытки возрождения в 1968 году движение было восстановлено лишь в 1990 году."
 czke.403.a:0 "Поощрять патриотизм."
 czke.403.b:0 "Поддерживать физическую подготовку."
