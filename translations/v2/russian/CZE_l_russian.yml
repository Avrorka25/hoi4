 CZKE_empower_internationalism:0 "Усилить красные профсоюзы"
 CZKE_empower_internationalism_desc:0 "КПЧ была чехословацкой секцией Коммунистического интернационала, а так называемые красные профсоюзы были созданы в 1922 году. К 1928 году партия стала второй по численности секцией Интернационала, насчитывая около 138 000 членов."
 CZKE_empower_internationalism_tooltip_reward:0 "\nВыбор между двумя §Yнациональными духами§!, связанными с §Yкоммунизмом§!."
 czke.404.t:0 "Профинтерн в Чехословакии"
 czke.404.d:0 "Красный интернационал профсоюзов, более известный как Профинтерн, был создан Коминтерном для координации коммунистической деятельности в профсоюзах.\n\nВ 1920-е годы большинство чехословацких профсоюзов, связанных с Профинтерном, отделилось от социал-демократического движения. В октябре 1922 года чешские красные профсоюзы провели съезд и окончательно оформили раскол.\n\nКоммунистическая партия Чехословакии была огромной организацией и в 1922 году заявляла о 170 000 членах.\n\nВо время Великой депрессии красные профсоюзы организовали серию забастовок и демонстраций, сотрудничая с другими профсоюзами.\n\nОдной из крупнейших забастовок Центральной Европы стала акция в Мосте в марте 1932 года. Начавшись как протест уволенных шахтёров рудников «Нельсон» и «Гумбольдт II», она переросла во всеобщую забастовку горного района и демонстрацию более 40 000 человек. В столкновениях с полицией и армией погибли двое, восемнадцать были ранены.\n\nВо второй половине 1930-х красные профсоюзы призывали объединить профсоюзное движение в единый антифашистский фронт. После германской оккупации они были распущены в 1939 году."
 czke.404.a:0 "Усилить влияние красных профсоюзов."
 czke.404.b:0 "Организовать новые профсоюзные забастовки!"
 CZKE_internationalism:0 "Красные профсоюзы"
 CZKE_internationalism_desc:0 "С каждым днём всё больше товарищей присоединяется к интернационалистскому движению."
 CZKE_red_union_strikes:0 "Забастовки красных профсоюзов"
 CZKE_red_union_strikes_desc:0 "Профинтерн организует новые рабочие забастовки."
 CZKE_state_defense_law:0 "Изменить закон о защите государства"
 CZKE_state_defense_law_desc:0 "Чтобы противостоять угрозе гитлеровской Германии, Национальное собрание Чехословацкой Республики приняло новый спорный закон для защиты республики и национальных интересов — закон №131/1936 «О защите государства»."
 CZKE_state_defense_law_tooltip_reward:0 "\n§YПолитическая власть§! ИЛИ национализация §Yпромышленности§! ИЛИ изменение §Yзакона об экономике§! и §Yзакона о торговле§!."
 czke.405.t:0 "Споры вокруг закона №131/1936"
 czke.405.d:0 "Действуй нет. 131/1936 (известный как Закон о государственной обороне) был 3-й и последней поправкой к первоначальному акту 1923 года, который еще больше укрепил полномочия правительства для защиты республики и сохранения демократической системы в Чехословакии во время кризиса.\n\nОсновной целью этого акта было столкновение с военной угрозой для Чехословацкой Республики со стороны гитлеровской Германии. Однако антигерманская направленность закона еще больше обострила этнический конфликт. Это было одной из причин, почему Великобритания отказалась поддержать Чехословакию во время Судетского кризиса и фактически встала на сторону Гитлера.\n\nОдним из (многих) противоречий закона было определение так называемых «государственных ненадежных лиц». У такого человека было несколько ограничений; Например, им не разрешалось вести стратегически важный бизнес или получать важные государственные контракты, но они также могли быть уволены с работы без каких-либо оснований.\n\nКроме того, власти не были обязаны приводить какие-либо основания для своего решения по этому вопросу, и поэтому было допустимо выносить такое решение без какого-либо обоснования. Судебный пересмотр \"статуса ненадежного лица\" невозможен. Все это сделало закон крайне неправомерным.\n\nЗакон также позволил правительству в чрезвычайной ситуации наложить жесткий контроль на все промышленные предприятия, которые он считал необходимыми для своей безопасности.\n\nНесмотря на то, что нельзя отрицать легитимность усилий по обеспечению адекватной защиты Чехословакии от внешних угроз, закон вышел далеко за рамки допустимого в демократическом конституционном государстве.\n\nПо иронии судьбы, акт о государственной обороне оказался эффективным инструментом для вермахта после оккупации 1939 года. Это позволило быстро захватить оружейную промышленность вновь созданного Протектората.\n\nОдин немецкий эксперт по вооружениям назвал его «одним из лучших законов о военной экономике в Центральной Европе» и «образцом жесткой организации, сосредоточенной в одной руке», чтобы эффективно контролировать все отрасли, необходимые для производства оружия.\n\nМинистр национальной обороны Франтишек Махник был одним из величайших сторонников Закона о государственной обороне."
 czke.405.a:0 "Подавить германскую политическую оппозицию."
 czke.405.b:0 "Ввести чрезвычайные меры."
 czke.405.c:0 "Национализировать стратегическую промышленность."
