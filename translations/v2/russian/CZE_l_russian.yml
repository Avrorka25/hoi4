 CZKE_democratic_reforms_tooltip_reward:0 "\nВременный §Yнациональный дух§!, связанный с §Yполитикой§! и необходимый для конституционного решения вопроса этнических немцев."
 czke.406.t:0 "Предотвратить Судетский кризис"
 czke.406.d:0 "Со времени основания Чехословакии в 1918 году значительное немецкое меньшинство воспринимало крайний притеснение и отказ во франшизе. Большинство утверждало, что Судетская область с ее подавляющим этническим немецким большинством и чрезвычайно отличной культурой и экономическим потенциалом должна управлять своими политическими делами автономно.\n\nПоследовательно, чехословацкое правительство отказалось от какого-либо понятия автономии для судетских немцев из-за калечащего эффекта предоставления почти трети автономии страны и контроля над одним из самых важных промышленных центров. Судетские немцы ответили на это усилением политической радикализации.\n\nОдновременное восхождение пангерманского Адольфа Гитлера в Германию в 1933 году, с его риторикой объединения всех немцев по всей Европе против вероломства и «угнетения» славян, сильно тяготело судетских немцев к расистскому и крайне правому национализму. Подавляющее большинство судетских немцев быстро призвало к почти полной автономии или даже независимости от Чехословакии и возможному слиянию в Третий рейх. Ведущим авангардом пангерманского движения была Судетская немецкая партия (СДП) Конрада Генлейна.\n\nМирное сосуществование чехов и немцев в Чехословакии всегда было делом сравнительно небольшой части немецкого и чешского населения под руководством отдельных политиков. В напряжённый период начала 1938 года волны крайнего национализма с обеих сторон усугубили ситуацию.\n\nСледует отметить, что уступок, сделанных чехословацким правительством в конце 1938 года, было бы, скорее всего, достаточно для судетских немцев, если бы они были реализованы до 1938 года.\n\nК сожалению, реформы и проекты законов об автономии пришли в точку невозврата и ничего не могли изменить. Гитлер был полон решимости уничтожить Чехословакию, и СДП Генляйна и обострившийся этнический конфликт имели решающее значение для его планов."
 czke.406.a:0 "Подготовить конституционные реформы."
 CZKE_constitutional_reforms:0 "Конституционная реформа"
 CZKE_constitutional_reforms_desc:0 "Готовится автономия Судет, внедряются новые конституционные реформы и законы."
 CZKE_constitutional_reforms_flag:0 "Новые конституционные реформы"
 CZKE_boycott_press_law:0 "Бойкотировать поправку к закону о печати"
 CZKE_boycott_press_law_desc:0 "Хотя Чехословакия была демократическим государством, ряд спорных законов постепенно сдвигал её к авторитарной демократии. Одним из них был так называемый «Малый закон о печати» №126/1933."
 CZKE_boycott_press_law_tooltip_reward:0 "\nВыбор между двумя видами наград, связанными с §Yполитикой§!."
 czke.407.t:0 "Споры вокруг закона №126/1933"
 czke.407.d:0 "С ростом политического экстремизма Чехословакия ещё в 1923 году приняла закон о защите государства, каравший подрывную деятельность.\n\nНа его основании власти могли приостанавливать выпуск периодики, запрещать печатные материалы, угрожавшие конституционному строю, республике и демократии, а также непристойные публикации.\n\nЦензура усилилась после принятия закона №126/1933, известного как «Малый закон о печати», поскольку он был поправкой к более старому австро-венгерскому законодательству.\n\nВместе с законом №201/1933 о роспуске политических партий и законом №131/1936 о защите государства правительство получило инструменты для подавления и германских националистов, и коммунистов.\n\nЭта модель авторитарной демократии должна была укрепить связи с союзниками, стабилизировать внутреннюю политику и подготовить оборону против нацистской Германии.\n\nНеудивительно, что все нечешские партии резко критиковали закон, поскольку власти часто цензурировали немецкую, словацкую и венгерскую прессу.\n\nВо время парламентских дебатов СДП и коммунисты неожиданно выступили единым фронтом, ведь коммунистическая газета «Руде право» также неоднократно запрещалась."
 czke.407.a:0 "Парламентские обструкции."
 czke.407.b:0 "Призвать к демонстрациям."
 CZKE_press_law_idea:0 "Закон о печати"
 CZKE_press_law_idea_desc:0 "Закон №126/1933 действует."
 CZKE_communist_obstructions_idea:0 "Коммунистические парламентские обструкции"
 CZKE_communist_obstructions_idea_desc:0 "Коммунистическая партия блокирует принятие Малого закона о печати."
 CZKE_state_defense_guard:0 "Создать Стражу обороны государства"
 CZKE_state_defense_guard_desc:0 "Стража обороны государства была военизированной службой, созданной в 1936 году для защиты границ Чехословакии. В неё входили местные полицейские, финансовая стража, государственная полиция, а позднее и лояльные граждане."
 CZKE_state_defense_guard_tooltip_reward:0 "\n\n§YАнтипартизанская§! связанный §YНациональная идея§! и §YВоенная полиция§! связанный §YИсследовательский бонус§!."
 czke.408.t:0 "Создание Стражи обороны государства"
 czke.408.d:0 "В 1918–1936 годах границу Чехословакии охраняла финансовая стража — вооружённое подразделение Министерства финансов, для которого таможенная служба была главной задачей, а охрана границы — второстепенной. Армия и полиция давно предлагали создать более боеспособную организацию, и на фоне международной напряжённости в 1937 году была создана новая служба.\n\nСтража обороны государства, по-чешски Stráž obrany státu, SOS, была учреждена в октябре 1936 года. Её задачами стали охрана границы, поддержание порядка и содействие таможенной службе.\n\nВ состав входили местные полицейские, финансовая стража и государственная полиция, а позднее — лояльные граждане, включая членов «Сокола» и антифашистски настроенных немцев.\n\nПланировалось создать 38 батальонов, но было сформировано 31. Они вооружались пистолетами, винтовками, ручными пулемётами и гранатами.\n\nС ростом напряжённости стража была развёрнута на границе в мае 1938 года и оставалась там до передачи Судет Германии. В сентябре она вела локальные бои с Судетонемецким фрайкором и германскими диверсантами. После потери приграничья части отошли на новые рубежи.\n\nЗа время существования службы в 1936–1939 годах погибло 312 её членов."
 czke.408.a:0 "Создать Стражу обороны государства"
 CZKE_sos:0 "Стража обороны государства"
 CZKE_sos_desc:0 "Стража обороны государства создана и охраняет границы Чехословакии."
 CZKE_national_unity_government:0 "Создать Партию национального единства"
 CZKE_national_unity_government_desc:0 "Партия национального единства была создана в ноябре 1938 года после германской оккупации как последняя попытка спасти Чехословакию.\n\nВ неё вошли почти все правоцентристские партии и Чехословацкая национально-социалистическая партия."
 CZKE_national_unity_government_tooltip_trigger:0 "§YЯлтинская конференция§! не состоялась"
 CZKE_national_unity_government_tooltip_reward:0 "\n§OОсобый бонус:§! устраняет §Yштрафы меньшинств§! и изменяет §Yправительство§!."
 czke.409.t:0 "Создана Партия национального единства"
 czke.409.d:0 "В надежде успокоить немцев после Мюнхенского соглашения Рудольф Беран собрал большую часть несоциалистических партий страны в Партию национального единства, с собой в качестве лидера. Он также подверг прессу строгой цензуре. Он, однако, председательствовал на предоставлении словакам и русинам давних требований автономии. Ни одна из этих мер не была достаточной, чтобы помешать Словакии выйти 14 марта или Германии оккупировать остальную часть страны через день. Он был первым премьер-министром Протектората Богемии и Моравии до своей отставки 27 апреля 1939 года.\n\nПосле войны Беран был арестован коммунистическими властями в качестве коллаборациониста и приговорен к двадцати годам тюремного заключения. Скончался в Леопольдовской тюрьме в 1954 году."
 czke.409.a:0 "Так и быть."
 CZKE_national_unity_government_idea:0 "Правительство национального единства"
 CZKE_national_unity_government_idea_desc:0 "Новое правительство сформировано в последней попытке спасти республику."
 CZKE_sudetenland_autonomy:0 "Автономия германских регионов"
 CZKE_sudetenland_autonomy_desc:0 "Планы предоставить отдельным регионам Чехословакии, включая Судеты, более широкую автономию существовали с начала 1920-х годов, но внутренняя политика блокировала эти инициативы. Возможно, автономия германских районов спасла бы тысячи или даже миллионы жизней."
 CZKE_levy_liechtenstein_properties:0 "Обложить налогом [LIE.GetAdjective]ую собственность"
 CZKE_levy_liechtenstein_properties_desc:0 "Государство [LIE.GetNameDefCap] владеет несколькими объектами собственности в нашей стране. Повышение налогов на них принесёт нам выгоду."
 CZKE_sudetenland_autonomy_tooltip_reward:0 "\nВыбор между двумя видами §Yавтономии Судет§!."
 czke.410.t:0 "Предоставить Судетам автономию"
 czke.410.d:0 "После многих месяцев переговоров и подготовки новых конституционных законов и норм защиты меньшинств пришло время определить форму и степень автономии районов с преимущественно немецким населением."
 czke.410.a:0 "Ограниченной автономии будет достаточно."
 czke.410.b:0 "Судетам потребуется более широкая автономия."
 CZKE_higher_autonomy_reward_1:0 "\nРегионы §YСудеты§! и §YВосточные Судеты§! больше не являются национальными территориями Чехословакии."
 CZKE_higher_autonomy_reward_2:0 "\nНационализированная промышленность возвращается германским владельцам (§G-2§! §Yфабрики§! в §YСудетах§!)."
 CZKE_content_minorities:0 "Довольные меньшинства"
 CZKE_content_minorities_desc:0 "Основные проблемы Судет решены, а этническим немцам предоставлена широкая автономия. Чехословакия кажется сильнее, чем когда-либо."
 CZKE_partial_mobilization:0 "Объявить частичную мобилизацию"
 CZKE_partial_mobilization_desc:0 "Весной 1938 года политическая ситуация в Чехословакии ухудшилась настолько, что правительство объявило частичную мобилизацию.\n\nБыли призваны резервисты и заранее отобранные военные специалисты, и численность армии вскоре достигла около 383 000 человек."
 CZKE_partial_mobilization_tooltip_reward:0 "\nБесплатное изменение §Yзакона об экономике§!."
 czke.411.t:0 "Приказ о частичной мобилизации"
 czke.411.d:0 "Ссылаясь на враждебные манёвры вермахта в [GetDateText], пражское правительство отреагировало на сообщения о концентрации германских войск у границы и приказало министру национальной обороны Франтишеку Махнику призвать резервистов и заранее отобранных специалистов.\n\nРезервисты прибыли быстро и с энтузиазмом. После месяцев бездействия, неопределённости и унижения путь казался ясным: Чехословакия — не Австрия и не исчезнет без организованной борьбы за свободу.\n\nГитлер был взбешён смелостью Праги, а майский кризис лишь укрепил его решение уничтожить Чехословакию. Быстрая мобилизация нанесла удар по германскому престижу. Он переписал директиву операции «Грюн», начав её словами: «Моё неизменное намерение — в ближайшем будущем сокрушить Чехословакию военной силой...»"
 czke.411.a:0 "Мы не капитулируем!"
 czke.412.t:0 "Чехословакия объявляет частичную мобилизацию"
 czke.412.d:0 "Ссылаясь на враждебные манёвры вермахта в ночь на [GetDateText], пражское правительство отреагировало на сообщения о концентрации германских войск у границы и приказало призвать резервистов и военных специалистов.\n\nГерманская дипломатия ответила яростью. Посланник Германии в Праге Эрнст Айзенлор отрицал концентрацию войск и назвал обвинения «grober Unsinn» — полной чепухой."
 czke.412.a:0 "Добром это не кончится."
 CZKE_partial_mobilization_1938:0 "Мобилизационные усилия"
 CZKE_partial_mobilization_1938_desc:0 "Правительство издало приказ о частичной мобилизации."
 CZKE_military_coup:0 "Военный переворот"
 CZKE_military_coup_desc:0 "Недовольные политической обстановкой и умиротворением со стороны западных союзников, некоторые высокопоставленные офицеры чехословацкой армии могли решиться на военный переворот как последнюю попытку спасти республику."
 CZKE_military_coup_tooltip_reward:0 "\nВыбор между двумя видами §Yвоенного правительства§!."
 CZKE_military_coup_tt:0 "Имеет не менее §Y40% военной мощи§! по сравнению с §YГерманским рейхом§!"
 czke.413.t:0 "Легионерский переворот"
 czke.413.d:0 "Возмущённые тем, как дипломаты и политики справлялись с международным кризисом, и уставшие от политики умиротворения западных союзников, радикальные круги чехословацкой армии при широкой поддержке населения совершили мирный переворот ради спасения республики.\n\nГенерала Сырового вызвали в Пражский град, чтобы успокоить демонстрантов, скандировавших «Дайте нам оружие или Сырового!» и «Да здравствует армия, мы хотим генерала Сырового!».\n\nПожилой герой битвы при Зборове неохотно согласился занять пост премьер-министра и сформировал временное правительство."
 czke.413.a:0 "Сформировать новое военное правительство."
 CZKE_militarism_focus:0 "Правительство обороны республики"
 CZKE_militarism_focus_desc:0 "Создано временное коалиционное правительство широкого состава."
 CZKE_militarism_focus_2:0 "Легионерское правительство"
 CZKE_militarism_focus_2_desc:0 "Более радикальные элементы вооружённых сил теперь контролируют правительство."
 CZKE_oppressed_minorities:0 "Военное положение"
 CZKE_oppressed_minorities_desc:0 "В Судетах и других регионах, населённых этническими меньшинствами, введено военное положение."
 CZE_republic_defense_party:0 "Правительство обороны республики"
 CZE_legionary_party:0 "Легионерское правительство"
 CZKE_radola_gajda_general_tooltip:0 "§YРадола Гайда§!: фельдмаршал (наступательная доктрина)\n"
 legionary_government:0 "Легионеры контролируют правительство"
 republic_defense_government:0 "Сформировано правительство национальной обороны"
 CZKE_lev_prchala_general:0 "Лев Прхала"
 CZKE_lev_prchala_general_desc:0 "Генерал Прчала был стойким противником мюнхенской капитуляции и командующим IV. Армия, охранявшая южно-моравскую границу в 1938 году.\n\nЕго также подозревали в формировании плана военного переворота."
 CZKE_zaolzie_for_alliance:0 "Заользье в обмен на союз с Польшей"
 CZKE_zaolzie_for_alliance_desc:0 "Заользье оставалось спорной территорией между Чехословакией и Польшей с 1920 года. Пора решить этот вопрос и объединить силы против фашистов и коммунистов."
 CZKE_zaolzie_for_alliance_tooltip_reward_1:0 "\n§YДипломатическое событие§! для §YПольши§! с предложением окончательно решить вопрос Тешинской Силезии.\n"
 CZKE_zaolzie_for_alliance_tooltip_reward_2:0 "\n§YПольша§! вступает в §YМалую Антанту§! в обмен на регион §YЗаользье§! (шанс 80%)."
 czke.414.t:0 "История польско-чехословацкого спора за Заользье"
 czke.414.d:0 "Польско-чехословацкая война была локальным вооружённым конфликтом между недавно созданными Чехословакией и Польшей за Тешинскую Силезию в 1919 году. В некоторых чешских источниках она называется «Семидневной войной» из-за своей краткости.\n\nГлавное значение региона определяли богатый угольный бассейн возле Карвины и важная железная дорога Кошице — Богумин, связывавшая чешские земли со Словакией. Узел в Богумине также был важным международным транспортным центром.\n\nПоводом к войне стала подготовка польских парламентских выборов на спорной территории, где по временному соглашению ни одна сторона не должна была осуществлять суверенную власть.\n\nПольское правительство отказалось прекратить подготовку, и Чехословакия решила остановить её силой. Поскольку большая часть польских войск сражалась с Западно-Украинской Народной Республикой за Восточную Галицию, чехословацкая армия быстро получила преимущество. Однако Антанта заставила остановить наступление и установить новую демаркационную линию под международным контролем.\n\nОкончательное разделение состоялось в июле 1920 года на конференции в Спа. Железная дорога и территории южнее неё отошли Чехословакии, а земли севернее — Польше. Чехословацкую часть стали называть Заользьем, то есть «землями за Олзой».\n\nПольша ненадолго оккупировала регион во время Мюнхенского кризиса. Позднее он вошёл в состав независимой Словакии, а после Второй мировой войны вернулся под контроль Чехословакии. Спор окончательно урегулировали в 1958 году."
 czke.414.a:0 "Окончательно решить вопрос Тешинской Силезии."
 czke.415.t:0 "Чехословакия предлагает Заользье в обмен на военный союз"
 czke.415.d:0 "Чехословацкое правительство сообщило, что желает решить спор по Заользью. Оно готово уступить регион в обмен на нашу военную поддержку в рамках Малой Антанты."
 czke.415.a:0 "Отлично."
 czke.415.b:0 "Ни за что! Скоро мы и так его получим."
 czke.416.t:0 "Польша соглашается"
 czke.416.d:0 "Польское правительство приняло наше предложение. Мы подготовим передачу региона под польский контроль и переселение наших граждан и военнослужащих."
 czke.416.a:0 "Отлично."
 czke.417.t:0 "Польша отказывается"
 czke.417.d:0 "Польское правительство не заинтересовалось нашим предложением. Однако оно ясно дало понять, что по-прежнему считает Заользье своей территорией и требует его без каких-либо условий."
 czke.417.a:0 "Проклятые поляки!"
 CZKE_together_against_berlin:0 "Вместе против Берлина"
 CZKE_together_against_berlin_desc:0 "Германское правительство постоянно угрожает недавно обретённой независимости Чехословакии и Польши. Лучшей защитой от этого зла станет упреждающий удар, который сорвёт планы Германии по расширению."
 CZKE_czech_fascism_onrise:0 "Объединить Национальную фашистскую общину"
 CZKE_czech_fascism_onrise_desc:0 "Главным крайне правым движением Чехословакии была Национальная фашистская община, созданная по образцу Национальной фашистской партии Бенито Муссолини и насчитывавшая около 200 000 сторонников в 1926 году.\n\nВ Словакии крайне правое движение в основном представляли христианские националисты из Словацкой народной партии Глинки."
 CZKE_czech_fascism_onrise_tooltip_reward:0 "\nВыбор между двумя видами поддержки §Yчешского фашизма§!."
 czke.418.t:0 "Фашизм в межвоенной Чехословакии"
 czke.418.d:0 "Национальная фашистская община, Národní obec fašistická, была чехословацким фашистским движением под руководством Радолы Гайды, вдохновлённым фашизмом Бенито Муссолини. Партия возникла в марте 1926 года путём объединения диссидентов Национально-демократической партии, известных как «красно-белые», с другими правыми группами Богемии и Моравии.\n\nДвижение отличалось сильной антигерманской направленностью, сохранившейся даже после прихода Гитлера к власти. Образцом служила Италия, что резко отличало НФО от её главного соперника «Влайки», ориентированной на Гитлера.\n\nОбъектами критики НФО были евреи, коммунисты, чехословацкое правительство и венгры. Партия создала молодёжное крыло и небольшое профсоюзное движение.\n\nОна также выступала за панславизм и надеялась вместе с Польшей возглавить великий славянский союз, который свергнет коммунизм в СССР. В экономике она поддерживала корпоративизм и крупный аграрный сектор. НФО привлекла часть ветеранов Чехословацких легионов.\n\nПартия не смогла сохранить поддержку и на выборах 1935 года получила лишь 2% голосов и семь мест. Во время германской оккупации её распустили.\n\nБольшую часть времени НФО возглавлял бывший генерал и герой российских легионов Радола Гайда. В 1933 году его ненадолго заключили в тюрьму, лишили звания и пенсии из-за скандала с «Жиденицким мятежом», неудачной попыткой фашистского переворота.\n\nВо время оккупации 1939–1945 годов Гайда отошёл от политики, иногда помогал сопротивлению переправлять офицеров в Польшу и скрывал деятельность сына. Гестапо расследовало его действия, но не арестовало.\n\nПосле войны Гайду заключил НКВД и подверг жёстким допросам. В апреле 1947 года его судили за «пропаганду фашизма и нацизма». Обвинение требовало пожизненного срока, но доказательства были сомнительными. Он получил два года, вскоре вышел на свободу и умер спустя несколько месяцев в бедности и забвении."
 czke.418.a:0 "Использовать антикоммунистическую риторику."
 czke.418.b:0 "Сплотить антигерманских сторонников."
 demoted_general:0 "Амбициозный бывший генерал"
 czke.419.t:0 "Подъём чешского фашизма"
 czke.420.t:0 "Фашистские симпатии среди бывших легионеров"
 czke.421.t:0 "Фашистский переворот"
 czke.422.t:0 "Гражданская война за чешский фашизм"
 czke.423.t:0 "Созданы гвардии Гайды"
 czech_fascist_assault_divisions:0 "Гвардии Гайды"
 czech_fascist_assault_divisions_desc:0 "Гвардии Гайды, по-чешски Gajdovy Gardy, были военизированным крылом НФО и часто состояли из бывших легионеров."
 czke.424.t:0 "Угроза коммунизма"
 czke.425.t:0 "Угроза национал-социализма"
 czke.425.d:0 "«[Root.GetLeader] хочет заставить вас поверить, что государство [Root.GetNameDef] безопасно и едино. Неудивительно, что эта ложь отравила умы людей, когда рядом свернулась змея! Достаточно взглянуть за границу, где соотечественники повернулись друг против друга во имя национал-социализма и объявили конец наций. Сколько времени пройдёт, прежде чем они объявят мёртвой и нашу страну? Защитит ли нас партия [Root.GetRulingParty]?»\n\nПангерманская риторика Гитлера способствовала росту чешского фашистского движения в государстве [ROOT.GetNameDef]. Многие умеренные, которые обычно отвергли бы фашизм как очередной ошибочный эксперимент, теперь видят в нём ответ на реальную угрозу. Выбирая между коммунизмом соседей и фашистским режимом, они признаются, что предпочли бы последний и, возможно, даже активно его поддержали."
 czke.425.a:0 "Мы станем авангардом борьбы против германского национал-социализма!"
 czke.426.t:0 "Чешские фашисты требуют референдума"
 czech_fascist_revolutionaries:0 "Чешские фашистские революционеры"
 czech_fascist_revolutionaries_desc:0 "Если поддержка нейтралитета превысит 70%, страна погрузится в гражданскую войну. Если она упадёт ниже 30%, революционная активность прекратится."
 czke.427.t:0 "Фашисты идут на Прагу"
 czke.428.t:0 "Гайда высмеян"
 CZKE_ban_communism:0 "Укрепить чехословацкое государство"
 CZKE_ban_communism_desc:0 "Фашисты Чехословакии десятилетиями мечтали о сильном национальном государстве. Наконец пришло время воплотить мечты в реальность."
 CZKE_ban_communism_tooltip_reward:0 "\nВыбор между тремя §Yнациональными духами§!, связанными с §Yфашизмом§!."
 removes_communism_ideas:0 "Удаляет все §Yнациональные духи§!, связанные с §Yкоммунизмом§!"
 czke.429.t:0 "Фашистское чехословацкое государство"
 czke.429.d:0 "Национальная фашистская община была вдохновлена итальянским фашизмом и приспособлена к чешским условиям. Она требовала сильного национального государства на корпоративных принципах и сочетала это с ярко выраженной антигерманской позицией.\n\nЧешский фашизм заявлял, что стоит выше социальных классов, и требовал подчинения личных и классовых интересов нуждам всей нации. Это выражал девиз НФО: «Благо народа да будет высшим законом».\n\nПанславизм был общей темой, а из-за большого числа бывших легионеров движение отличалось крайним антикоммунизмом.\n\nМолодёжные организации должны были воспитывать новое поколение послушных граждан и солдат.\n\nПо представлениям руководителей НФО, правительство состояло бы из восьми министров и экспертов исключительно чешского или словацкого происхождения. Немцам, венграм и евреям запрещалось занимать государственные должности, хотя гражданские права формально гарантировались.\n\nНФО также выступала за ограничения крупного бизнеса, картелей и монополий. Государственная и частная экономика должны были обеспечивать самообеспечение и равновесие производства и потребления.\n\nВ целом чешские фашисты мечтали о полностью нереалистичном государстве, но история не дала им возможности доказать свою неправоту."
 czke.429.a:0 "Изгнать представителей меньшинств с государственных должностей."
 czke.429.b:0 "Поддержать фашистские молодёжные движения."
 czke.429.c:0 "Искоренить коммунистов."
 CZKE_anti_communism:0 "Преследование коммунистов"
 CZKE_anti_communism_desc:0 "Фашистские группы Чехословакии могли быть как антинацистскими, так и пронацистскими, но все они были антикоммунистическими."
 CZKE_military_youth_idea:0 "Фашистские молодёжные движения"
 CZKE_military_youth_idea_desc:0 "В Чехословакии создано несколько фашистских молодёжных организаций."
 CZKE_join_axis:0 "Сделка с дьяволом"
 CZKE_join_axis_desc:0 "Отложив вражду с Германией, Чехословакия должна присоединиться к Антикоминтерновскому пакту и поднять оружие против большевиков, как это сделали Чехословацкие легионы в России двадцать лет назад."
 CZKE_join_axis_tooltip_reward:0 "\n§YДипломатическое событие§! для §YГерманского рейха§! с предложением решить вопрос судетских немцев.\n"
 CZKE_join_axis_tooltip_reward_2:0 "\nШанс для §YЧехословакии§! вступить в §YОсь§!."
 czke.430.t:0 "Вассал Германского рейха"
 czke.430.d:0 "Наши так называемые западные союзники бросили нас, и мы остались одни перед мощью Германского рейха. Возможно, разумнее поставить интересы государства выше внутренних споров и договориться с Гитлером. В конце концов, красная угроза кажется куда опаснее, и многие братья-легионеры хорошо помнят годы борьбы с большевиками в России."
 czke.430.a:0 "Пригласить господина Риббентропа в Прагу."
 CZKE_seek_accommodation_with_germany:0 "Вступить в Антикоминтерновский пакт"
 czke.431.t:0 "Чехословакия ведёт переговоры"
 czke.431.d:0 "В Чехословакии произошёл интересный поворот. Наш посол в Праге сообщает, что после ухода Эдварда Бенеша новое руководство готово пойти на компромисс.\n\nВозможно, такое соглашение позволит избежать ненужного кровопролития. Что нам делать?"
 czke.431.a:0 "Отправить Риббентропа в Прагу."
 czke.431.b:0 "Ничего не делать; Чехословакия будет уничтожена."
 czke.432.t:0 "Дипломатические переговоры в Праге"
 czke.432.d:0 "После нескольких дней переговоров ясно, что немцев не интересует лишь дипломатическое решение Судетского вопроса. Они выдвинули ряд жёстких требований и пригрозили войной в случае провала переговоров."
 czke.432.a:0 "Мы вынуждены согласиться."
 czke.432.b:0 "Это неприемлемо!"
 CZKE_reich_support:0 "Промышленная поддержка Германского рейха"
 CZKE_reich_support_desc:0 "Заводы «Шкода» и другие оружейные компании теперь производят снаряжение для вермахта."
 CZKE_czech_industry_bonus:0 "Чехословацкая промышленность"
 CZKE_czech_industry_bonus_desc:0 "Чехословацкая промышленность производит военные материалы для вермахта."
 CZKE_svatoplukovy_gardy:0 "Гвардии Святоплука"
 CZKE_svatoplukovy_gardy_desc:0 "Гвардии Святоплука, по-чешски Svatoplukovy Gardy, были военизированным крылом «Влайки», созданным по образцу СА."
 CZKE_czechoslovak_protectorate:0 "Чехословацкий протекторат"
 CZKE_czechoslovak_protectorate_desc:0 "Большая часть чехословацкой военной промышленности работает на германскую военную машину."
 CZKE_higher_autonomy_reward_1_b:0 "\nРегионы §YСудеты§! и §YВосточные Судеты§! больше не являются национальными территориями Чехословакии.\n\n"
 czke.433.t:0 "Нет ответа"
 czke.433.d:0 "Мы до сих пор не получили ответа от германской стороны. Это может означать только одно."
 czke.433.a:0 "Объявить всеобщую мобилизацию"
 CZKE_nazi_puppet:0 "Под защитой рейха"
 CZKE_nazi_puppet_desc:0 "Теперь ясно, что мы больше не можем сопротивляться Германскому рейху. Чтобы сохранить Чехословакию, необходимо договориться с Германией."
 CZKE_nazi_puppet_tooltip_reward:0 "\n§OОсобый бонус:§! пронацистские коллаборационисты попытаются совершить переворот при поддержке §YГерманского рейха§!. В случае успеха будет установлено §Yмарионеточное правительство§!."
 czke.434.t:0 "Чехословацкий протекторат"
 czke.434.d:0 "Теперь ясно, что мы не можем сопротивляться Германскому рейху. Западные союзники предали нас, а большевики угрожают всем. Некоторые националистические движения, например «Влайка», хотят отказаться от антигерманского курса и заключить соглашение с рейхом.\n\nКто-то назовёт их предателями и нацистскими пособниками, но такие люди, как Ян Рыс-Розсевач, мечтают построить новую и сильную Чехословакию.\n\nИсторически «Влайка» была радикальным фашистским движением, которое под влиянием Рыс-Розсевача перешло от традиционного чешского антигерманского шовинизма к сотрудничеству с нацистами и гестапо.\n\nСначала оккупационные власти поддерживали эту группу и использовали её в пропаганде. Однако после утраты полезности «Влайка» была распущена в конце 1942 года, а лидеров, включая Рыс-Розсевача, отправили в Дахау.\n\nПосле войны Рыс-Розсевач и другие члены движения были приговорены к смерти."
 czke.434.a:0 "Присягнуть на верность Германскому рейху."
 CZE_vlajka_party:0 "ЧНСТ — «Влайка»"
 CZE_vlajka_party_long:0 "Чешский национально-социалистический лагерь — «Влайка»"
 removes_anti_fascist_ideas:0 "\n§OОбъявляет военное положение§! и удаляет §Yнациональные духи§!, связанные с антифашизмом, коммунизмом или демократией.\n\n"
 czke.435.t:0 "Чехословакия ищет защиты"
 czke.435.d:0 "Радикальные фашистские круги Чехословакии во главе с господином Розсевачем из «Влайки» хотят захватить власть и создать правительство на национал-социалистических принципах.\n\nСтрана находится в международной изоляции, а внутренняя борьба даёт уникальную возможность подчинить её. Однако «Влайке» нужна наша помощь в организации переворота и установлении контроля после него.\n\nКаковы ваши приказы?"
 czke.435.a:0 "Поддержать «Влайку»."
 czke.435.b:0 "У нас другие планы на Чехословакию."
 czke.436.t:0 "«Влайка» захватывает власть в Чехословакии"
 czke.436.d:0 "С германской поддержкой мы установим контроль над страной за считанные дни. Наши отряды должны арестовать всех смутьянов до того, как они сбегут и начнут изображать героев в изгнании."
 czke.436.a:0 "Совершить переворот."
 czke.437.t:0 "Германия не заинтересована"
 czke.437.d:0 "Германское руководство не заинтересовалось нашим предложением. Мы остались одни."
 czke.437.a:0 "Чехословакия обречена."
 CZKE_petition_league_of_nations:0 "Обратиться в Лигу Наций"
 CZKE_petition_league_of_nations_desc:0 "Поскольку этнического кризиса удалось избежать, следует пригласить международную комиссию для проверки заявлений о положении немцев и этническом угнетении в Чехословакии."
 CZKE_petition_league_of_nations_tooltip_reward:0 "\n§OОсобый бонус:§! Великобритания и Франция поддержат чехов на Мюнхенской конференции."
 czke.438.t:0 "Миссия Ренсимена в Чехословакии"
 czke.438.d:0 "Миссия Ренсимена была инициативой британского правительства, направленной на разрешение международного кризиса, угрожавшего войной в Европе летом 1938 года. Её возглавлял бывший министр лорд Ренсимен, посредничавший между правительством Чехословакии и Судетонемецкой партией, представлявшей радикализированное немецкое меньшинство.\n\nДоклад миссии, направленный британскому и чехословацкому премьер-министрам [GetDateText], был крайне враждебен к Праге и рекомендовал немедленно передать Германии территории с немецким большинством. Хотя в нём руководство СДП обвинялось в срыве переговоров и признавалось, что «Четвёртый план» Бенеша удовлетворял почти все требования, Ренсимен всё же сочувствовал судетским немцам и заявлял, что «тяжело находиться под властью чужой расы». Чешское правление он называл не террористическим, но характеризовал как нетактичное, непонимающее, мелочно нетерпимое и дискриминационное.\n\nЕсли бы чехословацкое правительство решило Судетский вопрос до эскалации конфликта, доклад, вероятно, оказался бы благоприятнее для чешской стороны. В таком случае Великобритания и Франция могли бы решительнее поддержать Чехословакию против Гитлера."
 czke.438.a:0 "Пригласить лорда Ренсимена в Судеты."
 CZKE_join_allies:0 "Искать сотрудничества с союзниками"
 CZKE_join_allies_desc:0 "Нам следует вступить в союз, вместе противостоять угрозе нацистской Германии и остановить Гитлера, пока не стало слишком поздно."
 CZKE_join_allies_tooltip_reward:0 "\nШанс для §YЧехословакии§! вступить в §YСоюзники§!."
 CZKE_join_allies_tt:0 "Состоит в альянсе с §YВеликобританией§! или §YФранцией§!."
 czke.439.t:0 "Чехословакия хочет вступить в Союзники"
 czke.439.d:0 "Агрессия Германского рейха не знает границ. Лорд Ренсимен сообщает, что положение в Чехословакии далеко от того, что утверждает господин Гитлер.\n\nЧехословакия — последняя стабильная демократия Центральной Европы и отчаянно нуждается в нашей помощи против германской агрессии. Как ответить?"
 czke.439.a:0 "Пригласить их в Союзники."
 czke.439.b:0 "Чехи предоставлены сами себе."
 CZKE_seek_accommodation_with_britain:0 "Чехословацко-британские дипломатические усилия"
 czke.440.t:0 "Британия принимает нашу просьбу"
 czke.440.d:0 "Рады сообщить, что Британия приняла нас в Союзники."
 czke.440.a:0 "Возможно, надежда ещё есть."
 czke.441.t:0 "Британия отклоняет нашу просьбу"
 czke.441.d:0 "К сожалению, похоже, Британия пока не хочет принимать нас в Союзники."
 czke.441.a:0 "Это крайне прискорбно."
 CZKE_strengthen_communism:0 "Усилить Коммунистическую партию"
 CZKE_strengthen_communism_desc:0 "Коммунисты всегда стремились к власти в Чехословакии. В 1929 году Клемент Готвальд стал генеральным секретарём после чистки оппозиции. Хотя до Мюнхена партия не входила в правительство и была запрещена в 1938 году, в 1948 году коммунисты под руководством Готвальда захватили власть."
 CZKE_strengthen_communism_tooltip_reward:0 "\nБесплатный §Yкоммунистический революционер§!."
 CZKE_five_year_plan_tooltip_trigger:0 "§YЯлтинская конференция§! состоялась"
 czke.442.t:0 "Коммунизм в межвоенной Чехословакии"
 czke.442.d:0 "Создание коммунистической партии в Чехословакии происходило постепенно под постоянным давлением и руководством Коминтерна в 1919–1921 годах. Когда КПЧ была наконец учреждена, она стала компромиссом между догматической линией Коминтерна и более умеренными взглядами первого лидера партии Богумила Шмераля.\n\nОрганизация строилась на ленинском принципе демократического централизма: руководителей формально избирали, но каждый уровень полностью подчинялся вышестоящему. На практике дискуссии лишь отражали решения узкого круга высших партийных деятелей.\n\nВ 1929 году Клемент Готвальд стал генеральным секретарём после изгнания оппозиционных групп, часть которых поддерживала Льва Троцкого.\n\nНа выборах 1935 года партия сохранила 30 мандатов, получив чуть более 10% голосов. В 1938 году её запретили, но она продолжила существовать в подполье.\n\nВо время Второй мировой войны многие руководители КПЧ укрылись в Советском Союзе, где готовились расширить влияние после войны. Поддерживаемые СССР коммунисты затем провели длительную кампанию, завершившуюся захватом власти в 1948 году."
 czke.442.a:0 "Усилить партию."
 CZKE_peoples_revolution:0 "Создать Народную милицию"
 CZKE_peoples_revolution_desc:0 "Коммунисты пришли к власти в Чехословакии в 1948 году. Но при иной политической обстановке в Европе это могло произойти раньше."
 CZKE_peoples_revolution_tooltip_reward:0 "\nНационализация §Yпромышленности§! ИЛИ §Yнациональный дух§!, связанный с §Yкоммунизмом§!, ИЛИ §Yнациональный дух§!, связанный с §Yлюдскими ресурсами§!."
 czke.443.t:0 "Народная милиция в Чехословакии"
 czke.443.d:0 "Народные милиции, также называвшиеся «вооружённым кулаком рабочего класса», были военизированной организацией Коммунистической партии Чехословакии в 1948–1989 годах.\n\nИх предшественниками были вооружённые отряды заводских рабочих, созданные в июне 1945 года для защиты предприятий от прежних владельцев во время послевоенной национализации.\n\nВ середине февраля 1948 года Центральный комитет КПЧ решил сформировать вооружённые подразделения из членов и сторонников партии. Их поспешно оснастили и привели в готовность во время коммунистического захвата власти в конце февраля, после чего они получили название Народной милиции.\n\nЗадачами были борьба с предполагаемыми партизанами и иностранными агентами, а также сотрудничество с полицией и армией. Около 3000 милиционеров вошли в полицейские силы, а некоммунистов постепенно исключили. Контроль перешёл к Министерству внутренних дел.\n\nВ феврале 1948 года милиция получила 10 000 винтовок и 2000 пистолетов-пулемётов от «Збройовки Брно». Позднее появились снайперские винтовки, пулемёты, миномёты, зенитные пулемёты, транспорт, безоткатные орудия и РПГ-7.\n\nПосле падения коммунистического режима в 1989 году милиции были распущены 21 декабря."
 czke.443.a:0 "Национализировать промышленность, принадлежащую немцам."
 czke.443.b:0 "Преследовать буржуазию и демократическую интеллигенцию."
 czke.443.c:0 "Вооружить Народную милицию."
 CZKE_collectivist_ethos_idea:0 "Демократические чистки"
 CZKE_collectivist_ethos_idea_desc:0 "Ничто не остановит Народную революцию!"
 CZKE_peoples_militia_idea:0 "Народная милиция"
 CZKE_peoples_militia_idea_desc:0 "В Чехословакии создана Народная милиция."
 CZKE_join_commitern:0 "Вступить в Коминтерн"
 CZKE_join_commitern_desc:0 "Клемент Готвальд и другие чехословацкие коммунисты давно мечтали о сильной социалистической республике как одном из ведущих членов Коминтерна."
 CZKE_join_commitern_tooltip_reward:0 "\nШанс для §YЧехословакии§! вступить в §YКоминтерн§!."
 CZKE_join_comitern_tt:0 "Состоит в альянсе с §YСоветским Союзом§!."
 czke.444.t:0 "Чехословакия хочет вступить в Коминтерн"
 czke.444.d:0 "Фашисты угрожают нашему чехословацкому союзнику. Местные коммунисты во главе с Клементом Готвальдом создали сильное движение и теперь официально просят принять их в Коминтерн.\n\nЧто нам делать, товарищ [SOV.GetName]?"
 czke.444.a:0 "Пригласить их в Коминтерн."
 czke.444.b:0 "Чехи предоставлены сами себе."
 CZKE_seek_accommodation_with_USSR:0 "Присоединяйтесь к Коминтерну"
 czke.445.t:0 "Советский Союз соглашается"
 czke.445.d:0 "Рады сообщить, что делегация Советского Союза подтвердила наше членство в Коминтерне."
 czke.445.a:0 "Возможно, надежда ещё есть."
 czke.446.t:0 "Советский Союз отказывает"
 czke.446.d:0 "К сожалению, похоже, мы всё ещё недостойны членства в Коминтерне."
 czke.446.a:0 "Это крайне прискорбно."
 CZKE_faction_research_exchange:0 "Обмен технологиями"
 CZKE_faction_research_exchange_desc:0 "Делясь технологическими достижениями с нашими союзниками, вся наша фракция будет проводить исследования и разработки военного времени более эффективно."
 czke.447.t:0 "Коммунистическая оппозиция бросает вызов руководству КПЧ"
 czke.447.d:0 "Несколько членов Коммунистической партии Чехословакии поставили под сомнение руководство нынешнего председателя Клемента Готвальда, которого считают слишком близким к политике Сталина. Некоторые предлагают вернуть Алоиса Нейрата, троцкиста немецкого происхождения, всё ещё живущего в стране. Его возвышение могло бы объединить социалистические течения Чехословакии, однако многие считают верность сталинской линии необходимой для победы республики."
 czke.447.a:0 "Зачем нам приводить к власти этого больного глупца?"
 czke.447.b:0 "Интернационалистское дело выиграет от его участия!"
 CZKE_expand_soviet_ties:0 "Расширить связи с [SOV.GetAdjective]ой стороной"
 CZKE_expand_soviet_ties_desc:0 "[SOV.GetAdjective]ая сторона доказала, что является надёжным союзником в постоянно меняющемся мировом порядке. Предложение укрепить наши связи наверняка будет встречено благосклонно и подготовит страну к грядущим испытаниям."
 CZE_help_from_sov:0 "Советская помощь"
 CZKE_friendship_with_USSR:0 "Договор о дружбе"
 czke.448.t:0 "Чехословакия предлагает договор о дружбе"
 czke.448.d:0 "Чехословацкое правительство недавно направило делегацию с предложением заключить официальный договор о дружбе, который должен укрепить наши связи. Что ответить друзьям в Праге?"
 czke.448.a:0 "Разумеется, подпишем его немедленно!"
 czke.448.b:0 "Нет, спасибо."
 czke.449.t:0 "[SOV.GetAdjective]ая сторона согласилась"
 czke.449.d:0 "[SOV.GetAdjective]ая сторона приняла наше предложение о договоре дружбы. Теперь отношения между нашими странами будут процветать."
 czke.449.a:0 "Отлично."
 czke.450.t:0 "[SOV.GetAdjective]ая сторона отказалась"
 czke.450.d:0 "[SOV.GetAdjective]ая сторона отклонила наше предложение о договоре дружбы, заявив, что условия слишком односторонние. Это, несомненно, разочаровывает."
 czke.450.a:0 "Прискорбно..."
 CZKE_split_poland:0 "Разделить Польшу"
 CZKE_split_poland_desc:0 "Антанта поступила глупо и наивно, создав государства, неспособные защитить себя. Польша, давно находящаяся под реакционной и тоталитарной властью, должна исчезнуть с карты, а наши западнославянские товарищи перейти под наше покровительство. При поддержке [SOV.GetAdjective]их союзников кто сможет нас остановить?"
 czke.451.t:0 "Чехословакия предлагает разделить Польшу"
 czke.451.d:0 "Чехословацкое министерство иностранных дел предложило разделить недавно созданную Польшу между нашими странами. В обмен на участие во вторжении нам предлагают полный контроль над землями, потерянными в недавней польско-советской войне. Как ответить на это важное предложение?"
 czke.451.a:0 "Это принесёт взаимную выгоду!"
 czke.451.b:0 "Мы не можем рисковать дальнейшим обострением отношений с Западом."
 czke.452.t:0 "[SOV.GetAdjective]ая сторона согласилась!"
 czke.452.d:0 "[SOV.GetAdjective]ая сторона приняла наше предложение о разделе Польши. Теперь можно приступить к подготовке совместного вторжения."
 czke.452.a:0 "Превосходные новости."
 czke.453.t:0 "[SOV.GetAdjective]ая сторона отказалась!"
 czke.453.d:0 "[SOV.GetAdjective]ая сторона отклонила предложение разделить Польшу, заявив, что не может рисковать «неопределённым конфликтом» с западным миром, который наверняка будет спровоцирован."
 czke.453.a:0 "Тогда мы пойдём одни!"
 CZKE_union_with_warsaw:0 "Союз с Варшавой"
 CZKE_union_with_warsaw_desc:0 "Объединив польских рабочих под нашим знаменем, мы наконец воплотим популярную, но прежде неудачную идею настоящего союза западнославянских народов! Лучшей защитой от Запада станет товарищество с нашими давними друзьями."
 CZKE_union_with_warsaw_trigger_tt:0 "Все начальные §Yпольские§! регионы, не являющиеся национальными территориями других стран:\n Подчинение выше §Y50%§!\n Сопротивление ниже §Y5%§!"
 CZKE_union_with_warsaw_effect_tt:0 "Мы станем известны как §YДемократическая Республика Чехословакия-Польша§!"
 rop_director:0 "Директор ŘOP"
 king_of_the_shoes:0 "Король обуви"
 ckd_skoda_tanks:0 "Совместный конструктор танков"
 aero_aircraft_manufacturer:0 "Конструктор бомбардировщиков"
 avia_fighter_manufacturer:0 "Конструктор истребителей"
 letov_CAS_manufacturer:0 "Конструктор штурмовиков"
 czke.7.t:0 "Президент Эдвард Бенеш уходит в отставку"
 czke.7.d:0 "После германской оккупации Судет президент Эдвард Бенеш под сильным давлением Германии был вынужден уйти в отставку [GetDateText]. По нашим сведениям, он отправился в изгнание в Патни, Лондон, и пока держится в тени."
 czke.7.a:0 "Понятно."
 czke.8.t:0 "Президентские выборы"
 czke.8.d:0 "Бывший председатель Высшего административного суда доктор Эмиль Гаха был избран Национальным собранием [GetDateText] преемником Эдварда Бенеша на посту президента Чехословакии. Его выбрали благодаря католицизму, консерватизму и непричастности к правительствам, допустившим катастрофический раздел страны.\n\nОн сохранил должность и после создания Протектората Богемии и Моравии, однако был лишь марионеткой и утратил почти всё политическое влияние, особенно после убийства Рейнхарда Гейдриха в июне 1942 года."
 czke.8.a:0 "Подготовить церемонию инаугурации."
 hitlers_puppet:0 "Марионетка Гитлера"
 emil_hacha:0 "Эмиль Гаха (3-й президент)"
 emil_hacha_desc:0 "Эмиль Доминик Йозеф Гаха был чешским юристом и третьим президентом Чехословакии в 1938–1939 годах. После оккупации остатков страны 16 марта он сохранил должность, но был вынужден присягнуть Гитлеру, назначившему Константина фон Нейрата протектором Богемии и Моравии."
 CZKE_new_airplane_prototypes:0 "Новые прототипы истребителей"
 CZKE_new_airplane_prototypes_desc:0 "Стандартным чехословацким истребителем был Avia B.534 — один из последних бипланов, остававшихся в строю, и, возможно, один из лучших в своём классе.\n\nОднако в критические годы перед Второй мировой войной компания «Авиа» начала проект истребителя-моноплана."
 CZKE_new_airplane_prototypes_tooltip_reward:0 "\n Выбор между §Yбоец§! или §YТяжелый истребитель§! связанный §YИсследовательский бонус§!.\""
 czke.223.t:0 "Довоенные прототипы чехословацких истребителей"
 czke.223.d:0 "К 1936 году верховному командованию стало ясно, что в случае войны с Германией бипланам чехословацких ВВС потребуются современные монопланы на замену. Была начата новая программа модернизации со строгими требованиями к истребителям и бомбардировщикам.\n\nСамым известным чешским проектом современного моноплана стал прототип Avia B.35, запущенный в производство как Avia B.135 в 1939 году. Подобно Hawker Hurricane, он имел убираемое шасси, одну 20-мм пушку, стрелявшую через втулку винта, и два 7,92-мм пулемёта в крыльях. Инженеры планировали заменить слабый двигатель Hispano-Suiza 12Ycrs, но война сорвала модернизацию.\n\nДругим перспективным проектом был Praga E-51 от ЧКД Praga — разведчик и тяжёлый истребитель, способный выполнять роль лёгкого бомбардировщика и напоминавший Fw 189 или P-38 Lightning. Единственный известный прототип впервые взлетел в мае 1938 года, слишком поздно для доводки и серийного производства. Позднее его конфисковали, испытали в германском Рехлине, после чего самолёт исчез."
 czke.223.a:0 "Avia B.135 (истребитель)"
 czke.223.b:0 "Praga E.51 (тяжёлый истребитель)"
 CZKE_new_airplane_prototypes_2:0 "Новые прототипы бомбардировщиков"
 CZKE_new_airplane_prototypes_2_desc:0 "К 1936 году единственным не полностью устаревшим чехословацким бомбардировщиком был лицензионный Bloch MB.200, производившийся компанией «Аэро». Одним из интересных довоенных прототипов стал Aero A.300.\n\nНачало войны прервало дальнейшую разработку и возможное производство."
 CZKE_new_airplane_prototypes_2_tooltip_reward:0 "\n Выбор между §YБлизкая воздушная поддержка§! или §YТактический бомбардировщик§! или §YСтратегический бомбардировщик§! связанный §YИсследовательский бонус§!."
 czke.224.t:0 "Довоенные прототипы чехословацких бомбардировщиков"
 czke.224.d:0 "К [GetDateText] верховному командованию стало ясно, что в случае войны с Германией бипланам ВВС потребуются современные монопланы. Поэтому была начата программа модернизации со строгими требованиями к истребителям и бомбардировщикам.\n\nОдним из наиболее перспективных прототипов был Aero A.300 — современный бомбардировщик с мощными радиальными двигателями Bristol Mercury IX. Он превосходил по скорости все чехословацкие самолёты, кроме прототипа Avia B.35. В 1939 году машину захватили немцы и передали инженерам Focke-Wulf в Бремене, после чего она исчезла.\n\nКомпания «Авиа» представила лёгкий бомбардировщик B.158 — трёхместный низкоплан с крылом типа «обратная чайка», убираемым шасси и двигателями Avia Hispano-Suiza 12Ydrs мощностью 850 л. с. Первый полёт состоялся в середине 1938 года.\n\n«Летов» предложил проект Š-50 — универсальный моноплан с двумя радиальными двигателями Avia Rk.17 мощностью по 420 л. с., тремя пулемётами и бомбовой нагрузкой до 600 кг. Для разведки он мог оснащаться радиостанцией и фотокамерами."
 czke.224.a:0 "Aero A.300 (стратегический бомбардировщик)"
 czke.224.b:0 "Avia B.158 (тактический бомбардировщик)"
 czke.224.c:0 "Letov Š.50 (штурмовик)"
