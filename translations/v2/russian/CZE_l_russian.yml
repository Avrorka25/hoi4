 CZE_the_second_czechoslovak_republic:0 "Вторая Чехословацкая Республика"
 CZE_the_second_czechoslovak_republic_desc:0 "Государство [CZE.getNameDefCap] — многонациональная страна, возникшая в 1918 году из распадающейся Австро-Венгерской империи. В ней живут чехи, словаки, немцы, венгры, русины, поляки и многие другие народы.\nТакое разнообразие несёт молодой республике как преимущества, так и трудности."
 CZE_subcarpathian_ruthenia_political_reforms:0 "Политические реформы в регионе [73.getName]"
 CZE_subcarpathian_ruthenia_political_reforms_desc:0 "После Мюнхенского кризиса восточные регионы государства [CZE.getNameDef] потребовали более широкой автономии.\n\nДва конституционных закона от 22 ноября 1938 года — №299/1938 об автономии Словакии и №328/1938 об автономии Карпатской Руси — заменили прежнее унитарное устройство Чехословакии асимметричной моделью автономии Словакии и Карпатской Руси, но не исторических чешских земель."
 CZE_sdp_radicalization:0 "Кризис радикализации СДП"
 CZE_sdp_radicalization_desc:0 "Германское меньшинство в Судетах активно стремится к сближению с государством [GER.getNameDef]. Оно требует широкой автономии и угрожает усилить сопротивление государственным властям на своих территориях."
 end_of_czechoslovakia:0 "Судьба Чехословакии свершилась"
