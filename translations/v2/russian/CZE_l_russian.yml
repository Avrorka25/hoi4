 new_blackops_effect:0 "\n Тайные операции:"
 CZKE_jan_antonin_bata_desc:0 "Ян Антонин Батя был чешским производителем обуви, а после смерти своего сводного брата стал владельцем и генеральным директором компании «Батя».\n\nПод его руководством компания расширила деятельность на производство обувного оборудования, шин, текстиля и химикатов, добычу полезных ископаемых, строительство каналов и железных дорог, киностудии, авиастроение, универмаги и другие отрасли."
 CZKE_emil_kolben_desc:0 "Эмиль Кольбен был чешским инженером и предпринимателем, основателем и директором ЧКД до оккупации Чехословакии нацистами. После оккупации его отстранили от должности, а позднее заключили в концентрационный лагерь Терезиенштадт, где он умер в 1943 году."
 CZKE_radola_gajda_desc:0 "Радола Гайда, урождённый Рудольф Гейдль, был чешско-сербским военачальником и политиком. В 1926 году он стал исполняющим обязанности начальника генерального штаба, но был вынужден уйти в отставку из-за публичных симпатий к итальянскому фашизму.\n\nВ возрасте всего 34 лет Гайда решил заняться политикой. В конце 1926 года он участвовал в создании Национальной фашистской общины по образцу Национальной фашистской партии Бенито Муссолини и в 1927 году стал её лидером."
 CZKE_karel_husarek_desc:0 "Генерал Карел Гусарек на протяжении всего существования программы укреплений занимал должность руководителя фортификационных работ."
 CZKE_jan_netik_desc:0 "Генерал Ян Нетик с 1927 года возглавлял II отдел Министерства национальной обороны, отвечавший за артиллерию и вооружение. Его ведомство сыграло ключевую роль в формировании программы вооружения чехословацкой армии."
 CZKE_milan_hodza_desc:0 "Милан Годжа был видным словацким политиком и журналистом, занимавшим пост премьер-министра Чехословакии с 1935 по 1938 год.\n\nБудучи сторонником региональной интеграции, он получил известность благодаря попыткам создать демократическую федерацию государств Центральной Европы."
 CZKE_klement_gottwald_desc:0 "Клемент Готвальд был чехословацким коммунистическим политиком и многолетним лидером Коммунистической партии Чехословакии (КПЧ). После коммунистического переворота он занимал пост премьер-министра Чехословакии с 1946 по 1948 год и президента с 1948 по 1953 год."
 CZKE_prokop_drtina_desc:0 "Прокоп Дртина был одним из ведущих членов Национально-социалистической партии. Эта влиятельная группа формировала политическую жизнь довоенной Чехословакии и была тесно связана со вторым президентом страны Эдвардом Бенешем."
 CZKE_silvestr_blaha_desc:0 "Чешский генерал и теоретик, начальник Военной канцелярии президента. Известен опубликованными трудами о государственной обороне и средствах обеспечения. Выступает за увеличение срока обязательной военной службы."
 CZKE_louis_eugene_faucher_desc:0 "Луи Эжен Фоше возглавлял французскую военную миссию в Чехословакии с 1926 по 1938 год. После франко-британского ультиматума чехословацкому правительству он 23 сентября 1938 года подал прошение об отставке французскому правительству, но остался в Чехословакии.\n\nВо время Второй мировой войны он состоял в «Секретной армии» — французском Сопротивлении."
 CZKE_ludvik_krejci_desc:0 "Людвик Крейчи был чехословацким генералом и начальником генерального штаба Чехословакии с 1933 по 1939 год."
 CZKE_vojtech_boris_luza_desc:0 "Войтех Борис Лужа был чехословацким генералом, поддерживавшим наступательную тактику французского маршала Фоша и Людендорфа, а также идеи книги «Внимание — танки!» немецкого генерала Хайнца Гудериана."
 CZKE_lev_prchala_desc:0 "Генерал Прчала был стойким противником мюнхенской капитуляции и командующим IV. Армия, охранявшая южно-моравскую границу в 1938 году.\n\nЕго также подозревали в формировании плана военного переворота."
 CZKE_jan_syrovy_desc:0 "Ян Сыровый был генералом чехословацкой армии, бывшим начальником генерального штаба и премьер-министром во время Мюнхенского кризиса.\n\nВо время Первой мировой войны он сражался в Чехословацких легионах русской армии и потерял правый глаз в битве при Зборове. К концу войны он командовал легионами и антибольшевистскими силами на Транссибирской магистрали."
 chief_luza_appointed:0 "Назначен начальником генерального штаба"
 chief_prchala_appointed:0 "Назначен начальником генерального штаба"
 tgm:0 "Томаш Гарриг Масарик (1-й президент)"
 tgm_desc:0 "Томаш Гарриг Масарик был чехословацким политиком, социологом и философом, активным сторонником независимости Чехословакии во время Первой мировой войны. Он стал основателем и первым президентом Чехословакии.\n\nМасарик трижды переизбирался — в мае 1920, 1927 и 1934 годов. В 1935 году он ушёл в отставку из-за преклонного возраста и слабого здоровья, а его преемником стал ученик Эдвард Бенеш."
 edvard_benes:0 "Эдвард Бенеш (2-й президент)"
 edvard_benes_desc:0 "Бывший министр иностранных дел и видный член Чехословацкой национально-социалистической партии доктор Эдвард Бенеш был избран президентом в 1935 году после ухода Томаша Гаррига Масарика.\n\nБенеш был первым и дольше всех занимавшим должность министром иностранных дел Чехословакии, сохраняя пост в десяти последовательных правительствах со времён представительства страны на переговорах по Версальскому договору. Он был известной и влиятельной фигурой на международных конференциях и входил в Совет Лиги Наций с 1923 по 1927 год."
 CZKE_jan_rys_rozsevac:0 "Ян Рыс-Розсевач"
 CZKE_jan_rys_rozsevac_desc:0 "Ян Рыс-Розсевач был чехословацким журналистом, политиком и лидером фашистской пронацистской организации «Влайка»."
 czke.1.t:0 "Проблемы в Судетской области"
 czke.1.d:0 "После [GER.GetAdjective]ой оккупации Рейнской области немцы в Судетах с каждым днём становятся всё беспокойнее. Хотя лидер Судетонемецкой партии (СДП) Конрад Генлейн заверяет [CZE.GetAdjective]ое правительство в лояльности немцев государства [CZE.GetNameDef] и отмежёвывается от германского национал-социализма, разведывательные данные говорят об обратном.\n\nПраво судетских немцев на самоопределение, пангерманизм и даже открытая симпатия к идеалам национал-социализма стали обычным явлением на политических митингах СДП."
 czke.1.a:0 "Не стоит беспокоиться. Это всего лишь политический популизм."
 CZKE_unruly_minorities:0 "Судетская проблема"
 CZKE_unruly_minorities_desc:0 "Чехословакия была многонациональным государством, созданным из частей бывшей Австро-Венгерской империи. Помимо чехов и словаков, в ней проживало множество немцев, венгров, евреев и русинов.\n\nПоследствия Великой депрессии и усиление фашизма в Европе создали огромные проблемы для молодой страны, особенно из-за этнических немцев, увлечённых пангерманскими идеями Гитлера."
 czke.2.t:0 "Похороны Томаша Гаррига Масарика"
 czke.2.d:0 "В Праге, погружённой в траур, над зданиями центра развевались чёрные флаги. Бюсты и фотографии Масарика с его характерными пышными белыми усами заполнили город и первые полосы многочисленных газет.\n\nЧёрные полотнища с надписью «TGM» украшали собор Святого Вита и здания на Вацлавской площади. Тысячи солдат и легионеров прошли в похоронной процессии [GetDateText] под 146 военными знамёнами. Гроб, покрытый [CZE.GetAdjective]им флагом, провезли по городу на артиллерийском лафете. Последний путь до Лан гроб проделал на поезде в вагоне, покрытом венками и цветами.\n\nТомаш Гарриг Масарик был чехословацким политиком, социологом и философом, горячим сторонником независимости Чехословакии во время Первой мировой войны, основателем и первым президентом страны. Он трижды переизбирался, а в 1935 году ушёл в отставку из-за возраста и слабого здоровья. Его преемником стал Эдвард Бенеш."
 czke.2.a:0 "Печальный день для государства [CZE.GetNameDef]."
 czke.3.t:0 "Скончался бывший президент Чехословакии"
 czke.3.d:0 "В Праге, погружённой в траур, над зданиями центра развевались чёрные флаги. Бюсты и фотографии Масарика с его характерными пышными белыми усами заполнили город и первые полосы многочисленных газет.\n\nЧёрные полотнища с надписью «TGM» украшали собор Святого Вита и здания на Вацлавской площади. Тысячи солдат и легионеров прошли в похоронной процессии [GetDateText] под 146 военными знамёнами. Гроб, покрытый [CZE.GetAdjective]им флагом, провезли по городу на артиллерийском лафете. Последний путь до Лан гроб проделал на поезде в вагоне, покрытом венками и цветами."
 czke.3.a:0 "Печальный день для государства [CZE.GetNameDef]."
 czke.3.b:0 "Одним капиталистом меньше."
 czke.3.c:0 "Наконец-то старый козёл умер!"
 czke.4.t:0 "SdP объявляет о программе Карлсбад"
 czke.4.d:0 "[GetDateText] СДП провозгласила «Карлсбадскую программу», восемь пунктов которой требовали полного равенства судетских немцев и чехов, включая автономию районов с немецким населением.\n\nПравительство в Праге сначала отказалось, заявив, что некоторые требования невыполнимы. Однако под давлением Великобритании и миссии лорда Ренсимена оно в итоге согласилось с большей частью требований партии Генлейна. Немцев этот компромисс не удовлетворил. Они выдвинули дополнительные неприемлемые или невыполнимые требования, чтобы ещё больше обострить ситуацию и вызвать региональный кризис, который в конечном итоге привёл к Мюнхенской конференции."
 czke.4.a:0 "Мы должны что-то предпринять."
 CZKE_unruly_minorities_2:0 "Судетский кризис"
 CZKE_unruly_minorities_2_desc:0 "СДП провозгласила Карлсбадскую программу, а этнические немцы потребовали самоопределения."
 czke_karlsbad_program:0 "СДП не радикализирована."
 czke.5.t:0 "В государстве [CZE.GetNameDef] создана пятая колонна"
 czke.5.d:0 "За несколько недель до Мюнхенской конференции Гитлер выступил на съезде нацистской партии в Нюрнберге с речью о Судетском кризисе, осудив действия правительства Чехословакии.\n\nГитлер назвал Чехословакию искусственным государством, нарушающим закреплённый международным правом принцип национального самоопределения, и заявил, что это чешская гегемония, в которой немцы, словаки, венгры, украинцы и поляки не желают союза с чехами.\n\nЧерез неделю фюрер приказал создать Судетонемецкий фрайкор. Эта военизированная организация унаследовала структуру «Орднергруппе» — объединения этнических немцев Чехословакии, распущенного властями за участие в многочисленных террористических актах. Германские власти укрывали, обучали и снабжали фрайкор, который проводил трансграничные террористические операции на территории Чехословакии.\n\nМногие этнические немцы отказались выполнять приказ чехословацкой армии о мобилизации. Одни бежали через границу в Германию и вступили во фрайкор, продолжая оттуда рейды, другие создавали отряды «Зелёного фрайкора», действовавшие из чехословацких лесов, получавшие оружие и снаряжение из Германии и нападавшие на чехословацкие власти, евреев и чехов вплоть до германской оккупации приграничных районов после Мюнхенского соглашения."
 czke.5.a:0 "Ввести военное положение!"
 CZKE_fifth_column:0 "Пятая колонна"
 CZKE_fifth_column_desc:0 "Судетонемецкий фрайкор действует в Чехословакии."
 CZKE_fifth_column_2:0 "Пятая колонна"
 CZKE_fifth_column_desc_2:0 "Судетонемецкий фрайкор действует в Чехословакии."
 czke.6.t:0 "Мобилизация!"
 czke.6.d:0 "Чехословацкое руководство отвергает британско-французское предложение о создании [CZE.GetNameDef] уступить Судетскую область Чехословакии.\n\nВскоре после этого было объявлено чрезвычайное положение и общая мобилизация. Приказ о мобилизации распространялся на около 1 250 000 солдат, включая резервистов, призванных ранее для различных учений.\n\nОтвет на объявление о всеобщей мобилизации был оперативным; Во-первых, резервисты отчитывались о дежурстве всего через несколько минут после того, как услышали указ по радио. В последующие часы приток солдат быстро увеличивался.\n\nАрмия взяла под контроль и охраняла ключевые стратегические здания в течение ночи, а военные подразделения реформировались в военные организации.\n\nЧехословакия была готова защищать свою независимость."
 czke.6.a:0 "Правда победит!"
 CZKE_mobilization_1938:0 "Мобилизация"
 CZKE_mobilization_1938_desc:0 "Объявлена полная мобилизация. Резервисты прибывают в свои части."
 CZKE_mobilisation_formation_template_tooltip_reward:0 "§OОсобый бонус:§! новый шаблон дивизии (§YMobilizační Těleso§! — мобилизационное соединение)."
 CZKE_great_depression_aftermath:0 "Последствия Великой депрессии"
 CZKE_great_depression_aftermath_desc:0 "Чехословакия унаследовала почти 70 процентов промышленного потенциала Австро-Венгрии, однако в 1930 году Великая депрессия обрушилась на молодое государство со всей силой. Восстановление заняло годы, хотя некоторые компании продолжали расширяться даже в самые тяжёлые времена."
 CZKE_great_depression_aftermath_tooltip_reward:0 "\n§YБонус к исследованиям§!, связанным с §Yпромышленностью§!."
 czke.100.t:0 "Великая депрессия в Чехословакии"
 czke.100.d:0 "Промышленные традиции Чехословакии восходят к XIX веку, когда Богемия и Моравия были экономическим сердцем Австро-Венгерской империи.\n\nПосле Первой мировой войны новое независимое государство унаследовало большую часть австро-венгерских промышленных активов, а индустриализация продолжилась в межвоенные годы.\n\nИндекс валового национального продукта в 1929 году превышал уровень 1913 года на 52 пункта. Между мировыми войнами Чехословакия входила в десятку крупнейших индустриальных экономик и занимала седьмое место в мире по производству вооружений.\n\nХронической проблемой межвоенного периода, имевшей тяжёлые социальные и политические последствия, была экономическая неоднородность Чехословацкой Республики. Между чешскими землями и Словакией существовали значительные различия. До 1938 года Словакия и гораздо менее развитая Карпатская Русь оставались преимущественно аграрными придатками чешских земель, снабжавшими их сырьём.\n\nС началом мирового кризиса чехословацкая экономика пережила спад, от которого к 1937 году едва оправилась, главным образом благодаря перевооружению."
 czke.100.a:0 "Кризис наконец завершён."
 CZKE_support_consumer_goods_industry:0 "Поддержать промышленность потребительских товаров"
 CZKE_support_consumer_goods_industry_desc:0 "Чехословакия всегда была ориентирована на экспорт. До Великой депрессии основными экспортными товарами были продукты пищевой промышленности — сахар, пиво и ветчина, — а также стекло, изделия из дерева, бумага, текстиль, одежда, обувь и кожаные товары."
 CZKE_support_consumer_goods_industry_tooltip_reward:0 "\n§YГражданская промышленность§!."
 czke.101.t:0 "Феномен Бати"
 czke.101.d:0 "Томаш Батя, производивший обувь с 1894 года, создал в Злине, Моравия, крупную фабрику, используя методы массового производства компании «Форд» и принципы тейлоризма.\n\nПочти всё десятилетие перед Второй мировой войной его фирма оставалась крупнейшим экспортёром обуви в мире. После трагической гибели Томаша Бати в 1932 году руководство перешло к его сводному брату Яну Антонину Бате, который позднее получил прозвище «король обуви».\n\nНа момент смерти Бати в 1932 году компания насчитывала 16 560 работников, 1 645 магазинов и 25 предприятий. Следуя планам брата, Ян Антонин Батя увеличил компанию более чем в шесть раз в Чехословакии и за рубежом.\n\nПолитика компании, начатая Томашем Батей, предусматривала строительство рабочих посёлков вокруг фабрик, школ и учреждений социального обеспечения. Среди них Батадорп в Нидерландах, Батовяны и Свит в Словакии, Батов в Чехии, Борово-Батя, ныне Борово-Населье, в Хорватии, Батя-парк в Мёлине в Швейцарии, Батавиль в Лотарингии во Франции, Батава в Канаде, Ист-Тилбери в Англии, Батапур в Пакистане, Батанагар и Батагандж в Индии. Фабрика существовала и в Белкампе, штат Мэриленд, США.\n\nК 1934 году фирма владела 300 магазинами в Северной Америке, тысячей в Азии и более чем четырьмя тысячами в Европе. В 1938 году группа «Батя» насчитывала более 65 000 работников по всему миру, 36 процентов из них — за пределами Чехословакии, и имела доли в кожевенной промышленности, сельском хозяйстве, издательском деле, железных дорогах, авиации, текстильном производстве, добыче угля и авиастроении."
 czke.101.a:0 "Наш покупатель — наш господин (девиз Бати)."
 CZKE_highway_construction_project:0 "Улучшить дорожное сообщение"
 CZKE_highway_construction_project_desc:0 "В 1937 году Ян Антонин Батя выпустил книгу «Построим государство для 40 000 000 человек». В ней он изложил своё видение будущего развития Чехословакии, включая строительство автомобильной магистрали через всю страну от Хеба в Судетах до Хуста в Карпатской Руси."
 CZKE_highway_construction_project_tooltip_reward:0 "Улучшает §Yинфраструктуру§! Чехословакии."
 CZKE_prospect_new_resources:0 "Разведать новые ресурсы"
 CZKE_prospect_new_resources_desc:0 "К важнейшим природным ресурсам Чехословакии относились древесина, бурый и каменный уголь, графит и глина. Железную руду добывали главным образом в Словакии, а залежи других металлов были сравнительно незначительными.\n\nНебольшое месторождение бокситов находилось у Рихнова в Богемии, а в Южной Моравии с 1900 года добывали небольшие объёмы высококачественной нефти."
 CZKE_prospect_new_resources_tooltip_reward:0 "\n§YНовые ресурсы§! и §Yбонус к исследованиям§!, связанным с §Yпромышленностью§!."
 czke.102.t:0 "Минеральные ресурсы Чехословакии"
 czke.102.d:0 "Чехословакия располагала значительными запасами каменного и бурого угля. В 1935 году страна занимала второе место в мире по добыче бурого угля и седьмое — каменного. Однако, за исключением отдельных ресурсов вроде урана, природными богатствами она была сравнительно бедна.\n\nЖелезную, медную и марганцевую руду добывали главным образом в Словацких Рудных горах, хотя отдельные металлические месторождения находились и возле Праги и Пльзеня. Небольшие залежи свинца, цинка и бокситов имелись в Центральной Богемии. Ртуть, сурьму и олово добывали в Рудных горах, где также находились значительные урановые залежи.\n\nНефтяные и газовые месторождения были малы и располагались главным образом в Южной Моравии, однако в довоенные годы добыча постепенно росла. Во время Второй мировой войны моравская нефть приобрела стратегическое значение для германской военной экономики. Крупнейшая компания DEA имела около 1200 скважин только возле Годонина.\n\nВ 1930 году компания «Франке и Шольц», владевшая заводом по переработке олова и свинца, приобрела бывшую льноперерабатывающую фабрику во Фридланде в Восточных Судетах и создала успешное предприятие цветной металлургии. Оно поставляло алюминиевые и дюралюминиевые листы чехословацкой авиационной промышленности."
 czke.102.a:0 "Искать новые месторождения."
 CZKE_expand_heavy_industry:0 "Расширить тяжёлую промышленность"
 CZKE_expand_heavy_industry_desc:0 "Металлургия была одной из главных отраслей с относительно современными заводами и оборудованием. Она составляла основу развитого машиностроения, электротехнической промышленности и многих других отраслей домюнхенской Чехословакии."
 CZKE_expand_heavy_industry_tooltip_reward:0 "\n§YНовые ресурсы§! (сталь)."
 czke.103.t:0 "Сталелитейная промышленность Чехословакии"
 czke.103.d:0 "В 1929–1937 годах чехословацкая экономика смещалась от лёгкой к тяжёлой промышленности, во многом из-за роста производства вооружений. В 1923–1937 годах на добывающую промышленность приходилось в среднем около 11% общего промышленного производства, а доля металлургии выросла с 5,4% в 1923 году до 8,4% в 1937 году.\n\nВ железной и сталелитейной промышленности Чехословакии сложилась хорошо организованная монопольная структура общенационального масштаба. Вероятно, это была самая жёсткая монополия в сталелитейной промышленности мира, основанная на эффективной картельной организации.\n\nКрупнейшие предприятия были представлены в картеле Витковицкими горно-металлургическими заводами в Остраве, Горнодобывающей и металлургической компанией в Тршинце и Пражской железной компанией в Кладно, известными как «Большая тройка».\n\nВ 1935 году Чехословакия занимала седьмое место в Европе и десятое в мире по производству стали."
 czke.103.a:0 "Расширить «Большую тройку»"
 CZKE_eastern_urbanization:0 "Проект урбанизации восточных регионов"
 CZKE_eastern_urbanization_desc:0 "В 1918–1938 годах правительство Чехословакии прилагало значительные усилия для развития Словакии и Карпатской Руси. В эти регионы направлялись тысячи чешских учителей, полицейских, чиновников и предпринимателей."
 CZKE_eastern_urbanization_tooltip_reward:0 "Увеличивает количество §Yячеек для строительства§! в регионах §YСловакия§! и §YКарпатская Русь§!."
 CZKE_chemical_industry_development:0 "Развитие химической промышленности"
 CZKE_chemical_industry_development_desc:0 "Чехословакия обладала развитой химической промышленностью, сосредоточенной главным образом в северо-западных Судетах.\n\nПосле аннексии Чехословакии нацистская Германия завершила строительство важных заводов синтетического топлива в Мосте, по-немецки Брюкс."
 CZKE_chemical_industry_development_tooltip_reward:0 "\n§YГражданская промышленность§! и §Yбонус к исследованиям§!, связанным с §Yсинтетическим топливом§!."
 czke.104.t:0 "Химическая промышленность Чехословакии"
 czke.104.d:0 "История чешской химической промышленности начинается в 1856 году, когда во дворце герцога Шварценберга в Вене была основана акционерная компания «Австрийское общество химического и металлургического производства».\n\nУже через год производство химикатов началось в небольшом провинциальном городе Ауссиг, ныне Усти-над-Лабем. Компания сыграла ключевую роль в развитии богемской химической промышленности и самого города.\n\nСо временем Общество химического и металлургического производства стало главным конкурентом германской IG Farben в Центральной Европе и на Балканах и четвёртым по величине химическим концерном Европы. На предприятие из Ауссига приходилось более 60 процентов чешского химического производства.\n\nДо оккупации Судет в 1938 году IG Farben оказывала значительное техническое влияние на чешскую химическую промышленность, а обе компании создали несколько картелей, включая планы заводов синтетического топлива.\n\nВо время Второй мировой войны Германия через компанию Sudetenländische Treibstoffwerke AG завершила строительство заводов в Мосте, и в 1942 году началось производство синтетического топлива из бурого угля. Из-за стратегического значения предприятие неоднократно бомбили союзники."
 czke.104.a:0 "Расширить химическую промышленность."
 CZKE_commercial_tyre_production:0 "Промышленное производство шин"
 CZKE_commercial_tyre_production_desc:0 "Высокая стоимость железнодорожного транспорта побудила компанию Bata эксплуатировать свой парк транспортных средств для перевозки грузов автомобильным транспортом. В 1934 году для противодействия высоким затратам на импорт шин для своего автопарка компания решила их выпускать."
 CZKE_commercial_tyre_production_tooltip_reward:0 "\n§YГражданская промышленность§! и §Yновые ресурсы§! (резина)."
 czke.105.t:0 "Истоки компании «Барум»"
 czke.105.d:0 "Традицию производства шин в Чехословакии заложил Томаш Батя в начале 1930-х годов. В январе 1932 года в Злин доставили зарубежное оборудование, а в апреле изготовили первую шину размером 32×6. Через год Батя построил новый шинный завод, выпустивший во второй половине 1934 года 68 000 шин 43 типоразмеров. В 1935 году производство удвоилось, а шины «Батя» устанавливались на все чешские автомобили. В 1939 году компания выпускала 250 тысяч шин ежегодно и освоила клиновые ремни, конвейерные ленты и техническую резину.\n\nПосле Второй мировой войны семья Батя потеряла контроль над национализированной компанией. Компания «Барум» объединила крупнейших производителей резины Чехословакии."
 czke.105.a:0 "Увеличить производство шин."
 CZKE_support_strategic_industry:0 "Поддержать стратегическую промышленность"
 CZKE_support_strategic_industry_desc:0 "Множество небольших промышленных фирм делало Чехословакию разносторонним производителем, но несколько компаний доминировали в экономике и имели стратегическое значение."
 CZKE_support_strategic_industry_tooltip_reward:0 "\n§YВоенная промышленность§!."
 czke.106.t:0 "Военная промышленность Чехословакии"
 czke.106.d:0 "Чехословацкие оружейные и боеприпасные компании играли важную роль в экономике, особенно в поддержании положительного торгового баланса.\n\n«Чешска Збройовка», также известная как «Збройовка Брно», была одним из главных производителей. Помимо винтовок и пулемётов, она выпускала гражданские автомобили и другие товары.\n\nПосле Великой войны французская компания Schneider-Creusot стала главным акционером заводов «Шкода», которые быстро расширили деятельность внутри страны и за рубежом. «Шкода» производила автомобили, самолёты, танки и бронемашины, сохраняя выпуск крупных орудий, локомотивов и другой техники. К концу 1930 года на предприятии работало почти 30 000 человек.\n\nГлавным конкурентом «Шкоды» была ЧКД, созданная в 1927 году слиянием «Ческоморавска-Кольбен» и «Брейтфельд-Данек». ЧКД быстро расширила производство локомотивов и танков.\n\nОснователь и директор ЧКД Эмиль Кольбен после нацистской оккупации был отстранён и заключён в Терезиенштадт, где умер в 1943 году.\n\nВо время оккупации компания была переименована в BMM и выпускала оружие для вермахта. Наиболее известными изделиями стали танки Panzer 38(t) и истребители танков Jagdpanzer 38(t)."
 czke.106.a:0 "Субсидировать военную промышленность."
 CZKE_secure_arms_export_deals:0 "Заключить контракты на экспорт оружия"
 CZKE_secure_arms_export_deals_desc:0 "Чехословакия долго была одним из ведущих мировых экспортёров оружия в развивающиеся страны. Продажа вооружений приносила прибыль, стимулировала промышленность и укрепляла политические связи с покупателями."
 CZKE_secure_arms_export_deals_tooltip_reward:0 "\n§YНациональный дух§!, связанный с §Yисследованиями§! и §Yторговлей§!."
 czke.107.t:0 "Экспорт чехословацкого вооружения"
 czke.107.d:0 "Чехословакия долгое время была одним из ведущих мировых экспортеров оружия в развивающиеся страны. Продавая оружие, Чехословакия могла бы получить прибыль, стимулировать свою промышленную экономику и сформировать более тесные политические отношения с государствами, которые купили ее оружие.\n\nЕще в 1920-х годах Чехословакия была агрессивным экспортером оружия. Зброевка Брно и Шкода были ключевыми экспортерами. Производственная и экспортная деятельность оружейных компаний координировалась и неконкурентна и часто имела форму картеля.\n\nТанки из CKD (в основном настраиваемые варианты серии TNH) экспортировались по всему миру, что продолжалось даже во время Второй мировой войны, но ограничивалось только странами-спутниками Axis. Когда Германия оккупировала страну, она в основном использовала обширную промышленность по производству вооружений для подпитки своей военной машины.\n\nОднако они не ограничивали экспорт поставками оружия, а также продажей лицензионных прав на производство передового чехословацкого оружия. Известная британская пушка Bren была основана на лицензионной версии чехословацкого ZGB-33 (модифицированная версия ZB vz). 26) легкий пулемет. Это оружие также было лицензировано в Японии и известно как Тип 97. Пулемет BESA был британской версией чехословацкого ЗБ-53 (ТК vz). 37) тяжелый пулемет.\n\nНемного иронично, что многие армии использовали оружие из страны, которую французы и британцы принесли в жертву во имя «мира для нашего времени», чтобы убить солдат по обе стороны конфликта Второй мировой войны.\n\nЧехословацкое правительство сыграло решающую роль в заключении новых соглашений о поставках оружия или лицензировании производства."
 czke.107.a:0 "Заключить новые контракты на экспорт оружия."
 CZKE_armament_exports_idea:0 "Экспорт вооружений"
 CZKE_armament_exports_idea_desc:0 "Чехословакия часто экспортировала вооружения по лицензионным соглашениям, иногда передавая и промышленные технологии."
 CZE_liechtenstein_properties:0 "Собственность государства [LIE.GetNonIdeologyName]"
 CZKE_explosives_production:0 "Расширить производство взрывчатки"
 CZKE_explosives_production_desc:0 "Чехословакия обладала давними традициями производства взрывчатых веществ, сохранившимися и после Второй мировой войны. Пластичная взрывчатка «Семтекс» стала одним из самых известных чехословацких продуктов времён холодной войны."
 CZKE_explosives_production_tooltip_reward:0 "\n§YГражданская промышленность§! или §YВоенная промышленность§! с §Yартиллерия§! связанный §YИсследовательский бонус§!."
 CZKE_skoda_naval_artillery_experience:0 "Опыт «Шкоды» в морской артиллерии"
 CZKE_skoda_naval_artillery_experience_desc:0 "«Шкода» проектировала орудия для австро-венгерского флота. Пора вновь использовать этот опыт."
 czke.108.t:0 "Чехословацкая промышленность взрывчатых веществ"
 czke.108.d:0 "В 1920 году правительство Чехословакии решило заняться производством взрывчатых веществ и основало в Пардубице «Чехословацкую акционерную фабрику взрывчатых материалов».\n\nК 1922 году фабрика выпускала чёрный и бездымный порох и другие энергетические материалы, главным образом для обороны. В конце 1930-х компанию переименовали в «Эксплозию».\n\nВ 1928 году в Семтине была основана дочерняя компания «Синтезия», сосредоточенная на неорганических продуктах для производства взрывчатки.\n\nВо время оккупации 1938–1945 годов «Эксплозия» производила значительную часть метательных зарядов для германской артиллерии и взрывчатку для промышленных и военных подрывных работ. Союзная авиация пыталась разбомбить заводы, но промахнулась.\n\nПластичная взрывчатка «Семтекс» стала самым известным продуктом «Синтезии», хотя была изобретена уже после войны."
 czke.108.a:0 "Расширить «Эксплозию»"
 czke.108.b:0 "Расширить «Синтезию»"
 CZKE_cvut:0 "Чешский технический университет"
 CZKE_cvut_desc:0 "Чешский технический университет в Праге (ЧВУТ) — один из крупнейших университетов Чехии и один из старейших технических вузов Центральной Европы."
 CZKE_cvut_tooltip_reward:0 "\nПолучить §G1§! ячейку для исследований."
 czke.109.t:0 "Чешский технический университет в Праге"
 czke.109.d:0 "Постановлением Министерства образования и национального просвещения Чехословацкой Республики в 1920 году Чешский технический университет в Праге образовался как объединение семи технических школ:\n\n- Гражданское строительство\n- Культурная инженерия\n- Архитектура и структурная инженерия\n- Механическая и электрическая инженерия\n- Химическая и технологическая инженерия\n- Сельскохозяйственная и лесная инженерия\n- и специальных наук.\n\nИзвестные выпускники университета включают в себя:\n\nКристиан Доплер (математик и физик)\nФрантишек Кржижик (чешский изобретатель, инженер-электрик и предприниматель)\nСаймон Визенталь (послевоенный охотник и писатель)\nВладимир Прелог (химик и лауреат Нобелевской премии 1975 года)\nДжордж Клир (компьютерный и системный ученый)\n\nНа основании решения Константина фон Нейрата, рейхспротектора Богемии и Моравии, 17 ноября 1939 года чешские университеты были закрыты.\n\nЗа это время в общей сложности 15 172 студента не смогли закончить учебу, а 513 профессоров, 475 доцентов и 345 других преподавателей потеряли работу. Некоторые студенты пытались закончить учебу в немецких университетах, но обычно их не принимали."
 czke.109.a:0 "Финансировать новые исследовательские программы."
 CZKE_commercial_uranium_mining:0 "Добыча урана"
 CZKE_commercial_uranium_mining_desc:0 "Чехословакия является родиной промышленной добычи урана. Добыча урана в Яхимове (в то время называлась Йоахимсталь и принадлежала Австро-Венгрии) началась в 1890-х годах в промышленных масштабах после того, как производство серебра и кобальта на месторождении сократилось."
 CZKE_commercial_uranium_mining_tooltip_reward:0 "\n§YГражданская промышленность§! ИЛИ §Yбонус к исследованиям§!, связанным с §Yядерными технологиями§!."
 czke.110.t:0 "Уран в Яхимове"
 czke.110.d:0 "В начале XIX века урановую руду получали как побочный продукт горных работ в Саксонии, Богемии и Корнуолле. Первая целенаправленная добыча радиоактивных руд велась в Яхимове, тогда Йоахимстале. Мария Кюри использовала яхимовскую смоляную обманку для выделения радия.\n\nДо Второй мировой войны уран добывали главным образом ради радия, применявшегося в светящихся красках и медицинских целях, многие из которых позднее признали вредными. Сам уран использовался преимущественно как жёлтый пигмент.\n\nПосле войны район Яхимова оказался в центре внимания великих держав. Это было единственное место, где Советский Союз мог быстро получить урановую руду для создания ядерного оружия после бомбардировок Хиросимы и Нагасаки. Чехословакия стала главным источником урана для СССР.\n\nПосле прихода коммунистов к власти в 1948 году в городе и окрестностях создали лагеря, заключённых которых заставляли добывать уран в крайне тяжёлых условиях. Средняя продолжительность жизни составляла 42 года. Добыча прекратилась в 1964 году."
 czke.110.a:0 "Продавать уран союзникам."
 czke.110.b:0 "Сохранить уран и начать программу ядерных исследований."
 CZKE_nuclear_physics_institute:0 "Институт ядерной физики"
 CZKE_nuclear_physics_institute_desc:0 "Институт ядерной физики Чехословацкой академии наук был основан лишь в 1955 году. Но при ином ходе истории атомные исследования в Чехословакии могли начаться значительно раньше."
 CZKE_rocket_research:0 "Ракетные исследования"
 CZKE_rocket_research_desc:0 "Ракетные и реактивные двигатели обеспечивают беспрецедентные скорости как для судов без экипажа, так и для экипажей. Новаторство этих технологий позволяет нам застать врага врасплох."
 CZKE_ministry_of_defense:0 "Реорганизовать Министерство национальной обороны"
 CZKE_ministry_of_defense_desc:0 "Министерство национальной обороны отвечало за подготовку мобилизации по указаниям высшего командования, управление снабжением и координацию программы перевооружения."
 CZKE_ministry_of_defense_tooltip_reward:0 "\nБесплатный советник §Yвысшего военного командования§! ИЛИ §Yполитическая власть§!."
 czke.200.t:0 "Министерство национальной обороны"
 czke.200.d:0 "Министерство национальной обороны (MND) было разработано, чтобы заботиться обо всех делах, связанных с военным наращиванием, его поддержкой и обеспечением его потребностей. Особенно в первые годы существования МНД претерпела частые организационные изменения, окончательная форма которых была достигнута в 1927 году.\n\nОсновными подразделениями МНД являлись подразделения, которые отвечали за ту или иную ветвь вооруженных сил и администрацию, а также занимались организационной и мобилизационной готовностью по руководящим принципам Главного штаба, закупали вооружение и материалы вооружения, контролировали управление этим материалом и вели его учет.\n\nВ 1930-х годах основной задачей было обеспечение защиты государства от угрозы агрессии со стороны Германии и предоставление адекватных средств в условиях экономической депрессии, осложненной стагнацией рынка.\n\nОдной из важнейших должностей в МНД была должность генерального инспектора чехословацких войск, непосредственно подчинявшегося министру национальной обороны.\n\nОписание его деятельности включало в себя прежде всего выполнение инспекционной деятельности, проверку достигнутой дисциплины, соблюдение служебных правил и другие. В 1937 году компетенции были значительно расширены.\n\nИзвестный ветеран-командир и бывший начальник штаба генерал Ян Сыровый был назначен генеральным инспектором в 1933 году и занимал эту должность до 1938 года. Во время Первой мировой войны он воевал в Чехословацких легионах русской армии и потерял правый глаз в битве при Зборове. К концу войны командовал легионами и антибольшевистскими силами на Транссибирской железной дороге."
 czke.200.a:0 "Расширить полномочия генерального инспектора."
 czke.200.b:0 "Нужно сосредоточиться на других вопросах."
 CZKE_ministry_of_national_defense:0 "Реорганизация Министерства национальной обороны"
 CZKE_rop:0 "Выделение средств на  ⁇ OP"
 CZKE_rop_desc:0 "Подготовка постоянных чехословацких укреплений началась в 1934 году. Проекты и строительство подчинялись новому Управлению фортификационных работ — ŘOP. Генерал Карел Гусарек возглавлял управление на протяжении всего его существования."
 CZKE_rop_tooltip_reward:0 "\n§OОсобый бонус:§! начинает цепочку событий §YЛиния Бенеша§!, посвящённую чехословацким пограничным укреплениям.\n\nЗавершение всей цепочки даст укрепления до §Y5-го уровня§! в некоторых регионах."
 CZKE_rop_idea:0 "Управление фортификационных работ — ŘOP"
 CZKE_rop_idea_desc:0 "Управлению ŘOP выделены средства, строительство идёт по плану."
 czke.201.t:0 "Линия Бенеша"
 czke.201.d:0 "В 1930-е годы чехословацкое правительство всерьёз готовилось к войне с Германией. По некоторым оценкам, более половины государственных расходов 1936–1938 годов шло на военные нужды, включая сложную систему бункеров и укреплений в Судетах.\n\nГермано-чехословацкая граница имела длину 1545 километров, а после присоединения Австрии к Германии в 1938 году увеличилась до 2103 километров.\n\nПо рекомендации союзной Франции было решено создать огромную систему укреплений вдоль германской границы и внутри страны. Однако из-за чрезвычайной протяжённости границы и невыгодной формы Чехословакии правительство не могло профинансировать непрерывную линию тяжёлых сооружений."
 czke.201.a:0 "Начать строительство линии Одра — Крконоше"
 CZKE_phase_one_tooltip:0 "\n Строительство §Y8§! §YУкрепленные зоны (lvl 2)§! Начнется вдоль северной границы с Германией (оценочное время:) §Y180 дней§!)."
 czke.202.t:0 "Чехословакия начинает строительство пограничных укреплений"
 czke.202.d:0 "Из-за роста напряжённости с Германией правительство Чехословакии по рекомендации Франции начало строительство массивной системы укреплений в Судетах для защиты северо-западной границы.\n\nИсточники в Германии сообщают, что канцлер Гитлер в ярости и намерен затронуть эту тему на предстоящем съезде партии в Нюрнберге."
 czke.202.a:0 "Интересно."
 czke.203.t:0 "Строительство лёгких укреплений"
 czke.203.d:0 "Командованию чехословацкой армии потребовался более совершенный тип лёгкого укрепления, и был разработан образец 37 — фактически миниатюрный тяжёлый форт. Большинство таких сооружений вело фланговый огонь, а амбразуры фронтального огня встречались редко. Их размещали на обратных скатах, чтобы избежать прямого дальнего обстрела. С фронта они почти не могли защищаться и зависели от соседних позиций."
 czke.203.a:0 "Приоритет отдается западной границе."
 czke.203.b:0 "Приоритетность южной границы"
 czke.203.c:0 "Отменить проект."
 CZKE_phase_two_w_tooltip:0 "\n Строительство §Y8§! §YУкрепленные зоны (lvl 2)§! Начнется вдоль западной границы с Германией (оценочное время:) §Y180 дней§!)."
 CZKE_phase_two_s_tooltip:0 "\n Строительство §Y9§! §YУкрепленные зоны (lvl 1-2)§! Начнется вдоль южной границы с бывшими австро-венгерскими регионами (оценочное время): §Y180 дней§!)."
 CZKE_phase_two_stop_tooltip:0 "Проект строительства пограничных укреплений будет §Yотменён§!, дальнейшие укрепления строиться не будут."
 czke.204.t:0 "Строительство тяжёлых укреплений"
 czke.204.d:0 "Чехословакия строила тяжёлые укрепления у германской границы и в Словакии возле Венгрии. Они предназначались для остановки основных танковых и пехотных атак.\n\nКазематы возводились цепями на расстоянии 300–600 метров. В некоторых местах создавались артиллерийские крепости для поддержки независимых фортов. С 1935 года по [GetDateText] было построено около 250 казематов. Каждый проектировался индивидуально, но сооружения можно разделить по назначению, форме и классу устойчивости. Ранние укрепления испытали влияние французских образцов, позднее появился тип, лучше соответствовавший чешской оборонительной концепции."
 czke.204.a:0 "Начать строительство тяжёлых казематов."
 CZKE_phase_three_tooltip:0 "\nСтроительство §Y6§! §YТяжелые казематы (lvl 3)§! начнется в наиболее критических точках вдоль границы с Германией (оценочное время): §Y365 дней§!)."
 czke.204.b:0 "Держите проект запущенным для §G1!Очередной год."
 czke.204.c:0 "Остановить проект."
 czke.205.t:0 "Продолжить строительство лёгких укреплений"
 czke.205.d:0 "Управление фортификационных работ сообщает, что строительство идёт по плану. Следует ли заключить новые контракты и выделить дополнительные средства?"
 czke.205.a:0 "Продолжить строительный проект."
 czke.205.b:0 "Отменить проект."
 czke.206.t:0 "Отчёт Управления фортификационных работ"
 czke.206.d:0 "Управление фортификационных работ сообщает, что все запланированные проекты скоро завершатся. Продлить полномочия ŘOP или отменить проект?"
 czke.206.a:0 "Продолжить проект."
 czke.206.b:0 "Отменить проект."
 CZKE_phase_four_tooltip:0 "Проект продолжится ещё §Y1 год§!, и ограниченный вариант §Yнационального духа§! сохранится, но новые бесплатные бункеры строиться не будут."
 CZKE_rop2_idea:0 "Управление фортификационных работ — ŘOP"
 CZKE_rop2_idea_desc:0 "Управлению ŘOP выделены дополнительные средства на дальнейшее строительство."
 CZKE_engineer_corps:0 "Подготовка инженерных войск"
 CZKE_engineer_corps_desc:0 "Инженерные части имели решающее значение для программы укреплений и поэтому получили лучшую подготовку и снаряжение."
 CZKE_military_education:0 "Поддержать военное образование"
 CZKE_military_education_desc:0 "В довоенной Чехословакии действовало несколько военных школ и академий, находившихся под сильным влиянием французской военной миссии."
 CZKE_military_education_tooltip_reward:0 "\nВыбор между тремя §Yнациональными духами§!, связанными с §Yвоенной сферой§!."
 czke.207.t:0 "История военного образования в Чехословакии"
 czke.207.d:0 "В рамках французской военной миссии 1 ноября 1921 года в Праге был основан новый военный колледж для офицеров (позже известный как Vysoká škola Válečná - VŠV) Генерального штаба. Она была смоделирована по образцу Военного колледжа в Париже, и поэтому в чешских кругах Военный колледж Праги часто называли «маленькой сестрой». Благодаря необычайному интересу французской военной миссии уровень образования быстро поднялся до рядов аналогичных школ из-за рубежа, которые часто имели гораздо более длительные традиции.\n\nОкончательная форма ВШВ в межвоенный период была установлена в 1934 году, и генерал Микулаш Долезаль был ее последним командиром до оккупации в 1939 году. Нацисты казнили его в 1941 году за участие в подпольной организации Сопротивления «Обрана Народа».\n\nЗа все время своего существования колледж окончили 577 офицеров (в том числе 22 литовца), на информационных курсах участвовали 269 генералов и старших командиров чехословацкой армии.\n\nКатегория высшего образования была представлена Военной академией (Vojenská Akademie - VA) в Границе. Он был создан 3 января 1920 года, и его миссия состояла в подготовке офицеров (лейтенантов) для всех родов чехословацкой армии. К 1938 году тысячи офицеров, в том числе многие будущие генералы, окончили академию.\n\nСредний уровень образования был представлен школами для офицеров запаса (Školy Důstojníků v Záloze (ŠDZ), которые были организованы как часть дивизионного штаба и обеспечивали подготовку и образование для офицеров на нижних командных должностях.\n\nВоенные специалисты обучались в специальных военных школах, включая пехоту, артиллерию, авиацию, кавалерию, инженерию, телеграфы, оружие, а с 1933 года также Школу бронетанковых войск (Škola Útočné Vozby). Выпускники специальных субофицерских учебных программ дополняли сержантский корпус."
 czke.207.a:0 "Открыть новые военные курсы в Высшей военной школе."
 czke.207.b:0 "Увеличить учебные возможности Военной академии."
 czke.207.c:0 "Расширить программы подготовки унтер-офицеров."
 CZKE_generals_idea:0 "Курсы Высшей военной школы"
 CZKE_generals_idea_desc:0 "В Высшей военной школе доступны новые лекции для старших офицеров."
 CZKE_officers_idea:0 "Выпускники Военной академии"
 CZKE_officers_idea_desc:0 "Академия выпустила новых офицеров."
 CZKE_ncos_idea:0 "Подготовленный сержантский корпус"
 CZKE_ncos_idea_desc:0 "Начаты программы подготовки сержантского корпуса."
 CZKE_border_brigades:0 "Сформировать пограничные бригады"
