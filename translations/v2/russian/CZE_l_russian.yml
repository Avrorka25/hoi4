 CZKE_border_brigades_tooltip_reward:0 "\n§OОсобый бонус:§! новый шаблон дивизии (§YHraničářská Brigáda§! — элитная гарнизонная бригада)."
 czke.208.t:0 "Создание пограничных полков"
 czke.208.d:0 "Чехословацкая армия в 1918-1939 годах не имела настоящих элитных дивизий. Ближайшим военным корпусом, напоминающим элитные войска, были пограничные полки, которые должны были оснащать тяжелые фортификационные объекты.\n\nЛетом были сформированы первые пограничные полки (на чешском языке — Hraničářské Pluky). [GetDateText] От гвардейских батальонов, которые предназначались для охраны и защиты вновь построенных укреплений вдоль немецкой границы. Существующие подразделения должны были быть усилены дополнительными людьми, главным образом из пехотных полков и инженерных, артиллерийских и сигнальных батальонов.\n\nДля службы в Border Regimens были отобраны только самые физически подготовленные солдаты, и все участники должны были быть отличными стрелками как с винтовками, так и с пулеметами.\n\nОднако самым важным фактором была надежность государства. Подавляющее большинство солдат в пограничных полках были чехословацкой национальности, т.е. чехи или словаки, потому что надежность солдат других национальностей не всегда могла быть гарантирована. Однако исключения существовали.\n\nПодходящие кандидаты должны были пройти требовательную подготовку по использованию различного оборудования, в том числе противотанковой пушки ВЗ. 36, пулеметы и другое оборудование, применяемое в тяжёлых укреплениях.\n\nУ пограничников был другой военный эполет с собачьей головой и номером полка в треугольнике."
 czke.208.a:0 "Сформировать пограничные бригады."
 CZKE_mobile_army:0 "Сформировать быстрые дивизии"
 CZKE_mobile_army_desc:0 "Чехословацкая армия планировала моторизацию, но огромная стоимость фортификационных работ ограничила бюджет на закупку новых грузовиков."
 CZKE_mobile_army_tooltip_reward:0 "\n§OОсобый бонус:§! новый шаблон дивизии (§YRychlá Divize§! — лёгкая танковая дивизия)."
 czke.209.t:0 "Чехословацкие быстрые дивизии"
 czke.209.d:0 "Быстрые дивизии были созданы осенью 1937 года для операций, требовавших скорости, манёвренности и высокой ударной мощи. Они объединяли кавалерийские, моторизованные и механизированные части и стали последней реорганизацией мобильных войск межвоенной Чехословакии.\n\nВ новые дивизии включили существующие кавалерийские и бронетанковые бригады.\n\nДо оккупации сформировали четыре дивизии, подчинённые штабам в Праге, Брно, Братиславе и Пардубице. Первая, вторая и четвёртая были расформированы к июлю 1939 года, а третья сохранилась в словацкой армии.\n\nОсновой служили лёгкие танки LT vz. 35 — около 300 машин в первых трёх дивизиях. Германия захватила 244 танка, 52 получила Словакия, а два позднее захватила Венгрия во время войны марта 1939 года."
 czke.209.a:0 "Сформировать быстрые дивизии"
 CZKE_new_doctrines:0 "Изучить новейшие военные доктрины"
 CZKE_new_doctrines_desc:0 "Чехословацкая армия должна перенять новейшие тенденции военной доктрины, современные методы подготовки и организации частей."
 CZKE_military_science_institute:0 "Военно-научный институт"
 CZKE_military_science_institute_desc:0 "Чехословацкий военно-научный институт, VÚV, был создан в 1920-е годы на основе Научного союза чехословацких офицеров."
 CZKE_military_science_institute_tooltip_reward:0 "\n§YНациональный дух§!, связанный с §Yисследованиями§!."
 czke.210.t:0 "Чехословацкий военно-научный институт"
 czke.210.d:0 "Чехословацкий военно-научный институт был создан в 1920-е годы на основе Научного союза чехословацких офицеров. Он несколько раз менял название, но в итоге стал известен как VÚV. Институт играл важную роль в разработке стратегии и теории для армии и Министерства национальной обороны. Союз офицеров продолжил издательскую деятельность и служил площадкой для обсуждения военных и политических вопросов.\n\nДовоенные генералы Чехословакии активно публиковались, но ни одна работа не получила известности книги Гудериана «Внимание — танки!».\n\nГенерал Сильвестр Блага, начальник Военной канцелярии президента, с 1932 года также руководил Военно-научным институтом и был известен обширной издательской деятельностью."
 czke.210.a:0 "Увеличить финансирование Военно-научного института"
 CZKE_military_science_institute_idea:0 "Военно-научный институт"
 CZKE_military_science_institute_idea_desc:0 "Средства для Военно-научного института обеспечены."
 CZKE_armament_program:0 "Начать программу вооружения"
 CZKE_armament_program_desc:0 "Неблагоприятное материальное положение армии вынудило правительство серьёзно заняться перевооружением. После сложных переговоров в 1936 году была принята программа вооружения, определившая приоритеты и сроки поставок различных видов техники."
 CZKE_armament_program_tooltip_reward:0 "\n§YЗакон об экономике§! ИЛИ §Yполитическая власть§!."
 czke.211.t:0 "Начать программу вооружения"
 czke.211.d:0 "Программа вооружения чехословацкой армии стала особенно важной после ремилитаризации Рейнской области Германией в 1936 году и кризиса коллективной безопасности в Европе.\n\nВесной 1936 года Министерство национальной обороны подготовило требования и детали проекта. Это был крупнейший и самый дорогой инвестиционный проект военной администрации со времени основания республики в 1918 году.\n\nВскоре стало ясно, что сроки выполнить невозможно, и к концу 1938 года было поставлено лишь 32 процента запланированного.\n\nТем не менее модернизация значительно усилила вооружённые силы. По некоторым оценкам, оборонные расходы составляли почти 10 процентов ВВП в 1937 году и около 15 процентов в 1938 году.\n\nБольшое влияние на программу оказали II отдел Министерства обороны, отвечавший за артиллерию и вооружение, и его начальник генерал Ян Нетик."
 czke.211.a:0 "Утвердить программу вооружения."
 CZKE_czechoslovak_firearms:0 "Модернизировать пехотное снаряжение"
 CZKE_czechoslovak_firearms_desc:0 "Хотя Чехословакия десятилетиями была крупным экспортёром оружия, собственная армия медленно принимала современные образцы пехотного вооружения. После начала перевооружения были размещены крупные заказы на винтовки и современные пулемёты."
 CZKE_czechoslovak_firearms_tooltip_reward:0 "\n Выбор между §YПехотное снаряжение§! или §YОборудование поддержки§! связанный §YИсследовательский бонус§!."
 czke.212.t:0 "Чехословацкое стрелковое оружие"
 czke.212.d:0 "Хотя Чехословакия более десяти лет была крупным экспортёром оружия, до 1936 года армия сравнительно медленно принимала современные образцы пехотного вооружения. Всё изменилось с началом программы перевооружения и крупными заказами винтовок и пулемётов. К Мюнхенскому кризису Чехословакия имела одну из лучше всего оснащённых армий мира и, предположительно, наибольшее число автоматического оружия на солдата — один образец на семь человек.\n\nВинтовка vz. 24, основанная на надёжной конструкции Mauser калибра 7,92 мм, была стандартным оружием армии и частей Стражи обороны государства. К [GetDateText] для мобилизации имелось 762 000 винтовок и 424,9 миллиона патронов, ещё 141,7 миллиона хранилось Управлением ŘOP в пограничных укреплениях.\n\nПредшественник знаменитого Bren, пулемёт ZB vz. 26 калибра 7,92 мм, был стандартным оружием подразделений поддержки и укреплений. Его конструкция Вацлава Голека экспортировалась и производилась по лицензии во многих странах, включая Великобританию и Китай. К 1936 году армия располагала 34 557 пулемётами, ещё несколько тысяч предназначались для укреплений.\n\nТяжёлый пулемёт TK vz. 37 был развитием vz. 35. Его использовали как оружие поддержки, танковый пулемёт и стационарное вооружение укреплений. Британская версия производилась как BESA.\n\nРуководство армии по неизвестной причине не проявляло интереса к пистолетам-пулемётам, хотя с 1937 года существовал современный прототип будущего Samopal vz. 38.\n\nПочти всё снаряжение после оккупации 1939 года было захвачено Германией и, по некоторым оценкам, могло вооружить около половины вермахта. Значительная часть современной техники поступила в дивизии СС."
 czke.212.a:0 "Модернизировать штатное оружие."
 czke.212.b:0 "Заказать тяжёлые пулемёты."
 CZKE_holek_brothers:0 "Разработать новое стрелковое оружие"
 CZKE_holek_brothers_desc:0 "Братья Голек разработали самые передовые образцы чешского стрелкового оружия, лицензировавшиеся по всему миру, во время работы в компании «Збройовка Брно»."
 CZKE_holek_brothers_tooltip_reward:0 "\n§YТеоретик§!, связанный со стрелковым оружием."
 firearms_designer:0 "Конструктор стрелкового оружия"
 czke.213.t:0 "Братья Голек"
 czke.213.d:0 "Большинство довоенных чешских образцов стрелкового оружия было разработано одной семьёй — братьями Голек.\n\nСтарший брат Вацлав специализировался на пулемётах и создал конструкции, легшие в основу лицензированных британских Bren и BESA.\n\nЭмануэль Голек разработал несколько самозарядных винтовок, включая ZH-29, использовавшуюся Национально-революционной армией Китая.\n\nМладший, Франтишек Голек, не создал отдельного образца, но его технические навыки помогли братьям довести многие проекты до серийного производства на «Збройовке Брно».\n\nВторая мировая война прервала перспективные карьеры братьев. Их потомки продолжили семейную традицию, но занимались главным образом охотничьими и спортивными винтовками."
 czke.213.a:0 "Заказать новые прототипы стрелкового оружия."
 CZKE_armament_1:0 "Поставки стрелкового оружия и боеприпасов"
 CZKE_armament_1_desc:0 "До 1936 года Чехословакия была крупным экспортёром оружия, а внутреннее производство легко покрывало все потребности вооружённых сил. Однако с ростом армейских заказов существующие заводы пришлось расширять."
 CZKE_armament_1_tooltip_reward:0 "\nБонус, связанный с §Yвоенной промышленностью§! и §Yпехотным снаряжением§!."
 czke.214.t:0 "Обеспечить поставки оружия"
 czke.214.d:0 "В 1930-е годы чехословацкое оружие экспортировалось по всему миру, главным образом странам Малой Антанты, государствам Балтии, Латинской Америки и Азии. Задолго до Второй мировой войны Чехословакия входила в шестёрку крупнейших экспортёров оружия.\n\nДолгое время промышленность легко покрывала внутренние потребности и одновременно экспортировала значительные объёмы. Но после увеличения заказов Министерства национальной обороны крупнейшим компаниям стало не хватать производственных мощностей, и потребовалось строительство новых заводов.\n\nВ 1936 году «Чешска Збройовка» открыла филиал в Угерски-Броде, построенный всего за 16 недель. ЧЗУБ выпускала широкий ассортимент стрелкового оружия.\n\nВ том же году «Селье и Белло» перенесла производство во Влашим. В 1938 году планировался ещё один завод в Порубке, Словакия, но проект остановило Мюнхенское соглашение.\n\nЭскалация японо-китайского конфликта стала огромной удачей для чехословацких компаний. По британским данным, более половины пулемётов, прошедших через Гонконг во второй половине 1938 года на пути в Китай, были чехословацкими; для винтовок доля составляла около трети.\n\nВ 1937 году «Селье и Белло» также получила китайский заказ на 200 миллионов патронов Mauser калибра 7,92 мм, но не успела выполнить контракт до начала войны."
 czke.214.a:0 "Расширить «Чешска Збройовка»."
 czke.214.b:0 "Расширить «Селье и Белло»."
 CZKE_zbrojovka:0 "«Селье и Белло»"
 CZKE_zbrojovka_desc:0 "Современный завод боеприпасов во Влашиме, Богемия."
 czub:0 "ЧЗУБ"
 czub_desc:0 "Оружейная компания из Угерски-Брода, филиал «Чешска Збройовка»."
 CZKE_armament_2:0 "Заключить контракты на вооружение"
 CZKE_armament_2_desc:0 "Чехословакия традиционно полагалась на отечественные компании в снабжении армии техникой и материалами.\n\n«Шкода» и ЧКД экспортировали современное оружие по всему миру, но до 1936 года руководство страны не имело стимула модернизировать оснащение вооружённых сил."
 CZKE_armament_2_tooltip_reward:0 "\n§YНациональный дух§!, связанный с §Yвоенной промышленностью§! и §Yвоенным производством§!."
 czke.215.t:0 "Контракты военной промышленности"
 czke.215.d:0 "Чехословакия традиционно полагалась на отечественные фирмы для снабжения армии техникой и припасами.\n\nКак Skoda, так и CKD экспортировали современное оружие в мир, включая некоторые из самых передовых танков, гаубиц и горных орудий. Однако до 1936 года у чехословацкого руководства не было стимула для модернизации техники вооружённых сил.\n\nВсё изменилось с оккупацией Рейнской области весной 1936 года, и в рамках программы вооружения начались работы по модернизации. Контракты на новое оборудование были подписаны практически с каждой компанией в отрасли вооружения.\n\nПервоначальная программа вооружения была расширена, и планировалось, что к 1942 году армия будет оснащена 1050 танками, 2420 полевыми орудиями, 680 минометами, 1740 противотанковыми пушками, почти 700 зенитными орудиями и 850 самолётами.\n\nПо оценкам Министерства национальной обороны, производственные мощности чехословацкой военной промышленности в 1938 году составляли около 40 000 винтовок, 3000 пулеметов, 130 полевых орудий, 50-60 танков и 100 самолетов в месяц.\n\nУ Skoda и CKD обычно было соглашение о картеле, поэтому любые заказы, как правило, распределялись между обеими компаниями и их дочерними компаниями, но приоритеты должны были быть установлены."
 czke.215.a:0 "Отдать приоритет заказам новых полевых орудий."
 czke.215.b:0 "Отдать приоритет заказам новых танков."
 CZKE_skoda_works:0 "Заводы «Шкода»"
 CZKE_skoda_works_desc:0 "Заводы «Шкода» были одним из крупнейших промышленных концернов Европы XX века."
 CZKE_ckd_company:0 "ЧКД"
 CZKE_ckd_company_desc:0 "ЧКД была одной из крупнейших машиностроительных компаний бывшей Чехословакии."
 CZKE_armament_2b:0 "Заказать военные грузовики"
 CZKE_armament_2b_desc:0 "Чехословацкая армия планировала расширить моторизацию. К сожалению, огромные расходы на фортификационные работы ограничили бюджет на закупку новых грузовиков."
 CZKE_armament_2b_tooltip_reward:0 "\n§YНациональный дух§!, связанный с §Yвоенной промышленностью§! и §Yвоенным производством§!."
 czke.216.t:0 "«Рингхоффер — Татра»"
 czke.216.d:0 "История «Татры» начинается в 1850 году, когда Игнац Шустала вместе с двумя подмастерьями начал производить экипажи в Копршивнице, тогда Нессельсдорфе.\n\nПосле 1918 года компания была переименована из Nesselsdorfer Wagenbau в Kopřivnická vozovka, а управление перенесли из Вены в Прагу. В 1919 году марка TATRA впервые появилась на автомобилях.\n\nВ 1926 году предприятие вошло в корпорацию «Рингхоффер». В 1936 году была создана компания Ringhoffer TATRA, позднее переименованная в Ringhoffer TATRA Werke AG.\n\nЗа исключением отдельных контрактов на бронеавтомобили, компания редко побеждала в военных конкурсах: картель ЧКД/«Шкода» почти всегда получал армейские заказы, нередко благодаря взяткам. Тем не менее «Татра» продолжала разрабатывать бронемашины и экспериментальные танки наряду с автомобилями, грузовиками и локомотивами.\n\nВо время Второй мировой войны «Татра» производила грузовики и танковые двигатели для Германии, включая знаменитый T 111 с двенадцатицилиндровым дизелем воздушного охлаждения.\n\nАвтомобиль Tatra 87 пользовался популярностью у германских офицеров благодаря скорости и управляемости на автобанах. Машины «Татра» повлияли на Гитлера и Порше, а сам Гитлер ездил на них во время политических поездок по Чехословакии.\n\nМногие германские офицеры погибли, не справившись с тяжёлыми заднемоторными автомобилями на поворотах. Из-за этого «Татру» в шутку называли «чешским секретным оружием», а в какой-то момент германским офицерам официально запретили садиться за руль."
 czke.216.a:0 "Заказать новые грузовики."
 tatra:0 "«Рингхоффер — Татра»"
 tatra_desc:0 "Компания из Копршивнице, крупный производитель автомобилей, грузовиков и локомотивов."
 CZKE_motorization_factories:0 "Усилия по моторизации"
 CZKE_motorization_factories_desc:0 "Заказ новых грузовиков у компании «Татра»."
 CZKE_new_tanks:0 "Провести полевые испытания новых танков"
 CZKE_new_tanks_desc:0 "В 1937 году чехословацкие вооружённые силы объявили конкурс на новый средний танк, в котором участвовали «Шкода», ЧКД и «Татра». В итоге армия заказала LT vz. 38 у ЧКД/«Шкоды», который нацистская Германия позднее использовала против Польши и Франции. Среди проектов также был средний танк ST.39 от ЧКД."
 CZKE_new_tanks_tooltip_reward:0 "\nНовый вариант §Yлёгкого танка§! ИЛИ исследование §Yсреднего танка§!."
 czke.217.t:0 "Модернизация танков чехословацкой армии"
 czke.217.d:0 "Из-за ухудшения международной обстановки чехословацкие вооружённые силы объявили конкурс на новый танк. Наиболее многообещающими оказались модернизированный лёгкий TNHP и прототип среднего V-8-H.\n\nВ 1935 году ЧКД стремилась заменить LT vz. 35, производившийся совместно со «Шкодой». Получившаяся машина была надёжной и успешно экспортировалась под названием TNH: 50 танков отправили в Иран, по 24 — в Перу и Швейцарию, ещё несколько заказала Литва. Модернизированный вариант, позднее известный как LT vz. 38, участвовал в конкурсе.\n\nПроект V-8-H начался в конце 1930-х и позднее получил обозначение ST vz. 39. Армия заказала несколько сотен машин, но после Мюнхенского соглашения заказ отменили, и танк не пошёл в серию.\n\nКакие танки следует заказать для чехословацкой армии?"
 czke.217.a:0 "Заказать производство лёгких танков LT vz. 38."
 czke.217.b:0 "Продолжить разработку среднего танка V-8-H."
 skoda_works_artillery:0 "Заводы «Шкода»"
 skoda_works_industry:0 "Заводы «Шкода»"
 ckd_tanks:0 "ЧКД и «Шкода»"
 ckd_electric:0 "ЧКД"
 CZKE_artillery_focus:0 "Модернизация артиллерии"
 CZKE_artillery_focus_desc:0 "Заводы «Шкода» выпускали множество превосходных артиллерийских, противотанковых и зенитных орудий, многие из которых состояли на вооружении чехословацкой армии."
 CZKE_armoured_cars:0 "Модернизация бронеавтомобилей"
 CZKE_armoured_cars_desc:0 "Чехословацкая армия испытывала различные бронеавтомобили «Татра» с 1926 года, было построено множество прототипов. В итоге заказали около 50 машин OA vz. 30.\n\nВо время Второй мировой войны «Татра» разработала первый дизель воздушного охлаждения — огромный V12, первоначально предназначенный для бронеавтомобиля Sd.Kfz. 234 «Пума»."
 CZKE_mechanized_units:0 "Бронетранспортёры"
 CZKE_mechanized_units_desc:0 "Нужно сосредоточиться на разработке специализированной бронетехники для моторизованной пехоты."
 CZKE_new_tank_design:0 "Разработать новые танки"
 CZKE_new_tank_design_desc:0 "Нужно сосредоточиться на создании новых современных танков."
 CZKE_air_is_our_sea:0 "Воздух — наше море"
 CZKE_air_is_our_sea_desc:0 "Чехословацкому руководству требовалось создать боеспособные ВВС для современной страны без выхода к морю, окружённой потенциально враждебными соседями. Так родился девиз «Воздух — наше море»."
 CZKE_air_is_our_sea_tooltip_reward:0 "\nБонус к исследованию §Yвоздушных доктрин§!."
 czke.218.t:0 "История чехословацких ВВС"
 czke.218.d:0 "В октябре 1918 года бывшие чешские военнослужащие австро-венгерских авиационных частей встретились на острове Жофин в Праге. Тогда никто не знал, что они основывают одни из самых выдающихся ВВС Европы. Вокруг сержанта Кострбы собрались энтузиасты, но самолётов не было. Значительную помощь оказала Франция, передавшая 127 машин.\n\nЧехословацкому руководству требовалось создать сильные ВВС для современной страны без выхода к морю, окружённой потенциально враждебными соседями. Так родился девиз «Воздух — наше море». Между войнами правительство развивало отечественную авиационную промышленность и одновременно приобретало лицензии на двигатели и самолёты союзников. В 1930-е годы процветали компании «Авиа», «Аэро» и государственная «Летов».\n\nХотя Германия заняла Чехословакию без боя, многие чехословацкие пилоты достойно сражались за рубежом. С 1939 года они отправлялись в Польшу, Югославию и Францию, а затем воевали на различных фронтах.\n\nПервую крупную победу они одержали в Битве за Британию в составе пяти чехословацких эскадрилий Королевских ВВС — 68-й, 310-й, 311-й, 312-й и 313-й.\n\nПо соглашению лондонского правительства Чехословакии с СССР часть пилотов отправилась на Восточный фронт и сформировала первый Чехословацкий истребительный полк.\n\nНа Западе чешские лётчики продолжали бороться с люфтваффе, патрулировали Атлантику, уничтожали ракеты V-1 и участвовали в высадке в Нормандии.\n\nЕсли в 1918 году о чешских пилотах почти никто не знал, то к 1945 году они были среди лучших в мире."
 czke.218.a:0 "«Воздух — наше море» (девиз чехословацких ВВС)."
 CZKE_czechoslovak_airforce:0 "Расширить чехословацкие ВВС"
 CZKE_czechoslovak_airforce_desc:0 "Весной 1935 года Германия открыто признала создание мощных ВВС. Чехословакия и Франция ответили углублением авиационного сотрудничества и расширением своих воздушных сил."
 CZKE_czechoslovak_airforce_tooltip_reward:0 "\nБесплатный §Yглавнокомандующий ВВС§! и §Yавиабаза§!."
 czke.219.t:0 "Расширение чехословацких ВВС"
 czke.219.d:0 "Чехословацкие ВВС подчинялись Министерству национальной обороны как III отдел, отвечавший за авиацию и противовоздушную оборону. Это был один из самых престижных родов войск, хотя личный состав составлял лишь около 4 процентов армии.\n\nКак и сухопутные силы, ВВС полагались почти исключительно на отечественное производство оружия и оборудования, позднее приобретая лицензии во Франции и СССР.\n\nВ 1934 году Министерство решило вооружить ВВС единым типом истребителя — бипланом Avia B.534, ставшим основой авиации. Всего построили 568 машин четырёх серий.\n\nПосле открытого объявления Германии о создании мощных ВВС весной 1935 года Чехословакия и Франция углубили сотрудничество. Три аэродрома расширили до семи, каждый мог принять две французские бомбардировочные эскадрильи в случае войны.\n\nВ начале 1936 года заказали новую партию Avia B.534, поступившую в строй весной 1937 года. Последняя серия развивала скорость более 320 км/ч и не уступала лучшим бипланам своего времени.\n\nГенерал Ярослав Файфр возглавлял III отдел с 1927 года и внёс значительный вклад в развитие и организацию ВВС."
 czke.219.a:0 "Выделить больше средств III отделу."
 CZKE_air_modernization:0 "Военный авиационный завод «Летов»"
 CZKE_air_modernization_desc:0 "Между войнами чехословацкое правительство сочетало развитие собственной авиационной промышленности с лицензированием двигателей и самолётов союзников. Военный завод «Летов» был создан для ремонта и модернизации старых машин, многие модели постоянно дорабатывались для продления срока службы."
 CZKE_air_modernization_tooltip_reward:0 "\nНовые варианты §Yистребителя§! и §Yштурмовика§!."
 czke.220.t:0 "История компании «Летов»"
 czke.220.d:0 "Компания «Летов» — старейший авиапроизводитель бывшей Чехословакии. Она была основана в 1918 году Министерством национальной обороны как государственное предприятие по ремонту самолётов Первой мировой войны, унаследованных чехословацкими ВВС.\n\nЗавод располагался в Летнянах, Прага, и в конце 1930-х насчитывал около 1200 работников. Он выпускал разведывательные и лёгкие бомбардировщики Š-328, которых построили более 450. Каркас самолёта был полностью сварным.\n\n«Летов» был единственным чехословацким заводом, производившим металлические пропеллеры.\n\nВо время Второй мировой войны предприятие ремонтировало самолёты люфтваффе и развернуло производство боевых вариантов Ju 290.\n\nМногие чехословацкие самолёты, включая Avia B.534 и Letov Š-328, неоднократно модернизировались и выпускались сериями с устранением выявленных недостатков."
 czke.220.a:0 "Модернизировать чехословацкие военные самолёты."
 CZKE_pilot_training:0 "Военная авиационная школа"
 CZKE_pilot_training_desc:0 "Чехословацкие пилоты имели хорошую репутацию ещё до Второй мировой войны. После оккупации многие бежали в Польшу или Францию, а затем оказались в Англии и участвовали в Битве за Британию."
 CZKE_pilot_training_tooltip_reward:0 "\nНовый §Yлётчик-ас§! и бонус к исследованию §Yвоздушных доктрин§!."
 czke.221.t:0 "Военная авиационная школа в Простеёве"
 czke.221.d:0 "История чехословацкого военного авиационного образования начинается в 1919 году с Лётной школы в Праге.\n\nВ 1920 году важным центром стал Хеб, однако в 1927 году школу перенесли в новый комплекс в Простеёве и переименовали в Военную авиационную школу.\n\nДвухлетняя программа готовила высококвалифицированных офицеров, механиков и технический персонал, крайне необходимый ВВС.\n\nМногие участники Битвы за Британию были выпускниками школы в Простеёве, включая Йозефа Франтишека, одного из самых результативных асов союзников."
 czke.221.a:0 "Финансировать программы военного авиационного образования."
 CZKE_armament_3:0 "Расширить производство самолётов"
 CZKE_armament_3_desc:0 "Компания «Авиа» вошла в состав заводов «Шкода» в 1929 году и вскоре стала крупнейшим производителем самолётов в Чехословакии, переехав в Летняны под Прагой.\n\nВо время Второй мировой войны «Авиа» выпускала самолёты для германских люфтваффе."
 CZKE_armament_3_tooltip_reward:0 "\n§YНациональный дух§!, связанный с §Yвоенной промышленностью§! и §Yвоенным производством§!."
 czke.222.t:0 "История компании «Авиа»"
 czke.222.d:0 "«Авиа» была крупнейшей авиационной компанией довоенной Чехословакии. Она основана в 1919 году на бывшем сахарном заводе в Высочанах, Прага, как ремонтное предприятие, но вскоре начала выпуск самолётов. В 1926–1929 годах компания постепенно вошла в состав «Шкоды» и переехала в новый завод в Летнянах.\n\nВ 1931 году главным конструктором стал Франтишек Новотны, разработавший биплан B.534 для чехословацких ВВС. Компания также выпускала лицензионную версию советского бомбардировщика Туполев СБ-2 под обозначением B.71.\n\nВо второй половине 1936 года в Куновице построили новый ремонтный завод, позволивший пражским предприятиям увеличить выпуск самолётов.\n\nВо время Второй мировой войны «Авиа» производила и ремонтировала самолёты люфтваффе."
 czke.222.a:0 "Построить новый завод в Куновице."
 CZKE_avia_letnany:0 "Авиационная компания «Авиа Летняны»"
 CZKE_avia_letnany_desc:0 "Современная авиационная компания, расположенная в Летнянах, Прага."
 CZKE_paradesant_brigade:0 "Создать воздушно-десантные бригады"
 CZKE_paradesant_brigade_desc:0 "Опираясь на [SOV.getAdjective]ую и французскую программы подготовки парашютистов, чехословацкое верховное командование летом 1938 года решило начать создание воздушно-десантных частей. За подготовительную работу отвечал III авиационный отдел Министерства государственной обороны."
 CZKE_advanced_aircraft_prototypes:0 "Разработать новые самолёты"
 CZKE_advanced_aircraft_prototypes_desc:0 "Чехословацким компаниям необходимо быстро наверстать отставание в авиационной промышленности — либо создавая собственные прототипы, либо приобретая лицензии на успешные иностранные самолёты."
 air_plane_models:0 "Модели самолётов"
 CZKE_jet_engine_research:0 "Исследование реактивных двигателей"
 CZKE_jet_engine_research_desc:0 "Ракетные и реактивные двигатели обеспечивают беспрецедентные скорости как для судов без экипажа, так и для экипажей. Новаторство этих технологий позволяет нам застать врага врасплох."
 CZKE_legacy_of_legions:0 "Наследие Чехословацких легионов"
 CZKE_legacy_of_legions_desc:0 "Чехословацкие легионы были добровольческими вооружёнными формированиями, состоявшими преимущественно из чехов и небольшого числа словаков, которые сражались на стороне Антанты в Первой мировой войне. После создания Чехословакии многие бывшие легионеры поступили на службу в новую армию, принеся с собой ценный боевой опыт."
 CZKE_legacy_of_legions_tooltip_reward:0 "\n§YПолитическая власть§! ИЛИ §Yнациональный дух§!, связанный с §Yдобровольцами§!, ИЛИ §Yопыт армии§!."
 CZKE_czechoslovak_volunteers_idea:0 "Чехословацкий союз добровольцев"
 CZKE_czechoslovak_volunteers_idea_desc:0 "Чехословацкое добровольческое движение имеет давние традиции. Во время гражданской войны в Испании почти 1000 чехословаков сражались на стороне республиканцев в составе интернациональных бригад."
 czke.300.t:0 "История Чехословацких легионов"
 czke.300.d:0 "Чехословацкие легионы были добровольческими вооружёнными формированиями, состоявшими главным образом из чехов и небольшого числа словаков, воевавших на стороне Антанты в Первой мировой войне. Их целью было добиться поддержки союзников для независимости Богемии, Моравии и словацких земель от Австро-Венгрии.\n\nПри поддержке эмигрантских политиков и интеллектуалов, включая Томаша Гаррига Масарика и Милана Растислава Штефаника, легионы выросли до десятков тысяч бойцов на различных фронтах.\n\nВ России они участвовали в сражениях при Зборове и Бахмаче, а затем активно вмешались в Гражданскую войну, сражались с большевиками и контролировали Транссибирскую магистраль и крупные города Сибири.\n\nИх кампания произвела сильное впечатление на союзников и способствовала признанию идеи независимой Чехословакии.\n\nПосле перемирия с большевиками началась медленная эвакуация через Владивосток. Последние легионеры покинули порт в сентябре 1920 года, обогнув мир по пути на родину.\n\nВернувшись, многие составили ядро новой армии. Они составляли около трети личного состава, но доминировали в высшем командовании; почти все генералы были бывшими легионерами.\n\nЧехословацкое объединение легионеров было основано в 1921 году путём слияния организаций ветеранов разных фронтов."
 czke.300.a:0 "Использовать влияние Чехословацкого объединения легионеров."
 czke.300.b:0 "Поддержать военные добровольческие организации."
 czke.300.c:0 "Уроки Великой войны."
 legion_bug:0 "\n§OОсобый бонус:§! можно отправлять §Gдобровольцев§! даже при минимальном уровне §Yмировой напряжённости§!."
 CZKE_reorganize_general_staff:0 "Реорганизовать Генеральный штаб"
 CZKE_reorganize_general_staff_desc:0 "Организационная структура чехословацкой армии первоначально основывалась на французской системе командования, а первыми начальниками штаба были французские генералы. После подготовки нового поколения чешских офицеров необходимость во французских кадрах отпала."
 CZKE_reorganize_general_staff_tooltip_reward:0 "\nВыбор между тремя различными §Yначальниками генерального штаба§! чехословацкой армии."
 czke.301.t:0 "Генеральный штаб чехословацкой армии"
 czke.301.d:0 "Последняя крупная реорганизация генерального штаба произошла в 1933 году, когда генерал Сыровый стал генеральным инспектором вооружённых сил и потребовался новый начальник штаба.\n\nК удивлению многих, был выбран трудолюбивый, но малоизвестный командующий сухопутным округом в Кошице генерал Людвик Крейчи. Его кандидатура стала приемлемым компромиссом для большинства партий и армейских кругов.\n\nРассматривались и другие кандидаты. Глава французской военной миссии генерал Фоше на короткое время также считался возможным претендентом, однако возвращение к иностранному начальнику штаба было политически неприемлемо.\n\nОсобый интерес представлял генерал Лев Прхала, бывший заместитель начальника штаба при Сыровом. Он был энергичным сторонником современной и мобильной войны, но его германская жена дала противникам повод объявить его неподходящим кандидатом.\n\nВо время Мюнхенского кризиса Прхала командовал IV армией в Южной Моравии и выступал против сдачи Судет. Позднее его отношения с Эдвардом Бенешем окончательно испортились. После войны он остался в эмиграции.\n\nХодили слухи о его участии в несостоявшемся военном перевороте. По словам сына, он всю жизнь сожалел, что не застрелил президента Бенеша во время Мюнхенского кризиса.\n\nДругим серьёзным кандидатом был генерал Войтех Лужа, руководитель Высшей военной школы и сторонник наступательной бронетанковой войны, вдохновлённой идеями Фоша, Людендорфа и Гудериана. Во время кризиса он командовал II армией, а в годы оккупации участвовал в сопротивлении и погиб в перестрелке с силами протектората."
 czke.301.a:0 "Утвердить генерала Крейчи."
 czke.301.b:0 "Назначить генерала Прхалу."
 czke.301.c:0 "Назначить генерала Лужу."
 CZKE_military_maneuvers:0 "Организовать военные манёвры"
 CZKE_military_maneuvers_desc:0 "Чехословацкая армия испытала новую организацию и возможности во время крупных манёвров в августе и сентябре 1936 года. Учения дали ценные уроки и ясно продемонстрировали Европе готовность вооружённых сил."
 CZKE_military_maneuvers_tooltip_reward:0 ""
 CZKE_prepare_new_plan:0 "Подготовить новую оборонительную стратегию"
 CZKE_prepare_new_plan_desc:0 "После прихода Гитлера к власти и его требований объединить германские меньшинства и вернуть Судетскую область встревоженное чехословацкое руководство и верховное командование разработали новые оборонительные планы."
 CZKE_prepare_new_plan_tooltip_reward:0 ""
 CZKE_2nd_departnment:0 "Расширить II отдел"
 CZKE_2nd_departnment_desc:0 "II отдел генерального штаба был службой военной разведки Чехословакии в 1919–1939 годах и отвечал за шпионаж и контрразведку."
 CZKE_2nd_departnment_tooltip_reward:0 "\n§YБонус к исследованиям§!, связанным с §Yэлектроникой и вычислительной техникой§!."
 czke.304.t:0 "II отдел генерального штаба"
 czke.304.d:0 "С начала своего создания Чехословацкой Республике пришлось решать ряд проблем внутреннего характера, которые представлялись в основном деятельностью многочисленных национальных меньшинств, живших в пределах границ и представлявших собой благодатную базу для шпионажа и потенциальной диверсионной деятельности.\n\nНо именно разоблачение шпионажа, совершенного немецким консулом в Праге бароном Габсаттелем в 1919 году, побудило штаб чехословацкой армии создать новую, отдельную военную разведывательную службу. 2-й отдел Генерального штаба.\n\nВ течение первых нескольких лет 2-й отдел занимался главным образом нехваткой личного состава, поскольку начальник военной разведки в тогдашней австро-венгерской армии бригадир Макс Ронге был против помещения офицеров чешской национальности в разведывательную службу монархии. Потребовалось около десяти лет, прежде чем новое, молодое поколение офицеров получило образование в Военной академии и Военном колледже. Уровень разведывательной деятельности можно было бы постепенно повышать. 2-й отдел был скомпрометирован из двух групп. Поисковая группа была разделена на наступательные и оборонительные участки, а план-исследовательская группа носила более или менее аналитический характер.\n\nВ бурные годы перед Второй мировой войной, лейтенант. Кол. Франтишек Моравец возглавлял 2-й департамент с 1937 по 1939 год, прежде чем ему и десяти его коллегам-разведчикам удалось тайно улететь с самыми ценными разведывательными файлами и архивами из Праги в Лондон, всего за один день до оккупации Чехословакии нацистской Германией.\n\nВо время войны он сыграл важную роль в планировании и подготовке операции «Антропоид», убийства Рейхс-протектора Рейнхарда Гейдриха в 1942 году."
 czke.304.a:0 "Расширить II отдел."
 CZKE_intelligence_service_offense:0 "Расширить наступательную секцию"
 CZKE_intelligence_service_offense_desc:0 "Главной задачей наступательной секции было получение внешней информации о военных угрозах, включая военные, политические и экономические данные."
 CZKE_intelligence_service_defense:0 "Расширить оборонительную секцию"
 CZKE_intelligence_service_defense_desc:0 "Главной задачей оборонительной секции было предотвращение проникновения иностранных разведывательных групп в чехословацкую армию и стратегически важные области обороны, включая военную промышленность и фортификационные проекты."
 CZKE_infiltrate_abwehr:0 "Внедриться в Абвер"
 CZKE_infiltrate_abwehr_desc:0 "Положение германского меньшинства в Чехословакии создавало благоприятные условия для операций Абвера. Однако это же открывало возможности для внедрения двойных агентов чехословацкой контрразведки."
 CZKE_infiltrate_abwehr_tooltip_reward:0 "\n§YНациональный дух§!, связанный с §Yразведывательной службой§!."
 czke.305.t:0 "История агента А-54"
 czke.305.d:0 "Пауль Тюммель, известный как агент А-54, был германским двойным агентом, работавшим на Чехословакию. В 1932 году он сам связался со II отделом, главным образом из-за денежных проблем и расточительного образа жизни.\n\nОн занимал высокий пост в Абвере и был награждённым членом нацистской партии с хорошими связями ещё со времён основания СА.\n\nТюммель передавал чешским агентам обширные сведения о германских разведслужбах, которые затем направлялись в британскую SIS. Он сообщал о военных возможностях и намерениях Германии, структуре Абвера и СД, составе вермахта и люфтваффе и мобилизационных планах. Также считается, что он заранее предупреждал об аннексии Судет и вторжениях в Чехословакию и Польшу.\n\nВ октябре 1941 года гестапо обвинило его в предупреждении югославских властей о германском нападении и в связях с капитаном Вацлавом Моравеком. Адмирал Канарис защищал его как двойного агента Абвера.\n\nИсторики до сих пор спорят, был ли А-54 выдающимся двойным агентом или частью сложной операции Абвера по дезинформации. В конце концов Тюммель был арестован, обвинён в измене и убит СС в Терезиенштадте в апреле 1945 года."
 czke.305.a:0 "Связаться с агентом А-54."
 CZKE_military_intelligence_service_idea:0 "Военная разведывательная служба"
 CZKE_sabotage_anchluss:0 "Саботировать австро-германский союз"
 CZKE_sabotage_anchluss_desc:0 "Восстановление монархии Габсбургов представляет для Чехословакии столь же серьёзную угрозу, как австрофашизм и возможный австро-германский союз. Мы должны остановить это любой ценой."
 CZKE_sabotage_anchluss_tooltip_reward:0 "\n§OОсобый бонус:§! Австрия с гораздо большей вероятностью будет сопротивляться германским попыткам захватить страну."
 CZKE_support_oster:0 "Поддержать переворот офицеров вермахта"
 CZKE_support_oster_desc:0 "Наши источники в Абвере сообщают о возможных попытках свергнуть Гитлера. Возможно, наш агент сможет тайно поддержать эту инициативу."
 CZKE_support_oster_tooltip_reward:0 "\n§OОсобый бонус:§! некоторые офицеры вермахта могут убить Гитлера и начать гражданскую войну, чтобы отстранить нацистов от власти."
 czke.309.t:0 "Гитлер мёртв!"
 czke.309.d:0 "[Root.GetLeader], похоже, офицеры вермахта убили Адольфа Гитлера, а различные группировки теперь борются за власть в НСДАП. Часть германской армии открыто восстала и пытается отстранить национал-социалистов до того, как они уничтожат Германию.\n\nНачальник штаба ожидает вас в соседней комнате."
 czke.309.a:0 "Мы должны немедленно вмешаться!"
 czke.309.b:0 "Мы не станем вмешиваться в германские дела."
 CZKE_soviet_intelligence:0 "ВОНАПО 20"
 CZKE_soviet_intelligence_desc:0 "[SOV.getAdjective]ая разведывательная станция под кодовым названием VONAPO 20 была создана в Праге в 1936 году как совместный проект обмена информацией между чехословацкой и [SOV.getAdjective]ой разведками."
 CZKE_soviet_intelligence_tooltip_reward:0 "\n§YНациональный дух§!, связанный с §Yразведывательными службами§!."
 czke.310.t:0 "Межвоенное чехословацко-[SOV.getAdjective]ое разведывательное сотрудничество"
 czke.310.d:0 "Чехословакия не была одной из главных целей советского шпионажа. Кремль гораздо больше интересовался Польшей и Германией. Тем не менее, большевистские агенты пристально следили за многочисленными русскими и украинскими эмигрантами, которые поселились в Чехословакии, а оперативники ГРУ также проводили обширный промышленный шпионаж.\nС нарастающей угрозой для республики со стороны Германии второе ведомство начало интенсивное сотрудничество с советской военной разведкой ГРУ. Чехословакия перестала быть целью для советских шпионов и стала «безопасным плацдармом» для действий в Германии и Западной Европе.\n\nВ то же время уровень промышленного шпионажа снизился, поскольку чешские оружейные компании поставляли свою продукцию в Чехию. [SOV.getnameDef]. [SOV.getAdjective] На чешских фабриках обучались специалисты.\n\n27 мая 1936 года была создана специальная совместная операция под кодовым названием ВОНАПО 20 для обмена разведывательной информацией. Однако, за исключением двух конференций, поток информации был только в одном направлении; Из Праги в Москву. Россияне обычно не предоставляли никакой информации.\n\nКапитан штаба Карел Палечек отвечал за проект VONAPO 20 до оккупации Чехословакии. Он был одним из десяти офицеров разведки, сопровождавших полковника Моравека во время его побега в Лондон в 1939 году."
 czke.310.a:0 "Организовать встречу VONAPO 20."
 CZKE_vonapo20_idea:0 "ВОНАПО 20"
 CZKE_vonapo20_desc_idea:0 "Совместная [SOV.getAdjective]ая разведывательная станция в Праге."
 CZKE_uranium_for_soviets:0 "Предоставить уран [SOV.getAdjective]им властям"
 CZKE_uranium_for_soviets_desc:0 "НКВД связался с нами с интересным предложением по поводу урана. Их намерения остаются загадкой, однако [SOV.getAdjective]ая сторона предлагает значительную компенсацию за тайное приобретение урана вне официальных каналов."
 CZKE_uranium_for_soviets_tooltip_reward:0 "\nВозможный обмен §Yгражданской промышленности§! на §Yресурсы§!."
 czke.311.t:0 "Продать уран государству [SOV.getnameDef]"
 czke.311.d:0 "The [SOV.getAdjective] Проект по разработке атомной бомбы начался во время Второй мировой войны из-за открытия американского, британского и канадского ядерного проекта. Проектом руководил [SOV.getAdjective] Ядерный физик Игорь Курчатов, в то время как военная логистика и разведка были предприняты и управлялись наркомом НКВД Лаврентием Берией.\n\nЕдинственной наиболее значительной проблемой в начале советского проекта была закупка урановой руды, поскольку СССР не имел известных внутренних источников в начале проекта. Крупные месторождения Казахстана и других регионов Советского Союза пока не были обнаружены, поэтому проект пришлось полагаться на зарубежные источники.\n\nНе надуманно думать, что более тесное сотрудничество между чехословацкой разведкой и НКВД могло быть использовано для тайных закупок урановой руды у Яхимова в обмен на нефть или другие полезные ископаемые чешской промышленности остро не хватало."
 czke.311.a:0 "Попытаться договориться с их агентами."
 czke.312.t:0 "Чехословацкий уран для [SOV.getAdjective]ой ядерной программы"
 CZKE_hungarian_alliance:0 "Венгерский союз"
 CZKE_hungarian_alliance_desc:0 "Теперь, когда в Венгрии восстановлена демократия, она должна стать нашим союзником, а не врагом."
 czke.312.d:0 "Товарищ [SOV.GetName], НКВД сообщает, что может получить высококачественную урановую руду из Чехословакии в обмен на поставки сырой нефти и других ресурсов. Следует ли заключить сделку?"
 czke.312.a:0 "Да. Получить как можно больше для наших исследований."
 czke.312.b:0 "Закупить только несколько образцов; сейчас у нас другие приоритеты."
 czke.313.t:0 "[SOV.getAdjective]ая сторона заинтересована в нашем уране"
 czke.313.d:0 "Господин премьер-министр, военная разведка сообщает об успешном соглашении с НКВД. Поставки ресурсов вскоре начнутся и будут складироваться в охраняемом военном хранилище в горах Карпатской Руси."
 czke.313.a:0 "Отлично."
 czke.314.t:0 "[SOV.getAdjective]ая сторона не заинтересована в нашем уране"
 czke.314.d:0 "Господин премьер-министр, разведка сообщает, что [SOV.getAdjective]ая сторона не заинтересована в регулярных поставках урана. Однако она готова приобрести небольшое количество для теоретических исследований ядерных технологий."
 czke.314.a:0 "Жаль, но это всё же лучше, чем ничего."
 CZKE_french_military_mission:0 "Французская военная миссия"
 CZKE_french_military_mission_desc:0 "По просьбе правительства в 1919 году в Чехословакию была направлена группа французских офицеров для помощи в создании и организации новой армии и подготовке офицеров."
 CZKE_french_military_mission_tooltip_reward:0 "\n§GФранко-чехословацкий союз§! и бесплатный §Yтеоретик§! ИЛИ §Yопыт армии§!."
 CZKE_czech_france_alliance:0 "Франко-чехословацкий союз"
 czke.315.t:0 "Истоки французской военной миссии в Чехословакии"
 czke.315.d:0 "Вскоре после провозглашения независимости в Чехословакию прибыла французская военная миссия для создания армии и подготовки офицеров. Первым испытанием стала короткая война с Венгрией за Словакию в 1919 году. После победы генерал Пелле приобрёл большую популярность.\n\nПод его командованием армия доказала боеспособность. Пелле продвигал идею постоянной чехословацкой армии как части союзных сил и добился отражения этой концепции в законе о национальной обороне 1920 года. Тогда же открылась первая военная академия.\n\nПелле возглавлял миссию и генеральный штаб в 1919–1920 годах и выступал посредником между Чехословакией и Францией, нередко поддерживая Прагу вопреки мнению французского начальства. В Праге он встретил будущую жену.\n\nВ 1921 году его сменил генерал Эжен Миттельхауссер, а в 1926 году — Луи Эжен Фоше, руководивший миссией до 1938 года.\n\n25 января 1924 года в Париже был подписан договор о союзе и дружбе между Францией и Чехословакией."
 czke.315.a:0 "Укрепить полномочия миссии."
 czke.315.b:0 "Увеличить финансирование военных академий."
 CZKE_france_alliance:0 "Научный и культурный обмен"
 CZKE_france_alliance_desc:0 "В межвоенный период чешско-французские отношения имели привилегированный статус. Научные и культурные связи развивались как политически особые, а франкофильское лобби занимало важные посты в министерствах образования и обороны."
 CZKE_soviet_treaties:0 "Улучшить договоры с [SOV.getAdjective]ой стороной"
 CZKE_soviet_treaties_desc:0 "16 мая 1935 года Чехословакия и Советский Союз подписали союзный договор вслед за советско-французским соглашением. В критические годы перед Мюнхеном многие надеялись на помощь СССР в случае войны."
 CZKE_soviet_treaties_tooltip_reward_1:0 "\n§G[SOV.getAdjective]-чехословацкий союзный договор§! и §Yдипломатическое событие§!.\n"
 CZKE_soviet_treaties_tooltip_reward_2:0 "\nПереговоры о §Yвоенной технологии§!:\n§OТактический бомбардировщик I§! (шанс 90%)."
 CZKE_soviet_treaties_positive:0 "[SOV.getAdjective]-чехословацкий союзный договор"
 CZKE_soviet_treaties_negative:0 "[SOV.getAdjective]-чехословацкий союзный договор"
 czke.316.t:0 "Чехословацко-[SOV.GetAdjective]ие отношения"
 czke.316.d:0 "Отношения Чехословакии и государства [SOV.GetNameDef] были сложными. Враждебность уходила корнями в вооружённый конфликт между большевиками и Чехословацкими легионами после Великой войны.\n\nПервый премьер-министр Карел Крамарж лично ненавидел большевиков, поскольку его жена происходила из русской знати. Поэтому Чехословакия одной из последних признала СССР — лишь в 1934 году.\n\n16 мая 1935 года был подписан чехословацко-советский союзный договор, связанный с союзом СССР и Франции. По настоянию Праги он вступал в силу только в случае помощи Франции жертве агрессии.\n\nПосле Мюнхенского соглашения и германской оккупации в марте 1939 года Советский Союз отказался признавать прекращение независимости Чехословакии."
 czke.316.a:0 "Ещё больше улучшить отношения."
 czke.317.t:0 "Переговоры о лицензионном производстве"
 czke.317.d:0 "Правительство Чехословакии предлагает соглашение о лицензионном производстве. Мы получим права на выпуск высококачественных горных орудий C-5 и зенитных орудий R-5 фирмы «Шкода», а чехословаки заинтересованы в наших бомбардировщиках СБ-2.\n\nСледует ли заключить соглашение, товарищ [SOV.GetLeader]?"
 czke.317.a:0 "Согласиться."
 czke.317.b:0 "Нет."
 czke.318.t:0 "[SOV.getLeader] согласился на лицензионную сделку"
 czke.318.d:0 "Чехословакия и СССР подписали взаимное соглашение о лицензионном производстве военной техники. «Шкода» получила права на выпуск бомбардировщиков СБ-2 в обмен на лицензии и образцы горных орудий C-5 и зенитных орудий R-3 (vz. 37).\n\nСБ-2 будут выпускаться под чехословацким обозначением B.71, а производство разделят между компаниями «Летов», «Аэро» и «Авиа»."
 czke.318.a:0 "Превосходно."
 czke.319.t:0 "[SOV.getAdjective]ая сторона отказалась от лицензионной сделки"
 czke.319.d:0 "К сожалению, правительство государства [SOV.getnameDef] не заинтересовалось нашим предложением о лицензионном производстве."
 czke.319.a:0 "Это несчастье."
 CZKE_acquire_access_for_soviets:0 "Договориться о военном доступе для [SOV.getAdjective]их войск"
 CZKE_acquire_access_for_soviets_desc:0 "Главной слабостью союза было отсутствие общей границы между СССР и Чехословакией. Варшава решительно отказывала в доступе, как и румынское правительство. Но что было бы, если бы Праге удалось убедить соседей пропустить Красную армию?"
 CZKE_acquire_access_for_soviets_tooltip_reward:0 "\nПереговоры о §Yвоенном доступе§! для §YСоветского Союза§! через §YПольшу§! (шанс 30%) или §YРумынию§! (шанс 50%).\n\nПри успехе §YСоветский Союз§! §Yгарантирует независимость§! §YЧехословакии§! ценой усиления советского влияния в Восточной Европе."
 CZKE_soviet_military:0 "Советское военное влияние"
 CZKE_soviet_military_desc:0 "Нам есть чему поучиться у [SOV.getAdjective]их товарищей!"
 czke.320.t:0 "Чехословакия просит защиты"
 czke.320.d:0 "Из-за обострения германо-чехословацкого кризиса правительство Чехословакии стремится укрепить военные связи с государством [SOV.getnameDef]. Если мы гарантируем поддержку, они попытаются получить право прохода через соседние страны.\n\nЭто даёт уникальную возможность распространить революцию в сердце Европы."
 czke.320.a:0 "Мы защитим Чехословакию."
 czke.320.b:0 "Чехи предоставлены сами себе."
 czke.321.t:0 "Советы поддержат нас"
 czke.321.d:0 "Представители государства [SOV.getnameDef] подтвердили поддержку. Теперь необходимо добиться военного доступа через Польшу или Румынию, иначе обещанная помощь бесполезна."
 czke.321.a:0 "Попытаться договориться о военном доступе."
 czke.322.t:0 "Советы не заинтересованы"
 czke.322.d:0 "Советы отказали нам. Похоже, более тесный чешско-[SOV.getAdjective]ий союз невозможен при нынешней политической обстановке."
 czke.322.a:0 "Это крайне прискорбно."
 czke.323.t:0 "Военный доступ для Советского Союза"
 czke.323.d:0 "Из-за обострения германо-чехословацкого кризиса Чехословакия укрепляет связи с Советским Союзом.\n\nЕё правительство просит разрешить советским войскам пройти через нашу территорию в случае войны."
 czke.323.a:0 "Согласны. Германию необходимо сдержать."
 czke.323.b:0 "Чехи сошли с ума? Мы не позволим большевикам пройти по нашей земле."
 czke.324.t:0 "Военный доступ для Советского Союза"
 czke.324.d:0 "Из-за обострения германо-чехословацкого кризиса Чехословакия укрепляет связи с Советским Союзом.\n\nЕё правительство просит разрешить советским войскам пройти через нашу территорию в случае войны."
 czke.324.a:0 "Согласны. Германию необходимо сдержать."
 czke.324.b:0 "Ни один советский солдат не ступит на румынскую землю."
 czke.325.t:0 "Военный доступ для Советского Союза обеспечен"
 czke.325.d:0 "Похоже, чешским дипломатам удалось убедить одного из соседей. С большой неохотой он согласился предоставить Советскому Союзу военный доступ для помощи Чехословакии против Германии."
 czke.325.a:0 "Мы вместе выступим против фашистов."
 czke.326.t:0 "Польша отказывается"
 czke.326.d:0 "Польское правительство официально отказалось разрешить советским войскам проход через Польшу."
 czke.326.a:0 "Понятно."
 czke.327.t:0 "Союз с Советами"
 czke.327.d:0 "Советы также подтвердили готовность помочь нам в случае войны."
 czke.327.a:0 "Будем надеяться, что они сдержат слово."
 czke.328.t:0 "Понятно."
 czke.328.d:0 "Румынское правительство официально отказалось разрешить советским войскам пройти через Польшу."
 czke.328.a:0 "Мы остались одни."
 czke.328.b:0 "Как они вообще посмели просить о таком?"
 CZKE_revive_little_entente:0 "Возродить Малую Антанту"
 CZKE_revive_little_entente_desc:0 "Малая Антанта была союзом Чехословакии, Румынии и Югославии, созданным в 1920–1921 годах для защиты от венгерского ревизионизма и реставрации Габсбургов. Франция поддерживала союз отдельными договорами с каждым участником. С 1936 года объединение начало распадаться и окончательно исчезло в 1938 году."
 CZKE_revive_little_entente_tooltip_reward:0 "\nСоздаёт новый альянс: §YМалая Антанта§!"
 CZKE_little_entente_alliance:0 "Союз Малой Антанты"
 CZKE_little_entente_alliance_negative:0 "Союз Малой Антанты"
 little_entente:0 "Малая Антанта"
 czke.329.t:0 "История союза Малой Антанты"
 czke.329.d:0 "Малая Антанта была соглашением о взаимной обороне между Чехословакией, Югославией и Румынией в межвоенный период. Она основывалась на договорах 1920–1921 годов и была направлена против германского и венгерского господства в Дунайском бассейне, а также на защиту территориальной целостности и независимости участников.\n\nПосле прихода Гитлера к власти в 1933 году страны создали Постоянный секретариат и Постоянный совет министров иностранных дел. Однако в 1930-е годы они всё чаще проводили самостоятельную политику, особенно после ремилитаризации Рейнской области и ослабления французской поддержки.\n\nВ апреле 1937 года Югославия и Румыния отказались гарантировать полную военную помощь Чехословакии в случае агрессии. Окончательно союз рухнул после аннексии Судет Германией в сентябре 1938 года."
 czke.329.a:0 "Попытаться восстановить Малую Антанту."
 czke.330.t:0 "[Root.GetLeader] пытается реформировать Малую Антанту"
 czke.330.a:0 "Мы не можем допустить, чтобы это повторилось!"
 czke.330.d:0 "Стремясь создать единый фронт против общих врагов, государство [From.GetName] обратилось к участникам Малой Антанты с предложением расширить цели союза и объединиться перед лицом общих угроз.\n\nЧехословацкое руководство установило дипломатические связи с другими государствами, которые также могут чувствовать угрозу, и призывает к единству ради сохранения равновесия в Европе и предотвращения будущего конфликта. Лишь время покажет, удастся ли им добиться успеха."
 czke.330.b:0 "Да здравствует Антанта!"
 czke.330.c:0 "Это может осложнить наши планы в Европе."
 czke.330.e:0 "Европа должна объединиться против фашистских агрессоров!"
 czke.330.f:0 "Признак растущей напряжённости в Европе."
 CZKE_invite_romania:0 "Пригласить Румынию"
 CZKE_invite_romania_desc:0 "Мы должны укрепить наш союз с Румынией."
 CZKE_invite_romania_tooltip_reward:0 "\n§YРумыния§! вступает в §YМалую Антанту§! (шанс 90%)."
 CZKE_invite_yugoslavia:0 "Пригласить Югославию"
 CZKE_invite_yugoslavia_desc:0 "Мы должны укрепить наш союз с Югославией."
 CZKE_invite_yugoslavia_tooltip_reward:0 "\n§YЮгославия§! вступает в §YМалую Антанту§! (шанс 90%)."
 czke.331.t:0 "Восстановление Малой Антанты"
 czke.331.d:0 "Чтобы восстановить Малую Антанту, Чехословакия просит нас подтвердить союз и совместно сдерживать возможное возрождение агрессивного экспансионизма старых Центральных держав или Советского Союза."
 czke.331.a:0 "С радостью. Малую Антанту необходимо восстановить."
 czke.331.b:0 "[Root.GetNameDefCap] Идёт своим путём."
 czke.332.t:0 "Государство [From.GetNameDefCap] вступает в Малую Антанту"
 czke.332.d:0 "Наш план предотвратить распад Малой Антанты продвигается вперёд. [From.GetLeader] поддержал наши усилия и принял предложение восстановить союз."
 czke.332.a:0 "Мы на шаг ближе к восстановлению Малой Антанты."
 czke.333.t:0 "[From.GetNameDefCap] Отказ от чехословацкого предложения"
 czke.333.d:0 "Несмотря на все усилия по восстановлению Малой Антанты, наша последняя попытка привлечь одну из стран встретила скептицизм. [From.GetLeader] отказался вступать в союз, возможно сомневаясь в наших мотивах или опасаясь стать целью из-за слишком тесного сближения."
 czke.333.a:0 "Они могут стать мишенью для всех, кого знают."
 CZKE_hungary_intervention:0 "Интервенция в Венгрию"
 CZKE_hungary_intervention_desc:0 "Отношения Чехословакии с Венгрией всегда были сложными. После провозглашения независимости в 1918 году напряжённость на словацкой границе привела к вооружённому конфликту. С тех пор Венгрия постоянно оставалась занозой для Чехословакии."
 CZKE_austria_intervention:0 "Интервенция в Австрию"
 CZKE_austria_intervention_desc:0 "Чехословацкое руководство прекрасно понимало рост поддержки фашизма в Австрии, а страхи перед австро-германским союзом, как показали последующие годы, вовсе не были беспочвенными."
 CZKE_claims_bohemian_crown:0 "Претензии на бывшие земли Богемской короны"
 CZKE_claims_bohemian_crown_desc:0 "Славянские лужичане всегда стремились войти в состав Чехословакии. Следует оказать международное давление на Германию из-за части земель Богемской короны."
 CZKE_claims_bohemian_crown_tooltip_reward:0 "\nВыдвигает Германии ультиматум (§Yпретензии и цель войны для ограниченного конфликта§!) по поводу части бывших земель Богемской короны (§YНижняя Силезия§!)."
 czke.350.t:0 "Претензии на Лужицу"
 czke.350.d:0 "Во время Великой войны, особенно в её последний год, ряд чешских политических и культурных деятелей обсуждал восстановление чешского государства в исторических границах земель Богемской короны.\n\nОдновременно велись переговоры о границах нового государства. Окончательное решение принималось на Парижской мирной конференции в январе 1919 года. Делегацию возглавляли премьер-министр Карел Крамарж и министр иностранных дел Эдвард Бенеш, пытавшиеся убедить союзников восстановить исторические границы.\n\nПереговоры по Карпатской Руси и Верхней Венгрии оказались успешными, но от претензий на Кладско, Лужицу и коридор к Югославии пришлось отказаться.\n\nВ Лужице существовало заметное национальное движение, требовавшее автономии в Германии или присоединения к Чехословакии. Однако для Праги вопрос не был жизненно важным, и без официальной поддержки неофициальная лужицкая делегация не смогла добиться рассмотрения своих требований. Тем не менее отношения между чехами и лужичанами оставались добрыми.\n\nИсторически Лужица вошла в состав Пруссии после Венского конгресса 1815 года. Несмотря на германизацию, славянский язык лужичан, также известных как сорбы или венды, частично сохранился. В XIX веке в Праге даже была основана Лужицкая семинария.\n\nПосле Второй мировой войны жители Лужицы вновь пытались присоединиться к Чехословакии, но союзники их не поддержали."
 czke.350.a:0 "Мы должны защитить лужицких друзей от германского угнетения."
 CZKE_czechoslovak_government_reform:0 "Реформировать чехословацкое правительство"
 CZKE_czechoslovak_government_reform_desc:0 "6 ноября 1935 года премьер-министр Ян Малипетр был избран новым председателем Палаты депутатов после смерти Богумирa Брадача. Поскольку должности премьер-министра и председателя палаты были несовместимы, новым главой правительства назначили Милана Годжу."
 CZKE_czechoslovak_government_reform_tooltip_reward:0 "\n§YПолитическая власть§!."
 czke.400.t:0 "Результаты выборов 1935 года"
 czke.400.d:0 "19 мая 1935 года в Первой Чехословацкой Республике состоялись четвертые парламентские выборы для обеих палат парламента — для Палаты депутатов и Сената Национального собрания Чехословакии.\n\nПо результатам переписи населения 1930 года Чехословацкая республика того времени насчитывала 14 479 565 жителей, с ярким национальным составом государства:\n\n- чехи и словаки - 66,9% (9 688 770)\n- немцы 22,3% (3 231 688)\n- Венгры 4,8% (691 923)\nРусины 3,8% (549 169)\n- Поляки, 0,6% (81 737).\n\nКоличество действительных голосов, поданных на выборах в Палату депутатов, составило 8 231 412, что составляет почти 92% явки избирателей.\n\nРезультаты парламентских выборов 1935 года вызвали немалое удивление. Оппозиция и Судетская немецкая партия (Sudetendeutsche Partei); СДП во главе с Конрадом Генлейном стала победителем парламентских выборов на национальном уровне, как на выборах в Палату депутатов (15,2%), так и на выборах в Сенат (15%). Более двух третей голосов судетских немцев было за SdP.\n\nСильнейшая правительственная партия — аграрная (Республиканская партия крестьян и фермеров) — получила 14,3% голосов, социал-демократы — 12,6%. Тем не менее, благодаря электоральной арифметике правительственная аграрная партия наконец получила больше мандатов, 45, в то время как СДП получила на один мандат меньше.\n\nВ результате выборов существующая правящая коалиция (во главе с Яном Малыпетром) потеряла большинство (имела 149 из 300 представителей) и подала в отставку. В июле было сформировано новое широкое коалиционное правительство (без СДП). Однако в ноябре 1935 года Милан Ходжа сменил Яна Малипетра на посту премьер-министра и в последующие месяцы внес некоторые изменения в свой кабинет."
 czke.400.a:0 "Реформировать правительство"
 CZKE_extend_military_service:0 "Продлить военную службу"
 CZKE_extend_military_service_desc:0 "Обязательная военная служба в Чехословакии первоначально длилась 14 месяцев, затем была увеличена до 18, а в критические довоенные годы — до 24 месяцев.\n\nДаже после основной подготовки каждый мужчина должен был участвовать в военных сборах общей продолжительностью 14 недель."
 CZKE_extend_military_service_tooltip_reward:0 "\nИзменение §Yзакона о призыве§! ИЛИ §Yнациональный дух§!, связанный с §Yлюдскими ресурсами§!."
 czke.401.t:0 "Военная служба в Чехословакии"
 czke.401.d:0 "Когда Чехословакия появилась в 1918 году, продолжительность военной службы составляла 14 месяцев. С 1924 года этот срок увеличился до 18 месяцев, а в 1933 году на основе международной обстановки был принят двухлетний проект.\n\nОбязательная военная служба была обязательной для всех граждан Чехословакии, включая этнических немцев и другие меньшинства. Таким образом, планы призыва на военную службу и мобилизации должны быть соответствующим образом скорректированы, чтобы избежать возможного дезертирства в случае конфликта с Германией.\n\nПосле окончания военной службы призывники были переведены в действующие резервы, разделённые на I. и II. резервы.\n\nЯ. Запас состоял из здоровых и здоровых призывников до 40 лет. Они должны были быть мобилизованы в случае войны и также использовались для усиления армии по мере необходимости.\n\nВторой. Резерв был для тех призывников, которые не имели права на I. Резерв. Тех, кому было за 40 лет, и тех, кто не был достаточно приспособлен для активной службы. Они должны были выполнять вспомогательные роли или служить в заднем эшелоне. Срочники, составленные по стандартной годовой квоте или те, которые нанесли бы материальный ущерб, были частью так называемых резервов замещения, но технически включены во II. резервы.\n\nЧлены I. Запасы были обязаны выполнить несколько военных учений: два, которые длились четыре недели, и три, которые продолжались три недели. Члены запасных частей должны были пройти дополнительно четыре недели обучения.\n\nМинистерство национальной обороны имело дополнительные полномочия для вызова I. Запасы замены для дополнительных специальных, до четырех недель длительных упражнений. Это обычно использовалось, когда новое оборудование было принято на вооружение армии, но также могло быть использовано в исключительных обстоятельствах."
 czke.401.a:0 "Продлить военную службу"
 czke.401.b:0 "Подготовить план призыва и мобилизации меньшинств"
