 CZKE_state_defense_law_idea_desc:0 "Закон №131/1936 действует."
 CZKE_democratic_reforms:0 "Подготовить автономию Судет"
 CZKE_democratic_reforms_desc:0 "Пришло время окончательно решить проблему меньшинств и подготовить определённую автономию районов с преимущественно немецким населением, прежде чем межэтнический конфликт поглотит республику."
