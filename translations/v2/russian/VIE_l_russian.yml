l_russian:
 Instalaza_SA:0 "Инсталаса СА"
 Instalaza_SA_desc:0 "Испанская компания, производящая пехотное снаряжение, противотанковое оружие и боеприпасы."
 SPR_Research:0 "Военные НИОКР"
 SPR_Research_desc:0 "Наш недавно расширенный военно-промышленный комплекс должен позволить исследовать новые технологии для нашей страны."
 SPR_Research_short_desc:0 "Военные НИОКР"
 SPR_Col_Forts:0 "Добавляет укрепления 4-го уровня в Испанской Африке"
 SPR_Colonial_Forts:0 "Укрепить Испанскую Африку"
 SPR_Colonial_Forts_desc:0 "Чтобы защитить жизненно важную колонию Испанская Африка от иностранных захватчиков, мы должны укрепить регион."
 SPR_Colonial_Forts_short_desc:0 "Укрепить Испанскую Африку"
 SPR_Mil:0 "Разработать новые доктрины"
 SPR_Mil_desc:0 "Если мы хотим стать грозной силой, необходимо развивать сухопутные доктрины, чтобы не отстать от остальных."
 SPR_Mil_short_desc:0 "Разработать доктрины"
 SPR_Equipment:0 "Развитие оснащения"
 SPR_Equipment_desc:0 "Улучшим наше пехотное снаряжение и артиллерийские орудия."
 SPR_Equipment_short_desc:0 "Развитие оснащения"
 SPR_Expand:0 "Расширить офицерский корпус"
 SPR_Expand_desc:0 "Нам следует расширить офицерский корпус. Если привлечь в Генеральный штаб новое поколение молодых офицеров, возможно, мы сможем разработать новые армейские доктрины."
 SPR_Expand_short_desc:0 "Расширить офицерский корпус"
 SPR_Mot:0 "Моторизировать армию"
 SPR_Mot_desc:0 "Моторизованная армия будет гораздо эффективнее окружать противника и захватывать территорию. Возможно, нам следует создать такие силы."
 SPR_Mot_short_desc:0 "Моторизация"
 SPR_Mech:0 "Развитие механизации"
 SPR_Mech_desc:0 "Мы можем ещё сильнее повысить мобильность армии, предоставив войскам дополнительную защиту в виде механизированных машин пехоты."
 SPR_Mech_short_desc:0 "Развитие механизации"
 SPR_Fortify_Islands:0 "Укрепить острова и Гвинею"
 SPR_Fortify_Islands_desc:0 "Мы должны укрепить наши острова и колониальное владение в Гвинее, чтобы высвободить войска для других направлений."
 SPR_Fortify_Islands_short_desc:0 "Укрепить острова"
 SPR_Island_Forts:0 "Добавляет береговые укрепления на Канарских и Балеарских островах, а также обычные укрепления в Экваториальной Гвинее."
 SPR_Fra_Forts:0 "Добавляет укрепления 5-го уровня на северной границе с Францией."
 SPR_Fortify_Fra:0 "Укрепить французскую границу"
 SPR_Fortify_Fra_desc:0 "Чтобы обеспечить нашу безопасность, следует построить линию укреплений вдоль французской границы."
 SPR_Fortify_Fra_short_desc:0 "Укрепить французскую границу"
 SPR_Doctrine:0 "Разработать новые доктрины"
 SPR_Doctrine_desc:0 "Мы должны следить, чтобы наши военные доктрины оставались современными. Возможно, некоторые из них удастся разработать раньше противников."
 SPR_Doctrine_short_desc:0 "Разработать доктрины"
 SPR_Doc_Bonus_2:0 "Исследования артиллерии"
 SPR_Doc_Bonus_2_desc:0 "Опыт строительства укреплений показывает, что для прорыва вражеских оборонительных линий нам потребуются более крупные артиллерийские системы и мощные противотанковые орудия."
 SPR_Doc_Bonus_2_short_desc:0 "Исследования артиллерии"
 SPR_Domestic_Tanks:0 "Отечественные проекты танков"
 SPR_Domestic_Tanks_desc:0 "Мы способны разработать собственную бронетехнику. Пусть она и не будет столь передовой, как у великих военных держав, зато она будет испанской!"
 SPR_Domestic_Tanks_short_desc:0 "Отечественные танки"
 SPR_Foreign_Tanks:0 "Иностранные проекты танков"
 SPR_Foreign_Tanks_desc:0 "Мы поддерживаем дружеские отношения со страной, производящей мощные танки. Если убедить одного из наших друзей помочь с разработкой новой машины, проект окажется намного современнее того, что наши конструкторы смогли бы создать в одиночку."
 SPR_Foreign_Tanks_short_desc:0 "Иностранные танки"
 SPR_Doc_Wep:0 "Стандартизация вооружения и доктрин"
 SPR_Doc_Wep_desc:0 "Следует стандартизировать вооружение и доктрины, чтобы планирование и подготовка учитывали наши самые современные образцы, а также будущее оружие. Это упростит разработку новых тактик и доктрин."
 SPR_Doc_Wep_short_desc:0 "Стандартизация"
 SPR_Naval:0 "Развитие флота"
 SPR_Naval_desc:0 "Мы должны расширить флот, чтобы сохранить способность защищаться от любых региональных противников. Построим больше верфей."
 SPR_Naval_2:0 "Расширить СЭКН"
 SPR_Naval_2_desc:0 "«Сосьедад Эспаньола де Конструксьон Наваль», Испанское общество военно-морского строительства, было главной движущей силой исследований и производства флота Испании. Расширим его мощности и увеличим финансирование, чтобы оно помогло нам разработать новые военно-морские доктрины."
 SPR_Naval_2_short_desc:0 "СЭКН"
 SPR_Subs:0 "Расширить подводный флот"
 SPR_Subs_desc:0 "Подводные лодки доказали исключительную полезность. Расширим наш подводный флот новыми современными лодками."
 SPR_Subs_short_desc:0 "Подводный флот"
 SPR_Screens:0 "Проекты кораблей охранения"
 SPR_Screens_desc:0 "Модернизируем корабли охранения, например тяжёлые крейсеры и эсминцы. Их задача — защищать более крупные корабли, такие как линкоры типа «Эспанья»."
 SPR_Screens_short_desc:0 "Корабли охранения"
 SPR_Capitals:0 "Развитие линкоров"
 SPR_Capitals_desc:0 "Сейчас линкоры господствуют на морях. Разработаем новый проект для нашей страны и запустим его в производство!"
 SPR_Capitals_short_desc:0 "Ставка на крупные корабли"
 SPR_Carriers:0 "Построить авианосец"
 SPR_Carriers_desc:0 "Морская авиация доказала превосходство над любым орудием линкора. Мы должны осознать это и воспользоваться преимуществом, построив авианосец для Испании."
 SPR_Carriers_short_desc:0 "Построить авианосец"
 SPR_Nav_Air:0 "Развитие морской авиации"
 SPR_Nav_Air_desc:0 "Нашим авианосцам нужна поддержка палубной авиации. Исследуем новые модели!"
 SPR_Nav_Air_short_desc:0 "Морская авиация"
 SPR_Air_Officers:0 "Расширить авиационные академии"
 SPR_Air_Officers_desc:0 "Если мы хотим расширить военно-воздушные силы, необходимо обучать больше способных молодых людей лётному делу и командованию. Следует построить новые авиационные академии!"
 SPR_Air_Officers_short_desc:0 "Расширить академии"
 SPR_Air_Factories:0 "Государственные авиазаводы"
 SPR_Air_Factories_desc:0 "Нам следует расширить производственные мощности, построив новые заводы, предназначенные для выпуска самолётов."
 SPR_Air_Factories_short_desc:0 "Авиазаводы"
 SPR_Fighters:0 "Разработать новые истребители"
 SPR_Fighters_desc:0 "Независимо от того, какой тип бомбардировщика мы выберем, необходимо разрабатывать и производить истребители. CASA, наш авиаконструктор, должна создать новый истребитель, способный не уступать иностранным образцам."
 SPR_Fighters_short_desc:0 "Разработать истребители"
 SPR_CAS:0 "Развитие штурмовой авиации"
 SPR_CAS_desc:0 "Наши генералы убеждены, что непосредственная поддержка на поле боя поможет победить в любой войне. Враг может производить сколько угодно техники, но если уничтожить её в бою, она окажется бесполезной!"
 SPR_CAS_short_desc:0 "Штурмовики"
 SPR_Tac_Bomber:0 "Развитие тактических бомбардировщиков"
 SPR_Tac_Bomber_desc:0 "Некоторые в наших ВВС считают, что будущее за тактическими бомбардировщиками. Они способны поддерживать войска на поле боя и бомбить вражеские заводы, пусть и менее эффективно, чем стратегические бомбардировщики."
 SPR_Tac_Bomber_short_desc:0 "Тактические бомбардировщики"
 SPR_Strat:0 "Развитие стратегических бомбардировщиков"
 SPR_Strat_desc:0 "Некоторые убеждены, что стратегическое разрушение вражеских заводов в конечном счёте истощит противника и позволит нам победить. Мы можем разработать подходящие самолёты, хотя часть чиновников сомневается, что мы способны выпускать их в достаточном количестве."
 SPR_Strat_short_desc:0 "Стратегические бомбардировщики"
 SPR_Air_Doctrine:0 "Развить доктрины штурмовой авиации"
 SPR_Air_Doctrine_desc:0 "Теперь, когда мы определились, на каком типе бомбардировочной авиации сосредоточиться, следует соответствующим образом адаптировать доктрины."
 SPR_Air_Doctrine_short_desc:0 "Воздушные доктрины"
 SPR_Air_Doctrine_2:0 "Развить доктрины тактических бомбардировщиков"
 SPR_Air_Doctrine_2_desc:0 "Теперь, когда мы определились, на каком типе бомбардировочной авиации сосредоточиться, следует соответствующим образом адаптировать доктрины."
 SPR_Air_Doctrine_2_short_desc:0 "Воздушные доктрины"
 SPR_Air_Doctrine_3:0 "Развить доктрины стратегических бомбардировщиков"
 SPR_Air_Doctrine_3_desc:0 "Теперь, когда мы определились, на каком типе бомбардировочной авиации сосредоточиться, следует соответствующим образом адаптировать доктрины."
 SPR_Air_Doctrine_3_short_desc:0 "Воздушные доктрины"
 SPR_Exercises:0 "Провести крупномасштабные военные игры"
 SPR_Exercises_desc:0 "Пока мы находимся в мире, следует проводить крупные военные игры, чтобы подготовить войска к войне."
 SPR_Exercises_short_desc:0 "Военные игры"
 SPR_Fascism:0 "Фашистская пропаганда"
 SPR_Fascism_desc:0 "Мы должны добиться, чтобы народ сплотился вокруг нашего дела — католицизма, национализма и консерватизма!"
 SPR_Fascism_short_desc:0 "Фашизм"
 SPR_Fascist_Rec:0 "Кампания по набору"
 SPR_Fascist_Rec_desc:0 "С помощью пропаганды мы сможем увеличить число мужчин, желающих служить в армии."
 SPR_Fascist_Rec_short_desc:0 "Набор"
 SPR_Communism_Idea:0 "Коммунистическая пропаганда"
 SPR_Communism_Idea_desc:0 "Коммунистическая пропаганда, призванная повысить готовность населения распространять революцию за рубежом, уже принесла пользу нашей стране."
 SPR_Recruitment_Fascist:0 "Фашистская кампания по набору"
 SPR_Recruitment_Fascist_desc:0 "Националистическая пропаганда, обращённая к чувству гордости и патриотизму нашего народа, вызвала всплеск числа добровольцев в армии."
 SPR_Communism:0 "Коммунистическая идеологическая обработка"
 SPR_Communism_desc:0 "Убедимся, что наш народ готов жертвовать собой ради коммунистического дела. Мы развернём коммунистическую пропаганду среди взрослых и в школах."
 SPR_Communism_short_desc:0 "Коммунистическая обработка"
 SPR_Spain_First:0 "Создать собственную фракцию"
 SPR_Spain_First_desc:0 "Испания прежде всего! Мы отказываемся подчиняться другим странам и быть ниже них. Мы создадим фракцию, в которой единственным лидером будем мы!"
 SPR_Spain_First_short_desc:0 "Испания прежде всего"
 SPR_Join_Germany:0 "Присоединиться к Оси"
 SPR_Join_Germany_desc:0 "Следует подружиться с нашими идеологическими товарищами в Германии и вступить в их фракцию. Это обеспечит нам их защиту, хотя, скорее всего, нас будут призывать и в их войны."
 SPR_Join_Germany_short_desc:0 "Ось"
 SPR_Befriend_Por:0 "Подружиться с Португалией"
 SPR_Befriend_Por_desc:0 "Нам следует расширить новую фракцию. Португалия станет перспективным участником. Хотя её режим Эштаду Нову не является строго фашистским, это всё же консервативная правая автократия, которую мы можем принять."
 SPR_Befriend_Por_short_desc:0 "Португалия"
 SPR_Por_Faction:0 "Пригласить Португалию во фракцию"
 SPR_Por_Faction_desc:0 "Теперь, когда там установлено коммунистическое правительство, следует пригласить их в нашу фракцию."
 SPR_Por_Faction_short_desc:0 "Пригласить Португалию"
 SPR_influence_drift_communism:0 "Испанская коммунистическая пропаганда"
 SPR_influence_drift_communism_desc:0 "Испанские коммунисты влияют на нашу страну!"
 SPR_Com_Take_Por:0 "Распространить революцию на Португалию"
 SPR_Com_Take_Por_desc:0 "Мы должны распространить коммунистическую революцию на Португалию. Похоже, они не слишком восприимчивы к этой идее, поэтому, возможно, вторжение станет правильным решением."
 SPR_Com_Take_Por_short_desc:0 "Распространить революцию"
 SPR_Por_Com:0 "Влиять на политику Португалии"
 SPR_Por_Com_desc:0 "Следует сделать всё возможное для поддержки коммунизма в Португалии."
 SPR_Por_Com_short_desc:0 "Политика"
 SPR_influence_drift_democratic:0 "Поддержка демократии растёт"
 SPR_influence_drift_democratic_short:0 "Наш народ становится более восприимчивым к идее демократии."
 SPR_Democracy:0 "Поддержать демократию в нашей стране"
 SPR_Democracy_desc:0 "Позволить народу решать на мирных и честных выборах — единственный цивилизованный способ правления. Превратимся в демократическое и цивилизованное общество!"
 SPR_Democracy_short_desc:0 "Поддержать демократию"
 SPR_Italy:0 "Вернуть старые арагонские земли"
 SPR_Italy_desc:0 "Италия придерживается враждебной идеологии, поэтому мы можем напасть и вернуть территории, когда-то по праву принадлежавшие нам."
 SPR_Italy_short_desc:0 "Вернуть земли"
 SPR_Gib_Gib:0 "Вернуть Гибралтар"
 SPR_Gib_Gib_desc:0 "Гибралтар был украден у нас трусливыми британцами. Теперь, когда они заняты мировой обстановкой, мы должны его вернуть!"
 SPR_Gib_Gib_short_desc:0 "Вернуть Гибралтар"
 SPR_Ven:0 "Вернуть колонию Венесуэлу"
 SPR_Ven_desc:0 "Провинция Венесуэла, как мы её когда-то называли, лежит в Южной Америке словно заноза в боку демократического мира. Если мы нападём, союзники, вероятно, не станут возражать, даже если мы реинтегрируем её в славную испанскую нацию."
 SPR_Ven_short_desc:0 "Вернуть Венесуэлу"
 SPR_Col:0 "Повторно колонизировать Колумбию"
 SPR_Col_desc:0 "Мы должны вернуть Испании статус колониальной державы. Франция, Великобритания и Нидерланды всё ещё имеют колонии в Южной Америке, тогда как наши давно независимы. Пора начать их возвращение!"
 SPR_Col_short_desc:0 "Вернуть Колумбию"
 SPR_Research_2:0 "Расширить университеты"
 SPR_Research_2_desc:0 "Чтобы не отставать, следует расширить университеты, особенно их исследовательские подразделения."
 SPR_Research_2_short_desc:0 "Расширить университеты"
 SPR_DOM:0 "Генерал-капитанство Санто-Доминго"
 SPR_DOM_desc:0 "Генерал-капитанство Санто-Доминго включало территории нынешних Гаити и Доминиканской Республики. Последняя сейчас управляется враждебной идеологией, поэтому мы могли бы убедить союзников позволить нам напасть и восстановить порядок."
 SPR_DOM_short_desc:0 "Капитанство Санто-Доминго"
 SPR_eq_bonus:0 "Бонус к пехотному снаряжению и артиллерии"
 SPR_Civ_Econ:0 "Развивать частный сектор"
 SPR_Civ_Econ_desc:0 "Следует стимулировать экономический рост, снижая корпоративные налоги и ослабляя регулирование. После гражданской войны страна находится в плачевном состоянии, поэтому это крайне необходимо. Однако во время войны такую политику проводить нельзя."
 SPR_Civ_Econ_short_desc:0 "Развивать частный сектор"
 SPR_Civ_Factory_Idea:0 "Рост частного сектора"
 SPR_Civ_Factory_Idea_desc:0 "Благодаря успешной экономической политике наш частный сектор растёт."
