l_russian:
 SEA_japan.1.t:0 "Инцидент 26 февраля"
 SEA_japan.1.desc:0 "Ссылаясь на угрозы душе имперской нации, молодые офицеры, верные фракции Кодоха в IJA, организовали государственный переворот с целью очистить правительство и военное руководство от тех, кто противостоит их духу милитаризма и прямому имперскому контролю над государством. Они уже окружили резиденции высокопоставленных чиновников и захватили правительственный центр Токио. Император, однако, молчит, несмотря на надежды повстанцев, что он выступит в поддержку их. Как будет происходить этот инцидент?"
 SEA_japan.1.a:0 "Положите конец этому фарсу!"
 JAP_kodoha_coup_will_fail_historically_tt:0 "Мы объявим военное положение и используем полк Йокосука Имперского японского флота для подавления восстания. Сообщалось о минимальных жертвах, хотя некоторые из целей Кодохи были подтверждены мертвыми:"
 SEA_japan.1.b:0 "Пришло время вернуться к традициям!"
 JAP_kodoha_coup_will_succeed_tt:0 "Кодоха захватит военное министерство, императорский отель, национальную диету и императорский дворец. Многие из ключевых целей Кодохи были подтверждены мертвыми:"
 SEA_japan.1.c:0 "Военные должны царствовать!"
 JAP_kodoha_coup_will_fail_non_historically_tt:0 "Мы объявим военное положение и попытаемся подавить восстание с помощью подразделений экстренной службы столичного полицейского управления Токио, ограничив военное участие в отправлении правосудия в отношении Кодохи. Немногие жертвы были зарегистрированы, хотя некоторые из целей Кодохи были подтверждены мертвыми:"
 SEA_japan.1.d:0 "Военные должны царствовать!"
 SEA_japan.1.e:0 "Люди должны понимать, что их подрывают со всех сторон!"
 SEA_japan_foreign_policy.1.t:0 "[FROM.GetNameDefCap] Требует нашего представления"
 SEA_japan_foreign_policy.1.desc:0 "Руководство [FROM.GetNameDef]Квантунская армия потребовала нашего подчинения. Однако они пришли с предложением. Если мы присоединимся к ним, они помогут нам вернуть монгольские земли, старые для нас, и позволят нам установить новую Монгольскую империю под их контролем. Что скажешь?"
 SEA_japan_foreign_policy.1.a:0 "Это возможность для нас"
 SEA_japan_foreign_policy.1.b:0 "Мы должны сохранить независимость любой ценой!"
 MEN_li_shouxin_available_tt:0 "§YЛи Шукс§! становится доступным как а §YГенерал§!"
 SEA_japan_foreign_policy.2.t:0 "[FROM.GetNameDefCap] Предоставлено нашему правилу"
 SEA_japan_foreign_policy.2.desc:0 "[FROM.GetLeader] Он ушел в отставку в пользу нашего кандидата. [FROM.GetAdjective] Трон, принц Де. Регион сейчас подпал под нашу оккупацию, и в ближайшее время начнется реорганизация их правительства."
 SEA_japan_foreign_policy.2.a:0 "Император будет рад услышать это."
 SEA_japan_foreign_policy.3.t:0 "[FROM.GetNameDefCap] Отказывается подчиняться императору"
 SEA_japan_foreign_policy.3.desc:0 "[FROM.GetLeader] Он отказался подчиниться нашим требованиям, несмотря на то, что видел, что мы сделали с Нима-одзором, когда он выступил против нашего божественного правителя. Возможно, пришло время преподать им урок смирения."
 SEA_japan_foreign_policy.3.a:0 "Они неуважительно относятся к императору, это не выдерживает."
 SEA_japan_foreign_policy.3.b:0 "Они нам в любом случае не нужны."
 SEA_japan_foreign_policy.4.t:0 "[FROM.GetNameDefCap] Требуем, чтобы мы присоединились к их альянсу"
 SEA_japan_foreign_policy.4.desc:0 "А. [FROM.GetAdjective] Делегация обратилась к нам с просьбой о сотрудничестве в их стремлении к доминированию на азиатском континенте, требуя, чтобы мы присоединились к ним в их нынешних и будущих войнах, когда они будут прилагать эти усилия. Не похоже, что они примут «нет» в качестве ответа, но, конечно, это не может быть к нашей выгоде."
 SEA_japan_foreign_policy.4.a:0 "Вместе мы будем сильнее"
 SEA_japan_foreign_policy.4.b:0 "Это противоречит нашим принципам нейтралитета."
 SEA_japan_foreign_policy.5.t:0 "[FROM.GetNameDefCap] Принимаем наше предложение"
 SEA_japan_foreign_policy.5.desc:0 "[FROM.GetLeader] Увидел причину и решил, что [FROM.GetNameDef] Мы официально подпишем необходимые документы, чтобы облегчить их вступление в нашу фракцию. Сегодня день, который нужно праздновать!"
 SEA_japan_foreign_policy.5.a:0 "Как и должны"
 SEA_japan_foreign_policy.6.t:0 "[FROM.GetNameDefCap] Отказывается присоединяться к нам"
 SEA_japan_foreign_policy.6.desc:0 "[FROM.GetLeader] Он отказался видеть причину и заявил, что [FROM.GetNameDef] Мы не будем вступать в альянс с нами. Что им неизвестно, так это то, что мы не намерены позволять им быть нейтральными в предстоящем мировом конфликте."
 SEA_japan_foreign_policy.6.a:0 "Приготовьте войска к нападению!"
 SEA_japan_foreign_policy.7.t:0 "[FROM.GetNameDefCap] Готовимся к вторжению"
 SEA_japan_foreign_policy.7.desc:0 "Не принимая \"нет\" за ответ, [FROM.GetAdjective] Войска были замечены готовящимися к быстрому вторжению в нашу страну, вероятно, намеревающимися быстро перебраться и подчинить нас, приведя нас в свою сферу. Это, вероятно, последний шанс избежать конфликта, но вопрос остается. Мы возьмем его?"
 SEA_japan_foreign_policy.7.a:0 "По второй мысли, мы должны просто представить сейчас"
 SEA_japan_foreign_policy.7.b:0 "Тогда пусть они придут!"
 SEA_japan_foreign_policy.8.t:0 "[FROM.GetNameDefCap] Подчиняется нашим требованиям"
 SEA_japan_foreign_policy.8.desc:0 "Наконец, после долгих обсуждений делегация [FROM.GetNameDef] Мы приняли решение подписать пересмотренные документы, которые мы им представили, избегая военного вмешательства, но отказываясь от их независимости в этом процессе. Теперь мы полностью готовы нанести удар по югу!"
 SEA_japan_foreign_policy.8.a:0 "И порядок восстанавливается"
 SEA_japan_foreign_policy.9.t:0 "[FROM.GetLeader] Отказы в представлении"
 SEA_japan_foreign_policy.9.desc:0 "Последний шанс, который мы любезно предоставили [FROM.GetLeader] Нам было отказано, и наши войска теперь готовы быстро оккупировать свои крупные города. Пришло время показать им, что [ROOT.GetAdjective] Нация сделана из!"
 SEA_japan_foreign_policy.9.a:0 "Теннохейка Банзай!"
 SEA_japan_foreign_policy.10.t:0 "[FROM.GetNameDefCap] Требование оккупации [671.GetName]"
 SEA_japan_foreign_policy.10.desc:0 "Делегация, присланная нам из [FROM.GetNameDef] Мы выдвинули ультиматум. Они дали нам неделю на то, чтобы освободить наши войска из Тонкинской области и позволить их войскам занять позиции и создать военные базы в регионе. Они ссылаются на это, чтобы убедиться, что китайцы не угрожают. [VIN.GetAdjective] Суверенитет, но мы знаем, что это такое на самом деле."
 SEA_japan_foreign_policy.10.a:0 "Это не стоит бороться за"
 SEA_japan_foreign_policy.10.b:0 "Мы не отдадим их им!"
 SEA_japan_foreign_policy.11.t:0 "[FROM.GetNameDefCap] Переводы [671.GetName]"
 SEA_japan_foreign_policy.11.desc:0 "Лидерство в [FROM.GetNameDef] Они увидели причину и начали освобождать свои войска от Тонкина, чтобы позволить нам создать там зону безопасности, чтобы гарантировать, что китайские войска не войдут. [VIN.GetAdjective] территории. День выигран!"
 SEA_japan_foreign_policy.11.a:0 "Великий день для [ROOT.GetAdjective] Люди"
 SEA_japan_foreign_policy.12.t:0 "[From.GetNameDefCap] Отказ от наших требований"
 SEA_japan_foreign_policy.12.desc:0 "Лидерство в [FROM.GetNameDef] Они отказались видеть причину, заявив, что не откажутся даже от дюйма земли в Индокитае. Это сильно мешает нашей дальнейшей экспансии на юг... Должны ли мы принять это, или, возможно, пришло время нанести удар по Западу?"
 SEA_japan_foreign_policy.12.a:0 "Они пожалеют о своем решении!"
 SEA_japan_foreign_policy.12.b:0 "Мы должны отпустить это"
 SEA_japan_foreign_policy.13.t:0 "[FROM.GetNameDefCap] занимать [721.GetName]!"
 SEA_japan_foreign_policy.13.desc:0 "\nНа этой неделе силы, принадлежащие [JAP.GetNameDef] Мы вторглись и оккупировали нашу территорию. [721.GetName]Заявляя, что они были на миссии, чтобы защитить регион от возможной оккупации их врагами. Очевидно, что это акт войны, но мы могли бы просто игнорировать его, поскольку они не являются врагами, с которыми мы можем позволить себе сражаться в данный момент."
 SEA_japan_foreign_policy.13.a:0 "Не стоит бороться за"
 SEA_japan_foreign_policy.13.b:0 "Кем они себя считают?"
 SEA_japan_foreign_policy.14.t:0 "[FROM.GetNameDefCap] Реорганизовать наше правительство"
 SEA_japan_foreign_policy.14.desc:0 "The [FROM.GetAdjective] Администраторы, которые помогали в создании нашего государства, решили, что сейчас самое подходящее время для реорганизации структуры нашего правительства и изменения нашей правовой системы. В долгосрочной перспективе это только укрепит нас, поэтому у нас нет причин отказываться от них."
 SEA_japan_foreign_policy.14.a:0 "Очень хорошо"
 SEA_japan_foreign_policy.15.t:0 "[FROM.GetNameDefCap] Требование оккупации [729.GetName]"
 SEA_japan_foreign_policy.15.desc:0 "Ссылаясь на то, что город может быть хорошим местом для их врагов, чтобы нанести им удар, если представится такая возможность. [FROM.GetAdjective] Войска, управляющие [592.GetName] Россия поставила нам ультиматум. Либо мы позволим им войти, по сути, давая им полномочия делать то, что они хотят с городом, либо мы столкнемся со всей силой этого мира. [FROM.GetAdjective] Армия. Что нам делать?"
 SEA_japan_foreign_policy.15.a:0 "Это не стоит бороться за"
 SEA_japan_foreign_policy.15.b:0 "Мы не отдадим их им!"
 SEA_japan_foreign_policy.16.t:0 "[FROM.GetNameDefCap] Переводы [729.GetName]"
 SEA_japan_foreign_policy.16.desc:0 "Региональные администраторы [729.GetName] Мы решили впустить наши войска, понимая, что сопротивление в конечном итоге окажется тщетным. Наш народ радуется тому, что из Восточной Азии вытеснена еще одна западная держава!"
 SEA_japan_foreign_policy.16.a:0 "Великий день для [ROOT.GetAdjective] Люди"
 SEA_japan_foreign_policy.17.t:0 "[From.GetNameDefCap] Отказ от наших требований"
 SEA_japan_foreign_policy.17.desc:0 "Региональные администраторы [729.GetName] Они забыли свое место и решили отказаться от требований, ранее выданных им нашими губернаторами. [592.GetName]. Настало время спуститься вниз [FROM.GetAdjective] Империя раз и навсегда!"
 SEA_japan_foreign_policy.17.a:0 "Они пожалеют о своем решении!"
 SEA_japan_foreign_policy.17.b:0 "Мы должны отпустить это"
 SEA_japan_foreign_policy.18.t:0 "[FROM.GetNameDefCap] Приглашаем к сотрудничеству"
 SEA_japan_foreign_policy.18.desc:0 "Недавно в нашу столицу прибыла делегация издалека, которая ищет аудиенцию с его высочеством. Они утверждают, что от [FROM.GetNameDef]Мы стремимся к союзу между нашими народами. Мы согласны?"
 SEA_japan_foreign_policy.18.a:0 "Вместе мы будем сильнее"
 SEA_japan_foreign_policy.18.b:0 "Это противоречит нашим принципам нейтралитета."
 SEA_japan_foreign_policy.19.t:0 "[FROM.GetNameDefCap] Принимаем наше приглашение"
 SEA_japan_foreign_policy.19.desc:0 "[FROM.GetLeader] Он любезно принял наше предложение о формализовании альянса между нашими странами и уже начал инициативы по интеграции в нашу сферу. Сегодня день для празднования!"
 SEA_japan_foreign_policy.19.a:0 "Они знают, что для них лучше."
 SEA_japan_foreign_policy.20.t:0 "[FROM.GetNameDefCap] Отказывается присоединяться к нам"
 SEA_japan_foreign_policy.20.desc:0 "[FROM.GetLeader] Мы приняли грубое решение отвергнуть наше предложение о союзе между нашими странами, заявив, что это будет противоречить их принципу нейтралитета. Мы можем только представить себе масштабы коррупции, которая привела к этому ошибочному решению."
 SEA_japan_foreign_policy.20.a:0 "Это их потеря."
 SEA_japan_foreign_policy.21.t:0 "[FROM.GetNameDefCap] Реорганизовать наше правительство"
 SEA_japan_foreign_policy.21.desc:0 "Наш милостивый повелитель [FROM.GetNameDef] Мы решили, наконец, узаконить наши притязания на то, чтобы быть истинным монгольским государством, и предложили еще одну реорганизацию нашего правительства и учреждений, чтобы способствовать этому изменению политики. Сегодня великий день для [ROOT.GetAdjective] Люди!"
 SEA_japan_foreign_policy.21.a:0 "Если это то, что они хотят сделать"
 SEA_japan_foreign_policy.22.t:0 "Подозреваемый [FROM.GetAdjective] Агенты замечены"
 SEA_japan_foreign_policy.22.desc:0 "Агенты, подозреваемые в действиях по приказу [FROM.GetAdjective] Они были замечены в наших границах, по-видимому, пытаясь установить контакт с дворянами и соблазняя наших граждан большими обещаниями совместного процветания. Как нам справиться с ситуацией?"
 SEA_japan_foreign_policy.22.a:0 "Они не причинят нам никакого вреда, пусть они будут"
 SEA_japan_foreign_policy.22.b:0 "Мы должны укреплять нашу национальную безопасность!"
 SEA_japan_foreign_policy.23.t:0 "[FROM.GetNameDefCap] Влияя на наш народ"
 SEA_japan_foreign_policy.23.desc:0 "The [FROM.GetAdjective] Теперь агенты начали распространять паназиатскую пропаганду по всей Лхасе и начали контрабанду средств, чтобы повлиять на местных дворян. Похоже, что ситуация скоро может выйти из-под контроля..."
 SEA_japan_foreign_policy.23.a:0 "Сфера совместного процветания побуждает их к..."
 SEA_japan_foreign_policy.24.t:0 "[FROM.GetNameDefCap] Установление контакта с Thubten Kunphela"
 SEA_japan_foreign_policy.24.desc:0 "Наши офицеры сообщили, что [FROM.GetAdjective] Агенты, по-видимому, преуспели в установлении контакта с Тубтеном Кунфелой, дворянином, который обладает большой властью, будучи прозванным Сильным человеком Тибета в то время. Все может быть плохо для нас с этого момента..."
 SEA_japan_foreign_policy.24.a:0 "Они что-то планируют..."
 SEA_japan_foreign_policy.25.t:0 "[FROM.GetNameDefCap] Милитаризована Партия совершенствования Тибета"
 SEA_japan_foreign_policy.25.desc:0 "Партия улучшения Тибета, политическая партия, сформированная в изгнании в Британской Индии, которая поддерживает Тубтен Кунфелу, недавно получала пакеты оружия от неизвестных отправителей. Похоже, что они готовятся к государственному перевороту с позиции, недоступной для нас."
 SEA_japan_foreign_policy.25.a:0 "Это выходит из-под контроля!"
 SEA_japan_foreign_policy.26.t:0 "Сильнейший переворот"
 SEA_japan_foreign_policy.26.desc:0 "Наконец-то настал день. Сегодня утром Тубтен Кунфела вместе со своими вооруженными сторонниками напал на Лхасу, заявив, что наше правление коррумпировано и нелегитимно. [ROOT.GetNameDef] Лучше было бы, если бы он был частью [FROM.GetAdjective] Сфера. Уступим ли мы его требованиям или займем последнюю позицию?"
 SEA_japan_foreign_policy.26.a:0 "Возможно, он прав"
 SEA_japan_foreign_policy.26.b:0 "Сражайся с ними!"
 SEA_japan_foreign_policy.27.t:0 "[FROM.GetNameDefCap] Поддерживает панмонгольские претензии"
 SEA_japan_foreign_policy.27.desc:0 "Наконец-то настал день, когда мы сможем начать нашу кампанию и претендовать на царство Внешней Монголии, в настоящее время управляемое нелегитимным трусом. [MON.GetLeader]. Пришло время показать миру, что дух Чингисхана продолжает жить!"
 SEA_japan_foreign_policy.27.a:0 "Поистине великий день."
 SEA_japan_foreign_policy.28.t:0 "[FROM.GetNameDefCap] Руки над монгольскими государствами"
 SEA_japan_foreign_policy.28.desc:0 "Заняв по праву монгольские земли, наш повелитель [FROM.GetNameDef] Мы передали управление территориями, как и обещали. Мы очень благодарны за доверие, которое они оказывают нам!"
 SEA_japan_foreign_policy.28.a:0 "Великолепно"
 SEA_japan_foreign_policy.29.t:0 "Итоги Суйюанской кампании"
 SEA_japan_foreign_policy.29.desc:0 "Кампания в Суйюане подошла к концу, и были разработаны новые границы. Вероятно, это последний раз, когда наши подданные могут попытаться совершить подобное вторжение без участия центрального правительства Китая, поскольку они сейчас находятся в состоянии повышенной готовности относительно наших действий в регионе."
 SEA_japan_foreign_policy.29.a:0 "По крайней мере, теперь мы можем сосредоточиться на других областях."
 SEA_japan_foreign_policy.30.t:0 "Конец Суйюаньской кампании"
 SEA_japan_foreign_policy.30.desc:0 "Наконец, непрекращающееся нападение [JAP.GetNameDef] И их порочные подданные остановились, и их войска возвращаются на свои позиции. Неизвестно, будет ли то, что произошло сегодня, вспоминаться в истории, но, по крайней мере, правительство Нанкина теперь знает об этом. [JAP.GetAdjective] Амбиции в регионе."
 SEA_japan_foreign_policy.30.a:0 "Очередная угроза, с которой пришлось столкнуться"
 SEA_japan_foreign_policy.31.t:0 "Прояпонские войска атакуют наши позиции!"
 SEA_japan_foreign_policy.31.desc:0 "Силы, принадлежащие [MEN.GetNameDef] Великая Ханьская праведная армия напала на наши позиции в Суйюане и, похоже, намеревалась захватить внутренние монгольские аймаги, находящиеся в нашем распоряжении. Мы не можем их пропустить!"
 SEA_japan_foreign_policy.31.a:0 "Покажи им, с кем они имеют дело."
 SEA_japan_foreign_policy.32.t:0 "Япония стремится к сотрудничеству против коммунистической угрозы"
 SEA_japan_foreign_policy.32.desc:0 "[FROM.GetAdjective] Дипломаты сделали одну восьмерку в отношении своей внешней политики и теперь заявляют, что они хотят более тесно сотрудничать с нами при условии, что мы расправимся с коммунистическими и антияпонскими настроениями. Что-то подозрительно в сделке, но, возможно, стоит рискнуть?"
 SEA_japan_foreign_policy.32.a:0 "Мы можем обещать им, что"
 SEA_japan_foreign_policy.32.b:0 "Мы не будем заключать сделки с [JAP.GetAdjective]"
 CHI_accepted_JAP_demands_to_suppress_communism_and_more_flag:0 "Китай решил сотрудничать с нашими требованиями."
 SEA_japan_foreign_policy.33.t:0 "[FROM.GetLeader] Принять наши требования"
 SEA_japan_foreign_policy.33.desc:0 "[FROM.GetLeader]Лидер [FROM.GetNameDef] Он принял наше предложение и пообещал запретить протесты против нашего государства, одновременно готовясь к подавлению коммунистической деятельности в стране. Вскоре мы сможем формализовать союз с ними, чтобы мы могли уничтожить гноящуюся язву, которая угрожает привести всех азиатских людей к неизбежной и неизбежной гибели."
 SEA_japan_foreign_policy.33.a:0 "Первый шаг был сделан"
 SEA_japan_foreign_policy.34.t:0 "[FROM.GetLeader] Отклонить наши требования"
 SEA_japan_foreign_policy.34.desc:0 "[FROM.GetLeader]Лидер [FROM.GetNameDef] Он решил, что [FROM.GetAdjective] Люди не заслуживают ни четверти, отвергая наше любезное предложение и принимая за нас решение о том, что мы должны принести пользу людям. [FROM.GetAdjective] Нация до конца."
 SEA_japan_foreign_policy.34.a:0 "Они будут сожалеть о своем решении."
 SEA_japan_foreign_policy.35.t:0 "[FROM.GetNameDefCap] Распространяется Pro-[FROM.GetAdjective] Чувства"
 SEA_japan_foreign_policy.35.desc:0 "Различные радиостанции на западном побережье начали вещание [FROM.GetAdjective] Пропаганда, чтобы склонить наше население на свою сторону в конфликте за Азию. Мы должны закрыть это, пока это не нанесло слишком много вреда!"
 SEA_japan_foreign_policy.35.a:0 "Как они смеют!"
 SEA_japan_foreign_policy.36.t:0 "[FROM.GetNameDefCap] Распространяется Pro-[FROM.GetAdjective] Чувства"
 SEA_japan_foreign_policy.36.desc:0 "Радиостанции, принадлежащие [FROM.GetNameDef] Началась трансляция про-[FROM.GetAdjective] Пропаганда по всей стране. The [FROM.GetAdjective] Правительство также обратилось к нам с предложением инвестировать в нашу промышленность, в обмен на то, чтобы мы позволили радиостанциям оставаться открытыми."
 SEA_japan_foreign_policy.36.a:0 "Мы могли бы использовать их дружбу."
 SEA_japan_foreign_policy.36.b:0 "Нажми на эту чепуху!"
 SEA_japan_foreign_policy.37.t:0 "[FROM.GetNameDefCap] Позволяет нашему влиянию распространяться"
 SEA_japan_foreign_policy.37.desc:0 "[FROM.GetLeader] Мы решили принять наше предложение и позволим нашим радиостанциям оставаться открытыми для всех. [FROM.GetAdjective] дыхательные пути. Они также позволили нашим промышленникам открыть там магазин."
 SEA_japan_foreign_policy.37.a:0 "Как мы и предсказывали"
 SEA_japan_foreign_policy.38.t:0 "[FROM.GetNameDefCap] Блокирует наше влияние от распространения"
 SEA_japan_foreign_policy.38.desc:0 "[FROM.GetLeader] Мы решили заблокировать наше вмешательство в [FROM.GetNameDef]Решив, что их независимость как-то ценнее божественной паназиатской миссии."
 SEA_japan_foreign_policy.38.a:0 "Они знают, что ждет их в будущем."
 SEA_japan_foreign_policy.39.t:0 "[FROM.GetAdjective] Инвестиции в наши природные ресурсы"
 SEA_japan_foreign_policy.39.desc:0 "[FROM.GetLeader] из [FROM.GetNameDef] Мы приняли решение о разрешении инвестиций в наши природные ресурсы. [FROM.GetAdjective] Компании уже начали свою деятельность в пределах наших границ."
 SEA_japan_foreign_policy.39.a:0 "Ведь за этим скрывается некая тайна."
 SEA_japan_foreign_policy.40.t:0 "Вопрос о совместном процветании в Восточной Азии"
 SEA_japan_foreign_policy.40.desc:0 "С созданием Сферы Сопроцветания Большой Восточной Азии возник вопрос. Стремимся ли мы к обещанной цели азиатского процветания, или же мы принимаем то, что по праву принадлежит нам, и прямо утверждаем свой контроль над Азией?"
 SEA_japan_foreign_policy.40.a:0 "Высшая власть императора всегда должна быть на первом месте."
 SEA_japan_foreign_policy.40.b:0 "Мы должны стремиться к процветанию для всех азиатских государств!"
 SEA_japan_foreign_policy.41.t:0 "Сенбу"
 SEA_japan_foreign_policy.41.desc:0 "Сенбу были созданы для усиления нашего контроля над нашими континентальными владениями и начали предпринимать попытки усилить соблюдение на наших оккупированных территориях. Может быть, пора дать им больше административных обязанностей, а должным образом поставить их на службу?"
 SEA_japan_foreign_policy.41.a:0 "Мы должны немедленно применить эту стратегию!"
 SEA_japan_foreign_policy.41.b:0 "Было бы разумно подождать с нашим решением."
 apply_senbu_law_tt:0 "Применяет §YСенбу§! оккупационное право на всех применимых оккупированных территориях"
 SEA_japan_foreign_policy.42.t:0 "Китайско-японский альянс"
 SEA_japan_foreign_policy.42.desc:0 "[FROM.GetLeader] Мы провозгласили, что обе наши страны имеют общую судьбу и что только хождением бок о бок мы можем искоренить коммунистическую угрозу. С этой целью нам было выдвинуто предложение о союзе, хотя в его терминах, по-видимому, говорится, что он носит временный характер. Должны ли мы принять их предложение?"
 SEA_japan_foreign_policy.42.a:0 "Это в наших интересах."
 SEA_japan_foreign_policy.42.b:0 "Пахнет рыбой."
 SEA_japan_foreign_policy.43.t:0 "[FROM.GetLeader] Подписывает пакт"
 SEA_japan_foreign_policy.43.desc:0 "Наш народ радуется, как [FROM.GetAdjective] Нация присоединилась к нам в борьбе против окончательной угрозы стабильности в Азии, а именно коммунистов. Хотя этот пакт носит временный характер, он, несомненно, принесет нам большие преимущества."
 SEA_japan_foreign_policy.43.a:0 "Великолепно"
 SEA_japan_foreign_policy.44.t:0 "[FROM.GetLeader] Отказывается подписывать пакт"
 SEA_japan_foreign_policy.44.desc:0 "Глупо, [FROM.GetLeader] из [FROM.GetNameDef] Он решил действовать бесчестно, отказавшись от нашего великого предложения. Альянс был отозван, и Квантунская армия снова начала присматриваться к северному Китаю. Возможно, сейчас нам нужна корректировка нашей внешней политики."
 SEA_japan_foreign_policy.44.a:0 "С этим ничего нельзя поделать."
 SEA_japan_foreign_policy.45.t:0 "[FROM.GetNameDefCap] Требует экономической интеграции"
 SEA_japan_foreign_policy.45.desc:0 "[FROM.GetLeader] из [FROM.GetNameDef] Сегодня мы приехали в нашу столицу, чтобы сделать предложение. Они хотят, чтобы мы активизировали нашу единую экономическую деятельность и продолжили интеграцию с ними. Это помогло бы нашей экономике значительно, но что-то пахнет рыбой обо всем этом."
 SEA_japan_foreign_policy.45.a:0 "Это слишком хорошо, чтобы упустить"
 SEA_japan_foreign_policy.45.b:0 "Мы не откажемся от нашей экономической независимости!"
 SEA_japan_foreign_policy.46.t:0 "[FROM.GetNameDefCap] Принимаем наше предложение"
 SEA_japan_foreign_policy.46.desc:0 "[FROM.GetLeader] из [FROM.GetNameDef] Они положительно отреагировали на наше предложение, и их дипломаты прибыли в нашу страну, чтобы подписать необходимые документы для содействия их дальнейшей экономической интеграции."
 SEA_japan_foreign_policy.46.a:0 "Мы благодарны за их наивность."
 SEA_japan_foreign_policy.47.t:0 "[FROM.GetNameDefCap] Отклонить наше предложение"
 SEA_japan_foreign_policy.47.desc:0 "[FROM.GetLeader] из [FROM.GetNameDef] Мы ответили на наше приглашение к интеграции сильным неудовольствием и заявили, что любое более тесное экономическое партнерство между нашими странами навсегда исключено. Возможно, они могли видеть то, что мы приготовили для них..."
 SEA_japan_foreign_policy.47.a:0 "Ужасные новости..."
 SEA_japan_foreign_policy.48.t:0 "[FROM.GetNameDefCap] Развивая нашу промышленность"
 SEA_japan_foreign_policy.48.desc:0 "Промышленники, принадлежащие [FROM.GetNameDef] Мы начали развивать наши местные отрасли промышленности и создавать новые корпорации в пределах наших границ. Это должно приблизить нас к процветанию."
 SEA_japan_foreign_policy.48.a:0 "Процветание в пределах видимости!"
 SEA_japan_foreign_policy.49.t:0 "Провозглашение реорганизованного правительства"
 SEA_japan_foreign_policy.49.desc:0 "В прокламации, состоявшейся сегодня в Шанхае, [ROOT.GetLeader] Наряду с генералами и администраторами, посланными IJA, было объявлено о создании нового китайского правительства, лучшей альтернативы коррумпированной гоминьдановской вотчине. Да здравствует Китайская Республика!"
 SEA_japan_foreign_policy.49.a:0 "Процветание в пределах видимости!"
 SEA_japan_foreign_policy.50.t:0 "[FROM.GetNameDefCap] Требуется полная интеграция"
 SEA_japan_foreign_policy.50.desc:0 "Интеграции наших экономик было недостаточно, чтобы насытить экономику. [FROM.GetAdjective]s, как [FROM.GetLeader] из [FROM.GetNameDef] Сегодня мы требуем полной интеграции в их страну. Если мы не откажемся от них немедленно, это будет концом нашего статуса независимого государства. Как мы поступим?"
 SEA_japan_foreign_policy.50.a:0 "Мы должны будем принять ситуацию"
 SEA_japan_foreign_policy.50.b:0 "Победа или смерть!"
 SEA_japan_foreign_policy.51.t:0 "[FROM.GetNameDefCap] Полная интеграция Total Integration"
 SEA_japan_foreign_policy.51.desc:0 "Славная новость о том, что лидерство в [FROM.GetNameDef] Принятое решение интегрироваться в нашу нацию было встречено сегодня с большим аплодисментами в Национальном Сейме. То, что мы могли предложить, было достаточно очевидно для того, чтобы они сочли это предложение выгодным, несмотря на конец их суверенитета."
 SEA_japan_foreign_policy.51.a:0 "Отлично!"
 SEA_japan_foreign_policy.52.t:0 "[FROM.GetNameDefCap] Отказ от полной интеграции"
 SEA_japan_foreign_policy.52.desc:0 "Несмотря на очевидные преимущества и очевидно, что это лучшее для будущего Азии, [FROM.GetNameDef] Мы отклонили нашу просьбу о полной интеграции. Можно только догадываться об их причинах, но, похоже, они не имеют в виду интересы регионов."
 SEA_japan_foreign_policy.52.a:0 "Они представляют опасность для единства Азии."
 SEA_japan_foreign_policy.52.b:0 "Мы будем внимательно следить за ними."
 SEA_japan_foreign_policy.53.t:0 "Подрывники замечены в Хан-Хентий Уулын Аймаг"
 SEA_japan_foreign_policy.53.desc:0 "Агенты, подозреваемые в действиях по приказу [FROM.GetAdjective] Они были замечены в наших границах, по-видимому, пытаясь установить контакт с дворянами и соблазняя наших граждан большими обещаниями совместного процветания. Похоже, у них есть планы для народа Монголии."
 SEA_japan_foreign_policy.53.a:0 "Мы должны быть на страже!"
 SEA_japan_foreign_policy.54.t:0 "[FROM.GetAdjective] Оружие наводняет черные рынки"
 SEA_japan_foreign_policy.54.desc:0 "В последнее время, кажется, что оружие принадлежит [FROM.GetNameDef] Мы наводняем наши черные рынки, многие из которых достигают диссидентов и подрывников в наших границах. Похоже, что они либо просто пытаются дестабилизировать нас, либо, что еще хуже, свергнуть наше правительство."
 SEA_japan_foreign_policy.54.a:0 "Они вооружают политических диссидентов!"
 SEA_japan_foreign_policy.55.t:0 "Слухи о монгольском вторжении"
 SEA_japan_foreign_policy.55.desc:0 "Силы, принадлежащие к Внутренней монгольской армии, были замечены на нашей южной границе. Похоже, они готовятся к вторжению на нашу территорию, хотя их точные цели неясны."
 SEA_japan_foreign_policy.55.a:0 "Теперь либо умрешь, либо подготовишься к худшему!"
 SEA_japan_foreign_policy.56.t:0 "Маньчжурские партизаны замечены на Востоке"
 SEA_japan_foreign_policy.56.desc:0 "Маньчжурские партизаны были замечены за пределами Баян-Тюмень, а также в других частях наших восточных регионов. Сейчас они не хуже обычных бандитов, но со временем станут настоящей проблемой."
 SEA_japan_foreign_policy.56.a:0 "Теперь либо умрешь, либо подготовишься к худшему!"
 SEA_japan_foreign_policy.57.t:0 "[FROM.GetAdjective] Давление для подачи"
 SEA_japan_foreign_policy.57.desc:0 "Сегодня, ранее, [FROM.GetAdjective] Правительство выдвинуло нам ультиматум. Они требуют, чтобы мы подчинились им, если мы хотим, чтобы наш народ не был уничтожен. Однако мы знаем, что они приготовили для нас, и, возможно, в наших интересах противостоять им."
 SEA_japan_foreign_policy.57.a:0 "Мы не можем с ними бороться."
 SEA_japan_foreign_policy.57.b:0 "Мы должны защищать революцию!"
 MON_japan_starts_a_popular_civil_war_tt:0 "Япония развяжет народную гражданскую войну против нашего правительства и, скорее всего, вмешается на его стороне."
 SEA_japan_foreign_policy.58.t:0 "[FROM.GetNameDefCap] Руки над китайскими государствами"
 SEA_japan_foreign_policy.58.desc:0 "Наш [FROM.GetAdjective] Повелители передали нам управление многими бывшими государствами, контролируемыми Гоминьданом, и попросили нас начать подготовку к правильной интеграции этих земель в наше государство. Мы их не разочаруем!"
 SEA_japan_foreign_policy.58.a:0 "Великолепно"
 SEA_japan_foreign_policy.59.t:0 "Провозглашение государства Бирма"
 SEA_japan_foreign_policy.59.desc:0 "Сегодня утром, [ROOT.GetLeader] и различные [JAP.GetAdjective] Лидеры армий провели совместную прокламацию, объявив о создании нового [ROOT.GetAdjective] штат. Мы победим всех наших противников!"
 SEA_japan_foreign_policy.59.a:0 "Процветание в пределах видимости!"
 SEA_japan_foreign_policy.60.t:0 "Япония создает государство Бирма"
 SEA_japan_foreign_policy.60.desc:0 "[JAP.GetLeader] Он провозгласил создание нового [ROOT.GetAdjective] Государство, противостоящее нам и нашему нынешнему курсу. Похоже, они готовы бороться за свою независимость от нас и не собираются сдаваться без боя!"
 SEA_japan_foreign_policy.60.a:0 "Сражайся с ними, уничтожай предателей!"
 SEA_japan_foreign_policy.60.b:0 "Мы должны присоединиться к ним, процветание в поле зрения!"
 SEA_japan_foreign_policy.61.t:0 "Предательство Ван Цзинвэя"
 SEA_japan_foreign_policy.61.desc:0 "Предатель Ван Цзинвэй был замечен покидающим свою резиденцию на прошлой неделе и уехал с неизвестным местом. В ретроспективе это казалось неизбежным, из-за его неудовлетворенности [ROOT.GetLeader]Политика. Однако он не будет пропущен."
 SEA_japan_foreign_policy.61.a:0 "Это было предсказуемо"
 SEA_japan_foreign_policy.61.b:0 "Возможно, он прав..."
 SEA_japan_foreign_policy.62.t:0 "Wang Jingwei Дефект"
 SEA_japan_foreign_policy.62.desc:0 "Ван Цзинвэй, бывший высокопоставленный член Гоминьдана, прибыл в Шанхай и хочет работать с нами. Из-за его положения и популярности, может быть, было бы разумно дать ему видное положение в нашем правительстве, поскольку он может хорошо вести нас."
 SEA_japan_foreign_policy.62.a:0 "Он станет сильным лидером"
 SEA_japan_foreign_policy.62.b:0 "Sun Dianying стал более мощным"
 SEA_japan_foreign_policy.63.t:0 "Слияние с [RNG.GetNameDef]"
 SEA_japan_foreign_policy.63.desc:0 "[JAP.GetLeader] Он потребовал, чтобы мы объединили наше правительство с [RNG.GetNameDef]прекращение нашей независимости и предоставление нашему руководству высокопоставленных должностей в рамках [RNG.GetAdjective] правительство. Принимаем ли мы это предложение?"
 SEA_japan_foreign_policy.63.a:0 "[ROOT.GetLeader] Мы получим хорошую позицию, так что мы принимаем."
 SEA_japan_foreign_policy.63.b:0 "Это было бы концом нашей автономии, нет!"
 SEA_japan_foreign_policy.64.t:0 "[FROM.GetNameDefCap] Слияние с нами"
 SEA_japan_foreign_policy.64.desc:0 "[FROM.GetLeader] из [FROM.GetNameDef] Он принял то, [JAP.GetAdjective] предложение о слиянии с нашим правительством и [FROM.GetAdjective] Теперь все земли подпадают под нашу юрисдикцию. Это великий день для нас!"
 SEA_japan_foreign_policy.64.a:0 "Мы видим, почему они согласились"
 SEA_japan_foreign_policy.65.t:0 "[FROM.GetNameDefCap] Отвергает слияние"
 SEA_japan_foreign_policy.65.desc:0 "неглубокий [FROM.GetLeader] Он отказался видеть причину и отклонил наше предложение объединиться с [RNG.GetNameDef]. Может быть, лучше сделка, и, возможно, даже правильная доза запугивания в порядке."
 SEA_japan_foreign_policy.65.a:0 "Они примут в свое время..."
 SEA_japan_foreign_policy.66.t:0 "Провозглашение Временного правительства свободной Индии"
 SEA_japan_foreign_policy.66.desc:0 "Сегодня утром, [ROOT.GetLeader] и различные [JAP.GetAdjective] Лидеры армий провели совместную прокламацию, объявив о создании нового [ROOT.GetAdjective] штат. Мы победим всех наших противников!"
 SEA_japan_foreign_policy.66.a:0 "Процветание в пределах видимости!"
 SEA_japan_foreign_policy.67.t:0 "Япония учредила Временное правительство свободной Индии"
 SEA_japan_foreign_policy.67.desc:0 "[JAP.GetLeader] Он провозгласил создание нового [ROOT.GetAdjective] Государство, противостоящее нам и нашему нынешнему курсу. Похоже, они готовы бороться за свою независимость от нас и не собираются сдаваться без боя!"
 SEA_japan_foreign_policy.67.a:0 "Сражайся с ними, уничтожай предателей!"
 SEA_japan_foreign_policy.67.b:0 "Мы должны присоединиться к ним, процветание в поле зрения!"
 SEA_japan_foreign_policy.68.t:0 "Провозглашение Второй Филиппинской Республики"
 SEA_japan_foreign_policy.68.desc:0 "Сегодня утром, [ROOT.GetLeader] и различные [JAP.GetAdjective] Лидеры армий провели совместную прокламацию, объявив о создании нового [ROOT.GetAdjective] штат. Мы победим всех наших противников!"
 SEA_japan_foreign_policy.68.a:0 "Процветание в пределах видимости!"
 SEA_japan_foreign_policy.69.t:0 "Япония учредила вторую Филиппинскую республику"
 SEA_japan_foreign_policy.69.desc:0 "[JAP.GetLeader] Он провозгласил создание нового [ROOT.GetAdjective] Государство, противостоящее нам и нашему нынешнему курсу. Похоже, они готовы бороться за свою независимость от нас и не собираются сдаваться без боя!"
 SEA_japan_foreign_policy.69.a:0 "Сражайся с ними, уничтожай предателей!"
 SEA_japan_foreign_policy.69.b:0 "Мы должны присоединиться к ним, процветание в поле зрения!"
 SEA_japan_foreign_policy.70.t:0 "Япония требует от нас капитуляции"
 SEA_japan_foreign_policy.70.desc:0 "[FROM.GetAdjective] Дипломаты предъявили нам ультиматум, потребовав перекроить наши восточные границы и подписать с ними условный мир, по сути отказавшись от азиатских дел. Это даст нам возможность полностью сосредоточить наши усилия на возвращении наших европейских земель и, возможно, позволит нам вернуться, чтобы отвоевать восток после того, как все наши другие враги падут."
 SEA_japan_foreign_policy.70.a:0 "Мы никогда не сдадимся!"
 SEA_japan_foreign_policy.70.b:0 "Это будет один враг за нашими спинами."
 SEA_japan_foreign_policy.71.t:0 "[FROM.GetNameDefCap] Отказ сдаться"
 SEA_japan_foreign_policy.71.desc:0 "Дураки в Москве отказались сдаться нашим первоначальным требованиям. Это требует полного уничтожения их государства и даже дальнейших корректировок границ, чем изначально планировалось!"
 SEA_japan_foreign_policy.71.a:0 "Они упадут к нашему лезвию!"
 SEA_japan_foreign_policy.72.t:0 "[FROM.GetNameDefCap] Сдаться Востоку"
 SEA_japan_foreign_policy.72.desc:0 "Дипломаты выступают за [FROM.GetLeader] Они согласились на наши требования хвостами между ног и сдают нам свои сибирские владения. Сегодня великий день для Империи!"
 SEA_japan_foreign_policy.72.a:0 "Мы победили в этот день!"
 SEA_japan_foreign_policy.73.t:0 "[SOV.GetNameDefCap] Вывод из Сибири"
 SEA_japan_foreign_policy.73.desc:0 "Наши союзники вышли из Восточной Азии, капитулируя перед требованиями [JAP.GetNameDef]. Это ставит нас в очень уязвимое положение. Ищем ли мы новых союзников или продолжаем бороться с ними? [JAP.GetAdjective]?"
 SEA_japan_foreign_policy.73.a:0 "Они нас бросили..."
 SEA_japan_foreign_policy.73.b:0 "Тогда мы должны получить защиту Японии вместо них!"
 SEA_japan_foreign_policy.74.t:0 "[FROM.GetNameDefCap] Ищите нашу защиту"
 SEA_japan_foreign_policy.74.desc:0 "[FROM.GetLeader]Лидер [FROM.GetNameDef]Разочаровавшись в вопиющем предательстве со стороны прошлых союзников [FROM.GetName]Теперь он обратился к нам с просьбой занять новую позицию защитника своих земель и своего народа. Будет ли это обязанностью?"
 SEA_japan_foreign_policy.74.a:0 "Очень хорошо"
 SEA_japan_foreign_policy.74.b:0 "Они нам не нужны."
 SEA_japan_foreign_policy.75.t:0 "[FROM.GetAdjective] Прибывает оборудование"
 SEA_japan_foreign_policy.75.desc:0 "Похоже, что наши контакты в [FROM.GetNameDef] Наконец-то удалось заключить сделку с руководством страны, после того как фракция Кодоха, в которой большинство наших контактов существовали, недавно захватила правительство после успешного государственного переворота. Да здравствуют два императора!"
 SEA_japan_foreign_policy.75.a:0 "Мы очень благодарны!"
 SEA_japan_foreign_policy.76.t:0 "[FROM.GetNameDefCap] Требуется полная интеграция"
 SEA_japan_foreign_policy.76.desc:0 "[FROM.GetLeader] Он заявил, что из-за чрезвычайного положения, которое было объявлено после переворота в Кодохе, и возможности того, что несогласные офицеры прячутся в наших управляемых регионах, мы должны стать неотъемлемой частью нации. Это, в свою очередь, позволит обеспечить полное управление [FROM.GetAdjective] штат. Мы согласны?"
 SEA_japan_foreign_policy.76.a:0 "Мы должны будем принять ситуацию"
 SEA_japan_foreign_policy.76.b:0 "Они слишком высоко думают о себе."
 SEA_japan_foreign_policy.77.t:0 "[FROM.GetNameDefCap] Полная интеграция Total Integration"
 SEA_japan_foreign_policy.77.desc:0 "[FROM.GetLeader]Наш губернатор [FROM.GetNameDef] Сегодня мы полностью интегрировались в нашу страну. Это означает, что наше правительство может, наконец, полностью контролировать даже местные подразделения наших корейских регионов."
 SEA_japan_foreign_policy.77.a:0 "Отлично!"
 SEA_japan_foreign_policy.78.t:0 "[FROM.GetNameDefCap] Отказ от полной интеграции"
 SEA_japan_foreign_policy.78.desc:0 "Несмотря на очевидные преимущества и очевидно, что это лучшее для будущего нации, губернатор [FROM.GetNameDef], [FROM.GetLeader] Мы отклонили нашу просьбу о полной интеграции. Можно только догадываться о причинах, но, похоже, они не имеют в виду интересы наций."
 SEA_japan_foreign_policy.78.a:0 "Нам нужен кто-то более надежный во главе!"
 SEA_japan_foreign_policy.78.b:0 "Мы будем уважать их пожелания, пока..."
 SEA_japan_foreign_policy.79.t:0 "[FROM.GetNameDefCap] Стремление к более тесной интеграции"
 SEA_japan_foreign_policy.79.desc:0 "[FROM.GetLeader] Он обратился к нам с предложением, утверждая, что это лучшее для обоих наших народов. Наша страна должна стать неотъемлемой частью [FROM.GetNameDef] В свое время, положив конец нашей автономии и сделав нас основной частью их царства. Действительно ли это нам выгодно?"
 SEA_japan_foreign_policy.79.a:0 "Да, это пойдет нам на пользу"
 SEA_japan_foreign_policy.79.b:0 "Нет! Судьба Маньчжурии лежит в другом месте!"
 MAN_we_can_be_annexed_by_kodoha_tt:0 "Мы сможем быть §RПриложенный§! через [JAP.GetNameDef] В ближайшем будущем!"
 SEA_japan_foreign_policy.80.t:0 "Ассоциация Конкордия согласилась"
 SEA_japan_foreign_policy.80.desc:0 "Ассоциация Конкордия, правящая элита в [FROM.GetNameDef]Мы согласились с нашим предложением и готовы управлять регионом как неотъемлемой частью нашего царства в ближайшем будущем. Похоже, наши планы по объединению сработают гладко."
 SEA_japan_foreign_policy.80.a:0 "Очень хорошо"
 SEA_japan_foreign_policy.81.t:0 "Ассоциация «Конкордия» выступила против нас"
 SEA_japan_foreign_policy.81.desc:0 "Ассоциация Конкордия, правящая элита в [FROM.GetNameDef]Мы решили отказаться от нашего предложения, утверждая, что они не выигрывают от интеграции в нашу страну. Возможно, их убедили маньчжурские диссиденты или коммунисты, но, к сожалению, это не решение, которое мы можем легко отменить."
 SEA_japan_foreign_policy.81.a:0 "Мы разберемся с ними позже."
 SEA_japan_foreign_policy.81.b:0 "Если это их желание..."
 SEA_japan_foreign_policy.82.t:0 "[FROM.GetNameDefCap] Стремление к антисоветскому сотрудничеству"
 SEA_japan_foreign_policy.82.desc:0 "Наши исторические друзья в дальневосточной стране [FROM.GetName] Они обратились к нам с заманчивым предложением. В силу наших исторических связей и взаимного недоверия к [SOV.GetAdjective] Они предложили военный пакт, который гласит, что если один из нас вступит в войну с [SOV.GetNameDef]Так же будет и другой. Разве это не хорошая возможность упустить шанс?"
 SEA_japan_foreign_policy.82.a:0 "Все что угодно для нас [FROM.GetAdjective] Друзья!"
 SEA_japan_foreign_policy.82.b:0 "Это ставит нас в слишком большую опасность."
 SEA_japan_foreign_policy.83.t:0 "[FROM.GetLeader] Подписывает пакт"
 SEA_japan_foreign_policy.83.desc:0 "Наши замечательные друзья в [FROM.GetNameDef] Мы любезно приняли наше предложение о создании взаимного анти-[SOV.GetAdjective] Договор. Делегаты подписывают необходимые документы, чтобы воплотить соглашение в жизнь в этот самый момент, и готовятся к быстрому вторжению в страну. [SOV.GetNameDef] Если это станет необходимым, то также идет работа."
 SEA_japan_foreign_policy.83.a:0 "Превосходно!"
 SEA_japan_foreign_policy.84.t:0 "[FROM.GetLeader] Отклонить пакт"
 SEA_japan_foreign_policy.84.desc:0 "К сожалению, несмотря на наши исторические усилия по улучшению отношений между нашими двумя народами, [FROM.GetLeader] Мы отвергли наше предложение о взаимном анти-[SOV.GetAdjective] Договор. Он считается слишком опасным для [FROM.GetAdjective] Нация должна быть открыта договором [SOV.GetAdjective] Агенты."
 SEA_japan_foreign_policy.84.a:0 "Возможно, вторая изоляция пойдет нам на пользу..."
 SEA_japan_foreign_policy.85.t:0 "Призвать членов Пакта к войне"
 SEA_japan_foreign_policy.85.d:0 "Как мы и подозревали, подписывая антисоветский пакт, сейчас мы находимся в состоянии войны с Советским Союзом. Настало время для наших соучастников выполнить свое обещание и присоединиться к нам."
 SEA_japan_foreign_policy.85.a:0 "Наше предвидение окупается."
 SEA_japan_foreign_policy.86.t:0 "[From.GetNameDefCap] Призывает членов Пакта к войне"
 SEA_japan_foreign_policy.86.desc:0 "Польско-японский антисоветский пакт предусматривает, что все подписавшие его стороны должны присоединиться к любому оборонительному конфликту с Советским Союзом.[From.GetName] Советы напали на него и направили просьбу всем членам пакта немедленно прийти им на помощь. Пришло время показать [Root.GetAdjective] Посвящается защите мира от угрозы Советского Союза раз и навсегда."
 SEA_japan_foreign_policy.86.a:0 "[From.GetNameDefCap] Не стоит в одиночестве!"
 SEA_japan_foreign_policy.86.b:0 "Это не наша война."
 SEA_japan_foreign_policy.86.b_tt:0 "§YЭто будет рассматриваться как предательство всеми странами, которые соблюдают пакт.§!§R-50§!§Y мнение)§!"
 SEA_japan_foreign_policy.87.t:0 "The [FROM.GetAdjective] Аннексия"
 SEA_japan_foreign_policy.87.desc:0 "После того, как Ассоциация Конкордии недавно согласилась с требованиями Кодохаса, это был только вопрос времени, прежде чем это произойдет. Сегодня, а [FROM.GetAdjective] Делегация прибыла с документами, чтобы облегчить нашу полную интеграцию в их страну, что уже было подписано нашими собственными делегатами."
 SEA_japan_foreign_policy.87.a:0 "Это то, что мы подписали на"
 SEA_japan_foreign_policy.88.t:0 "Присоединение [FROM.GetNameDef]"
 SEA_japan_foreign_policy.88.desc:0 "[FROM.GetLeader], руководитель [FROM.GetNameDef] Сегодня мы полностью интегрировались в нашу страну. Это означает, что наше правительство может окончательно удержать полный контроль даже над местными подразделениями наших маньчжурских регионов."
 SEA_japan_foreign_policy.88.a:0 "Великолепно"
 SEA_japan_foreign_policy.89.t:0 "The [FROM.GetAdjective]s Предлагать промышленность для ресурсов"
 SEA_japan_foreign_policy.89.desc:0 "Мы получили предложение от [FROM.GetNameDef]. Они заинтересованы в долгосрочной торговле ресурсами в обмен на часть своих промышленных мощностей. В настоящее время они рассматривают ряд ресурсов в [FROM.FROM.GetName]."
 SEA_japan_foreign_policy.89.a:0 "Почему бы и нет?"
 SEA_japan_foreign_policy.89.b:0 "Сейчас не лучшее время."
 SEA_japan_foreign_policy.90.t:0 "[FROM.GetAdjective] Соглашение о промышленной торговле"
 SEA_japan_foreign_policy.90.desc:0 "Мы получили сообщение от [FROM.GetAdjective]Мы обращаемся к нашей компании с просьбой о торговле в обмен на некоторые из ее ресурсов. Похоже, что мы согласны с преимуществами этой сделки, и они с радостью согласились с условиями. В ближайшее время мы получим ресурсы."
 SEA_japan_foreign_policy.90.a:0 "Великолепный"
 SEA_japan_foreign_policy.91.t:0 "[FROM.GetAdjective] Отклонить сделку по промышленной торговле"
 SEA_japan_foreign_policy.91.desc:0 "Несмотря на то, что мы в основном нейтрально относимся к предложенной нами сделке, [FROM.GetAdjective]В конечном итоге они решили отказаться от нашего предложения о торговле с ними в обмен на ресурсы. Они утверждают, что сейчас не самое подходящее время, и это звучит так, будто мы можем достичь соглашения в будущем, как только укрепим наши отношения."
 SEA_japan_foreign_policy.91.a:0 "Если поначалу у вас не получается..."
 SEA_japan_foreign_policy.92.t:0 "The [FROM.GetAdjective] Желание более тесных связей"
 SEA_japan_foreign_policy.92.desc:0 "Дипломаты, принадлежащие [FROM.GetNameDef] Они обратились к нам по поводу укрепления наших связей, что-то, что было урезано военными группировками внутри их страны, что сейчас уже решено. Они желают как торговых, так и исследовательских и оборонительных соглашений. Либо мы можем подписаться на одну из них, либо мы можем принять все это. Не похоже, что это хорошая идея, чтобы полностью пренебречь ими, после всех усилий, которые они приложили, чтобы добраться сюда."
 SEA_japan_foreign_policy.92.a:0 "Связи могут быть укреплены за счет торговли"
 SEA_japan_foreign_policy.92.b:0 "Мы не видим необходимости в договоренностях..."
 SEA_japan_foreign_policy.92.c:0 "Мы должны заключить с ними соответствующее оборонительное соглашение."
 SEA_japan_foreign_policy.92.d:0 "Мы должны подписать все предложенные соглашения!"
 SEA_japan_foreign_policy.93.t:0 "[FROM.GetLeader] Подписал соглашение о сотрудничестве"
 SEA_japan_foreign_policy.93.desc:0 "Милостивый лидер [FROM.GetNameDef], [FROM.GetLeader]Мы приняли одно из наших предложений, согласившись установить более тесные торговые и исследовательские связи с нашей страной. Это великий день для [ROOT.GetNameDef] и его дипломатические достижения!"
 SEA_japan_foreign_policy.93.a:0 "Превосходно!"
 SEA_japan_foreign_policy.94.t:0 "[FROM.GetLeader] Не подписывает никаких соглашений"
 SEA_japan_foreign_policy.94.desc:0 "Двое лидеров столкнулись с [FROM.GetNameDef], [FROM.GetLeader]Мы отвергли все наши предложения, отказавшись от идеи более тесных связей между нашими народами. Это темный день для [ROOT.GetNameDef] и его дипломатические достижения..."
 SEA_japan_foreign_policy.94.a:0 "Ужасный"
 SEA_japan_foreign_policy.95.t:0 "[FROM.GetLeader] Подписал оборонное соглашение"
 SEA_japan_foreign_policy.95.desc:0 "Милостивый лидер [FROM.GetNameDef], [FROM.GetLeader]Мы приняли одно из наших предложений, согласившись заключить оборонительный пакт с нашей страной, где мы обе обещаем прийти на помощь другим в случае нападения. Это великий день для [ROOT.GetNameDef] и его дипломатические достижения!"
 SEA_japan_foreign_policy.95.a:0 "Превосходно!"
 SEA_japan_foreign_policy.96.t:0 "[FROM.GetLeader] Подписан всеобъемлющий дипломатический договор"
 SEA_japan_foreign_policy.96.desc:0 "Милостивый лидер [FROM.GetNameDef], [FROM.GetLeader]Мы приняли все наши предложения, согласившись установить более тесные торговые и научно-исследовательские связи, а также заключить оборонительный пакт с нашей страной, где мы оба обещаем прийти к другим на помощь в случае нападения. Это великий день для [ROOT.GetNameDef] и его дипломатические достижения!"
 SEA_japan_foreign_policy.96.a:0 "Превосходно!"
 jap_usa_japan_research_name:0 "Американо-японское соглашение об исследованиях"
 jap_usa_japan_research_desc:0 "Соглашение об исследованиях между учеными США и Японии."
 SEA_japan_foreign_policy.97.t:0 "[FROM.GetNameDefCap] Запрос торговых соглашений"
 SEA_japan_foreign_policy.97.desc:0 "[FROM.GetLeader] из [FROM.GetNameDef] направил дипломатов в нашу столицу для обсуждения перспективы сложных торговых отношений с Россией. [FROM.GetAdjective] Нация. Это приблизит наши отношения, но позволит им получить доступ к нашим ресурсам по более низкой цене, что может нанести ущерб нашей экономике."
 SEA_japan_foreign_policy.97.a:0 "Мы не видим никаких проблем с этим"
 SEA_japan_foreign_policy.97.b:0 "Вы можете забрать свои документы обратно в Токио!"
 SEA_japan_foreign_policy.98.t:0 "[FROM.GetNameDefCap] Согласен с торговым предложением"
 SEA_japan_foreign_policy.98.desc:0 "[FROM.GetLeader] из [FROM.GetNameDef] Мы хорошо отреагировали на наше предложение о более дешевой торговле между нашими странами и подписали необходимые документы, чтобы облегчить это немедленное вступление в силу. Они разделяют наше видение светлого будущего для всей Азии!"
 SEA_japan_foreign_policy.98.a:0 "Великолепно"
 SEA_japan_foreign_policy.99.t:0 "[FROM.GetNameDefCap] Отклоняет торговое предложение"
 SEA_japan_foreign_policy.99.desc:0 "[FROM.GetLeader] из [FROM.GetNameDef] Мы жестко ответили на наш запрос о более дешевой торговле в рамках нашего альянса, угрожая установить тарифы, если мы попытаемся протолкнуть такой вопрос. Кажется, [FROM.GetNameDef] Это не будет частью светлого будущего, которое мы имеем в виду."
 SEA_japan_foreign_policy.99.a:0 "Как прискорбно!"
 SEA_japan_foreign_policy.100.t:0 "[FROM.GetNameDefCap] Приглашаем в валютный союз"
 SEA_japan_foreign_policy.100.desc:0 "[FROM.GetLeader] из [FROM.GetNameDef] Мы обратились к нам с предложением о вступлении с ними в валютный союз, который не сделает ничего, кроме как укрепит экономику обеих наших стран. Звучит как сделка, слишком хорошая, чтобы от нее отказаться?"
 SEA_japan_foreign_policy.100.a:0 "Будем рады принять"
 SEA_japan_foreign_policy.100.b:0 "Звучит подозрительно для меня..."
 SEA_japan_foreign_policy.101.t:0 "[FROM.GetNameDefCap] Присоединяйтесь к валютному союзу"
 SEA_japan_foreign_policy.101.desc:0 "[FROM.GetLeader] из [FROM.GetNameDef] Мы хорошо отреагировали на наше предложение о создании общей валюты между нашими странами и подписали необходимые документы для того, чтобы это немедленно вступило в силу. Они разделяют наше видение светлого будущего для всей Азии!"
 SEA_japan_foreign_policy.101.a:0 "Великолепно"
 SEA_japan_foreign_policy.102.t:0 "[FROM.GetNameDefCap] Отказ от валютного союза"
 SEA_japan_foreign_policy.102.desc:0 "[FROM.GetLeader] из [FROM.GetNameDef] Мы жестко ответили на нашу просьбу о принятии единой валюты в рамках нашего альянса, угрожая установить тарифы, если мы попытаемся протолкнуть такой вопрос. Кажется, [FROM.GetNameDef] Это не будет частью светлого будущего, которое мы имеем в виду."
 SEA_japan_foreign_policy.102.a:0 "Как прискорбно!"
 SEA_japan_foreign_policy.103.t:0 "[FROM.GetNameDefCap] Требует экономической интеграции"
 SEA_japan_foreign_policy.103.desc:0 "[FROM.GetLeader] из [FROM.GetNameDef] Сегодня мы приехали в нашу столицу, чтобы сделать предложение. Они хотят, чтобы мы активизировали деятельность валютного союза и продолжили нашу экономическую интеграцию с ними. Это помогло бы нашей экономике значительно, но что-то пахнет рыбой обо всем этом."
 SEA_japan_foreign_policy.103.a:0 "Это слишком хорошо, чтобы упустить"
 SEA_japan_foreign_policy.103.b:0 "Мы не откажемся от нашей экономической независимости!"
 SEA_japan_foreign_policy.104.t:0 "[FROM.GetNameDefCap] Принимаем наше предложение"
 SEA_japan_foreign_policy.104.desc:0 "[FROM.GetLeader] из [FROM.GetNameDef] Они положительно отреагировали на наше предложение, и их дипломаты прибыли в нашу страну, чтобы подписать необходимые документы для содействия их дальнейшей экономической интеграции."
 SEA_japan_foreign_policy.104.a:0 "Мы благодарны за их наивность."
 SEA_japan_foreign_policy.105.t:0 "[FROM.GetNameDefCap] Отклонить наше предложение"
 SEA_japan_foreign_policy.105.desc:0 "[FROM.GetLeader] из [FROM.GetNameDef] Мы ответили на наше приглашение к интеграции сильным неудовольствием и заявили, что любое более тесное экономическое партнерство между нашими странами навсегда исключено. Возможно, они могли видеть то, что мы приготовили для них..."
 SEA_japan_foreign_policy.105.a:0 "Ужасные новости..."
 SEA_japan_foreign_policy.106.t:0 "[FROM.GetNameDefCap] Интеграция нашей экономики"
 SEA_japan_foreign_policy.106.desc:0 "[FROM.GetLeader] из [FROM.GetNameDef] Он пошел на шаг дальше, чем первоначально было обещано, и манипулирует рынками, чтобы еще больше увеличить нашу зависимость от их экономики, чтобы гарантировать, что мы не можем сбиться с их пути. Если мы не откажемся от них немедленно, это практически положит конец нашему статусу независимого государства. Как мы поступим?"
 SEA_japan_foreign_policy.106.a:0 "Мы должны будем принять ситуацию"
 SEA_japan_foreign_policy.106.b:0 "Победа или смерть!"
 SEA_japan_foreign_policy.107.t:0 "[FROM.GetNameDefCap] Принимает дальнейшую интеграцию"
 SEA_japan_foreign_policy.107.desc:0 "Славная новость о том, что лидерство в [FROM.GetNameDef] Мы решили интегрироваться с нами и сегодня были встречены аплодисментами в диете. То, что мы могли предложить, было достаточно очевидно для того, чтобы они сочли это предложение выгодным, несмотря на незначительный удар по их суверенитету."
 SEA_japan_foreign_policy.107.a:0 "Отлично!"
 SEA_japan_foreign_policy.108.t:0 "[FROM.GetNameDefCap] Отказ от дальнейшей интеграции"
 SEA_japan_foreign_policy.108.desc:0 "Несмотря на очевидные преимущества и очевидно, что это лучшее для союза, [FROM.GetNameDef] Мы отвергли наше предложение о дальнейшей интеграции. Можно только догадываться об их причинах, но, похоже, они не имеют в виду интересы профсоюзов."
 SEA_japan_foreign_policy.108.a:0 "Это риск для единства организации!"
 SEA_japan_foreign_policy.108.b:0 "Мы будем внимательно следить за ними."
 SEA_japan_foreign_policy.109.t:0 "[FROM.GetNameDefCap] Требуется полная интеграция"
 SEA_japan_foreign_policy.109.desc:0 "Интеграции наших экономик, по-видимому, было недостаточно для того, чтобы насытить нашу экономику. [FROM.GetAdjective]s, как [FROM.GetLeader] из [FROM.GetNameDef] Сегодня мы пошли на шаг дальше, чем первоначально обещали, и теперь требуем полной интеграции в их страну. Если мы не откажемся от них немедленно, это будет концом нашего статуса независимого государства. Как мы поступим?"
 SEA_japan_foreign_policy.109.a:0 "Мы должны будем принять ситуацию"
 SEA_japan_foreign_policy.109.b:0 "Победа или смерть!"
 SEA_japan_foreign_policy.110.t:0 "[FROM.GetNameDefCap] Полная интеграция Total Integration"
 SEA_japan_foreign_policy.110.desc:0 "Славная новость о том, что лидерство в [FROM.GetNameDef] Позволить себе интегрироваться в нашу страну сегодня было встречено с большими аплодисментами в парламенте. То, что мы могли предложить, было достаточно очевидно для того, чтобы они сочли это предложение выгодным, несмотря на конец их суверенитета."
 SEA_japan_foreign_policy.110.a:0 "Отлично!"
 SEA_japan_foreign_policy.111.t:0 "[FROM.GetNameDefCap] Отказ от полной интеграции"
 SEA_japan_foreign_policy.111.desc:0 "Несмотря на очевидные преимущества и очевидно, что это лучшее для союза, [FROM.GetNameDef] Мы отвергли наше предложение о полной интеграции. Можно только догадываться об их причинах, но, похоже, профсоюзы не имеют в виду наилучших интересов."
 SEA_japan_foreign_policy.111.a:0 "Это риск для единства организации!"
 SEA_japan_foreign_policy.111.b:0 "Мы будем внимательно следить за ними."
 SEA_japan_foreign_policy.112.t:0 "[FROM.GetNameDefCap] Запросить контроль над нашими азиатскими колониями"
 SEA_japan_foreign_policy.112.desc:0 "Дипломаты, принадлежащие [FROM.GetNameDef] Они предложили соглашение, в котором им будет предоставлено господство над нашими подданными в Бирме и Малайзии в обмен на права на ресурсы в некоторых жизненно важных областях, утверждая, что это является частью их доктрины Pacific Guardian, утверждая, будто это позволит нам сосредоточиться на Европе и Африке, в то время как они защищают Азию от коммунизма. Что скажешь?"
 SEA_japan_foreign_policy.112.a:0 "Это позволяет нам сосредоточить наши усилия на других областях."
 SEA_japan_foreign_policy.112.b:0 "Компромисс с нашей империей? Никогда!"
 SEA_japan_foreign_policy.113.t:0 "[FROM.GetNameDefCap] Передача азиатских колоний"
 SEA_japan_foreign_policy.113.desc:0 "[FROM.GetLeader] из [FROM.GetNameDef] Мы любезно приняли наше предложение и подписали документы, чтобы облегчить передачу нам их колоний в Малайзии и Бирме в обмен на сохранение контроля над жизненно важными природными ресурсами в этом районе. Сегодня великий день для азиатского народа!"
 SEA_japan_foreign_policy.113.a:0 "Мы будем охранять Тихий океан."
 SEA_japan_foreign_policy.114.t:0 "Государство [FROM.GetNameDefCap] отклоняет нашу просьбу"
 SEA_japan_foreign_policy.114.desc:0 "[FROM.GetLeader] из [FROM.GetNameDef] Он сделал позорный показ и показал нам, насколько омрачен и развращен западный менталитет. Мы заключили с ними сделку, от которой они не могли отказаться, что сделало бы Азию лучше, но каким-то образом они нашли выход. Сегодня темный день для нашего альянса."
 SEA_japan_foreign_policy.114.a:0 "Высокомерные западные..."
 ENG_will_gain_resource_right_we_tt:0 "Мы получим права на ресурсы некоторых государств в переданных нам странах."
 SEA_japan_foreign_policy.115.t:0 "[From.GetNameDefCap] Хочет повеления над одной из наших колоний"
 SEA_japan_foreign_policy.115.desc:0 "Используя возможности, предоставленные нашей слабостью, [From.GetAdjective] Они предложили «помочь» нам в поддержании порядка в наших колониях. Они утверждают, что, поскольку мир пылает в других местах, у нас нет возможности сохранить свое влияние на эти регионы.\n\nОчевидно, что это уловка для борьбы за контроль над нашими колониями вдали от нас, но какой у нас выбор?"
 SEA_japan_foreign_policy.115.a:0 "Пришло время признать господство Японии в Азии."
 SEA_japan_foreign_policy.115.b:0 "Пусть попробуют забрать их силой!"
 SEA_japan_foreign_policy.116.t:0 "[From.GetNameDefCap] передаёт контроль над колониями"
 SEA_japan_foreign_policy.116.desc:0 "[From.GetNameDefCap] Они тщательно рассмотрели наше предложение «поддерживать порядок» в своих колониях и решили принять его. Они фактически передали нам полный контроль над своим субъектом."
 SEA_japan_foreign_policy.116.a:0 "Мудрое решение"
 SEA_japan_foreign_policy.117.t:0 "[From.GetNameDefCap] отказывается передать контроль над колониями"
 SEA_japan_foreign_policy.117.desc:0 "[From.GetNameDefCap] Они тщательно рассмотрели наше предложение «поддерживать порядок» в своих колониях и решили отклонить его. Похоже, что они не имеют в виду интересы азиатских народов."
 SEA_japan_foreign_policy.117.a:0 "Посмотрим, как это будет для них."
 SEA_japan_foreign_policy.117.b:0 "Тогда мы освободим их силой!"
 SEA_japan_foreign_policy.118.t:0 "[FROM.GetNameDefCap] Приглашаем к сотрудничеству"
 SEA_japan_foreign_policy.118.desc:0 "Недавно в нашу столицу прибыла делегация издалека, которая ищет аудиенцию у [ROOT.GetLeader]. Они утверждают, что от [FROM.GetNameDef]Мы стремимся к союзу между нашими народами. Мы согласны?"
 SEA_japan_foreign_policy.118.a:0 "Вместе мы будем сильнее"
 SEA_japan_foreign_policy.118.b:0 "Это противоречит нашим принципам нейтралитета."
 SEA_japan_foreign_policy.119.t:0 "[FROM.GetNameDefCap] Принимаем наше приглашение"
 SEA_japan_foreign_policy.119.desc:0 "[FROM.GetLeader] Он любезно принял наше предложение о формализовании альянса между нашими странами и уже начал инициативы по интеграции в нашу сферу. Сегодня день для празднования!"
 SEA_japan_foreign_policy.119.a:0 "Они разделяют наше видение будущего."
 SEA_japan_foreign_policy.120.t:0 "[FROM.GetNameDefCap] Отказывается присоединяться к нам"
 SEA_japan_foreign_policy.120.desc:0 "[FROM.GetLeader] Мы приняли грубое решение отвергнуть наше предложение о союзе между нашими странами, заявив, что это будет противоречить их принципу нейтралитета. Мы можем только представить себе масштабы коррупции, которая привела к этому ошибочному решению."
 SEA_japan_foreign_policy.120.a:0 "Это их потеря."
 SEA_japan_foreign_policy.121.t:0 "[FROM.GetNameDefCap] Перевести нас в [JAP.GetAdjective] Контроль"
 SEA_japan_foreign_policy.121.desc:0 "[FROM.GetLeader]Наш бывший повелитель подписал документы, облегчающие передачу контроля над нашей страной. [JAP.GetNameDef]. Похоже, что мы оказались под защитой другой крупной державы. Теперь у нас новый Повелитель, под чьи капризы мы будем подчинены."
 SEA_japan_foreign_policy.121.a:0 "Ох..."
 SEA_japan_foreign_policy.122.t:0 "Обмен [From.GetAdjective]ими генералами"
 SEA_japan_foreign_policy.122.desc:0 "The [From.GetAdjective] Они решили отозвать своих левых гражданских служащих и генералов и вместо этого отправили нас в неофициальное изгнание."
 SEA_japan_foreign_policy.122.a:0 "Казалось бы, что-то застряло в [From.GetNameDef]..."
 SEA_japan_foreign_policy.123.t:0 "Обмен [Root.GetAdjective]ими генералами завершён"
 SEA_japan_foreign_policy.123.desc:0 "Обмен наших правых генералов и чиновников на левых, ранее отправленных нами в неофициальную ссылку в государство [From.GetNameDef], завершён."
 SEA_japan_foreign_policy.123.a:0 "Это укрепит нашу власть над государством [Root.GetNameDef]."
 SEA_japan_foreign_policy.124.t:0 "[FROM.GetNameDefCap] Приглашаем на Пятый Международный"
 SEA_japan_foreign_policy.124.desc:0 "Недавно в нашу столицу прибыла делегация издалека, которая ищет аудиенцию у [ROOT.GetLeader]. Они утверждают, что от [FROM.GetNameDef]Мы стремимся к союзу между нашими народами. Мы согласны?"
 SEA_japan_foreign_policy.124.a:0 "Вместе мы будем сильнее"
 SEA_japan_foreign_policy.124.b:0 "Это противоречит нашим принципам нейтралитета."
 SEA_japan_foreign_policy.125.t:0 "[FROM.GetNameDefCap] Принимаем наше приглашение"
 SEA_japan_foreign_policy.125.desc:0 "[FROM.GetLeader] Он любезно принял наше предложение о формализовании альянса между нашими странами и уже начал инициативы по интеграции в нашу сферу. Сегодня день для празднования!"
 SEA_japan_foreign_policy.125.a:0 "Они разделяют наше видение будущего."
 SEA_japan_foreign_policy.126.t:0 "[FROM.GetNameDefCap] Отказывается присоединяться к нам"
 SEA_japan_foreign_policy.126.desc:0 "[FROM.GetLeader] Мы приняли грубое решение отвергнуть наше предложение о союзе между нашими странами, заявив, что это будет противоречить их принципу нейтралитета. Мы можем только представить себе масштабы коррупции, которая привела к этому ошибочному решению."
 SEA_japan_foreign_policy.126.a:0 "Это их потеря."
 SEA_japan_foreign_policy.127.t:0 "[FROM.GetNameDefCap] Присоединяйтесь к Пятому интернационалу"
 SEA_japan_foreign_policy.127.desc:0 "предательский [FROM.GetLeader] Мы выступаем за коммунистов в [JAP.GetNameDef]нарушая соглашения, подписанные между нашими народами по окончании гражданской войны в России. Должны ли мы наказывать их за их поведение?"
 SEA_japan_foreign_policy.127.a:0 "Нет, мы должны отпустить это..."
 SEA_japan_foreign_policy.127.b:0 "Да, они за это заплатят!"
 SEA_japan_foreign_policy.128.t:0 "[FROM.GetLeader] Требует нашего представления"
 SEA_japan_foreign_policy.128.desc:0 "[FROM.GetLeader] из [FROM.GetNameDef] Он потребовал, чтобы наше незаконное отколовшееся государство снова подчинилось правлению центральной власти в Токио и возвратилось к власти. [FROM.GetAdjective] Сфера. Как мы должны реагировать на эту явную угрозу?"
 SEA_japan_foreign_policy.128.a:0 "Мы не обладаем силой, чтобы отвергнуть их требования."
 SEA_japan_foreign_policy.128.b:0 "Мы будем сражаться до последнего человека!"
 SEA_japan_foreign_policy.129.t:0 "[FROM.GetLeader] Согласен с нашими требованиями"
 SEA_japan_foreign_policy.129.desc:0 "[FROM.GetLeader] из [FROM.GetNameDef] Он разумно принял наши требования и подчинился нашей власти, снова принеся [FROM.GetAdjective] Нация возвращается в сферу нашего влияния. Мы победим в этот день, как [FROM.GetAdjective] Народ освободился от буржуазной диктатуры!"
 SEA_japan_foreign_policy.129.a:0 "Блестяще"
 SEA_japan_foreign_policy.130.t:0 "[FROM.GetLeader] Отклонить наши требования"
 SEA_japan_foreign_policy.130.desc:0 "[FROM.GetLeader] из [FROM.GetNameDef] К сожалению, мы отвергли наши требования о подчинении, утверждая, что воля народа заключается в независимой демократии, а не в революционном государстве. [ROOT.GetAdjective] Сфера. Они сделали неправильный выбор..."
 SEA_japan_foreign_policy.130.a:0 "Тогда мы должны силой вернуть нашу территорию!"
 SEA_japan_foreign_policy.131.t:0 "[FROM.GetNameDefCap] Разжигает гражданскую войну в [ROOT.GetNameDef]"
 SEA_japan_foreign_policy.131.desc:0 "После недавних звонков [FROM.GetAdjective] Правительство и агитаторы, такие как Пак Хон Ён, похоже, что [ROOT.GetAdjective] Пролетариат устал ждать мирной смены правительства. После интенсивных дискуссий кажется, что дипломатия провалилась, и вооруженный конфликт начался, а силы Хон Юна уже захватили контроль над южными частями страны."
 SEA_japan_foreign_policy.131.a:0 "Для пролетариата!"
 SEA_japan_foreign_policy.131.b:0 "Мы должны остановить эту глупость!"
 SEA_japan_foreign_policy.132.t:0 "[FROM.GetLeader] Требует нашего представления"
 SEA_japan_foreign_policy.132.desc:0 "[FROM.GetLeader] из [FROM.GetNameDef] Он потребовал, чтобы наша буржуазная диктатура подчинилась власти центральной коммунистической власти в Токио и позволила народу нашей страны должным образом управлять собой, как лояльной части народа. [FROM.GetAdjective] Сфера. Как мы должны реагировать на эту явную угрозу?"
 SEA_japan_foreign_policy.132.a:0 "Мы не обладаем силой, чтобы отвергнуть их требования."
 SEA_japan_foreign_policy.132.b:0 "Мы будем сражаться до последнего человека!"
 SEA_japan_foreign_policy.133.t:0 "[FROM.GetLeader] Согласен с нашими требованиями"
 SEA_japan_foreign_policy.133.desc:0 "[FROM.GetLeader] из [FROM.GetNameDef] Мы приняли наши требования и подчинились нашей власти, приведя [FROM.GetAdjective] Нация в нашей сфере влияния. Мы победим в этот день, как [FROM.GetAdjective] Народ освободился от буржуазной диктатуры!"
 SEA_japan_foreign_policy.133.a:0 "Блестяще"
 SEA_japan_foreign_policy.134.t:0 "[FROM.GetLeader] Отклонить наши требования"
 SEA_japan_foreign_policy.134.desc:0 "[FROM.GetLeader] из [FROM.GetNameDef] К сожалению, мы отвергли наши требования о подчинении, утверждая, что воля народа заключается в независимой нации, а не в революционном государстве. [ROOT.GetAdjective] Сфера. Они сделали неправильный выбор..."
 SEA_japan_foreign_policy.134.a:0 "Тогда мы должны освободить их людей силой!"
 SEA_japan_foreign_policy.135.t:0 "Провозглашение Второй Филиппинской Республики"
 SEA_japan_foreign_policy.135.desc:0 "Сегодня утром, [ROOT.GetLeader] и различные [JAP.GetAdjective] Лидеры армий провели совместную прокламацию, объявив о создании нового [ROOT.GetAdjective] штат. Мы победим всех наших противников!"
 SEA_japan_foreign_policy.135.a:0 "Процветание в пределах видимости!"
 SEA_japan_foreign_policy.136.t:0 "Нападение на Перл-Харбор"
 SEA_japan_foreign_policy.136.desc:0 "Вчера, дата, которая будет жить в позоре, [ROOT.GetNameDef] внезапно и преднамеренно подверглись нападению военно-морских и военно-воздушных сил [JAP.GetNameDef]. [ROOT.GetNameDefCap] Он был в мире с этой нацией и, по просьбе [JAP.GetNonIdeologyName]Он все еще вел переговоры со своим правительством и императором, стремясь к поддержанию мира в Тихом океане. Действительно, через час после [JAP.GetAdjective] Воздушные эскадрильи начали бомбардировки в [ROOT.GetAdjective] Остров Оаху, The [JAP.GetAdjective] Посол в США и его коллега направили нашему госсекретарю официальный ответ на недавний вопрос. [ROOT.GetAdjective] сообщение. И хотя в этом ответе говорилось о том, что продолжение существующих дипломатических переговоров представляется бесполезным, в нем не содержалось никакой угрозы или намека на войну или вооруженное нападение. Но теперь пришло время взглянуть правде в глаза... Мы на войне!"
 SEA_japan_foreign_policy.136.a:0 "Этот день будет жить в бесчестье!"
 SEA_japan_popup_events.1.t:0 "Генрих Люшков прибыл в Маньчжурию"
 SEA_japan_popup_events.1.desc:0 "Наши агенты захватили [SOV.GetAdjective] Перебежчик, называющий себя Генрихом Самойловичем Люшковым в Посьете на маньчжурской границе. Он, кажется, высокопоставленный офицер НКВД, видимо, обладающий ценными секретными документами о [SOV.GetAdjective] военной мощи в регионе. Утверждая, что вы избегаете Великой Чистки, возможно, это ценная возможность для получения понимания внутренней работы. [SOV.GetNameDef]?"
 SEA_japan_popup_events.1.a:0 "Это пахнет возможностью!"
 SEA_japan_popup_events.1.b:0 "Мы не можем доверять этому иностранцу, чтобы он был правдивым."
 SEA_japan_popup_events.2.t:0 "Братство обороны на грани краха!"
 SEA_japan_popup_events.2.desc:0 "После недавних внутренних споров между руководством Дошикай, похоже, организация вот-вот рухнет. С некоторыми ссылками на вопиющее неуважение Киши и его союзников к Тодзё, а также многочисленные слухи о потенциальных планах убийств, циркулирующих вокруг, воздух содержит большое беспокойство. Не говоря уже о слухах, что Киши планирует технократическую диктатуру, которая пойдет против воли императора и ИДЖА. Лучше всего просто отпустить это соединение, или это слишком ценно, чтобы отказаться?"
 SEA_japan_popup_events.2.a:0 "Это не было сделано, чтобы длиться"
 SEA_japan_popup_events.2.b:0 "Мы должны сохранить его любой ценой!"
 JAP_harakiri_debate_has_taken_place_flag:0 "Напряженность между §YГражданское правительство§! и тот §YВоенные фракции§! Они достигли предела, и §YДебаты Харакири§! имело место"
 SEA_japan_popup_events.3.t:0 "Дебаты Харакири"
 SEA_japan_popup_events.3.desc:0 "На пленарном заседании Палаты представителей императорского парламента Хамада Кунимацу, член партии Риккен Сейюкай, выступил с резкой критикой министра армии Хисаичи Тераути и растущей власти военных фракций. После того, как министр столкнулся с ним за неуважение к власти военных и якобы оскорбление их чести, он ответил: Проверьте стенограмму, и если есть какие-либо слова, которые оскорбляют военных, я совершу сэппуку и извинюсь перед вами. Если таких слов нет, вы сами совершите сэппуку. После этого Тераучи был в ярости от этого и глядел на Хамаду со сцены, вызывая хаос гневными криками, пролетавшими через актовый зал."
 SEA_japan_popup_events.3.a:0 "Это катастрофа!"
 SEA_japan_popup_events.4.t:0 "Убедить императора"
 SEA_japan_popup_events.4.desc:0 "Наш император выразил незаинтересованность в наших амбициях по восстановлению Сёвы и созданию нового военного правительства. Вполне вероятно, что он по-прежнему просто находится под заклинанием контрольной фракции, но не станет ли он на нашу сторону, нам, скорее всего, придется заменить его имперское высочество своим братом Ясухито. Должны ли мы «убедить» его присоединиться к нам, или было бы разумно позволить истории идти своим чередом?"
 SEA_japan_popup_events.4.a:0 "Мы должны заручиться его поддержкой любыми средствами!"
 SEA_japan_popup_events.4.b:0 "У нас есть другие кандидаты."
 SEA_japan_popup_events.4.c:0 "Если он не поддерживает нас, он должен уйти..."
 SEA_japan_popup_events.5.t:0 "Хирохито решил поддержать новое правительство"
 SEA_japan_popup_events.5.desc:0 "После достаточных «убеждений» кажется, что наш великий император решил поддержать наше новообразованное правительство, дав нам официальное благословение продолжать наши планы по восстановлению Сёвы. Это будет способствовать укреплению нашей страны!"
 SEA_japan_popup_events.5.a:0 "Превосходно!"
 SEA_japan_popup_events.6.t:0 "Хирохито отказался поддержать новое правительство"
 SEA_japan_popup_events.6.desc:0 "Несмотря на наши настойчивые попытки убедить нашего великого императора, похоже, он отказывается видеть разум. Хотя это было не идеально, мы знали, что такая возможность есть, и у нас есть планы, чтобы справиться со сценарием такого рода. Его брат Ясухито, генерал Императорской японской армии, является кандидатом, который займет его место. Это будет либо Сешо для сына Хирохито Акихито, либо новый император, еще один в соответствии с нашей идеологией."
 SEA_japan_popup_events.6.a:0 "Тогда он должен отречься в пользу своего сына."
 SEA_japan_popup_events.6.b:0 "Поместите его под домашний арест!"
 SEA_japan_popup_events.7.t:0 "Хирохито убит!"
 SEA_japan_popup_events.7.desc:0 "Ранее сегодня наши офицеры, как сообщается, нашли императора Сёву мертвым в его резиденции. Они утверждают, что он был убит иностранными агентами, но мы не можем знать наверняка, потому что правда может причинить нам больше вреда, чем пользы. Из-за этой угрозы военные объявили военное положение и заявили, что принц Чичибу, генерал Императорской армии, будет коронован, поскольку было бы слишком опасно продолжать наследование и отдать корону Акихито, когда нападавшие все еще могут быть на свободе. Является ли это частью более крупного заговора, или действительно существует иностранный нападающий?"
 SEA_japan_popup_events.7.a:0 "Ясухито займет его место"
 SEA_japan_popup_events.8.t:0 "Вопрос о руководстве военной кликой"
 SEA_japan_popup_events.8.desc:0 "С созданием нашего нового военного правительства вновь встал вопрос о руководстве. Основатель Кодоха Садао Араки заявил, что он хочет взять на себя роль премьер-министра и выдвинул это императору, но поскольку Цзиндзабуро Масаки более популярен среди мужчин и населения в целом, чем Араки, может быть разумнее позволить ему роль премьер-министр, в то время как Араки просто занимает церемониальную позицию. Что нам делать?"
 SEA_japan_popup_events.8.a:0 "Масаки более популярен среди мужчин."
 SEA_japan_popup_events.8.b:0 "Араки должен стать национальным сотой"
 SEA_japan_popup_events.9.t:0 "Вопрос о морали, бусидо и фашизме"
 SEA_japan_popup_events.9.desc:0 "Генерал Садао Араки, известный политический философ в армии, связал древний кодекс самурая с идеями, подобными европейскому фашизму, чтобы сформировать философскую основу своей идеологии, которая связывает императора, народ, землю и мораль как единое целое. Для укрепления этих идей было бы разумно принять форму правления, более близкую к западной, на которой он строит свою идеологическую модель. Что скажешь?"
 SEA_japan_popup_events.9.a:0 "Мы должны держаться подальше от таких западных концепций!"
 SEA_japan_popup_events.9.b:0 "Араки прав, и мы должны принять эти идеи."
 SEA_japan_popup_events.10.t:0 "Слухи о военном перевороте"
 SEA_japan_popup_events.10.desc:0 "В последнее время ходят слухи о возможном государственном перевороте, запланированном фракцией Кодоха, радикальной традиционалистской фракцией в армии. Похоже, что они будут ждать, пока не закончится суд над подполковником Сабуро Айдзавой, причем он станет неотъемлемой частью их организации. Зная их возможные мотивы, кажется вероятным, что они попытаются убить многих из тех, кого они считают угрозой своим ценностям во время этого переворота. Возможно, нам придется действовать быстро, чтобы в ближайшем будущем мы не увидели кровавую бойню."
 SEA_japan_popup_events.10.a:0 "Как бесчестно! Мы должны действовать быстро!"
 SEA_japan_popup_events.11.t:0 "Слухи о народном восстании"
 SEA_japan_popup_events.11.desc:0 "Поскольку император все еще находится под домашним арестом, несмотря на то, что мы давно создали наше правительство, инакомыслие растет все быстрее. Похоже, что наш народ хочет видеть Хирохито должным образом восстановленным на троне, и они могут даже готовиться к действиям по его освобождению, если мы не сделаем что-то с ситуацией в ближайшее время. Возможно, они немного успокоились бы, если бы не было такой фигуры, которую можно было бы вернуть на трон, как бы нам это ни было непопулярно. Как мы должны подходить к этому?"
 SEA_japan_popup_events.11.a:0 "Приказы будут отданы, но постарайтесь не оставлять доказательств"
 SEA_japan_popup_events.11.b:0 "Нет, бывший император должен жить!"
 SEA_japan_popup_events.12.t:0 "Император найден мертвым в своей резиденции"
 SEA_japan_popup_events.12.desc:0 "Ранее премьер-министр объявил, что бывший император Сёва недавно был найден мертвым в императорской резиденции. Многие подозревают, что это был преднамеренный шаг военных, чтобы попытаться обеспечить свою власть, хотя официально утверждается, что он умер по естественным причинам, хотя токийской полиции не разрешили войти, чтобы подтвердить его причину смерти. Неужели это измена самой армии?"
 SEA_japan_popup_events.12.a:0 "Страна скорбит."
 SEA_japan_popup_events.12.b:0 "Найди преступников, Нагако требует ответов!"
 SEA_japan_popup_events.13.t:0 "Офицерам Кодохи предъявлено обвинение в убийстве Хирохито"
 SEA_japan_popup_events.13.desc:0 "Благодаря недавним расследованиям, проведенным Токийской столичной полицией по приказу Нагако, жены покойного императора Сёвы, было обнаружено, что фракция Кодоха действительно несет ответственность за хладнокровное убийство бывшего императора. Имея более чем достаточно оснований, чтобы объявить это государственной изменой, пришло время отстранить эту предательскую клику от власти."
 SEA_japan_popup_events.13.a:0 "Объявите военное положение, Нагако решит нестабильность наций!"
 SEA_japan_popup_events.14.t:0 "Завершение всеобщих выборов 1936 года"
 SEA_japan_popup_events.14.desc:0 "Несмотря на опасные времена, всеобщие выборы завершились, и наш народ решил, кто будет представлять их в Палате представителей. Rikken Minseitō при Мачиде Чудзи вышла из выборов как самая большая партия, с Rikken Seiyūkai теряя свое большинство. Несмотря на то, что эти выборы не имеют большого значения из-за падения полномочий гражданского правительства, они показывают, что наша демократия все еще остается хрупкой."
 SEA_japan_popup_events.14.a:0 "Май Мачида Чудзи возглавит скважину Риккен Минсейто"
 SEA_japan_popup_events.15.t:0 "Окада погиб на станции в Токио"
 SEA_japan_popup_events.15.desc:0 "Ранее этим утром премьер-министр Кейсуке Окада был застрелен сотрудниками тайной полиции Токко, ожидая, чтобы взять линию Яманоте на станции Токио. Вскоре после этого военные выступили с угрозой императорскому сейму, заявив, что любая попытка их исключить будет встречена силой. Это явная эскалация ситуации, и временный премьер-министр Мачида Чудзи обратился к императору с просьбой признать ситуацию и сделать заявление. Только время покажет, какую сторону он примет."
 SEA_japan_popup_events.15.a:0 "Их надо остановить!"
 SEA_japan_popup_events.16.t:0 "Император назначил нового премьер-министра"
 SEA_japan_popup_events.16.desc:0 "В ответ на недавние просьбы временного премьер-министра Мачиды Чудзи, император Хирохито выступил против насилия, вызванного продолжающимся фракционным конфликтом, и решил, кого он должен назначить, чтобы взять на себя роль и стать новым премьер-министром в эти трудные времена. Человек, которого он выдвинул, является..."
 SEA_japan_popup_events.16.a:0 "Либеральная Мачида Чудзи"
 SEA_japan_popup_events.16.b:0 "Социалист Абэ Ису"
 SEA_japan_popup_events.16.c:0 "Президент Дома пэров, Токугава Иесато"
 SEA_japan_popup_events.17.t:0 "Военные объявили забастовку"
 SEA_japan_popup_events.17.desc:0 "Многие высокопоставленные должностные лица как Императорской японской армии, так и Императорского японского военно-морского флота объявили, что армия нанесет удар, после того как наше правительство объявило о прекращении своего влияния на нашу политику. Они говорят, что не будут защищать нынешнее правительство в случае нападения и, вероятно, уже замышляют еще один государственный переворот, чтобы свергнуть нашего премьер-министра."
 SEA_japan_popup_events.17.a:0 "Ситуация нарастает..."
 SEA_japan_popup_events.18.t:0 "Военные сами себя укрепляют"
 SEA_japan_popup_events.18.desc:0 "Военные начали готовиться к столкновениям с лояльными правительству силами после того, как силы гражданской полиции недавно заявили о лояльности к диете. Похоже, они пытаются обеспечить контроль над регионами в случае начала гражданской войны. Мы должны начать противодействовать этому акту мятежа с величайшей спешкой!"
 SEA_japan_popup_events.18.a:0 "Немедленно перебрось столичную полицию в Токио!"
 SEA_japan_popup_events.18.b:0 "Мы должны гарантировать, что не возьмем под контроль промышленный пояс!"
 enables_the_civil_war_decisions_tt:0 "Мы сможем обеспечить, чтобы государства присоединились к нашей стороне в случае, если §YГражданская война§! Прорывы через решения по карте"
 JAP_shanghai_ultimatum:0 "Ультиматум Хонкоу"
 SEA_japan_popup_events.19.t:0 "Ультиматум Хонкоу"
 SEA_japan_popup_events.19.desc:0 "После убийства еще одного японского офицера в Шанхае мы получили ультиматум, в котором говорится, что если мы полностью не уйдем из региона, они нападут в течение недели.\n\nКак мы должны реагировать?"
 SEA_japan_popup_events.19.a:0 "Мы не должны поддаваться их требованиям!"
 SEA_japan_popup_events.19.b:0 "Наши люди перешагнули, отойдите!"
 SEA_japan_popup_events.20.t:0 "[FROM.GetLeader] Отказ от ультиматума Хункоу"
 SEA_japan_popup_events.20.desc:0 "Китайские власти утверждают, что «точка перелома» достигнута в отношении нашей «необоснованной агрессии» против Китая. Наши требования о репарациях были отклонены, и есть сообщения о том, что в Шанхае больше японских граждан подвергаются нападению. Если нам нужен был предлог, чтобы решительно разобраться с китайцами, то это он!"
 SEA_japan_popup_events.20.a:0 "Они за это заплатят!"
 SEA_japan_popup_events.21.t:0 "[FROM.GetLeader] Подписывается Ультиматум Хункоу"
 SEA_japan_popup_events.21.desc:0 "Удивительно, но китайцы решили отступить после ультиматума, направленного на контроль над Шанхаем. Они понимают, что разозлить нас - это очень дорого, и согласились на обширные территориальные уступки, которые включают сам город и его окрестности. Мало-помалу Китай становится нашим."
 SEA_japan_popup_events.21.a:0 "Война должна подождать."
 SEA_japan_popup_events.22.t:0 "Осада замка Осака"
 SEA_japan_popup_events.22.desc:0 "Услышав новости об отмене спорного закона о сохранении мира, армейский гарнизон в их штаб-квартире в замке Осака открыл огонь по правительственным гарнизонам, дислоцированным за пределами парка. Похоже, что они не отступят без боя и готовы разорвать раскол в душе нашей нации, если это означает сохранение их гегемонии. Мы должны их уничтожить!"
 SEA_japan_popup_events.22.a:0 "Пришло время вернуть дух эпохи Тайсё!"
 SEA_japan_popup_events.23.t:0 "Самодовольный император"
 SEA_japan_popup_events.23.desc:0 "Легитимность императора Хирохито ставится под сомнение с тех пор, как он стал проявлять самоуспокоенность в отношении растущего военного доминирования над политикой и бездействием, когда между фракциями в стране усилилось насилие. Теперь многие призывают одного из его младших братьев Нобухито, который является ярым сторонником гражданского правительства, принять титул императора, поскольку его старшие братья оба совершили акты государственной измены. Это позволило бы сохранить королевскую поддержку нашего нынешнего правительства и укрепить моральный дух нашего народа."
 SEA_japan_popup_events.23.a:0 "Нобухито займет его место."
 SEA_japan_popup_events.24.t:0 "Имперская армия капитулирует"
 SEA_japan_popup_events.24.desc:0 "Последние остатки Имперской армии на островах размахивали белым флагом, сигнализируя о прекращении многолетнего конфликта между правительством наших стран и его собственными вооруженными силами. Большая часть страны была повреждена в результате боевых действий, но это сигнализирует о новом старте для страны. [ROOT.GetAdjective] людей. За рубежом наш враг все еще задерживается, но сейчас пришло время для восстановления. Правительство уже разработало планы по организации первых всеобщих выборов, поскольку коррумпированные элементы больше не могут вмешиваться."
 SEA_japan_popup_events.24.a:0 "Мы вернули себе наше будущее!"
 SEA_japan_popup_events.25.t:0 "Всеобщие выборы"
 SEA_japan_popup_events.25.desc:0 "Первые выборы после отстранения военных от нашей политики сейчас проводятся, и люди идут и используют свой голос, чтобы управлять будущим нации. В настоящее время выборы проходят между либеральной партией Риккен Минсейто и более консервативной партией Риккена Сейюкай, которые совсем недавно возглавили Имперскую диету. Бюллетени отдаются, и в скором времени будет определен победитель."
 SEA_japan_popup_events.25.a:0 "Rikken Minseitō побеждает!"
 SEA_japan_popup_events.25.b:0 "Rikken Seiyūkai побеждает!"
 SEA_japan_popup_events.26.t:0 "Куантунский армейский переворот D'etat"
 SEA_japan_popup_events.26.desc:0 "В условиях гражданской войны, бушующей сейчас между военными и правительством Японии, Квантунская армия, дислоцированная в нашей стране, в надежде обеспечить свое феодальное полевое государство в Маньчжурии, воспользовалась возможностью совершить военный переворот против нашего собственного правительства. Должны ли мы позволить этому случиться, или мы должны сопротивляться им со всем, что у нас есть?"
 SEA_japan_popup_events.26.a:0 "Нет смысла сопротивляться им."
 SEA_japan_popup_events.26.b:0 "Пора сломать это японское иго!"
 MAN_kwantung_will_try_to_occupy_east_hebei_tt:0 "Это позволит нам использовать помощь Квантунской армии для захвата контроля над [609.GetName]"
 SEA_japan_popup_events.27.t:0 "Золотая возможность"
 SEA_japan_popup_events.27.desc:0 "В условиях гражданской войны между военными и правительством в Японии корейский народ понял, что настал момент вернуть контроль над своей страной и выгнать японских угнетателей. Корейский полуостров будет процветать под властью собственного народа."
 SEA_japan_popup_events.27.a:0 "Бросьте захватчиков обратно в море!"
 SEA_japan_popup_events.28.t:0 "Сельская база операций"
 SEA_japan_popup_events.28.desc:0 "Коммунистическая партия решила начать подпольные операции, вне поля зрения и ума как Императорской армии, так и правительства. Единственный вопрос, который сейчас стоит перед ними, заключается в том, какой регион был бы достаточно удаленным, где вероятность быть обнаруженным и выкорчеванным была бы как можно ниже?"
 SEA_japan_popup_events.28.a:0 "Хоккайдо идеально"
 SEA_japan_popup_events.28.b:0 "Шикоку достаточно удален."
 SEA_japan_popup_events.28.c:0 "Создать филиал в Кагосиме"
 SEA_japan_popup_events.29.t:0 "Инцидент в Миядзаки"
 SEA_japan_popup_events.29.desc:0 "Ранним утром силы, принадлежавшие к императорской армии, заняли склад на окраине Миядзаки, в котором находились коммунистические революционеры, пытаясь арестовать их. Кюити Токуда был спасен из тюрьмы Абашири местными коммунистическими партизанами, и после перестрелки, произошедшей на складе Миядзаки, приказ был отдан по радиопередаче Токуды, чтобы начать революцию с максимальной поспешностью. Кажется, что время для действий настало."
 SEA_japan_popup_events.29.a:0 "Революция наконец-то началась!"
 JAP_democratic_side_also_spawns_tt:0 "The §YДемократическое правительство§! Мы будем бороться и против нашей революции!"
 SEA_japan_popup_events.30.t:0 "Дебаты о будущем направлении государства"
 SEA_japan_popup_events.30.desc:0 "В связи с тем, что после поражения императорской армии ситуация стала более стабильной, в национальном рационе разгорелись дебаты о том, какой путь выбрать. Кодза-ха утверждает, что только используя пролетариат и используя авторитарную руководящую руку для управления народом, мы можем достичь нашего идеального будущего, в то время как Роно-ха утверждает , что более мягкое и менее навязчивое зонтичное движение было бы идеальным для контроля государства. Какая идея должна быть принята?"
 SEA_japan_popup_events.30.a:0 "Кодза-ха прямо здесь."
 SEA_japan_popup_events.30.b:0 "Идеалы Роно-ха сияют ярче всего сегодня"
 JAP_supported_the_kozaha_idea_flag:0 "Поддерживал Кодза-ха в дебатах"
 JAP_supported_the_rounoha_idea_flag:0 "Поддерживал Роно-Ха в дебатах"
 JAP_supported_the_kozaha_idea_tt:0 "Откроет фокус §Y$JAP_the_lecture_group_ascendant$§!"
 JAP_supported_the_rounoha_idea_tt:0 "Откроет фокус §Y$JAP_the_labor_farmer_faction_ascendant$§!"
 SEA_japan_popup_events.31.t:0 "Лидер для Kōza-ha"
 SEA_japan_popup_events.31.desc:0 "С триумфом революции и власти, которая сейчас находится в руках Коза-ха, пришло время избрать премьер-министра для новой народной республики. Лидерами двух партий во время войны были Сандзо Носака и Кюити Токуда, и с победой революции они оба показали, что способны и готовы вести нас к коммунизму. Хотя идеологически не всегда выровнены, оба демонстрируют большой потенциал, и на кого приземляется выбор, поэтому полностью зависит от судьбы. Будет ли это международная Носака или более опытная, но, возможно, менее популярная Токуда?"
 SEA_japan_popup_events.31.a:0 "Сандзо Носака пользуется популярностью"
 SEA_japan_popup_events.31.b:0 "Кюити Токуда имеет опыт"
 SEA_japan_popup_events.32.t:0 "Лидер для Роно-ха"
 SEA_japan_popup_events.32.desc:0 "После окончания гражданской войны и триумфа революции фракция лейбористов-фермеров завоевала доверие партии и народа. Не будучи столь же ортодоксальными в своих идеалах, они сумели завоевать множество последователей и, как следствие, получить власть. Главный вопрос остается, однако, кто станет следующим премьером республики? Три кандидата были представлены, но окончательные выборы все еще остаются. Будет ли это Хитоши Ямакава, который как центральная фигура в социалистическом движении показал свой опыт? Будет ли это Кансон Арахата, которому удалось собрать большие объемы поддержки с народом и поэтому уже был избран председателем? Или это будет Ямакава Кикуэ, которая, несмотря на свою меньшую известность в партии, показала, что она подходит для роли лидера и реформатора?"
 SEA_japan_popup_events.32.a:0 "Хитоши Ямакава имеет опыт"
 SEA_japan_popup_events.32.b:0 "Кансон Арахата пользуется поддержкой народа"
 SEA_japan_popup_events.32.c:0 "У Ямакавы Кикуэ самые революционные идеи"
 SEA_japan_popup_events.33.t:0 "Судьба императорской семьи"
 SEA_japan_popup_events.33.desc:0 "Теперь, когда власть прочно в руках народа, вопрос о бывшей императорской семье все еще нависает над нашими головами. Есть много разных мнений о том, как лучше всего обращаться с ними, некоторые из них способствуют реформам и понижают их до статуса простого рабочего, в то время как некоторые утверждают, что им следует столкнуться с более суровыми наказаниями за свои преступления против народа как во время войны, так и задолго до этого. Там, где выбор падает, до сих пор не решено, но что бы это ни было, будут разные мнения, которые, возможно, придется решать."
 SEA_japan_popup_events.33.a:0 "Заставьте их жить как нормальные люди."
 SEA_japan_popup_events.33.b:0 "Пусть отбывают срок в тюрьме"
 SEA_japan_popup_events.33.c:0 "Они слишком опасны, чтобы их можно было сохранить в живых!"
 SEA_japan_popup_events.33.d:0 "Отправьте их в изгнание"
 SEA_japan_popup_events.34.t:0 "Дебаты по теории революции айнов"
 SEA_japan_popup_events.34.desc:0 "Многие из наших политических мыслителей рассуждали о том, что люмпенпролетариат является основной массой нашей революции и что айнский народ также входит в эту группу. Кроме того, они считают, что айновцы жили в примитивной коммунистической системе и считают их достойными быть «лидерами коммунистической революции». Однако сейчас возникает вопрос: каким образом они должны быть такими? Должно ли это быть путем включения их традиций в наше социалистическое общество, или это должно быть через предоставление автономии народу айнов?"
 SEA_japan_popup_events.34.a:0 "Мы должны использовать их увлекательные традиции."
 SEA_japan_popup_events.34.b:0 "Этим революционным лидерам должна быть предоставлена автономия, которой они заслуживают!"
 SEA_japan_popup_events.35.t:0 "[FROM.GetLeader] Желает укрепить династию И"
 SEA_japan_popup_events.35.desc:0 "Наш повелитель [FROM.GetNameDef] Он потребовал, чтобы наш колониальный губернатор ушел в отставку в пользу И Уна, наследника [ROOT.GetAdjective] трон и лояльность к Японской империи. Это звучит как сделка, слишком хорошая, чтобы пропустить."
 SEA_japan_popup_events.35.a:0 "Мы будем любезно принимать"
 SEA_japan_popup_events.35.b:0 "Нет, губернаторство должно остаться!"
 SEA_japan_popup_events.36.t:0 "[FROM.GetNameDefCap] Разжигает коммунистические чувства"
 SEA_japan_popup_events.36.desc:0 "Мы обратили внимание, что в настоящее время [FROM.GetAdjective] Ячейки, действующие в нашей стране, распространяют коммунистические настроения. Хотя это кажется достаточно безобидным, некоторые пропагандистские материалы носят скорее революционный характер. Сообщения о том, что рабочих поощряют к организации и объединению, становятся все более частыми, и, судя по недавней истории, мы не можем быть уверены, что это не сложная уловка со стороны правительства. [FROM.GetAdjective] В конечном счете, мы интегрируемся."
 SEA_japan_popup_events.36.a:0 "Позвольте им продолжить"
 SEA_japan_popup_events.36.b:0 "Заткнитесь на этих социалистических агитаторов!"
 SEA_japan_popup_events.37.t:0 "[FROM.GetNameDefCap] Разжигает коммунистические чувства"
 SEA_japan_popup_events.37.desc:0 "Мы обратили внимание, что в настоящее время [FROM.GetAdjective] Ячейки, действующие в нашей стране, распространяют коммунистические настроения. Хотя это само по себе кажется достаточно безобидным, похоже, что часть пропаганды носит скорее революционный характер. Сообщения о том, что рабочих поощряют к организации и объединению, становятся все более частыми, и, судя по недавней истории, мы не можем быть уверены, что это не сложная уловка со стороны правительства. [FROM.GetAdjective] В конечном счете, мы интегрируемся."
 SEA_japan_popup_events.37.a:0 "Позвольте им продолжить"
 SEA_japan_popup_events.37.b:0 "Заткнитесь на этих социалистических агитаторов!"
 SEA_japan_popup_events.38.t:0 "Гражданская война в [ROOT.GetNameDef]"
 SEA_japan_popup_events.38.desc:0 "После долгого периода роста коммунистических настроений, кажется, что [ROOT.GetAdjective] Пролетариат устал ждать мирной смены правительства. После интенсивных дискуссий кажется, что дипломатия провалилась, и вооруженный конфликт начался."
 SEA_japan_popup_events.38.a:0 "Для пролетариата!"
 SEA_japan_popup_events.38.b:0 "Мы должны остановить эту глупость!"
 SEA_japan_popup_events.39.t:0 "Возрождение буддизма"
 SEA_japan_popup_events.39.desc:0 "Благодаря тому, что наше зонтичное движение объединило различные социалистические движения по всей Японии, буддийское социалистическое движение с Гиро Сеноо у руля быстро выросло, а Молодежная лига возрождения буддизма стала движением за нашу социалистическую молодежь. Советник партии Цудзи Цзюнь надавил [ROOT.GetLeader] По вопросу о лидерстве, утверждая, что государству было бы лучше, если бы все более и более популярный Гиро Сену возглавил партию. Является ли это правильным путем к духовному освобождению, а также к социально-экономическому освобождению?"
 SEA_japan_popup_events.39.a:0 "Это путь вперед!"
 SEA_japan_popup_events.39.b:0 "Нет, [ROOT.GetLeader] будет продолжать лидировать"
 SEA_japan_popup_events.40.t:0 "Тревожные сообщения [JAP.GetAdjective] экспансионизм"
 SEA_japan_popup_events.40.desc:0 "Хотя [JAP.GetNameDef] Быстро расширяется в Азии, оккупировав ее соседей и опустошив их страны, наши отрасли промышленности и природные ресурсы продолжают поддерживать их экономику и текут на их фабрики, чтобы превратиться в оружие войны. Наш народ сейчас все более критично относится к этому и требует принятия мер. Что нам делать?"
 SEA_japan_popup_events.40.a:0 "Мы не можем продолжать снабжать их войну нашими материалами!"
 SEA_japan_popup_events.40.b:0 "Азиатская страна не будет представлять для нас угрозу, это нормально."
 SEA_japan_popup_events.41.t:0 "The [FROM.GetAdjective] эмбарго"
 SEA_japan_popup_events.41.desc:0 "Основываясь на их необдуманном решении относительно нашей умеренной экспансии и умиротворения наших врагов, кажется, что это разжигание войны. [FROM.GetAdjective] Граждане оказывали давление [FROM.GetLeader] из [FROM.GetNameDef] Запретить нам эмбарго. Они решили, что больше не будет торговли между нашими народами, что является явным нарушением их нейтралитета по отношению к нам."
 SEA_japan_popup_events.41.a:0 "Они заблуждаются."
 SEA_japan_popup_events.42.t:0 "Люди теряют доверие к [ROOT.GetLeader]"
 SEA_japan_popup_events.42.desc:0 "С театрами восточноазиатской войны, превращающимися в политические минные поля, и большими участками территории, лежащими незащищенными от врага, люди начинают сомневаться в компетентности противника. [ROOT.GetLeader] Чтобы выиграть войну. Если ситуация не будет решена с поспешностью, либо путем активизации военных усилий, либо путем привлечения более компетентного кабинета, война может быть столь же хорошей, как и проигранная."
 SEA_japan_popup_events.42.a:0 "Мы должны положить конец этой трясине!"
 JAP_unlock_the_surrender_subbranch_tt:0 "Разблокировать фокусы §Y$JAP_the_koiso_cabinet$§!, §Y$JAP_the_war_has_not_necessarily_developed_focus$§!, §Y$JAP_japans_longest_day$§! и §Y$JAP_the_surrender_broadcast$§! которые позволяют удалять §Y$JAP_crumbling_military_cabinet_idea$§! Потенциальный выход из войны в Восточной Азии"
 SEA_japan_popup_events.43.t:0 "Инцидент в Кюдзё"
 SEA_japan_popup_events.43.desc:0 "Услышав о желании императора объявить о формальном прекращении войны в Восточной Азии, несколько путчистов под командованием майора Кенджи Хатанаки предприняли попытку убедить императорскую гвардию помочь им занять Токийский императорский дворец и поместить императора под домашний арест. Генералы Шизуити Танака и Такеши Мори готовы быстро положить конец этой попытке государственного переворота, но кто знает, какая сторона выйдет на первое место?"
 SEA_japan_popup_events.43.a:0 "Как они смеют противиться желанию императоров?"
 SEA_japan_popup_events.43.b:0 "Темные тучи должны исчезнуть из царства Императора!"
 JAP_kyujo_incident_rebels_lost_flag:0 "Kyūjō Putsch потерпел неудачу, и путчисты были арестованы."
 JAP_kyujo_incident_rebels_won_flag:0 "Путч Кюдзё увенчался успехом, и путчисты поместили императора под домашний арест."
 JAP_unlock_japans_longest_day_tt:0 "Разблокировать фокус §Y$JAP_japans_longest_day$§!"
 JAP_unlock_surrender_broadcast_tt:0 "Разблокировать фокус §Y$JAP_the_surrender_broadcast$§!"
 SEA_japan_popup_events.44.t:0 "Возвышение Хорлугийна Чойбалсана"
 SEA_japan_popup_events.44.desc:0 "Будучи главнокомандующим Монгольской народной армией и одним из великих монгольских революционеров 1921 года, Хорлугийн Чойбалсан является сильным кандидатом на то, чтобы довести нашу страну до величия. С его недавними военными подвигами, он теперь также доказал себя компетентным эногхом, чтобы по-настоящему править нацией, поскольку это один лидер. Не пора ли ему взяться за мантию 10-го председателя Совета министров?"
 SEA_japan_popup_events.44.a:0 "Время подходящее."
 SEA_japan_popup_events.44.b:0 "Нет, он должен оставаться на поле!"
 SEA_japan_popup_events.45.t:0 "Оккупация Восточного автономного правительства Хэбэя"
 SEA_japan_popup_events.45.desc:0 "После краха официального командования японской армии и гражданской войны, которая последовала на Островах Родины, японский протекторат, известный как Восточное автономное правительство Хэбэя, который лежит на нашей юго-западной границе, теперь находится незащищенным. Настало время нам нанести удар, и принять его, пока мы [JAP.GetAdjective] У правительства слишком много других проблем, чтобы заботиться о том, что происходит на континенте."
 SEA_japan_popup_events.45.a:0 "Наша консолидация продолжается"
 SEA_japan_popup_events.46.t:0 "Квантунская армия оккупировала Восточный Хэбэй"
 SEA_japan_popup_events.46.desc:0 "После краха официального командования японской армии и гражданской войны, которая последовала на Островах Родины, наш бывший протекторат известен как Восточное автономное правительство Хэбэя. [MAN.GetNameDef]Юго-западная граница теперь остается незащищенной. Таким образом, они решили нанести удар и принять его, в то время как у нашего правительства слишком много других проблем, чтобы заботиться о том, что происходит на континенте."
 SEA_japan_popup_events.46.a:0 "С ними мы разберемся позже..."
 SEA_japan_popup_events.47.t:0 "[FROM.GetNameDefCap] Отменить наши права на ресурсы [655.GetName]"
 SEA_japan_popup_events.47.desc:0 "[FROM.GetLeader] из [FROM.GetNameDef] Недавно мы подписали новый документ, который аннулирует наши права на лесное хозяйство и добычу полезных ископаемых. [655.GetName]В гнусном пренебрежении к договорам, которые мы подписали в конце Гражданской войны в России, мы передали регион обратно."
 SEA_japan_popup_events.47.a:0 "На севере назревает буря..."
 SEA_japan_popup_events.48.t:0 "[ROOT.GetLeader] Объявлено чрезвычайное положение в стране"
 SEA_japan_popup_events.48.desc:0 "После падения вражеских войск на нашей земле, [ROOT.GetLeader] Он ввел военное положение и объявил чрезвычайное положение до тех пор, пока захватчики не будут вытеснены с нашей земли. Никто не знает, сколько времени это может занять, но все они знают, что снова земля под абсолютным контролем семьи Токугава."
 SEA_japan_popup_events.48.a:0 "Предоставление Токугаве абсолютной власти никогда не ошибалось."
 SEA_japan_popup_events.49.t:0 "[ROOT.GetLeader] Найден мертвым!"
 SEA_japan_popup_events.49.desc:0 "После его прихода к власти в качестве члена умеренных сил на флоте, [ROOT.GetLeader] Он оказался очень популярным в глазах народа. Теперь, когда армия снова набирает огромную силу, кажется, что они все еще держат обиду на него, поскольку ранее сегодня он был найден мертвым в своей резиденции. Хотя, вероятно, будет подделано, завещание было найдено на теле премьер-министра, передавшего руководство страны Адачи Кензо."
 SEA_japan_popup_events.49.a:0 "Похоже, призрак милитаризма все еще преследует нас."
 SEA_japan_popup_events.50.t:0 "Совместные требования Токко и бюрократов"
 SEA_japan_popup_events.50.desc:0 "С образованием Ассоциации содействия имперскому правлению стало ясно, что Генки Абэ, лидер Полиции Мыслей наряду с различными руководителями гражданской службы, не особенно доволен действиями правительства. [ROOT.GetLeader]. Теперь они требуют, чтобы он ушел в отставку в пользу пронацистского политика Сейго Накано. Должны ли мы принять это давление?"
 SEA_japan_popup_events.50.a:0 "Если это премьер-министр, то он хочет..."
 SEA_japan_popup_events.50.b:0 "Мы не будем выполнять их требования!"
 SEA_imperial_influence_events.500.t:0 "Фракция ВМС требует, чтобы мы нанесли удар по югу"
 SEA_imperial_influence_events.500.desc:0 "[ROOT.GetLeader] Только что было вручено письмо, подписанное военно-морским штабом с требованием начать подготовку к полномасштабному принятию доктрины Южного удара, в котором утверждается, что их потребности в ресурсах, которые можно найти в Ост-Индии, достигли критической точки. Конечно, их можно было бы просто игнорировать, но, возможно, было бы неразумно заставлять их ждать."
 SEA_imperial_influence_events.500.a:0 "Подготовка должна быть сделана с поспешностью!"
 take_the_strike_south_focus_tt:0 "завершение §Y$JAP_strike_the_southern_road$§! И идти на войну с §YЗападные державы§! Успокоит тебя $JAP_naval_faction$"
 SEA_imperial_influence_events.501.t:0 "Военно-морские офицеры уходят в отставку в гневе"
 SEA_imperial_influence_events.501.desc:0 "Не сумев реализовать планы, разработанные для исполнения доктрины Южного удара в то время, когда мы были отведены штабом ВМС, теперь кажется, что многие офицеры ВМС, принимавшие участие в попытке оказать давление на нас, не смогли выполнить свои обязательства. [ROOT.GetLeader] И вот они подали в отставку."
 SEA_imperial_influence_events.501.a:0 "Такой бесчестный поступок!"
 SEA_japan_tokko_arrest_events.1.t:0 "Инцидент Народного фронта"
 SEA_japan_tokko_arrest_events.1.desc:0 "Токко обнаружили угрозу нашей внутренней стабильности. Есть, казалось бы, организации социалистов и коммунистов, которые стремятся подорвать наше общество. Был составлен список лиц, подлежащих аресту, состоящий из нескольких высокопоставленных членов коммунистической партии, таких как Кансон Арахата, Сабуро Эда, Рёкичи Минобе, Ицуро Сакисака, Кодзо Сасаки, Мосабуро Судзуки, Минору Такано и Хитоси Ямакава."
 SEA_japan_tokko_arrest_events.1.a:0 "Отличные новости."
 JAP_popular_front_incident_tt:0 "Будут арестованы различные коммунистические политики и агитаторы"
 SEA_japan_tokko_arrest_events.2.t:0 "Инцидент Кокса"
 SEA_japan_tokko_arrest_events.2.desc:0 "Токко обнаружили угрозу нашей внутренней стабильности. 11 британских граждан, проживающих в нашей стране, должны быть арестованы по подозрению в нарушении Закона о защите военных секретов, а их руководителем является М.Дж.Кокс, начальник токийского бюро Reuters. Хотя [ENG.GetAdjective] Правительство утверждает, что это не шпионы, но их доставили в здание штаба военной полиции для допросов."
 SEA_japan_tokko_arrest_events.2.a:0 "Иностранные агенты получают то, что заслуживают!"
 SEA_japan_tokko_arrest_events.2.b:0 "Постарайся не злить [ENG.GetAdjective]"
 JAP_cox_incident_tt:0 "Различные [ENG.GetAdjective] Граждане, подозреваемые в шпионаже, будут арестованы"
 SEA_japan_tokko_arrest_events.3.t:0 "Инцидент в Гассакуше"
 SEA_japan_tokko_arrest_events.3.desc:0 "Токко обнаружили еще одну угрозу нашей внутренней стабильности. Многие сотрудники Южно-Маньчжурского следственного отдела железной дороги были дважды арестованы военной полицией Квантунской армии и содержатся под подозрением в распространении антияпонской и коммунистической пропаганды в наших колониях. Также, по-видимому, они занимались социальными исследованиями и анализом с использованием марксистских методов, которые ранее были запрещены на Родовых островах. Этот заговор может быть очень глубоким, как с ним следует обращаться?"
 SEA_japan_tokko_arrest_events.3.a:0 "Пусть Квантунская армия разберется с этим."
 SEA_japan_tokko_arrest_events.3.b:0 "Мы должны немедленно произвести массовый арест!"
 SEA_japan_tokko_arrest_events.3.c:0 "Они не представляют угрозы для нас, игнорируют их."
 SEA_japan_tokko_arrest_events.4.t:0 "Инцидент с Сержем"
 SEA_japan_tokko_arrest_events.4.desc:0 "Токко обнаружили еще одну угрозу нашей внутренней стабильности. На этот раз они обнаружили [SOV.GetAdjective] Кольцо шпионов во главе с [GER.GetAdjective] Журналист Ричард Зорге, группа, признанная виновной в шпионаже и подрывной деятельности по всей нашей стране. Похоже, что они приобрели сотрудников, с которыми также необходимо иметь дело, таких как бывший журналист Асахи Симбуна Хоцуми Озаки и Коити Сайонджи, член нашей аристократии."
 SEA_japan_tokko_arrest_events.4.a:0 "Иностранные агенты получают то, что заслуживают!"
 SEA_japan_tokko_arrest_events.4.b:0 "Постарайся не злить [SOV.GetAdjective]s"
 JAP_sorge_incident_tt:0 "Различные [SOV.GetAdjective] Граждане и их связи в нашей стране, которые подозреваются в шпионаже, будут арестованы."
 SEA_japan_tokko_arrest_events.5.t:0 "Инцидент в Йокогаме"
 SEA_japan_tokko_arrest_events.5.desc:0 "Специальная высшая полиция Йокогамы арестовала почти три десятка интеллектуалов по обвинению в попытке возродить Коммунистическую партию, которая ранее была насильственно распущена Токко. Подозреваемые включают редакторов журналов Chuo Koron, Kaizō и Nippon Hyoron. Похоже, что наши правоохранительные органы делают хорошую работу по защите души нашей нации от этой духовной угрозы."
 SEA_japan_tokko_arrest_events.5.a:0 "Больше инакомыслия подавлено"
 SEA_japan_tokko_arrest_events.6.t:0 "Инцидент в Накано Сейго"
 SEA_japan_tokko_arrest_events.6.desc:0 "Накано Сейго, основатель и лидер крайне правой политической партии Тохокай, был арестован. Это произошло после того, как партия якобы не смогла продолжить свою законную деятельность из-за репрессий, и, похоже, они планировали предпринять незаконные прямые действия из-за их предполагаемых «политических репрессий» со стороны нашего кабинета. Как бесчестно!"
 SEA_japan_tokko_arrest_events.6.a:0 "Как он смеет говорить плохо о нашем премьер-министре? Арестуйте его!"
 SEA_japan_tokko_arrest_events.7.t:0 "Инцидент с бамбуковым копьем"
 SEA_japan_tokko_arrest_events.7.desc:0 "Такэо Синмио, главный репортер Mainichi Shimbun, был арестован Токко за критику военных действий. Якобы в рамках нашего Межсервисного соперничества, она утверждала, что бамбуковое копье не разрежет его. «Результат Великой Восточно-Азиатской войны зависит от укрепления военно-морской и воздушной мощи, и мы не можем противостоять авиации противника бамбуковыми копьями», — сказал он. — Мы не можем напрямую критиковать наше руководство, нашу армию, одновременно продвигая идею о том, что только флот может привести нас к победе."
 SEA_japan_tokko_arrest_events.7.a:0 "Почему они не верят, что мы выиграем эту войну?"
 SEA_japan_tokko_arrest_events.8.t:0 "Инцидент в Гассакуше"
 SEA_japan_tokko_arrest_events.8.desc:0 "Многие сотрудники Южно-Маньчжурского следственного отдела железной дороги были дважды арестованы военной полицией Квантунской армии по подозрению в распространении антияпонской и коммунистической пропаганды.[JAP.GetNameDefCap] Он поручил нам надлежащим образом разобраться с ситуацией, но не будет вмешиваться напрямую. Как следует решать эту ситуацию?"
 SEA_japan_tokko_arrest_events.8.a:0 "Следуйте директиве и начинайте массовые аресты!"
 SEA_japan_tokko_arrest_events.8.b:0 "Подметать под коврик, это нам в любом случае выгодно."
 SEA_imperial_influence_events.1.t:0 "Внутренняя борьба за власть извергает"
 SEA_imperial_influence_events.1.desc:0 "Горькая борьба за власть вспыхнула среди различных внутренних фракций внутри страны. [ROOT.GetNameDef]Все они борются за [GetImperialInfluenceRulerTitle]Ухо, пытаясь покачиваться [GetImperialInfluenceGenderHimHer] к их делу. Вопрос, который волнует каждого: Какая фракция будет [GetImperialInfluenceRulerTitle] в конечном счете, и какой из них [GetImperialInfluenceGenderHeShe] пренебрежение?"
 SEA_imperial_influence_events.1.a:0 "Уволить армейскую фракцию"
 SEA_imperial_influence_events.1.b:0 "Отказаться от военно-морской фракции"
 SEA_imperial_influence_events.1.c:0 "Распустить фракцию Зайбацу"
 SEA_imperial_influence_events.1.d:0 "Отказаться от фракции гражданского правительства"
 SEA_imperial_influence_events.00.a:0 "[GetNameImperialInfluenceDemandOptions]"
 SEA_imperial_influence_demand_event_option_1:0 "Мы проверим нашу решимость"
 SEA_imperial_influence_demand_event_option_2:0 "Наш путь ясен"
 SEA_imperial_influence_demand_event_option_3:0 "Большие вещи часто имеют малые начала."
 SEA_imperial_influence_demand_event_option_4:0 "Нет ничего дороже, чем бесплатно"
 SEA_imperial_influence_demand_event_option_5:0 "Больше спешки, меньше скорости"
 SEA_imperial_influence_demand_event_option_6:0 "Делать или не делать, попытки нет"
 SEA_imperial_influence_demand_event_option_7:0 "Действия говорят громче, чем слова"
 SEA_imperial_influence_demand_event_option_8:0 "Судьба никого не ждет"
 SEA_imperial_influence_demand_event_option_9:0 "Решительность выдержит камень"
 SEA_imperial_influence_demand_event_option_10:0 "Отсроченный выбор — это сделанный выбор."
 SEA_imperial_influence_events.00.b:0 "[GetNameImperialInfluenceFailureOptions]"
 SEA_imperial_influence_failure_event_option_1:0 "Утрата учит, где гордость не может"
 SEA_imperial_influence_failure_event_option_2:0 "Даже Луна убывает, но возвращается."
 SEA_imperial_influence_failure_event_option_3:0 "Наша решимость остается твердой"
 SEA_imperial_influence_failure_event_option_4:0 "Позорный показ"
 SEA_imperial_influence_failure_event_option_5:0 "Делай или нет. Они этого не сделали."
 SEA_imperial_influence_failure_event_option_6:0 "Даже обезьяны падают с деревьев."
 SEA_imperial_influence_failure_event_option_7:0 "Пролитая вода не вернется в поднос"
 SEA_imperial_influence_failure_event_option_8:0 "Ветер завтрашнего дня будет дуть завтра"
 SEA_imperial_influence_failure_event_option_9:0 "Вставайте семь раз, а вставайте восемь раз."
 SEA_imperial_influence_failure_event_option_10:0 "Причина приносит результат"
 SEA_imperial_influence_events.100.t:0 "Армейская фракция теряет влияние"
 SEA_imperial_influence_events.100.desc:0 "Армейская фракция пыталась усилить свое влияние на [GetImperialInfluenceRulerTitle]Но из-за своих недостатков этого сделать не удалось. Из-за этого они теперь потеряли лицо и, следовательно, престиж, а это означает, что их влияние уменьшилось."
 SEA_imperial_influence_events.110.t:0 "Армейская фракция стремится расширить производство вооружений"
 SEA_imperial_influence_events.110.desc:0 "Армия выполнила их требования. Похоже, что они стремятся расширить свои производственные возможности и свое влияние на рынок. [GetImperialInfluenceRulerTitle]Мы требуем, чтобы мы построили больше военных заводов для увеличения нашей продукции. Кажется, они готовы проявить некоторое терпение, но не будут ждать вечно."
 SEA_imperial_influence_events.120.t:0 "Фракция армии требует политических назначений"
 SEA_imperial_influence_events.120.desc:0 "Армия выполнила их требования. Не имея центрального контроля и автономии, чтобы действовать самостоятельно, они хотят видеть нового начальника армии, назначенного на пост, который также будет служить для укрепления их влияния на власть. [GetImperialInfluenceRulerTitle]. Кажется, они готовы проявить некоторое терпение, но не будут ждать вечно."
 SEA_imperial_influence_events.130.t:0 "Армейская фракция хочет изменений в законе о призыве"
 SEA_imperial_influence_events.130.desc:0 "Армия выполнила их требования. Они хотят, чтобы мы увеличили нашу национальную воинскую повинность и направили вербовщиков в сельские деревни, чтобы привлечь больше молодых людей для предстоящих военных усилий. Несмотря на видимость простого укрепления наших вооруженных сил, они, по-видимому, также хотят усилить свой контроль и влияние над нашими вооруженными силами. [GetImperialInfluenceRulerTitle]. Кажется, они готовы проявить некоторое терпение, но не будут ждать вечно."
 SEA_imperial_influence_events.140.t:0 "Планы армейской фракции по расширению"
 SEA_imperial_influence_events.140.desc:0 "Армия выполнила их требования. Они хотят, чтобы мы увеличили количество полков в нашей армии и создали больше дивизий для помощи в предстоящих завоеваниях. Несмотря на видимость простого укрепления наших вооруженных сил, они, по-видимому, также хотят усилить свой контроль и влияние над нашими вооруженными силами. [GetImperialInfluenceRulerTitle]. Кажется, они готовы проявить некоторое терпение, но не будут ждать вечно."
 SEA_imperial_influence_events.150.t:0 "Армейская фракция настаивает на поддержке грузовиков"
 SEA_imperial_influence_events.150.desc:0 "Армия выполнила их требования. Похоже, что они стремятся расширить свои возможности по производству моторизованных транспортных средств и их влияние на производство автомобилей. [GetImperialInfluenceRulerTitle]Мы требуем, чтобы мы построили больше грузовиков, чтобы подпитывать их потребность в расширении. Кажется, они готовы проявить некоторое терпение, но не будут ждать вечно."
 SEA_imperial_influence_events.160.t:0 "Армейская фракция требует увеличения производства танков"
 SEA_imperial_influence_events.160.desc:0 "Армия выполнила их требования. Похоже, что они стремятся расширить свои возможности по производству танков и свое влияние на производство танков. [GetImperialInfluenceRulerTitle]Они требуют, чтобы мы строили больше резервуаров для удовлетворения их потребностей в расширении. Кажется, они готовы проявить некоторое терпение, но не будут ждать вечно."
 SEA_imperial_influence_events.161.t:0 "Армейская фракция требует увеличения производства артиллерии"
 SEA_imperial_influence_events.161.desc:0 "Армия выполнила их требования. Похоже, что они стремятся расширить свои возможности по производству артиллерии и свое влияние на мировое сообщество. [GetImperialInfluenceRulerTitle]Они требуют, чтобы мы строили больше артиллерии, чтобы подпитывать их потребности в расширении. Кажется, они готовы проявить некоторое терпение, но не будут ждать вечно."
 SEA_imperial_influence_events.200.t:0 "Фракция теряет влияние"
 SEA_imperial_influence_events.200.desc:0 "Военно-морская фракция попыталась усилить свое влияние на [GetImperialInfluenceRulerTitle]Но из-за своих недостатков этого сделать не удалось. Из-за этого они теперь потеряли лицо и, следовательно, престиж, а это означает, что их влияние уменьшилось."
 SEA_imperial_influence_events.210.t:0 "Фракция ВМС стремится расширить производство верфей"
 SEA_imperial_influence_events.210.desc:0 "Военно-морской флот выполнил их требования. Похоже, что они стремятся расширить свои производственные возможности и свое влияние на рынок. [GetImperialInfluenceRulerTitle]Мы требуем, чтобы мы построили больше военно-морских верфей для увеличения нашей продукции. Кажется, они готовы проявить некоторое терпение, но не будут ждать вечно."
 SEA_imperial_influence_events.220.t:0 "Фракция ВМС требует политических назначений"
 SEA_imperial_influence_events.220.desc:0 "Военно-морской флот выполнил их требования. Не имея центрального контроля и автономии, они хотят видеть нового начальника военно-морского флота, назначенного на этот пост, который также будет способствовать укреплению их влияния на военно-морской флот. [GetImperialInfluenceRulerTitle]. Кажется, они готовы проявить некоторое терпение, но не будут ждать вечно."
 SEA_imperial_influence_events.230.t:0 "Военно-морская фракция хочет изменить закон о воинской повинности"
 SEA_imperial_influence_events.230.desc:0 "Военно-морской флот выполнил их требования. Они хотят, чтобы мы увеличили нашу национальную воинскую повинность и послали посланников военно-морского флота в сельские деревни, чтобы набрать больше молодых людей для предстоящих военных усилий. Несмотря на видимость простого укрепления наших вооруженных сил, они, по-видимому, также хотят усилить свой контроль и влияние над нашими вооруженными силами. [GetImperialInfluenceRulerTitle]. Кажется, они готовы проявить некоторое терпение, но не будут ждать вечно."
 SEA_imperial_influence_events.240.t:0 "Военно-морская фракция требует увеличения производства авианосцев"
 SEA_imperial_influence_events.240.desc:0 "Военно-морской флот выполнил их требования. Похоже, что они стремятся расширить свой флот перевозчиков и свое влияние на развитие авианосцев. [GetImperialInfluenceRulerTitle]Мы требуем, чтобы мы заказали строительство большего количества перевозчиков для удовлетворения их потребностей в расширении. Кажется, они готовы проявить некоторое терпение, но не будут ждать вечно."
 SEA_imperial_influence_events.241.t:0 "Военно-морская фракция требует увеличения производства на море"
 SEA_imperial_influence_events.241.desc:0 "Военно-морской флот выполнил их требования. Похоже, что они стремятся расширить свои производственные возможности и свое влияние на рынок. [GetImperialInfluenceRulerTitle]Мы требуем, чтобы мы заказали строительство большего количества военно-морских верфей для удовлетворения их потребностей в расширении. Кажется, они готовы проявить некоторое терпение, но не будут ждать вечно."
 SEA_imperial_influence_events.242.t:0 "Военно-морская фракция требует увеличения производства линкоров"
 SEA_imperial_influence_events.242.desc:0 "Военно-морской флот выполнил их требования. Похоже, что они стремятся расширить свой флот линкоров и свое влияние на мир. [GetImperialInfluenceRulerTitle]Они требуют, чтобы мы заказали строительство большего количества линкоров для удовлетворения их потребностей в расширении. Кажется, они готовы проявить некоторое терпение, но не будут ждать вечно."
 SEA_imperial_influence_events.300.t:0 "Фракция Зайбацу теряет влияние"
 SEA_imperial_influence_events.300.desc:0 "Зайбацу пытались усилить свое влияние на [GetImperialInfluenceRulerTitle]Но из-за своих недостатков этого сделать не удалось. Из-за этого они теперь потеряли лицо и, следовательно, престиж, а это означает, что их влияние уменьшилось."
 SEA_imperial_influence_events.310.t:0 "Фракция Zaibatsu стремится расширить свою промышленную базу"
 SEA_imperial_influence_events.310.desc:0 "Лидеры Зайбатсу выполнили свои требования. Похоже, что они стремятся расширить свои холдинги и отрасли и свое влияние на экономику. [GetImperialInfluenceRulerTitle]Мы требуем, чтобы мы построили больше гражданских заводов для увеличения нашей промышленной базы. Кажется, они готовы проявить некоторое терпение, но не будут ждать вечно."
 SEA_imperial_influence_events.320.t:0 "Фракция Зайбацу требует политических назначений"
 SEA_imperial_influence_events.320.desc:0 "Лидеры Зайбатсу выполнили свои требования. Они хотят, чтобы по крайней мере один из их членов был помещен в [GetImperialInfluenceRulerTitle]Консультативный совет, чтобы они могли направлять индустриализацию и путь нации. Кажется, они готовы проявить некоторое терпение, но не будут ждать вечно."
 SEA_imperial_influence_events.330.t:0 "Фракция Зайбацу хочет изменить закон об экономике"
 SEA_imperial_influence_events.330.desc:0 "Лидеры Зайбатсу выполнили свои требования. Они хотят, чтобы мы скорректировали экономическую стратегию нашей страны и чтобы больше средств направлялось в промышленные конгломераты. Несмотря на видимость простого укрепления нашей экономики, они, по-видимому, также хотят усилить свой контроль и влияние на экономику. [GetImperialInfluenceRulerTitle]. Кажется, они готовы проявить некоторое терпение, но не будут ждать вечно."
 SEA_imperial_influence_events.340.t:0 "Фракция Zaibatsu требует нанять промышленную компанию"
 SEA_imperial_influence_events.340.desc:0 "Лидеры Зайбатсу выполнили свои требования. Похоже, они хотят, чтобы по крайней мере одна из их компаний была нанята для прямых контрактов. [GetImperialInfluenceRulerTitle]Для того, чтобы они могли направлять индустриализацию и путь нации. Кажется, они готовы проявить некоторое терпение, но не будут ждать вечно."
 SEA_imperial_influence_events.400.t:0 "Гражданское правительство теряет влияние"
 SEA_imperial_influence_events.400.desc:0 "Гражданское правительство пытается усилить свое влияние на [GetImperialInfluenceRulerTitle]Но из-за своих недостатков этого сделать не удалось. Из-за этого они теперь потеряли лицо и, следовательно, престиж, а это означает, что их влияние уменьшилось."
 SEA_imperial_influence_events.420.t:0 "Фракция гражданского правительства требует политических назначений"
 SEA_imperial_influence_events.420.desc:0 "Лидеры партии выполнили свои требования. Они хотят, чтобы по крайней мере один из их членов был помещен в [GetImperialInfluenceRulerTitle]Консультативный совет, чтобы они могли направлять политическое направление нации и направлять ее к светлому будущему. Кажется, они готовы проявить некоторое терпение, но не будут ждать вечно."
 SEA_imperial_influence_events.430.t:0 "Фракция гражданского правительства хочет изменений в торговом законодательстве"
 SEA_imperial_influence_events.430.desc:0 "Лидеры партии выполнили свои требования. Они хотят, чтобы мы скорректировали экономическую стратегию нашей страны, а инвестиционные и торговые стратегии были смещены в пользу интернационализма и улучшения отношений с нашими торговыми партнерами. Несмотря на видимость простого укрепления нашей экономики, они, по-видимому, также хотят усилить свой контроль и влияние на экономику. [GetImperialInfluenceRulerTitle]. Кажется, они готовы проявить некоторое терпение, но не будут ждать вечно."
 SEA_imperial_influence_events.440.t:0 "Фракция гражданского правительства стремится ограничить влияние армии."
 SEA_imperial_influence_events.440.desc:0 "Лидеры партии выполнили свои требования. Похоже, они расстроены растущей мощью и влиянием армии на мировое сообщество. [GetImperialInfluenceRulerTitle]И желать быстрых действий в ограничении их роста и власти. Кажется, они готовы проявить некоторое терпение, но не будут ждать вечно."
 SEA_imperial_influence_events.450.t:0 "Фракция гражданского правительства стремится ограничить влияние флота"
 SEA_imperial_influence_events.450.desc:0 "Лидеры партии выполнили свои требования. Похоже, они расстроены растущей мощью и влиянием военно-морского флота над США. [GetImperialInfluenceRulerTitle]И желать быстрых действий в ограничении их роста и власти. Кажется, они готовы проявить некоторое терпение, но не будут ждать вечно."
 SEA_imperial_influence_events.460.t:0 "Фракция гражданского правительства стремится ограничить влияние Зайбатса"
 SEA_imperial_influence_events.460.desc:0 "Лидеры партии выполнили свои требования. Кажется, они расстроены растущей властью и влиянием Зайбатса над миром. [GetImperialInfluenceRulerTitle]И желать быстрых действий в ограничении их роста и власти. Кажется, они готовы проявить некоторое терпение, но не будут ждать вечно."
 SEA_japan_air_accidents_events.01.t:0 "Трагическая смерть $JAP_isoroku_yamamoto$"
 SEA_japan_air_accidents_events.01.desc:0 "Адмирал Исороку Ямамото был сбит огнем противника сегодня. Группа из [USA.GetAdjective] Боевики перехватили его после перехвата наших разведывательных передач. Назвав свое возмутительное нападение \"Операцией мести\", они, очевидно, намерены послать сообщение. В то время как наш народ оплакивает потерю этого великого воина, мы не должны забывать о наших обязанностях по уничтожению этого бесчестного врага!"
 SEA_japan_air_accidents_events.01.a:0 "Сокрушительный удар..."
 SEA_japan_air_accidents_events.02.t:0 "Операция Месть предотвращена"
 SEA_japan_air_accidents_events.02.desc:0 "Адмирал Исороку Ямамото попал под огонь противника во время полета в транзите сегодня. Сумев связаться с военно-морскими ВВС в регионе и оставаясь в стороне от шквала, Ямамото сумел ускользнуть и успешно приземлить свой самолет. Адмирал получил высокую оценку за храбрость и спокойствие в такой жаркой ситуации."
 SEA_japan_air_accidents_events.02.a:0 "Его честь была поддержана"
 SEA_japan_news_events.01.t:0 "[JAP.GetLeader] Выступает против военного вмешательства"
 SEA_japan_news_events.01.desc:0 "\n В страстной речи, произнесенной [JAP.GetLeader]Он восклицает, что на этот раз военные зашли слишком далеко после недавней попытки государственного переворота, предпринятой фракцией Кодоха в армии. Если бесчисленных убийств и попыток вытеснения нашего правительства крайними элементами было недостаточно, они теперь также стремятся использовать недавний инцидент для укрепления своей собственной власти и отвоевать контроль над нашей страной у ее народа. Этого нельзя допустить!. \n\nКажется, конфликт может назревать в [JAP.GetNameDef]."
 SEA_japan_news_events.01.a:0 "Мы должны вернуться к путям эпохи Тайсё!"
 SEA_japan_news_events.01.b:0 "Похоже, у кого-то наконец-то появился позвоночник."
 SEA_japan_news_events.02.t:0 "Формирование Сферы совместного процветания Большой Восточной Азии"
 SEA_japan_news_events.02.desc:0 "\nС предлагаемыми целями обеспечения экономической самодостаточности и сотрудничества между государствами-членами, наряду с сопротивлением влиянию западного империализма и советского коммунизма, [JAP.GetLeader] Сегодня было объявлено об основании Dai Tōa Kyōeiken. Является ли это действительно целью союза, или просто еще одной тщательной уловкой со стороны правительства. [JAP.GetAdjective] Пропагандистская машина все еще на вершине сознания каждого."
 SEA_japan_news_events.02.a:0 "Мы принесем процветание всей Азии!"
 SEA_japan_news_events.02.b:0 "Очередная уловка пропагандистской машины"
 SEA_japan_news_events.03.t:0 "Падение Рангуна"
 SEA_japan_news_events.03.d:0 "Японские наступления продолжаются в Бирме, а недавно произошло падение Рангуна. Будучи столицей Британской Бирмы, этот город имеет огромное стратегическое значение, и его потеря может оказаться решающим фактором в продолжающейся бирманской кампании.\n\nСам колониальный губернатор, как сообщается, был захвачен японскими передовыми подразделениями, когда он контролировал передачу своих вещей из Дома губернатора в грузовой караван, но это еще не подтверждено."
 SEA_japan_news_events.03.a:0 "Очередная победа над империализмом!"
 SEA_china.1.t:0 "Государство [FROM.GetNameDefCap] ищет нашей поддержки"
 SEA_china.1.desc:0 "Мы получили запрос от [FROM.GetNameDef] Мы просим оказать материальную поддержку. Хотя [FROM.GetLeader] В прошлом мы делали сомнительные заявления о нас, это может стать возможностью связать иностранные интересы в регионе."
 SEA_china.1.a:0 "Мы их поддержим"
 SEA_china.1.b:0 "Это слишком рискованно."
 SEA_china.2.t:0 "[FROM.GetNameDefCap] Договорились поддержать нас"
 SEA_china.2.desc:0 "В момент ясности, [FROM.GetNameDef] Мы решили поддержать нас в нашей борьбе. У нас нет впечатления, что это акт доброты, а скорее проявление собственного интереса в том, чтобы заставить нас делать их грязную работу."
 SEA_china.2.a:0 "Это поможет нашим усилиям"
 SEA_china.3.t:0 "[FROM.GetNameDefCap] Отклонить наши запросы"
 SEA_china.3.desc:0 "Неудивительно, что наша просьба о поддержке была отклонена. [FROM.GetNameDef]. Хотя наши надежды никогда не были велики, мы ожидали, что они хотя бы признают угрозу, которую они представляют. [JAP.GetNameDef] Подарки для всей Азии. Но, очевидно, мы ошибались."
 SEA_china.3.a:0 "Чего можно было ожидать"
 SEA_china.4.t:0 "Государство [FROM.GetNameDefCap] ищет нашей поддержки"
 SEA_china.4.desc:0 "Было отправлено расследование из [FROM.GetLeader] над входом [FROM.GetNameDef]испрашивая финансовую и материальную помощь в конфликте против [JAP.GetNameDef]. Сообщение было получено не только по беспроводной связи или через посланника, но и через не меньшего персонажа. $CHI_soong_mei_ling$Который рисовал толпу во время путешествия через [ROOT.GetName]. Пока завязываешь [JAP.GetNameDef] Мы могли бы извлечь выгоду только из этого тура, мы также могли бы извлечь пользу из популярности этого тура."
 SEA_china.4.a:0 "Мы их поддержим"
 SEA_china.4.b:0 "Мы должны сначала позаботиться о собственной безопасности."
 SEA_china.4.tt:0 "увеличивает §YАртиллерийское оборудование§! Вознаграждение от §YПродемонстрировать нашу решимость§! от 100"
 SEA_china.5.t:0 "[FROM.GetNameDefCap] Договорились поддержать нас"
 SEA_china.5.desc:0 "Мы получили ответ на наш запрос и рады сообщить, что в ближайшее время нам будут предоставлены иностранные средства. Это должно стать большим благом для нашей промышленности и позволить нам значительно увеличить наши вооруженные силы, и, вполне возможно, помощь может быть позже расширена, чтобы включить материальные средства."
 SEA_china.5.a:0 "Путь к победе лежит голым"
 SEA_china.5.tt:0 "увеличивает §Y$CIC_BANK_HEADER$§! Вознаграждение от §YПродемонстрировать нашу решимость§! через §Y1000§!"
 SEA_china.6.t:0 "[FROM.GetNameDefCap] Отклонить наш запрос"
 SEA_china.6.desc:0 "Ответ на наши просьбы вернулся из [FROM.GetNameDef]Который решил нас бросить. Никакой поддержки не будет отправлено, и никакие средства не будут доступны. Мы стоим в одиночестве перед лицом агрессии, как это было много раз раньше. Мы победим, потому что если мы этого не сделаем, наше наследие будет забыто."
 SEA_china.6.a:0 "Боритесь за выживание страны!"
 SEA_china.7.t:0 "Приглашение от [FROM.GetName]"
 SEA_china.7.desc:0 "Центральное правительство [FROM.GetName] Продлил приглашение на [ROOT.GetName] присоединиться к их фракции. Они говорят о национальном единстве и необходимости противостоять иностранному посягательству как единому целому. Хотя идеологические разногласия сохраняются, перспектива сотрудничества перед лицом растущих угроз может потребовать рассмотрения."
 SEA_china.7.a:0 "Мы будем вместе противостоять нашим врагам."
 SEA_china.7.b:0 "Мы не будем торговать независимостью ради обещаний."
 SEA_china.8.t:0 "[FROM.GetName] Принимает приглашение"
 SEA_china.8.desc:0 "[FROM.GetLeader] Мы согласились с нашим предложением.[FROM.GetNameDefCap] Мы присоединимся к нашей фракции и будем стоять рядом с нами в борьбе за объединение нации и защиту ее от внешних угроз. Это знаменует собой значительный шаг к большему китайскому единству."
 SEA_china.8.a:0 "Вместе мы сильнее"
 SEA_china.9.t:0 "[FROM.GetName] Отклоняет предложение"
 SEA_china.9.desc:0 "[FROM.GetLeader] Он отказался присоединиться к нашей фракции, сославшись на необходимость сохранения региональной независимости и политической автономии. Несмотря на то, что это решение является печальным, оно отражает сохраняющиеся разногласия внутри страны."
 SEA_china.9.a:0 "Они пожалеют об этом вовремя."
 SEA_china.10.t:0 "[FROM.GetNameDefCap] Просьбы присоединиться к нам"
 SEA_china.10.desc:0 "Мы получили предложение от [FROM.GetNameDef] присоединяться [ROOT.GetFactionName] Вместе со всеми членами [FROM.GetFactionName]. Если бы мы согласились, то осталось бы на одного потенциального противника меньше, и наша собственная позиция укрепилась бы. Вопрос скорее в том, можно ли доверять их намерениям, чтобы они не пытались нас заменить."
 SEA_china.10.a:0 "Наша сила в цифрах"
 SEA_china.10.b:0 "Мы не можем принять это."
 SEA_china.11.t:0 "[FROM.GetNameDefCap] Поддержите нашу регистрацию"
 SEA_china.11.desc:0 "Мы получили ответ от лидера [FROM.GetFactionName]И эпоха взгляда внутрь на наш собственный уголок мира закончилась. Правительство [FROM.GetNameDef] Он приветствовал нас с распростертыми объятиями, и теперь мы можем занять свое место в мире на равных условиях."
 SEA_china.11.a:0 "Мы проходим этот путь вместе"
 SEA_china.12.t:0 "[FROM.GetNameDefCap] Отклонить наш запрос"
 SEA_china.12.desc:0 "Лидеры [FROM.GetFactionName] Мы отвергли наше предложение о объединении сил. Это была возможность принести мир и стабильность в мир, но, к сожалению, некоторые выступают против таких вещей."
 SEA_china.12.a:0 "Такой позор"
 SEA_china.12.b:0 "Мы идем своим собственным путем"
 SEA_china.13.t:0 "[CHI.GetLeader] Был убит"
 SEA_china.13.desc:0 "Наш славный лидер [CHI.GetLeader] Он был застрелен в своей машине, что стало катастрофическим концом враждебного столкновения на дороге. Нам сказали, что стрелок действовал сам по себе, но поскольку он был убит во время немедленного преследования, любые потенциальные заговорщики будут ходить на свободе. Партия начала искать замену."
 SEA_china.13.a:0 "Как трагично"
 SEA_china.14.t:0 "[FROM.GetName] Передают свой контроль на [JAP.GetNameDef]"
 SEA_china.14.desc:0 "В их отчаянии успокаиваться [JAP.GetNameDef]Центральное правительство предложило им господство над нами. Это позорный поступок. Мы не ожидали такой смелости от нового правительства."
 SEA_china.14.a:0 "Фейт-аккомплект..."
 SEA_china.14.b:0 "Мы не можем принять это, оружие!"
 SEA_china.15.t:0 "Контроль [FROM.GetNameDef] Он был дарован нам"
 SEA_china.15.desc:0 "Чтобы успокоить тех в наших вооруженных силах, кто настаивает на войне, [CHI.GetName] передал контроль над [FROM.GetName] Для нас. Похоже, в ближайшем будущем у нас не будет никаких конфликтов."
 SEA_china.15.a:0 "Очень хорошо"
 SEA_china.16.t:0 "[From.GetName] Дал нам права на стыковку"
 SEA_china.16.desc:0 "Чтобы успокоить нас, чтобы мы не нападали, [From.GetName] Мы получили права на стыковку. Квантунская армия решила пока отойти."
 SEA_china.16.a:0 "Превосходно!"
 SEA_china.17.t:0 "[From.GetName] Получил доступ к авиабазе"
 SEA_china.17.desc:0 "Чтобы успокоить нас, чтобы мы не нападали, [From.GetName] Мы получили доступ к авиабазе. Квантунская армия решила пока отойти."
 SEA_china.17.a:0 "Превосходно!"
 SEA_china.18.t:0 "[From.GetName] Дал нам права на ресурсы"
 SEA_china.18.desc:0 "Чтобы успокоить нас, чтобы мы не нападали, [From.GetName] Мы получили права на ресурсы. Квантунская армия решила пока отойти."
 SEA_china.18.a:0 "Превосходно!"
 SEA_china.19.t:0 "[CHI.GetName] Требует отмены договора о девяти державах"
 SEA_china.19.desc:0 "Официальное письмо от [CHI.GetNameDef] Сегодня мы обратились в министерство иностранных дел. Он утверждает, что Договор девяти держав сковывает кандалы. [CHI.GetAdjective] суверенитета и должны быть немедленно уничтожены.[CHI.GetLeader] Мы настаиваем на том, что пакт является пережитком принуждения и клянемся вернуть полную независимость с нашего согласия или без него."
 SEA_china.19.a:0 "Согласен с просьбой Пекина"
 SEA_china.19.b:0 "Отказываться от договора"
 SEA_china.19_tt:0 "§RМы присоединимся к войне Китая против Японии!§!"
 SEA_china.20.t:0 "[FROM.GetName] Отказ от договора о девяти державах"
 SEA_china.20.desc:0 "[FROM.GetNameDefCap] Он подтвердил свой немедленный выход из Договора о девяти державах. Они признают, что договор устарел и что [CHI.GetAdjective] Суверенитет должен оставаться необремененным."
 SEA_china.20.a:0 "Приветственная и решительная победа"
 SEA_china.21.t:0 "[FROM.GetName] Пекин побеждает"
 SEA_china.21.desc:0 "[FROM.GetNameDefCap] Он отказывается расторгнуть Договор о девяти державах, ссылаясь на хрупкий баланс сил в Тихом океане. Оскорбление возмутило бы любого смертного, но время империалистических марионеток закончилось. Мы должны решить, усилить ли давление или отступить с дипломатической арены."
 SEA_china.21.a:0 "Нажать на вопрос"
 SEA_china.21.b:0 "Отстань пока."
 SEA_china.22.t:0 "[CHI.GetName] Нажимает на проблему"
 SEA_china.22.desc:0 "Пекин удваивается. Кабинет министров обсуждает, как ответить на это растущее давление и следует ли нанести ответный удар эмбарго, которое может перевернуть торговлю, или полностью освободить страну. [CHI.GetName] от своих обязательств."
 SEA_china.22.a:0 "Ввести эмбарго на [CHI.GetName]"
 SEA_china.22.b:0 "Ничего не делать"
 SEA_china.23.t:0 "[FROM.GetName] Наложите на нас эмбарго"
 SEA_china.23.desc:0 "The [FROM.GetAdjective] Правительство объявило эмбарго против нас в качестве наказания за наш отказ от договора о девяти державах и за то, что они не могут позволить нам [FROM.GetNameDef] Теперь отвернитесь от каждого китайского грузового судна. Внутренняя пресса осуждает эту меру как экономическое удушение, последний вздох эпохи империализма."
 SEA_china.23.a:0 "Мы не будем запуганы"
 SEA_china.24.t:0 "[FROM.GetName] Отменяет Договор о девяти державах"
 SEA_china.24.desc:0 "Кабель из [FROM.GetNameDef] Нанкин, подтверждая свой выход из Договора девяти держав. Иностранные речные патрули готовятся к отплытию домой. [FROM.GetAdjective] Дипломаты признают, что соглашение больше не является обязательным для Китая. Толпы собираются перед Министерством иностранных дел, поскольку радио провозглашает конец еще одного неравного завета."
 SEA_china.24.a:0 "Победа национального суверенитета"
 SEA_china.25.t:0 "Китай требует специалистов по бронетехнике"
 SEA_china.25.desc:0 "[FROM.GetNameDefCap] Мы обратились к нам с просьбой, чтобы специалисты наших бронетанковых подразделений поддержали их переход к более современному стилю ведения войны. Мы могли бы отправить консультативную группу от одного из наших основных производителей или отклонить их запрос."
 SEA_china.25.a:0 "$morozov_design_bureau$"
 SEA_china.25.b:0 "$astrov_design_bureau$"
 SEA_china.25.c:0 "$okmo$"
 SEA_china.25.d:0 "Они не заслуживают помощи"
 SOV_accepted_Morozov:0 "[SOV.GetNameDefCap] Отправили команду из $morozov_design_bureau$."
 SOV_accepted_Astrov:0 "[SOV.GetNameDefCap] Отправили команду из $astrov_design_bureau$."
 SOV_accepted_OKMO:0 "[SOV.GetNameDefCap] Отправили команду из $okmo$."
 SEA_china.26.t:0 "[SOV.GetNameDefCap] Ответы"
 SEA_china.26.desc:0 "Теперь мы получили ответ от [SOV.GetNameDef] в котором они соглашаются направить нам группу экспертов. Помощь должна прибыть в ближайшее время, и когда она будет оказана, мы можем направить специалистов на работу по укреплению нашего танкового корпуса."
 SEA_china.26.a:0 "Мы движемся к победе"
 SEA_china.27.t:0 "[SOV.GetNameDefCap] Ответы"
 SEA_china.27.desc:0 "К сожалению [SOV.GetNameDef] Мы решили не посылать нам помощь, в которой мы нуждаемся. Хотя мы не знаем причины для отклонения этой незначительной просьбы, похоже, что мы должны найти альтернативные средства."
 SEA_china.27.a:0 "Они пожалеют об этом вовремя."
 SEA_china.28.t:0 "[FROM.GetName] Требует подчинения"
 SEA_china.28.desc:0 "Центральное правительство капитулировало перед [JAP.GetNameDef]Обещать не противодействовать его территориальной агрессии. Удар теперь падает на нас, с [JAP.GetAdjective] Требование нашей земли, стремление к аннексии дипломатическим принуждением."
 SEA_china.28.a:0 "У нас нет выбора."
 the_game_will_end_for_us:0 "§RИгра закончится для нас§!"
 SEA_china.28.b:0 "Никогда!"
 SEA_china_improvement.1.t:0 "Новый класс офицеров"
 SEA_china_improvement.1.desc:0 "Солнце светит, рубашки гладят и сапоги полируют. Солдаты стоят в аккуратных рядах, слушая [ROOT.GetLeader] И вот пришло время выступить с речью об их выпуске. Скоро выпускники будут на фронте, принося славу [ROOT.GetNameDef]."
 SEA_china_improvement.1.a:0 "Волонтеры идут к славе"
 SEA_china_improvement.2.t:0 "Выкорчевывание яда"
 SEA_china_improvement.2.desc:0 "Признавая разрушительное воздействие опиумной торговли на государственную власть и общественное доверие, мы должны начать долгосрочную кампанию по снижению влияния опиумных синдикатов. Чиновникам поручают более строгие проверки, административные перетасовки и кампании по информированию общественности, ни одна из которых не принесет результатов в одночасье. Тем не менее, каждый шаг ослабляет теневые сети, которые питаются [CHI.GetAdjective] уязвимости."
 SEA_china_improvement.2.a:0 "Пусть начнется долгая борьба"
 SEA_china_improvement.2_tt:0 "Негативный эффект от §YНезаконная торговля§! будет сокращаться каждые 6 месяцев."
 SEA_china_improvement.3.t:0 "Конец порока / The End of Vice"
 SEA_china_improvement.3.desc:0 "После многих лет упорных реформ, тихих чисток и неустанного надзора последние крупные опиумные сети были демонтированы. Впервые за десятилетия воля государства безраздельно царит по всей сельской местности. Циники бормочут о старых временах, но даже они должны признать, что воздух яснее."
 SEA_china_improvement.3.a:0 "Отличная работа"
 SEA_china_warlords.1.t:0 "[FROM.GetName] Требует нашего подчинения"
 SEA_china_warlords.1.desc:0 "Из Нанкина пришло сообщение, несущее безошибочную печать центрального правительства. За цветущим языком единства и национальной судьбы стоит требование — мы должны подчиниться. [FROM.GetLeader] и принять авторитет [FROM.GetNameDef] над нашим доменом. Нет места для переговоров, только послушание или последствия."
 SEA_china_warlords.1.a:0 "Пусть приходят и пробуют"
 SEA_china_warlords.1.b:0 "У нас нет другого выбора, кроме как повиноваться."
 SEA_china_warlords.1.tt:0 "§RМы станем предметом [FROM.GetName]§!"
 SEA_china_warlords.2.t:0 "[FROM.GetName] Склоняет голову"
 SEA_china_warlords.2.desc:0 "[FROM.GetName] Мы приняли наш ультиматум. Их лидеры говорят о национальном единстве и исторической судьбе, но смысл ясен — они теперь признают верховенство национального единства. [ROOT.GetNameDef].\nХотя их подчинение может быть неохотным, оно избавляет Китай от дальнейшего разделения и кровопролития."
 SEA_china_warlords.2.a:0 "Разбитое солнце собирает свой свет"
 SEA_china_warlords.3.t:0 "[FROM.GetName] отказываться"
 SEA_china_warlords.3.desc:0 "Ультиматум был отклонен. В наглом акте неповиновения, [FROM.GetLeader] Он ясно дал понять, что его народ не подчинится. Когда наши посланники будут уволены, дипломатия расчистит путь для войны."
 SEA_china_warlords.3.a:0 "Тогда они будут принесены в пяту."
 SEA_china_warlords.4.t:0 "[FROM.GetNameDef] Требует полной аннексии"
 SEA_china_warlords.4.desc:0 "По мере стабилизации ситуации и подтверждения центральной власти, [FROM.GetNameDef] Это означает отмену последних остатков автономии полевых командиров.[THIS.GetNameDefCap] Теперь ожидается, что все оставшиеся административный и военный контроль будет передан центральному правительству, завершив процесс объединения."
 SEA_china_warlords.4.a:0 "Нам нужно склонить головы"
 SEA_china_warlords.4.b:0 "Никогда!"
 SEA_china_warlords.5.t:0 "[FROM.GetNameDefCap] Принять интеграцию"
 SEA_china_warlords.5.desc:0 "Признавая необходимость национального единства, [FROM.GetLeader] согласился распустить [FROM.GetNameDef] и передать все полномочия на [ROOT.GetNameDef]. Их вооруженные силы поглощаются в структуру национального командования, а их административные органы демонтируются."
 SEA_china_warlords.5.a:0 "Единство преобладает"
 SEA_china_warlords.6.t:0 "[FROM.GetNameDefCap] Отказ от интеграции"
 SEA_china_warlords.6.desc:0 "В открытом неповиновении центральному правительству, [FROM.GetLeader] Он отказался от ультиматума.[FROM.GetNameDefCap] Они остаются номинальным субъектом, но их действия допускают стремление к независимости. Это неподчинение не может остаться без ответа."
 SEA_china_warlords.6.a:0 "Они пожалеют об этом"
 SEA_china_democratic.1.t:0 "Президент Республики"
 SEA_china_democratic.1.desc:0 "Наконец-то пришло время восстановить свободные выборы в Китае и восстановить республику, которая была раздавлена как внешними, так и внутренними силами. Остается вопрос, кто возьмется за мантию доктора. Сун, и стать первым президентом этой новой республики?"
 SEA_china_democratic.1.a:0 "У КПРФ есть хорошие кандидаты"
 SEA_china_democratic.1.b:0 "Карсун Чанг показал свою ценность"
 SEA_china_democratic.1.c:0 "Сун Чин-лин - идеальный лидер"
 SEA_china_democratic.1.d:0 "Цзэн Ци должен получить эту возможность."
 SEA_china_democratic.2.t:0 "[FROM.GetNameDefCap] Приглашаем вас в свой союз"
 SEA_china_democratic.2.desc:0 "Недавно в нашу столицу прибыла делегация издалека, требующая аудиенции у [ROOT.GetLeader]. Они утверждают, что от [FROM.GetNameDef]Мы стремимся к союзу между нашими народами. Мы согласны?"
 SEA_china_democratic.2.a:0 "Вместе мы будем сильнее"
 SEA_china_democratic.2.b:0 "Это противоречит нашим принципам нейтралитета."
 SEA_china_democratic.3.t:0 "[FROM.GetNameDefCap] Примите наше приглашение"
 SEA_china_democratic.3.desc:0 "[FROM.GetLeader] Он любезно принял наше предложение о формализовании альянса между нашими странами и уже начал инициативы по интеграции в нашу сферу. Сегодня день для празднования!"
 SEA_china_democratic.3.a:0 "Они разделяют наше видение будущего."
 SEA_china_democratic.4.t:0 "[FROM.GetNameDefCap] Отказывается присоединяться к нам"
 SEA_china_democratic.4.desc:0 "[FROM.GetLeader] Мы приняли грубое решение отвергнуть наше предложение о союзе между нашими странами, заявив, что это будет противоречить их принципу нейтралитета. Мы можем только представить себе масштабы коррупции, которая привела к этому ошибочному решению."
 SEA_china_democratic.4.a:0 "Это их потеря."
 SEA_china_democratic.5.t:0 "Гражданская война в [ROOT.GetNameDef]"
 SEA_china_democratic.5.desc:0 "После долгого периода роста республиканских настроений, кажется, что [ROOT.GetAdjective] Демократы устали ждать мирной смены правительства. После интенсивных дискуссий кажется, что дипломатия потерпела неудачу, и вспыхнул вооруженный конфликт."
 SEA_china_democratic.5.a:0 "За демократию!"
 SEA_china_democratic.5.b:0 "Мы должны остановить эту глупость!"
 SEA_china_democratic.6.t:0 "[FROM.GetNameDefCap] Раздражает республиканские настроения"
 SEA_china_democratic.6.desc:0 "Мы обратили внимание, что в настоящее время [FROM.GetAdjective] Ячейки, действующие в нашей стране, распространяют республиканские настроения. Хотя это кажется достаточно безобидным, некоторые пропагандистские материалы носят скорее революционный характер. Сообщения о том, что рабочих поощряют к организации и объединению, становятся все более частыми, и, судя по недавней истории, мы не можем быть уверены, что это не сложная уловка со стороны правительства. [FROM.GetAdjective] В конечном счете, мы интегрируемся."
 SEA_china_democratic.6.a:0 "Позвольте им продолжить"
 SEA_china_democratic.6.b:0 "Заткнись на этих наглых агитаторов!"
 SEA_china_democratic.7.t:0 "[CHI.GetNameDefCap] Мы требуем освободить азиатские колонии."
 SEA_china_democratic.7.desc:0 "Мы получили довольно сильно сформулированную записку от [CHI.GetNameDef]. Они требуют, чтобы мы освободили [CHI_country_to_be_liberated.GetNameDef] и возвратить территории их законным владельцам."
 SEA_china_democratic.7.a:0 "В любом случае, мы не используем эти колонии."
 SEA_china_democratic.7.b:0 "Их законными владельцами были бы мы."
 SEA_china_democratic.7.b.tt:0 "§RЭто даст им цель войны против нас!§!"
 SEA_china_democratic.8.t:0 "[FROM.GetNameDefCap] Согласен освободить [CHI_country_to_be_liberated.GetNameDef]"
 SEA_china_democratic.8.desc:0 "Ответ на наши требования о [FROM.GetNameDef] освобождать [CHI_country_to_be_liberated.GetNameDef] Только что приехал. Возможно, немного удивительно, что они согласились отпустить его. [CHI_country_to_be_liberated.GetNameDef] как независимое государство."
 SEA_china_democratic.8.a:0 "Наиболее удовлетворительный результат"
 SEA_china_democratic.9.t:0 "[FROM.GetNameDefCap] Отказ от освобождения колоний"
 SEA_china_democratic.9.desc:0 "Ответ на наши требования о [FROM.GetNameDef] освобождать [CHI_country_to_be_liberated.GetNameDef] Только что приехал. Заявляя, что их иностранные дела не являются нашим делом, они отвергают идею предоставления колониям их законной независимости."
 SEA_china_democratic.9.a:0 "Мы должны освободить их, независимо от стоимости."
 SEA_china_democratic.10.t:0 "[FROM.GetNameDefCap] Хочет, чтобы мы присоединились к их войне."
 SEA_china_democratic.10.desc:0 "Недавно в нашу столицу прибыла делегация издалека, которая ищет аудиенцию у [ROOT.GetLeader]. Они утверждают, что от [FROM.GetNameDef]Желаю, чтобы мы присоединились к их войне против [JAP.GetNameDef]. Мы согласны?"
 SEA_china_democratic.10.a:0 "Вместе к победе!"
 SEA_china_democratic.10.b:0 "Это противоречит нашим принципам нейтралитета."
 SEA_china_democratic.11.t:0 "[FROM.GetNameDefCap] Примите наш смиренный запрос"
 SEA_china_democratic.11.desc:0 "[FROM.GetLeader] Мы приняли наше предложение официально оформить анти-[JAP.GetAdjective] Союз между нашими народами уже начал принимать меры против восточной угрозы. Сегодня день для празднования!"
 SEA_china_democratic.11.a:0 "Мы стоим в оцепенении перед их народом"
 SEA_china_democratic.12.t:0 "[FROM.GetNameDefCap] Отказывается присоединяться к нам"
 SEA_china_democratic.12.desc:0 "[FROM.GetLeader] Мы приняли грубое решение отклонить наше предложение анти-[JAP.GetAdjective] Альянс между нашими странами, заявляя, что это пойдет вразрез с их принципом нейтралитета. Мы можем только представить себе масштабы коррупции, которая привела к этому ошибочному решению."
 SEA_china_democratic.12.a:0 "Ужасные новости..."
 SEA_china_democratic.13.t:0 "Государство [FROM.GetNameDefCap] ищет нашей поддержки"
 SEA_china_democratic.13.desc:0 "Был получен запрос от [FROM.GetLeader] над входом [FROM.GetNameDef]Получение финансовой поддержки для своей страны. Они сплотили многих [FROM.GetAdjective] Экспаты, живущие в пределах наших границ, поддерживают свое дело, и народная поддержка выросла в поддержку этого. Должны ли мы принять их просьбу?"
 SEA_china_democratic.13.a:0 "Мы их поддержим"
 SEA_china_democratic.13.b:0 "Им придется следить за собственной экономикой."
 SEA_china_democratic.14.t:0 "[FROM.GetNameDefCap] Договорились поддержать нас"
 SEA_china_democratic.14.desc:0 "Мы получили ответ на наш запрос и рады сообщить, что в ближайшее время нам будут предоставлены иностранные средства. Это должно быть благом для нашей экономики и позволить нам значительно развивать наши отрасли промышленности и вооруженные силы."
 SEA_china_democratic.14.a:0 "Путь к победе лежит голым"
 SEA_china_democratic.15.t:0 "[FROM.GetNameDefCap] Отклонить наш запрос"
 SEA_china_democratic.15.desc:0 "Ответ на наши просьбы вернулся из [FROM.GetNameDef]Который решил нас бросить. Никакой поддержки не будет отправлено, и никакие средства не будут доступны. Мы остаемся в одиночестве, несмотря на поддержку народа. [FROM.GetNameDef]. Мы победим, потому что если мы этого не сделаем, наше наследие будет забыто."
 SEA_china_democratic.15.a:0 "Мы были введены в заблуждение..."
 SEA_china_democratic.16.t:0 "[FROM.GetNameDefCap] Инвестиции в нашу экономику"
 SEA_china_democratic.16.desc:0 "Промышленники, принадлежащие [FROM.GetNameDef] Мы начали развивать местные отрасли и создавать новые корпорации в пределах наших границ. Это должно приблизить нас к процветанию."
 SEA_china_democratic.16.a:0 "Мы благодарим их за эти инвестиции."
 SEA_china_democratic.16.b:0 "Нам не нужна их помощь!"
 SEA_china_democratic.17.t:0 "[FROM.GetName] Требует нашего представления"
 SEA_china_democratic.17.desc:0 "Из Нанкина пришло сообщение, несущее безошибочную печать центрального правительства. За цветущим языком единства и национальной судьбы стоит требование — мы должны подчиниться. [CHI.GetLeader] и принять авторитет [CHI.GetNameDef] над нашим доменом. Нет места для переговоров, только послушание или последствия."
 SEA_china_democratic.17.a:0 "Мы никогда не подчинимся!"
 SEA_china_democratic.17.b:0 "Это лучшее для нашего народа"
 SEA_china_democratic.17.tt:0 "§RМы станем предметом [FROM.GetName]§!"
 SEA_china_democratic.18.t:0 "[FROM.GetName] Возвращение в Республику"
 SEA_china_democratic.18.desc:0 "[FROM.GetName] Мы приняли наш ультиматум. Их лидеры говорят о национальном единстве и исторической судьбе, но смысл ясен — они теперь признают верховенство государства. [CHI.GetNameDef].\nХотя их подчинение может быть неохотным, оно избавляет Китай от дальнейшего разделения и кровопролития."
 SEA_china_democratic.18.a:0 "Разбитое солнце собирает свой свет"
 SEA_china_democratic.19.t:0 "[FROM.GetName] Отказаться от подачи"
 SEA_china_democratic.19.desc:0 "Ультиматум был отклонен. В наглом акте неповиновения, [FROM.GetLeader] Он ясно дал понять, что его народ не подчинится. Когда наши посланники будут уволены, дипломатия расчистит путь для войны."
 SEA_china_democratic.19.a:0 "Тогда они будут принесены в пяту."
 SEA_china_democratic.20.t:0 "[FROM.GetNameDefCap] Требует применения Mínquán!"
 SEA_china_democratic.20.desc:0 "[FROM.GetLeader], президент [FROM.GetNameDef]Мы получили официальное требование начать реализацию принципа Минкуана на нашей управляемой территории. Это должно приблизить нас к Республике и помочь нашему развитию."
 SEA_china_democratic.20.a:0 "Мы будем повиноваться"
 SEA_china_democratic.20.b:0 "В этом есть что-то подозрительное!"
 PRC_gains_more_faction_inluence_tt:0 "[PRC.GetName] Больше влияния фракции"
 SEA_PRC_request_aid.1.t:0 "[FROM.GetName] Запросить оружие"
 SEA_PRC_request_aid.1.desc:0 "Благодаря нашей частой поддержке [FROM.GetNameDef] В прошлом они вновь просили нас предоставить им оборудование. Этот запрос может быть связан с недавно завершившимся «Длинным маршем», который стоил им больших потерь в живой силе и технике."
 SEA_PRC_request_aid.1.a:0 "Отправьте им то, что мы можем сэкономить"
 SEA_PRC_request_aid.1.b:0 "Мы ничего не можем пощадить"
 SEA_PRC_request_aid.2.t:0 "[FROM.GetName] Посылает помощь"
 SEA_PRC_request_aid.2.desc:0 "[FROM.GetNameDefCap] Мы согласились отправить запрошенное нами оборудование. Эта крупная отгрузка позволит нам выставить несколько новых подразделений, а также предоставит нам специализированное оборудование, которое позволит сформировать вспомогательные компании."
 SEA_PRC_request_aid.2.a:0 "Отлично, мы будем уверены, что использовать его хорошо."
 SEA_PRC_request_aid.3.t:0 "[FROM.GetName] Отказывается посылать помощь"
 SEA_PRC_request_aid.3.desc:0 "Наша просьба о помощи от [FROM.GetNameDef] было отвергнуто, с [FROM.GetAdjective] Чиновники указывают, что [FROM.GetNameDef] У него мало оборудования, которое можно было бы сэкономить после недавней реорганизации."
 SEA_PRC_request_aid.3.a:0 "Придется искать другой источник."
 SEA_PRC_request_aid.4.t:0 "[FROM.GetName] запрашивает танки"
 SEA_PRC_request_aid.4.desc:0 "Как [FROM.GetNameDef] Не хватает промышленного потенциала и опыта для создания боевых бронированных сил. [FROM.GetLeader] Мы направили запрос на нашу помощь.[FROM.GetNameDefCap] В частности, мы просим наши средние танки Т-34, ссылаясь на их превосходный баланс огневой мощи, защиты и мобильности. Как мы должны реагировать?"
 SEA_PRC_request_aid.4.a:0 "Мы можем сэкономить много"
 SEA_PRC_request_aid.4.b:0 "Мы можем сэкономить немного."
 SEA_PRC_request_aid.4.c:0 "По крайней мере, мы можем помочь их построить."
 SEA_PRC_request_aid.4.e:0 "отклонить [FROM.GetNameDef]просьба"
 SEA_PRC_request_aid.4.a.tt:0 "Мы согласимся отправить §R250 танков Т-34§! то §Y[FROM.GetName]§!"
 SEA_PRC_request_aid.4.b.tt:0 "Мы согласимся отправить §R50 танков Т-34§! то §Y[FROM.GetName]§!"
 SEA_PRC_request_aid.4.c.tt:0 "Мы согласимся производить §R150 танков Т-34§! для §Y[FROM.GetName]§!"
 SEA_PRC_request_aid.31.t:0 "[FROM.GetName] запрашивает танки"
 SEA_PRC_request_aid.31.desc:0 "Как [FROM.GetNameDef] Не хватает промышленного потенциала и опыта для создания боевых бронированных сил. [FROM.GetLeader] Мы направили запрос на нашу помощь.[FROM.GetNameDefCap] Мы специально просим наши легкие танки БТ-7, ссылаясь на их отличную скорость по пересеченной местности. Как мы должны реагировать?"
 SEA_PRC_request_aid.31.a:0 "Мы можем сэкономить много"
 SEA_PRC_request_aid.31.b:0 "Мы можем сэкономить немного."
 SEA_PRC_request_aid.31.c:0 "По крайней мере, мы можем помочь их построить."
 SEA_PRC_request_aid.31.e:0 "отклонить [FROM.GetNameDef]просьба"
 SEA_PRC_request_aid.31.a.tt:0 "Мы согласимся отправить §R350 танков БТ-7§! то §Y[FROM.GetName]§!"
 SEA_PRC_request_aid.31.b.tt:0 "Мы согласимся отправить §R100 танков БТ-7§! то §Y[FROM.GetName]§!"
 SEA_PRC_request_aid.31.c.tt:0 "Мы согласимся производить §R150 танков БТ-7§! для §Y[FROM.GetName]§!"
 SEA_PRC_request_aid.32.t:0 "[FROM.GetName] Посылает танки"
 SEA_PRC_request_aid.32.desc:0 "Отвечая на наш запрос о танках БТ-7, [FROM.GetName] Мы договорились отправить нам большое количество — не менее 350 (в основном) новых БТ-7. Наши генералы составили план наилучшего их развертывания, в том числе наметили графики подготовки новобранцев."
 SEA_PRC_request_aid.32.a:0 "Начало чего-то великого"
 SEA_PRC_request_aid.33.t:0 "[FROM.GetName] Посылает танки"
 SEA_PRC_request_aid.33.desc:0 "Отвечая на наш запрос о танках БТ-7, [FROM.GetName] Он согласился отправить только сумму токена. Недостаточно полностью оснастить танковую дивизию, но достаточно, чтобы мы начали. Мы можем использовать 100 машин для обучения наших экипажей, в то время как мы ищем другие способы закупить современные танки."
 SEA_PRC_request_aid.33.a:0 "Может быть больше, но лучше, чем ничего."
 SEA_PRC_request_aid.34.t:0 "[FROM.GetName] Будут производить танки"
 SEA_PRC_request_aid.34.desc:0 "Отвечая на наш запрос о танках БТ-7, [FROM.GetName] Мы договорились построить 150 БТ-7 в ближайшие месяцы и отправить их нам, когда они будут готовы. Это займет некоторое время, но эта мера станет хорошим началом для наших стремлений создать современные вооруженные силы."
 SEA_PRC_request_aid.34.a:0 "Превосходно! Мы будем использовать их, когда они появятся."
 SEA_PRC_request_aid.35.t:0 "Построенные танки из [FROM.FROM.GetName] Прибыли ли вы"
 SEA_PRC_request_aid.35.desc:0 "Посылка прибыла [ROOT.Capital.GetName] из [SOV.GetNameDef] Включая 150 новых танков БТ-7. Среди тех, кто получил груз, были представители правительства. [ROOT.GetName], а также руководящие офицеры Сухопутных войск Народно-освободительной армии. Осматривая танки, свежевыкрашенные символом ПЛАГФ, офицеры стремились развернуть их — после периода обучения и ознакомления экипажей танков."
 SEA_PRC_request_aid.35.a:0 "Это отличная новость, мы будем использовать их с пользой!"
 SEA_PRC_request_aid.5.t:0 "[FROM.GetName] Посылает танки"
 SEA_PRC_request_aid.5.desc:0 "Отвечая на нашу просьбу о танках Т-34, [FROM.GetName] Мы договорились отправить нам большое количество — не менее 250 (в основном) новых Т-34. Наши генералы составили план наилучшего развертывания этих танков, в том числе наметили график обучения вновь назначенных экипажей."
 SEA_PRC_request_aid.5.a:0 "Начало чего-то великого"
 SEA_PRC_request_aid.6.t:0 "[FROM.GetName] Посылает танки"
 SEA_PRC_request_aid.6.desc:0 "Отвечая на нашу просьбу о танках Т-34, [FROM.GetName] Мы согласились отправить нам только символическую сумму. Недостаточно полностью оснастить танковую дивизию, но достаточно, чтобы мы начали. Мы можем использовать 50 машин для обучения наших танковых экипажей, в то время как мы ищем другие способы приобретения современных танков."
 SEA_PRC_request_aid.6.a:0 "Может быть больше, но лучше, чем ничего."
 SEA_PRC_request_aid.7.t:0 "[FROM.GetName] Будут производить танки"
 SEA_PRC_request_aid.7.desc:0 "Отвечая на нашу просьбу о танках Т-34, [FROM.GetName] Мы договорились построить 150 Т-34 в течение ближайших месяцев и отправить их нам, когда они будут готовы. Это займет некоторое время, но эта мера станет хорошим началом для наших стремлений создать современную бронетанковую силу."
 SEA_PRC_request_aid.7.a:0 "Превосходно! Мы будем использовать их, когда они появятся."
 SEA_PRC_request_aid.8.t:0 "[FROM.GetName] Отклонить нашу просьбу о танках"
 SEA_PRC_request_aid.8.desc:0 "[FROM.GetName] Мы отклонили нашу просьбу о танках, ссылаясь на то, что их собственные непосредственные потребности не позволяют им щадить любые активные или резервные транспортные средства. Несмотря на несчастье, [FROM.GetName] Пришли нам несколько учебных пособий. Так что это всегда так."
 SEA_PRC_request_aid.8.a:0 "Какой позор!"
 SEA_PRC_request_aid.21.t:0 "Построенные танки из [FROM.FROM.GetName] Прибыли ли вы"
 SEA_PRC_request_aid.21.desc:0 "Посылка прибыла [ROOT.Capital.GetName] из [SOV.GetNameDef] Включая 150 новых танков Т-34. Среди тех, кто получил груз, были представители правительства. [ROOT.GetName] А также руководящие офицеры Сухопутных войск Народно-освободительной армии. Осматривая танки, окрашенные символом ПЛАГФ, офицеры стремились развернуть их — после периода обучения и ознакомления экипажей танков."
 SEA_PRC_request_aid.21.a:0 "Это отличная новость, мы будем использовать их с пользой!"
 SEA_PRC_request_aid.9.t:0 "[FROM.GetName] Мы хотим подписать соглашение о технологическом сотрудничестве."
 SEA_PRC_request_aid.9.desc:0 "Мы получили телеграмму от [FROM.GetLeader]Запросить соглашение о технологическом сотрудничестве. Это соглашение будет способствовать «товарищескому способу распространения средств революции через знание и улучшение человечества»."
 SEA_PRC_request_aid.9.a:0 "Согласитесь помочь в начинании"
 SEA_PRC_request_aid.9.b:0 "У нас нет на это времени."
 SEA_PRC_request_aid.10.t:0 "[FROM.GetName] Объявлено о подписании Соглашения о технологическом сотрудничестве"
 SEA_PRC_request_aid.10.desc:0 "[FROM.GetNameDefCap] Мы договорились о подписании Соглашения о технологическом сотрудничестве, которое значительно увеличит наши возможности по развитию страны."
 SEA_PRC_request_aid.10.a:0 "Превосходно!"
 SEA_PRC_request_aid.11.t:0 "[FROM.GetName] Отклоняет Соглашение о технологическом сотрудничестве"
 SEA_PRC_request_aid.11.desc:0 "[FROM.GetNameDefCap] Отказался от подписания Соглашения о технологическом сотрудничестве, сославшись на необходимость приоритизации внутренних требований. Несмотря на то, что они симпатизировали нашему делу, они не могли щадить никаких ресурсов для этого начинания."
 SEA_PRC_request_aid.11.a:0 "Какой позор!"
 SEA_PRC_faction_events.1.t:0 "[FROM.GetNameDefCap] Спрос [1032.GetName]"
 SEA_PRC_faction_events.1.desc:0 "[FROM.GetLeader] Он послал посланника к [ROOT.GetLeader] Чтобы оценить нашу заинтересованность в разделении [XIC.GetName] территории между нами."
 SEA_PRC_faction_events.1.a:0 "Эта сделка больше благоприятствует нам"
 SEA_PRC_faction_events.1.b:0 "Об этом не может быть и речи!"
 SEA_PRC_faction_events.2.t:0 "Предстоящее вторжение"
 SEA_PRC_faction_events.2.desc:0 "Казалось бы, как будто [FROM.GetLeader] из [FROM.GetName] и [PRC.GetLeader] из [PRC.GetNameDef] Они объединились, чтобы вырезать нашу территорию между собой, как змеи, которыми они являются. Их армии готовы пересечь наши границы в любой момент, чтобы мы не пресекли их трусливые попытки. Вопрос в том, сможем ли мы долго сдерживать их обоих?"
 SEA_PRC_faction_events.2.a:0 "Бесполезно сопротивляться..."
 SEA_PRC_faction_events.2.b:0 "Посмотрим, как они попробуют!"
 SEA_PRC_faction_events.3.t:0 "[FROM.GetLeader] Отказаться от нашего предложения"
 SEA_PRC_faction_events.3.desc:0 "Казалось бы, как будто [FROM.GetLeader] из [FROM.GetName] Они так же глупы, как и они, отвернувшись от наших посланников с пустыми руками. Наше великодушное предложение разделить слабого соседа между нами обоими осталось неуслышанным."
 SEA_PRC_faction_events.3.a:0 "Это всего лишь временная неудача!"
 SEA_PRC_faction_events.4.t:0 "[FROM.GetNameDefCap] Подведены под наши требования"
 SEA_PRC_faction_events.4.desc:0 "Совокупная угроза [CHI.GetNameDef] и [PRC.GetNameDef] Казалось бы, слишком много для [FROM.GetLeader]кто уступил нашим требованиям и согласился позволить нашим войскам войти в [FROM.GetNameDef] без сопротивления. В конце концов, это может сделать правильно..."
 SEA_PRC_faction_events.4.a:0 "Вещи смотрят вверх!"
 SEA_PRC_faction_events.5.t:0 "[FROM.GetNameDefCap] Отказ от наших требований"
 SEA_PRC_faction_events.5.desc:0 "Казалось бы, как будто [FROM.GetLeader] из [FROM.GetName] Он сделан из более стернистого материала, чем предполагалось вначале, отказавшись поддаваться объединенной угрозе армий. [CHI.GetNameDef] и [PRC.GetNameDef]. Это неповиновение так же восхитительно, как и глупо. Вооруженные силы [FROM.GetNameDef] Скоро мы рассеемся, прежде чем сможем!"
 SEA_PRC_faction_events.5.a:0 "Они пожалеют об этом."
 SEA_PRC_faction_events.10.t:0 "[FROM.GetNameDefCap] Предлагает альянс"
 SEA_PRC_faction_events.10.desc:0 "Сообщение от [FROM.GetLeader] Он дошел до нас через несколько закрытых каналов, и кажется, что изоляция в горных деревнях вызвала изменение сердца в горах. [FROM.GetNameDef] Лидер. Сейчас он ищет нашей помощи в объединении Китая и защите его народа от внешних угроз. Это интригующее предложение, но можно ли доверять коммунистам?"
 SEA_PRC_faction_events.10.a:0 "Проблемы Китая больше, чем наша вражда"
 SEA_PRC_faction_events.10.b:0 "Мы никогда не подчинимся их руководству!"
 SEA_PRC_faction_events.11.t:0 "Глупец [FROM.GetLeader] Отклонить наше предложение"
 SEA_PRC_faction_events.11.desc:0 "Лидер [FROM.GetNameDef] В очередной раз показал миру, какой дурак [FROM.GetLeader.GetSheHe] Мы отвергаем наше предложение создать единый фронт для защиты и объединения Китая. Это означает, что задача по защите нашего народа лежит исключительно на нас. Мы докажем миру, что мы более чем готовы к этой задаче!"
 SEA_PRC_faction_events.11.a:0 "Мы будем защищать весь Китай."
 SEA_PRC_faction_events.20.t:0 "[FROM.GetLeader] Вопросы [?PRC_faction_leader_var.GetName]Лидерство"
 SEA_PRC_faction_events.20.desc:0 "[FROM.GetLeader] Он открыто поставил под сомнение военные действия и [?PRC_faction_leader_var.GetLeader]Лидерство на недавнем саммите с [ROOT.GetFactionName] членов. Он раскритиковал то, как велась война и как она велась, обвинив [?PRC_faction_leader_var.GetName] умышленное затягивание конфликта. Это может быть игра от [FROM.GetLeader] Чтобы получить больше рычагов влияния в альянсе, но может быть, есть доля правды в его обвинениях?"
 SEA_PRC_faction_events.20.a:0 "Человек говорит правду!"
 SEA_PRC_faction_events.20.b:0 "Нелепость!"
 SEA_PRC_faction_events.21.t:0 "[FROM.GetNameDefCap] Предлагает нам свою поддержку"
 SEA_PRC_faction_events.21.desc:0 "По-видимому, недавняя речь, произнесенная [ROOT.GetLeader] где он критиковал [?PRC_faction_leader_var.GetNameDef]Лидерство над [ROOT.GetFactionName]Он нанес удар в струну с [FROM.GetLeader] из [FROM.GetName]. [FROM.GetLeader] Мы гарантируем, что у нас будет поддержка [FROM.GetName]."
 SEA_PRC_faction_events.21.a:0 "Явный признак мудрости"
 SEA_PRC_faction_events.22.t:0 "[FROM.GetLeader] Ругательства [ROOT.GetLeader]"
 SEA_PRC_faction_events.22.desc:0 "В недавней речи [ROOT.GetLeader]Он критиковал [?PRC_faction_leader_var.GetName]Лидерство над [ROOT.GetFactionName]Это не устраивало всех, кто присутствовал на саммите фракции.[FROM.GetLeader] из [FROM.GetName] Он открыто ругался [ROOT.GetLeader] Пытаясь ослабить [ROOT.GetFactionName] и противопоставить их друг другу."
 SEA_PRC_faction_events.22.a:0 "Слепой дурак все еще дурак"
 SEA_PRC_faction_events.30.t:0 "[FROM.GetNameDefCap] Требуется перераспределение земель"
 SEA_PRC_faction_events.30.desc:0 "Похоже, что [FROM.GetNameDef] Успешно проник на нашу территорию и обеспечил лояльность многих наших подданных. Теперь они требуют, чтобы эти территории были переданы официально. [FROM.GetNameDef]. То, что произойдет, если мы откажемся, остается невыясненным, но это, вероятно, вызовет силовой ответ."
 SEA_PRC_faction_events.30.a:0 "У нас не так много выбора на самом деле..."
 SEA_PRC_faction_events.30.b:0 "Нелепость!"
 SEA_PRC_faction_events.31.t:0 "[FROM.GetNameDefCap] Принимаем наш запрос"
 SEA_PRC_faction_events.31.desc:0 "[FROM.GetNameDefCap] Мы приняли наше «прошение» передать государства, в которые мы успешно проникли, что привело к увеличению наших официальных авуаров.[FROM.GetNameDefCap] Он не был доволен этим, но не осмелился выступить против нас. Теперь эта территория будет официально управляться [ROOT.GetNameDef]."
 SEA_PRC_faction_events.31.a:0 "Мудрый шаг"
 SEA_PRC_faction_events.32.t:0 "[FROM.GetNameDefCap] Отказывается выполнять"
 SEA_PRC_faction_events.32.desc:0 "[FROM.GetNameDefCap] Мы отказались от нашей просьбы передать территории, на которые нам удалось проникнуть."
 SEA_PRC_faction_events.32.a:0 "Неправильный шаг приглашает скалу..."
 SEA_PRC_faction_events.32.b:0 "Мы не потерпим вероломных союзников!\n§R[FROM.GetName] может присоединиться к другой фракции§!"
 SEA_PRC_faction_events.40.t:0 "Путь вперед: судьба Китая"
 SEA_PRC_faction_events.40.desc:0 "Мы стоим на перепутье, где мы должны решить, как мы хотим приблизиться к другим китайским государствам.[ROOT.GetLeader] Он размышлял над этим в течение многих бессонных ночей, и кажется очевидным, что есть только один путь вперед, чтобы объединить весь Китай."
 SEA_PRC_faction_events.40.a:0 "Решение, которое не было принято, остается решением, принятым"
 SEA_PRC_faction_events.40.b:0 "Мы сами проложим свой путь вперед."
 SEA_PRC_faction_events.40.c:0 "Старая преданность только удержит нас"
 SEA_PRC_faction_events.40.d:0 "Есть только один, настоящий Китай."
 SEA_PRC_faction_events.40.e:0 "Мы становимся сильнее, когда едины"
 SEA_PRC_faction_events.41.t:0 "[FROM.GetNameDefCap] Листья [ROOT.GetFactionName]"
 SEA_PRC_faction_events.41.desc:0 "Казалось бы, как будто [FROM.GetLeader] решил, что [FROM.GetNameDef] Лучше всего жить без сил и безопасности, которые [ROOT.GetFactionName] предложения. Можно только представить, как они справятся без нас!"
 SEA_PRC_faction_events.41.a:0 "Кто опять уходит?"
 SEA_PRC_faction_events.42.t:0 "[ROOT.GetNameDefCap] Изгоняют из [FROM.GetFactionName]"
 SEA_PRC_faction_events.42.desc:0 "Казалось бы, как будто [FROM.GetLeader] решил, что [FROM.GetNameDef] и [FROM.GetFactionName] Нам будет лучше, если мы не будем в альянсе. Какое безумие движет [FROM.GetLeader] Принимать такое бессмысленное решение неизвестно, но одно можно сказать наверняка. Это делает нас более уязвимыми. Мы можем только представить, что [FROM.GetNameDef] Это зависит от вас, но это не хорошо наверняка."
 SEA_PRC_faction_events.42.a:0 "Мы справимся без них"
 SEA_PRC_faction_events.50.t:0 "[FROM.GetNameDefCap] Предлагает альянс"
 SEA_PRC_faction_events.50.desc:0 "[FROM.GetLeader] Он направил к нам делегацию, пытаясь убедить нас присоединиться к их фракции. Они говорят, что мы стоим на перепутье, где будущее Китая висит на волоске. По данным The [FROM.GetName]У делегации есть только один путь вперед, чтобы объединить весь Китай — и это вместе. Нельзя не задаться вопросом, какие скрытые мотивы [FROM.GetLeader] иметь [FROM.GetLeader.GetHerHis] Разум, и если [FROM.GetLeader.GetSheHe] Нужно доверять..."
 SEA_PRC_faction_events.50.a:0 "Нет, [FROM.GetLeader] Не стоит доверять!"
 SEA_PRC_faction_events.50.b:0 "Наш путь вперед лежит вместе"
 SEA_PRC_faction_events.51.t:0 "[FROM.GetNameDefCap] Отклонить наше предложение"
 SEA_PRC_faction_events.51.desc:0 "Наша делегация [FROM.GetLeader] Он вернулся домой с пустыми руками, за исключением плохих новостей. Наше щедрое предложение пригласить [FROM.GetNameDef] В нашу фракцию, по-видимому, было встречено недоверие и неприкрытое презрение. Казалось бы, как будто [FROM.GetLeader] решил, что [FROM.GetNameDef] Лучше всего жить без сил и безопасности, которые [ROOT.GetFactionName] предложения. Можно только представить, как они справятся без нас!"
 SEA_PRC_faction_events.51.a:0 "Погоня за тенями — это потеря солнца."
 SEA_PRC_faction_events.52.t:0 "[FROM.GetNameDefCap] Листья [ROOT.GetFactionName]"
 SEA_PRC_faction_events.52.desc:0 "Мы только что получили новости от [FROM.GetLeader] это [FROM.GetNameDef] Решили выйти из [ROOT.GetFactionName] объединяя усилия с [PRC.GetNameDef]. Какое безумие движет [FROM.GetLeader] О принятии такого бессмысленного решения не известно, но если они хотят приглашать тяготы и разорения, то кто мы такие, чтобы стоять на их пути?"
 SEA_PRC_faction_events.52.a:0 "Тёмные дни ждут их,"
 SEA_PRC_faction_events.53.t:0 "Государство [FROM.GetNameDefCap] вступает во фракцию [ROOT.GetFactionName]"
 SEA_PRC_faction_events.53.desc:0 "Наша делегация [FROM.GetNameDef] Вернулся домой с хорошими новостями. Оказывается, что [FROM.GetLeader] Это гораздо более мудрый правитель, чем мы давали раньше. [FROM.GetLeader.GetHerHim] Это заслуга, подписание нашего предложения о союзе. Хотя это и не совсем неожиданно, всегда следует ожидать дождя и быть счастливее, когда солнце светит. Это значительно укрепит наши страны и [ROOT.GetFactionName]."
 SEA_PRC_faction_events.53.a:0 "Это великий день для всего Китая!"
 SEA_PRC_faction_events.60.t:0 "$generic.2.t$"
 SEA_PRC_faction_events.60.a:0 "Мы примем [FROM.GetName] то [ROOT.GetFactionName]"
 SEA_PRC_faction_events.60.b:0 "Нам лучше без них"
 SEA_PRC_faction_events.70.desc:0 "[FROM.GetLeader] Он направил к нам делегацию, пытаясь убедить нас присоединиться к их фракции. Они говорят, что мы стоим на перепутье, где будущее Азии висит на волоске. По данным The [FROM.GetName]Есть только один путь вперед для того, чтобы обеспечить нашу независимость от западных колонизаторов — и это вместе."
 SEA_PRC_faction_events.71.t:0 "[FROM.GetNameDefCap] Мы хотим, чтобы наши азиатские объекты были под опекой"
 SEA_PRC_faction_events.71.desc:0 "В письме от [FROM.GetNameDef], [FROM.GetLeader] просит нас освободить наших азиатских подданных под их опеку в новообразованном [FROM.GetFactionName]"
 SEA_PRC_faction_events.71.a:0 "Хорошо, пришло время для лучшего будущего"
 SEA_PRC_faction_events.71.b:0 "Никогда, они наши"
 SEA_PRC_faction_events.72.t:0 "[FROM.GetNameDefCap] Условно предлагаем свою свободу"
 SEA_PRC_faction_events.72.desc:0 "[FROM.GetNameDefCap] Он предложил освободить нас при одном условии: наша независимость будет предоставлена только в том случае, если мы присоединимся. [FROM.FROM.GetNameDef]\"Вновь образованный\" [PRC.GetFactionName]."
 SEA_PRC_faction_events.72.a:0 "Мы принимаем предложение и условия обоих"
 SEA_PRC_faction_events.72.b:0 "Нет, наша текущая ситуация достаточно приятная."
 SEA_PRC_faction_events.73.t:0 "[FROM.FROM.GetNameDefCap] Согласен - [FROM.GetNameDef] Присоединяйтесь [PRC.GetFactionName]"
 SEA_PRC_faction_events.73.desc:0 "[FROM.FROM.GetNameDefCap] Он согласился освободить [FROM.GetNameDef] при условии, что они присоединятся к нашей новой фракции, и [FROM.GetNameDef] Я согласилась. Церемония приветствия планируется провести в [ROOT.Capital.GetName]"
 SEA_PRC_faction_events.73.a:0 "Это новый рассвет"
 SEA_PRC_faction_events.74.t:0 "[FROM.GetNameDefCap] Отказывается присоединиться к [PRC.GetFactionName]"
 SEA_PRC_faction_events.74.desc:0 "Несмотря на предложение, [FROM.GetLeader] Объявили, что [FROM.GetNameDef] Они отказываются от предложения [PRC.GetNameDef] Присоединиться к новообразованной [PRC.GetFactionName]При этом он отметил, что предпочтение [FROM.GetAdjective] Люди — это статус-кво."
 SEA_PRC_faction_events.74.a:0 "Они приняли свое решение"
 SEA_PRC_fourth_army_incident.1.t:0 "Беспорядки среди союзников"
 SEA_PRC_fourth_army_incident.1.desc:0 "Наши командиры сообщили, что наш союз с [PRC.GetNameDef] Это привело к трению. Командиры, представляющие [PRC.GetNameDef] По сообщениям, они не решаются выполнять наши приказы и иногда открыто не подчиняются им, угрожая вызвать проблемы для наших собственных подразделений."
 SEA_PRC_fourth_army_incident.1.a:0 "[PRC.GetNameDefCap] лучше контролировать свои войска"
 SEA_PRC_fourth_army_incident.1.b:0 "Их сомнения естественны."
 SEA_PRC_fourth_army_incident.2.t:0 "[FROM.GetNameDefCap] Стремление к деэскалации напряженности"
 SEA_PRC_fourth_army_incident.2.desc:0 "После некоторых инцидентов между нашими командирами и командирами [FROM.GetNameDef]Их правительство направило нам сообщение, стремясь успокоить напряженность. Они официально подтвердили, что мы можем сохранить командование нашими собственными войсками и стремиться к установлению более двустороннего сотрудничества путем координации наших планов."
 SEA_PRC_fourth_army_incident.2.a:0 "К счастью, мы можем сосредоточиться на реальной угрозе."
 SEA_PRC_fourth_army_incident.3.t:0 "[FROM.GetNameDefCap] Жалобы на отсутствие координации"
 SEA_PRC_fourth_army_incident.3.desc:0 "Правительство [FROM.GetNameDef] Мы получили жалобу на отсутствие координации между нашими командирами на местах. Они цитируют сообщения своих командиров, в которых говорится, что наши офицеры не желали выполнять приказы командиров. [FROM.GetName] командовать, оставляя их всех на неоправданно уязвимых позициях. В частности, [FROM.GetNameDef] Мы хотим, чтобы мы приняли участие в продолжающемся тактическом отступлении, а не скомпрометировали его внутренними боестолкновениями."
 SEA_PRC_fourth_army_incident.3.a:0 "Наши командиры решают действия наших войск, а не своих."
 SEA_PRC_fourth_army_incident.3.b:0 "Возможно, у них есть точка"
 SEA_PRC_fourth_army_incident.4.t:0 "[FROM.GetNameDefCap] Командование выговоров"
 SEA_PRC_fourth_army_incident.4.desc:0 "После наших жалоб на неподчинение [FROM.GetNameDef] Их правительство успешно заставило его отступить и сотрудничать с нашими стратегическими планами."
 SEA_PRC_fourth_army_incident.4.a:0 "Очень хорошо."
 SEA_PRC_fourth_army_incident.5.t:0 "Четвертая армия атакована националистическими силами"
 SEA_PRC_fourth_army_incident.5.desc:0 "Мы получили сообщения о том, что Новая четвертая армия потерпела почти полное уничтожение после того, как была окружена националистическими силами, при этом проведя отступление, к которому наше командование не хотело присоединяться. Рассказы о том, как начались боевые действия, расплывчаты, но то, что могло начаться как дружественный инцидент с огнем, вскоре превратилось в кровавую бойню, когда обе стороны подозревали, что они подверглись преднамеренному нападению."
 SEA_PRC_fourth_army_incident.5.a:0 "Требование действий [CHI.GetLeader]"
 SEA_PRC_fourth_army_incident.5.b:0 "Мы больше не можем доверять этому альянсу."
 SEA_PRC_fourth_army_incident.6.t:0 "[FROM.GetName] Листья [ROOT.GetFactionName] После Дружеского пожара"
 SEA_PRC_fourth_army_incident.6.desc:0 "После недавнего инцидента, когда военные [ROOT.GetName] Войска сражались за [FROM.GetName]Последний оставил [ROOT.GetFactionName]. Инцидент, в котором Новая четвертая армия [FROM.GetNameDef] понес очень тяжелые потери, пришел после разногласий по приказу отступить, что привело к неизвестной стороне открывая огонь, когда наши отступающие войска встретились [FROM.GetName] Солдаты."
 SEA_PRC_fourth_army_incident.6.a:0 "Это ненужное отвлечение внимания от проблем, стоящих перед нами."
 SEA_PRC_fourth_army_incident.7.t:0 "[FROM.GetName] Требует действий после Дружественного пожара"
 SEA_PRC_fourth_army_incident.7.desc:0 "После недавнего инцидента, когда военные [ROOT.GetName] Войска сражались за [FROM.GetName]Последнее требует, чтобы мы признали свою роль в возникновении этого инцидента и дали гарантии того, что наши командиры будут более осторожны. Инцидент, в котором Новая четвертая армия [FROM.GetNameDef] понес очень тяжелые потери, пришел после разногласий по приказу отступить, что привело к неизвестной стороне открывая огонь, когда наши отступающие войска встретились [FROM.GetName] Солдаты."
 SEA_PRC_fourth_army_incident.7.a:0 "В этом можно обвинить только их неподчинение."
 SEA_PRC_fourth_army_incident.7.b:0 "Мы должны стараться оставаться в дружеских отношениях с [FROM.GetNameDef]"
 SEA_PRC_fourth_army_incident.8.t:0 "[FROM.GetName] Отказывается извиняться"
 SEA_PRC_fourth_army_incident.8.desc:0 "В ответ на наше требование действовать после инцидента с Новой Четвертой Армией, [FROM.GetNameDef] Он не хотел признавать никакой вины. Это явный признак недоверия или даже завуалированной враждебности по отношению к нашей нации и войскам, поддерживающим их военные усилия."
 SEA_PRC_fourth_army_incident.8.a:0 "Мы не можем позволить себе конфликт в данный момент."
 SEA_PRC_fourth_army_incident.8.c:0 "Это требует немедленного ответа."
 SEA_PRC_fourth_army_incident.9.t:0 "[FROM.GetName] Назад вниз"
 SEA_PRC_fourth_army_incident.9.desc:0 "Несмотря на отсутствие извинений, [FROM.GetNameDef] Они не хотят эскалации конфликта из-за нового инцидента в Четвертой армии, хотя они, безусловно, помнят об этом инциденте."
 SEA_PRC_fourth_army_incident.9.a:0 "Как и ожидалось"
 SEA_PRC_fourth_army_incident.10.t:0 "[FROM.GetName] Перезапуск Гражданской войны"
 SEA_PRC_fourth_army_incident.10.desc:0 "После инцидента с новой четвертой армией, [FROM.GetNameDef] Мы восприняли наши действия как акт агрессии и возобновили гражданскую войну. Уже сейчас войска, которые только недавно оборонялись бок о бок, воюют друг с другом на фронте, и ситуация за линией фронта не намного лучше."
 SEA_PRC_fourth_army_incident.10.a:0 "Мы всегда знали, что это произойдет в конце концов."
 SEA_PRC_fourth_army_incident.11.t:0 "[FROM.GetLeader] Извинения за дружественный пожар"
 SEA_PRC_fourth_army_incident.11.desc:0 "В ответ на нашу просьбу принять меры к [FROM.GetLeader] После инцидента с новой армией, [FROM.GetLeader] Мы написали официальное письмо с извинениями нашему руководству. Он обещает постараться приказать своим командирам действовать иначе перед лицом разногласий по поводу приказов."
 SEA_PRC_fourth_army_incident.11.a:0 "Это будет сделано"
 SEA_PRC_fourth_army_incident.12.t:0 "[FROM.GetName] Принять извинения"
 SEA_PRC_fourth_army_incident.12.desc:0 "В ответ на письмо с извинениями их руководству, [FROM.GetNameDef] Он неохотно считал это достаточным решением для нового Четвёртого военного инцидента."
 SEA_PRC_fourth_army_incident.12.a:0 "Теперь мы оба можем сосредоточиться на более неотложных вопросах."
 SEA_PRC_faction_events.80.t:0 "[FROM.GetName] Требует нашего подчинения"
 SEA_PRC_faction_events.80.desc:0 "Сообщение пришло из [FROM.capital.GetName], неся безошибочную печать [FROM.GetLeader]. За цветущим языком единства и национальной судьбы стоит требование — мы должны подчиниться и принять авторитет [FROM.GetNameDef] над нашим доменом. Нет места для переговоров, только послушание или последствия."
 SEA_PRC_faction_events.80.a:0 "Пусть приходят и пробуют"
 SEA_PRC_faction_events.80.b:0 "У нас нет другого выбора, кроме как повиноваться."
 SEA_PRC_faction_events.81.t:0 "[FROM.GetName] Отказ от нашего щедрого предложения"
 SEA_PRC_faction_events.81.desc:0 "Ультиматум был отклонен. В наглом акте неповиновения, [FROM.GetLeader] Он ясно дал понять, что его народ не подчинится. Когда наши посланники будут уволены, дипломатия расчистит путь для войны."
 SEA_PRC_faction_events.81.a:0 "Тогда они будут принесены в пяту."
 SEA_PRC_faction_events.82.t:0 "[FROM.GetName] Склоняет голову"
 SEA_PRC_faction_events.82.desc:0 "[FROM.GetName] Мы приняли наш ультиматум. Их лидеры говорят о национальном единстве и исторической судьбе, но смысл ясен — они теперь признают верховенство национального единства. [ROOT.GetNameDef].\nХотя их подчинение может быть неохотным, оно избавляет Китай от дальнейшего разделения и кровопролития."
 SEA_PRC_faction_events.82.a:0 "Разбитое солнце собирает свой свет"
 SEA_PRC_faction_events.90.t:0 "[FROM.GetNameDefCap] Просит присоединиться [ROOT.GetFactionName]"
 SEA_PRC_faction_events.90.desc:0 "В свете нынешней агрессии, с которой мы оба сталкиваемся, [FROM.GetNameDef] Мы стремимся присоединиться к нашему делу. Это означало бы принятие их и всех членов фракции. [FROM.GetFactionName]."
 SEA_PRC_faction_events.90.a:0 "Да, мы должны объединиться против общего врага"
 SEA_PRC_faction_events.90.b:0 "Нет, мы не можем им доверять."
 SEA_PRC_faction_events.91.t:0 "[FROM.GetNameDefCap] Отвергает нас"
 SEA_PRC_faction_events.91.desc:0 "[FROM.GetNameDefCap] Мы отвергли наше предложение присоединиться к их фракции против нашего общего врага. В своем заявлении они подчеркнули, что, хотя мы будем сильнее вместе, [ROOT.GetNameDef] Нельзя доверять."
 SEA_PRC_faction_events.91.a:0 "Какой позор!"
 SEA_PRC_border_war_events.1.t:0 "[PRC.GetNameDefCap] Завоеватели [1045.GetName]"
 SEA_PRC_border_war_events.1.desc:0 "После пограничных стычек вдоль границы [1045.GetName], [PRC.GetNameDef] Им удалось прорваться через оборонительные рубежи и вытеснить противника.[PRC.GetNameDefCap] Теперь государство претендует на свое."
 SEA_PRC_border_war_events.1.a:0 "Наша сила растет!"
 SEA_PRC_border_war_events.1.b:0 "Мы должны отойти..."
 SEA_PRC_border_war_events.2.t:0 "[PRC.GetNameDefCap] выводить из [1045.GetName]"
 SEA_PRC_border_war_events.2.desc:0 "После пограничных стычек вдоль границы [1045.GetName], [PRC.GetNameDef] Они не смогли прорваться через оборонительные рубежи и вытеснить противника.[PRC.GetNameDefCap] Однако удалось захватить несколько орудий."
 SEA_PRC_border_war_events.2.a:0 "Временная неудача..."
 SEA_PRC_border_war_events.2.b:0 "Мы выгнали захватчиков!"
 SEA_PRC_border_war_events.3.t:0 "[PRC.GetNameDefCap] Завоеватели [615.GetName]"
 SEA_PRC_border_war_events.3.desc:0 "После пограничных стычек вдоль границы [615.GetName], [PRC.GetNameDef] Им удалось прорваться через оборонительные рубежи и вытеснить противника.[PRC.GetNameDefCap] Теперь государство претендует на свое."
 SEA_PRC_border_war_events.4.t:0 "[PRC.GetNameDefCap] выводить из [615.GetName]"
 SEA_PRC_border_war_events.4.desc:0 "После пограничных стычек вдоль границы [615.GetName], [PRC.GetNameDef] Они не смогли прорваться через оборонительные рубежи и вытеснить противника.[PRC.GetNameDefCap] Однако удалось захватить несколько орудий."
 SEA_PRC_border_war_events.5.t:0 "[PRC.GetNameDefCap] Завоеватели [1032.GetName]"
 SEA_PRC_border_war_events.5.desc:0 "После пограничных стычек вдоль границы [1032.GetName], [PRC.GetNameDef] Им удалось прорваться через оборонительные рубежи и вытеснить противника.[PRC.GetNameDefCap] Теперь государство претендует на свое."
 SEA_PRC_border_war_events.6.t:0 "[PRC.GetNameDefCap] выводить из [1032.GetName]"
 SEA_PRC_border_war_events.6.desc:0 "После пограничных стычек вдоль границы [1032.GetName], [PRC.GetNameDef] Они не смогли прорваться через оборонительные рубежи и вытеснить противника.[PRC.GetNameDefCap] Однако удалось захватить несколько орудий."
 SEA_PRC_misc_events.1.t:0 "Люди сомневаются в нашей решимости"
 SEA_PRC_misc_events.1.desc:0 "Китайский народ стал сомневаться в нашей решимости противостоять иностранным захватчикам!"
 SEA_PRC_misc_events.1.a:0 "Это не выдержит!"
 SEA_PRC_misc_events.2.t:0 "Потеря доверия"
 SEA_PRC_misc_events.2.desc:0 "Китайский народ стал сомневаться в нашей решимости противостоять иностранным захватчикам."
 SEA_PRC_misc_events.2.a:0 "Мы должны изменить их мнение о нас."
 SEA_PRC_misc_events.3.t:0 "$PRC_pavel_mif$ Арестованы и очищены в [SOV.GetNameDef]"
 SEA_PRC_misc_events.3.desc:0 "$PRC_pavel_mif$Бывший наставник 28 1⁄2 большевиков и высокопоставленный деятель как китайской коммунистической партии, так и Московского университета Сунь Ят-сена был арестован и очищен. [SOV.GetNameDef]. Похоже, что связи Мифа с бывшими соперниками Сталина оказались фатальными."
 SEA_PRC_misc_events.3.a:0 "Огромная потеря"
 SEA_PRC_misc_events.5.t:0 "Он долго, и вторая армия фронта прибыла в город. [ROOT.capital.GetName]"
 SEA_PRC_misc_events.5.desc:0 "После более чем трех лет уклонения от националистических сил, он прибыл в США. [ROOT.capital.GetName] с минимальным ущербом для армии. Опыт Лонга в командовании и подготовке националистических сил до вступления в Красную Армию для руководства их партизанскими операциями пригодится, как и его армия."
 SEA_PRC_misc_events.5.a:0 "Наконец-то! Нам понадобится его опыт."
 SEA_PRC_misc_events.6.t:0 "Американский журналист Эдгар Сноу дал интервью Мао"
 SEA_PRC_misc_events.6.desc:0 "Проработав журналистом в течение многих лет в других частях Китая, американец Эдгар Сноу связался с Мао Цзэдуном. В последующих сериях интервью Мао и Сноу в основном говорили о том, что [JAP.GetAdjective] Империализм как [ROOT.GetNameDef] и [CHI.GetNameDef] Мао Цзэдун может организовать сопротивление, особенно предсказывая революцию в Японии, если она потерпит серьезные военные поражения. Эти интервью и опыт Сноу в [ROOT.GetNameDef]Они должны стать основой книги, представляющей его уникальные идеи жизни здесь."
 SEA_PRC_misc_events.6.a:0 "Возможность показать миру наши истинные цвета"
 SEA_PRC_misc_events.8.t:0 "Продуктивный период для $PRC_mao_zedong$"
 SEA_PRC_misc_events.8.desc:0 "Из своей пещеры, обитающей на холме Феникс в горах близ Яньань — поделились с другими лидерами [ROOT.GetCommunistParty] Мао, помимо написания стихов, писал на различные темы, начиная от военной тактики и заканчивая политикой."
 SEA_PRC_misc_events.8.a:0 "Эти произведения, несомненно, станут влиятельными."
 SEA_PRC_misc_events.9.t:0 "7-й Национальный конгресс Коммунистической партии Китая"
 SEA_PRC_misc_events.9.desc:0 "После [JAP.GetNonIdeologyName]После поражения Коммунистическая партия Китая собралась, чтобы обсудить дальнейший путь. 7-й съезд знаменует собой первый национальный конгресс с 1928 года, а также возвращение к собранию на китайской земле, предыдущий конгресс был организован в Москве из-за ослабленной партии. Обсуждаемые вопросы включали успехи и неудачи нашей тактики против агрессоров. [JAP.GetAdjective]. Другие вопросы включали в себя принятие новой конституции, стремящейся к осуществлению. [ROOT.GetLeader]Видение того, как лучше всего вести нашу страну вперед."
 SEA_PRC_misc_events.9.a:0 "Это поможет нам двигаться в будущее."
 SEA_PRC_misc_events.10.t:0 "Канадский доктор Норман Бетьюн прибыл в США"
 SEA_PRC_misc_events.10.desc:0 "Норман Бетюн, канадский коммунист и ветеран гражданской войны в Испании, прибыл, чтобы помочь испанскому народу. [ROOT.GetAdjective] Люди улучшают качество медицинской помощи. Ранее известный своими успехами в создании мобильной станции переливания крови, теперь его усилия, вероятно, будут включать улучшение медицинской практики в отдаленных сельских районах. [ROOT.GetNameDef]."
 SEA_PRC_misc_events.10.a:0 "Мы приглашаем всех международных волонтеров."
 SEA_PRC_misc_events.11.t:0 "Норман Бетюн уходит"
 SEA_PRC_misc_events.11.desc:0 "Печальные новости достигли [ROOT.Capital.GetName]. Доктор Норман Бетюн, бескорыстно помогавший нашему народу более двух лет, скончался после, казалось бы, тривиального пореза пальца, что привело к инфекции, которая оказалась смертельной.[ROOT.GetLeader]Получив эту новость, написал хвалебную речь, восхваляющую работу Бетюн. Написанная дань подчеркивает готовность врача путешествовать по миру в поддержку своих товарищей и то, как он подает пример сотрудничества между пролетариатом разных стран."
 SEA_PRC_misc_events.11.a:0 "Приличная речь"
 SEA_PRC_misc_events.12.t:0 "[SOV.GetAdjective]Подписан Японский пакт о ненападении"
 SEA_PRC_misc_events.12.desc:0 "Чтобы защитить свои восточные границы, [SOV.GetNameDef] Подписал «Пакт о нейтралитете» [JAP.GetNameDef]. Однако это означает, что [JAP.GetNameDef] Будет позволено свободной руке расширяться в Азии, не беспокоясь об этом. [SOV.GetAdjective] Интервенция."
 SEA_PRC_misc_events.12.a:0 "Горькая пилюля, которую нужно проглотить"
 SEA_PRC_misc_events.13.t:0 "[FROM.GetNameDefCap] Запросить Территорию"
 SEA_PRC_misc_events.13.desc:0 "Мы приняли делегацию от [FROM.GetNameDef]Просить нас передать территорию, которая, по их утверждению, принадлежит им по праву, и это может быть правдой. С определенной точки зрения.[FROM.GetLeader] Мы были бы очень признательны, если бы мы обязали и дали китайцам то, о чем они просят, и были бы в равной степени расстроены, если бы отказались. [FROM.GetLeader.GetSheHe] Можно было бы рассмотреть вопрос о захвате территории силой. По крайней мере, делегация утверждает, что..."
 SEA_PRC_misc_events.13.a:0 "Дайте им наши маньчжурские владения."
 SEA_PRC_misc_events.13.b:0 "Дайте им наши монгольские владения."
 SEA_PRC_misc_events.13.c:0 "Дайте им все, что у нас есть"
 SEA_PRC_misc_events.13.d:0 "Ничего им не дайте!"
 SEA_PRC_misc_events.14.t:0 "[FROM.GetNameDefCap] Обязательства"
 SEA_PRC_misc_events.14.desc:0 "Наша делегация [FROM.GetNameDef] Вернулись с прекрасными новостями! Наша просьба к [FROM.GetLeader] Мы получили право передать наши законные маньчжурские территории.[ROOT.GetLeader] Он восхваляет обоих [FROM.GetLeader] и наших дипломатов за то, что они совершили этот подвиг."
 SEA_PRC_misc_events.14.a:0 "Еще один шаг к единому Китаю!"
 SEA_PRC_misc_events.15.desc:0 "Наша делегация [FROM.GetNameDef] Вернулись с прекрасными новостями! Наша просьба к [FROM.GetLeader] Мы получили право передать наши законные монгольские территории.[ROOT.GetLeader] Он восхваляет обоих [FROM.GetLeader] и наших дипломатов за то, что они совершили этот подвиг."
 SEA_PRC_misc_events.16.desc:0 "Наша делегация [FROM.GetNameDef] Вернулись с прекрасными новостями! Наша просьба к [FROM.GetLeader] передать наши законные территории, находящиеся под [FROM.GetNameDef] Он был предоставлен.[ROOT.GetLeader] Он восхваляет обоих [FROM.GetLeader] и наших дипломатов за то, что они совершили этот подвиг."
 SEA_PRC_misc_events.17.t:0 "[FROM.GetNameDefCap] Отказы"
 SEA_PRC_misc_events.17.desc:0 "Наша делегация [FROM.GetNameDef] Он вернулся в подавленном настроении. Наша просьба к [FROM.GetLeader] Сдать наши законные территории было встречено отказом и презрением.[ROOT.GetLeader] Проклятие обоим [FROM.GetLeader] И наши дипломаты за то, что не смогли обеспечить то, что по праву принадлежит нам."
 SEA_PRC_misc_events.17.a:0 "Слепой дурак одновременно слеп и глуп."
 SEA_PRC_misc_events.17.b:0 "Мы заберем то, что у нас есть, силой!"
 SEA_PRC_misc_events.18.desc:0 "Наша делегация [FROM.GetNameDef] Он вернулся в подавленном настроении. Наша просьба к [FROM.GetLeader] Сдать наши законные территории было встречено отказом и презрением.[ROOT.GetLeader] Проклятие обоим [FROM.GetLeader] И наши дипломаты за то, что не смогли обеспечить то, что по праву принадлежит нам."
 SEA_PRC_misc_events.18.a:0 "Руки вверх. [326.GetName]"
 SEA_PRC_misc_events.18.b:0 "Руки вверх. [729.GetName]"
 SEA_PRC_misc_events.18.c:0 "Руки вверх. [728.GetName]"
 SEA_PRC_misc_events.18.d:0 "Отдай все в руки."
 SEA_PRC_misc_events.19.a:0 "[FROM.GetNameDefCap] Руки вверх [326.GetName]"
 SEA_PRC_misc_events.19.b:0 "[FROM.GetNameDefCap] Руки вверх [729.GetName]"
 SEA_PRC_misc_events.19.c:0 "[FROM.GetNameDefCap] Руки вверх [728.GetName]"
 SEA_PRC_misc_events.19.d:0 "[FROM.GetNameDefCap] Руки над всем"
 SEA_PRC_misc_events.19.desc:0 "Нам повезло, что [FROM.GetNameDef] Мы согласны с нашими требованиями."
 SEA_PRC_political_events.1.t:0 "$PRC_wang_ming$ или $PRC_bo_gu$ Как лидер [Root.GetName]?"
 SEA_PRC_political_events.1.desc1:0 "С 28 полубольшевиками, преобладающими в борьбе за власть, настало время выбрать представителя для руководства нацией. Несмотря на изгнание в [SOV.GetNameDef]Настало время $PRC_wang_ming$ Возвращение к лидерству – должно быть $PRC_bo_gu$ Не получи кивка."
 SEA_PRC_political_events.1.desc2:0 "С 28 полубольшевиками, преобладающими в борьбе за власть, настало время выбрать представителя для руководства нацией. Хотя оба кандидата хорошо связаны с коммунистами, они не могут быть избраны. [SOV.GetNameDef], $PRC_bo_gu$ Менее опытный в политическом плане. Тем не менее, он демонстрирует глубокое понимание военных вопросов, которые могут быть полезны в предстоящей борьбе. $PRC_wang_ming$политико-дипломатическая подкова. Оба мужчины готовы взяться за мантию."
 SEA_PRC_political_events.1.a:0 "Позволь $PRC_wang_ming$ свинец"
 SEA_PRC_political_events.1.b:0 "Позволь $PRC_bo_gu$ свинец"
 SEA_PRC_political_events.2.t:0 "[FROM.GetNameDefCap] Требует территориальной гарантии"
 SEA_PRC_political_events.2.desc:0 "Несмотря на нашу поддержку и их относительно защищенное место в горах центрального Китая, [FROM.GetNameDef] Мы просим вас взять на себя обязательство защищать их в случае конфликта. Опасаются ли они очередной антикоммунистической кампании националистических сил или иностранного империализма, неясно, но нам нужно взвесить риск быть втянутыми в такие конфликты, прежде чем мы предоставим какие-либо гарантии."
 SEA_PRC_political_events.2.a:0 "Мы должны защищать наших товарищей."
 SEA_PRC_political_events.2.b:0 "Мы гарантируем их, если они согласятся стать нашим субъектом."
 SEA_PRC_political_events.2.c:0 "Это слишком рискованно."
 SEA_PRC_political_events.3.t:0 "[FROM.GetNameDefCap] Согласен с территориальной гарантией"
 SEA_PRC_political_events.3.desc:0 "Наша миссия [FROM.GetNameDef] Они обещали защитить нас от любых угроз, с которыми мы можем столкнуться. Эта защита должна позволить нам сосредоточиться на долгосрочных целях, таких как развитие. [ROOT.capital.GetName]Вопрос, который иначе был бы скомпрометирован потенциальной срочностью другого тактического отступления."
 SEA_PRC_political_events.3.a:0 "Это должно нас обезопасить."
 SEA_PRC_political_events.31.t:0 "[FROM.GetNameDefCap] Согласен на территориальную гарантию — по цене"
 SEA_PRC_political_events.31.desc:0 "Наша миссия [FROM.GetNameDef] Они обещали защитить нас от любых угроз, с которыми мы можем столкнуться. Эта защита должна позволить нам сосредоточиться на долгосрочных целях, таких как развитие. [ROOT.capital.GetName]Вопрос, который иначе был бы скомпрометирован потенциальной срочностью другого тактического отступления."
 SEA_PRC_political_events.31.a:0 "Это должно нас обезопасить."
 SEA_PRC_political_events.31.b:0 "Вторые мысли... Давайте не будем"
 SEA_PRC_political_events.32.t:0 "[FROM.GetNameDefCap] сожалеет о своем решении"
 SEA_PRC_political_events.32.desc:0 "[FROM.GetNameDefCap] Они ответили, что больше не хотят следовать дипломатическому варианту, который мы им гарантируем. Очевидно, что принцип становления субъектом был слишком велик для них."
 SEA_PRC_political_events.32.a:0 "Это их потеря."
 SEA_PRC_political_events.4.t:0 "[FROM.GetName] Отказывается гарантировать нам"
 SEA_PRC_political_events.4.desc:0 "Несмотря на все усилия наших дипломатов, [FROM.GetNameDef] Он отказался защищать себя. [ROOT.GetNameDef]. Мы можем только надеяться, что такие обещания защиты никогда бы не понадобились."
 SEA_PRC_political_events.4.a:0 "Стыд"
 SEA_PRC_political_events.5.t:0 "[FROM.GetName] Хочет присоединиться [ROOT.GetFactionName]"
 SEA_PRC_political_events.5.desc:0 "[FROM.GetNameDefCap] Мы предприняли еще один шаг в стремлении расширить свое сотрудничество с нами, попросив присоединиться к нам. [ROOT.GetFactionName]. Мы должны решить, будем ли мы считать это полезным расширением нашей деятельности. [ROOT.GetFactionName] Китай, или если такой союз будет потенциальной ответственностью."
 SEA_PRC_political_events.5.a:0 "Впусти их в"
 SEA_PRC_political_events.5.b:0 "Мы не можем рисковать чрезмерным расширением"
 SEA_PRC_political_events.6.t:0 "[FROM.GetName] Договорились, чтобы мы присоединились [FROM.GetFactionName]"
 SEA_PRC_political_events.6.desc:0 "Наша делегация [FROM.GetNameDef] Мы вернулись домой, чтобы объявить, что нас приветствовали. [FROM.GetFactionName]. Вместе с ними, [FROM.GetAdjective] Приехали дипломаты, чтобы обсудить, как может выглядеть наше сотрудничество."
 SEA_PRC_political_events.6.a:0 "Новый день"
 SEA_PRC_political_events.7.t:0 "[FROM.GetName] Отказывается позволить нам присоединиться [FROM.GetFactionName]"
 SEA_PRC_political_events.7.desc:0 "Дипломаты, которых мы направили [FROM.GetName] Мы вернулись с новостью о том, что нам не разрешили присоединиться. [FROM.GetFactionName]. Кажется, что [FROM.GetNameDef] Он сосредоточил свои дипломатические усилия на других направлениях."
 SEA_PRC_political_events.7.a:0 "Стыд"
 SEA_PRC_political_events.8.t:0 "[FROM.GetName] Мы хотим подписать пакт о ненападении"
 SEA_PRC_political_events.8.desc:0 "Видя себя окруженным потенциальными врагами, [FROM.GetNameDef] Мы обратились к нам с просьбой заключить пакт о ненападении, чтобы обеспечить нашу пассивность в любых конфликтах в регионе, направленных против них."
 SEA_PRC_political_events.8.a:0 "Мы все равно не хотим ввязываться."
 SEA_PRC_political_events.8.b:0 "Это может заставить их действовать более агрессивно."
 SEA_PRC_political_events.9.t:0 "[FROM.GetName] Договорились подписать пакт о ненападении"
 SEA_PRC_political_events.9.desc:0 "После тщательного обсуждения, [FROM.GetNameDef] Мы приняли решение подписать наш договор о ненападении. Они, к счастью, не были заинтересованы в участии в конфликтах в регионе."
 SEA_PRC_political_events.9.a:0 "Это облегчение."
 SEA_PRC_political_events.10.t:0 "[FROM.GetName] Отказывается подписывать пакт о ненападении"
 SEA_PRC_political_events.10.desc:0 "империалистический [FROM.GetName] Он отказался подписать с нами соглашение о ненападении. Похоже, что они отдают приоритет отношениям с нашими соперниками, а не с теми, кто с нами."
 SEA_PRC_political_events.10.a:0 "Стыд"
 SEA_PRC_political_events.11.t:0 "[FROM.GetName] Хочет быть свободным"
 SEA_PRC_political_events.11.desc:0 "[FROM.GetLeader] Отправить телеграмму на [Root.GetLeader]официально заявляя о своей независимости [FROM.GetName]. В телеграмме не говорится, что произойдет, если мы откажемся, но можно с уверенностью предположить, что они не будут счастливы."
 SEA_PRC_political_events.11.a:0 "Пусть они будут свободны"
 SEA_PRC_political_events.11.b:0 "Они останутся нашей темой."
 SEA_PRC_political_events.12.t:0 "[FROM.GetName] Договорились освободить нас"
 SEA_PRC_political_events.12.desc:0 "Это славный день в [ROOT.Capital.GetName] Мы свободны от ига [FROM.GetName]. Пришло время праздновать, наше время близко."
 SEA_PRC_political_events.12.a:0 "Какой день!"
 SEA_PRC_political_events.13.t:0 "[FROM.GetName] Отказывается отпустить нас"
 SEA_PRC_political_events.13.desc:0 "Какая жалость — как ответ на [ROOT.GetLeader]Телеграмма, [FROM.GetName] Он отказался гарантировать нашу независимость, вместо этого заявив, что наша судьба необъяснимо связана с их судьбой."
 SEA_PRC_political_events.13.a:0 "Отчаянные времена требуют отчаянных мер."
 SEA_PRC_political_events.13.b:0 "Будем ждать своего времени..."
 SEA_PRC_political_events.19.t:0 "Некоторые из наших генералов перешли на другую сторону!"
 SEA_PRC_political_events.19.desc:0 "Конфликт между [PRC.GetNameDef] и [CHI.GetNameDef] Это подорвало нашу армию, так как некоторые из наших командиров перешли на сторону коммунистов. Действительно ли они совпадают с [PRC.GetNameDef]Или просто следуют за тем, как дует ветер, еще предстоит увидеть."
 SEA_PRC_political_events.19.a:0 "Предатели, многие из них"
 SEA_PRC_political_events.20.t:0 "Генералы по всему Китаю стекаются к нашему делу"
 SEA_PRC_political_events.20.desc:0 "Возобновление военных действий между [CHI.GetNameDef] и [PRC.GetNameDef] Это привело к неопределенности среди офицеров противника, в результате чего некоторые из них перешли на нашу сторону."
 SEA_PRC_political_events.20.a:0 "Обнадеживающий знак!"
 SEA_PRC_political_events.21.t:0 "[FROM.GetName] Хочет $SOV_vasily_chuykov$ и $SOV_aleksandr_cherepanov$ Консультировать их"
 SEA_PRC_political_events.21.desc:0 "\nВ поисках [ROOT.GetAdjective] Советы по военной стратегии, [FROM.GetNameDef] Мы просили, чтобы мы позволили $SOV_vasily_chuykov$ и $SOV_aleksandr_cherepanov$ Возвращение в Китай. Чуйков изначально находился в [FROM.GetNameDef] свободно говорит по-китайски, но был отозван после конфликта из-за [ROOT.GetAdjective] интересов в Маньчжурии, когда она еще не была захвачена Японией."
 SEA_PRC_political_events.21.a:0 "[FROM.GetNameDefCap] Выиграет от их помощи"
 SEA_PRC_political_events.21.b:0 "Нам нужен их опыт дома."
 SEA_PRC_political_events.22.t:0 "[FROM.GetName] Договорились прислать нам $SOV_vasily_chuykov$ и $SOV_aleksandr_cherepanov$"
 SEA_PRC_political_events.22.desc:0 "\nНаши представители в [FROM.capital.GetName] Мы связались с новостями, которые [FROM.GetNameDef] Мы приняли нашу просьбу разрешить $SOV_vasily_chuykov$ Вернитесь в Китай и сообщите нам, что он уже на пути в Китай. [ROOT.GetNameDef]. Кроме того, $SOV_aleksandr_cherepanov$ Он присоединился к нему."
 SEA_PRC_political_events.22.a:0 "Добро пожаловать обратно!"
 SEA_PRC_political_events.23.t:0 "[FROM.GetName] Отказывается присылать нам $SOV_vasily_chuykov$ и $SOV_aleksandr_cherepanov$"
 SEA_PRC_political_events.23.desc:0 "\nНесмотря на $SOV_vasily_chuykov$пригодность в качестве атташе в [ROOT.GetNameDef], [FROM.GetNameDef] Он не решился ни отпустить его, ни $SOV_aleksandr_cherepanov$Утверждать, что они в настоящее время участвуют в военных планах более важно."
 SEA_PRC_political_events.23.a:0 "Возможно, мало квалифицированных командиров осталось после чисток."
 SEA_PRC_political_events.24.t:0 "[FROM.GetName] Хочет, чтобы мы переназначили $SOV_vasily_chuykov$ и $SOV_aleksandr_cherepanov$"
 SEA_PRC_political_events.24.desc:0 "\nСлушание $SOV_vasily_chuykov$ и $SOV_aleksandr_cherepanov$\"Миссия для [CHI.GetNameDef], [FROM.GetNameDef] Он также выразил заинтересованность в том, чтобы принять их в качестве атташе.[FROM.GetNameDefCap] Похоже, что они подхватили практические навыки командиров в китайской беглости в сочетании с обширным военным опытом, или, возможно, они просто хотят отрицать это. [CHI.GetName] Этот опыт."
 SEA_PRC_political_events.24.a:0 "Мы поможем нашим товарищам [FROM.GetNameDef]"
 SEA_PRC_political_events.24.b:0 "Они делают хорошую работу в [CHI.GetName]"
 SEA_PRC_political_events.25.t:0 "[FROM.GetName] Заказы $SOV_vasily_chuykov$ и $SOV_aleksandr_cherepanov$ то [PRC.GetName]"
 SEA_PRC_political_events.25.desc:0 "\nПосле запроса от [PRC.GetNameDef] перераспределять $SOV_vasily_chuykov$ и $SOV_aleksandr_cherepanov$ В своем регионе они начали двигаться в своем направлении. Несмотря на наше обращение к ним оставаться советниками, они не могли не подчиняться приказам, данным им. [FROM.GetNameDef]."
 SEA_PRC_political_events.25.a:0 "Потеря для нашей армии"
 SEA_PRC_political_events.26.t:0 "[FROM.GetName] Заказы $SOV_vasily_chuykov$ и $SOV_aleksandr_cherepanov$ то [PRC.GetName]"
 SEA_PRC_political_events.26.desc:0 "\n[FROM.GetNameDefCap] Мы приняли решение выполнить нашу просьбу и распорядились $SOV_vasily_chuykov$ и $SOV_aleksandr_cherepanov$ Переселиться в [ROOT.GetNameDef]. Их советы, несомненно, будут ценны, а переезд станет ударом по армии [CHI.GetNameDef]."
 SEA_PRC_political_events.26.a:0 "Давайте посмотрим, какие предложения у них могут быть"
 SEA_PRC_political_events.27.t:0 "[FROM.GetName] Отказывается присылать нам $SOV_vasily_chuykov$ и $SOV_aleksandr_cherepanov$"
 SEA_PRC_political_events.27.desc:0 "\nНесмотря на поддержку, оказанную ранее [FROM.GetNameDef]Они отказались заканчивать $SOV_vasily_chuykov$\"s\" и $SOV_aleksandr_cherepanov$\"задания\" в [CHI.GetNameDef]Мы лишаем нас возможности командовать здесь в качестве атташе. Они утверждают, что [CHI.GetNameDef]В настоящее время армия имеет большое значение для [FROM.GetNameDef]."
 SEA_PRC_political_events.27.a:0 "Они совершают ошибку"
 SEA_PRC_political_events.41.t:0 "Неохотная диархия"
 SEA_PRC_political_events.41.desc:0 "Политические соперники на протяжении многих лет. $PRC_mao_zedong$ и $PRC_zhang_guotao$ Встретились в [ROOT.Capital.GetName] Отложить в сторону их разногласия перед лицом нашей опасной ситуации. И хотя мы не можем полностью доверять друг другу, враг нашего врага действительно является другом."
 SEA_PRC_political_events.41.a:0 "Неудобный альянс"
 SEA_PRC_zhang_guotao_events.1.t:0 "Разделение внутри партии"
 SEA_PRC_zhang_guotao_events.1.desc:0 "$PRC_zhang_guotao$Генерал, командующий армией Четвертого фронта, возглавляет одну из двух армий, еще не прибывших в наши безопасные базовые районы. Они все еще находятся в Долгом Марше, не согласившись с Мао, по какому пути идти. В октябре 1935 года, $PRC_zhang_guotao$ Он объявил себя настоящим лидером. [ROOT.GetNameDef]Он даже зашел так далеко, что создал свой собственный Центральный Комитет, Центральное Правительство и Центральную Военную Комиссию. Он также заявил, что $PRC_mao_zedong$, $PRC_zhang_wentian$ и $PRC_zhou_enlai$ Они должны быть исключены из партии.\n\n$PRC_zhang_guotao$ Он отправил телеграмму на [ROOT.GetLeader] Объявляя, что он направляется к безопасности базовых районов со своей армией. В телеграмме также говорится, что, согласно пожеланиям Линь Юйин — посланника партии к [SOV.GetNameDef] Гуотао приостановил работу своих партийных органов в пользу мирного примирения с Мао и другими. Что бы он ни говорил, Готао остается сильным политическим соперником и его нельзя недооценивать."
 SEA_PRC_zhang_guotao_events.1.a:0 "Хотя у Готао есть армия, партия выступает против его притязаний на легитимность."
 SEA_PRC_zhang_guotao_events.1.b:0 "Может, он прав?"
 SEA_PRC_zhang_guotao_events.2.t:0 "Telegram из $PRC_zhang_guotao$"
 SEA_PRC_zhang_guotao_events.2.desc:0 "$PRC_zhang_guotao$ Политический соперник Мао, Четвёртый фронт, послал телеграмму о приближении его армии. [ROOT.Capital.GetName]. Их долгий марш длился почти на год дольше, чем их собственный. $PRC_mao_zedong$И армия, несомненно, будет измучена испытаниями. Возможно, именно из-за этого $PRC_zhang_guotao$ Он вновь подчеркнул, что не стремится бросить вызов нынешнему партийному руководству."
 SEA_PRC_zhang_guotao_events.2.a:0 "Добро пожаловать в Готао и его армию, но внимательно следите за ним."
 SEA_PRC_zhang_guotao_events.2.b:0 "Мы не можем доверять ему, осуждать $PRC_zhang_guotao$ Отказать ему во въезде на нашу территорию"
 PRC_reject_guotao_tt:0 "§RЭто будет препятствовать доступу к §!§Y$PRC_the_unwilling_diarchy_focus$§!§R фокус и последующее отделение§!"
 SEA_PRC_zhang_guotao_events.3.t:0 "$PRC_zhang_guotao$ Четвертая фронтовая армия прибыла в [ROOT.capital.GetName]"
 SEA_PRC_zhang_guotao_events.3.desc:0 "Наконец, длинный марш закончился. $PRC_zhang_guotao$ И четвертая армия фронта — они прибыли относительно нетронутыми в наши базовые районы. Дебрифинги уже начались, но Готао еще не отказался от своих претензий на лидерство. Вместо этого он утверждает, что поддерживает то, что должно быть сделано, чтобы помочь победить в предстоящей борьбе, а не уточняет, что он имеет в виду. Дальнейшие заседания Политбюро должны быть проведены [Root.GetLeader] Чтобы разобраться в этом беспорядке."
 SEA_PRC_zhang_guotao_events.3.a:0 "Вызов партийному руководству?"
 SEA_PRC_zhang_guotao_events.4.t:0 "$PRC_zhang_guotao$ Выход из коммунистической партии"
 SEA_PRC_zhang_guotao_events.4.desc:0 "$PRC_zhang_guotao$ Он заявил, что покидает Коммунистическую партию Китая, ссылаясь на непоправимые отношения с ЦК и разочарование в партии."
 SEA_PRC_zhang_guotao_events.4.a:0 "Предатель нашего дела"
 SEA_PRC_zhang_guotao_events.4.b:0 "Убедить его остаться"
 PRC_zhang_guotao_left_tt:0 "§Y$PRC_zhang_guotao$§! §Rбольше не будет доступна§! как §YГенерал§! или §Yсоветник§!"
 CHI_guotao_joins_kmt:0 "$PRC_zhang_guotao$ Вступил в КМТ"
 SEA_PRC_zhang_guotao_events.5.t:0 "$PRC_zhang_guotao$ Хочет присоединиться к нашему делу"
 SEA_PRC_zhang_guotao_events.5.desc:0 "$PRC_zhang_guotao$«бывший» коммунистический лидер и политический соперник $PRC_mao_zedong$Приближается [ROOT.GetLeader] Присоединиться к нашей стороне в борьбе с иностранной агрессией. Назван «бывшим» коммунистом из-за его недавнего осуждения. [PRC.GetLeader]Руководствуя ЦК, Готао с тех пор покинул партию и теперь стремится присоединиться к нам. Его опыт может пригодиться, но [PRC.GetNameDef] Я очень рассержен, что позволил предателю присоединиться к нам."
 SEA_PRC_zhang_guotao_events.5.a:0 "Позволь $PRC_zhang_guotao$ Присоединяйся"
 SEA_PRC_zhang_guotao_events.5.b:0 "Откажитесь — мы не можем доверять ему"
 SEA_PRC_zhang_guotao_events.6.t:0 "$PRC_zhang_guotao$ Присоединился к KMT"
 SEA_PRC_zhang_guotao_events.6.desc:0 "$PRC_zhang_guotao$ Он не только покинул Коммунистическую партию Китая, но и вступил в КМТ под руководством президента. [CHI.GetNameDef]. Если мы когда-нибудь окажемся в прямом конфликте с ними, $PRC_zhang_guotao$ Он будет на стороне врага."
 SEA_PRC_zhang_guotao_events.6.a:0 "Предатель!"
 SEA_PRC_zhang_guotao_events.7.t:0 "$PRC_zhang_guotao$ Выход из коммунистической партии"
 SEA_PRC_zhang_guotao_events.7.desc:0 "$PRC_zhang_guotao$ Заявил, что покидает Коммунистическую партию Китая, ссылаясь на непоправимые отношения с ЦК и $PRC_mao_zedong$А также его разочарование в партии."
 SEA_PRC_zhang_guotao_events.7.a:0 "Нежелательная диархия была ошибкой — ему нельзя доверять."
 SEA_PHI_political_events.1.t:0 "[FROM.GetName] Предлагает торговое соглашение"
 SEA_PHI_political_events.1.desc:0 "Стремление уменьшить их зависимость от [USA.GetAdjective] торговля, [FROM.GetNameDef] Он обратился к нам с предложением о новой торговой сделке. Подобно им, это может позволить нам также уменьшить нашу зависимость от небольшой группы торговых партнеров."
 SEA_PHI_political_events.1.a:0 "Наличие альтернативных источников ресурсов, в которых мы нуждаемся, имеет решающее значение."
 SEA_PHI_political_events.1.b:0 "У нас есть другие торговые партнеры."
 SEA_PHI_political_events.2.t:0 "Япония подписала торговое соглашение"
 SEA_PHI_political_events.2.desc:0 "Предлагаемое торговое соглашение [FROM.GetNameDef] Его правительство положительно восприняло. Их энтузиазм — отличное начало для поиска новых торговых партнеров."
 SEA_PHI_political_events.2.a:0 "Отличные новости."
 SEA_PHI_political_events.3.t:0 "[FROM.GetName] Предлагается новое торговое соглашение"
 SEA_PHI_political_events.3.desc:0 "И путь к их независимости, [FROM.GetNameDef] Он обратился к нам с проектом торгового соглашения между нашими странами. Они предлагают сделку, которая сделает импорт наших ресурсов более привлекательным для них, где ранее торговые партнеры могли бы быть выбраны на основе [USA.GetAdjective] интересы вместо интересов [FROM.GetAdjective] Один."
 SEA_PHI_political_events.3.a:0 "Это даст нам конкурентное преимущество."
 SEA_PHI_political_events.3.b:0 "Они получат ту же цену, что и все остальные."
 SEA_PHI_political_events.4.t:0 "[FROM.GetName] Договорились о торговом соглашении"
 SEA_PHI_political_events.4.desc:0 "[FROM.GetAdjective] Представители заявили, что они направят своих делегатов для создания торгового соглашения между нашими странами. Такое новое соглашение с [FROM.GetNameDef] Мы обещаем предоставить нам больше возможностей для того, кто получит наши критически важные ресурсы."
 SEA_PHI_political_events.4.a:0 "Отличные новости."
 SEA_PHI_political_events.5.t:0 "[FROM.GetName] Отклоняет торговое соглашение"
 SEA_PHI_political_events.5.desc:0 "Наше разумное предложение о торговом соглашении с [FROM.GetNameDef] Ему было отказано. Похоже, что сделки с другими торговыми партнерами или геополитические соображения означали, что они действовали как против наших, так и против собственных интересов."
 SEA_PHI_political_events.5.a:0 "Мы найдем кого-то другого, кто будет покупать ресурсы у нас."
 SEA_PHI_political_events.6.t:0 "[FROM.GetName] Обеспечить поддержку"
 SEA_PHI_political_events.6.desc:0 "Растущее влияние на [FROM.GetCommunistParty] в [FROM.GetNameDef] Теперь он приносит плоды, поскольку его представители пересекли Китай, чтобы сообщить нам о том, что Китай находится в состоянии войны. [FROM.GetAdjective] Добровольческие силы, которые мобилизуются для поддержки наших сил. Кроме того, эти добровольцы привозят запасную технику, чтобы помочь оснастить собственные войска."
 SEA_PHI_political_events.6.a:0 "Хорошее начало для сотрудничества с нами [FROM.GetAdjective] товарищи"
 SEA_PHI_political_events.7.t:0 "[FROM.GetName] Спасибо за нашу поддержку"
 SEA_PHI_political_events.7.desc:0 "Представители [FROM.GetLeader] Он выразил благодарность за поддержку наших добровольцев и предоставленные военные материалы. The [FROM.GetAdjective] Большой опыт гражданской войны, безусловно, означает, что эти ресурсы будут эффективно использованы."
 SEA_PHI_political_events.7.a:0 "Отличный первый шаг"
 SEA_PHI_political_events.9.t:0 "[FROM.GetName] Предложения по продаже кораблей для военной техники"
 SEA_PHI_political_events.9.desc:0 "В обмен на отправку [PHI_GetTradedEquipment], [FROM.GetNameDef] предлагает отправить нам флотилию торговых и транспортных судов."
 SEA_PHI_political_events.9.a:0 "Чертовски хорошая сделка."
 SEA_PHI_political_events.9.b:0 "Нам нужно это оборудование"
 SEA_PHI_political_events.10.t:0 "[FROM.GetName] Договорились о покупке судов"
 SEA_PHI_political_events.10.desc:0 "Как мы и предлагали, [FROM.GetNameDef] Он послал нам посылку [PHI_GetTradedEquipment] В обмен на торговые и транспортные суда, которые теперь плывут в направлении [FROM.GetAdjective] Порты."
 SEA_PHI_political_events.10.a:0 "Это должно быть взаимовыгодным"
 SEA_PHI_political_events.11.t:0 "[FROM.GetName] Отклоняет торговое предложение"
 SEA_PHI_political_events.11.desc:0 "К сожалению, [FROM.GetNameDef] Он отказался предоставить нам [PHI_GetTradedEquipment] В обмен на некоторые наши корабли."
 SEA_PHI_political_events.11.a:0 "Возможно, они готовы расстаться с каким-то другим оборудованием."
 SEA_PHI_political_events.12.t:0 "Угроза американского вмешательства закончилась."
 SEA_PHI_political_events.12.desc:0 "После напряженных переговоров и ряда уступок от [PHI.GetNameDef], [USA.GetLeader] Объявили, что [USA.GetNameDef] не будет вмешиваться в [Root.GetRulingPartyLong] планы.[USA.GetLeader.GetSheHeCap] Убеждены, что [PHI.GetNameDef] Мы не представляем непосредственной угрозы американскому народу и предприняли надлежащие шаги для обеспечения надлежащего продолжения стабильного правительства.[TreatyOfManilaToBeSigned]"
 SEA_PHI_political_events.12.a:0 "Наши усилия окупились"
 PHI_TreatyOfManilaToBeSigned:0 "\n\nТаким образом, переговоры о подписании Манильского договора были санкционированы и взаимно согласованы. [PHI.GetNameDef] Кажется, что это неизбежно."
 SEA_PHI_political_events.13.t:0 "The [PHI.GetCommunistParty] Проблема"
 SEA_PHI_political_events.13.desc:0 "[PHI.GetNameDef] Коммунистическая партия неоднократно отвергала наших представителей и угрожала разорвать с нами все отношения.\n\nВысокопоставленные военные чиновники представили военный план на столе [Root.GetLeader]. Сторонники этого плана утверждают, что коммунистические Филиппины представляют угрозу нашей безопасности, и мы должны вмешаться, чтобы остановить распространение коммунизма."
 SEA_PHI_political_events.13.a:0 "Вмешательство в прекращение коммунизма в Юго-Восточной Азии"
 SEA_PHI_political_events.13.b:0 "эмбарго [PHI.GetName]"
 SEA_PHI_political_events.13.c:0 "Отправить сильно сформулированное письмо"
 SEA_PHI_political_events.14.t:0 "Объявлена война"
 SEA_PHI_political_events.14.desc:0 "[USA.GetNameDefCap] Объявляем войну [PHI.GetName]. Это происходит после неспособности успокоиться. [USA.GetAdjective] Беспокойство о роли [PHI.GetRulingPartyLong]. Публичное заявление [USA.GetLeader] Эта война была необходима для того, чтобы остановить распространение коммунизма в Юго-Восточной Азии."
 SEA_PHI_political_events.14.a:0 "Мы будем сопротивляться нашим бывшим повелителям."
 SEA_PHI_political_events.15.t:0 "[USA.GetAdjective] эмбарго"
 SEA_PHI_political_events.15.desc:0 "[USA.GetNameDefCap] Объявлено о полном торговом эмбарго на [PHI.GetNameDef] Из-за «неудачи» в [PHI.GetAdjective] «Правительство с целью ограничить коммунистическое влияние»."
 SEA_PHI_political_events.15.a:0 "По крайней мере, это не вооруженный ответ."
 SEA_PHI_political_events.16.t:0 "[USA.GetName] Отправляет протест"
 SEA_PHI_political_events.16.desc:0 "В ответ на изменения в правительстве и внешней политике, [USA.GetAdjective] Правительство направило письмо с осуждением наших действий. Однако, учитывая их предыдущие действия в Южной Америке, это кажется мягкой реакцией."
 SEA_PHI_political_events.16.a:0 "Наилучший возможный результат, учитывая"
 SEA_PHI_political_events.17.t:0 "Наше новое лидерство"
 SEA_PHI_political_events.17.desc:0 "Воспользовавшись слабостью американского надзора над национальным правительством, Партидо Коммуниста нг Пилипины быстро вмешались и заполнили пустоту, а избранные члены партии призвали к немедленным решительным действиям, которые только они были оснащены для выполнения. В то время как другие группы все еще имеют некоторое влияние, коммунистический сектор быстро поднялся.\n \nТеперь мы должны определить, кто должен возглавить партию и нацию к восходящей красной заре."
 SEA_PHI_political_events.17.a:0 "Назначить Евангелиста, нам нужно радикальное руководство."
 SEA_PHI_political_events.17.b:0 "Назначить Сантоса для более интеллектуального подхода."
 SEA_PHI_political_events.18.t:0 "[FROM.GetName] Хочет присоединиться к Коминтерну"
 SEA_PHI_political_events.18.desc:0 "Мы наблюдали за ростом фермеров, заводских рабочих и рыбаков. [PHI.GetNameDef] С большим интересом, и теперь они распространяют дипломатические увертюры на нас, предлагая свою заинтересованность в присоединении к Коминтерну. Как мы должны реагировать?"
 SEA_PHI_political_events.18.a:0 "Добро пожаловать. [FROM.GetName] В Коминтерн"
 SEA_PHI_political_events.18.b:0 "Отказать им"
 SEA_PHI_political_events.19.t:0 "[FROM.GetName] Отказ во въезде в Коминтерн"
 SEA_PHI_political_events.19.desc:0 "Наша делегация [SOV.GetNameDef] Они только что вернулись, но у них плохие новости - нам было отказано во въезде в Коминтерн. По крайней мере, на данный момент мы стоим в одиночестве против приливов тьмы."
 SEA_PHI_political_events.19.a:0 "Сегодня мир кажется немного темнее."
 SEA_PHI_political_events.20.t:0 "Дуглас Макартур отправляется на Филиппины"
 SEA_PHI_political_events.20.desc:0 "Президент [USA.GetLeader] Дуглас Макартур вернулся к активной службе и назначил его командовать недавно сформированными вооруженными силами США на Дальнем Востоке, дислоцированными на Филиппинах. Макартур уже несколько лет работает военным советником на Филиппинах и хорошо информирован об оборонительной ситуации.\n \nДля того, чтобы лучше позволить ему направлять силы на землю там, мы больше не будем иметь над ним контроля. Мы, однако, сможем вспомнить его, если нам понадобятся его таланты здесь. Однако мы должны тщательно подумать об этом, поскольку его уход с Филиппин можно рассматривать как отказ от американских интересов и отказ от наших обязанностей по всему Тихому океану в это решающее время."
 SEA_PHI_political_events.20.a:0 "Удачи, генерал!"
 SEA_PHI_political_events.21.t:0 "Дуглас Макартур прибыл на Филиппины"
 SEA_PHI_political_events.21.desc:0 "Отличные новости! Президент [USA.GetLeader] Генерал Дуглас Макартур командовал армией США на Дальнем Востоке. Мы очень хорошо знакомы с Макартуром, так как во время его отставки он несколько лет служил здесь военным советником, и его назначение и возобновление на постоянную службу является верным признаком того, что он был военным советником. [USA.GetNameDef] Они серьезно относятся к своей ответственности за нашу оборону.\n \nПо прибытии в Манилу он сразу же приступил к обеспечению ресурсов из [USA.GetNameDef]И он поклялся стоять рядом с нашим отважным филиппинским народом против любого вторжения и до самого последнего."
 SEA_PHI_political_events.21.a:0 "Добро пожаловать на Филиппины, генерал!"
 SEA_PHI_political_events.30.t:0 "Эйзенхауэра попросили Филиппины"
 SEA_PHI_political_events.30.desc:0 "Верховный главнокомандующий вооруженными силами США на Дальнем Востоке Дуглас Макартур обратился за помощью к своему протеже Дуайту Д. Эйзенхауэр. Эйзенхауэр уже служил при Макартуре, когда последний был начальником армии, и, очевидно, старший генерал видел его потенциал. Мы сами видим Эйзенхауэра восходящей звездой в армии Соединенных Штатов, и пребывание в таком активном и растущем командовании может принести ему большой опыт.\n\nСам Эйзенхауэр подчеркнул, что не видит в этом долгосрочного назначения, и намерен вернуться в США через два года, как только узнает все, что может, от Макартура и станет офицером штаба действующей службы."
 SEA_PHI_political_events.30.a:0 "Макартур и Эйзенхауэр работают вместе? Абсолютно!"
 SEA_PHI_political_events.30.b:0 "Нет, Эйзенхауэр здесь более важен."
 SEA_PHI_political_events.31.t:0 "Дуайт Ди. Эйзенхауэр прибыл на Филиппины"
 SEA_PHI_political_events.31.desc:0 "Запрос генерала Макартура на Дуайта Д. Эйзенхауэр присоединился к нам на Филиппинах. Нам повезло, что к нам присоединилась такая восходящая звезда, и это еще одно доказательство того, насколько Соединенные Штаты преданы нашей защите. Нам ясно дали понять, что это будет краткосрочное задание сроком примерно два года, однако, возможно, есть способ стимулировать его пребывание на Филиппинах."
 SEA_PHI_political_events.31.a:0 "Добро пожаловать на Филиппины!"
 SEA_PHI_political_events.40.t:0 "Мануэль Кесон убит!"
 SEA_PHI_political_events.40.desc:0 "Мануэль Кесон был убит сегодня в 3 часа дня во время выступления перед сторонниками в Лунета-парке. Стрелок все еще находится на свободе, но есть подозрения в связях с движением Сакдалиста. Национальное собрание было закрыто по соображениям национальной безопасности. Полиция появилась в Маниле, улицы были очищены. Неудобная тишина поселилась над страной, коллективное затаив дыхание на то, что может произойти дальше."
 SEA_PHI_political_events.40.a:0 "Факел демократии гаснет!"
 SEA_PHI_political_events.40.b:0 "Шеф полиции Эйзенхауэр вмешается!"
 PHI_eisenhower_steps_in_tt:0 "§GЭйзенхауэр попытается сорвать фашистские планы§!"
 SEA_PHI_political_events.41.t:0 "Sakdalista Exiles возвращается"
 SEA_PHI_political_events.41.desc:0 "Артемио Рикарте, вернувшись из изгнания с отрядом последователей, вооруженных различными японскими вооружениями, утверждал, что нашел и задержал убийцу Мануэля Кесона, и теперь обещает работать вместе с полицией, чтобы сохранить порядок во время кризиса, вызванного убийством президента. Из-за подозрений, связанных с движением Сакдалистас, он пообещал работать с партией Ганап, чтобы получить легитимность и тем самым ускорить независимость от Соединенных Штатов как можно быстрее. В ответ на это полиция вышла из Манилы якобы для того, чтобы не нагнетать напряженность, в то время как американский гарнизон был приведен в состояние повышенной готовности, хотя еще не предпринял никаких шагов."
 SEA_PHI_political_events.41.a:0 "Независимость становится все ближе."
 SEA_PHI_political_events.42.t:0 "Борьба за лидерство"
 SEA_PHI_political_events.42.desc:0 "Теперь, когда контроль над Филиппинами был установлен, и стабильность начала возвращаться, пришло время для Исполнительной комиссии собраться и определить, где находится окончательная власть в стране. Есть три кандидата на выбор.\n\nЭмилио Агинальдо, герой революции против испанцев, долгое время был сторонником филиппинской независимости и говорил о том, что при США народ Филиппин является просто потребительским рынком для американского экспорта, если не париями, потому что филиппинцы даже не считаются гражданами США.\n\nАртемио Рикарте, начальник филиппинской армии во время войн против Испании и США, затем был сослан за отказ присягнуть на верность американским оккупантам. Его любовь к стране никогда не ослабевала, и даже живя в Японии, он стремился к нашей возможной независимости.\n\nХосе Лорел, более умеренный выбор, этот судья Верховного суда получил образование на международном уровне и имеет семейные связи с японскими официальными лицами, поэтому он может быть хорошо позиционирован для налаживания связей между Филиппинами и японцами и тем самым развивать наше дело о независимости."
 SEA_PHI_political_events.42.a:0 "Агинальдо уже привел нас к независимости."
 SEA_PHI_political_events.42.b:0 "Рикарте несгибаемая преданность нашему делу, которое нам нужно."
 SEA_PHI_political_events.42.c:0 "У Лорел есть связи."
 SEA_PHI_political_events.43.t:0 "Осада Национального собрания"
 SEA_PHI_political_events.43.desc:0 "Артемио Рикарте, вернувшись из изгнания с группой последователей, вооруженных различными японскими вооружениями, утверждал, что нашел и задержал убийцу Мануэля Кесона, однако начальник полиции Эйзенхауэр опроверг это утверждение и заявил, что этот человек был бедным крестьянином, которому заплатили за то, чтобы он был козлом отпущения.\n\nВ ответ на это группа отправилась в Национальное собрание, решив добиться справедливости, и штурмовала здание. У входа были произведены выстрелы, и два прохожих были поражены. Спонсируемые Америкой охранники были обвинены, и Эйзенхауэр был вынужден вывести полицию из района, опасаясь эскалации напряженности.\n\nНесмотря на его усилия, толпы, спровоцированные повстанцами Сакдалисты, прибывшими из соседних регионов, угрожали полностью переполнить полицию. В отчаянии Эйзенхауэр послал срочное сообщение [MessageToMac]Американский гарнизон помощи."
 SEA_PHI_political_events.43.a:0 "Это зависит от [MacOrGarrison] Сейчас."
 PHI_message_to_mac:0 "Генерал Дуглас Макартур "
 PHI_macarthur:0 "Макартур"
 PHI_american_garrison:0 "Американский гарнизон"
 SEA_PHI_political_events.44.t:0 "Военная чрезвычайная ситуация"
 SEA_PHI_political_events.44.desc:0 "Когда это произошло, реакция [MacOrGarrison] Это было внезапно и ошеломляюще. Не рискуя, вся филиппинская дивизия была развернута в Маниле, сначала кавалерия, а затем сразу пехота с неподвижными штыками. Там, где было более упорное сопротивление, слезоточивый газ использовался для очистки сопротивления. Ошеломленные превосходящей силой, ополченцы Сакдалисты были вынуждены покинуть свои баррикады и растаять из города.\n\nХотя первоначальная угроза фашистского переворота была сорвана, все еще остается опасность более широкой эскалации в гражданскую войну. [MacOrEisenhower] Он считает целесообразным объявить военное чрезвычайное положение, ввести военное положение и взять на себя диктаторские полномочия для обеспечения постоянного стабильного управления."
 SEA_PHI_political_events.44.a:0 "Все во имя свободы и демократии!"
 PHI_eisenhower:0 "Эйзенхауэр"
 PHI_declare_military_emergency_tt:0 "Это открыло новую ветвь фокуса на крайне левых."
 SEA_PHI_political_events.45.t:0 "[FROM.GetName] Просить поддержки независимости"
 SEA_PHI_political_events.45.desc:0 "The [FROM.GetAdjective] Правительство обратилось к нам с планами борьбы за независимость. [USA.GetNameDef]. Эти планы еще не были приведены в действие, но они потребовали, чтобы [PHI.GetNameDef] Они требуют независимости, чтобы мы поддержали их требования и присоединились к их борьбе, если им откажут."
 SEA_PHI_political_events.45.a:0 "Это расширяет наше влияние"
 SEA_PHI_political_events.45.b:0 "Мы не можем рисковать войной с [USA.GetNonIdeologyName]"
 SEA_PHI_political_events.46.t:0 "[FROM.GetName] Мы поддерживаем наши планы независимости."
 SEA_PHI_political_events.46.desc:0 "Мы получили сообщение от [FROM.GetAdjective] Правительство заявляет, что оно готово поддержать наше требование независимости. Но только это поможет убедить [ROOT.overlord.GetNameDef], [FROM.GetNameDef] Он также пообещал поддержать нас в военном отношении, если они попытаются отменить какие-либо шаги к независимости."
 SEA_PHI_political_events.46.a:0 "Превосходно!"
 SEA_PHI_political_events.47.t:0 "[FROM.GetName] Отказывается поддерживать планы независимости"
 SEA_PHI_political_events.47.desc:0 "Наши дипломаты были отправлены в [FROM.GetNameDef] Они быстро вернулись после того, как их правительство отказалось обещать помощь для наших шагов к независимости. Хотя они утверждали, что хотят помочь нам, они не могли рисковать ввязаться в войну с нами. [ROOT.overlord.GetNameDef]."
 SEA_PHI_political_events.47.desc.2:0 "Наши дипломаты были отправлены в [FROM.GetNameDef] Они быстро вернулись после того, как их правительство отказалось обещать помощь для наших шагов к независимости. Похоже, что они больше заинтересованы в том, чтобы стать нашим новым повелителем, чем в том, чтоб помочь нам стать независимыми."
 SEA_PHI_political_events.47.a:0 "Похоже, их риторика о деколонизации была разговором."
 SEA_PHI_political_events.48.t:0 "[FROM.GetName] Объявляем независимость"
 SEA_PHI_political_events.48.desc:0 "Ранее сегодня поступили сообщения о нарушениях в [FROM.GetNameDef]. После этого мы получили декларацию о независимости от их правительства, хотя они явно пытались убедить нас не вмешиваться, они ясно дали понять, что не будут уклоняться от борьбы за сохранение своей вновь обретенной независимости."
 SEA_PHI_political_events.48.desc.2:0 "Ранее сегодня поступили сообщения о нарушениях в [FROM.GetNameDef]. После этого мы получили декларацию о независимости от их правительства с четким заявлением о поддержке со стороны правительства. [JAP.GetAdjective] правительство. Хотя заявление призывает нас не вмешиваться, [FROM.GetAdjective] Правительство ясно дало понять, что они не будут уклоняться от борьбы за сохранение своей вновь обретенной независимости. [JAP.GetAdjective] Поддержку."
 SEA_PHI_political_events.48.desc.3:0 "Ранее сегодня поступили сообщения о нарушениях в [FROM.GetNameDef]. После этого мы получили декларацию о независимости от их правительства с четким заявлением поддержки от нескольких южноамериканских правительств. Хотя заявление призывает нас не вмешиваться, [FROM.GetAdjective] Правительство ясно дало понять, что они не будут уклоняться от борьбы за сохранение своей вновь обретенной независимости при поддержке Южной Америки."
 SEA_PHI_political_events.48.desc.4:0 "Ранее сегодня поступили сообщения о нарушениях в [FROM.GetNameDef]. После этого мы получили декларацию о независимости от их правительства с четким заявлением о поддержке со стороны правительства. [SPR.GetAdjective] правительство. Хотя заявление призывает нас не вмешиваться, [FROM.GetAdjective] Правительство ясно дало понять, что они не будут уклоняться от борьбы за сохранение своей вновь обретенной независимости. [SPR.GetAdjective] Поддержку."
 SEA_PHI_political_events.48.desc.5:0 "Ранее сегодня поступили сообщения о нарушениях в [FROM.GetNameDef]. После этого мы получили декларацию о независимости от их правительства с четким заявлением о поддержке со стороны правительства. [SPR.GetAdjective] некоторых южноамериканских правительств. Хотя заявление призывает нас не вмешиваться, [FROM.GetAdjective] Правительство ясно дало понять, что они не будут уклоняться от борьбы за сохранение своей вновь обретенной независимости и при поддержке своих латиноамериканских союзников."
 SEA_PHI_political_events.48.a:0 "Мы все равно их отдадим."
 SEA_PHI_political_events.48.b:0 "Они еще не готовы."
 SEA_PHI_political_events.49.t:0 "[FROM.GetName] Позволяет независимость"
 SEA_PHI_political_events.49.desc:0 "После того, как мы несколько дней не реагировали на нашу декларацию о независимости, предположительно, велись горячие дискуссии между нашими странами. [FROM.GetAdjective] лидерство, [FROM.GetNameDef] Он официально объявил, что признает [ROOT.GetAdjective] Независимость."
 SEA_PHI_political_events.49.a:0 "Отличные новости!"
 SEA_PHI_political_events.50.t:0 "[FROM.GetName] Борьба за восстановление контроля над нами"
 SEA_PHI_political_events.50.desc:0 "В ответ на нашу декларацию о независимости, [FROM.GetNameDef] Он не дал официального ответа и начал перебрасывать войска на близлежащие базы, чтобы вмешаться."
 SEA_PHI_political_events.50.a:0 "Пусть попробуют!"
 SEA_PHI_political_events.51.t:0 "$USA_douglas_macarthur$ отозванный на [FROM.GetNameDef]"
 SEA_PHI_political_events.51.desc:0 "Военная ситуация в [FROM.GetNameDef] Достаточно тяжелая, что $USA_douglas_macarthur$ Им было предложено немедленно вернуться домой."
 SEA_PHI_political_events.51.a:0 "Нам будет его не хватать"
 SEA_PHI_political_events.52.t:0 "$USA_dwight_d_eisenhower$ отозванный на [FROM.GetNameDef]"
 SEA_PHI_political_events.52.desc:0 "Военная ситуация в [FROM.GetNameDef] Достаточно тяжелая, что $USA_dwight_d_eisenhower$ Им было предложено немедленно вернуться домой."
 SEA_PHI_political_events.53.t:0 "$USA_dwight_d_eisenhower$ Возвращение из [PHI.GetName]"
 SEA_PHI_political_events.53.desc:0 "После присоединения $USA_douglas_macarthur$\"Миссия для [PHI.GetNameDef]С 1935 года он играет в ней роль, а в последнее время и более активную. $USA_dwight_d_eisenhower$ Теперь он вернулся домой. Во время миссии он приобрел ценный военный опыт, в том числе впервые пилотировал самолет и работал с командирами. $USA_douglas_macarthur$ с принципиально иными представлениями о реформировании [PHI.GetAdjective] Армия."
 SEA_PHI_political_events.53.a:0 "Его опыт, несомненно, окажется полезным."
 SEA_PHI_political_events.54.desc:0 "С недавними потерями региона Манила наши силы утратили уверенность в победе в войне с традиционной тактикой. По мере того как армия официально сдается, а наше правительство эвакуируется, новые организации для сопротивления врагу уже формируются."
 SEA_PHI_political_events.54.a:0 "Мы можем продолжать войну с партизанами."
 SEA_PHI_political_events.55.t:0 "$PHI_treaty_of_manila$"
 SEA_PHI_political_events.55.desc:0 "После значительной экономической и политической подготовки, [PHI.GetNameDef] Он провозгласил независимость. Это предсказуемо происходит после акта Тайдингса-Макдаффи, который Конгресс подписал в 1934 году. [PHI.GetAdjective] Независимость.[PHI.GetNameDef] Теперь он может свободно создавать свою собственную политическую и экономическую политику без давления со стороны государства. [USA.GetNameDef]."
 SEA_PHI_political_events.55.a:0 "Хорошо для них"
 SEA_PHI_political_events.55.b:0 "Теперь мы можем сотрудничать на равных."
 SEA_PHI_political_events.55.c:0 "Мы должны добиваться дипломатической независимости."
 SEA_PHI_political_events.56.t:0 "[FROM.GetName] Контроль над Тихоокеанским флотом"
 SEA_PHI_political_events.56.desc:0 "Стремясь создать военно-морской флот и внести дальнейший вклад в наши военные усилия, [FROM.GetNameDef] Мы попросили передать одну или несколько целевых групп, которые действуют в непосредственной близости от их контроля."
 SEA_PHI_political_events.56.a:0 "Мы можем управлять нашим флотом."
 SEA_PHI_political_events.56.b:0 "Пусть у них будет местная оперативная группа."
 SEA_PHI_political_events.56.c:0 "Пусть они обрабатывают Тихий океан."
 SEA_PHI_political_events.56.d:0 "Пусть они управляют Тихим океаном, но посылают начальника."
 SEA_PHI_political_events.56.e:0 "Пусть они обрабатывают Тихий океан и поставляют топливо."
 PHI_transfer_20_percent_navy_tt:0 "20 % наших военно-морских сил должны быть переданы [FROM.GetNameDef]."
 PHI_transfer_40_percent_navy_tt:0 "40 процентов наших военно-морских сил должны быть переданы [FROM.GetNameDef]."
 SEA_PHI_political_events.57.t:0 "доверенные военно-морским силам"
 SEA_PHI_political_events.57.desc:0 "Наш запрос на контроль над местными [FROM.GetAdjective] Военно-морские силы были одобрены правительством. Рабочие группы были направлены в наши порты до реорганизации."
 SEA_PHI_political_events.57.desc.2:0 "$SEA_PHI_political_events.57.desc$ Кроме того, нефтяные месторождения в [371.GetName] Теперь мы намерены производить топливо для наших сил, чтобы поддерживать их логистику после этого крупного приобретения."
 SEA_PHI_political_events.57.a:0 "Это существенно повышает наши военные возможности."
 SEA_PHI_political_events.58.t:0 "[FROM.GetName] Отказывается делегировать флот"
 SEA_PHI_political_events.58.desc:0 "К сожалению, наша [FROM.GetAdjective] Союзник отклонил нашу просьбу о частичном делегировании своего флота нашим военным. Похоже, нам придется наращивать производство верфей, если мы хотим внести свой вклад в военно-морской театр."
 SEA_PHI_political_events.58.a:0 "Мы должны сосредоточиться на создании собственного флота."
 SEA_PHI_political_events.59.t:0 "Неудача [USA.GetAdjective] Вмешательство"
 SEA_PHI_political_events.59.desc:0 "Хотя [USA.GetNameDef] Начало военной интервенции против [PHI.GetNameDef] Чтобы свергнуть новое правительство, этот план не удался. Поскольку обе стороны признают, что война только затягивается, переговоры начали ее заканчивать. [PHI.GetAdjective] Независимость теперь признана."
 SEA_PHI_political_events.59.a:0 "Свобода возобладала"
 SEA_PHI_political_events.59.b:0 "Война становится непопулярной"
 SEA_PHI_political_events.60.t:0 "[ROOT.GetNeutralParty] Вопросы по результатам выборов"
 SEA_PHI_political_events.60.desc:0 "После президентских выборов 1935 года, [ROOT.GetNeutralLeader] Он до сих пор не принял своего значительного поражения и оспаривает этот вопрос с советом, отвечающим за выборы. Если будут найдены доказательства вмешательства, сторона, скорее всего, передаст дело в один из высших судов страны."
 SEA_PHI_political_events.60.a:0 "Наверное, просто больной неудачник"
 SEA_PHI_political_events.61.t:0 "Судебная власть отменила выборы"
 SEA_PHI_political_events.61.desc:0 "После тщательного расследования Совет, ответственный за расследование результатов выборов 1935 года, заявил, что обнаружил доказательства нарушений. Это само по себе было бы не очень примечательно, если бы не последующие действия судебных органов, которые дисквалифицировали [ROOT.GetDemocraticParty]В результате чего a [ROOT.GetNeutralParty] Победа.[USA.GetAdjective] Попытки быстро отклонить этот процесс привели к негативным последствиям, поскольку он был расценен как еще одно доказательство коррупции."
 SEA_PHI_political_events.61.a:0 "Они знают, что лучше для страны."
 SEA_PHI_political_events.62.t:0 "Волонтеры гражданской войны в Испании?"
 SEA_PHI_political_events.62.desc:0 "Наши исторические и культурные связи с [SPR.GetNonIdeologyName] Это означает, что за конфликтом внимательно следил наш народ."
 SEA_PHI_political_events.62.a:0 "Националисты борются за наши католические ценности"
 SEA_PHI_political_events.62.b:0 "Республиканцы борются за свободу и свободу"
 SEA_PHI_political_events.63.t:0 "[GetYear] Президентские выборы"
 SEA_PHI_political_events.63.desc:0 "Срок полномочий действующего президента [ROOT.GetLeader] Он подходит к концу, и в ближайшее время состоятся выборы следующего президента. Хотя успехи [ROOT.GetLeader]Лидерство формирует перспективную картину возможности его дальнейшего лидерства, некоторые избиратели ищут новое направление для наших реформ и нового президента, чтобы направлять их."
 SEA_PHI_political_events.63.keep_leader:0 "[ROOT.GetLeader] должен остаться на другой срок"
 SEA_PHI_political_events.63.roxas:0 "$PHI_manuel_roxas$Связи помогут с экономической реформой"
 SEA_PHI_political_events.63.laurel:0 "$PHI_jose_laurel$ Он был бы хорошим лидером в эти периоды беспорядков."
 SEA_PHI_political_events.64.t:0 "Смерть $PHI_manuel_luis_quezon$"
 SEA_PHI_political_events.64.desc_quezon:0 "После развития туберкулеза постепенное снижение $PHI_manuel_luis_quezon$Здоровье привело к его смерти. Вице-президент временно взял на себя бывшие обязанности Кесона, пока страна скорбит, но вскоре настанет время определить преемника."
 SEA_PHI_political_events.64.desc_generic:0 "Нынешний срок [ROOT.GetLeader] Мы подошли к концу, и новые президентские выборы теперь решают нашего следующего президента. Из-за ухудшения здоровья, $PHI_manuel_luis_quezon$ Он вышел из гонки."
 SEA_PHI_political_events.65.t:0 "Дуайт Ди. Эйзенхауэр остается в [USA.GetName]"
 SEA_PHI_political_events.65.desc:0 "К сожалению, наша просьба об укреплении [USA.GetAdjective] Военная миссия в [ROOT.GetNameDef] Ему было отказано. Другие военные планы [USA.GetNameDef] Видимо, ему нужны знания."
 SEA_PHI_political_events.65.a:0 "Стыд"
 SEA_PHI_political_events.66.t:0 "[FROM.GetName] Договор о взаимной помощи"
 SEA_PHI_political_events.66.desc:0 "Как и в другой стране, [USA.GetAdjective] Сфера влияния, [FROM.GetNameDef] В настоящее время мы стремимся улучшить сотрудничество в этой сфере путем создания альянса латиноамериканских стран. Это может стать противовесом для [USA.GetAdjective] Это давление иногда граничит с империализмом."
 SEA_PHI_political_events.66.a:0 "Это обеспечит стабильность в регионе."
 SEA_PHI_political_events.66.b:0 "Мы не можем отчуждать [USA.GetNameDef]"
 SEA_PHI_political_events.67.t:0 "[FROM.GetName] Подписан договор о взаимной помощи"
 SEA_PHI_political_events.67.desc:0 "[FROM.GetNameDefCap] Мы подписали предложенный договор о взаимопомощи, в котором прописан условный союз, который сейчас вступит в силу. Это первый очевидный шаг к укреплению. [FROM.GetAdjective]-[ROOT.GetAdjective] сотрудничество."
 SEA_PHI_political_events.67.a:0 "Отличные новости."
 PHI_will_join_faction_later_tt:0 "§Y[ROOT.GetNameDefCap]§! присоединится к §Yфракция [FROM.GetNameDef]§! После того, как он завершится §Y$PHI_war_of_independence$§!"
 PHI_will_join_faction_later_PHI_tt:0 "§Y[FROM.GetNameDefCap]§! присоединится к §Yфракция [ROOT.GetNameDef]§! После того, как он завершится §Y$PHI_war_of_independence$§!"
 SEA_PHI_political_events.68.t:0 "[FROM.GetName] Не подписывает договор о взаимной помощи"
 SEA_PHI_political_events.68.desc:0 "Идеологические различия или опасения по поводу отчуждения [USA.GetNameDef] привести к [FROM.GetNameDef] Не подписывая договор о взаимопомощи, мы должны искать союзников в других странах."
 SEA_PHI_political_events.68.a:0 "Возможно, их соперники в регионе будут более охотно"
 SEA_PHI_political_events.69.t:0 "[FROM.GetName] Предлагает объединение"
 SEA_PHI_political_events.69.desc:0 "После обретения независимости, [FROM.GetNameDef] Многие страны предприняли шаги по укреплению своей независимости и теперь хотят расширить сотрудничество с другими латиноамериканскими странами. Теперь это проявляется как предложение объединить нашу страну с их в испаноязычной империи."
 SEA_PHI_political_events.69.a:0 "Вместе мы сможем отомстить за нашу колонизацию."
 SEA_PHI_political_events.69.b:0 "Мы не будем управляться от [FROM.capital.GetCapitalVictoryPointName]"
 SEA_PHI_political_events.70.t:0 "[FROM.GetName] Принять Объединение"
 SEA_PHI_political_events.70.desc:0 "Волна волн [FROM.GetAdjective] Представители, посещающие [ROOT.capital.GetCapitalVictoryPointName] В нем было четко указано, что было подтверждено несколькими днями позже: [FROM.GetNameDef] Мы приняли нашу просьбу объединиться с [ROOT.GetNameDef]."
 SEA_PHI_political_events.70.a:0 "Отличные новости!"
 SEA_PHI_political_events.71.t:0 "[FROM.GetName] Отказывается от объединения"
 SEA_PHI_political_events.71.desc:0 "[FROM.GetNameDefCap] Мы решили не соглашаться с нашим предложением об объединении. Хотя они сообщили, что считают наш альянс ценным, они также сочли это слишком далеко."
 SEA_PHI_political_events.71.a:0 "Тогда, возможно, наши различия больше, чем мы думали."
 SEA_PHI_political_events.71.b:0 "Мы должны настаивать"
 GetOppositionPartySupportersName_democratic:0 "республиканцы"
 GetOppositionPartySupportersName_communism:0 "Коммунисты"
 GetOppositionPartySupportersName_fascist:0 "Фашисты"
 GetOppositionPartySupportersName_neutrality:0 "авторитаристы"
 GetOppositionPartySupportersName_backup:0 "Активисты"
 GetOppositionPartyAdjective_democratic:0 "республиканец"
 GetOppositionPartyAdjective_communism:0 "коммунистический"
 GetOppositionPartyAdjective_fascist:0 "фашистский"
 GetOppositionPartyAdjective_neutrality:0 "авторитарный"
 GetOppositionPartyAdjective_backup:0 "Активист"
 GetOppositionPartyName_democratic:0 "[ROOT.GetDemocraticParty]"
 GetOppositionPartyName_communism:0 "[ROOT.GetCommunistParty]"
 GetOppositionPartyName_fascist:0 "[ROOT.GetFascistParty]"
 GetOppositionPartyName_neutrality:0 "[ROOT.GetNeutralParty]"
 GetOppositionPartyName_backup:0 "Оппозиция"
 SEA_generic_events.2.t:0 "[GetOppositionPartyName] Организовывает забастовку"
 SEA_generic_events.2.desc:0 "[GetOppositionPartyAdjective] Рабочие на местной фабрике ненадолго сорвали производство, протестуя за улучшение условий труда и большую политическую свободу. Несмотря на ограниченные масштабы, забастовка действительно показывает популярность британцев. [GetOppositionPartyName]."
 SEA_generic_events.2.a:0 "Они будут заменены"
 SEA_generic_events.2.b:0 "Вмешательство только вызовет больше проблем."
 SEA_generic_events.3.t:0 "[GetOppositionPartySupportersName] Протесты против слабого правительства"
 SEA_generic_events.3.desc:0 "Сторонники [GetOppositionPartyName] Сообщается, что они проводят демонстрацию в столице, критикуют неэффективность правительства и, похоже, продвигают более централизованное правительство."
 SEA_generic_events.3.a:0 "Им повезло, что они имеют такое право."
 SEA_generic_events.4.t:0 "[GetOppositionPartySupportersName] Прорывное заседание правительства"
 SEA_generic_events.4.desc:0 "Небольшая группа [GetOppositionPartyName] Сторонники недавно сорвали заседание правительства небольшим, но громким протестом. Хотя подобные инциденты и безвредны, все большее распространение подобных инцидентов говорит о поддержке оппозиционных движений."
 SEA_generic_events.4.a:0 "Отрицать свои действия"
 SEA_generic_events.4.b:0 "Отказаться от мероприятия"
 SEA_generic_events.5.t:0 "[GetOppositionPartyName] Провести ралли"
 SEA_generic_events.5.desc:0 "The [GetOppositionPartyName] Сегодня прошел один из крупнейших митингов последнего времени, обещая предложить сильную альтернативу правительству [ROOT.GetLeader]. В настоящее время правительство не уверено, следует ли ему просто игнорировать митинг или предотвратить распространение новостей о нем, поскольку в противном случае это могло бы привлечь новых сторонников на митинг. [GetOppositionPartyAdjective] Причина."
 SEA_generic_events.5.a:0 "Убедитесь, что новости не освещают его"
 SEA_generic_events.5.b:0 "Хорошо для них"
 SEA_generic_events.6.t:0 "Правительственная схема подрыва [GetOppositionPartyName] разоблаченный"
 SEA_generic_events.6.desc:0 "Скандал с участием [ROOT.GetRulingParty]Выровненные правительственные чиновники появились на свет после того, как был найден документ, в котором излагались их планы по подрыву. [GetOppositionPartyName] саботировать их финансирование. Несмотря на то, что чиновники действовали независимо, это не было чем-то, что они могли бы сделать. [GetOppositionPartySupportersName] Скорее всего, поверят."
 SEA_generic_events.6.a:0 "публично извиниться"
 SEA_generic_events.6.b:0 "Мы будем дистанцироваться от этой схемы."
 SEA_generic_events.7.t:0 "[GetOppositionPartyName] Организуйте большой митинг"
 SEA_generic_events.7.desc:0 "The [GetOppositionPartyAdjective] Сегодня партия проводит митинг, и появились сообщения, которые предсказывают посещаемость в том же масштабе, что и в прошлом году. [ROOT.GetRulingParty] митинги. Мы можем только надеяться, что наши сторонники не смогут справиться со своими проблемами."
 SEA_generic_events.7.a:0 "Давайте организуем один из наших, основываясь на их проблемах."
 SEA_generic_events.8.t:0 "[GetOppositionPartySupportersName] Причастны к уличным столкновениям"
 SEA_generic_events.8.desc:0 "Популярность [GetOppositionPartyName] вызвала проблемы сегодня, когда группа его сторонников столкнулась со сторонниками правительства и правительства. [ROOT.GetRulingParty]Пока полиция не вмешалась. Несмотря на то, что инцидент был локализован, он по-прежнему показывает непростую политическую обстановку."
 SEA_generic_events.8.a:0 "Мы можем использовать это, чтобы осудить [GetOppositionPartyName]"
 SEA_generic_events.8.b:0 "Сосредоточьтесь на осуждении насилия"
 SEA_generic_events.9.t:0 "Иностранные агенты эксплуатируют [GetOppositionPartyAdjective] популярность"
 SEA_generic_events.9.desc:0 "После недавних сообщений о волнениях армия и полиция независимо друг от друга пришли к выводу, что члены вооруженных сил [GetOppositionPartyName] На них влияют другие страны, которые пытаются подорвать или шпионить за нашим правительством."
 SEA_generic_events.9.a:0 "Публично осуждать [GetOppositionPartyName] как иностранные агенты"
 SEA_generic_events.9.b:0 "Сосредоточьтесь на искоренении незваных"
 SEA_generic_events.10.t:0 "Скандал с коррупцией в правительстве"
 SEA_generic_events.10.desc:0 "Рост популярности оппозиционных движений, таких как: [GetOppositionPartyName] Это заставило правительство прибегнуть к все более творческим мерам, чтобы остаться у власти. Одна из таких схем была недавно раскрыта, и масштабы ресурсов, вводимых для обеспечения безопасности, были ограничены. [ROOT.GetRulingParty] Власть вызвала серьезную реакцию."
 SEA_generic_events.10.a:0 "Мы будем отрицать все"
 SEA_generic_events.10.b:0 "Расстояние от вовлеченных фигур"
 SEA_generic_events.11.t:0 "[GetOppositionPartyAdjective] Докеры вышли на забастовку"
 SEA_generic_events.11.desc:0 "Работники военно-морской промышленности, которые поддерживают [GetOppositionPartyName] Это особенно сильно, мы начали масштабный удар, который сейчас срывает наши судостроительные усилия. Хотя их политические проблемы вряд ли можно смягчить, мы все же могли бы избежать большего количества беспорядков, улучшив условия их работы."
 SEA_generic_events.11.a:0 "Мы гарантируем, что они будут справедливо компенсированы."
 SEA_generic_events.11.b:0 "Это взорвется"
 SEA_generic_events.12.t:0 "[GetOppositionPartySupportersName] Противодействие оборонным мерам"
 SEA_generic_events.12.desc:0 "Сторонники этого [GetOppositionPartyName] Сегодня оппозиция провела акцию протеста, которая требует от нас смягчить наращивание военной мощи, опасаясь, что наша растущая армия будет развернута за рубежом."
 SEA_generic_events.12.desc_wartime:0 "Сторонники этого [GetOppositionPartyName] и другие оппозиционные партии провели сегодня акцию протеста, требующую прекращения нашей нынешней войны, считая жертву нашей армии ненужной для того, чтобы [ROOT.GetAdjective] интересов."
 SEA_generic_events.12.a:0 "Убедиться в том, что это только для защиты страны."
 SEA_generic_events.12.b:0 "Убедите их, что мы хотим достичь мира."
 SEA_generic_events.12.c:0 "Отказаться комментировать"
 SEA_generic_events.13.t:0 "[GetOppositionPartyAdjective] Сторонники Riot [root.capital.GetCapitalVictoryPointName]"
 SEA_generic_events.13.desc:0 "До того, как полиция успела сообщить нам об этом, правительственные чиновники сообщали о беспорядках во время работы в полиции. [root.capital.GetCapitalVictoryPointName]. То, что начиналось как крупная политическая демонстрация против [ROOT.GetRulingParty] Они превратились в грабежи, причинив ущерб всему городу."
 SEA_generic_events.13.a:0 "Пусть уважаемый политик успокоит толпу"
 SEA_generic_events.13.b:0 "Отправить в армию"
 SEA_generic_events.14.t:0 "Крупный антиправительственный протест"
 SEA_generic_events.14.desc:0 "Огромная популярность этого [GetOppositionPartyName] Если у него не будет большой власти в правительстве, это приведет к многочисленным протестам по всей стране. Удовлетворение требований некоторых протестующих может разрядить ситуацию, но у него есть свои проблемы."
 SEA_generic_events.14.a:0 "Мы включим несколько из них. [GetOppositionPartyAdjective] предложения"
 SEA_generic_events.14.b:0 "Протесты должны оставаться мирными"
 SEA_generic_events.15.t:0 "[GetOppositionPartyAdjective] Протесты становятся жестокими"
 SEA_generic_events.15.desc:0 "Мы получили известие, что местная массовая акция протеста, организованная [GetOppositionPartyName] Пролилась кровь после того, как предметы, брошенные в полицию, вызвали выстрелы в ответ. Этот инцидент, хотя ни правительство, ни правительство не [GetOppositionPartySupportersName]По его словам, вина вызывает серьезные опасения по поводу стабильности в стране."
 SEA_generic_events.15.a:0 "Осудить местных партийных чиновников"
 SEA_generic_events.15.b:0 "Виноваты протестующие"
 SEA_warlords.1.t:0 "Смерть Лю Сян"
 SEA_warlords.1.desc:0 "С уходом Лю Сяна и постоянно растущим давлением со стороны Центрального правительства становится все более очевидным, что [ROOT.GetNameDef] В скором времени может быть распущен. Однако есть те, кто считает, что эта смерть не случайность, а скорее убийство, и хотел бы продолжить борьбу, рискуя разозлить центральное правительство."
 SEA_warlords.1.a:0 "[ROOT.GetNameDefCap] Он служил своей цели."
 SEA_warlords.1.b:0 "Мы должны продолжать борьбу!"
 SEA_warlords.2.t:0 "[FROM.GetNameDefCap] Остается непоколебимым"
 SEA_warlords.2.desc:0 "После кончины Лю Сян [FROM.GetNameDef] Он был поражен борьбой за власть, ведущей к вознесению Ян Сена. После слухов о том, что Лю Сян был убит нашими силами, они заняли позицию, дистанцировавшуюся от нашего правительства и сопротивляющуюся интеграции."
 SEA_warlords.2.a:0 "Эти наглые генералы!"
 SEA_warlords.2.b:0 "О, хорошо."
 SEA_warlords.3.t:0 "[FROM.GetNameDefCap] Принять интеграцию"
 SEA_warlords.3.desc:0 "После кончины Лю Сян [FROM.GetNameDef] Он быстро распался и теперь находится под нашей властью. Мы должны использовать это в своих интересах."
 SEA_warlords.3.a:0 "Превосходно."
 SEA_warlords.4.t:0 "Второе Кумульское восстание"
 SEA_warlords.4.desc:0 "С началом нашего марша против Хотана Юлбарс Хан объявил о своей поддержке Ма Хушана и призвал к восстанию против нашей администрации из-за Хами. Теперь мы сражаемся на двух фронтах."
 SEA_warlords.4.a:0 "Тогда мы их тоже раздавим!"
 SEA_warlords.4.b:0 "Мы должны воспользоваться этой возможностью! Да здравствует Хан!"
 SEA_warlords.5.t:0 "Застойный конфликт"
 SEA_warlords.5.desc:0 "С ростом давления со стороны центрального правительства и снижением морального духа наших войск становится ясно, что мы должны прекратить наши бесплодные бои и обратиться к более серьезным угрозам, нависшим над Китаем. День потерян, силы Ма Хушаня продолжат оккупировать южные части нашей провинции."
 SEA_warlords.5.a:0 "Тогда мы будем тратить наше время..."
 SEA_warlords.6.t:0 "[FROM.GetLeader] Просьбы о помощи"
 SEA_warlords.6.desc:0 "[FROM.GetLeader] Он попросил нашей помощи в борьбе с [SIK.GetLeader]. Хотя их потеря означала бы, что мы потеряем свои позиции в провинции, также важно не злить Советы, поскольку это означало бы потерю потенциального партнера и гаранта."
 SEA_warlords.6.a:0 "Отправляйте как можно меньше, чтобы избежать советского внимания."
 SEA_warlords.6.b:0 "Советы прокляты, у них есть наша полная поддержка."
 SEA_warlords.6.c:0 "Мы ничего не можем пощадить"
 SEA_warlords.7.t:0 "Минимальная помощь приходит"
 SEA_warlords.7.desc:0 "Центральное правительство решило оказать нам минимальную поддержку, чтобы не разозлить советскую власть, поскольку она ценит свое партнерство с нацией за наше выживание."
 SEA_warlords.7.a:0 "По крайней мере, это что-то"
 SEA_warlords.8.t:0 "Помощь приходит"
 SEA_warlords.8.desc:0 "Центральное правительство решило полностью поддержать наши усилия по обеспечению того, чтобы Советы не захватывали нашу провинцию, и с этим риском для их собственных отношений с государством."
 SEA_warlords.8.a:0 "С этим мы можем переломить ситуацию!"
 SEA_warlords.9.t:0 "Помощь не прибыла"
 SEA_warlords.9.desc:0 "Центральное правительство решило не оказывать нам никакой помощи, чтобы угодить советским властям, поскольку они ценят свое партнерство с нацией гораздо больше, чем наше выживание."
 SEA_warlords.9.a:0 "Эти проклятые предатели"
 SEA_warlords.10.t:0 "$KUM_yulbars_khan$ Прибытие в Хотан"
 SEA_warlords.10.desc:0 "После падения Кумульского ханства, $KUM_yulbars_khan$ Ему удалось избежать захвата и бежать к нам, чтобы продолжить борьбу с нашим общим врагом. Мы должны приветствовать его с распростертыми объятиями."
 SEA_warlords.10.a:0 "Мы сразу же заставим его работать!"
 SEA_warlords.11.t:0 "$KUM_yulbars_khan$ Прибывает"
 SEA_warlords.11.desc:0 "$KUM_yulbars_khan$Гоминьдановский генерал вернулся на нашу сторону после неудавшегося восстания против войск. [SIK.GetLeader]Губернатор провинции Синьцзян. Мы должны приветствовать его с распростертыми объятиями."
 SEA_warlords.11.a:0 "Время продолжать борьбу"
 SEA_warlords.12.t:0 "$XSM_ma_hongbin$ Прибывает"
 SEA_warlords.12.desc:0 "После падения государства Ма Хушань, $XSM_ma_hongbin$ Он сбежал из плена и, в конце концов, добрался до нас, где он сейчас проживает. Мы должны использовать его опыт и знания в предстоящих боях."
 SEA_warlords.12.a:0 "Добро пожаловать домой."
 SEA_warlords.13.t:0 "Предатель возвращается"
 SEA_warlords.13.desc:0 "После падения войск Ма Хушана $KHM_mahmut_muhiti$Бывший губернатор Кашгара, который объединил свои силы с повстанцами, предложил вернуться, чтобы снова служить губернатором и офицером нашего правительства. Кажется, он хочет получить второй шанс искупить себя, но с учетом своих прошлых действий может быть неразумно доверять ему."
 SEA_warlords.13.a:0 "Мы не будем доверять предателям."
 SEA_warlords.13.b:0 "У него будет второй шанс."
 SEA_warlords.14.t:0 "[From.GetLeader] Требует поддержки"
 SEA_warlords.14.desc:0 "$wtt_political_warlord_support.10.desc$"
 SEA_warlords.14.a:0 "$wtt_political_warlord_support.10.a$"
 SEA_warlords.14.b:0 "$wtt_political_warlord_support.10.b$"
 SEA_warlords.14.c:0 "Попросите рабочую силу."
 SEA_warlords.14.d:0 "$wtt_political_warlord_support.10.d$"
 SEA_warlords.15.t:0 "$wtt_political_warlord_support.11.t$"
 SEA_warlords.15.desc:0 "$wtt_political_warlord_support.11.desc$"
 SEA_warlords.15.a:0 "$wtt_political_warlord_support.11.a$"
 SEA_warlords.15.b:0 "$wtt_political_warlord_support.11.b$"
 SEA_warlords.16.t:0 "$wtt_political_warlord_support.13.t$"
 SEA_warlords.16.desc:0 "$wtt_political_warlord_support.13.desc$"
 SEA_warlords.16.a:0 "$wtt_political_warlord_support.13.a$"
 SEA_warlords.16.b:0 "Неприемлемо."
 SEA_warlords.17.t:0 "$wtt_political_warlord_support.12.t$"
 SEA_warlords.17.desc:0 "$wtt_political_warlord_support.12.desc$"
 SEA_warlords.17.a:0 "$wtt_political_warlord_support.12.a$"
 SEA_warlords.17.b:0 "Неприемлемо."
 SEA_warlords.18.t:0 "$wtt_political_warlord_support.3.t$"
 SEA_warlords.18.desc:0 "$wtt_political_warlord_support.3.desc$"
 SEA_warlords.18.a:0 "$wtt_political_warlord_support.3.a$"
 SEA_warlords.19.t:0 "$wtt_political_warlord_support.21.t$"
 SEA_warlords.19.desc:0 "$wtt_political_warlord_support.21.desc$"
 SEA_warlords.19.a:0 "$wtt_political_warlord_support.21.a$"
 SEA_warlords.20.t:0 "Офицеры из [FROM.GetName] Прибытие"
 SEA_warlords.20.desc:0 "$wtt_political_warlord_support.23.desc$"
 SEA_warlords.20.a:0 "$wtt_political_warlord_support.23.a$"
 SEA_warlords.21.t:0 "$wtt_political_warlord_support.22.t$"
 SEA_warlords.21.desc:0 "$wtt_political_warlord_support.22.desc$"
 SEA_warlords.21.a:0 "$wtt_political_warlord_support.22.a$"
 SEA_warlords.22.t:0 "Смерть Лю Сян"
 SEA_warlords.22.desc:0 "После смерти Лю Сяна, лидера [SIC.GetNameDef]Становится все более очевидным, что мы должны вмешаться и взять под контроль непосредственно, чтобы не рисковать потерять территорию кому-то менее благоприятному для нашего правительства. Однако это может привести к дальнейшему противостоянию меньших командиров, которые в настоящее время стремятся к власти, поэтому мы все еще должны действовать осторожно."
 SEA_warlords.22.a:0 "Мы должны вмешаться."
 SEA_warlords.22.b:0 "Пусть они будут"
 SEA_warlords.23.t:0 "Государство [From.GetNameDefCap] требует подчинения"
 SEA_warlords.23.desc:0 "Кажется, что [From.GetLeader] Началась борьба за Китай, и это сплотило других военачальников на его сторону против центрального правительства. Если мы присоединимся, то рискуем отдать большую часть наших полномочий. [From.GetNameDef]Но отказ может вызвать их гнев."
 SEA_warlords.23.a:0 "Лучше сражаться вместе, чем в одиночку."
 SEA_warlords.23.b:0 "Мы никогда не будем подавать"
 SEA_warlords.24.t:0 "[From.GetLeader] подчиняется"
 SEA_warlords.24.desc:0 "[From.GetLeader] Он с энтузиазмом откликнулся на наше предложение объединиться против центрального правительства и пообещал помочь нам в этой борьбе. Сейчас мы сделали еще один шаг к объединению нашей страны."
 SEA_warlords.24.a:0 "Отлично."
 SEA_warlords.25.t:0 "[From.GetLeader] отказывается"
 SEA_warlords.25.desc:0 "[From.GetLeader] Он ответил на наше предложение объединиться в битве за Китай серией оскорблений и проклятий, утверждая, что наша миссия - это просто еще одна неудачная попытка захвата власти и подчинения провинций. Похоже, мы не будем иметь их на нашей стороне в этой битве."
 SEA_warlords.25.a:0 "И мы их тоже будем уничтожать!"
 SEA_warlords.26.t:0 "[FROM.GetLeader] Требует нашего представления"
 SEA_warlords.26.desc:0 "После ряда шагов, пытающихся утвердить доминирование в регионе и семье Ма, [FROM.GetLeader] Он решил, что в наших интересах поклясться ему в верности.[FROM.GetLeader] Он также заявил, что если мы откажемся от его предложения, мы будем наказаны и наши армии будут уничтожены, но выбор в конечном итоге зависит от нас."
 SEA_warlords.26.a:0 "У нас нет другого выбора, кроме как принять"
 SEA_warlords.26.b:0 "Мы никогда не сдадимся!"
 SEA_warlords.27.t:0 "[FROM.GetLeader] Сдаться"
 SEA_warlords.27.desc:0 "Опасаясь, что боевые действия приведут лишь к еще большему кровопролитию и нестабильности в регионе, [FROM.GetLeader] Он решил, что будет лучше поклясться нам в верности."
 SEA_warlords.27.a:0 "Отличные новости."
 SEA_warlords.28.t:0 "[FROM.GetLeader] Непревзойденный"
 SEA_warlords.28.desc:0 "Несмотря на все наши усилия, направленные на предотвращение дальнейшего кровопролития, [FROM.GetLeader] Он отправил оскорбительное письмо, в котором утверждал, что наши угрозы пусты и что армии не имеют права на это. [FROM.GetNameDef] Мы пройдем весь путь назад, чтобы [ROOT.Capital.GetName] Если мы хотим осуществить вторжение."
 SEA_warlords.28.a:0 "И мы их уничтожим."
 SEA_warlords.29.t:0 "[FROM.GetLeader] Предлагает мир"
 SEA_warlords.29.desc:0 "После недавних событий в войне, [FROM.GetLeader] Он решил, что больше не стоит воевать против нас и что вместо этого мы должны объединиться против большего врага. С этим [FROM.GetLeader] Мы также предложили полную амнистию для наших солдат и лидеров, если мы хотим принять, прощая их за любое потенциальное преступление против Китая в обмен на присоединение к оружию."
 SEA_warlords.29.a:0 "Звучит разумно."
 SEA_warlords.29.b:0 "Мы никогда не сдадимся!"
 SEA_warlords.30.t:0 "[FROM.GetLeader] Отказывается сдаваться"
 SEA_warlords.30.desc:0 "Утверждать, что наше предложение мира и амнистии - это просто обман, чтобы уничтожить. [FROM.GetNameDef], [FROM.GetLeader] Он отказался прекратить боевые действия и начал новое наступление сегодня утром. Потребуется больше, чем просто письмо, чтобы положить конец конфликту."
 SEA_warlords.30.a:0 "Этот предатель!"
 SEA_warlords.31.t:0 "[FROM.GetLeader] Требует передачи [434.GetName]"
 SEA_warlords.31.desc:0 "После недавних провокаций вдоль границы [FROM.GetLeader] Мы официально обратились с просьбой вывести наши войска из страны. [434.GetName] и передать его в руки [FROM.GetAdjective] властей. Если мы откажемся, он утверждает, что [FROM.GetName] Они ответят военной силой и не прекратят маршировать, пока не достигнут Дели."
 SEA_warlords.31.a:0 "Они не оставляют нам выбора"
 SEA_warlords.31.b:0 "Пусть попробуют"
 SEA_warlords.32.t:0 "[FROM.GetLeader] Отказы"
 SEA_warlords.32.desc:0 "Несмотря на все наши усилия убедить их, наши усилия по дипломатическому захвату [434.GetName] Они были бесплодны. Повторяя линию МакМэхона, [FROM.GetLeader] Он заявил, что мы не имеем права на территорию и что наша провокация является просто блефом."
 SEA_warlords.32.a:0 "Тогда мы будем сражаться"
 SEA_warlords.33.t:0 "[FROM.GetLeader] Договорились о переводе [434.GetName]"
 SEA_warlords.33.desc:0 "После нескольких напряженных дней, [FROM.GetLeader] договорились о передаче [434.GetName] Откажитесь от линии МакМэхона, утверждая, что попытки ее обеспечить приведут лишь к большим проблемам, чем это того стоит. С этим наша страна становится еще больше."
 SEA_warlords.33.a:0 "Отлично."
 tsr_sichuan_border_war.1.t:0 "[SIC.GetNameDefCap] Завоеватели [601.GetName]"
 tsr_sichuan_border_war.1.desc:0 "После стремительной кампании в [601.GetName], [SIC.GetAdjective] Армия под командованием Лю Вэньхуя захватила большую часть провинции и объявила этот район под своим контролем."
 tsr_sichuan_border_war.1.a:0 "Наша сила растет!"
 tsr_sichuan_border_war.1.b:0 "Это не хорошо."
 tsr_sichuan_border_war.2.t:0 "[SIC.GetNameDefCap] выводить из [601.GetName]"
 tsr_sichuan_border_war.2.desc:0 "Столкнувшись с серьезными трудностями [SIC.GetAdjective] Армия отступила от [601.GetName] Они объявили о прекращении своей военной экспедиции. Граница останется такой, какая она есть."
 tsr_sichuan_border_war.2.a:0 "По крайней мере, они не вернули остальную часть Сиккана..."
 tsr_sichuan_border_war.2.b:0 "Сикан стоит!"
 chiang_will_be_shot_tt:0 "§RПосле этого многие будут расстроены Чан Кайши...§!"
 chiang_could_be_shot_tt:0 "§RЕсть некоторые, которые могут быть расстроены с Чан Кай-Шеком после этого.§!"
 SEA_warlords.34.t:0 "Инцидент в Лянгуане"
 SEA_warlords.34.desc:0 "После серии провокаций две провинции Гуанси и Гуандун объединились под предлогом того, что мы слишком пассивны против японцев и поэтому подвергаем сомнению наше правление. Они утверждают, что если мы не будем действовать, они пойдут против наших сил и возьмут Нанкин для себя. Хотя они предложили Чан Кай-Шеку отправиться в Гуанчжоу для дальнейшего обсуждения того, как обращаться с японцами, неясно, является ли это просто ловушкой."
 SEA_warlords.34.a:0 "Мы не потерпим их лжи!"
 SEA_warlords.34.b:0 "Отправьте его в Гуанчжоу, чтобы обсудить этот Объединенный фронт."
 SEA_warlords.35.t:0 "Чан Кайши прибыл в Гуанчжоу"
 SEA_warlords.35.desc:0 "С высокими духами и поднятым вверх оружием Чан Кайши прибыл сегодня утром с небольшим батальоном в качестве охранников. Однако, похоже, что принятие предложения не было ловушкой, и переговоры начались немедленно. Чэнь Цзытан и Ли Цзунрен подтолкнули Чан сформировать единый фронт против японцев, даже зайдя так далеко, что на время прекратили военные действия с коммунистами. Если это правильный выбор, трудно сказать, но это может быть очень хорошо."
 SEA_warlords.35.a:0 "Тогда мы объединимся!"
 SEA_warlords.35.b:0 "Давайте подождем и посмотрим..."
 SEA_warlords.36.t:0 "Дезертирство и предатель"
 SEA_warlords.36.desc:0 "После заявления Нанкина о том, что они не отступят ни от одной из наших угроз и нашего последующего объявления оппозиции, часть нашей армии дезертировала, а генерал Ю Ханму пригрозил, что, если [ROOT.GetLeader] Он не уйдёт в отставку, он пойдёт на Гуанчжоу и вынудит его пройти."
 SEA_warlords.36.a:0 "[ROOT.GetLeader] Придется уволиться"
 SEA_warlords.36.b:0 "Мы не отступим!"
 SEA_warlords.36.c:0 "Только вместе мы сможем противостоять этой угрозе!"
 SEA_warlords.36.tt:0 "§RЕсли Гуанси отклонит наше предложение, мы немедленно впадем в гражданскую войну!§!"
 SEA_warlords.37.t:0 "Борьба за Гуанси"
 SEA_warlords.37.desc:0 "После заявления Нанкина о том, что они не отступят ни от одной из наших угроз и нашего последующего объявления оппозиции, есть те, кто боится, что Центральное правительство заставит нас сдаться их правлению военной силой."
 SEA_warlords.37.a:0 "Тогда пусть они придут!"
 SEA_warlords.37.b:0 "Мы сдаемся."
 SEA_warlords.38.t:0 "Guangxi Clique сдается"
 SEA_warlords.38.desc:0 "Опасаясь, что мы уничтожим их провинцию в процессе вождения [GXC.GetLeader]Вместо этого они предложили, чтобы они стали частью нашей республики в обмен на то, чтобы все лидеры были спасены и сохранили свои позиции. Это кажется справедливым компромиссом."
 SEA_warlords.38.a:0 "Очень хорошо"
 SEA_warlords.39.t:0 "Крах клики Гуандун"
 SEA_warlords.39.desc:0 "После нескольких интенсивных часов на грани гражданской войны Чэнь Цзытан согласился уйти в отставку, и мы перебросили наши войска в Гуандун. То, что будет дальше с провинцией, теперь полностью в наших руках."
 SEA_warlords.39.a:0 "Отлично."
 SEA_warlords.40.t:0 "Гражданская война в Гуандун"
 SEA_warlords.40.desc:0 "После того, как Чэнь Цзитан отказался отступить, несмотря на дезертирство на нашу сторону, а Юй Ханьму пригрозил маршем на Гуанчжоу, провинция впала в полномасштабную гражданскую войну с проправительственными силами против антиправительственных сил. Мы должны вмешаться, чтобы исправить этот хаос."
 SEA_warlords.40.a:0 "Этот упрямый воздушный шар..."
 SEA_warlords.41.t:0 "Guangxi Clique стоит непревзойденно"
 SEA_warlords.41.desc:0 "Утверждая, что наши угрозы вторжения не что иное, как сказка, [GXC.GetLeader] Он заявил, что они не отступят, а заставят нас вести переговоры. Если это удастся, еще рано говорить, но нам просто нужно подождать и посмотреть."
 SEA_warlords.41.a:0 "О, хорошо."
 SEA_warlords.42.t:0 "Хан Фуджу убегает, Джинан"
 SEA_warlords.42.desc:0 "Несмотря на то, что у Хан Фуджу есть возможность продержаться дольше, он решил бежать из Цзинана и оставить наш фланг неохраняемым. Его уже задержали наши силы за измену, но вопрос в том, что нам с ним делать. Должны ли мы взять его и полностью захватить его землю, чтобы показать пример, или же мы должны получить еще одного генерала, чтобы избежать каких-либо дальнейших проблем?"
 SEA_warlords.42.a:0 "Приведите пример из него."
 SEA_warlords.42.b:0 "Пусть Сунь Тонгсуан возьмет на себя управление сейчас"
 may_join_japan_tt:0 "§RЕсть шанс, что он присоединится к Японии.§!"
 SEA_warlords.43.t:0 "Правило Сунь Тонгсуан"
 SEA_warlords.43.desc:0 "После трусливого бегства Хан Фуджу из Цзинана в раздираемой войной провинции Шаньдун образовался вакуум власти. Решив не вмешиваться, а назначить Сунь Тонгсуаня временным губернатором, центральное правительство оставило выбор в наших руках."
 SEA_warlords.43.a:0 "На стороне центрального правительства"
 SEA_warlords.43.b:0 "Гоминьдан потерпел неудачу, мы должны присоединиться к японцам!"
 SEA_warlords.44.t:0 "[FROM.GetLeader] Предлагается объединение Лянгуаня"
 SEA_warlords.44.desc:0 "Мы только что получили сообщение от [FROM.GetNameDef] Они хотят, чтобы наши два региона снова объединились в организацию, известную как Лянгуан. Эта идея восходит к династии Цин как вице-королевство Лянгуанга. Хотя нам больше не нужны такие имперские титулы, власть и престиж этого объединенного образования, существовавшего в то время, были неоспоримы."
 SEA_warlords.44.a:0 "Только при более глубоком сотрудничестве мы можем добиться успеха!"
 SEA_warlords.44.b:0 "Мы не будем сотрудничать с Королем Юга!"
 SEA_warlords.45.t:0 "[FROM.GetLeader] Договорились об объединении"
 SEA_warlords.45.desc:0 "Отличные новости![GXC.GetNameDefCap] Мы договорились о нашем предложенном объединении под знаменем Лянгуаня. Вместе мы формируем мощную фракцию, в нашем распоряжении много промышленности, сырья и рабочей силы! Весь Китай сейчас дрожит от нашей единой силы и воли."
 SEA_warlords.45.a:0 "Мы победим!"
 SEA_warlords.46.t:0 "[FROM.GetLeader] Бросает нас"
 SEA_warlords.46.desc:0 "Мы услышали ответ от [GXC.GetNameDef]И, к сожалению, они решили, что их скоро утерянный суверенитет важнее, чем единое будущее для нас коллективно. Теперь мы должны рассмотреть альтернативные шаги, которые с наибольшей вероятностью приведут к этому объединению с помощью силы, потому что только вместе мы можем противостоять силам, выстраивающимся против нас."
 SEA_warlords.46.a:0 "Теперь это победа или смерть!"
 SEA_warlords.46.tt:0 "§RЭто, скорее всего, приведет к войне с [CHI.GetNameDef]§!"
 SEA_warlords.47.t:0 "Лидерство Liangguang Clique"
 SEA_warlords.47.desc:0 "Теперь, когда объединение становится все ближе, мы должны принять трудное решение о том, кто должен возглавить эту новую клику. Оба варианта являются твердыми, так как [ROOT.GetLeader] Ли Цзонгрен является верховным главнокомандующим военно-воздушными силами, в то время как Ли Цзунгрен является мастером наземного боя и вдохновляющей фигурой для войск. Кто выйдет на вершину?"
 SEA_warlords.47.a:0 "[ROOT.GetLeader] должен оставаться"
 SEA_warlords.47.b:0 "Новый Гуанси-Клик обладает более сильным авторитетом!"
 SEA_warlords.48.t:0 "Южные митинги против нас"
 SEA_warlords.48.desc:0 "Гораздо легче снова принести единство нашей нации, когда ее заблуждающиеся фракции малы и разделены. К сожалению, южные провинции начали объединяться, и этот оплот против нашей силы вызывает все большую озабоченность. Они могут направить против нас тревожное количество ресурсов и рабочей силы, если они решат сопротивляться."
 SEA_warlords.48.a:0 "Мы вернем их под свой контроль!"
 SEA_warlords.48.b:0 "Было бы мудро не провоцировать их..."
 SEA_warlords.48.tt:0 "§RЕсли мы не сможем победить их в течение полугода, мы будем вынуждены выйти из тупика!§!"
 SEA_warlords.49.t:0 "Застойный конфликт"
 SEA_warlords.49.desc:0 "С ростом давления со стороны наших политических оппонентов и снижением морального духа среди наших войск становится ясно, что мы должны прекратить наши бесплодные бои и обратиться к более серьезным угрозам, нависшим на востоке. День потерян, [GDC.GetLeader]Войска США будут продолжать оккупировать южные районы Китая в течение некоторого времени."
 SEA_warlords.49.a:0 "Тогда мы будем тратить наше время..."
 SEA_warlords.50.t:0 "Делегация из [FROM.GetLeader] Прибывает"
 SEA_warlords.50.desc:0 "Сегодня к нам прибыла делегация из Сианя, которая хотела бы обсудить дальнейшие антияпонские меры в ближайшие месяцы. Кажется, что [FROM.GetLeader] Наладил контакт с КПК в горах Шэньси и желает установить союз с ними. Чтобы сделать это, [FROM.GetLeader] Желаем использовать наши контакты с [SOV.GetNameDef] Это может помочь в предстоящем конфликте."
 SEA_warlords.50.a:0 "Вместе мы победим угрозу, нависшую на востоке."
 SEA_warlords.51.t:0 "Плодотворные дискуссии в Лочуане"
 SEA_warlords.51.desc:0 "Ранее на этой неделе наш представитель Ли Кенонг встретился с [FROM.GetLeader] в Лочуане, для обсуждения антияпонских вопросов и вопроса о советской помощи в борьбе с захватчиками. В конце встречи они согласились оказать сопротивление Японии, хотя и не согласились вести переговоры с Чан Кайши. Однако Чжан, держа обиду на японцев за убийство своего отца, заявил, что сделает все возможное, даже если это убьет его, чтобы убедить генералиссимуса присоединиться к КПК против японцев."
 SEA_warlords.51.a:0 "Возможно, мы нашли себе другого союзника."
 SEA_warlords.52.t:0 "[FROM.GetLeader] Желание остановить кампанию окружения"
 SEA_warlords.52.desc:0 "[FROM.GetLeader] В настоящее время задача заключается в подавлении так называемых бандитов в нашей области по приказу. [CHI.GetLeader]. Конечно, это касается и нас, но [FROM.GetLeader] Он обратился к нам и спрашивает, можем ли мы прекратить боевые действия на время, пока он готовится создать Объединенный фронт между нами и Гоминьданом. Принимаем ли мы это предложение?"
 SEA_warlords.52.a:0 "Мы с радостью возьмем эту передышку."
 SEA_warlords.52.b:0 "У нас есть другие планы на [FROM.GetNameDef]"
 SEA_warlords.53.t:0 "[FROM.GetLeader] Контрабандные фонды и оборудование для дела"
 SEA_warlords.53.desc:0 "[FROM.GetLeader] Он начал контрабанду оружия и средств, предоставленных его армиям центральным правительством в Нанкине, и доставляет их на нашу революционную базу различными способами, чтобы повысить наше взаимное доверие и укрепить нас. [JAP.GetAdjective]."
 SEA_warlords.53.a:0 "Мы будем хорошо использовать его"
 SEA_warlords.54.t:0 "[FROM.GetLeader] Вывод войск из [1032.GetName]"
 SEA_warlords.54.desc:0 "[FROM.GetLeader] Вывел войска, гарнизоны в городе Яньань, чтобы не только укрепить нас, но и привлечь внимание центрального правительства. Делая это, [CHI.GetLeader] Скорее всего, он направится на север, чтобы наказать войска подавления и попытаться переместить их на юго-восток, одновременно выговорив мятежные местные органы власти. [FROM.GetLeader] и [SHX.GetLeader]. Однако, пока он находится в Сиане, [FROM.GetLeader] Планы радикального подхода к убеждению [CHI.GetLeader] Создать единый фронт против Японии."
 SEA_warlords.54.a:0 "Отличные новости!"
 SEA_warlords.55.t:0 "Наступательные стагнации"
 SEA_warlords.55.desc:0 "С ростом давления со стороны Центрального правительства, чтобы добиться результатов безрезультатно и снизив моральный дух наших войск, становится ясно, что мы должны прекратить наши бесплодные бои и обратиться к более серьезным угрозам, нависшим над Китаем. День потерян, [PRC.GetNameDef] Они стоят перед лицом невзгод, и их силы будут продолжать оккупировать северные части нашей провинции."
 SEA_warlords.55.a:0 "Тогда мы будем тратить наше время..."
 SEA_warlords.55.tt:0 "Теперь мы сможем сосредоточиться на §Y$XIC_request_relocation_to_northeastern_command$§!"
 SEA_warlords.56.t:0 "[FROM.GetLeader] Просьбы о переселении в [608.GetName]"
 SEA_warlords.56.desc:0 "Молодой маршал [FROM.GetLeader] Он попросил передать его в северо-восточный гарнизон. [608.GetName]Для того, чтобы быть ближе к японской угрозе и действовать как бастион против их агрессии. Будучи бывшим лидером фэнтийской клики, он, похоже, хочет предпринять упреждающий шаг, чтобы вернуть свою потерянную родину. Что скажешь?"
 SEA_warlords.56.a:0 "Проактивный подход к обороне? Великолепно!"
 SEA_warlords.56.b:0 "Мы не можем доверять ему этот пост."
 SEA_warlords.57.t:0 "[FROM.GetLeader] Отклонить наш запрос"
 SEA_warlords.57.desc:0 "Самодовольный предатель [FROM.GetLeader] Мы отклонили нашу просьбу о создании передовой позиции против японцев, явно не имея в виду лучшее будущее Китая."
 SEA_warlords.57.a:0 "В этот день они будут..."
 SEA_warlords.58.t:0 "Государственное давление с целью подчиниться [XIC.GetNameDef]"
 SEA_warlords.58.desc:0 "Совместный спрос исходит от [XIC.GetNameDef] и [FROM.GetNameDef] Подчиниться их новому плану передачи [608.GetName] и прилегающие территории, переданные младомаршалу для предъявления иска в качестве новой передовой базы операций против японцев. Похоже, они намерены покончить с нашей автономией, так или иначе..."
 SEA_warlords.58.a:0 "Хорошо, наш долг выполнен."
 SEA_warlords.58.b:0 "Они должны будут взять [608.GetName] Силой!"
 SEA_warlords.59.t:0 "Великий Север"
 SEA_warlords.59.desc:0 "Наконец, пришло время вернуть утраченные территории фэнтийской клики.[608.GetName] Сейчас мы находимся под нашим командованием, и наш долг подавить бандитов в Шэньси подошел к формальному концу. Скоро вся потерянная родина вернется под наш контроль!"
 SEA_warlords.59.a:0 "Мы на шаг ближе к восстановлению нашей чести!"
 SEA_warlords.60.t:0 "Генералы, не сумевшие [FROM.GetNameDef]"
 SEA_warlords.60.desc:0 "Несколько генералов и солдат, когда-то верных старому маршалу Чжан Цзолину, которого Квантунская армия убила много лет назад, теперь прислушиваются к призыву его сына. [FROM.GetLeader]и переступают к [FROM.GetNameDef]. Это катастрофа!"
 SEA_warlords.60.a:0 "Призрак Зуолина до сих пор преследует нас..."
 SEA_warlords.61.t:0 "Неудачная миссия"
 SEA_warlords.61.desc:0 "После нашего похищения [CHI.GetLeader] «Мы получили ордера на арест и угрозы от центрального правительства, чтобы поставить паузу в кампаниях по окружению, чтобы сосредоточиться на большей угрозе против китайского народа», — сказал он. [ROOT.GetLeader] И его ближайшие люди должны быть привлечены к ответственности, а Северо-Западный штаб по борьбе с бандитами должен быть полностью распущен. Должны ли мы смириться с этой судьбой или продолжать борьбу в другой день?"
 SEA_warlords.61.a:0 "По крайней мере, мы получили альянс, о котором просили."
 SEA_warlords.61.b:0 "Нет, мы должны оставаться автономными для дальнейшего [ROOT.GetLeader]Конечная цель!"
 SEA_warlords.62.t:0 "Распад Северо-Западного штаба по подавлению бандитов"
 SEA_warlords.62.desc:0 "После похищения [ROOT.GetLeader] и силовым убеждением в формировании второго Объединенного фронта, наши правительственные чиновники выдали ордера на арест и угрозы в адрес [FROM.GetLeader] Он и его люди начали перебрасывать войска, чтобы завершить автономную миссию Северо-Западного штаба по подавлению бандитов. Настало время предателям получить то, что они заслуживают."
 SEA_warlords.62.a:0 "Они провалили свою миссию, обуздав их в"
 SEA_warlords.63.t:0 "Дополнительный [SOV.GetAdjective] Поставки прибывают через перевал Иркештам"
 SEA_warlords.63.desc:0 "На этой неделе дополнительно [SOV.GetAdjective] Оружие и припасы прибыли к нашим войскам вокруг Кашгара через перевал Иркештам на запад. По заказу Александра Бармина, [SOV.GetAdjective] чиновник, ответственный за поставки оружия нашему правительству, кажется, что [SOV.GetNameDef] У нас есть конкретные планы по дальнейшему углублению нашего сотрудничества."
 SEA_warlords.63.a:0 "Благодарим наших товарищей за щедрость."
 SEA_warlords.64.t:0 "$KHM_ma_hushan$ Приезжает с [KHM.GetAdjective] золото"
 SEA_warlords.64.desc:0 "$KHM_ma_hushan$Опозоренный командир 36-й гоминдановской дивизии и Падишах [KHM.GetNameDef] Прибывший в [441.GetName] После того, как он покинул свои войска, привез с собой 1000 унций золота, которое он и его люди украли из столицы бывшего государства. Это пахнет возможностью..."
 SEA_warlords.64.a:0 "Конфискуйте его золото!"
 SEA_warlords.65.t:0 "[FROM.GetLeader] Желание объединить киргизов"
 SEA_warlords.65.desc:0 "[FROM.GetLeader]Наш верный подданный в настоящее время контролирует [FROM.GetNameDef] После военного переворота в провинции при поддержке НКВД выразил желание объединить провинцию с Киргистаном, чтобы лучше развивать регионы и объединить разрозненных людей под одним знаменем. Что скажешь?"
 SEA_warlords.65.a:0 "Пока он остается верным"
 SEA_warlords.65.b:0 "Мы не будем идти на компромиссы на наших границах!"
 SEA_warlords.66.t:0 "[FROM.GetLeader] Переезды в Киргистан"
 SEA_warlords.66.desc:0 "[FROM.GetLeader] Мы согласились на нашу просьбу, и Памирская область передается нам по мере поступления этого сообщения. Отныне государством будем управлять мы, автономно от прямых [FROM.GetAdjective] Правило."
 SEA_warlords.66.a:0 "Отличный день!"
 SEA_warlords.67.t:0 "[FROM.GetLeader] Отклонить наш запрос"
 SEA_warlords.67.desc:0 "[FROM.GetLeader] Отказался от запроса на передачу земли. Этого следовало ожидать от них, но это, безусловно, нанесет ущерб нашим отношениям в долгосрочной перспективе."
 SEA_warlords.67.a:0 "Мы вернем его однажды..."
 SEA_warlords.68.t:0 "Генералы Гоминджуна не справляются с [FROM.GetNameDef]"
 SEA_warlords.68.desc:0 "Фэн Юйсян и его солдаты, когда-то лояльные Гоминджуну, организации, которая когда-то восстала против нас и воссоединилась после того, как мы их раздавили, теперь переходят на сторону Гуоминджуна. [FROM.GetNameDef] как [FROM.GetLeader] Он заявил о возрождении военной организации."
 SEA_warlords.68.a:0 "Призрак Гоминджуна до сих пор преследует нас..."
 SEA_warlords.69.t:0 "Роспуск Политического совета Хэбэй-Чахара"
 SEA_warlords.69.desc:0 "Потерпев поражение от вражеских сил, Политический совет Хэбэй-Чахара, который действовал как местная автономия, чтобы выполнить требования региональной демилитаризации, сделанные Японией в рамках соглашения Хе-Умэдзу, больше не служит какой-либо реальной цели. Возможно, настало время править их руководством и подчинить их силы центральному правительству."
 SEA_warlords.69.a:0 "Они служили своей цели."
 SEA_warlords.69.b:0 "Они могут быть полезны для нас"
 SEA_warlords.100.t:0 "[XIC.GetName] Предатели [ROOT.GetLeader]"
 SEA_warlords.100.desc:0 "Срочный доклад поступил из [XIC.GetNameDef] заявляя, что [XIC.GetLeader] вывел свои войска из [1032.GetName]Позволяя [PRC.GetNameDef] Силы вливаются в регион и утверждают, что это их собственные силы. Вся цель этого [XIC.GetName] Чтобы сохранить [PRC.GetName] Проверить и искоренить их - не помогать им."
 SEA_warlords.100.a:0 "Эта измена не выдержит!"
 SIC_can_lead_to_war_with_china_tt:0 "§RЭто может привести к дальнейшему конфликту с центральным правительством.§!"
 SIK_locks_good_focus_tt:0 "§RМы не смогли достичь Единой Синьцзянской Лики.§!"
 SIK_failed_campaign_tt:0 "[SIK.GetLeader] Не удалось выгнать Гоминьдан из провинции"
 yulbars_khan_fled_tt:0 "$KUM_yulbars_khan$ бежал в Хотан"
 TSR_recieve_pp_warlord:0 "Мы получим 100 политических полномочий, как только они поддержат свое соглашение."
 TSR_recieve_manpower_warlord:0 "Мы получим 5000 человек, как только они поддержат свою сделку."
 TSR_recieve_equipment_warlord:0 "Мы получим 1000 единиц пехотного снаряжения, как только они поддержат свою сделку."
 tsr_manchukuo.1.t:0 "Вопрос о лидерстве"
 tsr_manchukuo.1.desc:0 "Положение императора всегда было болезненным на стороне Маньчжурии как империи. С нацией, действующей как республика под властью премьер-министра Чжан Цзинхуэя и Квантунской армии император очень слаб, едва функционируя в качестве номинального главы. Однако все это может быть изменено, поскольку некоторые офицеры Квантунской армии считают, что для процветания нации трон должен быть прочно в руках императора. Но есть и те, кто считает Пуйи слабым и ненадежным, и предпочёл бы, чтобы трон попал в руки его брата, получившего образование в Японии, Пуджи."
 tsr_manchukuo.1.a:0 "Мы должны сохранить статус-кво."
 tsr_manchukuo.1.b:0 "Пуйи должен иметь свой трон!"
 tsr_manchukuo.1.c:0 "Императору нельзя доверять, Пуджи - правильный выбор."
 tsr_manchukuo.2.t:0 "[FROM.GetLeader] Запросить контроль над Даляном"
 tsr_manchukuo.2.desc:0 "В этот вечер, [FROM.GetLeader] Мы передали управление Квантунской осажденной территорией, окружающей портовый город Далянь, пока мы сохраняем нашу деятельность активной, как и раньше. Он заявил, что поскольку наши две нации уже неразделимы, было бы логично воссоединить Даляня с остальной Маньчжурией, а также избавить нас от некоторых административных расходов."
 tsr_manchukuo.2.a:0 "Почему бы и нет?"
 tsr_manchukuo.2.b:0 "Мы бы никогда так не отдали свою территорию!"
 tsr_manchukuo.3.t:0 "Передача Даляна"
 tsr_manchukuo.3.desc:0 "Согласившись с нашим аргументом о том, что было бы логично воссоединить Квантунскую территорию с остальной маньчжурской нацией, японские власти согласились передать эту территорию."
 tsr_manchukuo.3.a:0 "Прекрасно!"
 tsr_manchukuo.4.t:0 "Японцы отказались"
 tsr_manchukuo.4.desc:0 "Не убедившись в наших доводах, они вместо этого отшутились от нашей серьезной просьбы перенести порт Далянь. Утверждая, что это было «совершенно нелепо», они предложили пересмотреть, насколько важна наша роль в этой сфере."
 tsr_manchukuo.4.a:0 "О, хорошо."
 tsr_manchukuo.5.t:0 "Революция распространяется"
 tsr_manchukuo.5.desc:0 "После шокирующих событий в Маньчжурии группа коммунистов, известная как Внутренняя монгольская народная революционная партия, решила попытаться прокатиться на волне и свергнуть правительство Мэнцзяна. Несмотря на то, что им не удалось захватить всю страну, они, возможно, вскоре рассматривают возможность быстрого развала японского контроля в этом районе."
 tsr_manchukuo.5.a:0 "Революция будет победоносной!"
 tsr_manchukuo.5.b:0 "Предатели!"
 tsr_manchukuo.6.t:0 "[MAN.GetLeader] Предлагает союз"
 tsr_manchukuo.6.desc:0 "После победы в войне против японцев местное отделение КПК в Маньчжурии предложило объединиться в борьбе за господство над Китаем. Если это всего лишь попытка захвата власти, то это еще предстоит показать, но это может быть золотой возможностью."
 tsr_manchukuo.6.a:0 "Конечно, мы поддержим наших братьев на севере!"
 tsr_manchukuo.6.b:0 "Никогда"
 tsr_manchukuo.7.t:0 "[MAN.GetLeader] Предлагает интеграцию"
 tsr_manchukuo.7.desc:0 "После победы в войне против китайского правительства и провозглашения Китайской Народной Республики, [MAN.GetLeader] Мы призываем все остальные ветви КПК интегрироваться в эту новую республику с обещаниями высоких постов в правительстве. Если мы откажемся, он утверждает, что нас будут рассматривать как предателей революции и встретят всей военной силой Народно-освободительной армии."
 tsr_manchukuo.7.a:0 "Тогда мы сделаем это"
 tsr_manchukuo.7.b:0 "Никогда!"
 tsr_manchukuo.8.t:0 "[FROM.GetLeader] Отказ от интеграции"
 tsr_manchukuo.8.desc:0 "Мы не удивляемся своим поступкам, [FROM.GetLeader] Он ответил, что наше великодушное предложение было лишь очередной попыткой подчинить остальных и что они не будут принимать участия в этом фарсе. Поэтому они не оставили нам другого выбора, кроме как вторгнуться и забрать то, что по праву принадлежит нам."
 tsr_manchukuo.8.a:0 "Пусть попробуют!"
 tsr_manchukuo.9.t:0 "[FROM.GetLeader] Запрос территориальных трансфертов"
 tsr_manchukuo.9.desc:0 "После стремительного развития ситуации в Китае, [FROM.GetLeader] из [FROM.GetNameDef]Выступая в качестве представителя всего Китая, он предложил помочь в передаче территорий, которые когда-то принадлежали ему, в обмен на союзника в регионе. В то время как более консервативные оценки территориальной передачи состоят только из Монголии и Тувы, которые были потеряны во время революции, некоторые даже настаивают на возвращении внешней Маньчжурии, поскольку многие чиновники в партии имеют личные связи с регионом."
 tsr_manchukuo.9.a:0 "У них не будет ничего"
 tsr_manchukuo.9.b:0 "Первоначальное предложение звучало более благожелательно."
 tsr_manchukuo.9.c:0 "Монголия наша, но пусть у них будет Маньчжурия."
 tsr_manchukuo.9.d:0 "Пусть у них есть все"
 tsr_manchukuo.10.t:0 "[SOV.GetLeader] Перенос нашей территории"
 tsr_manchukuo.10.desc:0 "После обсуждения между [MAN.GetNameDef] и [SOV.GetNameDef], на которые нас не пригласили, они согласились передать нашу территорию [MAN.GetNameDef]. Если мы не примем это, то столкнемся с серьезными последствиями с обеих сторон."
 tsr_manchukuo.10.a:0 "Мы ничего не можем сделать."
 tsr_manchukuo.10.b:0 "Мы будем сражаться до смерти!"
 MAN_will_support_japan_tt:0 "§Y$MAN_urzhin_garmaev$§! и §Y$MAN_jonjurjab$§! Японцы снова войдут в немилость и не присоединятся к нам в случае войны между нами и Японией. [JAP.GetFlag] §YЯпония.§!"
 tsr_manchukuo.11.t:0 "Инцидент в Линшэне"
 tsr_manchukuo.11.desc:0 "После казни Линшэна, губернатора провинции Синьань и панмонгольского политика в руках Квантунской армии, в стране прокатилась волна беспорядков. Синьаньская армия, а также монгольские и бурятские генералы, такие как $MAN_urzhin_garmaev$ и $MAN_jonjurjab$ Они пригрозили уйти в отставку, если это не будет решено, но в то же время умиротворение может привести к риску разозлить Японию."
 tsr_manchukuo.11.a:0 "Мы будем действовать осторожно."
 tsr_manchukuo.11.b:0 "Пусть уходят, если хотят"
 tsr_manchukuo.11.c:0 "Пусть Квантунская армия извинится."
 tsr_manchukuo.12.t:0 "Инфильтрация IMPRP"
 tsr_manchukuo.12.desc:0 "Поступали сообщения о том, что Внутренняя монгольская народно-революционная партия во главе с Серенгдонгрубом вместе с маньчжурскими бандитами проникла в несколько важных мест на севере и теперь ждет своего времени для удара. Мы пока не знаем, когда это произойдет, но боимся, что это произойдет в ближайшее время."
 tsr_manchukuo.12.a:0 "Эти проклятые бандиты!"
 tsr_manchukuo.12.b:0 "Нам просто нужно будет наблюдать за развитием ситуации."
 tsr_manchukuo.13.t:0 "[MAN.GetLeader] Запросы на передачу $JAP_naoki_hoshino$"
 tsr_manchukuo.13.desc:0 "С быстрым промышленным развитием Маньчжурия переживает, [MAN.GetLeader] У него были глаза на $JAP_naoki_hoshino$ Как возможный член кабинета министров в течение некоторого времени. В связи с этим он просит передать его в [MAN.GetNameDef] Для того, чтобы служить в качестве директора Совета по общим вопросам."
 tsr_manchukuo.13.a:0 "Он будет хорошо служить им"
 tsr_manchukuo.13.b:0 "Он нужен нам здесь."
 tsr_manchukuo.14.t:0 "$JAP_naoki_hoshino$ Прибытие в Маньчжурию"
 tsr_manchukuo.14.desc:0 "После многочисленных обсуждений с японцами, передача $JAP_naoki_hoshino$ Наконец-то наш кабинет был согласован. Он будет служить нам хорошим подспорьем в развитии нашей экономики в качестве директора Совета по общим вопросам."
 tsr_manchukuo.14.a:0 "Отлично."
 tsr_manchukuo.15.t:0 "$JAP_naoki_hoshino$ Оставаться в Японии"
 tsr_manchukuo.15.desc:0 "Не убедившись в наших доводах, японцы решили, что так будет лучше для $JAP_naoki_hoshino$ Оставаться дома в Японии, а не занимать должность кабинета министров в Маньчжурии. Хотя это разочаровывает, тем не менее мы найдем путь вперед."
 tsr_manchukuo.15.a:0 "О, хорошо."
 tsr_manchukuo.16.t:0 "[FROM.GetLeader] Запросить контроль над Китаем"
 tsr_manchukuo.16.desc:0 "После провозглашения правительства национального сотрудничества [FROM.GetLeader] Мы требуем объединить наши китайские владения, не находящиеся под контролем. [RNG.GetLeader]Но при его правлении. Хотя это может быть не совсем то, что мы планировали, скорее всего, будет более эффективным управлять через одно марионеточное государство, а не несколько в этом случае."
 tsr_manchukuo.16.a:0 "Мы их объединим."
 tsr_manchukuo.16.b:0 "Мы бы предпочли, чтобы они оставались раздельными."
 tsr_manchukuo.17.t:0 "[FROM.GetLeader] Согласен с нашим предложением"
 tsr_manchukuo.17.desc:0 "После обсуждений с [FROM.GetNameDef] Было решено, что наилучшим путем действий будет объединение китайской администрации под нашим руководством. Мы рассчитываем на дальнейшее сотрудничество с ними."
 tsr_manchukuo.17.a:0 "Великолепный"
 tsr_manchukuo.18.t:0 "[FROM.GetLeader] Отклонить наше предложение"
 tsr_manchukuo.18.desc:0 "Несмотря на все наши усилия, чтобы убедить их, [FROM.GetAdjective] Правительство решило, что объединение китайских администраций под нашим руководством не будет в их интересах. Пока мы будем разделены."
 tsr_manchukuo.18.a:0 "Чёрт."
 tsr_manchukuo.19.t:0 "Советы нам ничего не дают"
 tsr_manchukuo.19.desc:0 "Несмотря на все наши усилия убедить их, Советы решили, что мы не достойны ни одной из территорий, которые они занимают. Это стало большим ударом по нашим отношениям."
 tsr_manchukuo.19.a:0 "Чертовы большевики..."
 tsr_manchukuo.20.t:0 "Советы перенесли Монголию и Туву"
 tsr_manchukuo.20.desc:0 "Решив против передачи Внешней Маньчжурии, считая ее слишком русской, Советы, по крайней мере, согласились передать Монголию и Туву, поскольку наши претензии на эти территории гораздо более свежи."
 tsr_manchukuo.20.a:0 "Все в порядке."
 tsr_manchukuo.21.t:0 "Советы передают Маньчжурию"
 tsr_manchukuo.21.desc:0 "Советы решили передать Внешнюю Маньчжурию, утверждая, что у нас есть гораздо более личная связь с территорией, сохраняя Монголию в качестве буферного государства."
 tsr_manchukuo.21.a:0 "По крайней мере, это что-то"
 tsr_manchukuo.22.t:0 "Советы поддаются всем нашим требованиям."
 tsr_manchukuo.22.desc:0 "Советы, к счастью, были достаточно любезны, чтобы принять все наши территориальные требования, добавив не только Монголию и Туву, но и Внешнюю Маньчжурию в наше царство. Из этого могут выйти только хорошие вещи."
 tsr_manchukuo.22.a:0 "Фантастика"
 tsr_manchukuo_news.1.t:0 "Великое Маньчжурское восстание"
 tsr_manchukuo_news.1.desc:0 "После периода растущего насилия и борьбы между японскими администраторами и различными бандитскими группировками, один из таких бандитов по имени [MAN.GetLeader] Ему удалось захватить Хинкина и в свою очередь убедить императора присоединиться к его стороне.\n\nПосле того, как император присоединился к повстанцам, армия вскоре последовала его примеру, и теперь Маньчжурия стоит на перепутье, будут ли японцы изгнаны или восстание будет подавлено так же быстро, как и пришло?"
 tsr_manchukuo_news.1.a:0 "Щенок зарычал?"
 tsr_manchukuo_news.1.b:0 "Мы исполним своё предназначение!"
 tsr_manchukuo_news.1.c:0 "Как это доходило до этого?"
 tsr_manchukuo_news.1.d:0 "В высшей степени неожиданный"
 tsr_manchukuo_border_war.1.t:0 "[MAN.GetNameDefCap] Завоеватели [1039.GetName]"
 tsr_manchukuo_border_war.1.desc:0 "После стремительной кампании в [1039.GetName], [MAN.GetAdjective] Армия захватила Калган и объявила район под своим контролем."
 tsr_manchukuo_border_war.1.a:0 "Наша сила растет!"
 tsr_manchukuo_border_war.1.b:0 "О, хорошо."
 tsr_manchukuo_border_war.2.t:0 "[MAN.GetNameDefCap] выводить из [1039.GetName]"
 tsr_manchukuo_border_war.2.desc:0 "Столкнувшись с серьезными трудностями [MAN.GetAdjective] Армия отступила из города Калган, это может быть не конец конфликта, но пока Калган останется. [CHI.GetAdjective]."
 tsr_manchukuo_border_war.2.a:0 "Временная неудача..."
 tsr_manchukuo_border_war.2.b:0 "Калган стоит!"
 tsr_manchukuo_border_war.3.t:0 "[MAN.GetNameDefCap] Завоеватели [608.GetName]"
 tsr_manchukuo_border_war.3.desc:0 "После этого [MAN.GetAdjective] Триумфальный марш армии в Пекин [CHI.GetAdjective] Армия отошла на юг, в более оборонительное положение."
 tsr_manchukuo_border_war.3.a:0 "Пекин наконец-то наш!"
 tsr_manchukuo_border_war.3.b:0 "Они не оставляют нам выбора, отойдите!"
 tsr_manchukuo_border_war.4.t:0 "[MAN.GetNameDefCap] выводить из [608.GetName]"
 tsr_manchukuo_border_war.4.desc:0 "Не сумев захватить город, [MAN.GetAdjective] Армия, которая покинула Пекин, не знает, как долго продлится этот временный мир."
 tsr_manchukuo_border_war.4.a:0 "Мы потерпели неудачу."
 tsr_manchukuo_border_war.4.b:0 "Пекин не так легко упадёт!"
 tsr_manchukuo_border_war.5.t:0 "[MAN.GetNameDefCap] Завоеватели [614.GetName]"
 tsr_manchukuo_border_war.5.desc:0 "После полного захвата Хэбэя было достигнуто перемирие с соглашением о том, что [MAN.GetAdjective] Армия не будет идти дальше в Китай, если ее не спровоцировать."
 tsr_manchukuo_border_war.5.a:0 "На шаг ближе к победе!"
 tsr_manchukuo_border_war.5.b:0 "Появится еще одна провинция..."
 tsr_manchukuo_border_war.6.t:0 "[MAN.GetNameDefCap] выводить из [614.GetName]"
 tsr_manchukuo_border_war.6.desc:0 "В то время как Пекин пал на [MAN.GetAdjective] Их войска были остановлены от дальнейшего продвижения в провинцию Хэбэй."
 tsr_manchukuo_border_war.6.a:0 "Хорошо."
 tsr_manchukuo_border_war.6.b:0 "Хэбэй все еще стоит!"
