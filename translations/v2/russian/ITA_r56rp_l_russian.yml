l_russian:
 ITA_r56rp_increased_italian_support:0 "Румыния согласилась на расширение сотрудничества"
 ITA_r56rp_italian_north_africa_founded_tt:0 "§YИтальянская Северная Африка§! будет §Yосвобожденный§! как §YТема§! в Ливии"
 ITA_r56rp_required_libyan_states_tt:0 "§Y[ITA.GetNameDefCap]§! или §YТема§! из §YИталия§! Собственные все §YЛибия§! Основные государства"
 ITA_r56rp_compliance_north_africa:0 "Соблюдение всех §Yтунисский§! и §YЕгипетские государства§! исключая §YСинай§! находится на или выше §Y40%§!"
 ITA_r56rp_expand_naval_facilities_tt:0 "Если нет другого §YЭкспериментальные сооружения§! в §Y[849.GetName]§!Мы выиграем §G1§! §YВоенно-морской инженерный объект§! в §Y[849.GetName]§!."
 ITA_r56rp_renew_the_pact_of_1926:0 "Обновление пакта 1926 года"
 ITA_r56rp_renew_the_pact_of_1926_desc:0 "в §Yсентябрь 1926 г.§!Мы подписали пакт о дружбе и сотрудничестве с §YКоролевство Румыния§!. Он сохранялся до тех пор, пока §YСентябрь 1934 года§!До того, как ему разрешили выбежать. Теперь мы должны вновь возобновить пакт и укрепить отношения с румынами, чтобы вместе пережить надвигающуюся бурю."
 ITA_r56rp_cultivate_romanian_support:0 "Культивирование румынской поддержки"
 ITA_r56rp_cultivate_romanian_support_desc:0 "В знак дружбы и дальнейшей поддержки мы должны предложить пакт о ненападении, чтобы показать остальным Балканам, что Италия и Румыния все еще остаются друзьями после всего этого времени."
 ITA_r56rp_anchor_latin_influence_in_the_balkans:0 "Латинское влияние на Балканах"
 ITA_r56rp_anchor_latin_influence_in_the_balkans_desc:0 "С нашим первоначальным дипломатическим подходом к румынам мы можем теперь сделать еще один шаг вперед, проведя совместные учения и укрепив обе наши страны, а также обеспечить, чтобы латинское влияние оставалось укоренившимся на Балканах."
 ITA_r56rp_latin_influence_category:0 "Латинское влияние"
 ITA_r56rp_joint_military_exercises:0 "Совместные военные учения"
 ITA_r56rp_joint_aviation_exercises:0 "Совместные авиационные учения"
 ITA_r56rp_invite_romania_to_the_faction:0 "Пригласить Румынию в Фракцию"
 ITA_r56rp_demand_bulgarian_submission:0 "Требование болгарской заявки"
 ITA_r56rp_colonial_government_in_north_africa:0 "Создание итальянской Северной Африки"
 ITA_r56rp_give_tunisia_to_italian_north_africa:0 "давать §YТунис§! то §YИтальянская Северная Африка§!"
 ITA_r56rp_give_northern_egypt_to_italian_north_africa:0 "давать §YСеверный Египет§! то §YИтальянская Северная Африка§!"
 ITA_r56rp_give_southern_egypt_to_italian_north_africa:0 "давать §YЮжный Египет до §YИтальянская Северная Африка§!"
 ITA_r56rp_give_sudan_to_the_aoi:0 "давать §YСудан§! к §YАОИ§!"
 ITA_r56rp_send_more_men_to_italian_north_africa:0 "Отправьте больше людей §YИтальянская Северная Африка§!"
 ITA_r56rp_send_more_weapons_to_italian_north_africa:0 "Отправьте больше оружия §YИтальянская Северная Африка§!"
 ITA_r56rp_formalize_the_italian_north_african_state:0 "Формализовать §YИтальянское государство Северной Африки§!"
 ITA_r56rp_romania.1.t:0 "[ITA.GetNameDefCap] Предлагает дальнейшее сотрудничество"
 ITA_r56rp_romania.1.d:0 "Послы из Рима предложили, чтобы мы сделали еще один шаг вперед, показав миру, что у нас нет злой воли по отношению друг к другу и на самом деле работаем вместе для укрепления отношений между нашими двумя странами. Хотя это и не совсем необходимо, но итальянские послы предложили взаимный пакт о ненападении, чтобы обозначить первый шаг к союзу между нашими двумя странами."
 ITA_r56rp_romania.1.a:0 "Мы не видим в этом никакого вреда."
 ITA_r56rp_romania.1.b:0 "Мы не можем привязать себя к итальянцам."
 ITA_r56rp_romania.2.t:0 "[FROM.GetNameDefCap] и [ITA.GetNameDefCap] Предъявить ультиматум"
 ITA_r56rp_romania.2.d:0 "С тех пор [FROM.GetNameDef] и [ITA.GetNameDef] Мы стали работать более тесно вместе, мы могли видеть надпись на стене, когда дело дошло до восстановления наших исторических земель в Румынии. Теперь послы обеих стран пришли к нам с ультиматумом, подчинив себя правлению из Румынии или столкнувшись с вторжением, наши варианты кажутся довольно ограниченными, но мы всегда можем бороться.\n\nЧто нам делать?"
 ITA_r56rp_romania.2.a:0 "Бесполезно, мы подарим, пока"
 ITA_r56rp_romania.2.b:0 "Мы заберем каждый дюйм болгарской земли из Румынии!"
 ITA_r56rp_romania.3.t:0 "[FROM.GetNameDefCap] Предоставьте нам"
 ITA_r56rp_romania.3.d:0 "Сегодня наш посол вернулся в Бухарест с прекрасными новостями. [FROM.GetNameDef] Он видел разум и выбрал для них путь наименьшего сопротивления, а вместо этого покорился Бухаресту."
 ITA_r56rp_romania.3.a:0 "Прекрасные новости!"
 ITA_r56rp_romania.4.t:0 "Государство [FROM.GetNameDefCap] продолжает сопротивляться"
 ITA_r56rp_romania.4.d:0 "Не слишком неожиданный ход [FROM.GetNameDef] Они будут сражаться за каждый дюйм болгарских земель, даже зайдя так далеко, что объявят, что они отвоюют земли, потерянные более ста лет назад."
 ITA_r56rp_romania.4.a:0 "Лунатики, все они"
