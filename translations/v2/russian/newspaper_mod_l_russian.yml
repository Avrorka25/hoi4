 string_newspaper_popup_alert_button_tooltip_disabled:0 "В настоящее время всплывающее окно не будет показано.\n--------------\n§Gщелкнуть§! изменить настройки, чтобы всегда отображать всплывающее окно, когда новое издание газеты становится доступным."
 string_newspaper_popup_alert_button_tooltip_disabled_weekly:0 "В настоящее время всплывающее окно будет показываться не для еженедельных газетных изданий, а только для специальных изданий.\n--------------\n§Gщелкнуть§! изменить настройки, чтобы также отключить всплывающее окно для специальных выпусков."
 string_newspaper_popup_alert_button_tooltip_enabled:0 "В настоящее время всплывающее окно всегда отображается, когда появляется новое издание газеты.\n--------------\n§Gщелкнуть§! изменить настройки, чтобы отключить всплывающее окно для еженедельных газетных изданий и показывать его только для специальных изданий."
 string_newspaper_number_alert_button_tooltip_disabled:0 "В настоящее время не показана маленькая иконка, которая указывает, сколько новых статей в новом газетном издании.\n--------------\n§Gщелкнуть§! Чтобы активировать это предупреждение."
 string_newspaper_number_alert_button_tooltip_enabled:0 "В настоящее время рядом с кнопкой газеты показана небольшая иконка, которая указывает, сколько новых статей в новом газетном издании.\n--------------\n§Gщелкнуть§! Чтобы отключить это предупреждение."
 string_newspaper_play_sound_button_tooltip_disabled:0 "В настоящее время при открытии или закрытии газеты не воспроизводится какой-либо особый звук.\n--------------\n§Gщелкнуть§! Активировать звук."
 string_newspaper_play_sound_button_tooltip_enabled:0 "В настоящее время при открытии или закрытии газеты воспроизводится особый звук.\n--------------\n§Gщелкнуть§! Чтобы отключить звук."
 string_newspaper_show_underlines_button_tooltip_enabled:0 "В настоящее время основной заголовок статьи подчеркнут.\n--------------\n§Gщелкнуть§! Чтобы деактивировать подчеркивание."
 string_newspaper_show_underlines_button_tooltip_disabled:0 "В настоящее время заголовок основной статьи не подчеркивается.\n--------------\n§Gщелкнуть§! активировать подчеркивание."
 string_newspaper_archive_button_clear_archive_tt:0 "\n§GСдвиг + Ctrl + правый клик§! Чтобы опустошить архив. Это удалит все сохраненные статьи!"
 string_newspaper_favorite_edition_button_tt_favorite:0 "Это издание газеты отмечено как §YЛюбимый§! Сейчас."
 string_newspaper_favorite_edition_button_tt_not_favorite:0 "Данное издание газеты не обозначено как §YЛюбимый§! Сейчас.\nВы можете пометить издание как §YЛюбимый§! Его легко найти в архиве."
 string_newspaper_favorite_edition_button_tt_delayed_favorite:0 "§Gщелкнуть§! Удалить эту газету из своего §YЛюбимые§!."
 string_newspaper_favorite_edition_button_tt_delayed_not_favorite:0 "§Gщелкнуть§! Добавить эту газету в свой §YЛюбимые§!."
 NEWSPAPER_ARTICLE_84_TITLE_SPECIAL_WORLD:0 "Назис Смаш, грустят и жгут еврейские шопы и эмблемы"
 NEWSPAPER_ARTICLE_84_DESC_SPECIAL_WORLD:0 "К вечеру почти не было ни еврейского магазина, ни синагоги. [?display_newspaper_article_targets_84^0?global.newspaper_article_targets_84^0.GetNameDef] Он не был разрушен, сожжен или поврежден. Хотя отдельные лица были избиты, в сообщениях до сих пор говорится о смерти только двух человек. Министр пропаганды Йозеф Геббельс издал следующую прокламацию: «Оправданный и понятный гнев народа, который был направлен против него. [?display_newspaper_article_targets_84^0?global.newspaper_article_targets_84^0.GetAdjective] Трусливое еврейское убийство одного из [?display_newspaper_article_targets_84^0?global.newspaper_article_targets_84^0.GetAdjective] Дипломат в Париже нашел широкое выражение во время прошлой ночи\"."
 NEWSPAPER_ARTICLE_84_TITLE_SPECIAL_GER:0 "Окончательный ответ на убийство евреев в Париже еще не найден."
 NEWSPAPER_ARTICLE_84_DESC_SPECIAL_GER:0 "Министр пропаганды д-р. Геббельс объявляет: «Оправданный и понятный гнев народа [?display_newspaper_article_targets_84^0?global.newspaper_article_targets_84^0.GetAdjective] Трусливое еврейское убийство одного из [?display_newspaper_article_targets_84^0?global.newspaper_article_targets_84^0.GetAdjective] Дипломат в Париже нашел широкое выражение во время прошлой ночи. Сейчас всем жителям выносится строгая просьба немедленно прекратить все дальнейшие демонстрации и акции против еврейства, какого бы рода они ни были. Окончательный ответ на убийство евреев в Париже будет дан еврейству посредством законодательства и постановлений»."
 NEWSPAPER_ARTICLE_90_TITLE_SPECIAL_WORLD:0 "Берлин упал - война уже началась?"
 NEWSPAPER_ARTICLE_90_DESC_SPECIAL_WORLD:0 "Берлин, \"сердце [?display_newspaper_article_targets_90^0?global.newspaper_article_targets_90^0.GetAdjective] «Агрессия», столица которой [?display_newspaper_article_targets_90^0?global.newspaper_article_targets_90^0.GetAdjective]Он сказал, что никогда не капитулирует, упал на [?display_newspaper_article_targets_90^1?global.newspaper_article_targets_90^1.GetAdjective]С — и остатки побежденного гарнизона сдались.[?display_newspaper_article_targets_90^1?global.newspaper_article_targets_90^1.GetAdjective] Войска, наконец, пробились через Мольтке-Бридж и в здание Рейхстага, сражаясь по комнате, пока не достигли крыши. [?display_newspaper_article_targets_90^1?global.newspaper_article_targets_90^1.GetAdjective] Флаг был поднят над городом. Битва за Берлин длилась менее трех недель. Существует множество слухов о [?display_newspaper_article_targets_90^0?global.newspaper_article_targets_90^0.GetLeader]В том числе, когда он бежал из города и был мертв."
 NEWSPAPER_ARTICLE_90_TITLE_SPECIAL_GER:0 "Капитал Рейха, захваченный врагом"
 NEWSPAPER_ARTICLE_90_DESC_SPECIAL_GER:0 "После ожесточенных междометных боев, [?display_newspaper_article_targets_90^1?global.newspaper_article_targets_90^1.GetAdjective] Войска смогли занять Берлин и штурмовать Рейхстаг! Даже героическая приверженность храбрых [?display_newspaper_article_targets_90^0?global.newspaper_article_targets_90^0.GetAdjective] Защитники могут это предотвратить. Мы будем чтить павших: солдат и даже женщин и детей, убитых врагом! Следуя словам фюрера, \"[?display_newspaper_article_targets_90^0?global.newspaper_article_targets_90^0.GetNameDefCap] Никогда не сдастся. «Никогда», — сказал он, — мы будем продолжать борьбу за фюрера и Ватерланда. Это огромная неудача, но Эндсиг придет. Эйн Волк, Эйн Райх, Эйн Фюрер!"
 NEWSPAPER_ARTICLE_103_TITLE_SPECIAL_WORLD:0 "ИНВАСИОН - ЗЕМЛЯ ВО ФРАНЦИИ"
 NEWSPAPER_ARTICLE_103_DESC_SPECIAL_WORLD:0 "Союзные войска высадились в [?display_newspaper_article_targets_103^0?global.newspaper_article_targets_103^0.GetName] В начале сегодняшнего дня величайшая заморская операция в истории, призванная уничтожить мощь [?display_newspaper_article_targets_103^1?global.newspaper_article_targets_103^1.GetLeader]? [?display_newspaper_article_targets_103^1?global.newspaper_article_targets_103^1.GetName] и вырвать порабощенную Европу из [?display_newspaper_article_targets_103^1?global.newspaper_article_targets_103^1.GetAdjective]s.[?display_newspaper_article_targets_103^2?global.newspaper_article_targets_103^2.GetAdjective] Верховный главнокомандующий, генерал. Дуайт Ди. Эйзенхауэр объявил: «Мы не примем ничего, кроме полной победы. \nСилы вторжения были удивлены слабой обороной, и потери были легче, чем ожидалось."
 NEWSPAPER_ARTICLE_103_TITLE_SPECIAL_GER:0 "Вторжение врагов во Францию - [?display_newspaper_article_targets_103^0?global.newspaper_article_targets_103^0.GetName] перекрестный огонь"
 NEWSPAPER_ARTICLE_103_DESC_SPECIAL_GER:0 "The [?display_newspaper_article_targets_103^1?global.newspaper_article_targets_103^1.GetAdjective] Оборона по-прежнему остается непобедимой, несмотря на массированные бомбардировки Атлантики. Долгожданная атака на [?display_newspaper_article_targets_103^2?global.newspaper_article_targets_103^2.GetAdjective] Французское побережье снова началось прошлой ночью. После воздушных атак и высадки десантников многочисленные десантные корабли, поддерживаемые тяжелыми линкорами, вторглись на пляж. Защита нигде не удивилась и мгновенно отбилась с полной энергией. Оружие Атлантической стены успешно стреляло по вражескому флоту. Борьба с войсками вторжения идет полным ходом!"
 NEWSPAPER_ARTICLE_126_TITLE_SPECIAL_WORLD:0 "Это мир для нашего времени"
 NEWSPAPER_ARTICLE_126_DESC_SPECIAL_WORLD:0 "К безумному приему от десятков тысяч лондонцев, [?display_newspaper_article_targets_126^0?global.newspaper_article_targets_126^0.GetLeader] Вчера вечером он вернулся домой и объявил всему миру: «Я верю, что это мир для нашего времени». У него в кармане было два соглашения: 1. Мюнхенский пакт четырех держав о передаче [?display_newspaper_article_targets_126^1?global.newspaper_article_targets_126^1.GetName] из [?display_newspaper_article_targets_126^2?global.newspaper_article_targets_126^2.GetNameDef] то [?display_newspaper_article_targets_126^3?global.newspaper_article_targets_126^3.GetNameDef]; и 2. Ан [?display_newspaper_article_targets_126^0?global.newspaper_article_targets_126^0.GetAdjective]-[?display_newspaper_article_targets_126^3?global.newspaper_article_targets_126^3.GetAdjective] Декларация «Желание наших двух народов никогда больше не воевать друг с другом» Женщины в слезах кричали «Спасибо, спасибо»."
 NEWSPAPER_ARTICLE_126_TITLE_SPECIAL_GER:0 "[?display_newspaper_article_targets_126^1?global.newspaper_article_targets_126^1.GetName] Возвращение домой в Рейх"
 NEWSPAPER_ARTICLE_126_DESC_SPECIAL_GER:0 "Конференция, на которой лидеры [?display_newspaper_article_targets_126^0?global.newspaper_article_targets_126^0.GetNameDef], [?display_newspaper_article_targets_126^3?global.newspaper_article_targets_126^3.GetNameDef] Две другие крупные страны начали свою деятельность в полдень, а теперь нашли свой конец. Результаты были немедленно переданы в [?display_newspaper_article_targets_126^2?global.newspaper_article_targets_126^2.GetAdjective] правительство. В ближайшие дни, [?display_newspaper_article_targets_126^3?global.newspaper_article_targets_126^3.GetAdjective] Войска символически войдут в [?display_newspaper_article_targets_126^1?global.newspaper_article_targets_126^1.GetName] и освободить его от [?display_newspaper_article_targets_126^2?global.newspaper_article_targets_126^2.GetAdjective] подавление. Люди не могут ждать, чтобы поблагодарить [?display_newspaper_article_targets_126^3?global.newspaper_article_targets_126^3.GetLeader] За это великое достижение [?display_newspaper_article_targets_126^3?global.newspaper_article_targets_126^3.GetNameDef]."
 NEWSPAPER_ARTICLE_126_TITLE_SPECIAL_CZE:0 "Лидеры других стран обсуждают нашу судьбу"
 NEWSPAPER_ARTICLE_126_DESC_SPECIAL_CZE:0 "Надежды на скорейшее урегулирование, гарантировавшее Европе мир на данный момент, были выражены: [?display_newspaper_article_targets_126^0?global.newspaper_article_targets_126^0.GetAdjective] и [?display_newspaper_article_targets_126^3?global.newspaper_article_targets_126^3.GetAdjective] Как сегодня, так и сегодня, на Мюнхенской четырехсторонней конференции о судьбе страны. [?display_newspaper_article_targets_126^2?global.newspaper_article_targets_126^2.GetNameDef] Вступил во вторую сессию дня. Было принято решение о том, что [?display_newspaper_article_targets_126^3?global.newspaper_article_targets_126^3.GetAdjective] Армия будет маршировать без фанфар и в сопровождении частей армий других стран, чтобы сделать его менее похожим на солдат. [?display_newspaper_article_targets_126^3?global.newspaper_article_targets_126^3.GetAdjective] Вторжение. Решение было принято над нашей головой: [?display_newspaper_article_targets_126^1?global.newspaper_article_targets_126^1.GetName] будет [?display_newspaper_article_targets_126^3?global.newspaper_article_targets_126^3.GetAdjective] Еще раз."
 NEWSPAPER_ARTICLE_182_TITLE_SPECIAL_WORLD:0 "МЮНХЕН БОМБ, МНОГИЕ КАСУАЛЬТЫ - ГИТЛЕР ЭСКАТО"
 NEWSPAPER_ARTICLE_182_DESC_SPECIAL_WORLD:0 "Официально в сообщении из Мюнхена говорится, что жертвами взрыва бомбы замедленного действия в пивном погребе стали: 9 убитых и 61 раненый, из которых 29 находятся в тяжелом состоянии. Официальное заявление, опубликованное в [?display_newspaper_article_targets_182^0?global.newspaper_article_targets_182^0.GetAdjective] Берлин называет побег фюрера чудом. В заявлении говорится: «Божественным указом Гитлер пропустил взрыв всего за 11 минут. Если бы встреча проходила в обычном режиме, все партийные лидеры стали бы жертвами»."
 NEWSPAPER_ARTICLE_182_TITLE_SPECIAL_GER:0 "Нападение в Мюнхене - Гитлер не повержен"
 NEWSPAPER_ARTICLE_182_DESC_SPECIAL_GER:0 "Бомба взорвалась на сборе в пивном погребе Мюнхена. Чудо, что фюрер неожиданно покинул здание раньше и, таким образом, не присутствовал при взрыве бомбы, пропустив взрыв всего 11 минут. Эта гнусная атака на жизнь фюрера вызвала величайшую горечь и возмущение во всем мире. [?display_newspaper_article_targets_182^0?global.newspaper_article_targets_182^0.GetAdjective] людей. В тот момент, когда новость о преступлении стала известна, каждый [?display_newspaper_article_targets_182^0?global.newspaper_article_targets_182^0.GetAdjective] Чувствовалось, что [?display_newspaper_article_targets_182^1?global.newspaper_article_targets_182^1.GetNameDef] Он стоял за этим злодеянием."
 NEWSPAPER_ARTICLE_183_TITLE_SPECIAL_WORLD:0 "ПАКТ ЗАЯВЛЕН - [?display_newspaper_article_targets_183^0?global.newspaper_article_targets_183^0.GetFactionName] и [?display_newspaper_article_targets_183^2?global.newspaper_article_targets_183^2.GetName]"
 NEWSPAPER_ARTICLE_183_DESC_SPECIAL_WORLD:0 "The [?display_newspaper_article_targets_183^0?global.newspaper_article_targets_183^0.GetAdjective] Радио сообщило, что [?display_newspaper_article_targets_183^1?global.newspaper_article_targets_183^1.GetName], [?display_newspaper_article_targets_183^0?global.newspaper_article_targets_183^0.GetName] и [?display_newspaper_article_targets_183^2?global.newspaper_article_targets_183^2.GetName] Подписал 10-летний военно-политический и экономический пакт.[?display_newspaper_article_targets_183^2?global.newspaper_article_targets_183^2.GetName] Признает лидерство [?display_newspaper_article_targets_183^0?global.newspaper_article_targets_183^0.GetName] и [?display_newspaper_article_targets_183^1?global.newspaper_article_targets_183^1.GetName] в Европе, и [?display_newspaper_article_targets_183^1?global.newspaper_article_targets_183^1.GetName] и [?display_newspaper_article_targets_183^0?global.newspaper_article_targets_183^0.GetName] Признает лидерство [?display_newspaper_article_targets_183^2?global.newspaper_article_targets_183^2.GetName] в Азии. Каждый из них будет оказывать помощь другому, если на него нападет сила, которая в настоящее время не участвует в их войнах. Это означает, что державы не вступят в уже бушующие войны друг с другом."
 NEWSPAPER_ARTICLE_183_TITLE_SPECIAL_USA:0 "[?display_newspaper_article_targets_183^0?global.newspaper_article_targets_183^0.GetName] - [?display_newspaper_article_targets_183^1?global.newspaper_article_targets_183^1.GetName] - [?display_newspaper_article_targets_183^2?global.newspaper_article_targets_183^2.GetName] Подписан десятилетний договор"
 NEWSPAPER_ARTICLE_183_DESC_SPECIAL_USA:0 "[?display_newspaper_article_targets_183^0?global.newspaper_article_targets_183^0.GetName], [?display_newspaper_article_targets_183^1?global.newspaper_article_targets_183^1.GetName] и [?display_newspaper_article_targets_183^2?global.newspaper_article_targets_183^2.GetName] Сварил сегодня новый тоталитарный блок с обещанием помощи «один за всех» и «все за одного» против любого нового врага, вступающего в любую из их войн. [?display_newspaper_article_targets_183^3?global.newspaper_article_targets_183^3.GetNameDef]. Три державы формально разделили сферы мирового влияния. [?display_newspaper_article_targets_183^2?global.newspaper_article_targets_183^2.GetName] быть признанным лидером в создании «нового порядка в большей Восточной Азии»; [?display_newspaper_article_targets_183^0?global.newspaper_article_targets_183^0.GetName] и [?display_newspaper_article_targets_183^1?global.newspaper_article_targets_183^1.GetName] «Установление нового порядка в Европе». Должен [?display_newspaper_article_targets_183^3?global.newspaper_article_targets_183^3.GetNameDef] Если они вступят в войну, то, скорее всего, столкнутся с двумя фронтами."
 NEWSPAPER_ARTICLE_183_TITLE_SPECIAL_AXIS:0 "Трехсторонний пакт - [?display_newspaper_article_targets_183^0?global.newspaper_article_targets_183^0.GetName] - [?display_newspaper_article_targets_183^1?global.newspaper_article_targets_183^1.GetName] - [?display_newspaper_article_targets_183^2?global.newspaper_article_targets_183^2.GetName]"
 NEWSPAPER_ARTICLE_183_DESC_SPECIAL_AXIS:0 "Трехсторонний договор между [?display_newspaper_article_targets_183^0?global.newspaper_article_targets_183^0.GetName], [?display_newspaper_article_targets_183^1?global.newspaper_article_targets_183^1.GetName] и [?display_newspaper_article_targets_183^2?global.newspaper_article_targets_183^2.GetName] Он был подписан в канцелярии Нового Рейха. Она обеспечивает политическую, экономическую и военную помощь в случае нападения на одну из договаривающихся сторон. Продолжительность договора была установлена на данный момент в 10 лет. За этим последовала государственная церемония, в которой приняли участие фюрер, королевская делегация из Великобритании. [?display_newspaper_article_targets_183^1?global.newspaper_article_targets_183^1.GetName] Имперская делегация из [?display_newspaper_article_targets_183^2?global.newspaper_article_targets_183^2.GetName]. Вовлеченные правительства подчеркнули важность договора для мира во всем мире."
 NEWSPAPER_ARTICLE_1_TITLE:0 "Воровство [?display_newspaper_article_targets_1^0?global.newspaper_article_targets_1^0.GetName]"
 NEWSPAPER_ARTICLE_1_DESC:0 "Богатая семья из [?display_newspaper_article_targets_1^0?global.newspaper_article_targets_1^0.GetName] Его ограбили! Сумма ущерба еще не определена, но одно они объявили: тот, кто способен и готов помочь в решении этого дела, будет щедро вознагражден."
 NEWSPAPER_ARTICLE_2_TITLE:0 "Шантажист арестован"
 NEWSPAPER_ARTICLE_2_DESC:0 "Бывший актер и предполагаемый дезертир из [?display_newspaper_article_targets_2^0?global.newspaper_article_targets_2^0.GetAdjective] Армию сегодня посадили за то, что она досаждала известной актрисе просьбами о деньгах."
 NEWSPAPER_ARTICLE_3_TITLE:0 "Огонь!"
 NEWSPAPER_ARTICLE_3_DESC:0 "Великая трагедия! Национальный ориентир [?display_newspaper_article_targets_3^0?global.newspaper_article_targets_3^0.GetNameDef] сгоревший дотла в [?display_newspaper_article_targets_3^1?global.newspaper_article_targets_3^1.GetName]. [?display_newspaper_article_targets_3^2?global.newspaper_article_targets_3^2] Люди погибли в катастрофе."
 NEWSPAPER_ARTICLE_4_TITLE:0 "Смертельная лихорадка"
 NEWSPAPER_ARTICLE_4_DESC:0 "Двое моряков возвращаются в гавань [?display_newspaper_article_targets_4^0?global.newspaper_article_targets_4^0.GetName] Сообщается, что он умер от неизвестной лихорадки. Перед смертью они испытывали сильный озноб, сильную жажду и заблуждения."
 NEWSPAPER_ARTICLE_5_TITLE:0 "Почтовая конвенция"
 NEWSPAPER_ARTICLE_5_DESC:0 "Сегодня [?display_newspaper_article_targets_5^0?global.newspaper_article_targets_5^0.GetAdjective] Иностранные власти собираются для обсуждения почтовых сборов за все письма, отправленные за границу."
 NEWSPAPER_ARTICLE_6_TITLE:0 "Вера убивает ребенка"
 NEWSPAPER_ARTICLE_6_DESC:0 "А. [?display_newspaper_article_targets_6^0?global.newspaper_article_targets_6^0] Многолетняя девочка с дизентерией умерла в больнице [?display_newspaper_article_targets_6^1?global.newspaper_article_targets_6^1.GetName] После того, как ее родители заменили семейного врача врачом веры."
 NEWSPAPER_ARTICLE_7_TITLE:0 "Публичная лекция «Наука»"
 NEWSPAPER_ARTICLE_7_DESC:0 "Старающимся естествоиспытателям советуют, что в горных породах будет проходить лекция по геологии или изучению горных образований. [?display_newspaper_article_targets_7^0?global.newspaper_article_targets_7^0.GetName] Аудитория во вторник. Прием 1-."
 NEWSPAPER_ARTICLE_8_TITLE:0 "Собака кусает ребенка"
 NEWSPAPER_ARTICLE_8_DESC:0 "Жестокое нападение животных покидает сообщество [?display_newspaper_article_targets_8^0?global.newspaper_article_targets_8^0.GetName] В шоке родители, обеспокоенные безопасностью своих детей, требуют действий."
 NEWSPAPER_ARTICLE_9_TITLE:0 "обильная женская форма"
 NEWSPAPER_ARTICLE_9_DESC:0 "(Рекомендуется по усмотрению читателя) Размеры женской талии и бедра, по-видимому, всегда минимальны и максимальны соответственно.\nПродолжение на странице 5."
 NEWSPAPER_ARTICLE_10_TITLE:0 "Чудо?"
 NEWSPAPER_ARTICLE_10_DESC:0 "[?display_newspaper_article_targets_10^0?global.newspaper_article_targets_10^0.GetNameDefCap]Дочь мельника, 14 лет, впервые увидела святую Марию в пещере рядом с домом. [?display_newspaper_article_targets_10^1?global.newspaper_article_targets_10^1.GetName]."
 NEWSPAPER_ARTICLE_11_TITLE:0 "Убийство сбивает с толку полицию"
 NEWSPAPER_ARTICLE_11_DESC:0 "Таинственное убийство в последнее время удерживает людей [?display_newspaper_article_targets_11^0?global.newspaper_article_targets_11^0.GetName] в напряжении. Мертвое тело было найдено в небольшом озере, завернутом в окровавленный лист. Чтобы раскрыть это преступление, [?display_newspaper_article_targets_11^1?global.newspaper_article_targets_11^1.GetAdjective] Сейчас полиция надеется на помощь со стороны населения."
 NEWSPAPER_ARTICLE_12_TITLE:0 "Толпа напала [?display_newspaper_article_targets_12^0?global.newspaper_article_targets_12^0.GetName]"
 NEWSPAPER_ARTICLE_12_DESC:0 "Сегодня двое мужчин были публично расстреляны в ресторане в Нью-Йорке. [?display_newspaper_article_targets_12^0?global.newspaper_article_targets_12^0.GetName]. Полицейские подозревают, что толпа напала на них, и отчаянно ищут свидетелей. Они готовы предоставить защиту свидетелей для получения полезных показаний."
 NEWSPAPER_ARTICLE_13_TITLE:0 "Стрельба в [?display_newspaper_article_targets_13^0?global.newspaper_article_targets_13^0.GetName]"
 NEWSPAPER_ARTICLE_13_DESC:0 "Сегодня группа неизвестных открыла огонь по автомобилю мэра [?display_newspaper_article_targets_13^0?global.newspaper_article_targets_13^0.GetName]. Однако жертва жива. Из-за недавних изменений в политике и законодательстве полиция не может исключить покушение на убийство толпы."
 NEWSPAPER_ARTICLE_14_TITLE:0 "Рост цен на хлеб"
 NEWSPAPER_ARTICLE_14_DESC:0 "Многие люди в [?display_newspaper_article_targets_14^0?global.newspaper_article_targets_14^0.GetNameDef] Вы уже заметили, что цена на хлеб растет! Эксперты говорят, что это вызвано неурожаем и неправильным управлением. Если цены продолжают расти, они предупреждают о голоде."
 NEWSPAPER_ARTICLE_15_TITLE:0 "Цена золота на подъеме"
 NEWSPAPER_ARTICLE_15_DESC:0 "Вы инвестировали в золото? Если да, то вам повезло! Цена на золото недавно выросла [?display_newspaper_article_targets_15^0?global.newspaper_article_targets_15^0|%=0]! Эксперты говорят, что эта тенденция не прекратится в течение следующих недель, поэтому инвестиции в золото по-прежнему рекомендуется."
 NEWSPAPER_ARTICLE_16_TITLE:0 "Цены на нефть падают"
 NEWSPAPER_ARTICLE_16_DESC:0 "Мировые цены на нефть падают, топливо может стать таким же дешевым, как никогда раньше. Особенно для компаний, которые нуждаются в топливе для своего производства, это будет означать снижение расходов и, следовательно, лучший баланс."
 NEWSPAPER_ARTICLE_17_TITLE:0 "Сокращение заработной платы"
 NEWSPAPER_ARTICLE_17_DESC:0 "[?display_newspaper_article_targets_17^0?global.newspaper_article_targets_17^0.GetNameDefCap]Экономика демонстрирует признаки слабости. Заработная плата падает, а возможности для расходов снижаются. Сможет ли экономика восстановиться или правительство должно принять меры сейчас?"
 NEWSPAPER_ARTICLE_18_TITLE:0 "[?display_newspaper_article_targets_18^0?global.newspaper_article_targets_18^0.GetAdjective] Инфляция растет"
 NEWSPAPER_ARTICLE_18_DESC:0 "The [?display_newspaper_article_targets_18^0?global.newspaper_article_targets_18^0.GetAdjective] Экономика замедляется, и она еще больше ослабевает из-за долгов и кредитов. Все это вызвало рост их инфляции удивительным [?display_newspaper_article_targets_18^1?global.newspaper_article_targets_18^1|%=0]... Дополнительная информация в разделе Бизнес."
 NEWSPAPER_ARTICLE_19_TITLE:0 "Университет финансируется в [?display_newspaper_article_targets_19^0?global.newspaper_article_targets_19^0.GetName]"
 NEWSPAPER_ARTICLE_19_DESC:0 "\"Наконец-то у нас есть местный университет. Воспитание и обучение молодежи на местном уровне не имеет значения для нашего будущего!, - сказал мэр города. [?display_newspaper_article_targets_19^0?global.newspaper_article_targets_19^0.GetName] Торжественно разрезав ленту торжественного открытия."
 NEWSPAPER_ARTICLE_20_TITLE:0 "Герой среди нас"
 NEWSPAPER_ARTICLE_20_DESC:0 "Богатая и известная семья из [?display_newspaper_article_targets_20^0?global.newspaper_article_targets_20^0.GetName] Пожертвовал [?display_newspaper_article_targets_20^1?global.newspaper_article_targets_20^1]Для детского дома. Они торжественно вручили чек перегруженным детям и главе детского дома."
 NEWSPAPER_ARTICLE_21_TITLE:0 "[?display_newspaper_article_targets_21^0?global.newspaper_article_targets_21^0.GetName] Вымирает!"
 NEWSPAPER_ARTICLE_21_DESC:0 "[?display_newspaper_article_targets_21^0?global.newspaper_article_targets_21^0.GetName]Население страны сокращается, особенно молодежь переезжает в соседние города. [?display_newspaper_article_targets_21^1?global.newspaper_article_targets_21^1.GetName]Потому что жизнь там кажется более перспективной. Инвестиции в местную инфраструктуру могут помочь решить эту проблему."
 NEWSPAPER_ARTICLE_22_TITLE:0 "Очень высокий уровень преступности"
 NEWSPAPER_ARTICLE_22_DESC:0 "[?display_newspaper_article_targets_22^0?global.newspaper_article_targets_22^0.GetName] Это опасное место. Уровень преступности здесь примерно [?display_newspaper_article_targets_22^1?global.newspaper_article_targets_22^1|%=0] выше, чем в среднем по [?display_newspaper_article_targets_22^2?global.newspaper_article_targets_22^2.GetNameDef]. Полиция должна принять меры, иначе население будет продолжать сокращаться и мигрировать в более безопасные места."
 NEWSPAPER_ARTICLE_23_TITLE:0 "Выступление против местного меньшинства"
 NEWSPAPER_ARTICLE_23_DESC:0 "Местная знаменитость выступила с речью в мэрии [?display_newspaper_article_targets_23^0?global.newspaper_article_targets_23^0.GetName]. Он рассказал о некоторых проблемах, вызванных местными меньшинствами, и обратился к администрации с просьбой решить эти вопросы до того, как люди должны будут начать действовать. Публика очень ему аплодировала."
 NEWSPAPER_ARTICLE_24_TITLE:0 "Делает [?display_newspaper_article_targets_24^0?global.newspaper_article_targets_24^0.GetNameDef] Есть ли проблемы с самоубийством?"
 NEWSPAPER_ARTICLE_24_DESC:0 "[?display_newspaper_article_targets_24^0?global.newspaper_article_targets_24^0.GetNameDefCap]С момента последнего исследования количество самоубийств быстро росло. Ряд из них [?display_newspaper_article_targets_24^1?global.newspaper_article_targets_24^1] Год назад, теперь поднялся до удивительного [?display_newspaper_article_targets_24^2?global.newspaper_article_targets_24^2]! В связи с этим возникают вопросы: есть ли жизнь в [?display_newspaper_article_targets_24^0?global.newspaper_article_targets_24^0.GetNameDef] Справедливо ли это, и решит ли политика этот вопрос?"
 NEWSPAPER_ARTICLE_25_TITLE:0 "Самоубийство в [?display_newspaper_article_targets_25^0?global.newspaper_article_targets_25^0.GetName]"
 NEWSPAPER_ARTICLE_25_DESC:0 "Люди в финансовом районе [?display_newspaper_article_targets_25^0?global.newspaper_article_targets_25^0.GetName] Вчера вечером пришлось стать свидетелем страшного события. После закрытия фондового рынка мужчина[?display_newspaper_article_targets_25^1?global.newspaper_article_targets_25^1]) прыгнул с крыши многоэтажного здания. Он умер на месте."
 NEWSPAPER_ARTICLE_26_TITLE:0 "Банкротство соседства"
 NEWSPAPER_ARTICLE_26_DESC:0 "Старая компания, основанная [?display_newspaper_article_targets_26^0?global.newspaper_article_targets_26^0] в [?display_newspaper_article_targets_26^1?global.newspaper_article_targets_26^1.GetName]Теперь пришлось закрыть свои двери. После долгой борьбы поддерживать прибыльный бизнес было невозможно. Это потеря для всего региона, и в основном для страны. [?display_newspaper_article_targets_26^2?global.newspaper_article_targets_26^2] рабочих."
 NEWSPAPER_ARTICLE_27_TITLE:0 "КОКА-КОЛА ДЕЙСТВИТЕЛЬНА"
 NEWSPAPER_ARTICLE_27_DESC:0 "Отлично для последней капли \nКока-кола утолит вашу жажду, положит капельницу и войдет в ваш усталый мозг и тело.\nОхлаждение - Снятие - Первое Слушание"
 NEWSPAPER_ARTICLE_28_TITLE:0 "Системные требования Gillette Safety Razor Blades"
 NEWSPAPER_ARTICLE_28_DESC:0 "с лучшим краем, который может взять сталь.\nПоложите пустую картонку в карман, чтобы напомнить вам, что вы получите пакет De Luxe Gillette Blades."
 NEWSPAPER_ARTICLE_29_TITLE:0 "Sunbeam Motor Car Co., Ltd."
 NEWSPAPER_ARTICLE_29_DESC:0 "Установление нового стандарта в автомобилях высокого класса. Автомобиль не только для достоинства, но и для власти и непревзойденных качеств."
 NEWSPAPER_ARTICLE_30_TITLE:0 "Врачи курят верблюдов чаще всего"
 NEWSPAPER_ARTICLE_30_DESC:0 "Врачи в каждой отрасли медицины были запрошены в этом исследовании предпочтения сигарет. Суть вопроса была такова: Какую сигарету вы курите, доктор? Самой известной маркой был Camel!"
 NEWSPAPER_ARTICLE_31_TITLE:0 "Когда искушение достигает счастья"
 NEWSPAPER_ARTICLE_31_DESC:0 "Нет раздражения горла. Без кашля.\nПредстоящие события отбрасывают свои тени раньше. Избегайте этой тени."
 NEWSPAPER_ARTICLE_32_TITLE:0 "MARLBORO - Роскошная сигарета"
 NEWSPAPER_ARTICLE_32_DESC:0 "Сегодня - за угощением - попробуйте Мальборос!\nСовет по красоте: новый! Красный - чтобы соответствовать красным губам и кончикам пальцев!"
 NEWSPAPER_ARTICLE_33_TITLE:0 "Персиль"
 NEWSPAPER_ARTICLE_33_DESC:0 "Персил лучше всего подходит для всех тонких тканей!\nВы не можете отличить новое платье от опасного!"
 NEWSPAPER_ARTICLE_34_TITLE:0 "Бобы Кэмпбелла"
 NEWSPAPER_ARTICLE_34_DESC:0 "Бобы богаты бодибилдингом!\nСамый известный... Больше всего понравились... Большинство купленных...\nЭто завидная запись бобов Кэмпбелла!"
 NEWSPAPER_ARTICLE_35_TITLE:0 "Искушайте свою собаку красным сырым мясом"
 NEWSPAPER_ARTICLE_35_DESC:0 "Он выдаст его за ПАРД!\n(Возврат денег, если он этого не сделает)"
 NEWSPAPER_ARTICLE_36_TITLE:0 "Моррис Бэкон"
 NEWSPAPER_ARTICLE_36_DESC:0 "Потребовались годы, чтобы усовершенствовать Высшее Лекарство, которое делает этот бекон таким вкусным!"
 NEWSPAPER_ARTICLE_37_TITLE:0 "Мужчины хотели"
 NEWSPAPER_ARTICLE_37_DESC:0 "Для опасного путешествия малая зарплата, горький холод, долгие месяцы полной темноты, постоянная опасность, безопасное возвращение сомнительно, честь и признание в случае успеха."
 NEWSPAPER_ARTICLE_38_TITLE:0 "Сестра хочет"
 NEWSPAPER_ARTICLE_38_DESC:0 "Человек должен быть неженатым, уметь читать и писать и быть полностью компетентным, чтобы взять на себя ответственность за больных в лазарете. Зарплата 25, годовых."
 NEWSPAPER_ARTICLE_39_TITLE:0 "Оферта Governess"
 NEWSPAPER_ARTICLE_39_DESC:0 "Родители молодой женщины желают получить для нее статус ежедневной или постоянно проживающей гувернантки в респектабельной семье, где дети младше 12 лет."
 NEWSPAPER_ARTICLE_40_TITLE:0 "Коммерческие кредиты"
 NEWSPAPER_ARTICLE_40_DESC:0 "Мы рассмотрим заявки на следующие типы недвижимости: Многосемейное строительство, Офис, Смешанное использование."
 NEWSPAPER_ARTICLE_41_TITLE:0 "Тигры побеждают соперника"
 NEWSPAPER_ARTICLE_41_DESC:0 "Это был обледенение на торте для захватывающего вечера, когда матч закончился. Великолепное выступление всех игроков подарило «Тиграм» славу. [?display_newspaper_article_targets_41^0?global.newspaper_article_targets_41^0]:[?display_newspaper_article_targets_41^1?global.newspaper_article_targets_41^1] Победа над другой командой."
 NEWSPAPER_ARTICLE_42_TITLE:0 "Номер дома [?display_newspaper_article_targets_42^0?global.newspaper_article_targets_42^0] Победа в игре"
 NEWSPAPER_ARTICLE_42_DESC:0 "Большая палка Бэйба Рута возвращает Янкса в лидеры. \"Бамбино\" выиграл игру за янки со своим [?display_newspaper_article_targets_42^0?global.newspaper_article_targets_42^0]. Домашний бег! Не зря его избрали в Зал славы бейсбола, он действительно один из первых пяти!"
 NEWSPAPER_ARTICLE_43_TITLE:0 "Беспорядки в [?display_newspaper_article_targets_43^0?global.newspaper_article_targets_43^0.GetName]"
 NEWSPAPER_ARTICLE_43_DESC:0 "После этого [This.GetNewspaperArticle43RandomSports] матч в [?display_newspaper_article_targets_43^0?global.newspaper_article_targets_43^0.GetName] Болельщики домашней команды начали бунтовать с болельщиками команды-победителя (результат) [?display_newspaper_article_targets_43^1?global.newspaper_article_targets_43^1]:[?display_newspaper_article_targets_43^2?global.newspaper_article_targets_43^2]). Полиция быстро добралась до места и смогла арестовать фанатов. Только [?display_newspaper_article_targets_43^3?global.newspaper_article_targets_43^3] Люди слегка пострадали."
 NEWSPAPER_ARTICLE_44_TITLE:0 "Шторм заявил о пострадавших"
 NEWSPAPER_ARTICLE_44_DESC:0 "Сильный шторм ударил [?display_newspaper_article_targets_44^0?global.newspaper_article_targets_44^0.GetName] Вчера измеренная скорость ветра была невероятной. [?display_newspaper_article_targets_44^1?global.newspaper_article_targets_44^1] КМ/Х. Он пронесся по городу и, по крайней мере, [?display_newspaper_article_targets_44^2?global.newspaper_article_targets_44^2] Жертвы. Материальный ущерб оценивается в [?display_newspaper_article_targets_44^3?global.newspaper_article_targets_44^3],-."
 NEWSPAPER_ARTICLE_45_TITLE:0 "Прогноз погоды"
 NEWSPAPER_ARTICLE_45_DESC:0 "По утрам туман в некоторых районах. Температура остается на среднем уровне. Прогнозируемый дождь на следующую неделю, прогнозируемый [?display_newspaper_article_targets_45^0?global.newspaper_article_targets_45^0] Литра на квадратный метр в [?display_newspaper_article_targets_45^1?global.newspaper_article_targets_45^1.GetName]."
 NEWSPAPER_ARTICLE_46_TITLE:0 "Наводнение в [?display_newspaper_article_targets_46^0?global.newspaper_article_targets_46^0.GetName]"
 NEWSPAPER_ARTICLE_46_DESC:0 "Река в [?display_newspaper_article_targets_46^0?global.newspaper_article_targets_46^0.GetName] Он разорвал свои банки. Многие люди потеряли свой дом и имущество, целые улицы полностью затоплены. Люди начали строить набережные, но на восстановление повреждений потребуются недели."
 NEWSPAPER_ARTICLE_47_TITLE:0 "землетрясение в [?display_newspaper_article_targets_47^0?global.newspaper_article_targets_47^0.GetName]"
 NEWSPAPER_ARTICLE_47_DESC:0 "Малое и среднее землетрясение произошло [?display_newspaper_article_targets_47^0?global.newspaper_article_targets_47^0.GetName]. Из-за прогноза материальный ущерб ограничен. Кроме того, человеческие жертвы несут ответственность только за [?display_newspaper_article_targets_47^1?global.newspaper_article_targets_47^1]."
 NEWSPAPER_ARTICLE_48_TITLE:0 "Извержение вулкана"
 NEWSPAPER_ARTICLE_48_DESC:0 "Небольшой вулкан рядом [?display_newspaper_article_targets_48^0?global.newspaper_article_targets_48^0.GetName] Вспыхнул вчера. Извержение было незначительным, однако несколько гражданских лиц, которые были рядом с вулканом, когда он извергался, получили ранения. Эксперты не ожидают никаких драматических последствий."
 NEWSPAPER_ARTICLE_49_TITLE:0 "Это мальчик!"
 NEWSPAPER_ARTICLE_49_DESC:0 "Хорошо известный [?display_newspaper_article_targets_49^0?global.newspaper_article_targets_49^0.GetAdjective] Актриса родила здорового мальчика прошлой ночью. Важные люди навещали молодую маму, чтобы доставить подарки и поздравления. [?display_newspaper_article_targets_49^0?global.newspaper_article_targets_49^0.GetLeader] Присутствовал."
 NEWSPAPER_ARTICLE_50_TITLE:0 "это [This.GetNewspaperArticle50IdeologyNoun] На подъеме в [?display_newspaper_article_targets_50^0?global.newspaper_article_targets_50^0.GetNameDef]?"
 NEWSPAPER_ARTICLE_50_DESC:0 "В связи с текущими событиями по всему миру, люди и правительства меняют политические взгляды. это [?display_newspaper_article_targets_50^0?global.newspaper_article_targets_50^0.GetNameDef] Двигаться в сторону [This.GetNewspaperArticle50IdeologyNoun]?"
 NEWSPAPER_ARTICLE_51_TITLE:0 "[?display_newspaper_article_targets_51^0?global.newspaper_article_targets_51^0.GetNameDefCap] На войне!"
 NEWSPAPER_ARTICLE_51_DESC:0 "[?display_newspaper_article_targets_51^0?global.newspaper_article_targets_51^0.GetNameDefCap] Объявляем войну [?display_newspaper_article_targets_51^1?global.newspaper_article_targets_51^1.GetNameDef]! Мир снова в состоянии войны!\nКакие события приводят к этому драматическому результату, до сих пор неясно."
 NEWSPAPER_ARTICLE_52_TITLE:0 "Аншлюс [?display_newspaper_article_targets_52^0?global.newspaper_article_targets_52^0.GetName]"
 NEWSPAPER_ARTICLE_52_DESC:0 "В своей речи перед толпой на Гельденплац в Вене, [?display_newspaper_article_targets_52^1?global.newspaper_article_targets_52^1.GetLeader] Объявлен аншлюс [?display_newspaper_article_targets_52^0?global.newspaper_article_targets_52^0.GetName], фактически присоединив страну к [?display_newspaper_article_targets_52^1?global.newspaper_article_targets_52^1.GetNameDef]: \nВ этот час я могу сделать величайшее объявление о своей жизни [?display_newspaper_article_targets_52^1?global.newspaper_article_targets_52^1.GetAdjective] людей. Как канцлер и фюрер [?display_newspaper_article_targets_52^1?global.newspaper_article_targets_52^1.GetAdjective] нации и [?display_newspaper_article_targets_52^1?global.newspaper_article_targets_52^1.GetNameDef]Теперь я доложу [?display_newspaper_article_targets_52^1?global.newspaper_article_targets_52^1.GetAdjective] История вхождения моей Родины в [?display_newspaper_article_targets_52^1?global.newspaper_article_targets_52^1.GetNameDef].\""
 NEWSPAPER_ARTICLE_53_TITLE:0 "Жестоко убита женщина!"
 NEWSPAPER_ARTICLE_53_DESC:0 "[This.GetNewspaperArticle53GetRandomFemaleName] [This.GetNewspaperArticle53GetRandomLastName] ([?display_newspaper_article_targets_53^2?global.newspaper_article_targets_53^2]) возвращалась домой поздно вечером вчера, когда на нее напали и жестоко издевались некоторые неизвестные в настоящее время мужчины. В этом [?display_newspaper_article_targets_53^3?global.newspaper_article_targets_53^3.GetName] В больнице она поддалась травмам."
 NEWSPAPER_ARTICLE_54_TITLE:0 "[?display_newspaper_article_targets_54^0?global.newspaper_article_targets_54^0.GetName]: [?display_newspaper_article_targets_54^1?global.newspaper_article_targets_54^1] Ножевые ранения убивают женщин!"
 NEWSPAPER_ARTICLE_54_DESC:0 "констебль [This.GetNewspaperArticle54GetRandomLastName1] Сегодня утром его вызвали на другое убийство. Патологоанатом доктор.[This.GetNewspaperArticle54GetRandomLastName2] Обследовала труп, по его словам, она была жестоко убита ударами ножом в грудь, живот и живот."
 NEWSPAPER_ARTICLE_55_TITLE:0 "Зверь снова наносит удар: [?display_newspaper_article_targets_55^0?global.newspaper_article_targets_55^0] ножевые ранения"
 NEWSPAPER_ARTICLE_55_DESC:0 "Женщина, которая лежит неопознанной в морге, [?display_newspaper_article_targets_55^1?global.newspaper_article_targets_55^1.GetName]Он был жестоко зарезан сегодня утром, между двумя и четырьмя часами, при посадке каменной лестницы в [This.GetNewspaperArticle55GetRandomMaleName]\"С-здания\", [?display_newspaper_article_targets_55^1?global.newspaper_article_targets_55^1.GetName]."
 NEWSPAPER_ARTICLE_56_TITLE:0 "[?display_newspaper_article_targets_56^0?global.newspaper_article_targets_56^0.GetName]\"Черный рекорд\""
 NEWSPAPER_ARTICLE_56_DESC:0 "Убийство, совершенное ранним утром вчерашнего дня женщиной, теперь известной как [This.GetNewspaperArticle56GetRandomFemaleName] [This.GetNewspaperArticle56GetRandomLastName] У него много общего с убийствами трех других женщин в том же районе."
 NEWSPAPER_ARTICLE_57_TITLE:0 "Монстр из [?display_newspaper_article_targets_57^0?global.newspaper_article_targets_57^0.GetName] Опять забастовки"
 NEWSPAPER_ARTICLE_57_DESC:0 "Найден еще один труп, зарезанный до смерти. Однако на этот раз очевидцу удалось дать грубое описание виновника: у него вид моряка и небольшие светлые усы. Ему около 30 лет."
 NEWSPAPER_ARTICLE_58_TITLE:0 "Шестое убийство в [?display_newspaper_article_targets_58^0?global.newspaper_article_targets_58^0.GetName]!"
 NEWSPAPER_ARTICLE_58_DESC:0 "Констебль полиции [This.GetNewspaperArticle58GetRandomMaleName] [This.GetNewspaperArticle58GetRandomLastName1] Найдено тело местной проститутки [This.GetNewspaperArticle58GetRandomFemaleName] [This.GetNewspaperArticle58GetRandomLastName2] лежа рядом с фонарным столбом на тротуаре в Замковой аллее. Ее юбка была подтянута вверх, и на ее бедре и животе была кровь."
 NEWSPAPER_ARTICLE_59_TITLE:0 "Полиция не может остановить ужас"
 NEWSPAPER_ARTICLE_59_DESC:0 "[?display_newspaper_article_targets_59^0?global.newspaper_article_targets_59^0.GetName]Офицер полиции [This.GetNewspaperArticle59GetRandomLastName] Он прошел через это место за 15 минут до этого и был непреклонен в том, что тело не было там тогда. Вернувшись позже, он услышал шаги человека, уходящего от него, и заметил труп."
 NEWSPAPER_ARTICLE_60_TITLE:0 "Убийства продолжаются"
 NEWSPAPER_ARTICLE_60_DESC:0 "в [?display_newspaper_article_targets_60^0?global.newspaper_article_targets_60^0] возраст [This.GetNewspaperArticle60GetRandomFemaleName] [This.GetNewspaperArticle60GetRandomLastName] Он был намного моложе, чем другие жертвы зверя. [?display_newspaper_article_targets_60^3?global.newspaper_article_targets_60^3.GetName]. Она была описана как «справедливый цвет лица, со светлыми волосами и обладающий довольно привлекательными чертами лица»."
 NEWSPAPER_ARTICLE_61_TITLE:0 "Что может остановить монстра [?display_newspaper_article_targets_61^0?global.newspaper_article_targets_61^0.GetName]?"
 NEWSPAPER_ARTICLE_61_DESC:0 "Комиссар полиции, [This.GetNewspaperArticle61GetRandomMaleName] [This.GetNewspaperArticle61GetRandomLastName]Сказала \"... Находка туловища самки, минус голова и ноги в одной из железнодорожных арок на улице Пинчина, более ужасна, чем в любом из восьми случаев, предшествующих ...»."
 NEWSPAPER_ARTICLE_62_TITLE:0 "Серийный убийца наконец-то арестован"
 NEWSPAPER_ARTICLE_62_DESC:0 "После нескольких месяцев ужаса, который он вызвал, монстр [?display_newspaper_article_targets_62^0?global.newspaper_article_targets_62^0.GetName] В конце концов, полиция поймала его благодаря свидетельствам очевидцев.[?display_newspaper_article_targets_62^1?global.newspaper_article_targets_62^1] годовалый [?display_newspaper_article_targets_62^4?global.newspaper_article_targets_62^4.GetAdjective] [This.GetNewspaperArticle62GetRandomMaleName] [This.GetNewspaperArticle62GetRandomLastName] лицо [This.GetNewspaperArticle62SentenceTypeForCrime]."
 NEWSPAPER_ARTICLE_63_TITLE:0 "Серийный убийца в действии"
 NEWSPAPER_ARTICLE_63_DESC:0 "Зверь из [?display_newspaper_article_targets_63^0?global.newspaper_article_targets_63^0.GetName] Был пойман в действии констеблем [This.GetNewspaperArticle63GetRandomMaleName] [This.GetNewspaperArticle63GetRandomLastName]. Пострадавшая скончалась от полученных травм в больнице сегодня вечером, но обстоятельства произошедшего... [?display_newspaper_article_targets_63^3?global.newspaper_article_targets_63^3.GetAdjective] Арест мужчины говорит о том, что ему грозит [This.GetNewspaperArticle63SentenceTypeForCrime]."
 NEWSPAPER_ARTICLE_64_TITLE:0 "Загадочная серия убийств?"
 NEWSPAPER_ARTICLE_64_DESC:0 "Таинственная серия убийств, которая держала город в напряжении, кажется, внезапно прекратилась. С тех пор не было ни одного убийства, соответствующего методам \"чудовища\" [?display_newspaper_article_targets_64^0?global.newspaper_article_targets_64^0.GetName]\". Ужас наконец-то закончился?"
 NEWSPAPER_ARTICLE_65_TITLE:0 "Серийный убийца на бегу"
 NEWSPAPER_ARTICLE_65_DESC:0 "Монстр из [?display_newspaper_article_targets_65^0?global.newspaper_article_targets_65^0.GetName] Он был пойман на месте преступления, но ему удалось сбежать! Полиция отчаянно ищет его в окрестностях. Они предлагают женщинам не выходить из дома до тех пор, пока подозреваемый не окажется под стражей!"
 NEWSPAPER_ARTICLE_66_TITLE:0 "Женский труп найден в [?display_newspaper_article_targets_66^0?global.newspaper_article_targets_66^0.GetName]"
 NEWSPAPER_ARTICLE_66_DESC:0 "Неизвестная женщина найдена мертвой в [?display_newspaper_article_targets_66^0?global.newspaper_article_targets_66^0.GetName]. Она была найдена полуголой с множественными ножевыми ранениями. Несмотря на локальное и временное расстояние, слухи могут быть правдой: монстр [?display_newspaper_article_targets_66^1?global.newspaper_article_targets_66^1.GetName] Возвращается..."
 NEWSPAPER_ARTICLE_67_TITLE:0 "Нарушение Версальского договора?"
 NEWSPAPER_ARTICLE_67_DESC:0 "Слухи говорят, что [?display_newspaper_article_targets_67^0?global.newspaper_article_targets_67^0.GetNameDef] Производит танки. Готовят ли они войну?[?display_newspaper_article_targets_67^0?global.newspaper_article_targets_67^0.GetLeader] Мы не строим военные танки, мы мирный народ, который просто производит большие тракторы."
 NEWSPAPER_ARTICLE_68_TITLE:0 "[?display_newspaper_article_targets_68^0?global.newspaper_article_targets_68^0.GetNameDefCap] страхи [?display_newspaper_article_targets_68^1?global.newspaper_article_targets_68^1.GetAdjective] Вторжение!"
 NEWSPAPER_ARTICLE_68_DESC:0 "Сообщения поступают из неназванного источника [?display_newspaper_article_targets_68^0?global.newspaper_article_targets_68^0.GetNameDef] В их столице прошла серия военных встреч. Они считают, что вторжение [?display_newspaper_article_targets_68^1?global.newspaper_article_targets_68^1.GetAdjective] Войска - это серьезная возможность!"
 NEWSPAPER_ARTICLE_69_TITLE:0 "Прекращение дипломатических отношений"
 NEWSPAPER_ARTICLE_69_DESC:0 "[?display_newspaper_article_targets_69^0?global.newspaper_article_targets_69^0.GetNameDefCap] прервал все дипломатические отношения с [?display_newspaper_article_targets_69^1?global.newspaper_article_targets_69^1.GetNameDef]. Будет ли этот конфликт развиваться дальше?\nБольше информации в разделе Политика."
 NEWSPAPER_ARTICLE_70_TITLE:0 "[?display_newspaper_article_targets_70^0?global.newspaper_article_targets_70^0.GetNameDefCap] страхи [?display_newspaper_article_targets_70^1?global.newspaper_article_targets_70^1.GetAdjective] Может!"
 NEWSPAPER_ARTICLE_70_DESC:0 "По слухам, из [?display_newspaper_article_targets_70^0?global.newspaper_article_targets_70^0.GetNameDef]В их столице состоялась серия встреч с участием высших военных офицеров. Основная тема этих встреч включает в себя возможный вымышленный сценарий [?display_newspaper_article_targets_70^1?global.newspaper_article_targets_70^1.GetAdjective] Вторжение."
 NEWSPAPER_ARTICLE_71_TITLE:0 "[?display_newspaper_article_targets_71^0?global.newspaper_article_targets_71^0.GetAdjective] Войска обнаруживают [?display_newspaper_article_targets_71^2?global.newspaper_article_targets_71^2.GetAdjective] \"фабрика убийств\""
 NEWSPAPER_ARTICLE_71_DESC:0 "Когда [?display_newspaper_article_targets_71^0?global.newspaper_article_targets_71^0.GetAdjective] Войска вошли [?display_newspaper_article_targets_71^1?global.newspaper_article_targets_71^1.GetName] и освободил его от [?display_newspaper_article_targets_71^2?global.newspaper_article_targets_71^2.GetAdjective] Они нашли лагерь массового уничтожения. Похоже, они спасли несколько тысяч измученных, истощенных заключенных. [?display_newspaper_article_targets_71^2?global.newspaper_article_targets_71^2.GetAdjective]Крупнейшая «фабрика убийств» [?display_newspaper_article_targets_71^1?global.newspaper_article_targets_71^1.GetName]Освенцим. «Все они могут рассказать всю историю этого гигантского завода смерти, оснащенного самой современной технологией пыток и истребления», — сказал один из солдат. В отчетах указывается, что за последние годы здесь было убито не менее 1 500 000 человек."
 NEWSPAPER_ARTICLE_72_TITLE:0 "Переворот [?display_newspaper_article_targets_72^0?global.newspaper_article_targets_72^0.GetNameDef]"
 NEWSPAPER_ARTICLE_72_DESC:0 "Сегодня, [?display_newspaper_article_targets_72^0?global.newspaper_article_targets_72^0.GetLeader] Парламент был отстранен накануне крупной забастовки. Он поддержал короля и объявил чрезвычайное положение, установил военное положение и аннулировал различные статьи закона. [?display_newspaper_article_targets_72^0?global.newspaper_article_targets_72^0.GetAdjective] Конституция."
 NEWSPAPER_ARTICLE_73_TITLE:0 "Зимние Олимпийские игры [GetYear]"
 NEWSPAPER_ARTICLE_73_DESC:0 "Зимние Олимпийские игры в [?display_newspaper_article_targets_73^0?global.newspaper_article_targets_73^0.GetName] Торжественно было начато.[?display_newspaper_article_targets_73^1?global.newspaper_article_targets_73^1.GetLeader] Присутствовали, когда [?display_newspaper_article_targets_73^1?global.newspaper_article_targets_73^1.GetAdjective] Спортсмены завоевали первую золотую медаль игр."
 NEWSPAPER_ARTICLE_74_TITLE:0 "Дамба Гувера завершена"
 NEWSPAPER_ARTICLE_74_DESC:0 "Строительство плотины Гувера, названной в честь бывшего президента Герберта Гувера (Herbert Hoover), было начато в 1931 году, и теперь, на два года раньше запланированного срока, завершено. Окончательная цена составляет 49 000 000 $."
 NEWSPAPER_ARTICLE_75_TITLE:0 "Катастрофа в [?display_newspaper_article_targets_75^0?global.newspaper_article_targets_75^0.GetName]!"
 NEWSPAPER_ARTICLE_75_DESC:0 "Во время работ на плотине Гувера в [?display_newspaper_article_targets_75^0?global.newspaper_article_targets_75^0.GetName]Страшная авария привела к тому, что почти законченная плотина рухнула и высвободила запасенную воду в окружающие районы. Предполагаемый ущерб: [?display_newspaper_article_targets_75^1?global.newspaper_article_targets_75^1]$."
 NEWSPAPER_ARTICLE_76_TITLE:0 "Джордж V мертв!"
 NEWSPAPER_ARTICLE_76_DESC:0 "Его Величество Георг V, король [?display_newspaper_article_targets_76^0?global.newspaper_article_targets_76^0.GetNameDef] Он скончался на этой неделе. Его тихий покой видел Империю через Великую войну и Великую депрессию. Его сын примет мантию как король Эдуард VIII."
 NEWSPAPER_ARTICLE_77_TITLE:0 "Температурные записи в [?display_newspaper_article_targets_77^0?global.newspaper_article_targets_77^0.GetName]"
 NEWSPAPER_ARTICLE_77_DESC:0 "Большой удар тепловой волны [?display_newspaper_article_targets_77^0?global.newspaper_article_targets_77^0.GetName] На этой неделе. Установлены температурные рекорды и [?display_newspaper_article_targets_77^1?global.newspaper_article_targets_77^1] Люди погибли."
 NEWSPAPER_ARTICLE_78_TITLE:0 "Стучать в ногу [?display_newspaper_article_targets_78^0?global.newspaper_article_targets_78^0]. Круглый!"
 NEWSPAPER_ARTICLE_78_DESC:0 "[This.GetNewspaperArticle78GetRandomMaleName1] [This.GetNewspaperArticle78GetRandomLastName1] нокаутировать [This.GetNewspaperArticle78GetRandomMaleName2] [This.GetNewspaperArticle78GetRandomLastName2] в [?display_newspaper_article_targets_78^0?global.newspaper_article_targets_78^0]. В их боксерском матче в супертяжелом весе, на [This.GetNewspaperArticle78GetRandomMaleName3] [This.GetNewspaperArticle78GetRandomLastName3] Стадион, [?display_newspaper_article_targets_78^7?global.newspaper_article_targets_78^7.GetName]."
 NEWSPAPER_ARTICLE_79_TITLE:0 "Солнечное затмение"
 NEWSPAPER_ARTICLE_79_DESC:0 "Полное солнечное затмение было замечено в нескольких европейских и азиатских странах. Он был частью солнечного сароса. [?display_newspaper_article_targets_79^0?global.newspaper_article_targets_79^0]В то время как Гамма была ценностью [?display_newspaper_article_targets_79^1?global.newspaper_article_targets_79^1|3]."
 NEWSPAPER_ARTICLE_80_TITLE:0 "Тасманский тигр экзистенциален"
 NEWSPAPER_ARTICLE_80_DESC:0 "Последний известный тасманийский тигр (тилацин), названный [This.GetNewspaperArticle80GetRandomMaleName]Умер в зоопарке Хобарта в [?display_newspaper_article_targets_80^1?global.newspaper_article_targets_80^1.GetName]. Этот вид, который эволюционировал миллионы лет назад, теперь исчез с Земли благодаря человечеству. Навсегда."
 NEWSPAPER_ARTICLE_81_TITLE:0 "Новый фильм Walt Disney"
 NEWSPAPER_ARTICLE_81_DESC:0 "Только что вышел новый анимационный короткометражный фильм Уолта Диснея «Дональд и Плутон». Это первая часть серии Mickey Mouse, в которой Микки Маус не появляется. Больше информации в программе кино."
 NEWSPAPER_ARTICLE_82_TITLE:0 "Артефакт найден"
 NEWSPAPER_ARTICLE_82_DESC:0 "Группа археологов обнаружила сундук с инструментами эпохи викингов (около 1000 лет назад). [?display_newspaper_article_targets_82^0?global.newspaper_article_targets_82^0.GetName]. Ученые надеются, что это поможет в дальнейшем определить, как могла быть жизнь в это время."
 NEWSPAPER_ARTICLE_83_TITLE:0 "Выборы [?display_newspaper_article_targets_83^0?global.newspaper_article_targets_83^0.GetNameDef]"
 NEWSPAPER_ARTICLE_83_DESC:0 "Люди в [?display_newspaper_article_targets_83^0?global.newspaper_article_targets_83^0.GetNameDef] Избрали новое правительство.[?display_newspaper_article_targets_83^0?global.newspaper_article_targets_83^0.GetLeader], глава этого [?display_newspaper_article_targets_83^0?global.newspaper_article_targets_83^0.GetRulingIdeology] [?display_newspaper_article_targets_83^0?global.newspaper_article_targets_83^0.GetRulingParty]Теперь будет править [?display_newspaper_article_targets_83^0?global.newspaper_article_targets_83^0.GetNameDef] до следующих выборов."
 NEWSPAPER_ARTICLE_84_TITLE:0 "[This.GetNewspaperArticle84SpecialArticleTitle]"
 NEWSPAPER_ARTICLE_84_DESC:0 "[This.GetNewspaperArticle84SpecialArticleDesc]"
 NEWSPAPER_ARTICLE_85_TITLE:0 "[?display_newspaper_article_targets_85^0?global.newspaper_article_targets_85^0.GetNameDefCap] Он капитулировал!"
 NEWSPAPER_ARTICLE_85_DESC:0 "[?display_newspaper_article_targets_85^0?global.newspaper_article_targets_85^0.GetNameDefCap] Не смог выдержать [?display_newspaper_article_targets_85^1?global.newspaper_article_targets_85^1.GetAdjective] военной мощи.[?display_newspaper_article_targets_85^0?global.newspaper_article_targets_85^0.GetLeader] Капитуляция была подписана несколько часов назад, до того, как остальная часть правительства уже искала изгнание в союзной стране. Война скоро закончится?"
 NEWSPAPER_ARTICLE_86_TITLE:0 "Переворот [?display_newspaper_article_targets_86^0?global.newspaper_article_targets_86^0.GetNameDef]"
 NEWSPAPER_ARTICLE_86_DESC:0 "[?display_newspaper_article_targets_86^0?global.newspaper_article_targets_86^0.GetNameDefCap]: [?display_newspaper_article_targets_86^0?global.newspaper_article_targets_86^0.GetLeader] Он взял под контроль правительство. Он объявил чрезвычайное положение, установил военное положение и аннулировал различные статьи военного положения. [?display_newspaper_article_targets_86^0?global.newspaper_article_targets_86^0.GetAdjective] Конституция."
 NEWSPAPER_ARTICLE_87_TITLE:0 "Освобождение Парижа"
 NEWSPAPER_ARTICLE_87_DESC:0 "The [?display_newspaper_article_targets_87^0?global.newspaper_article_targets_87^0.GetAdjective] Париж был освобожден от [?display_newspaper_article_targets_87^1?global.newspaper_article_targets_87^1.GetAdjective] оккупация. Союзные войска вошли в город, а остальные [?display_newspaper_article_targets_87^1?global.newspaper_article_targets_87^1.GetAdjective] Гарнизон сдался. Опять же, [?display_newspaper_article_targets_87^0?global.newspaper_article_targets_87^0.GetAdjective] Флаг теперь можно увидеть летящим с Эйфелевой башни."
 NEWSPAPER_ARTICLE_88_TITLE:0 "Освобождение Лондона"
 NEWSPAPER_ARTICLE_88_DESC:0 "Бой закончился в Лондоне. [?display_newspaper_article_targets_88^0?global.newspaper_article_targets_88^0.GetName]. Как только он [?display_newspaper_article_targets_88^1?global.newspaper_article_targets_88^1.GetAdjective] Войска сдались, люди выбежали на улицы, чтобы отпраздновать своих освободителей, а по всему городу доносились церковные колокола."
 NEWSPAPER_ARTICLE_89_TITLE:0 "Освобождение Варшавы"
 NEWSPAPER_ARTICLE_89_DESC:0 "Разрушенный город Варшава упал, чтобы продвинуться [?display_newspaper_article_targets_89^0?global.newspaper_article_targets_89^0.GetAdjective] Армия, после последнего [?display_newspaper_article_targets_89^1?global.newspaper_article_targets_89^1.GetAdjective] Защитники отступили из его горящих предместий. Большая часть города лежит в руинах после предыдущих битв."
 NEWSPAPER_ARTICLE_90_TITLE:0 "[This.GetNewspaperArticle90SpecialArticleTitle]"
 NEWSPAPER_ARTICLE_90_DESC:0 "[This.GetNewspaperArticle90SpecialArticleDesc]"
 NEWSPAPER_ARTICLE_91_TITLE:0 "Ультиматум закончился - [?display_newspaper_article_targets_91^0?global.newspaper_article_targets_91^0.GetNameDefCap] нападения [?display_newspaper_article_targets_91^1?global.newspaper_article_targets_91^1.GetNameDef]!"
 NEWSPAPER_ARTICLE_91_DESC:0 "The [?display_newspaper_article_targets_91^1?global.newspaper_article_targets_91^1.GetAdjective] Президент [?display_newspaper_article_targets_91^1?global.newspaper_article_targets_91^1.GetLeader] Он сказал: «Рано утром». [?display_newspaper_article_targets_91^0?global.newspaper_article_targets_91^0.GetNameDef] Началась атака против [?display_newspaper_article_targets_91^1?global.newspaper_article_targets_91^1.GetName]. В этот исторический момент я обращаюсь ко всем гражданам с глубокой убежденностью в том, что весь народ в защиту своей свободы, независимости и чести соберется вокруг Верховного главнокомандующего вооруженными силами и даст надлежащий ответ на вопрос о том, что он хочет сделать. [?display_newspaper_article_targets_91^0?global.newspaper_article_targets_91^0.GetAdjective] агрессором, как это часто случалось в прошлом. Вся нация осознает свое правое дело и будет бороться до тех пор, пока победа не будет завершена»."
 NEWSPAPER_ARTICLE_92_TITLE:0 "[?display_newspaper_article_targets_92^0?global.newspaper_article_targets_92^0.GetName] теперь под [?display_newspaper_article_targets_92^1?global.newspaper_article_targets_92^1.GetAdjective] контроль"
 NEWSPAPER_ARTICLE_92_DESC:0 "После нескольких дней борьбы, [?display_newspaper_article_targets_92^1?global.newspaper_article_targets_92^1.GetNameDef] удалось получить контроль над [?display_newspaper_article_targets_92^0?global.newspaper_article_targets_92^0.GetName]. [?display_newspaper_article_targets_92^2?global.newspaper_article_targets_92^2.GetAdjective] Войска выводятся и перегруппируются для контратаки."
 NEWSPAPER_ARTICLE_93_TITLE:0 "[?display_newspaper_article_targets_93^0?global.newspaper_article_targets_93^0.GetAdjective] Армия в [?display_newspaper_article_targets_93^1?global.newspaper_article_targets_93^1.GetName] капитуляция"
 NEWSPAPER_ARTICLE_93_DESC:0 "После того, как он был окружен [?display_newspaper_article_targets_93^2?global.newspaper_article_targets_93^2.GetAdjective] Войска, 6-й [?display_newspaper_article_targets_93^0?global.newspaper_article_targets_93^0.GetAdjective] Армия сдалась в [?display_newspaper_article_targets_93^1?global.newspaper_article_targets_93^1.GetName]. После того, как город впал в [?display_newspaper_article_targets_93^0?global.newspaper_article_targets_93^0.GetAdjective] Руки, казалось, ничто не могло их остановить. После серьезных контратак оказывается, что [?display_newspaper_article_targets_93^2?global.newspaper_article_targets_93^2.GetAdjective]Можно."
 NEWSPAPER_ARTICLE_94_TITLE:0 "[?display_newspaper_article_targets_94^0?global.newspaper_article_targets_94^0.GetAdjective]-[?display_newspaper_article_targets_94^1?global.newspaper_article_targets_94^1.GetAdjective] Мирный договор!"
 NEWSPAPER_ARTICLE_94_DESC:0 "[?display_newspaper_article_targets_94^0?global.newspaper_article_targets_94^0.GetLeader]\"Мастерский удар\" разрушит надежды союзников по договору.[?display_newspaper_article_targets_94^0?global.newspaper_article_targets_94^0.GetNameDefCap] и [?display_newspaper_article_targets_94^1?global.newspaper_article_targets_94^1.GetNameDef] 10-летний пакт о ненападении обязывает их не помогать противникам в военных действиях. Вот это вот это [?display_newspaper_article_targets_94^2?global.newspaper_article_targets_94^2.GetName]Падение?"
 NEWSPAPER_ARTICLE_95_TITLE:0 "Германия атакует Россию"
 NEWSPAPER_ARTICLE_95_DESC:0 "Сверх [?display_newspaper_article_targets_95^0?global.newspaper_article_targets_95^0] [?display_newspaper_article_targets_95^1?global.newspaper_article_targets_95^1.GetAdjective] Дивизии атакуют [?display_newspaper_article_targets_95^2?global.newspaper_article_targets_95^2.GetNameDef] 2400-километровый фронт простирается от Северного мыса до Черного моря.[?display_newspaper_article_targets_95^2?global.newspaper_article_targets_95^2.GetLeader] Был удивлен нарушением пакта, возможен ли блицкриг?"
 NEWSPAPER_ARTICLE_96_TITLE:0 "[?display_newspaper_article_targets_96^0?global.newspaper_article_targets_96^0.GetNameDefCap] разрыв пакта"
 NEWSPAPER_ARTICLE_96_DESC:0 "Сегодня, [?display_newspaper_article_targets_96^1?global.newspaper_article_targets_96^1.GetLeader] Удивлен был [?display_newspaper_article_targets_96^0?global.newspaper_article_targets_96^0.GetAdjective] Дивизии маршируют по [?display_newspaper_article_targets_96^1?global.newspaper_article_targets_96^1.GetAdjective] территории.[?display_newspaper_article_targets_96^1?global.newspaper_article_targets_96^1.GetLeader] объявлено: «Было ошибкой доверять большевикам. Это предательское поведение должно быть наказано»."
 NEWSPAPER_ARTICLE_97_TITLE:0 "The [?display_newspaper_article_targets_97^0?global.newspaper_article_targets_97^0.GetAdjective] Революция"
 NEWSPAPER_ARTICLE_97_DESC:0 "Черный день для [?display_newspaper_article_targets_97^0?global.newspaper_article_targets_97^0.GetNameDef]и всей Европы. The [This.GetNewspaperArticle97RulingIdeologyGroupNounPlural] Взяв оружие и покорив [?display_newspaper_article_targets_97^2?global.newspaper_article_targets_97^2.GetName]. Сейчас идет гражданская война между [?display_newspaper_article_targets_97^0?global.newspaper_article_targets_97^0.GetNameDef] и [?display_newspaper_article_targets_97^1?global.newspaper_article_targets_97^1.GetNameDef]. Насколько ограниченным будет этот конфликт?"
 NEWSPAPER_ARTICLE_98_TITLE:0 "Испания набирает обороты в мире"
 NEWSPAPER_ARTICLE_98_DESC:0 "Несколько источников сообщают о [?display_newspaper_article_targets_98^0?global.newspaper_article_targets_98^0.GetAdjective] Дивизии, сражающиеся в [?display_newspaper_article_targets_98^1?global.newspaper_article_targets_98^1.GetNameDef], поддерживающий [This.GetNewspaperArticle98RulingIdeologyGroupNounPlural]. В то время как войска другой стороны поддерживаются [?display_newspaper_article_targets_98^2?global.newspaper_article_targets_98^2.GetNameDef]. Эта гражданская война, похоже, переросла в глобальный кризис."
 NEWSPAPER_ARTICLE_99_TITLE:0 "ИСТОРИЧЕСКИЙ БАСКВ ОТКАЗАН"
 NEWSPAPER_ARTICLE_99_DESC:0 "Волны из [?display_newspaper_article_targets_99^0?global.newspaper_article_targets_99^0.GetAdjective] Самолеты типа бросают тысячи бомб и зажигательных снарядов на Гернику. Бомбардировка этого открытого города далеко за линией заняла ровно 3 3/4 часа. За это время мощный флот самолетов, состоящий из трех [?display_newspaper_article_targets_99^0?global.newspaper_article_targets_99^0.GetAdjective] Типы, не прекращавшие разгрузку бомб массой до 1000 фунтов и двухфунтовых зажигательных снарядов. Боевые самолеты тем временем упали низко над центром города, чтобы расстрелять тех гражданских лиц, которые укрылись в полях."
 NEWSPAPER_ARTICLE_100_TITLE:0 "Смерть приходит из воздуха"
 NEWSPAPER_ARTICLE_100_DESC:0 "Нарисованная Пабло Пикассо огромная картина «Герника», символизирующая бомбардировочный ужас, была повешена в помещениях в Нью-Йорке. [?display_newspaper_article_targets_100^0?global.newspaper_article_targets_100^0.GetName]. Никто не может не впечатлиться этой работой, которая осуждает военное преступление больше, чем любые слова."
 NEWSPAPER_ARTICLE_101_TITLE:0 "The [?display_newspaper_article_targets_101^0?global.newspaper_article_targets_101^0.GetAdjective] Гражданская война закончилась"
 NEWSPAPER_ARTICLE_101_DESC:0 "[?display_newspaper_article_targets_101^1?global.newspaper_article_targets_101^1.GetName] Он сдался. Повстанцы, которые сражались, чтобы войти, вошли вчера в качестве войск признанных. [?display_newspaper_article_targets_101^0?global.newspaper_article_targets_101^0.GetAdjective] Правительство. Сторонники [?display_newspaper_article_targets_101^0?global.newspaper_article_targets_101^0.GetLeader] Долгое время ждал этого момента."
 NEWSPAPER_ARTICLE_102_TITLE:0 "[?display_newspaper_article_targets_102^0?global.newspaper_article_targets_102^0.GetAdjective] Войска проходят сквозь [?display_newspaper_article_targets_102^1?global.newspaper_article_targets_102^1.GetNameDef]"
 NEWSPAPER_ARTICLE_102_DESC:0 "Сегодня [?display_newspaper_article_targets_102^0?global.newspaper_article_targets_102^0.GetAdjective] Танковые танки достигли [?display_newspaper_article_targets_102^1?global.newspaper_article_targets_102^1.GetAdjective] Защитникам пришлось сдаться после всего лишь нескольких часов сопротивления.[?display_newspaper_article_targets_102^0?global.newspaper_article_targets_102^0.GetNameDefCap]Блицкриг вынужденный [?display_newspaper_article_targets_102^1?global.newspaper_article_targets_102^1.GetNameDef] После капитуляции только [?display_newspaper_article_targets_102^2?global.newspaper_article_targets_102^2] Дни!"
 NEWSPAPER_ARTICLE_103_TITLE:0 "[This.GetNewspaperArticle103SpecialArticleTitle]"
 NEWSPAPER_ARTICLE_103_DESC:0 "[This.GetNewspaperArticle103SpecialArticleDesc]"
 NEWSPAPER_ARTICLE_104_TITLE:0 "[?display_newspaper_article_targets_104^0?global.newspaper_article_targets_104^0.GetNameDefCap] Сдавайся!"
 NEWSPAPER_ARTICLE_104_DESC:0 "Капитуляция безусловна. Война против [?display_newspaper_article_targets_104^0?global.newspaper_article_targets_104^0.GetNameDef] Все кончено после [?display_newspaper_article_targets_104^0?global.newspaper_article_targets_104^0.GetLeader] капитулировать перед [?display_newspaper_article_targets_104^1?global.newspaper_article_targets_104^1.GetNameDef] Несколько часов назад. Принесет ли это, наконец, мир Европе?"
 NEWSPAPER_ARTICLE_105_TITLE:0 "[?display_newspaper_article_targets_105^0?global.newspaper_article_targets_105^0.GetNameDefCap] Спокойно!"
 NEWSPAPER_ARTICLE_105_DESC:0 "Всего несколько часов назад, [?display_newspaper_article_targets_105^0?global.newspaper_article_targets_105^0.GetLeader] Подписал мирный договор с [?display_newspaper_article_targets_105^1?global.newspaper_article_targets_105^1.GetNameDef]. The [?display_newspaper_article_targets_105^0?global.newspaper_article_targets_105^0.GetAdjective] Люди очень рады, что война наконец закончилась. Но как долго продлится этот мир?"
 NEWSPAPER_ARTICLE_106_TITLE:0 "[?display_newspaper_article_targets_106^0?global.newspaper_article_targets_106^0.GetNameDefCap] прилагаемый"
 NEWSPAPER_ARTICLE_106_DESC:0 "Официальные объявления кристально ясны: [?display_newspaper_article_targets_106^1?global.newspaper_article_targets_106^1.GetNameDefCap] только что аннексированный [?display_newspaper_article_targets_106^0?global.newspaper_article_targets_106^0.GetNameDef]. Хотя это явно противоречит международному праву, похоже, никаких последствий не будет."
 NEWSPAPER_ARTICLE_107_TITLE:0 "Вторжение [?display_newspaper_article_targets_107^0?global.newspaper_article_targets_107^0.GetNameDef]"
 NEWSPAPER_ARTICLE_107_DESC:0 "[?display_newspaper_article_targets_107^1?global.newspaper_article_targets_107^1.GetAdjective] Войска высадились в [?display_newspaper_article_targets_107^2?global.newspaper_article_targets_107^2.GetName] Сегодня. Было взято 100 км побережья, и пока войска продвигаются дальше, военно-морской флот высаживает еще тысячи. The [?display_newspaper_article_targets_107^0?global.newspaper_article_targets_107^0.GetAdjective] Дивизии в большой степени сопротивляются, но их распад оценивается очень скоро.[?display_newspaper_article_targets_107^0?global.newspaper_article_targets_107^0.GetNameDefCap]Дни благодати закончились."
 NEWSPAPER_ARTICLE_108_TITLE:0 "Центр нового мира"
 NEWSPAPER_ARTICLE_108_DESC:0 "Фюрер фюрера [?display_newspaper_article_targets_108^0?global.newspaper_article_targets_108^0.GetNameDef], [?display_newspaper_article_targets_108^0?global.newspaper_article_targets_108^0.GetLeader]Он посвятил новую центральную площадку СС и столицу нового мира. Массивное место было построено вокруг замкового комплекса Вевельсбурга недалеко от Падерборна. [?display_newspaper_article_targets_108^1?global.newspaper_article_targets_108^1.GetName]. Вокруг замка был построен целый новый город с множеством внутренних комплексов СС внутри стен замка. Новый объект демонстрирует претензии на власть СС - в Германии и во всем мире."
 NEWSPAPER_ARTICLE_109_TITLE:0 "Германия - столица Рейха"
 NEWSPAPER_ARTICLE_109_DESC:0 "Фюрер фюрера [?display_newspaper_article_targets_109^0?global.newspaper_article_targets_109^0.GetNameDef], [?display_newspaper_article_targets_109^0?global.newspaper_article_targets_109^0.GetLeader]Новая столица рейха: Германия. Возрождение бывшего города Берлина. [?display_newspaper_article_targets_109^1?global.newspaper_article_targets_109^1.GetName]Ему были представлены следующие слова: «Как мировая столица Германия будет сравнима только с Древним Египтом, Вавилоном и Римом! Что такое Лондон, что такое Париж по сравнению с этим? Германия - это чудо архитектуры, и она объединит германский народ своей красотой и возвышенностью."
 NEWSPAPER_ARTICLE_110_TITLE:0 "[?display_newspaper_article_targets_110^0?global.newspaper_article_targets_110^0.GetLeader]Террор"
 NEWSPAPER_ARTICLE_110_DESC:0 "Все больше и больше «предателей» подвергаются арестам и осуждениям. [?display_newspaper_article_targets_110^0?global.newspaper_article_targets_110^0.GetNameDef]. Многие сообщения указывают на то, что [?display_newspaper_article_targets_110^0?global.newspaper_article_targets_110^0.GetLeader] Он просто использует сложившуюся ситуацию в качестве предлога, чтобы легко заставить замолчать своих политических оппонентов в фиктивных судебных процессах."
 NEWSPAPER_ARTICLE_111_TITLE:0 "Герман Трупс въезжает в Ринеланд"
 NEWSPAPER_ARTICLE_111_DESC:0 "[?display_newspaper_article_targets_111^0?global.newspaper_article_targets_111^0.GetAdjective] Сегодня войска вошли в демилитаризованные зоны. [?display_newspaper_article_targets_111^1?global.newspaper_article_targets_111^1.GetName] и [?display_newspaper_article_targets_111^2?global.newspaper_article_targets_111^2.GetName]. [?display_newspaper_article_targets_111^3?global.newspaper_article_targets_111^3.GetNameDefCap] Он назвал это актом войны и потребовал военного и финансового наказания. [?display_newspaper_article_targets_111^0?global.newspaper_article_targets_111^0.GetNameDef]."
 NEWSPAPER_ARTICLE_112_TITLE:0 "[?display_newspaper_article_targets_112^0?global.newspaper_article_targets_112^0.GetNameDefCap] По его словам, это акт войны."
 NEWSPAPER_ARTICLE_112_DESC:0 "[?display_newspaper_article_targets_112^0?global.newspaper_article_targets_112^0.GetLeader] объявлено: \"Ремилитаризация [?display_newspaper_article_targets_112^1?global.newspaper_article_targets_112^1.GetName] Это был акт войны.[?display_newspaper_article_targets_112^2?global.newspaper_article_targets_112^2.GetNameDefCap] придется столкнуться с последствиями своих действий». Уже во время его выступления, [?display_newspaper_article_targets_112^0?global.newspaper_article_targets_112^0.GetAdjective] Дивизии маршируют в [?display_newspaper_article_targets_112^1?global.newspaper_article_targets_112^1.GetName]."
 NEWSPAPER_ARTICLE_113_TITLE:0 "[?display_newspaper_article_targets_113^0?global.newspaper_article_targets_113^0.GetLeader] отступать"
 NEWSPAPER_ARTICLE_113_DESC:0 "Вчера [?display_newspaper_article_targets_113^0?global.newspaper_article_targets_113^0.GetAdjective] Войска, оккупированные [?display_newspaper_article_targets_113^1?global.newspaper_article_targets_113^1.GetName] и [?display_newspaper_article_targets_113^2?global.newspaper_article_targets_113^2.GetName]. [?display_newspaper_article_targets_113^0?global.newspaper_article_targets_113^0.GetLeader] Они вновь были ремилитаризованы. После военных угроз со стороны многих стран, [?display_newspaper_article_targets_113^0?global.newspaper_article_targets_113^0.GetLeader] Теперь отступил и отвел свои силы."
 NEWSPAPER_ARTICLE_114_TITLE:0 "[?display_newspaper_article_targets_114^0?global.newspaper_article_targets_114^0.GetAdjective]вторгнуться [?display_newspaper_article_targets_114^1?global.newspaper_article_targets_114^1.GetNameDef]"
 NEWSPAPER_ARTICLE_114_DESC:0 "[?display_newspaper_article_targets_114^0?global.newspaper_article_targets_114^0.GetNameDefCap] Он вторгся в страны Бенилюкса. С тех пор [?display_newspaper_article_targets_114^0?global.newspaper_article_targets_114^0.GetLeader] Официально войну не объявляли. [?display_newspaper_article_targets_114^1?global.newspaper_article_targets_114^1.GetNameDef]Но атакованный без всякого предупреждения, это вторжение было очень неожиданным."
 NEWSPAPER_ARTICLE_115_TITLE:0 "[?display_newspaper_article_targets_115^0?global.newspaper_article_targets_115^0.GetNameDefCap] нападения [?display_newspaper_article_targets_115^1?global.newspaper_article_targets_115^1.GetNameDef] - Война в пацифике"
 NEWSPAPER_ARTICLE_115_DESC:0 "[?display_newspaper_article_targets_115^0?global.newspaper_article_targets_115^0.GetAdjective] воздушные атаки на [?display_newspaper_article_targets_115^1?global.newspaper_article_targets_115^1.GetAdjective] Морской оплот в Перл-Харборе, [?display_newspaper_article_targets_115^2?global.newspaper_article_targets_115^2.GetName]Об оборонных объектах на прилегающих островах было объявлено сегодня в Белом доме. Краткое заявление президента, раскрывающее информацию о нападениях, было продиктовано информационным агентствам и ассоциациям прессы. Он сказал: [?display_newspaper_article_targets_115^0?global.newspaper_article_targets_115^0.GetAdjective] Они атаковали Перл-Харбор с воздуха, а также все военно-морские и военные действия на острове Оаху, главной базе на Гавайских островах. Сообщалось о второй воздушной атаке\"."
 NEWSPAPER_ARTICLE_116_TITLE:0 "[?display_newspaper_article_targets_116^0?global.newspaper_article_targets_116^0.GetNameDefCap] раковина [?display_newspaper_article_targets_116^1?global.newspaper_article_targets_116^1.GetAdjective] подводная лодка"
 NEWSPAPER_ARTICLE_116_DESC:0 "Сегодня Белый дом подтвердил, что [?display_newspaper_article_targets_116^0?global.newspaper_article_targets_116^0.GetAdjective] Морской флот потопил [?display_newspaper_article_targets_116^1?global.newspaper_article_targets_116^1.GetAdjective] Подводная лодка в водах вокруг [?display_newspaper_article_targets_116^2?global.newspaper_article_targets_116^2.GetName]. В связи с этим инцидентом, [?display_newspaper_article_targets_116^0?global.newspaper_article_targets_116^0.GetAdjective] Флот, дислоцированный в Перл-Харборе, был передислоцирован на другую военно-морскую базу. Моряки сообщили, что видели [?display_newspaper_article_targets_116^1?global.newspaper_article_targets_116^1.GetAdjective] Самолеты, сопровождающие флот, но не вступающие и не атакующие. Они предполагали, что они засекают самолеты, и до того, как зенитные орудия могли быть выпущены, самолеты уже исчезли вдали."
 NEWSPAPER_ARTICLE_117_TITLE:0 "Первая атомная бомба была сброшена [?display_newspaper_article_targets_117^0?global.newspaper_article_targets_117^0.GetNameDef]"
 NEWSPAPER_ARTICLE_117_DESC:0 "[?display_newspaper_article_targets_117^1?global.newspaper_article_targets_117^1.GetLeader] Предупреждает врага о «дожде разорения». Самое страшное оружие уничтожения, которое сделал человек, и которое имеет мощность более 20 000 тонн тротила, было сброшено на Землю. [?display_newspaper_article_targets_117^1?global.newspaper_article_targets_117^1.GetAdjective] Самолеты сегодня на [?display_newspaper_article_targets_117^2?global.newspaper_article_targets_117^2.GetName]."
 NEWSPAPER_ARTICLE_118_TITLE:0 "[?display_newspaper_article_targets_118^0?global.newspaper_article_targets_118^0.GetNameDefCap] присоединяется к [?display_newspaper_article_targets_118^0?global.newspaper_article_targets_118^0.GetFactionName]"
 NEWSPAPER_ARTICLE_118_DESC:0 "На фоне роскошных церемоний и тщательно продуманной демонстрации организованного народного энтузиазма.[?display_newspaper_article_targets_118^0?global.newspaper_article_targets_118^0.GetNameDefCap] и [?display_newspaper_article_targets_118^1?global.newspaper_article_targets_118^1.GetNameDef] Сегодня был подписан безусловный и автоматический наступательно-оборонительный союз."
 NEWSPAPER_ARTICLE_119_TITLE:0 "США. Вступительная война в Европе"
 NEWSPAPER_ARTICLE_119_DESC:0 "[?display_newspaper_article_targets_119^0?global.newspaper_article_targets_119^0.GetNameDefCap] присоединившись к [?display_newspaper_article_targets_119^0?global.newspaper_article_targets_119^0.GetFactionName] против [?display_newspaper_article_targets_119^1?global.newspaper_article_targets_119^1.GetNameDef]. [?display_newspaper_article_targets_119^0?global.newspaper_article_targets_119^0.GetLeader] Сегодня вечером мы подписали резолюцию. Обратит ли это стороны к победе? [?display_newspaper_article_targets_119^0?global.newspaper_article_targets_119^0.GetFactionName]?"
 NEWSPAPER_ARTICLE_120_TITLE:0 "[?display_newspaper_article_targets_120^0?global.newspaper_article_targets_120^0.GetNameDefCap] вторгаться [?display_newspaper_article_targets_120^1?global.newspaper_article_targets_120^1.GetNameDefCap]"
 NEWSPAPER_ARTICLE_120_DESC:0 "Напряженность в Китае уже росла в течение последних недель. Вчера [?display_newspaper_article_targets_120^0?global.newspaper_article_targets_120^0.GetAdjective] и [?display_newspaper_article_targets_120^1?global.newspaper_article_targets_120^1.GetAdjective] Войска переползли через стратегический мост Марко Поло к юго-западу от города. [?display_newspaper_article_targets_120^2?global.newspaper_article_targets_120^2.GetName]. Сейчас они официально находятся в состоянии войны."
 NEWSPAPER_ARTICLE_121_TITLE:0 "Захватчики разоблачают Кринга Нанкина"
 NEWSPAPER_ARTICLE_121_DESC:0 "История [?display_newspaper_article_targets_121^0?global.newspaper_article_targets_121^0.GetAdjective] Ярость — это запись ужаса и стыда, которая останется одной из самых мрачных и кровавых страниц в истории человечества. [?display_newspaper_article_targets_121^0?global.newspaper_article_targets_121^0.GetAdjective] Агрессия. Были грабежи и издевательства над женщинами."
 NEWSPAPER_ARTICLE_122_TITLE:0 "ГИНДЕНБУРГ ВЫЯВЛЯЕТ"
 NEWSPAPER_ARTICLE_122_DESC:0 "The [?display_newspaper_article_targets_122^0?global.newspaper_article_targets_122^0.GetAdjective] более легкий, чем воздух, корабль «Гинденбург» взорвался и упал в массе пламени, когда он готовился к посадке в Лейкхерсте. [?display_newspaper_article_targets_122^1?global.newspaper_article_targets_122^1.GetName]. Было объявлено, что 34 из 97 человек на борту погибли."
 NEWSPAPER_ARTICLE_123_TITLE:0 "Первый полет Гинденбурга прошел успешно"
 NEWSPAPER_ARTICLE_123_DESC:0 "The [?display_newspaper_article_targets_123^0?global.newspaper_article_targets_123^0.GetAdjective]Гордость Зеппелина, «Гинденбург», сегодня достигла своего назначения на другой стороне Атлантического океана: Лейкхерст, [?display_newspaper_article_targets_123^1?global.newspaper_article_targets_123^1.GetName]. Катастрофа была предотвращена, когда утечка была обнаружена и исправлена перед посадкой."
 NEWSPAPER_ARTICLE_124_TITLE:0 "Хинденбургская трагедия"
 NEWSPAPER_ARTICLE_124_DESC:0 "The [?display_newspaper_article_targets_124^0?global.newspaper_article_targets_124^0.GetAdjective] более легкий, чем воздух, корабль «Гинденбург» взорвался и упал в массе пламени, когда он готовился к посадке в Лондоне. [?display_newspaper_article_targets_124^1?global.newspaper_article_targets_124^1.GetName]. Почти каждый человек на борту, включая большую часть [?display_newspaper_article_targets_124^0?global.newspaper_article_targets_124^0.GetAdjective] Королевская семья умерла."
 NEWSPAPER_ARTICLE_125_TITLE:0 "Летние Олимпийские игры [GetYear]"
 NEWSPAPER_ARTICLE_125_DESC:0 "[?display_newspaper_article_targets_125^0?global.newspaper_article_targets_125^0.GetLeader] торжественно открыла Олимпиаду, которую проводит [?display_newspaper_article_targets_125^0?global.newspaper_article_targets_125^0.GetNameDef] В этом году. Эксперты говорят, [?display_newspaper_article_targets_125^0?global.newspaper_article_targets_125^0.GetNameDef] На этот раз у нас есть все шансы выиграть золотые медали."
 NEWSPAPER_ARTICLE_126_TITLE:0 "[This.GetNewspaperArticle126SpecialArticleTitle]"
 NEWSPAPER_ARTICLE_126_DESC:0 "[This.GetNewspaperArticle126SpecialArticleDesc]"
 NEWSPAPER_ARTICLE_127_TITLE:0 "[?display_newspaper_article_targets_127^0?global.newspaper_article_targets_127^0.GetLeader] захватывает целиком [?display_newspaper_article_targets_127^1?global.newspaper_article_targets_127^1.GetName]"
 NEWSPAPER_ARTICLE_127_DESC:0 "После присоединения к [?display_newspaper_article_targets_127^2?global.newspaper_article_targets_127^2.GetName], [?display_newspaper_article_targets_127^0?global.newspaper_article_targets_127^0.GetAdjective] Сегодня дивизии вошли в Прагу. The [?display_newspaper_article_targets_127^1?global.newspaper_article_targets_127^1.GetAdjective] Войска не сопротивлялись, поэтому [?display_newspaper_article_targets_127^0?global.newspaper_article_targets_127^0.GetLeader] Можно ли эффективно аннексировать [?display_newspaper_article_targets_127^1?global.newspaper_article_targets_127^1.GetNameDef] Создать так называемый «Протекторат Богемии и Моравии». Поскольку это является нарушением Мюнхенского соглашения, подписанного недавно, мир теперь с нетерпением будет смотреть на реакцию со стороны международного сообщества. [?display_newspaper_article_targets_127^3?global.newspaper_article_targets_127^3.GetNameDef] и других соответствующих полномочий."
 NEWSPAPER_ARTICLE_128_TITLE:0 "Эдвард VIII АБДИКАТЫ"
 NEWSPAPER_ARTICLE_128_DESC:0 "The [?display_newspaper_article_targets_128^0?global.newspaper_article_targets_128^0.GetAdjective] Послание Кинга было следующим: «После долгих и тревожных размышлений я решил отказаться от престола, которому я уступил, и теперь сообщаю об этом, о своем окончательном и безотзывном решении»."
 NEWSPAPER_ARTICLE_129_TITLE:0 "Король и простолюдин"
 NEWSPAPER_ARTICLE_129_DESC:0 "Несмотря на сопротивление общественности, король Эдуард VIII сегодня сделал то, о чем никто не мог подумать. The [?display_newspaper_article_targets_129^0?global.newspaper_article_targets_129^0.GetAdjective] Король вступил в брачную связь с простолюдином и не-[?display_newspaper_article_targets_129^0?global.newspaper_article_targets_129^0.GetAdjective]Уоллис Симпсон."
 NEWSPAPER_ARTICLE_130_TITLE:0 "Король берёт власть"
 NEWSPAPER_ARTICLE_130_DESC:0 "Парламент был распущен![?display_newspaper_article_targets_130^0?global.newspaper_article_targets_130^0.GetLeader] Полный контроль над [?display_newspaper_article_targets_130^0?global.newspaper_article_targets_130^0.GetNameDef]Кажется, что король снова является главой государства и правительства. Уилл [?display_newspaper_article_targets_130^0?global.newspaper_article_targets_130^0.GetNameDef] Снова стать абсолютной монархией?"
 NEWSPAPER_ARTICLE_131_TITLE:0 "ЭДУАРД VIII ЗАХВАТЫВАЕТ ВЛАСТЬ"
 NEWSPAPER_ARTICLE_131_DESC:0 "Через некоторое время после отречения, [?display_newspaper_article_targets_131^0?global.newspaper_article_targets_131^0.GetLeader] Вернулся в качестве лидера [?display_newspaper_article_targets_131^0?global.newspaper_article_targets_131^0.GetRulingParty] и таким образом [?display_newspaper_article_targets_131^0?global.newspaper_article_targets_131^0.GetNameDef]. Хотя он назвал свое отречение «безотзывным решением», похоже, все-таки он пробился на трон."
 NEWSPAPER_ARTICLE_132_TITLE:0 "КОНФЕРЕНЦИЯ В Ялтинских ЭНДС"
 NEWSPAPER_ARTICLE_132_DESC:0 "Ялтинская конференция завершилась сегодня [?display_newspaper_article_targets_132^0?global.newspaper_article_targets_132^0.GetLeader] ([?display_newspaper_article_targets_132^0?global.newspaper_article_targets_132^0.GetName]и [?display_newspaper_article_targets_132^1?global.newspaper_article_targets_132^1.GetLeader] ([?display_newspaper_article_targets_132^1?global.newspaper_article_targets_132^1.GetName]) подписание документов, в которых они договорились о планах быстро выиграть войну и о планах по достижению мира."
 NEWSPAPER_ARTICLE_133_TITLE:0 "[?display_newspaper_article_targets_133^0?global.newspaper_article_targets_133^0.GetNameDefCap] Запуск нового линкора"
 NEWSPAPER_ARTICLE_133_DESC:0 "Признанный долгими и похотливыми аплодисментами, первый [?display_newspaper_article_targets_133^0?global.newspaper_article_targets_133^0.GetAdjective] 35-тысячный линкор сполз в реку Эльбу сегодня в полдень на церемонии запуска. Корабль получил имя Бисмарк в честь канцлера. [?display_newspaper_article_targets_133^0?global.newspaper_article_targets_133^0.GetLeader] Он восхвалял основателя Второго рейха и провозгласил его главным действующим лицом этого великого [?display_newspaper_article_targets_133^0?global.newspaper_article_targets_133^0.GetAdjective] Единство, возникшее при национал-социалистическом правлении. Эксперты не уверены, действительно ли число 35 000 тонн намного выше."
 NEWSPAPER_ARTICLE_134_TITLE:0 "Самоубийства на Уолл-стрит"
 NEWSPAPER_ARTICLE_134_DESC:0 "Вчера, [?display_newspaper_article_targets_134^0?global.newspaper_article_targets_134^0] Известные инвесторы покончили жизнь самоубийством после того, как обнаружили внезапное падение запасов тропических фруктов. Похоже, что напряженность в мире влияет на экономику, а также на международные дела."
 NEWSPAPER_ARTICLE_135_TITLE:0 "[?display_newspaper_article_targets_135^0?global.newspaper_article_targets_135^0.GetNameDefCap] Ищет международную помощь"
 NEWSPAPER_ARTICLE_135_DESC:0 "В последнее время [?display_newspaper_article_targets_135^0?global.newspaper_article_targets_135^0.GetNameDef]Несколько тысяч жизней было унесено в [This.GetNewspaperArticle135RandomDisaster]. Монастыри в регионе в настоящее время принимают беженцев, но полный масштаб бедствия до сих пор неизвестен."
 NEWSPAPER_ARTICLE_136_TITLE:0 "[This.GetNewspaperArticle136IdeologyAdjective] пугать в [?display_newspaper_article_targets_136^1?global.newspaper_article_targets_136^1.GetNameDefCap]"
 NEWSPAPER_ARTICLE_136_DESC:0 "После того, как крупный актер заявил о своей поддержке [This.GetNewspaperArticle136IdeologyAdjective] Вечеринка, граждане в шуме.[?display_newspaper_article_targets_136^1?global.newspaper_article_targets_136^1.GetAdjective] В настоящее время власти проводят интервью с крупными режиссерами, чтобы увидеть, насколько глубоко проникли средства массовой информации."
 NEWSPAPER_ARTICLE_137_TITLE:0 "Сбит гражданский самолет"
 NEWSPAPER_ARTICLE_137_DESC:0 "Коммерческий авиалайнер, вылетающий из [?display_newspaper_article_targets_137^0?global.newspaper_article_targets_137^0.GetName] Сегодня утром. когда летишь над [?display_newspaper_article_targets_137^1?global.newspaper_article_targets_137^1.GetName]Судя по всему, он был сбит неизвестным нападавшим. Кто мог совершить такую пародию?"
 NEWSPAPER_ARTICLE_138_TITLE:0 "Авиакатастрофа [?display_newspaper_article_targets_138^0?global.newspaper_article_targets_138^0.GetName]"
 NEWSPAPER_ARTICLE_138_DESC:0 "Сегодня [?display_newspaper_article_targets_138^1?global.newspaper_article_targets_138^1.GetAdjective] Коммерческий рейс потерпел крушение [?display_newspaper_article_targets_138^0?global.newspaper_article_targets_138^0.GetName]. В этой ужасной аварии, [?display_newspaper_article_targets_138^2?global.newspaper_article_targets_138^2] Люди погибли. Причина крушения до сих пор неизвестна, и соответствующие учреждения уже ведут расследование."
 NEWSPAPER_ARTICLE_139_TITLE:0 "Упадок африканских слонов"
 NEWSPAPER_ARTICLE_139_DESC:0 "Недавний опрос показал, что популяции африканских слонов сократились до самой низкой точки в истории. Что может быть причиной этой темной тенденции?"
 NEWSPAPER_ARTICLE_140_TITLE:0 "Цены на слоновую кость взлетели"
 NEWSPAPER_ARTICLE_140_DESC:0 "Как дополнительные стада слонов и носорогов обнаружены в [?display_newspaper_article_targets_140^0?global.newspaper_article_targets_140^0.GetName]Спрос на слоновую кость - легкое, красивое вещество, найденное в бивнях - резко возрос, что привело к буму слоновой кости."
 NEWSPAPER_ARTICLE_141_TITLE:0 "Наводнение реки Огайо"
 NEWSPAPER_ARTICLE_141_DESC:0 "В начале пыльной чаши река Огайо начала затоплять. Хотя ущерб не полностью определен, пострадавшие города простираются от Питтсбурга до Каира, штат Иллинойс. Сотни уже умерли, и конца этому не видно."
 NEWSPAPER_ARTICLE_142_TITLE:0 "Сильная засуха по всей Америке"
 NEWSPAPER_ARTICLE_142_DESC:0 "Несмотря на то, что Великие равнины страдают от засухи уже почти десять лет, площадь пострадавшего района в настоящее время простирается до [?display_newspaper_article_targets_142^0?global.newspaper_article_targets_142^0.GetName]. По мере того, как увядают посевы и высыхают реки, как семьи должны себя прокормить?"
 NEWSPAPER_ARTICLE_143_TITLE:0 "[?display_newspaper_article_targets_143^0?global.newspaper_article_targets_143^0.GetName]Обнаружено золото"
 NEWSPAPER_ARTICLE_143_DESC:0 "Обычная горная съемка обнаружила большие залежи редких металлов, включая золото и серебро. [?display_newspaper_article_targets_143^0?global.newspaper_article_targets_143^0.GetName]. Достаточно сказать [?display_newspaper_article_targets_143^1?global.newspaper_article_targets_143^1.GetAdjective] Власти в восторге от открытия и в настоящее время обсуждают дополнительные акцизы."
 NEWSPAPER_ARTICLE_144_TITLE:0 "Железнодорожная эффективность на все времена высокой"
 NEWSPAPER_ARTICLE_144_DESC:0 "По мере того, как трансафриканская железная дорога близится к завершению, железнодорожные технологии получили новые инвестиции в пики. Международные железнодорожные ассоциации обещают «значительные достижения в области технологий» в ближайшее время."
 NEWSPAPER_ARTICLE_145_TITLE:0 "Новый чудо-наркотик?"
 NEWSPAPER_ARTICLE_145_DESC:0 "Неожиданный чудодейственный препарат был обнаружен [?display_newspaper_article_targets_145^0?global.newspaper_article_targets_145^0.GetAdjective] Ученые: лимонный сок. Хотя вкус оставляет желать лучшего, ходят слухи, что лимоны могут даже вылечить рак."
 NEWSPAPER_ARTICLE_146_TITLE:0 "Это девочка!"
 NEWSPAPER_ARTICLE_146_DESC:0 "Хорошо известный [?display_newspaper_article_targets_146^0?global.newspaper_article_targets_146^0.GetAdjective] Актриса родила здоровую девочку прошлой ночью. Важные люди навещали молодую маму, чтобы доставить подарки и поздравления. [?display_newspaper_article_targets_146^0?global.newspaper_article_targets_146^0.GetLeader] Присутствовал."
 NEWSPAPER_ARTICLE_147_TITLE:0 "Дождевые леса Амазонки в огне!"
 NEWSPAPER_ARTICLE_147_DESC:0 "В связи с недавним увеличением мировых военных расходов, [?display_newspaper_article_targets_147^0?global.newspaper_article_targets_147^0.GetAdjective] Страдания населения были преодолены только недавним внезапным пожаром в Амазонии. Миллионы людей были эвакуированы до тех пор, пока ущерб не увеличился."
 NEWSPAPER_ARTICLE_148_TITLE:0 "[?display_newspaper_article_targets_148^0?global.newspaper_article_targets_148^0.GetLeader] Посвящается новому автобану"
 NEWSPAPER_ARTICLE_148_DESC:0 "The [?display_newspaper_article_targets_148^0?global.newspaper_article_targets_148^0.GetAdjective] канцлер [?display_newspaper_article_targets_148^0?global.newspaper_article_targets_148^0.GetLeader] Сегодня посвящена новая часть одной из наций, охватывающая автомагистрали. В своей речи он похвалил всех рабочих, которые внесли свой вклад в «дороги веры»."
 NEWSPAPER_ARTICLE_149_TITLE:0 "Введение KDF-Wagen"
 NEWSPAPER_ARTICLE_149_DESC:0 "The [?display_newspaper_article_targets_149^0?global.newspaper_article_targets_149^0.GetAdjective] канцлер [?display_newspaper_article_targets_149^0?global.newspaper_article_targets_149^0.GetLeader] Компания объявила о серийном производстве нового автомобиля: KDF-Wagen. В своем персике перед загипнотизированной толпой он назвал вполне доступный автомобиль «чудом народного сообщества»."
 NEWSPAPER_ARTICLE_150_TITLE:0 "[?display_newspaper_article_targets_150^0?global.newspaper_article_targets_150^0.GetName]: [This.GetNewspaperArticle150RandomResource] обнаруженный"
 NEWSPAPER_ARTICLE_150_DESC:0 "Обычный майнинг-опрос пришел на депозиты [This.GetNewspaperArticle150RandomResource] в [?display_newspaper_article_targets_150^0?global.newspaper_article_targets_150^0.GetName]. Достаточно сказать [?display_newspaper_article_targets_150^2?global.newspaper_article_targets_150^2.GetAdjective] Власти в восторге от открытия и в настоящее время обсуждают способы эффективного извлечения новых ресурсов."
 NEWSPAPER_ARTICLE_151_TITLE:0 "Piano Cat в туре"
 NEWSPAPER_ARTICLE_151_DESC:0 "Знаменитый кошачий пианист, известный просто как фортепианный кот, должен прибыть в город. [?display_newspaper_article_targets_151^0?global.newspaper_article_targets_151^0.GetName] На этой неделе. Ожидается, что художник-кошка сыграет ряд классических произведений."
 NEWSPAPER_ARTICLE_152_TITLE:0 "Банковый Роббери!"
 NEWSPAPER_ARTICLE_152_DESC:0 "Местный банк в [?display_newspaper_article_targets_152^0?global.newspaper_article_targets_152^0.GetName] На него напала банда в масках нер-до-вел. Полиция разыскивает преступников и предоставляет вознаграждение за любую информацию, ведущую к их поимке."
 NEWSPAPER_ARTICLE_153_TITLE:0 "Старейший человек жив"
 NEWSPAPER_ARTICLE_153_DESC:0 "Уважаемый джентльмен [This.GetNewspaperArticle153GetRandomMaleName] [This.GetNewspaperArticle153GetRandomLastName] Его назвали самым старым из ныне живущих.[This.GetNewspaperArticle153GetRandomLastName]Из этого [?display_newspaper_article_targets_153^2?global.newspaper_article_targets_153^2.GetAdjective] На юге вежливо умолял репортеров из этой газеты убраться с его газона."
 NEWSPAPER_ARTICLE_154_TITLE:0 "Письмо редактору"
 NEWSPAPER_ARTICLE_154_DESC:0 "Читатель обращает внимание на неосторожных пилотов парома, которые подвергают риску жизни пассажиров с их безрассудным скоростным вождением и рискованными маневрами."
 NEWSPAPER_ARTICLE_155_TITLE:0 "Гаванский лайнер в огне"
 NEWSPAPER_ARTICLE_155_DESC:0 "Праздничный лайнер Morro Castle, направлявшийся домой из Гаваны с 558 пассажирами и экипажем на борту, сегодня был поражен молнией у побережья Джерси и превратился в пылающий холокост. Пассажиры оказались в ловушке и обожжены."
 NEWSPAPER_ARTICLE_156_TITLE:0 "Новый фильм Чарли Чаплина"
 NEWSPAPER_ARTICLE_156_DESC:0 "Бродяга изо всех сил пытается жить в современном индустриальном обществе с помощью молодой бездомной женщины. \nНовый фильм с Чарли Чаплином «Современные времена» выйдет завтра."
 NEWSPAPER_ARTICLE_157_TITLE:0 "Релиз «Stagecoach»"
 NEWSPAPER_ARTICLE_157_DESC:0 "Группа людей, путешествующих на дилижансе, считает, что их путешествие осложняется угрозой Джеронимо и в процессе узнает что-то друг о друге. \nНовый фильм с Джоном Уэйном выйдет завтра."
 NEWSPAPER_ARTICLE_158_TITLE:0 "Унесенные ветром"
 NEWSPAPER_ARTICLE_158_DESC:0 "Манипулятивная женщина и бродячий мужчина ведут бурный роман во время американской гражданской войны и периодов Реконструкции. \nФильм выйдет в следующий вторник."
 NEWSPAPER_ARTICLE_159_TITLE:0 "«Волшебник страны Оз» выйдет завтра"
 NEWSPAPER_ARTICLE_159_DESC:0 "Дороти Гейл сметается с фермы в Канзасе в волшебную страну Оз в торнадо и отправляется на поиски со своими новыми друзьями, чтобы увидеть Волшебника, который может помочь ей вернуться домой в Канзас и помочь ее друзьям."
 NEWSPAPER_ARTICLE_160_TITLE:0 "Новый самолет изобрели"
 NEWSPAPER_ARTICLE_160_DESC:0 "The [?display_newspaper_article_targets_160^0?global.newspaper_article_targets_160^0.GetAdjective]-[?display_newspaper_article_targets_160^1?global.newspaper_article_targets_160^1.GetAdjective] Пионер авиации Игорь Сикорский успешно испытал свой новый самолет. «Вертолет» ведет себя иначе, чем самолеты. Можно с большим интересом отнестись к тому, что это будет означать для коммерческой авиации."
 NEWSPAPER_ARTICLE_161_TITLE:0 "Новое изобретение!"
 NEWSPAPER_ARTICLE_161_DESC:0 "Согласно секретным источникам, [?display_newspaper_article_targets_161^0?global.newspaper_article_targets_161^0.GetAdjective] Ученые изобрели новую технологию. Уилл [This.GetNewspaperArticle161ResearchedTech] Полезны ли они для будущих военных операций?"
 NEWSPAPER_ARTICLE_162_TITLE:0 "Обнаружен новый динозавр!"
 NEWSPAPER_ARTICLE_162_DESC:0 "В прошлом месяце Макс Литтлсальт обнаружил окаменевшие кости в пещере. [?display_newspaper_article_targets_162^0?global.newspaper_article_targets_162^0.GetName], [?display_newspaper_article_targets_162^1?global.newspaper_article_targets_162^1.GetName]. Теперь, кажется, совершенно очевидно, что он открыл новый вид динозавров. Очень маленький плотоядный был назван «Segisaurus»."
 NEWSPAPER_ARTICLE_163_TITLE:0 "Новый вид динозавров?"
 NEWSPAPER_ARTICLE_163_DESC:0 "Большие окаменелые кости недавно были найдены в [?display_newspaper_article_targets_163^0?global.newspaper_article_targets_163^0.GetName], [?display_newspaper_article_targets_163^1?global.newspaper_article_targets_163^1.GetName]. Обнаруженный вид был классифицирован как крупный зауропод и получил название «Омейзавр»."
 NEWSPAPER_ARTICLE_164_TITLE:0 "Обнаружена новая ископаемая"
 NEWSPAPER_ARTICLE_164_DESC:0 "В последнее время, [?display_newspaper_article_targets_164^0?global.newspaper_article_targets_164^0.GetAdjective] Палеонтолог Фридрих фон Хуэне обнаружил окаменелость в [?display_newspaper_article_targets_164^1?global.newspaper_article_targets_164^1.GetName]. Он приписал его зауроподу, который затем назвал «Сукцинодон». Эксперты расходятся во мнениях относительно того, принадлежит ли окаменелость новому животному."
 NEWSPAPER_ARTICLE_165_TITLE:0 "Веймара прикармливали, БУЧЕНВАЛЬДСКИЙ КАРМЕН ЛИБЕРАТИВНЫЙ"
 NEWSPAPER_ARTICLE_165_DESC:0 "Сегодня [?display_newspaper_article_targets_165^0?global.newspaper_article_targets_165^0.GetAdjective] Войска вошли в город Веймар, [?display_newspaper_article_targets_165^1?global.newspaper_article_targets_165^1.GetName]И официально освободил близлежащий концлагерь Бухенвальд. Похоже, что оставшиеся заключенные уже в основном взяли под контроль лагерь. По имеющимся данным, только за последние четыре месяца там погибло более 15 тысяч человек. Потрясенные грудами трупов, солдаты заставили сотни жителей Веймара посетить лагерь. Многие из них утверждали, что не знали о событиях, происходящих рядом с их дверью."
 NEWSPAPER_ARTICLE_166_TITLE:0 "Нюрнбергский процесс показал нацистские заблуждения"
 NEWSPAPER_ARTICLE_166_DESC:0 "После проведения более 200 заседаний Международный военный трибунал в Нюрнберге завершил свою работу, и подсудимые теперь ожидают приговора суда, который, как ожидается, будет вынесен примерно через месяц. Как правило, ожидается, что ни один из них не будет оправдан и что большинство, если не все, будут приговорены к смертной казни. Подсудимые отчаянно пытались оправдать себя как отдельных лиц, отрицая, что они лично совершили убийство или замышляли заговор против мира."
 NEWSPAPER_ARTICLE_167_TITLE:0 "[?display_newspaper_article_targets_167^0?global.newspaper_article_targets_167^0.GetNameDefCap] и [?display_newspaper_article_targets_167^1?global.newspaper_article_targets_167^1.GetNameDef] Подпиши мир"
 NEWSPAPER_ARTICLE_167_DESC:0 "Всего несколько часов назад, [?display_newspaper_article_targets_167^0?global.newspaper_article_targets_167^0.GetLeader] Подписал мирный договор с [?display_newspaper_article_targets_167^1?global.newspaper_article_targets_167^1.GetNameDef]. Этот мирный договор узаконивает рассрочку [?display_newspaper_article_targets_167^0?global.newspaper_article_targets_167^0.GetAdjective] марионеточное правительство в [?display_newspaper_article_targets_167^1?global.newspaper_article_targets_167^1.GetNameDef]."
 NEWSPAPER_ARTICLE_168_TITLE:0 "Монеты в [?display_newspaper_article_targets_168^0?global.newspaper_article_targets_168^0.GetName]"
 NEWSPAPER_ARTICLE_168_DESC:0 "Несколько вопросов о возрасте монет, находящихся в обращении [?display_newspaper_article_targets_168^0?global.newspaper_article_targets_168^0.GetNameDef] В последнее время их позиция как «законного платежного средства» была поднята. Корреспонденты выразили удивление по поводу получения в обмен монет 1817, 1819 и 1849 годов."
 NEWSPAPER_ARTICLE_169_TITLE:0 "Шоу Большого Водевиля"
 NEWSPAPER_ARTICLE_169_DESC:0 "Что-то новое в способе развлечения, полное театральное шоу под холстом, будет представлено зрителям в... [?display_newspaper_article_targets_169^0?global.newspaper_article_targets_169^0.GetName] Во вторник. Будет обеспечено специальное освещение и удобные сидения."
 NEWSPAPER_ARTICLE_170_TITLE:0 "Автомобили в столкновении"
 NEWSPAPER_ARTICLE_170_DESC:0 "Две машины были вовлечены в столкновение на шоссе сегодня днем. Авария произошла севернее [?display_newspaper_article_targets_170^0?global.newspaper_article_targets_170^0.GetName]. Одна машина была припаркована на обочине дороги во время аварии. Никто серьезно не пострадал."
 NEWSPAPER_ARTICLE_171_TITLE:0 "Женщине предъявлены обвинения в поджоге"
 NEWSPAPER_ARTICLE_171_DESC:0 "В результате расследований, проведенных детективом [This.GetNewspaperArticle171GetRandomMaleName] [This.GetNewspaperArticle171GetRandomLastName1]Женатая женщина, [This.GetNewspaperArticle171GetRandomFemaleName] [This.GetNewspaperArticle171GetRandomLastName2]Был арестован за поджог. Арест был произведен после пожара, уничтожившего жилое помещение. [?display_newspaper_article_targets_171^4?global.newspaper_article_targets_171^4.GetName]."
 NEWSPAPER_ARTICLE_172_TITLE:0 "Странный поступок мужчины"
 NEWSPAPER_ARTICLE_172_DESC:0 "После того, как он тщетно попросил полицейского арестовать его, мужчина по имени [This.GetNewspaperArticle172GetRandomMaleName] [This.GetNewspaperArticle172GetRandomLastName] Бросил свинцовый чернильник в окно полицейского участка [?display_newspaper_article_targets_172^2?global.newspaper_article_targets_172^2.GetName]. Быстро арестованный, он провел ночь в замке и был освобожден на следующее утро под залог.[This.GetNewspaperArticle172GetRandomLastName] Затем его попросили арестовать за пьянство, но ему сказали, что он трезв, что не может быть сделано. Затем он поднял чернильницу и бросил ее в комнату старшего сержанта и разбил окно. Он не дал никаких оснований для своих действий."
 NEWSPAPER_ARTICLE_173_TITLE:0 "Опасности «Красной Лиззи»"
 NEWSPAPER_ARTICLE_173_DESC:0 "Великая борьба против опасностей «Красной Лиззи», дешевого вина, которое ослепило и парализовало девочек в Великобритании, ведется Союзом Соединенного Королевства, организацией умеренности, и предпринимаются смелые усилия, чтобы повлиять на парламент, чтобы принять законодательство, запрещающее его продажу. «Красная Лиззи» продается в Лондоне, Ливерпуле, Глазго, Новом замке и Кардиффе, а девушки и женщины разоряются из-за этого. Она приносит своим жертвам страшные страдания."
 NEWSPAPER_ARTICLE_174_TITLE:0 "Ратушиные разговоры"
 NEWSPAPER_ARTICLE_174_DESC:0 "Две выдающиеся картины должны быть показаны в ратуше [?display_newspaper_article_targets_174^0?global.newspaper_article_targets_174^0.GetName] В этот уикенд. Один из них - \"Лорна Дун\", изображение Р.Д. Знаменитый роман Блэкмора показан сегодня вечером. История полна острых ощущений и действий."
 NEWSPAPER_ARTICLE_175_TITLE:0 "Лепер полностью вылечился"
 NEWSPAPER_ARTICLE_175_DESC:0 "После почти одиннадцати лет содержания под стражей в прокаженных станциях мужчина вышел на берег [?display_newspaper_article_targets_175^0?global.newspaper_article_targets_175^0.GetName] На днях он полностью излечился от болезни и без следа или порока, чтобы показать, что он страдал от болезни."
 NEWSPAPER_ARTICLE_176_TITLE:0 "Таинственная трагедия"
 NEWSPAPER_ARTICLE_176_DESC:0 "Таинственная трагедия произошла в [?display_newspaper_article_targets_176^0?global.newspaper_article_targets_176^0.GetName] Это привело к гибели двух двоюродных братьев. [This.GetNewspaperArticle176GetRandomMaleName] и [This.GetNewspaperArticle176GetRandomFemaleName] [This.GetNewspaperArticle176GetRandomLastName]. [This.GetNewspaperArticle176GetRandomMaleName] Он проделал глубокую дыру в скале в поисках золота. Свидетели были в ужасе, увидев тела в яме."
 NEWSPAPER_ARTICLE_177_TITLE:0 "Собачья лайка звонит"
 NEWSPAPER_ARTICLE_177_DESC:0 "Горячий лай по телефону в [?display_newspaper_article_targets_177^0?global.newspaper_article_targets_177^0.GetName], [?display_newspaper_article_targets_177^1?global.newspaper_article_targets_177^1.GetName]Собака обменялась приветствиями со своим другом по игре [?display_newspaper_article_targets_177^2?global.newspaper_article_targets_177^2.GetNameDef]. Во время разговора собаку «положили на проволоку». Его кора была отчетливо слышна в [?display_newspaper_article_targets_177^2?global.newspaper_article_targets_177^2.GetNameDef]."
 NEWSPAPER_ARTICLE_178_TITLE:0 "Землянки - тысячи погибших"
 NEWSPAPER_ARTICLE_178_DESC:0 "Дальнейшие землетрясения ощущались в течение всего дня. [?display_newspaper_article_targets_178^0?global.newspaper_article_targets_178^0.GetName], [?display_newspaper_article_targets_178^1?global.newspaper_article_targets_178^1.GetName]. Аэрофотосъемка местности показывает, что город находится в руинах. Трупы лежат на улицах, в то время как сотни лежат погребенными под обломками."
 NEWSPAPER_ARTICLE_179_TITLE:0 "Вещание"
 NEWSPAPER_ARTICLE_179_DESC:0 "[?display_newspaper_article_targets_179^0?global.newspaper_article_targets_179^0.GetName]6.0: Детский час. 7.0: Новости и отчеты. 8.0 Концертная программа. 9.0: Разговор. 5.0 p.m: Легкая музыкальная программа. 7.0 После ужина музыка. 8.0 Концертная программа."
 NEWSPAPER_ARTICLE_180_TITLE:0 "[?display_newspaper_article_targets_180^0?global.newspaper_article_targets_180^0.GetName] Разрушенные до основания - промышленные объекты уничтожены"
 NEWSPAPER_ARTICLE_180_DESC:0 "В 9.15 утра. Сегодня жаркое солнечное утро, [?display_newspaper_article_targets_180^1?global.newspaper_article_targets_180^1.GetAdjective] Бомбардировщик прибыл [?display_newspaper_article_targets_180^0?global.newspaper_article_targets_180^0.GetName]. Единственная атомная бомба, сброшенная на [?display_newspaper_article_targets_180^2?global.newspaper_article_targets_180^2.GetAdjective] город, с [?display_newspaper_article_targets_180^3?global.newspaper_article_targets_180^3|0]000 жителей, взорванных до руин на площади в четыре и одну десятую квадратных мили, более половины застроенной площади города, а также причинивших иной ущерб за пределами разрушенного района. Дым впервые поднялся в виде большого гриба. Пять крупных промышленных объектов были полностью уничтожены, но док-зона все еще стоит."
 NEWSPAPER_ARTICLE_181_TITLE:0 "[?display_newspaper_article_targets_181^2?global.newspaper_article_targets_181^2.GetAdjective] [?display_newspaper_article_targets_181^0?global.newspaper_article_targets_181^0.GetName] Взрывной — первая атака карликов"
 NEWSPAPER_ARTICLE_181_DESC:0 "The [?display_newspaper_article_targets_181^1?global.newspaper_article_targets_181^1.GetAdjective] Атомная бомба уничтожила 30% [?display_newspaper_article_targets_181^0?global.newspaper_article_targets_181^0.GetName]В том числе почти весь промышленный район. В заявлении военного ведомства говорится, что атомная бомба взорвалась в бою на такой высоте над землей, чтобы дать максимальный взрывной эффект против конструкций и распространить радиоактивные продукты в виде облака. Из-за высоты взрыва практически все радиоактивные продукты переносились вверх в колонне горячего воздуха, которая безвредно рассеивалась по широкой площади."
 NEWSPAPER_ARTICLE_182_TITLE:0 "[This.GetNewspaperArticle182SpecialArticleTitle]"
 NEWSPAPER_ARTICLE_182_DESC:0 "[This.GetNewspaperArticle182SpecialArticleDesc]"
 NEWSPAPER_ARTICLE_183_TITLE:0 "[This.GetNewspaperArticle183SpecialArticleTitle]"
 NEWSPAPER_ARTICLE_183_DESC:0 "[This.GetNewspaperArticle183SpecialArticleDesc]"
 NEWSPAPER_ARTICLE_184_TITLE:0 "Рождество вдали от дома - Санта Клаус приходит в детскую палату"
 NEWSPAPER_ARTICLE_184_DESC:0 "[?display_newspaper_article_targets_184^0?global.newspaper_article_targets_184^0.GetName] Сегодня его помнят так же щедро, как и всегда, как он обязан своим гражданам по отношению к тем, кто из-за болезни или по какой-то другой неподконтрольной им причине должен провести Рождество в учреждениях, а не в собственном доме или с родственниками. В детских домах или детских больницах дух Рождества праздновался так же тепло и уместно, как и прежде. Рождественская елка и прибытие Деда Мороза были главными особенностями торжеств."
 NEWSPAPER_ARTICLE_185_TITLE:0 "Рождественская история - Происхождение, потерянное в мифическом прошлом"
 NEWSPAPER_ARTICLE_185_DESC:0 "Что это за Рождество? Почти повсеместно в христианских странах конец декабря является годовщиной рождения Иисуса Христа. Возможно, вам будет интересно узнать немного о происхождении Рождества, которое вообще не датируется рождением Христа. Помните, что Рождество в северном полушарии приходится на середину зимы. После зимы наступает возрождение всех живых существ. Поэтому языческий праздник радости, возрождения и обновления был всеобщим задолго до воплощения."
