 NEWSPAPER_MOD_RULES:0 "Мировые правила новостей"
 NEWSPAPER_MOD_RULE_ENABLE_ARCHIVE:0 "Архив газеты"
 ENABLED_NEWSPAPER_MOD_RULE_ENABLE_ARCHIVE:0 "С этим §YАрхив газеты§! Каждый раз, когда публикуется новое газетное издание, предыдущее сохраняется, чтобы быть доступным позже. Архив можно открыть с помощью кнопки в интерфейсе газеты.\n\n§Rпредупреждение§! \n§HЭто требует сохранения большого количества значений в переменные и массивы, что увеличит размер сохранения игры, и, таким образом, может привести к уменьшению размера. §RЭффективность воздействия§!Особенно скорость сохранения и загрузки сейва!§W"
 DISABLED_NEWSPAPER_MOD_RULE_ENABLE_ARCHIVE:0 "С этим §YАрхив газеты§! Если вы отключены, вы сможете получить доступ к газетному изданию только в то время, когда оно является текущим."
