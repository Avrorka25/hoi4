 NEWSPAPER_ALERT_SMALL_TT:0 "Существуют §Y[?global.newspaper_new_articles_number]§! Новые статьи.\n--------------\nСтатьи в этом издании: \n §Y[GetNewspaperArticleTitle1]§! \n §Y[GetNewspaperArticleTitle2]§! \n §Y[GetNewspaperArticleTitle3]§! \n §Y[GetNewspaperArticleTitle4]§! \n §Y[GetNewspaperArticleTitle5]§! \n §Y[GetNewspaperArticleTitle6]§! \n §Y[GetNewspaperArticleTitle7]§! \n §Y[GetNewspaperArticleTitle8]§!"
