 rt56_j_edgar_hoover:0 "Дж. Эдгар Гувер"
 rt56_j_edgar_hoover_desc:0 "§L\"Мы всего лишь организация по сбору фактов. Мы никого не оправдываем. Мы никого не осуждаем.\"§!"
 rt56_j_edgar_hoover_mil:0 "Дж. Эдгар Гувер"
 rt56_j_edgar_hoover_mil_desc:0 "§L\"Правосудие вторично по отношению к закону и порядку\"§!"
 rt56_john_j_pershing:0 "Джон Дж. Першинг"
 rt56_USA_cash_and_carry_away:0 "Плати и забирай"
 rt56_USA_cash_and_carry_away_desc:0 "Поправка «Плати и забирай» к Закону о нейтралитете позволяет нам закупать невоенные материалы у [USA.getNameDef], если мы оплачиваем их заранее. Хотя свободных денег у нас нет, [USA.getNameDef] позволяет нам «занять» средства из своей казны, чтобы затем использовать их для оплаты товаров."
 sons_of_liberty:0 "Сыны свободы"
 sons_of_liberty_desc:0 "Мы уже однажды сражались с тиранией и сразимся вновь."
 deo_vindice:0 "Део виндиче"
 deo_vindice_desc:0 "«Под Богом — нашим защитником»"
 rt56_office_of_econimic_warfare_idea:0 "Управление экономической войны"
 rt56_office_of_econimic_warfare_idea_desc:0 ""
 r56_USA_world_loco_motive_works:0 "Мировая локомотивная мастерская"
 r56_USA_world_loco_motive_works_desc:0 "Пока остальной мир занят производством военной продукции, наша промышленность способна восполнить недостаток мирового производства локомотивов."
 rt56_USA_advisory_committee_on_uranium:0 "Исполнительный комитет S-1"
 rt56_USA_advisory_committee_on_uranium_desc:0 "Комитет, координирующий исследовательские работы в области ядерного деления."
 USA_office_of_strategic_services_desc:0 "Создание отдельного подразделения нашей разведывательной службы для помощи иностранным организациям сопротивления и проникновения во вражеские учреждения значительно поможет нам получить преимущество как сейчас, так и в будущих операциях."
 general_motor_electrco_motive_loco_works:0 "Дженерал Мотор Электро-Мотив Дизель"
 USA_the_worlds_loco_works_effect_tt:0 "§WОткрывает производство§! §Yпаровозов класса USATC S100§!"
 rt56_arnold_unlock_tt:0 "Военно-воздушным силам предоставлена автономия благодаря созданию §YОтдела планирования воздушной войны§!."
 USA_NATO_overwatch_tt:0 "§RВы сохраните только последнюю выбранную идею из доступных благодаря фокусам §!§Y«Надзор за Тихим океаном»§!§R и §!§Y«Возвращение в Европу»§!."
 rt56_USA_cash_and_carry_home:0 "Схема «Плати и забирай»"
 rt56_USA_cash_and_carry_home_desc:0 "Мы оказываем союзникам материальную помощь, позволяя им занимать у нас деньги, а затем оплачивать ими невоенные материалы. Мы можем продолжать это до тех пор, пока схема не будет раскрыта и юристы Белого дома больше не смогут отклонять возражения против этой практики в суде."
 r56_usa_three_dimensional_assault_force:0 "Трёхмерные штурмовые силы"
