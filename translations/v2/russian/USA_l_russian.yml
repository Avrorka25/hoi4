 USA_american_christian_identity:0 "Американская христианская идентичность"
 USA_american_christian_identity_desc:0 " "
 USA_three_dimensional_assault_force:0 "Трёхмерные штурмовые силы"
 USA_three_dimensional_assault_force_desc:0 "Развивая доктрину морского десанта, которая предусматривает не только хорошо оснащённую высадку, но также воздушную атаку и корабельную артиллерийскую поддержку, мы повысим вероятность успешного десантирования и захвата плацдарма."
 USA_continue_dieselisation:0 "Продолжить дизелизацию"
 USA_continue_dieselisation_desc:0 "События помешали модернизации подвижного состава железных дорог нашей страны. Пора вернуться к усилиям по дизелизации."
 USA_mobilize_the_railways:0 "Мобилизовать железные дороги"
 USA_mobilize_the_railways_desc:0 "Наши железные дороги должны быть мобилизованы и готовы к войне!"
 r56_USA_mobilize_the_railways_idea:0 "Мобилизация железных дорог"
 r56_USA_mobilize_the_railways_idea_desc:0 "Наши железные дороги должны быть мобилизованы и готовы к войне!"
 USA_the_worlds_loco_works:0 "Мировая локомотивная мастерская"
 USA_the_worlds_loco_works_desc:0 "Пока остальной мир занят производством военной продукции, мы должны задействовать многочисленные отечественные локомотивные заводы, чтобы обеспечить мир локомотивами."
 USA_bangalore_torpedo:0 "Бангалорская торпеда"
 USA_bangalore_torpedo_desc:0 ""
 USA_bangalore_torpedo_tt:0 "Открывает §Hбангалорскую торпеду§!\n§HИнженерные роты\n    Бронебойная атака: §G+15%§!\n    Прорыв: §G+15%§!§!\n"
