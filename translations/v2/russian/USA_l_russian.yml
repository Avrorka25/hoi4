 rt56_USA_member_of_nato_idea:0 "Член НАТО"
 r56_financing_marshall_plan:0 "Финансирование плана Маршалла"
 r56_USA_Korea_controls_peninsula:0 "§Y[KOR.getNameDefCap]§! контролирует все регионы Корейского полуострова."
 r56_USA_legislation_drafted_days_tt:0 "Текущее количество дней: [?USA_new_legislation_drafed_flag:days|Y0]"
 USA_new_legislation_drafed_flag:0 "Последний правительственный акт был подготовлен"
 r56_zippo_satan:0 "После исследования технологий §YОгнемёт§!, §YСапёрная рота II§! и §YУлучшенное шасси лёгкого танка§! создать вариант лёгкого огнемётного танка §YM3A1§! \n\nПосле исследования технологий §YОгнемёт§!, §YСапёрная рота II§! и §YУлучшенное шасси среднего танка§! создать вариант среднего огнемётного танка §YM4 «Зиппо»§!\n\n"
 USA_rally_the_martians_trigger_tt:0 "«Марсиане» бежали из §Y[HUN.GetNameDef]§! [HUN.GetFlag]"
 r56_USA_form_united_nations:0 "Устав Организации Объединённых Наций"
 r56_USA_foundation_of_NATO:0 "Основание НАТО"
 r56_USA_foundation_of_NATO_desc:0 "Мир вокруг нас стремительно меняется: многие бывшие великие державы лежат в руинах после опустошительной войны, прокатившейся по континентам. [USA.getNameDefCap] сумел не только сохранить, но и укрепить свой статус мировой сверхдержавы. Пришло время взять ситуацию под непосредственный контроль."
 r56_USA_overwatch_the_pacific:0 "Надзор за Тихим океаном"
 r56_USA_overwatch_the_pacific_desc:0 "Обширные территории Тихого океана остаются слабо защищёнными, поскольку наши промышленные и военные возможности были сосредоточены на войне на материке. Укрепление наших позиций в Тихом океане обеспечит господство [USA.getAdjective] сил в этом регионе."
 r56_USA_liberty_for_the_pacific:0 "Свобода для Тихого океана"
 r56_USA_liberty_for_the_pacific_desc:0 "Чтобы показать миру, что мы являемся истинными защитниками свободы, необходимо провести быструю и решительную деколонизацию Тихого океана! Только так мы сможем обеспечить стабильность и процветание этого региона!"
 r56_USA_withdraw_from_philippines:0 "Уйти с Филиппин"
 r56_USA_withdraw_from_philippines_desc:0 "Империализм изжил себя как экономическая и политическая концепция. Даровав одной из наших колоний, [PHI.getNamedef], желанную независимость, мы сможем обрести могущественного союзника в Восточной Азии и значительно ослабить националистическую и сепаратистскую риторику местного населения."
 r56_USA_fate_of_hawaii:0 "Судьба Гавайев"
 r56_USA_fate_of_hawaii_desc:0 "Благодаря своему стратегическому положению посреди Тихого океана Гавайи имеют решающее значение для наших военных усилий. Но, как бы мы ни желали сохранить эти земли, нельзя забывать об обещаниях, данных гавайскому народу. Пора сообщить ему о наших планах относительно островов."
 r56_USA_korean_issue:0 "Корейский вопрос"
 r56_USA_korean_issue_desc:0 "Возникнув в результате деколонизации, проведённой [JAP.getAdjective] властями, [KOR.getNameDef] отвернулся от принципов свободы, которым следуем мы. Новый режим в стране крайне неустойчив, что открывает перед нами несколько возможностей..."
 r56_USA_assistance_in_chinese_struggle:0 "Помощь в борьбе за Китай"
 r56_USA_assistance_in_chinese_struggle_desc:0 "Гражданская война среди [CHI.getAdjective] сил вновь бушует на Центральной равнине. И хотя [CHI.getNameDef], возможно, не разделяет наших принципов, мы должны позаботиться о том, чтобы Париж Востока не оказался под властью красной угрозы."
 r56_USA_intervention_in_vietnam:0 "Интервенция во Вьетнам"
 r56_USA_intervention_in_vietnam_desc:0 "Свобода несовместима с угнетением народа, кем бы оно ни осуществлялось — бывшей колониальной администрацией [FRI.getNameDef] или красными тиранами из [VIN.getNameDef]. Мы положим конец любым красным притязаниям в Индокитае."
 r56_USA_strike_the_prc:0 "Ударить по КНР"
 r56_USA_strike_the_prc_desc:0 "Как бы мы ни старались, красная чума охватывает всё большую часть Восточной Азии. Но прежде чем нанести удар по её источнику, мы должны обеспечить победу наших союзников в борьбе за материковый Китай."
 r56_USA_guide_true_democracies:0 "Направлять истинные демократии"
 r56_USA_guide_true_democracies_desc:0 "Многие страны поддержали [ENG.getNameDef] и [FRA.getNameDef] в их борьбе за свободу, однако некоторые из них совершенно не соответствуют определению демократического режима. Будучи ответственными и искренне преданными принципам отцов-основателей, мы больше не станем терпеть тех, кто лишает свой народ свобод."
 r56_USA_coordinate_research_effort:0 "Координировать научные усилия"
 r56_USA_coordinate_research_effort_desc:0 "Чтобы противостоять нависшей над миром красной угрозе, нам необходимо объединить все научные усилия. Исследования и технологии — ключи к окончательной победе. Только вместе мы одержим верх в этой борьбе!"
 r56_USA_return_to_europe:0 "Вернуться в Европу"
 r56_USA_return_to_europe_desc:0 "Только вмешательство [USA.getAdjective] сил спасло Европу от оккупации войсками [GER.getAdjective] державы во время Великой войны. [ENG.getNameDefCap] и [FRA.getNameDef], несомненно, вновь понадобится наша помощь, если мы хотим не допустить продвижения на запад Железного занавеса, воздвигнутого [SOV.getAdjective] силами."
 r56_USA_enact_marshall_plan:0 "Принять план Маршалла"
 r56_USA_enact_marshall_plan_desc:0 "Опустошённая и обезлюдевшая Европа вновь лежит в руинах после очередной войны. Инвестиции [USA.getAdjective] стороны помогут недавно созданным демократиям вернуть утраченное и укрепить приобретённое, чтобы подготовиться к следующему кризису."
 r56_USA_support_eastern_democrats:0 "Поддержать восточные демократии"
 r56_USA_support_eastern_democrats_desc:0 "Из-за предательства Запада многие страны Восточной Европы стали жертвами красной угрозы. Однако там всё ещё немало людей, стремящихся к свободе от оков коммунизма. Наши агенты готовы поддержать несколько протестов и демонстраций — возможно, это привлечёт к нашим идеям ещё больше людей?"
 r56_USA_secure_iberia:0 "Обезопасить Иберию"
 r56_USA_secure_iberia_desc:0 "Борьба между [SPR.getAdjective] силами привела к стремительным изменениям баланса сил в Европе. И пока мы окружаем красную угрозу, любая крупная держава Иберийского полуострова может нанести нам сокрушительный удар в спину. Верность [SPR.getAdjective] стороны нашему делу необходимо обеспечить тем или иным способом."
 r56_USA_ensure_greek_freedom:0 "Обеспечить свободу Греции"
 r56_USA_ensure_greek_freedom_desc:0 "Риторика [GRE.getAdjective] властей с каждым днём становится всё более враждебной. Наши дипломаты, опасаясь за свою жизнь, уже эвакуированы из страны. Правительственный кризис в [GRE.getNameDef] может стать прекрасной возможностью убедиться, что у коммунизма не осталось сторонников в Средиземноморье."
 r56_USA_greek_membership:0 "Членство Греции"
 r56_USA_greek_membership_desc:0 "Демократические взгляды и военная поддержка нашего дела со стороны [GRE.getNameDef] наверняка окажутся полезными при проведении любых операций на Балканах. Пригласим их представителей на переговоры."
 r56_USA_turkish_membership:0 "Членство Турции"
 r56_USA_turkish_membership_desc:0 "Это лишь вопрос времени, когда [SOV.getAdjective] власти поднимут вопрос о контролируемых [TUR.getAdjective] стороной проливах Босфор и Дарданеллы под предлогом «свободы торговли и судоходства». Мы должны действовать быстро и обеспечить союз нового [TUR.getAdjective] режима с нами, предоставив ему всестороннюю поддержку. "
 r56_USA_secure_yugoslavia:0 "Обезопасить Югославию"
 r56_USA_secure_yugoslavia_desc:0 "Угрожающие планы по объединению коммунистических движений Балкан в единое [YUG.getAdjective] образование представляют опасность для мира и являются явным нарушением принципа самоопределения. Мы не потерпим столь агрессивной риторики: отныне [YUG.getAdjective] власти считаются врагами демократии!"
 r56_USA_ally_yugoslavia:0 "Заключить союз с Югославией"
 r56_USA_ally_yugoslavia_desc:0 "Хотя [YUG.getNameDef] нельзя назвать по-настоящему демократической страной, она имеет протяжённые границы с другими балканскими странами. Союз с ней даст нам огромную оперативную базу в Европе. Дипломаты уже обсуждают условия официального соглашения."
 r56_USA_prepare_allies_for_the_inevitable:0 "Подготовить союзников к неизбежному"
 r56_USA_prepare_allies_for_the_inevitable_desc:0 "Завершить оформление оборонительных договоров лучше всего совместным развитием промышленности. У нас достаточно средств для поддержки программ быстрой индустриализации и перевооружения наших союзников. Пусть [SOV.getAdjective] силы знают, что мы более чем готовы разгромить их так называемую «революцию» одним стремительным ударом."
 r56_USA_a_cold_war:0 "Холодная война"
 r56_USA_a_cold_war_desc:0 "Когда мир разделён на два силовых блока, становится ещё очевиднее, что любая открытая война окажет катастрофическое воздействие на планету и будущее человеческой цивилизации. Мы сосредоточимся на восстановлении страны, превзойдём коммунистов в науке и производстве и одновременно будем тайно поддерживать демократические режимы по всему миру."
 r56_USA_commence_the_unthinkable:0 "Начать «Немыслимое»"
 r56_USA_commence_the_unthinkable_desc:0 "Как бы мы ни старались, красная угроза продолжает нависать над миром. Чтобы предотвратить наступление красного рассвета, мы должны нанести удар по источнику проблемы — [SOV.getNameDef]. Трепещи, коммунистическая угроза: вскоре сияние свободы озарит весь мир!"
 USA_guantanamo_bay_forward_base:0 "Передовая база в регионе [1050.GetName]"
 USA_guantanamo_bay_forward_base_desc:0 "Военно-морская база в регионе [1050.GetName] имеет огромное стратегическое значение для наших операций в Карибском море. Её расширение позволит значительно увеличить масштаб наших действий."
 r56_usa.6.t:0 "Судьба Гавайев"
 r56_usa.6.desc:0 "Внимание чиновников обратилось к самой населённой части наших владений в Тихом океане — Гавайям. \n\nБывшее Королевство Гавайи попало под влияние [USA.getNameDef] в 1850-х годах, когда наши дипломаты и торговцы заключили с местным правительством несколько договоров о дружбе и взаимной защите. Эти территории вошли в состав нашей страны по договору об аннексии, а гавайским политикам было обещано полноценное представительство в Конгрессе. \n\nДо сих пор мы не смогли исполнить данные их народу обещания, а значит, наше политическое кредо «Свобода и справедливость для всех» остаётся для местного населения лишь пустыми словами. \n\nПришло время раз и навсегда это изменить. Отныне Гавайи должны... "
 r56_usa.6.a:0 "... получить желанную свободу."
 r56_usa.6.b:0 "... получить местную автономию."
 r56_usa.6.c:0 "... войти в состав страны как новый штат."
 r56_usa.10.t:0 "[USA.getNameDefCap] предлагает союз"
 r56_usa.10.desc:0 "Посол [USA.getAdjective] передал нашему правительству срочное секретное послание, чтобы выяснить, заинтересованы ли мы в заключении союза. В послании добавлялось, что наши правительства могли бы сражаться как единое целое, подобно Вашингтону и Лафайету в своё время."
 r56_usa.10.a:0 "Великолепно!"
 r56_usa.10.b:0 "Это не в наших интересах."
 r56_usa.11.t:0 "Правительство [FRA.getAdjective] одобрило наше предложение о союзе!"
 r56_usa.11.desc:0 "В ответ на наше предыдущее послание посол [FRA.getAdjective] только что передал решение правительства [FRA.getAdjective]. Оно немедленно согласилось с нашим предложением. Французский военный атташе уже готов передать жизненно важные военные сведения и ожидает от нас того же."
 r56_usa.11.a:0 "Великолепно!"
 r56_usa.11.b:0 "Это не в наших интересах."
 r56_usa.12.t:0 "[FRA.getLeader] отклонил наше предложение о союзе!"
 r56_usa.12.desc:0 "Представитель [FRA.getAdjective] передал ответ своего правительства. К сожалению, наше предложение о союзе было отклонено."
 r56_usa.12.a:0 "Какое разочарование"
 r56_usa_deaths.1.t:0 "Смерть Чаффи"
 r56_usa_deaths.1.desc:0 " "
 r56_usa_deaths.1.a:0 "Отца бронетанковых войск никогда не забудут."
 r56_usa_deaths.2.t:0 "Смерть Малина Крейга"
 r56_usa_deaths.2.desc:0 " "
 r56_usa_deaths.2.a:0 "Великий человек, которого никогда не забудут"
 r56_usa.16.t:0 "Письмо Альберта Эйнштейна"
 r56_usa.16.desc:0 "Сэр, некоторые недавние работы, с которыми я ознакомился в рукописи, заставляют меня предполагать, что в самом ближайшем будущем элемент уран может стать новым и важным источником энергии. Некоторые аспекты возникшей ситуации, по-видимому, требуют бдительности и, при необходимости, быстрых действий со стороны администрации.\n\nПоэтому я считаю своим долгом довести до вашего сведения следующие факты и рекомендации:\n\nЗа последние четыре месяца стало весьма вероятным, что в большой массе урана удастся вызвать ядерную цепную реакцию. Представляется почти несомненным, что этого можно будет достичь в самом ближайшем будущем. Это явление также позволит создавать бомбы. Ввиду сложившейся ситуации вы, возможно, сочтёте желательным поддерживать постоянную связь между администрацией и группой физиков, работающих в Америке над цепными реакциями. Одним из возможных способов добиться этого было бы поручить данную задачу человеку, которому вы доверяете и который мог бы действовать в неофициальном качестве. В круг его обязанностей могло бы входить следующее:\n\na) Поддерживать связь с правительственными ведомствами, информировать их о дальнейшем развитии работ и выдвигать рекомендации относительно действий правительства, уделяя особое внимание обеспечению Соединённых Штатов запасами урановой руды.\n\nb) Ускорить экспериментальные работы, которые в настоящее время ведутся в пределах бюджетов университетских лабораторий, предоставив дополнительное финансирование.\n\nНасколько мне известно, Германия фактически прекратила продажу урана из захваченных ею рудников. Столь ранние меры, возможно, объясняются тем, что некоторые американские исследования урана теперь повторяются и там.\n\nИскренне ваш, Альберт Эйнштейн"
 r56_usa.16.a:0 "Мы должны действовать немедленно!"
 r56_usa.16.b:0 "Это всего лишь нагнетание страха."
 r56_on_action_event.2.t:0 "[USA.GetNameDefCap] меняет свой политический курс!"
 r56_on_action_event.2.d:0 "Изменения в политической жизни [USA.GetNameDef] привели к формированию новой системы правления, намеренной проводить внутреннюю политику, радикально отличающуюся от курса предшественников, урегулировать социальные разногласия и обеспечить порядок в новой стране. \n\nДипломаты уже объявили, что внешнеполитический курс страны [USA.GetAdjective] также претерпит серьёзные изменения, включая пересмотр прежних экономических соглашений и договоров, а также отказ от дипломатических союзов на различных уровнях. \n\nВ нашей администрации постоянно задаются вопросом: следует ли [ROOT.GetLeader] пересмотреть [ROOT.GetHerHis] отношение к [USA.GetNameDef] или [ROOT.GetSheHe] предпочтёт сохранить прежнюю позицию, пока ситуация не прояснится?"
 r56_on_action_event.2.a:0 "Мы откажемся от прежнего отношения к ним."
 r56_on_action_event.2.b:0 "Несомненно, новый режим будет столь же дружественным, как и его предшественник..."
 USA_manifest_destiny_r56:0 "Новое явное предначертание"
 USA_manifest_destiny_r56_desc:0 "Наша страна стала великой благодаря политике агрессивной экспансии. Пора к ней вернуться."
 mtg_usa_civil_war_fascists.20.b:0 "Дикси необходимо защитить!"
 RULE_ALLOW_RELEASE_NATIONS_NOT_HAW_TOOLTIP:0 "Гавайи были приняты в состав Союза."
 RULE_ALLOW_RELEASE_NATIONS_NOT_PUERTORICO_TOOLTIP:0 "Пуэрто-Рико было принято в состав Союза."
