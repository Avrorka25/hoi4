 USA_nato_faction:0 "НАТО"
 USA_dissolve_allies_found_nato_tt:0 "После завершения этого фокуса §YСоюзники§! будут преобразованы в §YНАТО§!!"
 r56_USA_invest_in_our_weaker_allies_tt:0 "Мы построим по 3 военных завода и 3 верфи у каждого нашего союзника, если у него меньше фабрик, чем у нас."
 rt56_USA_founder_of_nato_idea:0 "Основатель НАТО"
 rt56_USA_watching_over_pacific_idea:0 "Надзор за Тихим океаном"
