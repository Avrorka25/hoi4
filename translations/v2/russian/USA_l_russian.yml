 USA_raise_new_national_guard_unit:0 "Сформировать новые подразделения Национальной гвардии"
 USA_scorched_earth_northeast_coast:0 "Выжженная земля на северо-восточном побережье"
 USA_scorched_earth_southeast_coast:0 "Выжженная земля на юго-восточном побережье"
 USA_scorched_earth_gulf_coast:0 "Выжженная земля на побережье Мексиканского залива"
 USA_scorched_earth_west_coast:0 "Выжженная земля на западном побережье"
 r56_usa.5.t:0 "Знамение времени"
 r56_usa.5.desc:0 "На дорогах американского Юга можно увидеть признаки наступления новых времён. Многие издольщики и сельскохозяйственные рабочие продали свои дома, погрузили всё имущество в автомобили и отправились на Север. Внезапная миграция вызвана ухудшением условий жизни в сельских районах Юга, где многие семьи больше не могут сводить концы с концами. Большинство переселенцев надеется найти работу в промышленных центрах Севера."
 r56_usa.5.a:0 "В Детройте вам найдётся место!"
