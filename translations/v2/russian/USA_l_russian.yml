 USA_armored_infantry_chaffee_tt:0 "Исследование §Hусовершенствованного шасси лёгкого танка§! откроет нам проект лёгкого танка §HM24 «Чаффи»§!.\n"
 USA_90_division_gamble:0 "Ставка на 90 дивизий"
 USA_90_division_gamble_desc:0 ""
 r56_USA_90_division_gamble_tt:0 "Этот национальный дух действует, только если у нас не более §H160 дивизий HOI4§!.\n"
 USA_victory_program:0 "Программа победы"
 USA_victory_program_desc:0 ""
 USA_victory_program_focus_tt:0 "Мы всё ещё живём в мире, поэтому эта программа будет крайне непопулярна среди населения!\n"
 USA_flying_fortress:0 "Летающие крепости"
 USA_flying_fortress_desc:0 " "
 USA_enter_the_jet_age:0 "Вступить в реактивную эпоху"
 USA_enter_the_jet_age_desc:0 ""
 USA_expand_shipyard_facilities:0 "Расширить судостроительные мощности"
 USA_expand_shipyard_facilities_desc:0 ""
 USA_naval_air_coordination:0 "Координация морской авиации"
 USA_naval_air_coordination_desc:0 ""
 USA_expand_the_USMC_satan_tt:0 "Исследование §Hулучшенного шасси лёгкого танка§! и §Hогнемёта§! откроет нам проект лёгкого огнемётного танка §HM3A1 «Сатана»§!.\n"
 USA_expand_the_USMC_zippo_tt:0 "Исследование §Hулучшенного шасси среднего танка§! и §Hогнемёта§! откроет нам проект среднего огнемётного танка §HM4 «Зиппо»§!.\n"
 USA_homeland_security:0 "Безопасность страны"
 USA_homeland_security_desc:0 "Вторжение на основную территорию США больше не кажется фантастикой. Мы должны готовиться к худшему."
 USA_war_plan_blue:0 "Военный план «Синий»"
 USA_war_plan_blue_desc:0 "Теперь, когда наша земля находится в осаде, мы должны прибегнуть к более решительным способам сопротивления иностранным захватчикам."
 rt56_USA_homeland_secuirty:0 "Безопасность страны"
 USA_heirs_of_lafayette:0 "Наследники Лафайета"
 USA_heirs_of_lafayette_desc:0 "Вашингтон и Лафайет сражались бок о бок, освобождая нас от красных мундиров. В эти тревожные времена новый, более прочный союз может связать нас с Парижем."
 USA_enforced_loyalty:0 "Принудительная лояльность"
 USA_enforced_loyalty_desc:0 "Включив членов Бунда или Серебряных рубашек в состав сил правопорядка, мы сможем обеспечить идеологическое единообразие при применении закона."
 r56_usa.1.t:0 "Президентские выборы 1948 года"
 r56_usa.1.desc:0 "Томас Э. Дьюи вновь противостоит действующему кандидату. На этот раз Гарри Трумэн баллотируется в президенты как продолжатель дела Франклина Рузвельта."
 r56_usa.1.a:0 "Трумэн побеждает"
 r56_usa.1.b:0 "Дьюи побеждает"
 USA_mobilize_the_national_guard:0 "Мобилизовать резервы"
 USA_mobilize_the_national_guard_desc:0 "Мобилизация резервов значительно поможет увеличить численность нашей армии."
 rt56_rushed_r_n_d:0 "Форсированные исследования и разработки"
 rt56_rushed_r_n_d_desc:0 "Американская промышленность уделяет большое внимание быстрому созданию и внедрению технологических достижений. Однако у такого подхода есть множество недостатков: этап испытаний новых разработок сокращается, а возникающие проблемы игнорируются ради скорейшего получения результата."
 rt56_naval_funding_favoritism:0 "Предпочтительное финансирование флота"
 rt56_naval_funding_favoritism_desc:0 "Конгресс считает, что любая угроза Америке придёт из-за океана. Поэтому при распределении оборонных средств он отдаёт предпочтение расходам на флот, а не на армию."
 r56_usa.2.t:0 "Военно-воздушные силы требуют большей автономии"
 r56_usa.2.desc:0 "С момента создания Армейских военно-воздушных сил их офицеры и высшее командование армии постоянно спорили об автономии авиации в составе сухопутных войск. Похоже, после недавнего создания Отдела планирования воздушной войны этот вопрос достиг критической точки. Раньше мы заставляли замолчать офицеров ВВС, открыто поднимавших эту тему, особенно Генри Арнольда. Но теперь мы больше не можем игнорировать проблему и должны принять окончательное решение об автономии ВВС в составе наших вооружённых сил."
 r56_usa.2.c:0 "Военно-воздушные силы останутся в составе армии!"
 r56_usa.2.a:0 "Повышение Генри Арнольда станет хорошим компромиссом."
 r56_usa.2.b:0 "Предоставить военно-воздушным силам желаемую автономию."
 r56_usa.3.t:0 "Президентские выборы 1952 года"
 r56_usa.3.desc:0 "Новые выборы приближаются! Демократы выбрали Алдай Стивенсона, чтобы продолжить наследие Рузвельта, в то время как республиканцы выбрали не других, чем Дуайт Д. Сам Эйзенхауэр."
 r56_usa.3.a:0 "Стивенсон побеждает"
 r56_usa.3.b:0 "Эйзенхауэр побеждает"
 r56_usa.4.t:0 "[USA.GetNameDefCap] обязуется делиться результатами исследований"
 r56_usa.4.desc:0 "В недавнем меморандуме правительства [USA.GetAdjective] объявлено о намерении делиться результатами исследований с союзниками. Присоединение потребует некоторой перестройки и, вероятно, вызовет первоначальное сопротивление, но нам нечего опасаться."
 r56_usa.4.a:0 "Вместе мы справимся!"
 r56_usa.4.b:0 "Может быть, позже"
 r56_usa.7.t:0 "Президентские выборы 1956 года"
 r56_usa.7.desc:0 "Народ [USA.GetAdjective] вновь призван к урнам, чтобы определить судьбу страны."
 r56_usa.7.a:0 "Я за Айка, ты за Айка, все за Айка!"
 r56_usa.7.b:0 "Демократы должны победить!"
 r56_usa.8.t:0 "Президентские выборы 1956 года"
 r56_usa.8.desc:0 "Народ [USA.GetAdjective] вновь призван к урнам, чтобы определить судьбу страны."
 r56_usa.8.a:0 "Ещё четыре года"
 r56_usa.8.b:0 "Побеждает добрый друг Морбо. Хар-р-р-у-у-у!"
 r56_usa.9.t:0 "Партийный съезд 1952 года"
 r56_usa.9.desc:0 "После многих лет неустанного труда ради благополучия народа [USA.GetAdjective] первый секретарь [USA.GetCommunistParty] решил сложить с себя большую часть обязанностей. Партийному съезду предстоит выбрать между Джеймсом У. Фордом, заместителем Браудера, и Фрэнсисом К. Уолдроном, влиятельным партийным лидером."
 r56_usa.9.a:0 "Форд поведёт пролетариат [USA.GetAdjective]"
 r56_usa.9.b:0 "Первый секретарь Уолдрон направит революцию"
 r56_usa.13.t:0 "Герман Геринг предлагает свои услуги"
 r56_usa.13.desc:0 "Избежав краха национал-социалистического режима Адольфа Гитлера в Германии, бывший ас Великой войны и совсем недавно главнокомандующий немецкими люфтваффе прибыл в Техас и готов внести свой вклад в наши политические цели. Вполне вероятно, что он хочет сохранить свой ранг и почести в дополнение к возможному возвращению в качестве главы восстановленной самодостаточной Германии."
 r56_usa.13.a:0 "Нам всегда нужны идеологически надёжные таланты."
 r56_usa.13.b:0 "Отказать и уладить вопрос без лишнего шума."
 r56_usa.15.t:0 "Насекомые опустошают Колорадо"
 r56_usa.15.desc:0 "Волна за волной кузнечики разоряют одну ферму за другой в Колорадо. Все местные меры до сих пор оказывались бесполезными, и теперь рассматриваются всё более радикальные способы борьбы."
 r56_usa.15.a:0 "Энди, неси огнемёт!"
 r56_usa.15.b:0 "Может, Национальной гвардии пригодится немного взрывчатки?"
 r56_usa.15.c:0 "Что мы можем сделать против Божьей кары?"
 r56_USA_the_alaskan_trap:0 "Аляскинская ловушка"
 r56_USA_the_alaskan_trap_desc:0 "Создав у наших восточных врагов впечатление, что Аляска является привлекательной целью для вторжения, и проведя там небольшие работы силами Инженерного корпуса армии США, мы сможем превратить её в смертельную ловушку для сил вторжения."
 rt56_far_left_suppression:0 "Подавление крайне левых"
 rt56_far_left_suppression_desc:0 "Красная угроза 1920-х годов оставила глубокий след как среди сотрудников правоохранительных органов, так и среди общественности [ROOT.GetAdjective]. Это привело к преследованию и притеснению крайне левых движений по всей территории [ROOT.GetNameDef]. В последние годы борьбу с крайне левыми группами возглавляет Федеральное бюро расследований Дж. Эдгара Гувера."
 rt56_USA_mobilize_the_national_guard:0 "Мобилизация резервов"
 r56_USA_louisiana_maneuvers_oob_tt:0 "§WОткрывает три бесплатных§! §Yшаблона дивизий§!"
 r56_j_edgar_hoover_given_army_command:0 "В настоящее время является генералом"
 USA_three_dimensional_assault_force_tt:0 "§YХолланд Смит§! в настоящее время является генералом."
 r56_USA_join_the_mexican_revolutionaries:0 "Присоединиться к мексиканским революционерам"
 r56_USA_join_the_mexican_revolutionaries_desc:0 "Мексиканцы показывают нам, что революция может победить и в других частях Америки."
 USA_invite_cuba:0 "Пригласить Кубу"
 USA_invite_cuba_desc:0 "Кубинское правительство, похоже, готово сотрудничать с нами."
 USA_invite_synarchist_mexico:0 "Пригласить синархистскую Мексику"
 USA_invite_synarchist_mexico_desc:0 "Подъём синархистского движения в Мексике открывает дипломатические возможности для объединения континента вокруг нашего дела."
 USA_ally_the_new_canada:0 "Заключить союз с новой Канадой"
 USA_ally_the_new_canada_desc:0 "Аркан реорганизовал Канаду и ведёт её к великому будущему — разумеется, бок о бок с нами."
 USA_collaboration_with_the_mafia:0 "Сотрудничество с мафией"
 USA_collaboration_with_the_mafia_desc:0 "Хотя мы выступаем против институтов, за которые живёт и сражается мафия, у нас, несомненно, есть общий враг. Пока что нам стоит заключить этот необычный союз и сотрудничать друг с другом."
 USA_collaboration_with_the_mafia_tt:0 "После начала гражданской войны в каждом контролируемом нами регионе, являющемся центром мафии, будет сформировано §Y5 дивизий мафии§!."
 USA_cult_of_washington:0 "Культ Вашингтона"
 USA_cult_of_washington_desc:0 "Основатель нашей страны должен служить примером для всех нас. Будучи сильным военным, которому самой судьбой было предначертано величие, он, очевидно, являлся первым фашистом и благодаря своему мастерству и несгибаемой воле построил республику для всех истинных американцев."
 USA_celebrate_americas_founder:0 "Прославить основателя Америки"
 USA_modify_the_pledge:0 "Исправить клятву верности"
 USA_constitutional_convention_washington:0 "Вашингтонский конституционный конвент"
 USA_proclaim_washington_to_be_the_first_fascist:0 "Провозгласить Вашингтона первым фашистом"
 USA_raise_washington_to_general_of_the_armies:0 "Возвести Вашингтона в звание генерала армий"
 USA_rally_the_martians:0 "Сплотить марсиан"
 USA_combating_jim_crow:0 "Маргинализация афроамериканцев на Юге "
 USA_combating_jim_crow_desc:0 "Поражение Юга в Гражданской войне в США и унижения, которым, по его собственному мнению, он подвергся в эпоху Реконструкции, оказались невыносимыми для южного класса плантаторов. Они направили своё недовольство недавней утратой политического влияния на заговор против недавно освобождённого афроамериканского населения. Политические интриги южан достигли кульминации в Компромиссе 1877 года. Он ознаменовал формальное завершение Реконструкции на Юге и отмену мер защиты афроамериканских общин и политиков южных штатов. Фактически этот компромисс стал предательством и оставлением афроамериканцев Юга на произвол судьбы.\n \nС тех пор враждебно настроенные законодатели южных штатов, подталкиваемые ещё более враждебным населением, принимают законы, ущемляющие права афроамериканцев. Эти законы на расовой основе отделяют их от остального населения Юга в общественных местах и ограничивают их избирательные права. Одновременно жители этих штатов проводят собственные внесудебные кампании террора и издевательств над афроамериканцами. Подобные порядки получили название «Джим Кроу».\n\nХотя сейчас перед нами стоят более насущные проблемы, мы не можем игнорировать тот факт, что порядки «Джима Кроу» продолжают разрывать нашу страну — страну, обещающую «свободу и справедливость для всех»."
 USA_combating_jim_crow_map:0 "В этих штатах сейчас действуют законы «Джима Кроу»"
 USA_pass_a_new_civil_rights_bill:0 "Принять новый закон о гражданских правах"
 USA_pass_a_new_civil_rights_bill_tt:0 "В одном из принадлежащих нам штатов действуют §Rзаконы «Джима Кроу»§!"
 USA_pass_a_new_civil_rights_bill_effect_tt:0 "Открывает решения по борьбе с §R«Джимом Кроу»§! в штатах."
 r56_jim_crow_removed_tt:0 "§Gустраняет§! «Джим Кроу» в штате"
 r56_jim_crow_lowered_tt:0 "§Gснижает§! степень распространения «Джима Кроу» в штате"
 r56_jim_crow_state:0 "сейчас имеет §Rзаконы «Джима Кроу»§!."
 USA_pass_a_new_civil_rights_bill_flag:0 "Мы §Gприняли§! новый закон о гражданских правах"
 USA_pass_a_new_civil_rights_bill_flag_desc:0 "Новый закон о гражданских правах — хороший первый шаг в борьбе с «Джимом Кроу» по всему Югу."
 USA_fight_jim_crow_in_from:0 "Бороться с «Джимом Кроу» в регионе [FROM.GetName]"
 USA_population_migration:0 "Миграция населения"
 USA_population_migration_desc:0 "Хотя нынешние меры по восстановлению экономики помогли многим, у них появились заметные отрицательные последствия. Главным недостатком нашей политики стало ухудшение положения мелких сельских фермеров Юга. Многие из них больше не способны сводить концы с концами и вынуждены покидать свои дома, перебираясь туда, где есть работа. Сейчас это промышленные города Севера."
 USA_population_migration_mission_0:0 "Внутренняя миграция населения"
 USA_war_plan_blue_cat:0 "Военный план «Синий»"
 r56_USA_unite_congress:0 "Объединить Конгресс"
 r56_USA_desperate_measures:0 "Отчаянные меры"
 r56_USA_desperate_measures_tt:0 "§WОткрывает дополнительные§! §Yрешения военного плана «Синий»§! §Wрешения§!"
 r56_USA_sieze_cilivian_firearms:0 "Изъять гражданское огнестрельное оружие"
 r56_USA_sieze_cilivian_trucks:0 "Изъять гражданские грузовики"
