 r56_USA_decision_second_vinson_act:0 "Второй закон Винсона"
 USA_WPA_program_decision:0 "Запустить проект УОР"
 USA_WPA_program_decision_desc:0 "Привлечение людей к работе над проектом Управления общественных работ может немного ускорить наше строительство. Кроме того, это может заложить основу для дальнейших строительных проектов."
 USA_office_of_economic_warfare:0 "Управление экономической войны"
 USA_office_of_economic_warfare_desc:0 "Военные нужды требуют, чтобы природные ресурсы не отправлялись за границу, а использовались для снабжения нашей военной экономики. Управлению экономической войны будет поручен надзор за этим преобразованием."
 USA_cash_and_carry:0 "Схема «Плати и забирай»"
 USA_cash_and_carry_desc:0 "Поправка «Плати и забирай» к Закону о нейтралитете позволяет странам закупать у нас невоенные материалы при условии предоплаты. Конгресс полагает, что ни одна страна не сможет воспользоваться этим из-за отсутствия начального капитала. Мы можем использовать эту поправку для снабжения союзников, позволяя странам «занимать» деньги из нашей казны, а затем оплачивать ими товары."
 USA_double_victory:0 "Двойная победа"
 USA_double_victory_desc:0 "Поддержка афроамериканского сообщества крайне важна. Мы можем добиться её с помощью целенаправленных пропагандистских кампаний. Они могут вводить людей в заблуждение, но в самые критические моменты мы не можем допустить раскола страны."
 USA_fight_jim_crow_now:0 "Покончить с законами Джима Кроу"
 USA_fight_jim_crow_now_desc:0 "Мы больше не можем позволять практике Джима Кроу оставаться пятном на нашей нации. Пора решительно положить ей конец."
 USA_expand_unoffical_operations:0 "Расширить неофициальные операции"
 USA_expand_unoffical_operations_desc:0 "Опыт показал, что разведка способна решить исход борьбы между победой и поражением. Она может не только помочь нам победить, но и предотвратить войну. Удачно заложенная бомба способна заменить целый флот бомбардировщиков, а хорошо внедрённый агент — дивизию."
 USA_defense_contractors:0 "Оборонные подрядчики"
