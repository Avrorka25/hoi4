 SAM_aftermath_of_the_goodwill_mission_desc:0 "После успешных переговоров с [NZL.GetAdjective] правительством мы добились высокой степени автономии. Куда нам двигаться дальше?"
 SAM_with_the_crown:0 "Верность Империи"
 SAM_with_the_crown_desc:0 "Место Самоа — в Империи. Независимость не сделает нас сильнее, а другие державы могут посчитать нас лёгкой добычей."
