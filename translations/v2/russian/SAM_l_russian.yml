 SAM_extend_a_hand_to_america:0 "Отношения с американцами"
 SAM_extend_a_hand_to_america_desc:0 "У Самоа и США всегда были непростые отношения. Хотя США гарантируют нашу безопасность, они также оккупируют восточную часть нашей страны, которая несомненно является самоанской. Кроме того, они подавили Туи Мануа и полностью запретили движение Мау. Чтобы не допустить дальнейшего ухудшения самоано-американских отношений, нам следует попытаться вернуть эту территорию и тем самым успокоить ситуацию."
 SAM_our_own_way:0 "Независимость!"
 SAM_our_own_way_desc:0 ""
 SAM_goodwill_mission:0 "Миссия доброй воли"
 SAM_a_divided_samoa:0 "Разделённое Самоа"
 SAM_tumua_and_pule:0 "Тумуа ма Пуле"
 SAM_tumua_and_pule_desc:0 "Тумуа ма Пуле играют ключевую роль в избрании короля и были основой политики Самоа на протяжении всей истории монархии. Лучше умиротворить их, чем бросать им вызов."
 SAM_cacao_industry:0 "Экспортные сельскохозяйственные культуры"
 SAM_cacao_industry_desc:0 "Основу экспорта Самоа составляют какао и копра. Хотя Самоа идеально подходит для выращивания этих культур, многие, если не все, плантации принадлежат иностранцам — главным образом крупным корпорациям или богатым европейским капиталистам... Национализация плантаций может вызвать проблемы с их владельцами и странами их происхождения."
 SAM_sun_and_mercury_idea:0 "Тихоокеанская война"
 new_zealand.11.t:0 "Миссия доброй воли"
 new_zealand.11.d:0 "Недавняя «Миссия доброй воли» в Апиа, Самоа, признала Мау законной политической организацией, отменила Самоанский указ о правонарушителях и прекратила ссылку Олафа Нельсона. После всего достигнутого, возможно, настало время начать постепенный процесс создания независимого самоанского государства."
 new_zealand.11.a:0 "Они ещё не готовы."
 new_zealand.11.b:0 "Они ждали достаточно долго."
 new_zealand.11.c:0 "«Птица Толоа улетает далеко, но всегда возвращается к воде»."
 samoa.1.t:0 "Независимость Самоа"
 samoa.1.desc:0 "После постепенного процесса создания нашего государства мы наконец добились долгожданной независимости. Теперь нам предстоит решить, кто должен возглавить страну."
 samoa.1.a:0 "Монархия нас подвела!"
 samoa.1.b:0 "Монархия сделала всё возможное для Самоа."
 samoa.2.t:0 "[SAM.getNameDefCap] запрашивает [1088.GetName]"
 samoa.2.desc:0 "Самоа хочет вновь объединить свой народ в одной стране. По Договору об уступке Мануа и Акту об уступке Тутуилы мы аннексировали восточную часть Самоа и до сих пор удерживаем её как территорию. Теперь мы можем либо вернуть её самоанскому народу, либо оставить себе. Последнее может вызвать беспорядки из-за священных и исторических связей территории с Самоа."
 samoa.2.a:0 "Вернуть им их острова."
 samoa.2.b:0 "Договор должен соблюдаться!"
 samoa.3.t:0 "Самоа запрашивает [643.GetName]"
 samoa.3.desc:0 "В рамках недавнего курса на объединение Полинезии Самоа стремится получить [643.GetName]"
 samoa.3.a:0 "Что мы теряем?"
 samoa.3.b:0 "Опять пытаются забрать наши острова?"
 samoa.4.t:0 "Самоа запрашивает [734.GetName]"
 samoa.4.desc:0 "В рамках недавнего курса на объединение Полинезии Самоа стремится получить [734.GetName]"
 samoa.4.a:0 "Выглядит многообещающе."
 samoa.4.b:0 "Тонга не будет потеряна!"
 samoa.5.t:0 "Самоа запрашивает [641.GetName]"
 samoa.5.desc:0 "В рамках недавнего курса на объединение Полинезии Самоа стремится получить [641.GetName]"
 samoa.5.a:0 "Выглядит многообещающе."
 samoa.5.b:0 "Таити — таитянам!"
 samoa.6.t:0 "Самоа запрашивает [636.GetName]"
 samoa.6.desc:0 "В рамках недавнего курса на объединение Полинезии Самоа стремится получить [636.GetName]"
 samoa.6.a:0 "Выглядит многообещающе."
 samoa.6.b:0 "Фиджи — фиджийцам!"
 samoa.7.t:0 "Самоа запрашивает [629.GetName]"
 samoa.7.desc:0 "В рамках недавнего курса на объединение Полинезии Самоа стремится получить [629.GetName]"
 samoa.7.a:0 "Выглядит многообещающе."
 samoa.7.b:0 "Пусть приходят."
 samoa_result.1.t:0 "[FROM.getNameDefCap] принимает наш запрос!"
 samoa_result.1.desc:0 "[FROM.getNameDefCap] передала нам желаемую территорию."
 samoa_result.1.a:0 "Что ж, это было легко."
 samoa_result.2.t:0 "[FROM.getNameDefCap] отклоняет наш запрос!"
 samoa_result.2.desc:0 "[FROM.getNameDefCap] отвергла наши требования. Возможно, стоит пересмотреть наш подход."
 samoa_result.2.a:0 "Мы вернёмся."
 samoa_smuggle_stuffs.1.t:0 "Операция завершилась успехом!"
 samoa_smuggle_stuffs.1.desc:0 "Наша недавняя операция по контрабанде оружия из [1088.GetName] увенчалась успехом! \nХотя мы не можем проводить крупномасштабные операции и добывать столько оружия, сколько хотелось бы, небольшие операции тоже будут полезны и пока обеспечат нас необходимым количеством снаряжения. Пусть его и немного."
 samoa_smuggle_stuffs.6.t:0 "Операция провалилась!"
 samoa_smuggle_stuffs.6.desc:0 "Несмотря на наши усилия, нам не удалось захватить никакого снаряжения, а наш экипаж был арестован на месте."
 samoa_smuggle_stuffs.6.a:0 "Что ж, пора домой..."
 samoa_fautasi_race.1.t:0 "Гонка фаутаси!"
 samoa_fautasi_race.1.desc:0 "Сегодня в Западном Самоа прошла гонка фаутаси. Она проводится ежегодно 1 июля в честь самоанской автономии от [NZL.GetName], и сегодня как раз этот день. Посмотрим, кто победит в этот раз."
 samoa_fautasi_race.1.a:0 "И победитель...?"
 samoa_coup.1.t:0 "Тумуа ма Пуле совершают переворот!"
 samoa_coup.1.desc:0 "Тумуа ма Пуле являются высшей властью в Самоа. Бросать им вызов было бы крайне неразумно. \nХотя мы не собирались свергать их или ограничивать их полномочия, они считают нас врагами из-за нашей политики против монархии и традиционной политической системы Самоа и подняли переворот с целью свергнуть наш режим. При поддержке народа он был быстро подавлен. Теперь, когда Тумуа и Пуле контролируют правительство, кто должен стать новым лидером?"
 samoa_coup.1.a:0 "Тупуа Тамасесе кажется хорошим выбором."
 samoa_coup.1.b:0 "Матаафа Фаумуина — лучший кандидат."
 mau_movement:0 "Движение Мау"
 calm_mau_movement:0 "Движение Мау"
 SAM_western_puppet:0 "Западная марионетка"
 SAM_smuggle_operations:0 "Контрабандные операции"
 SAM_smuggle_operations_desc:0 "В настоящее время Самоа не располагает промышленностью, способной производить собственное оружие. Чтобы компенсировать это, следует попытаться добывать вооружение контрабандой с востока, где американский гарнизон может оставлять часть снаряжения без охраны. Получив эти запасы, мы сможем временно усилить свои силы."
 SAM_smuggle_operation_decision:0 "Начать контрабандную операцию"
 SAM_launch_operation_into_pago_pago:0 "Мы проведём контрабандную операцию в [1088.GetName] и попробуем собрать оставленное без охраны снаряжение"
 samoa_smuggle_stuffs.success:0 "Контрабандная операция: успех!"
 samoa_smuggle_stuffs.failed:0 "Контрабандная операция: провал!"
 SAM_request_american_samoa:0 "Запросить Американское Самоа"
 SAM_request_american_samoa_desc:0 "[USA.getNameDefCap] и Самоа связывает долгая история. Американцы вмешиваются в самоанские дела ещё с XIX века и закрепили своё присутствие договорами с вождями Тутуилы и Мануа. В результате независимость самоанских вождей была упразднена, а Соединённые Штаты официально аннексировали острова. \nНо даже под американским управлением они остаются самоанскими и принадлежат самоанскому народу. Если повезёт, мы сможем договориться с Соединёнными Штатами о возвращении островов."
