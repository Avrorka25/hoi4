 MPL_AI_BEHAVIOR:0 "£GFX_gamerules_MPL_mandate Палестинский мандат"
 RULE_OPTION_MPL_MANDATE_STAY:0 "£GFX_gamerules_MPL_mandate Мандат удерживается"
 RULE_OPTION_MPL_MANDATE_STAY_AI_DESC:0 "В ответ на Арабское восстание 1936 года Артур Гренфелл Уокоп введёт чрезвычайные постановления и подавит сопротивление еврейских и арабских ополчений."
 RULE_OPTION_MPL_MANDATE_COLLAPSE:0 "£GFX_gamerules_ISR_state £GFX_gamerules_PAL_neutrality Крах мандата"
 RULE_OPTION_MPL_MANDATE_COLLAPSE_AI_DESC:0 "В ответ на Арабское восстание 1936 года Артур Гренфелл Уокоп введёт чрезвычайные постановления, но не успеет достаточно быстро справиться с еврейским и арабским сопротивлением, что приведёт к краху мандата."
 RULE_OPTION_MPL_PREPARATIONS_COLLAPSE:0 "£GFX_gamerules_ISR_state £GFX_gamerules_PAL_neutrality Хватаясь за соломинку"
 RULE_OPTION_MPL_PREPARATIONS_COLLAPSE_AI_DESC:0 "В ответ на Арабское восстание 1936 года Артур Гренфелл Уокоп объявит о завершении мандата, но не сумеет удержать баланс сил между Ишувом и Высшим арабским комитетом, что приведёт к краху мандата."
 RULE_OPTION_MPL_DISSOLVED:0 "£GFX_gamerules_ISR_state £GFX_gamerules_MPL_Jerusalem £GFX_gamerules_PAL_neutrality Мирный роспуск"
 RULE_OPTION_MPL_DISSOLVED_AI_DESC:0 "В ответ на Арабское восстание 1936 года Артур Гренфелл Уокоп объявит о завершении мандата. Комиссия Пиля решит, что лучшим выходом станет роспуск мандата и создание отдельных еврейского и арабского государств, при этом баланс сил будет сохранён."
 RULE_OPTION_MPL_UNION_COM:0 "£GFX_gamerules_MPL_free_communism Левантийская коммуна"
 RULE_OPTION_MPL_UNION_COM_AI_DESC:0 "В ответ на Арабское восстание 1936 года Артур Гренфелл Уокоп объявит о завершении мандата. Комиссия Пиля решит, что лучшим выходом станет создание независимого союзного государства арабов и евреев. Баланс сил будет сохранён, а на выборах победит Палестинская коммунистическая партия."
 RULE_OPTION_MPL_UNION_DEM:0 "£GFX_gamerules_MPL_free_democratic Левантийская конфедерация"
 RULE_OPTION_MPL_UNION_DEM_AI_DESC:0 "В ответ на Арабское восстание 1936 года Артур Гренфелл Уокоп объявит о завершении мандата. Комиссия Пиля решит, что лучшим выходом станет создание независимого союзного государства арабов и евреев. Баланс сил будет сохранён, а на выборах победит Юнионистская партия Леванта."
 RULE_OPTION_MPL_UNION_COLLAPSE:0 "£GFX_gamerules_ISR_state £GFX_gamerules_PAL_neutrality Отложенная мечта"
 RULE_OPTION_MPL_UNION_COLLAPSE_AI_DESC:0 "В ответ на Арабское восстание 1936 года Артур Гренфелл Уокоп объявит о завершении мандата. Комиссия Пиля решит, что лучшим выходом станет создание независимого союзного государства арабов и евреев. Баланс сил будет сохранён, однако новый союз не сумеет стабилизироваться и рухнет."
 ISR_AI_BEHAVIOR:0 "£GFX_gamerules_ISR_state Израиль"
 RULE_OPTION_ISR_MAPAI:0 "£GFX_gamerules_ISR_state Укрепление МАПАЙ"
 RULE_OPTION_ISR_MAPAI_AI_DESC:0 "Во время войны за независимость ополченцам Хаганы удастся очистить Иргун, и лейбористский сионист Мапаи победит на выборах."
 RULE_OPTION_ISR_HASHOMER:0 "£GFX_gamerules_ISR_state «Ха-шомер ха-цаир»"
 RULE_OPTION_ISR_HASHOMER_AI_DESC:0 "Во время войны за независимость ополченцам Хаганы удастся очистить Иргун, а советский лейбористский сионист Хашомер Хатсейр победит на выборах, уступив грань между радикалами и умеренными."
 RULE_OPTION_ISR_MAKI:0 "£GFX_gamerules_MPL_free_communism МАКИ"
 RULE_OPTION_ISR_MAKI_AI_DESC:0 "Во время войны за независимость ополченцам Хаганы удастся очистить Иргун, а советский лейбористский сионист Хашомер Хатсейр победит на выборах, но попадет в более радикальную фракцию Маки."
 RULE_OPTION_ISR_PROGRESSIVE:0 "£GFX_gamerules_ISR_state Новая алия"
 RULE_OPTION_ISR_PROGRESSIVE_AI_DESC:0 "Во время Войны за независимость ополчения «Хаганы» успешно проведут чистку «Иргуна», а центристский блок победит на выборах. Со временем прогрессивная партия «Новая алия» станет самой влиятельной силой блока."
 RULE_OPTION_ISR_GENERAL_ZIONISTS:0 "£GFX_gamerules_ISR_state Общие сионисты"
 RULE_OPTION_ISR_GENERAL_ZIONISTS_AI_DESC:0 "Во время Войны за независимость ополчения «Хаганы» успешно проведут чистку «Иргуна», а центристский блок победит на выборах. Либеральная партия Общих сионистов сохранит ведущую роль в блоке."
 RULE_OPTION_ISR_HATZOHAR:0 "£GFX_gamerules_ISR_state Ревизионистская революция"
 RULE_OPTION_ISR_HATZOHAR_AI_DESC:0 "Во время Войны за независимость ополчения «Хаганы» не сумеют провести чистку «Иргуна», однако «Иргун» согласится на демократические выборы, на которых победит Жаботинский."
 RULE_OPTION_ISR_IRGUN:0 "£GFX_gamerules_ISR_couped Огнём и кровью"
 RULE_OPTION_ISR_IRGUN_AI_DESC:0 "Во время Войны за независимость ополчения «Хаганы» не сумеют провести чистку «Иргуна», который затем совершит государственный переворот. После смерти Жаботинского руководство «Иргуна» подавит восстание сторонников Штерна."
 RULE_OPTION_ISR_FASCIST:0 "£GFX_gamerules_ISR_fascism Отмщение за величайшие трагедии"
 RULE_OPTION_ISR_FASCIST_AI_DESC:0 "Во время Войны за независимость ополчения «Хаганы» не сумеют провести чистку «Иргуна», который затем совершит государственный переворот. Руководство «Иргуна» не справится с восстанием Штерна, и в Израиле установится ультранационалистический режим."
 PAL_AI_BEHAVIOR:0 "£GFX_gamerules_PAL_neutrality Палестина"
 RULE_OPTION_PAL_QADIR:0 "£GFX_gamerules_PAL_neutrality Наследие Абд аль-Кадира"
 RULE_OPTION_PAL_QADIR_AI_DESC:0 "Во время Войны за независимость будет выбран план Абд аль-Кадира, после чего он подавит инакомыслие и создаст Великую Палестину."
 RULE_OPTION_PAL_HASHEMITE:0 "£GFX_gamerules_PAL_hashemite Хашимитский монарх"
 RULE_OPTION_PAL_HASHEMITE_AI_DESC:0 "Во время Войны за независимость будет выбран план Абд аль-Кадира, но затем он передаст власть королю Зейду из Хашимитской династии."
 RULE_OPTION_PAL_NLL:0 "£GFX_gamerules_PAL_communism Великая родина"
 RULE_OPTION_PAL_NLL_AI_DESC:0 "Во время Войны за независимость будет выбран план Фавзи аль-Кавукджи, однако после войны его свергнет коммунистическая Лига национального освобождения Радвана аль-Хилу, стремящаяся создать панарабское государство."
 RULE_OPTION_PAL_NASHASHIBI:0 "£GFX_gamerules_PAL_democratic Нашашиби берут ответственность на себя"
 RULE_OPTION_PAL_NASHASHIBI_AI_DESC:0 "Во время Войны за независимость будет выбран план Фавзи аль-Кавукджи, однако после войны его свергнет либеральная семья Нашашиби, которая создаст демократическое государство во главе с Рагибом Нашашиби."
 RULE_OPTION_PAL_SMC:0 "£GFX_gamerules_PAL_democratic ВМК берёт ответственность на себя"
 RULE_OPTION_PAL_SMC_AI_DESC:0 "Во время Войны за независимость будет выбран план Фавзи аль-Кавукджи, однако после войны его свергнут демократические консерваторы Высшего мусульманского совета, которые создадут в Палестине исламскую республику."
 RULE_OPTION_PAL_ISLAM:0 "£GFX_gamerules_PAL_islam Захват власти аль-Мукаддасом"
 RULE_OPTION_PAL_ISLAM_AI_DESC:0 "Во время Войны за независимость будет выбран план Абд аль-Кадира, однако затем его свергнут исламистские силы. На выборах председателя победит радикал Амин аль-Хусейни."
 RULE_OPTION_PAL_HUSSAM:0 "£GFX_gamerules_PAL_hussam Умеренное исламское государство"
 RULE_OPTION_PAL_HUSSAM_AI_DESC:0 "Во время Войны за независимость будет выбран план Абд аль-Кадира, однако затем его свергнут исламистские силы. На выборах председателя победит умеренный Хусам ад-Дин."
 RULE_OPTION_PAL_HASAN:0 "£GFX_gamerules_PAL_islam Переворот Саламы"
 RULE_OPTION_PAL_HASAN_AI_DESC:0 "Во время Войны за независимость будет выбран план Абд аль-Кадира, однако затем его свергнут исламистские силы. На выборах председателя победит умеренный Хусам ад-Дин, но из-за его умеренного курса власть захватит фашистский генерал Хасан Салама."
 RULE_OPTION_PAL_FAWZI:0 "£GFX_gamerules_PAL_golani Переворот Фавзи"
 RULE_OPTION_PAL_FAWZI_AI_DESC:0 "Во время Войны за независимость будет выбран план Фавзи аль-Кавукджи, после чего он ограничит влияние гражданских сил в правительстве и предотвратит переворот оппозиции."
 RULE_OPTION_PAL_GOLANI:0 "£GFX_gamerules_PAL_golani Голани рвётся к власти"
 RULE_OPTION_PAL_GOLANI_AI_DESC:0 "Во время Войны за независимость будет выбран план Фавзи аль-Кавукджи, но затем он потеряет власть в результате переворота Абд аль-Халима аль-Голани."
 r56_MPL_mandate_area:0 "Мандат Лиги Наций"
 r56_MPL_mandate_area_desc:0 "Поскольку регион обладает статусом подмандатной территории Лиги Наций, британская администрация имеет повышенный контроль над местной промышленностью."
