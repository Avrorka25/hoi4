 MPL_mandate_collapse_ISR_category:0 "Крах мандата"
 MPL_mandate_collapse_PAL_category:0 "Крах мандата"
 MPL_mandate_collapse_ISR_war_category:0 "Арабо-израильская война"
 MPL_mandate_collapse_ARAB_category:0 "Арабо-израильская война"
 MPL_mandate_collapse_ISR_category_desc:0 "Мандат рухнул.\n\nНаши силы заняли Прибрежную равнину и Западный Иерусалим, тогда как арабы захватили Иудею, Самарию и пустыню Негев. Удержание ключевых районов поможет укрепить наши позиции и приблизить досрочное провозглашение независимости.\n\nЕсли захотите — это не будет сказкой!"
 MPL_mandate_collapse_PAL_category_desc:0 "Мандат рухнул.\n\nНаши силы заняли Западный берег, Газу и ан-Накаб, тогда как сионисты захватили Западный Иерусалим и Прибрежную равнину. Захват ключевых районов поможет укрепить наши позиции и ослабить готовность сионистов к провозглашению независимости.\n\nОт реки до моря!"
 MPL_mandate_collapse_ISR_war_category_desc:0 "После провозглашения нашей независимости арабские силы вторглись на территории мандата и приняли борьбу у палестинцев. Они значительно превосходят нас численностью, поэтому необходимо закрепиться на позициях и надеяться на лучшее."
 MPL_mandate_collapse_ARAB_category_desc:0 "После того как палестинцы не смогли справиться с израильскими силами, мы были вынуждены вмешаться. Израиль пользуется значительной иностранной поддержкой и с каждым днём становится сильнее, поэтому необходимо нанести удар быстро, пока нас не подавили."
 ISR_mandate_collapse_mission:0 "Провозглашение независимости"
 ISR_mandate_collapse_mission_desc:0 "Битва за свободу началась, но нельзя поддаваться самоуверенности. Мы должны продержаться некоторое время, чтобы подготовить официальное провозглашение независимости."
 PAL_mandate_collapse_mission:0 "Разгромить сионистские силы"
 PAL_mandate_collapse_mission_desc:0 "Битва за родину началась. У нас численное превосходство, однако еврейские районы лучше индустриализированы, поэтому необходимо попытаться победить их как можно быстрее."
 ISR_survival_mission:0 "Пережить натиск"
 ISR_survival_mission_desc:0 "Арабские силы вторглись. Они значительно превосходят нас численностью, поэтому необходимо занять оборонительные позиции и удерживать фронт. Когда мы будем готовы, сможем перейти в наступление на их основные территории и, вероятно, вынудить их подписать перемирие."
 ARAB_destory_israel_mission:0 "Разгромить израильские силы"
 ARAB_destroy_israel_mission_desc:0 "Арабские силы в Палестине показали свою слабость, и мы должны вмешаться, чтобы уничтожить израильское государство. Однако оно становится сильнее с каждым днём, поэтому нельзя затягивать войну. Мы должны постоянно наступать: отступление на собственную территорию вынудит нас подписать перемирие."
 ISR_hold_haifa_mission:0 "Удержать Хайфу"
 ISR_hold_haifa_mission_desc:0 "Хайфа — крупнейший порт бывшего мандата, и её удержание может оказаться решающим для снабжения наших войск. Мы обязаны защищать город любой ценой."
 PAL_take_haifa_mission:0 "Захватить Хайфу"
 PAL_take_haifa_mission_desc:0 "Хайфа — крупнейший порт бывшего мандата, и её захват может оказаться решающим для снабжения наших войск. Необходимо подготовить операцию по овладению городом."
 ISR_hold_jerusalem_mission:0 "Удержать Иерусалим"
 ISR_hold_jerusalem_mission_desc:0 "Иерусалим, духовная столица нашего народа, должен быть удержан любой ценой. Его потеря нанесёт тяжёлый удар по боевому духу."
 PAL_take_jerusalem_mission:0 "Захватить Иерусалим"
 PAL_take_jerusalem_mission_desc:0 "Иерусалим, духовная столица нашего народа, должен быть захвачен любой ценой. Его потеря нанесёт тяжёлый удар по боевому духу израильтян."
 ISR_take_rashrash_mission:0 "Захватить Умм-эр-Рашраш"
 ISR_take_rashrash_mission_desc:0 "Разделение арабских сил надвое значительно повысит наши шансы на победу. Необходимо наступать на юг к побережью и рассечь их войска, подобно тому как Моисей разделил Красное море."
 PAL_hold_rashrash_mission:0 "Удержать Умм-эр-Рашраш"
 PAL_hold_rashrash_mission_desc:0 "Захват Умм-эр-Рашраша израильтянами откроет им путь к разделению наших сил надвое. Мы должны удержать позиции и не допустить этого."
 MPL_aliyah_category:0 "Кризис алии"
 MPL_aliyah_category_desc:0 "После обретения независимости разразился иммиграционный кризис. Спасаясь от ужасов фашизма и антисемитизма в Европе и других частях мира, сотни тысяч еврейских беженцев прибывают в нашу страну в поисках убежища.\n\nВ наших интересах принять как можно больше людей, поскольку приток населения принесёт огромную пользу небольшой стране. Однако многие группы выступают против, утверждая, что это лишь усилит хаос в и без того нестабильном государстве.\nНеобходимо действовать осторожно, чтобы не настроить против себя ни одну часть населения."
 MPL_scale_back_immigration:0 "Сократить иммиграцию"
 MPL_setup_immigrant_camps_1:0 "Создать небольшие лагеря для иммигрантов"
 MPL_setup_immigrant_camps_2:0 "Создать крупные лагеря для иммигрантов"
 MPL_form_kibbutsim:0 "Поддержать создание кибуцев"
 MPL_support_existing_communities:0 "Поддержать существующие общины"
 MPL_immigrant_workers:0 "Трудоустроить иммигрантов"
 MPL_mandate_resistance_category:0 "Стабилизировать мандат"
 MPL_mandate_resistance_category_desc:0 "Нельзя допустить, чтобы нынешний мятеж продолжался. Мы должны сокрушить всех мятежников и восстановить порядок в мандате.\n\n\nТекущий уровень порядка - это [MPLOrderLevelColour].\n§RЕсли уровень порядка достигнет 0, мы пострадаем от революции!"
 MPL_lower_strikes_1:0 "Умиротворить бастующих"
 MPL_lower_strikes_2:0 "Умиротворить бастующих"
 MPL_lower_strikes_3:0 "Умиротворить бастующих"
 MPL_growing_resistance:0 "Рост сопротивления"
 MPL_arrest_militia_leaders:0 "Арестовать лидеров ополчений"
 MPL_increase_police_patrols:0 "Усилить полицейские патрули"
 MPL_raid_local_militias:0 "Провести рейды против местных ополчений"
 MPL_disrupt_militia_supplies:0 "Нарушить снабжение ополчений"
 MPL_stabilize_jordan_category:0 "Нестабильность в Иордании"
 MPL_stabilize_jordan_category_desc:0 "С недавней потерей мандата Палестинского региона, Эмират Трансиордании сталкивается с нестабильностью своего собственного. Отстранившись от нашего контроля, народ требует независимости. Мы можем либо удовлетворить эту просьбу, либо направить войска для восстановления порядка."
 MPL_stabilize_jordan_mission:0 "Стабилизировать Иорданию"
 MPL_stabilize_syria_category:0 "Волнения в Сирии"
 MPL_stabilize_syria_category_desc:0 "После недавней волны независимости на Ближнем Востоке подтвердились наши опасения, что следующей станет Сирия. По всей подмандатной территории сирийцы выходят на протесты, а также поступают сведения о формировании многочисленных ополчений. Чтобы остановить этот процесс, необходимо действовать немедленно."
 MPL_stabilize_syria_mission:0 "Стабилизировать Сирию"
 MPL_syria_war_category:0 "Освободительная война"
 MPL_syria_war_category_desc:0 "Хотя Сааде удалось объединить все [SYR.GetAdjective] партии в коалицию против угнетателей из [MPL_syria_war_owner.GetAdjective] стороны, этот единый фронт крайне нестабилен. Если мы не добьёмся скорой победы, коалиция, вероятно, распадётся."
 MPL_syria_peace:0 "Закрепить победу"
 MPL_independence_preparations:0 "Подготовка независимости"
 MPL_independence_preparations_desc:0 "После решения о выходе из региона после недавней подавляющей волны забастовок и восстаний мы должны убедиться, что завершим все необходимые приготовления перед выходом, чтобы вновь независимая администрация не рухнула.\n\nНынешняя политическая независимость: §Y[?MPL_political_independence]%§!\n\nЭкономическая независимость в настоящее время: §Y[?MPL_economic_independence]%§!\n\nНынешняя военная независимость: §Y[?MPL_military_independence]%§!\n\n§RПредупреждение: Объявление независимости без достаточной подготовки приведет к серьезному административному напряжению.§!"
