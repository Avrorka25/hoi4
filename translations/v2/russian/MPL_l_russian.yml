 MPL_arab_revolt_category:0 "Приближение арабской забастовки"
 MPL_arab_revolt_category_desc:0 "Мандат Лиги Наций на Палестину был основан 19 сентября 1923 года под юрисдикцией Соединенного Королевства. Несмотря на то, что местное население региона осталось глубоко обедневшим после разрушения Великой войны, оно довольствовалось тем, что ожидало увидеть, как новообразованный мандат будет отличаться от османского правления до Великой войны.\n\nОт третьего до пятого алиота и массовая еврейская иммиграция, происходящая с 1919 года, испортили отношения между арабскими и еврейскими общинами еще больше, чем они уже были, а бывшие небольшие еврейские общины, такие как Тель-Авив, выросли в последнее десятилетие на ошеломляющие суммы, превзойдя своих арабских коллег, таких как Яффа.\n\nУчитывая, что напряженность достигла рекордного уровня после инцидента, когда оружие было поймано в контрабанде ополченцам Хаганы в цементных бочках, мы можем только предполагать, что худшее еще впереди. Распространены слухи о масштабном ударе по всему региону. Мы не должны тратить время на подготовку."
 MPL_arab_revolt_mission:0 "Приближающаяся арабская забастовка"
 MPL_union_stabilization_category:0 "Нестабильный Союз"
 MPL_union_stabilization_category_desc:0 "Назвать наш недавно созданный союз нестабильным — значит сильно преуменьшить проблему. Новое правительство контролирует территории, населённые евреями, арабами и другими меньшинствами, включая друзов, и каждая группа стремится увеличить своё влияние.\n\nЧтобы сохранить мир, нельзя оставлять кого-либо в стороне. Необходимо поддерживать равновесие между всеми сторонами, иначе регион может погрузиться в необратимый конфликт.\n\nТекущая поддержка правительства со стороны £GFX_gamerules_ISR_state §3евреев§!: [MPLGetJewSupport]\n\nТекущая поддержка правительства со стороны §G£GFX_gamerules_PAL_democratic арабов§!: [MPLGetArabSupport]\n\nТекущая поддержка правительства со стороны £GFX_gamerules_MPL_Jerusalem §Yменьшинств§!: [MPLGetMinoritySupport]"
