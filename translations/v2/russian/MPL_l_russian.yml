l_russian:
 RULE_VOLUNTEERS_NOT_MPL_COLLAPSE:0 "§RНельзя отправлять добровольцев во время распада мандата§!"
 MPL_mandate:0 "Мандат Лиги Наций"
 MPL_mandate_desc:0 "Статус подмандатной территории Лиги Наций обеспечивает нам международную поддержку в развитии региона. Однако из-за этого статуса мы не можем создать полноценные вооружённые силы."
 MPL_aliyah_start:0 "Пятая алия"
 MPL_aliyah_start_desc:0 "После назначения Артура Гренфелла Уокопа верховным комиссаром и прихода фашизма к власти в Европе сотни тысяч евреев ищут убежище в Палестине. Это серьёзно дестабилизирует нашу страну."
 MPL_arab_revolt_1:0 "Арабские забастовки"
 MPL_arab_revolt_1_desc:0 "Арабское население начало забастовку. Мы должны действовать эффективно."
 MPL_arab_revolt_2:0 "Ослабленные арабские забастовки"
 MPL_arab_revolt_2_desc:0 "Нам удалось немного успокоить забастовщиков, хотя впереди ещё много работы."
 MPL_arab_revolt_3:0 "Арабское восстание"
 MPL_arab_revolt_3_desc:0 "Попытка переговоров провалилась, и в некоторых районах забастовка переросла в полномасштабное восстание. Необходимо рассмотреть решительные меры."
 MPL_arab_revolt_4:0 "Ослабленные забастовки"
 MPL_arab_revolt_4_desc:0 "Наши первоначальные уступки успешно уменьшили последствия забастовок. Следует продолжать этот курс."
 MPL_civil_war_pal:0 "Инициатива!"
 MPL_civil_war_isr:0 "Инициатива!"
 MPL_collapse_idea:0 "Распад мандата"
 MPL_collapse_idea_desc:0 "С распадом мандата мы наконец получили возможность сражаться за независимость. Мы не откажемся от этой борьбы так просто!"
 MPL_collapse_idea_2:0 "Дезорганизованные боевые действия"
 MPL_collapse_idea_2_desc:0 "После недавнего распада администрации мандата мы провозгласили независимость. Однако линии фронта ещё не закрепились, поэтому наши атаки остаются дезорганизованными и неэффективными."
 MPL_strained_administration:0 "Перегруженная администрация"
 MPL_strained_economy:0 "Перегруженная экономика"
 MPL_strained_military:0 "Дезорганизованная армия"
 MPL_floodgates:0 "Открыть шлюзы"
 MPL_small_aliyah:0 "Ограниченная алия"
 MPL_two_people_union_1:0 "Обречённый эксперимент?"
 MPL_two_people_union_1_desc:0 "Независимость достигнута, но трудности лишь начинаются. Наш новый союз невероятно нестабилен, и малейшая ошибка может привести к его распаду. Мы должны действовать осторожно."
 MPL_two_people_union_2:0 "Оптимистичное начало"
 MPL_two_people_union_2_desc:0 "Постепенно нам удаётся убедить население, что оно может нам доверять. Путь к примирению начался."
 MPL_two_people_union_3:0 "Осмелиться мечтать"
 MPL_two_people_union_3_desc:0 "Невозможное становится реальностью. Население постепенно объединяется вокруг нашего дела, оставляя прежние конфликты позади. Цель уже близка."
 MPL_two_people_union_4:0 "Союз двух народов"
 MPL_two_people_union_4_desc:0 "Путь был долгим, но настало время исцеления. Наши народы объединила общая цель — создать лучшее будущее для своих детей. Однако враги всё ещё окружают нас. Мы должны убедиться, что никто не сможет угрожать нашему процветанию.\n\nДля всех, кто мечтает, и всех, кто мечтал."
 MPL_mandate1:0 "Милитаризованная колония"
 MPL_mandate1_desc:0 "Восстания дали нам возможность ещё прочнее утвердить контроль над регионом. Нас поддерживает [MPL.overlord.GetNameDef] — кто осмелится выступить против нас?"
 MPL_white_paper_idea:0 "Белая книга"
 MPL_white_paper_idea_desc:0 "Белая книга жёстко ограничивает еврейскую иммиграцию в подмандатную территорию. Это помогает лучше контролировать сопротивление, однако уже живущие здесь евреи нас не поддержат."
 MPL_navy_payments:0 "Выплаты флоту"
 MPL_professional_army:0 "Профессиональная подготовка армии"
 MPL_professional_army_desc:0 "Наша страна мала и не способна содержать многочисленную армию. Необходимо добиться максимально эффективной подготовки, чтобы наши солдаты могли противостоять врагу."
 MPL_against_germany_idea:0 "Уничтожение нацистской угрозы"
 MPL_against_germany_idea_desc:0 "Нацисты объявили войну нашему народу ради собственной выгоды. Мы покажем им, на что способны."
 MPL_united_against_colonialism:0 "Едины против колониализма"
 MPL_united_against_colonialism_desc:0 "Мы восстанем и победим своих угнетателей!"
 MPL_start:0 "Палестинский мандат"
 MPL_start_desc:0 "29 сентября 1923 года был провозглашён мандат на Палестину. Утверждалось, что это временная мера для подготовки региона к независимости. Однако прошло уже более двенадцати лет, а прогресса почти нет. Мы должны двигаться вперёд и найти решение для региона."
 MPL_unions:0 "Расширение полномочий общинных союзов"
 MPL_liberalized:0 "Либерализованная экономика"
 MPL_religious_freedom:0 "Свобода вероисповедания"
 MPL_universities:0 "Финансирование государственных школ"
 MPL_public_school_funding:0 "Финансирование университетов"
 MPL_beacon_idea:0 "Маяк во тьме"
 MPL_british_officers_idea:0 "Британские офицеры"
 MPL_jewish_recruits:0 "Еврейские новобранцы"
 MPL_centralization:0 "Централизация"
 MPL_unite_levant:0 "Объедините Леванта!"
 MPL_secret_police:0 "Финансирование тайной полиции"
 MPL_development_haifa:0 "Развивать регион Хайфы"
 MPL_development_haifa_desc:0 "Следует развивать еврейский регион Хайфы, чтобы заручиться поддержкой его жителей."
 MPL_development_nablus:0 "Развивать регион Наблуса"
 MPL_development_nablus_desc:0 "Следует развивать арабский регион Наблуса, чтобы заручиться поддержкой его жителей."
 MPL_arab_revolt:0 "Арабское восстание 1936 года"
 MPL_arab_revolt_desc:0 "Арабские лидеры призвали население страны ко всеобщей забастовке. Мы должны не допустить, чтобы ситуация вышла из-под контроля."
 MPL_deal_with_strike:0 "Разобраться с забастовками"
 MPL_deal_with_strike_desc:0 "Мы ожидали забастовку, но не такой силы. Вся страна парализована, и всё останавливается. Необходимо немедленно выбрать план действий."
 MPL_negotiations_failed:0 "Переговоры сорвались"
 MPL_negotiations_failed_desc:0 "Попытки договориться с бастующими провалились, и в некоторых районах забастовка переросла в полномасштабное восстание. Положение крайне тяжёлое."
 MPL_a_forgone_conclusion:0 "Предрешённый исход"
 MPL_a_forgone_conclusion_desc:0 "Это был лишь вопрос времени. Восстания идут полным ходом, и настала пора организовать наш уход из региона. Наш долг — оставить после себя стабильную страну, поэтому нельзя позволить ни одной из сторон чрезмерно усилиться, иначе последствия будут катастрофическими."
 MPL_peel_commision:0 "Комиссия Пиля"
 MPL_peel_commision_desc:0 "Чтобы найти лучшее решение нынешнего кризиса, необходимо изучить главные причины восстания. Лорд Пиль подходит для этой задачи, и мы можем доверять его выводам."
 MPL_levantine_union:0 "Левантийская конфедерация"
 MPL_levantine_union_desc:0 "Комиссия Пиля пришла к выводу, что лучшим решением конфликта станет независимый союз евреев и арабов. Добиться этого будет трудно, но в долгосрочной перспективе такой путь принесёт множество преимуществ."
 MPL_two_states:0 "Раздел Леванта"
 MPL_two_states_desc:0 "Комиссия Пиля пришла к выводу, что лучшим решением конфликта станет раздел земель между евреями и арабами с превращением Иерусалима в нейтральную территорию. Будем надеяться, что это предотвратит дальнейшие конфликты в регионе."
 MPL_jews_negotiate:0 "Переговоры с еврейскими партиями"
 MPL_jews_negotiate_desc:0 "Большинство бастующих, возможно, составляют арабы, однако при создании единого общества нельзя игнорировать и потребности еврейского населения."
 MPL_jews_ministers:0 "Назначить еврейских министров"
 MPL_jews_ministers_desc:0 "Следует назначить нескольких еврейских министров, чтобы они помогли в подготовке независимости."
 MPL_arabs_negotiate:0 "Поддержать арабские партии"
 MPL_arabs_negotiate_desc:0 "Чтобы мирно выбраться из этого кризиса, необходимо поддержать арабские партии страны."
 MPL_arabs_ministers:0 "Назначить арабских министров"
 MPL_arabs_ministers_desc:0 "Следует назначить нескольких арабских министров, чтобы они помогли в подготовке независимости."
 MPL_first_round:0 "Завершить первый раунд переговоров"
 MPL_first_round_desc:0 "Завершение первого раунда переговоров о независимости должно ослабить продолжающееся восстание."
 MPL_development_ramallah:0 "Развивать район Рамаллы"
 MPL_development_ramallah_desc:0 "Следует развивать арабский район Рамаллы, чтобы заручиться поддержкой его жителей."
 MPL_development_tel_aviv:0 "Развивать район Тель-Авива"
 MPL_development_tel_aviv_desc:0 "Следует развивать еврейский район Тель-Авива, чтобы заручиться поддержкой его жителей."
 MPL_end_the_strike:0 "Положить конец забастовкам"
 MPL_end_the_strike_desc:0 "Когда реформы и переговоры почти завершены, мы можем убедить забастовщиков прекратить протесты и поддержать нас."
 MPL_develop_arab_communities:0 "Набирать арабов в полицию"
 MPL_develop_arab_communities_desc:0 "Следует набирать арабов в полицию, чтобы приблизить обретение независимости."
 MPL_jewish_recruit:0 "Набирать еврейских солдат"
 MPL_jewish_recruit_desc:0 "Следует набирать еврейских солдат в армию, чтобы заручиться поддержкой еврейского населения."
 MPL_two_people_union:0 "[MPLGetUnion]"
 MPL_two_people_union_desc:0 "Время пришло. Подготовка завершена, и регион готов к независимости."
 MPL_aliyah_question:0 "Вопрос алии"
 MPL_aliyah_question_desc:0 "После образования нового государства множество еврейских беженцев со всего мира стремятся въехать в страну. Однако граждане не могут договориться о том, как справиться с этим кризисом. Мы должны определить свой курс."
 MPL_start_military_industry:0 "Создать военную промышленность"
 MPL_start_military_industry_desc:0 "Поскольку наша страна никогда прежде не была независимой, её военная промышленность крайне слаба. Необходимо начать строительство военных заводов, чтобы обеспечить собственную оборону."
 MPL_form_spy_agency:0 "Создать разведывательное управление"
 MPL_form_spy_agency_desc:0 "Наша страна мала, и мы не можем позволить себе вести каждую битву на полях сражений. Некоторые победы достигаются умом, а не грубой силой."
 MPL_integrate_militia_arms:0 "Интегрировать вооружение ополчений"
 MPL_integrate_militia_arms_desc:0 "До обретения независимости в стране существовало несколько ополчений. Следует включить их запасы оружия в арсеналы нашей армии."
 MPL_centralize_militia_armies:0 "Централизовать командование ополчениями"
 MPL_centralize_militia_armies_desc:0 "До обретения независимости в стране существовало несколько ополчений. Чтобы сражаться эффективно, необходимо подчинить их командные структуры правительству."
 MPL_modernize_army:0 "Модернизировать армию"
 MPL_modernize_army_desc:0 "Чтобы противостоять внешним угрозам, нашу армию необходимо модернизировать. Следует сосредоточить усилия на исследовании нового оружия и техники."
 MPL_elite_soldier_training:0 "Профессиональная подготовка армии"
 MPL_elite_soldier_training_desc:0 "Наша страна мала и не способна содержать многочисленную армию. Необходимо добиться максимально эффективной подготовки, чтобы наши солдаты могли противостоять врагу."
 MPL_research_doctrines:0 "Изучать иностранные доктрины"
 MPL_research_doctrines_desc:0 "Для защиты страны необходимо изучать иностранные военные доктрины, чтобы наши генералы действовали максимально эффективно."
 MPL_form_air_service:0 "Создать военно-воздушную службу"
 MPL_form_air_service_desc:0 "После обретения независимости мы должны создать собственные военно-воздушные силы. Началом могут послужить бывшие британские истребители, оставленные на аэродроме Лода."
 MPL_light_air_focus:0 "Сосредоточиться на лёгких самолётах"
 MPL_light_air_focus_desc:0 "Наша страна мала и компактна. Следует сосредоточиться на небольших и манёвренных истребителях, способных превзойти противника в воздушном бою."
 MPL_heavy_air_focus:0 "Сосредоточиться на тяжёлых самолётах"
 MPL_heavy_air_focus_desc:0 "Ключ к победе — мощные самолёты, уничтожающие врага. Необходимо глубже исследовать эту технологию."
 MPL_develop_ports:0 "Развивать порты"
 MPL_develop_ports_desc:0 "Необходимо развивать порты, чтобы расширить торговлю."
 MPL_purchase_foreign_ships:0 "Закупить иностранные корабли"
 MPL_purchase_foreign_ships_desc:0 "Наша промышленность мала и не способна самостоятельно построить флот, однако нам нужны силы для защиты на море. Следует приобрести корабли у других стран."
 MPL_open_tel_aviv_university:0 "Расширить Еврейский университет Иерусалима"
 MPL_open_tel_aviv_university_desc:0 "Расширение Еврейского университета Иерусалима привлечёт в страну множество выдающихся умов, а благодаря многолетней финансовой поддержке университета — возможно, даже самого Эйнштейна."
 MPL_invite_einstein:0 "Пригласить Эйнштейна"
 MPL_invite_einstein_desc:0 "Альберт Эйнштейн открыто поддержал наш Союз. Мы должны пригласить его в страну: его научный гений может оказать нам огромную помощь."
 MPL_build_convoys:0 "Строить конвои"
 MPL_build_convoys_desc:0 "Для подлинного процветания страны необходимо развивать торговлю с помощью транспортных конвоев."
 MPL_open_politics:0 "Открытая политика"
 MPL_open_politics_desc:0 "В нашем союзе было бы лицемерием не позволить обоим народам голосовать и выдвигать своих кандидатов. Мы станем местом, где еврей добровольно голосует за араба, а араб — за еврея!"
 MPL_elections:0 "Выборы"
 MPL_elections_desc:0 "Страна затаила дыхание..."
 MPL_communism_victory:0 "Победа Коммунистической партии"
 MPL_communism_victory_desc:0 "После недавней победы ПКП на первых выборах Союза его первое избранное правительство стало социалистическим!"
 MPL_democratic_victory:0 "Победа Юнионистской партии"
 MPL_democratic_victory_desc:0 "После недавней победы [MPL.GetDemocraticLeader] на первых выборах Союза его первое избранное правительство стало демократическим и либеральным!"
 MPL_the_jerusalem_trials:0 "Иерусалимские процессы"
 MPL_the_jerusalem_trials_desc:0 "После обретения независимости наш новый союз должен обратиться к собственному прошлому. В стране остаётся множество бывших бойцов и руководителей экстремистских ополчений, и нам предстоит решить их судьбу. Необходимо провести Иерусалимские процессы."
 MPL_form_unions:0 "Создать общинные союзы"
 MPL_form_unions_desc:0 "Чтобы укрепить единство этого нестабильного союза, необходимо создать совместные арабо-еврейские общинные объединения, которые помогут сблизить обе общины."
 MPL_increase_industrial_subsidies:0 "Увеличить промышленные субсидии"
 MPL_increase_industrial_subsidies_desc:0 "Наша страна должна провести индустриализацию, поскольку слабость экономики является одной из причин нестабильности Союза."
 MPL_liberalize_economy:0 "Либерализовать экономику"
 MPL_liberalize_economy_desc:0 "Необходимо либерализовать промышленность, чтобы укрепить экономику и ещё лучше служить народу."
 MPL_open_trade:0 "Открыть торговлю"
 MPL_open_trade_desc:0 "Частью кампании по либерализации экономики должно стать введение свободной торговли для увеличения импорта и экспорта."
 MPL_united:0 "Мы принесли себе мир"
 MPL_united_desc:0 "После проведённых реформ [MPL.GetNameDef] впервые за многие столетия наконец объединилось и обрело стабильность под руководством собственных народов.\n\nДля всех, кто мечтает, и всех, кто мечтал."
 MPL_depoliticize_army:0 "Отделить армию от государства"
 MPL_depoliticize_army_desc:0 "В нашем демократическом и либеральном государстве важно не допустить приобретения армией политического влияния."
 MPL_middle_east_accords:0 "Ближневосточные мирные соглашения"
 MPL_middle_east_accords_desc:0 "Чтобы еще больше распространить демократию на Ближний Восток и предотвратить ее неизбежность в войне, мы должны установить ближневосточные мирные соглашения, союз ближневосточных стран, независимо от идеологии, с целью урегулирования любых споров или конфликтов, которые могут возникнуть."
 MPL_constitution:0 "Учредить конституцию"
 MPL_constitution_desc:0 "Эффективная конституция необходима для выживания демократического государства. Мы должны принять её, чтобы защитить нашу молодую демократию."
 MPL_secularization:0 "Секуляризация"
 MPL_secularization_desc:0 "Чтобы предотвратить будущие конфликты и нестабильность внутри Конфедерации, необходимо провести секуляризацию страны. Полностью осуществить её невозможно, поскольку подавляющее большинство граждан глубоко религиозны, однако мы сделаем всё возможное."
 MPL_religious_freedom_desc:0 "Свобода вероисповедания бесспорно необходима нашему государству."
 MPL_university_funding_campaign:0 "Кампания по финансированию университетов"
 MPL_university_funding_campaign_desc:0 "В нашей стране живут одни из самых ярких, но ещё не раскрывшихся умов столетия. Мы должны сделать всё возможное, чтобы поддержать их."
 MPL_public_schools:0 "Финансировать государственные школы"
 MPL_public_schools_desc:0 "Из-за многолетнего преобладания частных общинных школ значительная часть населения не получила образования. Чтобы исправить это, необходимо открыть финансируемые государством общеобразовательные школы."
 MPL_beacon:0 "Маяк во тьме"
 MPL_beacon_desc:0 "Наша страна поистине сияет маяком свободы и демократии. Мы должны продолжать двигаться вперёд."
 MPL_looking_outwards:0 "Обратиться к внешнему миру"
 MPL_looking_outwards_desc:0 "Теперь, когда стабилизация страны завершена, настало время обратиться к внешнему миру и занять своё место на международной арене."
 MPL_middle_eastern_focus:0 "Ближневосточная дипломатия"
 MPL_middle_eastern_focus_desc:0 "Необходимо установить связи со странами нашего региона, чтобы создать новые партнёрства и расширить своё влияние."
 MPL_jordanian_referendum:0 "Потребовать референдума в Иордании"
 MPL_jordanian_referendum_desc:0 "Мы должны потребовать проведения среди иорданского народа референдума об объединении. Это лучший путь для нашего развивающегося союза."
 MPL_european_focus:0 "Европейская дипломатия"
 MPL_european_focus_desc:0 "Наша страна уникальна тем, что находится на стыке трёх континентов. Следует воспользоваться этим и установить связи с европейскими державами, желающими расширить сферу своего влияния."
 MPL_secure_syria:0 "Обезопасить Сирию"
 MPL_secure_syria_desc:0 "После краха французского правительства власть в Сирии перешла к новому режиму Виши. Однако он крайне слаб, и у нас есть краткая возможность захватить Сирию, завершив создание Левантийского союза."
 MPL_british_officers:0 "Изучать британскую доктрину"
 MPL_british_officers_desc:0 "Во времена британского управления нашей страной в районах Иерусалима и Лода размещались военнослужащие, включая нескольких офицеров. Обучение у них позволит улучшить наши оборонительные возможности."
 MPL_denounce_balfour:0 "Отменить декларацию Бальфура"
 MPL_denounce_balfour_desc:0 "Декларация Бальфура представляла собой обещание британцев создать еврейское государство на землях Палестины, однако она остаётся крайне спорной темой в левантийском обществе. Ради сохранения стабильности Союза следует отменить эту декларацию, поскольку она больше не имеет значения."
 MPL_UK_reconcile:0 "Примириться с Соединённым Королевством"
 MPL_UK_reconcile_desc:0 "Хотя в прошлом [ENG.GetNameDef] угнетало нас, сейчас в наших интересах отложить разногласия и сосредоточиться на более серьёзных угрозах."
 MPL_ally_no_UK:0 "Найти других союзников"
 MPL_ally_no_UK_desc:0 "Мы не можем доверять [ENG.GetNameDef] после всего, что оно с нами сделало. Чтобы пережить надвигающуюся бурю, необходимо найти новые союзы."
 MPL_against_germany:0 "Уничтожить нацистскую угрозу"
 MPL_against_germany_desc:0 "Нацисты объявили войну нашему народу ради собственной выгоды. Мы покажем им, на что способны."
 MPL_western_military_doctrine:0 "Принять западную военную доктрину"
 MPL_western_military_doctrine_desc:0 "Западная военная доктрина выдержала множество испытаний. Мы примем её, поскольку это наш лучший шанс защитить страну."
 MPL_the_final_crusade:0 "Последний крестовый поход"
 MPL_the_final_crusade_desc:0 "Много веков назад крестовые походы разорили нашу некогда славную землю. Теперь всё изменилось, и впервые за столетия мы сами распоряжаемся своей судьбой. Настало время исполнить предназначение. Ближний Восток будет освобождён!"
 MPL_stalinist_industrialization:0 "Сталинская индустриализация"
 MPL_stalinist_industrialization_desc:0 "Чтобы превратить аграрную экономику в современную индустриальную, необходимо перенять успешный опыт Советского Союза при Сталине."
 MPL_demonize_the_monarchy:0 "Очертить монархию врагом"
 MPL_demonize_the_monarchy_desc:0 "Британская монархия десятилетиями угнетала наш народ. Мы должны сделать её общим врагом, который объединит население."
 MPL_heavy_political_crackdowns:0 "Политические репрессии"
 MPL_heavy_political_crackdowns_desc:0 "Чтобы наша страна выжила, нельзя допустить распространения среди населения настроений, направленных против Союза."
 MPL_land_reforms:0 "Земельные реформы"
 MPL_land_reforms_desc:0 "Необходимо реформировать существующую систему землевладения, чтобы земля была справедливо распределена среди населения."
 MPL_complete_centralization:0 "Завершить централизацию"
 MPL_complete_centralization_desc:0 "Власть государства должна быть централизована ради объединения народа и рабочих."
 MPL_create_commie_brigades:0 "Создать социалистические бригады"
 MPL_create_commie_brigades_desc:0 "Для защиты страны необходимо сформировать отряды преданных социалистов."
 MPL_realize_levant:0 "Воплотить единство Леванта"
 MPL_realize_levant_desc:0 "Левант должен быть объединён под властью социалистической республики. Чтобы наше государство действительно соответствовало своему названию, необходимо достичь этой цели."
 MPL_join_soviet:0 "Вступить в Коминтерн"
 MPL_join_soviet_desc:0 "Снова и снова подтверждается, что [SOV.GetNameDef] является величайшим союзником коммунизма. Мы должны присоединиться к его великой борьбе."
 MPL_go_alone:0 "Идти своим путём"
 MPL_go_alone_desc:0 "Нельзя доверять чужакам понимание потребностей нашего народа. На этом этапе истории мы должны идти своим путём."
 MPL_jordan_revolution:0 "Финансировать революцию в Иордании"
 MPL_jordan_revolution_desc:0 "Иордания является важнейшей частью левантийского единства, однако наши дипломатические и военные возможности не позволяют объявить ей войну. Вместо этого следует поддержать переворот против правительства, организованный сторонниками объединения Леванта."
 MPL_seize_lebanon:0 "Захватить Ливан"
 MPL_seize_lebanon_desc:0 "Ливан — многонациональный и многоконфессиональный регион, во многом похожий на наш, а также стратегически важная часть Леванта. Чтобы ещё на шаг приблизиться к объединению, необходимо взять его под контроль."
 MPL_syria_war:0 "Война в Сирии"
 MPL_syria_war_desc:0 "Сирия — крупнейшая часть проекта левантийского объединения. Ради союза наших народов она должна быть захвачена."
 MPL_annex_jordan:0 "Аннексировать Иорданию"
 MPL_annex_jordan_desc:0 "После нашего переворота в Иордании настало время полной аннексии. Иорданский суверенитет больше не нужен; вместо него мы сделаем ещё один шаг к объединению Леванта."
 MPL_fund_secret_police:0 "Финансировать тайную полицию"
 MPL_fund_secret_police_desc:0 "Нестабильность, вызванная объединением, требует от нас обеспечить максимально строгое соблюдение законов."
 MPL_unify_the_levant:0 "Объединить Левант"
 MPL_unify_the_levant_desc:0 "После всех усилий и конфликтов нам наконец удалось вновь объединить Левант. Слава Левантийской коммуне!"
 MPL_british_occupation:0 "Ввести чрезвычайные постановления"
 MPL_british_occupation_desc:0 "Кем возомнили себя эти мятежники? У нас нет иного выбора, кроме как подавить восстание. Регион слишком важен, чтобы от него отказаться."
 MPL_arrest_arab:0 "Арестовать арабских националистов"
 MPL_arrest_arab_desc:0 "Арабские националисты обладают значительным влиянием в подмандатной Палестине. Чтобы они не получили ещё больше власти, необходимо исключить их из политических дискуссий и кругов."
 MPL_police:0 "Вооружить полицию"
 MPL_police_desc:0 "Полиции Палестинского мандата остро не хватает людей и ресурсов. Если мы хотим поддерживать порядок, необходимо исправить это положение."
 MPL_arab_police:0 "Набирать арабов в полицию"
 MPL_arab_police_desc:0 "Хотя в рамках нашего мандата евреи явно пользуются поддержкой и преимуществами, необходимо начать набирать арабов в полицию, чтобы снизить популярность национализма."
 MPL_arab_farmland:0 "Перераспределить арабские сельскохозяйственные земли"
 MPL_arab_farmland_desc:0 "Арабские сельскохозяйственные земли всё хуже отвечают потребностям нашей экономики. Необходимо передать их более способным еврейским земледельцам. Это может разгневать владельцев, но поможет восстановить порядок."
 MPL_appease_arab_democrats:0 "Умиротворить арабских демократов"
 MPL_appease_arab_democrats_desc:0 "Арабские демократы, хотя и идут против нашего мандата, будут полезным инструментом в борьбе с арабским националистическим сопротивлением."
 MPL_white_paper:0 "Издать Белую книгу"
 MPL_white_paper_desc:0 "Очевидно, что для прекращения восстания необходимо ограничить еврейскую иммиграцию в подмандатную территорию. Будем надеяться, это на время стабилизирует страну."
 MPL_british_military_support:0 "Военная поддержка от [MPL.overlord.GetAdjective]"
 MPL_british_military_support_desc:0 "Наша страна слишком мала для крупномасштабного производства собственного снаряжения. Чтобы укрепить вооружённые силы, необходимо запросить помощь у [MPL.overlord.GetNameDef]."
 MPL_british_military_industry:0 "Военная промышленность при поддержке [MPL.overlord.GetAdjective]"
 MPL_british_military_industry_desc:0 "Наша местная промышленность слишком слаба, чтобы расходовать её мощности на военное производство. [MPL.overlord.GetNameDef] поможет нам выпускать необходимое снаряжение."
 MPL_british_industrial_support:0 "Промышленная поддержка от [MPL.overlord.GetAdjective]"
 MPL_british_industrial_support_desc:0 "Местная промышленность остро нуждается в расширении, но у нас нет необходимых ресурсов. [MPL.overlord.GetNameDef] окажет нам поддержку."
 MPL_mandatory_guard:0 "Стража мандата"
 MPL_mandatory_guard_desc:0 "Чтобы защищать мандат от внешних и внутренних угроз, необходимо сформировать особую стражу, которая будет служить короне, а не только участвовать в борьбе с повстанцами."
 MPL_wauchope_resigns:0 "Вынудить Уокопа уйти в отставку"
 MPL_wauchope_resigns_desc:0 "После очевидной неспособности предотвратить катастрофу последних двух лет Уокоп должен покинуть свой пост и уступить место следующему верховному комиссару."
 MPL_collapse_focus:0 "Крах мандата"
 MPL_collapse_focus_desc:0 "Британские угнетатели показали, что у них нет никакого плана на будущее! Мы должны восстать и взять свою судьбу в собственные руки!"
 MPL_harold_government:0 "Правительство Гарольда Макмайкла"
 MPL_harold_government_desc:0 "Гарольд Макмайкл — верховный комиссар, сосредоточенный прежде всего на внутренних делах. Он стремится повысить уровень жизни в подмандатной территории и занимает жёсткую позицию в отношении еврейских сионистских ополчений."
 MPL_alan_government:0 "Правительство Алана Каннингема"
 MPL_alan_government_desc:0 "Алан Каннингем, бывший генерал Британской империи, является выдающимся стратегом, но обладает небольшим политическим опытом, особенно во внутренних делах. Он стремится превратить мандат в надёжный британский колониальный протекторат, хотя разумность этой цели вызывает серьёзные сомнения."
 mandate_palestine.1.t:0 "Арабская забастовка"
 mandate_palestine.1.d:0 "После ряда событий, кульминацией которых стал инцидент в Цементе 1935 года, когда контрабандное оружие было найдено в грузовом контейнере, предназначенном для еврейского бизнесмена, напряженность достигла своего пика.\n\nПо всей стране арабские рабочие, занятые на производстве, транспорте и в магазинах, объявили забастовку. Это нанесло серьезный ущерб экономике и услугам региона. Арабские лидеры требуют прекращения передачи арабских земель Ишуву и создания национального правительства, ответственного перед представительным советом. Со времени формирования мандата такого масштабного восстания не наблюдалось, и многие не уверены в том, как действовать дальше."
 mandate_palestine.1.a:0 "Мы должны разобраться с этим правильно."
 mandate_palestine.2.t:0 "Переговоры сорвались"
 mandate_palestine.2.d:0 "Арабские забастовщики отвергли наши попытки договориться и заявили, что не согласятся ни на что меньшее, чем полное выполнение их требований. Поступают даже сообщения, что к забастовке присоединились некоторые евреи, также требующие прекращения мандата."
 mandate_palestine.2.a:0 "Мы должны определить дальнейший курс."
 mandate_palestine.3.t:0 "Выводы комиссии Пиля"
 mandate_palestine.3.d:0 "Получены выводы комиссии Пиля. Лорд Пиль заявил, что главной причиной восстания стали опасения арабов, что евреи приобретут чрезмерное влияние в подмандатной территории и захватят власть, а также общая неопределённость будущего мандата и неравенство возможностей арабов и евреев. Он считает решение покинуть регион правильным и полагает, что:"
 mandate_palestine.3.a:0 "Следует создать независимое союзное государство двух народов."
 mandate_palestine.3.b:0 "Земли следует разделить между евреями и арабами."
 mandate_palestine.4.t:0 "Роспуск мандата"
 mandate_palestine.4.d:0 "После роспуска мандата многие надеются, что наступило время мира и сотрудничества. Еврейское государство на севере готовится принимать беженцев со всего мира, а арабское государство на юге — развивать инфраструктуру и промышленность. Между ними лежит Иерусалим, отныне находящийся под международным управлением. Лишь будущее покажет, сохранится ли этот долгожданный мир."
 mandate_palestine.4.a:0 "(Играть за Иерусалим)"
 mandate_palestine.4.b:0 "(Играть за Израиль)"
 mandate_palestine.4.c:0 "(Играть за Палестину)"
 mandate_palestine.11.t:0 "Независимость для [MPL.GetNameDef]?"
 mandate_palestine.11.d:0 "Наблюдая за недавними восстаниями в [MPL.GetNameDef], местная администрация пришла к выводу, что регион следует подготовить к независимости. Однако многие в нашем правительстве по-прежнему считают его слишком важным, чтобы так просто отказаться от контроля. Возможно, удастся найти компромисс?"
 mandate_palestine.11.a:0 "Это было предрешено. Подготовить регион к независимости."
 mandate_palestine.11.b:0 "Мы можем согласиться на компромисс. Они станут доминионом Содружества."
 mandate_palestine.11.c:0 "Регион слишком важен. Мы не можем этого допустить."
 mandate_palestine.12.t:0 "[MPL.overlord.GetNameDefCap] соглашается на независимость"
 mandate_palestine.12.d:0 "[MPL.overlord.GetNameDefCap] одобрило нашу подготовку к независимости и поддержит попытки установить мир в регионе."
 mandate_palestine.12.a:0 "Пусть Ближний Восток познает мир."
 mandate_palestine.13.t:0 "[MPL.overlord.GetNameDefCap] предлагает компромисс с доминионом"
 mandate_palestine.13.d:0 "В ответ на подготовку к независимости [MPL.overlord.GetNameDefCap] предложило компромисс. После завершения подготовки мы станем доминионом Содружества, а оно поддержит нас в нашей борьбе."
 mandate_palestine.13.a:0 "Мы можем принять этот компромисс."
 mandate_palestine.13.b:0 "Это лишь ещё сильнее разгневает народ. Продолжить подготовку."
 mandate_palestine.14.t:0 "[MPL.overlord.GetNameDefCap] отказывает в независимости"
 mandate_palestine.14.d:0 "[MPL.overlord.GetNameDefCap] отказалось признать нашу подготовку к независимости. Оно не окажет нам никакой поддержки, утверждая, что регион слишком важен, чтобы от него отказаться."
 mandate_palestine.14.a:0 "У нас нет выбора, кроме как продлить мандат."
 mandate_palestine.14.b:0 "Это их больше не касается. Продолжить подготовку."
 mandate_palestine.23.t:0 "Мандат принимает компромисс с доминионом"
 mandate_palestine.23.d:0 "Руководство приняло компромисс с доминионом. После завершения подготовки территория станет доминионом."
 mandate_palestine.23.a:0 "Победа для обоих наших народов."
 mandate_palestine.24.t:0 "Мандат подчиняется"
 mandate_palestine.24.d:0 "Руководство подчинилось нашим требованиям. Оно прекратит подготовку к независимости и сосредоточится на подавлении восстаний."
 mandate_palestine.24.a:0 "Всё идёт по плану."
 mandate_palestine.25.t:0 "Мандат отвергает компромисс с доминионом!"
 mandate_palestine.25.d:0 "Руководство мандата отвергло компромисс с доминионом. Оно утверждает, что срок действия мандата в регионе подошёл к концу и теперь не остаётся иного выбора, кроме независимости."
 mandate_palestine.25.a:0 "Будь они прокляты!"
 mandate_palestine.26.t:0 "Мандат отвергает наши требования!"
 mandate_palestine.26.d:0 "Руководство мандата отвергло наши требования. Оно утверждает, что срок действия мандата в регионе подошёл к концу и теперь не остаётся иного выбора, кроме независимости."
 mandate_palestine.26.a:0 "Будь они прокляты!"
 mandate_palestine.30.t:0 "Вопрос алии"
 mandate_palestine.30.d:0 "После образования нового государства в страну хлынули еврейские иммигранты из-за рубежа, требующие отменить ограничения на въезд. Многие группы по всей стране поддерживают эти требования, тогда как другие считают, что массовая иммиграция приведёт к краху и без того хрупкой экономики.\nОчевидно, что приём иммигрантов вызовет краткосрочные экономические трудности, однако долгосрочные преимущества невозможно переоценить."
 mandate_palestine.30.a:0 "Никому не будет отказано. Это земля для всех."
 mandate_palestine.30.b:0 "Следует впускать их постепенно. Массовая иммиграция погубит страну."
 mandate_palestine.30.c:0 "Любая иммиграция сейчас разрушит нашу слабую экономику. Нужно подождать."
 mandate_palestine.40.t:0 "День выборов"
 mandate_palestine.40.d:0 "С началом выборов население массово идёт к избирательным урнам. Главными претендентами являются Юнионистский альянс Леванта — либерально-демократическая коалиция арабских и еврейских партий во главе с [MPL.GetDemocraticLeader] — и Палестинская коммунистическая партия, ленинская партия под руководством [MPL.GetCommunistLeader]. По мере завершения подсчёта становится ясно, что победителем является:"
 mandate_palestine.40.a:0 "Юнионистский альянс Леванта!"
 mandate_palestine.40.b:0 "Палестинская коммунистическая партия!"
 mandate_palestine.50.t:0 "[MPL.GetNameDefCap] желает вступить в нашу фракцию"
 mandate_palestine.50.d:0 "Мы получили от [MPL.GetNameDef] просьбу официально принять его в наш альянс. Хотя независимость от нас была получена совсем недавно, ещё один союзник на Ближнем Востоке не помешает."
 mandate_palestine.50.a:0 "Мы приветствуем их возвращение."
 mandate_palestine.50.b:0 "Они предатели."
 mandate_palestine.51.t:0 "[ENG.GetNameDefCap] приняло нашу просьбу"
 mandate_palestine.51.d:0 "Наши посланники в [ENG.GetNameDef] получили положительный ответ на просьбу вступить в их фракцию. Теперь мы вновь союзники."
 mandate_palestine.51.a:0 "Прекрасно."
 mandate_palestine.52.t:0 "[ENG.GetNameDefCap] отклонило нашу просьбу"
 mandate_palestine.52.d:0 "[ENG.GetNameDefCap] отказалось принять нас в свой альянс, заявив, что однажды мы уже предали их."
 mandate_palestine.52.a:0 "Будь они прокляты!"
 mandate_palestine.60.t:0 "[MPL.GetNameDefCap] желает вступить в нашу фракцию"
 mandate_palestine.60.d:0 "Мы получили от [MPL.GetNameDef] просьбу официально принять его в наш альянс. После недавнего обретения независимости оно может стать полезным союзником в будущем."
 mandate_palestine.60.a:0 "Мы примем их с распростёртыми объятиями."
 mandate_palestine.60.b:0 "Нам незачем связываться с ними."
 mandate_palestine.71.t:0 "Гарольд Макмайкл уходит в отставку"
 mandate_palestine.71.d:0 "После нескольких неудачных покушений Гарольд Макмайкл покинул пост верховного комиссара. Его место займёт Алан Каннингем."
 mandate_palestine.71.a:0 "Посмотрим, как он справится с управлением."
 mandate_palestine.73.t:0 "Авраам Штерн убит"
 mandate_palestine.73.d:0 "Сегодня трое полицейских совершили налёт на конспиративную квартиру в Тель-Авиве, где, предположительно, скрывался террорист Авраам Штерн. Его обнаружили на месте и застрелили при попытке бегства. Многие задаются вопросом, что теперь станет с организацией «Лехи» без её лидера."
 mandate_palestine.73.a:0 "Скатертью дорога."
 mandate_palestine.80.t:0 "Начало Иерусалимских процессов"
 mandate_palestine.80.d:0 "После обретения независимости остаётся нерешённым вопрос о судьбе многочисленных экстремистских ополчений. Многие считают, что их участники должны сохранить свои должности, тогда как другие требуют отправить руководителей в изгнание либо заставить их уйти в отставку и установить за ними строгий надзор. Чистка еврейских или арабских лидеров несомненно снизит поддержку среди соответствующих общин, но может повысить её среди меньшинств и умеренных."
 mandate_palestine.80.a:0 "Посмотрим, каким будет приговор."
 mandate_palestine.81.t:0 "Дело Фавзи аль-Кавукджи"
 mandate_palestine.81.d:0 "Первым перед судом предстаёт Фавзи аль-Кавукджи. Будучи командующим ополчением Армии спасения, он проявлял крайнюю враждебность к еврейской общине и меньшинствам. Многие требуют изгнать его, но другие заявляют, что мы не можем лишиться столь ценного генерала.\n\nРешение остаётся за присяжными."
 mandate_palestine.81.a:0 "Его необходимо изгнать из страны!"
 mandate_palestine.81.b:0 "Лишить его воинского звания и установить наблюдение."
 mandate_palestine.81.c:0 "Мы не можем позволить себе потерять такого ценного генерала."
 mandate_palestine.82.t:0 "Дело Авраама Штерна"
 mandate_palestine.82.d:0 "Вторым предстаёт Авраам Штерн. Он возглавляет радикальное крыло «Иргуна», участники которого неоднократно выступали против Союза и призывали создать в регионе государство с еврейским господством. Его судьбу решат присяжные."
 mandate_palestine.82.a:0 "Изгнать его. Такой экстремизм недопустим."
 mandate_palestine.82.b:0 "Установить за ним наблюдение."
 mandate_palestine.82.c:0 "Он имеет право выражать своё мнение."
 mandate_palestine.83.t:0 "Дело солдат"
 mandate_palestine.83.d:0 "Последний процесс посвящён рядовым бойцам экстремистских организаций. Многие считают, что их следует лишить званий, но другие отмечают, что из-за малочисленности армии мы не можем терять солдат. Решение за нами."
 mandate_palestine.83.a:0 "Лишить их званий. Они лишь создадут проблемы."
 mandate_palestine.83.b:0 "Они могут остаться, если сохранят верность."
 mandate_palestine.85.t:0 "[MPL.GetNameDefCap] требует референдума в Иордании"
 mandate_palestine.85.d:0 "В рамках стремления [MPL.GetNameDef] к левантийскому единству его представители потребовали от нашего правительства провести в Иордании референдум об объединении с их Союзом. Существует реальная вероятность, что народ поддержит эту инициативу, поэтому именно нам решать, разрешать ли голосование."
 mandate_palestine.85.a:0 "Пусть проводят свой референдум."
 mandate_palestine.85.b:0 "Подтасовать результаты. Наша территориальная независимость неприкосновенна."
 mandate_palestine.86.t:0 "Референдум в Иордании завершился успехом"
 mandate_palestine.86.d:0 "Наш референдум в Иордании завершился успехом, и её народ проголосовал за присоединение к нам. Мы вновь едины."
 mandate_palestine.86.a:0 "Великая победа левантийского единства."
 mandate_palestine.87.t:0 "Референдум в Иордании провалился"
 mandate_palestine.87.d:0 "Наш референдум в Иордании провалился. Народ проголосовал против объединения, и пока мы остаёмся разделены."
 mandate_palestine.87.a:0 "Мы должны принять их решение."
 mandate_palestine.87.b:0 "Результаты были подтасованы! Мы этого не потерпим!"
 mandate_palestine.101.t:0 "Крах мандата"
 mandate_palestine.101.d:0 "Мандат рухнул. Наши силы сумели захватить множество районов с еврейским большинством, но сейчас ведут открытые бои с арабскими ополчениями. Чтобы обеспечить существование национального очага, необходимо быстро победить в этой войне."
 mandate_palestine.101.a:0 "Если захотите — это не будет сказкой!"
 mandate_palestine.102.t:0 "Крах мандата"
 mandate_palestine.102.d:0 "Мандат рухнул. Наши силы сумели захватить множество районов с арабским большинством, но сейчас ведут открытые бои с израильскими ополчениями. Чтобы обеспечить существование нового государства, необходимо быстро победить в этой войне."
 mandate_palestine.102.a:0 "От реки до моря!"
 mandate_palestine.103.t:0 "Крах Союза"
 mandate_palestine.103.d:0 "Союз рухнул. Наши силы сумели захватить множество районов с еврейским большинством, но сейчас ведут открытые бои с арабскими ополчениями. Чтобы обеспечить существование национального очага, необходимо быстро победить в этой войне."
 mandate_palestine.103.a:0 "Если захотите — это не будет сказкой!"
 mandate_palestine.104.t:0 "Крах Союза"
 mandate_palestine.104.d:0 "Союз рухнул. Наши силы сумели захватить множество районов с арабским большинством, но сейчас ведут открытые бои с израильскими ополчениями. Чтобы обеспечить существование нового государства, необходимо быстро победить в этой войне."
 mandate_palestine.104.a:0 "От реки до моря!"
 mandate_palestine.105.t.a:0 "Переворот при поддержке Левантийской коммуны"
 mandate_palestine.105.d.a:0 "После заявления [MPL.GetLeader] о необходимости объединить Левант в едином социалистическом государстве по всей стране вспыхнули выступления сторонников этой идеи. Сегодня огромная толпа мятежников прорвалась в королевский дворец и вот-вот свергнет местное правительство. Следует ли нам уступить?"
 mandate_palestine.105.t.b:0 "Переворот в Иордании при поддержке Левантийской коммуны"
 mandate_palestine.105.d.b:0 "После заявления [MPL.GetLeader] о необходимости объединить Левант в едином социалистическом государстве по всей Иордании вспыхнули выступления сторонников этой идеи. Сегодня огромная толпа мятежников прорвалась в королевский дворец и вот-вот свергнет местное правительство. Следует ли нам уступить?"
 mandate_palestine.105.a:0 "Это единственный выход."
 mandate_palestine.105.b:0 "Нет! Ввести королевскую гвардию!"
 mandate_palestine.106.t:0 "Пролевантийский переворот в Иордании"
 mandate_palestine.106.d:0 "После того как пролевантийские социалистические союзы начали государственный переворот против правительства Иордании, им удалось разгромить королевскую гвардию и захватить власть. Это великая победа левантийского единства и огромный шаг к его осуществлению."
 mandate_palestine.106.a:0 "Превосходно."
 mandate_palestine.107.t:0 "Провал пролевантийского переворота в Иордании"
 mandate_palestine.107.d:0 "После провала недавнего пролевантийского переворота, который мы финансировали, королевская гвардия Иордании начала репрессии против всех пролевантийских партий и идей. Мы должны действовать."
 mandate_palestine.107.a:0 "Это больше не наше дело."
 mandate_palestine.107.b:0 "Мы должны освободить их сами."
 mandate_palestine.110.t:0 "[MPL_borderwar_defender.GetName] захвачен!"
 mandate_palestine.110.d:0 "Наша короткая стычка с войсками [MPL_borderwar_defender.controller.GetNameDef] завершилась блестящей победой! Мы освободили [MPL_borderwar_defender.GetName] от гнёта [MPL_borderwar_defender.controller.GetAdjective] сил и стали ещё на шаг ближе к возвращению законных территорий!"
 mandate_palestine.110.a:0 "Великая победа!"
 mandate_palestine.111.t:0 "Поражение в регионе [MPL_borderwar_defender.GetName]"
 mandate_palestine.111.d:0 "К нашему ужасу, стычка в регионе [MPL_borderwar_defender.GetName] с войсками [MPL_borderwar_defender.controller.GetNameDef] завершилась унизительным поражением. Наши силы были разбиты, и нам не удалось захватить ни одной территории. Однако солдаты [MPL_borderwar_defender.controller.GetAdjective] стороны не стали продвигаться вглубь наших земель. Возможно, в будущем у нас появится ещё один шанс."
 mandate_palestine.111.a:0 "В следующий раз мы будем готовы."
 mandate_palestine.112.t:0 "Поражение в регионе [MPL_borderwar_defender.GetName]"
 mandate_palestine.112.d:0 "К нашему ужасу, стычка в регионе [MPL_borderwar_defender.GetName] с [MPL_borderwar_defender.owner.GetNameDef] завершилась унизительным поражением. Наши силы были разбиты, и нам не удалось защитить регион."
 mandate_palestine.112.a:0 "Оставить их в покое. У нас есть более важные заботы."
 mandate_palestine.112.b:0 "Это нападение не останется без ответа!"
 mandate_palestine.113.t:0 "Победа в регионе [MPL_borderwar_defender.GetName]"
 mandate_palestine.113.d:0 "Глупцы из [MPL_borderwar_attacker.controller.GetAdjective] стороны решили, что смогут отнять нашу территорию, но мы без труда разгромили их слабые силы."
 mandate_palestine.113.a:0 "Возможно, это послужит им уроком."
 mandate_palestine.114.t:0 "Войска [MPL_borderwar_attacker.controller.GetAdjective] стороны собираются у границы"
 mandate_palestine.114.d:0 "Верховное командование получило сообщения о сосредоточении войск [MPL_borderwar_defender.controller.GetAdjective] стороны у границы региона [MPL_borderwar_defender.GetName]. Одни считают это блефом, другие полагают, что они попытаются захватить регион."
 mandate_palestine.114.a:0 "Если это так, мы должны быть готовы."
 mandate_palestine.120.t:0 "Нестабильность в Иордании"
 mandate_palestine.120.d:0 "С недавней потерей мандата Палестинского региона, Эмират Трансиордании сталкивается с нестабильностью своего собственного. Отстранившись от нашего контроля, люди требуют большей автономии внутри империи. Мы можем либо удовлетворить эту просьбу, либо направить войска для восстановления порядка."
 mandate_palestine.120.a:0 "Ближний Восток становится обузой."
 mandate_palestine.121.t:0 "Волнения в Сирии"
 mandate_palestine.121.d:0 "После недавнего обретения независимости территориями Палестинского мандата и Иорданией по Сирии прокатилась волна местного национализма, вдохновлённая успехами движений за независимость на Ближнем Востоке.\n\nЕсли вскоре не решить эту проблему, она вполне может перерасти в полномасштабное восстание."
 mandate_palestine.121.a:0 "Мы должны действовать."
 mandate_palestine.122.t:0 "Поражение в Сирии"
 mandate_palestine.122.d:0 "После неоднократных поражений от войск [SYR.GetAdjective] стороны наше правительство испытывает давление с требованием прекратить войну и предоставить Сирии независимость, поскольку продолжение боевых действий серьёзно подорвёт стабильность страны."
 mandate_palestine.122.a:0 "Вывести войска. У нас есть более важные заботы."
 mandate_palestine.122.b:0 "Мы добьёмся полной победы!"
 mandate_palestine.123.t:0 "Победа!"
 mandate_palestine.123.d:0 "После отступления последних войск [MPL_syria_war_owner.GetAdjective] стороны нам удалось установить контроль над всеми своими территориями!"
 mandate_palestine.123.a:0 "Независимость достигнута!"
 mandate_palestine.150.t:0 "Временный аэродром в Умм-эр-Рашраше"
 mandate_palestine.150.d:0 "Мы открыли временную авиабазу в Умм-эр-Рашраше, чтобы размещать приобретённые за рубежом самолёты."
 mandate_palestine.150.a:0 "Превосходно."
 mandate_palestine.151.t:0 "Перенос столицы"
 mandate_palestine.151.d:0 "С началом войны руководство страны решило перенести центр управления в Тель-Авив. Хотя мы считаем Иерусалим своей столицей, из-за его уязвимого положения правительство придётся временно разместить в Тель-Авиве."
 mandate_palestine.151.a:0 "Мы вернёмся."
 mandate_palestine.152.t:0 "Полёт Пини"
 mandate_palestine.152.d:0 "Приближаясь к посадочной площадке в Неватиме, Пинхас Бен-Порат увидел отчаянное положение мошава. Поселение окружили сотни арабских ополченцев, а доставленных им припасов надолго бы не хватило. Нужно было что-то предпринять.\n\n«Залезай!» — крикнул Пинхас командиру Пальмаха, защищавшему поселение. Вместе они сняли правую дверь его потрёпанного RWD-13, установили пулемёт «Брен» и загрузили столько гранат, сколько смогли.\n\nСнова поднявшись в воздух, они заметили арабских ополченцев, наступавших на поселение, и открыли по ним огонь из пулемёта, сбрасывая гранаты во время перезарядки. Это вынудило арабов прекратить наступление на мошав.\n\nНеватим пережил этот день и продолжил борьбу."
 mandate_palestine.152.a:0 "Нужный человек в нужное время."
 mandate_palestine.201.t:0 "Крах Палестинского мандата"
 mandate_palestine.201.d:0 "С самого учреждения Палестинского мандата после Великой войны было очевидно, что из-за растущей этнической напряжённости и региональных конфликтов такое образование не сможет существовать долго.\n\nПохоже, противоречия достигли предела: по всей стране восстали еврейские и арабские ополчения, а британцы признали, что потеряли контроль над конфликтом, и начали выводить свои войска.\n\nМало кто способен предсказать исход этой борьбы, но несомненно одно: произошедшее навсегда изменит ход истории Ближнего Востока."
 mandate_palestine.201.a:0 "Отдельный случай или начало общей тенденции?"
 mandate_palestine.202.t:0 "Крах государства [MPL.GetNameDef]"
 mandate_palestine.202.d:0 "Из Леванта поступают новости о крахе власти юнионистов. Местные еврейские и арабские ополчения выступили друг против друга, что привело к полному развалу правительства хрупкого союза. Хотя многие предсказывали такой исход, масштаб утраченного прогресса всё равно удивляет.\n\nВозможно, Ближний Восток ещё не готов к этому."
 mandate_palestine.202.a:0 "Но что происходит с отложенной мечтой?"
 mandate_palestine.203.t:0 "Арабское восстание 1936 года"
 mandate_palestine.203.d:0 "Можно было бы легко предсказать, что даже под контролем [MPL.OVERLORD.GetAdjective]Искусственный мандат, созданный в Палестине после Великой войны, не будет длиться долго. Растущая этническая напряженность после инцидента в Цементе в октябре 1935 года превратилась в полномасштабную массовую трудовую забастовку с насильственными беспорядками, направленными против еврейских гражданских лиц в некоторых регионах.\n\nВо главе с муфтием Иерусалима Амином аль-Хусейни восставшие потребовали полного прекращения еврейской иммиграции в регион и ликвидации военизированных организаций ишува.\n\n[MPL.OVERLORD.GetAdjective] Власти уже начали готовиться к дальнейшей эскалации."
 mandate_palestine.203.a:0 "Попытавшись забрать слишком многое, можно остаться ни с чем."
 mandate_palestine.205.t:0 "[JOR.GetNameDefCap] отдаляется от [MPL_JOR_ruler.GetNonIdeologyName]"
 mandate_palestine.205.d:0 "Сегодня [JOR.GetLeader] объявил, что [JOR.GetNameDef] намерено дистанцироваться от [MPL_JOR_ruler.GetNameDef] после того, как эмират оказался отрезан от остальной империи вследствие краха Палестинского мандата.\n\n[MPL_JOR_ruler.GetNameDefCap] направило войска для стабилизации региона, однако неизвестно, смогут ли они удержать [JOR.GetNameDef] в сфере влияния [MPL_JOR_ruler.GetAdjective] стороны.\n\nПосле утраты мандата многие считали такой исход вероятным. Будущее покажет, подходит ли к концу эпоха колониализма на Ближнем Востоке."
 mandate_palestine.205.a:0 "Значит, это действительно тенденция."
 mandate_palestine.205.b:0 "Ид аль-Истикляль! (Играть за Иорданию)"
 mandate_palestine.206.t:0 "[MPL.GetNameDefCap] провозглашает независимость"
 mandate_palestine.206.d:0 "Сегодня Временное правительство [MPL.GetNameDef] объявило, что земля Палестины провозглашает независимость от [MPL_ruler.GetNameDef]. Оно поблагодарило прежнего сюзерена за помощь в подготовке региона, но заявило, что настало время разорвать прежние связи.\n\nНовый союз объединяет арабов и евреев, которые пока, похоже, движутся к общей цели. Из-за нестабильности региона мало кто способен предсказать его будущее."
 mandate_palestine.206.a:0 "Отдельный случай или начало общей тенденции?"
 mandate_palestine.207.t:0 "Завершение Иерусалимской конференции"
 mandate_palestine.207.d:0 "После долгой борьбы за независимость [ISR.GetLeader] и [PAL.GetLeader] сегодня объявили о роспуске Палестинского мандата и создании на его месте независимой федерации. Пока мир удаётся сохранять, хотя напряжённость никуда не исчезла.\n\nТем не менее конфликт вокруг региона, похоже, подходит к мирному завершению. Лишь будущее покажет окончательный результат."
 mandate_palestine.207.a:0 "Отдельный случай или начало общей тенденции?"
 mandate_palestine.208.t.a:0 "[ISR.GetLeader] провозглашает Государство Израиль"
 mandate_palestine.208.t.b:0 "[ISR.GetLeader] провозглашает Иудейскую республику"
 mandate_palestine.208.t.c:0 "[ISR.GetLeader] провозглашает Королевство Израиль"
 mandate_palestine.208.d:0 "Даже после Моше Гесса и Теодора Герцля многие высмеивали идею независимой еврейской страны. В конце концов, как мог народ вновь объединиться после двух тысяч лет изгнания? Сегодня сомневающиеся умолкли.\n\nВ торжественной речи в доме основателя Тель-Авива Меира Дизенгофа, произнесённой перед тысячами людей, [ISR.GetLeader] провозгласил еврейское государство на Земле Израиля.\n\nЭто уже вызвало напряжённость по всему Ближнему Востоку, и многие арабские страны рассматривают возможность вмешательства.\n\nКаким бы ни было будущее, сегодняшний день стал историческим для евреев всего мира."
 mandate_palestine.208.a:0 "Сегодня смешон тот, кто отрицает существование еврейской нации."
 mandate_palestine.208.b:0 "Мы отомстим!"
 mandate_palestine.208.c:0 "Это не сон."
 mandate_palestine.209.t:0 "[PAL.GetLeader] провозглашает Государство Палестина"
 mandate_palestine.209.de:0 "\n[PAL.GetLeader] Сегодня в Рамалле провозглашено создание нового палестинского государства после победы над израильскими силами. Он благодарит все страны, поддержавшие их дело во время войны, и заявляет, что борьба еще не закончена и что предстоит проделать большую работу по восстановлению новой нации."
 mandate_palestine.209.a:0 "Будущее покажет, каким путём пойдёт Ближний Восток."
 mandate_palestine.209.b:0 "Слава [PAL.GetNameDef]!"
 mandate_palestine.210.t.a:0 "Вторая франко-сирийская война"
 mandate_palestine.210.t.b:0 "Сирийская революция"
 mandate_palestine.210.d:0 "Спустя двадцать лет после первой франко-сирийской войны в Сирии вновь вспыхнул конфликт. После недавней волны независимости на Ближнем Востоке, начавшейся в Палестинском мандате и продолжившейся в Иордании, местные сирийские повстанцы выступили против [MPL_syria_war_owner.GetNameDef].\n\nМногие специалисты предсказывали, что после преждевременного прекращения британских мандатов сирийский мандат вскоре также рухнет, и теперь этот прогноз подтвердился.\n\nКак бы то ни было, европейское колониальное господство на Ближнем Востоке, а возможно и во всём мире, оказалось под угрозой."
 mandate_palestine.210.a:0 "Костяшки домино падают одна за другой."
 mandate_palestine.210.b:0 "Сирия будет свободна! (Играть за Сирию)"
 mandate_palestine.301.t:0 "Столкновение между [MPLGetRandomMilitiaJew] и [MPLGetRandomMilitiaArab] в городе [MPLGetRandomCity]"
 mandate_palestine.301.d:0 "Сегодня в городе [MPLGetRandomCity] произошло столкновение между группами участников [MPLGetRandomMilitiaJew] и [MPLGetRandomMilitiaArab]. С началом боя мирные жители покинули район, а на место прибыла полиция. Полицейским удалось прекратить столкновение, однако, похоже, верх одержали [MPLGetRandomMilitiaJew]."
 mandate_palestine.301.a:0 "Мир необходимо сохранить."
 mandate_palestine.302.t:0 "Столкновение между [MPLGetRandomMilitiaJew] и [MPLGetRandomMilitiaArab] в городе [MPLGetRandomCity]"
 mandate_palestine.302.d:0 "Сегодня в городе [MPLGetRandomCity] произошло столкновение между группами участников [MPLGetRandomMilitiaJew] и [MPLGetRandomMilitiaArab]. С началом боя мирные жители покинули район, а на место прибыла полиция. Полицейским удалось прекратить столкновение, однако, похоже, верх одержали [MPLGetRandomMilitiaArab]."
 mandate_palestine.302.a:0 "Мир необходимо сохранить."
 mandate_palestine.303.t:0 "Гарнизон города [MPLGetRandomCity] атакован бойцами [MPLGetRandomMilitiaJew]"
 mandate_palestine.303.d:0 "Сегодня один из наших гарнизонов в городе [MPLGetRandomCity] подвергся нападению бойцов [MPLGetRandomMilitiaJew]. Бой был недолгим, и солдатам удалось отбить атаку, однако они понесли потери, а район размещения гарнизона теперь уязвим."
 mandate_palestine.303.a:0 "Этого нельзя допускать."
 mandate_palestine.304.t:0 "Гарнизон города [MPLGetRandomCity] атакован бойцами [MPLGetRandomMilitiaArab]"
 mandate_palestine.304.d:0 "Сегодня один из наших гарнизонов в городе [MPLGetRandomCity] подвергся нападению бойцов [MPLGetRandomMilitiaArab]. Бой был недолгим, и солдатам удалось отбить атаку, однако они понесли потери, а район размещения гарнизона теперь уязвим."
 mandate_palestine.304.a:0 "Этого нельзя допускать."
 mandate_palestine.305.t:0 "Транспорт с оружием захвачен бойцами [MPLGetRandomMilitiaJew]"
 mandate_palestine.305.d:0 "Сегодня бойцы [MPLGetRandomMilitiaJew] совершили налёт на один из наших транспортов с оружием. Водителя и охранника пощадили, однако оружие найти не удалось, а значит, оно попало в руки врага."
 mandate_palestine.305.a:0 "Мы должны действовать."
 mandate_palestine.306.t:0 "Транспорт с оружием захвачен бойцами [MPLGetRandomMilitiaArab]"
 mandate_palestine.306.d:0 "Сегодня бойцы [MPLGetRandomMilitiaArab] совершили налёт на один из наших транспортов с оружием. Водителя и охранника пощадили, однако оружие найти не удалось, а значит, оно попало в руки врага."
 mandate_palestine.306.a:0 "Мы должны действовать."
 mandate_palestine.401.t:0 "[ISR.GetNameDefCap] просит нашей поддержки"
 mandate_palestine.401.d:0 "После начала войны на Ближнем Востоке [ISR.GetNameDef] обратилось к нам за поддержкой. Его представители утверждают, что победа над [PAL.GetNameDef] отвечает нашим интересам, а помощь позволит расширить сферу нашего влияния после их победы. Некоторые члены правительства поддерживают эту просьбу, другие считают, что следует помочь [PAL.GetNameDef], а третьи выступают за нейтралитет."
 mandate_palestine.401.a:0 "Мы их поддержим."
 mandate_palestine.401.b:0 "Глупо было даже обращаться к нам."
 mandate_palestine.402.t:0 "[PAL.GetNameDefCap] просит нашей поддержки"
 mandate_palestine.402.d:0 "После начала войны на Ближнем Востоке [PAL.GetNameDef] обратилось к нам за поддержкой. Его представители утверждают, что победа над [ISR.GetNameDef] отвечает нашим интересам, а помощь позволит расширить сферу нашего влияния после их победы. Некоторые члены правительства поддерживают эту просьбу, другие считают, что следует помочь [ISR.GetNameDef], а третьи выступают за нейтралитет."
 mandate_palestine.402.a:0 "Мы их поддержим."
 mandate_palestine.402.b:0 "Глупо было даже обращаться к нам."
 mandate_palestine.403.t:0 "[event_target_support_MPL.GetNameDefCap] соглашается нас поддержать"
 mandate_palestine.403.d:0 "Наша миссия в [event_target_support_MPL.GetNameDef] завершилась большим успехом: руководство страны объявило о поддержке нашего дела и готово отправить столь необходимые припасы."
 mandate_palestine.403.a:0 "Они об этом не пожалеют."
 mandate_palestine.404.t:0 "[event_target_support_MPL.GetNameDefCap] отказывается нас поддержать"
 mandate_palestine.404.d:0 "Наша миссия в [event_target_support_MPL.GetNameDef] завершилась унизительным отказом. Руководство страны категорически отвергло просьбу о поддержке и сейчас ведёт переговоры с нашим врагом."
 mandate_palestine.404.a:0 "Будь они прокляты!"
 mandate_palestine.405.t:0 "Офицеры Арабского легиона требуют вмешательства"
 mandate_palestine.405.d:0 "После почти полного разгрома палестинских сил новым израильским государством многие наши офицеры потребовали вмешаться и занять Западный берег, чтобы защитить их. Это рискованный шаг, но он позволит расширить сферу влияния и укрепить наше положение как новой державы Ближнего Востока."
 mandate_palestine.405.a:0 "Мобилизовать Легион. Мы спасём наших братьев."
 mandate_palestine.405.b:0 "Мы не должны посягать на их суверенитет."
 mandate_palestine.406.t:0 "Возможности на востоке"
 mandate_palestine.406.d:0 "После почти полного разгрома палестинских сил новым израильским государством на востоке открылась возможность. Многие офицеры предлагают занять сектор Газа, чтобы расширить наше влияние на Ближнем Востоке. Это рискованный шаг, но он позволит увеличить сферу нашего контроля и ослабить израильские силы."
 mandate_palestine.406.a:0 "Начать вторжение."
 mandate_palestine.406.b:0 "Мы не должны посягать на их суверенитет."
 mandate_palestine.407.t:0 "Иорданцы вторгаются"
 mandate_palestine.407.d:0 "Катастрофическая неспособность отбросить сионистских захватчиков и сохранить независимость страны побудила Арабский легион рассмотреть вторжение на Западный берег. Его войска уже начали марш, и вскоре окажутся в Рамалле."
 mandate_palestine.407.a:0 "Почему вы ничего не сказали? Почему?"
 mandate_palestine.408.t:0 "Газа пала"
 mandate_palestine.408.d:0 "Катастрофическая неспособность отбросить сионистских захватчиков и сохранить независимость страны побудила египетское верховное командование рассмотреть вторжение в Газу. Его войска уже начали марш, и вскоре полностью установят контроль над городом."
 mandate_palestine.408.a:0 "В её узких улицах стоял особый запах — запах поражения и нищеты."
 mandate_palestine.410.t:0 "Волна беженцев из [MPL_target_refugees.GetNameDefCap]"
 mandate_palestine.410.d:0 "После захвата власти фашистами в [MPL_target_refugees.GetNameDefCap] десятки тысяч беженцев устремились к нашим границам в поисках безопасного убежища, считая нас защитниками свободы на Ближнем Востоке. Их принятие повысит нашу популярность, но может чрезмерно нагрузить государственные службы."
 mandate_palestine.410.d.b:0 "После начала гражданской войны в [MPL_target_refugees.GetNameDefCap] десятки тысяч беженцев устремились к нашим границам в поисках безопасного убежища, считая нас защитниками свободы на Ближнем Востоке. Их принятие повысит нашу популярность, но может чрезмерно нагрузить государственные службы."
 mandate_palestine.410.d.c:0 "После фашистской оккупации [MPL_target_refugees.GetNameDefCap] десятки тысяч беженцев устремились к нашим границам в поисках безопасного убежища, считая нас защитниками свободы на Ближнем Востоке. Их принятие повысит нашу популярность, но может чрезмерно нагрузить государственные службы."
 mandate_palestine.410.a:0 "Страна для всех."
 mandate_palestine.410.b:0 "Мы не можем так рисковать."
 mandate_palestine.501.t:0 "Резня в автобусе у Кфар-Сиркина"
 mandate_palestine.501.d:0 "Сегодня, в ответ на растущее изменение баланса сил в регионе, было совершено нападение на автобус, следовавший из Иерусалима в Нетанию неподалёку от еврейского поселения Кфар-Сиркин. Восемь членов арабской банды из Яффы устроили засаду, в результате которой погибли пять человек и многие получили ранения."
 mandate_palestine.501.a:0 "В нашем детском саду много детей."
 mandate_palestine.502.t:0 "Взрыв в доме семьи Абу-Лабан"
 mandate_palestine.502.d:0 "Сегодня, в ответ на растущее изменение баланса сил в регионе, было совершено нападение на дом семьи Абу-Лабан неподалёку от Петах-Тиквы. Погибли двенадцать жильцов. Предполагается, что это была атака «Хаганы» на здание, считавшееся штабом арабской банды."
 mandate_palestine.502.a:0 "В нашем детском саду много детей."
 mandate_palestine.503.t:0 "Обстрел автобуса у Хадеры"
 mandate_palestine.503.d:0 "Вскоре после недавнего нападения был обстрелян автобус, направлявшийся на юг неподалёку от еврейского города Хадера. В результате атаки, совершённой арабской бандой из окрестных деревень, погибли два человека."
 mandate_palestine.503.a:0 "Некоторых из них я люблю, других знаю не очень хорошо."
 mandate_palestine.504.t:0 "Взрыв на Хайфском нефтеперерабатывающем заводе"
 mandate_palestine.504.d:0 "В продолжение недавних террористических нападений сегодня участники «Иргуна» бросили бомбу в толпу арабских рабочих на Хайфском нефтеперерабатывающем заводе, убив шесть человек. Для задержания террористов были направлены солдаты, однако им удалось скрыться."
 mandate_palestine.504.a:0 "Но все знают о храбрости Рана,"
 mandate_palestine.505.t:0 "Резня на Хайфском нефтеперерабатывающем заводе"
 mandate_palestine.505.d:0 "После недавней атаки «Иргуна» на Хайфском нефтеперерабатывающем заводе сотни арабских рабочих ворвались на территорию предприятия с металлическими прутьями, забив до смерти 39 еврейских рабочих и ранив ещё 49. Полиция прибыла лишь через час после начала резни и почти не смогла остановить беспорядки."
 mandate_palestine.505.a:0 "Хотя у него есть тайна, которую он мало кому расскажет,"
 mandate_palestine.506.t:0 "Бойня в Балад-эш-Шейхе"
 mandate_palestine.506.d:0 "После хаоса на Хайфском нефтеперерабатывающем заводе участники «Хаганы» отомстили погромщикам, напав на их поселение Балад-эш-Шейх. В городе вспыхнула перестрелка между силами «Хаганы» и местным арабским ополчением. Предполагается, что погибли от 50 до 70 человек, преимущественно взрослые мужчины."
 mandate_palestine.506.a:0 "О том, как он влюблён в одну из девочек."
 mandate_palestine.507.t:0 "Амин аль-Хусейни приказывает блокировать Иерусалим"
 mandate_palestine.507.d:0 "Первым актом открытой войны в этом кризисе стал приказ муфтия Иерусалима Амина аль-Хусейни о полной блокаде еврейских кварталов города. Бойцы «Хаганы» уже пытались доставить туда припасы, но подверглись нападению у ворот Западного Иерусалима.\n\nНаши силы потеряли контроль над Наблусом и Рамаллой."
 mandate_palestine.507.a:0 "И холодной тёмной ночью он признаётся ей в любви,"
 mandate_palestine.508.t:0 "«Хагана» вводит обязательный призыв"
 mandate_palestine.508.d:0 "После осады Иерусалима арабскими силами командующий «Хаганой» Яаков Дори по приказу Бен-Гуриона ввёл обязательный призыв всех трудоспособных мужчин и женщин Ишува. Десятки тысяч людей явились в призывные пункты, и численность «Хаганы» превысила 20 000 бойцов.\n\nНаши власти больше не могут гарантировать контроль над Прибрежной равниной."
 mandate_palestine.508.a:0 "Она плачет, когда он предлагает ей стать всем его миром,"
 mandate_palestine.509.t:0 "Отряды «Братьев-мусульман» входят из Египта"
 mandate_palestine.509.d:0 "Увидев приближающийся крах британской власти в регионе, вооружённые арабские группы пересекли границу с Египтом и захватили южные районы мандата. Из-за малочисленности населения и отсутствия значительного британского присутствия они без труда заняли юг.\n\nПохоже, война неизбежна."
 mandate_palestine.509.a:0 "Ночь перед войной."
 mandate_palestine.510.t.a:0 "Крах мандата"
 mandate_palestine.510.t.b:0 "Крах Союза"
 mandate_palestine.510.d.a:0 "Это было неизбежно. После недавнего полного краха британской власти в подмандатной территории правительство в Лондоне решило уйти из региона.\n\nСегодня [ENG.GetLeader] обратился к народу, заявив, что британцы больше ничего не могут сделать и немедленно начинают вывод войск.\n\nУже ничего нельзя изменить."
 mandate_palestine.510.d.b:0 "Это было неизбежно. После недавнего полного краха правительства мандата гостиница «Царь Давид» опустела.\n\nУже ничего нельзя изменить."
 mandate_palestine.510.a:0 "В нашем батальоне много детей; некоторых я люблю;"
 mandate_palestine.999.t:0 "§RНе играйте за эту страну в режиме «Железная воля».§!"
 mandate_palestine.999.d:0 "Из-за дрянного спагетти-кода Paradox смена страны ломает режим «Железная воля», поэтому играть за эту страну в нём невозможно.\nПереключитесь на другую страну или отключите режим «Железная воля».\n\n§RВы были предупреждены.§!"
 mandate_palestine.999.a:0 "Вините Paradox, а не меня."
 mandate_palestine.1001.t:0 "Ещё один обычный день"
 mandate_palestine.1001.d:0 "Яир уже не впервые шёл по рынкам Хайфы. С момента алии он изо всех сил пытался устроить свою жизнь. Она была куда менее комфортной, чем в Польше, но здесь его хотя бы защищала сплочённая община. К тому же всё это делалось ради благородной цели, не так ли?\n\n«Стойте!» Яир повернулся и увидел, как между евреем и несколькими арабами вспыхнула драка. Он не понял, что стало причиной, но такая сцена была для него привычной, поэтому не уделил ей особого внимания. До алии он всегда верил, что евреи и арабы способны жить мирно. В некоторых местах это действительно получалось, но каждый день жизни в Хайфе всё сильнее подрывал его веру.\n\n«Когда-нибудь...» — подумал он."
 mandate_palestine.1001.a:0 "Когда-нибудь."
 mandate_palestine.1002.t:0 "Немного надежды"
 mandate_palestine.1002.d:0 "Снова проходя по рынку Хайфы, Яир не мог не заметить, как изменилось настроение в городе после недавнего объявления. Насилие, конечно, не прекратилось, однако общее ощущение стало иным. Казалось, люди — и евреи, и арабы — обрели немного надежды. Никто не ожидал, что британцы отступят, и это одинаково потрясло всех. И всё же Яир чувствовал среди людей готовность к сотрудничеству, которой не замечал с момента своего приезда.\n\nВозможно, грядут перемены?"
 mandate_palestine.1002.a:0 "Путь в тысячу миль начинается с одного шага."
 mandate_palestine.1003.t:0 "Осуществлённая мечта"
 mandate_palestine.1003.d:0 "На этот раз рынок казался иным. Впервые Яир увидел, как арабы и евреи успешно работают вместе. Родители приходили с детьми, которых прежде боялись приводить в подобные места. Пожилым людям помогали нести покупки. Какая перемена, подумал он.\n\nВнезапно за спиной раздался грохот. Яир почти инстинктивно приготовился к очередной драке, но, обернувшись, увидел, что одна из полок торговца рухнула, а люди бросились собирать рассыпавшиеся по земле фрукты.\n\nЯир улыбнулся."
 mandate_palestine.1003.a:0 "Время исцеляет даже самые глубокие раны."
 mandate_palestine.1004.t:0 "Отложенная мечта"
 mandate_palestine.1004.d:0 "Когда пуля сбила его с ног, Яир подумал обо всех решениях, которые привели к этому мгновению. Была надежда. Были усилия. Но всё оказалось напрасно.\n\nИстекая кровью, он лишь желал, чтобы его маленький сын прожил лучшую жизнь. Возможно, его жертва имела смысл. Возможно, другого пути не существовало.\n\nВозможно."
 mandate_palestine.1004.a:0 "А наши пустые места поднимают на ноги тысячи тех, кто пришёл продолжить нашу борьбу."
