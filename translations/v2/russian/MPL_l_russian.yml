 MPL_foreign_support_category_desc:0 "После начала войны в стране многие великие державы обратили внимание на регион из-за его стратегического положения. Следует воспользоваться этим и заручиться иностранной поддержкой в нашей справедливой борьбе за освобождение. Враг также осознал эту возможность и готовится поступить так же. Мы должны его опередить и получить как можно больше помощи.\n\n[GER.GetFlag][GER.GetNameDefCap] — [MPLGetGER]\n[ITA.GetFlag][ITA.GetNameDefCap] — [MPLGetITA]\n[SOV.GetFlag][SOV.GetNameDefCap] — [MPLGetSOV]\n[ENG.GetFlag][ENG.GetNameDefCap] — [MPLGetENG]\n[FRA.GetFlag][FRA.GetNameDefCap] — [MPLGetFRA]\n[USA.GetFlag][USA.GetNameDefCap] — [MPLGetUSA]\n"
