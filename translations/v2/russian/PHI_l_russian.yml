l_russian:
 r56_philippines_focus:0 "Национальные фокусы Филиппин"
 PHI_develop_anti_air_capabilities:0 "Развить возможности ПВО"
 PHI_post_indenpence_stabilization:0 "Реорганизовать правительство"
 PHI_post_indenpence_stabilization_desc:0 "Политическая обстановка в стране стала хаотичной: фашистские, коммунистические и демократические партии борются за власть. Пора положить этому конец и начать строить новую страну для нашего народа, реорганизовав правительство и систему правопорядка!"
 PHI_a_new_regime:0 "Воспользоваться возможностью"
 PHI_a_new_regime_desc:0 "Мы решили последовать авторитарным идеологиям Запада."
 PHI_fighting_filipinos:0 "Боевые филиппинцы"
 PHI_fighting_filipinos_desc:0 "Некоторые министры предложили начать новую военно-пропагандистскую кампанию «Боевые филиппинцы». Следует немедленно воплотить эту идею."
 PHI_filipino_irrdentism:0 "Филиппинский ирредентизм"
 PHI_filipino_irrdentism_desc:0 "Теперь, когда поддержка нашей идеологии и армии значительно возросла, народ готов вернуть принадлежащее нам, когда настанет подходящий момент."
 PHI_support_the_ganap_party:0 "Поддержать Фалангу"
 PHI_support_the_ganap_party_desc:0 "Если мы поддержим партию Ганап, она обещает более сплочённые Филиппины и большую прозрачность правительства."
 PHI_huk_revolutionaries:0 "Наследие восстания Катипунана"
 PHI_huk_revolutionaries_desc:0 "Сейчас коммунистические революционеры терроризируют наш народ, но если предоставить им больше автономии и влияния в Конгрессе, положение может измениться."
 PHI_ideological_fanaticism:0 "Пропаганда против [USA.GetAdjective]"
 PHI_ideological_fanaticism_desc:0 "Если население будет охвачено фанатизмом, оно станет защищать острова до последнего человека."
 PHI_reach_out_to_spain:0 "Обратиться к Испании"
 PHI_reach_out_to_spain_desc:0 "Следует заручиться поддержкой других фашистских стран."
 PHI_soviet_trade_mission:0 "Связаться с [SOV.GetAdjective]"
 PHI_soviet_trade_mission_desc:0 "В Юго-Восточной Азии мы в одиночку отстаиваем социалистическое дело. Чтобы обезопасить недавно обретённую независимость, необходимо заручиться поддержкой Советов."
 PHI_militarized_police:0 "Филиппинская констебулярия"
 PHI_militarized_police_desc:0 "Недавно созданная Филиппинская констебулярия будет подавлять любые беспорядки и выступления против правительства."
 PHI_may_2nd_uprising:0 "Фалангистский переворот"
 PHI_may_2nd_uprising_desc:0 "Время пришло, братья! Сегодня сакдалисты восстанут!"
 PHI_hukbalap_rebellion:0 "Вторая революция: [ROOT.GetAdjective]"
 PHI_hukbalap_rebellion_desc:0 "Благодаря предоставленной Хукбалахапу автономии его сторонники смогли собрать крупную коммунистическую армию для свержения правительства!"
 PHI_peace_keeping_youth:0 "Санггунианг Пангкабатаан"
 PHI_peace_keeping_youth_desc:0 "Создав Санггунианг Пангкабатаан — Молодёжный совет, — мы дадим молодому поколению возможность участвовать в демократических процессах нового правительства и предотвратим его радикализацию."
 PHI_covert_NKVD_operations:0 "Тайные операции НКВД"
 PHI_covert_NKVD_operations_desc:0 "Советы готовы использовать НКВД для чистки всей политической оппозиции в стране — если только мы позволим им..."
 PHI_greater_philippines_concept:0 "Концепция Великих Филиппин"
 PHI_greater_philippines_concept_desc:0 "С незапамятных времён наши султаны, раджи и вожди владели всеми островами этого региона к северу от экватора. Мы заявим права на Сабах и бывшие острова Генерал-капитанства Филиппин, чтобы исправить историческую несправедливость, причинённую нам колонизаторами."
 PHI_demand_guam:0 "Референдум на Гуаме"
 PHI_demand_guam_desc:0 "Мы можем использовать разведку и силы специального назначения, чтобы организовать на Гуаме референдум, который придаст нашей аннексии законный вид."
 PHI_demand_spanish_captaincy_general_islands:0 "Острова испанского Генерал-капитанства"
 PHI_demand_spanish_captaincy_general_islands_desc:0 "Как когда-то испанцы правили этими островами, так теперь будем править и мы! Мы продолжим и усилим тайные операции на островах, пока они не станут нашими!"
 PHI_demand_sabah:0 "Оккупировать Сабах"
 PHI_demand_sabah_desc:0 "Пока руки британцев связаны в Европе и Африке, мы можем вернуть Сабах его законным владельцам — султану Сулу и филиппинскому народу."
 PHI_island_infrastrcture:0 "Островная инфраструктура"
 PHI_island_infrastrcture_desc:0 "Прежние владельцы наших новых территорий пренебрегали их инфраструктурой и населением. Нам предстоит развивать города и сельскую местность, чтобы начать индустриализацию."
 PHI_island_industry:0 "Островная промышленность"
 PHI_island_industry_desc:0 "Наши местные отрасли, основанные на сельском хозяйстве, рыболовстве и металлургии, станут основой индустриализации."
 PHI_greater_philippines_established:0 "Великие Филиппины восстановлены"
 PHI_greater_philippines_established_desc:0 "Мы наконец вернули то, что было у нас отнято! Теперь можно вступить в эпоху мира и процветания."
 PHI_follow_the_american_way:0 "Следовать американскому пути"
 PHI_follow_the_american_way_desc:0 "Американцы научили нас свободе и демократии. Чтобы сохранить недавно обретённую независимость, мы должны продолжать идти по этому пути."
 PHI_elect_new_congressmen:0 "Избрать новых конгрессменов"
 PHI_elect_new_congressmen_desc:0 "Мы проведём новые выборы, чтобы заменить конгрессменов прежнего колониального правительства лидерами, подотчётными только филиппинскому народу."
 PHI_european_intervention:0 "Вмешательство в Европе"
 PHI_european_intervention_desc:0 "Как первая демократия Азии, мы обязаны поддерживать и защищать стремления всех, кто желает освободиться от любых форм порабощения, даже если речь идёт о наших бывших мучителях."
 PHI_ally_funded_development:0 "Инвестиции Союзников"
 PHI_ally_funded_development_desc:0 "Благодаря нашим действиям в Европе Союзники теперь направляют нам пожертвования и помощь для развития родины."
 PHI_the_filipino_corridor:0 "Филиппинский коридор"
 PHI_the_filipino_corridor_desc:0 "Союзникам необходим плацдарм для вторжения в Японию. Филиппины подходят для этого идеально."
 PHI_worldwide_intervention:0 "Глобальное вмешательство"
 PHI_worldwide_intervention_desc:0 "Война распространяется по всему миру, и всё большему числу свободных стран требуется наша помощь. Первая демократия Азии нужна для защиты идеалов свободы как никогда прежде."
 PHI_fascist_defense:0 "Оборона от фашистов"
 PHI_fascist_defense_desc:0 "Острова открыты для японского вторжения. Чтобы нейтрализовать эту угрозу, необходимо построить сухопутные и береговые укрепления."
 PHI_accept_refugees:0 "Принимать беженцев"
 PHI_accept_refugees_desc:0 "Из-за вооружённых конфликтов в Азии многие люди ищут безопасное убежище, но не имеют средств добраться до него. Мы откроем острова для этих беженцев и обеспечим им безопасный путь."
 PHI_refugee_voluteers:0 "Добровольцы-беженцы"
 PHI_refugee_voluteers_desc:0 "Многие беженцы хотят отплатить нам за предоставленное убежище. Мы сформируем дополнительные добровольческие дивизии и поддержим их вооружённую борьбу."
 PHI_bring_democracy_to_japan:0 "Принести демократию в Японию"
 PHI_bring_democracy_to_japan_desc:0 "Пришло время перейти в наступление против империалистической угрозы — Японии."
 PHI_the_industrialized_islands_plan:0 "План индустриализированных островов"
 PHI_the_industrialized_islands_plan_desc:0 "Местная промышленность смогла привести нас лишь к нынешнему уровню. Чтобы страна продолжала развиваться, необходимо значительно ускорить индустриализацию."
 PHI_urbanize_the_islands:0 "Урбанизировать острова"
 PHI_urbanize_the_islands_desc:0 "Архипелажная география не позволяет выделять огромные пространства под сельскохозяйственные, промышленные или торговые районы. Чтобы создать мощный промышленный сектор, мы превратим Филиппины в компактную индустриальную утопию."
 PHI_manila_central_railway:0 "Центральный железнодорожный вокзал Манилы"
 PHI_manila_central_railway_desc:0 "Теперь, когда Филиппинские национальные железные дороги восстановлены, пора связать все города с единым центральным вокзалом."
 PHI_fund_armscor:0 "Финансировать Армскор"
 PHI_fund_armscor_desc:0 "Некий дон Сельсо Туасон ещё до независимости приобрёл американскую компанию по снабжению оружием и превратил её в филиппинское предприятие по производству вооружения. Мы профинансируем Армскор и сделаем компанию нашим партнёром по снабжению вооружённых сил боеприпасами и снаряжением, а также главным конструкторским бюро стрелкового оружия."
 PHI_seize_illegal_weapons_manufacturer:0 "Захватить нелегальные оружейные мастерские"
 PHI_seize_illegal_weapons_manufacturer_desc:0 "Партизаны создали подпольные оружейные мастерские для собственных нужд, но мы можем захватить их и использовать сами."
 PHI_national_defence_fund:0 "Фонд национальной обороны"
 PHI_national_defence_fund_desc:0 "Если мы выделим средства в Фонд национальной обороны, их можно будет направить на приобретение новых заводов и снаряжения."
 PHI_expanded_chromium_mining:0 "Расширить добычу хрома"
 PHI_expanded_chromium_mining_desc:0 "На островах издавна в небольших количествах добывали хром, но недавно геологи обнаружили крупное месторождение на Минданао. Пора расширить горнодобывающую промышленность и использовать эту возможность в собственных интересах."
 PHI_develop_palawan:0 "Развивать Палаван"
 PHI_develop_palawan_desc:0 "На малонаселённом острове Палаван много свободной земли для строительства и подходящая береговая линия для портов. У острова огромный потенциал стать укреплённым промышленным центром."
 PHI_develop_mindano:0 "Развивать Минданао"
 PHI_develop_mindano_desc:0 "«Земля обетованная» богата неиспользованными сельскохозяйственными, промышленными и людскими ресурсами и обладает огромным пространством для дальнейшего развития промышленности. Мы уже основали здесь несколько крупных городов, но остров следует развивать ещё активнее, чтобы он мог обеспечивать потребности всей страны."
 PHI_additional_research_slot1:0 "Единая образовательная программа"
 PHI_additional_research_slot1_desc:0 "Для технологического развития необходимо расширить исследовательские программы, вкладывая средства в новые университеты и научные центры."
 PHI_american_computer_imports:0 "Импортировать американские компьютеры"
 PHI_american_computer_imports_desc:0 "Чтобы понять устройство существующих вычислительных машин, их необходимо изучить методом обратной разработки. Только после этого мы сможем создать собственные."
 PHI_synth_oil:0 "Технологии замещения"
 PHI_synth_oil_desc:0 "Поскольку у нас нет нефти в пригодных для промышленной добычи объёмах, необходимы программы по её замещению."
 PHI_study_enemy_ciphers:0 "Изучить вражеские шифры"
 PHI_study_enemy_ciphers_desc:0 "Развитие криптографии и криптоанализа сделало наши дешифровальные машины устаревшими. Следует изучить новые методы и разработать современное оборудование."
 PHI_research_new_enegry_options:0 "Филиппинская программа атомной энергетики"
 PHI_research_new_enegry_options_desc:0 "Атомная энергия уже доказала, что является энергией будущего. Наши учёные хотят стать первопроходцами в этой области и просят поддержки в столь грандиозном научном начинании."
 PHI_additional_research_slot2:0 "Университет Филиппин"
 PHI_additional_research_slot2_desc:0 "Мы создадим исследовательский университет, который будет готовить учёных, специалистов и руководителей, способных развивать страну посредством научных исследований и разработок, сохраняя национальную гордость и чувство долга перед филиппинским народом."
 PHI_teachings_of_the_usaffe:0 "Закон о национальной обороне [GetYear] года"
 PHI_teachings_of_the_usaffe_desc:0 "УСАФФЕ — Вооружённые силы армии США на Дальнем Востоке — обучали нашу армию до обретения независимости, поэтому существующие войска во многом построены по американскому образцу. Следует сохранить эту цепочку командования и позволить генералам, прошедшим американскую подготовку, совершенствовать наши военные доктрины."
 PHI_defense_of_manila:0 "Оборона Лусона"
 PHI_defense_of_manila_desc:0 "Нас окружают враги со всех сторон — и внутри островов, и за их берегами. Хуже того, архипелажная география делает полноценную оборону почти невозможной. Необходимо построить укрепления вокруг столицы, чтобы Вооружённые силы Филиппин могли защищать её любой ценой."
 PHI_island_hopping_strategy:0 "Стратегия «прыжков по островам»"
 PHI_island_hopping_strategy_desc:0 "Если мы собираемся перейти в наступление, следует изучить американскую и японскую тактику «прыжков по островам»."
 PHI_american_doctrines:0 "Американские доктрины"
 PHI_american_doctrines_desc:0 "Наша армия является преемницей УСАФФЕ, поэтому в наших интересах проводить совместные учения и операции с американцами и сохранять военные традиции США, которым мы следовали до сих пор."
 PHI_japanese_doctrines:0 "Японские доктрины"
 PHI_japanese_doctrines_desc:0 "Японцы верят в превосходство как на суше, так и на море, и эта доктрина уже доказала, что превосходит нашу нынешнюю. Следует последовать пути Восходящего солнца и принять Путь воина."
 PHI_american_imports:0 "Импорт американского оружия"
 PHI_american_imports_desc:0 "Большая часть нашего вооружения состоит из американской техники предыдущего поколения. В наших интересах расширить импорт и попросить американцев предоставить более современное военное снаряжение."
 PHI_lighting_warfare:0 "Молниеносная война"
 PHI_lighting_warfare_desc:0 "Нам следует разработать собственную филиппинскую боевую доктрину, лучше всего подходящую для защиты страны и вдохновлённую германским блицкригом и тактикой «прыжков по островам». Главный упор будет сделан на стремительные десантные операции и господство на море."
 PHI_study_european_tanks:0 "Изучить танки [GER.GetAdjective]"
 PHI_study_european_tanks_desc:0 "Война в Европе стала отличным полигоном для бронетанковых технологий. Используя этот опыт, мы должны разработать собственные машины."
 PHI_create_main_battle_tanks:0 "Отдать приоритет мобильным танкам"
 PHI_create_main_battle_tanks_desc:0 "Танкостроение должно идти в ногу со временем. Крайне важно продолжать развитие бронетехники для сражений будущего."
 PHI_import_new_howitzers:0 "Импортировать новые гаубицы"
 PHI_import_new_howitzers_desc:0 "Наша устаревшая артиллерия больше не соответствует требованиям времени. Необходимо импортировать новые гаубицы."
 PHI_anti_tank_guns:0 "Противотанковые орудия"
 PHI_anti_tank_guns_desc:0 "Для борьбы с новыми тяжёлыми танками необходимо разработать собственные противотанковые орудия."
 PHI_army_modernisation:0 "Модернизация армии"
 PHI_army_modernisation_desc:0 "Война и боевые действия кардинально изменились со времён катипунерос. Крайне важно модернизировать Вооружённые силы Филиппин и подготовиться к будущим конфликтам — как на нашей земле, так и за её пределами."
 PHI_air_base_expansion:0 "Расширить авиабазы"
 PHI_air_base_expansion_desc:0 "Если мы хотим господствовать в небе, необходимо расширить гражданские и военные аэродромы."
 PHI_fighter_modernisation:0 "Модернизация истребителей"
 PHI_fighter_modernisation_desc:0 "Наши старые межвоенные истребители уступают самолётам завтрашнего дня."
 PHI_air_innovations:0 "Авиационные инновации"
 PHI_air_innovations_desc:0 "Начальник штаба предложил кабинету новые тактики и боевые порядки. Чтобы не отставать от других стран, необходимо внедрить эти идеи."
 PHI_heavy_fighter_concept:0 "Концепция тяжёлого истребителя"
 PHI_heavy_fighter_concept_desc:0 "Если нам придётся перейти в наступление, потребуется новый тип истребителя, способный долго действовать глубоко в воздушном пространстве противника."
 PHI_naval_bomber_experiments:0 "Эксперименты с морскими бомбардировщиками"
 PHI_naval_bomber_experiments_desc:0 "Господство в воздухе столь же важно над морем, как и над сушей. Специализированная авиация для морской войны поможет добиться этой цели."
 PHI_medium_bomber_focus:0 "Упор на средние бомбардировщики"
 PHI_medium_bomber_focus_desc:0 "Развитие концепции точного бомбометания с увеличенной дальностью для выполнения задач поддержки."
 PHI_light_bomber_focus:0 "Упор на лёгкие бомбардировщики"
 PHI_light_bomber_focus_desc:0 "Не следует недооценивать значение пикирующих бомбардировщиков для непосредственной поддержки войск."
 PHI_air_modernisations_program:0 "Программа модернизации авиации"
 PHI_air_modernisations_program_desc:0 "Авиационная теория не менее важна, чем технологии. Нас всё ещё ждут новые приёмы и стратегии для пилотов."
 PHI_rocket_development:0 "Развитие ракетной техники"
 PHI_rocket_development_desc:0 "Скорость — характеристика, от которой зависят все остальные качества самолёта. Ракетные и реактивные двигатели теоретически позволят преодолеть все прежние пределы."
 PHI_shipyard_expansion:0 "Расширить верфи"
 PHI_shipyard_expansion_desc:0 "Как островному государству, нам необходима сильная судостроительная промышленность, чтобы обеспечить своё положение на море."
 PHI_license_foreign_ships:0 "Лицензировать иностранные корабли"
 PHI_license_foreign_ships_desc:0 "Наши соседи постоянно разрабатывают новые типы кораблей. Мы должны приобретать лицензии, изучать эти проекты, а затем создавать собственные суда, соответствующие нашим стратегическим и тактическим потребностям."
 PHI_anti_sub_defense_force:0 "Крейсерский флот"
 PHI_anti_sub_defense_force_desc:0 "Для реализации наших планов присутствия на море потребуются всё более крупные корабли."
 PHI_import_submarine_techology:0 "Импортировать технологии подводных лодок"
 PHI_import_submarine_techology_desc:0 "Отставание в подводном кораблестроении недопустимо. Мы получим необходимые технологии, даже если придётся их купить."
 PHI_commerce_attack:0 "Тактика торговой войны"
 PHI_commerce_attack_desc:0 "Подрывая снабжение противника с помощью подводных лодок и лёгких эсминцев, мы сможем обеспечить превосходство на море, несмотря на сравнительно небольшой флот."
 PHI_study_allied_and_axis_naval_tactics:0 "Изучить морскую тактику Союзников"
 PHI_study_allied_and_axis_naval_tactics_desc:0 "Сосредоточившись на приёмах противодействия наиболее вероятным врагам, мы сохраним преимущество в морских сражениях."
 PHI_island_defense:0 "Оборона островов"
 PHI_island_defense_desc:0 "Мобильные силы береговой обороны небольшого радиуса действия потенциально способны выполнять работу стационарных укреплений, многократно превосходящих их числом."
 PHI_strike_force:0 "Ударное соединение"
 PHI_strike_force_desc:0 "Если нам не хватает численности, необходима быстро развёртываемая группа боевых кораблей, способная нанести удар по врагу там и тогда, где он наиболее уязвим."
 PHI_pacific_navy:0 "Великий Тихоокеанский флот"
 PHI_pacific_navy_desc:0 "Глубокий пересмотр военно-морской стратегии будет иметь огромное значение, если мы хотим эффективно использовать корабли в Тихом океане."
 PHI_the_pan_malayan_confederation:0 "Панмалайская конфедерация"
 PHI_the_pan_malayan_confederation_desc:0 "Предками филиппинского народа были индонезийцы и малайцы. Мы давно мечтали объединить всех малайцев в одном национальном государстве, несмотря на разные пути, которыми пошли наши страны. Сегодня эта мечта становится реальностью."
 PHI_invite_indonesia:0 "Пригласить Индонезию"
 PHI_invite_indonesia_desc:0 "Объединение Нусантары и наших островов — первый шаг к малайскому единству."
 PHI_invite_malaysia:0 "Пригласить Малайзию"
 PHI_invite_malaysia_desc:0 "Малайзийской федерации нужна поддержка братьев по происхождению, чтобы выжить. Мы пригласим её в наш альянс и наконец объединим всех малайских мужчин, женщин и детей в одном «балангае»."
 PHI_american_way:0 "Американский путь"
 PHI_american_way_desc:0 "На нашу политическую систему оказало сильное влияние прежнее государство-сюзерен — Соединённые Штаты Америки."
 PHI_greater_philipines:0 "Великие Филиппины"
 PHI_greater_philipines_desc:0 "Во славу нашего народа мы вернули то, что принадлежит нам по праву! Будь то благодаря националистическому пылу или ветрам революции. "
 PHI_stablized_state:0 "Стабилизированное государство?"
 PHI_stablized_state_desc:0 "Мы пережили первые нестабильные годы независимости и переживём ещё многие."
 PHI_fighting_filipinos_focus:0 "Боевые филиппинцы"
 PHI_fighting_filipinos_focus_desc:0 "Наша новая военная пропагандистская кампания «Боевые филиппинцы» укрепила поддержку армии и нашей идеологии."
 PHI_filipino_irredentism:0 "Филиппинский ирредентизм"
 PHI_filipino_irredentism_desc:0 "Благодаря поддержке армии и зарождающимся националистическим настроениям настало время твёрдо и решительно отстаивать свои интересы в эту эпоху неопределённости."
 PHI_industrial:0 "Индустриализированные острова"
 PHI_industrial_desc:0 "Наш новый план стремительной индустриализации пользуется большой поддержкой населения."
 PHI_japanese_advisors_idea:0 "Японские советники"
 PHI_japanese_advisors_idea_desc:0 "Японские советники прививают нашему флоту идеи создания великих морских сил."
 PHI_american_advisors:0 "Американские советники"
 PHI_american_advisors_desc:0 "Американские советники полностью изменили нашу тактику, сделав упор на превосходство пехоты."
 PHI_island_hopping:0 "Тактика «прыжков по островам»"
 PHI_island_hopping_desc:0 "Изучив тактику «прыжков по островам», мы определили наиболее эффективный способ её применения."
 PHI_teachings_usa:0 "Закон о национальной обороне"
 PHI_teachings_usa_desc:0 "Дайте мне десять тысяч филиппинских солдат, и я покорю мир — Дуглас Макартур."
 PHI_ideological_rebels:0 "Идеологические революционеры"
 PHI_unstable_state:0 "Нестабильное государство"
 PHI_unstable_state_desc:0 "После обретения независимости множество групп боролись за власть. Теперь их осталось лишь три, но они ожесточённо сражаются за контроль над палатой представителей."
 PHI_refugee_volunteers:0 "Добровольцы-беженцы"
 PHI_expand_the_intelligence_services:0 "Расширить разведывательные службы"
 PHI_expand_the_intelligence_services_desc:0 ""
 PHI_state_terror:0 "Государственный террор"
 PHI_state_terror_desc:0 "Наша революция будет в безопасности лишь тогда, когда мы сокрушим любую оппозицию, способную встать на пути воли нашего народа и его государства."
 PHI_surveillance_state:0 "Государство всеобщего надзора"
 PHI_surveillance_state_desc:0 "Угроза внутренней и внешней подрывной деятельности требует следить за неблагонадёжными лицами, чтобы сохранить чистоту, честь и преданность нашего верного народа."
 phil.1.t:0 "Миссия [PHI.GetAdjective] в государство [SOV.GetNameDef]"
 phil.1.d:0 "Революционеры [PHI.GetAdjective] из «Хукбалахапа» связались с нашим министерством иностранных дел, чтобы обсудить возможное сотрудничество в будущем и нашу помощь в готовящейся ими революции на Филиппинах. Они считают, что обмен военными исследованиями укрепит сотрудничество между нашими народами и поможет им обрести независимость от колонизаторов."
 phil.1.a:0 "Приветствуем наших новых коммунистических друзей!"
 phil.1.b:0 "Зачем нам заключать договор с такой ничтожной страной?"
 phil.2.t:0 "Торговая миссия [PHI.GetAdjective]—[SOV.GetAdjective] принята"
 phil.2.d:0 "Наш посол прислал восторженное сообщение с подробностями окончательного соглашения, заключённого с государством [SOV.GetNameDef]. Обещание передать нам проекты их танков вместе с несколькими инженерами для обучения наших специалистов значительно ускорит исследования в области бронетехники."
 phil.2.a:0 "Это знаменательное событие!"
 phil.3.t:0 "Торговая миссия [PHI.GetAdjective]—[SOV.GetAdjective] отклонена"
 phil.3.d:0 "Сторона [SOV.GetAdjective] отклонила наше торговое предложение."
 phil.3.a:0 "Мрачный день для отношений [PHI.GetAdjective]—[SOV.GetAdjective]."
 phil.8.t:0 "Референдум на Гуаме"
 phil.8.d:0 "Правительство [FROM.GetAdjective] обратилось к нашей администрации с просьбой провести на Гуаме референдум, на котором жители острова смогут проголосовать за объединение с государством [FROM.GetNameDef]. Прежде чем принять решение и сообщить его правительству [FROM.GetAdjective], следует тщательно оценить значение Гуама для нашей армии и экономики."
 phil.8.a:0 "Если этого хочет народ..."
 phil.8.b:0 "Ничего подобного не будет!"
 phil.9.t:0 "[FROM.GetNameDefCap] отклоняет нашу просьбу"
 phil.9.d:0 "По сообщениям, [FROM.GetNameDefCap] отклонила просьбу нашего правительства провести референдум на Гуаме, заявив, что в этом нет необходимости, поскольку сами жители небольшого острова этого не желают. Поистине неудачный поворот событий как для народа [ROOT.GetAdjective], так и для жителей Гуама!"
 phil.9.a:0 "Как прискорбно..."
 phil.10.t:0 "[FROM.GetNameDefCap] принимает нашу просьбу"
 phil.10.d:0 "[FROM.GetNameDefCap] приняла просьбу нашего правительства провести референдум на Гуаме и сообщила, что голосование состоится в ближайшее время. После первоначального объявления жители Гуама были уведомлены о предстоящем референдуме. К счастью, большинство проголосовало за передачу государству [ROOT.GetNameDef] полного административного и военного контроля над островом и последующее включение Гуама в состав [ROOT.GetNameDeF]."
 phil.10.a:0 "Поистине демократический способ решать важные вопросы!"
