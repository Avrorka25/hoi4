l_russian:
 r56_SIK_bring_kashgar_back_into_the_fold:0 "Вернуть Кашгар под наш контроль"
 r56_SIK_bring_kashgar_back_into_the_fold_desc:0 "С нас хватит фарса [KHM.getleader]. Мы позволили ему получить слишком большой контроль над Кашгарским военным округом, и пора решить этот вопрос раз и навсегда.\n\n§RЕсли отправить [KHM.getleader] ультиматум до того, как [SOV.getnamedef] обязуется поддерживать [SIK.getleader], [SOV.getnamedef] не поможет нам в войне с [KHM.getname].§!"
 r56_resolve_the_xinjiang_problem:0 "Решить синьцзянский вопрос"
 SIK_caught_off_guard:0 "Застать [KHM.getleader] врасплох"
 SIK_caught_off_guard_desc:0 "36-я дивизия [KHM.getleader] была застигнута врасплох нашими недавними требованиями и вмешательством в их дела. Сейчас мы обладаем огромным преимуществом в столкновении с их войсками."
 SIK_KHM_defaction:0 "Переход командиров на другую сторону"
 SIK_KHM_defaction_decs:0 "Некоторые командиры нашей армии начинают переходить на сторону противника, ослабляя нашу решимость продолжать борьбу. Нам потребуется время, чтобы оправиться от этих предательств."
 sik.1.t:0 "[SIK.getleader] требует прямого контроля над Кашгарским военным округом."
 sik.1.desc:0 "Похоже, недавние политические победы [SIK.getleader] придали ему смелости. Он считает своим правом и обязанностью править всеми регионами Синьцзяна, включая находящийся под нашим контролем Кашгарский военный округ. Однако это лишь попытка подорвать положение и лишить влияния [KHM.GetLeader], которого [SIK.GetLeader] считает соперником за власть в регионе. Как нам ответить на столь необоснованное требование?"
 sik.1.a:0 "Сплотить народ и сражаться с предателем [SIK.GetLeader]!"
 sik.1.b:0 "У нас нет выбора, кроме как уступить..."
 sik.2.t:0 "[KHM.getleader] собирает войска, чтобы сопротивляться нашим требованиям!"
 sik.2.desc:0 "[KHM.getleader] ответил на наши требования сбором подчинённых ему войск и подготовкой к бою. Это демонстративное восстановление его контроля над регионом и прямое оскорбление [SIK.getleader]. Необходим быстрый и решительный ответ!"
 sik.2.a:0 "Войти и немедленно ударить!"
 sik.2.b:0 "Лучше выиграем время..."
 sik.3.t:0 "[KHM.getleader] уступает!"
 sik.3.desc:0 "Столкнувшись с войной, которую он не мог выиграть, [KHM.getleader] передал контроль над Кашгарским военным округом и своими войсками [SIK.getleader]. Это значительно укрепит наши позиции в Синьцзяне и в Китае в целом!"
 sik.3.a:0 "Великая победа!"
 sik.4.t:0 "[SIK.getleader] отступает!"
 sik.4.desc:0 "Не желая вступать в бой с [KHM.getleader], армии под командованием [SIK.getleader] отказались от требований установить контроль над Кашгарским военным округом. Это великая победа народа Кашгара! Она ещё сильнее закрепляет наш контроль над землёй и Кашгарским регионом."
 sik.4.a:0 "Великая победа!"
 SIK_KHM_REBELS_tt:0 "В Кашгаре появится дивизия тюркских повстанцев"
 sik.6.t:0 "Синьцзянский вопрос"
 sik.6.desc:0 "Всего несколько часов назад к нам прибыл [FROM.GetAdjective] посланник в [ROOT.GetNameDef], говоря о некоем «синьцзянском вопросе». По всей видимости, [FROM.GetAdjective] правительство предлагает нам экономические выгоды, расширенную поддержку и политические уступки в обмен на прекращение военной защиты [SIK.GetNameDef] со стороны [ROOT.GetNameDef]. Откажемся ли мы от восточных союзников или продолжим, казалось бы, безусловную поддержку [SIK.GetNameDef] — вот в чём вопрос..."
 sik.6.a:0 "Знаете, [FROM.GetAdjective] посланник довольно обаятелен."
 sik.6.b:0 "[SOV.GetLeader] — человек слова!"
 sik.7.t:0 "Синьцзянский вопрос — [SOV.GetAdjective] принимают предложение"
 sik.7.desc:0 "Несколько часов назад [SOV.GetAdjective] посланник в [ROOT.GetNameDef] сообщил нам, что [SOV.GetAdjective] приняли наше предложение и прекратили военную защиту [SIK.GetNameDef]. [SOV.GetAdjective] войска уже начали вывод из [SIK.GetNameDef]."
 sik.7.a:0 "[SIK.GetLeader], должно быть, в ярости!"
 sik.8.t:0 "Синьцзянский вопрос — [SOV.GetAdjective] отказывают"
 sik.8.desc:0 "Несколько часов назад [SOV.GetAdjective] посланник в [ROOT.GetNameDef] сообщил нам, что [SOV.GetAdjective] отклонили наше предложение и подтвердили свои обязательства на востоке, включая военную защиту [SIK.GetNameDef]. [SOV.GetAdjective] войска останутся в [SIK.GetNameDef]."
 sik.8.a:0 "Проклятые [SOV.GetAdjective]!"
