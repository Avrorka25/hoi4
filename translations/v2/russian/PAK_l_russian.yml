 PAK_national_unifier:0 "Объединитель нации"
 PAK_voice_of_the_muslims:0 "Голос мусульман"
 pakistan.3.t:0 "Умер видный бангладешский политик"
 pakistan.3.d:0 "После долгой борьбы в больнице Бангладеш потерял одного из своих важнейших лидеров. Теперь его народ внимательно следит за вашей реакцией на эту трагическую утрату."
 pakistan.4.t:0 "Языковой вопрос"
 pakistan.4.d:0 "Язык Восточного Пакистана, бенгальский, уже давно является болезненной темой для Пакистана. Недавно началась реформа образования, и бенгальцы спрашивают: «Будут ли нас учить на бенгальском?»"
 pakistan.5.t:0 "Разрушительный циклон приближается к Восточному Пакистану"
 pakistan.5.d:0 "Бенгальское побережье в последнее время стало гораздо неспокойнее обычного, а новости о том, что разрушительный циклон может обрушиться в любую минуту, вызвали панику. Люди требуют помощи от своего лидера."
