 communist_power_base:0 "Коммунистическое влияние в [From.GetName]"
 communist_revolution:0 "Коммунистическая революция"
 communist_revolution_desc:0 "Успешную революцию можно разумно провести лишь при поддержке нового правительства большинством страны. Мы должны сплотить провинции вокруг коммунистического дела, иначе новооснованное правительство окажется лишь слабой пародией на власть."
 fascist_power_base:0 "Фашистское влияние в [From.GetName]"
 fascist_coup:0 "Фашистский государственный переворот"
 fascist_coup_desc:0 "Успешный переворот возможен лишь при поддержке нового правительства большинством страны. Мы должны сплотить провинции вокруг фашистского дела, иначе новооснованное правительство окажется лишь слабой пародией на власть."
 choose_fascism:0 "К фашизму"
 choose_communism:0 "К коммунизму"
 PAK_Liaquat_Ali_Khan:0 "Лиакат Али Хан"
 PAK_Mian_Iftikharuddin:0 "Миан Ифтихаруддин"
 bangladesh_liberation:0 "Освобождение Бангладеш"
 bangladesh_liberation_desc:0 "Бенгальцы Восточного Пакистана разочарованы и считают себя недостаточно представленными в Карачи. Националистические силы начинают формироваться и набирать тревожно широкую поддержку.\n\nОтношение Индии к независимости Бангладеш: [Root.PAK_indian_support]\nТекущее §Yстремление Бангладеш к свободе§!: §R[?bangladesh_freedom]§!\nНа это значение можно влиять через §Yстроительство инфраструктуры§!, §Yстроительство фабрик§!, §Yприсутствие войск§! или §Yсобытия и решения§!\nЕсли §Yстремление к свободе§! приблизится к §R100§!, начнётся гражданская война."
 pak_mus_unity:0 "Позволяет §Yнационализировать любой регион§!, являющийся национальным для §Yмусульманской страны§!"
 support_loyalist_militias:0 "Поддержать лоялистские ополчения"
 support_loyalist_militias_desc:0 "Ситуация на востоке страны ухудшается, и насилие, похоже, становится единственным средством, способным подавить восстание."
 increase_federalism:0 "Предложить дальнейшую федерализацию"
 increase_federalism_desc:0 "Пока мы не можем давать конкретных обещаний, но расплывчатые заявления о расширении автономии после снижения напряжённости могут уменьшить воинственность и политическую активность бенгальского населения."
 bangladesh_liberation_disable:0 "Напряжённость спадает"
 bangladesh_liberation_disable_desc:0 "После месяцев осторожных политических манёвров мы убедили значительное большинство бенгальцев, что пребывание в составе Пакистана даёт больше преимуществ, чем самостоятельный путь."
 communism_chosen:0 "Выбран коммунизм"
 appeal_to_the_proletariat:0 "Обратиться к пролетариату"
 appeal_to_the_proletariat_desc:0 "Неблагоприятное политическое, культурное и географическое положение нашей страны не означает, что рабочие Запада и Востока должны быть противопоставлены друг другу. Мы должны освободить массы от угнетающих представлений о национализме."
 integrate_muslim_states:0 "Интегрировать [From.GetName]"
 pak_very_sympathetic:0 "§RОчень сочувствуют§!\nЭто означает, что в случае войны они рассмотрят возможность присоединиться к ним.\n"
 pak_sympathetic:0 "§OСочувствуют§!\nЭто означает, что в случае войны они, вероятно, окажут им помощь.\n"
 pak_opposed:0 "§GВыступают против§!\nЭто означает, что в случае войны они будут пассивно поддерживать нас.\n"
 pak_neutral:0 "§YНейтральны§!\nЭто означает, что они останутся в стороне от любого конфликта.\n"
