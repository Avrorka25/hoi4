 jordan.1.t:0 "Вторая национальная конференция"
 jordan.1.desc:0 "Эмир Трансиордании Абдалла сегодня выступил с обращением по поводу системы племенных советов, созданной для умиротворения бедуинского населения и влиятельных племён, прежде державших власть. Однако Трансиордания вступила в новую эпоху, когда ей больше не угрожают племенные восстания или ваххабитские набеги, и эмиру предстоит решить, какому племени отдать приоритет."
 jordan.1.a:0 "Утайба — воины."
 jordan.1.b:0 "Бани-Сахр — верные."
 jordan.1.c:0 "Ховейтат — элита."
 jordan.1.d:0 "Армия должна оставаться в стороне, без вмешательства племён!"
 jordan.2.t:0 "[JOR.GetNameDefCap] запрашивает поставки оружия"
 jordan.2.d:0 "Слухи распространились из [JOR.GetNameDef] Некоторые элементы в стране готовятся свергнуть про-[JOR.overlord.GetAdjective] правительство. Эти мятежники просили нашей поддержки в вооружении их сил, и мы должны решить, стоит ли это нашего времени."
 jordan.2.a:0 "Жизненно важный союзник в регионе."
 jordan.2.b:0 "Мы вежливо откажемся."
 jordan.3.t:0 "[JOR.GetNameDefCap] запрашивает поставки оружия"
 jordan.3.d:0 "Слухи распространились из [JOR.GetNameDef] Некоторые элементы в стране готовятся свергнуть про-[JOR.overlord.GetAdjective] правительство. Эти мятежники просили нашей поддержки в вооружении их сил, и мы должны решить, стоит ли это нашего времени."
 jordan.3.a:0 "Жизненно важный союзник в регионе."
 jordan.3.b:0 "Мы вежливо откажемся."
 jordan.4.t:0 "Иракские поставки оружия"
 jordan.4.d:0 "Вскоре после отправки нескольких зашифрованных сообщений иракскому правительству оно согласилось направить нам партию оружия через Мафрак."
 jordan.4.a:0 "Замечательно"
 jordan.5.t:0 "Саудовские поставки оружия"
 jordan.5.d:0 "Вскоре после отправки нескольких зашифрованных сообщений саудовскому правительству оно согласилось направить нам партию оружия через Маан."
 jordan.5.a:0 "Замечательно"
 jordan.6.t:0 "Закон об умиротворении"
 jordan.6.d:0 "После жаркой дискуссии между эмиром Абдаллой и его министром Его Высочество объявил народу о политике умиротворения и дополнительной поддержке племенных советов, которые постепенно теряют влияние и всё сильнее раскалывают эмират. [JOR.GetLeader] намерен реформировать систему и уже сумел укрепить отношения с племенем Утайба, устранив угрозу нового восстания Адван."
 jordan.6.a:0 "Ещё одна угроза устранена."
 jordan.7.t:0 "[JOR.GetNameDefCap] просит пересмотреть договор"
 jordan.7.d:0 "[JOR.GetAdjective] посланник прибыл в [GetCapital.GetCapitalVictoryPointName] для переговоров с верховным комиссаром по вопросам договора 1928 года и его ограничений для трансиорданской армии, бюрократии и автономии. [JOR.GetLeader] просит ослабить ограничения для эмирата. Хотя это уменьшит наш контроль над регионом, возможно, цена оправдана, если он останется верным союзником."
 jordan.7.a:0 "Это нам не повредит."
 jordan.7.b:0 "Глупцы! Кем они себя возомнили?"
 jordan.8.t:0 "Британский отказ"
 jordan.8.d:0 "[ENG.GetLeader] и верховный комиссар отказались ослабить договор 1928 года, заявив, что и без того считают его крайне мягким."
 jordan.8.a:0 "Они нами не управляют!"
 jordan.8.b:0 "Не стоит будить медведя."
 jordan.9.t:0 "Пересмотр договора 1928 года"
 jordan.9.d:0 "После поездки нашего посланника в Иерусалим британский верховный комиссар Палестины согласился смягчить ограничения договора 1928 года. Это большая победа эмира, и народ ликует!"
 jordan.9.a:0 "Никогда больше не быть нам рабами."
 jordan.10.t:0 "Послевоенная борьба за власть"
 jordan.10.d:0 "Наша война за независимость окончена, и нам удалось закрепить своё положение на мировой арене. Однако, хотя армия и племена сотрудничали во время войны, теперь они начали борьбу друг с другом.\n\nПо всей стране вспыхнули столкновения, но когда солнце скрылось за пустыней, стало ясно, что..."
 jordan.10.a:0 "Военным удалось подавить восстания."
 jordan.10.b:0 "Племенам удалось одолеть военных!"
