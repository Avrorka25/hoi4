 JOR_unsupported_war:0 "Война без поддержки"
 JOR_unsupported_war_desc:0 "Мы по собственной инициативе напали на [ISR.GetNameDef], и маловероятно, что [ROOT.OVERLORD.GetNameDef] поддержит наши действия."
 JOR_tribes_desc:0 "Наша недавно созданная политическая система включает правящего монарха и совет представителей племён, которые удерживают страну вместе и способствуют дальнейшему объединению народа. Однако это затрудняет любые попытки эмира заручиться политической поддержкой или укрепить свою власть. Кроме того, племена придерживаются жёсткого консерватизма, замедляя модернизацию армии, промышленности и внешней политики Иордании, которую поддерживает народ. Любое отступление от этой системы может вызвать проблемы в будущем.\n\nХовейтат: [JORGetHowitat]\nАль-Утайба: [JORGetUtaybah]\nБани-Сахр: [JORGetBaniSakhr]\nБани-Хамида: [JORGetBaniHamida]\n\n\n§WОбщая поддержка племён: §Y[?JOR_tribal_support]%"
 JOR_tribes:0 "Положение племенного совета"
 JOR_tribe_aggressive_loc:0 "§RВраждебны §W"
 JOR_tribe_supportive_loc:0 "§GПоддерживают §W"
 JOR_tribe_neutral_loc:0 "§YНейтральны §W"
 JOR_tribal_support_red:0 "§R[?JOR_tribal_support]%§!"
