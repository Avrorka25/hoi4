 mio_cat_tech_all_cruiser_and_modules:0 "Все технологии крейсер"
 mio_cat_tech_all_destroyer_and_modules:0 "Все технологии разрушителей"
 mio_cat_tech_all_motorized_mechanized:0 "Все моторизованные и механизированные технологии"
 militia_tech:0 "Милиция"
 TOA_jungle_pioneers_support_tech:0 "Пионеры джунглей"
 basic_fortification_tech:0 "Базовая фортификация"
 basic_fortification_tech_desc:0 "Используя более прочные материалы и металлические арматуры внутри конструкций, мы можем строить более крупные укрепления, не беспокоясь о их разрушении."
 land_fort_tech_1:0 "Улучшенные земельные форты"
 land_fort_tech_1_desc:0 "Улучшая использование земли, окружающей наши укрепления, и внедряя новые технологии для загрузки, мы можем укрепить существующие структуры и расширить их еще больше."
 land_fort_tech_2:0 "Передовые сухопутные форты"
 land_fort_tech_2_desc:0 "Учась на прошлых ошибках и укрепляя не только саму конструкцию, но и ее базовые основы, мы сможем построить гораздо более крупные укрепления, которые смогут сдерживать даже самых опытных врагов."
 coastal_fort_tech_1:0 "Улучшенные береговые укрепления"
 coastal_fort_tech_1_desc:0 "Благодаря более эффективному использованию земли, окружающей наши прибрежные укрепления, и внедрению новых технологий для загрузки, мы можем укрепить наши существующие структуры и расширить их еще больше."
 coastal_fort_tech_2:0 "Продвинутые прибрежные укрепления"
 coastal_fort_tech_2_desc:0 "Построив наши бункеры и укрепления дальше в утесы и холмы, мы можем построить еще более крупные комплексы, способные отразить даже величайшие силы морского вторжения."
 sp_rockets_improved_guidance:0 "Улучшение руководства"
 sp_rockets_improved_guidance_desc:0 "Лучшие системы наведения для ракет позволят нам отправлять наши летающие бомбы дальше, делая их еще большей угрозой нашим врагам. Улучшив системы наведения для небольших ракет, наша ракетная артиллерия сможет также улучшить их цель."
 sp_rockets_rocket_bomber:0 "$rocket_propelled_bombs$"
 sp_rockets_rocket_bomber_desc:0 "$rocket_propelled_bombs_desc$"
 sp_rockets_improved_rocket_bomber:0 "$improved_rocket_propelled_bombs$"
 sp_rockets_improved_rocket_bomber_desc:0 "$improved_rocket_propelled_bombs_desc$"
 sp_armored_advanced_flamethrower_tech:0 "Усовершенствованный огнемёт"
 sp_armored_advanced_flamethrower_tech_desc:0 "$advanced_flamethrower_desc$"
 sp_armored_lc_high_impact_obliterator_cannon_tech:0 "Пушка-облитератор с высоким воздействием"
 sp_armored_lc_high_impact_obliterator_cannon_tech_desc:0 "$lc_high_impact_obliterator_cannon_desc$"
 sp_armored_lc_naval_engine_conversion_tech:0 "Конверсия военно-морских двигателей"
 sp_armored_lc_naval_engine_conversion_tech_desc:0 "Использование военно-морских инженерных методов, таких как усиленные коленчатые валы, высококрутящие передачи и специализированные системы охлаждения, может повысить выходную мощность и долговечность двигателей Land крейсер, что позволяет им лучше управлять огромным весом и напряжением."
 sp_armored_lc_transmission_improvements_tech:0 "Улучшения передачи"
 sp_armored_lc_transmission_improvements_tech_desc:0 "Усовершенствованные передаточные числа, механизмы сцепления и преобразователи крутящего момента для создания более эффективных трансмиссий, способных обрабатывать чрезвычайную мощность и вес Land крейсеры, улучшая общую мобильность и уменьшая механическое напряжение."
 sp_armored_lc_specialized_field_manuals_tech:0 "Специализированные полевые руководства"
 sp_armored_lc_specialized_field_manuals_tech_desc:0 "Разработка подробных учебных пособий для экипажей Land крейсер, охватывающих уникальные оперативные процедуры, протоколы технического обслуживания и сложную тактику боя, необходимую для эффективного управления этими гигантскими военными машинами."
 sp_armored_lc_weapon_fire_control_tech:0 "Управление огнем с оружием"
 sp_armored_lc_weapon_fire_control_tech_desc:0 "Внедрение усовершенствованной оптики наведения, дальномеров и гироскопических стабилизаторов для повышения точности оружия и координации стрельбы, гарантируя, что пушки могут эффективно поражать цели, несмотря на их массивную отдачу и медленную маневренность."
 sp_armored_engineer_tech:0 "Компания Armored Engineer"
 sp_armored_engineer_tech_desc:0 "Объединяя инженерную экспертизу с бронезащитой, подразделения бронетехники специализируются на устранении препятствий и поддержке фронтовых наступлений под сильным огнем."
 sp_armored_maintenance_tech:0 "Бронетехническая компания"
 sp_armored_maintenance_tech_desc:0 "Использование бронированных восстановительных машин позволяет нашему обслуживающему персоналу восстанавливать и ремонтировать все виды техники, обеспечивая максимальную оперативную готовность на поле боя."
 sp_armored_signal_tech:0 "Компания Armored Signal"
 sp_armored_signal_tech_desc:0 "Оснащение наших подразделений командной техникой обеспечит надежную и безопасную связь на поле боя и координацию действий под броневой защитой."
 sp_armored_motorized_military_police_tech:0 "Моторная военная полиция"
 sp_armored_motorized_military_police_tech_desc:0 "Оснащенные военными мотоциклами, эти подразделения призваны поддерживать порядок за линиями, сопровождать конвои и вести патрулирование. Их скорость и подвижность позволяют быстро реагировать на сбои и при необходимости выполнять разведку в активных боевых зонах."
 sp_cluster_shells:0 "Кластерные оболочки"
 sp_cluster_shells_desc:0 "Кластерные снаряды рассеивают несколько суббоеприпасов на большой площади, максимизируя ущерб от вражеских войск и техники."
 sp_artillery_rocket_assisted_projectiles_tech:0 "Ракетные снаряды"
 sp_artillery_rocket_assisted_projectiles_tech_desc:0 "Усовершенствованные снаряды для сверхтяжелых гаубиц, предназначенные для увеличения дальности и улучшения удара с помощью ракетного двигателя."
 sp_artillery_purpose_built_gun_motor_carriages_tech:0 "Целенаправленные оружейные автомобильные перевозки"
 sp_artillery_purpose_built_gun_motor_carriages_tech_desc:0 "Специализированные транспортные средства, предназначенные для транспортировки и поддержки сверхтяжелых гаубиц, обеспечивая мобильность и легкость развертывания на поле боя."
 sp_multi_product_supply_ships:0 "Многопродукционное судно снабжения"
 sp_multi_product_supply_ships_desc:0 "С использованием вновь произведенных судов снабжения мы можем обеспечить более плавную передачу топлива, боеприпасов и припасов."
 sp_standard_tenshioned_replenishment_alongside_method:0 "Стандартизированное затормозившееся пополнение наряду с методом"
 sp_standard_tenshioned_replenishment_alongside_method_desc:0 "Стандартизованное пополнение на расстоянии рядом с методом или STREAM является дальнейшей эволюцией обеспечения устойчивого пополнения наших морских операций на дальних дистанциях."
 sp_aip_engine_improved_tech:0 "Двигатели AIP-Diesel Combination"
 sp_aip_engine_improved_tech_desc:0 "С дальнейшим усовершенствованием технологии AIP мы видим улучшение как с точки зрения производительности, так и расхода материала, используемого двигателями."
 sp_aip_engine_advanced_tech:0 "Высокоскоростные двигатели Уолтера"
 sp_aip_engine_advanced_tech_desc:0 "Наш опыт и понимание системы независимой от воздуха тяги позволили нам разработать современные двигатели. Тихий, быстрый и смертельный."
 sp_refined_pykrete:0 "Рафинированный Пикрете"
 sp_refined_pykrete_desc:0 "С дальнейшим усовершенствованием Pykrete мы теперь можем иметь гораздо лучшую изоляцию и защиту для наших самолетов на борту Ледового перевозчика."
 sp_ice_composite_runawayas:0 "Ледяные композитные взлетно-посадочные полосы"
 sp_ice_composite_runawayas_desc:0 "С развитием ледовых композитов мы ищем лучшие материалы и методы строительства, чтобы обеспечить защиту наших самолетов."
 heavy_battleship2:0 "Супертяжелый линкор II"
 heavy_battleship2_desc:0 "Улучшение нашего более раннего сверхтяжелого дизайна с более мощным оружием и улучшенными системами управления огнем."
 sp_shock_hardening_techniques:0 "Ударные техники"
 sp_shock_hardening_techniques_desc:0 "Используя различные методы удароустойчивости и уравнительные усилители для наших компонентов, мы снизили скорость преждевременных детонаций, что сделало наши снаряды более надежными и эффективными."
 sp_variable_time_fuze_shells:0 "Вариабельное время взрывает снаряды"
 sp_variable_time_fuze_shells_desc:0 "С адаптацией Variable Time Fuze Shells мы сделали нашу полевую артиллерию разрушительной против наших противников. Раковины взрываются до того, как достигают земли, создавая тем самым гораздо большую зону поражения."
 sp_helicopter_transport_pods_tech:0 "Вертолетная транспортная компания"
 sp_helicopter_transport_pods_tech_desc:0 "Вертолеты, оснащенные транспортными стручками или буксирующими товарами под ними на линии, могут перемещать припасы и оборудование быстро и без учета местности. Застрять в грязи - это уже в прошлом!"
 sp_helicopter_artillery_observers_tech:0 "Вертолётная разведывательная рота"
 sp_helicopter_artillery_observers_tech_desc:0 "Вертолеты могут получить хорошую точку обзора поля боя независимо от фактической местности и, таким образом, сделать отличные передовые разведчики, чтобы обеспечить точную обратную связь с артиллерийскими боеголовками."
 sp_helicopter_med_evac_tech:0 "Вертолет Med-Evac Company"
 sp_helicopter_med_evac_tech_desc:0 "Прибывшие ранены! Мы получили ранение! Вертолеты обеспечивают еще более быструю эвакуацию пострадавших, чем обычные машины скорой помощи."
 sp_rockets_dual_chamber_rocket_engine_1:0 "Двухкамерные ракетные двигатели"
 sp_rockets_dual_chamber_rocket_engine_1_desc:0 "Добавляя вторую камеру сгорания в двигатель, мы можем улучшить время полета и эффективность наших ракетных двигателей."
 sp_rockets_dual_chamber_rocket_engine_2:0 "Двухкамерные ракетные двигатели"
 sp_rockets_dual_chamber_rocket_engine_2_desc:0 "Дальнейшие усовершенствования двигателя с двойным двигателем внутреннего сгорания могут привести к еще большему повышению эффективности конструкции."
 reinforced_wings_mothership:0 "Укрепление материнских крыльев"
 reinforced_wings_mothership_desc:0 "Без своего материнского корабля истребители, по сути, застряли в воздухе, серьезно ограничивая их оперативную эффективность. Укрепление воздушных крыльев материнского корабля является наиболее экономически эффективной стратегией для повышения живучести всей эскадрильи."
 miniature_fighters:0 "Миниатюрные бойцы"
 miniature_fighters_desc:0 "Уменьшенные истребители позволят брать в бой больше машин без существенной потери огневой мощи и одновременно снизят нагрузку на самолёт-носитель."
 aerial_hangars:0 "Воздушные хангары"
 aerial_hangars_desc:0 "Воздушные гангары, прикрепленные к материнскому кораблю, позволяют разместить на верхней части самолета еще больше миниатюрных истребителей, что позволяет увеличить огневую мощь и дальнейшую досягаемость."
 mothership:0 "Корабль-мать"
 transport_planes_cat:0 "Транспортные самолёты"
