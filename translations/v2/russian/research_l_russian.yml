 modern_naval_mines_desc:0 "Эта высокоразвитая мина обнаруживает небольшие изменения давления воды, вызванные движением судна поблизости."
 degaussing:0 "Размагничивание"
 degaussing_desc:0 "Установка мощных электромагнитных катушек значительно уменьшает магнитную сигнатуру корабля, делая его гораздо менее уязвимым для магнитных мин."
 submarine_mine_laying:0 "Минеральная подводная лодка"
 submarine_mine_laying_desc:0 "Устанавливая специальное оборудование для удержания и выпуска мин, специально разработанная подводная лодка может развертывать мины во время погружения и, надеюсь, не обнаружена."
 improved_submarine_mine_laying:0 "Развертывание мин торпедной трубы"
 improved_submarine_mine_laying_desc:0 "Перепроектирование мин для укладки в торпедные аппараты позволяет любой подводной лодке стать минным заградителем, хотя и за счет перевозимых торпедов."
 airdrop_mines:0 "Воздушное минирование"
 airdrop_mines_desc:0 "Устанавливая мины с небольшим парашютом, их можно безопасно сбрасывать с самолетов, что позволяет быстро и эффективно создавать минные поля."
 airdrop_mines_bba:0 "$airdrop_mines$"
 airdrop_mines_bba_desc:0 "$airdrop_mines_desc$"
 airsweep_mines:0 "Воздушная минная зачистка"
 airsweep_mines_desc:0 "Самолеты могут быть оснащены специальным оборудованием для обнаружения и безопасного подрыва морских мин с воздуха."
 airsweep_mines_bba:0 "$airsweep_mines$"
 airsweep_mines_bba_desc:0 "$airsweep_mines_desc$"
 naval_mines:0 "Технологии Mine Warfare"
 concentrated_industry_category:0 "Концентрированные отраслевые технологии"
 dispersed_industry_category:0 "Технологии рассеянной промышленности"
 NAVAL_TITLE_ARMAMENT:0 "АРМАМЕНТЫ"
 NAVAL_TITLE_TORPEDOES:0 "торпеды"
 NAVAL_TITLE_DAMAGE_CONTROL:0 "Контроль над изображением"
 NAVAL_TITLE_FIRE_CONTROL:0 "Методы управления огнем"
 early_ship_hull_carrier:0 "Преобразования дек"
 early_ship_hull_carrier_short:0 "Преобразования дек"
 early_ship_hull_carrier_desc:0 "Преобразования старых корпусов позволяют дешево экспериментировать с морской авиацией, чтобы получить опыт в строительстве и эксплуатации авианосцев. Эти корабли будут менее способными, чем специально построенные носители, но гораздо быстрее создавать."
 cruiser_submarines:0 "Корпус крейсерской подводной лодки"
 midget_submarines:0 "Корпус сверхмалой подводной лодки"
 fleet_submarines:0 "Подводная лодка флота"
 coastal_defense_ships:0 "Корабли береговой обороны"
 pre_dreadnoughts:0 "Преддредноутовые корабли"
 basic_ship_hull_heavy:0 "1936 ф Тяжелый корабль Heavy корабль"
 basic_ship_hull_heavy_short:0 "1936 ф Тяжелый корабль Heavy корабль"
 basic_ship_hull_cruiser:0 "1936 Круизный корпус крейсер Hull"
 basic_ship_hull_carrier:0 "1936 ф Кэрриер Халл"
 basic_fire_control_system:0 "Базовая система управления огнем"
 basic_fire_control_system_desc:0 "Весь огонь корабельных орудий контролируется с центрального положения, что обеспечивает более плотную группировку выстрелов и повышает точность."
 improved_fire_control_system:0 "Улучшенная система управления огнем"
 improved_fire_control_system_desc:0 "Войдя в курс, скорость и расстояние до цели, механический компьютер может точно предсказать, где будет цель, когда следующий залп будет готов к стрельбе."
 advanced_fire_control_system:0 "Продвинутая система управления огнем"
 advanced_fire_control_system_desc:0 "Большой и сложный механический компьютер, который отслеживает большое количество входов как по цели, так и по огневым кораблям, а также погодные условия и состояние моря, позволяет очень точные баллистические расчеты."
 sonar:0 "Пассивный сонар"
 sonar_desc:1 "Базовый набор гидрофонов позволяет отслеживать подводные цели путем обнаружения звука, который они издают.\n\nУстанавливая этот модуль в §YЭлектронный слот§! на §YСветлые корабли§! или §Yкрейсеры§! Помогает обнаружить врага §YПодводные лодки§!."
 improved_sonar:0 "Активный сонар"
 improved_sonar_desc:1 "Используя модулированные звуковые волны, эта система может точно измерять подшипник и расстояние до погруженной цели.\n\nУстанавливая этот модуль в §YЭлектронный слот§! на §YСветлые корабли§! или §Yкрейсеры§! Помогает обнаружить врага §YПодводные лодки§!."
 smoke_generator:0 "Генераторы дыма"
 smoke_generator_desc:0 "Некоторые незначительные модификации двигателей и дымовых труб легкого и среднего кораблей позволяют им производить много дыма, чтобы избежать или разорвать контакт с противником."
 depth_charges_advice_tt:0 "\nСверкающий а §YГлубинная зарядка§! модуль на §YСветлые корабли§! и §Yкрейсеры§! Это позволит им атаковать противника. §YПодводные лодки§!."
 sonar_advice_tt:0 "\nСверкающий а §YСонар§! модуль на §YСветлые корабли§! и §Yкрейсеры§! Это позволит им обнаружить врага. §YПодводные лодки§!."
 basic_depth_charges:0 "Базовые глубинные заряды"
 basic_depth_charges_desc:1 "Простой взрывоопасный контейнер с чувствительным к давлению триггером взрывается, когда он попадает на заданную глубину.\n\nУстановить этот модуль на §YСветлые корабли§! и §Yкрейсеры§! Это позволит им атаковать противника. §YПодводные лодки§!."
 improved_depth_charges:0 "Depth Charge Thrower скачать"
 improved_depth_charges_desc:1 "Простое механическое устройство, которое выбрасывает глубинный заряд на заданное расстояние от корабля. Это означает, что эсминец больше не должен ехать прямо через цель, чтобы поразить ее.\n\nУстановить этот модуль на §YСветлые корабли§! и §Yкрейсеры§! Это позволит им атаковать противника. §YПодводные лодки§!."
 advanced_depth_charges:0 "Глубина заряда миномета"
 advanced_depth_charges_desc:1 "Миномет на борту эсминца может бросить взрывной заряд гораздо дальше, что позволяет кораблю поддерживать гидролокаторный контакт с подводной лодкой на протяжении всей атаки и резко повысить ее точность.\n\nУстановить этот модуль на §YСветлые корабли§! и §Yкрейсеры§! Это позволит им атаковать противника. §YПодводные лодки§!."
 modern_depth_charges:0 "Усовершенствованный миномет Depth Charge"
 modern_depth_charges_desc:1 "Более крупный заряд топлива бросает надлежащий глубинный заряд, установленный на определенную глубину на подводной лодке с большого расстояния.\n\nУстановить этот модуль на §YСветлые корабли§! и §Yкрейсеры§! Это позволит им атаковать противника. §YПодводные лодки§!."
 improved_airplane_launcher:0 "Улучшенная катапульта самолета"
 improved_airplane_launcher_desc:1 "Улучшенный пневматический механизм позволяет запускать гораздо более крупные самолеты с помощью катапульты. Это увеличивает радиус поиска.\n\nУстановить этот модуль на §Yкрейсеры§!, §YТяжелые корабли§! или специализированный §YПодводные лодки§! Улучшает их способность обнаруживать вражеские корабли."
 airplane_launcher_advice_tt:0 "\nСверкающий а §Yкатапульта§! модуль на §Yкрейсеры§!, §YТяжелые корабли§! или специализированный §YПодводные лодки§! Улучшает их способность обнаруживать вражеские корабли."
 cruiser_armor_advice_tt:0 "\nСкачивать лучше §YБроня§! модуль на §Yкрейсеры§! Улучшает их способность выдерживать повреждения."
 heavy_armor_advice_tt:0 "\nСкачивать лучше §YБроня§! модуль на §YТяжелые корабли§! Улучшает их способность выдерживать повреждения.§YЛинкоры§! и §YЛинейные крейсеры§! определяются их различными §YСхемы брони§!Броненосцы обычно имеют худшую броню."
 basic_cruiser_armor_scheme:0 "Основная схема крейсер броня"
 basic_cruiser_armor_scheme_desc:1 "Броневая схема, которая копирует разделение между поясом и палубной броней, наблюдаемое в Capital Ships, и предлагает некоторую защиту от осколков и мелкокалиберных орудий.\n\nУстановить этот модуль на §Yкрейсеры§! Улучшает их способность §YУстойчивы к вражеским повреждениям§!, но и §Rуменьшать§! их §Yскорость§!."
 improved_cruiser_armor_scheme:0 "Схема бронирования Belt крейсер броня"
 improved_cruiser_armor_scheme_desc:1 "Размещая броню пояса под углом, такой же вес и толщину брони гораздо труднее пробить.\n\nУстановить этот модуль на §Yкрейсеры§! Улучшает их способность §YУстойчивы к вражеским повреждениям§!, но и §Rуменьшать§! их §Yскорость§!."
 advanced_cruiser_armor_scheme:0 "Схема бронирования All-or-Nothing"
 advanced_cruiser_armor_scheme_desc:1 "Эта схема направлена только на защиту наиболее жизненно важных участков корабля, при этом игнорируя неважные части.\n\nУстановить этот модуль на §Yкрейсеры§! Улучшает их способность §YУстойчивы к вражеским повреждениям§!, но и §Rуменьшать§! их §Yскорость§!."
 basic_heavy_armor_scheme:0 "Схема бронирования Belt броня"
 basic_heavy_armor_scheme_desc:1 "Размещая броню пояса под углом, такой же вес и толщину брони гораздо труднее пробить.\n\nУстановить этот модуль на §YТяжелые корабли§! Улучшает их способность §YУстойчивы к вражеским повреждениям§!. §YЛинкоры§! и §YЛинейные крейсеры§! определяются их различными §YСхемы брони§!."
 improved_heavy_armor_scheme:0 "Схема All-or-Nothing"
 improved_heavy_armor_scheme_desc:1 "Эта схема направлена только на защиту наиболее жизненно важных участков корабля, при этом игнорируя неважные части.\n\nУстановить этот модуль на §YТяжелые корабли§! Улучшает их способность §YУстойчивы к вражеским повреждениям§!. §YЛинкоры§! и §YЛинейные крейсеры§! определяются их различными §YСхемы брони§!."
 torpedo_advice_tt:0 "\nгорный §YТорпедные пусковые установки§! на §YСветлые корабли§! или §Yкрейсеры§! позволяет нанести противнику значительный ущерб §YКрупные корабли§! в §YСражение§! Если они могут победить врага §YСкрининговая группа§!."
 basic_torpedo:0 "Основная торпеда"
 basic_torpedo_desc:1 "Самодвижущееся оружие со взрывоопасной боеголовкой, которое движется по заранее определенному курсу, пока не достигнет цели ниже ватерлинии.\n\nУстановить этот модуль на §YСветлые корабли§! или §Yкрейсеры§! позволяет нанести противнику значительный ущерб §YКрупные корабли§!."
 magnetic_detonator:0 "Магнитный детонатор"
 magnetic_detonator_desc:0 "Новый детонатор обнаруживает сдвиг магнитного поля Земли, когда торпеда проходит под мишенью. Взрыв непосредственно под кораблем наносит гораздо больший урон и часто ломает киль цели, мгновенно потопив ее."
 homing_torpedo:0 "Горячая Торпеда"
 homing_torpedo_desc:0 "Оснащённая акустическим датчиком торпеда может наводиться на самый мощный источник шума впереди — обычно это и есть цель."
 electric_torpedo:0 "Электрическая торпеда"
 electric_torpedo_desc:0 "Вместо того, чтобы оставлять легко обнаруживаемый след из пузырей, торпеда с электрическим двигателем остается практически невидимой, пока она не ударит. Это также означает, что нет никакого следа, ведущего назад к пусковой подводной лодке."
 improved_ship_torpedo_launcher:0 "Усовершенствованный корабельный торпедный ракетоносец"
 improved_ship_torpedo_launcher_desc:1 "Более сильные двигатели позволяют устанавливать больше труб в одном креплении и быстрее обучаться на цели.\n\nУстановить этот модуль на §YСветлые корабли§! или §Yкрейсеры§! позволяет нанести противнику значительный ущерб §YКрупные корабли§!."
 advanced_ship_torpedo_launcher:0 "Усовершенствованный корабельный торпедоносец"
 advanced_ship_torpedo_launcher_desc:1 "Трубы большего диаметра позволяют использовать более крупные торпеды с более тяжелыми боеголовками.\n\nУстановить этот модуль на §YСветлые корабли§! или §Yкрейсеры§! позволяет нанести противнику значительный ущерб §YКрупные корабли§!."
 modern_ship_torpedo_launcher:0 "Современный корабельный торпедоносец"
 modern_ship_torpedo_launcher_desc:1 "Мощные воздушные заряды позволяют запускать более тяжелые торпеды на более высоких скоростях.\n\nУстановить этот модуль на §YСветлые корабли§! или §Yкрейсеры§! позволяет нанести противнику значительный ущерб §YКрупные корабли§!."
 snorkel_advice_tt:0 "\nгорный §YСноркельс§! на §YПодводные лодки§! резко сокращает их §Yвидимость§!Это делает их более трудными для наблюдения за вражескими кораблями и борьбы с ними."
 basic_submarine_snorkel:0 "Основная подводная лодка Snorkel"
 basic_submarine_snorkel_desc:1 "Простая воздушная трубка, идущая от машинного отделения до диспетчерской вышки. Расширенный, он позволяет подводной лодке запускать свои двигатели и заряжать их, пока она еще погружена в воду.\n\nУстановить этот модуль на §YПодводные лодки§! уменьшают их §Yвидимость§!Это затрудняет их обнаружение."
 improved_submarine_snorkel:0 "Улучшенная подводная лодка Snorkel"
 improved_submarine_snorkel_desc:1 "Улучшенная конструкция предотвращает всасывание воды в двигатели, а также уменьшает радиолокационное эхо головы подводного плавания.\n\nУстановить этот модуль на §YПодводные лодки§! уменьшают их §Yвидимость§!Это затрудняет их обнаружение."
 light_battery_advice_tt:0 "\n\nгорный §YЛегкая батарея§! модулей на §YСветлые корабли§! и §Yкрейсеры§! Улучшить их §YЛегкая пушка атака§!Помогает в уничтожении врага §YКорабли охранения§!. §YЛегкие батареи§! Как правило, плохо справляются с бронированными кораблями, такими как: §Yкрейсеры§! и §YТяжелые корабли§!"
 medium_battery_advice_tt:0 "\n\nгорный §YЛегкая средняя батарея§! или §YСредняя батарея§! модулей на §Yкрейсеры§! Улучшить их §YЛегкая пушка атака§! или §YТяжелое артиллерийское нападение§!Позволяет им сражаться с врагом §YКорабли охранения§! или §YКрупные корабли§!. Скачивание любого §YСредняя батарея§! Судно будет обозначено как §YТяжелый крейсер§!При этом, монтируя только §YЛегкая средняя батарея§! Судно будет обозначено как §YЛегкий крейсер§!."
 heavy_battery_advice_tt:0 "\n\nгорный §YТяжелая батарея§! Модули увеличивают a §YТяжелый корабль§!? §YТяжелое артиллерийское нападение§!Позволяет ему вступать в бой и уничтожать врага §YКрупные корабли§!. §YТяжелые батареи§! Как правило, плохо работают против небольших сосудов, таких как: §YСветлые корабли§! и §YЛёгкие крейсеры§!."
 basic_battery:0 "Морская артиллерия"
 basic_battery_desc:0 "Базовая конструкция для учебной и высотной механики морских орудий."
 basic_light_battery:0 "Базовая батарея Light Battery"
 basic_light_battery_desc:1 "Открытая установка для пушки малого калибра для использования на небольших судах.\n\nМонтаж этого модуля увеличивается §YЛегкая пушка атака§!Помогает в борьбе с врагом §YСкриншоты Ships§!."
 improved_light_battery:0 "Улучшенная легкая батарея"
 improved_light_battery_desc:1 "Закрытая силовая установка для малокалиберной пушки дает экипажу некоторую защиту от элементов и осколков снарядов.\n\nМонтаж этого модуля увеличивается §YЛегкая пушка атака§!Помогает в борьбе с врагом §YСкриншоты Ships§!."
 advanced_light_battery:0 "Продвинутая батарея Light Battery"
 advanced_light_battery_desc:1 "Усовершенствованная двойная установка обеспечивает значительно большую огневую мощь под броневой защитой.\n\nМонтаж этого модуля увеличивается §YЛегкая пушка атака§!Помогает в борьбе с врагом §YСкриншоты Ships§!."
 basic_light_shell:0 "Малокалиберный полубронебойный пирсинг Shell"
 basic_light_shell_desc:0 "Компромисс между бронебойными характеристиками и взрывной мощью, этот снаряд наносит значительно больший урон после пробивания через слабую броню легких кораблей."
 improved_light_shell:0 "Малокалиберная бронебойная раковина"
 improved_light_shell_desc:0 "Правильный бронебойный снаряд для пушек малого калибра дает эсминцам и другим легким кораблям боевой шанс против бронированных противников."
 basic_medium_battery:0 "Базовая средняя батарея"
 basic_medium_battery_desc:1 "Башня с двумя или тремя орудиями среднего калибра для использования на крейсерах.\n\nСверкающий а §YЛегкая средняя батарея§! Модуль увеличивается §YЛегкая пушка атака§!Помогает в борьбе с врагом §YСкриншоты Ships§!. Сверкающий а §YСредняя батарея§! Модуль увеличивается §YТяжелое артиллерийское нападение§!Помогает в борьбе с врагом §YКрупные корабли§!."
 improved_medium_battery:0 "Улучшенная средняя батарея"
 improved_medium_battery_desc:1 "Улучшенная компоновка башни позволяет быстрее загружать, в то время как лучшая броня улучшает живучесть.\n\nСверкающий а §YЛегкая средняя батарея§! Модуль увеличивается §YЛегкая пушка атака§!Помогает в борьбе с врагом §YСкриншоты Ships§!. Сверкающий а §YСредняя батарея§! Модуль увеличивается §YТяжелое артиллерийское нападение§!Помогает в борьбе с врагом §YКрупные корабли§!."
 advanced_medium_battery:0 "Расширенная средняя батарея"
 advanced_medium_battery_desc:1 "Интегрируя погрузку и дистанционное управление питанием, современные крейсеры могут достигать скорости стрельбы и точности, которые до сих пор считались невозможными.\n\nСверкающий а §YЛегкая средняя батарея§! Модуль увеличивается §YЛегкая пушка атака§!Помогает в борьбе с врагом §YСкриншоты Ships§!. Сверкающий а §YСредняя батарея§! Модуль увеличивается §YТяжелое артиллерийское нападение§!Помогает в борьбе с врагом §YКрупные корабли§!."
 basic_medium_shell:0 "Бронебойная капельная средняя раковина"
 basic_medium_shell_desc:0 "Устанавливая баллистический капот, снаряды могут быть сделаны более аэродинамическими, сохраняя при этом свои бронебойные характеристики."
 improved_medium_shell:0 "Средний калибр полубронебойной оболочки"
 improved_medium_shell_desc:0 "Компромисс между бронебойными характеристиками и взрывной мощью, этот снаряд наносит значительно больший урон после пробивания через слабую броню легких кораблей."
 basic_heavy_battery:0 "Основная тяжелая батарея"
 basic_heavy_battery_desc:1 "Гигантская башня, в которой размещены массивные пушки под тяжелой броней.\n\nСверкающий а §YТяжелая батарея§! Модуль увеличивает размер корабля §YТяжелое артиллерийское нападение§!Повышение эффективности против врага §YКрупные корабли§!."
 improved_heavy_battery:0 "Улучшенная тяжелая батарея"
 improved_heavy_battery_desc:1 "Мощные молотки увеличивают скорость загрузки тяжелых орудий, в то время как автоматические герметичные двери улучшают безопасность.\n\nСверкающий а §YТяжелая батарея§! Модуль увеличивает размер корабля §YТяжелое артиллерийское нападение§!Повышение эффективности против врага §YКрупные корабли§!."
 advanced_heavy_battery:0 "Продвинутая тяжелая батарея"
 advanced_heavy_battery_desc:1 "Улучшенные механизмы снижения отдачи и катушки задержки уменьшают помехи снарядов в полете и резко повышают точность.\n\nСверкающий а §YТяжелая батарея§! Модуль увеличивает размер корабля §YТяжелое артиллерийское нападение§!Повышение эффективности против врага §YКрупные корабли§!."
 basic_heavy_shell:0 "Бронебойная обшивка"
 basic_heavy_shell_desc:0 "Устанавливая баллистический капот, снаряды могут быть сделаны более аэродинамическими, сохраняя при этом свои бронебойные характеристики."
 improved_heavy_shell:1 "Супертяжелая бронебойная раковина"
 improved_heavy_shell_desc:0 "Эти массивные снаряды, весящие более тонны, наносят удар с беспрецедентной силой и представляют серьезную угрозу даже для самой тяжелой брони."
 secondary_battery_advice_tt:0 "\nА. §YВторичная батарея§! разрешать §Yкрейсеры§! и §YТяжелые корабли§! Вступая в бой с врагом §YСкриншоты Ships§! как вторичные цели, нанося ущерб другой цели."
 basic_secondary_battery:0 "Казематная вспомогательная батарея"
 basic_secondary_battery_desc:1 "Размещенные в отверстиях вдоль корпуса, эти меньшие пушки дают кораблю некоторую защиту от небольших кораблей, но имеют ограниченное поле огня.\n\nСверкающий а §YВторичная батарея§! Модуль дает §Yкрейсер§!, §Yперевозчик§!или §YТяжелый корабль§! Небольшое количество §YЛегкая пушка атака§! Это позволяет ему поражать вторую цель."
 improved_secondary_battery:0 "Вторичная батарея Turreted"
 improved_secondary_battery_desc:1 "Помещая вторичные орудия в силовые башенки, они получают гораздо более широкое поле огня за счет большего веса и снижения устойчивости в тяжелых морях.\n\nСверкающий а §YВторичная батарея§! Модуль дает §Yкрейсер§!, §Yперевозчик§!или §YТяжелый корабль§! Небольшое количество §YЛегкая пушка атака§! Это позволяет ему поражать вторую цель."
 dp_secondary_battery:0 "Двухцелевая вторичная батарея"
 dp_secondary_battery_desc:1 "Сочетание противокорабельных и зенитных орудий в одном креплении позволяет обеспечить большую гибкость и экономит вес.\n\nСверкающий а §YВторичная батарея§! Модуль дает §Yкрейсер§!, §Yперевозчик§!или §YТяжелый корабль§! Небольшое количество §YЛегкая пушка атака§! Это позволяет ему поражать вторую цель. Данный модуль также увеличивает §YПротивовоздушная атака§!."
 damage_control_1:0 "Снаряды для борьбы с огнем"
 damage_control_1_desc:0 "Каждый член экипажа судна, от капитана до простого моряка, должен быть в состоянии помочь в сдерживании и борьбе с пожарами на борту корабля."
 damage_control_2:0 "Отдельные пожарные машины"
 damage_control_2_desc:0 "Разделив основные водные линии вокруг корабля, вероятность попадания, что делает корабль полностью неспособным бороться с пожарами, значительно снижается."
 damage_control_3:0 "Дизельные аварийные насосы"
 damage_control_3_desc:0 "С тяжелыми насосами, обычно зависящими от основных двигателей для питания, однократное и довольно легкое попадание в машинное отделение может сделать корабль неспособным оставаться на плаву."
 fire_control_methods_1:0 "Стрельба по брекетам"
 fire_control_methods_1_desc:0 "Чтобы поразить цель, первым шагом является стрельба из нескольких орудий за один раз, пока удары не ударят по обеим сторонам цели."
 fire_control_methods_2:0 "Стрельба по лестницам"
 fire_control_methods_2_desc:0 "Вместо того, чтобы стрелять по цели и терять след от ударов позади вражеского корабля, выстрелы намеренно сбрасываются за пределы цели, а расстояние между ударом и целью измеряется для определения дальности."
 fire_control_methods_3:0 "Shell Dyes"
 fire_control_methods_3_desc:0 "Добавление небольших цветных пакетов к снарядам при их выстреле окрашивает удары вокруг цели и позволяет нескольким кораблям поражать одну и ту же цель, не путаясь друг с другом."
 fuel_silos:0 "Хранение топлива"
 fuel_silos_desc:0 "Массовое хранение топлива требует сложного набора резервуаров, труб и клапанов, чтобы обеспечить его безопасность и доступность."
 fuel_refining:0 "Топливоочиститель I"
 fuel_refining_desc:0 "Достижения в химическом растрескивании позволяют повысить выход легкого топлива из нефти."
 fuel_refining2:0 "Топливная переработка II"
 fuel_refining2_desc:0 "Лучшее планирование макетов НПЗ уменьшает потери топлива."
 fuel_refining3:0 "Топливоочистка III"
 fuel_refining3_desc:0 "Улучшенные методы рекультивации позволяют перерабатывать топливо из побочных продуктов."
 fuel_refining4:0 "Топливоочистка IV"
 fuel_refining4_desc:0 "Новые разработки в области химического машиностроения позволяют перерабатывать топливо из новых источников."
 fuel_refining5:0 "Топливная рафинация V"
 fuel_refining5_desc:0 "Использование новых методов и улучшенных макетов при строительстве НПЗ резко увеличивает пропускную способность при сокращении потерь."
 scout_plane1:0 "Самолёт-разведчик I"
 scout_plane1_desc:0 "Сбор разведданных о передвижениях войск противника и предоставление сообщений о развертывании военно-морских сил противника были первоначальной миссией для самолетов с момента их первого развертывания в Великой войне, и по-прежнему являются важной миссией."
 scout_plane2:0 "Самолёт-разведчик II"
 scout_plane2_desc:0 "Разрабатывая специализированные самолеты для воздушного наблюдения и разведки дальнего радиуса действия, мы гарантируем получение и поддержание точной картины намерений и возможностей нашего противника."
 SURRENDER_REDUCTION_TOOLTIP:0 "Сотрудничество в $COUNTRY|H$ Снизить уровень капитуляции путем $VALUE|+%.0$"
 COLLABORATION_EFFECTS_TOOLTIP:0 "У тебя есть $COLLABORATION|+%.0$ сотрудничество в $COUNTRY|H$. Это позволит снизить уровень капитуляции. $SURRENDER|+%.0$ и будет отдавать $COMPLIANCE|+%.0$ соответствие, когда противник капитулирует, которое будет использоваться для разблокировки дополнительных модификаторов соответствия."
 COLLABORATION_EFFECTS_OTHER_SIDE_TOOLTIP:0 "$OTHER_COUNTRY|H$ иметь $COLLABORATION|+%.0$ сотрудничество в $COUNTRY|H$. Это позволит сократить $COUNTRY|H$Уровень капитуляции по $SURRENDER|+%.0$ и будет отдавать $COMPLIANCE|+%.0$ соответствие, когда противник капитулирует, которое будет использоваться для разблокировки дополнительных модификаторов соответствия."
