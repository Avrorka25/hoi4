 RESEARCH_REPLACE_TITLE:0 "Заменить исследование"
 RESEARCH_REPLACE_DESC:0 "Вы уверены, что хотите исследовать §Y$NEW_TECH$§! вместо того, чтобы §Y$OLD_TECH$§! с §Y$PROGRESS|%0$§! Прогресс?"
 RESEARCH_REPLACE_TRANSFER:0 "\n$SAVED|H0$ дн. ранее накопленных исследований будет перенесено в новую технологию."
 RESEARCH_REPLACE_EXCLUSIVE_TITLE:0 "Заменить взаимоисключающие исследования"
 RESEARCH_REPLACE_EXCLUSIVE_DESC:0 "Вы уверены, что хотите исследовать §Y$NEW_TECH$§! вместо того, чтобы §Y$OLD_TECH$§! и всех его подтехнологий?"
 RESEARCH_EXCLUSIVE_INFO_TITLE_TOOLTIP:0 "§RТехнология является взаимоисключающей с:§!"
 RESEARCH_DOCTRINE_EXCLUSIVE_INFO_TITLE_TOOLTIP:0 "§RДоктрина является взаимоисключающей с:§!"
 RESEARCH_EXCLUSIVE_INFO_DESC:0 "Взаимоисключительно с"
 RESEARCH_EXCLUSIVE_INFO_ENTRY:0 "$TECH|Y$"
 RESEARCH_YEAR_AHEAD_PENALTY_NO_VALUE:0 "§RТехнология это $YEARS|2$ на годы раньше времени. Чем больше впереди, тем больше штраф за время.§!"
 RESEARCH_YEAR_AHEAD_PENALTY:1 "§RТехнология это $YEARS|2$ на несколько лет вперед (+)$VALUE|%0$). С течением времени штраф будет снижаться.§!"
 RESEARCH_YEAR_AHEAD_PENALTY_RED:2 "§RТехнология это $YEARS|2$ на несколько лет вперед (+)$VALUE|%0$), но досрочное наказание было уменьшено на $REDUCED_YEARS|.1$ лет (+)$RED|%0$) в силу национальных приоритетов. С течением времени штраф будет снижаться.§!"
 RESEARCH_TECH_UNUSED:1 "§GНажмите, чтобы начать исследование§!\nВ течение 56 дней можно выбрать новую область исследования без потери накопленного времени."
