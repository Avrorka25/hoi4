 cat_ship_medium_battery:0 "Средние батареи"
 cat_ship_heavy_battery:0 "Тяжелые батареи"
 masterful_blitz:0 "Мастер-блиц"
 masterful_blitz_desc:0 "Возможно, мы не изобрели блицкриг, но мы разработаем и доработаем эту стратегию так, чтобы даже самые укрепленные линии обороны противника не смогли остановить наступление нашей славной армии."
 penal_infantry:0 "Пенитенциарные батальоны"
 penal_infantry_desc:0 "Пенитенциарные батальоны дают возможность осужденным солдатам и офицерам Красной Армии истекать кровью за Родину и искупать себя за позорные или бесчестные действия, совершенные в прошлом."
 camicie_nere_security_militias:0 "$ITA_camicie_nere$"
 blackshirt_assault_battalion_tech:0 "$blackshirt_assault_battalion$"
 mountain_warfare_militias_tech:0 "$ITA_grande_rivolta_rurale$"
 basic_dp_light_battery:0 "Базовая двухцелевая батарея"
 basic_dp_light_battery_desc:0 "Сочетание противокорабельных и зенитных орудий в одном креплении позволяет обеспечить большую гибкость и экономит вес.\n\nМонтаж этого модуля увеличивается §Y$EQUIPMENT_DESIGNER_LG_ATTACK_ICON_TOOLTIP$§!Помогает в борьбе с врагом §YСкриншоты Ships§!. Кроме того, эти модули увеличивают §Y$EQUIPMENT_DESIGNER_ANTI_AIR_ATTACK_ICON_TOOLTIP$§!.\nСверкающий а §YВторичная батарея§! Модуль дает §Y$ship_hull_cruiser$§!, §Y$ship_hull_carrier$§!или §Y$ship_hull_heavy$§! Небольшое количество §Y$EQUIPMENT_DESIGNER_LG_ATTACK_ICON_TOOLTIP$§! Это позволяет ему поражать вторую цель."
 improved_dp_light_battery:0 "Улучшенная двухцелевая батарея"
 improved_dp_light_battery_desc:0 "Полностью закрытые крепления Twin значительно увеличивают огневую мощь и защиту, экономя при этом вес.\n\nМонтаж этого модуля увеличивается §Y$EQUIPMENT_DESIGNER_LG_ATTACK_ICON_TOOLTIP$§!Помогает в борьбе с врагом §YСкриншоты Ships§!. Кроме того, эти модули увеличивают §Y$EQUIPMENT_DESIGNER_ANTI_AIR_ATTACK_ICON_TOOLTIP$§!. \nСверкающий а §YВторичная батарея§! Модуль дает §Y$ship_hull_cruiser$§!, §Y$ship_hull_carrier$§!или §Y$ship_hull_heavy$§! Небольшое количество §Y$EQUIPMENT_DESIGNER_LG_ATTACK_ICON_TOOLTIP$§! Это позволяет ему поражать вторую цель."
 advanced_dp_light_battery:0 "Продвинутая двухцелевая батарея"
 advanced_dp_light_battery_desc:0 "Автоматизированные огневые огражденные артиллерийские установки значительно увеличивают огневую мощь.\n\nМонтаж этого модуля увеличивается §Y$EQUIPMENT_DESIGNER_LG_ATTACK_ICON_TOOLTIP$§!Помогает в борьбе с врагом §YСкриншоты Ships§!. Кроме того, эти модули увеличивают §Y$EQUIPMENT_DESIGNER_ANTI_AIR_ATTACK_ICON_TOOLTIP$§!. \nСверкающий а §YВторичная батарея§! Модуль дает §Y$ship_hull_cruiser$§!, §Y$ship_hull_carrier$§!или §Y$ship_hull_heavy$§! Небольшое количество §Y$EQUIPMENT_DESIGNER_LG_ATTACK_ICON_TOOLTIP$§! Это позволяет ему поражать вторую цель."
 basic_dp_medium_battery:0 "Усовершенствованная двухцелевая батарея среднего назначения"
 basic_dp_medium_battery_desc:0 "Автоматическая загрузка Быстрый огонь Средние закрытые пушки Батарейки значительно увеличивают огневую мощь.\n\nСверкающий а §YЛегкая средняя батарея§! Модуль увеличивается §Y$EQUIPMENT_DESIGNER_LG_ATTACK_ICON_TOOLTIP$§!Помогает в борьбе с врагом §YСкриншоты Ships§!. Данный модуль также увеличивает §Y$EQUIPMENT_DESIGNER_ANTI_AIR_ATTACK_ICON_TOOLTIP$§!."
 armored_train:0 "$train_equipment_3$"
 railway_gun:0 "$railway_gun_equipment_1$"
 basic_train:0 "$train_equipment_1$"
 special_forces_doctrine:0 "Доктрина спецназа"
 special_forces_doctrine_folder:0 "Доктрина спецназа"
 special_forces_doctrine_folder_desc:0 "Как обучаются наши спецназовцы."
 MOUNTAINEERS_DOCTRINE_LABEL:0 "горцы"
 MARINES_DOCTRINE_LABEL:0 "Морская пехота"
 PARATROOPERS_DOCTRINE_LABEL:0 "Воздушно-десантные войска"
 MOUNTAINEERS_DOCTRINE_DESC:0 "Сильное военное сосредоточение на полках, привыкших к неблагоприятной местности, даст нам преимущество в перехитринии и отрицании наших противников."
 MARINES_DOCTRINE_DESC:0 "Возвышенный корпус морской пехоты гарантирует, что ни одна береговая линия противника не будет безопасной. Наши элитные морские пехотинцы отлично справляются с огнем в самых неприятных ситуациях."
 PARATROOPERS_DOCTRINE_DESC:0 "Воздушно-десантное нападение — это будущее войны. Подъем десантников обеспечивает нам идеальную синергию между воздушным и наземным ударами."
 RANGERS_DOCTRINE_LABEL:0 "Рейнджеры"
 RANGERS_DOCTRINE_DESC:0 "Имея возможность действовать большими силами в густо лесистых районах, наша армия может обойти и перехитрить силы противника."
 special_forces_mountaineers:0 "Поднимите горцев"
 special_forces_mountaineers_desc:0 "Неблагоприятная обстановка и ожесточенные конфликты привлекают в наши элитные силы самых жестких солдат. Закрепление их первенства в нашей доктринальной философии гарантирует, что мы будем продолжать извлекать выгоду из набора самых лучших."
 special_forces_paratroopers:0 "Поднять десантников"
 special_forces_paratroopers_desc:0 "Нет ничего более ужасающего, чем темное небо с видом тысячи транспортных самолетов, заполненных войсками. Наша доктринальная философия должна воспользоваться шоком и благоговением, которые прививают нам воздушные корабли."
 special_forces_marines:0 "Возвысить морскую пехоту"
 special_forces_marines_desc:0 "Корпус морской пехоты служит там, куда никто другой не осмеливается идти. От родного берега до иностранного впадина, эти эксперты преуспевают в инфильтрации и земноводном бою. Широкий охват и гибкая философия должны стать основой нашей военной доктрины."
 special_forces_rangers:0 "Поднимите рейнджеров"
 special_forces_rangers_desc:0 "Легкая пехота — ключ к нашему успеху. Традиции снайперов и тактика проникновения должны стать основой для создания элитных формирований."
 ski_troops:0 "Специалисты по холодной погоде"
 ski_troops_desc:0 "Специалисты по холодной погоде имеют жизненно важное значение для нашей тактики боя. Формально признавая этих экспертов в нашей военной конституции, мы можем высвободить ресурсы и подготовку, чтобы еще больше их поднять."
 special_forces_recon:0 "Battlefield Intelligence"
 special_forces_recon_desc:0 "Наши элитные полки выигрывают от контрразведки и боевой осведомленности, не уступающей никому. Дополнительная подготовка, несомненно, принесет нам еще большую пользу."
 mountaineers_combat_1:0 "Держать линию"
 mountaineers_combat_1_desc:0 "Наши элитные силы должны сосредоточить свои усилия на удержании территорий, в которых они специализируются. Сочетание тактики засады и улучшенной полковой организации гарантируют, что наши спецназовцы будут представлять значительную оборону против вторгшихся сил."
 mountaineers_combat_2:0 "Горная артиллерия"
 mountaineers_combat_2_desc:0 "Горные артиллерийские полки — это специализированные силы, предназначенные для быстрой поддержки наших элитных дивизий на большой дальности, прошедшие подготовку и действовавшие в труднопроходимой местности. Их присутствие значительно повышает боевые возможности нашего спецназа."
 mountaineers_combat_3:0 "Тренировка комбинированного оружия"
 mountaineers_combat_3_desc:0 "Хотя наши элитные полки действуют на очень независимой основе, увеличение их тренировочного режима с акцентом на операции с комбинированным вооружением увеличивает их полезность на местах."
 mountaineers_keystone_1:0 "Основы Вооруженных Сил"
 mountaineers_keystone_1_desc:0 "Успех наших элитных спецназовцев требует реорганизации нашей военной философии вокруг их присутствия."
 mountaineers_keystone_2:0 "Общие инструкторы"
 mountaineers_keystone_2_desc:0 "Зная, что наши горные войска приобрели, было бы глупо не использовать это в других частях нашего спецназа. Мы введем программу ротации инструкторов в надежде на улучшение наших общих институциональных знаний."
 paras_dispersed_drop:0 "Разведка и саботаж"
 paras_dispersed_drop_desc:0 "Характер наших операций требует, чтобы наши воздушно-десантные войска специализировались на высокодисперсных воздушных каплях, что позволяет проводить значительные диверсии до того, как противник узнает о нашем присутствии."
 paras_combat_drop:0 "Боевое включение"
 paras_combat_drop_desc:0 "Несмотря на опасность, обучение наших элитных сил методам прямого принудительного входа может дать нам значительные боевые преимущества в сочетании с обычным нападением."
 SF_PARAS_combat_effect_tt:0 "Вражеские разногласия в государствах, в которых мы §Hпарашют§! У них будет свой текущий §HОрганизация§! уменьшенный.\n\n$PARA_EFFECT_TIMER$"
 SF_PARAS_sabotage_effect_tt:0 "Контролируемые нами государства §Hпарашют§! В противном случае он получит ущерб §HВоенные заводы§!, §HГражданские заводы§!и §Hинфраструктура§!.\n\n$PARA_EFFECT_TIMER$"
 PARA_EFFECT_TIMER:0 "Этот эффект может произойти один раз в каждом штате. §H30§! дней."
 paras_airborne_light_armor:0 "Броня ВДВ"
 paras_airborne_light_armor_desc:0 "Некоторые легкие танки могут быть адаптированы для воздушно-десантного сброса с помощью тяжелого планера. Этот новый метод боевой вставки может быть нишевым, но предоставляет нам новые возможности."
 paras_bonus_2:0 "Стратегический корпус воздушных лифтов"
 paras_bonus_2_desc:0 "Создание специализированного управления воздушным подъемником означает, что мы можем лучше оснастить наши грузовые самолеты для конкретной цели воздушно-десантной установки."
 paras_combat_1:0 "Воздушно-десантные сигналы"
 paras_combat_1_desc:0 "Ничто не может сравниться с идеальной линией связи с нашими войсками за линией. Обучающие сигнальные компании для воздушно-десантной установки будут поддерживать эти критически важные коммуникации даже в самых худших условиях."
 paras_combat_2:0 "Медицинская деталь Airborne"
 paras_combat_2_desc:0 "Масштабы наших воздушных операций возросли до такой степени, что даже необходимое медицинское оборудование должно быть подготовлено для воздушно-десантного введения."
 paras_bonus_1:0 "Усовершенствованная навигационная подготовка"
 paras_bonus_1_desc:0 "Даже самая лучшая капля может пойти наперекосяк. Мы должны обеспечить, чтобы наши войска были хорошо обучены импровизированному судоходству."
 paras_keystone_1:0 "Лучший из лучших"
 paras_keystone_1_desc:0 "Только самые закаленные в боях ветераны должны рассматриваться для наших воздушно-десантных батальонов. Хотя это может сократить число наших новобранцев, оно обязано выплачивать дивиденды на поле боя."
 paras_keystone_2:0 "Основы Вооруженных Сил"
 paras_keystone_2_desc:0 "Наши вооруженные силы впредь будут строиться на навыках и подготовке наших воздушно-десантных войск. Небо потемнеет при их приближении, и враг наш узнает страх."
 rangers_jaegers_training:0 "Интеграция традиций Jaeger"
 rangers_jaegers_training_desc:0 "Легкая пехота, обученная воевать в лесах, живет за счет того, что может предложить этот район, специалисты по установке ловушек, засад и превосходных выстрелов."
 rangers_jungle_training:0 "Рейнджеры тренируют джунгли"
 rangers_jungle_training_desc:0 "Умелые не только выживать, но и сражаться в самых густых лесах, в тропической жаре, эти рейнджеры являются ключом к действиям в районах, куда обычные войска не осмеливаются войти."
 rangers_guerilla_doctrine:0 "Лесные партизаны"
 rangers_guerilla_doctrine_desc:0 "Инициатива и движение являются ключевыми компонентами для того, чтобы напасть на врага. Наши рейнджеры должны преуспеть в использовании скрытности и неожиданности."
 rangers_recon_terrain_training:0 "разведка Rangers Terrain Мастеринг"
 rangers_recon_terrain_training_desc:0 "Существенной предпосылкой тактики рейнджера является способность пересекать самую грубую местность, чтобы нанести удар по противнику там, где он не ожидает."
 rangers_fire_support_integration:0 "Интеграция противопожарной поддержки"
 rangers_fire_support_integration_desc:0 "Интеграция передовых наблюдателей с переносным сигнальным оборудованием в команды рейнджеров означает, что даже небольшим изолированным подразделениям не нужно сражаться без огневой поддержки артиллерии."
 rangers_urban_combat:0 "Рейнджеры Urban Combat Экспертиза"
 rangers_urban_combat_desc:0 "Лесные и городские бои имеют определенные сходства, с короткими диапазонами боевых действий и ограниченным наблюдением. Войска, обладающие навыками в одной среде, могут быть обучены адаптироваться к другой."
 elite_rangers_doctrine:0 "Элитные рейнджеры"
 elite_rangers_doctrine_desc:0 "Наши рейнджеры - гордость наших вооруженных сил. Мы должны продолжать вербовать только самых лучших и подталкивать их к еще большим свершениям."
 rangers_backbone_doctrine:0 "Специализация легкой пехоты"
 rangers_backbone_doctrine_desc:0 "Навыки, приобретенные нашими лесными специалистами, могут быть полезны всем нашим элитным силам. Мы должны использовать эти знания во всех ветвях света и элитных войск."
