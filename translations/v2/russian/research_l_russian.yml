 RESEARCH_MESSAGE_UNLOCKED_TITLE:0 "Исследования закончены!"
 RESEARCH_MESSAGE_UNLOCKED_DESC:0 "Наша страна завершила исследования в $NAME|Y$.\n $DESC$"
 RESEARCH_INSTANT_DESC:0 "Исследование происходит мгновенно при смене дерева с помощью более чем одной технологии, исследуемой в текущем дереве."
 infantry_folder:0 "Пехота"
 infantry_folder_desc:0 "Оборудование и вооружение для пехотных войск."
 support_folder:1 "Роты поддержки"
 support_folder_desc:0 "разведка, Инженеры, Полевые Больницы и другие компании поддержки."
 armour_folder:0 "Броня"
 armour_folder_desc:0 "Танки и их варианты."
 nsb_armour_folder:0 "Броня"
 nsb_armour_folder_desc:0 "Танки и их варианты."
 artillery_folder:0 "Артиллерия"
 artillery_folder_desc:0 "Артиллерия, противотанковое и противовоздушное оружие для дивизий."
 land_doctrine_folder:0 "Земельная доктрина"
 land_doctrine_folder_desc:0 "Земельная доктрина, способы борьбы ваших сухопутных войск."
 naval_folder:0 "морской"
 naval_folder_desc:0 "кораблей и подводных лодок."
 mtgnavalfolder:0 "морской"
 mtgnavalfolder_desc:0 "кораблей и подводных лодок. Исследуйте новые модули для настройки ваших кораблей."
 mtgnavalsupportfolder:0 "Морская поддержка"
 mtgnavalsupportfolder_desc:0 "Военно-морское вооружение и специализированное военно-морское оборудование. Исследуйте новые модули для настройки ваших кораблей."
 naval_doctrine_folder:0 "Морская доктрина"
 naval_doctrine_folder_desc:0 "Морская доктрина, как сражается ваш флот."
 air_techs_folder:0 "Воздух"
 air_techs_folder_desc:0 "Авиация."
 air_doctrine_folder:0 "Воздушная доктрина"
 air_doctrine_folder_desc:0 "Доктрина авиации, как сражаются ваши ВВС."
 click_to_open_doctrine:0 "§Gщелкнуть§! Открыть доктрины"
 industry_folder:0 "Промышленность"
 industry:0 "Промышленность"
 industry_folder_desc:0 "Промышленность и производство."
 electronics_folder:0 "Инженерная инженерия"
 electronics_folder_desc:0 "Инженерия, радар, шифрование и передовые технологические исследования."
 secret_weapons_folder:0 "Секретное оружие"
 secret_weapons_folder_desc:0 "Чудо-оружие, продукт безумной науки."
 mobile_warfare:0 "Манёвренная война"
 mobile_warfare_desc:0 "Мобильная война - это фокус на скорости и маневре, чтобы отрезать и дезорганизовать силы противника.\n\n"
 delay:0 "Задержка"
 delay_desc:0 "Даже если битву невозможно выиграть, может оказаться выгодным замедлить продвижение атакующих сил с помощью засад и отсрочки тактики."
 elastic_defence:0 "Эластичная оборона"
 elastic_defence_desc:0 "Вместо того, чтобы сосредоточить всю силу на передовой, эластичная защита создает более «глубокий» слой защиты, который позволяет обороняющемуся больше времени реагировать и контратаковать, в то время как атакующий рассредоточен и увяз."
 mobile_infantry:0 "Мобильная пехота"
 mobile_infantry_desc:0 "Регулярная пехота часто слишком медленна, чтобы идти в ногу с быстро движущимися бронетанковыми войсками, реагировать на них или убегать от них. Ответ заключается в том, чтобы сосредоточиться на моторизованной или механизированной пехоте, которая может идти в ногу с темпами современной войны.\n\n"
 mass_motorization:0 "Массовая моторизация"
 mass_motorization_desc:0 "Еще больше внимания уделяется моторизованным войскам."
 mechanised_offensive:0 "Механизированное наступление"
 mechanised_offensive_desc:0 "Моторизованные войска хороши и хороши, но для ведения наступательных действий нам нужна пехота, которая может вступать в бой в бронетранспортерах, которые защищают их и несут тяжелое вооружение."
 armored_spearhead:0 "Бронированный Spearhead"
 armored_spearhead_desc:0 "Чтобы использовать танки в полной мере, они не могут быть привязаны к поддержке пехоты. Вместо этого они должны быть сформированы в быстро движущиеся независимые подразделения, которые могут возглавить атаки.\n\n"
 schwerpunk:0 "Шверпанкт"
 schwerpunk_desc:0 "В любой операции должен быть определен Шверпункт, или Фокусная точка, и максимальная сила должна быть сконцентрирована, чтобы победить в этой точке."
 blitzkrieg:0 "Блицкриг"
 blitzkrieg_desc:0 "Блицкриг относится к стратегии быстро движущихся бронетанковых войск, поддерживаемых Мобильной пехотой, и воздушной поддержки, прорывающейся через вражеские линии, чтобы дезорганизовать и окружить их."
 kampfgruppe:0 "Кампфгруппа"
 kampfgruppe_desc:0 "Кампфгруппа была специальным образованием, которое было организовано для выполнения конкретной задачи."
 firebrigades:0 "Пожарные бригады"
 firebrigades_desc:0 "Пожарные бригады были поспешно сбиты силами, брошенными вместе, чтобы отреагировать на прорывы противника или другие критические вопросы.\n\n"
 backhand_blow:0 "Обратный удар"
 backhand_blow_desc:0 "Вместо того, чтобы сражаться за каждый дюйм земли, вражеские проникновения в основном избегают, пока они не расширяются, и в этот момент они могут быть отрезаны и уничтожены контратаками."
 modern_blitzkrieg:0 "Современный блицкриг"
 modern_blitzkrieg_desc:0 "Вершина мобильной войны, современный блицкриг включает в себя все последние достижения технологий и уроки, извлеченные из предыдущих доктрин."
 volkssturm:0 "Волкстурм"
 volkssturm_desc:0 "Волксштурм, или Народная милиция, состоял из людей, которые были слишком стары, слишком молоды или иным образом непригодны для регулярной военной службы.\n\n"
 nd_conscription:0 "Недискриминационный призыв"
 nd_conscription_desc:0 "Даже инвалиды и калеки должны быть призваны, не может быть такого понятия, как гражданский."
 werwolf_guerillas:0 "Партизаны-оборотни"
 werwolf_guerillas_desc:0 "Оборотни были запланированной немецкой группой сопротивления, которая будет бороться против оккупационных держав, когда война была проиграна."
 superior_firepower:0 "Превосходство огневой мощи"
 superior_firepower_desc:0 "Эта доктрина направлена на то, чтобы бросать снаряды, а не людей, в противника. Наша рабочая сила драгоценна, пули дешевы.\n\n"
 sup_delay:0 "Задержка"
 sup_delay_desc:0 "Даже если битву невозможно выиграть, может оказаться выгодным замедлить продвижение атакующих сил с помощью засад и отсрочки тактики."
 mobile_defence:0 "Мобильная оборона"
 mobile_defence_desc:0 "Мобильные силы могут быть использованы для усиления обороны везде, где противник может атаковать."
 intergrated_support:0 "Комплексная поддержка"
 intergrated_support_desc:0 "Тесная интеграция сил поддержки с боевыми войсками приводит к усилению дивизий при нападении.\n\n"
 regimental_combat_teams:0 "Полковые боевые команды"
 regimental_combat_teams_desc:0 "Полковая боевая группа - пехотный полк, тесно интегрированный с вспомогательными подразделениями, такими как Артиллерия, Танки и Разведывательные элементы, чтобы сформировать небольшую самодостаточную единицу, которая позволяет большую гибкость при нападении."
 dispersed_support:0 "Рассредоточенная поддержка"
 dispersed_support_desc:0 "Рассредоточив наши подразделения поддержки, они могут покрыть более широкую территорию, оставаясь вне линии огня, что приводит к усилению обороны дивизий.\n\n"
 overwhelming_firepower:0 "Подавляющая огневая мощь"
 overwhelming_firepower_desc:0 "Призыв ко всем имеющимся вспомогательным подразделениям дать подавляющую огневую мощь может значительно смягчить цель или, что еще лучше, серьезно испортить день злоумышленника."
 sup_mechanized_offensive:0 "Механизированное наступление"
 sup_mechanized_offensive_desc:0 "Моторизованные войска хороши и хороши, но для ведения наступательных действий нам нужна пехота, которая может вступать в бой в бронетранспортерах, которые защищают их и несут тяжелое вооружение."
 concentrated_fire_plans:0 "Концентрированные пожарные планы"
 concentrated_fire_plans_desc:0 "Сосредоточив огонь различных батарей на синхронизированной бомбардировке, можно нанести противнику гораздо больший урон.\n\n"
 combined_arms:0 "Комбинированное оружие"
 combined_arms_desc:0 "Бронетанковые, пехотные и вспомогательные подразделения, работающие вместе в хорошо организованных командах, гораздо эффективнее тех же сил, которые используются отдельно."
 tactical_control:0 "Тактический контроль"
 tactical_control_desc:0 "Офицеры, знакомые с операциями по объединению вооружений на передовых позициях, теперь могут непосредственно контролировать все операции отделения."
 air_land_battle:0 "Битва Airland"
 air_land_battle_desc:0 "Поскольку сухопутные войска уже действуют в объединенных вооруженных формированиях, битва на воздушной земле теперь также подчеркивает тесную координацию между сухопутными силами и воздушными силами, сливая воздушные и наземные поля боя в единое целое."
 centralized_fire_control:0 "Централизованный противопожарный контроль"
 centralized_fire_control_desc:0 "Централизованная система управления огнем позволяет оценивать все призывы к артиллерийской поддержке в одном месте, и при необходимости вся огневая мощь дивизии должна быть сосредоточена на цели, а не на подразделении, которое может только запрашивать огонь от назначенной им артиллерии.\n\n"
 forward_observers:0 "Передовые наблюдатели"
 forward_observers_desc:0 "Форвардные наблюдатели занимают позиции, где они могут непосредственно наблюдать точность и последствия артиллерийского огня, и передавать результаты обратно в орудия для исправления."
 advanced_firebases:0 "Усовершенствованные базы огневой поддержки"
 advanced_firebases_desc:0 "Артиллерийские лагеря могут располагаться вблизи линии фронта на укрепленных базах, чтобы оказать максимально возможную поддержку наступающим силам."
 shock_and_awe:0 "Шок и трепет"
 shock_and_awe_desc:0 "Массовая концентрация огневой мощи немедленно или достаточно своевременно навяжет противнику этот подавляющий уровень шока и трепета, чтобы парализовать его волю к продолжению."
 grand_battle_plan:0 "Большой боевой план"
 grand_battle_plan_desc:0 "Широкое планирование и подготовка перед началом сражения является ключом к успеху.\n\n"
 trench_warfare:0 "Окопная война"
 trench_warfare_desc:0 "Лопата часто является лучшим оружием пехоты. Единицы узнают ценность закрепления в любой позиции, которую они занимают."
 prepared_defense:0 "Подготовленная оборона"
 prepared_defense_desc:0 "Более обширные системы полевых укреплений значительно улучшают оборону подразделения."
 grand_assault:0 "Великое нападение"
 grand_assault_desc:0 "После того, как достаточное количество сил было сформировано и их цели были хорошо спланированы, мощное нападение не может не уничтожить врага."
 grand_mechanized_offensive:0 "Механизированное наступление"
 grand_mechanized_offensive_desc:0 "Моторизованные войска хороши и хороши, но для ведения наступательных действий нам нужна пехота, которая может вступать в бой в бронетранспортерах, которые защищают их и несут тяжелое вооружение.\n\n"
 assault_concentration:0 "Концентрация атак"
 assault_concentration_desc:0 "Перед атакой ведущие элементы тщательно готовятся и размещаются в передних позициях, обеспечивая максимальную силу в моменты открытия."
 branch_interoperation:0 "Межотраслевая операция"
 branch_interoperation_desc:0 "Усиление координации между различными подразделениями вооруженных сил позволяет им лучше работать в операциях по объединению вооружений."
 assault_breakthrough:0 "Assault Breakthrough скачать"
 assault_breakthrough_desc:0 "Вместо того, чтобы наносить грандиозный удар по всему фронту, гораздо эффективнее сосредоточить удар только на одной или нескольких точках вражеской линии и добиться там прорыва."
 central_planning:0 "Центральное планирование"
 central_planning_desc:0 "Офицеры всех отделений теперь вносят свой вклад в планирование данной операции, чтобы убедиться, что она работает с максимальной эффективностью."
 c3i_theory:0 "C3I"
 c3i_theory_desc:0 "Эффективные штабные офицеры обеспечивают поток командования, управления, связи и разведки между командиром и подразделениями, которые он контролирует."
 infantry_offensive:0 "Пехотный наступательный"
 infantry_offensive_desc:0 "Наступательный дух пехоты является решающим элементом победоносных сражений. Наша пехота должна быть впереди.\n\n"
 armored_operations:0 "Бронированные операции"
 armored_operations_desc:0 "Танки и другая бронетехника очень полезны для доставки пехоты на поля сражений и непосредственной поддержки в бою."
 infiltration_assault:0 "Штурм через просачивание"
 infiltration_assault_desc:0 "В начальных ходах атаки пехота должна нацеливаться на слабые места в линии противника, чтобы обойти и изолировать более хорошо защищенные участки, которые затем могут быть уничтожены остальными атакующими силами."
 night_assault_tactics:0 "Тактика ночного штурма"
 night_assault_tactics_desc:0 "Солдаты, привыкшие к передвижению и бою ночью, могут либо заранее подготовиться к нападению, либо непосредственно атаковать ничего не подозревающие силы противника."
 attritional_containment:0 "Исчерпывающее сдерживание"
 attritional_containment_desc:0 "Если мы не в состоянии начать атаку, чтобы удалить вражескую позицию, то она должна быть подвергнута постоянным незначительным атакам, которые приведут к потерям и предотвратят нападение противника."
 infiltration_in_depth:0 "Инфильтрация в глубину"
 infiltration_in_depth_desc:0 "Наши силы теперь обучены обходить и изолировать опорные пункты противника на гораздо большую глубину, в идеале наши штурмовые силы не должны останавливаться, пока они не достигнут тыловых районов противника и их силы полностью отрезаны."
 mass_assault:0 "Массовое нападение"
 mass_assault_desc:0 "«Идеальное» оружие переоценено, большое количество «достаточно хорошего» оружия — путь к победе!\n\n"
 pocket_defence:0 "Оборона в окружении"
 pocket_defence_desc:0 "Не исключено, что при обороне наши войска могут быть пойманы в карман. В этом случае они должны просто продержаться до тех пор, пока неизбежная контратака не облегчит их."
 defence_in_depth:0 "Глубокоэшелонированная оборона"
 defence_in_depth_desc:0 "Предлагая относительно легкое сопротивление и временно предоставляя землю, мы можем торговать пространством во времени и позволять атакующим силам истощаться перед контратакой."
 large_front_operations:0 "Большие фронтовые операции"
 large_front_operations_desc:0 "Бои на большом фронте предполагают координацию усилий нескольких подразделений на дальних дистанциях: на оперативном уровне, а не тактическом.\n\n"
 deep_operations:0 "Глубокие операции"
 deep_operations_desc:0 "Глубокие операции, или глубокая битва, заключается в том, чтобы прорвать оборонительные линии противника в нескольких точках и уничтожить его оперативные резервы, его оперативную глубину и занять как можно большую часть его стратегической глубины."
 operational_concentration:0 "Оперативная концентрация"
 operational_concentration_desc:0 "Ключом к любым военным действиям является подавляющее местное превосходство. Несмотря на то, что он не превосходит весь фронт, это означает ослабление частей вашей линии фронта, чтобы сосредоточить войска там, где это необходимо, а не пытаться быть сильными везде."
 vast_offensives:0 "Огромные наступления"
 vast_offensives_desc:0 "Если прорыв может быть достигнут, то он должен быть использован как можно сильнее: обширное наступление, продвигающееся по линиям противника как можно глубже, сделает оборону их фронта более трудной, невозможной или неактуальной."
 breakthrough_priority:0 "Приоритет прорыва"
 breakthrough_priority_desc:0 "Расширяясь на оперативную концентрацию, все потребности фронта подчинены необходимости концентрации сил для прорывов. Местные поражения несущественны по сравнению с нанесением решающего удара."
 mechanized_wave:0 "Механизированная волна"
 mechanized_wave_desc:0 "Механизированные силы идеально подходят для проведения быстрых наступлений, необходимых для правильной эксплуатации прорывов, как для поддержки бронетанковых войск, так и для обеспечения фланговых позиций прорыва."
 continuous_offensive:0 "Непрерывное наступление"
 continuous_offensive_desc:0 "В то время как правильно используемые Прорывы часто очень эффективны, рано или поздно атакующий всегда истощается и защитник способен реорганизовать и реформировать новые оборонительные линии. Однако при достаточном количестве резервов и правильной организации наступление можно было бы продолжать гораздо глубже с разрушительными для противника результатами."
 human_wave_offensive:0 "Наступление человеческой волны"
 human_wave_offensive_desc:0 "Human Wave Offensive - это пехотная тактика, в которой нападающий проводит фронтальное нападение с плотно сосредоточенными пехотными формированиями против линии противника с намерением одолеть защитников, участвуя в ближнем бою."
 human_infantry_offensive:0 "Пехотный наступательный"
 human_infantry_offensive_desc:0 "Наступательный дух пехоты является решающим элементом победоносных сражений. Наша пехота должна быть впереди."
 large_front_offensive:0 "Большая фронтовая атака"
 large_front_offensive_desc:0 "Проводя или угрожая наступлениями с использованием человеческой волны на нескольких участках фронта, мы можем помешать противнику сосредоточить свою огневую мощь против любой атаки."
 peoples_army:0 "Народная армия"
 peoples_army_desc:0 "Народная армия верит в превосходство людей над оружием, с превосходной мотивацией, компенсирующей более низкие технологии, и пользуется широкой поддержкой гражданского населения.\n\n"
 guerilla_warfare:0 "Партизанская война"
 guerilla_warfare_desc:0 "Враг наступает, мы отступаем. Вражеские лагеря мы преследуем; Неприятель шинами, мы атакуем; Враг отступает, мы преследуем."
 infantry_weapons2:0 "Усовершенствованное пехотное оборудование I"
 infantry_weapons2_desc:0 "Персонал и экипаж служили оружием для пехоты, а также различными другими комплектами, необходимыми солдату. Улучшенные модели оружия и более специализированное оборудование."
 improved_infantry_weapons_2:0 "Усовершенствованное пехотное оборудование II"
 improved_infantry_weapons_2_desc:0 "Персонал и экипаж служили оружием для пехоты, а также различными другими комплектами, необходимыми солдату. Улучшенные модели оружия и более специализированное оборудование."
 advanced_infantry_weapons2:0 "Усовершенствованная пехотная техника III"
 advanced_infantry_weapons2_desc:0 "Персонал и экипаж служили оружием для пехоты, а также различными другими комплектами, необходимыми солдату. Дальнейшая модернизация включает в себя персональные штурмовые винтовки и противотанковые ракеты. Улучшение доступности оружия, ранее распространявшегося в ограниченном объеме."
 infantry_at:0 "Пехотный противотанковый I"
 infantry_at_desc:0 "Вооружение наших пехотных подразделений противотанковыми винтовками позволит им выводить более легкие бронетехнику при сохранении мобильности."
 infantry_at2:0 "Пехотный противотанковый II"
 infantry_at2_desc:0 "Для того чтобы пехота эффективно воевала с более тяжелыми бронетанковыми подразделениями, необходимо сделать противотанковое оружие меньшего размера и легче."
 support_weapons2:0 "Оружие поддержки II"
 support_weapons2_desc:0 "Разработка автоматического оружия, которое сочетает в себе аспекты легких и тяжелых пулеметов, позволяет использовать их оборудование."
 support_weapons3:0 "Оружие поддержки III"
 support_weapons3_desc:0 "Поддерживая и повышая надежность пулеметов, мы можем также экспериментировать с более высокими скорострельными показателями для обеспечения летальности постоянного потока пуль."
 support_weapons4:0 "Оружие поддержки IV"
 support_weapons4_desc:0 "С ростом использования штурмовых винтовок разработка надежного автоматического оружия, которое может быть использовано в любой среде всеми солдатами, является приоритетом для современной армии."
 paratroopers:0 "Парашютисты I"
 paratroopers_desc:0 "Включив в свою армию воздушно-десантные войска, мы можем осуществлять принудительные входы и размещать ключевые войска в ранее недоступных районах, что открывает новые тактические возможности."
 paratroopers2:0 "Парашютисты II"
 paratroopers2_desc:0 "Переход от небольших операций с несколькими десантниками к более крупным воздушно-десантным дивизиям прокладывает путь для массовых высадок в воздухе, выводя эти силы за рамки новизны к естественной части войны."
 paratroopers3:0 "Парашютисты III"
 paratroopers3_desc:0 "Научившись адаптировать операции по высадке парадропа в соответствии с погодой, стандартизация оборудования, такого как скачки и расширенная специализированная подготовка, минимизирует путаницу и риски, связанные с этими опасными миссиями."
 marines:0 "Морпехи I"
 marines_desc:0 "Войска, специализирующиеся на земноводной войне, становятся все более незаменимыми. Импровизированные методы и оборудование уходят в прошлое, поскольку наша морская пехота поддерживается специализированными десантными кораблями и обучением."
 marines2:0 "Морпехи II"
 marines2_desc:0 "Амфибийная война требует постоянных инноваций. Улучшенная материально-техническая поддержка и переносные гавани могут позволить нашим морским пехотинцам совершать высадки, которые в противном случае были бы невозможны."
 marines3:0 "Морпехи III"
 marines3_desc:0 "Морские пехотинцы могут быть чем-то большим, чем просто десантная пехота. В будущем наш морской корпус будет в числе наиболее дисциплинированных и организованных спецназовцев."
 tech_mountaineers:0 "Горная пехота I"
 tech_mountaineers_desc:0 "Бои в горных хребтах подвергают войска многим опасностям, но иногда их невозможно избежать. Мы можем свести к минимуму эти риски, предоставив нашим солдатам специальную подготовку для этой среды."
 tech_mountaineers2:0 "Горная пехота II"
 tech_mountaineers2_desc:0 "Выходя за пределы выживания, наши силы могут быть обучены использовать горы в своих интересах. С легкой техникой и муловыми транспортами они могут маневрировать на этой местности лучше, чем другие пехотинцы."
 tech_mountaineers3:0 "Горная пехота III"
 tech_mountaineers3_desc:0 "Подготовка к самым трудным горным миссиям на больших высотах и при низких температурах потребует от наших горных войск экстраординарной подготовки и дисциплины."
 rangers_tech:0 "Рейнджеры I"
 rangers_tech_desc:0 "Специализируясь на боях в лесистой местности и обучая лёгкую пехоту приспосабливаться к рельефу и растительности, мы сможем удерживать некоторые участки фронта меньшими силами или даже прорываться там, где враг меньше всего этого ожидает."
 rangers_tech2:0 "Рейнджерс II"
 rangers_tech2_desc:0 "Использование лесных специалистов в массовом порядке, а не в качестве небольших разведывательных подразделений дает нам возможность проводить массовые нападения на легко защищенные сектора."
 rangers_tech3:0 "Рейнджерс III"
 rangers_tech3_desc:0 "Работа в сложных районах требует специального оборудования и специальных методов обучения. Мы должны обеспечить, чтобы наши войска были оснащены новейшими инструментами и обучены с использованием новейших методов."
 tech_special_forces:0 "Спецназ"
 tech_special_forces_desc:0 "Нетрадиционные бои требуют специальной подготовки. Мы должны быть готовы и способны адаптироваться к суровым условиям."
 advanced_special_forces:0 "Повышение квалификации спецназа"
 advanced_special_forces_desc:0 "Благодаря обширной подготовке мы можем гарантировать, что наши спецназовцы смогут действовать выше и выше обычных людей."
 improved_special_forces:1 "Расширенная программа спецназа"
 improved_special_forces_desc:1 "Спецназ способен выполнять задачи, которые не могут выполнить обычные солдаты. Нам нужно расширить программы обучения, чтобы получить больше наших солдат."
 extreme_environment_training:0 "Экстремальная экологическая подготовка"
 extreme_environment_training_desc:0 "Мы должны уметь бороться в самых суровых условиях. При правильной подготовке и оснащении наши войска смогут воевать в самых экстремальных условиях."
 survival_training:0 "Обучение выживанию"
 survival_training_desc:0 "Наши спецназовцы часто будут сражаться за линию фронта и в дефиците. Мы должны обучить их терпеть суровую погоду и бороться с ограниченными запасами."
 elite_forces:0 "Элитные войска"
 elite_forces_desc:0 "Только лучшие из лучших станут спецназовцами. Солдаты, которые пройдут обучение, будут сильнее, быстрее и сильнее всех остальных."
 jungle_warfare:0 "Война в джунглях"
 jungle_warfare_desc:0 "Специальная подготовка, чтобы наши солдаты были эффективны в джунглях."
 HUN_light_infantry_tech:0 "Доктрина лёгкой пехоты"
 HUN_light_infantry_tech_desc:0 "Уменьшение количества вспомогательного оружия в пехотных дивизиях делает их более гибкими и дает им преимущество в бою на ограниченной местности, такой как города и леса."
 mountain_warfare:0 "Горная война"
 mountain_warfare_desc:0 "Специальная подготовка для того, чтобы наши солдаты были эффективны в горных районах."
 tech_recon:0 "Компания I"
 tech_recon_desc:0 "Отправка небольших групп для разведки впереди, прежде чем двигаться в основной силе, позволяет нам собирать разведданные о том, где находится противник и скольким мы сталкиваемся."
 tech_recon2:0 "Компания II"
 tech_recon2_desc:0 "Разведывательные миссии часто опасны, и жертвы высоки. Подготовка наших патрулей к быстрому передвижению и отступлению, а также оснащение их для устранения препятствий, поставленных противником, увеличит их шансы вернуться живыми."
 tech_recon3:0 "Компания III"
 tech_recon3_desc:0 "Улучшения в радиотехнологиях меняют способ выполнения разведывательных миссий, позволяя быстро передавать собранные разведданные."
 tech_recon4:0 "Компания IV"
 tech_recon4_desc:0 "Глубокая разведка, сочетающая шпионаж, партизанские действия и подготовку коммандос, расширит наши тактические возможности и позволит быстро адаптировать решения к обстановке."
 tech_engineers:0 "Инженерная компания I"
 tech_engineers_desc:0 "Строительство укреплений и преодоление препятствий делают боевых инженеров жизненно важными в этой области. Предоставление нашим инженерам универсальной роли позволяет нам развертывать их в различных ситуациях, когда они будут необходимы."
 tech_engineers2:0 "Инженерная компания II"
 tech_engineers2_desc:0 "С современным оборудованием и взрывчаткой наши инженеры могут выйти за рамки своих традиционных задач и удивить врага своей изобретательностью, на суше и на море."
 tech_engineers3:0 "Инженерная компания III"
 tech_engineers3_desc:0 "Военно-инженерные проекты приближаются к более масштабным. Строительство передовых инфраструктурных объектов позволяет осуществлять операции, требующие поставок сверх того, что обычно имеется на местах."
 tech_engineers4:0 "Инженерная компания IV"
 tech_engineers4_desc:0 "Сохраняя местную мобильность при строительстве того, что раньше считалось постоянными укреплениями и системами снабжения, боевые инженеры будущего обеспечат, чтобы независимо от того, где будут атакованы наши войска, они были подготовлены."
 hospital_tech:0 "Полевые госпитали"
 logistics_tech:0 "Логистическая компания"
 recon_tech:0 "Разведывательная компания"
 tech_field_hospital:0 "Полевой госпиталь I"
 tech_field_hospital_desc:0 "Жертва не должна означать мертвого солдата. Немедленная медицинская помощь нашим раненым, доставленным в тыл, является первым шагом к обеспечению этого."
 tech_field_hospital2:0 "Полевой госпиталь II"
 tech_field_hospital2_desc:0 "Установив использование переносных больниц, доведя медицинскую помощь туда, где она необходима, мы можем остановить многие ненужные смерти и постоянные травмы."
 tech_field_hospital3:0 "Полевой госпиталь III"
 tech_field_hospital3_desc:0 "Хирургия является одной из наиболее распространенных неотложных процедур, необходимых в этой области. Процедуры и инструменты для этого должны быть доступны ближе к фронту, и мы должны обеспечить, чтобы квалифицированные хирурги входили в состав военно-медицинских подразделений."
 tech_field_hospital4:0 "Полевой госпиталь IV"
 tech_field_hospital4_desc:0 "Хотя в полевой медицине было сделано много улучшений, многие достижения импровизированы, и нам не хватает устоявшейся доктрины. Имея больше опыта, мы можем более четко объяснить роль этих устройств и сделать импровизированные инновации постоянными."
 tech_logistics_company:0 "Логистическая компания I"
 tech_logistics_company_desc:0 "Наличие специализированных логистических офицеров в наших рядах обеспечит использование вспомогательных сетей для минимизации отходов."
 tech_logistics_company2:0 "Логистическая компания II"
 tech_logistics_company2_desc:0 "Адаптация нашего анализа рисков к новым условиям войны повысит безопасность нашей материально-технической поддержки."
 tech_logistics_company3:0 "Логистическая компания III"
 tech_logistics_company3_desc:0 "Продолжение статистической оценки потребностей в поставках войск способствует максимальному использованию наших ресурсов."
 tech_logistics_company4:0 "Логистическая компания IV"
 tech_logistics_company4_desc:0 "Стандартизированная классификация припасов уменьшит путаницу и повысит эффективность планирования."
 tech_military_police:0 "Военная полиция I"
 tech_military_police_desc:0 "Регулярные войска могут управлять оккупацией в течение более короткого периода времени, но они в первую очередь солдаты. Интеграция военной полиции в наши силы обеспечит наличие людей на местах для реагирования на сопротивление и расследования саботажа."
 tech_military_police2:0 "Военная полиция II"
 tech_military_police2_desc:0 "Принимая на себя регулярные полицейские обязанности на оккупированных территориях, такие как контроль за дорожным движением и поддержание общественного порядка, наша военная полиция может свести к минимуму хаос и путаницу, в которых процветают партизанские движения."
 tech_military_police3:0 "Военная полиция III"
 tech_military_police3_desc:0 "Сотрудничая с местными шпионскими сетями и информаторами, созданными до оккупации, наша военная полиция может активно готовиться к тому, где может возникнуть сопротивление."
 tech_military_police4:0 "Военная полиция IV"
 tech_military_police4_desc:0 "Безопасная полицейская деятельность на оккупированной территории в такой же степени связана с возвращением к нормальной жизни, как и с безжалостным устранением оппозиции. Наша военная полиция должна обеспечить скорейшее начало этого процесса, чтобы обеспечить безопасность как солдат, так и гражданских лиц."
 tech_signal_company:0 "Сигнальная компания I"
 tech_signal_company_desc:0 "Создание и поддержание коммуникаций в полевых условиях всегда требовало специальных навыков. С появлением новых технологий связи и обнаружения в Великой войне перед нами открываются новые возможности."
 tech_signal_company2:0 "Компания Signal II"
 tech_signal_company2_desc:0 "Сигнальные компании, ориентированные на связь между различными ветвями вооруженных сил, могут гарантировать, что сухопутные войска смогут координировать усилия с морскими и воздушными операциями и более быстро планировать свои передвижения."
 tech_signal_company3:0 "Сигнальная компания III"
 tech_signal_company3_desc:0 "Все более портативные коммуникационные технологии более жизнеспособны для личного ношения в качестве рюкзака. Необходимо использовать эту повышенную мобильность сигнальных корпусов."
 tech_signal_company4:0 "Сигнальная компания IV"
 tech_signal_company4_desc:0 "Среди наших специалистов по сигнализации есть люди, обладающие непревзойденными знаниями из первых рук о полевом использовании этого оборудования. Вовлекая их в исследования новых коммуникационных технологий, мы можем использовать их опыт."
 tech_maintenance_company:0 "Техническая компания I"
 tech_maintenance_company_desc:0 "Техническое обслуживание, ремонт и капитальный ремонт важны для обеспечения надежности и безопасности использования военной техники. Наличие компаний, посвященных этому, гарантирует, что ему уделяется соответствующее внимание."
 tech_maintenance_company2:0 "Обслуживающая компания II"
 tech_maintenance_company2_desc:0 "Регулярные процедуры оперативного обслуживания минимизируют риски разрушения оборудования и предупреждают войска о необходимости его замены."
 tech_maintenance_company3:0 "Техническая компания III"
 tech_maintenance_company3_desc:0 "Обеспечение того, чтобы наши войска всегда имели в поле основные материалы для выполнения общего ремонта, предотвратит дальнейшее использование оборудования, которое, как известно, было повреждено."
 tech_maintenance_company4:0 "Обслуживающая компания IV"
 tech_maintenance_company4_desc:0 "Опыт проектирования для активного резервирования в Великой войне может быть возобновлен для работы с более современным оборудованием, чтобы облегчить техническое обслуживание."
 motorised_infantry:0 "Моторная пехота"
 motorised_infantry_desc:0 "Расширяя использование автотранспортных средств в пехотных перевозках на местах, мобильность медленно движущихся пехотных подразделений может быть значительно улучшена, что позволяет быстрее реагировать и разрабатывать новые стратегии."
 night_vision:0 "Ночное видение I"
 night_vision_desc:0 "Возможность видеть врага, не будучи замеченным, является ключом к ночным операциям. С изобретением инфракрасной технологии мы можем снабдить нашу армию устройствами, которые, хотя и громоздки, делают это возможным."
 night_vision2:0 "Ночное видение II"
 night_vision2_desc:0 "Ранние инфракрасные прицелы, хотя изначально предназначались для использования снайперами, имели ограниченный диапазон обзора. По мере улучшения портативности и зрения эти устройства могут использоваться большим количеством войск, работающих в ночное время."
 basic_machine_tools:0 "Базовые машинные инструменты"
 basic_machine_tools_desc:0 "В военном производстве могут использоваться различные недавно разработанные фрезерные станки, от небольших и универсальных типов, доступных для любого машинного цеха, до крупномасштабных передовых моделей, которые расширяют технологические границы."
 improved_machine_tools:0 "Усовершенствованные инструменты машин"
 improved_machine_tools_desc:0 "Токарные станки являются незаменимыми для массового производства. Обеспечение эффективного строительства и использования самих токарных станков даст нам значительное промышленное преимущество."
 advanced_machine_tools:0 "Продвинутые инструменты машин"
 advanced_machine_tools_desc:0 "Автоматизация станков с использованием сервомеханизмов обсуждалась ранее. Внедрение этих идей на практике позволяет использовать другие достижения в области автоматизации, такие как компьютеры."
 assembly_line_production:0 "Производство сборочных линий"
 assembly_line_production_desc:0 "Мощная сборочная линия, уже используемая во многих отраслях промышленности, может изменить ход войны, разрешив беспрецедентную лавину производства."
 flexible_line:0 "Гибкая линия"
 flexible_line_desc:0 "Так же хорошо смазанная машина, как и сборочная линия, она все еще укомплектована людьми, что позволяет адаптироваться при необходимости. Мы должны использовать это в нашем промышленном производстве."
 streamlined_line:0 "Упорядоченная линия"
 streamlined_line_desc:0 "Стандартизация и жесткая структура сборочной линии являются ключом к ее эффективности и безопасности. Это должны быть ключевые аспекты развития нашего промышленного производства."
 improved_equipment_conversion:0 "Усовершенствованные методы использования угля"
 improved_equipment_conversion_desc:0 "Достижения в области машиностроения позволяют нам получать больше энергии от угля, потребляемого нашими заводами, производя больше энергии на килограмм сожженного угля."
 advanced_equipment_conversion:0 "Передовые методы использования угля"
 advanced_equipment_conversion_desc:0 "Дальнейшие достижения в области промышленности позволили нам еще больше усовершенствовать процесс извлечения энергии из угля, который мы сжигаем."
 concentrated_industry:0 "Концентрированная промышленность I"
 concentrated_industry_desc:0 "Сосредоточение нашего промышленного производства на нескольких ключевых площадках позволит нам значительно повысить его эффективность.\n\n"
 concentrated_industry2:0 "Концентрированная промышленность II"
 concentrated_industry2_desc:0 "Дальнейшая концентрация производства поможет снизить затраты."
 concentrated_industry3:0 "Концентрированная промышленность III"
 concentrated_industry3_desc:0 "Инфраструктурные расходы могут быть снижены путем адаптации сетей к нашей более ориентированной отрасли."
 concentrated_industry4:0 "Концентрированная промышленность IV"
 concentrated_industry4_desc:0 "Сохранение ключевых моментов в нашей отрасли близко друг к другу увеличивает влияние этих концентрированных участков."
 concentrated_industry5:0 "Концентрированная промышленность V"
 concentrated_industry5_desc:0 "Крупные промышленные комплексы сегодня объединяют многие части нашей промышленности, сводя к минимуму затраты на транспорт и рабочую силу."
 dispersed_industry:0 "Рассредоточенная промышленность I"
 dispersed_industry_desc:0 "Распространяя нашу промышленность, мы можем гарантировать, что противнику будет трудно нацелиться в военное время.\n\n"
 dispersed_industry2:0 "Рассредоточенная промышленность II"
 dispersed_industry2_desc:0 "Дальнейшая децентрализация нашего производства затрудняет удар по конкретным его частям."
 dispersed_industry3:0 "Рассредоточенная промышленность III"
 dispersed_industry3_desc:0 "Наличие заводов, работающих под видом других операций, снизит риск прямых атак."
 dispersed_industry4:0 "Рассредоточенная промышленность IV"
 dispersed_industry4_desc:0 "Камуфляж и разброс наших заводов создает сеть, которую очень трудно полностью разрушить."
 dispersed_industry5:0 "Рассредоточенная промышленность V"
 dispersed_industry5_desc:0 "Имея не только нашу промышленность, но и инфраструктуру, связывающую ее вместе, мы можем сделать еще более трудным уничтожение с помощью воздушных атак."
 synth_oil_experiments:0 "Эксперименты с синтетическим маслом"
 synth_oil_experiments_desc:0 "Для снижения зависимости от масла могут быть исследованы процессы производства заменителей из других веществ и материалов."
 early_refining:0 "Раннее рафинирование"
 early_refining_desc:0 "Сырая нефть может быть переработана в ряд веществ и материалов, жизненно важных для любой современной войны. Для того чтобы построить современную отрасль, необходимо будет идти вперед в этих методах."
 oil_processing:0 "Нефтепереработка"
 oil_processing_desc:0 "Сеть заводов по синтетической дистилляции и переработке нефтепродуктов – это следующий шаг к обеспечению поставок топлива для нашей страны."
 improved_oil_processing:0 "Улучшенная переработка нефти"
 improved_oil_processing_desc:0 "Перенос ранее экспериментальных методов перегонки на крупномасштабные операции позволит нам лучше адаптироваться к имеющимся материалам и потребностям."
 advanced_oil_processing:0 "Передовая переработка нефти"
 advanced_oil_processing_desc:0 "Новые экспериментальные методы очистки, такие как гидроочистка, могут быть использованы в производстве масла для значительного улучшения конечного продукта."
 modern_oil_processing:0 "Современная переработка нефти"
 modern_oil_processing_desc:1 "Наши нефтеперерабатывающие заводы можно дополнительно улучшить с помощью передовых методов переработки нефти, таких как гидрокрекинг, алкилирование, окисление меркаптанов и изомеризация."
 rubber_processing:0 "Обработка каучука"
 rubber_processing_desc:1 "Промышленная обработка синтетического каучука необходима для снижения нашей зависимости от натурального каучукового сырья."
 improved_rubber_processing:0 "Улучшенная обработка каучука"
 improved_rubber_processing_desc:1 "Широкомасштабное производство синтетического каучука возможно с помощью новых процессов для ускорения реакций дегидрогенизации."
 advanced_rubber_processing:0 "Продвинутая резиновая обработка"
 advanced_rubber_processing_desc:1 "Универсальная рецептура синтетического каучука с усовершенствованными процессами, такими как применение додецилмеркаптана в качестве модификатора полимеризации, позволит расширить производство синтетического каучука."
 modern_rubber_processing:0 "Современная резиновая обработка"
 modern_rubber_processing_desc:1 "Переход к более оптимизированным процессам полимеризации приведет к снижению затрат и увеличению производительности."
 construction1:0 "Строительство I"
 construction1_desc:0 "Усовершенствованные методы и материалы позволяют быстрее возводить здания, как гражданские, так и военные."
 construction2:0 "Строительство II"
 construction2_desc:0 "Модернизация наших инструментов и оборудования будет способствовать дальнейшему развитию нашего строительства."
 construction3:0 "Строительство III"
 construction3_desc:0 "Принятие современных транспортных средств и опыт наших достижений в строительстве могут быть применены, чтобы сделать ремонт значительно быстрее."
 construction4:0 "Строительство IV"
 construction4_desc:0 "Более высокая степень механизации и лучшие процедуры еще больше улучшают скорость строительства."
 construction5:0 "Строительство V"
 construction5_desc:0 "Будущее эффективного строительства потребует более широкого планирования отдельных проектов, а также стандартизированных решений, где это возможно."
 excavation1:0 "Раскопки I"
 excavation1_desc:0 "Достижения в методах бурения позволяют нам выкапывать ресурсы, которые ранее было невозможно достичь."
 excavation2:0 "Раскопки II"
 excavation2_desc:0 "Новые технологии помогают нам более эффективно собирать ресурсы. Мы больше не испортим ресурсы при добыче, что приведет к большей урожайности."
 excavation3:0 "Раскопки III"
 excavation3_desc:0 "Прогресс в геологии помогает нам определить местоположение ресурсов. Теперь мы можем сосредоточить наши усилия по добыче в местах, где есть большая вероятность того, что будут найдены большие объемы природных ресурсов."
 excavation4:0 "Раскопки IV"
 excavation4_desc:0 "Автоматизация ключевых процессов и развитие механики делает все наши сайты более эффективными."
 excavation5:0 "Раскопки V"
 excavation5_desc:0 "Достижения в таких областях, как наземная добыча полезных ископаемых, дают нам большую доходность ресурсов с наших текущих участков добычи."
 excavation_tech:0 "Раскопочные технологии"
 electronic_mechanical_engineering:0 "Электронная машиностроение"
 electronic_mechanical_engineering_desc:0 "Мы живем в эпоху, когда электрические машины не только согревают и освещают нас, но и помогают нам думать и общаться. Электроника станет ключом к военной разведке в следующем столетии."
 radio:0 "Радио"
 radio_desc:0 "Принятие изобретений радиолюбителей и расширение использования FM-радио уменьшит радиопомехи и позволит найти новые применения для радиотехники."
 improved_radio:0 "Улучшенное радио"
 improved_radio_desc:0 "Улучшение силы сигнала позволило радиостанциям транслироваться дальше, чем раньше."
 advanced_radio:0 "Расширенное радио"
 advanced_radio_desc:0 "Достижения в области радиотехники увеличили диапазон радиоприемников и даже сделали некоторые из них достаточно маленькими, чтобы их можно было носить с собой. Некоторые называют это Walkie-Talkie."
 radio_detection:0 "Радар"
 radio_detection_sp_2_tt:0 "$coordination_bonus$: §G+2%§!\n$MODIFIER_STATIC_ANTI_AIR_HIT_CHANCE_FACTOR$: §G+20%§!"
 radio_detection_desc:0 "Разработка RADAR, Radio Detection and Ranging, позволяет использовать радиоволны для обнаружения физических объектов. Исследования очень скрытны, учитывая влияние этих изобретений на определение местоположения единиц."
 radio_detection_unlock_tt:0 "Завершается завершением §Y$sp_air_radar$§! Экспериментальные исследования в §Y$land_facility$§!"
 cavity_magnatron:0 "Полость магнатрона"
 cavity_magnatron_desc:0 "Используя трубку, которая генерирует микроволны, называемую магнитопланом полости, мы можем значительно улучшить существующие радиолокационные системы, способные обнаруживать объекты, отскакивая от них волны."
 improved_cavity_magnatron:0 "Улучшенный десятиметровый радар"
 improved_cavity_magnatron_desc:0 "Использование радара уже доказало свою важность, но наши дециметрические радиолокационные установки слишком малы, чтобы обеспечить хорошее покрытие. Подборка большего количества блоков с радаром позволит нам максимизировать наше технологическое преимущество."
 decimetric_radar:0 "Декаметрический радар"
 decimetric_radar_desc:0 "Многие агрегаты полагаются на элемент неожиданности для своей эффективности. Разработка дециметрического радара позволяет лишить их этого преимущества."
 improved_decimetric_radar:0 "Улучшенный десятиметровый радар"
 improved_decimetric_radar_desc:0 "Использование радара уже доказало свою важность, но наши дециметрические радиолокационные установки слишком малы, чтобы обеспечить хорошее покрытие. Подборка большего количества блоков с радаром позволит нам максимизировать наше технологическое преимущество."
 centimetric_radar:0 "Центиметрический радар"
 centimetric_radar_desc:0 "Новые радары, работающие в микроволновых диапазонах, позволяют обнаруживать объекты, слишком малые для обнаружения предыдущими радарами."
 phased_array:0 "Поэтапный массив"
 phased_array_desc:0 "В отличие от традиционных радаров, которые полагаются на механические фазированные решетки вращения, используют электронику для управления лучом, что позволяет ему выполнять несколько функций одновременно, таких как отслеживание нескольких целей."
 monopulse_radar:0 "Монопульсовый радар"
 monopulse_radar_desc:0 "С помощью Monopulse Radar мы можем определить направление цели, сравнивая сигналы от нескольких антенн, улучшая обнаружение."
 improved_centimetric_radar:0 "Улучшенный центриметрический радар"
 improved_centimetric_radar_desc:0 "Внедрение передовых радиолокационных технологий, таких как монопульсные радары, в ключевых операциях позволит обеспечить максимальную точность слежения."
 advanced_centimetric_radar:0 "Продвинутый центриметрический радар"
 advanced_centimetric_radar_desc:0 "Несмотря на наши усовершенствованные радары, у противника все еще есть способы избежать обнаружения. Новые разработки, такие как радар Pulse-Doppler, позволяют нам устранить многие из этих ограничений в нашем оборудовании."
 mechanical_computing:0 "Механические вычисления"
 mechanical_computing_desc:0 "Построение машин, способных к продвинутому дифференциальному анализу, радикально изменит то, какие вычисления могут быть сделаны с помощью машины."
 computing_machine:0 "Компьютерная машина"
 computing_machine_desc:0 "Разработка теоретической основы для современных компьютеров и создание электромеханических машин для их практического применения станет первым шагом в этой области возможностей."
 improved_computing_machine:0 "Улучшенная вычислительная машина"
 improved_computing_machine_desc:0 "Теперь можно создавать электронные цифровые компьютеры, которые можно программировать. Несмотря на то, что эти машины все еще дороги и велики, они позволяют анализировать интеллект далеко за пределами человеческих возможностей."
 advanced_computing_machine:0 "Расширенная вычислительная машина"
 advanced_computing_machine_desc:0 "Начало работы на компьютерах, способных хранить программы и использовать транзисторы, поставит нас на путь цифровой революции, где эти машины могут использоваться практически в любой области."
 basic_encryption:1 "Шифрование — полиалфавитные шифры"
 basic_encryption_desc:0 "С появлением новых методов связи возникают новые риски перехвата. Машины шифра Ротора могут использоваться для быстрого и сложного шифрования."
 improved_encryption:1 "Шифрование — циклические перестановки"
 improved_encryption_desc:0 "Ограничение в рандомизации шифровальных машин может быть использовано для разрушения шифров. Улучшая случайность механики ротора, мы можем сделать этот вид криптоанализа более сложным."
 advanced_encryption:1 "Шифрование - модуляция импульсного кода"
 advanced_encryption_desc:0 "Технологические усовершенствования и накопленный опыт позволяют нам внедрять больше мер безопасности дорожного движения в нашем общении."
 basic_decryption:1 "Расшифровка - анализ частоты"
 basic_decryption_desc:0 "Криптанализ становится все более передовой математической наукой. Системы, такие как карточные каталоги и устройства, такие как циклометры, могут помочь в необходимой работе."
 improved_decryption:1 "Расшифровка - атака по боковым каналам"
 improved_decryption_desc:0 "Развитие более совершенных вычислительных машин позволяет по-новому применять методы криптоанализа, такие как разностный анализ, который в сочетании с новыми ручными методами дешифровки помогает взламывать сложные шифры."
 advanced_decryption:1 "Дешифрование - Автоматическая дедукция"
 advanced_decryption_desc:0 "Увеличенная вычислительная мощность, которая улучшила наш криптоанализ, угрожает создать почти неразрушимые шифры в будущем. Чтобы оставаться впереди, мы должны быть готовы более агрессивно работать над получением внутренней информации о технологии."
 experimental_rockets:0 "Экспериментальные ракеты"
 experimental_rockets_desc:0 "Продвижение науки о ракетостроении за счет повышения дальности и надежности жидкотопливных ракет научит нас достаточно технологии, чтобы позволить строительство стартовых площадок для более совершенных моделей."
 rocket_engines:0 "Ракетные двигатели"
 rocket_engines_desc:0 "Знания о ракетном двигателе достигают точки, когда мы можем создавать летающие бомбы и самолеты с ракетным двигателем, работающие на ранее недостижимых скоростях."
 improved_rocket_engines:0 "Улучшенные ракетные двигатели"
 improved_rocket_engines_desc:0 "Первые баллистические ракеты дальнего радиуса действия могут быть построены и сделаны еще более точными, достигая отдаленных вражеских городов и даже в космос."
 advanced_rocket_engines:0 "Передовые ракетные двигатели"
 advanced_rocket_engines_desc:0 "Будущее ракетостроения открывает такие возможности, как межконтинентальные ракеты, дальность действия которых знает несколько ограничений, в то время как полезная нагрузка становится все более смертоносной."
 atomic_research:0 "Атомные исследования"
 atomic_research_desc:0 "При ядерном делении расщепление атома дает огромное количество энергии и неограниченную разрушительную способность."
 rocket_interceptor:0 "Реактивный перехватчик"
 rocket_interceptor_desc:0 "Ракетные самолеты-перехватчики на основе планеров могут в течение коротких периодов времени двигаться быстрее, чем любой другой самолет. Несмотря на то, что волатильность топлива ставит под угрозу самолеты, они могут взлететь и реагировать на атаки быстрее, чем ожидает любой враг."
 rocket_interceptor_2:0 "Ракетный перехватчик II"
 rocket_interceptor_2_desc:0 "Все еще считающиеся чрезвычайно опасными для эксплуатации, истребители с ракетным двигателем теперь помогают автопилотами и буксировкой другими самолетами, чтобы максимизировать использование их экстремальной скорости, но короткого топливного окна."
 rocket_interceptor_3:0 "Ракетный перехватчик III"
 rocket_interceptor_3_desc:0 "Новые методы посадки и более безопасные топливные системы значительно улучшили шансы ракетных истребителей на успех и выживание, реализуя некогда теоретический потенциал этих передовых транспортных средств."
 nukes:0 "Ядерные бомбы"
 nukes_desc:0 "Проект по созданию атомной бомбы будет одной из самых секретных и трудных задач, которые может решить нация, но в случае успеха он может изменить не только ход сегодняшних войн, но и будущее мира."
 interwar_artillery:0 "Межвоенная артиллерия"
 interwar_artillery_desc:0 "Уроки, извлеченные при разработке различных видов артиллерии, могут быть перекрестно применены к проектированию других образцов."
 artillery1:0 "Артиллерия I"
 artillery1_desc:0 "С более современными материалами и механизмами гаубицы и полевые орудия Великой войны могут быть перезахоронены и модернизированы для современной войны."
 artillery2:0 "Улучшенная артиллерия I"
 artillery2_desc:0 "Обновление старых вещей может привести нас только к этому. Потребуются новые конструкции гаубицы, использующие преимущества новых устройств гидравлической отдачи и более длинных бочек."
 artillery3:0 "Обновление артиллерии II"
 artillery3_desc:0 "Чтобы включить более тяжелые пушки на более легких экипажах, конструкции гаубицы могут включать дульные тормоза."
 artillery4:0 "Артиллерия IV"
 artillery4_desc:0 "Разработка легковесной артиллерии, способной быть разбитой для транспортировки, позволит доставить артиллерийскую поддержку в районы, ранее труднодоступные."
 artillery5:0 "Улучшенная артиллерия"
 artillery5_desc:0 "Артиллерийские конструкции с более низкими силуэтами будут более сложными для противника."
 mountain_gun:0 "Горный пистолет"
 mountain_gun_desc:0 "Горная местность Северной Индии привела к разработке артиллерийского орудия, которое можно было демонтировать и переносить на мулабэке туда, где это было необходимо."
 rocket_artillery2:0 "Ракетная артиллерия модернизируется"
 rocket_artillery2_desc:0 "Самоходные артиллерийские установки с использованием реактивных снарядов смогут быстро вызывать крупномасштабные разрушения, сохраняя при этом мобильность во избежание встречного огня."
 rocket_artillery3:0 "Ракетная артиллерия модернизирована II"
 rocket_artillery3_desc:0 "Жертвуя дальность поражения, мы можем устанавливать более тяжелые ракеты на более крупные транспортные средства. Работая в командах, эти артиллерийские батареи могут быстро перезаряжаться и перемещаться."
 rocket_artillery4:0 "Ракетная артиллерия III"
 rocket_artillery4_desc:0 "Спин-стабилизированные ракеты могут увеличить дальность действия более легких артиллерийских батарей."
 interwar_antiair:0 "противовоздушный"
 antiair1:0 "Антивоздушная модернизация"
 antiair1_desc:0 "С более быстрыми механизмами перезарядки зенитные орудия, несущие большие патроны, все еще могут поддерживать необходимую скорость стрельбы."
 antiair2:0 "Противовоздушный II"
 antiair2_desc:0 "Для нацеливания на высоколетящие самолеты потребуются более длинные патроны и стволы на зенитных орудиях."
 antiair3:0 "Улучшенная антивоздушная модернизация I"
 antiair3_desc:0 "По мере совершенствования радиолокационных систем использование радиолокационного направления зенитных орудий становится более жизнеспособным. Сохранение этой технологии позволит нам сделать некоторые из самых точных систем противовоздушной защиты доступными."
 antiair4:0 "Улучшенная антивоздушная модернизация II"
 antiair4_desc:0 "Для быстрого реагирования на более быстрые самолеты потребуется сочетание современных систем радиолокации, компьютеризации и автозагрузчиков."
 antiair5:0 "Противовоздушный V"
 antiair5_desc:0 "Ракеты класса «земля-воздух» — это будущее зенитной войны. Разработка мобильной платформы для этого должна стать нашей следующей целью."
 interwar_antitank:0 "противотанковый"
 antitank1:0 "Обновление противотанковых"
 antitank1_desc:0 "Важность эффективного противотанкового оружия была установлена в Великой войне. Внедрение нового поколения этого оружия будет необходимо для борьбы с современными конструкциями танков."
 antitank2:0 "Антитанк II"
 antitank2_desc:0 "Большинство противотанковых пушек до сих пор довольно легкие. Для борьбы с более тяжелыми танками с наклонной броней потребуются пушки большего калибра."
 antitank3:0 "Улучшенное антитанковое обновление I"
 antitank3_desc:0 "Тепловые (высоковзрывные противотанковые) снаряды могут использоваться в противотанковой артиллерии, чтобы компенсировать ограниченную скорость морды."
 antitank4:0 "Улучшенная антитанковая модернизация II"
 antitank4_desc:0 "Новые универсальные противотанковые пушки, использующие бронебойные отбрасывающие выстрелы саботов, могут проникать в броню практически любого танка."
 antitank5:0 "Антитанковый V"
 antitank5_desc:0 "Объединив различные виды новой технологии боеприпасов с пушками с более высокими скоростями морды, мы можем быть готовы к любой новой брони, которую могут разработать наши враги."
 air_superiority:0 "Воздушное превосходство"
 air_superiority_desc:0 "Достижение превосходства в воздухе затруднит применение вражеских бомбардировщиков против нашей страны, позволит использовать наши бомбардировщики против наших врагов."
 formation_flying:0 "Формирование Flying"
 formation_flying_desc:0 "Летая в строю, самолеты могут оказывать поддержку друг другу или работать вместе, чтобы атаковать врагов."
 air_offense:0 "Истребитель Escorts"
 air_offense_desc:0 "Сосредоточив внимание на бомбардировках в течение дня, мы должны защитить наши бомбардировщики от перехвата истребителей. Обучение наших летчиков-истребителей тесному взаимодействию с бомбардировщиками позволит повысить их боевые возможности при защите бомбардировщиков в воздушном пространстве противника."
 fighter_baiting:0 "Истребитель Baiting"
 fighter_baiting_desc:0 "Появившись уязвимыми, наши истребители могут заманить вражеские самолеты в засады."
 dogfighting_experience:0 "Собачьи бои"
 dogfighting_experience_desc:0 "Нелегко отслеживать относительные позиции друзей и врагов в беспокойном вихре собачьей битвы, но по мере того, как наши пилоты получают опыт, они становятся более искусными в этом."
 fighter_ace_initiative:0 "Инициатива истребитель Ace"
 fighter_ace_initiative_desc:0 "Предоставление специальных наград и статуса пилотам, которые достигают статуса Эйса, сбивая пять врагов, стимулирует риск и вызывает чувство элиты у пилотов Эйса - хотя это, как правило, заставляет опытных пилотов оставаться на боевых позициях."
 multialtitude_flying:0 "Многовысотный полет"
 multialtitude_flying_desc:0 "Воздушные бои происходят в трех измерениях, но большинству пилотов труднее отслеживать самолеты, летящие над ними или под ними. Мы можем воспользоваться этим, расширив наши образования по вертикали."
 offensive_formations:0 "Наступательные формы"
 offensive_formations_desc:0 "Обучение в более наступательно ориентированных формированиях делает наших бойцов более смертоносными в бою."
 fighter_sweeps:0 "Истребитель Sweeps"
 fighter_sweeps_desc:0 "Агрессивное патрулирование истребителей над вражеской территорией может застать их самолеты, взлетающие или приземляющиеся, когда они особенно уязвимы, или нарушить учебные полеты противника."
 force_rotation:0 "Вращение силы"
 force_rotation_desc:0 "Боевые действия, или просто длительные периоды интенсивного сосредоточения, изнуряют, но, по возможности меняя силы, мы можем уменьшить ошибки из-за усталости пилота."
 air_defence:0 "Воздушная оборона"
 air_defence_desc:0 "Приучая наших пилотов постоянно быть начеку, даже когда, по-видимому, нет опасности, их шансы на перехват вражеских самолетов увеличиваются."
 dispersed_fighting:0 "Рассредоточенные бои"
 dispersed_fighting_desc:0 "Принятие более рассредоточенного формирования позволяет одному и тому же числу самолетов патрулировать большую площадь."
 forward_interception:0 "Вперед Интерцепция"
 forward_interception_desc:0 "Действуя ближе к воздушному пространству противника, становится более вероятным, что наши истребители смогут перехватить вражеские самолеты до того, как они достигнут своих целей."
 fighter_veteran_initiative:0 "Инициатива ветеранов-истребителей"
 fighter_veteran_initiative_desc:0 "Сосредоточение внимания на долгосрочном выживании пилотов, как с помощью разумной тактики, так и путем поворота опытных пилотов на учебные позиции, означает, что они могут передать уроки, которые они узнали новым пилотам."
 formation_fighting:0 "Формирование Борьба"
 formation_fighting_desc:0 "Полеты в правильных формациях позволяют нашим пилотам покрывать слепые пятна друг друга, что приводит к увеличению способности обнаруживать вражеские самолеты."
 air_skirmish:0 "Воздушное сражение"
 air_skirmish_desc:0 "К сожалению, не всегда возможно уничтожить каждый вражеский самолет, найденный над нашей страной, но можно преследовать их с момента их обнаружения до момента их ухода."
 home_defence:0 "Оборона родины"
 home_defence_desc:0 "Наблюдатели на земле, а также посты обнаружения и прослушивания работают совместно с нашими военно-воздушными силами для отслеживания и уничтожения вражеских вторжений."
 battlefield_destruction:0 "Уничтожение Battlefield"
 battlefield_destruction_desc:0 "В то время как ВВС могут наносить удары по далёким вражеским странам, они также могут быть очень полезны для непосредственной поддержки армии в боях."
 dive_bombing:0 "Бомбардировка дайвов"
 dive_bombing_desc:0 "Дайв-бомбардировка обеспечивает большую точность, но для достижения наилучших результатов требуются специализированные самолеты, способные замедлять погружения и выдерживать стрессы при вытягивании из них."
 direct_ground_support:0 "Прямая наземная поддержка"
 direct_ground_support_desc:0 "Тесно координируя пилотов CAS с наземными наблюдателями, воздушная огневая мощь может быть точно направлена на помощь войскам в бою."
 bomber_veteran_initiative:0 "Инициатива ветеранов бомбардировщиков"
 bomber_veteran_initiative_desc:0 "Политика передачи знаний ветеранам-пилотам новобранцам в значительной степени помогает их перспективам выживания."
 bomber_ace_initiative:0 "Инициатива Bomber Ace"
 bomber_ace_initiative_desc:0 "Формальное признание и награждение пилотов бомбардировщиков Ace поощряет смелость и инициативу."
 cas_veteran_initiative:0 "Инициатива ветеранов наземных атак"
 cas_veteran_initiative_desc:0 "Политика передачи знаний ветеранам-пилотам новобранцам в значительной степени помогает их перспективам выживания."
 cas_ace_initiative:0 "Инициатива Ace по наземным атакам"
 cas_ace_initiative_desc:0 "Формальное признание и награждение пилотов Ace CAS поощряет смелость и инициативу."
 hunt_and_destroy:0 "Охота и уничтожение"
 hunt_and_destroy_desc:0 "Помимо непосредственной огневой поддержки подразделения CAS могут самостоятельно охотиться за целями, часто неожиданно атакуя сухопутные войска противника по мере продвижения к линии фронта."
 naval_strike_torpedo_tactics:0 "Морской удар торпедной тактики"
 naval_strike_torpedo_tactics_desc:0 "Подготовка пилотов к более точному удару торпедами сделает наши воздушные налеты на вражеские корабли более эффективными."
 naval_strike_torpedo_tactics_oi:0 "Морской удар торпедной тактики"
 naval_strike_torpedo_tactics_oi_desc:0 "Подготовка пилотов к более точному удару торпедами сделает наши воздушные налеты на вражеские корабли более эффективными."
 naval_strike_tactics:0 "Морская ударная тактика"
 naval_strike_tactics_desc:0 "Подготовка пилотов к прогнозированию движения кораблей и координации атак сделает наши воздушные налеты на вражеские корабли более эффективными."
 low_echelon_support:0 "Поддержка низкого эшелона"
 low_echelon_support_desc:0 "Привлечение подразделений CAS непосредственно к небольшим наземным формированиям гарантирует, что они всегда будут иметь дополнительную огневую мощь, даже если они находятся вне досягаемости традиционной артиллерии."
 combat_unit_destruction:0 "Уничтожение боевой части"
 combat_unit_destruction_desc:0 "Обучение наших пилотов CAS неоднократно атаковать одну и ту же цель, пока она не будет подтверждена, гарантирует, что цели не останутся одни после почти промаха."
 operational_destruction:0 "Оперативное уничтожение"
 operational_destruction_desc:0 "Нападение на линии снабжения сухопутных войск противника препятствует их способности перемещаться между полями сражений. Это дает преимущество нашей армии, работая в районах, где у нас есть превосходство в воздухе."
 infrastructure_destruction:0 "Уничтожение инфраструктуры"
 infrastructure_destruction_desc:0 "Обучение наших пилотов наилучшим способам атаки на инфраструктуру, такие как железные дороги и мосты, делает тактические бомбардировки более эффективными."
 logistical_bombing:0 "Логистическая бомбардировка"
 logistical_bombing_desc:0 "Большее внимание к атакам на линии снабжения противника с воздуха дает большее преимущество нашим собственным сухопутным войскам в этом районе."
 battlefield_support:0 "Поддержка Battlefield"
 battlefield_support_desc:0 "Тактическим бомбардировщикам трудно атаковать цели вблизи того места, где находятся наши сухопутные войска в бою, поскольку уровень бомбардировок менее точен, чем пикирование бомб, но больше обучения и взаимодействия с наземными наблюдателями может помочь преодолеть эти проблемы."
 carousel_bombing:0 "Взрыв карусели"
 carousel_bombing_desc:0 "Бомбардировщики часто просто хотят сбросить все свои бомбы, как только они достигнут своей цели, а затем улететь домой как можно скорее. Хотя это может работать для бомбардировки местности, когда дело доходит до поражения небольшой цели, более эффективно задерживаться над целью, сбрасывая только часть их бомбовой нагрузки за раз для максимальной точности."
 keypoint_bombing:0 "Бомбардировка ключевых точек"
 keypoint_bombing_desc:0 "Точные бомбардировки ключевых точек на поле боя в поддержку наших сухопутных войск могут значительно помочь им победить противника."
 ground_support_integration:0 "Интеграция наземной поддержки"
 ground_support_integration_desc:0 "Полная интеграция наших тактических бомбардировщиков с наземными наблюдателями повышает их точность и позволяет им напрямую поддерживать наши сухопутные силы в бою."
 strategic_destruction:0 "Стратегическое разрушение"
 strategic_destruction_desc:0 "Наши пилоты могут получить доступ к стратегическим целям гораздо быстрее, чем наши военно-морские или сухопутные силы. Не имея средств для оснащения своих новобранцев, мы скоро будем превосходить численностью вражеские силы."
 high_level_bombing:0 "Бомбардировка высокого уровня"
 high_level_bombing_desc:0 "С больших высот мы можем избежать некоторых воздушных столкновений и зенитного оружия. Сбрасывание бомб выше требует большей точности, но это безопаснее."
 massed_bomber_formations:0 "Массированные бомбардировщики"
 massed_bomber_formations_desc:0 "Оставаясь в строю, наши бомбардировщики могут защитить свою группировку и увеличить наши шансы на успешные сбросы бомб."
 night_bombing:0 "Ночная бомбардировка"
 night_bombing_desc:0 "С ослаблением обороны противника и прикрытием наших бомбардировщиков тьмой мы можем оставаться наступательными и эффективными круглосуточно. Покажи врагу, насколько мы настойчивы.\n\n"
 dead_reckoning_bombing:0 "Мертвые считают бомбежку"
 dead_reckoning_bombing_desc:0 "Измеряя скорость, направление и дрейф с предыдущих позиций, мы можем вычислить более точные падения бомб даже ночью."
 infiltration_bombing:0 "Инфильтрационная бомбардировка"
 infiltration_bombing_desc:0 "Присоединение к вражеским формированиям или возвращение их домой на базу может показаться безумием. При достаточной практике это вполне возможно."
 pathfinder_groups:0 "Группы Pathfinder"
 pathfinder_groups_desc:0 "Пилоты-ветераны оснащены лучшими инструментами для освещения позиций цели. Ни дым, ни плохая погода не могут помешать бомбардировщикам выполнить свою миссию."
 day_bombing:0 "День бомбардировок"
 day_bombing_desc:0 "Сосредоточенные усилия в течение дня разрушительны из-за большого преимущества видимости. Проекция власти является желанным побочным эффектом.\n\n"
 escort_relay_system:0 "Эскорт-ретрансляторная система"
 escort_relay_system_desc:0 "Бомбардировщики в сопровождении бойцов значительно улучшают нашу способность реагировать на огонь противника."
 flying_fortress:0 "Флайинг Фортресс"
 flying_fortress_desc:0 "Подгоняем наши высоколетящие тяжелые бомбардировщики с пушками, чтобы защитить себя и достаточной броней, чтобы взять удар и все еще вернуться домой."
 mass_destruction:0 "Массовое уничтожение"
 mass_destruction_desc:0 "Бомбардировщики оснащены самым разрушительным оружием в больших количествах. Гарантировать результаты, даже если только несколько наших пилотов пройдут."
 fleet_in_being:0 "Флот в бытии"
 fleet_in_being_desc:0 "Корабли остаются в порту, где они безопаснее и вступают в бой с врагами только в подходящие моменты. Присутствие наших кораблей заставит врагов более неохотно брать наши порты.\n\n"
 battlefleet_concentration:0 "Концентрация боевого флота"
 battlefleet_concentration_desc:0 "Заходите на близлежащие корабли сразу после обнаружения вражеского судна. Скоординированный сфокусированный огонь быстро делает корабли противника бесполезными. Охотиться на них один за другим."
 battlefleet_concentration_ti:0 "Концентрация боевого флота"
 battlefleet_concentration_ti_desc:0 "Заходите на близлежащие корабли сразу после обнаружения вражеского судна. Скоординированный сфокусированный огонь быстро делает корабли противника бесполезными. Охотиться на них один за другим."
 subsidiary_carrier_role:0 "Роль дочернего перевозчика"
 subsidiary_carrier_role_desc:0 "Носители поддерживают линкоры, повышая их готовность к переходу от обороны к наступлению. Полезность авианосца как глаза в небе, так и мощной быстрой ударной силы хорошо дополняют более медленные линейные корабли."
 subsidiary_carrier_role_ti:0 "Роль дочернего перевозчика"
 subsidiary_carrier_role_ti_desc:0 "Носители поддерживают линкоры, повышая их готовность к переходу от обороны к наступлению. Полезность авианосца как глаза в небе, так и мощной быстрой ударной силы хорошо дополняют более медленные линейные корабли."
 hunter_killer_groups:0 "Группы охотников-убийц"
 hunter_killer_groups_desc:0 "Разрушители формируют группы для охоты на вражеские подводные лодки. Совместные усилия специалистов по разведке и охоте составляют фантастическую команду по убийству."
 floating_fortress:0 "Плавучая крепость"
 floating_fortress_desc:0 "С линкорами на высочайшей боевой готовности мы всегда будем готовы ответить, если враг осмелится угрожать нашим водам. Любой флот нуждается в прочном фундаменте, а мощь линкора не имеет себе равных."
 floating_fortress_ti:0 "Плавучая крепость"
 floating_fortress_ti_desc:0 "С линкорами на высочайшей боевой готовности мы всегда будем готовы ответить, если враг осмелится угрожать нашим водам. Любой флот нуждается в прочном фундаменте, а мощь линкора не имеет себе равных."
 floating_fortress_bs:0 "Плавучая крепость"
 floating_fortress_bs_desc:0 "С линкорами на высочайшей боевой готовности мы всегда будем готовы ответить, если враг осмелится угрожать нашим водам. Любой флот нуждается в прочном фундаменте, а мощь линкора не имеет себе равных."
 floating_airfield:0 "Плавающий аэродром"
 floating_airfield_desc:0 "Улучшенная интеграция авианосцев в наш флот позволяет нам быть готовыми к нанесению ударов как с моря, так и с воздуха. Важно, чтобы мы доминировали в воздухе, где бы мы ни находились."
 floating_airfield_ti:0 "Плавающий аэродром"
 floating_airfield_ti_desc:0 "Улучшенная интеграция авианосцев в наш флот позволяет нам быть готовыми к нанесению ударов как с моря, так и с воздуха. Важно, чтобы мы доминировали в воздухе, где бы мы ни находились."
 floating_airfield_bs:0 "Плавающий аэродром"
 floating_airfield_bs_desc:0 "Улучшенная интеграция авианосцев в наш флот позволяет нам быть готовыми к нанесению ударов как с моря, так и с воздуха. Важно, чтобы мы доминировали в воздухе, где бы мы ни находились."
 grand_battlefleet:0 "Большой боевой флот"
 grand_battlefleet_desc:0 "Обучение лидерству позволяет нашим командирам сохранять спокойствие в пылу боя даже при командовании огромными флотами. Наш флот раздавит любую оппозицию."
 convoy_sailing:0 "Парусный конвой"
 convoy_sailing_desc:0 "Введение обязательного парусного конвоя облегчит обнаружение набегов противника и своевременное реагирование. Безопасность в цифрах — это путь."
 convoy_sailing_ti:0 "Парусный конвой"
 convoy_sailing_ti_desc:0 "Введение обязательного парусного конвоя облегчит обнаружение набегов противника и своевременное реагирование. Безопасность в цифрах — это путь."
 convoy_sailing_bs:0 "Парусный конвой"
 convoy_sailing_bs_desc:0 "Введение обязательного парусного конвоя облегчит обнаружение набегов противника и своевременное реагирование. Безопасность в цифрах — это путь."
 convoy_escorts:0 "Эскорт конвоя"
 convoy_escorts_desc:0 "Быстрые надводные корабли в составе наших конвоев позволят нам обнаружить подводные лодки противника и вовремя отреагировать. Обнаружение является ключом к устранению подводных неудобств."
 convoy_escorts_bs:0 "Эскорт конвоя"
 convoy_escorts_bs_desc:0 "Быстрые надводные корабли в составе наших конвоев позволят нам обнаружить подводные лодки противника и вовремя отреагировать. Обнаружение является ключом к устранению подводных неудобств."
 escort_carriers:0 "Эскорт-перевозчики"
 escort_carriers_desc:0 "Область, охватываемая самолетами-перевозчиками, делает сопровождение торговых конвоев гораздо более легкой задачей. Важно обеспечить приток ресурсов."
 integrated_convoy_defence:0 "Интегрированная защита конвоя"
 integrated_convoy_defence_desc:0 "Улучшение координации военно-морского флота и авиации позволяет нам наносить удары по врагам за много миль до того, как они окажутся вблизи наших торговых конвоев. Это резко повысит эффективность парусного движения конвоя."
 integrated_convoy_defence_bs:0 "Интегрированная защита конвоя"
 integrated_convoy_defence_bs_desc:0 "Улучшение координации военно-морского флота и авиации позволяет нам наносить удары по врагам за много миль до того, как они окажутся вблизи наших торговых конвоев. Это резко повысит эффективность парусного движения конвоя."
 submarine_operations:0 "Подводные операции"
 submarine_operations_desc:0 "Нам не нужно вступать в бой с вражеским флотом, чтобы выиграть войну. Ударьте по их торговым конвоям, прежде чем они смогут отреагировать и исчезнуть под поверхностью. Вы не можете бороться с тем, что вы не видите."
 submarine_operations_bs:0 "Подводные операции"
 submarine_operations_bs_desc:0 "Нам не нужно вступать в бой с вражеским флотом, чтобы выиграть войну. Ударьте по их торговым конвоям, прежде чем они смогут отреагировать и исчезнуть под поверхностью. Вы не можете бороться с тем, что вы не видите."
 undersea_blockade:0 "Подводная блокада"
 undersea_blockade_desc:0 "Подводные лодки являются идеальным инструментом для сокращения притока важных сырьевых ресурсов противника. Мы нанесем ущерб производству противника и победим, отгоняя его с голоду."
 undersea_blockade_bs:0 "Подводная блокада"
 undersea_blockade_bs_desc:0 "Подводные лодки являются идеальным инструментом для сокращения притока важных сырьевых ресурсов противника. Мы нанесем ущерб производству противника и победим, отгоняя его с голоду."
 convoy_interdiction:0 "Запрет на конвой"
 convoy_interdiction_desc:0 "Улучшенная координация наших подводных лодок позволит им наносить удары по торговым конвоям в пути. Разрушение линий снабжения противника даст нам стратегическое преимущество."
 convoy_interdiction_ti:0 "Запрет на конвой"
 convoy_interdiction_ti_desc:0 "Улучшенная координация наших подводных лодок позволит им наносить удары по торговым конвоям в пути. Разрушение линий снабжения противника даст нам стратегическое преимущество."
 convoy_interdiction_bs:0 "Запрет на конвой"
 convoy_interdiction_bs_desc:0 "Улучшенная координация наших подводных лодок позволит им наносить удары по торговым конвоям в пути. Разрушение линий снабжения противника даст нам стратегическое преимущество."
 submarine_offensive:0 "Подводный наступательный"
 submarine_offensive_desc:0 "Достижение вершины связи между нашими подводными лодками позволяет им перейти в наступление. Давайте уничтожим вражеские торговые конвои быстрее, чем они смогут их заменить."
 submarine_offensive_bs:0 "Подводный наступательный"
 submarine_offensive_bs_desc:0 "Достижение вершины связи между нашими подводными лодками позволяет им перейти в наступление. Давайте уничтожим вражеские торговые конвои быстрее, чем они смогут их заменить."
 trade_interdiction:0 "Торговое вмешательство"
 trade_interdiction_desc:0 "Чем раньше мы обнаружим вражеские корабли, тем скорее мы сможем их уничтожить. Ударьте по их торговым конвоям и убежите, прежде чем они успеют отреагировать.\n\n"
 unrestricted_submarine_warfare:0 "Неограниченная подводная война"
 unrestricted_submarine_warfare_desc:0 "Пусть наши подводные лодки потопят любое судно без предупреждения, гражданское или нет. Хотя некоторые считают это нарушением правил ведения войны, нельзя отрицать ее эффективность."
 wolfpacks:0 "Волчьи стаи"
 wolfpacks_desc:0 "С нашими подводными лодками, организованными в пачки, координация между ними значительно улучшилась. Как только враг находится, наша подводная лодка ждет, пока прибудет остальная часть стаи, атакуя только тогда, когда шансы в подавляющем большинстве в нашу пользу."
 advanced_submarine_warfare:0 "Расширенная подводная война"
 advanced_submarine_warfare_desc:0 "Значительное улучшение связи между нашими подводными лодками позволяет им время атаки до совершенства. Когда они наконец увидят нас, это будет с тонущего корабля."
 combined_operations_raiding:0 "Объединённое рейдерство"
 combined_operations_raiding_desc:0 "Назначение всех ресурсов для охоты на вражеские торговые конвои. Координация между нашим основным флотом и подводными лодками делает наш флот всегда настороже. Ни один корабль не останется незамеченным в наших водах."
 raider_patrols:0 "Патрульные Рейдеры"
 raider_patrols_desc:0 "Патрули как быстрых, так и оружейных тяжелых кораблей не оставляют вражеских торговых конвоев нигде, где они могли бы спрятаться.\nОхотиться могут не только подводные лодки."
 capital_ship_raiders:0 "Рейдеры Capital корабль"
 capital_ship_raiders_desc:0 "С нашими самыми мощными кораблями на охоте за торговыми конвоями враг больше не найдет безопасности в цифрах. Они сидят утки, молясь, чтобы мы их не нашли."
 carrier_operations:0 "Перевозчик операций"
 carrier_operations_desc:0 "Перевозчики позволят нашим пилотам наносить удары по морю быстрее и легче, чем с наших авиабаз на суше. Мы нанесем удар, прежде чем они успеют отреагировать."
 naval_air_operations:0 "Военно-морские операции"
 naval_air_operations_desc:0 "Пилоты, обученные выполнять миссии с авианосцев, открывают для нас новый способ доминировать в морях. Самолеты являются эффективным способом истончения вражеского флота."
 base_strike:0 "Удар по базам"
 base_strike_desc:0 "Удары по портам противника подорвут их способность восстанавливать флот. Это позволит нам доминировать в морях по количеству.\n\n"
 carrier_primacy:0 "Приоритет авианосцев"
 carrier_primacy_desc:0 "Современные самолеты имеют большую дальность и точность, чем обычные морские пушки. Интегрируйте авианосцы в наш флот и доминируйте в морях с неба."
 carrier_task_forces:0 "Целевые группы перевозчиков"
 carrier_task_forces_desc:0 "Организованные оперативные группы с авианосцами и легкими крейсерами гарантируют, что враг никогда не застанет нас врасплох."
 massed_strikes:0 "Массированные забастовки"
 massed_strikes_desc:0 "Пилоты, обученные для полетов на авианосцах, позволят даже переполненному авианосцу функционировать бесперебойно, роя противника и значительно повышая его эффективность в морских сражениях. Носитель должен работать как хорошо смазанная машина, где каждый знает свою роль."
 carrier_battlegroups:0 "Боевые группы авианосец"
 carrier_battlegroups_desc:0 "Авианосцы способны наносить удары по врагу с дистанции, недоступной любому корабельному орудию, а глаза в небе не позволят застать нас врасплох. Массовое применение авианосцев — сила, с которой придётся считаться."
 escort_patrols:0 "Эскорт Патрули"
 escort_patrols_desc:0 "Улучшение обнаружения делает наш конвой гораздо более смертоносным для подводных лодок. Негде спрятаться, они не представляют реальной угрозы."
