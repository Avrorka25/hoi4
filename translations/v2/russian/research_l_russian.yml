 mio_cat_tech_medium_armor_and_modules:0 "Технологии средней брони"
 mio_cat_tech_heavy_armor_and_modules:0 "Тяжелая бронетехника"
 mio_cat_all_artillery_equipment:0 "Все артиллерийские технологии"
 mio_cat_all_light_fighter_and_modules:0 "Все боевые технологии"
 mio_cat_all_cas_and_modules:0 "Все технологии CAS"
 mio_cat_all_naval_bomber_and_modules:0 "Все морские бомбардировщики"
