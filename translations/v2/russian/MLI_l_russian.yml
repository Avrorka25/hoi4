 r56_mali.1.t:0 "[MLI.getNameDef] хочет, чтобы мы вступили в Федерацию Мали"
 r56_mali.1.desc:0 "[MLI.getAdjective] правительство, проводя нечто вроде панафриканской политики, предлагает союз между нашими странами. Это будет означать наше включение в федеративное государство Мали."
 r56_mali.1.a:0 "Вместе мы будем сильнее"
 r56_mali.1.b:0 "Это всего лишь замаскированная аннексия."
 r56_mali.2.t:0 "[FROM.getNameDef] вступила в Федерацию!"
 r56_mali.2.desc:0 "[FROM.getAdjective] правительство согласилось с нашими федералистскими взглядами и присоединится к нашему большому движению."
 r56_mali.2.a:0 "Превосходно!"
 r56_mali.3.t:0 "[FROM.getNameDef] отклонила наше предложение!"
 r56_mali.3.desc:0 "Выступая против идеи федерации, [FROM.getAdjective] правительство [FROM.getLeader] отклонило наше предложение, вызвав волнения внутри страны."
 r56_mali.3.a:0 "Это лишь временная неудача."
