l_russian:
 BALTIC_events.1.t:0 "[From.GetNameDefCap] просит гарантий"
 BALTIC_events.1.d:0 "Сегодня утром [Root.GetLeader] была доставлена телеграмма от [From.GetNameDef] с просьбой к [Root.GetNameDef] возобновить гарантии независимости [From.GetAdjective]. Ссылаясь на давнюю дружбу между [Root.GetNameDef] и [From.GetNameDef], существующую с момента основания государства в 1918 году, [From.GetLeader] настаивает, что выживание [From.GetLeader.GetHerHis] нации необходимо для сохранения мира в Восточной Европе.\n\nНа фоне растущей напряжённости между [From.GetNameDef] и [SOV.GetNameDefCap] принятие предложения [From.GetLeader] может втянуть [Root.GetNameDef] в конфликт с [SOV.GetAdjective]ами…"
 BALTIC_events.1.a:0 "Мы будем защищать наши [From.GetAdjective] Друзья."
 BALTIC_events.1.b:0 "Мы не поддерживаем ни [From.GetLeader], ни [From.GetLeader.GetHerHis] правительство."
 BALTIC_events.101.t:0 "[From.GetNameDefCap] соглашается!"
 BALTIC_events.101.d:0 "[From.GetLeader] объявляет о [From.GetHerHis] поддержке дальнейшей независимости [Root.GetAdjective] и вступит в любой конфликт, угрожающий существованию [Root.GetNameDef]."
 BALTIC_events.101.a:0 "Мы в безопасности."
 BALTIC_events.102.t:0 "[From.GetNameDefCap] отказывает!"
 BALTIC_events.102.d:0 "К большому разочарованию [Root.GetLeader], [From.GetAdjective] Министерство иностранных дел решило не поддерживать военные отношения с [Root.GetNameDef]."
 BALTIC_events.102.a:0 "Придётся искать другое решение."
 BALTIC_events.2.t:0 "[From.GetNameDefCap] предлагает сотрудничество стран Балтии"
 BALTIC_events.2.d_baltic:0 "[From.GetLeader] и [From.GetHerHis] Кабинет приблизился к [Root.GetAdjective] Правительство с предложением официально оформить слабо организованную Прибалтийскую Антанту в военный союз. Подписание соглашения означало бы, что во время войны наши вооруженные силы объединятся и вместе столкнутся с угрозой нашему суверенитету.\n\nНесмотря на оборонительный характер, [From.GetLeader] В конце концов, она надеется превратить Балтийское Антанту в фракцию, простирающуюся от Риги до Осло, хотя такие амбиции кажутся маловероятными."
 BALTIC_events.2.d_scandi:0 "[From.GetLeader] и [From.GetHerHis] Кабинет приблизился к [Root.GetAdjective] Правительство с предложением официально оформить слабо организованную Прибалтийскую Антанту в военный союз. Подписание соглашения означало бы, что во время войны наши вооруженные силы объединятся и вместе столкнутся с угрозой нашему суверенитету.\n\n[From.GetLeader] «Как только угроза на их границе завоюет то, что они хотят от Прибалтики, Скандинавия, безусловно, станет следующей страной в их амбициях войны, и мы будем мудры, чтобы держаться вместе в эти времена глобального конфликта», — сказал он."
 BALTIC_events.2.a:0 "Мы присоединимся!"
 BALTIC_events.2.b:0 "Полагаю, у нас есть варианты получше."
 BALTIC_events.202.a:0 "Как они смеют нам отказывать!"
 BALTIC_events.203.t:0 "Балтийская Антанта распущена!"
 BALTIC_events.203.d:0 "Неспособность собрать достаточно поддержки, чтобы выдержать [SOV.GetAdjective] вторжение, [From.GetLeader] Он решил отказаться от идеи Балтийской Антанты и вместо этого искать другие варианты. К большому коллективному разочарованию нашей нации, к мечте о противостоянии [SOV.GetAdjective] Армия вместе с друзьями в [From.GetNameDef] Остается только это; Мечта."
 BALTIC_events.203.a:0 "Разочаровывает."
 BALTIC_events.3.t:0 "[From.GetNameDefCap] просит о прямом вмешательстве"
 BALTIC_events.3.d:0 "Гражданская война между [From.GetLeader]? [From.GetAdjective] Народная армия и заблуждающийся пролетариат воюют от имени [From.GetNonIdeologyName]Буржуазная диктатура бушует, но кажется, что [From.GetLeader] Он доказал, что не способен привести революцию к победе в одиночку. Сообщение было доставлено на стол [Root.GetLeader] из которого [Root.GetAdjective] Посол в [From.GetNonIdeologyName]выражая озабоченность по поводу будущего [From.GetAdjective] Революционеры. Он считает, что если эта гражданская война будет побеждена, она положит конец всякой надежде на успех социализма. [From.GetNonIdeologyName]."
 BALTIC_events.3.a:0 "Необходимо прямое вмешательство!"
 BALTIC_events.3.b:0 "Пролетариат может освободить себя только сам."
 BALTIC_events.301.t:0 "[From.GetNameDefCap] отказывается вмешиваться"
 BALTIC_events.301.d:0 "Наши друзья и союзники из [From.GetNameDef] ответили отказом на просьбу [Root.GetLeader] о прямом вмешательстве. [From.GetLeader] заявляет, что рабочие [Root.GetAdjective] должны освободить себя самостоятельно, а любое прямое вмешательство со стороны [From.GetNameDef] будет расценено как акт империализма."
 BALTIC_events.301.a:0 "[From.GetLeader.GetSheHeCap] Есть точка зрения."
 BALTIC_events.4.t:0 "Коммунисты идут на [Root.Capital.GetName]!"
 BALTIC_events.4.d:0 "The [Root.GetAdjective] Люди все больше разочаровываются в правительстве, и сегодня на улицах [Root.Capital.GetName]Напряженность достигла точки кипения. Протесты, выражающие недовольство режимом и обращением с гражданами низшего класса, приводят к нескольким насильственным столкновениям. [Root.GetAdjective] Военная полиция, протестующие в конце концов достигли [Root.Capital.GetName]Парламентское здание во время сессии, проведенной [Root.GetLeader] и нескольких ключевых членов [Root.GetRulingParty] Вечеринка. Протестующие четко выдвигают свои требования. вытеснять [Root.GetLeader] и [Root.GetLeader.GetHerHis] [Root.GetRulingParty] Партии от правительства, или столкнуться с жестокой революцией."
 BALTIC_events.4.a:0 "У нас нет выбора."
 BALTIC_events.4.b:0 "Отречься? Никогда!"
 BALTIC_events.5.t:0 "[From.GetNameDefCap] стремится создать [From.GetNonIdeologyName]-Беларусь"
 BALTIC_events.5.d:0 "Вдохновившись примером недолго просуществовавшей Литовско-Белорусской ССР, [From.GetLeader] стремится объединить [From.GetNameDef] с Белорусской ССР. [From.GetLeader.GetSheHeCap] утверждает, что объединение двух наций значительно расширит возможности [From.GetNameDef] служить мировой революции, устранив преграду между Востоком и Западом."
 BALTIC_events.5.a:0 "Вдохновляющая идея!"
 BALTIC_events.5.b:0 "Беларусь останется [Root.GetAdjective]."
 BALTIC_events.501.t:0 "[From.GetNameDefCap] соглашается!"
 BALTIC_events.501.d:0 "Слово вернулось из [From.GetNameDef] В отношении к [Root.GetAdjective] Заявление о создании объединенного [Root.GetNonIdeologyName]- Белорусская ССР.[From.GetLeader] Вдохновлена возможностями, которые предоставляет это объединение между континентальной восточной Европой и балтийской нацией, утверждая, что такой союз неизбежно устранит разрывы между Востоком и Западом, ослабив способность распространять революцию по всему континенту."
 BALTIC_events.501.a:0 "[Root.GetNonIdeologyName] становится больше!"
 BALTIC_events.502.t:0 "[From.GetNameDefCap] отказывает!"
 BALTIC_events.502.d:0 "Хотя изначально Литовско-Белорусская ССР создавалась для преодоления разрыва между Востоком и Западом, похоже, [From.GetLeader] больше не считает это необходимым и заявляет, что Беларусь является неотъемлемой частью СССР, которая не может быть передана [Root.GetNameDef]."
 BALTIC_events.502.a:0 "По крайней мере, мы попытались."
 BALTIC_events.503.t:0 "Пропагандистская война в Беларуси"
 BALTIC_events.503.d:0 "Пытаясь возродить наследие Литовско-Белорусской ССР, [From.GetNameDef] стремится дестабилизировать правительство Беларуси, призывая его членов перейти на сторону [From.GetNonIdeologyName]!"
 BALTIC_events.503.a:0 "Мы скоро с этим разберёмся."
 BALTIC_events.6.t:0 "[From.GetNameDefCap] предлагает объединить страны Балтии"
 BALTIC_events.6.d:0 "Страны Балтии издавна объединяет история общих страданий и угнетения под сапогом иностранных империалистов, но теперь этому пришёл конец. [Root.GetNameDefCap] и [From.GetNameDef] освобождены социализмом, однако [From.GetLeader] утверждает, что это ещё не гарантирует дальнейшего выживания Балтии. [From.GetLeader.GetSheHeCap] заявляет, что, пока страны Балтии разделены национальными границами, они остаются слабыми и уязвимыми перед империализмом и капитализмом, и лишь объединившись в Единую Балтийскую Республику, смогут выдержать натиск иностранных захватчиков."
 BALTIC_events.6.a:0 "[From.GetLeader] прав, мы должны объединиться!"
 BALTIC_events.6.b:0 "Об этом не может быть и речи! [Root.GetNonIdeologyName] останется [Root.GetAdjective]!"
 BALTIC_events.601.t:0 "[From.GetNameDefCap] отказывается!"
 BALTIC_events.601.d:0 "[From.GetLeader] Он откликнулся на [Root.GetAdjective] просьба объединиться с откровенным отвращением и отказом. Хотя многие уважают [From.GetNameDef]Право на самоуправление неопровержимо, что Прибалтика будет жить лучше как единая сила, чем как разделенная."
 BALTIC_events.601.a:0 "Мы спасём их от них самих."
 BALTIC_events.601.b:0 "В конце концов, у них есть право на самоопределение."
 BALTIC_events.7.t:0 "[From.GetNameDefCap] Запросы a [baltic_wargoal_target.GetAdjective] вторжение"
 BALTIC_events.7.d:0 "[From.GetNameDefCap], [Root.GetAdjective] Ворота в Западную Европу предложили план вторжения [baltic_wargoal_target.GetNameDef] от имени [Root.GetNameDefCap]. [From.GetLeader] Утверждает, что a [baltic_wargoal_target.GetAdjective] Вторжение было бы неоценимым в наших совместных усилиях по распространению революции по всей Европе и открыло бы больше возможностей для расширения после того, как революция будет осуществлена. [baltic_wargoal_target.GetAdjective] Правительство было демонтировано."
 BALTIC_events.7.a:0 "Великолепно!"
 BALTIC_events.7.b:0 "Революция может подождать."
 BALTIC_events.701.t:0 "[From.GetNameDefCap] Блоки [baltic_wargoal_target.GetAdjective] вторжение"
 BALTIC_events.701.d:0 "The [Root.GetAdjective] Просить о вторжении [baltic_wargoal_target.GetNonIdeologyName] была заблокирована [From.GetNameDef]. Ссылаясь на то, что вторжение будет дорогостоящим и совсем не стоит того, чтобы [From.GetAdjective] и [Root.GetAdjective] Жизни, которые стоили бы, [baltic_wargoal_target.GetNameDef] Сегодня не будет коммунистических революционных сил."
 BALTIC_events.701.a:0 "Ну и ладно..."
 BALTIC_events.11.t:0 "Пропаганда «Лесных братьев»"
 BALTIC_events.11.d:0 "Ряд антикоммунистических публикаций попал в руки коммунистов. [Root.GetAdjective] граждан по всей нашей стране. Эта пропаганда нападает на саму сущность [Root.GetLeader], характеризующий [Root.GetLeader.GetHerHim] Быть предателем и предателем [SOV.GetAdjective] актив. Характер этих публикаций прославляет [Root.GetAdjective] Национализм, отрицающий международные ценности коммунистической революции. Без сомнения, националистические настроения подкреплялись подпольным распространением этих публикаций."
 BALTIC_events.11.a:0 "Предатели!"
 BALTIC_events.12.t:0 "Крупный налёт «Лесных братьев» в регионе [forest_brothers_raid_state_target.GetName]"
 BALTIC_events.12.d:0 "Они появились словно из ниоткуда и нанесли удары по нескольким крупным промышленным зонам в регионе [forest_brothers_raid_state_target.GetName], серьёзно повредив находившееся там оборудование. К счастью, атака произошла ночью, когда фабрики были закрыты, однако ущерб государственной собственности оказался огромным."
 BALTIC_events.12.a:0 "Все они — классовые предатели."
 BALTIC_events.13.t:0 "Стычка с «Лесными братьями»"
 BALTIC_events.13.d:0 "Во время патрулирования региона [forest_brothers_raid_state_target.GetName] гарнизонные силы попали в засаду, устроенную «Лесными братьями». Хотя понесённый нами урон был в целом незначительным, новости о стычке быстро распространились среди местных жителей, и многие начинают видеть в «Лесных братьях» защитников национализма [Root.GetAdjective], бросающих вызов легитимности [Root.GetLeader]."
 BALTIC_events.13.a:0 "Будь они прокляты!"
 BALTIC_events.14.t:0 "«Лесные братья» похищают снаряжение"
 BALTIC_events.14.d:0 "За последние несколько недель ряд винтовок и другой военной техники исчезли с производственных линий, пробираясь из заводов, не дойдя до рук военных. [Root.GetAdjective] Красная Армия. Источником этого недостающего оборудования были Лесные братья. Хотя правительство теперь знает о виновнике этого преступления, потребуется несколько недель, чтобы затянуть бразды правления на производственных линиях и убедиться, что ни одна пуля не попадет в ствол винтовки Лесного Брата."
 BALTIC_events.14.a:0 "Мы покончим с этими предателями!"
 BALTIC_events_7_tt:0 "Произойдёт событие «§Y[Root.GetNameDefCap] просит о вторжении в Финляндию§!»."
 BALTIC_events_8_tt:0 "Произойдёт событие «§Y[Root.GetNameDefCap] просит о вторжении в Данию§!»."
 BALTIC_events_9_tt:0 "Произойдёт событие «§Y[Root.GetNameDefCap] просит о вторжении в Швецию§!»."
 BALTIC_events_10_tt:0 "Произойдёт событие «§Y[Root.GetNameDefCap] просит о вторжении в Польшу§!»."
 BALTIC_events_15_tt:0 "Произойдёт событие «§Y[Root.GetNameDefCap] просит о вторжении в Литву§!»."
 BALTIC_events_16_tt:0 "Произойдёт событие «§Y[Root.GetNameDefCap] просит о вторжении в Латвию§!»."
 BALTIC_events_17_tt:0 "Произойдёт событие «§Y[Root.GetNameDefCap] просит о вторжении в Эстонию§!»."
 BALTIC_events.18.t:0 "Пропагандистская война"
 BALTIC_events.18.d:0 "[From.GetNameDefCap] начал оказывать влияние [Root.GetAdjective] Политика, распространение коммунистической пропаганды по нашим улицам и вооружение диссидентов. Лишь противодействуя этой пропаганде, мы можем надеяться на ее полный запрет и избавление от нее. [From.GetAdjective] Угроза."
 BALTIC_events.18.a:0 "[Root.GetNameDefCap] никогда не станет коммунистической!"
 BALTIC_events.19.t:0 "[SOV.GetNameDefCap] передаёт нам [BALTIC_country_to_transfer.GetNonIdeologyName]"
 BALTIC_events.19.desc:0 "Великий день для [ROOT.GetNameDef]! После доблестной кампании наших товарищей [SOV.GetNameDefCap] справедливо объявляет, что недавно освобождённая [BALTIC_country_to_transfer.GetNonIdeologyName] вместе с её отважными рабочими переходит под нашу юрисдикцию.[GetExtraBalticTerritories]\n\nЭто ещё на один шаг приближает нас к созданию единого Балтийского государства, достаточно могущественного, чтобы дать отпор врагам рабочего класса."
 BALTIC_events.19.extra:0 "Кроме того, они также передали контроль над своими оккупированными территориями. [BALTIC_loose_territory_country.GetNonIdeologyAdjective] Мы должны продолжать доказывать, что мы достойны того, чтобы стать постоянными надзирателями. [BALTIC_loose_territory_country.GetNonIdeologyName]."
 BALTIC_events.19.a:0 "Это естественный выбор!"
 BALTIC_entente_events.1.t:0 "[From.GetNonIdeologyName] инвестирует в Балтийский союз"
 BALTIC_entente_events.1.d:0 "Как лидер Балтийского союза, [From.GetNameDef] профинансировала новую инициативу для государств — членов союза. Финансирование принесёт взаимную выгоду [Root.GetNameDef] и [From.GetNameDef] и демонстрирует приверженность дальнейшей свободе и развитию наших народов!"
 BALTIC_entente_events.1.a:0 "Вместе мы становимся сильнее."
 BALTIC_entente_events.1.b:0 "Возможность восстановить демократию!"
 BALTIC_entente_events.6.t:0 "[From.GetNonIdeologyName] предлагает объединение"
 BALTIC_entente_events.6.d:0 "Балтийская Антанта значительно преобразилась со времён своего создания как свободного союза прибалтийских государств. Теперь страны Балтии настолько тесно связаны политически, что почти стали единым государством. [From.GetLeader], по всей видимости, предлагает превратить этот союз в полноценную страну, объединив балтийские государства как в военном, так и в гражданском управлении."
 BALTIC_entente_events.6.a:0 "Превосходная инициатива!"
 BALTIC_entente_events.6.b:0 "Ни в коем случае!"
 LIT_events.1.t:0 "[SOV.GetAdjective]-[LIT.GetAdjective] раздел [POL.GetNameDef]"
 LIT_events.1.d:0 "Совершенно ясно, что [LIT.GetLeader] стремится воссоединить [LIT.GetAdjective] государство с его старой столицей Вильнюсом. Поскольку в одиночку [LIT.GetAdjective]ы почти не представляют угрозы для [POL.GetNameDef], они предлагают разделить страну совместно с [Root.GetNameDef]: [POL.GetAdjective] Украина и Белоруссия перейдут к [Root.GetNameDefCap], а Вильнюс вернётся [LIT.GetNameDef].\n\n[POL.GetNameDefCap], разумеется, может отвергнуть совместный ультиматум, но такой отказ приведёт к войне между [POL.GetNameDef] и [Root.GetNameDef]."
 LIT_events.1.a:0 "Великолепное предложение!"
 LIT_events.1.b:0 "Мы не станем заключать соглашения с [LIT.GetLeader]."
 LIT_events.101.t:0 "[SOV.GetAdjective]-[LIT.GetAdjective] ультиматум"
 LIT_events.101.d:0 "С 1920 года Вильно находится под контролем [Root.GetNameDef], что неизменно раздражает [LIT.GetNameDef], считающую город законной столицей своей страны. Однако напряжение достигло предела, и при поддержке не кого иного, как [SOV.GetLeader], литовцы теперь требуют разделить Восточную Польшу между [SOV.GetAdjective]ами и Литвой. Если мы согласимся, то отдадим всю Восточную Польшу, но если откажемся, то станем главной целью [SOV.GetAdjective]-[LIT.GetAdjective] коалиции."
 LIT_events.101.a:0 "Мы сдаёмся!"
 LIT_events.101.b:0 "Только после боя!"
 LIT_events.102.t:0 "[From.GetNameDefCap] соглашается!"
 LIT_events.102.d:0 "[SOV.GetNameDefCap] согласилась присоединиться к разделу [POL.GetNameDef], и теперь остаётся лишь предъявить наши требования [POL.GetAdjective] стороне."
 LIT_events.102.a:0 "Вильнюс уже почти наш!"
 LIT_events.103.t:0 "[From.GetNameDefCap] отказывает!"
 LIT_events.103.d:0 "[SOV.GetNameDefCap] отказалась участвовать вместе с нами в разделе [POL.GetNameDef]. Хотя мы всё ещё можем начать войну с [POL.GetNameDef], наши министры уверены, что такая война закончится поражением."
 LIT_events.103.a:0 "Будь они прокляты!"
 LIT_events.104.t:0 "[POL.GetNameDefCap] отказывается!"
 LIT_events.104.d:0 "Несмотря на подавляющее превосходство сил противника, [POL.GetNameDef] отказалась подчиниться нашим требованиям!"
 LIT_events.104.a:0 "Значит, будет война!"
 LIT_events.104.b:0 "Это не стоит таких усилий."
 LIT_events.2.t:0 "[From.GetNameDefCap] просит мира"
 LIT_events.2.d:0 "Хотя вооружённого конфликта уже несколько лет не было, [Root.GetNonIdeologyName] и [From.GetNonIdeologyName] формально так и не заключили мирный договор. Сегодня [From.GetLeader] попросил, чтобы [From.GetNameDef] и [Root.GetNameDef] прекратили вражду и впредь выступали союзниками против растущей угрозы на их общих границах. Хотя [From.GetLeader] по-прежнему считает Вильно законной столицей [From.GetNonIdeologyName], [From.GetLeader.GetSheHe] заявил, что в интересах обеих стран официально сложить оружие и объявить мир."
 LIT_events.2.a:0 "[From.GetLeader.GetSheHeCap] Есть точка зрения."
 LIT_events.2.b:0 "Не думаю."
 LIT_events.201.d:0 "[From.GetLeader], похоже, разделяет мнение министров [Root.GetAdjective] и решил пока установить дружественный мир с [Root.GetNameDef]. Вместе с миром вступает в силу взаимная гарантия независимости. В военное время мы сможем рассчитывать на помощь наших друзей из [From.GetNameDef]!"
 LIT_events.201.a:0 "Отлично!"
 LIT_events.202.d:0 "[From.GetNameDefCap] отказалась заключать какой-либо официальный мирный договор с [Root.GetNameDef]. Похоже, эта холодная война будет продолжаться бесконечно."
 LIT_events.202.a:0 "Что ж, возможно, мы не примем отказ."
 LIT_events.3.t:0 "[From.GetNameDefCap] просит о вечном мире"
 LIT_events.3.d:0 "Главным предметом разногласий между [Root.GetNonIdeologyName] и [From.GetNonIdeologyName] в течение последнего десятилетия была оккупация [From.GetNonIdeologyName]ской исторической столицы Вильнюса силами [Root.GetAdjective]. Теперь, когда между двумя странами установились дружественные отношения, [From.GetLeader] предлагает вечный мир при условии, что [Root.GetNameDef] передаст Вильнюс и откажется от всех претензий на [From.GetAdjective] территории. Отказ станет разочарованием, но, по словам [From.GetLeader], не заставит [From.GetNonIdeologyName] начать войну с [Root.GetNameDef]."
 LIT_events.3.a:0 "Звучит разумно."
 LIT_events.3.b:0 "Какая нелепость."
 LIT_events.301.d:1 "Наконец между [Root.GetNonIdeologyName] и [From.GetNonIdeologyName] достигнуты мирные соглашения, и конфликт, который с момента основания [Root.GetNameDef] зачастую тлел в относительной тишине, похоже, подошёл к концу. Хотя мечты о Речи Посполитой всё ещё живут в сердцах многих [From.GetAdjective] граждан, нас заверяют, что это будет новая Речь Посполитая — основанная на взаимном уважении между союзниками."
 LIT_events.301.a:0 "Мир для нашего поколения!"
 LIT_events.302.d:0 "[From.GetLeader] отказался признать притязания [Root.GetNameDef] на историческую столицу [Root.GetAdjective]. Хотя это не положит конец мирным отношениям между двумя странами, несомненно, что решение вновь пробудило недоверие [Root.GetNameDef] к своему бывшему противнику."
 LIT_events.302.a:0 "Разочаровывает."
 LIT_events.4.t:0 "[From.GetNameDefCap] предлагает право размещения войск!"
 LIT_events.4.d:0 "Опасаясь вторжения, министры [From.GetNameDef] предложили разрешить войскам [Root.GetAdjective] размещаться в пределах [From.GetNonIdeologyName]. Взамен правительство [From.GetAdjective] ожидает, что [Root.GetNameDef] защитит его от любого, кто станет угрожать суверенитету страны. Однако, когда войска уже находятся на её территории, [From.GetNameDef] едва ли сможет противиться любым требованиям [Root.GetAdjective]…"
 LIT_events.4.a:0 "Похоже на прекрасную возможность!"
 LIT_events.4.b:0 "Пожалуй, нет."
 LIT_events.401.d:0 "[From.GetNameDefCap] отвергла наше щедрое предложение, заявив, что не желает быть втянутой в какие-либо конфликты ради [Root.GetNonIdeologyName]."
 LIT_events.5.t:0 "[From.GetNameDefCap] требует [784.GetName]"
 LIT_events.5.desc:0 "Со времён Виленского наступления 1919 года традиционная столица Литвы находится в руках [Root.GetNameDef], и в последующие десятилетия это оставалось источником разногласий между нашими странами.\n\nИз-за города велась холодная война, и сегодня [From.GetLeader] пригрозил, что, если город не будет передан [From.GetNameDef], война станет неизбежной.\n\nГород имеет для нас ограниченную ценность, однако он символизирует последние отголоски прежней Речи Посполитой. Неужели ради мира мы готовы отказаться от мечты о Польше-Литве?"
 LIT_events.5.a:0 "Это бесполезный город. Забирайте."
 LIT_events.5.b:0 "Мы никогда не сдадимся."
 LIT_events.501.t:0 "Вильнюс возвращён!"
 LIT_events.501.desc:0 "[From.GetNameDefCap] согласилась на мирное возвращение Вильнюса, официально положив конец десятилетиям холодной войны между нашими странами. С возвращением Вильнюса Литва наконец вновь стала единой."
 LIT_events.502.desc:0 "Как и ожидалось, [From.GetNameDef] отвергла требование [Root.GetLeader] вернуть Вильнюс [Root.GetNameDef]. Хотя дипломатия потерпела неудачу, [Root.GetLeader] пока не исключает возможности войны, и на фоне растущей напряжённости на границе она кажется неизбежной."
 LIT_events.502.a:0 "Война? Я называю это агрессивными переговорами."
 LIT_events.6.t:0 "[From.GetNameDefCap] предлагает Польско-литовскую лигу превосходства"
 LIT_events.6.d:0 "Сегодня из [From.Capital.GetName] прибыла телеграмма с предложением объединить [Root.GetNonIdeologyName] и [From.GetNonIdeologyName] в новый альянс, способный соперничать как с [GER.GetNameDef], так и с [SOV.GetNameDef]. Будучи националистическими государствами, зажатыми между двумя великими державами, обе страны дипломатически изолированы от ведущих держав Европы, а демократические страны Запада едва ли захотят вступать в конфликт ради защиты двух фашистских государств.\n\n[From.GetLeader] предлагает альтернативу многолетним конфликтам, определявшим отношения между [Root.GetAdjective] и [From.GetAdjective] с момента возникновения их государств. [From.GetLeader.GetSheHeCap] предлагает объединить наши страны в Польско-литовскую лигу превосходства — альянс, основанный на принципах Речи Посполитой, но превозносящий добродетели национализма."
 LIT_events.6.a:0 "Как вдохновляюще!"
 LIT_events.6.b:0 "Пожалуй, нет."
 LIT_events.601.t:0 "[From.GetNameDef] вступает в Лигу"
 LIT_events.601.d:0 "Как и ожидалось, поляки согласились вступить в Польско-литовскую лигу превосходства. Хотя это ещё не окончательное видение Литвой судьбы Польши, данный шаг станет важнейшим началом в обеспечении будущего стран Балтии."
 LIT_events.601.a:0 "Всё складывается как надо."
 LIT_events.602.t:0 "[From.GetNameDefCap] отвергает Лигу"
 LIT_events.602.d:0 "К изумлению министров [Root.GetAdjective], [From.GetNameDef] отказалась вступать в Польско-литовскую лигу превосходства. Похоже, напряжённость между двумя странами вовсе не приблизилась к ослаблению, а отказ сотрудничать, вероятно, приведёт к возвращению вооружённого конфликта в ближайшем будущем."
 LIT_events.602.a:0 "Возможно, их придётся убедить."
 LIT_events.7.t:0 "[From.GetNameDefCap] просит принять [POL.GetAdjective] государство в [Root.GetFactionName]"
 LIT_events.7.d:0 "Продолжая добиваться сотрудничества между [From.GetAdjective] и [POL.GetAdjective], министр иностранных дел [From.GetAdjective] сегодня обратился к представителям [Root.GetAdjective] с просьбой пригласить [POL.GetNameDef] в [Root.GetFactionName]."
 LIT_events.7.a:0 "Великолепное предложение!"
 LIT_events.7.b:0 "У нас другие планы на Польшу."
 LIT_events.701.t:0 "[From.GetNameDefCap] блокирует вступление [POL.GetAdjective] государства в [From.GetFactionName]"
 LIT_events.701.d:0 "К сожалению, похоже, руководство [From.GetFactionName] считает вступление [POL.GetAdjective] государства в [From.GetFactionName] помехой интересам альянса. Очевидно, у [From.GetNameDef] есть другие планы на [POL.GetNameDef]."
 LIT_events.701.a:0 "Ну и ладно."
 LIT_events.8.t:0 "[From.GetNameDefCap] призывает к объединению"
 LIT_events.8.d:0 "Представители [Root.GetAdjective] уже давно стремятся восстановить прежнюю Речь Посполитую, но литовцы неизменно отвечали отказом. Однако сегодня [From.GetLeader] принял историческое решение предложить воссоединение Польши и Литвы. Странно лишь то, что предложение не ставит поляков и литовцев в равное положение: фактически [From.GetLeader] станет абсолютным диктатором обеих стран."
 LIT_events.8.a:0 "Я готов пойти на такую жертву."
 LIT_events.8.b:0 "Ни за что."
 LIT_events.801.t:0 "[From.GetNameDefCap] соглашается!"
 LIT_events.801.d:0 "В ответ на просьбу [Root.GetAdjective] о воссоединении [From.GetLeader] сложил полномочия диктатора Польши и передал власть [Root.GetLeader]. Речь Посполитая воссоединена, и это знаменует исторический поворот в общей судьбе [From.GetNameDef] и [Root.GetNameDef]."
 LIT_events.801.a:0 "Превосходно."
 LIT_events.802.t:0 "[From.GetNameDefCap] отказывается"
 LIT_events.802.d:0 "Похоже, поляки ещё не готовы воссоединиться с [Root.GetNameDef]. Несмотря на попытки [Root.GetNameDefCap] представить союз как восстановление прежней Речи Посполитой, министры [From.GetAdjective] остались совершенно непреклонны."
 LIT_events.802.a:0 "Возможно, поляков придётся убедить."
 LIT_events.9.t:0 "[From.GetNameDefCap] просит передать ей оккупацию Польши"
 LIT_events.9.d:0 "Ссылаясь на долгую историю сотрудничества Польши и Литвы, [From.GetLeader] предположил, что оккупация Польши силами [Root.GetFactionName] пройдёт без осложнений, если передать её под единоличное управление [From.GetNameDef]. Это лишит нас ценных польских ресурсов, но зато польское сопротивление станет проблемой Литвы."
 LIT_events.9.a:0 "Не вижу причин отказывать."
 LIT_events.9.b:0 "Мы не согласны."
 LIT_events.901.t:0 "[From.GetNameDefCap] передаёт управление оккупированной Польшей"
 LIT_events.901.d:0 "Просьба [Root.GetAdjective] передать управление оккупированной Польшей была удовлетворена [From.GetNameDef]. Генералы и солдаты [From.GetAdjective] возвращаются в [From.GetNonIdeologyName] для перераспределения по фронтам, а их место в гарнизонах бывших польских областей занимают солдаты [Root.GetAdjective]."
 LIT_events.901.a:0 "Слава Литве!"
 LIT_events.902.t:0 "[From.GetNameDefCap] отказывает"
 LIT_events.902.d:0 "Просьба [Root.GetAdjective] передать управление оккупированной Польшей была категорически отвергнута [From.GetNameDef]. Попытку получить контроль над польской оккупацией сочли стремлением [Root.GetLeader] завладеть основными промышленными районами Польши и подорвать притязания [From.GetAdjective] на польские территории."
 LIT_events.902.a:0 "Попытаться стоило."
 LIT_events.10.t:0 "Гражданская война фалангистов"
 LIT_monarchy_events.1.t:0 "Дилемма двух королей"
 LIT_monarchy_events.1.desc:0 "Поскольку на престолах Польши и Литвы теперь восседают короли, любые надежды на мирное объединение Речи Посполитой кажутся крайне маловероятными. Однако теперь, когда обе страны идеологически едины, возможно, существует иной путь вперёд. При желании мы можем предложить [POL_or_LIT_target.GetLeader] союз наших двух государств — своего рода дипломатическое переосмысление Речи Посполитой. Вместе мы сможем двигаться вперёд как друзья, но порознь одному из нас придётся пасть как врагу."
 LIT_monarchy_events.1.a:0 "Союз кажется предпочтительнее."
 LIT_monarchy_events.1.b:0 "Остаться должен только один!"
 LIT_monarchy_events.101.t:0 "[From.GetLeader] отвергает мир"
 LIT_monarchy_events.101.desc:0 "Несмотря на наши попытки найти мирное решение, [From.GetLeader] отказался вступать в дружественные отношения с нашей страной, заявив: «Король [From.GetNonIdeologyName] может быть только один». Похоже, война с государством [From.GetNameDef] теперь неизбежна."
 LIT_monarchy_events.101.a:0 "Как нецивилизованно."
 LIT_monarchy_events.2.t:0 "Король Миндаугас III"
 LIT_monarchy_events.2.desc:0 "4 июня 1918 года Вильгельм Карл фон Урах был демократически избран королём Литвы подавляющим большинством голосов, однако вмешательство Германской империи привело к аннулированию референдума, и Литва так и не соединилась со своим королём. Однако у покойного монарха остался сын, и теперь, когда германское господство над Литвой становится далёким воспоминанием, [Root.GetLeader] направил приглашение Карлу Геро фон Ураху стать новым королём Литвы!\n\nМолодой монарх был коронован как Миндаугас III, и хотя сейчас его роль носит лишь церемониальный характер, уже существуют планы по усилению новой литовской монархии."
 LIT_monarchy_events.2.a:0 "Да здравствует король!"
 LIT_monarchy_events.2_tt:0 "§YМиндаугас III§! становится королём государства [Root.GetNonIdeologyName], а §Y[Root.GetLeader]§! остаётся лидером партии [Root.GetRulingParty]"
 LAT_events.1.t:0 "Истинный враг"
 LAT_events.1.d:0 "Несмотря на независимость, государству [Root.GetNameDef] так и не удалось по-настоящему сбросить оковы империализма. И [GER.GetAdjective]е, и [SOV.GetAdjective]е правители стремятся включить [Root.GetNameDef] в свои империи, совершенно не считаясь с правом [Root.GetNameDef] на самоопределение. Хотя многие готовы воевать на всех фронтах ради сохранения независимости [Root.GetAdjective]ой нации, мы должны решить, какая из этих двух держав представляет наиболее серьёзную угрозу, и принять соответствующие меры для подготовки к вторжению."
 LAT_events.1.a:0 "[SOV.GetNameDefCap] — вот истинная угроза!"
 LAT_events.1.b:0 "Нельзя доверять государству [GER.GetNameDef]."
 LAT_events.8.t:0 "Латвия в огне"
 LAT_events.8.d:0 "Решение правительства снять запрет с фашистской организации «Громовой крест» придало Густавсу Целминьшу и его сторонникам уверенности, сделав их ещё активнее и агрессивнее по всей Латвии. Сегодня это насилие достигло апогея: члены «Перконкрустса» вооружились и двинулись на Ригу, требуя немедленной капитуляции латвийского правительства.\n\nХотя ясно, что правительство намеревалось сотрудничать с «Перконкрустсом», похоже, эта организация вовсе не собирается включать [Root.GetLeader] в свой режим."
 LAT_events.8.a:0 "Мы раздавим этих предателей!"
 LAT_events.8.b:0 "За сильную Латвию!"
 nsb_coup.0.t:0 "Заговор в офицерском корпусе?"
 nsb_coup.0.desc:0 "Хотя ни для кого не секрет, что некоторые наши генералы недовольны положением дел в государстве [Root.GetNameDef], похоже, часть из них начала задумываться о более решительных способах урегулирования наших разногласий. Состоялось несколько встреч различных офицеров в неизвестном месте, предположительно где-то в регионе [?.Root.meeting_location.GetName]. \n\nПодробностей мало, но у нас есть основания полагать, что [coup_member_1.GetName] и [coup_member_2.GetName] входят в эту группу. Считается, что последний поддерживает связь с [coup_member_3.GetName], хотя точный характер их отношений неясен."
 nsb_coup.0.a:0 "Мы должны докопаться до истины."
 nsb_coup.1.t:0 "[Root.GetLeader] захватывает власть"
 nsb_coup.1.desc:0 "После нескольких недель тщательной подготовки группа офицеров во главе с [Root.GetLeader] сегодня привела в исполнение план [Root.GetOperationName], направленный на захват власти. \n\nДолгая подготовка окупилась: верные [Root.GetLeader] части быстро взяли под контроль все важнейшие правительственные здания. Местная охрана и полиция, столкнувшись с подавляющим превосходством сил, сдались без единого выстрела. Блокпосты вокруг столицы задержали всех министров, пытавшихся бежать. \n\nТеперь, когда прежнее правительство надёжно заключено под стражу, [Root.GetLeader] поставил остальную часть государства [Root.GetNameDef] перед свершившимся фактом. Ожидается, что местные власти быстро подчинятся."
 nsb_coup.1.a:0 "Лично я приветствую наших новых правителей."
 GER_operation_1:0 "Унтернемен «Валькирия»"
 GER_operation_2:0 "Унтернемен «Шляйфштайн»"
 GER_operation_3:0 "Унтернемен «Штиркампф»"
 GER_operation_4:0 "Унтернемен «Эрценгель»"
 USA_operation_1:0 "Операция «Солнечный удар»"
 USA_operation_2:0 "Операция «Карнавал»"
 USA_operation_3:0 "Операция «Чернильница»"
 USA_operation_4:0 "Операция «Дикая кошка»"
 ENG_operation_1:0 "Операция «Рапира»"
 ENG_operation_2:0 "Операция «Сладкая рыба»"
 ENG_operation_3:0 "Операция «Шут»"
 ENG_operation_4:0 "Операция «Превосходство»"
 generic_operation_1:0 "План действий 1"
 generic_operation_2:0 "План действий 2"
 generic_operation_3:0 "План действий 3"
 generic_operation_4:0 "План действий 4"
 nsb_coup.2.t:0 "Попытка переворота провалилась"
 nsb_coup.2.desc:0 "После нескольких недель подготовки прошлой ночью группа офицеров приказала привести в исполнение план [Root.GetOperationName], направленный на захват власти. \n\nПохоже, им пришлось начать действовать раньше времени, из-за чего операция была проведена поспешно и плохо скоординированно. Не зная об изменениях в расписании караула, группа верных заговорщикам солдат прибыла в кабинет [Root.GetLeader] с приказом арестовать или убить — как раз в момент смены караула, и потому столкнулась с вдвое большим числом охранников, чем ожидалось. Последовавшая перестрелка была короткой и жестокой: несколько солдат с обеих сторон были убиты или ранены, а [Root.GetLeader] удалось спастись.\n\nС тех пор [Root.GetLeader] появился на публике и выступил по радио, продемонстрировав, что покушение провалилось. После краха переворота некоторые офицеры нашей армии покончили с собой, чтобы избежать ареста, другие погибли, оказав сопротивление прибывшим за ними подразделениям, а командиры различных гарнизонов присягнули на верность [Root.GetLeader]."
 nsb_coup.2.a:0 "И эти люди хотели управлять страной?"
 nsb_coup.3.t:0 "Офицеры пытаются совершить переворот"
 nsb_coup.3.desc:0 "После нескольких недель подготовки прошлой ночью группа офицеров приказала привести в исполнение план [Root.GetOperationName], направленный на захват власти. \n\nПохоже, им пришлось начать действовать раньше времени, и события быстро вышли из-под контроля. Попытка арестовать или убить [Root.GetLeader] провалилась, а кольцо блокпостов вокруг столицы ещё не успело замкнуться, когда многочисленные чиновники правительства бежали.\n\nПравительство государства [Root.GetNameDef] продолжит борьбу, а [Root.GetLeader] поклялся привлечь предателей к ответу — любыми необходимыми средствами."
 nsb_coup.3.a:0 "Мы раздавим этот мятеж!"
 LAT_events.2.t:0 "[From.GetNameDefCap] требует аннексии [Root.GetAdjective]"
 LAT_events.2.d:0 "Ссылаясь на растущее напряжение в Прибалтике, [From.GetLeader] заявил, что объединение Балтийских стран является абсолютной необходимостью для дальнейшего выживания всех трёх государств. Однако требования министра иностранных дел государства [From.GetNameDef] не только отстранят [Root.GetLeader] от власти, но и фактически полностью подчинят всю партию [Root.GetRulingParty] лидеру [From.GetLeader] и [From.GetLeader.GetHerHis] администрации."
 LAT_events.2.a:0 "Разве у нас есть выбор?"
 LAT_events.2.b:0 "Ни в коем случае!"
 LAT_events.3.t:0 "[From.GetNameDefCap] поддерживает [Root.GetAdjective] национализм"
 LAT_events.3.d:1 "В своей воодушевляющей речи о природе балтийской солидарности [From.GetLeader] похвалил [Root.GetLeader] за [Root.GetLeader.GetHerHis] приверженность национализму перед лицом нарастающей большевистской угрозы. Хотя [From.Getleader.GetSheHe] утверждает, что уважает самобытность народов [From.GetAdjective] и [Root.GetAdjective], [From.Getleader.GetSheHe] призвал к сотрудничеству между [From.GetNonIdeologyName] и [Root.GetNonIdeologyName] ради общей цели — сохранения независимости. Пока это мало что значит, но многие полагают, что предложение о союзе уже не за горами."
 LAT_events.3.a:0 "Любопытно."
 LAT_events.5.t:0 "[From.GetLeader] стремится объединить Остланд"
 LAT_events.5.d:0 "Теперь, когда Западная Белоруссия прочно находится под контролем альянса [Root.GetFactionName], диктатор государства [From.GetNonIdeologyName] заявил о желании создать оккупационную зону Остланд под управлением [From.GetAdjective]. Обоснованием такого предложения служит распространение фашистской идеологии в Прибалтике и Белоруссии, а также продвижение интересов альянса [Root.GetFactionName] на востоке."
 LAT_events.5.a:0 "Вдохновляюще!"
 LAT_events.5.b:0 "Нет."
 LAT_events.501.t:0 "[From.GetNameDefCap] передаёт Остланд"
 LAT_events.501.d:0 "Передача территорий Остланда под контроль государства [Root.GetAdjective] прошла успешно, и [From.GetNameDef] согласилось, что оккупация Балтийских стран и Западной Белоруссии должна находиться исключительно во владении государства [Root.GetNameDef]."
 LAT_events.501.a:0 "Превосходно!"
 LAT_events.502.t:0 "[From.GetNameDefCap] отказывает"
 LAT_events.502.d:0 "Требование государства [Root.GetAdjective] передать ему власть над оккупацией Остланда было категорически отвергнуто государством [From.GetNameDef]. Попытку взять под контроль оккупацию Остланда расценили как стремление [Root.GetLeader] установить власть над крупнейшими населёнными центрами Востока и подорвать позиции государства [From.GetNameDef]."
 LAT_events.502.a:0 "Печальный день для Латвии."
 LAT_events.6.t_both:0 "[From.GetNameDefCap] просит принять Балтийские страны в альянс [Root.GetFactionName]"
 LAT_events.6.d_both:0 "Сегодня [From.GetNameDefCap] обратилось с просьбой пригласить все Балтийские страны в альянс [Root.GetFactionName]. Ссылаясь на впечатляющие успехи национализма в государствах [LIT.GetNameDef] и [EST.GetNameDef], а также на естественное стремление к балтийскому сотрудничеству, [From.GetLeader] страстно призвал правительство государства [Root.GetAdjective] признать [LIT.GetLeader] и [EST.GetLeader] союзниками националистического дела."
 LAT_events.6.t_estonia:0 "[From.GetNameDefCap] просит принять государство [EST.GetAdjective] в альянс [Root.GetFactionName]"
 LAT_events.6.d_estonia:0 "Сегодня [From.GetNameDefCap] обратилось с просьбой пригласить государство [EST.GetNonIdeologyName] в альянс [Root.GetFactionName]. Ссылаясь на впечатляющие успехи национализма в государстве [EST.GetNameDef] и естественное стремление к балтийскому сотрудничеству, [From.GetLeader] страстно призвал правительство государства [Root.GetAdjective] признать [EST.GetLeader] союзником националистического дела."
 LAT_events.6.t_lithuania:0 "[From.GetNameDefCap] просит принять государство [LIT.GetAdjective] в альянс [Root.GetFactionName]"
 LAT_events.6.d_lithuania:0 "Сегодня [From.GetNameDefCap] обратилось с просьбой пригласить государство [LIT.GetNonIdeologyName] в альянс [Root.GetFactionName]. Ссылаясь на впечатляющие успехи национализма в государстве [LIT.GetNameDef] и естественное стремление к балтийскому сотрудничеству, [From.GetLeader] страстно призвал правительство государства [Root.GetAdjective] признать [LIT.GetLeader] союзником националистического дела."
 LAT_events.6.a:0 "Какая прекрасная идея!"
 LAT_events.6.b:0 "Какая чушь."
 LAT_events.601.t:0 "[From.GetNameDefCap] отказывает Балтийским странам во вступлении в альянс [From.GetFactionName]"
 LAT_events.601.d:0 "Хотя государство [Root.GetNameDef] было принято в альянс [From.GetFactionName] с распростёртыми объятиями, похоже, [From.GetLeader] не хранит в [From.GetLeader.GetHerHis] сердце ни капли сочувствия к праву наших балтийских братьев защищать себя. Наше предложение пригласить собратьев-балтов было отклонено, и пока наши страны останутся разобщёнными."
 LAT_events.601.a:0 "Ну и ладно."
 LAT_events.7.t:0 "Партия [Root.GetFascistParty] идёт маршем на [Root.Capital.GetName]!"
 LAT_events.7.d:0 "Получив широкую поддержку фашистского правительства государства [From.GetNameDef], сторонники партии [Root.GetFascistParty] собрались на улицах города [Root.Capital.GetName] с явно насильственными намерениями. В конце концов мятежники добрались до здания парламента города [Root.Capital.GetName], где в тот момент проходило заседание с участием [Root.GetLeader] и нескольких ключевых членов партии [Root.GetRulingParty], и начали скандировать требования об отставке [Root.GetLeader]."
 LAT_events.7.a:0 "Разогнать этот сброд!"
 LAT_events.7.b:0 "Возможно, [Root.GetLeader] стоит уйти в отставку."
 EST_events.1.t:0 "[From.GetNameDefCap] стремится заключить договоры о дружбе"
 EST_events.1.d:0 "Опасаясь вторжения государства [SOV.GetAdjective], [From.GetLeader] направил официальный запрос о заключении договора между государствами [Root.GetNameDef] и [From.GetNameDef]. Договор будет включать гарантии ненападения, а также ряд дружественных соглашений, призванных укрепить сотрудничество между [Root.GetNonIdeologyName] и [From.GetNonIdeologyName]."
 EST_events.1.a:0 "Хорошее предложение."
 EST_events.1.b:0 "У нас другие планы на государство [From.GetNameDef]."
 EST_events.101.t:0 "[From.GetNameDefCap] соглашается"
 EST_events.101.d:0 "[From.GetLeader] явно понимает ценность возможного будущего союза между государствами [Root.GetNameDef] и [From.GetNameDef] и согласился развивать дружественные отношения с нашей страной."
 EST_events.101.a:0 "Превосходно."
 EST_events.102.t:0 "[From.GetNameDefCap] отказывает"
 EST_events.102.d:0 "Несмотря на все усилия [Root.GetLeader], похоже, государство [From.GetNameDef] остаётся врагом для [Root.GetNonIdeologyName]. Хотя их отказ сейчас мало что значит, в случае вторжения государства [SOV.GetAdjective] это может означать, что [From.GetNameDef] просто останется в стороне."
 EST_events.102.a:0 "Проклятье."
 EST_events.2.t:0 "[From.GetNameDefCap] стремится к объединению"
 EST_events.2.d:0 "Сегодня [From.GetLeader] выдвинул предложение об объединении государств [From.GetNameDef] и [Root.GetNameDef]. Нельзя отрицать, что правительство государства [From.GetAdjective] и государство [Root.GetNameDef] неразрывно связаны. Без вапсов партия [Root.GetFascistParty] едва ли смогла бы захватить власть в государстве [Root.GetNonIdeologyName], и даже сейчас симпатии к вапсам остаются сильны в нашей армии. [From.GetLeader] утверждает, что союз Финляндии и Эстонии позволит нашим странам лучше подготовиться к грядущему вторжению государства [SOV.GetAdjective]."
 EST_events.2.a:0 "У нас нет выбора."
 EST_events.2.b:0 "Немедленно изгнать вапсов!"
 EST_events.201.t:0 "[From.GetNameDefCap] принимает объединение"
 EST_events.201.d:0 "[From.GetLeader] Мы приняли мудрое решение разрешить объединение наших двух народов.[From.GetLeader] Ушел в отставку как глава [From.GetAdjective] Правительство в пользу [Root.GetLeader] и взял на себя более заместительную роль в новом объединенном [Root.GetAdjective]-[From.GetAdjective] правительство."
 EST_events.201.a:0 "Замечательно!"
 EST_events.202.t:0 "[From.GetNameDefCap] отвергает объединение с государством [Root.GetAdjective]"
 EST_events.202.d:0 "Несмотря на огромное влияние вапсидского правительства государства [Root.GetNonIdeologyName] на государство [From.GetNameDef], [From.GetLeader] отверг попытки государства [Root.GetAdjective] добиться объединения."
 EST_events.202.a:0 "Это ненадолго!"
 EST_events.4.t:0 "[From.GetNameDefCap] стремится к объединению Балтийских стран"
 EST_events.4.d:0 "Балтийские государства нередко разделяли общую историю угнетения со стороны иностранных держав: поляков, немцев, русских. Но [From.GetLeader] заявляет, что этому пришёл конец! Хотя идеалы национализма и самоопределения горят в сердцах всех балтийских народов, [From.GetLeader] убедительно утверждает, что многовековое чужеземное господство объясняется лишь нашей разобщённостью. И как бы многие ни жаждали независимости, растущая угроза вторжения государства [SOV.GetAdjective] требует, чтобы наши правительства приняли ту или иную форму паннационализма.\n\n[From.GetLeader.GetSheHeCap] предлагает создать государство [BAL_UNIFIED_fascism], чтобы сохранить наш народ свободным и сильным перед лицом чужеземцев, которые осмелятся вновь попытаться нас поработить."
 EST_events.4.a:0 "Возможно, между нами больше общего, чем различий."
 EST_events.4.b:0 "Общебалтийская идентичность? Такой не существует!"
 EST_events.401.t:0 "[From.GetNameDefCap] соглашается!"
 EST_events.401.d:0 "[From.GetLeader] был успешно убеждён усилиями государства [Root.GetAdjective] по формированию общебалтийской национальной идентичности и согласился объединить партию [From.GetFascistParty] с партией [Root.GetFascistParty]. Это крупная победа на пути к цели [Root.GetLeader] — объединению Балтийских стран, и теперь государство [Root.GetNameDef], несомненно, сможет гораздо лучше защититься от вторжения государства [SOV.GetAdjective]."
 EST_events.401.a:0 "[From.GetNonIdeologyName] — лишь начало."
 EST_events.402.t:0 "[From.GetNameDefCap] отвергает объединение"
 EST_events.402.d:0 "Не впечатлившись речами [Root.GetLeader] о балтийской солидарности, государство [From.GetNameDef] отказалось объединяться с государством [Root.GetNameDef], посчитав это не более чем актом империализма, призванным лишить народ государства [From.GetAdjective] права иметь собственное государство [From.GetNonIdeologyName] для народа [From.GetNonIdeologyAdjective]."
 EST_events.402.a:0 "Они предпочитают присоединиться к государству [SOV.GetAdjective]? Предатели!"
 EST_events.5.t:0 "[From.GetNameDefCap] посягает на независимость государства [Root.GetAdjective]"
 EST_events.5.d:0 "Сегодня [From.GetLeader] открыто выступил против правительства государства [Root.GetAdjective], назвав его слабым и неспособным защитить собственный народ от иностранных империалистов. Пока это мало что значит, но мы можем ожидать, что вторжение государства [From.GetAdjective] уже не за горами."
 EST_events.5.a:0 "[From.GetLeader] — всего лишь пустозвон."
 EST_events.6.t:0 "[From.GetNameDefCap] просит принять государство [FIN.GetAdjective] в альянс [Root.GetFactionName]"
 EST_events.6.d:0 "Сегодня [From.GetNameDefCap] обратилось с просьбой пригласить государство [FIN.GetNonIdeologyName] в альянс [Root.GetFactionName]. Ссылаясь на впечатляющие успехи национализма в этой стране и естественное стремление к финно-эстонскому сотрудничеству, [From.GetLeader] страстно призвал правительство государства [Root.GetAdjective] признать [FIN.GetLeader] союзником националистического дела."
 EST_events.6.a:0 "Какая прекрасная идея!"
 EST_events.6.b:0 "Какая чушь."
 EST_events.601.t:0 "[From.GetNameDefCap] отказывает государству [FIN.GetAdjective] во вступлении в альянс [From.GetFactionName]"
 EST_events.601.d:0 "Хотя государство [Root.GetNameDef] было принято в альянс [From.GetFactionName] с распростёртыми объятиями, похоже, [From.GetLeader] не хранит в [From.GetLeader.GetHerHis] сердце ни капли сочувствия к праву государства [FIN.GetNameDef] защищать себя. Наше предложение пригласить финнов было отклонено, и пока наши страны останутся разобщёнными."
 EST_events.601.a:0 "[From.GetLeader] безумен или просто некомпетентен?"
 EST_events.7.t:0 "Гражданская война вапсов"
 EST_events.7.d:0 "Постоянные марши и демонстрации по всему городу наконец разрушили последние остатки единства в государстве [Root.GetNonIdeologyName], и страна погрузилась в полномасштабную гражданскую войну. То, что должно было стать незначительным подавлением групп партии [Root.GetFascistParty], вчера переросло в ожесточённое столкновение с протестующими, когда ветераны сошлись в бою с солдатами армии государства [Root.GetAdjective], за которую когда-то сами сражались. С одной стороны выступают члены партии [Root.GetFascistParty], с другой — сторонники правительства. Остаётся лишь увидеть, кто к концу дня будет править из города [Root.Capital.GetName]: [Root.GetLeader] или [neutral_EST_civil_war.GetLeader]..."
 EST_events.7.a:0 "За государство [Root.GetNonIdeologyName]!"
 EST_events.9.b:0 "Возможно, лучше просто сдаться..."
 EST_events.701.t:0 "[Root.GetLeader] уходит в отставку"
 EST_events.701.d:0 "Марши вапсидских демонстрантов по всей стране сегодня достигли точки кипения, когда столкновения между представителями правительства [Root.GetLeader] и вапсами завершились кровопролитием. Под звуки голоса Артура Сирка протестующие выбили ворота Рийгикогу и быстро возвели импровизированные баррикады, не позволяя силам правопорядка проникнуть в здание\nМногие эстонцы ожидали, что [Root.GetLeader] ответит протестующим силой, но, к изумлению всей страны, сегодня в здание Рийгикогу поступило письмо [Root.GetLeader] об отставке, в котором он уступал пост диктатора Артуру Сирку."
 EST_events.701.a:0 "Эстония стала сильнее."
 EST_events.801.t:0 "Хаотичный марш в регионе [From.GetName]"
 EST_events.801.d:0 "Демонстрация партии [Root.GetFascistParty] в регионе [From.GetName] вызвала неоднозначную реакцию общественности и жестокое противодействие местных властей. Мало кто в толпе вообще понимал, чему посвящён марш, а столкновения между протестующими и контрпротестующими затмили его первоначальную цель. Правительство государства [Root.GetAdjective] уже работает над искоренением партии [Root.GetFascistParty], и сегодняшние события, вероятно, лишь ускорили этот процесс, почти не принеся движению новых сторонников."
 EST_events.801.a:0 "Это катастрофа."
 EST_events.802.t:0 "Марш в регионе [From.GetName]"
 EST_events.802.d:0 "Марш партии [Root.GetFascistParty] по региону [From.GetName] прошёл сравнительно спокойно. Избегая крупных населённых пунктов и сосредоточившись на сельской местности региона [From.GetName], партия [Root.GetFascistParty] смогла показать жителям государства [Root.GetName], за что выступает движение, и при этом избежать преследования со стороны властей государства [Root.GetAdjective]."
 EST_events.802.a:0 "Любопытно."
 EST_events.803.t:0 "Массовый фашистский марш в регионе [From.GetName]"
 EST_events.803.d:0 "По всему региону [From.GetName] сторонники партии [Root.GetFascistParty] массово вышли на улицы, чтобы продемонстрировать поддержку сильного националистического государства. Хотя власти пытались не допустить демонстрантов в крупные населённые пункты, полицейские сложили оружие и позволили членам партии [Root.GetFascistParty] мирно пройти по улицам. При отсутствии сколько-нибудь значительных контрпротестов это стало громкой победой движения [Root.GetFascistParty]."
 EST_events.803.a:0 "Очень любопытно."
 EST_events.901.t:0 "[From.GetLeader] уходит в отставку"
 EST_events.901.d:0 "Удивительно, но когда сегодня силы партии [FROM.GetFascistParty] двинулись на столицу государства [From.GetAdjective], прежнее правительство государства [From.GetAdjective] вместо ожидаемого начала гражданской войны объявило, что сдаёт власть и подчиняется партии [FROM.GetFascistParty]."
 EST_events.901.a:0 "Что ж, этого мы не ожидали!"
 EST_events.10.t:0 "Вопрос о вмешательстве"
 EST_events.10.d:0 "В государстве [FIN.GetNonIdeologyName] началась гражданская война, но остаётся вопрос, какую роль государство [Root.GetNameDef] сыграет в этом конфликте. До сих пор сотрудничество вапсов с фашистами государства [FIN.GetNonIdeologyAdjective] ограничивалось их вооружением и организацией для самостоятельного захвата власти. Но, подобно тому как финны в прошлом сражались за независимость государства [EST.GetAdjective], возможно, [Root.GetLeader] увидит в этом шанс отплатить долг государства [EST.GetNonIdeologyName] перед финнами."
 EST_events.10.a:0 "Ветераны вновь будут сражаться плечом к плечу!"
 EST_events.10.b:0 "Достаточно будет крупного добровольческого корпуса."
 EST_events.11.t:0 "Вапсы и партия [Root.GetFascistPartyName]"
 EST_events.11.d:0 "Теперь, придя к власти в Эстонии, вапсы согласились подписать договор о сотрудничестве с партией [Root.GetFascistPartyName]. Вапсы уже поддерживают финские фашистские группы пропагандой и общенациональными демонстрациями, но быстрые и решительные действия правительства по запрету этих фашистских элементов могут покончить с этой проблемой навсегда."
 EST_events.11.a:0 "Негодные выскочки."
 NSB_poland_communist_events.1.a:0 "[POL.GetNameDefCap] будет стоять в одиночку."
 NSB_poland_communist_events.1.b:0 "Польше место в СССР."
 NSB_poland_communist_events.1.desc:0 "Коммунистическую партию Польши уже давно раздирает конфликт между теми, кто желает видеть Польшу союзницей СССР, и теми, кто считает СССР столь же империалистическим государством, как и предшествовавший ему монархический режим.\nАнтисоветское крыло представляет Мария Кошутская, предполагаемая [Root.GetStalinistOrTrotskyite], которая обвиняет своих просоветских товарищей в «бесхребетности» и враждебности революции.\nФактическим лидером просоветского крыла партии является Владислав Гомулка. Несмотря на популярность внутри партии, его пророссийская дипломатическая позиция делает его всё менее популярным среди польского населения.\nХотя партия теперь контролирует Польшу, она по-прежнему не может решить, кто из этих кандидатов должен возглавить её. На фоне этой нерешительности Москва оказывает всё большее давление, требуя не только не допустить Кошутскую к руководству, но и отдать её под суд как [Root.GetStalinistOrTrotskyite] и контрреволюционерку."
 NSB_poland_communist_events.1.nosov.desc:0 "Коммунистическую партию Польши уже давно раздирает конфликт между теми, кто желает видеть Польшу союзницей СССР, и теми, кто считает СССР столь же империалистическим государством, как и предшествовавший ему монархический режим.\nОднако после упадка СССР этот вопрос во многом утратил смысл. После падения Сталина просоветский лидер Владислав Гомулка также лишился влияния, и теперь никто не может оспорить назначение антисоветски настроенной Марии Кошутской главой партии."
 NSB_poland_communist_events.1.t:0 "Внутренняя борьба в КПП"
 NSB_poland_events.1.a:0 "У нас нет выбора."
 NSB_poland_events.1.b:0 "Мы не станем пресмыкаться перед Польшей!"
 NSB_poland_events.1.desc:0 "Ссылаясь на очевидную неспособность государства [Root.GetNameDef] обеспечить собственную оборону, представители [From.GetNameDef] потребовали передать всю Словакию под прямую польскую оккупацию. Они недвусмысленно заявили, что в случае отказа вторжение неизбежно. Как нам ответить?"
 NSB_poland_events.1.t:0 "[From.GetNameDefCap] требует Словакию"
 NSB_poland_events.101.a:0 "Не могу поверить, что это сработало!"
 NSB_poland_events.101.desc:0 "[From.GetNameDefCap] приняло наше недавнее требование уступить всю Словакию. В регион уже входят войска [Root.GetAdjective], чтобы подавить любое местное сопротивление ещё до его появления. Эта победа невелика, но она показывает, что мир хотя бы отчасти боится военной машины государства [Root.GetAdjective]!"
 NSB_poland_events.101.t:0 "[From.GetNameDefCap] соглашается!"
 NSB_poland_events.102.a:0 "Что ж, значит, будет война!"
 NSB_poland_events.102.desc:0 "Как ни удивительно, правительство государства [From.GetAdjective] отвергло наше требование уступить Словакию. Попытки найти дипломатическое решение провалились, и теперь дело за армией."
 NSB_poland_events.102.t:0 "[From.GetNameDefCap] отказывает!"
 NSB_poland_events.2.a:0 "Полагаю, нам придётся согласиться."
 NSB_poland_events.2.b:0 "Эти «притязания» ничего не значат."
 NSB_poland_events.2.d:1 "Похоже, затянувшееся регентство в государстве [Root.GetNameDef] придало [From.GetLeader] смелости провозгласить [From.GetLeader.GetHerselfHimself] королём Венгрии. Эти притязания основаны лишь на существовавшем в Средние века Польско-венгерском королевстве и явно служат предлогом для территориальной экспансии."
 NSB_poland_events.2.t:0 "[From.GetLeader] претендует на [Root.GetAdjective] престол!"
 NSB_poland_events.201.a:0 "Превосходно."
 NSB_poland_events.201.desc:1 "Сегодня все прочие претенденты на венгерский престол были отвергнуты, а [Root.GetLeader] провозглашён королём Венгрии. Теперь, когда [Root.GetLeader] правит и Польшей, и Венгрией, стремление государства [Root.GetAdjective] к гегемонии на Балканах становится всё более реальным."
 NSB_poland_events.201.t:0 "Венгрия уступает"
 NSB_poland_events.202.a:0 "Они не оставляют нам выбора."
 NSB_poland_events.202.desc:0 "Руководители правительства государства [From.GetAdjective] объявили, что не признают притязаний [Root.GetLeader] на [From.GetAdjective] престол. Мирное присоединение государства [From.GetNameDef] теперь невозможно, но наши притязания всё ещё можно отстоять силой оружия."
 NSB_poland_events.202.t:0 "[From.GetNameDefCap] отвергает притязания [Root.GetLeader]"
 NSB_poland_events.3.a:0 "Мы согласны!"
 NSB_poland_events.3.b:0 "[From.GetNonIdeologyName] всё ещё наш враг."
 NSB_poland_events.3.c:0 "Пусть передадут Данциг — и договор состоится!"
 NSB_poland_events.3.desc:0 "Представители государства [From.GetNameDef] заявили о заинтересованности в заключении союза с новой Германской империей. Они считают, что кайзер [Root.GetLeader] благосклоннее относится к независимости государства [From.GetAdjective], чем [Root.GetHerHis] предшественник, и напоминают, что современное государство [From.GetNameDef] обязано своим возникновением Акту 5 ноября, подписанному Центральными державами. На этом основании [From.GetNameDef] предлагает нашим странам заключить официальный союз.\nСогласие стало бы поистине беспрецедентным событием в истории отношений между [Root.GetNonIdeologyName] и [From.GetNonIdeologyName] и могло бы открыть светлое будущее для обеих стран."
 NSB_poland_events.3.t:0 "[From.GetNameDefCap] предлагает союз"
 NSB_poland_events.301.a:0 "Великий день для Польши!"
 NSB_poland_events.301.desc:0 "Удивительно, но [From.GetNameDef] согласилось заключить официальный союз с государством [Root.GetNameDef]! Некогда заклятые враги, [Root.GetNonIdeologyName] и [From.GetNonIdeologyName], похоже, наконец оставили дни вражды позади и теперь могут вместе противостоять нарастающей волне экстремистских идеологий.\nТо, что началось с Акта 5 ноября, по которому Германия согласилась выделить свои [Root.GetAdjective] территории в независимое королевство, теперь превратилось в исторический союз, который отныне будет известен как «Ноябрьский альянс»."
 NSB_poland_events.301.t:0 "Кайзер согласен!"
 NSB_poland_events.302.a:0 "Какое разочарование."
 NSB_poland_events.302.desc:0 "Несмотря на все наши дипломатические усилия и очевидную общность интересов, кайзер отказался заключать официальный союз. Похоже, независимо от того, правит Германией монарх или фашист, она по-прежнему считает нашу страну своим естественным врагом."
 NSB_poland_events.302.t:0 "Воинственный кайзер"
 NSB_poland_events.303.a:0 "Обменять этот беспокойный город на армию — выгодная сделка."
 NSB_poland_events.303.desc:0 "[From.GetNameDefCap] вернулось к нам с условным предложением, которое, по его словам, выгодно обеим сторонам. Оно утверждает, что Акт 5 ноября никогда официально не предусматривал передачу спорных районов Гданьска и Гдыни новообразованному королевству [Root.GetAdjective]. Оно готово заключить союз, но лишь в том случае, если то, что оно считает нарушением условий соглашения с Германией, будет исправлено."
 NSB_poland_events.303.t:0 "Данциг в обмен на гарантии"
 NSB_poland_events.304.a:0 "Мы возьмём его силой."
 NSB_poland_events.304.desc:0 "К сожалению, договориться с поляками не удалось: они отвергли наше предложение уступить Данциг в обмен на союз. Напряжение на границе государства [From.GetAdjective] уже растёт, и многие опасаются скорой войны."
 NSB_poland_events.304.t:0 "[From.GetNameDefCap] отказывает"
 NSB_poland_events.4.a:0 "Пусть забирают!"
 NSB_poland_events.4.b:0 "[POL_colony_purchase.GetName] — неотъемлемая часть империи [Root.GetAdjective]!"
 NSB_poland_events.4.desc:0 "Польская морская и колониальная лига сегодня обратилась к послу государства [Root.GetAdjective] в городе [From.Capital.GetName] с предложением приобрести заморскую территорию [POL_colony_purchase.GetName]. Передача [POL_colony_purchase.GetName] полякам, несомненно, принесла бы государству [Root.GetNameDef] значительный профицит бюджета, однако государство [From.GetNameDef] получило бы полный суверенитет над всей территорией [POL_colony_purchase.GetName], её ценными ресурсами и гражданским населением."
 NSB_poland_events.4.t:0 "Польша просит продать [POL_colony_purchase.GetName]"
 NSB_poland_events.401.a:0 "Добро пожаловать, жители региона [POL_colony_purchase.GetName]"
 NSB_poland_events.401.desc:0 "[From.GetNameDefCap] сегодня ответило согласием продать нам заморскую территорию [POL_colony_purchase.GetName]. Теперь остаётся лишь выплатить долг государству [From.GetNameDef], после чего колония станет неотъемлемой частью растущей колониальной империи [Root.GetAdjective]."
 NSB_poland_events.401.desc.com:0 "[From.GetNameDefCap] сегодня ответило согласием продать нам заморскую территорию [POL_colony_purchase.GetName]. Теперь остаётся лишь выплатить долг государству [From.GetNameDef], но жители региона [POL_colony_purchase.GetName] уже освобождены от гнёта колониализма государства [From.GetAdjective]."
 NSB_poland_events.401.desc.dem:0 "[From.GetNameDefCap] сегодня ответило согласием продать нам заморскую территорию [POL_colony_purchase.GetName]. Хотя теперь мы задолжали государству [From.GetNameDef], эта сделка не могла состояться в более подходящий для государства [Root.GetNameDef] момент. Получив прямой контроль над регионом [POL_colony_purchase.GetName], мы обрели ещё один оплот, где наше правительство сможет продолжить существование в изгнании."
 NSB_poland_events.401.t:0 "Успешная продажа региона [POL_colony_purchase.GetName]"
 NSB_poland_events.402.a:0 "Попытаться стоило."
 NSB_poland_events.402.desc:0 "К сожалению, правительство государства [From.GetAdjective] совершенно не заинтересовано в передаче региона [POL_colony_purchase.GetName] в данный момент. Хотя это не кладёт конец заморским амбициям государства [Root.GetAdjective], после этой неудачи мирная передача территории [POL_colony_purchase.GetName] стала совершенно невозможной."
 NSB_poland_events.402.t:0 "[From.GetNameDefCap] отказывается продавать [POL_colony_purchase.GetName]"
 NSB_poland_events.6.a:0 "Разумное предложение."
 NSB_poland_events.6.b:0 "Нет."
 NSB_poland_events.6.desc:0 "Осенью 1932 года Лига Наций признала Польшу единственным покровителем Либерии, однако из-за вмешательства Соединённых Штатов это решение так и не было претворено в жизнь. Несмотря на это, в нашей стране действует множество поселений и предприятий Польской морской и колониальной лиги.\nЭто соглашение приносило выгоду обеим странам, но теперь государство [From.GetNameDef], похоже, действует всё настойчивее, и [From.GetLeader] официально потребовал, чтобы [Root.GetNameDef] стало протекторатом государства [From.GetAdjective].\nЕсли мы согласимся, то станем зависимым государством [From.GetAdjective] со всеми преимуществами и недостатками такого положения. Если же откажемся, [From.GetLeader], похоже, попытается осуществить [From.GetLeader.GetHerHis] замыслы силой."
 NSB_poland_events.6.t:0 "[From.GetNameDefCap] предлагает статус протектората"
 NSB_poland_events.601.a:0 "Тогда мы возьмём её силой."
 NSB_poland_events.601.b:0 "Не будем усугублять ситуацию."
 NSB_poland_events.601.desc:1 "Несмотря на согласие со статусом протектората ещё в 1932 году, правительство государства [From.GetAdjective], похоже, больше не желает мириться с интересами государства [Root.GetAdjective] в своей стране."
 NSB_poland_events.601.t:0 "[From.GetNameDefCap] отказывает"
 NSB_poland_events.7.a:0 "Великолепное предложение!"
 NSB_poland_events.7.b:0 "Похоже на смертельную ловушку."
 NSB_poland_events.7.desc:0 "После восстановления демократии в Польше новое польское правительство стремится укрепить франко-польские отношения и создать союз по обе стороны германской границы. Польша всё ещё ослаблена недавней гражданской войной, но нет сомнений, что государству [GER.GetNameDef] было бы трудно вести войну сразу на двух фронтах."
 NSB_poland_events.7.t:0 "Польша предлагает Моржский пакт"
 NSB_poland_events.701.a:0 "Возможно, британцы нас примут."
 NSB_poland_events.701.desc:0 "Правительство государства [From.GetNameDef] пока отказалось заключать с нами официальный союз. Это горькое дипломатическое поражение превращает план фронта Морж о франко-польском союзе в пустую мечту, и теперь нам придётся искать поддержку в другом месте."
 NSB_poland_events.8.t:0 "Судьба Анастасии Романовой"
 NSB_poland_events.8.d:0 "После захвата Москвы государством [From.GetNameDefCap] и его союзниками наши агенты обнаружили в архивах НКВД документы, раскрывающие ужасную судьбу семьи Романовых. Согласно отчёту, вся императорская семья, включая Анастасию, была казнена большевиками в июле 1918 года. Если мы не поторопимся, мир вскоре узнает, что наша королева выдаёт себя не за ту, кем является на самом деле."
 NSB_poland_events.8.a:0 "Спрятать доказательства. Мир никогда не узнает правду."
 NSB_poland_events.8.b:0 "Польскую корону должен носить кто-то другой!"
 NSB_poland_monarchist_events.1.t:0 "[From.GetNameDefCap] претендует на наш престол"
 NSB_poland_monarchist_events.2.a:0 "Что ж, ничего не поделаешь."
 NSB_poland_monarchist_events.2.desc:0 "К сожалению, мы больше не можем отстаивать свои притязания на государство [From.GetNonIdeologyName]. Нынешнее правительство государства [From.GetAdjective] окончательно выиграло пропагандистскую войну, и теперь любые разговоры о притязаниях [Root.GetLeader] встречают лишь смех и насмешки."
 NSB_poland_monarchist_events.2.t:0 "Притязания государства [Root.GetNameDefCap] отвергнуты"
 NSB_poland_monarchist_events.3.a:0 "Проклятие!"
 NSB_poland_monarchist_events.3.desc:1 "Сегодня [From.GetLeader] был коронован новым королём государства [Root.GetNonIdeologyName]. Длительная пропагандистская кампания настроила многих министров государства [Root.GetAdjective] против старого режима и привела к бескровному перевороту. В результате государство [Root.GetNonIdeologyName] стало не более чем марионеткой государства [From.GetNameDef], и перспективы будущей автономии государства [Root.GetAdjective] выглядят мрачно."
 NSB_poland_monarchist_events.3.t:0 "Переворот [From.GetLeader]!"
 NSB_poland_monarchist_events.4.a:0 "Предатели!"
 NSB_poland_monarchist_events.4.desc:0 "Сегодня улицы государства [Root.GetNonIdeologyName] объяты пламенем: монархические и антимонархические ополчения ввергли страну в гражданскую войну! Сторонники [Root.GetLeader] и [From.GetLeader] сражаются по всей стране, а министры государства [From.GetNameDef] отрицают свою причастность к этому посягательству на наш национальный суверенитет. Нам остаётся лишь ждать и смотреть, какая сторона выйдет из конфликта победителем."
 NSB_poland_monarchist_events.4.t:0 "Монархическая гражданская война"
 NSB_poland_monarchist_events.5.t:0 "Сторонники [From.GetLeader] требуют отречения"
 NSB_poland_monarchist_events.5.desc:0 "После длительной кампании монархической пропаганды, развязанной [From.GetLeader] и [From.GetLeader.GetHerHis] правительством, напряжение между сторонниками [Root.GetLeader] и теми, кто желает объединения государств [Root.GetNonIdeologyName] и [From.GetNonIdeologyName], достигло точки, в которой мирное сосуществование более невозможно. Сторонники монархии недвусмысленно потребовали, чтобы [Root.GetLeader] отрёкся от престола и признал [From.GetLeader] единственным законным королём государства [Root.GetNonIdeologyName].\n\nСогласие превратит государство [Root.GetNonIdeologyName] практически в [From.GetAdjective] подчинённое государство, однако отказ почти наверняка приведёт к гражданской войне."
 NSB_poland_monarchist_events.5.a:0 "Мы сдаёмся!"
 NSB_poland_monarchist_events.5.b:0 "Лучше война, чем роль [From.GetAdjective] марионетки."
 NSB_poland_royal_election.1.a:0 "Он наш король!"
 NSB_poland_royal_election.1.b:0 "Нет, у нас на примете другой кандидат..."
 NSB_poland_royal_election.1.desc:0 "Маркграф Мейсена и принц Саксонии Альберт Леопольд Фридрих Кристиан Сильвестр Анно Макарий желает добавить к своим многочисленным престижным титулам ещё и титул короля Польши. Многие великие монархи Речи Посполитой принадлежали к дому Веттинов и были саксонскими курфюрстами, поэтому теперь, когда нашей стране нужен король, Фридрих Кристиан кажется самым очевидным и законным кандидатом.\nЕго права на Речь Посполитую несомненно укрепят притязания нашего правительства на все её бывшие территории. Претендент на Литву, представитель исторической польской королевской династии и наследник прославленного рода — Фридрих Кристиан обладает вескими правами на польскую корону."
 NSB_poland_royal_election.1.t:0 "Фридрих Кристиан заявляет права на престол"
 NSB_poland_royal_election.2.a:0 "Объединить наши престолы? Великолепная идея!"
 NSB_poland_royal_election.2.b:0 "Мы не можем рисковать отношениями с Румынией."
 NSB_poland_royal_election.2.desc:0 "Притязания Гогенцоллернов на Польшу восходят едва ли не к самому возникновению современного польского государства. Теперь, когда польско-румынские отношения приобретают всё более важное значение для выживания обеих стран, разумно предложить наш престол бывшему королю и наследнику Румынии Михаю I.\n Свергнутый в 1930 году в пользу собственного отца, король Михай открывает возможность потенциальной унии польского и румынского престолов. Поскольку влияние фашистской «Железной гвардии» в Румынии растёт, мы можем использовать антифашистские настроения, чтобы вновь свергнуть короля Кароля и заменить его Михаем. Это создаст нерушимый союз наших государств, а наша объединённая воля станет грозной силой, с которой придётся считаться нашим врагам в [SOV.GetNameDef] и [GER.GetNameDef]."
 NSB_poland_royal_election.2.t:0 "Кронпринц Румынии Михай"
 NSB_poland_royal_election.3.a:0 "Безумная идея, но и времена безумные. У нас есть король!"
 NSB_poland_royal_election.3.b:0 "Павел кто?"
 NSB_poland_royal_election.3.desc:0 "Сегодня перед регентским советом предстал необычный кандидат. Грузинский князь, казак и бывший белый генерал Павел Бермондт-Авалов заявил права не только на Королевство Польское, но и на всю Речь Посполитую.\nМного лет назад этот казак по неизвестным причинам пытался вторгнуться в Прибалтику, и, похоже, с тех пор амбиции князя лишь возросли.\nХотя большинство простых поляков его не поддерживает, этот неожиданный претендент приведёт с собой армию белых эмигрантов. Это настроит против нас [SOV.GetNameDef], но увеличит численность наших сил и, возможно, сблизит нас с фашистскими державами Европы."
 NSB_poland_royal_election.3.t:0 "Король-казак"
 NSB_poland_royal_election.4.a:1 "Нашим королём станет последний Романов. Вероятно."
 NSB_poland_royal_election.4.desc:1 "«Варшавский замок, нарисованные орлы... Да, я помню. Я — единственный законный король Польши». Печально известная претендентка на имя Анастасии Романовой сегодня прибыла в Варшавский замок вместе со своим публицистом и заявила, что династия Романовых всё ещё имеет права на польский престол, а поскольку она является последней из Романовых, то, по логике, именно она и есть король. Притязания Анастасии основаны не только на правах Романовых на Польшу, но и на законности её происхождения.\nХотя многие бывшие русские дворяне подтверждают, что она действительно является настоящей Анастасией, другие считают её эксцентричной женщиной, получившей незаслуженно широкое внимание прессы.\nЕё права на престол могут вызывать сомнения, однако она последняя в списке кандидатов. Если теперь отвергнуть и её, Польша вернётся к тому, с чего начала: к пустующему престолу, покрывающемуся пылью."
 NSB_poland_royal_election.4.t:0 "Анастасия Романова прибывает в Польшу"
 NSB_poland_royal_election.5.t:0 "Кандидат от Габсбургов"
 NSB_poland_royal_election.5.desc:0 "Представитель королевской семьи, Габсбург и польский патриот Кароль Ольбрахт фон Габсбург служит в польской армии почти столько же, сколько существует сама эта организация. Хотя его род происходит не с этой земли, готовность сражаться и умереть за Польшу делает его идеальным кандидатом на престол.\n\nПохоже, эрцгерцог не слишком стремится к власти, однако, возможно, его удастся убедить служить Польше не оружием, а своим руководством."
 NSB_poland_royal_election.5.a:0 "Да здравствует габсбургская Польша!"
 NSB_poland_royal_election.5.b:0 "Мы желаем видеть другого..."
 pavel_events.1.a:0 "Донские казаки должны быть независимы."
 pavel_events.1.b:0 "Они будут подчиняться непосредственно нам."
 pavel_events.1.desc:0 "Теперь, когда вся долина Дона находится под контролем [Root.GetLeader] и [Root.GetLeader.GetHerHis] войск, мы можем восстановить Донскую республику и пригласить её руководителей вновь возглавить донских казаков в борьбе против красных!\nОстаётся лишь решить, можно ли доверить войску независимость или же оно должно служить марионеточным правительством, напрямую подчинённым [Root.GetLeader]."
 pavel_events.1.t:0 "Восстановление Донской республики"
 pavel_events.2.a:0 "Хорошо."
 pavel_events.2.b:0 "Им нельзя доверять — они станут нашими подданными."
 pavel_events.2.desc:0 "Некогда Кубанская народная республика была государством-перебежчиком, сражавшимся сначала за белых, а затем за красных. Теперь [Root.GetLeader] решил восстановить Кубанскую республику с новым руководством, верным белому движению.\nХотя кубанцы однажды уже предали белое дело, новое руководство заверяет нас, что сделает всё возможное, чтобы подавить любую поддержку прежнего правительства."
 pavel_events.2.t:0 "Восстановление Кубанской республики"
 NSB_poland_democratic_events.1.t:0 "Вопрос о руководстве"
 NSB_poland_democratic_events.1.desc:0 "Теперь, когда санационисты были выведены из правительства, остается вопрос о том, кто должен быть лидером новой Польской крестьянской партии. Наиболее ярый и ярый сторонник крестьянства Станислав Миколайчик в настоящее время занимает эту роль, однако нельзя игнорировать, что победа в гражданской войне была бы невозможна без поддержки Фронта Моргеса.\n\nПредставляя генералов в пользу восстановления свободных выборов в Польше, Фронт Моргес выступает за давнего бывшего премьер-министра Польши Винченти Витоса.\n\nХотя назначение Витоса в качестве лидера партии успокоило бы Фронт Моргес, отстранение Миколайчика от должности может заставить многих крестьян, которые сражались на передовой за наше демократическое дело, чувствовать себя бесправными и преданными партией."
 NSB_poland_democratic_events.1.a:0 "У Витоса есть опыт — он станет нашим лидером."
 NSB_poland_democratic_events.1.b:0 "Миколайчик — народный избранник, он станет нашим лидером."
 NSB_poland_communist_events.2.a:0 "Это наш лучший шанс."
 NSB_poland_communist_events.2.b:0 "Нет!"
 NSB_poland_communist_events.2.desc:0 "Государство [From.GetNameDefCap] предложило нам полную военную защиту в обмен на установление своей власти над государством [Root.GetNonIdeologyName]. Ссылаясь на непосредственную и постоянную угрозу существованию государства [Root.GetNonIdeologyName] со стороны России и Германии, политики государства [From.GetNameDef] предлагают нам статус протектората. Согласие превратит государство [Root.GetNonIdeologyName] в марионетку, но, похоже, государство [From.GetNonIdeologyName] не намерено принимать отказ."
 NSB_poland_communist_events.2.t:0 "Государство [From.GetNameDefCap] предлагает защиту"
 NSB_poland_communist_events.201.a:0 "Превосходно."
 NSB_poland_communist_events.201.desc:0 "Государство [From.GetNameDefCap] стало подданным государства [Root.GetNameDef]. Теперь, когда правительство государства [From.GetAdjective] напрямую подчиняется столице [Root.Capital.GetName], установление нашей гегемонии в Прибалтике становится неизбежным."
 NSB_poland_communist_events.201.t:0 "Государство [From.GetNameDefCap] соглашается!"
 NSB_poland_communist_events.202.a:0 "Мы всегда можем положиться на армию."
 NSB_poland_communist_events.202.desc:0 "Государство [From.GetNameDefCap] отвергло наше предложение о защите и настаивает на сохранении независимости. Верховное командование государства [Root.GetAdjective] уже готовится добиться успеха там, где потерпело неудачу министерство иностранных дел. [Root.GetLeader] достаточно лишь отдать приказ — и начнётся полномасштабное наступление на государство [From.GetNameDef]."
 NSB_poland_communist_events.202.t:0 "Государство [From.GetNameDefCap] отказывается"
 NSB_poland_communist_events.3.a:0 "Рабочие государств [Root.GetNonIdeologyName] и [From.GetNonIdeologyName], объединяйтесь!"
 NSB_poland_communist_events.3.b:0 "Это неприемлемо."
 NSB_poland_communist_events.3.desc:0 "Государство [From.GetNameDefCap] потребовало немедленной аннексии государства [Root.GetNameDef]. Эта аннексия является частью замысла [From.GetLeader] по созданию «Содружества Социалистических Республик». Согласие означало бы немедленный отказ от независимости, и государство [Root.GetNonIdeologyName] стало бы непосредственной частью государства [From.GetAdjective]."
 NSB_poland_communist_events.3.t:0 "Государство [From.GetNameDefCap] добивается интеграции государства [Root.GetAdjective]"
 NSB_poland_communist_events.301.a:0 "Какая жалость."
 NSB_poland_communist_events.301.desc:0 "Государство [From.GetNameDefCap] отказалось войти в состав Содружества Социалистических Республик. Это не означает конец стремления государства [Root.GetAdjective] к господству в регионе, однако делает мирные отношения с государством [From.GetNameDef] невозможными."
 NSB_poland_communist_events.301.t:0 "Государство [From.GetNameDefCap] отказывается"
 NSB_poland_communist_events.302.a:0 "Превосходно."
 NSB_poland_communist_events.302.desc:0 "Стремление [Root.GetLeader] включить государство [From.GetNameDef] в Содружество Социалистических Республик осуществилось: правительство государства [From.GetAdjective] согласилось перейти под прямое руководство государства [Root.GetAdjective]."
 NSB_poland_communist_events.302.t:0 "Государство [From.GetNameDefCap] принимает аннексию"
 NSB_poland_communist_events.4.a:0 "Мы согласны."
 NSB_poland_communist_events.4.b:0 "Они ещё не готовы."
 NSB_poland_communist_events.4.desc:0 "Государство [From.GetNameDefCap] предложило передать нам Восточную Польшу в обмен на статус протектората и тесную интеграцию с СССР. Если мы согласимся, государство [From.GetNameDef] станет марионеткой государства [Root.GetNameDef], а белорусские и украинские земли, ныне занятые Польшей, будут переданы СССР.\n\nХотя выбор кажется очевидным, германские амбиции в Польше могут сделать войну между государствами [Root.GetNameDef] и [GER.GetNameDef] неизбежной."
 NSB_poland_communist_events.4.t:0 "Государство [From.GetNameDefCap] предлагает восточные земли"
 NSB_poland_communist_events.401.a:0 "Необходимая жертва."
 NSB_poland_communist_events.401.desc:0 "Государство [From.GetNameDefCap] согласилось принять нас в качестве протектората, и мы вошли в состав СССР как подчинённое государство. Хотя многие по всей стране считают наше решение предательством, [Root.GetLeader] заверил польский народ, что [From.GetLeader] — друг Польши, а все этнические поляки, теперь напрямую включённые в СССР, будут вполне довольны своими новыми [From.GetAdjective] властителями."
 NSB_poland_communist_events.401.t:0 "Государство [From.GetNameDefCap] соглашается!"
 NSB_poland_communist_events.402.a:0 "Хорошо."
 NSB_poland_communist_events.402.desc:0 "[From.GetLeader] отказался принять государство [Root.GetNameDef] в состав СССР, заявив, что [Root.GetLeader] «ещё не готов». Хотя это остаётся официальной причиной, многие подозревают, что истинной причиной отказа стали германские амбиции в Польше."
 NSB_poland_communist_events.402.t:0 "Государство [From.GetNameDefCap] отказывается"
 NSB_poland_communist_events.5.a:0 "Независимость просто недопустима."
 NSB_poland_communist_events.5.b:0 "У нас есть более важные заботы."
 NSB_poland_communist_events.5.desc:0 "Государство [From.GetNameDefCap] больше не является [Root.GetAdjective] марионеткой и провозгласило себя независимой социалистической республикой. Пока ситуация остаётся мирной, а государство [From.GetNameDef] по-прежнему состоит в альянсе [Root.GetFactionName]."
 NSB_poland_communist_events.5.t:0 "Государство [From.GetNameDefCap] провозглашает независимость!"
 NSB_poland_communist_events.501.a:0 "Значит, будет война!"
 NSB_poland_communist_events.501.desc:0 "Как и следовало ожидать, [From.GetLeader] враждебно воспринял провозглашение независимости государства [Root.GetAdjective] и объявил его актом войны."
 NSB_poland_communist_events.501.t:0 "Государство [From.GetNameDefCap] объявляет войну"
 NSB_poland_communist_events.502.a:0 "Мы останемся в альянсе [From.GetFactionName]"
 NSB_poland_communist_events.502.b:0 "Мы провозглашаем полную независимость."
 NSB_poland_communist_events.502.desc:0 "Государство [From.GetNameDefCap] признало нашу независимость, и пока между нашими странами, похоже, сохранится мир. Теперь, став полностью независимыми, мы можем либо сохранить связь с государством [From.GetNameDef], либо покинуть альянс и рассмотреть другие возможности."
 NSB_poland_communist_events.502.t:0 "Государство [From.GetNameDef] признаёт независимость государства [Root.GetAdjective]"
 NSB_poland_communist_events.6.a:0 "Это не имеет большого значения."
 NSB_poland_communist_events.6.b:0 "Это наши земли."
 NSB_poland_communist_events.6.desc:0 "Хотя Восточная Польша была частью соглашения, по которому государство [From.GetNameDef] вступило в альянс [Root.GetFactionName], это небольшое государство попросило вернуть её, ссылаясь на свою верность международному делу. Его представители утверждают, что жители Западной Белоруссии и Украины десятилетиями были частью польского государства и сыграли важнейшую роль в крестьянской забастовке, приведшей социалистов к власти в Польше."
 NSB_poland_communist_events.6.t:0 "Государство [From.GetNameDefCap] требует вернуть Восточную Польшу"
 NSB_poland_communist_events.601.a:0 "Наша страна вновь едина."
 NSB_poland_communist_events.601.desc:0 "Восточная Польша была возвращена в качестве неотъемлемой части государства [Root.GetNameDef]. Эти территории уже вновь включаются в систему управления государства [Root.GetAdjective], и регион, сыгравший столь важную роль в свержении старого режима, воссоединился с государством, за которое сражались его жители."
 NSB_poland_communist_events.601.t:0 "Государство [From.GetNameDefCap] возвращает Восточную Польшу!"
 NSB_poland_communist_events.602.a:0 "Хорошо."
 NSB_poland_communist_events.602.b:0 "Тогда мы выбираем независимость!"
 NSB_poland_communist_events.602.desc:0 "Государство [From.GetNameDefCap] отказалось вернуть Восточную Польшу государству [Root.GetNameDef]. Хотя такой исход был предсказуем, многие поляки всё равно разочарованы, и стремление отделиться от государства [From.GetNameDef] усиливается."
 NSB_poland_communist_events.602.t:0 "Государство [From.GetNameDefCap] отказывает"
 NSB_poland_monarchist_events.1.a:0 "Мы должны сопротивляться."
 NSB_poland_monarchist_events.1.desc:1 "Теперь, когда [From.GetLeader] коронован королём государства [From.GetNonIdeologyName], похоже, [From.GetAdjective] правительство намерено использовать это как основание для притязаний на государство [Root.GetNonIdeologyName]! Посредством пропагандистской войны и политического давления государство [From.GetNameDef] попытается использовать оппозицию режиму [Root.GetLeader] как оружие и поддержать внутренний переворот.\nЕсли эта пропаганда окажется действенной, [Root.GetLeader] может столкнуться с переворотом, а государство [Root.GetNonIdeologyName] превратится не более чем в [From.GetAdjective] марионетку."
 NSB_poland_royal_election.4.b:0 "Возможно, мы слишком поспешно отвергли Фридриха Кристиана..."
 NSB_polish_fascist_events.1.a:0 "Зачем вторгаться, если они сами отдают себя нам?"
 NSB_polish_fascist_events.1.b:0 "У нас другие планы на Польшу."
 NSB_polish_fascist_events.1.desc:0 "[From.GetAdjective] правительство предложило заключить пакт в поддержку наших стремлений к мировому господству. Очевидно, [From.GetLeader] понимает, что [Root.GetLeader] не был удовлетворён границами между Польшей и Германией, а потому польский министр иностранных дел Юзеф Бек был направлен к нам с предложением пересмотреть это соглашение.\n\nПольша согласна уступить западные территории Познани, Данцига и Верхней Силезии в обмен на взаимные пакты о ненападении, а также германскую защиту и руководство в случае попытки [SOV.GetAdjective] вторжения. Этот пакт фактически превратит Польшу в германскую марионетку и одновременно передаст нам спорные приграничные территории. Стоит ли соглашаться?"
 NSB_polish_fascist_events.1.t:0 "Пакт Бека — Риббентропа"
 NSB_polish_fascist_events.101.a:0 "В безопасности, но какой ценой?"
 NSB_polish_fascist_events.101.desc:0 "Государство [From.GetNameDefCap] согласилось на наши условия, и теперь государство [Root.GetNameDef] официально находится под [From.GetAdjective] защитой. [From.GetAdjective] солдаты уже заполняют [Root.GetAdjective] сельскую местность, а наши министры отчитываются напрямую перед Берлином."
 NSB_polish_fascist_events.101.t:0 "Государство [From.GetNameDefCap] подписывает пакт"
 NSB_polish_fascist_events.102.a:0 "Пора изменить курс."
 NSB_polish_fascist_events.102.desc:0 "Несмотря на то что наше предложение фактически передавало ключи от страны прямо в руки [From.GetLeader], похоже, у [From.GetAdjective] правительства иные планы: оно решительно отвергло нашу инициативу."
 NSB_polish_fascist_events.102.t:0 "Государство [From.GetNameDefCap] отвергает пакт"
 NSB_polish_fascist_events.2.a:0 "Предъявить ультиматум."
 NSB_polish_fascist_events.2.b:0 "Хорошо."
 NSB_polish_fascist_events.2.c:0 "Нет."
 NSB_polish_fascist_events.2.desc:0 "Несмотря на своё нынешнее положение [Root.GetAdjective] подчинённого государства, [From.GetNameDef], похоже, по-прежнему стремится к господству Речи Посполитой. Признавая наши притязания на Мемель, [From.GetLeader] предлагает разделить страну: Мемельская область перейдёт под [Root.GetAdjective] контроль, а остальная территория станет [From.GetAdjective]."
 NSB_polish_fascist_events.2.t:0 "Государство [From.GetNameDefCap] хочет разделить Литву"
 NSB_polish_fascist_events.201.a:0 "У нас нет выбора."
 NSB_polish_fascist_events.201.b:0 "Мы отказываемся!"
 NSB_polish_fascist_events.201.desc:0 "Неожиданный союз государств [POL.GetNameDef] и [GER.GetNameDef] выдвинул нам совместное требование об аннексии. Они требуют передать Мемельскую область Германии, а остальную часть нашей страны полностью присоединить к Польше."
 NSB_polish_fascist_events.201.t:0 "Германия и Польша требуют аннексии Литвы"
 NSB_polish_fascist_events.202.a:0 "Какая досада."
 NSB_polish_fascist_events.202.desc:0 "Похоже, у немцев иные планы на Литву: наше предложение об аннексии было единогласно отвергнуто."
 NSB_polish_fascist_events.202.t:0 "Государство [From.GetNameDefCap] отказывается"
 NSB_polish_fascist_events.203.a:0 "Превосходно."
 NSB_polish_fascist_events.203.desc:0 "Государство [From.GetNameDefCap] согласилось на наши требования, и бывшие литовские территории уже делят между Польшей и Германией. Не сделав ни единого выстрела, мы завладели Литвой."
 NSB_polish_fascist_events.203.t:0 "Государство [From.GetNameDefCap] соглашается"
 NSB_polish_fascist_events.204.a:0 "Тогда возьмём её силой."
 NSB_polish_fascist_events.204.desc:0 "Похоже, Литва отвергла наши разумные требования. Дипломатия потерпела неудачу, а значит, теперь дело за армией."
 NSB_polish_fascist_events.204.t:0 "Государство [From.GetNameDefCap] проявляет непокорность!"
 NSB_polish_fascist_events.4.a:0 "Нам следует забрать Прибалтику."
 NSB_polish_fascist_events.4.b:0 "Белоруссия и Украина станут нашим домом."
 NSB_polish_fascist_events.4.c:0 "Мы должны завершить создание Междуморья."
 NSB_polish_fascist_events.4.desc.first:0 "Мы многим пожертвовали в борьбе за уничтожение большевизма: западной границей, независимостью и жизнями бесчисленных солдат. Теперь пришло время потребовать что-то взамен. Поскольку наша война с государством [SOV.GetNameDef] непременно завершится победой, на востоке перед нами открывается множество возможностей для польской экспансии."
 NSB_polish_fascist_events.4.desc.rejected:0 "Государство [From.GetNameDefCap] отвергло наше предложение о послевоенных границах, но это не имеет большого значения, ведь существует ещё множество вариантов будущего польского государства."
 NSB_polish_fascist_events.4.t:0 "Послевоенная Польша"
 NSB_polish_fascist_events.401.a:0 "Это нас устраивает."
 NSB_polish_fascist_events.401.b:0 "Нет."
 NSB_polish_fascist_events.401.desc.baltics:0 "Польша обратилась к нам с предложением относительно своих будущих границ после войны. Ссылаясь на территории, утраченные в пользу государства [Root.GetNameDef] по пакту Бека — Риббентропа, [From.GetAdjective] правительство считает, что после победы имеет право на пересмотр границ.\n\nПоляки хотят продвинуться на север, в Прибалтику, оправдывая это существованием бывшего вассального государства Речи Посполитой — Курляндии."
 NSB_polish_fascist_events.401.desc.ukraine:0 "Польша обратилась к нам с предложением относительно своих будущих границ после войны. Ссылаясь на территории, утраченные в пользу государства [Root.GetNameDef] по пакту Бека — Риббентропа, [From.GetAdjective] правительство считает, что после победы имеет право на пересмотр границ.\n\nПоляки хотят продвинуться на восток, в Белоруссию и Украину, ссылаясь на бывшие владения Речи Посполитой на востоке."
 NSB_polish_fascist_events.401.desc.blacksea:0 "Польша обратилась к нам с предложением относительно своих будущих границ после войны. Ссылаясь на территории, утраченные в пользу государства [Root.GetNameDef] по пакту Бека — Риббентропа, [From.GetAdjective] правительство считает, что после победы имеет право на пересмотр границ.\n\nПоляки хотят продвинуться на юг, в Крым, ссылаясь на давнюю мечту о Польше, простирающейся от моря до моря."
 NSB_polish_fascist_events.402.a:0 "Будущее Польши обеспечено."
 NSB_polish_fascist_events.402.desc:0 "Государство [From.GetNameDef] приняло наше предложение о будущих границах Польши, и заявленные нами области уже включаются в систему гражданского управления. Возможно, мы никогда не вернём западные земли, однако новые территории с лихвой возместили нам земли, отнятые несколькими годами ранее."
 NSB_polish_fascist_events.5.a:0 "Превосходная инициатива."
 NSB_polish_fascist_events.5.b:0 "Не думаю."
 NSB_polish_fascist_events.5.desc:0 "Государство [From.GetNameDef] пригласило нас вступить в Фалангистский интернационал — союз, основанный главным образом на принципах фалангизма и католической идентичности. Согласие будет означать, что во время войны наши страны станут сражаться вместе, а фалангистские элементы в нашем правительстве обретут больше влияния и сил. Стоит ли принимать приглашение?"
 NSB_polish_fascist_events.5.t:0 "Государство [From.GetNameDefCap] приглашает нас в Фалангистский интернационал"
 NSB_polish_fascist_events.6.t:0 "Варшавские беспорядки"
 NSB_polish_fascist_events.6.desc:0 "Постоянное усиление и подстрекательство фалангистов привело к череде националистических беспорядков на улицах Варшавы. Очевидно ободрённые готовностью [Root.GetLeader] сотрудничать с правыми экстремистами и поддерживать их, участники беспорядков прошли по улицам Варшавы, после чего противостояние переместилось к Варшавскому замку. Военные офицеры, верные правительственной фракции Санации, не сумели остановить толпу, которая ворвалась в столичный замок и силой вывела оттуда [Root.GetLeader].\n\nТеперь замок уже очищен от всего руководства Санации, а Болеслав Пясецкий провозгласил себя главой нового польского государства."
 NSB_polish_fascist_events.6.a:0 "Всё идёт по плану."
 NSB_polish_fascist_events.7.t:0 "Общенациональные выборы в Польше"
 NSB_polish_fascist_events.7.desc:0 "Поскольку Санация всё чаще перенимала политику и убеждения Национально-демократической партии, многие считали возобновление общенациональных выборов в республике лишь вопросом времени. После подписания третьей Национальной конституции Польши выборы были восстановлены, но с условием, что партии, признанные непатриотичными, не смогут формировать правительство.\n\nК «непатриотичным» партиям отнесли ПСЛ, а также большинство других крупных левых и центристских партий, поэтому у избирателей почти не осталось выбора, кроме национал-демократов. Национал-демократы одержали победу на выборах, тогда как конкурирующие партии, включая Санацию, получили лишь малую долю голосов, что обеспечило НД почти полный контроль над республикой."
 NSB_polish_fascist_events.7.a:0 "Я люблю демократию."
 nsb_news.1.a:0 "Рабочие Польши восстают!"
 nsb_news.1.b:0 "Мы сокрушим этих выскочек!"
 nsb_news.1.c:0 "Мадонна, защити нас."
 nsb_news.1.d:0 "Смотрите, как Польша сама себя разделяет."
 nsb_news.1.e:0 "Что это будет значить для Польши?"
 nsb_news.1.desc:0 "Молодое польское государство охватила гражданская война! Десятилетия распрей в правительстве и полное отсутствие вложений в инфраструктуру сельских районов Восточной Польши в начале этого года привели к всеобщей забастовке низших слоёв населения, а продолжающееся жестокое обращение полиции и армии с бастующими раскололо страну надвое.\n\nКрестьянское правительство во главе с [peasant_poland_target.GetLeader] поддерживает демократическая фракция польских военных «Фронт Морж» и коалиция марксистов, социалистов и либералов.\n\nПока силы лоялистов сосредоточены в промышленном сердце Польши, а крестьяне — на сельском Востоке, Польша разделена крестьянской кровью."
 nsb_news.1.t:0 "Крестьянское восстание в городе [peasant_poland_target.Capital.GetName]"
 nsb_news.2.a:0 "Это оскорбление!"
 nsb_news.2.b:0 "Что до меня, то я приветствую наших новых польских повелителей."
 nsb_news.2.c:0 "Либерия — лишь начало."
 nsb_news.2.d:0 "Польша в Африке?"
 nsb_news.2.f:0 "Ещё один бессмысленный акт империализма."
 nsb_news.2.e:0 "Это… определённо похоже на империализм."
 nsb_news.2.desc.dem:1 "Сегодня Польша установила протекторат над Либерией! С 1932 года Либерия считала Польшу предпочтительным инвестиционным партнёром, полагая, что у этой страны почти нет колониальных амбиций. Однако соглашение, подписанное Польшей, Либерией и Лигой Наций, теперь превратило Либерию практически в польскую марионетку.\n\nПредставители США осудили это решение, считая независимость Либерии необходимой частью основополагающих принципов страны.\n\nМорская и колониальная лига Польши считает это огромной победой польских колониальных амбиций и заявляет, что это даже близко не предел стремлений поляков в Африке."
 nsb_news.2.desc.com:1 "Сегодня Польша установила протекторат над Либерией! С 1932 года Либерия считала Польшу предпочтительным инвестиционным партнёром, полагая, что у этой страны почти нет колониальных амбиций. Однако это соглашение теперь превратило Либерию практически в польскую марионетку.\n\nПредставители США осудили это решение, считая независимость Либерии необходимой частью основополагающих принципов страны.\n\nТоварищи по КПП обвинили [POL.GetLeader] в колониализме, но [POL.GetLeader.GetSheHe] клянётся, что это делается лишь для защиты Либерии от потенциальных колонизаторов, хотя многие остаются неубеждёнными."
 nsb_news.2.t:1 "Провозглашён [LIB.GetAdjective] протекторат"
 nsb_news.3.t:0 "Туркестан объединён!"
 nsb_news.3.desc:0 "Поскольку весь Центральноазиатский регион прочно находится под контролем [From.GetOldAdjective], тюркские народы объединились под руководством [From.GetLeader]. Новая тюркская администрация объявила, что отныне [From.GetOldNameDef] будет называться [From.GetNameDef] и является законным домом всех тюркских народов.\n\nДаже за пределами новой страны многие тюркские народы начинают считать [From.GetNameDef] своей истинной родиной, и [From.GetLeader] может воспользоваться этим, чтобы расширить молодое государство."
 nsb_news.3.a:0 "Мы больше не разделены."
 nsb_news.3.b:0 "Любопытно."
 nsb_news.4.t:0 "[POL.GetNameDefCap] захватывает Данциг!"
 nsb_news.4.desc:0 "Созданный Версальским договором в 1920 году Вольный город Данциг до сегодняшнего дня был независимым государством под защитой Польши. Однако на фоне растущей напряжённости на германо-польской границе и отказа данцигского правительства пропускать польскую торговлю через городской порт польское правительство сегодня объявило, что Данциг больше не является вольным городом.\n\nУлицы Данцига уже заполняются польскими солдатами, чья единственная задача — усилить государственный контроль над городом. Альберт Форстер и многие другие члены нацистской партии скрылись, и ходят слухи о восстании и последующем переходе на сторону [GER.GetNameDef]."
 nsb_news.4.a:0 "Больше не «вольный» город."
 nsb_news.4.b:0 "Что дальше? Ремилитаризация Рейнской области?"
 nsb_news.4.c:0 "Мы ожидали от Польши большего."
 nsb_news.4.d:0 "Они недолго удержат город."
 nsb_news.4.e:0 "Любопытно."
 nsb_news.5.t:0 "[POL.GetNameDefCap] коронует короля!"
 nsb_news.5.desc.wojtek:0 "После разоблачения самозванства Франциски Шанцковской, получившей корону под ложным предлогом, будто она является Анастасией Романовой, самозванку вынудили отречься, и пришлось искать нового короля.\n\nОбретение [POL.GetLeader] было воспринято как знамение от самого Бога. В конце концов, в Книге Царств Бог послал двух медведей убить тех, кто насмехался над пророком Елисеем. В наши дни Бог послал медведя нести корону, чтобы покарать врагов Польши."
 nsb_news.5.desc.saxon:0 "5 ноября 1916 года германский кайзер Вильгельм II и австрийский император Франц Иосиф подписали совместную декларацию о создании нового королевства на оккупированных польских землях России — Королевства Польского. Однако молодое государство так и не успело найти короля, и тогдашний президент провозгласил Вторую Польскую Республику.\n\nНо теперь, похоже, Польша наконец обрела короля в лице [POL.GetLeader]! Маркграф Мейсена стал польским королём Фридрихом I. Несмотря на страх перед надвигающейся войной с Германией, польский регентский совет предложил маркграфу трон благодаря давним историческим связям Польши с саксонской знатью."
 nsb_news.5.desc.romania:0 "5 ноября 1916 года германский кайзер Вильгельм II и австрийский император Франц Иосиф подписали совместную декларацию о создании нового королевства на оккупированных польских землях России — Королевства Польского. Однако молодое государство так и не успело найти короля, и тогдашний президент провозгласил Вторую Польскую Республику.\n\nНо теперь, похоже, Польша наконец обрела короля в лице [POL.GetLeader]! Между Польшей и Румынией давно существуют дружба и союз, и польский регентский совет, судя по всему, стремится к гораздо более тесным отношениям с [ROM.GetNameDef]. Поскольку новый монарх является наследником румынского престола, лишь вопрос времени, когда судьбы двух стран окажутся неразрывно связаны."
 nsb_news.5.desc.cossack:0 "5 ноября 1916 года германский кайзер Вильгельм II и австрийский император Франц Иосиф подписали совместную декларацию о создании нового королевства на оккупированных польских землях России — Королевства Польского. Однако молодое государство так и не успело найти короля, и тогдашний президент провозгласил Вторую Польскую Республику.\n\nНо теперь, похоже, Польша наконец обрела короля в лице [POL.GetLeader]! Казак, дворянин и военачальник, [POL.GetLeader] выглядит маловероятным претендентом на польский трон, но его неугасимое стремление создать личное владение в Балтике, несомненно, привлекает польских министров, всё ещё мечтающих о восстановленной Речи Посполитой."
 nsb_news.5.desc.romanov:0 "\n5 ноября 1916 года германский кайзер Вильгельм II и австрийский император Франц Иосиф подписали совместную декларацию о создании нового королевства на оккупированных польских землях России — Королевства Польского. Однако молодое государство так и не успело найти короля, и тогдашний президент провозгласил Вторую Польскую Республику.\n\nНо теперь, похоже, Польша наконец обрела короля в лице [POL.GetLeader]! Подобно Ядвиге до неё, правящая королева решила принять титул «короля». Хотя многие сомневаются, что она действительно является дочерью царя Николая II, её всё же короновали в Варшаве как короля Польши Анастасию Романову."
 nsb_news.5.desc.habsburg:0 "5 ноября 1916 года германский кайзер Вильгельм II и австрийский император Франц Иосиф подписали совместную декларацию о создании нового королевства на оккупированных польских землях России — Королевства Польского. Однако молодое государство так и не успело найти короля, и тогдашний президент провозгласил Вторую Польскую Республику.\n\nНо теперь, похоже, Польша наконец обрела короля в лице [POL.GetLeader]! Родившийся в знатной семье Габсбургов Кароль Ольбрахт служит в польской армии почти столько же, сколько существует само польское государство, и сегодня под ликование толпы его избрали первым королём Польши из династии Габсбургов."
 nsb_news.5.a:0 "Да здравствует король!"
 nsb_news.5.b:0 "Королевство настало."
 nsb_news.5.c:0 "Что это за безумие?"
 nsb_news.6.t:0 "Националисты захватывают польское правительство"
 nsb_news.6.desc:0 "Эндеция и «Фаланга» давно поддерживали отношения с польским правительством, но постоянное сотрудничество Игнация Мосцицкого с этими ультраправыми силами в конце концов привело его к падению. По мере роста их влияния в польском правительстве [POL.GetLeader] теперь сменил Мосцицкого на посту президента Польши.\n\nПока неясно, считает ли новое националистическое правительство, что сможет каким-то образом умиротворить иностранные державы, претендующие на его территории, или же на горизонте Польши появились новые союзы."
 nsb_news.6.a:0 "Польша возродилась и стала сильнее."
 nsb_news.6.b:0 "Какой ужас."
 nsb_news.7.t:1 "[POL.GetAdjective] и [From.GetAdjective] короны вступают в унию"
 nsb_news.7.desc:0 "В результате странного поворота событий и [From.GetNameDef], и [POL.GetNameDef] оказались под властью [POL.GetLeader]. Хотя пока эти две страны остаются отдельными, общий глава государства означает, что дипломатически они неразрывно связаны.\n\nВероятно, вскоре эта личная уния перерастёт в объединение [FROM.GetAdjective] и [POL.GetAdjective] государств, но пока союз остаётся исключительно дипломатическим."
 nsb_news.7.a:0 "Скоро мы станем едины."
 nsb_news.7.b:0 "Любопытно."
 nsb_news.8.t:0 "Королевство Литва"
 nsb_news.8.desc:0 "4 июня 1918 года Вильгельм Карл фон Урах был демократически избран королём Литвы при подавляющей поддержке, однако вмешательство Германской империи привело к аннулированию результатов референдума, и Литва так и не объединилась со своим королём. Несмотря на это, сегодня президент Литвы упразднил собственную должность и провозгласил короля Миндаугаса III главой нового Королевства Литва.\n\nТеперь, когда Антанас Сметона занимает пост премьер-министра Литвы, страна стала абсолютной монархией, и, судя по всему, по всей стране распространяется новая волна литовского патриотизма и воинственного национализма."
 nsb_news.8.a:0 "Ещё одна страна пала перед монархизмом."
 nsb_news.8.b:0 "Что это будет значить для нас?"
 nsb_news.8.c:0 "Королевство возрождено!"
 nsb_news.8.d:0 "Любопытно."
 nsb_news.9.t:0 "[GetSovietCivilWarName]!"
 nsb_news.9.desc_left:0 "В России вновь разразилась гражданская война. С воспоминаниями о последней гражданской войне, все еще свежими в памяти, это немного удивительно, что это придет к этому. После многих лет политической борьбы между сталинскими и троцкистскими фракциями советское правительство окончательно раскололось, и теперь эти две группы сражаются на улицах за контроль над страной.\n\n[SOV.GetLeader] объявленный [SOV.GetLeader.GetHerselfHimself] Лидером чего [SOV.GetLeader.GetSheHe] звонки [SOV.GetNameDef]И ведет войну против [SOS.Getleader] из [SOV.GetLeader.GetHerHis] в основании [SOV.Capital.GetName]."
 nsb_news.9.desc_right:0 "В Советской России вновь идут открытые бои. Однако на этот раз это война не между большевиками и белыми, а между соперничающими фракциями внутри коммунистической партии. [SOS.GetLeader] удерживает столицу, а повстанцы под руководством [SOV.GetLeader] базируются в районе города [SOV.Capital.GetName]. Ходят слухи, что восстание [SOV.GetLeader] спонсируют иностранные державы, но насколько они правдивы, ещё предстоит выяснить."
 nsb_news.9.desc_exiles:0 "Совершенно неожиданно белые силы вновь поднялись против большевиков. Их дело могло казаться проигранным, но в последние месяцы поступало несколько сообщений о наращивании военных сил в Маньчжурии и Сибири, а сегодня утром в городе [SOV.capital.GetName] было провозглашено Временное правительство России. \n\nПравительство [SOS.GetAdjective] немедленно мобилизовало Красную армию, и Россия вновь оказалась охвачена гражданской войной. Западные державы пока не проявили интереса к вмешательству в конфликт. Однако ещё неизвестно, как на такой поворот событий отреагирует Япония."
 nsb_news.9.a:0 "К победе!"
 nsb_news.9.b:0 "И до этого дошло."
 nsb_news.9.c:0 "Коммунисты уничтожают сами себя."
 nsb_news.9.d:0 "[SOS.GetLeader] наверняка победит."
 nsb_news.9.e:0 "Что это будет значить для коммунистического дела?"
 nsb_news.9.f:0 "Теперь мы видим насилие, заложенное в самой системе!"
 nsb_news.9.g:0 "На этот раз они сами по себе."
 nsb_news.9.h:0 "Их уже однажды разбили, наверняка раздавят и снова!"
 nsb_news.9.i:0 "Благородное дело, но смогут ли они действительно победить?"
 nsb_news.10.t:0 "Конец [GetSovietCivilWarName]!"
 nsb_news.10.desc_stalinist:0 "После капитуляции последних подразделений повстанцев [GetSovietCivilWarName] официально завершена. В напыщенной речи перед народом [SOS.GetLeader] объявляет себя творцом этой победы и восхваляет храбрость и верность Красной армии. \n\nТеперь, когда внутренние враги уничтожены раз и навсегда, [SOV.Getleader] может обратить взор за пределы страны. Долгосрочные последствия масштабного разрушения промышленности и гибели людей ещё только предстоит увидеть."
 nsb_news.10.desc_communist_opposition:0 "Капитуляция последних оставшихся подразделений, верных [SOS.GetLeader], знаменует конец [GetSovietCivilWarName]. [SOV.GetLeader] объявляет [SOV.GetLeader.GetHerselfHimself] победителем и клянётся поднять [SOV.GetNameDef] из пепла гражданской войны и разрушений. Предстоящая задача огромна, а положение в мире неясно, но [SOV.GetLeader.GetSheHe] твёрдо убеждён, что для [SOV.GetNameDef] и всего мира только что началась новая эпоха. Сможет ли [SOV.GetLeader.GetSheHe] воплотить эти заявления в жизнь, ещё предстоит увидеть."
 nsb_news.10.desc_exiles:0 "То, что казалось невозможным, возобновление борьбы с большевиками белогвардейским движением в изгнании, несмотря ни на что, обернулось победой.[SOV.GetLeader] объявленный [SOS.GetNameDef] Избит и поклялся вернуть России былую славу. Война опустошила большую часть России и дорого обошлась стране.\n\nМестонахождение [SOS.GetLeader] До сих пор они неизвестны. Ходят слухи, что [SOS.GetLeader.GetSheHe] бежал из страны за несколько дней до капитуляции, и [SOS.GetLeader.GetSheHe] Возможно, он скрывается где-то в Южной Америке."
 nsb_news.10.desc_exiles_puppet:0 "При помощи Японии Временное правительство России сумело победить [SOS.GetLeader] и одержать верх в [GetSovietCivilWarName]. Однако превращение фактически в зависимое государство [JAP.GetNameDef] — высокая цена, заставляющая многих сомневаться, действительно ли это победа белого дела."
 nsb_news.10.a:0 "Мы победили!"
 nsb_news.10.b:0 "Серьёзный удар по коммунистической революции."
 nsb_news.10.c:0 "Действительно удивительно."
 nsb_news.10.d:0 "Сталинская Россия рассыпалась как карточный домик."
 nsb_news.10.e:0 "Наверное, избавиться от Сталина было к лучшему."
 nsb_news.10.f:0 "Этим новым лидерам будет трудно доверять."
 nsb_news.10.g:0 "Возможно, с [SOV.GetLeader] будет проще договориться."
 nsb_news.11.t:0 "$SOV_iosif_stalin$ убит"
 nsb_news.11.desc:1 "Несмотря на чрезвычайные меры безопасности вокруг него, лидер [SOV.GetNameDef], $SOV_iosif_stalin$, найден мёртвым на своей даче — предположительно, он был убит. Столица [SOV.GetAdjective] полнится слухами, и, похоже, власть, по крайней мере временно, перешла к тройке во главе с $SOV_lavrenty_beriya$. Однако новый лидер не пользуется особой популярностью, поэтому неизвестно, сможет ли он удержаться у власти, если его положение окажется под угрозой. НКВД, как сообщается, ведёт расследование по всем направлениям, а Берия поклялся найти виновных в убийстве."
 nsb_news.11.a:0 "Может быть, НКВД и сам как-то к этому причастен?"
 nsb_news.11.b:0 "О нет!"
 nsb_news.12.t:0 "[SOV.GetAdjective] государственный переворот"
 nsb_news.12.desc:0 "Стремительным ударом [SOV.GetAdjective] оппозиция арестовала и свергла тройку во главе с Берией. На рассвете части Красной армии окружили столицу, а подразделения специального назначения тайно арестовали $SOV_lavrenty_beriya$ и вывезли его в безопасное место ещё до того, как личная охрана поняла, что произошло. Объявлено о создании нового правительства, очевидным лидером страны стал [SOV.GetLeader], а $SOV_lavrenty_beriya$ обвинён в государственной измене против [SOV.GetNameDef]."
 nsb_news.12.a:0 "Мы живём в интересные времена."
 nsb_news.12.b:0 "Всё становится только хуже."
 pavel_events.3.a:0 "Если это позволит избежать войны..."
 pavel_events.3.b:0 "Это что, какая-то шутка? Нет!"
 pavel_events.3.desc:0 "Из [From.GetNameDef] прибыла тревожная телеграмма с требованием немедленно передать «бывшие польские территории». Речь идёт о Померании, Пруссии и Силезии.\n\nС тех пор как престол занял [From.GetLeader], польское государство стало несколько непредсказуемым, однако мало кто мог ожидать, что [From.GetLeader.GetSheHe] осмелится потребовать территории у [Root.GetNameDef]."
 pavel_events.3.t:0 "[From.GetNameDefCap] требует Восточную Германию!"
 pavel_events.301.a:0 "Погодите, серьёзно?"
 pavel_events.301.desc:0 "В ходе событий, которых никто не мог предвидеть, [From.GetNameDef] уступил требованиям [Root.GetLeader] и передал [Root.GetNameDef] области Силезии, Померании и Пруссии."
 pavel_events.301.t:0 "[From.GetNameDefCap] уступает"
 pavel_events.302.a:0 "Наши требования будут выполнены на поле боя."
 pavel_events.302.desc:0 "Как и ожидалось, немцы отвергли требования [Root.GetLeader], сочтя их какой-то тщательно продуманной шуткой. Поскольку дипломатия не смогла переубедить [From.GetNameDef], [Root.GetLeader] вскочил на коня и поскакал к границе, лично передав решение вопроса в руки военных."
 pavel_events.302.t:0 "[From.GetNameCap] отказывается уступать территории"
 NSB_poland_monarchist_events.6.t:0 "[From.GetNameDefCap] требует нашей аннексии"
 NSB_poland_monarchist_events.6.desc:0 "Ссылаясь на очевидную слабость обороны [Root.GetNameDef], представители [From.GetNameDef] потребовали передать всю территорию [Root.GetNameDef] под прямую польскую оккупацию. Очевидно воодушевлённое бессвязными речами своего короля «Анастасии», польское государство явно обрело неутолимую жажду славянского объединения. Они недвусмысленно заявили, что, если мы не подчинимся, вторжение неизбежно. Как нам ответить?"
 NSB_poland_monarchist_events.6.a:0 "Мы должны капитулировать."
 NSB_poland_monarchist_events.6.b:0 "Нелепость! Мы отказываемся!"
 NSB_poland_monarchist_events.601.desc:0 "[From.GetNameDefCap] принял наше недавнее требование присоединиться к [Root.GetNameDef]. [Root.GetAdjective] войска уже заполняют регион, подавляя любое местное сопротивление ещё до его возникновения. Благодаря этой великой победе мы ещё больше приблизились к своей цели — объединению славян."
 NSB_poland_monarchist_events.601.t:0 "[From.GetNameDefCap] соглашается!"
 NSB_poland_monarchist_events.602.desc:0 "К нашему удивлению, [From.GetAdjective] правительство отказалось выполнить наше требование и передать контроль над Балканами государству [Root.GetNameDef]. Попытки найти дипломатическое решение провалились, и теперь вопрос предстоит решать военным."
 NSB_poland_monarchist_events.601.a:0 "Это и правда сработало?"
 NSB_poland_monarchist_events.602.t:0 "[From.GetNameDefCap] отказывается!"
 NSB_poland_monarchist_events.602.a:0 "Значит, будет война."
 POL_habsburg_events.1.t:0 "[From.GetNameDefCap] требует власти Габсбургов!"
 POL_habsburg_events.1.desc:0 "После восшествия [From.GetLeader] на польский престол король сегодня предъявил [Root.GetLeader] ультиматум: отказаться от власти в Венгрии в пользу Отто фон Габсбурга. Хотя такое решение можно расценить как нарушение Трианонского договора, похоже, [From.GetLeader] не намерен принимать отказ."
 POL_habsburg_events.1.a:0 "У нас будет король из династии Габсбургов."
 POL_habsburg_events.1.b:0 "Мы отказываемся."
 POL_habsburg_events.101.t:0 "[From.GetNameDefCap] коронует Габсбурга"
 POL_habsburg_events.101.desc:0 "Похоже, наш ультиматум убедил [From.GetNameDef] короновать Отто фон Габсбурга королём Венгрии! Теперь, когда и венгерский, и польский престолы принадлежат Габсбургам, для Европы наступает новая эпоха их правления."
 POL_habsburg_events.101.a:0 "О да, всё складывается как надо."
 POL_habsburg_events.102.t:0 "[From.GetNameDefCap] отказывается"
 POL_habsburg_events.102.desc:0 "Венгерское правительство совершенно не впечатлил ультиматум с требованием возвести Отто фон Габсбурга на венгерский престол. Наш ультиматум провалился, и теперь дело находится в руках военных."
 POL_habsburg_events.102.a:0 "Время для агрессивных переговоров."
 POL_habsburg_events.2.t:0 "[From.GetNameDefCap] предлагает союз"
 POL_habsburg_events.2.desc:0 "Поскольку обеими нашими странами правит династия Габсбургов, [From.GetLeader] предложил, чтобы [Root.GetNameDef] и [From.GetNameDef] объединили силы для защиты интересов Габсбургской монархии по всей Европе."
 POL_habsburg_events.2.a:0 "Конечно, мы присоединимся."
 POL_habsburg_events.2.b:0 "Нас это не интересует."
 POL_habsburg_events.201.t:0 "[From.GetLeader] отвергает пакт"
 POL_habsburg_events.201.desc:0 "Несмотря на наши родственные связи, похоже, [From.GetNameDef] совершенно не заинтересован в заключении союза с [Root.GetNameDef]."
 POL_habsburg_events.201.a:0 "Возможно, нам стоит обратиться к Союзникам."
 NSB_soviet_paranoia_system_events.01.t:0 "[Root.GetLeader] обеспокоен фракционностью"
 NSB_soviet_paranoia_system_events.01.desc:0 "На недавнем заседании Центрального комитета товарищ [Root.GetLeader] отметил усиление фракционности внутри партии. Все члены комитета поспешили заверить его в своей полной и безоговорочной поддержке, однако это, судя по всему, почти не развеяло его опасений. По словам товарища [Root.GetLeader], мы всегда должны сохранять бдительность и искать диверсантов и вредителей, замышляющих против государства, какую бы должность они ни занимали.\n\nЭта новость стала неожиданностью для многих членов партии, считавших, что угроза раскола исчезла после изгнания Троцкого."
 NSB_soviet_paranoia_system_events.01.a:0 "Есть ли реальные основания для его тревог?"
 SOV_paranoia_system_intro_tt:0 "£SOV_paranoia_text_icon Система паранойи теперь активна."
 SOV_paranoia_system_nkvd_trait_tt:0 "Политические советники с чертой §Y$head_of_the_nkvd$§! будут еженедельно повышать £SOV_paranoia_text_icon политическую паранойю."
 NSB_soviet_paranoia_system_events.11.t:0 "Советник обвинён в государственной измене"
 NSB_soviet_paranoia_system_events.11.desc:1 "Действуя по анонимной наводке, НКВД арестовали [?ROOT.SOV_purged_character_for_loc.GetName] по обвинению в шпионаже, саботаже и заговоре против государства. Хотя мужчина продолжает заявлять о своей невиновности, следователи уверены, что они могут возбудить дело против него в течение еще нескольких недель. Либо он раскроется под допросом, либо из окружающих его людей могут быть собраны достаточные улики, которые готовы дать показания о его преступлениях. В любом случае, наказанием за эти обвинения должна быть смерть или каторжная работа."
 NSB_soviet_paranoia_system_events.11.a:0 "Опухоль, подобравшуюся так близко к сердцу, нужно вырезать без жалости."
 NSB_soviet_paranoia_system_events.11.b:0 "Нельзя осуждать человека на основании столь шатких доказательств!"
 NSB_soviet_paranoia_system_events.12.t:0 "Заговор среди государственных служащих"
 NSB_soviet_paranoia_system_events.12.desc:1 "НКВД обнаружил доказательства крупномасштабного заговора внутри гражданской администрации. Похоже, некоторые бюрократы из Госплана слишком сблизились с управляющими заводами и занизили производственные показатели пятилетнего плана. По мнению НКВД, это явное свидетельство антисоветского саботажа и преднамеренного ослабления советской системы. \n\n Арестованные заговорщики быстро называют на допросах новых участников заговора."
 NSB_soviet_paranoia_system_events.12.a:0 "Эту коррупцию необходимо искоренить."
 NSB_soviet_paranoia_system_events.12.b:0 "Это нелепая чрезмерная реакция."
 NSB_soviet_paranoia_system_events.13.t:0 "Нелояльность в НКВД?"
 NSB_soviet_paranoia_system_events.13.desc:1 "Группа младших офицеров НКВД представила [Root.GetLeader] доказательства того, что нынешний глава НКВД разрабатывал планы по установлению контроля над столицей «в случае крупных беспорядков». Они считают это лишь предлогом, а сами планы — подготовкой к насильственному захвату власти. \n\nСтолкнувшись с этими доказательствами, глава НКВД сперва попытался объяснить, что речь идёт об обычных планах, существовавших много лет и лишь недавно обновлённых. Однако после дальнейшего расследования и тщательного допроса он раскрыл существование крупной сети иностранных агентов внутри НКВД, которые вместе с зарубежными спецслужбами готовили свержение правительства."
 NSB_soviet_paranoia_system_events.13.a:0 "Эти чудовищные преступления должны быть сурово наказаны."
 NSB_soviet_paranoia_system_events.13.b:0 "Эти обвинения явно выдуманы."
 NSB_soviet_paranoia_system_events.19.t:1 "[GetMoscowTrialPurgeName]"
 NSB_soviet_paranoia_system_events.19.desc_1:0 "Расследование убийства товарища Кирова в 1934 году обнаружило множество нитей, ведущих к заговору Зиновьева и Троцкого. После серии арестов и допросов доказательств стало лишь больше. \n\nПосле встречи с [Root.GetLeader] Зиновьев и Каменев наконец признались в сотрудничестве с Троцким с целью свержения правительства, убийства советских руководителей и окончательного восстановления капитализма в Советском Союзе. Теперь они предстали перед судом вместе с 14 сообщниками. Обвинения чрезвычайно тяжки — обвинительный приговор будет означать верную смерть."
 NSB_soviet_paranoia_system_events.19.desc_2:0 "После суда над первой группой троцкистов и террористов НКВД продолжил расследование и обнаружил новые доказательства. Карл Радек был арестован и в конце концов сломался на допросе. Он раскрыл существование обширной сети людей, полностью или частично сотрудничавших с Троцким практически во всех сферах государственного управления, включая армию. Главари уже арестованы и признались на допросах.\n\nТеперь эти главари, включая Радека, предстали перед судом. Их преступления менее тяжки, чем обвинения на предыдущем процессе, однако смертный приговор вполне возможен."
 NSB_soviet_paranoia_system_events.19.desc_3:0 "Расследования, предшествовавшие Второму московскому процессу, также раскрыли крупную сеть троцкистов в армии и высшем партийном руководстве во главе с Бухариным. Эти люди были арестованы и допрошены, после чего признались в самых тяжких и чудовищных преступлениях — от подготовки саботажа и покушений до сговора с иностранными державами и даже подмешивания гвоздей в масло с целью покалечить или убить обычных советских граждан.\n\nВ случае обвинительного приговора наказанием почти наверняка станет расстрел."
 NSB_soviet_paranoia_system_events.19.desc_4:0 "Агенты НКВД раскрыли тревожный новый заговор с участием нескольких членов нашей партии. Ещё большую обеспокоенность вызывает то, что после ряда арестов и изнурительных допросов всплыли имена нескольких старых большевиков. Дальнейшее расследование выявило доказательства причастности ряда предполагаемых заговорщиков к саботажу, фракционной деятельности и антисоветскому поведению. Эти люди предстали перед судом и теперь ожидают приговора. Судя по предъявленным обвинениям, признание виновными несомненно повлечёт крайне суровое наказание."
 NSB_soviet_paranoia_system_events.19.a:0 "Ещё одна группа предателей предана правосудию."
 NSB_soviet_paranoia_system_events.19.b:0 "Нельзя позволить революции пожрать собственных детей."
 NSB_soviet_paranoia_system_events.21.t:1 "Генерал [?ROOT.SOV_purged_character_for_loc.GetName] обвинён в государственной измене"
 NSB_soviet_paranoia_system_events.21.desc:1 "В ходе расследования деятельности троцкистов в армии НКВД обнаружил доказательства того, что генерал [?ROOT.SOV_purged_character_for_loc.GetName] ранее неоднократно критиковал товарища [Root.GetLeader] и отмечал огромный вклад Льва Троцкого в революцию во время Гражданской войны. На допросе [?ROOT.SOV_purged_character_for_loc.GetName] сначала заявлял о своём восхищении и преданности [ROOT.GetLeader], но в итоге сломался и признался, что троцкистские агенты связались с ним для создания контрреволюционной ячейки в армии, которая должна была совершать акты саботажа против Красной армии."
 NSB_soviet_paranoia_system_events.21.a:0 "Таким людям не место в армии."
 NSB_soviet_paranoia_system_events.21.b:0 "Очевидно, следователи проявили чрезмерное рвение."
 NSB_soviet_paranoia_system_events.22.t:0 "Заговор в академии"
 NSB_soviet_paranoia_system_events.22.desc:0 "Анонимный осведомитель сообщил о существовании группы учащихся одной из наших самых престижных военных академий. Как выяснилось, эта группа решила изучать не только утверждённую программу и обсуждала идеи опальных реакционных теоретиков. Пока неизвестно, откуда они получили труды этих людей, но тщательное расследование и допрос зачинщиков, несомненно, быстро дадут новые имена."
 NSB_soviet_paranoia_system_events.22.a:0 "Мы должны обеспечить лояльность всех будущих командиров."
 NSB_soviet_paranoia_system_events.22.b:0 "Академия — место, где следует задавать вопросы, и мы не должны этому мешать."
 NSB_soviet_paranoia_system_events.23.t:0 "Кампания против диверсантов"
 NSB_soviet_paranoia_system_events.23.desc:1 "Отчёты о последних крупных учениях показывают, что значительная доля техники вышла из строя из-за механических неисправностей, а многие новобранцы получили травмы. Эти доклады легли на стол товарища [Root.GetLeader], крайне обеспокоенного возможным саботажем со стороны военнослужащих. Он требует выяснить, как новые танки могли получить механические повреждения всего после нескольких дней эксплуатации без технического обслуживания."
 NSB_soviet_paranoia_system_events.23.a:0 "Необходимо начать полномасштабное расследование и поймать виновных!"
 NSB_soviet_paranoia_system_events.23.b:0 "Для современной армии это обычные происшествия."
 NSB_soviet_paranoia_system_events.24.t:1 "[?ROOT.SOV_accuser_character_for_loc.GetName] обвиняет [?ROOT.SOV_accused_character_for_loc.GetName]"
 NSB_soviet_paranoia_system_events.24.desc:1 "Высшее командование армии получило доклад. В нём [?ROOT.SOV_accuser_character_for_loc.GetName] обвиняет своего коллегу, генерала [?ROOT.SOV_accused_character_for_loc.GetName], в крайне серьёзном пренебрежении служебными обязанностями. По словам [?ROOT.SOV_accuser_character_for_loc.GetName], [?ROOT.SOV_accused_character_for_loc.GetName] вступил в сговор с иностранными и реакционными элементами и передавал сведения зарубежной разведке. Он также указывает на множество несчастных случаев во время учений под командованием [?ROOT.SOV_accused_character_for_loc.GetName], утверждая, что на самом деле это были акты саботажа, совершённые вероломным генералом и его сообщниками в армии. После продолжительных допросов сообщники подтвердили обвинения."
 NSB_soviet_paranoia_system_events.24.a:1 "[?ROOT.SOV_accused_character_for_loc.GetName] должен предстать перед судом."
 NSB_soviet_paranoia_system_events.24.b:1 "Это очевидная уловка [?ROOT.SOV_accuser_character_for_loc.GetName], который пытается спасти собственную шкуру."
 NSB_soviet_paranoia_system_events.24.c:0 "Закрыть расследование без вынесения приговора."
 NSB_soviet_paranoia_system_events.28.t:0 "Большая чистка младших офицеров армии"
 NSB_soviet_paranoia_system_events.28.desc:0 "Поступают многочисленные сообщения о широкой сети офицеров, резко критикующих подход [Root.GetLeader] к военным вопросам. Арестованные по обвинениям в мятеже, саботаже и антисоветских взглядах быстро называют на допросах имена других участников сети. Лояльность генералов давно вызывала сомнения, но теперь становится ясно, что, возможно, нельзя доверять даже майорам и полковникам."
 NSB_soviet_paranoia_system_events.28.a:0 "Мы не можем позволить гнили укорениться."
 NSB_soviet_paranoia_system_events.28.b:0 "Эти обвинения чудовищно раздувают незначительные проблемы."
 NSB_soviet_paranoia_system_events.29.t:0 "Большая чистка — суд над генералами"
 NSB_soviet_paranoia_system_events.29.desc:0 "Доказательств существования крупной троцкистской сети в армии становится всё больше. Каждый день НКВД арестовывает новых подозреваемых, чьи имена всплывают в предыдущих признаниях. Они, в свою очередь, нередко называют новых сообщников. На выявление всех генералов, участвующих в заговоре, потребуется время, однако очевидно, что приведённый ниже список включает значительную их часть, чья вина доказана собственными признаниями."
 NSB_soviet_paranoia_system_events.29.a:0 "Все предатели должны заплатить высшую цену."
 NSB_soviet_paranoia_system_events.29.b:0 "Это бессмысленная бойня!"
 NSB_soviet_paranoia_system_events.30.t:0 "Обычная чистка на флоте"
 NSB_soviet_paranoia_system_events.31.t:1 "Адмирал [?ROOT.SOV_purged_character_for_loc.GetName] обвинён в государственной измене"
 NSB_soviet_paranoia_system_events.31.desc:1 "Офицер штаба адмирала [?ROOT.SOV_purged_character_for_loc.GetName] обратился в НКВД и сообщил о ряде подозрительных действий. По его словам, во время недавнего захода в иностранный порт [?ROOT.SOV_purged_character_for_loc.GetName] был очень тепло встречен местными морскими офицерами и мог воспользоваться этим, чтобы передать им секретные сведения. Кроме того, в нескольких портах, посещённых адмиралом, обнаружены троцкистские ячейки, что при желании позволяло ему вступить в заговор с Троцким против государства."
 NSB_soviet_paranoia_system_events.31.a:0 "Таким людям не место на флоте."
 NSB_soviet_paranoia_system_events.33.desc:0 "С различных военно-морских баз поступили отчёты о небольшом росте числа запасных частей, запрошенных для срочного ремонта некоторых кораблей. В докладах утверждается, что повреждения вызваны обычным износом и учебными манёврами, однако НКВД в этом не уверен. [Root.GetLeader] лично заинтересовался вопросом и требует тщательно расследовать все подозрения в саботаже."
 NSB_soviet_paranoia_system_events.38.t:0 "Большая чистка младших офицеров флота"
 NSB_soviet_paranoia_system_events.38.desc:0 "После сообщений политработников о необычной активности на флоте НКВД начал полномасштабное расследование и обнаружил крупную сеть офицеров, глубоко критически и даже враждебно настроенных к советскому строю. Большинство заявляет о верности [Root.GetLeader] и Советскому Союзу, однако очевидно, что иностранные службы легко могли бы превратить их в шпионов. Более того, допросы показали, что несколько человек уже служили капиталистическим государствам и шпионили против нас, а теперь быстро называют новые имена."
 NSB_soviet_paranoia_system_events.39.t:0 "Большая чистка — суд над адмиралами"
 NSB_soviet_paranoia_system_events.39.desc:0 "Расследование деятельности троцкистского центра в вооружённых силах ясно показало, что особенно прочно он укоренился на флоте. Большинство адмиралов, если не все, находятся под серьёзным подозрением, поскольку во время службы за рубежом имели возможность вступать в сговор с иностранными элементами. До сих пор каждый высокопоставленный адмирал, арестованный НКВД, уже через несколько дней допросов признавался в тяжелейших преступлениях, включая шпионаж и саботаж. Всё больше морских офицеров оказываются замешаны в заговоре, и очевидно, что для его искоренения потребуется крайне тщательное расследование."
 NSB_soviet_paranoia_system_events.42.desc:0 "Недавняя проверка ВВС выявила ужасающую череду аварий и катастроф во время учений. Кроме того, многие из наших самых современных самолётов небоеспособны и ожидают ремонта. Причины такого положения дел неясны, но [Root.GetLeader], опасаясь саботажа, потребовал провести полномасштабное расследование."
 NSB_soviet_paranoia_system_events.48.t:0 "Распустить конструкторское бюро"
 NSB_soviet_paranoia_system_events.48.desc:0 "НКВД обнаружил доказательства того, что некоторые руководители одного из наших конструкторских бюро передавали сведения иностранным службам. Кроме того, их недавний проект содержал столько недостатков, что прототип пришлось многократно и основательно переделывать, прежде чем он смог подняться в воздух, что породило подозрения в саботаже. Сейчас НКВД допрашивает конструкторов и инженеров, а ведущий следователь уверен, что получит признания в течение нескольких дней."
 NSB_soviet_paranoia_system_events.48.a:0 "Нельзя позволять подрывным элементам собираться подобным образом."
 NSB_soviet_paranoia_system_events.48.b:0 "Их работа слишком важна."
 NSB_soviet_paranoia_system_events.49.t:0 "Генералы ВВС замешаны в заговоре"
 NSB_soviet_paranoia_system_events.49.desc:0 "Усиленная проверка ВВС принесла результаты. Следователи НКВД добились признаний от ряда младших офицеров, указавших на высокопоставленных генералов, которые неоднократно приказывали проводить учебные вылеты в плохую погоду. Это приводило к предсказуемым катастрофам и росту объёма ремонта, снижая общую боеготовность ВВС. Зачем они это делали, пока неясно, но следователи НКВД уверены, что получат ответы в ближайшие дни."
 NSB_soviet_paranoia_system_events.49.a:0 "Они должны понести ответственность."
 NSB_soviet_paranoia_system_events.49.b:0 "Они лишь выполняли свою работу."
 NSB_soviet_paranoia_system_events.24_paranoia_accused_increase_tt:0 "£SOV_paranoia_text_icon Политическая паранойя повышается в зависимости от уровня подвергнутого чистке командира: §R[?SOV.SOV_accused_unit_leader_level]§!"
 NSB_soviet_paranoia_system_events.24_paranoia_accused_decrease_tt:0 "£SOV_paranoia_text_icon Политическая паранойя снижается в зависимости от уровня подвергнутого чистке командира: §G[?SOV.SOV_accused_unit_leader_level]§!"
 NSB_soviet_paranoia_system_events.24_paranoia_both_increase_tt:0 "£SOV_paranoia_text_icon Политическая паранойя повышается в зависимости от уровня командиров, не подвергнутых чистке: §R[?SOV.SOV_combined_unit_leader_level]§!"
 NSB_soviet_paranoia_system_events.24_paranoia_both_decrease_tt:0 "£SOV_paranoia_text_icon Политическая паранойя снижается в зависимости от уровня командиров, подвергнутых чистке: §G[?SOV.SOV_combined_unit_leader_level]§!"
 SOV_purge_event_not_enough_pp_to_avoid_regular_tt:0 "\nЭтой чистки нельзя избежать, поскольку на момент запуска события значение £GFX_pol_power §Y$POLITICAL_POWER$§! должно быть положительным."
 SOV_purge_event_not_enough_pp_to_avoid_great_tt:0 "\nЭту большую чистку нельзя перенаправить, поскольку на момент запуска события значение £GFX_pol_power §Y$POLITICAL_POWER$§! должно быть положительным."
 SOV_purge_event_unavoidable_purge_great_tt:0 "\nЭту большую чистку нельзя перенаправить."
