 NSB_soviet_five_year_plan.01.t:0 "Третий пятилетний план сорван"
 NSB_soviet_five_year_plan.01.desc:0 "Из-за нынешнего нападения на Родину стало ясно, что наши прежние планы экономического роста больше невыполнимы. Мы сможем вернуться к ним после восстановления мира, но пока обязаны сосредоточиться на военном производстве."
 NSB_soviet_five_year_plan.01.a:0 "Будь они прокляты!"
 NSB_soviet_five_year_plan_tt:0 "Все промышленные фокусы, связанные с §Y$SOV_third_five_year_plan$§!, больше недоступны."
 NSB_soviet_great_patriotic_war.01.t:0 "Николай Иванович Кузнецов просит о назначении"
 NSB_soviet_great_patriotic_war.01.desc:0 "После [?ROOT.SOV_invader_of_ukraine.GetAdjective] вторжения на Украину Николай Кузнецов официально попросил принять его в НКВД, чтобы защищать Родину. Благодаря своему уникальному набору талантов он станет ценным кадром для поддержки партизанских операций в этом регионе."
 NSB_soviet_great_patriotic_war.01.a:0 "Добро пожаловать на борт, товарищ!"
 NSB_soviet_propaganda_capmaign_events.1.t:0 "Юные строители коммунизма"
 NSB_soviet_propaganda_capmaign_events.1.desc:0 "Наши друзья и наставники в государстве [SOV.GetNameDef] начали программу, призванную обеспечить, чтобы подрастающее поколение в полной мере понимало, чего от него ожидают. Хороший коммунист должен быть как физически крепким, чтобы выполнять работу, необходимую для построения лучшего мира, так и хорошо образованным, чтобы полностью понимать, что необходимо делать. \n\nВоодушевлённая молодёжь нашей страны подхватила эту идею и теперь старается как можно точнее следовать такому подходу."
 NSB_soviet_propaganda_capmaign_events.1.a:0 "Они сами построят своё светлое будущее."
 NSB_soviet_propaganda_capmaign_events.2.t:0 "Обещание мира нарушено"
 NSB_soviet_propaganda_capmaign_events.2.desc:0 "Наше решение предпринять упреждающий шаг ради обеспечения дальнейшей безопасности поставило нас в неловкое положение из-за некоторых недавних заявлений. Хотя большинство людей не ставит ситуацию под сомнение открыто, тайная полиция сообщает, что многие в частных разговорах спрашивают, зачем мы обещали мир, если явно готовились к войне. \n\nНикто не осмеливается назвать содеянное нами ложью, но очевидно, что мы утратили значительную долю доверия населения."
 NSB_soviet_propaganda_capmaign_events.2.a:0 "Момент выбран крайне неудачно."
 NSB_soviet_propaganda_capmaign_events.3.desc:0 "Начало войны поставило нас в довольно затруднительное положение в глазах общественности. Большинство согласно, что пострадавшей стороной являемся именно мы, и народный гнев справедливо направлен на захватчиков, однако многие в частных разговорах задаются вопросом, почему [THIS.GetLeader] не предвидел этого нападения. Тайная полиция сообщает, что в нескольких случаях люди пошли ещё дальше и назвали [THIS.GetLeader] \"либо опасно наивным, либо преступно некомпетентным\"."
 NSB_soviet_propaganda_capmaign_events.3.a:0 "Но мы никогда не хотели этой войны!"
 NSB_soviet_foreign_politics_events.1.t:1 "[FROM.GetAdjective] давление на правительство"
 NSB_soviet_foreign_politics_events.1.desc:0 "[FROM.GetAdjective] министр иностранных дел прибыл в столицу для срочных консультаций с [THIS.GetLeader]. [FROM.GetAdjective] делегация привезла длинный список нерешённых вопросов — от безопасности границ до нелестных изображений [FROM.GetLeader] в местной прессе. В пресс-релизе министр иностранных дел подчеркнул важность сотрудничества и мирного взаимодействия, но отметил, что [FROM.GetLeader] \"будет трудно смириться с враждебным или недружественным государством [THIS.GetNameDef]\"."
 NSB_soviet_foreign_politics_events.1.a:0 "Мы готовы вступить в их альянс, если сможем сохранить свою конституцию."
 NSB_soviet_foreign_politics_events.1.b:0 "Мы должны привести своё правительство в соответствие с их правительством."
 NSB_soviet_foreign_politics_events.1.c:0 "Мы не уступим ни пяди."
 NSB_soviet_foreign_politics_events.2.t:2 "[FROM.GetAdjective]Спонсируемые митинги в столице"
 NSB_soviet_foreign_politics_events.2.desc:1 "Несколько политических групп объявили о проведении митингов в столице на этой неделе. Похоже, у них нет никаких конкретных претензий, кроме общего мнения о том, что нам следует улучшить отношения с государством [FROM.GetNameDef] и отстранить от власти всех политиков, критикующих [FROM.GetAdjective] администрацию.\n\nВозможно, эти демонстрации — лишь стихийное проявление общественного мнения, однако примечательно, что ряд ключевых организаторов недавно посетили город [FROM.GetCapitalVictoryPointName] и, судя по всему, начали агитацию сразу после возвращения."
 NSB_soviet_foreign_politics_events.2.a:0 "Что ж, это, безусловно, их право."
 NSB_soviet_foreign_politics_events.2.b:0 "Послать полицию и проломить им головы!"
 NSB_soviet_foreign_politics_events.10.t:1 "Государство [FROM.GetNameDefCap] хочет инвестировать в нашу экономику"
 NSB_soviet_foreign_politics_events.10.desc:0 "[FROM.GetAdjective] правительство начало масштабную программу инвестиций в экономику. В рамках этой программы были выделены средства на строительство сети мостов, туннелей и дорог в столице и других регионах. Соответствующее увеличение возможностей нашей строительной отрасли, несомненно, продолжит приносить плоды и в будущем.\n\nОднако некоторые члены правительства опасаются, что привлечение [FROM.GetAdjective] инженеров и финансирования лишь усилит нашу зависимость от их специалистов в дальнейшем."
 NSB_soviet_foreign_politics_events.10.a:0 "Спасибо, товарищи!"
 NSB_soviet_foreign_politics_events.10.b:0 "Это лишь усилит нашу зависимость от государства [FROM.GetNameDef]"
 NSB_soviet_foreign_politics_events.11.t:1 "Государство [FROM.GetNameDefCap] требует принять меры военного времени"
 NSB_soviet_foreign_politics_events.11.desc:0 "Поскольку война кажется всё более вероятной, [FROM.GetAdjective] правительство начало давить на нас, требуя повысить боеспособность. Они хотят, чтобы мы резко увеличили людские резервы и одновременно сократили сроки подготовки, чтобы выставить больше дивизий на фронт и высвободить [FROM.GetAdjective] дивизии."
 NSB_soviet_foreign_politics_events.11.a:0 "В их словах определённо есть смысл."
 NSB_soviet_foreign_politics_events.11.b:0 "Мы сами решим, как лучше защищать свою страну."
 NSB_soviet_foreign_politics_events.12.t:1 "Государство [FROM.GetNameDefCap] хочет расширить приграничные укрепления"
 NSB_soviet_foreign_politics_events.12.desc:0 "Указывая на растущую угрозу со стороны государства [JAP.GetNameDef], [FROM.GetAdjective] правительство настоятельно предложило нам немедленно начать укрепление границы с государством [JAP.GetNameDef]. Они пообещали материальную и логистическую поддержку, чтобы сократить численность сил, которые им придётся выделять для нашей обороны."
 NSB_soviet_foreign_politics_events.12.a:0 "Мы приветствуем эту инициативу."
 NSB_soviet_foreign_politics_events.12.b:0 "Это стало бы ненужной эскалацией."
 NSB_soviet_foreign_politics_events.13.t:0 "Государство [FROM.GetNameDef] отвергает [ROOT.GetAdjective] директивы"
 NSB_soviet_foreign_politics_events.13.desc:0 "Неожиданно [FROM.GetAdjective] правительство отвергло наши директивы и отказалось следовать планам, представленным нашими чиновниками. Почти похоже, будто [FROM.GetLeader] питает враждебные намерения по отношению к государству [ROOT.GetNameDef]..."
 NSB_soviet_foreign_politics_events.13.a:0 "Серьёзно, что не так с [FROM.GetLeader]?"
 NSB_soviet_foreign_politics_events.20.t:1 "Государство [FROM.GetNameDefCap] присылает военных советников"
 NSB_soviet_foreign_politics_events.20.desc:0 "Чтобы поддержать нашу отчаянную борьбу за сохранение демократии, [FROM.GetLeader] направил группу [FROM.GetAdjective] военных советников. Обладая богатым опытом различных конфликтов, они, несомненно, окажутся чрезвычайно ценными при восстановлении наших вооружённых сил. Благодаря своему оснащению и тактике они также смогут противостоять на поле боя так называемым добровольческим дивизиям различных фашистских держав."
 NSB_soviet_foreign_politics_events.20.a:0 "Мы стоим плечом к плечу!"
 NSB_soviet_foreign_politics_events.30.t:1 "Государство [FROM.GetNameDefCap] требует вернуть Аляску"
 NSB_soviet_foreign_politics_events.30.desc:0 "Несколько недель назад, [FROM.GetAdjective] пропаганда и [FROM.GetAdjective]Выровненные СМИ начали четкий и согласованный толчок, чтобы снова поставить вопрос об Аляске на стол. В принципе, они утверждают, что покупка Аляски в 1867 году была либо мошеннической, либо совершена под принуждением. Они также заявляют, что аляскинцам, как коренным жителям, так и поселенцам, явно будет лучше, если они станут гражданами Аляски. [FROM.GetNameDef].\n\nСегодня, [FROM.GetAdjective] Посол выступил с официальной нотой, заявив, что так называемое «правительство Аляскинской Автономной Республики в изгнании» официально попросило стать частью Аляски. [FROM.GetNameDef]И это [FROM.GetLeader] Он одобрил их просьбу. Единственное, что остается, по его словам, - это договариваться о деталях передачи власти."
 NSB_soviet_foreign_politics_events.30.a:0 "Пусть забирают эту замёрзшую пустошь."
 NSB_soviet_foreign_politics_events.30.b:0 "Очень хорошая шутка."
 NSB_soviet_foreign_politics_events.31.t:0 "Аляска возвращена"
 NSB_soviet_foreign_politics_events.31.desc:0 "На официальной церемонии в форте Ситка государство [FROM.GetNameDef] передало нам суверенитет над Аляской. Хотя большинство жителей Аляски, похоже, испытывает смешанные чувства по поводу этой передачи, население на родине празднует."
 NSB_soviet_foreign_politics_events.31.a:0 "Ещё одна ошибка царей исправлена."
 NSB_soviet_foreign_politics_events.32.t:0 "Государство [FROM.GetNameDefCap] отказывается"
 NSB_soviet_foreign_politics_events.32.desc:0 "The [FROM.GetAdjective] Госсекретарь не удосужился ответить на наши требования лично. Вместо этого в наше посольство было доставлено письмо, подписанное заместителем министра по культурному развитию, в котором говорится, что, хотя они уважают наши амбиции, когда дело доходит до написания полной исторической фантастики, они были бы признательны, если бы мы не использовали официальные каналы для этого."
 NSB_soviet_foreign_politics_events.32.a:0 "О, они думали, что мы блефуем?"
 NSB_soviet_foreign_politics_events.32.b:0 "Последнее, что нам нужно, — ещё больше мёрзлой земли."
 NSB_soviet_foreign_politics_events.150.t:0 "Государство [FROM.GetNameDefCap] подчиняется"
 NSB_soviet_foreign_politics_events.150.desc:0 "После заседания кабинета министров, затянувшегося до раннего утра, [FROM.GetLeader] официально принял наши требования. Наш посол в государстве [FROM.GetNameDef] проследит, чтобы [FROM.GetAdjective] правительство тесно согласовывало с нами любые вопросы внешней и внутренней политики."
 NSB_soviet_foreign_politics_events.150.a:0 "Очень мудро."
 NSB_soviet_foreign_politics_events.151.t:0 "Государство [FROM.GetNameDefCap] вступает в наш альянс"
 NSB_soviet_foreign_politics_events.151.desc:0 "После того как переговоры внутри [FROM.GetAdjective] правительства зашли в тупик, [FROM.GetLeader] предложил компромиссное решение: они готовы принять [THIS.GetAdjective] войска на [FROM.GetAdjective] территории, но не допустят никакого вмешательства в свою систему управления. \n\nКроме того, [FROM.GetAdjective] вооружённые силы останутся действующими, будут укомплектованы [FROM.GetAdjective] офицерами и рядовыми и подчиняться исключительно [FROM.GetAdjective] правительству. Однако [FROM.GetLeader] готов обсудить совместные планы обороны."
 NSB_soviet_foreign_politics_events.151.a:0 "По крайней мере, они будут сражаться на правильной стороне."
 NSB_soviet_foreign_politics_events.152.t:0 "Государство [FROM.GetNameDefCap] отказывается"
 NSB_soviet_foreign_politics_events.152.desc:0 "Наши попытки дипломатически решить нерешённые вопросы с государством [FROM.GetNameDef], похоже, провалились. Когда наш посол явился к [FROM.GetLeader] на очередной раунд переговоров, ему резко заявили, что [FROM.GetAdjective] сторона уже ясно обозначила свою позицию и обсуждать больше нечего."
 NSB_soviet_foreign_politics_events.152.a:0 "Они выбрали худшую участь."
 NSB_soviet_foreign_politics_events.152.b:0 "Не будем давить на них сильнее... пока что."
 NSB_soviet_foreign_politics_events.152.c:0 "Подготовить вторжение в государство [FROM.GetNameDef]!"
 NSB_soviet_foreign_politics_events.152.d:0 "Мы должны подготовить совместное вторжение с [ENG.GetAdjective] стороной"
 NSB_soviet_foreign_politics_events.153.t:0 "Англо-[SOV.GetAdjective] вторжение в Иран"
 NSB_soviet_foreign_politics_events.153.desc:0 "Мы получили дипломатическую ноту от государства [FROM.GetNameDef] с предложением провести совместную военную операцию против государства [PER.GetNameDef]. [FROM.GetAdjective] командование утверждает, что эта операция позволит нам обезопасить иранские нефтяные месторождения и пути снабжения государства [FROM.GetNameDef], а также предотвратить возможное продвижение врага из государства [TUR.GetNameDef] через территорию [PER.GetName] к нефтяным месторождениям Баку и государству [RAJ.GetNameDef]."
 NSB_soviet_foreign_politics_events.153.a:0 "Мы должны обезопасить Персидский коридор!"
 NSB_soviet_foreign_politics_events.153.b:0 "Мы будем уважать [PER.GetAdjective] независимость."
 NSB_soviet_foreign_politics_events.153_soviets_alone_tt:0 "[FROM.GetAdjective] стороне придётся самостоятельно разбираться с государством [PER.GetNameDef]."
 NSB_soviet_foreign_politics_events.154.t:0 "Англо-[SOV.GetAdjective] вторжение в Иран"
 NSB_soviet_foreign_politics_events.154.desc:0 "[FROM.GetAdjective] посол передал ноту, согласно которой государство [FROM.GetNameDef] согласно организовать и провести совместную военную операцию против государства [PER.GetNameDef]. И [ROOT.GetAdjective], и [FROM.GetAdjective] командования уверены, что это будет быстрая и эффективная операция против уступающего числом и технологиями противника, которая позволит нам обезопасить иранские нефтяные месторождения и [FROM.GetAdjective] пути снабжения государства [ROOT.GetNameDef], а также предотвратить возможное продвижение врага из государства [TUR.GetNameDef] через территорию [PER.GetName] к нефтяным месторождениям Баку и государству [RAJ.GetNameDef]."
 NSB_soviet_foreign_politics_events.154.a:0 "Начать подготовку!"
 NSB_soviet_foreign_politics_events.155.t:0 "[FROM.GetAdjective] правительство отказывается"
 NSB_soviet_foreign_politics_events.155.desc:0 "После нескольких изнурительных встреч между [ROOT.GetAdjective] и [FROM.GetAdjective] дипломатами государство [FROM.GetNameDef] решило не участвовать в наших планах в отношении государства [PER.GetNameDef]. Сам [FROM.GetLeader] даже осмелился намекнуть, что это предложение было лишь попыткой оправдать наши территориальные амбиции. \nПохоже, нам придётся самостоятельно разбираться с государством [PER.GetNameDef]."
 NSB_soviet_foreign_politics_events.155.a:0 "Вечно на них нельзя положиться..."
 NSB_soviet_foreign_politics_events.200.t:0 "Государство [FROM.GetNameDefCap] выдвигает требования"
 NSB_soviet_foreign_politics_events.158.t:0 "Новое [FROM.GetAdjective] правительство"
 NSB_soviet_foreign_politics_events.158.desc:0 "После безуспешных переговоров с нашими послами и под сильным давлением СМИ и населения прежний глава шведского правительства решил уйти в отставку и назначить новые выборы. Как и ожидалось, победу на них одержала партия, гораздо более близкая нашим интересам, — [FROM.GetRulingParty] во главе с [FROM.GetLeader]."
 NSB_soviet_foreign_politics_events.158.a:0 "Наконец-то можно ожидать от государства [FROM.GetNameDef] большего сотрудничества."
 NSB_soviet_foreign_politics_events.200.desc:0 "[SOV.GetAdjective] посол передал ноту с требованием немедленных консультаций с [THIS.GetLeader]. Согласно ноте, [SOV.GetAdjective] правительство больше не намерено мириться с \"неопределённой ситуацией в сфере безопасности\" в нашей стране. Не вполне ясно, что именно имеется в виду, но очевидно, что фактически нам предоставлены три варианта: согласиться на размещение [FROM.GetAdjective] войск на нашей территории, заменить своё правительство на более отвечающее потребностям государства [FROM.GetNameDef] или, возможно, подвергнуться военному нападению со стороны государства [FROM.GetNameDef]."
 NSB_soviet_foreign_politics_events.200.a:0 "У нас нет выбора."
 NSB_soviet_foreign_politics_events.200.b:0 "Возможно, мы могли бы пойти на компромисс?"
 NSB_soviet_foreign_politics_events.200.c:0 "Мы будем сражаться за свою свободу!"
 NSB_soviet_foreign_politics_events.210.t:0 "Давление со стороны государства [FROM.GetNameDef]"
 NSB_soviet_foreign_politics_events.210.desc:0 "Похоже, [FROM.GetAdjective] правительство всё сильнее беспокоится из-за нашей дипломатической ситуации. За последнюю неделю [FROM.GetAdjective] посол встречался с [THIS.GetLeader] не менее шести раз, а на последнем раунде переговоров фактически предъявил ультиматум. \n\nЛибо мы заключаем с государством [FROM.GetNameDef] оборонительный пакт и соглашаемся на \"определённый уровень консультаций по внутренним вопросам\", либо государство [FROM.GetNameDef], вероятно, прибегнет к военному вмешательству в нашей стране."
 NSB_soviet_foreign_politics_events.210.a:0 "Сопротивление было бы бесполезным."
 NSB_soviet_foreign_politics_events.210.c:0 "Пусть приходят!"
 NSB_soviet_foreign_politics_events.211.t:0 "Предложение Хакимова"
 NSB_soviet_foreign_politics_events.211.desc:0 "Советский генеральный консул Карим Хакимов удваивает усилия по развитию более тёплых советско-аравийских отношений. Советский мусульманин татарского происхождения, Хакимов заслужил уважение и дружбу Ибн Сауда, когда в феврале 1926 года проехал на личном автомобиле под обстрелом из Джидды к резиденции султана в пустыне, чтобы передать официальную ноту о признании его королём Хиджаза и султаном Неджда. С тех пор этот человек остаётся главным сторонником советско-аравийских отношений. Настоящий советский Лоуренс Аравийский."
 NSB_soviet_foreign_politics_events.211.a:0 "Предложение Хакимова может быть дружеским, но мы должны сохранять бдительность в отношении советских амбиций."
 NSB_soviet_foreign_politics_events.250.t:0 "Государство [FROM.GetNameDefCap] отправляет военную помощь"
 NSB_soviet_foreign_politics_events.250.desc:0 "[FROM.GetAdjective] конвой достиг наших позиций, доставив груз винтовок и других припасов. Неизвестно, когда следующий конвой сможет повторить этот путь, поэтому мы должны растянуть эти запасы как можно дольше."
 NSB_soviet_foreign_politics_events.251.t:0 "Государство [FROM.GetNameDefCap] готовится к войне с государством [JAP.GetNameDef]"
 NSB_soviet_foreign_politics_events.251.desc:0 "Похоже, [FROM.GetLeader] пришёл к выводу, что война с государством [JAP.GetNameDef] неизбежна и, вероятно, начнётся в ближайшем будущем. Поэтому [FROM.GetAdjective] представитель в нашей столице призвал нас привести приграничные войска в состояние боевой готовности и мобилизовать армию к неминуемому [JAP.GetAdjective] нападению."
 NSB_soviet_foreign_politics_events.251.a:0 "Мы будем готовы."
 NSB_soviet_foreign_politics_events.252.t:0 "Война с государством [JAP.GetNameDef]"
 NSB_soviet_foreign_politics_events.252.desc:0 "Давно ожидаемая война с государством [JAP.GetNameDef] началась. Ранее сегодня [FROM.GetAdjective] войска начали наступление на [JAP.GetAdjective] позиции по всему Китаю, и теперь настало время нам присоединиться к ним. Плечом к плечу с нашими [FROM.GetAdjective] союзниками мы изгоним [JAP.GetAdjective] войска с наших земель!"
 NSB_soviet_foreign_politics_events.252.a:0 "Настал день расплаты!"
 NSB_soviet_foreign_politics_events.260.t:0 "Государство [FROM.GetNameDefCap] предлагает мир"
 NSB_soviet_foreign_politics_events.260.desc:0 "После захвата Курильских островов и Южного Сахалина [FROM.GetAdjective] командующий предложил прекратить огонь по текущей линии фронта в качестве подготовки к мирному договору. Само собой подразумевалось, что этот договор, скорее всего, признает как минимум северные острова новой границей, фактически передав Курилы и Южный Сахалин государству [FROM.GetNameDef]."
 NSB_soviet_foreign_politics_events.260.a:0 "Это болезненно, но терпимо."
 NSB_soviet_foreign_politics_events.260.b:0 "Война ещё может обернуться в нашу пользу."
 NSB_soviet_foreign_politics_events.261.desc:0 "После захвата Курильских островов и Южного Сахалина, а также высадки на Хоккайдо, [FROM.GetAdjective] командующий предложил прекратить огонь по текущей линии фронта в качестве подготовки к мирному договору. Вероятно, этот договор признает [FROM.GetAdjective] владение Курилами и Сахалином, а Хоккайдо перейдёт под [FROM.GetAdjective] управление."
 NSB_soviet_foreign_politics_events.262.b:0 "Какое нелепое предложение!"
 NSB_soviet_foreign_politics_events.263.t:0 "Государство [FROM.GetNameDefCap] предлагает альянс"
 NSB_soviet_foreign_politics_events.263.desc:0 "Посланник [FROM.GetLeader] обратился к нам со смелым предложением: [FROM.GetAdjective] правительство готово подписать с нами союзный договор! Хотя детали ещё предстоит согласовать, очевидно, что этот союз будет прежде всего направлен на сокращение или устранение влияния государства [USA.GetNameDef] в Тихом океане. Одним махом он устранит главную угрозу нашим позициям в Китае и одновременно высвободит значительные силы для применения в других местах.\n\nБольшинство офицеров флота с энтузиазмом относится к этой перспективе, однако многие армейские офицеры глубоко подозревают неладное, опасаясь, что государство [FROM.GetNameDef] ударит нам в спину, как только мы отвернёмся."
 NSB_soviet_foreign_politics_events.263.a:0 "Это кардинально изменит баланс сил."
 NSB_soviet_foreign_politics_events.263.b:0 "Им нельзя доверять и рассчитывать, что они сдержат слово."
 NSB_soviet_foreign_politics_events.264.t:0 "Государство [FROM.GetNameDef] принимает наши условия мира"
 NSB_soviet_foreign_politics_events.264.desc:0 "После [GetAppropriateSovietProgressInJapan] [FROM.GetLeader] принял наше мирное предложение и согласился на наши территориальные требования в обмен на немедленное прекращение боевых действий между нашими странами.\nТеперь они передадут государству [ROOT.GetNameDef] региональные администрации областей [537.GetName], [555.GetName] и [536.GetName]."
 NSB_soviet_foreign_politics_events.264.desc_default:0 "[ROOT.GetAdjective] оккупации [FROM.GetAdjective] северных островов силами [GetAppropriateRedArmyNsName],"
 NSB_soviet_foreign_politics_events.264.desc_hokkaido:0 "продвижения [GetAppropriateRedArmyNsName] по [FROM.GetAdjective] северным территориям, включая область [536.GetName],"
 NSB_soviet_foreign_politics_events.264.a:0 "Мудрое решение со стороны [FROM.GetLeader]."
 NSB_soviet_foreign_politics_events.265.t:0 "Государство [FROM.GetNameDef] отвергает наши условия мира"
 NSB_soviet_foreign_politics_events.265.desc:0 "Государство [From.GetNameDef] отвергло наше мирное предложение, поклявшись продолжать борьбу, пока [ROOT.GetAdjective] оккупация [FROM.GetAdjective] территорий не будет ликвидирована, а война не перенесётся на нашу территорию."
 NSB_soviet_foreign_politics_events.265.a:0 "Неужели [FROM.GetLeader] не понимает, чем это закончится для его страны?"
 NSB_soviet_foreign_politics_events.266.t:0 "[ROOT.GetAdjective]-[FROM.GetAdjective] пакт о дружбе"
 NSB_soviet_foreign_politics_events.266.desc:0 "[FROM.GetAdjective] правительство осталось довольно нашим примирительным настроем и приняло наше предложение. \nВсего несколько часов назад [FROM.GetAdjective] и [ROOT.GetAdjective] дипломаты подписали пакт о ненападении, который, по словам [FROM.GetAdjective] посла, может открыть новую эпоху сотрудничества на Востоке."
 NSB_soviet_foreign_politics_events.266.a:0 "Наши компромиссы окупятся в будущем."
 NSB_soviet_foreign_politics_events.267.t:0 "Государство [FROM.GetNameDef] отвергает наше предложение об оборонительном пакте"
 NSB_soviet_foreign_politics_events.267.desc:0 "[FROM.GetAdjective] правительство не впечатлило наше предложение о примирении, и оно решительно отвергло его. \nПохоже, нам придётся сохранять бдительность в отношении амбиций [FROM.GetLeader] на Дальнем Востоке..."
 NSB_soviet_foreign_politics_events.267.a:0 "Нам придётся скорректировать свои планы..."
 NSB_soviet_foreign_politics_events.268.t:0 "[ROOT.GetAdjective]-[FROM.GetAdjective] пакт против государства [USA.GetNameDef]"
 NSB_soviet_foreign_politics_events.268.desc:0 "[FROM.GetAdjective] правительство проявило искренний интерес к нашему предложению о наступательном пакте против государства [USA.GetNameDef], и дипломаты [FROM.GetLeader] только что подписали представленный им договор. [FROM.GetAdjective] вооружённые силы уже перестраиваются с учётом новой обстановки, а их верховное командование уверено, что вместе мы победим государство [USA.GetNameDef] и раз и навсегда покончим с его влиянием на международной арене."
 NSB_soviet_foreign_politics_events.268.a:0 "Мы обуздаем [USA.GetAdjective] империализм!"
 NSB_soviet_foreign_politics_events.269.t:0 "Государство [FROM.GetNameDef] отвергает наше предложение о наступательном пакте"
 NSB_soviet_foreign_politics_events.269.desc:0 "[FROM.GetAdjective] правительство отвергло наше предложение. Похоже, [FROM.GetLeader] не заинтересован в предложенном нами договоре, который объединил бы [ROOT.GetAdjective] и [FROM.GetAdjective] силы в наступательном пакте против государства [USA.GetNameDef]."
 NSB_soviet_foreign_politics_events.269.a:0 "Прискорбно..."
 SOV_decision_will_be_locked_tt:0 "\nРешение больше не будет доступно. Мы можем предъявить стране ультиматум только один раз."
 SOV_decision_will_remain_available_tt:0 "\nРешение останется доступным."
 NSB_soviet_foreign_politics_events.270.t:1 "[FROM.GetAdjective]ое расширение Транскаспийской железной дороги"
 NSB_soviet_foreign_politics_events.270.desc:1 "Российская Транскаспийская железная дорога проходит через Центральную Азию с восточной конечной остановкой в Ташкенте. The [FROM.GetAdjective] Сейчас правительство намерено его расширить и направило предложение о подключении линии к нашему капиталу для того, чтобы наладить более качественные торговые отношения. Похоже, что [FROM.GetAdjective] Чиновники заинтересованы в выходе на рынок Синьцзяна и утверждают, что это может стать первым шагом на взаимовыгодном пути развития и обмена."
 NSB_soviet_foreign_politics_events.270.a:1 "Мы поддерживаем эту инициативу!"
 NSB_soviet_foreign_politics_events.270.b:1 "[SOV.GetAdjective]им торговцам нечего вмешиваться в дела нашей страны."
 NSB_soviet_foreign_politics_events.271.t:0 "[FROM.GetNameDefCap] принимает наше предложение"
 NSB_soviet_foreign_politics_events.271.desc:1 "The [SIK.GetAdjective] Консул, находящийся в Семипалатинске, связался с нашими дипломатами, чтобы сообщить, что [SIK.GetAdjective] Правительство охотно принимает [ROOT.GetAdjective] инициатива по расширению Транскаспийской линии, связи с ней Урумчи. Он также заявил, что правительство провинции [SIK.GetNameDef] Он открыт для развития новых экономических и дипломатических отношений с нашей страной."
 NSB_soviet_foreign_politics_events.271.a:1 "Перед нами открываются двери нового экономического рынка!"
 NSB_soviet_foreign_politics_events.272.t:0 "[FROM.GetNameDefCap] отклоняет наше предложение"
 NSB_soviet_foreign_politics_events.272.desc:1 "The [SIK.GetAdjective] Консул, находящийся в Семипалатинске, связался с нашими дипломатами, чтобы сообщить, что [SIK.GetAdjective] Правительство приняло решение отклонить [ROOT.GetAdjective] Инициатива по расширению Транскаспийской линии и подключению к ней [SIK.GetAdjective] Столица, Урумчи, с ним."
 NSB_soviet_foreign_politics_events.272.a:1 "Неожиданный и крайне прискорбный поворот событий."
 NSB_soviet_foreign_politics_events.272.b:1 "Они играют с огнём!"
 NSB_soviet_foreign_politics_events.273.t:1 "[FROM.GetAdjective]ая разведка полезных ископаемых в регионе [619.GetName]"
 NSB_soviet_foreign_politics_events.273.desc:1 "The [FROM.GetAdjective] Представитель в Дихуа представил нам новое предложение по поиску ресурсов для [619.GetName] и совершенствование инфраструктуры региона в целях содействия эксплуатации. В обмен на это они просят [FROM.GetAdjective] Торговые предприятия погашаются в экспорте сырьевых товаров, таких как золото и редкие полезные ископаемые из Алтая."
 NSB_soviet_foreign_politics_events.273.a:1 "Это соглашение выгодно обеим сторонам."
 NSB_soviet_foreign_politics_events.273.b:1 "Они лишь хотят усилить [FROM.GetAdjective]ое влияние в нашей стране."
 NSB_soviet_foreign_politics_events.274.t:0 "[FROM.GetNameDefCap] принимает наше предложение"
 NSB_soviet_foreign_politics_events.274.desc:1 "[ROOT.GetAdjective]ий представитель в Дихуа получил от [SIK.GetAdjective]их дипломатов уведомление о принятии нашего предложения провести разведку ресурсов в регионе [619.GetName] и улучшить местную инфраструктуру, чтобы облегчить их разработку. Взамен расходы [SIK.GetAdjective]их торговых организаций будут возмещены экспортом таких товаров, как золото и редкие минералы с Алтая."
 NSB_soviet_foreign_politics_events.274.a:1 "Это открывает новые торговые возможности!"
 NSB_soviet_foreign_politics_events.275.t:0 "[FROM.GetNameDefCap] отклоняет наше предложение"
 NSB_soviet_foreign_politics_events.275.desc:1 "[ROOT.GetAdjective]ий представитель в Дихуа получил от [SIK.GetAdjective]их дипломатов уведомление о том, что их правительство отклонило наше предложение инвестировать в страну. Похоже, [SIK.GetNameDef] больше не заинтересован в открытии торговли и развитии более тесных деловых и дипломатических отношений с государством [ROOT.GetNameDef]."
 NSB_soviet_foreign_politics_events.275.a:1 "Неразумное решение..."
 NSB_soviet_foreign_politics_events.275.b:1 "Вообще-то мы и не спрашивали разрешения."
 NSB_soviet_foreign_politics_events.276.t:1 "[FROM.GetAdjective]ая разведка полезных ископаемых в регионе [618.GetName]"
 NSB_soviet_foreign_politics_events.276.desc:1 "Новый [FROM.GetAdjective] Предложение было передано нашим дипломатам. Похоже, что [FROM.GetNameDefCap] У нас есть большой интерес к поиску минеральных и нефтяных источников в северной части нашей страны, и они предлагают осуществлять разведку полезных ископаемых и расширение инфраструктурных объектов в регионе в обмен на права на эксплуатацию ресурсов.[FROM.GetAdjective] Представители утверждают, что эти промышленные инвестиции естественным образом будут стимулировать нашу национальную эксплуатацию золота и серебра в регионе."
 NSB_soviet_foreign_politics_events.276.a:1 "Эти ресурсы для нас неважны. Нам нужно золото!"
 NSB_soviet_foreign_politics_events.276.b:1 "Ресурсы в [ROOT.GetAdjective]ой земле принадлежат государству [ROOT.GetName]!"
 NSB_soviet_foreign_politics_events.277.t:0 "$NSB_soviet_foreign_politics_events.274.t$"
 NSB_soviet_foreign_politics_events.277.desc:1 "[ROOT.GetAdjective]ие дипломаты в государстве [SIK.GetNameDef] сообщают, что наше предложение провести разведку месторождений полезных ископаемых и нефти на севере страны [SIK.GetNameDef] принято. Провинциальное правительство [SIK.GetName] стремится расширить инфраструктуру в регионе [618.GetName], что естественным образом увеличит добычу золота и серебра. Поэтому оно согласно предоставить нам право разрабатывать любые стратегические ресурсы, обнаруженные в регионе [618.GetName], в качестве возмещения [ROOT.GetAdjective]их инвестиций."
 NSB_soviet_foreign_politics_events.277.a:1 "Они не могли отказаться от такого предложения!"
 NSB_soviet_foreign_politics_events.278.t:0 "[FROM.GetAdjective]ая военная помощь"
 NSB_soviet_foreign_politics_events.278.desc:0 "Письмо от The [FROM.GetAdjective] Посол был доставлен к нашим дипломатам, в которых наш сосед, видимо, обеспокоен [ROOT.GetName] военного потенциала, предлагает военную помощь для проведения реконструкции [ROOT.GetAdjective] армии путем направления в нашу страну техники и инструкторов. Мы получим самолеты и технику для авиации, винтовки и пулеметы для наших войск, будут построены артиллерийские цеха и укрепления, открыты пилотные школы для подготовки местных летчиков. В обмен на это, [FROM.GetAdjective] Правительство стремится уменьшить барьеры в торговле и увеличить [ROOT.GetAdjective] экспорт таких сырьевых товаров, как шерсть, хлопок, мех и шкуры."
 NSB_soviet_foreign_politics_events.278.a:0 "Это действительно щедрое предложение."
 NSB_soviet_foreign_politics_events.278.b:0 "Мы должны сопротивляться [FROM.GetAdjective]ой экономической оккупации!"
 NSB_soviet_foreign_politics_events.279.t:0 "[FROM.GetNameDefCap] принимает нашу военную помощь"
 NSB_soviet_foreign_politics_events.279.desc:0 "Наши дипломаты в государстве [SIK.GetNameDef] сообщили, что [SIK.GetLeader] принял наше предложение оказать военную помощь стране [SIK.GetName]. Очевидно, китайский лидер стремится укрепить армию и оборону и считает, что при [ROOT.GetAdjective]ой поддержке [SIK.GetNameDef] сможет противостоять враждебным силам, наступающим с востока."
 NSB_soviet_foreign_politics_events.279.a:0 "Мудрое решение!"
 NSB_soviet_foreign_politics_events.280.t:0 "[FROM.GetAdjective]ая поддержка территориальной экспансии"
 NSB_soviet_foreign_politics_events.280.desc:0 "После территориальной экспансии на восток, [FROM.GetAdjective] Правительство проявило интерес к поддержке нашего роста и помощи в строительстве инфраструктуры и военной обороны на наших вновь приобретенных территориях.[FROM.GetNameDefCap] Он также заинтересован в разработке нефтяных месторождений. [756.GetName]Это может оказаться ключевым в нашем военном наступлении на восток.\nОпять же, тот [FROM.GetAdjective] Правительство просит о дальнейших финансовых выгодах для своих торговых структур на нашем рынке и увеличении экспорта в качестве оплаты."
 NSB_soviet_foreign_politics_events.280.a:0 "Справедливое предложение."
 NSB_soviet_foreign_politics_events.280.b:0 "Хватит, они нам больше не нужны!"
 NSB_soviet_foreign_politics_events.281.t:0 "[FROM.GetNameDefCap] принимает нашу помощь"
 NSB_soviet_foreign_politics_events.281.desc:0 "[SIK.GetLeader] Мы приняли наше предложение о предоставлении материально-технической и военной помощи для его территориальной экспансии на восток. Нам будет позволено строить инфраструктуру и военную оборону на их вновь приобретенных территориях, а также разрабатывать нефтяные месторождения в регионе. [756.GetName]. В свою очередь, правительство [SIK.GetAdjective] Это даст нашим торговым субъектам большую финансовую выгоду на их рынке и увеличит объемы экспорта в нашу страну."
 NSB_soviet_foreign_politics_events.281.a:0 "Мы всегда рады помочь!"
 NSB_soviet_foreign_politics_events.282.t:0 "[SOV.GetNameDefCap] требует официального оформления Советской республики [ROOT.GetNameDef]"
 NSB_soviet_foreign_politics_events.282.desc:0 "Мы получили официальное сообщение от государства [FROM.GetNameDef] с требованием включить [ROOT.GetNameDef] в его состав в качестве независимой Советской Социалистической Республики, подчинённой правительству [FROM.GetNameDef]. Сам [FROM.GetLeader] пообещал, что наша страна сохранит определённую степень автономии, а Красная армия будет готова защищать Синьцзян как советскую землю. По его словам, эти меры необходимы для эффективного сотрудничества между нашими странами в столь трудные времена. \nУчитывая крупные инвестиции [FROM.GetNameDef] в нашу страну и растущее [FROM.GetAdjective]ое влияние на нашу экономику, следует хорошо подумать, прежде чем давать ответ."
 NSB_soviet_foreign_politics_events.282.a:0 "У нас нет другого выбора."
 NSB_soviet_foreign_politics_events.282.b:0 "Мы должны прекратить этот фарс!"
 NSB_soviet_foreign_politics_events.283.t:0 "[SIK.GetNameDefCap]"
 NSB_soviet_foreign_politics_events.283.desc:0 "Мы получили официальное сообщение от [FROM.GetLeader] принимая интеграцию китайской провинции Синьцзян в качестве независимой советской социалистической республики, подчиненной правительству [ROOT.GetNameDef]. Наши крупные проекты развития в регионе показали [ROOT.GetAdjective] добросовестность в установлении хороших отношений с нашими союзниками и предоставлении помощи, когда это необходимо. Эти действия помогли [FROM.GetLeader] Мы понимаем, что наши требования являются лишь необходимыми мерами для обеспечения эффективного сотрудничества между нашими странами в эти трудные времена."
 NSB_soviet_foreign_politics_events.283.a:0 "Добро пожаловать в Союз, товарищи!"
 NSB_soviet_foreign_politics_events.284.t:0 "[FROM.GetNameDefCap] отклоняет наши требования"
 NSB_soviet_foreign_politics_events.284.desc:0 "Мы получили официальное сообщение от [FROM.GetLeader], отклоняющего наши требования о включении [FROM.GetNameDef] в наш состав в качестве независимой Советской Социалистической Республики. Похоже, огромные средства, вложенные нами в развитие региона и помощь китайским соседям, ничего не значат для [FROM.GetLeader], который по-прежнему смотрит на [ROOT.GetNameDef] с недоверием."
 NSB_soviet_foreign_politics_events.284.a:0 "Они препятствуют сотрудничеству между нашими странами."
 NSB_soviet_foreign_politics_events.284.b:0 "Мы не оставим это оскорбление безнаказанным!"
 NSB_soviet_foreign_politics_events.285.t:0 "[SOV.GetName] на грани краха"
 NSB_soviet_foreign_politics_events.285.desc:0 "После чудовищных потерь в войне кажется, что крах государства [SOV.GetNameDef] гораздо ближе, чем они хотят показать. Несколько членов нашего правительства утверждают, что такой поворот событий неизбежно угрожает нашей стране, и предлагают немедленно расторгнуть [SOV.GetAdjective]ие соглашения и вместо этого начать укреплять отношения с китайскими властями. По их словам, ради безопасности [ROOT.GetNameDef] мы обязаны сделать всё возможное, чтобы найти сильных союзников, способных нас поддержать, а [SOV.GetNameDef], учитывая нынешнее положение дел, едва ли сможет принять ответные меры."
 NSB_soviet_foreign_politics_events.285.a:0 "Мы вместе противостоим нашим врагам!"
 NSB_soviet_foreign_politics_events.285.b:0 "Пора искать новых друзей в другом месте!"
 NSB_soviet_foreign_politics_events.286.t:0 "Синьцзян встревожен советскими потерями в войне"
 NSB_soviet_foreign_politics_events.286.desc:0 "Вчера в официальном заявлении [SIK.GetLeader] вновь подтвердил верность Синьцзяна государству [ROOT.GetNameDef] и личное желание продолжать сотрудничество между нашими странами. Однако очевидно, что паникёры в государстве [SIK.GetNameDef] серьёзно подорвали образ [ROOT.GetNameDef], а поддержка [SIK.GetLeader] внутри партии [SIK.GetRulingParty] заметно ослабла."
 NSB_soviet_foreign_politics_events.286.a:0 "Жалкое положение..."
 NSB_soviet_foreign_politics_events.286.b:0 "Мы должны разобраться с этими болтливыми предателями!"
 NSB_soviet_foreign_politics_events.287.t:0 "[SIK.GetNameDefCap] покидает альянс [ROOT.GetFactionName]"
 NSB_soviet_foreign_politics_events.287.desc:0 "Вчера в официальном заявлении, [SIK.GetLeader] Объявлено об отделении Синьцзяна от [ROOT.GetFactionName]Отменить все [ROOT.GetAdjective] соглашения с немедленным вступлением в силу.\nСогласно его речи, с [ROOT:GetName] На грани краха и окруженный врагами на востоке и западе, Синьцзяну пора укрепить связи со своими восточными китайскими соседями и братьями, чтобы противостоять иностранным захватчикам."
 NSB_soviet_foreign_politics_events.287.a:0 "Пусть уходят! У нас есть более срочные дела."
 NSB_soviet_foreign_politics_events.287.b:0 "Они должны за это заплатить!"
 SOV_sinikiang_influence_cg_tt_sik:0 "§Y[SOV.GetFlag][SOV.GetNameDefCap]§! получит благодаря этому соглашению бонус §Y-1,0%§! к товарам народного потребления."
 SOV_sinikiang_influence_cg_tt_sov:0 "$SOV_modify_fyp_ns_intro$ \nФабрики, производящие товары народного потребления: §Y-1,0%§!"
 SOV_sinkiang_when_project_finishes_tt:0 "\nЭффекты после завершения проекта:"
 NSB_soviet_soviet_german_trade_agreement.1.t:0 "Советско-германское торговое соглашение"
 NSB_soviet_soviet_german_trade_agreement.1.desc:0 "[FROM.GetAdjective]ий посол связался с нашими дипломатами и предложил заключить торговое соглашение между нашими странами. Согласно предложению, [FROM.GetNameDef] будет поставлять нам сырьё, включая зерно, хлопок, нефть, металлические руды и каучук. Взамен [FROM.GetAdjective]ая сторона получит недостроенный крейсер класса «Хиппер», чертежи других военных кораблей, тяжёлые корабельные орудия и образцы [ROOT.GetAdjective]их самолётов. \nЭто соглашение, несомненно, поможет нам в войне против враждебных европейских государств, позволив найти способы обхода [GetTradeAgreementBlockadeWarPeace] блокады."
 NSB_soviet_soviet_german_trade_agreement.1.desc_war_eng:0 "[ENG.GetAdjective]ой"
 NSB_soviet_soviet_german_trade_agreement.1.desc_war:0 "вражеской"
 NSB_soviet_soviet_german_trade_agreement.1.desc_peace:0 "потенциального противника"
 NSB_soviet_soviet_german_trade_agreement.1.a:0 "Нам необходимо сырьё"
 NSB_soviet_soviet_german_trade_agreement.1.b:0 "Мы не станем делиться с ними своими военно-морскими секретами!"
 NSB_soviet_soviet_german_trade_agreement.2.t:0 "[GER.GetNameDefCap] подписывает соглашение «$NSB_soviet_soviet_german_trade_agreement.1.t$»"
 NSB_soviet_soviet_german_trade_agreement.2.desc:0 "[FROM.GetAdjective]ие дипломаты сообщили, что согласны с нашим предложением. Наши страны заключили торговый договор, по которому [ROOT.GetNameDef] будет поставлять государству [FROM.GetNameDef] сырьё, включая зерно, хлопок, нефть, металлические руды и каучук. Взамен мы получим недостроенный крейсер класса «Хиппер», чертежи других военных кораблей, тяжёлые корабельные орудия и образцы [FROM.GetAdjective]их самолётов. \nЭто соглашение, несомненно, поможет нам в разработке современных военных технологий."
 NSB_soviet_soviet_german_trade_agreement.2.a:0 "Красный флот от этого выиграет."
 NSB_soviet_soviet_german_trade_agreement.3.t:0 "[GER.GetNameDefCap] отклоняет соглашение «$NSB_soviet_soviet_german_trade_agreement.1.t$»"
 NSB_soviet_soviet_german_trade_agreement.3.desc:0 "После нескольких попыток нашего посла убедить [FROM.GetAdjective] должностные лица взаимной выгоды от торгового пакта между нашими странами, [FROM.GetAdjective] Дипломаты только что сообщили нам, что они не заинтересованы в заключении торгового соглашения с Россией. [ROOT.GetNameDef]."
 NSB_soviet_soviet_german_trade_agreement.3.a:0 "Упрямые глупцы!"
 NSB_soviet_policies_of_collective_security.1.t:0 "[FROM.GetNameDefCap] предлагает пакт о взаимопомощи"
 NSB_soviet_policies_of_collective_security.1.desc:0 "отмечая угрозы, с которыми сталкиваются обе наши страны, [FROM.GetAdjective] Правительство предложило пакт о взаимопомощи. В соответствии с этими условиями мы не будем предпринимать враждебных действий друг против друга.\n\nНерешенным вопросом является тот факт, что [POL.GetNonIdeologyName] Они находятся между нашими народами. Любая попытка любой из сторон прийти на помощь другой стороне обязательно должна быть осуществлена через Польшу. Некоторые члены дипломатической службы твердо убеждены в том, что мы должны включить Польшу в этот пакт, чтобы гарантировать, что мы действительно можем поддерживать друг друга напрямую."
 NSB_soviet_policies_of_collective_security.1.a:0 "Мы согласимся на первоначальные условия."
 NSB_soviet_policies_of_collective_security.1.b:0 "Следует обратиться к Польше."
 NSB_soviet_policies_of_collective_security.1.c:0 "Это не в наших интересах."
 NSB_soviet_policies_of_collective_security.2.t:0 "[FROM.GetNameDefCap] соглашается подписать пакт"
 NSB_soviet_policies_of_collective_security.2.desc:0 "Правительство [FROM.GetNameDef] в принципе согласилось с предложенным нами пактом о взаимопомощи. Прибыла делегация дипломатов, чтобы согласовать детали его реализации."
 NSB_soviet_policies_of_collective_security.2.a:0 "Мы стоим плечом к плечу."
 NSB_soviet_policies_of_collective_security.3.t:0 "[FROM.GetNameDefCap] отклоняет наше предложение"
 NSB_soviet_policies_of_collective_security.3.desc:0 "После нескольких долгих ночей напряженных переговоров [FROM.GetAdjective] Делегация покинула страну без подписания договора. В то время как некоторые члены дипломатической службы все еще надеются, что пакт может быть спасен, есть мнение, что это не так. [FROM.GetAdjective] Правительство считает этот вопрос закрытым."
 NSB_soviet_policies_of_collective_security.3.a:0 "Крайне недальновидное решение."
 NSB_soviet_policies_of_collective_security.4.t:0 "[FROM.GetNameDefCap] Щелкает для [POL.GetAdjective] Включение в Пакт"
 NSB_soviet_policies_of_collective_security.4.desc:0 "Будучи принципиально открытым для пакта о взаимопомощи, [FROM.GetAdjective] У правительства есть некоторые опасения относительно позиции Польши. По-видимому, позиция [FROM.GetAdjective] Правительство считает, что Польша должна быть включена в пакт.\n\nЭто вопрос, по которому [FROM.GetAdjective] Делегация не сдвинется с места и попросила, чтобы мы официально пригласили [POL.GetNonIdeologyName] в договоре."
 NSB_soviet_policies_of_collective_security.4.a:0 "В этом есть смысл."
 NSB_soviet_policies_of_collective_security.4.b:0 "Предложение неслучайно касалось только наших стран."
 NSB_soviet_policies_of_collective_security.5.t:0 "[FROM.GetNameDefCap] отказывается включать [POL.GetNameDef] в пакт"
 NSB_soviet_policies_of_collective_security.5.desc:0 "Наши попытки убедить [FROM.GetAdjective] делегирование необходимости включения [POL.GetNonIdeologyName] Но, похоже, что этот договор принес мало плодов.\n\nПо их словам, вопрос о [POL.GetNonIdeologyName] не имеет отношения к рассматриваемому договору, и категорически отказались обсуждать его дальше. Теперь нам нужно решить, прекратить ли здесь переговоры или продолжить \"маленькое\" решение по договору."
 NSB_soviet_policies_of_collective_security.5.a:0 "Это не должно сорвать договор."
 NSB_soviet_policies_of_collective_security.5.b:0 "Тогда сделка отменяется."
 NSB_soviet_policies_of_collective_security.6.t:0 "[FROM.GetNameDefCap] соглашается включить [POL.GetNameDef] в пакт"
 NSB_soviet_policies_of_collective_security.6.desc:0 "После очередного раунда переговоров, [FROM.GetAdjective] Делегация согласилась включить [POL.GetNonIdeologyName] в договоре. Как только детали будут проработаны, мы отправим сообщение на [POL.GetAdjective] Правительство предлагает им присоединиться к Пакту на тех же условиях, что и мы."
 NSB_soviet_policies_of_collective_security.6.a:0 "Теперь отправимся на переговоры с поляками."
 NSB_soviet_policies_of_collective_security.7.t:0 "[SOV.GetAdjective]-[FROM.GetAdjective]ий пакт о взаимопомощи"
 NSB_soviet_policies_of_collective_security.7.desc:0 "The [FROM.GetAdjective] Посол сообщил нам, что его страна только что подписала договор о взаимной помощи с [SOV.GetNameDef]. Согласно условиям договора, ни одна из сторон не будет нападать на другую и будет пытаться поддерживать другую во время войны.\n\nОн также заявил, что его правительство подписало этот договор только в соответствии с четким положением о том, что нам будет разрешено присоединиться к пакту, если мы этого пожелаем."
 NSB_soviet_policies_of_collective_security.7.a:0 "Мы с радостью станем третьей стороной."
 NSB_soviet_policies_of_collective_security.7.b:0 "Разве они не знают, что Советам нельзя доверять?"
 NSB_soviet_policies_of_collective_security.8.t:0 "[FROM.GetNameDefCap] отказывается подписывать пакт без [POL.GetNameDef]"
 NSB_soviet_policies_of_collective_security.8.desc:0 "Наши попытки договориться с государством [FROM.GetNameDef] окончились неудачей. Похоже, вопрос государства [POL.GetNonIdeologyName] и его включения в пакт оказался принципиальным, и компромисс найти не удалось."
 NSB_soviet_policies_of_collective_security.8.a:0 "Какая неуместная преданность."
 NSB_soviet_policies_of_collective_security.9.t:0 "[FROM.GetNameDefCap] соглашается подписать пакт"
 NSB_soviet_policies_of_collective_security.9.desc:0 "После дальнейших переговоров, [FROM.GetAdjective] Правительство согласилось подписать пакт, несмотря на ранее высказанные опасения по поводу исключения Польши. И хотя в ней все еще есть некоторая хватка, [FROM.GetAdjective] Они, как представляется, готовы и впредь ратифицировать этот договор."
 NSB_soviet_policies_of_collective_security.9.a:0 "Они вняли голосу разума."
 NSB_soviet_policies_of_collective_security.10.t:0 "[FROM.GetNameDefCap] отклоняет пакт"
 NSB_soviet_policies_of_collective_security.10.desc:0 "В неожиданном повороте событий правительство [POL.GetLeader] Он отказался присоединиться к предложенному пакту. Хотя официальной причиной было отсутствие достоверных угроз, в частном порядке [POL.GetAdjective] Правительство указало, что Советы, возможно, стремятся вступить в Польшу, чтобы защитить ее, но они также не захотят уходить после этого."
 NSB_soviet_policies_of_collective_security.10.a:0 "По крайней мере, им сделали предложение."
 NSB_soviet_policies_of_collective_security.11.t:0 "[POL.GetNameDefCap] отказывается присоединиться к нашему пакту о взаимопомощи"
 NSB_soviet_policies_of_collective_security.11.desc:0 "The [POL.GetAdjective] Правительство отказалось присоединиться к Пакту о взаимной помощи, сославшись на отсутствие достоверных угроз против них и нежелание запутаться в альянсах.\n\nВ дипломатических кругах ходят слухи, что это просто мера по спасению лица, и настоящая причина в том, что они нам не доверяют."
 NSB_soviet_policies_of_collective_security.11.a:0 "Пустая трата времени."
 NSB_soviet_policies_of_collective_security.12.t:0 "[FROM.GetNameDefCap] соглашается присоединиться к нашему пакту о взаимопомощи"
 NSB_soviet_policies_of_collective_security.12.desc:0 "The [FROM.GetAdjective] Правительство в принципе согласилось присоединиться к Пакту. Хотя некоторые детали еще предстоит проработать, они не будут препятствовать ратификации договора."
 NSB_soviet_policies_of_collective_security.12.a:0 "Это сделает союз ещё сильнее."
 NSB_soviet_policies_of_collective_security.13.desc:0 "В связи с вопросом о [POL.GetNonIdeologyName] Решённый, [FROM.GetAdjective] Правительство готово приступить к формальной ратификации договора на первоначально согласованных условиях."
 NSB_soviet_policies_of_collective_security.13.a:0 "Теперь поставим подписи!"
 NSB_soviet_academy_of_sciences.1.t:0 "Основание [THIS.GetAdjective]ой академии наук"
 NSB_soviet_academy_of_sciences.1.desc:0 "Сегодня на пышной церемонии [THIS.GetLeader] и [SOV.GetAdjective]ий посол официально открыли [THIS.GetAdjective]ую академию наук. Созданный по образцу [SOV.GetAdjective]ой академии наук, этот новый институт позволит нам проводить передовые исследования на самом высоком уровне под руководством экспертов из государства [SOV.GetNameDef]."
 NSB_soviet_academy_of_sciences.1.a:0 "Большой шаг вперёд!"
 NSB_soviet_atomic_bomb_project.1.t:0 "Агент возвращается с ядерными секретами"
 NSB_soviet_atomic_bomb_project.1.desc:0 "Один из наших агентов, которому было поручено проникнуть в иностранную программу ядерных исследований, вернулся в наше посольство с большим количеством совершенно секретных документов о различных разработках учёных — от конструкций центрифуг до расчётов размеров боеголовок. Эти данные, несомненно, окажутся очень ценными для продвижения нашей собственной программы создания ядерного оружия."
 NSB_soviet_atomic_bomb_project.1.a:0 "Ещё одна победа во имя мира."
 NSB_soviet_atomic_bomb_project.2.t:0 "Агент пойман на ядерном объекте"
 NSB_soviet_atomic_bomb_project.2.desc:0 "Один из наших агентов, которому было поручено проникнуть в программу разработки ядерного оружия, сегодня был задержан при попытке покинуть охраняемый объект. При обыске в его сумке обнаружили несколько секретных документов. К сожалению, он, очевидно, признался, что работает на нас: нашего посла вызвали на срочную встречу и предъявили ему доказательства."
 NSB_soviet_atomic_bomb_project.2.a:0 "Абсурд! Мы никак не связаны с этим человеком."
 NSB_soviet_atomic_bomb_project.3.t:0 "Нарушение безопасности на объекте ядерных исследований"
 NSB_soviet_atomic_bomb_project.3.desc:0 "Сегодня сотрудника одного из наших объектов ядерных исследований остановили во время плановой проверки. При тщательном досмотре его вещей в сумке обнаружили потайное отделение. В нём находилось несколько строго засекреченных документов, связанных с ядерными технологиями. \n\nПодозреваемый был передан контрразведке и дал полное признание. Судя по всему, он поддерживал связь с [SOV.GetAdjective]им посольством и получил задание проникнуть в нашу программу ядерных исследований, чтобы похитить чертежи и другие исследовательские данные."
 NSB_soviet_atomic_bomb_project.3.a:0 "По крайней мере, ничего не было украдено."
 NSB_soviet_policies_of_collective_security_agreed_effects_tt:0 "Если пакт будет заключён, мы согласимся на следующие условия:"
 NSB_soviet_policies_of_collective_security_condition_effects_tt:0 "Если и [FROM.GetAdjective]ое, и [POL.GetAdjective]ое правительства согласятся включить государство [POL.GetNameDef] в пакт, те же эффекты будут применены к государству [POL.GetNameDef]."
 NSB_soviet_policies_of_collective_security_refusing_poland_inclusion_tt:0 "Мы отклоним [FROM.GetAdjective]ое предложение включить государство [POL.GetNameDef] в пакт. Государству [FROM.GetNameDefCap] придётся выбрать между принятием нашего первоначального предложения и отказом от идеи коллективного соглашения о взаимной помощи."
 NSB_soviet_policies_of_collective_security_tt:0 "Если [POL.GetAdjective]ое правительство согласится, государство [POL.GetNameDef] будет включено в коллективное соглашение о взаимной помощи вместе с государствами [FROM.GetNameDef] и [ROOT.GetNameDef]."
 NSB_soviet_policies_of_collective_security_poland_included_effects_from_tt:0 "[SOV.GetFlag]§Y[SOV.GetNameDefCap]§!, [FROM.GetFlag]§Y[FROM.GetNameDefCap]§! и [POL.GetFlag]§Y[POL.GetNameDefCap]§! откажутся от любых претензий и целей войны друг против друга, подпишут пакт о ненападении и предоставят друг другу гарантии."
 NSB_soviet_policies_of_collective_security_poland_included_effects_root_tt:0 "[SOV.GetFlag]§Y[SOV.GetNameDefCap]§!, [ROOT.GetFlag]§Y[ROOT.GetNameDefCap]§! и [POL.GetFlag]§Y[POL.GetNameDefCap]§! откажутся от любых претензий и целей войны друг против друга, подпишут пакт о ненападении и предоставят друг другу гарантии."
 NSB_soviet_comecon.1.t:0 "[FROM.GetAdjective]ий проект индустриализации в государстве [ROOT.GetNameDef]"
 NSB_soviet_comecon.1.desc:0 "В рамках экономической координации СЭВ [FROM.GetAdjective]ое правительство начало инвестировать в нашу экономику. Это позволит нам значительно расширить её в течение следующих нескольких месяцев."
 NSB_soviet_comecon.1.a:0 "Вот как выглядит взаимопомощь на практике!"
 NSB_soviet_comecon.2.t:0 "[FROM.GetAdjective]ая программа военного развития для стран СЭВ"
 NSB_soviet_comecon.2.desc:0 "[FROM.GetAdjective]ое правительство приняло решение провести масштабную серию манёвров и учений. Это повысит наши военные возможности и позволит нам эффективнее действовать совместно с другими союзниками. Полученный на этих учениях опыт следует использовать для проведения необходимых военных реформ."
 NSB_soviet_comecon.2.a:0 "Мы будем готовы сражаться вместе с вами, товарищи!"
 NSB_soviet_comecon_effect_duration_tt:0 "Эти эффекты будут действовать §Y180§! дней, после чего наш национальный дух вернётся к прежней версии."
 NSB_soviet_spanish_civil_war.1.t:0 "[?SOV.SOV_spanish_general.GetName] присоединяется к государству [ROOT.GetNameDef]"
 NSB_soviet_spanish_civil_war.1.desc:0 "Вчера в Кронштадт прибыл корабль, переполненный испанскими беженцами, покинувшими страну из-за неминуемого падения их правительства в гражданской войне. Их встретила наша делегация из города [ROOT.Capital.GetName], которая взяла группу под свою опеку. Большинство составляли дети, но среди них также были несколько испанских политиков и военных. \nСреди прибывших оказался великий борец-коммунист [?SOV.SOV_spanish_general.GetName], с которым поговорили наши представители. Бывший офицер испанской армии заявил, что испанцы прибыли в государство [ROOT.GetNameDef], чтобы залечить раны и обрести поддержку в деле освобождения испанского народа. Он попросил [ROOT.GetAdjective]ое правительство признать его воинское звание и вернуть его на службу, чтобы он мог продолжить борьбу против фашизма и империализма."
 NSB_soviet_spanish_civil_war.1.a:0 "Мы приветствуем всех испанских беженцев."
 NSB_soviet_spanish_civil_war.2.t:0 "Интернациональные марксистские бригады прибывают в город [ROOT.capital.GetName]"
 NSB_soviet_spanish_civil_war.2.desc:0 "Сочувствующие нам люди из Советского Союза организовали мобилизацию и подготовку сотен бойцов интернациональных бригад, поддерживающих нашу борьбу за победу в войне без отказа от революции. Эти храбрые представители международного пролетариата и крестьянства готовы отдать свои жизни в борьбе против фашизма и буржуазии."
 NSB_soviet_spanish_civil_war.2.a:0 "Это начало мировой революции!"
 NSB_soviet_spanish_civil_war.3.t:0 "Советские диверсанты прибывают в город [ROOT.capital.GetName]"
 NSB_soviet_spanish_civil_war.3.desc:0 "Советские антисталинистские диверсанты тайно прибыли в Барселону вместе с группой прекрасно подготовленных агентов и оперативников, сочувствующих нашему делу. По словам наших связных в Советском Союзе, это подкрепление позволит нам сформировать элитные бригады, способные прорывать вражеские линии или останавливать наступления противника, а также включить опытных агентов и офицеров в нашу систему командования."
 NSB_soviet_spanish_civil_war.3.a:0 "Мы найдём им достойное применение."
 NSB_soviet_spanish_civil_war.4.t:0 "Организованные Советами народные выступления"
 NSB_soviet_spanish_civil_war.4.desc:0 "Харизматичные участники правой оппозиции в Советском Союзе вместе с местными ораторами из ПОУМ, НКТ и ФАИ провели информационно-агитационную кампанию, призванную разжечь революционный дух пролетарских и крестьянских масс государства [ROOT.GetNameDef]. Благодаря пламенным речам в бесчисленных населённых пунктах массы обрели развитое классовое сознание и теперь как никогда готовы посвятить себя нашему делу."
 NSB_soviet_spanish_civil_war.4.a:0 "В единстве мы победим!"
 NSB_soviet_spanish_civil_war.5.t:0 "Советские агенты проникают в сталинистское командование"
 NSB_soviet_spanish_civil_war.5.desc:0 "Недавно в Испанию прибыла новая группа советских военных атташе и советников, призванных помочь буржуазному республиканскому правительству. \nСреди них находятся несколько советских агентов-антисталинистов, внедрённых под видом помощников военных советников, направленных [FROM.GetLeader]. \nЭти агенты установили связь и завербовали множество чиновников, солдат, бойцов интербригад и ополченцев, сочувствующих ПОУМ и сейчас сражающихся в рядах буржуазных республиканцев. Благодаря созданной ими впечатляющей сети информаторов мы получаем сведения из первых рук о передвижениях, планируемых вражеским командованием."
 NSB_soviet_spanish_civil_war.5.a:0 "Пора нанести последний удар!"
 NSB_soviet_spanish_civil_war.6.t:0 "Триумф революции в Испании"
 NSB_soviet_spanish_civil_war.6.desc_1:0 "Сегодня утром нашей организации доставили письмо, написанное лично [SPC.GetLeader]. В нём испанский лидер заявляет, что испанский народ никогда не забудет поддержку, оказанную истинными советскими революционерами, и что, когда настанет время противостоять тираническому монолиту сталинизма, мы можем быть уверены: ПОУМ сделает всё возможное, чтобы помочь советскому народу в его борьбе за свободу и подлинную революцию."
 NSB_soviet_spanish_civil_war.6.desc_2:0 "Разгромив своих фашистских и буржуазных врагов в Испании и понимая положение советского народа в его борьбе против сталинистской контрреволюции, ПОУМ организовала впечатляющую операцию по переброске значительного числа добровольческих бригад в наш штаб. Эти храбрые мужчины и женщины прибыли не только из Испании, но и со всего мира, а большинство из них — закалённые ветераны гражданской войны в Испании, чей опыт и навыки способны склонить чашу весов советской борьбы в нашу пользу."
 NSB_soviet_spanish_civil_war.6.a:0 "Революция восторжествует и в России!"
 NSB_soviet_spanish_civil_war.6.b:0 "Революция или смерть!"
 SOV_poum_aid_in_case_of_civil_War_tt:0 "Испанская ПОУМ организует несколько добровольческих дивизий, чтобы помочь нам в случае гражданской войны против [ROOT.GetLeader] и сталинистской доктрины."
 NSB_soviet_planned_economy.1.t:0 "[SOV.GetAdjective]ая программа плановой экономики"
 NSB_soviet_planned_economy.1.desc:1 "[SOV.GetLeader] представил новую схему совместной плановой экономики. \nХотя она и не безупречна, [FROM.GetAdjective]ое правительство считает, что НЭП также принёс немало успехов, и намерено утвердить модель плановой экономики, создав более взаимозависимую экономику между государством [FROM.GetNameDef] и его партнёрами и проложив путь к полноценному социалистическому обществу."
 NSB_soviet_planned_economy.1.a:0 "Мы должны ей следовать"
 nsb_news.100.desc:1 "Лев Троцкий, некогда ближайший соратник и предполагаемый преемник Владимира Ильича Ленина, сегодня подвергся нападению в своём доме: вооружённая группа совершила налёт на его виллу. Нападавшие ворвались в комнату, где находился большевик, немедленно открыли огонь и поспешно скрылись. Они оставили смертельно раненного Троцкого, который несколько часов спустя скончался в больнице Мехико. \n\nПосле неудачной борьбы за власть с $SOV_iosif_stalin$ и его союзниками за контроль над Коммунистической партией Советского Союза Троцкий провёл тридцатые годы в изгнании, живя в Турции, Франции и Норвегии, прежде чем окончательно поселиться в Мексике. \nОн оставался непримиримым критиком Сталина и «выродившегося рабочего государства» Советского Союза."
 nsb_news.101.desc:1 "Сегодня старый большевик Лев Троцкий подвергся нападению в своём доме: вооружённая группа совершила налёт на его виллу. Нападавшие ворвались в комнату, где он находился, беспорядочно открыли огонь и поспешно скрылись. Троцкий не пострадал, успев спрятаться за кроватью вместе с женой и внуком. \n\nКогда-то Троцкий был ближайшим соратником и предполагаемым преемником Владимира Ленина, но после неудачной борьбы за власть $SOV_iosif_stalin$ изгнал его из Советского Союза. Выступая перед прессой, Троцкий назвал покушение «ещё одним трусливым заговором Сталина, призванным заставить его критиков замолчать»."
 nsb_news.102.t:0 "[SOV.GetAdjective]-[SOV_collective_security_pact_integrant.GetAdjective][GetPolandIncludedOrNot] пакт"
 nsb_news.102.desc_default:0 "Вчера в городе [SOV.Capital.GetCapitalVictoryPointName] дипломаты обеих стран подписали пакт о взаимной помощи между государствами [SOV.GetNameDef] и [SOV_collective_security_pact_integrant.GetNameDef]. \n\nЭто соглашение является частью политики коллективной безопасности, предложенной [SOV.GetAdjective]им народным комиссаром иностранных дел [SOV.SOV_maksim_litvinov.GetName]. Согласно пакту, государства [SOV.GetNameDef] и [SOV_collective_security_pact_integrant.GetNameDef] обязались защищать друг друга в случае агрессии со стороны враждебных держав."
 nsb_news.102.desc_poland:0 "Вчера в городе [SOV.Capital.GetCapitalVictoryPointName] дипломаты трёх стран подписали пакт о взаимной помощи между государствами [SOV.GetNameDef], [SOV_collective_security_pact_integrant.GetNameDef] и [POL.GetNameDef]. \n\nЭто соглашение является частью политики коллективной безопасности, предложенной [SOV.GetAdjective]им народным комиссаром иностранных дел [SOV.SOV_maksim_litvinov.GetName]. Согласно пакту, государства [SOV.GetNameDef], [SOV_collective_security_pact_integrant.GetNameDef] и [POL.GetNameDef] отказались от взаимных территориальных претензий и обязались защищать друг друга в случае агрессии со стороны враждебных держав."
 nsb_news.102.a:0 "Необычный союз..."
 nsb_news.102.b:0 "Во имя коллективной безопасности."
 SOV_collective_security_news_poland_included:0 "-[POL.GetAdjective]ий"
 SOV_collective_security_news_poland_no:0 ""
 nsb_news.103.t:0 "[SOV.GetAdjective]-[GER.GetAdjective]ое торговое соглашение"
 nsb_news.103.desc:0 "Государства [SOV.GetNameDef] и [GER.GetNameDef] заключили торговое соглашение. С его помощью [SOV.GetAdjective]ая сторона стремится ускорить промышленное развитие и военные исследования, тогда как [GER.GetAdjective]ая сторона рассчитывает получать крайне необходимое сырьё — зерно, нефть и железную руду."
 nsb_news.103.a:0 "Это принесёт пользу государству [ROOT.GetNameDef]"
 nsb_news.103.b:0 "Надолго ли его хватит?"
 nsb_news.104.t:0 "Англо-[SOV.GetAdjective]ое вторжение в государство [PER.GetName]"
 nsb_news.104.desc:0 "После нескольких недель подготовки государства [ENG.GetNameDef] и [SOV.GetNameDef] начали совместную военную операцию в государстве [PER.GetName], намереваясь быстро оккупировать уступающего им численно и технологически противника. По словам [ENG.GetLeader], операция позволит им обезопасить [PER.GetAdjective]ие нефтяные месторождения и [ENG.GetAdjective]ие линии снабжения, ведущие в государство [SOV.GetNameDef], а также предотвратить возможное наступление противника из государства [TUR.GetNameDef] через государство [PER.GetName] к бакинским нефтяным месторождениям и государству [RAJ.GetNameDef]."
 nsb_news.104.a:0 "Это необходимая мера."
 nsb_news.104.b:0 "Ещё одна жертва [ENG.GetLeader] и [SOV.GetLeader]."
 nsb_news.104.c:0 "Силы явно неравны..."
 NSB_Soviet_fascist_civil_war.001.t:0 "[GetSovietCivilWarName]!"
 NSB_Soviet_fascist_civil_war.001.desc:0 "Время политических манёвров окончено. Вооружённая борьба против коммунистов возобновилась. Создан комитет, который проведёт нас через эту войну. На этот раз мы будем едины и станем сражаться до конца. На этот раз поражения не будет. На этот раз мы вернём империю!"
 NSB_Soviet_fascist_civil_war.001.a:0 "К оружию!"
 NSB_Soviet_fascist_civil_war.002.t:0 "Наши новобранцы готовы"
 NSB_Soviet_fascist_civil_war.002.desc:0 "Дивизии «Руки» готовы подняться и вступить в бой против коммунистических угнетателей."
 NSB_Soviet_fascist_civil_war.002.a:0 "Прекрасно"
 NSB_Soviet_fascist_civil_war.003.t:0 "$SOV_grigory_semyonov$ покидает государство [ROOT.GetName]"
 NSB_Soviet_fascist_civil_war.003.desc:0 "В России вновь разразилась гражданская война. $SOV_grigory_semyonov$, проживавший здесь после бегства от красных, решил снова покинуть государство [ROOT.GetName], чтобы присоединиться к борьбе против коммунистов в государстве [SOV.GetNameDef]."
 NSB_Soviet_fascist_civil_war.003.a:0 "Полагаю, ему нужно уехать"
 NSB_soviet_communist_civil_war.001.t:0 "[GetSovietCivilWarName]"
 NSB_soviet_communist_civil_war.001.desc:0 "Товарищи, вновь пришло время поднять знамёна и вступить в войну за революцию. Прежде чем мы сможем спасти пролетариат, необходимо вернуть контроль над государством [ROOT.GetNameDef]. Как когда-то мы разгромили белые армии, так теперь должны победить тех, кто стоит на пути подлинной революции на родине.\nНам также предстоит решить, кто возглавит нас в этой борьбе."
 NSB_soviet_communist_civil_war.001.a:0 "Троцкий всегда был главным противником Сталина"
 NSB_soviet_communist_civil_war.001.b:0 "Смирнов приведёт народ к победе"
 NSB_soviet_communist_civil_war.001.c:0 "Нам нужен человек с военным опытом"
 NSB_soviet_communist_civil_war.001.d:0 "Зиновьев — прирождённый лидер"
 NSB_soviet_communist_civil_war.001.e:0 "Каменев станет хорошей номинальной фигурой"
 NSB_soviet_communist_civil_war.002.t:0 "Берия захвачен армией"
 NSB_soviet_communist_civil_war.002.desc:0 "$SOV_lavrenty_beriya$ арестован армейскими офицерами и содержится под стражей в ожидании суда. Армейские дивизии вошли в столицу, чтобы защитить её от возможного выступления его сторонников. Сейчас проводятся аресты ближайших соратников Берии. Пришло время найти нового лидера для государства [ROOT.GetNameDef]."
 NSB_soviet_communist_civil_war.002.a:0 "Бухарин — идеальный кандидат"
 NSB_soviet_communist_civil_war.002.b:0 "Им должен стать Рыков"
 NSB_soviet_communist_civil_war.002.c:0 "Нужен тот, кто обеспечит верность армии"
 NSB_soviet_communist_civil_war.002.d:0 "Зиновьев — прирождённый лидер"
 NSB_soviet_communist_civil_war.002.e:0 "Каменев станет хорошей номинальной фигурой"
 NSB_soviet_communist_civil_war.003.t:0 "[GetSovietCivilWarName]"
 NSB_soviet_communist_civil_war.003.desc:0 "Война снова пришла на нашу землю. Мы должны взяться за оружие против диктатора, который сбил страну с пути. Сталин слишком долго вёл Советский Союз в неверном направлении. Прискорбно, что пришлось прибегнуть к этому, но другого выбора у нас не осталось."
 NSB_soviet_communist_civil_war.003.a:0 "Нас возглавит Бухарин"
 NSB_soviet_communist_civil_war.003.b:0 "Народ сплотится вокруг Рыкова"
 NSB_soviet_communist_civil_war.003.c:0 "Нам нужен человек с военным опытом"
 NSB_soviet_communist_civil_war.003.d:0 "Зиновьев — прирождённый лидер"
 NSB_soviet_communist_civil_war.003.e:0 "Каменев станет хорошей номинальной фигурой"
 NSB_soviet_communist_civil_war.004.t:0 "Призыв к созданию интернациональных революционных бригад"
 NSB_soviet_communist_civil_war.004.desc:0 "[FROM.GetLeader] призвал добровольцев присоединиться к борьбе против [SOS.GetLeader]. На этот призыв откликнулись различные группы, и сейчас формируются интернациональные бригады."
 NSB_soviet_communist_civil_war.004.a:0 "Это следует поощрять"
 NSB_soviet_communist_civil_war.004.b:0 "Это необходимо остановить!"
 NSB_soviet_communist_civil_war.004.c:0 "Вот как"
 NSB_soviet_communist_civil_war.005.t:0 "Прибывают интернациональные бригады"
 NSB_soviet_communist_civil_war.005.desc:0 "Революционеры со всего мира прибыли, чтобы сражаться против врагов подлинной революции. Добровольцев объединяют в интернациональные бригады, которые вскоре можно будет бросить против врагов государства [ROOT.GetNameDef]."
 NSB_soviet_communist_civil_war.005.a:0 "Желанное подкрепление"
 NSB_soviet_communist_civil_war.006.t:0 "Массовые протесты в регионе [?SOV_uprising_state.GetName]"
 NSB_soviet_communist_civil_war.006.desc:0 "Рабочие региона [?SOV_uprising_state.GetName] вышли на улицы на массовый митинг. Повсюду звучат призывы расширить влияние профсоюзов, но встречаются и другие лозунги и плакаты. Поступают даже сообщения о прямых антисталинских выкриках."
 NSB_soviet_communist_civil_war.006.a:0 "Пусть протестуют"
 NSB_soviet_communist_civil_war.006.b:0 "Это нужно остановить, пока ситуация не вышла из-под контроля"
 NSB_soviet_communist_civil_war.008.t:0 "Сталин переживает покушение"
 NSB_soviet_communist_civil_war.008.desc:0 "Покушение на Сталина завершилось неудачей. Вооружённый одиночка проник на сталинскую дачу, но был обнаружен прежде, чем успел добраться до комнаты генерального секретаря. Охрана Сталина застрелила несостоявшегося убийцу на месте. Теперь столица полнится слухами о том, кто мог стоять за этим преступлением."
 NSB_soviet_communist_civil_war.008.a:0 "Дело может принять скверный оборот"
 NSB_soviet_communist_civil_war.009.t:0 "Смерть Сталина"
 NSB_soviet_communist_civil_war.009.desc:0 "Безусловный лидер государства [SOV.GetNameDef], $SOV_iosif_stalin$, был убит неизвестными. По всей видимости, в момент покушения глава государства [SOV.GetNameDef] находился на своей даче один.\nУправление страной приняла тройка во главе с доверенным лицом Сталина, всеми нелюбимым $SOV_lavrenty_beriya$, однако обстановка остаётся нестабильной, а будущее государства [SOV.GetNameDef] — неопределённым."
 NSB_soviet_communist_civil_war.009.a:0 "Впереди интересные времена."
 NSB_soviet_communist_civil_war.010.t:0 "[?SOS.SOV_general_to_desert.GetName] переходит на нашу сторону"
 NSB_soviet_communist_civil_war.010.desc:0 "Недовольный обращением Сталина, [?SOS.SOV_general_to_desert.GetName] решил покинуть диктатора и присоединиться к нашей справедливой борьбе. Небольшое число подразделений предпочло последовать за своим генералом, а не оставаться с [SOS.GetLeader]."
 NSB_soviet_communist_civil_war.010.a:0 "Мы рады их принять!"
 NSB_soviet_civil_war_common.001.t:0 "Победа"
 NSB_soviet_civil_war_common.001.desc_left:0 "Война против Сталина окончена. Диктатор свергнут. [ROOT.GetLeader] привёл нас к победе.\nПришло время вновь разжечь пламя революции и принести свободу рабочему классу всего мира."
 NSB_soviet_civil_war_common.001.desc_right_concessions:0 "Страна завоёвана, [ROOT.GetLeader] привёл нас к победе. Теперь пора залечивать раны и преобразовывать государство. Мы доказали, что готовы были пойти на всё ради победы. Но победа всегда имеет цену: помимо жертв наших героических солдат, нам предстоит расплатиться и по другим долгам, прежде чем эта глава нашей истории будет окончательно закрыта."
 NSB_soviet_civil_war_common.001.desc_right_no_concessions:0 "Наши победоносные армии проходят парадом мимо Кремля. Победа за нами!\nСегодня начинается новая эпоха для государства [ROOT.GetNameDef]. Под мудрым руководством [ROOT.GetLeader] страна восстановится и станет сильнее, чем когда-либо."
 NSB_soviet_civil_war_common.001.desc_exiles:0 "Коммунистический режим пал. Наши победоносные войска контролируют столицу. Народ наконец свободен от красной тирании. Из руин, оставленных двумя гражданскими войнами и годами бездарного правления между ними, восстанет новая Россия."
 NSB_soviet_civil_war_common.001.a:0 "Пора двигаться дальше"
 NSB_soviet_civil_war_common.002.t:0 "Столица государства [ROOT.GetNameDef]"
 NSB_soviet_civil_war_common.002.desc:1 "Война окончена. Необходимо принять решение о будущей столице страны."
 NSB_soviet_civil_war_common.002.a:0 "Москва — самый важный город"
 NSB_soviet_civil_war_common.002.b:0 "Революция началась в Ленинграде"
 NSB_soviet_civil_war_common.002.c:0 "Столицей должен стать Петроград"
 NSB_soviet_civil_war_common.002.d:0 "Сохраним столицу в регионе [?SOV_civil_war_start_state.GetName]"
 NSB_soviet_civil_war_common.002.e:0 "Владивосток станет нашей новой восточной столицей"
 NSB_soviet_civil_war_common.002.f:0 "Санкт-Петербург был столицей Империи"
 SOV_petrograd:0 "Петроград"
 SOV_StPetersburg:0 "Санкт-Петербург"
 NSB_soviet_civil_war_common.003.t:0 "[ROOT.GetLeader] мобилизует вооружённые силы"
 NSB_soviet_civil_war_common.003.desc:0 "Наши операции больше не могут продолжаться втайне. [ROOT.GetLeader] мобилизовал армию и НКВД и начал задерживать всех, кого подозревают в заговоре против государства. Если мы не выступим сейчас, всё, за что мы боролись, окажется напрасным."
 NSB_soviet_civil_war_common.003.a:0 "Значит, будет война"
 NSB_soviet_civil_war_common.006.t:0 "Партизаны присоединяются к восстанию"
 NSB_soviet_civil_war_common.006.desc:0 "Власть [SOS.GetLeader] над страной ослабевает. По всей территории [SOS.GetNameDef] народ восстаёт против тирании [SOS.GetLeader]. Формируются партизанские отряды, которые помогут нам в борьбе."
 NSB_soviet_civil_war_common.006.a:0 "Хорошо"
 SOV_popular_uprising_units_tt:0 "Партизанские отряды присоединятся к [ROOT.GetNameDef]."
 NSB_soviet_civil_war_common.010.t:0 "Десталинизация"
 NSB_soviet_civil_war_common.010_right_opposition:0 "Диктатор пал. Пришло время разрушить культ Сталина, лишить оставшихся последователей дорогих им символов и показать народу, что старые времена закончились. Памятники должны быть снесены, а города — переименованы. Пожалуй, самой драгоценной жемчужиной Сталина был город Сталинград."
 NSB_soviet_civil_war_common.010_left_opposition:0 "Революция победила. Диктатор пал, и пролетариат вновь правит страной. Поклонению Сталину необходимо положить конец, а все его символы — уничтожить. Города, названные в честь Сталина и его сторонников, следует переименовать во что-нибудь более подходящее. В первую очередь это касается Сталинграда."
 NSB_soviet_civil_war_common.010_exiles:0 "Большевики попытались заменить государственную религию коммунизмом и создали вокруг своих вождей культ личности. Они дошли даже до переименования российских городов. В Империи необходимо восстановить порядок, и лучше всего начать со старого города Царицына, переименованного в Сталинград."
 NSB_soviet_civil_war_common.010.a:0 "Волгоград — подходящее название"
 NSB_soviet_civil_war_common.010.b:0 "Он был Царицыном и должен вновь стать Царицыном"
 NSB_soviet_civil_war_common.010.c:0 "Троцкий — истинный герой революции"
 NSB_soviet_civil_war_common.010.d:0 "Следует переименовать его в память о Бухарине"
