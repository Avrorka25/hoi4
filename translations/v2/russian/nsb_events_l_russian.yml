 SOV_Belotsarsk:0 "Белоцарск"
 SOV_Yekaterinburg:0 "Екатеринбург"
 NSB_soviet_civil_war_common.100.t:0 "Владивосток в обмен на поддержку"
 NSB_soviet_civil_war_common.100.desc:0 "Оппозиционные группы в [FROM.GetNameDef] планируют восстание против [FROM.GetLeader]. Их главный переговорщик предложил передать Владивосток после победы над [FROM.GetLeader] в обмен на поддержку в случае гражданской войны."
 NSB_soviet_civil_war_common.100_exiles.desc:0 "Русские оппозиционные группы в Маньчжурии планируют восстание против [FROM.GetLeader]. Их главный переговорщик, $SOV_konstantin_rodzayevsky$, предложил передать Владивосток после победы над [FROM.GetLeader] в обмен на поддержку белых сил Японией во время гражданской войны."
 NSB_soviet_civil_war_common.100.a:0 "Идеально"
 NSB_soviet_civil_war_common.100.b:0 "Мы не можем выделить людей"
 vladivostock_concession_tt:1 "[ROOT.GetAdjective] экспедиционный корпус под командованием §Y[?SOV.SOV_japanese_general.GetName]§! будет отправлен на помощь силам оппозиции.\n§Y[408.GetName]§! будет передан государству §Y[ROOT.GetName]§! после окончания гражданской войны в [SOV.GetNameDef]"
 NSB_soviet_civil_war_common.101.t:0 "[FROM.GetName] поддерживает наше дело"
 NSB_soviet_civil_war_common.101.desc:0 "[FROM.GetAdjective] режим согласился на нашу просьбу и в случае открытого столкновения поддержит нас против сталинистов мощным экспедиционным корпусом. После завершения боёв Владивосток перейдёт к ним."
 NSB_soviet_civil_war_common.101.desc_exiles:0 "Наши [FROM.GetAdjective] друзья согласились на нашу просьбу и после начала восстания поддержат нашу борьбу против большевиков мощным экспедиционным корпусом. Передача Владивостока — высокая цена, но иногда приходится идти на жертвы, по крайней мере временно."
 NSB_soviet_civil_war_common.101.a:0 "Это обезопасит наш тыл."
 NSB_soviet_civil_war_common.102.t:0 "Японцы отказываются от Владивостока"
 NSB_soviet_civil_war_common.102.desc:0 "Весьма неожиданным образом [FROM.GetAdjective] правительство отклонило предложение получить порт Владивосток и прилегающие территории в обмен на активную поддержку в борьбе против Сталина."
 NSB_soviet_civil_war_common.102.a:0 "Интересные нынче времена"
 NSB_soviet_civil_war_common.103.t:0 "Северный Сахалин в обмен на оружие"
 NSB_soviet_civil_war_common.103.desc:0 "В обмен на снабжение восстания против Сталина вооружением советская оппозиция готова вернуть государству [ROOT.GetName] весь остров, который они называют Сахалином."
 NSB_soviet_civil_war_common.103.desc_exiles:0 "Представитель русской эмигрантской общины в Маньчжурии обратился к нам с просьбой о поставках на случай второй Гражданской войны в России. В обмен они готовы признать права [ROOT.GetNameDef] на весь остров Карафуто."
 NSB_soviet_civil_war_common.103.a:0 "Чтобы у них был хоть какой-то шанс, им понадобится вся возможная помощь"
 NSB_soviet_civil_war_common.103.b:0 "Наверное, мы сможем кое-что выделить"
 NSB_soviet_civil_war_common.103.c:0 "По крайней мере, мы можем закупить для них немного оружия"
 NSB_soviet_civil_war_common.103.d:0 "Риск быть втянутыми в этот конфликт того не стоит"
 sakhalin_concession_tt:0 "[655.GetName] будет передан государству [ROOT.getName] после окончания гражданской войны в [SOV.GetNameDef]"
 NSB_soviet_civil_war_common.104.t:0 "[FROM.GetNameDefCap] поставит оружие"
 NSB_soviet_civil_war_common.104.desc:0 "Переговоры с [FROM.GetAdjective] стороной завершились успешно. [FROM.GetName] пообещало снабжать наше дело оружием в обмен на контроль над северной частью Сахалина."
 NSB_soviet_civil_war_common.104.a:0 "Высокая цена, но, надеюсь, она того стоит"
 NSB_soviet_civil_war_common.105.t:0 "[FROM.GetNameDefCap] отказывается поставлять оружие"
 NSB_soviet_civil_war_common.105.desc:0 "Хотя мы предложили [FROM.GetLeader] сделку, которая несомненно отвечала бы [FROM.GetAdjective] интересам, делегация вернулась ни с чем."
 NSB_soviet_civil_war_common.105.a:0 "Это плохо"
 NSB_soviet_civil_war_common.106.t:0 "Тайная помощь в обмен на бакинские нефтяные месторождения"
 NSB_soviet_civil_war_common.106.desc_right_opp_before:0 "Оппозиционные группы в [FROM.GetNameDef] планируют переворот против Сталина. Они обратились к нам за помощью в тайном наращивании военного потенциала, предложив взамен будущие права на нефть бакинских месторождений."
 NSB_soviet_civil_war_common.106.desc_right_opp_civil_war:0 "[SOV.GetNameDefCap] во главе с [SOV.GetLeader] восстало против [SOS.GetLeader] и ведёт отчаянную гражданскую войну. Мятежники обратились к нам и предложили будущие права на нефть бакинских месторождений в обмен на помощь в укреплении их военного потенциала."
 NSB_soviet_civil_war_common.106.desc_exiles_before:0 "Антикоммунистические группы в Маньчжурии готовят заговор против [SOV.GetLeader]. Они намерены свергнуть большевиков в ходе новой гражданской войны. Представители этой группы обратились к нам за помощью в тайном наращивании военного потенциала, предложив взамен будущие права на нефть бакинских месторождений."
 NSB_soviet_civil_war_common.106.desc_exiles_civil_war:0 "Русские белые силы восстали против [SOS.GetLeader], начав в России новую гражданскую войну. Мятежники обратились к нам и предложили будущие права на нефть бакинских месторождений в обмен на помощь в укреплении их военного потенциала."
 NSB_soviet_civil_war_common.106.a:0 "Всё, что дестабилизирует Советский Союз, идёт нам на пользу"
 NSB_soviet_civil_war_common.106.b:0 "Звучит очень заманчиво. Стоит даже отправить несколько военных советников"
 NSB_soviet_civil_war_common.106.c:0 "Не будем в это вмешиваться"
 SOV_baku_oil_fields_tt:1 "[ROOT.GetNameDefCap] поможет построить военную промышленность для подготовки к гражданской войне в [FROM.GetNameDef]. Взамен [ROOT.GetNameDef] получит §Yправа на ресурсы§! бакинских нефтяных месторождений после окончания советской гражданской войны\n"
 SOV_german_advisors_tt:0 "Два командующих армией отправятся сражаться на стороне оппозиции во время советской гражданской войны\n"
 NSB_soviet_civil_war_common.107.t:0 "[FROM.GetNameDefCap] соглашается помочь в обмен на бакинские нефтяные месторождения"
 NSB_soviet_civil_war_common.107.desc_normal:0 "[FROM.GetNameDef] благосклонно отнеслось к нашей просьбе помочь в укреплении военного потенциала. [FROM.GetAdjective] правительство поможет построить военные заводы в обмен на будущие права на кавказскую нефть."
 NSB_soviet_civil_war_common.107.desc_advisors:1 "[FROM.GetAdjective] правительство согласилось помочь в развитии военной промышленности в обмен на будущие права на нефть. Кроме того, оно согласилось отправить нескольких военных «советников», которые останутся с нами на всё время гражданской войны."
 NSB_soviet_civil_war_common.107.a:0 "Хорошие новости"
 NSB_soviet_civil_war_common.108.t:0 "[FROM.GetNameDefCap] отказывается помочь"
 NSB_soviet_civil_war_common.108.desc:1 "Наши переговоры с [FROM.GetNameDef] оказались безрезультатными. Даже несмотря на предложение будущих прав на нефть, они не станут помогать нам строить новые военные предприятия."
 NSB_soviet_civil_war_common.108.a:0 "Значит, придётся справляться самим"
 NSB_soviet_civil_war_common.109.t:0 "Отправка «советников» в [SOV.GetNameDef]"
 NSB_soviet_civil_war_common.109.desc:0 "В России вновь вспыхнула гражданская война. [SOV.GetLeader] ведёт борьбу против [SOS.Getleader], и в случае победы мятежников мы можем многое получить. Мы обещали им поддержку, и [?ROOT.SOV_foreign_military_advisor_1.GetName] вместе с [?ROOT.SOV_foreign_military_advisor_2.GetName] готовы отправиться в [SOV.GetName], чтобы помочь в планировании войны и получить ценные сведения о [SOV.GetAdjective] военном потенциале."
 NSB_soviet_civil_war_common.109.a:0 "Это будет весьма интересно"
 NSB_soviet_civil_war_common.110.t:0 "Помощь в организации украинского восстания"
 NSB_soviet_civil_war_common.110.desc:0 "Советская оппозиция попросила нас помочь в её борьбе за власть. Они хотят, чтобы мы тайно обучили украинское ополчение, а взамен предлагают будущие права на ресурсы независимой Украины."
 NSB_soviet_civil_war_common.110.a:0 "Слишком выгодное предложение, чтобы отказываться "
 NSB_soviet_civil_war_common.110.b:0 "Не будем в это вмешиваться"
 SOV_ukraine_insurrection_tt:1 "[ROOT.GetName] будет обучать украинское ополчение в обмен на будущие §Yправа на ресурсы§! на Украине.\n"
 NSB_soviet_civil_war_common.111.t:2 "[FROM.GetNameDefCap] будет обучать украинское ополчение"
 NSB_soviet_civil_war_common.111.desc:1 "[FROM.GetNameDefCap] согласилось начать подготовку украинского ополчения. Когда подразделения будут готовы, их тайно перебросят на Украину, где они поднимут восстание против сталинского режима."
 NSB_soviet_civil_war_common.111.a:0 "Лучше бы это сработало"
 NSB_soviet_civil_war_common.112.t:1 "[FROM.GetNameDefCap] отклоняет предложение по Украине"
 NSB_soviet_civil_war_common.112.desc:0 "После нескольких дней обсуждений [FROM.GetLeader] внезапно отказался поддержать украинское восстание, и наши переговорщики так и не поняли, почему их предложение было отвергнуто."
 NSB_soviet_civil_war_common.112.a:0 "Очень жаль"
 NSB_soviet_civil_war_common.113.t:0 "Украинское ополчение готово"
 NSB_soviet_civil_war_common.113.desc_before:0 "Наши немецкие связные сообщают, что подготовленное ими украинское ополчение готово нанести удар. Подразделения вооружены и обучены и будут тайно размещены на Украине в ожидании начала войны."
 NSB_soviet_civil_war_common.113.desc_started:0 "Наши немецкие связные сообщают, что подготовленное ими украинское ополчение готово нанести удар. Подразделения вооружены и тайно переброшены в стратегически важные районы. Приказ выступать уже отдан, и восстание начнётся с минуты на минуту."
 NSB_soviet_civil_war_common.113.a:0 "Ещё один враг для [SOS.GetLeader]"
 NSB_soviet_civil_war_common.113.b:0 "Хорошо знать"
 NSB_soviet_civil_war_common.113.c:0 "Стоп, что?"
 NSB_soviet_civil_war_common.114.t:0 "Украинское восстание"
 NSB_soviet_civil_war_common.114.desc:0 "Обученные немцами украинские солдаты взяли под контроль ключевые города по всей Украине. Было сформировано временное правительство во главе с [UKR.GetLeader], а [UKR.GetNameDef] объявило себя независимым государством."
 NSB_soviet_civil_war_common.114.a:0 "Это неприемлемо!"
 NSB_soviet_civil_war_common.114.b:0 "Что ж, в конце концов мы сами на это согласились"
 NSB_soviet_civil_war_common.114.c:0 "Это нанесёт серьёзный удар по [SOS.GetLeader]"
 NSB_soviet_civil_war_common.115.t:0 "Будущая независимость Белоруссии в обмен на поддержку"
 NSB_soviet_civil_war_common.115.desc:0 "Советская оппозиция обратилась к нам с просьбой о тайной поддержке. В обмен на поставки и помощь в наращивании военного потенциала они готовы согласиться на возвращение [BLR.GetAdjective] правительства в изгнании."
 NSB_soviet_civil_war_common.115.a:0 "Великолепная идея"
 NSB_soviet_civil_war_common.115.b:0 "У нас и без того хватает собственных проблем"
 SOV_belarus_tt:0 "[BLR.GetNameDefCap] будет освобождена как независимое государство после окончания [GetSovietCivilWarName]"
 NSB_soviet_civil_war_common.116.t:0 "[FROM.GetNameDefCap] поддерживает наше дело"
 NSB_soviet_civil_war_common.116.desc:0 "Наши переговоры с [FROM.GetAdjective] представителями завершились успешно. В обмен на разрешение [BLR.GetAdjective] правительству в изгнании вернуться после войны [FROM.GetAdjective] правительство поддержит нас в наращивании военного потенциала и предоставит снаряжение."
 NSB_soviet_civil_war_common.116.a:0 "Хорошо"
 NSB_soviet_civil_war_common.117.t:0 "[FROM.GetNameDef] отказывает в поддержке"
 NSB_soviet_civil_war_common.117.desc:0 "Наши переговоры с [FROM.GetAdjective] представителями не привели ни к каким конкретным результатам. [FROM.GetLeader] отклонил наше предложение, поэтому помощи от [FROM.GetName] не будет."
 NSB_soviet_civil_war_common.117.a:0 "Придётся обойтись без их помощи"
 NSB_soviet_civil_war_common.118.t:0 "Советская оппозиция просит о поддержке"
 NSB_soviet_civil_war_common.118.desc:0 "Члены антисталинской советской оппозиции сейчас ведут кампанию против сталинского режима. Здесь, в [ROOT.GetName], было организовано несколько антисталинских митингов и проводятся кампании по сбору средств.\nПомимо укрепления народной поддержки своего дела, они тайно обратились к нам с просьбой предоставить оружие для поддержки восстания."
 NSB_soviet_civil_war_common.118.a:0 "Снабдим их винтовками"
 NSB_soviet_civil_war_common.118.b:0 "По крайней мере несколько винтовок мы выделить можем"
 NSB_soviet_civil_war_common.118.c:0 "У нас их нет, но, возможно, мы сможем купить оружие для них"
 NSB_soviet_civil_war_common.118.d:0 "Нет смысла вмешиваться"
 NSB_soviet_civil_war_common.119.t:0 "[FROM.GetNameDefCap] поддерживает наше дело"
 NSB_soviet_civil_war_common.119.desc:0 "[FROM.GetAdjective] правительство согласилось тайно снабжать нас оружием."
 NSB_soviet_civil_war_common.119.a:0 "Отлично"
 NSB_soviet_civil_war_common.120.t:0 "[FROM.GetAdjective] правительство не станет нас поддерживать"
 NSB_soviet_civil_war_common.120.desc:0 "Наша кампания по сбору средств в [FROM.GetNameDef] прошла успешно. Однако правительство отказалось снабжать нас оружием."
 NSB_soviet_civil_war_common.120.a:0 "Очень жаль"
 NSB_soviet_civil_war_common.121.t:0 "[FROM.GetName] просит нашей защиты"
 NSB_soviet_civil_war_common.121.desc:0 "[FROM.GetLeader] направил делегацию с просьбой оказать поддержку в борьбе против [SOS.GetNameDef]. \n[FROM.GetAdjective] правительство готово отказаться от своего суверенитета в обмен на вступление [ROOT.GetAdjective] государства в войну."
 NSB_soviet_civil_war_common.121.a:0 "Именно этого мы и ждали"
 NSB_soviet_civil_war_common.121.b:0 "Не будем позволять втянуть себя в это"
 NSB_soviet_civil_war_common.122.t:0 "[FROM.GetName] принимает наше предложение"
 NSB_soviet_civil_war_common.122.desc:1 "Жаль, что до этого дошло. Но чтобы вернуть контроль над утраченным, мы должны пойти на жертвы. Это лишь временная чрезвычайная мера.\nКогда с большевиками будет покончено, мы добьёмся полной независимости."
 NSB_soviet_civil_war_common.122.a:0 "К победе"
 NSB_soviet_civil_war_common.123.t:0 "[FROM.GetName] бросает нас"
 NSB_soviet_civil_war_common.123.desc:0 "В наш самый отчаянный час [FROM.GetLeader] решил отозвать обещанную [FROM.GetNameDef] поддержку, хотя ради её получения мы были готовы пойти на крайние меры."
 NSB_soviet_civil_war_common.123.a:0 "Мы этого не забудем!"
 NSB_soviet_civil_war_common.124.t:0 "[FROM.GetAdjective] фабрики достроены"
 NSB_soviet_civil_war_common.124.desc:0 "Фабрики, построенные в регионе [?SOV_civil_war_start_state.GetName], готовы к запуску. Это значительно поможет нашим военным усилиям как сейчас, так и в будущем."
 NSB_soviet_civil_war_common.124.a:0 "Хорошо"
 NSB_soviet_civil_war_common.125.t:0 "Дезертирство во вражеской армии"
 NSB_soviet_civil_war_common.125.desc:0 "После захвата нами региона [?SOV.SOV_defections_army_state.GetName] армия [SOS.GetLeader] падает духом. Солдаты массово дезертируют: одни просто складывают оружие, а другие переходят на нашу сторону."
 NSB_soviet_civil_war_common.125.a:0 "Отлично"
 SOS_army_desertions_tt:0 "Армия государства §Y[SOS.GetNameWithFlag]§! теряет §Yснаряжение§!, §Yлюдские ресурсы§! и §Yорганизацию§!, а некоторые подразделения переходят на сторону государства §Y[ROOT.GetNameWithFlag]§!."
 NSB_soviet_civil_war_common.126.t:0 "Армейский склад захвачен в регионе [?SOV.SOV_captured_stockpile_state.GetName]"
 NSB_soviet_civil_war_common.126.desc:0 "Наши победоносные войска захватили [SOS.GetAdjective] армейский склад в регионе [?SOV.SOV_captured_stockpile_state.GetName]. Отступающие [SOS.GetAdjective] войска пытались уничтожить его, но нашим солдатам удалось захватить часть снаряжения."
 NSB_soviet_civil_war_common.126.a:0 "Мы найдём ему хорошее применение"
 NSB_soviet_civil_war_common.127.t:0 "Дезертирство на флоте"
 NSB_soviet_civil_war_common.127.desc:0 "После нашей победы в регионе [?SOV.SOV_defections_navy_state.GetName] несколько морских офицеров осознали, что сражаются за проигранное дело. В результате ряд кораблей покинул Красный флот, а их экипажи предложили перейти на нашу сторону."
 NSB_soviet_civil_war_common.127.a:0 "Дарёному коню в зубы не смотрят"
 SOS_navy_desertions_tt:0 "Военно-морские подразделения государства §Y[SOS.GetNameWithFlag]§! переходят на сторону государства §Y[ROOT.GetNameWithFlag]§!."
 NSB_soviet_civil_war_common.128.t:0 "Беспорядки в [SOS.GetNameDef]"
 NSB_soviet_civil_war_common.128.desc:0 "Согласно сообщениям, наши последние победы на фронте, такие как захват региона [?SOV.SOV_civilian_unrest_state.GetName], привели к протестам по всей территории [SOS.GetNameDef]. Разумеется, приспешники [SOS.GetLeader] жестоко подавляют эти выступления, но, несмотря на это, они неизбежно окажут негативное влияние на [SOS.GetAdjective] военные усилия."
 NSB_soviet_civil_war_common.128.a:0 "Мы победим"
 SOS_civilian_unrest_tt:0 "Промышленность государства §Y[SOS.GetNameWithFlag]§! получает урон. \n Предел капитуляции §Y[SOS.GetLeader]§! снижается."
 NSB_soviet_civil_war_common.129.t:0 "[?SOV.SOV_japanese_general.GetName] отправляется в путь"
 NSB_soviet_civil_war_common.129.desc:0 "Поскольку в России бушует гражданская война, настало время выполнить наши обещания. [?SOV.SOV_japanese_general.GetName] поведёт [ROOT.GetAdjective] экспедиционный корпус к победе и славе и защитит честь [ROOT.GetNameDef]."
 NSB_soviet_civil_war_common.129.a:0 "Каждый должен исполнить свой долг"
 NSB_soviet_nationalist.001.t:0 "Националистическое восстание в [?SOV.SOV_nationalist_country.GetNameDef]"
 NSB_soviet_nationalist.001.desc:0 "[?SOV.SOV_nationalist_country.GetLeader] провозгласил независимость государства [?SOV.SOV_nationalist_country.GetName]. [SOS.GetLeader] назвал это актом государственной измены и приказал схватить и расстрелять мятежников. В результате [SOS.GetNameDef] и [?SOV.SOV_nationalist_country.GetNameDef] теперь находятся в состоянии войны."
 SOV_breakaway_country_flag:0 "Провозгласило независимость от Советского Союза"
 NSB_soviet_nationalist.001.a:0 "Враг нашего врага — наш друг"
 NSB_soviet_nationalist.001.b:0 "Это законная [ROOT.GetAdjective] территория!"
 NSB_soviet_nationalist.001.c:0 "Я буду сражаться за них и защищать их свободу!"
 indepence_war_threat:0 "Провозглашение независимости"
 NSB_soviet_nationalist.002.t:0 "[FROM.GetNameDefCap] требует подчинения"
 NSB_soviet_nationalist.002.desc:0 "[FROM.GetAdjective] посол обратился к нашему правительству с «просьбой» признать [FROM.GetNameDef] истинным и верховным правительством государства [ROOT.GetName]. Взамен нам предлагают «определённую степень автономии»."
 NSB_soviet_nationalist.002.a:0 "Мы победили Советский Союз — победим и их."
 NSB_soviet_nationalist.002.b:0 "Возможно, так будет лучше."
 NSB_soviet_nationalist.003.t:0 "[FROM.GetNameDefCap] соглашается"
 NSB_soviet_nationalist.003.desc:0 "[FROM.GetLeader] не увидел причин отвергать наши законные требования. [FROM.GetNameDef] вернётся в состав Империи, сохранив некоторые права на самоуправление."
 NSB_soviet_nationalist.003.a:0 "Великий день для России"
 NSB_soviet_nationalist.004.t:0 "[FROM.GetNameDefCap] отказывается"
 NSB_soviet_nationalist.004.desc:0 "Несмотря на давление, и несмотря на то, что полностью осознаёт [FROM.GetLeader.GetHerHis] нестабильное положение страны, [FROM.GetLeader] Он отказался принять наше щедрое предложение об автономии в восстановленной Российской империи."
 NSB_soviet_nationalist.004.a:0 "Мы должны заставить их подчиниться!"
 NSB_soviet_nationalist.004.b:0 "Полагаю, нам придётся немного подождать"
 NSB_soviet_permanent_revolution.1.t:0 "Троцкистские революционеры подстрекают массы"
 NSB_soviet_permanent_revolution.1.desc:0 "Троцкисты из [FROM.GetNameDef] будоражат массы революционной пропагандой. Они даже обещают прийти на помощь [ROOT.GetAdjective] пролетариату, если тот восстанет против государства. Ситуация грозит выйти из-под контроля."
 NSB_soviet_permanent_revolution.1.a:0 "По сути, это акт агрессии"
 NSB_soviet_for_the_common_good.1.t:0 "Ради общего блага"
 NSB_soviet_for_the_common_good.1.desc:0 "Коллектив сильнее отдельной личности. То же справедливо и для экономик. [SOV.GetNameDefCap] решил реорганизовать экономики всех своих союзников, чтобы они лучше служили общему благу, а не интересам отдельных стран. Это потребует изменений в нынешнем порядке и поначалу, возможно, вызовет некоторые трудности, но в конечном итоге пойдёт на пользу всем."
 NSB_soviet_for_the_common_good.1.a:0 "Ради общего блага!"
 NSB_soviet_fascist_tsarist.1.t:0 "Членство в Панславянском союзе"
 NSB_soviet_fascist_tsarist.1.desc:0 "Пока окружающий нас мир погружается в насилие, [FROM.GetNameDef] выступает вперёд и клянётся защищать все славянские народы от тех, кто желает причинить нам вред. Нам предложено вступить в новый «Панславянский союз», в котором, по их утверждению, все славянские народы будут представлены честно и справедливо и защищены великой [FROM.GetAdjective] армией."
 NSB_soviet_fascist_tsarist.1.a:0 "Мы примем участие в этом великом объединении славянских народов!"
 NSB_soviet_fascist_tsarist.1.b:0 "Их защита не стоит нашей независимости."
 NSB_soviet_fascist_tsarist.2.t:0 "Панславянский союз: [FROM.GetNameDef] соглашается"
 NSB_soviet_fascist_tsarist.2.desc:0 "Мы только что получили известие от [FROM.GetAdjective] правительства: [FROM.GetNameDef] принимает наше приглашение вступить в Панславянский союз."
 NSB_soviet_fascist_tsarist.2.a:0 "Мудрое решение."
 NSB_soviet_fascist_tsarist.3.t:0 "Панславянский союз: [FROM.GetNameDef] отказывается"
 NSB_soviet_fascist_tsarist.3.desc:0 "Представители [FROM.GetAdjective] правительства сообщили нам, что категорически отвергают любую возможность добровольного участия в нашем Панславянском союзе."
 NSB_soviet_fascist_tsarist.3.a:0 "Панславянский союз станет реальностью — с их согласия или без него."
 NSB_soviet_fascist_tsarist.4.t:0 "[FROM.GetNameDef] влияет на нашу политику"
 NSB_soviet_fascist_tsarist.4.desc:0 "До нас дошли тревожные сообщения о том, что [FROM.GetAdjective] агитаторы распространяют в нашей стране фашистскую пропаганду, а [FROM.GetAdjective] деньги идут на финансирование деятельности местной фашистской партии и её политических расходов."
 NSB_soviet_fascist_tsarist.4.a:0 "Мы должны быть начеку, чтобы нас не покорили без единого выстрела."
 NSB_soviet_fascist_tsarist.5.t:0 "Приглашение вступить в [FROM.GetFactionName]"
 NSB_soviet_fascist_tsarist.5.desc:0 "Признав сходство наших взглядов на мир, [FROM.GetNameDef] пригласило нас в [FROM.GetFactionName], предложив военную и экономическую поддержку в стремлении обеспечить нашей нации славное будущее!"
 NSB_soviet_fascist_tsarist.5.a:0 "Под [FROM.GetAdjective] руководством мы станем сильнее."
 NSB_soviet_fascist_tsarist.5.b:0 "Чтобы быть сильными, нам не нужны русские!"
 NSB_soviet_fascist_tsarist.6.t:0 "[FROM.GetNameDef] вступает в [ROOT.GetFactionName]"
 NSB_soviet_fascist_tsarist.6.desc:0 "[FROM.GetNameDef] приняло наше предложение о союзе и отныне вступает в нашу фракцию!"
 NSB_soviet_fascist_tsarist.6.a:0 "Теперь они станут нашим плацдармом в Америке."
 NSB_soviet_fascist_tsarist.7.t:0 "[FROM.GetNameDef] отклоняет приглашение"
 NSB_soviet_fascist_tsarist.7.desc:0 "[FROM.GetAdjective] правительство сообщило нам, что отклоняет наше предложение о союзе. Оно предпочитает в одиночку противостоять угрозам в Америке."
 NSB_soviet_fascist_tsarist.7.a:0 "Глупцы!"
 NSB_soviet_fascist_tsarist.8.desc:0 "Признав, что теперь наши взгляды на мир наконец совпадают, [FROM.GetNameDef] пригласило нас в [FROM.GetFactionName], предложив продолжить военную и экономическую поддержку в стремлении обеспечить нашей нации славное будущее — подобно тому, как они поддерживали приход нашей партии к власти в [ROOT.GetNameDef]!"
 NSB_soviet_fascist_tsarist.9.desc:0 "[FROM.GetNameDef] наконец стало фашистской державой. Поэтому ему предложили членство в нашем союзе, и оно приняло предложение."
 NSB_soviet_fascist_tsarist.10.desc:0 "[FROM.GetNameDef] наконец стало фашистской державой. Однако, несмотря на всю нашу помощь в приведении их фашистской партии к власти и предложение вступить в наш союз, они отклонили приглашение и решили действовать в одиночку."
 NSB_soviet_fascist_tsarist.11.t:0 "[FROM.GetAdjective] наращивание военно-морских сил"
 NSB_soviet_fascist_tsarist.11.desc:0 "До нас дошли сообщения, что [FROM.GetNameDef] стремительно расширяет военно-морскую инфраструктуру на Дальнем Востоке. Это не сулит ничего хорошего существующему порядку в регионе..."
 NSB_soviet_fascist_tsarist.11.a:0 "Несомненно, они хотят бросить вызов нашей гегемонии."
 NSB_soviet_fascist_tsarist.12.t:0 "[FROM.GetAdjective] антияпонская пропаганда"
 NSB_soviet_fascist_tsarist.12.desc:0 "[FROM.GetAdjective] газеты печатают всё больше статей с критикой [ROOT.GetAdjective] действий на Дальнем Востоке, а их политики используют всё более провокационные выражения, осуждая нас и напоминая [FROM.GetAdjective] народу о позорном поражении в войне 1905 года. Самые рьяные агитаторы уже призывают «отомстить за Цусиму»!"
 NSB_soviet_fascist_tsarist.12.a:0 "Нам следует подготовиться к войне с нашим давним противником..."
 NSB_soviet_fascist_tsarist.13.t:0 "[FROM.GetAdjective] военное строительство на Камчатке"
 NSB_soviet_fascist_tsarist.13.desc:0 "Согласно сообщениям, [FROM.GetNameDef] ведёт масштабное расширение военной инфраструктуры на Камчатке. Военные аналитики полагают, что эти объекты могут предназначаться лишь для усиления [FROM.GetAdjective] возможностей по проецированию силы против наших войск на Аляске, а в худшем случае — стать прямым плацдармом для вторжения!"
 NSB_soviet_fascist_tsarist.13.a:0 "Нам следует принять меры, исходя из этой информации..."
 NSB_soviet_fascist_tsarist.14.t:0 "Возвращение царя"
 NSB_soviet_fascist_tsarist.14.desc:0 "Несправедливость, постигшая нашу страну десятилетия назад, наконец исправлена. На подобающе величественной и пышной церемонии в Успенском соборе великий князь Владимир Кириллович был коронован как царь Владимир I под безудержное ликование толпы.\n\nПосле этого своим первым деянием царь возглавил шествие от ворот Кремля, приветствуя ликующие массы и лично принимая впечатляющий военный парад в свою честь.\n\nВ великолепной речи новый царь превозносил добродетели русского народа и поклялся вновь повести страну по пути к возвращению былого величия."
 NSB_soviet_fascist_tsarist.14.a:0 "Славно!"
 NSB_soviet_fascist_tsarist.15.t:1 "Коронация патриарха Мелетия"
 NSB_soviet_fascist_tsarist.15.desc:1 "По мере того как значение религии всё сильнее ощущается по всей нашей стране, а статус церкви вновь достиг — нет, даже превзошёл — прежнюю высоту, вполне естественно закрепить нашу преданность Богу, возведя Его главного представителя на пост национального лидера.\n\nСегодня в ходе двух величественных церемоний в храме Христа Спасителя и Успенском соборе в Москве Мелетий Харбинский и Маньчжурский, избранный в знак признания его служения делу изгнанников, был одновременно возведён на престол патриарха Московского и всея Руси и коронован царём всея Руси.\n\nПосле этого окончательного и полного слияния церкви и государства больше не осталось препятствий для исполнения Воли Божьей на этой земной сцене..."
 NSB_soviet_fascist_tsarist.15.a:0 "Да будет воля Твоя и на земле, как на небе."
 NSB_soviet_fascist_tsarist.16.t:0 "Тройственная Антанта"
 NSB_soviet_fascist_tsarist.16.desc:0 "Покончив с внутренними смутами и сформировав новое дружественное нам правительство, [SOV.GetNameDef] теперь предлагает возродить наш старый союз, чтобы сдержать [GER.GetAdjective] агрессию в Европе."
 NSB_soviet_fascist_tsarist.16.a:0 "Превосходная идея!"
 NSB_soviet_fascist_tsarist.16.b:0 "Мы не забыли, чего стоили их обещания в прошлый раз."
 NSB_soviet_fascist_tsarist.17.t:0 "Тройственная Антанта — предложение принято"
 NSB_soviet_fascist_tsarist.17.desc:1 "[FROM.GetNameDefCap] сообщает, что принимает наше предложение о союзе и уже предприняла шаги для расширения дипломатических связей с нами."
 NSB_soviet_fascist_tsarist.17.a:0 "Теперь немцам будет о чём беспокоиться."
 NSB_soviet_fascist_tsarist.18.t:0 "Тройственная Антанта — предложение отклонено"
 NSB_soviet_fascist_tsarist.18.desc:0 "[FROM.GetNameDef] сообщает, что в настоящее время не видит для себя никакой выгоды в союзе с нами."
 NSB_soviet_fascist_tsarist.18.a:0 "Плачевный провал дипломатии..."
 NSB_soviet_fascist_tsarist.19.desc:0 "Правительства [FROM.GetAdjective] и [SOV.GetAdjective] начали переговоры о воссоздании Тройственной Антанты, некогда объединявшей наши державы. Теперь они намерены воплотить этот план в жизнь и приглашают нас присоединиться."
 NSB_soviet_fascist_tsarist.19.a:0 "Мы согласимся ради будущей стабильности Европы."
 NSB_soviet_fascist_tsarist.19.b:0 "Их «Тройственная Антанта», к сожалению, останется двойственной."
 NSB_soviet_fascist_tsarist.20.a:0 "Вместе мы сильнее всего!"
 NSB_soviet_fascist_tsarist.21.a:0 "По крайней мере, с нами русские."
 NSB_soviet_fascist_tsarist.22.t:0 "Ось Берлин — Москва"
 NSB_soviet_fascist_tsarist.22.desc:0 "Представители [SOV.GetAdjective] обратились к нам с предложением о союзе. Они полагают, что, поскольку их новое правительство и наше имеют схожие взгляды и интересы, нам следует теснее сотрудничать в экономической и военной сферах."
 NSB_soviet_fascist_tsarist.22.a:0 "Эта новая Ось станет осью, вокруг которой будет вращаться весь мир!"
 NSB_soviet_fascist_tsarist.22.b:0 "Союз? Вряд ли."
 NSB_soviet_fascist_tsarist.23.t:0 "Ось Берлин — Москва: предложение принято"
 NSB_soviet_fascist_tsarist.23.desc:0 "Правительство [SOV.GetAdjective] сообщает, что с радостью примет участие в создании нашей новой дипломатической Оси. Оно уже готовится направить к нам дипломатических и военных представителей."
 NSB_soviet_fascist_tsarist.24.t:0 "Ось Берлин — Москва: предложение отклонено"
 NSB_soviet_fascist_tsarist.24.desc:0 "Сегодня дипломаты [SOV.GetAdjective] сообщили нам, что их правительство отклонило наше предложение."
 NSB_soviet_fascist_tsarist.24.a:0 "Крайне прискорбно... Уж не признак ли это враждебных намерений?"
 NSB_soviet_fascist_tsarist.25.t:0 "Токийская ось"
 NSB_soviet_fascist_tsarist.25.desc:0 "Представители [SOV.GetAdjective] предложили включить [JAP.GetNameDef] в наш союз. Учитывая историю напряжённых отношений между [SOV.GetName] и [JAP.GetName], они считают, что именно нам следует связаться с японцами и выступить посредниками между двумя державами."
 NSB_soviet_fascist_tsarist.25.a:0 "Немедленно отправим посланников."
 NSB_soviet_fascist_tsarist.25.b:0 "Боюсь, наши интересы не совпадают с интересами японцев."
 NSB_soviet_fascist_tsarist.26.t:0 "Токийская ось — [JAP.GetName] согласилась"
 NSB_soviet_fascist_tsarist.26.desc:0 "Мы получили ответ от правительства [GER.GetAdjective]: оно сообщает, что выступило посредником между нами и японцами, и японцы приняли предложение!"
 NSB_soviet_fascist_tsarist.26.a:0 "Отличные новости — наш восточный фланг в безопасности!"
 NSB_soviet_fascist_tsarist.27.t:0 "Токийская ось — [JAP.GetName] отказалась"
 NSB_soviet_fascist_tsarist.27.desc:0 "Правительство [GER.GetAdjective] сообщает, что, несмотря на все его усилия, японцы, к сожалению, отклонили наше предложение о союзе."
 NSB_soviet_fascist_tsarist.27.a:0 "Серьёзная неудача..."
 NSB_soviet_fascist_tsarist.28.t:0 "Токийская ось — [GER.GetName] отказалась"
 NSB_soviet_fascist_tsarist.28.desc:0 "Правительство [GER.GetAdjective] рассмотрело наше предложение о вступлении Японии в союз, но с сожалением сообщает, что в настоящее время не считает такой альянс отвечающим своим интересам."
 NSB_soviet_fascist_tsarist.28.a:0 "Жаль! Наверняка у них есть веские причины."
 NSB_soviet_fascist_tsarist.29.desc:0 "[GER.GetAdjective] связалась с нами и передала, по её словам, предложение [SOV.GetAdjective] о союзе между нашими тремя державами. Они утверждают, что, объединившись, мы не оставим остальному миру ни единого шанса противостоять нам."
 NSB_soviet_fascist_tsarist.29.a:0 "Пусть этот союз станет последним словом в дипломатии!"
 NSB_soviet_fascist_tsarist.29.b:0 "История учит нас, какова судьба триумвиратов... Мы отказываемся."
 NSB_soviet_fascist_tsarist.30.desc:0 "[JAP.GetName] сообщает, что решила принять предложение [SOV.GetAdjective] и готова присоединиться к нашему союзу при первой же возможности."
 NSB_soviet_fascist_tsarist.30.a:0 "Великолепно!"
 NSB_soviet_fascist_tsarist.31.desc:0 "[JAP.GetName] с сожалением сообщает, что считает предложение [SOV.GetAdjective] не отвечающим её нынешним интересам, а потому вынуждена отказаться."
 NSB_soviet_fascist_tsarist.31.a:0 "Обойдёмся без них."
 NSB_soviet_fascist_tsarist.32.t:0 "Власов взят в плен"
 NSB_soviet_fascist_tsarist.32.desc:0 "Во время последнего отступления противника наши войска захватили высокопоставленного генерала [SOV.GetAdjective]. Находясь у нас в плену, этот генерал, Андрей Власов, заявил о своём «антибольшевизме» и теперь предлагает сформировать из пленных русских несколько дивизий, которые будут сражаться на нашей стороне против «сталинизма»."
 NSB_soviet_fascist_tsarist.32.a:0 "В борьбе с большевизмом нам пригодится любой союзник."
 NSB_soviet_fascist_tsarist.32.b:0 "Ему нельзя доверять!"
 NSB_soviet_fascist_tsarist.33.desc:0 "Мы получили известие, что наш генерал [SOV_andrey_vlasov.GetName] попал в плен к вражеским войскам. Нам остаётся лишь гадать о его судьбе..."
 NSB_soviet_fascist_tsarist.33.a:0 "Прискорбно, но сейчас у нас есть заботы поважнее!"
 nsb_news.301.t:0 "Горские республики объединяются"
 nsb_news.301.d:0 "Вдохновлённые идеями Тапы Чермоева, Горские республики вновь объединились под руководством [FROM.GetLeader]. Они заявляют, что будут сражаться с любыми иностранными захватчиками, вторгшимися на земли Северного Кавказа, и займут достойное место в анналах истории. Так родилась Горская Республика Северного Кавказа!"
 nsb_news.301.a:0 "Мы больше не разобщены!"
 nsb_news.301.b:0 "Любопытно."
 nsb_news.302.t:0 "Закавказье снова объединяется"
 nsb_news.302.d:0 "Впервые Закавказье объединилось в начале Гражданской войны в России, но этот союз быстро распался. Во второй раз оно стало советской республикой, которую разделили после принятия Конституции СССР 1936 года. Теперь, в третий раз, [FROM.GetLeader] предпринял попытку вновь объединить закавказские страны, и они снова готовы не только защищать свои земли, но и расширяться за счёт чужих территорий. Лишь время покажет, что они предпримут."
 nsb_news.302.a:0 "Бог любит троицу."
 nsb_news.302.b:0 "Опять?"
 nsb_news.303.t:0 "Сибирь объединена"
 nsb_news.303.d:0 "После столетий под властью России Сибирь теперь является не просто регионом в составе чужой державы, а самостоятельным политическим образованием, единым и готовым любой ценой бороться за свои права. Народы Сибири ликуют: эпоха империализма завершилась, и теперь они могут жить в независимом государстве без иностранного вмешательства. Однако республика объявила, что не станет сидеть сложа руки, ведь ещё многие сибирские народы нуждаются в защите и освобождении — любой ценой!"
 nsb_news.303.a:0 "Наконец Сибирь освободилась от оков империализма!"
 nsb_news.303.b:0 "Хватка России на Востоке слабеет..."
 nsb_news.304.t:0 "Идель-Урал возвращается"
 nsb_news.304.d:0 "Впервые со времён Гражданской войны в России народы Волго-Уральского региона вновь объединились в государство, которое они называют Идель-Уралом. На этот раз они заявляют, что Россия не сумеет им помешать и что они сохранят независимость любой ценой. Лишь будущее покажет, суждено ли этому государству выжить..."
 nsb_news.304.a:0 "На этот раз оно не распадётся!"
 nsb_news.304.b:0 "Так, а где это вообще?"
 nsb_news.400.t:1 "Коронация Владимира III"
 nsb_news.400.desc:0 "После почти трёх десятилетий большевистского правления [SOV.GetName] сегодня вернулась к царской власти: в Успенском соборе Московского Кремля состоялась торжественная коронация царя Владимира I. После царской процессии сквозь толпы новый царь обратился к собравшемуся народу, воздав хвалу духу русского народа и поклявшись «вернуть стране былое величие»."
 nsb_news.400.a:0 "Великолепное событие!"
 nsb_news.400.b:0 "Разжигание войны!"
 nsb_news.400.c:0 "Кощунство!"
 nsb_news.401.t:0 "Земский собор распущен"
 nsb_news.401.desc:0 "Не прошло и нескольких месяцев после того, как правительство легитимизировало себя восстановлением Земского собора, как фашистские силы в правительстве [SOV.GetAdjective] уже распустили новый парламент и передали страну под контроль [SOV.GetLeader]. Недавно коронованный царь пока ещё играет роль номинального главы государства, но очевидно, что реальной власти у него почти не осталось.\n\nПосле смены режима националистическая риторика заметно усилилась: в речах превозносится братство «славянских народов» и осуждаются прошлые «прегрешения» соседних держав."
 nsb_news.401.a:0 "Нашей великой стране нужны сильные лидеры!"
 nsb_news.401.b:0 "Улучшит ли это положение — ещё предстоит увидеть."
 nsb_news.401.c:0 "Возникает новый союзник?"
 nsb_news.402.t:0 "Ось Берлин — Москва"
 nsb_news.402.desc:0 "Сегодня представители [GER.GetNameDef] и [SOV.GetNameDef] выступили с совместным заявлением о создании «Оси Берлин — Москва». Две державы будут сотрудничать в экономической, политической и военной сферах, чтобы «защищать свои интересы», заявляя, что «заботятся о стабильности Восточной и Центральной Европы».\n\nСоответствует ли это их истинным мотивам — ещё предстоит выяснить."
 nsb_news.402.a:0 "Наш великий союз набирает силу!"
 nsb_news.402.b:0 "Превосходная идея наших новых союзников на Востоке."
 nsb_news.402.c:0 "Неужели они создают новый мировой порядок?"
 nsb_news.402.d:0 "Теперь Европа полностью в их власти..."
 nsb_news.403.t:0 "Вмешательство [SOV.GetAdjective] в дела Америки"
 nsb_news.403.desc:0 "Появились доказательства масштабного вмешательства [SOV.GetAdjective] во внутреннюю политику множества стран Южной и Центральной Америки. Финансирование правых политических организаций и военизированных группировок, подкуп, давление и распространение дезинформации сделали внутреннюю стабильность этих государств всё более шаткой.\n\nЭксперты сходятся во мнении: если тайная деятельность [SOV.GetAdjective] не будет остановлена, некоторые из этих стран неизбежно станут идеологическим плацдармом [SOV.GetName] в Америке. Если это произойдёт, поддержка этих государств со стороны [SOV.GetAdjective], вероятно, лишь усилится и станет более открытой."
 nsb_news.403.a:0 "Жаль, что наше участие стало достоянием общественности."
 nsb_news.403.b:0 "Они вмешиваются прямо у нашего порога?!"
 nsb_news.403.c:0 "Скоро они увидят преимущества сильной власти."
 nsb_news.403.d:0 "Распространение фашизма вышло из-под контроля!"
 nsb_news.404.t:0 "Возвышение Третьего Рима"
 nsb_news.404.desc:0 "После последней гражданской войны, опустошившей страну, влияние православной церкви в России неуклонно росло. Теперь, завершив завоевание древней Византии, она сделала последние шаги к полному слиянию церкви и государства.\n\nПосле двойного возведения на престол в качестве верховного патриарха и коронации как царя всех русских [SOV.GetLeader] возглавляет страну, которую назвал «[SOV.GetNameDef]», следуя тому, что он именует «волей Божьей»."
 nsb_news.404.a:0 "Великолепно!"
 nsb_news.404.b:0 "Не может быть, чтобы они говорили всерьёз!"
 nsb_news.405.t:0 "[SOV.GetNameDefCap]"
 nsb_news.405.desc:0 "Вновь приняв на себя роль «защитницы всех славян», Россия решила, что лучший способ исполнить эту миссию — объединить все славянские народы в одном государстве.\n\nПосле завершения объединения [SOV.GetLeader] объявил о создании [SOV.GetNameDef], поклявшись, что «все доступные новому государству ресурсы будут направлены на благо его народа и защиту от внешних угроз»."
 nsb_news.405.a:0 "Объединённых славян не победить!"
 nsb_news.405.b:0 "Сила, с которой придётся считаться."
 nsb_news.406.t:0 "Защитник славян"
 nsb_news.406.desc:0 "[SOV.GetNameDef] вновь взяла на себя роль «защитницы славян», предоставив гарантии другим славянским народам Европы. В своём заявлении [SOV.GetLeader] поклялся, что «все доступные [SOV.GetNameDef] ресурсы будут направлены на благо всех славянских народов и их защиту от внешних угроз».\n\nВ качестве доказательства того, что страна держит свои обещания, правительство [SOV.GetAdjective] особо сослалось на своё вступление в Великую войну. Похоже, оно прекрасно осознаёт, к чему могут привести эти гарантии, и не намерено уклоняться от своих обязательств."
 nsb_news.406.a:0 "Мы держим обещания, данные нашим братьям."
 nsb_news.406.b:0 "Пока они уважают нашу независимость..."
 nsb_news.406.c:0 "Старший брат славян вернулся..."
 nsb_news.407.t:0 "Тройственная Антанта?"
 nsb_news.407.desc:0 "[From.GetNameDefCap] и [SOV.GetNameDef] объявили о возобновлении военного сотрудничества спустя три десятилетия после распада старой Тройственной Антанты.\n\nХотя об этом не говорится прямо, вероятнее всего, новый союз создан с целью сдержать экспансию некоторых центральноевропейских держав. Продолжит ли альянс расширяться — ещё предстоит увидеть."
 nsb_news.407.a:0 "Шаг к стабильной Европе."
 nsb_news.407.b:0 "Пережиток прошлого..."
 nsb_news.408.t:0 "Тройственная Антанта"
 nsb_news.408.desc:0 "[From.GetNameDefCap] объявила о решении присоединиться к своим бывшим союзникам в возрождённой Тройственной Антанте, прямо направленной против экспансионистских сил Центральной Европы."
 nsb_news.408.a:0 "Мы вновь стоим плечом к плечу."
 nsb_news.408.b:0 "Посмотрим, как скоро она расколется."
 nsb_news.409.t:0 "Ось Берлин — Москва: к союзу присоединяется Токио"
 nsb_news.409.desc:0 "В трёхстороннем заявлении правительства [GER.GetNameDef], [SOV.GetNameDef] и [JAP.GetNameDef] объявили, что [JAP.GetNameDef] станет следующим членом Оси.\n\nУчитывая недавнюю напряжённость между правительствами [SOV.GetAdjective] и [JAP.GetNameDef], это решение оказалось неожиданным и, вероятно, стало результатом активных переговоров со стороны [GER.GetAdjective]. Теперь восточный фланг [SOV.GetAdjective] фактически будет обеспечен, а [JAP.GetNameDef] сможет сосредоточить внимание на Тихом океане."
 nsb_news.409.a:0 "Мощный дипломатический ход."
 nsb_news.409.b:0 "Неожиданное развитие событий!"
