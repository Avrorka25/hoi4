 japanese_socialism_ideology:0 "Шинг Шонг"
 japanese_socialism_ideology_long:0 "Шинг Шонг"
 JAP_r56rp_yonai_takeover.1.t:0 "Сотрудничество с демократами?"
 JAP_r56rp_yonai_takeover.1.d:0 "Демократы по-прежнему в значительной степени популярны по всей нашей стране и помогали нам во время нашей войны с фашизмом. Было бы разумно дать им места в парламенте и обеспечить их поддержку великой коалиции в нашей стране, иначе могли бы появиться радикальные элементы."
 JAP_r56rp_yonai_takeover.1.a:0 "Принять демократов Демманд"
 JAP_r56rp_yonai_takeover.1.b:0 "Сверхдержава коммунизма"
 JAP_r56rp_yonai_takeover.2.t:0 "Поддерживаемый демократами морской переворот"
 JAP_r56rp_yonai_takeover.2.d:0 "Разжигаемые гневом на наше неприятие их деммандов для участия в управлении поддержали военно-морской флот и элементы армии под руководством адмирала Мицумасы Йонаи и штурмовали наш парламент, ввели военное положение и положили конец нашим социалистическим мечтам в Японии."
 JAP_r56rp_yonai_takeover.2.a:0 "Так вот как демократия умирает с громовыми аплодисментами..."
 JAP_r56rp_yonai_takeover.3.t:0 "Коалиция сформировалась!"
 JAP_r56rp_yonai_takeover.3.d:0 "Создана демократическая и коммунистическая коалиция, и Япония спасена, наша великая нация может теперь раз и навсегда удалить радикальные элементы в нашей стране и создать великую социалистическую республику в Азии, которая может начать залечивать раны нашей страны."
 JAP_r56rp_yonai_takeover.3.a:0 "Да здравствует республика"
