 JAP_r56rp_yonai_find_new_ifamily.1.t:0 "В поисках новой императорской семьи"
 JAP_r56rp_yonai_find_new_ifamily.1.desc:0 "С падением старой императорской семьи во время японской коммунистической революции адмирал Йонай и его сторонники должны найти подходящую семью, чтобы служить новой правящей династией Японии. Военно-морской флот намерен установить монархию, которая восстановит стабильность и обеспечит их господство в ближайшие годы."
 JAP_r56rp_yonai_find_new_ifamily.1.a:0 "Кандидат в Гогенцоллерн"
 JAP_wilhelm_iii:0 "Император Ихо Хоэнцоллерн"
