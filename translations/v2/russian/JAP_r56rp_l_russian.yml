 JAP_george_vi:0 "Император Тейи Виндзор"
 JAP_r56rp_yonai_find_new_ifamily.1.c:0 "Кандидат Романов"
 JAP_tsar_vladimir_kirillovich:0 "Император Кокей Романов"
 JAP_r56rp_yonai_find_new_ifamily.1.e:0 "Посмотреть отечественные кандидаты"
 JAP_r56rp_yonai_find_new_ifamily.2.t:0 "Внутренние имперские кандидаты"
 JAP_r56rp_yonai_find_new_ifamily.2.desc:0 "Совет Йонаи может смотреть ближе к дому, либо возводя японский промышленный дом на трон, либо сохраняя прямое военно-морское управление через постоянное регентство."
 JAP_r56rp_yonai_find_new_ifamily.2.a:0 "Кандидат в Mitsubishi"
 JAP_r56rp_yonai_find_new_ifamily.2.b:0 "Йонай будет служить великим регентом"
 JAP_r56rp_yonai_find_new_ifamily.2.c:0 "Вернуться в Иностранные кандидаты"
 JAP_r56rp_communist_new_eco_plan:0 "Новый экономический план"
