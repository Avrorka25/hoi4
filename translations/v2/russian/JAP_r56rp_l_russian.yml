 r56rp_jap.1:0 "[ROOT.capital.GetName] - [FROM.capital.GetName] Совместное ракетное исследование"
 r56rp_jap.1.t:0 "[ROOT.capital.GetName] - [FROM.capital.GetName] Совместное ракетное исследование"
 r56rp_jap.1.desc:0 "[FROM.GetAdjective] Дипломаты обратились к нам с предложением о совместных усилиях в области ракетных и реактивных исследований. В краткосрочной перспективе это в первую очередь пойдет на пользу. [FROM.GetNameDef]Однако, если они продвинут технологию достаточно далеко, мы все еще можем извлечь выгоду из их исследований."
 r56rp_jap.1.a:0 "Утвердить совместное исследование."
 r56rp_jap.1.b:0 "Откажитесь от предприятия."
 r56rp_JAP_night_time_naval_combat:0 "Ночное военно-морское время боевая тактика"
 r56rp_JAP_night_time_naval_combat_desc:0 "Многие страны отказываются от ночи в качестве места для отдыха и перегруппировки, особенно во время морских боев. Помещая значительные ресурсы и обучение в обучение наших капитанов и наводчиков в ночных боях, мы можем атаковать, когда этого меньше всего ожидают, и эффективно уничтожать их."
 r56rp_JAP_night_time_naval_tactics:0 "Ночное время Морская тактика"
 r56rp_JAP_night_time_naval_tactics_desc:0 "С нашими усилиями по обучению наших военно-морских экипажей в ночных боях, мы можем лучше врага в то время, когда они меньше всего ожидают этого."
