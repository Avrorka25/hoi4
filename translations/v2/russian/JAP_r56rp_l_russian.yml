 autonomy_asianworkerunion:0 "Азиатский Союз Трудящихся"
 JAP_r56rp_MAN_puppet:0 "Азиатское Союзное Государство Маньчжурии"
 JAP_r56rp_japanchuria_ev.1.t:0 "Будущее Японо-Чурии"
 JAP_r56rp_japanchuria_ev.1.d:0 "Растущее влияние на [KOR.GetNameDef] и [MAN.GetNameDef]Возникает вопрос: должны ли мы формально объединиться в единое целое? Это укрепит наши промышленные и военные возможности, но может вызвать сопротивление. Мы должны направить официальное предложение обоим правительствам и дать им возможность ответить."
 JAP_r56rp_japanchuria_ev.1.a:0 "Отправьте предложение об объединении."
 JAP_r56rp_japanchuria_ev.2.t:0 "[FROM.GetNameDefCap] Предлагает объединение"
 JAP_r56rp_japanchuria_ev.2.d:0 "Посланник из [FROM.GetNameDef] Это объединение приведет к большей степени процветания, безопасности и стабильности в наших сферах, предоставляя нашим гражданам широкие возможности для полного раскрытия своего потенциала. Однако не все заинтересованы в том, чтобы стать на колени перед другим правительством за рубежом, и поэтому мы должны принять решение. Согните колено, попросите какой-то степени автономии, или мы полностью опровергнем эту идею?"
 JAP_r56rp_japanchuria_ev.2.a:0 "Объединение звучит наиболее благотворно"
 JAP_r56rp_japanchuria_ev.2.b:0 "Мы предпочитаем некоторую автономию прямому подчинению."
 JAP_r56rp_japanchuria_ev.2.c:0 "Мы полностью отвергаем это предложение."
 JAP_r56rp_japanchuria_ev.3.t:0 "[FROM.GetNameDefCap] Договорились о полной интеграции"
 JAP_r56rp_japanchuria_ev.3.d:0 "Посланник, которого мы послали [FROM.GetNameDef] Возвращение с великими новостями, [FROM.GetAdjective] Правительство согласилось с предложением о полном объединении обеих наших стран. Вместе мы будем сильнее, и вместе мы сможем отогнать как китайцев, так и русских, если они придут за нами."
 JAP_r56rp_japanchuria_ev.3.a:0 "Потрясающе!"
 JAP_r56rp_japanchuria_ev.4.t:0 "[FROM.GetNameDefCap] Предпочитает автономию"
 JAP_r56rp_japanchuria_ev.4.d:0 "Посланник, которого мы послали [FROM.GetNameDef] Он вернулся с позитивными новостями, а [FROM.GetAdjective] Правительство отклонило предложение о полном объединении обеих наших стран, они согласились стать автономным государством. Хотя мы бы предпочли объединение, это все равно сделает нас сильнее."
 JAP_r56rp_japanchuria_ev.4.a:0 "Могло быть и хуже"
 JAP_r56rp_japanchuria_ev.5.t:0 "[FROM.GetNameDefCap] Связи Северса"
 JAP_r56rp_japanchuria_ev.5.d:0 "Посланник, которого мы послали [FROM.GetNameDef] Вернулся с печальными новостями. Новость, что [FROM.GetNameDef] В конце этой конференции мы разорвем их связи с нашей страной. К сожалению, это приведет к тому, что мы станем слабее в долгосрочной перспективе, но мы все равно должны быть в состоянии противостоять всему, что мир бросает в нас."
 JAP_r56rp_japanchuria_ev.5.a:0 "Увы, мы предоставили им возможность"
 JAP_r56rp_japanchuria_ev.6.t:0 "Окончание Японо-Чурской конференции"
 JAP_r56rp_japanchuria_ev.6.d:0 "Сегодня завершается конференция, посвященная идее Японо-Чурии, и некоторые из них опечалены сделанными выводами, а другие празднуют. Теперь мы готовы смотреть в лицо своему будущему, принесет ли оно нам почетную славу или поражение, мы пока не знаем."
 JAP_r56rp_japanchuria_ev.6.a:0 "Конференция завершилась"
 JAP_r56rp_japanchuria_colonial.1.t:0 "Вопрос о малайском суверенитете"
 JAP_r56rp_japanchuria_colonial.1.desc:0 "Как нация, преданная освобождению угнетенных и демонтажу колониального господства, Японская Народная Республика должна действовать против британского империализма. Работники Малайи остаются в кандалах под иностранным правлением, им отказано в праве на самоопределение. Наше правительство официально потребовало, чтобы британцы отказались от своей власти над Малайей и позволили ее народу наметить свое собственное социалистическое будущее."
 JAP_r56rp_japanchuria_colonial.1.a:0 "Они заслуживают свободы."
 JAP_r56rp_japanchuria_colonial.1.b:0 "Никогда!"
 JAP_r56rp_japanchuria_colonial.2.t:0 "Великобритания дарует Малайе независимость!"
 JAP_r56rp_japanchuria_colonial.2.desc:0 "После интенсивного дипломатического давления британское правительство уступило нашим требованиям и предоставило полный суверенитет малайскому народу. Эпоха колониального порабощения подходит к концу, и между нашими народами может возникнуть новое социалистическое братство."
 JAP_r56rp_japanchuria_colonial.2.a:0 "Победа мировой революции!"
 JAP_r56rp_japanchuria_colonial.3.t:0 "Великобритания отказывается отпускать Малайю"
 JAP_r56rp_japanchuria_colonial.3.desc:0 "Несмотря на наши дипломатические усилия, британцы категорически отказались предоставить Малайе ее законную независимость. Этот вопиющий акт имперского неповиновения не может остаться без ответа. Революции не должны препятствовать капиталистические тираны."
 JAP_r56rp_japanchuria_colonial.3.a:0 "Тогда мы возьмем его силой!"
 JAP_r56rp_japanchuria_colonial.4.t:0 "Малайя обрела независимость!"
 JAP_r56rp_japanchuria_colonial.4.desc:0 "С падением британского колониального правления Малайя вступила в новую эру независимости. Теперь у народа есть шанс выковать свою судьбу, свободную от империалистической эксплуатации. Как они будут формировать свое будущее, еще предстоит выяснить."
 JAP_r56rp_japanchuria_colonial.4.a:0 "Над Малайей встает новый рассвет!"
 r56rp_JAP_navy_coup_power:0 "Военно-морское доминирование Йонаи"
 r56rp_jap.2.t:0 "Вопрос о Лондонском морском договоре"
 r56rp_jap.2.d:0 "Прошло почти четырнадцать лет с тех пор, как мы подписали Вашингтонский морской договор, и, несмотря на то, что он был выгоден для нас, ограничивая военно-морское строительство. [USA.GetNameDef] и [ENG.GetNameDef]Настало время избавиться от оков и стать доминирующей военно-морской силой в Тихом океане. Хотя у нас еще есть время отступить, если бы наши умы изменились."
 r56rp_jap.2.a:0 "Мы четко обозначили свою позицию"
 r56rp_jap.2.b:0 "Может быть, разумно не разозлить мир..."
 JAP_r56rp_manchu_union_desc:0 "Мы обретем великую землю Японо-Чурия. Это всего лишь Япония. Назовут его только Япония. Больше ничего. Япония"
 JAP_r56rp_the_naval_state:0 "Военно-морское государство"
 JAP_r56rp_the_naval_state_2:0 "Военно-морское государство"
 JAP_r56rp_prime_minister_yonai_prime_minister_yonai:0 "Премьер-министр Йонай"
 r56rp_trait_naval_yonai_advisor:0 "Премьер-министр"
 JAP_mitsubishi_canidate:0 "Император Джинко Ивасаки"
 JAP_r56rp_restablish_korea_c:0 "Восстановление корейского владычества"
 JAP_r56rp_restablish_manchu_c:0 "Восстановление маньчжурского доминиона"
 JAP_r56rp_soviet_unionist_support:0 "Советская и юнионистская поддержка"
 JAP_r56rp_nomin_social_ideals_desc:0 ""
 JAP_r56rp_japanese_social_teachings_desc:0 ""
 JAP_r56rp_socialistic_army_schools_desc:0 ""
 JAP_r56rp_return_korea_to_fold_desc:0 ""
 JAP_r56rp_return_manchu_to_fold_desc:0 ""
 JAP_r56rp_asanuma_mantle_desc:0 ""
 JAP_r56rp_manchu_union_yen_desc:0 ""
 JAP_r56rp_manchu_union_colony_desc:0 ""
 JAP_r56rp_restablish_korea_c_desc:0 "Корейский полуостров должен быть защищен под лояльным господством, прежде чем враждебные силы смогут обратить его против военно-морского государства."
 JAP_r56rp_restablish_manchu_c_desc:0 "Маньчжурия остается ключом к континентальной позиции Японии. Правительство Йонаи восстановит контроль через восстановленное господство."
 JAP_r56rp_mitsubishi_canidate:0 "Кандидат в Mitsubishi"
 JAP_r56rp_mitsubishi_canidate_desc:0 "Внутренний императорский дом избавит Японию от иностранной династической зависимости, привязывая новую монархию к промышленным семьям, которые могут восстановить государство."
 JAP_r56rp_mitsubishi_zaibatsu_compact:0 "Компактный Zaibatsu"
 JAP_r56rp_mitsubishi_zaibatsu_compact_desc:0 "Суд Mitsubishi привяжет zaibatsu к военно-морскому государству Йонаи, обмениваясь лояльностью и легитимностью для промышленной экспансии."
 JAP_r56rp_mitsubishi_keiretsu_armament_boards:0 "Советы по вооружению Keiretsu"
 JAP_r56rp_mitsubishi_keiretsu_armament_boards_desc:0 "Суд превратит большие промышленные дома в дисциплинированные доски вооружения, сохраняя при этом частную экспертизу и заставляя производство служить трону."
 JAP_r56rp_mitsubishi_imperial_patent_offices:0 "Имперские патентные ведомства"
 JAP_r56rp_mitsubishi_imperial_patent_offices_desc:0 "Инженеры, банкиры и военно-морские планировщики будут собраны под императорскими патентными ведомствами, чтобы превратить исследования zaibatsu в государственную власть."
 JAP_r56rp_mitsubishi_throne_arsenal:0 "Арсенал Трона"
 JAP_r56rp_mitsubishi_throne_arsenal_desc:0 "Трон Мицубиси станет арсеналом империи, связав верфи, заводы и капитал в одну промышленную корону."
 JAP_r56rp_hohenzollern_military_mission:0 "Военная миссия Гогенцоллерна"
 JAP_r56rp_hohenzollern_military_mission_desc:0 "Император Гогенцоллернов открывает двери немецким военным советникам, стандартам бурения и опыту персонала для восстановленной империи."
 JAP_r56rp_hohenzollern_industrial_links:0 "Немецкие промышленные связи"
 JAP_r56rp_hohenzollern_industrial_links_desc:0 "Династические связи с Германией могут быть превращены в промышленные контракты и опыт перевооружения для нового режима Японии."
 JAP_r56rp_hohenzollern_staff_colleges:0 "Колледжи персонала Hohenzollern"
 JAP_r56rp_hohenzollern_staff_colleges_desc:0 "Колледжи в немецком стиле преобразуют офицерский корпус в дисциплинированную планирующую касту, лояльную новой династии."
 JAP_r56rp_hohenzollern_armaments_exchange:0 "Обмен вооружениями"
 JAP_r56rp_hohenzollern_armaments_exchange_desc:0 "Военные связи полезны только в том случае, если они достигают заводского этажа. Новый суд будет торговать доступом и престижем для оружия, техники и технических советников."
 JAP_r56rp_hohenzollern_imperial_general_staff:0 "Императорский генеральный штаб"
 JAP_r56rp_hohenzollern_imperial_general_staff_desc:0 "Восстановленная империя соединит японскую решимость с немецкой кадровой дисциплиной, создав армию, построенную для решающих кампаний."
 JAP_r56rp_windsor_naval_mission:0 "Виндзорская военно-морская миссия"
 JAP_r56rp_windsor_naval_mission_desc:0 "Император Виндзора дает Йонаю возможность изучать британское военно-морское управление, не подчиняя Японию иностранному командованию."
 JAP_r56rp_windsor_commonwealth_channels:0 "Каналы Содружества"
 JAP_r56rp_windsor_commonwealth_channels_desc:0 "Тщательные дипломатические каналы через старый имперский мир могут смягчить изоляцию Японии и укрепить ее военно-морские институты."
 JAP_r56rp_windsor_admiralty_standards:0 "Адмиралтейские стандарты"
 JAP_r56rp_windsor_admiralty_standards_desc:0 "Виндзорский суд будет импортировать привычки профессионального адмиралтейства: стандарты наводки, доктрину крейсера и тщательное военно-морское управление."
 JAP_r56rp_windsor_pacific_convoys:0 "Тихоокеанские конвои"
 JAP_r56rp_windsor_pacific_convoys_desc:0 "Японская империя будет жить или погибнет на морских путях. Виндзорское поселение дает Йонай язык и методы управления конвоем."
 JAP_r56rp_windsor_constitutional_court:0 "Конституционный суд"
 JAP_r56rp_windsor_constitutional_court_desc:0 "Новая монархия может успокоить старые фракции, вынося решения через процедуры, советы и суд, которые обещают порядок без тотального военного правления."
 JAP_r56rp_romanov_white_emigre_guard:0 "Белая эмигрантская гвардия"
 JAP_r56rp_romanov_white_emigre_guard_desc:0 "Легитимность Романова привлекает антикоммунистических эмигрантов и офицеров, стремящихся служить возрожденному имперскому делу в Азии."
 JAP_r56rp_romanov_anti_bolshevik_crusade:0 "Антибольшевистский крестовый поход"
 JAP_r56rp_romanov_anti_bolshevik_crusade_desc:0 "Романовский суд представит военно-морское государство как восточный щит против большевизма и революционного беспорядка."
 JAP_r56rp_romanov_transamur_host:0 "Транс-Амурский Хост"
 JAP_r56rp_romanov_transamur_host_desc:0 "Изгнанные офицеры и пограничники будут организованы в жесткий северный кадровый состав, лояльный восстановленному делу Романовых."
 JAP_r56rp_romanov_orthodox_patronage:0 "Православный патронаж"
 JAP_r56rp_romanov_orthodox_patronage_desc:0 "Романовский суд будет покровительствовать своим эмигрантским общинам, превращая сети изгнанников в столп легитимности и внутренней дисциплины."
 JAP_r56rp_romanov_northern_mandate:0 "Северный мандат"
 JAP_r56rp_romanov_northern_mandate_desc:0 "Судьба династии указывает на север. Япония будет готовиться как восточный меч против большевистской власти."
 JAP_r56rp_declare_the_grand_regency:0 "Объявить Великое Регентство"
 JAP_r56rp_declare_the_grand_regency_desc:0 "Йонай не будет играть на другом троне. Он будет править как Великий Регент и сам сохранит военно-морской порядок."
 JAP_r56rp_yonai_permanent_mandate:0 "Постоянный мандат Йонаи"
 JAP_r56rp_yonai_permanent_mandate_desc:0 "Регентство не является временным. Мандат Йонаи будет вписан в новый порядок как основа военно-морского государства."
 JAP_r56rp_yonai_emergency_naval_cabinet:0 "Экстренный военно-морской кабинет"
 JAP_r56rp_yonai_emergency_naval_cabinet_desc:0 "Постоянному регентству нужен постоянный кабинет. Йонай будет править через адмиралов, администраторов и лояльных гражданских лиц, связанных с военно-морским порядком."
 JAP_r56rp_yonai_regency_security_bureau:0 "Бюро по безопасности регентства"
 JAP_r56rp_yonai_regency_security_bureau_desc:0 "Регентство не может полагаться только на церемонию. Новое бюро безопасности будет наблюдать за группировками, которые когда-то разорвали Японию на части."
 JAP_r56rp_yonai_admiralty_state:0 "Адмиралтейское государство"
 JAP_r56rp_yonai_admiralty_state_desc:0 "Ни императора, ни истца, ни чужого дома. Япония будет управляться непосредственно Адмиралтейством и Великим Регентом, который спас ее."
 JAP_r56rp_hohenzollern_ties:0 "Военные связи Гогенцоллерна"
 JAP_r56rp_hohenzollern_ties_desc:0 "Новый суд Гогенцоллерна направляет немецкую дисциплину, советников и производство оружия в восстановленную империю Йонаи."
 JAP_r56rp_windsor_ties:0 "Виндзорские военно-морские связи"
 JAP_r56rp_windsor_ties_desc:0 "Виндзорское поселение укрепляет военно-морской истеблишмент Японии за счет иностранного престижа и профессиональных морских каналов."
 JAP_r56rp_romanov_ties:0 "Романов Реставрационистские узы"
 JAP_r56rp_romanov_ties_desc:0 "Поселение Романовых придает военно-морскому государству воинственную антикоммунистическую идентичность и кадры сторонников реставрации."
 JAP_r56rp_mitsubishi_ties:0 "Mitsubishi Imperial Ties"
 JAP_r56rp_mitsubishi_ties_desc:0 "Поселение Мицубиси связывает внутреннюю легитимность, промышленное богатство и военно-морскую мощь в один имперский договор."
 JAP_r56rp_grand_regency:0 "Великое регентство"
 JAP_r56rp_grand_regency_desc:0 "Йонай правит без монарха, представляя своё постоянное регентство как единственную силу, способную удержать Японию единой."
 JAP_r56rp_prussian_staff_mission:0 "Прусская штабная миссия"
 JAP_r56rp_prussian_staff_mission_desc:0 "Немецкие офицеры были приглашены для изменения кадровой культуры Японии. Их учения обостряют армию, но новые стандарты замедляют учебный конвейер."
 JAP_r56rp_german_armaments_lobby:0 "Немецкое военное лобби"
 JAP_r56rp_german_armaments_lobby_desc:0 "Промышленники, связанные с судом Гогенцоллерна, ускоряют заключение контрактов на поставку оружия, требуя при этом привилегированного доступа к госзакупкам."
 JAP_r56rp_admiralty_standards_idea:0 "Адмиралтейские стандарты"
 JAP_r56rp_admiralty_standards_idea_desc:0 "Поселение Виндзор толкает британское военно-морское управление в японский флот, улучшая работу конвоя и планирование верфи."
 JAP_r56rp_windsor_constitutional_court_idea:0 "Конституционный суд"
 JAP_r56rp_windsor_constitutional_court_idea_desc:0 "Виндзорский суд обещает закон и процедуру непосредственного военного командования, повышая легитимность, одновременно сдерживая призывы к агрессивной войне."
 JAP_r56rp_white_emigre_guard_idea:0 "Белая эмигрантская гвардия"
 JAP_r56rp_white_emigre_guard_idea_desc:0 "Романовские ссыльные образуют жесткую антикоммунистическую гвардию восстановленного двора. Их рвение помогает мобилизации, но многие японские политики не доверяют иностранным реставраторам."
 JAP_r56rp_orthodox_patronage_idea:0 "Православный патронаж"
 JAP_r56rp_orthodox_patronage_idea_desc:0 "Романовский суд финансирует православные общины и эмигрантские сети, чтобы построить лояльность против социализма, приобретая влияние ценой внутреннего беспокойства."
 JAP_r56rp_keiretsu_armament_boards_idea:0 "Советы по вооружению Keiretsu"
 JAP_r56rp_keiretsu_armament_boards_idea_desc:0 "Трон Мицубиси координирует большие промышленные дома с помощью досок вооружения, увеличивая военный выпуск, одновременно предоставляя частным интересам более крупные претензии на государство."
 JAP_r56rp_imperial_patent_offices_idea:0 "Имперские патентные ведомства"
 JAP_r56rp_imperial_patent_offices_idea_desc:0 "Патентные ведомства, поддерживаемые судом, объединяют инженеров, банки и промышленных планировщиков, подталкивая исследования и гражданское строительство к одной имперской программе."
 JAP_r56rp_emergency_naval_cabinet_idea:0 "Экстренный военно-морской кабинет"
 JAP_r56rp_emergency_naval_cabinet_idea_desc:0 "Регентство Йонаи управляет через чрезвычайный кабинет адмиралов и лояльных администраторов, увеличивая темп командования в то время как тревожные гражданские фракции."
 JAP_r56rp_regency_security_bureau_idea:0 "Бюро по безопасности регентства"
 JAP_r56rp_regency_security_bureau_idea_desc:0 "Постоянное бюро безопасности наблюдает за фракциями, которые когда-то развалили Японию на части. Она укрепляет режим, но ее слежка подрывает политическое доверие."
 rt56rp_japan_c_left_faction_tt:0 "Азиатские рабочие союзы"
