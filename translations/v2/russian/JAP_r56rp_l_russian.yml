 JAP_the_forgotten_realms:0 "Забытые миры"
 JAP_the_forgotten_realms_desc:0 "Несмотря на выход из Лиги Наций, мы по-прежнему сохраняем контроль над мандатом Южных морей и Корейским полуостровом. Для наших тихоокеанских интересов жизненно важно, чтобы все наши колониальные государства были надлежащим образом развиты и чтобы те, кто их населяет, знали свое место в Империи."
 JAP_restrict_natives:0 "Японизация Микронезии"
 JAP_restrict_natives_desc:0 "Для того, чтобы обеспечить интеграцию микронезийских государств в Нихон! Местные верования и культуры должны быть ограничены."
 JAP_develop_korea:0 "Развивать полуостров Чосен"
 JAP_develop_korea_desc:0 "Полуостров Чосен претерпевает изменения, которые принесут пользу нашей могущественной Империи - постепенные инвестиции могут превратить полуостров в надлежащее японское государство."
 JAP_oriental_development_company:0 "Расширение компании Восточного развития"
 JAP_oriental_development_company_desc:0 "За последние несколько лет компания «Восточное развитие» хорошо послужила нам – принося нам богатство, которого многие не могут желать – расширение необходимо для того, чтобы она процветала."
 JAP_island_fortifications:0 "Окончательное укрепление Южного мандата"
 JAP_island_fortifications_desc:0 "Для того, чтобы обеспечить безопасность наших владений на Юге, необходимо построить огромное количество военных баз, укреплений и новых взлетно-посадочных полос, чтобы обеспечить наше господство над этим районом."
 JAP_ease_native_restrictions:0 "Смягчить ограничения на коренных"
 JAP_ease_native_restrictions_desc:0 "Постепенное изменение и продвижение японской культуры может постепенно вытеснить местные традиции и интегрировать микронезийский народ в империю Нихон."
 JAP_push_for_japanese_pacific_states:0 "Транстихоокеанское соглашение"
 JAP_push_for_japanese_pacific_states_desc:0 "Наши тихоокеанские кампании быстро добиваются победы - Возможная оккупация западно-тихоокеанских государств Америки больше не мечта, а возможность! Создание лояльного правительства на оккупированных землях может дать им некоторую легитимность."
 JAP_establish_pacific_states_tt:0 "§OЭтот фокус позволит нам провозгласить японские тихоокеанские государства Америки.§!"
