 JAP_r56rp_expansion_of_zaibatsu_unions:0 "Расширение профсоюзов Zaibatsu"
 JAP_r56rp_expansion_of_zaibatsu_unions_desc:0 "Теперь, когда Зайбацу находится под контролем рабочих, пришло время расширить их влияние и обеспечить профсоюзам достаточную силу, чтобы сохранить свою власть над отраслями. Это позволит нам еще больше интегрировать Зайбацу в социалистическую систему и обеспечить их лояльность государству."
 JAP_r56rp_more_money_for_the_state_Zaibatsu:0 "Больше денег для государства"
 JAP_r56rp_more_money_for_the_state_Zaibatsu_desc:0 "Увеличивая долю государства в прибыли Zaibatsu, мы можем финансировать дальнейшую индустриализацию и социальные программы. Это обеспечит, чтобы богатство, созданное Зайбацу, использовалось на благо народа, а не выкладывалось в карманы нескольких капиталистов."
 JAP_r56rp_kawakami_socialistic_schools:0 "Социалистические школы Каваками"
 JAP_r56rp_kawakami_socialistic_schools_desc:0 "Учение Каваками Хаджиме вдохновило новое поколение социалистических мыслителей. Создавая школы, посвященные его идеям, мы можем гарантировать, что следующее поколение будет полностью привержено принципам социализма и революции."
 JAP_r56rp_the_new_village_initiative:0 "Инициатива Новая деревня"
 JAP_r56rp_the_new_village_initiative_desc:0 "Инициатива «Новая деревня» направлена на модернизацию сельских районов Японии путем создания самодостаточных эгалитарных общин. Инвестируя в инфраструктуру и кооперативное земледелие, мы можем улучшить жизнь сельского пролетариата и интегрировать его в социалистическую систему."
 JAP_r56rp_empowering_the_rural_proletariat:0 "Расширение прав и возможностей сельского пролетариата"
 JAP_r56rp_empowering_the_rural_proletariat_desc:0 "Сельским пролетариатом государство давно пренебрегло. Расширяя их возможности посредством образования, земельной реформы и политического представительства, мы можем гарантировать, что они являются активными участниками социалистической революции."
 JAP_r56rp_the_new_village_hyogi_kai:0 "Новая деревня Hyogi-kai"
 JAP_r56rp_the_new_village_hyogi_kai_desc:0 "Новая деревня Хёги-кай – это совет сельских представителей, которому поручено следить за осуществлением социалистической политики в сельской местности. Предоставляя сельскому пролетариату право голоса в правительстве, мы можем обеспечить удовлетворение его потребностей и его лояльность революции."
 JAP_r56rp_the_hero_of_labor:0 "Герой труда"
 JAP_r56rp_the_hero_of_labor_desc:0 "Награда «Герой труда» вручается работникам, превышающим производственные квоты и демонстрирующим исключительную преданность делу социализма. Признавая их достижения, мы можем вдохновить других работать усерднее и способствовать успеху революции."
