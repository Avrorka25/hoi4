 JAP_r56rp_uncertain_military_direction_idea:0 "Неопределенная цель расширения"
 JAP_r56rp_uncertain_military_direction_idea_desc:0 "Наши военные продолжают спорить о целях расширения. И Хокусин-рон, и Наншин-рон имеют свои достоинства, но до тех пор, пока мы твердо не решим цель расширения, любые попытки закрепить наши усилия будут бесплодными.\n\n§YЭто будет устранено с помощью фокусов или в оборонительной войне против СОВ, КНР или РПЦ.§!"
