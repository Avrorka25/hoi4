 JAP_r56rp_navy_plot_c:0 "Морской заговор Йонаи"
 JAP_r56rp_navy_plot_c_desc:0 "Поскольку коммунистическое правительство не желает вести переговоры, адмирал Йонай и его союзники в военно-морском флоте начали планировать свой шаг по восстановлению порядка в Японии."
 JAP_r56rp_establish_yonai:0 "Установить лидерство Йонаи"
 JAP_r56rp_establish_yonai_desc:0 "Адмирал Йонай выступает в качестве лидера сопротивления коммунистическому правлению, заручившись поддержкой ключевых морских офицеров."
 JAP_r56rp_search_for_new_royal_family:0 "Поиск новой императорской семьи"
 JAP_r56rp_search_for_new_royal_family_desc:0 "С упразднением коммунистами старой монархии мы должны найти нового номинального лидера, чтобы восстановить имперское наследие Японии."
 JAP_r56rp_persaude_millitary_yonai:0 "Убедить военных"
 JAP_r56rp_persaude_millitary_yonai_desc:0 "Йонай стремится завоевать оставшееся военное руководство, убеждая их отказаться от коммунистического дела и поддержать его новое правительство."
 JAP_r56rp_rebirth_of_empire:0 "Возрождение империи"
 JAP_r56rp_rebirth_of_empire_desc:0 "С военной поддержкой, обеспеченной, Йонай объявляет о восстановлении Японской империи под новым руководством."
 JAP_r56rp_eradicate_communist:0 "Искоренить коммунизм"
 JAP_r56rp_eradicate_communist_desc:0 "Настало время отстранить коммунистический режим от власти, чтобы Япония больше никогда не попала под их влияние."
 JAP_r56rp_royal_coronation_navy:0 "Имперское поселение"
 JAP_r56rp_royal_coronation_navy_desc:0 "С устранением коммунистов Йонай должен формализовать созданное им государство либо через нового имперского номинального руководителя, либо через постоянное военно-морское регентство."
 JAP_r56rp_expand_dockyards_navy_c:0 "Расширение Императорских верфей"
 JAP_r56rp_expand_dockyards_navy_c_desc:0 "Более сильный флот необходим для нашего нового правительства. Мы должны инвестировать в расширение наших верфей, чтобы обеспечить будущее Японии."
 JAP_r56rp_navyoffice_in_army:0 "Военно-морские офицеры в армии"
 JAP_r56rp_navyoffice_in_army_desc:0 "Чтобы сохранить контроль над военными, мы разместим доверенных офицеров флота на ключевых армейских позициях."
 JAP_r56rp_strengthen_the_navy:0 "Укрепить Имперский флот"
 JAP_r56rp_strengthen_the_navy_desc:0 "С созданием нашего правительства мы должны обеспечить, чтобы Императорский флот оставался основой нашей власти."
 JAP_r56rp_raid_manchu_ports_navy_c:0 "Рейд Маньчжурских портов"
 JAP_r56rp_raid_manchu_ports_navy_c_desc:0 "Для ослабления каких-либо коммунистических опорных пунктов в регионе мы будем проводить морские набеги на маньчжурские порты."
 JAP_r56rp_navalstate_c:0 "Военно-морское государство Японии"
 JAP_r56rp_navalstate_c_desc:0 "С восстановлением нашей империи под руководством адмирала Йонаи Япония будет процветать как военно-морская сверхдержава, обеспечивая свое господство в Тихом океане."
