 JAP_r56rp_zaibatsu_workers_unions_1:0 "Профсоюзы работников Зайбатсу"
 JAP_r56rp_zaibatsu_workers_unions_1_desc:0 "Зайбацу, японские промышленные гиганты, долгое время были инструментом эксплуатации, контролируемым привилегированной элитой. Под руководством Джотаро Каваками мы разрушим их гнетущую хватку и поместим их под рабочий контроль. Формируя сильные союзы, мы обеспечим, чтобы их богатство приносило пользу людям, а не немногим. Это основа социалистического хозяйства, где рабочие и крестьяне сами формируют свое будущее."
 JAP_r56rp_zaibatsu_workers_unions_2:0 "Профсоюзы работников Зайбатсу"
 JAP_r56rp_zaibatsu_workers_unions_2_desc:0 "Зайбацу, японские промышленные гиганты, долгое время были инструментом эксплуатации, контролируемым привилегированной элитой. Под руководством Джотаро Каваками мы разрушим их гнетущую хватку и поместим их под рабочий контроль. Формируя сильные союзы, мы обеспечим, чтобы их богатство приносило пользу людям, а не немногим. Это основа социалистического хозяйства, где рабочие и крестьяне сами формируют свое будущее."
 JAP_r56rp_zaibatsu_workers_unions_3:0 "Профсоюзы работников Зайбатсу"
 JAP_r56rp_zaibatsu_workers_unions_3_desc:0 "Зайбацу, японские промышленные гиганты, долгое время были инструментом эксплуатации, контролируемым привилегированной элитой. Под руководством Джотаро Каваками мы разрушим их гнетущую хватку и поместим их под рабочий контроль. Формируя сильные союзы, мы обеспечим, чтобы их богатство приносило пользу людям, а не немногим. Это основа социалистического хозяйства, где рабочие и крестьяне сами формируют свое будущее."
 JAP_r56rp_zaibatsu_workers_unions_4:0 "Профсоюзы работников Зайбатсу"
 JAP_r56rp_zaibatsu_workers_unions_4_desc:0 "Зайбацу, японские промышленные гиганты, долгое время были инструментом эксплуатации, контролируемым привилегированной элитой. Под руководством Джотаро Каваками мы разрушим их гнетущую хватку и поместим их под рабочий контроль. Формируя сильные союзы, мы обеспечим, чтобы их богатство приносило пользу людям, а не немногим. Это основа социалистического хозяйства, где рабочие и крестьяне сами формируют свое будущее."
 JAP_r56rp_zaibatsu_broke_civil_war:0 "Пепел промышленности"
 JAP_r56rp_zaibatsu_broke_civil_war_desc:0 "Гражданская война оставила промышленное сердце Японии в руинах. Некогда могучий Зайбацу, столп старого порядка, теперь лежит ослабленным и раздробленным. Их крах привел экономику в замешательство, заводы были заброшены, цепочки поставок разрушены, а миллионы рабочих остались без работы. В этом хаосе мы должны действовать быстро для восстановления. Организовав рабочих и захватив контроль над рушащимся Зайбацу, мы можем заложить основу для новой социалистической экономики, которая будет служить народу, а не прибыли привилегированных немногих."
 JAP_r56rp_zaibatsu_dragon_sleeps:0 "Дракон спит"
 JAP_r56rp_zaibatsu_dragon_sleeps_desc:0 "Зайбацу, когда-то ревущие драконы японской экономики, теперь спят, ослабленные гражданской войной и собственной жадностью. Их крах оставил нацию в беспорядке, но в этот момент тишины мы видим возможность. Под руководством Джотаро Каваками мы приступим к трудной задаче восстановления. Стабилизируя Зайбацу и поместив их под временный государственный надзор, мы можем остановить экономическое свободное падение и заложить основу для новой, социалистической системы. Дракон спит, но он пробуждается под контролем людей."
