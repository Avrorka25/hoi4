 MON_go_on_pilgrimage_to_the_burkhan_khaldun_desc:0 "Бурхан-Халдун — священнейшая гора Монголии, которая также может быть местом упокоения Чингисхана и его преемников. Это место имеет огромное значение для любого монгола, желающего властвовать над всем, что находится под небом."
