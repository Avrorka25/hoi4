 MON_raids_operations_category_desc:0 "Нынешний курс нашего правительства требует занять твёрдую позицию в отношении врагов народа — коррумпированных чиновников ([CHI.getAdjective]) и империалистов ([JAP.getAdjective]). Протяжённые и слабо охраняемые границы нашей страны позволяют нам проникать в некоторые спорные районы и захватывать ценные ресурсы. \n\n§HНебольшие рейды§! можно планировать, §Hтолько если в нашем регионе§!, граничащем с противником, находится §Gне менее 1 дивизии§!, а для начала §Hкрупных рейдов§! требуется §Gне менее 3 дивизий§!!"
