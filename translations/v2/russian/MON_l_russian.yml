 MON_1935_state_visit_to_moscow_category_desc:0 "Активизация [JAP.GetAdjective]их империалистов и их милитаристских марионеток заставила нынешнюю правящую элиту страны во главе с Пэлжидийном Гэндэном обратить внимание на угрозу. В декабре 1935 года он вместе с военным министром Гэлэгдоржийном Дэмидом отправился в Москву, чтобы обсудить возможность [SOV.getAdjective]ой военной и промышленной помощи ввиду неспокойной обстановки на восточной границе нашей обширной страны. \nПереговоры должны начаться в ближайшее время, и возникает вопрос: какие именно темы следует на них обсудить?"
