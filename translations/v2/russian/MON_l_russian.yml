 TAN_tuva_annex_ussr:0 "Советский что?"
 TAN_tuva_annex_ussr_desc:0 "Поздравляем! Вы нашли секретный фокус, предложенный кем-то на сервере RT56 в Discord. Он думал, что его просьбу проигнорировали, но, вопреки всему, его призыв был услышан. Великодушный Вафля внял его молитве и под безлунным небом воплотил желание в реальность. Наслаждайтесь лёгким мировым завоеванием за Туву."
