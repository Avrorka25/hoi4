 Mon_soviet_crew_idea_desc:0 "Несколько генералов и военных теоретиков государства [SOV.getAdjective] оказывают помощь нашему Генеральному штабу."
 MON_changed_script_idea:0 "Изменённая письменность"
 MON_changed_script_idea_desc:0 "Старая монгольская письменность имела несколько различных форм начертания, что серьёзно затрудняло обучение детей. Новые изменения позволяют населению учиться эффективнее."
 MON_script_reform_in_progress_idea:0 "Реформа письменности"
 MON_script_reform_in_progress_idea_desc:0 "В настоящее время предпринимаются огромные усилия по унификации разрозненной системы письменности государства [MON.getNameDef]."
 MON_weak_currency_idea:0 "Слабая валюта"
 MON_weak_currency_idea_desc:0 "Несмотря на введение национальной валюты в 1925 году, тугрик остаётся непопулярным среди широких масс, которые по-прежнему предпочитают китайский юань, советский рубль, американские или мексиканские доллары и множество других малоценных валют, обращающихся на чёрном рынке."
 MON_new_course_policy_idea:0 "Политика нового курса"
 MON_new_course_policy_idea_desc:0 "Бесчеловечная политика коллективизации, проводившаяся государственными властями в начале 1930-х годов, едва не вызвала восстание в западных районах страны. Военные быстро подавили его, а населению пообещали улучшение условий жизни в рамках так называемой политики «нового курса», во многом напоминавшей старую ленинскую НЭП."
 MON_buddhist_opposition:0 "Буддийская оппозиция"
 MON_buddhist_opposition_desc:0 "Религия глубоко укоренилась в монгольском обществе, а различные религиозные учреждения используют свою власть и влияние, чтобы открыто противодействовать государственной политике и директивам Центрального комитета. Значительная доля мужчин в сельской местности посвятила свою жизнь монастырям и не желает участвовать в государственных делах."
 MON_dominated_animal_husbandry_idea:0 "Преобладание животноводства"
 MON_dominated_animal_husbandry_idea_desc:0 "Кочевой образ жизни широко распространён на великих равнинах страны, а призывы к индустриализации пока достигли лишь немногих представителей высших эшелонов власти."
 MON_animal_husbandry_prioritised_idea:0 "Приоритет животноводства"
 MON_animal_husbandry_prioritised_idea_desc:0 "Наше наследие и наши успехи основаны на животноводстве: то, что работало веками, скорее всего, будет работать и в будущем."
 MON_industrial_growth_prioritised_idea:0 "Приоритет промышленного роста"
 MON_industrial_growth_prioritised_idea_desc:0 "Многовековая эксплуатация животных должна уступить место общим усилиям по достижению целей национальной промышленной революции!"
 MON_encourage_trade_idea:0 "Поощрение торговли"
 MON_encourage_trade_idea_desc:0 "Новые торговые соглашения приносят нашему рынку огромную пользу!"
 MON_improved_mining_facilities_idea:0 "Улучшенные горнодобывающие предприятия"
 MON_improved_mining_facilities_idea_desc:0 "Благодаря государственным инвестициям наша добывающая промышленность теперь способна снабжать внутренний рынок большим количеством ресурсов."
 MON_focus_on_south:0 "Сосредоточиться на юге"
 MON_modernizing_transportation_system:0 "Модернизация транспортной системы"
 Mongolbank_very_high_funds:0 "§HМонголбанк — очень большие средства§!"
 Mongolbank_very_high_funds_desc:0 "Надлежащим образом управлять банковской системой сложно, зато экономика стремительно растёт!"
 Mongolbank_high_funds:0 "§HМонголбанк — большие средства§!"
 Mongolbank_high_funds_desc:0 "Управление финансами остаётся непростой задачей, однако промышленность получает от них большую выгоду."
 Mongolbank_moderate_funds:0 "§HМонголбанк — умеренные средства§!"
 Mongolbank_moderate_funds_desc:0 "Сбалансированный подход к управлению промышленностью и её поддержке."
 Mongolbank_low_funds:0 "§HМонголбанк — малые средства§!"
 Mongolbank_low_funds_desc:0 "Нехватка денег и доступных займов сдерживает экономический рост страны."
 Mongolbank_bankrupt:0 "§HМонголбанк — банкрот§!"
 Mongolbank_bankrupt_desc:0 "Банк обанкротился и больше не может выдавать займы. Требуется прямое вмешательство правительства!"
 MON_foreign_tribute_idea:0 "Иностранная дань"
 MON_soviet_NKVD_agents:0 "Агенты НКВД СССР"
 MON_soviet_NKVD_agents_desc:0 "Наследием революции 1924 года стало установление однопартийной системы, во многом зависящей от поддержки и надзора советских гражданских и военных специалистов. Некоторые из них крепко держат в своих руках политику страны."
