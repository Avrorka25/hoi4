 MAN_japanese_assistance_khalkin_gol:0 "Военная помощь государства [JAP.getAdjective]"
 MON_collectivization_phase_1:0 "Коллективизация: этап 1"
 MON_collectivization_phase_1_desc:0 ""
 MON_atheist_propaganda:0 "Атеистическая пропаганда"
 MON_atheist_propaganda_desc:0 ""
 MON_monasteries_assets_raided:0 "Изъятие монастырского имущества"
 MON_monasteries_assets_raided_desc:0 ""
 MON_troika_organized:0 "Организованная «тройка»"
 MON_troika_organized_desc:0 "По примеру сталинских революционных троек мы создали собственную тройку под руководством Чойбалсана, призванную восстановить в государстве закон и порядок."
 MON_political_opposition_organizing:0 "Формирование политической оппозиции"
 MON_political_opposition_organizing_desc:0 "Понимая, что их отстраняют от власти, милитаристы попытаются свергнуть правительство и установить военную диктатуру. Мы должны подготовиться к их удару и создать собственную опору среди населения!"
 MON_civil_militia_idea:0 "Созданное гражданское ополчение"
 MON_banditry_know_how:0 "Опыт бандитизма"
 MON_communist_paradise_achieved:0 "Коммунистический рай достигнут"
 MON_communist_paradise_achieved_desc:0 ""
 MON_first_five_year_plan:0 "Первая пятилетка"
 MON_volunteer_corps:0 "Добровольческий корпус государства [ROOT.getAdjective]"
 MON_powerful_choibalsan:0 "Влиятельный Чойбалсан"
 MON_powerful_choibalsan_desc:0 "Чойбалсан был одним из семи человек, участвовавших в переговорах с Китаем и Россией о независимости Монголии в 1921 году. Теперь он и его сторонники широко представлены в правительстве."
 MON_ministery_of_interior_reorganized:0 "Реорганизованное Министерство внутренних дел"
 MON_ministery_of_interior_reorganized_desc:0 "Следуя шагам НКВД, нашей стране удалось кардинально улучшить показатели Татнуулхим фенхий Газар (Генеральное разведывательное управление Монголии)."
 MON_consolidated_power_1:0 "Власть сосредоточена в одной сфере"
 MON_consolidated_power_1_desc:0 "Одна из областей власти теперь крепко находится в руках единственного лидера — Чойбалсана, действующего за спиной Анандына Амара."
 MON_consolidated_power_2:0 "Власть сосредоточена в большинстве сфер"
 MON_consolidated_power_2_desc:0 "Чойбалсан установил контроль над многими важными сферами и теперь распространяет свою власть на государство [MON.getNameDef]."
 MON_consolidated_power_3:0 "Полностью сосредоточенная власть"
 MON_consolidated_power_3_desc:0 "Теперь Чойбалсан полностью контролирует государство [MON.getNameDef]."
 Mon_intellectuals_purged:0 "Чистка интеллигенции"
 Mon_intellectuals_purged_desc:0 "Несколько представителей интеллигенции были признаны «неблагонадёжными» и подвергнуты чистке."
 Mon_party_purged:0 "Чистка партии"
 Mon_party_purged_desc:0 "Перестановки и аресты нанесли тяжёлый урон нынешней партийной структуре."
 Mon_lamas_purged:0 "Чистка лам"
 Mon_lamas_purged_desc:0 "Из-за недавних правительственных чисток многие представители религиозных учреждений бежали из страны или были вынуждены скрываться."
 MON_border_patrols_recruitment:0 "Набор в пограничные патрули"
 MON_border_patrols_recruitment_desc:0 "Безопасность сухопутных границ получила наивысший приоритет. Для сохранения нашего государства нам нужны все доступные средства и каждый человек!"
