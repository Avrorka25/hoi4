 ROOT_is_in_central_asia_tt:0 "Находится в Центральной Азии"
 MON_peljidiin_genden_desc:0 "Родившийся на рубеже веков в бедной семье скотовода, Гэндэн рано вступил в Монгольскую народно-революционную партию и благодаря своей простой и открытой манере речи сумел заручиться поддержкой многих старших партийных деятелей. После Народной революции 1924 года молодого пролетария назначили председателем Малого хурала, что открыло ему путь в высшие эшелоны власти. \n\nПоддержка советских чиновников позволила ему после VII съезда партии в 1928 году стать одним из трёх государственных секретарей. Совет начал проводить жёсткую коллективизацию и антибуддийскую политику, что привело к открытым восстаниям по всей стране. Пережить ответную чистку ему помогли преданность делу и непосредственное покровительство Иосифа Сталина в 1932 году. \n\nОднако эти отношения продлились недолго: из-за поддержки религии и грубых манер Гэндэна к началу 1935 года многие советские чиновники стали считать его «ненадёжным союзником»..."
