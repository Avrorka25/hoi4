 MON_rise_of_anarcho_communism:0 "Подъём анархо-коммунизма"
 MON_anarchist_worker_discipline:0 "Анархическая трудовая дисциплина"
 MON_anarchist_ambitions:0 "Анархо-коммунистические амбиции"
 MON_questioned_popular_support:0 "Сомнительная народная поддержка"
 MON_japanese_administrative_assistance_lar:0 "«Административная» помощь государства [JAP.getAdjective]"
 MON_anti_soviet_stance:0 "Позиция против государства [SOV.getAdjective]"
 MON_organize_army_inspection:0 "Организовать инспекцию армии"
 MON_organize_army_inspection_desc:0 "Несмотря на огромный оборонный бюджет, наша армия остаётся в крайне плачевном состоянии из-за нехватки современного снаряжения, опоры на устаревшую тактику и сильной политизации военнослужащих. Если мы хотим вступить в современную эпоху, необходимо начать её улучшение всеми доступными средствами."
 MON_mobilize_the_reserves:0 "Мобилизовать резервы"
 MON_mobilize_the_reserves_desc:0 "Предыдущие пробные приказы о мобилизации оказались крайне неэффективными: на призывные пункты явилось лишь 2000 человек вместо запланированных 20 000. У нас есть резервисты, способные сражаться, однако в мирное время такой призыв будет крайне непопулярен."
 MON_field_hospital_initiative:0 "Инициатива полевых госпиталей"
 MON_field_hospital_initiative_desc:0 "Дорогостоящая война легла тяжёлым бременем на плечи матерей и отцов наших солдат: не только тех, кто не вернулся с поля боя, но и тех, кто был ранен и не получил надлежащей помощи. Мы создадим полевые госпитали, способные сохранить жизни бойцов для следующего дня и следующего сражения."
 MON_desperate_measures:0 "Отчаянные меры"
 MON_desperate_measures_desc:0 "Отчаянные времена требуют отчаянных мер, и нам нужен каждый способный сражаться новобранец ради победы Родины! Будет профинансирована масштабная призывная кампания, чтобы восполнить недостающие ряды наших вооружённых сил."
 MON_demids_legacy:0 "Наследие Демида"
 MON_demids_legacy_desc:0 "Гэлэгдоржийн Демид давно выступал за моторизацию и механизацию вооружённых сил, полагая, что кавалерия утратила полезность в качестве основной фронтовой силы и больше подходит для задач снабжения в суровых природных условиях. Мы последуем его примеру и завершим начатую реформу."
 MON_improve_coordination_capabilities:0 "Улучшить возможности координации"
 MON_improve_coordination_capabilities_desc:0 "Связь между различными боевыми полками приобретает всё большее значение на крупных полях сражений, где командиры не могут координировать действия визуально или через посыльных. Для успешной модернизации необходимо широко внедрить радиосвязь."
 MON_lessons_from_1934_rebellion:0 "Уроки восстания 1934 года"
 MON_lessons_from_1934_rebellion_desc:0 "Дело Лхумбэ и последовавшие в том же году крестьянские восстания показали, что гражданское ополчение и бандитские отряды плохо противостоят бронетехнике, особенно быстроходным противопехотным автомобилям и грузовикам. Такие машины также можно использовать для разведки."
 MON_foundation_for_special_task_battalion:0 "Основа батальона особого назначения"
 MON_foundation_for_special_task_battalion_desc:0 "При ограниченных людских ресурсах мы не можем позволить себе оснащать и содержать большую армию, однако нельзя игнорировать необходимость защищать наши интересы во внутренних и внешних делах. Офицерский корпус уже разработал планы создания элитного полка особого назначения государства [ROOT.getAdjective], и теперь требуется лишь официальное одобрение политиков."
 MON_mountainous_specialization:0 "Специализация на горной местности"
 MON_mountainous_specialization_desc:0 "Горы тянутся с северо-запада на юго-восток, а на севере страны расположено множество хребтов, поэтому вполне естественно создать для спецназа несколько лагерей и учебных полигонов в скалистых районах, сделав горную местность главным направлением подготовки нашей элиты."
 MON_gobi_training_facilities:0 "Учебные объекты в Гоби"
 MON_gobi_training_facilities_desc:0 "Вся наша южная граница покрыта дюнами пустыни Гоби. Суровые и враждебные условия идеально подходят для тренировок в экстремальной среде, которые планируется начать в ближайшем будущем. Не менее важно готовить командиров, способных действовать в таких условиях."
 MON_equipment_recovery_teams:0 "Группы эвакуации снаряжения"
 MON_equipment_recovery_teams_desc:0 "Доклады спецназа показывают, что во время учений значительное количество снаряжения полностью выходит из строя или теряется из-за особенностей местности, где расположены лагеря. Мы не можем изменить окружающую погоду, но можем подготовить специальные команды, способные возвращать большую часть повреждённого оборудования и тем самым сокращать возможные потери."
 MON_expand_the_general_staff:0 "Расширить Генеральный штаб"
 MON_expand_the_general_staff_desc:0 "В нашем Генеральном штабе служат весьма способные и опытные люди, однако ему не хватает надлежащего финансирования и крупномасштабной организации, доступной более крупным странам. Пока что стоит расширить штаб в соответствии с современными стандартами. Эта инициатива также привлечёт молодых выпускников военных училищ."
 MON_ratify_battleplans:0 "Утвердить оборонительные планы"
 MON_ratify_battleplans_desc:0 "Для того чтобы государство было готово к продолжающейся борьбе военных кампаний, мы создадим специальный отдел, единственной целью которого будет разработка, организация и выполнение боевых планов. Когда война вступает в земли наших соседей, мы можем посылать наблюдателей вперед, чтобы попытаться предсказать возможные маневры противника."
 MON_old_heritage:0 "Старое наследие"
 MON_old_heritage_desc:0 "Кавалерия была, есть и останется ключевым элементом наших вооружённых сил. Как бы далеко ни продвинулись военные доктрины и насколько прозорливыми ни стали стратеги, мы сохраним верность своим корням и останемся повелителями коней."
 MON_soldier_devotion:0 "Преданность солдат"
 MON_soldier_devotion_desc:0 "Мир меняется. Сухопутные армии теперь состоят главным образом из пехотных соединений, которые менее подвижны, чем кавалерия, но гораздо надёжнее и организованнее. Поддержка этого подхода даст нам преимущество на поле боя."
 MON_legacy_of_tachanka:0 "Наследие тачанки"
 MON_legacy_of_tachanka_desc:0 "Человеческая изобретательность во время Гражданской войны в России не знала границ: запряжённая лошадьми повозка с пулемётом могла преодолевать большие расстояния, обеспечивая огромную огневую мощь и относительный комфорт. Именно на такой основе должны строиться наши армии!"
 MON_support_old_officers_corps:0 "Поддержать старый офицерский корпус"
 MON_support_old_officers_corps_desc:0 "Многие наши офицеры — опытные командиры, сражавшиеся за независимость страны и пользующиеся популярностью среди населения. Поддержка и укрепление их положения в армии обеспечат нам умелых генералов и преданных солдат. Некоторые из них стары и консервативны, но так ли это важно?"
 MON_favour_young_officers:0 "Любимые молодые офицеры"
 MON_favour_young_officers_desc:0 "Мир меняется, а вместе с ним меняются военная тактика и стратегия. Новое поколение командиров возвращается на Родину из иностранных военных академий. Возможно, они привезут с собой нечто новое?"
 MON_revive_forgotten_doctrines:0 "Возродить забытые доктрины"
 MON_revive_forgotten_doctrines_desc:0 "В начале XX века наша страна храбро сражалась за независимость против империалистических держав, и это нельзя назвать иначе как партизанской войной. Ополченцы и небольшие пехотные отряды защищали дома и сердца нашего народа. Мы продолжим их наследие, приняв на вооружение этот невероятно эффективный вид войны."
 MON_bolster_national_awareness:0 "Укрепить национальное самосознание"
 MON_bolster_national_awareness_desc:0 "Какую бы войну мы ни вели, мы сражаемся ради славы и процветания своей нации. Каждый гражданин должен быть готов пойти на небольшую жертву ради этой цели, тем самым укрепляя наши военные усилия!"
 MON_expand_universal_military_act:0 "Расширить закон о всеобщей воинской повинности"
 MON_expand_universal_military_act_desc:0 "Закон о всеобщей воинской повинности накладывает строгие ограничения на возраст и пол призывников. Смягчив некоторые нормы и требования в бюрократических документах, мы сможем призывать более широкие слои населения, не нанося серьёзного ущерба работе государственного аппарата."
 MON_improve_militia_formations:0 "Улучшить формирования ополчения"
 MON_improve_militia_formations_desc:0 "Местное ополчение сможет сражаться эффективнее, если передать его под командование местных руководителей, лучше знающих возможности подчинённых им мужчин и женщин."
 MON_ideological_loyalty_of_the_masses:0 "Идеологическая преданность масс"
 MON_ideological_loyalty_of_the_masses_desc:0 "Народ должен знать, за что он сражается и что поставлено на карту. Немного пропаганды из каждого уголка страны определённо никому не повредит."
 MON_good_old_new_ways:0 "Старые добрые новые методы"
 MON_good_old_new_ways_desc:0 "Централизация командования, управления и стратегии армии вокруг широкого использования ополчения дала нам ценный опыт, который можно успешно применить и в регулярных воинских формированиях."
 MON_rely_on_soviet_tactics:0 "Положиться на тактику государства [SOV.getAdjective]"
 MON_rely_on_soviet_tactics_desc:0 "Советники государства [SOV.getAdjective] выступают за принятие военной доктрины «глубокой операции», основанной на подавлении и дезорганизации противника сразу на нескольких участках поля боя с последующим использованием тактического успеха для окружения и уничтожения вражеских соединений. Она весьма эффективна при наличии большого числа войск."
 MON_weapon_prototype_development:0 "Разработка прототипов оружия"
 MON_weapon_prototype_development_desc:0 "Постоянные пограничные столкновения с различными силами, проникающими через нашу оборону, дали нам несколько важных уроков. Один из них — вопиющая неэффективность однозарядного оружия, которым массово оснащены наши войска. Следует обратиться к благодетелям и попытаться получить чертежи современного вооружения."
 MON_mass_firearm_production:0 "Массовое производство стрелкового оружия"
 MON_mass_firearm_production_desc:0 "Большая ударная сила без огнестрельного оружия бесполезна в любой оборонительной или наступательной операции, независимо от боевого духа и идеологической обработки. Государство обязано обеспечить необходимое — возможно, не всему народу, но хотя бы солдатам."
 MON_focus_on_infantry:0 "Сосредоточиться на пехоте"
 MON_focus_on_infantry_desc:0 "Пехота была и останется ключевым элементом любой сухопутной армии, независимо от доктрины, политического режима или идеологической программы. Мы укрепим эту основу всеми необходимыми средствами."
 MON_the_inevitable_counterblow:0 "Неизбежный ответный удар"
 MON_the_inevitable_counterblow_desc:0 "Каким бы успешным ни было наступление, за ним всегда последует контратака противника, если его силы не будут полностью уничтожены первой волной. Этот урок дорого нам обошёлся, но его должен помнить каждый солдат!"
 MON_suitable_high_command:0 "Подходящее высшее командование"
 MON_suitable_high_command_desc:0 "Солдат — лишь исполнитель приказов высшего командования. Если командир неопытен или не способен руководить вверенным ему подразделением, его следует либо снять с должности, либо должным образом обучить и дать шанс исправиться. Выбор всегда за нами..."
 MON_the_grand_stratagem:0 "Великая стратагема"
 MON_the_grand_stratagem_desc:0 "«Победа любит подготовку», — сказал однажды мудрец. Следовательно, для решительной и окончательной победы нам нужна продуманная стратегия, способная превзойти планы лучших стратегов известного мира!"
 MON_favour_stronghold_defenses:0 "Любимая крепость обороны"
 MON_favour_stronghold_defenses_desc:0 "Каждый батальон любой дивизии должен превратиться в неподвижную крепость, способную долго выдерживать натиск противника до получения приказа о контратаке из штаба. Тогда крепость начнёт движение по полю боя..."
 MON_advanced_fortification_studies:0 "Углублённое изучение фортификации"
 MON_advanced_fortification_studies_desc:0 "Наши инженеры могут пройти дополнительную подготовку, чтобы быстрее ремонтировать старые и строить новые укрепления. Эти знания пригодятся при подготовке оборонительных позиций для наших войск."
 MON_support_tactical_decision_freedom:0 "Поддержать свободу тактических решений"
 MON_support_tactical_decision_freedom_desc:0 "Стратегическое расположение противника и быстрые контратаки по нашим слабым точкам указывают, что некоторые приказы штаба могут перехватываться врагом. Ограниченная свобода действий для местных командиров отдельных батальонов повысит долгосрочную эффективность наших войск."
 MON_optimize_infantry_formations:0 "Оптимизировать пехотные формирования"
 MON_optimize_infantry_formations_desc:0 "Максимальный потенциал сухопутных сил можно раскрыть, если местные командиры получат надлежащие инструкции по построению и применению переданных им войск. Такие рекомендации позволят ядру нашей армии действовать эффективнее."
 MON_unified_operational_command:0 "Единое оперативное командование"
 MON_unified_operational_command_desc:0 "Последние доклады показывают, что высшее командование отдало нескольким частям вооружённых сил ряд противоречивых и нелогичных приказов, снизив их возможную эффективность. Объединение и упорядочивание командования устранят подобные ошибки."
 MON_adopt_tsogs_methods:0 "Принять методы Цога"
 MON_adopt_tsogs_methods_desc:0 "Буточийн Цог, недавно окончивший Сумское артиллерийское училище, внёс свежую струю в старую добрую тактику нашего Генерального штаба, позволив сосредоточиться на полном использовании потенциала артиллерийских подразделений."
 MON_investigate_improvement_opportunities:0 "Возможности улучшения артиллерии"
 MON_investigate_improvement_opportunities_desc:0 "Многие образцы нашего вооружения восходят ещё к Синьхайской революции и провозглашению независимости в 1911 году. Мы можем получить от благодетелей новые конструкции и внедрить их на своих предприятиях."
 MON_feature_compact_mortar_designs:0 "Внедрить компактные конструкции миномётов"
 MON_feature_compact_mortar_designs_desc:0 "Миномёты являются ключевым элементом нашей огневой мощи на поле боя, и они должны быть доступны каждому, кому необходимы. Для этого потребуется необратимо изменить часть заводского оборудования..."
 MON_strengthen_air_land_links:0 "Укрепить взаимодействие авиации и сухопутных войск"
 MON_strengthen_air_land_links_desc:0 "Нашим артиллеристам нужны координаты целей, которые могут предоставить воздушные или наземные разведывательные группы. Первые быстрее и манёвреннее, а вторые способны добывать более точные сведения, не подвергая себя обнаружению. Следует укрепить сотрудничество между ними!"
 MON_combined_arms_operations:0 "Общевойсковые операции"
 MON_combined_arms_operations_desc:0 "Только совместный удар с воздуха, моря и суши способен нанести противнику наибольший ущерб. Пока наши орлы парят над их головами, наши тигры нанесут удар с близкого расстояния, вселяя страх в их умы и души!"
 MON_the_ultimate_weapon:0 "Абсолютное оружие"
 MON_the_ultimate_weapon_desc:0 "Оружие огромной разрушительной силы, несомненно, впечатляет, но добротно изготовленное артиллерийское орудие в руках хорошо обученного солдата способно выполнить задачу быстрее и с большей выгодой для нас. Укрепим эту основу, сделав подобное вооружение предметом особого почёта!"
 MON_experimental_mobility:0 "Экспериментальная мобильность"
 MON_experimental_mobility_desc:0 "В военных учебных центрах Запада появилась совершенно новая доктрина, предусматривающая применение высокомобильной техники для быстрого перемещения войск и стремительных боёв на вражеской территории. Реализовать её в крупных масштабах трудно, но какой потенциал она открывает для ограниченной ударной группы!"
 MON_study_motorized_equipment:0 "Изучить моторизованную технику"
 MON_study_motorized_equipment_desc:0 "В сотрудничестве с СССР было основано акционерное общество «Монголтранс», целью которого было обеспечение транспортных потребностей людей и товаров, расширение дорог и предоставление транспортных средств для военного использования. Применяя последние для хорошего использования, мы можем издать указ и захватить некоторые транспортные средства в нашу пользу."
 MON_specialization_on_vehicle_production:0 "Специализация на производстве транспорта"
 MON_specialization_on_vehicle_production_desc:0 "Мы можем дополнительно диверсифицировать промышленность и применить надлежащие методы для модернизации и улучшения предприятий, выпускающих военный и гражданский транспорт."
 MON_acquire_foreign_tank_designs:0 "Получить иностранные проекты танков"
 MON_acquire_foreign_tank_designs_desc:0 "Сотрудничество с иностранными державами уже принесло плодотворные результаты, обеспечив нас современным стрелковым оружием, артиллерийскими орудиями, промышленными инструментами и электрическим оборудованием. Эту основу можно укрепить и, возможно, использовать для создания новых танковых проектов государства [ROOT.getAdjective]."
 MON_utilize_new_designs_strength:0 "Использовать преимущества новых проектов"
 MON_utilize_new_designs_strength_desc:0 "При столь ограниченной промышленности мы не можем массово производить множество типов бронетехники. Однако можно специализировать предприятия на выпуске машин особого назначения ценой ухудшения показателей в других областях. "
 MON_train_specialized_crews:0 "Подготовить специализированные экипажи"
 MON_train_specialized_crews_desc:0 "Нельзя набирать танковый экипаж из случайных солдат, которые погубят ценную машину и собственные ещё более ценные жизни. Нам нужны подходящие люди на подходящих местах, действительно понимающие, что они делают."
 MON_establish_the_trade_fleet:0 "Создать торговый флот"
 MON_establish_the_trade_fleet_desc:0 "Будучи веками лишённой выхода к морю страной, мы забыли многие принципы международной морской торговли и её организации. При умеренных вложениях можно приобрести несколько устаревших гражданских судов для торговли и снабжения. Для начала этого будет достаточно."
 MON_lease_foreign_dockyards:0 "Арендовать иностранные верфи"
 MON_lease_foreign_dockyards_desc:0 "Ограниченные возможности нашей промышленности не позволяют дополнительно распылять силы на строительство полноценных судостроительных предприятий. Однако мы можем и должны сотрудничать с иностранцами и использовать их мощности в своих интересах."
 MON_joint_naval_academy:0 "Объединённая военно-морская академия"
 MON_joint_naval_academy_desc:0 "Следующим логичным шагом совместного военно-морского партнёрства станет создание академии, где наши молодые моряки смогут перенять опыт иностранных морских волков."
 MON_naval_integration:0 "Интеграция военно-морских сил"
 MON_naval_integration_desc:0 "Нам удалось подчинить другую морскую державу и превратить её в послушное марионеточное государство, выполняющее приказы из Улан-Батора. Это означает, что её флот при желании можно использовать в составе наших вооружённых сил. Однако за такое сотрудничество придётся предоставить ей больше автономии в других областях."
 MON_ensure_branches_independence:0 "Обеспечить самостоятельность рода войск"
 MON_ensure_branches_independence_desc:0 "Мы не можем полагаться на иностранцев при создании военно-морской промышленности, ведь многие из них стремятся лишь использовать неопытных моряков и капитанов государства [ROOT.getAdjective]! Отныне этот род войск будет самостоятельным и получит государственные инвестиции!"
 MON_local_specialists:0 "Местные специалисты"
 MON_local_specialists_desc:0 "Нам многому предстоит научиться на зарубежном опыте, и некоторые молодые адмиралы готовы поделиться знаниями с нашими моряками, предоставив ценный опыт, который пригодится в будущем."
 MON_fund_mongolian_naval_forces:0 "Финансировать военно-морские силы государства [ROOT.getAdjective]"
 MON_fund_mongolian_naval_forces_desc:0 "Одна из главных проблем стран без выхода к морю — полное отсутствие опыта мореплавания и недостаток инвестиций. Необходимо выделить государственные средства, чтобы исправить это тяжёлое положение."
 MON_maritime_infantry:0 "Морская пехота государства [MON.getAdjective]"
 MON_maritime_infantry_desc:0 "Несколько преданных мужчин и женщин могут сыграть решающую роль при форсировании рек или морских высадках, если мы решимся на подобные операции. На озере Увс можно создать тайный учебный лагерь для их подготовки."
 MON_improve_naval_doctrines:0 "Улучшить военно-морские доктрины"
 MON_improve_naval_doctrines_desc:0 "Иностранные державы постоянно модернизируют и совершенствуют тактику морской войны, и мы не должны пренебрегать новейшими приёмами, ведь они могут оказаться жизненно важными в морском сражении!"
 MON_amphibious_effort:0 "Развитие десантных сил"
 MON_amphibious_effort_desc:0 "Память о неудачных вторжениях 1274 и 1281 годов всё ещё живёт в сердцах многих граждан, не забывших несправедливость судьбы по отношению к народу государства [ROOT.getAdjective]. Современные методы уже не так зависят от погоды, поэтому стоит вложиться в их развитие."
 MON_prioritize_small_vessels:0 "Отдать приоритет малым кораблям"
 MON_prioritize_small_vessels_desc:0 "Идея построить большой флот может привлекать националистов и патриотов, но у нас нет необходимых возможностей и промышленной базы. Сначала лучше сосредоточиться на малых судах, а уже затем переходить к проектированию крупных кораблей."
 MON_support_the_mechants:0 "Поддержать торговцев"
 MON_support_the_mechants_desc:0 "Нашим торговцам нужна надёжная защита от назойливых подводных лодок, охотящихся на плохо защищённые суда. Некоторые проекты уже имеются на верфях, но их можно дополнительно улучшить в наших интересах."
 MON_modernize_escort_tactics:0 "Модернизировать тактику сопровождения"
 MON_modernize_escort_tactics_desc:0 "Завершив разработку доктрины обороны конвоев, мы сможем ещё сильнее повысить безопасность морских путей и обеспечить бесперебойное движение товаров и ресурсов."
 MON_sea_raiders:0 "Морские рейдеры"
 MON_sea_raiders_desc:0 "Нам ресурсы не нужны, но они нужны нашим врагам. Их суда бороздят моря, даже не задумываясь о возможных последствиях. Наши морские рейдеры преподадут им несколько уроков самоуверенности."
 MON_emphasise_naval_blockades:0 "Сделать упор на морскую блокаду"
 MON_emphasise_naval_blockades_desc:0 "Противник по-прежнему считает, что эсминцы и лёгкие крейсеры способны защитить морские поставки. Их глубинные бомбы эффективны, но несколько новых конструкций торпед помогут переломить ход сражения."
 MON_large_ships_effort:0 "Развитие крупных кораблей"
 MON_large_ships_effort_desc:0 "В XIII веке флот нашей страны был одним из крупнейших в мире: большие корабли бороздили Жёлтое море и наводили ужас на всех вокруг. Пора вспомнить былую славу и вложиться в крупные флотилии, способные впечатлить морские державы!"
 MON_establish_provisional_airforce:0 "Создать временные военно-воздушные силы"
 MON_establish_provisional_airforce_desc:0 "В стране не хватает подготовленных военнослужащих, способных выполнять задачи в воздухе. Учитывая растущую роль авиации в перевозках и разведке, необходимо заложить основу официальных военно-воздушных сил Монголии."
 MON_situational_aerial_presence:0 "Ситуативное воздушное присутствие"
 MON_situational_aerial_presence_desc:0 "Невозможно содержать крупный воздушный флот, способный вести боевые действия над огромным воздушным пространством страны. Предпочтительной тактикой станет создание множества небольших авиабаз по всей территории, где ограниченное число эскадрилий сможет эффективно обеспечивать безопасность неба над Монголией."
 MON_focus_on_local_engagements:0 "Сосредоточиться на локальных боях"
 MON_focus_on_local_engagements_desc:0 "Вместимость созданных авиабаз ограничена, а длина их взлётных полос подходит прежде всего для лёгких самолётов. Поэтому наши усилия по разработке новой авиации следует сосредоточить на более лёгких моделях и вариантах."
 MON_institute_air_landing_batallions:0 "Создать воздушно-десантные батальоны"
 MON_institute_air_landing_batallions_desc:0 "Недавно созданные силы специального назначения получат значительное преимущество, если мы сформируем элитный парашютно-десантный полк, способный проводить воздушные высадки в экстремальных и враждебных условиях."
 MON_foreign_air_equipment_coordination:0 "Координация иностранной авиационной техники"
 MON_foreign_air_equipment_coordination_desc:0 "Национальные исследовательские группы могут многому научиться у зарубежных коллег, особенно в авиации, где нам сильно не хватает практического опыта. Расширение некоторых договоров о сотрудничестве даст нам множество новых решений для совершенствования конструкций самолётов."
 MON_improve_air_doctrine:0 "Улучшить воздушную доктрину"
 MON_improve_air_doctrine_desc:0 "Современные самолёты и опытные пилоты способны выиграть множество боёв, но в долгосрочной перспективе решающую роль играют также современные доктрины воздушной войны. Совершенствование и закрепление этих принципов даст нашим асам преимущество в небе."
 MON_air_recon_and_intelligence_protection:0 "Воздушная разведка и защита разведданных"
 MON_air_recon_and_intelligence_protection_desc:0 "Современная война — это война обмана, в которой сбор, обработка и использование разведывательных данных играют ключевую роль. Поскольку воздушная разведка приобретает всё большее значение для быстрого наблюдения и сбора сведений, мы должны получить преимущество любыми доступными средствами!"
 MON_strengthen_air_navy_cooperation:0 "Укрепить взаимодействие авиации и флота"
 MON_strengthen_air_navy_cooperation_desc:0 "У нас есть множество возможностей наладить взаимодействие между недавно созданными военно-воздушными силами и формирующимся флотом, разработав модели самолётов, способные эффективно наносить удары по военно-морским силам противника."
 MON_capital_operations_focus:0 "Сосредоточиться на операциях у столицы"
 MON_capital_operations_focus_desc:0 "Небольшие мобильные эскадрильи могут оказаться слишком рассредоточенными, чтобы эффективно противостоять превосходящим военно-воздушным силам противника. Поэтому мы создадим единый воздушный кулак, способный наносить массированные удары в выбранном воздушном регионе."
 MON_wastness_devours:0 "Просторы поглощают"
 MON_wastness_devours_desc:0 "Огромные территории нашей страны невозможно эффективно защищать с воздуха одними лёгкими истребителями, дальности которых недостаточно для контроля воздушных зон собственно Монголии. Производители утверждают, что развитие дальних самолётов решит эту проблему и позволит нашей авиации безраздельно господствовать в небе."
 MON_transfer_the_funds_of_mongolbank:0 "Передать средства Монголбанка"
 MON_transfer_the_funds_of_mongolbank_desc:0 "Основанный в 1924 году как акционерное общество инвесторов государств [SOV.getAdjective] и [MON.getAdjective], Монголбанк оставался совместным предприятием с равными долями сторон, призванным развивать национальную экономику, контролировать банковский сектор и финансовые операции, а также управлять золотым запасом страны. Нам следует установить контроль над его средствами, чтобы продолжить развитие собственно Монголии."
 MON_build_the_railroads:0 "Построить железные дороги"
 MON_build_the_railroads_desc:0 "Развитие железнодорожного транспорта открыло новые возможности для быстрой и эффективной перевозки больших объёмов грузов. Часть недавно полученных государственных средств можно направить на создание железнодорожной сети, соединяющей столицу с окраинами страны."
 MON_expand_elementary_schools:0 "Расширить сеть начальных школ"
 MON_expand_elementary_schools_desc:0 "Высокий уровень неграмотности населения вызван естественной нехваткой финансируемых государством начальных школ, где обычные мужчины и женщины могли бы научиться читать, писать и считать — навыкам, которых, к сожалению, лишены многие наши граждане."
 MON_strengthen_tugrik:0 "Укрепить тугрик"
 MON_strengthen_tugrik_desc:0 "Золотой запас страны всё ещё зависит от различных валют, используемых в денежных операциях: российского рубля, монгольского серебряного доллара, китайского юаня, японской иены и американского доллара. Поскольку тугрик привязан к рублю в соотношении один к одному, мы введём ограничения на операции с другими банкнотами, чтобы укрепить роль национальной валюты."
 MON_encourage_foreign_trade:0 "Поощрять внешнюю торговлю"
 MON_encourage_foreign_trade_desc:0 "Причины низкого экономического роста страны восходят к 1924 году, когда государство национализировало имущество инвесторов и ограничило внешнюю торговлю, фактически затормозив развитие иностранного бизнеса ради национальной безопасности. Мы откроем рынки, чтобы побудить часть инвесторов вернуться в Монголию."
 MON_improve_machine_tools:0 "Улучшить станочное оборудование"
 MON_improve_machine_tools_desc:0 "Национальные предприятия не выполняют установленные нормы главным образом из-за низкой эффективности производства, зависимости от ручного труда вместо машинного оборудования и нехватки рабочих рук. Последнюю проблему нельзя решить немедленно, но первые две можно исправить закупкой необходимого оборудования за рубежом."
 MON_study_foreign_radio_equipment:0 "Изучить иностранное радиооборудование"
 MON_study_foreign_radio_equipment_desc:0 "К настоящему времени нет мощностей, способных производить современное радио- и электронное оборудование. Только мудро учиться у наших соседей и видеть, как можно улучшить ситуацию в этом вопросе."
 MON_pastures_into_farms:0 "Превратить пастбища в фермы"
 MON_pastures_into_farms_desc:0 "Опора на сельское хозяйство до сих пор хорошо нам служила, и нет острой необходимости развивать сложные новые промышленные методы, которые лишь нарушат естественный ход развития страны. Однако часть земель можно модернизировать и превратить в полноценные хозяйства, способные производить больше товаров для населения."
 MON_end_reliance_on_animal_husbandry:0 "Покончить с зависимостью от животноводства"
 MON_end_reliance_on_animal_husbandry_desc:0 "Вся экономическая система страны безнадёжно устарела и по-прежнему опирается на обширные сельскохозяйственные земли, используемые неэффективно и присвоенные теми, кто первым сумел их захватить. Хотя такое решение наверняка будет крайне непопулярным, мы должны создать надлежащую промышленную основу государства."
 MON_support_arats:0 "Поддержать аратов"
 MON_support_arats_desc:0 "Эта многообещающая социальная группа скотоводов представлена во всех частях страны и снабжает население различными продуктами сельского хозяйства. Араты являются одним из ключевых элементов нашего хозяйства и должны получить несколько привилегий, подчёркивающих их значение для государственных чиновников."
 MON_expand_woolwashing_facilities:0 "Расширить предприятия по промывке шерсти"
 MON_expand_woolwashing_facilities_desc:0 "Шерсть является главным ресурсом, который араты поставляют на местный рынок, поэтому предприятия, способные её обрабатывать, должны получать надлежащее финансирование и расширяться вместе с растущей промышленностью."
 MON_build_energokombinat:0 "Построить энергокомбинат"
 MON_build_energokombinat_desc:0 "Поскольку электричество приходит во всё большее число городов и посёлков государства [ROOT.getAdjective], всё чаще возникает вопрос о постоянном и стабильном снабжении населения. Нельзя допустить, чтобы столь важная отрасль оставалась в руках иностранцев: её должны создать и обслуживать местные жители."
 MON_build_mechanical_factory:0 "Построить механический завод"
 MON_build_mechanical_factory_desc:0 "Многие новейшие сельскохозяйственные инструменты и машины требуют сменных деталей, которые обычно дороги, труднодоступны и с задержками доставляются на местные предприятия. Недавняя инициатива позволила собрать среди активных граждан средства на создание такого завода неподалёку от Улан-Батора."
 MON_industrial_expansion:0 "Расширение промышленности"
 MON_industrial_expansion_desc:0 "После успешного развития промышленности мы можем поощрить население присоединяться к рабочим инициативам, направленным на повышение качества выпускаемых товаров и эффективности труда на предприятиях."
 MON_new_veterinary_facilities:0 "Новые ветеринарные учреждения"
 MON_new_veterinary_facilities_desc:0 "Болезни и эпидемии способны внезапно поразить уязвимый скот неподготовленных хозяйств. Риск заражения и возможный ущерб можно сократить, если создать ветеринарные учреждения по всей стране и регулярно проводить финансируемые государством проверки."
 MON_ulan_bator_promcombinat:0 "Улан-Баторский промкомбинат"
 MON_ulan_bator_promcombinat_desc:0 "Превращение Улан-Батора в промышленный центр является жизненно важным шагом национального экономического развития. Здесь должно появиться крупнейшее предприятие по выпуску гражданских товаров, способное обеспечить работой тысячи безработных граждан."
 MON_improve_mining_facilities:0 "Улучшить горнодобывающие предприятия"
 MON_improve_mining_facilities_desc:0 "Угольные шахты Адуунчулуун и Хушуут считаются одними из крупнейших в стране и снабжают наши станки и прессы углём и железом, служа государству и народу. Часть государственных средств можно направить в этот сектор, чтобы повысить промышленную отдачу перспективных районов."
 MON_armament_expansion:0 "Расширение производства вооружений"
 MON_armament_expansion_desc:0 "Промышленное развитие страны до сих пор было сосредоточено главным образом на гражданских товарах, тогда как военные нужды оставались в стороне. Это недопустимо, ведь мужчины и женщины в форме служат интересам государства и защищают его стабильность. Ради общего блага следует создать несколько предприятий по производству вооружений."
 MON_southern_development_focus:0 "Сосредоточиться на развитии юга"
 MON_southern_development_focus_desc:0 "Пустыня Гоби известна суровыми и переменчивыми погодными условиями. Жителям этих районов необходим надёжный доступ к воде, газу и электричеству. Новая государственная программа обеспечит необходимую помощь тем, кто в ней нуждается."
 MON_southwest_resource_prospection_area:0 "Разведка ресурсов на юго-западе"
 MON_southwest_resource_prospection_area_desc:0 "Юго-западные районы перешли под наш контроль и, судя по всему, богаты природными ресурсами. Мы можем разработать несколько планов по разведке полезных ископаемых и сырья."
 MON_encourage_southern_agriculture:0 "Поощрять сельское хозяйство на юге"
 MON_encourage_southern_agriculture_desc:0 "Бывшие территории клики Ма считались отсталыми провинциями, лишёнными какого-либо потенциала для имперских, а затем и республиканских инвесторов. Наш опыт борьбы с наступлением пустыни на пастбища позволит создать несколько озеленённых зон и заложить основу новых сельскохозяйственных земель."
 MON_expand_chahars_processing_region:0 "Расширить перерабатывающий район Чахара"
 MON_expand_chahars_processing_region_desc:0 "Земли Внутренней Монголии можно широко использовать для животноводства, включая переработку шерсти и мяса. На месте следует построить предприятия по промывке шерсти и бойни, чтобы обеспечить работой многих жителей региона."
 MON_ordos_plateau_exploitation:0 "Освоение Ордосского плато"
 MON_ordos_plateau_exploitation_desc:0 "Эта территория получит значительные государственные вложения, которые позволят местным производителям расширить предприятия в рамках нового этапа экономического развития перспективного региона."
 MON_utilize_available_spaces:0 "Использовать доступные площади"
 MON_utilize_available_spaces_desc:0 "Новые программы индустриализации освободили место для множества предприятий, создание которых увеличит экономическую мощь нашего процветающего государства!"
 MON_new_research_centres:0 "Создать новые исследовательские центры"
 MON_new_research_centres_desc:0 "Рост и развитие промышленности открыли уникальную возможность создать научную сеть, объединяющую различные исследовательские и конструкторские учреждения, производителей инструментов и материалов, разработчиков электроники, молодых учёных и специалистов военно-промышленного комплекса, работающих на благо народа государства [ROOT.getAdjective]!"
 MON_modernize_transportation_system:0 "Модернизировать транспортную систему"
 MON_modernize_transportation_system_desc:0 "Для многих людей с кочевым укладом дороги не имели особого значения, поэтому прежние правительства и режимы никогда не уделяли внимания созданию централизованной транспортной сети между аймаками, худонами и различными городами. По мере роста государства эта задача нависает над правителем, словно дамоклов меч..."
 MON_assist_subsidized_region:0 "Помочь дотационным регионам"
 MON_assist_subsidized_region_desc:0 "Тувинская автономная область сильно зависит от дотаций из-за низкого уровня индустриализации, нехватки земель для массового скотоводства и недостаточного государственного финансирования. Даже небольшие вложения в регион откроют несколько возможностей для строительства промышленных предприятий."
 MON_develop_mongolia_proper:0 "Развивать собственно Монголию"
 MON_develop_mongolia_proper_desc:0 "Ни один регион не должен быть забыт в ходе этих преобразований, и собственно Монголия — сердце нашего государства — также получит пользу от программ. Создание промышленности в различных скотоводческих районах повысит поддержку нашего дела среди местного населения."
 MON_improve_baigaal_dalai_industries:0 "Улучшить промышленность Байгал-Далая"
 MON_improve_baigaal_dalai_industries_desc:0 "Бурятия известна развитой промышленностью Иркутска, Читы и Улан-Удэ, широкой транспортной сетью и многочисленными лесозаготовительными предприятиями. Всё это можно дополнительно улучшить с помощью целевых государственных вложений."
 MON_develop_the_rear:0 "Развивать тыл"
 MON_develop_the_rear_desc:0 "Многие восточные провинции не получают надлежащего финансирования, хотя обладают большим экономическим потенциалом. Расширение нашего присутствия и влияния позволит использовать их ресурсы эффективнее."
 MON_military_industries_expansion:0 "Расширение военной промышленности"
 MON_military_industries_expansion_desc:0 "Государственные инвестиции можно направить в военный сектор и обеспечить ранее выбранные регионы средствами на создание военных предприятий, тем самым значительно укрепив наши вооружённые силы."
 MON_hold_plenum_of_central_committee:0 "Провести пленум Центрального комитета"
 MON_hold_plenum_of_central_committee_desc:0 "Итоги конференции ясно показывают, что товарищ [SOV.getLeader] готов защищать государство [MON.getAdjective] в трудные времена и в борьбе за дело революции. Однако глава нашей делегации преследовал личные амбиции, поэтому его необходимо заменить человеком с более «надёжным» видением будущего."
 MON_deal_with_genden:0 "Разобраться с Гэндэном"
 MON_deal_with_genden_desc:0 "Генден по-прежнему пользуется значительной поддержкой, особенно среди бедных и сельских жителей. Его неповиновение нашему [SOV.getAdjective] Нельзя игнорировать. Однако остается вопрос, как следует наказывать за его провокационное поведение?"
 MON_invite_frinovsky:0 "Пригласить Фриновского"
 MON_invite_frinovsky_desc:0 "Михаил Фриновский — известный офицер НКВД государства [SOV.getAdjective], чьи методы организации «троек» показали исключительную эффективность в выявлении врагов революции в СССР и за его пределами. Его помощь нашей революции будет иметь огромное значение для успеха нынешнего режима."
 MON_secure_the_transition_of_power:0 "Обеспечить передачу власти"
 MON_secure_the_transition_of_power_desc:0 "Новому правительству нужны видные члены партии, доказавшие истинную преданность партии и государству [MON.getNameDef]! Этих героев революции следует представить как образец для подражания в новой государственной пропагандистской кампании! "
 MON_prepare_leftist_takeover:0 "Подготовить захват власти левыми"
 MON_prepare_leftist_takeover_desc:0 "Гэндэн и Демид уже устранены, как и их левые предшественники, управлявшие страной в 1933 году, а также представители правой оппозиции, изгнанные ещё в 1928 году. На горизонте новая чистка, и мы должны сделать всё, чтобы не допустить появления очередного диктатора!"
 MON_learn_from_lkhumbe_affair:0 "Извлечь уроки из дела Лхумбэ"
 MON_learn_from_lkhumbe_affair_desc:0 "Провал восстания 1934 года, известного как дело Лхумбэ, был вызван главным образом ограниченным доступом повстанцев к оружию и боеприпасам, тогда как правительственные силы располагали большим количеством винтовок, миномётов, бронемашин и даже несколькими самолётами. Создание подпольных мастерских значительно поможет оппозиции в случае вооружённого восстания."
 MON_partial_religious_compromise:0 "Частичный религиозный компромисс"
 MON_partial_religious_compromise_desc:0 "Буддийская церковь имеет множество сторонников по всей стране. Прежний режим пока не трогал её, а мы предложим компромисс, чтобы заручиться общественной поддержкой смены правительства. На некоторое время монастыри могут стать ценным союзником."
 MON_arm_civil_militia:0 "Вооружить гражданское ополчение"
 MON_arm_civil_militia_desc:0 "Огромные территории страны требуют создания самостоятельных полков, способных удерживать позиции до прибытия регулярных войск и вместе с ними отражать нападение. Выдав оружие населению, мы обеспечим поддержку взрослых мужчин, готовых умереть за наше дело."
 MON_invite_political_exiles:0 "Пригласить политических изгнанников"
 MON_invite_political_exiles_desc:0 "В 1933 году государственная политика резко изменилась, после чего многих членов левого крыла партии изгнали, а ещё больше подвергли репрессиям. Нам удалось связаться с оставшимися левыми и предложить им места в правительстве. Их возвращение позволит новому кабинету эффективно управлять страной после успешного захвата власти."
 MON_ensure_control_over_the_railways:0 "Установить контроль над железными дорогами"
 MON_ensure_control_over_the_railways_desc:0 "Замаскировав сторонников под членов рабочих бригад и направив их на строительство железнодорожной сети по всей стране, мы сможем установить контроль над стратегическими узкими местами логистики на случай будущей войны и захватывать иностранное оборудование на благо революции."
 MON_contact_the_bandits:0 "Связаться с бандитами"
 MON_contact_the_bandits_desc:0 "В малонаселённых южных районах скрывается угроза пустыни — нерегулярные бандитские формирования, которые трудно обнаружить и ещё труднее уничтожить крупными дивизиями. Обратившись к их главарям, мы сможем усвоить несколько ценных уроков и получить ограниченную помощь людьми и опытом, хотя это вызовет недовольство населения."
 MON_confiscate_soviet_weaponry:0 "Конфисковать вооружение государства [SOV.getAdjective]"
 MON_confiscate_soviet_weaponry_desc:0 "После установления контроля над железными дорогами мы сможем ввести дополнительные проверки и конфисковывать незарегистрированное оборудование, проходящее через них. Разумеется, исключительно ради свободной и честной торговли!"
 MON_seize_the_power:0 "Захватить власть"
 MON_seize_the_power_desc:0 "Войска набраны и вооружены, логистические центры подготовлены, а в правительстве есть преданные сторонники. Пришло время объявить, что новая Монголия восстала из пепла коррумпированных революционеров и отныне начинается новая эпоха!"
 MON_begin_the_collectivization:0 "Начать коллективизацию"
 MON_begin_the_collectivization_desc:0 "После укрепления нового правительства лучше всего вернуться к реформам 1928–1933 годов, в ходе которых выросли экспорт и импорт, а государственный капитал значительно увеличился. Теперь начнётся коллективизация невиданных масштабов."
 MON_seize_our_advantages:0 "Воспользоваться нашими преимуществами"
 MON_seize_our_advantages_desc:0 "Гэндэн пытался задобрить владельцев капитала своей политикой «Обогащайтесь», направленной на обогащение богатых и разорение бедных. Мы больше не станем проводить различия между людьми, ведь все созданы равными, а потому обязаны изъять эти богатства и перераспределить их среди рабочих и крестьян."
 MON_reassure_the_soviets:0 "Убедить государство [SOV.getAdjective] в нашей надёжности"
 MON_reassure_the_soviets_desc:0 "Внутренняя политика республики станет гораздо эффективнее, если мы будем получать указания непосредственно из Москвы, позволяя политикам, дипломатам и разведчикам сосредоточиться на внешних делах. Вполне естественно обратиться к чиновникам государства [SOV.getNameDef] и попросить принять нас обратно в Коминтерн как равноправную республику под властью государства [SOV.getAdjective]. Это временно ограничит наши самостоятельные политические действия, но в долгосрочной перспективе принесёт пользу."
 MON_end_political_opportunism:0 "Покончить с политическим оппортунизмом"
 MON_end_political_opportunism_desc:0 "Слишком долго Монголия была прислужницей иностранной державы! Мы — храбрый и гордый народ, способный постоять за себя и самостоятельно определять свою судьбу в этом мире. Разумеется, оставаясь частью Коминтерна."
 MON_reorganize_state_agenda:0 "Реорганизовать государственную программу"
 MON_reorganize_state_agenda_desc:0 "Как всё переменилось! Те, кто угнетал и вводил в заблуждение простых мужчин и женщин, теперь исчезли или изгнаны из нашей процветающей коммунистической утопии. Но некоторые люди всё ещё могут помнить эти ядовитые идеи и подвергаться внешнему влиянию. Атеистическая пропаганда обеспечит преданность народа и ясность его мыслей."
 MON_make_use_of_monastery_assets:0 "Использовать имущество монастырей"
 MON_make_use_of_monastery_assets_desc:0 "После нападения на буддийскую церковь монастыри стоят пустыми или лежат в руинах. Учитывая это, [MON.getLeader] издаёт особый указ о национализации оставшегося имущества религиозных учреждений, обеспечивая правительство средствами для работы мирной и военной машины."
 MON_example_of_communist_paradise:0 "Образец коммунистического рая"
 MON_example_of_communist_paradise_desc:0 "Политический и экономический ландшафт нашей страны изменился навсегда. [MON.getLeader] Он захватил власть. При нашей верности принципам марксизма-ленинизма мы можем провозгласить основание другой Советской республики в Средней Азии, чтобы еще больше сосредоточить на нас завистливые взгляды наших соседей!"
 MON_thinking_out_of_bounds:0 "Мыслить вне рамок"
 MON_thinking_out_of_bounds_desc:0 "Хотя внутренняя и внешняя политика государства управляется из Москвы, у власти остаются амбициозные и творческие люди, обладающие влиянием и многочисленными связями по всей Центральной равнине Китая. Грамотное использование нашей программы позволит нам, советскому государству-сателлиту, обеспечить преданность Китая Народной революции без вмешательства государства [SOV.getAdjective]."
 MON_means_of_propaganda:0 "Средства пропаганды"
 MON_means_of_propaganda_desc:0 "Государственную программу можно распространять множеством способов, и один из них — широкое применение пропаганды. Её эффективность возрастёт, если мы построим учреждения, способные целенаправленно готовить и обучать персонал для этой работы."
 MON_destabilize_the_central_plain:0 "Дестабилизировать Центральную равнину"
 MON_destabilize_the_central_plain_desc:0 "Центральные районы Китая десятилетиями становились ареной крестьянских восстаний — против прислужников империалистов, коррумпированных чиновников Гоминьдана или репрессивных администраций местных военачальников. Все они терпели поражение по одной простой причине: из-за плохой организации и слабого планирования. С помощью государства [MON.getAdjective] они не падут!"
 MON_fruits_of_revolution:0 "Плоды революции"
 MON_fruits_of_revolution_desc:0 "Семена революции созрели и превратились в плоды, готовые к сбору. Поскольку Центральная равнина охвачена пламенем крестьянских восстаний, вполне логично помочь новому коммунистическому режиму всеми доступными средствами — даже если для этого придётся принудительно сделать его нашим союзником."
 MON_industrial_relocation:0 "Перемещение промышленности"
 MON_industrial_relocation_desc:0 "Захватчик вторгся и угрожает Родине государства [SOV.getAdjective]! Уже поступают сообщения о переносе промышленности из Украины, Белоруссии и Прибалтики в центральные районы России и на Урал. Но что, если враг доберётся до Урала и поставит под угрозу перемещённые предприятия наших братьев? Мы обратимся к государству [SOV.getAdjective] и предложим перенести их ещё дальше на восток."
 MON_new_comintern_beacon:0 "Новый маяк Коминтерна"
 MON_new_comintern_beacon_desc:0 "Очевидно, что положение изменилось и теперь именно мы способны защитить государство [SOV.getNameDef] от врага. Поскольку государство [SOV.getAdjective] рушится, мы должны взять бразды правления Третьим интернационалом и отныне принять на себя роль защитника революции!"
 MON_one_union_government:0 "Единое союзное правительство"
 MON_one_union_government_desc:0 "Мир меняется. Кто теперь способен противостоять армиям государств [ROOT.getNameDef] и [SOV.getNameDef]? Противостоять мощи [ROOT.getLeader] и [SOV.getLeader], а также союзу двух государств. Вместе, мой друг [SOV.getLeader], мы поведём этот мир к Революции."
 MON_struggle_for_communal_liberation:0 "Борьба за общественное освобождение"
 MON_struggle_for_communal_liberation_desc:0 "В отличие от наших советских братьев, мы призовём все народы нового Союза бороться с захватчиками и любыми доступными средствами отражать наступление врага!"
 MON_appoint_soviet_protege:0 "Назначить ставленника государства [SOV.getAdjective]"
 MON_appoint_soviet_protege_desc:0 "Один из старейших и наиболее надёжных революционеров, Хорлогийн Чойбалсан, рассматривается в Москве как нынешний преемник руководства государства [MON.getNameDef]. Он уже занимает посты министра внутренних дел, министра экономики и главнокомандующего армией. Предоставление ему ещё большей власти наверняка не вызовет никаких проблем в будущем."
 MON_deal_with_religious_centre:0 "Разобраться с религиозным центром"
 MON_deal_with_religious_centre_desc:0 "Комиссии-тройки раскрыли Антиреволюционный буддийский центр, состоящий из лам монастырей по всей стране. Неясно, каковы были их планы, однако некоторые участники пытались заручиться поддержкой чиновников государства [JAP.getAdjective], а значит, они угрожают внутренней стабильности и должны быть лишены власти, если она у них вообще есть."
 MON_reorganize_homeland_security:0 "Реорганизовать внутреннюю безопасность"
 MON_reorganize_homeland_security_desc:0 "Зависимость от помощи государства [SOV.getAdjective] в контрразведке и шпионаже означает, что мы ограничены предоставляемыми ими материалами. Создание Бюро внутренней безопасности сведёт к минимуму риск проникновения и обеспечит наших агентов самой актуальной информацией."
 MON_the_great_terror:0 "Большой террор"
 MON_the_great_terror_desc:0 "Как и в государстве [SOV.getNameDef], наше правительство переполнено коррумпированными чиновниками неизвестного происхождения, властолюбивыми разрушительными революционерами и правыми ревизионистами. Мы должны сделать необходимое, и ради общего блага эти элементы следует искоренить."
 MON_new_generation_of_intelligentsia:0 "Новое поколение интеллигенции"
 MON_new_generation_of_intelligentsia_desc:0 "Новые времена требуют новых людей, и у нас немало молодых граждан, способных вести интеллектуальную и идеологическую борьбу. Их образование и преданность были выкованы в лучших университетах государства [SOV.getNameDef], и они будут незаменимы при заполнении пустоты, возникшей после недавних событий."
 MON_new_party_elite:0 "Сформировать новую партийную элиту"
 MON_new_party_elite_desc:0 "Государственному аппарату нужны люди, готовые замарать руки ради общего блага. Некоторые местные командиры и чиновники продемонстрировали исключительную преданность Чойбалсану и должны получить повышение."
 MON_remove_nominal_leadership:0 "Устранить номинальное руководство"
 MON_remove_nominal_leadership_desc:0 "Как бы ни любил народ Амара, он превратился в опасного лидера, способного разрушить всё, что Чойбалсан уже создал и ещё задумал для государства [MON.getAdjective]. Ради внутренней стабильности и безопасности правительства с ним необходимо немедленно разобраться."
 MON_true_hero_for_the_people:0 "Истинный народный герой"
 MON_true_hero_for_the_people_desc:0 "Единственная преданность принципам марксизма-ленинизма и полное отсутствие противодействия его правлению указывают на то, насколько любимы и популярны его взгляды. [MON.getLeader] Стало! Сейчас это еще яснее, так как ходят слухи о его тактическом гении в борьбе против него. [JAP.getAdjective] Агрессоры распространились среди населения. Слава нашему великому [MON.getLeader]!"
 MON_first_five_year_plan_focus:0 "Первая пятилетка"
 MON_first_five_year_plan_focus_desc:0 "Политика нового курса во всех отношениях является опасным и устаревшим средством посеять смуту в умах народа. Мы последуем примеру государства [SOV.getAdjective] и учредим собственную первую пятилетку, чтобы удовлетворить потребности населения."
 MON_changing_times:0 "Времена меняются"
 MON_changing_times_desc:0 "Старое руководство, похоже, всё ещё способно управлять страной, однако по мере ухудшения его физического и умственного состояния удерживать власть и эффективно руководить государством становится всё труднее. Возможно, пришло время выдвинуть новых людей на высшие партийные должности?"
 MON_join_the_big_brother:0 "Присоединиться к старшему брату"
 MON_join_the_big_brother_desc:0 "Возможно, наше государство уже выполнило своё предназначение, ведь цель Комитета наконец достигнута. Осознание этого молодыми коммунистами привело к тому, что теперь мы можем официально попросить о союзе с нашими великими друзьями и благодетелями — государством [SOV.getNameDef]."
 MON_support_the_red_army_focus:0 "Поддержать Красную армию"
 MON_support_the_red_army_focus_desc:0 "У государства [SOV.getNameDef] и Революции много врагов за рубежом. Мы обязаны поддержать наших братьев и сестёр в борьбе за победу Революции. Хотя мы не способны выставить огромные армии, как наши друзья, всё же можем оказать промышленную и гуманитарную помощь, снабжая союзников лошадьми, продовольствием, шерстью и мясом."
 MON_vessels_of_the_future_war:0 "Машины будущей войны"
 MON_vessels_of_the_future_war_desc:0 "Эффективность бронетехники на поле боя показывает, что в будущем она будет иметь огромное значение, если не станет главной силой. Хотя у нас нет возможностей самостоятельно создавать танковые дивизии, мы можем собрать средства для оснащения одной такой дивизии. Дорого, но оно того стоит."
 MON_aerial_support_initiative:0 "Инициатива воздушной поддержки"
 MON_aerial_support_initiative_desc:0 "Инициатива, утверждённая Центральным комитетом, предполагает, что народ государства [MON.getAdjective] соберёт средства на закупку и оснащение авиационной эскадрильи современными прототипами истребителей. Ещё одно крупное вложение ради победы рабочих."
 MON_improve_transportation_network:0 "Улучшить железнодорожную сеть"
 MON_improve_transportation_network_desc:0 "Наши усилия по поддержке государства [SOV.getNameDef] встретят ещё меньше препятствий, если будет создана надлежащая транспортная сеть между Улан-Батором и Транссибирской магистралью. Также планируется приобрести несколько старых поездов, чтобы на нашей стороне железной дороги не возникало нехватки техники."
 MON_reject_choibalsan_advances:0 "Отвергнуть притязания Чойбалсана"
 MON_reject_choibalsan_advances_desc:0 "Чойбалсан — оппортунистичный и властолюбивый угнетатель, стремящийся лишь захватить власть и использовать её в личных интересах. Пока у власти находится Амар, влияние Чойбалсана в различных сферах жизни страны можно постепенно сокращать, пока от него прежнего ничего не останется."
 MON_separate_army_and_politics:0 "Разделить армию и политику"
 MON_separate_army_and_politics_desc:0 "Социалистическая структура армии во многом опирается на идеологическую обработку личного состава, из-за чего политики оказывают сильное влияние на военных и наоборот. Такая система мешает государству нормально функционировать и должным образом реагировать на попытки переворота."
 MON_local_command_structure:0 "Местная система командования"
 MON_local_command_structure_desc:0 "Для эффективного ведения боя Генеральному штабу необязательно непосредственно присутствовать на поле сражения. Местных командиров можно назначать в отдельные дивизии и даже батальоны, значительно повышая эффективность сухопутных войск."
 MON_decrease_defense_budget:0 "Сократить оборонный бюджет"
 MON_decrease_defense_budget_desc:0 "Чиновники государства [SOV.getAdjective] постоянно давят на наше правительство, требуя увеличить расходы на оборону, несмотря на нехватку самого необходимого у населения. В последние годы они достигли поразительных 40%, подорвав устойчивость тугрика и ещё сильнее снизив его рыночную стоимость."
 MON_finalize_army_reform:0 "Завершить военную реформу"
 MON_finalize_army_reform_desc:0 "Проведённые реформы, направленные на улучшение положения в армии, по всей видимости, действуют как задумано. Теперь, когда военнослужащие сосредоточены на исполнении долга перед Родиной, общее состояние наших вооружённых сил значительно улучшилось."
 MON_tolerate_religious_groups:0 "Проявить терпимость к религиозным группам"
 MON_tolerate_religious_groups_desc:0 "Всего несколько лет назад буддийская церковь тяжело пострадала от так называемых «прогрессивных» левых реформ, направленных на отрыв людей от религии и подчинение их сознания новой политической программе. Эти меры лишь разрушили национальную специфику буддизма государства [MON.getAdjective], и нынешнее правительство готово признать ошибки прошлого, предложив религиозный компромисс."
 MON_establish_socialist_society:0 "Создать социалистическое общество"
 MON_establish_socialist_society_desc:0 "Революционный режим, подобный нашему, хрупок и уязвим перед иностранным влиянием. Этот довод вполне справедлив, однако в неверном контексте он открывает путь к эксплуатации и злоупотреблениям, чем и пользуются некоторые чиновники. Отстранив таких людей и прекратив целенаправленные нападки на отдельные группы населения, мы сможем сформировать новое, социалистическое правительство."
 MON_workers_focus:0 "Рабочие..."
 MON_workers_focus_desc:0 "Рабочие нашей страны оставались без внимания прежних правительственных режимов. Если подчеркнуть их значение и создать новые предприятия, их вера в законность нашего режима лишь укрепится."
 MON_peasants_focus:0 "...и крестьяне"
 MON_peasants_focus_desc:0 "Коллективизация привела к тому, что многие семьи лишились скота, домов и сбережений. Нынешние чиновники считают это почти государственной изменой, и проблему необходимо решить как можно скорее. Ради блага страны реформы должны быть проведены."
 MON_workers_and_peasants_unite_focus:0 "...объединяйтесь!"
 MON_workers_and_peasants_unite_focus_desc:0 "«Разделённые — падём, объединённые — сильны!» — этот лозунг должен знать каждый мужчина и каждая женщина нашей страны. Сотрудничество рабочих и крестьян принесёт прекрасные результаты, если правильно его организовать. А Амар знает как!"
 MON_a_socialist_republic:0 "Современная социалистическая республика"
 MON_a_socialist_republic_desc:0 "Социалистические реформы в нашем государстве показывают, насколько многое улучшилось со времён правления Гэндэна. Укрепив социалистический курс в Монголии, страна сможет открыть двери иностранцам и принять свою судьбу в современном мире."
 MON_sideline_the_left:0 "Отстранить левых"
 MON_sideline_the_left_desc:0 "Левые и правые в правительстве разделены со времён VII съезда партии 1928 года. Нынешние государственные реформы невозможно безопасно проводить при вмешательстве левых в общественные дела. Более того, некоторые их лидеры открыто выступают против нашего законодательства, поэтому их необходимо отстранить от власти."
 MON_liberalize_trade_policies:0 "Либерализовать торговую политику"
 MON_liberalize_trade_policies_desc:0 "«Левые уклоны» начала 1930-х годов привели к установлению государственной монополии на внешнюю торговлю, особенно с государством [CHI.getAdjective]. Теперь, когда государство укрепилось, мы должны обратиться к миру и открыться ему."
 MON_increase_border_patrols:0 "Увеличить пограничные патрули"
 MON_increase_border_patrols_desc:0 "Наши огромные границы постоянно нарушают бандиты, мятежные отряды ополчения и вражеские агенты. Ради собственной безопасности и нормального развития государства необходимо направить войска к границе."
 MON_affirm_rearmament_program:0 "Подтвердить программу перевооружения"
 MON_affirm_rearmament_program_desc:0 "Напряжённость на Востоке стремительно растёт, а мы по-прежнему сильно зависим от помощи государства [SOV.getAdjective]. Однако так будет не всегда, и мы должны подготовиться к надвигающейся буре."
 MON_tackle_the_eastern_threat:0 "Разобраться с восточной угрозой"
 MON_tackle_the_eastern_threat_desc:0 "Нарушения границы войсками государства [MAN.getAdjective] достигли невиданного уровня, и их невозможно игнорировать! Они утверждают, что граница между Внутренней и Внешней Монголией проходит глубоко по нашим родным землям, ссылаясь на какие-то устаревшие карты, которых мы никогда не видели. Пришло время преподать им урок, и наши друзья из государства [SOV.getAdjective] готовы помочь."
 MON_assist_the_revolutionary_struggle:0 "Помочь революционной борьбе"
 MON_assist_the_revolutionary_struggle_desc:0 "Внутренняя борьба за руководство привела к началу одного из самых разрушительных конфликтов, который, как ожидается, охватит пламенем войны всё государство [SOV.getNameDef]. Будучи одним из сильнейших и надёжнейших членов Коминтерна, мы можем достичь различных дипломатических целей."
 MON_rebuke_1932_mediation_issue:0 "Оспорить решение по спору 1932 года"
 MON_rebuke_1932_mediation_issue_desc:0 "В своём притязании на новые земли государство [TAN.getNameDef] обратилось к СССР в 1932 году и сумело получить стратегические соляные копи горы Дус-Даг, которые по праву являются землями государства [MON.getAdjective]! Пока государство [SOV.getAdjective] занято другими делами, мы можем воспользоваться ситуацией и вернуть территории, некогда принадлежавшие нам."
 MON_ratify_mutual_assistance_treaty:0 "Ратифицировать договор о взаимопомощи"
 MON_ratify_mutual_assistance_treaty_desc:0 "Наш явный союз с государством [SOV.getNameDef] требует лишь нескольких подписей чиновников для официальной ратификации и открытия пути к прочному взаимовыгодному сотрудничеству. Государство [CHI.getNameDefCap] будет недовольно, но какое нам дело?"
 MON_invite_soviet_advisors:0 "Пригласить советников государства [SOV.getAdjective]"
 MON_invite_soviet_advisors_desc:0 "В рамках договора о взаимопомощи войска государства [SOV.getAdjective] теперь могут размещаться в стратегически важных районах нашей страны. Военное сотрудничество можно расширить, пригласив военную миссию государства [SOV.getAdjective] принять участие в развитии армии и помогать нашим командирам на учениях и манёврах."
 MON_approach_soviet_planners:0 "Обратиться к планировщикам государства [SOV.getAdjective]"
 MON_approach_soviet_planners_desc:0 "В рамках экономического сотрудничества в Монголию была приглашена группа планировщиков государства [SOV.getAdjective], призванная содействовать промышленному развитию страны. Из-за сурового климата и низкого уровня урбанизации их внимание переключилось со строительства на передачу нашим специалистам промышленных новшеств государства [SOV.getAdjective]."
 MON_joint_technological_development:0 "Совместное технологическое развитие"
 MON_joint_technological_development_desc:0 "В наших интересах расширить сотрудничество с учёными и техническими специалистами государства [SOV.getAdjective]. Хотя мы почти не можем оказать материальную поддержку со своей стороны, они способны предоставить ценные инструменты для совершенствования исследовательских учреждений."
 MON_intensify_cooperation:0 "Углубить сотрудничество"
 MON_intensify_cooperation_desc:0 "В настоящее время Улан-Батор не способен обеспечить надёжную основу для стабильного производства электронных компонентов в Монголии. Однако с помощью государства [SOV.getAdjective] положение можно изменить, разработать новые методы и детали, а также наладить выпуск вычислительных устройств в нашей стране."
 MON_student_exchange_program:0 "Программа студенческого обмена"
 MON_student_exchange_program_desc:0 "Государство [SOV.getNameDefCap] располагает обширной сетью учебных заведений, способной обучать тысячи молодых людей из различных республик Союза. Мы можем направить лучших студентов по программе обмена, чтобы они учились у наших благодетелей."
 MON_reform_national_script:0 "Реформировать национальную письменность"
 MON_reform_national_script_desc:0 "Нынешняя письменность государства [MON.getAdjective] состоит из множества алфавитов, некоторые из которых используются врагами нашего народа. Под влиянием государства [SOV.getAdjective] и при участии его лингвистов в тесном сотрудничестве с нашими специалистами была разработана новая версия письменности. Она основана на кириллице и значительно поможет в борьбе с неграмотностью населения."
 MON_solidify_language_institutes:0 "Укрепить языковые институты"
 MON_solidify_language_institutes_desc:0 "Зависимость от иностранных алфавитов и систем письма на протяжении последнего столетия делала нашу нацию подвластной различным режимам. После провозглашения независимости предпринимались многочисленные попытки объединить различные разговорные диалекты и используемые письменности в единую систему, служащую народу."
 MON_ulaanbaatar_national_university:0 "Улан-Баторский национальный университет"
 MON_ulaanbaatar_national_university_desc:0 "Несколько месяцев назад правительство приняло постановление о создании «высшего учебного заведения», которое позднее сможет стать основой Национального университета Монголии. При нынешнем финансировании и наличии стремящихся к знаниям студентов его ждёт большой успех!"
 MON_dream_of_greater_mongolia:0 "Мечта о Великой Монголии"
 MON_dream_of_greater_mongolia_desc:0 "Долгие годы мы лелеяли мечту объединить монгольское население под властью одного государства — не колониального сателлита и не отсталой провинции, а страны, которой правят монголы! Пришло время превратить мечту в реальность и начать возвращение утраченных земель!"
 MON_gather_ulaanbaatar_conference:0 "Созвать Улан-Баторскую конференцию"
 MON_gather_ulaanbaatar_conference_desc:0 "Равновесие сил в Центральной и Восточной Азии — тонкий вопрос, находящийся в руках трёх главных участников региона: государств [SOV.getAdjective], [JAP.getAdjective] и [CHI.getAdjective]. Пригласив их встретиться на «нейтральной территории», мы сможем поднять вопрос народа государства [MON.getAdjective] и надеяться на его мирное обсуждение и решение."
 MON_divide_spheres_of_influence:0 "Разделить сферы влияния"
 MON_divide_spheres_of_influence_desc:0 "Великие державы, вероятно, потрясены нашим внезапным и непредсказуемым союзом с КНР, однако время поспешных мыслей и решений прошло. Теперь мы укрепим сотрудничество, разграничив истинно монгольские и китайские территории, разделив сферы влияния и тем самым обеспечив контроль над регионом и защиту взаимных интересов."
 MON_secure_hexi_corridor:0 "Обеспечить безопасность коридора Хэси"
 MON_secure_hexi_corridor_desc:0 "Контроль над этим торговым путём и наиболее надёжным стратегическим проходом в Синьцзян оказался в руках клики Ма, чьё ополчение захватило район во время Северного похода 1926 года. Вместе с новым союзником мы сможем нанести эффективный удар с северного и восточного направлений, растянуть формирования противника по широкому фронту и позволить основным силам без особых трудностей занять спорные территории."
 MON_joint_pilgrimage_to_mount_wutai:0 "Совместное паломничество к горе Утайшань"
 MON_joint_pilgrimage_to_mount_wutai_desc:0 "Одна из четырёх священных гор китайского буддизма сейчас находится под контролем оппортунистичных военачальников, постоянно наживающихся на паломниках, ищущих благословения в местах силы. Вместе с новым союзником мы можем направить несколько отрядов сопровождения, чтобы помогать им в случае бюрократических затруднений."
 MON_secure_the_rear:0 "Обеспечить безопасность тыла"
 MON_secure_the_rear_desc:0 "Руководители Синьцзяна и Восточного Туркестана постоянно меняют ориентацию с прокитайской на просоветскую или профашистскую в зависимости от политической обстановки. Чтобы сосредоточиться на Центральной равнине и не опасаться удара в спину, мы должны немедленно обезопасить этот район."
 MON_reignite_the_civil_war:0 "Возобновить гражданскую войну"
 MON_reignite_the_civil_war_desc:0 "Теперь, когда жизненно важные районы защищены и путь снабжения налажен, можно замахнуться на большее и ударить прямо в сердце прогнившей структуры, мешающей народу принять истинную революцию: Гоминьдан! Пришло время сокрушить этого властолюбивого зверя!"
 MON_the_second_northern_expedition:0 "Второй Северный поход"
 MON_the_second_northern_expedition_desc:0 "Первый Северный поход показал успех центрального правительства в разгроме различных клик военачальников в Фэнтяньском регионе. Поскольку Гоминьдан не сумел уничтожить остатки бандитов и отказался от Севера, мы вступим туда и обеспечим безопасность района во благо новой оси Улан-Батор — Шэньси!"
 MON_a_pragmatic_diplomacy:0 "Прагматичная дипломатия"
 MON_a_pragmatic_diplomacy_desc:0 "Очевидно, что возвращать основные земли и создавать единое государство [MON.getAdjective] нам придётся самостоятельно. Война пока исключена, но, возможно, существует более тонкий подход?"
 MON_disagreements_with_sinkiang:0 "Разногласия с Синьцзяном"
 MON_disagreements_with_sinkiang_desc:0 "Наша южная граница постоянно находится под угрозой со стороны [SIK.getLeader] и его бандитов. Более того, многие этнические монголы из Джунгарии и Дабаньчэна были вынуждены бежать от репрессий местного правительства! Возвращение этих земель и их повторная интеграция станет благородным делом."
 MON_one_mongolia_policy:0 "Политика единой Монголии"
 MON_one_mongolia_policy_desc:0 "Автономный район Внутренняя Монголия всегда казался дипломатам странным образованием. Его автономия под властью государств [MAN.getAdjective] и [CHI.getAdjective], борьба за независимость и союз с Японией ради сохранения статуса явно являются политическим оппортунизмом, порождённым отсутствием права на самоопределение. Этот вопрос можно и нужно решить..."
 MON_gobi_border_realignment:0 "Пересмотр границы в Гоби"
 MON_gobi_border_realignment_desc:0 "Многие южные районы населены этническими монгольскими племенами, стремящимися воссоединиться с собственно Монголией. Эти земли долгое время входили в состав государств [SHX.getNameDef] и [XSM.getNameDef], которые подавляли любые стремления народа к самоопределению, что является прямым оскорблением наших соотечественников. Пора показать самопровозглашённым правителям Центральной равнины вкус песка."
 MON_delegation_to_tuva:0 "Делегация в Туву"
 MON_delegation_to_tuva_desc:0 "С момента формального провозглашения независимости в 1922 году отношения государства [TAN.getNameDef] с нами оставались напряжёнными не только из-за постоянной миграции населения, но и из-за стратегически важной соляной горы Дус-Даг. Общее культурное и историческое наследие можно использовать для дальнейшего сближения и, возможно, создания на этой основе единого государства."
 MON_a_unity_with_buryats:0 "Единство с бурятами"
 MON_a_unity_with_buryats_desc:0 "В 1934 году наши отношения с бурятами сильно изменились, поскольку чиновники государства [SOV.getAdjective] поспешили найти «веские идеологические, культурные и исторические причины» для разделения наших стран и натравливания политиков друг на друга. Но времена изменились, и мы можем создать собственный Бурят-Монгольский союз, призванный воплотить мечту об объединении монгольского населения под одним знаменем."
 MON_incorporate_new_lands:0 "Включить новые земли"
 MON_incorporate_new_lands_desc:0 "Наши амбиции велики, и теперь они близки к полному осуществлению! Пусть весь мир знает, что народ государства [MON.getAdjective] объединится в сильном национальном государстве!"
 MON_rely_on_national_strength:0 "Положиться на национальные силы"
 MON_rely_on_national_strength_desc:0 "Народ должен понимать, что в случае вооружённого конфликта с другим государством мы не сможем полностью рассчитывать на поддержку государства [SOV.getAdjective]. Несколько пропагандистских кампаний и немного патриотического воодушевления способны творить чудеса, если окажутся в правильных руках."
 MON_limited_research_cooperation:0 "Ограниченное научное сотрудничество"
 MON_limited_research_cooperation_desc:0 "Несмотря на все националистические усилия, нельзя отрицать, что нашему государству не хватает необходимого оборудования и специалистов для нормального существования в современную эпоху. Если мы хотим выйти из этого положения сильнее, придётся пойти на некоторые жертвы."
 MON_strengthen_existing_industrial_contracts:0 "Укрепить существующие промышленные контракты"
 MON_strengthen_existing_industrial_contracts_desc:0 "Отказ от части старых соглашений и их обновление на основе взаимовыгодного сотрудничества откроют новые возможности для инвестиций и позволят приобрести современное оборудование для развивающейся промышленности."
 MON_subvert_soviet_control:0 "Подорвать контроль государства [SOV.getAdjective]"
 MON_subvert_soviet_control_desc:0 "Пока мы не можем проводить полностью независимую внешнюю политику из-за риска вмешательства [SOV.getAdjective] или переворота при поддержке [SOV.getAdjective]. Однако несколько подходящих людей на нужных местах способны незаметно изменить ход событий и постепенно снизить нашу зависимость от Большого Красного Брата."
 MON_expel_choibalsan:0 "Изгнать Чойбалсана"
 MON_expel_choibalsan_desc:0 "Сталинские агенты по-прежнему присутствуют во многих сферах правительства, включая элиту страны в лице «великого революционера» Чойбалсана. Его преданность Монголии не вызывает сомнений, однако он мешает народу самостоятельно выбрать свою судьбу. Правые чистки 1928 года и дело Лхумбэ уже показали порочность его методов. Пришло время избавиться от него."
 MON_sabotage_great_khural:0 "Сорвать заседание Великого хурала"
 MON_sabotage_great_khural_desc:0 "Изменение государственной политики требует одобрения Государственного Великого хурала, заседание которого вскоре будет созвано. Хотя поддержка самостоятельной Монголии среди населения постоянно растёт, чиновники могут наложить вето на новое законодательство и вновь занять курс в поддержку государства [SOV.getAdjective]. Но что, если во время заседания произойдёт нападение, совершённое каким-нибудь крайне левым радикалом..."
 MON_faciliate_cooperation_with_china:0 "Содействовать сотрудничеству с Китаем"
 MON_faciliate_cooperation_with_china_desc:0 "Государство [CHI.getNameDef] остаётся одним из наших главных торговых партнёров даже в эти тяжёлые времена, несмотря на идеологические разногласия, разорвавшие наши страны. Без сомнения, раньше его чиновники эксплуатировали нашу страну, но, возможно, пришло время открыть разум и сердце для взаимовыгодного сотрудничества?"
 MON_expand_the_role_of_urga_national_library:0 "Расширить роль Ургинской национальной библиотеки"
 MON_expand_the_role_of_urga_national_library_desc:0 "Основанная в 1921 году Национальная библиотека в нашей столице остаётся главным хранилищем древних и современных знаний, пока почти недоступных простому населению. Открытие дополнительных читальных залов и распространение литературы среди граждан повысят уровень грамотности."
 MON_stabilize_the_country:0 "Стабилизировать страну"
 MON_stabilize_the_country_desc:0 "Разрушительное нападение на Великий хурал оставило глубокие шрамы на нашем обществе. Многие ставят под сомнение законность нынешнего режима и предлагают отдалиться от СССР и его программы. Как бы привлекательно это ни звучало, нам следует сосредоточиться на стабилизации сохранившейся социалистической системы."
 MON_reach_out_to_moscow:0 "Обратиться к Москве"
 MON_reach_out_to_moscow_desc:0 "После всех событий последних дней чиновники государства [SOV.getAdjective], несомненно, сомневаются в нашей преданности общему делу. Следует направить посланника в Москву, заверить их в нашей поддержке и пригласить дипломатов и сотрудников служб безопасности, чтобы продемонстрировать, что государство находится под контролем."
 MON_ensure_mvd_loyalty:0 "Обеспечить преданность МВД"
 MON_ensure_mvd_loyalty_desc:0 "Нам хорошо известно об агентах государства [SOV.getAdjective] в наших рядах, особенно в Министерстве внутренних дел. Получив приказ сверху, они способны нарушить жизнь простых людей. В нашем распоряжении имеются средства, которые при правильном использовании позволят убедить этих людей передать нам ценные сведения..."
 MON_support_the_rebels:0 "Поддержать повстанцев"
 MON_support_the_rebels_desc:0 "В эти неспокойные времена многие народы решили восстать против власти государства [SOV.getAdjective] и провозгласили независимость! Мы присоединимся к их борьбе против угнетателей, стремящихся лишь подчинить народы Центральной Азии и Дальнего Востока! К оружию, братья и сёстры, и пусть наш славный поход на запад никогда не будет забыт!"
 MON_formalize_the_treaty:0 "Официально оформить договор"
 MON_formalize_the_treaty_desc:0 "Один за другим мы легко можем быть побеждены, но вместе мы сильны! Для обеспечения безопасности развивающихся стран лучше всего оформить неофициальный договор о взаимопомощи в официальный альянс!"
 MON_contest_the_insurgents:0 "Выступить против мятежников"
 MON_contest_the_insurgents_desc:0 "Гражданские беспорядки в СССР привели к началу одного из самых разрушительных конфликтов современности! Пока внутренняя борьба за власть ослабляет наших братьев, некоторые оппортунистичные националисты решили воспользоваться моментом и осуществить националистические, а то и откровенно империалистические амбиции. Сохраняя верность Москве, мы можем вернуть ей контроль над частью этих режимов. Разумеется, не бесплатно..."
 MON_form_the_rightist_cabinet:0 "Сформировать правый кабинет"
 MON_form_the_rightist_cabinet_desc:0 "Эпоха так называемого «правого оппортунизма» завершилась в 1928 году очередной волной правительственных чисток, но её наследие живо! Некоторым политикам удалось скрыться от всевидящих глаз НКВД, и теперь их можно пригласить обратно для формирования второго правого кабинета — четвёртой радикальной смены правительства за последние десять лет."
 MON_denounce_politizised_army:0 "Осудить политизированную армию"
 MON_denounce_politizised_army_desc:0 "Коммунистические режимы обычно стремятся установить систему, при которой партия игнорирует военных, а армия непосредственно участвует во влиянии на государственную политику, что неприемлемо, учитывая, что оба вопроса имеют совершенно разный характер! Открыто осуждая такое поведение, мы можем позволить государственному аппарату оставаться независимым и свободным в выборе государственной политики."
 MON_compromise_with_lamas:0 "Достичь компромисса с ламами"
 MON_compromise_with_lamas_desc:0 "Буддизм является неотъемлемой частью общества государства [ROOT.getAdjective] и служит мостом между материальным миром социалистической революции и далёкими абстрактными ценностями высшей силы, управляющей миром. Мы будем уважать их выбор и проследим, чтобы наша программа не вступала с ними в противоречие."
 MON_secularization_of_education:0 "Секуляризировать образование"
 MON_secularization_of_education_desc:0 "Не следует забывать, что, несмотря на лучшие намерения, религиозные учреждения не должны определять государственную образовательную политику. Секуляризация образования станет заметным шагом в проведении социалистического курса без отрыва от реалий современной Монголии."
 MON_repay_old_debths:0 "Выплатить старые долги"
 MON_repay_old_debths_desc:0 "Многие иностранные компании покинули Монголию после революции 1921 года, когда их имущество было национализировано, а долги отменены Народной армией, искавшей средства для установления коммунистического режима и его защиты от внешних угроз. Обратившись к некоторым их представителям и выплатив старые долги, мы сможем заручиться поддержкой нашего дела."
 MON_invite_foreign_investors:0 "Пригласить иностранных инвесторов"
 MON_invite_foreign_investors_desc:0 "После признания ошибок прошлого некоторые инвесторы видят в Монголии развивающуюся страну, способную стать безопасной гаванью в регионе. Следует заверить их, что так будет и впредь, заключив контракты на пять или десять лет."
 MON_prepare_for_the_inevitable:0 "Подготовиться к неизбежному"
 MON_prepare_for_the_inevitable_desc:0 "Несмотря на лучшие намерения, очевидно, что мир в регионе долго не продержится. Мы должны подготовиться к надвигающейся буре, которая охватит Центральную Азию и Дальний Восток."
 MON_frontline_infrastructure:0 "Прифронтовая инфраструктура"
 MON_frontline_infrastructure_desc:0 "Чтобы сражаться на равных с возможными противниками в Сибири, необходимо создать надлежащие логистические центры и базы снабжения вдоль границ! Только так можно обеспечить нашу победу в этих суровых условиях!"
 MON_excessive_military_build_up:0 "Чрезмерное наращивание вооружённых сил"
 MON_excessive_military_build_up_desc:0 "Финансируемая государством программа создания сильной и современной армии потребует огромных средств и ресурсов, но в долгосрочной перспективе принесёт значительные преимущества. Главное — пережить начальный этап вторжения, если оно произойдёт."
 MON_peace_and_prosperity:0 "Мир и процветание"
 MON_peace_and_prosperity_desc:0 "Трудно представить, что в ближайшем будущем наша страна вступит в какой-либо военный конфликт. Сосредоточимся на развитии промышленности и безопасности граждан на рабочих местах!"
 MON_stay_on_guard:0 "Сохранять бдительность"
 MON_stay_on_guard_desc:0 "Империалистические амбиции иностранных держав и революционная борьба давно сотрясают земли многих народов Азии. Нам следует сохранять бдительность, защищать границы со всех сторон и поддерживать объекты полностью укомплектованными и готовыми к возможному бою."
 MON_central_asia_defensive_pact:0 "Центральноазиатский оборонительный пакт"
 MON_central_asia_defensive_pact_desc:0 "В последние годы нам удалось укрепить положение региональной державы, стремящейся защищать граждан своей страны. Теперь пришло время проявить миротворческие амбиции и встать на защиту общих для всех народов Центральной Азии ценностей."
 MON_mengjian_issue:0 "Вопрос Мэнцзяна"
 MON_mengjian_issue_desc:0 "Отколовшееся государство Мэнцзян продолжает существовать, несмотря на отсутствие международного признания! Их представление о независимости также включает Внешнюю Монголию как неотъемлемую часть. Неофициально, конечно, но разве простому народу обязательно знать об этой небольшой нестыковке?"
 MON_intervene_in_sinkiang:0 "Вмешаться в дела Синьцзяна"
 MON_intervene_in_sinkiang_desc:0 "Постоянные пограничные провокации и набеги вражеской кавалерии на аймаки Баян-Улгий, Ховд и Гоби-Алтай показывают, какую угрозу Синьцзян представляет для региона. Его бандитские отряды становятся сильнее с каждым набегом, а наши люди теряют имущество и жизни. Этой угрозе необходимо положить конец."
 MON_expand_the_treaty:0 "Расширить договор"
 MON_expand_the_treaty_desc:0 "Одинокая борьба с угнетением, безусловно, выглядит достойно в глазах народа, однако большие войны невозможно выиграть без внешней помощи. Некоторые соседние страны разделяют наши ценности и принципы, что позволит приобрести жизненно важных идеологических союзников."
 MON_oppose_soviet_colonialism:0 "Выступить против колониализма государства [SOV.getAdjective]"
 MON_oppose_soviet_colonialism_desc:0 "Они называют себя защитниками народов, но на деле являются лишь эксплуататорской колониальной державой прошлого века! Раньше слабость не позволяла нам сказать это вслух, но теперь мы можем открыто осудить руководство государства [SOV.getAdjective] и его империалистические амбиции в Центральной Азии и на Дальнем Востоке! Пусть знают, что мы идём за ними!"
 MON_support_east_siberian_independists:0 "Поддержать сторонников независимости Восточной Сибири"
 MON_support_east_siberian_independists_desc:0 "Во время Гражданской войны в России многие районы Дальнего Востока, включая Зелёную Украину и Дальневосточную республику, выступили на стороне Антанты в борьбе с красным потопом, охватившим бывшую Российскую империю. Там всё ещё немало сторонников нашего дела, которым требуется лишь небольшая поддержка для начала восстания."
 MON_plea_to_the_russian_far_east:0 "Обратиться к российскому Дальнему Востоку"
 MON_plea_to_the_russian_far_east_desc:0 "Дальний Восток является одним из последних приобретений Российской империи, а значит, поддержка русского дела там находится на минимальном уровне, что прекрасно соответствует нашим интересам."
 MON_weaken_soviet_control_over_northwestern_siberia:0 "ослабленный [SOV.getAdjective] Контроль над Сибирью"
 MON_weaken_soviet_control_over_northwestern_siberia_desc:0 "На обширных территориях Сибири почти никогда не ступал русский сапог, поэтому они идеально подходят для наших групп проникновения. Нам нужны лишь время и некоторые ресурсы, чтобы укрепить поддержку в этом районе."
 MON_infiltrate_transural_region:0 "Проникнуть в Зауралье"
 MON_infiltrate_transural_region_desc:0 "Азиатская часть Уральского региона с её огромными просторами и болотистыми ландшафтами никогда особенно не привлекала внимание России, что играет на руку нашим агентам, готовым создать там временные базы."
 MON_expand_influence_into_greater_steppe:0 "Расширить влияние в Великой степи"
 MON_expand_influence_into_greater_steppe_desc:0 "Меньшевики не сумели заручиться поддержкой местного населения Центральной Азии во время гражданской войны. Благодаря общему наследию и географическому положению мы можем установить более тесные связи с народами региона и подготовить сторонников даже в самых отдалённых бывших азиатских советских республиках."
 MON_increase_presence_in_caucasus:0 "Расширить присутствие на Кавказе"
 MON_increase_presence_in_caucasus_desc:0 "Храбрые герои Закавказья на протяжении последних столетий сражались против русских и османских орд. Мы наверняка сможем заручиться определённой поддержкой нашего дела в этих землях!"
 MON_launch_peoples_uprising:0 "Начать народное восстание"
 MON_launch_peoples_uprising_desc:0 "Теперь, когда диверсанты заняли позиции, склады боеприпасов выведены из строя, а сторонники получили необходимое оружие, мы поднимем истинные знамёна над деревнями и городами Центральной Азии и Дальнего Востока, ознаменовав конец угнетательского русского владычества над этими регионами!"
 MON_declare_official_neutrality:0 "Провозгласить официальный нейтралитет"
 MON_declare_official_neutrality_desc:0 "Любой военный конфликт, пришедший на земли государства [ROOT.getAdjective], будет иметь разрушительные последствия для всех слоёв общества. Нам лучше публично объявить страну островом в этом неспокойном море."
 MON_open_up_the_country:0 "Открыть страну"
 MON_open_up_the_country_desc:0 "Приверженность принципам демократического социализма позволяет нам установить более тесные связи со многими демократическими учреждениями мира, укрепить демократические основы и обеспечить сохранение народных свобод."
 MON_riders_of_the_storm:0 "Всадники бури"
 MON_riders_of_the_storm_desc:0 "Мы разрешим формирование и отправку специальных сил стратегического назначения, способных защищать демократические институты в разных уголках мира. Эта боевая группа останется в тени и получит какое-нибудь неприметное название."
 MON_appeal_to_european_democracies:0 "Обратиться к европейским демократиям"
 MON_appeal_to_european_democracies_desc:0 "По мере того, как мир вокруг нас погружается в хаос, некоторые оппортунистические соседи могут предъявлять претензии на наши земли, рассматривая их как «неотъемлемую часть своей сферы влияния». С некоторыми сильными европейскими демократиями, поддерживающими наше дело, мы можем сохранить нашу дипломатическую позицию более безопасной."
 MON_appeal_for_overseas_protection:0 "Обратиться за заморской защитой"
 MON_appeal_for_overseas_protection_desc:0 "Следует укрепить сотрудничество с другими демократическими державами мира. Европейцы уже показали ненадёжность в вопросах колониализма и защиты иностранных государств. Возможно, разумнее обратиться через океан и заручиться поддержкой иных сил."
 MON_seek_democratic_alliances:0 "Искать демократические союзы"
 MON_seek_democratic_alliances_desc:0 "Демократическим институтам Монголии нужны не только дипломатические обещания, но и экономическая и военная защита. Обстановка вокруг нас ухудшается с каждым днём, и при возможности нам потребуется иностранная помощь."
 MON_democratic_foundation_of_mongolia:0 "Демократическая основа Монголии"
 MON_democratic_foundation_of_mongolia_desc:0 "Трудно полагаться на иностранные державы, находящиеся так далеко! Мы должны укрепить собственный путь к демократическим ценностям и распространить их вокруг себя!"
 MON_provide_shelter_for_refugees:0 "Предоставить убежище беженцам"
 MON_provide_shelter_for_refugees_desc:0 "Пока вокруг бушует война, мы остаёмся безопасной гаванью для нуждающихся в защите. Пришло время открыть границы для всех, кто ищет помощи, и приютить многих желающих жить в мире и безопасности."
 MON_offer_facilities_for_exiled_scientists:0 "Предоставить помещения учёным-изгнанникам"
 MON_offer_facilities_for_exiled_scientists_desc:0 "Мы можем предоставить различным научным учреждениям дополнительное финансирование, рабочие пространства и исследовательские объекты. Это взаимовыгодное сотрудничество также ускорит наше технологическое развитие."
 MON_forge_asian_self_determination:0 "Утвердить азиатское самоопределение"
 MON_forge_asian_self_determination_desc:0 "Мы никогда не забудем, как иностранные державы пытались подавить и подорвать демократические идеи в Центральной Азии. Теперь, когда часть территорий оказалась под нашим контролем, следует восстановить демократические институты в регионе!"
 MON_bulwark_against_fascist_threat:0 "Оплот против фашистской угрозы"
 MON_bulwark_against_fascist_threat_desc:0 "Многие страны Азии уже стали жертвами коричневой угрозы, которая любыми средствами распространяет свои ядовитые идеи, объявляя себя «спасением от красной угрозы». Их интересуют лишь власть, влияние и ресурсы, а не защита народа! Мы станем главным бастионом, способным выдержать их скрытое давление!"
 MON_strike_against_communist_menace:0 "Ударить по коммунистической угрозе"
 MON_strike_against_communist_menace_desc:0 "Много лет назад многие районы Азии оказались под влиянием Коминтерна и социалистических ценностей, однако их понимание Народной революции глубоко ошибочно: она приносит лишь хаос и разорение экономике и человеческим жизням. Мы поддержим любые демократические стремления на землях, страдающих от коммунистического угнетения!"
 MON_adopt_sun_yat_sen_principles:0 "Принять принципы Сунь Ятсена"
 MON_adopt_sun_yat_sen_principles_desc:0 "Основатель демократии государства [CHI.getAdjective] сформулировал философскую концепцию трёх принципов, призванную улучшить жизнь простых мужчин и женщин Центральной равнины. Если мы хотим быть ответственным правительством, будет благим делом применить формулу «правительство народа, волей народа и для народа» с национальной спецификой."
 MON_welfare_focus:0 "Народное благосостояние"
 MON_welfare_focus_desc:0 "Один из трёх основополагающих принципов предполагает обеспечение народа благами в рамках антикапиталистического экономического развития и антиимпериалистического дипломатического курса. Первым шагом станет экономическое развитие нашей нации."
 MON_codify_democratic_principles:0 "Закрепить демократические принципы"
 MON_codify_democratic_principles_desc:0 "Демократические основы приобретают гораздо большую силу, если закреплены в действующем законодательстве, а система управления поддерживает их на всех уровнях власти. Некоторый период политической нестабильности неизбежен, но эти перемены того стоят."
 MON_five_races_under_one_union:0 "Пять народов в едином союзе"
 MON_five_races_under_one_union_desc:0 "Отголоски новой философской теории распространяются по всей стране, а благородное наследие Синьхайской революции укореняется в умах и сердцах нашего народа! Переосмысление старых концепций укрепит наши связи с ханьцами, маньчжурами, хуэй и тибетцами!"
 MON_cooperation_with_kuomintang:0 "Сотрудничество с Гоминьданом"
 MON_cooperation_with_kuomintang_desc:0 "Демократическая ориентация нынешнего правительства государства [CHI.getAdjective] ясно показывает, что оно переосмысливает ошибки прошлого и, возможно, готово сотрудничать с бывшими подданными, автономными областями и данниками, а не подчинять их. Следует стремиться к примирению хотя бы на дипломатическом уровне."
 MON_nationalism:0 "Национализм"
 MON_nationalism_desc:0 "Следуя примеру Гоминьдана, мы примем второй ключевой элемент трёх народных принципов и утвердим национальную идентичность. Мы не китайцы, не русские и не маньчжуры, а халха-монголы, и другие народы должны уважать наше право на самоопределение!"
 MON_put_an_end_to_the_arat_system:0 "Покончить с аратской системой"
 MON_put_an_end_to_the_arat_system_desc:0 "Аратская система хорошо служила нам на раннем этапе социалистической революции, однако при нынешнем курсе правительства стало очевидно, что её необходимо полностью реформировать. В сотрудничестве с китайскими друзьями мы можем приспособить знамённую систему Внутренней Монголии к своим нуждам и значительно улучшить управление регионом! "
 MON_revoke_the_kyakhta_treaty:0 "Отменить Кяхтинский договор"
 MON_revoke_the_kyakhta_treaty_desc:0 "Компромиссы и уступки не знают границ, и мы готовы вновь принять судьбу под защитой Республики. Вернув себе право на самоопределение, мы тесно свяжем себя с могущественнейшими силами Центральной равнины."
 MON_confrontations_with_warlords:0 "Противостояние с военачальниками"
 MON_confrontations_with_warlords_desc:0 "Разделённая между враждующими и жаждущими власти кликами Центральная равнина остаётся крайне опасным и нестабильным местом, где иностранные державы наверняка попытаются распространить влияние. Имея ограниченные ресурсы, мы можем установить связи с некоторыми региональными силами и расширить собственную сферу влияния."
 MON_the_battle_for_tuva_uriankai:0 "Борьба за Туву-Урянхай"
 MON_the_battle_for_tuva_uriankai_desc:0 "Нас связывает общее наследие с народом Тувы-Урянхая. Лишь Российская революция и китайский империализм создали искусственные границы, разделившие нас на два государства. Мы можем начать курс на возвращение этой страны в нашу державу, однако государство [SOV.getAdjective] вряд ли отнесётся к этому спокойно."
 MON_strong_leader_genden:0 "Сильный лидер Гэндэн"
 MON_strong_leader_genden_desc:0 "Теперь, когда наш любимый вождь вновь правит страной, вполне естественно, что столь гениальный человек должен сосредоточить в своих руках всю государственную власть. Его правление откроет новую эпоху, новый век для Монголии!"
 MON_independent_army_structure:0 "Независимая структура армии"
 MON_independent_army_structure_desc:0 "Некоторые армейские чиновники по-прежнему пытаются утверждать, что руководство Гэндэна — не более чем фарс с точки зрения трактовки Революции. Пока политические комиссары сохраняют влияние в вооружённых силах, проводить какую-либо идеологическую программу без их вмешательства крайне трудно, а значит, они представляют серьёзную угрозу нашему режиму."
 MON_ensure_soldier_loyalty:0 "Обеспечить преданность солдат"
 MON_ensure_soldier_loyalty_desc:0 "Мы реформируем систему политической обработки, чтобы она лучше соответствовала целям нынешнего правительства, а не общей идеологии масс. Солдаты должны знать, за что и за кого они сражаются."
 MON_reform_the_high_command:0 "Реформировать высшее командование"
 MON_reform_the_high_command_desc:0 "Высшие офицеры не могут остаться в стороне от этих прогрессивных реформ, особенно учитывая, как постоянно меняется их преданность различным политическим силам и режимам."
 MON_mongolian_peoples_army:0 "Народная армия государства [ROOT.getAdjective]"
 MON_mongolian_peoples_army_desc:0 "Новая структура армии воплощает совершенство в самой своей основе: преданные солдаты исполняют приказы высших офицеров, верных общему делу, — идеальное сочетание для истинного монгольского народа."
 MON_incorporate_buddhism:0 "Интегрировать буддизм"
 MON_incorporate_buddhism_desc:0 "В одной из ранних работ Гэндэн писал, что у него есть два кумира, которым он всегда будет следовать: Владимир Ильич Ленин и Будда. Многие могут задаться вопросом, как вообще совместить столь разные идеологии. Ключом станет включение буддийской религии в государственную программу, что значительно расширит народную поддержку нынешнего правителя."
 MON_dealing_with_soviet_sympathisers:0 "Разобраться со сторонниками государства [SOV.getAdjective]"
 MON_dealing_with_soviet_sympathisers_desc:0 "Внутренняя стабильность и безопасность правительства постоянно находятся под угрозой со стороны ревизионистских элементов, поддерживающих государство [SOV.getAdjective] и проникающих на наши собрания, заседания, конференции и съезды. Чтобы закрепить новые ценности в партии, некоторым из этих предателей придётся ответить за ошибки прошлого."
 MON_continue_new_course_policy:0 "Продолжить политику нового курса"
 MON_continue_new_course_policy_desc:0 "Политика нового курса представляет собой монгольскую интерпретацию ленинской «Новой экономической политики» начала 1920-х годов. Некоторые её положения можно дополнительно укрепить, чтобы они лучше служили государственной экономике."
 MON_get_rich:0 "Обогащайтесь!"
 MON_get_rich_desc:0 "Долгожданная и давно обещанная кооперативная политика Пэлжидийна Гэндэна «Обогащайтесь!» позволит простым мужчинам и женщинам накапливать богатство независимо от государственного контроля и надзора, а государству [ROOT.getNameDef] — использовать лучшие элементы капитализма для развития социализма!"
 MON_empower_hudonets:0 "Расширить права худонцев"
 MON_empower_hudonets_desc:0 "Жителей бедных районов различных аймаков называют худонами, или худонцами. Многие из них представлены в правительстве как часть партийного крыла, которым руководит самый известный худонец — Гэндэн. Предоставление некоторым из них дополнительных полномочий обеспечит заметный экономический рост в бедных районах."
 MON_provide_for_the_people:0 "Обеспечить народ"
 MON_provide_for_the_people_desc:0 "От богатых к бедным и от бедных к богатым — круговорот средств всё равно заканчивается в руках правительства. Мы предоставим надлежащие возможности каждому независимо от богатства и общественного положения."
 MON_abolish_the_secretary_system:0 "Упразднить систему секретарей"
 MON_abolish_the_secretary_system_desc:0 "Система равного правления трёх партийных секретарей, созданная ещё в 1928 году, изжила себя. Разделение власти привело страну к глубоким политическим и экономическим кризисам последних лет, и, чтобы не допустить нового захвата власти, эту систему необходимо упразднить раз и навсегда."
 MON_subsidise_the_military:0 "Субсидировать армию"
 MON_subsidise_the_military_desc:0 "В последние годы военная промышленность пережила серьёзный спад, однако благодаря государственным субсидиям её можно модернизировать и расширить, укрепив военный потенциал и лучше оснастив наши армии."
 MON_leader_of_the_equal:0 "Первый среди равных"
 MON_leader_of_the_equal_desc:0 "Гэндэн доказал народу, что способен управлять страной в эти суровые времена. Под его руководством государство [ROOT.getNameDef] последует путём религиозного социализма и будет стремиться объединить родственные народы в одном государстве."
 MON_promote_religious_socialism:0 "Продвигать религиозный социализм"
 MON_religious_socialism_desc:0 "Мы вышли победителями из прежней борьбы и теперь можем сосредоточиться на укреплении и распространении наших ценностей в сердцах народа. На политическом поле появилась новая сила — религиозный социализм, прекрасно подходящий нашей процветающей стране."
 MON_support_buddhist_monasteries:0 "Поддержать буддийские монастыри"
 MON_support_buddhist_monasteries_desc:0 "Наше дело благородно и не несёт угнетения, поэтому мы можем сотрудничать со многими религиозными учреждениями страны. Они окажут поддержку режиму и помогут новой системе крепко держаться своих ценностей."
 MON_oust_genden:0 "Свергнуть Гэндэна"
 MON_oust_genden_desc:0 "Правление Гэндэна принесло экономике, промышленности и общественным институтам государства [ROOT.getAdjective] лишь разрушение. Народ устал от деспотов и постоянной смены режимов. Возможно, лучше вообще обойтись без правительства."
 MON_changes_within:0 "Внутренние перемены"
 MON_changes_within_desc:0 "Первый шаг к анархистскому состоянию сознания заключается в изменении экономической структуры государства как института, принятого заранее. Мы будем поощрять идеи коммунальной собственности, бесплатной государственной службы и ограниченных торговых сделок с нашими непосредственными соседями."
 MON_spread_of_anarcho_communism:0 "Распространять идеи анархо-коммунизма за рубежом"
 MON_spread_of_anarcho_communism_desc:0 "Идеи приближающейся анархической революции не могут быть ограничены линиями, проведёнными на картах политиками прошлого. Пусть весть распространяется: Революция сознания идёт к ним!"
 MON_full_social_equality:0 "Полное социальное равенство"
 MON_full_social_equality_desc:0 "Прежние государственные структуры уделяли огромное внимание неравному распределению богатства, собственности и общественных ролей. Подобная бессмыслица не нужна народным коммунам Монголии!"
 MON_abolish_the_currency:0 "Упразднить валюту"
 MON_abolish_the_currency_desc:0 "Валюта становится ненужной, если торговля ведётся и регулируется на местном уровне. Да, такая система иногда может быть неэффективной, но разве это важно, пока она работает?"
 MON_workers_control_and_discipline:0 "Рабочий контроль и дисциплина"
 MON_workers_control_and_discipline_desc:0 "Без высшего регулирующего органа некоторые рабочие, похоже, забыли саму цель анархо-коммунистической революции: они трудятся ради собственного блага и блага коммуны. Закрепление этих идей на ежегодных общинных собраниях станет полезной мерой."
 MON_eradicate_private_property:0 "Искоренить частную собственность"
 MON_eradicate_private_property_desc:0 "Частная собственность воплощает саму сущность капитализма, направленного на изменение принадлежности средств производства и распределения, и потому является враждебным отклонением от естественных общественных процессов. Однако простым гражданам не следует бояться: личная собственность останется у законных владельцев."
 MON_remove_hierarchical_structures:0 "Устранить иерархические структуры"
 MON_remove_hierarchical_structures_desc:0 "Ни один свободный мужчина и ни одна свободная женщина не должны быть схвачены, заключены в тюрьму, лишены имущества, объявлены вне закона, изгнаны или иным образом уничтожены, и никто не может быть преследуем иначе как по законному решению равных ему, при высшей власти народной коммуны."
 MON_finalize_state_reforms:0 "Завершить государственные реформы"
 MON_finalize_state_reforms_desc:0 "Многие считают нашу небольшую Революцию первым шагом более масштабного дела, которое распространит и утвердит наши ценности за границами страны, достигнув самых далёких уголков мира, чтобы однажды общинная Революция восторжествовала и там."
 MON_form_the_provisional_government:0 "Сформировать временное правительство"
 MON_form_the_provisional_government_desc:0 "Наше правительство в опасности: делегация высших государственных чиновников была задержана в Москве, и их судьба неизвестна. Мы сформируем временный режим, задача которого — на некоторое время обеспечить стабильность государства."
 MON_assists_deviants_struggle:0 "Помочь борьбе опального лидера"
 MON_assists_deviants_struggle_desc:0 "Новости о заключении Гэндэна достигли Улан-Батора несколько дней назад. Столь выдающийся человек не должен гнить в одиночной камере на Лубянке. Мы поможем храброму герою Монголии всеми возможными средствами."
 MON_infiltrate_the_railway_system:0 "Проникнуть в железнодорожную систему"
 MON_infiltrate_the_railway_system_desc:0 "Его местонахождение известно, однако остаётся вопрос, каким маршрутом его отправят поездом на юг. Следует восстановить старые связи в Народном комиссариате путей сообщения Советского Союза и получить важные сведения о запланированном пути к месту «отставки»."
 MON_return_of_prodigal_son:0 "Возвращение блудного сына"
 MON_return_of_prodigal_son_desc:0 "Нам удалось получить планы возможного маршрута Гэндэна к новому месту «реабилитации» на Крымском полуострове. Пришло время использовать все доступные средства, чтобы обеспечить его безопасное возвращение на Родину."
 MON_appeal_to_china:0 "Обратиться к Китаю"
 MON_appeal_to_china_desc:0 "Поскольку государство [SOV.getAdjective] оставило нашего лидера, а государство [JAP.getAdjective] преследует собственные цели, нам остаётся обратиться к тем, кто правил нами прежде, и попытаться наладить взаимовыгодное сотрудничество."
 MON_matters_of_internal_affairs:0 "Вопросы внутренних дел"
 MON_matters_of_internal_affairs_desc:0 "Поскольку поддержка сталинского правления по всей стране снижается, разумно найти другие способы укрепить внутреннюю стабильность нашей нации, оказавшейся в опасности."
 MON_strengthen_buddhist_community:0 "Укрепить буддийскую общину"
 MON_strengthen_buddhist_community_desc:0 "Буддизм государства [ROOT.getAdjective] можно охарактеризовать как пацифистский и антиреволюционный. Многие ламы поддерживают создание более консервативного и защищающего правительства, которое не будет угнетать крупнейшую и сильнейшую религиозную общину страны."
 MON_search_new_bogd_khan:0 "Начать поиски нового Богдо-хана"
 MON_search_new_bogd_khan_desc:0 "Запрещённые сначала государством [SOV.getAdjective], а затем коммунистическими властями государства [ROOT.getAdjective], поиски девятого перерождения Джебцзун-Дамба-хутухты можно тайно возобновить, если в ближайшем будущем мы намерены восстановить церемониальную конституционную монархию."
 MON_proclaim_the_second_bogd_khanate:0 "Провозгласить Второе Богдо-ханство"
 MON_proclaim_the_second_bogd_khanate_desc:0 ""
 MON_guard_southern_border:0 "Охранять южную границу"
 MON_guard_southern_border_desc:0 "Доклады из аймаков Гоби-Алтай, Умнеговь и Дорноговь показывают коварство местных групп, которые пользуются слабым контролем правительства над протяжённой южной границей, чтобы обогащаться постоянными набегами и грабежами мирных деревень. Мы направим несколько недавно сформированных эскадронов для борьбы с этой угрозой."
 MON_ensure_rural_support:0 "Обеспечить поддержку сельской местности"
 MON_ensure_rural_support_desc:0 "Сельское население почти ничего не знает о происходящем в высших органах власти, а некоторые опасаются текущих перемен в стране. Мы постараемся примириться с местными старейшинами, вложившись в развитие их районов. Дорого, но оно того стоит."
 MON_shelter_the_banished:0 "Укрыть изгнанников"
 MON_shelter_the_banished_desc:0 "Силы, направленные в южные аймаки, сообщают о росте числа политических беженцев из соседних государств. Среди них есть левые и бывшие высокопоставленные партийные чиновники государства [PRC.getNameDef], что указывает на серьёзные перемены в его правительстве. Вместо того чтобы игнорировать их, мы можем воспользоваться их помощью для создания коммунистического государства нового типа."
 MON_the_new_chairman:0 "Новый председатель"
 MON_the_new_chairman_desc:0 ""
 MON_rally_the_radicals:0 "Сплотить радикалов"
 MON_rally_the_radicals_desc:0 "Панмонголизм широко распространён во всех уголках нашей большой страны, однако многим радикалам не хватает организации и поддержки оппозиции, по-прежнему сильно уступающей своим противникам на политическом поле. Применив необходимые средства, мы косвенно добьёмся того, что эти голоса будут становиться громче день ото дня."
 MON_host_emergency_great_khural_assembly:0 "Созвать чрезвычайное заседание Великого хурала"
 MON_host_emergency_great_khural_assembly_desc:0 "Мы опасались этого, но отрицать очевидное невозможно: государство [SOV.getNameDef] и его чиновники официально заявили, что больше не заинтересованы в защите нашего государства от внешних угроз. Великий хурал должен немедленно собраться, чтобы обсудить государственную политику и дипломатический курс нынешнего режима."
 MON_approach_japan:0 "Обратиться к Японии"
 MON_approach_japan_desc:0 "Слухи быстро распространяются, и из-за этого мы открыты для любого политического и военного вмешательства со стороны наших прямых и косвенных соседей. Страх перед возрождением [CHI.getAdjective] оккупация наших земель велика, потому что нам, возможно, придется подойти к врагам наших врагов: [JAP.getNameDef] Искать их поддержки в назревающей правительственной борьбе."
 MON_invite_pince_su:0 "Пригласить князя Су"
 MON_invite_pince_su_desc:0 "Мы почти уверены, что интерес государства [JAP.getAdjective] к нашим землям носит не только экспансионистский, но и партнёрский характер. Некоторые его агенты уже связывались с различными государственными чиновниками, обещая хорошую долю прибыли, если инвесторы государства [JAP.getAdjective] смогут помочь нашей экономике, а его советники — поддержать развитие армии."
 MON_launch_a_coup:0 "Начать переворот"
 MON_launch_a_coup_desc:0 ""
 mongol.2.t:0 "Монголия предлагает договор о взаимопомощи"
 mongol.2.d:0 "Ожидалось, что запланированная встреча будет жаркой, но никто не ожидал, что она будет развиваться таким образом. После обычного тоста [SOV.getLeader] «Рабочие и крестьяне обоих народов» [MON.getNameDef] и [SOV.getNameDef]\", началась дискуссия по теме развития общего будущего как для СССР, так и для Монголии.\nИ пока [MON.getLeader] выступает за идею [MON.getAdjective] Независимость в условиях постоянно растущего [SOV.getAdjective] Присутствие и влияние в стране глава генштаба Гелегдоржин Демид обратился к Вожду и предложил наращивать сотрудничество между народами.\n\nШокированное лицо [MON.getLeader] и приятной реакции [SOV.getLeader] Осталось много вопросов о том, какой участью могут обернуться отношения обоих лидеров. Демид указал, что «Джентльменское соглашение» 1934 года остро нуждается в переделке, учитывая тревожно высокое присутствие «Джентлменского соглашения». [JAP.getAdjective] в [MEN.getNameDef] и высокой напряженности с бывшими после битвы при Халхынском храме в прошлом году. Соглашение включает взаимовыгодное промышленное и военное сотрудничество, включая взаимные гарантии независимости в случае военного конфликта с другим государством.\n\nКаким будет решение Генсека?"
 mongol.2.a:0 "Согласиться оказать помощь"
 mongol.2.b:0 "Оставить Монголию без поддержки"
 mongol.3.t:0 "СССР соглашается на договор"
 mongol.3.d:0 "Предложение Демида было с большим воодушевлением встречено представителями государства [SOV.getAdjective]. [SOV.getLeader] одобрительно похлопал улыбающегося молодого генерала по плечу и начал обсуждать с ним отдельные положения договора: экономические инвестиции, передачу оружия и снаряжения, размещение солдат государства [SOV.getAdjective], военные учебные объекты, возможные оборонительные рубежи, надзор за пограничными патрулями и многое другое. \n\nО [MON.getLeader], казалось, забыли все, кроме главы НКВД Ягоды, сделавшего несколько записей в блокноте. Лидеру осталось лишь пить коньяк, принесённый одним из генералов государства [SOV.getAdjective]. Через несколько минут обсуждение других революционных вопросов продолжилось уже в широком кругу."
 mongol.3.a:0 "Мы рады, что они согласились."
 mongol.4.t:0 "СССР оставляет нас без поддержки!"
 mongol.4.d:0 "Заявив, что «у государства [SOV.getNameDef] имеется множество срочных вопросов внутренней стабильности и серьёзная напряжённость на Западе, поэтому сейчас оно не может сосредоточиться на развитии Дальнего Востока», [SOV.getLeader] отклонил предложение подписать «Договор о дружбе и сотрудничестве» в нынешних обстоятельствах. \n\nПозднее разочарованного Демида видели за тихим разговором с воодушевлённым [MON.getLeader] о том, на каких вопросах Монголии следует сосредоточиться в следующем раунде переговоров. "
 mongol.4.a:0 "Хорошо, раз они так хотят"
 mongol.5.t:0 "Монголия предлагает сосредоточиться на собственных силах"
 mongol.5.d:0 "Делегация государства [MON.getAdjective] под руководством [MON.getLeader] давно настаивает на самостоятельности государства [MON.getAdjective] в вопросах оборонных расходов и международных отношений на Дальнем Востоке. Формально являясь независимым государством, они по-прежнему сильно зависят от нашего экономического, промышленного и военного руководства, фактически оставаясь подконтрольным или, говоря прагматичнее, марионеточным государством.\nУчитывая растущее присутствие государства [JAP.getAdjective] в Маньчжурии и его жадные взгляды на богатые ресурсами районы Забайкалья, мы могли бы расширить своё присутствие и разместить войска на землях государства [MON.getAdjective]. С другой стороны, такой шаг может ещё сильнее обострить и без того тревожную напряжённость между ними и государством [JAP.getNameDef]. \nВзвесив все доводы за и против, [SOV.getLeader] решил, что..."
 mongol.5.a:0 "...эти условия приемлемы."
 mongol.5.b:0 "...лучше поддержать наших «братьев»."
 mongol.6.t:0 "Государство [SOV.GetAdjective] одобряет просьбу"
 mongol.6.d:0 "После некоторых раздумий [SOV.getLeader] убедительно заявил, что вопросы внутренней политики и государственных расходов государства [MON.getAdjective] «имеют происхождение государства [MON.getAdjective] и должны определяться только им», тем самым одобрив нашу просьбу об автономии в этих сферах. Часть военного контингента государства [SOV.getAdjective] останется в жизненно важных районах ещё на несколько месяцев, чтобы обеспечить безопасность уязвимых приграничных областей. \nДобившись успеха, мы наконец можем направлять государство [MON.getadjective] по желаемому политическому пути без риска вмешательства государства [SOV.getAdjective] — по крайней мере пока."
 mongol.6.a:0 "Превосходно!"
 mongol.7.t:0 "СССР всё ещё намерен направить поддержку"
 mongol.7.d:0 "«Не имеет значения, что является более насущным, чем защита народной революции и безопасность коммунистических режимов в наших государствах-соседях», — говорится в заявлении. [SOV.getLeader] Они ясно указали, что не видят оснований для того, чтобы позволить нам даже ограниченную автономию в этом вопросе.\nразочарованный [MON.getLeader] Он был обеспокоен тем, что ищет поддержки среди других членов организации. [MON.getAdjective] делегацию, большинство из которых были явно расстроены, за исключением главнокомандующего Демида, который выступал за более интенсивное [SOV.getAdjective]-[MON.getAdjective] Военное сотрудничество."
 mongol.7.a:0 "Что ж, ладно"
 mongol.8.t:0 "Пригрозить [SOV.getLeader] Японией?"
 mongol.8.d:0 "Представители государства [SOV.getAdjective], возможно, до сих пор не осознают, какой угрозой в последние годы стало государство [JAP.getNameDef]. Разумно напомнить им, кто является истинным врагом Революции и главным империалистом Восточной Азии.\n\nС другой стороны, нашу делегацию возглавляет импульсивный и свободомыслящий [MON.getLeader], который, вероятно, сделает заявление в, мягко говоря, необычной и вызывающей форме. Возможно, лучше не поднимать эту тему, ведь [SOV.getLeader] может оказаться не в настроении выслушивать подобные речи. "
 mongol.8.a:0 "Сделать это!"
 mongol.8.b:0 "Лучше ещё раз подумать"
 mongol.9.t:0 "[MON.getLeader] угрожает нам Японией"
 mongol.9.d:0 "Медленная и тихая беседа о революционных преобразованиях в обоих государствах, за которой последовал рассказ [SOV.getLeader] о его пролетарской деятельности, внезапно была прервана изрядно пьяным [MON.getLeader]. Поднявшись со стула, он выкрикнул Вождю в лицо: «Ты, проклятый грузин, превратился в настоящего русского царя», затем подошёл к генеральному секретарю, ударил его по лицу и заявил: «Даже государство [JAP.getAdjective] — лучший союзник, чем ты». После этого конференц-зал накрыла мёртвая тишина. \n\nНикто прежде не позволял себе ничего подобного в отношении генерального секретаря. Как же [SOV.getLeader] отреагирует на это?"
 mongol.9.a:0 "Признать, что угроза реальна"
 mongol.9.b:0 "Проигнорировать доводы"
 mongol.9.c:0 "Гэндэн — агент Японии?"
 mongol.10.t:0 "Государство [SOV.GetAdjective] направляет помощь"
 mongol.10.d:0 "Впечатляющая речь [MON.getLeader] о современном царе государства [SOV.getAdjective], заботящемся прежде всего о собственном благе, заставила многих членов иностранной делегации осознать, что их представление о положении на Дальнем Востоке явно ошибочно. После непродолжительного обсуждения облегчённую делегацию государства [MON.getAdjective] пригласили подписать соглашение об укреплении сотрудничества между двумя странами! \n\n[MON.getLeader], несомненно, стал героем вечера, несмотря на явно раздражённого [SOV.getLeader], который большую часть времени молча сидел в кресле в тёмном углу комнаты и обсуждал с Генрихом Ягодой некие «незначительные внутренние вопросы»."
 mongol.10.a:0 "Это сработало? Ура!"
 mongol.11.t:0 "Руководство СССР игнорирует угрозу"
 mongol.11.d:0 "Медленно набивая новую трубку табаком, [SOV.getLeader] указал на [MON.getLeader] и выразил глубокую обеспокоенность психическим состоянием нынешнего представителя государства [MON.getNameDef], подчеркнув, что чрезмерное употребление алкоголя и драки не помогут дипломату склонить оппонента на свою сторону. Более того, подобные методы совершенно излишни в отношении мелких нарушителей спокойствия на Востоке. \n\nЧерез несколько минут [SOV.getLeader] распорядился уведомить высшее командование Союза, что восточная угроза имеет наименьший приоритет, а у чиновников государства [SOV.getAdjective] «есть более важные дела», тем самым явно пренебрегая опасностью, которую представляет государство [JAP.getNameDef]."
 mongol.11.a:0 "Похоже, мы предоставлены сами себе"
 mongol.12.t:0 "Государство [SOV.GetAdjective] заключает Гэндэна под стражу?!"
 mongol.12.d:0 "Генеральный секретарь ответил медленно и спокойно, словно воцарившаяся тишина придавала ему сил. \nВо-первых, он указал на бессмысленность подобных доводов, особенно учитывая, что НКВД занимается этим вопросом гораздо дольше, чем [MON.getLeader] занимает руководящую должность. \nВо-вторых, [SOV.getLeader] обратил внимание на «любопытную» фразу о «дружбе с Японией» и спросил, действительно ли представители государства [MON.getAdjective] намерены искать защиты у тех, кто угнетает рабочий класс. Наконец, он указал на [MON.getLeader] и, наблюдая его испуганное лицо, поставил под сомнение его преданность Революции и Отцу народов Владимиру Ильичу Ленину. \n\nЧерез несколько минут в зал вошли сотрудники НКВД во главе с Генрихом Ягодой и вежливо попросили пьяного [MON.getLeader] проследовать с ними для личного обсуждения столь острой темы. Ожидается, что оставшаяся делегация вскоре покинет Москву и доставит новости в Улан-Батор."
 mongol.12.a:0 "Что нам теперь делать?"
 mongol.13.t:0 "Делегация государства [MON.GetAdjective] возвращается в Улан-Батор"
 mongol.13.d:0 "Делегация, в состав которой входили [MON.getLeader], Гэлэгдоржийн Демид и несколько других партийных чиновников, наконец вернулась из Москвы после почти месячного отсутствия в государственных учреждениях. Сначала они добрались поездом до Иркутска, где группе предоставили несколько автомобилей и грузовиков государства [SOV.getAdjective], чтобы обеспечить безопасное возвращение в столицу государства [MON.getAdjective]. \n\nПосле всех переговоров, дипломатических манёвров, предложений и встречных условий они наконец вернулись в кабинеты и призывают через несколько дней созвать седьмую сессию Великого хурала, чтобы обсудить итоги конференции и определить новый курс страны на ближайшие годы."
 mongol.13.a:0 "Какие новости нам вскоре сообщат?"
 mongol.14.t:0 "Поезд государства [MON.GetAdjective] возвращается пустым"
 mongol.14.d:0 "Сопровождение делегации из двенадцати телохранителей и нескольких помощников уже несколько дней ожидало на главном вокзале Иркутска, однако поезд прибыл только сейчас. Некоторые вернувшиеся члены заявили, что Гэндэн остался в Москве для обсуждения «срочных и крайне важных вопросов» в местной гостинице на Лубянке, как им сообщили представители государства [SOV.getAdjective]. \n\nОдин из телохранителей Гэндэна, вспомнив о своей прежней учёбе в Москве, немедленно упомянул здание штаб-квартиры НКВД с тем же названием и предположил, что нашего храброго лидера заключили там под стражу..."
 mongol.14.a:0 "Где наш лидер?!"
 mongol.15.t:0 "Созвана сессия Великого хурала [GetYear] года"
 mongol.15.d:0 "Седьмая сессия Государственного Великого хурала ещё никогда не была столь многолюдной. Множество министров, представителей, младших государственных чиновников и журналистов устремили взгляды на главную трибуну, где расположились руководители делегации, готовые объявить итоги многочасовых и многодневных переговоров в Москве со своими коллегами из государства [SOV.getAdjective]. \n\nПосле приветственных оваций глава делегации [MON.getLeader] поднимается со стула. Сотни любопытных и нетерпеливых взглядов устремляются на величественную фигуру премьер-министра, который подходит к микрофону и произносит единственную фразу..."
 mongol.15.a:0 "Государство [SOV.GetAdjective] оказало нам помощь!"
 mongol.15.b:0 "Наша самостоятельность была гарантирована!"
 mongol.15.c:0 "Они оставили нас без поддержки!"
 mongol.19.t:0 "Обнаружено крупное перемещение войск государства [MON.getAdjective]"
 mongol.19.d:0 "Наши пограничные патрули сообщают, что в последние дни на одной из границ сосредотачивается всё больше войск государства [MON.getAdjective]. Недавно перехваченные радиопереговоры указывают, что они планируют некую военную операцию на наших землях. \nИх точная цель пока неизвестна, но ясно, что эти полки не замышляют ничего хорошего, поэтому нашим солдатам необходимо быстро действовать и столь же быстро реагировать, чтобы эффективно защититься от возникшей угрозы."
 mongol.19.a:0 "Приказать удерживать позиции любой ценой!"
 mongol.19.b:0 "У нас есть дела поважнее этих бандитов."
 mongol.20.t:0 "Малый набег завершился успехом"
 mongol.20.d:0 "Отправленный эскадрон успешно преодолел оборонительный периметр противника и, почти не встретив сопротивления, проник в местную деревню под видом ополчения. Бойцы захватили часть плохо охраняемого оружия со складов, погрузили его на лошадей и скрылись в темноте, не подняв тревоги и не причинив вреда мирным жителям. \n\nПо возвращении на базу солдаты сообщили о нескольких вариантах оружия, которые можно использовать для улучшения собственных образцов, — весьма полезное приобретение перед следующим набегом."
 mongol.20.a:0 "Доставить трофеи и изучить их!"
 mongol.21.t:0 "Малый набег провалился"
 mongol.21.d:0 "Ударный отряд выступил по плану и, не встретив сопротивления, успешно пересёк спорную границу, рассчитывая достичь местного поселения до рассвета. Однако наши силы внезапно попали в засаду неизвестного ударного подразделения. Ловушка была подготовлена настолько хорошо, словно каждый шаг наших бойцов был заранее известен. \n\nВойска сумели открыть безопасный путь и быстро отступить на родную территорию. Некоторые ранены, многие потеряли оружие, а ещё больше солдат деморализовано кажущимся превосходством противника."
 mongol.21.a:0 "Боевой дух наших солдат сломлен..."
 mongol.22.t:0 "Наступление остановлено"
 mongol.22.d:0 "Когда наш рейдовый отряд продвигался по вражеской территории, на горизонте было замечено некое движение. Через несколько часов бригада столкнулась с наступающим отрядом противника, и короткая перепалка превратилась в ожесточённый бой после того, как нетерпеливые солдаты с обеих сторон открыли огонь. \n\nПерестрелка продолжалась несколько часов, после чего обе стороны отошли к своим штабам для перегруппировки, восстановления сил и пополнения боеприпасов. Цель операции, к сожалению, не была достигнута, однако применённые тактические приёмы и манёвры позволили получить ценный опыт."
 mongol.22.a:0 "Хорошо. Наши войска усвоили ценный урок."
 mongol.23.t:0 "Малый набег отражён"
 mongol.23.d:0 "Быстрая мобилизация резервов и своевременная отправка войск предотвратили возможную катастрофу. \nПока наступающие войска государства [MON.getAdjective] углублялись на нашу территорию, бдительные пограничные полки следовали за ними и наблюдали издалека, а регулярные части готовили поле боя для ничего не подозревающих бандитов. \n\nНезадолго до начала главного столкновения один из импульсивных командиров приказал атаковать, вынудив остальные отряды поддержать стремительное наступление и тем самым позволив налётчикам избежать вероятного окружения и скрыться в темноте. Однако они оставили множество винтовок, которые теперь послужат нам."
 mongol.23.a:0 "Победа нашего народа!"
 mongol.24.t:0 "Небольшой отряд государства [MON.GetAdjective] совершил набег на нашу границу"
 mongol.24.d:0 "Ранее в этот день пограничная патрульная группа обнаружила следы вражеской эскадры, которая пересекла нашу границу не позднее, чем несколько дней назад. Следы подков и следы подков свидетельствуют о том, что враждебная команда состояла из нескольких десятков легковооруженных людей в сопровождении кавалерийского полка, следовала по дороге, ведущей к местному складу боеприпасов, успешно умиротворяла ничего не подозревающих охранников и ушла следующей ночью, забрав большую часть нынешних боеприпасов с объекта.\n\nСлухи о «Всадниках-призраках» уже начали распространяться среди местного населения. Небольшой полицейский гарнизон будет отправлен в оспариваемый район для надзора за защитой региона в течение следующих нескольких недель."
 mongol.24.a:0 "Мы потеряли ценных людей и имущество!"
 mongol.25.t:0 "Достигнута ничья"
 mongol.25.d:0 "Вражеский рейдовый отряд заметили несколько наблюдательных крестьян, которые немедленно передали тревожное сообщение командиру местного полицейского эскадрона. Тот направил в спорный район «делегацию для встречи», чтобы замедлить продвижение противника. \n\nПосле коротких переговоров обе стороны открыли огонь, каждая утверждая, что лишь защищает свои интересы и устраняет растущую угрозу со стороны другой. Бой продолжался до наступления темноты, после чего противник собрал оставшиеся силы и отступил, оставив наших солдат залечивать раны и извлекать уроки из столкновения."
 mongol.25.a:0 "Хорошо. Наши войска усвоили ценный урок."
 mongol.26.t:0 "Средний набег завершился успехом"
 mongol.26.d:0 "Несколько недель напряжённого планирования и тщательной подготовки принесли плоды: несколько наших дивизий прорвали вражескую границу сразу в нескольких местах, затем соединились, разгромили местный гарнизон военной базы, проникли на склады боеприпасов и захватили несколько образцов современного военного снаряжения. \n\nПосле объявления тревоги наши эскадроны спрятали добытые трофеи и безопасно переправили их на нашу сторону границы по заранее подготовленным и охраняемым коридорам. Местный командир с воодушевлением сообщил, что новые образцы можно использовать для оснащения войск или научных исследований."
 mongol.26.a:0 "Ещё больше снаряжения! Превосходно!"
 mongol.26.b:0 "Очень хорошо. Использовать его для испытаний."
 mongol.27.t:0 "Средний набег отражён"
 mongol.27.d:0 "Стремительное и несколько безрассудное наступление наших вооружённых сил было перехвачено пограничным патрулём противника, который немедленно открыл огонь. Наши войска удерживали господствующую высоту и пытались создать укреплённую оборонительную позицию, перегруппироваться и возобновить наступление до прибытия в спорный район вражеских подкреплений. \n\nПротивник, похоже, хорошо знал нашу тактику: прежде чем мы успели перейти в контратаку, его кавалерийский полк совершил обходной манёвр, посеял хаос на плохо защищённых флангах и уничтожил часть наших сил в ближнем бою. Остатки рейдовой группы собрали потрясённых выживших, создали плацдарм к нашим землям и с наступлением ночи отступили."
 mongol.27.a:0 "Сегодня многие матери не дождутся сыновей..."
 mongol.28.t:0 "Продвижение рейдового отряда задержано"
 mongol.28.d:0 "Первый этап операции в большинстве районов прошёл согласно первоначальному плану, за одним исключением — единственным, но жизненно важным. Полк должен был продвинуться к одной из укреплённых позиций противника и перерезать линии связи, дав остальным силам достаточно времени для проникновения в спорный район без серьёзных затруднений. \n\nОднако тревога была поднята после того, как заклинившая винтовка одного из наших солдат произвела случайный выстрел и вынудила противника вступить с нами в ближний бой. Возможность была упущена, и без сигнала к продолжению операции оставшимся силам пришлось отойти на исходные позиции, тогда как уже закрепившийся эскадрон успешно эвакуировал весь воинский контингент и доложил командованию о случившейся неудаче."
 mongol.28.a:0 "Улучшить наши полки."
 mongol.28.b:0 "Хорошо. Извлечь другой тактический урок."
 mongol.29.t:0 "Средний рейдовый отряд уничтожен"
 mongol.29.d:0 "Наивные вражеские захватчики решили, что могут безнаказанно вторгаться на наши земли и угрожать народу своими назойливыми нападениями на гражданские и военные объекты! Пограничные патрули сообщили об успешном уничтожении вражеского рейдового отряда, пытавшегося разграбить наши земли! \n\nНаступление противника было обнаружено, а его группа перехвачена в районе, где стратегическое преимущество находилось на нашей стороне. Храбрый кавалерийский эскадрон обошёл врага с фланга и ударил в самое сердце этой напасти, вынудив остатки бандитов отступить туда, откуда они пришли. Трофеи передают солдатам, а местный командир получает очередную медаль!"
 mongol.29.a:0 "Мы гордимся нашим ополчением и армией!"
 mongol.30.t:0 "Дивизии государства [MON.GetAdjective] совершили набег на наш склад боеприпасов"
 mongol.30.d:0 "После того как местный гарнизон приграничной военной базы не вышел на связь по обычному распорядку, в регионе объявили полную мобилизацию вооружённых сил и ввели военное положение, прежде чем среди населения успела распространиться паника. \n\nЛишь через несколько часов стремительно наступавшая кавалерия достигла позиций и увидела весь ужас содеянного противником: с территории объекта исчезли не только производственные материалы, но и станки, а также недавно выпущенное и хранившееся там снаряжение. Экономике и военному потенциалу нанесён тяжёлый ущерб, поэтому необходимо обеспечить, чтобы подобное больше никогда не повторилось."
 mongol.30.a:0 "Теперь нам многое предстоит восстановить"
 mongol.31.t:0 "Рейдовый отряд перехвачен"
 mongol.31.d:0 "В одном из наших укреплённых районов объявили всеобщую тревогу после того, как проникший вражеский эскадрон произвёл выстрел неизвестного происхождения. Солдаты заняли позиции и попытались выбить противника из хорошо подготовленных укреплённых оборонительных рубежей. \n\nБой продолжался ещё несколько часов, и ни одна сторона не смогла получить явного преимущества. В итоге враг отступил, а местный гарнизон остался размышлять о возможных причинах столь безрассудного набега. Другие пограничные патрули также сообщили о росте вражеской активности в своих районах."
 mongol.31.a:0 "Мы всегда готовы отражать их наступление!"
 mongol.31.b:0 "Отлично! Изучить действия противника."
 mongol.35.t:0 "Разобраться с Гэндэном"
 mongol.35.d:0 "На недавнем заседании Великого Хуральского Собрания общественности были представлены протоколы нашей дипломатической миссии, раскрывающие всю полемику вокруг переговоров и переговорной тактики некоторых членов делегации.\n\nОдно из названий упоминалось чаще других, и это бывший премьер-министр Пелджидиин Генден. В то время как некоторые видят в его поведении признак железной воли и сильного непослушания, другие видят в его провокационных манерах отсутствие навыков, образования и умности, подразумевая, что такой человек не может сохранить высокий политический пост в будущем.\n\nВ нашем распоряжении есть различные варианты, каково будет решение мудрого [MON.getLeader] Правда?"
 mongol.35.a:0 "Позволить ему остаться министром иностранных дел."
 mongol.35.b:0 "Вынудить его досрочно уйти в отставку."
 mongol.35.c:0 "Такое поведение нельзя терпеть, арестовать или, что еще лучше, убить его!"
 mongol.36.t:0 "Смерть Гэлэгдоржийна Демида"
 mongol.36.d:0 "Сегодня утром правительственное учреждение получило ужасающие новости со станции Тайга под Новосибирском: вся делегация, включая военного стратега Гэлэгдоржийна Демида, командира корпуса Г. Дьянцанхороллоо, секретаря посольства государства [MON.getAdjective] в государстве [SOV.getNameDef] Гомбосурэна, главного армейского переводчика Т. Доржиева и его жену Л. Дагсму, была найдена мёртвой в спальных вагонах поезда прошлым вечером. \n\nСогласно заключению криминалистов государства [SOV.GetAdjective], причиной смерти стало пищевое отравление испорченными рыбными консервами. Для нашей страны это крайне печальный поворот событий, хотя для кого-то он, возможно, оказался удачным. Скоро узнаем..."
 mongol.36.a:0 "Подозрительное совпадение?!"
 mongol.37.t:0 "Бат-Очирын Элдэв-Очир выражает опасения"
 mongol.37.d:0 "Один из лидеров левой оппозиции, Бат-Очирын Элдэв-Очир, этим вечером после окончания рабочего дня прибыл в кабинет [MON.getLeader], чтобы обсудить «крайне срочный вопрос». \n\nВ свете настольной лампы Элдэв-Очир тихо сообщил, что многие представители партийной элиты теперь опасаются за свою жизнь из-за стремительных перемен в политическом климате страны. Он также отметил, что, если Чойбалсан получит ещё одно военное или государственное повышение, его железная хватка над страной в сочетании со связями в НКВД может ввергнуть земли в новое десятилетие политического насилия, чего необходимо не допустить."
 mongol.37.a:0 "Чойбалсан слишком опасен. Подготовить восстание."
 mongol.37.b:0 "Заверить его, что всё в порядке."
 mongol.38.t:0 "Левые захватывают власть!"
 mongol.38.d:0 "Утреннее заседание Государственного хурала было прервано толпой, собравшейся перед зданием на демонстрацию против недавно принятых законов. Протестующие утверждали, что они служат лишь интересам правительственной элиты, а не простых мужчин и женщин. Парламентскую охрану поспешно усилили, чтобы предотвратить дальнейшее вмешательство в законодательный процесс. \n\nПосле нескольких часов криков толпа позволила своим зачинщикам выйти вперёд и объявить охране, что заседающие в здании парламента действуют ради личной выгоды, а не в интересах масс, предъявив доказательства коррупции в правительстве. Пока стража была отвлечена, нескольким вооружённым людям удалось незаметно проникнуть внутрь, перерезать связь и распустить заседание. Затем состоялась церемония, на которой [MON.getLeader] оставил пост премьер-министра и передал полномочия «временному» министру Бат-Очирыну Элдэв-Очиру."
 mongol.38.a:0 "Это ради общего блага"
 mongol.39.t:0 "Чойбалсан начинает переворот!"
 mongol.39.d:0 "Несмотря на официальное заявление Государственного Малого хурала о том, что политический курс страны на ближайшие пять лет вновь сместится влево, значительная часть сельского населения под руководством элементов, поддерживающих государство [SOV.getAdjective], организовала массовые демонстрации по всей стране. В столкновениях с полицией некоторые протестующие завладели оружием и начали грабить плохо защищённые склады боеприпасов, предположительно стремясь создать нерегулярное ополчение для борьбы с законным режимом! \n\nМы не можем позволить кучке боевиков силой подавить свободную волю народа. Пришло время восстановить порядок на землях, которыми нам суждено править!"
 mongol.39.a:0 "К оружию!"
 mongol.40.t:0 "Монголия стремится к более тесным связям"
 mongol.40.d:0 "Осознав хрупкость недавно созданного режима, государство [MON.getNameDef] направило дипломатическую миссию, чтобы заверить наших чиновников: его трактовка коммунизма соответствует нашим взглядам. \n\nДелегация также представила несколько проектов договоров, которые должны укрепить связи между двумя странами и согласовать государственный курс Монголии с курсом, определяемым государством [ROOT.getNamedef] и его руководством в лице [SOV.getLeader], фактически превратив их режим в подконтрольное нам государство."
 mongol.40.a:0 "Очень хорошо, время пришло."
 mongol.40.b:0 "Это не имеет стратегического значения."
 mongol.41.t:0 "Государство [SOV.getAdjective] соглашается на более тесные связи"
 mongol.41.d:0 "Наше предложение о расширенном сотрудничестве между нашими двумя государствами было встречено с большим волнением. [SOV.getAdjective] должностные лица и после нескольких раундов обсуждений вопроса о том, каким образом должны проводиться различные внутренние и внешние вопросы, было решено подписать \"[SOV.getAdjective]-[MON.getAdjective] Договор о руководстве и помощи\" на следующий день.\n\nСоглашение эффективно закрепляет [SOV.getAdjective] контроль над государственным аппаратом в нашей стране, позволяющий вытеснить наши правительственные усилия на укрепление позиций страны на международной арене и стремиться влиять на наших непосредственных соседей, продвигая революционное дело за рубежом."
 mongol.41.a:0 "Мы рады это слышать."
 mongol.42.t:0 "Советы отклоняют просьбу"
 mongol.42.d:0 "Несмотря на все наши усилия и искренние обещания вечного союза, [SOV.getLeader] официально отверг скромное предложение, заявив, что «трактовка принципов марксизма-ленинизма государством [MON.getAdjective] имеет ряд идеологических отличий, которые в нынешних обстоятельствах не позволяют государственным структурам обеих стран укреплять внутреннее и внешнее сотрудничество». \n\nУчитывая столь неожиданный ход событий, нам следует укреплять собственную дипломатическую основу и продвигать желаемые коммунистические идеи своими средствами и методами."
 mongol.42.a:0 "Что ж, мы справимся и сами."
 mongol.49.t:0 "Тайный заговор?"
 mongol.49.d:0 "Революционные методы нашего коммунистического режима давно вызывают сомнения у различных слоёв населения, многие представители которых имеют иностранное происхождение, религиозные убеждения или нестандартный образ мышления. Несмотря на все попытки переубедить лидеров этих общественных групп и отвратить их от прогнивших идей капиталистического, империалистического или самодержавного происхождения, их голоса всё ещё звучат среди народа, подрывая преданность и зарождая сомнения в умах мужчин и женщин. \n\nПредварительное расследование показывает, что вся пропагандистская деятельность этих людей восходит к единому кругу популярных личностей, каждая из которых тем или иным образом связана с остальными. \n\nПредполагая, что они координируют свои действия, министр внутренних дел Хорлогийн Чойбалсан подготовил план по обезглавливанию заговора и защите государства от нового витка восстаний и мятежей."
 mongol.49.a:0 "Время пришло"
 mongol.50.t:0 "Вопрос интеллигенции"
 mongol.50.d:0 "Образование населения развивается лучше, чем когда-либо прежде, однако новые книги и учебные материалы, возможно, посеяли капиталистические или националистические идеи в головах граждан. \nМногие молодые специалисты, вернувшиеся по программам студенческого обмена с государством [SOV.GetNameDef], обогатили наши школы, институты и исследовательские центры. Но остаётся вопрос: насколько им можно доверять? \n\nСколько из них несут в себе потенциальные семена революции и заслуживают доверия? Мы должны знать наверняка, а методы хорошо известны..."
 mongol.50.a:0 "Провести массовые проверки троек."
 mongol.50.b:0 "У нас есть более важные проблемы."
 mongol.51.t:0 "Перестановки в партии"
 mongol.51.d:0 "Наша партия разделена между левыми во главе с Чойбалсаном, правыми вроде Анандына Амара и худонцами, к которым относится бывший премьер-министр Пэлжидийн Гэндэн. Крайняя раздробленность партии привела к капиталистическим реформам правых 1926–1928 годов и разорению, вызванному ультралевым подходом к коллективизации в 1928–1932 годах. \n\nРезкие перемены в правительстве отрицательно сказываются на жизни народа. Постоянное смещение политического курса можно объяснить многими причинами, но главная очевидна: в партию проникли иностранные агенты и пособники государств [JAP.GetNameDef] или [CHI.GetNameDef]. Это недопустимо, и некоторых подозрительных членов, возможно, придётся тем или иным способом удалить из правительства."
 mongol.51.a:0 "Проверить всех и тщательно изучить их преданность."
 mongol.51.b:0 "Может быть, проблема в нашей точке зрения?"
 mongol.52.t:0 "Проблема лам"
 mongol.52.d:0 "Буддизм глубоко укоренился в умах и сердцах граждан, а ламы и монахи составляют 10% населения страны. Столь крупный центр силы нельзя игнорировать: восстания 1932 года и заговор Лхумбэ 1933 года ясно показывают необходимость вмешательства до того, как положение станет слишком напряжённым. К счастью, со времени возвышения Чойбалсана у нас уже есть опыт ограничения власти лам. \n\nСохранение верности государству [SOV.GetAdjective], его лидеру [SOV.GetLeader] и принципам коммунизма требует провести эту операцию как можно скорее."
 mongol.52.a:0 "У нас нет другого выбора."
 mongol.52.b:0 "Буддизм несёт истинный дух народа государства [MON.GetAdjective]!"
 mongol.53.t:0 "Вопрос руководства"
 mongol.53.d:0 "Наши информаторы собрали доказательства готовящегося захвата правительства пособниками государства [JAP.getAdjective] и прислужниками империалистов, сумевшими переправить оружие через плохо охраняемые участки границы и спрятать его в известных местах. В некоторых перехваченных телеграммах упоминаются «высшие эшелоны власти», а недавно полученное письмо указывает на нынешнего лидера страны — [MON.getLeader]. \n\nДальнейшее расследование выявило ещё несколько политиков, регулярно контактирующих с контрреволюционными элементами. \n\nИмея достаточно доказательств, мы должны привлечь виновных к ответственности и назначить нового председателя на предстоящие неспокойные времена."
 mongol.53.a:0 "Чойбалсан — единственный логичный выбор."
 mongol.54.t:0 "[MON.getLeader] тяжело заболел!"
 mongol.54.d:0 "Поздно вечером вчерашнего дня [MON.getLeader], как обычно, работал над одним из последних правительственных указов, касавшихся внутреннего положения нашей процветающей нации. Когда он не ответил на звонок секретаря, тот пришёл в кабинет и обнаружил Великого Мыслителя без сознания на полу. \n\nЕго немедленно доставили в Улан-Баторскую больницу, где местные врачи диагностировали тяжёлое заболевание, которое в будущем помешает ему эффективно управлять страной. \n\nПока неизвестно, ухудшится ли его состояние, но лучше сохранять бдительность."
 mongol.54.a:0 "Что мы можем с этим сделать?"
 mongol.55.t:0 "Новый преемник во главе партии?"
 mongol.55.d:0 "Долгое время среди населения нашей страны распространяются слухи о физическом и психическом здоровье людей. [MON.getLeader]Как это влияет [MON.GetHerHis] принятия решений и общего международного престижа страны, представленного [MON.GetHerselfHimself]. \n\nПохоже, что наш лидер уже спланировал и рассмотрел вопрос о передаче власти молодому поколению коммунистов, некоторые из которых в ближайшее время полностью подтвердят государственную политику.\n\nПосле некоторых соображений, [MON.getLeader] По его словам, председатель партии должен быть..."
 mongol.55.a:0 "Цеденбал, доказавший преданность делу"
 mongol.55.b:0 "Председатель? Почему не председательница?"
 mongol.56.t:0 "Монголия просит о присоединении!"
 mongol.56.d:0 "Наши экономические связи и политическое влияние достигли невиданных высот, и новое правительство государства [MON.getAdjective] издало открытый указ, в котором его молодой парламент объявил о решении войти в состав государства [SOV.getNameDef] как союзная республика или автономный округ. \n\nНесмотря на братские и сестринские узы между нашими народами, крайне важно сохранить репутацию великой, но не угнетающей державы. Более того, если мы не хотим, чтобы другие мировые державы сочли нас суровыми империалистами, лучше оставить эти чистые души их собственной участи."
 mongol.56.a:0 "А почему бы и нет?"
 mongol.56.b:0 "Мы вовсе не империалисты!"
 mongol.57.t:0 "Государство [SOV.getAdjective] отклонило нашу просьбу"
 mongol.57.d:0 "Заявив, что братство наших народов принесёт гораздо больше пользы, если оба государства сохранят независимый статус, [SOV.getLeader] вежливо отклонил скромную просьбу нашего молодого парламента о присоединении. \n\nВ секретной телеграмме центральные власти уведомили нас, что международное давление на правительство государства [SOV.getAdjective] уже достаточно велико, поэтому они предпочитают сохранить нынешний дипломатический статус наших стран."
 mongol.57.a:0 "Раз они так хотят..."
 mongol_khalkin_gol.1.t:0 "Обнаружена подготовка к [MON.getAdjective]им манёврам!"
 mongol_khalkin_gol.1.d:0 "Несколько часов назад местный штаб получил сообщение о том, что небольшой кавалерийский эскадрон, предположительно [MON.getAdjective]ого происхождения и насчитывающий от 70 до 90 человек, пересёк границу в районе реки Номонхан и занял там позиции, явно заявляя тем самым о своём контроле над этой территорией. \n\nЧерез несколько часов наш конный полк вынудил противника отступить, однако позднее захватчики вернулись уже в большем количестве. Разведка сообщает о сосредоточении значительных сил на их стороне границы, очевидно готовящихся провести некую военную операцию в регионе."
 mongol_khalkin_gol.1.a:0 "Запросить иностранную помощь"
 mongol_khalkin_gol.1.b:0 "Мобилизовать войска!"
 mongol_khalkin_gol.2.t:0 "[MON.getAdjective]ая победа на Халхин-Голе!"
 mongol_khalkin_gol.2.d:0 "Наши первоначальные неудачи в борьбе с империалистами, похоже, ввели высшее командование государства [761.Controller.getNameDef] в заблуждение. В последующие дни некоторые их безрассудные генералы отдавали солдатам один самоубийственный приказ за другим, заставляя их вновь и вновь атаковать укреплённые позиции наших бойцов, защищённые несколькими удачно размещёнными пулемётами... с соответствующими потерями в людях и технике. \n\nНам также удалось захватить несколько танков и изучить их, чтобы разработать или улучшить собственные образцы бронетехники."
 mongol_khalkin_gol.2.a:0 "Вопрос наконец решён"
 mongol_khalkin_gol.2.b:0 "Великая победа нашего народа!"
 mongol_khalkin_gol.3.t:0 "[761.Controller.getAdjective]ая победа на Халхин-Голе!"
 mongol_khalkin_gol.3.d:0 "Первый этап вторжения был блестяще проведён войсками государства [MON.getAdjective], которые стремительно продвинулись в спорный район Номонхана, заняли левый берег реки Халхин-Гол, заменили прежние пограничные знаки и укрепили оборонительные позиции в регионе. \n\nОднако это не остановило вооружённые силы государства [761.Controller.getNameDef], которые через несколько дней вернули позиции и отбили все атаки противника, закрепив своё господство в регионе. \n\nПосле нескольких недель боёв послы государства [MON.getAdjective] принесли извинения за причинённые неудобства и согласились сохранить прежнюю границу, что ознаменовало решительную победу государства [761.Controller.getAdjective] в этом конфликте."
 mongol_khalkin_gol.3.a:0 "Конфликт окончен. Пока что."
 mongol_khalkin_gol.3.b:0 "Нам потребуется время, чтобы оправиться!"
 mongol_khalkin_gol.4.t:0 "Решительной победы добиться не удалось..."
 mongol_khalkin_gol.4.d:0 "Постоянная ротация войск в сочетании с широким использованием радиосвязи, воздушной разведки и грамотным управлением вспомогательными подразделениями не позволила ни одной из сторон использовать возможный прорыв во вражеских линиях и добиться решающего наступления, способного переломить ход сражения. \n\nНедели боёв истощили обе стороны, после чего было заключено перемирие и восстановлены прежние демаркационные линии, тем самым временно завершив этот затянувшийся спор."
 mongol_khalkin_gol.4.a:0 "Этот пограничный спор ещё обязательно возникнет вновь."
 mongol_khalkin_gol.5.t:0 "Эскалация на Халхин-Голе!"
 mongol_khalkin_gol.5.d:0 "Неизвестно, кто придумал эту идею первым, но некоторые предприимчивые солдаты решили обогнать обойденного противника и вступили в сражения на новых основаниях! Такое поведение привело к тому, что конфликт распространился на новые районы, резко обострив и без того тяжелую ситуацию, вынудив наших военных направить все больше и больше сил в спорный район.\n\nСегодня утром посол иностранных дел выступил с запиской, в которой говорится, что наши войска должны покинуть спорный район или столкнуться с последствиями перед лицом официального объявления войны, если не выполнят приказ в течение нескольких часов!\n\nЯсно, что наш враг стремится к войне, и мы покажем им, как эти вопросы решаются!"
 mongol_khalkin_gol.5.a:0 "Бросить в бой все доступные силы!"
 mongol_khalkin_gol.6.t:0 "Интерес государства [SOV.getAdjective] к манёврам"
 mongol_khalkin_gol.6.d:0 "Штабной доклад наших партнёров из государства [SOV.getNameDef] показывает, что их чиновникам хорошо известно о напряжённости между нашими вооружёнными силами и войсками государства [761.Controller.getAdjective] в регионе. Если в ближайшие дни или недели какая-либо сторона увеличит своё присутствие, они готовы направить небольшой контингент для поддержки нашей борьбы в спорном районе. \n\nОднако у всего есть своя цена, и такой шаг определённо укрепит их позиции в наших вооружённых силах, хотим мы того или нет. Разумеется, если только мы не справимся с растущей угрозой самостоятельно..."
 mongol_khalkin_gol.6.a:0 "Пригласить советников государства [SOV.getAdjective]"
 mongol_khalkin_gol.6.b:0 "Мы справимся с этим сами"
 mongol_democratic.1.t:0 "Нападение на Великий хурал!"
 mongol_democratic.1.d:0 "Гражданские беспорядки в сельских районах страны вызвали серьёзную обеспокоенность представителей аймаков, собравшихся на чрезвычайную сессию Великого хурала, объявленную несколько недель назад. \n\nВсё шло согласно повестке дня, пока представители Хэнтийского и Восточного аймаков не выступили с пламенной речью о революционных методах и преданности коммунистическим идеалам. Их внезапно прервала группа неизвестных, застреливших нескольких охранников хурала и бросивших ручные гранаты в охваченную паникой толпу представителей. \n\nВ возникшем хаосе многие депутаты стали жертвами нападения, прежде чем оставшаяся охрана уничтожила всех злоумышленников. \n\nПодобное развитие событий может означать лишь одно:"
 mongol_democratic.1.a:0 "Террористический акт!"
 mongol_democratic.1.b:0 "Вмешательство!"
 mongol_democratic.2.t:0 "Попытка переворота при поддержке государства [SOV.getAdjective]"
 mongol_democratic.2.d:0 "Разочарованные недавними изменениями и реализацией государственной политики, различные группы населения открыто начали выражать протест и организовывать демонстрации, требуя смены политического режима и отмены реформ, введённых [ROOT.getLeader]! \n\nРанее полиция разгоняла протестующих мирными и не совсем мирными средствами, однако на этот раз некоторым из них удалось добыть огнестрельное и зажигательное оружие неизвестного происхождения, вынудив местную полицию отступить в правительственный район Улан-Батора. Толпа разбила палатки перед центральным зданием премьер-министра и постоянно требовала его отставки. \n\nЛишь через несколько дней полицейские эскадроны, усиленные территориальными отрядами, сумели разогнать толпу и арестовать зачинщиков. На допросе некоторые из них признались в подготовке открытого восстания в поддержку государства [SOV.getAdjective] в западных районах страны! Наши информаторы подтверждают, что с врагом необходимо покончить одним стремительным ударом вооружённых сил."
 mongol_democratic.2.a:0 "Пора обезглавить змею!"
 mongol_democratic.3.t:0 "Государство [From.GetNameDefCap] просит гарантий"
 mongol_democratic.3.d:0 "Заявив, что демократические основы никогда не имели прочных позиций в Центральной Азии, дипломаты государства [FROM.getAdjective] обратились к нашим послам на одной из ежегодных международных встреч и запросили официальную гарантию поддержки «ради стабильности и процветания азиатского региона». \n\nНесмотря на некоторые идеологические разногласия, огромное географическое расстояние и старые споры, их правительство, похоже, готово укрепить дипломатические институты и выйти на мировую арену под защитой государства [ROOT.getNameDef]. От нас требуется лишь публично объявить о дипломатической поддержке их дела."
 mongol_democratic.3.a:0 "В будущем они станут ценным союзником"
 mongol_democratic.3.b:0 "Простите, кто просит НАШЕЙ поддержки?"
 mongol_democratic.4.t:0 "Государство [FROM.getNamedefCap] соглашается защищать нас"
 mongol_democratic.4.d:0 "Подчеркнув важность защиты демократических институтов по всему миру, посол государства [FROM.getAdjective] передал подписанное соглашение следующего содержания: \n\n«Отныне и до рассвета цивилизации, пока государство [ROOT.getNamedef] стремится сохранять демократию в своих землях и вокруг них, государство [FROM.getNamedef] всей своей военной мощью и экономической силой будет поддерживать свободу и самоопределение, уважать границы и стремиться к укреплению дипломатических связей!» \n\nОчевидная дипломатическая победа и ещё одна гарантия нашей внутренней безопасности на мировой арене. Ура!"
 mongol_democratic.4.a:0 "Дипломатия торжествует!"
 mongol_democratic.5.t:0 "Государство [FROM.getNamedefCap] отказывается предоставить защиту"
 mongol_democratic.5.d:0 "Несмотря на все наши усилия, иностранный посол с сожалением сообщил делегации, что государство [FROM.getNamedef] не располагает дипломатическими или военными средствами для защиты демократических институтов государства [ROOT.getNamedef]. \n\nНекоторые радикальные депутаты уже высказывают сомнения, способен ли [FROM.getLeader] вообще найти нашу страну на карте, учитывая содержание официального ответа иностранной администрации."
 mongol_democratic.5.a:0 "Похоже, мы предоставлены сами себе..."
 mongol_democratic.6.t:0 "Государство [MON.getNamedefCap] отзывает дипломатов"
 mongol_democratic.6.d:0 "Сегодня утром над посольством государства [MON.getAdjective] был замечен густой дым, явно указывающий, что его сотрудники сжигают или уничтожают государственные документы. \n\nВ ответ на официальный запрос о действиях делегации представители государства [MON.getNameDef] предъявили особый указ о «немедленном закрытии всех консульств и посольств государства [MON.getNameDef], находящихся в государстве [ROOT.getNameDef]», что означает официальный разрыв дипломатических отношений между нашими странами по их инициативе."
 mongol_democratic.6.a:0 "Приближается война?"
 mongol_democratic.7.t:0 "Государство [MON.getNamedefCap] отзывает дипломатов из государства [FROM.getNamedefCap]"
 mongol_democratic.7.d:0 "Позиция государства [MON.getAdjective] в отношении различных врагов народа давно известна, однако его недавний дипломатический шаг удивил многих: государство [MON.getNamedefCap] публично объявило, что больше не станет проводить какие-либо дипломатические переговоры с режимами, подобными государству [FROM.getNamedefCap]. \n\nКроме того, вооружённые силы государства [MON.getAdjective], похоже, мобилизуют значительную часть резерва, тогда как дипломаты страны активно покидают государство, оказавшееся в дипломатической изоляции."
 mongol_democratic.7.a:0 "Пора положить конец этой угрозе"
 mongol_democratic.8.title:0 "Дипломатическая миссия государства [MON.getAdjective] начинает переговоры о зарубежном союзе"
 mongol_democratic.8.desc:0 "\nРазведка сообщает об усилении активности Министерства иностранных дел государства [MON.getAdjective]: его дипломаты направляются в другие страны, очевидно пытаясь наладить дружеские отношения с потенциальными союзниками. \n\nПока неизвестно, принесут ли переговоры результаты, однако необходимо следить за развитием ситуации и готовиться к худшему для нас исходу."
 mongol_democratic.8.a:0 "Следует сохранять бдительность"
 mongol_democratic.10.t:0 "Монголия просит о примирении"
 mongol_democratic.10.d:0 "Делегация Монголии установила контакты с Комиссией по делам Монголии и Тибета, пытаясь урегулировать продолжающиеся споры о статусе Внешней Монголии и наших претензиях на неё. \n\nХотя государство [MON.getNamedef] официально сохраняет нейтралитет, оно, похоже, постепенно входит в нашу сферу влияния, предоставляя уникальную возможность заключить союз с крупнейшей страной Центральной степи, контролирующей путь к уязвимому тылу российского Дальнего Востока. \n\nСледует ли нам примирить амбиции и обеспечить безопасность северной границы?"
 mongol_democratic.10.a:0 "Пока отложим разногласия"
 mongol_democratic.10.b:0 "У нас на них другие планы"
 mongol_democratic.11.t:0 "Государство [FROM.getNamedefCap] соглашается на примирение"
 mongol_democratic.11.d:0 "Осознав стратегическое значение нашей страны и стремясь сохранить нашу приверженность их делу, чиновники государства [FROM.getAdjective] из Комиссии по делам Монголии объявили об отказе от прежней враждебности и восстановлении если не дружественных, то нейтральных отношений между нашими народами. \n\nСближение с Китаем может оттолкнуть другие региональные державы, но так ли это важно?"
 mongol_democratic.11.a:0 "Дипломатия торжествует!"
 mongol_democratic.12.t:0 "Государство [FROM.getNamedefCap] не заинтересовано в нашей инициативе примирения"
 mongol_democratic.12.d:0 "Наша делегация получила вежливый отказ от представителей государства [FROM.getAdjective]. Они признают борьбу нашего народа за признание и самоопределение, однако их правительство сейчас занято «более срочными вопросами и потому не может сосредоточиться на подобных дипломатических инициативах». \n\nМы сделали всё возможное, чтобы договориться с центральным правительством. Если оно не желает сотрудничать, возможно, найдутся другие региональные силы?"
 mongol_democratic.12.a:0 "Рассмотрим и другие варианты"
 mongol_democratic.15.t:0 "Государство [FROM.getNamedefCap] просит пересмотреть претензии"
 mongol_democratic.15.d:0 "Стремясь укрепить сотрудничество между нашими странами, чиновники государства [FROM.getAdjective] обратились к Комиссии по делам Монголии и Тибета с просьбой снизить напряжённость ради мирного и процветающего сосуществования наших народов. \n\nГлава делегации заявил, что на протяжении многих лет государство [ROOT.getNameDef] считало земли Внешней Монголии автономной областью собственно Китая, хотя это спорный вопрос с учётом права на самоопределение, провозглашённого их государством. \n\nСтремясь к сближению, а не эскалации, их страна готова предоставить определённые уступки в обмен на пересмотр претензий. Похоже, это взаимовыгодная сделка."
 mongol_democratic.15.a:0 "Потребовать демонстрации политической поддержки"
 mongol_democratic.15.b:0 "Запросить поставки оружия"
 mongol_democratic.15.c:0 "Попросить промышленные концессии"
 mongol_democratic.15.e:0 "Потребовать передачи военной промышленности"
 mongol_democratic.16.t:0 "Государство [FROM.getNamedefCap] требует демонстрации политической поддержки"
 mongol_democratic.16.d:0 "В эти неспокойные времена преданность значит всё, и [FROM.getLeader], понимая это, потребовал продемонстрировать верность политической борьбе государства [FROM.getNameDef] посредством официального дипломатического визита с данью. \n\nНесмотря на высокую цену предложения, нас заверили, что другие способы оплаты могли бы оказаться ещё тяжелее."
 mongol_democratic.16.a:0 "Необходимое обязательство"
 mongol_democratic.17.t:0 "Государство [FROM.getNamedefCap] запрашивает вооружение"
 mongol_democratic.17.d:0 "Стремясь укрепить нынешнюю армию, [FROM.getLeader] потребовал предоставить военное снаряжение и гарнизон из «лучших из лучших», который будет направлен добровольческим контингентом для участия в войнах государства [FROM.getAdjective]. \n\nНашим дипломатам удалось смягчить вторую часть условий, фактически ограничив обязательства лишь поставкой требуемого стрелкового оружия."
 mongol_democratic.17.a:0 "Выгодная сделка?"
 mongol_democratic.18.t:0 "Государство [FROM.getNamedefCap] просит перенести предприятие гражданской промышленности"
 mongol_democratic.18.d:0 "Национализация промышленности в начале прошлого десятилетия вытеснила капитал государства [FROM.getAdjective] и лишила многих торговцев государства [FROM.getNameDef] работы и накоплений. \n\nЗаявив, что это печальное развитие событий необходимо исправить, [FROM.getLeader] потребовал вернуть «законное имущество» в их руки..."
 mongol_democratic.18.a:0 "Достойная жертва"
 mongol_democratic.19.t:0 "Государство [FROM.getNamedefCap] требует передачи военной промышленности"
 mongol_democratic.19.d:0 "Военная клика государства [FROM.getNameDef], похоже, занимает сильные позиции в правительстве, поскольку её представители потребовали передать военные предприятия в интересующем их регионе в обмен на отказ от спорных претензий. \n\nПри таких условиях они готовы отказаться от любых экспансионистских замыслов в отношении этих земель, но цена чрезвычайно высока..."
 mongol_democratic.19.a:0 "Что ж..."
 mongol_democratic.20.t:0 "Государство [FROM.getNameDefCap] просит защиты"
 mongol_democratic.20.d:0 "Мы получили необычную просьбу от государства [FROM.getNameDef]. Его чиновники, заняв твёрдую позицию в поддержку государства [ROOT.getAdjective], объявили о желании вновь войти в состав державы государства [ROOT.getNameDef] как автономный регион, значительно укрепив безопасность внешних рубежей и расширив наше влияние в Великой степи. \n\nКаково будет окончательное решение? Позволим ли мы отколовшемуся региону вернуться?"
 mongol_democratic.20.a:0 "Разумеется, зачем отказывать?"
 mongol_democratic.20.b:0 "Нас это не интересует"
 mongol_democratic.21.t:0 "Статус протектората подтверждён"
 mongol_democratic.21.d:0 "Высшая канцелярия [FROM.getLeader] заверила нас, что просьба была рассмотрена и немедленно принята без малейших колебаний! \n\nВ утренней речи перед народом [FROM.getLeader] объявил праздничный день в честь возвращения одной из бывших областей внешней границы в державу Великого Китая. Отныне она будет способствовать экономическому росту, военной мощи и объединению всей китайской нации! Ликующая толпа приветствует «давно потерянных братьев и сестёр» под знамёнами китайского союза!"
 mongol_democratic.21.a:0 "Великий день для нашего народа!"
 mongol_democratic.22.t:0 "Статус протектората отклонён"
 mongol_democratic.22.d:0 "Даже лучшие дипломаты и их искренние обещания не смогли убедить упрямых чиновников государства [FROM.getAdjective] позволить нам войти в их державу в качестве автономного региона. \n\nЗаявив, что «в их интересы не входит восстановление контроля над отколовшейся провинцией прошлого», они отвергли и наше второе обращение!"
 mongol_democratic.22.a:0 "Им действительно это неинтересно?!"
 mongol_democratic.24.t:0 "Монголия поднимает вопрос Тувы"
 mongol_democratic.24.d:0 "Агрессивная риторика [MON.getAdjective] Официальные лица по отношению к своим соседям в сочетании с прокитайской позицией вызвали обоснованные опасения различных политиков нашей страны.\n\nПохоже, что [MON.getNameDef] Пропагандистские усилия продвигают создание единого монгольского государства на границе 1911 года, в том числе Урянхайского края, родины многих тувинцев и русских.\n\nМы приложим все усилия для того, чтобы страна оставалась в наших руках в эти тревожные и опасные времена."
 mongol_democratic.24.a:0 "Сделаем всё возможное, чтобы сдержать их"
 mongol_genden.1.t:0 "Объявлена политика «Обогащайтесь»"
 mongol_genden.1.d:0 "Экономическая политика нового курса и её успех были серьёзно подорваны отменой неофициальной государственной программы «Обогащайтесь», призывавшей всех граждан страны накапливать капитал ради личной и коллективной стабильности. \n\nПытаясь вновь укрепить свои позиции в стране, Гэндэн стремится любыми средствами объединить и обогатить собственный народ, какими бы суровыми ни оказались возможные последствия. \n\nОжидается, что новая политика будет активно проводиться по всей стране в течение года, помогая бедным крестьянам и рабочим, тогда как Центральный комитет станет следить за ходом её реализации посредством ежемесячных экономических отчётов. \n\nЛишь время покажет, насколько успешной она окажется."
 mongol_genden.1.a:0 "Вперёд, товарищи!"
 mongol_genden.2.t:0 "Граждане открывают новую мастерскую"
 mongol_genden.2.d:0 "Сообщается, что несколько наших инициативных товарищей открыли гражданскую мастерскую, способную выпускать товары народного потребления и тем самым снизить экономическую зависимость аймака от столицы. \n\nНекоторые местные жители уже присоединяются к рабочей силе, а избранный на месте мастер контролирует производство и распределение товаров для гражданских нужд под строгим надзором правительства из столицы."
 mongol_genden.2.a:0 "Отличная работа!"
 mongol_genden.3.t:0 "Построено новое предприятие по производству вооружений"
 mongol_genden.3.d:0 "Увидев трудности со снабжением местного гарнизона и его острую потребность в современном стрелковом оружии, отзывчивые жители собрали достаточно средств для строительства склада боеприпасов и соответствующей инфраструктуры, предназначенной для снабжения народа винтовками и другим военным снаряжением. \n\nНекоторые образцы оружия, похоже, не уступают продукции официальных производителей, а возможно, даже превосходят её!"
 mongol_genden.3.a:0 "Оружие — в руки народа!"
 mongol_genden.4.t:0 "Расширены местные дороги"
 mongol_genden.4.d:0 "Различные строительные компании получили крупные пожертвования от наших граждан, что позволило улучшить дорожное сообщение по всей стране и укрепить власть народа над дикой природой региона. \n\nОжидается, что такое развитие положительно скажется на эффективности сухопутных войск, которые смогут воспользоваться преимуществами современной логистики."
 mongol_genden.4.a:0 "Так мы сможем пойти ещё дальше!"
 mongol_genden.5.t:0 "Жители укрепляют свои дома"
 mongol_genden.5.d:0 "Пытаясь сохранить накопленный капитал, некоторые напуганные граждане, как сообщается, расширили подвалы и построили укрепления внутри и вокруг своих домов. Определённо неожиданный поворот, учитывая, что они находятся под защитой наших славных вооружённых сил. \n\nОднако эти укрепления могут оказаться полезными для наших защитников в тяжёлые времена войны."
 mongol_genden.5.a:0 "Они сделали ЧТО?"
 mongol_genden.6.t:0 "Обнаружена коррупционная схема"
 mongol_genden.6.d:0 "Анализ движения капитала за последний месяц показал, что часть государственных средств переводилась между различными счетами сберегательных касс, пока в конце концов не оказалась на сберегательных книжках нескольких депутатов. \n\nДальнейшее расследование Комитета по борьбе с коррупцией ясно указывает на тщательно замаскированную коррупционную схему. \n\nОднако следователям требуются дополнительные время и средства, чтобы завершить анализ и подготовить отчёт. Что нам делать?"
 mongol_genden.6.a:0 "Преследовать виновных!"
 mongol_genden.6.b:0 "Начать длительный официальный процесс."
 mongol_genden.7.t:0 "Исчезают производственные материалы"
 mongol_genden.7.d:0 "Мастер одного из заводов представил отчёт о пропаже производственных материалов с линий. Проблема обнаружилась лишь тогда, когда упаковочная станция не смогла заполнить последние пять из двухсот контейнеров товарами. \n\nПока неизвестно, кто мог быть вредителем, однако многие рабочие уже заявили о готовности трудиться по несколько дополнительных часов в день, чтобы выполнить государственный заказ. Какая храбрость и ответственность!"
 mongol_genden.7.a:0 "Придётся повысить производственные квоты на этот месяц."
 mongol_genden.8.t:0 "Инфляция растёт"
 mongol_genden.8.d:0 "Поскольку население накапливает капитал в невиданных масштабах, государственные учреждения вынуждены вмешаться и регулировать рынок, его спрос и предложение, чтобы предотвратить обвал национальной валюты. \n\nТакое вмешательство требует больших затрат времени и средств, и осуществлять его может и должен только Центральный банк, которому будет поручено регулировать экономику в ближайшее время."
 mongol_genden.8.a:0 "Монголбанк от этого пострадает."
 mongol_genden.10.t:0 "Проблема сторонников государства [SOV.getAdjective]"
 mongol_genden.10.d:0 "Отмечая последние политические события в [SOV.getNameDef], [ROOT.getLeader] В своих долгих философских дебатах с самим собой и своими подчиненными понял, что построение коммунизма в значительной степени зависит от фундамента внутренних и внешних агентов, способных поддержать «правоверного» правителя на его приходе к власти изнутри и извне желаемой страны.\n\nУчитывая, насколько велика роль [SOV.getAdjective] Политики занимались строительством коммунизма в Монголии, и до сих пор возникает вопрос о том, поддерживают ли некоторые из людей в правительстве страны прокоммунистическую политику.[SOV.getAdjective] действия по достижению своих личных или общинных целей.\n\nПосле долгих раздумий, [ROOT.getLeader] Мы решили решить эту проблему в первую очередь и, надеюсь, для всех."
 mongol_genden.10.a:0 "Мы не такие, как они: никаких чисток!"
 mongol_genden.10.b:0 "Устранить лишь самые радикальные элементы."
 mongol_genden.10.c:0 "Ради безопасности не оставить никого!"
 mongol_genden.14.t:0 "Гэндэн возвращается в Монголию!"
 mongol_genden.14.d:0 "После всех испытаний и тревог, через которые нам пришлось пройти, весть о его возвращении наконец достигла Улан-Батора! \n\nВ сопровождении небольшой группы из четырёх человек он покинул транспорт, доставивший его к границе государств [SOV.getAdjective] и [MON.getAdjective], которую они пересекли до рассвета. Ступив на землю Родины, герой нашей борьбы за выживание радостно приветствовал народ, а по его измождённому и усталому лицу катились слёзы счастья. \n\nНа следующий день состоялась официальная церемония, где перед тысячами людей он публично объявил о возвращении на Родину и намерении восстановить страну, которую был вынужден покинуть в тяжёлое время!"
 mongol_genden.14.a:0 "Мы все рады снова тебя видеть!"
 mongol_genden.15.t:0 "Гэндэн казнён в СССР!"
 mongol_genden.15.d:0 "Местный житель НКВД доставил небольшую записку в кабинет [ROOT.getLeader] С горем «абсолютно секретно». В записке содержались протоколы захвата и допроса рядового Гендена, который был признан на одном из железнодорожных вокзалов неким наблюдателем. [SOV.getAdjective] Официально.\n\nВ последние дни своей жизни Генден был признан виновным в контрреволюционной деятельности, саботаже бесчисленных дипломатических миссий и шпионаже в пользу [JAP.getNameDef] и его марионеточные режимы. Все вышеперечисленное было подтверждено и подписано самим Генденом.\n\nНесмотря на некоторые усилия наших дипломатов, его суд был проведен быстро, и его приговор не мог быть согласован."
 mongol_genden.15.a:0 "Нам будет его не хватать"
 mongol_genden.15.b:0 "Скатертью дорога"
 mongol_genden.16.t:0 "Обнаружен западный маршрут!"
 mongol_genden.16.d:0 "Полученные железнодорожные планы указывают, что в ближайшие недели Гэндэна отправят поездом из Москвы к месту его «отдыха» в Крыму по западной линии через следующие города:\nКалуга \nБрянск \nШостка \nКиев \nКировоград \nДнепропетровск \nСевастополь \n\nНаши агенты уже установили связи с несколькими тактическими группами в регионе. Они предложили устроить беспорядки в столице государства [UKR.getAdjective] — Киеве, что создаст идеальную возможность для побега нашего любимого Гэндэна в возникшем хаосе."
 mongol_genden.16.a:0 "Значит, целью станет Киев."
 mongol_genden.17.t:0 "Обнаружен южный маршрут!"
 mongol_genden.17.d:0 "Согласно расписанию, поезд отправится по южной железнодорожной линии через следующие крупные окружные центры:\nТула \nОрёл \nКурск \nБелгород \nХарьков \nСталино \nСевастополь \n\nНа маршруте имеется несколько потенциально слабых мест, однако из-за особенностей железной дороги и сильного присутствия НКВД атаковать поезд или станцию напрямую было бы безрассудно. Тем не менее нам удалось найти связи с особенно предприимчивыми чиновниками в нескольких депо, и наиболее перспективным выглядит Харьков. \n\nЕсли предложить местным заместителям значительную взятку, они смогут одновременно изменить расписание нескольких поездов, позволив либо пересадить Гэндэна на другой состав, либо перенаправить поезд в нужное место."
 mongol_genden.17.a:0 "Значит, Харьков получит крупное «пожертвование»."
 mongol_genden.18.t:0 "Обнаружен юго-восточный маршрут!"
 mongol_genden.18.d:0 "Этот необычный маршрут, похоже, был открыт совсем недавно и проходит от юго-восточных окраин Москвы исключительно по российской территории, полностью минуя Украину. \n\nОжидается, что поезд проследует через города: \nЛипецк \nВоронеж \nМиллерово \nРостов \nКраснодар \nНовороссийск, \nпосле чего Гэндэна перевезут в Крым на корабле, и дальнейшее спасение станет невозможным. \n\nРайон Ростова, несмотря на кажущуюся безопасность, населён людьми, имеющими опыт быстрых и агрессивных ударов по движущимся целям ещё со времён Великой войны и Красной революции..."
 mongol_genden.18.a:0 "Ростов? Кто у нас там есть?"
 mongol_genden.19.t:0 "Железнодорожный вокзал Киева уничтожен!"
 mongol_genden.19.d:0 "Очередное обычное утро на Киевском вокзале превратилось в полный хаос: после нескольких подземных толчков бетонные стены прекрасного здания задрожали, а метровые металлические балки начали гнуться, не выдерживая тяжести потолка. Вскоре значительная часть вокзала рухнула под собственным весом, уничтожив несколько стоявших там товарных поездов. \n\nК счастью, тревогу подняли вовремя, и часть персонала успела покинуть разрушающееся крыло здания, после чего НКВД совместно с милицией оцепили район для расследования происшествия. \n\nПозднее одного из охранников станции нашли без сознания в его кабинете. Он помнил лишь несколько теней, появившихся у него за спиной, прежде чем всё погрузилось во тьму. \n\n«Происшествие заслуживает дальнейшего расследования», — прокомментировал местный замполит."
 mongol_genden.19.a:0 "ЧТО?!"
 mongol_genden.19.b:0 "О нет! Впрочем, что там с Гэндэном..."
 mongol_genden.21.t:0 "Бюрократический хаос в Харькове"
 mongol_genden.21.d:0 "Портфель со средствами и инструкциями оставили в Харьковском железнодорожном депо, где один из наших людей доставил его в служебное управление и передал местному мастеру. \n\nПосле некоторых «тяжёлых раздумий» и нескольких убедительных действий нашего агента мастер согласился совместить время отправления нескольких поездов, прибывающих в Харьков в ближайшие дни. \n\nИз-за задержек на станции отделить Гэндэна от сопровождавшего его резидента НКВД оказалось сравнительно легко. Под видом профессора восточноазиатских наук и литературы его отправили другим поездом в долгий путь обратно в Центральную Азию. \n\nНам остаётся лишь проследить за поездом и убедиться, что он достигнет пункта назначения."
 mongol_genden.21.a:0 "Они хорошо справились"
 mongol_genden.22.t:0 "Казаки совершают набег на пассажирский поезд у Ростова!"
 mongol_genden.22.d:0 "По Поволжью и восточной части Украины распространились тревожные новости: неизвестный кавалерийский отряд перехватил и разграбил пассажирский поезд, перевозивший людей в лазурный порт Новороссийск. \n\nНеизвестная конная банда приблизилась к составу со стороны заката, когда тот пополнял запасы перед дальнейшим движением на юг, и потребовала «плату» за безопасный проезд. После истечения срока ультиматума часть банды проникла в вагоны и начала отбирать имущество пассажиров. \n\nКогда один из присутствовавших политруков попытался разоружить налётчика, прозвучал случайный выстрел, и поезд погрузился в хаос: мирные жители разбегались в разные стороны, а сотрудники НКВД вступили с бандитами в ближний бой. Оказавшись в меньшинстве, они пали героями в неравной схватке, после чего кавалеристы заложили взрывчатку, подожгли остатки состава и скрылись во тьме."
 mongol_genden.22.a:0 "Простите, ЧТО?!"
 mongol_genden.22.b:0 "Это послужит им уроком"
 mongol_greater_mongolia.1.t:0 "Операция завершилась успехом"
 mongol_greater_mongolia.1.d:0 "Вторжение и захват спорного района проходят согласно намеченному плану. \n\nПосле того как наш пограничный патруль «не сумел ответить» на экстренный вызов, чиновники начали официальное расследование и направили дипломатические запросы на проведение поисков в спорных районах и арест бандитов, предположительно совершивших преступления против нашего народа. \n\nЗатем наши эскадроны установили контроль над жизненно важной инфраструктурой региона, включая почтовую службу, железные дороги, дорожные развязки, телеграфные и телефонные линии. Местный гарнизон был вынужден сложить оружие и присоединиться к нашим войскам для идеологической обработки и допросов. \n\nЧасть местного населения всё ещё пытается протестовать против новой власти, но эти голоса слабы и разобщены."
 mongol_greater_mongolia.1.a:0 "Великий день для народа государства [ROOT.getAdjective]!"
 mongol_greater_mongolia.2.t:0 "Катастрофа на юге"
 mongol_greater_mongolia.2.d:0 "Воодушевлённые первоначальным успехом операции, наши силы заняли несколько приграничных поселений и проследили, чтобы мирные жители не создавали ополчение против освободителей страны. \n\nОднако пока войска готовились продвинуться в глубину вражеской территории, крупномасштабное контрнаступление разгромило фланги чрезмерно растянутой армии. Местные партизаны перерезали линии снабжения в тылу, вынудив войска импровизировать на месте и бросить часть людей и снаряжения ради спасения основных сил. \n\nВернувшиеся солдаты теперь залечивают раны и готовятся к новым сражениям."
 mongol_greater_mongolia.2.a:0 "Похоже, мы переоценили свои силы"
 mongol_greater_mongolia.3.t:0 "Достигнут тупик"
 mongol_greater_mongolia.3.d:0 "Несмотря на первоначальный успех операции, продвижение вооружённых сил было серьёзно остановлено мощной оборонительной линией, созданной в спорном регионе. Солдатам пришлось окапываться на враждебной местности, пока военная полиция пыталась обезопасить тыл от партизан противника. \n\nПосле нескольких безрезультатных столкновений местные командиры предложили отказаться от этой военной авантюры, пока положение не стало критическим: противник может перебросить в район дополнительные войска и тяжёлую артиллерию, тогда как мы не способны выделить намного больше ресурсов для предполагавшегося коротким конфликта."
 mongol_greater_mongolia.3.a:0 "Мы многое извлекли из этого."
 mongol_greater_mongolia.4.t:0 "Вражеские силы отброшены"
 mongol_greater_mongolia.4.d:0 "Безрассудные вражеские силы, насчитывавшие несметные тысячи солдат, вторглись на наши родные земли, пытаясь забрать то, что они называют «своим по праву»! \n\nПока захватчики грабили и разоряли отдалённые районы, наши могучие воины собрали силы и под знамёнами лучшего генерала выступили навстречу врагу, чтобы дать решительный бой за Родину. \n\nЖалкие противники не выдержали объединённого натиска армии и партизан и отступили, бросив часть снаряжения и пленных."
 mongol_greater_mongolia.4.a:0 "Мы уничтожим их жалкую армию до последнего человека."
 mongol_greater_mongolia.5.t:0 "Наши земли захвачены!"
 mongol_greater_mongolia.5.d:0 "Возможно, причиной стала ошибка генералов или передовых наблюдателей, а может, недостаточно быстрая реакция армии — мы не знаем наверняка. \n\nИзвестно лишь то, что связь с одним из передовых регионов полностью потеряна. Противник обеспечил собственные линии коммуникации и серьёзно нарушил наши, поэтому резервы не смогли мобилизовать достаточно сил, чтобы разгромить врага. \n\nТеперь слишком поздно: мы потеряли одну из своих территорий из-за назойливых захватчиков, кем бы они ни были. Мы вернёмся, когда придёт время!"
 mongol_greater_mongolia.5.a:0 "Как теперь смотреть в глаза нашему народу?"
 mongol_greater_mongolia.6.t:0 "Достигнут тупик"
 mongol_greater_mongolia.6.d:0 "Стремительно наступавший противник занял несколько приграничных деревень и городов, однако местный гарнизон, усиленный мобилизованными вооружёнными силами, создал опорные пункты на линии его продвижения, которую враг не смог преодолеть в течение последних недель. \n\nТеперь наши партизаны разоряют его линии снабжения, а войска сдерживают передвижение на фронте. Разочарованный противник, похоже, переходит к тактическому отступлению, оставляя крестьянам разорённые деревни и разграбленные поля. \n\nРешительный успех, хотя и достигнутый высокой ценой."
 mongol_greater_mongolia.6.a:0 "Мы сможем удерживать позиции ещё дольше!"
 mongol_greater_mongolia.10.t:0 "Монголия предлагает объединение с бурятами"
 mongol_greater_mongolia.10.d:0 "Стремясь возродить связи, объединявшие два народа на протяжении веков до распространения наследия Красной революции и теории национальных государств, дипломаты государства [MON.getAdjective] обратились к нашим чиновникам с предложением о возможном воссоединении бурятских и халха-монгольских земель. \n\nПомимо надлежащего представительства в Государственном Великом и Малом хуралах, они обещают уважать национальную самобытность и права бурятского народа и других жителей региона. \n\nЕсли мы откажемся, они могут даже выступить против нас. Позволим ли мы им вернуть эти земли?"
 mongol_greater_mongolia.10.a:0 "Одной проблемой меньше"
 mongol_greater_mongolia.10.b:0 "Мы не отдадим эти земли без боя"
 mongol_greater_mongolia.10.c:0 "Согласиться в обмен на места в хурале"
 mongol_greater_mongolia.11.t:0 "Монголия добивается присоединения Тувы"
 mongol_greater_mongolia.11.d:0 "Стремясь восстановить контроль над монголоязычными землями, делегация государства [MON.getAdjective] обратилась к нашим чиновникам в Кызыле с предложением провести государственный плебисцит по вопросу возвращения Тувинского административного округа в состав собственно Монголии. \n\nПомимо обычных обещаний самоопределения, местной автономии и равного отношения к меньшинствам, чиновники государства [MON.getAdjective] также готовы вложиться в находящуюся в застое экономику региона, чтобы местное население смогло пользоваться всеми экономическими и социальными преимуществами идеологии [MON.GetRulingIdeology]. \n\nКак нам ответить?"
 mongol_greater_mongolia.11.a:0 "Одной проблемой меньше"
 mongol_greater_mongolia.11.b:0 "Зачем нам вообще рассматривать эти условия?"
 mongol_greater_mongolia.11.c:0 "Согласиться в обмен на надлежащее представительство в хурале"
 mongol_greater_mongolia.12.t:0 "Предложение об объединении принято!"
 mongol_greater_mongolia.12.d:0 "Стремясь снизить напряжённость в регионе, чиновники государства [FROM.getNameDef] подписали предложенный договор и передали административный контроль над областью. Наши представители уже занимают новые правительственные учреждения, а инженеры приступают к повторному включению региона в инфраструктурную сеть страны. \n\nВо время торжественного марша последний батальон местной охраны отдал честь прибывающим вооружённым силам государства [ROOT.getAdjective], ознаменовав полную передачу власти над регионом нашему режиму!"
 mongol_greater_mongolia.12.a:0 "Прекрасно!"
 mongol_greater_mongolia.12.b:0 "Истинное единство!"
 mongol_greater_mongolia.13.t:0 "Государство [FROM.getNameDefCap] согласилось на ограниченную автономию"
 mongol_greater_mongolia.13.d:0 "После нескольких дней переговоров стороны пришли к выводу, что объединение государственных аппаратов государств [FROM.getNameDef] и [ROOT.getNameDef] слишком сложно с точки зрения административного и экономического управления. \n\nПредставители государства [FROM.getAdjective] предпочли принять особый статус автономного региона под нашим непосредственным управлением. \n\n«Разделяя экономическое и военное бремя, оба наших народа будут становиться сильнее с каждой неделей и каждым месяцем!» — заявил глава их делегации. \n\nТеперь мы можем начать работу по дальнейшему сближению наших народов!"
 mongol_greater_mongolia.13.a:0 "Очень хорошо"
 mongol_greater_mongolia.14.t:0 "Дипломатические переговоры сорваны"
 mongol_greater_mongolia.14.d:0 "Несмотря на все наши усилия, чиновники государства [FROM.getAdjective] отвергли скромное предложение о панмонгольском сотрудничестве! \n\nВ сегодняшней речи с балкона здания парламента [FROM.getLeader] объявил, что «трусливые представители государства [ROOT.getAdjective] стремятся поработить благородные народы вокруг себя и восстановить грязную и коррумпированную Монгольскую империю в современности». \n\nПосле столь явного проявления неуважения наши послы покинули стол переговоров. Учитывая растущие репрессии против нашего населения в регионе, становится ясно, что обезопасить эти земли можно лишь одним способом..."
 mongol_greater_mongolia.14.a:0 "Мы ещё вернёмся"
 mongol_greater_mongolia.15.t:0 "Предстоящая Улан-Баторская конференция"
 mongol_greater_mongolia.15.d:0 "Центральная Азия, как известно, является полем битвы различных сил, пытающихся подорвать контроль друг друга над этим стратегическим регионом. Многие империи пытались завоевать пастбища всадников и всадниц, стремясь урегулировать народ в своих спорах кому-то на пользу.\n\nТеперь, когда нам удалось укрепить наши внутренние правительства и продемонстрировать только процент нашей реальной силы, в наших интересах искать сотрудничество с энергетическими гигантами региона и посмотреть, как они могут способствовать объединению монгольского народа под одним национальным государством.\n\nТакие политические усилия являются дорогостоящим делом, однако они в значительной степени принесут пользу нам и нашей повестке дня."
 mongol_greater_mongolia.15.a:0 "Начать подготовку!"
 mongol_greater_mongolia.15.b:0 "Это слишком масштабное начинание. Следует всё пересмотреть."
 mongol_greater_mongolia.16.t:0 "Пригласить чиновников государства [SOV.getAdjective]?"
 mongol_greater_mongolia.16.d:0 "Несмотря на спорную политику последних лет, часть которой была направлена на разделение халха-монголов и бурят-монголов, народ государства [SOV.getAdjective] чаще воспринимался нами как друзья и партнёры, а не угнетатели и колонизаторы. \n\nМного лет назад их поддержка спасла Богдо-ханство от полного уничтожения милитаристами государства [CHI.getAdjective] и цинскими империалистами. \n\nНесколько лет спустя их вклад обеспечил установление коммунизма в нашей стране — к добру это или к худу, ещё предстоит выяснить. \n\nУчитывая их заинтересованность в безопасности Транссибирской магистрали, очевидно, что они захотят заручиться нашей поддержкой в любом будущем конфликте. Разумеется, за определённую цену."
 mongol_greater_mongolia.16.a:0 "Пригласить братьев из государства [SOV.getAdjective]"
 mongol_greater_mongolia.16.b:0 "Это не в наших интересах"
 mongol_greater_mongolia.17.t:0 "Пригласить дипломатов государства [CHI.getAdjective]?"
 mongol_greater_mongolia.17.d:0 "На протяжении веков государство [CHI.getAdjective] было разделено внутренней борьбой за власть, но его руководство всё ещё стремится смотреть вовне и защищать Внешний рубеж от влияния государства [SOV.getAdjective], государства [JAP.getAdjective] и любых иных иностранных держав. \n\nМногие столетия наши предки сражались друг с другом. Возможно, выгоды дипломатии смогут затмить огонь пороха и блеск клинков, позволив нашим народам понять, что стремление к выживанию и объединению у нас схоже?"
 mongol_greater_mongolia.17.a:0 "Посмотрим, что они скажут теперь"
 mongol_greater_mongolia.17.b:0 "Мы никогда не станем сотрудничать с этими угнетателями"
 mongol_greater_mongolia.18.t:0 "Признать КНР, пригласив её представителей?"
 mongol_greater_mongolia.18.d:0 "Стремясь освободить собственно Китай от угнетателей народа, [PRC.getLeader] и народ государства [PRC.getNameDef] установили новый порядок, пока более или менее успешно выдерживающий давление Центрального правительства. \n\nИх обещания уважать принципы самоопределения и волю народа Внешней Монголии могут стать основой новых дипломатических отношений, направленных на укрепление обеих стран в рамках плодотворного сотрудничества! \n\nПодобный дипломатический манёвр наверняка разгневает чиновников партии [CHI.GetRulingParty], но имеет ли это значение, если наша долгосрочная цель будет достигнута?"
 mongol_greater_mongolia.18.a:0 "Определённо"
 mongol_greater_mongolia.18.b:0 "Это слишком рискованно, лучше отказаться"
 mongol_greater_mongolia.19.t:0 "Пригласить милитаристов государства [JAP.getAdjective]?"
 mongol_greater_mongolia.19.d:0 "Стремительный промышленный и экономический рост государства [JAP.getNameDef] превратил его в силу, с которой необходимо считаться, если мы хотим обезопасить границы страны. Более того, его амбиции на Центральной равнине и в юго-восточной части Тихого океана можно использовать в наших интересах, если заключить тщательно продуманную сделку. \n\nС другой стороны, создание им «режимов-протекторатов» у наших непосредственных границ никак не способствует снижению напряжённости. Кто знает, к чему приведут его амбиции в Восточной Азии?"
 mongol_greater_mongolia.19.a:0 "Это поможет урегулировать споры в регионе"
 mongol_greater_mongolia.19.b:0 "У них могут быть скрытые замыслы"
 mongol_greater_mongolia.20.t:0 "Чиновники государства [MON.getAdjective] пригласили нас на Улан-Баторскую конференцию"
 mongol_greater_mongolia.20.d:0 "Стремясь урегулировать споры по вопросам Внутренней и Внешней Монголии, перераспределить население согласно переписям и местным плебисцитам и сохранить наследие единой Монголии, дипломаты государства [MON.getADjective] начали организацию Улан-Баторской конференции и пригласили нас «как великую державу» принять участие в обсуждении. \n\nНаши аналитики рекомендуют посетить конференцию в Улан-Баторе, поскольку мы сможем усилить влияние в регионе и, возможно, склонить государство [MON.getNameDef] и его руководство на нашу сторону. \n\nДоверие хорошо, но контроль лучше."
 mongol_greater_mongolia.20.a:0 "Мы примем участие."
 mongol_greater_mongolia.20.b:0 "Они, должно быть, шутят!"
 mongol_greater_mongolia.21.t:0 "Делегация государства [FROM.getAdjective] присоединится к конференции"
 mongol_greater_mongolia.21.d:0 "После некоторых раздумий представители государства [FROM.getAdjective] во время торжественного визита нашего посла объявили о заинтересованности в конференции, направленной на «мирное урегулирование споров и прекращение конфликтов». \n\nНам следует подготовить наилучшие условия для их пребывания в столице. Часть приготовлений уже началась."
 mongol_greater_mongolia.21.a:0 "Стабильность в регионе должна быть сохранена!"
 mongol_greater_mongolia.22.t:0 "Представители государства [FROM.getAdjective] не заинтересованы в конференции"
 mongol_greater_mongolia.22.d:0 "В длинном ответном письме, переданном нашему послу, содержались пространные заверения в вечной дружбе между двумя народами, пожелания долгой и счастливой жизни всем гражданам и лишь в самом конце, почти скрытая между строк, короткая фраза о том, что государство [FROM.getNameDef] занято крайне срочными вопросами и потому не может направить делегацию для личного обсуждения стабильности в Центральной Азии. \n\nСледует сохранять бдительность: эта страна пока не готова взять на себя ответственность за поддержание стабильности в регионе..."
 mongol_greater_mongolia.22.a:0 "Тем хуже для них."
 mongol_greater_mongolia.23.t:0 "Начало Улан-Баторской конференции"
 mongol_greater_mongolia.23.d:0 "Подготовка к проведению конференции близится к завершению, и в ближайшие дни все дипломаты прибудут в Улан-Батор. \n\nПосле нескольких дней согласования процедур нам удалось разместить делегатов так, чтобы никого не оскорбить рассадкой в зале. Теперь остаётся лишь создать в столице благоприятную атмосферу, чтобы иностранные представители чувствовали себя спокойно и желанными гостями."
 mongol_greater_mongolia.23.a:0 "Пусть переговоры начнутся"
 mongol_greater_mongolia.24.t:0 "Перестрелка в конференц-зале"
 mongol_greater_mongolia.24.d:0 "Первый раунд обсуждений проходил согласно плану: после приветственной речи [MON.getLeader] с трибуны конференц-зала все члены делегаций заняли места и приготовились обсуждать безопасность региона. \n\nОхрана не знала, что некоторым иностранным представителям и их личным телохранителям удалось пронести огнестрельное оружие якобы «для личной защиты». \n\nКогда спор накалился, один из участников поднял вопрос: «Как можно поддерживать региональную безопасность, если другая сторона прямо за этими дверями ведёт против нас наступательную войну?» Возмущённые представители противоположной стороны резко отреагировали, после чего неизвестный радикал среди присутствующих открыл огонь из личного оружия, спровоцировав массовую перестрелку между делегациями. \n\nЛишь через несколько часов обе стороны согласились забрать раненых и вернуться в воюющие страны, окончательно похоронив надежды на успех конференции."
 mongol_greater_mongolia.24.a:0 "Какое упущение с нашей стороны!"
 mongol_greater_mongolia.25.t:0 "Взаимное признание в обмен на союз"
 mongol_greater_mongolia.25.d:0 "Наше шаткое положение на международной арене ранее во многом поддерживали товарищи из государства [SOV.getNameDef], чьи политики и военные крепко контролировали нашу внутреннюю и внешнюю политику. \n\nПоскольку приглашением представителей государства [PRC.getNameDef] мы уже неофициально признали его, теперь можно попытаться закрепить ранее установленные связи тайным протоколом, предусматривающим взаимное признание стран и возможный раздел сфер влияния в Центральной Азии. Разумеется, конференцию придётся прекратить.\n\nВеликие державы могут назвать это «союзом нежелательных», но это лучше, чем ничего!"
 mongol_greater_mongolia.25.a:0 "Наш единственный шанс!"
 mongol_greater_mongolia.25.b:0 "И вызвать на нас гнев наших соседей?"
 mongol_greater_mongolia.26.t:0 "Предложение о союзе принято"
 mongol_greater_mongolia.26.d:0 "Понимая, насколько шатки и хрупки позиции обеих наших стран, [PRC.getLeader] Мы приняли рискованное предложение и подписали секретное соглашение, направленное на то, чтобы сместить баланс сил в регионе в нашу пользу.\n\nРазгневанные дипломаты из других стран будут выезжать из Улан-Батора в следующие дни, чтобы доставить записку о том, «насколько ненадежны». [MON.getadjective] Политики есть.\n\nНекоторые из наших генералов уже надеются инициировать обмен опытом между нашими вооруженными силами."
 mongol_greater_mongolia.26.a:0 "Ура!"
 mongol_greater_mongolia.27.t:0 "Дипломатическая миссия провалилась"
 mongol_greater_mongolia.27.d:0 "[PRC.getLeader] сообщил нашему представителю, что, несмотря на перспективность предложения, сейчас у них есть иные заботы и они не готовы отказываться от плодотворного сотрудничества с великими державами. \n\nКак и наше предложение, это заявление было передано по защищённым каналам, и ни один иностранный дипломат не узнал, что происходило за его спиной. \n\nМы всё ещё можем продолжить попытки заручиться поддержкой крупных игроков Центральной Азии."
 mongol_greater_mongolia.27.a:0 "Как? Почему?"
 mongol_greater_mongolia.28.t:0 "Конференция завершилась неудачей"
 mongol_greater_mongolia.28.d:0 "Несмотря на все усилия по созданию продуктивного климата и благоприятной атмосферы в конференц-зале, все раунды обсуждений завершились неудачно: разные стороны жаловались на неравное отношение или сохраняли нейтралитет по ключевым вопросам. \n\nМы также пытались заручиться поддержкой некоторых участников, однако эти усилия оказались тщетными: делегаты требовали всё новых уступок, которые мы физически не могли предоставить. \n\nПосле закрытия конференции [MON.getLeader] произнёс речь, пытаясь примирить противоборствующие стороны и сохранить рабочую атмосферу, но уже следующим вечером стало ясно, что добиться этого не удалось. Для нашей дипломатии конференция стала полным провалом."
 mongol_greater_mongolia.28.a:0 "Мы сделали всё возможное..."
 mongol_greater_mongolia.29.t:0 "Великие державы оказывают поддержку"
 mongol_greater_mongolia.29.d:0 "После нескольких недель переговоров и споров о территориях контроля и интересов нам удалось удовлетворить все делегации, присутствовавшие на конференции, и они публично объявили наше государство «державой статус-кво под защитой великих держав». \n\nНаправив основные усилия на сохранение собственно Монголии как буферного государства, крупные державы согласились гарантировать стабильность и безопасность нашей страны при условии, что мы сохраним нейтралитет во внешней политике по отношению к участникам договора. \n\nОднако такая формулировка позволяет нам потребовать у иностранных держав, согласившихся сохранять нашу целостность, «исконные монгольские земли», заявляя, что мы «лишь стремимся к объединению законных территорий государства [MON.getAdjective]»."
 mongol_greater_mongolia.29.a:0 "Наши дипломаты совершили невозможное!"
 mongol_greater_mongolia.30.t:0 "Монголия требует законную территорию"
 mongol_greater_mongolia.30.d:0 "Ссылаясь на стремление объединить народ государства [MON.getAdjective] в едином национальном государстве и прикрывая эти амбиции недавними соглашениями в Улан-Баторе, [MON.getLeader] направил срочное требование передать область под их контроль. \n\nПо их словам, выполнение требования «сохранит равновесие сил в регионе и не нанесёт стране долгосрочного ущерба», что они считают полностью оправданным. \n\nС другой стороны, отказ может привести к тому, что другие державы региона сочтут нас угнетателями, разжигателями войны и разрушителями мира и получат обоснованный повод для военного вмешательства..."
 mongol_greater_mongolia.30.a:0 "Пусть получат то, что принадлежит им по праву"
 mongol_greater_mongolia.30.b:0 "Мы договаривались не об этом"
 mongol_greater_mongolia.31.t:0 "Государство [FROM.getAdjective] не соблюдает Улан-Баторские соглашения"
 mongol_greater_mongolia.31.d:0 "Первоначальный дипломатический запрос, похоже, не получил должного внимания правительства [FROM.getLeader], а второе обращение, отправленное несколькими часами позже, было отклонено под предлогом того, что именно мы «неуместно и опасно обостряем ситуацию». \n\nТретье требование предоставить обещанные Монголии уступки было публично показано населению страны, которое открыто высмеяло примирительную тактику наших чиновников. \n\nТакое публичное унижение и пренебрежение международными договорами нельзя терпеть! Или всё же можно?"
 mongol_greater_mongolia.31.a:0 "Пора действовать жёстче."
 mongol_greater_mongolia.31.b:0 "О войне сейчас не может быть и речи"
 mongol_greater_mongolia.32.t:0 "Передача области подтверждена"
 mongol_greater_mongolia.32.d:0 "Наша скромная просьба, по всей видимости, вызвала определённое беспокойство иностранного правительства, однако ответ его чиновников прибыл вовремя. \n\nЗаявив, что их целью является сохранение мира в регионе, представители государства [FROM.getAdjective] готовы скорректировать границы собственного или зависимого государства, чтобы государство [MON.getNameDef] сохранило статус-кво в Центральной Азии. \n\nПодготовка к административному и военному переустройству уже началась и проводится своевременно в соответствии с предложенным планом."
 mongol_greater_mongolia.32.a:0 "Как мы и предполагали"
 mongol_greater_mongolia.33.t:0 "В передаче области отказано"
 mongol_greater_mongolia.33.d:0 "В тщетной попытке сохранить уже рушащуюся империю представители государства [FROM.getAdjective] отклонили просьбу вернуть монгольские территории под наш контроль! \n\nОни утверждают, что принадлежащие им земли «по праву их», очевидно забыв обещания, данные во время Улан-Баторских соглашений. \n\nВооружённые силы сообщают о готовности провести военную операцию, если для передачи области потребуется применение силы."
 mongol_greater_mongolia.33.a:0 "Сегодня нам никто не откажет!"
 mongol_greater_mongolia.34.t:0 "Наш покровитель не поддержит наше дело"
 mongol_greater_mongolia.34.d:0 "Чиновникам государства [FROM.getNameDef] пришлось передать неприятную ноту: они не могут поддержать наши усилия из-за нехватки свободных людских ресурсов, снаряжения и припасов для ведения «ещё одной справедливой освободительной войны». \n\nОни также сообщили, что по-прежнему готовы поддержать нас в будущем, если вновь возникнет вопрос о пересмотре границ."
 mongol_greater_mongolia.34.a:0 "Какая ненадёжность!"
 mongol_greater_mongolia.40.t:0 "Государство [From.GetNameDefCap] предлагает разделить сферы влияния"
 mongol_greater_mongolia.40.d:0 "Главной целью создания союза был отказ от великих держав и формирование независимого блока, способного противостоять влиянию гигантов. \n\nТеперь, когда союз окончательно оформлен, остаётся один небольшой, но важный вопрос: \nВо Внутренней Монголии и Северном Синьцзяне по-прежнему проживает значительное монгольское население, в основном оторванное от местного общества. \n\nГосударство [MON.getNameDef] под руководством [MON.getLeader] стремится объединить всех монголов под одним знаменем и требует разделить сферы влияния, подразумевая, что нам следует пересмотреть политику китаизации в интересующих его регионах."
 mongol_greater_mongolia.40.a:0 "Так будет лучше"
 mongol_greater_mongolia.40.b:0 "Нет, это не в наших интересах!"
 mongol_greater_mongolia.41.t:0 "Государство [From.GetNameDefCap] соглашается разделить сферы влияния"
 mongol_greater_mongolia.41.d:0 "Стремясь всеми силами укрепить наш недавно созданный союз, чиновники государства [FROM.getAdjective] сообщили, что отказываются от своих претензий и не станут проводить политику китаизации в спорном регионе. \n\nТаким образом, наш народ получит больше свободы, а политики смогут продолжить воплощение мечты об объединении монгольского населения в едином национальном государстве."
 mongol_greater_mongolia.41.a:0 "Как и ожидалось."
 mongol_greater_mongolia.42.t:0 "Просьба отклонена!"
 mongol_greater_mongolia.42.d:0 "Не желая менять политику в спорном регионе, чиновники государства [FROM.getAdjective], похоже, по-прежнему считают интересующие нас земли своей законной территорией! \n\nМы всё ещё можем продолжить объединение монгольского населения согласно собственной воле, однако часть их сторонников может встать у нас на пути, если мы попытаемся получить желаемые земли посредством завоевания или переговоров. \n\nЭта ужасная ошибка привела к тому, что теперь у нас значительно меньше союзников, на которых можно положиться!"
 mongol_greater_mongolia.42.a:0 "Будь они прокляты!"
 mongol_greater_mongolia.50.t:0 "Возрождение государства [From.GetNameDef]"
 mongol_greater_mongolia.50.d:0 "Недавние территориальные приобретения государства [FROM.getAdjective] охватили обширные земли, населённые преимущественно монголами, предоставив его чиновникам уникальную политическую возможность. \n\nСегодня утром [FROM.getLeader] выступил перед зданием Великого хурала и объявил о создании нового государственного образования, воплощающего общую волю и стремления монгольского населения и призванного защищать его интересы в эти неспокойные времена."
 mongol_greater_mongolia.50.a:0 "Нас ждёт мечта об объединённой Центральной Азии"
 mongol_greater_mongolia.50.b:0 "Возрождается новая Монгольская империя?"
 mongol_greater_mongolia.50.c:0 "Всего лишь небольшая неудача, не более"
 mongol_soviet_puppet.2.t:0 "Обнаружена подозрительная деятельность"
 mongol_soviet_puppet.2.d:0 "Несколько недель назад была арестована группа молодых студентов, подозреваемых в том, что правительство государства [MON.getAdjective] направило их в нашу страну как иностранных агентов для дестабилизации положения в наших тылах различными средствами. \n\nПосле нескольких первых допросов один из зачинщиков признался, что служит государству [MON.getNameDef] и его программе. Подобные наглые действия нельзя оставлять без внимания, а виновные должны понести наказание. Наши дипломаты уже разработали несколько способов борьбы с этой угрозой. \n\nКакое решение примет [ROOT.getLeader]?"
 mongol_soviet_puppet.2.a:0 "Нас это не касается"
 mongol_soviet_puppet.2.b:0 "Выразить дипломатический протест"
 mongol_soviet_puppet.2.c:0 "Закрыть границы"
 mongol_soviet_puppet.2.e:0 "Предъявить ультиматум"
 mongol_soviet_puppet.3.t:0 "Государство [FROM.getNameDefCap] протестует против нашей программы"
 mongol_soviet_puppet.3.d:0 "Сегодня утром в правительственную штаб-квартиру доставили ноту протеста, в которой утверждалось, что столь открытое и наглое распространение коммунизма в непосредственной близости от их страны лишь ухудшит отношения между нами. \n\nВ письме также говорилось, что любые будущие действия наших шпионов и агентов не останутся безнаказанными, а для защиты государства [FROM.getAdjective] и права его народа самостоятельно определять подходящую идеологию будут приняты более решительные меры. \n\nНе зная, как реагировать на этот «срочный» вопрос, [ROOT.getLeader] решил вернуться к нему позднее."
 mongol_soviet_puppet.3.a:0 "О нет! Впрочем..."
 mongol_soviet_puppet.4.t:0 "Государство [FROM.getNameDefCap] вводит против нас эмбарго!"
 mongol_soviet_puppet.4.d:0 "Один из товарных поездов не прибыл на центральный вокзал приграничного города, вызвав опасения, что товары по недавно заключённому торговому соглашению вообще не будут доставлены. Начались беспорядки, после чего было проведено надлежащее расследование. \n\nОказалось, что поезд и его экипаж находятся в приграничном районе государства [FROM.getNameDef] и не могут попасть в нашу страну из-за введённых против нас торговых санкций! \n\nОфициальный дипломатический запрос в посольство государства [FROM.getAdjective] подтвердил, что его чиновники закрыли границы и не намерены пропускать товарные составы без официальных извинений."
 mongol_soviet_puppet.4.a:0 "Для нас это не имеет большого значения"
 mongol_soviet_puppet.4.b:0 "Пожалуйста, не надо! Отправить извинения!"
 mongol_soviet_puppet.5.t:0 "Государство [FROM.getNameDefCap] приносит извинения"
 mongol_soviet_puppet.5.d:0 "Стремясь к примирению с нашими чиновниками, ведомство иностранных дел государства [FROM.getAdjective] направило ноту с извинениями. \n\nВ просьбе снять торговые санкции также указано, что в ближайшем будущем они не станут проводить пропагандистские кампании на наших землях. \n\nКроме того, ожидается, что мы получим значительную компенсацию за беспорядки, вызванные их агентами в наших тылах, что укрепит наши позиции в регионе. Но можем ли мы действительно им доверять?"
 mongol_soviet_puppet.5.a:0 "Очень хорошо"
 mongol_soviet_puppet.5.b:0 "Нас не так легко откупить"
 mongol_soviet_puppet.6.t:0 "Государство [FROM.getNameDefCap] соглашается на компромисс"
 mongol_soviet_puppet.6.d:0 "В президентскую канцелярию поступило письмо о примирении, в котором чиновники государства [FROM.getAdjective] обещают задержать наших агентов за подрывную деятельность, но разрешить свободное перемещение товаров через границу, если в будущем не произойдёт новых инцидентов. \n\nЧерез несколько часов проблемный состав прибыл в пункт назначения и доставил народу необходимые товары. \n\nМы рады, что торговлю не сковало подобное эмбарго, ведь оно могло иметь разрушительные последствия для экономики."
 mongol_soviet_puppet.6.a:0 "Небольшой кризис предотвращён"
 mongol_soviet_puppet.7.t:0 "Государство [FROM.getNameDefCap] отказывается от переговоров"
 mongol_soviet_puppet.7.d:0 "Несмотря на наши призывы к примирению, [FROm.getAdjective] Они отказываются от отмены торговых санкций, заявляя, что такие действия не остановят иностранных пропагандистов, действующих на их землях.\n\nБолее того, распространяются слухи о том, что они, похоже, выступают за то, чтобы другие страны в их непосредственной близости ввели эмбарго и на нашу страну!\n\nБудучи не в состоянии ни подтвердить, ни опровергнуть истину этого, мы будем рассматривать вопрос о том, чтобы сделать нашу повестку дня такой, какая она есть. [FROM.getNameDef] Мы должны быть более тонкими, прежде чем нам будут предъявлены более серьезные ультиматумы."
 mongol_soviet_puppet.7.a:0 "Звучит нехорошо"
 mongol_soviet_puppet.8.t:0 "Государство [FROM.getNameDefCap] требует прекратить вмешательство во внутренние дела"
 mongol_soviet_puppet.8.d:0 "Ссылаясь на необходимость обеспечить внутреннюю стабильность и защитить собственную сферу влияния, правительство государства [FROM.getAdjective] издало указ о всеобщей мобилизации вооружённых сил! \n\nОткрыто готовясь к войне, оно также выдвинуло ряд требований, обвиняя нас в недавних беспорядках и росте поддержки коммунизма среди сельского населения! \n\nБолее того, эти поджигатели войны готовы «покончить с коммунистической угрозой», если мы не прекратим всякую пропаганду на их землях. Что нам делать?"
 mongol_soviet_puppet.8.a:0 "Что они сделают? Объявят нам войну?"
 mongol_soviet_puppet.8.b:0 "Отступить"
 mongol_soviet_puppet.9.t:0 "Ультиматум отклонён"
 mongol_soviet_puppet.9.d:0 "Несмотря на представленные нами ясные доказательства, чиновники государства [FROM.getAdjective] отвергли все обвинения, заявив, что улики сфальсифицированы, а настоящей угрозой региону является лишь наше некомпетентное правительство! \n\nПодобные оскорбления невозможно терпеть, поэтому мы подготовим вооружённые силы и раз и навсегда сокрушим эту назойливую страну! \n\nПограничные патрули уже усилены недавно набранными войсками, и нам нужно лишь немного времени на подготовку. К войне! Слава государства [ROOT.getAdjective] требует этого!"
 mongol_soviet_puppet.9.a:0 "Пора действовать силой"
 mongol_soviet_puppet.10.t:0 "Государство [FROM.getNameDefCap] уступает требованиям"
 mongol_soviet_puppet.10.d:0 "Наши ультиматумы впечатлили и напугали иностранных чиновников, которые направили торжественную делегацию в нашу столицу и объявили о стремлении к вечному миру! \n\nПосле раунда переговоров они также дали клятвенное обещание прекратить всякое вмешательство во внутренние дела и предоставили сведения обо всех остальных членах агентурной сети, распространявшей коммунистические идеи в умах и сердцах нашего народа. \n\nСлавный день для государства [ROOT.getNameDef] и его народа!"
 mongol_soviet_puppet.10.a:0 "Как и ожидалось"
 mongol_soviet_puppet.11.t:0 "Монголия поддерживает коммунистическое восстание"
 mongol_soviet_puppet.11.d:0 "Сегодня утром в нашу штаб-квартиру поступили новости об очередном коммунистическом восстании, направленном на то, чтобы «освободить пролетариат и создать рабочую республику». \nЧерез несколько часов [MON.getLeader] объявил всему миру, что руководители новорождённого революционного правительства обратились за поддержкой государства [MON.getAdjective] и единогласно проголосовали за укрепление связей, став подконтрольным режимом в борьбе за независимость! \n\nГосударство [MON.getNameDefCap] теперь выступает твёрдым гарантом коммунистического рая в регионе и готово принимать под своё руководство всё новые режимы."
 mongol_soviet_puppet.11.a:0 "Они сделали ЧТО?"
 mongol_soviet_puppet.11.b:0 "Добро пожаловать, братья и сёстры!"
 mongol_soviet_puppet.11.c:0 "Что они вообще думают?!"
 mongol_soviet_puppet.11.e:0 "Нас ждёт новая судьба!"
 mongol_soviet_puppet.11.f:0 "Действительно интересно."
 mongol_soviet_puppet.12.t:0 "Государство [FROM.getNameDefCap] предлагает программу перемещения промышленности"
 mongol_soviet_puppet.12.d:0 "Стремясь обезопасить нашу промышленность от наступающего врага, чиновники государства [MON.getAdjective] предложили перенести существующие предприятия из уязвимых районов Урала и Центральной Азии дальше на восток, на территории собственно Монголии. \n\nМы не сможем напрямую использовать эти фабрики, однако наши братья в государстве [MON.getNameDef] обещают взамен предоставить значительную долю собственных промышленных мощностей. \n\nКакое решение примет Ставка? Целесообразно ли перемещать промышленность ещё дальше от врага?"
 mongol_soviet_puppet.12.a:0 "Переместить военный завод"
 mongol_soviet_puppet.12.b:0 "Перевести гражданское предприятие в безопасное место"
 mongol_soviet_puppet.12.c:0 "Эти фабрики и здесь в безопасности"
 mongol_soviet_puppet.13.t:0 "Государство [FROM.getAdjective] перемещает военный завод"
 mongol_soviet_puppet.13.d:0 "Ставка сообщила, что один из военных заводов подготовлен к перемещению дальше на восток, укрепляя наши военные возможности в обмен на некоторые промышленные уступки с нашей стороны. \n\nРастущая промышленная мощь поможет не только нашим друзьям из государства [SOV.getAdjective], но и нам самим."
 mongol_soviet_puppet.13.a:0 "Отлично!"
 mongol_soviet_puppet.14.t:0 "Государство [FROM.getAdjective] передаёт промышленный комплекс"
 mongol_soviet_puppet.14.d:0 "Согласно докладу, промышленный комплекс уже направляется в безопасное место в собственно Монголии. \n\nСтавка напоминает, что мы не должны забывать свою часть сделки и обязаны завершить её подписанием промышленного договора о помощи нашим братьям."
 mongol_soviet_puppet.14.a:0 "Отлично!"
 mongol_soviet_puppet.15.t:0 "Просьба отклонена"
 mongol_soviet_puppet.15.d:0 "Ставка сообщает, что сейчас невозможно создать надёжный и безопасный маршрут до нашей страны, поэтому в будущем нам придётся направить новое обращение, если мы захотим вновь попытаться переместить промышленный комплекс в наши основные земли. \n\nНекоторые граждане отмечают, что это также может снизить их влияние на нас, что, возможно, даже пойдёт нам на пользу."
 mongol_soviet_puppet.15.a:0 "Может быть, в следующий раз?"
 mongol_soviet_puppet.16.t:0 "Новый маяк коммунизма"
 mongol_soviet_puppet.16.d:0 "Заявив о необходимости изменить политическое устройство Коммунистического интернационала, политики государства [MON.getAdjective] выступили с публичным обращением, выразив обеспокоенность растущей политической нестабильностью и недавними военными поражениями государства [SOV.GetNameDef]. \n\n«Ради общего блага союзнические усилия следует координировать из хорошо защищённого и укреплённого места», — заявил [MON.getLeader] в конце речи, официально приняв руководство альянсом [MON.getFactionName]."
 mongol_soviet_puppet.16.a:0 "Отныне мы будем руководить."
 mongol_soviet_puppet.16.b:0 "Они готовятся к грядущему."
 mongol_soviet_puppet.16.c:0 "Это им не поможет!"
 mongol_soviet_puppet.16.e:0 "Война обостряется..."
 mongol_soviet_puppet.16.f:0 "Наш союз становится сильнее."
 mongol_soviet_puppet.17.t:0 "Государство [FROM.getNameDefCap] предлагает единое союзное правительство"
 mongol_soviet_puppet.17.d:0 "В сегодняшней речи [FROM.getLeader] публично заявил: \n«Мир меняется. Кто теперь способен противостоять армиям государств [FROM.getNameDef] и [ROOT.getNameDef]? Противостоять мощи [FROM.getLeader] и [ROOT.getLeader], а также союзу двух государств. Вместе, мой друг [ROOT.getLeader], мы поведём этот мир к Революции». \n\nЭта весьма спорная речь была встречена аплодисментами тысяч и десятков тысяч монголов по всему государству [MON.getNameDef], а многие наши граждане присоединились к призывам создать единое союзное правительство, способное защищать ценности альянса [ROOT.getFactionName] во всём мире. Каким будет ответ верховного командования?"
 mongol_soviet_puppet.17.a:0 "Единый и неделимый Союз"
 mongol_soviet_puppet.17.b:0 "Мы прекрасно справляемся сами."
 mongol_soviet_puppet.18.t:0 "Государство [FROM.getAdjective] принимает нашу просьбу"
 mongol_soviet_puppet.18.d:0 "Политики государства [FROM.getAdjective], отчаянно пытаясь остановить продолжающийся военный и административный распад страны, приняли наше предложение о создании единого правительства государств [FROM.getAdjective] и [ROOT.getAdjective]. \n\nУсиленный Генеральный штаб уже приступил к разработке новых боевых планов, призванных отразить наступление противника и вернуть земли, оказавшиеся под иностранным контролем. Наши представители направлены на вновь приобретённые территории, чтобы устранить бюрократический хаос."
 mongol_soviet_puppet.18.a:0 "Всё идёт по плану."
 mongol_soviet_puppet.19.t:0 "Государство [FROM.getNameDefCap] пересматривает нашу просьбу"
 mongol_soviet_puppet.19.d:0 "The [FROM.getAdjective] Верховный главнокомандующий сообщил нам, что такая харизматичная речь [ROOT.getLeader] Они укрепили свои патриотические чувства и твердую веру в революционные идеи, подразумевая, что их народ един в борьбе с врагом под флагами и знаменами революции. [FROM.getNameDef]. Утверждая, что административное объединение только ухудшит ситуативное командование на фронте, [FROM.getLeader] Он вежливо отклонил почетное предложение.\n\nОни, похоже, все еще верят в то, что могут разрешить продолжающийся кризис и спасти свою разваливающуюся страну, используя свои собственные вооруженные силы и в значительной степени полагаясь на гражданскую поддержку. Посмотрим, верно ли это утверждение."
 mongol_soviet_puppet.19.a:0 "Мы сделали всё возможное."
 mongol_rp_advisor.1.t:0 "Первый доклад командованию"
 mongol_rp_advisor.1.d:0 "Приветствую, товарищ, и позвольте поздравить вас с недавним назначением одним из личных советников Пэлжидийна Гэндэна! \nИменно с такими людьми, как вы, Гэндэн намерен вести великое государство [MON.getName] к славному и процветающему будущему. Меня зовут Далд Зөвлөх, и я уже давно служу в ведомстве внутренней безопасности личным советником недавно назначенных командиров вроде вас. Объём ваших знаний может сильно зависеть от прежнего опыта работы и аймака, в который вы были направлены. В целом положение можно кратко описать следующим образом:\n\nНаши земли по-прежнему считаются неотъемлемой частью государства [CHI.getNameDef], хотя его руководство почти не обладает реальной властью в регионе. \nИмпериалисты государства [JAP.getAdjective] постоянно усиливают активность в восточных районах нашей страны после захвата имущества Фэнтяньской клики в 1932 году. \nЕдинственным другом в таких обстоятельствах оставался СССР, который со времени Народной революции 1924 года оказывал нам идеологическую и материальную помощь, значительно укрепив своё влияние в нашем государстве.\n\nПока Гэндэн и Демид находятся с визитом в Москве, мы можем отправить по телеграфу несколько предложений о дополнительных вопросах, которые им следует поднять на конференции. Время ограничено, и важен каждый час! \n\nЯ оставлю вас готовиться. Зөвлөх закончил."
 mongol_rp_advisor.1.a:0 "В будущем я ожидаю новых докладов."
 mongol_rp_advisor.1.b:0 "Я прекрасно понимаю, что делаю, Далд. Больше доклады не нужны."
 mongol_anti_soviet.1.t:0 "Сформировано временное правительство"
 mongol_anti_soviet.1.d:0 "После катастрофического провала нашей делегации, пытавшейся защитить национальную самобытность в эти неспокойные времена, государственным структурам удалось объединить различные фракции партийной элиты и сформировать временный режим, который будет править страной в этот неопределённый период. \n\nНесколько разобщённых групп интересов и их немногочисленные лидеры, борющиеся за власть, определённо не способствуют успеху правительства, однако по крайней мере у них имеется множество открытых предложений. \n\nЛучше всего найти любую форму устойчивого и надёжного руководства или, возможно, попытаться спасти борца Гэндэна, если это ещё возможно."
 mongol_anti_soviet.1.a:0 "Пока что они возьмут руководство на себя"
 mongol_anti_soviet.2.t:0 "Мы нашли его!"
 mongol_anti_soviet.2.d:0 "Поиски девятого Джебцзун-Дамба-хутухты, современного перерождения Богдо-хана, умершего ещё в 1924 году, увенчались большим успехом.\n\nПосле того как наши монахи собрали в местной деревне всех мальчиков в возрасте от двух до пяти лет, каждый участник прошёл три серии испытаний. Несколько часов спустя результаты последней проверки помогли нам определить законное перерождение Джебцзун-Дамба-хутухты! \n\nРождённому под именем Джампэл Намдрол Чокьи Гьялцэн мальчику сообщили о его истинной сущности и о том, что он воплощает прежний дух, объединявший буддистов Внешней Монголии. Его родители поклялись хранить открытие в тайне до стабилизации политического положения."
 mongol_anti_soviet.2.a:0 "Прекрасно! Но пока сохранить это в тайне."
 mongol_anti_soviet.3.t:0 "Никто не прошёл испытание"
 mongol_anti_soviet.3.d:0 "Деревня за деревней, город за городом, но ни один претендент не прошёл испытания, предназначенные для обнаружения нового воплощения девятого Джебцзун-Дамба-хутухты. \n\nНаши поисковые группы больше не будут проводить поиски в этом регионе, поскольку перерождение Богдо-хана определённо находится где-то в районе Тибетского нагорья. Нам решать, продолжать ли это требующее огромных затрат времени и ресурсов начинание."
 mongol_anti_soviet.3.a:0 "Ничего, мы не сдадимся!"
 mongol_anti_soviet.3.b:0 "Ничего? Это начинание стало слишком обременительным."
 mongol_anti_soviet.4.t:0 "Назначение нового председателя"
 mongol_anti_soviet.4.d:0 ""
 mongol_anti_soviet.4.a:0 "Чэнь Дусю поведёт страну по новому пути к коммунизму!"
 mongol_anti_soviet.4.b:0 "Иосиф Сталин-хан временно примет руководство."
 mongol_anti_soviet.4.c:0 "Председатель? Почему не председательница?"
 mongol_army.1.t:0 "Схема переналадки производства"
 mongol_army.1.d:0 "Располагая ограниченными ресурсами, мы не можем полностью сосредоточить военную промышленность на массовом производстве бронетехники различной специализации. \n\nНовое предложение исследовательской и конструкторской группы предусматривает переналадку производственных линий и предприятий под выпуск узкоспециализированной танковой техники, предназначенной либо для достижения высокой надёжности на поле боя ценой скорости, либо для установки лучшего вооружения при большей стоимости модели, либо для дешёвого производства при низкой прочности, либо для преодоления наибольшего расстояния за минимальное время. \n\nПозднее мы всегда сможем переработать чертежи, однако ожидается, что это окажется дорогим и долгим процессом."
 mongol_army.1.a:0 "Надежные модели сначала"
 mongol_army.1.b:0 "Поддержать качественные модели"
 mongol_army.1.c:0 "Сосредоточиться на минимальной стоимости производства"
 mongol_army.1.e:0 "Танки созданы для скорости, а не для боя!"
 mongol_army.2.t:0 "Перспективный генерал"
 mongol_army.2.d:0 "Наш расширяющийся Генеральный штаб остро нуждается в новых кандидатах, полных энтузиазма, открытых новому и способных предложить старшим офицерам множество необычных тактических решений. Недавний указ объявил конкурс на несколько новых должностей полковников и генералов. \n\nСреди заявлений недавних выпускников различных военных училищ несколько дней назад комиссия получила документы одного перспективного кандидата. \n\nЕго зовут Сандивын Равдан, и он хорошо известен своей преданностью делу и активной службой в различных гарнизонных учреждениях последних лет. Прекрасное пополнение для Генерального штаба."
 mongol_army.2.a:0 "Нанять его!"
 mongol_army.3.t:0 "Запрос на передачу кораблей"
 mongol_army.3.d:0 "Наши покровители издали указ, требующий передать несколько кораблей военно-морских сил под непосредственное командование одного из их флотоводцев. Утверждая, что это произойдёт «лишь на ограниченное время», наши информаторы сообщают о подготовке полноценных экипажей, состоящих главным образом из моряков государства [MON.getAdjective]. \n\nСнабжение нового протектора позволит нам повысить автономию с учётом нашего вклада в потенциальные военные усилия, однако, если мы не желаем отдавать корабли новым хозяевам, всегда можно попытаться затопить некоторые из них."
 mongol_army.3.a:0 "У нас мало времени"
 mongol_army.4.t:0 "Монголия запрашивает советников"
 mongol_army.4.d:0 "Ратификация договора о взаимопомощи и сотрудничестве фактически позволила нашим вооружённым силам размещаться на территории государства [MON.getAdjective], однако до сих пор у нас почти не было возможности взаимодействовать с его офицерами. \n\nСтремясь расширить взаимовыгодное сотрудничество, их генералы подписали указ с просьбой направить больше военнослужащих государства [SOV.getAdjective], способных регулярно проводить военные манёвры и учения, укрепляя наши позиции в регионе и сохраняя преданность армии государства [MON.getAdjective]. Как нам ответить?"
 mongol_army.4.a:0 "Направить группу для помощи армии"
 mongol_army.4.b:0 "Небольшой группы будет достаточно"
 mongol_army.4.c:0 "Наши люди нужны в другом месте"
 mongol_army.5.t:0 "Государство [SOV.getAdjective] соглашается направить группу"
 mongol_army.5.d:0 "Наша скромная просьба получила широкую поддержку Генерального штаба государства [SOV.getAdjective], который решил направить хорошо оснащённую и обученную группу для помощи в развитии наших доктрин непосредственно на месте. \n\nК соглашению приложен дополнительный протокол, согласно которому часть её участников будет также контролировать модернизацию и обучение нашей армии в рамках дополнительной военной миссии."
 mongol_army.5.a:0 "Прекрасно!"
 mongol_army.6.t:0 "Умеренная помощь государства [SOV.getAdjective]"
 mongol_army.6.d:0 "Товарищи из государства [SOV.getAdjective] решили ограничить военную миссию несколькими советниками, которые будут контролировать общее развитие вооружённых сил и их перевооружение согласно современным стандартам. \n\nНаши генералы направили ещё несколько запросов, однако многие из них, похоже, были проигнорированы или отложены в дальний ящик какого-то бюрократического ведомства для «рассмотрения в лучшие времена». \n\nЛучше, чем ничего, но, к сожалению, не столь эффективно."
 mongol_army.6.a:0 "Очень хорошо!"
 mongol_army.7.t:0 "Военная миссия не направлена"
 mongol_army.7.d:0 "Утверждая, что любое участие в будущем усилит напряженность в регионе и обострит и без того неопределенную ситуацию, [SOV.getLeader] Он также заявил, что военное сотрудничество будет усилено «в ближайшем будущем, когда конкретные обстоятельства будут более благоприятными».\n\nРазрушительное развитие событий, но мы могли бы, возможно, использовать некоторые из переговоров, которые мы слышали на месте, чтобы получить некоторую бесплатную военную экспертизу?"
 mongol_army.7.a:0 "Какой ужас!"
 mongol_foreign_influence.2.t:0 "Административная интеграция Монголии"
 mongol_foreign_influence.2.d:0 "Наше влияние в государстве [MON.getNameDef] привело к необычной ситуации, при которой его внутренняя и внешняя политика сильно зависят от нашей помощи. \n\nНаблюдая за борьбой народа государства [MON.getAdjective] за выживание, [ROOT.getLeader] решил рассмотреть возможность назначения преданного правительства, которое закрепит нашу власть над страной в эти неопределённые и опасные времена."
 mongol_foreign_influence.2.a:0 "Направить посланника с объявлением нового порядка"
 mongol_foreign_influence.2.b:0 "Это не в наших интересах"
 mongol_foreign_influence.3.t:0 "Монголия сочувствует нашему делу!"
 mongol_foreign_influence.3.d:0 "Мы получили секретную телеграмму из государства [MON.getNameDef], в которой [MON.getLeader] заявляет о преданности нашему делу в эти неопределённые времена. \n\nНаблюдая за революционной борьбой нашего народа, их послы предложили договор о взаимопомощи и сотрудничестве в борьбе за Народную революцию. \n\nСледует ли считать их друзьями или сохранить нейтральную позицию?"
 mongol_foreign_influence.3.a:0 "Очень хорошо!"
 mongol_foreign_influence.3.b:0 "Нас это не интересует."
 mongol_foreign_influence.4.t:0 "Чиновники государства [FROM.getAdjective] принимают сделку"
 mongol_foreign_influence.4.d:0 "Делегации наших стран собрались сегодня утром для обсуждения вопроса о взаимовыгодной помощи в этой борьбе.\n\nПодписанный обеими сторонами, договор официально закрепляет нашу приверженность [FROM.getNameDef] и их руководителя [FROM.getLeader]Это позволяет нам оказывать различные дипломатические услуги в этой борьбе."
 mongol_foreign_influence.4.a:0 "Пусть сотрудничество будет плодотворным!"
 mongol_foreign_influence.5.t:0 "Сделка между государствами [FROM.getAdjective] и [ROOT.getAdjective] отклонена"
 mongol_foreign_influence.5.d:0 "Несмотря на все наши усилия, [FROM.getLeader], похоже, не убедили наши «туманные обещания и пустые угрозы», и он предположил, что новый договор может использоваться нами для получения несправедливого преимущества в этой неопределённой ситуации. \n\nПосле срыва переговоров дипломаты возвращаются в столицу с пустыми руками и приносят тревожные новости."
 mongol_foreign_influence.5.a:0 "Тогда очень жаль"
 mongol_foreign_influence.6.t:0 "Чиновники государства [MON.getAdjective] заявляют о намерении вмешаться в гражданскую войну "
 mongol_foreign_influence.6.d:0 "Стремясь «разрешить и окончательно завершить продолжающийся конфликт в Советском Союзе», [MON.getLeader] публично заявил, что народ государства [MON.getAdjective] готов вступить в борьбу за наследие Российской революции и истинные ценности коммунистических идеалов. \n\nЗаявив, что время скрываться в тени гиганта прошло, государство [MON.getNameDef] готовит силы для вступления в Гражданскую войну в России в эти тяжёлые для нашей Родины времена."
 mongol_foreign_influence.6.a:0 "О нет! Впрочем..."
 mongol_foreign_influence.10.t:0 "Монголия приглашает нас помочь подчинить одного из военачальников"
 mongol_foreign_influence.10.d:0 "Осознавая нашу важную роль и военную мощь в Гражданской войне в Китае, дипломаты государства [MON.getAdjective] обратились к нашим чиновникам с любопытным предложением разделить сферы влияния и соответствующее государство военачальника поблизости. \n\nПредложенный план выглядит следующим образом: сначала мы разделим между собой стратегические районы будущего противника и его сателлитов, если таковые имеются и на них можно предъявить претензии. \n\nПосле составления схемы будет выдвинут единый ультиматум с требованием либо примириться с региональными державами, либо оказаться в дипломатической изоляции и быть быстро уничтоженными. \n\nНарод задаётся вопросом, присоединимся ли мы к борьбе и получим ли часть земель. Какое окончательное решение примет [ROOT.getLeader]?"
 mongol_foreign_influence.10.a:0 "Мы с радостью присоединимся!"
 mongol_foreign_influence.10.b:0 "Другие вопросы важнее"
 mongol_foreign_influence.11.t:0 "Военные государства [FROM.getAdjective] направят свои силы"
 mongol_foreign_influence.11.d:0 "[FROM.getLeader] Он сообщил нам, что они направят дипломатов и военный контингент для обеспечения безопасности отколовшегося региона.\n\nВсе, что нам нужно сделать сейчас, это разделить сферы влияния в соответствии с нашими желаниями и волей наших союзников.\n\n Тогда мы представим ультиматум и увидим, как границы Центральной равнины будут перестраиваться в нашу пользу дипломатическими или военными средствами."
 mongol_foreign_influence.11.a:0 "Великолепно!"
 mongol_foreign_influence.12.t:0 "Чиновники государства [FROM.getAdjective] не проявляют интереса"
 mongol_foreign_influence.12.d:0 "Не имея возможности выделить дополнительные ресурсы на наше «опасное начинание», [FROM.getLeader] решил отклонить скромное предложение. \n\nВ этой борьбе мы не сможем рассчитывать на их поддержку, но действительно ли она была нам необходима, если посмотреть на ситуацию иначе? \n\nМинистр иностранных дел уже заявил, что подобное нежелание лишь оставит нам больше пространства для манёвра."
 mongol_foreign_influence.12.a:0 "Тем хуже для них"
 mongol_foreign_influence.13.t:0 "Чиновники государства [FROM.getAdjective] предъявили нам ультиматум!"
 mongol_foreign_influence.13.d:0 "Дипломатические миссии из различных стран недавно прибыли в центральные учреждения нашего правительства и во главе с делегацией государства [MON.getAdjective] предъявили длинный список требований, в котором обсуждается раздел наших законных земель! \n\nВ представленных документах утверждается, что «время военачальников осталось в прошлом, а Центральная равнина должна быть переустроена в соответствии с потребностями региональных держав, способных объединить раздробленные народы и страны, которые в последние десятилетия видели лишь руины». \n\nМинистр иностранных дел был потрясён наглостью требований и масштабом уступок, которые нам придётся сделать ради «обеспечения мирного сосуществования наших народов». \n\nПохоже, враги тщательно подготовили свою программу..."
 mongol_foreign_influence.13.a:0 "Мы уступим"
 mongol_foreign_influence.13.b:0 "Мы никогда не сдадимся!"
 mongol_foreign_influence.14.t:0 "Чиновники государства [FROM.getAdjective] приняли неизбежное"
 mongol_foreign_influence.14.d:0 "Не выдержав дипломатического давления коалиции, [FROM.getLeader] был вынужден уйти в отставку и передать полномочия новому временному правительству, которое предприняло огромные усилия по изменению административного деления страны. \n\nПосле нескольких тяжёлых дней территории были переданы соответствующим союзникам, а государственная администрация фактически самораспустилась."
 mongol_foreign_influence.14.a:0 "Всё по плану"
 mongol_foreign_influence.15.t:0 "Чиновники государства [FROM.getAdjective] проводят мобилизацию!"
 mongol_foreign_influence.15.d:0 "В своих усилиях по обеспечению сохранности останков разрушающейся страны, [FROM.getLeader] Он решил, что честная борьба лучше, чем «такое бесчестье», фактически объявив военное положение по всей стране и расформировав при этом различные дипломатические учреждения.\n\nС коалиционными силами на их границе любое иностранное участие сведено к минимуму, пока новости о нашем вторжении не дойдут до мировых дипломатов.\n\nВ нашем распоряжении ограниченное время, поэтому мы будем действовать разумно."
 mongol_foreign_influence.15.a:0 "Они сами выбрали свою судьбу"
