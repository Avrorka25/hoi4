 nationalism_on_the_rise:0 "Рост национализма"
 nationalism_on_the_rise_desc:0 "Активные политические силы начали открыто выступать в поддержку националистических ценностей и находят всё больше сторонников среди населения. Путь страны к национальной демократии открыт, остаётся лишь выбрать мирный или насильственный переход."
 prepare_for_nationalist_civil_war:0 "Подготовиться к гражданской войне"
 prepare_for_nationalist_civil_war_desc:0 "У нас нет времени ждать медленных перемен в сознании народа. Ради его же блага необходимо ускорить события, даже если кому-то придётся погибнуть. В отличие от мирного референдума, гражданская война нанесёт огромный ущерб вооружённым силам, промышленности и инфраструктуре страны, но завершится быстрее и позволит впоследствии решительнее навязать нашу волю."
 expand_civil_nationalist_support:0 "Расширить гражданскую поддержку"
 expand_civil_nationalist_support_desc:0 "Мы должны обеспечить дальнейшее распространение поддержки нашего дела среди населения и побуждать людей открыто бросать вызов власти нынешнего правительства. По мере ослабления его позиций и роста гражданских беспорядков нам будет всё легче достигать целей. Особенно если, в отличие от законной смены власти, они предполагают более... зловещий способ изменения режима."
 army_support_for_nationalist_civil_war:0 "Расширить поддержку в армии"
 army_support_for_nationalist_civil_war_desc:0 "Без широкой поддержки армии любые надежды на победу в идеологической борьбе напрасны. Необходимо обеспечить верность ключевых подразделений вооружённых сил."
 ensure_general_loyalty_for_nationalist_civil_war:0 "Обеспечить лояльность младшего командования"
 ensure_general_loyalty_for_nationalist_civil_war_desc:0 "Возможно, некоторые генералы тайно симпатизируют национальной демократии. Мы должны связаться с ними и заручиться их верностью к началу боевых действий."
 ensure_marshal_loyalty_for_nationalist_civil_war:0 "Обеспечить лояльность высшего командования"
 ensure_marshal_loyalty_for_nationalist_civil_war_desc:0 "Возможно, некоторые фельдмаршалы тайно симпатизируют национальной демократии. Мы должны связаться с ними и заручиться их верностью к началу боевых действий."
 siphon_equipment_stockpiles_for_nationalist_civil_war:0 "Перенаправить снаряжение"
 siphon_equipment_stockpiles_for_nationalist_civil_war_desc:0 "Незаметно изымая часть государственных запасов снаряжения, мы сможем создать небольшой тайник с оружием для будущей борьбы."
 formulate_surprise_attack_plan_for_nationalist_civil_war:0 "Разработать план внезапного нападения"
 formulate_surprise_attack_plan_for_nationalist_civil_war_desc:0 "Враг не подозревает о надвигающейся катастрофе. Необходимо сохранить это в тайне и построить планы так, чтобы максимально использовать фактор внезапности."
 ignite_the_nationalist_civil_war:0 "Разжечь гражданскую войну"
 ignite_the_nationalist_civil_war_desc:0 "Пришло время решиться. Все необходимые приготовления завершены. Пути назад больше нет."
 rebuild_the_nation_nationalist:0 "Восстановить страну"
 rebuild_the_nation_nationalist_desc:0 "После гражданской войны настало время восстановить разорённую страну."
 open_up_political_discourse_nationalist:0 "Открыть политическую дискуссию"
 open_up_political_discourse_nationalist_desc:0 "Мы должны допустить в правительстве различные точки зрения. Возможно, со временем это позволит мирно изменить политический курс страны."
 discredit_government_nationalist:0 "Дискредитировать правительство"
 discredit_government_nationalist_desc:0 "Указывая на многочисленные недостатки нынешнего правительства, мы заставим людей задуматься об идеологических причинах его неудач."
 hold_the_nationalist_national_referendum:0 "Провести общенациональный референдум"
 hold_the_nationalist_national_referendum_desc:0 "Заручившись достаточной поддержкой, мы можем безопасно провести референдум и сменить правительство без кровопролития."
 military_support_for_nationalist_civil_war:0 "Есть поддержка армии для гражданской войны.\n"
 stalinism_on_the_rise:0 "Рост марксизма-ленинизма"
