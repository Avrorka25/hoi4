 NSB_poland_monarchist_events.7.t:0 "Русинский вопрос"
 NSB_poland_monarchist_events.7.desc:0 "После перехода Богемии под наше влияние русины, как и словаки, провозгласили автономию. Однако если словакам досталась часть чехословацкой армии, русинам ещё только предстоит создать собственные организованные силы."
 NSB_poland_monarchist_events.7.a:0 "Просто гарантировать их независимость, чтобы венгры не вмешались."
 NSB_poland_monarchist_events.7.b:0 "Они наверняка согласятся присоединиться к нам при более широкой автономии."
 NSB_poland_monarchist_events.7.c:0 "Ввести армию."
 NSB_poland_monarchist_events.7.d:0 "Русины? Пф, они не стоят нашего времени."
 NSB_poland_monarchist_events.8.t:0 "[POL.GetNameDefCap] требует нашего подчинения"
 NSB_poland_monarchist_events.8.desc:0 "Пока Прага пребывала в смуте, нам представилась возможность обрести независимость. Однако мы — крошечная страна, окружённая державами, желающими нами править. Укрепив власть в Праге, [POL.GetLeader] прислал свои требования: мы сохраним часть автономии в обмен на подчинение польско-богемской короне."
 NSB_poland_monarchist_events.8.a:0 "Это всё равно больше, чем мы получили от чехов."
 NSB_poland_monarchist_events.8.b:0 "Мы не откажемся от вновь обретённой свободы."
 NSB_poland_monarchist_events.9.t:0 "[RUT.GetNameDefCap] принимает наши требования!"
 NSB_poland_monarchist_events.9.desc:0 "Русины приняли наше предложение и согласились передать нам контроль над своей внешней политикой."
 NSB_poland_monarchist_events.9.a:0 "Польша сильна как никогда!"
 NSB_poland_monarchist_events.10.t:0 "[RUT.GetNameDefCap] отвергает наш компромисс!"
 NSB_poland_monarchist_events.10.desc:0 "[RUT.GetAdjective]ие власти решили отвергнуть наше предложение, заявив, что не откажутся от восстановленной свободы."
 NSB_poland_monarchist_events.10.a:0 "Ввести войска!"
 NSB_poland_monarchist_events.10.b:0 "В конце концов, это всего лишь несколько холмов..."
