 POL_Artillery_Motorization_desc:0 "Будущее артиллерии заключается в создании всё более мобильных оружейных платформ."
 POL_Phase_I_Military_Rearmament:0 "Этап I§H:§! Военное перевооружение"
 POL_Phase_I_Military_Rearmament_desc:0 "Первый этап пятнадцатилетнего плана предусматривает быстрое расширение отечественной оборонной промышленности. Полную модернизацию польских вооружённых сил планируется завершить к 1942 году."
 POL_Phase_II_Infrastructure_Development:0 "Этап II§H:§! Развитие инфраструктуры"
 POL_Phase_II_Infrastructure_Development_desc:0 "Второй этап пятнадцатилетнего плана делает особый упор на модернизацию польской инфраструктуры. Мощение сельских дорог и строительство новых шоссе сделают значительную часть страны пригодной для автомобильного транспорта."
 POL_Phase_III_Agriculture_and_Education:0 "Этап III§H:§! Сельское хозяйство и образование"
 POL_Phase_III_Agriculture_and_Education_desc:0 "Третий этап пятнадцатилетнего плана предусматривает модернизацию польского сельского хозяйства. Обеспечив крестьян комбайнами, тракторами и тяжёлой техникой, а также обучив их обслуживанию, мы вновь сделаем сельскохозяйственный экспорт конкурентоспособным."
 POL_Phase_IV_Urbanization:0 "Этап IV§H:§! Стимулы к урбанизации"
 POL_Phase_IV_Urbanization_desc:0 "Четвёртый этап пятнадцатилетнего плана предусматривает быструю урбанизацию страны. Инвестиции в развитие городов, создание новых рабочих мест и щедрые субсидии побудят сельское население переселяться в городские центры."
 POL_Phase_V_Equalize_Poland_A_and_B:0 "Этап V§H:§! Уравнять Польшу «А» и Польшу «Б»"
 POL_Phase_V_Equalize_Poland_A_and_B_desc:0 "Пятый этап пятнадцатилетнего плана окончательно устранит разрыв в доходах между западной и восточной Польшей. Осушение болот на востоке и направление туда помощи на развитие приведут к росту торговли и экономики."
 POL_Polbryt:0 "Polbryt"
 POL_polish_british_shipbuilding:0 "Союз польско-британских судостроителей"
 POL_Liberty_Desire:0 "Стремление к свободе"
 POL_Offer_Czechoslovakia_Protection:0 "Предложить Чехословакии защиту"
 POL_Offer_Czechoslovakia_Protection_desc:0 "После оккупации Судетской области Германией будущее Чехословакии крайне неопределённо. Чтобы обезопасить южный фланг, следует предложить ей защиту. Однако такое соглашение потребует временной интеграции чехословацкого правительства и армии с нашими структурами."
 POL_Civil_Service_Reform_tt:0 "Открывает §Hадминистративные§! решения"
 POL_tank_theorist:0 "Теоретик танкостроения"
 POL_Gundlach_Periscope:0 "Перископ Гундляха"
 POL_Gundlach_Periscope_desc:0 "Для эффективного боя бронетехнике необходим круговой обзор на 360 градусов. Эти возможности должны обеспечиваться без ущерба для удобства экипажа и габаритов машины."
