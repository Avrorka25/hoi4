 POL_diplomatic_mission_to_FROM:0 "Дипломатическая миссия в [FROM.getNameDef]"
 POL_diplomatic_mission_to_FROM_tt:0 "Открывает решения по §Hвлиянию на другие государства§!, чтобы они §Gвступили в альянс Польши§!."
 POL_Complete_Focus_Workers_Brigades:0 "Завершить фокус: §HРабочие бригады§!"
 POL_Workers_Brigades_tt:0 "Открывает решения §Hгражданской обороны§!"
 POL_expand_socialist_action_militia:0 "Расширить милицию социалистического действия"
 POL_expand_socialist_action_militia_desc:0 "Поддержка партийных военизированных формирований значительно усилит вооружённые силы."
 POL_expand_socialist_action_militia_tt:0 "§HПехота§!:\n    Атака в городе: §G+15%§!\n    Защита в городе: §G+15%§!"
 POL_urban_combat_specialization:0 "Специализация на городском бою"
 POL_monarchy_party_long:0 "Монархисты"
 POL_monarchy_party:0 "Монархисты"
 POL_His_Majestys_Most_Loyal_Minister:0 "Вернейший министр Его Величества"
 POL_king_of_poland:0 "Король Польши"
 POL_german_origins:0 "Германское происхождение"
 POL_monarchist_debate_in_the_Sejm:0 "Монархические дебаты в Сейме"
 POL_monarchist_debate_in_the_Sejm_desc:0 "Польско-германские отношения имеют непростую историю. Чтобы укрепить нынешний союз между двумя странами, вновь звучат предложения сделать саксонского принца Фридриха Кристиана Веттина номинальным монархом, а президента [POL.GetLeader] — вернейшим министром Его Величества."
 POL_Polish_Cipher_Bureau_Focus0:0 "Польское бюро шифров"
 POL_Polish_Cipher_Bureau_Focus0_desc:0 "Польскому бюро шифров поручены контрразведка, радиолокационное обнаружение и криптоанализ."
 POL_Polish_Cipher_Bureau_Focus1:0 "Метод решётки"
 POL_Polish_Cipher_Bureau_Focus1_desc:0 "Разработаны методы полного перебора для взлома криптографического ключа шифра «Энигмы»."
 POL_Polish_Cipher_Bureau_Focus2:0 "Циклометр"
 POL_Polish_Cipher_Bureau_Focus2_desc:0 "Создана машина-каталог шифров «Энигмы», позволяющая быстро расшифровывать коды германской разведки."
 POL_Polish_Cipher_Bureau_Focus3:0 "Криптологическая бомба"
 POL_Polish_Cipher_Bureau_Focus3_desc:0 "Разработано механическое вычислительное устройство для автоматизации взлома кодов германской разведки."
 PPS_Faction:0 "Коммунистический интернационал"
 organizer_of_the_volhynia_experiment:0 "Организатор Волынского эксперимента"
 POL_Enigma_Effect_Tooltip:0 " теперь доступен как национальный фокус."
 POL_Encryption_Decryption_tooltip:0 "§H1§! бонус §G100%§! к исследованию: §HШифрование и дешифрование§!\n"
 UKR_neutrality_drift:0 "Директория"
 UKR_neutrality_drift_desc:0 "Директория — временный исполнительный орган власти, наделённый Центральной радой Украинской Народной Республики чрезвычайными полномочиями военного времени."
 POL_Head_of_State_Police:0 "Глава государственной полиции"
 POL_Freighter_Manufacturer:0 "Производитель грузовых судов"
 POL_Steam_Turbines_and_Steelworks:0 "Паровые турбины и металлургические заводы"
 POL_Rural_Education_Initiative:0 "Инициатива сельского образования"
 POL_Rural_Education_Initiative_desc:0 "Доступ к образованию в самых отдалённых районах страны остаётся крайне неравномерным. Улучшенная инфраструктура позволит исправить эту проблему."
 POL_Higher_School_Of_War:0 "Высшая военная школа"
 POL_Higher_School_Of_War_desc:0 "Более строгая техническая и инженерная программа подготовки старших офицеров позволит армии не отставать от современных новшеств."
 POL_Class_A_Reservists:0 "Резервисты класса «А»"
 POL_Class_A_Reservists_desc:0 "Вторая Речь Посполитая располагает 2,5 миллиона обученных стрелков, однако из-за нехватки снаряжения сейчас на военную службу призвана лишь половина. Следует задействовать наши резервы."
 POL_Create_Units_ON:0 "Получить тринадцать независимых резервных бригад §Hнациональной обороны§! по §Hтри пехотных батальона§! в Западной Польше."
 POL_Grant_Sir_Adrian_Carton_de_Wiart_Citizenship:0 "Предоставить гражданство сэру Адриану Картон де Виарту"
 POL_Grant_Sir_Adrian_Carton_de_Wiart_Citizenship_desc:0 "Сэр Адриан Картон де Виарт возглавляет британскую военную миссию в Польше. С момента основания Второй Речи Посполитой он был преданным советником и защитником польского дела. Учитывая его прежнюю службу и любовь к нашей стране, стоит предоставить ему гражданство и официальную военную должность."
 POL_Align_With_Japan:0 "Сблизиться с Японией"
 POL_Align_With_Japan_desc:0 "Создание единого фронта с Японией позволит нанести государству [SOV.GetName] смертельный удар с двух направлений."
 POL_Invite_Sweden:0 "Пригласить Швецию"
 POL_Invite_Sweden_desc:0 "По ту сторону Балтийского моря социализм прочно укоренился и открывает возможность обрести новых союзников."
 POL_Pressure_Gdansk_Border_Conflict_tooltip:0 "Начать §Hпограничный конфликт§! с §H[DNZ.GetNameDef]§! или §H[GER.GetNameDef]§!.\n"
 POL_GER_Yes_Danzig_Intervention:0 "Если в государстве [DNZ.GetNameDef] вспыхнут боевые действия, мы можем быть втянуты в §Hпограничный конфликт§! с [POL.GetNameDef]."
 POL_GER_No_Danzig_Intervention:0 "В случае начала боевых действий мы оставим [DNZ.GetNameDef] на произвол судьбы."
 poland.37.b:0 "Проигнорировать их и ввести армию!"
 poland.194.t:0 "Резолюция Лиги Наций нарушена"
 poland.194.d:0 "Несмотря на осуждение Лиги Наций, [POL.GetNameDef] по-прежнему намерено установить контроль над Данцигом. Конфликт неизбежен."
 poland.194.a:0 "Нашей милиции придётся возвести баррикады на улицах."
 poland.194.b:0 "Следует обратиться за помощью к Отечеству."
 poland.195.t:0 "Поддержим ли мы Данциг?"
 poland.195.d:0 "Лига Наций сейчас голосует по вопросу изменения статуса Данцига как международного города. Польша стремится присоединить эту территорию. Хотя вероятность конфликта пока невелика, нам следует определить свою позицию."
 poland.195.a:0 "В случае конфликта мы поддержим Данциг."
 poland.195.b:0 "Пусть рассчитывают только на себя."
 Danzig_POL_border_conflict_time_until_cancelled:0 "Завершение конфликта за [DNZ.GetNameDef]"
 Danzig_POL_border_conflict_time_until_cancelled_desc:0 "При нынешнем темпе мы сможем поддерживать боевые действия лишь ограниченное время, после чего придётся прекратить сражение."
 Danzig_POL_border_conflict_escalate_conflict:0 "Обострить конфликт за [DNZ.GetNameDef]"
 Danzig_POL_border_conflict_escalate_conflict_desc:0 "Конфликт за [DNZ.GetNameDef] зашёл в тупик. Возможно, дальнейшая эскалация и переброска дополнительных войск на этот театр позволят нам добиться победы."
 Danzig_POL_border_conflict_escalate_to_war:0 "Объявить войну за [DNZ.GetNameDef]"
 Danzig_POL_border_conflict_escalate_to_war_desc:0 "Бои за [DNZ.GetNameDef] продолжаются уже некоторое время и не собираются прекращаться. Мы должны быть готовы сделать следующий шаг и рассматривать этот конфликт как начало полномасштабной войны."
 Danzig_POL_border_conflict_back_out_of_conflict:0 "Отступить"
 Danzig_POL_border_conflict_back_out_of_conflict_desc:0 "Опасность того, что конфликт выйдет из-под контроля и перерастёт в полномасштабную войну между нашими странами, слишком велика. Следует признать потери и начать осторожные дипломатические контакты с другой стороной."
 Gdansk_POL_border_conflict_time_until_cancelled:0 "Завершение конфликта за [DNZ.GetNameDef]"
 Gdansk_POL_border_conflict_time_until_cancelled_desc:0 "При нынешнем темпе мы сможем поддерживать боевые действия лишь ограниченное время, после чего придётся прекратить сражение."
