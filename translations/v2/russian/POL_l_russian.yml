 POL_Swiatecki_Bomb_Slip:0 "Бомбосбрасыватель Свёнтецкого"
 POL_Swiatecki_Bomb_Slip_desc:0 "Крупным высотным бомбардировщикам необходимы специальные механизмы для перевозки большей бомбовой нагрузки. Создание специализированных бомбосбрасывателей позволит применять более разрушительные боеприпасы."
