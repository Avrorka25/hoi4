 military_support_for_socialist_civil_war77:0 "Есть поддержка армии для гражданской войны.\n"
 Danzig_poland_border_conflict.1.t:0 "Военные столкновения за [DNZ.GetNameDef]"
 Danzig_poland_border_conflict.1.desc:0 "Вопреки решению Лиги Наций государство [POL.GetNameDef] готовится ввести войска и оккупировать [DNZ.GetNameDef]. Государственной милиции и полиции Данцига приказано оказать символическое сопротивление. В Германии высока общественная поддержка вмешательства, и военизированные формирования с добровольцами уже направляются на помощь."
 Danzig_poland_border_conflict.1.a:0 "Неприемлемо."
 Danzig_poland_border_conflict.2.t:0 "Польша оккупирует [DNZ.GetNameDef]"
 Danzig_poland_border_conflict.2.desc:0 "После столкновения польской армии с данцигской милицией и германскими добровольцами польские войска разгромили сопротивление. Верфи Данцига захвачены, а гражданская администрация заменена военным трибуналом. Лига Наций открыто осудила эти действия, но не желает принимать дальнейшие меры."
 Danzig_poland_border_conflict.2.a:0 "Мы отвоевали законный выход к морю."
 Danzig_poland_border_conflict.2.b:0 "В своё время мы отомстим за эту обиду."
 Danzig_poland_border_conflict.3.t:0 "Отступление Польши из [DNZ.GetNameDef]"
 Danzig_poland_border_conflict.3.desc:0 "После столкновения польской армии с данцигской милицией и германскими добровольцами польским войскам приказали отступить из-за более сильного, чем ожидалось, сопротивления в городе и помощи со стороны Германии. \n\nВвиду вновь обретённой автономии Лига Наций согласилась разрешить плебисцит, который определит судьбу международного города."
 Danzig_poland_border_conflict.3.a:0 "Этот национальный позор будет иметь последствия внутри страны."
 Danzig_poland_border_conflict.3.b:0 "Данциг — германский."
 Danzig_poland_border_conflict.4.t:0 "Патовая ситуация вокруг [DNZ.GetNameDef]"
 Danzig_poland_border_conflict.4.desc:0 "Разрозненные столкновения за [DNZ.GetNameDef] прекратились после того, как обе стороны отошли для укрепления позиций. Признав бессмысленность боёв, стороны согласились на дипломатический компромисс и сохранение статус-кво."
 Danzig_poland_border_conflict.4.a:0 "Пока лучше сохранить статус-кво."
 Danzig_poland_border_conflict.5.t:0 "Эскалация вокруг [DNZ.GetNameDef]"
 Danzig_poland_border_conflict.5.desc:0 "В районе Данцига продолжаются бои между польскими и германскими военизированными формированиями. Пытаясь выйти из тупика, польские войска в других районах также начали вступать в столкновения с германскими силами по всей Померании. Разведка обеих сторон сообщает о растущем притоке войск в регион."
 Danzig_poland_border_conflict.5.a:0 "Мы должны удержать рубеж."
 Danzig_poland_border_conflict.6.t:0 "Военный конфликт за [DNZ.GetNameDef]"
 Danzig_poland_border_conflict.6.desc:0 "Поступают срочные сообщения о том, что целые подразделения германской армии пересекают польско-германскую границу в нескольких местах. Похоже, Германия собирается превратить ситуацию в крупный конфликт. Объявлена всеобщая мобилизация."
 Danzig_poland_border_conflict.6.a:0 "Мы должны удержать рубеж."
 Gdansk_poland_border_conflict.2.t:0 "Польша оккупирует [DNZ.GetNameDef]"
 Gdansk_poland_border_conflict.2.desc:0 "После столкновения польской армии с данцигской милицией польские войска разгромили сопротивление. Верфи Данцига захвачены, а гражданская администрация заменена военным трибуналом. Лига Наций открыто осудила эти действия, но не желает принимать дальнейшие меры."
 Gdansk_poland_border_conflict.2.a:0 "Мы отвоевали законный выход к морю."
 Gdansk_poland_border_conflict.2.b:0 "Наша борьба послужила предупреждением."
 Gdansk_poland_border_conflict.3.t:0 "Отступление Польши из [DNZ.GetNameDef]"
 Gdansk_poland_border_conflict.3.desc:0 "После столкновения польской армии с данцигской милицией польским войскам приказали отступить из-за более сильного, чем ожидалось, сопротивления в городе и помощи со стороны Германии. \n\nВвиду вновь обретённой автономии Лига Наций согласилась разрешить плебисцит, который определит судьбу международного города."
 Gdansk_poland_border_conflict.3.a:0 "Этот национальный позор будет иметь последствия внутри страны."
 Gdansk_poland_border_conflict.3.b:0 "Мы свободны."
 Gdansk_poland_border_conflict.4.t:0 "Патовая ситуация вокруг [DNZ.GetNameDef]"
 Gdansk_poland_border_conflict.4.desc:0 "Разрозненные столкновения за [DNZ.GetNameDef] прекратились после того, как обе стороны отошли для укрепления позиций. Признав бессмысленность боёв, стороны согласились на дипломатический компромисс и сохранение статус-кво."
 Gdansk_poland_border_conflict.4.a:0 "Пока лучше сохранить статус-кво."
 poland_border_conflict.1.t:0 "Польская интервенция в гражданскую войну в Германии"
 poland_border_conflict.1.desc:0 "В публичном заявлении [POL.GetLeader] объявил, что польская армия вмешается, чтобы защитить анклавы этнических поляков в Силезии от насилия. В нескольких приграничных районах уже вспыхнули беспорядки, несомненно организованные польским правительством как предлог для вмешательства. \n\n Мы направили официальный дипломатический протест, но польский посол утверждает, что ответные меры оправданы."
 poland_border_conflict.1.a:0 "Неприемлемо."
 poland_border_conflict.2.t:0 "Польская победа в Силезии"
 poland_border_conflict.2.desc:0 "После столкновения германских и польских войск в Силезии польские силы преодолели слабое сопротивление и заняли регион. Польская пресса ликует, сравнивая успех с победами Синей армии Юзефа Халлера, которая сломила германское сопротивление и отвоевала Померанию у Веймарской республики в 1920 году. [POL.GetLeader] пообещал и дальше принимать меры для защиты этнических поляков на германских территориях."
 poland_border_conflict.2.a:0 "Успешная «миротворческая» операция."
 poland_border_conflict.2.b:0 "Следует подготовиться к новым возможным вторжениям."
 poland_border_conflict.3.t:0 "Поражение Польши в Силезии"
 poland_border_conflict.3.desc:0 "После столкновения германских и польских войск в Силезии дороги региона оказались усеяны повреждённой и брошенной польской техникой. \n\n Несколько польских атак на поспешно возведённые германские оборонительные позиции провалились с тяжёлыми потерями. Мало кто сомневается, что эта катастрофа охладит стремление к новым попыткам вмешательства."
 poland_border_conflict.3.a:0 "Огромный удар по нашему престижу."
 poland_border_conflict.3.b:0 "В своё время мы отомстим."
 poland_border_conflict.4.t:0 "Патовая ситуация в Силезии"
 poland_border_conflict.4.desc:0 "Разрозненные бои между польскими и германскими войсками зашли в тупик. Не желая дальнейшей эскалации, стороны договорились о прекращении огня и отводе сил."
 poland_border_conflict.4.a:0 "Мы получили ценный опыт."
 poland_border_conflict.5.t:0 "Официальное объявление войны"
 poland_border_conflict.5.desc:0 "Назвав вторжения польских войск на германскую территорию актом войны, [FROM.GetNameDef] объявило войну государству [POL.GetNameDef]. Похоже, [FROM.GetNameDef] уверено, что сможет победить в войне на два фронта."
 poland_border_conflict.5.a:0 "Мы должны удержать рубеж."
 prussia_poland_border_conflict.1.t:0 "Польская интервенция в гражданскую войну в Германии"
 prussia_poland_border_conflict.1.desc:0 "В публичном заявлении [POL.GetLeader] объявил, что польская армия вмешается, чтобы защитить анклавы этнических поляков в Восточной Пруссии от насилия. В нескольких приграничных районах уже вспыхнули беспорядки, несомненно организованные польским правительством как предлог для вмешательства. \n\n Мы направили официальный дипломатический протест, но польский посол утверждает, что ответные меры оправданы."
 prussia_poland_border_conflict.1.a:0 "Неприемлемо."
 prussia_poland_border_conflict.2.t:0 "Польская победа в Восточной Пруссии"
 prussia_poland_border_conflict.2.desc:0 "После столкновения германских и польских войск в Восточной Пруссии польские силы преодолели слабое сопротивление и заняли регион. Польская пресса ликует, сравнивая успех с победами Синей армии Юзефа Халлера, которая сломила германское сопротивление и отвоевала Померанию у Веймарской республики в 1920 году. [POL.GetLeader] пообещал и дальше принимать меры для защиты этнических поляков на германских территориях."
 prussia_poland_border_conflict.2.a:0 "Успешная «миротворческая» операция."
 prussia_poland_border_conflict.2.b:0 "Следует подготовиться к новым возможным вторжениям."
 prussia_poland_border_conflict.3.t:0 "Поражение Польши в Восточной Пруссии"
 prussia_poland_border_conflict.3.desc:0 "После столкновения германских и польских войск в Восточной Пруссии дороги региона оказались усеяны повреждённой и брошенной польской техникой. \n\n Несколько польских атак на поспешно возведённые германские оборонительные позиции провалились с тяжёлыми потерями. Мало кто сомневается, что эта катастрофа охладит стремление к новым попыткам вмешательства."
 prussia_poland_border_conflict.3.a:0 "Огромный удар по нашему престижу."
 prussia_poland_border_conflict.3.b:0 "В своё время мы отомстим."
 prussia_poland_border_conflict.4.t:0 "Патовая ситуация в Восточной Пруссии"
 prussia_poland_border_conflict.4.desc:0 "Разрозненные бои между польскими и германскими войсками зашли в тупик. Не желая дальнейшей эскалации, стороны договорились о прекращении огня и отводе сил."
 prussia_poland_border_conflict.4.a:0 "Мы получили ценный опыт."
 prussia_poland_border_conflict.5.t:0 "Официальное объявление войны"
 prussia_poland_border_conflict.5.desc:0 "Назвав вторжения польских войск на германскую территорию актом войны, [FROM.GetNameDef] объявило войну государству [POL.GetNameDef]. Похоже, [FROM.GetNameDef] уверено, что сможет победить в войне на два фронта."
 prussia_poland_border_conflict.5.a:0 "Мы должны удержать рубеж."
 poland_r56.13.t:0 "Приглашение в проект Междуморья"
 poland_r56.13.d:0 "Стремясь обеспечить дальнейшую независимость Восточной Европы перед лицом возможных агрессоров, Польша предложила нам вступить в союз для защиты общей безопасности и интересов."
 poland_r56.13.a:0 "С радостью. Вместе мы переживём надвигающуюся бурю."
 poland_r56.13.b:0 "[Root.GetName] идёт собственным путём."
 poland_r56.14.t:0 "[From.GetName] присоединяется к проекту Междуморья"
 poland_r56.14.d:0 "Наш план создания нового восточного блока продвигается вперёд. [From.GetLeader] поддерживает наши усилия, и [From.GetName] приняло приглашение в союз."
 poland_r56.14.a:0 "Польша и [From.GetName] стоят единым братским фронтом."
 poland_r56.15.t:0 "[From.GetName] отказывается вступать в проект Междуморья"
 poland_r56.15.d:0 "Несмотря на все наши усилия предложить совместное выступление в Восточной Европе, последняя попытка обратиться к [From.GetLeader] была встречена скептически. [From.GetName] отказалось вступать в союз — возможно, сомневаясь в наших мотивах, нашей силе или опасаясь, что тесное сближение с нами сделает его мишенью."
 poland_r56.15.a:0 "Мы продолжим без них."
 poland_r56.16.t:0 "Приглашение в Третью Европу"
 poland_r56.16.d:0 "Стремясь обеспечить дальнейшую независимость Восточной Европы перед лицом возможных агрессоров, Польша предложила нам вступить в союз для защиты общей безопасности и интересов."
 poland_r56.16.a:0 "С радостью. Вместе мы сильны."
 poland_r56.16.b:0 "[Root.GetName] идёт собственным путём."
 poland_r56.17.t:0 "Приглашение в Третью Европу"
 poland_r56.17.d:0 "Стремясь обеспечить дальнейшую независимость Восточной Европы перед лицом возможных агрессоров, Польша предложила нам вступить в союз для защиты общей безопасности и интересов."
 poland_r56.17.a:0 "С радостью. Вместе мы сильны."
 poland_r56.17.b:0 "[Root.GetName] идёт собственным путём."
 poland_r56.18.t:0 "[From.GetName] присоединяется к Третьей Европе"
 poland_r56.18.d:0 "Наш план создания нового восточного блока продвигается вперёд. [From.GetLeader] поддерживает наши усилия, и [From.GetName] приняло приглашение в союз."
 poland_r56.18.a:0 "Польша и [From.GetName] стоят единым братским фронтом."
 poland_r56.19.t:0 "[From.GetName] отказывается вступать в Третью Европу"
 poland_r56.19.d:0 "Несмотря на все наши усилия предложить совместное выступление в Восточной Европе, последняя попытка обратиться к [From.GetLeader] была встречена скептически. [From.GetName] отказалось вступать в союз — возможно, сомневаясь в наших мотивах, нашей силе или опасаясь, что тесное сближение с нами сделает его мишенью."
 poland_r56.19.a:0 "Мы продолжим без них."
 poland_r56.20.t:0 "Польско-румынский дипломатический саммит"
 poland_r56.20.d:0 "Наследный принц Румынии Михай и многие ведущие румынские дипломаты приглашены в Варшаву на встречу с министром иностранных дел Польши Юзефом Беком для обсуждения отношений между нашими странами. Этой возможностью можно воспользоваться, чтобы поднять один ключевой вопрос."
 poland_r56.20.a:0 "Обсудить строительство железнодорожной сети между нашими странами."
 poland_r56.20.b:0 "Попросить Румынию отозвать гарантии Чехословакии."
 poland_r56.20.c:0 "Предложить совместные военные учения"
 poland_r56.21.t:0 "Экономическое сотрудничество с Польшей"
 poland_r56.21.d:0 "Министр иностранных дел Польши Юзеф Бек предложил построить железнодорожную сеть, связывающую наши страны. Этот проект может ускорить экономический рост сельских приграничных регионов."
 poland_r56.21.a:0 "Интересное предложение."
 poland_r56.21.b:0 "Нелепое предложение."
 poland_r56.22.t:0 "Дипломатическое сотрудничество с Польшей"
 poland_r56.22.d:0 "На недавнем дипломатическом саммите министр иностранных дел Польши Юзеф Бек попросил нас отозвать гарантии Чехословакии. Польская делегация опасается, что наши обязательства перед Чехословакией осложнят и испортят отношения с Польшей."
 poland_r56.22.a:0 "Интересное предложение."
 poland_r56.22.b:0 "Нелепое предложение."
 poland_r56.23.t:0 "Румыния принимает наше предложение"
 poland_r56.23.d:0 "Юзеф Бек сумел убедить румынскую делегацию, что дальнейшее сотрудничество между нашими странами будет выгодным. Официальное подписание договора уже началось."
 poland_r56.23.a:0 "Вместе мы получим множество преимуществ."
 poland_r56.24.t:0 "Румыния принимает наше предложение"
 poland_r56.24.d:0 "Юзеф Бек сумел убедить румынскую делегацию, что дальнейшее сотрудничество между нашими странами будет выгодным. Официальное подписание договора уже началось."
 poland_r56.24.a:0 "Вместе мы получим множество преимуществ."
 poland_r56.25.t:0 "Румыния отклоняет наше предложение"
 poland_r56.25.d:0 "Дипломатические переговоры на саммите провалились. Румыния отклонила наше предложение о дальнейшем сотрудничестве."
 poland_r56.25.a:0 "Это их потеря."
 poland_r56.26.t:0 "Совместные военные учения с Польшей"
 poland_r56.26.d:0 "На недавнем дипломатическом саммите министр иностранных дел Польши Юзеф Бек спросил, готовы ли мы подтвердить прежние обязательства в области безопасности совместными военными учениями на Волыни. Крупные манёвры помогут проверить готовность армий обеих стран."
 poland_r56.26.a:0 "Интересное предложение."
 poland_r56.26.b:0 "Нелепое предложение."
 poland.27.t:0 "Румыния принимает наше предложение"
 poland.27.d:0 "Высшее военное командование Румынии согласилось провести совместные учения в Волынском воеводстве. Несколько подразделений армий обеих стран вместе с иностранными советниками собираются для запланированных манёвров."
 poland.27.a:0 "Вместе мы получим множество преимуществ."
 poland.30.t:0 "Польша требует дополнительных уступок"
 poland.30.d:0 "Несмотря на наши возражения, [From.GetName] уведомило нас, что его армия установит прямой контроль над верфями Данцига. Утверждая, что мы препятствуем доступу к морю, польские военные намерены силой добиться подчинения. Хотя часть местной автономии сохранится, независимому управлению фактически пришёл конец. Неудивительно, что это заявление вызвало всеобщее недовольство жителей города. Как нам ответить?"
 poland.30.a:0 "Приказать милиции сложить оружие."
 poland.30.b:0 "Приказать милиции оказать символическое сопротивление."
 poland.31.t:0 "Данциг сдаётся"
 poland.31.d:0 "Несмотря на отдельные протесты, польские войска вошли в город без сопротивления. Несколько верфей и складов теперь находятся под прямым управлением армии."
 poland.31.a:0 "Это наш законный выход к морю."
 poland.32.t:0 "Данциг сопротивляется"
 poland.32.d:0 "В знак символического неповиновения данцигской полиции и милиции приказано сопротивляться. У польского почтамта в Данциге слышалась редкая стрельба между военизированными формированиями."
 poland.32.a:0 "Попросить Лигу Наций вмешаться"
 poland.32.b:0 "Они заплатят за свою подрывную деятельность."
 poland.33.t:0 "Международный кризис вокруг Данцига"
 poland.33.d:0 "[From.GetName] требует, чтобы Лига Наций урегулировала спор о Вольном городе Данциге. Утверждая, что власти Данцига угрожают польскому доступу к морю, [From.GetName] просит отменить статус свободного международного города и разрешить польским войскам занять его."
 poland.33.a:0 "Проголосовать за разрешение Польше оккупировать Данциг."
 poland.33.b:0 "Проголосовать за сохранение Данцига свободным городом."
 poland.34.t:0 "[From.GetNameDefCap] поддерживает нас"
 poland.34.d:0 "[From.GetNameDef] решило поддержать нас в совете Лиги Наций."
 poland.34.a:0 "Мы приветствуем их поддержку."
 poland.35.t:0 "[From.GetNameDefCap] выступает против нас"
 poland.35.d:0 "[From.GetNameDefCap] решило выступить против нас в совете Лиги Наций и поддержать статус Данцига как Вольного города."
 poland.35.a:0 "Невыносимо."
 poland.36.t:0 "Лига Наций голосует в нашу пользу"
 poland.36.d:0 "Лига Наций признала, что наш законный доступ к морю нарушается, и разрешила нам оккупировать город."
 poland.36.a:0 "Именно так и должно быть."
 poland.37.t:0 "Лига Наций голосует против нас"
 poland.37.d:0 "Лига Наций отвергла наше требование и постановила, что Данциг должен остаться свободным международным городом."
 poland.37.a:0 "Нам остаётся только подчиниться."
 poland.38.t:0 "Предложение проекта автомагистрали «Берлинка»"
 poland.38.d:0 "Во время визита в Берлин министр иностранных дел Польши Юзеф Бек предложил построить автомагистраль, связывающую Пруссию с остальной Германией. В обмен на разрешение провести экстерриториальную дорогу через польскую территорию он попросил технической помощи для других проектов в Польском коридоре."
 poland.38.a:0 "Интересное предложение."
 poland.38.b:0 "Нелепое предложение."
 poland.39.t:0 "Германия принимает проект экстерриториальной автомагистрали"
 poland.39.d:0 "[From.GetLeader] лично заинтересовался предложением построить автомагистраль между Пруссией и остальной Германией. Строительство вскоре начнётся, а взамен Германия добровольно поможет с другими проектами развития региона."
 poland.39.a:0 "Мудрый выбор."
 poland.40.t:0 "Германия отклоняет проект экстерриториальной автомагистрали"
 poland.40.d:0 "[From.GetLeader] высмеял предложение и отказался от перспективы экономического сотрудничества в Польском коридоре."
 poland.40.a:0 "Тогда мы построим собственную автомагистраль из Варшавы в Гдыню."
 poland.41.t:0 "Инвестиционные возможности"
 poland.41.d:0 "[From.GetLeader] пригласил предпринимателей со всего мира на международную торговую ярмарку в Польше. Этой возможностью можно воспользоваться для установления тесных связей и предоставления стимулов к ведению бизнеса в стране."
 poland.41.a:0 "Побудить автомобильных производителей инвестировать в новые заводы."
 poland.41.b:0 "Продать доли государственных авиационных предприятий."
 poland.41.c:0 "Поощрить инвестиции в горнодобывающую отрасль и предоставить права на землю."
 poland.52.t:0 "[Root.GetLeader] обращается к студентам университетов"
 poland.52.d:0 "Сегодня у одного из варшавских университетов [Root.GetLeader] выступил перед большой толпой подростков и студентов. [Root.GetLeader] назвал молодёжь жизненной силой государства [Root.GetName] и напомнил о героях, таких как капеллан Игнаций Ян Скорупка, погибший во главе атаки при обороне Варшавы в 1920 году. В заключительной части речи [Root.GetLeader] призвал польских студентов..."
 poland.52.a:0 "снова взяться за оружие ради защиты благочестивой польской нации."
 poland.52.b:0 "продолжать усердно учиться."
 poland.53.t:0 "Крупный националистический митинг"
 poland.53.d:0 "Опорой правой партии национальной демократии была Западная Польша. Её главным идеологом являлся Роман Дмовский, пользовавшийся поддержкой значительной части этнически польской интеллигенции, городской нижней прослойки среднего класса, части более состоятельного среднего класса и обширного молодёжного движения. В середине 1930-х годов между старым и новым поколениями партии возник раскол, раздробивший националистическое движение на множество небольших партий-преемниц. Одной из наиболее радикальных отколовшихся групп стал Национально-радикальный лагерь (ОНР). ОНР-Фаланга — маргинальная политическая партия, популярная в узких академических кругах польских университетов. Правительство санации всегда считало её экстремистской помехой, а полиция неоднократно разгоняла её собрания. Однако сегодня фалангисты провели необычайно крупный митинг, открыто бросив вызов правительству санации. Как нам поступить?"
 poland.53.a:0 "Они слишком популярны. Наблюдать за ситуацией."
 poland.53.b:0 "Отправить армию разогнать митинг."
 poland.54.t:0 "Крупная всеобщая забастовка"
 poland.54.d:0 "До окончания Великой войны Польша была разделена между Германией, Австро-Венгрией и Россией. После восстановления независимости сельские восточные районы, прежде входившие в Российскую и Австро-Венгерскую империи, сохранили крупный аграрный сектор. Великая депрессия особенно тяжело ударила по этому региону. В некоторых местах безработица превысила 40%, а угроза голода усиливала радикальные настроения. Сегодня Аграрная народная партия при некоторой поддержке Польской социалистической партии организовала новую забастовку, уже охватившую несколько городов. Без вмешательства ситуация может выйти из-под контроля."
 poland.54.a:0 "Игнорировать их."
 poland.54.b:0 "Отправить армию арестовать участников беспорядков."
 poland.55.t:0 "Война между Германией и Польшей"
 poland.55.d:0 "Между Германией и Польшей началась война. Пришло время выбрать сторону."
 poland.55.a:0 "Воссоединение с Германией предпочтительнее."
 poland.55.b:0 "Мы сохраним независимость."
 poland.56.t:0 "Данциг предаёт нас"
 poland.56.d:0 "Польский гарнизон в Гданьске сообщает о нападении военизированных формирований, полиции и милиции, поддерживаемых местной нацистской партией. Похоже, город решил присоединиться к Германии."
 poland.56.a:0 "Проклятые предатели."
 poland.57.t:0 "Данциг присоединяется к [Root.GetNameDef]"
 poland.57.d:0 "Наши агенты в Данциге сообщили, что местное правительство поддержит наше дело. Данциг никогда по-настоящему не был свободным городом — все эти годы он оставался заложником польского ига и удерживался под чужой властью тиранией врагов. [DNZ.getleader] связался с местными подразделениями и объявил о готовности сотрудничать с нашей армией; жители уже стихийно вывешивают наши флаги из множества окон./nНемцы страдали достаточно долго и больше никогда не будут разделены."
 poland.57.a:0 "Превосходно."
 poland.58.t:0 "Польский коридор теперь принадлежит Германии"
 poland.58.d:0 "Германия оккупировала Польский коридор. Пора решить, стремимся ли мы к воссоединению. Местные жители надеются на возвращение региона, отделённого от Отечества после Великой войны."
 poland.58.a:0 "Воссоединение с Германией предпочтительнее."
 poland.58.b:0 "Мы сохраним независимость."
 poland.59.t:0 "Фронт Морж"
 poland.59.d:0 "Хотя Юзефа Пилсудского любили как отца и защитника польской независимости, его майский переворот 1926 года против Второй Речи Посполитой одобряли далеко не все. Многие выступали против отхода от демократии и часто оказывались оттеснены от политики или вынуждены эмигрировать. Одним из объединений противников санации стал Фронт Морж — союз центристских партий межвоенной Польши. Он был основан в 1936 году в швейцарском городе Морж генералом Владиславом Сикорским и бывшим премьер-министром Польши, знаменитым композитором Игнацием Падеревским. Среди видных деятелей были генерал Юзеф Халлер и бывший заместитель премьер-министра Войцех Корфанты. Их главными целями являлись восстановление демократии, дипломатическое сближение с Францией, избрание Винценты Витоса премьер-министром, а Падеревского — президентом."
 poland.59.a:0 "Мы приветствуем их возвращение в политику."
 poland.60.t:0 "Союз фалангистов?"
 poland.60.d:0 "Во время продолжительного визита и поездки по стране [From.GetLeader] предложил нам вступить в международный фронт для продвижения католических и фалангистских идеалов и интересов. Несмотря на культурные различия, [From.GetLeader] считает, что фалангисты разных стран должны объединиться ради установления нового мирового порядка."
 poland.60.a:0 "Под Богом мы едины."
 poland.60.b:0 "Нас заботят только собственные национальные интересы."
 poland.61.t:0 "[From.GetName] соглашается"
 poland.61.d:0 "После долгих размышлений [From.GetLeader] согласился, что [From.GetName] и [Root.GetName] имеют общие интересы и должны совместно выступать на мировой арене. Дипломатические представители уже направляются в Варшаву для обсуждения и подписания новых соглашений."
 poland.61.a:0 "Благословенный исход."
 poland.62.t:0 "[From.GetName] отказывается"
 poland.62.d:0 "Несмотря на многочисленные попытки, [From.GetLeader] заявил, что не желает втягивать [From.GetName] в иностранные авантюры. Хотя сама идея его заинтересовала, [From.GetLeader] настаивает, что прежде всего обязан защищать интересы государства [From.GetName]."
 poland.62.a:0 "Какое разочарование."
 poland.63.t:0 "Дипломатическая миссия во Францию"
 poland.63.d:0 "В свете нового курса на поддержку Франции вместо нейтралитета туда направляется дипломатическая миссия. Этой возможностью можно воспользоваться для обсуждения ряда вопросов между нашими странами."
 poland.63.a:0 "Попросить разрешения приобрести лёгкие танки."
 poland.63.b:0 "Предложить купить Мадагаскар."
 poland.63.c:0 "Вместо этого просто выкупить французские инвестиции в Польше."
 poland.64.t:0 "Предложение Польши о покупке танков"
 poland.64.d:0 "Недавно прибыла польская дипломатическая и военная делегация. Она просит разрешения заключить контракт с частной компанией на производство французских танков для Польши. Предлагаемая плата весьма значительна."
 poland.64.a:0 "Любопытное предложение."
 poland.64.b:0 "Сделки не будет."
 poland.65.t:0 "Предложение Польши о покупке Мадагаскара"
 poland.65.d:0 "Недавно прибыла делегация Польской морской и колониальной лиги. Она предлагает приобрести нашу колонию Мадагаскар. Предлагаемая плата весьма значительна."
 poland.65.a:0 "Любопытное предложение."
 poland.65.b:0 "Сделки не будет."
 poland.66.t:0 "Заключён французский контракт"
 poland.66.d:0 "Правительство Франции разрешило нам заключить контракт с частной компанией на производство партии танков для нашей армии."
 poland.66.a:0 "Отлично."
 poland.67.t:0 "Мадагаскар приобретён"
 poland.67.d:0 "Франция согласилась продать нам колонию Мадагаскар. Экспедиция под руководством майора польской армии Мечислава Лепецкого уже отправлена для обследования территории. Чтобы в полной мере использовать её ресурсы, нам потребуются международный порт и полноценный торговый флот."
 poland.67.a:0 "Польша может в колонии!"
 poland.68.t:0 "Франция отклоняет предложение"
 poland.68.d:0 "Французское правительство отклонило наше предложение — возможно, из-за опасений относительно наших намерений или союзников, а может, просто из недоверия."
 poland.68.a:0 "Тогда мы просто выкупим французские инвестиции."
 poland.70.t:0 "Правое крыло санации"
 poland.70.d:0 "В вакууме власти, возникшем после смерти Юзефа Пилсудского и недавних реформ Апрельской конституции, правое крыло санации во главе с Эдвардом Рыдз-Смиглы сумело занять господствующее положение, воспользовавшись распрями в правящей элите.\n\nЭдвард Рыдз-Смиглы известен по всей Польше как выдающийся командир польско-советской войны. Он провёл множество успешных наступлений против большевиков, включая первоначальный захват Вильно и Двинска, а в качестве главнокомандующего латвийскими вооружёнными силами — Латгалии. В самые тяжёлые дни, когда польская столица была осаждена Красной армией, Центральный фронт под его руководством устоял в Варшавской битве и сыграл важнейшую роль в перекрытии путей отхода окружённых советских войск.\n\nПосле завершения польско-советской войны Рыдз-Смиглы стал генеральным инспектором польской армии сначала в Виленском, а затем в Варшавском округе. Во время переворота Пилсудского 1926 года он полностью поддержал маршала. В награду за верность Пилсудский назначил его заместителем маршала по всем вопросам, касавшимся востока. Согласно последней воле Пилсудского после его смерти Рыдз-Смиглы был назначен генеральным инспектором польских вооружённых сил — на высшую военную должность в стране."
 poland.70.a:0 "А теперь к настоящему."
 poland.71.t:0 "Укрепление правительства"
 poland.71.d:0 "Валерий Славек оттеснён на политическую периферию, Игнаций Мосцицкий переигран, а многие сторонники Лагеря национального объединения заняли ключевые посты. Остаётся решить, как поступить с остальной правящей элитой."
 poland.71.a:0 "Заключить соглашение о разделении власти с президентом Игнацием Мосцицким."
 poland.71.b:0 "Распустить Сейм и взять всю власть."
 poland.72.t:0 "Соглашение о разделении власти"
 poland.72.d:0 "Игнаций Мосцицкий является полезным союзником, особенно в управлении экономикой страны, а также позволяет сохранить множество талантливых связей. На состоявшейся сегодня торжественной церемонии президент Мосцицкий вручил Эдварду Рыдз-Смиглы маршальский жезл, присвоив ему особое звание, которое прежде носил только Юзеф Пилсудский. Теперь Эдвард Рыдз-Смиглы — второй маршал Польши. Значительная часть элиты недовольна восстановлением такого титула, но неохотно подчиняется. Хотя государственная пресса в пропагандистских целях называет маршала Рыдз-Смиглы «вторым человеком в государстве после президента», чтобы успокоить общество, на деле президент почти лишён власти, а управление находится в руках маршала."
 poland.72.a:0 "Новый первый солдат «Республики»."
 poland.73.t:0 "Роспуск Сейма"
 poland.73.d:0 "На чрезвычайном заседании Сейма Эдвард Рыдз-Смиглы под насмешки депутатов объявил о скором роспуске законодательного органа, фактически положив конец Второй Речи Посполитой. Он провозгласил себя вторым маршалом Польши и заявил, что, подобно Юзефу Пилсудскому, защитит страну от любых угроз. Однако в отличие от Пилсудского Рыдз-Смиглы утверждает, что пойдёт до конца, чтобы коррупция больше не могла скрываться за демократическими институтами. Военные, и без того глубоко вовлечённые в государственные дела, теперь полностью возьмут управление страной. Хотя общество потрясено столь резким поворотом, государственная пресса уже проводит патриотические параллели между недавним переворотом Рыдз-Смиглы против коррумпированной элиты и майским переворотом Юзефа Пилсудского против якобы коррумпированной системы."
 poland.73.a:0 "Лидер нового Польского государства."
 poland.74.t:0 "Дипломатический доклад"
 poland.74.d:0 "Отношения между польским правительством и Вольным городом Данцигом давно остаются напряжёнными. Во время польско-советской войны в начале 1920-х годов и германского эмбарго против Польши в 1925 году рабочие гданьских верфей дважды отказывались разгружать польские суда. Опасения за экономическую безопасность страны стали одним из главных стимулов к созданию близлежащего порта Гдыня. В 1933 году к власти в городе пришло местное отделение Национал-социалистической немецкой рабочей партии. Напряжённость вновь усилилась из-за отделения Данцига от Германии и притеснения польского меньшинства.\n\nНа недавней встрече польского «министра иностранных дел» Юзефа Бека и германского «рейхсминистра иностранных дел» Иоахима фон Риббентропа наконец был достигнут компромисс. Адольф Гитлер поручил местному нацистскому правительству прекратить антипольские действия. Взамен мы пообещали не поддерживать антинацистскую оппозицию Данцига. Хотя вопрос о статусе города далёк от решения, недавнее сближение принесло некоторые положительные результаты."
 poland.74.a:0 "Лучше держаться в стороне от внутренних проблем Данцига."
 poland.75.t:0 "Доклад о международных отношениях"
 poland.75.d:0 "Вскоре после прихода Адольфа Гитлера к власти в 1933 году Юзеф Пилсудский заключил с Германией пакт о ненападении 26 января 1934 года. Германия признала нынешние границы Польши и прекратила разрушительную таможенную войну, продолжавшуюся почти десятилетие. Пилсудский верно предположил, что в случае войны французская армия займёт исключительно оборонительную позицию и оставит восточных союзников на произвол судьбы. Строительство линии Мажино с 1929 года и последующий отказ Франции оказывать давление на Германию лишь укрепили его убеждения.\n\nОднако Пилсудский ошибочно считал, что пакт устранит опасность превращения Польши в первую цель германской агрессии. Германская дипломатия того времени часто демонстрировала благосклонность к Польше, особенно как к партнёру в борьбе против Советского Союза. Пилсудский всё ещё не доверял Гитлеру, но полагал, что австрийское происхождение последнего смягчит прежнюю холодность германо-польских отношений, характерную для «антипольских политиков прусского типа». За этим последовало открытие торговли, однако дружественные жесты тайно и намеренно служили лишь уловкой, призванной усыпить бдительность поляков."
 poland.75.a:0 "Но ведь в этой временной линии мы сможем избежать войны, правда?"
 poland.76.t:0 "Меняющийся политический климат"
 poland.76.d:0 "В 1938 году открытая дипломатическая ситуация между Германией и Польшей резко изменилась. В октябре 1938 года министр иностранных дел Германии Иоахим Риббентроп потребовал вернуть Вольный город Данциг Германии и разрешить строительство автомагистрали и железнодорожного сообщения через Польский коридор в Пруссию. Взамен Германия соглашалась уважать существующие границы Польши. Хотя идея автомагистрали ранее уже обсуждалась Риббентропом и Беком, польское правительство отвергло её, опасаясь новых требований Германии и подрыва независимости страны. Вскоре Адольф Гитлер выдвинул дополнительные требования, настаивая на принятии Польшей «германских консультаций по внешней политике». Опасения польского правительства оправдались."
 poland.76.a:0 "Мы решили уступить, но только в обмен на их защиту."
 poland.77.t:0 "Польша стремится вступить в Ось"
 poland.77.d:0 "Министр иностранных дел Польши Юзеф Бек сообщил, что польское правительство готово передать нам Вольный город Данциг и согласиться на наши консультации по вопросам внешней политики. В обмен оно просит гарантировать нынешние границы Польши и подписать пакт о защите от советской угрозы и любых других возможных агрессоров. Как нам ответить?"
 poland.77.a:0 "Отлично."
 poland.77.b:0 "Наши требования не подлежат обсуждению."
 poland.78.t:0 "Пакт Риббентропа — Бека"
 poland.78.d:0 "Германское правительство приняло сделку. Связывая свою судьбу с Германией, мы начинаем новую главу истории. Формально сохраняя независимость, мы согласились следовать германской внешней политике и сотрудничать с ней."
 poland.78.a:0 "Будем надеяться, что нам удастся сохранить независимость."
 poland.79.t:0 "Германия отказывает"
 poland.79.d:0 "Германское правительство отклонило наше предложение, заявив, что его требования не обсуждаются и оно не желает подписывать пакт, обязывающий прийти нам на помощь в случае войны. Остаётся заключить, что мы являемся ближайшей целью германской агрессии."
 poland.79.a:0 "Это достаточное основание для мобилизации армии."
 poland.80.t:0 "Польско-французские отношения"
 poland.80.d:0 "Во время польско-советской войны Франция направила в Польшу военную миссию из 400 офицеров. Работа французской делегации дала заметные результаты в организации и снабжении молодой польской армии. Вскоре после войны был подписан военный пакт для сдерживания двойной угрозы Германии и Советского Союза. Франция обязалась помогать Польше экономически, но не должна была объявлять войну в случае нападения на неё. Однако на фоне германского перевооружения и агрессии 19 мая 1939 года в Париже была подписана конвенция Каспшицкого — Гамелена, названная в честь польского министра военных дел генерала Тадеуша Каспшицкого и главнокомандующего французской армией Мориса Гамелена. Теперь обе страны были полностью связаны обязательствами на случай конфликта.\n\nСегодня мы попросили Францию пойти ещё дальше и нанести превентивный удар по Германии. [Root.GetLeader] отправился во Францию, чтобы добиться единства взглядов на германскую угрозу и заручиться поддержкой ранних ответных действий."
 poland.80.a:0 "Возможно, на этот раз они проявят твёрдость."
 poland.81.t:0 "Польско-французские отношения"
 poland.81.d:0 "Во время польско-советской войны Франция направила в Польшу военную миссию из 400 офицеров. Её работа дала заметные результаты в организации и снабжении новой польской армии. Вскоре после войны был подписан военный пакт для сдерживания двойной угрозы Германии и Советского Союза. Франция обязалась помогать Польше экономически, но не должна была объявлять войну в случае нападения на неё. Однако на фоне германского перевооружения и агрессии 19 мая 1939 года в Париже была подписана конвенция Каспшицкого — Гамелена, названная в честь польского министра военных дел генерала Тадеуша Каспшицкого и главнокомандующего французской армией Мориса Гамелена. Теперь обе страны были полностью связаны обязательствами на случай конфликта.\n\nСегодня мы выполним эти обязательства."
 poland.81.a:0 "«Восточного предательства» не будет."
 poland.82.t:0 "Превентивный удар по Германии?"
 poland.82.d:0 "Польское правительство предложило нанести наступательный удар в самое сердце Германии. Оно обеспокоено растущей германской агрессией и перевооружением в Европе и просит нашей помощи, чтобы обуздать Германию."
 poland.82.a:0 "Интересное предложение."
 poland.82.b:0 "Абсурд."
 poland.83.t:0 "Франция соглашается нанести ответный удар"
 poland.83.d:0 "Французское правительство разделило нашу позицию и начинает мобилизацию армии."
 poland.83.a:0 "Отлично."
 poland.84.t:0 "Франция отступает"
 poland.84.d:0 "Французское правительство не проявило интереса к предложению и по-прежнему считает, что с Германией можно договориться дипломатическим путём."
 poland.84.a:0 "Мы нападём на Германию самостоятельно."
 poland.84.b:0 "Вместо этого сохраним армию мобилизованной и готовой."
 poland.85.t:0 "Второе восстание донских казаков"
 poland.85.d:0 "Тестовое событие — не завершено."
 poland.85.a:0 "Всё равно продолжить."
 poland.86.t:0 "Культ маршала"
 poland.86.d:0 "Пилсудский никогда не стремился возвысить себя или создать миф вокруг собственного наследия. Ему приписывают известную фразу:\n\n«Я не собираюсь указывать вам, что писать о моей жизни и работе. Прошу лишь не изображать меня нытиком и сентименталистом».\n\nОднако правительство санации увидело в наследии маршала полезный инструмент пропаганды. Сразу после его смерти государственные СМИ прославляли его как блестящего стратега, государственного деятеля, провидца и отца польской независимости. Школьники пели песни и писали стихи в память о маршале, устраивались митинги и праздники, в общественных местах возводились статуи и создавались монументальные произведения искусства, а День независимости Польши был объявлен национальным праздником в его честь. Повсеместно улицы, города и воинские части переименовывали в его честь. В 1938 году польский парламент даже объявил незаконным очернение имени Пилсудского. Особенно популярен его культ был в армии и сохранялся даже в польских войсках в изгнании на Западе, несмотря на возражения Владислава Сикорского и других противников. 19 марта, на следующий день после дня рождения Пилсудского, стало Днём маршала, когда публично объявлялись высшие воинские повышения."
 poland.86.a:0 "Великий человек, вышедший из Первой мировой войны."
 poland.87.t:0 "Государственный пропагандистский аппарат Рыдз-Смиглы"
 poland.87.d:0 "Поначалу Рыдз-Смиглы старался изображать себя человеком вне политики и политических объединений, однако со временем его публичные речи становились всё более политизированными и страстными. Государственная пропаганда представляла его наследником Пилсудского, а его известность затмила президента. Плакаты, общественные здания и доски объявлений демонстрировали его атлетическую фигуру, высокий рост и уверенную, но мягкую улыбку. По мере приближения войны его популярность достигла вершины. Восхваляющие песни, стихи и почти ежедневные публикации о его жизни отвлекали массы от тяжёлого экономического положения страны и провалов внешней политики нового режима. Стремительное поражение Польши в 1939 году стало громовым ударом для общества, которое верило, что под руководством Рыдз-Смиглы и при помощи западных союзников Германия будет быстро разгромлена."
 poland.87.a:0 "«Второй человек» в государстве"
 poland.88.t:0 "Армейские реформы Рыдз-Смиглы"
 poland.88.d:0 "Тестовое событие — не завершено."
 poland.88.a:0 "«Бог, честь, Отечество»\n  — Девиз польской армии"
 poland.89.t:0 "Реформы ВВС Рыдз-Смиглы"
 poland.89.d:0 "Несмотря на сильную авиационную промышленность Польши и превосходство в воздухе во время польско-советской войны, Юзеф Пилсудский считал ВВС дорогой прихотью и второстепенным дополнением. Он видел армию и кавалерию главными силами будущего поля боя и не вкладывал значительных средств в авиацию. Эдвард Рыдз-Смиглы придерживался иного мнения и считал, что ВВС сыграют важную роль в грядущем конфликте. Вскоре последовала крупная программа инвестиций в военно-воздушные силы и армейскую авиацию. Финансирование разработки самолётов, подготовки и обеспечения было увеличено, а польская доктрина пересмотрена: авиационная поддержка теперь рассматривалась как средство быстрого реагирования в критических ситуациях, а не как разрозненный тактический ресурс."
 poland.89.a:0 "«Pro Patria Semper»\n  — Девиз польских ВВС"
 poland.90.t:0 "Экспорт польской военной авиации"
 poland.90.d:0 "В 1933 году был принят на вооружение цельнометаллический истребитель PZL P.7a конструкции Зыгмунта Пулавского. Вскоре появились усовершенствованные PZL P.11a и PZL P.11c, которые на момент принятия в 1934 и 1935 годах соответственно считались одними из самых передовых истребителей мира. Из-за Великой депрессии и дефицита бюджета новые проекты приходилось экспортировать для финансирования армии. Такие модели, как P.11b, P.24A, P.24B, P.24G и лёгкий бомбардировщик PZL.43 Karaś, превосходили отечественные версии, но выпускались исключительно на экспорт, а не для польских войск. Сотни самолётов были проданы Греции, Португалии, Болгарии, Югославии, Турции, республиканской Испании, Венгрии и Румынии. Даже после капитуляции Польши в 1939 году польские машины продолжали эксплуатироваться, производиться и совершенствоваться за рубежом. К началу операции «Барбаросса» почти половину румынских ВВС составляли польские самолёты, а отечественный истребитель IAR 80 был развитием польского P.24E."
 poland.90.a:0 "Главное, чтобы бюджет оставался профицитным."
 poland.91.t:0 "Апрельская конституция"
 poland.91.d:0 "Главным идеологом Апрельской конституции был Валерий Славек, а её подготовка вызвала спор между левым крылом санации и фракцией «Замок» о том, кто займёт президентский пост. Конституция провозглашала государство общим благом граждан и значительно расширяла полномочия президента за счёт Сената и Сейма. Президент получал право назначать треть сенаторов, главнокомандующего польской армией и генерального инспектора вооружённых сил, распускать парламент и накладывать вето на законы, принятые «неконструктивным» образом.\n\nВ случае чрезвычайного положения или войны президент также мог назначить преемника. Это стало основой деятельности польского правительства в изгнании на Западе. Когда Игнаций Мосцицкий был интернирован в Румынии во время продолжающейся битвы за Польшу, новым президентом назначили польского генерала и посла в Риме Болеслава Веняву-Длугошовского. Уже на следующий день под давлением Владислава Сикорского он отказался от должности и передал президентские полномочия. В 1944 году поддерживаемые Советским Союзом власти коммунистической Польши объявили Апрельскую конституцию недействительной и вернулись к Мартовской конституции 1921 года."
 poland.91.a:0 "Президентская система или авторитаризм?"
 poland.92.t:0 "Польский ультиматум"
 poland.92.d:0 "Польское правительство обратило внимание на растущую популярность крайне левой идеологии в наших границах. Опасаясь за собственную безопасность, оно требует запретить коммунизм в нашей стране и согласовывать с ним внешнюю политику. Как нам ответить?"
 poland.92.a:0 "Неразумные требования"
 poland.92.b:0 "Нам придётся уступить."
 poland.93.t:0 "Румыния отклоняет наш ультиматум"
 poland.93.d:0 "Румыния отвергла наши требования. Существует опасность, что она продолжит попадать в орбиту Советского Союза. Похоже, решить вопрос можно лишь силой оружия."
 poland.93.a:0 "Они раскусили наш блеф."
 poland.93.b:0 "Мы должны вмешаться сейчас."
 poland.94.t:0 "Румыния принимает наши требования"
 poland.94.d:0 "Румыния согласилась с нашими требованиями. Уже готовится закон о запрете коммунизма, а её правительство согласилось подчинить свою внешнюю политику нашей."
 poland.94.a:0 "Отлично."
 poland.95.t:0 "Вторая военная миссия в Японию"
 poland.95.d:0 "Имея общего врага, Польша и Япония давно поддерживали дружественные отношения. В 1904 году, во время русско-японской войны, Юзеф Пилсудский приехал в Токио и предложил помощь в организации польского восстания против России. Несмотря на первоначальный интерес, японское правительство отклонило план по настоянию главного соперника Пилсудского Романа Дмовского, считавшего, что восстание провалится и лишь погубит поляков. После создания независимого польского государства Япония предложила дипломатическое сотрудничество и помогала этническим полякам бежать из России и Сибири. В 1923 году, вскоре после польско-советской войны, в Японию направили военную миссию во главе с польским инженером, криптологом и офицером разведки Яном Ковалевским. В Токио он обучал японских офицеров радиоразведке и криптоанализу. За это японское правительство наградило его орденом Восходящего солнца.\n\nТеперь мы планируем вновь направить подполковника Яна Ковалевского в Японию с более продвинутой технической помощью по взлому кодов и криптоанализу. Что мы хотим получить взамен?"
 poland.95.a:0 "Предложить присоединиться к их войне против Советского Союза."
 poland.95.b:0 "Попросить принять нас в их альянс."
 poland.95.c:0 "Попросить гарантии против советской агрессии."
 poland.95.e:0 "Предложить только техническую помощь."
 poland.96.t:0 "Польша приходит нам на помощь"
 poland.96.d:0 "[From.GetName] сообщило, что нападёт на Советский Союз одновременно с нами. Подполковник Ян Ковалевский, направленный в 1923 году для обучения нашей армии разведывательному делу, вновь отправляется в Токио, чтобы обучать офицеров взлому кодов и криптоанализу."
 poland.96.a:0 "Любая помощь приветствуется."
 poland.97.t:0 "Польша просит принять её в наш альянс."
 poland.97.d:0 "Дипломатический посланник государства [From.GetName] попросил принять их в наш альянс. В обмен на тесное сотрудничество они предлагают вновь направить в Токио подполковника Яна Ковалевского, который в 1923 году обучал нашу армию разведывательному делу, чтобы он преподавал офицерам взлом кодов и криптоанализ."
 poland.97.a:0 "Польша и Япония будут стоять вместе."
 poland.97.b:0 "Мы предпочитаем не связывать себя обязательствами с ними."
 poland.98.t:0 "Польша предлагает техническую помощь в обмен на гарантии"
 poland.98.d:0 "Дипломатический посланник государства [From.GetName] попросил помочь Польше, если между ней и Советским Союзом начнётся война. В обмен на гарантии они предлагают вновь направить в Токио подполковника Яна Ковалевского, который в 1923 году обучал нашу армию разведывательному делу, чтобы он преподавал офицерам взлом кодов и криптоанализ."
 poland.98.a:0 "Интересное предложение."
 poland.98.b:0 "Мы не можем позволить втянуть себя в войну."
 poland.99.t:0 "Польша предлагает нам вступить в её альянс."
 poland.99.d:0 "Дипломатический посланник государства [From.GetName] предложил создать союз для борьбы с угрозой со стороны [SOV.GetNameDef]. В обмен на тесное сотрудничество они предлагают вновь направить в Токио подполковника Яна Ковалевского, который в 1923 году обучал нашу армию разведывательному делу, чтобы он преподавал офицерам взлом кодов и криптоанализ."
 poland.99.a:0 "Польша и Япония будут стоять вместе."
 poland.99.b:0 "Мы предпочитаем не связывать себя обязательствами с ними."
 poland.100.t:0 "Польша и Япония объявляют о союзе"
 poland.100.d:0 "Имея общего врага в лице Советского Союза, Польша и Япония объявили о заключении военного союза."
 poland.100.a:0 "Интересное развитие событий."
 poland.101.t:0 "Япония отклоняет наше предложение"
 poland.101.d:0 "[From.GetNameDef] отказалось. Похоже, несмотря на наши предложения, оно не желает связывать себя обязательствами перед нами."
 poland.101.a:0 "Какое разочарование."
 poland.102.t:0 "Япония принимает наше предложение"
 poland.102.d:0 "[From.GetNameDef] приняло наше предложение. Уже ведётся подготовка официальных договорённостей и подписания соглашения."
 poland.102.a:0 "Отлично."
 poland.103.t:0 "Санкционирование программы «Прометей»"
 poland.103.d:0 "Агенты программы «Прометей», действующие совместно с диссидентами в государстве [SOV.GetNameDef], обнаружили возможность нанести удар по режиму. Для диверсии выбрана промышленная цель. Агенты ожидают финансирования, оборудования и разрешения на выполнение плана."
 poland.103.a:0 "Санкционировать операцию."
 poland.103.b:0 "Пока приказать им отступить."
 poland.104.t:0 "Польско-чехословацкие отношения"
 poland.104.d:0 "На протяжении большей части раннего межвоенного периода отношения Польши и Чехословакии сопровождались постоянными пограничными конфликтами и напряжённостью. Заользье с ценными угольными шахтами и железнодорожными линиями оспаривалось обеими странами. Произошла короткая пограничная война, в которой Чехословакия заняла большую часть региона, однако вмешательство западных союзников вынудило её отступить. Под западным надзором планировались этнические плебисциты и раздел территории. Обе страны согласились принять решение союзников, но с началом польско-советской войны и наступлением советских войск на Варшаву возникли опасения, что поражение Польши передаст регион большевикам. Конференция в Спа в июле 1920 года передала Чехословакии земли с многочисленным польским населением, оставив под польским управлением лишь немного чехов. Решение вызвало горечь среди местных поляков, считавших себя жертвами дискриминации со стороны чехословацкого правительства."
 poland.104.a:0 "Мы предъявим наши требования."
 poland.105.t:0 "Польские требования"
 poland.105.d:0 "Министр иностранных дел Польши Юзеф Бек передал список требований. Польша требует уступить Заользье и разрешить раздел Словакии между Польшей и Венгрией. Если мы не подчинимся, это приведёт к войне. Как нам ответить?"
 poland.105.a:0 "У нас нет выбора, кроме как уступить."
 poland.105.b:0 "Смерть прежде бесчестья."
 poland.106.t:0 "Чехословакия уступает"
 poland.106.d:0 "Чехословакия согласилась на наши требования. Наши войска вошли в спорный район. В приграничных областях толпы польского меньшинства приветствуют солдат, а по городам Польши проходят торжества в честь объединения."
 poland.106.a:0 "Законная польская земля."
 poland.107.t:0 "Чехословакия сопротивляется"
 poland.107.d:0 "Чехословакия отвергла наши требования. Теперь вопрос можно решить только силой оружия. Наша армия готовится нанести удар в глубину её территории."
 poland.107.a:0 "Плохой выбор."
 poland.108.t:0 "Южная Словакия принадлежит нам"
 poland.108.d:0 "После того как Чехословакия уступила польским требованиям, наши войска заняли Южную Словакию, где проживает множество этнических венгров."
 poland.108.a:0 "Законная венгерская земля"
 poland.109.t:0 "Изобретение миноискателя"
 poland.109.d:0 "В межвоенные годы артиллерийское управление польского Министерства национальной обороны заказало устройство для обнаружения неразорвавшихся снарядов на военных полигонах. Компания AVA Radio завершила проект, но из-за сентябрьского вторжения устройство так и не пошло в производство. Позднее польская армия в изгнании во Франции переосмыслила его как миноискатель. Окончательный вариант создал польский лейтенант Юзеф Косацкий, безвозмездно передавший чертежи британской армии. Новый переносной миноискатель впервые применили в битве при Эль-Аламейне, где 500 устройств расчистили путь наступлению британской 8-й армии. За войну было произведено более 100 000 единиц, а та же модель оставалась на службе вплоть до войны в Персидском заливе 1991 года."
 poland.109.a:0 "Польское мастерство"
 poland.110.t:0 "Фонд национальной обороны"
 poland.110.d:0 "В межвоенные годы Польша обеспечивала себя сельскохозяйственной продукцией, однако государственная промышленность и военное производство сильно зависели от импорта сырья. Когда началась Великая депрессия, страны мира поспешили девальвировать валюты, но Национальный банк Польши сохранил высокий курс злотого. Сильная валюта усиливала дефляцию и сокращала объём резервов для поддержки экономики, зато облегчала закупки за рубежом.\n\nЧтобы использовать ситуацию, правительство создало Фонд национальной обороны. Государственные активы продавались, у граждан за рубежом собирались пожертвования, а внутри страны проводились кампании по сбору средств для покупки иностранного сырья и вооружений. Школы, учреждения и приходы призывали финансировать покупку пулемёта, артиллерийского орудия или даже самолёта. В 1937 году военное ведомство собрало 2 330 380 злотых и 6645 тонн металлолома. Были приобретены 36 самолётов, 615 станковых пулемётов, 130 ручных пулемётов и множество другого вооружения. Подводная лодка ORP Orzeł также была частично построена на общественные средства. Президентским указом вся частная собственность могла быть реквизирована в случае войны, а второй указ 1938 года усилил государственный контроль над сельскохозяйственным производством и распространил реквизицию на транспорт и скот."
 poland.110.a:0 "Перенаправить расходы из гражданского сектора."
 poland.110.b:0 "Сильная армия важнее."
 poland.111.t:0 "Правительство обвиняют в слабости"
 poland.111.d:0 "По всей стране вспыхнули протесты. Верно это или нет, население убеждено, что страна могла легко победить в войне и международное общественное мнение было бы на нашей стороне. Политическая оппозиция обвиняет нас в капитуляции перед германским влиянием и предательстве страны."
 poland.111.a:0 "Мы лишь выжидаем подходящий момент."
 poland.112.t:0 "Польша просит о более тесных связях"
 poland.112.d:0 "В Польше к власти пришло националистическое правительство. Несмотря на агрессивную внешнюю политику, оно готово отказаться от претензий на Заользье в обмен на более тесное сотрудничество против Германии. Как нам ответить?"
 poland.112.a:0 "Это интересная возможность."
 poland.112.b:0 "Союз с Польшей — безумие."
 poland.113.t:0 "Смерть Романа Дмовского"
 poland.113.d:0 "Только что скончался Роман Дмовский, отец польского националистического движения. Сегодня в его похоронной процессии приняли участие более 100 000 человек. Улицы крупных городов заполнены политическими сторонниками, оплакивающими его смерть."
 poland.113.a:0 "История запомнит его как злобного фашиста."
 poland.113.b:0 "Одним смутьяном стало меньше."
 poland.113.c:0 "На его плечах мы построили наше движение."
 poland.113.e:0 "Его вклад надолго останется в памяти."
 poland.113.f:0 "Его будут помнить как национального героя."
 poland.114.t:0 "Чехословакия соглашается на союз"
 poland.114.d:0 "[From.GetLeader] согласился, что нашим странам следует забыть разногласия и вместе противостоять более серьёзным потенциальным угрозам."
 poland.114.a:0 "Славянские братья по оружию."
 POL_Beck_Molotov_tooltip:0 "§RПольша станет§! §Hмарионеткой§! §Rгосударства [SOV.GetNameDef]§!\n"
 POL_Beck_Molotov_tooltip_TFV:0 "§RПольша станет§! §Hдоминионом§! §Rгосударства [SOV.GetNameDef]§!\n"
 POL_Beck_Molotov_tooltip_DOD:0 "§RПольша станет§! §Hсателлитом§! §Rгосударства [SOV.GetNameDef]§!\n"
 poland.115.t:0 "Польша просит нашей защиты"
 poland.115.d:0 "Резко изменив внешнюю политику, возможно от отчаяния, Польша просит нашей поддержки и защиты. В обмен на тесное сотрудничество она готова согласовывать с нами внешнюю политику и разрешить нашим войскам войти на её территорию. Как нам ответить?"
 poland.115.a:0 "Это интересная возможность."
 poland.115.b:0 "Нас это не интересует."
 poland.116.t:0 "[SOV.GetNameDef] принимает предложение"
 poland.116.d:0 "[SOV.GetLeader] согласился на нашу просьбу о помощи. Юзеф Бек сейчас находится в Москве, и подписание договора уже идёт полным ходом. Остаётся надеяться, что однажды мы всё ещё проснёмся в независимой Польше."
 poland.116.a:0 "Сделка с дьяволом."
 poland.117.t:0 "[SOV.GetNameDef] отклоняет предложение"
 poland.117.d:0 "[SOV.GetLeader] почти не заинтересовался нашими просьбами о помощи. Похоже, придётся искать поддержку в другом месте."
 poland.117.a:0 "Возможно, это и к лучшему."
 poland.118.t:0 "Польша просит принять её к нам"
 poland.118.d:0 "Пришедшее к власти в Польше националистическое правительство стремится вступить в нашу объединённую федерацию. Хотя у поляков сильная армия, их отношения с Германией и Советским Союзом враждебны. Как нам ответить?"
 poland.118.a:0 "Мы приветствуем Польшу в наших рядах."
 poland.118.b:0 "Нас это не интересует."
 poland.119.t:0 "Польско-итальянский союз"
 poland.119.d:0 "[ITA.GetLeader] выразил восторг по поводу нашей готовности объединиться. Уже идёт подписание официального договора."
 poland.119.a:0 "Польша и Италия стоят плечом к плечу как братья."
 poland.120.t:0 "[ITA.GetNameDef] отказывает"
 poland.120.d:0 "Несмотря на наше щедрое предложение, итальянцы, похоже, мало заинтересованы в сотрудничестве. [ITA.GetLeader] пренебрёг нашей просьбой."
 poland.120.a:0 "Тогда поищем в другом месте."
 poland.121.t:0 "Линия Дмовского"
 poland.121.d:0 "Роман Дмовский занимал пост министра иностранных дел в правительстве Игнация Яна Падеревского. В отличие от Пилсудского, стремившегося превратить Польшу в многонациональную федерацию, Дмовский хотел присоединять лишь территории с польскоязычным населением и не интересовался далёкими восточными землями. Упрямство националистической фракции впоследствии сильно раздражало Пилсудского, особенно когда Дмовский публично выступил против включения Минска во время переговоров о завершении польско-советской войны.\n\nНа Парижской мирной конференции 1919 года польская делегация представила проект предполагаемых границ нового польского государства, получивший название линии Дмовского. Она была обращена на запад и включала всю Верхнюю Силезию, часть Помералии и юг Западной Пруссии. Дмовский признавал, что польские притязания на Силезию не вполне убедительны, но требовал её по экономическим соображениям и потому, что местное польское меньшинство отличалось высоким уровнем образования и имело культурное значение. Несмотря на поддержку Франции, Версальский договор разочаровал Дмовского, поскольку польско-германская граница прошла восточнее, чем он надеялся. После переговоров он стал непримиримым врагом британского премьер-министра Дэвида Ллойд Джорджа и обвинял его в получении германских и еврейских взяток за неблагоприятную Польше позицию."
 poland.121.a:0 "Верхняя Силезия БУДЕТ нашей."
 poland.122.t:0 "Польша требует Верхнюю Силезию"
 poland.122.d:0 "[POL.GetLeader] осудил наше обращение с польским меньшинством в Верхней Силезии. Польша требует немедленно передать ей регион и вывести оттуда наши войска. Отказ приведёт к войне. Как нам ответить?"
 poland.122.a:0 "У нас нет выбора, кроме как уступить."
 poland.122.b:0 "Тогда будет война."
 poland.123.t:0 "Верхняя Силезия принадлежит нам"
 poland.123.d:0 "[From.GetNameDef] уступило нашим требованиям. Наши войска вошли в спорный район и установили над ним контроль. Польское меньшинство региона и жители городов по всей Польше празднуют победу."
 poland.123.a:0 "Наконец-то мы едины."
 poland.124.t:0 "[From.GetNameDef] отвергает ультиматум"
 poland.124.d:0 "[From.GetNameDef] отвергло наши требования. Похоже, теперь вопрос можно решить лишь силой оружия."
 poland.124.a:0 "Тогда будет война."
 poland.124.b:0 "Нам придётся отступить."
 poland.125.t:0 "Фалангисты приходят к власти"
 poland.125.d:0 "В результате неожиданного и стремительного развития событий ОНР-Фаланга, крупное экстремистское ответвление движения эндеции, пришла к власти под руководством нового поколения польских националистов. Выступая перед Сеймом, [POL.GetLeader] изложил своё видение новой экономической модели, новой системы управления и единого польскоязычного народа, исповедующего одну религию. Принципы фалангизма вот-вот укоренятся."
 poland.125.a:0 "Самодостаточность — главный приоритет."
 poland.126.t:0 "Польша просит принять её в Союзники"
 poland.126.d:0 "На недавней встрече польский министр военных дел генерал Тадеуш Каспшицкий предложил укрепить отношения. Он выступает за полноценный военный союз для противодействия растущим угрозам миру и стабильности в Европе. Примем ли мы Польшу в наш альянс?"
 poland.126.a:0 "Мы будем стоять единым фронтом."
 poland.126.b:0 "Они станут обузой."
 poland.127.t:0 "Новый франко-польский союз"
 poland.127.d:0 "Переговоры между польским министром военных дел генералом Тадеушем Каспшицким и командующим французской армией генералом Морисом Гамеленом принесли плоды. Развивая существующие соглашения, две страны подписали новый пакт о взаимной военной помощи в случае войны."
 poland.127.a:0 "Интересное развитие событий."
 poland.128.t:0 "Крах франко-польских отношений"
 poland.128.d:0 "Переговоры между польским министром военных дел генералом Тадеушем Каспшицким и командующим французской армией генералом Морисом Гамеленом не дали результатов. Договориться о взаимной военной помощи не удалось. Пока Польша лишена возможности вступить в единый альянс с западными союзниками."
 poland.128.a:0 "Интересное развитие событий."
 poland.129.t:0 "Вопрос Вильно"
 poland.129.d:0 "Литва разорвала дипломатические отношения с Польшей после того, как польский генерал Люциан Желиговский по приказу Юзефа Пилсудского организовал мятеж в Литве в октябре 1920 года. Он вторгся на территорию, контролируемую Литвой, и захватил спорный Вильнюс, по-польски Вильно. После того как Литва заняла Мемель в январе 1923 года, Лига Наций в марте того же года присудила Вильнюс Польше. Хотя лишь 2% населения Вильно говорило по-литовски, литовская конституция по-прежнему называла город столицей страны. Недавно на границе был застрелен польский пограничник. В польских городах вспыхнули протесты с требованиями войны против Литвы."
 poland.129.a:0 "Это достаточный повод для войны."
 poland.129.b:0 "Отправить ультиматум с требованием отказаться от притязаний и нормализовать отношения."
 poland.130.t:0 "Ультиматум Польши"
 poland.130.d:0 "Под угрозой войны [From.GetNameDef] требует отказаться от притязаний на Вильнюс, переписать конституцию, больше не называя город нашей столицей, и нормализовать отношения. Как нам ответить?"
 poland.130.a:0 "Хорошие отношения с Польшей предпочтительнее."
 poland.130.b:0 "Вильнюс по праву является нашей столицей."
 poland.131.t:0 "Литва уступает"
 poland.131.d:0 "Литовская делегация согласилась с нашими требованиями. Уже идут переговоры об открытии посольств и восстановлении нормальных отношений."
 poland.131.a:0 "Отлично."
 poland.131.b:0 "Следует также пригласить их в наш альянс."
 poland.132.t:0 "Литва продолжает сопротивляться"
 poland.132.d:0 "Литовская делегация отвергла наши требования. Она утверждает, что Вильно по-прежнему является законной столицей Литвы, и отказывается подчиняться угрозам."
 poland.132.a:0 "Тогда будет война."
 poland.132.b:0 "Отказаться от требований."
 poland.133.t:0 "Пригласить Литву в наш альянс?"
 poland.133.d:0 "Несмотря на недавнюю вражду, Польшу и Литву давно связывают исторические узы. Теперь, когда вопрос Вильно решён и отношения нормализованы, перед лицом сгущающейся над Европой бури открывается возможность военного сотрудничества."
 poland.133.a:0 "Они станут обузой."
 poland.133.b:0 "Польско-литовский союз желателен."
 poland.134.t:0 "Польское приглашение вступить в их альянс"
 poland.134.d:0 "Во время дипломатического визита [From.GetLeader] предложил Польше и Литве забыть недавние разногласия и совместно противостоять всё более нестабильной обстановке в Европе. [From.GetNameDef] предлагает военное сотрудничество для борьбы с этими угрозами."
 poland.134.a:0 "Их защита лучше имеющихся альтернатив."
 poland.134.b:0 "Им нельзя доверять."
 poland.135.t:0 "Польско-литовский союз"
 poland.135.d:0 "[From.GetNameDef] согласилось на более тесные связи. Польша и Литва вновь стоят рядом как друзья."
 poland.135.a:0 "Мы стоим единым братским фронтом."
 poland.136.t:0 "Литва отказывается от военного сотрудничества"
 poland.136.d:0 "[From.GetNameDef] отвергло наше предложение. Похоже, там всё ещё питают к нам неприязнь."
 poland.136.a:0 "Это их потеря."
 poland.138.t:0 "Минск или война"
 poland.138.d:0 "Под угрозой применения силы [From.GetNameDef] требует уступить Минск и окружающие территории. Оно утверждает, что Минск является историческим польским городом и потому принадлежит ему по праву. Как нам ответить?"
 poland.138.a:0 "Пока у нас нет выбора, кроме как уступить."
 poland.138.b:0 "Абсурд."
 poland.139.t:0 "[From.GetNameDef] сдаёт Минск"
 poland.139.d:0 "[From.GetLeader] согласился на наши условия. Наши войска входят в Минск, чтобы занять город и восстановить местную администрацию."
 poland.139.a:0 "Бывшая территория возвращена."
 poland.140.t:0 "[From.GetNameDef] отвергает ультиматум"
 poland.140.d:0 "[From.GetLeader] высмеял наши условия и отверг притязания как безнадёжно устаревшие. Похоже, вопрос можно решить лишь силой оружия."
 poland.140.a:0 "Тогда будет война."
 poland.140.b:0 "Они раскусили наш блеф."
 poland.141.t:0 "Директория Украины"
 poland.141.d:0 "После Российской революции возникли два главных украинских государства: Западно-Украинская Народная Республика в Восточной Галиции и Украинская Народная Республика в Киеве. Отношения между ними ухудшились, поскольку первая считала главным врагом поляков, а вторая видела в Польше возможного союзника против советских и белых армий. К июлю 1919 года Польша завоевала большую часть Галиции, и Западно-Украинская Народная Республика прекратила существование. На востоке Украинская Народная Республика превратилась в Директорию Украины — временный орган власти до избрания нового правительства. Глава Директории Симон Петлюра отступил в Польшу и подписал в Варшаве союз, признав польское владение Галицией в обмен на военную помощь. Юзеф Пилсудский видел в Украине потенциального партнёра для своего проекта Междуморья — союза равноправных народов. Во время польско-советской войны наступление Польши и двух оставшихся дивизий Петлюры привело к взятию Киева, но затем удача отвернулась, советские войска дошли до Варшавы, после чего ход войны вновь изменился. По окончании войны Директория стала правительством в изгнании в Тарнуве под пристальным надзором польских властей. Многие её офицеры впоследствии вошли в польскую армию. После убийства Симона Петлюры большевистским агентом в Париже руководство перешло к Андрею Ливицкому, продолжившему сотрудничество с Польшей."
 poland.141.a:0 "Слава Украины ещё не погибла."
 poland.142.t:0 "Воссоздание украинской армии"
 poland.142.d:0 "Из добровольцев, эмигрантов и бывших бойцов Украинской народной армии мы сформировали новые войска Директории. Хотя сейчас они немногочисленны, в случае новой войны с Советским Союзом они помогут укрепить местную поддержку. По мере возвращения украинских территорий их численность наверняка значительно возрастёт."
 poland.142.a:0 "Новейший участник Междуморья."
 poland.143.t:0 "Призвать Японию к войне?"
 poland.143.d:0 "Япония связана обязательством прийти нам на помощь, если Советский Союз объявит нам войну. Потребуем ли мы исполнить договор?"
 poland.143.a:0 "Нам нужна их помощь."
 poland.143.b:0 "Мы обойдёмся без них."
 poland.144.t:0 "[From.GetName] призывает нас к войне"
 poland.144.d:0 "[SOV.GetNameDef] объявило войну государству [POL.GetNameDef]. Прежние договоры требуют прийти ему на помощь. Выполним ли мы обязательства?"
 poland.144.a:0 "Мы выполним свои обязательства."
 poland.144.b:0 "Их дело безнадёжно."
 poland.145.t:0 "[From.GetName] отказывается выполнять обязательства"
 poland.145.d:0 "[JAP.GetNameDef] отказалось объявлять войну государству [SOV.GetName] по нашему призыву."
 poland.145.a:0 "Похоже, мы остались одни..."
 poland.146.t:0 "Речь Посполитая"
 poland.146.d:0 "Юзеф Пилсудский и правительство санации мечтали однажды восстановить Речь Посполитую. Хотя идея пользовалась широкой поддержкой разных польских фракций, литовское правительство относилось к ней враждебно. В 1919 году Польша даже попыталась организовать в Литве военный переворот для установления дружественного режима, но потерпела неудачу. Теперь, когда территория находится под польским контролем, уже создаётся совместная администрация. В городах Польши и некоторых районах Литвы проходят празднования, а церковные колокола радостно возвещают об историческом воссоединении."
 poland.146.a:0 "Наконец-то вместе."
 poland.147.t:0 "Польско-литовско-русинская Речь Посполитая"
 poland.147.d:0 "Идея Польско-литовско-русинской Речи Посполитой из трёх равноправных народов возникла в XVII веке, когда польский Сейм обсуждал создание Великого княжества Русского. Хотя предложение не было принято, мысль о тройственном государстве вновь появилась во время обречённого Январского восстания 1863–1864 годов против Российской империи. Подпольное польское Национальное правительство использовало цвета и символы всех трёх народов. В XX веке Юзеф Пилсудский надеялся, что Киевское наступление в польско-советской войне приведёт к союзу Польши и Украины в рамках Междуморья. Взятие Киева 7 мая 1920 года почти воплотило его мечту, однако ход войны изменился, и проект остался незавершённым. Теперь, когда Киев официально находится под польским протекторатом, правительство санации наконец может осуществить мечту покойного Пилсудского."
 poland.147.a:0 "Если Бог с нами, кто против нас?"
 poland.149.t:0 "Польша выходит из подчинения"
 poland.149.d:0 "[POL.GetNameDef] внезапно объявило, что отдаляется от государства [GER.GetNameDef]. Похоже, поляки утратили веру в наше руководство и предали общее дело. Польские партизаны и националистические части Армии Крайовой уже вступают в столкновения с нашими гарнизонами, а напряжённость стремительно растёт. Как нам ответить?"
 poland.149.a:0 "Они заплатят за свою подрывную деятельность."
 poland.149.b:0 "Мы ничего не можем сделать."
 poland.150.t:0 "Польша просит расширить торговые соглашения"
 poland.150.d:0 "Во время недавнего государственного визита министр иностранных дел Польши Юзеф Бек дал понять, что польское правительство стремится нормализовать отношения с нашей страной. Для укрепления доверия он предлагает взаимно открыть военный экспорт. Несмотря на прежние разногласия, примем ли мы эту торговую сделку?"
 poland.150.a:0 "Улучшение торговых отношений будет выгодно."
 poland.150.b:0 "Им нельзя доверять."
 poland.151.t:0 "[From.GetName] принимает торговую сделку"
 poland.151.d:0 "Чехословацкое правительство согласилось открыть взаимный импорт вооружений. Подписание договора уже идёт, а дипломатическая напряжённость начинает спадать."
 poland.151.a:0 "Новая эпоха польско-чехословацких отношений"
 poland.152.t:0 "[From.GetName] отклоняет торговую сделку"
 poland.152.d:0 "Чехословацкое правительство всё ещё не доверяет нашим мотивам и отклонило предложение. Вместо этого разрешена лишь небольшая экспортная квота. Это меньше, чем мы ожидали, но всё же небольшой прогресс."
 poland.152.a:0 "Шаг за шагом"
 poland.153.t:0 "[From.GetNameDef] отвергает наши колониальные амбиции"
 poland.153.d:0 "[From.GetNameDef] отвергло наше предложение. Похоже, колонии придётся искать в другом месте."
 poland.153.a:0 "Попытаться стоило"
 poland.154.t:0 "[From.GetNameDef] просит передать Танзанию"
 poland.154.d:0 "Выступая перед Лигой Наций, министр иностранных дел Польши Юзеф Бек заявил, что раз Вторая Речь Посполитая была частично создана из территорий бывшей Германской империи, Польша заслуживает долю прежних германских колоний. В частном порядке поляки просят передать им африканскую колонию Танзанию. Они утверждают, что колонии необходимы для силы польского государства и противовеса растущим угрозам в Европе. Взамен предлагается компенсация. Примем ли мы предложение?"
 poland.154.a:0 "Мы продадим колонию."
 poland.154.b:0 "Абсурд."
 poland.155.t:0 "Танзания приобретена"
 poland.155.d:0 "Британское правительство согласилось продать нам колонию. Мы отправили экспедицию для обследования территории и создания новой колониальной администрации. Чтобы в полной мере использовать её ресурсы, нам потребуются международный порт и полноценный торговый флот."
 poland.155.a:0 "Польша может в колонии!"
 poland.156.t:0 "[From.GetNameDef] предлагает нам защиту"
 poland.156.d:0 "Представители Польской морской и колониальной лиги просят разрешить прибытие новых поселенцев и размещение польских воинских частей в портах Либерии. В обмен на тесное сотрудничество и дополнительные торговые уступки они предлагают инвестиции и военную защиту. Готовы ли мы принять их усиленное присутствие ценой части нашей автономии?"
 poland.156.a:0 "Более тесное сотрудничество с Польшей предпочтительнее."
 poland.156.b:0 "Мы предпочитаем сохранить независимость."
 poland.157.t:0 "Либерия приобретена"
 poland.157.d:0 "Несмотря на протесты государства [USA.GetNameDef], правительство Либерии согласилось на сближение и дополнительные уступки в обмен на нашу экономическую и военную помощь."
 poland.157.a:0 "Польша может в колонии!"
 poland.158.t:0 "Националисты приходят к власти"
 poland.158.d:0 "Коалиция ББВР изначально создавалась в том числе для того, чтобы не допустить национальную демократию к власти. Однако её упадок и постоянные распри после смерти Юзефа Пилсудского больше не могли остановить партию Романа Дмовского, поднявшуюся на волне внезапной массовой поддержки перемен. Объявив недавнюю Апрельскую конституцию недемократичным и позорным захватом власти, новая националистическая коалиция обещает децентрализовать государство и установить новую парламентскую систему, управляемую народом."
 poland.158.a:0 "Сделаем Польшу снова великой!"
 poland.159.t:0 "Принудительная полонизация меньшинств"
 poland.159.d:0 "Раскол между санацией и эндецией отражал фундаментальный спор о том, что представляет собой польская нация. Юзеф Пилсудский видел Польшу разнообразным союзом культур и народов, тогда как националисты Романа Дмовского считали её прежде всего государством поляков. После разделов Польши в конце XVIII века националистическое движение возникло как сопротивление германизации бывших западных польских земель. Поскольку основу сопротивления иностранному влиянию составляли академические и литературные круги, национализм особенно распространился среди образованных слоёв и среднего класса.\n\nНациональная демократия призывала меньшинства либо ассимилироваться, либо покинуть страну. Её программа включала обязательное обучение польской культуре и стимулы для переселения поляков в непольскоязычные регионы. В ранний межвоенный период влияние националистов приводило к напряжённости и отдельным межэтническим беспорядкам. Эта насильственная реакция лишь укрепляла убеждение Дмовского, что меньшинства угрожают стабильности Польши. Его внешняя политика предусматривала присоединение только территорий со значительным польскоязычным населением, многие из которых находились в Германии."
 poland.159.a:0 "Польша — государство поляков."
 poland.160.t:0 "Сегрегация меньшинств"
 poland.160.d:0 "После окончательного прихода к власти Национально-радикального лагеря началось проведение новой политики по преобразованию общества. Организованные банды сторонников в форме всё чаще обходят польские города, разбивают витрины и грабят магазины, принадлежащие меньшинствам. Неофициально, но по тайному плану правительства, непольскоязычное население всё чаще вынуждают жить в отдельных изолированных сообществах. Эти действия являются частью плана создания однородной Великой Польши."
 poland.160.a:0 "Раздельные и неравные."
 poland.165.t:0 "Польская социалистическая партия приходит к власти"
 poland.165.d:0 "После напряжённых переговоров с правительством санации на городских баррикадах раздались радостные возгласы: рабочие праздновали приход Польской социалистической партии к власти. На поспешном заседании [POL.GetLeader] был выбран среди высших деятелей ППС руководителем нового социалистического государства. За рубежом активисты и лидеры Рабочего и социалистического интернационала выступают в европейских кафе, поздравляя польский народ с новой политической атмосферой."
 poland.165.a:0 "Свобода, равенство, справедливость, демократия\n— Лозунг ППС"
 poland.166.t:0 "Конфискация иностранных активов"
 poland.166.d:0 "После окончательного прихода Польской социалистической партии к власти создан комитет под личным руководством [POL.GetLeader], решающий, какие заводы и иностранные активы должны перейти под государственный контроль. Размер компенсации также определяется государством и не подлежит обсуждению, к возмущению промышленников и капиталистов. Хотя первая волна передач невелика, инвесторы всё сильнее опасаются будущих национализаций."
 poland.166.a:0 "Это ради общего блага."
 poland.167.t:0 "Польский позитивизм и органический труд"
 poland.167.d:0 "Наблюдая катастрофические последствия обречённых восстаний ноября 1830 и января 1863 годов, польские националисты пришли к выводу, что насилие лишь мешает делу независимости. Разрушение польской собственности и гибель людей ещё сильнее ослабляли культуру, находившуюся под давлением имперских властей. Поэтому в эпоху расцвета романтизма националисты приняли идею органического труда. Трудолюбие, художественные достижения и научные открытия считались лучшими средствами сохранения польской культуры и территориальной целостности. Поощряя личный успех, поляки доказывали бы устойчивость своей культуры перед попытками ассимиляции.\n\nЭту философию продолжали отстаивать умеренные националистические партии XX века. Когда Юзеф Пилсудский пытался организовать восстание во время русско-японской войны, Роман Дмовский отправился в Японию и сорвал план, считая его бессмысленной тратой жизней. Во Второй Речи Посполитой национальная демократия продолжала традицию органического труда, выступая за рыночный капитализм, инвестиции в образование и сохранение культуры."
 poland.167.a:0 "Образование — ключ ко всему."
 poland.168.t:0 "Рабочие бригады ППС"
 poland.168.d:0 "Во время сентябрьского вторжения различные политические партии Польши организовали собственную помощь военным усилиям. Одним из наиболее заметных вкладов ППС стало создание добровольческих рабочих бригад для обороны Варшавы. С одобрения генерала Валериана Чумы лидеры ППС начали призывать граждан брать лопаты и помогать рыть окопы и строить баррикады вокруг города. За время осады численность выросла до нескольких тысяч, а задачи расширились до связи и сбора разведданных. Преданность этих подразделений была столь велика, что после объявления капитуляции многие поначалу отказались сдаваться и угрожали расстрелять офицеров за трусость."
 poland.168.a:0 "«Социалистическое действие»"
 poland.169.t:0 "Китайско-польские связи"
 poland.169.d:0 "Имея общего врага, Польша и Япония давно поддерживали дружественные отношения. В 1904 году, во время русско-японской войны, Юзеф Пилсудский приехал в Токио и предложил помощь в организации польского восстания против России. Несмотря на первоначальный интерес, японское правительство отклонило план по настоянию главного соперника Пилсудского Романа Дмовского, считавшего, что восстание провалится и лишь погубит поляков. После создания независимого польского государства Япония предложила дипломатическое сотрудничество и помогала этническим полякам бежать из России и Сибири. В 1923 году, вскоре после польско-советской войны, в Японию направили военную миссию во главе с польским инженером, криптологом и офицером разведки Яном Ковалевским. В Токио он обучал японских офицеров радиоразведке и криптоанализу. За это японское правительство наградило его орденом Восходящего солнца."
 poland.169.a:0 "Враг моего врага — мой друг."
 poland.170.t:0 "Польша просит принять её к нам"
 poland.170.d:0 "Новое крыло правительства санации, пришедшее к власти в Польше, стремится заключить ситуативный союз. Хотя у поляков сильная армия, они находятся во враждебных отношениях с некоторыми крупными соседями. Как нам ответить?"
 poland.170.a:0 "Мы приветствуем Польшу в наших рядах."
 poland.170.b:0 "Нас это не интересует."
 poland.171.t:0 "Польско-германский союз"
 poland.171.d:0 "[GER.GetLeader] одобрил создание военного союза между нашими странами. Уже идёт подписание официального договора."
 poland.171.a:0 "Польша и Германия стоят единым фронтом."
 poland.172.t:0 "[GER.GetNameDef] отказывает"
 poland.172.d:0 "Несмотря на наше щедрое предложение, германцы, похоже, мало заинтересованы в сотрудничестве. [GER.GetLeader] пренебрёг нашей просьбой."
 poland.172.a:0 "Тогда поищем в другом месте."
 poland.173.t:0 "Польша просит принять её к нам"
 poland.173.d:0 "Пришедшее к власти в Польше националистическое правительство стремится заключить с нами военный союз. Хотя у поляков сильная армия, они находятся во враждебных отношениях с некоторыми крупными соседями. Как нам ответить?"
 poland.173.a:0 "Мы приветствуем Польшу в наших рядах."
 poland.173.b:0 "Нас это не интересует."
 poland.174.t:0 "Польско-русский союз"
 poland.174.d:0 "[SOV.GetLeader] одобрил создание военного союза между нашими странами. Уже идёт подписание официального договора."
 poland.174.a:0 "Славянские братья по оружию."
 poland.175.t:0 "[SOV.GetNameDef] отказывает"
 poland.175.d:0 "Несмотря на наше щедрое предложение, русские, похоже, мало заинтересованы в сотрудничестве. [SOV.GetLeader] пренебрёг нашей просьбой."
 poland.175.a:0 "Тогда поищем в другом месте."
 poland.177.t:0 "Смертельная авиакатастрофа"
 poland.177.d:0 "Недавно поступило сообщение о крушении самолёта RWD-9 в Балтийском море. Поисковая операция не обнаружила выживших. Погибли все находившиеся на борту, включая генерала и бывшего председателя Морской и колониальной лиги Густава Орлич-Дрешера. Запланированы государственные похороны с личным участием [POL.GetLeader], после чего останки будут погребены в мавзолее в Гдыне."
 poland.177.a:0 "Огромная потеря для Республики."
 poland.178.t:0 "Милиция «Социалистическое действие»"
 poland.178.d:0 "В 1934 году ППС создала военизированные подразделения для защиты партийных собраний от националистических банд. Милиция «Социалистическое действие» носила тёмно-синюю форму и приносила присягу абсолютной верности партии. Благодаря молодёжным организациям, профсоюзам и последующему созданию женских подразделений численность выросла до более чем десяти тысяч человек. Бойцы обучались городскому бою, диверсиям и шпионажу. По мере приближения Второй мировой войны с польской армией было заключено соглашение о сотрудничестве, предусматривавшее участие «Социалистического действия» в подрывных операциях в поддержку вооружённых сил. Опыт городского боя позднее лёг в основу Рабочих оборонительных бригад во время осады Варшавы, а затем левого движения сопротивления — Народной гвардии ВРН."
 poland.178.a:0 "Дружба и боевое братство."
 poland.190.t:0 "Великие Волынские манёвры"
 poland.190.d:0 "В межвоенный период штаб польской армии организовал несколько учений в Волынском воеводстве. На фоне надвигающейся войны в Европе были проведены крупнейшие на тот момент манёвры с участием 60 000 солдат. По сценарию «красные» наступали с востока, а «синие» должны были остановить их продвижение. Учения завершились торжественной церемонией, на которой жители Луцка передали польской армии военное снаряжение, приобретённое на общественные средства региона."
 poland.190.a:0 "Подготовка никогда не помешает."
 poland.191.t:0 "Военные повышения и переназначения 1939 года"
 poland.191.d:0 "После повышения очередной группы офицеров стали доступны новые командиры."
 poland.191.a:0 "Понятно"
 poland.192.t:0 "Военные повышения и переназначения 1938 года"
 poland.192.d:0 "После повышения очередной группы офицеров стали доступны новые командиры."
 poland.192.a:0 "Понятно"
 poland.196.t:0 "Польское правительство в изгнании"
 poland.196.d:0 "Чтобы обеспечить преемственность польского правительства, президент покинул страну. В соответствии с чрезвычайными полномочиями Апрельской конституции будет назначен преемник, который возглавит государство. В эти тяжёлые времена оказалось непросто найти кандидата, способного удовлетворить требования множества враждующих партий и внутренних фракций. Ради единства в конце концов был достигнут компромисс и решено выбрать..."
 poland.196.a:0 "...того, кого требуют союзные державы."
 poland.196.b:0 "...харизматичного лидера."
 poland.196.c:0 "...эксперта в военных делах."
 poland.197.t:0 "Строгие стандарты военного снаряжения"
 poland.197.d:0 "Стремясь модернизировать польскую армию, маршал Рыдз-Смиглы ввёл строгие требования к производству боеприпасов. Допустимый уровень брака значительно снизили, но ценой роста стоимости и времени производства. Высокие стандарты должны были привлечь иностранных покупателей и дать средства для дальнейшей модернизации армии. Однако такой контроль качества значительно превосходил нормы других европейских армий и даже вызывал критику иностранных советников.\n\nРазличие взглядов проявилось на одной из встреч польских и французских представителей. Пытаясь заинтересовать французское военное руководство высококачественным польским оружием для закупки и экспорта, поляки получили отказ. Когда они потребовали объяснений, один французский офицер ответил: «Франция просто слишком бедна, чтобы позволить себе такое оружие». Польская делегация покинула встречу с самодовольным чувством превосходства своих стандартов, а прагматичные французы лишь недоверчиво качали головами."
 poland.197.a:0 "Славная польская сталь???"
 poland.199.t:0 "Единый социалистический фронт?"
 poland.199.d:0 "Сегодня делегация социалистического правительства Польши встретилась с несколькими нашими ведущими дипломатами. Она предлагает обсудить создание единого фронта близких по духу социалистических стран Европы для борьбы с растущим экстремизмом, угрожающим континенту. Как нам ответить?"
 poland.199.a:0 "Интересное предложение."
 poland.199.b:0 "Нас это не интересует."
 poland.200.t:0 "Швеция принимает наше приглашение"
 poland.200.d:0 "Наша дипломатическая миссия в Швецию завершилась успехом. Похоже, шведы также обеспокоены растущей волной экстремизма, угрожающей Европе. Между двумя странами уже идут дальнейшие переговоры о военной и дипломатической стратегии."
 poland.200.a:0 "Вместе мы получим множество преимуществ."
 poland.201.t:0 "Швеция отклоняет наше предложение"
 poland.201.d:0 "Наши попытки убедить Швецию создать единый фронт против агрессивных соседей не дали результата. Похоже, шведы надеются пережить надвигающуюся бурю, сохраняя нейтралитет."
 poland.201.a:0 "Как жаль."
 poland.202.t:0 "Продлить пакт о ненападении с Польшей?"
 poland.202.d:0 "Сегодня польская дипломатическая миссия встретилась с несколькими нашими ведущими дипломатами. В повестке было публичное продление нашего пакта о ненападении. Как нам ответить?"
 poland.202.a:0 "Интересное предложение."
 poland.202.b:0 "Нас это не интересует."
 poland.203.t:0 "[SOV.GetName] принимает предложение"
 poland.203.d:0 "Ведущие [SOV.GetAdjective]ие дипломаты согласились продлить пакт о ненападении между нашими странами. Планируется публичная церемония, чтобы объявить об этом всему миру."
 poland.203.a:0 "Стабильность Восточной Европы значительно укрепится."
 poland.204.t:0 "[SOV.GetName] отклоняет предложение"
 poland.204.d:0 "Ведущие [SOV.GetAdjective]ие дипломаты отказались продлевать пакт о ненападении между нашими странами. Это зловещий знак для будущих отношений."
 poland.204.a:0 "Мы должны сохранять бдительность."
 poland.205.t:0 "Продлить пакт о ненападении с Польшей?"
 poland.205.d:0 "Сегодня польская дипломатическая миссия встретилась с несколькими нашими ведущими дипломатами. В повестке было публичное продление нашего пакта о ненападении. Как нам ответить?"
 poland.205.a:0 "Интересное предложение."
 poland.205.b:0 "Нас это не интересует."
 poland.206.t:0 "[GER.GetName] принимает предложение"
 poland.206.d:0 "Ведущие [GER.GetAdjective]ие дипломаты согласились продлить пакт о ненападении между нашими странами. Планируется публичная церемония, чтобы объявить об этом всему миру."
 poland.206.a:0 "Стабильность Восточной Европы значительно укрепится."
 poland.207.t:0 "[GER.GetName] отклоняет предложение"
 poland.207.d:0 "Ведущие [GER.GetAdjective]ие дипломаты отказались продлевать пакт о ненападении между нашими странами. Это зловещий знак для будущих отношений."
 poland.207.a:0 "Мы должны сохранять бдительность."
 poland.208.t:0 "Генералы польской армии в изгнании"
 poland.208.d:0 ""
 poland.208.a:0 "Понятно"
 poland.209.t:0 "Польша предлагает защиту"
 poland.209.d:0 "После Судетского кризиса демократическое правительство Польши предлагает нам защиту. В обмен на определённое сотрудничество и интеграцию с польским правительством и армией оно готово прийти на помощь в случае вражеского вторжения. Однако из-за прошлых событий между нашими странами всё ещё сохраняется сильное недоверие. Стоит ли принять предложение?"
 poland.209.a:0 "Ради собственной безопасности мы должны согласиться."
 poland.209.b:0 "Полякам нельзя доверять."
 poland.210.t:0 "Чехословакия принимает нашу защиту"
 poland.210.d:0 "[CZE.GetLeader] неохотно согласился принять условия гарантий безопасности. Уже идут переговоры об установлении тесных дипломатических и военных связей между нашими странами. Чехословацким пограничникам приказано пропускать наши войска, однако среди местного населения всё ещё сохраняется определённое недоверие."
 poland.210.a:0 "Они сделали правильный выбор."
 poland.211.t:0 "Чехословакия отвергает нашу защиту"
 poland.211.d:0 "Чехословацкое правительство решительно отвергло наше предложение. Похоже, оно не доверяет нашим мотивам или сомневается, что мы способны выполнить подобные обязательства."
 poland.211.a:0 "Это их похороны."
 poland.212.t:0 "[POL.GetAdjective]ие пилоты формируют эскадрилью Костюшко"
 poland.212.d:0 "Готовые на всё ради спасения своей земли, [POL.GetAdjective]ие пилоты вступили в наши ряды и намерены продолжать борьбу до самого конца. Они решили сформировать эскадрилью имени Тадеуша Костюшко в память о непобеждённом генерале, сражавшемся с германцами, австрийцами и русскими в отчаянной попытке спасти свою страну от иностранной оккупации."
 poland.212.a:0 "Польша ещё не погибла!"
 poland.215.t:0 "[SOV.GetAdjective]-[POL.GetAdjective]ий дипломатический кризис"
 poland.215.d:0 "[SOV.getNameDefCap] с самого своего основания создавало всевозможные проблемы нашей стране и особенно нашему народу. После разрушительной кампании 1920 года нам удалось обезопасить польское государство от внешней угрозы и заключить союзы, способные защищать [POL.getAdjective]ий суверенитет долгие годы. Всё шло хорошо до недавнего времени.\n\nЗаключение пакта между Россией и Германией, за которым последовало [GER.getAdjective]ое вторжение с запада, сделало нас желанной целью для жаждущих власти милитаристов из [SOV.getNameDef]. Их министр иностранных дел уже потребовал «пересмотра всех прежних дипломатических соглашений и договоров между [SOV.getAdjective]им и [POL.getAdjective]им народами»!\n\nПограничные патрули сообщают о постоянно растущем числе [SOV.getAdjective]их войск, машин и самолётов, поэтому всем стало ясно: это вероломное государство готовится к войне. Чтобы выдержать натиск захватчиков, нам придётся удерживать два фронта! К оружию, братья и сёстры, мать-Польша зовёт вас!"
 poland.215.a:0 "Мобилизовать силы для защиты востока!"
 poland.216.t:0 "[SOV.GetAdjective]ие объявляют войну Польше"
 poland.216.d:0 "[SOV.getNameDefCap] объявило войну нашей союзнице Польше, открыв для неё второй фронт и потрясши [POL.GetAdjective]ий народ. Теперь мы должны решить, защитим ли Польшу и от этой угрозы или наши гарантии распространяются только на [GER.GetAdjective]ое вторжение."
 poland.216.a:0 "Мы должны сосредоточиться на других врагах."
 poland.216.b:0 "Это неприемлемо."
 POL_ENG_will_not_be_able_to_call_allies:0 "[POL.getNameDefCap] не сможет призывать членов альянса в свои войны."
