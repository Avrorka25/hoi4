 POL_German_Berlinka_Highway_Project:0 "Германский проект автомагистрали «Берлинка»"
 POL_German_Berlinka_Highway_Project_desc:0 "Уже некоторое время германские дипломаты предлагают построить совместную автомагистраль через Померанию. Разрешив Германии проложить экстерриториальную дорогу через Польский коридор, мы привлечём инвестиции и ускорим развитие окружающего региона."
 Maritime_Defense_Fund_tt:0 "Добавить технологию: §HКорпус подводной лодки 1936 года§!\n"
 POL_Wladyslaw_Bortnowski:0 "Władysław Bortnowski"
 POL_Universal_Research_Bonus:0 "Снижает штраф за опережение времени на §G0,5§! года и даёт бонус §G25%§! к исследованию. Действует для следующих §H2§! технологий:\n§HВсе технологии§!"
 POL_Family_Sponsorship_Program:0 "Программа поддержки многодетных семей"
 POL_Family_Sponsorship_Program_desc:0 "Стремясь укрепить традиционные ценности и поощрить многодетные семьи, президент Мосцицкий издал указ, согласно которому каждый седьмой сын в коренной польской семье, где все дети были живы, становился его крестником. Если семья соответствовала строгим требованиям и получала положительную оценку нравственного облика, президент или сенатор воеводства лично приезжал на крещение ребёнка. Кроме того, государство предоставляло седьмому ребёнку щедрые льготы: бесплатное образование в стране и за рубежом, пожизненный бесплатный проезд в общественном транспорте, бесплатное медицинское обслуживание и целевой фонд со сбережениями к совершеннолетию. Всего программе соответствовало чуть менее тысячи человек, но она значительно укрепила образ Мосцицкого как искренне семейного человека."
 POL_Arms_Sales_Nationalist_Spain:0 "Продажа оружия националистической Испании"
 POL_Arms_Sales_Nationalist_Spain_desc:0 "Гражданская война в Испании позволяет продать старые запасы вооружения заинтересованным покупателям. Полученные средства можно направить на производство более современного военного оснащения для собственной армии."
 POL_Arms_Sales_Republican_Spain:0 "Продажа оружия республиканской Испании"
 POL_Arms_Sales_Republican_Spain_desc:0 "Гражданская война в Испании позволяет продать старые запасы вооружения заинтересованным покупателям. Полученные средства можно направить на производство более современного военного оснащения для собственной армии."
 POL_National_Womens_Organization:0 "Национальная женская организация (НОК)"
 POL_National_Womens_Organization_desc:0 "28 ноября 1918 года, вскоре после обретения Польшей независимости, женщины получили полные избирательные права. Национальная избирательная организация женщин была создана партией национальной демократии для поощрения политической активности и поддержки движения эндеции. Её программа требовала воплощения христианских, национальных и демократических принципов, ставя благо Республики выше интересов партий, регионов и сословий. Членов призывали защищать веру и нравственность от антирелигиозного, подрывного, антинационального, антиобщественного и антигосударственного влияния. Организация выступала за католический характер польского образования, отмену секуляризации брака и упразднение законов, разрешающих развод. Благодаря упору на личную дисциплину она получила широкую поддержку среди польского среднего класса, землевладельцев и интеллигенции."
 POL_Evacuate_Polands_Gold_Reserves:0 "Эвакуировать золотой запас Польши"
 POL_Evacuate_Polands_Gold_Reserves_desc:0 "Эвакуация валютных резервов и станочного оборудования с наших заводов позволит оплачивать содержание национальной армии в изгнании."
 POL_underground_anthem:0 "§LГимн польского подполья§!"
 POL_reconstitute_an_air_force_in_exile:0 "Воссоздать ВВС в изгнании"
 POL_reconstitute_an_air_force_in_exile_desc:0 "Несмотря на поражение, [POL.getAdjective]ие лётчики сумели эвакуироваться и готовы продолжать борьбу."
