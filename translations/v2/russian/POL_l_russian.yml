 POL_Air_Force_Training_Center_No_1:0 "Учебный центр ВВС № 1 «Орлята»"
 POL_Air_Force_Training_Center_No_1_desc:0 "Расширение училища лётной подготовки в Демблине с учётом будущего роста ВВС позволит установить единые стандарты высшего образования для военных пилотов и авиационных офицеров."
 POL_The_Polish_Socialist_Party:0 "Польская социалистическая партия"
 POL_The_Polish_Socialist_Party_desc:0 "Польская социалистическая партия ранее была партией Юзефа Пилсудского и многих видных представителей правительства санации до смены ими политической принадлежности. Оказавшись в изоляции, социалисты стремятся создать государство с прогрессивными трудовыми и социальными реформами."
 POL_labor_advocate:0 "Защитник трудящихся"
 POL_mechanization_of_agriculture:0 "Механизация сельского хозяйства"
 POL_mechanization_of_agriculture_desc:0 "Чтобы польский сельскохозяйственный экспорт вновь стал конкурентоспособным, планируется государственная программа модернизации хозяйств с предоставлением тракторов и другой тяжёлой техники."
 POLREV_communism:0 "Революционная Польша"
 poland.198.t:0 "Создание ППС-ВРН"
 poland.198.d:0 "В ответ на иностранную оккупацию польской земли несколько видных членов Польской социалистической партии собрались, чтобы провозгласить резолюцию о «Третьей Республике». Под руководством генерального секретаря Казимежа Пужака планируется создать ряд учреждений для организации польского подпольного государства среди сторонников левых взглядов. В первую очередь речь идёт о Народной гвардии, Рабочей милиции и Центральном управлении транспорта. Несмотря на поддержку таких ключевых фигур партии, как Томаш Арцишевский и Зыгмунт Заремба, споры о руководстве движением привели к расколу, а председатель Зыгмунт Жулавский объявил ППС-ВРН нелегитимной."
 poland.198.a:0 "Свобода, равенство, независимость (ВРН)"
 POL_Folk_High_Schools:0 "Народные высшие школы"
 POL_Folk_High_Schools_desc:0 "Широко распространённая традиция частного образования обеспечивает благополучие высших классов и сохраняет польскую культуру в случае иностранной оккупации."
