 POL_Education_Indoctrination:0 "Идеологическая обработка и образование"
 POL_Divided_Nation:0 "Разделённая нация"
 POL_Divided_Nation_desc:0 "Агрессивная политика полонизации меньшинств вызвала сильное недовольство у значительной части населения."
 POL_Segregated_Nation:0 "Сегрегированная нация"
 POL_Segregated_Nation_desc:0 "Меньшинства в стране подвергаются серьёзной маргинализации."
 POL_Neutral_Foreign_Policy:0 "Нейтральная внешняя политика"
 POL_Active_Foreign_Policy:0 "Активная внешняя политика"
 POL_Union_Boss:0 "Профсоюзный лидер"
 POL_Interventionist_Foreign_Policy:0 "Интервенционистская внешняя политика"
 POL_Interventionist_Foreign_Policy_desc:0 "Стабильность региона и безопасность Польши зависят от сильных союзов и своевременного вмешательства во внешние дела."
 naval_military_youth:0 "Военно-морская молодёжь"
 POL_Synthetic_Rubber:0 "Синтетический каучук"
 POL_Synthetic_Rubber_tt:0 "§Wизменять§! §HРезиновый НПЗ§! §Wв результате:§! §G+2§!£resources_strip|3.\n"
 POL_Synthetic_Rubber_desc:0 "Польские учёные из отдела синтеза каучука при Химическом исследовательском институте в Варшаве разработали полностью искусственный каучук из картофеля и других сельскохозяйственных продуктов. Теперь шины и детали машин можно производить без натурального каучука с заморских плантаций.§!"
 POL_Army_Modernisation:0 "Модернизация армии"
 POL_Army_Modernisation_desc:0 "Польской армии необходима серьёзная модернизация логистики, связи и вспомогательных родов войск. Приоритет в распределении талантов следует сместить от обычной пехоты к более техническим специальностям."
 technical_training_focus:0 "Упор на техническую подготовку"
 POL_technical_training_focus_tt:0 "Открывает §Hупор на техническую подготовку§!\n§HПехота§!:\n    Организация: §R-2§!\n§HРоты поддержки§!:\n    Организация: §G+5§!\n    Скорость восстановления: §G+10%§!\n"
 POL_army_reform:0 "Открывает решения §Hармейской реформы§!."
 POL_Power_Sharing_Agreement:0 "Выбрано событие §H«Соглашение о разделении власти с Мосцицким»§!"
 POL_Tadeusz_Bielecki:0 "Tadeusz Bielecki"
 nationalist_agitator:0 "Националистический агитатор"
 POL_Silesian_Ties:0 "Силезские связи"
 POL_Public_Welfare:0 "Общественное благосостояние"
 socialist_revolutionary:0 "Социалист-революционер"
 POL_army_reform_category:0 "Армейские реформы маршала Эдварда Рыдз-Смиглы"
 POL_army_reform_category_desc:0 "Сильная армия должна успевать за новшествами в связи, инженерном деле, артиллерии, танках и авиации. Но с учётом ограничений польского бюджета лучшие кадры и финансирование придётся перераспределить в соответствии с новыми приоритетами."
 POL_partial_anti_aircraft_motorization:0 "Частичная моторизация ПВО"
 POL_partial_anti_aircraft_motorization_desc:0 "Чтобы сохранять эффективность на поле боя, кавалерии потребуется поддержка тяжёлого вооружения. Для преодоления сезонной грязи и плохих польских дорог необходимы новые надёжные машины."
 POL_partial_anti_aircraft_motorization_tt:0 "§HПВО§!:\n    Моторизованное оснащение: §H+9§!\n    Оснащение ПВО: §H-3§!\n      Новая максимальная скорость: §H5,4 км/ч§!\n      Прочность: §G+0,2§!\n      Бронированность: §G+5%§!\n"
 POL_partial_anti_tank_motorization:0 "Частичная моторизация ПТО"
 POL_partial_anti_tank_motorization_desc:0 "Мы не могли не заметить всё более широкое применение бронетанковых войск нашими крупными соседями. Противотанковые части должны быть достаточно мобильными, чтобы не отставать от наших подвижных соединений. Для сезонной грязи и плохих польских дорог необходимы новые надёжные машины."
 POL_partial_anti_tank_motorization_tt:0 "§HПТО§!:\n    Моторизованное оснащение: §H+11§!\n    Противотанковое оснащение: §H-3§!\n      Новая максимальная скорость: §H5,4 км/ч§!\n      Прочность: §G+0,2§!\n      Бронированность: §G+5%§!\n"
 POL_Civilian_Vehicle_Donation_Drive:0 "Кампания пожертвования гражданских автомобилей"
 POL_Civilian_Vehicle_Donation_Drive_desc:0 "Граждане издавна вносят вклад в безопасность страны. Следует провести информационную кампанию и сбор пожертвований, чтобы побудить население снабдить польскую армию необходимыми автомобилями."
 POL_Solicit_Donations_for_the_Military:0 "Собирать пожертвования для армии"
 POL_Solicit_Donations_for_the_Military_desc:0 "Граждане издавна вносят вклад в безопасность страны. Следует провести информационную кампанию и сбор пожертвований, чтобы помочь обеспечить польскую армию необходимыми винтовками и пулемётами."
 POL_Solicit_Donations_for_the_Airforce:0 "Собирать пожертвования для ВВС"
 POL_Solicit_Donations_for_the_Airforce_desc:0 "Граждане издавна вносят вклад в безопасность страны. Следует провести информационную кампанию и сбор пожертвований, чтобы помочь польским ВВС получить необходимые самолёты."
 POL_Solicit_Donations_for_the_Navy:0 "Собирать пожертвования для флота"
 POL_Solicit_Donations_for_the_Navy_desc:0 "Граждане издавна вносят вклад в безопасность страны. Следует провести информационную кампанию и сбор пожертвований, чтобы помочь польскому флоту получить необходимые корабли."
 POL_Solicit_Donations_for_Public_Works:0 "Собирать пожертвования на общественные работы"
 POL_Solicit_Donations_for_Public_Works_desc:0 "Граждане издавна вносят вклад в безопасность страны. Следует провести информационную кампанию и сбор пожертвований, чтобы помочь польской экономике получить необходимые фабрики."
 POL_Scrap_Metal_Drive:0 "Сбор металлолома"
 POL_Scrap_Metal_Drive_desc:0 "Граждане издавна вносят вклад в безопасность страны. Следует провести информационную кампанию и сбор пожертвований, чтобы помочь польским вооружённым силам получить необходимые ресурсы."
 POL_Heavy_Weapons_Production:0 "Производство тяжёлого вооружения"
 POL_Heavy_Weapons_Production_desc:0 "Нанять промышленных специалистов и отдать приоритет производству тяжёлого вооружения на государственных военных заводах."
 POL_Mechanization_Experiments:0 "Эксперименты с механизацией"
 POL_Mechanization_Experiments_desc:0 "Кавалерия долго сопротивлялась механизации из-за своих отличных результатов в польско-советской войне. Несмотря на возражения, пора двигаться вперёд и создать опытное подразделение для будущих мобильных бригад. Командование им получит перспективный офицер Станислав Мачек."
 POL_Mechanization_Experiments_tt:0 "Получить одну элитную §Hмеханизированную кавалерийскую бригаду§! в Варшаве.\n"
 POL_Theoretical_Medium_Tank_Development:0 "Теоретическая разработка среднего танка"
 POL_Theoretical_Medium_Tank_Development_desc:0 "Провести конкурс между тремя конструкторскими бюро бронетехники на проект 20-тонного танка. Машина должна сохранить подвижность моделей 10TP и 14TP, одновременно значительно усилив бронезащиту и огневую мощь за счёт модифицированного 75-мм морского зенитного орудия."
 POL_armor_training_focus:0 "Упор на подготовку бронетанковых войск"
 POL_armor_training_focus_desc:0 "Уроки польско-советской войны показывают, что война будущего станет всё более манёвренной. В ожидании этих перемен лучших пехотных офицеров можно перевести в бронетанковые войска."
 POL_armor_training_focus_tt:0 "§HПехота§!:\n    Организация: §R-1§!\n    Скорость восстановления: §R-5%§!\n§HКавалерия, моторизованные и механизированные части§!:\n    Скорость восстановления: §G+5%§!\n§HТанки и варианты бронетехники§!:\n    Организация: §G+1§!\n    Скорость восстановления: §G+15%§!\nОткрывает тактику: §HНеожиданный удар§!\n"
 POL_artillery_training_focus:0 "Упор на подготовку артиллерии"
 POL_artillery_training_focus_desc:0 "Артиллерия остаётся бесспорным королём поля боя. Перевод лучших пехотных офицеров позволит улучшить управление огнём и скорость реакции артиллерийских частей."
 POL_artillery_training_focus_tt:0 "§HПехота§!:\n    Организация: §R-1§!\n    Скорость восстановления: §R-5%§!\n§HВсе линейные батальоны§!:\n    Атака по живой силе: §G+5%§!\n"
 POL_engineers_special_forces_training_focus:0 "Упор на подготовку инженеров и войск специального назначения"
 POL_engineers_special_forces_training_focus_desc:0 "Инженерные и элитные части выиграют от перевода в них наиболее опытных и мотивированных солдат из действующих дивизий."
 POL_engineers_special_forces_training_tt:0 "§HПехота§!:\n    Организация: §R-1§!\n    Скорость восстановления: §R-5%§!\n§HВойска специального назначения§!:\n    Защита: §G+10%§!\nМаксимальная укреплённость: §G+5§!\nМножитель вместимости спецназа: §G+2%§!\n"
 POL_Complete_Focus_Army_Modernization:0 "Завершить фокус: §HМодернизация армии§!"
 POL_Complete_Focus_Army_Modernization_desc:0 "Покойный маршал Юзеф Пилсудский считал, что через десятилетие Европу ждёт новая война. Он также полагал, что пехота и кавалерия сохранят господство на поле боя, однако более молодой Эдвард Рыдз-Смиглы придерживается иного мнения. Чтобы подготовить польскую армию к грядущей буре, предстоит проделать большую работу."
 POL_Reorganize_Military_Staff:0 "Реорганизовать военный штаб"
 POL_Reorganize_Military_Staff_desc:0 "Постоянно меняющаяся обстановка требует корректировки военной тактики и работы генерального штаба."
 POL_Reorganize_Military_Staff_tt:0 "Удалить всех министров §Hвысшего военного командования§!. Половина изначальной стоимости в политической власти будет возвращена:\n\n"
 POL_Reorganize_Military_Staff_trigger:0 "Есть представитель §Hвысшего военного командования§!"
 POL_Cult_of_the_Marshal_Rydz_Smigly:0 "Культ маршала: Рыдз-Смиглы"
 POL_Cult_of_the_Marshal_Rydz_Smigly_desc:0 "При поддержке государственной пропаганды народ и армия почитают покойного Юзефа Пилсудского и его подвиги. Создание подобного мифа вокруг его преемника Рыдз-Смиглы также может принести пользу."
 POL_The_Directorate_Of_Ukraine:0 "Директория Украины"
 POL_The_Directorate_Of_Ukraine_desc:0 "После польско-советской войны Юзеф Пилсудский и его союзники были разочарованы тем, что Рижский договор не предусматривал создания независимого украинского государства. Чтобы ослабить межэтническую напряжённость и воплотить проект Междуморья покойного маршала, Директорию Украины можно вернуть из изгнания и восстановить как отдельное государственное образование, разумеется под нашим пристальным надзором. Под польским командованием будет сформирована новая украинская армия."
 POL_Maritime_and_Colonial_League_category:0 "Польская морская и колониальная лига"
 POL_Maritime_and_Colonial_League_category_desc:0 "Сильные флоты и богатые колонии — гордость европейских государств. Польская морская и колониальная лига была создана, чтобы пробудить в поляках патриотизм и культурную связь с морем. Уже занимаясь созданием зарубежных поселений для поляков и обеспечением торговых прав, Лига в конечном счёте стремится возвести Польшу в престижный статус морской державы."
 POL_Maritime_and_Colonial_League_tt:0 "Открывает решения в областях §Hторговли, колоний и флота§!."
 POL_Southern_Access_Route:0 "Южный маршрут сообщения"
 POL_Southern_Access_Route_desc:0 "Польский и венгерский народы давно считают друг друга близкими братьями. Если удастся проложить прямой путь через Словакию, новый железнодорожный маршрут откроет торговлю и совместное экономическое развитие с Венгрией."
 POL_Southern_Access_Route_trigger:0 "Имеется доступный сухопутный путь к §H[HUN.GetNameDef]§! через Словакию."
 POL_Align_With_Kaiserreich:0 "Сблизиться с Германской империей"
 POL_Align_With_Kaiserreich_desc:0 "Поскольку Адольф Гитлер больше не у власти, военный союз с нашим крупнейшим торговым партнёром может быть разумным."
 POL_Attract_Foreign_Investment:0 "Привлечь иностранные инвестиции"
 POL_Attract_Foreign_Investment_desc:0 "Масштабные реформы в интересах бизнеса и приватизация новых отраслей экономики побудят иностранные компании инвестировать в нашу страну, постепенно повысят уровень жизни и снизят безработицу."
 POL_Shock_Therapy:0 "Шоковая терапия"
 POL_Workers_Brigades:0 "Рабочие бригады"
 POL_Workers_Brigades_desc:0 "Объединённые общей солидарностью, мы сильны. Гражданская оборона — общая ответственность всех граждан."
 POL_Mandatory_Firearm_Ownership:0 "Обязательное владение оружием"
 POL_Mandatory_Firearm_Ownership_desc:0 "В интересах коллективной обороны страны все граждане обязаны владеть личным огнестрельным оружием и поддерживать его в исправном состоянии."
 POL_Zygmunt_Berling_tooltip:0 "Получить §HЗыгмунта Берлинга§! в качестве фельдмаршала §G1-го§! уровня с чертой §H«Воодушевляющий лидер»§!."
 POL_Autarky:0 "Автаркия"
 POL_Autarky_desc:0 "Зависимость от внешней торговли сырьём — серьёзная слабость. Необходимо разрабатывать каждое известное месторождение в Польше, невзирая на расходы, а соответствующие земли изъять в пользу государства."
 POL_Invest_In_Ford:0 "Инвестировать в Ford"
 POL_Invest_In_Ford_desc:0 "Правительство Соединённых Штатов проявило значительный интерес к нашим методам производства синтетического каучука. Совместная инвестиционная программа может оказаться выгодной для обеих сторон."
 POL_Align_With_Russia:0 "Сблизиться с Россией"
 POL_Align_With_Russia_desc:0 "Союз с некоммунистической Россией позволит сосредоточиться на западных врагах."
 POL_Align_With_Russia_trigger:0 "[SOV.GetNameDef] и [POL.GetNameDef] придерживаются одной идеологии."
 POL_Ford_Polska:0 "Ford Polska"
 POL_Fortification_Effort:0 "Развитие укреплений"
 POL_Democratic_Influence:0 "Демократическое влияние"
 POL_Nationalist_Influence:0 "Националистическое влияние"
 POL_Socialist_Influence:0 "Социалистическое влияние"
 POL_Falangist_Influence:0 "Фалангистское влияние"
 POL_Soviet_Infiltration:0 "Советские агенты"
 POL_shock_from_surprised_attack_idea:0 "Шок от неожиданной атаки"
 POL_shock_from_surprised_attack_idea_desc:0 "К нашему величайшему удивлению, недавний военный пакт между [GER.getName] и [SOV.getName] предусматривает совместные действия против нас! Потрясённое таким развитием событий правительство временно неспособно эффективно руководить страной, что ограничивает возможности наших войск и подрывает боевой дух солдат государства [ROOT.getName]."
 POL_Autarky_tt:0 "Открывает решения §Hпо разработке ресурсов§!."
 POL_National_Syndicalism_Autarky:0 "Национал-синдикализм: автаркия"
 POL_National_Syndicalism_Autarky_desc:0 "Приспосабливая синдикализм к целям национализма, фалангизм подчёркивает расовое единство и общую католическую идентичность. Экономическая концепция ОНР делает упор на самодостаточность. Внутреннее производство, а не международная торговля, является лучшим путём к безопасности и порядку."
 POL_Complete_Focus_Autarky:0 "Завершить фокус: §HАвтаркия§!"
 POL_Complete_Focus_Autarky_desc:0 "К счастью, Польша обеспечивает себя сельскохозяйственной продукцией, однако для самодостаточности в других отраслях производства ещё предстоит много работы."
 POL_Hire_Stanislaw_Piasecki:0 "Назначить министра: §HСтанислав Пясецкий§!"
 POL_Hire_Stanislaw_Piasecki_desc:0 "Для распространения нашей идеологии потребуется сила прессы и связи в академических кругах. Как владелец правого литературного журнала «Prosto z mostu» и основатель Всепольской молодёжи, Станислав Пясецкий является образованным политиком, способным помочь нам достичь этих целей."
 POL_Complete_Focus_Prepare_For_The_Next_War:0 "Завершить фокус: §HПодготовиться к следующей войне§!"
 POL_Complete_Focus_Invite_The_Political_Opposition:0 "Завершить фокус: §HПригласить политическую оппозицию§!"
 POL_Invite_The_Political_Opposition_tt:0 "Открывает решения §Hполитической реформы§!"
 POL_Prepare_For_The_Next_War_tt:0 "Открывает решения §Hмобилизации§!"
 POL_political_reform_category:0 "Реформирование правительства санации"
 POL_political_reform_category_desc:0 "Валерий Славек твёрдо верит, что доброжелательная и компетентная элита способна справедливо управлять страной. Помимо новой Апрельской конституции можно провести дополнительные реформы, отражающие эту философию. В то же время Славек понимает шаткое геополитическое положение Польши и необходимость сохранять частичную мобилизацию."
 POL_Cult_of_the_Marshal_Loyal_Slawek:0 "Культ маршала: «Верный Славек»"
 POL_Cult_of_the_Marshal_Loyal_Slawek_desc:0 "При поддержке государственной пропаганды народ и армия почитают покойного Юзефа Пилсудского и его подвиги. Политическая фракция Валерия Славека остаётся верна видению великого маршала. Никто не должен сомневаться в абсолютной преданности и верности, которую Славек проявлял делу маршала при его жизни."
 POL_Legion_Of_Merit:0 "Легион заслуг"
 POL_Legion_Of_Merit_desc:0 "Легион заслуг представлял собой предложенное Валерием Славеком дополнительное изменение структуры польского сената. В этой системе часть невыборных мест предназначалась гражданам с высокими государственными, гражданскими и военными наградами. Целью было поощрение служения польской нации и предотвращение обычного для демократических парламентов обструкционизма."
 POL_Sanacja_Government2:0 "Правительство санации"
 POL_Sanacja_Government2_desc:0 "Движение санации, созданное после майского переворота Юзефа Пилсудского 1926 года, состояло главным образом из бывших военных, возмущённых предполагаемой коррупцией в польской политике. Санация объединяла правых, левых и центристов, а её главными целями были искоренение коррупции и снижение инфляции."
 POL_Purchase_Antiquated_Stockpiles:0 "Закупить устаревшие запасы времён Первой мировой"
 POL_Purchase_Antiquated_Stockpiles_desc:0 "После окончания Великой войны на рынке осталось множество дешёвого, ненужного и устаревшего вооружения. Несмотря на возраст, стоит рассмотреть его закупку для расширения армии."
 POL_National_Defense_Fund_tt:0 "\nОткрывает решения §Hпропагандистских кампаний§!."
 POL_Strengthen_the_Presidential_Veto:0 "Усилить президентское вето"
 POL_Strengthen_the_Presidential_Veto_desc:0 "Апрельская конституция предоставила президенту широкое право вето для отмены законов, принятых «неконструктивным» образом. Расширение права вето на военные вопросы поможет упорядочить работу правительства."
 poland.161.t:0 "«Замок» — Игнаций Мосцицкий"
 poland.161.d:0 "Игнаций Мосцицкий родился 1 декабря 1867 года в Межаново в семье польского землевладельца, участвовавшего в Январском восстании 1863 года. После изучения химии в Рижском техническом университете он примкнул к левым движениям за независимость. Ему пришлось бежать в Лондон, а затем отправиться в Швейцарию, где он запатентовал способ производства азотной кислоты. Вскоре он познакомился с Юзефом Пилсудским в Польской социалистической партии. Во время пребывания в Австро-Венгрии Игнаций Мосцицкий стал специалистом по электрохимии. После майского переворота Пилсудского 1926 года Мосцицкий был избран президентом и вступил в должность 4 июня 1926 года.\n\nПосле смерти Пилсудского и принятия Апрельской конституции разгорелись споры о том, должен ли действующий президент переизбираться в соответствии с новыми статьями. Многие считали, что на досрочных выборах победит премьер-министр Валерий Славек. Президент Мосцицкий собрал команду юристов и правоведов, чтобы доказать ненужность досрочных выборов. Кроме того, он утверждал, что покойный маршал Юзеф Пилсудский лично благословил его на продолжение президентства. Так политическая фракция «Замок» получила название от Королевского замка в Варшаве, где находилась резиденция оказавшегося под давлением президента."
 poland.161.a:0 "Президент Республики"
 poland.162.t:0 "Демобилизация"
 poland.162.d:0 "Плохие отношения с Советским Союзом и Германией вынуждали Польшу содержать крупную армию и одновременно тратить значительную часть бюджета на оборону. До начала Великой депрессии польская армия располагала почти тремя миллионами резервистов, однако даже нынешний показатель свыше миллиона считается очень высоким среди европейских держав. Для борьбы с экономическим кризисом численность армии придётся сократить."
 poland.162.a:0 "Ограниченного призыва будет достаточно."
 poland.162.b:0 "Добровольческая армия предпочтительнее."
 poland.163.t:0 "Экономические реформы Эугениуша Квятковского"
 poland.163.d:0 "В то время как Валерий Славек и Рыдз-Смиглы считали подобные вопросы малозначительными, Игнаций Мосцицкий был глубоко обеспокоен экономическим кризисом, охватившим страну. Большие надежды на улучшение положения Польши он возлагал на своего протеже Эугениуша Квятковского. Химик, прославившийся работами в азотной промышленности, Квятковский занимал пост министра промышленности и торговли с 1926 по 1930 год и министра финансов с 1935 по 1939 год. Мосцицкий готовил его как возможного политического преемника. Именно Квятковский был главным автором успешного четырёхлетнего плана и создания морского порта Гдыня, что помогло обратить вспять экономический упадок Польши во время Великой депрессии."
 poland.163.a:0 "Экономический архитектор Второй Речи Посполитой"
 POL_industrial_projects_category:0 "Возрождение польской экономики"
 POL_industrial_projects_category_desc:0 "Исправление плачевного состояния польской экономики является высшим приоритетом. Крупномасштабные проекты и государственный экономический интервенционизм помогут обеспечить полную занятость в государственных отраслях и оживить частный сектор. Синтетическая и химическая промышленность также являются ключом к экономической независимости Польши."
 POL_Complete_Focus_Budget_Reform:0 "Завершить фокус: §HБюджетная реформа§!"
 POL_Budget_Reform_tt:0 "Открывает §Hбюджетные и экономические§! решения."
 POL_Complete_Focus_Promote_The_Chemical_Industry:0 "Завершить фокус: §HРазвивать химическую промышленность§!"
 POL_Promote_The_Chemical_Industry_tt:0 "Открывает решения §Hпо синтетическим ресурсам§!."
 POL_Cult_of_the_Marshal_Ignacy_Moscicki:0 "Культ маршала: «Старейший пилсудчик»"
 POL_Cult_of_the_Marshal_Ignacy_Moscicki_desc:0 "Ещё при жизни Пилсудского сторонники Игнация Мосцицкого пытались создать вокруг президента собственный культ. В его честь сочиняли песни и стихи, учреждали праздники. Покойный маршал глубоко доверял президенту, который иногда называл себя «старейшим пилсудчиком»."
 POL_Polish_Revanchism_tt:0 "§RПозволяет вмешаться в§! §Hгражданскую войну в Германии§!.\n"
 poland.164.t:0 "Польская интервенция в гражданскую войну в Германии"
 poland.164.d:0 "В публичном заявлении [POL.GetLeader] объявил, что польская армия вмешается, чтобы защитить анклавы этнических поляков в Германии от насилия. В нескольких приграничных районах уже вспыхнули беспорядки, которые некоторые считают организованной польским правительством провокацией для оправдания действий. Несмотря на официальные дипломатические протесты, министр иностранных дел Польши Юзеф Бек настаивает, что ответные меры оправданы."
 poland.164.a:0 "Интересное развитие событий"
 POL_PPS_Economic_Nationalization:0 "ППС: национализация экономики"
 POL_PPS_Economic_Nationalization_desc:0 "Вместо классовой борьбы Польская социалистическая партия строится вокруг идеи национального единства и освобождения страны от прежних иностранных господ. Будучи весьма прогрессивной для своего времени, она добивается широких трудовых реформ, прогрессивного налогообложения и равных прав независимо от расы, национальности, религии и пола — всех объединяет общий патриотизм."
 POL_Complete_Focus_State_Capitalism:0 "Завершить фокус: §HГосударственный капитализм§!"
 POL_Complete_Focus_State_Capitalism_desc:0 "Правительству придётся взять под контроль и напрямую управлять важнейшими отраслями. Кроме того, крупные активы, принадлежащие иностранцам, следует конфисковать и национализировать ради блага польского народа."
 POL_Hire_Adam_Ciolkosz:0 "Назначить министра: §HАдам Цёлкош§!"
 POL_Hire_Adam_Ciolkosz_desc:0 "Несмотря на прежний арест за деятельность против санации, Адам Цёлкош сумел избраться в Сейм от Тарнува, получив рекордное число голосов. Будучи также руководителем Окружного рабочего комитета ППС в Кракове, он обладает значительным влиянием на общественное сознание польского народа."
 POL_Front_Morges_Diplomatic_Agenda:0 "СЛ: дипломатическая программа"
 POL_Front_Morges_Diplomatic_Agenda_desc:0 "Администрация Винценты Витоса, в которую входят многие представители правительства до майского переворота Пилсудского 1926 года, обеспокоена всё более опасным ростом экстремизма в соседних странах. Поэтому она стремится создать прочные союзы с близкими по духу демократическими государствами. Во внутренней политике она выступает за либерализацию, избегая крайностей полностью рыночной экономики."
 POL_Hire_Wojciech_Korfanty:0 "Назначить министра: §HВойцех Корфанты§!"
 POL_Hire_Wojciech_Korfanty_desc:0 "Войцех Корфанты, один из руководителей восстаний польского населения Силезии в 1918 году, был депутатом польского Сейма. После майского переворота 1926 года его долго судили за связи с прежним правительством, заключили в тюрьму, а затем вынудили жить в изгнании в Чехословакии. Он пользуется широкой поддержкой общества и станет отличным лидером Фронта Морж в Швейцарии."
 POL_Complete_Focus_Civil_Service_Reform:0 "Завершить фокус: §HРеформа государственной службы§!"
 POL_Complete_Focus_Civil_Service_Reform_desc:0 "Перед реализацией программы СЛ необходимо отстранить многих бывших чиновников, сохраняющих верность прежнему правительству и военным. Новая система назначений по заслугам обеспечит эффективную работу власти в соответствии с христианскими ценностями."
 POL_Endecja_Social_Reform:0 "Национальная демократия: общество и культура"
 POL_Endecja_Social_Reform_desc:0 "Особенно для правых Роман Дмовский является одним из великих основателей польской независимости. Возглавляемая им националистическая партия стремится к силе, но избегает экстремизма. Польша прежде всего является государством поляков, а остальные группы должны ассимилироваться в польскую культуру. Для раскрытия человеческих талантов и потенциала государственная политика также должна поддерживать развитие образованных слоёв и среднего класса."
 POL_Hire_Tadeusz_Bielecki:0 "Назначить министра: §HТадеуш Белецкий§!"
 POL_Hire_Tadeusz_Bielecki_desc:0 "Правительство санации давно подавляет националистическое движение. Чтобы преодолеть его авторитаризм, необходимо решительное руководство. Белецкий, входящий в число «девяти» доверенных лиц Романа Дмовского, станет достойным будущим председателем Верховного совета Национальной партии."
 POL_Complete_Focus_Invest_In_The_Middle_Class:0 "Завершить фокус: §HИнвестировать в средний класс§!"
 POL_Complete_Focus_Invest_In_The_Middle_Class_desc:0 "Опорой националистического движения является польский средний класс. Чтобы расширить поддержку нашей администрации и обеспечить благополучие общества, государственная политика должна способствовать его росту."
 POL_Invest_In_The_Middle_Class_tt:0 "Открывает решения §Hсоциальной реформы§!."
 stalinist_revolutionary:0 "Сталинист-революционер"
 democratic_exile:0 "Демократ в изгнании"
 falangist_demagogue:0 "Фалангистский демагог"
 POL_Foreign_Assets_Seized:0 "Иностранные активы конфискованы"
 POL_German_Blitzkrieg_of_Poland_dummy:0 "Германский блицкриг в Польше"
 POL_German_Blitzkrieg_of_Poland:0 "Германский блицкриг в Польше"
 POL_German_Blitzkrieg_of_Poland_desc:0 "Внезапный натиск германской армии, её скорость, авиация и деятельность пятой колонны нарушили логистику польской армии."
 POL_Polish_Revanchism_tt_tt:0 "Открывает решения §Hпо созданию национальных территорий§!."
 POL_Complete_Focus_Polish_Revanchism:0 "Завершить фокус: §HПольский реваншизм§!"
 POL_Complete_Focus_Polish_Revanchism_desc:0 "Националисты твёрдо верят в пястовскую концепцию Польши. Необходимо обратить вспять многовековую германизацию земель, некогда принадлежавших польской короне."
 POL_Enlistment_Restrictions:0 "Ограничения на военную службу"
 POL_Enlistment_Restrictions_desc:0 "Лояльность некоторых этнических групп вызывает сомнения. Их необходимо отстранить от военной службы, а разведывательные службы должны установить за ними более пристальное наблюдение."
 POL_Enlistment_Restrictions_tt:0 "§GУстраняет отрицательный армейский штраф в случае германского вторжения.§!"
 POL_Urban_Migration_Incentives:0 "Стимулы к переселению в города"
 POL_Urban_Migration_Incentives_desc:0 "Рост капиталистического класса требует высокой концентрации доступной рабочей силы. Следует предложить стимулы для переселения населения из сельской местности в города."
 POL_Make_Western_Pomerania_Core:0 "Сделать Западную Померанию национальной территорией"
 POL_Make_Western_Pomerania_Core_desc:0 "После веков германизации в западной части Померании сохранились заметные анклавы польского меньшинства, имеющие культурное значение. Обязательное культурное образование нового поколения и щедрые стимулы для переселения поляков в регион со временем обеспечат его лояльность."
 POL_Make_Western_Silesia_Core:0 "Сделать Западную Силезию национальной территорией"
 POL_Make_Western_Silesia_Core_desc:0 "После веков германизации в западной части Силезии сохранились заметные анклавы польского меньшинства, имеющие культурное значение. Обязательное культурное образование нового поколения и щедрые стимулы для переселения поляков в регион со временем обеспечат его лояльность."
 POL_Make_East_Prussia_Core:0 "Сделать Восточную Пруссию национальной территорией"
 POL_Make_East_Prussia_Core_desc:0 "После веков германизации в Восточной Пруссии сохранились заметные анклавы польского меньшинства, имеющие культурное значение. Обязательное культурное образование нового поколения и щедрые стимулы для переселения поляков в регион со временем обеспечат его лояльность."
 POL_Family_Subsidies:0 "Субсидии семьям и предприятиям"
 POL_Family_Subsidies2:0 "Субсидии семьям и предприятиям"
 POL_Promethean_Program_category:0 "§R— СЕКРЕТНО! —§!"
 POL_Promethean_Program_category_desc:0 "Программа «Прометей» была создана Юзефом Пилсудским для ослабления Советского Союза путём поддержки национальных движений за независимость среди нерусских народов. Со временем программа превратилась в наступательный инструмент на случай войны с СССР. Специальные польские подразделения под командованием отобранных офицеров готовятся к диверсиям и сбору разведданных в тылу врага. На протяжении последних десятилетий польско-советская граница остаётся напряжённой, а обе стороны регулярно перебрасывают через неё шпионов."
 POL_Authorize_Sabotage_Mission:0 "Санкционировать диверсионную операцию"
 POL_Authorize_Sabotage_Mission_desc:0 "Агенты программы «Прометей», действующие совместно с диссидентами в государстве [SOV.GetNameDef], обнаружили возможность нанести удар по режиму. Для диверсии выбрана промышленная цель. Агенты ожидают финансирования, оборудования и разрешения на выполнение плана."
 POL_Tadeusz_Schaetzel_tt:0 "Поскольку министром является §HТадеуш Шетцель§!, нам будет возвращено §G18§! ед. политической власти."
 POL_Japanese_Military_Intelligence_Cooperation:0 "Сотрудничество с японской военной разведкой"
 POL_Japanese_Military_Intelligence_Cooperation_desc:0 "Польша и Япония уже имеют опыт совместной работы по подрыву Советского Союза. В обмен на обучение японских офицеров криптографии мы могли бы использовать Японию как базу для новых операций программы «Прометей»."
 POL_Japanese_Military_Intelligence_Cooperation_tt:0 "Повышает эффективность §Hдиверсионных операций§!, пока у нас сохраняются дружественные отношения с Японией."
 POL_develop_steel_industry_emphasis:0 "Упор на сталелитейную промышленность"
 POL_develop_steel_industry_emphasis_desc:0 "На юго-западе Польши уже ведётся крупномасштабная добыча угля и железной руды. Недостаточный внутренний спрос не должен мешать открытию новых сталелитейных заводов. В синдикалистской экономике государство обязано разумно распоряжаться плодами народного труда."
 POL_develop_aluminium_smelting_industry:0 "Эксперименты с выплавкой алюминия"
 POL_develop_aluminium_smelting_industry_desc:0 "Несмотря на наличие отечественных месторождений и шахт бокситов, прежнее правительство и капиталисты предпочитали лениво импортировать дешёвый очищенный алюминий из Венгрии. Эту ошибку необходимо исправить, построив собственные плавильные предприятия."
 POL_develop_aluminium_smelting_industry2:0 "Развитие алюминиевой промышленности"
 POL_develop_aluminium_smelting_industry2_desc:0 "После первых экспериментов дальнейшие государственные проекты помогут раскрыть потенциал отечественного производства алюминия."
 POL_Reopen_Old_Chromium_Mines:0 "Вновь открыть старые хромовые шахты"
 POL_Reopen_Old_Chromium_Mines_desc:0 "Когда-то в Силезии в небольших масштабах добывали хром и молибден. Эти шахты давно закрыты из-за истощения и нерентабельности. Однако рабочую силу необходимо направить на добычу этих ресурсов, невзирая на стоимость."
 POL_Develop_Boryslaw_Oil_Basin:0 "Развивать Бориславский нефтяной бассейн"
 POL_Develop_Boryslaw_Oil_Basin_desc:0 "Предприятия Борислава имеют решающее значение для снабжения Польши нефтью, необходимой для гражданских и военных нужд. Регион следует развивать дальше."
 POL_Prospect_For_Oil_Carpathian:0 "Искать нефть в Карпатах"
 POL_Prospect_For_Oil_Carpathian_desc:0 "Давно предполагается, что в Карпатах имеются дополнительные запасы нефти, однако разведка местности затруднена. Ценой больших усилий можно организовать новые добывающие предприятия."
 POL_steel_industry_growth:0 "Рост сталелитейной промышленности"
 POL_steel_industry_growth_desc:0 "По мере восстановления польской экономики внутренний спрос на сталь естественным образом возрастёт. Поскольку на юго-западе Польши уже ведётся крупномасштабная добыча угля и железной руды, расширить производство будет несложно."
 POL_chemical_research_grants:0 "Гранты на химические исследования"
 POL_chemical_research_grants_desc:0 "Предыдущие исследования и разработки в области синтетических материалов и химии дали весьма положительные результаты. Следует увеличить государственное финансирование и субсидии."
 POL_Women_In_Aviation:0 "Женщины в военной авиации"
 POL_Women_In_Aviation_desc:0 "Женщины уже выполняют различные вспомогательные функции в армии, включая пилотирование связных и транспортных самолётов. Их роль можно расширить, допустив к управлению боевыми самолётами."
 POL_relocate_industry_to_the_east:0 "Перенести промышленность на восток"
 POL_relocate_industry_to_the_east_desc:0 "Демонтаж и перенос заводов в районы с самой высокой безработицей позволит быстро смягчить недовольство беднейших регионов Польши и принесёт нам политическую поддержку."
 POL_Handle_Danzig:0 "Разобраться с Данцигом"
 POL_Handle_Danzig_desc:0 "Верховный комиссар Данцига всё больше обеспокоен укореняющимся в правительстве города экстремизмом и обращением с польским меньшинством региона. Следует тайно заняться этой ситуацией через дипломатические каналы Лиги Наций."
 POL_Communal_Farms:0 "Общинные хозяйства"
 POL_Collective_Farms:0 "Коллективные хозяйства"
 POL_Collective_Farms_desc:0 "Наша партия возникла из непростого союза деловых кругов и сельской крестьянской партии. Чтобы сохранить поддержку низов, можно создать коллективные хозяйства в наиболее пострадавших регионах Польши и тем самым восстановить стабильность."
 POL_Sanacja_Influence:0 "Влияние санации"
 POL_Austerity_Measures:0 "Меры жёсткой экономии"
 POL_Austerity_Measures_desc:0 "Предметы роскоши нужны лишь слабовольным. Экономика должна сосредоточиться исключительно на производстве товаров и услуг, непосредственно полезных государству и прогрессу."
 POL_The_Three_Year_Plan:0 "Трёхлетний план"
 POL_The_Three_Year_Plan_desc:0 "Для перестройки польской экономики в соответствии с марксистско-ленинскими ценностями необходим новый экономический план."
 POL_Socialist_Realism:0 "Социалистический реализм"
 POL_Socialist_Realism_desc:0 "Градостроительство и архитектура польских городов должны отражать социалистические идеалы стойкости и силы. Рабочая культура также должна принять стахановское движение и воспринимать труд как источник гордости и героизма."
 POL_Vladimir_Lenin_Steelworks:0 "Металлургический завод имени Владимира Ленина"
 POL_Vladimir_Lenin_Steelworks_desc:0 "Бывшие богатые регионы Польши сопротивляются принятию коммунистических ценностей. Строительство новых промышленных городов в Новой-Хуте и приток рабочих исправят местный «классовый дисбаланс»."
 POL_presitge_toolip:0 "Открывает решения §Hнационального престижа§!."
 POL_palace_of_culture_and_science:0 "Дворец культуры и науки"
 POL_palace_of_culture_and_science_desc:0 "Для формирования общественного мнения необходимо возвести грандиозный памятник дружбе Польши и СССР. Источником вдохновения могут послужить многочисленные высотные здания Соединённых Штатов, но сооружение должно доказать торжество коммунистических ценностей."
 POL_submarine_manufacturer:0 "Производитель подводных лодок"
 POL_Gain_Ministers_Tooltip:0 "\n\nСтанут доступны новые правительственные министры.\n"
 POL_konstantin_rokossovsky:0 "Константин Рокоссовский"
 POL_Dislikes_Poland:0 "Не любит Польшу"
 POL_Secretary_General:0 "Генеральный секретарь"
 POL_has_ceded_the_east:0 "Выполнено событие: §HПередача восточных земель Советскому Союзу§!"
 POL_Same_Ideology_War_Tooltip:0 "Установить правило: можно объявлять войну государствам с той же идеологией.\n"
