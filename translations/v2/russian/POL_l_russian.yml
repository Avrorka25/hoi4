 POL_Heavy_Weight_Bomb_Ejector:0 "Сбрасыватель тяжёлых бомб"
 Polish_Peoples_radio_TITLE:0 "Польские коммунистические песни"
 POL_The_Great_Depression:0 "Великая депрессия"
 POL_The_Great_Depression_desc:0 "Польша особенно сильно пострадала от Великой депрессии. В последние годы резко сократились инвестиции, промышленное производство, торговля и уровень жизни."
 POL_Rural_Unemployment:0 "Безработица в сельской местности"
 POL_Rural_Unemployment_desc:0 "Восточные регионы Польши развиты значительно хуже западных. Безработица широко распространена по всей стране, а в сельских районах востока она особенно тяжела."
 POL_Prometheism:0 "Прометеизм"
 POL_Prometheism_desc:0 "Прометеизм был тайным политическим проектом, начатым Польшей. Его целью являлось ослабление Российской империи и её государств-преемников, включая Советский Союз, путём поддержки национальных движений за независимость среди крупнейших нерусских народов, живших в границах России и СССР."
 POL_the_Agrarian_Reform_Focus:0 "Аграрная реформа"
 POL_the_Agrarian_Reform_Focus_desc:0 "При широкой поддержке сельского крестьянства проводятся реформы землевладения."
 POL_Sanacja_Government:0 "Правительство санации"
 POL_Sanacja_Government_desc:0 "Движение санации, созданное после майского переворота Юзефа Пилсудского 1926 года, состояло главным образом из бывших военных, возмущённых предполагаемой коррупцией в польской политике. Санация объединяла правых, левых и центристов, а её главными целями были искоренение коррупции и снижение инфляции."
 intelligence_analyst:0 "Аналитик разведки"
 collective_austerity_idea:0 "Коллективная экономия"
 POL_general_staff:0 "Режим полковников"
 POL_general_staff_desc:0 "Фельдмаршал Эдвард Рыдз-Смиглы и его военный штаб непосредственно руководят правительством и вооружёнными силами на высшем уровне. Благодаря этому они свободны от обычных политических соображений, замедляющих военное планирование."
 POL_Budget_Reform_Focus:0 "Бюджетные реформы"
 POL_Budget_Reform_Focus_desc:0 "Бюджет перераспределяется в пользу экономики за счёт оборонных расходов."
 POL_Infantry_Focus:0 "Крестьянская армия"
 POL_Infantry_Focus_desc:0 "Сформирована новая польская армия, состоящая из сельского крестьянства."
 POL_Motorization_Focus:0 "Инвестиции в автомобильных производителей"
 POL_Motorization_Focus_desc:0 "На ограниченный срок автомобильным производителям предоставляются особые льготы."
 POL_Air_Focus:0 "Продажа государственных авиапредприятий"
 POL_Air_Focus_desc:0 "Государственные авиационные предприятия переданы под новое частное управление."
 POL_Empty_Universities:0 "Опустевшие университеты"
 POL_Empty_Universities_desc:0 "Все студенты университетов добровольно вступили в армию или были призваны для защиты страны."
 POL_The_Catholic_Student_Movement:0 "Католическое студенческое движение"
 POL_The_Catholic_Student_Movement_desc:0 "Поступление в религиозные университеты поощряется и стимулируется."
 POL_DWL:0 "DWL"
 POL_stocznia_gdansk:0 "Гданьская верфь"
 POL_National_Syndicalism:0 "Национал-синдикализм"
 POL_National_Syndicalism_desc:0 "Для синдикалиста капиталистическое государство по своей природе является инструментом угнетения и бюрократической неэффективности. При национал-синдикализме правительство вместо этого контролирует и поощряет прямую производственную деятельность местных объединений граждан и профсоюзов на благо государства."
