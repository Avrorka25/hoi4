 POL_charismatic_leader:0 "Харизматичный лидер"
 POL_Wieniawa_infamous_womanizer:0 "Печально известный бабник"
 POL_Baltic_Naval_Vanguard:0 "Балтийский военно-морской авангард"
 POL_Baltic_Naval_Vanguard_desc:0 "Передовое положение Польши на побережье Балтийского моря делает её отличной военно-морской базой для сил Коминтерна. Следует значительно нарастить наши наступательные возможности за морем."
 POL_Expand_the_Lucznik_State_Arms_Factory:0 "Расширить государственный оружейный завод «Лучник»"
 POL_Expand_the_Lucznik_State_Arms_Factory_desc:0 "Для растущего военного экспорта и нужд собственной армии требуются более крупные арсеналы."
 POL_Electrification_of_the_Countryside:0 "Электрификация сельской местности"
 POL_Electrification_of_the_Countryside_desc:0 "Надёжное электроснабжение самых отдалённых городов и деревень позволит развивать современную промышленность и одновременно повысит поддержку правительства в сельской местности."
 POL_Invest_In_The_Warsaw_Industrial_District:0 "Инвестировать в Варшавский промышленный район"
 POL_Invest_In_The_Warsaw_Industrial_District_desc:0 "Государственные инвестиции во второй по величине промышленный регион нашей экономики ещё больше укрепят страну."
 POL_Invest_In_The_Old_Polish_Industrial_Region:0 "Инвестировать в Старопольский промышленный район"
 POL_Invest_In_The_Old_Polish_Industrial_Region_desc:0 "Инвестиционные проекты в западных регионах помогут связать нашу экономику с внешним миром."
 POL_Gdynia_Universal_Seaport:0 "Универсальный морской порт Гдыни"
 POL_Gdynia_Universal_Seaport_desc:0 "Порт Гдыни — наше окно в мир. Дальнейшая модернизация городской инфраструктуры и расширение порта, способного принимать суда любого размера, позволят удовлетворить глобальные торговые потребности страны."
 POL_Maritime_Defense_Fund:0 "Фонд морской обороны (ФОМ)"
 POL_Maritime_Defense_Fund_desc:0 "В случае эмбарго или войны море станет нашей жизненно важной торговой связью с внешним миром. Из-за бюджетных трудностей придётся собирать частные пожертвования граждан для финансирования современного флота."
 POL_Zaklady_Azotowe:0 "Азотные заводы"
 POL_Chemical_Conglomerate:0 "Химический конгломерат"
 POL_Promote_The_Chemical_Industry:0 "Продвижение химической промышленности в Мощице"
 POL_Promote_The_Chemical_Industry_desc:0 "Без заморских колоний экономическая безопасность Польши ненадежна. Дальнейшее развитие отечественной синтетической химической и каучуковой промышленности является одним из главных приоритетов."
