 Gdansk_POL_border_conflict_escalate_conflict_desc:0 "Конфликт за [DNZ.GetNameDef] зашёл в тупик. Возможно, дальнейшая эскалация и переброска дополнительных войск на этот театр позволят нам добиться победы."
 Gdansk_POL_border_conflict_escalate_to_war:0 "Объявить войну за [DNZ.GetNameDef]"
 Gdansk_POL_border_conflict_escalate_to_war_desc:0 "Бои за [DNZ.GetNameDef] продолжаются уже некоторое время и не собираются прекращаться. Мы должны быть готовы сделать следующий шаг и рассматривать этот конфликт как начало полномасштабной войны."
 Gdansk_POL_border_conflict_back_out_of_conflict:0 "Отступить"
 Gdansk_POL_border_conflict_back_out_of_conflict_desc:0 "Опасность того, что конфликт выйдет из-под контроля и перерастёт в полномасштабную войну между нашими странами, слишком велика. Следует признать потери и начать осторожные дипломатические контакты с другой стороной."
