 ABILITY_ARMOURED_TRAINS:0 "Бронепоезда"
 ABILITY_ARMOURED_TRAINS_TOOLTIP:0 "Бронепоезда ($LEADER$)"
 ABILITY_ARMOURED_TRAINS_DESC:0 "Ваши армии получат значительный бонус к скорости прибытия подкреплений и небольшой бонус к защите."
 POL_River_Flotillas:0 "Речные флотилии"
 POL_River_Flotillas_desc:0 "Разветвлённая сеть малых канонерских лодок и бронированных речных барж поможет защитить наши внутренние водные пути от вражеских переправ."
 POL_River_Flotillas_tt:0 "   Буксируемая и моторизованная §Hартиллерия§!, §HПВО§!, §HПТО§!, §Hреактивная артиллерия§!:\n     §HРека§! и §Hболото§!: атака: §G+5%§!\n     §HРека§! и §Hболото§!: защита: §G+5%§!\n     §HРека§! и §Hболото§!: скорость передвижения: §G+10%§!\n\n"
 POL_huta_zgoda:0 "Huta Zgoda"
 POL_Polish_Aero_Club:0 "Польский аэроклуб"
 POL_generic_industrial_concern:0 "Сталелитейный завод «Байльдон»"
 POL_fryderyk_krystian_wettyn:0 "Fryderyk Krystian Wettyn"
 public_security:0 "Общественная безопасность"
 POL_night_assault_tactics:0 "Тактика ночного штурма"
 POL_add_level_one_fort_on_ukrainian_border_tt:0 "Добавить §Hукрепления 1-го уровня§! на границе с Украиной во Львове и Волыни:"
 POL_add_level_one_fort_on_belarussian_border_tt:0 "Добавить §Hукрепления 1-го уровня§! на границе с Белоруссией в Полесье, Новогрудке и Вилейке:"
 POL_add_level_one_fort_in_silesia_tt:0 "Добавить §Hукрепления 1-го уровня§! на границах в Катовице, Кракове и Заользье, если эти регионы принадлежат нам или нашему субъекту:"
 POL_add_forts_on_border_with_prussia_tt:0 "Добавить §Hукрепления 1-го§!, §H2-го§! и §H3-го уровней§! в различных приграничных районах Восточной Пруссии:"
 POL_add_level_two_forts_on_western_border_with_germany_tt:0 "Добавить §Hукрепления 2-го уровня§! в приграничных районах с Восточной Германией:"
 POL_invite_ukraine:0 "Пригласить Украину"
 POL_invite_ukraine_desc:0 "Украинцы служат важнейшим буфером против [SOV.GetAdjective]их амбиций."
 POL_radicalize_the_front:0 "Радикализировать фронт"
 POL_radicalize_the_front_desc:0 "Пришло время радикальных мер. Польша стоит на краю пропасти. Наша политика требует решительных действий!"
 POL_accept_border_realignment:0 "Принять изменение границ"
 POL_accept_border_realignment_desc:0 "Мы должны принять тот факт, что послевоенная Польша будет выглядеть совсем иначе и в её состав уже не войдут наши бывшие восточные земли."
 POL_Border_War_For_Silesia:0 "Пограничный конфликт за Силезию"
 POL_Border_War_For_Silesia_desc:0 "В Силезии существует множество польских этнических общин, имеющих культурное значение для нашей нации. Нам следует использовать кризис у соседа как предлог для вмешательства и защиты поляков от насилия."
 POL_border_conflict_warning_GER:0 "Польские вторжения на границе с Силезией"
 POL_border_conflict_warning_GER_desc:0 "Пограничники сообщают о передвижениях польских войск, пытающихся проникнуть на нашу территорию, а также о беспорядках в польских этнических анклавах Силезии. Мы должны немедленно подготовиться к военным действиям."
 POL_border_conflict_escalation_warning_GER:0 "Сосредоточение польской армии у Силезии"
 POL_border_conflict_escalation_warning_GER_desc:0 "Разведчики подтвердили крупные перемещения войск на польской стороне границы близ Силезии. Мы не знаем, решились ли поляки на удар и когда он может последовать, но должны быть готовы."
 POL_border_incident_forgotten:0 "Силезия: окно возможностей"
 POL_border_incident_forgotten_desc:1 "Если мы хотим воспользоваться инцидентом на германской границе в Силезии, необходимо действовать быстро."
 POL_escalate_incident_to_border_conflict_GER:0 "Обострить инцидент в Силезии"
 POL_escalate_incident_to_border_conflict_GER_desc:0 "Похоже, немцы не намерены отступать. Теперь нам остаётся либо довести конфликт до вооружённого столкновения, либо отступить самим."
 POL_border_conflict_time_until_cancelled:0 "Завершение конфликта в Силезии"
 POL_border_conflict_time_until_cancelled_desc:0 "При нынешнем темпе мы сможем поддерживать боевые действия лишь ограниченное время, после чего придётся прекратить сражение."
 POL_border_conflict_escalate_conflict:0 "Обострить конфликт в Силезии"
 POL_border_conflict_escalate_conflict_desc:0 "Конфликт на силезской границе зашёл в тупик. Возможно, дальнейшая эскалация и переброска дополнительных войск на этот театр позволят нам добиться победы."
 POL_border_conflict_escalate_to_war:0 "Объявить войну за Силезию"
 POL_border_conflict_escalate_to_war_desc:0 "Бои в Силезии продолжаются уже некоторое время и не собираются прекращаться. Мы должны быть готовы сделать следующий шаг и рассматривать этот конфликт как начало полномасштабной войны."
 POL_border_conflict_back_out_of_conflict:0 "Отступить"
 POL_border_conflict_back_out_of_conflict_desc:0 "Опасность того, что конфликт выйдет из-под контроля и перерастёт в полномасштабную войну между нашими странами, слишком велика. Следует признать потери и начать осторожные дипломатические контакты с другой стороной."
 Prussia_POL_Border_War_For_prussia:0 "Пограничный конфликт за Восточную Пруссию"
 Prussia_POL_Border_War_For_prussia_desc:0 "В Восточной Пруссии существует множество польских этнических общин, имеющих культурное значение для нашей нации. Нам следует использовать кризис у соседа как предлог для вмешательства и защиты поляков от насилия."
 Prussia_POL_border_conflict_warning_GER:0 "Польские вторжения на границе Восточной Пруссии"
 Prussia_POL_border_conflict_warning_GER_desc:0 "Пограничники сообщают о передвижениях польских войск, пытающихся проникнуть на нашу территорию, а также о беспорядках в польских этнических анклавах Восточной Пруссии. Мы должны немедленно подготовиться к военным действиям."
 Prussia_POL_border_conflict_escalation_warning_GER:0 "Сосредоточение польской армии у Восточной Пруссии"
 Prussia_POL_border_conflict_escalation_warning_GER_desc:0 "Разведчики подтвердили крупные перемещения войск на польской стороне границы близ Восточной Пруссии. Мы не знаем, решились ли поляки на удар и когда он может последовать, но должны быть готовы."
 Prussia_POL_border_incident_forgotten:0 "Восточная Пруссия: окно возможностей"
 Prussia_POL_border_incident_forgotten_desc:1 "Если мы хотим воспользоваться инцидентом на германской границе в Восточной Пруссии, необходимо действовать быстро."
 Prussia_POL_escalate_incident_to_border_conflict_GER:0 "Обострить инцидент в Восточной Пруссии"
 Prussia_POL_escalate_incident_to_border_conflict_GER_desc:0 "Похоже, немцы не намерены отступать. Теперь нам остаётся либо довести конфликт до вооружённого столкновения, либо отступить самим."
 Prussia_POL_border_conflict_time_until_cancelled:0 "Завершение конфликта в Восточной Пруссии"
 Prussia_POL_border_conflict_time_until_cancelled_desc:0 "При нынешнем темпе мы сможем поддерживать боевые действия лишь ограниченное время, после чего придётся прекратить сражение."
 Prussia_POL_border_conflict_escalate_conflict:0 "Обострить конфликт в Восточной Пруссии"
 Prussia_POL_border_conflict_escalate_conflict_desc:0 "Конфликт на границе Восточной Пруссии зашёл в тупик. Возможно, дальнейшая эскалация и переброска дополнительных войск на этот театр позволят нам добиться победы."
 Prussia_POL_border_conflict_escalate_to_war:0 "Объявить войну за Восточную Пруссию"
 Prussia_POL_border_conflict_escalate_to_war_desc:0 "Бои в Восточной Пруссии продолжаются уже некоторое время и не собираются прекращаться. Мы должны быть готовы сделать следующий шаг и рассматривать этот конфликт как начало полномасштабной войны."
 Prussia_POL_border_conflict_back_out_of_conflict:0 "Отступить"
 Prussia_POL_border_conflict_back_out_of_conflict_desc:0 "Опасность того, что конфликт выйдет из-под контроля и перерастёт в полномасштабную войну между нашими странами, слишком велика. Следует признать потери и начать осторожные дипломатические контакты с другой стороной."
 POL_Construct_Hydroelectric_Power_Plants:0 "Построить гидроэлектростанции"
 POL_Construct_Hydroelectric_Power_Plants_desc:0 "Строительство гидроэлектростанций в Рожнуве и Мычковцах обеспечит дальнейший рост нашей промышленности."
 POL_Fill_The_Railways_Gaps:0 "Устранить разрывы в железнодорожной сети"
 POL_Fill_The_Railways_Gaps_desc:0 "Значительная часть нашей железнодорожной сети разрознена и не связана между собой. Построив недостающие участки, мы получим столь необходимые транспортные возможности."
 POL_Stomil_Debica_Rubber_Plant:0 "Резиновый завод «Стомиль» в Дембице"
 POL_Huta_Stalowa_Wola_Steel_Mill:0 "Металлургический завод «Сталева-Воля»"
 POL_Huta_Stalowa_Wola_Steel_Mill_desc:0 "Строительство дополнительных металлургических заводов обеспечит успех нашей экономики и армии."
 POL_Stomil_Debica_Rubber_Plant_desc:0 "Дембица является важным центром нашей химической, цементной промышленности и производства удобрений. Государственные инвестиции позволят наладить военное производство полезных синтетических материалов."
 POL_Expand_The_Armaments_Industry:0 "Расширить военную промышленность"
 POL_Expand_The_Armaments_Industry_desc:0 "Заложить основу централизованной военной промышленности."
 POL_Complete_the_Central_Industrial_Region:0 "§LЗавершить создание Центрального промышленного района§!"
 POL_Complete_the_Central_Industrial_Region_desc:0 "Модернизировать старые заводы в Кельце, Скаржиско, Радоме, Стараховице и Островце, одновременно строя новые предприятия для укрепления нашей промышленности."
 POL_The_Four_Year_Plan:0 "Четырёхлетний план"
 POL_The_Four_Year_Plan_desc:0 "Мы должны спланировать расширение инфраструктуры так, чтобы она соответствовала не только нынешним потребностям промышленности, но и её будущему росту."
 POL_Expansion_Of_New_Towns:0 "Расширение новых городов"
 POL_Expansion_Of_New_Towns_desc:0 "Чтобы новые города процветали, недостаточно просто основать их — необходимо помочь им полностью раскрыть свой потенциал."
 POL_Develop_Upper_Silesia:0 "Развивать Верхнюю Силезию"
 POL_Develop_Upper_Silesia_desc:0 "Автономный регион Верхней Силезии остаётся спорной территорией со времён Великой войны. Развитие региона сплотит местное население и укрепит нашу промышленность."
 POL_Eastern_Railway_Lines:0 "Восточные железнодорожные линии"
 POL_Eastern_Railway_Lines_desc:0 "Восточные кресы долгое время оставались менее развитыми, чем остальная Польша. Создание железнодорожного сообщения в этих районах ускорит экономический рост."
 POL_Start_The_Fifteen_Year_Plan:0 "Начать пятнадцатилетний план"
 POL_Start_The_Fifteen_Year_Plan_desc:0 "Пришло время заложить основу для превращения всей Польши в развитую страну. Пятнадцатилетняя инвестиционная программа выведет нас в число ведущих государств мира."
 POL_Pressure_Gdansk:0 "Оказать давление на Гданьск"
 POL_Pressure_Gdansk_desc:0 "Слишком долго Вольный город Гданьск препятствовал нашему законному доступу к морю. Мы должны добиться выполнения его обязательств, при необходимости силой."
 POL_Expand_Port_Facilities:0 "Расширить портовые сооружения"
 POL_Expand_Port_Facilities_desc:0 "Для увеличения грузооборота нашего международного торгового порта необходимы более крупные и современные сооружения."
 POL_Internationalism:0 "Интернационализм"
 POL_Internationalism_desc:0 "Расширение международной торговли станет первым шагом к повышению нашего престижа и укреплению зарубежных связей."
 POL_Seek_Accommodation_With_Germany:0 "Искать соглашения с Германией"
 POL_Seek_Accommodation_With_Germany_desc:0 "Вопрос Вольного города Гданьска давно остаётся болезненной темой в отношениях Польши и Германии. Совместная работа над местными проектами поможет ослабить напряжённость."
 POL_Polish_German_Trade_Agreement:0 "Польско-германское торговое соглашение"
 POL_Polish_German_Trade_Agreement_desc:0 "Существующие торговые соглашения с Германией необходимо расширить, чтобы способствовать дальнейшему сотрудничеству между нашими странами."
 POL_Develop_Polish_Ship_Building:0 "Развивать польское судостроение"
 POL_Develop_Polish_Ship_Building_desc:0 "Континентальное положение нашей страны не оправдывает пренебрежения развитием флота."
 POL_Study_Foreign_Built_Ships:0 "Изучить иностранные корабли"
 POL_Study_Foreign_Built_Ships_desc:0 "Наши соседи постоянно создают новые типы кораблей. Мы должны изучать их, иначе наш собственный флот быстро устареет."
 POL_A_Cruiser_Navy:0 "Крейсерский флот"
 POL_A_Cruiser_Navy_desc:0 "Для осуществления наших планов по обеспечению присутствия на море потребуются всё более крупные корабли."
 POL_Import_Submarine_Technology:0 "Импортировать технологии подводных лодок"
 POL_Import_Submarine_Technology_desc:0 "Отставание в области подводного флота недопустимо. Мы получим необходимые технологии, даже если придётся их купить."
 POL_Commerce_Attack:0 "Тактика нападения на торговые суда"
 POL_Commerce_Attack_desc:0 "Ни один флот не будет полноценным без подводных лодок. Их, как и остальные силы флота, необходимо организовать так, чтобы добиться максимальной боевой эффективности."
 POL_Naval_Officers_School:0 "Две угрозы"
 POL_Naval_Officers_School_desc:0 "Сосредоточившись на тактике противодействия нашим наиболее вероятным противникам, мы сохраним преимущество в морском бою."
 POL_Coastal_Defense:0 "Береговая оборона"
 POL_Coastal_Defense_desc:0 "Мобильные силы береговой обороны ближнего действия могут оказаться эффективнее многократно превосходящих их стационарных укреплений."
 POL_Strike_Force:0 "Ударное соединение"
 POL_Strike_Force_desc:0 "Если нам будет недоставать численного превосходства, потребуется быстро перебрасываемое соединение боевых кораблей, способное ударить по противнику там, где он слабее всего."
 POL_Baltic_Navy:0 "Балтийский флот"
 POL_Baltic_Navy_desc:0 "Если мы хотим эффективно использовать наши корабли на Балтике, необходимо полностью пересмотреть военно-морскую стратегию."
 POL_rewrite_1935_constitution:0 "Переписать Конституцию 1935 года"
 POL_rewrite_1935_constitution_desc:0 "Нынешняя конституция не соответствует потребностям современного польского государства, поэтому её необходимо переписать с учётом меняющегося политического климата в стране."
 POL_Crack_Soviet_Ciphers:0 "Взломать советские шифры"
 POL_Crack_Soviet_Ciphers_desc:0 "Взлом советского шифра спас Польшу во время польско-советской войны. Улучшение радиоразведки и мобильной пеленгации позволит нам повторить этот успех."
 POL_The_April_Constitution:0 "Апрельская конституция"
 POL_The_April_Constitution_desc:0 "Правительство должно завершить политические реформы, предусмотренные Апрельской конституцией 1935 года. "
 POL_The_Great_Peasant_Strike:0 "Великая крестьянская забастовка"
 POL_The_Great_Peasant_Strike_desc:0 "Правительство санации слишком долго игнорировало нужды сельских районов востока и проживающих там меньшинств. Планируется масштабная всеобщая забастовка, которая заставит власти обратить на них внимание."
 POL_Peasant_Strike:0 "Крестьянские забастовки"
 POL_Peasant_Strike_desc:0 "Правительство проигнорировало нужды сельских районов востока и проживающих там меньшинств, и теперь они начали всеобщую забастовку."
 POL_The_National_Radical_Camp:0 "Национально-радикальный лагерь"
 POL_The_National_Radical_Camp_desc:0 "Фалангисты во главе с Болеславом Пясецким стремятся создать католическое авторитарное государство."
 POL_The_Sanation_Right:0 "Правое крыло санации"
 POL_The_Sanation_Right_desc:0 "Лагерь национального объединения во главе с Эдвардом Рыдз-Смиглы стремится создать сильную национальную армию и подготовить страну к войне."
 POL_The_Castle:0 "«Замок»"
 POL_The_Castle_desc:0 "Нынешний президент Игнаций Мосцицкий воспринимается многими как объединяющая фигура и законный наследник идей Юзефа Пилсудского. Выступая против милитаризма, он стремится сосредоточиться на экономическом развитии Польши."
 POL_The_Sanation_Left:0 "Левое крыло санации"
 POL_The_Sanation_Left_desc:0 "Всеобщая организация общества во главе с Валерием Славеком добивается дальнейших политических реформ, чтобы объединить разрозненные фракции польского правительства."
 POL_Centrolew:0 "Центролев"
 POL_Centrolew_desc:0 "Пришло время отбросить разногласия между аграрной Польской народной партией и Польской социалистической партией и вновь сформировать левоцентристскую коалицию."
 POL_Defensive_Focus:0 "Упор на оборону"
 POL_Defensive_Focus_desc:0 "Мы не начнём следующую войну, но обязательно доведём её до конца. Необходимо принять дополнительные меры, чтобы защитить промышленное сердце страны с помощью естественных рубежей."
 POL_Polish_Paramilitarism:0 "Польский парамилитаризм"
 POL_Polish_Paramilitarism_desc:0 "Прошлые войны могли согнуть нас, но не сломили. Благодаря храбрости солдат и хитрости офицеров мы вновь поднимемся."
 POL_Polish_Revanchism:0 "Польский реваншизм"
 POL_Polish_Revanchism_desc:0 "Мало какие народы потеряли столько за столь короткое время. Если справедливость существует, мы вернём утраченное тем или иным способом."
 POL_The_Cult_Of_The_Marshal:0 "Культ маршала"
 POL_The_Cult_Of_The_Marshal_desc:0 "Благо нации должно стоять выше так называемых «истин». Подобно тому как мы сами куём свою судьбу, мы должны сами создавать факты."
 POL_Beyond_The_Proletariat:0 "За пределами пролетариата"
 POL_Beyond_The_Proletariat_desc:0 "Государство основано на двух принципах — служении нации и сотрудничестве общественных классов."
 POL_International_Falangism:0 "Международный фалангизм"
 POL_International_Falangism_desc:0 "Националистическая Испания — наш идеологический брат, который, как и мы, презирает Советский Союз."
 POL_All_Polish_Youth:0 "Всепольская молодёжь"
 POL_All_Polish_Youth_desc:0 "Вовлечение молодёжи в организации, пропагандирующие дисциплину и национальную идеологию, воспитает преданное поколение будущих призывников."
 POL_The_Student_Movement:0 "Студенческое движение"
 POL_The_Student_Movement_desc:0 "Вовлечение молодёжи в организации, поощряющие образование и национальную идеологию, воспитает преданное поколение будущих учёных."
 POL_Political_Commissars:0 "Политические комиссары"
 POL_Political_Commissars_desc:0 "Для сохранения контроля над армией будут назначены политические офицеры, следящие за соблюдением вооружёнными силами партийного курса."
 POL_Fund_The_Promethean_Program:0 "Финансировать программу «Прометей»"
 POL_Fund_The_Promethean_Program_desc:0 "Почти два десятилетия мы поддерживаем в Советском Союзе обширную сеть шпионажа, контрреволюционной деятельности и саботажа. После Великой депрессии финансирование сократилось до минимального уровня. Это необходимо исправить."
 POL_Expand_The_Promethean_Program:0 "Расширить программу «Прометей»"
 POL_Expand_The_Promethean_Program_desc:0 "Для защиты нашей страны необходимо действовать на опережение. Следует расширить обширную шпионскую сеть и подрывную деятельность на территории Советского Союза."
 POL_Ukranian_War_For_Independence:0 "Украинская война за независимость"
 POL_Ukranian_War_For_Independence_desc:0 "Пришло время спровоцировать восстание на Украине против советских угнетателей."
 POL_Budget_Reform:0 "Бюджетная реформа"
 POL_Budget_Reform_desc:0 "Чрезмерные военные расходы душат экономику. Вместо этого необходимо направить больше ресурсов на внутреннее развитие."
 POL_Civil_Service_Reform:0 "Реформа государственной службы"
 POL_Civil_Service_Reform_desc:0 "Многие государственные должности распределялись по знакомству и благодаря связям с военными и богатыми кругами. Необходима новая система, при которой назначения будут производиться по заслугам, а закон станет соблюдаться даже на высших уровнях власти."
 POL_the_Agrarian_Reform:0 "Земельная реформа"
 POL_the_Agrarian_Reform_desc:0 "Земельная реформа и перераспределение земли в сельских районах Польши давно назрели."
 POL_The_Front_Morges:0 "Фронт Морж"
 POL_The_Front_Morges_desc:0 "Юзеф Пилсудский провёл нашу страну через тяжёлые времена, но после его смерти мы должны вновь вернуться к демократической системе правления. Прекращение тайных репрессий против политических оппонентов станет первым шагом к восстановлению доверия к правительству."
 POL_Military_Aviation_Exports:0 "Экспорт военной авиации"
 POL_Draw_Closer_To_France:0 "Сблизиться с Францией"
 POL_Draw_Closer_To_France_desc:0 "Франция давно является маяком свободы и либерализма. Вполне естественно, что наши интересы начинают совпадать."
 POL_Military_Aviation_Exports_desc:0 "Наша гражданская и военная авиационная промышленность продаёт за рубеж значительное количество самолётов. Разрешив экспорт новейших моделей, мы сможем получить ценный опыт в области авиаконструирования."
 POL_Medium_Bomber_Development:0 "Разработка среднего бомбардировщика"
 POL_Medium_Bomber_Development_desc:0 "Развитие концепции точного бомбометания, адаптированной для большей дальности и выполнения задач поддержки."
 POL_Mielec_Aircraft_Factory:0 "Авиационный завод в Мелеце"
 POL_Mielec_Aircraft_Factory_desc:0 "Профинансировать строительство дополнительного современного авиационного завода в Мелеце."
 POL_Advanced_Pilot_Training_Program:0 "Расширенная программа подготовки пилотов"
 POL_Advanced_Pilot_Training_Program_desc:0 "Теория авиации не менее важна, чем технологии. Нашим пилотам ещё предстоит освоить новые тактические приёмы."
 POL_Import_Aircraft_Engines_From_Germany:0 "Импортировать авиационные двигатели из Германии"
 POL_Import_Aircraft_Engines_From_Germany_desc:0 "Разработка наших истребителей застопорилась из-за трудностей с производством более мощных двигателей. Изучение образцов соседних стран может значительно ускорить прогресс."
 POL_Next_Generation_Fighter:0 "Истребитель нового поколения"
 POL_Next_Generation_Fighter_desc:0 "Наши проекты истребителей всё сильнее устаревают. Отечественным прототипам требуется больше финансирования, чтобы они были готовы вовремя."
 POL_Light_Bomber_Focus:0 "Упор на лёгкие бомбардировщики"
 POL_Light_Bomber_Focus_desc:0 "Не следует недооценивать значение пикирующих бомбардировщиков для непосредственной авиационной поддержки."
 POL_Heavy_Fighter_Concept:0 "Концепция тяжёлого истребителя"
 POL_Heavy_Fighter_Concept_desc:0 "Если нам придётся перейти в наступление, потребуется новый тип истребителя, способный долго действовать в глубине вражеской территории."
 POL_Air_Modernisations_Programme:0 "Программа модернизации авиации"
 POL_Air_Modernisations_Programme_desc:0 "В области воздушной стратегии и тактики ещё многое предстоит сделать."
 POL_Naval_Bomber_Experiments:0 "Эксперименты с морскими бомбардировщиками"
 POL_Naval_Bomber_Experiments_desc:0 "Господство в воздухе столь же важно над морем, как и над сушей. Создание специализированных самолётов для морской войны поможет достичь этой цели."
 POL_Rocket_Development:0 "Разработка ракет"
 POL_Rocket_Development_desc:0 "Скорость — основа всех остальных характеристик авиации. Ракетные и реактивные двигатели теоретически позволят превзойти все прежние пределы."
 POL_Atomic_Physics_Institute:0 "Институт атомной физики"
 POL_Atomic_Physics_Institute_desc:0 "Мы не должны упустить шанс первыми открыть способ обуздать первозданную энергию ядерного деления."
 POL_Lithuanian_Constitutional_Crisis:0 "Литовский конституционный кризис"
 POL_Lithuanian_Constitutional_Crisis_desc:0 "Вильно — по праву исторический польский город. Литовская конституция объявляет его своей столицей. Мы должны заставить литовцев отказаться от этих притязаний."
 POL_National_Defense_Fund:0 "Фонд национальной обороны"
 POL_National_Defense_Fund_desc:0 "И граждане, и государство должны участвовать в финансировании растущей армии, чтобы подготовиться к опасностям грядущих лет."
 POL_Standardisation_Of_Equipment:0 "Стандартизация снаряжения"
 POL_Standardisation_Of_Equipment_desc:0 "Стандартизируя снаряжение наших солдат, мы закладываем основу современной системы снабжения."
 POL_Modernising_The_Cavalry:0 "Модернизация кавалерии"
 POL_Modernising_The_Cavalry_desc:0 "Хотя кавалерия всё ещё играет важную роль, ей нужны новые металлические кони, чтобы оставаться эффективной на современном поле боя."
 POL_Wz_35_Anti_Tank_Rifle:0 "Противотанковое ружьё Wz. 35"
 POL_Wz_35_Anti_Tank_Rifle_desc:0 "Не всякое противотанковое оружие поражает цель пробитием брони. Боеприпасы со стальной оболочкой и вольфрамовым сердечником могут раскалываться при ударе и убивать экипаж осколками, отколовшимися с внутренней стороны брони."
 POL_Study_Foreign_Tanks:0 "Изучить иностранные танки"
 POL_Study_Foreign_Tanks_desc:0 "Эти «танки» станут центральным элементом современных вооружённых конфликтов, и мы обязаны любой ценой не отставать от соседей."
 POL_Cruiser_Tank_Experiments:0 "Эксперименты с крейсерскими танками"
 POL_Cruiser_Tank_Experiments_desc:0 "Освоив основы танкостроения, мы готовы начать прокладывать собственный путь в сложной области механизированной техники."
 POL_Plan_W:0 "Мобилизационный план «W»"
 POL_Plan_W_desc:0 "Когда начнётся война, у нас должен быть надёжный план организации и снабжения мобилизуемых войск."
 POL_Romanian_Bridgehead_Strategy:0 "Стратегия румынского плацдарма"
 POL_Romanian_Bridgehead_Strategy_desc:0 "Если ход войны сложится не в нашу пользу, у нас должны быть планы эффективной перегруппировки и ответного удара совместно с друзьями и союзниками."
 POL_Silesia_Fortified_Area:0 "Силезский укреплённый район"
 POL_Silesia_Fortified_Area_desc:0 "Дополнительные укрепления на юге усилят нашу оборону."
 POL_Sarny_Fortified_Area:0 "Сарненский укреплённый район"
 POL_Sarny_Fortified_Area_desc:0 "Необходимо принять меры для защиты румынского плацдарма."
 POL_Pressure_Czechoslovakia:0 "Оказать давление на Чехословакию"
 POL_Pressure_Czechoslovakia_desc:0 "Чехословакия удерживает множество законных польских земель и мешает созданию общей границы с Венгрией. Этот вопрос придётся решить силой давления."
 POL_Invite_Hungary:0 "Пригласить Венгрию"
 POL_Invite_Hungary_desc:0 "Со времён Средневековья польский и венгерский народы связывают тесные узы. Пришло время вновь сблизиться."
 POL_Invite_Czechoslovakia:0 "Пригласить Чехословакию"
 POL_Invite_Czechoslovakia_desc:0 "Старые обиды должны остаться в прошлом. Общая вера в демократию даёт веские основания для сотрудничества."
 POL_Third_Europe:0 "Третья Европа"
 POL_Third_Europe_desc:0 "Необходимо создать новый дипломатический блок, который уравновесит силы в Европе и обеспечит будущее Великой Польши."
 POL_the_neighbours_protection:0 "Защита соседей"
 POL_the_neighbours_protection_desc:0 "Будучи доминирующей политической и дипломатической силой в Восточной Европе, мы будем служить защитой наших соседей!"
 POL_The_Intermarium:0 "Междуморье"
 POL_The_Intermarium_desc:0 "Мы не одиноки в своей борьбе. Если нам удастся собрать достаточно союзников, мы сможем пережить надвигающуюся бурю."
 POL_Invite_Yugoslavia:0 "Пригласить Югославию"
 POL_Invite_Yugoslavia_desc:0 "Наша мечта о едином фронте между морями может распространиться и до Адриатики."
 POL_Invite_Romania:0 "Пригласить Румынию"
 POL_Invite_Romania_desc:0 "Интересы Польши и Румынии давно совпадают. Пришло время укрепить сотрудничество."
 POL_The_Baltic_Alliance:0 "Балтийский альянс"
 POL_The_Baltic_Alliance_desc:0 "Друзей никогда не бывает слишком много."
 POL_Treaty_With_Lithuania:0 "Договор с Литвой"
 POL_Treaty_With_Lithuania_desc:0 "Старые обиды должны остаться в прошлом. В грядущие тёмные времена нам понадобится каждый друг."
 POL_Collective_Industry:0 "Коллективная промышленность"
 POL_Collective_Industry_desc:0 "Дух коллективизации должен проникнуть и на фабрики."
 POL_Request_Soviet_Guarantee:0 "Запросить советские гарантии"
 POL_Request_Soviet_Guarantee_desc:0 "Пришло время добиваться сближения с Советским Союзом."
 POL_Polish_Peoples_Army:0 "Польская народная армия"
 POL_Polish_Peoples_Army_desc:0 "Необходимо организовать новую передовую армию народа для распространения и защиты революции."
 POL_Reaffirm_Ties_With_Romania:0 "Подтвердить связи с Румынией"
 POL_Reaffirm_Ties_With_Romania_desc:0 "Подтверждение дружбы и оборонительного договора с Румынией необходимо для нашей дальнейшей безопасности."
 POL_Wartime_Industry:0 "Промышленность военного времени"
 POL_Wartime_Industry_desc:0 "Поскольку значительная часть страны мобилизована для войны, настало время провести экономические и общественные преобразования в её поддержку."
 POL_Create_Units_KOP:0 "Получить три элитных подразделения §HКорпуса охраны границы§! вдоль советской границы."
 POL_Create_Units_KOP_desc:0 "Получить три элитных подразделения §HКорпуса охраны границы§! вдоль советской границы."
 POL_Create_Units_Academic_Legion:0 "Получить четыре резервных подразделения §HАкадемических легионов§!. "
 POL_Create_Units_Academic_Legion2:0 "Получить ещё десять резервных подразделений §HАкадемических легионов§!. "
 POL_Flexible_AT:0 "Открывает §Lлёгкое противотанковое ружьё§!\n§HКавалерия:\n    Атака по бронетехнике: §G+25%§!\n    Бронепробиваемость: §G+100%§!"
 POL_Flexible_AT_effect:0 "§LЛёгкое противотанковое ружьё§!\n\n§HКавалерия:\n    Атака по бронетехнике: §G+25%§!\n    Бронепробиваемость: §G+100%§!"
 POL_Flexible_AT_desc:0 "В межвоенный период польская армия разработала лёгкое и удобное противотанковое ружьё, которому не требовалось пробивать броню для уничтожения танка. Мягкая внешняя стальная оболочка и вольфрамовый сердечник вызывали откалывание металла с внутренней стороны брони, что могло убить экипаж."
 POL_Romania_Invite_Tooltip:0 "§HРумыния получит приглашение в наш альянс.§!"
 POL_Romania_Invite_Tooltip_desc:0 "§HРумыния получит приглашение в наш альянс.§!"
 POL_Anti_Polish_Sentiment:0 "Антипольские настроения"
 POL_Reaffirm_Ties_With_Romania_Fascist:0 "Поскольку мы придерживаемся §Hфашизма§!, можно воспользоваться случаем и вместо этого §Hпотребовать Буковину§!."
 POL_Demanded_Bucovina:0 "Потребовали Буковину"
 POL_League_Opposition:0 "Противодействие Лиги Наций"
 POL_League_Support:0 "Поддержка Лиги Наций"
 Polish_German_Trade_Agreement_name:0 "Польско-германское торговое соглашение"
 Polish_German_Trade_Agreement_desc:0 "Польско-германское торговое соглашение"
 POL_Back_Down_Lithuanian_Constitutional_Crisis:0 "Польша отступила в ходе Литовского конституционного кризиса"
 POL_Lithuanian_Constitutional_Crisis_Territory_Claims:0 "Польша выдвинула требования в ходе Литовского конституционного кризиса"
 POL_Modlin_Fortress:0 "Крепость Модлин"
 POL_Modlin_Fortress_desc:0 "Модернизация старой крепости Модлин обеспечит надёжную защиту Варшавы и близлежащих речных переправ."
 POL_Plan_Z:0 "План «Z»"
 POL_Plan_Z_desc:0 "Необходим стратегический план на случай войны с Германией, Советским Союзом или даже с обоими одновременно!"
 POL_Ribbentrop_Beck_Pact:0 "Пакт Риббентропа — Бека"
 POL_Ribbentrop_Beck_Pact_desc:0 "Сотрудничество с Германией — палка о двух концах. Мы можем получить её защиту, но ценой нашей автономии."
 POL_Ribbentrop_Beck_tooltip:0 "§HГермания§!: §Hаннексирует Данциг.§!\n§RПольша станет§! §Hмарионеткой§! §RГермании§!\n"
 POL_Ribbentrop_Beck_tooltip_TFV:0 "§HГермания§!: §Hаннексирует Данциг.§!\n§RПольша станет§! §Hдоминионом§! §RГермании§!\n"
 POL_Ribbentrop_Beck_tooltip_DOD:0 "§HГермания§!: §Hаннексирует Данциг.§!\n§RПольша станет§! §Hсателлитом§! §RГермании§!\n"
 POL_Pomerania_For_Lithuania:0 "Померания в обмен на Литву"
 POL_Pomerania_For_Lithuania_desc:0 "Вопрос Польского коридора можно решить, сохранив наш выход к морю."
 POL_Independent_Parachute_Brigades:0 "Независимые парашютные бригады"
 POL_Independent_Parachute_Brigades_desc:0 "Парашютные войска — перспективное направление воздушно-десантной войны, которое следует развивать."
 POL_Strengthen_Ties_With_Japan:0 "Укрепить связи с Японией §HНе завершено§!"
 POL_Strengthen_Ties_With_Japan_desc:0 "Япония — потенциальный союзник в борьбе с советской угрозой. §HНе завершено§!"
 POL_Cossack_Revolt:0 "Казачье восстание §HНе завершено§!"
 POL_Cossack_Revolt_desc:0 "Помимо Западной Украины, диссиденты и недовольные имеются также в Крыму и бассейне Дона. §HЧастичная функциональность.§!"
 POL_Caucasus_Revolt:0 "Кавказское восстание §RОтключено§!"
 POL_Caucasus_Revolt_desc:0 "Наши агенты программы «Прометей» давно действуют на Кавказе, финансируя повстанцев за рубежом и близких по духу изгнанников в наших границах. §RПоявится в одном из будущих обновлений!§!"
 POL_Independent_Polish_Tank_Corps:0 "Независимый польский танковый корпус"
 POL_Independent_Polish_Tank_Corps_desc:0 "Преимущества манёвренной войны давно были осознаны благодаря урокам польско-советской войны. Пришло время воплотить эти планы в жизнь, создав независимые танковые армии."
 POL_Preemptive_Strike:0 "Превентивный удар"
 POL_Preemptive_Strike_desc:0 "Нельзя игнорировать военное усиление Германии. Ради безопасности Европы мы должны вместе с западными союзниками нанести удар первыми, пока не стало слишком поздно."
 POL_Slovakian_Independence_Movement:0 "Движение за независимость Словакии"
 POL_Slovakian_Independence_Movement_desc:0 "Консервативный католический словацкий народ может стать оплотом против красной угрозы."
 POL_Finnish_Guarantee:0 "Гарантии Финляндии"
 POL_Finnish_Guarantee_desc:0 "Гарантии Финляндии помогут остановить проникновение советского влияния в Европу."
 POL_additional_research_slot3:0 "Дополнительная ячейка для исследований III"
 POL_additional_research_slot3_desc:0 "Наши усилия по развитию превосходства студентов и учёных открыли новые возможности для исследований и разработок."
 POL_Propaganda_Corps:0 "Корпус пропаганды"
 POL_Propaganda_Corps_desc:0 "Непоколебимая вера в собственное превосходство позволит нам одолеть любого врага."
 POL_Romanian_Intervention:0 "Интервенция в Румынию"
 POL_Romanian_Intervention_desc:0 "Нельзя допустить, чтобы Румыния попала под коммунистическое и советское влияние. Она должна подчинить свою внешнюю политику нашим указаниям."
 POL_Romanian_Intervention_tooltip:0 "§RРумыния станет§! §Hмарионеткой§! §RПольши§!\n"
 POL_Romanian_Intervention_tooltip_TFV:0 "§RРумыния станет§! §Hдоминионом§! §RПольши§!\n"
 POL_Romanian_Intervention_tooltip_DOD:0 "§RРумыния станет§! §Hсателлитом§! §RПольши§!\n"
 POL_Joint_Military_Cooperation:0 "Совместное военное сотрудничество"
 POL_Joint_Military_Cooperation_desc:0 "Взаимное доверие и торговля между нашими странами могут принести пользу военному производству и развитию."
 POL_Stanislaw_Sosabowski_tooltip:0 "получать прибыль §HСтанислав Сосабовски§! как уровень §G4§! Генерал с §HКоммандос§! Черта."
 POL_Armour_tooltip:0 "Получить шаблон §Hбронекавалерийской бригады§!.\n"
 POL_Stanislaw_Maczek_tooltip:0 "получать прибыль §HСтанислав Мачек§! как уровень §G5§! Генерал с §HЛидер танков§! и §Hгорец§! черты.\n"
 Berlinka_tooltip:0 "Если они согласятся, мы получим §H1§! бонус §G50%§! к исследованию §Hстроительства§! и §Hполную инфраструктуру§! в §HПомерании§!.\nЕсли они откажутся, мы получим §H1§! бонус §G50%§! к исследованию §Hстроительства§! и §H1 уровень инфраструктуры§! в §HВаршаве§!, §HПлоцке§! и §HПомерании§!."
 Rydz_Share_tooltip:0 "Игнаций Мосцицкий остаётся лидером Польши.\nЭдвард Рыдз-Смиглы становится главнокомандующим армией."
 Rydz_Dictator_tooltip:0 "Эдвард Рыдз-Смиглы становится лидером Польши и главнокомандующим армией."
 POL_Preemptive_tooltip:0 "§RЕсли Франция согласится, Польша и Франция объявят войну Германии.§!"
 POL_Preemptive_tooltip2:0 "§RМы объявим войну Германии.§!"
 POL_Promethean_Sabotage_tooltip:0 "§RКаждые несколько месяцев мы сможем санкционировать§! §Hоперации промышленного саботажа§! §Rв§! §HСоветском Союзе.§!"
 POL_demanded_zaolzie:0 "Потребовали Заользье и Словакию"
 POL_Land_Mine_Detectors:0 "Миноискатели"
 POL_Land_Mine_Detectors_desc:0 "Достижения в электронике могут позволить создать переносное устройство для обнаружения металлических объектов под землёй — будь то артиллерийские снаряды или даже вражеские мины."
 POL_High_Frequency_Radio_Detection:0 "Высокочастотное радиообнаружение"
 POL_High_Frequency_Radio_Detection_desc:0 "Наши учёные считают, что можно создать специализированную разновидность радара для обнаружения вражеских подводных лодок под поверхностью океана."
 POL_artillery_equipment_1:0 "75-мм пушка wz. 1897"
 POL_artillery_equipment_1_short:0 "75-мм wz. 1897"
 POL_Polish_Cipher_Bureau_no_lar:0 "Расширить Польское бюро шифров"
 POL_Polish_Cipher_Bureau_no_lar_desc:0 "Военная разведка доказала свою ценность в польско-советской войне. Расширение возможностей наших спецслужб позволит сохранить преимущество над противниками."
 POL_The_Cyclometer_no_lar:0 "Циклометр"
 POL_The_Cyclometer_no_lar_desc:0 "Благодаря этому изобретению немецкие шифры станут для нас столь же понятны, как обычный текст. От нас не останется никаких секретов."
 POL_The_Bombe_no_lar:0 "«Бомба»"
 POL_The_Bombe_no_lar_desc:0 "Криптологическая «Бомба» является развитием циклометра и позволяет расшифровывать всё более совершенные версии немецкой «Энигмы»."
 POL_figurehead:0 "Номинальный лидер"
 POL_The_Endecja_Movement:0 "Движение эндеции"
 POL_The_Endecja_Movement_desc:0 "Движение национальной демократии во главе с Романом Дмовским представляет собой ультраконсервативный националистический фронт, стремящийся объединить всех этнических поляков в одном государстве, развивать человеческий потенциал польского народа и заставить различные меньшинства Польши принять польские обычаи, язык и традиции."
 POL_Align_With_Italy:0 "Сблизиться с Италией"
 POL_Align_With_Italy_desc:0 "В итальянской модели государственного устройства есть черты, которыми мы восхищаемся. Следует стремиться к более тесному сотрудничеству."
 free_mason:0 "Масон"
 polish_nationalist_tooltip:0 "--------------\n§LЭтот человек считает иностранное влияние и присутствие меньшинств угрозой культуре и наследию нации.§!"
 butadiene_processing:0 "Переработка бутадиена"
 POL_Synthetic_Rubber_tooltip:0 "Позволяет строить §Hзаводы синтетического каучука§!."
 POL_chemist:0 "Химик"
 POLITICS_IGNACY_MOSCICKI_DESC:0 "Игнаций Мосцицкий — основатель Химического исследовательского института в Варшаве и главный сторонник развития химической промышленности Польши. До вступления в должность президента он также был профессором электрохимии и получил несколько патентов в этой области."
 modifier_production_speed_synthetic_rubber_plant_factor:0 "Скорость строительства §Hзаводов каучука§!"
 POL_steel_and_armaments:0 "Конгломерат стали и вооружений     "
 POL_HSW:0 "HSW"
 POL_Debica_SA:0 "Debica SA"
 POL_Synthetic_Rubber_Tires:0 "Синтетические химикаты и шины"
 POL_State_Owned_Railways:0 "Государственные железные дороги"
 army_chief_fanaticism:0 "Армейский фанатизм\n(Эксперт)"
 POL_army_communications:0 "Связь"
 POL_Public_Affairs:0 "Связи с общественностью"
 POL_Invest_In_The_Middle_Class:0 "Инвестировать в средний класс"
 POL_Invest_In_The_Middle_Class_desc:0 "Среди польского среднего класса недостаточно польскоязычных католиков. Государственная политика должна способствовать расширению польского среднего класса и покупке исключительно польских товаров."
 POL_Mend_Ties_With_Czechoslovakia:0 "Наладить отношения с Чехословакией"
 POL_Mend_Ties_With_Czechoslovakia_desc:0 "Западнославянские народы должны быть едины, а не разобщены. Несмотря на наши разногласия, они незначительны по сравнению с куда большей угрозой германского влияния."
 POL_Silesia_Or_War:0 "Силезия или война"
 POL_Silesia_Or_War_desc:0 "Верхнюю Силезию отняли у нас посредством обмана и международного заговора. В регионе необходимо провести второй референдум на наших условиях."
 POL_Modernize_The_Starachowice_Works:0 "Модернизировать заводы в Стараховице"
 POL_Modernize_The_Starachowice_Works_desc:0 "Заводы в Стараховице являются важной частью нашей военной промышленности и с момента образования Второй Речи Посполитой создают новые прототипы артиллерии. Инвестиционная программа модернизации предприятия поможет ускорить развитие армии."
 POL_Cegielski_Artillery_Factory:0 "Артиллерийский завод Цегельского"
 POL_Cegielski_Artillery_Factory_desc:0 "Гражданских производителей следует поощрять вкладывать средства в военное производство. Мы предоставим заём для строительства нового современного артиллерийского завода в Жешуве."
 POL_Seek_Accommodation_With_The_USSR:0 "Искать соглашения с СССР"
 POL_Seek_Accommodation_With_The_USSR_desc:0 "Нравится нам это или нет, сближение с Советским Союзом — необходимая жертва ради выживания нашей страны."
 POL_Beck_Molotov_Pact:0 "Пакт Бека — Молотова"
 POL_Beck_Molotov_Pact_desc:0 "Сотрудничество с СССР — палка о двух концах. Мы можем получить его защиту, но ценой нашей автономии."
 POL_Starachowice_Works:0 "Заводы в Стараховице"
 POL_artillery_manufacturer1:0 "Артиллерийские и металлургические заводы"
 POL_H_Cegielski:0 "H. Cegielski"
 POL_artillery_manufacturer2:0 "Локомотивы и артиллерия"
 POL_Nationalist_Rhetoric:0 "Националистическая риторика"
 POL_Nationalist_Rhetoric_desc:0 "Ради сильного государства необходимо идти на жертвы. Населению следует напоминать о последствиях падения нашей страны."
 POL_The_Great_Depression2:0 "Великая депрессия"
 POL_The_Great_Depression2_desc:0 "Польша особенно сильно пострадала от Великой депрессии. В последние годы резко сократились инвестиции, промышленное производство, торговля и уровень жизни."
 POL_Rural_Unemployment2:0 "Безработица в сельской местности"
 POL_Rural_Unemployment2_desc:0 "Восточные регионы Польши развиты значительно хуже западных. Безработица широко распространена по всей стране, а в сельских районах востока она особенно тяжела."
 POL_Attract_Foreign_Investment_tooltip:0 "\nУсловие обхода фокуса: §HИнтернационализм§!"
 POL_chief_staffer:0 "Начальник штаба"
 political_pragmatist:0 "Политический прагматик"
 Bomber_Emphasis:0 "Упор на тяжёлые бомбардировщики"
 POL_ludomil_rayski_desc:0 "Твёрдо убеждён, что будущее принадлежит крупным бомбардировщикам, а одномоторные перехватчики устарели. "
 Interceptor_Emphasis:0 "Упор на перехватчики"
 POL_army_logistics:0 "Армейская логистика"
 introspective:0 "Склонный к самоанализу"
 POL_eye:0 "§RОка (река)§!"
 army_chief_offensive_prankster:0 "Кавалерийское наступление\n(Дипломат)"
 Autarkist:0 "Автаркист"
 POL_Ursus:0 "Ursus"
 POL_Tractor_Manufacturer:0 "Производитель тракторов"
 POL_paramilitary:0 "Организатор сопротивления"
 POL_Prepare_For_The_upcoming_conflict:0 "Подготовиться к грядущим конфликтам"
 POL_Prepare_For_The_upcoming_conflict_desc:0 "Покойный Юзеф Пилсудский предсказывал, что Европу ждёт новая война, но она может начаться раньше, чем мы думаем."
 POL_Re_Expand_The_Military:0 "Вновь расширить армию"
 POL_Re_Expand_The_Military_desc:0 "Со времён Великой депрессии численность нашей армии значительно сократилась. Пришло время вновь её расширить."
 POL_Kasprzycki_Gamelin_Convention:0 "Конвенция Каспшицкого — Гамелена"
 POL_Kasprzycki_Gamelin_Convention_desc:0 "Учитывая недавние агрессивные действия наших соседей, заключение полноценного военного союза с Францией будет разумным шагом."
 POL_Ukrainian_Volunteer_Brigades:0 "Украинские добровольческие бригады"
 POL_Ukrainian_Volunteer_Brigades_desc:0 "Примирение с лидерами украинского меньшинства в наших границах — первый шаг к настоящему воплощению мечты Юзефа Пилсудского о многонациональной федерации."
 POL_Draw_Closer_To_The_USSR:0 "Сблизиться с СССР"
 POL_Seek_Autonomy:0 "Добиваться автономии"
 POL_License_Soviet_Equipment:0 "Лицензировать советское вооружение"
 POL_State_Capitalism:0 "Государственный капитализм"
 POL_State_Capitalism_desc:0 "Коммунизм в том виде, в каком он существует в Советском Союзе, — отвратительная система. Малое предпринимательство может сосуществовать с централизованной плановой экономикой."
 POL_Military_Rearmament:0 "Военное перевооружение"
 POL_Next_War_Focus:0 "Упор на вооружение"
 POL_Polish_Peoples_Army_focus:0 "Реорганизованная армия"
 POL_Make_Amends_With_Ukraine:0 "Примириться с Украиной"
 POL_Make_Amends_With_Ukraine_desc:0 "Пилсудский обещал украинским националистам собственное государство, однако обстоятельства привели к нарушению этого обещания. Необходимо найти новый компромисс."
 state_capitalism_idea:0 "Государственный капитализм"
 left_wing_nationalist:0 "Левый националист"
 governor_general:0 "Генерал-губернатор"
 POL_Minsk_Or_War:0 "Минск или война"
 POL_Minsk_Or_War_desc:0 "Минск по праву должен был принадлежать нам, но ошибки за столом переговоров после польско-советской войны привели к тому, что город ускользнул из наших рук."
 LIT_crisis_tooltip:0 "Может привести к улучшению отношений с Литвой и открыть возможность её вступления в наш альянс."
 LIT_crisis_resolved_tooltip:0 "Найден компромисс в Литовском конституционном кризисе"
 UKR_army_tooltip:0 "С каждой захваченной национальной украинской территорией армия Директории будет расти."
 UKR_militarism_focus:0 "Украинский парамилитаризм"
 POL_Japanese_Guarantee:0 "Японские гарантии против советской агрессии"
 POL_Draw_Closer_To_The_USSR_desc:0 "Тесные связи с Советским Союзом необходимы для борьбы с нашими врагами на западе."
 POL_Seek_Autonomy_desc:0 "Мы должны проводить сбалансированный курс между дружбой с СССР и собственными интересами."
 POL_License_Soviet_Equipment_desc:0 "Тесная интеграция с советской армией — следующий логичный шаг в снабжении наших собственных войск."
 POL_Found_Our_Own_Faction:0 "Создать собственный альянс"
 POL_Found_Our_Own_Faction_desc:0 "Для нашей безопасности необходимо обратиться к международному сообществу."
 POL_Renew_The_Polish_Soviet_Nonaggression_Pact:0 "Продлить советский пакт о ненападении"
 POL_Renew_The_Polish_Soviet_Nonaggression_Pact_desc:0 "Дальнейшая нормализация отношений с Советским Союзом необходима, чтобы выиграть мирное время для процветания."
 POL_The_Leviathan_Group:0 "Группа «Левиафан»"
 POL_The_Leviathan_Group_desc:0 "Государственное планирование экономики усугубило кризис в стране. Руководители частного бизнеса должны получить голос в правительстве, чтобы страна смогла двигаться вперёд."
 POL_Invite_The_Political_Opposition:0 "Пригласить политическую оппозицию"
 POL_Invite_The_Political_Opposition_desc:0 "Изначальная структура ББСП была создана, чтобы талантливые представители различных партий могли служить в правительстве ради общего блага, несмотря на разногласия. Новая Всеобщая организация общества станет более открытой и лучше использует их способности."
 POL_Renew_The_Polish_German_Nonaggression_Pact:0 "Продлить германский пакт о ненападении"
 POL_Renew_The_Polish_German_Nonaggression_Pact_desc:0 "Продление пакта о ненападении с Германией даст нам время на перевооружение и, возможно, убережёт от её агрессии."
 POL_Allied_Financial_Loans:0 "Финансовые займы союзников"
 POL_Allied_Financial_Loans_desc:0 "Учитывая нынешнее состояние финансов, нам придётся просить займы, чтобы продолжить мобилизацию армии."
 POL_Foreign_Financial_Loans:0 "Иностранные финансовые займы"
 POL_Consolidate_The_Nationalist_Wing:0 "Объединить националистическое крыло"
 POL_Consolidate_The_Nationalist_Wing_desc:0 "Привлечение представителей разрозненных националистических фракций укрепит нашу опору и поможет заручиться поддержкой войны."
 POL_Polish_Czechoslovakian_Alliance:0 "Польско-чехословацкий военный союз"
 POL_Polish_Czechoslovakian_Alliance_desc:0 "Враг моего врага — мой друг. Военный союз между нашими странами позволит быстро нанести удар по германской угрозе."
 POL_Invest_In_Fiat:0 "Инвестировать в Fiat"
 POL_Invest_In_Fiat_desc:0 "Итальянское правительство проявило значительный интерес к нашим методам производства синтетического каучука. Совместная инвестиционная программа может оказаться выгодной для обеих сторон."
 POL_Break_Away_From_Germany:0 "Порвать с Германией"
 POL_Break_Away_From_Germany_desc:0 "Пришло время отдалиться от тонущего корабля, которым стала Германия."
 POL_Maritime_and_Colonial_League:0 "Морская и колониальная лига"
 POL_Maritime_and_Colonial_League_desc:0 "Сильный флот и многочисленные колонии важны для экономической безопасности государства. Следует поощрять граждан жертвовать время и деньги на воплощение обеих идей."
 POL_Subsidized_Universal_Education:0 "Субсидируемое всеобщее образование"
 POL_Subsidized_Universal_Education_desc:0 "Высшее образование должно перестать быть роскошью для высших классов и стать правом всех граждан."
 POL_Offer_to_Purchase_Madagascar:0 "Предложить купить Мадагаскар"
 POL_Offer_to_Purchase_Madagascar_desc:0 "Мы уже некоторое время рассматриваем возможность покупки Мадагаскара в качестве сырьевой и исправительной колонии."
 POL_Demand_Former_German_Colonies:0 "Потребовать бывшие германские колонии"
 POL_Demand_Former_German_Colonies_desc:0 "Вторая Речь Посполитая была частично создана на территориях бывшей Германской империи. Следует также доказать Лиге Наций, что мы заслуживаем долю её бывших колоний."
 POL_Offer_Liberia_Protection:0 "Предложить Либерии защиту"
 POL_Offer_Liberia_Protection_desc:0 "Благодаря прежним колониальным инициативам Либерия предоставила нам право отправлять поселенцев и присвоила торговый статус наиболее благоприятствуемой нации. Следует воспользоваться этим, укрепить связи и предложить защиту в обмен на дальнейшую экономическую помощь."
 silent_workhorse_old_guard:0 "Незаметная рабочая лошадка\nСтарая гвардия"
 POL_Commercial_Interests:0 "Коммерческие интересы"
