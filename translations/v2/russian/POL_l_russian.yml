 POL_experimental_aircraft_manufacturer:0 "Экспериментальные авиационные мастерские"
 POL_Factory_Conversion_Tooltip:0 "§GНапоминание:§! Для переоборудования заводов старые модели в §Hзапасах§! должны быть отмечены как «§Rснятые с вооружения§!».\n "
 POL_Reaffirm_Ties_With_Romania_Tooltip:0 "Мы сможем предложить одно из нескольких дипломатических или торговых соглашений. Если они согласятся, мы также заключим §Hпакт о ненападении§!."
 POL_Draw_Closer_To_France_Tooltip:0 "Мы сможем предложить одно из нескольких торговых соглашений."
