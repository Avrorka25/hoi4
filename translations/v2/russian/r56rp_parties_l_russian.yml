l_russian:
 maoismsid:0 "маоизм"
 maoismsid_desc:0 "С отсутствием городского пролетариата и фабричных рабочих, чтобы осуществить революцию, маоизм фокусируется вместо этого на власти крестьянства, в значительной степени дисконтированного в других коммунистических ответвлениях. Простота крестьянства почитается над интеллектуальными элитами, что приводит к неблагоприятным условиям для исследований."
 JAP_japanese_socialism:0 "Японский социализм"
 JAP_japanese_socialism_desc:0 "При Дзётаро Каваками японский крестьянский социализм охватывает смесь социал-демократии и аграрного марксизма, выступая за перераспределение земли и коллективизированное земледелие, одновременно позволяя демократическое управление. В отличие от ортодоксального коммунизма, он поддерживает сохранение Зайбацу, но обязывает сильные профсоюзы работников обеспечивать справедливую заработную плату и условия труда. Этот баланс между государственным контролем и экономическим прагматизмом способствует уникальной социалистической модели, направленной на повышение сельской и промышленной рабочей силы Японии при сохранении национальной стабильности."
