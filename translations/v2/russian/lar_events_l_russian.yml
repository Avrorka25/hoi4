l_russian:
 LAR_concessions_stresa_front_tt:0 "От вас будут ожидать выполнения обязательств и вступления в Стрезский фронт против Германии. Если вы откажетесь, территориальные уступки предоставлены не будут."
 lar_concessions_italy_tt:0 "Италия с большей вероятностью согласится на совместные действия против Германии"
 lar_france_stresa_front_italy_agreed:0 "Италия согласилась вступить в Стрезский фронт в обмен на территориальные уступки"
 france_continue_the_fight_tt:0 "Нам больше не дадут возможности капитулировать с честью. Если мы проиграем, вся метрополия Франции будет оккупирована."
 lar_congress_of_paris.1.t:0 "Парижский конгресс"
 lar_congress_of_paris.1.desc:1 "По приглашению [This.GetLeader] лидеры [ITA.GetLeader], [SPA.GetLeader] и [POR.GetLeader] прибыли в Париж, чтобы обсудить договор о колониальных сферах влияния в Африке. Поскольку Франция и Италия являются главными державами, заинтересованными в расширении своих империй, придётся пойти на уступки государствам [SPA.GetNameDef] и [POR.GetNameDef], чтобы убедить их вступить в союз и начать войну ради достижения этих целей.\n\n[POR.GetLeader], скорее всего, попытается заручиться поддержкой давнего плана объединения Анголы и Мозамбика, а [SPA.GetLeader] придётся склонить к соглашению передачей части французских территорий в Северной Африке."
 lar_congress_of_paris.1.a:1 "Мы получим компенсацию в другом месте."
 lar_congress_of_paris.2.t:0 "Перекройка карты Африки"
 lar_congress_of_paris.2.desc:1 "В первом раунде переговоров французская делегация предложила просто разделить континент пополам, предоставив нам притязания на Египет, Судан и земли далее на юг вплоть до Кении. Хотя предложение лишено подробностей — и в основном касается территорий, которыми ни одна из сторон фактически не владеет, — оно обещает французскую поддержку в завоевании обширной африканской империи."
 lar_congress_of_paris.2.a:1 "Мечта об Итальянской империи в Африке стоит небольшого риска."
 lar_congress_of_paris.2.b:1 "У нас нет причин это поддерживать."
 lar_congress_of_paris.3.t:0 "[From.GetNameDefCap] соглашается"
 lar_congress_of_paris.3.desc:1 "Делегация государства [From.GetNameDef] в принципе согласилась с предложенными территориальными изменениями. Хотя ещё предстоит урегулировать несколько мелких деталей, а точное расположение новой границы остаётся предметом споров, наши дипломаты не ожидают серьёзных проблем, способных сорвать соглашение."
 lar_congress_of_paris.3.a:1 "Отличная работа."
 lar_congress_of_paris.4.t:0 "[From.GetNameDefCap] отказывается"
 lar_congress_of_paris.4.desc:1 "Делегация государства [From.GetNameDef] объявила переговоры завершёнными. Сославшись на принципиальные разногласия по поводу предложенных изменений, её представители покинули Париж и вернулись в [From.GetNameDef].\n\nПосле их поспешного отъезда посол государства [From.GetAdjective] заявил, что правительство [From.GetAdjective] больше не считает себя связанным с нами какими-либо договорами о взаимной помощи или союзе."
 lar_congress_of_paris.4.a:1 "Тем больше достанется нам."
 lar_congress_of_paris.5.desc:1 "Пока остальные делегации в Париже спорили о территориях, которыми ни одна из их стран фактически не владеет, наши дипломаты продвигали более достижимую цель. Французское правительство благосклонно отнеслось к предложению уступить нам Марокко в обмен на обещание поддержать его в будущей войне. Это соединило бы наши владения в Северной и Западной Африке."
 lar_congress_of_paris.5.a:1 "Если они готовы заплатить цену, мы готовы выполнить свою часть."
 lar_congress_of_paris.5.b:1 "Никакая пустыня не стоит даже одной капли испанской крови."
 lar_congress_of_paris.6.desc:1 "Хотя недостаток реальной силы не позволил нашим дипломатам существенно влиять на переговоры в Париже, нам всё же предложили поддержку в захвате территорий между Анголой и Мозамбиком, а также возможность претендовать на значительную часть Южной Африки. Похоже, передача этих земель нам позволяет двум крупным державам избежать конфликта, который мог бы сорвать весь договор.\n\nОднако согласие обяжет нас сражаться на стороне Франции и Италии в их стремлении расширить свои империи."
 lar_congress_of_paris.6.a:1 "Небольшая цена."
 lar_congress_of_paris.6.b:1 "Они требуют слишком много, а предлагают слишком мало."
 lar_france_political_violence.1.t:0 "Протесты перерастают в насилие"
 lar_france_political_violence.1.desc:1 "Сегодня союз правых и ультраправых лиг провёл протесты и демонстрации по всему Парижу. Похоже, протестующие изначально не собирались мирно разойтись. Словно по негласному сигналу шествия изменили направление и сошлись у Национального собрания. Спешно вызванная полиция смогла остановить колонны в пределах видимости здания. Несколько раз группы бросались на полицейские кордоны, и их удавалось оттеснить лишь с большим трудом.\n\nПротестующие разошлись только далеко за полночь. Новости о беспорядках распространились и, вероятно, подорвут доверие общества к способности правительства поддерживать порядок."
 lar_france_political_violence.1.a:1 "Республика должна это пережить."
 lar_france_political_violence.1.b:0 "Привлечь виновных к ответственности."
 lar_france_political_violence.2.desc:1 "Коалиция профсоюзов и интеллектуалов объявила в столице «День действий» в ответ на недавние политические решения. Несмотря на попытки полиции удержать демонстрации под контролем, небольшие группы анархистов и радикальных коммунистов попытались спровоцировать беспорядки. Несколько магазинов были разграблены, трамваи перевёрнуты. Конная полиция сорвала попытки построить баррикады на улице Рю-Руаяль и перекрыть доступ к Национальному собранию.\n\nКогда участники беспорядков разошлись, а рабочие вернулись к станкам, многие по всей стране задались вопросом, способно ли правительство по-прежнему обеспечивать закон и порядок."
 lar_france_political_violence.3.t:0 "Правые беспорядки"
 lar_france_political_violence.3.desc:1 "После недавнего решения правительства монархисты и правые экстремисты со всей страны стеклись в столицу с открытой целью «завершить дело, неоконченное в 1934 году», когда подобный мятеж не сумел взять парламент штурмом, но заставил правительство уйти в отставку.\n\nХотя полиция заранее знала, что протесты, вероятно, станут насильственными, она оказалась не готова к уровню организации и агрессии этих хорошо подготовленных групп. В нескольких случаях полицейским на площади Согласия пришлось открыть огонь, чтобы удержать позиции.\n\nОставив после себя несколько десятков погибших и сотни раненых, протестующие покинули столицу, но сумели показать стране, что правительство не находится в безопасности даже в собственной столице."
 lar_france_political_violence.3.a:1 "Любые действия сейчас лишь ухудшат положение."
 lar_france_political_violence.3.b:0 "Республика восторжествует!"
 lar_france_french_union.2.t:1 "Северная Африка голосует за вступление в Союз"
 lar_france_french_union.2.desc:1 "К удивлению многих наблюдателей, жители Алжира, Марокко и Туниса с небольшим перевесом одобрили референдум о Французском союзе. Теперь население этих территорий считается полноправными гражданами и получает право избирать депутатов в Национальное собрание.\n\nХотя националистические элементы сохраняются во всех трёх странах, их моральному духу нанесён сокрушительный удар, и на восстановление им потребуется как минимум одно поколение."
 lar_france_french_union.2.a:1 "Они понимают смысл Братства!"
 lar_france_french_union.3.t:1 "Северная Африка голосует за выход"
 lar_france_french_union.3.desc:1 "Несмотря на все усилия местных администраций, избиратели Алжира, Марокко и Туниса подавляющим большинством отвергли предложенный Французский союз. Сразу после объявления результатов в нескольких крупных городах прошли массовые демонстрации: националисты использовали победу, чтобы потребовать немедленной и полной независимости.\n\nКомандующий французскими силами в Северной Африке срочно запросил подкрепления, поскольку наиболее радикальные элементы могут попытаться взять дело в свои руки."
 lar_france_french_union.3.a:1 "Какая неблагодарность!"
 lar_france_french_union.4.t:1 "Западная Африка голосует за вступление в Союз"
 lar_france_french_union.4.desc:1 "После нескольких недель агитации население французских территорий Западной Африки было призвано решить, должны ли эти земли войти в новый Французский союз. Предварительные результаты показывают уверенное большинство сторонников Союза. Националистическое движение, похоже, задушено в зародыше, а многие активисты независимости теперь готовятся продолжать борьбу за расширение политического самоопределения из стен Национального собрания."
 lar_france_french_union.5.t:1 "Западная Африка голосует за выход"
 lar_france_french_union.5.desc:1 "После напряжённой и порой бурной кампании националисты, судя по всему, победили на референдуме о членстве во Французском союзе в большинстве районов Французской Западной Африки. Пока местные европейцы пытаются осмыслить результат, лидеры движений за независимость требуют действий и объявляют итоги ясным мандатом на полную независимость."
 lar_france_french_union.6.t:1 "Центральная Африка голосует за вступление в Союз"
 lar_france_french_union.6.desc:1 "Результаты из огромного и слаборазвитого региона поступают медленно, но, похоже, незначительное большинство избирателей одобрило вступление в новый Французский союз. Националистические группы признали поражение, однако потребовали от нового государства увеличить инвестиции в развитие региона в награду за проявленную лояльность."
 lar_france_french_union.7.t:1 "Центральная Африка голосует за выход"
 lar_france_french_union.7.desc:1 "Сторонники Союза по всей Французской Центральной Африке потерпели серию политических поражений: одна территория за другой голосовала против вступления в новый Французский союз. Празднуя победу за победой, активисты независимости утверждают, что французское господство над регионом было решительно отвергнуто."
 lar_france_french_union.8.t:1 "Сирия голосует за вступление в Союз"
 lar_france_french_union.8.desc:1 "Французские мандатные территории Сирии и Ливана проголосовали за вступление в новый Французский союз. Хотя многие наблюдатели считали такой исход в лучшем случае маловероятным, местное население, похоже, верит, что членство в Союзе обеспечит доступ к европейским рынкам и новые инвестиции в экономику региона."
 lar_france_french_union.9.t:1 "Сирия голосует против Союза"
 lar_france_french_union.9.desc:1 "Объявление результатов недавнего референдума о Французском союзе встретили громкими возгласами в Дамаске и Бейруте: стало ясно, что регион подавляющим большинством отверг вступление. Основные националистические партии уже объявили референдум скрытым голосованием о независимости, а местный военный командующий направил в столицу тревожные донесения с требованием подкреплений."
 lar_france_french_union.10.t:1 "Индокитай голосует за вступление в Союз"
 lar_france_french_union.10.desc:1 "Сообщения из Индокитая указывают, что жители Вьетнама, Лаоса и Камбоджи с минимальным перевесом проголосовали за вступление в новый Французский союз. Это удивило даже местную администрацию, немедленно распорядившуюся пересчитать голоса. Моральный дух националистов рухнул, и многие их сторонники открыто сомневаются, действительно ли они выражают волю народа."
 lar_france_french_union.11.t:1 "Индокитай голосует против Союза"
 lar_france_french_union.11.desc:1 "Результаты референдума в Индокитае рисуют более мрачную картину, чем ожидалось. Хотя мало кто в столице верил, что очаги национализма поддержат Союз, националистические настроения оказались намного шире, чем предполагалось. Ни одна часть территории не дала большинства за вступление. Активисты уже требуют немедленного отделения от Франции даже ценой войны, считая этот момент шансом обрести национальную независимость."
 FRA_syria_intervention.1.t:0 "Союзники занимают Сирию"
 FRA_syria_intervention.1.desc:1 "На сдержанной церемонии в Дамаске местный командующий войсками Виши официально сдал территорию Союзникам. Бои по всему региону прекращены, уцелевшие части Виши отправляются в плен. Лишь немногие французские солдаты пожелали присоединиться к силам Свободной Франции; большинство предпочитает репатриацию."
 FRA_syria_intervention.1.a:1 "Хорошо сражались."
 FRA_syria_intervention.2.t:0 "Виши удерживает Сирию"
 FRA_syria_intervention.2.desc:1 "После ожесточённых боёв, остановивших наступление Союзников на нескольких ключевых направлениях, местный командующий приказал прекратить операцию. Союзные силы в основном отошли на исходные позиции, а войска Виши укрепились. Преследования не последовало: Виши, похоже, удовлетворено удержанием своих рубежей."
 FRA_syria_intervention.2.a:1 "Столько достойных людей погибло напрасно."
 FRA_syria_intervention.3.t:0 "Перемирие в Сирии"
 FRA_syria_intervention.3.desc:1 "Наступление Союзников в Сирии остановилось, а войска Виши сумели создать устойчивую оборонительную линию. Несмотря на несколько хорошо скоординированных атак, союзные силы не смогли выбить защитников. Обе стороны окопались и согласились на прекращение огня, при этом Виши сохраняет контроль над всеми важными районами."
 FRA_syria_intervention.3.a:1 "Статус-кво сохраняется."
 FRA_indochina_intervention.1.t:0 "Союзники занимают Индокитай"
 FRA_indochina_intervention.1.desc:1 "Ударные колонны Союзников достигли нескольких крупных городов Индокитая, после чего местный губернатор запросил перемирие. Защитники были разрознены и плохо координировались, поэтому дальнейшее сопротивление признали бесполезным. Оставшиеся войска сложили оружие и ожидают репатриации во Вишистскую Францию."
 FRA_indochina_intervention.1.a:1 "Жизненно важный успех."
 FRA_indochina_intervention.2.t:0 "Виши удерживает Индокитай"
 FRA_indochina_intervention.2.desc:1 "После тяжёлых боёв в крайне сложной местности союзное командование остановило операцию. Положение передовых частей со снабжением становилось критическим, а сопротивление Виши усиливалось, поэтому Союзники решили отойти и закрепиться, оставив территорию под контролем Виши."
 FRA_indochina_intervention.2.a:1 "Какая бессмысленная трата времени и людей."
 FRA_indochina_intervention.3.t:0 "Перемирие в Индокитае"
 FRA_indochina_intervention.3.desc:1 "С наступлением плохой погоды и истощением запасов командиры союзных войск и сил Виши в Индокитае договорились о прекращении огня. Из-за огромных трудностей наступления и утраты эффекта внезапности верховное командование не рассчитывает возобновить продвижение даже после улучшения обстановки."
 FRA_indochina_intervention.3.a:1 "Рискнули многим, получили мало."
 FRA_central_africa_intervention.1.t:0 "Союзники занимают Центральную Африку"
 FRA_central_africa_intervention.1.desc:1 "Столкнувшись лишь с умеренным сопротивлением, союзные части глубоко проникли в районы Центральной Африки, удерживаемые Виши. Несмотря на приказы сопротивляться как можно дольше, французские подразделения в основном прекратили борьбу и больше не препятствуют продвижению Союзников."
 FRA_central_africa_intervention.1.a:1 "Они знают, кто настоящий враг."
 FRA_central_africa_intervention.2.t:0 "Виши удерживает Центральную Африку"
 FRA_central_africa_intervention.2.desc:1 "Французские части в Центральной Африке оказали неожиданно сильное сопротивление, устроив засады нескольким союзным колоннам и нанеся чувствительные потери. Столкнувшись с неразберихой и явно недооценив противника, местный командующий отвёл войска на исходные позиции и приказал окопаться в ожидании распоряжений."
 FRA_central_africa_intervention.2.a:1 "Почему они сопротивляются своим освободителям?"
 FRA_central_africa_intervention.3.t:0 "Перемирие в Центральной Африке"
 FRA_central_africa_intervention.3.desc:1 "Ожесточённые бои вокруг нескольких ключевых пунктов в глубине Центральной Африки не принесли решающего результата. Из-за тяжёлых условий, болезней и нехватки снабжения обе стороны согласились прекратить боевые действия и закрепиться на занимаемых позициях."
 FRA_central_africa_intervention.3.a:1 "По крайней мере, потери прекратились."
 FRA_west_africa_intervention.1.t:0 "Союзники занимают Западную Африку"
 FRA_west_africa_intervention.1.desc:1 "Используя превосходство в подвижности и знание местности, союзные части обошли большинство французских защитников с флангов и вынудили их капитулировать. Поскольку резервов для остановки наступления не осталось, местный губернатор официально сдал территорию."
 FRA_west_africa_intervention.1.a:1 "Ещё одна часть мира теперь дышит свободно."
 FRA_west_africa_intervention.2.t:0 "Виши удерживает Западную Африку"
 FRA_west_africa_intervention.2.desc:1 "После серии неудачных атак и ожесточённых боёв местный союзный командующий прекратил наступательные операции и приказал уязвимым частям отойти на более удобные рубежи. Войска Виши укрепились вокруг ключевых пунктов и окопались, сделав дальнейшие атаки малоперспективными."
 FRA_west_africa_intervention.2.a:1 "Удача не благоволила смелым."
 FRA_west_africa_intervention.3.t:0 "Перемирие в Западной Африке"
 FRA_west_africa_intervention.3.desc:1 "Осознавая ненадёжность снабжения и отсутствие подкреплений, войска Виши и Союзников долго маневрировали и контрманеврировали, пытаясь вынудить противника вступить в решающее сражение на невыгодных условиях. Люди и техника истощены, решения не видно, и обе стороны окопались в ожидании первого шага противника."
 FRA_west_africa_intervention.3.a:1 "Какая пустая трата времени."
 lar_compensate_italy.1.t:0 "Франция предлагает колониальную компенсацию"
 lar_compensate_italy.1.desc:1 "[From.GetLeader] прибыл в Рим для обсуждения договора, который должен урегулировать нерешённые вопросы между нашими странами. Напомнив о давнем братстве народов, скреплённом общими жертвами Великой войны, он предложил передать нам французский порт Джибути в обмен на гарантии помощи Франции в случае войны."
 lar_compensate_italy.1.a:1 "Он получит свой союз."
 lar_compensate_italy.1.b:1 "Нас не так легко купить."
 lar_compensate_italy.2.t:1 "[From.GetLeader] соглашается"
 lar_compensate_italy.2.desc:1 "[This.GetLeader] с триумфом вернулся из Италии: [From.GetLeader] согласился подписать предложенный договор. Теперь остаётся лишь официально передать Италии наши владения в Восточной Африке."
 lar_compensate_italy.2.a:0 "Небольшая цена."
 lar_compensate_italy.3.t:1 "[From.GetLeader] отказывается"
 lar_compensate_italy.3.desc:1 "Несмотря на первоначальные успехи, переговоры с Италией быстро провалились, когда стало ясно, что [From.GetLeader] ожидает гораздо более значительных уступок, чем передача Джибути."
 lar_compensate_italy.3.a:1 "Что нам теперь делать?"
 lar_intervention_in_greece.1.t:0 "Франция предлагает интервенцию в Грецию"
 lar_intervention_in_greece.1.desc:1 "Французский посол передал ноту правительства, указав на общие интересы в Восточном Средиземноморье. Правительство [From.GetLeader] особенно заинтересовано в Крите как военно-морской базе, но также отмечает, что существование «недружественного или враждебного» правительства в Греции серьёзно осложнит операции в регионе. Поэтому [From.GetAdjective] правительство предлагает обсудить совместную интервенцию в Грецию для установления более благоприятного режима или прямого управления территориями."
 lar_intervention_in_greece.1.a:1 "Великие умы мыслят одинаково!"
 lar_intervention_in_greece.1.b:1 "Мы сами определим свою стратегию."
 lar_intervention_in_greece.2.t:1 "[From.GetLeader] соглашается"
 lar_intervention_in_greece.2.desc:1 "[From.GetLeader] передал через нашего посла в Риме сообщение, выразив полную поддержку и абсолютное согласие с нашими взглядами. Вооружённым силам [From.GetAdjective] поручено подготовить планы совместных действий против Греции, если возникнет необходимость."
 lar_intervention_in_greece.2.a:1 "Необходимость почти наверняка возникнет."
 lar_intervention_in_greece.3.t:1 "[From.GetLeader] отказывается"
 lar_intervention_in_greece.3.desc:1 "Согласно довольно резкой ноте посла [From.GetAdjective], его правительство сейчас не заинтересовано в изменении статус-кво в Восточном Средиземноморье, предпочитая нынешнюю обстановку неопределённости военных действий."
 lar_intervention_in_greece.3.a:1 "Это звук страха."
 lar_dominate_the_middle_east.1.t:0 "Франция требует подчинения"
 lar_dominate_the_middle_east.1.desc:1 "Правительство [From.GetLeader] назначило нового полномочного представителя на Ближнем Востоке. На встрече с [This.GetLeader] в нашей столице французский представитель заявил, что Франция намерена играть более активную роль в регионе и ожидает прямых консультаций по всем вопросам региональной стабильности. \n\nХотя последствия отказа не были названы прямо, он отметил, что французскому правительству будет «трудно» принять проведение нашим государством независимой внешней политики."
 lar_dominate_the_middle_east.1.a:1 "Мы должны принять новую реальность."
 lar_dominate_the_middle_east.1.b:1 "Мы заслужили свободу и так легко её не отдадим!"
 lar_dominate_the_middle_east.2.t:0 "[From.GetNameDefCap] подчиняется"
 lar_dominate_the_middle_east.2.desc:1 "После совещания с советниками [From.GetLeader] официально принял наши требования и разрешил нашему представителю участвовать в обсуждении всех внешнеполитических решений, чтобы они соответствовали нашим пожеланиям."
 lar_dominate_the_middle_east.2.a:1 "И правильно."
 lar_dominate_the_middle_east.3.t:0 "[From.GetNameDefCap] проявляет неповиновение"
 lar_dominate_the_middle_east.3.desc:1 "В пространной речи перед нашим представителем [From.GetLeader] восхвалял долгие и славные воинские традиции народа [From.GetAdjective], объясняя, что они никогда не склонялись перед чужеземным правителем, будут сопротивляться любым попыткам принуждения и скорее умрут стоя, чем станут жить на коленях."
 lar_dominate_the_middle_east.3.a:1 "Значит, умрут стоя."
 lar_dominate_the_middle_east.3.b:0 "Это всего лишь бесполезная земля, населённая бесполезными людьми."
 lar_spheres_of_influence.1.t:0 "Франция хочет обсудить сферы влияния"
 lar_spheres_of_influence.1.desc:1 "[From.GetLeader] прибыл в Берлин для встречи с [This.GetLeader], стремясь устранить оставшиеся причины напряжённости между нашими странами. Среди обсуждаемых вопросов — переустройство Центральной Европы. [From.GetLeader] ясно дал понять, что считает государство [BEL.GetNameDef] с его франкоязычным населением важнейшей сферой интересов своей страны. \n\nПри этом его правительство гораздо гибче относится к судьбе государств [HOL.GetNameDef] и [LUX.GetNameDef] и предлагает меморандум, согласно которому последние два войдут в нашу сферу влияния, а первое — во французскую."
 lar_spheres_of_influence.1.a:1 "Разумное предложение."
 lar_spheres_of_influence.1.b:0 "Чтобы иметь сферы, Франция, сначала нужно иметь влияние."
 lar_spheres_of_influence.2.t:1 "[From.GetNameDefCap] соглашается"
 lar_spheres_of_influence.2.desc:1 "Переговоры с [From.GetLeader] заняли всего несколько минут: лидеры быстро достигли соглашения на предложенных нами условиях. Единственным спорным вопросом осталось небольшое немецкоязычное меньшинство в Бельгии; урегулировать его поручено дипломатам."
 lar_spheres_of_influence.2.a:1 "Ещё один успех нашей дипломатической стратегии."
 lar_spheres_of_influence.3.t:1 "[From.GetLeader] отказывается"
 lar_spheres_of_influence.3.desc:1 "Как сообщается, напряжённая встреча между [From.GetLeader] и [This.GetLeader] за несколько минут уничтожила все надежды на снижение напряжённости. Германская делегация не уступила, заявив, что Бельгия с её значительным немецким меньшинством является естественной сферой интересов [From.GetNameDef], а идея предоставить нам свободу действий там совершенно неприемлема."
 lar_spheres_of_influence.3.a:1 "Похоже, мы зря потратили время."
 lar_align_belgium.1.t:1 "Франция требует особых прав"
 lar_align_belgium.1.desc:2 "После серии нападений замаскированных головорезов на франкоязычных граждан французский посол сегодня встретился с [This.GetLeader] и передал ноту правительства. В ней говорится, что, поскольку мы явно не способны защитить французскую общину внутри своих границ, Франция считает своим долгом сделать это за нас. Для этого она требует широких прав, включая размещение войск в нашей стране и проведение расследований французской жандармерией.\n\nОтказ предоставить эти права, согласно ноте, будет расценён как враждебный акт с самыми тяжёлыми последствиями."
 lar_align_belgium.1.a:1 "У нас нет выбора, кроме как согласиться."
 lar_align_belgium.1.b:1 "Мы не склонились в 1914 году и не склонимся сейчас!"
 lar_align_belgium.2.t:0 "[From.GetNameDefCap] подчиняется"
 lar_align_belgium.2.desc:1 "Кабинет [From.GetAdjective] единогласно принял наше предложение, хотя несколько министров предпочли уйти в отставку, лишь бы не голосовать за него. Военная группа связи и небольшая команда чиновников уже направились в Брюссель для координации с властями [From.GetAdjective]."
 lar_align_belgium.2.a:1 "Они сделали мудрый выбор."
 lar_align_belgium.3.t:1 "[From.GetNameDefCap] клянётся сражаться"
 lar_align_belgium.3.desc:1 "Вместо дипломатического ответа на нашу ноту правительство [From.GetAdjective], похоже, привело армию в полную боевую готовность и закрыло границу. Брюссельские газеты, реалистично оценивая шансы на победу, полны упоминаний битвы при Ватерлоо и предрекают французским войскам позорное поражение в случае вторжения."
 lar_align_belgium.3.a:1 "Это мы ещё посмотрим."
 lar_align_belgium.3.b:1 "Бельгия не стоит ни одной пули и ни одной капли крови."
 lar_split_belgium.1.t:1 "[From.GetLeader] требует Валлонию"
 lar_split_belgium.1.desc:1 "За последние недели появилось множество групп, утверждающих, что они представляют франкоязычное население нашей страны, и агитирующих за «воссоединение» Валлонии с Францией. Сегодня французский посол передал ноту: правительство [From.GetLeader] официально взяло курс на присоединение франкоязычных районов нашей страны.\n\nСообщения о сосредоточении войск у границы показывают, что они готовы добиваться этого любыми средствами."
 lar_split_belgium.1.a:1 "Борьба с неизбежным ничего не даст."
 lar_split_belgium.1.b:1 "Это наша страна, и мы будем сражаться за каждый клочок земли."
 lar_split_belgium.2.t:1 "[FROM.GetName] согласилось с нашими условиями"
 lar_split_belgium.2.desc:1 "Правительство [FROM.GetAdjective] приняло наши требования и реорганизовало политический порядок у нашей северной границы."
 lar_split_belgium.2.a:1 "Демократия — прекрасная вещь."
 lar_split_belgium.3.t:0 "[From.GetLeader] проявляет неповиновение"
 lar_split_belgium.3.desc:1 "Правительство [From.GetAdjective] ответило на любые разговоры об объединении Валлонии и Франции жёсткими репрессиями: офисы сторонников объединения подверглись обыскам, а их лидеры арестованы. Когда наш посол заявил официальный протест, ему резко ответили, что поддержание порядка внутри страны является делом правительства [From.GetAdjective], которое не намерено выслушивать нравоучения от иностранных агентов."
 lar_split_belgium.3.a:1 "Мы научим их уважению!"
 lar_split_belgium.3.b:1 "Это не стоит усилий."
 lar_concessions_to_italy.1.t:1 "Франция предлагает Италии территориальную компенсацию"
 lar_concessions_to_italy.1.desc:2 "Правительство [From.GetLeader] предложило привлечь Италию на нашу сторону и предотвратить возможный союз Германии с Италией. [ITA.GetLeader], скорее всего, придётся склонить уступками или компенсацией. Учитывая наши владения в Восточной Африке, [From.GetAdjective] предлагает передать Италии Джибути и Сомалиленд в обмен на формальный союз, направленный на сдерживание Германии."
 lar_concessions_to_italy.1.a:1 "Мы можем задушить эту так называемую Ось в колыбели!"
 lar_concessions_to_italy.1.b:1 "Обещаниям [ITA.GetLeader] нельзя доверять."
 lar_concessions_to_italy.2.t:1 "[From.GetLeader] соглашается"
 lar_concessions_to_italy.2.desc:1 "Кабинет [From.GetAdjective] с небольшим перевесом одобрил наше предложение. Хотя в дипломатических кругах сохраняются серьёзные сомнения по поводу союза с [ITA.GetLeader], теперь мы можем представить совместное предложение государству [ITA.GetAdjective]."
 lar_concessions_to_italy.2.a:1 "Отправить сообщение."
 lar_concessions_to_italy.3.t:1 "[From.GetLeader] отказывается"
 lar_concessions_to_italy.3.desc:1 "Наше предложение не получило поддержки в кабинете [From.GetAdjective]. Хотя все соглашались, что союз с [ITA.GetNameDef] был бы полезен, правительство [From.GetAdjective] не смогло принять территориальные уступки ради его достижения."
 lar_concessions_to_italy.3.a:1 "Нам придётся убеждать Италию самостоятельно."
 lar_concessions_to_italy.4.t:0 "Британия и Франция предлагают колониальное соглашение"
 lar_concessions_to_italy.4.desc:1 "Послы государств [ENG.GetNameDef] и [FRA.GetNameDef] встретились с [This.GetLeader], чтобы обсудить новую попытку ратифицировать договорённости, достигнутые в Стрезе. В рамках дипломатического наступления они предлагают территориальные уступки в Восточной Африке, передавая Джибути и британскую часть Сомали.\n\nФактическая передача территорий будет связана с ратификацией союзного договора."
 lar_concessions_to_italy.4.a:0 "Всё ради красивых границ."
 lar_concessions_to_italy.4.b:0 "Нас нельзя купить!"
 lar_concessions_to_italy.5.t:0 "Франция предлагает колониальные уступки"
 lar_concessions_to_italy.5.desc:1 "Посол [From.GetAdjective] передал ноту своего правительства. Похоже, [From.GetLeader] намерен официально ратифицировать предварительные договорённости, достигнутые в Стрезе. Чтобы сделать предложение привлекательнее, [From.GetAdjective] обещает передать нам французскую территорию в Восточной Африке в случае согласия.\n\nВ дипломатических кругах ходят слухи, что ранее [From.GetAdjective] пыталось добиться совместной декларации с государством [ENG.GetAdjective], предусматривавшей ещё более крупные территориальные уступки, но получило отказ."
 lar_concessions_to_italy.5.a:1 "Звучит разумно."
 lar_concessions_to_italy.5.b:1 "Они предлагают слишком мало, требуя слишком многого."
 lar_concessions_to_italy.6.t:1 "[ITA.GetLeader] соглашается"
 lar_concessions_to_italy.6.desc:1 "Правительство [From.GetAdjective] в принципе согласилось с предложенным территориальным обменом и пообещало ратифицировать Стрезское соглашение после окончательного согласования условий. Детали поручены дипломатической службе, а окончательный договор будет ратифицирован позднее. Передача территорий произойдёт только после его подписания."
 lar_concessions_to_italy.6.a:2 "Нужно довести дело до конца."
 lar_concessions_to_italy.7.t:1 "[ITA.GetLeader] отказывается"
 lar_concessions_to_italy.7.desc:1 "В довольно резком ответе правительство [From.GetAdjective] заявило, что сейчас не заинтересовано ни в союзе, ни в ратификации Стрезского соглашения. По их словам, никакие территориальные уступки этого не изменят."
 lar_concessions_to_italy.7.a:0 "Это ставит нас в затруднительное положение."
 lar_ratify_the_stresa_front.1.t:0 "Ратификация Стрезского фронта"
 lar_ratify_the_stresa_front.1.desc:1 "Идёт подготовка к подписанию и ратификации Стрезских соглашений, формализующих союз с Францией в обмен на территориальные уступки. После месяцев работы дипломатической службы остаётся лишь поставить подписи."
 lar_ratify_the_stresa_front.1.a:1 "Триумф дипломатии государства [This.GetAdjective]."
 lar_ratify_the_stresa_front.1.b:1 "Это больше не отвечает нашим интересам."
 lar_ratify_the_stresa_front.2.desc:1 "Пришло время выполнить обещание, данное правительству [From.GetAdjective]. Союз вступил в силу, и мы обязаны передать Джибути под его контроль."
 lar_ratify_the_stresa_front.2.a:2 "Франция держит слово."
 lar_ratify_the_stresa_front.2.b:1 "Обстановка изменилась."
 lar_ratify_the_stresa_front.3.t:0 "[From.GetNameDefCap] отказывается ратифицировать союз"
 lar_ratify_the_stresa_front.3.desc:1 "Внезапно правительство [From.GetAdjective] решило отказаться от прежнего обязательства ратифицировать Стрезские соглашения. Все попытки получить объяснение по дипломатическим каналам провалились; дипломаты [From.GetAdjective], похоже, сами потрясены неожиданной сменой курса."
 lar_ratify_the_stresa_front.3.a:1 "Мрачный день."
 lar_ratify_the_stresa_front.4.desc:1 "Государства [FRA.GetNameDefCap] и [ITA.GetNameDef] уже подписали Стрезские соглашения и оформили союз. Теперь наша очередь выполнить свою часть сделки, подписать соглашения и передать наши владения в Сомали под контроль [ITA.GetAdjective]."
 lar_ratify_the_stresa_front.4.a:1 "Мы дали слово."
 lar_ratify_the_stresa_front.4.b:1 "Наши интересы разошлись."
 lar_franco_soviet_treaty.1.t:2 "Франция предлагает договор о взаимной помощи"
 lar_franco_soviet_treaty.1.desc:1 "Правительство [From.GetLeader] направило специального посланника в Москву для обсуждения возможного союза. По предложению [From.GetAdjective], мы обязуемся вступить в любую оборонительную войну государства [From.GetNameDef], а [From.GetNameDef] придёт нам на помощь в случае нападения."
 lar_franco_soviet_treaty.1.a:1 "Дух 1894 года жив!"
 lar_franco_soviet_treaty.1.b:1 "Ни одна из сторон не сможет эффективно помочь другой."
 lar_franco_soviet_treaty.2.t:1 "[From.GetNameDefCap] соглашается"
 lar_franco_soviet_treaty.2.desc:1 "Правительство [From.GetAdjective] приняло наше предложение, но подчеркнуло, что никогда не согласится использовать войну для существенного изменения политической карты Европы. Поэтому союз будет строго оборонительным: каждая сторона обязуется прийти на помощь другой только в случае нападения третьей державы."
 lar_franco_soviet_treaty.2.a:1 "Этого должно быть достаточно."
 lar_franco_soviet_treaty.3.t:1 "[From.GetNameDefCap] отказывается"
 lar_franco_soviet_treaty.3.desc:1 "На холодной встрече с министром иностранных дел [From.GetAdjective] нашему послу сообщили, что союз с нами не отвечает интересам [From.GetAdjective]. Географические реалии Европы, по их словам, не позволяют войскам [From.GetAdjective] эффективно поддержать нас при нападении на наши территории, и наоборот, поэтому правительство [From.GetAdjective] вынуждено отклонить предложение."
 lar_franco_soviet_treaty.3.a:2 "Невозможно или просто неудобно?"
 lar_end_the_occupation.1.t:0 "Конец оккупации"
 lar_end_the_occupation.1.desc:1 "Спустя несколько лет правительство [From.GetLeader] официально объявило программу «Национальной революции» успешно завершённой. Как заявил он в радиообращении, слабость и упадок старой французской политической системы были искоренены и заменены новым, возрождённым государственным устройством, более подходящим для такой благородной и воинственной нации, как Франция.\n\nВ рамках этих преобразований его правительство официально потребовало снять обязательства и ограничения, наложенные перемирием, и передать ему полный контроль над всеми французскими территориями.\n\nВзамен оно предложило вновь вступить в войну, чтобы наказать тех, кто вверг наши страны во вторую кровавую войну за одно поколение."
 lar_end_the_occupation.1.a:1 "Мы примем их с распростёртыми объятиями!"
 lar_end_the_occupation.1.b:1 "Похоже, он слишком высокого мнения о себе."
 lar_end_the_occupation.2.t:1 "Оккупация заканчивается"
 lar_end_the_occupation.2.desc:1 "После подписания Стального пакта [This.GetLeader] германские войска по всей стране передали контроль французским силам. После церемонии с участием [From.GetLeader] и [This.GetLeader] немецкий гарнизон Парижа спустил флаг [From.GetAdjective] и покинул город, впервые за долгие годы оставив его под триколором."
 lar_end_the_occupation.2.a:1 "Мы вернули себе честь."
 lar_end_the_occupation.3.t:1 "[From.GetLeader] отказывается"
 lar_end_the_occupation.3.desc:1 "Несмотря на щедрое предложение встать плечом к плечу против большевистской угрозы и преследовать разжигателей войны, [From.GetLeader] грубо отверг нашу дипломатическую инициативу. Он заявил, что французский народ до сих пор не проявил никаких воинских качеств и нет причин доверять защиту западных границ государства [From.GetNameDef] стране, уже однажды потерпевшей поражение."
 lar_end_the_occupation.3.a:1 "Пора объединить силы с [FRA.GetLeader]!"
 lar_end_the_occupation.3.b:2 "Мы ответим на это оскорбление сталью и огнём!"
 lar_end_the_occupation.4.t:0 "Предложение из Виши"
 lar_end_the_occupation.4.desc:1 "Неожиданно представитель [From.GetLeader] обратился к нам с предложением объединить силы. Тайно восстановив армию, [From.GetLeader] считает, что настало время вновь вступить в войну и освободить родину.\n\nОднако наши источники в его правительстве указывают, что истинной причиной этого шага стал провал предыдущей попытки договориться о возвращении оккупированных французских территорий."
 lar_end_the_occupation.4.a:1 "Наконец-то они образумились."
 lar_end_the_occupation.4.b:1 "Зачем нам помогать трусам и предателям?"
 lar_end_the_occupation.5.t:0 "[From.GetLeader] соглашается"
 lar_end_the_occupation.5.desc:1 "Наша делегация к [From.GetLeader] успешно вернулась — вместе с ним самим. Впервые за долгие годы ступив на французскую землю, [From.GetLeader] встретился с [This.GetLeader], чтобы обсудить точные условия передачи власти."
 lar_end_the_occupation.5.a:0 "Отлично."
 lar_end_the_occupation.6.t:0 "[From.GetLeader] отказывается"
 lar_end_the_occupation.6.desc:2 "После долгой лекции о многочисленных недостатках [This.GetLeader] как человека, патриота, солдата и гражданина наша делегация к [From.GetLeader] вернулась ни с чем. В радиообращении позже в тот же день [From.GetLeader] публично назвал наше правительство «величайшим сборищем трусов и предателей в истории Франции».\n\nЕсли мы хотим вернуть родину и освободить её от немцев, придётся действовать без их помощи."
 lar_end_the_occupation.6.a:1 "Какой настоящий патриот вот так отталкивает протянутую руку другого француза?"
 lar_low_stability_civil_war.1.t:1 "Коммунистическое восстание!"
 lar_low_stability_civil_war.1.desc:1 "После недель агитации и тайной подготовки в нескольких французских городах начались массовые забастовки. Почти сразу появились вооружённые «Рабочие бригады обороны», местами поддержанные мятежными армейскими частями. По всей стране верные правительству силы неоднократно попадали под огонь, а стычки между мятежниками и лоялистами перерастали в ожесточённые перестрелки.\n\nПоскольку внутренний порядок стремительно рушится, правительство фактически потеряло контроль над значительной частью страны."
 lar_low_stability_civil_war.1.a:1 "Очередная Французская революция?"
 lar_low_stability_civil_war.2.t:1 "Реакционное восстание!"
 lar_low_stability_civil_war.2.desc:1 "Клика реакционных офицеров и богатых землевладельцев, очевидно, готовила военный переворот против правительства. Некоторые заговорщики были известны полиции, другие ещё не были установлены. После утечки из следствия они решили действовать до полного раскрытия заговора.\n\nПоспешность и неразбериха лишили переворот внезапности: части не успели занять позиции, а местные гарнизоны были предупреждены. Лоялисты быстро предотвратили удар по руководству, но ради этого оставили значительные районы страны. Восстание укрепилось, и страна, похоже, скатилась в полномасштабную гражданскую войну."
 lar_low_stability_civil_war.2.a:1 "Все знали, что это случится."
 lar_worker_shortage.1.t:0 "Нехватка рабочих усиливается"
 lar_worker_shortage.1.desc:0 "После расширения призыва и мобилизации ранее освобождённых работников многие предприятия сообщают о трудностях с заполнением вакансий. Даже военная промышленность страдает от нехватки рабочей силы, и выпуск начал снижаться.\n\nПромышленные эксперты призывают правительство найти новые источники людей — либо высвободить военнослужащих, либо заменить призванных рабочих."
 lar_worker_shortage.1.a:0 "Может, им нанять женщин?"
 lar_worker_shortage.2.t:0 "Солдаты возвращаются к станкам"
 lar_worker_shortage.2.desc:1 "Несмотря на протесты военных, сокращение призыва и восстановление отсрочек для квалифицированных рабочих смягчили дефицит рабочей силы. Статистика показывает заметный рост производительности, которая быстро возвращается к уровню до расширения призыва."
 lar_worker_shortage.2.a:1 "Качество, а не количество!"
 lar_arms_purchases.1.t:0 "[FROM.GetNameDefCap] хочет приобрести оружие"
 lar_arms_purchases.1.desc:0 "Отмечая быстрое ухудшение мировой обстановки, представители [From.GetAdjective] обратились к нам за экспортными лицензиями на тяжёлое вооружение и современные самолёты, чтобы сразу разместить заказы на наших заводах. Общий объём недостаточно велик, чтобы заметно повлиять на экономику, но всё же создаст немало рабочих мест."
 lar_arms_purchases.1.a:0 "Мы сделаем всё необходимое."
 lar_arms_purchases.1.b:0 "Ни в коем случае!"
 lar_arms_purchases.2.t:0 "[FROM.GetNameDefCap] соглашается"
 lar_arms_purchases.2.desc:0 "При поддержке президента [FROM.GetLeader] сенат [FROM.GetAdjective] принял широкий закон, позволяющий размещать заказы на оружие на заводах [FROM.GetAdjective] для передачи вооружённым силам [ROOT.GetAdjective], но резко ограничил варианты финансирования. Изоляционисты в [FROM.GetNameDef] по-прежнему считают любые внешние обязательства прямым вмешательством. За оружие придётся платить твёрдой валютой."
 lar_arms_purchases.2.eng.desc:0 "При поддержке [FROM.GetLeader] парламент [FROM.GetAdjective] принял широкий закон, позволяющий размещать заказы на оружие на заводах [FROM.GetAdjective] для снабжения вооружённых сил [ROOT.GetAdjective]. Однако в [FROM.GetNameDef] всё ещё сильна оппозиция такой помощи, и в качестве компромисса мы обязаны платить твёрдой валютой."
 lar_arms_purchases.2.a:1 "Если такова цена."
 lar_arms_purchases.3.t:0 "[FROM.GetNameDefCap] отказывается"
 lar_arms_purchases.3.desc:0 "Несмотря на активное лоббирование и поддержку нескольких сторонников вмешательства, попытки получить экспортные разрешения на военную технику из [FROM.GetNameDef] провалились. Изоляционистское лобби в Конгрессе заблокировало даже вынесение вопроса на повестку, опасаясь, что продажа оружия станет первым шагом к полномасштабному вмешательству."
 lar_arms_purchases.3.a:0 "Какая наглость!"
 lar_france_volunteers.1.t:1 "Добровольцы из [From.GetNameDef]"
 lar_france_volunteers.1.desc:1 "После решения правительства [From.GetLeader] ослабить пограничный контроль между Испанией и [From.GetNameDef] к нам хлынула волна добровольцев.\n\nК сожалению, новая политика действует для всех, поэтому другие стороны войны, вероятно, тоже получат поддержку."
 lar_france_volunteers.1.a:1 "Отлично?"
 lar_france_volunteers.3.t:0 "Добровольцы возвращаются"
 lar_france_volunteers.3.desc:2 "После окончания боёв в Испании часть людей, сражавшихся за [From.GetLeader], вернулась домой. Военная разведка хочет опросить их ради опыта современной войны, но многие в правительстве опасаются, что они начнут радикализировать другие политические группы."
 lar_france_volunteers.3.a:0 "Пусть возвращаются."
 lar_france_volunteers.3.b:0 "Отправить их обратно."
 lar_non_intervention.1.t:0 "[From.GetNameDefCap] приглашает нас в Комитет по невмешательству"
 lar_non_intervention.1.desc:1 "[From.GetLeader] официально призвал создать Комитет по невмешательству, который должен исключить внешнее вмешательство в войну в Испании. Однако проект почти не содержит действенных механизмов контроля.\n\nДаже если мы согласимся, множество лазеек позволит влиять на войну при желании. Единственным ощутимым результатом станет небольшое усиление поддержки правительства [From.GetLeader]."
 lar_non_intervention.1.a:1 "Эти условия приемлемы."
 lar_non_intervention.1.b:1 "Это бессмысленное занятие, и мы не будем участвовать!"
 lar_non_intervention.2.t:0 "[From.GetNameDefCap] вступает в Комитет по невмешательству"
 lar_non_intervention.2.desc:1 "Назвав это важнейшим шагом к прекращению насилия в Испании, [From.GetnameDef] официально присоединилось к Комитету по невмешательству. Будет ли оно соблюдать условия — ещё предстоит увидеть."
 lar_non_intervention.2.a:1 "У нас нет причин сомневаться, верно?"
 lar_non_intervention.3.t:0 "[From.GetNameDefCap] отказывается вступить в Комитет по невмешательству"
 lar_non_intervention.3.desc:1 "Сославшись на отсутствие действенных механизмов контроля, [From.GetNameDef] официально отклонило приглашение в Комитет по невмешательству. Означает ли это, что [From.GetLeader] хочет напрямую вмешаться в Испании, пока неясно."
 lar_non_intervention.3.a:1 "Время покажет."
 lar_appeal_to_overseas_territories.2.t:0 "Индокитай остаётся с Виши"
 lar_appeal_to_overseas_territories.2.desc:0 "Местный губернатор Индокитая официально и публично отказался даже рассматривать переход на нашу сторону. В радиообращении он также объявил жёсткие меры против любых групп, которые попытаются «самовольно и безответственно изменить существующее положение»."
 lar_appeal_to_overseas_territories.2.a:0 "Трус и предатель."
 lar_appeal_to_overseas_territories.3.t:0 "Индокитай поддерживает [This.GetLeader]"
 lar_appeal_to_overseas_territories.3.desc:0 "Губернатор Индокитая объявил о поддержке [This.GetLeader], отметив, что правительство в Виши не имеет конституционной легитимности и действует под давлением. Однако местные военные в основном сохранили верность Виши; сейчас обсуждается их репатриация."
 lar_appeal_to_overseas_territories.3.a:0 "Отлично!"
 lar_appeal_to_overseas_territories.4.t:0 "Сирия остаётся с Виши"
 lar_appeal_to_overseas_territories.4.desc:0 "Местная администрация Сирии полностью проигнорировала наше обращение. Источники сообщают о кратком закрытом обсуждении, но официальных комментариев или действий в нашу поддержку не последовало."
 lar_appeal_to_overseas_territories.5.t:0 "Сирия поддерживает [This.GetLeader]"
 lar_appeal_to_overseas_territories.5.desc:0 "В Сирии, похоже, произошёл тихий переворот: губернатор арестовал нескольких ключевых представителей колониальной администрации. Затем он объявил о верности [This.GetLeader] и призвал всех французских патриотов взяться за оружие против врага, оккупировавшего родину."
 lar_appeal_to_overseas_territories.6.t:0 "Центральная Африка остаётся с Виши"
 lar_appeal_to_overseas_territories.6.desc:0 "Колониальные администраторы наших центральноафриканских владений коллективно отвергли радиообращение [This.GetLeader], назвав его предательством, подрывающим власть законного правительства. Источники сообщают, что они опасаются реакции местного населения в случае смены стороны и возможной попытки сторонников независимости воспользоваться слабостью."
 lar_appeal_to_overseas_territories.6.a:0 "Все вместе они недостойны называться мужчинами!"
 lar_appeal_to_overseas_territories.7.t:0 "Центральная Африка переходит на нашу сторону"
 lar_appeal_to_overseas_territories.7.desc:0 "Во главе с администратором Феликсом Эбуэ колонии Центральной Африки присоединились к нашему делу. Уже начался набор среди местного населения."
 lar_appeal_to_overseas_territories.8.t:0 "Западная Африка остаётся с Виши"
 lar_appeal_to_overseas_territories.8.desc:0 "Хотя местные администраторы Западной Африки в целом поддерживали переход на нашу сторону, значительная часть европейского населения оказалась против. Под растущим давлением губернаторы были вынуждены публично заявить о поддержке правительства Виши."
 lar_appeal_to_overseas_territories.9.t:0 "Западная Африка поддерживает [This.GetNameDef]"
 lar_appeal_to_overseas_territories.9.desc:0 "Пока местные администраторы наших западноафриканских территорий обсуждали ответ на обращение [This.GetLeader], патриотически настроенные жители сами захватили здания колониальной администрации. Теперь регион находится под нашим контролем."
 lar_appeal_to_overseas_territories.10.t:0 "Мадагаскар остаётся с Виши"
 lar_appeal_to_overseas_territories.10.desc:0 "Губернатор острова призвал жителей сохранять спокойствие и выполнять приказы законного правительства в Виши. Похоже, недовольство невелико, и большинство населения подчинилось."
 lar_appeal_to_overseas_territories.11.t:0 "Мадагаскар переходит на нашу сторону"
 lar_appeal_to_overseas_territories.11.desc:0 "Губернатор Мадагаскара предложил нашим силам и союзникам использовать военные базы острова и попросил дополнительной поддержки для защиты от возможного нападения."
 lar_appeal_to_overseas_territories.12.t:0 "Северная Африка остаётся с Виши"
 lar_appeal_to_overseas_territories.12.desc:0 "Мало кто надеялся, что оплот Виши в Северной Африке сменит сторону, но ярость отказа всё же потрясла нас. Назвав [This.GetLeader] предателем и безумцем, местный губернатор поклялся поддерживать правительство Виши всеми средствами."
 lar_appeal_to_overseas_territories.13.t:0 "Северная Африка переходит на нашу сторону"
 lar_appeal_to_overseas_territories.13.desc:0 "Неожиданно губернатор Французской Северной Африки приказал военным арестовать нескольких открытых сторонников Виши и заявил о поддержке нового правительства [This.GetLeader]."
 lar_france_political_violence.4.t:0 "Политическое насилие возвращается"
 lar_france_political_violence.4.desc:0 "После краткого затишья и беспрецедентного роста поддержки [This.GetLeader] вновь вспыхнуло привычное политическое насилие между коммунистами и реакционными группами. Полиция сообщает о тревожном росте политически мотивированных преступлений против людей и предприятий, напоминая о хаотичных днях, которые, как мы думали, остались позади."
 lar_france_political_violence.4.a:0 "Этих экстремистов нужно остановить."
 france.10.e:0 "Продолжить борьбу"
 lar_france_vichy_reunification.1.t:0 "[From.GetLeader] требует объединения"
 lar_france_vichy_reunification.1.desc:0 "После освобождения Парижа своими силами лидер французских войск в изгнании [From.GetLeader] потребовал передать его правительству всю полноту власти над неоккупированными районами Франции. Он заявил, что отказ будет расценён как вооружённое выступление против законного правительства Республики."
 lar_france_vichy_reunification.1.a:0 "Пора залечить этот неестественный раскол."
 lar_france_vichy_reunification.1.b:0 "Предатель не вправе ничего требовать."
 lar_france_vichy_reunification.2.t:0 "Правительство Виши распускается"
 lar_france_vichy_reunification.2.desc:0 "Правительство Виши проголосовало за самороспуск и передачу власти нам. Большинство рядовых чиновников решило остаться на местах, а оставшиеся военные силы перешли под наше командование."
 lar_france_vichy_reunification.2.a:0 "Мы снова едины."
 lar_france_vichy_reunification.3.t:0 "Правительство Виши остаётся у власти"
 lar_france_vichy_reunification.3.desc:0 "Правительство [From.GetLeader] отказалось передать нам власть. Все попытки начать переговоры были встречены молчанием, и, возможно, нам придётся принудить их силой оружия."
 lar_france_vichy_reunification.3.a:0 "Тогда мы добьёмся единства силой."
 SPA_civil_war_event_tt:0 "§GОткрывает заблокированные шаблоны дивизий.§!\n"
 SPR_civil_war_event_tt:0 "§GОткрывает заблокированные шаблоны дивизий§! и §Rрасформировывает связанные с ними части.§!\n"
 lar_spain.1.desc:2 "Несмотря на масштабную избирательную кампанию Испанской конфедерации автономных правых, похоже, победу на выборах 1936 года одержал левый Народный фронт, созданный Испанской социалистической рабочей партией и Республиканской левой при поддержке анархистов, коммунистов и профсоюзов. Сильно расколотый политический ландшафт Испании проявился в том, что перевес Народного фронта по числу голосов оказался гораздо меньше, чем его уверенное большинство мест.\n\nКакое бы новое правительство ни было сформировано под руководством президента [Root.GetLeader] в ближайшие дни и недели, ему придётся иметь дело с всё более отчуждёнными и враждебными правыми силами. Вместо того чтобы положить конец политическому насилию и общественным беспорядкам, охватившим страну, недавние выборы, вероятно, лишь усугубят ситуацию."
 lar_spain.1.a:1 "Испания выживет лишь после уничтожения фашизма!"
 lar_spain.1.b:1 "Испания может быть перекована лишь из пепла Второй республики!"
 SPR_republican_garrison_control_decisions_tt:0 "\nОткрывает решения на карте §YРасширить контроль над гарнизоном§!, позволяющие §Gпротиводействовать§! §Yвлиянию националистов§! в регионах.\n\nРегионы, в которых к началу гражданской войны националисты не обладают §Rполным§! §Yконтролем над гарнизоном§!, начнут конфликт под §Yконтролем республиканцев§!.\n"
 SPA_nationalist_garrison_control_decisions_tt:0 "\nОткрывает решения на карте §YРасширить контроль над гарнизоном§!, позволяющие §Gрасширять§! §Yвлияние националистов§! в регионах.\n\nТолько регионы, в которых к началу гражданской войны националисты обладают §Gполным§! §Yконтролем над гарнизоном§!, начнут конфликт под §Yконтролем националистов§!.\n"
 lar_spain.2.t:0 "Гражданская война в Испании"
 lar_spain.2.desc:1 "Сегодня ровно в 5 часов утра, спустя сутки после потери связи с гарнизонами в Северной Африке, по всей Испании началась тщательно подготовленная военная операция с целью захвата всех правительственных учреждений и стратегических объектов в крупных городах. Значительная часть армии, флота и авиации перестала выполнять приказы правительства, а на севере страны одновременно восстали карлистские ополчения.\n\nПолный успех переворота был предотвращён лишь неофициальными народными ополчениями, которые благодаря быстрым действиям сумели удержать многие намеченные объекты и города. Однако, несмотря на провал первоначальных целей, лидеры мятежа вряд ли добровольно откажутся от своих сильных позиций, как сделали это в 1932 году. Ни одна из сторон не склонна к компромиссу, и нынешняя ситуация может перерасти в общенациональную гражданскую войну..."
 lar_spain.2.a:1 "...которую мы выиграем единым фронтом националистов!"
 lar_spain.2.b:1 "...которую мы выиграем под руководством Фаланги!"
 lar_spain.2.c:0 "...которую мы выиграем во имя Бога, Родины и Короля!"
 lar_spain.2.d:0 "...которую мы выиграем, сохранив верность демократическим принципам!"
 lar_spain.2.e:0 "...которую мы выиграем благодаря храбрости рабочего народа!"
 lar_spain.2.f:0 "...которую мы выиграем в ходе общинной революционной борьбы!"
 lar_spain.6.t:0 "Линии фронта гражданской войны стабилизировались"
 lar_spain.6.desc:1 "Прошла всего неделя боёв, но уже становится очевидно, что сельская местность Испании плохо приспособлена для перевозки больших объёмов снаряжения. Возникают трудности со снабжением фронтов и наступлений, и они лишь усилятся, если мы продолжим сражаться повсюду одновременно."
 lar_spain.6_tt:1 "\nОткрывает решения на карте §YНаступления в гражданской войне§!, позволяющие снимать боевые штрафы §RНеподготовленного наступления§! в выбранных регионах.\n"
 lar_spain.6.a:1 "Тогда мы выждем и ударим, когда наступит подходящий момент."
 lar_spain.7.t:0 "Восстание карлистов!"
 lar_spain.7.desc:1 "Опасаясь нашего растущего влияния на Националистический фронт, карлисты утратили терпение и решили действовать самостоятельно. Их рекете обратили оружие против наших войск, продолжая при этом сражаться с общими врагами.\n\nЧего они надеются добиться этой глупостью — неизвестно, но пока они лишь укрепляют позиции республиканцев."
 lar_spain.7.desc_2:0 "Опасаясь нашего растущего влияния на молодое послевоенное правительство, карлисты утратили терпение и решили действовать самостоятельно, обратив рекете против наших войск.\n\nОни готовы поставить под угрозу с трудом одержанную победу над республиканцами ради господства над новым правительством!"
 lar_spain.7.a:1 "Их упрямство обойдётся им дороже, чем нам!"
 lar_spain.8.t:0 "Фашистские репрессии!"
 lar_spain.8.desc:1 "Недовольное нашим упорным стремлением сохранить политическую независимость руководство Фаланги решило полностью уничтожить наше движение. Фалангисты обратили оружие против рекете и попытались арестовать многих наших видных мыслителей и политиков.\n\nСвоей непримиримостью они поставили под угрозу весь Националистический фронт и, возможно, дали республиканцам столь необходимую возможность."
 lar_spain.8.desc_2:0 "Недовольное нашим стремлением сохранить влияние в послевоенном правительстве руководство Фаланги решило полностью уничтожить наше движение! Фалангисты обратили оружие против рекете и попытались арестовать многих наших видных мыслителей и политиков.\n\nОни готовы поставить под угрозу с трудом одержанную победу над республиканцами лишь бы не допустить нашего влияния на новое правительство!"
 lar_spain.8.a:1 "Их глупость обойдётся им дороже, чем нам!"
 lar_spain.9.t:0 "Восстание анархистов!"
 lar_spain.9.desc:1 "Растущая самостоятельность анархистских коммун достигла критической точки. Раздражённые нашими вполне разумными попытками сохранить централизованный контроль над ключевыми аспектами общей войны, анархисты и их союзники из ПОУМ превратили местные разногласия в полномасштабные уличные бои с нашими силами.\n\nНесмотря на локальное начало, междоусобица распространилась дальше и угрожает целостности фронта против националистов."
 lar_spain.9.desc_2:0 "Растущая самостоятельность анархистских коммун достигла критической точки. Раздражённые нашими вполне разумными попытками начать постепенное возвращение к стабильному централизованному правительству, анархисты и их союзники из ПОУМ превратили местные разногласия в полномасштабные уличные бои с нашими силами.\n\nОни готовы поставить под угрозу с трудом одержанную победу над националистами ради своих нелепых представлений о независимости!"
 lar_spain.9.a:1 "Пора вновь установить государственный контроль над этими районами."
 lar_spain.10.t:0 "Репрессии правительства!"
 lar_spain.10.desc:2 "Раздражённое нашей сохраняющейся независимостью правительство Второй республики вместе со сталинистскими союзниками попыталось захватить ключевые стратегические объекты и здания на нашей территории. Отпор этим действиям привёл к перестрелке с бывшими союзниками, которая затем переросла в полномасштабные уличные бои.\n\nНеспособность правительства к компромиссу фактически поставила нас в состояние войны с ним и значительно укрепила позиции националистов."
 lar_spain.10.desc_2:0 "Раздражённое нашей сохраняющейся независимостью правительство Второй республики вместе со сталинистскими союзниками попыталось захватить ключевые стратегические объекты и здания на нашей территории. Отпор этим действиям привёл к перестрелке с бывшими союзниками, которая затем переросла в полномасштабные уличные бои.\n\nВместо того чтобы оставить нас в покое, они готовы поставить под угрозу с трудом одержанную победу над националистами, лишь бы не идти на компромисс и не отказываться от контроля!"
 lar_spain.10.a:1 "Нашу революцию не так легко погасить!"
 lar_spain.11.t:0 "Карлисты разгромлены"
 lar_spain.11.desc:1 "Несмотря на фанатичное сопротивление, последние очаги карлистов были уничтожены нашими войсками. Конфликт значительно упростился, но борьба с оставшимися врагами продолжается."
 lar_spain.11.a:1 "Но мы продвигаемся вперёд."
 lar_spain.12.t:0 "Фаланга разгромлена"
 lar_spain.12.desc:1 "После падения последнего крупного оплота силы Фаланги начали массово сдаваться. Несмотря на отдельные очаги сопротивления, организованные вооружённые силы Фаланги перестали существовать. Конфликт значительно упростился, но борьба с оставшимися врагами продолжается."
 lar_spain.13.t:1 "Националисты разгромлены"
 lar_spain.13.desc:1 "После очередного военного поражения националистов генерал Франко объявил о капитуляции всех своих сил. Конфликт значительно упростился, но борьба с оставшимися врагами продолжается."
 lar_spain.14.t:1 "Анархисты разгромлены"
 lar_spain.14.desc:1 "Сопротивление анархистов, хотя и яростное, в последние недели становилось всё более разрозненным. Сегодняшняя победа наконец заставила Совет обороны безоговорочно капитулировать, хотя отдельные коммуны продолжают сражаться, отказываясь подчиняться приказу. Конфликт значительно упростился, но борьба с оставшимися врагами продолжается."
 lar_spain.15.t:1 "ПОУМ разгромлена"
 lar_spain.15.desc:1 "Сопротивление ПОУМ, хотя и яростное, в последние недели становилось всё более разрозненным. Сегодняшняя победа наконец заставила коммунистическое руководство безоговорочно капитулировать, и наши войска начали входить в оставшиеся без защиты опорные пункты. Конфликт значительно упростился, но борьба с оставшимися врагами продолжается."
 lar_spain.16.t:0 "Вторая республика разгромлена"
 lar_spain.16.desc:1 "После серии недавних поражений и сокращения контролируемой территории до небольшой части полуострова военные руководители Второй республики свергли правительство и запросили мира. Это вызвало новое коммунистическое восстание, призванное предотвратить капитуляцию, однако оставшиеся республиканские силы разгромили мятежников и, не имея иного выхода, согласились на безоговорочную сдачу.\n\nКонфликт значительно упростился, но борьба с оставшимися врагами продолжается."
 lar_spain.17.t:0 "Сталинисты разгромлены"
 lar_spain.17.desc:1 "После серии недавних поражений и сокращения контролируемой территории до небольшой части полуострова коммунистические военные руководители наконец запросили мира. Конфликт значительно упростился, но борьба с оставшимися врагами продолжается."
 lar_spain.18.t:0 "Мятеж выжидает"
 lar_spain.18.desc:1 "Наши планы завершены, и мы готовы начать переворот. Однако, чтобы не повторить жалкий провал Санджурхада 1932 года, следует дождаться наиболее благоприятной политической обстановки. Мы потратим ресурсы на сокрытие следов и дождёмся подходящего момента..."
 lar_spain.18.a:1 "Но слишком долго медлить нельзя."
 lar_spain.18.a_tt:0 "Этот национальный дух будет удалён после начала гражданской войны.\n"
 lar_spain.19.t:0 "[From.GetNameDefCap] требует подчинения"
 lar_spain.19.desc:0 "Дипломаты [From.GetAdjective] потребовали подчинить нашу внешнюю политику их интересам, заявив, что [From.GetNameDef] «возьмёт на себя руководство испаноязычным миром» в глобальных вопросах."
 lar_spain.19.a:0 "Нам нужен сильный лидер — почему бы не они?"
 lar_spain.19.b:0 "Мы способны сами защищать собственные интересы."
 lar_spain.20.t:0 "[From.GetNameDefCap] подчиняется"
 lar_spain.20.desc:0 "По нашему настоянию правительство [From.GetAdjective] признало наше руководство в международных вопросах, касающихся испаноязычного мира."
 lar_spain.20.a:0 "Мы приведём их к славе."
 lar_spain.21.t:0 "[From.GetNameDefCap] отвергает требования"
 lar_spain.21.desc:0 "Несмотря на наше давление, правительство [From.GetAdjective] отказалось признать наше руководство в международных вопросах испаноязычного мира. Оно продолжит проводить собственную внешнюю политику."
 lar_spain.21.a:0 "Тогда мы силой покажем им преимущества нашего руководства."
 lar_spain.22.t:0 "[From.GetNameDefCap] просит помощи"
 lar_spain.22.desc:0 "Правительство [From.GetAdjective] запросило материальную помощь в борьбе против республиканцев. Гражданская война оказалась особенно разрушительной и истощает их запасы. Они уверяют, что любая поддержка окажется бесценной для разгрома коммунистической угрозы."
 lar_spain.22.a:0 "Мы должны оказать им всю возможную помощь."
 lar_spain.22.b:0 "Сейчас у нас нет ничего лишнего."
 lar_spain.23.t:0 "[From.GetNameDefCap] отправляет помощь"
 lar_spain.23.desc:0 "Правительство [From.GetAdjective] сообщило, что направит материальную поддержку для нашей борьбы с коммунизмом."
 lar_spain.23.a:0 "Мы не забудем их помощь."
 lar_spain.24.t:0 "[From.GetNameDefCap] не отправляет помощи"
 lar_spain.24.desc:0 "Дипломаты [From.GetAdjective] сообщили, что, к сожалению, сейчас не могут оказать нам помощь."
 lar_spain.24.a:0 "Они почивают на лаврах, пока коммунизм сдерживают испанской кровью."
 lar_spain.25.t:0 "Иберийский пакт"
 lar_spain.25.desc:0 "Эмиссары [From.GetAdjective] предложили соглашение, которое укрепит взаимную оборону и сохранит мир на Иберийском полуострове.\n\nПакт обязывает каждую сторону вступить в любой альянс, членом которого станет другая, а также присоединяться к одной стороне в любом конфликте, в который вступит партнёр — как агрессор или как жертва нападения."
 lar_spain.25.a:0 "Такой пакт неизмеримо укрепит наши отношения."
 lar_spain.25.b:0 "Мы должны сохранить свободу действий."
 lar_spain.26.desc:0 "[From.GetNameDefCap] сообщает, что полностью принимает предложенный Иберийский пакт. Отныне оно будет стоять рядом с нами в любом союзе или войне."
 lar_spain.26.a:0 "Они действительно верные друзья."
 lar_spain.27.desc:0 "[From.GetNameDefCap] сообщает, что отвергает предложенный Иберийский пакт, поскольку опасается чрезмерного ограничения самостоятельности во внешней политике."
 lar_spain.27.a:0 "Они ослабляют себя, даже не понимая этого."
 lar_spain.28.t:0 "Иберийский пакт вступает в силу"
 lar_spain.28.desc:2 "Государство [iberian_pact_invitee.GetNameDefCap] было принято в [iberian_pact_invitee.GetFactionName], и теперь, ради сохранения мира на Иберийском полуострове, пришло время выполнить нашу часть соглашения и также вступить в этот альянс."
 lar_spain.28.a:0 "Мы связаны обязательством."
 lar_spain.29.desc:1 "Время пришло. Государство [iberian_pact_war_target.GetNameDefCap] вступило в войну со своими врагами, и согласно условиям пакта мы обязаны присоединиться к нему и выступить единым фронтом против внешнего мира."
 lar_spain.30.t:0 "Латинский блок"
 lar_spain.30.desc:0 "Поскольку наше сотрудничество неуклонно расширяется, правительство [From.GetAdjective] предложило полноценный союз, который помимо нас и Испании может также включать Италию и Францию."
 lar_spain.30.a:0 "Превосходная идея."
 lar_spain.30.b:0 "Союз с этими странами сейчас не отвечает нашим интересам."
 lar_spain.31.desc:0 "Правительство [From.GetAdjective] сообщает, что принимает предложение о создании Латинского блока."
 lar_spain.31.a:0 "Они станут бесценным членом этого молодого союза."
 lar_spain.32.desc:0 "Правительство [From.GetAdjective] сообщает, что сейчас не заинтересовано во вступлении в латинский союз."
 lar_spain.32.a:0 "Возможно, позднее они изменят мнение."
 lar_spain.33.t:0 "Испанский военный союз"
 lar_spain.33.desc:0 "У карлистского дела всё ещё есть союзники среди военных. Координация с ними и получение их помощи значительно повысят шансы нашего восстания на успех."
 lar_spain.33.a:0 "Заручиться поддержкой союзников из Испанского военного союза в регионе [union_militar_target_state_1.GetName]."
 lar_spain.33.b:0 "Заручиться поддержкой союзников из Испанского военного союза в регионе [union_militar_target_state_2.GetName]."
 lar_spain.33.c:0 "Заручиться поддержкой союзников из Испанского военного союза в регионе [union_militar_target_state_3.GetName]."
 lar_spain.33_tt:0 "С началом карлистского восстания будут созданы 5 хорошо обученных отрядов рекете с §Y3 пехотными§! батальонами.\n"
 lar_spain.34.t:0 "Вопрос престолонаследия"
 lar_spain.34.desc:0 "Со смертью бездетного Альфонсо Карлоса карлистская линия пресеклась, что привело к расколу в карлистском движении.\n\nОдни готовы поддержать назначенного самим Альфонсо Карлосом преемника — Хавьера Бурбон-Пармского, хотя у него нет династических прав на престол. Другие предпочитают притязания изгнанного короля Альфонсо XIII, который, несмотря на происхождение от предательской линии Изабеллы II, всё же обладает династическим правом на корону.\n\nЕсли не решить этот вопрос быстро, наша поддержка может расколоться на враждующие лагеря."
 lar_spain.34.a:0 "Воля короля должна быть исполнена. Хавьер станет нашим новым королём!"
 lar_spain.34.a_tt:0 "После восстановления монархии королём станет Хавьер Бурбон-Пармский.\n"
 lar_spain.34.b:0 "Династическая преемственность должна быть сохранена. Альфонсо XIII станет нашим королём!"
 lar_spain.34.b_tt:0 "После восстановления монархии королём станет Альфонсо XIII.\n"
 lar_spain.34.c:0 "Габсбургский претендент доказал, что достоин престола"
 lar_spain.34.c_tt:0 "После восстановления монархии королём станет Карл Пий Габсбург.\n"
 SPB_karl_pius_king:0 "Карл Пий Габсбург"
 lar_spain.35.t:0 "Восстановление монархии"
 lar_spain.35.desc:1 "После более чем полувека без монарха ликование встречавшей толпы в Мадриде было трудно сдержать, когда [From.GetSPBkingloc] сегодня утром въехал в город. Под восторженные крики зрителей королевская процессия прошла по улицам Мадрида к церкви Сан-Херонимо-эль-Реаль.\n\nНа пышной церемонии [From.GetSPBking2loc].\n\nХотя значительная часть страны всё ещё лежит в руинах, возможно, новый король станет объединяющей и исцеляющей силой и поведёт [From.GetNameDef] к более славному будущему."
 SPB_xavier_king:0 "Хавьер Бурбон-Пармский"
 SPB_alfonso_king:0 "Альфонсо XIII"
 SPB_xavier_king2:0 "Хавьер принял корону и королевское имя Хавьера I, наконец возведя на испанский престол наследника законной карлистской линии"
 SPB_alfonso_king2:0 "Альфонсо XIII после долгих лет изгнания вернулся на испанский престол, положив конец столетию кровопролития и наконец объединив две линии наследования"
 lar_spain.35.a:0 "Сегодня исправлена столетняя несправедливость. Да здравствует король!"
 lar_spain.36.t:0 "Оккупация Танжера"
 lar_spain.36.desc:0 "Грубо нарушив Танжерский протокол 1924 года, войска [From.GetAdjective] вошли в Международную зону Танжера как фактические оккупационные силы. Несмотря на призывы испанских националистов напрямую аннексировать территорию, правительство [From.GetAdjective] уверяет нас, что это лишь «временная мера военного времени» и после войны город вернётся к прежнему статусу."
 lar_spain.36.a:0 "Если мы не защитим права жителей Танжера, то кто это сделает?"
 lar_spain.36_tt:0 "Если §Y[SPA.GetName]§! не отступит, мы получим:\n"
 lar_spain.36.b:0 "Пока их обещания нам достаточно."
 lar_spain.37.desc:0 "[FROM.GetNameDefCap] выразило резкий официальный протест против нашей оккупации Танжера. Оно считает наши действия незаконными и даже намекнуло на применение военной силы для изгнания нас из Международной зоны, если мы немедленно не отступим."
 lar_spain.37.a:0 "Нас не запугать их пустыми угрозами."
 lar_spain.37.b:0 "Тогда нам придётся отступить."
 lar_spain.38.desc:0 "Как и ожидалось, слабое правительство [From.GetAdjective] не осмелилось оспорить нашу оккупацию Танжера. Теперь мы можем теснее интегрировать город в состав страны."
 lar_spain.38.a:0 "Танжер снова испанский!"
 lar_spain.39.t:0 "[From.GetNameDefCap] требует Северную Африку"
 lar_spain.39.desc:0 "Дипломаты [From.GetAdjective] передали нам ультиматум, потребовав немедленно передать контроль над Северной Африкой государству [From.GetNameDef]. Очевидно, они намерены воспользоваться слабостью нашего нынешнего международного положения..."
 lar_spain.39.a:0 "Мы не можем позволить себе ещё одну войну. Придётся согласиться."
 lar_spain.39.b:0 "Так легко они её не получат!"
 lar_spain.40.t:1 "[From.GetNameDefCap] принимает требования"
 lar_spain.40.desc:0 "[From.GetNameDefCap] приняло наши требования, и его дипломаты заверили нас, что уже готовят немедленную передачу контроля над Северной Африкой."
 lar_spain.40.a:0 "Очень оперативно."
 lar_spain.41.t:0 "[From.GetNameDefCap] отвергает требования"
 lar_spain.41.desc:0 "Дипломаты [From.GetAdjective] сообщили, что категорически отвергают все испанские требования относительно Северной Африки."
 lar_spain.41.a:0 "Тогда придётся забрать её силой."
 lar_spain.42.t:0 "[From.GetNameDefCap] претендует на французский престол"
 lar_spain.42.desc:0 "Недавно заняв испанский престол, король [From.GetLeader] уже ясно обозначил намерение получить и французскую корону, ссылаясь на свои легитимистские права.\n\nПосле недавней политической победы легитимистов в нашей стране король счёл момент подходящим и официально заявил о желании как можно скорее короноваться в Реймсе."
 lar_spain.42.a:0 "Его притязания законны — мы охотно принимаем. Да здравствует король!"
 lar_spain.42.b:0 "Франция никогда не подчинится Испании!"
 lar_spain.43.t:0 "[From.GetNameDefCap] признаёт притязания"
 lar_spain.43.desc:0 "Легитимистское правительство [From.GetAdjective] рассмотрело просьбу короля [Root.GetLeader] и официально сообщило, что признаёт его законные права на французскую корону. Оно заверяет, что немедленно начнёт подготовку к церемонии коронации."
 lar_spain.43.a:0 "Всё идёт как должно."
 lar_spain.43_tt:0 "Начнётся подготовка к коронации."
 lar_spain.44.t:0 "[From.GetNameDefCap] отвергает притязания"
 lar_spain.44.desc:0 "Несмотря на законные права короля [Root.GetLeader] на французскую корону, правительство [From.GetAdjective], похоже, в последний момент струсило. Сославшись на опасения общественных беспорядков из-за возможного испанского контроля над Францией, оно «с сожалением отклонило» проведение официальной коронации."
 lar_spain.44.a:0 "[Root.GetLeader] всё равно станет королём Франции."
 lar_spain.45.t:0 "Иберийская уния"
 lar_spain.45.desc:0 "Как и в 1580–1640 годах, [From.GetNameDef] предлагает объединить наши страны под властью [From.GetLeader]. Дипломаты [From.GetAdjective] призывают нас задуматься о силе, которую единая Иберия под руководством одного правителя сможет продемонстрировать миру."
 lar_spain.45.a:0 "Их слова мудры."
 lar_spain.45.b:0 "Португалия никогда добровольно не подчинится испанцам!"
 lar_spain.46.t:0 "Иберийская уния — [From.GetNameDefCap] соглашается"
 lar_spain.46.desc:0 "[From.GetNameDefCap] приняло наше предложение объединить Иберию под руководством [Root.GetLeader]. Оно уже готовит необходимые меры для интеграции своего государственного аппарата в наш."
 lar_spain.46.a:0 "Они сделали мудрый выбор. Вместе мы сильнее!"
 lar_spain.47.t:0 "Иберийская уния — [From.GetNameDefCap] отказывается"
 lar_spain.47.desc:0 "[From.GetNameDefCap] отвергло любые идеи объединения Иберийского полуострова под единым руководством. Несмотря на долгие переговоры, позицию делегации [From.GetAdjective] можно свести к словам: «попробуйте забрать, если хватит сил»."
 lar_spain.47.a:0 "Их предложение приемлемо."
 lar_spain.48.t:0 "Португальский анархизм"
 lar_spain.48.desc:0 "В последние дни боевые действия в государстве [From.GetNameDef] перекинулись на приграничные районы [Root.GetAdjective], и анархистские ополчения [From.GetAdjective] быстро начали привлекать единомышленников из местных городов. Несмотря на быстрые действия пограничных сил, жестокость боёв застала их врасплох, и после первых столкновений с закалёнными силами [From.GetAdjective] по обе стороны гражданской войны они были вынуждены отступить.\n\nС тех пор поддержка анархистского дела [From.GetAdjective] всё шире распространяется в обществе [Root.GetAdjective], очевидно, во многом благодаря тайной иностранной помощи.\n\nВ результате, несмотря на все наши усилия, страна фактически оказалась втянута в более масштабную гражданскую войну [From.GetAdjective]."
 lar_spain.48.a:0 "Зачем они вообще втянули нас в это?!"
 lar_spain.49.desc:0 "С тех пор как боевые действия [Root.GetAdjective] перекинулись через границу [From.GetAdjective], местные сторонники анархизма массово присоединяются к нашему делу. Благодаря хорошо спланированному и проведённому «поощрению» анархистские настроения распространились среди молодёжи [From.GetAdjective] словно пожар.\n\nПосле передачи оружейных складов [Root.GetAdjective] этим анархистским ячейкам [From.GetAdjective] положение в государстве [From.GetNameDef] обострилось настолько, что правительство уже подавляет полномасштабное восстание. Его лидеры запросили нашу официальную прямую помощь, предложив нам возглавить мировую анархистскую борьбу и формально присоединиться после окончания боёв."
 lar_spain.49.a:0 "Мы с радостью приветствуем их поддержку анархистского дела!"
 lar_spain.50.t:0 "Португальский анархизм — гражданская война окончена"
 lar_spain.50.desc:0 "С благоприятным заключением о [From.GetAdjective] Часть нашей анархической борьбы, [From.GetAdjective] Теперь ячейки просят принять их в Совет обороны."
 lar_spain.50.a:0 "Мы возьмём их под свою защиту."
 lar_spain.51.t:0 "Переместить золотой запас"
 lar_spain.51.desc:0 "Золотому запасу страны угрожает наступление националистов. Нужно принять меры и безопасно вывезти его за границу, чтобы он не попал в руки врага."
 lar_spain.51.a:0 "Мы отправим его в [SOV.GetNameDef]."
 lar_spain.51.b:0 "Мы отправим его в [SPR_relocated_gold_reserves_selection_1.GetNameDefCap]."
 lar_spain.51.c:0 "Мы отправим его в [SPR_relocated_gold_reserves_selection_2.GetNameDefCap]."
 lar_spain.51.d:0 "Мы отправим его в [SPR_relocated_gold_reserves_selection_3.GetNameDefCap]."
 lar_spain.52.t:0 "[From.GetNameDefCap] перемещает золотой запас"
 lar_spain.52.desc:0 "В нашу страну начали прибывать грузы из [From.GetNameDef]: правительство [From.GetAdjective] вывозит золотой запас за границу на хранение до окончания гражданской войны."
 lar_spain.52.a:0 "Возможно, это открывает новые возможности..."
 lar_spain.53.t:0 "Испанский золотой запас"
 lar_spain.53.desc:0 "С тех пор как золотой запас [From.GetAdjective] прибыл в нашу страну, прошло немало времени, а мы продолжаем отправлять государству [From.GetNameDef] значительную помощь без оплаты. Члены правительства всё чаще отмечают абсурдность подобного положения."
 lar_spain.53.a:0 "Мы конфискуем золотой запас в счёт «оплаты»."
 lar_spain.53.b:0 "Победа [SPD.GetAdjective] сама по себе станет достаточной платой."
 lar_spain.54.t:0 "Золотой запас конфискован!"
 lar_spain.54.desc:1 "Наши дипломаты в [From.GetNameDef] сообщили, что правительство [From.GetAdjective] конфисковало наш золотой запас! По их словам, оно даже не сочло нужным направить официальное уведомление, заявив, что это «само собой разумеющаяся мера» для получения «просроченной оплаты» за материальную помощь."
 lar_spain.54.a:0 "Как они смеют?!"
 lar_spain.54.a_tt:0 "§RЭто повлияет на нашу экономику после гражданской войны!§!\n"
 lar_spain.55.t:0 "Нехватка государственного финансирования"
 lar_spain.55.desc:0 "После конфискации золотого запаса мы столкнулись с немедленной нехваткой золота для финансирования восстановления страны. Инвестиции в государственный сектор, к сожалению, придётся отложить."
 lar_spain.55.a:0 "Это прискорбно..."
 lar_spain.56.t:0 "[From.GetNameDefCap] просит расширить автономию"
 lar_spain.56.desc:0 "Хотя представители [From.GetAdjective] стремятся и дальше доказывать верность и участвовать в революции, они обратились с просьбой расширить автономию. Они утверждают, что при ослаблении контроля смогут гораздо эффективнее помогать нашему делу."
 lar_spain.56.a:0 "Они заслужили наше доверие."
 lar_spain.56.b:0 "Но держать поводья крепко ещё лучше."
 lar_spain.57.t:0 "[From.GetNameDefCap] предоставляет автономию"
 lar_spain.57.desc:0 "Наши представители в [From.GetNameDef] сообщили, что правительство [From.GetAdjective] сочло возможным предоставить нам больше автономии."
 lar_spain.57.a:0 "Прогресс!"
 lar_spain.58.t:0 "[From.GetNameDefCap] отказывает в автономии"
 lar_spain.58.desc:0 "Наши представители в [From.GetNameDefCap] сообщили, что правительство [From.GetAdjective] отклонило нашу просьбу о расширении автономии."
 lar_spain.58.a:0 "Разве они нам не доверяют?"
 lar_spain.59.t:0 "Красная Иберия"
 lar_spain.59.desc:0 "Учитывая общность наших идеологических интересов, [From.GetNameDefCap] направило послов с предложением объединить Иберию. Оно предлагает забыть разногласия и объединить силы под руководством [From.GetAdjective], чтобы надёжнее обеспечить успех нашей Иберийской революции."
 lar_spain.59.a:0 "Дело рабочих значительно укрепится!"
 lar_spain.59.b:0 "Мы лучше распространим революцию собственными силами."
 lar_spain.60.t:0 "Красная Иберия — [From.GetNameDefCap] соглашается"
 lar_spain.60.desc:0 "[From.GetNameDefCap] одобрило наше предложение и согласилось с идеей единой социалистической Иберии."
 lar_spain.60.a:0 "В единстве наша сила."
 lar_spain.61.t:0 "Красная Иберия — [From.GetNameDefCap] отказывается"
 lar_spain.61.desc:0 "[From.GetNameDefCap] прямо отвергло наше предложение об объединённой социалистической Иберии. Признав общность многих интересов, оно всё же считает, что нам лучше добиваться их как двум независимым государствам."
 lar_spain.61.a:0 "Они ещё не понимают, насколько ошибаются."
 lar_spain.62.t:0 "Коммунистическое восстание!"
 lar_spain.62.desc:0 "Непрерывное вмешательство государства [From.GetAdjective] и подпольные ячейки, получающие незаконную поддержку из [From.GetNameDef], в последние месяцы придали смелости местным коммунистическим группам, с которыми мы боролись годами. Несомненно рассчитывая на дальнейшую зарубежную помощь, они взялись за оружие, а к ним присоединились нелояльные элементы армии. Началось крупное восстание с целью силой захватить правительство."
 lar_spain.62.a:0 "Мы подавим этот мятеж!"
 lar_spain.63.t:0 "Коммунистическое восстание в государстве [From.GetNameDefCap]!"
 lar_spain.63.desc:0 "Как и ожидалось, благодаря удачно направленной материальной поддержке коммунистические группы, давно тревожившие правительство [From.GetAdjective], осмелились перейти к действиям. Масштабное восстание стремится захватить власть, но сильно зависит от нашей поддержки. Его лидеры полны идеализма и рвения, однако почти не имеют опыта гражданской войны и теперь просят нас о руководстве и помощи."
 lar_spain.63.a:0 "И они её получат!"
 lar_spain.64.t:0 "[From.GetNameDefCap] просит помощи"
 lar_spain.64.desc:0 "Хотя политическое положение в государстве [From.GetNameDef] давно было нестабильным, серьёзность конфликта, похоже, застала правительство [From.GetAdjective] врасплох. Оно просит любую помощь, которую мы способны предоставить в борьбе против фашизма, и призывает не медлить в этот критический момент.\n\nСомнительно, что республиканское правительство сможет победить в гражданской войне без иностранной поддержки. Победа демократической Испании была бы желательна, но оказание помощи, вероятно, воодушевит коммунистических сторонников в нашей собственной стране."
 lar_spain.64.a:0 "Они рассчитывают на нас, и мы обязаны помочь, даже рискуя собой."
 lar_spain.64.b:0 "Мы не можем рисковать собственной политической стабильностью ради них."
 lar_spain.65.t:0 "[From.GetNameDefCap] оказывает помощь"
 lar_spain.65.desc:0 "Правительство [From.GetAdjective] сообщает, что отправит нам первую символическую партию помощи. Она важна для поднятия боевого духа, хотя её реальное материальное значение ничтожно. Французы уверяют, что изучают способы оказать более существенную поддержку в будущем."
 lar_spain.65.a:0 "Прекрасные новости!"
 lar_spain.66.t:0 "[From.GetNameDefCap] отклоняет просьбу"
 lar_spain.66.desc:0 "Французы сообщили, что, к сожалению, не способны отправить нам помощь, поскольку это поставит под угрозу их внутреннюю политическую стабильность."
 lar_spain.66.a:0 "И они считают, что ещё одна граница с фашистами её не поставит?"
 lar_spain.67.t:0 "Война за независимость государства [From.GetAdjective]!"
 lar_spain.67.desc:0 "Похоже, правительство [From.GetAdjective] быстро забыло, кому обязано недавней победой в гражданской войне. Сегодня утром вся связь с нашими представителями в государстве [From.GetNameDef] была внезапно прервана, а государственные СМИ передали заявление [From.GetLeader], наполненное пропагандой и явно призванное мобилизовать народ [From.GetAdjective] на новую войну.\n\nПозже этим утром в Москву была доставлена официальная декларация независимости."
 lar_spain.67.a:0 "Мы сокрушим это неповиновение!"
 lar_spain.67.b:0 "У нас нет выбора, кроме как признать это."
 lar_spain.68.t:0 "[From.GetNameDefCap] просит помощи"
 lar_spain.68.desc:0 "[From.GetNameDefCap] обратилось к нам с просьбой о материальной помощи в войне за независимость против [SOV.GetNameDef]."
 lar_spain.68.a:0 "И оно её получит."
 lar_spain.68.b:0 "Мы не можем рисковать отношениями с Советами."
 lar_spain.69.t:0 "[From.GetNameDefCap] предоставляет помощь"
 lar_spain.69.desc:0 "[From.GetNameDefCap] услышало наш призыв о помощи и предложило значительно расширить наше участие в своих программах ленд-лиза."
 lar_spain.69.a:0 "Это очень хорошие новости."
 lar_spain.70.t:0 "[From.GetNameDefCap] отказывает в помощи"
 lar_spain.70.desc:0 "[From.GetNameDefCap] сообщило, что сейчас не может оказать нам поддержку, главным образом опасаясь последствий для внутреннего и международного общественного мнения, если станет известно о помощи нашему делу."
 lar_spain.70.a:0 "Они бросили нас во второй раз."
 lar_spain.71.t:0 "[From.GetNameDefCap] предлагает пакт о ненападении"
 lar_spain.71.desc:0 "Поскольку мы оба воюем с коммунистами, [From.GetNameDefCap] предложило заключить пакт о ненападении. Это позволит сосредоточиться на более насущной красной угрозе и временно забыть разногласия."
 lar_spain.71.a:0 "По сравнению с уничтожением [SOV.GetNameDef] всё остальное второстепенно."
 lar_spain.71.b:0 "Договор с республиканцами? Никогда!"
 lar_spain.72.t:0 "[From.GetNameDefCap] заключает пакт о ненападении"
 lar_spain.72.desc:0 "Правительство [From.GetAdjective] благоразумно согласилось на наше предложение о пакте ненападения. Он вступает в силу немедленно."
 lar_spain.72.a:0 "Они признают более серьёзную угрозу."
 lar_spain.73.t:0 "[From.GetNameDefCap] отклоняет пакт о ненападении"
 lar_spain.73.desc:0 "[From.GetNameDefCap] рассмотрело наше предложение о пакте ненападения, но сообщило, что в данный момент не считает его отвечающим своим интересам."
 lar_spain.73.a:0 "Что они замышляют?"
 lar_spain.74.t:0 "[From.GetNameDefCap] просит помощи"
 lar_spain.74.desc:0 "Государство [From.GetAdjective] попросило нашей помощи в войне против [SOV.GetNameDef]. Оно заверяет, что многого не требуется: даже обмен важными разведданными или помощь в подготовке командного состава к противодействию тактике [SOV.GetAdjective] окажутся бесценными."
 lar_spain.74.a:0 "Прекрасная идея. Смерть Советам!"
 lar_spain.74.b:0 "Мы должны ревниво хранить свои преимущества."
 lar_spain.75.t:0 "[From.GetNameDefCap] оказывает помощь"
 lar_spain.75.desc:1 "Рассмотрев нашу просьбу, [From.GetNameDef] предложило направить военных экспертов для обучения нашего командного состава эффективному противодействию стратегиям [SOV.GetAdjective], с которыми они уже сталкивались, а также предоставить отдельные ценные разведывательные сведения."
 lar_spain.75.a:0 "Это окажется бесценным в нашей борьбе против Советов."
 lar_spain.76.t:0 "[From.GetNameDefCap] отказывает в помощи"
 lar_spain.76.desc:0 "Несмотря на наши просьбы, [From.GetNameDef] отказалось оказать какую-либо помощь в борьбе с Советами. Любые попытки получить от них полезные сведения о советском фронте также натолкнулись на стену молчания."
 lar_spain.76.a:0 "Они ревниво хранят все свои секреты."
 lar_spain.77.t:0 "Смерть Альфонсо XIII"
 lar_spain.77.desc1:0 "Последний правивший Испанией король Альфонсо XIII, живший в изгнании с момента провозглашения Второй республики в 1931 году, сегодня скончался в Риме. Он умер от сердечного заболевания в сравнительно молодом возрасте. Из-за изгнания и нынешнего положения в государстве [Root.GetNameDef] ожидается, что его похоронят в самом Риме.\n\nПервый и второй сыновья Альфонсо ещё в 1933 году отказались от прав на престол, поэтому наследником, казалось бы, должен стать третий сын — инфант Хуан. Однако ходят слухи, что второй сын покойного короля, инфант Хайме, намерен вновь заявить о своих правах наследования."
 lar_spain.77.desc2:0 "Сегодня в Мадриде неожиданно скончался король Альфонсо XIII после приступа сильной боли в груди. Вскоре его тело будет выставлено для прощания в церкви Сан-Херонимо-эль-Реаль, чтобы народ смог отдать последние почести перед королевскими похоронами.\n\nРанее второй сын короля, инфант Хайме, отказался от прав наследования из-за глухоты, однако уже через несколько часов после смерти отца поспешил вновь заявить претензии на престол. При подавляющей поддержке карлистов его младший брат, инфант Хуан, едва ли сможет оспорить это требование."
 lar_spain.77.a:0 "Король умер. Да здравствует король!"
 lar_spain.78.t:0 "Смерть Санхурхо"
 lar_spain.78.desc:0 "Всего через несколько дней после начала гражданской войны нашу сторону постигла трагедия: выбранный руководитель переворота Хосе Санхурхо погиб в авиакатастрофе по пути из Португалии, где он должен был принять командование националистическими силами в Испании.\n\nПохоже, желая после более чем двух лет изгнания произвести по возвращении на испанскую землю впечатление «отважного авиатора», генерал настоял на полёте в небольшом самолёте вместо доступных более крупных машин, а затем перегрузил его, потребовав взять весь тяжёлый багаж.\n\nСамолёт разбился сразу после взлёта, и Санхурхо погиб мгновенно, оставив националистическое руководство сборищем враждующих генералов, соперничающих за власть."
 lar_spain.78.a:0 "Он рискнул слишком многим."
 lar_spain.78_tt:0 "§YХосе Санхурхо погибает.§!\n"
 lar_spain.79.t:0 "Коронация [Root.GetLeader]"
 lar_spain.79.desc:0 "Сегодня в Реймсском соборе при большом стечении народа и пышных торжествах состоялась коронация короля [Root.GetLeader]. После официальной церемонии монарх приветствовал ликующую толпу у собора, восторженно встречавшую возвращение страны к монархии.\n\nВ речи к подданным король подчеркнул единство Франции и Испании, воплощённое в его особе. Где бы в мире ни оказались под угрозой интересы француза, рядом с ним будет испанец, готовый защищать его дело."
 lar_spain.79.a:0 "Великий день для королевства!"
 lar_spain.81.t:0 "Цена победы"
 lar_spain.81.desc:0 "Из-за масштабности нашего участия в гражданской войне в Испании наше влияние на правительство [SPD.GetAdjective] выросло настолько, что оно фактически стало государством-сателлитом Москвы."
 lar_spain.81.a:0 "Наше влияние в Западной Европе растёт!"
 lar_spain.82.t:0 "Цена победы"
 lar_spain.82.desc:0 "Мы победили в гражданской войне, но из-за сильной зависимости от советской помощи накопили огромный долг, который необходимо выплатить. Хаос военного времени также позволил сталинистам занять ключевые должности в новой армии и правительстве. Мы оказались в трудном положении.\n\nМосква уже начала делать «предложения» о назначении лояльных ей министров и офицеров, и пока мы не можем сопротивляться без тяжёлых экономических последствий или даже риска новой гражданской войны. Чтобы обрести настоящую независимость, придётся действовать осторожно: либо доказать верность, либо сначала подорвать и уничтожить сталинистское влияние в государстве."
 lar_spain.82.a:0 "Посмотрим, долго ли продлится такое положение."
 lar_spain.83.t:0 "Признаки предательства"
 lar_spain.83.desc:0 "В последние недели нашим связным, представителям и верным сталинистским министрам и офицерам в государстве [SPD.GetNameDef] неоднократно отказывали в важной информации и доступе к правительственным и военным должностным лицам [SPD.GetAdjective]. Теперь стало известно, что наших людей систематически отстраняют от влиятельных постов, а программы иностранной помощи намеренно блокируют.\n\n«Совпадения» такой частоты не могут быть случайностью. Правительство [SPD.GetAdjective] демонстрирует явные признаки предательства и стремление отказаться от обязательств перед [SOV.GetNameDef], а в Москве всё громче звучат призывы к карательным мерам и ужесточению контроля."
 lar_spain.83.a:0 "Мы пошлём сигнал, создав оккупационную зону в Каталонии."
 lar_spain.83.b:0 "Всё наверняка уладится без нашего вмешательства."
 lar_spain.84.t:1 "Каталонская оккупационная зона"
 lar_spain.84.desc:0 "Терпение Москвы в отношении нашего систематического сопротивления попыткам усилить контроль над правительством иссякло. Советы в одностороннем порядке создали оккупационную зону в Каталонии, Валенсии и части Арагона с номинально независимым правительством, которое фактически не обладает властью. Верные Москве коммунистические силы стекаются в эту новую зону и клянутся поддерживать промосковское «правительство».\n\nСмысл ясен: либо мы подчиняемся указаниям Москвы, либо последуют новые карательные действия. До завершения наших планов они вряд ли успеют значительно расширить влияние, но вытеснить советский контроль с наших земель будет непросто."
 lar_spain.84.a:0 "Напряжение растёт. Мы должны быстро осуществить планы!"
 lar_spain.85.t:0 "[SPD.GetNameDefCap] возвращает регион [SPR_stolen_state_name.GetName]"
 lar_spain.85.desc:0 "Наши силы полностью взяли под контроль регион [SPR_stolen_state_name.GetName], изгнали сторонников Советов и местное промосковское руководство и быстро восстанавливают там местную администрацию [SPD.GetAdjective]."
 lar_spain.85.a:0 "Мы избавляем страну от сталинистского влияния, регион за регионом!"
 lar_spain.88.t:0 "[SPD.GetNameDefCap] возвращает регион [SPR_stolen_state_name.GetName]"
 lar_spain.88.desc:0 "Силы [SPD.GetAdjective] полностью взяли под контроль регион [SPR_stolen_state_name.GetName], изгнали наших сторонников и местное промосковское руководство и быстро восстанавливают там собственную администрацию."
 lar_spain.88.a:0 "Победа в одном сражении ещё не означает победы в войне."
 lar_spain.89.t:0 "[From.GetNameDefCap] принимает требования"
 lar_spain.89.desc:0 "Неожиданно правительство [From.GetAdjective] отступило и согласилось с нашими требованиями независимости. Похоже, оно не желает ввязываться ещё в один конфликт на западе Европы."
 lar_spain.89.a:0 "Они всё равно проиграли бы."
 lar_spain.90.t:0 "Отставка Нисето Алькала-Саморы"
 lar_spain.90.desc:0 "Борьба за власть между различными левыми партиями, совсем недавно объединёнными победой на выборах 1936 года, уже достигла кульминации. Опасаясь центристской и компромиссной политики президента Нисето Алькала-Саморы, его бывшие сторонники в кортесах объявили неконституционным сам роспуск кортесов, приведший к выборам, и отстранили его от должности.\n\nВместо Алькала-Саморы кортесы избрали его давнего соперника Мануэля Асанью, которому досталась незавидная задача вернуть стабильность всё более поляризованной политической жизни Испании."
 lar_spain.90.a:0 "Хаос стал полным."
 SPR_spanish_elections_flag:0 "Выборы в Испании 1936 года состоялись"
 lar_heavy_water.1.t:0 "Завод тяжёлой воды в Телемарке уничтожен"
 lar_heavy_water.1.desc:0 "Командир гарнизона в Телемарке сообщает, что прошлой ночью на гидроэлектростанции Веморк произошёл катастрофический взрыв, уничтоживший оборудование для производства тяжёлой воды. Расследование ещё продолжается, но имеющиеся данные убедительно указывают на диверсию элитного вражеского подразделения.\n\nПохоже, диверсанты высадились на парашютах, проникли на завод, воспользовавшись поразительно слабой охраной, заложили взрывчатку возле резервуаров и скрылись в ночи за считаные минуты до детонации.\n\nО жертвах среди мирного населения не сообщается, поэтому командир предполагает, что местное сопротивление заранее знало о налёте. Гарнизон прочёсывает район, но следов пока не найдено, и, вероятно, группа уже эвакуировалась."
 lar_heavy_water.1.a:0 "Серьёзная неудача."
 lar_heavy_water.2.t:0 "Операция «Ганнерсайд» успешна"
 lar_heavy_water.2.desc:0 "Сообщения местных связных в Телемарке подтверждают полный успех операции «Ганнерсайд». После парашютной высадки группа незаметно проникла на завод, избежав всех охранников.\n\nЗаложив заряды, бойцы благополучно отошли и разделились, чтобы уйти от поисковых отрядов. После рейда связь с группой отсутствует, но это ожидаемо. Мы также предполагаем, что немцы публично объявят, если им удастся убить или захватить кого-либо из наших коммандос."
 lar_heavy_water.2.a:0 "Кто не рискует, тот не побеждает."
 lar_bruneval_raid.1.t:0 "Вражеские коммандос захватили радиолокационное оборудование"
 lar_bruneval_raid.1.desc:0 "Поступили сообщения о вражеском рейде: небольшой отряд атаковал одну из наших радиолокационных установок. После упорной, но в конечном счёте неудачной обороны гарнизона противник ненадолго захватил объект, прежде чем немедленная и энергично проведённая контратака отбросила его к берегу, где диверсанты поспешно погрузились на десантные суда и ушли.\n\nТщательная проверка радиолокационной станции показала, что несколько компонентов были сняты, а перекличка выявила отсутствие одного из техников-радистов, которого, вероятно, похитили вражеские диверсанты."
 lar_bruneval_raid.1.a:0 "Какой трусливый способ вести войну."
 lar_bruneval_raid.2.t:0 "Операция «Байтинг» увенчалась успехом"
 lar_bruneval_raid.2.desc:0 "Рейд на вражескую радиолокационную установку завершился полным успехом. Штурмовая группа благополучно высадилась, почти не рассеявшись при десантировании.\n\nСобрав снаряжение и сориентировавшись на местности, парашютисты выдвинулись к цели и в короткой, но ожесточённой перестрелке уничтожили слабый гарнизон. После зачистки района сопровождавший отряд радиотехник сфотографировал оборудование и разобрал выбранные компоненты для доставки к нам.\n\nПосле второй перестрелки с поднятым по тревоге гарнизоном пляж эвакуации был очищен, и группа погрузилась на десантные суда, увезя с собой вражеского радиотехника для допроса."
 lar_capture_tito.1.t:0 "Операция «Ход конём» провалилась"
 lar_capture_tito.1.desc:0 "Наша операция по захвату или уничтожению лидера югославских партизан Тито не увенчалась успехом. Первая волна воздушного десанта приземлилась достаточно близко к пещере, где, по нашим предположениям, скрывался Тито, но попала под убийственный огонь сильных вражеских подразделений, не обнаруженных разведкой. Наши солдаты сражались храбро, однако подкрепления противника подошли быстрее ожидаемого. Даже отчаянная попытка прорыва не принесла успеха.\n\nВыжившие отошли к своим позициям. Нынешнее местонахождение Тито неизвестно."
 lar_capture_tito.1.a:0 "В этот раз он ушёл."
 lar_capture_tito.2.t:0 "Операция «Ход конём» увенчалась успехом"
 lar_capture_tito.2.desc:0 "Наша операция по устранению лидера партизан Тито завершилась полным успехом. Хотя противник ожидал нападения, сочетание непосредственной авиационной поддержки и прямого штурма штаба Тито воздушно-десантными войсками застало его врасплох. После ожесточённой перестрелки внутри и вокруг пещерного штаба среди погибших было обнаружено тело Тито."
 lar_capture_tito.2.a:0 "Мы его достали."
 Tito_killed:0 "§YИосип Броз Тито§! погиб."
 lar_rescue_mussolini.1.t:0 "Попытка спасения провалилась"
 lar_rescue_mussolini.1.desc:0 "Попытка спасти Муссолини окончилась неудачей и тяжёлыми потерями. Несколько планеров, перегруженных войсками и снаряжением, не смогли набрать достаточную высоту для перелёта через гору и разбились в плохую погоду. Имея лишь малую часть штурмового отряда, командир решил сделать ставку на скорость и внезапность.\n\nК несчастью, к тому моменту охрана тюрьмы уже находилась в полной боевой готовности и открыла огонь, когда штурмовая группа попыталась ворваться в гостиницу. После короткого боя, оказавшись в безвыходном положении и почти исчерпав боеприпасы, командир предложил капитуляцию своего отряда."
 lar_rescue_mussolini.1.a:0 "Попытаться стоило."
 lar_rescue_mussolini.2.t:0 "Муссолини спасён"
 lar_rescue_mussolini.2.desc:0 "Миссия по освобождению Муссолини завершилась успешно. Небольшой отряд парашютистов благополучно приземлился рядом с гостиницей и захватил здание без единого выстрела. Местная охрана сложила оружие, осознав бессмысленность сопротивления. Затем Муссолини вывезли на самолёте Fieseler Storch к дружественным позициям, откуда он отправится на встречу с [GER.GetLeader]."
 lar_rescue_mussolini.2.a:0 "Мы не забываем друзей."
 lar_operative_event.1.t:0 "Агент схвачен"
 lar_operative_event.1.desc:0 "Когда они находятся в тылу врага, [This.GetName] Враг был задержан [From.From.GetAdjective] контрразведка. Из других источников следует, что [This.GetSheHe] Проводится в удаленном месте для допроса. Хотя мы считаем, что [This.GetSheHe] Пытается сопротивляться допросу как можно дольше, вероятно, что противник в конечном итоге получит полезные разведданные, если только он не получит их. [This.GetSheHe] Спасены или убиты прежде, чем [This.GetSheHe] Перерывы."
 lar_operative_event.1.a:0 "Мы обязаны организовать спасательную операцию!"
 lar_operative_event.2.t:0 "Агент вынужден скрываться"
 lar_operative_event.2.desc:0 "В то время как в назначении [From.From.GetNameDef], [This.GetName] Очевидно, что был обнаружен [From.From.GetAdjective] контрразведка. Последнее сообщение [This.GetSheHe] Присланный сказал, что [This.GetSheHe] Замечено наблюдение противника после [This.GetHerHim] и это [This.GetSheHe] Он собирался выполнить процедуры уклонения и побега.\n\nВ рамках этих процедур, [This.GetName] Естественно, будет нарушен контакт с [This.GetHerHis] Для того, чтобы избежать компрометации их или других.\n\nВ случае успеха, [This.GetName] Через несколько недель мы снова свяжемся с вами."
 lar_operative_event.2.a:0 "Нам остаётся лишь ждать и надеяться."
 lar_operative_event.3.t:0 "Агент погиб"
 lar_operative_event.3.desc:0 "Похоже, что [This.GetName]Один из наших агентов, развернутый в [From.From.GetNameDef]Он принес окончательную жертву и умер при исполнении долга. Отчеты от [From.From.GetAdjective] Источники, естественно, редки, но, по-видимому, [This.GetName] Его отслеживали [From.From.GetAdjective] контрразведка. Кажется вероятным, что [This.GetSheHe] Он должен был быть схвачен и либо выбрать смерть, чтобы избежать разглашения важной информации под допросом, либо быть убитым. [From.From.GetAdjective] Агенты сопротивляются аресту."
 lar_operative_event.3.a:0 "Герой, призванный к [This.GetHerHis] Последний покой."
 lar_operative_event.4.t:0 "Агент ранен"
 lar_operative_event.4.desc:0 "После близкого знакомства с [From.From.GetAdjective] контрразведка, [This.GetName] Сообщалось, что [This.GetSheHe] некоторое время будет бездействовать, чтобы ухаживать за травмами; [This.GetSheHe] выдержал, отбиваясь от попытки задержать [This.GetHerHim]. \n\n[This.GetName] Сейчас он находится в безопасном месте, стремясь [This.GetHerHis] раны и будут недоступны в течение нескольких недель; [This.GetSheHe] Выздоравливает."
 lar_operative_event.4.a:0 "Скоро [This.GetSheHe] вернётся в строй."
 lar_operative_event.5.t:0 "Вражеский агент перевербован"
 lar_operative_event.5.desc:0 "Наша контрразведывательная служба добилась большого успеха: после продолжительного допроса и после получения информации о том, что она находится в центре внимания. [This.GetHerHis] Вероятность судьбы, если [This.GetSheHe] Обвинялся в шпионаже, захваченный [From.From.GetAdjective] агент [This.GetName] Мы договорились сотрудничать с нами в обмен на полную амнистию. [This.GetHerHis] Преступления против государства.\n\nс [This.GetHerHis] глубокое знание внутренней работы [From.From.GetAdjective] разведывательных служб, [This.GetSheHe] Без сомнения, будет намного легче проникнуть. [From.From.GetNameDef] и остаются незамеченными [From.From.GetAdjective] контрразведка."
 lar_operative_event.5.a:0 "Но мы ожидали [This.GetHerHim] умереть?"
 lar_operative_event.6.t:0 "Агент государства [From.GetAdjective] схвачен!"
 lar_operative_event.6.desc:0 "[This.GetName] Он был пойман при попытке проникнуть в нашу администрацию и утечка секретной информации обратно. [This.GetHerHis] начальство. На допросе, [This.GetSheHe] раскрываемый [This.GetHerselfHimself] быть иностранным активом для [From.GetAgency] оперировать [From.From.GetAdjective] Почва. До сих пор неизвестно, какова точная природа [From.GetAdjective] интерес к нашей стране, или какие части нашей администрации уже были выставлены на глаза. [From.GetAdjective] Интеллект. с [This.GetName] В ожидании дальнейшего допроса мы можем только надеяться, что в конечном итоге [This.GetSheHe] Он откроет все, что нужно знать. [From.GetAdjective] операций в [From.From.GetNameDef]."
 lar_operative_event.6.a:0 "У нас есть способы заставить тебя говорить."
 occupied_countries.1.title:1 "Временное правительство государства [From.From.GetNameDef]"
 occupied_countries.1.desc:1 "После долгих и согласованных усилий по улучшению сотрудничества между оккупационными силами и местными гражданскими властями мы готовы вернуть управление государством [From.From.GetNameDef] местному правительству. Оно сформировано из лояльных гражданских лиц и готово тесно координировать действия с нами."
 occupied_countries.1.a:1 "Мы даём им своё благословение."
 occupied_countries.1.b:1 "Они ещё не готовы."
 lar_news.1.t_franco:0 "Победа националистов в гражданской войне в Испании"
 lar_news.1.t_falangist:0 "Победа фалангистов в гражданской войне в Испании"
 lar_news.1.t_carlists:0 "Победа карлистов в гражданской войне в Испании"
 lar_news.1.desc_franco:0 "После долгой и изнурительной гражданской войны националисты, объединённые под руководством Франсиско Франко, наконец разгромили республиканских противников и установили полный контроль над Испанией. Хотя отдельные группы республиканских войск продолжают партизанскую борьбу, способную осложнить установление власти националистов в бывших республиканских районах, появление дальнейшего организованного сопротивления маловероятно.\n\nПока страна сосредоточена на восстановлении разрушенных войной городов и промышленности, остаётся неизвестным, как идеологическая смесь националистов повлияет на внешнюю политику и будет ли возвращена щедрая иностранная военная помощь."
 lar_news.1.desc_franco_unified:0 "В последние недели напряжённость между различными фракциями победивших националистов усиливалась, однако теперь, изгнав несговорчивых лидеров и силой объединив политические партии, Франсиско Франко, похоже, сумел преодолеть разногласия и сплотить оставшиеся группировки вокруг себя. Хотя отдельные республиканские отряды продолжают партизанскую борьбу, гражданскую войну наконец можно считать полностью завершённой.\n\nПока страна сосредоточена на восстановлении разрушенных войной городов и промышленности, остаётся неизвестным, как идеологическая смесь националистов повлияет на внешнюю политику и будет ли возвращена щедрая иностранная военная помощь."
 lar_news.1.desc_franco_uprising:0 "Разногласия внутри националистического движения оказались непреодолимыми, но после долгой и изнурительной гражданской войны националисты Франсиско Франко наконец разгромили карлистских и республиканских врагов и установили полный контроль над Испанией. Хотя отдельные республиканские отряды продолжают партизанскую борьбу, способную осложнить установление власти националистов в бывших республиканских районах, появление дальнейшего организованного сопротивления маловероятно.\n\nПока страна восстанавливает разрушенные войной города и промышленность, остаётся неизвестным, будет ли возвращена щедрая иностранная военная помощь."
 lar_news.1.desc_falangist:0 "После долгой и изнурительной гражданской войны националисты под руководством Эмилио Молы наконец разгромили карлистских и республиканских врагов и установили полный контроль над Испанией. Хотя отдельные республиканские отряды продолжают партизанскую борьбу, способную осложнить установление власти националистов в бывших республиканских районах, появление дальнейшего организованного сопротивления маловероятно.\n\nПока страна восстанавливает разрушенные войной города и промышленность, ведётся подготовка к возвращению гражданского правительства во главе с Хосе Антонио Примо де Риверой. Ещё предстоит увидеть, какие испанские империалистические амбиции проявятся в нынешнем мировом кризисе."
 lar_news.1.desc_carlists:0 "Карлистские силы под руководством Мануэля Фаль Конде наконец разгромили фалангистских и республиканских врагов и установили полный контроль над Испанией. Хотя отдельные республиканские отряды продолжают партизанскую борьбу, способную осложнить установление власти карлистов в бывших республиканских районах, появление дальнейшего организованного сопротивления маловероятно.\n\nХрабрость и фанатизм карлистских рекете стали ключом к победе, и тот же высокий моральный дух характеризует послевоенное восстановление Испании. Однако теперь, когда война окончена, многие карлисты нетерпеливо ждут награды за свои усилия и восшествия законного карлистского претендента на испанский престол."
 lar_news.1.a:0 "Это победа, которую мы одобряем."
 lar_news.1.b:0 "Эти фанатики всё ещё живут в Средневековье..."
 lar_news.1.c:0 "Превосходный исход!"
 lar_news.1.e:0 "Печальный исход."
 lar_news.1.f:0 "¡Война окончена!"
 lar_news.1.t_republic:0 "Победа республиканцев в гражданской войне в Испании"
 lar_news.1.t_stalinist:0 "Победа сталинистов в гражданской войне в Испании"
 lar_news.1.t_independent_communist:1 "Победа ПОУМ в гражданской войне в Испании"
 lar_news.1.t_anarchists:0 "Победа анархистов в гражданской войне в Испании"
 lar_news.2.desc_republic_no_help:0 "После долгой и изнурительной гражданской войны Вторая республика наконец разгромила анархистских и националистических врагов и установила полный контроль над Испанией. Хотя отдельные националистические отряды продолжают партизанскую борьбу, способную осложнить установление власти республиканцев в бывших националистических районах, появление дальнейшего организованного сопротивления маловероятно.\n\nВопреки всем ожиданиям и полагаясь лишь на минимальную советскую помощь, Испанская республика сумела сохранить демократический строй под давлением внутренних и внешних врагов. Пока страна восстанавливает разрушенные войной города и промышленность, остаётся неизвестным, какую роль демократическая Испания сыграет в нынешнем мировом кризисе."
 lar_news.2.desc_republic_soviet_help:0 "При масштабной советской поддержке Вторая республика наконец разгромила анархистских и националистических врагов и установила полный контроль над Испанией. Хотя отдельные националистические отряды продолжают партизанскую борьбу, способную осложнить установление власти республиканцев в бывших националистических районах, появление дальнейшего организованного сопротивления маловероятно.\n\nПока страна восстанавливает разрушенные войной города и промышленность, советское давление усиливается. Ещё предстоит увидеть, сможет ли демократическое правительство Испании сохранить верность своим принципам или превратится лишь в форпост влияния Москвы в Западной Европе."
 lar_news.2.desc_stalinist:0 "После долгой и изнурительной гражданской войны Вторая республика наконец разгромила анархистских и националистических врагов и установила полный контроль над Испанией. Хотя отдельные националистические отряды продолжают партизанскую борьбу, способную осложнить установление власти республиканцев в бывших националистических районах, появление дальнейшего организованного сопротивления маловероятно.\n\nВ ходе гражданской войны Испания мирно перешла к коммунистическому правительству и получила обширную советскую помощь. Пока страна восстанавливает разрушенные войной города и промышленность, испано-советские связи лишь укрепляются, а Советский Союз, как ожидается, будет активно участвовать в программах послевоенного восстановления."
 lar_news.2.desc_independent_communist:0 "После долгой и изнурительной гражданской войны независимые испанские коммунисты наконец разгромили республиканских и националистических врагов и установили полный контроль над Испанией. Хотя отдельные националистические отряды продолжают партизанскую борьбу, способную осложнить установление власти коммунистов в бывших националистических районах, появление дальнейшего организованного сопротивления маловероятно.\n\nПока страна восстанавливает разрушенные войной города и промышленность, новое коммунистическое государство Испании уже разорвало все связи с государством [SOV.GetNameDef], но пригласило все коммунистические партии, отвергающие как сталинизм, так и троцкизм, вместе прокладывать независимый путь вперёд."
 lar_news.2.desc_anarchists:0 "После долгой и изнурительной гражданской войны испанские анархисты наконец разгромили республиканских и националистических врагов и установили полный контроль над Испанией. Хотя отдельные националистические отряды продолжают партизанскую борьбу, способную осложнить создание мирных коммун в бывших националистических районах, появление дальнейшего организованного сопротивления маловероятно.\n\nПока различные коммуны восстанавливают разрушенные войной деревни, города и промышленность, они решили сохранить организацию в рамках созданного во время войны Регионального совета обороны — очевидно, в ответ на всё более враждебную риторику мировых лидеров после победы анархистов."
 lar_news.2.a:0 "Этой «победе» нельзя позволить сохраниться!"
 lar_news.2.b:0 "Любопытная альтернатива укоренившимся формам коммунизма."
 lar_news.2.c:0 "По крайней мере, они не марионетки Сталина."
 lar_news.2.d:0 "Этому извращению коммунизма нельзя позволить процветать!"
 lar_news.2.e:0 "Впечатляющая победа!"
 lar_news.2.f:0 "По крайней мере, победили не фашисты."
 lar_news.2.g:0 "Наилучший возможный исход."
 lar_news.2.h:0 "Влияние государства [SOV.GetAdjective] на [SPD.GetNameDef] вызывает тревогу..."
 lar_news.3.t:0 "Парижский конгресс"
 lar_news.3.desc:0 "После продолжительных переговоров между представителями государств [FRA.GetNameDef], [ITA.GetNameDef], [POR.GetNameDef] и [SPA.GetNameDef] Парижский конгресс постановил перекроить границы Африки. [FRA.GetLeader] назвал результат «величайшим успехом французской дипломатии за всю письменную историю».\n\nПравительства других колониальных держав поспешили осудить соглашение, назвав его «угрозой миру и порядку на континенте».\n\nПоскольку договор распределяет огромные территории между странами, которые ими пока не владеют, план, составленный в Париже, вряд ли удастся осуществить без кровопролития."
 lar_news.3.a:0 "Скоро они придут за нами."
 lar_news.3.b:0 "Пора перекроить границы Африки."
 lar_news.3.c:0 "Новый раздел континента."
 lar_news.4.t:0 "Французское правительство возвращается в Париж"
 lar_news.4.desc:0 "После переговоров на высшем уровне [GER.GetLeader] сегодня объявил, что германская военная администрация Северной Франции вскоре прекратит существование, а территории будут возвращены под полный французский суверенитет. Взамен [VIC.GetLeader] сообщил, что его правительство вступило в Стальной пакт.\n\nГерманские войска, находящиеся в этих районах, пока останутся там, пока их не заменят французские части. Более спорные вопросы, например статус Эльзаса и Лотарингии, не обсуждались, и, судя по всему, территория остаётся под германской администрацией."
 lar_news.4.a:0 "Приветствуем наших братьев по оружию!"
 lar_news.4.b:0 "Неужели их честь можно купить так дёшево?"
 lar_news.4.c:0 "Похоже, вопрос легитимности решён."
 lar_news.4.d:0 "«Одно из» французских правительств, а не «французское правительство»."
 lar_news.4.e:0 "Мы вернулись туда, где должны быть."
 lar_news.5.t:0 "Стрезский фронт ратифицирован"
 lar_news.5.desc:0 "Несмотря на первоначальные неудачи и разногласия из-за итальянского вторжения в Эфиопию, лидеры государств [This.GetStresaMembers] объединились, чтобы превратить договорённости апреля 1935 года в формальное союзное обязательство.\n\nВ рамках переговоров [This.GetStresaConcessions] Хотя лидеры нового союза утверждают, что соглашение направлено лишь на сохранение мира в Европе, многие дипломаты считают, что его основной целью является сдерживание Германии."
 lar_news.5.a:0 "Когда говорит Италия, мир слушает."
 lar_news.5.b:0 "Наш союз становится сильнее."
 lar_news.5.c:0 "Кольцо вокруг Германии сжимается."
 lar_news.5.d:0 "Наш южный фланг защищён."
 lar_news.5.e:0 "Италия надёжна как никогда."
 LaR_Britain_Stresa_agreed:0 "[FRA.GetNameDef], [ENG.GetNameDef] и [ITA.GetNAmeDef]"
 LaR_Britain_Stresa_refused:0 "[FRA.GetNameDef] и [ITA.GetNAmeDef]"
 LaR_Britain_Stresa_Concessions:0 "французское правительство уступило Италии порт Джибути, а [ENG.GetNameDef] передало ей Британское Сомали."
 LaR_France_Stresa_Confessions:0 "французское правительство уступило Италии порт Джибути."
 lar_news.6.t:0 "Франция меняет внешнеполитический курс"
 lar_news.6.desc:0 "Президент [FRA.GetLeader] объявил о крупном изменении французской внешней политики, включая полный пересмотр стратегических союзов и политических гарантий, данных предыдущими правительствами.\n\nВ частности, сеть союзов, связывающая Францию со странами Восточной Европы, будет «подвергнута тщательной проверке», что многие наблюдатели понимают как намерение её распустить.\n\nЛидеры государств [POL.GetNameDef], [CZE.GetNameDef] и [ROM.GetNameDef] пока отказались комментировать ситуацию и возможные ответные меры."
 lar_news.6.a:0 "Нас снова предали."
 lar_news.6.b:0 "Мы следующие?"
 lar_news.6.c:0 "Что задумали французы?"
 lar_news.6.d:0 "Мы не позволим втянуть себя в новую войну каким-то глупым союзом."
 lar_news.6.e:0 "Они мудро не вмешиваются в дела, которые их не касаются."
 lar_portugal_iberian_summit.1.t:0 "Иберийский саммит"
 lar_portugal_iberian_summit.1.desc:0 "Мы получили послание от государства [From.GetNameDef] с предложением оставить разногласия в прошлом и начать совместную работу ради общей цели. Оно предлагает обсудить совместную заявку на вступление во фракцию [?global.POR_iberian_summit_target.GetFactionName] и направить её государству [?global.POR_iberian_summit_target.GetNameDef].\n\nМы должны оценить не только реальность успеха этого предложения, но и то, действительно ли оно отвечает нашим интересам."
 lar_portugal_iberian_summit.1.a:0 "Это предложение отвечает нашим интересам."
 lar_portugal_iberian_summit.1_a_tt:0 "Мы немедленно направим предложение государству [GER.GetFlag][GER.GetNameDefCap].\n"
 lar_portugal_iberian_summit.1.b:0 "Сначала необходимо наладить контакты с дипломатами [?global.POR_iberian_summit_target.GetAdjective]."
 lar_portugal_iberian_summit.1_b_tt:0 "Предложение будет направлено государству [GER.GetFlag][GER.GetNameDefCap] через шесть месяцев.\n"
 lar_portugal_iberian_summit.1.c:0 "Это нелепая идея!"
 lar_portugal_iberian_summit.2.t:0 "Иберийский саммит — [From.GetNameDef] соглашается"
 lar_portugal_iberian_summit.2.desc:0 "Правительство [From.GetAdjective] приняло наше предложение о вступлении во фракцию [?global.POR_iberian_summit_target.GetFactionName]. Вместе мы подписали заявку, которую следует как можно скорее направить государству [?global.POR_iberian_summit_target.GetNameDef]."
 lar_portugal_iberian_summit.2.a:0 "Немедленно отправить заявку."
 lar_portugal_iberian_summit.3.t:0 "Иберийский саммит — [From.GetNameDef] откладывает заявку"
 lar_portugal_iberian_summit.3.desc:0 "Правительство [From.GetAdjective] считает, что наши шансы вступить во фракцию [?global.POR_iberian_summit_target.GetFactionName] возрастут, если до подачи заявки государству [?global.POR_iberian_summit_target.GetNameDef] мы уделим время переговорам с некоторыми дипломатами [?global.POR_iberian_summit_target.GetAdjective]. Так мы получим важные сведения о целях и намерениях государства [?global.POR_iberian_summit_target.GetAdjective] и сможем составить предложение, лучше отвечающее его интересам."
 lar_portugal_iberian_summit.3.a:0 "Будем надеяться, что оно того стоит..."
 lar_portugal_iberian_summit.4.t:0 "Иберийские государства хотят вступить во фракцию [Root.GetFactionName]"
 lar_portugal_iberian_summit.4.desc:0 "Испания и Португалия направили совместную заявку на вступление во фракцию [Root.GetFactionName]. Они ожидают, что мы примем обе иберийские страны в наш союз.\n\nРассматривая возможность обеспечить доступ к Средиземному морю, военное командование опасается открытия новых фронтов, для обороны которых у нас может не хватить ресурсов..."
 lar_portugal_iberian_summit.4.a:0 "Мы согласны: они могут оказаться полезными."
 lar_portugal_iberian_summit.4.b:0 "Мы отказываем: им нужна лишь наша защита!"
 lar_portugal_iberian_summit.5.t:0 "Иберийский саммит"
 lar_portugal_iberian_summit.5.desc:0 "Мы получили послание от государства [From.GetNameDef] с предложением оставить разногласия в прошлом и начать совместную работу ради общей цели. Оно предлагает обсудить совместную заявку на вступление во фракцию [?global.POR_iberian_summit_target.GetFactionName] и направить её государству [?global.POR_iberian_summit_target.GetNameDef].\n\nМы должны оценить не только реальность успеха этого предложения, но и то, действительно ли оно отвечает нашим интересам."
 lar_portugal_iberian_summit.5.a:0 "Это предложение отвечает нашим интересам."
 lar_portugal_iberian_summit.5_a_tt:0 "Мы немедленно направим предложение государству [ENG.GetFlag][ENG.GetNameDefCap].\n"
 lar_portugal_iberian_summit.5.b:0 "Сначала необходимо наладить контакты с дипломатами [?global.POR_iberian_summit_target.GetAdjective]."
 lar_portugal_iberian_summit.5_b_tt:0 "Предложение будет направлено государству [ENG.GetFlag][ENG.GetNameDefCap] через шесть месяцев.\n"
 lar_portugal_iberian_summit.5.c:0 "Это нелепая идея!"
 lar_portugal_iberian_summit.6.t:0 "Иберийский саммит — [From.GetNameDef] соглашается"
 lar_portugal_iberian_summit.6.desc:0 "Правительство [From.GetAdjective] приняло наше предложение о вступлении во фракцию [?global.POR_iberian_summit_target.GetFactionName]. Вместе мы подписали заявку, которую следует как можно скорее направить государству [?global.POR_iberian_summit_target.GetNameDef]."
 lar_portugal_iberian_summit.6.a:0 "Немедленно отправить заявку."
 lar_portugal_iberian_summit.7.t:0 "Иберийский саммит — [From.GetNameDef] откладывает заявку"
 lar_portugal_iberian_summit.7.desc:0 "Правительство [From.GetAdjective] считает, что наши шансы вступить во фракцию [?global.POR_iberian_summit_target.GetFactionName] возрастут, если до подачи заявки государству [?global.POR_iberian_summit_target.GetNameDef] мы уделим время переговорам с некоторыми дипломатами [?global.POR_iberian_summit_target.GetAdjective]. Так мы получим важные сведения о целях и намерениях государства [?global.POR_iberian_summit_target.GetAdjective] и сможем составить предложение, лучше отвечающее его интересам."
 lar_portugal_iberian_summit.7.a:0 "Будем надеяться, что оно того стоит..."
 lar_portugal_iberian_summit.8.t:0 "Иберийские государства хотят вступить во фракцию [Root.GetFactionName]"
 lar_portugal_iberian_summit.8.desc:0 "Испания и Португалия направили совместную заявку на вступление во фракцию [Root.GetFactionName]. Они ожидают, что мы примем обе иберийские страны в наш союз.\n\nРассматривая возможность обеспечить доступ к Средиземному морю, военное командование опасается открытия новых фронтов, для обороны которых у нас может не хватить ресурсов..."
 lar_portugal_iberian_summit.8.a:0 "Мы согласны: вместе мы разгромим врагов!"
 lar_portugal_iberian_summit.8.b:0 "Мы отказываем: они лишь ослабят нас."
 lar_portugal_iberian_summit.9.t:0 "Иберийский саммит — [From.GetNameDef] отказывается"
 lar_portugal_iberian_summit.9.desc:0 "Демонстрируя полное непонимание ситуации и отсутствие подлинного желания сотрудничать, правительство [From.GetAdjective] отклонило наше предложение о вступлении во фракцию [?global.POR_iberian_summit_target.GetFactionName].\nВозможно, теперь стоит искать союзников самостоятельно..."
 lar_portugal_iberian_summit.9.a:0 "Какие же у нас глупые соседи!"
 lar_portugal_navy_mutiny.1.t:0 "Мятеж на флоте"
 lar_portugal_navy_mutiny.1.desc:0 "Революционная организация флота (Organização Revolucionária da Armada) организовала мятеж в военно-морских силах и арестовала нескольких офицеров. Цель восстания, возглавляемого эсминцем «Дау», — уйти в испанские порты Средиземноморья и принять участие в гражданской войне на стороне республиканцев.\n\nОднако нерешительность части экипажей помешала успеху мятежников, и у нас ещё есть возможность их остановить."
 lar_portugal_navy_mutiny.1.a:0 "Их дело справедливо. Позволить им уйти!"
 lar_portugal_navy_mutiny.1_allow_tt:0 "Мятежные корабли будут переданы государству [SPD.GetNameDefCap].\nЕсли [SPD.GetFlag][SPD.GetNameDef] победит в гражданской войне в Испании, оно вернёт столько же кораблей.\n§RПоддержка коммунизма§! повлияет на количество уходящих кораблей."
 lar_portugal_navy_mutiny.1_stop_tt:0 "Мы попытаемся остановить мятежников.\nМятежные корабли могут прорваться и перейти государству [SPD.GetNameDefCap].\n§RПоддержка коммунизма§! повлияет на количество мятежных кораблей и вероятность их ухода."
 lar_portugal_navy_mutiny.1.b:0 "Остановить это безумие!"
 lar_portugal_navy_mutiny.2.t:0 "Мятежники уходят в море"
 lar_portugal_navy_mutiny.2.desc:0 "Неожиданно, узнав о нашем решении разрешить мятежным кораблям покинуть порт, большинство экипажей отказалось от восстания, надеясь, что в ближайшем будущем правительство предпримет более решительные действия и вступит в гражданскую войну на стороне республиканцев.\nТолько эсминец «Дау», уже направлявшийся в Испанию, отказался повернуть назад.\nИспанское правительство пообещало после окончания гражданской войны передать нам эсминец в качестве компенсации."
 lar_portugal_navy_mutiny.2_extra.desc:0 "К удивлению большинства мятежников, кораблям позволили покинуть порт, и теперь они направляются в испанские гавани. Эсминец «Дау» идёт впереди, а за ним следуют ещё [?POR_ships_revolted_not_including_dao] судов.\n\nМы связались с правительством Испанской республики, и оно заверило, что после окончания гражданской войны предоставит Португалии корабли."
 lar_portugal_navy_mutiny.2.a:0 "Надеемся, они вернутся целыми..."
 lar_portugal_navy_mutiny.2_tt:0 "[?POR_ships_revolted] кораблей будут возвращены государству [Root.GetNameDef], если [SPD.GetNameDef] победит в гражданской войне в Испании."
 lar_portugal_navy_mutiny.3.t:0 "Доклад о мятеже"
 lar_portugal_navy_mutiny.3.desc:0 "Мятеж подавлен благодаря быстрым действиям верных береговых сил. Мятежники арестованы и наказаны за предательство. Чтобы предотвратить новые попытки неповиновения, экипажи участвовавших в восстании кораблей заменены надёжными моряками, связанными с нашими организациями."
 lar_portugal_navy_mutiny.3_extra.desc:0 "Восстание оказалось лучше организовано, чем первоначально предполагали офицеры. Когда береговая артиллерия открыла огонь по мятежным кораблям, они развели пары, и эсминец «Дау» первым вышел из порта, а за ним с интервалами последовали другие суда. Некоторые корабли получили попадания при попытке бегства и сели на мель у побережья, где войска арестовали предателей.\n\nК сожалению, [?POR_ships_revolted] кораблей сумели уйти и сейчас направляются в Испанию. После гражданской войны мы обратимся к испанскому правительству и потребуем компенсации."
 lar_portugal_navy_mutiny.3.a:0 "Это больше никогда не повторится!"
 lar_portugal_navy_mutiny.3_no_ships_tt:0 "§GМятеж подавлен.§!"
 lar_portugal_navy_mutiny.3_ships_tt:0 "§R[?POR_ships_revolted] кораблей§! будут переданы Республиканской Испании.\nЕсли республиканцы победят в гражданской войне, они вернут такое же количество кораблей."
 lar_portugal_navy_mutiny.4.t:0 "Португальские моряки прибыли нам на помощь!"
 lar_portugal_navy_mutiny.4.desc:0 "Желая помочь Испанской республике против националистического мятежа, португальские экипажи подняли восстание на нескольких кораблях. Офицеры были арестованы, а суда подготовлены к немедленному выходу из порта, поскольку ожидалось сильное сопротивление с берега.\n\nОднако к удивлению моряков португальское правительство, желая избежать дальнейшей эскалации, пошло на компромисс и разрешило им уйти и сражаться за наше дело при условии возвращения после окончания гражданской войны.\n\nЧасть экипажей решила остаться в Португалии и продолжить давление на правительство, требуя действий против националистов. В итоге к нашим портам направляются [?POR.POR_ships_revolted] кораблей. Мы должны приветствовать товарищей и поблагодарить их за храбрость."
 lar_portugal_navy_mutiny.4_extra.desc:0 "Желая помочь Испанской республике против националистического мятежа, португальские экипажи подняли восстание на нескольких кораблях. После ареста офицеров моряки попытались выйти из порта, но встретили ожесточённое сопротивление армии.\nПод сильным огнём береговой артиллерии [?POR.POR_ships_revolted] кораблей сумели прорваться и сейчас направляются в Испанию.\n\nНе сумев подавить мятеж, португальское правительство потребовало компенсировать потери после окончания войны.\n\nНо пока мы должны приветствовать товарищей и поблагодарить всех храбрых моряков за жертвы, ведь многие были арестованы или ранены во время восстания."
 lar_portugal_navy_mutiny.4.a:0 "Мы не забудем подвиг этих храбрых португальцев!"
 lar_portugal_navy_mutiny.4_tt:0 "§G[?POR.POR_ships_revolted] кораблей [POR.GetAdjective]§! переданы государству [Root.GetNameDef] и теперь находятся под нашим контролем.\nПосле окончания гражданской войны они будут возвращены государству [POR.GetNameDef]."
 lar_portugal_navy_mutiny.5.t:0 "Наши моряки возвращаются с гражданской войны в Испании"
 lar_portugal_navy_mutiny.5.desc:1 "Гражданская война в Испании окончена, и республиканское правительство согласилось предоставить нам [?POR_ships_revolted] кораблей взамен тех, что ушли ему на помощь в начале конфликта. Однако наши эсминцы могли сильно износиться во время службы, поэтому Испанская республика проведёт осмотр и решит, какие из них следует заменить собственными судами."
 lar_portugal_navy_mutiny.5.a:0 "Посмотрим, насколько хорошо покажут себя эти корабли..."
 lar_portugal_navy_mutiny.5_tt:0 "§G[SPD.GetNameDefCap] вернёт государству [Root.GetNameDef] [?POR_ships_revolted] кораблей.§!"
 lar_portugal_navy_mutiny.6.t:0 "Пора попрощаться с португальскими товарищами"
 lar_portugal_navy_mutiny.6.desc:0 "Теперь, когда националистический мятеж разгромлен, храбрым португальским морякам, пришедшим нам на помощь в первые месяцы конфликта, пора вернуться на родину.\nМы проведём осмотр и определим, какие португальские корабли достаточно исправны для возвращения, а какие придётся заменить нашими судами.\n\nМы многим обязаны этим храбрым морякам и никогда не забудем их мужество."
 lar_portugal_navy_mutiny.6.a:0 "Прощайте, братья по оружию!"
 lar_portugal_navy_mutiny.6_tt:0 "[?POR.POR_ships_revolted] кораблей будут возвращены государству [POR.GetNameDef]."
 lar_portugal_iberian_workers_united.1.t:0 "Рабочие Иберии объединились"
 lar_portugal_iberian_workers_united.1.desc:0 "Слишком долго Испания и Португалия оставались независимыми государствами, подчёркивавшими различия вместо сходства. Теперь это время прошло: испанские и португальские рабочие объединились в борьбе против фашизма!"
 lar_portugal_iberian_workers_united.1.a:0 "Единые, мы непобедимы!"
 lar_portugal_iberian_workers_united.2.t:1 "Иберийский социалистический союз"
 lar_portugal_iberian_workers_united.2.desc:1 "Теперь, когда наконец установлен мир, государство [From.GetNameDefCap] предложило нашему правительству рассмотреть объединение Иберийского полуострова под властью народного социалистического правительства. Идентичности [Root.GetAdjective] и [From.GetAdjective] со временем исчезнут, а все мы станем гражданами Иберийского социалистического союза."
 lar_portugal_iberian_workers_united.2.a:0 "Государства [Root.GetNameDefCap] и [POR.GetNameDef] объединятся!"
 lar_portugal_iberian_workers_united.2.a_tt:0 "§YИберийский социалистический союз§! аннексирует §YРеспубликанскую Испанию§!.\n"
 lar_portugal_iberian_workers_united.2.b:0 "Государство [Root.GetNameDefCap] останется независимым."
 lar_portugal_naval_blockade.1.t:0 "[POR.GetNameDefCap] отказывается соблюдать морскую блокаду [ENG.GetAdjective]"
 lar_portugal_naval_blockade.1.desc:0 "Правительство [POR.GetAdjective] заявило, что не обязано соблюдать морскую блокаду, введённую против нас государством [ENG.GetNameDef]. Мы получили предложение о справедливом соглашении: конвои [POR.GetAdjective] будут поддерживать наши военные усилия и перевозить грузы туда, куда не могут добраться наши суда, в обмен на торговый договор о поставках дешёвых потребительских товаров государству [POR.GetNameDef]."
 lar_portugal_naval_blockade.1.a:0 "Мы рассмотрим это предложение..."
 lar_portugal_naval_blockade.1_tt:0 "Открывает решение для стран, воюющих с государством [ENG.GetNameDefCap]."
 lar_portugal_naval_blockade.2.t:0 "[From.GetName] принимает наше предложение об обходе морской блокады"
 lar_portugal_naval_blockade.2.desc:0 "Сегодня прибыло послание от государства [From.GetNameDef], принимающего наше предложение об обходе британской морской блокады. Мы будем использовать конвои для доставки необходимых ему грузов туда, куда не могут добраться корабли [From.GetAdjective]. Взамен оно направит производство одной из своих фабрик на снабжение нас материалами для собственных проектов."
 lar_portugal_naval_blockade.2.a:0 "Это принесёт пользу обеим странам."
 lar_portugal_naval_blockade.3.t:0 "[POR.GetNameDefCap] отказывается соблюдать морскую блокаду"
 lar_portugal_naval_blockade.3.desc:0 "Правительство [POR.GetAdjective] заявило, что не станет соблюдать введённую нами морскую блокаду. Государство [POR.GetNameDefCap] предложило нашим врагам соглашение, обещая поддерживать их военные усилия и использовать конвои [POR.GetAdjective] для контрабанды товаров.\n\nХотя мы с уважением и пониманием относились к их нейтралитету, похоже, бывшие друзья больше не желают чтить Англо-португальский союз, открыто поддерживают наших врагов и тем самым нарушают договор, существовавший между нашими странами более пяти столетий..."
 lar_portugal_naval_blockade.3.a:0 "Предательские приспособленцы!"
 lar_portugal_promote_monarchist_cause.1.t:0 "Португалия продвигает монархические настроения!"
 lar_portugal_promote_monarchist_cause.1.desc:0 "Португальское правительство обратилось к бразильским монархистам и поддерживает пропагандистскую кампанию, восхваляющую принца Педру Энрике и его право на бразильский престол.\nНе следует недооценивать возможное влияние этой кампании на население Бразилии, иначе страну может захлестнуть массовое монархическое движение, способное свергнуть правительство."
 lar_portugal_promote_monarchist_cause.1.a:0 "Как они смеют?!"
 lar_portugal_promote_monarchist_cause.2.t:1 "Воссоединить Королевство Португалии и Бразилии"
 lar_portugal_promote_monarchist_cause.2.desc:1 "Государство [POR.GetNameDefCap] предложило нашему правительству объединить страны под властью дона Дуарте Нуну, который будет коронован королём Португалии и Бразилии.\n\nПравительство [POR.GetAdjective] заявило, что не примет отказ, и настоятельно рекомендует согласиться, чтобы избежать возможного конфликта между нашими государствами."
 lar_portugal_promote_monarchist_cause.2.a:0 "Государства [Root.GetNameDefCap] и [POR.GetNameDef] снова объединятся."
 lar_portugal_promote_monarchist_cause.2.b:0 "Государство [Root.GetNameDefCap] останется независимым."
 lar_portugal_promote_monarchist_cause.3.t:0 "Монархическое восстание!"
 lar_portugal_promote_monarchist_cause.3.desc:0 "При поддержке правительства [POR.GetAdjective] бразильские монархисты захватили Рио-де-Жанейро и подняли восстание по всей стране против фашистских предателей.\nВраг заручился поддержкой различных групп, но верные подданные восстановленного государства [Root.GetName] не боятся: законный император [Root.GetLeader] поведёт их к победе!"
 lar_portugal_promote_monarchist_cause.3.desc_anti_monarchist:0 "При поддержке португальского правительства бразильские монархисты подняли восстание по всей стране. Если предателям удастся восстановить монархию, вскоре наша любимая страна, скорее всего, окажется под португальским контролем.\n\nМы потеряли большую часть государства, но, к счастью, мятежники не смогли захватить Рио-де-Жанейро, что позволило собрать войска в столице и начать поход для возвращения земель, захваченных теми, кто стремится погубить страну."
 lar_portugal_promote_monarchist_cause.3.a:0 "Бразильский престол будет восстановлен!"
 lar_portugal_promote_monarchist_cause.3.a_tt:0 "[From.GetFlag]§Y[From.GetNameDefCap]§G вступит в гражданскую войну на нашей стороне.§!§!"
 lar_portugal_promote_monarchist_cause.3.b:0 "Мы должны уничтожить этих предателей!"
 lar_portugal_promote_monarchist_cause.3.b_tt:0 "[From.GetFlag]§Y[From.GetNameDefCap]§R вступит в гражданскую войну против нас.§!§!"
 lar_portugal_promote_monarchist_cause.4.t:0 "Бразильский престол восстановлен"
 lar_portugal_promote_monarchist_cause.4.desc:0 "При поддержке правительства [POR.GetAdjective] бразильские монархисты сумели мирно сменить правительство. По стране всё ещё разбросаны отдельные группы, выступающие против восшествия на престол нашего законного императора [Root.GetLeader], но вскоре они будут усмирены."
 lar_portugal_promote_monarchist_cause.4.a:0 "Да здравствует император!"
 lar_portugal_promote_monarchist_cause.5.t:0 "Бразилия принимает объединение"
 lar_portugal_promote_monarchist_cause.5.desc:0 "Бразильское правительство мудро согласилось подписать предложение об объединении наших государств. Могущественное Соединённое королевство Португалии и Бразилии вновь восстаёт под властью короля [Root.GetLeader].\n\nПусть он принесёт силу и процветание нашей любимой стране!"
 lar_portugal_promote_monarchist_cause.5.a:0 "Это укрепляет Португалию."
 lar_portugal_promote_monarchist_cause.6.t:0 "Бразилия отказывается от объединения"
 lar_portugal_promote_monarchist_cause.6.desc:0 "Правительство [BRA.GetAdjective] безрассудно отвергло наше предложение объединить страны под властью [Root.GetLeader].\nХотя для нас это совершенно неприемлемо, перед нами лишь небольшая помеха на пути к восстановлению могущества прежнего Королевства Португалии.\n\nВ конце концов им придётся подчиниться нашим требованиям, как и всем остальным..."
 lar_portugal_promote_monarchist_cause.6.a:0 "Их судьба решена."
 lar_portugal_promote_monarchist_cause.7.t:0 "Монархисты набирают силу!"
 lar_portugal_promote_monarchist_cause.7.desc:0 "Положение в стране критическое. Монархическое движение усиливается, а власть перешла к антимонархической коалиции, вероятно, чтобы предотвратить неизбежное восстание.\nСоциальная нестабильность стремительно растёт, поскольку граждане Бразилии осознают фашистскую ориентацию лидеров этой коалиции, а общество всё сильнее поляризуется между фашизмом и монархизмом.\nВ этот судьбоносный момент нам пора выбрать сторону."
 lar_portugal_promote_monarchist_cause.7.a:0 "Поддержать монархистов."
 lar_portugal_promote_monarchist_cause.7.a_tt:0 "В возможной гражданской войне вы выступите на стороне монархистов."
 lar_portugal_promote_monarchist_cause.7.b:0 "Поддержать антимонархическую коалицию."
 lar_portugal_promote_monarchist_cause.7.b_tt:0 "В возможной гражданской войне вы выступите на стороне фашистов."
 POR_portugal_joined_brazilian_civil_war_flag:0 "Португалия вступила в гражданскую войну в Бразилии"
 POR_brazil_supports_monarchism_flag:0 "Бразилия поддерживает монархизм"
 lar_portugal_purchase_ships.1.t:0 "[From.GetNameDefCap] хочет приобрести корабли [Root.GetAdjective]"
 lar_portugal_purchase_ships.1.desc:0 "Правительство [From.GetAdjective], осознавая слабость своего флота, объявило тендер на покупку кораблей [Root.GetAdjective]. Если мы согласимся построить требуемые суда, оно предоставит нам товары, которые можно использовать в собственных целях."
 lar_portugal_purchase_ships.1.a:0 "Это принесёт пользу обеим сторонам."
 lar_portugal_purchase_ships.1.a_tt:0 "После того как [POR.GetNameDefCap] выберет предложение, мы получим в качестве оплаты §Y1§! внемаповую §Yфабрику§!."
 lar_portugal_purchase_ships.1.b:0 "Нас это не интересует."
 lar_portugal_purchase_ships.2.t:0 "[From.GetNameDefCap] соглашается построить наши корабли"
 lar_portugal_purchase_ships.2.desc:0 "Правительство [From.GetAdjective] согласилось построить корабли для флота [Root.GetAdjective]. Оно представило нам три различных предложения на выбор."
 lar_portugal_purchase_ships.2.a:0 "Приобрести подводные лодки."
 lar_portugal_purchase_ships.2.b:0 "Приобрести эсминцы."
 lar_portugal_purchase_ships.2.c:0 "Приобрести лёгкий крейсер."
 lar_portugal_purchase_ships.3.t:0 "[From.GetNameDefCap] отказывается строить наши корабли"
 lar_portugal_purchase_ships.3.desc:0 "[From.GetNameDefCap] отклонило наше предложение приобрести корабли [From.GetNameDefCap] для флота.\nПридётся искать другие страны, готовые принять сделку, либо сосредоточиться на развитии собственных верфей, чтобы больше не зависеть от иностранных держав при создании могучего флота [Root.GetAdjective]."
 lar_portugal_purchase_ships.3.a:1 "Мы справимся и без них."
 lar_portugal_purchase_ships.4.t:0 "Строительство завершено — подводные лодки"
 lar_portugal_purchase_ships.4.desc:0 "После почти года строительства три заказанные нами подводные лодки постройки [GetPortugueseShipsBuilder] прошли несколько морских испытаний и наконец готовы официально вступить в состав флота.\nСуда находятся в порту [Root.GetAdjective], а их экипажи ожидают приказов."
 lar_portugal_purchase_ships.4.a:0 "Хорошо."
 lar_portugal_purchase_ships.4.a_tt:0 "Три подводные лодки добавлены в резервный флот."
 lar_portugal_purchase_ships.5.t:0 "Строительство завершено — эсминцы"
 lar_portugal_purchase_ships.5.desc:0 "После почти года строительства два заказанных нами эсминца постройки [GetPortugueseShipsBuilder] прошли несколько морских испытаний и наконец готовы официально вступить в состав флота.\nСуда находятся в порту [Root.GetAdjective], а их экипажи ожидают приказов."
 lar_portugal_purchase_ships.5.a:0 "Хорошо."
 lar_portugal_purchase_ships.5.a_tt:0 "Два эсминца добавлены в резервный флот."
 lar_portugal_purchase_ships.6.t:0 "Строительство завершено — лёгкий крейсер"
 lar_portugal_purchase_ships.6.desc:0 "После почти полутора лет строительства заказанный нами лёгкий крейсер постройки [GetPortugueseShipsBuilder] прошёл несколько морских испытаний и наконец готов официально вступить в состав флота.\nСудно находится в порту [Root.GetAdjective], а экипаж ожидает приказов."
 lar_portugal_purchase_ships.6.a:0 "Хорошо."
 lar_portugal_purchase_ships.6.a_tt:0 "Один лёгкий крейсер добавлен в резервный флот."
 POR_ENG_Ship_Builder:0 "[ENG.GetAdjective]ий"
 POR_ITA_Ship_builder:0 "[ITA.GetAdjective]ий"
 lar_portugal_spanish_civil_war.1.t:0 "[POR.GetNameDefCap] симпатизирует Испанской республике"
 lar_portugal_spanish_civil_war.1.desc:0 "Сегодня [POR.GetNameDef] объявило о поддержке Испанской республики и заявило, что правительство рассматривает возможность серьёзного вмешательства в гражданскую войну в Испании. В своей речи [POR.GetLeader] осудил растущую фашистскую угрозу в Иберии и заявил, что долг государства [POR.GetNameDef] — помочь испанским товарищам в борьбе против националистов."
 lar_portugal_spanish_civil_war.1.a:0 "Им лучше не вставать у нас на пути..."
 lar_portugal_spanish_civil_war.1_tt:0 "§R[POR.GetNameDefCap] сможет вступить в гражданскую войну в Испании на стороне [SPD.GetFlag][SPD.GetNameDef] и сражаться против нас!§!"
 lar_portugal_spanish_civil_war.2.t:0 "[POR.GetNameDefCap] симпатизирует испанским националистам"
 lar_portugal_spanish_civil_war.2.desc:0 "Правительство [POR.GetAdjective] объявило о поддержке испанских националистов и заявило, что [POR.GetNameDef] рассматривает возможность серьёзного вмешательства в гражданскую войну в Испании. В своей речи [POR.GetLeader] осудил распространение коммунистической и анархистской угрозы в Иберии и заявил, что долг государства [POR.GetNameDef] — помочь испанским соседям в борьбе против республиканцев."
 lar_portugal_spanish_civil_war.2.a:0 "Им не следует вмешиваться в эти дела..."
 lar_portugal_spanish_civil_war.2_tt:0 "§R[POR.GetNameDefCap] сможет вступить в гражданскую войну в Испании на стороне [SPA.GetFlag][SPA.GetNameDef] и сражаться против нас!§!"
 lar_portugal_spanish_civil_war.3.t:0 "[POR.GetNameDefCap] симпатизирует испанским карлистам"
 lar_portugal_spanish_civil_war.3.desc:0 "Правительство [POR.GetAdjective] сегодня объявило о поддержке испанских карлистов и заявило, что [POR.GetNameDef] рассматривает возможность серьёзного вмешательства в гражданскую войну в Испании. В своей речи [POR.GetLeader] заявил, что только монархия способна вернуть стабильность и процветание Иберийскому полуострову, слишком расколотому политикой, и что долг государства [POR.GetNameDef] — помочь испанским роялистам восстановить монархию."
 lar_portugal_spanish_civil_war.3.a:0 "Им не следует вмешиваться в эти дела..."
 lar_portugal_spanish_civil_war.3_tt:0 "§R[POR.GetNameDefCap] сможет вступить в гражданскую войну в Испании на стороне [SPB.GetFlag][SPB.GetNameDef] и сражаться против нас!§!"
 lar_portugal_royal_iberian_alliance.1.t:0 "Создать Королевский Иберийский альянс"
 lar_portugal_royal_iberian_alliance.1.desc:0 "[From.GetNameDefCap] заявляет, что после всей разобщённости и нестабильности, пережитых нашими странами во время гражданской войны в Испании, иберийским государствам следует объединиться ради процветания и прогресса.\n\nПравительство [From.GetAdjective] предлагает заключить союз между нашими королевствами, оставить прежние разногласия в прошлом и вместе противостоять многочисленным угрозам, ожидающим нас не только в Европе, но и во всём мире."
 lar_portugal_royal_iberian_alliance.1.a:0 "Этот союз принесёт пользу Португалии."
 lar_portugal_royal_iberian_alliance.1.b:0 "Этот договор для нас неприемлем."
 lar_portugal_overseas_provinces.1.t:0 "Территории Анголы интегрированы"
 lar_portugal_overseas_provinces.1.desc:0 "Наши владения в Северной и Южной Анголе наконец интегрированы в состав государства. Местное население Анголы получило португальское гражданство и теперь обладает теми же правами и обязанностями, что и любой другой гражданин Португалии, включая военную службу. Это даст армии новый источник людских ресурсов."
 lar_portugal_overseas_provinces.1.a:0 "Хорошие новости!"
 lar_portugal_overseas_provinces.2.t:0 "Территория Мозамбика интегрирована"
 lar_portugal_overseas_provinces.2.desc:0 "Наша бывшая колония Мозамбик наконец интегрирована в состав государства. Местное население Мозамбика получило португальское гражданство и теперь обладает теми же правами и обязанностями, что и любой другой гражданин Португалии, включая военную службу. Это даст армии новый источник людских ресурсов."
 lar_portugal_overseas_provinces.2.a:0 "Это во благо Португалии."
 lar_news.7.t:0 "Франко-германский пакт"
 lar_news.7.desc:0 "[FRA.GetLeader] и [GER.GetLeader] встретились в Берлине, чтобы обсудить политическую и стратегическую обстановку в Центральной Европе. Подробностей встречи немного, официального коммюнике не опубликовано, однако наблюдатели отмечают явный сдвиг в риторике и политике государств [FRA.GetAdjective] и [GER.GetAdjective] по отношению к странам Бенилюкса.\n\nЕсли раньше немецкое меньшинство в Бельгии постоянно использовалось германской пропагандой, теперь о нём упоминают лишь вскользь, одновременно заявляя, что Бельгия — «искусственное образование, а не нация; всего лишь случайно собранный набор народов», и подчёркивая многочисленность франкоязычного населения."
 lar_news.7.a:0 "Мы должны укрепить оборону!"
 lar_news.7.b:0 "Франция заявляет о себе."
 lar_news.7.c:0 "Малые государства Европы дрожат."
 lar_news.7.d:0 "Пора перекроить границы Европы."
 lar_news.7.e:0 "Разумное решение между разумными государствами."
 lar_news.8.t:0 "[FRA.GetLeader] претендует на французский престол"
 lar_news.8.desc:0 "На церемонии в Париже [FRA.GetLeader] был официально провозглашён королём Франции.\n\nЕго приход к власти широко считают прямым следствием неспособности Третьей республики обеспечить политическую стабильность в обстановке всё более ожесточённых столкновений между крайними политическими силами. Теперь ему предстоит трудная задача восстановления и объединения глубоко расколотой страны. Многие наблюдатели указывают на роль Лиг в его возвышении как на признак того, что [FRA.GetLeader] фактически правит лишь милостью правой толпы."
 lar_news.8.a:0 "Ещё одна страна возвращается к естественному порядку вещей."
 lar_news.8.b:0 "Скоро у них случится новая революция."
 lar_news.8.c:0 "Возвращение к временам, давно считавшимся ушедшими."
 lar_news.8.d:0 "Да здравствует [FRA.GetLeader]!"
 lar_news.8.e:0 "Это не тот вид абсолютного правителя!"
 LaR_France_Reims:0 "Реймс"
 LaR_France_Paris:0 "Париж"
 LaR_France_Emperor:0 "Император французов"
 LaR_France_King:0 "Король Франции"
 LaR_France_King_of_The_French:0 "Король французов"
 lar_news.9.t:0 "Французские коммунисты приходят к власти"
 lar_news.9.desc:0 "После продолжительного периода политических и экономических реформ министры-коммунисты правительства Народного фронта сегодня потребовали, чтобы оставшиеся министры-центристы либо ушли в отставку и признали Коммунистическую партию единственной правящей силой, либо немедленно вступили в неё.\n\nОдновременно вооружённые рабочие нескольких крупных государственных заводов заняли стратегические объекты по всей стране. Армия по приказу из Парижа осталась в казармах и отказалась вмешиваться.\n\nК ночи коммунистический переворот завершился, а новое правительство закрепило власть."
 lar_news.9.a:0 "Радикалы захватили власть."
 lar_news.9.b:0 "Последняя Французская революция."
 lar_news.9.c:0 "Они избежали фашизма, выбрав худшую возможную альтернативу."
 lar_news.9.d:0 "Революция победила!"
 lar_news.9.e:0 "В Европе возникает новая угроза."
 lar_news.10.t:0 "Восстание карлистов в гражданской войне в Испании"
 lar_news.10.desc:0 "Опасаясь дальнейшего оттеснения на второй план и сокращения своего влияния на Националистический фронт, карлистские силы под руководством Мануэля Фаль Конде разорвали союз с националистами. Провозгласив собственное независимое восстание, карлистские рекете, сосредоточенные главным образом на севере страны, обратили оружие против недавних союзников, одновременно продолжая борьбу с республиканцами.\n\nРуководство националистов преуменьшает последствия раскола для своего военного положения, но очевидно, что нынешний хаос открывает перед республиканцами широкие возможности."
 lar_news.10.desc_2:0 "Опасаясь дальнейшего оттеснения на второй план и сокращения влияния в молодом послевоенном националистическом правительстве, карлистские силы под руководством Мануэля Фаль Конде отказались от его поддержки. В ходе нового восстания карлистские рекете, сосредоточенные главным образом на севере страны, обратили оружие против недавних союзников и провозгласили конкурирующее правительство.\n\nЛидеры националистов поспешили осудить действия Фаль Конде, обвинив его в том, что он «вверг Испанию в очередную гражданскую войну». Карлисты ответили, что руководство националистов систематически пыталось уничтожить движение с момента разгрома республиканцев, не оставив им иного выбора, кроме самообороны."
 lar_news.10.a:0 "Теперь им придётся принимать нас всерьёз!"
 lar_news.10.b:0 "Их недальновидность ставит под угрозу нашу войну!"
 lar_news.10.b_2:0 "Они готовы поставить под угрозу нашу победу над республиканцами?!"
 lar_news.10.c:0 "Это даже лучше, чем мы могли надеяться!"
 lar_news.10.c_2:0 "Пусть подавятся своей победой!"
 lar_news.10.d:0 "Всё становится сложнее..."
 lar_news.10.d_2:0 "Неужели это никогда не закончится?!"
 lar_news.11.t:0 "Анархистское восстание в гражданской войне в Испании"
 lar_news.11.desc:1 "Продолжающиеся попытки правительства восстановить централизованный контроль над преимущественно самостоятельно действующими анархистскими коммунами на северо-востоке Испании, а также сталинистские репрессии против инакомыслящих коммунистов привели к открытому расколу внутри республиканского фронта.\n\nИзначально ограничивавшийся уличными боями и мелкими столкновениями между ополчениями и правительственными или сталинистскими силами конфликт всего за несколько дней стремительно разросся из-за нежелания сторон идти на компромисс. Переброска военных ресурсов для борьбы с внутренней угрозой заметно ослабила фронт против националистов."
 lar_news.11.desc_2:0 "Продолжающиеся попытки правительства восстановить централизованный контроль над преимущественно самостоятельно действующими анархистскими коммунами на северо-востоке Испании, а также сталинистские репрессии против инакомыслящих коммунистов привели к открытому расколу среди республиканцев, победивших в гражданской войне.\n\nИзначально ограничивавшийся уличными боями и мелкими столкновениями между ополчениями и правительственными или сталинистскими силами конфликт всего за несколько дней стремительно разросся из-за нежелания сторон идти на компромисс. Поскольку лидеры фракций отказываются даже рассматривать примирение и уже формируются линии фронта, Испания, похоже, обречена на новую гражданскую войну."
 lar_news.11.a:0 "Прекрасно, пусть уничтожают друг друга!"
 lar_news.11.b:0 "Так или иначе, их вмешательство закончится."
 lar_news.11.b_2:0 "Они готовы поставить под угрозу нашу победу над националистами?!"
 lar_news.11.c:0 "Пора сбросить ярмо!"
 lar_news.11.d:0 "Республиканцам едва ли нужна внешняя помощь, чтобы проиграть..."
 lar_news.12.t:0 "[From.GetNameDefCap] вступает во фракцию [From.GetFactionName]"
 lar_news.12.desc:0 "Хотя государство [From.GetNameDef] всё ещё восстанавливается после гражданской войны, оно неожиданно договорилось о вступлении во фракцию [From.GetFactionName]. Похоже, масштабная помощь Оси, полученная националистами во время войны, не привела к более тесным отношениям между новым правительством [From.GetAdjective] и его иностранными покровителями."
 lar_news.12.a:0 "Нам нужны союзники."
 lar_news.12.b:0 "Мы приветствуем их в наших рядах."
 lar_news.12.c:0 "Тогда мы разгромим и их."
 lar_news.12.d:0 "Они выбрали свою сторону."
 lar_news.13.desc:0 "Хотя государство [From.GetNameDef] всё ещё восстанавливается после гражданской войны, оно неожиданно договорилось о вступлении во фракцию [From.GetFactionName]. Сотрудничество началось ещё во время войны, когда [From.GetNameDef] получило обширную военную помощь от [From.GetFactionName], и, похоже, это было лишь началом ещё более тесного будущего."
 lar_news.14.t:0 "[SPA.GetNameDefCap] требует Французскую Северную Африку"
 lar_news.14.desc:0 "После недель непрерывного давления [SPA.GetAdjective], завершившихся вчерашним ультиматумом, правительство [From.GetAdjective] не увидело иного выхода, кроме как уступить требованиям и отказаться от контроля над Северной Африкой ради сохранения мира с соседом."
 lar_news.14.a:0 "Они приняли мудрое решение."
 lar_news.14.b:0 "У нас не было другого выбора."
 lar_news.14.c:0 "Ублюдки отдают НАШУ территорию!"
 lar_news.14.d:0 "Одним росчерком пера мы потеряли Северную Африку..."
 lar_news.14.e:0 "Они пользуются случаем."
 lar_news.15.t:0 "Франко-испанская уния"
 lar_news.15.desc:0 "С тех пор как монархические движения в государствах [SPB.GetNameDef] и [FRA.GetNameDef] пришли к власти, франко-испанские отношения стали теснее, а внешняя политика обеих стран всё сильнее переплеталась.\n\nТеперь, после того как легитимистское движение в государстве [FRA.GetNameDef] официально признало короля [SPB.GetLeader] законным претендентом на французский престол, он сделал официальное заявление о намерении принять французскую корону. В ответ легитимистское правительство [FRA.GetNameDef] начало подготовку к пышной церемонии коронации в Реймсском соборе."
 lar_news.15.a:0 "Скоро возникнет великая держава!"
 lar_news.15.b:0 "Францию ждёт прекрасное будущее!"
 lar_news.15.c:0 "Это серьёзно изменит баланс сил!"
 lar_news.16.t:0 "Иберийская уния"
 lar_news.16.desc:0 "После месяцев давления со стороны правительства [SPB.GetAdjective] государство [POR.GetNameDef], изолированное, лишённое союзников и столкнувшееся с подавляющей военной мощью [SPB.GetAdjective], не увидело иного выхода, кроме как признать заявленные [SPB.GetLeader] права на престол [POR.GetAdjective]. В результате страна превратилась всего лишь в провинцию расширяющегося государства [SPB.GetNameDef]."
 lar_news.16.a:0 "Иберийская уния вновь такова, какой и должна быть!"
 lar_news.16.b:0 "Иберия снова едина? Любопытно."
 lar_news.17.t:0 "Монархия государства [From.GetAdjective] восстановлена"
 lar_news.17.b:0 "Рады за них."
 lar_news.18.desc:0 "Спустя несколько месяцев после неожиданного решения Франсиско Франко отказаться от власти и объявить о возвращении законного короля Испании [From.GetSPBkingloc] наконец сегодня утром прибыл в Мадрид. Под восторженные крики зрителей королевская процессия прошла по улицам города к церкви Сан-Херонимо-эль-Реаль.\n\nНа пышной церемонии [From.GetSPBking2loc].\n\nХотя значительная часть страны всё ещё лежит в руинах, возможно, новый король станет объединяющей и исцеляющей силой и поведёт [From.GetNameDef] к более славному будущему."
 lar_news.18.a:0 "Наконец мы вернулись к законному главе государства!"
 lar_news.18.b:0 "Но принесёт ли он заметные перемены?"
 lar_news.19.t:0 "Латинский блок"
 lar_news.19.desc:0 "Сегодня государство [From.GetNameDef] объявило о создании нового союза латинских держав, способного стать альтернативой крупнейшим мировым блокам. Несмотря на месяцы переговоров, пока неясно, какие страны решат вступить в новую организацию, хотя эксперты называют среди возможных участников государства [POR.GetNameDef], [FRA.GetNameDef] и [ITA.GetNameDef]."
 lar_news.19.a:0 "Это лучший способ защитить наши общие интересы."
 lar_news.19.b:0 "Смелый шаг."
 lar_news.20.t:0 "Война за независимость государства [SPD.GetAdjective]"
 lar_news.20.desc:0 "В последние месяцы отношения между государствами [SOV.GetAdjective] и [SPD.GetAdjective] становились всё напряжённее, а независимые наблюдатели отмечали систематическое отстранение коммунистов от влиятельных должностей [SPD.GetAdjective]. В ответ [SOV.GetNameDef] создало прямую оккупационную зону на востоке страны, пытаясь принудить непокорное правительство [SPD.GetAdjective] к подчинению.\n\nТеперь ситуация достигла предела: [SPD.GetLeader] выступил с пламенным радиообращением, провозгласил независимость [SPD.GetAdjective] и призвал сограждан «раз и навсегда избавить страну от советского влияния». Одновременно началось крупное внезапное наступление [SPD.GetAdjective] на оккупационную зону."
 lar_news.20.a:0 "¡За свободу!"
 lar_news.20.b:0 "Наша месть будет быстрой и ужасной!"
 lar_news.20.c:0 "Как удобно. ¡Удачи, Испания!"
 lar_news.20.d:0 "Из огня да в полымя..."
 lar_news.21.t:0 "Объединение Лондонского бюро"
 lar_news.21.desc:0 "По мере усиления государства [From.GetAdjective] правительство сочло возможным объявить о создании нового коммунистического союза — Международного бюро революционного социалистического единства, отвергающего как троцкистское, так и сталинистское толкование марксизма.\n\nНачав с «Лондонского бюро», комитета независимых коммунистических организаций, находящихся в Лондоне, оно теперь приглашает все страны, которые «желают следовать коммунистическим идеалам без внешнего вмешательства», присоединиться к своим рядам."
 lar_news.21.a:0 "Мы возглавим незапятнанный марксистский мир."
 lar_news.21.b:0 "Отвратительно!"
 lar_news.21.c:0 "Интересное предложение!"
 lar_news.21.d:0 "Коммунистическое движение раскалывается ещё сильнее!"
 lar_news.22.t:0 "Анархизм оказался успешен"
 lar_news.22.desc:1 "Хотя после окончания гражданской войны в Испании прошло уже некоторое время, ожидаемого краха анархистских коммун в Иберии не произошло. Напротив, сообщается, что коммунам удалось стабилизировать и восстановить регион, и они продолжают привлекать единомышленников-иммигрантов со всего мира.\n\nОднако из-за сохраняющейся международной враждебности коммуны решили сохранить организацию в рамках своего «совета обороны» и продолжить широкие программы вооружения."
 lar_news.22.a:1 "Мы многого добились, но должны готовиться к худшему!"
 lar_news.22.b:1 "Они представляют угрозу самому нашему образу жизни!"
 lar_news.23.t:0 "Иберийские государства вступают во фракцию [ENG.GetFactionName]"
 lar_news.23.desc:0 "Политики [POR.GetAdjective] и [?global.POR_iberian_summit_spanish_tag.GetAdjective] действовали сообща, обращаясь к правительству [ENG.GetAdjective] и добиваясь вступления во фракцию [ENG.GetFactionName]. Пока неясно, ищут ли они лишь защиты от внешних угроз или действительно готовы участвовать в борьбе за демократию.\n\nОднако, оценив ситуацию, [ENG.GetNameDefCap] решило, что это отвечает его интересам, и наконец позволило иберийским государствам вступить в союз."
 lar_news.23.a:0 "Теперь мы будем сражаться вместе."
 lar_news.23.b:0 "Для нас они всего лишь новое пушечное мясо."
 lar_news.23.c:0 "Вместе мы будем сражаться за свободу!"
 lar_news.23.d:0 "Иберийские государства наконец действуют сообща..."
 lar_news.24.t:0 "Иберийские государства вступают во фракцию [GER.GetFactionName]"
 lar_news.24.desc:0 "Политики [POR.GetAdjective] и [?global.POR_iberian_summit_spanish_tag.GetAdjective] действовали сообща, обращаясь к правительству [GER.GetAdjective] и добиваясь вступления во фракцию [GER.GetFactionName]. Пока неясно, является ли это оппортунистической попыткой получить новые территории или отчаянным стремлением избежать оккупации.\n\nОднако, оценив ситуацию, [GER.GetNameDefCap] решило, что это отвечает его интересам, и наконец позволило иберийским государствам вступить в союз."
 lar_news.24.a:0 "Мы выбрали правильную сторону."
 lar_news.24.b:0 "Теперь наши враги погибнут!"
 lar_news.24.c:0 "Они встали на сторону дьявола."
 lar_news.24.d:0 "Иберийские государства наконец действуют сообща..."
 lar_news.25.t:0 "Королевская свадьба в Бразилии"
 lar_news.25.desc:0 "Сегодня дон Дуарте Нуну, герцог Браганса, женился на принцессе Марии Франсишке Орлеан-Браганса в соборе Петрополиса в Бразилии. Этот брак не только примирил португальскую и бразильскую ветви Браганса, но и объединил мигелистов и либеральных Браганса, положив конец соперничеству внутри португальской королевской семьи и усилив монархические настроения в обеих странах.\n\nГоворят, после церемонии дон Дуарте беседовал с известными бразильскими и португальскими роялистами, причём слова «реставрация» и «монархия» звучали совершенно открыто."
 lar_news.25.a:0 "Это только начало."
 lar_news.25.b:0 "Интересное развитие событий..."
 lar_news.26.t:0 "Империя Португалии и Бразилии"
 lar_news.26.desc:0 "После восстановления монархии в Португалии и Бразилии португальский король и бразильский император провели несколько встреч, обсуждая необходимость и возможные выгоды нового объединения стран.\nПосле долгих переговоров на последнем бразильско-португальском саммите правители договорились официально восстановить государство [POR.GetNameDef].\n\nСегодня под приветственные крики монархистов [POR.GetLeader] был коронован императором Португалии и Бразилии. Император поблагодарил подданных за верность и заявил, что будет править ради всех граждан, находящихся под его властью."
 lar_news.26.a:0 "Да здравствует император!"
 lar_news.26.b:0 "Империя, которая восстала лишь затем, чтобы снова пасть."
 lar_news.26.c:0 "Всего лишь мания величия..."
 lar_news.27.t:0 "Объединение Иберии"
 lar_news.27.desc:1 "В последние месяцы португальские и испанские политики провели множество встреч, обсуждая возможность создания единого левого государства в Иберии, которым управляли бы представители обеих стран.\n\nПосле долгого периода подготовки и переговоров сегодня лидеры Португалии и Испании официально объявили о создании государства [POR.GetNameDef] — новой страны, где граждане Иберии смогут выбирать руководителей, лучше всего представляющих общие интересы, и свободно перемещаться по всей территории."
 lar_news.27.a:0 "Это только начало."
 lar_news.27.b:0 "Хорошая инициатива народов Иберии."
 lar_news.27.c:0 "Коммунистическая угроза распространяется как чума..."
 lar_news.27.d:0 "Всего лишь красивое название, скрывающее их истинные амбиции."
 lar_news.28.t:0 "Испанские республиканцы разгромлены"
 lar_news.28.desc:0 "Гражданская война в Испании, похоже, окончена: оставшиеся республиканские силы капитулировали или ушли в подполье. Хотя руководство националистов уже объявило войну завершённой, эксперты указывают на растущие разногласия внутри самой националистической фракции и считают, что конфликт может лишь переходить в новую фазу. После исчезновения общего врага эти противоречия, скорее всего, ещё сильнее расколют националистов.\n\nВ некоторой степени это понимают и лидеры националистов, и население: ополчения, созданные во время войны для борьбы с республиканцами, до сих пор не распущены и продолжают настороженно следить за соседями."
 lar_news.28.a:0 "По крайней мере, гражданская война развивается в нашу пользу."
 lar_news.28.b:0 "Похоже, конфликт ещё не урегулирован."
 lar_news.28.c:0 "Пусть после победы перегрызут друг другу глотки!"
 lar_news.28.d:0 "Лишь вопрос времени, когда нам придётся разобраться с карлистами..."
 lar_news.28.e:0 "Нужно действовать быстро, пока карлисты и фалангисты снова не раскололи страну!"
 lar_news.28.f:0 "Лишь вопрос времени, когда нам придётся разобраться с фалангистами..."
 lar_news.29.t:0 "Испанские националисты разгромлены"
 lar_news.29.desc:0 "Гражданская война в Испании, похоже, окончена: оставшиеся националистические силы капитулировали или ушли в подполье. Хотя руководство республиканцев уже объявило войну завершённой, эксперты указывают на растущие разногласия внутри самой республиканской фракции и считают, что конфликт может лишь переходить в новую фазу. После исчезновения общего врага эти противоречия, скорее всего, ещё сильнее расколют Вторую республику.\n\nВ некоторой степени это понимают и лидеры республиканцев, и население: ополчения, созданные во время войны для борьбы с националистами, до сих пор не распущены и продолжают настороженно следить за соседями."
 lar_news.29.d:0 "Лишь вопрос времени, когда нам придётся разобраться с правительством..."
 lar_news.29.e:0 "Лишь вопрос времени, когда нам придётся разобраться с анархистами..."
 lar_news.281.t:0 "Андалусия восстановлена!"
 lar_news.281.desc:0 "Много веков назад мавры были изгнаны из Иберии в ходе Реконкисты. Теперь войска [From.GetOldAdjective] глубоко продвинулись на юг полуострова и впервые за многие столетия начали создавать в регионе мавританские поселения. В результате государство [From.GetOldNameDefCap] было преобразовано в новую страну под названием «[From.GetNameDefCap]», претендующую на наследие древнего султаната, некогда правившего всей Иберией.\n\nДревний Омейядский халифат владел почти всем исламским миром — от Иберии на западе до Персии на востоке. Возможно, [From.GetLeader] стремится повторить путь этой империи и вновь объединить разрозненные народы Ближнего Востока, Северной Африки и Европы."
 lar_news.281.a:0 "Славный день!"
 lar_news.281.b:0 "Что это будет значить для Испании?"
 lar_news.291.t:0 "Полинезия объединилась!"
 lar_news.291.desc:0 "Теперь, когда острова Гавайи, Аотеароа, Таити и Самоа прочно находятся под контролем государства [From.GetOldAdjective], [From.GetLeader] провозгласил, что отныне страна будет называться [From.GetNameDef] и станет законной родиной всех народов Тихого океана.\n\nПо всему полинезийскому миру царит ликование, а некоторые даже называют [From.GetLeader] истинным преемником Камеамеа — гавайского короля, исполнившего пророчество Наха чуть более двух столетий назад."
 lar_news.291.new_zealand_desc:0 "Теперь, когда острова Гавайи, Аотеароа, Таити и Самоа прочно находятся под контролем государства [From.GetOldAdjective], [From.GetLeader] провозгласил, что отныне страна будет называться [From.GetNameDef] и станет законной родиной всех народов Тихого океана.\n\nИз-за долгой истории колониальной эксплуатации коренные маори часто не желали присягать на верность или поддерживать правительство [From.GetOldAdjective]. Однако после заключения союза Ратана между лидерами киви и маори и расширения представительства маори в правительстве государство [From.GetNameDef] стало образцом постколониального мультикультурализма."
 lar_news.291.a:0 "Превосходно!"
 lar_news.291.b:0 "Алоха!"
 LAR_fra_voted_independence_tt:0 "Проголосовали за независимость"
 SPR_core_of_spain_flag:0 "Является национальной территорией Испании."
 lar_fra_join_the_ententes.1.t:0 "[From.GetNameDefCap] предлагает стратегический союз"
 lar_fra_join_the_ententes.1.desc:0 "Правительство [From.GetAdjective] обратилось к нам с предложением примирить различающиеся стратегические интересы. Оно намерено выполнять дипломатические и военные обязательства на континенте, но также осознаёт общность наших интересов во многих регионах мира.\n\nПоэтому предлагается создать союз, гарантирующий взаимную помощь, если интересы одной из сторон окажутся под угрозой."
 lar_fra_join_the_ententes.1.a:0 "Разумное предложение."
 lar_fra_join_the_ententes.1.b:0 "Это не отвечает нашим интересам."
 lar_fra_join_the_ententes.2.t:0 "[From.GetNameDefCap] принимает наше предложение"
 lar_fra_join_the_ententes.2.desc:0 "Правительство [From.GetAdjective] обсудило предложенный союз и решило его принять. Пока дипломатические службы согласовывают детали, мы можем быть уверены, что государство [From.GetNameDef] придёт нам на помощь при необходимости — при условии, что мы будем готовы сделать то же самое."
 lar_fra_join_the_ententes.2.a:0 "Наш союз становится сильнее."
 lar_fra_join_the_ententes.3.t:0 "[From.GetNameDefCap] отклоняет наше предложение"
 lar_fra_join_the_ententes.3.desc:0 "После продолжительного обсуждения кабинет [From.GetAdjective] с небольшим перевесом проголосовал против нашего предложения. В официальном ответе отмечается, что союз между государствами [From.GetNameDef] и [This.GetNameDef] неизбежно обяжет [From.GetNameDef] защищать страны, с которыми оно сознательно решило себя не связывать. Мы, разумеется, свободны выбирать собственную внешнюю политику, однако не должны рассчитывать на помощь государства [From.GetNameDef], если окажемся втянуты в более масштабный конфликт."
 lar_fra_join_the_ententes.3.a:0 "Недальновидные глупцы!"
 LaR_france_vichy_notification_events.1.t:0 "Сирия переходит на сторону [FRA.GetLeader]"
 LaR_france_vichy_notification_events.1.desc:0 "После прямого обращения [FRA.GetLeader] губернатор территории объявил о верности так называемому «правительству [FRA.GetAdjective] в изгнании» во главе с [FRA.GetLeader]. Нашим войскам в регионе предложили присоединиться к силам [FRA.GetLeader], но большинство предпочло репатриацию на наши позиции.\n\nТем не менее теперь [FRA.GetLeader] контролирует регион."
 LaR_france_vichy_notification_events.1.a:0 "Измена и предательство!"
 LaR_france_vichy_notification_events.2.t:0 "Индокитай переходит на сторону [FRA.GetLeader]"
 LaR_france_vichy_notification_events.3.t:0 "Центральная Африка переходит на сторону [FRA.GetLeader]"
 LaR_france_vichy_notification_events.4.t:0 "Западная Африка переходит на сторону [FRA.GetLeader]"
 LaR_france_vichy_notification_events.5.t:0 "Северная Африка переходит на сторону [FRA.GetLeader]"
 LaR_france_vichy_notification_events.6.t:0 "Мадагаскар переходит на сторону [FRA.GetLeader]"
 LaR_france_vichy_notification_events.7.t:0 "Переворот сторонников [FRA.GetLeader] в Сирии"
 LaR_france_vichy_notification_events.7.desc:0 "Силы, верные [FRA.GetLeader], совершили переворот на территории. Незадолго до рассвета несколько вооружённых групп, явно действовавших по приказу [FRA.GetLeader], захватили стратегические объекты по всему региону, чтобы исключить возможность организованного сопротивления. К полудню они контролировали все крупные населённые пункты и фактически полностью овладели территорией."
 LaR_france_vichy_notification_events.7.a:0 "Какие низкие и совершенно нефранцузские методы!"
 LaR_france_vichy_notification_events.8.t:0 "Переворот сторонников [FRA.GetLeader] в Индокитае"
 LaR_france_vichy_notification_events.9.t:0 "Переворот сторонников [FRA.GetLeader] в Центральной Африке"
 LaR_france_vichy_notification_events.10.t:0 "Переворот сторонников [FRA.GetLeader] в Западной Африке"
 LaR_france_vichy_notification_events.11.t:0 "Переворот сторонников [FRA.GetLeader] в Северной Африке"
 LaR_france_vichy_notification_events.12.t:0 "Переворот сторонников [FRA.GetLeader] на Мадагаскаре"
 lar_spain.100.t:0 "Объединение испаноязычных народов!"
 lar_spain.100.d:0 "Сегодня [SPR.GetLeader] объявил об объединении всех испаноязычных народов под знаменем государства [SPR.GetNameDef]. Было заявлено, что их цель — защитить испаноязычные народы, привести их к процветанию и обеспечить существование империи ещё тысячу лет. Кроме того, они подчеркнули, что их национальная миссия ещё не завершена."
 lar_spain.100.a:0 "Они снова рухнут."
 lar_spain.100.b:0 "Мы вновь стали мировой державой!"
