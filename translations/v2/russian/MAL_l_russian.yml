l_russian:
 malaysia_focus:0 "Национальные фокусы Малайзии"
 MAL_the_empire:0 "Империя"
 MAL_the_empire_desc:0 "Автономия? Национализм? Самоопределение? Этой колонии ДЕЙСТВИТЕЛЬНО нужны твёрдая рука, крепкая хватка и истинно британская невозмутимость, клянусь Юпитером!"
 MAL_the_empire_1:0 "Генералы-резиденты"
 MAL_the_empire_1_desc:0 "Генералы-резиденты — ключ к контролю над Малайзией. Если мы расширим их и без того значительные полномочия и оттесним местных правителей, то сможем на долгие годы укрепить свою власть над колонией."
 MAL_the_empire_2:0 "Открыть государственную службу"
 MAL_the_empire_2_desc:0 "Стравливать местных жителей друг с другом до сих пор было выгодно, но в долгосрочной перспективе столь явно недемократическая система принесёт больше проблем, чем пользы. Открыть государственные должности для всех граждан Малайзии — правильное решение."
 MAL_the_empire_3:0 "Укрепить Кетуанан Мелаю"
 MAL_the_empire_3_desc:0 "Любая попытка изменить существующий порядок принесёт больше неприятностей, чем пользы. Вместо этого подтвердим приверженность принципу Кетуанан Мелаю и укрепим поддержку среди коренного малайского населения."
 MAL_the_empire_4:0 "Свергнуть князей"
 MAL_the_empire_4_desc:0 "Совет князей, последнее прибежище местной власти, был полезным инструментом дистанционного управления колонией, но теперь в нём больше нет нужды. Отныне мы будем править по своему усмотрению, и никакие мелочные распри князей нам не помешают."
 MAL_the_empire_5:0 "Жемчужина Востока"
 MAL_the_empire_5_desc:0 "Сингапур остаётся сердцем британского господства в Азии, связывая британские концессии в Китае с нашими далёкими тихоокеанскими владениями. Следует отметить это и превратить Сингапур в величайший город Юго-Восточной Азии!"
 MAL_the_empire_6:0 "Преимущества исследований Содружества"
 MAL_the_empire_6_desc:0 "Подтвердив верность империи, мы сможем пользоваться плодами этой преданности: получать сведения о научных открытиях и внедрять их в нашей колонии."
 MAL_the_empire_7:0 "Сражаться за империю"
 MAL_the_empire_7_desc:0 "Англия зовёт на помощь! И каждый верный подданный империи в Малайе откликнется — ради Бога и страны!"
 MAL_the_workers:0 "Рабочие"
 MAL_the_workers_desc:0 "Князья и губернаторы слишком долго эксплуатировали народ Малайзии. Но этому пришёл конец: мы силой установим власть народа на Малайском полуострове!"
 MAL_the_workers_1:0 "Набор против Японии"
 MAL_the_workers_1_desc:0 "Не секрет, что Япония хочет лишь заменить одного колониального хозяина другим. Из-за того, насколько нынешняя военная политика пренебрегает защитой нашей страны, это вполне может произойти. Чтобы отстоять свободу, простой народ должен сам взяться за оборону Малайзии."
 MAL_the_workers_2:0 "Поддержка Китая"
 MAL_the_workers_2_desc:0 "Китайские коммунисты — наши ближайшие союзники в рабочей революции, и у нас общий враг. Если их революция победит, мы обретём могущественного партнёра в борьбе за свободу."
 MAL_the_workers_3:0 "Поддержка Коминтерна"
 MAL_the_workers_3_desc:0 "Советы представляют собой мощную силу коммунистической революции, но почти не интересуются делами за пределами собственной сферы. Однако даже небольшая поддержка с их стороны придаст нашему режиму законность в глазах народа."
 MAL_the_workers_4:0 "Чрезвычайное положение"
 MAL_the_workers_4_desc:0 "Японцы уже здесь! Наш час настал, братья и сёстры. Да начнётся Малайзийская революция!"
 MAL_the_workers_5:0 "Революция победила!"
 MAL_the_workers_5_desc:0 "Вопреки всему и всем врагам мы выстояли перед гигантами империализма. Пусть наша победа станет искрой, которая разожжёт революцию по всей Азии!"
 MAL_the_workers_6:0 "Рабочие едины!"
 MAL_the_workers_6_desc:0 "Наш долг перед миром — бороться с империализмом везде, где это возможно. Так мы разнесём искру революции всё дальше, пока все рабочие мира не станут свободными!"
 MAL_the_workers_7:0 "Социализм в одной Малайзии"
 MAL_the_workers_7_desc:0 "Вообще-то, пожалуй, пусть эта искра останется здесь."
 MAL_status_quo:0 "Статус-кво"
 MAL_status_quo_desc:0 "Перемены? Кому нужны перемены?"
 MAL_state_of_malaya:0 "Малайское государство"
 MAL_state_of_malaya_desc:0 "Малайское государство"
 MAL_centralisation:0 "Централизация"
 MAL_centralisation_desc:0 "При нынешней политической системе губернатор практически не способен контролировать колонии. Чтобы реформировать их, необходимо сосредоточить власть в руках сильного центрального аппарата."
 MAL_centralisation_1:0 "Перестройка экономики"
 MAL_centralisation_1_desc:0 "Слишком большая часть экономического потенциала региона растрачивается из-за конкуренции производителей и манипуляций частных интересов. Для начала необходимо перестроить экономику Малайи, обеспечив государственное регулирование и защиту рынков."
 MAL_centralisation_2:0 "Национализировать плантации"
 MAL_centralisation_2_desc:0 "Каучуковые плантации обеспечивают большую часть нашего экспорта, но государство получает лишь малую долю прибыли. Национализировав некоторые мелкие и неэффективные плантации, мы подготовим почву для дальнейшего контроля над внешней торговлей."
 MAL_centralisation_3:0 "Пересмотреть иностранные инвестиции"
 MAL_centralisation_3_desc:0 "Наш статус колонии означает, что мы всегда будем иметь большой объем наших ресурсов, связанных с иностранными интересами, но если мы хотим добиться какого-либо долгосрочного финансового успеха, контроль и влияние этих иностранных активов должны быть пересмотрены в нашу пользу."
 MAL_decentralisation:0 "Децентрализация"
 MAL_decentralisation_desc:0 "Подлинная причина политических раздоров кроется в колониальной бюрократии и привилегиях элит, мешающих развитию. Упростив управление и вернув полномочия отдельным регионам, мы повысим шансы объединить страну."
 MAL_decentralisation_1:0 "Реинвестирование в экономику"
 MAL_decentralisation_1_desc:0 "Большая часть экономики остаётся неразвитой, а почти весь доход поступает от нескольких предприятий. Вложив их прибыль в новые направления роста, мы создадим более сбалансированную экономику и защитимся от будущих колебаний рынка."
 MAL_decentralisation_2:0 "Разрушить монополии"
 MAL_decentralisation_2_desc:0 "Плантационная экономика сосредоточивает огромные богатства и производство в руках немногих. Разделение плантаций на самостоятельные кооперативные участки разрушит эти монополии, хотя и снизит общий темп роста."
 MAL_decentralisation_3:0 "Самодостаточность"
 MAL_decentralisation_3_desc:0 "Продолжающаяся децентрализация экономики укрепила местную торговлю и управление ресурсами. Теперь вместо зависимости от импорта жизненно важных материалов мы можем надёжно обеспечивать граждан основными товарами независимо от мирового рынка."
 MAL_deslashcentralisation:0 "Нефедерированные государства"
 MAL_deslashcentralisation_desc:0 "Нефедерированные государства Малайзии ревностно охраняют свободу от британского контроля. Любая попытка объединить страну должна прежде решить, как обуздать этих непокорных князей."
 MAL_deslashcentralisation_1:0 "Совет"
 MAL_deslashcentralisation_1_desc:0 "Совет князей — ближайшее подобие местного органа власти, существующее в Малайзии. От того, станут князья нашими друзьями или врагами, во многом зависит успех объединения полуострова."
 MAL_deslashcentralisation_2:0 "Новая экономика Малайзии"
 MAL_deslashcentralisation_2_desc:0 "Обеспечив экономическое будущее, мы убедили граждан в самой идее единой Малайзии, где все сообща трудятся ради общего блага."
 MAL_deslashcentralisation_3:0 "Сингапурский вопрос"
 MAL_deslashcentralisation_3_desc:0 "Извините! Пока это ничего не делает."
 MAL_the_princes:0 "Князья"
 MAL_the_princes_desc:0 "Раджи и султаны Малайзии по-прежнему пользуются широкой народной поддержкой. Если мы сумеем мобилизовать и объединить их, то получим шанс освободиться от британской тирании."
 MAL_the_princes_1:0 "Подчинить Совет"
 MAL_the_princes_1_desc:0 "Несмотря на все недостатки, Совет выражает волю князей Малайзии. Поэтому первым шагом станет объединение его членов вокруг наших националистических целей — при необходимости посредством принуждения."
 MAL_the_princes_2:0 "Религия, язык, монархия"
 MAL_the_princes_2_desc:0 "Малайзия всегда была раздробленной землёй, но благодаря британским империалистам мы объединились под властью общего врага и против него. Прославим культурное единство в борьбе за свержение угнетателей."
 MAL_the_princes_3:0 "Оказать давление на колонии Проливов"
 MAL_the_princes_3_desc:0 "Колонии Проливов остаются единственной частью Британской Малайи вне власти монархов. Под предлогом защиты национальных прав мы потребуем отставки губернатора и назначения местного правителя в Совет, фактически положив конец британскому надзору."
 MAL_the_princes_4:0 "Божественное правление"
 MAL_the_princes_4_desc:0 "После укрепления положения Совета следует избрать из его состава монарха и назначить его главой страны — первым среди равных в управлении новой нацией."
 MAL_the_princes_4_a:0 "Власть народа"
 MAL_the_princes_4_a_desc:0 "Совет выполнил свою задачу, но остаётся лишь ещё одним орудием угнетения малайского народа. Мы ликвидируем его и поставим во главе страны истинного народного лидера."
 MAL_the_princes_5:0 "Божественное вмешательство"
 MAL_the_princes_5_desc:0 "Чтобы получить второй шанс в борьбе за свободу, нам понадобится внешняя поддержка. Японская империя выступает за Восточную Азию без западного господства — возможно, она поможет обеспечить нашу независимость."
 MAL_the_princes_6:0 "Единая Малайзия"
 MAL_the_princes_6_desc:0 "Наша страна стала свободной и равноправной, а её народ готов сражаться и умирать за суверенитет. Пусть малайская нация больше никогда никому не подчинится!"
 MAL_expand_the_realm:0 "Расширить владения"
 MAL_expand_the_realm_desc:0 "Различные территории, по праву считающиеся землями [ROOT.GetAdjective], давно были у нас отняты. Пора вернуть законные владения."
 MAL_the_nation:0 "Нация"
 MAL_the_nation_desc:0 "Чтобы обрести свободу, мы должны освободиться от всех тиранов — внутренних и внешних. Лишь демократическая воля народа способна обеспечить будущее независимой Малайзии."
 MAL_the_nation_1:0 "Малайя для малайцев"
 MAL_the_nation_1_desc:0 "Малайцы — законные граждане Малайзии. Только обратившись к этническому единству, мы сможем поднять народ на борьбу за свободу."
 MAL_the_nation_2:0 "Малайя для малайзийцев"
 MAL_the_nation_2_desc:0 "Свобода должна принадлежать всем — малайцам, китайцам и индийцам. Каждый мужчина и каждая женщина, считающие нашу страну своим домом, имеют право называться малайзийцами."
 MAL_the_nation_3:0 "Студенческие движения"
 MAL_the_nation_3_desc:0 "Молодёжь Малайзии, воспитанная на идеях независимости и свободы, — будущее страны. Мы должны подготовить её принять эстафету и повести народ к освобождению."
 MAL_the_nation_4:0 "Поддержать власть князей"
 MAL_the_nation_4_desc:0 "Хотя мы твёрдо придерживаемся демократических ценностей, нельзя игнорировать популярность князей Малайзии. Некоторые гарантии их положения могут обеспечить поддержку, необходимую для провозглашения независимости."
 MAL_the_nation_5:0 "Переговоры о коалиции"
 MAL_the_nation_5_desc:0 "Коммунисты немногочисленны и не слишком популярны, но весьма деятельны. Возможно, предложение политической коалиции предотвратит будущие потрясения."
 MAL_the_nation_6:0 "Отстранить генералов-резидентов"
 MAL_the_nation_6_desc:0 "Генералы-резиденты проникли во все сферы жизни страны, издалека контролируя народ и манипулируя им. Осудив эту должность и отказавшись слушать их ядовитые «советы», мы покажем, насколько хрупок британский контроль."
 MAL_the_nation_7:0 "Малайская Федерация"
 MAL_the_nation_7_desc:0 "Мы — сияющий маяк свободы в Восточной Азии. Единственные среди соседей, мы создали оплот единства, демократии и свободы для всех. Берсекуту Бертомбах Муту!"
 MAL_the_air:0 "Авиация"
 MAL_the_air_desc:0 "Наши военно-воздушные силы совершенно не готовы поддерживать основные войска. Сосредоточившись на развитии авиации, мы исправим положение и обеспечим надёжное прикрытие наземных и морских операций."
 MAL_the_air_1:0 "Реквизиции КВВС"
 MAL_the_air_1_desc:0 "Излишки снабжения КВВС, возможно, не лучшего качества, зато доступны и дёшевы. Эти реквизиции станут основой наших новых военно-воздушных сил."
 MAL_the_air_2:0 "Усилия по противовоздушной обороне"
 MAL_the_air_2_desc:0 "Несмотря на все усилия по модернизации авиации, мы, вероятно, проиграем борьбу за своё небо. Зенитные укрепления позволят продолжать сопротивление с земли даже после поражения в воздухе."
 MAL_the_air_3:0 "Подготовка истребителей-перехватчиков"
 MAL_the_air_3_desc:0 "Лишить врага превосходства в воздухе будет непросто, но специальная подготовка к воздушным боям позволит экипажам эффективнее защищать наше небо."
 MAL_the_island:0 "Остров"
 MAL_the_island_desc:0 "Если падёт Сингапур, падёт и колония. Заблаговременное укрепление всего полуострова жизненно важно для организации обороны."
 MAL_the_island_1:0 "Реорганизация армии"
 MAL_the_island_1_desc:0 "Наши сухопутные силы представляют собой смесь колониальных призывников, британских новобранцев и местного ополчения. Для отражения вторжения эти разрозненные части необходимо объединить в единую боеспособную армию."
 MAL_the_island_2:0 "Обезопасить север"
 MAL_the_island_2_desc:0 "Сиам слаб и, скорее всего, уступит любому внешнему давлению. Пограничные укрепления и усиленное патрулирование станут первым шагом к защите рубежей."
 MAL_the_island_3:0 "Укрепить города"
 MAL_the_island_3_desc:0 "Возможно, мы не сумеем удержать сплошной фронт против наступающего врага, но защита крупнейших населённых пунктов позволит отсрочить возможный крах колонии."
 MAL_the_island_air_straits:0 "Превентивные меры"
 MAL_the_island_air_straits_desc:0 "Война неизбежна, и готовиться нужно уже сейчас. Законы военного времени могут оказаться непопулярными, но без них колонию не защитить."
 MAL_the_island_air_straits_1:0 "Законы военного времени"
 MAL_the_island_air_straits_1_desc:0 "Худшее уже произошло. Времени на планы, умиротворение и подготовку больше нет — теперь остаётся ждать, надеяться и сражаться."
 MAL_the_island_air_straits_2:0 "Взорвать дамбы"
 MAL_the_island_air_straits_2_desc:0 "В качестве последней попытки задержать наступление врага необходимо уничтожить дамбы, соединяющие остров Сингапур с материком. Ни шагу назад."
 MAL_the_straits:0 "Проливы"
 MAL_the_straits_desc:0 "Единственная цель существования Британской Малайи как колонии — обеспечивать морское господство в проливах Юго-Восточной Азии. Если мы не способны этого сделать, на мировой арене мы не стоим ничего."
 MAL_the_straits_1:0 "Сингапурские верфи"
 MAL_the_straits_1_desc:0 "Наши судостроительные мощности невелики, но их можно значительно расширить. Подчинив гражданское судоходство Сингапура, мы начнём строить собственный флот."
 MAL_the_straits_2:0 "Запросить соединение «Z»"
 MAL_the_straits_2_desc:0 "Хотя мы контролируем ключевой узел Юго-Восточной Азии, британское командование отказывается передавать нам малайский флот. Если удастся его переубедить, наша морская мощь в регионе существенно возрастёт."
 MAL_the_straits_3:0 "Тактика противодесантной обороны"
 MAL_the_straits_3_desc:0 "Вскоре мы вполне можем столкнуться с полномасштабным морским вторжением. Поэтому необходимо защитить все порты от захвата, лишив противника возможности снабжать десант."
 MAL_RND:0 "НИО"
 MAL_RND_desc:0 "Недавнее расширение автономии позволяет создать полноценный научно-исследовательский отдел, который будет разрабатывать технологии для защиты и приспособления к условиям колонии."
 MAL_RND_1:0 "Модернизация снаряжения"
 MAL_RND_1_desc:0 "Новое снаряжение и технологии полезны лишь тогда, когда мы способны полноценно внедрить их в вооружённых силах."
 MAL_RND_2:0 "Усилия по развитию флота"
 MAL_RND_2_desc:0 "У нас уже есть значительные военно-морские силы в регионе, но для их сохранения необходимо развивать местную судостроительную промышленность, способную ремонтировать и совершенствовать флот."
 MAL_RND_3:0 "Доктрина войны в джунглях"
 MAL_RND_3_desc:0 "Большая часть Малайского полуострова покрыта густыми джунглями. Подготовка войск к действиям в таких условиях даст нам преимущество перед любым иноземным захватчиком."
 MAL_RND_4:0 "Мобилизация пехоты"
 MAL_RND_4_desc:0 "Малайская местность может стать настоящим адом для обычной техники. Сделав ставку на лёгкие пехотные части, мы сможем быстрее перебрасывать подкрепления туда, где они необходимы."
 MAL_RND_5:0 "Сохранение флота"
 MAL_RND_5_desc:0 "В открытом сражении наш флот никогда не сравнится с силами соседей. Поэтому главной целью должно стать сохранение кораблей и вступление в бой лишь при крайней необходимости."
 MAL_RND_6:0 "Глубокоэшелонированная оборона"
 MAL_RND_6_desc:0 "Удерживать территорию проще, чем захватывать её. Обучив войска быстрой организации обороны и окапыванию, мы сумеем защищать ключевые земли даже от самых опасных врагов."
 MAL_RND_7:0 "Механизация"
 MAL_RND_7_desc:0 "Пехота не может далеко уйти пешком. Включение моторизованной техники в вооружённые силы позволит избежать изоляции наших частей в джунглях от союзных линий."
 MAL_RND_8:0 "Флот Проливов"
 MAL_RND_8_desc:0 "Главная задача флота — сохранять контроль над Малаккским проливом. Увеличение численности кораблей для более эффективного патрулирования жизненно важно для нашего морского суверенитета."
 MAL_RND_9:0 "Подготовка морской пехоты"
 MAL_RND_9_desc:0 "Британская Малайя необычна тем, что два её главных региона разделяет сравнительно узкий водный промежуток. Если одна из колоний падёт, наши войска должны суметь провести успешную морскую операцию и вернуть её."
 MAL_RND_10:0 "Теоретические исследования"
 MAL_RND_10_desc:0 "Проторённый путь может привести лишь до определённого предела. Вместо этого следует разрабатывать новые технологии и проекты на случай войны."
 MAL_worldstage:0 "Мировая арена"
 MAL_worldstage_desc:0 "Став независимой страной, мы можем обратить взгляд к соседям и начать выстраивать с ними новые отношения."
 MAL_worldstage_1:0 "Поддержать индонезийских коммунистов"
 MAL_worldstage_1_desc:0 "Индонезия созрела для революции. Общая культура и история ставят нас в уникальное положение и позволяют помочь ей добиться этой цели."
 MAL_worldstage_2:0 "Освободить Филиппины"
 MAL_worldstage_2_desc:0 "Американская империя — лишь другая разновидность империализма. Мы должны помочь соседям на Филиппинах и спасти их от самих себя."
 MAL_worldstage_3:0 "Малаккская империя"
 MAL_worldstage_3_desc:0 "Сиам слаб и коррумпирован, но удерживает земли, по праву принадлежащие нашему народу. Мы исправим эту несправедливость и восстановим величие предков."
 MAL_worldstage_4:0 "Объединить наш народ"
 MAL_worldstage_4_desc:0 "Не слова и речи объединят наш народ, а война — и только война — принесёт нашим землям единство и окончательный мир."
 MAL_worldstage_5:0 "Нусантара"
 MAL_worldstage_5_desc:0 "Нусантара — это идея, объединяющая все народы Индонезийского архипелага в единый народ, и этой идеей мы должны поделиться с нашими южными братьями."
 MAL_worldstage_6:0 "Поддержать движения за независимость"
 MAL_worldstage_6_desc:0 "Демократия заразительна. Пробудив сердца и умы наших собратьев по колониальному ярму, мы посеем семя, которое не сможет вытоптать даже самый жестокий империализм."
 MAL_worldstage_7:0 "Малфилиндо"
 MAL_worldstage_7_desc:0 "Мы доказали, что способны построить устойчивую демократию в Юго-Восточной Азии, и вправе потребовать, чтобы все народы региона получили такую же возможность."
 MAL_japanese_puppet:0 "Верный слуга"
 MAL_japanese_puppet_desc:0 "Бороться против нового порядка бессмысленно: лучше принять подчинённое положение, чем сопротивляться и быть сокрушёнными."
 MAL_japanese_puppet_1:0 "Имперский брат?"
 MAL_japanese_puppet_1_desc:0 "Мы доказали свою верность и получили полагающиеся за неё блага. Продолжим же с радостью служить Хризантемовому трону."
 MAL_seek_investors:0 "Найти инвесторов"
 MAL_seek_investors_desc:0 "Будучи колонией, мы располагаем редкой возможностью привлечь западные державы региона к новым экономическим предприятиям и тем самым лучше развить собственную экономику."
 mal_mining_decisions:0 "Горнодобывающая промышленность Малайи"
 mal_mining_decisions_desc:0 "Малайя обладает огромным горнодобывающим сектором. Здесь находится третий по величине вольфрамовый рудник в мире... но надолго ли? Геологи уверены: через несколько лет месторождение истощится, и в этом районе можно будет добывать лишь ограниченные объёмы руды."
 mal_independence_decisions:0 "Выжидая подходящий момент"
 mal_independence_decisions_desc:0 "Хотя нам отказали в свободе, надежда ещё не потеряна. Империя в любой момент может оказаться втянута в войну, и тогда мы нанесём удар."
 mal_declare_independence:0 "Провозгласить независимость"
 mal_independence_tooltip:0 "Наш сюзерен занят крупной войной."
