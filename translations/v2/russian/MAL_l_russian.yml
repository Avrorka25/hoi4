 malaysia.6.t:0 "Нефедеративные государства"
 malaysia.6.desc:0 "Нефедеративные государства Малайи возникли вследствие постепенной и незапланированной колонизации Малайского полуострова. Несмотря на попытки упорядочить эти разрозненные образования, до сих пор мы не добились успеха. Пришло время окончательно решить судьбу Нефедеративных государств и их будущее в составе колонии."
 malaysia.6.a:0 "Полностью включить их в состав колонии!"
 malaysia.6.b:0 "Сосредоточиться на их объединении с федеративными собратьями."
 malaysia.6.c:0 "Оставить их в покое."
 malaysia.7.t:0 "Совет князей"
 malaysia.7.desc:0 "«Маджлис Раджа-Раджа», Совет правителей, был одной из первых уступок новообразованным Федеративным Малайским Государствам. Хотя его практическая власть ограничена, входящие в совет князья и раджи обладают огромным влиянием в регионе, и с ними необходимо разобраться до начала дальнейшей модернизации."
 malaysia.7.a:0 "Расширить их полномочия."
 malaysia.7.b:0 "Попытаться оттеснить их от власти."
 malaysia.7.c:0 "Полностью распустить совет."
 malaysia.8.t:0 ""
 malaysia.8.desc:0 ""
 malaysia.8.a:0 ""
 malaysia.8.b:0 ""
 malaysia.9.t:0 "Новая Британская Малайя"
 malaysia.9.desc:0 "После того, как окончательные остатки местной автономии были устранены, британский контроль над Малайзией имеет первостепенное значение. Хотя однажды это может снова преследовать нас, на данный момент это позволяет нам беспрецедентно контролировать колонию."
 malaysia.9.a:0 "Боже, храни короля!"
 malaysia.10.t:0 "Чрезвычайное положение в Малайе"
 malaysia.10.desc:0 "На фоне растущих опасений японской оккупации малайские коммунистические агитаторы сумели штурмом взять резиденцию губернатора в Сингапуре и захватить власть в колонии. В других поселениях вспыхнули бои между партизанами и полицейскими подразделениями, а коммунисты, воспользовавшись моментом, провозгласили независимость от нас!"
 malaysia.10.a:0 "Скатертью дорога."
 malaysia.10.b:0 "Единственный допустимый красный цвет — на Юнион Джеке!"
 malaysia.11.t:0 ""
 malaysia.11.desc:0 ""
 malaysia.11.a:0 ""
 malaysia.11.b:0 ""
 malaysia.12.t:0 "Новая Малайзия"
 malaysia.12.desc:0 "Теперь, когда наше экономическое будущее обеспечено, граждане начинают по-настоящему верить в идею единой Малайзии, где все сообща трудятся ради общего блага."
 malaysia.12.a:0 "Берсекуту Бертаambah Муту!"
 malaysia.13.t:0 "Малайзия разрывает связи!"
 malaysia.13.desc:0 "Несмотря на все наши усилия ограничить автономию Малайзии, конфедерация князей, предпринимателей и влиятельных местных активистов сумела парализовать колонию. Они потребовали полной политической и экономической автономии Малайзии и захватили Сингапур!"
 malaysia.13.a:0 "Хорошо, пусть сами разбираются с вторжением."
 malaysia.13.b:0 "Они обезумели? Отправить флот!"
 malaysia.14.t:0 ""
 malaysia.14.desc:0 ""
 malaysia.14.a:0 ""
 malaysia.14.b:0 ""
 malaysia.15.t:0 "Требования малайзийских националистов"
 malaysia.15.desc:0 "Коалиция князей Британской Малайи потребовала вернуть Стрейтс-Сетлментс под княжеское управление. Требование местного представительства пользуется широкой поддержкой, однако фактически лишит нас контроля над материковой Малайзией, за чем вскоре последует независимость."
 malaysia.15.a:0 "Возможно, они справятся лучше нас."
 malaysia.15.b:0 "С каких пор мы слушаем местных?"
 malaysia.16.t:0 "Британия отказывает"
 malaysia.16.desc:0 "Министерство иностранных дел категорически отказалось идти на уступки в вопросе местной автономии. Обстановка на местах напряжённая, но губернатор пока остаётся на своём посту."
 malaysia.16.a:0 "Нам придётся искать свободу в другом месте."
 malaysia.17.t:0 ""
 malaysia.17.desc:0 ""
 malaysia.17.a:0 ""
 malaysia.17.b:0 ""
 malaysia.18.t:0 "Малайзия просит расширить автономию"
 malaysia.18.desc:0 "Доказав свою верность, наше правительство в Малайзии попросило предоставить ему более широкую автономию в регионе в награду за неизменное повиновение. "
 malaysia.18.a:0 "Хорошо."
 malaysia.18.b:0 "Они ещё не доказали свою преданность."
 malaysia.19.t:0 "Малайзия требует деколонизации!"
 malaysia.19.desc:0 "Завоевав в тяжёлой борьбе свободу от британцев, Малайзия теперь обратила внимание на нас и требует уважать суверенные права индонезийского народа и начать подготовку к деколонизации. Военной угрозы они почти не представляют, но подавить местное восстание при поддержке Малайзии будет куда сложнее. Как нам ответить?"
 malaysia.19.a:0 "Возможно, они правы."
 malaysia.19.b:0 "С каких пор Малайзия нам приказывает?"
 malaysia.20.t:0 "Малайзия требует деколонизации!"
 malaysia.20.desc:0 "Завоевав в тяжёлой борьбе свободу от британцев, Малайзия теперь обратила внимание на нас и требует уважать суверенные права филиппинского народа и начать подготовку к деколонизации. Военной угрозы они почти не представляют, но подавить местное восстание при поддержке Малайзии будет куда сложнее. Как нам ответить?"
 malaysia.20.a:0 "Возможно, они правы."
 malaysia.20.b:0 "С каких пор Малайзия нам приказывает?"
 malaysia.21.t:0 "Малайзия просит поддержки!"
 malaysia.21.desc:0 "Колонию Британская Малайя охватило местное националистическое движение. Пока его усилия удавалось пресекать, однако делегация местных правителей тайно направила посланника, обещая подчинение в обмен на поддержку их борьбы за свободу."
 malaysia.21.a:0 "Они её получат."
 malaysia.21.b:0 "Это слишком рискованно."
 malaysia.22.t:0 "Япония настаивает на независимости Малайзии"
 malaysia.22.desc:0 "Похоже, что наши попытки подавить независимость Малайзии дали обратный эффект, японский император лично потребовал от Великобритании признать независимость Малайзии и пригрозил принять меры, если мы не откажемся от колонии. Это почти наверняка позволит Малайзии попасть в руки японцев, но отказ может втянуть нас в неблагоприятную войну, что нам делать?"
 malaysia.22.a:0 "У нас нет выбора, придётся уступить."
 malaysia.23.b:0 "Похоже, мы выразились недостаточно ясно: НЕТ."
 malaysia.23.t:0 "Япония отказывает"
 malaysia.23.desc:0 "То ли из безразличия, то ли из-за неспособности помочь Япония отказалась поддержать нашу борьбу за свободу. Мы снова предоставлены сами себе."
 malaysia.23.a:0 "Наше время ещё придёт."
 malaysia.24.t:0 "Англия отказывается отступать!"
 malaysia.24.desc:0 "Несмотря на напряжённость в регионе и хаос у собственных границ, Британская империя отказалась покинуть Малайзию. Похоже, чтобы выполнить данное обещание поддержки, нам придётся применить силу."
 malaysia.24.a:0 "Наконец-то достойный противник."
 malaysia.24.b:0 "Давайте подождем более благоприятной возможности."
 malaysia.25.t:0 "Малайзия восстаёт!"
 malaysia.25.desc:0 "Когда война наконец достигла наших берегов, прежде относительно устойчивое положение в малайзийских колониях полностью рухнуло. Возмущённые нашим прежним отказом предоставить независимость, националисты безжалостно изгнали из страны всех колониальных чиновников и провозгласили полностью независимое государство."
 malaysia.25.a:0 "Хорошо"
 malaysia.25.b:0 "Хорошо"
 malaysia.26.t:0 "Добыча вольфрама замедляется"
 malaysia.26.desc:0 "Как и предсказывали геологи, добыча вольфрама начинает сокращаться. Возможно, потребуется вмешательство, но в любом случае оно лишь отсрочит неизбежное. Рано или поздно пригодная для добычи руда полностью иссякнет."
 malaysia.26.a:0 "Хорошо"
