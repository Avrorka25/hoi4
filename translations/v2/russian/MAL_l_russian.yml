 malaysia.1.t:0 "Положение в колонии"
 malaysia.1.desc:0 "Несмотря на внешнее спокойствие, поселения, протектораты и союзы с местными правителями, составляющие Британскую Малайю, охвачены напряжённостью. Вместо полноценного государства Британская Малайя представляет собой лоскутное объединение различных князей и генералов-резидентов, фактически возглавляемое губернатором Сингапура. Колония готова рухнуть в любой момент и нуждается в масштабной перестройке, чтобы пережить грядущую бурю."
 malaysia.1.a:0 "Пора браться за работу."
 malaysia.2.t:0 "Малайзия просит военно-морскую автономию"
 malaysia.2.desc:0 "Несмотря на значительное расстояние между метрополией и нашими азиатскими территориями, управление военно-морскими силами региона по-прежнему осуществляется из Лондона, а не из Сингапура. Ссылаясь на неэффективность такого устройства и преимущества местного управления флотом, Дальневосточное командование просит передать часть азиатского флота под контроль Британской Малайи."
 malaysia.2.a:0 "Разумная просьба."
 malaysia.2.b:0 "Об этом не может быть и речи!"
