l_russian:
 COG_embrace_new_identity:0 "Принять новую идентичность"
 COG_embrace_new_identity_desc:0 "Теперь, когда мы добились независимости, следует оставить колониальное прошлое позади и вернуть главным городам их истинные названия."
 COG_abandon_colonial_identity:0 "Отказаться от колониальной идентичности"
 COG_abandon_colonial_identity_desc:0 "Новый коммунистический режим в Конго не может демонстрировать торжество революции, пока названия городов остаются живыми символами империалистического буржуазного прошлого. Чтобы окончательно покончить с этим, ряд городов следует переименовать в честь героев революции и вдохновителей пролетариата."
 COG_return_of_colonial_administration:0 "Вернуть колониальную администрацию"
 COG_return_of_colonial_administration_desc:0 "Теперь, когда [COG.GetNameDef] вновь находится под нашим контролем, следует восстановить колониальные названия городов."
 COG_infantry_equipment_0:0 "Маузер обр. 1889"
 COG_infantry_equipment_0_short:0 "Маузер m89"
 COG_infantry_equipment_1:0 "Маузер обр. 1935"
 COG_infantry_equipment_1_short:0 "Маузер m35"
