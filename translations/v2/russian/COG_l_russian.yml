 COG_anti_tank_equipment_1:0 "47-мм противотанковая пушка обр. 1931"
 COG_anti_tank_equipment_1_short:0 "C.47 F.R.C. Mle31"
 COG_anti_tank_equipment_1_desc:0 "47-мм пушка образца 1931 года производилась компанией «Фондери Руаяль де Канон» и пользовалась отличной репутацией; на её основе был создан истребитель танков T-13."
 COG_anti_tank_equipment_2:0 "60-мм противотанковая пушка"
 COG_anti_tank_equipment_2_short:0 "C.60"
 COG_anti_tank_equipment_2_desc:0 "60-мм бельгийское противотанковое орудие было мощным, но редким. Его так и не развернули в полевых частях, поскольку производство считалось слишком дорогим. Все выпущенные орудия использовались в крепостях, главным образом вокруг Льежа."
 COG_artillery_equipment_2:0 "120-мм пушка обр. 1931"
 COG_artillery_equipment_2_short:0 "120 L Mle 1931"
 COG_anti_air_equipment_1:0 "Бофорс 40 мм"
 COG_anti_air_equipment_1_short:0 "Бофорс 40 мм"
 COG_anti_air_equipment_2:0 "75 мм Бурж/FRC Mle 1936"
 COG_anti_air_equipment_2_short:0 "75 мм FRC Mle 1936"
 COG_colonial_autonomy:0 "Колониальная автономия"
 COG_colonial_autonomy_desc:0 "Мы уже просили министерство колоний предоставить нам больше свобод, но всякий раз получали отказ."
 COG_empower_congolese:0 "Расширить права народа [COG.GetAdjective]"
 COG_empower_congolese_desc:0 "Слишком долго коренное население находилось под властью колониальных угнетателей из-за моря. Народ [COG.GetAdjective] должен встать на путь равенства и интернационализма, чтобы воплотить мечту о независимости."
 COG_burn_royal_portraits:0 "Сжечь королевские портреты"
 COG_burn_royal_portraits_desc:0 "Сжечь королевские портреты"
 COG_affinity_fascism:0 "Фашистские тенденции"
 COG_affinity_fascism_desc:0 "Фашистские тенденции"
 COG_affinity_new_order:0 "Тяготение к Новому порядку"
 COG_affinity_new_order_desc:0 "Тяготение к Новому порядку"
 COG_independence:0 "Свергнуть правительство Пьера Рикманса"
 COG_independence_desc:0 "Теперь, когда мы заручились достаточной поддержкой в главных городах [COG.GetAdjective] и среди «Форс Пюблик», следует провести переворот. Удар в самое сердце нынешней системы освободит нас от бельгийского влияния."
 COG_doctrinal_marxism:0 "Доктринальный марксизм"
 COG_doctrinal_marxism_desc:0 "Марксизм-ленинизм — единственный путь к освобождению рабочих от тирании капиталистов, которые всё сильнее увеличивают продолжительность труда на шахтах. Пора объединиться и добиться создания единого сильного профсоюза."
 COG_masses_education:0 "Образование для масс"
 COG_masses_education_desc:0 "Ликвидация неграмотности — первый необходимый шаг к освобождению рабочих."
 COG_political_commissars:0 "Политические комиссары"
 COG_political_commissars_desc:0 "«Эти приказы не соответствуют линии партии!»"
 COG_communist_army:0 "Коммунистическая армия"
 COG_communist_army_desc:0 "Революция в опасности! К оружию!"
 COG_join_comintern:0 "Вступить в Коминтерн"
 COG_join_comintern_desc:0 "[SOV.GetNameDefCap] — сердце революции; было бы глупо не следовать её указаниям."
 COG_african_diplomacy:0 "Африканская дипломатия"
 COG_african_diplomacy_desc:0 "Будучи свободной страной в центре Африки, мы должны утвердить своё положение на континенте."
 COG_influence_liberia:0 "Повлиять на Либерию"
 COG_influence_liberia_desc:0 "Либерия задумывалась как земля для свободных потомков рабов. Их предков освободили от цепей рабства, а теперь их самих необходимо освободить от пролетарской эксплуатации."
 COG_influence_south_africa:0 "Повлиять на [SAF.GetNameDef]"
 COG_influence_south_africa_desc:0 "Коренные жители государства [SAF.GetNameDef] слишком долго подвергались угнетению. Мы должны указать им путь социализма, освободить от колониального гнёта и привлечь на свою сторону."
 COG_technology_sharing_communism:0 "Научное братство"
 COG_technology_sharing_communism_desc:0 "Наука приведёт человечество по истинному пути социализма."
 COG_force_publique_conscription:0 "Ограничения «Форс Пюблик»"
 COG_force_publique_conscription2:0 "Набор в «Форс Пюблик»"
 COG_colonial_security:0 "Колониальная безопасность"
 COG_belgo_congolese_research_cooperation:0 "Бельгийско-конголезское научное сотрудничество"
 COG_pleas_for_autonomy:0 "Призыв к автономии"
 COG_pleas_for_autonomy_desc:0 "Местное население организует демонстрации и протестные движения по всей стране в поддержку колониальной автономии, а некоторые требуют создания независимого государства Конго!"
 COG_german_scientific_advisors:0 "Научные советники: [GER.GetAdjective]"
 COG_italian_scientific_advisors:0 "Советники: [ITA.GetAdjective]"
 COG_colonial_manpower:0 "Людские ресурсы колонистов"
 COG_support_communism_africa:0 "Коммунистическая поддержка: [COG.GetAdjective]"
 COG_Support_the_congo_railways:0 "Офис де Транспорт Колоньо"
 COG_Support_the_congo_railways_desc:0 "Основанный в 1935 году «Офис де Транспорт Колоньо», или ОТРАКО («Бюро колониального транспорта»), отвечал за железнодорожную систему Бельгийского Конго."
 COG_congo_rubber:0 "Расширить каучуковые плантации"
 COG_congo_rubber_desc:0 "Тропический климат Конго идеально подходит для каучуковых плантаций. Использование новых сортов и расширение посадок быстро увеличат производство. Мы уверены, что местное население с радостью поможет нам в этом."
 COG_congo_rubber2:0 "Повысить производительность плантаций"
 COG_congo_rubber2_desc:0 "Тропический климат Конго идеально подходит для каучуковых плантаций. Использование новых сортов и расширение посадок быстро увеличат производство. Мы уверены, что местное население с радостью поможет нам в этом."
 COG_congo_rubber3:0 "Эксплуатировать дикорастущие каучуконосы"
 COG_congo_rubber3_desc:0 "Для снабжения военной машины требуется всё больше каучука, и одних плантаций уже недостаточно. Чтобы ещё сильнее увеличить производство, можно отправить часть населения в джунгли для добычи латекса из каучуковых лиан, высаженных ещё при Леопольде II, когда организованных плантаций почти не существовало. Растения рода ландольфия сложнее в обработке, но дают тот же латекс."
 COG_congo_rubber4:0 "Максимизировать добычу каучука"
 COG_congo_rubber4_desc:0 "Тропический климат Конго идеально подходит для каучуковых плантаций. Использование новых сортов и расширение посадок быстро увеличат производство. Мы уверены, что местное население с радостью поможет нам в этом."
 COG_support_tungsten_mining:0 "Начать добычу вольфрама: [COG.GetAdjective]"
 COG_support_tungsten_mining_desc:0 "Богатые рудные залежи, обнаруженные за долгие годы в различных районах Конго, лишь ждут, когда цивилизация возьмёт их в свои руки."
 COG_support_tungsten_mining2:0 "Расширить вольфрамовые шахты: [COG.GetAdjective]"
 COG_support_tungsten_mining2_desc:0 "Богатые рудные залежи, обнаруженные за долгие годы в различных районах Конго, лишь ждут, когда цивилизация возьмёт их в свои руки."
 COG_support_tungsten_mining3:0 "Ещё больше расширить вольфрамовые шахты"
 COG_support_tungsten_mining3_desc:0 "Богатые рудные залежи, обнаруженные за долгие годы в различных районах Конго, лишь ждут, когда цивилизация возьмёт их в свои руки."
 COG_support_tungsten_mining4:0 "Максимизировать добычу вольфрама"
 COG_support_tungsten_mining4_desc:0 "Богатые рудные залежи, обнаруженные за долгие годы в различных районах Конго, лишь ждут, когда цивилизация возьмёт их в свои руки."
 COG_support_copper_mining:0 "Начать добычу меди: [COG.GetAdjective]"
 COG_support_copper_mining_desc:0 "Богатые рудные залежи, обнаруженные за долгие годы в различных районах Конго, лишь ждут, когда цивилизация возьмёт их в свои руки."
 COG_support_copper_mining2:0 "Расширить медные шахты: [COG.GetAdjective]"
 COG_support_copper_mining2_desc:0 "Богатые рудные залежи, обнаруженные за долгие годы в различных районах Конго, лишь ждут, когда цивилизация возьмёт их в свои руки."
 COG_support_copper_mining3:0 "Ещё больше расширить медные шахты"
 COG_support_copper_mining3_desc:0 "Богатые рудные залежи, обнаруженные за долгие годы в различных районах Конго, лишь ждут, когда цивилизация возьмёт их в свои руки."
 COG_support_copper_mining4:0 "Максимизировать добычу меди"
 COG_support_copper_mining4_desc:0 "Богатые рудные залежи, обнаруженные за долгие годы в различных районах Конго, лишь ждут, когда цивилизация возьмёт их в свои руки."
 COG_great_inga_dam:0 "Великая плотина Инга"
 COG_great_inga_dam_desc:0 "Этот давно задуманный проект, впервые предложенный ещё в 1928 году, объединял огромную плотину в нижнем течении Конго и энергоёмкий завод по переработке алюминия. Предполагалось, что при полной мощности предприятие сможет выпускать больше алюминия, чем весь мир произвёл в 1939 году."
 COG_industrial_effort:0 "Промышленный план Конго"
 COG_industrial_effort_desc:0 "В это время перемен хотя бы часть жизненно необходимых товаров следует производить на месте."
 COG_transform_the_congo:0 "Расширить колониальные возможности"
 COG_transform_the_congo_desc:0 "Модернизировать порты Банана и Матади, чтобы увеличить наши логистические возможности."
 COG_transform_the_congo2:0 "Инвестировать в колониальное производство"
 COG_transform_the_congo2_desc:0 "Пусть Конго прежде всего являлось эксплуатационной колонией, численность колониального населения и объём минеральных ресурсов достаточно велики, чтобы начать переработку и производство до вывоза сырья."
 COG_transform_the_congo3:0 "Расширить колониальное производство"
 COG_transform_the_congo3_desc:0 "Пусть Конго прежде всего являлось эксплуатационной колонией, численность колониального населения и объём минеральных ресурсов достаточно велики, чтобы начать переработку и производство до вывоза сырья."
 COG_production_effort:0 "Местное военное производство"
 COG_production_effort_desc:0 "Местное военное производство"
 COG_production_effort_2:0 "Потребности нашего времени"
 COG_production_effort_2_desc:0 "Конго не должно стать землёй, разорённой войной, однако мы обязаны быть готовы ответить на любую угрозу, если того потребуют обстоятельства."
 COG_production_effort_3:0 "Местное военное производство III"
 COG_production_effort_3_desc:0 "Местное военное производство III"
 COG_export_to_new_markets:0 "Экспорт на новые рынки"
 COG_export_to_new_markets_desc:0 "Из-за вызванных войной потрясений некоторые страны больше не открыты для нашего экспорта. В то же время мы можем направить максимум ресурсов своим союзникам."
 COG_war_mining_production_directorate:0 "Управление горнодобывающего производства военного времени"
 COG_war_mining_production_directorate_desc:0 "Управление горнодобывающего производства военного времени было создано в 1941 году для надзора за различными горнодобывающими компаниями, приоритетного обеспечения Союзников необходимым сырьём и наиболее полного использования горного оборудования."
 COG_gold_extraction:0 "Интенсифицировать добычу золота"
 COG_gold_extraction_desc:0 "«Деньги — нерв войны», — говорил Цицерон. Две тысячи лет спустя эти слова по-прежнему верны. Конго хранит великое сокровище, ревниво скрываемое землёй. Сейчас оно нужно нам как никогда."
 COG_diamond_extraction:0 "Интенсифицировать добычу алмазов"
 COG_diamond_extraction_desc:0 "Помимо использования в ювелирном деле, алмазы находят множество применений в промышленности. Военная индустрия вызвала резкий рост спроса, поэтому мы должны добывать достаточно самого твёрдого минерала на Земле, чтобы снабжать наших партнёров."
 COG_invest_in_nuclear_program:0 "Поддержать добычу урана в Катанге"
 COG_invest_in_nuclear_program_desc:0 "Опираясь на теорию относительности Альберта Эйнштейна и знания о радиоактивном распаде урана-238, мы выяснили, что расщепление атома высвобождает огромное количество энергии. Необходимо исследовать возможность цепной реакции, а для этого потребуется добывать огромные объёмы урановой руды. Будем надеяться, что шахты Колвези и Шинколобве смогут обеспечить нас необходимым количеством."
 COG_further_nuclear_research:0 "Добывать и экспортировать уран"
 COG_further_nuclear_research_desc:0 "Благодаря новому пониманию строения атома и растущей добыче урановой руды мы можем не только исследовать её потенциал, но и экспортировать часть сырья главным союзникам, чтобы обеспечить окончательную победу нашей коалиции над врагами."
 COG_establish_radio_stations:0 "Создать радиостанции"
 COG_establish_radio_stations_desc:0 "Компания «Сосьете Бельж Радио-Электрик» должна создать радиостанции, чтобы облегчить дальнюю связь с удалёнными районами страны и колонии."
 COG_radio_divisional_support:0 "Радиосвязь «Форс Пюблик»"
 COG_radio_divisional_support_desc:0 "Чтобы лучше координировать войска на огромных просторах Конго, каждое подразделение должно иметь доступ к радиооборудованию."
 COG_extra_tech_slot:0 "Институт колониальных наук"
 COG_extra_tech_slot_desc:0 "Институт колониальных наук был ведущей исследовательской организацией, занимавшейся Бельгийским Конго. Расположенный в Антверпене, он специализировался на изучении геологии и природы колонии, а на местах его дополняли местные исследовательские станции. Кроме того, крупный агрономический институт — Национальный институт агрономических исследований Бельгийского Конго — позволял значительно повышать урожайность."
 COG_extra_tech_slot_2:0 "Пригласить технических специалистов"
 COG_extra_tech_slot_2_desc:0 "Чтобы справиться с вызовами нашего времени, необходимо расширить инновационный потенциал. Приглашение иностранных экспертов позволит приобрести новые технические возможности и преодолеть трудности нынешнего поколения."
 COG_colonial_loyalty:0 "Колониальная лояльность"
 COG_colonial_loyalty_desc:0 "Наше правительство необходимо реорганизовать, чтобы оно могло справляться с новыми вызовами. Сейчас генерал-губернатор сосредоточил в своих руках слишком много власти; следует позволить ему делегировать часть полномочий компетентным людям."
 COG_reinforce_colonial_government:0 "Укрепить колониальное правительство"
 COG_reinforce_colonial_government_desc:0 "Поддержка бельгийских поселенцев и доверие министерства колоний в Брюсселе или в изгнании были важнейшими опорами легитимности Пьера Рикманса и стабильности территории."
 COG_commit_to_the_war:0 "Вступить в войну"
 COG_commit_to_the_war_desc:0 "Мы находимся в состоянии войны. Некоторые в государстве [BEL.GetNameDef] считали, что нам следует объявить нейтралитет, но последствия войны уже ощущаются здесь и сейчас. Мы должны продемонстрировать решимость тем, кто готов нам помочь, и не допустить, чтобы какая-либо иностранная держава захватила колонию под предлогом «защиты»."
 COG_technology_sharing:0 "Обмен технологиями"
 COG_technology_sharing_desc:0 "Раз уж мы помогаем союзникам в этом конфликте природными ресурсами, следует попросить у них специалистов и чертежи, чтобы улучшить наши промышленные и военные возможности."
 COG_increased_research_collaboration:0 "Расширить научное сотрудничество"
 COG_increased_research_collaboration_desc:0 "Нас многое связывает с Бельгией. Следует поддерживать тесные контакты с исследователями [BEL.GetAdjective], чтобы быть в курсе их новшеств."
 COG_cracks_down_on_enemies:0 "Подавить врагов"
 COG_cracks_down_on_enemies_desc:0 "Арест сторонников [GER.GetAdjective] и агентов Абвера, действовавших из Анголы, имел решающее значение для безопасности колонии."
 COG_military_help:0 "Военная помощь"
 COG_military_help_desc:0 "Следует попросить у союзников тяжёлое оборудование, чтобы наладить местное производство необходимого снаряжения для «Форс Пюблик». Это снизит зависимость от морской торговли и повысит наш военный потенциал."
 COG_colonial_defense_associations:0 "Поддержать ассоциации колониальной обороны"
 COG_colonial_defense_associations_desc:0 "Теперь, когда мы воюем, граждане [BEL.GetAdjective] по собственной инициативе создали «ассоциации обороны» для защиты колонии. Следует поддержать их и привлечь некоторых участников к командованию тысячами новых африканских рекрутов."
 COG_finance_planes_britain:0 "Профинансировать самолёты для [ENG.GetNameDef]"
 COG_finance_planes_britain_desc:0 "Мы должны собрать средства на новые самолёты для пилотов [BEL.GetAdjective], служащих в Королевских ВВС, чтобы выразить солидарность со всеми представителями [BEL.GetAdjective], продолжающими сражаться по всему миру даже после капитуляции армии."
 COG_finance_planes_belgium:0 "Профинансировать самолёты для [BEL.GetNameDef]"
 COG_finance_planes_belgium_desc:0 "Мы должны продемонстрировать поддержку государству [BEL.GetNameDef], которое сражается за сохранение независимости. По всей колонии будет организована масштабная кампания по сбору средств на строительство самолётов для армии [BEL.GetAdjective]."
 COG_expand_force_publique_recruitment:0 "Расширить набор в «Форс Пюблик»"
 COG_expand_force_publique_recruitment_desc:0 "Чтобы восполнить военные потери, необходимо увеличить набор."
 COG_build_revolution:0 "Строить революцию"
 COG_build_revolution_desc:0 "Воодушевлённые перспективой лучшего будущего, рабочие будут трудиться усерднее ради торжества революции."
 COG_manipulate_native_masses:0 "Манипулировать коренными массами"
 COG_manipulate_native_masses_desc:0 "Мы не сможем вести войну одной лишь армией из европейцев. Необходимо всеми доступными способами убедить коренное население, что оно должно сражаться под нашим командованием и умирать за наше дело."
 COG_colonial_claims:0 "Предъявить права на Большой бассейн Конго"
 COG_colonial_claims_desc:0 "На Берлинской конференции истинные границы Конго были урезаны лицемерными «великими державами». Пора пересмотреть эти решения и воплотить план Стэнли: создать великое Конго, соединяющее два океана и обеспечивающее торжество цивилизации в сердце Африки."
 COG_mobilize_colonial_manpower:0 "Призвать колонистов"
 COG_mobilize_colonial_manpower_desc:0 "Бельгийское население — важнейший элемент нашего общества. Если мы хотим эффективно командовать значительным числом местных жителей, необходимо увеличить количество европейских офицеров."
 COG_join_axis:0 "Вступить в Ось"
 COG_join_axis_desc:0 "[GER.GetNameDefCap] служит для нас образцом, и мы должны всеми силами поддерживать Новый порядок."
 COG_german_scientists:0 "Пригласить учёных [GER.GetAdjective]"
 COG_german_scientists_desc:0 "В обмен на наши ресурсы государство [GER.GetNameDef] должно помочь разработать более совершенное вооружение. Это позволит нам победить в войне против союза продажной плутократии и большевизма."
 COG_italian_scientists:0 "Пригласить учёных [ITA.GetAdjective]"
 COG_italian_scientists_desc:0 "В обмен на наши ресурсы государство [ITA.GetNameDef] должно помочь разработать более совершенное вооружение, чтобы победить в войне против союза продажной плутократии и большевизма."
 COG_join_italy:0 "Сблизиться с [ITA.GetNameDef]"
 COG_join_italy_desc:0 "[ITA.GetNameDefCap] служит для нас образцом, и мы должны всеми силами поддерживать Новый порядок."
 COG_technology_sharing_fascism:0 "Сила сотрудничества"
 COG_technology_sharing_fascism_desc:0 "Мы не будем вести эту войну в одиночку. Объединив усилия, мы сможем обеспечить сохранение европейской власти над Африкой, свободной от большевистского влияния."
 COG_reform_the_force_publique:0 "Реформировать «Форс Пюблик»"
 COG_reform_the_force_publique_desc:0 "«Форс Пюблик» находится в плачевном состоянии. Винтовки устарели, моральный дух офицеров низок — это необходимо изменить."
 COG_engineers_corps:0 "Инженерный корпус"
 COG_engineers_corps_desc:0 "Инженеры необходимы для передвижения по труднопроходимой местности. Поэтому подготовка специалистов жизненно важна."
 COG_motorization_effort:0 "Развивать моторизацию"
 COG_motorization_effort_desc:0 "Следует изучить возможность создания моторизованной бригады, способной перемещаться по континенту гораздо быстрее обычной пехоты."
 COG_motorised_support:0 "Логистическая поддержка"
 COG_motorised_support_desc:0 "Чтобы создать систему максимально быстрой переброски войск на передовую, необходимо моторизировать значительную часть вспомогательных подразделений пехотных дивизий."
 COG_commission_on_armored_vehicles:0 "Комиссия по бронетехнике"
 COG_commission_on_armored_vehicles_desc:0 "Танки могут показаться не слишком полезными в глубине джунглей, но в новом мире мы должны уметь эффективно сражаться где угодно. Кто станет отрицать, что в бронированной машине воевать легче? Чтобы определить наши потребности, следует обратиться к специалистам, объединив их в комиссию по развитию бронетехники."
 COG_get_rid_of_obsolete_rifles:0 "Избавиться от устаревших винтовок"
 COG_get_rid_of_obsolete_rifles_desc:0 "Слишком долго мы были вооружены устаревшими винтовками образца 1889 года — излишками бельгийской армии. Пора избавиться от них или модернизировать до более современного уровня."
 COG_continue_the_armament_modernization_program:0 "Продолжить программу модернизации вооружения"
 COG_continue_the_armament_modernization_program_desc:0 "Даже после получения новых винтовок остальное снаряжение остаётся устаревшим и требует улучшения."
 COG_finalize_the_equipment_modernization_program:0 "Завершить программу модернизации снаряжения"
 COG_finalize_the_equipment_modernization_program_desc:0 "Ещё немного усилий — и бывшая колониальная полиция достигнет уровня полноценной национальной регулярной армии."
 COG_modernize_police_formation:0 "Модернизировать полицейскую подготовку"
 COG_modernize_police_formation_desc:0 "«Форс Пюблик» — по крайней мере теоретически — является не армией, а колониальной полицией. Поэтому полицейские задачи составляют важнейшую часть её повседневной службы."
 COG_modernize_tactics:0 "Модернизировать тактику"
 COG_modernize_tactics_desc:0 "Если снаряжение нуждается в модернизации, то же самое относится и к нашей тактике. Хотя офицеры являются настоящими профессионалами, последние достижения военной теории ясно показывают: обновление тактики и стратегии абсолютно необходимо."
 COG_large_scale_exercises:0 "Крупномасштабные учения"
 COG_large_scale_exercises_desc:0 "Для улучшения координации и испытания новых тактик необходимо проводить крупномасштабные учения. В них будут участвовать сотни и даже тысячи бойцов, что позволит оценить взаимодействие различных подразделений."
 COG_river_patrols:0 "Речные патрули"
 COG_river_patrols_desc:0 "Бассейн Конго — основа страны, и контроль над ним необходим для перевозки войск и грузов. Для этого следует патрулировать реки лёгкими катерами и обучить пехоту быстро их форсировать."
 COG_special_forces:0 "Войска специального назначения"
 COG_special_forces_desc:0 "Природные условия Конго могут показаться чужеземцу крайне враждебными. Страна покрыта густыми лесами и джунглями, её определяет великая река, а на востоке преобладает пересечённая местность. Чтобы «Форс Пюблик» могла успешно действовать в таких условиях, необходимо сформировать части, способные использовать особенности рельефа и переломить ход возможных сражений."
 COG_jungle_training:0 "Подготовка к войне в джунглях"
 COG_jungle_training_desc:0 "Поскольку джунгли занимают значительную часть нашей территории, способность эффективно передвигаться и сражаться в этой враждебной среде имеет решающее значение для боеспособности «Форс Пюблик»."
 COG_fortify_congo_mouth:0 "Укрепить устье Конго"
 COG_fortify_congo_mouth_desc:0 "Наши важнейшие объекты расположены в устье реки Конго, и этот жизненно важный регион необходимо защитить. Для этого следует создать полноценный речной корпус. Его нужно оснастить быстрыми небольшими катерами, способными патрулировать всю длину реки."
 COG_fortify_cities:0 "Защитить другие города"
 COG_fortify_cities_desc:0 "Даже если Леопольдвиль находится в безопасности, другие города — Элизабетвиль в Катанге и Стэнливиль в «Восточной» провинции — остаются уязвимыми и нуждаются в укреплении."
 COG_air_force_congo:0 "Авиационные части «Форс Пюблик»"
 COG_aviation_effort_tt:0 "Недостаточно ячеек для строительства §Yавиабазы§!"
 COG_air_force_congo_desc:0 "Ни в одной области технологический прогресс не идёт столь быстро, как в воздушной войне. Авиация — сфера, которой должна овладеть любая современная страна."
 COG_fighter_focus:0 "Импортировать чертежи истребителей"
 COG_fighter_focus_desc:0 "Воздушные бои Великой войны были далеко не последними. Опережая других в разработке истребителей, мы получим преимущество в будущем."
 COG_bomber_focus:0 "Эксперименты с самолётами большой дальности"
 COG_bomber_focus_desc:0 "В будущем люди будут рассказывать об ужасах современных войн и вспоминать огонь, падающий с небес. Мы сделаем всё, чтобы эти истории рассказывали наши враги."
 COG_long_range_fighters:0 "Истребители большой дальности"
 COG_long_range_fighters_desc:0 "Чтобы действовать на огромных пространствах джунглей, необходимо разработать новую концепцию. Нам нужен тип военного самолёта, занимающий промежуточное положение между истребителем и бомбардировщиком, способный выполнять дальние задачи и перехватывать вражеские бомбардировщики."
 COG_radar_system:0 "Радиолокационная система"
 COG_radar_system_desc:0 "Огромные пространства Конго трудно эффективно патрулировать, поэтому радиолокационная система позволит обнаруживать врага и поднимать самолёты в воздух только при приближении угрозы."
 COG_aviation_effort_2:0 "Изучить иностранную тактику"
 COG_aviation_effort_2_desc:0 "Для полноценного взаимодействия авиации с другими родами войск потребуются дальнейшие достижения в этой области."
 COG_CAS_effort:0 "Прототипы пикирующих бомбардировщиков"
 COG_CAS_effort_desc:0 "Современной армии требуется поддержка техники как на земле, так и в воздухе."
 COG_rocket_effort:0 "Разработать реактивные двигатели"
 COG_rocket_effort_desc:0 "Ракетные и реактивные двигатели позволяют пилотируемым и беспилотным аппаратам развивать невиданные прежде скорости. Освоив эти технологии первыми, мы сможем застать врага врасплох."
 COG_NAV_effort:0 "Эксперименты с морскими бомбардировщиками"
 COG_NAV_effort_desc:0 "Подобно тому как новая морская война ведётся под поверхностью воды, часть её теперь происходит и в воздухе над морем."
 COG_naval_effort:0 "Начать кораблестроение в Матади"
 COG_naval_effort_tt:0 "Недостаточно ячеек для строительства §Yверфей§!"
 COG_naval_effort_desc:0 "Будучи нашим самым современным портом и находясь в 100 км от устья реки Конго, благодаря чему он защищён от открытого моря, Матади является идеальной отправной точкой для военно-морской программы."
 COG_submarine_operations:0 "Тактика охоты на конвои"
 COG_submarine_operations_desc:0 "Переосмысление морской войны с учётом развития подводных лодок позволит эффективно наносить удары по вражеским конвоям."
 COG_large_navy:0 "Военно-морская тактика"
 COG_large_navy_desc:0 "Адаптация военно-морских доктрин к применению крупных кораблей и обеспечение безопасности торговых конвоев помогут понять, какие именно корабли нам необходимы."
 COG_fleet_management:0 "Управление флотом"
 COG_fleet_management_desc:0 "Новому флоту потребуется новая тактика, чтобы действовать эффективно."
 COG_submarine_experiments:0 "Эксперименты с подводными лодками"
 COG_submarine_experiments_desc:0 "Подводная война — самое захватывающее новшество на море со времён изобретения торпедного катера. Нам следует научиться как защищаться от подлодок, так и использовать их против вражеского судоходства."
 COG_cruiser_effort:0 "Эксперименты с крупными кораблями"
 COG_cruiser_effort_desc:0 "Прежде чем переходить к передовым исследованиям линкоров, необходимо заменить устаревшие малые крейсеры."
 COG_destroyer_effort:0 "Современные эсминцы"
 COG_destroyer_effort_desc:0 "Изучая конструкцию и стратегическое применение подводных лодок, мы также научились противодействовать этой тактике. Эсминцы будут играть в этом решающую роль."
 COG_capital_ships_effort:0 "Развитие крупных кораблей"
 COG_capital_ships_effort_desc:0 "Страна с наибольшим числом линкоров будет господствовать на морях. Линкоры и авианосцы воплощают старое и новое представления о превосходстве на море."
 COG_generic_industrial_concern:0 "СССИ"
 KAT_generic_industrial_concern:0 "Металкат"
 COG_approach_the_barotse_litunga_tt:0 "Когда начнётся война за освобождение, мы получим 2 §Yбаротсейские дивизии§! и национальную территорию в регионе §Y[1097.GetName]§!"
