 COG_medium_tank_equipment_2_short:0 "Шерман"
 COG_medium_tank_destroyer_equipment_2:0 "M18 «Хеллкэт»"
 COG_medium_tank_destroyer_equipment_2_short:0 "M18"
 COG_modern_tank_equipment_1:0 "M46 «Паттон»"
 COG_modern_tank_equipment_1_short:0 "Паттон"
