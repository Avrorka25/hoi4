 COG_light_tank_equipment_3_short:0 "Валентайн"
 COG_light_tank_artillery_equipment_3_short:0 "Бишоп"
 COG_light_tank_artillery_equipment_3_desc:0 "25-фунтовая гаубица, установленная на шасси лёгкого танка «Валентайн»."
