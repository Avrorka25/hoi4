 COG_infantry_equipment_4:0 "САФН-49"
 COG_infantry_equipment_4_short:0 "САФН-49"
 COG_support_weapons:0 "Митрайёз Гочкис 1914|Максим '08/15'"
 COG_support_weapons_desc:0 "Автоматическое оружие становится всё более переносным. Пистолеты-пулемёты уже доказали свою эффективность, поэтому разработку ручного оружия поддержки необходимо продолжать."
 COG_support_weapons2:0 "Мортье Стокс-Брандт 81 мм Mle 27/31|Ланс-Гренад 50 мм ДБТ"
 COG_infantry_weapons2:0 "Маузер 1936"
 COG_gw_tank_equipment:0 "Рено FT"
 COG_gw_tank_equipment_short:0 "FT"
 COG_light_tank_equipment_1:0 "Карден-Лойд Mk.VI"
 COG_light_tank_equipment_1_short:0 "Карден-Лойд Mk.VI"
 COG_light_tank_destroyer_equipment_1:0 "T-13 B1"
 COG_light_tank_destroyer_equipment_1_short:0 "T-13 B1"
 COG_light_tank_destroyer_equipment_1_desc:0 "Эта танкетка стала первой бельгийской попыткой создать истребитель танков. Британская танкетка «Карден-Лойд Mk.VI» была оснащена 47-мм противотанковым орудием F.R.C."
 COG_light_tank_aa_equipment_1:0 "T-13 ПВО"
 COG_light_tank_aa_equipment_1_short:0 "T-13 ПВО"
 COG_light_tank_artillery_equipment_1:0 "T-13 F.R.C. 76 мм"
 COG_light_tank_artillery_equipment_1_short:0 "T-13 F.R.C. 76 мм."
 COG_light_tank_equipment_2:0 "CLR T-15"
 COG_light_tank_equipment_2_short:0 "T-15"
 COG_light_tank_destroyer_equipment_2:0 "T-13 B2"
 COG_light_tank_destroyer_equipment_2_short:0 "T-13 B2"
 COG_light_tank_destroyer_equipment_2_desc:0 "T-13 B1, B2 и B3 оснащались 47-мм противотанковыми орудиями образца 1931 года и в 1940 году являлись основными истребителями танков бельгийской армии."
 COG_light_tank_aa_equipment_2:0 "T-15 ПВО"
 COG_light_tank_aa_equipment_2_short:0 "T-15 ПВО"
 COG_light_tank_artillery_equipment_2:0 "Артиллерийский T-15"
 COG_light_tank_artillery_equipment_2_short:0 "Арт. T-15"
 COG_medium_tank_equipment_1:1 "Аутомитрайёз де Комба ACG-1"
 COG_medium_tank_equipment_1_short:1 "ACG-1"
 COG_medium_tank_destroyer_equipment_1:1 "Аутомитрайёз Анти-Шар ACG-2"
 COG_medium_tank_destroyer_equipment_1_short:1 "ACG-2"
 COG_medium_tank_destroyer_equipment_1_desc:1 "ACG-2 — прототип истребителя танков на базе ACG-1. Его создание стало бы логичным продолжением приобретения ACG-1 бельгийцами. Даже его силуэт неизвестен: сохранилась лишь одна фотография прототипа, а оригинальные чертежи утрачены. Название «Аутомитрайёз Анти-Шар» является предположительным и основано на бельгийском названии ACG-1."
 COG_medium_tank_artillery_equipment_1:0 "Аутомитрайёз де Сюпор ACG-3"
 COG_medium_tank_artillery_equipment_1_short:0 "ACG-3"
 COG_medium_tank_artillery_equipment_1_desc:0 "ACG-3 — вымышленная переработка ACG-2, которая могла бы быть создана путём открытия верхней части корпуса, уменьшения толщины брони и замены противотанкового орудия стандартным артиллерийским."
 COG_medium_tank_artillery_equipment_2:0 "Трактёр д'артиллери де 155 мм M40 "
 COG_medium_tank_artillery_equipment_2_short:0 "M40-155 мм"
