 COL_industrial_effort:0 "Укрепить промышленность"
 COL_industrial_effort_desc:0 "Сосредоточить все наши политические усилия на стремительном развитии гражданской промышленности."
 COL_acerias_pdr:0 "Модернизировать Асерияс Пас-дель-Рио"
 COL_acerias_pdr_desc:0 "У нас есть и уголь, и железо. С иностранными инвестициями мы сможем производить больше стали."
 COL_puerto_buenaventura:0 "Ось Буэнавентура — Кали"
 COL_puerto_buenaventura_desc:0 "Пришло время соединить плодородные равнины Валье-дель-Каука с глубоководным портом Буэнавентуры."
 COL_indumil:0 "Индустрия Милитар де Коломбия"
 COL_indumil_desc:0 "Создание государственной компании, отвечающей за производство боеприпасов, винтовок и взрывчатки, позволит лучше оснастить нашу армию."
 COL_infrastructure_caribe:0 "Связать Атлантико"
 COL_infrastructure_caribe_desc:0 "Можно многое сделать: связать реку Магдалена с Картахеной, улучшить порт в Барранкилье и поддержать растущую промышленность Медельина."
 COL_indumil_2:0 "Расширить Индустрия Милитар"
 COL_indumil_2_desc:0 "Текущая ситуация требует расширения наших возможностей по производству вооружений, чтобы удовлетворить растущие потребности армии."
 COL_fortify_caribe:0 "Укрепить Карибское побережье"
 COL_fortify_caribe_desc:0 "Карибское побережье — место, где мы наиболее уязвимы, особенно перед морскими вторжениями. Строительство береговых укреплений позволит нам снизить эти риски."
 COL_fortify_caribe_aa:0 "Защитить северное небо"
 COL_fortify_caribe_aa_desc:0 "Наше побережье также уязвимо для возможных воздушных атак. Следует разместить зенитные батареи, чтобы обеспечить дополнительную защиту."
 COL_infrastructure_harsh:0 "Улучшить национальную инфраструктуру"
 COL_infrastructure_harsh_desc:0 "Многие регионы [COL.GetNameDef] всё ещё плохо связаны между собой. Масштабные работы и расширение инфраструктуры в этих районах со временем позволят нам раскрыть их экономический потенциал."
 COL_industry_effort_2:0 "Приобрести современное оборудование"
 COL_industry_effort_2_desc:0 "В последние годы появились новые промышленные методы. Модернизация нашего оборудования позволит нам повысить экономический потенциал."
 COL_war_with_andeans:0 "Война с андскими странами"
 COL_war_with_andeans_desc:0 "Пришло время убедить [PRU.GetNameDef] присоединиться к нашему великому делу. В Андах вести боевые действия непросто. Новая парашютно-десантная дивизия «Кондор» поможет нам в этой кампании."
 COL_etnocacerismo:0 "Последовать за этнокасеристами"
 COL_etnocacerismo_desc:0 "Наше возвращение Великой Колумбии теперь превратилось в настоящий крестовый поход за объединение народов Анд!"
 COL_etnocacerismo_2:0 "Этнокасеризм воплощён"
 COL_etnocacerismo_2_desc:0 "Теперь мы близки к тому, чтобы стать огромной и неразделимой нацией."
 COL_etnocacerismo_2_tt:0 "§YЭтнокасеризм§!"
 COL_altillanura_ress:0 "Исследовать Оринокию"
 COL_altillanura_ress_desc:0 "Пришло время вложиться в развитие региона Оринокия, увеличив производство каучука и начав разработку месторождений бокситов."
 COL_gran_colombia:0 "Заявить права на Великую Колумбию"
 COL_gran_colombia_desc:0 "Только крупная нация может гарантированно выстоять перед угрозами современного мира."
 COL_nuclear_effort:0 "Развитие ядерных технологий"
 COL_nuclear_effort_desc:0 "Стоя на пороге открытия, способного изменить мир, мы не можем позволить другим первыми разжечь огонь, который однажды может поглотить Землю."
 COL_extra_tech_slot:0 "Финансировать университеты"
 COL_extra_tech_slot_desc:0 "Расширение нашей промышленности и другие недавние достижения, возможно, позволят нам параллельно вести больше исследований и разработок."
 COL_extra_tech_slot_2:0 "Субсидировать исследования"
 COL_extra_tech_slot_2_desc:0 "Стремительная индустриализация нашей страны открыла новые возможности для исследований и разработок, которыми нам следует воспользоваться."
 COL_technology_sharing:0 "Обмен технологиями"
 COL_technology_sharing_desc:0 "Делясь технологическими достижениями с союзниками, весь наш альянс сможет эффективнее проводить исследования и разработки военного времени."
 COL_secret_weapons:0 "Секретное оружие"
 COL_secret_weapons_desc:0 "Соблазнительно направить все дополнительные ресурсы на разработку танков и самолётов, однако секрет победы в войнах кроется в совершенно новых областях науки: электронике, ракетостроении и ядерных исследованиях."
 COL_political_effort:0 "Конгресс Колумбии"
 COL_political_effort_desc:0 "Чтобы изменить мир, сначала нужно изменить собственную страну. Укрепление наших политических позиций должно стать первоочередной задачей."
 COL_collectivist_ethos:0 "Выступить против реформ Лопеса"
 COL_collectivist_ethos_desc:0 "Наши враги могут разделять и покорять менее стойкие нации, но наш народ останется единым — один за всех и все за одного."
 COL_militarism:0 "Милитаризировать страну"
 COL_militarism_desc:0 "Те, кто считает армию неизбежным злом, обречены колебаться перед лицом войны. Мы укореним милитаризм в нашей культуре и станем народом солдат."
 COL_political_correctness:0 "Национализировать промышленность"
 COL_political_correctness_desc:0 "Чтобы освободить рабочих от капиталистических цепей, мы должны начать с установления контроля над средствами производства."
 COL_neutrality_focus:0 "Ставка на нейтралитет"
 COL_neutrality_focus_desc:0 "Другие могут утверждать, что для выбора стороны в глобальном конфликте нужны храбрость и мудрость, но мы знаем, что ещё больше их требуется, чтобы отказаться от такого выбора."
 COL_interventionism_focus:0 "Ставка на интервенционизм"
 COL_interventionism_focus_desc:0 "Мы ценим свободу всех людей, а не только наших граждан. Если для предотвращения тирании потребуется война — значит, быть войне."
 COL_military_youth:0 "Военная молодёжь"
 COL_military_youth_desc:0 "Организации, призванные прививать молодёжи нашей страны дисциплину и политическую грамотность, с ранних лет будут воспитывать верность и готовность к самопожертвованию."
 COL_deterrence:0 "Сдерживание"
 COL_deterrence_desc:0 "Оставаясь в одиночестве, мы редко получаем выгоду от войны. К счастью, мы знаем: лучшая защита — та, о которой все знают и потому которую никогда не приходится применять."
 COL_volunteer_corps:0 "Добровольческий корпус"
 COL_volunteer_corps_desc:0 "Заставлять наших людей умирать за идеалы свободы было бы иронией, но создать возможности для тех, кто добровольно желает помогать людям за рубежом, — совсем другое дело."
 COL_paramilitarism:0 "Создать «Хувентуд Леопардо»"
 COL_paramilitarism_desc:0 "Военные принципы применимы и за пределами армии. Если мы создадим полувоенные формирования в дополнение к вооружённым силам, больше людей смогут пройти военную подготовку."
 COL_join_the_comintern:0 "Вступить в Коминтерн"
 COL_join_the_comintern_desc:0 "Мы должны помочь нашим социалистическим товарищам по всему миру победить капитализм. [SOV.GetNameDefCap] — ведущая сила в этой борьбе, поэтому нам следует держаться вместе."
 COL_soviet_technological_cooperation:0 "[SOV.GetAdjective] технологическое сотрудничество"
 COL_soviet_technological_cooperation_desc:0 "[SOV.GetNameDefCap] добилась значительного прогресса в науке. Теперь, когда мы сражаемся бок о бок, мы можем воспользоваться их опытом."
 COL_indoctrination_focus:0 "Ввести политических комиссаров"
 COL_indoctrination_focus_desc:0 "Введение политических комиссаров в армейские ряды позволит нам напоминать солдатам о благородном деле, за которое мы сражаемся."
 COL_foreign_expeditions:0 "Зарубежные экспедиции"
 COL_foreign_expeditions_desc:0 "Раз наши враги готовы вмешиваться в далёкие конфликты во имя своих идеалов, мы должны быть готовы делать то же самое ради наших."
 COL_why_we_fight:0 "Почему мы сражаемся"
 COL_why_we_fight_desc:0 "Мир становится всё опаснее. Наш народ должен увидеть зверства, совершаемые теми, кто жаждет власти. Мы сплотим людей вокруг нашего дела и добьёмся того, чтобы каждый был готов сражаться за нашу свободу."
 COL_political_commissars:0 "Политические комиссары"
 COL_political_commissars_desc:0 "Чтобы наша политика соблюдалась и в военной сфере, мы введём в армейские ряды политически назначаемых должностных лиц."
 COL_internationalism_focus:0 "Ла Революсьон Популар"
 COL_internationalism_focus_desc:0 "Идеология не знает границ. Другая страна может называть себя суверенной, но наши убеждения стоят выше подобных притязаний."
 COL_nationalism_focus:0 "Переворот «Лос Леопардос»"
 COL_nationalism_focus_desc:0 "Наша нация уникальна, и наши политические достижения могли произойти только здесь. Мы должны защищать её любой ценой."
 COL_ideological_fanaticism:0 "Идеологический фанатизм"
 COL_ideological_fanaticism_desc:0 "Наши политически утверждённые ценности и цели заслуживают того, чтобы за них умирали не меньше, чем за любую древнюю веру. Каждый сторонник должен быть готов встретить смерть, а тем, кто собьётся с пути, лучше быть готовыми к тому же."
 COL_mosquitos:0 "Узаконить Великую Колумбию"
 COL_mosquitos_desc:0 "Теперь, когда Панама, Эквадор и Венесуэла находятся под нашим контролем, мы должны начать интеграцию их административных структур в Великую Колумбию."
 COL_axis_leanings_focus:0 "Подружиться с немцами"
 COL_axis_leanings_focus_desc:0 "Ось способна предоставить нам определённые технологические преимущества."
 COL_axis_leanings_focus_2:0 "[GER.GetAdjective] обмен ресурсами"
 COL_axis_leanings_focus_2_desc:0 "Больше технологий ценой части нашего экспорта."
 COL_axis_leanings_focus_3:0 "Вступить в Ось"
 COL_axis_leanings_focus_3_desc:0 "Если амбиции Колумбии непоколебимы, мы должны присоединиться к Оси и покончить с нашими врагами!"
 COL_montana_effort:0 "Развитие Альта-Монтаньи"
 COL_montana_effort_desc:0 "Пришло время готовиться к войне в Андах."
 COL_intensify_exports:0 "Нарастить экспорт"
 COL_intensify_exports_desc:0 "Наша экономика сильно зависит от экспорта товаров, и мы решили, что это лучший путь к экономическому успеху. Поэтому необходимо ещё сильнее расширить нашу торговлю и экспорт."
 COL_explore_amazonia:0 "Использовать ресурсы Амазонии"
 COL_explore_amazonia_desc:0 "Власти не полностью контролируют производство каучука в Гуавьяре. Пришло время установить там законный государственный контроль. Кроме того, наши войска смогут кое-чему научиться в вопросах выживания в джунглях."
 COL_minning:0 "Крупномасштабная добыча"
 COL_minning_desc:0 "Предварительная разведка нашей территории показывает, что здесь имеются значительные запасы руды, лишь ожидающие разработки. Нам необходимо построить инфраструктуру, чтобы облегчить её добычу."
 COL_hidroelectrics:0 "Развивать гидроэнергетику"
 COL_hidroelectrics_desc:0 "География нашей страны с её крутыми горами идеально подходит для строительства плотин, особенно теперь, когда наши потребности в энергии растут."
 COL_coffe_growth:0 "Сохранить зависимость от кофе"
 COL_coffe_growth_desc:0 "Кофе — один из важнейших товаров нашего экспорта. Мы обеспечим дальнейший рост его продаж, заключая новые торговые соглашения."
 COL_war_with_andean_threat:0 "Боливарианские амбиции в Андах"
