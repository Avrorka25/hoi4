 COL_affirm_state_role_in_the_economy:0 "Подтвердить экономическую роль государства"
 COL_affirm_state_role_in_the_economy_desc:0 "Многие экономисты, в особенности Джон Мейнард Кейнс, поддерживают теорию о том, что государство должно вмешиваться в экономику, чтобы обеспечить её справедливость по отношению к народу."
 COL_continue_constitutional_reforms:0 "Продолжить конституционные реформы"
 COL_continue_constitutional_reforms_desc:0 "Конституционная реформа закрепила определение собственности через её социальную функцию. Одним из наиболее заметных последствий этого нового положения стало право государства отчуждать землю в соответствии с принципом общественной пользы, особенно обширные неиспользуемые владения землевладельцев."
 COL_workers_protection:0 "Расширить права рабочих"
 COL_workers_protection_desc:0 "Чтобы обеспечить защиту рабочих, мы должны отстаивать право на забастовку и поощрять их объединение в профсоюзы."
 COL_educational_reform:0 "Реформа образования"
 COL_educational_reform_desc:0 "Во многом благодаря инициативе писателя и министра образования Хорхе Саламеа был проведён целый ряд реформ, направленных на расширение доступа к образованию."
 COL_join_the_allies:0 "Присоединиться к Союзникам"
 COL_join_the_allies_desc:0 "Наше место рядом с [ENG.GetNameDef] — хранителем либерализма, демократии и свободы в эти неспокойные времена."
 COL_liberty_ethos:0 "Революция в движении"
 COL_liberty_ethos_desc:0 "Альфонсо Лопес Пумарехо начал множество экономических и социальных реформ, получивших название «Революсьон эн Марча», или «Революция в движении»."
 COL_agrarian_economy:0 "Аграрная экономика"
 COL_agrarian_economy_desc:0 "Экономика Колумбии глубоко укоренена в сельском хозяйстве: кофейные плантации господствуют на наших экспортных рынках и обеспечивают столь необходимую иностранную валюту. Однако зависимость от одной культуры делает нас уязвимыми перед колебаниями мировых цен, а богатство остаётся сосредоточенным в руках сельской элиты. Хотя плодородные высокогорья заполнены плантациями, нехватка промышленной инфраструктуры мешает нашей модернизации. Инвестиции во внутреннее производство ограничены, поскольку значительная часть рабочей силы страны привязана к полям. Чтобы обеспечить стабильное будущее, мы должны решить: продолжим ли мы опираться на наши аграрные преимущества или пойдём по трудному пути индустриализации?"
 COL_coffee_dependent_economy:0 "Экономика, зависимая от кофе"
 COL_coffee_dependent_economy_desc:0 "Экономика Колумбии глубоко укоренена в сельском хозяйстве: кофейные плантации господствуют на наших экспортных рынках и обеспечивают столь необходимую иностранную валюту. Однако зависимость от одной культуры делает нас уязвимыми перед колебаниями мировых цен, а богатство остаётся сосредоточенным в руках сельской элиты. Хотя плодородные высокогорья заполнены плантациями, нехватка промышленной инфраструктуры мешает нашей модернизации. Инвестиции во внутреннее производство ограничены, поскольку значительная часть рабочей силы страны привязана к полям. Чтобы обеспечить стабильное будущее, мы должны решить: продолжим ли мы опираться на наши аграрные преимущества или пойдём по трудному пути индустриализации?"
 COL_coffee_dependent_economy_2:0 "Экономика, зависимая от кофе"
 COL_coffee_dependent_economy_2_desc:0 "Экономика Колумбии глубоко укоренена в сельском хозяйстве: кофейные плантации господствуют на наших экспортных рынках и обеспечивают столь необходимую иностранную валюту. Однако зависимость от одной культуры делает нас уязвимыми перед колебаниями мировых цен, а богатство остаётся сосредоточенным в руках сельской элиты. Хотя плодородные высокогорья заполнены плантациями, нехватка промышленной инфраструктуры мешает нашей модернизации. Инвестиции во внутреннее производство ограничены, поскольку значительная часть рабочей силы страны привязана к полям. Чтобы обеспечить стабильное будущее, мы должны решить: продолжим ли мы опираться на наши аграрные преимущества или пойдём по трудному пути индустриализации?"
 COL_coffee_dependent_economy_3:0 "Полуавтаркическая экономика"
 COL_workers_protection_idea:0 "Защита рабочих"
 COL_revolution_on_the_march:0 "Революция в движении"
 COL_revolution_on_the_march_desc:0 "Ветры перемен яростно дуют над Колумбией, пока «Революция в движении» президента Альфонсо Лопеса Пумарехо будоражит сердца нации. Радикализировавшиеся слои общества требуют масштабных перемен, движимые призывами к социальной справедливости, трудовым правам и экономическим реформам. Однако в замысле Пумарехо эти идеалы также открывают новые возможности: перераспределение земли для поддержки сельских общин, расширение доступа к образованию и предоставление голоса рабочей силе Колумбии. По мере роста напряжённости растёт и надежда, создавая эпоху одновременно глубоких рисков и безграничных возможностей."
 COL_political_correctness_idea:0 "Национализированная промышленность"
 COL_militarism_idea:0 "Государственный милитаризм"
 COL_paramilitarism_idea:0 "Ла Хувентуд Леопардо"
 COL_growing_political_resistance:0 "Растущая политическая оппозиция"
 COL_growing_political_resistance_desc:0 "После десятилетий правления консерваторов новое либеральное правительство Колумбии сталкивается с растущим сопротивлением, пытаясь реформировать общество, расколотое между могущественной элитой и обнищавшими рабочими. Земельные реформы, права трудящихся и образовательные инициативы бросают вызов сложившемуся порядку, вызывая возмущение землевладельцев, духовенства и политических соперников. Забастовки вспыхивают как в сельской местности, так и в городах, а левые движения набирают поддержку среди разочарованных."
