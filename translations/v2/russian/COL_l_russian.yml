 colombia.1.t:0 "Подготовка в джунглях"
 colombia.1.d:0 "Жаркий экваториальный климат амазонских тропических лесов на юге нашей страны, а также джунгли в прибрежных провинциях к западу от Картахены создают тяжёлые условия для населения и одновременно становятся серьёзным препятствием для наших войск в этом регионе, особенно в вопросах подготовки и боевой эффективности.\n\nНебольшое перераспределение бюджета позволит нам расширить учебные объекты в районах джунглей и назначить недавно выпустившихся командиров военной академии на соответствующие должности, к которым их специально готовили. Джунгли [COL.GetNameDef] станут нашей естественной боевой средой, где наша армия вместе с партизанами сможет дать отпор превосходящему противнику."
 colombia.1.a:0 "Подготовить почву для этих учебных лагерей."
 colombia.2.t:0 "Возрождение Великой Колумбии!"
 colombia.2.d:0 "Недавние изменения в структуре правительства [COL.GetNameDef] породили среди наших чиновников в Каракасе и послов в Боготе множество тревожных вопросов об их намерениях и планах.\n\nСегодня утром правительство [VEN.GetLeader] получило официальный запрос о восстановлении [VEN.GetAdjective]-[COL.GetAdjective] союза под руководством последней стороны в попытке возродить утраченное наследие Великой Колумбии.\n\n[COL.GetAdjective] официальные лица заявляют, что в случае заключения соглашения [VEN.GetAdjective] правительство будет фактически включено в государственный аппарат с надлежащим представительством в парламенте. Если мы отвергнем этот жест «поддержки», [COL.GetAdjective] дипломаты угрожают нам тем, что их армия готова пересечь нашу границу.\n\nЧто нам делать?"
 colombia.2.a:0 "Объединимся ради общего блага."
 colombia.2.b:0 "Мы хотим сохранить нашу независимость."
 colombia.3.t:0 "Эрмано Боливариано"
 colombia.3.d:0 "Срок действия выдвинутого требования об интеграции должен был истечь сегодня в 18:00. К счастью, официальный ответ от правительства [VEN.GetLeader] поступил за десять часов до истечения ультиматума. n\nВ телеграмме из [VEN.GetNameDef] говорилось: «Растущее влияние [USA.GetNameDef] в Южной Америке также беспокоит [VEN.GetAdjective] правительство и его чиновников. Только сильное единое государство, такое как Великая Колумбия, способно соперничать со спящим гигантом на Севере».\n\nСпустя столетие наши [VEN.GetAdjective] братья с радостью согласились и вновь стали частью великоколумбийской нации."
 colombia.3.a:0 "Эрманос, добро пожаловать в Великую Колумбию!"
 colombia.4.t:0 "Вторжение в [VEN.GetNameDef]"
 colombia.4.d:0 "Срок действия выдвинутого требования об интеграции должен был истечь сегодня в 18:00. Поскольку мы не получили официального ответа от [VEN.GetAdjective] чиновников, можно предположить, что их слабое правительство пытается выиграть время для мобилизации дополнительных сил.\n\nНаши разведчики и разведывательные подразделения сообщают об усилении активности [VEN.GetAdjective] войск на нашей границе. Они готовят оборону и мобилизуют резервы. Хотя ещё не все наши солдаты заняли позиции, мы должны ударить сейчас, когда враг меньше всего этого ожидает.\n\nК оружию, народ [COL.GetNameDef]! Пришло время вернуть утраченные территории Великой Колумбии!"
 colombia.4.a:0 "Вперёд!"
 colombia.6.t:0 "Панама возвращена"
 colombia.6.d:0 "Мы — та страна, которой себя считаем"
 colombia.6.a:0 "Как раз вовремя"
 colombia.11.t:0 "Создано новое десантное подразделение"
 colombia.11.d:0 "Недавние исследования и разработки вспомогательного снаряжения вдохновили нашу научную группу на блестящую идею: выделить средства на создание нового современного воинского подразделения, состоящего из батальонов морской пехоты при поддержке артиллерии, инженеров, разведки и полевых госпиталей.\n\nПодготовка такого специализированного подразделения потребует гораздо больше времени и усилий, чем обучение обычного пехотного полка. Однако ожидается, что оно отлично проявит себя в морских десантных операциях и будет эффективно действовать во влажном климате."
 colombia.11.a:0 "Добавить оформленное предложение в реестр наших вооружённых сил."
 colombia11_tt:0 "Мы получим элитный шаблон морской пехоты под названием §YИнфантес де Марина§!."
 colombia.12.t:0 "Генералы поддержали идею нового парашютного подразделения"
 colombia.12.d:0 "Тесное сотрудничество между нашим отделом исследований и разработок и генеральным штабом завершилось предложением создать специальное подразделение, способное высаживаться с воздуха в тылу вражеской линии фронта и действовать в базовых районах противника. Парашютные технологии могут стать нашим козырем, если мы добьёмся превосходства в воздухе над регионом.\n\nДополнительные улучшения включают специализированную подготовку инженеров, воздушно-десантные орудия и дополнительный лёгкий радиополк, способный использовать частоты вражеской радиосвязи для связи наших высадившихся войск без обнаружения противником."
 colombia.12.a:0 "Добавить материалы по этому подразделению для использования нашими вооружёнными силами."
 colombia12_tt:0 "Мы получим шаблон парашютного подразделения §YУнидад Кондор§! с пятью парашютными полками и несколькими ротами поддержки."
 colombia.13.t:0 "Предложение о военной полиции"
 colombia.13.d:0 "Любое открытое восстание или акция протеста, организованные радикальной оппозицией и террористическими боевиками, не могут оставаться безнаказанными. Контроль правительства над страной не должен подвергаться сомнению, пока оно следует воле народа.\n\nЕсли мы намерены эффективнее подавлять партизан и повстанцев, наши военные эксперты предлагают сформировать новый полк военной полиции, единственной задачей которого будет поддержание порядка и стабильности внутри страны.\n\nЭто подразделение будет состоять из пяти кавалерийских частей со специализированными инструкторами, специально подготовленными для борьбы с сопротивлением."
 colombia.13.a:0 "Немедленно начнём подготовку личного состава!"
 colombia13_tt:0 "Теперь доступен шаблон военной полиции §YПолисия Милитар§! с пятью кавалерийскими подразделениями и полком поддержки военной полиции."
 colombia.1001.t:0 "Создан новый оборонительный пакт"
 colombia.1001.d:0 "Видя растущие великоколумбийские амбиции [COL.getAdjective] правительства, обеспокоенные чиновники [ECU.getNameDef] и [PAN.getNameDef] начали напряжённые переговоры о создании оборонительного пакта, призванного противостоять возрождению давно погибшего государства Великая Колумбия.\n\nОбе страны стягивают войска к границам, готовые сражаться до последнего человека за свою независимость."
 colombia.1001.a:0 "Это обезопасит наши страны ещё ненадолго!"
