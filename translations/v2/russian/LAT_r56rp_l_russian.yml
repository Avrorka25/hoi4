 LAT_r56rp_foreign_servitude_category_desc:0 "Нам стало ясно, что если мы хотим пережить грозу, которая надвигается на горизонте, нам придется склониться к вершине. §Y[GER.GetAdjective]s§! Как будто они готовы стать новыми хозяевами §YЕвропа§!. Но, прежде чем они придут и заставят нас подчиниться, мы могли бы назначить про-§Y[GER.GetAdjective]§! режим, который увидит, что мы стоим бок о бок с ними и не будем сметены вместе с остальными §YЕвропа§!.\n\nМы также можем использовать наши контакты, чтобы связаться с §YБелые русские изгнанники§! Если верить слухам, они могут попытаться навести порядок на своей бывшей родине на востоке.\n\n§R- Внимание--§!\nВыбрать a §YПолитический путь§! Удалит это §YРешение§! И не дать вам получить доступ к про-§Yнемец§! или Про-§Yрусский§! Сосредоточьте деревья."
