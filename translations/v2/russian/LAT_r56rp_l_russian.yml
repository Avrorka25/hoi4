 LAT_r56rp_russian_styled_war_industry_category_desc:0 "После моделирования нашей военной промышленности по образцу той, которая была создана Советским Союзом, а теперь адаптирована возвращающимся режимом, мы оказались с новым вопросом. Наша логистическая сеть не может повлиять на уровень производства, который нам необходим, это должно быть изменено или мы пострадаем от последствий.\n\n"
