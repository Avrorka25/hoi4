 LAT_r56rp_ger_junta.1.t:0 "[FROM.GetNameDefCap] Предлагает объединение"
 LAT_r56rp_ger_junta.1.d:0 "Сегодня посланник из [LAT.Capital.GetCapitalVictoryPointName] Мы пришли с предложением об объединении наших народов. Они подчеркивают важность объединения наших стран, чтобы попытаться предотвратить дальнейшее российское доминирование в Балтийском регионе, но, основываясь на формулировке, это предложение, похоже, не имеет выбора, хотим мы этого или нет, кажется, они готовы нанести удар, что нам делать?"
 LAT_r56rp_ger_junta.1.a:0 "Хмм... Мы согласны"
 LAT_r56rp_ger_junta.1.b:0 "Нет, мы не согласны"
 LAT_r56rp_ger_junta.2.t:0 "Государство [FROM.GetNameDefCap] соглашается"
 LAT_r56rp_ger_junta.2.d:0 "Хорошие новости, [FROM.GetNameDef] Мы согласились с нашим предложением, и сейчас мы находимся в процессе передачи всего государственного контроля над нашей столицей. Их нынешний статус, а также ограниченные военно-морские активы интегрируются в наши вооруженные силы."
 LAT_r56rp_ger_junta.2.a:0 "Потрясающий"
 LAT_r56rp_ger_junta.3.t:0 "[FROM.GetNameDefCap] несогласие"
 LAT_r56rp_ger_junta.3.d:0 "Неприятные новости, [FROM.GetNameDef] Они не согласились с нашим предложением и, таким образом, перебрасывают свои силы к нашим границам и готовятся нанести удар в ближайшее время. Мы уже направили наши вооруженные силы, и мы готовы нанести удар всего за несколько часов."
 LAT_r56rp_ger_junta.3.a:0 "О нет, какой позор"
 LAT_r56rp_ger_junta.4.t:0 "[FROM.GetNameDefCap] Требуется Русинская земля"
 LAT_r56rp_ger_junta.4.d:0 "Сегодня посланник из [LAT.Capital.GetCapitalVictoryPointName] Мы пришли с требованием, откажитесь от польских Русинских земель, которые мы в настоящее время держим, или столкнемся с войной. Как мы должны реагировать? В настоящее время они пользуются поддержкой [GER.GetAdjective] Правительство, и это может вызвать некоторые проблемы."
 LAT_r56rp_ger_junta.4.a:0 "Лучше всего, чтобы... Согласен"
 LAT_r56rp_ger_junta.4.b:0 "Нет, мы не планируем отказываться от земли."
 LAT_r56rp_ger_junta.5.t:0 "[FROM.GetNameDefCap] Передача требуемой земли"
 LAT_r56rp_ger_junta.5.d:0 "[FROM.GetNameDefCap] К счастью, мы согласились расстаться с Рутскими землями, которые мы от них требовали, а это значит, что нам не придется вести против них потенциально затяжную войну."
 LAT_r56rp_ger_junta.5.a:0 "Идеально, кровь не проливается без необходимости"
 LAT_r56rp_ger_junta.6.t:0 "Государство [FROM.GetNameDefCap] продолжает сопротивляться"
 LAT_r56rp_ger_junta.6.d:0 "[FROM.GetNameDefCap] К несчастью, мы отказались расстаться с землями Русинских островов, которые мы от них требовали, а это значит, что нам придется бороться за земли, которые мы требовали от них. Таким образом, наши вооруженные силы теперь готовы нанести по ним удар."
 LAT_r56rp_ger_junta.6.a:0 "О нет, давайте разберемся с этим, хорошо?"
 LAT_r56rp_purchase_stugs.1.t:0 "Рейхсское министерство вооружений поставляет"
 LAT_r56rp_purchase_stugs.1.d:0 "Рано утром, груз прибыл через поезд, который перевозил значительную поставку штурмовых орудий, которые мы заказали. Похоже, что министерство Рейха не очень радо тому, что ему приходится отправлять такое оборудование на поезде, поэтому мы не должны удивляться, если они вдруг решат, что это больше не стоит усилий."
 LAT_r56rp_purchase_stugs.1.a:0 "Великолепно!"
 LAT_r56rp_purchase_stugs.2.t:0 "Имперское министерство вооружений (последняя поставка)"
 LAT_r56rp_purchase_stugs.2.d:0 "Похоже, что министерство вооружений рейха уже достаточное количество раз отгрузило штурмовые орудия по железным дорогам и заявило нам, что это будет последняя партия штурмовых орудий, которую мы получим, и что вместо этого мы должны создать собственное местное производство."
 LAT_r56rp_purchase_stugs.2.a:0 "Ох... Хорошо."
 LAT_r56rp_purchase_tanks.1.t:0 "Рейхсское министерство вооружений поставляет"
 LAT_r56rp_purchase_tanks.1.d:0 "Рано утром прибыл груз поездом, который доставил тяжелые танки, которые мы заказали. Похоже, что министерство Рейха не очень радо тому, что ему приходится отправлять такое оборудование на поезде, поэтому мы не должны удивляться, если они вдруг решат, что это больше не стоит усилий."
 LAT_r56rp_purchase_tanks.1.a:0 "Великолепно!"
 LAT_r56rp_purchase_tanks.2.t:0 "Имперское министерство вооружений (последняя поставка)"
 LAT_r56rp_purchase_tanks.2.d:0 "Похоже, что имперскому министерству вооружений хватило того, что пришлось отгружать тяжелые танки по железным дорогам, и оно сказало нам, что это будет последняя партия тяжелых танков, которую мы получим, и что вместо этого мы должны создать собственное местное производство этих танков."
 LAT_r56rp_purchase_tanks.2.a:0 "Ох... Хорошо."
 LAT_r56rp_sov_zastava.1.t:0 "[FROM.GetNameDefCap] Пресса для пограничной корректировки"
 LAT_r56rp_sov_zastava.1.d:0 "Сегодня прибыл посланник из Риги, он попросил о личной встрече с главой нашего правительства, и хотя у нас нет всех подробностей того, что было сказано, или как это было сказано, мы знаем, что и кого он представлял. Мы рассчитывали на то, что российское правительство прибалтийских стран приедет к нам в гости, и теперь они приехали. Они предлагают корректировку границы, которая предполагает, что мы отдадим нашу землю реке Неман, которая будет включать такие города, как Гродно, Вильно и Вилейка, они, кажется, готовы к конфронтации, что нам делать?"
 LAT_r56rp_sov_zastava.1.a:0 "Хорошо, мы будем смягчаться, пока..."
 LAT_r56rp_sov_zastava.1.b:0 "Ни один дюйм польской глины не пойдет к русским куклам!"
 LAT_r56rp_naval_burden.1.t:0 "[FROM.GetNameDefCap] Предложения взять на себя военно-морское бремя"
 LAT_r56rp_naval_burden.1.d:0 "Сегодня мы получили сообщение от [FROM.GetNameDef]Они готовы использовать опыт своего нового руководства в военно-морской войне и судостроении, чтобы взять на себя бремя защиты наших западных береговых линий от потенциальной агрессии. Это позволило бы нам сосредоточиться на других вопросах, таких как авиация или наши сухопутные войска. Каким должен быть наш ответ?"
 LAT_r56rp_naval_burden.1.a:0 "Прекрасная идея!"
 LAT_r56rp_naval_burden.1.b:0 "Мы бы предпочли не..."
