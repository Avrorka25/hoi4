 LAT_r56rp_restoration_of_the_baltic_governate_desc:0 "С помощью Николая Коломейцева мы вновь восстановили Балтийское управление, хотя уже не как внутреннюю часть возрождающейся Российской империи, а как оплот против тех, кто снова увидит Россию в хаосе и беспорядке. Мы будем стоять рядом с царем и действовать как щит Балтики против всех врагов России."
