l_russian:
 treaty_org.1.t:0 "Брюссельский договор"
 treaty_org.1.desc:0 "После устранения непосредственной глобальной угрозы непрочные договорённости между [SOV.GetNameDef] и их западными союзниками начали разрушаться.\n\nОпасаясь необратимого разрыва связей в сочетании с противоречивыми амбициями в Европе — что особенно видно по недавним событиям в Восточной Германии, — [FROM.GetNameDef] предложила заключить договор о взаимной помощи на срочно созванной конференции в Брюсселе."
 treaty_org.1.a:0 "Восточную угрозу необходимо сдержать."
 treaty_org.1.b:0 "Нам не нужна ещё одна война..."
 join_brussels_treaty_tt:0 "Мы подпишем Брюссельский договор"
 SOV_chose_NATO_neutrality:0 "Выбран нейтралитет"
 SOV_joined_NATO:0 "Подписан Брюссельский договор"
 NATO_brussels_treaty:0 "Брюссельский договор"
 NATO_brussels_treaty_desc:0 "После устранения непосредственной глобальной угрозы непрочные договорённости между [SOV.GetNameDef] и их западными союзниками начали разрушаться."
 nato_decisions:0 "Организации договора"
 brussels_to_has_already_happened:0 "Конференция в Брюсселе ещё не была созвана"
 TO_will_be_invited_to_join_or_leave:0 "Выберет, подписать договор или покинуть [ROOT.GetFactionName].\n"
 TO_chose_neutrality:0 "Вынужденный нейтралитет"
 TO_chose_neutrality_desc:0 "Пока между Востоком и Западом назревает буря, наше положение требует осторожного подхода."
 TO_left_faction:0 "Покинула [FROM.GetFactionName]."
 TO_signed_brussels:0 "Подписан Брюссельский договор"
 treaty_org.2.t:0 "Брюссельский договор подписан"
 treaty_org.2.desc:0 "Напоминая миру, что худшее ещё может быть впереди, несколько бывших союзных держав сегодня объявили о подписании нового договора в Брюсселе.\n\nХотя формально он заявлен как договор о взаимном гражданском и военном сотрудничестве, мало кто сомневается, какой сигнал это посылает лидерам и союзникам [SOV.GetNameDef].\n\nНесколько государств, оказавшихся между жерновами этой геополитической напряжённости, воспользовались моментом, чтобы провозгласить принцип официального нейтралитета."
 treaty_org.2.a:0 "Тревожное развитие событий."
 treaty_org.2.b:0 "Бесстыдная провокация."
 NATO_form_nato_properly:0 "Ратифицировать Североатлантический договор"
 NATO_suggest_nato:0 "Проект организации Североатлантического договора"
 NATO_suggest_nato_desc:0 "Расширение Брюссельского договора — логичный следующий шаг для нашего союза."
 treaty_org.3.t:0 "Организация Североатлантического договора"
 treaty_org.3.desc:0 "Правительства [USA.GetNameDef] и [FROM.GetNameDef] в давно ожидаемом дипломатическом манёвре прошлой ночью объявили о создании Организации Североатлантического договора. Обещая новую эпоху гражданского, военного и разведывательного сотрудничества, решение было крайне негативно воспринято высшим руководством [SOV.GetNameDef].\n\nПохоже, мир может оказаться недолговечным."
 treaty_org.3.a:0 "Интересно."
 treaty_org.3.b:0 "Отвратительно."
 treaty_org.4.desc:0 "Правительство [FROM.GetNameDef] в давно ожидаемом, но несколько беззубом дипломатическом манёвре прошлой ночью объявило о создании Организации Североатлантического договора. Обещая новую эпоху гражданского, военного и разведывательного сотрудничества, решение было крайне негативно воспринято высшим руководством [SOV.GetNameDef].\n\nПохоже, мир может оказаться недолговечным."
 treaty_org.4.a:0 "Интересно."
 treaty_org.4.b:0 "Не очень-то это похоже на Северную Атлантику."
 TO_nato_ratified:0 "Североатлантический договор"
 TO_nato_ratified_desc:0 "Договор, позволяющий нашим странам объединять ресурсы и разведданные. По определённым причинам."
 nato_not_suggested_yet:0 "НАТО ещё не была предложена"
 north_atlantic_treaty_org:0 "НАТО"
 warsaw_pact:0 "Варшавский договор"
 NATO_have_warsaw_pact:0 "Предложить Варшавский договор"
 NATO_have_warsaw_pact_desc:0 "Единственный достойный ответ на Брюссельский договор — создать собственный блок."
 treaty_org.5.d:0 "Опасаясь оказаться между сторонами нового конфликта Востока и Запада, [FROM.GetNameDef] объявила о намерении немедленно покинуть [ROOT.GetFactionName]. В их положении трудно их винить."
 treaty_org.5.t:0 "[FROM.GetName] выбирает нейтралитет"
 treaty_org.5.a:0 "Понятно."
