 RULE_OPTION_RIGHT_OPPOSITION_SOV_AI_DESC:0 "Советский ИИ попытается привести к власти Правую оппозицию, следуя соответствующим ветвям национального дерева фокусов."
 RULE_RIGHT_OPPOSITION_COOPERATIVE:0 "Коалиционная Правая оппозиция"
 RULE_EXILES_TSARIST:0 "Царские эмигранты"
 RULE_OPTION_EXILES_TSARIST_SOV_AI_DESC:0 "Советский ИИ свергнет коммунистов в гражданской войне и восстановит царскую Россию, следуя соответствующей ветви национального дерева фокусов."
