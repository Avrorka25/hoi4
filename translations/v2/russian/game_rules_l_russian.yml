 RULE_ALLOW_LICENSING:0 "Лицензии на производство"
 RULE_ALLOW_LICENSING_FREE_DESC:0 "Страны могут приобретать лицензии на производство у любой страны."
 RULE_ALLOW_LICENSING_SAME_IDEOLOGY_DESC:0 "Страны могут приобретать лицензии на производство только у стран с той же правящей идеологией."
 RULE_ALLOW_LICENSING_SAME_FACTION_DESC:0 "Страны могут приобретать лицензии на производство только у членов своего альянса."
 RULE_ALLOW_LICENSING_BLOCKED_DESC:0 "Страны никогда не могут приобретать лицензии на производство, кроме особых решений и событий."
 RULE_ALLOW_LEND_LEASE:0 "Ленд-лиз"
 RULE_ALLOW_LEND_LEASE_FREE_DESC:0 "Страны могут отправлять снаряжение по ленд-лизу кому угодно при любом уровне мировой напряжённости."
 RULE_ALLOW_LEND_LEASE_LIMITED_DESC:0 "Ленд-лиз ограничен уровнем мировой напряжённости и идеологическими правилами."
 RULE_ALLOW_LEND_LEASE_SAME_IDEOLOGY_DESC:0 "Страны могут отправлять снаряжение по ленд-лизу только странам с той же правящей идеологией."
 RULE_ALLOW_LEND_LEASE_SAME_FACTION_DESC:0 "Страны могут отправлять снаряжение по ленд-лизу только членам своего альянса."
 RULE_ALLOW_LEND_LEASE_BLOCKED_DESC:0 "Страны никогда не могут отправлять снаряжение по ленд-лизу другим странам."
 RULE_ALLOW_VOLUNTEERS:0 "Добровольцы"
 RULE_ALLOW_VOLUNTEERS_FREE_DESC:0 "Страны могут отправлять добровольцев в любую страну независимо от мировой напряжённости."
 RULE_ALLOW_VOLUNTEERS_LIMITED_DESC:0 "Отправка добровольцев ограничена мировой напряжённостью и идеологическими правилами."
 RULE_ALLOW_VOLUNTEERS_SAME_IDEOLOGY_DESC:0 "Страны могут отправлять добровольцев только странам с той же правящей идеологией."
 RULE_ALLOW_VOLUNTEERS_BLOCKED_DESC:0 "Страны никогда не могут отправлять добровольцев."
 RULE_VOLUNTEERS_NOT_ANARCHISTS_TT:0 "§RСуверенные страны не могут отправлять добровольцев анархистам!§!"
 RULE_VOLUNTEERS_PORTUGAL_SCW_TT:0 "§RПортугалия не может отправлять добровольцев испанской фракции, которую она не поддерживает.§!"
 RULE_VOLUNTEERS_BULGARIA_SCW_TT:0 "§RБолгария не может отправлять добровольцев испанской фракции, которую она не поддерживает.§!"
 RULE_VOLUNTEERS_SOVIET_CHINA_SUPPORT_CHOSEN_ONE_TT:0 "§RСоветский Союз не может отправлять добровольцев китайской фракции, которую он не поддерживает.§!"
 RULE_VOLUNTEERS_SOVIET_CHINA_ONLY_ONE_TT:0 "§RМы не можем отправлять добровольцев более чем одной китайской фракции.§!"
 RULE_VOLUNTEERS_SOVIET_SCW_TT:0 "§RСоветский Союз не может отправлять добровольцев испанской фракции, восставшей против республиканского правительства.§!"
 RULE_VOLUNTEERS_SOVIET_SCW_COVERT_POUM_TT:0 "§RСоветский Союз всё ещё придерживается сталинской доктрины и не может отправлять добровольцев испанской фракции, восставшей против республиканского правительства.§!"
 RULE_VOLUNTEERS_SOVIET_SCW_POUM_TT:0 "§RСоветская Социалистическая Республика поддерживает ПОУМ и не может отправлять добровольцев другим испанским фракциям.§!"
 RULE_VOLUNTEERS_SOVIET_EXILES_SCW_TT:0 "§RРоссийское правительство может отправлять добровольцев только испанским повстанцам, сражающимся против законного правительства Испании.§!"
 RULE_VOLUNTEERS_SAME_IDEOLOGY_TT:0 "Правило игры: §Rстраны могут отправлять добровольцев только странам с той же правящей идеологией.§!"
 RULE_ALLOW_GUARANTEES:0 "Гарантии независимости"
 RULE_ALLOW_GUARANTEES_FREE_DESC:0 "Независимость любой страны можно гарантировать в любое время независимо от мировой напряжённости."
 RULE_ALLOW_GUARANTEES_LIMITED_DESC:0 "Выдача гарантий независимости ограничена мировой напряжённостью и идеологией."
 RULE_ALLOW_GUARANTEES_SAME_IDEOLOGY_DESC:0 "Страны могут гарантировать независимость только странам с той же правящей идеологией."
 RULE_ALLOW_GUARANTEES_BLOCKED_DESC:0 "Страны никогда не могут гарантировать независимость другим странам. Это не влияет на гарантии, существующие в начале игры или выдаваемые через национальные фокусы."
 RULE_ALLOW_REVOKE_GUARANTEES:0 "Отзыв гарантий"
 RULE_ALLOW_REVOKE_GUARANTEES_ALLOWED_DESC:0 "Гарантии независимости можно отзывать."
 RULE_ALLOW_REVOKE_GUARANTEES_BLOCKED_DESC:0 "Гарантии независимости нельзя отзывать вне национальных фокусов."
 RULE_ALLOW_REVOKE_GUARANTEES_BLOCKED_TOOLTIP:0 "Правило игры: §Rгарантии независимости нельзя отзывать вне национальных фокусов.§!"
 RULE_ALLOW_LEAVE_FACTION:0 "Выход из альянса"
 RULE_ALLOW_LEAVE_FACTION_ALLOWED_DESC:0 "Полностью суверенные страны могут покидать альянс в мирное время."
 RULE_ALLOW_LEAVE_FACTION_BLOCKED_DESC:0 "Страны не могут покидать альянс, кроме как через национальные фокусы и события."
 RULE_ALLOW_KICK_FACTION:0 "Исключение из альянса"
 RULE_ALLOW_KICK_FACTION_ALLOWED_DESC:0 "Лидер альянса может исключить из него любую страну."
 RULE_ALLOW_KICK_FACTION_BLOCKED_DESC:0 "Лидер альянса не может исключать его участников."
 RULE_ALLOW_TAKE_OVER_FACTION:0 "Перехват руководства альянсом"
 RULE_ALLOW_TAKE_OVER_FACTION_ALLOWED_DESC:0 "Страны могут перехватить руководство альянсом, если соответствуют требованиям."
 RULE_ALLOW_TAKE_OVER_FACTION_BLOCKED_DESC:0 "Страны не могут перехватывать руководство альянсом."
 RULE_GROUP_DIVISION_TEMPLATES:0 "Шаблоны дивизий"
 RULE_ALLOW_PARATROOPERS:0 "Воздушные десанты"
 RULE_ALLOW_PARATROOPERS_ALLOWED_DESC:0 "Страны могут свободно проводить воздушные десанты."
 RULE_ALLOW_PARATROOPERS_BLOCKED_DESC:0 "Страны ни при каких обстоятельствах не могут проводить воздушные десанты. Десантные дивизии по-прежнему можно набирать, но они не смогут выполнять воздушные атаки."
 RULE_ALLOW_PARATROOPERS_BLOCKED_TOOLTIP:0 "Правило игры: §Rстраны ни при каких обстоятельствах не могут проводить воздушные десанты.§!"
 RULE_GROUP_COVERT_ACTIONS:0 "Тайные операции"
 RULE_ALLOW_COUPS:0 "Перевороты"
