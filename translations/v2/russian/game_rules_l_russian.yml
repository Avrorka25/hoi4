 RULE_OPTION_EXILES_FASCIST_SOV_AI_DESC:0 "Советский ИИ свергнет коммунистов в гражданской войне и установит фашистское правительство, следуя соответствующей ветви национального дерева фокусов."
 RULE_EXILES_DEMOCRATIC:0 "Демократические эмигранты"
 RULE_OPTION_EXILES_DEMOCRATIC_SOV_AI_DESC:0 "Советский ИИ свергнет коммунистов в гражданской войне, проведёт общенациональные выборы и сформирует демократическое правительство, следуя соответствующей ветви национального дерева фокусов."
 RULE_OPTION_RIGHT_OPPOSITION_COOPERATIVE_SOV_AI_DESC:0 "Советский ИИ попытается привести к власти Правую оппозицию и включить в партию другие оппозиционные группы, следуя соответствующим ветвям национального дерева фокусов. Цель ИИ — создать Верховный Совет."
 RULE_OPTION_COMMUNIST_POL_AI_DESC:0 "Польский ИИ попытается договориться с СССР, чтобы защититься от агрессии, следуя соответствующим ветвям национального дерева фокусов."
 RULE_OPTION_HISTORICAL_POL_AI_DESC:0 "Польский ИИ постарается как можно точнее следовать исторической цепочке событий."
 RULE_FASCIST_POL_AI_DESC:0 "Польский ИИ попытается примириться с Германией ради защиты, следуя соответствующим ветвям национального дерева фокусов."
