 RULE_OPTION_DEFAULT_AI_DESC:0 "ИИ будет принимать решения на основе других настроек игрового процесса, включая принудительные исторические фокусы и прочие игровые сценарии. Это то же поведение, что использовалось в версии 1.5 и более ранних."
 RULE_OPTION_RANDOM_AI_DESC:0 "В начале игры ИИ случайным образом выберет план и попытается его выполнить."
 RULE_OPTION_FASCIST_GER_AI_DESC:0 "Германский ИИ останется фашистским и попытается захватить Европу, следуя соответствующей ветви национального дерева фокусов."
 RULE_OPTION_GER_ALT_FASCIST:0 "Альтернативный фашизм"
 RULE_OPTION_GER_ALT_FASCIST_AI_DESC:0 "Германский ИИ попытается заменить Гитлера одним из членов Внутреннего круга, прислушается к опасениям фон Нейрата и постарается установить свой Новый мировой порядок."
 RULE_FASCIST_JAP_AI_DESC:0 "Японский ИИ попытается нанести удар на юг против западных союзников, пройдя по соответствующему пути в национальном фокусе."
 RULE_OPTION_COMMUNIST_JAP_AI_DESC:0 "Японский ИИ попытается перейти к коммунизму и поддержать другие коммунистические режимы в Азии, следуя соответствующей ветви национального дерева фокусов."
 RULE_OPTION_NEUTRALITY_JAP_AI_DESC:0 "Японский ИИ попытается нанести удар на север против Советского Союза и сделать общее дело с Осью, пройдя соответствующий путь в национальном дереве фокуса."
 RULE_DEMOCRATIC_JAP_AI_DESC:0 "Японский ИИ попытается преобразовать страну в демократию, следуя соответствующей ветви дерева фокусов."
 RULE_FASCIST_HISTORICAL_ITA_AI_DESC:0 "Итальянский ИИ постарается как можно точнее следовать исторической цепочке событий."
 RULE_FASCIST_ALTERNATE_ITA_AI_DESC:0 "Итальянский ИИ попытается заключить союз с Испанией до вступления в Ось, следуя соответствующей ветви национального дерева фокусов."
 RULE_OPTION_ALT_FASCIST_BALBO:0 "Альтернативный фашизм — Римские протоколы"
 RULE_ALT_FASCIST_BALBO_ITA_AI_DESC:0 "Итальянский ИИ попытается отстранить Муссолини и поставить во главе страны Итало Бальбо, выбрав независимый путь."
 RULE_OPTION_ALT_FASCIST_GRANDI:0 "Альтернативный фашизм — за Союзников"
 RULE_ALT_FASCIST_GRANDI_ITA_AI_DESC:0 "Итальянский ИИ попытается отстранить Муссолини и поставить во главе страны Дино Гранди, стремясь укрепить связи с Союзниками."
 RULE_OPTION_ITA_MONARCHIST_ROMAN_EMPIRE:0 "Монархизм — Римская империя"
 RULE_OPTION_ITA_MONARCHIST_ROMAN_EMPIRE_AI_DESC:0 "Король Виктор Эммануил поведёт Италию к абсолютной монархии, попытается добиться господства над Средиземным морем и восстановить Римскую империю."
 RULE_OPTION_ITA_CHRISTIAN_DEMOCRACY:0 "Христианская демократия"
 RULE_OPTION_ITA_CHRISTIAN_DEMOCRACY_AI_DESC:0 "Король Виктор Эммануил свергнет Муссолини, попытается создать независимый альянс и поведёт Италию к конституционной монархии с поддержкой Христианско-демократической партии во главе с Альчиде де Гаспери."
 RULE_OPTION_ITA_COMMUNIST_PLAN:0 "Итальянский коммунизм"
 RULE_OPTION_ITA_COMMUNIST_PLAN_AI_DESC:0 "Итальянские антифашисты объединятся, чтобы силой свергнуть фашистский режим, создать коммунистическое правительство, упразднить колонии и попытаться вступить в Коминтерн."
 RULE_OPTION_ITA_DEMOCRATIC_PLAN:0 "Итальянский социализм"
 RULE_OPTION_ITA_DEMOCRATIC_PLAN_AI_DESC:0 "Итальянские антифашисты объединятся, чтобы силой свергнуть фашистский режим, создать социал-демократическое правительство и попытаться образовать конфедерацию с бывшими африканскими колониями."
 RULE_KAISER_GER_AI_DESC:0 "Германский ИИ попытается вернуть кайзера на престол, следуя соответствующей ветви национального дерева фокусов."
 RULE_DEMOCRATIC_GER_AI_DESC:0 "Германский ИИ попытается создать конституционную монархию, следуя соответствующим ветвям национального дерева фокусов."
 RULE_OPTION_HUN_ROME_PROTOCOLS:0 "Восстановить Римские протоколы"
 RULE_OPTION_HUN_FASCIST_KING:0 "Фашистский король"
 RULE_OPTION_HUN_DEMOCRATIC_KING:0 "Демократический король"
 RULE_OPTION_AUSTRIA_HUNGARY_HUN_AI_DESC:0 "Венгерский ИИ попытается восстановить Австро-Венгерскую империю, следуя соответствующей ветви национального дерева фокусов."
 RULE_FASCIST_HUN_AI_DESC:0 "Венгерский ИИ пойдёт по наиболее близкому к истории пути национального дерева фокусов и попытается вступить в Ось."
 RULE_FASCIST_ALTERNATE_HUN_AI_DESC:0 "Венгерский ИИ попытается создать альянс с Италией и Австрией, следуя соответствующей ветви дерева фокусов."
 RULE_FASCIST_ALTERNATE_KING_HUN_AI_DESC:0 "Венгерский ИИ изберёт фашистского короля и вступит в Ось."
 RULE_OPTION_HUN_HABSBURG_HUNGARY:0 "Габсбургская Венгрия"
 RULE_HABSBURG_HUNGARY_HUN_AI_DESC:0 "Венгерский ИИ изберёт королём Иосифа Августа и восстановит Великую Венгрию под властью Габсбургов."
 RULE_OPTION_HUN_HORTHYIST_KING_HUNGARY:0 "Новая династия"
 RULE_HORTHYIST_KING_HUNGARY_HUN_AI_DESC:0 "Венгерский ИИ коронует Миклоша Хорти или его сына и попытается создать Великое Венгерское королевство."
 RULE_OPTION_HUN_REPUBLICAN_DEMOCRACY:0 "Вторая республика"
 RULE_REPUBLICAN_DEMOCRACY_HUN_AI_DESC:0 "Венгерский ИИ выступит против Хорти, попытается установить демократию и создать Дунайскую федерацию."
 RULE_OPTION_HUN_REPUBLICAN_DEMOCRACY_EXPANSIONIST:0 "Движение дракона"
 RULE_REPUBLICAN_DEMOCRACY_EXPANSIONIST_HUN_AI_DESC:0 "Венгерский ИИ выступит против Хорти и установит демократию, а затем примет идеи Движения дракона и попытается восстановить Великую Венгрию."
 RULE_OPTION_HUN_RESTORE_THE_SOCIALIST_REPUBLIC:0 "Социалистическая Федеративная Республика"
 RULE_RESTORE_THE_SOCIALIST_REPUBLIC_HUN_AI_DESC:0 "Венгерский ИИ попытается восстановить старую Социалистическую Федеративную Республику и создать красную Великую Венгрию."
 RULE_OPTION_HUN_ARROW_CROSS_MOVEMENT:0 "Движение скрещённых стрел"
 RULE_ARROW_CROSS_MOVEMENT_HUN_AI_DESC:0 "Венгерский ИИ попытается установить абсолютную власть Партии скрещённых стрел и в итоге вступить в Ось как её верный союзник."
 RULE_DEMOCRATIC_ALTERNATE_FRA_AI_DESC:1 "Французский ИИ попытается создать Малую Антанту для сдерживания Германии. Если этот альянс создаст Чехословакия, Франция вместо этого вступит в него."
 RULE_OPTION_COMMUNIST_FRA_AI_DESC:0 "Французский ИИ попытается перейти к коммунизму и вступить в Коминтерн, следуя соответствующим ветвям национального дерева фокусов."
 RULE_OPTION_DEMOCRATIC_HISTORICAL_FRA_AI_DESC:0 "Французский ИИ постарается как можно точнее следовать исторической цепочке событий."
 RULE_FASCIST_FRA_AI_DESC:0 "Французский ИИ попытается перейти к фашизму и объединиться с фашистской Германией, следуя соответствующей ветви национального дерева фокусов."
 RULE_OPTION_COMMUNIST_HUN_AI_DESC:0 "Венгерский ИИ попытается стать коммунистической страной и заключить союз с другими крупными коммунистическими державами, следуя соответствующей ветви национального дерева фокусов."
 RULE_OPTION_DEMOCRATIC_HUN_AI_DESC:0 "Венгерский ИИ попытается стать конституционной монархией, следуя соответствующей ветви национального дерева фокусов."
 RULE_OPTION_COMMUNIST_YUG_AI_DESC:0 "Югославский ИИ попытается преобразовать страну в коммунистическую республику, следуя соответствующей ветви национального дерева фокусов."
 RULE_OPTION_DEMOCRATIC_YUG_AI_DESC:0 "Югославский ИИ попытается сохранить демократическое правительство, следуя соответствующим ветвям национального дерева фокусов."
 RULE_FASCIST_YUG_AI_DESC:0 "Югославский ИИ попытается сблизиться с фашистскими странами Европы и в итоге заключить с ними союз."
 RULE_HISTORICAL_YUG_AI_DESC:0 "Югославский ИИ будет как можно точнее следовать исторической цепочке событий."
 RULE_OPTION_DEMOCRATIC_CZE_AI_DESC:0 "Чехословацкий ИИ попытается сохранить демократию и сосредоточится преимущественно на внутреннем развитии, следуя соответствующим ветвям национального дерева фокусов."
 RULE_OPTION_COMMUNIST_CZE_AI_DESC:0 "Чехословацкий ИИ попытается преобразовать страну в коммунистическую и заключить союз с Советским Союзом или другой крупной коммунистической державой."
 RULE_OPTION_DEMOCRATIC_ALTERNATE_CZE_AI_DESC:0 "Чехословацкий ИИ попытается создать оборонительный альянс, сохранив демократию и следуя соответствующим ветвям национального дерева фокусов."
 RULE_FASCIST_CZE_AI_DESC:0 "Чехословацкий ИИ попытается превратить страну в фашистскую и договориться с Германией, следуя соответствующим ветвям национального дерева фокусов."
 RULE_HISTORICAL_CZE_AI_DESC:0 "Чехословацкий ИИ постарается как можно точнее следовать исторической цепочке событий."
 RULE_OPTION_COMMUNIST_AST_AI_DESC:0 "Австралийский ИИ попытается превратить страну в коммунистическую и вступить в союз с Коминтерном, следуя соответствующей ветви национального дерева фокусов."
 RULE_OPTION_DEMOCRATIC_HISTORICAL_AST_AI_DESC:0 "Австралийский ИИ попытается следовать исторической цепочке событий и решений национального дерева фокусов."
 RULE_DEMOCRATIC_ALTERNATE_AST_AI_DESC:0 "Австралийский ИИ попытается добиться полной независимости от Великобритании и стать крупной региональной силой, следуя соответствующим ветвям национального дерева фокусов."
 RULE_FASCIST_AST_AI_DESC:0 "Австралийский ИИ попытается перейти к фашизму и заключить союз с Японией, следуя соответствующей ветви национального дерева фокусов."
 RULE_OPTION_COMMUNIST_CAN_AI_DESC:0 "Канадский ИИ попытается перейти к коммунизму и поддержать рабочих всего мира в их борьбе, следуя соответствующей ветви национального дерева фокусов."
 RULE_OPTION_DEMOCRATIC_HISTORICAL_CAN_AI_DESC:0 "Канадский ИИ попытается следовать исторической цепочке событий и решений национального дерева фокусов."
 RULE_DEMOCRATIC_ALTERNATE_CAN_AI_DESC:0 "Канадский ИИ попытается добиться полной независимости и создать альянс с Соединёнными Штатами, следуя соответствующей ветви национального дерева фокусов."
 RULE_FASCIST_CAN_AI_DESC:0 "Канадский ИИ попытается перейти к фашизму и заключить союз с Германией, следуя соответствующей ветви национального дерева фокусов."
 RULE_OPTION_COMMUNIST_SAF_AI_DESC:0 "Южноафриканский ИИ попытается перейти к коммунизму и освободить народы Африки от колониального владычества, следуя соответствующей ветви национального дерева фокусов."
 RULE_OPTION_DEMOCRATIC_HISTORICAL_SAF_AI_DESC:0 "Южноафриканский ИИ постарается как можно точнее следовать историческому плану."
 RULE_DEMOCRATIC_ALTERNATE_SAF_AI_DESC:0 "Южноафриканский ИИ попытается сохранить демократию и занять более самостоятельную позицию в отношениях с метрополией, следуя соответствующей ветви национального дерева фокусов."
 RULE_FASCIST_SAF_AI_DESC:0 "Южноафриканский ИИ попытается перейти к фашизму и договориться с Германией, следуя соответствующей ветви национального дерева фокусов."
 RULE_OPTION_COMMUNIST_NZL_AI_DESC:0 "Новозеландский ИИ попытается перейти к коммунизму, следуя соответствующей ветви национального дерева фокусов."
 RULE_OPTION_DEMOCRATIC_HISTORICAL_NZL_AI_DESC:0 "Новозеландский ИИ постарается как можно точнее следовать исторической цепочке событий."
 RULE_DEMOCRATIC_ALTERNATE_NZL_AI_DESC:0 "Новозеландский ИИ попытается сохранить демократию и усилить Национальную партию, следуя соответствующей ветви национального дерева фокусов."
 RULE_FASCIST_NZL_AI_DESC:0 "Новозеландский ИИ попытается перейти к фашизму и, возможно, заключить союз с Японией, следуя соответствующей ветви национального дерева фокусов."
 RULE_OPTION_COMMUNIST_RAJ_AI_DESC:0 "Индийский ИИ попытается добиться независимости через союз с Советским Союзом, следуя соответствующей ветви национального дерева фокусов."
 RULE_OPTION_DEMOCRATIC_HISTORICAL_RAJ_AI_DESC:0 "Индийский ИИ сохранит верность Великобритании и попытается следовать исторической цепочке событий."
 RULE_FASCIST_RAJ_AI_DESC:0 "Индийский ИИ попытается добиться независимости через союз с фашистскими странами, следуя соответствующей ветви национального дерева фокусов."
 RULE_OPTION_HISTORICAL_SOV_AI_DESC:0 "Советский ИИ постарается как можно точнее следовать исторической цепочке событий."
 RULE_OPTION_ALTERNATE_SOV_AI_DESC:0 "Советский ИИ сначала сосредоточится на капиталистах и направит удары против более слабых целей на Ближнем Востоке, следуя соответствующим ветвям национального дерева фокусов."
 RULE_OPTION_LEFT_OPPOSITION:0 "Левая оппозиция"
 RULE_OPTION_LEFT_OPPOSITION_SOV_AI_DESC:0 "Советский ИИ попытается вернуть к власти Левую оппозицию и возобновить перманентную революцию, следуя соответствующим ветвям национального дерева фокусов."
 RULE_LEFT_OPPOSITION_COOPERATIVE:0 "Коалиционная Левая оппозиция"
 RULE_OPTION_LEFT_OPPOSITION_COOPERATIVE_SOV_AI_DESC:0 "Советский ИИ попытается вернуть к власти Левую оппозицию, включить в партию другие оппозиционные группы и возобновить перманентную революцию, следуя соответствующим ветвям национального дерева фокусов. Цель ИИ — создать Верховный Совет."
