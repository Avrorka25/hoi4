 RULE_ALLOW_COUPS_AI_ONLY_DESC:0 "Страны могут готовить и проводить перевороты только против стран, которыми не управляет человек."
 RULE_ALLOW_COUPS_BLOCKED_DESC:1 "Страны не могут готовить или проводить перевороты ни в одной стране."
 RULE_ALLOW_PARTY_BOOSTING:0 "Повышение популярности партии"
 RULE_ALLOW_PARTY_BOOSTING_FREE_DESC:0 "Страны могут повышать популярность партии в любой другой стране."
 RULE_ALLOW_PARTY_BOOSTING_AI_ONLY_DESC:0 "Страны могут повышать популярность партии только в странах, которыми не управляет человек."
 RULE_ALLOW_PARTY_BOOSTING_PLAYER_ONLY_DESC:0 "Страны могут повышать популярность партии только в странах, которыми управляет человек."
 RULE_ALLOW_PARTY_BOOSTING_BLOCKED_DESC:0 "Страны не могут повышать популярность партии ни в одной стране."
 RULE_GROUP_CONSTRUCTION:0 "Строительство"
 RULE_GROUP_GAMEPLAY:0 "Правила игрового процесса"
 RULE_MAXIMUM_FORT_LEVEL:0 "Максимальный уровень укреплений"
 RULE_MAXIMUM_FORT_LEVEL_NORMAL_DESC:0 "Страны могут строить наземные и береговые укрепления в соответствии с обычными ограничениями."
 RULE_MAXIMUM_FORT_LEVEL_DESC:0 "Страны могут строить наземные и береговые укрепления только до выбранного уровня. Укрепления, существующие в начале игры, не затрагиваются. Постройки, полученные через национальные фокусы, решения и события, могут превышать выбранный уровень."
 RULE_GROUP_RESEARCH:0 "Исследования"
