 RULE_OPTION_HISTORICAL_CHI_AI_DESC:0 "Китайский ИИ постарается как можно точнее следовать исторической цепочке событий."
 RULE_OPTION_ALTERNATE_CHI_AI_DESC:0 "Китайский ИИ попытается укрепить власть в Китае, подчинив военных правителей, а затем вступит в борьбу с Японией по соответствующим ветвям национального дерева фокусов."
 RULE_OPTION_HISTORICAL_PRC_AI_DESC:0 "ИИ Коммунистического Китая постарается как можно точнее следовать исторической цепочке событий."
 RULE_OPTION_ALTERNATE_PRC_AI_DESC:0 "ИИ Коммунистического Китая попытается создать коалиционное правительство с националистами, следуя соответствующей ветви дерева фокусов."
 RULE_OPTION_COMMUNIST_USA_AI_DESC:0 "ИИ США попытается перейти к коммунизму, следуя соответствующей ветви национального дерева фокусов."
 RULE_OPTION_DEMOCRATIC_HISTORICAL_USA_AI_DESC:0 "ИИ США постарается как можно точнее следовать исторической цепочке событий."
 RULE_DEMOCRATIC_ALTERNATE_USA_AI_DESC:0 "ИИ США попытается играть более активную роль в мировых делах, следуя соответствующей ветви национального дерева фокусов."
 RULE_FASCIST_USA_AI_DESC:0 "ИИ США попытается перейти к фашизму и захватить мир через национальное дерево фокусов."
 RULE_OPTION_OBEDIENCE_MAN_AI_DESC:0 "Маньчжурский ИИ постарается сохранить верность и следовать соответствующей ветви национального дерева фокусов."
 RULE_OPTION_INDEPENDENCE_MAN_AI_DESC:0 "Маньчжурский ИИ попытается обрести независимость и захватить весь Китай, следуя соответствующей ветви национального дерева фокусов."
