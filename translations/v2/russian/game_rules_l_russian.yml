 RULE_ALLOW_ACCESS_BLOCKED_DESC:0 "Страны никогда не могут получать право прохода и право захода в порты от стран вне своего альянса."
 RULE_ALLOW_RELEASE_NATIONS:0 "Освобождение стран"
