 RULE_RESEARCH_AOT_TWO_YEARS_DESC:0 "Страны могут исследовать технологии не более чем на два года раньше срока."
 RULE_RESEARCH_AOT_ONE_YEARS_DESC:0 "Страны могут исследовать технологии не более чем на один год раньше срока."
