 RULE_ALLOW_RELEASE_NATIONS_NOT_PORTUGAL_TOOLTIP:0 "§Y[POR.GetName]§! может освободить эту страну только через §Y«Вопрос наших колоний»§! в §Yдереве фокусов§!."
