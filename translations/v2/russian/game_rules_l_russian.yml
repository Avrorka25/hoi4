 RAJ_FRAGMENTATION_STATUS:0 "Статус раздробленности Индии"
 RULE_OPTION_RAJ_FRAGMENTED:0 "Раздробленный Британский Радж"
 RULE_OPTION_RAJ_FRAGMENTED_DESC:0 "В начале игры все доступные для освобождения составные страны Британского Раджа становятся свободными и независимыми."
 RULE_OPTION_NATIONALIST_HISTORICAL:0 "Франкизм"
 RULE_OPTION_NATIONALIST_HISTORICAL_DESC:0 "Франко возглавит националистический фронт и объединит фалангистскую и карлистскую идеологии в новой единой Испании, стараясь сохранять нейтралитет в мировой войне, если на страну не нападут."
 RULE_OPTION_SECOND_REPUBLIC:0 "Вторая республика"
 RULE_OPTION_SECOND_REPUBLIC_DESC:0 "Демократическое правительство Испании сохранит Вторую республику, отвергнув как фашизм, так и коммунизм."
 RULE_OPTION_FALANGIST:0 "Фалангизм"
 RULE_OPTION_FALANGIST_DESC:0 "Фалангисты во главе с Хосе Антонио Примо де Риверой отвергнут карлизм и попытаются восстановить испанский империализм."
 RULE_OPTION_CARLIST:0 "Карлизм"
 RULE_OPTION_CARLIST_DESC:0 "Карлисты во главе с Мануэлем Фаль Конде отвергнут фалангизм и обеспечат возвращение старой абсолютной монархии под властью законного карлистского короля."
 RULE_OPTION_ANARCHIST:0 "Анархизм"
 RULE_OPTION_ANARCHIST_DESC:0 "Анархистские коммуны Арагона и Каталонии объединятся, чтобы победить и фашистов, и коммунистов, а также отвергнуть саму идею национального государства."
 RULE_OPTION_INDEPENDENT_COMMUNIST:0 "Независимый коммунизм"
 RULE_OPTION_INDEPENDENT_COMMUNIST_DESC:0 "После гражданской войны ПОУМ и союзные анархисты сбросят сталинское ярмо и выберут собственную независимую коммунистическую идеологию."
 RULE_OPTION_STALINIST:0 "Сталинский коммунизм"
 RULE_OPTION_STALINIST_DESC:0 "Истинные коммунисты, получающие приказы из Москвы, выступят против анархистов и фашистов, ограничат влияние независимых коммунистов и откроют новую эпоху Второй республики под сталинским руководством."
 RULE_OPTION_HISTORICAL_POR_AI_DESC:0 "При режиме Салазара Португалия укрепит Новое государство и попытается сохранить нейтралитет во Второй мировой войне."
 RULE_OPTION_FASCIST_POR_AI_DESC:0 "Рафаэл Перейра установит в Португалии фашистскую диктатуру, поддержит националистов в гражданской войне в Испании и затем попытается вступить в Ось."
 RULE_OPTION_FASCIST_FIFTH_EMPIRE:0 "Пятая империя"
 RULE_OPTION_FASCIST_FIFTH_EMPIRE_DESC:1 "Португальское правительство примет фашизм, выступит против республиканцев в гражданской войне в Испании и попытается вернуть утраченные территории в Африке, Азии и Америке, вновь став великой державой."
 RULE_OPTION_NEUTRALITY_MONARCHIST:0 "Монархизм"
 RULE_OPTION_NEUTRALITY_MONARCHIST_DESC:0 "После восстановления монархии в Португалии король Дуарте обратится к бразильским монархистам и попытается восстановить империю Португалии и Бразилии."
 RULE_OPTION_DEMOCRATIC_POR_AI_DESC:1 "Под влиянием Великобритании демократическое правительство свергнет авторитарный режим Салазара и при помощи британцев сосредоточится на развитии национальной промышленности, прежде чем вступить в Союзники."
 RULE_OPTION_COMMUNIST_COMINTERN:0 "Коммунизм"
 RULE_OPTION_COMMUNIST_COMINTERN_DESC:0 "Португалия сблизится с Советским Союзом, поддержит Испанскую республику и попытается вступить в Коминтерн."
 RULE_OPTION_COMMUNIST_INDEPENDENT:0 "Объединённые Европейские Социалистические Республики"
 RULE_OPTION_COMMUNIST_INDEPENDENT_DESC:0 "Коммунисты свергнут правительство, выступят против испанских националистов и объединят Пиренейский полуостров в Объединённые Европейские Социалистические Республики — последний бастион Европы против фашизма."
 RULE_OPTION_PORTUGALS_PATH_TO_MARXISM_LENINISM:0 "Путь Португалии к марксизму-ленинизму"
 RULE_OPTION_PORTUGALS_PATH_TO_MARXISM_LENINISM_DESC:0 "Португальские социалисты свергнут правительство Салазара и посеют семена диктатуры пролетариата на самом западном краю Европы."
 RULE_OPTION_RESTORE_CIVIL_LIBERTIES:0 "Восстановить гражданские свободы"
 RULE_OPTION_RESTORE_CIVIL_LIBERTIES_DESC:0 "Португальские социалисты свергнут правительство Салазара, а новая революционная хунта приступит к восстановлению либеральных институтов страны."
 RULE_OPTION_MONARCHIST_ORLEANIST:0 "Монархизм: Орлеанский дом"
 RULE_OPTION_MONARCHIST_LEGITIMIST:0 "Монархизм: дом Бурбонов"
 RULE_OPTION_MONARCHIST_BONAPARTIST:0 "Монархизм: дом Бонапартов"
 RULE_MONARCHIST_ORLEANIST_FRA_AI_DESC:0 "Французский ИИ попытается восстановить монархию и возвести на престол орлеанистского претендента, следуя соответствующей ветви дерева фокусов."
 RULE_MONARCHIST_LEGITIMIST_FRA_AI_DESC:0 "Французский ИИ попытается восстановить монархию и возвести на престол легитимистского претендента, следуя соответствующей ветви дерева фокусов."
 RULE_MONARCHIST_BONAPARTIST_FRA_AI_DESC:0 "Французский ИИ попытается восстановить монархию и возвести на престол бонапартистского претендента, следуя соответствующей ветви дерева фокусов."
 RULE_ALLOW_RELEASE_NATIONS_KURDISTAN_TOOLTIP:1 "§Y[ROOT.GetName]§! не может освободить §Y[KUR.GetName]§!. Освободить §Y[KUR.GetName]§! могут только страны, не имеющие национальных территорий в §YКурдистане§!."
 RULE_ENTENTE_LIT_AI_DESC:0 "Литва попытается официально оформить Балтийскую Антанту и выстоять против Советского Союза."
 RULE_ENTENTE_EST_AI_DESC:0 "Эстония попытается официально оформить Балтийскую Антанту и выстоять против Советского Союза."
 RULE_ENTENTE_LAT_AI_DESC:0 "Латвия попытается официально оформить Балтийскую Антанту и выстоять против Советского Союза."
 RULE_HISTORICAL_EST_AI_DESC:0 "Эстонский ИИ будет сохранять нейтралитет большую часть кампании, но в 1940-х годах станет советской марионеткой."
 RULE_HISTORICAL_LAT_AI_DESC:0 "Латвийский ИИ будет сохранять нейтралитет большую часть кампании, но в 1940-х годах станет советской марионеткой."
 RULE_HISTORICAL_LIT_AI_DESC:0 "Литовский ИИ будет сохранять нейтралитет большую часть кампании, но в 1940-х годах станет советской марионеткой."
 RULE_OPTION_MONARCHIST_LIT_AI_DESC:0 "Литва попытается восстановить монархию и предъявить права на Речь Посполитую."
 RULE_OPTION_BALTIC_ENTENTE:0 "Балтийская Антанта"
 RULE_OPTION_HISTORICAL_BUL_AI_DESC:0 "Царь Борис III поведёт страну к Оси, полагаясь на германский арбитраж для мирного расширения границ Болгарии, затем подпишет Тройственный пакт и будет откладывать вступление Болгарии в войну."
 RULE_OPTION_COMMUNIST_BUL_AI_DESC:0 "Болгария попытается вступить в Коминтерн и вместе с советскими товарищами бороться против фашизма и капитализма в Европе."
 RULE_OPTION_COMMUNIST_BALKAN_FEDERATION:0 "Коммунизм — Балканская федерация"
 RULE_OPTION_COMMUNIST_BALKAN_FEDERATION_BUL_AI_DESC:0 "Болгария попытается создать балканский союз, склонить соседей к революции и в итоге объединить Балканы."
 RULE_OPTION_FASCIST_BUL_AI_DESC:0 "По мере усиления фашизма правый лидер Христо Луков попытается вступить в Ось, а затем свергнуть царя и установить военную диктатуру."
 RULE_OPTION_THE_RETURN_OF_FERDINAND:0 "Возвращение Фердинанда I"
 RULE_OPTION_THE_RETURN_OF_FERDINAND_BUL_AI_DESC:0 "После смерти царя Бориса III его отец Фердинанд I вновь займёт престол и попытается отомстить тем, кто обидел его десятилетия назад."
 RULE_OPTION_DEMOCRATIC_SOCIALIST:0 "Демократия — социализм"
 RULE_OPTION_DEMOCRATIC_SOCIALIST_BUL_AI_DESC:1 "Правительство Николы Мушанова будет проводить социалистическую политику, стремясь улучшить отношения с соседями, создать Балканскую конфедерацию и защитить регион от иностранных агрессоров."
 RULE_OPTION_DEMOCRATIC_LIBERAL:0 "Демократия — либерализм"
 RULE_OPTION_DEMOCRATIC_LIBERAL_BUL_AI_DESC:0 "Болгарская демократическая партия попытается вступить в Союзники, организуя заговор против царя Бориса с целью отстранить его и создать просоюзнический регентский совет."
 RULE_OPTION_METAXIST_GRE_AI_DESC:0 "Греция будет придерживаться нейтралитета, одновременно развивая идеи метаксизма."
 RULE_OPTION_MONARCHIST_GRE_AI:0 "Монархизм"
 RULE_OPTION_MONARCHIST_GRE_AI_DESC:0 "Греция станет абсолютной монархией и попытается вступить в Союзники."
 RULE_OPTION_MONARCHIST_GRE_ALTERNATE_AI:0 "Вступить в Центральные державы"
 RULE_OPTION_MONARCHIST_ALTERNATE_GRE_AI_DESC:0 "Греция станет абсолютной монархией и попытается вступить в Центральные державы вместе с Германией или Австро-Венгрией."
 RULE_OPTION_STALINIST_GRE_AI:0 "Сталинизм"
 RULE_OPTION_STALINIST_GRE_AI_DESC:0 "Греция попытается вступить в Коминтерн и начать борьбу с Турцией за Босфор."
 RULE_OPTION_COMMUNIST_GRE_AI:0 "Коммунизм"
 RULE_OPTION_ALTERNATE_COMMUNIST_GRE_AI_DESC:0 "Греция попытается бороться с фашизмом в Европе вместе с коммунистической Югославией."
 RULE_OPTION_DEMOCRATIC_GRE_AI:0 "Венизелизм"
 RULE_OPTION_VENEZELIST_GRE_AI_DESC:0 "Греция будет бороться за право воплотить Великую идею."
 RULE_OPTION_FASCISM_GRE_AI_DESC:0 "Греция станет национал-социалистической республикой и попытается вступить в Ось вместе с Турцией."
 RULE_OPTION_FASCIST_ALTERNATE_GRE_AI:0 "Анатолийский фашизм"
 RULE_OPTION_FASCISM_ALTERNATE_GRE_AI_DESC:0 "Греция станет демократической, переживёт крах правительства, а затем устремится к самым грандиозным амбициям."
 RULE_OPTION_HISTORICAL_TUR_AI:0 "Исторический путь"
 RULE_OPTION_HISTORICAL_TUR_AI_DESC:1 "Под руководством Исмета Инёню Турция будет сохранять нейтралитет как можно дольше, а затем попытается вступить в Союзники."
 RULE_OPTION_ALTERNATE_KEMALIST_AI:0 "Альтернативный кемализм"
 RULE_OPTION_ALTERNATE_KEMALIST_AI_DESC:0 "Турция назначит Февзи Чакмака президентом и продолжателем дела Мустафы Кемаля Ататюрка, будет как можно дольше сохранять нейтралитет, а затем попытается вступить в Ось или Союзники."
 RULE_OPTION_OTTOMAN:0 "Восстановить Османский султанат"
 RULE_OPTION_OTTOMAN_DESC:0 "Турецкая республика рухнет, и из её пепла возродится Османский султанат."
 RULE_OPTION_COMMUNIST_TUR_AI:0 "Коммунизм"
 RULE_OPTION_COMMUNIST_TUR_AI_DESC:0 "Турция установит коммунистическое правительство и попытается вступить в Коминтерн."
 RULE_OPTION_ALTERNATE_COMMUNIST_TUR_AI:0 "Независимый коммунизм"
 RULE_OPTION_ALTERNATE_COMMUNIST_TUR_AI_DESC:0 "Турция установит коммунистическое правительство, сохранившее кемалистские черты, и попытается создать собственный альянс."
 RULE_OPTION_TUR_DEMOCRATIC_KEMALIST:0 "Демократический кемализм"
 RULE_OPTION_TUR_DEMOCRATIC_KEMALIST_DESC:0 "Джеляль Баяр преобразует Турцию в кемалистскую демократию и попытается вступить в Союзники."
 RULE_OPTION_TUR_DEMOCRATIC_ALTERNATE:0 "Демократический консерватизм"
 RULE_OPTION_TUR_DEMOCRATIC_ALTERNATE_DESC:0 "Аднан Мендерес преобразует Турцию в консервативную демократию и попытается вступить в Союзники."
 RULE_OPTION_FASCISM_TUR_AI:0 "Кемалистский фашизм"
 RULE_OPTION_FASCISM_TUR_AI_DESC:0 "Реджеп Пекер превратит Турцию в фашистскую диктатуру и попытается вступить в Ось."
 RULE_OPTION_TUR_FASCISM_ALTERNATE:0 "Милитаристский фашизм"
 RULE_OPTION_TUR_FASCISM_ALTERNATE_DESC:0 "Февзи Чакмак превратит Турцию в консервативную квазифашистскую диктатуру и попытается создать альянс с Италией."
 RULE_OPTION_BALKAN_ENTENTE:0 "Защитить Балканы"
 RULE_OPTION_BALKAN_ENTENTE_DESC:0 "Турция посвятит себя обеспечению безопасности Балкан и попытается создать альянс с Грецией, Румынией и Югославией."
 RULE_FASCIST_LIT_AI_DESC:0 "Литовский ИИ попытается установить фашистское правительство, следуя соответствующей ветви национального дерева фокусов."
 RULE_FASCIST_LAT_AI_DESC:0 "Латвийский ИИ попытается установить фашистское правительство, следуя соответствующей ветви национального дерева фокусов."
 RULE_FASCIST_EST_AI_DESC:0 "Эстонский ИИ попытается установить фашистское правительство, следуя соответствующей ветви национального дерева фокусов."
 RULE_COMMUNIST_BALTIC_AI_DESC:0 "ИИ попытается установить коммунистический режим, следуя соответствующей ветви национального дерева фокусов."
 RULE_HISTORICAL_ETH_AI_DESC:0 "Эфиопский ИИ попытается победить Италию при помощи Лиги Наций, а в случае неудачи уйдёт в изгнание. Затем он постарается вернуть родные территории и восстановить Эфиопию."
 RULE_OPTION_ETH_IMPERIAL:0 "Имперский путь: лев стоит твёрдо"
 RULE_ETH_IMPERIAL_AI_DESC:0 "Эфиопский ИИ попытается самостоятельно победить Италию без помощи Лиги Наций, а затем расширить империю."
 RULE_OPTION_ETH_STALINIST_desc:0 "ИИ попытается превратить Эфиопию в коммунистическую страну, заручиться поддержкой Советского Союза и стать сталинской марионеткой."
 RULE_OPTION_ETH_STALINIST:0 "Коммунизм: советская помощь"
 RULE_OPTION_ETH_ANARCHIST:0 "Анархо-коммунизм: призыв ко всему миру"
 RULE_OPTION_ETH_ANARCHIST_desc:0 "ИИ попытается превратить Эфиопию в анархо-коммунистическую федерацию при поддержке коммунистов и анархистов со всего мира."
 RULE_OPTION_ETH_COLLABORATIONIST:0 "Фашизм: коллаборационизм"
 RULE_OPTION_ETH_COLLABORATIONIST_desc:0 "ИИ предаст Хайле Селассие и встанет на сторону итальянцев, превратив Эфиопию в фашистскую марионетку."
 RULE_OPTION_ETH_INDEPENDENT_FASCIST:0 "Фашизм: независимость"
 RULE_OPTION_ETH_INDEPENDENT_FASCIST_desc:0 "ИИ предаст Хайле Селассие и встанет на сторону итальянцев, превратив Эфиопию в фашистскую марионетку. Однако затем он попытается освободиться и создать независимую фашистскую страну."
 RULE_HISTORICAL_SWI_AI_DESC:0 "Швейцария сохранит нейтралитет, укрепляя ополчение и фортификации на случай нападения. Ближе к концу войны она окажет Союзникам ограниченную поддержку."
 RULE_OPTION_SWI_ALLIED_DEMOCRATIC:0 "Демократия на стороне Союзников"
 RULE_OPTION_SWI_ALLIED_DEMOCRATIC_AI_DESC:0 "ИИ вооружит Швейцарию и подготовит её к войне, сблизит с демократическими державами и в итоге откажется от нейтралитета в пользу Союзников."
 RULE_OPTION_SWI_EXPANSIONIST_DEMOCRATIC:0 "Экспансионистская демократия"
 RULE_OPTION_SWI_EXPANSIONIST_DEMOCRATIC_AI_DESC:0 "ИИ попытается убедить соседние со Швейцарией регионы вступить в конфедерацию и вооружит страну на случай отказа их владельцев предоставить им свободу."
 RULE_OPTION_SWI_IMPERIAL:0 "Имперский путь"
 RULE_OPTION_SWI_IMPERIAL_AI_DESC:1 "ИИ попытается создать Альпийский протекторат, отказавшись от нейтралитета и демократии в пользу милитаристского и экспансионистского режима."
 RULE_OPTION_SWI_FASCIST:1 "Фашизм"
 RULE_OPTION_SWI_FASCIST_AI_DESC:1 "ИИ сблизит Швейцарию с Германией и постепенно превратит страну в фашистскую, после чего она вступит в Ось или станет германской марионеткой."
 RULE_OPTION_MONARCHIST_ALB_AI_DESC:0 "Власть Зогу станет конституционной, и страна подготовится к войне, хотя эти приготовления так и не будут использованы."
 RULE_OPTION_COMMUNIST_ALB_AI_DESC:0 "Коммунисты попытаются свергнуть и убить короля."
 RULE_OPTION_FASCIST_ALB_AI_DESC:0 "Власть Зогу будет ещё сильнее укреплена."
 RULE_OPTION_DEMOCRATIC_ALB_AI_DESC:0 "Король Зогу будет изгнан, а итальянское влияние отвергнуто."
 RULE_GROUP_GENERAL_UI:0 "Интерфейс"
 OBSOLETE_FOCUS_BRANCHES_VISIBILITY:0 "Показывать устаревшие ветви в дереве фокусов"
 RULE_OPTION_HIDE:0 "Скрывать"
 RULE_OPTION_HIDE_DESC:0 "Некоторые устаревшие ветви будут скрываться при соответствующих обстоятельствах для упрощения навигации по дереву фокусов."
 RULE_OPTION_SHOW:0 "Показывать"
 RULE_OPTION_SHOW_DESC_DESC:0 "Устаревшие ветви всегда будут оставаться видимыми в дереве фокусов."
 LON_NON_INTERFERENCE_RESOLUTION_CALL:0 "[FROM.GetNameDefCap] нельзя призвать из-за резолюции Лиги Наций о невмешательстве"
 LON_NON_INTERFERENCE_RESOLUTION_JOIN:0 "Вы не можете вступить в войну на стороне [FROM.GetNameDef] из-за резолюции Лиги Наций о невмешательстве"
 RULE_VOLUNTEERS_ETHIOPIA_ONLY_ONE_TT:0 "Сейчас вы можете отправлять добровольческие части только в [ETH.GetName]"
 POL_surprise_attack_shock_idea_CALL:0 "Лидер вашего альянса решил не помогать [FROM.GetNameDef] защищаться от [SOV.GetAdjective] стороны."
 POL_surprise_attack_shock_idea_JOIN:0 "[FROM.GetNameDefCap] нельзя призвать, поскольку лидер альянса решил не помогать в защите от [SOV.GetAdjective] стороны."
 RULE_GROUP_PEACE_SCORE:0 "Распределение очков мирной конференции"
 PEACE_SCORE_TO_OVERLORD:0 "Очки марионеток сюзерену"
 RULE_OPTION_PEACE_SCORE_TO_OVERLORD_YES_DESC:0 "Марионетки передают часть очков мирной конференции своему сюзерену. Доля зависит от уровня автономии."
 RULE_OPTION_PEACE_SCORE_TO_OVERLORD_NO_DESC:0 "Марионетки сохраняют все очки мирной конференции, заработанные во время войны."
 PEACE_SCORE_TO_FACTION_LEADER:0 "Очки участников альянса лидеру"
 RULE_OPTION_PEACE_SCORE_TO_FACTION_LEADER_YES_DESC:0 "Участники альянса передают 10% своих очков мирной конференции лидеру альянса."
 RULE_OPTION_PEACE_SCORE_TO_FACTION_LEADER_NO_DESC:0 "Участники альянса сохраняют все очки мирной конференции, заработанные во время войны."
 PEACE_SCORE_RESET_LOW_SCORES:0 "Перераспределять малые доли"
 RULE_OPTION_PEACE_SCORE_RESET_LOW_SCORES_YES_DESC:0 "Победители с участием в войне менее 5% передают все свои очки другим победителям.\nНе применяется, если ни один победитель не имеет хотя бы 10% участия в войне.\nНе применяется к игрокам-людям."
 RULE_OPTION_PEACE_SCORE_RESET_LOW_SCORES_NO_DESC:0 "Все победители сохраняют все очки мирной конференции, заработанные во время войны."
 RULE_HISTORICAL_SWE_AI_DESC:0 "ИИ попытается развивать шведские вооружённые силы, сохраняя нейтралитет и демократию. Он будет осторожно избегать конфликтов с Осью и Коминтерном, но позднее может оказать Союзникам ограниченную поддержку."
 RULE_OPTION_SWE_DEM_ALT:0 "Альтернативная демократия"
 RULE_OPTION_SWE_DEM_ALT_DESC:0 "Шведский ИИ пойдёт по демократической ветви, но будет активнее вовлекаться в войну, быстрее перевооружаясь и склоняясь к более правой политике."
 RULE_OPTION_SWE_COMMUNISM:0 "Коммунизм"
 RULE_OPTION_SWE_COMMUNISM_DESC:0 "Шведский ИИ пойдёт по коммунистической ветви и заключит союз либо с Осью, либо с Союзниками."
 RULE_OPTION_SWE_FASCIST_INDEPENDENT:0 "Независимый фашизм"
 RULE_OPTION_SWE_FASCIST_INDEPENDENT_DESC:0 "Шведский ИИ пойдёт по фашистской ветви, сохранит независимость и попытается создать Великое Северное королевство."
 RULE_OPTION_SWE_FASCIST_PUPPET:0 "Покорный фашистский рейхскомиссариат"
 RULE_OPTION_SWE_FASCIST_PUPPET_DESC:0 "Шведский ИИ пойдёт по фашистской ветви, подчинится Германии и сохранит верность своему сюзерену."
 RULE_OPTION_SWE_FASCIST_PUPPET_BACKSTABBER:0 "Предательский фашистский рейхскомиссариат"
 RULE_OPTION_SWE_FASCIST_PUPPET_BACKSTABBER_DESC:0 "Шведский ИИ пойдёт по фашистской ветви, подчинится Германии, но освободится от неё в подходящий момент."
 RULE_OPTION_SWE_UNALIGNED:0 "Монархизм"
 RULE_OPTION_SWE_UNALIGNED_DESC:0 "Шведский ИИ пойдёт по нейтральной ветви, вернёт королю власть и попытается создать Великое Северное королевство."
 RULE_OPTION_SWE_DEMOCRATIC_NORDIC_DEFENCE_COUNCIL:0 "Северный оборонительный совет"
 RULE_OPTION_SWE_DEMOCRATIC_NORDIC_DEFENCE_COUNCIL_DESC:0 "ИИ попытается создать Северный оборонительный совет для защиты стран Севера."
 RULE_OPTION_NOR_STALINIST:0 "Сталинизм"
 RULE_OPTION_NOR_STALINIST_AI_DESC:0 "ИИ попытается повысить популярность коммунизма и сблизить Норвегию со сталинским Советским Союзом либо с крупнейшей нетроцкистской коммунистической страной, если Сталин был свергнут."
 RULE_OPTION_NOR_TROSTSKYIST:0 "§RR§! Троцкизм"
 RULE_OPTION_NOR_TROSTSKYIST_AI_DESC:0 "ИИ попытается оставить Льва Троцкого в Норвегии и следовать его коммунистическим принципам, выступая против Советского Союза, если тот останется сталинским, и вступая с ним в союз, если Троцкий станет его лидером.\n\n§RR§! несовместим с деревом Road to 56. Если выбрать этот вариант при активном дереве или без дополнения Arms Against Tyranny, ИИ получит случайный вариант."
 RULE_OPTION_NOR_FASCIST:0 "Фашизм"
 RULE_OPTION_NOR_FASCIST_AI_DESC:0 "ИИ позволит влиянию фашизма постепенно расти и в итоге сблизится с Третьим рейхом либо с крупнейшей фашистской страной, если Германия перестанет быть фашистской."
 RULE_OPTION_NOR_MONARCHIST:0 "Монархизм"
 RULE_OPTION_NOR_MONARCHIST_AI_DESC:0 "ИИ начнёт давить на короля Хокона VII, чтобы тот распустил стортинг и превратил Норвегию в олигархическую монархию."
 RULE_HISTORICAL_FIN_AI_DESC:0 "Финский ИИ постарается как можно точнее следовать исторической цепочке событий."
 RULE_HISTORICAL_DEN_AI_DESC:0 "Датский ИИ попытается избегать любых конфликтов и как можно точнее следовать историческим событиям. Если страна станет субъектом, он будет постепенно заручаться поддержкой иностранных держав, чтобы впоследствии вновь обрести независимость."
 RULE_OPTION_DEN_REARMAMENT:0 "§RR§!§GS§! Перевооружение Дании"
 RULE_OPTION_DEN_REARMAMENT_AI_DESC:0 "Дания попытается заключить союзы с более сильными странами и противостоять любым попыткам вторжения.\n\n§RR§! несовместим с деревом Road to 56. Если выбрать этот вариант при активном дереве или без дополнения Arms Against Tyranny, ИИ получит случайный вариант."
 RULE_OPTION_DEN_MONARCHIST:0 "§GR§!§GS§! Монархизм"
 RULE_OPTION_DEN_MONARCHIST_AI_DESC:0 "Король Кристиан X распустит правительство и возьмёт абсолютную власть.\n\n§GR§! §Gполностью§! совместим с выбранным деревом фокусов Road to 56.\n\n§GS§! §Gполностью§! совместим с выбранным деревом фокусов из дополнения."
 RULE_OPTION_DEN_FASCIST:0 "§GR§!§GS§! Фашизм"
 RULE_OPTION_DEN_FASCIST_AI_DESC:0 "Фашистская партия попытается захватить власть в Дании и восстановить древнюю Империю Северного моря.\n\n§GR§! §Gполностью§! совместим с выбранным деревом фокусов Road to 56.\n\n§GS§! §Gполностью§! совместим с выбранным деревом фокусов из дополнения."
 RULE_HISTORICAL_ICE_AI_DESC:0 "Исландский ИИ попытается сохранить нейтралитет и при необходимости обратиться за защитой к США."
 RULE_OPTION_ICE_SUPPORT:0 "Поддержать Данию"
 RULE_OPTION_ICE_SUPPORT_AI_DESC:0 "Исландский ИИ попытается поддержать оборону Дании от любого агрессора."
 RULE_OPTION_ICE_FASCIST:0 "Фашизм"
 RULE_OPTION_ICE_FASCIST_AI_DESC:0 "Исландский ИИ отречётся от датского короля и попытается создать фашистскую империю в Северном море."
 RULE_OPTION_ICE_COMMUNIST:0 "Коммунизм"
 RULE_OPTION_ICE_COMMUNIST_AI_DESC:0 "Исландский ИИ отвергнет монархию и установит в Исландии коммунистический режим."
 RULE_HISTORICAL_NOR_AI_DESC:0 "Норвегия попытается сохранить демократию и сопротивляться германскому вторжению, а после поражения продолжит борьбу вместе с Союзниками как правительство в изгнании."
 RULE_OPTION_HISTORICAL_PAR_AI_DESC:0 "ИИ не будет вмешиваться в мировую политику и сосредоточится на внутренних проблемах, переживая нестабильность, которая удержит страну от войны."
 RULE_OPTION_COMMUNIST_PAR_AI_DESC:0 "ИИ сохранит коммунистическое правительство Рафаэля Франко и попытается отомстить Боливии за Чакскую войну."
 RULE_OPTION_COMMUNIST_PAR_AI:0 "Коммунизм"
 RULE_OPTION_DEMOCRATIC_PAR_AI_DESC:0 "ИИ выступит против переворота Рафаэля Франко и вступит в гражданскую войну, пытаясь сохранить демократическое правительство."
 RULE_OPTION_DEMOCRATIC_PAR_AI:0 "Демократия"
 RULE_OPTION_MONARCHIST_ALCANTARA:0 "Монархизм — дон Педру де Алкантара"
 RULE_OPTION_MONARCHIST_ALCANTARA_DESC:0 "ИИ попытается восстановить Бразильскую империю, заручившись поддержкой Педру де Алкантары как законного наследника престола. Затем он постарается воссоединиться с Португалией дипломатическим путём или силой."
 RULE_OPTION_BRA_COMMUNIST_STALINISM:0 "Коммунизм — Луис Карлос Престес"
 RULE_OPTION_BRA_COMMUNIST_STALINISM_DESC:0 "Бразилия попытается свергнуть демократическое правительство и заменить его просоветским коммунистическим режимом во главе с Луисом Карлосом Престесом. Затем она вступит в Коминтерн и поможет Советскому Союзу."
 RULE_OPTION_BRA_COMMUNIST_INDEPENDENT:0 "Коммунизм — Национально-освободительный альянс"
 RULE_OPTION_BRA_COMMUNIST_INDEPENDENT_DESC:0 "Бразилия возродит НОА и попытается свергнуть демократическое правительство. Его заменит совет НОА, который проведёт коммунистические реформы, а затем постарается освободить континент от фашизма и империализма."
 COG_AI_BEHAVIOR:0 "@COG Бельгийское Конго"
 RULE_OPTION_HISTORICAL_COG_AI_DESC:0 "Конголезский ИИ останется с Бельгией и постарается максимально использовать отношения с ней, а затем добьётся расширения автономии."
 RULE_OPTION_COG_DEM_INDEPENDENCE_AI:0 "Демократические движения за освобождение"
 RULE_OPTION_COG_DEM_INDEPENDENCE_AI_DESC:0 "Конголезский ИИ постарается как можно скорее мирным путём добиться независимости, а затем будет продвигать демократию по всей Африке."
 RULE_OPTION_COG_COM_INDEPENDENCE_AI:0 "Коммунистические движения за освобождение"
 RULE_OPTION_COG_COM_INDEPENDENCE_AI_DESC:0 "Конголезский ИИ постарается как можно скорее мирным путём добиться независимости, а затем распространить коммунизм по всей Африке."
 RULE_OPTION_COG_COM_REVOLUTION_AI:0 "Революция симба"
 RULE_OPTION_COG_COM_REVOLUTION_AI_DESC:0 "Конголезский ИИ попытается освободиться от колониальных хозяев через насильственную революцию и последующую гражданскую войну, а затем распространить коммунизм по всему Африканскому континенту."
 RULE_OPTION_HISTORICAL_AUS_AI_DESC:0 "ИИ перейдёт к фашизму и попытается предотвратить аншлюс под руководством Отечественного фронта."
 RULE_OPTION_MONARCHIST_PUPPET_AUS_AI:0 "Монархизм — подчинение"
 RULE_OPTION_MONARCHIST_PUPPET_AUS_AI_DESC:0 "ИИ попытается восстановить Австро-Венгерскую империю, перестроив армию и потребовав подчинения стран, занимающих её прежние земли."
 RULE_OPTION_MONARCHIST_ANNEX_AUS_AI:0 "Монархизм — аннексия"
 RULE_OPTION_MONARCHIST_ANNEX_AUS_AI_DESC:0 "ИИ попытается восстановить Австрийскую империю, перестроив армию, а затем расширившись и аннексировав утраченные территории."
 RULE_OPTION_AUS_NEUTRALITY_FEDERATIVE_AI:0 "Нейтральная федерация"
 RULE_OPTION_AUS_NEUTRALITY_FEDERATIVE_AI_DESC:0 "ИИ попытается создать Дунайскую федерацию, пригласив другие страны вдоль Дуная под нейтральное правление."
 RULE_OPTION_AUS_COMMUNIST_SOV_ALIGNED_AI:0 "Советская Австрия"
 RULE_OPTION_AUS_COMMUNIST_SOV_ALIGNED_AI_DESC:0 "ИИ попытается перейти к коммунизму, свергнуть правительство, сблизиться с СССР и вступить в Коминтерн."
 RULE_OPTION_AUS_COMMUNIST_AI:0 "Коммунизм"
 RULE_OPTION_AUS_COMMUNIST_AI_DESC:0 "ИИ попытается перейти к коммунизму и свергнуть правительство. Придерживаясь строгой австромарксистской программы, он создаст собственный альянс."
 RULE_OPTION_AUS_DEMOCRATIC_FEDERATIVE_AI:0 "Австрийская демократия — федерация"
 RULE_OPTION_AUS_DEMOCRATIC_FEDERATIVE_AI_DESC:0 "ИИ попытается создать Дунайскую федерацию, пригласив другие страны вдоль Дуная под демократическое правление."
 RULE_OPTION_AUS_DEMOCRATIC_ALLIES_AI:0 "Австрийская демократия — Союзники"
 RULE_OPTION_AUS_DEMOCRATIC_ALLIES_AI_DESC:0 "ИИ попытается вступить в Союзники, восстановив демократию в Австрии."
 RULE_OPTION_AUS_DEMOCRATIC_ALPINE_FEDERATION_AI:0 "Австрийская демократия — Альпийская федерация"
 RULE_OPTION_AUS_DEMOCRATIC_ALPINE_FEDERATION_AI_DESC:0 "ИИ попытается восстановить демократию в Австрии и создать Альпийскую федерацию."
 RULE_OPTION_AUS_ANTI_ANSCLUSS_STRESS_AI:0 "Альтернативный исторический путь — Östfrei!"
 RULE_OPTION_AUS_ANTI_ANSCLUSS_STRESS_AI_DESC:0 "ИИ в основном последует историческому пути, но будет всеми средствами пытаться предотвратить аншлюс, до конца сражаясь за независимость. Это может осложнить или отложить начало войны."
 RULE_OPTION_MONARCHIST_PHI_AI_DESC:0 "На Филиппинах результаты выборов будут отменены, и власть перейдёт к $PHI_neutrality_party_long$. Позднее страна начнёт войну за независимость при поддержке дружественных испаноязычных стран и станет монархией."
 RULE_OPTION_INDEPENDENCE_FAS:0 "Императорская божественность"
 RULE_OPTION_INDEPENDENCE_FAS_MAN_AI_DESC:0 "Маньчжурский ИИ попытается обрести независимость и захватить весь Китай и Внешнюю Маньчжурию, следуя соответствующей ветви национального дерева фокусов."
 RULE_OPTION_INDEPENDENCE_NEU:0 "Новая конституция"
 RULE_OPTION_INDEPENDENCE_NEU_MAN_AI_DESC:0 "Маньчжурский ИИ попытается обрести независимость и захватить весь Китай в качестве конституционной монархии, следуя соответствующей ветви национального дерева фокусов."
 RULE_OPTION_INDEPENDENCE_DEM:0 "Новое Бэйянское правительство"
 RULE_OPTION_INDEPENDENCE_DEM_MAN_AI_DESC:0 "Маньчжурский ИИ попытается обрести независимость и принять роль нового Бэйянского правительства, следуя соответствующей ветви национального дерева фокусов."
