 RULE_OPTION_ALWAYS_FREE:0 "Всегда свободно"
 RULE_ALLOW_WARGOALS_ALWAYS_FREE_DESC:0 "Без ограничений для любой идеологии при любом уровне мировой напряжённости."
 RULE_OPTION_LIMITED:0 "Ограниченно"
 RULE_ALLOW_WARGOALS_LIMITED_DESC:0 "Создание целей войны ограничено идеологией и уровнем мировой напряжённости."
 RULE_OPTION_FREE_25:0 "Свободно при 25% мировой напряжённости"
 RULE_OPTION_FREE_50:0 "Свободно при 50% мировой напряжённости"
 RULE_OPTION_FREE_75:0 "Свободно при 75% мировой напряжённости"
 RULE_OPTION_FREE_100:0 "Свободно при 100% мировой напряжённости"
 RULE_ALLOW_WARGOALS_FREE_25_DESC:1 "Создание целей войны недоступно при мировой напряжённости ниже 25%, но после достижения этого уровня становится доступно всем странам. Это отменяет идеологические ограничения, но по-прежнему позволяет получать цели войны через фокусы."
 RULE_ALLOW_WARGOALS_FREE_50_DESC:1 "Создание целей войны недоступно при мировой напряжённости ниже 50%, но после достижения этого уровня становится доступно всем странам. Это отменяет идеологические ограничения, но по-прежнему позволяет получать цели войны через фокусы."
 RULE_ALLOW_WARGOALS_FREE_75_DESC:1 "Создание целей войны недоступно при мировой напряжённости ниже 75%, но после достижения этого уровня становится доступно всем странам. Это отменяет идеологические ограничения, но по-прежнему позволяет получать цели войны через фокусы."
 RULE_ALLOW_WARGOALS_FREE_100_DESC:1 "Создание целей войны недоступно при мировой напряжённости ниже 100%, но после достижения этого уровня становится доступно всем странам. Это отменяет идеологические ограничения, но по-прежнему позволяет получать цели войны через фокусы."
 RULE_OPTION_FOCUSES_ONLY:0 "Только фокусы"
 RULE_ALLOW_WARGOALS_FOCUSES_ONLY_DESC:0 "Цели войны можно получать только через национальные фокусы, события и решения."
 RULE_OPTION_FOCUSES_ONLY_38:0 "Только фокусы (до 1938 года)"
 RULE_ALLOW_WARGOALS_FOCUSES_ONLY_38_DESC:0 "До 1938 года цели войны можно получать только через национальные фокусы, события и решения."
 RULE_OPTION_FOCUSES_ONLY_39:0 "Только фокусы (до 1939 года)"
 RULE_ALLOW_WARGOALS_FOCUSES_ONLY_39_DESC:0 "До 1939 года цели войны можно получать только через национальные фокусы, события и решения."
 RULE_OPTION_FOCUSES_ONLY_40:0 "Только фокусы (до 1940 года)"
 RULE_ALLOW_WARGOALS_FOCUSES_ONLY_40_DESC:0 "До 1940 года цели войны можно получать только через национальные фокусы, события и решения."
