 RULE_OPTION_DEMOCRATIC_ENG_AI_DESC:0 "Британский ИИ попытается защитить Польшу и возглавить Союзников в оборонительной войне против Германии, следуя соответствующей ветви национального дерева фокусов."
 RULE_OPTION_TRADE_UNIONS:0 "Пойти на уступки профсоюзам"
 RULE_OPTION_TRADE_UNIONS_ENG_AI_DESC:0 "Британский ИИ попытается пойти на уступки профсоюзам и перейти к коммунизму, следуя соответствующей ветви национального дерева фокусов."
 RULE_OPTION_THE_KINGS_PARTY:0 "Усилить Королевскую партию"
 RULE_OPTION_THE_KINGS_PARTY_ENG_AI_DESC:0 "Британский ИИ попытается поддержать брак короля Эдуарда VIII с Уоллис Симпсон и усилить Королевскую партию, следуя соответствующей ветви национального дерева фокусов."
 RULE_OPTION_DEMOCRATIC_NO_MORE_APPEASEMENT:0 "Больше никакого умиротворения"
 RULE_OPTION_DEMOCRATIC_NO_MORE_APPEASEMENT_ENG_AI_DESC:0 "Британский ИИ попытается отказаться от политики умиротворения и заменить её демократическим интервенционизмом, следуя соответствующей ветви национального дерева фокусов."
 RULE_OPTION_ORGANIZE_THE_BLACKSHIRTS:0 "Организовать чернорубашечников"
 RULE_OPTION_ORGANIZE_THE_BLACKSHIRTS_ENG_AI_DESC:0 "Британский ИИ попытается организовать чернорубашечников и перейти к фашизму, следуя соответствующей ветви национального дерева фокусов."
 RULE_OPTION_DEMOCRATIC_HISTORICAL_HOL_AI_DESC:0 "Нидерландский ИИ попытается вступить в Союзники после вторжения, но не станет переносить правительство в Ост-Индию, следуя соответствующей ветви национального дерева фокусов."
 RULE_OPTION_LEGACY_OF_THE_DE_ZEVEN_PROVINCIEN_MUTINY:0 "Наследие мятежа «Де Зевен Провинсиен»"
 RULE_OPTION_LEGACY_OF_THE_DE_ZEVEN_PROVINCIEN_MUTINY_HOL_AI_DESC:0 "Нидерландский ИИ попытается возродить наследие мятежа «Де Зевен Провинсиен» и перейти к коммунизму, следуя соответствующей ветви национального дерева фокусов."
 RULE_OPTION_ORANJE_BOVEN:0 "Оранье бовен"
 RULE_OPTION_ORANJE_BOVEN_HOL_AI_DESC:0 "Нидерландский ИИ попытается поддержать монархизм и привести к власти королеву Вильгельмину, следуя соответствующей ветви национального дерева фокусов."
 RULE_OPTION_DEMOCRATIC_CONTINUE_THE_WAR_IN_BATAVIA:0 "Продолжить войну в Батавии"
 RULE_DEMOCRATIC_CONTINUE_THE_WAR_IN_BATAVIA_HOL_AI_DESC:0 "Нидерландский ИИ попытается сохранить демократию, но после капитуляции перенесёт столицу в Батавию, следуя соответствующей ветви национального дерева фокусов."
 RULE_OPTION_DEMOCRATIC_CONTINUE_THE_ZUIDERZEE_WORKS:0 "Продолжить работы в Зёйдерзе"
 RULE_DEMOCRATIC_CONTINUE_THE_ZUIDERZEE_WORKS_HOL_AI_DESC:0 "Нидерландский ИИ попытается сохранить демократию, но сосредоточится на укреплении европейской территории вместо колоний, следуя соответствующей ветви национального дерева фокусов."
 RULE_OPTION_CAVE_TO_THE_GERMANS:0 "Уступить Германии"
 RULE_CAVE_TO_THE_GERMANS_HOL_AI_DESC:0 "Нидерландский ИИ попытается уступить Германии в торговой войне и после перехода к фашизму заключить с ней союз, следуя соответствующей ветви национального дерева фокусов."
 RULE_OPTION_DEMOCRATIC_LEAD_THE_MINOR_DEMOCRACIES:0 "Возглавить малые демократии"
 RULE_DEMOCRATIC_LEAD_THE_MINOR_DEMOCRACIES_HOL_AI_DESC:0 "Нидерландский ИИ попытается сохранить демократию и возглавить малые демократии Европы в создании Европейского союза, следуя соответствующей ветви национального дерева фокусов."
 RULE_OPTION_SECULAR_REPUBLIC:0 "Светская республика"
 RULE_OPTION_SECULAR_REPUBLIC_DESC:0 "В Мексике усилятся умеренный секуляризм и верховенство закона, а страна будет ориентироваться на Соединённые Штаты."
 RULE_OPTION_SOCIAL_CATHOLICISM:0 "Социальный католицизм"
 RULE_OPTION_SOCIAL_CATHOLICISM_DESC:0 "Умеренные реформаторы Католической церкви заключат новый конкордат в Мексике, положат конец общественным конфликтам тоталитарной эпохи и сблизят страну с Великобританией."
 RULE_OPTION_FASCIST_DICTATORSHIP:0 "Фашистская диктатура"
 RULE_OPTION_FASCIST_DICTATORSHIP_DESC:0 "Плутарко Кальес, Сатурнино Седильо и другие военные вожди пресекут зарождающуюся демократию Мексики и сблизят страну с Германией."
 RULE_OPTION_THEOCRATIC_ORDER:0 "Теократический порядок"
 RULE_OPTION_THEOCRATIC_ORDER_DESC:0 "Синархисты и кристерос захватят власть в Мексике и создадут новый латиноамериканский порядок, чтобы очистить континент от еретиков."
 RULE_OPTION_SOVIET_REPUBLIC:0 "Советская республика"
 RULE_OPTION_SOVIET_REPUBLIC_DESC:0 "Мексика сблизится с Советским Союзом и на штыках распространит революцию по Латинской Америке."
 RULE_OPTION_CARDENISMO:0 "Карденизм"
