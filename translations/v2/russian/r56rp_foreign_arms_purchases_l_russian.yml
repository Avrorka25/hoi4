 r56rp_foreign_arms_purchases.1.t:0 "[FROM.GetNameDefCap] хочет приобрести оружие"
 r56rp_foreign_arms_purchases.1.desc:0 "отмечая быстрое ухудшение ситуации во всем мире, [From.GetAdjective] Официальные лица обратились к нам с просьбой о приобретении экспортных лицензий на легкое и тяжелое вооружение с заказами, которые будут размещены на наших заводах, как только эти лицензии будут предоставлены. В то время как общий объем заказов слишком низок, чтобы заметно изменить ситуацию в экономике, он все равно создаст немало рабочих мест."
 r56rp_foreign_arms_purchases.1.a:0 "Мы одобрим экспорт вооружений."
 r56rp_foreign_arms_purchases.1.a.tt:0 "Мы позволим экспорту материальных средств [FROM.GetNameDefCap]"
 r56rp_foreign_arms_purchases.1.b:0 "Вежливо отказываются от экспорта оружия."
 r56rp_foreign_arms_purchases.1.b.tt:0 "Мы откажемся от экспорта оружия в настоящее время, но оставим возможность снова попросить нас об этом."
 r56rp_foreign_arms_purchases.1.c:0 "§RАбсолютли нет, занеси их в черный список!§!"
 r56rp_foreign_arms_purchases.1.c.tt:0 "Мы отказываемся продавать оружие. [FROM.GetNameDefCap] А также запретить им задавать нам вопросы в будущем.§RЭто действие является вечным.§!"
 r56rp_foreign_arms_purchases.2.t:0 "[FROM.GetNameDefCap] Отказывается от продажи своего оружия"
 r56rp_foreign_arms_purchases.2.desc:0 "отмечая быстрое ухудшение ситуации во всем мире, [From.GetAdjective] Официальные лица заявили, что продажа оружия не будет разрешена из-за растущей необходимости вооружать своих собственных военных лучшим оружием."
 r56rp_foreign_arms_purchases.2.a:0 "Так и быть."
 r56rp_foreign_arms_purchases.3.t:0 "[FROM.GetNameDefCap] Он запретил нам покупать любое оружие."
 r56rp_foreign_arms_purchases.3.desc:0 "[From.GetAdjective] По его словам, экспорт оружия невозможен ни сейчас, ни в будущем. Они попросили нас воздержаться от повторного запроса."
 r56rp_foreign_arms_purchases.3.a:0 "Так и быть."
 r56rp_foreign_arms_purchases.4.t:0 "[FROM.GetNameDefCap] Прекратить экспорт оружия."
 r56rp_foreign_arms_purchases.4.desc:0 "[From.GetAdjective] Дипломаты сообщили нам, что они прекращают действие нашего соглашения о торговле оружием. Любые заказы, которые еще не выполнены, будут выполнены [THIS.capital.GetName] После чего больше заказов приниматься не будет."
 r56rp_foreign_arms_purchases.4.a:0 "Так и быть."
 r56rp_foreign_arms_purchases.5.t:0 "[FROM.GetNameDefCap] Прекратить импорт оружия."
 r56rp_foreign_arms_purchases.5.desc:0 "[From.GetAdjective] Дипломаты сообщили нам, что они прекращают действие нашего соглашения о торговле оружием. Они больше не будут покупать нашу военную технику."
 r56rp_foreign_arms_purchases.5.b:0 "Так и быть."
 gen_foreign_arms_accepted_tt:0 "§GМы сможем приобрести их оружие за разумную сумму.§!"
 if_they_accept_purchases_tt:0 "Если один из избранных §YКрупные нации§! принимает:"
 r56rp_purchase_foreign_weaponry:0 "Купить иностранное оружие"
