l_russian:
 FIN_carl_mannerheim_leader_desc:0 "Возможно, формально нашу страну возглавляет другой человек. Но перед лицом многочисленных угроз Финляндии именно Маннергейм принимает все решения и ведёт нас через эти мрачные дни."
 FIN_carl_mannerheim_leader_clear_desc:0 ""
 finnish_focus:0 "Национальные фокусы Финляндии"
 FIN_communism_sc:0 "Политика: коммунизм"
 FIN_historical_sc:0 "Политика: нейтралитет"
 FIN_fascism_sc:0 "Политика: фашизм"
 FIN_economy_sc:0 "Экономика"
 FIN_army_sc:0 "Армия"
 FIN_air_sc:0 "Военно-воздушные силы"
 FIN_navy_sc:0 "Военно-морской флот"
 fin_political_focus:0 "Обратиться к парламенту"
 fin_political_focus_desc:0 "Мир быстро меняется, появляются новые идеологии, и нам необходимо сосредоточиться на политике и определить, что лучше для нашего народа."
 fin_individual_freedom:0 "Продолжить курс на личную свободу"
 fin_individual_freedom_desc:0 "Наша страна пользуется многими свободами, доступными западным соседям. Следует и дальше придерживаться этого курса."
 fin_demofoc_desc:0 "Как и прежде, развитие демократии и личной свободы является лучшим выбором для нашего народа и страны."
 fin_neutralfoc:0 "Курс на нейтралитет"
 fin_neutralfoc_desc:0 "Отказ от союзов и нейтралитет в отношении зарубежных событий помогут сохранить безопасность страны, не раздражая великие державы и не ставя под угрозу выживание финского народа."
 fin_supportdemfoc:0 "Поддержать демократию"
 fin_supportdemfoc_desc:0 "Демократия — лучшая из доступных форм правления. Следует позволить появиться большему числу демократических партий."
 fin_mutualdefpactfoc:0 "Пакт о взаимной обороне"
 fin_mutualdefpactfoc_desc:0 "Мир подобен кипящему котлу, готовому взорваться в любой момент. Предложив Швеции пакт о взаимной обороне, мы обязуемся помогать друг другу в случае войны."
 fin_realtionsfoc:0 "Улучшить отношения с миром"
 fin_realtionsfoc_desc:0 "Важно улучшить отношения со всеми великими державами, чтобы сохранять добрые связи и избегать конфликтов."
 fin_interfoc:0 "Курс на интервенционизм"
 fin_interfoc_desc:0 "Некоторые страны угнетены диктаторскими режимами. Как демократия, мы обязаны вмешаться и освободить их народы."
 fin_ndafoc:0 "Северный оборонительный союз"
 fin_ndafoc_desc:0 "Поодиночке мы слабы, но вместе сильны. Следует заключить союз с другими северными странами и создать оборонительный блок для взаимной защиты."
 fin_diploallyfoc:0 "Укрепить связи с Западом"
 fin_diploallyfoc_desc:0 "Если мы хотим обезопасить себя, самым разумным решением будет укрепить отношения с Западом."
 fin_seekalliedhelpfoc:0 "Вступить в Союзники"
 fin_seekalliedhelpfoc_desc:0 "Британцы победили в Великой войне, и мы не сомневаемся, что в случае нового конфликта они вновь окажутся на стороне победителей."
 fin_ambadassorfoc:0 "Отношения с северными странами"
 fin_ambadassorfoc_desc:0 "Следует направить послов в другие северные страны и улучшить отношения с ними, если мы надеемся когда-нибудь создать союз."
 fin_invswefoc:0 "Пригласить Швецию"
 fin_invswefoc_desc:0 "Следует направить приглашение Швеции."
 fin_invnorfoc:0 "Пригласить Норвегию"
 fin_invnorfoc_desc:0 "Следует направить приглашение Норвегии."
 fin_invdenfoc:0 "Пригласить Данию"
 fin_invdenfoc_desc:0 "Следует направить приглашение Дании."
 fin_techsharingfoc:0 "Технологическое соглашение"
 fin_techsharingfoc_desc:0 "Если северные страны объединятся и подпишут соглашение о технологическом сотрудничестве, это принесёт пользу всем нам."
 fin_unitedscandfoc:0 "Объединить северные страны?"
 fin_unitedscandfoc_desc:0 "Вопрос об объединении северных и скандинавских стран обсуждается уже много лет. Стоит ли нам стать единым целым?"
 fin_integrate_iceland:0 "Пригласить Исландию в союз"
 fin_integrate_iceland_desc:0 "Объединение северных стран невозможно без последнего члена сообщества — Исландии. Мы предложим её правительству место в нашем совете в обмен на экономическую и промышленную интеграцию."
 fin_guardfoc:0 "Главная угроза"
 fin_guardfoc_desc:0 "Советы незаконно отняли у нас земли, и мы сомневаемся, что на этом они остановятся. Следует искать союзников против советской угрозы."
 fin_germantreatyfoc:0 "Сделка с дьяволом"
 fin_germantreatyfoc_desc:0 "Мы должны показать готовность к военному союзу с Германией против советской угрозы: предоставить ей право прохода войск и позволить создать базы на нашей территории."
 fin_gerequipmentfoc:0 "Немецкая военная помощь"
 fin_gerequipmentfoc_desc:0 "Немцы пообещали предоставить нам военные части в обмен на помощь в возможной будущей войне против Советского Союза."
 fin_continationfoc:0 "Война-продолжение"
 fin_stabinthebackfoc:0 "Московское перемирие"
 fin_stabinthebackfoc_desc:0 "Война складывается не в нашу пользу и не в пользу Германии. Следует попытаться договориться о мире, пока не стало слишком поздно."
 fin_joinaxifoc:0 "Вступить в Ось"
 fin_joinaxifoc_desc:0 "Пора сделать последний шаг к военному союзу с Германией и подписать Тройственный пакт."
 fin_greaterfoc:0 "Великая Финляндия"
 fin_greaterfoc_desc:0 "Если Финляндия хочет оставаться сильной страной, мы больше не можем идти на уступки иностранным державам. У нас будет страна для всего нашего народа — или мы погибнем, пытаясь её создать!"
 fin_deffoc:0 "Защитить Отечество"
 fin_deffoc_desc:0 "На случай иностранного вторжения следует сосредоточиться на строительстве укреплений и средств ПВО, чтобы облегчить оборону страны."
 fin_conscriptionfoc:0 "Всеобщая воинская повинность"
 fin_conscriptionfoc_desc:0 "Ради безопасности следует рассмотреть введение всеобщей воинской повинности и увеличить численность армии."
 fin_conscriptionfoc2:0 "Расширить систему призыва"
 fin_conscriptionfoc2_desc:0 "Ради безопасности следует увеличить призывной возраст и усовершенствовать систему мобилизации."
 fin_nationalismfoc:0 "Курс на национализм"
 fin_nationalismfoc_desc:0 "Наша страна принадлежит нам, и мы должны ею гордиться."
 fin_comfoc:0 "Левый курс"
 fin_comfoc_desc:0 "Пора покончить с капиталистами и фашистами — страна принадлежит народу."
 fin_techengfoc:0 "Британское технологическое соглашение"
 fin_techengfoc_desc:0 "Следует заключить с британцами соглашение о совместных исследованиях и разработках, выгодное обеим сторонам."
 fin_removeclaimfoc:0 "Соглашение с Советами"
 fin_removeclaimfoc_desc:0 "Началась вторая Великая война, а Советы незаконно требуют передать им Карелию. Следует решить вопрос дипломатически, чтобы сосредоточить усилия на Германии."
 fin_karjalafoc:0 "Карельский вопрос"
 fin_karjalafoc_desc:0 "Советский Союз оказывает сильное давление, требуя уступить Карелию. Чтобы избежать конфликта, следует согласиться."
 fin_britnavyfoc:0 "Помощь британского флота"
 fin_britnavyfoc_desc:0 "Британцы являются мастерами морской войны. Посетив их, наши адмиралы смогут изучить новые стратегии."
 fin_consprictfoc:0 "Чрезвычайный призыв"
 fin_consprictfoc_desc:0 "Мир становится всё опаснее. Следует ужесточить законы о призыве, чтобы обезопасить страну."
 fin_dowsovietfoc:0 "Советская угроза"
 fin_dowsovietfoc_desc:0 "Советы стали серьёзной помехой. Пора избавиться от них."
 fin_armedneutfoc:0 "Вооружённый нейтралитет"
 fin_armedneutfoc_desc:0 "Даже оставаясь нейтральными, мы должны вооружить народ на случай иностранного вторжения."
 fin_axisalliancefoc:0 "Союз с Осью"
 fin_axisalliancefoc_desc:0 "Союз с Германией и Осью защитит нас от большевиков и мелочной западной политики."
 fin_fascist_british_alliance:0 "Союз через моря"
 fin_fascist_british_alliance_desc:0 "Чтобы установить власть над Скандинавией, нам нужен сильный военно-морской союзник в регионе. Экономические связи и дипломатическое партнёрство с [ENG.GetName] можно превратить в официальный союз."
 FIN_push_towards_scandinavia:0 "Продвижение к Скандинавии"
 FIN_push_towards_scandinavia_desc:0 "Финские народы долгое время оставались за пределами нашей страны. Чтобы защитить культурное наследие братьев, необходимо продвинуть границы на север, в Скандинавию."
 FIN_the_dream_of_greater_finland_r56:0 "Мечта о Великой Финляндии"
 FIN_the_dream_of_greater_finland_r56_desc:0 "Финские народы потеряли слишком много законных земель. Захват Мурманска, Онеги и Олонца сократит восточную границу и обеспечит процветание наших братьев."
 fin_nazisovietfoc:0 "Операция «Барбаросса»"
 fin_nazisovietfoc_desc:0 "Никто не должен страдать от большевизма. Мы освободим русский народ!"
 fin_annexswefoc:0 "Судьба Швеции"
 fin_annexswefoc_desc:0 "Швеция располагает множеством ресурсов, необходимых нашей армии. Она станет первым важным шагом."
 fin_annexnorfoc:0 "Разобраться с Норвегией"
 fin_annexnorfoc_desc:0 "Северная Норвегия по праву принадлежит нам!"
 fin_annexdenfoc:0 "Дания и Балтийское море"
 fin_annexdenfoc_desc:0 "Дания контролирует вход флотов в Балтийское море. Обеспечение безопасности моря должно стать главным приоритетом."
 fin_annexicefoc:0 "Обезопасить Северное море"
 fin_annexicefoc_desc:0 "Видя слабость датского правительства, многочисленные националистические группы Исландии провозгласили независимость бывшей датской колонии. Эти необоснованные требования недопустимы! Наши торговые суда и конвои чувствуют угрозу со стороны новой силы в Северном море и требуют вмешательства для защиты позиций в регионе."
 fin_militarismfoc:0 "Финский милитаризм"
 fin_militarismfoc_desc:0 "Через силу приходит единство."
 fin_gertechsharingfoc:0 "Немецкое технологическое соглашение"
 fin_gertechsharingfoc_desc:0 "Немцы являются специалистами по бронетехнике. Следует попросить их направить экспертов для помощи в разработке наших машин."
 fin_germilhelpfoc:0 "Немецкий экспедиционный корпус"
 fin_germilhelpfoc_desc:0 "Следует попросить Германию направить экспедиционные войска."
 fin_greatfinfoc:0 "Финнизация"
 fin_greatfinfoc_desc:0 "Чтобы действительно создать Великую Финляндию, необходимо ассимилировать новые территории в финскую культуру."
 fin_swefinmilfoc:0 "Обмен военным опытом"
 fin_swefinmilfoc_desc:0 "Следует обмениваться военными специалистами со Швецией — это принесёт большую пользу обеим странам."
 fin_paramilitarism:0 "Парамилитаризм"
 fin_paramilitarism_desc:0 "Следует обучать гражданское население, чтобы оно могло помогать армии в случае войны."
 fin_revolutionfoc:0 "Революция"
 fin_revolutionfoc_desc:0 "Мелкая политика слишком долго мешала нам! Пришло время революции!"
 fin_restoreredguard:0 "Восстановить Красную гвардию"
 fin_restoreredguard_desc:0 "Если нам предстоит гражданская война против капиталистов, следует тайно восстановить Красную гвардию."
 fin_demcomunbanfoc:0 "Легализовать коммунизм"
 fin_demcomunbanfoc_desc:0 "Мы должны потребовать от правительства легализовать коммунизм!"
 fin_demandgovchange:0 "Потребовать выборов"
 fin_demandgovchange_desc:0 "Большинство поддерживает коммунистов! Необходимо немедленно потребовать выборов!"
 fin_indoctrination:0 "Идеологическая обработка"
 fin_indoctrination_desc:0 "Раз установлено, что наша идеология основана на истине, её следует преподавать как истину. Образование и средства массовой информации должны отражать этот принцип."
 fin_sovierelations:0 "Отношения с Советами"
 fin_sovierelations_deasc:0 "Революция началась в Советском Союзе, и нам следует улучшить отношения с ним."
 fin_jointhecomintern:0 "Коминтерн"
 fin_jointhecomintern_desc:0 "Чтобы защититься от зла фашизма, следует искать союза с Советами."
 fin_ourownway:0 "Собственный путь"
 fin_ourownway_desc:0 "Советы не знают, что такое настоящий коммунизм! Мы пойдём своим путём и не станем иметь дел с ложными коммунистами!"
 fin_wwrevol:0 "Мировая революция"
 fin_wwrevol_desc:0 "Мы создадим программу подготовки талантливых людей, которые распространят революцию по всему миру!"
 fin_norrevolution:0 "Балтийская революция"
 fin_norrevolution_desc:0 "У нас с балтийскими странами есть общее: ненависть к Советскому Союзу. Следует искать союза с ними."
 fin_nordicom:0 "Балтийский союз"
 fin_nordicom_desc:0 "Пора заключить союз с балтийскими странами ради взаимной защиты от СССР!"
 fin_sovietcomfoc:0 "Свергнуть ложных коммунистов!"
 fin_sovietcomfoc_desc:0 "Пора покончить с ложными коммунистами!"
 fin_banfascism:0 "Запретить фашизм"
 fin_banfascism_desc:0 "Фашистской мрази не место в нашей стране."
 fin_unholyalliance:0 "Нечестивый союз"
 fin_unholyalliance_desc:0 "Хотя население может быть против, союз с Советами отвечает нашим интересам."
 fin_takedownaxis:0 "Ось"
 fin_takedownaxis_desc:0 "Фашисты слишком долго хозяйничали. Пора им исчезнуть!"
 fin_propaganda:0 "Коммунистическая пропаганда"
 fin_propaganda_desc:0 "Следует усилить пропаганду, чтобы объединить народ."
 fin_armybuildup:0 "Укрепить финскую армию"
 fin_armybuildup_desc:0 "Наши военные технологии отстают от других стран. Следует сосредоточиться на модернизации и улучшении вооружённых сил."
 fin_modernizearmy:0 "Модернизировать армию"
 fin_modernizearmy_desc:0 "Модернизация стрелкового оружия — важный шаг."
 fin_defensivefoc:0 "Ставка на оборону"
 fin_defensivefoc_desc:0 "Мы не страна захватчиков и должны сосредоточиться на защите собственной территории."
 fin_offensive:0 "Ставка на наступление"
 fin_offensive_desc:0 "Говорят, лучшая защита — это нападение."
 fin_infantry:0 "Пехота — основа армии"
 fin_infantry_desc:0 "Пехота была и всегда будет основой любой армии."
 fin_armor:0 "Моторизовать армию"
 fin_armor_desc:0 "Обычной пехоты уже недостаточно. Для модернизации армии следует сделать ставку на быстрые механизированные войска."
 fin_foreigntanks:0 "Иностранные проекты танков"
 fin_foreigntanks_desc:0 "Импорт иностранных танковых проектов поможет нам создать собственные будущие образцы."
 fin_frencharty:0 "Импортировать французские артиллерийские проекты"
 fin_frencharty_desc:0 "У французов много специалистов по артиллерии. Следует обратиться к ним за помощью."
 fin_strategy:0 "Привлечь военных стратегов"
 fin_strategy_desc:0 "Следует сосредоточиться на привлечении бывших солдат с боевым опытом в качестве стратегов."
 fin_motti:0 "Тактика «мотти»"
 fin_motti_desc:0 "Используя леса для окружения и засад на врага, мы получим серьёзное преимущество."
 fin_blitzkrieg:0 "Изучить блицкриг"
 fin_blitzkrieg_desc:0 "Изучение немецкого блицкрига поможет разработать новые стратегии."
 fin_lessonsfrompoland:0 "Изучить польскую оборону"
 fin_lessonsfrompoland_desc:0 "Изучение обороны Польши против немецкого вторжения может дать ценные сведения."
 fin_resslot:0 "Финансировать военные исследования"
 fin_resslot_desc:0 "Дополнительное финансирование исследований и разработок повысит качество наших вооружённых сил."
 fin_qfpounder:0 "Импортировать британские 17-фунтовые орудия"
 fin_qfpounder_desc:0 "Британские 17-фунтовые орудия впечатляют. Следует импортировать их."
 fin_lessonsofwar:0 "Мобилизовать «Лотта Свярд»"
 fin_lessonsofwar_desc:0 "Мобилизовав женщин и организацию «Лотта Свярд», мы сможем заменить мужчин на производстве и высвободить больше солдат."
 fin_militarypropaganda:0 "Мобилизовать резервы"
 fin_militarypropaganda_desc:0 "Похоже, иностранное вторжение неизбежно. Нужно мобилизовать резервы, чтобы успеть подготовиться!"
 fin_mannherimline:0 "Линия Маннергейма"
 fin_mannherimline_desc:0 "Следует построить укрепления за реками, немного в стороне от Ленинграда, на наиболее выгодных оборонительных позициях."
 fin_salpa:0 "Линия Салпа"
 fin_salpa_desc:0 "Следует начать строительство пограничных укреплений на советской границе."
 fin_fortaland:0 "Укрепить Аландские острова"
 fin_fortaland_desc:0 "Аландские острова имеют важное значение и нуждаются в надёжной защите."
 fin_forthelsinki:0 "Укрепить Хельсинки"
 fin_forthelsinki_desc:0 "На случай морского вторжения необходимо укрепить столицу."
 fin_alandquestion:0 "Аландский вопрос"
 fin_alandquestion_desc:0 "Необходимо решить, что делать с Аландскими островами."
 fin_forts:0 "Улучшить строительство укреплений"
 fin_forts_desc:0 "Небольшой стране трудно обороняться, поэтому необходимо совершенствовать навыки строительства укреплений и создавать более прочные оборонительные линии."
 fin_guardthegulf:0 "Защитить залив"
 fin_guardthegulf_desc:0 "Залив играет важную роль в нашей обороне. Строительство радаров и авиабаз на побережье поможет его защищать."
 fin_militaryindstry:0 "Финансировать военную промышленность"
 fin_militaryindstry_desc:0 "Финансирование военной промышленности позволит производить больше снаряжения."
 fin_baltictrl:0 "Контролировать Балтику"
 fin_baltictrl_desc:0 "Строительство крупных кораблей позволит полностью контролировать море."
 fin_navy:0 "Финский военно-морской флот"
 fin_navy_desc:0 "Флот является важной частью нашей обороны. Следует расширять его, чтобы защищать Балтийское море и побережье."
 fin_molotov:0 "Коктейль Молотова"
 fin_molotov_desc:0 "Коктейли Молотова — импровизированное средство борьбы с танками. Если снабдить всех необходимыми материалами для их изготовления, наши противотанковые возможности возрастут."
 fin_panzerfaust:0 "Панцерфауст"
 fin_panzerfaust_desc:0 "Импорт немецких противотанковых гранатомётов «Панцерфауст» поможет бороться с вражескими танками."
 fin_suomikp31:0 "Финансировать новые проекты оружия"
 fin_suomikp31_desc:0 "Создание собственного вооружения важно, чтобы не зависеть от технологий других стран."
 fin_engineer:0 "Инженерные бригады"
 fin_engineer_desc:0 "Интеграция инженерных бригад в дивизии позволит им возводить гораздо более надёжные укреплённые позиции."
 fin_logistics:0 "Логистические бригады"
 fin_logistics_desc:0 "Если мы собираемся наступать, хорошо организованные линии снабжения необходимы."
 fin_rulethebaltic:0 "Господствовать в Балтийском море"
 fin_rulethebaltic_desc:0 "Вместо простой защиты конвоев и побережья следует сосредоточиться на строительстве флота, способного господствовать в Балтийском море."
 fin_skitroops:0 "Лыжные войска"
 fin_skitroops_desc:0 "Если придётся сражаться зимой, оснащение дивизий лыжами позволит им быстрее и эффективнее передвигаться по снегу."
 fin_defnavy:0 "Защитить Балтику"
 fin_defnavy_desc:0 "Из-за ограниченных промышленных возможностей следует сосредоточиться на эсминцах и подводных лодках для защиты конвоев и охоты на вражеские корабли и снабжение."
 fin_battleship:0 "Ставка на линкоры"
 fin_battleship_desc:0 "Пока теоретики спорят о превосходстве в воздухе и на море, никто не хочет видеть орудия линкора, наведённые на свой дворец. Даже если сторонники авианосцев в итоге окажутся правы, линкоры ещё долгие годы будут господствовать в океанах."
 fin_carrierfocus:0 "Ставка на авианосцы"
 fin_carrierfocus_desc:0 "В грядущих сражениях потребуется авиация, а самый практичный способ расширить её радиус действия — использовать авианосцы. Мы должны создавать более совершенные и специализированные модели."
 fin_heavycruisers:0 "Импортировать британские проекты"
 fin_heavycruisers_desc:0 "Британцы славятся мощным Королевским флотом. Доступ к их корабельным проектам принесёт нам большую пользу."
 fin_geruboats:0 "Немецкие подводные лодки"
 fin_geruboats_desc:0 "Немцы достигли мастерства в подводной войне. С их помощью мы сможем строить лучшие субмарины."
 fin_navydoctrine:0 "Военно-морские учения"
 fin_navydoctrine_desc:0 "Крупномасштабные морские учения дадут важный опыт ведения войны на море."
 fin_expandturku:0 "Расширить верфи Турку"
 fin_expandturku_desc:0 "В Турку уже есть внушительная верфь, но дальнейшее расширение позволит строить больше кораблей."
 fin_alandbases:0 "Защитить Аландские острова"
 fin_alandbases_desc:0 "Нельзя позволить врагам контролировать Аландские острова. Необходимо построить больше военно-морских баз."
 fin_ouluship:0 "Верфи Оулу"
 fin_ouluship_desc:0 "Оулу находится достаточно далеко от иностранных морских и воздушных баз. Строительство верфей там позволит надёжно их защитить."
 fin_destroyers:0 "Развитие эсминцев"
 fin_destroyers_desc:0 "Эсминцы — важная часть любого флота. Они необходимы для охоты на вражеские подводные лодки."
 fin_wolf:0 "Волчьи стаи"
 fin_wolf_desc:0 "Объединив подводные лодки в стаи, мы сможем наносить массированные удары по вражеским конвоям и нарушать их снабжение."
 fin_airforce:0 "Военно-воздушные силы Финляндии"
 fin_airforce_desc:0 "Будущее войны находится не на земле и не на море, а в небе. Необходимо создать более мощные военно-воздушные силы."
 fin_fighterfocus:0 "Импортировать «Фоккеры»"
 fin_fighterfocus_desc:0 "Нидерландские самолёты серии Fokker впечатляют и необходимы нашим ВВС."
 fin_bombers:0 "Иностранные проекты бомбардировщиков"
 fin_bombers_desc:0 "Бомбардировщики — важная часть любых ВВС. Покупка иностранных лицензий позволит выставить больше таких самолётов."
 fin_airbase:0 "Улучшенные авиабазы"
 fin_airbase_desc:0 "Для размещения постоянно растущих военно-воздушных сил потребуются дополнительные авиабазы."
 fin_bristol:0 "Импортировать «Бленхеймы»"
 fin_bristol_desc:0 "Новые британские Bristol Blenheim — полезные многоцелевые самолёты, которые помогут разработать наши собственные машины такого типа. Следует предложить Соединённому Королевству продать нам несколько экземпляров."
 FIN_bristol_research:0 "Импортированные благодаря этому фокусу «Бленхеймы» будут скрыты, пока британцы не исследуют тяжёлые истребители.\n"
 fin_german:0 "Импортировать Dornier Do 17"
 fin_german_desc:0 "Пока мы разрабатываем собственные бомбардировщики, нужна немедленная помощь с их поставками, и Германия представляется лучшим выбором."
 fin_airtraining:0 "Воздушные учения"
 fin_airtraining_desc:0 "Улучшенные программы подготовки ВВС помогут нам во время войны."
 fin_fundvlt:0 "Финансировать VL"
 fin_fundvlt_desc:0 "VL играет важную роль в нашем самолётостроении. Дополнительное финансирование позволит создать более сильные ВВС."
 fin_improveprogram:0 "Улучшить программу подготовки лётчиков"
 fin_improveprogram_desc:0 "Наша программа подготовки авиации всё ещё нуждается в улучшении."
 fin_homemadedesigns:0 "Поощрять проекты VL"
 fin_homemadedesigns_desc:0 "Поощряя VL создавать собственные самолёты, мы перестанем зависеть от иностранных проектов."
 fin_karhumaki:0 "Братья Кархумяки"
 fin_karhumaki_desc:0 "Братья Кархумяки располагают важным аэродромом и инфраструктурой. В военное время нам необходимо взять их под контроль."
 fin_navalbombers:0 "Проекты морских бомбардировщиков"
 fin_navalbomers_desc:0 "Для защиты побережья и морей нам необходимы морские бомбардировщики."
 fin_industry:0 "Поддержать финскую промышленность"
 fin_industry_desc:0 "Поощрение развития и расширения финской промышленности принесёт большую пользу стране и народу."
 fin_lemminkainen:0 "Проекты «Лемминкяйнен»"
 fin_lemminkainen_desc:0 "Компания «Лемминкяйнен» играет важную роль в строительстве инфраструктуры. Новые проекты позволят улучшить её."
 fin_paperindustry:0 "Финансировать бумажную промышленность"
 fin_paperindustry_desc:0 "Бумажная промышленность является важной частью экономики и нуждается в дополнительном финансировании."
 fin_vr:0 "Увеличить бюджет VR"
 fin_vr_desc:0 "Компания VR имеет важное значение для снабжения в военное время. Мы должны помочь ей строить более совершенные железные дороги."
 fin_schools:0 "Строить инженерные школы"
 fin_schools_desc:0 "Больше инженерных школ даст промышленности больше квалифицированных специалистов."
 fin_industrialization:0 "Индустриализация"
 fin_industrialization_desc:0 "Мы отстали в развитии современной промышленности. Пора наверстать упущенное."
 fin_tikkakoski:0 "Tikkakoski Oy"
 fin_tikkakoski_desc:0 "Tikkakoski играет важную роль в производстве стрелкового оружия и нуждается в улучшенных предприятиях."
 fin_recruitment:0 "Расширить частный сектор"
 fin_recruitment_desc:0 "Финансовый капитал распределён по стране неравномерно, а крупные игроки вроде Nokia и Tikkakoski Oy господствуют на рынке. При крупном конфликте или новом экономическом кризисе такое положение осложнит жизнь граждан. Чтобы этого избежать, правительство должно поощрять и поддерживать небольших местных производителей."
 fin_vkt:0 "VKT"
 fin_vkt_desc:0 "Нам потребуется значительный резерв стрелкового оружия, поэтому расширение VKT имеет большое значение."
 fin_valmet:0 "Увеличить военные мощности"
 fin_valmet_desc:0 "Производственных мощностей военной промышленности никогда не бывает слишком много."
 fin_nokian:0 "Nokian Tyres"
 fin_nokian_desc:0 "Nokian Tyres играет важную роль в производстве резины."
 fin_outokumpu:0 "Outokumpu"
 fin_outokumpu_desc:0 "Outokumpu имеет большое значение для снабжения сырьём."
 fin_telecommunications:0 "Телекоммуникационные компании"
 fin_telecommunications_desc:0 "Развитие телекоммуникационных компаний позволит использовать их возможности при необходимости."
 fin_radar:0 "Изучить радар"
 fin_radar_desc:0 "Британский радар — совершенно новая технология, позволяющая обнаруживать всё в определённом радиусе. Мы должны её исследовать."
 fin_encryption:0 "Готовить специалистов по электронике"
 fin_encryption_desc:0 "Следует подготовить специалистов по электронике для перехвата иностранных передач."
 fin_scientists:0 "Привлечь учёных"
 fin_scientists_desc:0 "Привлечение иностранных учёных увеличит наши исследовательские возможности."
 fin_intervention:0 "Скандинавская интервенция"
 fin_intervention_desc:0 "Германия объявила войну Дании и Норвегии. Следует ли нам вмешаться вместе со Швецией ради безопасности границ?"
 fin_estonia:0 "Судьба Эстонии"
 fin_estonia_desc:0 "Эстония должна подчиниться нам или быть присоединена."
 fin_estoniaforkarjala:0 "Эстония в обмен на Карелию"
 fin_estoniaforkarjala_desc:0 "Советский Союз ясно дал понять, что хочет получить Карелию, но бесплатно мы её не отдадим. Следует потребовать взамен зависимую Эстонию."
 fin_balticsafety:0 "Безопасность Балтики"
 fin_balticsafety_desc:0 "Советы заявили притязания на наши территории и земли союзников. Мы должны что-то предпринять."
 fin_independent_diplomacy:0 "Независимая дипломатия"
 fin_independent_diplomacy_desc:0 "Нам никто не нужен, чтобы достичь величия!"
 FIN_salpa_line:0 "Линия Салпа"
 FIN_salpa_line_desc:0 "Обстановка изменилась. Нам нужна новая линия укреплений для защиты страны."
 FIN_the_winter_war_category:0 "Зимняя война"
 FIN_the_winter_war_category_desc:0 "Кульминацией [SOV.getAdjective] экспансионистской политики стало колоссальное вторжение через всю [SOV.getAdjective]-[FIN.getAdjective] границу под предлогом «освобождения [FIN.getAdjective] народа от угнетающего режима». Но все мы понимаем, что это лишь уловка для возвращения нашей свободолюбивой страны в состав России в качестве Великого княжества Финляндского под прямым управлением Москвы.\n\nОни испытают на себе сису и узнают, на что способны наши солдаты."
 FIN_offer_concessions_to_soviets:0 "Предлагать концессии на [SOV.getAdjective]s"
 FIN_offer_concessions_to_soviets_desc:0 "[Root.GetAdjective] коммунистка Хелла Вуолийоки связалась с правительством и предложила помощь в установлении контакта с [SOV.GetAdjective] режимом. В тайном месте в Швеции назначена встреча, где нам предложат уступить территории в обмен на сохранение [Root.GetAdjective] суверенитета.\n\n[Root.GetAdjective] силы быстро истощаются, а прежние попытки установить связь провалились. Возможно, это наш единственный шанс мирно завершить конфликт."
 FIN_propose_soviets_to_restore_status_quo:0 "Предложение [SOV.getAdjective]Восстановление статус-кво"
 FIN_propose_soviets_to_restore_status_quo_desc:0 "Если война продолжится в нынешнем виде, мы можем так и не оправиться от неё. Учитывая огромные потери [SOV.getAdjective] стороны, можно попытаться убедить её восстановить статус-кво."
 FIN_demand_reconciliation:0 "Потребовать примирения"
 FIN_demand_reconciliation_desc:0 "После того как [SOV.getAdjective] армия была сокрушена и полностью разгромлена храбрыми [FIN.getAdjective] войсками, мы можем потребовать выгодного мира!"
 FIN_request_swedish_assistance:0 "Запросить [SWE.getAdjective] помощь в войне"
 FIN_request_swedish_assistance_desc:0 "[FIN.getNameDefCap] и [SOV.getNameDef] находятся в состоянии войны. Всего через несколько десятилетий независимости мы вновь рискуем оказаться под властью одного из соседей.\n\nОднако угроза врага выходит далеко за наши границы. [SWE.getNameDef] пока сохраняет нейтралитет по отношению к [SOV.getNameDef], но, возможно, её удастся убедить присоединиться к защите общего наследия и одновременно обеспечить собственный стратегический буфер."
 FIN_ger_diplomacy:0 "Финско-германское соглашение"
 FIN_rejectalliance:0 "Союз отклонён."
 FIN_diplomats:0 "Финские дипломаты."
 FIN_sov_diplomacy:0 "Финско-советский дипломатический курс"
 FIN_fascist_diplomatic_effort:0 "Фашистские дипломатические усилия"
 FIN_driftwood:0 "Невмешательство в советскую политику"
 FIN_GER_Units:0 "Вы получите §Y5 дивизий Jaeger§! Из Германии в Турку"
 FIN_GER_Units_return_1_tt:0 "Вы получите §Y5 немецких егерских дивизий§! Под финским командованием в Норд-Нордже"
 FIN_GER_Units_return_2_tt:0 "Вы получите §Y5 немецких егерских дивизий§! Под финским командованием в Ростоке"
 FIN_GER_agreement:0 "§WВы соглашаетесь пойти на §RВойна§! с §Y[SOV.GetNameWithFlag]§! когда §Y[GER.GetNameWithFlag]§! объявлять §RВойна§! §Wи на них и§! §YПолный контроль§! §WДостаточно§! §Y[SOV.GetNameWithFlag]§! §YГосударства§!"
 FIN_GER_agreement_GER_side_tt:0 "§WЕсли мы§! §YПолный контроль§! §WДостаточно§! (§!§Y[SOV.GetNameWithFlag]§!§W) §YГосударства§! §Wв§! §RВойна§! §Wс помощью ()§!§Y[SOV.GetNameWithFlag]§!§W:The §!(§Y[FIN.GetNameWithFlag]§!§W) может§! §GОбъявить войну§! §Wна ()§!§Y[SOV.GetNameWithFlag]§!§W).§!"
 FIN_stabinthefront_tt:0 "\n§YЕсли [GER.GetAdjective] сторона согласится:§!"
 FIN_stabinthebackev_tt:0 "\n§YЕсли [SOV.GetAdjective] сторона согласится:§!"
 FIN_stabinthebackev_tt_2:0 "\n§YЕсли [SOV.GetAdjective] сторона откажется:§!"
 winterwarlost:0 "Проиграна §YЗимняя война§!."
 FIN_lesser_backstab_tt:0 "§RЭто разозлит Германию.§!"
 FIN_salpalinja:0 "После завершения добавит §Yукрепления 1-го уровня§! вдоль §Yроссийской§! границы."
 tikkakoski_armory:0 "Oy Tikkakoski Ab"
 nokia_company:0 "Nokia Oyj"
 wartsila_company:0 "Wärtsilä"
 scandinavia_unitetooltip:0 "Все §Yсеверные§! и §Yскандинавские§! страны объединятся под одним флагом. Вы получите национальные территории на землях остальных §Yсеверных§! стран."
 nordic_research_name:0 "Северные исследования"
 nordic_research_desc:0 "Знание разорвёт оковы рабства!"
 german_research_name:0 "Немецкие исследования"
 german_research_desc:0 "Сила в знании!"
 baltic_internationale:0 "Балтийский интернационал"
 FIN_improved_relations:0 "Финская дипломатия"
 FIN_Nordicunion:0 "По завершении вы будете прилагать §YНорвегия§!, §YШвеция§! и §YДания§!и образовать новую страну, называемую §YСкандинавский союз."
 fin_scandintervention:0 "Вмешались против Германии."
 fin_didntintervene:0 "Не вмешались против Германии."
 fin_interventiontooltip:0 "Если §YШвеция§! согласится, вы обе §Rобъявите войну§! §YГермании§!"
 president_mannerheim:0 "Президент"
 HOL_fokkers:0 "Добавляет 41 самолёт §YFokker D.XVII§! или §YFokker D.XXI§! в зависимости от уровня §Yнидерландских§! технологий истребителей."
 FIN_betrayal:0 "Предали нас"
 fin_estoniaforkarjala_tt:0 "Вы уступите §YКарелию§! в обмен на превращение §YЭстонии§! в марионетку"
 FIN_acceptance:0 "§RТребуется одобрение§!"
 finland.75.b_tt:0 "Если ты согласишься, ты уйдешь. §YКарджала§! Советскому Союзу в обмен на снятие с него претензий §YСтраны Балтии!"
 fin_militaryger_tt:0 "Предоставить §Y[GER.GetName]§! право прохода войск"
 fin_at:0 "Пехотное противотанковое вооружение"
 fin_news.1.t:0 "Немецкие дипломаты замечены в Хельсинки"
 fin_news.1.d:0 "После поражения в недавней войне с [SOV.getnamedef] Похоже, что Финляндия пытается придать дипломатический подтекст [GER.getnamedef]. В Хельсинки были замечены немецкие послы. По слухам, финны ищут военный союз с Германией против советской угрозы.\n\nЧто это означает для будущего [SOV.getnamedef]Можно только предполагать худшее."
 fin_news.1.a:0 "Единственно правильный путь."
 fin_news.1.b:0 "Фашистский режим становится всё сильнее."
 fin_news.1.h:0 "Интересно."
 fin_news.1.c:0 "Любой враг большевиков — наш друг."
 fin_news.1.e:0 "Это всего лишь слухи."
 fin_news.1.f:0 "Им лучше быть осторожнее..."
 fin_news.1.g:0 "Финнам стоит внимательнее выбирать, с кем они имеют дело."
 finland.84.t:0 "[FIN.GetAdjective] предложение"
 finland.84.d:0 "Услышав слухи о нашем желании напасть [SOV.getnamedef]. [FIN.GetAdjective] Дипломаты обратились к нам с предложением. Они позволят нашим войскам быть размещенными на [FIN.GetAdjective] Почва и использование портов. Нашим дипломатам было, естественно, любопытно посмотреть, насколько серьезно это предложение было сделано, и наладили контакты с членами Совета Безопасности ООН. [FIN.GetAdjective] Военные. Это привело к детальному плану, где, если наше вторжение [SOV.getnamedef] Казалось бы, все идет хорошо, [FIN.GetAdjective] Объявит войну [SOV.getnamedef] Тоже самое. Подробности этого соглашения прописаны, и дальнейшее сотрудничество представляется возможным, если мы продолжим операцию Барбаросса."
 finland.84.a:0 "Крайне необходимая помощь."
 finland.11.t:0 "Продолжение"
 finland.11.d:0 "Увидев это, [GER.GetAdjective] Вторжение в [SOV.getnamedef] Идёт по плану. Мы должны выполнить обещание, которое мы им дали. The [SOV.GetAdjective] Также недавно начали бомбить наши города, утверждая, что намеченная цель была [GER.GetAdjective] Военные базы в Финляндии. Это идеальное оправдание для объявления войны. [SOV.GetAdjective]s."
 finland.11.a:0 "Пора вернуть то, что принадлежит нам."
 finland.11.b:0 "Если подумать, это плохая идея."
 finland.12.t:0 "[FIN.GetNameDef] просит мира"
 finland.12.d:0 "Трусы из [FIN.GetName] просят мира в обмен на восстановление довоенных границ, демилитаризацию, изгнание всех немецких войск и отмену запрета Коммунистической партии Финляндии. Следует наказать их за предательство или оставить в покое?"
 finland.12.a:0 "Это лишь второстепенный фронт. Мы согласны."
 finland.12.b:0 "Нет! Финляндия скоро падёт перед Советским Союзом!"
 finland.13.t:0 "Советы отказались"
 finland.13.d:0 "Советский Союз отверг наше мирное предложение и поклялся захватить всю страну."
 finland.13.a:0 "Они погибнут, пытаясь это сделать!"
 finland.14.t:0 "Советы согласились"
 finland.14.d:0 "Советы приняли наше мирное предложение. В обмен на свободу и мир мы уступили регион Петсамо."
 finland.14.a:0 "Так будет лучше."
 finland.15.t:0 "Финляндия хочет вступить в Ось"
 finland.15.d:0 "После заключения военного союза с Финляндией её руководство решило подписать Тройственный пакт и вступить в Ось."
 finland.15.a:0 "Мы согласны."
 finland.15.b:0 "Это не отвечает нашим интересам."
 finland.16.t:0 "Германия согласилась"
 finland.16.d:0 "Германия приняла нашу просьбу подписать Тройственный пакт и вступить в Ось."
 finland.16.a:0 "Вместе мы сокрушим Советы!"
 finland.17.t:0 "Германия отказалась"
 finland.17.d:0 "Германия отклонила нашу просьбу о вступлении в Ось."
 finland.17.a:0 "Тем хуже для них."
 fin_news.2.t:0 "Финляндия подписывает Тройственный пакт"
 fin_news.2.d:0 "Финляндия подписала Тройственный пакт и официально вступила в Ось, прежде считаясь лишь её «соратником по оружию»."
 fin_news.2.a:0 "Интересно."
 fin_news.2.b:0 "За славное будущее Европы!"
 fin_news.2.c:0 "Фашисты плодятся как паразиты..."
 finland.18.t:0 "Финляндия предлагает союз"
 finland.18.d:0 "Финляндия пригласила нас в Северный оборонительный союз, заявив, что совместная защита всех северных стран отвечает общим интересам."
 finland.18.a:0 "Мы с радостью вступим ради безопасности Севера!"
 finland.18.b:0 "Финляндии придётся искать союзников в другом месте."
 finland.19.t:0 "[From.GetName] отказывается!"
 finland.19.d:0 "[From.GetName] отклонила наше приглашение в Северный оборонительный союз."
 finland.19.a:0 "Тем хуже для них!"
 finland.150.t:0 "[From.GetNameDefCap] предлагает восстановить статус-кво"
 finland.150.d:0 "Недавняя война против [From.GetNameDef] обернулась военной и политической катастрофой: мы понесли огромные потери в людях и технике и так и не смогли закрепиться в самой Финляндии. Способность [FIN.getAdjective] войск отражать большинство атак показывает, что продолжение войны будет всё сильнее поглощать ресурсы, тогда как среди простого населения она уже вызывает широкое недовольство.\n\nНа прошлой неделе [FIN.getAdjective] делегация встретилась с нашими дипломатами в Москве, чтобы обсудить прекращение огня и возможный мирный договор. Следует ли согласиться на восстановление статус-кво и отказаться от претензий к [FIN.getNameDef]?"
 finland.150.a:0 "Следует принять эти условия. Это всё же лучше поражения."
 finland.150.b:0 "Мы не сдадимся! Готовить новое наступление!"
 finland.151.t:0 "[From.GetNameDefCap] отказывается от переговоров"
 finland.151.d:0 "Сегодня утром [FROM.getAdjective] представители объявили нашей делегации, что никогда не согласятся на столь унизительные уступки.\nРазведка сообщает об усилении активности вдоль линии разграничения и крупных перемещениях войск на [FROM.getAdjective] стороне границы. Наши храбрые, но уставшие солдаты уже проинформированы и готовы защищать законные земли."
 finland.151.a:0 "Мы преподадим им ещё один незабываемый урок."
 finland.152.t:0 "[From.GetNameDefCap] требует территориальных уступок"
 finland.152.d:0 "В сегодняшней [FIN.getAdjective] телеграмме военному командованию говорится, что мирные переговоры могут возобновиться лишь после полной демилитаризации общей границы и ряда, как они утверждают, незначительных уступок.\n\nОни готовы закрыть глаза на идеологические разногласия и прошлые экспансионистские амбиции, если неотъемлемые карельские земли, включая Мурманск, Онегу и Олонец, будут воссоединены с [FIN.getNameDef]. Наша сторона карельской границы должна остаться демилитаризованной ради безопасности [FIN.getAdjective]-говорящего большинства Карельского перешейка.\n\nУчитывая тяжёлые потери и умеренность требований, следует принять условия, пока положение не ухудшилось."
 finland.152.a:0 "Следует согласиться. Это всё же лучше полного разгрома."
 finland.152.b:0 "Может быть, НЕТ?!"
 finland.99.t:0 "Северные и скандинавские страны объединены!"
 finland.99.d:0 "Наши дипломатические усилия увенчались успехом: лидеры Норвегии, Дании и Швеции согласились объединить страны ради более сильного и благополучного будущего для всех!"
 finland.99.a:0 "Править Севером!"
 finland.101.t:0 "Северный совет предлагает полную интеграцию правительства"
 finland.101.d:0 "Сегодня утром видные дипломаты Северного совета встретились с нашим премьер-министром, чтобы обсудить завершение союза двух стран. В обмен на наши обязательства они предлагают полное экономическое, научное и военное сотрудничество."
 finland.101.a:0 "Прекрасно! Мы внесём большой вклад в северное сообщество!"
 finland.101.b:0 "Нет! Независимость для нас превыше всего."
 finland.102.t:0 "[From.GetName] соглашается"
 finland.102.d:0 "[From.GetName] приняла наше предложение."
 finland.102.a:0 "Отлично!"
 finland.103.t:0 "[From.GetName] отказывается!"
 finland.103.d:0 "The [From.GetName] Мы отклонили наше предложение, заявив, что они будут лучше как независимая нация."
 finland.103.a:0 "Пусть будет так."
 finland.103.b:0 "Впрочем, существуют и другие способы их присоединить."
 finland.20.t:0 "Карельский вопрос"
 finland.20.d:0 "[FIN.GetAdjective] правительство хочет урегулировать спор вокруг Карелии и, ссылаясь на недавние события в Германии, просит отказаться от требований."
 finland.20.a:0 "Мы отступим. Пока."
 finland.20.b:0 "Нет! Карелия необходима для защиты Ленинграда."
 finland.21.t:0 "[From.GetName] соглашается"
 finland.21.d:0 "[From.GetName] согласилась с нашим предложением прекратить дальнейшее давление по Карельскому вопросу."
 finland.21.a:0 "Хорошо."
 finland.22.t:0 "[From.GetName] отказывается!"
 finland.22.d:0 "[From.GetName] отклонила предложение, сославшись на безопасность Ленинграда."
 finland.22.a:0 "Ожидаемо."
 finland.23.t:0 "Финско-британское исследовательское соглашение"
 finland.23.d:0 "Британцы приняли наше предложение о взаимном исследовательском соглашении."
 finland.23.a:0 "Прекрасные новости!"
 finland.23.b:0 "Присоединиться к технологическому обмену Содружества."
 finland.24.t:0 "Сообщите об этом"
 finland.24.d:0 "Если вы видите это событие, сообщите об ошибке: оно не должно появляться."
 finland.24.a:0 "Хорошо"
 finland.25.t:0 "Финско-германское исследовательское соглашение"
 finland.25.d:0 "Немцы приняли наше предложение о взаимном исследовательском соглашении."
 finland.25.a:0 "Прекрасные новости!"
 finland.25.b:0 "Технологический обмен с Германией"
 finland.26.t:0 "Финны уступают Карелию"
 finland.26.d:0 "Из-за начавшейся в Европе войны финны решили уступить нам Карелию, чтобы сохранить мир."
 finland.26.a:0 "Разумный выбор."
 finland.27.t:0 "Финляндия хочет вступить в Ось"
 finland.27.d:0 "Финляндия направила дипломатов для обсуждения возможного вступления в державы Оси."
 finland.27.a:0 "Да, приветствуем финских братьев!"
 finland.27.b:0 "Нет, Финляндии придётся искать друзей в другом месте."
 finland.28.t:0 "Германия принимает нашу просьбу!"
 finland.28.d:0 "Германия согласилась принять нас в державы Оси."
 finland.28.a:0 "Поднимем тост за новых немецких друзей!"
 finland.29.t:0 "Германия отказывает!"
 finland.29.d:0 "Германия отклонила нашу просьбу о союзе."
 finland.29.a:0 "Тем хуже для них!"
 finland.31.t:0 "[From.GetName] соглашается!"
 finland.31.d:0 "[From.GetName] приняла приглашение в Северный оборонительный союз."
 finland.31.a:0 "Прекрасные новости!"
 finland.30.t:0 "Северное исследовательское соглашение"
 finland.30.d:0 "Мы успешно договорились об исследовательском соглашении с другими северными странами."
 finland.30.a:0 "Хорошо."
 finland.30.b:0 "Присоединиться к исследованиям фракции."
 finland.32.t:0 "Финляндия призывает к союзу"
 finland.32.d:0 "Финляндия направила нам приглашение вступить в её Балтийский союз."
 finland.32.a:0 "Мы с радостью вступим!"
 finland.32.b:0 "Нет. Мы должны сохранить нейтралитет."
 finland.33.t:0 "[From.GetName] соглашается!"
 finland.33.d:0 "[From.GetName] приняла наше приглашение в союз."
 finland.33.a:0 "Хорошие новости!"
 finland.34.t:0 "[From.GetName] отказывается!"
 finland.34.d:0 "[From.GetName] отклонила наше приглашение в союз!"
 finland.34.a:0 "К счастью, существуют и другие способы заставить их вступить..."
 finland.36.t:0 "[From.GetName] хочет вступить в Коминтерн!"
 finland.36.d:0 "[From.GetName] направила письмо с просьбой принять её в нашу фракцию."
 finland.36.a:0 "Да, мы согласны."
 finland.36.b:0 "Нет, придётся отказать."
 finland.37.t:0 "[From.GetName] соглашается!"
 finland.37.d:0 "[From.GetName] приняла нашу просьбу о вступлении в её фракцию!"
 finland.37.a:0 "За славное будущее!"
 finland.38.t:0 "[From.GetName] отказывается"
 finland.38.d:0 "Несмотря на наши усилия, [From.GetName] отклонила просьбу о вступлении в союз."
 finland.38.a:0 "Они ещё пожалеют!"
 FIN_elections.1.t:0 "Президентские выборы [GetYear] года!"
 FIN_elections.1.d:0 "Стране пришло время выбрать нового президента."
 FIN_elections.1.a:0 "Ещё шесть лет П. Э. Свинхувуда!"
 FIN_elections.1.b:0 "Новый президент — Кюёсти Каллио!"
 FIN_elections.2.t:0 "Кюёсти Каллио умер!"
 FIN_elections.2.d:0 "С прискорбием сообщаем, что президент Кюёсти Каллио внезапно скончался от сердечного приступа. На внеочередных выборах победили либералы."
 FIN_elections.2.a:0 "Ристо Рюти займёт его место."
 FIN_elections.3.t:0 "Судьба войны зависит от военного руководства!"
 FIN_elections.3.d:0 "Хотя формально [FIN.GetLeader] всё ещё у власти, военное руководство маршала Маннергейма затмило его. Поскольку судьба страны зависит от армии, многие считают маршала фактическим лидером — по крайней мере до восстановления мира."
 FIN_elections.3.a:0 "Да здравствует маршал!"
 finland.104.t:0 "[From.GetName] хочет вступить в Союзники"
 finland.104.d:0 "[From.GetName] направила письмо с просьбой принять её в нашу фракцию."
 finland.104.a:0 "Да, мы согласны."
 finland.104.b:0 "Нет, придётся отказать."
 finland.105.t:0 "[From.GetName] соглашается!"
 finland.105.d:0 "[From.GetName] приняла нашу просьбу о вступлении в её фракцию."
 finland.105.a:0 "За безопасное будущее Европы!"
 finland.42.t:0 "[From.GetName] отказывается"
 finland.42.d:0 "Несмотря на наши усилия, [From.GetName] отклонила просьбу о вступлении в союз."
 finland.42.a:0 "Они ещё пожалеют!"
 finland.100.t:0 "Северная интеграция"
 finland.100.d:0 "Наши окончательные законы и политика готовы. Отныне нет шведов, финнов, норвежцев или датчан — есть только северяне!"
 finland.100.a:0 "Хорошо."
 finland.43.t:0 "[From.GetName] требует земли"
 finland.43.d:0 "[From.GetName] потребовала уступить Лапландию, угрожая последствиями."
 finland.43.a:0 "У нас нет выбора, кроме как согласиться."
 finland.43.b:0 "[From.GetName] слишком сильна. Ради выживания нам следует стать её марионеткой."
 finland.43.c:0 "[From.GetName] ничего не получит!"
 finland.44.t:0 "[From.GetName] уступает Лапландию"
 finland.44.d:0 "[From.GetName] уступила нам Лапландию."
 finland.44.a:0 "Логичный выбор."
 finland.1001.t:0 "[From.GetName] решает стать нашей марионеткой"
 finland.1001.d:0 "Опасаясь нашей военной мощи, [From.GetName] решила стать нашей марионеткой."
 finland.1001.a:0 "Логичный выбор."
 finland.1001.b:0 "Мы присоединим всю Швецию!"
 finland.46.t:0 "[From.GetName] отказывается уступить"
 finland.46.d:0 "[From.GetName] отказалась передать нам какие-либо земли."
 finland.46.a:0 "Тогда заберём их силой!"
 finland.47.t:0 "[From.GetName] требует Северную Норвегию"
 finland.47.d:0 "[From.GetName] потребовала уступить Северную Норвегию, угрожая последствиями."
 finland.47.a:0 "У нас нет выбора, кроме как согласиться."
 finland.47.b:0 "[From.GetName] слишком сильна. Ради выживания нам следует стать её марионеткой."
 finland.47.c:0 "[From.GetName] ничего не получит!"
 finland.48.t:0 "[From.GetName] уступает Северную Норвегию"
 finland.48.d:0 "[From.GetName] уступила нам Северную Норвегию."
 finland.48.a:0 "Логичный выбор."
 finland.49.t:0 "[From.GetName] решает стать нашей марионеткой"
 finland.49.d:0 "Опасаясь нашей военной мощи, [From.GetName] решила стать нашей марионеткой."
 finland.49.a:0 "Логичный выбор."
 finland.49.b:0 "Мы присоединим всю Норвегию!"
 finland.50.t:0 "[From.GetName] отказывается уступить"
 finland.50.d:0 "[From.GetName] отказалась передать нам какие-либо земли!"
 finland.50.a:0 "Тогда заберём их силой!"
 finland.51.t:0 "[From.GetName] требует Ютландию"
 finland.51.d:0 "[From.GetName] потребовала уступить Ютландию, угрожая последствиями."
 finland.51.a:0 "У нас нет выбора, кроме как согласиться."
 finland.51.b:0 "[From.GetName] слишком сильна. Ради выживания нам следует стать её марионеткой."
 finland.51.c:0 "[From.GetName] ничего не получит!"
 finland.52.t:0 "[From.GetName] уступает Ютландию"
 finland.52.d:0 "[From.GetName] уступила нам Ютландию."
 finland.52.a:0 "Логичный выбор."
 finland.53.t:0 "[From.GetName] решает стать нашей марионеткой"
 finland.53.d:0 "Опасаясь нашей военной мощи, [From.GetName] решила стать нашей марионеткой."
 finland.53.a:0 "Логичный выбор."
 finland.53.b:0 "Мы присоединим всю Данию!"
 finland.54.t:0 "[From.GetName] отказывается уступить!"
 finland.54.d:0 "[From.GetName] отказалась передать нам какие-либо земли!"
 finland.54.a:0 "Тогда заберём их силой!"
 finland.55.t:0 "[From.GetName] обсуждает интервенцию"
 finland.55.d:0 "[From.GetName] обсуждала вмешательство против немецкой агрессии в Скандинавии и спрашивает, должны ли мы присоединиться."
 finland.55.a:0 "Да, ради собственной защиты!"
 finland.55.b:0 "Нет. Лучше не рисковать."
 finland.56.t:0 "[From.GetName] соглашается вмешаться"
 finland.56.d:0 "[From.GetName] решила вмешаться против Германии!"
 finland.56.a:0 "К оружию!"
 finland.57.t:0 "[From.GetName] решает не вмешиваться"
 finland.57.d:0 "[From.GetName] решила не вступать в войну."
 finland.57.a:0 "Тогда и нам не следует."
 finland.57.b:0 "Они глупцы! Мы защитим скандинавских братьев!"
 finland.58.t:0 "[From.GetName] объявляет войну Германии"
 finland.58.d:0 "Как и обещала, [From.GetName] объявила войну Германии!"
 finland.58.a:0 "И мы последуем за ней!"
 finland.59.t:0 "[From.GetName] требует территории"
 finland.59.d:0 "[From.GetName] потребовала уступить Олонец, Онегу и Мурманск, заявляя, что это её законные земли!"
 finland.59.a:0 "Следует уступить их, чтобы избежать возможной войны."
 finland.59.b:0 "Никогда!"
 finland.60.t:0 "[From.GetName] требует нашу территорию"
 finland.60.d:0 "[From.GetName] потребовала подчиниться ей, угрожая полным присоединением."
 finland.60.a:0 "Мы никогда не покоримся!"
 finland.60.b:0 "Лучше хотя бы частично сохранить свои земли."
 finland.61.t:0 "[From.GetName] отказывается!"
 finland.61.d:0 "[From.GetName] отклонила наше требование стать нашей марионеткой!"
 finland.61.a:0 "Они прекрасно знают, какова альтернатива..."
 finland.62.t:0 "[From.GetName] отступает!"
 finland.62.d:0 "[From.GetName] отступила и приняла наши требования, перейдя под наш контроль."
 finland.62.a:0 "Мудрый выбор."
 finland.63.t:0 "[From.GetName] уступает территорию"
 finland.63.d:0 "[From.GetName] решила уступить требуемые земли, чтобы избежать конфликта."
 finland.63.a:0 "За будущее Великой Финляндии!"
 finland.64.t:0 "[From.GetName] отказывается!"
 finland.64.d:0 "[From.GetName] отказывается уступить нам законные земли!"
 finland.64.a:0 "Они получат по заслугам..."
 finland.65.t:0 "Президент Рюти уходит в отставку"
 finland.65.d:0 "Президент Рюти обещал Германскому рейху не заключать сепаратный мир, но мы начали такие переговоры. Чтобы избежать осложнений, он ушёл в отставку. Его место займёт маршал Маннергейм."
 finland.65.a:0 "Хорошо."
 fin_news.3.t:0 "[FIN.GetName] объявляет войну [SOV.GetName]"
 fin_news.3.d:0 "\nПосле советских бомбардировок финских городов, которые русские назвали случайностью и объяснили ударами по немецким военным базам в Финляндии, финны объявили войну [SOV.GetName], заявив, что это была не ошибка, а открытое нападение.\n\nНекоторые наблюдатели считают это лишь предлогом для войны с [SOV.GetAdjective] стороной, возвращения утраченных земель и выполнения обещаний, данных [GER.getnamedef]."
 fin_news.3.a:0 "Ещё больше плохих новостей для [SOV.GetAdjective] стороны."
 fin_news.3.b:0 "Единственно правильный выбор!"
 fin_news.3.c:0 "Вероломные свиньи!"
 fin_news.4.t:0 "Создание Северного оборонительного союза"
 fin_news.4.d:0 "Сегодня [FIN.GetAdjective] правительство объявило о планах создать новый оборонительный союз под названием Северный оборонительный союз. Его главная цель — сформировать оборонительный военный пакт северных стран: [NOR.GetName], [SWE.GetName], [DEN.GetName] и [FIN.GetName]. [FIN.GetName] сочла необходимым продвигать эту инициативу из-за растущей напряжённости в мире."
 fin_news.4.a:0 "Интересно."
 fin_news.4.b:0 "Ради безопасности северных стран!"
 fin_news.5.t:0 "Северные страны объединяются"
 fin_news.5.d:0 "Сегодня северные страны [SWE.GetName], [NOR.GetName], [DEN.GetName] и [FIN.GetName] объявили об объединении в одно государство под властью так называемого Северного совета, в котором каждая бывшая страна будет представлена равным числом делегатов."
 fin_news.5.a:0 "Неожиданно."
 fin_news.5.b:0 "Мы едины!"
 finland.68.t:0 "[FIN.GetName] предлагает Карелию в обмен на Эстонию"
 finland.68.d:0 "[FIN.GetName] предложила нам Карелию в обмен на освобождение Эстонии в качестве её зависимого государства."
 finland.68.a:0 "Прекрасное предложение!"
 finland.69.t:0 "Аландский вопрос"
 finland.69.desc:0 "Теперь, когда напряжённость в Европе растёт, вновь возник вопрос: что делать с Аландскими островами?"
 finland.69.a:0 "Ничего. Они останутся нашими и демилитаризованными."
 finland.69.b:0 "Передать Аландские острова [SWE.GetName] ради их безопасности."
 finland.69.c:0 "Ремилитаризовать Аландские острова и ввести там воинскую повинность."
 finland.69.d:0 "Предоставить им больше автономии, но сохранить под нашей защитой."
 finland.70.t:0 "[FIN.GetName] передаёт нам Аландские острова"
 finland.70.d:0 "[FIN.GetName] решила передать нам Аландские острова ради их безопасности."
 finland.70.a:0 "Мудрый выбор!"
 finland.71.t:0 "[FIN.GetName] просится в Северный союз!"
 finland.71.d:0 "[FIN.GetName] направила дипломатическое предложение объединить наши страны под флагом Северного союза."
 finland.71.a:0 "Мы согласны."
 finland.71.b:0 "Нет! Мы сохраним независимость."
 finland.72.t:0 "[From.GetName] соглашается!"
 finland.72.d:0 "[From.GetName] приняла наше предложение и присоединилась к Северному союзу!"
 finland.72.a:0 "Прекрасные новости!"
 finland.73.t:0 "[From.GetName] отказывается!"
 finland.73.d:0 "[From.GetName] отклонила предложение объединиться под северным флагом!"
 finland.73.a:0 "Есть и другие способы нас объединить..."
 finland.75.t:0 "Вопрос безопасности Балтики"
 finland.75.d:0 "Советы объявили территории [LAT.GetName], [EST.GetName] и [LIT.GetName] своими. Следует защитить новых союзников и себя от СССР."
 finland.75.a:0 "Попросить их отказаться от притязаний на Балтику."
 finland.75.b:0 "Обменять Карелию на безопасность Балтики."
 finland.75.c:0 "При необходимости мы защитим себя сами!"
 finland.76.t:0 "[FIN.GetName] просит отказаться от претензий"
 finland.76.d:0 "[FIN.GetName] попросила нас снять претензии на балтийские территории."
 finland.76.b:0 "Мы согласимся — у нас есть более важные дела."
 finland.76.a:0 "Никогда! Эти территории по праву наши!"
 finland.77.t:0 "Предложение [FIN.GetName]"
 finland.77.d:0 "[FIN.GetName] предлагает уступить нам Карелию в обмен на отказ от требований к балтийским странам."
 finland.77.a:0 "Это невыгодное предложение!"
 finland.77.b:0 "Это отвечает нашим интересам."
 finland.78.t:0 "[SOV.GetName] отказывается!"
 finland.78.d:0 "[SOV.GetName] отклонила наше предложение по урегулированию балтийского вопроса!"
 finland.78.a:0 "По крайней мере, мы попытались."
 finland.79.t:0 "[SOV.GetName] соглашается."
 finland.79.d:0 "К нашему удивлению, [SOV.GetName] приняла нашу просьбу."
 finland.79.a:0 "Прекрасные новости!"
 finland.80.t:0 "[SOV.GetName] соглашается"
 finland.80.d:0 "[SOV.GetName] приняла предложение: мы уступили Карелию, а она отказалась от требований к балтийским странам."
 finland.80.a:0 "Прекрасные новости!"
 finland.81.t:0 "Восстановить монархию?"
 finland.81.d:0 "Теперь, когда у нас хорошие отношения с Германией, она спросила, хотим ли мы провозгласить королевство, как предполагалось в случае победы немцев в Великой войне. В качестве короля нам предлагают Фридриха Карла."
 finland.81.a:0 "Да! Мы станем королевством!"
 finland.81.b:0 "Нет, в этом нет необходимости."
 finland.82.t:0 "Выбор места расположения нашей столицы."
 finland.82.d:0 "Теперь, когда северные страны объединены, возник вопрос: где должна находиться наша столица?"
 finland.82.a:0 "Оставить её в Хельсинки."
 finland.82.b:0 "Перенести её в Стокгольм, столицу Швеции."
 finland.82.c:0 "Перенести её в Осло, столицу Норвегии."
 finland.82.e:0 "Перенести её в Копенгаген, столицу Дании."
 finland.83.t:0 "Смерть Фридриха Карла"
 finland.83.d:0 "С глубокой скорбью радио сообщило, что прошлой ночью король Фридрих Карл скончался во сне. Его сын Вольфганг Мориц унаследует престол."
 finland.83.a:0 "Король умер, да здравствует король."
 finland.85.t:0 "Финляндия отказывается от предложения"
 finland.85.d:0 "Хотя [FIN.GetAdjective] сторона обещала помочь нам в операции «Барбаросса», если она будет развиваться успешно, теперь она отказалась от соглашения. В качестве причин называются неподготовленность армии и более крупная, чем ожидалось, концентрация [SOV.GetAdjective] войск на границе. Но мы знаем истинную причину — они трусы!"
 finland.85.a:0 "И без их помощи обойдёмся."
 finland.86.t:0 "Финляндия пытается заключить мир с Россией [SOV.GetAdjective]С!"
 finland.86.d:0 "Финские дипломаты предупредили, что пытаются заключить мир с [SOV.GetAdjective] стороной, поскольку военная обстановка неблагоприятна для Финляндии. Фельдмаршал Маннергейм лично выразил сожаление о ходе войны, но заявил, что другого выхода у страны не осталось. Они также заверили, что в случае провала переговоров удвоят военные усилия."
 finland.86.a:0 "Трусы, все до одного!"
 finland.87.t:0 "Финляндия заключила мир с [SOV.GetAdjective]s"
 finland.87.d:0 "Финские дипломаты подписали мирное соглашение с [SOV.GetAdjective] стороной, завершающее войну между странами. В ближайшие часы они начнут изгонять наши войска со своей территории."
 finland.87.a:0 "Это предательство не останется безнаказанным!"
