 FIN_personal_agenda_svinhufvud_r56_tt:0 "§GИскоренение экстремистов§!: поддержка идеологий $fascism$ и $communism$ ниже §Y1%§! повысит £GFX_power_balance_texticon §Yобщественное доверие§!.\n  - §RТревожная поддержка социалистов§!: поддержка идеологии $communism$ выше §Y9%§! снизит £GFX_power_balance_texticon §Yобщественное доверие§!.\n  - $losing_soverignty_threatened_tt$"
