l_russian:
 Iceland_focus:0 "Дерево фокусов Исландии"
 ICE_new_industry_tech:0 "Новая промышленность"
 ICE_refineries:0 "Эксперименты с синтетическими материалами"
 ICE_extra_research_slot:0 "Технологические прорывы"
 ICE_full_metal:0 "Доктрина полной механизации"
 ICE_mobile_war_tech:0 "Доктрина манёвренной войны"
 ICE_fast_armor:0 "Упор на мобильную бронетехнику"
 ICE_heaviest_tanks:0 "Упор на тяжёлые танки"
 ICE_special_forces:0 "Доктрина элитных войск"
 ICE_mountain_forces:0 "Сильные горные части"
 ICE_marine_forces:0 "Сильная морская пехота"
 ICE_marine_forces2:0 "Подготовленная морская пехота"
 ICE_paratrooper_forces:0 "Подготовленные десантники"
 ICE_air_landings:0 "Планы высадки"
 ICE_airsea_tech:0 "К морю по воздуху"
 ICE_airsea_tech2:0 "К морю по воздуху"
 ICE_landsea_tech:0 "На сушу по воздуху"
 ICE_landsea_tech2:0 "На сушу по воздуху"
 ICE_rocketry1:0 "Упор на ракетную технику"
 ICE_air_doctrine_tech:0 "Упор на воздушную доктрину"
 ICE_naval_doctrine_tech:0 "Определить задачи береговой охраны"
 ICE_heavy_ships:0 "Развитие тяжёлых кораблей"
 ICE_subs_tech:0 "Развитие подводных лодок"
 ICE_lc_tech:0 "Развитие лёгких крейсеров"
 ICE_destroyer_tech:0 "Развитие эсминцев"
 ICE_nuclear:0 "Развитие ядерных исследований"
 ICE_rocketry2:0 "Практическое ракетостроение"
 ICE_look_den_tt:0 "Улучшает мнение и торговые отношения с [DEN.GetNameDef]."
 ICE_close_eng_tt:0 "Улучшает мнение и торговые отношения с [ENG.GetNameDef]."
 ICE_close_usa_tt:0 "Улучшает мнение и торговые отношения с [USA.GetNameDef]."
 ICE_abolish_althing_tt:0 "Организовать переворот и свергнуть слабое правительство. После этого, вероятно, наступит период политической нестабильности."
 ICE_ikarus_tt:0 "Для обеспечения нашей безопасности [GER.GetNameDef] предоставит нам несколько подразделений фальширмъегерей."
 ICE_vikings_tt:0 "Даёт претензии и национальные территории в Скандинавии, Гренландии и на Фарерских островах.\n"
 ICE_no_neutral_tt:0 "Национальный дух §Y«Нейтралитет: [ICE.GetAdjective]»§! отсутствует."
 ICE_end_neutral_tt:0 "Убирает национальный дух §Y«Нейтралитет: [ICE.GetAdjective]»§!.\n"
 ICE_create_ifv_tt:0 "Позволяет выбрать производителя ИФВ."
 ICE_island_defence_tt:0 "Добавляет §G10%§! к §Yзащите армии§! национальному духу §Y«Оборона родины»§!.\n"
 ICE_advanced_weapons_tt:0 "Сокращает §Yвремя подготовки армии§! на §G5%§! и добавляет §G5%§! к §Yнадёжности пехотного оружия§! и §G5%§! к §Yнадёжности артиллерии§! национальному духу §Y«Оборона родины»§!."
 ICE_propaganda_tt:0 "Добавляет §G5%§! к §Yатаке и защите на национальной территории§! и §G5%§! к §Yбоевому духу армии§! национальному духу §Y«Оборона родины»§!.\n"
 ICE_carrier_tt:0 "Создаёт §Yавианосец§!, а также по §G25§! §Yпалубных морских бомбардировщиков§! и §Yпалубных истребителей§!. Модели будут самыми современными на день завершения."
 ICE_rocket_effort_tt:0 "Снижает штраф за опережение времени на §G-100%§! или даёт §G50%§! бонус к исследованиям, если технология не опережает время. Действует на следующие §Y2§! исследования технологий: §Yракетная артиллерия§!."
 ICE_roads_program:0 "Дорожная программа"
 ICE_roads_program_desc:0 "Исландия по-прежнему остаётся страной разобщённых поселений. Нам не хватает инфраструктуры для перемещения людей между крупными городами и посёлками. Теперь это изменится."
 ICE_look_den:0 "Ориентироваться на [DEN.GetNameDef]"
 ICE_look_den_desc:0 "Пусть мы больше и не являемся прямыми подданными Дании, она всё ещё остаётся нашим верным союзником и защитником. Подобно тому как подданные [ENG.GetNameDef] ищут наставления у своей метрополии, мы обращаемся за наставлениями к отцу-Дании."
 ICE_look_away:0 "Независимая внешняя политика"
 ICE_look_away_desc:0 "Когда-то [DEN.GetNameDefCap] правила нами, но теперь мы сами выбираем свою судьбу. Даже если мы решим сохранить союз с [DEN.GetNameDef], мы должны действовать как независимая и суверенная страна. Только нам решать, кто станет нашим союзником."
 ICE_den_inf:0 "Инвестиции: [DEN.GetAdjective]"
 ICE_den_inf_desc:0 "Наши крепкие связи с [DEN.GetNameDef] Это означает, что мы можем использовать наши связи, чтобы наша страна выглядела как можно более перспективной. Это увеличит шансы того, что [DEN.GetAdjective] Бизнес будет инвестировать в наше будущее."
 ICE_domestic_ind:0 "Поддержать отечественную промышленность"
 ICE_domestic_ind_desc:0 "Промышленный потенциал Исландии смехотворно мал. Следует сделать инвестиции выгодными и предложить льготы тем, кто открывает здесь предприятия и фабрики."
 ICE_den_mil_invest:0 "Военные инвестиции: [DEN.GetAdjective]"
 ICE_den_mil_invest_desc:0 "Удалённая от нестабильного материка Исландия идеально подходит для производства важнейших военных материалов. Это очевидно — осталось лишь убедить в этом [DEN.GetNameDef]."
 ICE_den_research_collab:0 "пригласите [DEN.GetAdjective] Исследователи"
 ICE_den_research_collab_desc:0 "Чтобы наилучшим образом продвинуться в каждой области, мы должны сравнивать заметки с нашими. [DEN.GetAdjective] Братья. В конце концов, две головы лучше, чем одна, особенно когда одна из этих голов [ICE.GetAdjective]!"
 ICE_new_industry:0 "Новые промышленные методы"
 ICE_new_industry_desc:0 "[ICE.GetNameDefCap] трудно назвать образцом современной промышленной сверхдержавы. Чтобы успешнее конкурировать, нам следует изучить методы и технологии более индустриально развитых соседей."
 ICE_den_invest_final:0 "[DEN.GetAdjective] Интерес к Исландии"
 ICE_den_invest_final_desc:0 "[DEN.GetNameDefCap]В последнее время интерес к нашей инфраструктуре и промышленности растет. Мы должны извлечь выгоду из этого и получить капитал, необходимый для того, чтобы начать расширение наших производственных мощностей."
 ICE_look_out:0 "Обратиться к миру"
 ICE_look_out_desc:0 "Мы слишком долго жили в изоляции от остального мира. Пора взглянуть за пределы границ и понять, что лучше всего послужит нашему народу."
 ICE_end_neutrality:0 "Рассмотреть отказ от нейтралитета"
 ICE_end_neutrality_desc:0 "Мы долго придерживались политики нейтралитета вместе с [DEN.GetNameDef]. Однако нынешняя международная обстановка заставляет нас признать, что добросовестно следовать этому курсу больше невозможно."
 ICE_refine_research:0 "Исследование синтетических материалов"
 ICE_refine_research_desc:0 "В Исландии почти нет природных ресурсов, полезных для войны, но, возможно, мы сможем разработать способы производства ценных материалов без редкого сырья?"
 ICE_recycling_programs:0 "Программы переработки"
 ICE_recycling_programs_desc:0 "[ICE.GetNameDefCap] не может позволить себе терять произведённое. Нужно добиться, чтобы даже сломанные инструменты находили применение."
 ICE_infr_2:0 "строить [ICE.GetAdjective] инфраструктура"
 ICE_infr_2_desc:0 "Инфраструктура — это не только дороги. Нам нужны мосты, плотины, линии электропередачи и другие общественно необходимые сооружения."
 ICE_mil_facs:0 "Инвестировать в производство вооружений"
 ICE_mil_facs_desc:0 "Если мы хотим сохранить независимость, то должны быть способны защищать себя оружием, произведённым здесь, в Исландии."
 ICE_war_manu:0 "Полная военная экономика"
 ICE_war_manu_desc:0 "В Европу пришла война, и [ICE.GetNameDef] оказалась втянута в эту борьбу. Экономика должна соответствовать нынешнему положению."
 ICE_new_indu:0 "Новые промышленные возможности"
 ICE_new_indu_desc:0 "Теперь, когда внешний мир наконец воспринимает [ICE.GetNameDef] как серьёзное направление для инвестиций, наступил наш шанс. Использование нового интереса обеспечит нам будущее на мировом рынке."
 ICE_strong_neutral:0 "принуждение [ICE.GetAdjective] Нейтралитет"
 ICE_strong_neutral_desc:0 "[ICE.GetNameDefCap] ясно заявила о намерении сохранять нейтралитет в грядущих войнах, и мы сделаем всё возможное, чтобы никто не посмел его нарушить."
 ICE_close_eng:0 "Закрыть близко [ENG.GetAdjective] Связи"
 ICE_close_eng_desc:0 "[ENG.GetNameDefCap] находится прямо у наших границ. Нам следует искать у неё дружбы и взаимной защиты."
 ICE_close_usa:0 "Закрыть близко [USA.GetAdjective] Связи"
 ICE_close_usa_desc:0 "[USA.GetNameDefCap], возможно, не спешит действовать, но уже сейчас ясно, что в будущем она станет могущественным игроком. Следует установить тесные связи, чтобы обеспечить себе место в этом будущем."
 ICE_fas_rallies:0 "Поддержать фашистские митинги"
 ICE_fas_rallies_desc:0 "Исландская националистическая партия «Флоккур Тьодерниссинна» проводит митинги в столице, Рейкьявике. Вместо прежних попыток ограничить эти выступления нам следует их поощрять."
 ICE_sup_com:0 "Права рабочих"
 ICE_sup_com_desc:0 "Великая депрессия вывела рабочих и фермеров Исландии на передний план. Мы должны обеспечить им защиту в будущем и никогда больше не допустить повторения подобных бедствий."
 ICE_sup_dem:0 "Продвигать республиканские идеи"
 ICE_sup_dem_desc:0 "[ICE.GetNameDefCap] должна сбросить последние оковы, связывающие её с [DEN.GetNameDef]. Хватит подчиняться политике Копенгагена."
 ICE_distance_den:0 "Отдалиться от [DEN.GetNameDef]"
 ICE_distance_den_desc:0 "Нас связывает долгая история с [DEN.GetNameDef], но настало время самим ковать свою судьбу. Мы больше не можем прислушиваться к пустым увещеваниям копенгагенских политиков."
 ICE_guarantees:0 "Подтвердить приверженность демократии"
 ICE_guarantees_desc:0 "[ICE.GetNameDefCap] обладает сильной и живой демократией, но ещё совсем недавно такой была и Германия. Мы должны показать миру, что [ICE.GetNameDef] не отступит от своих ценностей."
 ICE_break_den:0 "Независимость от [DEN.GetNameDef]"
 ICE_break_den_desc:0 "Мы уже более трёх десятилетий действуем как суверенная страна. Пора разорвать последние связи с [DEN.GetNameDef] и провозгласить полноценную республику."
 ICE_eng_defences:0 "[ENG.GetAdjective] оборона"
 ICE_eng_defences_desc:0 "Наши тесные связи с [ENG.GetNameDef] стратегическое положение, обеспечивающее их желание видеть [ICE.GetNameDef] Хорошо защищенный от [GER.GetAdjective] нападение."
 ICE_join_allies:0 "Вступить в Союзники"
 ICE_join_allies_desc:0 "Дело Союзников справедливо; мы должны искоренить зло фашизма, где бы оно ни возникло!"
 ICE_mountain_train:0 "Создать тактическую школу Акюрейри"
 ICE_mountain_train_desc:0 "Холодный и гористый рельеф Исландии идеально подходит для подготовки горных и зимних частей. [ENG.GetNameDefCap] предложила построить школу, предназначенную именно для такой подготовки."
 ICE_eng_expand_airport:0 "Расширить аэропорт Рейкьявика"
 ICE_eng_expand_airport_desc:0 "The [ENG.GetADjective] Им нужны места для патрулирования над Атлантикой, и они выразили заинтересованность в расширении аэропорта Рейкьявика для этой цели."
 ICE_usa_airport:0 "Создать аэропорт Кеблавик"
 ICE_usa_airport_desc:0 "[USA.GetNameDefCap] выразила интерес к строительству аэропорта в Кеблавике. Она обещает передать эту базу нам через несколько лет после окончания войны."
 ICE_fas_youth:0 "Создать Исландскую молодёжь"
 ICE_fas_youth_desc:0 "Молодёжь — наше будущее; мы должны подготовить её ко всему и научить вести Исландию к величию!"
 ICE_fas_leader:0 "Ввести принцип фористы"
 ICE_fas_leader_desc:0 "Фюрерпринцип служил [GER.GetNameDefCap] Очень. Мы должны привести его сюда и сделать его своим, положив конец борьбе внутри нашей партии. Только один из нас будет стоять выше остальных."
 ICE_abolish_althing:0 "Упразднить Альтинг"
 ICE_abolish_althing_desc:0 "Альтинг — бессильный институт, задушенный собственной нерешительностью. Мы не можем держаться за устаревшие идеи, отдающие столь большую власть множеству людей; правительство следует перестроить по корпоративному образцу."
 ICE_ikarus:0 "Операция «Икар»"
 ICE_ikarus_desc:0 "[GER.GetNameDefCap] Он выразил заинтересованность в нашем стратегическом расположении и расовой чистоте нашего народа. Мы должны присоединиться к ним в их праведной войне против капиталистов и коммунистов."
 ICE_vikings:0 "Наследники норманнов"
 ICE_vikings_desc:0 "Исландский народ является самым выносливым и сильным из всех людей в мире. Мы – потомки древних скандинавов. Слабая кровь не проходит через наши вены. Пришло время вернуть то, что принадлежит нам по праву крови, и, как наши предки до нас, мы приведем смерть к тем, кто осмелится противостоять нам."
 ICE_com_rallies:0 "Коммунистические митинги"
 ICE_com_rallies_desc:0 "Коммунизм набирает силу, и народ демонстрирует поддержку массовыми митингами и резким ростом продаж коммунистических журналов и газет. Скоро он одолеет своих буржуазных угнетателей!"
 ICE_ger_coop:0 "[GER.GetAdjective] Программа сотрудничества"
 ICE_ger_coop_desc:0 "[GER.GetNameDefCap] располагает одной из самых эффективных армий в мире. Наш народ даёт лучших солдат — этим следует воспользоваться."
 ICE_ger_tech:0 "[GER.GetAdjective] Технология"
 ICE_ger_tech_desc:0 "[GER.GetNameDefCap]Ученые - лучшие в мире. Если мы привезем их сюда, мы сможем обучить следующее поколение великих ученых, введя мир в исландскую эпоху!"
 ICE_com_takeover:0 "Коммунистическое правительство"
 ICE_com_takeover_desc:0 "Народ больше не может ждать; мы должны взять дело в свои руки. Нынешнее правительство следует заменить теми, кто принимает революцию."
 ICE_join_com:0 "Вступить в Коминтерн"
 ICE_join_com_desc:0 "Хотя наша коммунистическая партия уже входит в Коминтерн, как страна мы не имеем официальных отношений с [SOV.GetNameDef]. Следует исправить это и формализовать связи с [SOV.GetNameDef]."
 ICE_sov_tech:0 "[SOV.GetAdjective] Наука"
 ICE_sov_tech_desc:0 "[SOV.GetNameDefCap] собрал учёных со всего мира, и они готовы помочь нам привести страну в современную рабочую эпоху."
 ICE_sov_group:0 "[SOV.GetAdjective] Волонтеры"
 ICE_sov_group_desc:0 "При всём величии Исландии ей не хватает людских ресурсов. Возможно, [SOV.GetNameDef] согласится прислать «добровольцев» для защиты наших общих интересов?"
 ICE_com_kill_oppressors:0 "Поменяться ролями"
 ICE_com_kill_oppressors_desc:0 "Дания управляла нашими землями в течение сотен лет, принося тяготы и отчаяние нашему народу. Теперь, с помощью [SOV.GetNameDef]Настало время освободить [DEN.GetADjective] Работники их угнетающих повелителей, чтобы они знали ту же свободу, что и мы!"
 ICE_ally_tech:0 "Исследовательские группы Союзников"
 ICE_ally_tech_desc:0 "Демократия лучше всего способствует научному прогрессу, и ещё никогда это не было столь очевидно. Наших учёных поразили впечатляющие достижения союзников. Теперь пора использовать их на благо собственной страны."
 ICE_shieldmaidens_desc:0 "В прошлом викинги отправляли женщин в бой. Яростные, как тигры, и вдвое смертоноснее, девы щита внушали страх всей средневековой Европе. Лишь справедливо, чтобы [ICE.GetNameDef] как законный наследник норманнов продолжила эту традицию. Женщины, к оружию — вас ждёт битва!"
 ICE_shieldmaidens:0 "Сформировать легионы дев щита"
 ICE_national_def_force:0 "Создать Национальные силы обороны"
 ICE_national_def_force_desc:0 "В вопросах обороны мы полностью зависим от [DEN.GetNameDef]. Это неприемлемо; следует начать создание собственной армии."
 ICE_train_reserves:0 "Подготовить резервные силы"
 ICE_train_reserves_desc:0 "Теперь, когда у нас есть Национальные силы обороны и подготовленные для них офицеры, пора обучить резервистов."
 ICE_look_into_armour:0 "Доктрина полной механизации"
 ICE_look_into_armour_desc:0 "[ICE.GetNameDefCap] располагает выносливыми солдатами, но это не компенсирует нехватку людей. Нам следует изучить возможности применения бронетехники."
 ICE_look_into_special:0 "Доктрина элитных войск"
 ICE_look_into_special_desc:0 "[ICE.GetNameDefCap] не может сравниться с другими странами численностью, зато один наш солдат стоит десятков чужих. Чтобы воспользоваться этим преимуществом, следует создать сильные специализированные части для борьбы с любым врагом."
 ICE_reserve_focus:0 "Упор на оборону острова"
 ICE_reserve_focus_desc:0 "[ICE.GetNameDefCap] не располагает ресурсами, чтобы переносить войну на территорию противника. Вместо этого следует сосредоточиться на защите прекрасного острова от захватчиков."
 ICE_mountain_focus:0 "По суше"
 ICE_mountain_focus_desc:0 "Суровый рельеф Исландии идеально закаляет самых сильных и выносливых людей. Сражаясь среди холмов и гор, мы не позволим врагу выбить нас с позиций и всегда будем заставать его врасплох."
 ICE_on_sea:0 "По морю"
 ICE_on_sea_desc:0 "Жители Исландии с детства окружены океаном. Вместе с нашими морскими традициями это делает исландцев готовыми сражаться и на море, и на суше."
 ICE_by_air:0 "По воздуху"
 ICE_by_air_desc:0 "Наши предки были первопроходцами морских вторжений, но времена изменились. Воздух приходит на смену морю, и нам следует вновь оседлать будущее войны."
 ICE_special_done:0 "Передовые элитные войска"
 ICE_special_done_desc:0 "Наши бойцы подготовлены лучше всех в мире, каждый является лучшим в своей специализации. Но что, если обучить каждого солдата действовать эффективно не только в одной области, а во всех?"
 ICE_mobile_warfare:0 "Манёвренная война"
 ICE_mobile_warfare_desc:0 "В последнее время война всё сильнее зависит от техники и мобильности. Если мы хотим создать полностью бронетанковые силы, нужно изучить наиболее эффективные способы применения машин."
 ICE_heavy_armour:0 "Тяжёлая бронетехника"
 ICE_heavy_armour_desc:0 "Ключ к победе — тяжёлая непробиваемая броня. Враг не сможет уничтожить то, что не способен пробить."
 ICE_mobile_armour:0 "Мобильная бронетехника"
 ICE_mobile_armour_desc:0 "Толстая броня способна остановить пули, но никакая толщина не поможет против врага, находящегося за многие километры. Нам нужна бронетехника, которая сможет не только сражаться, но и быстро добираться до противника."
 ICE_pure_armour:0 "Полностью бронетанковые силы"
 ICE_pure_armour_desc:0 "Упор на полностью бронетанковые силы обеспечил превосходство наших войск. Сталь вечна!"
 ICE_local_militia:0 "Сформировать местное ополчение"
 ICE_local_militia_desc:0 "Даже в современную эпоху Исландия остаётся преимущественно сельской страной. Это затрудняет оборону обычными вооружёнными силами, но организация местного ополчения, способного сражаться с врагом повсюду, значительно улучшит наши оборонительные возможности."
 ICE_island_defence:0 "Инициатива по обороне острова"
 ICE_island_defence_desc:0 "Чтобы защитить Исландию от врагов, мы должны укрепить её оборону. Противник не должен захватить ни одного пляжа и продвинуться ни на одну милю. Мы установим мины, протянем колючую проволоку и построим укрепления."
 ICE_propaganda:0 "Пропагандистская кампания"
 ICE_propaganda_desc:0 "Они идут не только за нашей землёй — они идут за нашими женщинами и детьми. Они хотят засолить почву и уничтожить наши поселения. [ICE.GetNameDefCap] исчезнет, если каждый мужчина, каждая женщина и каждый ребёнок не приложат все силы, чтобы сорвать замыслы врага!"
 ICE_advanced_weapons:0 "Передовое вооружение"
 ICE_advanced_weapons_desc:0 "Если мы не можем превзойти врага числом, то превзойдём его мастерством и оружием!"
 ICE_establish_ifv:0 "Основать "
 ICE_create_ifv:0 "Создать «Исланд Фюрсту Вопнин»"
 ICE_create_ifv_desc:0 "Слишком долго Исландия зависела от иностранного оружия и технологий. Нам следует создать собственную оружейную компанию [ICE.GetAdjective]! Наше будущее принадлежит нам и только нам!"
 ICE_coastguard:0 "Расширить береговую охрану"
 ICE_coastguard_desc:0 "[ICE.GetNameDefCap]Основная сила обороны, береговая охрана Исландии, неустанно работает как бастион нашей страны против тех, кто причинит нам вред, но они преступно недоукомплектованы. Пришло время изменить это."
 ICE_sea_air:0 "К морю по воздуху"
 ICE_sea_air_desc:0 "Воздух — будущее войны, и как островная страна мы должны уничтожать врага ещё до того, как он достигнет наших берегов. К морю, ребята — мы прибываем по воздуху!"
 ICE_air_and_sea:0 "Суша и море"
 ICE_land_and_sea_desc:0 "Мы не можем позволить авиации сосредоточиться только на море; необходимо также думать об обороне материка! Единственный прорыв способен обернуться катастрофой для страны. Мы обязаны предотвратить это любой ценой."
 ICE_land_and_sea:0 "Суша и море"
 ICE_air_doctrine:0 "Создать единую воздушную доктрину"
 ICE_air_doctrine_desc:0 "[ICE.GetNameDefCap] лишь недавно вступила в борьбу за небо, но мы уже понимаем, что отсутствие чёткого видения вредит нам. Если мы хотим господствовать в воздухе, необходимо закрепить наши методы воздушной войны."
 ICE_build_dock:0 "Построить настоящие верфи"
 ICE_build_dock_desc:0 "У [ICE.GetNameDef] есть несколько небольших верфей, но они несопоставимы с верфями других стран. Если мы хотим строить корабли значительных размеров, необходимо создать полноценную судостроительную базу."
 ICE_dockyards_2:0 "Расширить верфи"
 ICE_dockyards_2_desc:0 "Новые верфи наконец завершены, и мы можем начать наращивать флот береговой охраны. Теперь остаётся лишь расширить их."
 ICE_ships:0 "Начать строительство крупных кораблей"
 ICE_ships_desc:0 "В прошлом для обороны нам приходилось устанавливать пушки на траулеры. Пора обзавестись настоящим флотом с настоящими кораблями."
 ICE_carrier:0 "ПРОЕКТ: «Маувур»"
 ICE_carrier_desc:0 "После многих месяцев проектирования и разработки мы наконец создали проект совершенного морского авианосца. Он потребует всех ресурсов страны, но после завершения сделает нас неуязвимыми!"
 ICE_sub:0 "Подводные операции"
 ICE_sub_desc:0 "Наши моря уязвимы перед вражескими флотами и кораблями, однако ресурсов для равного сражения у нас нет. Строительство подводных лодок должно частично снизить эту угрозу."
 ICE_from_afar:0 "Смерть издалека"
 ICE_from_afar_desc:0 "Наши учёные открыли новый способ движения, известный как «ракетная техника». Теоретически способные преодолеть значительную часть земного шара, ракеты позволят наносить удары по врагам, не подвергая опасности ни одного солдата [ICE.GetAdjective]!"
 ICE_nuke:0 "Тяжёлая вода"
 ICE_nuke_desc:0 "Исследуя основы материального мира, группа учёных сделала почти фантастическое открытие. Возможно, сам строительный элемент Вселенной — атом — удастся превратить в оружие разрушительной силы, превосходящей самые смелые представления."
 ICE_expand_rocketry:0 "Расширить ракетную программу"
 ICE_expand_rocketry_desc:0 "Наши исследования ракет дали превосходные результаты; необходимо направить на этот проект как можно больше ресурсов!"
 ICE_nav_doc:0 "Определить задачи береговой охраны"
 ICE_nav_doc_desc:0 "Береговая охрана защищает [ICE.GetNameDef] от всех угроз, внешних и внутренних, но каковы именно её полномочия? На что распространяется её юрисдикция и каким тактикам следует уделять внимание? На эти вопросы необходимо ответить, чтобы обеспечить эффективность береговой охраны."
 ICE_screen_ships:0 "Создать силы прикрытия"
 ICE_screen_ships_desc:0 "[ICE.GetNameDefCap]Береговая охрана требует эффективных и современных сил контроля."
 ICE_anti_sub:0 "Охотники на волков"
 ICE_anti_sub_desc:0 "Подводные лодки угрожают нашему существованию, охотясь на жизненно важные торговые и рыболовные суда. Пора показать этим «волчьим стаям», кто здесь настоящий хозяин."
 ICE_fighting_ships:0 "Боевые корабли"
 ICE_fighting_ships_desc:0 "[ICE.GetNameDefCap] должна быть способна защититься от любого, кто желает ей зла. Мы обязаны предоставить береговой охране достаточно крупные корабли для нашей защиты."
 ICE_coast_guard:0 "[ICE.GetNameDefCap]Военно-морской флот"
 ICE_coast_guard_desc:0 "[ICE.GetNameDefCap]Береговая охрана не является флотом в полном смысле этого слова. Они защищают наши берега и наше небо, но их работа по-прежнему связана с охраной. Пришло время решить, являются ли они охранными силами или военно-морскими и военно-воздушными силами. [ICE.GetNameDef]."
 ICE_steel_mill:0 "Сталелитейный завод [ICE.GetAdjective]"
 ICE_steel_mill_desc:0 "До сих пор Исландии не хватало инфраструктуры и технологий для создания полноценного сталелитейного завода. Теперь у нас есть и то и другое, и мы должны этим воспользоваться."
 ICE_discoveries:0 "Промышленная мысль"
 ICE_discoveries_desc:0 "Многие годы Исландия отставала от других стран в строительстве крупных современных объектов. Однако исследования новых строительных технологий и методов привели к прорывам по всей стране."
 ICE_disloyal:0 "Нелояльный субъект"
 ICE_disloyal_desc:0 "Эта страна желает освободиться от своего сюзерена, хотя и не обязательно немедленно."
 ICE_disloyal_democratic:0 "Нелояльный субъект"
 ICE_disloyal_democratic_desc:0 "Эта страна желает освободиться от своего сюзерена. Она активно распространяет республиканскую риторику, чтобы добиться этого."
 ICE_disloyal_democratic2:0 "Нелояльный субъект"
 ICE_disloyal_democratic2_desc:0 "Эта страна желает освободиться от своего сюзерена. Она активно распространяет республиканскую риторику, чтобы это произошло как можно скорее."
 ICE_disloyal_communism:0 "Нелояльный субъект"
 ICE_disloyal_communism_desc:0 "Эта страна желает освободиться от своего сюзерена. Для достижения цели она продвигает идеи прав рабочих и освобождения от угнетателей."
 ICE_disloyal_communism2:0 "Нелояльный субъект"
 ICE_disloyal_communism2_desc:0 "Эта страна желает освободиться от своего сюзерена. Для достижения цели она продвигает идеи прав рабочих и освобождения от угнетателей."
 ICE_disloyal_fascism:0 "Нелояльный субъект"
 ICE_disloyal_fascism_desc:0 "Эта страна желает освободиться от своего сюзерена. Национализм и идеи превосходства стали постоянной частью общественных споров, а некоторые протесты уже переросли в насилие."
 ICE_disloyal_fascism2:0 "Нелояльный субъект"
 ICE_disloyal_fascism2_desc:0 "Эта страна желает освободиться от своего сюзерена. Национализм и идеи превосходства стали постоянной частью общественных споров, а некоторые протесты уже переросли в насилие."
 ICE_internal_conflicts:0 "Внутрипартийные конфликты"
 ICE_internal_conflicts_desc:0 "Хотя правящая партия демонстрирует врагам единство, её ослабляют внутренние распри и разногласия."
 ICE_fascist_youth:0 "Молодёжные программы"
 ICE_fascist_youth_desc:0 "Молодёжь — будущее этой страны; её необходимо подготовить к защите родины всеми силами."
 ICE_ger_mil:0 "Советники [GER.GetAdjective]"
 ICE_ger_mil_desc:0 "Опытные офицеры [GER.GetAdjective] консультируют вооружённые силы этой страны."
 ICE_recycle:0 "Программы переработки"
 ICE_recycle_desc:0 "Эта страна строго придерживается принципа «не растрачивать и не нуждаться», используя каждый доступный материал и осуждая любые отходы, которые невозможно применить повторно."
 ICE_den_investment:0 "Инвестиции [DEN.GetAdjective]"
 ICE_den_investment_desc:0 "[DEN.GetNameDefCap] напрямую заинтересована в этой стране."
 ICE_den_investment2:0 "Инвестиции [DEN.GetAdjective]"
 ICE_den_investment2_desc:0 "[DEN.GetNameDefCap] напрямую заинтересована в этой стране."
 ICE_den_investment3:0 "Инвестиции [DEN.GetAdjective]"
 ICE_den_investment3_desc:0 "[DEN.GetNameDefCap] напрямую заинтересована в этой стране."
 ICE_icelandic_neutrality:0 "Нейтралитет: [ICE.GetAdjective]"
 ICE_icelandic_neutrality_desc:0 "Эта страна твёрдо верит в свой нейтралитет и вряд ли вступит в какую-либо войну."
 ICE_icelandic_neutrality2:0 "Исландский нейтралитет"
 ICE_icelandic_neutrality2_desc:0 "Эта страна твёрдо верит в свой нейтралитет; если на неё не нападут напрямую, она никогда не вступит в войну и будет всеми силами защищать эту позицию."
 ICE_armour_focused:0 "Доктрина полной механизации"
 ICE_armour_focused_desc:0 "Эта страна перешла к полностью механизированной армии."
 ICE_mountain_strong:0 "Регулярные горные части"
 ICE_mountain_strong_desc:0 "Атака горных стрелков по мягким целям: §G+5%§!\nНеобходимое пехотное снаряжение для горных стрелков: §G-40§!"
 ICE_marine_strong:0 "Регулярная морская пехота"
 ICE_marine_strong_desc:0 "Атака морской пехоты по мягким целям: §G+5%§!\nНеобходимое пехотное снаряжение для морской пехоты: §G-50§!"
 ICE_para_strong:0 "Регулярные десантники"
 ICE_para_strong_desc:0 "Атака десантников по мягким целям: §G+5%§!\nНеобходимое пехотное снаряжение для десантников: §G-30§!"
 ICE_elite_forces_1:0 "Элитная армия"
 ICE_elite_forces_2:0 "Элитные войска"
 ICE_elite_forces_2_desc:0 "Атака горных стрелков по мягким целям: §G+5%§!\nНеобходимое пехотное снаряжение для горных стрелков: §G-40§!\nАтака морской пехоты по мягким целям: §G+5%§!\nНеобходимое пехотное снаряжение для морской пехоты: §G-50§!\nАтака десантников по мягким целям: §G+5%§!\nНеобходимое пехотное снаряжение для десантников: §G-30§!"
 ICE_home_defense:0 "Оборона родины"
 ICE_home_defense2:0 "Оборона родины"
 ICE_home_defense3:0 "Оборона родины"
 ICE_home_defense4:0 "Оборона родины"
 ICE_home_defense5:0 "Оборона родины"
 ICE_home_defense6:0 "Оборона родины"
 ICE_home_defense7:0 "Оборона родины"
 ICE_home_defense8:0 "Оборона родины"
 ICE_home_defense9:0 "Оборона родины"
 ICE_home_defense10:0 "Оборона родины"
 ICE_home_defense11:0 "Оборона родины"
 ICE_home_defense12:0 "Оборона родины"
 ICE_akureyi:0 "Учебная школа Акюрейри"
 ICE_akureyi_desc:0 "Эта расположенная в Исландии школа обучает новобранцев сражаться даже в самых суровых условиях."
 ICE_idea_shieldmaidens:0 "Девы щита"
 ICE_idea_shieldmaidens_desc:0 "Эта страна активно призывает женщин в армию и отправляет их сражаться на передовой."
 ICE_war_economics:0 "Полная военная экономика"
 ICE_wolf_hunter:0 "Охотники на волков"
 ICE_geothermic_banana_production:0 "Геотермальное производство бананов"
 ICE_geothermic_banana_production_desc:0 "Доступность геотермальных источников благодаря вулканизму острова должна позволить нам создать подходящие условия для выращивания умеренного количества тропических фруктов, особенно бананов, и сократить зависимость от импорта."
 ICE_stefan_stefansson:0 "Стефаун Стефаунссон"
 ICE_olafur_johannesson:0 "Оулавюр Йоуханнессон"
 ICE_eidur_kvaran:0 "Эйдюр Кваран"
 ICE_bjorn_bordarson:0 "Бьёрн Тоурдарсон"
 ICE_agnar_hansen:0 "Агнар Хансен"
 ICE_borsteinn_jonsson:0 "Торстейнн Йоунссон"
 ICE_bjorn_bjornsson:0 "Бьёрн Бьёрнссон"
 ICE_olafur_sveinsson:0 "Оулавюр Свейнссон"
 ICE_richard_thors:0 "Рихард Торс"
 ICE_johannes_snorrason:0 "Йоуханнес Сноррасон"
 ICE_erling_ellingsen:0 "Эрлинг Эллингсен"
 ICE_thor_jensen:0 "Тор Йенсен"
 ICE_IFV:0 "Исланд Фюрсту Вопнин"
 ICE_kveldulfur:0 "Квёльдульвюр"
 ICE_KEA:0 "КЕА"
 ICE_skeljung:0 "Нефтяная компания «Скельюнг»"
 ICE_siminn:0 "Симинн"
 ICE_flugfelag_akureyrar:0 "Флюгфелаг Акюрейрар"
 ICE_asgeir_asgeirsson:0 "Аусгейр Аусгейрссон"
 ICE_jon_baldvinsson:0 "Йоун Бальдвинссон"
 ICE_tryggvi_porhallsson:0 "Трюггви Тоурхальссон"
 ICE_combined_arms:0 "В воздухе и на море"
 ICE_naval_supremacy:0 "Господство на море"
 SCA_iceland.1:0 "Рассмотреть вторжение в [ICE.GetNameDef]"
 SCA_iceland.1.t:0 "Рассмотреть вторжение в [ICE.GetNameDef]"
 SCA_iceland.1.desc:0 "Дания пала, но её субъект, [ICE.GetNameDef], по-прежнему свободен от вмешательства [GER.GetAdjective]. Однако у нас есть надёжные сведения, что [GER.GetNameDef] может быть заинтересована в Исландии как плацдарме для вторжения в Шотландию. Несмотря на все усилия наших дипломатов, [ICE.GetNameDef] сохраняет твёрдый нейтралитет. Это вызвало призывы к вторжению в [ICE.GetNameDef], чтобы принудить её к сотрудничеству."
 SCA_iceland.1.a:0 "[ICE.GetNameDefCap] не должна достаться [GER.GetNameDef]!"
 SCA_iceland.1.b:0 "Мы должны уважать их решение."
 SCA_iceland.2:0 "[ENG.GetNameDefCap] выдвигает требования"
 SCA_iceland.2.t:0 "[ENG.GetNameDefCap] требует нашего сотрудничества"
 SCA_iceland.2.desc:0 "[ENG.GetNameDefCap] предъявила нам ультиматум: либо мы позволим её войскам разместиться в нашей стране и пользоваться портами, либо она заставит нас силой."
 SCA_iceland.2.a:0 "Похоже, выбора у нас нет."
 SCA_iceland.2.b:0 "НИКОГДА! ([ENG.GetNameDefCap] объявляет войну [Root.GetNameDef])"
 SCA_iceland.3:0 "[ICE.GetNameDefCap] подтверждает поддержку демократии"
 SCA_iceland.3.t:0 "[ICE.GetNameDefCap] подтверждает поддержку демократии"
 SCA_iceland.3.desc:0 "Стремясь заручиться поддержкой, лидер партии «Альтидуфлоккуринн» заявил о поддержке полной независимости Исландии и призвал как можно скорее провести референдум. Руководители остальных партий поддержали этот призыв."
 SCA_iceland.3.a:0 "СВОБООООДА!"
 SCA_iceland.3.a.tt:0 "Партия «Сьяульфстедисфлоккуринн» становится демократической."
 SCA_iceland.4:0 "[ICE.GetNameDefCap] запрашивает добровольцев"
 SCA_iceland.4.t:0 "[ICE.GetNameDefCap] запрашивает добровольцев"
 SCA_iceland.4.desc:0 "Один из наших небольших партнёров, [ICE.GetNameDef], запросил добровольцев для продвижения революции. Хотя страна не обладает большой силой, [ICE.GetNameDef] находится рядом с Британскими островами в исключительно стратегическом месте. Отправка людей может стать отличным способом подготовиться к возможному столкновению с империалистами."
 SCA_iceland.4.a:0 "Мы дадим им столько людей, сколько сможем!"
 SCA_iceland.4.b:0 "Мы можем помочь нашему маленькому другу."
 SCA_iceland.4.c:0 "Мы можем лишь обеспечить транспорт желающим отправиться туда."
 SCA_iceland.5:0 "[SOV.GetNameDefCap] отправляет множество добровольцев"
 SCA_iceland.5.t:0 "[SOV.GetNameDefCap] отправляет множество добровольцев"
 SCA_iceland.5.desc:0 "[SOV.GetNameDefCap] весьма положительно ответила на нашу просьбу о добровольцах. Она направила более 300 000 человек и достаточно припасов, чтобы снабжать их несколько лет. В послании [SOV.GetLeader] желает нам удачи в борьбе против фашистов и империалистов."
 SCA_iceland.5.a:0 "[SOV.GetNameDefCap] щедра!"
 SCA_iceland.6:0 "[SOV.GetNameDefCap] отправляет некоторое число добровольцев"
 SCA_iceland.6.t:0 "[SOV.GetNameDefCap] отправляет некоторое число добровольцев"
 SCA_iceland.6.desc:0 "[SOV.GetNameDefCap] положительно ответила на нашу просьбу о добровольцах. К нашим берегам направлены мощные силы численностью 100 000 человек вместе с продовольствием. Нам желают удачи в наших начинаниях."
 SCA_iceland.6.a:0 "Благодарим [SOV.GetNameDef]."
 SCA_iceland.7:0 "[SOV.GetNameDefCap] отправляет немного добровольцев"
 SCA_iceland.7.t:0 "[SOV.GetNameDefCap] отправляет немного добровольцев"
 SCA_iceland.7.desc:0 "[SOV.GetNameDefCap] ответила на нашу просьбу о добровольцах. [SOV.GetLeader] прислал письмо с извинениями за невозможность официально направить людей. Однако [SOV.GetLeader] сообщает, что удалось обеспечить транспорт и некоторые припасы для тех, кто пожелал отправиться к нашим берегам."
 SCA_iceland.7.a:0 "Лучше, чем ничего."
 SCA_iceland.8:0 "Фашистский переворот"
 SCA_iceland.8.t:0 "Переворот «Флоккур Тьодерниссинна»"
 SCA_iceland.8.desc:0 "Сегодня члены «Флоккур Тьодерниссинна» совершили внезапный переворот против правительства. Заявив, что выражают «волю народа», Гисли Сигурбьёрнссон провозгласил себя новым главой правительства, которое будет перестроено от парламентской модели к корпоративной во главе с самим Гисли Сигурбьёрнссоном. Хотя ходят слухи о разногласиях внутри партии, её господство пока неоспоримо."
 SCA_iceland.8.a:0 "Мы поведём Исландию в новую эпоху величия."
 SCA_iceland.9:0 "Спор о задачах береговой охраны"
 SCA_iceland.9.t:0 "Спор о задачах береговой охраны"
 SCA_iceland.9.desc:0 "[ICE.GetNameDefCap]Береговая охрана не является флотом в полном смысле этого слова. Они защищают наши берега и наше небо, но их работа по-прежнему связана с охраной. Пришло время решить, являются ли они охранными силами или военно-морскими и военно-воздушными силами. [ICE.GetNameDef]."
 SCA_iceland.9.a:0 "И тем и другим."
 SCA_iceland.9.b:0 "Прежде всего это наш флот."
 SCA_iceland.100:0 "Нейтралитет [ICE.GetNameDef]"
 SCA_iceland.100.t:0 "Нейтралитет [ICE.GetNameDef]"
 SCA_iceland.100.desc:0 "[DEN.GetNameDefCap], наш партнёр по унии Дании и Исландии, пала под натиском захватчиков [GER.GetAdjective]. Хотя правительство осталось прежним, мы не можем прислушиваться к его словам, ведь теперь они исходят из уст [GER.GetNameDef]. [ICE.GetNameDefCap] сохраняет нейтралитет, но сражения всё ближе подходят к нашим берегам, и некоторые требуют помочь отомстить за павших братьев."
 SCA_iceland.100.a:0 "Мы сохраним нейтралитет."
 SCA_iceland.100.b:0 "Силы [GER.GetAdjective] перешли все границы; к войне!"
 SCA_can_decline_tt:0 "Устанавливает правило: £trigger_yes можно отклонять призывы к оружию.\n"
