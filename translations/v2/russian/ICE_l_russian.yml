 ICE_like_us:0 "Связи с [USA.GetAdjective]"
 ICE_like_us2:0 "Связи с [USA.GetAdjective]"
 ICE_elite_mountaineers:0 "Элитные горные стрелки"
 ICE_elite_mountaineers_desc:0 "Благодаря передовой тактике и умелому использованию местных ресурсов наши горные стрелки теперь способны эффективнее сражаться с противником, расходуя меньше ресурсов."
 ICE_elite_marines:0 "Элитная морская пехота"
 ICE_elite_marines_desc:0 "Благодаря передовой тактике и умелому использованию местных ресурсов наша морская пехота теперь способна эффективнее сражаться с противником, расходуя меньше ресурсов."
 ICE_elite_paratroopers:0 "Элитные десантники"
 ICE_elite_paratroopers_desc:0 "Благодаря передовой тактике и умелому использованию местных ресурсов наши десантники теперь способны эффективнее сражаться с противником, расходуя меньше ресурсов."
 ICE_elite_infantry_tech:0 "Элитная пехота"
 ICE_elite_infantry_tech_desc:0 "Наши спецназовцы признаны лучшими практически повсеместно. Хотя их немного, наши люди мотивированы и обучены не только своей профессии, но и профессии своих коллег по спецназу. Возможно, пришло время создать регулярное [ICE.GetAdjective] Армия делает то, что обычно считается специализированным."
 DEN_ICE_research_group:0 "[DEN.GetAdjective]-[ICE.GetAdjective] Университетская программа обмена"
 DEN_ICE_research_group_desc:0 "Сокращает время исследования технологий, уже изученных государствами [DEN.GetNameDef] и [ICE.GetNameDef]."
 DEN_ICE_research_group2:0 "[DEN.GetAdjective]-[ICE.GetAdjective] Комплексная программа обмена"
 DEN_ICE_research_group2_desc:0 "Сокращает время исследования технологий, уже изученных государствами [DEN.GetNameDef] и [ICE.GetNameDef]."
 ICE_elite_infantry:0 "Ифирстетт Фоутгёйнгюлид"
