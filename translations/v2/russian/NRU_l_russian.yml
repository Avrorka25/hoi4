l_russian:
 NRU_commander_ridge_phosphate:0 "Фосфатные залежи Комманд-Ридж"
 NRU_commander_ridge_phosphate_desc:0 "Комманд-Ридж, или пик Джанор по-науруански, — высшая точка острова, и именно здесь находится большая часть фосфатов.\n\nДобыча фосфатов на Науру ведётся европейскими державами с тех пор, как Германия оккупировала остров во время Науруанской гражданской войны.\nФосфаты приносят Науру как выгоды, так и проблемы, поэтому нам необходимо следить, чтобы добыча не была ни чрезмерной, ни слишком малой, иначе экономика может рухнуть."
 NRU_commander_ridge_phosphate_2:0 "Фосфатные залежи Комманд-Ридж"
 NRU_commander_ridge_phosphate_2_desc:0 "Комманд-Ридж, или пик Джанор по-науруански, — высшая точка острова, и именно здесь находится большая часть фосфатов.\n\nДобыча фосфатов на Науру ведётся европейскими державами с тех пор, как Германия оккупировала остров во время Науруанской гражданской войны.\nФосфаты приносят Науру как выгоды, так и проблемы, поэтому нам необходимо следить, чтобы добыча не была ни чрезмерной, ни слишком малой, иначе экономика может рухнуть."
 NRU_commander_ridge_phosphate_3:0 "Фосфатные залежи Комманд-Ридж"
 NRU_commander_ridge_phosphate_3_desc:0 "Комманд-Ридж, или пик Джанор по-науруански, — высшая точка острова, и именно здесь находится большая часть фосфатов.\n\nДобыча фосфатов на Науру ведётся европейскими державами с тех пор, как Германия оккупировала остров во время Науруанской гражданской войны.\nФосфаты приносят Науру как выгоды, так и проблемы, поэтому нам необходимо следить, чтобы добыча не была ни чрезмерной, ни слишком малой, иначе экономика может рухнуть."
 NRU_reap_the_benefits_idea:0 "Пожинаем плоды"
 NRU_phosphate_reservers:0 "Науруанская торговля фосфатами"
 NRU_phosphate_reservers_majors:0 "Науруанская торговля фосфатами"
 NRU_tribal_council:0 "Вожди Науру"
 NRU_tribal_council_desc:0 "На Науру существует 10 племён, каждое со своим вождём, подчиняющимся королю. Это §YЭамвит, Эамвитмвит, Эаору, Эамвидара, Ирува, Эано, Дейбое, Ранибок, Эмеа и Эмангум.§!"
 NRU_oppression_of_opposition:0 "Подавление оппозиции"
 NRU_riots_of_48:0 "Науруанские беспорядки"
 NRU_establish_nauru_pacific_line:0 "Создать Тихоокеанскую линию Науру"
 NRU_establish_nauru_pacific_line_desc:0 "Создание Тихоокеанской линии Науру жизненно важно, чтобы мы могли торговать с другими странами и обеспечивать собственное существование."
 NRU_continue_phosphate_mining:0 "Продолжить добычу фосфатов"
 NRU_continue_phosphate_mining_desc:0 "Фосфаты добываются на Науру уже много лет. Они являются нашим главным и, возможно, ЕДИНСТВЕННЫМ источником дохода. Если мы прекратим добычу, то можем погрузиться в кризис сильнее любого прежнего."
 NRU_further_phosphate_extraction:0 "Добыча фосфатов"
 NRU_further_phosphate_extraction_desc:0 "Добыча фосфатов — наш первый шаг как новой страны на пути к развитию."
 NRU_futher_phosphate_extracion_two:0 "Дальнейшая добыча фосфатов"
 NRU_futher_phosphate_extracion_two_desc:0 ""
 NRU_researchers_abroad:0 "Пригласить исследователей из-за рубежа"
 NRU_researchers_abroad_desc:0 "Приглашение зарубежных исследователей может значительно помочь нам в экономических вопросах."
 NRU_start_exporting_phosphate:0 "Подготовка к экспорту"
 NRU_start_exporting_phosphate_desc:0 "Мы начали крупномасштабную добычу фосфатов. Возможно, пришло время открыться миру?"
 NRU_free_market:0 "Свободный рынок"
 NRU_free_market_desc:0 "Откроемся свободному рынку!"
 NRU_reap_the_benefits:0 "Пожинать плоды"
 NRU_reap_the_benefits_desc:0 "Мы сделали это. Мы продаём фосфаты так, будто завтра не наступит. Пора воспользоваться всеми выгодами и не оглядываться назад!"
 NRU_britian_phosphate:0 "Сблизиться с Западом"
 NRU_britian_phosphate_desc:0 "С наступлением нового десятилетия очевидно, что путь демократии будет направлять будущее во всем. Мы пойдем по этому пути, как наши соседи, и будем помогать нашим союзникам в создании основ демократии для народов будущего."
 NRU_japanese_phosphate:0 "Сотрудничество с Японией"
 NRU_japanese_phosphate_desc:0 "Япония доказала, что с ней лучше не связываться, и это касается и нас. Если мы будем продавать фосфаты японцам вместо попыток бороться с ними, возможно, нам удастся пережить японский натиск в Тихом океане."
 NRU_soviet_phosphate:0 "Немыслимое"
 NRU_soviet_phosphate_desc:0 "Россия становится всё сильнее, и, похоже, её интересы могут распространиться на Тихий океан. Если она действительно нацелится на завоевание моря, нам лучше оказаться на её стороне, чтобы избежать удара."
 NRU_autonomy_for_the_tribes:0 "Восстановить старую систему"
 NRU_autonomy_for_the_tribes_desc:0 "Старая система управления Науру основывалась на 12 вождях, управлявших своими племенами, и короле как главе государства, который при необходимости отдавал вождям приказы для исполнения своих законов. Эта система не применялась с тех пор, как Науру было захвачено во время Великой войны. Но теперь, после восстановления монархии, возможно, пришло время вернуться к прошлому."
 NRU_core_kiribati:0 "Интегрировать королевство Апемама"
 NRU_core_kiribati_desc:0 "Королевство Апемама было обращено британскими колонизаторами в пепел после провозглашения протектората над островами Гилберта. Это было нарушением всех прав и унижением гильбертцев. Но мы не должны позволить британцам уничтожить королевство без последствий. Преподадим им урок. Пусть увидят, на что способны апемамцы и науруанцы, когда они едины!"
 nauru.1.t:0 "Науру предлагает сделку по фосфатам"
 nauru.1.desc:0 "[NRU.GetNameDef] обратилась к нам с предложением покупать науруанские запасы фосфатов, которые считаются одними из самых качественных в мире, в обмен на экономические инвестиции в Науру. Было бы глупо отказываться, ведь сделка выгодна обеим сторонам.\nНо стоит ли вообще вкладываться в столь отдалённый остров, если более дешёвые фосфаты можно купить в другом месте?"
 nauru.1.a:0 "Почему бы и нет!"
 nauru.1.b:0 "Какая шутка..."
 nauru.2.t:0 "Науру предлагает сделку по фосфатам"
 nauru.2.desc:0 "[NRU.GetNameDef] обратилась к нам с предложением покупать науруанские запасы фосфатов, которые считаются одними из самых качественных в мире, в обмен на экономические инвестиции в Науру. Было бы глупо отказываться, ведь сделка выгодна обеим сторонам.\nНо стоит ли вообще вкладываться в столь отдалённый остров, если более дешёвые фосфаты можно купить в другом месте?"
 nauru.2.a:0 "Действительно было бы глупо."
 nauru.2.b:0 "Науру? Это ещё что?"
 nauru.3.t:0 "Сделки не будет!"
 nauru.3.desc:0 ""
 nauru.3.a:0 "Чёрт!"
 nauru.4.t:0 "Науру предлагает сделку по фосфатам"
 nauru.4.desc:0 "[NRU.GetNameDef] обратилась к нам с предложением покупать науруанские запасы фосфатов, которые считаются одними из самых качественных в мире, в обмен на экономические инвестиции в Науру. Было бы глупо отказываться, ведь сделка выгодна обеим сторонам.\nНо стоит ли вообще вкладываться в столь отдалённый остров, если более дешёвые фосфаты можно купить в другом месте?"
 nauru.4.a:0 "Действительно было бы глупо."
 nauru.4.b:0 "Кто они такие, чтобы продавать нам задорого птичий помёт?"
