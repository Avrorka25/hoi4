 POR_integrate_CAT:0 "Интеграция каталонцев"
 SPR_unify_iberia_decision:0 "Мадрид и Лисбоа, Унидос!"
 SPR_controls_all_iberian_states_tt:0 "Контролирует все §Yпортугальский§! штаты"
 SPR_cores_all_iberian_states_tt:0 "Прибавить ядра всем §Yпортугальский§! штаты"
 SPR_connect_historic_por_colonies:0 "Связать Анголу с Мозамбиком по суше"
 IBERIA_integrate_PA:0 "Интеграция пиренеев-атлантиков"
 IBERIA_integrate_ADR:0 "Интеграция Андорры"
 catalonia_decisions_category:0 "Каталонская федерация"
 ADR_integrate_valencia:0 "Интеграция Валенсии"
 ADR_integrate_balearic_islands:0 "Интеграция Балеарских островов"
 FRA_expanisonism_category:0 "Достижение Франции в Европе"
 FRA_expanisonism_category_desc:0 "В то время как реваншизм Франции ослабел в годы после Компьенского перемирия, наше влияние в Европе слабо по сравнению с нашими днями в качестве главной сухопутной державы Западной Европы. В свое время, возможно, наши законные земли будут возвращены, и Париж снова станет защитником ценностей, на которых стоит наша страна. Виве ла Франс!"
 FRA_core_wll:0 "Реинтегрировать Валлонию"
 FRA_core_wll_desc:0 "Долго-бельгийский регион Валлония имеет сильные культурные и исторические связи, а также лингвистическую связь с французским метропом. Несмотря на это, бельгийцы обладают сильной гражданской идентичностью, враждебностью к иностранному вмешательству и большим немецкоязычным меньшинством. На завершение интеграции во французский метроп потребуется время, но мы считаем, что это возможно."
 FRA_core_lux:0 "Реинтегрировать Люксембург"
 FRA_core_lux_desc:0 "Город-государство Люксембург много раз обменивался рукопожатием на протяжении всей истории, в первую очередь из-за его близости к множеству европейских держав. Несмотря на то, что он зарекомендовал себя как сильная личность, большая часть его населения говорит по-французски. На завершение интеграции во французский метроп потребуется время, но мы считаем, что это возможно."
 FRA_core_jura_mountains:0 "Женев, объединяйся с Парижем!"
 FRA_core_jura_mountains_desc:0 "Хотя Франция и не является неотъемлемой частью Франции на протяжении всей ее истории, почти все западная Швейцария — франкоязычная страна, этот факт мы можем использовать для оправдания интеграции во французский метроп. Несмотря на то, что швейцарцы зарекомендовали себя как сильные личности, мы считаем, что возможна интеграция."
 FRA_core_western_swiss_alps:0 "Сион, объединяйся с Парижем!"
 FRA_core_western_swiss_alps_desc:0 "Подавляющее большинство столичного района Сиона — франкоязычный, что мы можем использовать для оправдания интеграции во французский метрополитен. В то время как швейцарцы утвердили свою сильную идентичность, и несколько этнических меньшинств живут в окрестностях, мы считаем, что возможная интеграция возможна."
 FRA_claim_cataluna:0 "Предоставить каталонской автономии"
 FRA_claim_cataluna_desc:0 "Хотя Каталония никогда не была неотъемлемой частью Французской империи, она была важным холдингом. Более того, каталонцы много раз на протяжении всей истории обращались к французам за защитой. Мы можем использовать этот факт для интеграции Каталонии с уровнем автономии, который испанцы не смогли предоставить."
 FRA_cat_autonomy:0 "Каталонский автономный район"
 FRA_core_cataluna:0 "Интегрировать Кателонию"
 FRA_core_other_catalan_territories:0 "Интеграция Валенсии и Балеарских островов"
 FRA_push_germany_east:0 "Подтолкнуть Германию на Восток"
 FRA_push_germany_east_desc:0 "Одним из положений Версальского договора была демилитаризация немецкого региона Рейнланд, которая была нарушена правительством в Берлине. Из-за невыполнения своих обязательств Рейнская область должна вернуться под контроль Франции."
 FRA_push_italy_east:0 "Толкай Италию на восток"
 FRA_push_italy_east_desc:0 "Первая французская империя имела полный контроль над Итало-Пенинсульским регионом Пьемонта. Хотя мы изначально признали это изменение границ, ситуация явно изменилась. В результате Италия должна быть отодвинута на восток."
 swiss_partisans:0 "Швейцарская партизанская деятельность"
 walloon_partisans:0 "Валлонские партизаны"
 bel_expansionism_decision_category:0 "На пути к Великой Бельгии"
 bel_unify_with_lux:0 "Союз с Люксембургом"
 bel_unify_with_hol:0 "Северный Брабант, Голландия и Фрисландия; Бельгийцы навсегда!"
 bel_claim_nordpaspdepcalais:0 "Иск Кале"
 bel_expansionism_decision_category_desc:0 "Бельгия – одна из самых молодых стран Европы, родившаяся в результате восстания Амстердама. Пока мы жили в безопасности какое-то время, все было почти потеряно в безжалостной Великой войне. Возможно, теперь мы наконец-то сможем расшириться, потому что внешний мир может снова подвести Бельгию!"
 bel_unify_with_lux_desc:0 "Герцогство Люксембург имеет глубоко переплетенную историю с Бельгией, будучи совместными жертвами немецкой агрессии в Великой войне и исторически являясь частью многих из тех же самых союзов. Имея такую возможность, мы можем объединить город Люксембург и соединить их судьбу с нашей!"
 bel_unify_with_hol_desc:0 "Голландцы, когда-то угнетатели нашей нации и ее народа, находятся в Брюсселе. Возможно, теперь Голландия, Фрисландия и Северный Брабант могут окончательно отделиться от нашего союза, завершив наш союз низменных наций."
 bel_claim_nordpaspdepcalais_desc:0 "Историческая французская провинция Норд-пас-де-Кале является домом для значительного числа фламандских спикеров и была исторической частью графства Фландрия. Хотя полная интеграция в Бельгию будет затруднена, у нас есть оправданная основа для иска."
 AUS_viennas_reach_in_central_europe:0 "Досягаемость Вены в Центральной Европе"
 AUS_viennas_reach_in_central_europe_desc:0 "Договоры Сен-Жермен-ан-Лайе и Трианон разорвали молодую Австро-Венгерскую империю на части. Вена сегодня может быть меньше, но это слишком беспрепятственно. Возможно, теперь мы наконец-то восстановим наше присутствие в Центральной Европе."
 AUS_wien_und_budapest_wieder_vereint:0 "Вена и Будапешт, Видер Верайнт!"
 AUS_wien_und_budapest_wieder_vereint_desc:0 "Будапешт снова под нашим контролем! Этот день войдет в историю как конец мрачной эпохи Австрии и возрождение австро-венгерского братства."
 AUS_reintegrate_the_sudetenland:0 "Реинтеграция Судетской области"
 AUS_reintegrate_the_sudetenland_desc:0 "Большая часть региона Северной Богемии, известного как Судетская область, является немецкоязычной, благодаря своему времени под Священной Римской империей. Его жители были верными слугами Вены. Они будут снова!"
 AUS_grant_the_czechs_autonomy:0 "Предоставить чешской автономии"
 AUS_grant_the_czechs_autonomy_desc:0 "Земли Богемии и Моравии были историческими частями Австро-Венгерской империи, где они управлялись как часть самой Австрии. Что касается их самоопределения, то мы можем реинтегрировать их в автономный статус."
 AUS_grant_the_slovaks_autonomy:0 "Предоставить словацкой автономии"
 AUS_grant_the_slovaks_autonomy_desc:0 "Земли Словакии были историческими частями Австро-Венгерской империи, где годы мадьяризации под венгерским владычеством не смогли подорвать их национальную идентичность. С ними под нашим контролем мы можем реинтегрировать их с автономией, которую Венгрия никогда не предоставляла."
 AUS_reintegrate_kosice_and_carpathia_ruthenia:0 "Реинтеграция Кошице и Карпатии Рутении"
 AUS_reintegrate_kosice_and_carpathia_ruthenia_desc:0 "Многое из того, что было дано Словакии в Трианонском договоре, имеет большое венгерское меньшинство, если не абсолютное большинство. С этими землями под контролем, они могут быть интегрированы в Венгрию, цементируя их под Веной навсегда."
 AUS_reintegrate_the_vojvodina_into_hungary:0 "Реинтеграция Воеводины в Венгрию"
 AUS_reintegrate_the_vojvodina_into_hungary_desc:0 "Воеводина была давним регионом Венгрии, который, благодаря своему времени под властью Габсбургов, имеет большое венгерское и немецкое меньшинство сегодня. Мы считаем, что реинтеграция в Венгрию возможна."
 AUS_grant_the_slovenes_autonomy:0 "Предоставить словенской автономии"
 AUS_reintegrate_north_transylvania_into_hungary:0 "Северная Трансильвания возвращается в Венгрию"
 AUS_autonomy_for_the_banat_and_transylvania:0 "Автономия для Баната и Трансильвании"
 requires_transylvania_cores_aus_tt:0 "Является собственником §YТрансильвания§!, §YКрисана§!, §YБанат§!и §YЗападный Банат§!."
 AUS_grant_the_croatians_autonomy:0 "Предоставить хорватам автономию"
 AUS_grant_the_croatians_autonomy_desc:0 "Хорватские земли долгое время были важным владением Вены. Настолько, что во время большей части Австро-Венгерской империи предоставление им автономного статуса рядом с Венгрией было серьезным предложением. С их контролем мы, наконец, сможем реализовать эту давнюю амбицию."
 AUS_grant_the_bosnians_autonomy:0 "Предоставить боснийской автономии"
 AUS_integrate_bavaria:0 "Интеграция Баварии"
 AUS_integrate_bavaria_desc:0 "Хотя Бавария никогда не была отдельной от Австрийской или Австро-Венгерской империй, она находилась под почти полным контролем Вены во время ее пребывания в Германской Конфедерации. С этого дня наши южногерманские братья ответят не Берлину, а Вене."
 AUS_integrate_baden_wurttemberg:0 "Интеграция Баден-Вюртемберг"
 AUS_integrate_baden_wurttemberg_desc:0 "В то время как Баден-Вюртемберг никогда не был отдельно от Австрийской или Австро-Венгерской империй, он находился под почти полным контролем Вены во время своего пребывания в Германской Конфедерации. С этого дня наши южногерманские братья ответят не Берлину, а Вене."
 AUS_integrate_the_swiss_germans:0 "Интеграция швейцарских немцев"
 AUS_integrate_the_swiss_germans_desc:0 "Хотя Швейцария никогда не была отдельной от Австрийской или Австро-Венгерской империй, контроль Габсбургов над Швейцарией был далеко распространен, как и немецкий язык сегодня. В то время как швейцарцы имеют свою собственную, сильную национальную идентичность, с достаточным количеством времени и автономии, их интеграция может оказаться успешной."
 AUS_claim_galicia_lodomeria_and_the_bukovina:0 "Претензия Галиция-Лодомерия и Буковина"
 AUS_claim_galicia_lodomeria_and_the_bukovina_desc:0 "Хотя Галиция-Лодомерия и Буковина не были наиболее экономически важными регионами Австро-Венгрии, они были важными историческими владениями в восточных частях империи. Хотя их интеграция окажется трудной, наше историческое заявление является законным, и мы можем теперь снова нажать на него."
 aus_hungarian_autonomy:0 "Венгерская автономия"
 aus_czech_autonomy:0 "Чешская автономия"
 aus_slovak_autonomy:0 "Словацкая автономия"
 aus_swiss_autonomy:0 "Швейцарско-немецкая автономия"
 aus_transylvania_autonomy:0 "Трансильвания Автономия"
 aus_slovene_autonomy:0 "Словенская автономия"
 aus_croatian_autonomy:0 "Хорватская автономия"
 aus_bosnian_autonomy:0 "Боснийская автономия"
 romanian_expansionism_decision_category:0 "Румынский экспансионизм"
 romanian_expansionism_decision_category_desc:0 "Большая часть нашего времени с момента обретения независимости была потрачена на то, чтобы побороться за наши амбиции «Великой Румынии», объединив всех румыноязычных за одним флагом. Великая война во многом осуществила нашу мечту, захватив земли Трансильвании и Бессарабии. Несмотря на новый успех, нам еще предстоит реализовать свой потенциал в качестве восточноевропейского гиганта. Trăiască România!"
 rom_core_westbanat:0 "Интеграция Западного Баната"
 rom_claim_alfold:0 "Утверждать Тиса"
 hungarian_expansionism_decision_category:0 "На пути к Великой Венгрии"
 hungarian_expansionism_decision_category_desc:0 "Несмотря на обретение полной независимости после Великой войны, Трианонский мирный договор 1919 года привел к почти непревзойденной несправедливости в отношении нашей нации. Слава нашего прошлого никогда не будет забыта, и со временем мы сможем отомстить за нашу национальную катастрофу!"
 hun_core_vojvodina:0 "Реинтегрировать Воеводину"
 hun_core_northtransylvania:0 "Реинтеграция Северной Трансильвании"
 hun_core_carpathiaruthenia:0 "Реинтегрировать Карпатскую Русь"
 hun_core_vojvodina_desc:0 "Долго-венгерский регион Воеводина был, в ущерб нам, предоставлен Королевству Сербия в Трианонском договоре, где он был включен в состав Королевства Югославия. С Воеводиной, снова находящейся под нашим контролем, мы можем реинтегрировать ее в нашу нацию, уничтожив эту беду Трианона."
 hun_core_northtransylvania_desc:0 "Земли Трансильвании, которая веками находилась под прямым венгерским владычеством, были предоставлены королевству Румыния после Великой войны. Несмотря на это, в северной и центральной Трансильвании проживает большое количество венгерских меньшинств, что мы можем использовать для оправдания реинтеграции в нашу страну."
 hun_core_carpathiaruthenia_desc:0 "Исторически венгерский регион Карпаты-Руфения, который был награжден Чехословацкой Республикой в Трианоне, до сих пор принимает значительное венгерское меньшинство сегодня. С его помощью, снова находящимся под нашим контролем, он может быть реинтегрирован в Венгрию как следует, уничтожив это великое унижение для нашей Венгрии."
 CZE_liberate_the_slavs_of_central_europe:0 "Освобождение славян Центральной Европы"
 CZE_liberate_the_slavs_of_central_europe_desc:0 "Как и южные рабы Европы, чехи, словаки и поляки слишком долго находились под иностранным господством. Объединив наших западнославянских соседей в наш уже многоэтнический союз, мы можем послать ясный сигнал «великим державам» мира: никогда больше вы не будете доминировать над нашими делами!"
 cze_become_zapadoslavia:0 "Стать Западославией"
 POL_liberate_the_slavs_of_central_europe:0 "Освобождение славян Центральной Европы"
 POL_liberate_the_slavs_of_central_europe_desc:0 "Как и южные рабы Европы, чехи, словаки и поляки слишком долго находились под иностранным господством. Объединив Прагу с Варшавой, мы можем послать ясный сигнал «великим державам» мира: никогда больше вы не будете доминировать в наших делах!"
 cze_claims_on_poland_tt:0 "Притязания на все начинающиеся §Yпольский§! штаты"
 CZE_POL_push_germany_west:0 "Толкай Германию Западом"
 CZE_POL_liberators_of_the_west_slavs_idea:0 "Освободители западных славян"
 pol_claims_on_czechoslovaia_tt:0 "Притязания на все начинающиеся §Yчехословацкий§! государства, §Gи принимает решения, чтобы их§!"
 pol_integrate_sudetenland:0 "Интеграция Судетской области"
 pol_integrate_carpathia_ruthenia:0 "Интеграция Карпатия-Рутина"
 pol_integrate_southern_slovakia:0 "Интегрировать Южную Словакию"
 romanian_expansionism_decision_category:0 "Румынский экспансионизм"
 romanian_expansionism_decision_category_desc:0 "Большая часть нашего времени с момента обретения независимости была потрачена на то, чтобы побороться за наши амбиции «Великой Румынии», объединив всех румыноязычных за одним флагом. Великая война во многом осуществила нашу мечту, захватив земли Трансильвании и Бессарабии. Несмотря на новый успех, нам еще предстоит реализовать свой потенциал в качестве восточноевропейского гиганта. Trăiască România!"
 rom_core_westbanat:0 "Интеграция Западного Баната"
 rom_claim_alfold:0 "Утверждать Тиса"
 hungarian_expansionism_decision_category:0 "На пути к Великой Венгрии"
 hungarian_expansionism_decision_category_desc:0 "Несмотря на обретение полной независимости после Великой войны, Трианонский мирный договор 1919 года привел к почти непревзойденной несправедливости в отношении нашей нации. Слава нашего прошлого никогда не будет забыта, и со временем мы сможем отомстить за нашу национальную катастрофу!"
 hun_core_vojvodina:0 "Реинтегрировать Воеводину"
 hun_core_northtransylvania:0 "Реинтеграция Северной Трансильвании"
 hun_core_carpathiaruthenia:0 "Реинтегрировать Карпатскую Русь"
 hun_core_vojvodina_desc:0 "Долго-венгерский регион Воеводина был, в ущерб нам, предоставлен Королевству Сербия в Трианонском договоре, где он был включен в состав Королевства Югославия. С Воеводиной, снова находящейся под нашим контролем, мы можем реинтегрировать ее в нашу нацию, уничтожив эту беду Трианона."
 hun_core_northtransylvania_desc:0 "Земли Трансильвании, которая веками находилась под прямым венгерским владычеством, были предоставлены королевству Румыния после Великой войны. Несмотря на это, в северной и центральной Трансильвании проживает большое количество венгерских меньшинств, что мы можем использовать для оправдания реинтеграции в нашу страну."
 hun_core_carpathiaruthenia_desc:0 "Исторически венгерский регион Карпаты-Руфения, который был награжден Чехословацкой Республикой в Трианоне, до сих пор принимает значительное венгерское меньшинство сегодня. С его помощью, снова находящимся под нашим контролем, он может быть реинтегрирован в Венгрию как следует, уничтожив это великое унижение для нашей Венгрии."
 CZE_liberate_the_slavs_of_central_europe:0 "Освобождение славян Центральной Европы"
 CZE_liberate_the_slavs_of_central_europe_desc:0 "Как и южные рабы Европы, чехи, словаки и поляки слишком долго находились под иностранным господством. Объединив Варшаву в наш уже многоэтнический союз, мы можем послать ясный сигнал «великим державам» мира: никогда больше вы не будете доминировать над нашими делами!"
 cze_become_zapadoslavia:0 "Стать Западославией"
 cze_claims_on_poland_tt:0 "Притязания на все начинающиеся §Yпольский§! государства, §Gи принимает решения, чтобы их§!"
