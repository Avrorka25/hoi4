 CZE_POL_zapadoslavia_post_unification:0 "Консолидация Нового Союза"
 CZE_POL_zapadoslavia_post_unification_desc:0 "Кровью и волей мы создали новый союз для славян Центральной Европы. Несмотря на характер наших достижений, пришло время действовать проактивно. Ибо «великие державы» мира будут стремиться ослабить, разделить и захватить то, что по праву принадлежит нам!"
