l_russian:
 yugoslavia_focus:0 "Национальные фокусы Югославии"
 zastava_subsidy:0 "Субсидии «Заставе»"
 zastava_subsidy_desc:0 "«Застава Оружие» обладает огромным потенциалом снабжать нашу великую нацию вооружением. Мы предоставим ей средства и мощности, необходимые для расширения."
 research_teams:0 "Учёные «Заставы»"
 research_teams_desc:0 "«Застава» будет благодарна, если мы найдём лучших учёных страны для помощи компании. Приложив немного усилий, мы сможем найти нужных специалистов."
 art_branch:0 "Артиллерийское направление"
 art_branch_desc:0 "Поскольку «Застава» становится крупной оружейной компанией, будет создано отдельное подразделение, полностью посвящённое артиллерии."
 mech_branch:0 "Моторизованное направление"
 mech_branch_desc:0 "Поскольку «Застава Оружие» становится крупной оружейной компанией, будет создано отдельное подразделение, посвящённое моторизации."
 armor_branch:0 "Бронетанковое направление"
 armor_branch_desc:0 "Поскольку «Застава Оружие» становится крупной оружейной компанией, будет создано отдельное подразделение, посвящённое бронетехнике."
 qual_lines:0 "Контроль качества"
 qual_lines_desc:0 "Хотя «Застава» быстро расширяется, мы должны следить, чтобы качество продукции не снижалось."
 royal_army:0 "Королевская армия"
 royal_army_desc:0 "Независимо от того, считают ли монархию символом, пережитком прошлого или правящей силой, многие захотят вступить в Королевскую армию — хорошо подготовленную часть югославских вооружённых сил."
 drill_serg:0 "Эффективные инструкторы"
 drill_serg_desc:0 "Мы должны приложить большие усилия для модернизации армии. Первый шаг — повысить качество подготовки строевых инструкторов."
 trained_military:0 "Подготовленная армия"
 trained_military_desc:0 "Благодаря лучшим инструкторам наши солдаты смогут освоить новые сложные способы ведения войны."
 spec_ops:0 "Специальные операции"
 spec_ops_desc:0 "Когда основные рода войск будут хорошо подготовлены к войне, мы сформируем небольшие подразделения сил специальных операций."
 anv_research:0 "Дополнительная ячейка исследований"
 anv_research_desc:0 "Новые военные знания позволили нам вести больше исследований, чем прежде."
 arm_navy:0 "Вооружить флот"
 arm_navy_desc:0 "С Грецией на юге, Италией на западе и растущими угрозами за пределами Средиземного моря мы обязаны значительно увеличить свой флот."
 arm_coast:0 "Вооружить побережье"
 arm_coast_desc:0 "Рост флота даёт основания милитаризировать побережье. Будут построены верфи, которые помогут создать гораздо более крупный флот."
 arm_sky:0 "Вооружить небо"
 arm_sky_desc:0 "Чтобы использовать флот максимально эффективно, мы должны также уничтожать вражеские корабли с воздуха."
 sub_warfare:0 "Подводная война"
 sub_warfare_desc:0 "Наш флот мал по сравнению с флотами великих европейских держав, поэтому мы должны научиться наносить удары из-под воды. Только так небольшой флот сможет эффективно бороться с гигантами."
 dest_res:0 "Исследования эсминцев"
 dest_res_desc:0 "Исследовательские группы, занимающиеся исключительно новыми эсминцами, добьются результатов значительно быстрее обычных военно-морских коллективов."
 crus_res:0 "Исследования крейсеров"
 crus_res_desc:0 "Исследовательские группы, занимающиеся исключительно новыми крейсерами, добьются результатов значительно быстрее обычных военно-морских коллективов."
 cap_ship:0 "Исследования крупных кораблей"
 cap_ship_desc:0 "После успехов в исследованиях малых кораблей учёные попросили разрешения сосредоточиться на более крупных проектах, способных господствовать на море тяжёлыми орудиями."
 car_ship:0 "Исследования авианосцев"
 car_ship_desc:0 "Вершиной нашего флота могут стать огромные авианосцы. Это амбициозная цель, но мы уже создали множество квалифицированных исследовательских групп и современных объектов. При дополнительной поддержке авианосцы могут появиться раньше, чем считалось возможным."
 more_ship:0 "Увеличить кораблестроение"
 more_ship_desc:0 "Наши коллективы исследовали достаточно новых технологий, и очевидно, что производство не поспевает за требованиями учёных и инженеров. Следует сосредоточиться на его расширении."
 found_soko:0 "Основать SOKO"
 found_soko_desc:0 "Наши самолёты производятся как любой другой государственный проект. Столь важному направлению требуется больше внимания. Мы создадим специализированную военную компанию по разработке новых самолётов. Многие граждане пытались делать это самостоятельно, но государственное финансирование позволит поставить дело на прочную основу."
 fighter_res:0 "Исследования истребителей"
 fighter_res_desc:0 "SOKO успешно работает самостоятельно, но дополнительная государственная поддержка позволит ускорить исследования истребителей."
 cas_res:0 "Исследования штурмовиков"
 cas_res_desc:0 "SOKO успешно работает самостоятельно, но дополнительная государственная поддержка позволит ускорить исследования штурмовой авиации."
 sb_res:0 "Исследования стратегических бомбардировщиков"
 sb_res_desc:0 "В преддверии необходимости производить бомбардировщики мы считаем, что ставка на стратегические машины принесёт наибольшую пользу."
 tb_res:0 "Исследования тактических бомбардировщиков"
 tb_res_desc:0 "В преддверии необходимости производить бомбардировщики мы считаем, что ставка на тактические машины принесёт наибольшую пользу."
 airbase_blue:0 "Чертежи авиабаз"
 airbase_blue_desc:0 "Раньше авиабазы строились по-разному в зависимости от задач и рельефа. Теперь лучше стандартизировать их и многократно воспроизводить один типовой проект, сокращая сроки строительства."
 YUG_nuclear_effort:0 "Ядерный институт «Винча»"
 YUG_nuclear_effort_desc:0 "Правительство задало учёным один вопрос: можем ли мы использовать расщепление атома в своих интересах? Для изучения этой идеи будет создан Ядерный институт «Винча»."
 YUG_rocketry:0 "Ракетная техника"
 YUG_rocketry_desc:0 "Когда солдаты сражаются на передовой, применение ракет для поддержки наступления кажется вполне разумным. После всех наших усилий в авиации перенаправить ресурсы на эти исследования будет нетрудно."
 missile_blue:0 "Чертежи ракетных площадок"
 missile_blue_desc:0 "Ключом к строительству множества ракетных площадок станет стандартизированный проект, который можно многократно воспроизводить."
 anv_research2:0 "Дополнительная ячейка исследований"
 anv_research2_desc:0 "Исследования авиации значительно расширили нашу способность осваивать передовые технологии. Новые научные лаборатории могут послужить государству."
 political_quag:0 "Политический тупик"
 political_quag_desc:0 "Наша страна стоит на перекрёстке нового мира. Мы должны выбрать, кому будем верны."
 side_nuetral:0 "Сохранить верность королю"
 side_nuetral_desc:0 "Наша страна должна остаться на стороне монархии. Мир переживает огромную напряжённость из-за появления новых режимов."
 kings_men:0 "Люди короля"
 kings_men_desc:0 "Немного пропаганды и национализма — и гораздо больше молодых людей вступит в армию ради сохранения страны."
 make_jobs:0 "Создать рабочие места"
 make_jobs_desc:0 "Лучший способ укрепить поддержку монархии — создать больше рабочих мест."
 royal_fav:0 "Популярность монархии"
 royal_fav_desc:0 "С помощью пропаганды мы убедим народ, что, несмотря на недостатки, монархия остаётся лучшей формой правления по сравнению с варварскими режимами."
 create_fear:0 "Посеять страх"
 create_fear_desc:0 "Единственный способ удержать власть над населением — внушить ему страх, который не позволит поднять восстание."
 to_arms:0 "К оружию!"
 to_arms_desc:0 "Население напугано новой угрозой, и многие готовы взять оружие и сражаться за страну."
 royal_stab:0 "Стабильность монархии"
 royal_stab_desc:0 "Все наши усилия улучшили отношение к монархии. Представители королевского дома стали прекрасными ораторами, а их постоянные речи внушают населению чувство безопасности."
 side_ut:0 "Поддержать усташей"
 side_ut_desc:0 "Усташи, хорватское фашистское движение, борются за кровавое, но необходимое дело. Германия и Италия обрели огромную промышленную мощь благодаря фашизму; мы должны сделать то же самое."
 r_terror:0 "Царство террора"
 r_terror_desc:0 "Многие считают усташей террористической группировкой — ополчением, убивающим своих противников. Если позволить им действовать, это посеет ужас среди граждан, не согласных с ними или с фашизмом."
 ut_youth:0 "Молодёжь усташей"
 ut_youth_desc:0 "Молодёжное движение усташей следует примеру гитлерюгенда, начиная военную подготовку с очень раннего возраста."
 loc_mil:0 "Местные ополчения"
 loc_mil_desc:0 "Не все вооружённые формирования обязаны напрямую контролироваться правительством. Мы можем разрешить рост местных ополчений, снабжая их оружием, а они будут сражаться за нас."
 croat_war:0 "Хорватская военная машина"
 croat_war_desc:0 "Теперь, когда хорватские фашисты получили больше власти, они будут заставлять население работать изо всех сил, пока производство значительно не вырастет."
 side_axis:0 "Присоединиться к Оси"
 side_axis_desc:0 "Мы достигли точки, когда Ось поддерживают не только наши лидеры, но и народ. Мы должны присоединиться к их борьбе."
 axis_pride:0 "Гордость Оси"
 axis_pride_desc:0 "Достаточная пропаганда заставит народ гордиться участием в Оси. Мы будем не просто союзниками — наши народы действительно встанут плечом к плечу."
 side_tito:0 "Поддержать Тито"
 side_tito_desc:0 "Поддержка коммунистического революционера Тито кажется единственным способом вырваться из фашистских тисков. Пропаганда увеличит его популярность."
 fund_ch:0 "Финансировать четников"
 fund_ch_desc:0 "Четники — решительно антифашистское движение. При достаточном вооружении и государственной помощи они смогут искоренять фашизм там, где мы сами не решаемся."
 dest_ch:0 "Уничтожить четников"
 dest_ch_desc:0 "Четники помогли искоренить фашизм в стране, однако многие считают, что они сами внушают такой же страх, как фашисты. Если выяснится, что мы им помогали, последует скандал. Пора распустить группу."
 int_ch:0 "Интегрировать четников"
 int_ch_desc:0 "Четники доказали свою эффективность как военная сила. Нет причин не сделать их официальной частью югославской армии."
 com_spe:0 "Коммунистические речи"
 com_spe_desc:0 "Нет ничего эффективнее пропаганды из уст выдающихся ораторов. В коммунистической партии их немало, включая самого Тито. Мы не остановимся, пока все не согласятся с нами."
 blood:0 "Кровь"
 blood_desc:0 "Коммунистическая кровь питает страну и её армию. Люди будут стекаться в вооружённые силы, чтобы защищать свою идеологию, и мы призовём их к этому."
 sweat:0 "Пот"
 sweat_desc:0 "Коммунизм не заработает, если население не будет трудиться изо всех сил. Мы будем постоянно напоминать, что страна держится на способности работать до опухших рук и окровавленных ног."
 steel:0 "Сталь"
 mimic_west:0 "Подражать Западу"
 mimic_west_desc:0 "Демократия добилась на Западе умеренного успеха. Великобритания управляет мировой империей, а США показывают, как население может избрать сильного лидера. Последуем их примеру."
 loc_ele:0 "Местные выборы"
 loc_ele_desc:0 "Национальные выборы проходят раз в несколько лет, а порой и вовсе не проходят, поэтому людям может не хватать ощущения демократии. Местные выборы на небольшие должности укрепят демократический патриотизм."
 aid_ally:0 "Помощь Союзников"
 aid_ally_desc:0 "Поскольку коммунизм и фашизм распространяются по Европе, Союзники согласились помочь нашей стране развить производство."
 fac_men:0 "Фашистская угроза"
 fac_men_desc:0 "Пропаганда послужит нам независимо от демократии. Фашизм будет представлен как зло для нашего общества."
 capit:0 "Капитализм"
 capit_desc:0 "Свобода покупать и производить лежит в основе многих демократических стран. Возможно, пришло время принять законы спроса и предложения."
 capit_ind:0 "Капиталистическая промышленность"
 capit_ind_desc:0 "Мы должны поощрять граждан создавать собственные предприятия. Покажем, что можно начать с нуля и однажды владеть целой сетью фабрик."
 join_ally:0 "Присоединиться к Союзникам"
 join_ally_desc:0 "Пока Ось и Коминтерн нависают над Европой, мы должны взять судьбу в свои руки и присоединиться к Союзникам."
 anv_research3:0 "Дополнительная ячейка исследований"
 anv_research3_desc:0 "Технологические преимущества капиталистической промышленности огромны. Граждане получили пути к собственному успеху; дни поиска талантов закончились — талант находит дорогу сам."
 mil_prep:0 "Военная подготовка"
 mil_prep_desc:0 "Балканы — крайне нестабильный регион мира, и мы должны быть готовы к войне."
 ind_prep:0 "Промышленная подготовка"
 ind_prep_desc:0 "Балканы никогда не считались промышленным центром. Мы должны это изменить."
 mil_prep2:0 "Военная подготовка II"
 mil_prep2_desc:0 "Балканы — крайне нестабильный регион мира, и мы должны быть готовы к войне."
 ind_prep2:0 "Промышленная подготовка II"
 ind_prep2_desc:0 "Балканы никогда не считались промышленным центром. Мы должны это изменить."
 claim_bulg:0 "Югославский ирредентизм"
 claim_bulg_desc:0 "Мы имеем право быть ведущей державой Балкан. Здесь немало земель, которые по праву принадлежат нам, и мы предъявим на них претензии."
