 r56_MEN_industry_ns:0 "Незначительная национальная промышленность"
 r56_MEN_industry_ns_desc:0 "Какая бы маленькая отрасль промышленности ни была в нашей стране, она медленно растет, как и ни одна другая. [JAP.GetAdjective] Ни то, ни другое [CHI.GetAdjective] Мы готовы инвестировать капитал в развитие обрабатывающей промышленности в нашей стране. Это связано с тем, что они надеются сохранить наш народ и экономику в первую очередь ориентированными на производство сырой и/или сельскохозяйственной продукции, которая, по их мнению, должна быть обеспечена. [JAP.GetAdjective] или [CHI.GetAdjective] Потребители могут покупать по дешевым ценам, оставляя бедных. [ROOT.GetAdjective] Фермеру ничего не надо! Вопрос в том, как долго может [ROOT.GetAdjective] Люди справляются с этим извращенным экономическим порабощением?"
 r56_MEN_industry_ns_1:0 "[ROOT.GetAdjective] промышленный сектор"
 r56_MEN_industry_ns_1_desc:0 "[ROOT.GetAdjective] правительству стало ясно, что экономическое развитие, особенно промышленности, крайне необходимо, чтобы вывести многочисленных [ROOT.GetAdjective] крестьян и рабочих из нищеты. Поэтому в обозримом будущем в промышленный сектор будут направлены значительные политические и экономические вложения — на благо народа и страны!"
