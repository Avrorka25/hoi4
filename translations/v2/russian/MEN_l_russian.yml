 men.10.t:0 "Встреча в Чжанбэе"
 men.10.d:0 "Пока среди элит нарастал страх, а японцы медленно продвигались вперёд, ключевые представители Монгольского автономного политического комитета и Гоминьдана — Нима-Одсор, Унэнбаян, Сэрэндонров и Дэмчигдонров — собрались в Чжанбэе для встречи с влиятельным Жодбажабом. Обстановка была напряжённой: они обсуждали недавние события на севере провинции Чахар. Маньчжурские войска под командованием Ли Шоусиня вошли в шесть уездов, демилитаризованных соглашением Циня — Дойхары, нарушив хрупкий мир в регионе.\n\nЖодбажаб сообщил о своём ответе: размещении конной полиции для защиты уязвимых северных границ Чахара. Однако по мере того как Япония и Маньчжоу-го всё глубже проникали в Северный Китай, расширяя своё влияние, встречу охватывало чувство растущей неопределённости. Каждый из лидеров понимал, что это очередное нарушение может стать началом гораздо более крупного конфликта и втянуть силы региона в неизбежное столкновение...\n\nПосле завершения встречи представители готовятся разъехаться, но неизвестно, что ждёт их впереди и вернутся ли они когда-нибудь."
 men.10.a:0 "Завершить встречу — завтра будет новый день."
 men.10.b:0 "Сохраняйте бдительность: враг скрывается в тени..."
 men.11.t:0 "Нима-Одсор убит"
 men.11.d:0 "Хрупкий союз во Внутренней Монголии постигла трагедия: Нима-Одсор, националист и сторонник Гоминьдана, одна из ключевых фигур, выступавших за монгольскую автономию и сопротивление японцам, был убит. По словам очевидцев, это жестокое преступление организовали японцы, стремившиеся ослабить руководство региона и сорвать единое сопротивление их растущему влиянию. Смерть Нима-Одсора вызвала волну шока и страха по всему движению. Союзники гадают, кто станет следующей целью, а другие задаются вопросом, не ускользает ли мечта о независимой и единой Монголии. В эти тревожные времена перед многими стоит суровый выбор: укрепить решимость и дать отпор иностранному вмешательству либо рисковать стать орудием чужой империи."
 men.11.a:0 "Не летай слишком близко к Красному солнцу..."
 men.12.t:0 "Калганский инцидент"
 men.12.d:0 "По завершении встречи в Чжанбэе Нима-одсор отправился на обратный путь в Кельган, чтобы возобновить свои правительственные обязанности. В 8:45 он сел на автобус, направлявшийся в Кельган, в сопровождении двух охранников из местного корпуса безопасности. Однако путешествие было резко прервано, когда два японских офицера остановили автобус и потребовали въезда. В течение нескольких секунд между монгольскими гвардейцами и японскими офицерами разразилась перестрелка. Одному из монгольских охранников удалось ранить одного из японцев, заставив их отступить и бежать с места происшествия. Уже появились слухи, что это могло быть покушением на жизнь Нима-одзора, яростного патриота и антияпонского провокатора, к счастью, он оставил сцену невредимой."
 men.12.a:0 "Неожиданный поворот событий..."
 men.13.t:0 "Последствия долгой зимы"
 men.13.d:0 "Зима 1936 года принесла невиданные страдания — беспощадная осада льдом и снегом поставила Внутреннюю Монголию и наш народ на колени. Почти три месяца температура держалась ниже −30 °C, полностью остановив повседневную жизнь. Уже обременённые лишениями люди столкнулись с голодом: скот погибал, пастбища опустели. Многие деревни, отрезанные глубокими сугробами, до сих пор лишены жизненно важных ресурсов, а экономика страны балансирует на грани краха.\n\nКогда морозы начали отступать, стал очевиден масштаб бедствия. Целые общины дестабилизированы, авторитет руководства ослаб, а народ со страхом смотрит в будущее. Многие требуют чёткого и решительного плана восстановления, который обеспечит выживание в ближайшие месяцы. Одни призывают опереться на собственные ресурсы и рабочую силу, другие считают необходимым обратиться за помощью к иностранным державам. Но все согласны в одном: если Внутренняя Монголия хочет выстоять, мы должны немедленно начать восстановление расколотой страны!"
 men.13.a:0 "Мы переживём эту бурю вместе!"
 men.14.t:0 "Внутреннемонгольский гамбит"
 men.14.d:0 "Пока Квантунская армия усиливает хватку над Северным Китаем, среди элит Внутренней Монголии растёт тревога. Не позднее чем через две недели ключевые представители Монгольского автономного политического комитета, Гоминьдана и местного руководства — Нима-Одсор, Унэнбаян, Сэрэндонров и князь Дэмчигдонров — соберутся в Чжанбэе для обсуждения будущих шагов с влиятельным Жодбажабом. Недавнее вторжение маньчжурских войск Ли Шоусиня в демилитаризованные уезды Чахара, нарушившее соглашение Циня — Дойхары, разрушило и без того хрупкий мир.\n\nСреди противников Японии выделяется Нима-Одсор — видный монгольский националист и близкий союзник Чан Кайши. Его влияние растёт, усиливая антияпонские настроения, способные сорвать наши планы. Квантунская армия подготовила тайную операцию по его устранению, и остаётся лишь отдать окончательный приказ.\n\nПредпримем ли мы решительные действия, чтобы закрепить японский контроль над Внутренней Монголией, или позволим Нима-Одсору сплотить сторонников и углубить раскол между монгольской элитой и нашими силами?"
 men.14.a:0 "Враждовать с императором — крайне глупый поступок!"
 men.14.b:0 "Интересы Японии лежат в другом месте..."
 men.15.t:0 "Нима-Одсор убит"
 men.15.d:0 "Нима-Одсор, монгольский националист и сторонник Гоминьдана, одна из ключевых фигур, выступавших за автономию Монголии и сопротивление японцам, был успешно устранён. Верховному командованию Квантунской армии доложили, что двое солдат остановили и вошли в автобус, на котором Нима-Одсор возвращался в Калган к своим обязанностям, после чего дважды выстрелили в него. Его смерть вызвала по всему региону именно ту волну шока и страха, на которую рассчитывала Квантунская армия. Теперь элиты Внутренней Монголии гадают, кто станет следующей целью, а некоторые сомневаются, не исчезает ли мечта о независимой и единой Монголии. Возможно, они наконец поймут, что только безусловная верность [JAP.Capital.GetCapitalVictoryPointName] позволит им сохранить головы..."
 men.15.a:0 "Не летай слишком близко к Красному солнцу..."
 men.16.t:0 "Калганский инцидент"
 men.16.d:0 "По завершении встречи в Чжанбэе Нима-одсор отправился на обратный путь в Кельган, чтобы возобновить свои правительственные обязанности. В 8:45 он сел на автобус, направлявшийся в Кельган, в сопровождении двух охранников из местного корпуса безопасности. Однако путешествие было резко прервано, когда два японских офицера, которым приказали убить Нима-одсора Квантунгом, остановили автобус и потребовали въезда. В течение нескольких секунд между монгольскими гвардейцами и японскими офицерами разразилась перестрелка. Одному из монгольских охранников удалось ранить одного из японцев, заставив их отступить и бежать с места происшествия. Уже появились слухи о нашей причастности к тому, что скорее всего было покушением на жизнь Нима-одзора, яростного патриота и антияпонского провокатора. К сожалению, он оставил сцену невредимой."
 men.16.a:0 "Проклятые некомпетентные ублюдки!"
 men.16.b:0 "Мы попробовали по-хорошему, теперь пора действовать жёстко..."
 men.17.t:0 "[MEN.GetNameDefCap] требует контроль над [621.GetName] и [746.GetName]"
 men.17.d:0 "Сегодня власти [ROOT.GetAdjecitve] в [MEN.Capital.GetCapitalVictoryPointName], как сообщается, получили запрос от [MEN.GetAdjective] правительства и затем телеграфировали его в [ROOT.Capital.GetCapitalVictoryPointName]. В нём требуется передать контроль над северными районами [621.GetName] и [746.GetName] — двумя процветающими и жизненно важными для экономики провинциями, приносившими нам огромную пользу. Неясно, не превратится ли этот «запрос» в ультиматум, после которого [MEN.GetAdjective] войска сами вторгнутся и займут территории, если не получат ответа. Итак, как следует поступить?"
 men.17.a:0 "Из предосторожности мы должны согласиться..."
 men.17.b:0 "С чего нам потакать сборищу глупцов?"
 men.18.t:0 "[FROM.GetNameDefCap] соглашается"
 men.18.d:0 "Несколько дней назад власти [FROM.GetAdjecitve] в [MEN.Capital.GetCapitalVictoryPointName] получили запрос от [MEN.GetAdjective] правительства и затем телеграфировали его в [FROM.Capital.GetCapitalVictoryPointName]. После тщательного рассмотрения [FROM.GetAdjecitve] власти наконец решили, что лучше передать контроль над запрошенными территориями, и уведомили нас о своём выборе."
 men.18.a:0 "Прекрасно!"
 men.19.t:0 "[FROM.GetNameDefCap] отказывает"
 men.19.d:0 "Несколько дней назад власти [FROM.GetAdjecitve] в [MEN.Capital.GetCapitalVictoryPointName] получили запрос от [MEN.GetAdjective] правительства и затем телеграфировали его в [FROM.Capital.GetCapitalVictoryPointName]. После тщательного рассмотрения [FROM.GetAdjecitve] власти наконец решили не передавать контроль над запрошенными территориями и уведомили нас о своём выборе."
 men.19.a:0 "Никто не встанет на пути монгольского единства!"
 men.20.t:0 "[MEN.GetNameDefCap] предлагает объединение Монголии"
 men.20.d:0 "Теперь, когда коммунисты пришли к власти в [MEN.GetNameDefCap], [MEN.GetLeader], известный и влиятельный революционер, предложил объединить правительства в [MEN.Capital.GetCapitalVictoryPointName] и [MON.Capital.GetCapitalVictoryPointName]. Многие видят в этом уникальную возможность наконец создать страну для всех монголов и осуществить мечту, к которой стремятся наши соотечественники."
 men.20.a:0 "Один народ, одна страна!"
 men.20.b:0 "Чепуха! Мы не преклонимся перед самозванцами из [MEN.Capital.GetCapitalVictoryPointName]!"
 men.21.t:0 "[FROM.GetNameDefCap] соглашается"
 men.21.d:0 "[FROM.GetAdjective] власти в [MON.Capital.GetCapitalVictoryPointName] приняли наше предложение, и начался процесс объединения двух систем в [MEN.Capital.GetCapitalVictoryPointName] и [MON.Capital.GetCapitalVictoryPointName]. Вскоре возникнет новое государство всех монголов — через кровь или мир!"
 men.21.a:0 "Наконец-то единство!"
 men.22.t:0 "[FROM.GetNameDefCap] отказывает"
 men.22.d:0 "[FROM.GetAdjective] власти в [MON.Capital.GetCapitalVictoryPointName] отклонили наше предложение, однако причины решения публично не известны. Многие уже предполагают, что между [MEN.Capital.GetCapitalVictoryPointName] и [MON.Capital.GetCapitalVictoryPointName] возник политический и экономический раскол, но наверняка ничего не известно..."
 men.22.a:0 "Сборище глупцов!"
 men.23.t:0 "[FROM.GetNameDefCap] запрашивает монгольские территории"
 men.23.d:0 "The [FROM.GetAdjective] власти в [MEN.Capital.GetCapitalVictoryPointName] Мы получили запрос о контроле, как они выразились, над «монгольскими территориями», которые охватывали бы любые территории, которые мы сейчас имеем в Монголии, Северном Китае или на любых других монгольских землях. Взгляд как на [FROM.GetAdjective] Мы были ценным партнером для нашего правительства, как в стратегическом, военном, так и в экономическом плане, мы должны обсудить, вознаграждать ли их за то, чтобы они исполняли свои желания или нет."
 men.23.a:0 "Хорошо, исполним их просьбу."
 men.23.b:0 "Сейчас Япония не может рисковать неэффективным управлением!"
 men.24.t:0 "[FROM.GetNameDefCap] соглашается"
 men.24.d:0 "[FROM.GetAdjective] власти в [JAP.Capital.GetCapitalVictoryPointName] приняли наше предложение. Возможно, учитывая верность нашей страны императору и оказанную Японии стратегическую, военную и экономическую помощь, они решили исполнить наше желание объединить монгольский народ!"
 men.24.a:0 "Ещё на шаг ближе..."
 men.25.t:0 "[FROM.GetNameDefCap] отказывает"
 men.25.d:0 "[FROM.GetAdjective] власти в [JAP.Capital.GetCapitalVictoryPointName] отклонили наше предложение, однако причины этого решения публично не известны. Многие уже предполагают, что между [MEN.Capital.GetCapitalVictoryPointName] и [JAP.Capital.GetCapitalVictoryPointName] возник политический и стратегический раскол, но наверняка ничего не известно..."
 men.25.a:0 "Досадно..."
 men.26.t:0 "[SHX.GetAdjective] войска отступают из Суйюаня"
 men.26.d:0 "Наши вооружённые силы доказали превосходство в битве за Суйюань. Мы отбили врага и продвинулись вперёд, обратив его войска в массовое бегство. В результате под наш контроль перешла почти вся провинция Суйюань, хотя дальше продвинуться не удалось. Эти столкновения также дадут нам ценный опыт и сведения!"
 men.26.a:0 "Это их научит!"
 men.27.t:0 "[ROOT.GetAdjective] войска отступают из Суйюаня"
 men.27.d:0 "Наши вооружённые силы были разгромлены в битве за Суйюань. Мы отбили множество атак, однако натиск и боевой дух противника оказались выше. Тем не менее из этих столкновений всё ещё можно извлечь много опыта и сведений..."
 men.27.a:0 "Настоящая катастрофа..."
 men.28.t:0 "Тупик в Суйюане"
 men.28.d:0 "Нашим войскам не удалось продвинуться в битве за Суйюань. Мы отбили множество вражеских атак, но силы наступления и боевого духа не хватило для прорыва обороны. Тем не менее из этих столкновений всё ещё можно извлечь много опыта и сведений..."
 men.28.a:0 "Пустая трата крови и слёз..."
 men.29.t:0 "[MEN.GetAdjective] войска отступают из Суйюаня"
 men.29.d:0 "Наши вооружённые силы доказали превосходство в битве за Суйюань. Мы отбили врага и продвинулись вперёд, обратив его войска в массовое бегство. В результате мы сохранили контроль почти над всей провинцией Суйюань, хотя дальше продвинуться не удалось. Эти столкновения также дадут нам ценный опыт и сведения!"
 men.29.a:0 "Это их научит!"
 men.30.t:0 "[ROOT.GetAdjective] войска отступают из Суйюаня"
 men.30.d:0 "Наши вооружённые силы были разгромлены в битве за Суйюань. Мы отбили множество атак, однако натиск и боевой дух противника оказались выше, вынудив наши части массово отступить и потерять значительную часть провинции. Тем не менее из этих столкновений всё ещё можно извлечь много опыта и сведений..."
 men.30.a:0 "Настоящая катастрофа..."
 men.31.t:0 "Тупик в Суйюане"
 men.31.d:0 "Нашим войскам не удалось продвинуться в битве за Суйюань. Мы отбили множество вражеских атак, но силы наступления и боевого духа не хватило для прорыва обороны. Тем не менее из этих столкновений всё ещё можно извлечь много опыта и сведений..."
 men.31.a:0 "Пустая трата крови и слёз..."
 men.32.t:0 "Япония мобилизует Квантунскую армию!"
 men.32.d:0 "По различным доступным правительству источникам стало известно, что Япония начала мобилизацию Квантунской армии и других военизированных формирований во Внутренней Монголии, включая 1-ю и 2-ю кавалерийские армии Ли Шоусиня и Великую праведную армию Хань Ван Ина. Все они прекратили связь с нашим верховным командованием в [MON.Capital.GetCapitalVictoryPointName]. Похоже, японское вторжение близко — мы должны подготовиться..."
 men.32.a:0 "Давид против Голиафа..."
 men.33.t:0 "[ROOT.GetAdjective] план индустриализации"
 men.33.d:0 "Недавние планы по превращению нашей страны из аграрной экономики в хотя бы частично индустриальную выглядят многообещающе, но потребуют огромных затрат. Проекты ведущих промышленников из [MEN.Capital.GetCapitalVictoryPointName] во многом напоминают общий замысел [SOV.GetAdjective] пятилетнего плана, уже доказавшего эффективность в разных частях мира.\n\nОднако наши ресурсы ограничены, и длительное отвлечение внимания от индустриализации существенно снизит её эффективность и замедлит прогресс. Если мы решили, что это действительно лучший путь для [MEN.GetNonIdeologyName], необходимо отдать ему все силы!"
 men.33.a:0 "Мы должны полностью посвятить себя плану!"
 MEN_inner_mongolian_gambit:0 "Внутреннемонгольский гамбит"
 MEN_inner_mongolian_gambit_desc:0 "Пока Квантунская армия неуклонно расширяет контроль над Северным Китаем, а китайское правительство слишком слабо, чтобы сопротивляться растущему влиянию Японии, Внутренняя Монголия остаётся изолированной и беззащитной — заманчивой добычей для достаточно смелых. Наши земли обладают ценными ресурсами, необходимыми японцам, а стратегическое положение обеспечит важнейший плацдарм против Китая. Но пока наше будущее остаётся неопределённым..."
 MEN_imminent_japanese_invasion:0 "Неизбежное японское вторжение"
 MEN_kwantungs_invisible_hand:0 "Невидимая рука Квантунской армии"
 MEN_kwantungs_invisible_hand_desc:0 "Влияние Квантунской армии пронизывает все стороны наших вооружённых сил и управления, привязывая страну к стратегическим планам Японии. С помощью советников и тайного контроля она стремится превратить нас в марионетку, подчинив армию, экономику и руководство японским интересам. Военная иерархия скомпрометирована: японские офицеры командуют из тени, а местных лидеров расставляют на должности, служащие экспансионистским амбициям Японии в Восточной Азии. Хотя на бумаге страна сохраняет автономию, хватка Квантунской армии остаётся крепкой, а невидимая сила диктует дальнейший путь."
 MEN_mongol_raids:0 "Монгольские набеги"
 MEN_mongol_raids_desc:0 "Наши земли страдают от сотен, если не тысяч монгольских разбойников, которые совершают стремительные набеги на границы, нарушают торговлю и постоянно испытывают нашу силу. Эти мародёрские отряды, остатки давно исчезнувшей империи, оставляют поселения беззащитными и подрывают местную стабильность. Чтобы обеспечить будущее, мы должны положить конец непрерывным вторжениям, угрожающим дестабилизировать страну, терроризировать народ и ослабить нашу власть."
 MEN_disorganized_military:0 "Дезорганизованная армия"
 MEN_disorganized_military_desc:0 "Наши силы многочисленны, но им не хватает дисциплины и сплочённости для эффективной войны. Плохая подготовка, разобщённость командиров и нехватка подходящего снаряжения породили хаотичную систему управления, едва способную поддерживать порядок в бою. Пока мы не наведём дисциплину и не упорядочим операции, армия останется грубым инструментом, уязвимым перед решительным противником."
 MEN_the_long_winter:0 "Долгая зима"
 MEN_the_long_winter_desc:0 "Зима 1936 года не похожа ни на одну прежнюю: почти три беспощадных месяца температура опускалась ниже −30 °C, и наш народ отчаянно боролся за выживание. Скот голодал, пастбища опустели, поля оказались погребены под непрекращающимся снегом, а транспорт почти полностью остановился. Для неподготовленных выживание стало практически невозможным, что серьёзно подорвало политическую и экономическую стабильность и усилило тревогу за будущее... Перед лицом всеобщих лишений необходимо найти ясный путь к восстановлению, даже если ради возрождения и выживания придётся обратиться за помощью к иностранным державам."
 MEN_aftermath_of_the_long_winter:0 "Последствия долгой зимы"
 MEN_fuel_for_the_war_machine_idea:0 "Топливо для военной машины"
 MEN_fuel_for_the_war_machine_idea_desc:0 "Наши ресурсы должны стать основой японских амбиций в Восточной Азии, а земли — огромными районами добычи, питающими ненасытную военную экономику. Минералы, металлы и сельскохозяйственная продукция вывозятся, почти ничего не оставляя для собственного развития. Пока народ трудится ради выполнения японских квот, экономика всё сильнее зависит от их требований, замыкая нас в порочном круге подчинения."
 MEN_rapid_industrialization:0 "Стремительная индустриализация"
 MEN_rapid_industrialization_desc:0 "Под давлением иностранных держав и стремясь модернизировать экономику, наша страна начала амбициозную программу ускоренного промышленного роста. Новые заводы и инфраструктурные проекты возникают почти мгновенно, а ограниченные ресурсы направляются на быстрое развитие. Хотя промышленный рывок истощает народ и хозяйство, он обещает превратить отсталую страну в важного участника регионального производства."
