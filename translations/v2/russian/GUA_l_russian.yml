 GUA_integrate_state_map_area:0 "Выберите регион для интеграции в [ROOT.GetNameDef]."
 r56_guatemala.1.t:0 "Маленький Наполеон тропиков..."
 r56_guatemala.1.d:0 "С момента прихода к власти [GUA.GetLeader] временами предавался убеждению, что является реинкарнацией Наполеона Бонапарта, бывшего императора Франции. Долгое время эту «фантазию» списывали на простое высокомерие, считая её бреднями безумца. Однако недавние события вызвали тревогу. Другой бонапартист пришёл к власти в Париже, а [GUA.GetLeader] одержал ряд военных побед в Центральной Америке, и его заблуждения стали всё очевиднее. То, что прежде считали проявлением эго, теперь всё тяжелее давит на его разум. В минуты одиночества можно услышать шёпот — эхо слов самого Наполеона: «Слава мимолётна, но безвестность вечна...»"
 r56_guatemala.1.a:0 "«Я — Наполеон! Мир будет страшиться моего гнева!»"
 r56_guatemala.1.b:0 "«Сеньор Убико, вам пора в постель...»"
