 GUA_french_decisions_desc:0 "Пришло время вернуть французский престол у этих недостойных претендентов. Военный гений и политическое видение [GUA.GetLeader] вернут Франции былую славу и превзойдут её. Мир станет свидетелем возрождения империи, а ошибки Ватерлоо навсегда будут стёрты из истории!"
