 GUA_banana_republic:0 "Банановая республика"
 GUA_banana_republic_desc:0 "[GUA.GetNameDefCap] находится под сильнейшим влиянием компании «Юнайтед Фрут», основанной в [USA.GetAdjective] и возглавляемой Сэмюэлем Земюрреем. Контролируя почти 80% находящейся в частной собственности земли страны, она является крупнейшим землевладельцем Гватемалы. Такая огромная экономическая мощь позволяет компании оказывать значительное влияние на политику правительства и принуждать администрацию служить её обычно ненасытным и корыстным интересам."
 GUA_police_state:0 "Репрессивное полицейское государство"
 GUA_police_state_desc:0 "После поддержанного «Юнайтед Фрут» переворота 1921 года Гватемала переживала длительный период нестабильности. Однако почти десятилетие спустя ситуация начала меняться с приходом к власти Хорхе Убико. За свой первый пятилетний срок Убико превратил страну в политически стабильное государство благодаря умелому использованию политических репрессий, отточенному во время службы в Полиция де Инвестигацион — [GUA.GetAdjective] тайной полиции. Его режим применял цензуру прессы, политическое запугивание, широкую слежку и «Лей де Фугас» — закон, фактически разрешавший внесудебные казни заключённых. При его правлении никто не защищён от государства... в любой момент среди ночи в вашу дверь могут постучать."
 GUA_indigenous_military:0 "Армия с преобладанием коренного населения"
 GUA_indigenous_military_desc:0 "Хотя каждый трудоспособный мужчина Гватемалы обязан отслужить в армии не менее года, обеспечить выполнение этой обязанности оказалось трудно. Многие уклоняются от службы с помощью взяток младшим военным чинам. Однако коренное население из-за более низкого социально-экономического положения такой возможности лишено и потому призывается непропорционально часто. Их культурное почтение к власти приводит к непоколебимой преданности высшему военному руководству, способствуя стабильности в Гватемале. К сожалению, зачастую эта преданность — их единственное достоинство: многие призывники из коренного населения плохо образованы, значительная их часть не умеет читать и писать и особенно слабо владеет базовыми военными знаниями."
