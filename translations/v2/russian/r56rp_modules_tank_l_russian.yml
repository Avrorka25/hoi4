 r56rp_antitank_guided_missile_1:0 "Противотанковая ракета"
 r56rp_antitank_guided_missile_1_short:0 "ПТУР"
 r56rp_antitank_guided_missile_1_desc:0 "Ракета-носитель Remotley с химичальной боеголовкой. Благодаря химичальной боеголовке, а также постепенному сжиганию топлива тяжелые компоненты стандартного противотанкового оружия могут быть опущены, что позволяет нам устанавливать его на светильники."
 r56rp_tank_modern_tank_superstructure:0 "Современная танковая надстройка"
 r56rp_tank_modern_tank_superstructure_desc:0 "Отказавшись от идеи полностью проходимой башни, мы можем разместить действительно гигантские пушки на наших современных гусеничных транспортных средствах."
 r56rp_tank_heavy_oscillating_turret:0 "Тяжелая колеблющаяся башня"
 r56rp_tank_heavy_oscillating_turret_desc:0 "$r56_tank_light_oscillating_turret_desc$\n\nУскоренная версия, способная устанавливать сверхтяжелые вооружения."
 r56rp_tank_medium_oscillating_turret:0 "Средняя колеблющаяся башня"
 r56rp_tank_medium_oscillating_turret_desc:0 "$r56_tank_light_oscillating_turret_desc$\n\nВерсия, способная устанавливать тяжелые вооружения."
 r56rp_tank_ballistic_computer:0 "Современная система управления огнем"
 r56rp_tank_ballistic_computer_desc:0 "Миниатюрная версия морских пожарных директоров. Фактически дальномер, баллистический калькулятор и прицел наводчика все сворачиваются в одну упаковку, чтобы повысить точность и эффективный максимальный диапазон заданий."
 r56rp_tank_radio_4:0 "Современная радиосвязь"
 r56rp_tank_radio_4_desc:0 "Более компактные и гораздо лучше фильтрующие фоновые шумы по сравнению со старыми моделями, которые позволяют нашим командирам танков сосредоточиться на командовании, а не гадать, что было сказано по радио."
 r56rp_tank_composite_armor:0 "Комбинированная броня"
 r56rp_tank_composite_armor_desc:0 "Броня автомобиля состоит из слоев различного материала, в основном керамики и стали. Для большего объема лучше защита на один и тот же вес брони."
 r56rp_tank_riveted_sloped_armor:0 "Наклонная заклепанная броня"
 r56rp_tank_riveted_sloped_armor_desc:0 "$tank_riveted_armor_desc$\n\nПластины устанавливаются под углом, чтобы увеличить эффективную толщину брони, для того же веса."
 r56rp_tank_cast_sloped_armor:0 "Сломанная литая броня"
 r56rp_tank_cast_sloped_armor_desc:0 "$tank_cast_armor_desc$\n\nПластины устанавливаются под углом, чтобы увеличить эффективную толщину брони, для того же веса."
 r56rp_tank_welded_sloped_armor:0 "Наклонная сварная броня"
 r56rp_tank_welded_sloped_armor_desc:0 "$tank_welded_armor_desc$\n\nПластины устанавливаются под углом, чтобы увеличить эффективную толщину брони, для того же веса."
 r56rp_tank_composite_sloped_armor:0 "Композитная броня"
 r56rp_tank_composite_sloped_armor_desc:0 "$r56rp_tank_composite_armor_desc$\n\nПластины устанавливаются под углом, чтобы увеличить эффективную толщину брони, для того же веса."
 r56rp_tank_petrol_powerpack_engine:0 "Бензин Powerpack"
 r56rp_tank_petrol_powerpack_engine_desc:0 "Бензиновый двигатель и трансмиссия в одном быстрозаменяемом пакете. Вместо того, чтобы исправлять неисправности резервуара внутри тесного бака, двигательный блок может быть вырван в течение часа и заменен полностью функционирующим блоком."
 r56rp_tank_diesel_powerpack_engine:0 "Дизельный Powerpack"
 r56rp_tank_diesel_powerpack_engine_desc:0 "Дизельный двигатель и трансмиссия в одном быстрозаменяемом корпусе. Вместо того, чтобы исправлять неисправности резервуара внутри тесного бака, двигательный блок может быть вырван в течение часа и заменен полностью функционирующим блоком."
 r56rp_tank_gasturbine_powerpack_engine:0 "Газовая турбина Powerpack"
 r56rp_tank_gasturbine_powerpack_engine_desc:0 "Газовая турбина и трансмиссия в одном быстрозаменяемом пакете. Вместо того, чтобы исправлять неисправности резервуара внутри тесного бака, двигательный блок может быть вырван в течение часа и заменен полностью функционирующим блоком."
