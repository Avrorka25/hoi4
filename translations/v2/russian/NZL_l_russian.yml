l_russian:
 NZL_colonial_amunitions_company:0 "Colonial Ammunitions Company"
 NZL_ford_munitions_company:0 "Ford Munitions Company"
 NZL_morrison_motor_mower_company:0 "Morrison Motor Mower Company"
 NZL_generic_light_aircraft_manufacturer:0 "Мастерская Венуапай"
 NZL_generic_artillery_manufacturer:0 "Железнодорожные мастерские Хиллсайда"
 NZL_generic_electronics_concern:0 "Radio Ltd"
 NZL_refining_nz:0 "Нефтяные месторождения Мотуроа"
 auckland_university_concern:0 "Оклендский университет"
 NZL_massey_university_concern:0 "Сельскохозяйственный университет Мэсси"
 NZL_railways_department:0 "Департамент железных дорог Новой Зеландии"
 NZL_hutt_railway_workshops_organization:0 "Железнодорожные мастерские Хатта"
 NZL_army_review:0 "Обзор армии [GetYear] года"
 NZL_army_review_desc:0 "По мере роста мировой напряжённости следует побудить военное руководство провести всесторонний обзор армии страны, оценив преимущества и недостатки существующей структуры, оснащения и стратегии."
 NZL_a_reinvigorated_force:0 "Возрождённая армия"
 NZL_a_reinvigorated_force_desc:0 "Наша армия, возможно, не самая грозная в мире, но благодаря увеличению вложений в снаряжение, современным программам подготовки и стратегическому планированию она стала значительно сильнее. Несмотря на небольшую численность, армия Новой Зеландии превращается в более профессиональную и боеспособную силу, готовую защищать страну и содействовать мировой стабильности."
 NZL_adopt_blitskrieg_tactics:0 "Принять тактику блицкрига"
 NZL_adopt_blitskrieg_tactics_desc:0 ""
 NZL_the_horses_are_better:0 "Армия на основе кавалерии"
 NZL_the_horses_are_better_desc:0 ""
 NZL_new_zealand_will_not_fall:0 "Новая Зеландия не падёт"
 NZL_improve_the_radars:0 "Улучшить наши радары"
 NZL_improve_the_radars_desc:0 "Наши радары сильно устарели, а вместе с развитием морской войны должны развиваться и наши технологии."
 NZL_waiouru_excercises:0 "Провести военные учения в Вайоуру"
 NZL_waiouru_excercises_desc:0 "Учебный полигон Вайоуру играет важнейшую роль в подготовке армии. Пока идёт обзор вооружённых сил, следует провести продолжительные учения, чтобы подготовить войска к суровым условиям сложной местности и научить их сохранять полную боеспособность и самообладание."
 NZL_conscript_the_sheep:0 "В бой идут овцы!"
 NZL_conscript_the_sheep_desc:0 ""
 NZL_open_ties_with_washington:0 "Установить связи с Вашингтоном"
 NZL_open_ties_with_washington_desc:0 "Американцы играют важнейшую роль в современном мире, и укрепление отношений с ними несомненно принесёт пользу, открывая возможности для сотрудничества и доступа к ценным ресурсам и поддержке."
 NZL_reaffirm_commonwelth_commitments:0 "Обязательства перед Содружеством"
 NZL_reaffirm_commonwelth_commitments_desc:0 ""
 NZL_ford_munition_plant:0 "Завод боеприпасов Ford"
 NZL_ford_munition_plant_desc:0 "Привлечение американских компаний к строительству заводов боеприпасов увеличит наши промышленные мощности, обеспечит стабильное снабжение жизненно важным вооружением и позволит воспользоваться их опытом и передовыми технологиями производства."
 NZL_anzus_treaty:0 "Подписать договор АНЗЮС"
 NZL_anzus_treaty_desc:0 ""
 NZL_mutual_aid_agreement:0 "Соглашение о взаимной помощи"
 NZL_mutual_aid_agreement_desc:0 ""
 NZL_australian_nzl_agreement:0 "Соглашение АНЗАК"
 NZL_australian_nzl_agreement_desc:0 "Для защиты интересов в Тихом океане необходимо тесно сотрудничать с соседними странами. Стремительно растущая угроза войны и расширение империй требуют объединённых усилий ради стабильности, безопасности и защиты общих ценностей и суверенитета региона."
 NZL_serving_the_empire:0 "Служение империи"
 NZL_serving_the_empire_desc:0 "Один мудрый француз однажды заметил: «Тиранию, подобно аду, нелегко одолеть; но нас утешает то, что чем тяжелее борьба, тем величественнее победа». Поэтому наша решимость не дрогнет — мы будем противостоять тирании везде, где она существует или может возникнуть."
 NZL_adapt_to_the_jungles:0 "Приспособиться к войне в джунглях"
 NZL_adapt_to_the_jungles_desc:0 "Мы должны подготовить войска к эффективным боевым действиям в сложных джунглях Тихого океана. Специализированные программы обучения, подходящее снаряжение и тактика для густой и беспощадной местности обеспечат готовность солдат к этому особому испытанию."
 NZL_the_second_nzl_volunteer_force:0 "Второй добровольческий корпус"
 NZL_the_second_nzl_volunteer_force_desc:0 "В случае войны Новая Зеландия должна мобилизовать войска для защиты себя и союзников."
 NZL_new_zealand_special_forces:0 "1-й полк САС Новой Зеландии"
 NZL_new_zealand_special_forces_desc:0 "Спецназ занял важное место в современной войне, и его создание станет отличным решением."
 NZL_hot_climate_equipment:0 "Получить снаряжение для жаркого климата"
 NZL_hot_climate_equipment_desc:0 "Следует приобрести снаряжение для жаркого климата, поскольку в случае войны наши части могут быть направлены в районы, где оно потребуется."
 NZL_supply_food_stuffs:0 "Поставлять продовольствие в обмен на снаряжение"
 NZL_supply_food_stuffs_desc:0 "Мы не можем отправить много солдат или значительное количество техники, но способны оказать ценную помощь продовольствием. Эти поставки станут важной поддержкой и, возможно, позволят обменять их на необходимое снаряжение."
 NZL_army_of_thieves:0 "«Армия воров»"
 NZL_army_of_thieves_desc:0 "Некоторые наши фронтовые дивизии начали «присваивать» вражеское снаряжение. Кто-то называет нас «ворами», но мы предпочитаем выражения «закупка на месте» и «снижение логистической нагрузки вооружённой борьбы». Этот дух изобретательности следует распространить на все вооружённые силы!"
 NZL_train_new_officers:0 "Подготовить новых офицеров"
 NZL_train_new_officers_desc:0 "Необходимо обновить состав нынешнего военно-морского командования, чтобы повысить наши возможности."
 NZL_solidify_the_new_zealand_division:0 "К независимому флоту"
 NZL_solidify_the_new_zealand_division_desc:0 "Сейчас наш флот не вызывает восхищения, но мы можем принять меры для его улучшения."
 NZL_naval_profit:0 "Повысить прибыльность морской отрасли"
 NZL_naval_profit_desc:0 "Судостроительная отрасль уже принесла стране большую пользу, и дальнейшее расширение наверняка окупится."
 NZL_form_the_new_zealand_navy:0 "Королевский военно-морской флот Новой Зеландии"
 NZL_form_the_new_zealand_navy_desc:0 "Раньше наш флот был лишь небольшой группой резервных кораблей, но теперь мы можем превратить его в самостоятельный род войск."
 NZL_destroyer_production:0 "Защитить наши воды"
 NZL_destroyer_production_desc:0 "Наши воды — жизненная артерия страны, и мы обязаны решительно защищать их. Создание специального флота береговой обороны даст нам мощную силу, способную отразить любую угрозу нашим берегам."
 NZL_advanced_convoy_escorts:0 "Корабли сопровождения конвоев"
 NZL_advanced_convoy_escorts_desc:0 "Чтобы эффективно сопровождать собственные и союзные конвои, необходим современный флот эсминцев, способных догонять рейдеров и защищать уязвимые суда от воздушных атак."
 NZL_submarine_production:0 "Ставка на нарушение морской торговли"
 NZL_submarine_production_desc:0 "В современной морской войне подводные лодки стали решающим фактором, и нам следует начать строить собственные."
 NZL_supply_the_new_zealand_navy_divsion:0 "Запросить ограниченную морскую автономию"
 NZL_supply_the_new_zealand_navy_divsion_desc:0 "Флоту нужны снаряжение и ресурсы для самостоятельной работы, защиты берегов и большей независимости. Чтобы усилить морские возможности, следует обратиться к Адмиралтейству с просьбой укрепить Новозеландскую дивизию дополнительными кораблями."
 NZL_expand_devonport:0 "Расширить военно-морскую базу Девонпорт"
 NZL_expand_devonport_desc:0 "Чтобы подготовиться к требованиям современной войны на море, необходимо расширить базу Девонпорт. Модернизация доков, мастерских и инфраструктуры позволит строить и обслуживать более крупные и совершенные корабли."
 NZL_support_ships:0 "Реквизировать гражданские суда"
 NZL_support_ships_desc:0 "Реквизиция гражданских судов для военных нужд имеет свои преимущества. Мы можем реквизировать"
 NZL_light_cruiser_effort:0 "Надводные рейдеры"
 NZL_light_cruiser_effort_desc:0 "Успех немецких надводных рейдеров в Великой войне показал разрушительное воздействие быстрых и хорошо вооружённых кораблей на вражеские торговые пути. Они наводили страх на торговый флот, нарушали важнейшие линии снабжения и отвлекали силы противника. Инвестиции в надводные рейдеры позволят повторить этот успех, используя скорость и огневую мощь."
 NZL_submarine_hunters:0 "Специализированные охотники за подлодками"
 NZL_submarine_hunters_desc:0 "Для защиты морских путей и предотвращения вражеских вторжений необходимо создать специализированные противолодочные подразделения. Оснащённые современными гидролокаторами, глубинными бомбами и другими технологиями, они смогут обнаруживать и уничтожать подводные угрозы."
 NZL_subs:0 "Развитие подводных лодок"
 NZL_subs_desc:0 "Подводная лодка находится на переднем крае морской войны: она способна бесшумно выслеживать добычу и наносить разрушительные удары. Увеличение вложений в исследования позволит повысить дальность, скрытность и огневую мощь субмарин, обеспечив господство в глубинах и важный вклад в морское превосходство."
 NZL_unrestricted_submarine_warfare:0 "Принять неограниченную охоту на торговые суда"
 NZL_unrestricted_submarine_warfare_desc:0 "Океаны огромны, и под их поверхностью скрыт ключ к уничтожению вражеских линий снабжения. Приняв неограниченную подводную войну, мы направим субмарины без предупреждения атаковать конвои, нарушая торговлю и ослабляя военные усилия противника."
 NZL_long_range_patrols:0 "Самолёты морского патрулирования"
 NZL_long_range_patrols_desc:0 "Для защиты морских границ и безопасности вод необходимо вкладываться в разработку и приобретение современных патрульных самолётов. Они позволят вести дальнюю разведку, противолодочные операции и наблюдение над огромными океанскими пространствами."
 NZL_shore_defences:0 "Укрепить военно-морские узлы"
 NZL_shore_defences_desc:0 "Министерство обороны предложило общий приказ об укреплении всех военно-морских баз Новой Зеландии. Строительство береговых фортов и усиление обороны побережья защитят жизненно важную инфраструктуру и страну от возможных вражеских десантов."
 NZL_munition_companies_investments:0 "Расширить завод Colonial Munitions"
 NZL_munition_companies_investments_desc:0 "Первым шагом к улучшению армии должны стать инвестиции в компании, снабжающие солдат и производящие для них снаряжение."
 NZL_remember_anzac:0 "Уроки Великой войны"
 NZL_remember_anzac_desc:0 "Жертвы сил АНЗАК в Великой войне напоминают о цене конфликта. Уроки таких кампаний, как Галлиполи, продолжают влиять на совершенствование военной стратегии, подчёркивая гибкость, подготовку и более разумную тактику. Мы чтим их память, укрепляя и развивая армию, чтобы никогда не забыть."
 NZL_womens_auxiliary_army:0 "Женский вспомогательный армейский корпус"
 NZL_womens_auxiliary_army_desc:0 "Создание женского армейского вспомогательного корпуса позволит женщинам выполнять важные небоевые задачи: делопроизводство, логистику, ремонт и связь. Это укрепит военные операции и высвободит больше мужчин для фронта."
 NZL_motorization_efforts:0 "Моторизовать армию"
 NZL_motorization_efforts_desc:0 "Расширение корпуса снабжения и растущая потребность армии в эффективной транспортировке делают моторизацию крайне полезной. Современные машины повысят мобильность, упростят логистику, улучшат снабжение и ускорят доставку ресурсов на передовую."
 NZL_new_charlton_automatic_rifles:0 "Новые автоматические винтовки Чарлтона"
 NZL_new_charlton_automatic_rifles_desc:0 "Для возможного будущего конфликта необходимо принять на вооружение новые винтовки."
 NZL_expand_our_tank_warfare:0 "Концепция бронетанковой войны"
 NZL_expand_our_tank_warfare_desc:0 "Наша страна не славится опытом механизированной войны, но министр общественных работ представил смелую и изобретательную концепцию. Из-за мирового дефицита техники он предлагает разработать собственную бронемашину из доступных материалов. Несмотря на необычность, этот проект отражает нашу решимость укрепить оборону."
 NZL_pursue_indigenous_designs:0 "Прототип Скофилда"
 NZL_pursue_indigenous_designs_desc:0 "Следует продолжить разработку танка Скофилда — собственного проекта для защиты страны. Уникальная колёсно-гусеничная система обеспечивает гибкость на разной местности, что идеально подходит для нашего ландшафта. В отличие от иностранных машин, этот танк воплощает самостоятельный подход и создан под наши нужды."
 NZL_abandon_and_combat_enemy_armour:0 "Борьба с вражеской бронетехникой"
 NZL_abandon_and_combat_enemy_armour_desc:0 "Следует отказаться от собственной танковой программы и сосредоточиться на эффективной борьбе с бронетехникой противника. Современные противотанковые орудия, реактивные гранатомёты и специализированная тактика пехоты позволят успешнее нейтрализовать вражеские машины."
 NZL_bren_transport_carrier:0 "Транспортёр Bren"
 NZL_bren_transport_carrier_desc:0 "Министерство обороны предложило разработать универсальные гусеничные машины, такие как транспортёр Bren, для действий на сложной местности. Они обеспечат эффективную перевозку войск, боеприпасов и припасов."
 NZL_foundations_of_an_aritllery_regiment:0 "Основы артиллерийского полка"
 NZL_foundations_of_an_aritllery_regiment_desc:0 "Артиллерийский полк важен для любой армии, и нам следует создать собственный."
 NZL_the_charlton_rifle:0 "Винтовка Чарлтона"
 NZL_the_charlton_rifle_desc:0 "Конструктор Филип Чарлтон предложил переделывать излишки винтовок Lee-Enfield в полуавтоматическое оружие, решая проблему нехватки современной огневой мощи. Его новаторская конструкция повысит эффективность и силу огня. Следует изучить предложение, чтобы укрепить армию при ограниченных ресурсах."
 NZL_engineer_and_supply_corp:0 "Инженерный корпус и корпус снабжения"
 NZL_engineer_and_supply_corp_desc:0 "Продолжим расширять армию, создавая новые рода войск, которые могут оказаться полезными."
 NZL_construct_the_whenuapai_base:0 "Построить базу Венуапай"
 NZL_construct_the_whenuapai_base_desc:0 "Нашим самолётам необходимо место для обучения и обслуживания. Строительство новых авиабаз или модернизация существующих удовлетворит эти потребности."
 NZL_bomber_production:0 "Разрабатывать самолёты для Содружества"
 NZL_bomber_production_desc:0 "Удалённость от Европы делает нашу страну превосходным местом для разработки самолётов на случай войны."
 NZL_goverment_funded_aircraft_production:0 "Увеличить возможности производства самолётов"
 NZL_goverment_funded_aircraft_production_desc:0 ""
 NZL_commonwealth_training_idea:0 "Имперская программа подготовки лётчиков"
 NZL_commonwealth_training_idea_desc:0 "Как важный участник программы подготовки лётчиков Содружества, мы направили ресурсы на обучение и оснащение нового поколения квалифицированных экипажей."
 NZL_close_air_support:0 "Самолёты непосредственной авиационной поддержки"
 NZL_close_air_support_desc:0 "Чтобы повысить эффективность сухопутных войск и обеспечить быструю реакцию, необходимо разработать и развернуть специализированную авиацию непосредственной поддержки."
 NZL_tactical_bombing:0 "Самолёты стратегического разрушения"
 NZL_tactical_bombing_desc:0 "Чтобы подорвать способность врага продолжать войну, необходимо создать самолёты, способные достигать его территории и наносить стратегические удары. Разработка дальних машин позволит бить глубоко в тылу по критически важной инфраструктуре, снабжению и командным центрам."
 NZL_allocate_resources_to_the_rnzf:0 "Выделить ресурсы Королевским ВВС Новой Зеландии"
 NZL_allocate_resources_to_the_rnzf_desc:0 "Нам нужно увеличить число самолётов, чтобы укрепить позиции и повысить шансы на выживание и защиту. Усиление ВВС обеспечит необходимые ресурсы для будущих испытаний и повысит общую вероятность успеха."
 NZL_aircraft_research_group:0 "Развивать отечественное авиастроение"
 NZL_aircraft_research_group_desc:0 "Нам необходимо модернизировать авиацию и сосредоточиться на внутреннем производстве, поскольку в будущем конфликте нельзя полагаться исключительно на закупки самолётов у союзников. Для обеспечения суверенитета и безопасности крайне важно развивать собственные возможности по проектированию и выпуску современных машин."
 NZL_into_the_jet_age:0 "Вступить в реактивную эпоху"
 NZL_into_the_jet_age_desc:0 "Вступая в реактивную эпоху, мы должны развивать передовые реактивные технологии, чтобы укрепить обороноспособность и не отставать от современной войны. Учитывая стремительное развитие авиации, необходимо обеспечить нашим ВВС скорость, манёвренность и точность для борьбы с врагами."
 NZL_pilot_recruitment_drive:0 "Кампания по набору пилотов"
 NZL_pilot_recruitment_drive_desc:0 "Чтобы обеспечить ВВС необходимыми кадрами, нужно поощрять появление нового поколения преданных и квалифицированных лётчиков и специалистов наземного обслуживания, готовых защищать небо страны."
 NZL_strenghten_british_ties:0 "Укрепить [ENG.GetAdjective] связи"
 NZL_strenghten_british_ties_desc:0 "Признавая историческую важность наших отношений, многие граждане недовольны ограниченной автономией внутри империи и сомневаются, стоит ли сохранять столь тесные связи с Британией. Однако подтверждение верности короне позволит найти путь, сочетающий национальные интересы с преимуществами продолжения партнёрства."
 NZL_develop_anti_air_capabilities:0 "Развитие противовоздушной обороны"
 NZL_develop_anti_air_capabilities_desc:0 ""
 NZL_empire_air_training_scheme:0 "«План»"
 NZL_empire_air_training_scheme_desc:0 "В ответ на растущую потребность в подготовленных экипажах для защиты неба мы объединим усилия с союзниками по Содружеству и создадим масштабную программу лётной подготовки. Участие в программе подготовки ВВС Содружества позволит обучить квалифицированных пилотов, штурманов и специалистов авиационной поддержки."
 NZL_womens_auxiliary_air_force:0 "Женские вспомогательные военно-воздушные силы"
 NZL_womens_auxiliary_air_force_desc:0 "Н/Д"
 NZL_form_the_new_zealand_air_force:0 "Развивающиеся военно-воздушные силы"
 NZL_form_the_actual_new_zealander_airforce:0 "Учредить Королевские ВВС Новой Зеландии"
 NZL_form_the_actual_new_zealander_airforce_desc:0 "С ростом значения воздушной мощи и потребности в самостоятельных ВВС пришло время полностью учредить Королевские военно-воздушные силы Новой Зеландии как независимый род войск. Они больше не будут лишь продолжением армии и получат собственное командование и ресурсы."
 NZL_formed_the_new_zealand_air_force:0 "Королевские военно-воздушные силы Новой Зеландии"
 NZL_aircraft_engine_upgrades:0 "Новые прототипы двигателей"
 NZL_aircraft_engine_upgrades_desc:0 ""
 NZL_taranaki_oil_field:0 "Освоить нефтяные месторождения Таранаки"
 NZL_taranaki_oil_field_desc:0 "По мере роста авиации в стране и быстрого истощения запасов топлива мы сталкиваемся с серьёзной проблемой. Хотя национальные ресурсы ограничены, у нас есть небольшие нефтяные месторождения, разработка которых может обеспечить жизненно важные поставки. Их освоение поможет получить ресурсы, необходимые для выживания и обороны."
 NZL_industrialization_fund:0 "Создать фонд индустриализации"
 NZL_industrialization_fund_desc:0 "Экономическое будущее страны требует решительных действий по модернизации промышленности. Такой фонд обеспечит ресурсы для строительства новых заводов, обновления устаревшей инфраструктуры и роста частных инвестиций."
 NZL_end_sustenance_work:0 "Завершить программы временных общественных работ"
 NZL_end_sustenance_work_desc:0 "Чрезвычайные программы общественных работ времён Великой депрессии оказывали жизненно важную помощь, но больше не являются устойчивым решением для рабочей силы. Пора перейти от временных мер к стабильной долгосрочной занятости."
 NZL_modernize_railways:0 "Возродить железные дороги"
 NZL_modernize_railways_desc:0 "Стареющая железнодорожная сеть остро нуждается в модернизации для удовлетворения потребностей растущей страны. Обновление путей, увеличение грузовой пропускной способности и внедрение современных локомотивов сделают железнодорожный транспорт быстрее и надёжнее."
 NZL_connect_the_nation:0 "Финансировать Национальный дорожный совет"
 NZL_connect_the_nation_desc:0 "Наши дороги нуждаются в серьёзной модернизации. Улучшение инфраструктуры повысит эффективность передвижения как для гражданских, так и для военных нужд."
 NZL_modernize_hydroelectric_power:0 "Модернизировать гидроэнергетику"
 NZL_modernize_hydroelectric_power_desc:0 "Электростанция Вайтаки, одна из основ ранней гидроэнергетической сети Новой Зеландии, обладает неиспользованным потенциалом. Модернизация инфраструктуры и расширение работы на южные районы обеспечат надёжное возобновляемое энергоснабжение сельских общин и растущей промышленности."
 NZL_aquire_foreign_machinery:0 "Приобрести современное оборудование"
 NZL_aquire_foreign_machinery_desc:0 "Чтобы соответствовать потребностям растущей экономики, необходимо вкладываться в современное оборудование городской промышленности. Замена устаревших машин и внедрение передовых методов производства значительно повысят эффективность и расширят промышленные мощности."
 NZL_the_wairarapa_sheep_cattle_farm:0 "Расширить животноводство Вайрарапы"
 NZL_the_wairarapa_sheep_cattle_farm_desc:0 "Плодородные равнины Вайрарапы давно являются одной из основ сельскохозяйственного успеха Новой Зеландии, особенно благодаря овцеводству. Развитие крупного скотоводства откроет новые возможности в производстве говядины и молочной продукции."
 NZL_new_zealand_steel_works:0 "Сталелитейные заводы Новой Зеландии"
 NZL_new_zealand_steel_works_desc:0 "Сталь нашей страны может использоваться для самых разных целей, поэтому её необходимо добывать и производить."
 NZL_resource_imports:0 "Принять новые торговые доктрины"
 NZL_prioritize_rural_growth:0 "Отдать приоритет инвестициям в сельские регионы"
 NZL_prioritize_rural_growth_desc:0 "Следует стимулировать развитие сельской Новой Зеландии, возрождая аграрный сектор и укрепляя зависящие от него общины. Улучшение инфраструктуры, поддержка фермеров современными методами и инвестиции в местные отрасли обеспечат процветание сельских районов."
 NZL_prioritize_city_growth:0 "Укрепить городские районы"
 NZL_prioritize_city_growth_desc:0 "Следует отдать приоритет расширению и развитию коммерческих центров Новой Зеландии. Рост городов будет способствовать экономике, привлекать инвестиции и создавать рабочие места, а также облегчать торговлю, промышленность и инновации."
 NZL_industrialize_christchurch:0 "Индустриализация Крайстчерча"
 NZL_industrialize_christchurch_desc:0 "Следует развивать Крайстчерч как ещё один крупный промышленный центр Новой Зеландии. Инвестиции в производство, инфраструктуру и технологические инновации превратят город в двигатель национального экономического роста."
 NZL_expand_auckland_industrial_park:0 "Промышленный парк Окленда"
 NZL_expand_auckland_industrial_park_desc:0 "Следует создать промышленный парк Окленда как ключевой центр коммерческого судоходства и торговли. Развитие современных стапелей для строительства и ремонта кораблей и расширение портовых объектов сделают Окленд ведущим узлом международной торговли и морской промышленности."
 NZL_open_pike_river_mine:0 "Расширить горнодобывающие работы"
 NZL_open_pike_river_mine_desc:0 "Необходимо увеличить добычу угля в регионе для поддержки индустриализации и экономического роста. Расширение работ повысит производство, создаст рабочие места и укрепит местные отрасли при соблюдении требований безопасности и устойчивого развития."
 NZL_resource_imports_desc:0 "Чтобы поддерживать хоть какое-то производство, необходимо пересмотреть распределение наших природных ресурсов."
 NZL_the_inudtrial_segment:0 "Индустриализировать сельские общины"
 NZL_the_inudtrial_segment_desc:0 "В Новой Зеландии всё ещё достаточно подходящих земель для строительства новых городов и промышленных центров. Мы должны воспользоваться этим."
 NZL_the_wairarapa_sheep_farms:0 "Овцеводческие хозяйства Вайрарапы"
 NZL_the_wairarapa_sheep_farms_desc:0 "Мы можем направить прибыль от многочисленных ферм на поддержку военных усилий. Богатство, создаваемое сельским хозяйством, позволит финансировать важнейшие нужды армии — от снабжения до инфраструктуры — без чрезмерной нагрузки на экономику."
 NZL_industrial_awakening:0 "Масштабная программа урбанизации"
 NZL_industrial_awakening_desc:0 "Несколько портовых городов переживают быстрый экономический и демографический рост. Продолжение этой тенденции принесёт стране большую пользу."
 NZL_distribute_the_national_defense_budget:0 "Распределить бюджет национальной обороны"
 NZL_distribute_the_national_defense_budget_desc:0 "В нынешней международной обстановке необходимо увеличить бюджет вооружённых сил."
 NZL_the_tsunami_project:0 "Проект «Цунами»"
 NZL_the_tsunami_project_desc:0 "Сотрудничество с американцами над революционным оружием, таким как «цунами-бомба» в рамках проекта Seal, может стать приоритетом. Этот экспериментальный проект предусматривал создание мощного заряда, способного вызывать гигантские приливные волны, и мог дать новый способ защиты острова от угроз."
 NZL_hire_physicists:0 "Направить финансирование Оклендскому университету"
 NZL_hire_physicists_desc:0 "Чтобы расширить научные знания и содействовать военным проектам, следует нанять физиков."
 NZL_massey_university:0 "Выделить средства университету Мэсси"
 NZL_massey_university_desc:0 "Н/Д"
 NZL_trust_in_the_opposition:0 "Довериться оппозиции"
 NZL_trust_in_the_opposition_desc:0 "Макмиллан был избран главой Лейбористской партии, для того чтобы добиться успеха, ему нужна вера нации."
 NZL_public_health_service:0 "Государственная служба здравоохранения"
 NZL_public_health_service_desc:0 "Создание службы общественного здравоохранения является важным шагом в программе социального обеспечения лейбористов."
 NZL_research_grants:0 "Исследовательские гранты"
 NZL_research_grants_desc:0 "Рабочая сила считает, что исследования являются важным аспектом для развития нации, поэтому они увеличат ее бюджет."
 NZL_review_the_prison_system:0 "Пересмотреть пенитенциарную систему"
 NZL_review_the_prison_system_desc:0 "Пенитенциарная система нашей страны имеет фундаментальные недостатки. Следует попытаться её улучшить."
 NZL_reconcile_political_opponents:0 "Примириться с политическими противниками"
 NZL_reconcile_political_opponents_desc:0 "Джон А. Ли всегда был талантливым лидером. Можно примириться с ним, если это позволит воспользоваться его способностями."
 NZL_denounce_conservative_politicians:0 "Осудить консервативных политиков"
 NZL_denounce_conservative_politicians_desc:0 "Консервативные идеи тормозят развитие страны. Мы должны использовать все средства, чтобы заставить их замолчать."
 NZL_frasers_leadership:0 "Лидерство Фрейзера"
 NZL_frasers_leadership_desc:0 "Питер Фрейзер доказал, что является способным руководителем, достойным вести страну через трудные времена."
 NZL_begin_lobbying_for_reforms:0 "Начать кампанию за реформы"
 NZL_begin_lobbying_for_reforms_desc:0 "Начать лоббирование реформ от вновь избранного правительства труда"
 NZL_rally_the_opponents:0 "Объединить противников"
 NZL_rally_the_opponents_desc:0 "Мы должны сотрудничать со всеми противниками, даже с теми, кто не входит в Лейбористскую партию, чтобы развивать нацию."
 NZL_attempt_at_a_war_economy:0 "Попытаться создать военную экономику"
 NZL_attempt_at_a_war_economy_desc:0 "Экономика Новой Зеландии никогда не была рассчитана на крупный конфликт, но сейчас как никогда важно хотя бы попытаться её перестроить."
 NZL_lower_labor_wages:0 "Снизить заработную плату рабочих"
 NZL_lower_labor_wages_desc:0 "Для поддержки мобилизации придётся сократить часть зарплат, чтобы ещё сильнее развить экономику."
 NZL_silence_the_discontent:0 "Заглушить недовольство"
 NZL_silence_the_discontent_desc:0 "Некоторые недовольны ужесточением мобилизационных законов. Необходимо подвергнуть их цензуре, пока эти идеи не распространились среди населения."
 NZL_fight_for_control_over_our_soldiers:0 "Ввести воинскую повинность"
 NZL_fight_for_control_over_our_soldiers_desc:0 "Стране нужно больше людей для службы в случае конфликта. Хотя эта мера непопулярна, возможно, пора вновь ввести призыв."
 NZL_the_labour_partys_reform:0 "Кабинет Сэвиджа"
 NZL_the_labour_partys_reform_desc:0 "Майкл Сэвидж и Лейбористская партия пообещали жителям Новой Зеландии несколько вещей. Настало время начать эти реформы."
 NZL_critize_uk_foreign_policy:0 "Критиковать политику умиротворения"
 NZL_critize_uk_foreign_policy_desc:0 "Умиротворение не является законной формой дипломатии. Даже если мы останемся одиноки в этом мнении, важно донести его до Соединённого Королевства."
 NZL_universal_medical_benefits:0 "Всеобщие медицинские льготы"
 NZL_universal_medical_benefits_desc:0 "Предоставление всем гражданам базовых медицинских льгот станет шагом к принятию закона."
 NZL_nationalize_commerical_broadcasting:0 "Национализировать коммерческое радиовещание"
 NZL_nationalize_commerical_broadcasting_desc:0 "Правительству необходим контроль над радио, чтобы обеспечить добросовестную рекламу."
 NZL_state_controlled_bank:0 "Создать государственные резервные банки"
 NZL_state_controlled_bank_desc:0 "Великая депрессия преподала нам уроки, один из которых — необходимость обеспечивать безопасность банков."
 NZL_the_social_security_acts:0 "Закон о социальном обеспечении"
 NZL_the_social_security_acts_desc:0 "Лейбористская партия обещала принять этот закон в течение некоторого времени, это обеспечит Новую Зеландию прогрессивными программами, доступными для всех."
 NZL_the_goodwill_mission:0 "Миссия доброй воли"
 NZL_the_goodwill_mission_desc:0 "Следует провести переговоры с движением Мау в Самоа о пути к независимости, возвращении Олафа Нельсона из изгнания и других важных вопросах. Эти переговоры должны обеспечить мирный переход и укрепить связи между Самоа и Новой Зеландией."
 NZL_unenmployment_benefit:0 "Пособие по безработице"
 NZL_unenmployment_benefit_desc:0 "Одной из частей закона о социальном обеспечении станет пособие по безработице, которое поможет снизить уровень бедности."
 NZL_construct_state_housing:0 "Строить государственное жильё"
 NZL_construct_state_housing_desc:0 "Современной стране необходимо жильё для тех, кто слишком беден, чтобы приобрести собственный дом."
 NZL_old_age_pension:0 "Пенсия по старости"
 NZL_old_age_pension_desc:0 "Правительство обязано заботиться о пожилых гражданах, посвятивших жизнь стране."
 NZL_dedicate_men:0 "Направить людей на военные нужды"
 NZL_national_party_triumphant:0 "Триумф Национальной партии"
 NZL_national_party_triumphant_desc:0 "Слишком долго Лейбористская партия обещала пустые программы. Национальная партия действительно может достичь своих целей и исправить ошибки лейбористов."
 NZL_appeal_rural_communities:0 "Обратиться к сельским общинам"
 NZL_appeal_rural_communities_desc:0 "Основная поддержка нашей партии сосредоточена в небольших сельских городах Новой Зеландии. Чтобы удержать позиции, необходимо удовлетворить их потребности."
 NZL_condem_intervention:0 "Осудить вмешательство правительства"
 NZL_condem_intervention_desc:0 "Правительство должно держаться подальше от частного бизнеса и вообще не вмешиваться в экономику."
 NZL_absorb_conservative_remains:0 "Поглотить остатки консервативных партий"
 NZL_absorb_conservative_remains_desc:0 "Некоторые члены Лейбористской партии симпатизируют некоторым политикам нашей партии. Мы могли бы использовать их навыки."
 NZL_equality_conscription:0 "Равенство через воинскую повинность"
 NZL_equality_conscription_desc:0 "Коренное население также должно подлежать призыву — его статус не освобождает от долга перед страной."
 NZL_fight_militant_worker_union:0 "Бороться с воинственными профсоюзами"
 NZL_fight_militant_worker_union_desc:0 "Некоторые профсоюзы нельзя усмирить повышением зарплат. Если придётся арестовывать их членов — так тому и быть."
 NZL_tackle_inflation:0 "Сдержать инфляцию"
 NZL_tackle_inflation_desc:0 "Необходимо принять меры против инфляции, пока она не стала серьёзной проблемой."
 NZL_war_council:0 "Консультативный военный совет"
 NZL_war_council_desc:0 "Создание военного совета с участием всех партий может повысить эффективность армии."
 NZL_open_up_to_free_market:0 "Открыться свободному рынку"
 NZL_open_up_to_free_market_desc:0 "Открытие свободному рынку — главная цель нашей партии. После победы на выборах мы наконец можем её осуществить."
 NZL_combined_intelligence_centre:0 "Объединённый разведывательный центр"
 NZL_combined_intelligence_centre_desc:0 "Мы должны сотрудничать с Соединённым Королевством для перехвата и расшифровки закодированных сообщений."
 NZL_construct_shore_fortification:0 "Построить береговые укрепления"
 NZL_construct_shore_fortification_desc:0 "Необходимо подготовить побережье к нападению любого агрессора и обеспечить нашу безопасность."
 NZL_unite_communist_movements:0 "Объединить коммунистические движения"
 NZL_unite_communist_movements_desc:0 "Коммунистическое движение Новой Зеландии пока представляет собой лишь разрозненные группы, печатающие статьи и устраивающие протесты. Чтобы прийти к власти, необходимо объединиться в одну партию."
 NZL_lobby_soviet:0 "Лоббировать поддержку в Советском Союзе"
 NZL_lobby_soviet_desc:0 "Советский Союз станет нашим важнейшим инвестором после прихода к власти, поэтому необходимо заранее заручиться его поддержкой."
 NZL_the_peoples_voice:0 "«Голос народа»"
 NZL_the_peoples_voice_desc:0 "«Голос народа» — наш самый мощный инструмент распространения идей среди масс. Необходимо обеспечить продолжение его выпуска."
 NZL_invite_radical_labour_exiles:0 "Пригласить изгнанных радикальных рабочих"
 NZL_invite_radical_labour_exiles_desc:0 "Джон А. Ли и Билл Барнард могут сочувствовать нашему делу. Нельзя игнорировать их навыки и влияние."
 NZL_new_wave_of_feminism:0 "Новая волна феминизма"
 NZL_new_wave_of_feminism_desc:0 "В новом обществе все должны быть равны перед законом, независимо от пола."
 NZL_maori_equality:0 "Равноправие маори"
 NZL_maori_equality_desc:0 "Народ маори слишком долго подвергался угнетению. Он заслуживает тех же прав, что и остальные граждане."
 NZL_nationalize_bank:0 "Национализировать Банк Новой Зеландии"
 NZL_nationalize_bank_desc:0 "Банк Новой Зеландии необходимо национализировать, чтобы обеспечить дальнейший экономический рост."
 NZL_public_housing:0 "Отдать приоритет государственному жилью"
 NZL_public_housing_desc:0 "Обеспечение базовых условий жизни для граждан, которые не могут позволить их себе, покажет прогрессивность нашей страны."
 NZL_encourage_selfless_citizens:0 "Поощрять самоотверженность граждан"
 NZL_encourage_selfless_citizens_desc:0 "Самоотверженность и добродетель необходимы каждому жителю, если мы хотим выжить в этом мире. Трусости здесь нет места."
 NZL_join_sov:0 "Союз с Советским Союзом"
 NZL_join_sov_desc:0 "Мы уступаем противникам в силах и окружены враждебными соседями. Ради выживания необходимо заключить союз с оплотом коммунизма."
 NZL_neutral:0 "Стабилизировать внутренние дела"
 NZL_neutral_desc:0 "Укрепление собственной власти в стране важнее вмешательства во внешние дела."
 NZL_increased_defense_spending:0 "Увеличить оборонные расходы"
 NZL_increased_defense_spending_desc:0 "Война требует современного снаряжения, и мы не можем полагаться только на находки и поставки союзников."
 NZL_central_research_planning:0 "Централизованное планирование исследований"
 NZL_central_research_planning_desc:0 "Плановая экономика также предполагает направление учёных к технологиям, которые понадобятся стране в будущем, словно великий разум заранее видит грядущее и выбирает лучшие пути."
 NZL_national_research_grants:0 "Национальные исследовательские гранты"
 NZL_national_research_grants_desc:0 "Нужно полагаться на собственные нововведения, которые, как известно, превосходят иностранные. Именно так жители этих островов уничтожили опасных птиц, вместо того чтобы проиграть им."
 NZL_corporate_innovations:0 "Корпоративные инновации"
 NZL_corporate_innovations_desc:0 "Частный сектор умеет разрабатывать новые технологии, а конкуренция выявит лучшее, на что способна наша страна."
 NZL_paratrooper_units:0 "Ставка на воздушно-десантные войска"
 NZL_paratrooper_units_desc:0 "Возможно, мы не сможем прорваться к врагу с моря, но всегда остаётся путь по воздуху."
 NZL_naval_equipment:0 "Военно-морское оборудование"
 NZL_naval_equipment_desc:0 "Современный корпус корабля бесполезен без современного оснащения."
 NZL_memories_of_the_great_war:0 "Память о Великой войне"
 NZL_memories_of_the_great_war_desc:0 "Тысячи сыновей и отцов Новой Зеландии покоятся на чужих полях, и тяжёлая цена прошлых конфликтов давит на страну. Многие граждане и политики решительно выступают против использования наших войск как пешек в бессмысленных европейских войнах, ставя национальные интересы и сохранение жизней выше участия в далёких спорах."
 NZL_white_feather_movement:0 "Движение белого пера"
 NZL_the_white_feather_movement_desc:0 "Белое перо, символ трусости в Британии времён Великой войны, женщины нередко вручали мужчинам без формы, публично стыдя их и побуждая записываться в армию. С началом мирового конфликта подобная практика появилась и у нас.\n\n§RЭтот национальный дух исчезнет, если мы не участвуем в войне§!."
 NZL_fighting_tyranny:0 "Борьба с тиранией, где бы она ни находилась"
 NZL_reinvigorated_spirit:0 "Возрождённый боевой дух"
 NZL_hot_climate_equipment_idea:0 "Снаряжение для жаркого климата"
 NZL_charlton_conversion_idea:0 "Переделка винтовки Чарлтона"
 NZL_charlton_conversion_idea_desc:0 "Мы переделали надёжную Lee-Enfield в полуавтоматическую винтовку, чтобы усилить огневую мощь. Переделка Чарлтона позволяет эффективнее производить пехотное оружие, экономя ресурсы и сохраняя надёжность в бою. Эта разработка демонстрирует нашу изобретательность в преодолении нехватки снаряжения и лучше вооружает солдат для будущих сражений."
 NZL_womens_service_army:0 "Женский вспомогательный армейский корпус"
 NZL_womens_service_air:0 "Женские вспомогательные военно-воздушные силы"
 NZL_womens_air_service_army_air:0 "Женская вспомогательная служба военного времени"
 NZL_destruction_of_the_lee_afair:0 "Разгром дела Ли"
 NZL_destruction_of_the_lee_afair_desc:0 "Джон А. Ли был известным политиком, который известен своей более радикальной стороной. Он резко критикует каждый шаг лейбористов, в ответ мы понизили его с позиций, обладающих слишком большой властью."
 NZL_upset_maori_population:0 "Недовольство коренного населения"
 NZL_upset_maori_population_desc:0 "Коренное население уже некоторое время устраивает беспорядки из-за вопросов автономии и изъятия земель. Возможно, пора искать решения."
 NZL_organizing_communists:0 "Организующиеся коммунисты"
 NZL_stiff_opposition:0 "Жёсткая оппозиция"
 NZL_unemployment_benefit:0 "Пособие по безработице"
 NZL_the_engineer_corp:0 "Артиллерийский полк"
 NZL_create_a_satnding_navy:0 "Создать постоянный флот"
 NZL_a_moderate_army:0 "Развивающаяся армия"
 NZL_a_proper_army:0 "Полноценные вооружённые силы"
 NZL_a_true_army:0 "Армия Новой Зеландии"
 NZL_integrating_maori:0 "Интеграция маори"
 NZL_autonomy_for_maori:0 "Автономное коренное население"
 socialist_finance_minister:0 "Социалистический министр финансов"
 socialist_follower:0 "Сторонник Ли"
 labour_party_remnant:0 "Отказ от лейбористской партии"
 NZL_obtain_funding:0 "Получить партийное финансирование"
 NZL_prioritize_house:0 "Государственное жильё"
 NZL_fight_for_authority_over_our_troops:0 "Ввести воинскую повинность"
 NZL_devaluated_currency:0 "Девальвированная валюта"
 NZL_devaluated_currency_desc:0 "Для поддержки мобилизации необходимо снизить часть заработных плат, и лучше всего сделать это посредством девальвации новозеландского доллара."
 NZL_defend_our_islands:0 "Защищаем наши острова"
 NZL_defend_our_islands_desc:0 "Мы должны быть готовы к нападению на наш островной рай с моря. Военно-морские бомбардировщики могут перехватывать и атаковать десантные корабли или даже нацеливаться на крупные корабли."
 NZL_commie_tt:0 "Завершение этого фокуса откроет коммунистический путь на выборах"
 NZL_legion_tt:0 "Завершение этого фокуса откроет фашистский путь на выборах"
 NZL_the_wairarapa_sheep_cattle_farms:0 "Животноводческие хозяйства Вайрарапы"
 NZL_the_wairarapa_sheep_cattle_farms_lesser:0 "Животноводческие хозяйства Вайрарапы"
 NZL_the_wairarapa_sheep_farms_lesser:0 "Овцеводческие хозяйства Вайрарапы"
 NZL_the_wairarapa_sheep_farms_lesser_desc:0 "Из-за военной нагрузки овечьи стада были переориентированы с производства шерсти на мясо, чтобы в первую очередь снабжать войска продовольствием и удовлетворять срочные потребности войны вместо традиционного текстильного экспорта."
 NZL_sustenace_relief_work:0 "Программы временных общественных работ"
 new_zealand.1.t:0 "Майкл Сэвидж тяжело заболевает — необходимо назначить нового премьер-министра"
 new_zealand.1.d:0 "С постоянно растущим напряжением, раздробленным состоянием Лейбористской партии мы должны искать преемника все более отвратительного Майкла Джозефа Сэвиджа. Питер Фрейзер зарекомендовал себя как более способный лидер и получил высокую поддержку как Уолтера Нэша, так и премьер-министра Сэвиджа. Однако это не мешает оппозиции Сэвиджа во главе с Герваном Макмилланом пытаться еще сильнее продвигать свою повестку дня, Макмиллан, более спорный выбор, выразил симпатии к экстрадированному члену Лейбористской партии Джону А. Ли, что делает его непопулярным."
 new_zealand.1.a:0 "Питер Фрейзер - лучшее решение для недугов Труда."
 new_zealand.1.b:0 "Модерация Гервана Макмиллана исправит Лейбористскую партию."
 new_zealand.1.c:0 "Партия слишком расколота. Нам нужно больше времени."
 new_zealand.2.t:0 "Майкл Джозеф Сэвидж скончался"
 new_zealand.2.d:0 "Премьер-министр Майкл Сэвидж объявил, что Новая Зеландия будет поддерживать Великобританию и заявит о своей поддержке нации. Герой, как и великий лидер, не боящийся критиковать то, что он считал неправильным, его будет не хватать. Теперь Лейбористская партия должна внести поправки в его уход и подготовиться к тому, чтобы возглавить страну."
 new_zealand.2.a:0 "Покойся с миром."
 new_zealand.2.b:0 "Пусть партия разбирается сама — настало время нового будущего."
 new_zealand.3.t:0 "Всеобщие выборы 1938 года"
 new_zealand.3.d:0 "Две основные партии, столкнувшиеся на этих выборах, сделали все больше и больше предложений, чтобы повлиять на общественность. Лейбористская партия уже довольно долгое время возглавляет нацию и пообещала принять Закон о социальном обеспечении, который обещает предоставить пенсии по старости и пособия по безработице. Было доказано, что это является отличным рычагом давления на Национальную партию, которая открыто критикует политику Лейбористской партии. Национальная партия, хотя и новая, набирает популярность на протяжении многих лет, и заручилась поддержкой, используя слабые стороны лейбористского правительства. Хотя выборы, скорее всего, в пользу Лейбористской партии, есть шанс, что Национальная партия может доказать обратное."
 new_zealand.3.a:0 "Рабочая партия должна выполнить свои обещания."
 new_zealand.3.b:0 "У лейбористов было свое время, нация должна предпринять необходимые изменения."
 new_zealand.3.c:0 "Новая Зеландия сама выкует народное будущее."
 new_zealand.3.e:0 "Легион приведёт Новую Зеландию к славе."
 new_zealand.4.t:0 "Легион отменяет трудовые отставки"
 new_zealand.4.d:0 "После смерти премьер-министра лейбористов Майкла Сэвиджа сторонники Легиона во главе с Джоном Ормондом начали требовать отставки известных чиновников лейбористской партии, таких как Питер Фрейзер и Уолтер Нэш. Лейбористское правительство, ослабленное смертью своего лидера и не имеющее явной замены, похоже, не встречает требований Ормонда. Только время покажет, сможет ли Легион стать главной партией в будущем Новой Зеландии."
 new_zealand.4.a:0 "Легион — лучшая надежда на будущее Новой Зеландии."
 new_zealand.5.t:0 "Коммунистические газеты распространяются по стране"
 new_zealand.5.d:0 "Странные газеты все чаще распространяются в крупных городах, выступая за новую систему, прямо противоположную идеалам Легионных Остаток и Лейбористской партии. Никто не может найти источник этих документов, кроме того, считается, что они исходят из возможных укрытий в сельской местности. Некоторые из них стали более взволнованными в результате беспорядков, вспыхнувших по всей стране с требованием смещения всех правительственных чиновников, а также прекращения Легиона и его лидера Ормонда. Лейбористская партия, не имеющая лидера, скорее всего, подчинится, однако Ормонд пригрозил бороться с беспорядками со своими сторонниками."
 new_zealand.5.a:0 "Уйти в отставку — коммунистов больше."
 new_zealand.5.b:0 "Немедленно подавить беспорядки, иначе положение лишь ухудшится."
 new_zealand.6.t:0 "Генерал-губернатор объединяет лоялистов"
 new_zealand.6.d:0 "Статус Новой Зеландии как доминиона оказался под вопросом, а в Британии монархия вновь получила всю полноту власти, поэтому многие партии требуют независимости. Однако сильное лоялистское движение во главе с генерал-губернатором Джорджем Монктон-Арунделлом пытается укрепить контроль над страной. Это уже привело к открытым столкновениям радикальных партий на улицах Веллингтона и породило сомнения в безопасности страны."
 new_zealand.6.a:0 "Пусть губернатор выдвигает требования — Новая Зеландия с Британией."
 new_zealand.6.b:0 "Подавить все движения лоялистов — они угрожают нашей безопасности."
 new_zealand.9.t:0 "Коммунисты вытесняют труд и легион"
 new_zealand.9.d:0 "С ростом популярности коммунистической партии, люди начали бунтовать против вновь возрождающегося легиона, особенно после краха лейбористского правительства. Численность превышена, мистер. Ормонд ушел в отставку, оставив будущее Новой Зеландии в руках Коммунистической партии."
 new_zealand.10.t:0 "Сидни Холланд принимает руководство"
 new_zealand.10.d:0 "Адам Гамильтон ушёл с постов лидера Национальной партии и премьер-министра, передав их Сидни Холланду. Холланд показал себя достойным преемником и заявил, что продолжит программу националистов."
 new_zealand.10.a:0 "Холланд подаёт большие надежды."
 cheese_man:0 "Король сыра"
 CHT_fading_national_identity:0 "Угасающая национальная идентичность"
 NZL_the_stance_on_maori:0 "Решить вопрос беспорядков маори"
 NZL_the_stance_on_maori_desc:0 "Положение народа маори в Новой Зеландии остаётся неопределённым, а его будущее находится на распутье. Следует ли сохранить традиции и образ жизни маори, уважая их культуру и признавая важной частью страны? Или их роль в обществе должна измениться?"
 NZL_integrate_maori_into_new_zealand:0 "Интеграция маори"
 NZL_integrate_maori_into_new_zealand_desc:0 "Общая история с маори отмечена напряжённостью и борьбой, но теперь это не имеет значения. Впереди необходимость интегрировать их в новозеландское общество, независимо от их желаний и сопротивления."
 NZL_respect_maori_culture:0 "Равноправие маори"
 NZL_respect_maori_culture_desc:0 "Народ маори слишком долго подвергался угнетению и был лишён заслуженных прав и признания. Пора исправить несправедливость и предоставить ему те же права и привилегии, что и всем остальным гражданам. Так мы создадим более справедливую и единую страну, где каждый ценится одинаково независимо от происхождения."
 NZL_maori_autonomy:0 "Автономия маори"
 NZL_maori_autonomy_desc:0 "Хотя наша история отношений с маори была непростой, а их недовольство недавней политикой растёт, возможно, пришло время примириться с коренным населением Новой Зеландии и восстановить испорченные отношения."
 NZL_protect_maori_land:0 "Конфисковать полезные земли маори"
 NZL_protect_maori_land_desc:0 "Маори контролируют несколько ключевых районов, необходимых для естественного расширения страны. Пора вернуть эти земли, предложив справедливую компенсацию. Это может вызвать напряжённость, но мера необходима для получения ресурсов, нужных нашему развитию."
 NZL_minor_native_representation_in_gov:0 "Ограниченное представительство коренного населения"
 NZL_minor_native_representation_in_gov_desc:0 "Предоставление избранным представителям коренного населения голоса в правительстве Новой Зеландии поможет справиться с растущим недовольством. Представительство может снизить напряжённость, успокоить протесты, создать чувство причастности и признать их значение для будущего страны."
 NZL_the_maori_division:0 "Дивизия маори"
 NZL_the_maori_division_desc:0 "Гордая воинская традиция народа маори давно является важной частью его культуры, а доблесть в прошлых конфликтах подтверждает его силу. Создание отдельной дивизии маори позволит направить этот боевой дух на службу стране."
 NZL_maori_into_economy:0 "Запустить промышленность маори"
 NZL_maori_into_economy_desc:0 "Поскольку маори сохраняют независимость от нашей политики, справедливо предоставить им ресурсы и поддержку для построения устойчивой экономики. Обеспечив средства для роста, мы гарантируем их процветание и сохраним мирные и продуктивные отношения."
 NZL_the_natives_of_new_zealand:0 "Коренные народы Новой Зеландии"
 NZL_the_natives_of_new_zealand_desc:0 "Мы предоставили маори долгожданную автономию. После этого другие полинезийские народы могут увидеть в нас более дружелюбного и надёжного партнёра в трудные времена. Это откроет путь к сближению и, возможно, созданию федерации, укрепляющей наше влияние и единство в Тихом океане."
 NZL_inlist_the_maori:0 "Призвать маори"
 NZL_inlist_the_maori_desc:0 "По мере роста напряжённости и приближения войны пора призвать маори защищать страну вместе с нами. Их воинский дух и доказанная храбрость делают их бесценными союзниками. Призывая их, мы одновременно чтим наследие и укрепляем войска."
 NZL_john_a_lee:0 "Джон А. Ли"
 NZL_john_a_lee_desc:0 "Прозвище \"Болси Ли\", Джон А. Ли поднялся в рядах лейбористов с огненной харизмой, но смелая критика Ли осторожного подхода Сэвиджа к экономическим реформам подпитывала нестабильность, поскольку его агрессивный толчок к более радикальной политике создает разделение среди коллег. В то время как некоторые считают его провидцем, выступающим за рабочий класс, другие видят в нем дестабилизирующую силу, чья неустанная оппозиция угрожает единству и сосредоточенности правительства."
