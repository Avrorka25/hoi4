 BUL_support_yugoslavian_seperatists:0 "Поддержать [YUG.GetAdjective] сепаратистов"
 BUL_support_yugoslavian_seperatists_desc:0 "[YUG.GetNameDefCap] — уродливое порождение Версальского договора. Многие народы в нашем окружении мечтают создать собственную родину, и это стремление можно обратить на пользу стране. Мы снабдим их оружием, чтобы они смогли «освободиться»."
 BUL_support_yugoslavian_seperatists_category:0 "Поддержка сепаратистов"
 BUL_support_yugoslavian_seperatists_category_desc:0 "Многие [YUG.GetAdjective] меньшинства борются за независимость, включая граничащих с нами вардарских македонцев. Если мы будем их финансировать, они смогут восстать и стать нашими ценными союзниками на Балканах.\nПоддержка сепаратистов в Македонии: §Y[?BUL.macedonian_support]%§!\n\nПоддержка сепаратистов в Хорватии: §Y[?BUL.croatian_support]%§!\n\nПоддержка сепаратистов в Словении: §Y[?BUL.slovenian_support]%§!\n\nПоддержка сепаратистов в Боснии: §Y[?BUL.bosnian_support]%§!"
 BUL_support_imro:0 "Поддержать ВМРО:\n§R+100% поддержки в Македонии§!"
