 BUL_radioprom:0 "Радиопром"
 BUL_shared_manufacturing_experience:0 "Общий производственный опыт"
 BUL_shared_manufacturers_experience_tooltip:0 "Сотрудничество производителей снизит стоимость техники, выпускаемой членами вашей фракции, в зависимости от выбранных разными странами производителей. Бонусы суммируются, если их специализации различаются: два производителя пехотного вооружения всё равно снизят стоимость винтовок на 3%, но конструкторы мобильных и тяжёлых танков дадут более значительное снижение стоимости танков."
