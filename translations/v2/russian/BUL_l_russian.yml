 BUL_invite_lukov_to_a_political_position:0 "Предложить Лукову политическую должность"
 BUL_explore_radicalisation_of_the_government:0 "Изучить возможность радикализации правительства"
 BUL_the_legionnaires_march:0 "Привлечь население на нашу сторону"
 BUL_march_on_sofia:0 "Марш на Софию"
 BUL_diplomatic_mission_to_the_soviet_union:0 "Дипломатическая миссия в [SOV.GetNameDef]"
 BUL_diplomatic_mission_to_the_soviet_union_desc:0 "К северу от нас лежит Украина, контролируемая [SOV.GetNameDef]. Следует направить дипломата для улучшения отношений, ведь нельзя просто игнорировать столь могущественного соседа."
 BUL_revoke_censorship_communist_material:0 "Отменить запрет на коммунистические материалы"
 BUL_revoke_censorship_communist_material_desc:0 "Сейчас литература и труды [BUL.GetAdjective] рабочих запрещены правительством, но время показало ошибочность этого решения. Отмена запрета снизит общественное недовольство и поможет объединить страну."
 BUL_commitee_of_state_security:0 "Комитет государственной безопасности"
 BUL_commitee_of_state_security_desc:0 "Всегда существует страх, что политические враги готовят выступление против партии. Решением станет создание тайной полиции, которая проникнет в такие группы и ликвидирует их."
 BUL_rally_the_proletariat:0 "Сплотить пролетариат"
 BUL_rally_the_proletariat_desc:0 "Социалистические революции в России показали, что пролетариат — сила, достойная уважения. Мы прославим его среди [BUL.GetAdjective] народа и продолжим его наследие."
 BUL_align_with_molotov_ribbentrop_pact:0 "Присоединиться к пакту Молотова — Риббентропа"
 BUL_align_with_molotov_ribbentrop_pact_desc:0 "Закрепление нашего положения в Европе имеет решающее значение для процветания великой страны. Мир с [GER.GetNameDef] и улучшение отношений с [SOV.GetNameDef] лишь укрепят нашу стратегическую позицию."
 BUL_peoples_courts:0 "Народные суды"
 BUL_peoples_courts_desc:0 "Хотя предатели и враги революции были устранены, некоторые всё ещё скрываются в рядах армии. Расследования и чистки гарантируют, что в будущем они не станут проблемой."
 BUL_ties_with_ussr:0 "[SOV.GetAdjective] Связи"
 BUL_ties_with_ussr_desc:0 "Теперь, когда революция победила в [BUL.GetNameDef], разумнее всего сблизиться с нашим естественным союзником — [SOV.GetNameDef]. Этот союз принесёт огромную пользу: [SOV.GetAdjective] партнёры помогут развить страну и превратить её в столь необходимую нам социалистическую утопию."
 BUL_balkan_revolution:0 "Объединиться против общего врага"
 BUL_balkan_revolution_desc:0 "В [YUG.GetNameDef] наши товарищи пришли к власти, и пора скрепить связь союзом против бед современного мира — капитализма и фашизма."
 BUL_communist_scientific_cooperation:0 "Коммунистическое научное сотрудничество"
 BUL_communist_scientific_cooperation_desc:0 "Создав союз с товарищами, мы сможем совместно развивать экономики, обмениваться доктринами и стратегиями. Главное же — благодаря полученным от них технологиям мы сумеем стать военной державой."
 BUL_social_reforms:0 "Социальные реформы"
 BUL_social_reforms_desc:0 "Теперь, когда угнетатели устранены, мы проведём социальные реформы в интересах [BUL.GetAdjective] сельского населения, ограничив аристократию. Нужно повысить уровень жизни и воплотить социалистическую мечту."
 BUL_nationalizations:0 "Централизованное экономическое планирование"
 BUL_nationalizations_desc:0 "Со времён Великой войны Болгария постоянно испытывала экономические трудности из-за слабой финансовой системы. Централизация экономики значительно улучшит её положение."
 BUL_communist_heavy_industry:0 "Коммунистическая тяжёлая промышленность"
 BUL_communist_heavy_industry_desc:0 "Нельзя отрицать, что наша страна стремится к миру, однако у границ неизбежно назревает конфликт, и мы должны быть готовы защищать Родину. Финансирование тяжёлой промышленности окажется чрезвычайно полезным в случае войны."
 BUL_army_reorganization:0 "Реорганизация армии"
 BUL_army_reorganization_desc:0 "Структура нашей армии всё ещё устарела и не соответствует современным требованиям. Необходима масштабная реорганизация, и под руководством коммунистических союзников [BUL.GetAdjective] армия вновь станет великой."
 BUL_communist_volunteers:0 "Создать [BUL.GetAdjective] международные силы"
 BUL_communist_volunteers_desc:0 "Отправка добровольцев дружественным коммунистическим странам значительно укрепит наше положение на мировой арене и повысит моральный дух населения."
 BUL_communist_youth:0 "Коммунистический союз молодёжи"
 BUL_communist_youth_desc:0 "Коммунистические молодёжные организации обеспечат верность будущих поколений революции и партии. Они будут обучать молодёжь основам наших идеалов и помогать ей преуспеть в будущем."
 BUL_invite_greece_communism:0 "Пригласить [GRE.GetNameDef]"
 BUL_invite_greece_communism_desc:0 "Наши товарищи на юге наконец пришли к власти. Сближение двух стран гарантирует безопасность обеих революций."
 BUL_invite_romania_communism:0 "Пригласить [ROM.GetNameDef]"
 BUL_invite_romania_communism_desc:0 "Теперь, когда в Румынии установился коммунистический режим, военное сотрудничество отвечает общим интересам."
 BUL_invite_albania_communism:0 "Пригласить [ALB.GetNameDef]"
 BUL_invite_albania_communism_desc:0 "[ALB.GetNameDef] находится под угрозой со стороны [ITA.GetNameDef] на западе и без внешней помощи может не выстоять. Взяв её под защиту, мы сдержим любую попытку вторжения."
 BUL_soviet_theorists:0 "Пригласить [SOV.GetAdjective] специалистов"
 BUL_soviet_theorists_desc:0 "Учитывая наши связи с [SOV.GetAdjective]Естественно, что мы должны сотрудничать с ними для ускорения наших исследований. Мы предлагаем координировать с [SOV.GetAdjective] исследователей, чтобы догнать технологические достижения других стран."
 BUL_yugoslavist_triumph:0 "[YUG.GetAdjective] союз"
 BUL_yugoslavist_triumph_desc:0 "[YUG.GetAdjective] капиталистическое правительство никогда не согласится принять социализм, мешая нам воссоединиться со славянскими братьями и сёстрами. Пора свергнуть монархию и распространить коммунизм по всей [YUG.GetNameDef], сделав её свободной и социалистической."
 BUL_restore_spirit_tarnovo_constitution:0 "Вспомнить Тырновскую конституцию"
 BUL_restore_spirit_tarnovo_constitution_desc:0 "Хотя Тырновская конституция была составлена в XIX веке, она всё ещё действует, но парламент почти не обеспечивает её соблюдение из-за поправок 1908 и 1911 годов, которые продолжали усиливать царскую власть. Пора ограничить монарха и вернуть конституцию к первоначальному виду."
 BUL_support_multipartism:0 "Поддержать многопартийность"
 BUL_support_multipartism_desc:0 "Настало время принять многопартийную систему. Мы должны поощрять и поддерживать тех, кто желает создавать партии, и законно допустить их к национальным выборам."
 BUL_appeal_to_the_west_democracies:0 "Обратиться к западным демократиям"
 BUL_appeal_to_the_west_democracies_desc:0 "Наша страна должна искать помощи у таких демократий, как [ENG.GetNameDef], [USA.GetNameDef] и [FRA.GetNameDef]. Правительство продемонстрировало готовность к более демократическим практикам, и теперь следует улучшить отношения с этими странами ради взаимовыгодных соглашений."
 BUL_voting_concessions:0 "Отстранить Кьосеиванова"
 BUL_voting_concessions_desc:0 "Премьер-министр Георги Кьосеиванов злоупотреблял властью, и его нарушение Тырновской конституции не должно остаться безнаказанным. За действия против Родины он заслуживает отстранения от должности."
 BUL_release_the_opposition:0 "Освободить оппозицию"
 BUL_democracy_through_elections:0 "Демократия через выборы"
 BUL_democracy_through_elections_desc:0 "Теперь, с возвращением политических свобод, необходимо провести новые выборы, чтобы определить, кто возглавит [BUL.GetNameDef]."
 BUL_initiate_land_reforms:0 "Начать экономические и земельные реформы"
 BUL_initiate_land_reforms_desc:0 "[BUL.GetAdjective] крестьяне продолжают страдать из-за экономической зависимости от землевладельцев. Перераспределение земли и общая экономическая реформа улучшат жизнь всего [BUL.GetAdjective] народа."
 BUL_crush_the_monarchists:0 "Дискредитировать абсолютистов"
 BUL_crush_the_monarchists_desc:0 "Абсолютизм — пережиток прошлого, которому вообще не следовало появляться в Болгарии. Его необходимо представить как зло, противоречащее благополучию народа."
 BUL_form_the_orange_guard:0 "Создать Оранжевую гвардию"
 BUL_form_the_orange_guard_desc:0 "Оранжевая гвардия была военизированной организацией, связанной с Болгарским земледельческим народным союзом во времена премьерства Александра Стамболийского. Она служила его охраной и помогала проводить аграрные реформы. Восстановление гвардии обеспечит безопасность правительства перед угрозой прихода к власти тиранов."
 BUL_establish_free_trade:0 "Создать экономику свободной торговли"
 BUL_establish_free_trade_desc:0 "Экономическое процветание зависит от способности приспосабливаться к мировому рынку. Реформы в пользу свободной торговли облегчат нашу интеграцию в мировую экономику."
 BUL_invite_investors:0 "Пригласить промышленных инвесторов"
 BUL_invite_investors_desc:0 "Наши реформы в поддержку бизнеса побудили многих иностранных инвесторов участвовать в экономике страны, одновременно повышая уровень жизни и расширяя промышленный потенциал."
 BUL_fund_orthodox_church:0 "Финансировать православную церковь"
 BUL_fund_orthodox_church_desc:0 "Православная церковь, официальная религия [BUL.GetNameDef], всегда будет получать государственную поддержку. Это улучшит отношение религиозного населения к правительству."
 BUL_denounce_fascist_nations:0 "Выступить с антифашистской речью"
 BUL_denounce_fascist_nations_desc:0 "Фашизм — тоталитарная идеология, основанная на эксплуатации народа и лишении его свободы, — недопустим. Публичное осуждение этой угрозы покажет, что правительство готово защищать права граждан."
 BUL_approach_the_west:0 "Сблизиться с Западом"
 BUL_approach_the_west_desc:0 "Сближение с западными странами отвечает нашим интересам благодаря идеологической близости и, как мы надеемся, общим целям."
 BUL_alliance_with_britain:0 "Союз с [ENG.GetNameDef]"
 BUL_alliance_with_britain_desc:0 "Официальный союзный договор с [ENG.GetNameDef] гарантирует безопасность [BUL.GetNameDef] от тоталитарных держав, желающих вторгнуться или включить нас в свою сферу."
 BUL_reaffirm_trade_relations_with_balkans:0 "Создать Балканский торговый пакт"
 BUL_reaffirm_trade_relations_with_balkans_desc:0 ""
 BUL_negotiate_for_south_dobrudja:0 "Провести переговоры с [ROM.GetNameDef]"
 BUL_negotiate_for_south_dobrudja_desc:0 "Южная Добруджа по-прежнему населена преимущественно болгарами. После Второй Балканской войны она была оккупирована и аннексирована Королевством Румыния. При поддержке союзников мы можем попытаться договориться о возвращении территории, гарантировав соблюдение прав проживающих там [ROM.GetAdjective] меньшинств."
 BUL_non_aggression_pact_with_soviet:0 "Пакт о ненападении с [SOV.GetNameDef]"
 BUL_non_aggression_pact_with_soviet_desc:0 "Несмотря на идеологические различия, нам выгодно добиться разрядки с [SOV.GetNameDef], подписав пакт о ненападении и устранив угрозу вторжения с её стороны или со стороны союзников."
 BUL_industrial_modernization:0 "Промышленная модернизация"
 BUL_industrial_modernization_desc:0 "[BUL.GetNameDefCap] далеко до соперничества с остальной Европой в промышленности, поскольку мы прежде всего аграрная страна. Подготовлены долгосрочные планы индустриализации, которые будут реализованы."
 BUL_post_depression_economic_recovery:0 "Развивать гражданский сектор"
 BUL_post_depression_economic_recovery_desc:0 "Гражданский сектор, уже частично существующий в [BUL.GetNameDef], можно расширить, чтобы увеличить наши строительные возможности."
 BUL_two_year_railway_plan:0 "Двухлетний план расширения железных дорог"
 BUL_two_year_railway_plan_desc:0 "Для промышленного развития необходим амбициозный план расширения всех [BUL.GetAdjective] дорог."
 BUL_expand_chromium_production:0 "Разработка залежей хрома"
 BUL_expand_chromium_production_desc:0 "Наши недра богаты хромом — ресурсом, широко используемым в военном производстве. Расширение добычи приблизит нас к самообеспеченности."
 BUL_expand_the_chelopech_gold_deposit:0 "Расширить золотое месторождение Челопеч"
 BUL_expand_the_chelopech_gold_deposit_desc:0 "Добыча золота и получаемая прибыль дадут средства, необходимые для промышленного расширения."
 BUL_technological_advancement:0 "Технологический прогресс"
 BUL_technological_advancement_desc:0 "Промышленное развитие сопровождается ростом научных исследований, позволяя добиться значительно более быстрой технологической модернизации."
 BUL_build_coal_power_plants:0 "Строить угольные электростанции"
 BUL_build_coal_power_plants_desc:0 "Промышленная модернизация увеличивает спрос на электроэнергию. Развитие генерации на угле обеспечит наши заводы необходимой мощностью."
 BUL_mobilize_natural_resources:0 "Мобилизовать природные ресурсы"
 BUL_mobilize_natural_resources_desc:0 "Расширение добычи природных ресурсов должно сопровождаться ограничением экспорта, чтобы прежде всего использовать их в собственной промышленности."
 BUL_liquify_coal:0 "Новое применение угля"
 BUL_liquify_coal_desc:0 "Сжижение угля даёт прекрасную возможность увеличить производство топлива, от которого мы зависим."
 BUL_housing_expansion_plan:0 "План расширения жилищного строительства"
 BUL_housing_expansion_plan_desc:0 "Мы начнём программу строительства государственного жилья, чтобы больше людей могли жить в достойных условиях, переезжать в города и увеличивать городское население."
 BUL_kickstart_ammunition_production:0 "Запустить производство боеприпасов"
 BUL_kickstart_ammunition_production_desc:0 "После двух последовательных поражений производство оружия и боеприпасов не было приоритетом правительств. Но теперь, когда тень войны всё ближе, необходимо перевооружаться, начав с выпуска боеприпасов для уже имеющихся орудий."
 BUL_heavy_war_industry_expansion:0 "Расширение тяжёлой военной промышленности"
 BUL_heavy_war_industry_expansion_desc:0 "Заводы, способные выпускать танки и самолёты, абсолютно необходимы любой стране, готовящейся к конфликту."
 BUL_artillery_pieces_production:0 "Опыт производства артиллерии"
 BUL_artillery_pieces_production_desc:0 "Необходимо в полной мере использовать наш опыт в артиллерийском производстве, увеличив мощности."
 BUL_ministries_coop:0 "Совместные усилия министерств"
 BUL_ministries_coop_desc:0 "Сотрудничество министерств, отвечающих за промышленность, позволит направить их усилия на рост военного производства и плавно перейти к военной экономике."
 BUL_finalize_rearmament_plans:0 "Завершить план промышленного перевооружения"
 BUL_finalize_rearmament_plans_desc:0 "Начался последний этап полной мобилизации болгарской военной промышленности. Так мы достигнем уровня производства, необходимого для надлежащего оснащения армии."
 BUL_industrial_centralization:0 "Централизация промышленности"
 BUL_industrial_centralization_desc:0 "Для соблюдения стандартов и выпуска эффективного снаряжения необходим более строгий государственный надзор за производством важнейших материалов."
 BUL_fill_the_supply_gaps:0 "Устранить пробелы в снабжении армии"
 BUL_fill_the_supply_gaps_desc:0 "Некоторым частям по-прежнему не хватает определённого оборудования. Диверсификация военных мастерских обеспечит большую гибкость производства и снабдит все войска необходимым снаряжением."
 BUL_repurpose_abandoned_facilities:0 "Перепрофилировать заброшенные предприятия"
 BUL_repurpose_abandoned_facilities_desc:0 "Многие военные мастерские со временем были закрыты. Возобновив их работу при государственной поддержке, мы сможем быстро и значительно увеличить военное производство."
 BUL_post_rearmament_military_plans:0 "Промышленные планы после перевооружения"
 BUL_post_rearmament_military_plans_desc:0 "Завершение перевооружения не должно означать конец развития военной промышленности. Армия продолжает расти, и для её оснащения потребуется всё более крупная промышленная база."
 BUL_the_prosperity_plan:0 "План процветания"
 BUL_the_prosperity_plan_desc:0 "«План процветания» — экономическая стратегия согласованного расширения гражданской и военной промышленности, повышающая эффективность обоих секторов."
 BUL_new_page_in_technological_research:0 "Новая страница [BUL.GetAdjective] технологий"
 BUL_new_page_in_technological_research_desc:0 "С началом реализации Плана процветания необходимо дополнить промышленную координацию научной, чтобы обеспечить беспрецедентный технологический скачок."
 BUL_military_rearmament_plans:0 "План военного перевооружения"
 BUL_military_rearmament_plans_desc:0 "Даже выражение «жалкое состояние» недостаточно описывает положение [BUL.GetAdjective] армии. Мы запустим масштабный план модернизации, чтобы привести её к стандартам великих держав."
 BUL_reform_the_army:0 "Реформировать армию"
 BUL_reform_the_army_desc:0 "Армия должна стать главным приоритетом реформ. Модернизация структуры и генерального штаба улучшит её состояние и подготовит к дальнейшему расширению."
 BUL_innovation_warfare:0 "Инновационная война"
 BUL_innovation_warfare_desc:0 "Великая война полностью изменила наше понимание боевых действий и открыла путь новым военным технологиям. Их развитие позволит использовать все преимущества современного оружия."
 BUL_bulgarian_tank_corps:0 "[BUL.GetAdjective] танковый корпус"
 BUL_bulgarian_tank_corps_desc:0 "Создание бронетанкового подразделения давно представлялось заманчивым благодаря его универсальности и невиданной разрушительной силе. Пора воплотить эту мечту."
 BUL_forces_of_mechanization:0 "Силы механизации"
 BUL_forces_of_mechanization_desc:0 "Быстрые и хорошо оснащённые части будут сопровождать традиционные дивизии, позволяя эффективнее захватывать вражеские территории."
 BUL_lightning_warfare:0 "Молниеносная война"
 BUL_lightning_warfare_desc:0 "Будущие войны выиграют самые быстрые и гибкие армии. У нас уже есть все технологии, необходимые для создания таких войск."
 BUL_strength_in_firepower:0 "Сила огневой мощи"
 BUL_strength_in_firepower_desc:0 "Даже во время Великой войны старый принцип применения всё более мощных орудий продолжал доказывать эффективность. Развитие артиллерии позволит наносить противнику огромный урон, не подвергая опасности собственных солдат."
 BUL_expand_artillery_supplies:0 "Расширить артиллерийские поставки"
 BUL_expand_artillery_supplies_desc:0 "Несмотря на острую необходимость вооружить армию, выпуск артиллерии всё ещё невелик. Мы договорились приобрести несколько орудий у немецкого производителя Rheinmetall."
 BUL_neverending_artillery_modernization:0 "Непрерывная модернизация артиллерии"
 BUL_neverending_artillery_modernization_desc:0 "Постоянное совершенствование артиллерийских технологий необходимо, чтобы сохранять эффективность даже против новейших разработок, таких как бронетехника."
 BUL_shells_and_guns:0 "Снаряды и орудия"
 BUL_shells_and_guns_desc:0 "Наступление, основанное на идеальной координации артиллерии и пехоты, позволит наносить тяжёлый урон при ограниченных потерях с нашей стороны."
 BUL_strive_for_an_organized_army:0 "Создать организованную армию"
 BUL_strive_for_an_organized_army_desc:0 "Организация и дисциплина [BUL.GetAdjective] армии должны стать главным приоритетом общей военной модернизации."
 BUL_modernized_weaponry:0 "Современное вооружение"
 BUL_modernized_weaponry_desc:0 "Оружие наших солдат всё сильнее устаревает и не способствует повышению боеспособности. Принятие на вооружение и производство новых винтовок улучшит общую эффективность армии."
 BUL_rifle_production:0 "Производство винтовок"
 BUL_rifle_production_desc:0 "Расширение предприятий по выпуску винтовок поддержит модернизацию пехоты и позволит формировать новые, столь же хорошо оснащённые части."
 BUL_maximized_planning_effort:0 "Максимальные усилия по планированию"
 BUL_maximized_planning_effort_desc:0 "Расширение генерального штаба позволило углубить изучение способов планирования атак. Успех наступления определяется качеством его подготовки."
 BUL_naval_air_rearmament_plan:0 "Начать перевооружение флота и авиации"
 BUL_naval_air_rearmament_plan_desc:0 "Военно-воздушные силы и флот никогда не получали должного внимания, особенно после потери значительной части побережья. Однако при достаточных усилиях их модернизация может стать серьёзным преимуществом."
 BUL_expand_the_varna_shipyards:0 "Расширить верфи Варны"
 BUL_expand_the_varna_shipyards_desc:0 "Наши кораблестроительные возможности остаются небольшими и в основном ограничены конвоями и гражданскими судами. Для создания настоящего флота необходимо модернизировать и прежде всего расширить производство более тяжёлых кораблей."
 BUL_heavy_vessels:0 "Тяжёлые корабли"
 BUL_heavy_vessels_desc:0 "Морское господство требует строительства достаточно мощных кораблей, объединённых в единый флот."
 BUL_build_the_burgas_shipyards:0 "Построить верфи Бургаса"
 BUL_build_the_burgas_shipyards_desc:0 "Расширение верфей Бургаса заметно улучшит наши морские возможности, раз мы решили сосредоточиться на тяжёлых и сверхтяжёлых кораблях."
 BUL_modern_battlecruisers:0 "Современные линейные крейсеры"
 BUL_modern_battlecruisers_desc:0 "Линейные крейсеры представляют хороший компромисс между огневой мощью и скоростью для флота тяжёлых кораблей, хотя обладают более лёгкой бронёй."
 BUL_modern_heavy_cruisers:0 "Современные тяжёлые крейсеры"
 BUL_modern_heavy_cruisers_desc:0 "Крейсеры идеально подойдут как средние корабли, сопровождающие флот в сражениях, где решающим фактором станет скорость."
 BUL_modern_battleships:0 "Современные линкоры"
 BUL_modern_battleships_desc:0 "Линкоры станут и авангардом, и флагманами нашего флота. Они должны быть максимально современными и мощными."
 BUL_shipbuilding_experience:0 "Опыт кораблестроения"
 BUL_shipbuilding_experience_desc:0 "Теперь, когда техника модернизирована, пора обновить тактику, ориентированную на концентрацию огромной огневой мощи."
 BUL_light_vessels:0 "Лёгкие корабли"
 BUL_light_vessels_desc:0 "Инновации жизненно важны для эффективности вооружённых сил. Пора отказаться от старой тактики тяжёлых кораблей и перейти к более лёгкому и быстрому флоту, а в случае подлодок — ещё и более скрытному."
 BUL_modern_light_cruisers:0 "Современные лёгкие крейсеры"
 BUL_modern_light_cruisers_desc:0 "Разработка облегчённых крейсеров позволит сохранить хорошую огневую мощь и не отставать по скорости от других кораблей."
 BUL_modern_destroyers:0 "Современные эсминцы"
 BUL_modern_destroyers_desc:0 "Эсминцы обеспечат надёжную защиту остальных кораблей."
 BUL_modern_submarines:0 "Современные подводные лодки"
 BUL_modern_submarines_desc:0 "Подводные лодки — революционная и захватывающая технология. Добавив скрытность в морской бой, мы сможем тайными атаками уничтожать даже кажущиеся непотопляемыми корабли."
 BUL_naval_strategy:0 "Военно-морская стратегия"
 BUL_naval_strategy_desc:0 "Пора реформировать морскую тактику в соответствии с выбранным составом флота. Так мы сможем полностью раскрыть потенциал кораблей."
 BUL_torpedo_based_navy:0 "Флот, основанный на торпедах"
 BUL_torpedo_based_navy_desc:0 "Торпеды представляют собой огромный прорыв в морском бою. Пора добавить это чудо техники в наш военно-морской арсенал."
 BUL_naval_bomber_focus:0 "Летающие торпеды"
 BUL_naval_bomber_focus_desc:0 "Мы должны разработать бомбардировщики, специально предназначенные для морского боя, чтобы поддерживать наши корабли, особенно в действиях против тяжёлых судов."
 BUL_rearm_the_bulgarian_airforce:0 "Перевооружить [BUL.GetAdjective] военно-воздушные силы"
 BUL_rearm_the_bulgarian_airforce_desc:0 "Наши военно-воздушные силы сильно устарели и недостаточно развиты, хотя могли бы стать важным дополнением к двум другим родам войск. Пора исправить эту серьёзную военную ошибку."
 BUL_short_range_fighter_focus:0 "Ставка на истребители малой дальности"
 BUL_short_range_fighter_focus_desc:0 "Следует сосредоточиться на простых истребителях, существующих ещё со времён Великой войны, прежде всего для защиты [BUL.GetAdjective] неба от возможных вражеских бомбардировщиков и ударов по войскам неподалёку от границ."
 BUL_long_range_fighter_focus:0 "Ставка на истребители большой дальности"
 BUL_long_range_fighter_focus_desc:0 "Применение истребителей большой дальности даёт прекрасную возможность наносить значительный материальный ущерб далёкому противнику при сопровождении бомбардировщиков либо защищать как наше небо, так и небо союзников."
 BUL_low_altitude_flights:0 "Полёты на малой высоте"
 BUL_low_altitude_flights_desc:0 "Завоёванное истребителями превосходство в воздухе можно использовать для поддержки наземных войск. В конце концов, если мы умеем сбивать самолёты, то сможем обстреливать и солдат."
 BUL_compromised_approach:0 "Компромиссный подход"
 BUL_compromised_approach_desc:0 "Сбалансированное сочетание поддержки войск и уничтожения вражеских сооружений позволит проводить более согласованные и эффективные наступления."
 BUL_offensive_bombing_strategy:0 "Стратегия наступательных бомбардировок"
 BUL_offensive_bombing_strategy_desc:0 "Непосредственное уничтожение гражданских и военных объектов является выгодной стратегией в войне на истощение, как показала Великая война."
 BUL_CAS_effort:0 "Ставка на штурмовую авиацию"
 BUL_CAS_effort_desc:0 "Разработка самолётов, специально предназначенных для атак наземных войск, окажется эффективнее использования истребителей в этой роли."
 BUL_bomber_focus:0 "Ставка на бомбардировщики"
 BUL_bomber_focus_desc:0 "Разрушительная мощь может лишь возрастать, в том числе и с воздуха. Разработка новых бомбардировщиков усилит ударные возможности наших ВВС."
 BUL_experimental_paradoppings:0 "Экспериментальные воздушные десанты"
 BUL_experimental_paradoppings_desc:0 "Если мы контролируем небо, высадка войск с парашютами в тылу противника или в труднодоступных районах вполне осуществима."
 BUL_aviation_effort_2:0 "Расширение авиабаз"
 BUL_aviation_effort_2_desc:0 "Для размещения новых произведённых самолётов потребуются дополнительные авиабазы."
 BUL_rocket_effort:0 "Эксперименты с ракетами"
 BUL_rocket_effort_desc:0 "Ракеты обещают стать ещё более разрушительной технологией, чем обычные бомбардировщики. Они заслуживают нашего полного внимания."
 BUL_form_mechanics:0 "Сформировать отряды механиков"
 BUL_form_mechanics_desc:0 "Будут подготовлены новые команды механиков для сопровождения наших лётчиков."
 BUL_crush_the_military_union:0 "Провести чистку Военного союза"
 BUL_crush_the_military_union_desc:0 "Поражения правительства «Звено» недостаточно, поскольку в армии всё ещё остаются его сторонники. Необходимо провести чистку, чтобы власть Бориса III больше не подвергалась сомнению."
 BUL_renew_kyoseivanovs_term:0 "Продлить срок Кьосеиванова"
 BUL_renew_kyoseivanovs_term_desc:0 "Георги Кьосеиванов — не более чем марионетка на службе Бориса III. Однако его легитимность необходимо сохранить хотя бы в глазах общества. Продление срока на посту премьер-министра ещё больше укрепит её."
 BUL_approach_italy:0 "Сблизиться с [ITA.GetNameDef]"
 BUL_approach_italy_desc:0 "[ITA.GetNameDefCap] и [BUL.GetNameDef] имеют общие амбиции и интересы в отношении других балканских стран. Мы надеемся, что сближение с режимом [ITA.GetLeader] позволит получить его согласие на возможное расширение [BUL.GetAdjective] территорий."
 BUL_consolidate_the_regime:0 "Укрепить авторитарный режим"
 BUL_consolidate_the_regime_desc:0 "Новое правительство ещё свежо в памяти [BUL.GetAdjective] народа. После получения поддержки армии необходимо укрепить нашу власть и заручиться поддержкой населения."
 BUL_saedinenieto_pravi_silata:0 "Съединението прави силата"
 BUL_saedinenieto_pravi_silata_desc:0 "Власть Бориса III — всё, что необходимо [BUL.GetNameDef] для возвращения былой славы. Парламентские правительства лишь уменьшали престиж, величие и мощь [BUL.GetNameDef], и только монархия способна их восстановить."
 BUL_popovo_maneuvers:0 "Поповские манёвры"
 BUL_popovo_maneuvers_desc:0 "Мы проведём военные манёвры в городе Попово, чтобы подготовить армию к планируемым войнам за возвращение земель."
 BUL_reassert_claims:0 "Вновь заявить притязания Великой Болгарии"
 BUL_reassert_claims_desc:0 "Бухарестский и Нёйиский договоры несправедливо лишили нас болгарских земель. Пора исправить эту несправедливость, подтвердив требования на регионы, составляющие «Великую Болгарию» — страну для всех болгар."
 BUL_demand_dobrudja:0 "Потребовать присоединения Добруджи"
 BUL_demand_dobrudja_desc:0 "После Второй Балканской войны Королевство Румыния несправедливо отняло Добруджу, несмотря на болгарское большинство, ожидающее освобождения. [ROM.GetNameDefCap] вернёт нам эту территорию, либо мы заберём её силой."
 BUL_demand_southern_territories:0 "Вернуть Беломорье"
 BUL_demand_southern_territories_desc:0 "Потеря фракийских земель после Второй Балканской и Великой войн также лишила нас выхода к Средиземному морю и отделила от болгарского населения этих территорий. Пора вернуть их домой."
 BUL_demand_vardaria:0 "Потребовать присоединения Вардара"
 BUL_demand_vardaria_desc:0 "Македония является болгарским регионом и всегда им останется. Несмотря на сербизацию, проводимую [YUG.GetNameDef], её жители в душе знают, что они болгары. Пора прекратить угнетение нашего народа и вернуть Македонию в состав [BUL.GetNameDef]."
 BUL_defend_the_new_borders:0 "Защитить новые границы"
 BUL_defend_the_new_borders_desc:0 "Мы могли выиграть эти войны, но в любой момент рискуем вновь потерять земли и оказаться разлучёнными с братьями и сёстрами. Мы начнём укрепление новых границ."
 BUL_long_live_boris_the_unifier:0 "Да здравствует Борис Объединитель!"
 BUL_long_live_boris_the_unifier_desc:0 "Борис III сумел исправить ошибки своего отца и даже превзойти его, объединив весь болгарский край в одной стране. История запомнит его как правителя, вернувшего [BUL.GetNameDef] гордость."
 BUL_tsarist_terror:0 "Царский террор"
 BUL_tsarist_terror_desc:0 "Мы должны поддержать царскую власть, чтобы правительство могло принимать необходимые меры для процветания [BUL.GetNameDef]. Нельзя позволять противникам оставаться на свободе."
 BUL_royal_militarism:0 "Королевский милитаризм"
 BUL_royal_militarism_desc:0 "Милитаризация общества, сопровождаемая фанатичной преданностью монархии и царю, позволит осуществить наши планы по возвращению земель."
 BUL_allow_rigged_election:0 "Разрешить сфальсифицированные выборы"
 BUL_allow_rigged_election_desc:0 "Чтобы сохранить видимость законности премьер-министра и правительства, выборы будут разрешены, но пройдут по строгим правилам, обеспечивающим царскому режиму необходимое большинство."
 BUL_mobilize_the_nation:0 "Мобилизовать нацию"
 BUL_mobilize_the_nation_desc:0 "Каждый [BUL.GetAdjective] гражданин должен трудиться ради процветания [BUL.GetNameDef]. Кампании по мобилизации населения помогут подготовить народ и экономику к будущим конфликтам."
 BUL_patriotic_boom_among_the_populace:0 "Патриотический подъём среди населения"
 BUL_patriotic_boom_among_the_populace_desc:0 "Различные царские реформы возродили патриотизм. [BUL.GetAdjective] народ вновь желает, чтобы его страна стала уважаемой державой. Мы исполним это желание."
 BUL_fortify_the_bulgarian_skies:0 "Укрепить [BUL.GetAdjective] небо"
 BUL_fortify_the_bulgarian_skies_desc:0 "Чтобы защитить солдат и граждан от возможных вражеских бомбардировок, правительство отдаст приоритет установке зенитного вооружения."
 BUL_ready_for_war:0 "Готовы к войне"
 BUL_ready_for_war_desc:0 "Мы приняли достаточно мер, чтобы считать [BUL.GetNameDef] страной, готовой к будущим тотальным войнам."
 BUL_an_alliance_of_desperation:0 "Союз отчаяния"
 BUL_an_alliance_of_desperation_desc:0 "Подобно нам, [GER.GetNameDef] стремилась пересмотреть несправедливые договоры, навязанные после Великой войны. Учитывая совпадение интересов и её мощь, разумно искать союза."
 BUL_concessions_to_lukov:0 "Уступки Лукову"
 BUL_concessions_to_lukov_desc:0 "Военный министр Христо Луков оказался важной фигурой в подавлении «Звена» и определении политического курса [BUL.GetNameDef]. Его влияние способно принести стране лишь пользу."
 BUL_brannik_youth_organization:0 "Молодёжная организация «Бранник»"
 BUL_brannik_youth_organization_desc:0 "Создание обязательной молодёжной организации по образцу гитлерюгенда поможет укрепить патриотизм и милитаризм среди населения."
 BUL_cement_our_rule_with_an_iron_fist:0 "Начать укрепление нашей власти"
 BUL_cement_our_rule_with_an_iron_fist_desc:0 "Власть Лукова оспаривается так же, как прежде власть Бориса III. Придётся начать репрессии против политиков, признанных нелояльными, возможно, включая монархистов."
 BUL_combat_ideological_enemies_in_foreign_soil:0 "Бороться с идеологическими врагами"
 BUL_combat_ideological_enemies_in_foreign_soil_desc:0 "Мы не можем мириться с распространением варварского большевизма — идеологии, враждебной патриотизму и национализму. Как и в Испании, мы создадим экспедиционные силы для помощи странам, противостоящим этой угрозе."
 BUL_begin_militarization:0 "Ускоренная милитаризация"
 BUL_begin_militarization_desc:0 "Мы введём масштабные программы милитаризации. Население должно пожертвовать комфортом ради величия [BUL.GetName]."
 BUL_totalitarian_control:0 "Тоталитарный контроль"
 BUL_totalitarian_control_desc:0 "После «исчезновения» значительной части политических и военных соперников власти Лукова больше ничто не угрожает."
 BUL_reassert_the_extended_land_claims:0 "Вновь заявить расширенные территориальные претензии"
 BUL_reassert_the_extended_land_claims_desc:0 "Чтобы обеспечить выживание и славу [BUL.GetAdjective] народа, мы должны расширить границы, подчинив Балканы в соответствии с естественным предназначением нашей страны."
 BUL_crush_the_greeks:0 "Сокрушить [GRE.GetNameDef]"
 BUL_crush_the_greeks_desc:0 "Мы никогда не простим Греции лишение выхода к Средиземному морю. Пора вернуть его и раз и навсегда установить господство над афинским режимом."
 BUL_divide_yugoslavia:0 "Разделить [YUG.GetNameDef]"
 BUL_divide_yugoslavia_desc:0 "Вероломные сербы хотели удержать Македонию, убеждая жителей, будто они скорее сербы, чем болгары, и подавляя наследие региона. Пора вернуть эту неотъемлемую часть Болгарии."
 BUL_topple_romania:0 "Свергнуть [ROM.GetNameDef]"
 BUL_topple_romania_desc:0 "[ROM.GetNameDefCap] показала, что заботится лишь о собственном народе, захватив Добруджу, до сих пор населённую болгарами. Как они отняли её силой, так и мы силой вернём её."
 BUL_tame_albania:0 "Подчинить [ALB.GetNameDef]"
 BUL_tame_albania_desc:0 "Присоединение Албании к нашей империи обеспечит полное господство на Балканах и предотвратит возможные будущие претензии на такие регионы, как Косово."
 BUL_aggressive_assimilation:0 "Агрессивная ассимиляция"
 BUL_aggressive_assimilation_desc:0 "Во всех присоединённых регионах будут введены программы принудительной болгаризации — от образования и дорожных указателей до администрации, — чтобы превратить их в образцовые земли Великой Болгарии."
 BUL_demand_albanian_subjugation:0 "Спрос [ALB.GetAdjective] Порабощение"
 BUL_demand_albanian_subjugation_desc:0 "[ALB.GetNameDefCap] слаба и управляется марионеточным королём. Если мы вскоре не вмешаемся, она может пасть перед [ITA.GetLeader] и его пагубными мечтами о завоевании Средиземноморья. Мы предложим ей вступить в страну, населённую родственными народами. Не то чтобы она могла отказаться!"
 BUL_politicize_the_trade_union:0 "Политизировать свободные профсоюзы"
 BUL_politicized_trade_union_desc:0 "Теперь, когда установлен демократический режим, следующим шагом должно стать сближение с народом. Правительство, ненавистное населению, не является настоящим правительством. Однако есть способ укрепить доверие людей к стране. Свободные профсоюзы — влиятельное [BUL.GetAdjective] объединение, членами которого являются многие простые рабочие. Если мы начнём политизировать этот прежде в основном аполитичный союз, то получим дополнительную поддержку и укрепим управление [BUL.GetNameDef]."
 BUL_intergrate_womens_rights_organizations:0 "Интегрировать организации за права женщин"
 BUL_intergrate_womens_rights_organizations_desc:0 "Ранее женщины были лишены многих прав, которыми обладали их современницы в других европейских странах. Теперь, когда значительная часть отсталого режима устранена, мы можем привлечь влиятельных активисток, таких как сёстры Благолевы."
 BUL_request_macedonian_autonomy:0 "Потребовать автономии Македонии"
 BUL_request_macedonian_autonomy_desc:0 "Македонский вопрос оказался чрезвычайно трудным. Разделение македонцев между двумя странами породило крупные вооружённые движения и борьбу за независимость. Предоставление или хотя бы поддержка независимости Македонии упростит управление страной, снизит экономические потери и постепенно ослабит проблему македонского меньшинства."
 BUL_promote_republicanism:0 "Упразднить царство"
 BUL_promote_republicanism_desc:0 ""
 BUL_strength_of_the_tsar:0 "Сила царя"
 BUL_strength_of_the_tsar_desc:0 ""
 BUL_democrat_party:0 "ДП"
 BUL_democrat_party_long:0 "Демократическая партия"
 BUL_agrarian_party:0 "БЗНС"
 BUL_agrarian_party_long:0 "Болгарский земледельческий народный союз"
 BUL_socdem_party:0 "БРСДП"
 BUL_socdem_party_long:0 "Болгарская рабочая социал-демократическая партия"
 BUL_motorized_equipment_1:0 "Fiat 626"
 BUL_motorized_equipment_1_short:0 "Fiat 626"
 BUL_motorized_equipment_1_desc:0 "Fiat 626 — средний грузовик, использовавшийся болгарской армией для военных перевозок."
 BUL_light_tank_equipment_1:0 "Carro Veloce L3/33"
 BUL_light_tank_equipment_1_short:0 "CV33"
 BUL_light_tank_equipment_1_desc:0 "Итальянская танкетка CV33 была разработана в Италии. Перед Второй мировой войной несколько таких машин импортировали в Болгарию."
 BUL_light_tank_equipment_2:0 "Танк T-11"
 BUL_light_tank_equipment_2_short:0 "T-11"
 BUL_light_tank_equipment_2_desc:0 "T-11 — танк, приобретённый Болгарией перед Второй мировой войной. Он представлял собой модифицированный в стране Škoda CKD Lt vz.35 с более мощным вооружением, повышенной скоростью и лучшей управляемостью."
 BUL_light_tank_equipment_3:0 "Танк T-12"
 BUL_light_tank_equipment_3_short:0 "T-12"
 BUL_light_tank_equipment_3_desc:0 "T-12 был модифицированным болгарами танком на основе чехословацкого LT vz. 38. Позднее Германия передала эти машины Болгарии."
 BUL_medium_tank_equipment_1:0 "Panzerkampfwagen III"
 BUL_medium_tank_equipment_1_short:0 "T3G"
 BUL_medium_tank_equipment_1_desc:0 "Ram Mark I — танк, производившийся Болгарией для службы в болгарской армии. Он являлся боеспособной машиной с пушкой-фунтовкой."
 BUL_medium_tank_equipment_2:0 "Maybach T4G Ausf. F2/G"
 BUL_medium_tank_equipment_2_short:0 "T4G"
 BUL_medium_tank_equipment_2_desc:0 "Panzer IV Maybach T4G был болгарским вариантом Panzer IV. Maybach оснащался другим орудием, но в остальном оставался без изменений."
 BUL_medium_tank_equipment_3:0 "Panzerkampfwagen IV Ausf. H"
 BUL_medium_tank_equipment_3_short:0 "T-4"
 BUL_medium_tank_equipment_3_desc:0 "T-4 был болгарским вариантом Panzer IV. В стандартной комплектации он имел бортовые экраны, но в остальном не отличался от исходной машины."
 BUL_CAS_equipment_1:0 "ДАР-3 «Гарван I»"
 BUL_CAS_equipment_1_short:0 " ДАР-3"
 BUL_cv_CAS_equipment_1:0 "Палубный вариант ДАР-3"
 BUL_cv_CAS_equipment_1_short:0 " ДАР-3 П"
 BUL_CAS_equipment_2:0 "ДАР-10"
 BUL_CAS_equipment_2_short:0 "ДАР-10"
 BUL_CAS_equipment_2_desc:0 "ДАР-10"
 BUL_cv_CAS_equipment_2:0 "Палубный вариант ДАР-10"
 BUL_cv_CAS_equipment_2_short:0 "ДАР-10 П"
 BUL_CAS_equipment_3:0 "ДАР-10Ф"
 BUL_CAS_equipment_3_short:0 "ДАР-10Ф"
 BUL_CAS_equipment_3_desc:0 "ДАР-10Ф"
 BUL_cv_CAS_equipment_3:0 "Палубный вариант ДАР-10Ф"
 BUL_cv_CAS_equipment_3_short:0 "ДАР-10Ф П"
 BUL_fighter_equipment_2:0 "ДАР-11"
 BUL_fighter_equipment_2_short:0 "ДАР-11"
 BUL_fighter_equipment_2_desc:0 "Болгарские военные заинтересовались чешским самолётом Avia B-135 и договорились о его лицензионном производстве в Болгарии под обозначением ДАР-11. К сожалению, болгарский производитель не смог наладить выпуск, а построенные в Чехии прототипы в итоге использовались как учебные самолёты. Вместо них болгарская армия приобрела Bf 109."
 BUL_fighter_equipment_3:0 "ЛАЗ-12"
 BUL_fighter_equipment_3_short:0 "ЛАЗ-12"
 BUL_fighter_equipment_0:0 "ДАР-1"
 BUL_fighter_equipment_0_short:0 "ДАР-1"
 BUL_jet_fighter_equipment_1:0 "ЛАЗ-14"
 BUL_jet_fighter_equipment_1_short:0 "ЛАЗ-14"
 BUL_mobilized_proletariat:0 "Мобилизованный пролетариат"
 axis_minors_bulgaria.1.t:0 "[BUL.GetNameDefCap] объявляет о поддержке коммунизма с балканской спецификой"
 axis_minors_bulgaria.1.d:0 "После успеха пролетарских революций в обеих странах мы установили прекрасные отношения с [BUL.GetNameDef]. Оказалось, что они поддерживают наш выбор искать собственный путь вне влияния Москвы и желают заключить союз, объединяющий наши страны."
 axis_minors_bulgaria.1.a:0 "Это ускорит наши долгосрочные проекты."
 axis_minors_bulgaria.1.b:0 "Нам не нужна их помощь."
 axis_minors_bulgaria.27.t:0 "Выборы"
 axis_minors_bulgaria.27.d:0 "Недавно царь предоставил населению избирательные права и объявил выборы, чтобы определить будущее страны. После подсчёта голосов стало ясно, что радикальные экстремистские партии проиграли, и борьба свелась к нескольким умеренным силам. Кто победил?"
 axis_minors_bulgaria.27.a:0 "Побеждает ДП."
 axis_minors_bulgaria.27.b:0 "Побеждает БЗНС."
 axis_minors_bulgaria.27.c:0 "Побеждает БРСДП."
 axis_minors_bulgaria.28.t:0 "Отстранение Кьосеиванова"
 axis_minors_bulgaria.28.d:0 "Премьер-министр Георги Кьосеиванов злоупотреблял властью, и его нарушение Тырновской конституции не должно остаться безнаказанным. За действия против Родины он заслуживает отстранения от должности."
 axis_minors_bulgaria.28.a:0 "Уберите отсюда этого коррумпированного фашиста!"
 axis_minors_bulgaria.29.t:0 "Коммунистическая революция"
 axis_minors_bulgaria.29.d:0 "Наше движение постепенно росло, и теперь нас поддерживает значительная часть населения. Лучшего момента для начала революции и свержения коррумпированных фашистов не будет!"
 axis_minors_bulgaria.29.a:0 "Начинается новая эпоха!"
 axis_minors_bulgaria.30.t:0 "Вопрос [BUL.GetAdjective] перевооружения"
 axis_minors_bulgaria.30.d:0 "[BUL.GetAdjective] премьер-министр направил нам просьбу снять ограничения, наложенные на [BUL.GetAdjective] армию после подписания Нёйиского договора. Как нам ответить?"
 axis_minors_bulgaria.30.a:0 "Пригласить их в Салоники — они усвоили урок."
 axis_minors_bulgaria.30.b:0 "Это лишь приведёт ко второму великому конфликту."
 axis_minors_bulgaria.31.t:0 "Ответ на Салоникское соглашение"
 axis_minors_bulgaria.31.d:0 "[BUL.GetAdjective] и [GRE.GetAdjective] делегаты прибыли в Салоники для обсуждения перевооружения. В итоге они решили позволить [BUL.GetNameDef] перевооружиться перед надвигающимся конфликтом. Как нам реагировать?"
 axis_minors_bulgaria.31.a:0 "Мы можем с этим согласиться."
 axis_minors_bulgaria.31.b:0 "Направить дипломатический протест."
 axis_minors_bulgaria.32.t:0 "Салоникское соглашение"
 axis_minors_bulgaria.32.d:0 "Сегодня [BUL.GetAdjective] и [GRE.GetAdjective] делегаты собрались в Салониках и подписали соглашение, разрешающее нам перевооружиться. Теперь мы действительно можем готовиться к грядущей войне."
 axis_minors_bulgaria.32.a:0 "В такие времена каждый должен иметь право перевооружаться."
 axis_minors_bulgaria.33.t:0 "Вопрос Южной Добруджи"
 axis_minors_bulgaria.33.d:0 "[BUL.GetNameDefCap] направила нам телеграмму с предложением вступить в Балканский торговый пакт, но только при условии возвращения ей Южной Добруджи."
 axis_minors_bulgaria.33.a:0 "Справедливый обмен."
 axis_minors_bulgaria.33.b:0 "Мы не можем отказаться от своей земли."
 axis_minors_bulgaria.34.t:0 "Успешные переговоры по Добрудже"
 axis_minors_bulgaria.34.d:0 "[ROM.GetNameDef] согласилась на наши условия и уступила нам Южную Добруджу. Это принесёт огромную пользу."
 axis_minors_bulgaria.34.a:0 "Великий день."
 axis_minors_bulgaria.35.t:0 "Провал переговоров по Добрудже"
 axis_minors_bulgaria.35.d:0 "[ROM.GetAdjective] дипломаты отказались уступить нам Добруджу. Однако мы не можем ответить на это агрессией."
 axis_minors_bulgaria.35.a:0 "В конце концов, это лишь клочок земли."
 axis_minors_bulgaria.36.t:0 "Пакт о ненападении с [BUL.GetNameDef]"
 axis_minors_bulgaria.36.d:0 "[BUL.GetNameDefCap] предлагает заключить пакт о ненападении. Он улучшит отношения между странами и предотвратит войну."
 axis_minors_bulgaria.36.a:0 "Почему бы и нет?"
 axis_minors_bulgaria.36.b:0 "Мы не заключаем соглашений с капиталистами."
 axis_minors_bulgaria.37.t:0 "[SOV.GetAdjective] договор о ненападении"
 axis_minors_bulgaria.37.d:0 "[SOV.GetNameDefCap] подписала соглашение о ненападении между нашими странами. Это предотвратит сравнительно крупный конфликт."
 axis_minors_bulgaria.37.a:0 "Только что были спасены жизни многих молодых людей."
 axis_minors_bulgaria.38.t:0 "[SOV.GetAdjective] отказ"
 axis_minors_bulgaria.38.d:0 "[SOV.GetAdjective] сторона ответила на наше предложение отказом. Возможно, она готовится к будущему конфликту, хотя никто не может быть уверен."
 axis_minors_bulgaria.38.a:0 "Молитесь за молодых людей [BUL.GetNameDef]."
 axis_minors_bulgaria.39.t:0 "Улучшенная военная промышленность"
 axis_minors_bulgaria.39.d:0 "Наша тяжёлая промышленность достигла нового уровня. Однако её всё ещё можно развивать дальше."
 axis_minors_bulgaria.39.a:0 "Немедленно наращивать производство!"
 axis_minors_bulgaria.41.t:0 "Подготовка почвы"
 axis_minors_bulgaria.41.d:0 "Действия Военного союза оказывают чрезмерное давление на правительство, которое его члены якобы представляют. Чтобы [BUL.GetNameDef] выжила как страна, необходимо избавиться от мятежных элементов, скрывающихся в тени, и положить конец их попыткам свергнуть правительство или сорвать его политику."
 axis_minors_bulgaria.41.a:0 "Начать операцию."
 axis_minors_bulgaria.42.t:0 "Положение Военного союза"
 axis_minors_bulgaria.42.d:0 "Хотя сначала нам удалось схватить лишь самых дерзких членов Военного союза, мы медленно, но верно арестовываем всё больше участников. Низовых оперативников допрашивают, обещая послабления в обмен на сотрудничество. Разумеется, правительство не видит причин предоставлять этим предателям что-либо даже при их содействии."
 axis_minors_bulgaria.42.a:0 "Удвоить усилия в поисках этих предательских псов!"
 axis_minors_bulgaria.43.t:0 "Последняя облава"
 axis_minors_bulgaria.43.d:0 "Совместные усилия армии и полиции оказались весьма эффективными в поимке оставшихся в стране предателей. Теперь, когда все виновные задержаны, можно переходить к суду."
 axis_minors_bulgaria.43.a:0 "Суд — лишь формальность; к рассвету их повесят."
 axis_minors_bulgaria.44.t:0 "Ультиматум по Добрудже"
 axis_minors_bulgaria.44.d:0 "[BUL.GetAdjective] сторона через дипломатического посланника направила ультиматум относительно контролируемой нами Добруджи. В последние недели это сопровождалось всё более враждебной риторикой и военными учениями, призванными нас запугать. Как ответить на это дерзкое письмо?"
 axis_minors_bulgaria.44.a:0 "Мы примем их требования, лишь бы избежать новой войны."
 axis_minors_bulgaria.44.b:0 "Мы не боимся [BUL.GetAdjective] стороны. Отклонить этот абсурдный ультиматум."
 axis_minors_bulgaria.45.t:0 "[ROM.GetAdjective] отказ"
 axis_minors_bulgaria.45.d:0 "Дипломатический посланник прибыл с официальным ответом [ROM.GetNameDef]. Они отвергли наш ультиматум, и теперь их придётся проучить."
 axis_minors_bulgaria.45.a:0 "Мобилизовать войска и созвать Генеральный штаб."
 axis_minors_bulgaria.46.t:0 "[ROM.GetAdjective] согласие"
 axis_minors_bulgaria.46.d:0 "Дипломатический посланник прибыл с официальным ответом [ROM.GetNameDef]. Отныне остальная Добруджа станет частью [BUL.GetNameDef]."
 axis_minors_bulgaria.46.a:0 "Всё так, как и должно быть!"
 axis_minors_bulgaria.47.t:0 "Вопрос Фракии и Македонии"
 axis_minors_bulgaria.47.d:0 "Фракия и Македония издавна являются домом для множества болгар. [BUL.GetNameDefCap] давно настаивает на этом и теперь через дипломатических посланников недвусмысленно требует передачи Фракии и Македонии от [GRE.GetNameDef] к [BUL.GetNameDef]. Как мы ответим?"
 axis_minors_bulgaria.47.a:0 "Мы согласны."
 axis_minors_bulgaria.47.b:0 "Мы не отдадим Македонию, но в качестве компромисса предложим [BUL.GetAdjective] стороне Фракию."
 axis_minors_bulgaria.47.c:0 "Абсурд! Весь этот вопрос лишён смысла!"
 axis_minors_bulgaria.48.t:0 "[GRE.GetAdjective] отказ"
 axis_minors_bulgaria.48.d:0 "[GRE.GetNameDefCap] категорически отвергла наши условия по передаче Фракии и Македонии."
 axis_minors_bulgaria.48.a:0 "Это возмутительно! Созвать Генеральный штаб и готовиться к войне!"
 axis_minors_bulgaria.49.t:0 "[GRE.GetNameDefCap] соглашается"
 axis_minors_bulgaria.49.d:0 "Хотя очевидно, что [GRE.GetNameDef] не согласна с нашими требованиями относительно Фракии и Македонии, она всё же приняла условия документа."
 axis_minors_bulgaria.49.a:0 "Наш народ вновь воссоединён!"
 axis_minors_bulgaria.50.t:0 "[GRE.GetAdjective] встречное предложение"
 axis_minors_bulgaria.50.d:0 "Они отказываются признать наши законные права на Македонию, но выдвинули встречное предложение: передать Фракию в нашу сферу влияния. Это не всё, чего мы хотели, но всё же может принести стране пользу."
 axis_minors_bulgaria.50.a:0 "Мы примем передачу Фракии, но этот вопрос ещё не закрыт."
 axis_minors_bulgaria.51.t:0 "Вардарский ультиматум"
 axis_minors_bulgaria.51.d:0 "По мере усиления [BUL.GetNameDef] продолжает стремиться восстановить прежние границы. [BUL.GetNameDefCap] направила документ с требованием вернуть Вардар его «законному» владельцу, которым, по её мнению, является [BUL.GetNameDef].\nЧто ответить на столь дерзкое требование?"
 axis_minors_bulgaria.51.a:0 "Позволить [BUL.GetAdjective] стороне контролировать регион ради сохранения мира."
 axis_minors_bulgaria.51.b:0 "Немедленно отвергнуть эту чепуху."
 axis_minors_bulgaria.52.t:0 "[YUG.GetAdjective] отказ"
 axis_minors_bulgaria.52.d:0 "[YUG.GetAdjective] ответ оказался столь же быстрым, сколь и кратким. Страна отказывается признавать наши законные права на Вардар и отвергает передачу контроля над ним."
 axis_minors_bulgaria.52.a:0 "Это возмутительно! Созвать Генеральный штаб и готовиться к войне!"
 axis_minors_bulgaria.53.t:0 "[YUG.GetNameDef] соглашается"
 axis_minors_bulgaria.53.d:0 "То ли [YUG.GetNameDef] не видит смысла проливать кровь за Вардар, то ли признаёт мощь нашей армии, но наши требования были приняты. Вардар наш!"
 axis_minors_bulgaria.53.a:0 "Мы вновь приветствуем болгар Вардара в нашей стране!"
 axis_minors_bulgaria.54.t:0 "Марш на Софию"
 axis_minors_bulgaria.54.d:0 "Мы заручились достаточной поддержкой, чтобы потребовать передачи власти от царя нашему новому лидеру Христо Лукову, повторив путь Бенито Муссолини к власти. С этого момента для [BUL.GetNameDef] наступает новая эпоха."
 axis_minors_bulgaria.54.a:0 "Теперь нужно удержать власть над [BUL.GetNameDef]."
 axis_minors_bulgaria.55.t:0 "Новый наследник"
 axis_minors_bulgaria.55.d:0 "В [BUL.GetNameDef] родился мальчик. Сын царя Бориса и Джованны Савойской, однажды он поведёт [BUL.GetNameDef] к величию как царь, подобно своему отцу."
 axis_minors_bulgaria.55.a:0 "Да благословят его небеса."
 axis_minors_bulgaria.56.t:0 "Смерть царя Бориса III"
 axis_minors_bulgaria.56.d:0 "Неизвестные силы убили царя Бориса III. Его нашли лежащим на полу дворца, предположительно отравленным. Полиция не обнаружила никаких следов убийцы. Однако распространяются слухи, что за этим стоят [GER.GetAdjective] агенты. Тем временем создано новое регентство, которое будет править [BUL.GetNameDef], пока юный Симеон не достигнет совершеннолетия. Кто должен его возглавить?"
 axis_minors_bulgaria.56.a:0 "Кирилл, брат покойного царя."
 axis_minors_bulgaria.56.b:0 "Богдан Филов, премьер-министр."
 axis_minors_bulgaria.57.t:0 "Первый коммунистический государственный конгресс"
 axis_minors_bulgaria.57.d:0 "Совсем недавно мы пришли к власти в Болгарии. Революцию возглавил товарищ Георгий Димитров, чьи идеи коммунизма весьма экспериментальны. Естественно, многие члены партии считают, что ему следует уступить пост другому секретарю — например, Христиану Раковскому или Вылко Червенкову, который уверен, что лучшая форма коммунизма — сталинизм. Возможно, он прав?"
 axis_minors_bulgaria.57.a:0 "Димитров должен остаться."
 axis_minors_bulgaria.57.b:0 "Эксперименты могут привести целую страну к гибели."
 axis_minors_bulgaria.57.c:0 "Раковский сыграет важную роль в мировой революции."
 axis_minors_bulgaria.58.t:0 "[BUL.GetAdjective] требования"
 axis_minors_bulgaria.58.d:0 "[BUL.GetNameDefCap] угрожает вторжением, если мы не согласимся на её требования, включая установление коммунистического правительства и принудительное вступление в союз. Как ответить?"
 axis_minors_bulgaria.58.a:0 "Чтобы защитить народ, придётся уступить."
 axis_minors_bulgaria.58.b:0 "Отвергнуть эти возмутительные требования."
 axis_minors_bulgaria.59.t:0 "[ALB.GetNameDefCap] соглашается"
 axis_minors_bulgaria.59.desc:0 "[BUL.GetNameDefCap] недавно вернула себе македонскую территорию Вардара и теперь граничит с нами. К нашему ужасу, она угрожает вторжением, если мы не согласимся на её требования, среди которых установление коммунистического правительства и принудительное вступление в союз. Как ответить?"
 axis_minors_bulgaria.59.a:0 "Чтобы защитить народ, придётся уступить."
 axis_minors_bulgaria.60.t:0 "[ALB.GetNameDefCap] отказывается"
 axis_minors_bulgaria.60.desc:0 "[ALB.GetNameDefCap] бросила вызов нашей мощи и отвергла требования. Разве они не понимают, что не способны победить нас ни при каких обстоятельствах?"
 axis_minors_bulgaria.60.a:0 "Пф. Их земли нам всё равно не нужны."
 axis_minors_bulgaria.60.b:0 "Значит, будет война."
 axis_minors_bulgaria.61.t:0 "[BUL.GetNameDefCap] предлагает торговый пакт"
 axis_minors_bulgaria.61.d:0 "[BUL.GetAdjective] представители сообщили о намерении создать Балканский торговый союз. Как нам ответить?"
 axis_minors_bulgaria.61.a:0 "Почему бы и нет?"
 axis_minors_bulgaria.61.b:0 "Это нам не поможет."
 axis_minors_bulgaria.62.t:0 "[TUR.GetNameDefCap] подписывает пакт"
 axis_minors_bulgaria.62.d:0 "[TUR.GetNameDefCap] приняла наше торговое предложение и официально вступила в пакт."
 axis_minors_bulgaria.62.a:0 "Отлично!"
 axis_minors_bulgaria.63.t:0 "[TUR.GetNameDefCap] отказывается подписать пакт"
 axis_minors_bulgaria.63.d:0 "[TUR.GetNameDefCap] решила не подписывать наше щедрое торговое предложение."
 axis_minors_bulgaria.63.a:0 "Это какая-то старая обида?"
 axis_minors_bulgaria.64.t:0 "[BUL.GetNameDefCap] предлагает торговый пакт"
 axis_minors_bulgaria.64.d:0 "[BUL.GetAdjective] представители сообщили о намерении создать Балканский торговый союз. Стоит ли его подписывать?"
 axis_minors_bulgaria.64.a:0 "Почему бы и нет?"
 axis_minors_bulgaria.64.b:0 "Это нам не поможет."
 axis_minors_bulgaria.65.t:0 "[GRE.GetNameDefCap] подписывает пакт"
 axis_minors_bulgaria.65.d:0 "[GRE.GetNameDefCap] приняла наше торговое предложение и официально вступила в пакт."
 axis_minors_bulgaria.65.a:0 "Отлично!"
 axis_minors_bulgaria.66.t:0 "[GRE.GetNameDefCap] отказывается подписать пакт"
 axis_minors_bulgaria.66.d:0 "[GRE.GetNameDefCap] решила не подписывать наше щедрое торговое предложение."
 axis_minors_bulgaria.66.a:0 "Это какая-то старая обида?"
 axis_minors_bulgaria.67.t:0 "[BUL.GetNameDefCap] предлагает торговый пакт"
 axis_minors_bulgaria.67.d:0 "[BUL.GetAdjective] представители сообщили о намерении создать Балканский торговый союз. Стоит ли его подписывать?"
 axis_minors_bulgaria.67.a:0 "Почему бы и нет?"
 axis_minors_bulgaria.67.b:0 "Это нам не поможет."
 axis_minors_bulgaria.68.t:0 "[YUG.GetNameDefCap] подписывает пакт"
 axis_minors_bulgaria.68.d:0 "[YUG.GetNameDefCap] приняла наше торговое предложение и официально вступила в пакт."
 axis_minors_bulgaria.68.a:0 "Отлично!"
 axis_minors_bulgaria.69.t:0 "[YUG.GetNameDefCap] отказывается подписать пакт"
 axis_minors_bulgaria.69.d:0 "[YUG.GetNameDefCap] решила не подписывать наше щедрое торговое предложение."
 axis_minors_bulgaria.69.a:0 "Это какая-то старая обида?"
 axis_minors_bulgaria.70.t:0 "Македонская автономия"
 axis_minors_bulgaria.70.d:0 "[BUL.GetNameDefCap] попросила предоставить македонцам некоторую автономию, чтобы они могли развиваться и устанавливать отношения с [BUL.GetAdjective] стороной."
 axis_minors_bulgaria.70.a:0 "Автономия поможет решить и наши внутренние проблемы."
 axis_minors_bulgaria.70.b:0 "Не им решать, что нам делать со своими регионами."
 axis_minors_bulgaria.71.t:0 "Македонская автономия"
 axis_minors_bulgaria.71.d:0 "[YUG.GetNameDefCap] приняла нашу просьбу и предоставила македонцам некоторую автономию. Теперь мы можем начать дипломатические отношения с ними."
 axis_minors_bulgaria.71.a:0 "Отлично."
 axis_minors_bulgaria.72.t:0 "Македонская автономия"
 axis_minors_bulgaria.72.d:0 "[YUG.GetNameDefCap] отклонила нашу просьбу и решила сохранить полную интеграцию македонцев без особой автономии."
 axis_minors_bulgaria.72.a:0 "Неужели у них совсем нет сочувствия?"
 BUL_georgii_isserson:0 "Георгий Иссерсон"
