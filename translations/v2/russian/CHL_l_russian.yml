 r56_CHL_nationist_coup_2:0 "Надвигающееся фашистское восстание"
 r56_CHL_nationist_coup_2_desc:0 "Наши источники сообщают, что нацистас планируют восстание с целью свержения действующего правительства. Хотя их поддержка в стране кажется ограниченной, необходимо отнестись к угрозе серьёзно и начать подавлять инакомыслие, прежде чем они успеют заручиться достаточной поддержкой для крупного мятежа."
