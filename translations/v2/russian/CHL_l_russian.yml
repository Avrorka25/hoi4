 r56_CHL_concessions_1_desc:0 "Уступки крайне правым могут дать нам больше времени для борьбы с угрозой нацистас."
 r56_CHL_arrest_Jorge:0 "Попытаться арестовать Хорхе Гонсалеса фон Мареэса"
 chile.39.t:0 "Восстание нацистас в столице"
 chile.39.d:0 "После последних политических событий в стране нацистас стали ещё сильнее негодовать против действующего правительства. Сегодня утром это недовольство вылилось в попытку переворота: небольшая группа воинствующих фашистов во главе с Хорхе Гонсалесом фон Мареэсом попыталась свергнуть правительство.\n\nК счастью, их движение не набрало силу, и число мятежников считается очень небольшим. Сейчас они удерживают несколько правительственных зданий в Сантьяго.\n\nХотя им удалось разгромить местную полицию, полноценный ответ армии должен быстро их подавить."
 chile.39.a:0 "Мы раздавим этот жалкий фарс."
 chile.40.t:0 "Массовое восстание нацистас"
 chile.40.d:0 "После последних политических событий в стране нацистас стали ещё сильнее негодовать и проявлять агрессию против действующего правительства. Сегодня утром это вылилось в попытку переворота: большая группа воинствующих фашистов во главе с Хорхе Гонсалесом фон Мареэсом попыталась свергнуть правительство.\n\nНам удалось обезопасить военные части на севере, и мы готовим ответ. Похоже, мы серьёзно недооценили силу их движения: к ним присоединились многие бывшие военные и часть нынешних младших офицеров. Они захватили столицу Сантьяго и прилегающие районы, разгромили полицию и местные гарнизоны, завладев военным снаряжением. Необходимо мобилизовать армию и антифашистские силы для подавления восстания.\n\nК сожалению, за последние сутки столкновения переросли в полномасштабную гражданскую войну."
 chile.40.a:0 "Мы преодолеем это силой."
 chile.41.t:0 "Смерть Педро Агирре Серды"
 chile.41.d:0 "Лидер Демократической партии Педро Агирре Серда умер во сне в Центральной больнице Сантьяго. После его смерти, когда многие почтили его память, демократические силы избирают нового лидера."
 chile.41.a:0 "Хуан Антонио Риос вступит в должность."
 CHL_preemptive_strike_tt:0 "§CЭтот фокус даст цели войны против некоторых соседних стран, если они являются фашистскими или коммунистическими.§!"
 CHL_growing_communist_faction_t:0 "Агрессивное распространение коммунизма"
 CHL_ideological_propaganda:0 "Идеологическая пропаганда"
 CHL_ideological_propaganda_desc:0 "Каждое коммунистическое движение — потенциальная ячейка, готовая организовать массы."
 R56_chile_fascist_scw_given_tag:0 "§WЯвляется восстанием нацистас.§!"
 CHL_the_spread_of_fascism_t:0 "Усилено движение нацистас"
 chile.43.t:0 "Инцидент в Сегуро Обреро"
 chile.43.d:0 "Опасаясь действий против своего движения, сегодня около 12:30 Хорхе Гонсалес при поддержке [GER.GetAdjective] сил попытался совершить переворот с участием чилийских национал-социалистов. Переворот провалился после перестрелки с [CHL.GetAdjective] полицией. Мятежники ненадолго захватили два здания, но полиция заставила одну группу отступить, а остальные вместе с прежними повстанцами сдались. После капитуляции около 60 национал-социалистов были расстреляны, несмотря на обещание правительства сохранить им жизнь. Лишь четырём удалось спастись. Ходят слухи, что приказ о расправе отдал [CHL.GetLeader]."
 chile.43.a:0 "«Тревожный» поворот событий."
 CHL_invite_red_uruguay:0 "Пригласить Уругвай"
 CHL_invite_red_uruguay_desc:0 "Коммунистическое правительство [URG.getnameDef] — наш брат и должно присоединиться к борьбе за рабочую революцию по всей Южной Америке."
 CHL_invite_red_paraguay:0 "Пригласить Парагвай"
 CHL_invite_red_paraguay_desc:0 "Коммунистическое правительство [PAR.getnameDef] — наш брат и должно присоединиться к борьбе за рабочую революцию по всей Южной Америке."
 CHL_invite_red_bolivia:0 "Пригласить Боливию"
 CHL_invite_red_bolivia_desc:0 "Коммунистическое правительство [BOL.getnameDef] — наш брат и должно присоединиться к борьбе за рабочую революцию по всей Южной Америке."
 chile_communist_faction:0 "Союз коммунистических государств Латинской Америки"
 CHL_fascism_partyv2:0 "VPS"
 CHL_fascism_partyv2_long:0 "Народный социалистический авангард"
 CHL_isi:0 "Импортозамещающая индустриализация"
 CHL_isi_desc:0 "Политика импортозамещающей индустриализации направлена на достижение промышленной самодостаточности."
 CHL_corfo:0 "CORFO"
 CHL_corfo_desc:0 "Национализированная строительная компания облегчает реализацию наших проектов."
 CHL_dissident_activity:0 "Деятельность диссидентов"
 CHL_dissident_activity_desc:0 "[CHL.GetNameDef] страдает от всевозможных диссидентов. Между коммунистами и национал-социалистами нет покоя."
 CHL_command_economy:0 "Командная экономика"
 CHL_command_economy_desc:0 "Национализировав всю промышленность [CHL.GetNameDef], мы можем сами определять, что производить, вместо капиталистов."
 CHL_communist_influence:0 "[CHL.GetAdjective] влияние"
 CHL_communist_influence_desc:0 "[CHL.GetNameDef] распространяет коммунизм в этой стране."
 CHL_revolution:0 "Коммунистическая революция"
 CHL_revolution_desc:0 "В этой стране горит пламя революции."
 CHL_communist_militia_idea:0 "Коммунистическое ополчение"
 CHL_communist_militia_idea_desc:0 "Интеграция коммунистического ополчения в вооружённые силы укрепила их."
 CHL_communist_ban:0 "Коммунизм запрещён"
 CHL_communist_ban_desc:0 "После запрета коммунизма подобным движениям стало труднее действовать в стране."
 CHL_fascist_ban:0 "Фашизм запрещён"
 CHL_fascist_ban_desc:0 "После запрета фашизма его радикальные движения почти полностью подавлены."
 CHL_republican_guard_idea:0 "Республиканская гвардия"
 CHL_republican_guard_idea_desc:0 "Восстановление Республиканской гвардии как военизированной организации, преданной стране, дало нам дополнительные силы."
 CHL_expanded_private_sector:0 "Расширенный частный сектор"
 CHL_expanded_private_sector_desc:0 "Расширение частного сектора повысило конкуренцию и эффективность экономики."
 CHL_preemptive_idea:0 "Подготовка к войне"
 CHL_preemptive_idea_desc:0 "В преддверии войны были приняты меры по защите границ страны."
 CHL_crackdown_idea:0 "Политические репрессии"
 CHL_crackdown_idea_desc:0 "Правительство безжалостно подавляет радикальные движения внутри страны."
 CHL_spread_of_fascist:0 "Усиление нацистас"
 CHL_spread_of_fascist_desc:0 "Движение нацистас распространяется по стране, хотя многие по-прежнему с ним не согласны."
 CHL_patriotic_leagues_idea:0 "Патриотические лиги"
 CHL_patriotic_leagues_idea_desc:0 "Восстановление Патриотических лиг как военизированной организации увеличило численность армии."
 CHL_spread_the_revolution_idea:0 "Распространение революции"
 CHL_spread_the_revolution_idea_desc:0 "Мы должны распространить революцию по всему миру и поддерживать революционеров за рубежом!"
 CHL_home_of_latin_revolution:0 "Родина латиноамериканской революции"
 CHL_home_of_latin_revolution_desc:0 "[CHL.GetNameDef] является центром коммунистической революции в Латинской Америке, что создаёт сильное чувство единства и общей цели."
 CHL_pacts_of_may_idea:0 "Майские пакты"
 CHL_pacts_of_may_idea_desc:0 "Майские пакты были подписаны в 1902 году и ограничили наши действия Тихим океаном, а аргентинские — Атлантическим."
 CHL_central_bank_idea:0 "Расширенный Центральный банк"
 CHL_central_bank_idea_desc:0 "Расширение Центрального банка облегчает финансирование государственных инфраструктурных проектов."
 CHL_popular_front_frail:0 "Хрупкая коалиция"
 CHL_popular_front_frail_desc:0 "Народный фронт объединил социалистов, левоцентристские и коммунистические партии. Такой широкий союз по своей природе непрочен."
 CHL_volunteer_corps_focus_republican:0 "Поддержка республиканской Испании"
 CHL_volunteer_corps_focus_republican_desc:0 "Мы должны отправить солдат на помощь братьям в Испании. Вероятно, затем стоит продолжить это и в других странах."
 CHL_volunteer_corps_focus_nationalist:0 "Поддержка националистической Испании"
 CHL_volunteer_corps_focus_nationalist_desc:0 "Мы должны отправить солдат на помощь братьям в Испании. Вероятно, затем стоит продолжить это и в других странах."
 lion_of_tarapaca:0 "Лев Тарапаки"
 CHL_soviet_assistance:0 "[SOV.GetAdjective] Советники"
 CHL_german_assistance:0 "[GER.GetAdjective] Советники"
 CHL_the_leader_idea:0 "Одна партия, один лидер"
 CHL_the_leader_idea_desc:0 "Идея «хефе» — вождя, обладающего абсолютной властью в стране и правящей партии и служащего объединяющим символом, была распространена среди латиноамериканских диктатур и крайне правых движений."
 CHL_extirpation_idea:0 "Искоренение нежелательных элементов"
 CHL_extirpation_idea_desc:0 "Враги страны должны быть изгнаны."
 CHL_communist_conquest_idea:0 "Кавалеры коммунизма"
 CHL_anti_american_idea:0 "Анти-[USA.GetAdjective] настроения"
 CHL_anti_capitalist_idea:0 "Капиталисты уничтожены"
 CHL_peronist_support:0 "[CHL.GetAdjective] поддержка перонистов"
 CHL_consolidate_the_government:0 "Укрепить позиции Алессандри"
 CHL_consolidate_the_government_desc:0 "Наша страна всё ещё не оправилась от последствий переворота 1925 года. Радикальные движения проникли повсюду, и нельзя позволить им существовать дальше. Пора вновь взять управление страной в свои руки и задать новый, непреклонный курс."
 CHL_the_popular_front:0 "Народный фронт"
 CHL_the_popular_front_desc:0 "Время Алессандри прошло; бойня в Сегуро Обреро стала последней каплей. Хотя при нём страна стабилизировалась, такой жестокий правитель больше не нужен. Пора создать более либеральное правительство и объединить социалистические и либеральные партии ради освобождения."
 CHL_supress_the_nacistas:0 "Подавить нацистас"
 CHL_supress_the_nacistas_desc:0 ""
 CHL_win_the_liberals:0 "Склонить либералов на свою сторону"
 CHL_win_the_liberals_desc:0 "И левые, и правые угрожают вновь погрузить страну в хаос, и этого нельзя допустить. Небольшое кровопролитие необходимо для безопасности страны, а кровь диссидентов — малая цена за спокойствие граждан. Либералы это поймут и поддержат нас."
 CHL_isi_idea:0 "Экономика импортозамещения"
 CHL_isi_idea_desc:0 "Великая депрессия парализовала чилийскую экономику. Мы больше не можем следовать безудержному либерализму. [CHL.GetNameDefCap] должна стать самодостаточной, чтобы защититься от потрясений иностранных экономик. Необходимо развивать ключевые отрасли и производственные возможности [CHL.GetNameDef]."
 CHL_cap_steel:0 "Национальный сталелитейный завод"
 CHL_cap_steel_desc:0 "Нам следует создать национальную сталелитейную компанию. [CHL.GetNameDefCap] уже располагает сталелитейной промышленностью, которую необходимо расширить и частично национализировать ради безопасности. Мы создадим Compania de Acero del Pacifico как национальный сталелитейный завод."
 CHL_enap:0 "Расширить нефтяную и электроэнергетическую промышленность"
 CHL_enap_desc:0 "Empresa Nacional del Petroleo — ENAP — и Empresa Nacional de Electricidad — ENDESA — станут новыми отраслями под управлением CORFO и обеспечат процветание этих секторов в [CHL.GetNameDef]."
 CHL_liberalism_over_socialism:0 "Парламентаризм вместо социализма"
 CHL_liberalism_over_socialism_desc:0 "Хотя мы создали коалицию с социалистами и даже коммунистами, [CHL.GetNameDef] не пойдёт по их пути. Чили станет социал-демократией. Коммунисты ничем не лучше старых хунт и диктаторов. Свобода и безопасность станут целями правительства."
 CHL_a_truly_radical_party:0 "Подлинно радикальная партия"
 CHL_a_truly_radical_party_desc:0 "Страна всё ещё охвачена беспорядками. Хрупкая коалиция буржуазии и социалистов долго не продержится. Пришло время коммунистической революции в [CHL.GetNameDef]. Мы должны захватить президентскую власть и создать по-настоящему равное и освободительное правительство."
 CHL_remove_the_right:0 "Устранить правых"
 CHL_remove_the_right_desc:0 "Крайне правые десятилетиями угрожали стабильности Чили. Пора окончательно искоренить эту угрозу. Найдём фон Мареэса и его национал-социалистов и устраним их. В Чили больше никогда не будет неудачного переворота."
 CHL_support_republican_spain:0 "Поддержать республиканскую Испанию"
 CHL_support_republican_spain_desc:0 "Чили давно тесно связана с Испанией. Республиканцы взывают о помощи интернационалистов всего мира, и мы должны им помочь. Вскоре весь мир станет коммунистическим."
 CHL_support_nationalist_spain:0 "Поддержать националистическую Испанию"
 CHL_support_nationalist_spain_desc:0 "Наша родина, Испания, взывает о помощи. Как и мы, они борются с коммунистами и анархистами, которые хотят уничтожить всё испанское и заменить его интернационализмом. Мы не можем бездействовать и позволить землям предков погрузиться во тьму. Мы должны помочь им."
 CHL_urbanisation_focus:0 "Поощрять урбанизацию"
 CHL_urbanisation_focus_desc:0 "Пришло время превратить [CHL.GetNameDef] из преимущественно сельского и аграрного общества в по-настоящему современную экономику. Расширение городской инфраструктуры и стимулы к переселению помогут развитию обрабатывающей промышленности и восстановлению после депрессии."
 CHL_land_reform_auth:0 "Экспроприировать асьенды"
 CHL_land_reform_auth_desc:0 "Асьендадос показали себя невыносимыми хозяевами. Их необходимо наказать и напомнить им их место. Изъятие части земель и принятие новых законов должны решить проблему."
 CHL_land_reform:0 "Аграрная реформа"
 CHL_land_reform_desc:0 "Сельское хозяйство [CHL.GetNameDef] сковано властью асьендадос и их почти феодальной системой. Из-за их влияния решить проблему будет трудно, но без этого невозможно преодолеть аграрный кризис. Одних законов недостаточно — потребуется и принуждение."
 CHL_full_recovery:0 "Полное восстановление экономики"
 CHL_full_recovery_desc:0 "Экономика [CHL.GetNameDef] оживилась благодаря многочисленным инвестициям и достижениям. Кроме того, [CHL.GetNameDef] больше не зависит полностью от иностранных экономик. В будущем мы будем лучше готовы к потрясениям."
 CHL_efe_rail:0 "Возродить железные дороги"
 CHL_efe_rail_desc:0 "Empresa de Ferrocarriles del Estado, Национальная железнодорожная компания, была основана в 1884 году и охватывала всю Чили. Однако дороги давно не обновлялись, а поезда устарели. Следует вновь активно инвестировать в компанию на благо всех отраслей и населения [CHL.GetNameDef]."
 CHL_steel:0 "Расширить сталелитейные заводы"
 CHL_steel_desc:0 "Национальная сталелитейная промышленность оказалась чрезвычайно полезной. Разумно продолжить инвестиции там, где у нас есть ресурсы. Построим огромный завод в Уачипато: в регионе есть признаки сырья и необычайная страсть к футболу."
 CHL_oil_in_the_tierra_del_fuego:0 "Нефть на Огненной Земле"
 CHL_oil_in_the_tierra_del_fuego_desc:0 "Далеко на юге скрываются ресурсы, способные обеспечить нам энергетическую независимость."
 CHL_mining_technologies:0 "Горнодобывающие технологии"
 CHL_mining_technologies_desc:0 "Экономика во многом зависит от горнодобывающего сектора, поэтому современные технологии добычи руды жизненно необходимы."
 CHL_the_spread_of_fascism:0 "Поддержать нацистас"
 CHL_the_spread_of_fascism_desc:0 "Националистические настроения усиливаются как в армии, так и среди населения [CHL.GetNameDef], угрожая свергнуть республику. Похоже, рано или поздно они захватят власть. Следует заключить с ними союз сейчас, чтобы избежать кровопролития."
 CHL_appropriate_land_com:0 "Освободить крестьян"
 CHL_appropriate_land_com_desc:0 "Тиранической аристократии, владеющей большей частью земель [CHL.GetNameDef], должен прийти конец. Пора передать их владения трудолюбивым крестьянам, которые прежде на них работали."
 CHL_el_ariostazo:0 "Эль-Ариостасо"
 CHL_el_ariostazo_desc:0 "Пришло время покончить с республикой. Демократия слаба и легко поддаётся влиянию. В эти неспокойные времена [CHL.GetNameDef] нуждается в сильном военном правительстве. Нынешняя власть будет свергнута переворотом — и на этот раз он не провалится."
 CHL_the_pacts_of_may:0 "Отменить Майские пакты"
 CHL_the_pacts_of_may_desc:0 "Pactos de Mayo были подписаны в 1902 году и определили военные отношения между Чили и Аргентиной. Возможно, пришло время пересмотреть отношения с [ARG.GetAdjective] стороной."
 CHL_claims_on_argentina:0 "Захватить Огненную Землю"
 CHL_claims_on_argentina_desc:0 "Наша граница с аргентинцами была определена в 1902 году, но теперь её необходимо пересмотреть. Огненная Земля — архипелаг к югу от Патагонии. Сейчас мы делим его с [ARG.GetAdjective] стороной, но этому пора положить конец. [CHL.GetNameDefCap] должна контролировать мыс Горн."
 CHL_claims_on_uruguay:0 "Обезопасить Южную Атлантику"
 CHL_claims_on_uruguay_desc:0 "Теперь, когда Аргентина находится под нашим контролем, большая часть Южной Атлантики также оказывается в нашей сфере. Мы делим стратегическую реку Ла-Плата с [URG.GetAdjective] стороной. Так продолжаться не может. Необходимо установить контроль над регионом и Рио-де-ла-Платой."
 CHL_hispanic_pan_nationalism:0 "Испанский паннационализм"
 CHL_hispanic_pan_nationalism_desc:0 "Мы — истинная нация испанской Южной Америки. Пусть все испаноязычные народы объединятся и вместе одержат победу."
 CHL_reform_the_army_desc:0 "Над миром вновь нависла тень войны. Мы должны подготовиться и обновить безнадёжно устаревшие вооружённые силы."
 CHL_reform_the_army:0 "Перевооружить Fuerzas"
 CHL_andean_warfare:0 "Война в Андах"
 CHL_andean_warfare_desc:0 "[CHL.GetNameDefCap] почти целиком расположена в горной цепи. Армия должна специализироваться на боях в такой местности не только в обороне, но и в наступлении, ведь [CHL.GetNameDef] не единственная страна континента с подобной географией."
 CHL_mobility_focus:0 "Приоритет мобильности"
 CHL_mobility_focus_desc:0 "Будущее войны — за мобильностью. Танки знаменуют огромный сдвиг в характере конфликта, и мы должны приспособиться, иначе нас сметёт ход истории. [CHL.GetNameDefCap] окажется в авангарде войны третьего поколения и поведёт за собой Америки."
 CHL_infantry_focus:0 "Приоритет пехоты"
 CHL_infantry_focus_desc:0 "Танки могут быть интересным экспериментом, но у [CHL.GetNameDef] нет промышленности для таких дорогостоящих авантюр. Следует полагаться на проверенные методы войны: пехоту и артиллерию."
 CHL_restore_the_navy:0 "Расширить Armada"
 CHL_restore_the_navy_desc:0 "Когда-то Чили обладала самым мощным флотом Тихого океана, превосходившим даже Соединённые Штаты. Былое величие можно вернуть: мы вновь будем править волнами своего океана."
 CHL_naval_aviation_focus:0 "Морская авиация"
 CHL_naval_aviation_focus_desc:0 "За последнее десятилетие авиация совершила невероятный рывок. С её появлением традиционная морская война безнадёжно устаревает: великие линкоры будут беспомощно тонуть, не успев сделать ни единого выстрела."
 CHL_surface_fleet_focus:0 "Надводный флот"
 CHL_surface_fleet_focus_desc:0 "Проверенные методы морской войны подходят нам идеально. Ни одно препятствие не выдержит залпа линкора."
 CHL_destroyer_focus:0 "Приоритет эсминцев"
 CHL_destroyer_focus_desc:0 "Эсминцы — основа флота, ведь без них крупный корабль остаётся беззащитным. Необходимо инвестировать в новые проекты, чтобы сохранить их эффективность."
 CHL_cruiser_focus:0 "Приоритет крейсеров"
 CHL_cruiser_focus_desc:0 "Развитие морской авиации требует усиленного воздушного прикрытия флотов. Лёгкие крейсеры идеально подходят для этой задачи и станут эффективным охранением крупных кораблей."
 CHL_naval_bomber_focus:0 "Новые проекты торпедоносцев"
 CHL_naval_bomber_focus_desc:0 "Современные авианосцы бесполезны без современных самолётов. Необходимо обновить проекты торпедоносцев, чтобы они могли наносить эффективные и сокрушительные удары."
 CHL_expand_talcahuano:0 "Расширить верфь Талькауано"
 CHL_expand_talcahuano_desc:0 "Наша крупнейшая верфь находится в Талькауано, но её возможностей недостаточно. Необходимо расширить судостроительные мощности для постройки более крупных кораблей."
 CHL_expand_magallanes_valparasio:0 "Расширить Магальянес и Вальпараисо"
 CHL_expand_magallanes_valparasio_desc:0 "Второстепенные верфи в Магальянесе и Вальпараисо также необходимо расширить. Здесь мы будем строить корабли охранения."
 CHL_expand_our_arsenal:0 "Расширить арсенал"
 CHL_expand_our_arsenal_desc:0 "[CHL.GetAdjective] армия профессиональна и несокрушима, но её численность пока недостаточна. Необходимо расширить национальный арсенал, чтобы содержать более крупные силы."
 CHL_invest_further_in_electronics:0 "Продолжить инвестиции в электронику"
 CHL_invest_further_in_electronics_desc:0 "ENDESA оказалась крайне выгодным вложением. Следует продолжить инвестиции в электронику и посмотреть, к чему это приведёт; результат наверняка будет полезным."
 CHL_nuclear_focus:0 "Расщепление атома"
 CHL_nuclear_focus_desc:0 "Учёные говорят о невообразимой энергии, заключённой даже в атомах. Хотя это звучит фантастически, идею стоит исследовать: если она верна, возможная выгода неизмерима."
 CHL_famae:0 "Инвестировать в FAMAE"
 CHL_famae_desc:0 "Fábricas y Maestranzas del Ejercito — старейший производитель вооружений во всей Латинской Америке. Следует инвестировать в эту престижную компанию и разработать новое стрелковое оружие, превосходящее образцы соперников."
 CHL_universities:0 "Инвестировать в университеты"
 CHL_universities_desc:0 "Создадим два новых университета: Био-Био и Плайя-Анча. [CHL.GetNameDefCap] должна оставаться в авангарде гражданской и военной науки, чтобы сохранять конкурентоспособность. Эти учреждения помогут добиться цели."
 CHL_military_research_institute:0 "Создать ICIA"
 CHL_military_research_institute_desc:0 "Наша армия выросла, а вместе с ней и накопленный опыт. Пора создать военный исследовательский институт — Institución Chilena de Investigación Avanzada, Чилийский институт передовых исследований."
 CHL_mechanized:0 "Развитие механизированных войск"
 CHL_mechanized_desc:0 "Танки не могут действовать одни: им нужны разведчики и подразделения поддержки. Однако моторизованные части недостаточно эффективны, поэтому следует создать новые машины, сочетающие защиту брони и башен с универсальностью пехоты."
 CHL_armour_effort:0 "Развитие бронетехники"
 CHL_armour_effort_desc:0 "Танки — молот нашей мобильной армии. Необходимо разработать новые модели, превосходящие противника и делающие его оружие бесполезным против нашей брони."
 CHL_armour_more:0 "Передовые модели бронетехники"
 CHL_armour_more_desc:0 "Новые университеты дали множество новаторских идей. Следует воспользоваться ими и создать самые передовые танки в мире!"
 CHL_doctrine:0 "Развитие доктрины"
 CHL_doctrine_desc:0 "Наша новая армия прекрасно оснащена и находится в отличном состоянии. Пора пересмотреть тактику с учётом нового снаряжения и разработать манёвры, позволяющие использовать его преимущества."
 CHL_artillery_f:0 "Развитие артиллерии"
 CHL_artillery_f_desc:0 "Наша стратегия строится на непрерывной бомбардировке врага до его капитуляции. Поэтому естественно разработать новые артиллерийские системы, способные поражать противника точнее и разрушительнее."
 CHL_support:0 "Развитие войск поддержки"
 CHL_support_desc:0 "Одна пехота неэффективна. Ей нужна не только огневая, но и логистическая, разведывательная и специализированная поддержка. Эти элементы армии не должны отставать."
 CHL_rockets:0 "Ракетная техника"
 CHL_rockets_desc:0 "Исследователи сделали захватывающее предложение: ракеты. По их словам, будущее артиллерии заключается именно в них. Мы не из тех, кто откажется от ещё более эффективного способа обстреливать врага. Следует изучить ракеты и определить их ценность."
 CHL_naval_doctrine:0 "Развитие военно-морской доктрины"
 CHL_naval_doctrine_desc:0 "Новые корабли требуют новой тактики. Следует проводить учения и искать способы наиболее эффективно использовать их возможности."
 CHL_marines_focus:0 "[CHL.GetAdjective] Морпехи"
 CHL_marines_focus_desc:0 "Наш новый флот господствует на окружающих морях. Разумно воспользоваться этим и применять морскую пехоту для захвата вражеского побережья. Необходимо расширить нынешние силы специального назначения для таких операций."
 CHL_nationalise_all:0 "Национализировать всю промышленность"
 CHL_nationalise_all_desc:0 "Слишком долго буржуазия богатела на труде простых людей. Мы больше не станем терпеть праздных надсмотрщиков и тираничных хозяев. Пора передать всю [CHL.GetAdjective] промышленность рабочим и народу. Труд больше не будет растрачиваться на пустяки."
 CHL_comintern:0 "Вступить в Коминтерн"
 CHL_comintern_desc:0 "[CHL.GetNameDefCap] должна присоединиться к коммунистам всего мира в глобальной революции."
 CHL_internationalism:0 "Распространить революцию"
 CHL_internationalism_desc:0 "Мы должны распространить революцию на соседние страны, а затем и на весь мир! Вскоре все объединятся в единый союз человечества."
 CHL_communist_argentina_influence:0 "Повлиять на [ARG.GetNameDef]"
 CHL_communist_argentina_influence_desc:0 "[ARG.GetNameDefCap] — ближайшая к нам страна. Именно туда революция должна прийти первой. [ARG.GetAdjective] рабочие вскоре познают освобождение и настоящую свободу."
 CHL_communist_faction:0 "Основать Коммунистический латинский союз"
 CHL_communist_faction_desc:0 "Коминтерн лишь насмехается над истинным коммунизмом — его участники даже не социалисты. Сталин не более чем деспотичный царь, правящий страхом. Мы должны создать собственный союз подлинно коммунистических стран и распространять революцию."
 CHL_communist_brazil_influence:0 "Повлиять на [BRA.GetNameDef]"
 CHL_communist_brazil_influence_desc:0 "[BRA.GetNameDefCap] — крупнейшая страна Южной Америки. Если убедить [BRA.GetAdjective] народ присоединиться к революции, остальной континент быстро последует за ним."
 CHL_growing_communist_faction:0 "Революция распространилась на наших соседей."
 CHL_growing_communist_faction_desc:0 "Буржуазия угнетает наших соседей. Мы должны освободить их так же, как освободили себя."
 CHL_communist_argentina_war:0 "Освободить [ARG.GetAdjective] народ"
 CHL_communist_argentina_war_desc:0 "[ARG.GetAdjective] рабочие взывают к свободе. Мы должны избавить их от оков капиталистического угнетения."
 CHL_communist_argentina_alliance:0 "Союз с [ARG.GetNameDef]"
 CHL_communist_argentina_alliance_desc:0 "[ARG.GetAdjective] рабочие освободили себя. Мы должны сотрудничать, чтобы распространить движение по Америкам."
 CHL_communist_bolivia_paraguay_war:0 "Распространить революцию на север"
 CHL_communist_bolivia_paraguay_war_desc:0 "[PAR.GetNameDefCap] не является по-настоящему коммунистической страной: её правительство ничем не лучше фашистской диктатуры. Мы должны освободить [BOL.GetAdjective] и [PAR.GetAdjective] народы, приняв их в наши ряды."
 CHL_communist_brazil_war:0 "Распространить революцию в [BRA.GetNameDef]"
 CHL_communist_brazil_war_desc:0 "[BRA.GetNameDefCap] — крупнейшая страна Южной Америки. Мы должны освободить [BRA.GetAdjective] народ и добиться гегемонии на континенте. После этого остальные страны быстро присоединятся к нам."
 CHL_preemptive_measures:0 "Превентивные меры"
 CHL_preemptive_measures_desc:0 "Мы должны подготовиться к печальной неизбежности войны. [PRU.GetNameDefCap] представляет самую непосредственную угрозу, но необходимо быть готовыми к любому развитию событий."
 CHL_join_allies:0 "Вступить в Союзники"
 CHL_join_allies_desc:0 "В одиночку [CHL.GetNameDef] уязвима перед более сильными внешними державами. Необходимо найти союзников, которые помогут защитить нас от тех, кто хочет уничтожить демократию, и самим участвовать в защите свободы повсюду."
 CHL_trade_deals:0 "Новые торговые соглашения"
 CHL_trade_deals_desc:0 "[CHL.GetNameDefCap] слишком тесно связана с [GER.GetNameDef] и другими фашистскими странами, чтобы процветать. Следует искать новые торговые возможности с демократиями мира."
 CHL_expand_private_sector:0 "Расширить частный сектор"
 CHL_expand_private_sector_desc:0 "Слишком большая часть [CHL.GetAdjective] экономики находится в государственной собственности. Необходимо сократить вмешательство правительства, повысив конкуренцию и эффективность. От этого выиграют и народ, и экономика."
 CHL_communist_militias:0 "Включить ополчение в армию"
 CHL_communist_militias_desc:0 "Пролетариат стремится помочь нам распространять революцию, и мы не вправе ему отказывать. Включим ополчение в состав армии."
 CHL_crackdown:0 "Расправа с диссидентами"
 CHL_crackdown_desc:0 "Радикальные левые и правые слишком долго бесчинствовали в стране. Правительство больше не может лишь реагировать на попытки переворотов и вспышки насилия. Необходимо найти и устранить политическую угрозу, которую они представляют."
 CHL_ties_with_argentina:0 "Укрепить связи с [ARG.GetNameDef]"
 CHL_ties_with_argentina_desc:0 "Хотя отношения с [ARG.GetNameDef] не всегда были лучшими, в конечном счёте мы братья. Следует укрепить дружбу с [ARG.GetAdjective] стороной ради мира в регионе."
 CHL_central_bank:0 "Расширить Центральный банк"
 CHL_central_bank_desc:0 "Алессандри учредил Центральный банк, но в нынешние трудные времена его возможностей недостаточно. Мы должны обеспечить финансовую стабильность страны."
 CHL_patriotic_leagues:0 "Восстановить Патриотические лиги"
 CHL_patriotic_leagues_desc:0 "Патриотические лиги были военизированной организацией, следившей за тем, чтобы никто не подавлял националистический дух Чили, но около десяти лет назад они распались. Следует восстановить эту уважаемую организацию и оказать ей поддержку."
 CHL_ban_communism:0 "Подавить коммунизм"
 CHL_ban_communism_desc:0 "Коммунистической угрозе слишком долго позволяли существовать. Ради безопасности необходимо запретить этот культ и полностью искоренить его присутствие."
 CHL_preemptive_strike:0 "Превентивный удар"
 CHL_preemptive_strike_desc:0 "Мы должны нанести превентивный удар по [PRU.GetAdjective] фашистам. Эта диктатура угрожает миру в Южной Америке. Если не действовать сейчас, позднее они могут ударить по нам с большей силой."
 CHL_argentine_alliance:0 "Альянс с [ARG.GetAdjective]s"
 CHL_argentine_alliance_desc:0 "Мы должны формализовать союз с [ARG.GetAdjective]е обеспечить защиту обеих наших стран. Вместе мы являемся силой, не имеющей себе равных на континенте."
 CHL_expand_alliance:0 "Расширить союз"
 CHL_expand_alliance_desc:0 "Следует пригласить соседей в наш союз, чтобы укрепить себя и защитить их от воинственных государств. [URG.GetNameDefCap] имеет стратегическое значение в Атлантике, но не способна защитить себя. Мы должны предложить ей присоединиться."
 CHL_paraguayan_threat:0 "[PAR.GetAdjective] угроза"
 CHL_paraguayan_threat_desc:0 "[PAR.GetNameDefCap] Мы не можем оставаться на нашей границе. Они предлагают создать коммунистический режим, который будет угрожать тонкому равновесию в Южной Америке. Если мы не будем действовать в ближайшее время, они могут сначала направить против нас агентов."
 CHL_establish_the_airforce:0 "Инвестировать в Linea Aérea Nacional"
 CHL_establish_the_airforce_desc:0 "Linea Aérea Nacional была основана в 1932 году при Карлосе Ибаньесе дель Кампо, но пока располагает лишь небольшим флотом. Небо станет важным полем боя, а самолёты — необходимым вложением. Наш военно-промышленный комплекс не способен содержать огромные ВВС, поэтому следует максимально эффективно использовать имеющиеся силы."
 CHL_bomber_focus:0 "Приоритет бомбардировщиков"
 CHL_bomber_focus_desc:0 "Следует сосредоточить авиационные усилия на бомбардировщиках: они универсальны и несут значительную боевую нагрузку."
 CHL_cas_focus:0 "Приоритет поддержки"
 CHL_cas_focus_desc:0 "Авиация играет вспомогательную роль при армии. Следует разрабатывать самолёты, особенно эффективные в этой задаче."
 CHL_air_doctrine:0 "Развитие доктрины"
 CHL_air_doctrine_desc:0 "Новые конструкции требуют новой тактики. Проведём эксперименты с самолётами и разработаем лучшие способы их применения."
 CHL_heavy_bomber_focus:0 "Стратегические бомбардировщики"
 CHL_heavy_bomber_focus_desc:0 "Следует инвестировать в разработку новых дальних тяжёлых бомбардировщиков — мы заставим врагов покориться ударами с неба."
 CHL_bomber_focus_2:0 "Тактические бомбардировщики"
 CHL_bomber_focus_2_desc:0 "Тактические бомбардировщики выполняют самые разные роли.[CHL.GetNameDefCap] Не хватает промышленности, чтобы поддерживать огромные воздушные силы должным образом, поэтому мы должны быть эффективными с нашими самолетами: тактические бомбардировщики идеально подходят для этого."
 CHL_heavy_fighter_focus:0 "Тяжёлые истребители"
 CHL_heavy_fighter_focus_desc:0 "Вражеские бомбардировщики налетают на [CHL.GetNameDef], словно рой ос. Тяжёлые истребители идеально подходят для их уничтожения и помогут сохранять превосходство в воздухе над удалёнными районами Южной Америки."
 CHL_fighter:0 "Истребители"
 CHL_fighter_desc:0 "Истребители — основа любых военно-воздушных сил, и ими нельзя пренебрегать. Разумно разрабатывать новые модели, превосходящие самолёты противника."
 CHL_jet_focus:0 "Развитие реактивной авиации"
 CHL_jet_focus_desc:0 "Университетские учёные рассказали о новом типе двигателей — реактивных. По их словам, они позволят создать самолёты, значительно превосходящие всё прежнее. Заявления звучат смело, но перспектива слишком заманчивa, чтобы её игнорировать."
 CHL_paratroopers:0 "Воздушно-десантные войска"
 CHL_paratroopers_desc:0 "Следует в полной мере использовать недавно созданные ВВС и развивать воздушно-десантные войска."
 CHL_naval_fighter_focus:0 "Приоритет палубных истребителей"
 CHL_naval_fighter_focus_desc:0 "Авианосец бесполезен без самолётов, а одни бомбардировщики уязвимы. Необходимо разработать новые палубные истребители для защиты авианосцев и торпедоносцев от вражеской авиации."
 CHL_northern_expansion:0 "Экспансия на север"
 CHL_northern_expansion_desc:0 "Мы должны обезопасить северные границы. [BRA.GetNameDefCap] угрожает нашей гегемонии, поэтому между нами необходимо создать буферную зону."
 CHL_expel_america:0 "Изгнать Америку"
 CHL_expel_america_desc:0 "Южная Америка освобождена от [USA.GetAdjective] угрозы. Революция распространяется по континенту, и Соединённые Штаты больше не имеют значения."
 CHL_spread_revolution_idea:0 "Распространить революцию"
 CHL_spread_revolution_idea_desc:0 "Необходимо активизировать распространение революции за рубежом!"
 CHL_soviet_ties:0 "Обратиться к [SOV.GetNameDef]"
 CHL_soviet_ties_desc:0 "Наш режим еще молод и неопытен. Мы должны спросить [SOV.GetAdjective]Для помощи, потому что они, кажется, самые устоявшиеся коммунисты."
 CHL_german_ties:0 "Запросить советников у [GER.GetNameDef]"
 CHL_german_ties_desc:0 "[GER.GetAdjective] армия значительно превосходит нашу, и нам есть чему у неё поучиться. Поскольку наши идеологии близки, следует обратиться за помощью."
 CHL_japan_accord:0 "Соглашение с [JAP.GetNameDef]"
 CHL_japan_accord_desc:0 "Чили долгое время была значительной военно-морской державой в Тихом океане. The [JAP.GetAdjective] В последнее время они стали мощной силой в регионе. Мы должны предложить соглашение между нашими странами, чтобы предотвратить будущий конфликт: они будут контролировать Запад и Северную часть Тихого океана, в то время как мы будем контролировать Юг и Юго-Восток."
 CHL_fascist_constitution:0 "Переписать конституцию"
 CHL_fascist_constitution_desc:0 "Нынешняя конституция устарела и слаба, одинаково уязвима перед коммунистами и капиталистами. Следует составить новый, более твёрдый документ, соответствующий [CHL.GetAdjective] идеалам."
 CHL_the_leader:0 "Эль-Хефе"
 CHL_the_leader_desc:0 "Власть лидера должна быть абсолютной, чтобы курс страны оставался непреклонным. После принятия новой конституции мы сможем официально сосредоточить полномочия Эль-Хефе. Демократия слаба и подвержена подрывной деятельности, но теперь наша власть станет неоспоримой и защитит нас от врагов."
 CHL_extirpation:0 "Искоренить нежелательные элементы"
 CHL_extirpation_desc:0 "Чили слишком долго страдала от сомнительных личностей. [CHL.GetAdjective] народ обладает высочайшими качествами. Мы должны устранить тех, кто не соответствует нашим требованиям, и присвоить их ресурсы ради нравственного и физического здоровья страны."
 CHL_communist_conquest:0 "Освободить Южную Америку"
 CHL_communist_conquest_desc:0 "Другие режимы Южной Америки угнетают народы и служат капиталу — надежды на них нет. Мы должны силой освободить соседей от оков и открыть новую эпоху изобилия."
 CHL_anti_americanism_desc:0 "[USA.GetNameDefCap] погрязла в упадке и коррупции. [USA.GetAdjective] влияние в [CHL.GetNameDef] отвратительно. Мы должны искоренить глупые и слабые идеи, распространяемые [USA.GetNameDef], иначе сами погрузимся в её разложение."
 CHL_japan_faction:0 "Союз с [JAP.GetNameDef]"
 CHL_japan_faction_desc:0 "Договорившись разделить Тихий океан с [JAP.GetNameDef], следует официально заключить союз и совместно его обезопасить. [USA.GetNameDef] будет отброшена туда, где ей место, а мы вновь станем править этим океаном."
 CHL_axis:0 "Вступить в союз с [GER.GetNameDef]"
 CHL_axis_desc:0 "[GER.GetNameDefCap] сражается с нашими общими врагами — американизмом и коммунизмом. Следует официально присоединиться к её борьбе, чтобы повысить шансы на успех."
 CHL_ban_capitalism:0 "Искоренить капитализм"
 CHL_ban_capitalism_desc:0 "Даже при нашей власти остаются капиталистические мятежники, продолжающие торговать и заключать сделки. Их необходимо уничтожить раз и навсегда, чтобы всё оказалось под нашей юрисдикцией, ведь коллектив сильнее отдельного человека."
 CHL_support_peronism:0 "Поддержать перонизм в [ARG.GetNameDef]"
 CHL_support_peronism_desc:0 "В [ARG.GetNameDef] зарождается массовое популистское движение, способное стать близким союзником. Хотя Перон может не разделять наши взгляды на семитское сообщество и характер народа, он всё же популист и националист."
 CHL_support_argentinian_coup:0 "Поддержать переворот в [ARG.GetNameDef]"
 CHL_support_argentinian_coup_desc:0 "Перонисты пользуются широкой поддержкой в [ARG.GetNameDef], но правительство не позволит им прийти к власти. Следует поддержать путч в Аргентине и обеспечить их правление."
 CHL_fascist_faction:0 "Союз с перонистами"
 CHL_fascist_faction_desc:0 "Помогая перонистам прийти к власти, мы уже тесно с ними связались. Следует официально оформить союз ради безопасности на континенте."
 CHL_arg_northern_expansion:0 "Вместе двинуться на север"
 CHL_arg_northern_expansion_desc:0 "И [ARG.GetNameDef], и [CHL.GetNameDef] угрожают [BRA.GetNameDef] и другие северные державы. Следует вместе выступить на север ради общей безопасности."
 CHL_give_arg_urg:0 "[ARG.GetAdjective] Контроль над Рио-де-ла-Плата"
 CHL_give_arg_urg_desc:0 "[ARG.GetNameDefCap] контролирует Южную Атлантику, а река Рио-де-ла-Плата играет в этом важнейшую роль. Сейчас она разделена с [URG.GetNameDef], но это следует изменить."
 CHL_shared_hegemony:0 "Совместная гегемония"
 CHL_shared_hegemony_desc:0 "Вместе с [ARG.GetNameDef] мы делим гегемонию над испанской Южной Америкой. Наши страны укрепили друг друга и продолжат становиться сильнее."
 CHL_expand_alliance_bol:0 "Вернуть Тарапаку [BOL.GetNameDef]"
 CHL_expand_alliance_bol_desc:0 "Мы отняли Тарапаку у [BOL.GetNameDef] после Тихоокеанской войны по Договору о мире и дружбе 1904 года. К сожалению, дружбы это не принесло. Возможно, следует вернуть землю в обмен на прочный союз и настоящий мир в регионе."
 CHL_expand_alliance_pru:0 "Вернуть Арику [PRU.GetNameDef]"
 CHL_expand_alliance_pru_desc:0 "Арика входила в перуанскую провинцию Тарапака до 1883 года, когда мы захватили её после Тихоокеанской войны. В 1929 году по настоянию Америки ради сохранения мира мы вернули Такну, но не Арику. Эти решения оказались временными, и единственный путь к стабильности — вернуть то, что нам не принадлежит."
 trade_deal_relations:0 "Торговые соглашения"
 chile_argentina_relations_1:0 "Улучшение отношений с [CHL.GetNameDef]"
 chile_argentina_relations_2:0 "Союз с [CHL.GetNameDef]"
 argentina_chile_relations_1:0 "Улучшение отношений с [ARG.GetNameDef]"
 argentina_chile_relations_2:0 "Союз с [ARG.GetNameDef]"
 chile_relations_bonus:0 "[CHL.GetAdjective] дипломатические усилия"
 CHL_revolution_spread:0 "Помощь во время революции"
 CHL_advisors:0 "Отправленные советники"
 CHL_pacific_accord:0 "Тихоокеанское соглашение"
 CHL_pacific_accord_no:0 "Отказ от компромисса"
 CHL_supported_peronism:0 "Поддержка перонизма"
 CHL_famae_bonus:0 "FAMAE подготовила новые проекты винтовок для оценки."
 CHL_doctrine_bonus:0 "Новые военные достижения привели к развитию доктрины."
 CHL_andean_bonus:0 "Андские горные стрелки"
 CHL_corfo_tech:0 "CORFO предлагает идеи по улучшению национальной промышленности."
 CHL_depression1:0 "Великая депрессия"
 CHL_depression1_desc:0 "Великая депрессия оказала значительное влияние на чилийскую экономику."
 CHL_depression2:0 "Великая депрессия"
 CHL_depression2_desc:0 "Государственные инвестиции ослабили последствия Великой депрессии, но кризис всё ещё остаётся тяжёлым."
 CHL_depression3:0 "Великая депрессия"
 CHL_depression3_desc:0 "[CHL.GetNameDefCap] в основном оправилась от Великой депрессии, однако безработица и бедность всё ещё широко распространены."
 CHL_agrarian_reform:0 "Безумные асьендадос"
 CHL_agrarian_reform_desc:0 "Безумные асьендадос, землевладельцы, обращаются с сельскими крестьянами [CHL.GetNameDef] как тираны."
 CHL_land:0 "Аграрная реформа"
 CHL_land_desc:0 "Масштабные аграрные реформы значительно повысили эффективность почти всех видов деятельности в сельской местности."
 CHL_endesa:0 "ENDESA обеспечила прогресс в электронике."
 CHL_endesa2:0 "Дальнейшие инвестиции в ENDESA принесли новые результаты."
 CHL_endesa3:0 "Дальнейшие инвестиции в ENDESA принесли новые результаты."
 CHL_naval_doctrine_bonus:0 "Военно-морские учения дали новые идеи для развития морской доктрины."
 CHL_mobile_doctrine:0 "[CHL.GetAdjective] армия разработала новые идеи развития доктрины."
 CHL_plane_bonus:0 "LAN подготовила новые проекты самолётов для оценки."
 CHL_cas_bonus:0 "Разработаны новые проекты пикирующих бомбардировщиков для оценки."
 CHL_heavy_fighter_bonus:0 "Появились нововведения в области двухмоторных истребителей, которыми мы можем воспользоваться."
 CHL_fighter_bonus:0 "Разработаны проекты лёгких самолётов, готовые к использованию."
 CHL_air_doctine_bonus:0 "Новые конструкции самолётов открыли новые идеи для воздушной доктрины."
 CHL_paratrooper_bonus:0 "Разработано десантное снаряжение для развития [CHL.GetAdjective] воздушно-десантных войск."
 CHL_air_doctrine_bonus:0 "Новые достижения в авиации вдохновили новые идеи для наших воздушных доктрин."
 CHL_bomber_bonus:0 "Разработаны новые проекты бомбардировщиков."
 CHL_bomber_doctrine_bonus:0 "Развитие технологий бомбардировщиков вдохновило новые способы их применения."
 CHL_heavy_bomber_bonus:0 "Разработаны новые проекты тяжёлых бомбардировщиков для оценки."
 CHL_mobile:0 "Моторизация"
 CHL_armour_ahead:0 "Разработаны передовые проекты бронетехники для анализа."
