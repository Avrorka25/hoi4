 AZR_event.1.t:0 "Добровольцы хотят домой!"
 AZR_event.1.desc:0 "Добровольческие части были сформированы для борьбы с [SOV.GetNameDef] и освобождения [AZR.GetNameDef]. После поражения [SOV.GetAdjective] государства добровольцы считают свою миссию выполненной и хотят вернуться домой."
 AZR_event.1.a:0 "Убедить их остаться ещё немного."
 AZR_event.1.b:0 "Расформировать их подразделение."
