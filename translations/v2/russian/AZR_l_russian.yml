 The_destiny_of_azerbaijan_category:0 "Судьба Азербайджана"
 The_destiny_of_azerbaijan_category_desc:0 "На протяжении веков Азербайджан находился на перекрёстке миров, а бакинская нефть сделала регион ещё более стратегически важным. После краха Демократической Республики под натиском большевиков надежда на восстановление независимости сохранилась в сердцах некоторых людей. При нашей активной поддержке и решительном контрударе против [SOV.GetNameDef] эту надежду можно разжечь вновь и гарантировать возвращение [AZR.GetAdjective] суверенитета."
