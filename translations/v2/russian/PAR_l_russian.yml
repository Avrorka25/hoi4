l_russian:
 r56_paraguay.1.t:0 "Военный переворот!"
 r56_paraguay.1.d:0 "После прошлогодней Чакской войны, которую нам удалось выиграть, у власти всё ещё оставалось слабое правительство Эусебио Айялы, однако полковник Рафаэль Франко при поддержке многих оппозиционных партий организовал государственный переворот, чтобы установить гораздо более сильный военный режим."
 r56_paraguay.1.a:0 "Да здравствует полковник Франко!"
 r56_paraguay.2.a:0 "Мы должны сопротивляться! Создать коалицию с ПКП и сражаться!"
 r56_PAR_franco_coup:0 "Грядущий военный переворот"
 r56_PAR_franco_coup_desc:0 "Военные, недовольные слабым режимом [PAR.getleader], организовали заговор с целью свержения нынешнего правительства. Заговор возглавляет находящийся в изгнании полковник Франко. Если мы хотим предотвратить переворот, нужно действовать быстро."
 r56_PAR_coup_called_off:0 "Полковник Франко был §Yубит§!"
 r56_PAR_franco_coup_mission:0 "Возвращение полковника Франко"
 r56_PAR_franco_coup_mission_desc:0 "По нашим данным, возвращение полковника Франко станет началом военного переворота."
 r56_PAR_military_concessions:0 "Уступки фракции Мориниго"
 r56_PAR_marxist_concessions:0 "Уступки ПКП"
 r56_PAR_assassinate_franco:0 "Убить полковника Франко"
 r56_PAR_assassinate_franco_desc:0 "Устранение Франко — единственный способ не дать перевороту стать реальностью..."
 r56_PAR_civil_war_choice_tt:0 "Открывает §Yвариант§! сопротивления военному перевороту посредством §Rгражданской войны.§!"
 r56_PAR_coup_called_off_tt:0 "Военный переворот будет §Yпредотвращён§!"
