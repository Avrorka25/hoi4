l_russian:
 flag_mexico_cedillo_has_revolted:0 " Генерал Седильо восстал против правительства"
 mexico.1.title:0 "Генерал Седильо Восстание"
 mexico.1.desc:0 "В течение некоторого времени генералы и губернаторы видели, как их личная власть рассеивается по мере того, как центральное правительство становится лучше в сдерживании неуправляемых каудильо. История мексиканских восстаний региональных военачальников, казалось, вымирала. К сожалению, нам не удалось выступить против генерала Седило из Сан-Луис-Потоси, и он сохранил за собой достаточно помилованных повстанцев и безжалостных бандитов, чтобы попытаться свергнуть центральное правительство, свергнуть его. [Root.GetLeader]И не позволяйте больше сил скользить по его пальцам."
 mexico.1.a:0 "Предатель!"
 mexico.2.title:0 "[From.GetAdjective] Нефть национализирована"
 mexico.2.desc:0 "[From.GetLeader] Это разжигание популистской чепухи, направленной против наших экономических интересов в Мексике. [From.GetRulingPartyLong] Он принял закон о национализации активов Royal Dutch Shell, Standard Oil of California и многих других международных нефтяных компаний. Хотя их Конституция допускает такие действия, международное правосудие требует компенсации за убытки, понесенные фирмами. Нефтяные бароны требуют от нас действий."
 mexico.2.a:0 "Это свершившийся факт, мы ничего не можем сделать."
 mexico.2.b:0 "Мы будем вводить эмбарго на торговлю с Мексикой, пока они не придут в себя."
 mexico.2.c:0 "Наши возможности ограничены, и необходимо учитывать силу оружия."
 mexico.3.title:0 "[From.GetAdjective] эмбарго"
 mexico.3.desc:0 "В ответ на нашу национализацию их нефтяных концессий [From.GetLeader] Он принял решение принять требования нефтяных компаний и ввел эмбарго на нашу страну.[From.GetNameDef] Мы больше не будем покупать или продавать наши ресурсы. Мы должны рассмотреть вопрос о компенсации нефтяным компаниям или об отказе от международного статус-кво и поиске наших состояний у врагов либерального капитализма."
 mexico.3.a:0 "Мексиканский народ этого не потерпит!"
 mexico.4.title:0 "[From.GetAdjective] Компенсация"
 mexico.4.desc:0 "Правительство [From.GetLeader] Компания согласилась потребовать от Royal Dutch Shell и Standard Oil of California компенсации в обмен на убытки, понесенные фирмами во время национализации нефтяных месторождений.[From.GetNameDef] Мы не вернем нефтяные концессии, но наш национальный престиж и финансовые интересы, по крайней мере, удовлетворены."
 mexico.4.a:0 "Хорошо, мы можем торговать на этих условиях."
 mexico.4.b:0 "Сохраняйте эмбарго, мы держимся за лучшее соглашение."
 mexico.8.title:0 "[From.GetAdjective] Вступление в The [Root.GetFactionName]"
 mexico.8.desc:0 "[From.GetLeader] Он обратился с просьбой присоединиться к [Root.GetFactionName]. Ищет ли он взаимной защиты или иностранной экспансии, неизвестно, но мексиканская нефть является прибыльным активом на нашей стороне."
 mexico.8.a:0 "Мы будем спонсировать въезд Мексики в страну. [Root.GetFactionName]."
 mexico.8.b:0 "У нас есть другие планы по России."
 mexico.9.title:0 "Мексиканский вход в [Root.GetFactionName]"
 mexico.9.desc:0 "[From.GetLeader] Спонсировал запрос из Мексики о въезде в страну. [Root.GetFactionName]. Неизвестно, стремится ли Мексика к взаимной защите или иностранной экспансии, но мексиканская нефть является прибыльным активом на нашей стороне."
 mexico.9.a:0 "Мы будем спонсировать въезд Мексики в страну. [Root.GetFactionName]."
 mexico.9.b:0 "У нас есть другие планы по России."
 mexico.10.title:2 "Альянс «[From.GetFactionName]»"
 mexico.10.desc:0 "[From.GetLeader] пригласили [Root.GetNameDef] Чтобы присоединиться к [From.GetFactionName]. Этот правый блок стран будет защищать Латинскую Америку от коммунистического проникновения, одновременно прокладывая независимый путь от упадочного Янкиса."
 mexico.10.a:0 "[Root.GetLeader] принимает это предложение."
 mexico.10.b:0 "Американцы не выдержат такой план."
 mexico.11.title:2 "Альянс «[From.GetFactionName]»"
 mexico.11.desc:0 "[From.GetLeader] пригласили [Root.GetNameDef] Чтобы присоединиться к [From.GetFactionName]. Этот левый блок стран будет защищать Латинскую Америку от фашистской тирании, одновременно прокладывая независимый путь от угнетающего Янкиса."
 mexico.11.a:0 "[Root.GetLeader] принимает это предложение."
 mexico.11.b:0 "Американцы не выдержат такой план."
 mexico.12.title:0 "Продажа Британского Гондураса"
 mexico.12.desc:0 "[From.GetLeader] Он просил, чтобы [Root.GetNameDef] Небольшая территория Британского Гондураса, иногда называемая Белизом. Испанская империя претендовала на регион, но так и не поселилась в нем, поэтому Мексика имеет мало реальных претензий на эту территорию. Однако мы могли бы продать эту территорию нашим мексиканским друзьям в качестве жеста доброй воли."
 mexico.12.a:0 "[Root.GetLeader] принимает это предложение."
 mexico.12.b:0 "Эта территория полезна в качестве военно-морской базы."
 mexico.13.title:0 "Британия уступила Белиз"
 mexico.13.desc:0 "[From.GetLeader] Мы согласились передать нам контроль над бывшей колонией Британский Гондурас в качестве жеста доброй воли. Государство небольшое, неразвитое и не имеет природных ресурсов, кроме пиломатериалов, но это показывает улучшение положения Мексики на международной арене."
 mexico.13.a:0 "[From.GetNameDef] Это действительно наш друг."
 mexico.14.title:0 "Великобритания сокращает продажи Белиза"
 mexico.14.desc:0 "[From.GetLeader] Он отказался продать нам колонию Британский Гондурас. Ссылаясь на его полезность в качестве военно-морской базы, [From.GetAdjective] Правительство предпочитает сохранить колонию. Большинство жителей являются англоговорящими, поэтому отказ понятен, если он разочаровывает."
 mexico.14.a:0 "Возможно, [From.GetAdjective] В конце концов, они не наши друзья."
 mexico.15.title:0 "Архиепископ Паскуаль Диас скончался"
 mexico.15.desc:0 "Преподобный Паскуаль Диас и Баррето, архиепископ Мехико, скончался сегодня от колита. Ему было 59. Его наследие является одним из жестких противников социалистической политики правительства, а также попыток компромисса в конце войны Кристеро.\n\nЕго преемником является Луис Мария Мартинес, социальный реформатор и личный друг президента Карденаса. Преемник, вероятно, был выбран Папой Римским для обеспечения постоянного мира между Церковью и правительством в Мексике."
 mexico.15.a:0 "Реквием в темпе."
 mexico.15.b:0 "Гори в аду, предатель."
 mexico.16.title:0 "Забастовка нефтяников"
 mexico.16.desc:0 "Нефтяники объединились в 1935 году по благословению президента Карденаса, создав Синдикато Унико де Трабаджадорес Петролерос. Они сразу же начали пытаться договориться о более высокой заработной плате и лучших условиях труда, но были отвергнуты влиятельными международными нефтяными компаниями, такими как Royal Dutch Shell и Standard Oil of California. Этот вопрос был передан в арбитражный комитет и в конечном итоге передан в суды, причем главный вопрос заключался в том, могут ли нефтяные компании позволить себе более высокую заработную плату.\n\nСогласно недавним расследованиям, мексиканские дочерние компании получают еще большую прибыль, чем нефтяные компании в США, но все равно отказываются прийти к соглашению с рабочими. Похоже, что они пользуются поддержкой влиятельных региональных силовиков и считают себя выше закона."
 mexico.16.a:0 "Возмутительно! Эта эксплуатация неэтична и должна прекратиться!"
 mexico.16.b:0 "Это капитализм."
 mexico.17.title:0 "Троцкий прибыл"
 mexico.17.desc:0 "Изгнанный из Советского Союза за противодействие подъему Сталина, обвиненный во всевозможных проблемах от военных неудач до промышленных аварий и изгнанный из страны в страну политическим давлением, Лев Троцкий, коммунистический революционер и автор, прибыл в Мексику после путешествия из Норвегии на нефтяном танкере."
 mexico.17.a:1 "Мы не сталинские марионетки, дайте ему убежище."
 mexico.17.b:1 "Выдайте его в Советский Союз, чтобы он предстал перед судом за свои преступления."
 mexico.17.c:0 "Он гений организации, пригласи его в правительство."
 mexico_extradited_trotsky:0 "Выдал Троцкого"
 mexico_communist_menace:0 "Коммунистическая угроза"
 mexico_snubbed_stalin:0 "Сталина порезали"
 mexico_trotskyite_wreckers:0 "Троцкистские разбойники"
 flag_mexico_invited_trotsky_to_government:0 " Троцкого пригласили войти в правительство"
 flag_trotsky_dead:0 " Троцкий был убит сталинскими агентами"
 mexico.18.title:0 "Избирательная кампания началась"
 mexico.18.desc:0 "Избирательная кампания следующего президента должна начаться в ближайшие дни. Конституционная реформа 1933 года была введена в ответ на гнев по поводу идеи Кальеса стать президентом на второй срок, и после прямого убийства предшественника Кальеса, Альваро Обрегона, который стремился к такому второму сроку. Эта реформа не позволяет избранному должностному лицу служить дважды, даже если он был только временным или временным смотрителем. Это помогает предотвратить повторение Порфириато, в котором диктатор Порфирийо Диас отбывал семь сроков за тридцатилетний период и вдохновил мексиканскую революцию 1910 года, погрузив страну в десятилетие гражданской борьбы.\n\nЭтот закон имеет преимущество в том, что он затрудняет поддержание сетей патронажа за пределами партии, но также предотвращает прямую подотчетность должностных лиц перед избирателями, поскольку они перейдут на другой уровень управления после своего срока полномочий, что делает их зависимыми от патроната внутри партии."
 mexico.18.a:0 "Эта конституционная реформа необходима для стабильности страны."
 mexico.18.b:0 "Смешно![Root.GetLeader] Он знает, что будет служить на второй срок!"
 mexico.19.title:0 "[Root.GetRulingParty] Преемник"
 mexico.19.desc:0 "Преемником для [Root.GetLeader] Обсуждается внутри партии. Конкурентоспособные выборы все еще находятся на шаткой почве в Мексике. [Root.GetRulingPartyLong]В координации с армией и силами безопасности, несомненно, победит на всеобщих выборах."
 mexico.19.a:0 "Франсиско Мугика, революционный генерал и социальный реформатор."
 mexico.19.b:0 "Мануэль Авила Камачо, начальник штаба ветеранов."
 mexico.19.c:0 "Сатурнино Седильо, правый каудильо."
 mexico.19.d:0 "Хуан Андреу Алмазан, правый бизнесмен."
 mexico.19.e:0 "Висенте Ломбардо, радикальный профсоюзный деятель."
 mexico.19.f:0 "Франсиско Мугика, революционный генерал и социальный реформатор."
 mexico.19.g:0 "Мануэль Авила Камачо, начальник штаба ветеранов."
 mexico.19.h:0 "Хуан Андреу Алмазан, правый бизнесмен и генерал."
 mexico.19.i:0 "Висенте Ломбардо, радикальный профсоюзный деятель."
 mexico.19.j:0 "Франсиско Мугика, революционный генерал и социальный реформатор."
 mexico.19.k:0 "Дионисио Энсина, сторонник сталинской партии."
 mexico.19.l:0 "Эрнан Лаборд, лидер троцкистской партии."
 mexico.19.m:0 "Лев Троцкий, герой Октябрьской революции."
 mexico.19.n:0 "Сатурнино Седильо, революционный генерал и кандидат преемственности."
 mexico.19.o:0 "Хуан Андреу Алмазан, правый бизнесмен и революционный генерал."
 mexico.19.p:0 "Хесус Деголладо Гизар, генерал Кристеро."
 mexico.19.q:0 "Сальвадор Абаскаль, лидер жесткого синархизма."
 mexico.19.r:1 "Валентин Кампа, железнодорожный синдикалист, близкий к Лаборде."
 mexico.20.title:0 "Хуан Андреу отказался от выборов"
 mexico.20.desc:0 "Правый бизнесмен и революционный генерал Хуан Андреу Алмазан осудил результаты недавних выборов. Он утверждает, что его поддержка была более значительной и что [Root.GetLeader] Выиграл только благодаря манипулированию результатом. Хотя это может быть правдой, Хуан Андреу, безусловно, ведет себя как больной неудачник. Он отправился в добровольное изгнание в Америку и пытается организовать попытку государственного переворота. [Root.GetRulingPartyLong]. Оставаться в хороших отношениях с Америкой было бы разумно."
 mexico.20.a:0 "Давай, беги к Янкису."
 mexico.21.title:0 "Мексика экстрадирует Троцкого"
 mexico.21.desc:0 "Несмотря на то, что несколько месяцев назад мексиканское правительство обещало ему убежище, по прибытии в страну Лев Троцкий был арестован государственной службой безопасности. [From.GetRulingPartyLong] Он немедленно вернулся в Советский Союз, чтобы предстать перед судом за многочисленные преступления против революционного государства.[From.GetLeader] Он также выразил надежду, что в будущем Мексика и Советский Союз смогут установить более тесные отношения."
 mexico.21.a:0 "Выбить из него признание и застрелить! Позвони генерал-майору Блохину!"
 mexico.22.title:0 "Лев Троцкий возвращается в СССР"
 mexico.22.desc:0 "После роста антисталинистских настроений в Советском Союзе правящая клика этой страны решила отозвать Троцкого из ссылки и поставить его своим номинальным главой на вершину правительства. Наши сотрудники разведки предполагают, что он будет в значительной степени марионеткой других сил внутри России, но Лев Троцкий непреклонен в возвращении на родину Октябрьской революции."
 mexico.22.a:0 "Дасвидания."
 flag_trotsky_has_returned_to_ussr_from_mexico:0 " Троцкий вернулся в СССР"
 mexico.23.title:0 "Неограниченная подводная война"
 mexico.23.desc:0 "С защитой вражеского конвоя, растянутой до предела, и нашими подводными лодками, бродящими по океанам без помех, мы можем уничтожить изолированные торговые суда почти по желанию. Наши капитаны подводных лодок стали называть это «Счастливые времена». Есть много соблазнительных целей на выбор, таких как нейтральные мексиканские нефтяные танкеры. Наши адмиралы просят разрешения на использование этих танкеров, хотя внешнеполитическое ведомство предупреждает, что это может иметь негативные последствия для отношений с Мексикой."
 mexico.23.a:0 "Торговля с нашими врагами равносильна открытой войне."
 mexico.23.b:0 "Лучше не нажить больше врагов, чем нам нужно."
 mexico.24.title:0 "Нападения немецких подводных лодок"
 mexico.24.desc:0 "Мексиканские нефтяные танкеры «Potrero del Llano» и «Faja de Oro» были отправлены на дно Карибского моря немецкими волчьими стаями, действующими в соответствии с доктриной «неограниченной подводной войны». Нападение на нейтральные суда является актом войны. Мы будем иметь право атаковать немецкие суда, с которыми мы сталкиваемся в море.\n\nМы также должны рассмотреть вопрос о присоединении к американской фракции, которая борется с немцами. Это поставит янки в наш долг и покажет миру, что Мексика является международным игроком."
 mexico.24.a:0 "Ты получишь то, что придет, [From.GetLeader]."
 mexico.24.b:0 "Что мы можем сделать?"
 mexico.25.title:0 "Россия ищет альянс"
 mexico.25.desc:0 "[From.GetLeader] Германия стремится присоединиться к войне против Германии после того, как немецкая политика неограниченной подводной войны привела к тому, что подводные лодки потопили несколько нейтральных мексиканских нефтяных танкеров, плавающих у побережья Мексики."
 mexico.25.a:0 "Каждая мелочь помогает."
 mexico.25.b:0 "Мы, конечно, можем найти лучших союзников, чем мексиканцы."
 mexico.26.title:0 "Мексика присоединяется к [From.GetFactionName]"
 mexico.26.desc:0 "[From.GetLeader] Он приветствовал предложение президента Мексики о поддержке в войне против Германии. Немецкие волчьи стаи недавно потопили нейтральные мексиканские нефтяные танкеры «Potrero del Llano» и «Faja de Oro», акт войны, приведший к гибели гражданского населения, и мексиканское правительство заявило о своем желании увидеть, как немецкая подводная деятельность в Карибском бассейне закончилась раз и навсегда.\n\nМексиканское правительство в течение некоторого времени добивается большего признания со стороны мировых держав, и они считают, что оказывая поддержку Америке и Соединенным Штатам. [From.GetFactionName] Они докажут, что являются международным игроком."
 mexico.26.a:0 "Мексика вполне в праве пойти на войну за это."
 mexico.26.b:0 "Есть ли у России армия?"
 mexico.26.c:0 "Нападение на нейтральное судоходство является тяжким преступлением по законам войны."
 mexico.27.title:0 "Фирмасимам Константиам"
 mexico.27.desc:0 "Папа Пий XI издал папскую энциклику, посвященную ситуации в Мексике. В то время как «Кристиада» была решена за столом переговоров, и открытое кровопролитие было прекращено, Церковь все еще обеспокоена направлением, в котором движется Мексика.\n\nЭнциклика призывает мексиканских избирателей встать на сторону религиозных кандидатов на выборах и призывает мексиканские религиозные партии, такие как Католическая акция, решать социальные проблемы, такие как бедность, чтобы предотвратить более революционное насилие."
 mexico.27.a:0 "Хорошо, что антицерковное насилие закончилось."
 mexico.27.b:0 "Суеверная пропаганда, не допускайте публикации этой измены!"
 mexico.28.title:0 "Религиозное восстание"
 mexico.28.desc:0 "Наши нападки на предательскую Церковь, очевидно, не были осуществлены с достаточной силой. Предатели были заняты тем, что использовали свободу, которую мы им дали, чтобы организовать попытку государственного переворота. Вспоминая тщетную войну Кристеро, которую мы справедливо победили много лет назад, эти суеверные дураки подняли свои крестовые знамена и сплотились за лжесвященниками и теперь стремятся отменить прогресс, который мы делаем в направлении модернизации."
 mexico.28.a:0 "Мы должны были уничтожить эту измену раньше!"
 mexico.29.title:0 "Вторая Критиада"
 mexico.29.desc:0 "Силы Церкви и Революции вновь вступили в конфликт в Мексике. Правительство возобновляет нападения на Церковь, а католические партии и общественные движения начинают вооруженное восстание, чтобы захватить контроль над Мексикой. Ополчения Cristero реформируются после десятилетия бездействия, дополненного перебежчиками из федеральных вооруженных сил. Они захватили несколько сельских штатов и используют их в качестве базы для работы.\n\nПервая «Кристиада» завершилась урегулированием, согласованным между высокопоставленными революционными и церковными чиновниками благодаря посредничеству американского правительства, но вполне вероятно, что это насилие закончится только полным уничтожением одной из воюющих сторон."
 mexico.29.a:0 "Легко будет забивать доверчивых идиотов во главе со старческими священниками."
 mexico.29.b:0 "Да здравствует Христос Царь и благословенная Мария Гваделупская!"
 mexico.29.c:0 "Ситуация в Мексике кажется слишком сложной, чтобы ее мог понять кто-то извне."
 mexico.30.title:0 "Атеистическое восстание"
 mexico.30.desc1:0 "Нечестивые люди, которых мы считали побежденными, сплотились для последней, тщетной битвы против рабов Божиих. Агенты Сатаны, такие как Плутарко Кальес и его тиранические «революционные» приспешники, вытекают из своих логов зла, вооруженных винтовками и штыками, чтобы осквернить Верных. Мы должны положить конец этому нападению на Тело Христово, иначе работа, которую мы проделали, чтобы сохранить жизнь и усилить пламя благочестия, закончится, и двадцать веков знания законов нашего Искупителя и Царя будут забыты."
 mexico.30.desc2:0 "Нечестивые люди, которых мы считали побежденными, сплотились для последней, тщетной битвы против рабов Божиих. Агенты Сатаны, такие как Висенте Ломбардо и его тиранические «революционные» приспешники, вытекают из своих логов зла, вооруженных винтовками и штыками, чтобы осквернить Верных. Мы должны положить конец этому нападению на Тело Христово, иначе работа, которую мы проделали, чтобы сохранить жизнь и усилить пламя благочестия, закончится, и двадцать веков знания законов нашего Искупителя и Царя будут забыты."
 mexico.30.a:0 "«Вот твой час и сила тьмы»."
 mexico.31.title:0 "Вторая Мексиканская революция"
 mexico.31.desc:0 "Силы Церкви и Революции вновь вступили в конфликт в Мексике. С усилением католических партий и общественных движений, секуляристские силы начинают вооруженное восстание, чтобы вернуть контроль над правительством. «Красные бригады» реформируются после десятилетия бездействия, в то время как перебежчики из федеральных вооруженных сил сплачиваются в штатах, все еще контролируемых антицерковными губернаторами.\n\n«Кристиада» завершилась урегулированием, согласованным между высокопоставленными революционными и церковными чиновниками благодаря посредничеству американского правительства, но, похоже, это насилие закончится только полным уничтожением одной из воюющих сторон."
 mexico.31.a:0 "Да здравствует Христос Царь и благословенная Мария Гваделупская!"
 mexico.31.b:0 "Легко будет забивать доверчивых идиотов во главе со старческими священниками."
 mexico.31.c:0 "Ситуация в Мексике кажется слишком сложной, чтобы ее мог понять кто-то извне."
 mexico.32.title:0 "Бунты в \"Zoot Suit\""
 mexico.32.desc:0 "Латиноамериканская молодёжь в экстравагантной одежде — «зут-костюмах» — стала объектом расовых беспорядков в приграничных городах на юге, вызванных сенсационными публикациями о смерти подростка в Лос-Анджелесе. Девять молодых мексикано-американцев были признаны виновными в убийстве по этому делу.\n\nРазведка собрала доклады, утверждающие, что носители зут-костюмов на самом деле являются фашистскими агентами, сотрудничающими с ультракатолическими синаркистами в Мексике ради поддержки японо-германского вторжения в Америку."
 mexico.32.a:0 "Звучит довольно маловероятно. Сколько мы платим этим агентам?"
 mexico.32.b:0 "Арестуйте зоотипистов в любом случае. Беспорядки представляют угрозу для наших военных усилий."
 mexico.33.title:0 "Бунты в \"Zoot Suit\""
 mexico.33.desc:0 "Латиноамериканская молодёжь в экстравагантной одежде — «зут-костюмах» — стала объектом расовых беспорядков в приграничных городах к северу от нас, вызванных сенсационными публикациями о смерти подростка в Лос-Анджелесе. Девять молодых мексикано-американцев были признаны виновными в убийстве по этому делу.\n\nАмериканская разведка собрала доклады, утверждающие, что носители зут-костюмов на самом деле являются фашистскими агентами, сотрудничающими с ультракатолическими синаркистами в Мексике ради поддержки японо-германского вторжения в Америку."
 mexico.33.a:0 "Синаркисты представляют угрозу для Америки и Мексики."
 mexico.33.b:0 "Они просто дети! Это несправедливость!"
 mexico.34.title:0 "Мексиканская биржа ресурсов"
 mexico.34.desc:0 "[From.GetLeader] Германия заключила торговую сделку, если [Root.GetLeader] Мы согласимся отправить в Мексику образцы новейших легких и средних танков, которые мы разработали. Это, кажется, первый этап в более тесных российско-германских отношениях, так что даже если это не служит военной цели, это может быть полезно для нас геополитически. Конечно, эти современные конструкции танков могут попасть в руки будущего врага."
 mexico.34.a:0 "Это соглашение поможет и Германии, и Мексике."
 mexico.34.b:0 "Американцы, скорее всего, в конечном итоге получат любые проекты, которые мы отправим."
 mexico.35.title:0 "Немецкие танковые конструкции"
 mexico.35.desc:0 "[From.GetLeader] Мы договорились предоставить нам лицензии на новейшие немецкие легкие и средние танки. Надеюсь, это послужит первым этапом более тесных мексикано-германских отношений, а также полезным военным знанием."
 mexico.35.a:0 "Очень хорошо."
 mexico.36.title:0 "Германия отказалась от предложения"
 mexico.36.desc:0 "Ссылаясь на возможность попадания передовых танков Германии в руки противника, [From.GetLeader] Мы отказались от предложения по обмену ресурсами. Нам придется разрабатывать отечественные танки или платить немцам за их лицензии."
 mexico.36.a:0 "Проклятье."
 mexico.40.title:0 "Операция Just Cause Succeeds"
 mexico.40.desc:0 "Наше внезапное нападение на базу Янки в Панаме увенчалось успехом. Мы изгнали империалистов и теперь ждем ответа дряхлой Северной империи. Если они решат броситься на нашу оборону, мы заставим их заплатить."
 mexico.40.a:0 "Центроамерика будет защищена от американской агрессии."
 mexico.41.title:0 "[From.GetAdjective] Захват Панамского канала"
 mexico.41.desc:0 "Диктатор Мексики, [From.GetLeader]У него было мужество начать крупную атаку на наши силы Панамского канала с близлежащих полигонов. Их операция «Правое дело» была успешной, и наши войска снова в замешательстве. Мексиканцы не пересекают континентальную часть Соединенных Штатов, поэтому это не было прелюдией к общему вторжению, но нападение ослабило нашу способность проецировать силу по всему миру и унизило нас на международной арене."
 mexico.41.a:0 "К сожалению, у нас есть более насущные проблемы. Эмбарго должно быть достаточным."
 mexico.41.b:0 "Наш суверенитет находится под угрозой. Это требует военного ответа."
 mexico.42.title:0 "Операция Just Cause Fails"
 mexico.42.desc:0 "Наше внезапное нападение на базу Янки в Панаме пошло наперекосяк. Возможно, мы не развернули достаточно войск, или командир был просто некомпетентен. В любом случае, мы были изгнаны империалистами и теперь ждем ответа дряхлой Северной империи. Если они решат броситься на нашу оборону, мы заставим их заплатить."
 mexico.42.a:0 "Центроамерике по-прежнему угрожает американская агрессия."
 mexico.43.title:0 "[From.GetAdjective] Нападение на Панамский канал"
 mexico.43.desc:0 "Диктатор Мексики, [From.GetLeader]У него было мужество начать крупную атаку на наши силы Панамского канала с близлежащих полигонов. К счастью, нашим храбрым войскам удалось отбить свою операцию «Правое дело» и отбросить захватчиков. Мексиканцы не пересекают континентальную часть Соединенных Штатов, так что это не было прелюдией к общему вторжению, но нападение показало, что мы больше не хозяева Америк, унижая нас на международной арене."
 mexico.43.a:0 "К сожалению, у нас есть более насущные проблемы. Эмбарго должно быть достаточным."
 mexico.43.b:0 "Наш суверенитет находится под угрозой. Это требует военного ответа."
 mexico.44.title:0 "Мексика захватила Панамский канал"
 mexico.44.desc1:0 "После этого [From.GetAdjective] Вторжение в американскую военную базу на Панамском канале, войска по обе стороны границы были мобилизованы для войны. Хотя мексиканцы нанесли первый удар, захватив стратегически важную зону канала, американцы, похоже, стремятся начать наступление, чтобы наказать своего наглого соседа. «Пресс-центр» осуждает [From.GetRulingPartyLong] Как клика бандитов, не уважающих международное право и призывающих к смене режима.\n\nЕсли вспыхнет вторая мексикано-американская война, она будет вестись на суровой и неумолимой местности гор и пустынь, с гораздо большими потерями, чем небольшая потасовка в 1847 году, предшествовавшая мексиканской Сессии."
 mexico.44.desc2:0 "Доклады [From.GetAdjective] Войска, входящие на американскую военную базу на Панамском канале, были подтверждены [From.GetLeader]Кто утверждает, что действовал для сохранения [From.GetAdjective] Интересы в Centroamérica после внутренней турбулентности в Соединенных Штатах. The [From.GetRulingPartyLong] Министерство пропаганды потребовало, чтобы все оставшиеся американские солдаты в этом районе отказались от оружия и уважали «мирную передачу власти» в зоне канала. Американский президент подвергся жесткой критике со стороны «головокружительной прессы» за то, что он не боролся более жестко, чтобы сохранить национальные интересы в этом районе, и за неспособность следить за ситуацией. [From.GetAdjective] Нападение с общей мобилизацией против [From.GetNameDef]."
 mexico.44.a:0 "Приходи и возьми его!"
 mexico.44.b:0 "Возмутительная атака на суверенитет Америки."
 mexico.44.c:0 "Маленький удачливый... Мексика?"
 mexico.45.title:0 "[From.GetAdjective]Американские пограничные столкновения"
 mexico.45.desc1:0 "Американские войска на южной границе были приведены в состояние повышенной готовности, как это было недавно. [From.GetAdjective] Агрессия против американской военной базы на Панамском канале повышает вероятность крупномасштабной войны между двумя соседями. Хотя [From.GetLeader]Неожиданная атака провалилась, американский президент, как сообщается, решил наказать наглого южного соседа. «Пресс-центр» осуждает [From.GetRulingPartyLong] Как клика бандитов, не уважающих международное право и призывающих к смене режима.\n\nЕсли вспыхнет вторая мексикано-американская война, она будет вестись на суровой и неумолимой местности гор и пустынь, с гораздо большими потерями, чем небольшая потасовка в 1847 году, предшествовавшая мексиканской Сессии."
 mexico.45.desc2:1 "Американские войска на ее южной границе были приведены в состояние повышенной готовности, как это было недавно. [From.GetAdjective] Агрессия против американской военной базы на Панамском канале стала неожиданностью для большинства наблюдателей, хотя некоторые эксперты в Латинской Америке предупреждали о том, что [From.GetAdjective] Нападения на центральноамерические государства в конечном итоге закончились бы столкновениями с Америкой из-за противоборствующих интересов в регионе.[USA.GetLeader] После захвата канала Мексика ввела эмбарго, но в остальном воздержалась от военных действий. Такой курс может помочь примирить агрессивного [From.GetRulingPartyLong] правительства или, возможно, побудить их к дальнейшим действиям."
 mexico.45.a:0 "Приходи и возьми его!"
 mexico.45.b:0 "Возмутительная атака на суверенитет Америки."
 mexico.45.c:0 "Мексика рисковала этой игрой."
 mexico.46.title:1 "Альянс «[From.GetFactionName]»"
 mexico.46.desc:0 "Президент [From.GetLeader] из Мексики [From.GetRulingPartyLong] Объявлено о формировании нового блока наций в Западном полушарии. The [From.GetFactionName] Он заявил, что левая агитация и иностранное вмешательство будут побеждены путем создания реваншистского альянса авторитарных силовиков, которые перенаправят регион на создание сильного противовеса другим фракциям."
 mexico.47.title:1 "Альянс «[From.GetFactionName]»"
 mexico.47.desc:0 "Президент [From.GetLeader] из Мексики [From.GetRulingPartyLong] Объявлено о формировании нового блока наций в Западном полушарии. The [From.GetFactionName] Его название происходит от имени Симона Боливара, борца за независимость, который помог завоевать свободу для многих латиноамериканских стран, которые теперь объединяются в альянс. Их декларируемая цель - добиться прекращения господства на континенте старых европейских и американских империй путем создания сильных социалистических государств, связанных друг с другом экономически и дипломатически."
 mexico.46.a:0 "С верными союзниками Отечество будет непобедимо!"
 mexico.46.b:0 "Простое число не спасет этих претенциозных дураков."
 mexico.46.c:0 "Является ли это прелюдией к еще большим сражениям?"
 mexico.50.title:0 "Мексиканская поставка оружия"
 mexico.50.desc:0 "Объявив о своей поддержке нашей цели, наши идеологические кузены в [From.GetRulingPartyLong] Они послали нам партию винтовок, чтобы помочь в борьбе против нашего ненавистного врага."
 mexico.50.a:0 "[From.GetLeader] Это настоящий друг испанского народа."
 mexico.51.title:0 "Оружие потеряно"
 mexico.51.desc:0 "Моря вокруг испанского побережья патрулируются кораблями испанских лоялистов и повстанцев, итальянскими крейсерами, российскими подводными лодками и даже судами Лиги Наций, направленными для обеспечения запрета на поставки оружия, предназначенного для предотвращения распространения гражданской войны по всей Европе. Неудивительно, что наша недавняя поставка оружия была запрещена и потеряна."
 mexico.51.a:0 "Какая трата."
 mexico.52.title:1 "[MEX.GetLeader] Провозглашает Союз всех коммунистических движений"
 mexico.52.desc_not_trotsky:1 "На конгрессе в [MEX.GetFactionName], [MEX.GetLeader] Он провозгласил превосходство интерпретации Маркса, Энгельса и Ленина Троцким над ошибочными интерпретациями революции, такими как сталинизм. С крахом 3-го Интернационала (также известного как Коминтерн) коммунистические лидеры во всем мире приглашаются подвергнуться самокритике. После признания своей политической слепоты по отношению к истинному революционному духу они были приглашены в 4-й Интернационал и помогли в наступлении мировой социалистической революции."
 mexico.52.desc_trotsky:1 "На конгрессе в [MEX.GetFactionName], [MEX.GetLeader] Провозгласил превосходство своей интерпретации Маркса, Энгельса и Ленина над ошибочными интерпретациями теорий революции, такими как сталинизм. С распадом 3-го Интернационала (также известного как Коминтерн) все коммунистические лидеры приглашаются к самокритике. После признания своей политической слепоты по отношению к истинному революционному духу они были приглашены в 4-й Интернационал и помогли в наступлении мировой социалистической революции."
 mexico.52.a:1 "Наконец-то мы видим свои ошибки."
 mexico.52.b:1 "Наша интерпретация видения Маркса является единственно законной."
 mexico.53.title:1 "[MEX.GetLeader] Провозглашает Союз всех коммунистических движений"
 mexico.53.desc:1 "Мы долго верили, что нынешние лидеры распространяют истинное толкование идей Маркса, Энгельса и Ленина, но теперь их заставили пройти «самокритику» и публично признать, что троцкистское толкование Ленина — единственно верный путь к победе социализма. В результате мы внезапно оказались в изоляции. Наш союз распался, и перед нами стоит тяжёлая дилемма: признать правоту троцкистских взглядов или остаться в одиночестве и вступить в конфликт с [MEX.GetFactionName]."
 mexico.53.a:1 "Наконец-то мы видим свои ошибки."
 mexico.53.b:1 "Наша интерпретация видения Маркса является единственно законной."
 mexico.54.title:1 "[MEX.GetLeader] Требует нашего выхода из Карибского бассейна"
 mexico.54.desc:1 "В страстной речи продолжительностью более 4 часов, [MEX.GetLeader] Мы потребовали, чтобы мы оставили все наши колонии в Карибском регионе, поскольку они, по его словам, являются «наиболее заметными доказательствами нашего империалистического угнетения над регионом». В то время как некоторые утверждают, что мы не можем позволить себе разозлить Мексику в данный момент, более решительные советники подчеркивают, что мы полностью способны противостоять им и что наша территориальная целостность никогда не должна подвергаться опасности."
 mexico.54.a:1 "Согласен с его требованиями."
 mexico.54.b:1 "Мы не ведем переговоры с революционерами!"
 mexico.55.title:0 "[From.GetNameDef] Отойдите от Карибского моря!"
 mexico.55.desc:0 "Лицом к лицу со своими империалистическими противоречиями, [From.GetAdjective] Правительство деколонизировало свои владения в Карибском бассейне. Это великий день для рабочих, но борьба еще далека от завершения. Этот процесс не привел к полной свободе трудящихся, поскольку они по-прежнему находятся под деспотическими институтами."
 mexico.55.a:0 "Борьба за свободу мирового пролетариата продолжается."
 mexico.56.title:0 "[From.GetNameDef] Отказ от наших требований"
 mexico.56.desc:0 "В высокомерном ответе, типичном для империалистических угнетателей, [From.GetNameDef] отверг наши требования ослабить свою жадную хватку на Карибах! Теперь их пролетариат должен увидеть противоречия собственного правительства и понять, что трудится на тиранов."
 mexico.56.a:0 "Они потерпят гнев вооружённого пролетариата!"
 mtg_usa_civil_war_fascists.1.t:1 "Серебряный легион протестует"
 mtg_usa_civil_war_fascists.1.desc:1 "Возглавляемая и организованная Серебряным легионом Америки, ряд центристских и правых организаций сегодня прошли через столицу в одном из крупнейших демонстраций, которые Вашингтон видел до сих пор. Другие собрания были зарегистрированы по всей стране.\n\nМарш завершился перед Капитолием, где толпа потребовала, чтобы «коммунисты в Конгрессе собрались» предстали перед судом «Большого народного жюри» за измену Соединенным Штатам.\n\nВ частном порядке некоторые члены администрации разделяют более законные опасения протестующих по поводу верховенства закона и соблюдения конституционных сдержек и противовесов. Другие, однако, предлагают жесткую линию против них. Поскольку в ближайшие недели запланировано больше демонстраций, мы должны сделать выбор быстро."
 mtg_usa_civil_war_fascists.1.a:1 "Мы должны избегать эскалации ситуации."
 mtg_usa_civil_war_fascists.1.b:1 "Мы не должны поклоняться толпе."
 mtg_usa_civil_war_fascists.2.t:1 "Протесты перерастают в насилие"
 mtg_usa_civil_war_fascists.2.desc:1 "Напряженность нарастала на очередном протесте в столице сегодня, так как еще один массовый протест был назван, среди прочего, Серебряным легионом Америки. Повторяя свои более ранние требования о том, чтобы ряд членов Конгресса были арестованы и переданы им, протестующие выдвинули ультиматум за час до того, как они штурмуют Капитолий и силой уберут людей из своего списка.\n\nКогда ультиматум прошел без реакции, небольшие отряды Серебряных легионеров бросились на линию Капитолийской полиции. Развивалась кровавая ближняя лихорадка, которая быстро распространилась на других протестующих. Когда полиция была занята, другие группы проникли в здания. Перебираясь из комнаты в комнату, им удалось найти нескольких предполагаемых жертв, но вооруженная полиция не позволила им уйти. В результате перестрелки несколько нападавших были убиты, а двое конгрессменов получили ранения.\n\nУродливое настроение улеглось над столицей, и обе стороны обвиняют друг друга в эскалации. Следующие несколько недель покажут, был ли инцидент, теперь известный как Битва за Капитолийский холм, концом протестов или просто прелюдией к еще большему конфликту."
 mtg_usa_civil_war_fascists.2.a:1 "Кровь была пролита. Мы должны ожидать, что еще больше будет пролито до того, как это закончится."
 mtg_usa_civil_war_fascists.10.t:1 "Оружейный рейд"
 mtg_usa_civil_war_fascists.10.desc:1 "Армейский арсенал США в [GetCSAState] Вчера он подвергся нападению и был ненадолго захвачен. Малому отряду охранников противостояла большая вооруженная толпа, требовавшая ключи от кладовых. Когда прибыло подкрепление из близлежащего гарнизона, нападавшие уже отступили, неся с собой большое количество стрелкового оружия.\n\nУчитывая, что охранники были полностью невредимы, и подкреплениям потребовалось подозрительно много времени, некоторые в правительстве предполагают, что это была скоординированная атака."
 mtg_usa_civil_war_fascists.10.a:1 "Очень тревожные новости."
 mtg_usa_civil_war_fascists.11.t:1 "Государство вмешивается в сбор налогов"
 mtg_usa_civil_war_fascists.11.desc:1 "Правительство [GetCSAState] Он направил полицию штата, чтобы закрыть все операции по сбору и оценке налогов в штате. Кроме того, губернатор объявил любые налоги и пошлины на табак и алкоголь недействительными и обязал предприятия не платить никаких таможенных пошлин в Казначейство.\n\n Однако он также распорядился, чтобы предприятия и частные лица продолжали подавать налоги в государственные налоговые органы, включая налоги, которые в противном случае были бы причитающимися казначейству."
 mtg_usa_civil_war_fascists.11.a:1 "Жадность."
 mtg_usa_civil_war_fascists.12.t:1 "Генерал [From.GetName] Отставка"
 mtg_usa_civil_war_fascists.12.desc:1 "Ссылаясь на плохое здоровье, генерал [From.GetName] Он подал в отставку. Однако секрет заключается в том, что он в частном порядке выразил глубокую озабоченность по поводу политического направления страны, даже зайдя так далеко, что заявил, что новая гражданская война в США уже не за горами.\n\nВместо того, чтобы думать о своей лояльности, он, кажется, решил не брать в руки оружие против своих сограждан."
 mtg_usa_civil_war_fascists.12.a:1 "Его будет не хватать."
 mtg_usa_civil_war_fascists.13.t:1 "Губернатор мобилизовал Национальную гвардию"
 mtg_usa_civil_war_fascists.13.desc:1 "Губернатор [usa_ng_mobilized.GetName] Он объявил, что мобилизовал Национальную гвардию штата для того, что он назвал «продолжительным периодом тренировок и учений». Военное ведомство утверждает, что не знает о каких-либо запланированных маневрах в Сирии. [usa_ng_mobilized.GetName]. \n\n Кроме того, похоже, что отряды Национальной гвардии взяли с собой полный набор припасов и боевых патронов, когда они вышли на марш, что вызвало вопросы о том, к чему они готовятся."
 mtg_usa_civil_war_fascists.13.a:1 "Очень тревожно."
 mtg_usa_civil_war_fascists.14.t:1 "Солдаты пустыни"
 mtg_usa_civil_war_fascists.14.desc:1 "Из нескольких подразделений поступили тревожные сообщения о том, что солдаты не вернулись из отпуска или просто покинули свои посты. Возможно, еще более тревожным является тот факт, что многие из этих солдат прибыли из тех же географических районов, и многие получили почту из дома всего за несколько дней до того, как они исчезли.\n\nПохоже, что предпринимаются согласованные усилия по возвращению солдат из южных штатов домой."
 mtg_usa_civil_war_fascists.14.a:1 "Такая нелояльность."
 mtg_usa_civil_war_fascists.15.t:1 "Индустриалисты перевели оружейный завод"
 mtg_usa_civil_war_fascists.15.desc:1 "Ссылаясь на политический климат, неподходящий для бизнеса, владелец крупной оружейной компании сегодня объявил, что перенесет производство в более подходящее место. Он особо отметил рост профсоюзной активности, который, по его словам, снизил производство и снизил доверие инвесторов. Вместо этого компания построит новый завод в неизвестном месте на юге штата."
 mtg_usa_civil_war_fascists.15.a:1 "Это не должно иметь большого значения."
 mtg_usa_civil_war_fascists.16.t:1 "Индустриалист перешел на гражданский завод"
 mtg_usa_civil_war_fascists.16.desc:1 "Согласно конфиденциальной поддержке Министерства торговли, все большее число промышленников в северных частях США планируют перенести производство в другие штаты после того, как профсоюзы вызвали ряд забастовок, требуя более высокой заработной платы и более коротких рабочих дней. В деловом сообществе установился климат глубокого беспокойства, и многие утверждают, что становится все труднее получать разумную прибыль в штатах, которые не будут действовать для подавления этих забастовщиков."
 mtg_usa_civil_war_fascists.16.a:1 "Абсурдная и антиамериканская позиция."
 mtg_usa_civil_war_fascists.20.t:1 "Сецессия!"
 mtg_usa_civil_war_fascists.20.desc:1 "Сегодня в 8 утра специальный посланник [CSAcapital.GetName] Приехал в Белый дом, чтобы передать президенту [USA.GetLeader] нота из Государственного законодательства, объявляющая, что [CSAcapital.GetName] Он больше не будет считать себя частью республики. Утверждая, что это фундаментальное право любого цивилизованного народа, и широко цитируя Декларацию независимости, в записке также подчеркнуто говорилось, что мирное отделение отвечает интересам всех и что новое государство не желает ничего больше, чем вести свои собственные дела как добрый сосед. [USA.GetNameDef]."
 mtg_usa_civil_war_fascists.20.a:1 "Назовите это так: измена."
 mtg_usa_civil_war_fascists.21.t:1 "Дом разделённый"
 mtg_usa_civil_war_fascists.21.desc:1 "Через несколько часов после того, как первое государство разорвало свои связи с [USA.GetNameDef]Другие последовали этому примеру с почти одинаково звучащими заявлениями. Надежды на мирное разделение были быстро разбиты, когда несколько демонстраций в пострадавших государствах в пользу продолжения членства в ЕС. [USA.GetNameDef] Пролилась кровь, и несколько федеральных чиновников подверглись нападению. В некоторых случаях сторонники президента [USA.GetLeader] Люди, которых обвиняли в недостаточном рвении к независимости, были линчеваны толпой. Временный Председатель [CSA.GetLeader] Он назвал эти события «достойными сожаления, но понятными актами гражданского возмездия против чрезмерного влияния правительства» и пообещал виновным президентские помилования, если они выступят.\n\n Он также потребовал полного вывода всех федеральных войск с территории нового государства, а также демилитаризованной зоны на границе, чтобы избежать «дальнейших недоразумений». Президент [USA.GetLeader] Он отказался даже принять эту идею и приказал военным восстановить порядок в восставших штатах."
 mtg_usa_civil_war_fascists.21.a:1 "Мы уже были здесь раньше, не так ли?"
 mtg_usa_civil_war_fascists.22.t:1 "Формы нейтрального блока"
 mtg_usa_civil_war_fascists.22.desc:1 "После начала военных действий между [USA.GetNameDef] и [CSA.GetNameDef]Ряд законодательных органов штатов приняли предложения о невмешательстве. Эти законы предписывают губернатору сохранять территориальную целостность государства и не допускать в него боевых отрядов с обеих сторон. Кроме того, они запрещают любые усилия по вербовке с обеих сторон, но, что крайне важно, не ограничивают продажу оружия и боеприпасов ни одной из сторон в конфликте при условии, что оплата производится заранее.\n\nВ документе также подчеркивается, что государства считают себя частью [USA.GetNameDef] Они не хотят создавать свое постоянное правительство."
 mtg_usa_civil_war_fascists.22.a:1 "Они, конечно, трусы, но, по крайней мере, не враги."
 mtg_usa_civil_war_fascists.22.b:0 "Они выбрали свою сторону."
 mtg_usa_civil_war_fascists.23.t:1 "Нейтральный блок растворяется"
 mtg_usa_civil_war_fascists.23.desc:1 "После окончания войны государства в нейтральном блоке объявили, что они положат конец различным законам и мерам, принятым для поддержания их нейтралитета. С этого дня боевые войска могут вновь беспрепятственно входить на свои территории. Поднятые во время войны ополченцы мирно расформировались."
 mtg_usa_civil_war_fascists.23.a:1 "В конце концов, они не стоили той цены в крови."
 mtg_usa_civil_war_fascists.201.t:0 "Волонтеры из [CSA_liberated_state.GetName]"
 mtg_usa_civil_war_fascists.201.desc:0 "Когда наши силы продвинулись в [CSA_liberated_state.GetName]Они наткнулись на большое количество сочувствующих граждан, которые долгое время питали к нам скрытые симпатии. Захваченные волной патриотического рвения, они попросили присоединиться к нашим военным."
 mtg_usa_civil_war_fascists.201.a:0 "Сформируйте их в отдельные единицы."
 mtg_usa_civil_war_fascists.201.b:0 "Интегрируйте их в армию."
 mtg_usa_civil_war_fascists.202.t:0 "Волонтеры из [USA_liberated_state.GetName]"
 mtg_usa_civil_war_fascists.202.desc:0 "Когда наши силы продвинулись в [USA_liberated_state.GetName]Они наткнулись на большое количество сочувствующих граждан, которые долгое время питали к нам скрытые симпатии. Захваченные волной патриотического рвения, они попросили присоединиться к нашим военным."
 mtg_usa_civil_war_fascists.203.t:0 "Повстанцы создают правительство сотрудничества [USA_state_government_created.GetName]"
 mtg_usa_civil_war_fascists.203.desc:0 "Группа, называющая себя [USA_state_government_created.GetName] Гражданский совет объявил, что они взяли на себя управление [USA_state_government_created.GetName] из [CSA.GetAdjective] Военные власти. Несмотря на то, что они не заявляют о своей принадлежности к продолжающемуся конфликту, они также объявили о том, что они будут применять несколько новых законов, касающихся вербовки в вооруженные силы. [CSA.GetAdjective] Военные.\n\nВ рамках этого заявления они заявили, что все делегаты Конгресса, которые еще остаются в столице, больше не представляют интересы народа. [USA_state_government_created.GetName]."
 mtg_usa_civil_war_fascists.203.a:0 "Предатели один и все."
 mtg_usa_congress_remove_state_tt:0 "Два сенатора отстранены от должности в Конгрессе.\n"
 mtg_usa_congress_add_state_tt:0 "В Конгресс войдут два сенатора. Сначала они будут §GПоддерживать правительство§!.\n"
 mtg_usa_civil_war_democrats.1.t:1 "Протесты в столице"
 mtg_usa_civil_war_democrats.1.desc:1 "Еще одна волна массовых протестов обрушилась на столицу, демонстрируя засорение всех основных дорог в здании Капитолия и вокруг него. Организованные \"Акционным комитетом по сохранению республики\" протестующие потребовали независимого расследования обвинений в коррупции и неправомерных действиях в администрации президента. [USA.GetLeader]. В частности, они потребовали от президента денонсировать Серебряный легион и публично заверить их в том, что их права как избирателей будут уважаться.\n\nПрезидент [USA.GetLeader] Он отказался комментировать этот вопрос."
 mtg_usa_civil_war_democrats.1.a:1 "Пусть протестуют, у нас есть страна, которой нужно управлять."
 mtg_usa_civil_war_democrats.2.t:1 "Десять миллионов мартов"
 mtg_usa_civil_war_democrats.2.desc:1 "По всей стране проходят регулярные акции протеста против политики президента [USA.GetLeader] Они только выросли в размерах, теперь регулярно возглавляя несколько миллионов протестующих. Сегодня более миллиона человек прошли маршем по улицам Вашингтона, причем аналогичное число зарегистрировано как минимум в девяти других местах. Это даже не учитывает меньшие марши в столицах штатов и небольших городах, которые все еще привлекали тысячи людей каждый. Протесты начались после ряда непопулярных политических решений администрации, которые, по утверждению организаторов, подрывают саму демократическую структуру республики.\n\n Там, где ранее протестующие требовали от президента дистанцироваться от более радикальных идеологий, теперь они стали требовать его немедленного отстранения от должности."
 mtg_usa_civil_war_democrats.2.a:1 "И как они предлагают обеспечить выполнение этого требования?"
 mtg_usa_civil_war_democrats.10.desc:1 "Армия США в отдаленной части [GETUSASTATE] Он подвергся нападению неизвестных сил в течение последней ночи. Небольшая группа вооруженных людей заставила нескольких охранников войти в сарай, где они были заперты. Когда солдатам удалось бежать после рассвета, они обнаружили, что оружейный склад тщательно разграблен. Похоже, что ночью злоумышленники перевезли большое количество материала в неизвестное место."
 mtg_usa_civil_war_democrats.11.t:1 "Формы гражданской милиции"
 mtg_usa_civil_war_democrats.11.desc:1 "В ходе последней серии маршей и демонстраций против политики президента [USA.GetLeader]Большое количество протестующих открыто несли оружие и носили повязки, идентифицируя их как часть растущего движения «Гражданская милиция». Когда полиция бросила им вызов, протестующие заявили, что они просто осуществляют свои права в соответствии со 2-й поправкой, но ФБР обнаружило признаки того, что эти группы не просто продвигают частную собственность на оружие.\n\nИнформаторы сообщили, что эти вооруженные группы регулярно проводят совещания и пытаются получить доступ к учебным пособиям для пехоты."
 mtg_usa_civil_war_democrats.11.a:1 "В этом нет ничего плохого."
 citizen_militia_tt:0 "Граждане в государстве формируют отряды милиции, которые станут активными, когда разразится война."
 mtg_usa_civil_war_democrats.14.t:1 "Рабочие на забастовке"
 mtg_usa_civil_war_democrats.14.desc:1 "Массовые забастовки были зарегистрированы по всей территории США, и множество профсоюзов призвали к действиям. Освобождаются только самые важные из услуг. Во многих местах вспыхнули бои между нападающими и штрейкбрехерами.\n\nКак ни странно, рабочие требуют не более высокой заработной платы или других уступок, а лишь отставки президента. [USA.GetLeader]."
 mtg_usa_civil_war_democrats.14.a:1 "Чего еще ждать от этих предателей-коммунистов?"
 mtg_usa_civil_war_democrats.15.t:1 "Промышленники передвигают оружейные заводы"
 mtg_usa_civil_war_democrats.15.desc:1 "С ростом нестабильности по всей стране многие предприниматели начали тихо искать более безопасные места для открытия магазинов. В частности, в южных штатах США наблюдается возрождение промышленного производства, а некоторые компании перемещают целые заводы по всей стране."
 mtg_usa_civil_war_democrats.15.a:1 "Они наиболее приветствуются."
 mtg_usa_civil_war_democrats.16.t:1 "Экономическая миграция"
 mtg_usa_civil_war_democrats.16.desc:1 "После десятилетий миграции из сельской местности в промышленные центры на северо-востоке последние правительственные отчеты показали резкий разворот. Все больше компаний гражданского сектора переезжают в южные штаты и осваиваются в ранее слаборазвитых регионах, принося с собой сотни новых рабочих мест. Многие владельцы фабрик ссылаются на «враждебный» климат на севере, который страдает от регулярных забастовок и все более агрессивных профсоюзов."
 mtg_usa_civil_war_democrats.16.a:1 "Это говорит о том, что политика президента работает."
 mtg_usa_civil_war_democrats.20.t:1 "Бостонское восстание"
 mtg_usa_civil_war_democrats.20.desc:1 "Серия протестов против президента наконец достигла кульминации. Вчера, после того как марш достиг места назначения в центре Бостона, протестующие не разошлись, чтобы отправиться домой. Вместо этого они разбились на более мелкие группы и захватили жизненно важные места по всему городу. К вечеру они полностью контролировали город. Полиция в значительной степени перешла к протестующим, и губернатор Массачусетса отказался отправить туда Национальную гвардию.\n\n«Бостонский гражданский комитет» взял под свой контроль город и, как сообщается, сотрудничает с повстанцами. Другие штаты Новой Англии приняли предложения о поддержке, заявив, что они больше не считают себя связанными каким-либо законом, подписанным президентом. [USA.GetLeader]. Вместо этого они призывают все другие правительства штатов в Соединенных Штатах объявить президента свергнутым, Конгресс распущен и провести новые выборы.\n\nПока часть военных остается на нашей стороне, целые формирования сообщили своим офицерам, что не будут подчиняться приказам подавить восстание."
 mtg_usa_civil_war_democrats.20.a:1 "Никто не будет воспринимать их всерьез. Это взорвется."
 mtg_usa_civil_war_democrats.21.t:1 "Восстание распространилось на западное побережье"
 mtg_usa_civil_war_democrats.21.desc:1 "Правительства штатов Калифорния, Орегон и Вашингтон заявили о своей поддержке правительства Бостона и приказали всем федеральным офицерам либо уйти в отставку со своих постов, либо немедленно покинуть территории этих штатов. Хотя есть сообщения о некоторых разрозненных очагах сопротивления этому шагу, он, похоже, в значительной степени пользуется поддержкой населения."
 mtg_usa_civil_war_democrats.21.a:1 "Мы по-прежнему удерживаем центр страны."
 mtg_usa_civil_war_democrats.22.t:1 "Средний Запад заявил о поддержке правительства"
 mtg_usa_civil_war_democrats.22.desc:1 "Поскольку все больше и больше штатов отказываются следовать указаниям законного правительства, губернаторы Огайо, Миссури, Висконсина, Иллинойса, Индианы и Мичигана совместно заявили, что они не потерпят никакого крамольного поведения среди своего населения. Они утверждают, что новая гражданская война приведет к опасному ослаблению США перед лицом иностранной агрессии."
 mtg_usa_civil_war_democrats.22.a:1 "И они должны."
 mtg_usa_civil_war_democrats.23.t:1 "Восточное побережье присоединяется к восстанию"
 mtg_usa_civil_war_democrats.23.desc:1 "Повстанческие силы, марширующие на юг от Новой Англии, были широко встречены как освободители в Мэриленде, Нью-Йорке, Пенсильвании и Нью-Джерси, а местные губернаторы приказали полиции штата и национальной гвардии не вмешиваться. Любые попытки сплотить лояльные силы вокруг столицы не увенчались успехом. Президент [USA.GetLeader] Он был эвакуирован из Вашингтона всего за несколько часов до того, как повстанческие силы закрыли все выходы. Его автомобильная колонна добралась до Ричмонда, штат Вирджиния, и, вероятно, продолжит движение дальше на юг."
 mtg_usa_civil_war_democrats.23.a:1 "Мы вернёмся."
 mtg_usa_civil_war_democrats.25.t:1 "Северо-Западный Сецедес"
 mtg_usa_civil_war_democrats.25.desc:1 "Губернаторы Вайоминга, Айдахо и Монтаны совместно объявили о создании правительства Бостона. Повстанческие силы из Вашингтона и Орегона уже связались со своими боевыми товарищами в штатах."
 mtg_usa_civil_war_democrats.25.a:1 "В любом случае, это в основном пустая земля."
 mtg_usa_civil_war_democrats.26.t:1 "Северо-Запад заявил о готовности правительства"
 mtg_usa_civil_war_democrats.26.desc:1 "Законодательные органы штатов Вайоминг, Айдахо и Монтана приняли ряд законов о борьбе с мятежами, предоставив местным правоохранительным органам широкие полномочия арестовывать и задерживать любого, кто выступит против федерального правительства на время нынешней чрезвычайной ситуации. Однако присутствие повстанческих сил в соседних Вашингтоне и Орегоне потребует быстрой поддержки со стороны лояльных сил."
 mtg_usa_civil_war_democrats.26.a:1 "Это стратегические территории."
 mtg_usa_civil_war_democrats.27.t:1 "Юго-Западный Сецедес"
 mtg_usa_civil_war_democrats.27.desc:1 "Невада, Аризона, Юта, Нью-Мексико и Колорадо объявили о восстании. Чиновники штата, которые отказались выполнять приказы о допуске повстанцев из Калифорнии, были немедленно отстранены от должности и во многих случаях заключены в тюрьму."
 mtg_usa_civil_war_democrats.27.a:1 "Прекрасная, менее бесполезная пустыня для обороны."
 mtg_usa_civil_war_democrats.28.t:1 "Юго-Запад заявил о поддержке правительства"
 mtg_usa_civil_war_democrats.28.desc:1 "Губернаторы Невады, Аризоны, Юты, Нью-Мексико и Колорадо объявили чрезвычайное положение после широкомасштабных демонстраций в поддержку правительства Бостона. В ряде случаев подразделения полиции штата и Национальной гвардии обстреливали протестующих, которые в панике бежали, затаскивая с собой убитых и раненых."
 mtg_usa_civil_war_democrats.28.a:1 "Время митингов и выступлений давно прошло."
 mtg_usa_civil_war_democrats.29.t:1 "Западный Средне-Западный Сецедес"
 mtg_usa_civil_war_democrats.29.desc:1 "Правительства штатов Дакота, Айова, Миннесота и Небраска были смещены с поста хорошо скоординированным и исполненным восстанием, поддержанным местными правоохранителями и сочувствующими национальными гвардейцами. Поспешно избранные временные губернаторы заявили о своей поддержке правительства Бостона."
 mtg_usa_civil_war_democrats.29.a:1 "Эта территория легко отвоевывается."
 mtg_usa_civil_war_democrats.30.t:1 "Западная часть Среднего Запада заявляет о поддержке правительства"
 mtg_usa_civil_war_democrats.30.desc:1 "Правительствам штатов Дакота, Айова, Миннесота и Небраска сегодня едва удалось победить хорошо спланированную попытку государственного переворота левыми элементами при поддержке правоохранительных органов и мятежных национальных гвардейцев. Лоялисты сумели защитить законодательные органы штата и предотвратить захват нескольких губернаторов, но понесли потери в нескольких острых перестрелках, бушевавших в столицах штатов."
 mtg_usa_civil_war_democrats.30.a:1 "Герои один и все."
 mtg_usa_civil_war_democrats.31.t:1 "Средне-Западный Сецедес"
 mtg_usa_civil_war_democrats.31.desc:1 "Ссылаясь на отсутствие поддержки со стороны правительства и \"ужасающее отсутствие руководства со стороны бывшего президента\" [USA.GetLeader]\", губернаторы Огайо, Миссури, Висконсина, Иллинойса, Индианы и Мичигана заявили о своем намерении баллотироваться в правительство Бостона. Отношения внутри повстанческого лагеря, вероятно, будут напряженными, поскольку все эти губернаторы ранее считались прочно в лагере президента."
 mtg_usa_civil_war_democrats.31.a:1 "Они лишь последние в длинной череде предателей, с которыми приходится иметь дело."
 mtg_usa_civil_war_democrats.40.t:0 "Макартур предложил возглавить правительство"
 mtg_usa_civil_war_democrats.40.desc:0 "С полным отступлением правительства и присоединением к восстанию значительной части страны генерал Макартур обратился к нам с предложением. Указывая на то, что только он действительно понимает американский менталитет и обеспечивает стабильность и лидерство в этот момент кризиса, Макартур предложил возглавить «Правительство национальной обороны», пока восстание не будет побеждено. По словам Макартура, это должно уменьшить трения между гражданским руководством и военными командирами, возглавив генерала Макартура.\n\nНекоторым в правительстве несколько неудобно от того, что он продолжает ссылаться на себя в третьем лице."
 mtg_usa_civil_war_democrats.40.a:0 "Отчаянные времена требуют отчаянных мер."
 mtg_usa_civil_war_democrats.40.b:0 "Это был бы конец республики."
 mtg_usa_civil_war_democrats.41.t:0 "Уильям Дадли Пелли бросает вызов [USA.GetLeader]"
 mtg_usa_civil_war_democrats.41.desc:0 "Когда восстание в Бостоне, наконец, подошло к концу, многие в правительстве не знают, как действовать дальше. Правительство национальной обороны Макартура первоначально планировалось просуществовать только до конца войны. Однако мир вокруг [USA.GetNameDef] Мы только стали более враждебными, и вскоре мы снова можем оказаться в состоянии войны. Фашистский лидер Уильям Дадли Пелли публично призвал вернуться к «законному и упорядоченному правительству», одновременно поблагодарив Макартура за его службу. Указывая на всплеск поддержки его движения во время войны, Пелли явно считает себя предопределённым на должность президента и лидера Америки.[USA.GetCandidatesFascism2][USA.GetCandidatesFascism]\n\nВ нехарактерном проявлении смирения, [USA.GetLeader] Он предложил уйти в отставку, если этого потребует общественное мнение. Американский народ смотрит на нас, чтобы увидеть, как остальная администрация рассматривает этот вопрос."
 USA_hilt_candidate:0 "\n\n К этой путанице добавляется и ранее неизвестный в политическом отношении господин. Адам Хилт, глава всемирно известной архитектурной фирмы Hilt & Partner, ранее из Берлина, но эвакуированный в Браунов, штат Арканзас, во время Гражданской войны в Германии, недавно публично объявил о готовности служить стране, в которой он родился. Некоторые недоброжелатели задавали вопросы о ярко выраженном немецком акценте Хилта, что-то, что мистер. Утверждения Хилта происходят из долгих лет работы и изучения искусства в Германии. По словам Хилта, такие мелкие детали лишь отвлекают от больших проблем и являются ничем иным, как трусливыми попытками очернить патриота и естественно рожденного гражданина."
 USA_lindbergh_candidate:0 "\n\nСсылаясь на свои заслуги перед страной в преддверии недавней войны и перед авиацией в целом, известный летчик Чарльз Линдберг также бросил свою шляпу на ринг. Отмечая раскольнический характер двух главных кандидатов, Линдберг считает себя лучшим человеком, который объединит и вдохновит страну на преодоление своих разногласий и возвращение к былому величию."
 mtg_usa_civil_war_democrats.41.d:0 "Попросите Чарльза Линдберга сформировать правительство."
 mtg_usa_civil_war_democrats.41.a:0 "Он выполнил свой долг."
 mtg_usa_civil_war_democrats.41.b:0 "Республика нуждается в нем."
 mtg_usa_civil_war_democrats.41.c:0 "Мистер. Хилт кажется лучшим кандидатом на восстановление страны."
 mtg_usa_canadian_corridor.1.t:1 "Канадский коридор"
 mtg_usa_canadian_corridor.1.desc:1 "Наш посол в [USA.GetNameDef] Сегодня его вызвали в Госдепартамент и предъявили ультиматум. Согласно записке, переданной ему, правительство [USA.GetNameDef] Канада больше не может принимать суверенитет над районами между Вашингтоном и Аляской.\n\nПредложения о заключении договора, позволяющего проход войск и освобождение от некоторых пограничных контрольных мер, были категорически отвергнуты. The [USA.GetAdjective] Правительство ожидает ответа к полуночи."
 mtg_usa_canadian_corridor.1.a:1 "Они её получат."
 mtg_usa_canadian_corridor.1.b:1 "Никогда!"
 mtg_usa_canadian_corridor.2.t:1 "[CAN.GetNameDefCap] принимать"
 mtg_usa_canadian_corridor.2.desc:1 "Правительство [CAN.GetLeader] Мы согласились с нашими требованиями и вышли из оспариваемых территорий. Наши силы продвинулись вперед, чтобы установить контроль над тем, какие форпосты цивилизации существуют за пределами городов."
 mtg_usa_canadian_corridor.2.a:1 "Они выбрали мудро."
 mtg_usa_canadian_corridor.3.t:1 "[CAN.GetNameDefCap] отказывает"
 mtg_usa_canadian_corridor.3.desc:1 "Назвав наше предложение «ничем иным, как предложением „Ванкувер или война!“, и ожидая, что мы свернемся, как трусы», [CAN.GetLeader] Он публично осудил любые дальнейшие попытки дипломатии.[CAN.GetAdjective] Сообщается, что силы находятся в состоянии повышенной боевой готовности и занимают оборонительные позиции вдоль границы."
 mtg_usa_canadian_corridor.3.a:1 "Мы предложили мир, а они выбрали войну."
 mtg_usa_canadian_corridor.3.b:1 "Мы не можем позволить себе войну из-за кучи камней и деревьев."
 mtg_usa_southern_threat.1.t:1 "[USA.GetNameDefCap] Требуется Договор о консультациях и дружбе"
 mtg_usa_southern_threat.1.desc:1 "Президент [USA.GetLeader] Он призвал нашего посла передать ряд требований от правительства США. Среди них – специальные консультационные права. [USA.GetAdjective] Посол. По сути, эти права дают [USA.GetAdjective] Правительство наложило вето на любое решение, которое мы принимаем.\n\nЕсли мы откажемся, записка продолжится, [USA.GetAdjective] Правительство будет вынуждено «принять такие меры, которые оно сочтет необходимыми для обеспечения национальной безопасности»."
 mtg_usa_southern_threat.1.a:1 "Мы должны принять неприемлемое, чтобы избежать кровопролития."
 mtg_usa_southern_threat.1.b:1 "Никогда!"
 mtg_usa_southern_threat.2.t:1 "[MEX.GetLeader] принимать"
 mtg_usa_southern_threat.2.desc:1 "Осознавая безнадежность своего положения, правительство [MEX.GetLeader] Мы приняли наше предложение и согласились проконсультироваться с нами до принятия любого важного политического решения."
 mtg_usa_southern_threat.2.a:1 "Першинг был бы горд."
 mtg_usa_southern_threat.3.t:1 "[MEX.GetLeader] Отказывает."
 mtg_usa_southern_threat.3.desc:1 "В длинной речи, вспоминая героизм прошлых поколений мексиканцев перед лицом \"вопиющей американской агрессии\", [MEX.GetLeader] Он отказался даже рассматривать наши просьбы и сказал нашему послу, что мексиканский народ никогда не склонится перед иностранными захватчиками."
 mtg_usa_southern_threat.3.a:1 "Мы не можем допустить, чтобы это оскорбление осталось безнаказанным."
 mtg_usa_southern_threat.3.b:1 "Война сейчас не в наших интересах."
 mtg_usa_north_american_dominion.1.t:1 "[USA.GetNameDefCap] Требует контроля над внешней политикой"
 mtg_usa_north_american_dominion.1.desc:1 "В рамках, по всей видимости, скоординированного дипломатического наступления по всей Северной Америке и Карибам посол [USA.GetAdjective] передал нам ноту президента [USA.GetLeader], уведомляющую, что его правительство ожидает от нас консультаций по всем будущим внешнеполитическим решениям «в интересах продолжения мира и доброй воли между нашими народами»."
 mtg_usa_north_american_dominion.1.a:1 "У нас нет выбора."
 mtg_usa_north_american_dominion.2.t:1 "[From.GetNameDefCap] Принять подчинение"
 mtg_usa_north_american_dominion.2.desc:1 "Правительство [From.GetLeader] Он согласился с нашими запросами и позволит нашему послу наложить вето на любое важное политическое решение, которое они примут."
 mtg_usa_north_american_dominion.2.a:1 "Мудрый выбор."
 mtg_usa_north_american_dominion.3.t:1 "[From.GetNameDefCap] Отказы"
 mtg_usa_north_american_dominion.3.desc:1 "[From.GetLeader] Мы с глубоким ужасом отреагировали на нашу дипломатическую ноту. В ответ он заявил, что [From.GetNameDef] Он имеет долгую и гордую историю независимости и суверенитета и никогда не позволит иностранной державе навязывать свою волю.\n\nДалее он обратился с просьбой к президенту [USA.GetLeader] Для того, чтобы рассмотреть последствия войны по этому вопросу, который, несомненно, увидит. [USA.GetNameDef] Он назвал это самой большой угрозой миру и будет иметь невообразимые последствия."
 mtg_usa_north_american_dominion.3.a:1 "Отважные слова от такого слабого человека."
 mtg_usa_north_american_dominion.3.b:1 "Возможно, он прав."
 mtg_usa_strategic_interests.1.t:1 "США требуют территории"
 mtg_usa_strategic_interests.1.desc:1 "Президент [USA.GetLeader] Он прибыл в Лондон, чтобы обсудить ряд предложений относительно владения несколькими стратегическими объектами по всему миру. По данным The [USA.GetAdjective] правительство, [ENG.GetNameDef] не хватает как ресурсов, так и воли для адекватной защиты этих районов таким образом, чтобы обеспечить [USA.GetAdjective] интересы были удовлетворены. Если только не [ENG.GetAdjective] Правительство может дать достаточные гарантии того, что эти обязательства будут выполнены, считают аналитики. [USA.GetLeader] Мы будем требовать, чтобы мы передали контроль над этими территориями на [USA.GetNameDefCap]."
 mtg_usa_strategic_interests.1.a:1 "Они приветствуются ими."
 mtg_usa_strategic_interests.1.b:1 "Это стратегические территории!"
 mtg_usa_strategic_interests.2.t:1 "[From.GetNameDefCap] переворачивает территории"
 mtg_usa_strategic_interests.2.desc:2 "После долгих внутренних споров, [ENG.GetAdjective] Правительство приняло наше предложение. Обе стороны согласовали график передачи права собственности на запрашиваемые территории."
 mtg_usa_strategic_interests.2.a:1 "Отлично!"
 mtg_usa_strategic_interests.3.t:1 "[From.GetNameDefCap] Отказывается сотрудничать"
 mtg_usa_strategic_interests.3.desc:1 "Через несколько минут после встречи, [ENG.GetLeader] и [USA.GetLeader] Прерванные переговоры как [ENG.GetAdjective] Ответ был очень простым «Нет». После этого последовала более обширная официальная записка, но она лишь усиливает отказ даже обсуждать условия."
 mtg_usa_strategic_interests.3.a:1 "Тогда посмотрим, смогут ли они защитить их должным образом!"
 mtg_usa_strategic_interests.3.b:1 "Эти территории не стоят своей цены."
 mtg_usa_pacific_pacification.1.t:1 "[USA.GetNameDefCap] требует колониальные владения"
 mtg_usa_pacific_pacification.1.desc_a:0 "Одна из делегаций [USA.GetAdjective] Правительство прибыло, чтобы обсудить безопасность наших активов в Тихом океане. Отмечая сохраняющуюся нестабильность в Китае и ситуацию в Японии, Председатель [USA.GetLeader] Он готов взять на себя ответственность за защиту [GET_AUSTRALIA_NEW_ZEALAND_STATUS]В обмен на ряд привилегий и резервных прав.\n\n Пока что [USA.GetAdjective]s утверждает, что эти права будут использоваться только для обеспечения безопасности [GET_AUSTRALIA_NEW_ZEALAND_STATUS]Многие в правительстве считают, что это [GET_AUSTRALIA_NEW_ZEALAND_STATUS] Немного больше, чем марионетки."
 mtg_usa_pacific_pacification.1.desc_b:0 "Одна из делегаций [USA.GetAdjective] Правительство прибыло, чтобы обсудить планы нашей общей обороны. Похоже, что президент [USA.GetLeader] считает нашу маленькую часть мира жизненно важным интересом для безопасности [USA.GetNameDef]. Помимо простой гарантии прийти на помощь, [USA.GetAdjective] Правительство хочет убедиться, что мы сами не можем стать угрозой. По этой причине в соглашении содержится ряд положений, которые позволят [USA.GetNameDef] Важное значение имеет то, как мы ведем наши внутренние дела.\n\nНесмотря на то, что угроза войны до сих пор не была высказана в ходе переговоров, ясно, что президент [USA.GetLeader] Мы считаем наш отказ очень враждебным актом."
 AST_NZL_PUPPET:0 "Австралия и Новая Зеландия"
 AST_NZL_NO_PUPPET_FALLBACK:0 "Страны южного тихоокеанского региона"
 mtg_usa_pacific_pacification.1.a:1 "Конечно, они не будут вмешиваться во внутренние дела."
 mtg_usa_pacific_pacification.1.b:1 "Мы можем хорошо защитить эти районы."
 mtg_usa_pacific_pacification.2.t:1 "[From.GetNameDefCap] соглашается"
 mtg_usa_pacific_pacification.2.desc:1 "Правительство [From.GetLeader] Мы приняли наши предложения. Был создан специальный совместный комитет для координации выполнения деталей."
 mtg_usa_pacific_pacification.2.a:1 "Отличная работа."
 mtg_usa_pacific_pacification.3.t:1 "[From.GetNameDefCap] Отказы"
 mtg_usa_pacific_pacification.3.desc:1 "Правительство [From.GetNameDef] Он отказался даже встретиться с нашей делегацией, заявив, что между нашими странами нет нерешенных вопросов. Военные атташе в [GET_AUSTRALIA_NEW_ZEALAND_STATUS] В последнее время сообщалось о значительном увеличении военных маневров."
 mtg_usa_pacific_pacification.3.a:1 "У нас нет другого выбора, кроме как применить силу."
 mtg_usa_pacific_pacification.3.b:1 "Мы не можем позволить себе войну."
 mtg_usa_secure_asia.1.t:1 "[USA.GetNameDefCap] оказывает давление"
 mtg_usa_secure_asia.1.desc:1 "Президент [USA.GetLeader] Он направил в столицу специального представителя для встречи с [This.GetLeader] Обсудить возобновившийся интерес [USA.GetNameDef] в этом районе.[This.GetNameDefCap] Очевидно, образует стержень [USA.GetAdjective] Стратегия для региона. Таким образом, было сообщено нашему правительству, что [USA.GetNameDef] не может терпеть недружественное или даже враждебное правительство в [This.GetNameDef]."
 mtg_usa_secure_asia.1.a:1 "Лучше жить на коленях."
 mtg_usa_secure_asia.1.b:1 "Лучше умереть на ногах."
 mtg_usa_secure_asia.2.t:1 "[From.GetLeader] соглашается"
 mtg_usa_secure_asia.2.desc:2 "После долгих переговоров и гарантий личной безопасности, [From.GetLeader] Мы согласились предоставить нашему Специальному посланнику широкие права на консультации, что позволяет нам оказывать значительное влияние на их внутренние дела."
 mtg_usa_secure_asia.2.a:1 "Превосходно."
 mtg_usa_secure_asia.3.t:1 "[From.GetNameDefCap] непокорный"
 mtg_usa_secure_asia.3.desc:1 "Сообщение пришло из [From.GetAdjective] Правительство: \"Свобода, однажды завоеванная, никогда не должна быть оставлена\". Никаких дальнейших сообщений не было получено. [From.GetNameDef] Ему вручили паспорт."
 mtg_usa_secure_asia.3.a:1 "Храбрый. Глупый, конечно, но смелый."
 mtg_usa_secure_asia.3.b:1 "В конце концов, они не имеют значения."
 mtg_usa_secure_asia.4.t:1 "США требуют контроля над колониями"
 mtg_usa_secure_asia.4.desc:1 "На недавней пресс-конференции президент [USA.GetLeader] Объявлен новый стратегический прогноз для Индо-китайского региона и большей Юго-Восточной Азии. Его правительство больше не будет принимать очевидный вакуум власти в регионе. Независимо от того, какой контроль над Индонезией существует, он слишком слаб, чтобы гарантировать безопасность. [USA.GetAdjective] интересов в регионе. Его правительство стремится изменить это.\n\nКогда призывают [This.GetLeader] Чтобы объяснить комментарии, [USA.GetAdjective] Посол передал ноту, в которой изложил [USA.GetAdjective] Позиция в деталях. Эти требования не что иное, как передача контроля над островами Индонезии. [USA.GetAdjective] Контроль."
 mtg_usa_secure_asia.4.a:1 "Они приветствуются ими."
 mtg_usa_secure_asia.4.b:2 "Нелепое предложение."
 mtg_usa_secure_asia.5.t:1 "[From.GetLeader] Принимаем наше предложение"
 mtg_usa_secure_asia.5.desc:1 "Выступая перед прессой, [From.GetLeader] Сегодня стало известно, что его правительство подписало договор с [USA.GetNameDef] О совместном суверенитете в Ост-Индии\n\nДоговор содержит ряд секретных положений, которые, по сути, передадут нам контроль, как только наши администраторы будут на месте. Госдеп уже направил в регион ряд чиновников."
 mtg_usa_secure_asia.5.a:1 "Наилучший возможный исход."
 mtg_usa_secure_asia.6.t:1 "[From.GetNameDefCap] покидает переговоры"
 mtg_usa_secure_asia.6.desc:2 "переговоры с [From.GetNameDef] Они рухнули почти сразу же, как только начали. The [From.GetAdjective] Кабинет министров обсуждал нашу записку менее часа, прежде чем отклонить ее. The [From.GetAdjective] Министр иностранных дел проинформировал нашего посла о том, что если предложение существенно не изменится, то обсуждать нечего."
 mtg_usa_secure_asia.6.a:1 "У них была возможность решить эту проблему мирным путем. Они решили не делать этого."
 mtg_usa_secure_asia.6.b:1 "Они могут сохранить эти территории... пока."
 mtg_usa_secure_asia.7.t:1 "[USA.GetNameDefCap] требует Индокитай"
 mtg_usa_secure_asia.7.desc:1 "В рамках более масштабного дипломатического наступления президент [USA.GetLeader] Вьетнам и Индокитай публично признаны регионом, представляющим жизненно важный интерес для [USA.GetNameDef]. Следовательно, [USA.GetNameDef] Это будет способствовать увеличению их присутствия в регионе.\n\nВ частном порядке, [USA.GetNameDef] Они очень агрессивно отзываются об Индокитае. Помимо оказания давления на [SIA.GetNameDef]Они также потребовали права размещать войска в наших колониях и «направлять» колониальную администрацию.\n\nПо сути, это означало бы передачу этих территорий под их контроль."
 mtg_usa_secure_asia.7.a:1 "Пусть у них будет Вьетнам."
 mtg_usa_secure_asia.7.b:1 "Это жизненно важные [This.GetAdjective] Территории!"
 mtg_usa_secure_asia.8.t:1 "[From.GetNameDefCap] уступает Индокитай"
 mtg_usa_secure_asia.8.desc:1 "тот [From.GetAdjective] Правительство согласилось с нашими требованиями и поручило местной администрации полностью сотрудничать, пока мы не сможем привести в действие наших людей."
 mtg_usa_secure_asia.8.a:1 "Наше участие во Вьетнаме знаменует собой новую эру мира и процветания в регионе."
 mtg_usa_secure_asia.9.t:1 "[From.GetNameDefCap] Отказы"
 mtg_usa_secure_asia.9.desc:1 "После длительных и все более напряженных переговоров, [From.GetAdjective] Правительство, наконец, отклонило наше предложение. Наш посол в [From.GetNameDef] По его словам, он больше не может даже назначить встречу с [From.GetLeader]."
 mtg_usa_secure_asia.9.a:1 "Мы не будем идти на компромисс в вопросах национальной безопасности."
 mtg_usa_secure_asia.9.b:1 "В любом случае, втягиваться во Вьетнам было бы серьезной ошибкой."
 mtg_usa_protect_south_america.1.t:1 "Южноамериканский саммит по безопасности"
 mtg_usa_protect_south_america.1.desc:1 "На саммите в [USA.GetAdjective] Столица, [USA.GetAdjective] Президент [USA.GetLeader] В Южной Америке появилась новая архитектура безопасности. В дипломатическом плане, однако, [USA.GetAdjective] Правительство ясно видит себя главной силой, стоящей за безопасностью континента, и в свою очередь ожидает, что мы будем следовать их политическому руководству.\n\n Фактически, [USA.GetAdjective] Дипломаты уже настаивают на этом за кулисами и переводят эти предложения в конкретные пункты действий, такие как специальные права на консультации и право вето для посла США - и только посла США.\n\nЕще более пугающим является тот факт, что отказ принять это будет, по словам президента, рассматриваться как враждебный и дестабилизирующий акт с \"глубоко печальными\" последствиями."
 mtg_usa_protect_south_america.1.a:1 "Последствия слишком тяжелые, чтобы выдержать."
 mtg_usa_protect_south_america.1.b:1 "Мы будем защищать свою свободу!"
 mtg_usa_protect_south_america.2.t:1 "[From.GetNameDefCap] принимает наше руководство"
 mtg_usa_protect_south_america.2.desc:1 "Президент [From.GetLeader] Мы приняли наши предложения и поручили [From.GetAdjective] Министр иностранных дел, чтобы обсудить более мелкие детали."
 mtg_usa_protect_south_america.2.a:1 "Настоящий лидер."
 mtg_usa_protect_south_america.3.t:1 "[From.GetNameDefCap] отвергает наше руководство"
 mtg_usa_protect_south_america.3.desc:1 "Делегация от [From.GetNameDef] Они поспешно покинули вершину, чтобы отправиться домой. The [From.GetAdjective] Посол до сих пор отказывается комментировать это, утверждая, что по-прежнему ждет инструкций из дома."
 mtg_usa_protect_south_america.3.a:1 "Мы не можем позволить этим ренегатам угрожать региону."
 mtg_usa_protect_south_america.3.b:1 "Война лишь ускорит дестабилизацию обстановки в этом районе."
 mtg_usa_foreign_support.1.t:1 "Пожертвования [USA.GetNameDef]"
 mtg_usa_foreign_support.1.desc:1 "Некоторые ведущие члены Серебряного легиона Америки были в лекционном туре. [This.GetNameDef]Детально говоря об угрозе, с которой сталкивается их страна от хорошо укоренившихся коммунистов на всех уровнях правительства. Американский образ жизни подвергается нападкам, и любая поддержка, которую мы могли бы оказать, была бы высоко оценена и могла бы изменить к сожалению необходимую борьбу, которая вот-вот начнется."
 mtg_usa_foreign_support.1.a:1 "Мы должны делать то, что можем."
 mtg_usa_foreign_support.1.b:1 "Мы ничего не можем себе позволить."
 mtg_usa_foreign_support.2.t:1 "[From.GetNameDefCap] одобряет пожертвования"
 mtg_usa_foreign_support.2.desc:1 "Делегация, которую мы направили [From.GetNameDef] Они сообщили о хорошем успехе в их пожертвовании. Как сообщается, существенный вклад внес [From.GetLeader] себя."
 mtg_usa_foreign_support.2.a:1 "Это будет полезно в будущем."
 mtg_usa_foreign_support.3.t:1 "[From.GetNameDefCap] Отказаться от донорства"
 mtg_usa_foreign_support.3.desc:1 "Наша делегация в [From.GetNameDef] У него не было большого успеха, он выступал перед пустыми комнатами и не мог даже встретиться с политическими лидерами. Они вернулись с пустыми руками."
 mtg_usa_foreign_support.3.a:1 "Это очень плохо."
 mtg_usa_foreign_support.4.t:1 "Оружие для [USA.GetNameDef]"
 mtg_usa_foreign_support.4.desc:1 "Используя обратные каналы, ряд членов «Серебряного легиона» обратились к нам для переговоров о закупках оружия. Они твердо верят, что их страна движется к гражданской войне против коммунистических элементов, извращающих американский образ жизни, возможно, при поддержке извне.\n\nОни просто хотят немного сравнять шансы и спросить, можем ли мы сэкономить какое-либо оборудование."
 mtg_usa_foreign_support.4.a:1 "Отправьте несколько винтовок"
 mtg_usa_foreign_support.4.b:1 "Пошлите несколько полевых пушек"
 mtg_usa_foreign_support.4.c:1 "Отправьте старые танки"
 mtg_usa_foreign_support.4.d:1 "Им придется постоять за себя."
 mtg_usa_foreign_support.5.t:1 "[From.GetNameDefCap] отправляет винтовки"
 mtg_usa_foreign_support.5.desc:1 "Наши связи с [From.GetNameDef] окупились. с явно выраженным одобрением [From.GetLeader], [From.GetAdjective] Компании начали продавать нам винтовки в кредит. Оружие будет храниться в нейтральных странах до начала войны."
 mtg_usa_foreign_support.5.a:1 "Они пригодятся."
 mtg_usa_foreign_support.6.t:1 "[From.GetLeader] отказывается от поддержки"
 mtg_usa_foreign_support.6.desc:1 "Наши попытки закупить новое оружие [From.GetNameDef] Они были грубо отвергнуты.[From.GetLeader] Он заявил, что правительство никогда не допустит, чтобы ресурсы [From.GetAdjective] Люди, которых нужно растрачивать на такие глупые начинания."
 mtg_usa_foreign_support.6.a:1 "Как грубо."
 mtg_usa_foreign_support.7.t:1 "[From.GetNameDefCap] отправляет полевые орудия"
 mtg_usa_foreign_support.7.desc:1 "Наша делегация в [From.GetNameDef] Сообщите о значительном прорыве в их попытках заручиться большей поддержкой нашего дела. The [From.GetAdjective] Военные согласились расстаться с рядом старых полевых орудий и сделать их доступными для нас. Чтобы избежать оповещения противника, они будут храниться в секретном месте до наступления времени."
 mtg_usa_foreign_support.7.a:1 "Выдающийся!"
 mtg_usa_foreign_support.8.t:1 "[From.GetNameDefCap] отправляет танки"
 mtg_usa_foreign_support.8.desc:1 "Наш агент в [From.GetNameDef] Сообщает о ошеломляющем успехе. За частным ужином, [From.GetLeader] Мы договорились продать нам в кредит ряд бронетехники.[From.GetNameDefCap] Наблюдать за развитием событий в [USA.GetNameDef] С большим интересом, и был бы более чем счастлив помочь нам любым способом, который они могут.\n\nОднако, [From.GetAdjective] Правительство не может открыто поддерживать партию, которая еще не у власти, поэтому танки будут доставлены, когда начнется война."
 mtg_usa_foreign_support.8.a:1 "Пусть наши враги берегутся!"
 mtg_usa_foreign_support.9.t:1 "«Серебряный легион» хочет строить тренировочные лагеря"
 mtg_usa_foreign_support.9.desc:1 "Серебряный легион Америки обратился к нам с просьбой построить ряд тренировочных лагерей для подготовки добровольцев. Политическая ситуация в их родной стране быстро ухудшается, и они хотят быть готовыми к войне, которая, по их мнению, приближается."
 mtg_usa_foreign_support.9.a:1 "Мы сделаем из них людей!"
 mtg_usa_foreign_support.9.b:1 "Они могут играть в солдат в другом месте."
 mtg_usa_foreign_support.10.t:1 "[From.GetNameDefCap] одобряет тренировочные лагеря"
 mtg_usa_foreign_support.10.desc:1 "Послание поступило от нашей делегации в [From.GetNameDef]. The [From.GetAdjective] Правительство одобрило строительство нескольких тренировочных лагерей для обучения членов Серебряного легиона тактике пехоты. Они будут оттачивать свои навыки до тех пор, пока не разразится война."
 mtg_usa_foreign_support.10.a:1 "Правда [USA.GetAdjective] Герои"
 mtg_usa_foreign_support.11.t:1 "[From.GetNameDefCap] отказывается помочь"
 mtg_usa_foreign_support.11.desc:1 "Послание поступило от нашей делегации в [From.GetNameDef]. Они не смогли получить разрешение на наши предлагаемые учебные лагеря. [From.GetLeader]и запрашивают дальнейшие инструкции."
 mtg_usa_foreign_support.11.a:1 "Мы это запомним."
 mtg_usa_foreign_support.12.t:1 "«Серебряный легион» хочет обучать пилотов"
 mtg_usa_foreign_support.12.desc:1 "Американские фашисты из Серебряного легиона встретились [This.GetLeader] Разрешено отправить несколько добровольцев для обучения пилотов. Кандидаты будут тщательно отобраны для их навыков и правильной идеологической основы, прежде чем они будут одобрены нами. Похоже, легион считает, что многие из профессиональных пилотов в нынешних вооруженных силах не примут фашистское правительство в США и поддержат восстание."
 mtg_usa_foreign_support.12.a:1 "Они заработают свои крылья."
 mtg_usa_foreign_support.12.b:1 "У нас нет времени на эту чушь."
 mtg_usa_foreign_support.13.t:1 "[From.GetNameDefCap] одобряет подготовку пилотов"
 mtg_usa_foreign_support.13.desc:1 "The [From.GetAdjective] Правительство утвердило небольшое количество Серебряных легионеров для подготовки пилотов. Дальнейшие переговоры обеспечили продажу небольшого количества истребителей в кредит, которые должны быть доставлены, когда война вспыхнет."
 mtg_usa_foreign_support.13.a:1 "Их будут с нетерпением ждать."
 mtg_usa_foreign_support.14.t:1 "[From.GetNameDefCap] Отказывается от подготовки пилотов"
 mtg_usa_foreign_support.14.desc:1 "Ссылаясь на серьезную озабоченность по поводу пригодности кандидатов, [From.GetAdjective] Правительство отказалось разрешить нам программу подготовки пилотов."
 mtg_usa_foreign_support.14.a:1 "Летать на самолете не так уж и сложно, правда?"
 us_pilot_training_tt:1 "Небольшая эскадрилья из 25 бойцов будет переброшена, когда начнется война."
 mtg_usa_foreign_support.15.t:1 "«Серебряный легион» хочет приобрести корабли"
 mtg_usa_foreign_support.15.desc:1 "Представитель Серебряного легиона прибыл, чтобы попросить о помощи в обеспечении финансирования ряда проектов по строительству кораблей в Черном море. [USA.GetNameDef]. Серебряный легион - при поддержке людей в [USA.GetAdjective] Правительство хочет держать эти корабли подальше от книг и должно искать альтернативные источники финансирования."
 mtg_usa_foreign_support.15.a:1 "Достойные инвестиции"
 mtg_usa_foreign_support.15.b:1 "Это было бы пустой тратой денег"
 mtg_usa_foreign_support.16.t:1 "[From.GetNameDefCap] одобряет финансирование"
 mtg_usa_foreign_support.16.desc:1 "The [From.GetAdjective] Правительство утвердило необходимые средства для закупки судов. План состоит в том, чтобы покупать корабли и вооружения по отдельности и объединять их вместе, когда начнется война. Этот процесс, без сомнения, займет некоторое время."
 mtg_usa_foreign_support.16.a:1 "Нельзя построить корабль за один день."
 mtg_usa_foreign_support.17.t:1 "[From.GetNameDefCap] отказывается от финансирования"
 mtg_usa_foreign_support.17.desc:1 "Несмотря на личную встречу с [From.GetLeader]Наши агенты в [From.GetNameDef] Было сказано, что [From.GetAdjective] Правительство не может жалеть денег, чтобы помочь нам купить корабли."
 mtg_usa_foreign_support.17.a:1 "Несчастный."
 mtg_usa_diplomatic_protest.1.t:1 "[USA.GetNameDefCap] направляет ноту протеста"
 mtg_usa_diplomatic_protest.1.desc:1 "Личное письмо от [USA.GetAdjective] Президент [USA.GetLeader] Приехали. Президент решительно осудил наши «недавние недопустимые действия», которые привели к дестабилизации региона.[From.GetNameDefCap] «Мы по-прежнему привержены миру и стабильности в регионе и будем вынуждены рассмотреть дальнейшие меры, в том числе военные действия, если мы продолжим наш нынешний курс», — говорится в письме."
 mtg_usa_diplomatic_protest.1.a:1 "Они блефуют. Возможно."
 mtg_usa_diplomatic_protest.2.t:1 "[USA.GetNameDefCap] требует передачи американских владений"
 mtg_usa_diplomatic_protest.2.desc:1 "Выступая перед обеими палатами Конгресса, президент [USA.GetLeader] Он заявил, что его правительство по-прежнему привержено доктрине Монро, в которой говорится, что никакая внешняя власть не должна иметь право удерживать территорию в Северной и Южной Америке. Хотя на практике это [USA.GetAdjective] Правительство терпело другие [USA.GetRulingIdeology] Страны, владеющие небольшими территориями, не могут принять то, что он назвал «незаконной оккупацией и прямой угрозой безопасности». [USA.GetNameDef]\". \n\nВскоре после этого, [USA.GetAdjective] Посол передал президенту ноту с ультиматумом передать контроль над нашими американскими владениями [USA.GetNameDef]."
 mtg_usa_diplomatic_protest.2.a:1 "Эти территории не стоят войны."
 mtg_usa_diplomatic_protest.2.b:1 "Скажите президенту, чтобы он занялся своими делами."
 mtg_usa_diplomatic_protest.3.t:1 "[From.GetNameDefCap] возвращает территории"
 mtg_usa_diplomatic_protest.3.desc:1 "Ссылаясь на желание избежать кровопролития, правительство [From.GetLeader] Мы договорились передать нам контроль над их американскими активами. Вопрос о том, должны ли мы немедленно предоставить этим территориям полный суверенитет или держать их под нашим непосредственным управлением, является предметом некоторых дебатов в Государственном департаменте."
 mtg_usa_diplomatic_protest.3.a:1 "Мы рассмотрим наши варианты."
 mtg_usa_diplomatic_protest.4.t:1 "[From.GetNameDefCap] Отказ от ультиматума"
 mtg_usa_diplomatic_protest.4.desc:1 "Назвать нашу записку \"неприемлемым вторжением во внутренние дела\" [From.GetNameDef]\", [From.GetAdjective] Правительство категорически отказалось обсуждать их суверенитет над американскими территориями."
 mtg_usa_diplomatic_protest.4.a:1 "Они были предупреждены. Они решили не обращать внимания на предупреждение."
 mtg_usa_diplomatic_protest.4.b:1 "Это не будет решено насилием."
 mtg_exile_leader_added.1.t:1 "[exile_nation.GetAdjective] Лидер изгнания предлагает свои услуги"
 mtg_exile_leader_added.1.desc:1 "После долгого и опасного путешествия по вражеской территории и нескольким нейтральным государствам, [From.GetName] Наконец-то добрались до столицы. После короткого периода восстановления, [From.GetSheHe] Предложил [From.GetHerHis] Службы в нашей общей борьбе.\n\nКак сообщается, [From.GetSheHe] Он очень хочет «вернуться в бизнес по убийству людей и разрушению вещей»."
 mtg_exile_leader_added.1.a:1 "Твоя борьба еще не окончена."
 mtg_news.1.t:0 "Вторая американская гражданская война"
 mtg_news.1.desc:0 "Напряженность в США достигла точки кипения. Недовольны политикой президента [USA.GetLeader]Законодательные органы нескольких штатов США проголосовали за выход из Союза.\n\nЛюбые надежды на мирное урегулирование конфликта были разбиты, и боевые действия вспыхнули по всему фронту. Похоже, что большинство правительства решило остаться с законным правительством, но отчеты показывают всплеск добровольцев по всем отделяющимся штатам.\n\nПоскольку ни одна из сторон не желает отступить, наблюдатели ожидают долгой и ожесточенной борьбы."
 mtg_news.1.a:0 "История повторяется."
 mtg_news.1.b:0 "Американский эксперимент провалился на наших глазах."
 mtg_news.1.c:0 "Каждый шаг прогресса должен быть куплен кровью."
 mtg_news.1.d:0 "Баланс сил смещается в сторону экстремистов."
 mtg_news.2.desc:1 "После нескольких месяцев протестов и усиления напряженности между сторонниками президента [USA.GetLeader] Конституционалистские политики и его противники в так называемом лагере «конституционалистов» объявили новое правительство, базирующееся в Бостоне, родиной первой американской революции. Разногласия в обществе проходят через семьи и институты.\n\nПохоже, что небольшое большинство военных решило встать на сторону конституционалистов, поскольку правительства штатов по всей континентальной части Соединенных Штатов заявляют о своей верности той или иной стороне."
 mtg_news.2.a:0 "Внутренние враги остаются врагами."
 mtg_news.2.b:0 "Борьба за душу Америки вспыхнула на глазах."
 mtg_news.2.c:0 "Вот что происходит, когда ты слишком долго игнорируешь фашистов."
 mtg_news.2.d:0 "Американская республика борется за свою жизнь!"
 mtg_news.3.t:0 "Конгресс США принимает Закон о нейтралитете"
 mtg_news.3.desc:0 "С ростом напряженности по всему миру Конгресс США стал ареной интенсивных дискуссий о роли США А на мировой арене. Многие депутаты обеспокоены тем, что президент [USA.GetLeader] Возможно, они тайно планируют вмешаться в европейскую или азиатскую войну. Некоторые до сих пор помнят роль, которую страна сыграла в Великой войне, и стремятся сохранить ее. [USA.GetNameDef] Из-за внешних связей.\n\nСтремясь поддержать предложенные им программы экономических реформ, президент [USA.GetLeader] Он подписал закон о нейтралитете, который накладывает жесткие ограничения на торговлю с государствами, находящимися в состоянии войны, и конкретно запрещает президенту оказывать какую-либо поддержку другим странам."
 mtg_news.3.a:0 "Наших ребят не отправят на иностранные войны."
 mtg_news.3.b:0 "Дай гиганту поспать."
 mtg_news.3.c:0 "Они поддерживают фашистов бездействием."
 mtg_news.3.d:0 "Спроси у бельгийцев, насколько хорошо нейтралитет защищал их в 1914 году."
 mtg_news.3.e:0 "Они понимают важность сохранения нейтралитета."
 mtg_news.3.f:0 "Нейтралитет должен быть подкреплен силой."
 mtg_news.4.t:0 "[USA.GetNameDefCap] проводит интервенционистскую политику"
 mtg_news.4.desc:0 "\nДвижение за мир в [USA.GetNameDef] Конгресс принял совместную резолюцию, поощряющую президента [USA.GetLeader] использовать военную силу, если это необходимо, для защиты [USA.GetAdjective] интересов по всему миру.\n\nМногие в Конгрессе решили, что [USA.GetAdjective] Нерешительность, позволившая Великой войне затянуться на столь долгий срок и поглотить столько жизней. Они указывают, что через несколько месяцев после ввода американских войск в Европу Великая война закончилась. Более раннее вмешательство, утверждают они, могло бы спасти сотни тысяч жизней."
 mtg_news.4.a:0 "Мы будем сражаться с ними там, так что нам не придется бороться с ними здесь."
 mtg_news.4.b:0 "Они должны держаться подальше от чужих дел."
 mtg_news.4.c:0 "Подстегнутый военно-промышленным комплексом, без сомнения."
 mtg_news.4.d:0 "На этот раз хозяин не будет спать."
 mtg_news.5.t:0 "[USA.GetNameDefCap] принимает Закон о военных полномочиях"
 mtg_news.5.desc:0 "\nПосле голосования стоячим провозглашением в зале Сената Президент [USA.GetLeader] немедленно подписал Закон о военных полномочиях. Закон предоставляет должности Президента гораздо большую свободу действий в использовании армии, чем это было возможно ранее. Президент теперь может развертывать войска для защиты [USA.GetAdjective]ских интересов, когда и где он сочтет это необходимым, на неограниченный срок.\n\nВ то время как Президент [USA.GetLeader] заявил, что эти новые полномочия будут использоваться только в самых крайних обстоятельствах, источники в Государственном департаменте утверждают, что это всего лишь первый шаг в крупномасштабной программе по изменению глобального баланса сил."
 mtg_news.5.a:0 "Теперь наши слова будут иметь больший вес."
 mtg_news.5.b:0 "До тех пор, пока они остаются в сфере своего влияния."
 mtg_news.5.c:0 "Наконец-то фашисты показали свое истинное лицо."
 mtg_news.5.d:0 "Мы стоим на заре новой эры."
 mtg_news.6.t:1 "Рабочие победили во Второй Гражданской войне в США!"
 mtg_news.6.desc:0 "\nПосле месяцев кровопролития и неисчислимых тысяч жертв Вторая гражданская война в США завершилась. Попытка южных штатов отделиться провалилась. Многие наблюдатели отмечают сходство с первой Гражданской войной в США: промышленная мощь северных штатов вновь оказалась сильнее решимости Юга. \n\nТеперь правительству [USA.GetLeader] предстоит трудная задача реинтеграции отколовшихся штатов обратно в [USA.GetNameDef]. После двух восстаний с разницей всего около 80 лет многие в правительстве требуют куда более суровых наказаний для мятежников, чем после первой войны."
 mtg_news.6.a:0 "Наконец-то все кончено."
 mtg_news.6.b:0 "Еще одно место, чтобы освободиться от ига большевизма."
 mtg_news.6.c:0 "Революция идет к своей неизбежной победе!"
 mtg_news.6.d:0 "Мы можем только надеяться, что правая сторона победит."
 mtg_news.7.t:1 "[USA.GetNameDefCap] Господи, Господи!"
 mtg_news.7.desc:0 "\nПосле нескольких месяцев кровопролития и несметных тысяч жертв Вторая американская гражданская война подошла к концу. Президент [USA.GetLeader] Объявлено о завершении крупных боевых действий. В то время как некоторые остатки повстанческого правительства все еще продолжают неэффективную кампанию сопротивления, большинство из них либо были окружены правительственными разборками, либо снова превратились в гражданское население.\n\nПо словам президента [USA.GetLeader]Война явно была работой иностранных влияний, стремящихся дестабилизировать и разделить страну. Со временем, как он обещает, ответственные за это люди погасят свой долг перед восстанавливающейся американской нацией."
 mtg_news.7.b:0 "Правосудие победило!"
 mtg_news.7.c:0 "Американские рабочие со временем снова будут дышать свободно."
 mtg_news.7.d:0 "Будущее демократии становится все более неопределенным."
 mtg_news.8.t:0 "Восстание [Root.GetNameDef]"
 mtg_news.8.desc:0 "Перед лицом глобальных угроз британское правительство сделало совместное заявление с правительствами двух стран. [CAN.GetNameDef], [SAF.GetNameDef], [AST.GetNameDef]и [NZL.GetNameDef] Британское содружество наций будет официально оформлено новой структурой федерального правительства.\n\nС более ранними [RAJ.GetAdjective] Отказ правительства от этого предложения и с текущей реализацией федеральной структуры для Содружества, [RAJ.GetNameDef] Он решил не оставаться связанным с новым супергосударством.\n\nНесмотря на это, этот шаг, несомненно, будет иметь беспрецедентные последствия для мировой сцены."
 mtg_news.8.a:0 "Это большой шаг вперед для наших народов."
 mtg_news.8.b:0 "Новая сверхдержава возрождается..."
 mtg_news.9.desc:0 "Перед лицом глобальных угроз британское правительство выступило с совместным заявлением вместе с правительствами... [CAN.GetNameDef], [SAF.GetNameDef], [RAJ.GetNameDef], [AST.GetNameDef]и [NZL.GetNameDef] Британское содружество наций будет официально оформлено новой структурой федерального правительства.\n\nПонятно, что объединение Британской империи в таком масштабе, несомненно, будет иметь беспрецедентные последствия для мировой сцены."
 mtg_news.10.t:0 "[HOL.GetNameDefCap] Пещеры для немцев"
 mtg_news.10.desc:0 "\n[HOL.GetAdjective] Попытки сохранить торговый нейтралитет потерпели неудачу, и недавние меры были реализованы. [HOL.GetAdjective] Правительство ясно дает понять, что они будут вступать в [GER.GetName]- благоприятная торговая политика. Вполне вероятно, что это приведет к значительному увеличению [GER.GetAdjective] влияние на [HOL.GetNameDef]."
 mtg_news.10.a:0 "Тогда нам тоже придется их блокировать."
 mtg_news.10.b:0 "Сейчас они находятся в нашей сфере."
 mtg_news.10.c:0 "У нас не было выбора..."
 mtg_news.10.d:0 "[GER.GetAdjective] Влияние растет..."
 mtg_news.11.t:0 "[HOL.GetNameDefCap] Пещеры для британцев"
 mtg_news.11.desc:0 "\n[HOL.GetAdjective] Попытки сохранить торговый нейтралитет потерпели неудачу, и недавние меры были реализованы. [HOL.GetAdjective] Правительство ясно дает понять, что они будут вступать в [ENG.GetName]- благоприятная торговая политика. Вполне вероятно, что это приведет к значительному увеличению [ENG.GetAdjective] влияние на [HOL.GetNameDef]."
 mtg_news.11.a:0 "Они присоединяются к блокаде..."
 mtg_news.11.d:0 "Немцы все чаще оказываются в изоляции."
 mtg_news.12.t:0 "[HOL.GetName] Поддерживает торговый нейтралитет"
 mtg_news.12.desc:1 "\n[HOL.GetAdjective] Попытки сохранить торговый нейтралитет увенчались успехом, и, к огорчению как англичан, так и немцев, голландцы, кажется, только укрепились в своей решимости перед лицом того, что они не смогли добиться успеха. [ENG.GetAdjective] и [GER.GetAdjective] давление."
 mtg_news.12.a:1 "Люди с таким неотъемлемым желанием личной выгоды заслуживают того, чтобы быть захваченными и порабощенными!"
 mtg_news.12.b:0 "Самое неразумное решение."
 mtg_news.12.c:0 "Мы хозяева своей судьбы."
 mtg_news.12.d:0 "Они играют с огнем..."
 mtg_britain.1.t:1 "Эдвард VIII Кризис отречения"
 mtg_britain.1.d:2 "В течение некоторого времени король Эдуард VIII надеялся жениться на американке Уоллис Симпсон. Конституционный кризис возник как раз тогда, когда госпожа. Симпсон не только развелась со своим предыдущим мужем, но на самом деле все еще замужем за своим нынешним мужем, в настоящее время преследуя второй развод. Общее возмущение последовало на том основании, что, будучи королем и главой Англиканской церкви, Эдуард не может жениться на разведенной.\n\nОднако король ясно дал понять, что очень любит миссис. Симпсон, и намеревается жениться на ней независимо от мнения его правительств или его подданных. Таким образом, только три варианта остаются открытыми для него.\n\nБританское правительство и правительства доминионов уже заявили, что любая альтернатива отречению будет неприемлемой, а последствия попыток принуждения через брак, даже попытки компромисса, вероятно, будут ужасными не только для самой Британии, но и для ее связей с Содружеством. Пока ближайшие советники короля продолжают попытки убедить его, общественность с замиранием сердца ждет разрешения этого конфликта между королем и его кабинетом."
 mtg_britain.1.a:2 "Настаивайте на королевском браке."
 mtg_britain.1_tt:2 "Начните подготовку к браку.\n"
 mtg_britain.1.b:0 "Компромисс по морганатическому браку."
 mtg_britain.1.c:1 "Если он не передумает, король должен отречься."
 edward_viii_refused_to_abdicate_flag:0 "Эдуард VIII отказался отречься"
 mtg_britain.2.t:2 "Формы поддержки Эдуарда VIII"
 mtg_britain.2.d:1 "В разгар огромного возмущения, вызванного решением Короля, поднимаются голоса в поддержку Короля Эдуарда. Хотя они изолированы от основных политических партий, их имена все еще имеют вес: Уинстон Черчилль, Освальд Мосли и Дэвид Ллойд Джордж.\n\nХотя поначалу эта группа маловероятных политических союзников начинает находить поддержку среди людей и, следуя их примеру, все больше и больше осмеливаются публично поддержать Эдварда в его решении.\n\nТаким образом, укрепившись в своей решимости, король ясно дал понять, что он не намерен менять свое мнение в этом вопросе. Брак будет продолжаться, как и планировалось."
 mtg_britain.2.a:0 "Хорошо. Мы установим дату."
 mtg_britain.2_tt:2 "Продолжайте подготовку к браку.\n"
 mtg_britain.2.b:1 "Возможно, народ прав — король должен отречься."
 mtg_britain.3.t:1 "Кабинет министров уходит в отставку"
 mtg_britain.3.d:2 "Поскольку король не намерен слушать свое правительство, [Root.GetLeader] Не было другого выхода, кроме как растворить его. В своем заявлении он говорит: \"Очевидно, что кабинет министров не может функционировать без доверия своего монарха. Неоднократно отбрасывая единодушные советы его министров, было ясно дано понять, что эти советы нежелательны и не соблюдаются, и поэтому сегодня вечером я встречусь с Его Величеством, чтобы предложить отставку кабинета».\n\nЯвно задуманное как окончательный протест против решения короля, неясно, будет ли оно успешным. Неизвестно также, кто из королей объявит об этом. [Root.GetLeader]Преемник или когда."
 mtg_britain.3.a:1 "Отличная поездка. Они не остановят короля."
 mtg_britain.4.t:1 "Доминионы порвут с короной"
 mtg_britain.4.d:1 "Как один из них, представители правительств Доминиона сообщили нам, что они будут в одностороннем порядке разрывать связи с короной. Они ссылаются на вопиющее пренебрежение Короля мнениями и пожеланиями правительств Доминиона и их народов как на главную причину того, почему отношения между Британией и Содружеством больше не могут продолжаться.\n\nКак заявил один из представителей Содружества в жарком интервью: «Королю, который не способен поставить долг выше своих личных чувств, нельзя доверять действовать в наилучших интересах своих подданных. Исходя из последних событий, мы можем определить, что Королю наплевать на внутреннее общественное мнение, и если такова природа его отношений с британским народом, то ситуация может только ухудшиться для его подданных в Содружестве. Поэтому для защиты интересов наших народов мы не видим иной альтернативы, кроме как убрать короля с поста главы нашего государства».\n\nНесомненно, они надеются, что нынешний политический паралич помешает нам действовать в этом резком направлении."
 mtg_britain.4.a:1 "Мы бессильны остановить их - пока."
 mtg_britain.5.t:1 "Королевский брак Эдуарда VIII"
 mtg_britain.5.d:1 "Наконец-то наступила радостная дата королевского брака. Толпы людей собрались в своих тысячах по всему маршруту, пройденному парой из Букингемского дворца в Вестминстерское аббатство.\n\nДомашнее сопротивление браку все больше проявлялось в его бессилии, через символические отставки и другие тщетные протесты, и теперь, похоже, почти замалчивается. Последним таким актом был уход в отставку архиепископа Кентерберийского Космо Ланга и его последующая замена на отдельного человека. С уважением к пожеланиям короля.\n\nПеред лицом политических потрясений, вызванных этим кризисом, нынешние торжества крайне необходимы для возвращения подобия нормальности в общественные дела и в качестве отправной точки для решения нынешних политических проблем."
 mtg_britain.5.a:1 "Но разве это поможет преодолеть раскол в нашей стране?"
 mtg_britain.7.t:2 "Газеты поддерживают брак"
 eng_newspaper_daily_express:0 "The Daily Express"
 eng_newspaper_daily_mail:0 "The Daily Mail"
 eng_newspaper_the_times:0 "The Times"
 eng_newspaper_the_morning_post:0 "Утренняя почта"
 eng_newspaper_daily_herald:0 "The Daily Herald"
 eng_newspaper_the_daily_telegraph:0 "The Daily Telegraph"
 mtg_britain.7.d:1 "Недавняя статья в [GETUKPROKINGNEWSPAPER] Он подчеркнул право короля на счастье и утверждает, что если правила не позволяют ему жениться на разведенной, то, возможно, пришло время модернизировать эти правила."
 mtg_britain.7.a:1 "Это долгожданная демонстрация поддержки короля."
 mtg_britain.8.t:1 "Газеты выступают против брака"
 mtg_britain.8.d:1 "Недавняя статья в [GETUKANTIKINGNEWSPAPER] Он ссылался на обязанности короля перед своей страной и своим народом, заявляя, что его статус и привилегии несут бремя долга, и поэтому он должен пожертвовать либо своим браком, либо своей короной."
 mtg_britain.8.a:1 "Неприятный удар по королю."
 mtg_britain.9.t:1 "Премьер-министр ограничил короля"
 mtg_britain.9.d:1 "Опасаясь, что заявление короля по радио окажет ему слишком большую поддержку среди народа, премьер-министр [Root.GetLeader] Теперь он отказался это допустить. Не имея возможности пойти против своего премьер-министра в этом вопросе, у короля не было другого выбора, кроме как сохранить «свою сторону истории»."
 mtg_britain.9.a:1 "Кризис распространился на высшие эшелоны власти."
 mtg_britain.10.t:1 "Парламент выступает против брака"
 mtg_britain.10.d:1 "Сегодня многие члены парламента решительно высказались против планов короля жениться на госпоже. Симпсон, возбуждающий многих своих сверстников к их делу. Таким образом, политическая оппозиция браку короля заметно возросла."
 mtg_britain.10.a:1 "Что политики знают о любви?"
 mtg_britain.11.t:1 "Высшие классы выступают против брака"
 mtg_britain.11.d:1 "Известные представители аристократии ни в коем случае не слишком мягко выразили свое отвращение к перспективе того, что король женится на том, кого они считают «обычным терпким». Презрение, с которым он обращается к традициям и церемониям, кажется, оскорбило многих самых влиятельных людей в стране."
 mtg_britain.11.a:1 "Они просто завидуют, что он нашел любовь."
 mtg_britain.12.t:1 "Рабочие классы поддерживают брак"
 mtg_britain.12.d:1 "Поддержка Короля, по-видимому, растет среди низших слоев населения. Они не только не видят ничего плохого в том, что король женится на «простолюдине», но даже, кажется, обожают сказочную историю о «общеродной женщине», завоевавшей сердце короля и вступившей в брак с королевской семьей."
 mtg_britain.12.a:1 "Конечно, выигрышная формула для романа."
 mtg_britain.13.t:1 "Эдуард VIII выступил с речью на радио"
 mtg_britain.13.d:1 "Король Эдуард, наконец, сумел убедить правительство разрешить ему выступить по радио, иллюстрируя то, что он называет «своей стороной истории». Он выразил надежду, что это позволит людям лучше понять, почему он чувствует, что должен действовать так, как он делает."
 mtg_britain.13.a:1 "Оказывается, «его сторона истории» была довольно убедительной."
 mtg_britain.15.t:1 "Эдвард VIII Кризис отречения"
 mtg_britain.15.d:1 "Британское правительство было потрясено заявлением о том, что король хочет жениться на низкорожденной разведенной Уоллис Симпсон. Это привело к возмущению как среди членов парламента, так и общественности, поскольку противники утверждают, что долг короля в первую очередь перед его народом и страной, а во вторую - его собственное счастье. Утверждается, что король, как глава Англиканской церкви, которая не позволяет разведенным вступать в брак, поэтому не может жениться на миссис. Симпсон.\n\nДебаты теперь перешли к доминионам, и поскольку король не дал никаких указаний на то, чтобы услышать совет своего кабинета, мы должны предположить, что планы брака не будут изменены. Если он вынуждает силой своей воли, как мы будем реагировать?"
 mtg_britain.15.a:1 "Ни один из наших царей не должен жениться на разведенной простолюдинке."
 mtg_britain.15_tt:1 "Мы станем независимыми и покинем союзников, если Эдуард VIII не передумает.\n"
 mtg_britain.15.b:1 "Он будет нашим королем, несмотря ни на что."
 mtg_britain.15_tt_2:1 "Мы останемся с британцами, даже если Эдуард VIII женится на Уоллисе Симпсоне.\n"
 ENG_staying_loyal_tt:0 "§RМы будем заперты в лояльной ветви нашего дерева фокуса!§!\n"
 mtg_britain.16.t:1 "Эдуард VIII готовится к браку"
 mtg_britain.16.d:1 "Как мы и опасались, король Эдуард VIII решил вступить в брак с Уоллис Симпсон, теперь известной как Уоллис, герцогиня Виндзорская."
 mtg_britain.16.a:1 "Тогда мы должны порвать с Короной."
 mtg_britain.17.t:1 "Руководствуясь Великобританией"
 mtg_britain.17.d:1 "Чтобы подготовить нас к независимости, [ENG.GetNameDef] Мы решили вести нас в переходный период. Мы сможем рассчитывать на их поддержку, пока не будем стоять на своих ногах."
 mtg_britain.17.a:1 "Давайте воспользуемся их помощью."
 mtg_britain.18.t:1 "На пути к независимости доминиона"
 mtg_britain.18.d:1 "Начальный переход завершается, и [ENG.GetAdjective] Правительство проинформировало нас о том, что оно начинает подготовку к передаче полного суверенитета."
 mtg_britain.18.a:1 "Отличная новость!"
 mtg_britain.19.t:1 "Фонды для индийского государства"
 mtg_britain.19.d:1 "Чтобы подготовить нас к независимости, [ENG.GetNameDef] Мы решили вести нас в переходный период. Мы сможем рассчитывать на их поддержку в созревании нашего правительства, а также в повышении уровня индустриализации в стране, пока не будем стоять на своих ногах."
 mtg_britain.20.t:1 "Решение трех наций"
 mtg_britain.20.d:1 "В интересах мира, в [ENG.GetAdjective] Правительство решило разделить субконтинент вдоль религиозных и культурных различий. В результате этого предложения будет создано три отдельных государства; Индия, Пакистан и Бангладеш надеются, что это решение предотвратит любые потенциально разрушительные гражданские войны."
 mtg_britain.20.a:1 "Это вряд ли удовлетворит какую-либо из сторон."
 mtg_britain.21.t:1 "На пути к независимости Индии"
 mtg_britain.22.t:1 "Вотум недоверия"
 mtg_britain.22.d:1 "На сегодняшнем вотуме недоверия Палата общин дала понять, что они потеряли веру в нынешнее правительство. После того, как он подал прошение об отставке королю, [Root.GetLeader] Уинстон Черчилль предложил свою замену.\n\nОжидается, что новый премьер-министр отойдет от противоречивой политики умиротворения, потенциально даже отвечая на дальнейшие вызовы военной силой."
 mtg_britain.22.a:1 "Да здравствует Черчилль!"
 mtg_britain.23.t:1 "Изолировать средиземноморскую угрозу"
 mtg_britain.23.d:1 "[From.GetNameDefCap] Мы обратились к нам с просьбой дипломатически изолировать итальянцев. Если мы будем к этому открыты, они проявят готовность рассмотреть потенциальный будущий союз с нами."
 mtg_britain.23.a:1 "У этого есть потенциал."
 mtg_britain.23.b:1 "Нам не скажут, что делать британцам!"
 mtg_britain.24.t:1 "[From.GetNameDefCap] Брошенные [ITA.GetNameDef]"
 mtg_britain.24.d:1 "[From.GetNameDefCap] Сообщает нам, что они прервали дипломатические отношения с [ITA.GetNameDef]."
 mtg_britain.24.a:1 "Это принесёт нам огромную пользу."
 mtg_britain.25.t:1 "Немецко-британское сближение"
 mtg_britain.25.d:1 "[From.GetNameDefCap] информирует нас о том, что [ENG.GetAdjective] Они спровоцировали разрыв дипломатических отношений с нами."
 mtg_britain.25.a:1 "Как они смеют?!"
 mtg_britain.26.t:1 "[From.GetNameDefCap] Поддержка [ITA.GetNameDef]"
 mtg_britain.26.d:1 "[From.GetNameDefCap] Сообщает нам, что они решили не прерывать дипломатические отношения с Россией. [ITA.GetNameDef]."
 mtg_britain.26.a:1 "Это, безусловно, делает вещи более проблематичными..."
 ENG_germany_rejected_isolate_the_italian_threat:1 "Германия отказалась изолировать средиземноморскую угрозу.\n"
 mtg_britain.27.t:1 "союз с [From.GetNameDef]"
 mtg_britain.27.d:1 "Как уже упоминалось ранее, [From.GetNameDef] Теперь он предложил присоединиться к нашему альянсу, продолжить наше сотрудничество и еще больше изолировать итальянцев."
 mtg_britain.27.a:1 "Какая отличная идея!"
 mtg_britain.27.b:1 "Это нас не интересует."
 mtg_britain.28.t:2 "[From.GetName] Принять Альянс"
 mtg_britain.28.d:1 "[From.GetNameDefCap] Мы приняли наше предложение о союзе. Отныне мы будем править как морем, так и землей."
 mtg_britain.29.t:2 "[From.GetName] Отвергает альянс"
 mtg_britain.29.d:1 "[From.GetNameDefCap] Мы отвергли наше предложение о союзе. То, что они планируют, - это догадки любого..."
 mtg_britain.30.t:2 "[From.GetName] Просить о невмешательстве"
 mtg_britain.30.d:1 "[From.GetNameDefCap] Мы предлагаем договор о невмешательстве, который позволит нам свободно править на континенте, если мы только закроем глаза на участие Британии в их империи и итальянцев."
 mtg_britain.30.a:1 "Это приемлемо."
 mtg_britain.30.b:1 "Мы не хотим, чтобы наши руки были связаны таким образом."
 mtg_britain.31.t:2 "[From.GetNameDefCap] Принимает невмешательство"
 mtg_britain.31.d:1 "[From.GetAdjective] Официальные лица сообщают нам, что они приняли наше предложение о заключении договора о невмешательстве. Они закроют глаза на наши дела с Империей и с Италией, а мы оставим их на их устройствах на континенте."
 mtg_britain.32.t:2 "[From.GetNameDefCap] Отвергает невмешательство"
 mtg_britain.32.d:1 "[From.GetAdjective] Официальные лица сообщают нам, что они отвергли наше предложение о заключении договора о невмешательстве. Если они хотят держать свои варианты открытыми, мы должны быть осторожны."
 mtg_britain.33.t:1 "Политическое насилие перерастает в гражданскую войну"
 mtg_britain.33.d:2 "В ходе недавнего марша между чернорубашечниками и их коммунистическими и социалистическими контрпротестующими произошло дальнейшее насилие. Однако это насилие там не сдерживалось. Как искра, она послужила разжиганию все более напряженной ситуации, которая существовала в нашей стране в последние месяцы.\n\nПо всей стране ополченцы начали вступать в столкновения, захватывая контроль над городами и поселками и их местными районами, вынуждая военных делать выбор в пользу верности. В то время как Доминионы и военно-морской флот все еще полностью поддерживают то, что они называют «законным» демократическим правительством, ситуация в армии гораздо менее ясна, и многие подразделения присоединились к нашему делу.\n\nПо мере того, как фронты начинают формироваться, Освальд Мосли объявил о формировании временного кризисного правительства под своим руководством. Это будет решать основные вопросы до конца гражданской войны."
 mtg_britain.33.a:1 "На кону будущее нашей страны!"
 mtg_britain.34.t:1 "Окончание британской гражданской войны"
 mtg_britain.34.d:2 "Вместо того, чтобы продолжать безнадежную гражданскую войну со стороны колоний, отсутствие народной поддержки привело к тому, что демократическое правительство приняло нашу победу и подало в суд на мир. После этого решения Королевский флот вновь взял на себя наше командование.\n\nДоминионы, однако, ясно дали понять, что они не намерены следовать за недемократическим правительством и вместо этого стремятся продолжать как независимые государства-члены Содружества Наций."
 mtg_britain.34.a:1 "Пора начинать восстановление."
 mtg_britain.35.t:1 "Марш на Даунинг-стрит"
 mtg_britain.35.d:1 "Наш марш на Даунинг-стрит имел огромный успех, и под непосредственным давлением народа, [Root.GetLeader] У меня не было другого выбора, кроме как призвать к немедленным выборам. Это была явная победа правых, и с благословения короля Освальд Мосли в настоящее время формирует свой кабинет. В своем заявлении новый премьер-министр уже объявил о масштабных экономических реформах и новом подходе к европейской дипломатии.\n\nМежду тем, инакомыслие среди доминионов, кажется, достигло рекордно высокого уровня, и призывы к независимости никогда не были громче. Следующие несколько месяцев будут иметь важное значение для Империи."
 mtg_britain.35.a:1 "Под Мосли мы выдержим бурю!"
 mtg_britain.36.t:2 "[From.GetNameDefCap] Запросить Альянс"
 mtg_britain.36.d:1 "[From.GetAdjective] Дипломаты обратились к нам с хитрым предложением. Они предлагают создать альянс, который может противостоять тем, кто стремится к европейской гегемонии, и взамен предлагают отказаться от любых дипломатических отношений с французами."
 mtg_britain.36.a:1 "Отличная идея! Мы принимаем."
 mtg_britain.36.b:1 "Мы не нуждаемся в таком союзнике, как этот."
 mtg_britain.37.t:2 "[From.GetNameDefCap] Принять Альянс"
 mtg_britain.37.d:2 "[From.GetNameDefCap] Сообщает нам, что, заинтригованные нашим предложением, они решили принять его. Мы будем стоять вместе с нашими идеологическими союзниками и вместе противостоять угрозам мира."
 mtg_britain.38.t:2 "[From.GetName] Отвергает альянс"
 mtg_britain.38.d:1 "[From.GetNameDefCap] Они говорят нам, что они считают наше предложение крайне подлым и тем самым не колеблясь отвергают его."
 mtg_britain.39.t:2 "[From.GetNameDefCap] Бросает нас"
 mtg_britain.39.d:1 "[From.GetNameDefCap] Мы уже не имеем отношения к их текущим интересам, и они решили «пересмотреть» связи, которые мы выковали в Великой войне. Вместо этого они объединились с итальянцами."
 mtg_britain.39.a:1 "Такое предательство!"
 mtg_britain.40.t:2 "[From.GetNameDefCap] Предлагает альянс"
 mtg_britain.40.d:1 "The [From.GetAdjective] Правительство обратилось к нам с предложением вернуть Гибралтар в обмен на присоединение к их альянсу."
 mtg_britain.40.a:1 "Превосходная идея!"
 mtg_britain.40.b:1 "Пожалуй, нет."
 mtg_britain.41.t:2 "[From.GetNameDefCap] Принять Альянс"
 mtg_britain.41.d:1 "[From.GetNameDefCap] Они решили принять наше предложение о союзе в обмен на Гибралтар."
 mtg_britain.42.t:2 "[From.GetNameDefCap] Отвергает альянс"
 mtg_britain.42.d:1 "[From.GetNameDefCap] Сообщает нам, что они решили отклонить наше предложение о союзе - мы можем сохранить Гибралтар."
 mtg_britain.43.t:1 "Судьба королевской семьи"
 mtg_britain.43.d:1 "Задержанный под неофициальным домашним арестом в великолепии Букингемского дворца с момента перехода власти, пришло время, что делать с королевской семьей. Общественное мнение ясно дало понять, что они должны уйти, осталось только решить, каким образом и что делать с их богатством, как только мы его захватим."
 mtg_britain.43.a:1 "Высылайте их в Канаду!"
 mtg_britain.43.b:1 "Их будут судить и осуждать."
 mtg_britain.44.t:1 "Королевская семья в изгнании"
 mtg_britain.44.d:1 "The [From.GetAdjective] Правительство продемонстрировало свою «снисходительность» по отношению к королевской семье, изгнав их. Они уже прибыли к нашим берегам и попросили убежища."
 mtg_britain.44.a:1 "Они здесь приветствуются."
 mtg_britain.45.t:1 "Ликвидировать высший класс"
 mtg_britain.45.d:1 "Теперь, когда мы обеспечили себе место коммунизма в стране, мы можем начать смотреть на перераспределение богатства, принадлежащего ее гражданам. Высшие классы должны иметь свои серебряные ложки. Насильно удалены."
 mtg_britain.45.a:1 "Настала очередь «Красной Фоксы»."
 mtg_britain.46.t:2 "[From.GetName] Требуется деколонизация"
 mtg_britain.46.d:1 "[From.GetNameDefCap] Мы выдвинули ультиматум с требованием немедленно последовать их примеру и предоставить полную независимость нашим колониальным владениям. Если мы этого не сделаем, они говорят, что они полны решимости поддержать свои требования военной силой."
 mtg_britain.46.a:1 "Тогда у нас нет выбора."
 mtg_britain.46.b:1 "Пусть попробуют."
 mtg_britain.47.t:1 "[From.GetName] Деколонизировать"
 mtg_britain.47.d:1 "[From.GetNameDefCap] Он деколонизировался в соответствии с нашими требованиями."
 mtg_britain.47.a:1 "Они способствуют эмансипации рабочего."
 mtg_britain.48.t:1 "[From.GetName] Отказ от требований"
 mtg_britain.48.d:1 "[From.GetNameDefCap] Мы отказались от наших требований деколонизироваться."
 mtg_britain.48.a:1 "Значит, это война."
 mtg_britain.49.t:1 "Великобритания предложила сотрудничество"
 mtg_britain.49.d:1 "[From.GetNameDefCap] Предложите сотрудничество с атакующими [GER.GetNameDef] с двух направлений. Если предположить, что они выдержат свою часть сделки и быстро начнут второй фронт, это может быть отличной возможностью."
 mtg_britain.49.a:1 "Отличная идея - давайте сделаем это."
 mtg_britain.49.b:1 "Это кажется самоубийством. Нам лучше подождать."
 mtg_britain.50.t:1 "[From.GetName] Принимает предложение"
 mtg_britain.50.d:1 "[From.GetNameDefCap] Мы приняли наше предложение, и они готовы напасть на Германию."
 mtg_britain.50.a:1 "Мы сокрушим немцев."
 mtg_britain.51.t:1 "[From.GetName] Отклонить предложение"
 mtg_britain.51.d:1 "[From.GetNameDefCap] Мы отклонили наше предложение. Они говорят, что у них нет враждебных намерений по отношению к немцам."
 mtg_britain.51.a:1 "Как жаль."
 mtg_britain.52.t:2 "[From.GetName] Запросить Альянс"
 mtg_britain.52.d:1 "[From.GetNameDefCap] Он обратился к нам с просьбой присоединиться к Коминтерну."
 mtg_britain.52.a:1 "Они товарищи-коммунисты, они на нашей стороне."
 mtg_britain.52.b:1 "Их коммунизм — не путь Сталина."
 mtg_britain.53.t:1 "[From.GetName] Запрос грантов"
 mtg_britain.53.d:1 "[From.GetNameDefCap] Он позволил нам стать членами Коминтерна. Теперь мы стоим на их стороне в защите трудящихся всего мира."
 mtg_britain.54.t:1 "[From.GetName] Отклоняет запрос"
 mtg_britain.54.d:1 "[From.GetNameDefCap] Мы отклонили нашу просьбу присоединиться к Коминтерну. Мы остаемся одни."
 mtg_britain.55.t:1 "Гражданская война коммунистов"
 mtg_britain.55.d:1 "Некоторые элементы нашей партии уже давно обвиняют нас в том, что мы лишь на словах прислушаемся к коммунистическим идеалам свободы и равенства. Эти элементы сейчас инициировали попытку переворота. Нам удалось удержаться у власти, но сейчас ситуация переросла в полномасштабную гражданскую войну."
 mtg_britain.55.a:1 "Предатели!"
 mtg_britain.56.t:1 "Гражданская война коммунистов закончилась"
 mtg_britain.56.d:1 "После изнурительной гражданской войны нам удалось восстановить контроль над ситуацией. Теперь мы можем начать очищать эти предатели в нашей стране."
 mtg_britain.56.a:1 "Не показывайте им милосердия."
 mtg_britain.57.t:1 "Мирный марш в [ENG_blackshirt_march_state.GetName]"
 mtg_britain.57.d:2 "Марш в [ENG_blackshirt_march_state.GetName] Это был огромный успех; Контрпротесты были на минимуме, и наши Чернорубашечники вели себя образцово. Всплеск популярности, вызванный этим, позволил нам добиться значительных политических успехов на благо нашего движения."
 mtg_britain.57.a:1 "Неумолимо маршировать к победе!"
 mtg_britain.58.t:1 "В марте [ENG_blackshirt_march_state.GetName]"
 mtg_britain.58.d:2 "Несмотря на некоторые контрпротесты и незначительные столкновения, марш в Нью-Йорке [ENG_blackshirt_march_state.GetName] Это был успех. Чернорубашечники сохранили честь партии, и мы продолжаем идти вперед к полной политической победе."
 mtg_britain.58.a:1 "Никто не может стоять на пути прогресса."
 mtg_britain.59.t:1 "Марш насилия в [ENG_blackshirt_march_state.GetName]"
 mtg_britain.59.d:2 "Марш в [ENG_blackshirt_march_state.GetName] Это привело к огромным контрпротестам и обширным уличным боям. Несмотря на большое количество раненых и даже некоторые смертельные случаи, наши чернорубашечники сумели противостоять устранителям неполадок, пока не вмешалась полиция."
 mtg_britain.59.a:1 "Что такое несколько разбитых яиц перед лицом будущего нации?"
 mtg_britain.60.t:1 "Мосли выступает против [GER.GetName]"
 mtg_britain.60.d:1 "Выдвигаются обвинения в том, что он просто [GER.GetLeader]Освальд Мосли сегодня выступил с воодушевляющей речью. В ней он утверждал уникальность и индивидуальность британского фашизма и подчеркивал различие между его политикой и политикой немецкого диктатора. В заключение он сказал: «Никто, кроме британца, не будет иметь власти над Британией!»"
 mtg_britain.60.a:1 "Общественный прием, кажется, довольно хороший."
 mtg_britain.61.t:1 "[From.GetName] Поддержка имперских лоялистов"
 mtg_britain.61.d:1 "Мы обратили внимание, что [From.GetNameDef] Мы поддерживаем лоялистов в нашей стране. Если их оставить без сопротивления, их подрывная деятельность вполне может завершиться полномасштабной гражданской войной!"
 mtg_britain.61.a:1 "Мы должны быть на ногах."
 mtg_britain.62.t:1 "[From.GetName] Двигайтесь к безопасным доминионам"
 mtg_britain.62.d:1 "Новый [From.GetAdjective] Правительство объявило о своем намерении подавить любое инакомыслие среди своих доминионов с помощью военной силы, если это необходимо. Хотя их армия будет растянута слишком тонко, чтобы сделать это по всей Империи, они явно намерены попытаться."
 mtg_britain.62.a:1 "Возможно, они придут за нами."
 mtg_britain.63.t:1 "[From.GetName] Принудительное военное право"
 mtg_britain.63.d:1 "Развернув свои силы на материке, [From.GetAdjective] Правительство объявило военное положение, временно приостановив работу правительства."
 mtg_britain.63.a:1 "Как они смеют?!"
 mtg_britain.64.t:1 "[From.GetName] Распространение пропаганды"
 mtg_britain.64.d:1 "The [From.GetAdjective] В настоящее время правительство начало распространять обширную идеологическую пропаганду, используя военное положение для подавления СМИ."
 mtg_britain.64.a:1 "Мы можем только надеяться, что это не слишком сильно повлияет на людей."
 mtg_britain.65.t:1 "[From.GetName] Заменить правительство"
 mtg_britain.65.d:1 "[From.GetNameDefCap]При поддержке нашего народа наше правительство было распущено, и мы призвали к новым выборам. Это был не что иное, как фарс, когда лояльное правительство одержало убедительную победу."
 mtg_britain.65.a:1 "Как ты смеешь, я имею в виду, править Британией!"
 mtg_britain.66.t:1 "Лояльность к Британии"
 mtg_britain.66.d:1 "The [From.GetAdjective] Правительство претерпело огромные политические изменения. Мы должны решить, оставаться ли нам верными сейчас, когда наши идеологические взгляды настолько различны."
 mtg_britain.66.a:1 "Мы не видим ничего плохого в таком положении вещей."
 mtg_britain.66.b:1 "Это неприемлемо! Мы объявим независимость!"
 mtg_britain.67.t:1 "[From.GetName] провозглашает независимость"
 mtg_britain.67.d:1 "[From.GetNameDefCap] Они сообщили нам, что не могут согласиться с выбранным нами идеологическим путем и поэтому не видят другого выхода, кроме как отделиться от Империи."
 mtg_britain.67.a:1 "Посмотрим, как долго это продлится."
 ENG_dominions_stayed_with_fascist_britain_flag:1 "Осталась с фашистской Британией."
 mtg_britain.68.t:2 "Коммунизм в Канаде"
 mtg_britain.68.d:1 "[ENG.GetNameDefCap] Продвигается через коммунистическое правительство в [FROM.GetNameDef]. Мы, конечно, не можем допустить появления такой идеологической угрозы на нашей самой границе?!"
 mtg_britain.68.a:1 "Мы будем решительно возражать."
 mtg_britain.68.b:1 "Мы ничего не можем сделать."
 mtg_britain.69.t:1 "[USA.GetName] Предметы для [CAN.GetAdjective] Коммунизм"
 mtg_britain.69.d:1 "[From.GetNameDefCap] Мы выдвинули ультиматум, требуя немедленно прекратить распространение коммунизма. [CAN.GetNameDef]."
 mtg_britain.69.a:1 "Пусть они попробуют выполнить это требование."
 mtg_britain.69.b:1 "Тогда у нас нет выбора, кроме как подчиниться."
 mtg_britain.70.t:1 "[From.GetName] Отказывается отступать"
 mtg_britain.70.d:1 "[From.GetNameDefCap] Мы отказались от наших требований и сообщаем нам, что у нас нет власти над нами. [CAN.GetAdjective] рабочих."
 mtg_britain.70.a:1 "Тогда мы должны заслужить свой авторитет военными средствами."
 mtg_britain.70.b:1 "Они назвали наш блеф - мы должны отступить."
 mtg_britain.71.t:1 "[From.GetName] Назад вниз"
 mtg_britain.71.d:1 "[From.GetNameDefCap] Они будут воздерживаться от распространения коммунизма в [CAN.GetNameDef]."
 mtg_britain.71.a:1 "Они знают, что для них лучше."
 ENG_ditched_the_italians_flag:1 "Мы отдалились от итальянцев в пользу британцев.\n"
 ENG_ditched_by_the_germans_flag:1 "Заброшенные немцами в пользу англичан.\n"
 ENG_democratic_civil_war_tt:1 "Сторонники демократии начинают гражданскую войну.\n"
 mtg_britain.34_tt:1 "Королевский флот возвращается под наш контроль.\n"
 ENG_communist_civil_war_tt:1 "Сторонники коммунизма начинают гражданскую войну.\n"
 mtg_britain.62_tt:1 "Британцы смогут подвести нас к своей идеологии в течение следующих 180 дней.\n"
 mtg_britain.68_tt:1 "Отказаться от всех усилий по обеспечению безопасности Канады.\n"
 mtg_britain.72.t:1 "Гражданские беспорядки на севере Индии"
 mtg_britain.72.d:2 "Попытка сохранить особое состояние на Индийском субконтиненте приводит к большим трениям. Религиозные различия начинают вызывать общественные беспорядки и столкновения, особенно на северо-западе и северо-востоке страны, в то время как видные люди используют все более враждебную риторику. Кризис не показывает никаких признаков замедления, и даже в Бирме люди говорят об отделении."
 mtg_britain.72.a:1 "Зловещий... Нам лучше подготовиться к худшему."
 mtg_britain.73.t:1 "Гражданская война в Индии"
 mtg_britain.73.d:1 "Напряженность на севере страны, наконец, достигла критической точки, и откровенное насилие между мусульманским и индуистским населением переросло в гражданскую войну. Сформировано временное мусульманское правительство, объявившее о полной независимости Пакистана и объявляющее о своей решимости защищать его военными средствами."
 mtg_britain.73.a:1 "Мы не можем позволить им так просто оторваться!"
 mtg_britain.73.b:1 "Это не стоит того, чтобы вести войну."
 mtg_britain.74.t:1 "Гражданская война с [PAK.GetName] Столлс"
 mtg_britain.74.d:1 "Наша война с [PAK.GetNameDef] Общественное мнение зашло в тупик и испортилось от бессмысленной гибели людей, не видя конца войне. Может быть, сейчас самое время начать мирные переговоры?"
 mtg_britain.74.a:1 "Настало время признать их независимость."
 mtg_britain.74.b:1 "Мы никогда не примем их независимость!"
 mtg_britain.75.t:1 "[RAJ.GetName] Признаем нашу независимость"
 mtg_britain.75.d:2 "[RAJ.GetNameDef] Он смирился с тем, что принял нашу независимость. Перед лицом резкого падения внутренней поддержки они считают, что нет смысла продолжать эту изнурительную войну."
 mtg_britain.75.a:1 "Наконец-то."
 mtg_britain.76.t:1 "Гражданская война в Пакистане"
 mtg_britain.76.d:1 "Культурные различия между Востоком и Западом [PAK.GetName] Это привело к росту напряженности, и теперь бангладешцы начали открытое восстание против того, что они считают «нашим угнетением». Маловероятно, что мы сможем вернуть район под контроль, не проливая крови."
 mtg_britain.76.a:1 "Тогда прольём кровь, мы должны."
 mtg_britain.76.b:1 "Это бессмысленно — мы должны принять их независимость."
 mtg_britain.77.t:1 "Гражданская война с [BAN.GetName] Столлс"
 mtg_britain.77.d:1 "Наша война с [BAN.GetNameDef] Общественное мнение зашло в тупик и испортилось от бессмысленной гибели людей, не видя конца войне. Может быть, сейчас самое время начать мирные переговоры?"
 mtg_britain.77.a:1 "Настало время признать их независимость."
 mtg_britain.77.b:1 "Мы никогда не примем их независимость!"
 mtg_britain.78.t:1 "[PAK.GetName] Признаем нашу независимость"
 mtg_britain.78.d:1 "[PAK.GetNameDef] Он смирился с тем, что принял нашу независимость. Перед лицом резкого падения внутренней поддержки они считают, что нет смысла продолжать эту изнурительную войну."
 mtg_britain.79.t:1 "[From.GetNameDefCap] Требует соблюдения"
 mtg_britain.79.d:1 "[From.GetNameDefCap] Сообщает нам, что они требуют прохода через нашу землю, чтобы напасть на своих врагов. [SOV.GetNameDef]. Они требуют нашего немедленного соблюдения, а также далеко идущего государственного надзора. Если мы этого не сделаем, они скажут, что у них нет другого выбора, кроме как передать свои силы через землю без нашего одобрения."
 mtg_britain.79.a:1 "По крайней мере, так мы не будем воевать с Советами в одиночку."
 mtg_britain.79.b:1 "Им придется вырвать наше согласие из наших холодных мертвых рук!"
 mtg_britain.80.t:1 "[From.GetNameDefCap] принимает требования"
 mtg_britain.80.d:1 "[From.GetNameDefCap] Мы приняли наши требования и дали нам обширный контроль над их территорией."
 mtg_britain.80.a:1 "Хорошо - через Кавказ и дальше в Сталинград!"
 mtg_britain.81.t:1 "[From.GetName] отвергает требования"
 mtg_britain.81.d:1 "[From.GetNameDefCap] Мы отвергли наши требования. По словам их представителей: «Если мы хотим их соблюдения, нам придется вырвать его из их холодных, мертвых рук!»"
 mtg_britain.81.a:1 "Они просили об этом."
 mtg_britain.82.t:0 "Имперская конференция [GetYear] года"
 mtg_britain.82.d:0 "В течение следующих двух месяцев представители британского правительства и доминионов соберутся в Лондоне, чтобы обсудить вопросы, касающиеся всей Империи. Это прекрасное время для обсуждения таких вопросов, как оборона, торговля или умиротворение, надеюсь, что это даст Империи наилучшие шансы на выживание в нынешнем кризисе.\n\nКроме того, это, возможно, лучшее время для окончательного решения вопроса об Имперской Федерации, уже неоднократно поднимавшегося на предыдущих Имперских конференциях. Будет ли будущее Британского Содружества Наций одним из свободных объединений независимых и суверенных наций, или сплоченной федерацией, которая может быть сильной перед лицом глобальных потрясений, вполне может быть решено в ближайшие месяцы."
 mtg_britain.82.a:0 "Давайте будем продвигать нашу повестку дня."
 mtg_britain.82.b:0 "Пусть наши голоса будут услышаны!"
 mtg_britain.82_tt:0 "Этот модификатор мнения будет удален, когда конференция будет завершена. Чем выше мнение участников, тем больше вероятность того, что они согласятся с вашими предложениями.\n"
 mtg_britain.83.t:0 "Имперская конференция: Оборона"
 mtg_britain.83.d:0 "В свете нынешнего глобального кризиса ясно, что мы больше не можем самостоятельно нести ответственность за имперскую оборону и поэтому должны больше полагаться на наши Доминионы. Каждое государство должно увеличить свои собственные расходы на оборону, чтобы все могло стать сильнее перед лицом того, что мир может бросить в нас."
 mtg_britain.83.a:0 "Будем надеяться, что доминионы согласятся."
 mtg_britain.83.b:0 "Потратьте дипломатические усилия, чтобы убедить Доминионы согласиться."
 mtg_britain.83.c:0 "Потратьте огромные дипломатические усилия, чтобы убедить Доминионы согласиться."
 mtg_britain.84.d:0 "[From.GetAdjective] Представители на конференции изъявили желание, чтобы Империя в целом больше тратила на перевооружение и оборону. Если мы согласимся, мы примем на себя бремя лучше заботиться о нашей собственной местной обороне и меньше полагаться на нее. [From.GetAdjective] Поддержка."
 mtg_britain.84.a:0 "Защита Империи зависит от всех нас."
 mtg_britain.84.b:0 "Наш бюджет на это не позволяет."
 mtg_britain.85.t:0 "Имперская конференция: Оборона [From.GetName] принимать"
 mtg_britain.85.d:0 "The [From.GetAdjective] Правительство уведомило нас о том, что они согласны с нашим предложением увеличить расходы на оборону. Они поклялись сделать это немедленно."
 mtg_britain.85.a:0 "Они выполняют свой долг перед Империей."
 mtg_britain.86.t:0 "Имперская конференция: Оборона [From.GetName] Отвергнутый"
 mtg_britain.86.d:0 "The [From.GetAdjective] Правительство информирует нас, что у них нет средств для увеличения расходов на оборону. Поэтому они вынуждены были отвергнуть наше предложение."
 mtg_britain.86.a:0 "Они снимают с нас защиту!"
 mtg_britain.87.t:0 "Имперская конференция: Торговля"
 mtg_britain.87.d:0 "Если Империя хочет процветать, мы должны расширить уже существующие преференциальные торговые соглашения. Мы предлагаем доминионам увеличить экспорт в промышленное сердце Британских островов, чтобы мы могли наиболее эффективно питать нашу промышленность."
 mtg_britain.88.d:0 "The [From.GetAdjective] Правительство выразило желание расширить преференциальные торговые соглашения, чтобы увеличить импорт, доступный для британского промышленного центра. Они утверждают, что более сильная Британия будет означать более сильную Империю в целом."
 mtg_britain.88.a:0 "От этого зависит выживание империи."
 mtg_britain.88.b:0 "Мы будем торговать, как захотим."
 mtg_britain.89.t:0 "Имперская конференция: Торговля [From.GetName] принимать"
 mtg_britain.89.d:0 "The [From.GetAdjective] Правительство уведомило нас о том, что они согласны с нашим предложением об увеличении экспорта. Они немедленно изменят свои торговые правила."
 mtg_britain.89.a:0 "Вместе мы будем процветать."
 mtg_britain.90.t:0 "Имперская конференция: Торговля [From.GetName] Отвергнутый"
 mtg_britain.90.d:0 "The [From.GetAdjective] Правительство отвергло наше предложение об увеличении экспорта и расширении программы преференциальной торговли. Они опасаются, что это негативно скажется на их внутреннем экономическом положении."
 mtg_britain.90.a:0 "Они думают только о себе!"
 mtg_britain.91.t:0 "Имперская конференция: экономика"
 mtg_britain.91.d:0 "Мощная экономика является основой, которая поддерживает всю Империю. Крайне важно, чтобы Доминионы не пренебрегали своим внутренним промышленным наращиванием, а вкладывали значительные средства в дальнейшее развитие индустриализации."
 mtg_britain.92.d:0 "[From.GetAdjective] Лидеры убедительно доказали важность нашего внутреннего промышленного наращивания. Они хотят, чтобы мы увеличили государственные инвестиции в этот сектор."
 mtg_britain.92.a:0 "Наша экономика должна быть сильной, чтобы выдержать шторм."
 mtg_britain.92.b:0 "У нас сейчас нет средств на это."
 mtg_britain.93.t:0 "Имперская конференция: экономика [From.GetName] принимать"
 mtg_britain.93.d:0 "The [From.GetAdjective] Правительство уведомило нас о том, что они согласны с нашим запросом об увеличении инвестиций в их отечественную промышленность. Эти средства будут немедленно освобождены."
 mtg_britain.93.a:0 "Их инвестиции окупятся красиво."
 mtg_britain.94.t:0 "Имперская конференция: экономика [From.GetName] Отвергнутый"
 mtg_britain.94.d:0 "The [From.GetAdjective] Правительство отклонило нашу просьбу об увеличении инвестиций в их отечественную промышленность. Они утверждают, что естественный рост принесет больше пользы сектору в долгосрочной перспективе."
 mtg_britain.94.a:0 "Они отнимают наше богатство!"
 mtg_britain.95.t:0 "Имперская конференция: Умиротворение"
 mtg_britain.95.d:0 "Политика умиротворения не обошлась без своих критиков среди Империи. Мы должны еще раз выдвинуть этот вопрос для обсуждения и признать, что, возможно, требуется изменение дипломатического тона, но для этого нужна поддержка Империи."
 mtg_britain.96.d:0 "[From.GetAdjective] Лидеры признают, что политика умиротворения, возможно, несовершенна, и готовы выдвинуть это на обсуждение. Они готовы изменить свою дипломатическую позицию, но сделают это только при поддержке Империи."
 mtg_britain.96.a:0 "Возможно, мы должны смириться с провалом умиротворения."
 mtg_britain.96.b:0 "Мы должны придерживаться нашей политики умиротворения."
 mtg_britain.97.t:0 "Имперская конференция: Умиротворение [From.GetName] принимать"
 mtg_britain.97.d:0 "The [From.GetAdjective] Правительство уведомило нас о том, что они согласны с тем, что умиротворение идет своим чередом и что для защиты наших глобальных интересов необходима более сильная позиция, даже если это может привести к войне."
 mtg_britain.97.a:0 "Они видят угрозу."
 mtg_britain.98.t:0 "Имперская конференция: Умиротворение [From.GetName] Отвергнутый"
 mtg_britain.98.d:0 "The [From.GetAdjective] Правительство не соглашается с нашими сомнениями по поводу умиротворения, утверждая, что мы не можем позволить себе быть втянутыми в войну и что мы должны поддерживать нашу политику умиротвения тех, кто хочет испытать нас."
 mtg_britain.98.a:0 "У них нет позвоночника!"
 mtg_britain.99.t:0 "Имперская конференция: Федерация"
 mtg_britain.99.d:0 "Концепции федеративного супергосударства, охватывающего всю Британскую империю, уже более полувека, но предыдущие имперские конференции не смогли прийти к решению по этому вопросу. У нас есть один последний шанс, прежде чем мы станем слишком настроенными на наш путь к домашнему правлению для Доминионов. Мы должны дать им понять, что это наилучшее возможное решение как для их народов, так и для Содружества Наций в целом."
 mtg_britain.100.d:1 "The [From.GetAdjective] Правительство вновь предложило создать федеральное супергосударство, охватывающее всю Британскую империю, в котором все государства-члены имели бы право голоса во внешней и внутренней политике. Они говорят, что это была бы жизнеспособная альтернатива понятию «домашнее правило», которое в конечном итоге привело бы к тому, что мы стали полностью независимыми."
 mtg_britain.100.a:0 "Вместе мы будем сильнее."
 mtg_britain.100_tt:0 "Если решение будет принято, вы получите:\n"
 mtg_britain.100.b:0 "Мы никогда не откажемся от своей независимости!"
 mtg_britain.101.t:0 "Имперская конференция: Федерация - [From.GetName] принимать"
 mtg_britain.101.d:0 "The [From.GetAdjective] Правительство уведомило нас о том, что они согласны с нашим предложением об имперской федерации. Они полностью поддерживают нас и будут стремиться подготовиться к интеграции, если движение будет продолжаться."
 mtg_britain.101.a:0 "Мы будем сильнее как один."
 mtg_britain.102.t:0 "Имперская конференция: Федерация - [From.GetName] Отвергнутый"
 mtg_britain.102.d:0 "The [From.GetAdjective] Правительство уведомило нас о том, что оно отвергло наше предложение о создании Императорской Федерации. Они считают эту концепцию неприемлемым посягательством на права своего народа. В стремлении к осуществлению неотъемлемого права народа на самоопределение единственным возможным путем вперед является установление внутреннего господства."
 mtg_britain.102.a:0 "Они не видят будущего..."
 mtg_britain.103.t:0 "Имперская конференция: Федерация - Успех"
 mtg_britain.103.d:0 "Движение Имперской Федерации было единодушным успехом. Теперь все вовлеченные стороны должны будут начать длительный процесс преобразования и интеграции своих правительств на федеральном уровне, чтобы в конечном итоге способствовать полной интеграции наших территорий."
 mtg_britain.103.a:0 "Это грандиозное событие для империи!"
 mtg_britain.104.t:0 "Имперская конференция: Федерация - частичный успех"
 mtg_britain.104.d:0 "Движение Имперской Федерации зашло в тупик. Хотя [CAN.GetNameDef], [SAF.GetNameDef], [AST.GetNameDef]и [NZL.GetNameDef] Приняли, что [RAJ.GetAdjective] Правительство ссылается на фундаментальные культурные различия, а также недостаточное уважение прав индийского государства в качестве причины для отклонения нашего предложения.\n\nТеперь мы должны решить, следует ли продвигаться вперед с теми Доминионами, которые согласились и тем самым предоставили грант. [RAJ.GetNameDef] независимость или вообще отложить предложение."
 mtg_britain.104.a:0 "Тогда наши пути должны разойтись."
 mtg_britain.104.b:0 "Без Индии мы ничто."
 mtg_britain.105.t:0 "Имперская конференция: Федерация - Провал"
 mtg_britain.105.d:0 "Без единодушной поддержки движение Имперской Федерации было побеждено. Поскольку интерес к этой альтернативе домашнему правилу уменьшается, а не увеличивается, предложение теперь определенно будет отменено в качестве темы будущих Имперских конференций. Вместо этого мы будем продолжать работать в направлении возможной реализации полной независимости."
 mtg_britain.105.a:0 "Тогда давайте сосредоточимся на более достижимых целях."
 mtg_britain.106.t:0 "[From.GetName] Требует соблюдения договора"
 mtg_britain.106.d:0 "[From.GetNameDefCap] Мы выдвинули ультиматум, требуя немедленно сократить количество столичных кораблей, чтобы привести нас в соответствие с положениями Вашингтонского морского договора. Они добавили, что если мы не подчинимся в течение 60 дней, они готовы сократить количество наших столичных кораблей с помощью военной силы."
 mtg_britain.106.a:0 "Они боятся нас."
 mtg_britain.107.t:0 "[From.GetName] Соблюдать договор"
 mtg_britain.107.d:0 "[From.GetAdjective] Представители извинялись за нарушение Вашингтонского морского договора и уверяют нас, что сократили количество своих столичных кораблей, чтобы привести их в соответствие с договорными условиями."
 mtg_britain.107.a:0 "Не позволяй этому повториться."
 mtg_britain.108.t:0 "[From.GetName] Отказывается от договора"
 mtg_britain.108.d:0 "The [From.GetAdjective] Они молчали по поводу своих договорных обязательств. Не было дано никаких указаний на сокращение их числа капитальных судов."
 mtg_britain.108.a:0 "Они больше не будут нас бросать."
 panay_inc_opinion_modifier:0 "Инцидент в Панае"
 panay_inc2_opinion_modifier:0 "Нападение на HMS Ladybird"
 panay_incident.2.t:0 "USS Panay затонул в Китае"
 panay_incident.2.d:0 "Пистолет USS Panay попал под обстрел сегодня, когда эвакуировал мирных жителей с линии фронта во время войны. [JAP.GetName] и [CHI.GetName]Несмотря на то, что они четко обозначены [USA.GetAdjective] Флаги. Пораженная двумя бомбами, она затонула в тот же день с тремя убитыми гражданами США и еще многими ранеными. Выжившие были задержаны [USA.GetAdjective] и [ENG.GetAdjective] канонерские лодки в этом районе.\n\n[JAP.GetNameDef] Поспешили заявить, что это был несчастный случай и принести извинения, но некоторые считают, что нападение было преднамеренным, и ряд советников призывают к войне. Тем не менее, общественная поддержка войны остается низкой, и любая декларация может вызвать глубокие разногласия. Как мы должны реагировать?"
 panay_incident.2.e:0 "Пистолет USS Panay попал под обстрел сегодня, когда эвакуировал мирных жителей с линии фронта во время войны. [JAP.GetName] и [CHI.GetName]Несмотря на то, что они четко обозначены [USA.GetAdjective] Флаги. Пораженная двумя бомбами, она затонула в тот же день с тремя убитыми гражданами США и еще многими ранеными. Выжившие были задержаны [USA.GetAdjective] и [ENG.GetAdjective] канонерские лодки в этом районе.\n\n[JAP.GetNameDef] Поспешили заявить, что это был несчастный случай и принести извинения, но некоторые считают, что нападение было преднамеренным, и ряд советников призывают к войне. Как мы должны реагировать?"
 panay_incident.2.a:0 "Вывод наших войск из Китая"
 panay_incident.2.a.tt:0 "Общественность глубоко обеспокоена иностранными проблемами. Этот инцидент никогда бы не случился, если бы наши военнослужащие не были в [CHI.GetName] В первую очередь. Вывод небольшого количества канонерских лодок и личного состава в Китае поможет улучшить внутреннюю стабильность, хотя это также отвлечет нас от будущих военных интервенций.\n\n"
 panay_incident.2.e.tt:0 "Поскольку поддержка войны растёт, выход из [CHI.GetName] сейчас подорвёт наши будущие попытки оправдать военные действия, хотя заверения общества в нашем стремлении к миру должны помочь внутренней стабильности.\n\n"
 panay_incident.2.b:0 "Требовать компенсации"
 panay_incident.2.b.tt:0 "Наше требование будет передано японскому правительству, и мы должны дождаться их ответа.\n\n"
 panay_incident.2.c:0 "Война!"
 panay_incident.2.c.tt:0 "В то время как наша гораздо более сильная промышленная база является ключевым преимуществом, низкая общественная поддержка сделает войну рискованным предложением и ограничит нашу способность участвовать в других глобальных событиях.\n\n"
 panay_incident.3.t:0 "[USA.GetName] требует извинений и компенсации"
 panay_incident.3.d:0 "В ответ на наше потопление USS Panay в начале этой недели, [USA.GetNameDef] Он потребовал извинений, наказания офицеров и компенсации. Несмотря на то, что наше правительство не отдало приказ о нападении, не совсем ясно, была ли это ошибка чрезмерно увлеченных пилотов или попытка военных сторонников жесткой линии поощрить нападение. [USA.GetNameDef] и [ENG.GetName] выводить свои силы из [CHI.GetName]. Некоторым в правительстве не понравится, если мы согласимся [USA.GetAdjective] Но отказ может означать войну."
 panay_incident.3.a:0 "Согласен [USA.GetAdjective] Условия"
 panay_incident.3.b:0 "Мы никогда не преклонимся перед декадентскими западниками!"
 panay_incident.3.b.tt:0 "отклоняющийся [USA.GetAdjective] Условия будут рассматриваться как демонстрация силы внутри страны, увеличение поддержки нашего правительства, но стоит ли риск войны с Россией? [USA.GetNameDef]?\n\n"
 panay_incident.4.t:0 "[JAP.GetName] соглашается предоставить компенсацию"
 panay_incident.4.d:0 "Мы получили ответ от [JAP.GetAdjective] Посол согласился с нашим требованием компенсации за потопление USS Panay.  В то время как общественное мнение в [USA.GetNameDef] наклониться [JAP.GetName] На эти события будут влиять еще какое-то время, война уже началась. \nПредотвращено."
 panay_incident.4.a:0 "К счастью [JAP.GetName] Увидел причину"
 panay_incident.5.t:0 "[JAP.GetName] Отказаться от компенсации"
 panay_incident.5.d:0 "Ясно, что [JAP.GetAdjective] Извинения за потопление USS Panay были лишь на словах, поскольку они прямо отказались от нашей просьбы о компенсации. Это ставит нас в трудное положение, поскольку страна не готова к тому, что будет непопулярной войной, но отступление нанесет нам политический ущерб и укрепит антиинтервенционистскую позицию общественности. Тем не менее, отступление от войны заверит избирателей в том, что правительство имеет в виду то, что оно говорит о том, чтобы избежать внешних связей."
 panay_incident.5.a:0 "Война не вернет USS Panay"
 panay_incident.5.b:0 "Мы сделаем [JAP.GetName] Плати!"
 panay_incident.6.t:0 "[USA.GetName] Уход из Китая"
 panay_incident.6.d:0 "Потери USS Panay вызвали опасения войны в США [USA.GetNameDef]. явно не хватает аппетита к конфронтации, [USA.GetAdjective] Политики успешно лоббировали вывод всех оставшихся [USA.GetAdjective] стрелковые катера и личный состав из Китая."
 panay_incident.6.a:0 "Их слабость — наша сила."
 mtg_netherlands.1.t:0 "Венесуэла предложила «защитить» острова ABC"
 mtg_netherlands.1.d:0 "Ссылаясь на нашу нынешнюю военную слабость после вторжения на нашу родину, [VEN.GetAdjective] Правительство выступило с предложением «помочь защитить» острова ABC от вражеских атак. Сомнительно, захотят ли они уйти, как только их помощь больше не потребуется."
 mtg_netherlands.1.a:0 "Это не идеально, но у нас нет выбора."
 mtg_netherlands.1.b:0 "Нет! Они хотят, чтобы острова были только для них самих."
 mtg_netherlands.1.c:0 "Дайте британцам контроль вместо этого, чтобы ситуация не обострилась."
 mtg_netherlands.1.e:0 "Дайте американцам контроль вместо этого, чтобы ситуация не обострилась."
 mtg_netherlands.2.t:0 "[From.GetNameDefCap] Принимаем наше предложение"
 mtg_netherlands.2.d:0 "The [HOL.GetAdjective] Правительство приняло наше предложение о предоставлении им «защиты» для островов ABC."
 mtg_netherlands.2.a:0 "Наша уловка удалась."
 mtg_netherlands.3.t:0 "[From.GetNameDefCap] Отклонить наше предложение"
 mtg_netherlands.3.d:0 "The [HOL.GetAdjective] Правительство отклонило наше предложение о предоставлении им «защиты» для островов ABC."
 mtg_netherlands.3.a:0 "Мы не позволим этому скользить!"
 mtg_netherlands.4.t:0 "[From.GetNameDefCap] Запросить нашу защиту на островах ABC"
 mtg_netherlands.4.d:0 "The [HOL.GetAdjective] Правительство попросило нас взять на себя защиту Кюрасао. С ними связались венесуэльцы под видом «предложения защиты» и опасаются, что боевые действия могут разразиться, если они откажутся от военной операции. [VEN.GetAdjective] \"Предложение\"."
 mtg_netherlands.4.a:0 "Мы примем это бремя."
 mtg_netherlands.4.b:0 "Мы не можем участвовать в территориальных спорах."
 mtg_netherlands.5.t:0 "[From.GetNameDefCap] Защита островов ABC"
 mtg_netherlands.5.d:0 "[From.GetNameDefCap] Он принял решение взять на себя ответственность за острова ABC."
 mtg_netherlands.5.a:0 "Это предпочтительнее альтернативы."
 mtg_netherlands.6.t:0 "[From.GetNameDefCap] Отказ защищать острова ABC"
 mtg_netherlands.6.d:0 "[From.GetNameDefCap] Он решил отказаться от принятия на себя ответственности за острова ABC. Они говорят, что не могут быть вовлечены в то, что они называют «местными территориальными спорами»."
 mtg_netherlands.6.a:0 "У нас нет другого выбора, кроме как принять [VEN.GetAdjective] Тогда предложи."
 mtg_netherlands.6.b:0 "Что ж, венесуэльцам это в любом случае не достанется!"
 ven_claims_abc_islands:0 "§YВенесуэла§! Он предложил «защитить» §YКюрасао§!.\n"
 mtg_netherlands.7.t:0 "[From.GetNameDefCap] Скачать линейный крейсер Plans"
 mtg_netherlands.7.d:0 "[From.GetNameDefCap] Мы попросили вас поделиться нашими планами относительно линейных крейсеров класса «Шарнхорст». Они хотят использовать их для создания своего собственного «Design 1047 линейный крейсер», чтобы дать им возможность проецировать власть в своих колониях Ост-Индии."
 mtg_netherlands.7.a:0 "Почему нет."
 mtg_netherlands.7.b:0 "Нет. Они могут создавать свои собственные корабли."
 mtg_netherlands.8.t:0 "[From.GetNameDefCap] Обсуждение линейный крейсер Plans"
 mtg_netherlands.8.d:0 "[From.GetNameDefCap] Мы решили поделиться с вами своими планами по созданию линейного крейсера класса «Шарнхорст»."
 mtg_netherlands.8.a:0 "Хорошие новости!"
 mtg_netherlands.9.t:0 "[From.GetNameDefCap] Отказывается делиться планами линейный крейсер"
 mtg_netherlands.9.d:0 "[From.GetNameDefCap] Решили не делиться с нами своими планами по линейному крейсеру класса «Шарнхорст»."
 mtg_netherlands.9.a:0 "Это самое печальное..."
 mtg_netherlands.10.t:0 "Новые правительственные формы"
 mtg_netherlands.10.d:0 "Пятый кабинет Колейна вновь, как и его предшественники, пал, а госминистра Дирка Яна де Гира попросили взять на себя ответственность за формирование нового правительства. В последний раз он служил в 1933 году и доказал свою способность служить своей стране в мирное время. Однако с ростом мировой напряженности неясно, как новый министр-президент будет справляться с руководством страной в войне, которая выглядит все более вероятной."
 mtg_netherlands.10.a:0 "Будем надеяться, что он более стабилен, чем предыдущий."
 mtg_netherlands.11.t:0 "Интерес японцев к Ост-Индии"
 mtg_netherlands.11.d:0 "Не секрет, что японцы проявляют огромный интерес к ресурсам нашей Ост-Индии. Нам доступны два варианта: либо предоставить японцам исключительные права на ресурсы, которые они хотят получить в наших колониях, либо дать им полный контроль над колониями вообще. Если мы хотим сохранить мирные отношения с [JAP.GetNameDef]Нам придется сделать выбор."
 mtg_netherlands.11.a:0 "Дайте им контроль над островами."
 mtg_netherlands.11.b:0 "Если дать им доступ к местным ресурсам, это может помочь сохранить нашу империю."
 mtg_netherlands.11.c:0 "Нам следует сотрудничать."
 mtg_netherlands.12.t:0 "[From.GetNameDefCap] Предлагает контроль над Ост-Индией"
 mtg_netherlands.12.d:0 "В интересах сохранения мира и осознания нашего интереса к богатому ресурсами району, [From.GetNameDefCap] Мы предложили передать всю Ост-Индию под наш контроль."
 mtg_netherlands.12.a:0 "Это было бы приемлемым решением нашего затруднительного положения."
 mtg_netherlands.12.b:0 "Они могут сохранить свои колонии - у нас есть альтернативные решения."
 mtg_netherlands.13.t:0 "[From.GetNameDefCap] Ост-Индский импорт"
 mtg_netherlands.13.d:0 "В интересах сохранения мира и осознания нашего интереса к богатому ресурсами району, [From.GetNameDefCap] Придумали решение. Вместо того, чтобы дать нам прямой контроль над этим районом, они предлагают предоставить нам исключительные права на ресурсы, найденные там."
 mtg_netherlands.13.a:0 "Это приемлемый компромисс."
 mtg_netherlands.13.b:0 "Этого «компромисса» недостаточно."
 mtg_netherlands.14.t:0 "Королева увольняет побежденных министров"
 mtg_netherlands.14.d:0 "Устав от обширного пораженчества, пронизывающего правительство, королева Вильгельмина настаивала на увольнении виновных министров. Президент-министр Де Гир, вместо того, чтобы публично потерять лицо, был вынужден уйти в отставку по «причинам здоровья». Надеемся, что он не доставит нам больше неприятностей в будущем...\n\nЕго замена, Питер Шёрдс Гербранди, уже отличился в своём отказе от пораженческих установок де Гира. Если он сохранит такое отношение на протяжении всей войны, он послужит прекрасным примером для остальной части кабинета."
 mtg_netherlands.14.a:0 "Гербранди — лучший выбор для руководства."
 mtg_netherlands.14.b:0 "Пусть правит оппозиционер Виллем Альбарда."
 mtg_netherlands.14.c:0 "Продвигать либеральные ценности вместе с Питером Аудом."
 mtg_netherlands.15.t:0 "[From.GetNameDefCap] Предложение Объединенных Нидерландов"
 mtg_netherlands.15.d:0 "[From.GetNameDefCap] Он предложил переформировать буферное государство, существовавшее после наполеоновских войн. Они ссылаются на свой вклад в военные усилия, по сравнению с относительной бесполезностью бельгийцев и люксембургцев, как на причину того, почему они должны быть не только вознаграждены, но и почему этот план поможет сохранить континентальный мир в будущем."
 mtg_netherlands.15.a:0 "Отличная идея."
 mtg_netherlands.15.b:0 "Пожалуй, нет."
 mtg_netherlands.16.t:0 "[From.GetNameDefCap] Поддержку предложения Нидерландов"
 mtg_netherlands.16.d:0 "Британцы положительно отреагировали на наше предложение об объединении Низких стран. Мы можем начать подготовку к интеграции земли, когда она будет освобождена."
 mtg_netherlands.16.a:0 "Отличная новость."
 mtg_netherlands.17.t:0 "[From.GetNameDefCap] Отклонить предложение Нидерландов"
 mtg_netherlands.17.d:0 "Британцы ясно дали понять, что они не очень высоко оценивают наше предложение об объединении Низких стран."
 mtg_netherlands.17.a:0 "Их неблагодарность глубока..."
 mtg_netherlands.18.d:0 "Мы обратили внимание на то, что британцы приняли предложение Нидерландов об объединении Низких стран под голландским флагом. С представителями нашего правительства не консультировались..."
 mtg_netherlands.18.a:0 "Так вот как затухает пламя свободы?"
 mtg_netherlands.19.t:0 "[From.GetNameDefCap] Приглашаем в Бенилюкс"
 mtg_netherlands.19.d:0 "Представители [HOL.GetAdjective] связались с нами и предложили тесное сотрудничество между государствами Нижних земель. Теперь они хотят получить нашу официальную поддержку этого проекта."
 mtg_netherlands.19.a:0 "Это самая отличная идея!"
 mtg_netherlands.19.b:0 "Нас это не интересует."
 mtg_netherlands.20.t:0 "[From.GetNameDefCap] Приглашения в Европейский Союз"
 mtg_netherlands.20.d:0 "Представители [HOL.GetAdjective] связались с нами и предложили тесное сотрудничество между малыми демократическими державами Европы. Теперь они хотят получить нашу официальную поддержку этого проекта."
 mtg_netherlands.21.t:0 "[From.GetNameDefCap] Стремление к колониальной интеграции"
 mtg_netherlands.21.d:0 "Из наших взаимодействий стало ясно, что [From.GetNameDefCap] Они стремятся обеспечить свой контроль над нашими делами. Уже сейчас некоторые незначительные дублирующие ветви власти считаются «ненужными», и с тех пор управление ими осуществляется непосредственно из Амстердама."
 mtg_netherlands.21.a:0 "Если они думают, что это лучше..."
 mtg_netherlands.22.t:0 "[From.GetNameDefCap] Перенесем столицу в Батавию"
 mtg_netherlands.22.d:0 "Представители правительства в изгнании сообщили нам, что правительство переедет в Батавию и отныне будет управлять колониями непосредственно оттуда. Наши услуги больше не требуются."
 mtg_netherlands.22.a:0 "Может быть, мы можем служить новому правительству каким-то другим способом..."
 mtg_netherlands.23.t:0 "[From.GetNameDefCap] Переезд в Ост-Индию"
 mtg_netherlands.23.d:0 "[From.GetNameDefCap] Мы принимаем наше предложение о захвате всей Ост-Индии."
 mtg_netherlands.23.a:0 "Мир был обеспечен."
 mtg_netherlands.24.t:0 "[From.GetNameDefCap] Принять Ост-Индские ресурсы"
 mtg_netherlands.24.d:0 "[From.GetNameDefCap] принимает наше предложение о получении исключительных прав на ресурсы Ост-Индии;"
 mtg_netherlands.25.t:0 "[From.GetNameDefCap] Отклонить наше предложение"
 mtg_netherlands.25.d:0 "[From.GetNameDefCap] Он сообщил нам, что наше предложение не представляет для них интереса."
 mtg_netherlands.25.a:0 "Как странно... И в отношении..."
 mtg_netherlands.26.t:0 "[From.GetNameDefCap] США требуют защиты Вест-Индии"
 mtg_netherlands.26.d:0 "The [HOL.GetAdjective] Правительство запросило нашу защиту в Вест-Индии. Они боятся нападений со стороны третьих сторон, которые сейчас переживают период военной слабости, и они предполагают, что конфликт в нашей сфере интересов может быть не в наших интересах."
 mtg_netherlands.26.a:0 "Мы не можем допустить иностранного вмешательства в Карибском бассейне."
 mtg_netherlands.26.b:0 "Они не должны презрительно говорить нам о наших интересах."
 mtg_netherlands.27.t:0 "[From.GetNameDefCap] Принять защиту Вест-Индии"
 mtg_netherlands.27.d:0 "[From.GetNameDefCap] Он решил защищать Вест-Индию. Наши колонии должны быть защищены от нападения."
 mtg_netherlands.27.a:0 "С США на нашей стороне трудно видеть, чтобы кто-то угрожал им."
 mtg_netherlands.28.t:0 "[From.GetNameDefCap] Отказ от защиты Вест-Индии"
 mtg_netherlands.28.d:0 "[From.GetNameDefCap] Он сообщил нам, что Вест-Индия не является их заботой, и они не хотят давать никаких заверений относительно защиты наших колоний."
 mtg_netherlands.28.a:0 "Это самое разочаровывающее..."
 mtg_netherlands.29.t:0 "[From.GetNameDefCap] Запросить оборудование"
 mtg_netherlands.29.d:0 "The [HOL.GetAdjective] Правительство обратилось к нам с просьбой о поставке оборудования. Они сообщают нам, что без помощи они не смогут вовремя вооружить свою армию для вторжения."
 mtg_netherlands.29.a:0 "Дайте им пехотное снаряжение."
 mtg_netherlands.29.b:0 "Дайте им вспомогательное оборудование."
 mtg_netherlands.29.c:0 "Дайте им артиллерийское оборудование."
 mtg_netherlands.29.e:0 "Им придется делать это самостоятельно."
 mtg_netherlands.30.t:0 "[From.GetNameDefCap] Отправляет оборудование"
 mtg_netherlands.30.d:0 "[From.GetNameDefCap] Мы отправили нам партию оборудования, чтобы помочь нашей ремилитаризации."
 mtg_netherlands.30.a:0 "Их помощь не будет забыта."
 mtg_netherlands.31.t:0 "[From.GetNameDefCap] Отказался от отправки оборудования"
 mtg_netherlands.31.d:0 "[From.GetNameDefCap] Они предлагают нам сосредоточить нашу собственную промышленность на производстве большего количества, если нам это нужно."
 mtg_netherlands.31.a:0 "Они переоценивают наши производственные мощности."
 mtg_netherlands.32.t:0 "[From.GetNameDefCap] Предлагается комбинированный кадровый план"
 mtg_netherlands.32.d:0 "[HOL.GetAdjective] Представители предложили разработать тайные планы персонала, позволяющие нам координировать нашу оборону в случае вторжения. Они сообщают нам, что крайне важно не обнародовать это, так как опасаются, что любое нарушение их нейтралитета приведет к войне."
 mtg_netherlands.32.a:0 "Превосходная идея!"
 mtg_netherlands.32_tt:0 "§Y[From.GetNameDefCap]§! Он получит бонус на защиту дивизии на основной территории в течение 180 дней после нападения западноевропейского майора.\n"
 mtg_netherlands.32.b:0 "Если они хотят нашей защиты, они должны официально присоединиться к нам."
 mtg_netherlands.33.t:0 "[From.GetNameDefCap] Принять комбинированный план персонала"
 mtg_netherlands.33.d:0 "[From.GetNameDefCap] Мы приняли наше предложение о совместном плане работы персонала."
 mtg_netherlands.33.a:0 "Замечательно!"
 mtg_netherlands.33_tt:0 "Мы получим бонус к обороне дивизии на основной территории в течение 180 дней после нападения западноевропейского майора.\n"
 mtg_netherlands.34.t:0 "[From.GetNameDefCap] Отклоняет комбинированный план"
 mtg_netherlands.34.d:0 "[From.GetNameDefCap] Мы отвергли наше предложение о совместном плане персонала — если мы хотим получить их помощь, мы должны запросить ее официально."
 mtg_netherlands.34.a:0 "Это невозможно."
 mtg_netherlands.35.t:0 "[From.GetNameDefCap] Запросы на обмен разведданными"
 mtg_netherlands.35.d:1 "[From.GetNameDefCap] Он предлагает обмениваться разведданными о вероятных врагах, с которыми мы можем столкнуться в бою, когда будем сражаться вместе."
 mtg_netherlands.35.a:0 "Это отличная идея!"
 mtg_netherlands.35_tt:0 "§Y[From.GetNameDefCap]§! Он будет получать целевые бонусы за атаку и защиту от агрессора в течение 180 дней после нападения западноевропейского майора.\n"
 mtg_netherlands.35_tt_2:0 "Мы получим точечный бонус за атаку и оборону против другого западноевропейского майора, если будем с ним воевать.\n"
 mtg_netherlands.35.b:0 "Мы не можем дать им разведданные, которые мы собрали."
 mtg_netherlands.36.t:0 "[From.GetNameDefCap] Договорились обменяться разведданными"
 mtg_netherlands.36.d:1 "[From.GetNameDefCap] Мы договорились обмениваться разведданными о вероятных врагах, с которыми мы можем столкнуться в бою."
 mtg_netherlands.36.a:0 "Это будет иметь большое значение для нашей обороны."
 mtg_netherlands.36_tt:0 "§Y[From.GetNameDefCap]§! Они получат целевой бонус за атаку и защиту от агрессора в течение 180 дней после начала войны с западноевропейским майором.\n"
 mtg_netherlands.36_tt_2:0 "Мы получим целевой бонус за атаку и защиту от нашего агрессора в течение 180 дней после нападения западноевропейского майора.\n"
 mtg_netherlands.37.t:0 "[From.GetNameDefCap] Отказ от обмена разведданными"
 mtg_netherlands.37.desc:0 "[From.GetNameDefCap] Они отказались делиться своей разведкой."
 mtg_netherlands.37.a:0 "Кажется, мы недостаточно надежны..."
 mtg_netherlands.41.t:0 "[From.GetNameDefCap] Обмен военными знаниями"
 mtg_netherlands.41.d:0 "[From.GetNameDefCap] Мы просим поделиться некоторыми нашими военными знаниями, что позволит им добиться больших успехов в военной доктрине."
 mtg_netherlands.41.a:1 "сильный [From.GetName] является полезным [From.GetName]."
 mtg_netherlands.41.b:1 "слабый [From.GetName] Это лучше. [From.GetName]."
 mtg_netherlands.42.t:0 "[From.GetNameDefCap] Делится военными знаниями"
 mtg_netherlands.42.d:0 "[From.GetNameDefCap] Он поделился с нами некоторыми своими доктринами и военными знаниями."
 mtg_netherlands.42.a:0 "Это будет иметь большое значение для модернизации наших вооруженных сил."
 mtg_netherlands.43.t:0 "[From.GetNameDefCap] Отказывается делиться военными знаниями"
 mtg_netherlands.43.d:0 "[From.GetNameDefCap] Они отказались делиться с нами своими военными знаниями."
 mtg_netherlands.43.a:0 "Они хотят, чтобы мы оставались слабыми?"
 mtg_netherlands.45.t:0 "Принц Бернхард участвовал в скандале"
 mtg_netherlands.45.d:0 "Принц Бернхард оказался замешан в скандале. Хотя его свободолюбивая натура иногда может быть благословением, похоже, что она также может оказаться проклятием. Теперь правительство вынуждено тратить ценные ресурсы на то, чтобы сгладить репутацию принца на публике."
 mtg_netherlands.45.a:0 "Крайне прискорбно."
 mtg_netherlands.46.t:0 "Принц Бернхард произвел хорошее впечатление"
 mtg_netherlands.46.d:0 "Принц Бернхард в последнее время произвел исключительное впечатление на публику, поднимая настроение и давая надежду на окончательную победу, куда бы он ни пошел. Хотя технически это не представитель правительства, это не помешало нам извлечь выгоду из этого неожиданного успеха."
 mtg_netherlands.46.a:0 "Настоящий оранжевый отпрыск."
 mtg_netherlands.47.t:0 "Принц Бернхард подает хороший пример"
 mtg_netherlands.47.d:0 "В своих отношениях с другими пилотами принц Бернхард показал хороший пример поведения и боевых полетов. С этим свежим в памяти примером командиры уже могут заметить небольшое, но заметное улучшение в бою с собаками в нашем небе."
 mtg_netherlands.47.a:0 "Он хорошо летает."
 mtg_netherlands.48.t:0 "Принц Бернхард подал плохой пример"
 mtg_netherlands.48.d:0 "В наглой самоуверенности принц Бернхард, похоже, дал коллегам-пилотам «некоторые указания», что с тактической точки зрения контрпродуктивно и часто откровенно опасно. Акты безрассудной храбрости уже увеличили потери."
 mtg_netherlands.48.a:0 "Безрассудный..."
 mtg_netherlands.48.b:0 "Мы должны дискредитировать \"наводчиков\" принца, чтобы спасти ситуацию."
 mtg_netherlands.49.t:0 "Принц Бернхард вмешивается в стратегию"
 mtg_netherlands.49.d:0 "Похоже, принц Бернхард активно вмешивался в последние планы сражений. К счастью, кажется, что совет был здравым, и планы, похоже, пожинают отличные результаты."
 mtg_netherlands.49.a:0 "У него отличный ум."
 mtg_netherlands.50.t:0 "Принц Бернхард вмешивается в стратегию"
 mtg_netherlands.50.d:0 "Похоже, принц Бернхард активно вмешивался в последние планы сражений. Используя свое положение и титул, а также свою обычную браваду и уверенность, он заставлял замолчать тех, кто не согласен с его предложениями. Ряд планов боевых действий в настоящее время, по-видимому, демонстрируют фундаментальные недостатки при реализации."
 mtg_netherlands.50.a:0 "Слишком поздно действовать..."
 mtg_netherlands.50.b:0 "Наши генералы должны игнорировать его советы, даже если это запятнает репутацию принца."
 mtg_netherlands.51.t:0 "Принц Бернхард хочет собрать разведданные"
 mtg_netherlands.51.d:0 "В последние недели было недостаточно информации для разработки соответствующих боевых планов, и, когда на недавнем совещании персонала стало известно об этом, принц Бернхард настаивал на использовании своих личных связей в военных целях. [GER.GetNameDef] Чтобы дать нам интеллект, в котором мы так нуждаемся."
 mtg_netherlands.51.a:0 "Превосходная идея!"
 mtg_netherlands.51.b:0 "Мы не можем полагаться на то, что он найдет!"
 mtg_netherlands.52.t:0 "Принц Бернхард собрал хорошую разведку"
 mtg_netherlands.52.d:0 "Похоже, что интеллект, собранный принцем, был очень полезен в этой области. Множественные успехи можно напрямую отнести к информации, переданной из его контактов."
 mtg_netherlands.52.a:0 "Он является заслугой секретной службы."
 mtg_netherlands.53.t:0 "Принц Бернхард собрал плохую разведку"
 mtg_netherlands.53.d:0 "Казалось бы, собранный князем интеллект не был самым точным... Противник неоднократно наносил удары в местах, которые мы не знали о войсках, чтобы укрепить другие точки, где мы ожидали падения ударов."
 mtg_netherlands.53.a:0 "Это была игра, которую мы взяли..."
 mtg_netherlands.54.t:0 "Принц Бернхард пытается организовать сопротивление"
 mtg_netherlands.54.d:0 "В то время как разговор на недавнем собрании сотрудников касался отсутствия сопротивления на нашей оккупированной родине, принц Бернхард, похоже, взял на себя ответственность за то, чтобы «привести его в форму» лично. Он уже готовится к падению с парашютом в тылу противника."
 mtg_netherlands.54.a:0 "Он должен делать то, что считает правильным."
 mtg_netherlands.54.b:0 "Это слишком опасно, мы должны это запретить!"
 mtg_netherlands.55.t:0 "Принц Бернхард организовал сопротивление"
 mtg_netherlands.55.d:0 "Эвакуировавшись на подводной лодке, усилия принца уже ощущаются. Сопротивление намного эффективнее и гораздо активнее."
 mtg_netherlands.55.a:0 "Поразительное достижение."
 mtg_netherlands.56.t:0 "Принц Бернхард пострадал от организационного сопротивления"
 mtg_netherlands.56.d:0 "В его усилиях организовать сопротивление набег оккупанта оставил его раненым. С тех пор он был эвакуирован подводной лодкой, но пройдет некоторое время, прежде чем он вернется к полной боевой силе."
 mtg_netherlands.56.a:0 "Его храбрость не была вознаграждена успехом, на этот раз."
 mtg_netherlands.58.t:0 "Принц Бернхард создал дипломатический ряд"
 mtg_netherlands.58.d:0 "На недавней встрече с иностранными высокопоставленными лицами, похоже, принц Бернхард создал дипломатический скандал. The [HOL_bernhard_row_target.GetAdjective] Представители обвинили его во вмешательстве во внутренние дела, причем не очень тонко."
 mtg_netherlands.58.a:0 "Это самое неловкое..."
 mtg_netherlands.59.t:0 "Дипломатический ряд с [From.GetName]"
 mtg_netherlands.59.d:0 "На недавней встрече с некоторыми из наших высокопоставленных лиц голландский принц Бернхард вступил в дипломатический скандал с одним из наших представителей. Он обвинил принца во «вмешательстве во внутренние дела»."
 mtg_netherlands.59.a:0 "Это касается... Будем надеяться, что она не обострится."
 mtg_netherlands.60.t:0 "[From.GetNameDef] Эскалация дипломатических рядов"
 mtg_netherlands.60.d:0 "Власти [HOL.getAdjective] обострили дипломатический спор и в довольно враждебных выражениях требуют от нас официальных извинений."
 mtg_netherlands.60.a:0 "Пусть принесут."
 mtg_netherlands.60.b:0 "Мы должны смягчить напряженность."
 mtg_netherlands.61.t:0 "[From.GetNameDef] Эскалация Row Further"
 mtg_netherlands.61.d:0 "[From.GetNameDef] Он не отступил и отказался принести извинения за оскорбительные обвинения и клевету, направленные против принца Бернхарда. Верны они или нет, и князь вмешался во внутренние дела, это не считая того - мы сейчас достигли переломного момента в международных отношениях."
 mtg_netherlands.61.a:0 "Значит, это война."
 mtg_netherlands.62.t:0 "[From.GetNameDef] Успокаивает напряженность"
 mtg_netherlands.62.d:0 "The [From.GetAdjective] В настоящее время правительство отступило и принесло извинения за обвинения, выдвинутые против принца Бернхарда. Вмешивался ли он в их внутренние дела или нет, еще предстоит выяснить, но пока он, по крайней мере, решил затаиться на этом фронте."
 mtg_netherlands.62.a:0 "Очень хорошо."
 mtg_netherlands.63.t:0 "Золотые резервы эвакуированы"
 mtg_netherlands.63.d:1 "Перед капитуляцией, когда стало ясно, что битва проиграна, мы успешно выполнили наш план по эвакуации наших золотых запасов нашим новым союзникам. Золото, хранившееся на борту судов и готовое к отплытию в любое время, теперь благополучно прибыло в нашу принимающую страну и должно оказать огромную помощь нашему правительству в изгнании."
 mtg_netherlands.63.a:0 "К счастью, у нас было предвидение, чтобы подготовиться к этому."
 mtg_netherlands.64.t:0 "Zuiderzee работает над развитием инфраструктуры Spark"
 mtg_netherlands.64.d:0 "Работа над «Флевопольдером» началась хорошо, и хотя еще много лет осталось до того, как проект будет полностью завершен, мы уже можем пожинать плоды нашего тяжелого труда.\n\nПолучив практический опыт реализации проекта мелиорации земель такого масштаба, инженеры разработали новые методы строительства дорог, железных дорог и водных путей. Если бы мы инвестировали в эти достижения, мы могли бы добиться значительных улучшений в этих областях в обозримом будущем."
 mtg_netherlands.64.a:0 "Звучит как отличная идея!"
 mtg_netherlands.64.b:0 "У нас сейчас нет средств на это."
 mtg_netherlands.65.t:0 "Zuiderzee работает над промышленными достижениями"
 mtg_netherlands.65.d:0 "По мере того, как продолжается прогресс на Flevopolder, растет и индустрия, поставляющая этот масштабный проект. Инженеры, занимающиеся поставкой строительных материалов для проекта, теперь получили новые знания в области развития промышленности и строительства заводов и верфей. Если бы мы инвестировали в эти достижения, мы могли бы добиться значительных улучшений в этой области в обозримом будущем."
 mtg_germany.1.t:0 "[From.GetName] Требует соблюдения"
 mtg_germany.1.d:0 "Как мы недавно отказались от их торговых требований, [From.GetNameDef] Мы должны немедленно присоединиться к ним или столкнуться с их военной мощью."
 mtg_germany.1.a:0 "Тогда мы присоединимся к ним."
 mtg_germany.1.b:0 "Тогда мы с ними столкнемся."
 mtg_germany.2.t:0 "[From.GetName] Соблюдать"
 mtg_germany.2.d:0 "The [From.GetAdjective] Правительство положительно отреагировало на наши требования и окажет нам помощь в наших войнах."
 mtg_germany.3.t:0 "[From.GetName] Отвергает соблюдение"
 mtg_germany.3.d:0 "The [From.GetAdjective] Правительство отвергло наши требования, несмотря на угрозы применения военной силы."
 mtg_germany.3.a:0 "После этого они выбрали смерть."
 mtg_exile_government.2.title:0 "The [From.GetAdjective] Правительство в изгнании"
 mtg_exile_government.2.desc:0 "[From.GetLeader] Он официально запросил разрешение у [Root.GetAdjective] Правительство вернется к [From.GetNameDef] и восстановить временный [From.GetRulingPartyLong] кабинета в рамках подготовки к послевоенному миру."
 mtg_exile_government.2.a:0 "Пришло время им вернуться на свою территорию."
 mtg_exile_government.2.b:0 "Время еще не созрело."
 mtg_exile_government.3.title:0 "[From.GetName] Запросы на интеграцию ВМС"
 mtg_exile_government.3.desc:0 "The [From.GetAdjective] Военно-морское руководство представило нам план интеграции нашего флота в их состав. Они утверждают, что, допуская [From.GetAdjective] Планировщики военно-морского флота, чтобы иметь полный контроль над нашими кораблями, их эффективность будет резко увеличена по сравнению с их нынешними независимыми действиями."
 mtg_exile_government.3.a:0 "Мы согласны."
 mtg_exile_government.3.b:0 "Мы не будем служить под ними."
 mtg_exile_government.4.title:0 "[From.GetName] Принять военно-морскую интеграцию"
 mtg_exile_government.4.desc:0 "The [From.GetAdjective] Правительство сообщило нам, что они согласны с нашим предложением и что отныне их корабли будут действовать под нашим командованием."
 mtg_exile_government.5.title:0 "[From.GetName] Отказ от военно-морской интеграции"
 mtg_exile_government.5.desc:0 "The [From.GetAdjective] Правительство сообщило нам, что их флот никогда не будет служить под командованием иностранной державы. Они хотят помочь нам, но они должны сделать это самостоятельно."
 mtg_exile_government.5.a:0 "Они ставят свою гордость выше интересов альянса."
 mtg_generic.1.title:0 "[From.GetNameDefCap] Принуждение правительства к переменам"
 mtg_generic.1.desc:0 "Ссылаясь на явное отсутствие электоральной поддержки нашего нынешнего правительства, [From.GetNameDef] Он потребовал перемен в политике."
 mtg_generic.1.a:0 "У нас нет выбора, кроме как согласиться."
 mtg_news.13.desc:0 "The [From.GetAdjective] Правительство объявило о проведении двенадцатой Императорской конференции. В течение следующих двух месяцев представители [From.GetAdjective] Правительство и Доминионы соберутся в Лондоне, чтобы обсудить вопросы, которые касаются всей Империи.\n\nЧто это будет значить для глобальных дел пока неясно, но вполне возможно, что в дискуссии войдет тема Императорской федерации, формирование которой, вероятно, будет иметь значительные последствия для сверхдержав мира."
 mtg_news.13.a:0 "Судьба Империи висит на волоске."
 mtg_news.13.b:0 "Нам нужно многое обсудить."
 mtg_news.13.c:0 "Мы будем внимательно следить за развитием событий."
 mtg_news.14.t:0 "[From.GetNameDefCap] Пересмотр колониальной политики"
 mtg_news.14.desc:0 "Сегодня в речи, [From.GetLeader] Он объявил об изменении колониальной политики страны. признавая права всех народов на самоопределение, [From.GetAdjective] Правительство решило поставить всех подданных империи на путь к независимости, заключение которой должно произойти в обозримом будущем».\n\nВ ответ на опасения, что это сильно ослабит [From.GetNameDef]Положение в мире, [From.GetLeader] Все страны, которые хотят сделать это, будут приветствоваться в качестве члена недавно созданного сообщества наций, но затем в качестве полностью равноправных и независимых партий. Остается выяснить, примут ли какие-либо страны это предложение."
 mtg_news.14.a:0 "Это правильное решение."
 mtg_news.14.b:0 "Независимость ждет нас."
 mtg_news.14.c:0 "Они сошли с ума."
 mtg_news.14.d:0 "Будем надеяться, что эта чепуха не повлияет на наше имущество!"
 mtg_news.14.e:0 "Крах капитализма неизбежен!"
 mtg_news.15.t:0 "Деколонизация Британской империи"
 mtg_news.15.desc:0 "Сегодня в полночь была осуществлена долгожданная передача полного суверенитета различным подданным Британской империи. Несмотря на то что [From.GetAdjective] Правительство предложило бывшим подданным присоединиться к [From.GetFactionName]Многие из них решили пойти своим путем.\n\nЭтот шаг по-прежнему вызывает споры внутри страны, но социалисты во всем мире приветствуют его. Какую слабость это вызвало [From.GetNameDef]Позиция страны в мире остается незамеченной, как и положение тех стран, которые выбрали свой собственный путь."
 mtg_news.15.a:0 "Будущее было неизбежным, поэтому мы сделали его настоящим."
 mtg_news.15.b:0 "Конец эпохи."
 mtg_news.16.t:0 "[From.GetName] Дезавуировать умиротворение"
 mtg_news.16.desc:0 "В сегодняшнем публичном выступлении новый [From.GetAdjective] Премьер-министр [From.GetLeader] Они объявили о намерении нового правительства уклониться от курса умиротворения, который их предшественники лояльно поддерживали. В недвусмысленных выражениях, [From.GetLeader] Он ясно дал понять, что [From.GetNameDef]Цель состоит в том, чтобы «положить конец маршу тирании, где бы она ни поднимала свою уродливую голову».\n\nБудет ли угроза войны служить для прекращения экспансионизма некоторых стран, еще предстоит выяснить, но уже сейчас программы вербовки находятся на пути к успеху. [From.GetNameDef], подтверждая достоверность своих заявлений."
 mtg_news.16.a:0 "Время успокоиться закончилось. Сейчас мы провели черту."
 mtg_news.16.b:0 "Британцы бросили перчатку."
 mtg_news.17.t:0 "[From.GetNameDefCap] Соблюдайте морские договоры"
 mtg_news.17.desc:0 "The [From.GetAdjective] Сегодня правительство объявило о своем намерении бороться с нарушениями Вашингтонского военно-морского договора 1922 года. Любое государство, подписавшее соглашение, которое нарушило указанное в нем соотношение 5:5:3:1.75:1,75, скорее всего, получит немедленную помощь. [From.GetAdjective] Ультиматумы с требованием сократить их численность до квот, отведенных им в договоре.\n\nДо сих пор глобальный ответ был одним из недоверия, что британцы пойдут на войну из-за этого."
 mtg_news.17.a:0 "Но мы это сделаем."
 mtg_news.17.b:0 "Мы должны ожидать их ультиматума в любое время сейчас."
 mtg_news.17.c:0 "Британцы очень серьезно относятся к своему военно-морскому превосходству."
 mtg_news.18.t:0 "[From.GetNameDefCap] Континентальное вмешательство"
 mtg_news.18.desc:1 "\nThe [From.GetAdjective] Сегодня правительство объявило о своем намерении «восстановить баланс сил в Европе», если это будет необходимо с использованием военной силы. Континентальный европейский империализм «является угрозой для национальной безопасности Великобритании и поэтому должен быть сдержан», — заявил премьер-министр. [From.GetLeader].\n\nЧто именно это означает, пока неясно, но нация мобилизовалась и, похоже, готова к войне."
 mtg_news.18.a:0 "Мы не можем больше ждать, пока они станут сильнее."
 mtg_news.18.b:0 "Они идут за нами."
 mtg_news.18.c:0 "Линия была пересечена."
 mtg_news.19.t:0 "[From.GetLeader] Расширение прав и возможностей королевской партии"
 mtg_news.19.desc:0 "Королевский брак между королем [From.GetLeader] и Уоллис Симпсон, король теперь назначил лидеров недавно сформированной промонархической «Партии короля», Уинстона Черчилля, Освальда Мосли и Дэвида Ллойд Джорджа, чтобы сформировать новое правительство после длительного периода страны без него.\n\nСторонники [From.GetLeader] Они аплодируют формированию лояльного правительства, но критики указывают на то, что новое правительство настолько поддерживает пожелания короля, что мы могли бы с таким же успехом считать короля де-факто абсолютистским монархом."
 mtg_news.19.a:0 "Боже, спаси короля!"
 mtg_news.19.b:0 "Шаг в прошлое."
 mtg_news.20.t:0 "[ITA.GetAdjective] Дипломатическая изоляция"
 mtg_news.20.desc:0 "Дипломатические отношения между [ITA.GetNameDef] и [GER.GetNameDef] В последнее время ситуация изменилась к худшему, и ряд незначительных дипломатических инцидентов был захвачен правительством. [GER.GetAdjective] Правительство разжигает враждебную риторику. Хотя в последние годы итало-германские отношения начали улучшаться, эти новые события, похоже, фактически исключают любое будущее сотрудничество между двумя европейскими державами.\n\nКритики указывают на одновременные улучшения в англо-германских отношениях, а также на «удобство» этого процесса. [ITA.GetAdjective] Дипломатическая изоляция обеспечивает британцам, что может указывать на сделки между двумя странами."
 mtg_news.20.a:0 "Немцы оказали нам большую услугу."
 mtg_news.20.b:0 "Этот путь дает нам лучшие перспективы."
 mtg_news.20.c:0 "В этом виноваты адские махинации британцев!"
 mtg_news.20.d:0 "Англичане готовят..."
 mtg_news.21.t:0 "Англо-германский альянс"
 mtg_news.21.desc:0 "The [ENG.GetAdjective] и [GER.GetAdjective] Правительства объявили о заключении пакта о взаимной военной помощи, а также указали на свое намерение «уважать сферу интересов другого». Не все могут быть удивлены, увидев такое развитие событий. [GER.GetNameDef]все более про-[ENG.GetAdjective] В последние месяцы риторика, но терминология договора вызвала негодование у многих экспертов и даже заставила некоторых выпустить предупреждения о том, что это может означать для Европы."
 mtg_news.21.a:0 "Никто не может встать у нас на пути."
 mtg_news.21.b:0 "Моря были обеспечены."
 mtg_news.21.c:0 "Мы должны быть осторожны..."
 mtg_news.22.t:0 "Англо-германский пакт"
 mtg_news.22.desc:0 "The [ENG.GetAdjective] и [GER.GetAdjective] Правительства объявили о пакте о ненападении и невмешательстве. Дополнительные условия включают пункт, указывающий на их намерение «уважать сферу интересов другого». Не все могут быть удивлены, увидев такое развитие событий. [GER.GetNameDef]все более про-[ENG.GetAdjective] В последние месяцы риторика, но критики все еще предупреждают о том, что это может означать для Европы."
 mtg_news.22.a:0 "Материк обеспечен."
 mtg_news.22.b:0 "Наши фланги защищены."
 mtg_news.22.c:0 "Они разъединяют мир..."
 mtg_news.23.t:0 "Черные рубашки организуются в [From.GetName]"
 mtg_news.23.desc:0 "Под руководством Освальда Мосли Британский союз фашистов начал организованную кампанию маршей по всей стране, стремясь таким образом увеличить число фашистских сторонников по всей стране. [From.GetNameDef].\n\nНасильственная контрреакция антифашистских элементов общественности уже вызвала ряд уличных боев, однако неясно, будет ли поддерживаться стабильность или политические беспорядки станут еще хуже. Б.У.Ф. Лидеры, со своей стороны, уже пообещали не останавливаться, «пока они не пройдут маршем по Даунинг-стрит и не потребуют смены правительства»."
 mtg_news.23.a:0 "Мы выйдем из горнила сильнее, чем когда-либо."
 mtg_news.23.b:0 "Посмотрим, удастся ли им избежать гражданской войны."
 mtg_news.24.t:0 "Англо-итальянский альянс"
 mtg_news.24.desc:0 "Небывалый шаг, новый [Root.GetAdjective] Правительство дистанцировалось от своих союзников в Великой войне. [FRA.GetNameDef]Вместо этого они объявили о союзе с итальянцами. Этот резкий сдвиг в верности вызвал шоковые волны на европейской дипломатической сцене, и особенно вызывает подозрения в отношении европейских дипломатов. [FRA.GetNameDef] и [GER.GetNameDef], последний из которых уже стал объектом неоднократных враждебных высказываний [From.GetLeader]."
 mtg_news.24.a:0 "Французы в любом случае были бесполезны."
 mtg_news.24.b:0 "Мы, настоящие фашисты, должны объединиться."
 mtg_news.24.c:0 "Никогда не доверяйте Росбифам!"
 mtg_news.24.d:0 "Мы протестуем!"
 mtg_news.24.e:0 "Это очень важный британский дипломатический маневр."
 mtg_news.25.t:0 "Гибралтар вернулся в Испанию"
 mtg_news.25.desc:0 "The [Root.GetAdjective] Сегодня правительства Испании опубликовали совместное заявление, объявив о возвращении Гибралтара националистической Испании, а также закрепив новый договор о военном сотрудничестве между двумя державами."
 mtg_news.25.a:0 "Это была необходимая торговля."
 mtg_news.25.b:0 "Награда того стоила."
 mtg_news.25.c:0 "Интересное развитие..."
 mtg_news.26.t:0 "Империалистическая гражданская война [From.GetName]"
 mtg_news.26.desc:0 "\nИмперские элементы в [From.GetName] Они подняли открытое восстание против правительства, требуя немедленного возвращения нации в качестве доминиона Британской империи. В настоящее время ситуация обострилась до полномасштабной гражданской войны, и [From.GetAdjective] Правительство обвинило [ENG.GetNameDef] снабжения повстанцев современными вооружениями и боеприпасами, которые им необходимы; [ENG.GetAdjective] Правительство категорически отрицает."
 mtg_news.26.a:0 "Они могут обвинить нас во всем, что им нравится."
 mtg_news.26.b:0 "Проклятое британское вмешательство!"
 mtg_news.26.c:0 "Они придут за всеми нами."
 mtg_news.26.d:0 "Подпольная тактика..."
 mtg_news.27.t:0 "[ENG.GetNameDefCap] союзники [From.GetAdjective] Имперские лоялисты"
 mtg_news.27.desc:1 "\nThe [ENG.GetAdjective] Сегодня правительство объявило, что оно примет молодое имперское лоялистское правительство в качестве государственного чиновника. [From.GetNameDef] под его защитой.[From.GetNameDefCap] Сейчас идет гражданская война, и это свидетельствует о том, что [ENG.GetNameDef] Отныне он будет принимать более активное участие во внутриполитических конвульсиях страны."
 mtg_news.27.a:0 "Мы должны поприветствовать их возвращение в лоно."
 mtg_news.27.b:0 "Как они смеют?!"
 mtg_news.27.c:0 "Мы должны объединиться против англичан."
 mtg_news.27.d:0 "Хитрая тактика."
 mtg_news.28.t:0 "[From.GetNameDefCap] Предложения для [ENG.GetNameDef]"
 mtg_news.28.desc:0 "\nВ ответ на a [ENG.GetAdjective] Ультиматум, требующий свободного прохождения [ENG.GetAdjective] воинских частей через их территорию, а также далеко идущий контроль над их внутренними делами, [From.GetAdjective] Теперь правительство объявило, что оно подчинится.[ENG.GetAdjective] Чиновники уже находятся на месте, чтобы установить контроль над внутренними делами страны."
 mtg_news.28.a:0 "Они приняли правильное решение."
 mtg_news.28.b:0 "У нас не было выбора..."
 mtg_news.28.c:0 "Нас принуждали."
 mtg_news.28.d:0 "Англичане вооружили их..."
 mtg_news.29.t:0 "[From.GetNameDefCap] Отвергнутый [ENG.GetAdjective] Ультиматум"
 mtg_news.29.desc:0 "\nThe [From.GetAdjective] Правительство отклонило [ENG.GetAdjective] Ультиматум, требующий свободного прохождения [ENG.GetAdjective] воинские части через свою территорию, а также далеко идущий контроль над своими внутренними делами.[From.GetLeader] Правительство заявило, что ожидает [ENG.GetAdjective] В ответ на это они подняли свою армию на высокую боевую готовность."
 mtg_news.29.a:0 "И боятся, что они будут."
 mtg_news.29.b:0 "Пусть приходят."
 mtg_news.29.c:0 "Они не оставили нам альтернативы."
 mtg_news.29.d:0 "Британцы на тропе войны."
 mtg_news.30.t:0 "[From.GetNameDefCap] Двигайтесь к безопасным доминионам"
 mtg_news.30.desc:0 "\nНедавние действия со стороны [From.GetAdjective] Правительство ясно дало понять, что оно все больше и больше подавляет автономию доминионов. Поскольку войска готовятся к отправке за границу, ожидается, что даже развертывание воинских частей может быть использовано для того, чтобы отговорить любое представление о освобождении от нового правительства."
 mtg_news.30.a:0 "Лучше бы у них не было никаких забавных идей..."
 mtg_news.30.b:0 "Они идут за нами."
 mtg_news.30.c:0 "Резкие меры..."
 mtg_news.31.t:0 "[ENG.GetNameDefCap] вводить военное положение в [From.GetName]"
 mtg_news.31.desc:0 "\nСегодня утром, [ENG.GetAdjective] Военные части размещались по всему [From.GetNameDef]И это [ENG.GetAdjective] Правительство объявило военное положение в своем Доминионе. Местное правительство было приостановлено, и повседневные дела, по крайней мере, на данный момент, решаются непосредственно из Лондона.\n\nПока неясно, как долго будет длиться эта новая ситуация, но критики уже назвали ее «неопределенной». [ENG.GetAdjective] Позиция «невыполнима» в долгосрочной перспективе."
 mtg_news.31.a:0 "Это необходимый шаг."
 mtg_news.31.b:0 "Как они смеют?!"
 mtg_news.31.c:0 "У нас есть права!"
 mtg_news.31.d:0 "Англичане очень сильно напрягаются в своих владениях."
 mtg_news.32.t:0 "[ENG.GetNameDefCap] Установите Loyalist [From.GetAdjective] Правительство"
 mtg_news.32.desc:0 "\nВ беспрецедентном шаге [ENG.GetNameDef] Проведены новые выборы в [From.GetNameDef]Это привело к победе лоялистов за...[ENG.GetAdjective] вечеринки.\n\nКритики ставят под сомнение результаты и предполагают, что широко распространенное мошенничество на выборах могло произойти. Эти обвинения были категорически отвергнуты [ENG.GetAdjective] Правительство, в то время как новая [From.GetAdjective] Правительство уже находится у власти и проводит решительно пробританскую политику."
 mtg_news.32.a:0 "Все кончено."
 mtg_news.32.b:0 "Мошенничество! ФРАУ-- Ахм. Такой замечательный результат демократических и свободных выборов."
 mtg_news.32.c:0 "Неужели мы одни видим тиранию, которую нам навязали?"
 mtg_news.32.d:0 "Это внутренние вопросы."
 mtg_news.33.t:0 "[From.GetNameDefCap] Уступает профсоюзам"
 mtg_news.33.desc:0 "Якобы в попытке получить более популярную поддержку своих программ перевооружения, [From.GetAdjective] В настоящее время правительство вступило в переговоры с профсоюзами, предлагая пойти на уступки в обмен на их поддержку. Ожидается, что это значительно усилит социалистическое влияние на правительство."
 mtg_news.33.a:0 "Мы делаем то, что должны."
 mtg_news.33.b:0 "Что касается развития событий..."
 mtg_news.33.c:0 "Замечательная новость для [From.GetAdjective] Рабочий!"
 mtg_news.34.t:0 "[ENG.GetNameDefCap] Изгнание королевской семьи"
 mtg_news.34.desc:0 "В том, что он назвал «милостивым» решением, все [ENG.GetAdjective] Королевская семья была изгнана из страны. Никаких дальнейших комментариев не было сделано ни представителями правительства, ни самими представителями королевской семьи. Сегодня утром они прибыли в [From.GetNameDef] Он попросил там убежища, которое было принято."
 mtg_news.34.a:0 "Отличная поездка."
 mtg_news.34.b:0 "Социалистическая тирания открыта для всех."
 mtg_news.34.c:0 "Победа в классовой борьбе!"
 mtg_news.35.t:0 "Исчезновение [ENG.GetAdjective] Королевская семья"
 mtg_news.35.desc:0 "Прошла еще неделя с момента последнего публичного выступления любого члена Совета Европы. [From.GetAdjective] Королевская семья, ходят слухи об их вероятной судьбе. Правительство полностью отказалось комментировать этот вопрос и начало расправляться с любыми сообщениями в СМИ, которые привлекут внимание к этому вопросу.\n\nМолчание правительства становится более заметным в свете анонимных сообщений некоторых лиц, которые утверждают, что были членами семьи королевской семьи, говоря о том, что несколько недель назад «королевская семья была насильственно удалена из Букингемского дворца мужчинами в масках»."
 mtg_news.35.a:0 "Это было необходимо."
 mtg_news.35.b:0 "Социалисты не уважают человеческую жизнь."
 mtg_news.35.c:0 "Они получили свой долг."
 mtg_news.36.t:0 "Британская коммунистическая альтернатива"
 mtg_news.36.desc:0 "[From.GetNameDefCap] Он объявил о новой «коммунистической альтернативе» Коминтерну. [From.GetLeader] Все социалистические государства, желающие независимости от Москвы, могут присоединиться к нам в защите прав трудящихся во всем мире. Сможет ли эта новая социалистическая фракция твердо противостоять Москве, еще предстоит выяснить."
 mtg_news.36.a:0 "Мы открыли свои объятия нашим сверстникам."
 mtg_news.36.b:0 "Они предатели истинного социализма."
 mtg_news.36.c:0 "Еще один раскол между красными."
 mtg_news.37.t:0 "[From.GetNameDefCap] Требуется деколонизация"
 mtg_news.37.desc:0 "The [From.GetAdjective] Правительство выдвинуло ультиматум другим колониальным державам, требуя немедленного выхода из их колоний и предоставления полной независимости, как это уже сделали сами британцы. Они заявили о своей готовности подкрепить эти требования применением военной силы, если это необходимо."
 mtg_news.37.a:0 "И мы это сделаем."
 mtg_news.37.b:0 "У нас есть решение принять..."
 mtg_news.37.c:0 "Британцы напрягают свои глобальные мускулы."
 mtg_news.38.t:0 "[From.GetNameDefCap] Проблемы [SOV.GetAdjective] Социализм"
 mtg_news.38.desc:0 "\n[From.GetNameDefCap] обвиняется [SOV.GetNameDef] «предать ценности, которыми Маркс дорожил», и теперь объявляет, что решил «очистить социализм от своих предателей». Нация поставила свои вооруженные силы в состояние повышенной готовности, поскольку то, что кажется просто вызовом для руководства социализмом, похоже, неизбежно вспыхнет в полномасштабную войну."
 mtg_news.38.a:0 "Мы настоящие социалисты!"
 mtg_news.38.b:0 "Пусть попробуют, предатели!"
 mtg_news.38.c:0 "Красные прибегли к борьбе..."
 mtg_news.39.t:0 "[From.GetNameDefCap] Вызовы фашизму"
 mtg_news.39.desc:0 "Недавняя риторика из [From.GetAdjective] Правительство становится все более враждебным и антифашистским. Вместе с принятием различного антифашистского законодательства считается, что это признак того, что нация готовится к военному противостоянию со своими идеологическими противниками, в не слишком отдаленном будущем."
 mtg_news.39.a:0 "Мы действительно."
 mtg_news.39.b:0 "Мы их не боимся."
 mtg_news.39.c:0 "Война назревает."
 mtg_news.40.t:0 "[From.GetNameDefCap] Вызовы капитализму"
 mtg_news.40.desc:0 "Недавняя риторика из [From.GetAdjective] Правительство становится все более враждебным и антикапиталистическим. Вместе с принятием различного антиамериканского законодательства считается, что это признак того, что нация готовится к военному противостоянию со своими идеологическими противниками в Новом Свете, в не слишком отдаленном будущем."
 mtg_news.40.a:0 "Мы идем за ними."
 mtg_news.40.b:0 "Пусть попробуют."
 mtg_news.40.c:0 "Это была бы смелая попытка."
 mtg_news.41.t:0 "Гражданская война в [From.GetName]"
 mtg_news.41.desc:0 "Растущая напряженность, вызванная непрерывными маршами в чернорубашечниках [From.GetNameDef] Теперь они достигли точки кипения. Последняя серия уличных боёв, вызванных этими маршами, вышла из-под контроля и теперь переросла до такой степени, что военные стали участвовать в них.\n\nВ то время как Королевский флот остался верен чиновнику. [From.GetAdjective] В армии ситуация совершенно иная, различные подразделения обещают поддержку либо лоялистов, либо фашистов. С формированием временного фашистского правительства на Британских островах намечается этап затяжного конфликта."
 mtg_news.41.a:0 "Мы победим."
 mtg_news.41.b:0 "Британцы уничтожают самих себя."
 mtg_news.42.t:0 "Гражданская война в [From.GetName] Концы"
 mtg_news.42.desc:0 "С падением этого [From.GetAdjective] Демократическое правительство стабилизировало ситуацию на Британских островах. Поскольку правительство отказалось бежать в Доминионы перед лицом фашистского наступления, Королевский флот теперь пообещал свою поддержку единственному остающемуся правительству. Неясно, будет ли эта лояльность принята за чистую монету или нелояльные элементы теперь будут очищены от ее рядов."
 mtg_news.42.a:0 "Наконец-то победа!"
 mtg_news.42.b:0 "Они значительно ослабили себя..."
 mtg_news.43.t:0 "Коммунистическая гражданская война в [From.GetName]"
 mtg_news.43.desc:0 "Элементы внутри [From.GetAdjective] Социалистическая партия неоднократно выражала обеспокоенность по поводу явного отказа правительства от деколонизации. Теперь, сытые по горло бездействием правительства по этому вопросу, начали обвинять правительство в «государственной измене ценностям социализма» и взялись за оружие, чтобы вытеснить их. Попытка государственного переворота в настоящее время быстро обострилась, и страна, несомненно, находится в тисках полномасштабной гражданской войны."
 mtg_news.43.a:0 "Мы вернем единство нашей стране!"
 mtg_news.43.b:0 "Их призывают к лжи!"
 mtg_news.43.c:0 "Красные повернулись друг к другу..."
 mtg_news.44.t:0 "Гражданская война в Индии"
 mtg_news.44.desc:0 "В результате плохо организованного способа, которым [RAJ.GetNameDef] Получив независимость, религиозная напряженность на субконтиненте с тех пор кипела под поверхностью. Теперь они внезапно и резко столкнулись с жестокими столкновениями в крупных городах на северо-западе и северо-востоке страны.\n\nМестные власти оказались безуспешными в удержании ситуации от дальнейшей эскалации, и теперь ополченцы и даже военные подразделения объединились за Мусульманской лигой, объявив независимость Пакистана, а также свое намерение бороться с индейцами до тех пор, пока они не обеспечили ее."
 mtg_news.44.a:0 "Мы обретем независимость или умрем, пытаясь!"
 mtg_news.44.b:0 "Мы не увидим, чтобы этот субконтинент разделился надвое!"
 mtg_news.44.c:0 "Это наша вина?"
 mtg_news.44.d:0 "Англичане должны были предвидеть это..."
 mtg_news.45.t:0 "Гражданская война в Пакистане"
 mtg_news.45.desc:0 "[From.GetNameDefCap]Насильственное рождение продолжало вызывать нестабильность в молодой стране, с вооруженными ополченцами, несущими большую власть, особенно в отдаленных районах. Культурные различия между различными мусульманскими народами Северо-Запада и Северо-Востока Индии также становятся все более очевидными, с пренебрежительным отношением западных пакистанцев к своим восточным коллегам, воспламеняющим головы, которые еще не полностью остыли после гражданской войны.\n\nТеперь Восток снова взялся за оружие, утверждая, что «достаточно», и что они тоже теперь хотят полной независимости."
 mtg_news.45.a:0 "Маленькие выскочки!"
 mtg_news.45.b:0 "Они больше не будут удерживать нас!"
 mtg_news.45.d:0 "Все это можно было так легко предотвратить..."
 mtg_news.46.t:0 "[From.GetName] Правительство переезжает в Батавию"
 mtg_news.46.desc:0 "\nПосле утраты своих континентальных территорий, [From.GetAdjective] Правительство решило переехать в город Батавия на индонезийском острове Ява. Колониальное правительство должно быть вытеснено, с [From.GetAdjective] Вместо этого правительство управляет им напрямую.\n\nС этой колониальной базы они поклялись продолжать войну против своих агрессоров."
 mtg_news.46.a:0 "Мы будем продолжать бороться!"
 mtg_news.46.b:0 "Они дерзкие."
 mtg_news.47.t:0 "[From.getAdjective] Чиновники продолжают работы Зуидерзее"
 mtg_news.47.desc:0 "\nВ настоящее время осуществляется крупномасштабный проект мелиорации земель. [From.GetNameDef]Продолжение серии таких проектов, известных под общим названием «Работы Зуидерзее». После закрытия IJsselmeer с Afsluitdijk, рекультивации Wieringermeer и Noordoostpolder, проект теперь фокусируется на рекультивировании Flevopolder, самой большой области, которая еще не освоена из моря.\n\nНесмотря на то, что полный проект, несомненно, будет длиться много лет, осушительные работы продолжались достаточно долго, чтобы небольшие площади теперь были доступны. [From.GetAdjective] Промышленность ощутима."
 mtg_news.47.a:0 "Это будет современное чудо света."
 mtg_news.47.b:0 "Смелая авантюра."
 mtg_news.48.t:0 "[JAP.GetNameDefCap] Получить Ост-Индию"
 mtg_news.48.desc:0 "The [From.GetAdjective] и [JAP.GetAdjective] Правительство Нидерландов опубликовало совместное заявление, в котором объявило о полном переходе Голландской Ост-Индии к... [JAP.GetAdjective] Контроль. Эта радикальная территориальная перестройка на Дальнем Востоке должна вступить в силу немедленно, несмотря на протесты различных третьих сторон, таких как американцы и британцы."
 mtg_news.48.a:0 "Это было необходимое зло."
 mtg_news.48.b:0 "Самый приятный сюрприз."
 mtg_news.48.c:0 "Тревожно."
 mtg_news.49.t:0 "[JAP.GetNameDefCap] Получение ресурсов Ост-Индии"
 mtg_news.49.desc:0 "\nThe [From.GetAdjective] и [JAP.GetAdjective] Правительства двух стран опубликовали совместное заявление, объявляющее об эксклюзивной торговой сделке между двумя странами. Отныне японцам будут предоставлены исключительные права на все ресурсы, эксплуатируемые на Индонезийском архипелаге.\n\nЭта беспрецедентная торговая сделка, несомненно, является попыткой [From.GetAdjective] Правительство не допускает угрозы со стороны японцев, хотя это вызывает большое недоумение у других заинтересованных стран, таких как Япония. [USA.GetNameDef] и [ENG.GetNameDef]."
 mtg_news.49.a:0 "Приемлемый компромисс."
 mtg_news.49.b:0 "В любом случае, мы заботимся только о ресурсах."
 mtg_news.49.c:0 "Они находятся в союзе друг с другом."
 mtg_news.50.t:0 "[From.GetNameDefCap] Деколонизировать"
 mtg_news.50.desc:0 "Новый [From.GetAdjective] Правительство сделало быструю работу своих предвыборных обещаний, чтобы предоставить независимость различным областям, все еще принадлежащим к британскому правительству. [From.GetAdjective] колониальной империи.\n\nЭти государства получат полную независимость, и Королевская Нидерландская Ост-Индская армия (KNIL) вернется, чтобы поддержать их. [From.GetAdjective] Континентальная европейская армия."
 mtg_news.50.a:0 "Теперь мы можем сосредоточиться на материке."
 mtg_news.50.b:0 "Они действительно выступают за свободу."
 mtg_news.51.t:0 "Создание буферного государства Бенилюкса"
 mtg_news.51.desc:0 "С нынешней слабостью Люксембургского и Бельгийского государств [ENG.GetNameDef] В настоящее время, по-видимому, канул в [From.GetAdjective] Призывает восстановить постнаполеоновское «буферное государство» в низших странах. Англичане согласились предоставить освобожденную территорию [From.GetNameDef]. Будет ли голландцам больше повезло в поддержании внутренней стабильности на этот раз, еще предстоит выяснить."
 mtg_news.51.a:0 "Будем."
 mtg_news.51.b:0 "Некоторые превосходные [From.GetAdjective] дипломатического маневрирования."
 mtg_news.52.t:0 "[USA.GetNameDefCap] Защищает [From.GetAdjective] Вест-Индия"
 mtg_news.52.desc:0 "\nПо просьбе этого [From.GetAdjective] правительство, [USA.GetNameDef] В заявлении говорится, что они считают голландскую Вест-Индию неотъемлемой частью своей сферы интересов. Они поклялись защищать территорию от любого, кто может напасть на ее законных владельцев."
 mtg_news.52.a:0 "Запад в безопасности."
 mtg_news.52.b:0 "Лучшее. [From.GetAdjective] больше, чем кто-либо другой."
 mtg_news.52.c:0 "Они очень серьезно относятся к своей «сфере интересов»."
 mtg_news.53.t:0 "Бенилюкс формирует"
 mtg_news.53.desc:0 "Под руководством одного из [From.GetAdjective] Правительство, новый союз, состоящий из различных Низких стран. Их лидеры выразили надежду, что этот молодой альянс «останется нейтральным перед лицом растущего мирового кризиса», и что другие страны могут в конечном итоге присоединиться к нему, чтобы укрепить силу этого «блока нейтралитета и рациональности перед лицом безумия, которое захватывает мир в настоящее время»."
 mtg_news.53.a:0 "Мы приветствуем всех, кто устал от спора между великими державами."
 mtg_news.53.b:0 "Смелая инициатива."
 mtg_news.54.t:0 "Европейский Союз формирует"
 mtg_news.54.desc:0 "С момента образования Бенилюкса, правительства Низких стран стремились привлечь дальнейший интерес к «сильному и нейтральному блоку здравомыслия». Теперь целый ряд новых стран были приглашены присоединиться к альянсу, и для размещения этого притока новых стран-членов было решено переименовать его в «Европейский союз»."
 mtg_news.54.a:0 "Мы всегда сильнее."
 mtg_news.54.b:0 "Союз растет."
 MTG_naval_treaty.1.t:0 "[From.GetNameDefCap] Ограничить военно-морское перевооружение"
 MTG_naval_treaty.1.desc:0 "Наши недавние усилия по созданию более крупного флота выдвинули нас в ряды крупных военно-морских держав.[From.GetNameDefCap] Мы явно чувствуем угрозу со стороны нашего расширенного флота и направили делегацию в нашу столицу для переговоров по договору об ограничении вооружений.\n\nДоговор будет смоделирован по второму Лондонскому морскому договору и ограничит размер наших столичных кораблей, а также ограничит наш общий размер флота в столичных кораблях, чтобы не превышать флот. [ENG.GetNameDef]."
 MTG_naval_treaty.1.a:0 "Эти условия приемлемы."
 MTG_naval_treaty.1.b:0 "Мы не ограничимся своими амбициями!"
 MTG_naval_treaty.2.t:0 "[From.GetNameDefCap] Подписан договор о военно-морском разоружении"
 MTG_naval_treaty.2.desc:0 "Правительство [From.GetLeader] Они договорились о взаимном ограничении военно-морского перевооружения. Поскольку чернила на договоре едва высохли, Контрольная комиссия начала свою работу по удостоверению того, что все новое строительство соответствует ограничениям договора."
 MTG_naval_treaty.2.a:0 "Еще одной гонки вооружений удалось избежать."
 MTG_naval_treaty.3.t:0 "[From.GetNameDefCap] Прервать переговоры"
 MTG_naval_treaty.3.desc:0 "Делегация от [From.GetNameDef] вышел из переговоров, сославшись на «полный отказ другой стороны признать политические и стратегические реалии, стоящие перед ней». [From.GetNameDef].\"\n\n Ввиду того, что внешнеполитическая цель контроля над вооружениями, очевидно, находится в руинах, многие наблюдатели задаются вопросом, насколько дольше другие участники договора готовы согласиться с ограничениями на их вооружения."
 MTG_naval_treaty.3.a:0 "\"Барабаны\" - очень сильное слово."
 MTG_naval_treaty.4.t:0 "[From.GetNameDefCap] Серьезное предупреждение"
 MTG_naval_treaty.4.desc:0 "The [From.GetAdjective] Посол в нашей стране сегодня призвал [This.GetLeader] Чтобы доставить записку от его правительства. Они с серьезной озабоченностью наблюдают за нашей продолжающейся экспансией на море, и теперь считают наш флот «дестабилизирующим фактором в регионе».\n\nЕсли мы продолжим нашу текущую программу военно-морской экспансии, нота продолжится. [From.GetAdjective] Правительство будет вынуждено рассмотреть все возможные меры."
 MTG_naval_treaty.4.a:0 "Мы бы не хотели выяснять, что это за меры."
 MTG_naval_treaty.4.b:0 "Прозрачный блеф."
 MTG_naval_treaty.5.t:0 "[From.GetNameDefCap] Обязательства в отношении разоружения"
 MTG_naval_treaty.5.desc:0 "Наше твердое послание к [From.GetAdjective] Правительство, очевидно, дало желаемый эффект. После долгой ночи внутренних обсуждений наш посол был уверен, что [From.GetLeader]В присутствии министра военно-морского флота кабинет министров одобрил сокращение расходов на военно-морские силы. [From.GetNameDef] - отказаться от ряда капитальных судов и в будущем финансировать только замену изношенных судов."
 MTG_naval_treaty.5.a:0 "А теперь посмотрим, смогут ли они это сделать."
 MTG_naval_treaty.6.t:0 "[From.GetNameDefCap] Отклонить предостережение"
 MTG_naval_treaty.6.desc:0 "Встреча с министром иностранных дел [From.GetNameDef] Мы не пошли так хорошо, как надеялись. По словам нашего посла, [From.GetAdjective] Правительство уже приняло решение отклонить любое предупреждение, которое мы могли бы сделать. В связи с этим ему была представлена простая записка о том, что правительство [From.GetLeader] В настоящее время не верится, что есть что обсудить."
 MTG_naval_treaty.6.a:0 "Если они не хотят говорить, пусть заговорит наше оружие."
 MTG_naval_treaty.6.b:0 "Они раскрыли наш блеф."
 MTG_naval_treaty.7.t:0 "[From.GetNameDefCap] Отказ от военно-морского договора"
 broken_naval_treaty_opinion_mod:0 "Игнорирование санкций"
 MTG_naval_treaty.7.desc:0 "[From.GetLeader] Сегодня было объявлено, что [From.GetNameDef] Она больше не будет считать себя связанной морскими договорами, которые она подписала. По его словам, ситуация в мире сделала выбор неизбежным.[From.GetNameDefCap] Судя по всему, поступили достоверные сообщения о том, что несколько соседних стран начали агрессивные программы военно-морской экспансии, которые угрожают законным военным действиям. [From.GetAdjective] интересов в данной области.\n\nThe [From.GetAdjective] Адмиралтейство отказалось комментировать слухи о том, что несколько строящихся в настоящее время кораблей уже были запланированы без учета договорных ограничений."
 MTG_naval_treaty.7.a:0 "Мы должны пересмотреть свое участие в договоре."
 MTG_naval_treaty.8.t:0 "Окончание Лондонского морского договора"
 MTG_naval_treaty.8.desc:0 "Поскольку только две страны все еще придерживаются Лондонского морского договора, вопрос времени, прежде чем одна из них выйдет из договора, полностью его положит конец, остается открытым. Правительство [From.GetNameDef] Судя по всему, он решил, что договор более не является эффективным в соответствии с заявленной целью и что ограничение их военно-морских вооружений представляет собой угрозу национальной безопасности.\n\nМногие эксперты во всем мире прогнозируют быстрый рост военно-морских бюджетов, поскольку многие страны захотят компенсировать десятилетия жестких ограничений по договорам."
 MTG_naval_treaty.8.a:0 "Идея обречена с самого начала."
 MTG_naval_treaty.8.b:0 "Мы сделали правильный выбор."
 MTG_naval_treaty.8.c:0 "Это начало новой гонки Dreadnought?"
 MTG_naval_treaty.9.t:0 "Подписан второй Лондонский морской договор"
 MTG_naval_treaty.9.desc:0 "Делегации Великобритании, Франции, Италии, Японии и США встретились в декабре 1935 года, чтобы обсудить возобновление Первого Лондонского военно-морского договора, который ограничил количество и размер крейсеров и подводных лодок. Переговоры переросли в войну Италии в Эфиопии и желание Японии быть равной Великобритании и США.\n\nПереговоры подошли к концу, и страны-подписанты договорились об ограничении размеров линкоров и авианосцев в надежде предотвратить очередную разрушительную гонку вооружений."
 MTG_naval_treaty.9.a:0 "Это обеспечит мир лучше, чем любой супер-линкор."
 MTG_naval_treaty.9.b:0 "Почему они ограничивают себя в этом?"
 MTG_naval_treaty.9.c:0 "Больше денег для армии."
 MTG_naval_treaty.11.t:0 "Морской договор отменен"
 MTG_naval_treaty.11.desc:0 "С началом войны, в [From.GetAdjective] Правительство официально проинформировало остальных подписантов Лондонского морского договора о том, что в соответствии со статьей 24 оно считает, что ограничения Морского договора больше не отвечают национальным интересам. The [From.GetAdjective] Поэтому посол объявил, что военно-морской договор будет приостановлен на время войны. Вопрос о том, вступят ли ограничения в силу после окончания войны, еще предстоит выяснить, но пока мы не должны считать себя связанными договорными обязательствами, когда речь идет о проектировании и строительстве судов."
 MTG_naval_treaty.11.a:0 "Это была благородная попытка сохранить мир."
 mtg_britain.999.t:0 "Взрыв в Букингемском дворце - Король Эдвард мертв"
 mtg_britain.999.d:1 "Обширные стратегические бомбардировки в столичном районе в настоящее время нанесли свой окончательный урон. В 3:41. Вчера днем, св. Парк Джеймса и Букингемский дворец были поражены ударом, нанесенным несколькими вражескими бомбардировщиками. Хотя спасательные службы прибыли на место происшествия в течение нескольких минут, они были вынуждены заключить, что король Эдвард и его жена Уоллис были убиты мгновенно, когда взорвалась бомба и обрушила потолок подвала на них.\n\nНесмотря на то, что смерть короля погрузила народ в траур, уже ведется подготовка к коронации его преемника. В результате морганатического брака короля линия престолонаследия теперь проходит через его брата Альберта, который выбрал регнальское имя Георг VI, когда он готовится к коронации."
 mtg_britain.999.a:1 "Король мертв. Да здравствует король!"
 mtg_britain.1000.t:0 "Король Георг VI умер"
 mtg_britain.1000.d:0 "Сегодня утром появились новости о смерти короля Георга VI. В последнее время стрессы войны все больше и больше наносили ущерб здоровью короля, и в конечном итоге его тяжелое курение и последующее развитие артериосклероза и болезни Бюргера заставили его дочь Элизабет уже взять на себя многие королевские обязанности ее отца.\n\nТеперь Елизавета воссядет на трон своего отца, носящего регнальское имя Елизабет II. Несмотря на молодость, она была готова к этому моменту с тех пор, как морганатический брак ее дяди сделал будущую линию преемственности ясной и, как ожидается, станет хорошей королевой, несмотря на ее возраст."
 mtg_britain.1000.a:0 "Король мертв. Да здравствует королева!"
 mtg_news.55.t:0 "Король Эдвард убит"
 mtg_news.55.desc:1 "Недавние взрывы в Лондоне привели к гибели короля Эдуарда и его жены Уоллис. Около 3 часов внезапная бомбардировка заставила пару укрыться в подвале дворца. Одна бомба попала в здание сверху и обрушила потолок подвала на короля и его окружение.\n\nВ то время как нация оплакивает потерю своего монарха, брат короля, Альберт, теперь готовится к его смене, взяв имя Георга VI."
 mtg_news.55.a:1 "Несмотря на нежелание, он будет хорошо служить своей стране."
 mtg_news.55.b:0 "Они заплатили самую высокую цену."
 mtg_news.56.t:0 "[From.GetNameDefCap] Установить американскую монархию"
 mtg_news.56.desc:0 "\nПосле недавнего завоевания материковой части США, [From.GetLeader] В настоящее время принят Королевский указ об отмене должности президента Соединенных Штатов и замене ее монархической правительственной структурой, аналогичной той, которая была в США. [From.GetNameDef]. Чтобы занять этот престол, король Эдуард избрал не кого иного, как свою жену, королеву Уоллис, которая отныне будет известна под регнальским именем Уоллис I и править Соединенным Королевством Америки от имени своего мужа.\n\nЕще предстоит выяснить, как американская общественность приспособится к этой новой форме правления."
 mtg_news.56.a:0 "Что такое нация без короля? Или Королева, если уж на то пошло."
 mtg_news.56.b:0 "\"Мститель Бостонского чаепития\", серьезно?!"
 mtg_news.56.c:0 "Любовь короля не знает границ."
 mtg_news.57.t:0 "Создание доминиона Северной Америки"
 mtg_news.57.desc:0 "После недавнего завоевания материковой части США, [From.GetLeader] В настоящее время принят Королевский указ, вводящий бывшие Соединенные Штаты Америки в доминион Канада, переименовывая его в доминиона Северной Америки."
 mtg_news.57.a:0 "Это принесет огромную пользу в управлении Империей."
 mtg_news.57.b:0 "Большая ответственность."
 mtg_news.57.c:0 "Они консолидируют свою власть."
 mtg_news.59.t:0 "Король Георг VI умер"
 mtg_news.59.desc:0 "The [ENG.GetAdjective] Правительство подтвердило смерть короля Георга VI. В течение некоторого времени привычки короля к курению, вероятно, вызванные стрессами войны, привели к ухудшению здоровья и в конечном итоге привели к развитию рака легких, артериосклероза и болезни Бюргера.\n\nУже ведется подготовка к коронации дочери короля Елизаветы, которая в последнее время уже взяла на себя многие королевские обязанности своего отца."
 mtg_news.59.a:0 "Ее юный возраст противоречит ее силе."
 mtg_netherlands.66.t:0 "[ENG.GetNameDefCap] доминировать [HOL.GetAdjective] Торговые переговоры"
 mtg_netherlands.66.d.a:0 "Британцы расширили свое влияние на нас до такой степени, что мы вынуждены оказывать им поддержку в текущих торговых переговорах."
 mtg_netherlands.66.d.b:0 "Англичане расширили свое влияние на [HOL.GetNameDef] до точки, где [HOL.GetAdjective] Правительство было вынуждено поддержать их в текущих торговых переговорах."
 mtg_netherlands.66.a:0 "Тревожно."
 mtg_netherlands.66.b:0 "Мы не можем позволить им зайти в [ENG.GetAdjective] Сфера влияния!"
 mtg_netherlands.67.t:0 "[GER.GetNameDefCap] доминировать [HOL.GetAdjective] Торговые переговоры"
 mtg_netherlands.67.d.a:0 "Немцы расширили свое влияние на нас до такой степени, что мы вынуждены поддержать их в текущих торговых переговорах."
 mtg_netherlands.67.d.b:1 "Немцы расширили свое влияние на [HOL.GetNameDef] до точки, где [HOL.GetAdjective] Правительство было вынуждено поддержать их в текущих торговых переговорах."
 mtg_netherlands.67.b:0 "Мы не можем позволить им зайти в [GER.GetAdjective] Сфера влияния!"
 mtg_netherlands.69.t:0 "Местное население выступает против «бессмысленного» наводнения"
 mtg_netherlands.69.d:0 "Не имея очевидной немедленной необходимости в затоплении Голландской Водной Линии, местное население начало призывать к осушению сельской местности, позволяя им вернуться к своей повседневной жизни. Отказ от их требований, скорее всего, приведет к еще большим волнениям позже."
 mtg_netherlands.69.a:0 "Им придется принять это на некоторое время."
 mtg_netherlands.69.b:0 "Давайте осушим землю."
 mtg_netherlands.70.t:0 "Немецкие дефекторы образуют дивизион"
 mtg_netherlands.70.d:0 "Большое количество немецких перебежчиков теперь организовалось в полноценное подразделение, нуждающееся только в снаряжении, прежде чем мы сможем отправить их в бой от нашего имени."
 mtg_netherlands.71.t:0 "Солдаты не справляются с [HOL.GetName]"
 mtg_netherlands.71.d:0 "Королева Вильгельмина [HOL.GetNameDef] Она объявила о своей готовности добиваться восстановления кайзера Вильгельма II на троне Германии после окончания войны. Это заявление привело к необоснованному оптимизму и ошибочным чувствам лояльности среди наших солдат, которые начали дезертировать и стремиться достичь цели. [HOL.GetNameDef] Сражаться от имени королевы.\n\nБудет очень трудно искоренить это движение, если мы не сможем довести войну до решительного конца."
 mtg_netherlands.71.a:0 "Предатели! Всех их!"
 mtg_netherlands.72.d:0 "Прошлой ночью кайзер Вильгельм II, оставаясь под нашей опекой до конца жизни, мирно скончался во сне. Его сын, Фридрих Вильгельм, стал главой Дома фон Гогенцоллернов и теперь выбрал имя Вильгельма III."
 mtg_netherlands.72.a:0 "Наш договор с его отцом теперь переходит к нему."
 mtg_netherlands.73.t:0 "[HOL_kaiserreich_germany.GetLeader] Ведет немецкую гражданскую войну"
 mtg_netherlands.73.d:0 "С освобождением первой немецкой земли королева Вильгельмина выполнила свое первоначальное обещание и позволила кайзеру. [HOL_kaiserreich_germany.GetLeader] формирование временного правительства на оккупированной территории.[HOL_kaiserreich_germany.GetLeader] Теперь он может вести свою войну, чтобы освободить остальную часть страны от немецкой земли, привлекая все больше и больше людей для борьбы за него."
 mtg_netherlands.73.a:0 "Большой шаг вперед к монархической Европе!"
 mtg_netherlands.74.t:0 "[HOL_kaiserreich_germany.GetLeader] Предлагает альянс"
 mtg_netherlands.74.d:0 "С окончанием войны, [HOL_kaiserreich_germany.GetLeader] Мы считаем целесообразным напомнить нам о нашей сделке и предлагаем союз на равных условиях между нашими двумя странами перед лицом неизбежной оппозиции Запада к этой новой монархической Европе."
 mtg_netherlands.74.a:0 "Мы выполним свои обязательства."
 mtg_netherlands.75.t:0 "Вильгельмина вступает в переговоры с Вильгельмом II"
 mtg_netherlands.75.d:0 "В том, что может быть описано только как полное презрение к нам, [HOL.GetAdjective] Королева Вильгельмина объявила о своем решении вернуть Вильгельма II на трон Германии после окончания нынешней войны. Она приглашала всех немцев, которые хотели бы сражаться за своего старого кайзера. [HOL.GetAdjective]- удерживаемой территории, явно в попытке ослабить [GER.GetAdjective] Позиция и укрепление собственной."
 mtg_netherlands.75.a:0 "Презренная — мы с ней разберемся позже."
 mtg_netherlands.76.t:0 "Немецкие легионы Ее Величества расформированы"
 mtg_netherlands.76.d:0 "С окончанием войны немецкие солдаты, сражавшиеся от нашего имени, вернулись на родину и готовятся к непосредственной борьбе за своего кайзера."
 mtg_netherlands.76.a:0 "Это было неизбежно. Их служение было бесценным."
 mtg_news.58.desc:0 "С этим [HOL.GetAdjective] Обещание королевы Вильгельмины добиться возвращения династии фон Гогенцоллернов на немецкий престол и освобождения первой немецкой территории, кайзер теперь вернулся на немецкую территорию, чтобы возглавить то, что фактически стало полноценной гражданской войной за контроль над его родиной.\n\nНемецкие перебежчики продолжают стекаться в [HOL.GetAdjective]Держал территорию для борьбы от имени королевы и их кайзера, медленно, но постепенно меняя баланс сил. Официальные заявления держав Антанты о Великой войне еще не опубликованы, но сообщения свидетельствуют о большом неодобрении их правительств."
 mtg_news.58.a:0 "Шаг на пути к полной победе."
 mtg_news.58.b:0 "Как они смеют?!"
 mtg_news.58.c:0 "Это мягко говоря... Голландцы получат свой долг."
 mtg_news.58.d:0 "Дипломатический мастерстроук или просто безумие?"
 mtg_britain.109.t:0 "Бирма отделяется"
 mtg_britain.109.d:0 "В свете недавних событий бирманцы объявили о своей независимости, полностью ожидая, что мы будем иметь дело с пакистанцами и, следовательно, не сможем справиться с ними."
 mtg_britain.109.a:0 "У нас нет выбора, кроме как согласиться."
 mtg_britain.113.t:0 "[From.GetName] Воссоединиться с Империей"
 mtg_britain.113.d:0 "Выиграв гражданскую войну и воссоединив Родину, лидеры [From.GetNameDef] Теперь они попросили вернуться в Империю, желая нашего руководства и защиты для того, что может произойти."
 mtg_britain.113.a:0 "Мы приветствуем их возвращение в лоно."
 mtg_news.62.desc:0 "Представители правительств Доминиона сегодня объявили, что в одностороннем порядке будут разрывать связи с Короной. Они ссылаются на вопиющее пренебрежение Короля мнениями и пожеланиями правительств Доминиона и их народов как на главную причину того, почему отношения между Британией и Содружеством больше не могут продолжаться. Этот кризис, вызванный намерением короля жениться на Уоллис Симпсон, привел к образованию нового Содружества Наций с различными доминионами, и кажется, что нынешний паралич британского правительства будет препятствовать любым действиям, предпринимаемым в ответ на этот шаг. Это, несомненно, то, на что надеялись Доминионы."
 mtg_news.62.b:0 "Империя находится в кризисе."
 mtg_news.63.t:0 "[Root.GetNameDefCap] Объявляем независимость"
 mtg_news.63.desc:0 "\nThe [Root.GetAdjective] Правительство объявило, что в одностороннем порядке разорвет связи с правительством. [ENG.GetAdjective] правительство. Они ссылаются на свою неспособность примирить свои политические взгляды с нынешними политическими событиями, происходящими в стране. [ENG.GetName] В качестве основной причины этого."
 mtg_netherlands.77.t:0 "[From.GetNameDefCap] Предлагает Федерация"
 mtg_netherlands.77.d:0 "The [From.GetAdjective] Правительство обратилось к нам с предложением объединить Низкие страны в одно государство. Они утверждают, что нынешние глобальные кризисы требуют более тесного сотрудничества и единства между нашими народами, чего можно добиться только путем полного объединения. Если мы примем это, будет подготовлена немедленная передача суверенитета новому наднациональному государству. [From.GetAdjective] Лидерство."
 mtg_netherlands.77.a:0 "Чудесная идея - без нее у нас нет шансов."
 mtg_netherlands.77.b:0 "Наш суверенитет имеет первостепенное значение - мы далеко зайдем в нашем сотрудничестве, но не так далеко."
 mtg_netherlands.78.t:0 "[From.GetNameDefCap] Принимает федерацию"
 mtg_netherlands.78.d:0 "The [From.GetAdjective] Правительство сообщило нам, что оно одобряет наше предложение о создании единого государства в Низких странах. Если все стороны согласятся, мы можем приступить к осуществлению наших планов."
 mtg_netherlands.79.t:0 "[From.GetNameDefCap] Отвергает федерацию"
 mtg_netherlands.79.d:0 "[From.GetAdjective] Представители проинформировали нас, что в настоящее время они не видят необходимости в единых государствах в Низких странах. Они рассчитывают на продолжение сотрудничества с нами, но при сохранении полного суверенитета."
 mtg_news.64.t:0 "Низкие страны объединяются"
 mtg_news.64.desc:1 "Ссылаясь на серьезные внешние угрозы своей национальной безопасности, правительства Низких стран объявили о немедленном объединении своих правительств и вооруженных сил для укрепления позиций своих народов. Под [From.GetOldAdjective] Промышленные инвестиции и оборонное военное планирование теперь будут иметь приоритет над другими внутренними вопросами, направленными на обеспечение военной готовности, достаточной для реагирования на любые действия, которые могут угрожать суверенитету нового государства."
 mtg_news.64.a:0 "Все наши народы едины в защите нашей Родины."
 mtg_news.64.b:0 "Снова \"Юнайтед\"? Примите решение!"
