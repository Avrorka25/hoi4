 SLO_generic_industrial_concern:0 "Вагонка"
 SLO_mechanized_corps:0 "[SLO.GetAdjectiveCap] механизированный корпус"
 SLO_transfer_german_tanks:0 "Передать немецкие танки"
 SLO_transfer_german_tanks_desc:0 "Наши немецкие покровители могли бы предоставить нам современную военную технику и, возможно, даже лицензии, чтобы мы смогли создать собственную военную машину."
