l_russian:
 SLO_generic_focus:0 "Национальный фокус Словакии"
 SLO_democratic_party:0 "ДС"
 SLO_democratic_party_long:0 "Демократическая партия"
 SLO_neutrality_party:0 "СНС"
 SLO_neutrality_party_long:0 "Словацкая национальная партия"
 SLO_militarism_focus:0 "Усиленная Глинкова гвардия"
 SLO_nationalism:0 "Словацкий национализм"
 SLO_planning_expertise:0 "Опыт в планировании"
 SLO_fascism_banned:0 "Фашизм запрещён"
 SLO_communist_army:0 "Коммунистическая армия"
 SLO_pluralism:0 "Плюрализм"
 SLO_civilian_production:0 "Гражданское производство"
 SLO_military_production:0 "Военное производство"
 SLO_agrarian_reform:0 "Аграрные реформы"
 SLO_fascist_repression:0 "Репрессии против фашистов"
 SLO_rapid_deployment:0 "Быстрое развёртывание"
 SLO_integrated_overlord_army:0 "Интеграция в армию сюзерена"
 SLO_integrated_overlord_army_desc:0 "Чтобы сражаться эффективно, мы должны поддерживать постоянную связь с командной структурой нашего сюзерена."
 apollo:0 "Аполло"
 zvolen_railway_factory:0 "Железнодорожный завод Зволена"
 slovak_autonomy:0 "Усиленное сотрудничество с сюзереном."
 SLO_found_the_nation:0 "Основать нацию"
 SLO_found_the_nation_desc:0 "В 1919 году чешские националисты вели переговоры от нашего имени и вынудили нас вступить в несчастливый союз. Но теперь этот союз распался, и пришло время показать, что мы — гордый, свободный и независимый народ."
 SLO_assert_control_over_southern_slovakia:0 "Установить контроль над Южной Словакией"
 SLO_assert_control_over_southern_slovakia_desc:0 "Наш контроль над стратегически важным промышленным регионом Южной Словакии успешно восстановлен. Поприветствуем наших братьев и сестёр под знаменем великой державы [SLO.getAdjective]."
 SLO_purge_fascists:0 "Провести чистку фашистов"
 SLO_purge_fascists_desc:0 "Времена угнетения наконец закончились. Больше никаких ополчений Глинки, никаких головорезов, убивающих невиновных без суда, никакого фанатичного антисемитизма. Да здравствует уничтожение фашизма!"
 SLO_technology_sharing:0 "Обмен технологиями"
 SLO_technology_sharing_desc:0 "Наши союзники могут стать ценными помощниками в модернизации промышленности и вооружённых сил."
 SLO_communist_influence:0 "Коммунистическое влияние"
 SLO_communist_influence_desc:0 "Свобода, равенство, труд для всех — за этими простыми обещаниями сплачиваются массы. Власть должна принадлежать рабочим, чтобы покончить с буржуазией и аристократами, эксплуатирующими беспомощные массы. Коммунизм — следующий этап развития общества, не сопротивляйтесь неизбежному!"
 SLO_state_security_ministry:0 "Министерство государственной безопасности"
 SLO_state_security_ministry_desc:0 "Чтобы защитить революцию от реакционных буржуазных заговоров, мы должны усилить контроль над населением, выявлять контрреволюционеров и разбираться с ними."
 SLO_purge_the_army:0 "Провести чистку в армии"
 SLO_purge_the_army_desc:0 "Армия традиционно привлекала аристократов и карьеристов из числа реакционных офицеров. Теперь они представляют потенциальную угрозу славной пролетарской революции. Поэтому с ними необходимо разобраться, прежде чем они создадут проблемы."
 SLO_new_army:0 "Новая армия"
 SLO_new_army_desc:0 "После реорганизации армии у нас наконец появились идеологически сплочённые вооружённые силы, которые защитят пролетариат от фашистских плутократов."
 SLO_nationalize_factories:0 "Национализировать заводы"
 SLO_nationalize_factories_desc:0 "Капиталисты — тираны пролетариата. Чтобы освободить массы, мы должны национализировать заводы и начать коллективизацию. Этот процесс позволит изъять у элит средства производства и навсегда покончить с буржуазией."
 SLO_indoctrinate_the_proletariat:0 "Идеологически воспитать пролетариат"
 SLO_indoctrinate_the_proletariat_desc:0 "Если пролетариат не будет полностью убеждён, что мы действуем ради его блага, он может попасть под влияние «негативных иностранных сил». Ради успеха социалистической революции — народ, за работу!"
 SLO_central_planning:0 "Центральное планирование"
 SLO_central_planning_desc:0 "Получив прочный контроль над экономикой, мы можем приступить к грандиозной задаче индустриализации страны, перераспределяя ресурсы в пользу тяжёлой промышленности. Вы тоже можете обеспечить успех первых пятилетних планов. Словацкие рабочие — вперёд!"
 SLO_establish_pluralism:0 "Установить плюрализм"
 SLO_establish_pluralism_desc:0 "Возможность высказывать идеи и оспаривать их необходима для создания демократических институтов. Когда людей заставляют молчать или подвергают ещё худшим преследованиям за обмен идеями, дискуссия и развитие прекращаются, поскольку мысли, чуждые воле центральной власти, уже нельзя выразить."
 SLO_seek_trading_partners:0 "Искать торговых партнёров"
 SLO_seek_trading_partners_desc:0 "После создания справедливой системы институтов нам необходимо улучшить экономическое положение. Мы обменивались идеями, а теперь будем обмениваться и товарами; благодаря восстановлению и инновациям мы постепенно создадим более сильную экономику."
 SLO_attract_investors:0 "Привлечь инвесторов"
 SLO_attract_investors_desc:0 "Для улучшения экономики необходимо мобилизовать капитал. Возможности внутри страны весьма ограничены, поэтому нам следует рассчитывать на инвесторов из других стран, готовых вкладываться в нашу экономику и открывать новые предприятия."
 SLO_efficient_economy:0 "Экономические реформы"
 SLO_efficient_economy_desc:0 "Некоторые части нашей экономики по-прежнему институционально неэффективны, поэтому необходимо провести реформы, чтобы разрушить оставшиеся монополии и заменить их более эффективными конкурирующими предприятиями."
 SLO_agrarian_reforms:0 "Аграрные реформы"
 SLO_agrarian_reforms_desc:0 "Земля — яблоко раздора Восточной Европы. Пока одни страны пытаются отхватить территории у соседей, внутри самих стран крестьянские движения выступают против могущественных землевладельцев, а недостаточное представительство сельского хозяйства в институтах подталкивает к земельным реформам и модернизации аграрного сектора."
 SLO_defensive_preparation:0 "Подготовка к обороне"
 SLO_defensive_preparation_desc:0 "Война может меняться, но мы будем готовы встретить её удар, если заранее подготовимся, а затем при поддержке союзников нанесём ответный удар и одержим решительную победу во имя свободы человечества."
 SLO_why_we_fight:0 "Свобода стоит того, чтобы за неё сражаться!"
 SLO_why_we_fight_desc:0 "После укрепления демократических институтов кто теперь станет утверждать, что предпочитает иллюзии красной или чёрной тирании? Если мы не будем пользоваться своими свободами, враги постепенно отнимут их. Лучший способ защитить свободу сегодня — немедленно отправиться в военкомат! Вступай сегодня — празднуй победу завтра!"
 SLO_reinforce_hlinka_guard:0 "Усилить Глинкову гвардию"
 SLO_reinforce_hlinka_guard_desc:0 "Глинкова гвардия — истинное воплощение словацкого национального духа. Она защищает независимость страны от внешней агрессии. Поэтому неудивительно, что необходимо увеличить число её членов, чтобы защитить Словакию и словацкий народ."
 SLO_catholic_dominance:0 "Доминирование католицизма"
 SLO_catholic_dominance_desc:0 "Мы набожны, наши лидеры — священники, и они указывают нам священный путь, предначертанный Богом для нашей страны."
 SLO_militarize_the_hlinka_guard:0 "Милитаризировать Глинкову гвардию"
 SLO_militarize_the_hlinka_guard_desc:0 "Будучи бдительными защитниками нашей независимости, бойцы Глинковой гвардии должны быть полностью мобилизованы для этой титанической борьбы за свободу Европы."
 SLO_integrate_german_army_structure:0 "Интегрироваться в командную структуру сюзерена"
 SLO_integrate_german_army_structure_desc:0 "Чтобы сражаться эффективно, мы должны поддерживать постоянную связь с командной структурой нашего сюзерена."
 SLO_hlinka_youth:0 "Глинкова молодёжь"
 SLO_hlinka_youth_desc:0 "Они — истинное воплощение воли Андрея Глинки, молодые люди, сражающиеся за сильную и благочестивую Словакию!"
 SLO_ideological_fanaticism:0 "Идеологический фанатизм"
 SLO_ideological_fanaticism_desc:0 "Мы обрели свободу всего несколько лет назад и не позволим вновь надеть на себя чужое ярмо! Мы хотим лишь того, что принадлежит нам по праву, и пожертвуем всем, чтобы это сохранить. Словаки, родина нуждается в вас! Встаньте под боевое знамя и защитите страну!"
 SLO_faithful_ally:0 "Верный союзник"
 SLO_faithful_ally_desc:0 "Сражаясь бок о бок с союзниками, мы можем доказать, что заслуживаем места полноправного и независимого партнёра."
 SLO_army_effort:0 "Организовать национальную армию"
 SLO_army_effort_desc:0 "Мы должны создать настоящую национальную армию из остатков чехословацких вооружённых сил. Первым важным шагом станет убеждение немногочисленных словацких старших офицеров расформированной чехословацкой армии вступить в наши ряды. Затем мы должны повысить нескольких лояльных офицеров, чтобы заполнить высшие командные должности, и наконец передать этим новым командирам соответствующие подразделения."
 SLO_equipment_effort:0 "Модернизировать пехотное снаряжение"
 SLO_equipment_effort_desc:0 "Пределы того, какое снаряжение может нести пехота, постоянно расширяются. Мы сосредоточимся на том, чтобы снабдить наших солдат лучшими доступными средствами."
 SLO_mountain_brigades:0 "Горные бригады"
 SLO_mountain_brigades_desc:0 "Поскольку ландшафт нашей страны в значительной степени гористый, любая словацкая армия, достойная своего имени, должна иметь хотя бы несколько подразделений горных стрелков."
 SLO_motorization_effort:0 "Эксперименты с моторизацией"
 SLO_motorization_effort_desc:0 "Мобильность и защита крайне важны для безопасной доставки пехоты на поле боя и её вывода оттуда. Развитие этих направлений позволит нам действовать быстрее."
 SLO_doctrine_effort:0 "Переосмыслить тактику"
 SLO_doctrine_effort_desc:0 "Военные доктрины, определявшие сухопутные сражения Великой войны, устарели. Мы должны поручить нашим лучшим умам сформировать военную мысль завтрашнего дня."
 SLO_support_bonus:0 "Гибкие группы поддержки"
 SLO_support_bonus_desc:0 "Мы могли бы повысить огневую мощь пехоты, если снабдим её более тяжёлым оружием, например миномётами и пулемётами. Чтобы это оружие применялось эффективно, офицеры должны отдавать точные приказы, а взаимодействие между обслуживающими его солдатами должно быть безупречным."
 SLO_modern_artillery:0 "Современная артиллерия"
 SLO_modern_artillery_desc:0 "По мере развития технологий снаряды малого калибра постепенно уступают место более крупным боеприпасам, способным наносить больший урон на большей дальности. Поэтому, если мы хотим сохранить эффективность нашей артиллерии, необходимо как можно скорее разработать более крупные орудия."
 SLO_recon_companies:0 "Разведывательные роты"
 SLO_recon_companies_desc:0 "Знать, где находится противник, — первый шаг к тому, чтобы открыть по нему огонь. Поэтому грамотная разведка крайне важна для получения сведений о перемещениях и планах врага."
 SLO_mechanization_effort:0 "Развитие механизации"
 SLO_mechanization_effort_desc:0 "Переосмысливая возможности моторизованной пехоты, мы можем расширить пределы того, какие машины способны строить сегодня."
 SLO_invite_german_military_mission:0 "Пригласить немецкую военную миссию"
 SLO_invite_german_military_mission_desc:0 "Чтобы добиться успеха в манёвренной войне, нам придётся переосмыслить тактику применения грузовиков и танков. Мы сэкономим драгоценное время и жизни военнослужащих, если пригласим немецких специалистов обучить наших офицеров принципам молниеносной войны."
 SLO_mobile_warfare_focus:0 "Ставка на манёвренную войну"
 SLO_mobile_warfare_focus_desc:0 "Если окопы стали символом Великой войны, то символом нынешней войны должны стать моторы и скорость. Если нам удастся окружить противника прежде, чем он успеет отреагировать, мы получим решающее преимущество и одновременно сократим потери."
 SLO_firepower_focus:0 "Ставка на огневую мощь"
 SLO_firepower_focus_desc:0 "Чтобы победить врага, мы должны сокрушить его подавляющим артиллерийским огнём, лишив возможности ответить под губительным дождём снарядов."
 SLO_planning_focus:0 "Детальное планирование"
 SLO_planning_focus_desc:0 "Если из Великой войны и следует вынести урок, то он состоит в том, что операции нельзя начинать без должной подготовки к тяжёлым условиям. Многие помнят, как их братья и сыновья замерзали насмерть в Карпатах или попадали под огонь собственной артиллерии под Перемышлем. Подобные проявления некомпетентности австро-венгерского верховного командования необходимо осмыслить и никогда больше не повторять."
 SLO_planning_focus_2:0 "Подготовленные операции"
 SLO_planning_focus_2_desc:0 "Наступление часто означает столкновение наших сил с оборонительной системой противника. Если мы разведаем вражеские позиции и скоординируем действия разных подразделений, то сможем выявлять и использовать слабые места, постепенно разрушая линии обороны."
 SLO_mass_assault_focus:0 "Масштабные операции"
 SLO_mass_assault_focus_desc:0 "Чтобы поколебать силы противника, все наши войска должны ударить как один человек и подавить врага числом и напором."
 SLO_guerilla_tactics_focus:0 "Партизанская тактика"
 SLO_guerilla_tactics_focus_desc:0 "Ограниченные действия и уклонение от прямого столкновения с противником станут нашей лучшей защитой."
 SLO_rapid_deployment_focus:0 "Быстрое развёртывание"
 SLO_rapid_deployment_focus_desc:0 "Чтобы постоянно держать противника под давлением, потери необходимо как можно быстрее восполнять новыми подразделениями, готовыми занять место выбывших."
 SLO_artillery_regiments:0 "Артиллерийские полки"
 SLO_artillery_regiments_desc:0 "Чтобы обрушить на вражеские войска достаточное количество взрывчатки, необходимы хорошо оснащённые артиллерийские подразделения при поддержке опытных корректировщиков."
 SLO_armor_effort:0 "Скопировать проекты «Шкоды»"
 SLO_armor_effort_desc:0 "Чтобы начать производство новых танков, сперва нам нужны рабочие проекты. Проще всего получить доступ к разработкам «Шкоды» и использовать их как отправную точку."
 SLO_special_forces:0 "Войска специального назначения"
 SLO_special_forces_desc:0 "Иногда ситуация оказывается слишком специфичной для обычного пехотинца. Тогда к делу должны подключаться специально подготовленные бойцы. В горах, на воде или в воздухе такие подразделения способны изменить ход событий и выполнить героические задачи, недоступные обычному солдату."
 SLO_committee_for_military_innovations:0 "Комитет военных инноваций"
 SLO_committee_for_military_innovations_desc:0 "Разработка и производство современного военного оборудования — сложная задача, которую необходимо централизовать в рамках одного учреждения. Его члены смогут контролировать весь процесс и устранять любые проблемы между этапами проектирования и производства."
 SLO_aviation_effort:0 "Организовать военно-воздушные силы"
 SLO_aviation_effort_tt:0 "Недостаточно ячеек для строительства §Yавиабазы§!"
 SLO_aviation_effort_desc:0 "Теперь, когда мы обрели независимость и получили несколько бипланов «Авиа», необходимо организовать небольшие военно-воздушные силы и начать планировать их дальнейшее применение и модернизацию."
 SLO_fighter_focus:0 "Ставка на истребители"
 SLO_fighter_focus_desc:0 "Воздушные дуэли Великой войны ещё не остались в прошлом. Опережая противника в разработке истребителей, мы получим преимущество в будущем."
 SLO_bomber_focus:0 "Ставка на бомбардировщики"
 SLO_bomber_focus_desc:0 "Когда люди будущего будут говорить об ужасах нынешних войн, среди них обязательно упомянут огонь, льющийся с небес. Мы сделаем всё возможное, чтобы именно наши враги рассказывали такие истории."
 SLO_airplanes_licenses:0 "Лицензии на самолёты"
 SLO_form_mechanics:0 "Подготовить механиков"
 SLO_form_mechanics_desc:0 "Подготовить механиков"
 SLO_aviation_effort_2:0 "Усовершенствованная подготовка пилотов"
 SLO_aviation_effort_2_desc:0 "Дальнейшее развитие авиации необходимо, чтобы лучше интегрировать наши военно-воздушные силы с другими родами войск."
 SLO_CAS_effort:0 "Одномоторные бомбардировщики"
 SLO_CAS_effort_desc:0 "Современной армии необходима поддержка техники как на земле, так и в воздухе."
 SLO_a_new_fighter_focus:0 "Новый истребитель"
 SLO_a_new_fighter_focus_desc:0 "Постоянные новшества в конструкции планеров делают наши самолёты всё более устаревшими. Поэтому мы должны выделить ресурсы на разработку нового современного планера, который обеспечит будущим истребителям большую манёвренность и скорость."
 SLO_a_new_bomber_focus:0 "Новый бомбардировщик"
 SLO_a_new_bomber_focus_desc:0 "Крупные бомбардировщики способны нести больше бомб. Если мы хотим обрушить огонь на глубокий тыл противника, необходимо создать новый бомбардировщик, способный защищаться от вражеских перехватчиков и при этом нести достаточно взрывчатки, чтобы поставить врага на колени."
 SLO_rocket_effort:0 "Ракетные эксперименты"
 SLO_rocket_effort_desc:0 "Ракетные и реактивные двигатели позволяют достигать беспрецедентных скоростей как беспилотным, так и пилотируемым аппаратам. Осваивая эти технологии первыми, мы сможем застать противника врасплох."
 SLO_NAV_effort:0 "Торпедоносцы"
 SLO_NAV_effort_desc:0 "Подобно тому как новая морская война идёт под поверхностью воды, часть её разворачивается и в небе над морем."
 SLO_naval_effort:0 "Подготовить военно-морское строительство"
 SLO_naval_effort_tt:0 "Недостаточно ячеек для строительства §Yверфей§!"
 SLO_naval_effort_desc:0 "Расширение нашего флота должно стать приоритетом. Направим все доступные ресурсы на строительство новых верфей и исследования лёгких надводных кораблей."
 SLO_flexible_navy:0 "Гибкий флот"
 SLO_flexible_navy_desc:0 "Переосмысление морской войны с учётом достижений в области подводных лодок позволит нам эффективно наносить удары по вражеским конвоям."
 SLO_large_navy:0 "Надводный флот"
 SLO_large_navy_desc:0 "Адаптация морских доктрин к применению крупных кораблей и обеспечению безопасности торговых конвоев поможет понять, какие именно корабли нам необходимы."
 SLO_submarine_effort:0 "Развитие подводного флота"
 SLO_submarine_effort_desc:0 "Подводная война — самое захватывающее новшество в морском деле со времён изобретения торпедного катера. Нам следует научиться как защищаться от подлодок, так и использовать их против вражеского судоходства."
 SLO_cruiser_effort:0 "Развитие крейсеров"
 SLO_cruiser_effort_desc:0 "Прежде чем углубляться в исследования современных линкоров, необходимо заменить устаревшие малые крейсеры."
 SLO_destroyer_effort:0 "Развитие эсминцев"
 SLO_destroyer_effort_desc:0 "Изучая конструкцию и стратегическое применение подводных лодок, мы также научились противодействовать подобной тактике. Эсминцы сыграют в этом решающую роль."
 SLO_capital_ships_effort:0 "Развитие крупных кораблей"
 SLO_capital_ships_effort_desc:0 "Страна с наибольшим числом линкоров будет господствовать на морях. Линкоры и авианосцы воплощают старое и новое представление о превосходстве на море."
 SLO_industrial_effort:0 "Модернизация производства"
 SLO_industrial_effort_desc:0 "Сосредоточим все наши политические усилия на стремительном развитии гражданской промышленности."
 SLO_transslovak_railways:0 "Транссловацкие железные дороги"
 SLO_transslovak_railways_desc:0 "География нашей страны требует хорошей инфраструктуры, чтобы обеспечить быструю связь и передвижение от Братиславы на крайнем западе до предгорий Рутении на востоке."
 SLO_construction_effort_tt:0 "Недостаточно ячеек для строительства §Yфабрик§!"
 SLO_bratislava_industrial_area:0 "Промышленная зона Братиславы"
 SLO_bratislava_industrial_area_desc:0 "Наша столица уже является самым промышленно развитым городом страны, но обстоятельства требуют производить ещё больше. Поэтому необходимо быстро создать новую промышленную зону, чтобы удовлетворить текущие потребности."
 SLO_extraction_focus:0 "Увеличить добычу ресурсов"
 SLO_extraction_focus_desc:0 "У нашей небольшой страны мало ресурсов, например вольфрамовые рудники в горах. Их необходимо расширить и использовать в полной мере, если мы хотим удовлетворить потребность в сырье для производства достаточного количества артиллерийских орудий."
 SLO_apollo_oil_refinery:0 "Нефтеперерабатывающий завод «Аполло»"
 SLO_apollo_oil_refinery_desc:0 "Нефтеперерабатывающий завод «Аполло» — единственный во всём регионе, а значит, это стратегически важный объект для снабжения нашей техники топливом."
 SLO_uranium_mining:0 "Добыча урана"
 SLO_uranium_mining_desc:0 "В наших горах много урановой руды, которую можно добывать, чтобы исследовать свойства этого странного химического элемента. Некоторые физики даже утверждают, что эти свойства можно использовать для создания цепной реакции, высвобождающей почти немыслимое количество энергии."
 SLO_small_arms_manufacturing:0 "Производство стрелкового оружия"
 SLO_small_arms_manufacturing_desc:0 "Первым шагом для удовлетворения потребностей нашей национальной армии должно стать производство достаточного количества огнестрельного оружия для оснащения пехоты."
 SLO_support_innovations:0 "Поддержка инноваций"
 SLO_support_innovations_desc:0 "Если мы хотим получить новые технологии, нам следует прислушиваться к новаторам, способным предложить интересные тактические решения в области вооружений и новые методы производства."
 SLO_develop_kosice:0 "Развивать Кошице"
 SLO_develop_kosice_desc:0 "Кошице заслуживает такого же развития, как и остальная часть нашей страны."
 SLO_zvolen_railway_factory:0 "Железнодорожный завод в Зволене"
 SLO_zvolen_railway_factory_desc:0 "Крайне важно развивать железнодорожный завод в Зволене, поскольку это одно из немногих мест в стране с тяжёлым оборудованием, необходимым для производства тяжёлой военной техники — танков, бронепоездов и тяжёлых артиллерийских орудий."
 SLO_synth_oil_effort_tt:0 "Недостаточно ячеек для строительства §Yнефтеперерабатывающих заводов§!"
 SLO_continue_industrialization:0 "Продолжить индустриализацию"
 SLO_continue_industrialization_desc:0 "Первые проекты были лишь робкими шагами к созданию широкой сети предприятий, которая обеспечит нам производственные мощности, достаточные для удовлетворения потребностей страны."
 SLO_military_developments:0 "Военное развитие"
 SLO_military_developments_desc:0 "Поскольку именно война определяет нашу эпоху, у нас нет иного выбора, кроме как поставить военное производство превыше всего, чтобы обеспечить окончательную победу на поле боя."
 SLO_civilian_developments:0 "Гражданское развитие"
 SLO_civilian_developments_desc:0 "Разрушения, причиняемые войной, почти невообразимы, и мы должны организовать гражданские структуры, чтобы обеспечить быстрое восстановление."
 SLO_victory_against_hungary:0 "Победа в «Малой войне»"
 claim_eastern_slovak_border_tooltip:0 "§RЕсли разместить хотя бы одну дивизию на границе с восточной Словакией, начнётся небольшой конфликт со Словакией за возвращение всей Карпатии. Ваши шансы на победу очень высоки. Немцы относятся к этому вполне благосклонно и не станут вмешиваться, чтобы защитить словаков... по крайней мере пока.§!"
