 oscillating_turret_tech:0 "Качающаяся башня"
 oscillating_turret_tech_desc:0 "Качающаяся башня позволяет поднимать и опускать всю башню вместе с орудием. Связанные механизмы перемещаются вместе с ним, что позволяет устанавливать более крупные орудия и расширяет диапазон углов наведения."
 modern_light_tank_chassis:0 "Лёгкий танк 1944 года"
 sniper_rifle:0 "Снайперская группа"
 sniper_rifle_desc:0 "Добавление снайперской группы в каждый взвод повысит разведывательные и боевые возможности подразделения."
 sniper_rifle_2:0 "Усовершенствованная снайперская группа"
 sniper_rifle_2_desc:0 "Мы улучшили винтовки и подготовку снайперских групп, заметно повысив их эффективность."
 sniper_rifle_3:0 "Полусовременная снайперская группа"
 sniper_rifle_3_desc:0 "Большой опыт и отзывы снайперских групп позволили создать ещё более совершенное снаряжение."
 sniper_rifle_4:0 "Современная снайперская группа"
 sniper_rifle_4_desc:0 "Наши группы оснащены лучшим доступным современным оборудованием."
 flamethrower:0 "Огнемет"
 flamethrower_desc:0 "Разработка огнемётов повысит эффективность войск в городском бою и против укреплений. Однако бег с готовым взорваться баком топлива за спиной может привести к катастрофическим последствиям."
 flamethrower_squad:0 "Огнемётное отделение"
 flamethrower_2:0 "Усовершенствованный огнемёт"
 flamethrower_2_desc:0 "Развитие брони и снижение массы повысили безопасность и эффективность огнемётных групп."
 flamethrower_3:0 "Полусовременный огнемёт"
 flamethrower_3_desc:0 "Наши опытные группы предоставили подробные отзывы о необходимом снаряжении. Внедрение их предложений в производство повысило боевую эффективность."
