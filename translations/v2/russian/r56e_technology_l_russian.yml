 painting:0 "Однотонная окраска"
 painting_desc:0 "Однотонная заводская окраска."
 painting2:0 "Заводской камуфляж"
 painting2_desc:0 "Новый камуфляж для танков наносится прямо на заводе, улучшая защиту при засадах и скрытность."
 painting3:0 "Полевой камуфляж"
 painting3_desc:0 "Новый камуфляж для танков. Возможность изменять заводскую окраску в полевых условиях повысит защищённость в засадах и скрытность."
 painting4:0 "Полусовременный камуфляж"
 painting4_desc:0 "Новый камуфляж для танков. Мы упростили нанесение готовых красок в полевых условиях и повысили стойкость первоначального заводского покрытия."
 painting5:0 "Современный камуфляж"
 painting5_desc:0 "Новый камуфляж для танков универсален и прочен, выдерживая почти всё, что враг может против него применить."
 INFANTRY_TITLE_CLOTHING:0 "ОДЕЖДА"
 camo:0 "Базовая форма"
 camo_desc:0 "Однотонная форма по образцу времён Великой войны."
 camo1942:0 "Усовершенствованный камуфляжный рисунок"
 camo1942_desc:0 "Новый камуфляж снижает заметность войск при засадах и проникновении."
 camo1948:0 "Полусовременный камуфляжный рисунок"
 camo1948_desc:0 "Новый камуфляж легче и эффективнее, улучшая действия в засадах и скрытное проникновение."
 camo1955:0 "Современный камуфляжный рисунок"
 camo1955_desc:0 "Вот он есть — и вот его нет."
 winter_clothes_gw:0 "Зимняя одежда"
 winter_clothes_gw_desc:0 "Зимняя одежда из шерсти. Не слишком эффективная, но лучше, чем ничего."
 winter_clothes_1939:0 "Улучшенная зимняя одежда"
 winter_clothes_1939_desc:0 "Более качественная зимняя одежда с тёплой ватной курткой."
 winter_clothes_1941:0 "Усовершенствованная зимняя одежда"
 winter_clothes_1941_desc:0 "Усовершенствованная зимняя одежда из натуральной тёплой шерсти и искусственного меха, покрытая ранним гидрофобным составом и окрашенная в белый цвет."
 winter_clothes_1944:0 "Современная зимняя одежда"
 winter_clothes_1944_desc:0 "Современная двусторонняя зимняя одежда из тёплой синтетической ткани со съёмной водоотталкивающей ветрозащитной курткой. Белая, чёрная и коричневая окраска повышает эффективность в бою, а сама одежда облегчает нагрузку и сохраняет солдат в тепле и сухости."
 jngdst_clothes_gw:0 "Одежда для пустыни и джунглей"
 jngdst_clothes_gw_desc:0 "Одежда для пустыни и джунглей из хлопка. Не слишком практичная, но лучше, чем ничего."
 jngdst_clothes_1939:0 "Улучшенная одежда для пустыни и джунглей"
 jngdst_clothes_1939_desc:0 "Более качественная одежда из тонкого хлопка. Добавлены защитные очки для солдат, сражающихся в песчаной местности."
 jngdst_clothes_1941:0 "Усовершенствованная одежда для пустыни и джунглей"
 jngdst_clothes_1941_desc:0 "Усовершенствованная одежда из натурального тонкого хлопка со специальным быстро высыхающим покрытием для жарких и влажных условий."
 jngdst_clothes_1944:0 "Современная одежда для пустыни и джунглей"
 jngdst_clothes_1944_desc:0 "Современная одежда из уникальной лёгкой ткани с теплоотражающей курткой. Песочная, чёрная и коричневая окраска повышает эффективность в бою, а сама форма облегчает нагрузку и сохраняет солдат в прохладе и сухости."
 AIR_TITLE_DROPTANK:0 "Подвесной топливный бак"
 droptank40:0 "Подвесной топливный бак I"
 droptank40_desc:0 "Установка внешнего топливного бака увеличит дальность полёта самолётов."
 droptank44:0 "Подвесной топливный бак II"
 droptank44_desc:0 "Более крупный и лёгкий внешний топливный бак."
 droptank45:0 "Подвесной топливный бак III"
 droptank45_desc:0 "Новейший подвесной бак увеличит дальность самолёта, но для компенсации массы потребуется реактивный двигатель."
 droptank55:0 "Подвесной топливный бак IV"
 droptank55_desc:0 "Наши баки стали легче и теперь вмещают ещё больше топлива."
 r56_tooltip_SRD_unlock:0 "Открывает Отдел специальных исследований"
 elite_forces_02:0 "Элитные войска II"
 elite_forces_02_desc:0 "Только лучшие из лучших попадут в войска специального назначения. Прошедшие подготовку солдаты будут сильнее, быстрее и станут сражаться упорнее всех остальных."
