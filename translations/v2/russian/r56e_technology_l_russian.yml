 icbm_missile_equipment_1:0 "Ядерная межконтинентальная баллистическая ракета"
 icbm_missile_equipment_1_desc:0 "Вершина ядерной науки и ракетостроения: эти межконтинентальные баллистические ракеты сочетают невероятную дальность удара с возможностью доставить ядерную боеголовку в любое время и в любую точку мира. Уничтожение цели практически гарантировано одной такой ракетой."
 nukes_3:0 "Миниатюрные ядерные заряды"
 nukes_3_desc:0 "Дальнейшее развитие конструкции ядерного оружия позволяет создавать небольшие линейные имплозионные заряды, помещающиеся в чемодан. Эти ужасающие устройства стали возможны благодаря лучшему пониманию производства эффективных делящихся материалов, что одновременно повышает мощность и обычных ядерных боеприпасов."
