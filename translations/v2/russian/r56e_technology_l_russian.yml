 artillery_a:0 "Улучшение усовершенствованной артиллерии II"
 artillery_a_desc:0 "Первый выстрел — дьяволу, второй — Богу, а третий — королю."
 artillery_c:0 "Улучшение полусовременной артиллерии I"
 artillery_c_desc:0 "Точная обработка и другие доработки каждой части батареи повысили общую мощность и надёжность."
 artillery_d:0 "Улучшение полусовременной артиллерии II"
 artillery_d_desc:0 "Снижение массы орудий повысило их эффективность."
 artillery_e:0 "Улучшение полусовременной артиллерии III"
 artillery_e_desc:0 "Артиллерия с обтекаемыми снарядами, способными достигать большей скорости."
 rocket_artillery_a:0 "Улучшение усовершенствованной реактивной артиллерии"
 rocket_artillery_a_desc:0 "Можно уверенно сказать, что в будущем появятся гораздо более лёгкие и прочные материалы, которые снизят стоимость ракет."
 rocket_artillery_b:0 "Улучшение усовершенствованной реактивной артиллерии II"
 rocket_artillery_b_desc:0 "Ракеты можно сделать настолько мощными, что они смогут запустить человека. Только постарайтесь не оказаться на Луне, хорошо?"
 rocket_artillery_d:0 "Улучшение полусовременной реактивной артиллерии"
 rocket_artillery_d_desc:0 "Ракеты с повышенной скоростью и мощностью запуска."
 rocket_artillery_e:0 "Улучшение полусовременной реактивной артиллерии II"
 rocket_artillery_e_desc:0 "Корпус установки усовершенствован, что повысило эффективность и надёжность."
 antiair_a:0 "Улучшение усовершенствованной ПВО"
 antiair_a_desc:0 "Зачем армии новые дорогие орудия? Неужели пилоты, по которым мы стреляли все эти годы, начали жаловаться?"
 antiair_b:0 "Улучшение усовершенствованной ПВО II"
 antiair_b_desc:0 "Слева раздавались резкие взрывы пехотной артиллерии. Справа с передовой доносились редкие пушечные выстрелы, а над головой было ясное небо и яркое солнце."
 antiair_d:0 "Улучшение полусовременной ПВО"
 antiair_d_desc:0 "Мы значительно продвинулись в интеграции артиллерийских систем с радарами."
 antiair_e:0 "Улучшение полусовременной ПВО II"
 antiair_e_desc:0 "Дальнейшее развитие радаров и их интеграции позволило добиться максимальной эффективности."
 antitank_a:0 "Улучшение усовершенствованной противотанковой артиллерии"
 antitank_a_desc:0 "Если танки добьются успеха, победа последует за ними. Если они потерпят неудачу, мы пропали."
 antitank_b:0 "Улучшение усовершенствованной противотанковой артиллерии II"
 antitank_b_desc:0 "Вашими самыми тяжёлыми орудиями станут воля к жизни. Поддерживайте их любой ценой и молитесь, чтобы вражеские не оказались крупнее."
 antitank_d:0 "Улучшение полусовременной противотанковой артиллерии"
 antitank_d_desc:0 "Наши снаряды теперь обладают значительно большей пробивной способностью и мощностью."
 antitank_e:0 "Улучшение полусовременной противотанковой артиллерии II"
 antitank_e_desc:0 "Точность и управляемость каждого выстрела значительно улучшены."
 paratroopers_a:0 "Воздушно-десантные войска IV"
 paratroopers_a_desc:0 "Всё, что взлетает, должно приземлиться."
 paratroopers_b:0 "Воздушно-десантные войска V"
 paratroopers_b_desc:0 "Всё, что взлетает, должно приземлиться."
 paratroopers_c:0 "Воздушно-десантные войска VI"
 paratroopers_c_desc:0 "Всё, что взлетает, должно приземлиться."
 marines_a:0 "Морская пехота IV"
 marines_a_desc:0 "Нас понимают лишь два вида людей: морские пехотинцы и враг. У всех остальных мнение из вторых рук."
 marines_b:0 "Морская пехота V"
 marines_b_desc:0 "Нас понимают лишь два вида людей: морские пехотинцы и враг. У всех остальных мнение из вторых рук."
 marines_c:0 "Морская пехота VI"
 marines_c_desc:0 "Нас понимают лишь два вида людей: морские пехотинцы и враг. У всех остальных мнение из вторых рук."
 mountaineers_a:0 "Горная пехота IV"
 mountaineers_a_desc:0 "«Ещё один холм»? Да, именно так называется гора, на которую нам предстоит подняться."
 mountaineers_b:0 "Горная пехота V"
 mountaineers_b_desc:0 "«Ещё один холм»? Да, именно так называется гора, на которую нам предстоит подняться."
 mountaineers_c:0 "Горная пехота VI"
 mountaineers_c_desc:0 "«Ещё один холм»? Да, именно так называется гора, на которую нам предстоит подняться."
 night_vision_a:0 "Ночное видение III"
 night_vision_a_desc:0 "Возможность видеть врага, оставаясь невидимым для него, имеет первостепенное значение. Новая технология приближает нас к этой цели."
 TITLE_WONDERWAFFLE_SUBTITLE:0 "Разработка чудо-оружия"
 r56_centralized_military_research_and_development:0 "Централизованные военные исследования и разработки"
 GER_r56_centralized_military_research_and_development:0 "Гибель богов"
 GER_r56_centralized_military_research_and_development_short:0 "Гибель богов"
 GER_r56_centralized_military_research_and_development_desc:0 "Собрав лучшие умы страны под одной крышей, мы сможем лучше направлять проекты, способные создать технологии, прежде доступные лишь богам!"
 r56_centralized_military_research_and_development_short:0 "Централизованные военные НИОКР"
 r56_centralized_military_research_and_development_desc:0 "Собрав лучшие умы страны под одной крышей, мы сможем лучше направлять проекты, способные создать технологии, ещё несколько лет назад казавшиеся немыслимыми."
 future_radar:0 "AN/APS-2"
 future_radar_desc:0 "Наш бортовой радар перехвата теперь достаточно совершенен и способен заметно повлиять на исход воздушных боёв."
 future_radar_2:0 "AN/APS-4"
 future_radar_2_desc:0 "Дальнейшее повышение чувствительности и дальности систем позволило создать ещё более совершенные устройства для установки на самолёты."
 future_radar_3:0 "AN/APS-6"
 future_radar_3_desc:0 "Мы продолжаем совершенствовать системы и разрабатывать ещё более качественные устройства для установки на самолёты."
 future_computing_machine:0 "Серия «Колосс»"
 future_computing_machine_desc:0 "Чем они больше, тем сложнее вычисления."
 future_computing_machine_2:0 "ENIAC"
 future_computing_machine_2_desc:0 "Мы внедрили ещё более быстрые операции чтения и записи и теперь можем надёжно загружать программы в систему."
 future_computing_machine_3:0 "LEO I"
 future_computing_machine_3_desc:0 "Наши системы стали настолько мощными, что можно начать автоматизировать отдельные офисные задачи, открывая новую эпоху производительности."
 future_computing_machine_4:0 "Ранние транзисторы"
 future_computing_machine_4_desc:0 "Биполярный транзистор превосходит электронную лампу во всём. Мы ожидаем его быстрого распространения и последующего стремительного развития вычислительной техники."
 future_decryption:0 "Дешифрование Mk-1"
 future_decryption_desc:0 "«Это работало пять лет. Зачем что-то менять?» (Запись Дж. Уильямса, 18:45, RS8)"
 future_encryption:0 "Шифрование Mk-1"
 future_encryption_desc:0 "Кажется, теперь они шифруют даже списки покупок, лишь бы поиздеваться над нами."
 future_decryption_2:0 "Дешифрование Mk-2"
 future_decryption_2_desc:0 "124.89 12.88 45.45.907"
 future_encryption_2:0 "Шифрование Mk-2"
 future_encryption_2_desc:0 "Считайте это опасным — таково первое правило. Об остальных подумайте, когда разберётесь, как и почему оно работает."
 future_decryption_3:0 "Дешифрование Mk-3"
 future_decryption_3_desc:0 "Святой Грааль для нас — список кличек домашних животных, а дни рождения, пожалуй, идут вторыми."
 future_encryption_3:0 "Шифрование Mk-3"
 future_encryption_3_desc:0 "Наши коды настолько сложны, что даже собственные специалисты не умеют ими пользоваться."
 basic_identification_friend_or_foe:0 "Система опознавания «свой — чужой»"
 basic_identification_friend_or_foe_desc:0 "Используя технологию радиопеленгации, можно создать работоспособную систему опознавания «свой — чужой» для самолётов."
 ENG_basic_identification_friend_or_foe:0 "Система Pip-squeak"
 rdf0:0 "Высокочастотная радиопеленгация"
 rdf0_desc:0 "Разработка более совершенных высокочастотных пеленгаторов позволит быстрее перехватывать передачи и определять местоположение коротких радиосигналов."
 ENG_rdf0:0 "Высокочастотный пеленгатор Уотсона-Уатта"
 USA_rdf0:0 "Высокочастотный пеленгатор Беллини — Този"
 rdf1:0 "Радиопеленгация"
 rdf1_desc:0 "Перехват незаконных передач партизан укрепит наши возможности по борьбе с повстанцами."
 rdf2:0 "Улучшенная радиопеленгация"
 rdf2_desc:0 "Более точный перехват незаконных передач партизан укрепит наши возможности по борьбе с повстанцами."
 rdf3:0 "Усовершенствованная радиопеленгация"
 rdf3_desc:0 "Перехват незаконных передач партизан с помощью ранней триангуляции укрепит наши возможности по борьбе с повстанцами."
 rdf4:0 "Современная радиопеленгация"
 rdf4_desc:0 "Перехват незаконных передач партизан с помощью более точной триангуляции укрепит наши возможности по борьбе с повстанцами."
 rdf5:0 "Радиопеленгация 1949 года"
 rdf5_desc:0 "Перехват незаконных передач партизан с помощью почти точной триангуляции укрепит наши возможности по борьбе с повстанцами."
 rdf6:0 "Радиообнаружение 1953 года"
 rdf6_desc:0 "Мы обнаружим их, где бы они ни находились. Им негде спрятаться, некуда бежать и совершенно невозможно добиться успеха."
 rdf_partisan:0 "Пеленгация партизанских радиостанций"
 rdf_partisan_desc:0 "Применяя высокочастотную радиопеленгацию к известным передачам партизан, можно приблизительно определить районы их действий. Затем мы сможем зачистить территорию или заранее отступить, если обнаружена активность и ожидаются атаки, с которыми невозможно справиться. Оба варианта позволяют экономить людские ресурсы и жизни гарнизонных войск."
 semi_modern_radio:0 "Полусовременная радиосвязь"
 semi_modern_radio_desc:0 "Многоканальные переносные радиостанции позволяют младшим офицерам лучше связываться с отдельными огневыми группами и подразделениями поддержки, значительно улучшая координацию."
 modern_radio:0 "Современная радиосвязь"
 modern_radio_desc:0 "Радиосвязь на уровне отделения улучшит взаимодействие с офицерами и поможет командованию рассеять часть тумана войны."
 streamlined_line_a:0 "Поточная линия II"
 streamlined_line_a_desc:0 "Рабочий должен всегда держать левую руку в пятнадцати сантиметрах от станка. Нога должна находиться между центральным рычагом и красной отметкой."
 flexible_line_a:0 "Гибкая линия II"
 flexible_line_a_desc:0 "Слышите этот гул в небе? Значит, скоро нам снова придётся строить новую линию с нуля."
 streamlined_line_b:0 "Оптимизированное производство"
 streamlined_line_b_desc:0 "Мы объединили принципы поточного и гибкого производства, создав ещё более совершенный процесс."
 streamlined_line_c:0 "Полусовременное производство"
 streamlined_line_c_desc:0 "Дальнейшее развитие инструментов привело к появлению более совершенных производственных методов и возможностей."
 streamlined_line_d:0 "Современное производство"
 streamlined_line_d_desc:0 "Наши производственные возможности соответствуют самым передовым стандартам и позволяют массово выпускать почти всё."
 concentrated_industry_a:0 "Концентрированная промышленность VI"
 concentrated_industry_a_desc:0 "На каждую их пулю мы произведём тысячу. Выпустим столько металла, что даже если наши бойцы промахнутся каждым выстрелом, враг всё равно в нём утонет."
 dispersed_industry_a:0 "Рассредоточенная промышленность VI"
 dispersed_industry_a_desc:0 "Когда привыкнешь, всё не так плохо. Здесь лишь летучие мыши, дурной запах и множество людей, уже не помнящих, как выглядит солнце."
 concentrated_industry_b:0 "Концентрированная промышленность VII"
 concentrated_industry_b_desc:0 "Современные мегазаводы затмевают даже самые передовые предприятия всего нескольких лет назад."
 dispersed_industry_b:0 "Рассредоточенная промышленность VII"
 dispersed_industry_b_desc:0 "Мы значительно улучшили буровые возможности и теперь способны создавать обширные подземные комплексы."
 concentrated_industry_c:0 "Концентрированная промышленность VIII"
 concentrated_industry_c_desc:0 "Вертикальная интеграция производственных процессов заметно расширила наши возможности."
 dispersed_industry_c:0 "Рассредоточенная промышленность VIII"
 dispersed_industry_c_desc:0 "Даже при тяжёлых бомбардировках поверхности мы сможем выстоять под землёй и продолжать производство без перебоев."
 concentrated_industry_d:0 "Концентрированная промышленность IX"
 concentrated_industry_d_desc:0 "Практически любую отрасль можно разместить рядом с другой и получить максимальную выгоду от концентрации."
 dispersed_industry_d:0 "Рассредоточенная промышленность IX"
 dispersed_industry_d_desc:0 "Наши цепочки снабжения рассредоточены, но эффективны, а заводы полностью укреплены против самых тяжёлых атак."
 construction_a:0 "Строительство VI"
 construction_a_desc:0 "Новые строительные методы позволяют применять железобетон для возведения более крупных, высоких и массивных производственных объектов. Национальные электростанции также станут долговечнее и устойчивее к землетрясениям."
 excavation_a:0 "Добыча ресурсов VI"
 excavation_a_desc:0 "Земля истекает кровью, и ваша задача — не дать потоку остановиться."
 construction_b:0 "Строительство VII"
 construction_b_desc:0 "Нужно построить быстро и дёшево? Мы справимся. Только не задавайте лишних вопросов."
 excavation_b:0 "Добыча ресурсов VII"
 excavation_b_desc:0 "В этих холмах скрыто ещё больше полезных ископаемых, и мы доберёмся до них любой ценой."
 construction_c:0 "Строительство VIII"
 construction_c_desc:0 "Мы можем на ходу развернуть практически любой проект. Возможно, он получится не слишком прочным, но свою задачу выполнит."
 excavation_c:0 "Добыча ресурсов VIII"
 excavation_c_desc:0 "Ещё десять лет назад такие машины до смерти напугали бы любого. Для нас же они означают лишь одно: больше."
 construction_d:0 "Строительство IX"
 construction_d_desc:0 "Современные методы позволяют строить что угодно, где угодно и когда угодно. Но это не значит, что мы станем платить этим мерзавцам больше."
 excavation_d:0 "Добыча ресурсов IX"
 excavation_d_desc:0 "Костный мозг Земли питает нас, а её рудные жилы уже вскрыты."
 rubber_plant_a:0 "Базовый завод синтетического каучука"
 rubber_plant_a_desc:0 "Наши знания в производстве синтетического топлива позволяют выпускать искусственный каучук."
 rubber_plant_b:0 "Улучшенный завод синтетического каучука"
 rubber_plant_b_desc:0 "Дальнейшее совершенствование синтетического производства позволило добиться ещё большей отдачи."
 rubber_plant_c:0 "Усовершенствованный завод синтетического каучука"
 rubber_plant_c_desc:0 "Теперь наши передовые заводы способны дёшево производить огромное количество каучука."
 rubber_plant_d:0 "Современный завод синтетического каучука"
 rubber_plant_d_desc:0 "Теперь наши передовые заводы способны дёшево производить огромное количество каучука."
 semi_modern_landing_craft:0 "Полусовременные десантные суда"
 semi_modern_landing_craft_desc:0 "Просто подожмите колени и надейтесь на лучшее."
 modern_landing_craft:0 "Современные десантные суда"
 modern_landing_craft_desc:0 "Сколько ещё людей мы вообще сможем сюда втиснуть?"
 aluminum_production_1:0 "Производство алюминия"
 aluminum_production_1_desc:0 "Недавнее развитие технологий переработки позволяет увеличить производство алюминия."
 aluminum_production_2:0 "Производство алюминия II"
 aluminum_production_2_desc:0 "Усовершенствованные методы переработки позволяют умеренно увеличить производство алюминия."
 aluminum_production_3:0 "Производство алюминия III"
 aluminum_production_3_desc:0 "Новые методы переработки позволяют значительно увеличить производство алюминия."
 aluminum_production_4:0 "Производство алюминия IV"
 aluminum_production_4_desc:0 "Новые методы переработки позволяют довести производство алюминия до уровня, о котором ещё несколько лет назад нельзя было и мечтать."
 aluminum_production_tt:0 "Изменяет объём ресурсов §3алюминиевого завода§! на: §G+2§!£resources_strip|2"
 steel_production_1:0 "Производство стали"
 steel_production_1_desc:0 "Недавнее развитие технологий переработки позволяет увеличить производство стали."
 steel_production_2:0 "Производство стали II"
 steel_production_2_desc:0 "Усовершенствованные методы переработки позволяют умеренно увеличить производство стали."
 steel_production_3:0 "Производство стали III"
 steel_production_3_desc:0 "Наши методы переработки достигли высокого уровня, и при необходимости мы можем регулярно выпускать значительные объёмы металла."
 steel_production_4:0 "Производство стали IV"
 steel_production_4_desc:0 "Наше производство стали стало настолько развитым, что мы практически способны наводнить ею рынок — к облегчению и раздражению других стран."
 steel_production_tt:0 "Изменяет объём ресурсов §3сталелитейного завода§! на: §G+2§!£resources_strip|5"
 nuke_naval:0 "Ядерная энергетика флота"
 nuke_naval_desc:0 "Мы теоретически можем установить ядерные реакторы на крупнейшие и мощнейшие корабли. Надеемся, со временем удастся воплотить это в жизнь.\n§RТребуется количество§! §Lядерных реакторов§! §R> 3§!"
 nukes_2:0 "Термоядерные эксперименты"
 nukes_2_desc:0 "Разработаны проекты бомбы, использующей деление ядра для запуска более мощной термоядерной реакции. Это позволит значительно увеличить мощность заряда."
 semi_modern_rocket_engines:0 "Международная ракетная техника"
 semi_modern_rocket_engines_desc:0 "Новые ракеты используют идеи и теории, полученные из других стран."
 modern_rocket_engines:0 "Ранние межконтинентальные баллистические ракеты"
 modern_rocket_engines_desc:0 "Мы начали испытания и подготовку основы для ракет, способных выходить в космос и доставлять боевую нагрузку в любую точку планеты."
 tech_engineers_a:0 "Инженерная рота V"
 tech_engineers_a_desc:0 "Специализированная подготовка и стандартизация снаряжения значительно улучшат строительные возможности сапёров, позволяя возводить укрепления даже в самых суровых условиях."
 tech_engineers_b:0 "Инженерная рота VI"
 tech_engineers_b_desc:0 "По мере развития реактивной авиации и инфракрасных технологий инженеры будут обучаться передовым методам маскировки."
 tech_engineers_c:0 "Инженерная рота VII"
 tech_engineers_c_desc:0 "Боевые инженеры будущего обеспечат готовность наших войск к нападению в любых условиях."
 tech_recon_a:0 "Разведывательная рота V"
 tech_recon_a_desc:0 "Глубокая разведка, сочетающая шпионаж и подготовку коммандос, улучшит тактический выбор и позволит быстрее адаптировать решения."
 tech_recon_b:0 "Разведывательная рота VI"
 tech_recon_b_desc:0 "Создание замаскированных складов снабжения в тылу врага даст разведчикам больше времени на сбор данных и позволит новым группам продолжать уже начатые операции глубокой разведки."
 tech_recon_c:0 "Разведывательная рота VIII"
 tech_recon_c_desc:0 "Оснастив разведывательные группы инфракрасным оборудованием и обучив их распознавать тепловые сигнатуры, мы повысим точность сведений о противнике и сможем лучше подготовить меры противодействия."
 tech_military_police_a:0 "Военная полиция V"
 tech_military_police_a_desc:0 "Безопасный контроль оккупированной территории требует как восстановления нормальной жизни, так и беспощадного устранения сопротивления. Военная полиция должна начать этот процесс как можно раньше ради безопасности солдат и гражданских."
 tech_military_police_b:0 "Военная полиция VI"
 tech_military_police_b_desc:0 "Иногда недостаточно просто ждать неприятностей. Координируясь с разведкой, мы можем провоцировать контролируемые восстания в нужном месте и времени, чтобы избавиться от самых опасных зачинщиков."
 tech_military_police_c:0 "Военная полиция VII"
 tech_military_police_c_desc:0 "При длительной оккупации военную полицию должны поддерживать переводчики, социологи и антропологи. Немного понимания способно принести большую пользу."
 tech_maintenance_company_a:0 "Ремонтная рота V"
 tech_maintenance_company_a_desc:0 "Опыт проектирования систем с активным резервированием времён Великой войны можно применить к современной технике, упростив её обслуживание."
 tech_maintenance_company_b:0 "Ремонтная рота VI"
 tech_maintenance_company_b_desc:0 "Небольшие полевые руководства в машинах позволят обычным солдатам выполнять базовое обслуживание, а ремонтным ротам сосредоточиться на более сложных проблемах."
 tech_maintenance_company_c:0 "Ремонтная рота VII"
 tech_maintenance_company_c_desc:0 "Разделение критически важных систем уменьшит зависимость от активного резервирования и позволит технике ограниченно работать даже при тяжёлых повреждениях."
 tech_field_hospital_a:0 "Полевой госпиталь V"
 tech_field_hospital_a_desc:0 "При помощи инженерных рот можно строить более прочные и легко обороняемые полевые госпитали, обеспечивая безопасность выздоравливающих солдат."
 tech_field_hospital_b:0 "Полевой госпиталь VI"
 tech_field_hospital_b_desc:0 "Новое авиационное изобретение — вертолёт — позволит быстрее доставлять медиков для сортировки раненых. Выигранное время будет жизненно важно для их спасения."
 tech_field_hospital_c:0 "Полевой госпиталь VII"
 tech_field_hospital_c_desc:0 "Несмотря на прогресс полевой медицины, многие решения остаются импровизированными и не оформлены в доктрину. Дополнительный опыт позволит яснее определить роль этих частей и закрепить лучшие нововведения."
 tech_logistics_company_a:0 "Рота снабжения V"
 tech_logistics_company_a_desc:0 "Цветовая маркировка различных категорий снаряжения — простой, но эффективный способ упростить логистику."
 tech_logistics_company_b:0 "Рота снабжения VI"
 tech_logistics_company_b_desc:0 "Стандартизированная классификация припасов уменьшит путаницу и повысит эффективность планирования."
 tech_logistics_company_c:0 "Рота снабжения VII"
 tech_logistics_company_c_desc:0 "Дальнейшее разделение категорий снаряжения на многочисленные подкатегории значительно улучшит его организацию."
 tech_signal_company_a:0 "Рота связи V"
 tech_signal_company_a_desc:0 "Среди наших связистов есть специалисты с непревзойдённым практическим опытом использования оборудования в полевых условиях. Их участие в исследованиях новых средств связи позволит применить эти знания."
 tech_signal_company_b:0 "Рота связи VI"
 tech_signal_company_b_desc:0 "По мере развития технологий радиостанции смогут работать на гораздо больших расстояниях, упрощая связь между всеми подразделениями армии."
 tech_signal_company_c:0 "Рота связи VII"
 tech_signal_company_c_desc:0 "Шифрование радиосвязи жизненно важно для сохранения внезапности. Применение импульсного сжатия в радиостанциях сорвёт попытки врага вести прослушивание."
 etat_folder:0 "РП"
 etat_folder_desc:0 "Расширенная промышленность и снаряжение"
 etax_folder:0 "ОСИ"
 etax_folder_desc:0 "Отдел специальных исследований"
 ETAX_TITLE_DOCTRINE_X:0 "Отдел специальных исследований"
 r56_vechicles_folder:0 "Механизированная пехота"
 r56_vechicles_folder_desc:0 "Снаряжение для механизированных пехотных войск."
 etax_doctrine:0 "Отдел специальных исследований"
 etax_doctrine_desc:0 "Необходимо создать отдел, который сосредоточит исследовательские усилия и направит армию и промышленность на пользу стране."
 etax_army_focus:0 "Приоритет армии"
 etax_army_focus_desc:0 "Возможности сухопутных войск имеют первостепенное значение и получат приоритет перед другими родами вооружённых сил."
 etax_navy_focus:0 "Приоритет флота"
 etax_navy_focus_desc:0 "Без способного флота страна погибнет. Поэтому мы должны приложить все усилия для расширения и укрепления военно-морских сил."
 etax_air_focus:0 "Приоритет авиации"
 etax_air_focus_desc:0 "Будущее принадлежит небу, поэтому следует посвятить себя созданию сильнейших военно-воздушных сил в мире."
 etax_army_firepower:0 "Огневая мощь стрелкового оружия"
 etax_army_firepower_desc:0 "Ставка на огневую мощь приведёт нас к победе. Это направление дало мощное стрелковое оружие и общее повышение его эффективности."
 etax_army_firepower_2:0 "Тяжёлая огневая мощь"
 etax_army_firepower_2_desc:0 "Тщательные исследования позволили значительно увеличить останавливающее действие тяжёлых орудий."
 etax_army_defense:0 "Бронированная армия"
 etax_army_defense_desc:0 "Наша армия способна выдерживать удары, которые остановили бы любого другого. Теперь мы легко перенесём любой конфликт."
 etax_army_defense_2:0 "Глубоко эшелонированные укрепления"
 etax_army_defense_2_desc:0 "Враг может бросить против нас всё, что имеет, но огромная глубина обороны измотает его до костей."
 etax_navy_firepower:0 "Сосредоточенный огонь"
 etax_navy_firepower_desc:0 "Приложив усилия, наши корабли смогут поражать почти любую цель на дальних дистанциях. Это разрушительно скажется на эффективности и боевом духе противника."
 etax_navy_firepower_2:0 "Ударный потенциал"
 etax_navy_firepower_2_desc:0 "Наш флот умеет наносить удары, сосредотачивать огонь и сокрушать даже самого уверенного противника."
 etax_navy_defense:0 "Усиленные корпуса"
 etax_navy_defense_desc:0 "С ростом эффективности вражеского оружия и авиаударов необходимо соответствующим образом модернизировать флот."
 etax_navy_defense_2:0 "Оборона региона"
 etax_navy_defense_2_desc:0 "Постоянное знание местоположения врага само по себе является ценнейшим оружием."
 etax_air_firepower:0 "Господство в воздухе"
 etax_air_firepower_desc:0 "Мало кто способен оспорить небо, где действуют наши самолёты, а скорость перехвата врага не имеет равных."
 etax_air_firepower_2:0 "Бомбардировочное наступление"
 etax_air_firepower_2_desc:0 "Наши бомбардировщики способны уничтожить всё, что попадает в прицел, оставляя после себя одни руины."
 etax_air_defense:0 "Эшелонированные зоны обороны"
 etax_air_defense_desc:0 "Мы приложили все усилия для координации обороны, чтобы ни один участок земли и ни одна птица в небе не остались без прикрытия."
 etax_air_defense_2:0 "Манёвренные самолёты"
 etax_air_defense_2_desc:0 "Иногда скорость ценнее любой брони, а в воздушном бою она становится самым смертоносным элементом."
 etax_the_means:0 "Средства"
 etax_the_means_desc:0 "Двигаясь вперёд, нельзя забывать о принципах. Если солдаты гордятся нашим делом, они выдержат любые испытания."
 etax_the_ends:0 "Цели"
 etax_the_ends_desc:0 "Наше преимущество заключается в готовности делать то, на что другие не осмеливаются. Если выйти за границы допустимого, доступные средства станут безграничными."
 etax_business_interests:0 "Интересы бизнеса"
 etax_business_interests_desc:0 "Развитие частного сектора увеличит количество фабрик, способных производить товары."
 etax_cost_plus:0 "Возмещение затрат"
 etax_cost_plus_desc:0 "Пока деньги продолжают поступать и в хорошие, и в плохие времена, предприятия будут выполнять заказы."
 etax_production_in_depth:0 "Цепочка снабжения"
 etax_production_in_depth_desc:0 "Повторное использование материалов на местах позволит сохранять производство, даже если не всё сырьё достигает заводов."
 etax_unity:0 "Общее дело"
 etax_unity_desc:0 "Все сражаются ради одной цели, поэтому наши войска способны бороться дольше и упорнее, чем кто-либо ожидает."
 etax_broad_support:0 "Всеобщая вовлечённость"
 etax_broad_support_desc:0 "Мы можем использовать людей из всех слоёв общества, не оставляя никого в стороне. Есть пульс — значит, можешь сражаться."
 etax_inclusive_science:0 "Научное сообщество"
 etax_inclusive_science_desc:0 "Наши учёные происходят из самых разных кругов, и мы не позволяем идеологии или предубеждениям мешать прогрессу."
 etax_desperation:0 "Самопожертвование"
 etax_desperation_desc:0 "Приложив усилия, можно убедить население довольствоваться меньшим и при этом сражаться столь же упорно."
 etax_no_qa:0 "Ускоренное производство"
 etax_no_qa_desc:0 "Неотложные потребности фронта требуют иногда идти на уступки качеству. Пусть изделия хуже, но их огромное количество в итоге сокрушит врага."
 etax_expendable_labor:0 "Расходная рабочая сила"
 etax_expendable_labor_desc:0 "Кирпичи наших стен оплачены кровью, а цемент замешан на костях. Никто не скажет, что мы не заплатили цену, необходимую для победы."
 etax_glory:0 "Слава"
 etax_glory_desc:0 "Нет ничего благороднее и подлиннее искусства боя. Человек не проходит настоящего испытания, пока не бросится в сражение и не позволит горнилу войны закалить сердце."
 etax_purity:0 "Отборные ряды"
 etax_purity_desc:0 "Мы удалили из войск всех непригодных к службе, оставив лишь сильнейших и наиболее преданных."
 etax_great_leap:0 "Научная координация"
 etax_great_leap_desc:0 "Пока другие довольствуются жалкими постепенными усилиями, мы не боимся рисковать и делать ставку на технологии далёкого будущего."
 etax_grand_projects:0 "Специализированная инженерия"
 etax_grand_projects_desc:0 "Нельзя победить врага лишь немного лучшим цементом. Нужны огневая мощь и смерть с небес."
 etax_practical_projects:0 "Практическая инженерия"
 etax_practical_projects_desc:0 "Наши силы сосредоточились на основах и разработали способы улучшить базовые процессы производства на всех этапах цепочки снабжения."
 etax_moonshot:0 "Авиация будущего"
 etax_moonshot_desc:0 "Сосредоточенность на господстве в воздухе принесла выдающиеся достижения. Теперь наше превосходство в небе совершенно неоспоримо."
 etax_super_soldiers:0 "Боевые стимулы"
 etax_super_soldiers_desc:0 "Наши солдаты могут маршировать дольше и быстрее, чем считалось ранее, добавляя мощные стимулы к нашим полевым пайкам. Неприятным побочным продуктом является то, что такие вещества вызывают чувство печали после длительного использования.\n\nНе предназначен для гражданского использования. Не обозначен для перепродажи."
 etax_the_bomb:0 "Проект"
 etax_the_bomb_desc:0 "Учёные направили все усилия на пугающую, но блестящую идею. В итоге она не дала желаемого результата, однако позволила неизмеримо продвинуть все области исследований."
 etax_seashot:0 "Флот будущего"
 etax_seashot_desc:0 "Наши корабли внушают ужас и способны легко сокрушить почти любые вражеские силы, кроме самых стойких."
 etax_quality:0 "Качественное производство"
 etax_quality_desc:0 "Мы сделали всё необходимое для правильной оснастки и строгих испытаний, чтобы полевое снаряжение служило долго."
 etax_great_works:0 "Великие проекты"
 etax_great_works_desc:0 "Огромные средства направлены на доведение возможностей страны до предела и дальше. Вся наша экономическая и производственная система создана, чтобы внушать благоговение."
 jaeger:0 "Пехота Jaeger"
 jaeger_desc:0 "Джагеры — это силы, которые специализируются на выживании в холоде и пустыне бореального леса. Как правило, эти войска являются родными для своей территории и требуют больше времени для обучения.\n \n§GЭтот тип подразделения не учитывается в кепке спецназа, а вместо этого требует 5 вспомогательных средств на батальон.§!"
 jungletroop:0 "Пехота для джунглей"
 jungletroop_desc:0 "Специалисты по джунглям обучены выживать в суровых условиях войны в джунглях и сражаться с врагом на его территории.\n \n§GЭтот тип войск не учитывается в лимите спецназа, но требует 5 ед. вспомогательного снаряжения на батальон§!"
 desertinfantry:0 "Пустынная пехота"
 desertinfantry_desc:0 "Боевые действия в пустыне подвергают войска множеству опасностей, но иногда их невозможно избежать. Специальная подготовка для этой местности позволит снизить риски.\n \n§GЭтот тип войск не учитывается в лимите спецназа, но требует 5 ед. вспомогательного снаряжения на батальон§!"
 shocktroop:0 "Штурмовые войска"
 shocktroop_desc:0 "Штурмовые войска способны прорвать вражеские линии и добиться прорыва. Они почти незаменимы для глубокой операции и могут серьёзно дезорганизовать обороняющихся."
