l_russian:
 korea_focus:0 "Корейские национальные фокусы"
 KOR_neutrality_party_independence_long:0 "Партия независимости Кореи"
 KOR_neutrality_party_independence:0 "ПНК"
 KOR_Industrial_Boom:0 "Промышленный бум"
 KOR_Industrial_Boom_desc:0 "Наши недавние инвестиции и политические решения, направленные на промышленный рост Кореи, принесли плоды. Экономисты прогнозируют приближение экономического бума, поэтому мы должны использовать грядущий приток дополнительных частных инвестиций, чтобы ещё сильнее ускорить наш экономический рост."
 KOR_Industrial_Expansion:0 "Расширение промышленности"
 KOR_Industrial_Expansion_desc:0 "После притока дополнительных промышленных инвестиций, вызванного бумом, мы можем приступить к строительству более амбициозных объектов."
 KOR_modern_electronics:0 "Современная электроника"
 KOR_modern_electronics_desc:0 "Наша страна, возможно, и молода, но это вовсе не значит, что она должна отставать в технологическом развитии. Мы создадим самую передовую электронику в мире!"
 KOR_expanded_research_programs:0 "Расширенная исследовательская программа"
 KOR_expanded_research_programs_desc:0 "Расширение наших возможностей теперь позволяет нам финансировать ещё больше исследовательских программ одновременно."
 KOR_return_of_the_government_in_exile:0 "Возвращение правительства в изгнании"
 KOR_return_of_the_government_in_exile_desc:0 "Мечта республиканцев наконец осуществилась. После долгих лет изгнания для Кореи начинается новая эпоха — под властью собственного правительства."
 KOR_reorganize_the_administration:0 "Реорганизовать администрацию"
 KOR_reorganize_the_administration_desc:0 "После ухода японцев администрацию необходимо реорганизовать, чтобы она стала по-настоящему корейской структурой."
 KOR_repeal_colonial_restrictions:0 "Отменить колониальные ограничения"
 KOR_repeal_colonial_restrictions_desc:0 "При японском правлении было введено множество запретов, ограничивавших проявления корейской культуры. Среди них был и запрет на традиционную корейскую одежду."
 KOR_rise_of_the_chaebols:0 "Расцвет чеболей"
 KOR_rise_of_the_chaebols_desc:0 "Крупные семейные конгломераты способны сосредоточить промышленную мощь в одних руках. Единственный риск заключается в том, что они могут превратиться в корейский аналог японских дзайбацу."
 KOR_develop_gold_mining_near_unsan:0 "Развить золотодобычу возле Унсана"
 KOR_develop_gold_mining_near_unsan_desc:0 "Изначально переданная корейским императором в 1893 году в качестве горной концессии американскому предпринимателю, шахта возле Унсана зарекомендовала себя как надёжный источник драгоценного металла. Следует использовать её потенциал по максимуму."
 KOR_seoul_busan_infrastructure:0 "Инфраструктурный план Сеул—Пусан"
 KOR_seoul_busan_infrastructure_desc:0 "Развитие инфраструктуры в районе Сеула и Пусана — самый быстрый и экономически эффективный способ стремительно расширить и стимулировать наш промышленный сектор."
 KOR_hyundai_engineering:0 "Хёндэ Инжиниринг"
 KOR_hyundai_engineering_desc:0 "Наша страна, возможно, не богата ни ресурсами, ни землёй, но это компенсируется такими решительными людьми, как Чон Чжу Ён. Мы заключим контракты с его компанией «Хёндэ Инжиниринг» на развитие экономического потенциала Кореи."
 KOR_hyundai_vehicles:0 "Техника Хёндэ"
 KOR_hyundai_vehicles_desc:0 "Недостаток численности можно компенсировать, обеспечив наши войска более совершенным оснащением и транспортом. Одному из подразделений «Хёндэ Индастриз» можно поручить выпуск такой техники, что повысит стратегическую мобильность наших войск."
 KOR_modernize_mining_industry:0 "Модернизировать горнодобывающую промышленность"
 KOR_modernize_mining_industry_desc:0 "Копай-копай яму. Копай, копай, копай, копай, копай... прибыль!"
 KOR_expand_jinsen_arsenal:0 "Расширить арсенал Дзинсэн"
 KOR_expand_jinsen_arsenal_desc:0 "Во время японского правления арсенал Дзинсэн снабжал японские войска как в Китае, так и в Корее. Теперь, когда он находится под нашим контролем, мы можем превратить его в центр производства вооружений в Корее. Арсенал станет отличной базой для дальнейшего расширения выпуска оружия."
 KOR_daelim_petrochemicals:0 "Дэлим Петрокемикалс"
 KOR_daelim_petrochemicals_desc:0 "В настоящее время мы не располагаем природными источниками нефти, поэтому крайне важно развить производство синтетического топлива для нужд промышленности и вооружённых сил. Мы поручим выполнение этой задачи надёжной дочерней компании наших чеболей."
 KOR_military_industrial_cooperation:0 "Военно-промышленное сотрудничество"
 KOR_military_industrial_cooperation_desc:0 "Армия не может существовать без инженеров и рабочих рук, создающих современное оружие войны. Чеболи тоже должны внести свой вклад в оборону страны."
 KOR_hanjin_heavy_industries:0 "Ханджин Хэви Индастриз"
 KOR_hanjin_heavy_industries_desc:0 "В Корее уже существует крупная судостроительная компания. Нам следует расширить верфи и производственные мощности «Ханджин Индастриз», чтобы начать массовое строительство кораблей для корейского флота."
 KOR_peoples_fleet:0 "Народный флот"
 KOR_peoples_fleet_desc:0 "Мы не пожалеем никаких средств на создание Народного флота Кореи!"
 KOR_national_admiralty:0 "Национальное адмиралтейство"
 KOR_national_admiralty_desc:0 "В лучшие времена корейский флот защищал наши берега. Мы должны возродить морские традиции, даже если весь флот придётся создавать заново. Новым силам понадобятся компетентные морские офицеры и адмиралы."
 KOR_destroyer_focus:0 "Современные эсминцы"
 KOR_destroyer_focus_desc:0 "Разработка новых моделей эсминцев и кораблей сопровождения поможет нам создать основу военно-морского флота."
 KOR_cruiser_focus:0 "Современные крейсеры"
 KOR_cruiser_focus_desc:0 "Универсальные крейсеры, способные выполнять самые разные задачи, станут полезным дополнением к корейскому флоту."
 KOR_increase_naval_production:0 "Увеличить кораблестроение"
 KOR_increase_naval_production_desc:0 "Необходимо продолжить расширение существующих военно-морских верфей. Мы должны строить больше кораблей для патрулирования наших морей и защиты от морских десантов."
 KOR_a_s_warfare:0 "Противолодочная война"
 KOR_a_s_warfare_desc:0 "Подводная лодка — безмолвный охотник морей. Оснастив наши эсминцы средствами обнаружения и уничтожения субмарин, мы превратим охотника в добычу."
 KOR_naval_mine_warfare:0 "Минная война на море"
 KOR_naval_mine_warfare_desc:0 "Морские мины, возможно, являются самым дешёвым и эффективным способом защитить наши берега от нежелательных вражеских кораблей."
 KOR_the_old_japanese_model:0 "Японские корабли"
 KOR_the_old_japanese_model_desc:0 "Японские кораблестроители были талантливы. Нам стоит перенять их подход и сделать линкоры основой нашего флота."
 KOR_battleship_focus:0 "Ставка на линкоры"
 KOR_battleship_focus_desc:0 "Большие орудия для больших кораблей. Четыре трёхорудийные башни: две в носу и две в корме."
 KOR_the_biggest_battleship:0 "Самый большой линкор"
 KOR_the_biggest_battleship_desc:0 "Зачем подражать линкорам других держав, если мы можем построить ещё больший?"
 KOR_the_blocade_doctrine:0 "Доктрина блокады"
 KOR_the_blocade_doctrine_desc:0 "Если мы потопим достаточно вражеских конвоев, то сможем подорвать их экономику и снабжение."
 KOR_silent_service:0 "Безмолвная служба"
 KOR_silent_service_desc:0 "Для успешной реализации планов по рейдам на конвои необходимы современные подводные лодки."
 KOR_stealth_upgrades:0 "Улучшение скрытности"
 KOR_stealth_upgrades_desc:0 "Более скрытные подводные лодки смогут эффективнее сближаться с беззащитными вражескими конвоями."
 KOR_carrier_strikes:0 "Авианосные удары"
 KOR_carrier_strikes_desc:0 "Мы видели, как иностранные державы используют эти огромные плавучие авиабазы для наступательных операций на море. Возможно, и нам стоит попробовать такую тактику?"
 KOR_naval_air_groups:0 "Группы морской авиации"
 KOR_naval_air_groups_desc:0 "Теоретические знания у нас уже есть, теперь пора освоить практику нанесения воздушных ударов на море."
 KOR_lessons_for_the_air_force:0 "Уроки для военно-воздушных сил"
 KOR_lessons_for_the_air_force_desc:0 "Наша морская авиация накопила достаточно опыта действий с авианосцев. Следует внедрить этот опыт в военно-воздушных силах."
 KOR_defense_mobilization:0 "Оборонительная мобилизация"
 KOR_defense_mobilization_desc:0 "Корея больше никогда не должна попасть под иностранный контроль. Корейский народ поднимется на борьбу за свою страну!"
 KOR_embrace_peoples_tutelage:0 "Принять систему народной опеки"
 KOR_embrace_peoples_tutelage_desc:0 "Гоминьдан ясно понял, что китайский народ не сможет развиваться демократическим путём, пока не узнает о своих политических и гражданских правах. Мы можем перенять этот подход и просветить корейские массы, чтобы подготовить их к новому устройству и конституции."
 KOR_keep_ties_with_the_KMT:0 "Сохранить связи с Гоминьданом"
 KOR_keep_ties_with_the_KMT_desc:0 "Гоминьдан доказал, что способен служить оплотом стабильности в странах Азии. Предложение союза с ним поможет и дальше сохранять мир и стабильность на наших землях."
 KOR_experience_of_the_korean_liberation_army:0 "Опыт Корейской освободительной армии"
 KOR_experience_of_the_korean_liberation_army_desc:0 "Эти войска упорно сражались за нашу независимость. Их боевой опыт станет важным уроком при создании корейских вооружённых сил."
 KOR_apply_democratic_program:0 "Применить демократическую модель"
 KOR_apply_democratic_program_desc:0 "Сила Кореи исходит от её народа. Мы должны укреплять среди него демократические идеалы: личную свободу, индивидуальные права и право пользоваться плодами собственного труда."
 KOR_semi_isolation:0 "Частичная изоляция"
 KOR_semi_isolation_desc:0 "Прежние союзы и соглашения оказались губительными для Кореи. Теперь мы должны лишь защищать собственные земли и не вступать в далёкие войны, в которые нам незачем вмешиваться."
 KOR_search_allies:0 "Присоединиться к Союзникам"
 KOR_search_allies_desc:0 "Страны свободного мира выступают главными защитниками прав народа. Нам следует вступить с ними в союз, чтобы защищать индивидуальные права в регионе, где их часто подавляют ради могущества государства."
 KOR_defensive_preparation:0 "Оборонительные приготовления"
 KOR_defensive_preparation_desc:0 "Хотя мы и стремимся к миру, разумно укрепить оборону страны, чтобы любая попытка вторжения стала для врага тяжёлой задачей."
 KOR_peoples_committee_of_korea:0 "Народный комитет Кореи"
 KOR_peoples_committee_of_korea_desc:0 "Мы создадим временное правительство, которое будет управлять страной согласно принципам коммунизма. Корея вновь будет процветать!"
 KOR_conventional_warfare:0 "Обычная война"
 KOR_conventional_warfare_desc:0 "Ведение войны проверенными другими странами методами обеспечит нам успех на полях сражений."
 KOR_guerilla_experience:0 "Опыт партизанской войны"
 KOR_guerilla_experience_desc:0 "Наша страна не способна выдерживать такие войны, в которых более крупные державы могут преуспеть. Мы освоим новый способ ведения войны — силами нерегулярных формирований и с применением партизанской тактики."
 KOR_encourage_collectivism:0 "Поощрять коллективизм"
 KOR_encourage_collectivism_desc:0 "Каждый человек — лишь часть общества, и у каждого есть своя роль. Все они будут трудиться на общее благо."
 KOR_industrial_modernization_plan:0 "План промышленной модернизации"
 KOR_industrial_modernization_plan_desc:0 "Наша нынешняя промышленная база отстаёт от других стран. Нам необходимо привлечь специалистов и спланировать необходимые инвестиции, чтобы наверстать упущенное."
 KOR_complete_collectivization:0 "Завершить коллективизацию"
 KOR_complete_collectivization_desc:0 "Недавний экономический рост стал возможен благодаря успешной коллективизации. Мы должны продолжить этот многообещающий курс."
 KOR_prosperity_propaganda:0 "Пропаганда процветания"
 KOR_prosperity_propaganda_desc:0 "Теперь Корея богата ресурсами и обладает производительным и эффективным обществом. Мы объявим народу и всему миру об успехе корейского коллективизма."
 KOR_metallurgy:0 "Металлургия"
 KOR_metallurgy_desc:0 "Расширение нашей промышленности требует источника переработанного сырья. Мы построим необходимые предприятия, чтобы удовлетворить эти потребности."
 KOR_state_heavy_industry:0 "Государственная тяжёлая промышленность"
 KOR_state_heavy_industry_desc:0 "Чтобы стимулировать дальнейший рост, мы вложим средства в ключевые государственные предприятия, которые будут производить всё необходимое нашей промышленности."
 KOR_leader_technical_university:0 "Технический университет имени [KOR.GetLeader]"
 KOR_leader_technical_university_desc:0 "Наша развивающаяся промышленность требует квалифицированных рабочих и подготовленных кадров. Создание исследовательского института и университета одновременно поможет готовить будущую рабочую силу, а также разрабатывать и испытывать новые технологии."
 KOR_war_industry:0 "Военная промышленность"
 KOR_war_industry_desc:0 "Развитие военного производства поможет нам защитить нашу небольшую страну от тех, кто желает ей зла."
 KOR_sideline_cho_man_sik:0 "Отстранить политических противников"
 KOR_sideline_cho_man_sik_desc:0 "Некоторые люди в нашей коллективной гавани питают крамольные мысли и идеологии. Мы должны перевоспитать их в состоянии реальности здесь, в Корее."
 KOR_supreme_leader:0 "Верховный лидер"
 KOR_supreme_leader_desc:0 "В этой стране есть лишь один человек, который знает, что для неё лучше всего. Мы будем почитать его, записывать его изречения и навеки впишем его имя в летописи нашей страны."
 KOR_great_banner_of_songun:0 "Великое знамя сонгун"
 KOR_great_banner_of_songun_desc:0 "В Корее великий солдат. Номер один. Твёрдая рука. Однажды Верховному лидеру нужен новый друг. Я делаю операцию. Но ошибка! Друг умер! Верховный лидер счастлив! Теперь у меня дом, еда и красивая жена. "
 KOR_loyalty_to_moscow:0 "Верность Москве"
 KOR_loyalty_to_moscow_desc:0 "Только у родины коммунизма мы можем найти защиту в этом мире, переполненном капиталистами. Нам следует заключить союз с [SOV.GetName], чтобы гарантировать наш успех и процветание."
 KOR_adopt_maoism:0 "Принять маоизм"
 KOR_adopt_maoism_desc:0 "Наш ближайший коммунистический сосед, [PRC.GetName], исповедует особую форму коммунизма, которая лучше подходит Корее. Мы должны присоединиться к нему в славной борьбе за распространение коммунизма."
 KOR_join_the_asian_communist_solidarity:0 "Присоединиться к азиатской коммунистической солидарности"
 KOR_join_the_asian_communist_solidarity_desc:0 "Мы не можем доверять никому, кроме таких же коммунистических стран, как наша. Следует создать союз коммунистических государств Азии, чтобы защитить наше особое существование."
 KOR_army_reform:0 "Реформа армии"
 KOR_army_reform_desc:0 "Корейская армия находится в плачевном состоянии. Если мы хотим пережить будущие конфликты, необходимо начать модернизацию вооружённых сил."
 KOR_equipment_effort:0 "Модернизация оснащения"
 KOR_equipment_effort_desc:0 "Разработка нового пехотного оружия и тяжёлой артиллерии сделает наши войска грозным противником на поле боя. Мы сделаем это приоритетом."
 KOR_equipment_effort_2:0 "Продолжить реформу оснащения"
 KOR_equipment_effort_2_desc:0 "Ещё более совершенное оружие для войск. Корейская армия будет непобедима в каждом сражении."
 KOR_equipment_effort_3:0 "Модернизация артиллерии"
 KOR_equipment_effort_3_desc:0 "Мы оснастим войска самым современным пехотным вооружением. Только тогда наши враги дважды подумают, прежде чем начать наступление."
 KOR_special_forces:0 "Корейские силы специального назначения"
 KOR_special_forces_desc:0 "Они приближаются как призраки, бьют как гром и исчезают как дым."
 KOR_supervize_equipment_production:0 "Контролировать производство вооружения"
 KOR_supervize_equipment_production_desc:0 "Наш собственный военно-промышленный комплекс произведёт достаточно боеприпасов, чтобы стереть врагов в порошок."
 KOR_establish_a_military_academy:0 "Национальная военная академия"
 KOR_establish_a_military_academy_desc:0 "Армия будет укомплектована лучшими офицерами и генералами, способными планировать и возглавлять любые наступления."
 KOR_army_modernization:0 "Модернизация армии"
 KOR_army_modernization_desc:0 "Наши текущие планы модернизации корейской армии не должны останавливаться."
 KOR_motorization_effort:0 "Моторизация"
 KOR_motorization_effort_desc:0 "Оснащение пехоты моторизованным транспортом значительно повысит стратегическую мобильность наших войск и позволит силам быстрого реагирования оперативно перемещаться по городским районам."
 KOR_establish_a_armor_corp:0 "Создать бронетанковое подразделение"
 KOR_establish_a_armor_corp_desc:0 "Танки способны поддерживать пехоту при прорыве вражеских порядков. Мы создадим такое подразделение, чтобы усилить наши вооружённые силы."
 KOR_signal_companies:0 "Роты связи"
 KOR_signal_companies_desc:0 "Надёжная связь обязательна для любых боевых соединений. Создание рот связи значительно повысит способность наших войск быстро реагировать на изменения обстановки на поле боя."
 KOR_mechanization_effort:0 "Механизация армии"
 KOR_mechanization_effort_desc:0 "Бронетранспортёры способны защищать нашу пехоту при доставке на поле боя и сопровождать бронетанковые соединения. Нам следует развивать эту возможность, чтобы получить преимущество над врагами."
 KOR_field_hospitals:0 "Улучшенные полевые госпитали"
 KOR_field_hospitals_desc:0 "Наша небольшая страна не может позволить себе огромные потери в боях. Создание полевых госпиталей и включение их в состав армии позволит сократить число погибших."
 KOR_modern_logistics:0 "Современная логистика"
 KOR_modern_logistics_desc:0 "Жизнеспособность любой боевой силы зависит от её снабжения. Применение современных методов обеспечения войск повысит их устойчивость во время боевых операций."
 KOR_take_over_air_bases:0 "Захватить колониальные авиабазы"
 KOR_take_over_air_bases_desc:0 "Наши бывшие оккупанты оставили в Корее значительное количество авиабаз. Мы должны использовать их для развития собственных военно-воздушных сил."
 KOR_pyeongtaek_airplane_workshop:0 "Пхёнтхэкская авиационная мастерская"
 KOR_pyeongtaek_airplane_workshop_desc:0 "Для развития наших военно-воздушных сил необходимы специализированные мастерские, способные производить запасные части для самолётов, а также специалисты, обладающие соответствующими знаниями."
 KOR_fighter:0 "Разработать истребители"
 KOR_fighter_desc:0 "Разработка собственных лёгких истребителей для наших военно-воздушных сил должна вестись без промедления."
 KOR_bomber:0 "Бомбардировочные планеры"
 KOR_bomber_desc:0 "Самолёты, способные доставлять взрывные боеприпасы к целям противника, играют важнейшую роль в любых военно-воздушных силах. Мы разработаем универсальную модель, способную выполнять множество задач."
 KOR_naval_bomber:0 "Модели морских бомбардировщиков"
 KOR_naval_bomber_desc:0 "Наше побережье крайне уязвимо для вторжения. Воздушное прикрытие берегов сорвёт любые попытки высадки с моря."
 KOR_modernized_air_force:0 "Модернизированные военно-воздушные силы"
 KOR_modernized_air_force_desc:0 "Нам удалось создать значительные военно-воздушные силы, но работа ещё не завершена. Модернизация воздушной тактики и организации имеет ключевое значение для сохранения эффективности этих великолепных летающих машин."
 KOR_collaboration_with_overlord:0 "Сотрудничество с нашим сюзереном"
 KOR_collaboration_with_overlord_desc:0 "Похоже, мы вновь в той или иной степени оказались под пятой нового хозяина."
 KOR_collaboration_with_japan:0 "Сотрудничество с Японией"
 KOR_collaboration_with_japan_desc:0 "Несмотря на формальную независимость, в вопросах обороны мы по-прежнему во многом зависим от Японии. Как бы неприятно это ни было, нам необходимо военное сотрудничество с Японией, чтобы обезопасить нашу независимость."
 KOR_new_korean_army:0 "Новая корейская армия"
 KOR_new_korean_army_desc:0 "Нация — ничто без своей армии. Наши вооружённые силы малы, почти не испытаны в бою и неопытны. Для повышения их боеспособности необходимо сотрудничество с японскими военными."
 KOR_integrate_socialist_aligned_guerillas:0 "Интегрировать партизан-социалистов"
 KOR_integrate_socialist_aligned_guerillas_desc:0 "Некоторые из наших более неортодоксальных офицеров также придерживаются левых взглядов. Возможно, нам стоит постепенно внедрить их идеи в Корее?"
 KOR_amnesty_for_ex_japanese_army_officers:0 "Амнистировать бывших офицеров японской армии"
 KOR_amnesty_for_ex_japanese_army_officers_desc:0 "Некоторые из наших наиболее опытных офицеров ранее служили в японской армии. Их знания необходимы нам для создания сильных вооружённых сил."
 KOR_internationalism_focus:0 "Подъём коммунизма"
 KOR_internationalism_focus_desc:0 "Мы слишком долго терпели угнетение! Восстаньте, рабочие Кореи, и верните себе землю своих предков!"
 KOR_nationalism_focus:0 "Национализм"
 KOR_nationalism_focus_desc:0 "Корея — самостоятельная страна со своей богатой историей и самобытностью. Корейский народ вновь увидит возрождение нашей славной родины!"
 KOR_restore_imperial_power:0 "Восстановить императорскую власть"
 KOR_restore_imperial_power_desc:0 "Императорский престол — единственный путь к дальнейшему процветанию и существованию Кореи. Восстановление его власти необходимо сейчас как никогда."
 KOR_militarism:0 "Милитаризм"
 KOR_militarism_desc:0 "Наш народ должен быть готов отдать свои жизни ради того, чтобы Корея вновь процветала."
 KOR_devotion_to_the_emperor:0 "Преданность императору"
 KOR_devotion_to_the_emperor_desc:0 "Только благодаря верности нашему императору мы сможем достичь окончательной победы!"
 KOR_youth_units:0 "Радикализировать молодёжь"
 KOR_youth_units_desc:0 "Корейская молодёжь — чистейший источник людских ресурсов, который обеспечит возвышение великой Кореи!"
 KOR_invade_soviet_union:0 "Оспорить гегемонию [SOV.getAdjective]"
 KOR_invade_soviet_union_desc:0 "[SOV.getnameDefcap] десятилетиями оказывает давление на Азию — пора преподать им урок."
 KOR_invade_manchuria:0 "Вторгнуться в Маньчжурию"
 KOR_invade_manchuria_desc:0 "Маньчжурское правительство слишком долго угнетало корейцев, живущих к северу от Амнока. Смерть Цин!"
 KOR_cement_monarchic_rule:0 "Укрепить монархическую власть"
 KOR_cement_monarchic_rule_desc:0 "Править — право императора. Его верным подданным остаётся лишь повиноваться его небесным повелениям."
