 r56rp_babel_1.desc:0 "[This.GetName] Он был пойман при попытке проникнуть в нашу администрацию и утечка секретной информации обратно. [This.GetHerHis] начальство. На допросе, [This.GetSheHe] раскрываемый [This.GetHerselfHimself] быть иностранным активом для [From.GetAgency] оперировать [From.From.GetAdjective] Почва. До сих пор неизвестно, какова точная природа [From.GetAdjective] интерес к нашей стране, или какие части нашей администрации уже были выставлены на глаза. [From.GetAdjective] Интеллект. с [This.GetName] В ожидании дальнейшего допроса мы можем только надеяться, что в конечном итоге [This.GetSheHe] Он откроет все, что нужно знать. [From.GetAdjective] операций в [From.From.GetNameDef]."
