 PRU_american_reich:0 "Америндский рейх"
 PRU_american_reich_desc:0 "Объединим коренные народы Америки. Америндский рейх — коалиция доколумбовых государств — станет свидетельством стойкости и единства коренных народов. Сочетая древние традиции с современными методами ведения войны, эта новая сверхдержава готова изменить историю Западного полушария."
 PRU_recognize_german_power:0 "Признать могущество Германии"
 PRU_recognize_german_power_desc:0 "Мы должны вернуться на родину, признав промышленную и военную мощь Германии. Нашему славному лидеру предстоит решить, что будет лучше: подчиниться ей или объединить наши королевства с метрополией."
 PRU_recognize_german_power_2:0 "Признать могущество Германии"
 PRU_recognize_german_power_2_desc:0 "Мы должны вернуться на родину, признав промышленную и военную мощь Германии. Нашему славному лидеру предстоит решить, что будет лучше: подчиниться ей или объединить наши королевства с метрополией."
 PRU_A_new_war_machine:0 "Новая андская боевая машина"
 PRU_A_new_war_machine_desc:0 "Используя изобретательность народов Анд и наследие их предков, Империя инков создала боевую машину нового типа. Сочетание традиционных секретов металлургии с современными технологиями превратило её в грозную силу на поле боя."
 PRU_andean_machine:0 "Новая андская боевая машина"
 PRU_war_andean:0 "Открывает тяжёлый танк \"Пачакутек\""
