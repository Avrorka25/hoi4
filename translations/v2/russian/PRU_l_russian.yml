l_russian:
 r56_peru_focus:0 "Национальные фокусы Перу"
 indigenous_recruiter:0 "Вербовщик коренного населения"
 son_of_the_sun:0 "Сын Солнца"
 democratic_socialist:0 "Демократический социалист"
 PRU_llama_army_tech:0 "Армейские технологии с ламами"
 PRU_hugo_pesce:0 "Уго Песке"
 PRU_roberto_latorre_medina:0 "Роберто Латорре Медина"
 PRU_carlos_miro_quesasa_laos:0 "Карлос Миро-Кесада Лаос"
 PRU_javier_luis_calmell_del_solar:0 "Хавьер Луис Кальмель дель Солар"
 PRU_francisco_lanatta:0 "Франсиско Ланатта"
 PRU_hildebrando_castro_pozo:0 "Ильдебрандо Кастро Посо"
 PRU_jose_luis_bustamante_rivero:0 "Хосе Луис Бустаманте-и-Риверо"
 PRU_alberto_arca_parro:0 "Альберто Арка Парро"
 PRU_czech_equipment_aquisition:0 "Чешское снаряжение"
 PRU_czech_equipment_aquisition_desc:0 "После тяжёлого поражения в Тихоокеанской войне 1883 года армия [ROOT.getAdjective] некоторое время оставалась слабой, поскольку правительство не могло позволить себе столь крупные военные расходы. Теперь же, когда мы можем приобрести новое оружие, настало время реорганизовать наши силы и создать могучую армию."
 PRU_andean_warfare:0 "Включить рондерос в состав армии"
 PRU_andean_warfare_desc:0 "Рондерос являются неотъемлемой частью истории [ROOT.getAdjective]. Их присутствие на полях сражений всегда имело большое значение, как и в войне против Чили после падения Лимы. Мы должны призвать всех кечуа вступить в эти отряды рондерос."
 PRU_paratrooper_company:0 "Парашютная рота"
 PRU_paratrooper_company_desc:0 "Мы можем создать парашютный корпус для поддержки сухопутных войск, сформировав крупный воздушный флот."
 PRU_modernize_the_infantry_kit:0 "Модернизировать пехотное снаряжение"
 PRU_modernize_the_infantry_kit_desc:0 "Новые военные тактики, развивающиеся по всему миру, требуют обновить наши знания о ведении войны и приобрести современное снаряжение, оставив позади старый арсенал времён войны за Летисию."
 PRU_jungle_training:0 "Создать армию ашанинка"
 PRU_jungle_training_desc:0 "Долгое время народ ашанинка жил изолированно в перуанских джунглях, не имея отношения к делам центрального Перу. Каучуковые компании обнаружили этот коренной народ, положив начало одному из крупнейших известных геноцидов в Перу. Эти жители джунглей будут полезны в наших операциях. Сейчас они нужны нашей армии как никогда."
 PRU_motorization:0 "Моторизация"
 PRU_motorization_desc:0 "Долгое время военные грузы перевозились мулами и ламами через горы нашей суровой местности, но с появлением крупных шоссе, возможно, пришло время использовать грузовики для перевозки военного имущества."
 PRU_create_the_infantry_and_cavalry_schools:0 "Создать пехотную и кавалерийскую школы"
 PRU_create_the_infantry_and_cavalry_schools_desc:0 "Кавалерия — жизненно важная часть нашей армии. Из-за пересечённой местности у нас мало моторизованной техники; лошади и мулы всегда пользовались большим доверием перуанской армии, а специализация некоторых командиров в кавалерийской тактике приведёт нас к победе."
 PRU_cold_weather_equipment:0 "Снаряжение для холодной погоды"
 PRU_czech_tanks:0 "Приобрести чешские танки"
 PRU_czech_tanks_desc:0 "Новые танки значительно усилят ударную мощь нашей армии и помогут сокрушить любого, кто осмелится посягнуть на страну."
 PRU_study_the_blueprints:0 "Изучить чертежи"
 PRU_study_the_blueprints_desc:0 "Собственные разработки позволят нам создать и укрепить национальную промышленность."
 PRU_foreign_licenses:0 "Иностранные лицензии"
 PRU_foreign_licenses_desc:0 "Новые иностранные лицензии на вооружение позволят производить современное оружие для нашей армии внутри страны."
 PRU_italian_guns:0 "Итальянские орудия"
 PRU_italian_guns_desc:0 "После приобретения итальянских самолётов и прохождения военной подготовки настало время закупить современные итальянские пушки, чтобы продемонстрировать нашу мощь в Андах."
 PRU_invite_soviet_military_mission:0 "Пригласить советскую военную миссию"
 PRU_expand_the_national_arsenal:0 "Расширить национальный арсенал"
 PRU_expand_the_national_arsenal_desc:0 "Один из главных оружейных заводов Лимы устарел и не способен снабдить армию достаточным количеством оружия. Строительство новых военных заводов в провинциях удовлетворит эту потребность."
 PRU_new_weapons_new_tactics:0 "Новое оружие, новая тактика"
 PRU_new_weapons_new_tactics_desc:0 "Новое оружие поможет нам приспособиться к современным способам ведения войны."
 PRU_plan_limas_expansion:0 "Расширение плана Лимы"
 PRU_plan_limas_expansion_desc:0 "За пределами главного города Лимы есть гораздо больше места для достижения современных промышленных зон, таких как окраины Виллы Сальвадор и Сан-Хуан-де-Луриганчо."
 PRU_compania_minera_atacocha:0 "Горнодобывающая компания «Атакоча»"
 PRU_compania_minera_atacocha_desc:0 "На окраине Лимы, поднимаясь в горы, находится одно из крупнейших месторождений драгоценных металлов; Мы должны что-то с этим сделать."
 PRU_industrial_modernization:0 "Промышленная модернизация"
 PRU_industrial_modernization_desc:0 "Наша устаревшая и застойная промышленность должна быть модернизирована, но вопрос в том, будем ли мы делать это от рук иностранцев или попытаемся создать свою собственную промышленность."
 PRU_rely_on_international_trade:0 "Положиться на международную торговлю"
 PRU_rely_on_international_trade_desc:0 "Наша промышленность не может существовать без помощи развитых стран. Мы должны получать помощь от иностранного капитала."
 PRU_invite_foreign_experts:0 "Пригласить иностранных специалистов"
 PRU_invite_foreign_experts_desc:0 "Зарубежные эксперты будут знать, как вернуть нашу экономику в нужное русло, чтобы она снова стала одной из самых мощных в Южной Америке."
 PRU_railroad_investments:0 "Железнодорожные инвестиции"
 PRU_railroad_investments_desc:0 "Обследование новых маршрутов для улучшения национальной инфраструктуры находится в руках иностранных экспертов. В ближайшее время будет создана инфраструктура первого уровня."
 PRU_oil_industry_developments:0 "Развитие нефтяной промышленности"
 PRU_oil_industry_developments_desc:0 "Наши иностранные союзники должны добывать нефть из Ла-Бреа и Париньяс на севере страны."
 PRU_gold_and_silver_mining:0 "Золото и серебряная добыча"
 PRU_gold_and_silver_mining_desc:0 "Наиболее важные ресурсы, такие как золото и серебро в горах нашей страны, будут подпитывать нашу экономику."
 PRU_running_economy:0 "Денежная стабилизация"
 PRU_running_economy_desc:0 "Создание национального резервного банка поможет лучше управлять валютой."
 PRU_construction_industry:0 "Строительная промышленность"
 PRU_construction_industry_desc:0 "С новой помощью со стороны иностранцев, возможно, настало время начать строительные работы на благо всего мира. [ROOT.getAdjective] людей."
 PRU_implement_autarky:0 "Ввести автаркию"
 PRU_implement_autarky_desc:0 "Иностранцы не в состоянии взять под контроль нашу экономику. Было бы лучше, если бы мы развивали свою экономику так, чтобы не зависеть от иностранного капитала."
 PRU_give_rights_to_indigenous_people:0 "Предоставить права коренным народам"
 PRU_give_rights_to_indigenous_people_desc:0 "Жителей Анд всегда обращали почти как рабов, даже после освобождения Перу от испанского ига. Теперь, когда страна развивается, нам жизненно важно заручиться их поддержкой."
 PRU_seize_the_gold_mines:0 "Захват золотых рудников"
 PRU_seize_the_gold_mines_desc:0 "Золотые рудники Кахамарки стали реальностью. Они никогда раньше не эксплуатировались из-за отсутствия техники, но теперь с помощью необходимых технологий мы можем укрепить страну этими ресурсами."
 PRU_national_mining_administration:0 "Национальная горная администрация"
 PRU_national_mining_administration_desc:0 "Создание национальной компании, которая будет управлять добывающими ресурсами, обеспечит более эффективное использование этих ресурсов государством."
 PRU_finance_construction_programs:0 "Финансовые строительные программы"
 PRU_finance_construction_programs_desc:0 "Финансирование Больницы Работников и окрестных единиц социального интереса будет иметь большое значение для развития нашей страны."
 PRU_industrial_surquillo_sac:0 "Промышленный суркильо SAC"
 PRU_industrial_surquillo_sac_desc:0 "Настало время строить собственную военную промышленность."
 PRU_nationalize_the_railways:0 "национализировать железные дороги"
 PRU_nationalize_the_railways_desc:0 "Налоги, которые иностранные компании требуют за пользование их дорогами, являются вымогательскими. Настало время для того, чтобы все в Перу служило исключительно народу."
 PRU_national_research_grants:0 "Национальные исследовательские гранты"
 PRU_national_research_grants_desc:0 "Своими мыслями мы будем двигать нашу страну вперед."
 PRU_substitution_technologies:0 "Технологии замещения"
 PRU_substitution_technologies_desc:0 "Если мы не сможем получить технологии, которыми не владеем, то найдем для них запасные части."
 PRU_a_reborn_navy:0 "Возрождённый флот"
 PRU_a_reborn_navy_desc:0 "После Тихоокеанской войны 1880 года наш флот постоянно приходил в упадок, превратившись из одного из наиболее подготовленных в Южной Америке в один из самых слабых и устаревших. Теперь у нас есть шанс возродить его."
 PRU_expand_the_naval_factory_of_bellavista:0 "Расширить военно-морской завод в Бельявисте"
 PRU_expand_the_naval_factory_of_bellavista_desc:0 "Военно-морской завод Бельявисты всегда был главным кораблестроительным предприятием страны. Теперь, с возрождением флота, стоит расширить производство на север и юг страны."
 PRU_work_with_foreigners:0 "Сотрудничать с иностранцами"
 PRU_work_with_foreigners_desc:0 "Иностранцы знают о кораблях больше нас. Мы будем сотрудничать с ними ради развития флота."
 PRU_National_Admiralty_Corps:0 "Национальный адмиралтейский корпус"
 PRU_National_Admiralty_Corps_desc:0 "Если собрать лучшие умы Перу в области морской стратегии, мы сможем сформировать расширенный адмиралтейский совет для принятия решений в морских сражениях."
 PRU_naval_industry:0 "Военно-морская промышленность"
 PRU_naval_industry_desc:0 "Помимо расширения военно-морской промышленности, нам необходимо строить более крупные верфи для создания великого национального флота."
 PRU_modernize_destroyers:0 "Модернизировать эсминцы"
 PRU_modernize_destroyers_desc:0 "Даже наши новейшие эсминцы уже устарели, поэтому жизненно важно начать программу разработки новых моделей."
 PRU_Modernize_our_submarines:0 "Модернизировать подводные лодки"
 PRU_Modernize_our_submarines_desc:0 "Даже наши новейшие подводные лодки уже устарели, поэтому жизненно важно начать программу разработки новых моделей."
 PRU_the_grau_class_project:0 "Проект класса «Грау»"
 PRU_the_grau_class_project_desc:0 "Крейсеры класса «Грау» были крупнейшими и самыми современными кораблями перуанского флота со времён его падения в Тихоокеанской войне. Их боевая мощь была такова, что государство захотело использовать эти корабли как основу для массового строительства новых крейсеров класса «Грау»."
 PRU_expand_naval_production:0 "Расширить кораблестроение"
 PRU_expand_naval_production_desc:0 "Нам нужно больше верфей для расширения нашего великого флота."
 PRU_modernize_battleships:0 "Модернизировать линкоры"
 PRU_modernize_battleships_desc:0 "Пришло время начать проект линкора «Лима». Из-за внутренних экономических трудностей мы никогда не могли позволить себе подобный корабль, но теперь такая покупка стала возможной."
 PRU_modernize_carrier:0 "Модернизировать авианосцы"
 PRU_modernize_carrier_desc:0 "Пришло время начать проект авианосца «Республика Перу». Из-за внутренних экономических трудностей мы никогда не могли позволить себе такой корабль, но теперь его строительство стало возможным."
 PRU_naval_doctrine:0 "Военно-морская доктрина"
 PRU_naval_doctrine_desc:0 "Новые корабли — новые морские доктрины."
 PRU_fly_with_the_sun:0 "Герои Солнца"
 PRU_fly_with_the_sun_desc:0 "С момента создания перуанских ВВС в 1919 году в их ряды пришло немало талантливых пилотов, совершавших невероятные подвиги за штурвалом самолёта. Настало время этим лётчикам показать стране, кто владеет небом Южной Америки."
 PRU_start_aircraft_purchase:0 "Закупки самолётов"
 PRU_start_aircraft_purchase_desc:0 "Чтобы пополнить наши ВВС, необходимо решить, у какой иностранной державы мы будем закупать самолёты."
 PRU_acquire_italian_planes:0 "Приобрести итальянские самолёты"
 PRU_acquire_italian_planes-desc:0 "Итальянские самолёты прочны и тяжелы. Они идеально подходят нашим ВВС."
 PRU_acquire_usa_planes:0 "Приобрести самолёты [USA.GetAdjective]"
 PRU_acquire_usa_planes_desc:0 "Американские самолёты быстры и легки. Они идеально подходят нашим ВВС."
 PRU_strengthen_the_air_force:0 "Усилить военно-воздушные силы"
 PRU_strengthen_the_air_force_desc:0 "Наши ВВС дезорганизованы, а аэродромы запущены. Если исправить эти недостатки, наша авиация станет самой мощной в регионе."
 PRU_work_with_our_designs:0 "Создать «Факторияс Фосетт»"
 PRU_work_with_our_designs_desc:0 "Наши собственные конструкции самолётов окажутся лучше иностранных образцов. Крайне важно совершенствовать уже имеющиеся разработки."
 PRU_work_on_heavy_aircraft:0 "Работать над тяжёлыми самолётами"
 PRU_work_on_heavy_aircraft_desc:0 "Развивая тяжёлую авиацию, мы сможем наносить мощные удары по противнику прежде, чем он нас заметит."
 PRU_work_on_light_aircraft:0 "Работать над лёгкими самолётами"
 PRU_work_on_light_aircraft_desc:0 "Развивая лёгкую авиацию, мы сможем быстро находить и уничтожать противника прежде, чем он нас заметит."
 PRU_air_innovations:0 "Авиационные инновации"
 PRU_air_innovations_desc:0 "Новые самолёты — новая тактика."
 PRU_total_production:0 "Всеобщее производство"
 PRU_total_production_desc:0 "Мы должны многократно увеличить производство истребителей и штурмовиков, чтобы создать огромную воздушную силу. Только так мы добьёмся полного превосходства в воздухе."
 PRU_heroes_of_the_air:0 "Герои неба"
 PRU_heroes_of_the_air_desc:0 "Новые рыцари воздуха — счастливцы, которым выпала честь сражаться за свою страну в стальных доспехах."
 PRU_build_the_petrolero_railway:0 "Строительство железной дороги Petrolero"
 PRU_build_the_petrolero_railway_desc:0 "Американским нефтяным компаниям требуется железнодорожная линия из Лимы к северу от Трухильо для транспортировки нефти в порт Кальяо. Это был бы интересный проект, поскольку он может быть использован государством в гражданских и военных целях."
 PRU_build_the_andes_railway:0 "Постройте железную дорогу Анд"
 PRU_build_the_andes_railway_desc:0 "Трансандийской железнодорожной линии удается переместить миллионы людей из города Куско-Хуанчай-Лима, где сосредоточено почти 60% перуанского населения."
 PRU_organize_future_elections:0 "Организовать будущие выборы"
 PRU_organize_future_elections_desc:0 "После короткого периода правления Бенавидеса, в соответствии с конституцией, он должен объявить всеобщие выборы в Перу, хотя в его планы входит остаться у власти ещё некоторое время."
 PRU_mediate_between_the_parties:0 "Посредничать между партиями"
 PRU_mediate_between_the_parties_desc:0 "Призвать партии подготовиться к всеобщим выборам."
 PRU_british_airports:0 "Британские аэродромы"
 PRU_british_airports_desc:0 "С помощью британцев мы сможем привести в порядок запущенные национальные аэродромы."
 PRU_mobilize_womans:0 "Мобилизация женщин"
 PRU_mobilize_womans_desc:0 "Женщины нашей страны всегда были отстранены от политической системы, но теперь они будут допущены к политической, военной и гражданской деятельности."
 PRU_leacy_of_Benavides:0 "Наследие Бенавидеса"
 PRU_leacy_of_Benavides_desc:0 "Мы должны продолжить дело Бенавидеса, бывшего цивилистского правителя, сохранив созданные им институты и проекты."
 PRU_Military_Universities:0 "Военные университеты"
 PRU_Military_Universities_desc:0 "Расширение системы образования в Перу способствовало созданию новых гражданских и военных учреждений. Среди прочего возникла идея основать военный университет."
 PRU_give_asylum_to_the_jews:0 "Предоставить убежище евреям"
 PRU_give_asylum_to_the_jews_desc:0 "Многие еврейские интеллектуалы бегут из Европы из-за проводимой там политики. Лучше всего открыть нашу страну для еврейских беженцев и тем самым поддержать научные исследования."
 PRU_reforma_agraria:0 "Аграрная реформа"
 PRU_reforma_agraria_desc:0 "Земля принадлежит тому, кто её обрабатывает."
 PRU_consolidate_borders:0 "Новая перуанская идентичность"
 PRU_consolidate_borders_desc:0 "С помощью культурной и образовательной политики мы постараемся сформировать прочную национальную идентичность, преодолевающую региональные различия. Мы будем воспитывать в гражданах патриотическую гордость и верность нации. Это важнейший шаг к созданию сплочённого и стойкого общества."
 PRU_nationalize_banking_sector:0 "Национализировать банковский сектор"
 PRU_nationalize_banking_sector_desc:0 "Долгое время наши банки находились в руках иностранцев, служивших лишь собственным интересам. Теперь банковская система должна служить исключительно государству."
 PRU_empower_benavides:0 "Укрепить власть Бенавидеса"
 PRU_empower_benavides_desc:0 "Выборы следует отменить ради единого правительства во главе с Бенавидесом."
 PRU_legacy_of_sachez_cerro:0 "Наследие Санчеса Серро"
 PRU_legacy_of_sachez_cerro_desc:0 "Санчес Серро был освободителем, который положил конец непатриотичной Легии и его правительству 11 лет. Во время его правления будут приняты законы о социальном интересе и защите коренных народов. Из-за своего скромного происхождения и расы Чола он считается представителем перуанской породы."
 PRU_conservative_coalition:0 "Консервативная коалиция"
 PRU_conservative_coalition_desc:0 "После распада Гражданской партии вследствие краха 1929 года землевладельцы и гамоналес утратили политическое влияние. Правые раскололись на множество независимых организаций, которые в 1930 году объединились и создали Консервативную коалицию — союз правых консервативных партий Перу. Её лидером стал Мануэль Прадо Угартече."
 PRU_social_democratic_coalition:0 "Социал-демократическая коалиция"
 PRU_social_democratic_coalition_desc:0 "Перу нужна центристская партия с полноценной программой. Социал-демократическая партия не является закрытой кастой. Реестр Патриотического союза не содержит ненавистнических ограничений и враждебных предубеждений. Её знамя — знамя Перу. Родина является символом единства, которое тем крепче, чем сильнее взаимная солидарность и экономическое сотрудничество соотечественников."
 PRU_alerta_en_la_frontera:0 "Тревога на границе"
 PRU_alerta_en_la_frontera_desc:0 "Проблема спорных территорий с Эквадором крайне серьёзна. Ещё во времена испанского владычества граница между вице-королевствами Перу и Новая Гранада оставалась неясной. После обретения независимости отношения между Республикой Перу и Великой Колумбией не улучшились. За долгие годы чёткая граница так и не была установлена. Мы считаем, что лучшим решением станет провести её войной, хотя можно прибегнуть и к более мирным средствам."
 PRU_protest_against_the_cancellation:0 "Протест против отмены выборов"
 PRU_protest_against_the_cancellation_desc:0 "Бенавидес — диктатор, отменивший выборы, и он заслуживает кары Божьей и народной."
 PRU_prolong_benavides_presidency:0 "Продлить президентство Бенавидеса"
 PRU_prolong_benavides_presidency_desc:0 "При правительстве Бенавидеса наша страна значительно преуспела. Ему следует остаться у власти ещё на несколько лет."
 PRU_peruvian_blackshirts:0 "Перуанские чернорубашечники"
 PRU_peruvian_blackshirts_desc:0 "Перуанские чернорубашечники под командованием Луиса Альберто Флореса приведут нас к победе."
 PRU_give_power_to_general_ureta:0 "Передать власть генералу Урете"
 PRU_give_power_to_general_ureta_desc:0 "Генерал Урета, убеждённый уррист и националист, сыт по горло экстремистской политикой Альберто Флореса. Он намерен совершить переворот внутри партии и возглавить Революционный союз."
 PRU_integrate_the_church:0 "Интегрировать церковь"
 PRU_integrate_the_church_desc:0 "Католическая церковь играет жизненно важную роль в жизни всего перуанского населения."
 PRU_workers_protection:0 "Права рабочих"
 PRU_workers_protection_desc:0 "Рабочие нашей страны требуют трудовых реформ, чтобы повысить эффективность труда на заводах."
 PRU_remember_the_Trujillo_revolution:0 "Помнить о революции в Трухильо"
 PRU_remember_the_Trujillo_revolution_desc:0 "В 1932 году, при правительстве Санчеса Серро, в городе Трухильо произошло крупное восстание боевиков партии АПРА. Они полностью захватили город и угрожали двинуться маршем на Лиму, чтобы взять власть. Ответ правительства был суровым: революцию подавили авиационными бомбардировками и артиллерией, но память о ней жива среди апристов."
 PRU_benavides_nightmare:0 "Начало революции"
 PRU_benavides_nightmare_desc:0 "Коммунисты массово восстали из-за отмены выборов. Это конец эпохи Бенавидеса и личных свобод в Перу."
 PRU_select_a_successor_for_benavides:0 "Выбрать преемника Бенавидеса"
 PRU_select_a_successor_for_benavides_desc:0 "Бенавидес слишком стар и слаб, чтобы продолжать правление. Лучше как можно скорее избрать ему преемника."
 PRU_hispanism:0 "Испанизм"
 PRU_hispanism_desc:0 "Испанизм хранит память о прежнем единстве американских вице-королевств, вместе составлявших могучую империю. Эта память является частью национальной идентичности Перу."
 PRU_tax_reform:0 "Налоговая реформа"
 PRU_tax_reform_desc:0 "Нынешняя налоговая система благоприятствует тем, кто богаче среднего гражданина. Пора реформировать эту нелепую систему и сделать её справедливее для всех."
 PRU_revolutionary_goverment:0 "Революция в Такне"
 PRU_revolutionary_goverment_desc:0 "Хотя Рикардо Перес Годой не был урристом, его националистические взгляды соединились с социальными идеями ради спасения Перу от возможной коммунистической революции, поскольку правительство почти ничего не делало для остановки наступления коммунизма."
 PRU_left_and_right_united:0 "Левые и правые едины"
 PRU_left_and_right_united_desc:0 "Чтобы получить больше власти, мы должны объединить социалистов, умеренных и консерваторов. Вместе мы построим лучшее Перу."
 PRU_help_our_brothers:0 "Помочь нашим братьям"
 PRU_help_our_brothers_desc:0 "[ROOT.GetLeader] рассматривает возможность отправить добровольцев для поддержки социалистического дела испанского народа."
 PRU_the_teachings_the_amauta:0 "Учение Амауты"
 PRU_the_teachings_the_amauta_desc:0 "Хосе Карлос Мариатеги, известный как «Амаута», был главным социалистическим идеологом Перу. [ROOT.GetLeader] глубоко восхищался им и стремился продолжить его наследие посредством коммунистической политики в государстве [ROOT.GetNameDefCap]."
 PRU_commit_to_democratic_election:0 "Обязаться провести демократические выборы"
 PRU_commit_to_democratic_election_desc:0 "Недавняя отмена выборов Бенавидесом вызвала сильное народное возмущение, которое вынудит диктатора пообещать восстановление демократии в будущем."
 PRU_select_montagne_as_successor:0 "Выбрать Монтаня преемником"
 PRU_select_montagne_as_successor_desc:0 "Эрнесто Монтань Маркхольц — убеждённый уррист. Он вступил в партию Революционный союз, когда её создал Санчес Серро, и разделял её националистические основы. Когда партия перешла под контроль Луиса Альберто Флореса и стала походить на итальянский фашизм, Эрнесто Монтань покинул её и оставался независимым, пока Бенавидес не призвал его стать преемником и продолжить реформы в государстве [ROOT.GetNameDefCap]."
 PRU_unite_the_andes:0 "Объединить Анды"
 PRU_unite_the_andes_desc:0 "Предательство, совершённое государством [BOL.GetNameDefCap] против государства [ROOT.GetNameDefCap], нельзя забыть. Мы должны самостоятельно объединить все народы кечуа под руководством [ROOT.GetLeader]."
 PRU_alliance_with_bolivia:0 "Союз с Боливией"
 PRU_alliance_with_bolivia_desc:0 "[ROOT.GetNameDefCap] и [BOL.GetNameDefCap] объединяет общее прошлое — наследие инков и эпоха вице-королевства. Пора оставить разногласия позади и добиться единства братских народов."
 andean_pact:0 "Андский пакт"
 PRU_place_odria_as_adviser:0 "Назначить Одрию советником"
 PRU_place_odria_as_adviser_desc:0 "Вместо правительства Мануэля Одрии более осуществимым вариантом было бы назначить его политическим советником [ROOT.GetLeader], чтобы он помог реформировать Перу и вывести страну на путь развития."
 PRU_spanish_civil_war_involvement:0 "Участие в гражданской войне в Испании"
 PRU_spanish_civil_war_involvement_desc:0 "[ROOT.GetLeader] рассматривает возможность отправки добровольцев для поддержки националистического дела испанского народа."
 PRU_strengthen_the_national_industry:0 "Укрепить национальную промышленность"
 PRU_strengthen_the_national_industry_desc:0 "[ROOT.GetLeader] ищет новый отечественный и иностранный капитал для укрепления нашей промышленности."
 PRU_nationalize_the_banking_sector:0 "Национализировать банковский сектор"
 PRU_nationalize_the_banking_sector_desc:0 "[ROOT.GetLeader] распорядился немедленно национализировать банковский сектор в интересах народа."
 PRU_increase_social_spending:0 "Увеличить социальные расходы"
 PRU_increase_social_spending_desc:0 "Народ требует увеличить социальные расходы. Мы исполним его волю, чтобы заслужить доверие."
 PRU_exile_luis_alberto_flores:0 "Выслать Луиса Альберто Флореса"
 PRU_exile_luis_alberto_flores_desc:0 "Одним из крупнейших политических агитаторов Перу является Луис Альберто Флорес. Нам следует выслать его в Чили."
 PRU_reform_the_constitution:0 "Переписать конституцию"
 PRU_reform_the_constitution_desc:0 "Последняя конституция, написанная бывшим диктатором Луисом Мигелем Санчесом Серро, больше не соответствует нынешнему правительству. [ROOT.GetLeader] считает, что её следует реформировать, чтобы открыть путь к созданию нового Перу."
 PRU_legacy_of_pachacutec:0 "Наследие Пачакутека"
 PRU_legacy_of_pachacutec_desc:0 "Пачакутек — «тот, кто меняет землю». Пора преобразить нашу страну и сделать её современнее."
 PRU_hasta_quemar_el_ultimo_cartucho:0 "Пока не сгорит последний патрон"
 PRU_hasta_quemar_el_ultimo_cartucho_desc:0 "Hasta quemar el último cartucho — пока не сгорит последний патрон. Мы никогда не сдадимся так легко."
 PRU_celebration_of_the_andean_past:0 "Прославление андского прошлого"
 PRU_celebration_of_the_andean_past_desc:0 "Общее прошлое, общее наследие, общая история."
 PRU_industrial_cooperation:0 "Промышленное сотрудничество"
 PRU_industrial_cooperation_desc:0 "Сотрудничество с нашими боливийскими братьями станет важнейшим условием быстрой индустриализации обеих стран."
 PRU_regain_the_new_spain_heritage:0 "Вернуть наследие Новой Испании"
 PRU_regain_the_new_spain_heritage_desc:0 " "
 PRU_secure_the_central_america:0 "Обезопасить Центральную Америку"
 PRU_secure_the_central_america_desc:0 " "
 PRU_alliance_with_mexico:0 "Союз с Мексикой"
 PRU_alliance_with_spain:0 "Союз с Испанией"
 PRU_Support_the_banana_industry:0 "Поддержать банановую промышленность"
 PRU_Support_the_banana_industry_desc:0 ""
 PRU_alliance_mexico_desc:0 "[ROOT.GetLeader] и [MEX.GetLeader] связывает не только общее испанское прошлое. Куда важнее их идеологическая близость."
 PRU_alliance_with_mexico_desc:0 "[ROOT.GetLeader] и [MEX.GetLeader] связывает не только общее испанское прошлое. Куда важнее их идеологическая близость."
 PRU_expand_the_volunteer_program:0 "Расширить добровольческую программу"
 PRU_expand_the_volunteer_program_desc:0 "Армии требуется больше людских ресурсов. Расширение закона о добровольной службе позволит нам создать более сильную армию."
 PRU_national_investigation:0 "Национальное исследовательское агентство"
 PRU_national_investigation_desc:0 "Создание агентства, специализирующегося на поиске новых ресурсов в наших землях и укреплении исследовательской деятельности страны, стало бы огромным шагом вперёд."
 PRU_expand_the_military_industry:0 "Расширить военную промышленность"
 PRU_expand_the_military_industry_desc:0 "[ROOT.GetLeader] ищет новый отечественный и иностранный капитал для укрепления нашей промышленности."
 PRU_expand_the_agricultural_sector:0 "Расширить сельскохозяйственный сектор"
 PRU_expand_the_agricultural_sector_desc:0 "Наши земли плодородны и подходят для выращивания самых разных культур. Используем их, чтобы прокормить население и перестать зависеть от иностранного импорта."
 PRU_crusade_against_radicalism_in_america:0 "Крестовый поход против радикализма"
 PRU_crusade_against_radicalism_in_america_desc:0 "Фашизм и коммунизм стремительно распространяются по Южной Америке. Наш священный долг — очистить регион от этих пагубных идеологий."
 PRU_integrate_the_indigenous:0 "Интегрировать народ кечуа"
 PRU_integrate_the_indigenous_desc:0 "В прошлом коренные кечуа были лишены прав и обращены в простых слуг олигархов страны. Пора привлечь народ кечуа к промышленному развитию государства, ведь он способен значительно укрепить политическое движение."
 PRU_Legion_Peruana:0 "Перуанский легион"
 PRU_Legion_Peruana_desc:0 "Перуанский легион был элитным формированием молодой республики, сражавшимся в самых жестоких войнах. В нынешние времена [ROOT.GetLeader] вновь нуждается в новом Перуанском легионе."
 PRU_inca_industry:0 "Создать Капак-Ньян"
 PRU_inca_industry_desc:0 "Капак-Ньян, или «великая дорога» на языке кечуа, — древняя система путей инков, соединявшая всю империю с севера на юг и с востока на запад. Пора вернуться к старой дорожной сети и модернизировать её."
 PRU_research_cooperation:0 "Научное сотрудничество"
 PRU_research_cooperation_desc:0 "Сотрудничество с Боливией в области исследований принесёт превосходные результаты обеим братским странам."
 PRU_neo_incaic_unification:0 "Неоинкское объединение"
 PRU_neo_incaic_unification_desc:0 "Неоинкский союз между [ROOT.GetNameDefCap] и [BOL.GetNameDefCap] мобилизует миллионы кечуа, живущих в этих двух странах."
 PRU_prepare_for_another_pacific_war:0 "Подготовиться к новой Тихоокеанской войне"
 PRU_prepare_for_another_pacific_war_desc:0 "Нацистам требуется время, чтобы прийти к власти в Чили. Возможно, перуанское оружие поможет посадить там фашиста."
 PRU_integrate_women:0 "Женщины на производстве"
 PRU_integrate_women_desc:0 "Женщины — движущая сила нашей страны. Мы должны привлечь их к работе на фабриках, чтобы увеличить численность рабочей силы."
 PRU_food_importation:0 "Импорт продовольствия"
 PRU_food_importation_desc:0 "Если из-за суровой географии страна не способна производить достаточно продовольствия, лучшим решением станет его закупка за рубежом."
 PRU_arm_the_people:0 "Вооружить народ"
 PRU_arm_the_people_desc:0 "Единый [ROOT.getAdjective] народ непобедим. Его сила сожмётся в могучий кулак, которого устрашатся империалистические орды."
 PRU_promote_the_military_industry:0 "Развивать военную промышленность"
 PRU_promote_the_military_industry_desc:0 "[ROOT.GetLeader] ищет новый отечественный и иностранный капитал для укрепления нашей промышленности."
 PRU_promote_the_national_industry:0 "Развивать национальную промышленность"
 PRU_promote_the_national_industry_desc:0 "[ROOT.GetLeader] ищет новый отечественный и иностранный капитал для укрепления нашей промышленности."
 PRU_a_new_peru:0 "Новый Перу"
 PRU_a_new_peru_desc:0 "Новый Перу знаменует начало новой политической эпохи, оставляющей в прошлом каудильо и революционеров."
 PRU_the_only_sun:0 "Единственное солнце"
 PRU_the_only_sun_desc:0 "Солнце лишь одно — то самое, что сияет и всегда будет сиять для инков: бог солнца Инти."
 PRU_looking_north:0 "Взгляд на север"
 PRU_looking_north_desc:0 "[ROOT.GetLeader] не одобряет политику [COL.GetLeader] в отношении Амазонской трапеции и города Летисия, где по-прежнему живут граждане Перу. Пора вернуть Летисию силой."
 PRU_join_allies:0 "Присоединиться к Союзникам"
 PRU_join_allies_desc:0 "Наши торговые союзники призывают нас покончить с фашизмом в Европе."
 PRU_create_the_Lima_group:0 "Создать Лимскую группу"
 PRU_create_the_Lima_group_desc:0 "Лимская группа должна сохранить нейтралитет перед лицом бедствий, охвативших Европу. Наш континент должен остаться в стороне от войны."
 lima_group:0 "Лимская группа"
 PRU_follow_in_the_footsteps_of_tupac_amaru:0 "По стопам Тупака Амару II"
 PRU_follow_in_the_footsteps_of_tupac_amaru_desc:0 "Наследие индейского революционера Тупака Амару II по-прежнему живёт в сердцах и памяти многих кечуа, чьи предки восстали против испанского господства над бывшей империей инков. Сегодня революция призывает его имя, чтобы объединить народы: «И они не смогут его убить!»"
 PRU_benavides_is_dead:0 "Бенавидес мёртв"
 PRU_benavides_is_dead_desc:0 "Наш каудильо, умиротворивший страну после смерти Санчеса Серро, тяжело заболел. Неужели он может умереть?"
 PRU_wake_up_a_giant:0 "Пробудить гиганта"
 PRU_wake_up_a_giant_desc:0 "Страна, породившая одну из величайших культур доколониальной Южной Америки и одно из могущественнейших вице-королевств континента, затем более ста лет почивала на лаврах из-за нестабильной республики. Пора ей пробудиться."
 PRU_riva_agueros_dream:0 "Мечта Ривы Агуэро"
 PRU_riva_agueros_dream_desc:0 "Создание единой и умиротворённой родины после долгих лет восстаний и переворотов — мечта католического националиста Хосе де ла Ривы Агуэро-и-Осмы, которая наконец сбывается благодаря [ROOT.GetLeader]."
 PRU_hit_bolivia:0 "Покончить с боливийцами"
 PRU_hit_bolivia_desc:0 "Мнения [ROOT.getAdjective] политиков о [BOL.getAdjective] народе весьма различны. Когда-то он был союзником [ROOT.GetNameDefCap] в рамках проекта преобразования страны под названием «Перу-Боливия», пользовавшегося большой поддержкой. Однако во время Тихоокеанской войны [BOL.getAdjective] армия предала [ROOT.GetNameDefCap], оставив её сражаться без поддержки."
 PRU_ask_for_enter_to_comintern:0 "Запросить членство в Коминтерне"
 PRU_ask_for_enter_to_comintern_desc:0 "После долгих дебатов члены [ROOT.GetCommunistParty] решили, что [ROOT.GetLeader] должен попросить о вступлении в Коминтерн, поскольку [SOV.GetNameDefCap] поможет нам развить страну и распространить революцию по всей Южной Америке."
 PRU_new_road_conscription_law:0 "Новый закон о дорожной повинности"
 PRU_new_road_conscription_law_desc:0 "Возрождая старый закон о дорожной повинности, наше правительство предлагает его обновлённую версию с улучшенными льготами для рабочих. Эта инициатива не только улучшит дорожную инфраструктуру, но и создаст рабочие места, способствуя развитию наших дорог и путей."
 PRU_protect_democratic_institutions:0 "Защитить демократические институты"
 PRU_protect_democratic_institutions_desc:0 "В этот решающий для нашей демократии период под руководством [ROOT.GetLeader] мы обязуемся защищать прозрачность, подотчётность и участие граждан."
 PRU_workers_rights_act:0 "Закон о правах рабочих"
 PRU_workers_rights_act_desc:0 "Подтверждая приверженность благополучию трудящихся, [ROOT.GetLeader] представляет закон о трудовых правах. Он укрепит положение рабочих, обеспечив справедливые условия труда, разумную продолжительность рабочего дня и защиту основных прав."
 PRU_god_country_and_family:0 "Бог, Родина и семья"
 PRU_god_country_and_family_desc:0 "Для укрепления консервативных ценностей предлагается инициатива «Бог, Родина и семья». Под руководством консервативного правительства мы обязуемся усиливать влияние веры, сохранять патриотические принципы и защищать семейные устои, на которых держится наше общество."
 PRU_state_serves_the_people:0 "Государство служит народу"
 PRU_state_serves_the_people_desc:0 "Мы обязуемся ставить потребности народа превыше всего. Эта инициатива усилит участие государства в таких важнейших областях, как образование, здравоохранение и социальное благополучие, обеспечивая доступность плодов прогресса для всех. Вместе мы идём к Перу, где государство неустанно служит каждому гражданину и повышает качество его жизни."
 PRU_Eradicate_the_traitors:0 "Искоренить предателей"
 PRU_Eradicate_the_traitors_desc:0 "Альберто Флорес решил принять суровые меры ради чистоты и величия нашей нации. Будет проведена масштабная чистка, чтобы устранить апристов и их союзников, угрожающих стабильности и национальной идентичности. Хотя это неизбежно приведёт к человеческим жертвам, Флорес считает такую меру необходимой для сохранения славы нашего любимого Перу."
 PRU_The_People_General:0 "Народный генерал"
 PRU_The_People_General_desc:0 "Под харизматичным руководством Элоя Уреты перуанский национализм принимает новое направление. Стремясь защитить народ и оставить годы угнетения в прошлом, Урета намерен построить более справедливую и единую страну. Этот более человечный подход поможет залечить старые раны."
 PRU_Return_to_Negotiate_with_Caproni:0 "Возобновить переговоры с «Капрони»"
 PRU_Return_to_Negotiate_with_Caproni_desc:0 "Осознавая важность прочных торговых связей, правительство Перу решило вернуться за стол переговоров с компанией «Капрони». Мы намерены пересмотреть и улучшить условия первоначального соглашения 1934 года, обеспечив взаимовыгодное и справедливое сотрудничество, способствующее развитию страны."
 PRU_adean_commissars:0 "Андские комиссары"
 PRU_adean_commissars_desc:0 "Новые андские комиссары будут обеспечивать исполнение народных законов даже в самых отдалённых от крупных городов поселениях."
 PRU_the_great_peruvian_red_army:0 "Великая перуанская Красная армия"
 PRU_the_great_peruvian_red_army_desc:0 "Великая Красная армия Перу, состоящая из рабочих и крестьян, освободит Южную Америку от господствующих эксплуататоров. Единый народ никогда не будет побеждён."
 PRU_acquire_soviet_tanks:0 "Приобрести советские танки"
 PRU_acquire_soviet_tanks_desc:0 "Нашу военную мощь укрепит зарождающаяся [SOV.getAdjective] военная промышленность. Мы станем великим кулаком социальной справедливости в Южной Америке и утвердим её закон своей военной силой."
 PRU_acquire_soviet_plane_factories:0 "Приобрести советские авиационные заводы"
 PRU_acquire_soviet_plane_factories_desc:0 "[SOV.getAdjective] самолёты прочны и тяжелы. Они идеально подходят для наших военно-воздушных сил."
 PRU_national_literacy_programs:0 "Национальные программы ликвидации неграмотности"
 PRU_national_literacy_programs_desc:0 "Открытие новых государственных университетов в Лиме и других городах страны даст большему числу людей доступ к бесплатному высшему образованию и подготовит квалифицированные кадры для будущего Перу."
 PRU_end_capitalism:0 "Покончить с капитализмом"
 PRU_end_capitalism_desc:0 "Американская империя стремится распространить своё влияние на нашу страну и свергнуть правительство [ROOT.GetLeader]. Пора объединить весь [ROOT.getAdjective] народ в могучий кулак, который сокрушит великого гиганта Америки во имя свободы всех [ROOT.getAdjective] людей."
 PRU_unite_the_ecuadorian_proletariat:0 "Объединить эквадорский пролетариат"
 PRU_unite_the_ecuadorian_proletariat_desc:0 "Рабочие кофейных плантаций Эквадора объявили забастовку после долгих лет невообразимых злоупотреблений, а диктатор [ECU.GetLeader] решил обратить оружие против собственного народа. Интервенция в Эквадор обеспечит торжество народной воли."
 PRU_drive_out_the_banana_companies:0 "Изгнать банановые компании"
 PRU_drive_out_the_banana_companies_desc:0 "После так называемой Банановой бойни 1928 года [COL.getAdjective] народ затаил глубокую ненависть к компании United Fruit, которая продолжает действовать в стране. [COL.getAdjective] народ поддержит вмешательство апристской освободительной армии, чтобы изгнать этих капиталистов."
 PRU_union_with_the_pcv:0 "Союз с КПВ"
 PRU_union_with_the_pcv_desc:0 "Наших братьев в Венесуэле угнетает диктатор [VEN.GetLeader]. Его режим террора уже унёс жизни многих [VEN.getAdjective] граждан, а тысячи продолжают страдать. Пора положить конец его правлению."
 PRU_collective_agriculture:0 "Коллективное сельское хозяйство"
 PRU_collective_agriculture_desc:0 "После того как крестьяне взяли под контроль сахарные плантации, они разработали более эффективные методы производства. Это позволило развить сахарную промышленность и отправлять излишки нашим зарубежным партнёрам."
 PRU_aprista_guerrilla:0 "Апристские партизаны"
 PRU_aprista_guerrilla_desc:0 "Организованные АПРА партизаны могут оказать огромную помощь во время войны, используя опыт трухильских повстанцев времён диктатуры Санчеса Серро."
 PRU_rallying_the_peasants:0 "Мобилизовать крестьян"
 PRU_rallying_the_peasants_desc:0 "Для индустриализации необходимо направить крестьян на фабрики, чтобы втрое повысить их эффективность. Некоторые из них не умеют читать и писать, но со временем приспособятся к новому образу жизни."
 PRU_public_universities:0 "Государственные университеты"
 PRU_public_universities_desc:0 "Открытие новых государственных университетов в Лиме и других городах страны даст большему числу людей доступ к бесплатному высшему образованию и подготовит квалифицированные кадры для будущего Перу."
 PRU_Nationalize_the_brea_y_parinas:0 "Национализировать Ла-Бреа-и-Париньяс"
 PRU_Nationalize_the_brea_y_parinas_desc:0 "Нефтяной вопрос и месторождения Ла-Бреа-и-Париньяс остаются проблемой Перу с 1914 года, когда прежние правительства заключили крайне невыгодный для нас договор. Недавно выяснилось, что американская компания, эксплуатирующая нефть, не выплачивает положенную сумму. Национализация нефтяных комплексов и изгнание североамериканских владельцев решат эту проблему."
 PRU_Sovereign_Industrial_Expansion:0 "Суверенное промышленное расширение"
 PRU_Sovereign_Industrial_Expansion_desc:0 "Под знаменем национального суверенитета наш лидер начал масштабную программу развития отечественной промышленности. Поощряя индустриализацию, мы стремимся создать будущее, в котором каждая машина и каждая фабрика свидетельствуют о нашей независимости и решимости."
 PRU_standard_oil_refinery_initiative:0 "Инициатива нефтепереработки «Стандард Ойл»"
 PRU_standard_oil_refinery_initiative_desc:0 "Эта инициатива предусматривает строительство нефтеперерабатывающих заводов с применением передовых технологий для максимальной эффективности и диверсификации нефтяного производства. Опираясь на опыт «Стандард Ойл», мы стремимся не только укрепить нефтяную инфраструктуру, но и превратить Перу в одного из ключевых игроков мировой энергетики."
 PRU_oil_infrastructure_expansion:0 "Расширение инфраструктуры"
 PRU_oil_infrastructure_expansion_desc:0 "Благодаря этому расширению мы не только увеличим способность удовлетворять внутренний спрос, но и подготовимся к ведущей роли на мировом нефтяном рынке."
 PRU_privatize_the_public_service:0 "Приватизировать государственные услуги"
 PRU_privatize_the_public_service_desc:0 "Мы рассматриваем передачу некоторых государственных услуг в частные руки, стремясь повысить качество и эффективность предоставления жизненно важных услуг. Эта стратегия позволит раскрыть потенциал частного сектора и направить его на прогресс и развитие."
 PRU_protect_our_businesses:0 "Защитить наши предприятия"
 PRU_protect_our_businesses_desc:0 "Столкнувшись с экономическими трудностями и международной конкуренцией, мы реализуем стратегию «Защитить наши предприятия». Сотрудничая со «Стандард Ойл», мы усилим меры по защите устойчивости и конкурентоспособности отечественных компаний, создавая прочную и стабильную деловую среду."
 PRU_eliminate_the_competition:0 "Устранить конкурентов"
 PRU_eliminate_the_competition_desc:0 "Мы должны избавиться от конкурентов и противников, предприняв решительные действия для обеспечения экономического превосходства наших компаний. Цель — устранить препятствия и гарантировать процветание отечественной промышленности."
 PRU_expand_the_oil_industry:0 "Расширить нефтяную промышленность"
 PRU_expand_the_oil_industry_desc:0 "Наша стратегия направлена не только на укрепление позиций на мировом нефтяном рынке, но и на ускорение экономического и технологического развития."
 PRU_create_the_national_education_fund:0 "Создать Национальный фонд образования"
 PRU_create_the_national_education_fund_desc:0 "Создание Национального фонда образования позволит повысить качество обучения, инвестировать в инфраструктуру, готовить преподавателей и разрабатывать инновационные программы, укрепляя всю образовательную систему."
 PRU_mandatory_social_security:0 "Обязательное социальное страхование"
 PRU_mandatory_social_security_desc:0 "Введём обязательную систему социального страхования, чтобы гарантировать защиту и благополучие граждан, повышая качество их жизни."
 PRU_the_empire_of_the_constitution:0 "Власть конституции"
 PRU_the_empire_of_the_constitution_desc:0 "Инициатива «Власть конституции» направлена на укрепление верховенства закона и демократии. Мы стремимся упрочить конституционные институты, гарантировать разделение властей, защиту личных прав и прозрачное управление."
 PRU_the_new_oil_law:0 "Новый нефтяной закон"
 PRU_the_new_oil_law_desc:0 "Он призван перестроить политику нефтяной отрасли, поощряя инвестиции, эффективность и устойчивость. Новый нефтяной закон ускорит экономическое развитие страны благодаря ответственному управлению нефтяными ресурсами."
 PRU_oil_deal_with_the_united_states:0 "Нефтяная сделка с Соединёнными Штатами"
 PRU_oil_deal_with_the_united_states_desc:0 "Мы стремимся развивать экономическое и стратегическое сотрудничество в нефтяной отрасли, привлекая инвестиции и передовые технологии. Нефтяное соглашение с Соединёнными Штатами должно укрепить двусторонние отношения, способствовать развитию энергетики и экономическому росту Перу."
 PRU_great_national_construction_program:0 "Великая национальная строительная программа"
 PRU_great_national_construction_program_desc:0 "Эта масштабная программа ускорит развитие инфраструктуры по всей стране, включая дороги, мосты, энергетические объекты и многое другое. Она оживит экономику, создаст рабочие места и повысит качество жизни граждан, заложив основы процветающего и устойчивого будущего."
 PRU_womens_right_to_vote:0 "Избирательное право для женщин"
 PRU_womens_right_to_vote_desc:0 "Мы стремимся к гендерному равенству и полноценному участию в демократическом процессе, признавая и укрепляя основополагающую роль женщин в обществе. Предоставление им права голоса сделает политическое представительство в Перу более справедливым и всеобъемлющим."
 PRU_a_new_military_doctrine:0 "Новая военная доктрина"
 PRU_a_new_military_doctrine_desc:0 "Мы стремимся модернизировать вооружённые силы, используя опыт и уроки наших союзников для создания эффективной и хорошо подготовленной обороны."
 PRU_japanese_investment_in_the_naval_industry:0 "Японские инвестиции в судостроение"
 PRU_japanese_investment_in_the_naval_industry_desc:0 "Это стратегическое сотрудничество привлечёт японские инвестиции в наш военно-морской сектор и позволит модернизировать и расширить морские возможности. Наша цель — не только обеспечить надёжную защиту побережья, но и наладить долговременное сотрудничество с японскими союзниками."
 PRU_invite_japanese_naval_advisors:0 "Пригласить японских военно-морских советников"
 PRU_invite_japanese_naval_advisors_desc:0 "Мы сердечно приглашаем японских военно-морских советников к тесному сотрудничеству с нашим флотом. Этот стратегический шаг не только укрепит морскую оборону, но и создаст прочный военный союз с Японией."
 PRU_German_investment_in_the_military_industry:0 "Германские инвестиции в военную промышленность"
 PRU_German_investment_in_the_military_industry_desc:0 "Это стратегическое решение привлечёт германские инвестиции в наш военно-промышленный комплекс, позволив модернизировать и расширить его возможности. Цель — не только укрепить оборону, но и создать долговременное партнёрство с германскими союзниками."
 PRU_invite_german_military_advisors:0 "Пригласить германских военных советников"
 PRU_invite_german_military_advisors_desc:0 "Мы стремимся перенять передовые тактические, стратегические и технологические знания, повысив обороноспособность. Этот шаг не только улучшит боеготовность, но и укрепит долговременный военный союз с Германией."
 PRU_expel_the_reds_from_america:0 "Изгнать красных из Америки"
 PRU_expel_the_reds_from_america_desc:0 "Эта стратегия усилит сотрудничество с антикоммунистическими союзниками ради сопротивления и изгнания красного влияния из наших стран. Вместе с другими американскими государствами мы обязуемся защищать стабильность и свободу континента."
 PRU_long_live_our_caudillo:0 "Да здравствует наш каудильо!"
 PRU_long_live_our_caudillo_desc:0 "Эта инициатива подтверждает нашу непоколебимую верность сильному и дальновидному руководству каудильо. Мы стремимся увековечить его наследие, укрепить внутреннюю стабильность и национальное единство."
 PRU_The_new_South_american_axis:0 "Новая южноамериканская ось"
 PRU_The_new_South_american_axis_desc:0 "Эта амбициозная стратегия направлена на укрепление сотрудничества и единства южноамериканских стран, обеспечение стабильности и совместного развития. Взаимодействуя в сфере безопасности, экономики и дипломатии, мы создадим прочный блок для защиты общих интересов и процветания всего региона."
 PRU_american_fascist_union:0 "Американский фашистский союз"
 PRU_american_fascist_union_desc:0 "Мы стремимся создать единый политический фронт и продвигать фашистские принципы ради стабильности и порядка в стране. Под руководством этого союза будут проводиться меры, укрепляющие власть государства, национальное единство и процветание."
 PRU_Create_the_Royal_Army:0 "Создать королевскую армию"
 PRU_Create_the_Royal_Army_desc:0 "Мы намерены сформировать вооружённые силы, верные перуанской монархии, чтобы гарантировать защиту страны и сохранение монархических ценностей."
 PRU_The_Soldier_King:0 "Король-солдат"
 PRU_The_Soldier_King_desc:0 "В беспрецедентном поступке наш монарх принимает активное участие в военном руководстве как «король-солдат». Вдохновляя вооружённые силы и возглавляя разработку стратегии, он демонстрирует непоколебимую преданность безопасности и обороне Перу. Это укрепит наши военные позиции и закрепит образ монарха как храброго и решительного лидера."
 PRU_Royal_Construction_Program:0 "Королевская строительная программа"
 PRU_Royal_Construction_Program_desc:0 "Этот амбициозный план охватывает важнейшие проекты, которые ускорят экономическое, инфраструктурное и технологическое развитие Перу. Инвестируя в модернизацию, мы не только укрепим положение в мире, но и вновь подтвердим величие перуанской монархии."
 PRU_Acquire_French_weapons:0 "Приобрести французское оружие"
 PRU_Acquire_French_weapons_desc:0 "Стремясь укрепить вооружённые силы, мы решили обратиться к Франции за передовым оружием. Внедрение французских технологий и техники усилит нашу оборону и продемонстрирует приверженность национальной безопасности."
 PRU_sons_of_the_conquistador:0 "Сыны конкистадоров"
 PRU_sons_of_the_conquistador_desc:0 "Мы стремимся возродить дух предков и почтить богатое наследие конкистадоров. Признавая их храбрость и дерзновение, мы намерены построить будущее, полное величия и свершений."
 PRU_defend_our_empire:0 "Защитить нашу империю"
 PRU_defend_our_empire_desc:0 "В мире, становящемся всё более неопределённым, наш долг — защитить и сохранить любимую империю. Объединившись ради её обороны, мы обеспечим безопасность границ и будущее перуанской монархии."
 PRU_Receive_refugees_from_the_Spanish_civil_war:0 "Принять беженцев из Испании"
 PRU_Receive_refugees_from_the_Spanish_civil_war_desc:0 "Перед лицом разорительной гражданской войны в Испании мы решили открыть двери беженцам, ищущим безопасности и нового дома. Принимая их, Перу не только протягивает руку помощи, но и укрепляет свои общины новыми талантами и культурным разнообразием."
 PRU_return_to_europe:0 "Вернуться в Европу"
 PRU_return_to_europe_desc:0 "Пришло время Перу вернуться в Европу и восстановить славу Испанской империи. Этот фокус проложит путь к нашему возвращению в Испанию и основанию новой Испанской империи."
 PRU_create_the_united_kingdom_of_spain:0 "Создать Соединённое Королевство Испании"
 PRU_create_the_united_kingdom_of_spain_desc:0 "Чтобы восстановить славу Испанской империи, Перу выступит с инициативой создания Соединённого Королевства Испании. Этот курс проведёт нас через необходимые этапы объединения испанских территорий и создания могущественного королевства, способного соперничать с великими державами Европы."
 PRU_all_spanish_cores_controlled_by_self_or_puppet_tt:0 "Все национальные территории Испании контролируются либо государством [ROOT.GetNameDef], либо одним из его субъектов."
 PRU_Bring_the_revolution_to_all_America:0 "Принести революцию во всю Америку"
 PRU_Bring_the_revolution_to_all_America_desc:0 "Революционный дух охватит всю Латинскую Америку. После долгих лет служения интересам крупного капитала и великого американского дьявола пришло время восстать и разбить их цепи."
 PRU_radicalize_the_pcp:0 "Радикализировать ПКП"
 PRU_radicalize_the_pcp_desc:0 "С момента основания Коммунистическая партия Перу (ПКП) опиралась в своём развитии на советские коммунистические доктрины. Но чего ещё можно добиться, если она продолжит следовать социалистическим идеям Мариатеги — перуанского мыслителя, предложившего менее авторитарную формулу, отличную от советского социализма? Лучший способ отбросить эти взгляды — радикализировать партию и искоренить любую идеологию, противоречащую советской догме."
 PRU_revolutionary_vanguard:0 "Революционный авангард"
 PRU_revolutionary_vanguard_desc:0 "«Революционный авангард» (РА) — перуанская марксистская политическая партия, основанная в 1935 году. После своего создания она стала важным ориентиром для перуанских левых и одним из основных течений, из которых возникли различные социалистические организации."
 PRU_give_power_to_cgtp:0 "Передать власть ВКТП"
 PRU_give_power_to_cgtp_desc:0 "Всеобщая конфедерация трудящихся Перу — перуанский профсоюзный центр мариатегистской идеологии со штаб-квартирой в Лиме. Он был основан в 1929 году Хосе Карлосом Мариатеги и руководствуется принципами классовой борьбы. Девиз ВКТП — «За единство пролетариата», а её официальная газета — «Труд»."
 PRU_request_soviet_support:0 "Запросить советскую поддержку"
 PRU_request_soviet_support_desc:0 "Недавняя поездка Равинеса в Советский Союз в 1930 году позволила укрепить отношения между Советами и перуанцами. Московский план, согласованный с Равинесом, был выполнен, поскольку Перу оказалось под властью коммунистов, однако для сохранения и развития режима, а также его распространения по всей Южной Америке необходима значительная финансовая и военная поддержка СССР."
 PRU_soviet_support:0 "Поддержка государства [SOV.GetAdjective]"
 PRU_the_peruvian_five_year_plan:0 "Перуанская пятилетка"
 PRU_the_peruvian_five_year_plan_desc:0 "Пятилетний план, применявшийся в Советском Союзе, превратил эту страну из сельской в полностью индустриальную. С момента основания в 1821 году Перу оставалось преимущественно аграрной и горнодобывающей страной и почти не производило готовых товаров из-за отсутствия развитой национальной промышленности. Небольшие жертвы, которые придётся принести перуанскому народу, будут вознаграждены созданием индустриальной державы."
 PRU_exile_haya_de_la_torre:0 "Выслать Айю де ла Торре"
 PRU_exile_haya_de_la_torre_desc:0 "Виктор Рауль Айя де ла Торре — один из крупнейших политических агитаторов Перу. С момента основания АПРА апристы неизменно угрожали стабильности страны. Речи Виктора Рауля Айи де ла Торре мобилизуют коренное население, крестьян и обедневший средний класс, требующих перемен. Лучше всего будет выслать его в Мексику."
 PRU_the_memory_of_benavides:0 "Память о Бенавидесе"
 PRU_the_memory_of_benavides_desc:0 "Бенавидес был одним из руководителей восстановления Перу после провала правительства Санчеса Серро и вызванного им экономического кризиса. После его смерти все перуанцы вспоминают его деяния и выдающееся правление."
 PRU_Recovering_from_the_civil_war:0 "Оправиться от депрессии"
 PRU_Recovering_from_the_civil_war_desc:0 "После Великой депрессии 1929 года и трагической смерти военного лидера Луиса Санчеса Серро Перу погрузилось в тяжёлый экономический кризис, почти полностью остановивший развитие страны. Однако правильное использование немногочисленных известных и ещё не открытых месторождений позволит построить прочную экономику."
 PRU_peruvian_military_youth:0 "Перуанская военная молодёжь"
 PRU_peruvian_military_youth_desc:0 "Обязательная военная служба в Перу вызывает споры из-за жестокости системы: молодых людей насильно забирают, подвергают издевательствам и даже пыткам. Лишь к концу 1930-х годов общество узнает всю степень этой жестокости. Тем не менее новая система призыва перуанской молодёжи даст национальной армии новых солдат."
 PRU_the_victory_of_our_caudillo:0 "Победа нашего каудильо"
 PRU_the_victory_of_our_caudillo_desc:0 "Каудильо — термин, обозначающий политического, военного или идеологического вождя. Хотя в широком смысле так можно назвать любого руководителя, со временем слово приобрело особый политический оттенок. Военный лидер, ныне правящий Перу, сумел победить всех своих соперников и стать самым могущественным человеком в стране."
 PRU_liberate_all_cab:0 "Принести революцию на Карибы"
 PRU_liberate_all_cab_desc:0 "Великий американский демон протянул щупальца далеко за свои границы, водрузив свой флаг над Пуэрто-Рико и Доминиканской Республикой. Священный долг всех народов Южной Америки — объединить силы и изгнать зловещие силы дяди Сэма из Латинской Америки."
 PRU_develop_the_provinces:0 "Панинкаизм"
 PRU_develop_the_provinces_desc:0 "Сияние величия инков должно озарить наш путь в будущее. Это культурное возрождение укрепит национальное самосознание и позволит привлечь на нашу сторону коренные народы, некогда входившие в Империю инков. Пусть дух Империи инков ведёт нас к величию!"
 PRU_legacy_of_the_war_with_ecuador:0 "Наследие войны с Эквадором"
 PRU_legacy_of_the_war_with_ecuador_desc:0 "Для достижения полной победы [ROOT.GetLeader] должен окончательно обезопасить Анды. Республика [ECU.GetNameDefCap] всё ещё остаётся угрозой, которая будет постоянно кусать нашу страну за пятки, если мы её не устраним."
 PRU_american_naval_doctrine:0 "Американская морская доктрина"
 PRU_american_naval_doctrine_desc:0 "Морская доктрина государства [USA.getAdjective] поможет возродить наш устаревший флот. Тактика прошлого века не пригодится в крупном конфликте, поэтому лучшим решением будет сотрудничество с этой морской державой."
 PRU_recover_from_the_economic_crisis:0 "Преодолеть экономический кризис"
 PRU_recover_from_the_economic_crisis_desc:0 "После Великой депрессии 1929 года и трагической смерти военного лидера Луиса Санчеса Серро Перу погрузилось в тяжёлый экономический кризис, почти полностью остановивший развитие страны. Однако правильное использование немногочисленных известных и ещё не открытых месторождений позволит построить прочную экономику."
 PRU_freedom_defenders:0 "Защитники свободы"
 PRU_freedom_defenders_desc:0 "Наше положение свободной и демократической страны находится под угрозой из-за окружающих нас диктатур. Мы должны стать примером современного государства и доказать, что личные свободы обеспечат процветание нашей страны."
 PRU_include_llamas_in_the_army:0 "Включить лам в состав армии"
 PRU_include_llamas_in_the_army_desc:0 "Лама — домашнее парнокопытное млекопитающее семейства верблюдовых, выведенное коренными народами Анд путём искусственного отбора из гуанако. Этот процесс независимо происходил в разных районах Перу. Империя инков использовала это животное во всех возможных сферах."
 PRU_german_aeronautic_cooperation:0 "Германское авиационное сотрудничество"
 PRU_german_aeronautic_cooperation_desc:0 "Самолёты государства [GER.getAdjective] прочны и тяжелы. Они идеально подходят нашим военно-воздушным силам."
 PRU_japanece_naval_doctrine:0 "Японская морская доктрина"
 PRU_japanece_naval_doctrine_desc:0 "Морская доктрина государства [JAP.getAdjective] поможет возродить наш устаревший флот. Тактика прошлого века не пригодится в крупном конфликте, поэтому лучшим решением будет сотрудничество с этой морской державой."
 PRU_contact_pedro:0 "Поддержать притязания Педру"
 PRU_contact_pedro_desc:0 "Педру Энрике Орлеан-Браганса, прозванный «Ожидаемым принцем», был потомком бразильской императорской семьи и претендентом на престол Бразилии с 1921 года до своей смерти в июле 1981 года. В ноябре 1921 года он сменил свою бабушку, принцессу Изабел, во главе Императорского дома Бразилии при поддержке монархистов и своего дяди, принца Педру де Алкантары Орлеан-Брагансы. Он приходился двоюродным братом принцессе Марии де лас Мерседес, графине Барселонской, а следовательно, был родственником королей Испании Хуана Карлоса I и Филиппа VI."
 PRU_restore_the_empire:0 "Восстановить империю"
 PRU_restore_the_empire_desc:0 "Бывшая Бразильская империя под властью своих монархов сумела стать региональной державой. Наш король решил, что поддержать сторонников Педру Энрике — единственного законного правителя всех бразильцев — является национальным долгом."
 PRU_control_the_economy:0 "Взять экономику под контроль"
 PRU_control_the_economy_desc:0 "Экономика Перу полностью контролируется богатейшими семействами и узкой олигархией, заботящейся лишь о собственных и иностранных интересах. Если государство возьмёт под контроль основные средства производства — сельское хозяйство и горнодобывающую отрасль — и отстранит старую лимскую олигархию, это предотвратит возможную революцию, способную мгновенно парализовать всю страну."
 PRU_open_universities_to_indigenous_people:0 "Открыть университеты для коренных народов"
 PRU_open_universities_to_indigenous_people_desc:0 "Долгое время коренные народы кечуа и аймара, составляющие большинство населения Перу, не имели доступа к качественному образованию, поскольку лучшие школы и университеты были сосредоточены главным образом в столице — Лиме. Открытие государственных школ и университетов для коренного населения позволит раскрыть таланты, которые иначе никогда не были бы замечены."
 PRU_reject_international_ideologies:0 "Отвергнуть иностранные идеологии"
 PRU_reject_international_ideologies_desc:0 "Международные идеологии вроде коммунизма и фашизма распространились среди крестьян и среднего класса Перу. Эти радикальные учения отрывают людей от их инкских корней и заставляют сочувствовать иностранным державам, чуждым нашей национальной действительности. Запрет таких идеологий поможет предотвратить будущую революцию против наследия инков."
 PRU_organize_protests_in_the_south:0 "Организовать коренные народы юга"
 PRU_organize_protests_in_the_south_desc:0 "Мобилизация кечуа на главных площадях Куско, Арекипы и Пуно предупредит центральное правительство о возможной революции, но также может парализовать южные районы страны и лишить столицу металлов и продовольствия, производимых в этом регионе."
 PRU_convince_the_high_command:0 "Убедить высшее командование"
 PRU_convince_the_high_command_desc:0 "Среди членов военной хунты есть влиятельные командиры, сочувствующие идее восстановления инкского государства. Их влияние настолько велико, что переговоры с ними могут обеспечить нам поддержку в случае революции."
 PRU_monumental_architecture:0 "Монументальная архитектура"
 PRU_monumental_architecture_desc:0 "Архитектура эпохи инков отличалась точностью форм, прочностью, симметрией и стремлением гармонично вписать сооружения в ландшафт. В отличие от прибрежных обществ, таких как чиму, инки использовали весьма изобретательный декор. Главным материалом служил камень: в простых постройках его укладывали необработанным, а в сложных и важных сооружениях тщательно высекали. Инкские строители разработали методы возведения огромных стен — настоящих мозаик из каменных блоков, подогнанных настолько плотно, что между ними невозможно было просунуть даже иглу."
 PRU_the_march_of_the_four_suyos:0 "Марш четырёх суйю"
 PRU_the_march_of_the_four_suyos_desc:0 "Коренные жители со всех концов Перу собрались, чтобы начать переворот против центрального правительства. Народы четырёх суйю объединяются ради общей цели — восстановления Империи инков."
 PRU_look_to_the_past_2:0 "Обратиться к прошлому"
 PRU_look_to_the_past_2_desc:0 "Великолепное прошлое вице-королевской эпохи всё ещё живо в памяти большинства перуанцев, уставших от республиканского строя и требующих немедленных перемен. С момента основания республика приносила лишь разобщённость и коррупцию в парламент и государственный аппарат. Воспоминания о прошлом, полном богатства и великолепия, раздувают в народе пламя революции."
 PRU_Convince_supporters_of_Flores:0 "Убедить сторонников Флореса"
 PRU_Convince_supporters_of_Flores_desc:0 "Из надёжных источников известно, что некоторые члены партии «Революционный союз», близкие к Луису Альберто Флоресу, придерживаются монархических взглядов. Глубокий национализм Флореса разочаровывает его наиболее консервативных и монархически настроенных сторонников, которые постепенно присоединяются к протестам за установление королевской власти в Перу."
 PRU_secure_the_northern_road_network:0 "Обезопасить северную дорожную сеть"
 PRU_secure_the_northern_road_network_desc:0 "Инфраструктурные сети, связывающие север со столицей Перу, имеют огромное стратегическое значение. Если их перерезать, центральное правительство останется без нефти и каучука, поступающих преимущественно с севера. Это заставит власти осознать всю серьёзность народных требований об установлении монархии."
 PRU_Support_the_Catholic_Church:0 "Поддержать Католическую церковь"
 PRU_Support_the_Catholic_Church_desc:0 "Конституция Перу признаёт важный вклад католической религии в формирование перуанской нации. Однако, несмотря на преобладание католицизма, Перу перестало быть конфессиональным государством и признало свободу вероисповедания. Даже формы католической практики в стране различаются: так называемая «народная религия» возникла из синкретизма католицизма и доиспанских верований."
 PRU_organize_marches_in_the_north:0 "Организовать марши на севере"
 PRU_organize_marches_in_the_north_desc:0 "В северных городах Перу всегда преобладали испаноязычные жители и метисы. Организация массовых выступлений на главных площадях Трухильо, Пьюры, Лимы и Тумбеса способна оказать давление на центральное правительство. Протесты могут перерасти в насилие и превратиться в настоящую революцию."
 PRU_launch_the_coup:0 "Начать переворот"
 PRU_launch_the_coup_desc:0 "Республиканская система правления не работает. С момента основания Республики Перу в 1821 году конгресс лишь ввергал страну в глубокие социальные и экономические кризисы, вызывая застой общества и промышленности. Возрождение Перу под властью короля может открыть путь к будущему, полному великолепия и славы."
 PRU_our_revolution:0 "Наша революция"
 PRU_our_revolution_desc:0 "Создание Альянса за американскую революцию позволит противостоять требованиям Москвы, которая обращается с коммунистическими странами мира как со своими колониями. [ROOT.GetLeader] должен стать проводником великой южноамериканской революции."
 alliance_for_the_american_revolution:0 "Альянс за американскую революцию"
 PRU_revolucion_restauradora:0 "Восстановить порядок"
 PRU_revolucion_restauradora_desc:0 "«Восстановительная революция» под руководством героя сражения при Панупали генерала Мануэля Одрии — единственный способ покончить с некомпетентностью старого политического класса и открыть новую эпоху для государства [ROOT.GetNameDefCap], свободную от коррупции и полную процветания."
 PRU_trans_pacific_alliance:0 "Присоединиться к Сфере сопроцветания"
 PRU_trans_pacific_alliance_desc:0 "Идею вступления в Сферу сопроцветания предложил наш лидер [ROOT.GetLeader] после контактов с руководством государства [JAP.getAdjective]. В прошлом в государство [ROOT.GetNameDefCap] прибыло множество японских иммигрантов, внёсших большой вклад в экономику всех граждан государства [ROOT.getAdjective] и особенно в развитие сельского хозяйства."
 PRU_join_axis:0 "Присоединиться к Оси"
 PRU_join_axis_desc:0 "Идею вступления в Ось предложил наш лидер [ROOT.GetLeader] после контактов с представителями государства [GER.getAdjective]. Ещё раньше государство [ROOT.GetNameDefCap] сблизилось с государством [GER.GetNameDefCap] благодаря открытию улицы Лимы в Берлине и работе военных инструкторов, обучавших армию государства [ROOT.getAdjective] применению танков."
 PRU_inti_raymi:0 "Наследие Инти"
 PRU_inti_raymi_desc:0 "Инкаизм или ощущение превосходства расы инков или «медной расы» уникальных детей солнца наследников древних земель инков, сегодня их дети объединятся в единую силу, чтобы вспомнить то великолепное прошлое, охватившее всех союзников южноамериканского кечуа."
 runasimi_union:0 "Союз рунасими"
 PRU_legacy_of_guayaquil_treaty:0 "Наследие Гуаякильского договора"
 PRU_legacy_of_guayaquil_treaty_desc:0 "Наша северная граница должна быть укреплена на случай, если какое-либо из так называемых бывших боливарианских государств решит сослаться на принцип uti possidetis juris и вновь заявить притязания на районы Лорето и Пастаса!"
 PRU_hispanic_union:0 "Испанский союз"
 PRU_hispanic_union_desc:0 "История испанского наследия Перу воплощена в националисте-испанисте Хосе де ла Рива-Агуэро-и-Осме. Вспоминая великолепное прошлое Перуанского вице-королевства, эпоху изобилия и процветания, он стремился вернуть единство и силу, объединив всех испанистов Южной Америки."
 union_hispanica:0 "Испанский союз"
 PRU_attack_japan:0 "Напасть на Японию"
 PRU_attack_japan_desc:0 "Как было согласовано с нашими новыми союзниками [ENG.GetNameDefCap] и [USA.GetNameDefCap], мы должны как можно скорее напасть на [JAP.GetNameDefCap] и раз и навсегда положить конец её террору в Азии."
 PRU_attack_germany:0 "Напасть на Германию"
 PRU_attack_germany_desc:0 "Как было согласовано с нашими новыми союзниками [ENG.GetNameDefCap] и [USA.GetNameDefCap], мы должны как можно скорее напасть на [GER.GetNameDefCap] и раз и навсегда положить конец её террору в Европе."
 PRU_hit_argentina:0 "Убить южного гиганта"
 PRU_hit_argentina_desc:0 "Страна нашего освободителя Сан-Мартина, ныне самое процветающее и богатое государство Южной Америки, должна пасть, чтобы уступить место новой южноамериканской державе."
 PRU_hit_chile:0 "Война возмездия"
 PRU_hit_chile_desc:0 "После Тихоокеанской войны наши армия и флот были полностью разгромлены. Новые поколения выросли в атмосфере национализма и жажды мести, которую разжигает лидер [ROOT.GetLeader]. Час возмездия и возвращения утраченных территорий уже близок."
 PRU_ochenio_de_Odria:0 "Диктатура Одрии"
 PRU_ochenio_de_Odria_desc:0 "Мануэль Одрия всегда был дальновидным человеком. Ещё до занятия государственных должностей он мечтал полностью модернизировать страну: создать жилые и школьные комплексы, построить крупную больницу «Эмплеадо» и великие автомагистрали, соединяющие все уголки Перу. Современность должна дойти до самой отдалённой точки страны."
 PRU_hit_colombia:0 "Экспансия на север"
 PRU_hit_colombia_desc:0 "После краткой войны за Летисию с государством [COL.GetNameDefCap] и уступки Амазонской трапеции из-за антипатриотизма Оскара Бенавидеса пришло время вернуть наши земли. Под руководством [ROOT.GetLeader] Перу одержит великую победу и восстановит свои изначальные границы."
 PRU_the_final_march:0 "Последний марш"
 PRU_the_final_march_desc:0 "Американская империя стремится подчинить нашу страну и свергнуть правительство [ROOT.GetLeader]. Пришло время объединить весь народ государства [ROOT.getAdjective] в могучий кулак, который сокрушит великого гиганта Америки во имя свободы всех граждан государства [ROOT.getAdjective]."
 PRU_precious_metal_exports:0 "Экспорт драгоценных металлов"
 PRU_precious_metal_exports_desc:0 "Наши природные ресурсы, такие как медь, золото и сталь, будут катапультировать нашу страну к успеху."
 PRU_la_legion_peruana:0 "Перуанский легион"
 PRU_la_legion_peruana_desc:0 "Мы должны укрепить армию, возродив Перуанский легион — старый элитный корпус, применявшийся в тяжёлые времена государства [PRU.GetNameDefCap]. На этот раз его сформируют из народа кечуа."
 PRU_incaism:0 "Наше славное прошлое"
 PRU_incaism_desc:0 "В прошлом Империя инков была одной из могущественнейших держав доколумбовой Америки. Мы должны укрепить связь с нашим инкским наследием."
 PRU_integrate_women1:0 "Привлечь женщин"
 PRU_integrate_women1_desc:0 "Перуанские женщины являются основой нашей экономики и традиционной семейной жизни. Их привлечение к работе на фабриках повысит эффективность зарождающейся промышленности."
 PRU_oil_republic:0 "Нефтяная республика"
 PRU_oil_republic_1:0 "Нефтяная республика"
 PRU_new_peru_1:0 "Новое Перу"
 PRU_new_peru_1_desc:0 "После эпохи коррумпированных правителей и олигархов государству [PRU.GetNameDefCap] пора вступить в новую эру, преобразовав свою политику и обновив политический класс."
 PRU_riva_agueros:0 "Мечта Рива-Агуэро"
 PRU_riva_agueros_desc:0 "Католический идеолог Хосе де ла Рива-Агуэро-и-Осма открыто говорил о желании создать перуанский национализм, не впадающий в крайности фашизма. Сегодня его мечта стала реальностью."
 PRU_agricultural:0 "Аграрная реформа"
 PRU_agricultural_desc:0 "Наше сельское хозяйство, богатое разнообразными культурами, всегда было одной из главных опор страны. Недавнее развитие этого сектора поможет улучшить положение всех общественных классов государства [PRU.GetNameDefCap]."
 PRU_revolucion:0 "Восстановительная консервативная революция"
 PRU_revolucion_desc:0 "Генерал Одрия, герой боя при Панупали, вместе со своей партией «Национальный союз одриистов» (НСО) приведёт нас к победе и развитию, в которых нуждается страна."
 PRU_wake_up:0 "Пробудить гиганта"
 PRU_wake_up_desc:0 "Великая страна восстаёт и благодаря воле и вере своего народа навяжет соседям собственную волю."
 PRU_wake_up_fascism:0 "Пробудить гиганта"
 PRU_wake_up_fascism_desc:0 "Великая страна восстаёт и благодаря воле и вере своего народа навяжет соседям собственную волю."
 PRU_inti:0 "Наследие Инти"
 PRU_inti_1:0 "Наследие Инти"
 PRU_inti_2:0 "Наследие Инти"
 PRU_inti_desc:0 "Объединение всех коренных кечуа Южной Америки создаст новую армию, которая приведёт нас к победе."
 PRU_nationalizex_the_banking_sector:0 "Национализированные банки"
 PRU_nightmare:0 "Идущая революция"
 PRU_nightmare_desc:0 "Сегодня воля народа стала кошмаром для [PRU.getLeader], поскольку власти не способны провести необходимые обществу реформы."
 PRU_rights_to_indigenous_people:0 "Права коренных народов"
 PRU_social_spending:0 "Увеличенные социальные расходы"
 PRU_arm_people:0 "Вооружить народ"
 PRU_women_in_the_army:0 "Женщины в армии"
 PRU_peru_falangism:0 "Испанизм"
 PRU_peru_falangism_1:0 "Испанская гордость"
 PRU_flores_influence:0 "Влияние Флореса"
 PRU_flores_influence_1:0 "Каудильо Флорес"
 PRU_flores_influence_2:0 "Каудильо Флорес"
 PRU_ureta_influence:0 "Влияние Урета"
 PRU_ureta_influence_1:0 "Каудильо Урета"
 PRU_ureta_influence_2:0 "Каудильо Урета"
 PRU_montagne_influence:0 "Влияние Монтаня"
 PRU_odria_advisor:0 "Влияние Одрии"
 PRU_friend_aprac:0 "Подружиться с апристами"
 PRU_friend_aprac_desc:0 "Для укрепления стабильности страны жизненно важно заручиться поддержкой партии АПРА."
 PRU_military_revolution:0 "Военная революция"
 PRU_military_revolution_desc:0 "Революционное правительство вооружённых сил провозглашает особый перуанский национализм, не связанный с европейскими фашистскими доктринами. Мы пойдём вперёд своим собственным путём."
 PRU_aprismo:0 "Апризм"
 PRU_Increase_in_Crops:0 "Увеличение урожая"
 PRU_aprismo_desc:0 "«Прочный Север» и его ополчение приведут нас к победе под руководством основателя движения Виктора Рауля Айи де ла Торре."
 PRU_stagnant_economy:0 "Застойная экономика"
 PRU_good_economy:0 "Восстановление экономики"
 PRU_good_economy_2:0 "Сильная экономика"
 PRU_stagnant_economy_desc:0 "После нескольких лет политических потрясений национальная экономика застопорилась, вызвав задержку в национальной промышленности и спад в инфраструктурной системе."
 PRU_defeated_navy:0 "Заброшенный флот"
 PRU_defeated_navy_desc:0 "Наши корабли построены ещё в прошлом веке и безнадёжно устарели, как и морская доктрина. Сейчас отсутствует и политическая воля, необходимая для исправления ситуации."
 PRU_great_marina:0 "Возрождение нашего флота"
 PRU_apra_revolution:0 "Подрывные настроения"
 PRU_apra_revolution_desc:0 "Апристы сеют разрушения своими подрывными действиями"
 PRU_friend_apra:0 "Подружиться с апристами"
 PRU_friend_apra_desc:0 "Для укрепления стабильности страны крайне важно заручиться поддержкой партии АПРА."
 PRU_oppresed_apristas:0 "Угнетённые апристы"
 PRU_oppresed_apristas_desc:0 "Для укрепления страны нам не нужны радикальные апристы. Их лидеры находятся в тюрьме, а движение стоит на грани исчезновения."
 PRU_oppresed_urristas:0 "Угнетённые урристы"
 PRU_oppresed_urristas_desc:0 "Для укрепления страны нам не нужны радикальные урристы. Их лидеры находятся в тюрьме, а движение стоит на грани исчезновения."
