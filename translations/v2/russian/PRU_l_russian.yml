 peru.1:0 "Судьба перуанской политики"
 peru.1.t:0 "Судьба перуанской политики"
 peru.1.d:0 "После недолгого правления Санчеса Серро и его преемника [PRU.GetLeader] народ потребовал прояснить судьбу Перу и его правителей.\n\nМы можем открыть путь демократическим выборам, чтобы избрать нового президента.\nЛибо просто отменить выборы в пользу Бенавидеса и продлить его правление, хотя это решение может вызвать общественные волнения из-за отсутствия демократии при его правительстве.\nНаконец, мы можем вспомнить наследие Санчеса Серро, сблизиться с партией «Революционный союз» и принять её националистические идеалы."
 PRU_hans_appear:0 "Призвать Ганса в качестве генерала"
 peru.1.a:0 "Помнить наследие Санчеса Серро."
 peru.1.a.w:0 "Перуанцы, к оружию!"
 peru.1.b:0 "Бенавидес должен продолжить правление."
 peru.1.c:0 "Открыть путь демократическим выборам."
 peru.2:0 "Демократические выборы"
 peru.2.t:0 "Демократические выборы"
 peru.2.d:0 "Демократические выборы — основа любого цивилизованного общества. После недолгого правления [PRU.GetLeader] решил провести выборы, чтобы новый правитель Перу был избран волей народа. Среди претендентов выделяются четыре кандидата. Первый — Хорхе Прадо Угартече, лидер консервативной фракции Перу и влиятельного католического и антиапристского движения. Его главным проектом станет индустриализация Перу при поддержке Соединённых Штатов.\n\nВторой кандидат — Луис Эгигурен Эскудеро, лидер социал-демократов. Эта фракция стремится объединить социалистов и консерваторов Перу в единую силу, наладить отношения с апристами ради голосов их сторонников и развивать страну через сплочение всех перуанцев.\n\nТретий кандидат — бывший член Цивилистской партии Мануэль Висенте Вильяран, один из самых непримиримых противников прежнего режима Легии. Он намерен уничтожить всё его наследие, теснее сблизиться с Соединёнными Штатами и заручиться поддержкой бывших сторонников режима Бенавидеса, чтобы объединить страну и окончательно разгромить партию АПРА.\n\nПоследний кандидат — известный писатель и защитник прав индейцев кечуа Артуро Пабло Перальта Миранда, известный под псевдонимом Гамалиэль Чурата. Он рассчитывает на голоса сторонников АПРА и поддержку протестующего коренного населения. Его считают приверженцем национального коммунизма, независимого от Москвы. Главные обещания Чураты — расширить права коренных народов и покончить с наследием Санчеса Серро и Бенавидеса, которых он считает величайшими диктаторами Перу."
 peru.2.a:0 "Победа Правого национального фронта."
 peru.2.b:0 "Победа социал-демократов."
 peru.2.c:0 "Победа Республиканского альянса действия."
 peru.2.dw:0 "Победа Патриотического фронта тупакмаристов."
 peru.w:0 "Эквадорские солдаты входят на нашу территорию"
 peru.w.t:0 "Эквадорские солдаты входят на нашу территорию"
 peru.w.d:0 "Нам сообщают, что эквадорские солдаты пересекают границу у пограничных постов Сарумилья и притесняют перуанское население. Также поступают сведения о постоянных вторжениях со стороны эквадорских постов Макара и Сапотильо."
 peru.w.a:0 "Это означает войну"
 peru.3:0 "Массовые протесты против отмены выборов"
 peru.3.t:0 "Массовые протесты против отмены выборов"
 peru.3.d:0 "Народ устал от Бенавидеса и продления его правления ещё на три года посредством отмены демократических выборов. Перуанцы поднимутся на защиту демократических ценностей страны."
 peru.3.b:0 "Ещё 3 года с Бенавидесом"
 peru.3.c:0 "Революция спасёт Перу"
 peru.2.bpw:0 "Использовать войну, чтобы объединить всех перуанцев."
 peru.2.a.w:0 "Это право эквадорцев."
 peru.4:0 "Бенавидес умер"
 peru.4.t:0 "Бенавидес умер"
 peru.4.d:0 "Смерть Бенавидеса ощущается почти по всей стране, поскольку его правительство сумело умиротворить Перу после долгих лет восстаний АПРА. Теперь мы надеемся, что будущее Перу окажется столь же многообещающим, каким оно было при его правлении."
 peru.4.a:0 "Какая жалость."
 peru.5:0 "Перу желает обсудить спорные территории"
 peru.5.t:0 "Перу желает обсудить спорные территории"
 peru.5.d:0 "Следуя принципам цивилизованного общества, перуанское государство предлагает установить постоянную границу, чтобы избежать будущих конфликтов. Согласно предложению, граница будет проведена в соответствии со статус-кво, достигнутым на встрече в Вашингтоне в 1936 году."
 peru.5.a:0 "Никогда."
 peru.5.b:0 "Примем требования Перу."
 peru.6:0 "Проблема с Эквадором"
 peru.6.t:0 "Проблема с Эквадором"
 peru.6.d:0 "Граница с Эквадором уже давно является причиной войн. Жизненно важно окончательно решить этот вопрос, а недавнее подписание соглашения о статус-кво 1936 года стало шагом к установлению постоянной границы."
 peru.6.a:0 "Отказаться от пограничного компромисса 1936 года."
 peru.6.b:0 "Начать переговоры с Эквадором."
 peru.6.c:0 "Уничтожим наших врагов."
 peru.7:0 "Перу решает отвергнуть статус-кво"
 peru.7.t:0 "Перу решает отвергнуть статус-кво"
 peru.7.d:0 "Перу решило отвергнуть статус-кво 1936 года, поскольку на землях под флагом Эквадора проживает перуанское население."
 peru.7.a:0 "Ещё одна причина не доверять перуанцам."
 peru.8:0 "Антивоенная революция"
 peru.8.t:0 "Антивоенная революция"
 peru.8.d:0 "Война пробудила революционные настроения среди перуанского народа: Бенавидес не сумел довести до конца свою самоубийственную войну и повёл перуанцев по пути смерти и голода."
 peru.8.a:0 "Мы очистим страну от непатриотичных элементов."
 peru.8.b:0 "Если Бенавидес не подпишет мир, народ сделает это через его голову."
 peru.9:0 "Перу отвергает пограничный статус-кво"
 peru.9.t:0 "Перу отвергает пограничный статус-кво"
 peru.9.d:0 "Перуанцы только что нарушили соглашение о границе с Эквадором, достигнутое в Вашингтоне, и отказались от ранее принятых условий. Нам следует действовать в соответствии с нашей ролью арбитра для менее развитых стран региона."
 peru.9.a:0 "Введём экономические санкции."
 peru.9.b:0 "Это право перуанцев."
 peru.10:0 "[PRU.GetNameDefCap] готовится положить конец народным выборам"
 peru.10.t:0 "[PRU.GetNameDefCap] готовится положить конец народным выборам"
 peru.10.d:0 "[PRU.GetNameDefCap] готовит армию к разгрому массовых партий. В эти тяжёлые времена мы должны забыть о разногласиях и объединиться против общего врага, не признающего право народа свободно выбирать своё правительство. Теперь диктатор [PRU.getLeader] запускает свою машину репрессий, чтобы покончить с нами."
 peru.10.a:0 "Будем защищаться."
 peru.11:0 "[PRU.GetNameDefCap] вооружает [ROOT.GetFascistParty], чтобы привести её к власти"
 peru.11.t:0 "[PRU.GetNameDefCap] вооружает [ROOT.GetFascistParty], чтобы привести её к власти"
 peru.11.d:0 "[PRU.GetNameDefCap] вместе со своим фашистским союзником [ROOT.GetFascistParty] готовят переворот против нашего правительства. Мы не должны позволить фашистским ордам проникнуть в Латинскую Америку. Приготовимся встретить антипатриотов, которые хотят принести нам тот же террор, жертвой которого стало Перу при диктаторе [PRU.GetFascistLeader]. Пора взяться за оружие и положить конец фашистскому восстанию."
 peru.11.a:0 "Будем защищаться."
 peru.12:0 "[ECU.GetNameDefCap] принимает наши территориальные требования"
 peru.12.t:0 "[ECU.GetNameDefCap] принимает наши территориальные требования"
 peru.12.d:0 "Регион Пастаса вновь становится частью нашей территории. Железная воля наших представителей позволила вернуть эти обширные земли. Несомненно, это великая победа правительства [ROOT.GetLeader]."
 peru.12.a:0 "Великий день для всех [ROOT.getAdjective]."
 peru.13:0 "[ECU.GetNameDefCap] отвергает наши территориальные требования"
 peru.13.t:0 "[ECU.GetNameDefCap] отвергает наши территориальные требования"
 peru.13.d:0 "Наша территория в регионе Пастаса была утрачена из-за коррумпированного правительства [ROOT.GetLeader]. В будущем народу [ROOT.getAdjective] придётся вернуть эти земли с оружием в руках."
 peru.13.a:0 "Это допустило коррумпированное правительство [ROOT.GetLeader]."
 peru.14:0 "[USA.GetNameDefCap] принимает наши территориальные требования"
 peru.14.t:0 "[USA.GetNameDefCap] принимает наши территориальные требования"
 peru.14.d:0 "Регион Пастаса вновь становится частью нашей территории. Железная воля наших представителей позволила вернуть эти обширные земли. Несомненно, это великая победа правительства [ROOT.GetLeader]."
 peru.14.a:0 "Великая победа наших политиков."
 peru.15:0 "[USA.GetNameDefCap] отвергает наши территориальные требования"
 peru.15.t:0 "[USA.GetNameDefCap] отвергает наши территориальные требования"
 peru.15.d:0 "Наша территория в регионе Пастаса была утрачена из-за коррумпированного правительства [ROOT.GetLeader]. В будущем народу [ROOT.getAdjective] придётся вернуть эти земли с оружием в руках."
 peru.15.a:0 "Это допустило коррумпированное правительство [ROOT.GetLeader]."
 peru.16:0 "Мы должны избрать вождя революции"
 peru.16.t:0 "Мы должны избрать вождя революции"
 peru.16.d:0 "После долгой борьбы за социальные права народа [ROOT.getAdjective] наша революция наконец свергла диктатора Оскара Бенавидеса. Теперь нам нужен лидер, который поведёт массы по пути революции.\n\nПервый кандидат — Эудосио Равинес, много времени проведший в Москве и Европе за изучением принципов коммунизма. Вместе с группой советских советников он поведёт нашу революцию по пути Советского Союза.\n\nВторой кандидат — популярный лидер Виктор Рауль Айя де ла Торре, влиятельный вождь масс, чьи идеи национальной революции привлекли в его партию крестьян и коренные народы.\nЕго цель — освободить перуанский коммунизм от политического влияния Москвы."
 peru.16.a:0 "Виктор Рауль Айя де ла Торре приведёт нас к победе."
 peru.16.b:0 "Эудосио Равинес приведёт нас к победе."
 peru.17:0 "Память о Санчесе Серро"
 peru.17.t:0 "Память о Санчесе Серро"
 peru.17.d:0 "Санчес Серро по-прежнему живёт в нашей памяти, и его великие деяния никогда не будут забыты. Недавнее сближение Оскара Бенавидеса с партией «Революционный союз» укрепило наше движение, но для возвращения процветания Перу нам нужен лидер с железной волей.\n\nОдним из вариантов является генерал Урета — последователь Санчеса Серро, желающий привести Перу к победе вне влияния итальянского фашизма.\n\nДругой вариант — Луис Альберто Флорес, известный католик и лидер молодёжи урристов, один из ближайших соратников Санчеса Серро. Возглавив его партию, он намерен реформировать её идеологию по образцу итальянского фашизма."
 peru.17.a:0 "Продолжить наследие Санчеса Серро."
 peru.17.b:0 "Покончить с санчессерризмом."
 peru.18:0 "Выбрать преемника Бенавидеса"
 peru.18.t:0 "Выбрать преемника Бенавидеса"
 peru.18.d:0 "Бенавидес больше не способен управлять страной. Недавние протесты показали слабость его правительства, и нам нужен новый лидер, который приведёт нас к так называемой «Новой Родине». Рассматриваются два кандидата.\n\nПервый — Эрнесто Монтань, бывший член «Революционного союза», покинувший партию после её поворота к крайним доктринам вроде фашизма. Он консерватор и намерен вернуть «Революционному союзу» его националистические ценности.\n\nВторой вариант — прибегнуть к перевороту под руководством генерала Рикардо Переса Годоя, находящегося в Такне. Перес Годой — националист, предлагающий глубокие социальные реформы в интересах коренных народов и беднейших слоёв Перу при поддержке своего «Революционного правительства вооружённых сил»."
 peru.18.a:0 "Выбрать Эрнесто Монтаня преемником."
 peru.18.b:0 "Поддержать революцию в Такне."
 peru.19:0 "[PRU.GetNameDefCap] вооружает [ROOT.GetCommunistParty], чтобы привести её к власти"
 peru.19.t:0 "[PRU.GetNameDefCap] вооружает [ROOT.GetCommunistParty], чтобы привести её к власти"
 peru.19.d:0 "[PRU.GetNameDefCap] вместе со своим коммунистическим союзником [ROOT.GetCommunistParty] готовят переворот против нашего правительства. Мы не должны позволить коммунистическим ордам проникнуть в Латинскую Америку. Приготовимся встретить антипатриотов, которые хотят принести нам тот же террор, жертвой которого стало Перу при диктаторе [PRU.GetCommunistLeader]. Пора взяться за оружие и положить конец коммунистическому восстанию."
 peru.19.a:0 "Будем защищаться."
 peru.23:0 "[PRU.GetNameDefCap] вооружает [ROOT.GetCommunistParty], чтобы привести её к власти"
 peru.23.t:0 "[PRU.GetNameDefCap] вооружает [ROOT.GetCommunistParty], чтобы привести её к власти"
 peru.23.d:0 "[PRU.GetNameDefCap] вместе со своим коммунистическим союзником [ROOT.GetCommunistParty] готовят переворот против нашего правительства. Мы не должны позволить коммунистическим ордам проникнуть в Латинскую Америку. Приготовимся встретить антипатриотов, которые хотят принести нам тот же террор, жертвой которого стало Перу при диктаторе [PRU.GetCommunistLeader]. Пора взяться за оружие и положить конец коммунистическому восстанию."
 peru.23.a:0 "Мы должны принять меры, чтобы не допустить коммунистического правительства."
 formed_peru_bolivia:0 "Создано Перу-Боливийское государство"
 PRU_no_peru_bolivia:0 "Вы являетесь монархическим правительством"
 PRU_no_inca_peru_bolivia:0 "Вы являетесь империей инков"
 peru.24:0 "Проблема АПРА"
 peru.24.t:0 "Проблема АПРА"
 peru.24.d:0 "С момента своего основания в 1924 году партия апристов сеет террор по всей стране и силой навязывает свою социалистическую идеологию. Её сторонники многочисленны, и мы не можем начать открытую борьбу с ними, не развязав кровавую гражданскую войну.\nУ нас есть лишь два выхода: попытаться сотрудничать с ними ради стабильного правительства или объявить их партию подрывной организацией и запретить её, хотя это может вызвать беспорядки в городах, контролируемых апристами."
 peru.24.a:0 "Партию апристов следует запретить."
 peru.24.b:0 "У нас нет иного выбора, кроме сотрудничества с апристами."
 peru.25:0 "Выборы 1945 года"
 peru.25.t:0 "Выборы 1945 года"
 peru.25.d:0 "Как и положено в нашей демократической стране, действующий президент [PRU.GetLeader] объявляет всеобщие выборы, чтобы определить следующего правителя Перу. Одним из кандидатов является центристский политик Хосе Бустаманте-и-Риверо, который ради победы стремится заручиться голосами апристов и обещает предоставить их представителям несколько постов в правительстве.\nС другой стороны, кандидатом выступает герой войны Элой Урета, победитель кампании 1941 года, чья тактика принесла Перу великую победу над северными соседями. Однако его прежние радикальные взгляды могут связать его с фашизмом, уже разгромленным в Европе."
 peru.25.a:0 "Победа Национального демократического фронта."
 peru.25.b:0 "Победа Патриотического фронта."
 peru.27:0 "Выборы 1939 года"
 peru.27.t:0 "Выборы 1939 года"
 peru.27.d:0 "Как и положено в нашей демократической стране, действующий президент [PRU.GetLeader] объявляет всеобщие выборы, чтобы определить следующего правителя Перу. Есть два кандидата. Первый — банкир Мануэль Прадо Угартече, представитель одной из богатейших семей Перу. Его правительственная программа предусматривает сближение с Соединёнными Штатами и демократическими странами Европы ради заключения выгодного договора о свободной торговле. \nДругой кандидат — Хосе Кесада Ларреа, представляющий националистическую фракцию, ослабленную изгнанием основателя партии «Революционный союз». Ларреа намерен сохранить нейтралитет Перу в противостоянии европейских держав, однако его националистические убеждения могут быстро заставить его выбрать одну из сторон."
 peru.27.b:0 "Победа Консервативной коалиции."
 peru.27.a:0 "Победа Патриотического фронта."
 peru.65:0 "Выборы 1945 года"
 peru.65.t:0 "Выборы 1945 года"
 peru.65.d:0 "Народ Перу готовится отдать свои голоса на судьбоносных выборах 1945 года, которые определят будущий политический облик страны."
 peru.65.b:0 "Победа Реформистской демократической партии."
 peru.65.a:0 "Победа Патриотического фронта."
 peru.66:0 "Встреча с вождями общин"
 peru.66.t:0 "Встреча с вождями общин"
 peru.66.d:0 "Разворачивается судьбоносное собрание: лидеры общин кечуа встречаются, чтобы обсудить будущее набирающего силу движения. Воздух наполнен ожиданием и тяжестью исторического выбора. Собравшиеся вожди, хранители древних традиций, должны решить, по какому пути Перу пойдёт в горниле политических потрясений. Примут ли они величественную идею превосходства инков, черпая вдохновение в славном прошлом ради создания нового будущего? Или поддержат создание Союза кечуа, способствующего единству коренных народов региона? На рассмотрении есть и более смелое предложение — коронация нового Инки, символического и могущественного лидера, который поведёт Перу в эпоху преобразований. Судьба движения висит на волоске, и решения, принятые на этой важнейшей встрече, определят ход истории народа кечуа."
 peru.66.a:0 "Идея превосходства инков."
 peru.66.b:0 "Передать власть Союзу кечуа."
 peru.66.c:0 "Поддержать идею коронации Инки."
 peru.67:0 "Судьба Американского рейха"
 peru.67.t:0 "Судьба Американского рейха"
 peru.67.d:0 "Пока геополитическая обстановка продолжает меняться, Рейх инков оказывается на распутье в вопросе отношений с Германским рейхом. Судьба этого молодого государства в сфере германского влияния висит на волоске, и наступает решающий момент, который определит дальнейший путь Рейха инков."
 peru.67.a:0 "Мы должны объединиться с нашей прародиной"
 peru.67.b:0 "Мы станем колонией"
 peru.26:0 "Восстановительная революция"
 peru.26.t:0 "Восстановительная революция"
 peru.26.d:0 "Нынешний президент [PRU.GetLeader] позволил красной апристской чуме проникнуть в правительство, подорвав ценности перуанской семьи и прежнюю экономическую стабильность. Вооружённым силам пора действовать, прежде чем апристы нанесут первый удар."
 peru.26.a:0 "Да здравствует Перу!"
 peru.49:0 "Республиканцы хотят устроить переворот"
 peru.49.t:0 "Республиканцы хотят устроить переворот"
 peru.49.d:0 "Учреждение монархии в стране вызвало возмущение республиканцев и апристских ополченцев. Они объединились в «Армию восстановления» и намерены свергнуть правительство [PRU.GetLeader]. Нашим последним рубежом обороны станет город Арекипа."
 peru.49.a:0 "Мы их сокрушим."
 peru.50:0 "Республиканцы хотят устроить переворот"
 peru.50.t:0 "Республиканцы хотят устроить переворот"
 peru.50.d:0 "Учреждение монархии в стране вызвало возмущение республиканцев и апристских ополченцев. Они объединились в «Армию восстановления» и намерены свергнуть правительство [PRU.GetLeader]. Нашим последним рубежом обороны станет город Лима."
 peru.50.a:0 "Мы их сокрушим."
 peru.51:0 "Республиканцы хотят устроить переворот"
 peru.51.t:0 "Республиканцы хотят устроить переворот"
 peru.51.d:0 "Учреждение монархии в стране вызвало возмущение республиканцев и апристских ополченцев. Они объединились в «Армию восстановления» и намерены свергнуть правительство [PRU.GetLeader]. Нашим последним рубежом обороны станет город Лима."
 peru.51.a:0 "Мы их сокрушим."
 peru.52:0 "Наследие Карла Лампа"
 peru.52.t:0 "Наследие Карла Лампа"
 peru.52.d:0 "Карл Ламп прибыл в Перу в 1867 году и поселился в округе Паукартамбо, расположенном в Куско. После его появления коренные жители общины приняли его за божество и провозгласили Виракочей. Он жил среди местного населения и трудился вместе с ним. Коренные народы нынешней Империи инков по-прежнему ожидают возвращения бога «Инкари», и отправка германского принца может вновь пробудить эти чувства среди народа."
 peru.52.a:0 "Мы отправим Карла Франца"
 peru.52.b:0 "Карл Ламп был безумцем"
 peru.53:0 "Карл Франц прибывает в Перу"
 peru.53.t:0 "Карл Франц прибывает в Перу"
 peru.53.d:0 "Германский принц Карл Франц недавно прибыл в перуанский порт Кальяо, где его тепло встретила делегация правительства инков. Его появление в Лиме вызвало огромную радость и воодушевление, поскольку его считали важной фигурой. После восторженного приёма в столице Карл Франц отправился в путешествие по величественным горам Куско, любуясь захватывающими пейзажами Перуанских Анд."
 peru.53.a:0 "Великий визит из великой страны"
 peru.54:0 "Возвращение Инкари"
 peru.54.t:0 "Возвращение Инкари"
 peru.54.d:0 "Во время визита в Перуанские Анды местные кечуа воспринимают принца Карла Франца как воплощение Инкари — древнего инкского божества, которое, согласно преданию, вернётся, когда истинная Империя инков будет больше всего нуждаться в восстановлении. В сопровождении переводчика, помогающего общаться с коренными жителями, германский принц Карл Франц постепенно изучает язык кечуа. Его стремление говорить с местными людьми и сблизиться с ними приводит к тому, что всё больше коренных жителей присоединяются к его движению."
 peru.54.a:0 "Он не представляет угрозы власти инков"
 peru.54.b:0 "Карл Франц представляет огромную опасность — его необходимо изгнать"
 peru.55:0 "Новый Инка"
 peru.55.t:0 "Новый Инка"
 peru.55.d:0 "К ополчению под командованием германского принца Карла Франца присоединяются многочисленные кечуа и креолы из Лимы. Благодаря контрабанде оружия, организованной Германской империей, им удаётся вооружиться. В результате правительство инков оказывается легко подавлено сразу на нескольких фронтах по всей территории Империи инков."
 peru.55.a:0 "Мы возродим Империю инков"
 peru.22:0 "[PRU.GetNameDefCap] поддерживает приход [ROOT.GetFascistParty] к власти"
 peru.22.t:0 "[PRU.GetNameDefCap] вооружает [ROOT.GetFascistParty] для захвата власти"
 peru.22.d:0 "[PRU.GetNameDefCap] вместе со своим фашистским союзником [ROOT.GetFascistParty] готовят переворот против нашего правительства. Мы не должны позволить фашистским ордам приблизиться к Латинской Америке. Подготовимся к борьбе с антипатриотами, которые намерены принести сюда тот же террор, жертвой которого Перу стало при диктаторе [PRU.GetFascistLeader]. Пора взяться за оружие и положить конец фашистскому восстанию."
 peru.22.a:0 "Мы должны принять меры, чтобы не допустить фашистского правительства."
 peru.20:0 "Перу стремится усилить влияние в Латинской Америке"
 peru.20.t:0 "Перу стремится усилить влияние в Латинской Америке"
 peru.20.d:0 "По нашим данным, [PRU.getAdjective]ие агенты проникли в несколько стран Южной Америки. [PRU.getAdjective]ий диктатор [PRU.GetLeader] хочет распространить свою идеологию террора по всему полушарию. Мы не позволим антидемократическим идеологиям захватить Латинскую Америку."
 peru.20.a:0 "Ввести экономические санкции"
 peru.20.b:0 "Перуанцы имеют на это право"
 peru.21:0 "Соединённые Штаты только что ввели против нас экономические санкции"
 peru.21.t:0 "Соединённые Штаты ввели против нас экономические санкции"
 peru.21.d:0 "Соединённые Штаты только что ввели против нас экономические санкции. Это нанесёт денежный ущерб многим жителям [PRU.getAdjective], но мы не сдадимся: происходящее доказывает, что действия нашего лидера [PRU.GetLeader] подрывают боевой дух североамериканцев."
 peru.21.a:0 "Мы продолжим нашу работу"
 r56.war_and_peace.2.t:0 "[ECU.GetNameDefCap] предлагает нам мир"
 r56.war_and_peace.2.desc:0 "После наших недавних успехов [ECU.GetNameDefCap] предложил мирное соглашение, по которому спорная приграничная область переходит к нам. Что мы ответим?"
 r56.war_and_peace.2.a:0 "Мы согласны"
 r56.war_and_peace.2.b:0 "Нет, их нужно наказать ещё сильнее"
 peru.56:0 "Верность кечуа"
 peru.56.t:0 "Верность кечуа"
 peru.56.d:0 "На бескрайних землях Анд наследие предков кечуа сохранялось на протяжении веков, глубоко повлияв на перуанскую идентичность. Однако в бурные дни войны и борьбы за свободу кечуа оставались в тени, не имея должного представительства ни в рядах армии, ни во флоте."
 peru.56.a.2:0 "Кечуа будут служить в армии"
 peru.56.a.1:0 "Возможно, на море они проявят себя лучше"
 peru.57:0 "Поиск новых союзников"
 peru.57.t:0 "Поиск новых союзников"
 peru.57.d:0 "На фоне возрождения Империи инков вопрос о союзах становится решающим для будущего страны. Среди политических сил особенно выделяются националисты и апристы."
 peru.57.a.1:0 "Апристы — истинные представители народа"
 peru.57.a.2:0 "Националисты станут лучшим выбором"
 peru.58:0 "Луис Флорес встречается с лидерами монархистов"
 peru.58.t:0 "Луис Флорес встречается с лидерами монархистов"
 peru.58.d:0 "На этой важнейшей встрече перуанский националистический лидер Луис Флорес садится за стол переговоров с лидерами монархистов в поисках стратегического союза. Принятые здесь решения отзовутся эхом в истории возрождения будущей Империи. Примем ли мы предложения Флореса, чтобы укрепить наше движение, или отвергнем его помощь и выберем иной путь?"
 peru.58.a.1:0 "Этот союз укрепит наше движение"
 peru.58.a.2:0 "Лучше всего отвергнуть предложения Флореса"
 peru.59:0 "Наши перуанские корни"
 peru.59.t:0 "Наши перуанские корни"
 peru.59.d:0 "В момент размышлений о национальной идентичности перед нами открываются три подхода к пониманию перуанских корней. Каждый из них предлагает собственный взгляд на то, что значит быть перуанцем в эпоху возрождения перуанизма. Как мы определим свою идентичность в этот судьбоносный момент?"
 peru.59.a.1:0 "Наши корни уходят в Империю инков"
 peru.59.a.2:0 "Испанизм объединяет нашу нацию"
 peru.59.a.3:0 "Перуанство — это новая культура"
 peru.60:0 "Все они служат армии"
 peru.60.t:0 "Все они служат армии"
 peru.60.d:0 "Призыв к общенациональной мобилизации предельно ясен: каждый должен служить армии. Остаётся решить, как будет проведена эта мобилизация и кто станет главной силой совместных усилий."
 peru.60.a.1:0 "Народ служит армии"
 peru.61:0 "Изменение Конституции Перу"
 peru.61.t:0 "Изменение Конституции Перу"
 peru.61.d:0 "В этот решающий момент возникает необходимость изменить Конституцию Перу. Перед нами три разных подхода, каждый из которых отражает собственное видение политического будущего страны. Какую структуру правительства мы создадим в этот исторический момент?"
 peru.61.a.1:0 "Возродить идеалы Санчеса Серро"
 peru.61.a.2:0 "Предоставить больше власти лимской олигархии"
 peru.61.a.3:0 "Мы проявим великодушие ко всем"
