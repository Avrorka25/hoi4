 PRU_reforms_in_the_constitution_desc:0 "Прежняя конституция, составленная Луисом Санчесом Серро, более не отвечает требованиям времени. Она слишком слаба, поощряет народные восстания и радикализм экстремистских идеологий, а также передаёт ресурсы страны иностранным державам. Необходимо изменить ряд статей, чтобы расширить полномочия как народа, так и государственных институтов, а также вернуть контроль над природными богатствами."
