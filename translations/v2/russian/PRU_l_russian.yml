 PRU_internal_factions:0 "Внутренние фракции"
 PRU_internal_factions_desc:0 "По мере того как раскрывается многообразная картина перуанского общества, формируются внутренние фракции, каждая из которых примыкает к одному из центров силы. Олигархи, апристас, националисты и кечуа, обладая собственными интересами и представлениями о будущем, присягают на верность армии, флоту или центральному правительству. Хрупкий баланс влияния между этими фракциями необходимо тщательно поддерживать, чтобы обеспечить стабильность и единство нашей страны."
