 PRU_lobitos_oilfields:0 "Нефтяные месторождения «Лобитос Лтд.»"
 PRU_edegel:0 "Эдегель Перу"
 PRU_sima_company:0 "Промышленные службы военно-морского флота"
 PRU_fauccet:0 "«Фосетт Перу»"
 PRU_Famesac:0 "Фабрика оружия и боеприпасов армии S.A.C."
 PRU_the_problem_of_the_quechuas:0 "Проблема кечуа"
 PRU_the_problem_of_the_quechuas_desc:0 "Необходимо решить особые проблемы народа кечуа, без которого невозможно возрождение инков. Этот фокус направлен на поиск решений, соответствующих нашему представлению о едином Перу, где кечуа играют важнейшую роль в становлении возрождённой империи."
 PRU_the_owners_of_the_mountains:0 "Хозяева гор"
 PRU_the_owners_of_the_mountains_desc:0 "Дадим силу и единство народу кечуа — истинным хранителям наших гор. Мы заложим основу Империи инков, которая восстанет из самого сердца Анд, воплощая силу и стойкость."
 PRU_the_rebel_inca:0 "Мятежный инка"
 PRU_the_rebel_inca_desc:0 "Пробудим дух Мятежного инки и направим стойкость нашего наследия. Мы зажжём пламя, которое преодолеет время и поведёт Перу к будущему, созданному силой древнего наследия."
 PRU_negotiate_with_communal_chiefs:0 "Переговоры с общинными вождями"
 PRU_negotiate_with_communal_chiefs_desc:0 "Начнём дипломатические переговоры с общинными вождями, укрепляя сотрудничество ради единого Перу. Преодолеем разногласия и упрочим связи, чтобы возрождение инков опиралось на единство и общие устремления."
 PRU_runan_caycu:0 "Рунан Кайку"
 PRU_runan_caycu_desc:0 "Вступим на путь Рунан Кайку — расширения жизни, согласовав наши амбиции с духом Империи инков. Используем открывающиеся возможности и создадим судьбу, достойную величия нашей империи."
 PRU_appoint_new_quechua_soldiers:0 "Назначить новых генералов-кечуа"
 PRU_appoint_new_quechua_soldiers_desc:0 "Возвысим представителей народа кечуа до командных должностей в армии. Назначая новых генералов-кечуа, мы укрепляем вооружённые силы и чтим гордое наследие нации, прокладывая путь к победе вместе с лидерами, воплощающими дух Империи инков."
 PRU_the_inca_congress:0 "Конгресс инков"
 PRU_the_inca_congress_desc:0 "Учредим Конгресс инков — площадку для единства и сотрудничества. Собравшись под его знаменем, мы направим общую силу нашей империи к будущему, исполненному величия."
 PRU_superiority_of_the_copper_race:0 "Превосходство медной гонки"
 PRU_superiority_of_the_copper_race_desc:0 "Пропагандировать идеалы превосходства медной расы, внушая гордость и единство нашему народу. Наша раса хозяев подпитывает возрождение империи инков, охватывая уникальные сильные стороны, которые определяют нашу нацию и прокладывают путь к величию."
 PRU_secure_the_future_of_the_nation:0 "Обеспечить будущее нации"
 PRU_secure_the_future_of_the_nation_desc:0 "Перед лицом угрозы испанского колониализма мы должны принять меры, гарантирующие сохранение традиций, формирующих нашу нацию. Мы не просто выживем, но добьёмся процветания, вернув культурное наследие инков!"
 PRU_illapa_the_thunder_of_the_andes:0 "Ильяпа — Гром Анд"
 PRU_illapa_the_thunder_of_the_andes_desc:0 "Призовём дух Ильяпы, Грома Анд, чтобы пробудить нашу нацию. Сила древней символики инков разожжёт пыл, который поведёт государство инков к будущему, где громовые отголоски нашего наследия будут звучать с силой и славой."
 PRU_the_true_owners_of_america:0 "Истинные хозяева Америки"
 PRU_the_true_owners_of_america_desc:0 "Провозгласим кечуа истинными хранителями наследия Америки. Мы вернём себе законное место и защитим богатство нашей культуры от внешнего влияния."
 PRU_liberate_the_indigenous_people_of_america:0 "Освободить коренные народы Америки"
 PRU_liberate_the_indigenous_people_of_america_desc:0 "Возглавим освобождение коренных народов всей Америки. Это воплощает нашу приверженность единству, справедливости и суверенитету, пока мы укрепляем братские общины ради по-настоящему свободного континента."
 native_american_peoples_alliance:0 "Альянс коренных народов Америки"
 native_axis:0 "Ось коренных народов"
 native_alliance:0 "Союз коренных народов"
 PRU_red_pachamama:0 "Красная Пачамама"
 PRU_red_pachamama_desc:0 "Примем идею Красной Пачамамы, вплетая коммунистические идеалы в наследие инков. Мы объединим народ во имя общего процветания и коллективного благополучия на пути к подлинно равноправной Империи инков."
 PRU_Collectivize_the_land:0 "Коллективизировать землю"
 PRU_Collectivize_the_land_desc:0 "Начнём земельную революцию и перераспределим собственность ради общего блага. Богатства нашей священной земли должны справедливо принадлежать народу, создающему единое коммунистическое общество инков."
 PRU_revolutionary_andes:0 "Революционные Анды"
 PRU_revolutionary_andes_desc:0 "Разожжём пламя Андской революции и объединим народ в борьбе за коммунизм. Равенство и солидарность сформируют новое будущее инков."
 PRU_unified_by_will:0 "Едины волей"
 PRU_unified_by_will_desc:0 "Наши антиимпериалистические усилия уже объединили америндские народы, но этого недостаточно. Чтобы веками отражать европейские вторжения, мы должны создать единое государство всех наших народов, объединённых волей жить без европейского господства."
 PRU_unified_in_spirit:0 "Едины духом"
 PRU_unified_in_spirit_desc:0 "Нас объединяет общая цель, поэтому мы способны действовать как единый механизм. Не сливая государства воедино, мы всё же должны объединить армии и усилить координацию. Народы Америки едины духом и всегда будут стоять плечом к плечу!"
 PRU_incaism_idea:0 "Инкаизм"
 PRU_incaism_idea_1:0 "Инкаизм"
 PRU_incaism_idea_2:0 "Неоинкская гордость"
 PRU_a_new_pride:0 "Новая национальная гордость"
 PRU_poor_republic:0 "Нестабильная республика"
 PRU_weak_republic:0 "Слабая республика"
 PRU_weak_republic_1:0 "Слабая республика"
 PRU_weak_republic_2:0 "Слабая республика"
 PRU_conservative_republic:0 "Консервативная республика"
 PRU_socialist_republic:0 "Социалистическая республика"
 PRU_communist_republic:0 "Коммунистическая республика"
 PRU_hit_venezuela:0 "Покончить с боливарианской мечтой"
 PRU_hit_venezuela_desc:0 "Стремление объединить боливарианские народы в одном государстве за счёт наших земель, включая Лорето, представляет серьёзную угрозу всему [ROOT.getAdjective] народу. Ради национальной безопасности боливарианскую мечту необходимо уничтожить."
 PRU_hit_ecuador:0 "Обезопасить Анды"
 PRU_hit_ecuador_desc:0 "Для полной победы лидер [ROOT.GetLeader] должен окончательно обезопасить Анды. Республика [ECU.GetNameDefCap] остаётся угрозой, которая будет постоянно терзать нашу страну, если мы её не устраним."
 PRU_look_to_the_past:0 "Отложить выборы"
 PRU_look_to_the_past_desc:0 "Государство не смогло решить социальные и экономические проблемы, погрузившие Перу в глубокий кризис. Лучшим решением будет уход Бенавидеса и поиск иной формы правления."
 PRU_delay_elections:0 "Что представляет собой наша страна?"
 PRU_delay_elections_desc:0 "Голоса нации задают главные вопросы: что определяет Перу — земля, история или народ? Пока лидеры спорят, а население ждёт, выборы откладываются ради общего ответа. Этот период самоосмысления может определить будущее страны и её место в мире."
 PRU_invite_carlos:0 "Наследники вице-королевства"
 PRU_invite_carlos_desc:0 "Мы должны вспомнить испанское прошлое — время наибольшего процветания под властью короля. Республика разрушила традиционные ценности Перу, и мы должны отказаться от её наследия. Да здравствует король!"
 PRU_appoint_a_peruvian_monarch:0 "Покончить с коррумпированной республикой"
 PRU_appoint_a_peruvian_monarch_desc:0 "Пришло время смести остатки коррумпированной республики, долго терзавшей нашу нацию. Перуанский монарх возвестит новую эпоху правления, исцелит расколотую политическую систему и объединит народ под знаменем надежды и процветания."
 PRU_crown_an_inca:0 "Короновать инку"
 PRU_crown_an_inca_desc:0 "Политик Хосе Бустаманте-и-Риверо является потомком великого инки Уайна Капака. В память о нашем инкском прошлом мы должны короновать его как Уайна Капака II."
 PRU_restore_the_viceroyalty_system:0 "Восстановить систему вице-королевства"
 PRU_restore_the_viceroyalty_system_desc:0 "Старая система вице-королевства была уничтожена республиканскими идеями, принёсшими Перу разорение и отсталость. Король обязан восстановить основы нашей империи."
 PRU_royal_haciendas:0 "Королевские асьенды"
 PRU_royal_haciendas_desc:0 "Система королевских асьенд возьмёт под контроль сбор налогов. Это необходимо, поскольку прежняя республиканская система была пронизана коррупцией и неформальностью."
 PRU_labour_reforms:0 "Трудовая реформа"
 PRU_labour_reforms_desc:0 "Перуанская трудовая система находится в плачевном состоянии и с самого начала управлялась устаревшими неформальными порядками, полными коррупции. Новые трудовые реформы изменят положение."
 PRU_create_orejones_battalions:0 "Создать батальоны орехонов"
 PRU_create_orejones_battalions_desc:0 "В прошлом орехоны были элитными войсками Империи инков — людьми, готовыми умереть за Сапа Инку и отдать всё на поле боя."
 PRU_recreate_the_Inca_farming_system:0 "Воссоздать земледельческую систему инков"
 PRU_recreate_the_Inca_farming_system_desc:0 "Террасное земледелие было передовым изобретением инков и позволяло обрабатывать крутые склоны Анд, используя каждый клочок земли. Этот метод покончит с голодом среди беднейших жителей Перу."
 PRU_the_Quechuas_into_the_army:0 "Включить кечуа в армию"
 PRU_the_Quechuas_into_the_army_desc:0 "В прошлом коренные кечуа были лишены прав и обращены в слуг олигархов. Теперь пора привлечь их к промышленности и армии страны, ведь они способны значительно усилить наше движение."
 PRU_form_the_royal_guard_of_Peru:0 "Создать Королевскую гвардию Перу"
 PRU_form_the_royal_guard_of_Peru_desc:0 "Рота алебардистов Королевской пехотной гвардии вице-короля была создана Антонио де Мендосой в 1551 году. Она охраняла вице-короля, поддерживала общественный порядок и боролась с бандитами и беглыми рабами."
 PRU_militarize_the_homeland:0 "Милитаризовать родину"
 PRU_militarize_the_homeland_desc:0 "У нашей страны недостаточно оружия для защиты от многочисленных врагов. Необходимо перевооружить войска и призвать на войну всех [ROOT.getAdjective] граждан."
 PRU_inca_heavy_industry:0 "Тяжёлая промышленность инков"
 PRU_inca_heavy_industry_desc:0 "Каждый гражданин империи обязан поддержать индустриализацию небольшим денежным взносом. Эти средства позволят создать тяжёлую промышленность, необходимую для развития."
 PRU_restore_the_kanchas:0 "Восстановить канчи"
 PRU_restore_the_kanchas_desc:0 "«Канча» — древняя общественная система инков, объединявшая одну или несколько семей для совместной обработки земли. Она напоминала коллективизацию, сохраняя такие повинности, как горная мита и обязательный труд минка."
 PRU_knights_of_the_new_world:0 "Рыцари Нового Света"
 PRU_knights_of_the_new_world_desc:0 "В нашей памяти живёт наследие конкистадоров — людей, основавших эту великую империю и сделавших её одной из богатейших в регионе."
 PRU_nationalize_the_industry:0 "Национализировать промышленность"
 PRU_nationalize_the_industry_desc:0 "[PRU.GetLeader] требует, чтобы [ROOT.getAdjective] тяжёлая промышленность принадлежала [ROOT.getAdjective] государству. Нельзя допускать, чтобы богатства недр и труд всего [ROOT.getAdjective] народа служили чужой выгоде."
 PRU_give_arms_to_the_people:0 "Антиатеистические бригады"
 PRU_give_arms_to_the_people_desc:0 "Вооружённое население Перу сможет отбить орды врагов недавно созданной империи."
 PRU_call_british_sailors:0 "Нанять специалистов по кораблестроению"
 PRU_call_british_sailors_desc:0 "Наши военно-морские возможности и технологии крайне ограничены. Необходимо убедить иностранную морскую державу помочь нам создать собственный мощный флот."
 PRU_adquire_american_industry:0 "Пригласить американскую промышленность"
 PRU_adquire_american_industry_desc:0 "[ROOT.GetLeader] ищет новый отечественный и иностранный капитал для укрепления нашей промышленности."
 PRU_viva_el_rey:0 "Да здравствует король"
 PRU_viva_el_rey_desc:0 "Король Перу принесёт военные и социальные преобразования, необходимые для модернизации отсталого андского общества. Пора расширить империю за пределы границ и вернуть славу Великого Перу."
 PRU_secure_the_coast:0 "Обезопасить побережье"
 PRU_secure_the_coast_desc:0 "Наше побережье беззащитно из-за слабости флота. [ROOT.GetLeader] разработал проект Тихоокеанского вала, который должен предотвратить высадки в наших главных городах."
 PRU_restore_the_borders_of_the_empire:0 "Восстановить границы империи"
 PRU_restore_the_borders_of_the_empire_desc:0 "Древняя империя четырёх частей охватывала огромные земли Южной Америки: Кольясуйу, Антисуйу, Кунтисуйу и Чинчасуйу."
 PRU_establish_the_mitimaes:0 "Учредить институт митимаев"
 PRU_establish_the_mitimaes_desc:0 "Древняя инкская практика культурного разобщения с помощью переселенцев, называемых «митимаями», позволяла лишать общины влияния и идентичности: их жителей расселяли по другим землям, а родные территории заселяли новыми поселенцами государства."
 PRU_total_victory:0 "Полная победа"
 PRU_total_victory_desc:0 "Наши недавние победы на всех фронтах и восстановление первоначальных границ значительно повысили популярность правительства [ROOT.GetLeader]."
 PRU_secure_the_andes:0 "Обезопасить Анды"
 PRU_expel_europeans_from_south_america:0 "Изгнать европейцев из Южной Америки"
 PRU_expel_europeans_from_south_america_desc:0 "Продолжающееся заморское присутствие европейских морских держав на нашем континенте неприемлемо. Как мы уничтожили присутствие Испании в Западном полушарии, так и все прочие державы будут немедленно изгнаны!"
 PRU_reclaim_spain:0 "Вернуть Испанию"
 PRU_reclaim_spain_desc:0 "Испанское происхождение короля [ROOT.GetLeader] даёт ему в глазах перуанцев право претендовать на испанский престол и вновь объединить государства Испанской Америки с испанскими территориями, как в прошлом."
 PRU_secure_brazil:0 "Обезопасить Бразилию"
 PRU_secure_brazil_desc:0 "Мы получили сведения, что [BRA.GetLeader] готовит против нас заговор. Долг [ROOT.GetLeader] — принять необходимые оборонительные меры и, по возможности, нанести удар по врагам до того, как они начнут атаку."
 PRU_reclaim_portugal:0 "Вернуть Португалию"
 PRU_reclaim_portugal_desc:0 "Историческое пребывание Португалии в составе Испании даёт нашему королю право претендовать на португальский престол, чтобы присоединить страну к нашей могущественной империи."
 PRU_reclaim_chile:0 "Вернуть Чили"
 PRU_reclaim_chile_desc:0 "После Тихоокеанской войны наши армия и флот были полностью разгромлены. Новые поколения выросли в атмосфере национализма и жажды мести, подпитываемой лидером [ROOT.GetLeader]. Скоро настанет час возмездия и возвращения утраченных территорий."
 PRU_huayna_capac_heritage:0 "Наследие Уайна Капака"
 PRU_huayna_capac_heritage_desc:0 "Родина нашего почти легендарного правителя находится в руках тех, кто не имеет на неё никаких прав! Пора вернуть наши законные земли в Эквадоре!"
 PRU_integrate_the_northern_realm:0 "Интегрировать Северное царство"
 PRU_integrate_the_northern_realm_desc:0 "Теперь, когда наш контроль над территориями Эквадора полностью установлен, мы сможем включить эти земли в состав наших владений."
 PRU_retake_antofagasta:0 "Вернуть Антофагасту"
 PRU_retake_antofagasta_desc:0 "Обеспечение безопасности побережья — одна из наших главных целей на пути к возвращению территорий, утраченных из-за колонизаторов на юге."
 PRU_unite_with_diaguita_and_toconote:0 "Объединиться с диагита и токоноте"
 PRU_unite_with_diaguita_and_toconote_desc:0 "Коренные народы региона Тукуман страдают под властью Аргентины, и мы должны сделать всё возможное, чтобы обеспечить их безопасность в эти опасные времена. Любыми необходимыми средствами!"
 PRU_secure_the_southern_Andes:0 "Обезопасить Южные Анды"
 RU_secure_the_southern_Andes_desc:0 "Южная часть Анд, включающая главным образом Анды Боливии, Чили и Аргентины, должна вернуться к своему законному владельцу — Империи инков."
 PRU_reclaim_venezuela:0 "Вернуть Венесуэлу"
 PRU_reclaim_venezuela_desc:0 "Несмотря на отсутствие общей истории, стремление объединить боливарианские народы в одном государстве за счёт наших территорий, таких как регион Лорето, представляет серьёзную угрозу всему [ROOT.getAdjective] народу. Ради национальной безопасности мы должны искоренить боливарианскую мечту."
 PRU_reclaim_ecuador:0 "Вернуть Эквадор"
 PRU_reclaim_ecuador_desc:0 "Чтобы добиться полной победы, [ROOT.GetLeader] должен окончательно обезопасить Анды. Республика [ECU.GetNameDefCap] по-прежнему остаётся угрозой, которая будет постоянно жалить нашу страну, если мы её не устраним."
 PRU_reclaim_colombia:0 "Вернуть Колумбию"
 PRU_reclaim_colombia_desc:0 "После короткой войны за Летисию с [COL.GetNameDefCap] и передачи Амазонской трапеции из-за антипатриотизма Оскара Бенавидеса настало время вернуть наши земли под командованием [ROOT.GetLeader], который приведёт Перу к великой победе и восстановит первоначальные границы."
 PRU_secure_the_north:0 "Обезопасить север"
 PRU_secure_the_north_desc:0 "Территории бывшей Великой Колумбии можно объединить в одну провинцию нашей империи, тем самым подавив сепаратизм населения этих земель."
 PRU_reclaim_paraguay:0 "Вернуть Парагвай"
 PRU_reclaim_paraguay_desc:0 "Мы должны присоединить последние территории к нашей могущественной империи. Ни одна страна Южной Америки не способна противостоять нашей огромной мощи."
 PRU_reclaim_uruguay:0 "Вернуть Уругвай"
 PRU_reclaim_uruguay_desc:0 "Провинция Рио-де-ла-Плата требует присоединения Уругвая к нашей империи."
 PRU_create_apra:0 "Укрепить апризм"
 PRU_create_apra_desc:0 "Великий союз всех народов Южной Америки создаст новый социалистический блок, который действительно будет защищать права каждого народа. Учение Виктора Рауля Айя де ла Торре продолжает жить в движении, зародившемся в Мексике и распространившемся сегодня по всей Америке."
 PRU_revive_the_bolivarian_dream:0 "Возродить боливарианскую мечту"
 PRU_revive_the_bolivarian_Dream_desc:0 "Боливарианская идея поможет успокоить население завоёванных северных территорий, ведь благодаря нашему завоеванию земли Великой Колумбии вновь объединены."
 PRU_liberate_brazil:0 "Освободить Бразилию"
 PRU_liberate_brazil_desc:0 "Диктатура [BRA.GetLeader] зашла слишком далеко в преступлениях против собственного народа. Население [BRA.GetNameDefCap] должно восстать при поддержке нашей армии."
 PRU_liberate_cub:0 "Освободить Кубу"
 PRU_liberate_cub_desc:0 "Карибский остров долгие годы служил заморской военной базой Соединённых Штатов. Наш долг — изгнать с острова великого капиталистического демона и установить народное правительство, представляющее кубинцев."
 PRU_intervention_in_brazil:0 "Интервенция в Бразилию"
 PRU_intervention_in_brazil_desc:0 "[BRA.GetLeader] ведёт Бразилию к гибели и в руки наших ближайших врагов. Как региональная держава мы обязаны навязать свою волю и обезопасить границы путём военной интервенции. В Южной Америке может быть лишь один колосс."
 PRU_Create_the_Gran_Colombian_provinces:0 "Создать провинции Великой Колумбии"
 PRU_Create_the_Gran_Colombian_provinces_desc:0 "Боливарианская идея поможет успокоить население завоёванных северных территорий, ведь благодаря нашему завоеванию земли Великой Колумбии вновь объединены."
 PRU_secure_plata_states:0 "Обезопасить государства Ла-Платы"
 PRU_secure_plata_states_desc:0 "Земли бывшего вице-королевства Рио-де-ла-Плата следует включить в империю как провинции, чтобы удерживать их население под контролем. Эти территории способны значительно усилить военную мощь Великого Перу."
 PRU_Draw_our_southern_borders:0 "Провести наши южные границы"
 PRU_Draw_our_southern_borders_desc:0 "Для восстановления древних рубежей нашей великой империи необходимы южные территории — границы древней Империи инков и вице-королевства Перу. Могущественная империя навязывает свою волю. Да здравствует Перу!"
 PRU_reclaim_bolivia:0 "Вернуть Боливию"
 PRU_reclaim_bolivia_desc:0 "Предательство, совершённое [BOL.GetNameDefCap] против [ROOT.GetNameDefCap], нельзя забыть. Мы должны самостоятельно объединить все народы кечуа под руководством [ROOT.GetLeader]."
 PRU_integrate_the_Quechuas_into_the_army:0 "Привлечь кечуа в армию"
 PRU_integrate_the_Quechuas_into_the_army_desc:0 "В прошлом коренные кечуа были лишены прав и сведены к положению слуг олигархов. Настало время включить их в промышленную силу страны, ведь они способны значительно укрепить наше политическое движение."
 PRU_ask_for_a_loan_to_germany:0 "Попросите кредит из Германии"
 PRU_ask_for_a_loan_to_germany_desc:0 "В период экономической неопределенности Перу решило обратиться к Германии в надежде получить существенный кредит. Этот кредит будет иметь решающее значение для финансирования различных проектов развития и укрепления экономики Перу. Переговоры с правительством Германии продолжаются, и результат может существенно повлиять на финансовое будущее страны."
 PRU_new_world_army:0 "Армия Нового Света"
 PRU_new_world_army_desc:0 "Примем власть германского Сапа Инки — дальновидного правителя Инкской империи. Под его императорским руководством Имперские силы инков станут символом нашей новой силы и единства. Вместе мы преобразим Новый Свет и воплотим величие нашего имперского замысла."
 PRU_call_hans:0 "Призвать германских генералов"
 PRU_call_hans_desc:0 "Призовём Ганса Кундта и Рюдигера — выдающихся стратегов, способных укрепить нашу военную мощь. Они усилят Имперские силы инков и помогут с блестящей тактической точностью воплотить наш имперский замысел в Новом Свете."
 PRU_continue_leguias_plan:0 "Продолжение плана Легии"
 PRU_continue_leguias_plan_desc:0 "Наследие экономического плана президента Аугусто Легии все еще нависает над Перу. Продолжение видения Легии означает сохранение фокуса на развитии инфраструктуры, индустриализации и экономическом росте. Тем самым Перу надеется обеспечить своему народу стабильное и процветающее будущее, но впереди могут быть проблемы и политическая оппозиция."
 PRU_imitate_the_Soviet_model:0 "Подражать советской модели"
 PRU_imitate_the_Soviet_model_desc:0 "Перу решило рассматривать Советский Союз в качестве модели для своего экономического развития. Подражать советскому подходу означает уделять особое внимание государственной собственности на ключевые отрасли и централизованному планированию. Цель состоит в том, чтобы быстро индустриализироваться и достичь самодостаточности, но этот путь может привести к идеологическим конфликтам и международной напряженности."
 PRU_stable_monetary_policy:0 "Политика экономического восстановления"
 PRU_stable_monetary_policy_desc:0 "Осуществление стабильной денежно-кредитной политики имеет важное значение для обеспечения финансовой безопасности и экономической стабильности Перу. Поддерживая последовательный подход к контролю инфляции, управлению денежной массой и установлению процентных ставок, Перу стремится привлекать инвестиции, способствовать экономическому росту и защищать благосостояние своих граждан."
 PRU_the_pan-american_highway:0 "Панамериканское шоссе"
 PRU_the_pan-american_highway_desc:0 "Амбициозный проект по строительству Панамериканского шоссе через Перу продолжается. Этот трансконтинентальный маршрут свяжет Перу со своими соседями и облегчит торговлю и транспортировку. Ожидается, что строительные усилия будут масштабным предприятием, включающим трудовые, инженерные и финансовые ресурсы в больших масштабах."
 PRU_forced_industrialization:0 "Принудительная индустриализация"
 PRU_forced_industrialization_desc:0 "Перу проводит политику принудительной индустриализации с целью быстрой трансформации своей экономики. Такой подход предполагает государственное вмешательство в экономику, стимулы для отечественных отраслей и жесткое регулирование. Хотя это может привести к быстрому промышленному росту, оно также может столкнуться с сопротивлением со стороны традиционных секторов и может потребовать значительных ресурсов."
 PRU_expanded_industrial_region:0 "Расширенный промышленный регион"
 PRU_expanded_industrial_region_desc:0 "Перу имеет амбициозные планы по расширению своего промышленного региона, открывая новые районы для заводов и производства. Это расширение предназначено для размещения растущих отраслей промышленности, создания рабочих мест и стимулирования экономического развития. Однако для достижения своих целей потребуется тщательное планирование, инвестиции в инфраструктуру и управление."
 PRU_our_natural_resources:0 "Природные ресурсы"
 PRU_our_natural_resources_desc:0 "Богатые природные ресурсы Перу, от полезных ископаемых до сельскохозяйственной продукции, находятся в центре его экономической стратегии. Разработка и использование этих ресурсов может обеспечить ценный доход и способствовать экономическому росту. Тем не менее, необходимо будет учитывать надлежащее управление, экологические проблемы и колебания на международном рынке."
 PRU_the_peruvian_industry:0 "Перуанская промышленность"
 PRU_the_peruvian_industry_desc:0 "Рост перуанского промышленного сектора является приоритетом для правительства. Эта стратегия направлена на снижение зависимости от иностранного импорта, создание рабочих мест и содействие самодостаточной экономике. Поддержка местных отраслей промышленности, содействие исследованиям и разработкам, а также обеспечение стандартов качества являются частью этого видения."
 PRU_create_antamina:0 "Создать Antamina"
 PRU_create_antamina_desc:0 "Создание проекта по добыче полезных ископаемых в Антамине представляет собой большой скачок вперед в горнодобывающей промышленности Перу. Это масштабное начинание потребует огромного капитала, технологий и опыта для извлечения ценных ресурсов из земли. Успех Antamina может трансформировать экономику Перу и улучшить ее глобальное положение."
 PRU_the_second_rubber_rush:0 "Вторая резиновая лихорадка"
 PRU_the_second_rubber_rush_desc:0 "Возрождение производства каучука на горизонте в Перу. Следуя по стопам резинового бума начала 20-го века, Перу готовится ко второй резиновой лихорадке. На этот раз цель состоит в том, чтобы эффективно и устойчиво использовать ресурсы каучука, потенциально принося процветание региону."
 PRU_create_the_BCR:0 "Создайте BCR"
 PRU_create_the_BCR_desc:0 "Создание Центрального резервного банка (Central Reserve Bank) является ключевым моментом в финансовой истории Перу. Этот институт будет играть ключевую роль в управлении денежно-кредитной политикой страны, регулировании финансовых рынков и обеспечении финансовой стабильности страны. Его создание является важным шагом на пути модернизации финансового сектора."
 PRU_the_black_gold_of_the_amazon:0 "Черное золото Амазонки"
 PRU_the_black_gold_of_the_amazon_desc:0 "Регион Амазонки обладает огромным потенциалом для добычи нефти, и Перу стремится использовать это «черное золото».Развитие нефтяной промышленности в Амазонии обещает значительные экономические выгоды, но также вызывает обеспокоенность по поводу воздействия на окружающую среду, прав коренных народов и международных интересов. Будущее Amazon может зависеть от этого начинания."
 PRU_Acquire_Japanese_weapons:0 "Приобрести японское оружие"
 PRU_Acquire_Japanese_weapons_desc:0 "Для укрепления вооружённых сил правительство Перу решило изучить возможность закупки японского оружия. Такое стратегическое партнёрство может предоставить армии необходимые средства для защиты национальной безопасности и наших интересов."
 PRU_Promote_immigration:0 "Поощрять иммиграцию"
 PRU_Promote_immigration_desc:0 "Правительство Перу активно рассматривает поощрение иммиграции. Однако выбор националистического лидера определит направление этой политики: привлечь итальянских переселенцев при Альберто Флоресе или продолжить японскую иммиграцию при Элое Урете?"
 PRU_return_of_the_inkari:0 "Возвращение Инкари"
 PRU_return_of_the_inkari_desc:0 "Возвращение Инкари означает долгожданное пришествие мифического правителя инков и символизирует надежду на восстановление и возрождение древней Империи инков. Эта идея воплощает глубокую связь с традициями предков и ожидание исторического обновления."
 PRU_the_new_royal_road:0 "Новая Царская дорога"
 PRU_the_new_royal_road_desc:0 "Современный проект по возрождению и восстановлению исторической сети дорог Империи инков. Он должен воссоздать обширную транспортную систему, некогда соединявшую разные области государства и способствовавшую культурному обмену, торговле и единству. Новая Царская дорога инков почтит наследие цивилизации, облегчит переброску войск и поможет сохранению истории и культуры."
 PRU_the_pact_of_lima:0 "Лимский пакт"
 PRU_the_pact_of_lima_desc:0 "Этот пакт символизирует союз Инкайзеррайха и Германской империи — уникальное сотрудничество двух разных цивилизаций ради культурного обмена, торговли и взаимной поддержки. Возрождая древнюю дорожную сеть инков, обе империи укрепят связь между собой, ускорят экономический рост и углубят взаимопонимание. Союз демонстрирует силу сотрудничества и общего стремления народов к прогрессу."
 PRU_das_inkareich:0 "Дас Инкарейх"
 PRU_das_inkareich_desc:0 "Немецкий перевод выражения «Империя инков». Так называют обширную и влиятельную цивилизацию, процветавшую в Андах Южной Америки до испанского завоевания. «Дас Инкарейх» воплощает богатую историю, культурные достижения и политическое могущество инков, эпоху величия, развитой инфраструктуры и сложного общественного устройства."
 PRU_claim_the_habsburg_territories:0 "Предъявить права на земли Габсбургов"
 PRU_claim_the_habsburg_territories_desc:0 "Величие бывшей империи Габсбургов должно быть восстановлено под перуанским флагом. Мы намерены вернуть исторические территории, некогда принадлежавшие этой династии."
 PRU_claim_the_portuguese_empire:0 "Предъявить права на Португальскую империю"
 PRU_claim_the_portuguese_empire_desc:0 "Португальские владения в Южной Америке открывают уникальную возможность для расширения нашей империи. Пришло время потребовать то, что принадлежит нам по праву."
 PRU_restore_the_colombia_empire:0 "Восстановить Колумбийскую империю"
 PRU_restore_the_colombia_empire_desc:0 "Слава прежней Великой Колумбии должна возродиться. Мы намерены восстановить величие и единство этой братской страны под властью Перу."
 PRU_restore_the_argentina_empire:0 "Восстановить Аргентинскую империю"
 PRU_restore_the_argentina_empire_desc:0 "Аргентина некогда была великой державой Южной Америки. Наш долг — вернуть ей былое величие и создать под нашим руководством Аргентинскую империю."
 PRU_america_imperial:0 "Имперская Америка"
 PRU_america_imperial_desc:0 "Наша судьба — привести Америку в эпоху имперского господства. Расширяя владения и влияние, мы создадим огромную империю, охватывающую весь континент."
 PRU_another_country:0 "Другая страна уже уведомила Соединённые Штаты."
 PRU_people_expecting_us_to_beat_ecuador:0 "Народ сомневается в нашей способности завоевать Эквадор"
 r56_people_expecting_us_to_beat_ecuador:0 "Народ ожидает, что мы победим Эквадор"
 PRU_propagate_fascism_in_latin_america:0 "Продвигать фашизм в Латинской Америке"
 PRU_propagate_fascism_in_latin_america_desc:0 " "
 r56_support_native_leaders_in_bolivia:0 "Поддержать лидеров коренных народов в Боливии"
 r56_raise_the_pro_incas_in_bolivia:0 "Поднять проинкское восстание в Боливии"
 r56_support_nacistas_in_chile:0 "Поддержать нацистов в Чили"
 r56_raise_the_nacistas_in_chile:0 "Поднять нацистское восстание в Чили"
 r56_support_fascist_leaders_in_brasil:0 "Поддержать фашистских лидеров в Бразилии"
 r56_raise_the_fascist_in_brasil:0 "Поднять фашистов в Бразилии"
 r56_support_fascist_leaders_in_argentina:0 "Поддержать фашистских лидеров в Аргентине"
 r56_raise_the_fascist_in_argentina:0 "Поднять фашистов в Аргентине"
 r56_support_the_gomez_party_in_colombia:0 "Поддержать партию Гомеса в Колумбии"
 r56_raise_gomez_in_colombia:0 "Поднять Гомеса в Колумбии"
 r56_train_ideological_agents:0 "Подготовить идеологических агентов"
 PRU_strengthen_the_industry:0 "Привлечь инвестиции из Соединённых Штатов"
 r56_strengthen_ROOT:0 "Укрепить государство [FROM.GetName]"
