l_russian:
 is_circassia_tt:0 "Сформирована §YЧеркесия§!"
 form_circassia_category:0 "Поход за Черкесию"
 form_circassia_category_desc:0 "После битвы при Кбааде, завершившей в 1864 году столетнюю Русско-черкесскую войну, Черкесия была жестоко и кроваво уничтожена. За этим последовал почти век угнетения и тирании, вновь пробудивший черкесскую национальную идею. Разобщённые и разделённые, мы оказались лёгкой добычей для русских... больше этого не будет — заявляем мы, ставя честь выше жизни!"
 KBK_form_circassia:0 "Объявить о возрождении Черкесии"
 KBK_form_circassia_desc:0 "Когда древние земли наших племён находятся в руках нашего правительства, мы можем объявить всему миру о восстановлении суверенитета всей Черкесии."
 r56_circassia.1.t:0 "Восстановление Черкесии"
 r56_circassia.1.desc:0 "Неожиданные новости с Северного Кавказа: бывшая [KBK.GetOldName], после завоевания территорий вплоть до Чёрного моря, провозгласила возрождение павшей страны черкесских племён. Сегодня [KBK.GetLeader] объявил о «начале славной эпохи», поскольку [KBK.GetNameDef] вновь существует как государство.\nМногие представители диаспоры уже строят планы возвращения на землю предков. [KBK.GetAdjective] правительство ожидало этого и полностью готово обеспечить их переселение."
 r56_circassia.1.a:0 "Черкесы живы! Адыгэ Хабзэ живо!"
 r56_circassia.1.b:0 "Возвращение с края гибели."
 r56_circassia.1.c:0 "Этого нельзя терпеть!"
