 ETH_military_reforms_category:0 "Военные реформы"
 ETH_military_reforms_category_desc:0 "Иностранные советники могут помочь нам обучить офицеров, чтобы они освоили современную тактику и создали по-настоящему современную армию."
 ETH_reorganize_staff_of_general_5620:0 "Реорганизовать штаб §YКассы Хайле Дарге§!"
 ETH_reorganize_staff_of_general_5621:0 "Реорганизовать штаб §YСеюма Мэнгэши§!"
