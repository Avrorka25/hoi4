 ETH_adopt_modern_tactics:0 "Принять современную тактику"
 remove_old_guard_trait_tt:0 "Теряет §RСтарую гвардию§!"
 modernize_ethiopian_rubber_production:0 "Модернизировать производство каучука в Эфиопии"
 exploit_ethiopian_iron_deposits:0 "Разработать эфиопские месторождения железа"
 second_italo_ethiopian_war:0 "Вторая итало-эфиопская война"
 second_italo_ethiopian_war_desc:0 "Война опустошает страну."
 ETH_recapture_the_juba_confluence:0 "Отбить район слияния Джубы"
 ETH_recapture_the_juba_confluence_desc:0 "Итальянцы заняли множество деревень вдоль нашей южной границы возле слияния реки Джубы. Международное сообщество восприняло это как знак того, что мы несерьёзно относимся к борьбе с итальянскими захватчиками. Отбросив итальянцев за нашу южную границу, мы докажем Лиге Наций, что у нас есть воля сопротивляться итальянскому натиску."
 ETH_hold_tigray:0 "Удержать Тыграй"
 ETH_hold_tigray_desc:0 "Мы должны удержать каждый клочок северного фронта в провинции Тыграй, если хотим доказать международному сообществу, что способны самостоятельно противостоять итальянцам. И что ещё важнее — доказать местным лидерам, что режим в Аддис-Абебе их не бросит."
 ETH_r56_rebuilding_the_country:0 "Восстановление страны"
 ETH_r56_rebuilding_the_country_desc:0 ""
 ETH_conquer_tigray_mission:0 "Завоевать Тыграй"
 ETH_conquer_tigray_mission_desc:0 "Отсутствие продвижения на северном фронте, особенно в регионе Тыграй, вызывает споры с самого начала войны. Захват этого региона станет хорошим первым шагом к доказательству того, что наши военные усилия не зашли в тупик."
 ETH_hold_the_juba_confluence_mission:0 "Удержать район слияния Джубы"
 ETH_hold_the_juba_confluence_mission_desc:0 "Одной из наших немногих побед в этой войне стал захват множества деревень в районе слияния Джубы на южном фронте. Разведка сообщает, что эфиопы готовят наступление, чтобы вернуть утраченные территории. Потеря контроля над районом слияния Джубы так скоро после его захвата станет серьёзным ударом по нашим военным усилиям."
 ETH_promote_infrastructure_development_in_from:0 "Содействовать развитию инфраструктуры в [FROM.GetName]"
 ETH_promote_construction_development_in_from:0 "Содействовать развитию строительства в [FROM.GetName]"
 ETH_state_development_production_speed_tt:0 "§YМаксимум фабрик в регионе§! §G+10%§!"
 ETH_state_development_local_building_tt:0 "§YСкорость местного строительства§! §G+10%§!"
 italo_ethiopian_war:0 "Италия подписала мир под угрозой дипломатической изоляции."
 ETH_black_lion_corps:0 "Чёрные львы"
 ETH_black_lion_corps_desc:0 "Бойцы стекаются под наши знамёна. "
 ETH_christmas_offensive_focus:0 "Рождественское наступление"
 ETH_christmas_offensive_focus_desc:0 "Мы не должны терять ни минуты"
 ETH_home_defense_focus:0 "Оборона родины"
 ETH_home_defense_focus_desc:0 "Мы должны сопротивляться иностранным захватчикам"
 ETH_swedish_red_cross:0 "Госпитали Красного Креста"
 ETH_swedish_red_cross_desc:0 "Госпитали Красного Креста оказывают нашим войскам крайне необходимую медицинскую помощь."
 ETH_copy_german_design_focus:0 "Копии маузеров"
 ETH_copy_german_design_focus_desc:0 "Немецкая конструкция. Эфиопское производство"
 ETH_hold_the_line_focus:0 "Укреплённые позиции"
 ETH_hold_the_line_focus_desc:0 "Хорошая лопата дорогого стоит"
 ETH_japan_advice:0 "Японские советники"
 ETH_japan_advice_desc:0 "С возвращением японских советников в Эфиопию мы можем приблизить нашу общую мечту о Союзе цветных народов, объединившихся против колониальных угнетателей."
 ETH_lion_roar_focus:0 "Рёв льва"
 ETH_lion_roar_focus_desc:0 "Сердца эфиопов наполняет дух рвения и решимости"
 ETH_defensive_imperialism:0 "Антиколониальная доктрина"
 ETH_defensive_imperialism_desc:0 "Эфиопия сыта по горло так называемой Лигой Наций и должна встать на защиту тех народов, которые не способны защитить себя сами."
 ETH_georges_deffontaine:0 "Оскар Михилс"
 ETH_lion_roar_focus_lesser:0 "Львы-победители"
 ETH_lion_roar_focus_lesser_desc:0 "Мы выстояли и победили Италию! Смерть колониалистам и узурпаторам!"
 ETH_call_of_lion:0 "Зов льва"
 ETH_call_of_lion_desc:0 "Поражение итальянцев заставило африканцев повсюду сплотиться вокруг нашего дела."
 ETH_solomonic_dynasty:0 "Соломонова династия"
 ETH_solomonic_dynasty_desc:0 "Этот человек заявляет, что его род восходит к Соломону."
 eth_focus:0 "Национальные фокусы Эфиопии"
 ETH_land_development:0 "Металлургические заводы"
 ETH_land_development_desc:0 "Мы должны развивать сталелитейную промышленность, если хотим удовлетворить производственные потребности наших вооружённых сил."
 ETH_urban_factories:0 "Развивать Аддис-Абебу"
 ETH_urban_factories_desc:0 "Без прочного промышленного фундамента колониальные державы раздавят нас как букашку."
 ETH_modern_technology:0 "Модернизировать промышленность"
 ETH_modern_technology_desc:0 "Эфиопия должна внедрить современные промышленные методы, если хочет пережить эти тёмные времена."
 ETH_addiba_university:0 "Основать Университетский колледж Аддис-Абебы"
 ETH_addiba_university_desc:0 "Университет Аддис-Абебы был основан в 1950 году как двухгодичный колледж канадским иезуитом доктором Люсьеном Маттом по просьбе Хайле Селассие. Он начал работу в следующем году. В течение последующих двух лет было налажено сотрудничество с Лондонским университетом. "
 ETH_extra_research_slot_2:0 "Основать Эфиопский институт"
 ETH_extra_research_slot_2_desc:0 "При основании в 1954 году первоначальная образовательная программа предполагала трёхлетнее обучение с получением диплома по строительной инженерии. Вскоре её расширили до четырёхлетней программы, ведущей к степени бакалавра наук по строительной инженерии. В 1969 году Строительный колледж объединился с инженерным колледжем, образовав Технологический факультет Университета Аддис-Абебы, и оставался в таком виде до 2009 года."
 ETH_black_lions:0 "Сформировать «Чёрных львов»"
 ETH_black_lions_desc:0 "Антифашистское движение, созданное для сопротивления итальянской оккупации Эфиопии. "
 ETH_regimental_system:0 "Военные реформы"
 ETH_regimental_system_desc:0 "Военная структура и организация Эфиопии в начале Второй итало-эфиопской войны находились в крайне плачевном состоянии. Нам необходимо использовать иностранных советников, чтобы создать более стройную военную систему."
 ETH_officer_schools:0 "Подготовка офицеров"
 ETH_officer_schools_desc:0 "Если мы рассчитываем, что наши вооружённые силы смогут добиться успехов в борьбе с колониализмом, необходимо обучить офицеров современной тактике."
 ETH_harar_academy:0 "Основать Академию Харара"
 ETH_harar_academy_desc:0 "Академия располагалась у подножия Хаким-Гары, части горной цепи, окружающей город. Магала находилась всего в нескольких милях от академии. С момента основания в 1957 году и до преждевременного закрытия в 1977 году академия была настолько тесно связана с Хараром, что для многих жителей города и множества кадетов, прошедших через оба места, они фактически были неразделимы."
 ETH_mil_factory:0 "Строить военные заводы"
 ETH_mil_factory_desc:0 "Если мы когда-нибудь хотим эффективно сражаться, то должны производить собственное оружие."
 ETH_mil_factory2:0 "Продолжить развитие промышленности"
 ETH_mil_factory2_desc:0 "Мы должны и дальше развивать нашу промышленность."
 ETH_christmas_offensive:0 "Рождественское наступление"
 ETH_christmas_offensive_desc:0 "Контрнаступление Эфиопии с целью разделить итальянские силы на северном фронте"
 ETH_national_mobilization:0 "Национальная мобилизация"
 ETH_national_mobilization_desc:0 "«Все мужчины и юноши, способные нести копьё, должны отправиться в Аддис-Абебу. Каждый женатый мужчина должен взять с собой жену, чтобы она готовила и стирала для него. Каждый неженатый мужчина должен привести любую незамужнюю женщину, которую сможет найти, чтобы она готовила и стирала для него. Женщины с младенцами, слепые, а также слишком старые и немощные, чтобы нести копьё, освобождаются. Любой, кого после получения этого приказа обнаружат дома, будет повешен». Приказ Хайле Селассие о мобилизации"
 ETH_plea_to_lon:0 "Обращение к Лиге Наций"
 ETH_plea_to_lon_desc:0 "В июне 1936 года Хайле Селассие обратился к Лиге Наций с просьбой ввести санкции против Италии. "
 ETH_ferenghi:0 "Ференги"
 ETH_ferenghi_desc:0 "«Ференги», или иностранцы, были группой военных советников, пилотов и врачей Красного Креста, помогавших Эфиопии во время войны с Италией."
 ETH_german_equipment:0 "Поддержка Германии"
 ETH_german_equipment_desc:0 "После первоначальных возражений Италии против германского аншлюса Германия снабжала Эфиопию винтовками и боеприпасами в надежде ослабить Италию."
 ETH_german_design:0 "Копировать немецкие разработки"
 ETH_german_design_desc:0 "Используя оружие, поставленное нам Германией, мы можем провести обратное проектирование его конструкций"
 ETH_homeland_defense:0 "Оборона родины"
 ETH_homeland_defense_desc:0 "Мы не можем позволить Италии захватить нашу суверенную территорию. Мы не можем полагаться ни на кого, кроме самих себя."
 ETH_mountain_forts:0 "Укрепить горы"
 ETH_mountain_forts_desc:0 "Если мы надеемся выстоять против Италии, необходимо укрепить наши позиции в горах."
 ETH_capital_forts:0 "Укрепить столицу"
 ETH_capital_forts_desc:0 "Мы превратим Аддис-Абебу в крепость."
 ETH_hold_line:0 "Удерживать рубеж"
 ETH_hold_line_desc:0 "Мы не можем отступить ни на шаг и должны удерживать позиции против итальянских захватчиков. Усиление существующих траншей и новые методы обороны помогут нам удержать землю."
 ETH_rain_iron:0 "Стальной дождь"
 ETH_rain_iron_desc:0 "Итальянские самолёты заполняют небо и тревожат наши войска. Мы должны разместить по всей стране средства ПВО и обрушить на них стальной дождь!"
 ETH_japanese_assistance:0 "Японская помощь"
 ETH_japanese_assistance_desc:0 "Мы должны обратиться к Японии за поддержкой в самый тяжёлый для Эфиопии час. Общественное мнение в Японии на нашей стороне, теперь нужно убедить их лидеров вновь поддержать нас."
 ETH_japanese_navy_focus:0 "Японские военно-морские советники"
 ETH_japanese_navy_focus_desc:0 "Япония является господствующей морской державой Тихого океана, и с её помощью мы сможем доминировать в Индийском океане и Красном море."
 ETH_lion_roar:0 "Лев Иудеи"
 ETH_lion_roar_desc:0 "Воодушевлённая иностранной поддержкой, Эфиопия вновь сплачивается, чтобы раз и навсегда изгнать колониалистов."
 ETH_demand_summit:0 "Потребовать саммита Лиги Наций"
 ETH_demand_summit_desc:0 "Италия сломлена, а мы выстояли. Лига Наций должна вмешаться и заставить её положить конец этому конфликту."
 ETH_torpedoes_focus:0 "Длинное копьё"
 ETH_torpedoes_focus_desc:0 "Наши японские братья разработали торпеду большой дальности, которая даст нашему флоту необходимое преимущество."
 ETH_secure_seuz:0 "Обезопасить Суэцкий канал"
 ETH_secure_seuz_desc:0 "Суэцкий канал — крайне важный торговый путь, а в грядущих конфликтах его значение станет ещё больше. Эта земля принадлежит Африке, и мы должны вырвать её из рук колониалистов."
 ETH_anti_colonial_dogma:0 "Антиколониальная доктрина"
 ETH_anti_colonial_dogma_desc:0 "Слишком долго Африка и весь мир находились под властью и в рабстве у колониалистов. Мы должны победить их и освободить эти народы. Мы разгромим их так же, как разгромили Италию."
 ETH_reclaim_aksum:0 "Вернуть Аксумское царство"
 ETH_reclaim_aksum_desc:0 "В VI веке, на пике своего могущества, Аксумское царство простиралось от Эфиопии через Красное море до Аравийского полуострова. Оно было важным пунктом на Пути пряностей и могущественным государством. Эти земли по праву принадлежат нам, и мы вернём их под власть Эфиопии."
 ETH_demand_french_somalia:0 "Потребовать Французское Сомали"
 ETH_demand_french_somalia_desc:0 "Французы ничем не лучше британцев или итальянцев. Они навязывают народам Африки свои законы и культуру. У них нет никаких прав на эти земли."
 ETH_demand_british_somalia:0 "Потребовать британские колонии"
 ETH_demand_british_somalia_desc:0 "Британцы слишком долго грабили и завоёвывали земли по всему миру. Их колонии должны быть возвращены народам и под руководством Эфиопии подготовлены к самоуправлению."
 ETH_death_to_saudis:0 "Исламская проблема"
 ETH_death_to_saudis_desc:0 "Ислам и его последователи давно противостоят нашему народу и нашему образу жизни. Ещё со времён Омейядского халифата и династии Айюбидов они были нашими противниками. Теперь настал наш черёд нанести ответный удар и отомстить за всё, что они сделали с нашим народом."
 ETH_demand_solomon_kingdom:0 "Вернуть царство Соломона"
 ETH_demand_solomon_kingdom_desc:0 "Хайле Селассие — законный наследник Соломонова царства, и мы вернёмся в Святую землю, чтобы объединить христианские и иудейские народы под одним знаменем. Слава императору Хайле Селассие, царю Аксума и всех его земель!"
 ETH_red_sea_focus:0 "Развивать Красное море"
 ETH_red_sea_focus_desc:0 "Красное море — важнейший торговый путь, и мы должны развивать наши порты на его берегах, если хотим когда-либо господствовать на море. Эфиопские порты были важной остановкой на Шёлковом пути, прежде чем товары отправлялись дальше на север вдоль Красного моря. Мы должны вернуть им прежнее значение!"
 ETH_develop_eritrea:0 "Развивать Эритрею"
 ETH_develop_eritrea_desc:0 "Итальянцы вложили некоторые средства в инфраструктуру Эритреи. Мы можем использовать уже созданные ими объекты и продолжить расширение. Эритрея способна стать крупным портовым регионом, если мы продолжим развивать инфраструктуру и промышленные проекты."
 ETH_develop_somalia:0 "Развивать Сомали"
 ETH_develop_somalia_desc:0 "Если мы действительно намерены обезопасить свои земли от колониалистов, необходимо превратить Сомали в современный портовый регион."
 ETH_fortify_eritrea:0 "Укрепить Эритрею"
 ETH_fortify_eritrea_desc:0 "Если война с Италией чему-то нас и научила, так это тому, что оборонительные сооружения необходимы для предотвращения вторжения иностранных держав."
 ETH_fortify_somalia:0 "Укрепить Сомали"
 ETH_fortify_somalia_desc:0 "Мы должны сделать всё возможное для защиты родины и усилить наши уязвимые позиции."
 ETH_modern_navy:0 "Создать современный флот"
 ETH_modern_navy_desc:0 "Теперь, когда мы обезопасили и развили наши порты, можно вкладываться в проекты кораблей, основанные на разработках других великих держав. При ограниченных возможностях нашей промышленности следует сосредоточить все ресурсы на эсминцах."
 ETH_amphibious_operations:0 "Десантные операции"
 ETH_amphibious_operations_desc:0 "Десантная война станет необходимой, если мы когда-нибудь захотим выйти за пределы Африки. Следует вложить ресурсы в изучение роли транспортных судов и поддержки флота при создании успешного плацдарма."
 ETH_carrier_primacy:0 "Приоритет авианосцев"
 ETH_carrier_primacy_desc:0 "Авианосная война — будущее морского боя, и мы должны вкладывать ресурсы в разработку собственных проектов."
 ETH_battleship_primacy:0 "Приоритет линкоров"
 ETH_battleship_primacy_desc:0 "Если мы хотим соперничать с другими флотами мира, необходимо разработать собственные проекты линкоров."
 ETH_silk_road_test:0 "Восстановить Шёлковый путь"
 ETH_silk_road_test_desc:0 "Эфиопия была важным участком Шёлкового пути: товары прибывали через порты Аксума и затем шли через Эфиопию на север Африки. Нам необходимо построить новую инфраструктуру, чтобы товары снова могли проходить через нашу страну так же, как во времена Аксума."
 ETH_steel_industry:0 "Развитие сталелитейной промышленности"
 ETH_steel_industry_desc:0 "Мы должны продолжать развивать сталелитейную промышленность, если хотим содержать современную армию и флот."
 ETH_rare_metals:0 "Металлургическая промышленность"
 ETH_rare_metals_desc:0 "Дальнейшие инвестиции в горнодобывающую отрасль позволят обнаружить новые залежи металлов, необходимых современной промышленности."
 ETH_oil_industry:0 "Нефтяная промышленность"
 ETH_oil_industry_desc:0 "Современному флоту необходим стабильный источник нефти, который мы можем создать благодаря дальнейшим инвестициям."
 ETH_modern_airforce:0 "Модернизировать ВВС"
 ETH_modern_airforce_desc:0 "Приложив немного усилий, мы сможем полностью модернизировать наши военно-воздушные силы."
 ETH_airbase_eritea:0 "Авиабаза в Эритрее"
 ETH_airbase_eritea_desc:0 "Чтобы обеспечить надлежащее воздушное прикрытие наших сил в Эритрее, необходимо расширить расположенные там авиабазы."
 ETH_airbase_somalia:0 "Авиабаза в Сомали"
 ETH_airbase_somalia_desc:0 "Сомали необходим плацдарм для нашей авиации. Мы сможем быстро построить там необходимую инфраструктуру."
 ETH_develop_airforce:0 "Продолжить инвестиции"
 ETH_develop_airforce_desc:0 "Если мы хотим сохранять конкурентоспособность в борьбе за господство в воздухе, необходимо и дальше вкладываться в развитие наших военно-воздушных сил."
 ETH_hold_the_line:0 "Улучшенные позиции"
 ETH_diplomatic_legitimacy:0 "Дипломатическая легитимность"
 ETH_diplomatic_legitimacy_desc:0 "Отразив итальянское вторжение, наша страна может стать символом сопротивления империалистическому угнетению."
 ETH_join_the_japanese:0 "Оформить японо-эфиопский союз"
 ETH_join_the_japanese_desc:0 "Взаимная помощь между двумя нашими великими нациями может быть расширена до полноценного военного союза, который станет противовесом империалистическим амбициям жадных до власти и земель западных держав!"
 ETH_japanese_navy:0 "Японские военно-морские советники"
 ETH_leopold_reul:0 "Леопольд Рёль"
 ETH_the_long_lance:0 "Длинное копьё"
 ethiopia.1.t:0 "Итальянское вторжение сорвано"
 ethiopia.1.d:0 "Итальянские захватчики изгнаны за наши границы и сброшены в море! Это славный день для детей Соломона. Мы наконец вернули исконные земли, отнятые у нашего народа, и создали более сильную нацию, готовую к величию."
 ethiopia.2.t:0 "Западные державы вводят эмбарго против Италии"
 ethiopia.2.d:0 "Подписавшиеся стороны считают непременным условием любого прочного мира предоставление всем народам мира их законного места и решили поддерживать друг друга и сотрудничать в усилиях по прекращению бессмысленного кровопролития и откровенного империализма Италии в Восточной Африке и соответствующих регионах континента, где их главной целью является установление и поддержание нового порядка, призванного содействовать взаимному процветанию и благополучию заинтересованных народов."
 ethiopia.3.t:0 "Западные державы возмущены"
 ethiopia.3.d:0 "Подобная безнаказанная агрессия против других членов Лиги Наций недопустима."
 ethiopia.10011.t:0 "Немецкое оружие"
 ethiopia.10011.d:0 "Германия отправляет нам снабжение для развития промышленности. Создав современную промышленную базу, мы наконец сможем дать отпор силам Муссолини."
 ethiopia.10011.a:0 "Нужно срочно наращивать производство!"
 ethiopia.10011.b:0 "Их оружие серьёзно поможет нашей борьбе!"
 ETH_generic_tank_plant:0 "Национальная танковая мастерская"
 ETH_tank_refurbishment_plant:0 "Завод по восстановлению танков"
 ETH_tank_refurbishment_plant_desc:0 "Если нам нужны танки, почему бы не начать с тех, что оставили итальянцы?"
