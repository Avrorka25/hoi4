 HAS_TYPED_INSULT:0 "Телеграмма имеет, по крайней мере §Y1§! характер"
 USE_INSULT_BUTTON:0 "[This.GetInsultListEntryName]"
 USE_INSULT_BUTTON_TT:0 "Текст этой телеграммы: \n\"§Y[This.GetInsultListEntryName]§!\""
 USE_INSULT_BUTTON_TT_DELAYED:0 "§Gщелкнуть§! Выберите это оскорбление."
 string_cannot_send_insult_because_players_did_not_vote_yet:0 "\n\n§RОпрос между игроками еще не завершен. Как только результат будет известен, мы можем отправить телеграмму.§W"
 string_cannot_send_insult_because_we_recently_insulted_someone:0 "\n\n§RМы не можем отправить телеграмму в другую страну. §Y[?Root.last_insult_sent_this_amount_of_days_ago]§! дней.§W"
 string_cannot_send_insult_to_ally:0 "\n\n§RМы не можем посылать телеграммы членам нашей фракции.§W"
 string_cannot_send_insult_to_enemy:0 "\n\n§RМы не можем отправить телеграмму §Y[This.GetNameWithFlag]§!Потому что мы уже находимся в состоянии войны друг с другом.§W"
 string_cannot_send_insult_because_no_or_too_short_insult:0 "\n\n§RВы должны выбрать оскорбление или набрать телеграмму, по крайней мере §Y3§! персонажи.§W"
 string_cannot_send_insult_because_we_recently_insulted_them:0 "\n\n§RНедавно мы отправили им телеграмму. Мы можем писать телеграммы в страну только каждые 5 дней.§W"
 string_quotation_mark:0 "\""
 string_create_new_insult_save:0 "Создать новую Save"
 string_replace_insult_save:0 "Сохранить слот [?i]"
 string_create_new_insult_save_tt:0 "§Gщелкнуть§! Для создания §YНовая экономия§!, в котором ваше набранное в данный момент оскорбление будет сохранено."
 string_replace_insult_save_tt:0 "§Gщелкнуть§! то §YОБЩЕСТВО§! Это спасает вас от вашего набранного в настоящее время оскорбления.\n§Gщелчок правой кнопкой§! то §Yтяга§! Это спасение.\n§GCtrl + Right-click§! то §RУдалить§! Это спасение."
 string_replace_insult_save_tt_delayed:0 "Текст этого сохраненного оскорбления: \"§Y[This.GetPreviewOfSavedInsultIndex0][This.GetPreviewOfSavedInsultIndex1][This.GetPreviewOfSavedInsultIndex2][This.GetPreviewOfSavedInsultIndex3][This.GetPreviewOfSavedInsultIndex4][This.GetPreviewOfSavedInsultIndex5][This.GetPreviewOfSavedInsultIndex6][This.GetPreviewOfSavedInsultIndex7][This.GetPreviewOfSavedInsultIndex8][This.GetPreviewOfSavedInsultIndex9][This.GetPreviewOfSavedInsultIndex10][This.GetPreviewOfSavedInsultIndex11][This.GetPreviewOfSavedInsultIndex12][This.GetPreviewOfSavedInsultIndex13][This.GetPreviewOfSavedInsultIndex14][This.GetPreviewOfSavedInsultIndex15][This.GetPreviewOfSavedInsultIndex16][This.GetPreviewOfSavedInsultIndex17][This.GetPreviewOfSavedInsultIndex18][This.GetPreviewOfSavedInsultIndex19]§!\""
