 SEND_INSULT_BUTTON_TT:0 "§Y[This.GetNameWithFlag]§! Отправьте письменную телеграмму на §Y[?selected_country_to_insult.GetNameWithFlag]§!. [This.GetSendInsultButtonConditionsTooltip]"
