 WRITE_INSULT_BUTTON_TT:0 "§Gщелкнуть§! Эта икона или пресса §YШИФТ+ВЕНТЕР§! Начать писать телеграмму.\n§Gщелчок правой кнопкой§! Чтобы очистить ныне сохраненную телеграмму."
 WRITE_INSULT_BUTTON_TT_DELAYED:0 "§RОбратите внимание, что слова не разделены правильно, каждая строка может соответствовать 46 символам. Если вы хотите предотвратить уродливое расщепление слов, используйте минусы вручную или используйте достаточно места, чтобы перейти к следующей строке.§!\n§HДопускаются только телеграммы от А до Я, цифры и несколько специальных символов.§! \nВы можете вводить телеграммы обычно и удалять последний символ, нажав £DEL£. \n\nМожно использовать следующие специальные символы, горячий ключ для их ввода указан в скобках позади них: \n§YМинус§! (§G-§!) \n§YКосмос§! (§Gкосмический бар§!) \n§Yзапятая§! (§G,§!) \n§YВопросительный знак§! (§GCtrl + Q§!) \n§YАпостроф§! (§GСдвиг + ^§!) \n§Yточка§! (§G.§!) \n§YЦитаты Марк§! (§GСдвиг + 2§!) \n§YВосклицательный знак§! (§GСдвиг + 1§!) \n§YОткрытая круглая скобка§! (§GСдвиг + 8§!) \n§YЗакрытая круглая скобка§! (§GСдвиг + 9§!)"
 SAVE_INSULT_BUTTON_TT:0 "§Gщелкнуть§! открыть или закрыть окно для §bэкономить§! и §bгруз§! Типичные оскорбления."
 INSULT_SAVE_BUTTON:0 "[This.GetInsultSaveButtonText]"
 INSULT_SAVE_BUTTON_TT:0 "[This.GetInsultSaveButtonTooltip]"
