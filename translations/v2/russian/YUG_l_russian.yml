 YUG_julijan_luterotti:0 "Юлиян Лутеротти"
 r56_yugoslavia.1.t:0 "Вмешательство регента"
 r56_yugoslavia.1.d:0 "Из-за неспособности Стоядиновича решить «хорватский вопрос» принц-регент Павел вмешался и вынудил его покинуть должность. Своим преемником он избрал политика из Ниша Драгишу Цветковича."
 r56_yugoslavia.1.a:0 "Регент знает лучше."
 r56_yugoslavia_deaths.1.t:0 "Скончался Любомир Давидович"
 r56_yugoslavia_deaths.1.d:0 "Любомир Давидович, лидер Демократической партии, занимавший пост премьер-министра с 1919 по 1920 год и в 1924 году, скончался. Будучи сторонником восстановления парламентаризма в Югославии, он являлся важным символом югославской демократии."
 r56_yugoslavia_deaths.1.a:0 "Нам будет его не хватать."
 r56_yugoslavia_deaths.1.b:0 "Скатертью дорога."
 r56_yugoslavia_deaths.2.t:0 "Скончался Антон Корошец"
 r56_yugoslavia_deaths.2.d:0 "Антон Корошец, председатель Словенской народной партии и автор Майской декларации, провозгласивший 29 октября 1918 года Государство словенцев, хорватов и сербов, скончался. Он был одним из главных сторонников словенской автономии в Югославии и одновременно выступал за сближение с нацистской Германией. Поистине противоречивая фигура в наши тревожные времена."
 r56_yugoslavia_deaths.3.t:0 "Скончался Мехмед Спахо"
 r56_yugoslavia_deaths.3.d:0 "Мехмед Спахо, лидер Югославской мусульманской организации и первый боснийский мусульманский политик в Королевстве сербов, хорватов и словенцев, был заметным сторонником автономии боснийских мусульман в Югославии. Его внезапная и загадочная смерть может усилить напряжённость между нерелигиозными и верующими жителями страны."
 r56_yugoslavia.3.t:0 "Судьба Баната и Воеводины"
 r56_yugoslavia.3.d:0 "Судьбу Баната нельзя оставить без внимания, если мы хотим разрешить этнические конфликты среди нашего народа.\n\nПо данным наших агентов в высших эшелонах власти, [HUN.getAdjective] и [ROM.getAdjective] всё тревожнее сближаются с нашими врагами. Министерство внутренних дел предлагает ускоренно возвести укрепления на севере для защиты Сербии и её автономных протекторатов.\n\nОднако ни для кого не секрет, что [HUN.getAdjective] и [ROM.getAdjective] националисты стремятся аннексировать север Сербии и включить эти территории в состав своих стран. В условиях отсутствия иностранной поддержки мы могли бы уступить эти земли в обмен на определённое признание и помощь.\n\nЛиберальные политики выступают за предоставление этим регионам автономии и самоуправления под властью [YUG.getAdjective], что положило бы конец претензиям [ROM.getAdjective] и [HUN.getAdjective] на эти земли. \n\nКак нам поступить?"
 r56_yugoslavia.3.a:0 "Укрепить Банат. Никто не пройдёт!"
 r56_yugoslavia.3.b:0 "Уступить территории в обмен на иностранную поддержку."
 r56_yugoslavia.3.c:0 "Автономия народу — и ничего больше!"
 yugoslavia.25.t:0 "Малая Антанта подверглась нападению"
 yugoslavia.25.d:0 "До нас дошли сведения, что всего несколько дней назад наши союзники в [FROM.GetNameDefCap] подверглись нападению или вторжению со стороны сил [little_entente_attacker.GetAdjective]! Согласно нашим соглашениям с правительством [FROM.GetAdjective], от нас ожидают вступления в войну и помощи нашим союзникам [FROM.GetAdjective]. Однако это может не отвечать нашим интересам. Мы должны решить быстро — времени почти не осталось."
 yugoslavia.25.a:0 "Мы уже победили их однажды — победим снова!"
 yugoslavia.25.b:0 "Мы не можем позволить себе ещё одну войну с [little_entente_attacker.GetAdjective]..."
 yugoslavia.26.t:0 "[FROM.GetNameDefCap] отказывается участвовать"
 yugoslavia.26.d:0 "До нас дошли сведения, что наши союзники из [FROM.GetNameDefCap], несмотря на заключённые соглашения, отказались помогать нам в войне против [HUN.GetAdjective]. Они ничем не лучше врага. Как однажды сказал мудрый человек: ложный друг хуже настоящего врага..."
 yugoslavia.26.a:0 "Мы это запомним..."
 yugoslavia.27.t:0 "Балканский пакт подвергся нападению"
 yugoslavia.27.d:0 "До нас дошли сведения, что всего несколько дней назад наши союзники в [FROM.GetNameDefCap] подверглись нападению или вторжению со стороны сил [BUL.GetAdjective]! Согласно нашим соглашениям с правительством [FROM.GetAdjective], от нас ожидают вступления в войну и помощи нашим союзникам [FROM.GetAdjective]. Однако это может не отвечать нашим интересам. Мы должны решить быстро — времени почти не осталось."
 yugoslavia.27.a:0 "Мы уже победили их однажды — победим снова!"
 yugoslavia.27.b:0 "Мы не можем позволить себе ещё одну войну с [BUL.GetAdjective]..."
 yugoslavia.28.t:0 "[FROM.GetNameDefCap] отказывается участвовать"
 yugoslavia.28.d:0 "До нас дошли сведения, что наши союзники из [FROM.GetNameDefCap], несмотря на заключённые соглашения, отказались помогать нам в войне против [BUL.GetAdjective]. Они ничем не лучше врага. Как однажды сказал мудрый человек: ложный друг хуже настоящего врага..."
 yugoslavia.28.a:0 "Мы это запомним..."
