 YUG_prince_paul_desc:0 "Принц Павел Карагеоргиевич — двоюродный брат покойного короля Александра I. Поскольку сын Александра ещё несовершеннолетний, Павел исполняет обязанности регента Югославии."
 YUG_peter_II:0 "Пётр II"
 YUG_peter_II_desc:0 "Пётр II, названный в честь последнего короля Сербии Петра I, — сын покойного короля Александра I. Хотя формально он является монархом, из-за своего возраста он пока не способен править самостоятельно."
