l_russian:
 r56_YUG_little_entente:0 "Член Малой Антанты"
 r56_YUG_if_we_go_to_war_with_HUN:0 "§RЕсли Венгрия или Австро-Венгрия вступит в войну с членом Малой Антанты, остальные члены Малой Антанты придут нам на помощь.§!"
 r56_HUN_if_we_go_to_war:0 "\n§RДругие члены Малой Антанты придут на помощь нашим врагам.§!"
 r56_BUL_if_we_go_to_war:0 "\n§RДругие члены Балканского пакта придут на помощь нашим врагам.§!"
 YUG_little_entente_ally:0 "Малая Антанта"
 YUG_little_entente_enemy:0 "Малая Антанта"
 YUG_charismatic_opportunist:0 "Харизматичный оппортунист"
 YUG_organized_partizans:0 "Организованные партизаны"
 YUG_organized_partizans_desc:0 "Чтобы противостоять угрозе вторжения, мы должны заранее организовать ячейки сопротивления. Эти группы подготовят тайники, возможные площадки для сброса грузов и завербуют местных жителей для сбора разведданных. Все эти усилия позволят оказать максимальное давление на тылы вражеских войск."
 YUG_neutralize_the_opposition:0 "Нейтрализовать оппозицию"
 YUG_neutralize_the_opposition_desc:0 "Хотя новый режим кажется устойчивым, фашистские националисты всё ещё скрываются внутри наших границ или находятся в изгнании. Новая служба безопасности — скрытая рука партии — сможет подавить этих противников союза южных славян."
 YUG_economic_centralization:0 "Экономическая централизация"
 YUG_economic_centralization_desc:0 "Чтобы действительно поставить пролетариат у власти, нужно полностью перестроить экономику. Корпорации должны быть национализированы и переименованы в честь героев югославских рабочих."
 YUG_soviet_cooperation:0 "Сотрудничество с Советским Союзом"
 YUG_soviet_cooperation_desc:0 "Мы должны ещё теснее сотрудничать с Советским Союзом, чтобы развивать нашу страну и распространять идеи коммунизма."
 YUG_yugoslavian_international_communism:0 "Европейский коммунистический пакт"
 YUG_yugoslavian_international_communism_desc:0 "Мы не можем полагаться на поддержку Советов и должны искать других могущественных союзников, способных поддержать наше дело."
 YUG_invite_greece:0 "Пригласить Грецию"
 YUG_invite_greece_desc:0 "Хотя Греция никоим образом не является славянской страной, это важный партнёр в регионе, и мы не должны толкать её в объятия Советов."
 YUG_kraljevo_state_airlines_factory:0 "Государственный авиационный завод Кралево"
 YUG_kraljevo_state_airlines_factory_desc:0 "Первоначально созданный для обслуживания самолётов авиалиний, завод специализировался на лицензионном производстве из-за иностранного происхождения самолётов, которые ему приходилось строить и обслуживать."
 SER_kraljevo_state_airlines_factory:0 "Государственный авиационный завод Кралево"
 SER_kraljevo_state_airlines_factory_desc:0 "Первоначально созданный для обслуживания самолётов авиалиний, завод специализировался на лицензионном производстве из-за иностранного происхождения самолётов, которые ему приходилось строить и обслуживать."
 YUG_stealth_upgrades:0 "Улучшение скрытности"
 YUG_stealth_upgrades_desc:0 "Более совершенные шноркели для более дешёвых подводных лодок"
 YUG_skilled_pilots:0 "Опытные пилоты"
 YUG_skilled_pilots_desc:0 "Многочисленные острова у далматинского побережья требуют тщательно координировать каждый приказ и ясно передавать его, чтобы избегать аварий и максимально использовать особенности местности."
 YUG_adriatic_specialization:0 "Адриатическая специализация"
 YUG_adriatic_specialization_desc:0 "Многочисленные острова у далматинского побережья представляют собой особенность, которую мы можем использовать, чтобы застать врагов врасплох."
 SER_adriatic_specialization:0 "Адриатическая специализация"
 SER_adriatic_specialization_desc:0 "Многочисленные острова у далматинского побережья представляют собой особенность, которую мы можем использовать, чтобы застать врагов врасплох."
 SER_skilled_pilots:0 "Опытные пилоты"
 SER_skilled_pilots_desc:0 "Многочисленные острова у далматинского побережья требуют тщательно координировать каждый приказ и ясно передавать его, чтобы избегать аварий и максимально использовать особенности местности."
 yugoslav_serb_adriatic_training:0 "Югославская адриатическая специализация"
 yugoslav_croat_adriatic_training:0 "Югославская адриатическая специализация"
 yugoslav_montenegrin_adriatic_training:0 "Югославская адриатическая специализация"
 YUG_form_mechanics:0 "Сформировать бригады механиков"
 YUG_form_mechanics_desc:0 "В конце концов, какая разница между самолётом, сбитым вражескими пулями, потерянным из-за внезапного пожара двигателя или неспособным взлететь из-за механической неисправности, если мы не можем его починить? Чтобы снизить риск механических отказов, единственное решение — иметь специализированных и хорошо подготовленных механиков, знающих устройство этих самолётов лучше, чем хирург знает анатомию."
 YUG_expanded_repair_facilities:0 "Расширить ремонтные мощности"
 YUG_expanded_repair_facilities_desc:0 "Чтобы наши самолёты оставались в воздухе, крайне важно снизить число аварий. Будем надеяться, что различные иностранные чертежи помогут нам выбрать лучшие решения из разработок нескольких стран."
 SER_expanded_repair_facilities:0 "Расширить ремонтные мощности"
 SER_expanded_repair_facilities_desc:0 "Чтобы наши самолёты оставались в воздухе, крайне важно снизить число аварий. Будем надеяться, что различные иностранные чертежи помогут нам выбрать лучшие решения из разработок нескольких стран."
 YUG_yugoslav_reunification_category:0 "Воссоединение Югославии"
 YUG_yugoslav_reunification_category_desc:0 "Югославия была расколота центробежными силами, но идея союза южных славян продолжает жить."
 r56_unite_puppet_with_yug:0 "Объединить [FROM.getNameDef] с Югославией"
 YUG_construct_rupnik_line:0 "Построить линию Рупника"
 YUG_construct_rupnik_line_desc:0 "Продолжающаяся нацистская экспансия и агрессия [ITA.GetAdjective] осложнили наше положение. Мы должны построить оборонительные укрепления вдоль границы, чтобы обеспечить безопасность."
