 YUG_claim_bulgaria:0 "Претендовать на Болгарию"
 YUG_claim_bulgaria_desc:0 "Мы не можем успокоиться, пока все южные славяне не объединятся под нашим знаменем. Болгары, возможно, и не считают себя частью нашей нации, но мы определённо считаем иначе."
 YUG_establish_union_with_sofia:0 "Создать союз с Софией"
 YUG_proclaim_greater_yugoslavia:0 "Провозгласить Великую Югославию"
 YUG_proclaim_greater_yugoslavia_desc:0 "Когда значительная часть земель, принадлежащих нам по праву, оказалась под властью Белграда, настало время провозгласить создание Великой Югославии! Все исторические угнетатели наших народов содрогнутся от масштаба наших свершений!"
 YUG_press_bulgarian_claims_on_thrace:0 "Настаивать на болгарских притязаниях на Фракию"
 YUG_press_bulgarian_claims_on_thrace_desc:1 "Некоторые части Македонии, а также Добруджа всё ещё находятся за пределами наших границ. Поскольку все болгары — славяне, они принадлежат нашей нации."
 YUG_subjugate_albania:0 "Подчинить Албанию"
 YUG_subjugate_albania_desc:0 "В нашей Зетской бановине уже проживает множество албанцев. Сама Албания также должна быть включена в состав бановины."
 YUG_proclaim_greater_yugoslavia_tt:0 "Теперь мы будем известны как §YВеликая Югославия§!"
 YUG_bulgarian_cores_tt:0 "Получает национальные территории на всех начальных §Yболгарских§! национальных регионах."
 YUG_albanian_claims_tt:0 "Получает претензии на все начальные §Yалбанские§! регионы."
 yugoslavia.29.t:0 "Вопрос Фракии и Македонии"
 yugoslavia.29.d:0 "На территориях Фракии и Македонии издавна проживает множество болгар. Болгария давно выдвигала соответствующие претензии, а теперь её наследник через дипломатических представителей направил нам послания, в которых недвусмысленно требует передать Фракию и Македонию от [GRE.GetNameDef] к [YUG.GetNameDef]. Каков будет наш ответ?"
 yugoslavia.29.a:0 "Мы согласны."
 yugoslavia.29.b:0 "Мы не отдадим Македонию, но предложим югославам Фракию в качестве компромисса."
 yugoslavia.29.c:0 "Абсурд! Весь этот вопрос — полная бессмыслица!"
 yugoslavia.30.t:0 "Отказ [GRE.GetAdjective]"
 yugoslavia.30.d:0 "[GRE.GetNameDefCap] полностью отверг наши условия относительно передачи Фракии и Македонии."
 yugoslavia.30.a:0 "Это возмутительно! Созвать Генеральный штаб и готовиться к войне!"
 yugoslavia.31.t:0 "[GRE.GetNameDefCap] соглашается"
 yugoslavia.31.d:0 "Хотя очевидно, что [GRE.GetNameDef] не согласен с нашими требованиями относительно Фракии и Македонии, условия документа всё же были приняты."
 yugoslavia.31.a:0 "Наш народ вновь воссоединён!"
 yugoslavia.32.t:0 "Встречное предложение [GRE.GetAdjective]"
 yugoslavia.32.d:0 "Хотя они отказываются признавать наши законные притязания на Македонию, они сделали нам встречное предложение. Оно предусматривает передачу Фракии в нашу сферу влияния. Это не всё, чего мы хотели, но такой исход всё равно может оказаться выгодным для нашей страны."
 yugoslavia.32.a:0 "Мы примем передачу Фракии, но на этом вопрос не закрыт."
