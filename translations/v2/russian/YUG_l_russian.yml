 YUG_fate_of_banat:0 "Судьба Баната"
 YUG_fate_of_banat_desc:0 "В регионах Банат и Воеводина проживают сербы, румыны и венгры. Последние сообщения местных властей указывают на стремительный рост враждебности между различными группами населения, а также усиление националистических и сепаратистских настроений. Судьбу Баната нельзя оставить без внимания, если мы хотим разрешить этнические конфликты среди нашего народа. Как нам поступить?"
