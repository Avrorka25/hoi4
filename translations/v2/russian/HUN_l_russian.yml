 r56_hungary_6.desc:0 "Присоединиться к Карлу Бернадоту"
 r56_hungary_6.a:0 "К победе!"
 r56_hungary_6.b:0 "Бла-бла, смерть лучше."
 r56_hungary_coastline.1.t:0 "Венгрия требует владения Великой Венгрии"
 r56_hungary_coastline.1.d:0 "[HUN.GetName] использовала наследие Венгерского королевства как повод потребовать владения Великой Венгрии."
 r56_hungary_coastline.1.a:0 "Отдать им"
 r56_hungary_coastline.1.b:0 "Да кем они себя возомнили, отказывая Великой Италии?!"
 r56_hungary_coastline.2.t:0 "[ITA.GetName] соглашается!"
 r56_hungary_coastline.2.d:0 "[Ita.GetName] уступила нашим требованиям о Великой Венгрии!"
 r56_hungary_coastline.2.a:0 "Превосходно"
 r56_hungary_coastline.3.t:0 "[ITA.GetName] отклоняет нашу просьбу"
 r56_hungary_coastline.3.d:0 "[ITA.GetName] отвергла наше требование, прекрасно понимая, какова альтернатива."
 r56_hungary_coastline.3.a:0 "Тогда война"
 r56_hungary_7.t:0 "[ITA.GetLeader] приглашает [YUG.GetNameDef] в [HUN.getfactionname]"
 r56_hungary_7.desc:0 "С присущей ему дипломатической бравадой [ITA.GetLeader] решил действовать самостоятельно и пригласил [YUG.GetLeader] подписать союзный договор, связав их с [HUN.getfactionname]. Новые союзники — это хорошо, но такое решение может помешать восстановлению исторической Венгрии."
 r56_hungary_7.a:0 "Пожалуй, это лучше, чем оказаться в окружении врагов."
 WW_hungary.90.c:0 "Пал Эстерхази, значит!"
