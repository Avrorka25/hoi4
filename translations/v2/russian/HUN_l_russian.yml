l_russian:
 is_AH_tt:0 "Является §YАвстро-Венгрией§!"
 HUN_moderate_restoration:0 "Умеренная реставрация"
 HUN_moderate_restoration_desc:0 "Видя жестокость и страдания, вызванные как радикальным национализмом, так и коммунизмом, король и император Отто решил отказаться от притязаний на чужие территории, чтобы уберечь Европу от очередной катастрофы."
 HUN_fortification_cooperation:0 "Сотрудничество в укреплении обороны"
 HUN_fortification_cooperation_desc:0 "Наши общие ресурсы могут помочь нам предотвратить худшее."
 HUN_papal_blessing:0 "Папское благословение"
 HUN_papal_blessing_desc:0 "Габсбурги веками поддерживали Единую, Святую, Католическую и Апостольскую церковь."
 HUN_invite_croatia:0 "Пригласить Хорватию"
 HUN_invite_croatia_desc:0 "Хорваты давно связаны с нами. Они могли бы стать надёжными союзниками."
 HUN_alliance_with_the_kaiserreich:0 "Союз с Кайзеррейхом"
 HUN_alliance_with_the_kaiserreich_desc:0 "Промышленное влияние [GER.GetAdjective] на нашу страну делает дипломатический союз почти неизбежным."
 HUN_form_the_mdp:0 "Сформировать МДП"
 HUN_form_the_mdp_desc:0 "Мы должны реорганизовать политические партии, создав единый фронт и объединив многочисленные левые партии во главе с Коммунистической партией."
 HUN_turn_the_adriatic_red:0 "Окрасить Адриатику в красный"
 HUN_turn_the_adriatic_red_desc:0 "Продажное [YUG.GetName] слишком долго угнетало рабочие движения Балкан. Наш первейший долг — освободить пролетариат и показать ему ценности коммунизма!"
 HUN_liberate_the_austrians:0 "Освободить [AUS.GetAdjective]"
 HUN_liberate_the_austrians_desc:0 "Коммунистическая партия Австрии, КПА, была загнана в подполье чрезвычайным указом австрофашистского правительства в 1933 году. Без иностранной поддержки партия не может свободно действовать и вести [AUS.GetAdjective] народ к заслуженному процветанию. Мы изменим это навсегда!"
 HUN_expand_the_levente:0 "Расширить «Левенте»"
 HUN_expand_the_levente_desc:0 "Ассоциации «Левенте» — военизированная организация, существующая с 1921 года. Изначально она создавалась для физической подготовки и укрепления здоровья, но позднее была милитаризована, чтобы обойти ограничения Трианонского договора."
 HUN_demand_the_coastline:0 "[ROOT.GetHUNdemandthecoastline]"
 HUN_demand_the_coastline_desc:0 "Наследие Венгерского королевства включает прибрежные земли Далмации, утраченные в пользу османов пять веков назад. Если мы хотим вернуть былую славу, эти территории придётся потребовать или завоевать!"
 GetHUNdemandthecoastlinenormal_KEY:0 "Потребовать побережье"
 GetHUNdemandthecoastlineitaly_KEY:0 "Переговоры о побережье"
 HUN_integrate_southern_slovakia:0 "Интегрировать Южную Словакию"
 HUN_gyor_program_investment:0 "Инвестиции в Дьёрскую программу"
 HUN_gyor_program_decision_category:0 "Дьёрская программа"
 HUN_gyor_program_decision_category_desc:0 "Дьёрская программа позволит стране увеличить производство вооружений и перевооружить [ROOT.getAdjective] армию."
 HUN_support_manufacturers_coordination:0 "Поддержать координацию производителей"
 HUN_idea_support_armament_manufacturers:0 "Координация производителей вооружения"
 HUN_acquire_skoda_naval_artillery_experience:0 "Получить опыт морской артиллерии «Шкода»"
 HUN_acquire_skoda_naval_artillery_experience_desc:0 "«Шкода» проектировала орудия для австро-венгерского флота; пришло время вновь использовать этот опыт."
 HUN_experiment_with_torpedoes:0 "Эксперименты с торпедами"
 HUN_experiment_with_torpedoes_desc:0 "Чтобы наносить скрытные удары, мы должны догнать другие страны в разработке торпед."
 HUN_invest_in_north_transylvanian_mining:0 "Инвестировать в добычу в Северной Трансильвании"
 HUN_invest_in_north_transylvanian_mining_desc:0 "Трансильвания веками славилась горным делом. Даже если добываемые минералы не всегда напрямую полезны военной промышленности, они всё равно внесут значительный вклад в экономику."
 HUN_odon_trunkwalter:0 "Эдён Трунквальтер"
 HUN_dezso_winkler:0 "Дежё Винклер"
