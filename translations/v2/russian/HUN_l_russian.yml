 HUN_try_to_reconcile_with_horthy_loyalists:0 "Попытаться примириться со сторонниками Хорти"
 HUN_organize_workers_collectives:0 "Организовать рабочие коллективы"
 HUN_organize_workers_collectives_desc:0 "Организовав рабочие коллективы, мы сможем взять экономику под контроль и наконец похоронить капитализм."
 HUN_new_invasion_of_slovakia:0 "Новое вторжение в Словакию"
 HUN_new_invasion_of_slovakia_desc:0 "Пора раз и навсегда подчинить словаков и отомстить за нашу неудачу 1919 года."
 HUN_oil_refining_infrastructure:0 "Инфраструктура нефтепереработки"
 HUN_oil_refining_infrastructure_desc:0 "Чтобы обеспечить разработку нефтяных месторождений, необходимо оснастить страну нужными нефтеперерабатывающими заводами и топливными хранилищами."
 HUN_ally_yugoslavia:0 "Союз с [YUG.GetNameDef]"
 HUN_ally_yugoslavia_desc:0 "[YUG.GetNameDefCap] необходимо поддержать и сделать нашим союзником в борьбе за освобождение рабочих всего мира!"
 HUN_ally_greece:0 "Союз с [GRE.GetNameDef]"
 HUN_ally_greece_desc:0 "[GRE.GetNameDefCap] необходимо поддержать и сделать нашим союзником в борьбе за освобождение рабочих всего мира!"
 HUN_ally_bulgaria:0 "Союз с [BUL.GetNameDef]"
 HUN_ally_bulgaria_desc:0 "[BUL.GetNameDefCap] необходимо поддержать и сделать нашим союзником в борьбе за освобождение рабочих всего мира!"
 HUN_ally_austria:0 "Союз с [AUS.GetNameDef]"
 HUN_ally_austria_desc:0 "[AUS.GetNameDefCap] необходимо поддержать и сделать нашим союзником в борьбе за освобождение рабочих всего мира!"
 HUN_revolt_of_the_arrow_crosses:0 "Восстание скрещённых стрел"
 HUN_revolt_of_the_arrow_crosses_desc:0 "Так называемый регент годами предавал родную землю и её армию, удерживая власть в своих руках и заискивая перед иностранными угнетателями."
 HUN_favor_the_army:0 "Отдать предпочтение армии"
 HUN_favor_the_army_desc:0 "Чтобы вернуть Венгрии исторические границы, мы должны опереться на армию. Необходимо защищать интересы офицеров и залечить раскол, вызванный отстранением Хорти-предателя."
 HUN_foreign_aeronautical_assistance:0 "Иностранная авиационная помощь"
 HUN_foreign_aeronautical_assistance_desc:0 "Наши союзники могут помочь нам увеличить производство самолётов."
 HUN_foreign_aeronautical_assistance_idea:0 "Иностранная авиационная помощь"
 HUN_invite_yugoslavia:0 "Пригласить [YUG.GetNameDef]"
 HUN_invite_yugoslavia_desc:0 "Поддержка [YUG.GetNameDef] необходима для будущего устойчивой балканской коалиции."
 HUN_invite_czechoslovakia:0 "Пригласить [CZE.GetNameDef]"
 HUN_invite_czechoslovakia_desc:0 "Поддержка [CZE.GetNameDef] необходима для будущего устойчивой балканской коалиции."
 HUN_invite_greece:0 "Пригласить [GRE.GetNameDef]"
 HUN_invite_greece_desc:0 "Поддержка [GRE.GetNameDef] необходима для будущего устойчивой балканской коалиции."
 HUN_protect_ruthenia:0 "Защитить Рутению"
 HUN_protect_ruthenia_desc:0 "В наших интересах и в интересах мадьяронов и русинов защитить Рутению и обеспечить мирное сосуществование их общин. Времена и без того тревожные — внутренние враги нам не нужны."
 HUN_join_the_little_entente:0 "Присоединиться к Малой Антанте"
 HUN_join_the_little_entente_desc:0 "Дипломатические усилия наконец убедили [FRA.GetAdjective], что мы не представляем угрозы и способны мирно решить вопрос мадьяр, живущих за пределами [HUN.GetAdjective] границ. Куда большую угрозу представляют тираны, нарушающие мир, и свободные народы должны объединиться против них."
 HUN_join_the_cordon_sanitaire:0 "Присоединиться к санитарному кордону"
 HUN_join_the_cordon_sanitaire_desc:0 "[POL.GetAdjective]-[ROM.GetAdjective] союз — оплот Восточной Европы против тирании; вступление в него послужит делу свободы."
 HUN_hungarian_minorities_recruitment_agreement:0 "Соглашение о наборе венгерских меньшинств"
 HUN_hungarian_minorities_recruitment_agreement_desc:0 "Убедить союзников разрешить своим гражданам венгерского происхождения служить в [HUN.GetAdjective] армии."
 HUN_rearmament_refused:0 "§YЧлены Малой Антанты отказали в перевооружении§!"
 HUN_bernadotte_dynastic_ties_decision_category:0 "Династические связи Бернадотов"
 HUN_bernadotte_dynastic_ties_decision_category_desc:0 "Новый король нашей страны родился и вырос в Швеции и сохраняет тесные связи со страной своей юности."
 HUN_hungarian_minorities_recruitment_decision_category:0 "Набор венгерских меньшинств"
 HUN_hungarian_minorities_recruitment_decision_category_desc:0 "Вместо скорби по распаду Великой Венгрии утешение может принести международное сотрудничество с соседями. Некоторые этнические венгры за рубежом могут быть более мотивированы служить под [HUN.GetAdjective] флагом, избегая возможного языкового барьера. Мы должным образом обработали соседних союзников и убедили их, что это служит общему делу, а тяжесть нынешних времён открывает путь для необычных решений."
 HUN_form_swedish_democratic_government_in_exile:0 "Сформировать [SWE.GetAdjective] демократическое правительство в изгнании"
 HUN_recruit_magyars_in_carpathian_ruthenia:0 "Набирать мадьяр в Карпатской Рутении"
 HUN_recruit_magyars_in_vojvodina:0 "Набирать мадьяр в Воеводине"
 HUN_recruit_magyars_in_southern_transylvania:0 "Набирать мадьяр в Южной Трансильвании"
 HUN_recruit_magyars_in_northern_transylvania:0 "Набирать мадьяр в Северной Трансильвании"
