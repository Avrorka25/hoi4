 Armenian_question_category:0 "Армянский вопрос"
 Armenian_question_category_desc:0 "Судьба армянского народа уже находилась в центре обсуждений вокруг Версальского договора. Однако стремления армянских националистов были перечёркнуты Карсским договором и советскими репрессиями. Многие армяне живут в изгнании и надеются, что однажды свободная Армения вновь появится на картах."
