 ARM_return_from_exile:0 "Провозгласить Вторую республику"
 ARM_return_from_exile_desc:0 "Когда-то Армения была свободной, и с возвращением наших соотечественников из мест изгнания она вновь станет свободной."
 ARM_the_last_claimant:0 "Снова пригласить принца"
 ARM_the_last_claimant_desc:0 "Чтобы вернуть славу нашего прошлого, мы должны встать на сторону сыновей Левона II."
 ARM_royal_guards:0 "Учредить «Драник Гунд»"
 ARM_royal_guards_desc:0 "Мы должны объединить наших лучших воинов, чтобы они стали крепкой правой рукой монархии."
 ARM_ensure_church_support:0 "Сплотиться вокруг Эчмиадзина"
 ARM_ensure_church_support_desc:0 "Вера — это огонь в сердцах нашего народа. Ради всех [ARM.GetAdjective] Апостольская церковь должна поддержать нового монарха."
 ARM_reestablish_the_republic:0 "Восстановить «Анрапетутюн»"
 ARM_reestablish_the_republic_desc:0 "Новые технологии позволят миру вновь услышать голос Армении."
 ARM_armenian_youth_federation:0 "Объединить цехакронов"
 ARM_armenian_youth_federation_desc:0 "Братство — основа демократии, и начинается оно в сердцах молодых людей."
 ARM_implement_liberal_reforms:0 "Провести социальные реформы"
 ARM_implement_liberal_reforms_desc:0 "Чтобы достичь компромисса с гнчаками, мы должны провести социальные преобразования и реформы."
 ARM_mend_the_split:0 "Преодолеть раскол"
 ARM_mend_the_split_desc:0 "Наконец, чтобы объединить нашу нацию, мы должны положить конец внутренним политическим распрям."
 ARM_reunify_the_armenian_people:0 "Воссоединить армянский народ"
 ARM_reunify_the_armenian_people_desc:0 ""
