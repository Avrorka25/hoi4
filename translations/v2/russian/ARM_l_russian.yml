 ARM_reinforce_gold_mining:0 "Возродить золотодобычу"
 ARM_reinforce_gold_mining_desc:0 ""
 ARM_small_arms_workshops:0 "Открыть завод «Автоматика»"
 ARM_small_arms_workshops_desc:0 "Хороший солдат может быть важнее хорошего оружия, но вместе они способны на гораздо большее."
 ARM_increase_munition_production:0 "Восстановить заводы боеприпасов"
 ARM_increase_munition_production_desc:0 ""
 ARM_domestic_artillery_production:0 "Отечественное производство артиллерии"
 ARM_domestic_artillery_production_desc:0 ""
 ARM_synthetic_rubber_expertise:0 "Опыт в производстве синтетического каучука"
 ARM_synthetic_rubber_expertise_desc:0 "[ARM.GetNameDefCap] должна быть как можно более самодостаточной, и новые технологии могут сделать это возможным."
 ARM_support_chemical_factories:0 "Создать химические заводы"
 ARM_support_chemical_factories_desc:0 "Хотя к востоку от нас, в Баку, лежат гигантские нефтяные месторождения, нам следует создать собственные источники нефти."
 ARM_improve_construction_methods:0 "Укрепить промышленность Еревана"
 ARM_improve_construction_methods_desc:0 "Чтобы построить современную Армению, мы должны освоить новые методы строительства."
 ARM_expand_ararat_cement:0 "Расширить Араратский цементный завод"
 ARM_expand_ararat_cement_desc:0 "Мы избавили цементные заводы Арарата от скверны коммунизма. Теперь мы должны расширить их."
 ARM_industrial_advancements:0 "Национальная образовательная программа"
 ARM_industrial_advancements_desc:0 "Дорогу в будущее прокладывают усилия самых выдающихся [ARM.GetAdjective] умов."
 ARM_expand_the_yerevan_university:0 "Расширить Ереванский университет"
 ARM_expand_the_yerevan_university_desc:0 "Ереванскому университету не хватает квалифицированных преподавателей и сотрудников; приглашение специалистов из-за рубежа может помочь нашим студентам."
 ARM_plan_the_kajaran_mine:0 "Использовать железо Зангезура"
 ARM_plan_the_kajaran_mine_desc:0 "Новые научные исследования показывают, что запасы полезных ископаемых близ Каджарана могут быть гораздо значительнее, чем считалось ранее."
 ARM_expand_zangezur_copper_mine:0 "Расширить Алавердийский медеплавильный завод"
 ARM_expand_zangezur_copper_mine_desc:0 ""
 ARM_a_railway_to_kajaran:0 "Железная дорога в Каджаран"
 ARM_a_railway_to_kajaran_desc:0 "Минеральная руда бесполезна, пока её не переработают и не доставят на заводы. Новые железные дороги свяжут [ARM.GetAdjective] промышленность как никогда прежде."
 ARM_expand_the_railway_network:0 "Расширить железнодорожную сеть"
 ARM_expand_the_railway_network_desc:0 ""
 ARM_develop_hydroelectric_power:0 "Развивать гидроэнергетику"
 ARM_develop_hydroelectric_power_desc:0 ""
 ARM_irrigate_the_ararat_valley:0 "Оросить Араратскую долину"
 ARM_irrigate_the_ararat_valley_desc:0 ""
 ARM_socialist_governmental_autonomy:0 "Создать Армянскую ССР"
 ARM_socialist_governmental_autonomy_desc:0 "Роспуск Закавказской Социалистической Федеративной Советской Республики предоставляет нам возможность расширить права нашего народа."
 ARM_party_involvement:0 "Социалистическая армянская идентичность"
 ARM_party_involvement_desc:0 "Ошибка большевиков заключалась в том, что они использовали Армению в своих интересах, вместо того чтобы расширять возможности армянского народа. Мы не повторим эту ошибку."
 ARM_purge_the_trotskyist_dashnaks:0 "[GetARMPurgeFocus]"
 ARM_purge_the_trotskyist_dashnaks_stalinist:0 "Провести чистку троцкистов-дашнаков"
 ARM_purge_the_trotskyist_dashnaks_alt:0 "Провести чистку среди гнчаков"
 ARM_purge_the_trotskyist_dashnaks_desc:0 ""
 ARM_utilize_the_nkvd:0 "Использовать НКВД"
 ARM_utilize_the_nkvd_desc:0 ""
 ARM_fund_the_armenian_workers_union:0 "Финансировать Армянский союз рабочих"
 ARM_fund_the_armenian_workers_union_desc:0 ""
 ARM_workers_propaganda:0 "Рабочая пропаганда"
 ARM_workers_propaganda_desc:0 "Буржуазия Первой республики подвела армянский народ. Народ должен сплотиться против зол капитализма, иначе его вновь постигнет та же участь."
 ARM_ambitious_production_quotas:0 "Национализировать промышленность"
 ARM_ambitious_production_quotas_desc:0 "Объединившись, народ обретает неудержимую силу. Вместе мы сможем поднять Армению на невиданные прежде высоты."
 ARM_army_propaganda:0 "Военная пропаганда"
 ARM_army_propaganda_desc:0 "Сплотившись, народные солдаты смогут защитить [ARM.GetNameDef] от диктатуры европейской буржуазии и османских тиранов."
 ARM_protect_the_revolution:0 "Защитить революцию"
 ARM_protect_the_revolution_desc:0 "Пламя Маркса и Ленина выжжет из мира зло капитализма. Но мы должны присоединиться к великой борьбе народа и пойти на жертвы, чтобы сохранить искру революции."
 ARM_enforce_state_atheism:0 "Утвердить государственный атеизм"
 ARM_enforce_state_atheism_desc:0 "Святой Григорий и его церкви — не более чем орудие буржуазии, с помощью которого народ убеждают отказаться от принадлежащих ему власти и богатства."
 ARM_reopen_etchmiadzin_seminary:0 "Религия, одобренная государством"
 ARM_reopen_etchmiadzin_seminary_desc:0 "Бог и Святой Григорий стоят рядом с народом [ARM.GetNameDef], а Католикос может помочь направить людей на их пути к равенству."
 ARM_mobilize_the_workers:0 "Мобилизовать рабочих"
 ARM_mobilize_the_workers_desc:0 ""
 ARM_build_the_kovkas_line:0 "Построить линию Ковкас"
 ARM_build_the_kovkas_line_desc:0 ""
 ARM_join_the_comintern:0 "Вступить в Коминтерн"
 ARM_join_the_comintern_desc:0 ""
 ARM_the_transcaucasian_confederation:0 "Закавказская конфедерация"
 ARM_the_transcaucasian_confederation_desc:0 ""
 ARM_armeno_soviet_research_program:0 "Армяно-советская исследовательская программа"
 ARM_armeno_soviet_research_program_desc:0 ""
 ARM_keepers_of_the_south:0 "Хранители Юга"
 ARM_keepers_of_the_south_desc:0 ""
 ARM_volunteers:0 "§YФормируется добровольческая дивизия§!"
 ARM_royal_guards_tt:0 "Создать §Y2 элитные дивизии «Драник Гунд»§! в §Y[THIS.GetName]§!"
 ARM_event.1.t:0 "Смерть Католикоса Хорена I"
 ARM_event.1.desc:0 "Сегодня Армения скорбит о кончине Его Святейшества Хорена I, Католикоса всех армян, духовного лидера нашей древней нации. Будучи путеводным светом для армянского народа в бурную эпоху, Католикос Хорен посвятил свою жизнь сохранению нашей веры, культуры и идентичности. Его советы и твёрдое руководство служили единственным утешением во времена неопределённости и разобщённости. Его будут помнить за бескорыстную преданность родине и своему народу. Армения потеряла своего пастыря, и нация молится о преемнике, который сможет почтить и продолжить его наследие!"
 ARM_event.1.a:0 "Утрата святого человека."
 ARM_event.1.b:0 "Незначительно."
 ARM_event.2.t:0 "[ARM.GetAdjective] добровольцы хотят домой!"
 ARM_event.2.desc:0 "Добровольческие подразделения были сформированы, чтобы сражаться с [SOV.GetNameDef] и освободить Армению. После поражения [SOV.GetAdjective] государства эти добровольцы считают свою миссию выполненной и хотят вернуться домой."
 ARM_event.2.a:0 "Убедить их остаться ещё немного."
 ARM_event.2.b:0 "Расформировать их подразделение."
 ARM_event.3.t:0 "Добровольцы возвращаются домой!"
 ARM_event.3.desc:0 "После героических боёв за освобождение нашей родины от иностранного гнёта добровольцы, откликнувшиеся на призыв сражаться за [ARM.GetNameDef], вернулись домой. Они прошли парадом по центру города под восторженные возгласы толпы."
 ARM_event.3.a:0 "Мы освободились!"
 ARM_event.4.t:0 "Великая военная чистка"
 ARM_event.4.desc:0 "Иосиф Сталин, лидер Советского Союза, недавно приказал провести чистки и аресты среди многих политиков, военных и сотрудников генерального штаба большевистской партии. Армян это также не миновало: несколько армянских деятелей, в особенности Мовсес Силикян и Христофор Араратян, сражавшиеся за Армянскую революционную федерацию в 1920-е годы, также были арестованы по обвинению в контрреволюционной деятельности. Сейчас они ожидают приговора, который, судя по другим подобным случаям, скорее всего, будет смертным..."
 ARM_event.4.a:0 "Мы должны быть осторожны — времена действительно опасные..."
 ARM_greek_armenian_friendship_modifier:0 "Совместная борьба против общего врага"
