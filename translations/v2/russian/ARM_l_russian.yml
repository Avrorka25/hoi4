 armenian_national_liberation_category:0 "Национальное освобождение"
 armenian_national_liberation_category_desc:0 "Великая война едва не стала гибелью нашего народа. Но мы выжили. Теперь пришло время взять реванш у истории и воплотить обещания президента Вудро Вильсона."
