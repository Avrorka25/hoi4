 ARM_fading_national_identity_fascist:0 "Дух Арамазда"
 ARM_fading_national_identity_communist:0 "Социалистическая армянская идентичность"
 ARM_fading_national_identity_communist_2:0 "Революционная армянская идентичность"
 ARM_dashnak_hunchak_split:0 "Раскол между дашнаками и гнчаками"
 ARM_dashnak_hunchak_split_desc:0 "[ARM.GetDemocraticParty] и Социал-демократическая партия «Гнчак» когда-то плечом к плечу боролись за независимость и права Армении, но со временем между ними начали проявляться идеологические разногласия. Дашнаки делают упор на армянский национализм и независимость, тогда как гнчаки ставят во главу угла социалистические идеалы, сотрудничество с Советами и часто поддерживают союзы, служащие более широким революционным целям. Этот раскол посеял раздор в армянской политике: обе партии яростно отстаивают собственное видение будущего Армении. Теперь, когда страна сталкивается с новыми угрозами и возможностями, внутреннее соперничество грозит помешать единству именно тогда, когда оно необходимо больше всего, оставляя Армению расколотой и уязвимой перед внешним влиянием."
