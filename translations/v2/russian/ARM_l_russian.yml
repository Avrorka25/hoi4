 ARM_acquire_diaspora_funding:0 "Получить финансирование диаспоры"
 ARM_acquire_diaspora_funding_desc:0 ""
 ARM_transfer_officers_of_armenian_descent:0 "Отозвать офицеров"
 ARM_transfer_officers_of_armenian_descent_desc:0 "Долг зовёт наших воинов домой. За время службы за границей они многому научились, но теперь они нужны своему народу."
 ARM_the_triumph_over_communism:0 "Триумф над большевиками"
 ARM_the_triumph_over_communism_desc:0 "Большевики предали нас в трудный час. Мы должны избавиться от них."
 ARM_war_propaganda:0 "Армяне, едины как один!"
 ARM_war_propaganda_desc:0 "Ни одна нация не добилась свободы, не будучи готовой пролить кровь захватчиков."
 ARM_planned_defense_policy:0 "Плановая оборонная политика"
 ARM_planned_defense_policy_desc:0 "Каждый день, потраченный на подготовку к войне, сохраняет недели свободы для наших сыновей и дочерей."
 ARM_build_the_bek_line:0 "Построить линию Давида Бека"
 ARM_build_the_bek_line_desc:0 "Земля, на которой генерал Бек когда-то проливал кровь, крепка и станет краеугольным камнем нашей обороны."
 ARM_saint_gregory_protects_our_skies:0 "Святой Григорий защищает наше небо"
 ARM_saint_gregory_protects_our_skies_desc:0 "Святой благословит наши труды, пока они совершаются с искренней верой."
 ARM_cherish_what_we_have:0 "Кавказ — наша родина"
 ARM_cherish_what_we_have_desc:0 "Это земля наших отцов, их отцов и отцов их отцов на протяжении многих веков. Мы сделаем её достойной их наследия."
 ARM_irano_persian_diplomats:0 "Ирано-персидские дипломаты"
 ARM_irano_persian_diplomats_desc:0 "Враг наших врагов может оказаться хорошим соседом.  Нам следует обратиться к нашему южному соседу."
 ARM_join_iran:0 "Присоединиться к [PER.GetNameDef]"
 ARM_join_iran_desc:0 "Персия приняла наших беженцев в мрачные времена. Теперь, когда тлеющие угли мира разгораются в пламя, нам следует встать рядом с ней."
 ARM_the_wilsonian_promise:0 "Вильсоновское обещание"
 ARM_the_wilsonian_promise_desc:0 "Когда-то мир считал, что Трабзон, Эрзурум и озеро Ван принадлежат Армении. И мир был прав."
 ARM_operation_nemesis_wasn_t_enough:0 "Возобновить операцию «Немезис»"
 ARM_operation_nemesis_wasn_t_enough_desc:0 "Турки тысячами убивали наших матерей и отцов. Наша справедливая месть ещё не завершена."
 ARM_assimilation:0 "Ассимиляция"
 ARM_assimilation_desc:0 "Возмездие не требует, чтобы мы уподоблялись нашему врагу. Мы будем обращаться с покорёнными лучше, чем обращались с нами."
 ARM_strong_hand:0 "Сильная рука"
 ARM_strong_hand_desc:0 "Земля, которой мы теперь правим, принадлежит армянам и только армянам."
 ARM_an_open_hand_to_turkey:0 "Искать примирения с Анатолией"
 ARM_an_open_hand_to_turkey_desc:0 "При всех их недостатках революционеры Ататюрка — не прежние османы и могут встать вместе с нами против большевиков."
 ARM_hayk_youth:0 "Основать «Вревиц Банак»"
 ARM_hayk_youth_desc:0 "Чтобы воплотить наши экспансионистские амбиции, мы должны создать «Армию возмездия», более известную как «Вревиц Банак»."
 ARM_repression_apparatus:0 "Обеспечить политическую лояльность"
 ARM_repression_apparatus_desc:0 "Те, кто не с нами, не являются верными армянами и не выражают волю народа."
