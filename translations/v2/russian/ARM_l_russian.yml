 ARM_exiled_generals:0 "Связаться с генералами в изгнании"
 ARM_exiled_generals_desc:0 "Многие годы генералы, пытавшиеся создать свободную Армению в конце Великой войны, жили в изгнании. Они должны вернуться."
 ARM_exiled_generals_tt:0 "Военные командиры возвращаются из изгнания в зависимости от того, кто пережил чистки [SOV.GetAdjective]."
