 ARM_fading_national_identity:0 "Угасающее национальное самосознание"
 ARM_fading_national_identity_desc:0 "Армянский народ имеет долгую и славную историю стойкости, отмеченную ожесточённым сопротивлением и трагическими потерями в войнах 1910-х и 1920-х годов. После ужасов 1915–1916 годов, пережитых армянским народом, и борьбы за выживание во время Великой войны Армения ненадолго обрела независимость, но в начале 1920-х годов вошла в состав Советского Союза. Десятилетия советского правления подтачивали культурную автономию нашей страны и чувство национального самосознания. При проводимой Москвой политике коллективизации и подавления этнической самобытности символы армянского наследия и гордости постепенно угасали, уступая место советской идентичности, почти не оставляющей пространства для армянской истории и традиций. Теперь Армения стоит на перепутье: связь народа со своими корнями слабеет с каждым днём, грозя стереть память о тех тяжело завоёванных битвах за свободу и самобытность..."
 ARM_fading_national_identity_democratic:0 "Возрождение республики"
 ARM_fading_national_identity_democratic_desc:0 "Армянский народ имеет долгую и славную историю стойкости, отмеченную ожесточённым сопротивлением и трагическими потерями в войнах 1910-х и 1920-х годов. После ужасов 1915–1916 годов, пережитых армянским народом, и борьбы за выживание во время Великой войны Армения ненадолго обрела независимость, но в начале 1920-х годов вошла в состав Советского Союза. Десятилетия советского правления подтачивали культурную автономию нашей страны и чувство национального самосознания. При проводимой Москвой политике коллективизации и подавления этнической самобытности символы армянского наследия и гордости постепенно угасали, уступая место советской идентичности, почти не оставляющей пространства для армянской истории и традиций. Теперь Армения стоит на перепутье: связь народа со своими корнями слабеет с каждым днём, грозя стереть память о тех тяжело завоёванных битвах за свободу и самобытность..."
 ARM_fading_national_identity_right:0 "Триумф над большевизмом"
 ARM_fading_national_identity_right_desc:0 "Армянский народ имеет долгую и славную историю стойкости, отмеченную ожесточённым сопротивлением и трагическими потерями в войнах 1910-х и 1920-х годов. После ужасов 1915–1916 годов, пережитых армянским народом, и борьбы за выживание во время Великой войны Армения ненадолго обрела независимость, но в начале 1920-х годов вошла в состав Советского Союза. Десятилетия советского правления подтачивали культурную автономию нашей страны и чувство национального самосознания. При проводимой Москвой политике коллективизации и подавления этнической самобытности символы армянского наследия и гордости постепенно угасали, уступая место советской идентичности, почти не оставляющей пространства для армянской истории и традиций. Теперь Армения стоит на перепутье: связь народа со своими корнями слабеет с каждым днём, грозя стереть память о тех тяжело завоёванных битвах за свободу и самобытность..."
