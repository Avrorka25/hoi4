 soviet.104.t:0 "Хуан Модесто просит убежища"
 soviet.104.d:0 "После поражения наших союзников в Испании испанский командир и выпускник Военной академии имени Фрунзе Хуан Модесто попросил убежища и предложил служить в нашей армии."
