 SOV_consolidate_power_tt_2:0 "Удаляет национальные духи §Y$SOV_the_true_tsars_idea$§!, §Y$SOV_fascist_womens_movement_idea$§!, §Y$SOV_siberian_forest_soldiers_idea$§!"
 SOV_reinforce_caspian_naval_bases:0 "Укрепить каспийские военно-морские базы"
 SOV_reinforce_caspian_naval_bases_desc:0 "Хотя этот морской стратегический регион не так важен, как другие, необходимо сохранять там сильное присутствие, чтобы сдерживать продвижение [PER.GetAdjective] сил и других иностранных держав и защищать наши интересы."
