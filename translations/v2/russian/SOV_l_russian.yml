 SOV_industry_relocation_desc:0 "Война уже началась, и враги угрожают нашим промышленным районам на западе. Перенесём предприятия далеко на Урал, за пределы досягаемости самых крупных бомбардировщиков противника. Так мы защитим промышленность, выпустим больше военного снаряжения и начнём решительные контратаки во имя [SOV.getleader] и его видения [SOV.GetRulingIdeologyNoun]."
