 SOV_grieve_stalin_desc:0 "Политбюро объявило о смерти Иосифа Виссарионовича Сталина. Пока страна оплакивает одного из любимых вождей, позорные обстоятельства его смерти — он захлебнулся собственной рвотой — сохраняются в тайне. При отсутствии общепризнанного преемника различные члены Политбюро готовы на всё ради устранения соперников."
