l_russian:
 SOV_ukrainian_reclaimation_desc:0 "Украинские националисты вновь пытаются расколоть [SOV.GetNameDef], и правительство намерено уничтожить националистические элементы."
 SOV_anti_bolshevik_revolt:0 "Антибольшевистское восстание"
 SOV_put_down_the_ukrainian_revolt:0 "Подавить украинское восстание"
 SOV_crush_ukrainian_opposition:0 "Сокрушить украинскую оппозицию"
 r56_UKR_revolt_active:0 "Украина восстала"
 SOV_defeat_the_upa_in_199:0 "Разгромить УПА в регионе [199.getname]"
 SOV_defeat_the_upa_in_91:0 "Разгромить УПА в регионе [91.getname]"
 SOV_defeat_the_upa_in_89:0 "Разгромить УПА в регионе [89.getname]"
 SOV_defeat_the_upa_in_80:0 "Разгромить УПА в регионе [80.getname]"
 SOV_defeat_the_upa_in_73:0 "Разгромить УПА в регионе [73.getname]"
 SOV_yakov_zeldovich:0 "Яков Зельдович"
 SOV_yulii_khariton:0 "Юлий Харитон"
 SOV_aleksandr_morozov:0 "Александр Морозов"
 SOV_nikolai_dukhov:0 "Николай Духов"
 SOV_mikhail_rudnitsky:0 "Михаил А. Рудницкий"
 SOV_joseph_yakovlevich_kotin:0 "Иосиф Яковлевич Котин"
 SOV_ivan_dmitriev:0 "Иван Дмитриев"
 SOV_iron_curtain_faction:0 "Коминформ"
 SOV_Lenin_Cult:0 "Культ Ленина"
 SOV_Lenin_Cult_desc:0 "Мы должны заменить религиозную преданность преданностью государству."
 SOV_New_Soviet_Woman:0 "Новая советская женщина"
 SOV_New_Soviet_Woman_desc:0 "Мы добились огромного прогресса на пути к равенству полов. Следует продолжить этот курс и призвать женщин также служить в боевых частях. Их можно использовать во вспомогательных ролях на передовой и на некоторых ограниченных боевых должностях, освобождая здоровых мужчин для сражений. Только истинное равенство и полная преданность делу позволят нам противостоять агрессии иностранных держав."
 SOV_Trotskyite_Coup:0 "Троцкистский переворот"
 SOV_Trotskyite_Coup_desc:0 ""
 SOV_Organize_Labor:0 "Организовать труд"
 SOV_Organize_Labor_desc:0 ""
 trotsky_check:0 "Восстание уже произошло"
 SOV_khruschev_flag:0 "Хрущёв возглавил страну во время Гражданской войны"
 SOV_tank_improvements_idea:0 "Улучшение танков"
 SOV_mass_tank_procution_idea:0 "Массовое производство танков"
 SOV_Integrate_Labor_Into_The_Military:0 "Интегрировать труд в военную систему"
 SOV_Integrate_Labor_Into_The_Military_desc:0 "Служат все. Одни держат винтовки, другие — молоты. Рабочие должны уметь пользоваться и тем и другим."
 SOV_A_Gun_In_Every_Hand:0 "Винтовку в каждые руки"
 SOV_A_Gun_In_Every_Hand_desc:0 "Власть рождается из ствола длинной винтовки. Мы должны создать достаточные запасы оружия для освобождения мирового пролетариата."
 SOV_New_Infantry_Equipment:0 "Новое пехотное снаряжение"
 SOV_New_Infantry_Equipment_desc:0 "Современное снаряжение даст нашим славным солдатам всё необходимое для освобождения мира от капиталистического гнёта."
 SOV_Red_Mountaineers:0 "Красные горные стрелки"
 SOV_Red_Mountaineers_desc:0 "Необходимо начать программу подготовки войск к боям в горах. Закалённые в суровейших условиях, эти горные части возглавят освобождение мира."
 SOV_Jungle_Training:0 "Подготовка к войне в джунглях"
 SOV_Jungle_Training_desc:0 "Нужно разработать методы и подготовить солдат к войне в тропиках. Пролетариат тропических стран нуждается в освобождении не меньше, чем угнетаемые в Англии и Франции."
 SOV_Nationwide_Wargame:0 "Всесоюзные военные игры"
 SOV_Nationwide_Wargame_desc:0 "Масштабные учения по всей территории СССР дадут нам опыт, необходимый для эффективного ведения современной войны."
 SOV_Work_On_Logistics:0 "Улучшить логистические возможности"
 SOV_Work_On_Logistics_desc:0 "Чтобы эффективно сражаться, солдаты должны постоянно получать продовольствие и боеприпасы. Нам необходимо создать элитный корпус офицеров, который обеспечит бесперебойное снабжение армии. Александр Василевский — исключительно способный командир, обладающий всеми навыками для формирования этого нового элитного эшелона кадров."
 SOV_Military_Machine:0 "Военная машина"
 SOV_Military_Machine_desc:0 "Советская военная машина будет продолжать выпускать оружие до тех пор, пока весь пролетариат не будет освобождён от угнетения."
 SOV_Develop_Resources:0 "Осваивать ресурсы"
 SOV_Develop_Resources_desc:0 "Промышленности нужны руды и другие ресурсы для производства вооружений. Мы должны открыть новые шахты и рудники."
 SOV_more_tech:0 "Инвестировать в науку"
 SOV_more_tech_desc:0 "Мы должны и дальше расширять границы человеческого знания. Наука поможет построить лучшее общество для народа."
 SOV_The_Working_Man:0 "Рабочий"
 SOV_The_Working_Man_desc:0 "Рабочий — основа троцкистской революции. Если он не поймёт своего места в славной революции, наши надежды и мечты завершатся плачевно."
 SOV_Restrict_Political_Expression:0 "Ограничить политическое самовыражение"
 SOV_Restrict_Political_Expression_desc:0 "Свобода слова и другие политические права удобны, но современность требует иных мер. Тех, кто призывает к восстанию и сеет инакомыслие, необходимо выследить и удалить из общества."
 SOV_One_Dream_One_China:0 "Одна мечта, единый Китай"
 SOV_One_Dream_One_China_desc:0 "Мы поможем истинному китайскому правительству освободить крестьян от различных военачальников, пришедших к власти в последние годы. Главный военачальник Чан Кай Шек будет жестким противником, поэтому мы окажем военную помощь для этого начинания."
 SOV_Return_Of_Japanese_Occupied_China:0 "Договориться о возвращении оккупированных Японией земель Китая"
 SOV_Return_Of_Japanese_Occupied_China_desc:0 "Мы выступим посредниками в споре между японцами и китайцами и найдём справедливое решение конфликта. Мы гарантируем итог переговоров и обеспечим их беспрепятственное проведение. Товарищ Троцкий не позволит выставить себя дураком."
 SOV_Indian_Communism:0 "Индийский коммунизм"
 SOV_Indian_Communism_desc:0 "Мы будем распространять коммунистические идеи среди индийских крестьян, помогая им освободиться от упадочных британских хозяев."
 SOV_Free_The_Peasants:0 "Освободить крестьян"
 SOV_Free_The_Peasants_desc:0 "Мы поможем индустриализировать Индию и перевести её население с полей на новые фабрики."
 SOV_Independence_For_India:0 "Независимость Индии"
 SOV_Independence_For_India_desc:0 "Индия наконец обретёт независимость от мерзкой империалистической Британской империи."
 SOV_World_Revolution:0 "Мировая революция"
 SOV_World_Revolution_desc:0 "Крестьян и трудящихся всего мира необходимо освободить от капиталистического и фашистского гнёта. Но действовать следует осторожно: правительства этих стран не оценят распространение нашей идеологии и поддержку открытых восстаний у себя в тылу."
 SOV_ideological_propaganda:0 "Идеологическая пропаганда"
 SOV_ideological_propaganda_desc:0 "Каждое коммунистическое движение — потенциальная ячейка, готовая организовать массы."
 SOV_Expansion_of_Communism:0 "Расширение коммунизма"
 SOV_Expansion_of_Communism_desc:0 "Мы убедим ещё больше людей принять коммунизм, продемонстрировав его преимущества."
 SOV_European_Sphere:0 "Европейская сфера"
 SOV_European_Sphere_desc:0 "По мере принятия коммунистической идеологии всё большим числом людей наши границы будут расширяться. Однажды страны и границы станут не нужны, и мы будем жить под властью единого централизованного правительства. На кону будущее всего человечества."
 SOV_Get_New_Communists_On_Board:0 "Привлечь новых коммунистов"
 SOV_Get_New_Communists_On_Board_desc:0 "Чтобы завоевать симпатии будущих коммунистов, необходимо показать, что коммунизм действительно лучше всего обеспечивает достойную жизнь трудящимся. Поэтому мы направим значительную часть производства на товары народного потребления."
 SOV_Dawn_Of_A_Better_World:0 "Рассвет лучшего мира"
 SOV_Dawn_Of_A_Better_World_desc:0 "Мы должны стремиться к созданию единой человеческой нации, открытой для всех и управляемой единым коммунистическим правительством ради общего блага. Пусть эта цель ещё далека, мы обязаны продолжать работу, даже если мечта кажется недостижимой."
 SOV_Perpetual_Warfare:0 "Состояние вечной войны"
 SOV_Perpetual_Warfare_desc:0 "Мы будем сражаться, пока в борьбе за свободу всего человечества не иссякнут последняя капля крови, последняя пуля, последняя бомба и последний клочок пищи."
 SOV_The_Polish_Question:0 "Польский вопрос"
 SOV_The_Polish_Question_desc:0 "Поляки всегда питали к нам неприязнь, и пора положить конец их дерзости. Польша скорее позволит миру погибнуть, чем даст нам освободить пролетариат или помешать Германии полностью завоевать Европу."
 SOV_3_Way_Parition_Of_Poland:0 "Раздел Польши"
 SOV_3_Way_Parition_Of_Poland_desc:0 "Мы разделим Польшу с немцами и исправим несправедливость Версаля. Чехам также передадут часть территории в гуманитарных целях, чтобы евреи и беженцы могли при желании отправиться туда. В конце концов, мы лишь поступаем правильно."
 SOV_Stalin_Cult:0 "Культ Сталина"
 SOV_Stalin_Cult_desc:0 "Поощрение культа личности товарища Сталина укрепит легитимность правительства и повысит производительность труда. После долгих лет потрясений советскому народу необходим период стабильности, и он его получит!"
 SOV_sing_katyusha_sing:0 "Пой, «Катюша», пой!"
 SOV_sing_katyusha_sing_focus:0 "Пой, «Катюша», пой!"
 SOV_sing_katyusha_sing_focus_desc:0 "Враги [ROOT.GetNameDef] скоро услышат песню, которую никогда не забудут."
 manufacturer_applies_bonus_instantly_tooltip:0 "§CЭтот производитель применяет эффект, даже если усиленные подразделения уже открыты.§!"
 SOV_mass_firearms_production:0 "Массовое производство стрелкового оружия"
 SOV_mass_firearms_production_desc:0 "Война требует винтовку в руках каждого солдата. Наша промышленность должна быть мобилизована ради этой цели."
 SOV_shocktroops:0 "Ударные войска"
 SOV_shocktroops_desc:0 "Отважные солдаты в бронежилетах могут сблизиться с противником настолько, что его артиллерийская поддержка станет бесполезной."
 SOV_copy_yaroslav_rubber_factory:0 "Скопировать Ярославский резиновый завод"
 SOV_copy_yaroslav_rubber_factory_desc:0 "Ярославский резиновый завод, построенный по технологиям, импортированным из США в начале 1930-х годов, на момент открытия был одним из лучших в мире и одним из немногих наших источников каучука. Для удовлетворения военных потребностей по всему СССР необходимо построить новые и более крупные заводы."
 SOV_tank_programs:0 "Танковые программы"
 SOV_tank_programs_desc:0 "Проанализировав действия наших лёгких танков в столкновениях с Японской империей, мы поручили танкостроительным предприятиям разработать совершенно новый тип бронетехники."
 SOV_mass_tank_production:0 "Массовое производство танков"
 SOV_mass_tank_production_desc:0 "Только резкое увеличение выпуска танков позволит одолеть врагов. На Запад! За Родину!"
 SOV_establish_tankograd:0 "Создать Танкоград"
 SOV_establish_tankograd_desc:0 "Объединив кадры и оборудование Кировского танкового завода и других предприятий с Челябинским тракторным заводом, мы создадим гигантский комплекс по производству бронетехники — Танкоград."
 SOV_tank_improvements:0 "Улучшение танков"
 SOV_tank_improvements_desc:0 "Наклонная броня позволит повысить защищённость танков без увеличения массы. В сочетании с мощным орудием это даст нам самые грозные танки в истории."
 SOV_cat_killers:0 "Убийцы кошек"
 SOV_cat_killers_desc:0 "Специализированные истребители танков наконец избавят нас от этих назойливых кошачьих."
 SOV_Go_With_Molotov:0 "Заменить Литвинова Молотовым"
 SOV_Go_With_Molotov_desc:0 "Мы должны показать немцам готовность к сотрудничеству. Для этого следует очистить министерство от евреев, подав Гитлеру соответствующий сигнал."
 SOV_French_Soviet_Reapproachment:0 "Франко-советское сближение"
 SOV_French_Soviet_Reapproachment_desc:0 "Очевидно, нацисты попытаются захватить наши земли ради своего жизненного пространства. Поэтому мы должны улучшить отношения с Францией, чтобы сдержать фашистскую угрозу."
 SOV_Help_For_France:0 "Помощь Франции"
 SOV_Help_For_France_desc:0 "Мы должны помочь новым французским друзьям развить военную промышленность, чтобы они не пали под натиском фашистов."
 SOV_Reconcile_French_Comintern:0 "Примириться с французским Коминтерном"
 SOV_Reconcile_French_Comintern_desc:0 "Следует отложить идеологические разногласия с французскими коммунистами и работать вместе ради общих целей."
 SOV_French_Soviet_Treaty:0 "Франко-советский договор"
 SOV_French_Soviet_Treaty_desc:0 "Наши исследования бронетехники зашли в тупик. Сотрудничество с французами позволит вновь создавать передовые проекты."
 SOV_Assist_The_Czechs:0 "Помочь чехам"
 SOV_Assist_The_Czechs_desc:0 "Мы должны помочь собратьям-славянам противостоять нацистскому натиску. Мы отправим инженеров и других советников для подготовки к вторжению."
 SOV_Guarantee_For_Czechoslovakia:0 "Гарантировать Чехословакию"
 SOV_Guarantee_For_Czechoslovakia_desc:0 "Мы обязаны препятствовать нацистской экспансии на каждом шагу. Нужно заявить чехам и всему миру, что их суверенитет защищён могучим Советским Союзом."
 SOV_Pressure_Poland:0 "Оказать давление на Польшу"
 SOV_Pressure_Poland_desc:0 "Мы убьём двух зайцев одним выстрелом. Нам нужен коридор снабжения в Чехословакию для переброски войск во время войны, а также необходимо исправить несправедливость Версаля. Это решение позволит добиться обеих целей."
 SOV_Warm_Water_Ports:0 "Незамерзающие порты"
 SOV_Warm_Water_Ports_desc:0 "Для развития Черноморского флота необходимо обеспечить проход через Босфор. Турция — ненадёжный сосед, а американцы и другие державы уже признали право советского народа на выход в Средиземное море. Константинополь принадлежит нам!"
 SOV_Trotsky_Was_Right:0 "Троцкий был прав"
 SOV_Trotsky_Was_Right_desc:0 "Только великий человек способен признать свою ошибку. К счастью, [SOV.GetLeader] именно таков. Ему стало ясно, что единственная надежда на будущее — агрессивное распространение коммунизма за рубежом. Мы должны возглавить освобождение мирового пролетариата."
 SOV_Support_Greek_Communists:0 "Поддержать греческих коммунистов"
 SOV_Support_Greek_Communists_desc:0 "Мы получаем срочные сообщения от греческих коммунистов, отчаянно просящих о помощи. Мы обязаны сделать всё возможное, ведь их дело — наше дело."
 SOV_Northern_Neighbors:0 "Северные соседи"
 SOV_Northern_Neighbors_desc:0 "Северные народы живут на землях, богатых природными ресурсами. Мы должны перераспределить их в пользу нуждающихся и освободить Скандинавский полуостров от капиталистического гнёта."
 SOV_A_New_Soviet_Military:0 "Новые советские вооружённые силы"
 SOV_A_New_Soviet_Military_desc:0 "Красную армию необходимо реформировать, чтобы она могла соперничать с арсеналами фашизма и капитализма. Только тогда трудящиеся всего мира будут освобождены."
 SOV_A_Modern_Military:0 "Современные вооружённые силы"
 SOV_A_Modern_Military_desc:0 "Мы должны обеспечить солдат лучшим снаряжением, чтобы они могли побеждать на поле боя."
 SOV_Early_APCs:0 "Исследовать ранние модели БТР"
 SOV_Early_APCs_desc:0 "Мы работаем над эффективными машинами для переброски мотопехоты. Пока подойдут полугусеничные бронетранспортёры."
 SOV_Modern_Military_Research:0 "Передовые военно-исследовательские учреждения"
 SOV_Modern_Military_Research_desc:0 "Наука и технологии — ключ к будущему. Без передового оружия завтрашнего дня огонь революции будет погашен."
 SOV_NKVD_Intelligence:0 "Создать разведывательную службу НКВД"
 SOV_NKVD_Intelligence_desc:0 "Теперь НКВД будет докладывать об иностранной деятельности как друзей, так и врагов."
 SOV_German_Scientists:0 "Проникнуть в немецкие ракетные исследования"
 SOV_German_Scientists_desc:0 "НКВД получил документы, которые помогут вывести наши ракетные технологии на уровень нацистов."
 SOV_The_Mig_Project:0 "Проект МиГ"
 SOV_The_Mig_Project_desc:0 "Мы получили проекты ракет и уведомили конструкторов о новых разработках. Они пообещали создать новые модели самолётов с этими реактивными двигателями."
 SOV_Manhattan:0 "Проникнуть в Манхэттенский проект"
 SOV_Manhattan_desc:0 "НКВД выяснил, что западные Союзники тайно разрабатывают новое сверхоружие в Нью-Мексико. Мы должны добыть их данные, чтобы не остаться в стороне!"
 SOV_Our_Own_B29:0 "Собственный B-29"
 SOV_Our_Own_B29_desc:0 "Американский бомбардировщик B-29 — сверхоружие, которому мы пока не можем ни противостоять, ни найти достойную замену. Нам удалось получить сведения о самолёте, и необходимо начать выпуск собственной версии, прежде чем тысячи таких машин появятся над Москвой!"
 SOV_France_In_The_Comintern:0 "Пригласить Францию в Коминтерн"
 SOV_France_In_The_Comintern_desc:0 "Теперь, когда мы нашли общий язык с французскими братьями-коммунистами, следует пригласить их в наши ряды для совместной борьбы за свободу пролетариата."
 SOV_Czechoslovakia_In_The_Comintern:0 "Пригласить Чехословакию в Коминтерн"
 SOV_Czechoslovakia_In_The_Comintern_desc:0 "Следует пригласить наших чешских друзей в Коминтерн. Они получат нашу защиту, а мы сможем сдержать расширение немецкого влияния в Центральной Европе."
 SOV_Red_Marines:0 "Красная морская пехота"
 SOV_Red_Marines_desc:0 "Мы должны подготовить молодых морских пехотинцев так, чтобы они стали лучшими в мире. Раньше наши программы подготовки спецназа отставали от зарубежных. Больше мы этого не допустим."
 SOV_Red_Paratroopers:0 "Красные десантники"
 SOV_Red_Paratroopers_desc:0 "Наши десантники с превосходной подготовкой и тактикой обрушатся с небес и принесут врагам невообразимые разрушения."
 SOV_Russian_Democracy:0 "Демократия в СССР"
 SOV_Russian_Democracy_desc:0 "Народ всё громче требует демократии. Теперь руководящие органы должны удовлетворить эти требования и провести выборы. Это необходимо сделать до того, как страну разорвут раскол и революция."
 SOV_A_Fascist_State:0 "Поощрять рост фашизма"
 SOV_A_Fascist_State_desc:0 "Для защиты народа от иностранной агрессии нужна сильная власть, но коммунизм не является решением. Мы должны отойти от этого безбожного режима и принять новую форму правления."
 SOV_Normalize_Relations_With_The_West:0 "Нормализовать отношения с Западом"
 SOV_Normalize_Relations_With_The_West_desc:0 "Необходимо развивать дипломатические отношения с западными странами и постараться оставить события прошлого позади."
 SOV_American_Cooperation:0 "Сотрудничество с США"
 SOV_American_Cooperation_desc:0 "Как одна демократия другой, американцы могут серьёзно помочь нам с экономическим развитием, пока мы выводим Россию в современную эпоху."
 SOV_American_Industrial_Assistance:0 "Американская промышленная помощь"
 SOV_American_Industrial_Assistance_desc:0 "По мере улучшения отношений с американцами экономика переживает подъём, а компании с обеих сторон начинают инвестировать в обе страны."
 SOV_Moving_Forward:0 "Двигаться вперёд"
 SOV_Moving_Forward_desc:0 "Нужно вкладываться в научное сотрудничество с другими демократическими правительствами мира. Вместе нам наверняка будет гораздо легче защититься от угроз, чем поодиночке."
 SOV_New_World_Order:0 "Новый мировой порядок"
 SOV_New_World_Order_desc:0 "Старый мировой порядок, построенный на империях и монархиях, прогнил и рушится у нас на глазах. Немцы пытаются перестроить мир для арийской расы, а империалисты стремительно остаются в прошлом. Истинные демократии мира должны объединиться ради защиты свободы для всего человечества."
 SOV_Develop_Oil_Concern:0 "Развивать нефтяную отрасль"
 SOV_Develop_Oil_Concern_desc:0 "Нам необходимо больше вкладывать в разведку месторождений и строительство нефтеперерабатывающих заводов, чтобы использовать огромные запасы нефти на Кавказе."
 SOV_Look_Eastward:0 "Обратить взор на Восток"
 SOV_Look_Eastward_desc:0 "Мы должны опасаться агрессии на востоке. Пора укрепить там нашу власть и подготовить оборону."
 SOV_Non_Aggression_With_Japan:0 "Пакт о ненападении с Японией"
 SOV_Non_Aggression_With_Japan_desc:0 "Мы можем договориться с японцами и предотвратить насилие и ненужное кровопролитие."
 SOV_End_Of_Non_Aggression_With_Japan:0 "Разорвать пакт о ненападении с Японией"
 SOV_End_Of_Non_Aggression_With_Japan_desc:0 "Наше соглашение с Японией было ошибкой. Не следовало заключать подобный договор. Пора сообщить японцам, что мы выходим из него."
 SOV_Develop_The_Ural_Moutain_Region:0 "Развивать Уральский регион"
 SOV_Develop_The_Ural_Moutain_Region_desc:0 "В Уральских горах множество месторождений, разработка которых даст работу бедным крестьянам и руду простаивающим заводам."
 SOV_Further_Development_of_Ural_Mountain_Mining_Facilities:0 "Уральские горнодобывающие предприятия"
 SOV_Further_Development_of_Ural_Mountain_Mining_Facilities_desc:0 "Чем больше руды, тем лучше."
 SOV_Increase_Productivity:0 "Повысить производительность труда"
 SOV_Increase_Productivity_desc:0 "Мы должны побуждать рабочих трудиться усерднее и отказаться от личного удовлетворения ради коллектива. Они должны понимать, что страна зависит от них!"
 SOV_Comforts_For_The_People:0 "Блага для народа"
 SOV_Comforts_For_The_People_desc:0 "Мы довели людей до предела ради строительства светлого будущего. Теперь им пора воспользоваться плодами своего труда. Мы расширим производство товаров народного потребления и дадим людям столь необходимые удобства."
 SOV_Military_Expansion:0 "Расширение вооружённых сил"
 SOV_Military_Expansion_desc:0 "Мы расширим армию для защиты от иностранной агрессии. Пока капиталистические страны строят козни и копят богатства, мы будем усердно накапливать вооружение для защиты народа."
 SOV_Establish_Mobile_Construction_Units:0 "Создать мобильные строительные части"
 SOV_Establish_Mobile_Construction_Units_desc:0 "Нужно организовать группы патриотически настроенных граждан, готовых в военное время ремонтировать инфраструктуру и промышленность."
 SOV_Weapons_Of_War:0 "Оружие войны"
 SOV_Weapons_Of_War_desc:0 "Одни сражаются оружием, другие — умом. Но одно несомненно: служить должны все."
 SOV_Mass_Immunizations:0 "Массовая иммунизация"
 SOV_Mass_Immunizations_desc:0 "Увеличение финансирования Народного комиссариата здравоохранения не только улучшит санатории и больницы, но и обеспечит недостающую медицинскую помощь сельским районам нашей огромной страны."
 SOV_Liberalize_Our_Regime:0 "Либерализовать режим"
 SOV_Liberalize_Our_Regime_desc:0 ""
 SOV_Founding_the_UN:0 "Основать ООН"
 SOV_Founding_the_UN_desc:0 ""
 SOV_Scientific_Cooperation:0 "Научное сотрудничество"
 SOV_Scientific_Cooperation_desc:0 ""
 SOV_Fascist_Counter_Coup:0 "Фашистский контрпереворот"
 SOV_Fascist_Counter_Coup_desc:0 ""
 SOV_iron_curtain:0 "Железный занавес"
 SOV_iron_curtain_desc:0 "Наша сфера влияния глубоко проникает в Европу. Чтобы обеспечить безопасность недавно созданных коммунистических режимов в зависимых странах, мы установим жёсткое прямое управление из Москвы и откроем им глаза на ужасное угнетение рабочих западными державами."
 SOV_expand_western_spy_rings:0 "Расширить шпионские сети на Западе"
 SOV_expand_western_spy_rings_desc:0 "По всему миру у нас немало сторонников. Их открытая поддержка нашего дела может ослабить капиталистов и посеять разлад в их союзе."
 SOV_comecon:0 "СЭВ"
 SOV_incite_a_greek_revolution:0 "Нарушить соглашение о процентах"
 SOV_incite_a_greek_revolution_desc:0 "Британцы вынудили нас подписать соглашение о процентах, ограничивавшее наше влияние в Греции десятью процентами. Поддержка фашизма в Греции и нынешняя промышленная и экономическая слабость Британии сыграют нам на руку, если действовать быстро."
 SOV_overthrow_weak_king:0 "Свергнуть слабого короля"
 SOV_overthrow_weak_king_desc:0 "Нынешнее положение [YUG.GetNameDef] неприемлемо с точки зрения рабочих и крестьян: высокие налоги, фальсификация выборов и повсеместная коррупция мешают бедной стране нормально развиваться. Напряжение уже велико — достаточно небольшого происшествия, и революция начнётся и там!"
 SOV_take_out_tito:0 "Устранить Тито"
 SOV_take_out_tito_desc:0 "Ревизионист-предатель, правящий югославским народом, является врагом всего, за что выступает Советский Союз. Тито показал, что доверяет Западу больше, чем собственным идеологическим союзникам, и за это должен быть уничтожен."
 SOV_facilitate_a_balkan_federation:0 "Содействовать созданию Балканской федерации"
 SOV_facilitate_a_balkan_federation_desc:0 "Тито проявил себя хитрым воином, сильным лидером и могущественным союзником. Многие пытались объединить Балканы, но терпели поражение из-за слабого руководства. С нашей помощью Тито наконец докажет, что это возможно."
 SOV_sino_soviet_treaty:0 "Советско-китайский договор"
 SOV_sino_soviet_treaty_desc:0 "Наша помощь принесла плоды: Мао Цзэдун одержал победу и, похоже, готов к взаимному сотрудничеству под знаменем Коминформа. Отпразднуем это историческое советско-китайское братство!"
 SOV_support_vietnamese_revolutionaries:0 "Поддержать вьетнамских революционеров"
 SOV_support_vietnamese_revolutionaries_desc:0 "Империалисты и колонизаторы могут считать, что имеют преимущество над трудящимися Азии. Но с новым южным союзником мы способны разжечь восстание ради освобождения рабочих Индокитая. Им нужны лишь наша промышленная поддержка и вооружение."
 SOV_interest_in_cuba:0 "Интерес к Кубе"
 SOV_interest_in_cuba_desc:0 "Чтобы нанести удар в самое сердце капитализма, нам нужен подходящий плацдарм. Куба, расположенная рядом с США, подходит идеально!"
 SOV_return_dalian:0 "Вернуть Далянь"
 SOV_return_dalian_desc:0 "Мы вернём бывший Порт-Артур законному китайскому правительству в знак поддержки. Унижения китайского государства должны прекратиться: эпоха договорных портов закончена, и мы продемонстрируем это всему миру!"
 SOV_a_cold_war:0 "Холодная война"
 SOV_a_cold_war_desc:0 "Мир разделён на два блока, и становится всё очевиднее, что открытая война окажет катастрофическое воздействие на планету и будущее человеческой цивилизации. Мы сосредоточимся на восстановлении страны, превосходстве над капиталистами в науке и производстве, одновременно тайно поддерживая рабочие революции по всему миру."
 SOV_extend_the_curtain_outwards:0 "Расширить железный занавес"
 SOV_extend_the_curtain_outwards_desc:0 "Сторонники завербованы, планы сражений составлены, пилоты, танкисты и солдаты заняли позиции — последний удар подготовлен. Время пришло! Товарищи, несите революцию на Запад во имя Родины!"
 SOV_cold_war_idea:0 "Холодная война"
 SOV_cold_war_idea_desc:0 "Высокая геополитическая напряжённость между двумя существующими блоками вынуждает отказаться от прямых крупномасштабных боёв и сосредоточиться на внутренних делах, росте промышленности и развитии исследований. Однако мы всё ещё можем поддерживать войны чужими руками..."
 SOV_motherland_defense:0 "Оборона Родины"
 SOV_motherland_defense_desc:0 "Несмотря на героическое сопротивление и разгром лучших дивизий и авиационных частей врага, противник продолжает наступать, бросая на фронт свежие силы. Над Родиной нависла смертельная опасность. Все силы народа — на уничтожение врага! Вперёд, к победе!"
 SOV_defense_of_leningrad:0 "Лужский оборонительный рубеж"
 SOV_defense_of_leningrad_desc:0 "Культурный центр Родины, славный город [195.getName], является логистическим и оперативным центром Балтийского и Приполярного регионов! Мобилизовать всех и подготовить оборону — город не должен пасть любой ценой! Только так мы сохраним северный маршрут ленд-лиза, по которому Родина получает необходимые промышленные и военные материалы."
 SOV_defense_of_stalingrad:0 "Волжский оборонительный рубеж"
 SOV_defense_of_stalingrad_desc:0 "Враги продвинулись глубоко на нашу территорию и теперь угрожают промышленному сердцу в бассейне Волги! Его потеря станет для нас катастрофой в политическом и экономическом отношении. [217.getName] не должен пасть! Поднять народ и создать оборонительный периметр вокруг города!"
 SOV_purchase_allied_weaponry:0 "Закупить вооружение Союзников"
 SOV_purchase_allied_weaponry_desc:0 "Несмотря на незрелые и устаревшие исторические разногласия между нашими странами, несомненно, что [ENG.getNameDef], [USA.getNameDef] и [SOV.getNameDef] разделяют множество целей по сохранению мира и процветания! Временно отложив разногласия и смягчив напряжённую политическую обстановку, мы получим некоторые краткосрочные преимущества в этой разрушительной войне."
 SOV_lease_british_planes:0 "Арендовать британские самолёты"
 SOV_lease_british_planes_desc:0 "Королевские ВВС, несомненно, добились заметных успехов в авиастроении за последние годы. Возможно, аренда части их техники даст нам дополнительное преимущество над угрожающим противником."
 SOV_till_the_bitter_end:0 "До победного конца"
 SOV_till_the_bitter_end_desc:0 "Мы должны показать миру глубину нашего отчаяния и собрать всё оставшееся для продолжения войны!"
 SOV_till_the_bitter_end_tt:0 "Страны мира будут охотнее поддерживать нашу борьбу против немецкого фашизма."
 SOV_invite_romania:0 "Пригласить Румынию"
 SOV_invite_romania_desc:0 "Румыния должна вступить в ряды стран, сражающихся за трудящихся всего мира!"
 SOV_send_ultimatum_to_baltic_countries:0 "Направить ультиматум странам Балтии"
 SOV_send_ultimatum_to_baltic_countries_desc:0 "Ультиматум позволит оказать давление на правительства стран Балтии и заставить их принять наши требования."
 socialism_in_one_country:0 "Социализм в отдельно взятой стране"
 socialism_in_one_country_desc:0 "[SOV.GetLeader] считает, что Советский Союз должен сначала окрепнуть и лишь затем распространять марксистскую революцию за рубежом."
 world_trotskyite_revolution:0 "Мировая троцкистская революция"
 world_trotskyite_revolution_desc:0 "Только великий человек способен признать ошибку, и [SOV.GetLeader] именно таков. Зажжём огни революции!"
 bolshevik_militarist:0 "Большевистский милитарист"
 bolshevik_militarist_desc:0 "Троцкий верит в мировую коммунистическую революцию. Он обладает видением и считает, что пора положить конец рабству трудящихся всего мира!"
 NKVD_Agency:0 "Разведывательная служба НКВД"
 NKVD_Agency_desc:0 "Мы разместим шпионов повсюду. Любое слово, произнесённое в посольстве или исследовательском учреждении, станет нам известно."
 women_in_the_military_focus:0 "Женщины-солдаты"
 women_in_the_military_focus_desc:0 "Женщины могут служить во вспомогательных ролях на передовой и на ограниченных боевых должностях. Это высвободит необходимые людские ресурсы и, возможно, заставит мужчин сражаться ещё упорнее."
 home_of_revolution2:0 "Родина революции"
 home_of_revolution2_desc:0 "Товарищи, разгромив мерзких троцкистских контрреволюционеров, мы смогли сосредоточиться на защите революции. Наша цель, надежда и лозунг — социализм в отдельно взятой стране. Мы построим процветающую социалистическую утопию здесь, в Советском Союзе, и остальной мир неизбежно последует нашему примеру."
 home_of_revolution3:0 "Родина революции"
 home_of_revolution3_desc:0 "Товарищи, разгромив мерзких троцкистских контрреволюционеров, мы смогли сосредоточиться на защите революции. Наша цель, надежда и лозунг — социализм в отдельно взятой стране. Мы построим процветающую социалистическую утопию здесь, в Советском Союзе, и остальной мир неизбежно последует нашему примеру."
 SOV_iron_curtain_idea:0 "Железный занавес"
 SOV_iron_curtain_idea_desc:0 "Сейчас мы укрепляем и закрепляем власть над связанными с нами зависимыми странами."
 SOV_defense_of_the_motherland:0 "Оборона Родины"
 SOV_defense_of_the_motherland_desc:0 "Наша великая страна никогда не падёт и не сдастся — мы обязаны защищать Родину любой ценой!\n\n§RЭтот национальный дух исчезнет после окончания войны.§!"
 SOV_comecon_support:0 "Поддержка СЭВ"
 SOV_comecon_support_desc:0 "Советские гражданские и военные специалисты поддерживают нашу страну посредством идеологического просвещения и экономической помощи."
 SOV_comecon_idea:0 "СЭВ"
 SOV_comecon_idea_desc:0 "Советская экономика значительно укрепляется благодаря экономическим соглашениям и промышленным связям с союзниками."
 SOV_support_greece:0 "Поддержка в гражданской войне в Греции"
 SOV_support_greece_desc:0 "Борьба за свободу и освобождение греческого народа от идеологической угрозы."
 SOV_civil_war_ignited:0 "[ROOT.GetAdjective] вопрос"
 SOV_civil_war_ignited_desc:0 "Хотя конфликт был разожжён извне, правительство [ROOT.GetLeader] считает его исключительно [ROOT.GetAdjective] делом, а любое иностранное вмешательство принесёт стране разрушение."
 SOV_reinstitute_okhrana:0 "Восстановить Охранное отделение"
 SOV_reinstitute_okhrana_desc:0 "В борьбе за свержение советского режима мы должны прочно удерживать контролируемые территории и рассмотреть отправку агентов на советскую территорию для подрыва врага всеми возможными способами. Пора вернуть Охранное отделение — теперь современное и более эффективное."
 SOV_siberian_forest_soldiers_focus:0 "Через тундру и леса..."
 SOV_siberian_forest_soldiers_focus_desc:0 "Между нами и сердцем прогнившего советского режима лежат необъятные холодные леса и пустоши тундры. Наши отважные герои должны быть готовы к испытаниям, которых требует выживание на этих землях."
 SOV_siberian_forest_soldiers_idea:0 "Сибирские лесные солдаты"
