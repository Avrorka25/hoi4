 lit_baltic_research_name:0 "Исследовательская группа Балтийского альянса"
 lit_baltic_research_desc:0 "Знание — сила, единство — мощь, один за всех и все за одного!"
 LIT_event.1.t:0 "Победа коммунистов"
 LIT_event.1.d:0 "После победы на выборах Коммунистическая партия Литвы возглавила страну. Для значительной части населения это стало неожиданностью: новое правительство резко отличается от всех предыдущих, действует гораздо радикальнее и намерено перевести страну на коммунистическую экономику. Литва открывает совершенно новую главу своей истории."
 LIT_event.1.a:0 "Вперёд, в XX век"
 LIT_event.2.t:0 "[SOV.getAdjective] вооружённые силы покидают Вильнюс"
 LIT_event.2.desc:0 "После заключения соглашения с Германией о судьбе Польши [SOV.getleader] справедливо решил, что Вильнюс не является частью Польши, и передал нам контроль над столицей и её окрестностями.\n\nДля встречи наших вооружённых сил была возведена огромная арка, а литовцы приветствуют войска, проходящие по улицам. Остальные общины также рады избавиться от [SOV.getAdjective] власти."
 LIT_event.2.a:0 "Великий день!"
 lithuania_purchase_ships.1.t:0 "[From.GetNameDefCap] хочет приобрести [Root.GetAdjective] корабли"
 lithuania_purchase_ships.1.desc:0 "[From.GetAdjective] правительство, осознавая отсутствие полноценного флота, объявило тендер на покупку [Root.GetAdjective] кораблей. Если мы согласимся построить нужные суда, они предоставят товары, которые можно использовать в собственных целях."
 lithuania_purchase_ships.1.a:0 "Это будет выгодно обеим сторонам."
 lithuania_purchase_ships.1.a_tt:0 "После выбора сделки [POR.GetNameDefCap] мы получим в качестве оплаты §Y1§! §Yгражданскую фабрику§! вне карты."
 lithuania_purchase_ships.1.b:0 "Нас это не интересует."
 lithuania_purchase_ships.2.t:0 "[From.GetNameDefCap] соглашается построить наши корабли"
 lithuania_purchase_ships.2.desc:0 "[From.GetAdjective] правительство согласилось построить корабли для [Root.GetAdjective] флота и предложило нам два варианта на выбор."
 lithuania_purchase_ships.2.a:0 "Купить подводные лодки."
 lithuania_purchase_ships.2.b:0 "Купить эсминцы."
 lithuania_purchase_ships.3.t:0 "[From.GetNameDefCap] отказывается строить наши корабли"
 lithuania_purchase_ships.3.desc:0 "[From.GetNameDefCap] отклонило наше предложение приобрести корабли [From.GetNameDefCap] для флота.\nПридётся искать другие страны, готовые принять сделку, либо сосредоточиться на развитии собственных верфей, чтобы больше не зависеть от иностранных держав при создании могучего флота [Root.GetAdjective]."
 lithuania_purchase_ships.3.a:1 "Обойдёмся без них."
 lithuania_purchase_ships.4.t:0 "Строительство завершено — подводные лодки"
 lithuania_purchase_ships.4.desc:0 "После почти года строительства три заказанные подводные лодки прошли морские испытания и наконец готовы официально вступить в строй.\nСуда находятся в [Root.GetAdjective] порту, а экипажи ожидают приказов."
 lithuania_purchase_ships.4.a:0 "Хорошо."
 lithuania_purchase_ships.4.a_tt:0 "Три подводные лодки добавлены в резервный флот"
 lithuania_purchase_ships.5.t:0 "Строительство завершено — эсминцы"
 lithuania_purchase_ships.5.desc:0 "После почти года строительства два заказанных эсминца прошли морские испытания и наконец готовы официально вступить в строй.\nСуда находятся в [Root.GetAdjective] порту, а экипажи ожидают приказов."
 lithuania_purchase_ships.5.a:0 "Хорошо."
 lithuania_purchase_ships.5.a_tt:0 "Два эсминца добавлены в резервный флот"
 lithuania.10.t:0 "Общественное возмущение"
 lithuania.10.desc:0 "Невыполнение обещания провести выборы вызвало массовую реакцию оппозиции и общества, поставив страну на грань гражданской войны. Необходимо действовать быстро и подавить возмущение."
 lithuania.10.a:0 "Ввести армию"
 lithuania.10.b:0 "Натравить вольдемаринников"
 lithuania.12.t:0 "Вольдемаринники восстанавливают порядок"
 lithuania.12.desc:0 "Члены организации вольдемаринников, которых мы направили против оппозиции, жестоко подавили несогласных, и ситуация, похоже, несколько стабилизировалась."
 lithuania.12.a:0 "Хорошо, теперь избавиться от них."
 lithuania.13.t:0 "Кровавое [Root.GetDateText]"
 lithuania.13.desc:0 "Решение отправить армию для подавления несогласных привело к массовым жертвам среди мирного населения, серьёзно подорвало стабильность страны и вызвало отставку многих военных чиновников."
 lithuania.13.a:0 "Прискорбно."
 lithuania.14.t:0 "Переворот вольдемаринников"
 lithuania.14.desc:0 "Оказалось, что вольдемаринники не намерены мириться с принудительным роспуском. В ответ вольдемаристы и сочувствующие им военные руководители организовали переворот и свергли правительство. Президент Сметона бежал из страны, фактически оставив власть Юозасу Тубялису, который немедленно подал в отставку."
 lithuania.14.a:0 "Рассвет новой эпохи"
 lithuania.15.t:0 "Буржуазное правительство свергнуто"
 lithuania.15.desc:0 "Нам удалось успешно свергнуть угнетающее правительство. Да здравствует пролетариат!"
 lithuania.15.a:0 "Рассвет новой эпохи"
 lithuania.16.t:0 "Неудачная попытка переворота"
 lithuania.16.desc:0 "Нам не удалось свергнуть угнетающее правительство. Вооружённые силы мобилизованы, а страна погрузилась в гражданскую войну."
 lithuania.16.a:0 "Революция победит."
 lithuania.17.t:0 "Литовские коммунисты просят поддержки"
 lithuania.17.desc:0 "Наши литовские товарищи готовятся свергнуть правительство и просят помощи в виде снаряжения и припасов. В случае успеха Литва наверняка станет близким другом пролетариата."
 lithuania.17.a:0 "Предоставить более чем достаточную помощь"
 lithuania.17.b:0 "Поддержать их дело"
 lithuania.17.c:0 "Передать наилучшие пожелания"
 lithuania.18.t:0 "СССР бросает нас"
 lithuania.18.desc:0 "Советское правительство сообщило Снечкусу, что не предоставит нам оружие."
 lithuania.18.a:0 "Предатели."
 lithuania.19.t:0 "Выборы в Четвёртый сейм"
 lithuania.19.desc:0 "Срок проведения выборов в Четвёртый сейм истёк, голоса подсчитаны, а победитель определён."
 lithuania.19.a:0 "Победа христианских демократов"
 lithuania.19.b:0 "Победа социал-демократов"
 lithuania.21.t:0 "«Железный волк» выходит из-под контроля"
 lithuania.21.desc:0 "Стычки между представителями враждующих идеологических организаций, этнических меньшинств и членами «Железного волка» происходят регулярно. То, что мы приняли за очередной подобный случай, переросло в полномасштабный бунт: сотни вольдемаристов и мирных жителей жестоко сталкиваются с различными меньшинствами по всему Каунасу. Беспорядки лишь растут и становятся всё кровавее; если не вмешаться сейчас, последствия будут чудовищными."
 lithuania.21.a:0 "Не вмешиваться"
 lithuania.21.b:0 "Вмешаться"
 lithuania.22.t:0 "Каунасский погром"
 lithuania.22.desc:0 "Потасовка, начавшаяся в одном квартале, полностью вышла из-под контроля и превратилась в жестокий бунт невиданного для Литвы масштаба. Точное число жертв ещё неизвестно, но, по оценкам, в резне погибло не менее нескольких тысяч человек."
 lithuania.22.a:0 "Сами напросились."
 lithuania.23.t:0 "Каунасский инцидент"
 lithuania.23.desc:0 "Обычно мы используем «Железного волка» для подавления несогласных, но на этот раз армии пришлось подавлять саму организацию. Военные быстро разогнали участников столкновений, однако ценой жизней наших граждан и общественной поддержки."
 lithuania.23.a:0 "Какой беспорядок."
 lithuania.27.t:0 "Комиссия ЛНП"
 lithuania.27.desc:0 "Первая комиссия ЛНП стала важной вехой в истории Литвы, и теперь необходимо определить её будущее."
 lithuania.27.a:0 "Усилить патриотическое крыло"
 lithuania.27.b:0 "Усилить радикальное крыло"
 lithuania.31.t:0 "Электрификация Литвы"
 lithuania.31.desc:0 "Электрификация жизненно важна для экономического роста, индустриализации и национальной безопасности, но иностранные монополисты мешают сделать электричество дешёвым и доступным, выводя за границу деньги трудолюбивого народа Литвы. Есть два варианта. Первый — построить несколько угольных электростанций, что увеличит предложение энергии, но потребует импортировать огромное количество иностранного угля. Второй — попытаться возвести гидроэлектростанцию на Немане. Подобное в Литве ещё не предпринималось и потребует поиска зарубежных партнёров."
 lithuania.31.a:0 "Какой смысл в электростанциях без угля?"
 lithuania.31.b:0 "Нельзя рисковать."
 lithuania.32.t:0 "Финансовые проблемы"
 lithuania.32.desc:0 "Проект электрификации столкнулся с серьёзными финансовыми трудностями. Можно вложить дополнительные ресурсы, рискуя потерять их в случае провала, но отступление сейчас может обернуться политической катастрофой."
 lithuania.32.a:0 "Мы должны выстоять."
 lithuania.32.b:0 "Отказаться от проекта"
 lithuania.33.t:0 "Проект заброшен"
 lithuania.33.desc:0 "Растущие расходы вынудили нас отказаться от проекта и демонтировать уже построенное."
 lithuania.33.a:0 "Так было необходимо."
 lithuania.34.t:0 "Проект завершён"
 lithuania.34.desc:0 "Несмотря на расходы, нам удалось завершить проект вовремя."
 lithuania.34.a:0 "Превосходно."
 lithuania.35.t:0 "Рука помощи"
 lithuania.35.desc:0 "Перед началом проекта необходимо решить, будем ли мы осуществлять его самостоятельно или обратимся за иностранной помощью."
 lithuania.35.a:0 "Мы справимся сами."
 lithuania.35.b:0 "Искать инвесторов в Италии"
 lithuania.36.t:0 "Литва просит поддержки"
 lithuania.36.desc:0 "Литовское посольство в Риме предложило помочь в строительстве гидроэлектростанции в Каунасе. Это хорошая возможность поддержать идеологических союзников на севере, но из-за большого расстояния помощь окажется довольно дорогой."
 lithuania.36.a:0 "Помочь им"
 lithuania.36.b:0 "Отказать"
 lithuania.48.t:0 "Итальянцы соглашаются"
 lithuania.48.desc:0 "Итальянское консульство в Каунасе сообщило о готовности поддержать строительство гидроэлектростанции."
 lithuania.48.a:0 "Превосходно."
 lithuania.49.t:0 "[FROM.Capital.GetName] отказывает в поддержке"
 lithuania.49.desc:0 "[From.GetAdjective] консульство в [ROOT.Capital.GetName] сообщило об отказе поддержать наше начинание."
 lithuania.49.a:0 "Нам лучше справиться самим."
 lithuania.37.t:0 "Финансовые проблемы"
 lithuania.37.desc:0 "Проект электрификации столкнулся с серьёзными финансовыми трудностями. Можно вложить дополнительные ресурсы, рискуя потерять их в случае провала, но отступление сейчас может обернуться политической катастрофой."
 lithuania.37.b:0 "Мы должны выстоять."
 lithuania.37.a:0 "Отказаться от проекта"
 lithuania.38.t:0 "Катастрофа на Немане"
 lithuania.38.desc:0 "Строившаяся гидроэлектростанция обрушилась, вызвав разрушительное наводнение, которое сильно повредило Каунас."
 lithuania.38.a:0 "Это была ошибка."
 lithuania.39.t:0 "Отчёт о ходе работ"
 lithuania.39.desc:0 "Строительство гидроэлектростанции идёт успешно, самые трудные задачи завершены, и ожидается, что проект будет закончен в течение следующих двух лет."
 lithuania.39.a:0 "Большой успех."
 lithuania.40.t:0 "Гидроэлектростанция завершена"
 lithuania.40.desc:0 "Строительство гидроэлектростанции полностью завершено, объект введён в эксплуатацию и будет производить большое количество электроэнергии без необходимости импортировать уголь."
 lithuania.40.a:0 "Большой успех."
 lithuania.41.t:0 "Битва за рождаемость"
 lithuania.41.desc:0 "Несмотря на всё величие, Литва стоит на пороге демографического кризиса. Трудности с ассимиляцией меньшинств и низкие темпы роста населения представляют серьёзную угрозу будущему страны. Поэтому мы обязаны всеми силами поощрять рост литовских семей."
 lithuania.41.a:0 "Приступим к составлению проекта."
 lithuania.42.t:0 "Встреча с Гринюсом"
 lithuania.42.desc:0 "Когда была объявлена программа повышения рождаемости, её авторы предложили множество мер: продвижение традиционных семейных ценностей, увольнение женщин с государственных предприятий, налог на холостяков, продвижение по службе только женатых мужчин и многое другое. Эти идеи резко раскритиковал бывший президент Гринюс, который, несмотря на неприязнь к нашей идеологии, предложил альтернативу: снижение материнской и детской смертности и бесплатный уход за детьми. Это позволит повысить рождаемость без ограничения гражданских прав женщин."
 lithuania.42.a:0 "Принять реформы Гринюса"
 lithuania.42.b:0 "Отклонить реформы Гринюса"
 lithuania.43.t:0 "Возмущение в партии"
 lithuania.43.desc:0 "Известие о вкладе президента Гринюса в подготовленные меры вызвало массовое возмущение внутри партии. Многие заявляют, что это угрожает социализацией Литвы и является попыткой большевистского проникновения. Несмотря на абсурдность обвинений, продолжение реформ грозит политическим расколом."
 lithuania.43.a:0 "Игнорировать недовольство"
 lithuania.43.b:0 "Отменить реформы"
 lithuania.44.t:0 "Разработана политика повышения рождаемости"
 lithuania.44.desc:0 "Мы завершили разработку реформ, направленных на увеличение темпов роста населения страны и основанных на схожих мерах, принятых в Италии."
 lithuania.44.a:0 "Большой успех."
 lithuania.45.t:0 "Разработаны реформы здравоохранения и ухода за детьми"
 lithuania.45.desc:0 "Мы завершили разработку реформ, направленных на рост населения путём снижения материнской и детской смертности. Они встретили резкую критику и ещё должны доказать свою эффективность."
 lithuania.45.a:0 "Мы приняли правильное решение."
 lithuania.46.t:0 "Реформы здравоохранения приносят плоды"
 lithuania.46.desc:0 "Реформы оказались чрезвычайно успешными: темпы роста населения повысились, а дополнительным преимуществом стало расширение участия женщин в экономической и военной жизни страны."
 lithuania.46.a:0 "Большой успех."
 lithuania.47.t:0 "СССР снабжает нас снаряжением"
 lithuania.47.desc:0 "СССР предоставил снаряжение, необходимое для свержения Сметоны."
 lithuania.47.a:0 "Отличные новости!"
 lithuania.80.t:0 "Литва предлагает расширить сотрудничество"
 lithuania.80.desc:0 "Сегодня в [Root.Capital.GetName] прибыл [LIT.GetAdjective] посланник с предложением создать особую экономическую зону между нашими странами. Это может привести к частичной экономической интеграции и расширению [Root.GetAdjective] промышленности на их рынке, однако дешёвое [LIT.GetAdjective] зерно может вытеснить местных фермеров."
 lithuania.80.a:0 "Дальнейшая экономическая интеграция принесёт пользу всем!"
 lithuania.80.b:0 "Мы не можем принять такое предложение."
 lithuania.81.t:0 "[From.Owner.GetName] соглашается на экономическое сотрудничество"
 lithuania.81.desc:0 "[From.Owner.GetAdjective] посол сообщил о заинтересованности в нашем предложении. Следует немедленно приступить к укреплению связей."
 lithuania.81.a:0 "Пусть свободная торговля принесёт пользу всем!"
 lithuania.82.t:0 "[From.Owner.GetName] отказывается от экономического сотрудничества"
 lithuania.82.desc:0 "[From.Owner.GetAdjective] посол отверг любые предложения о дальнейшей экономической интеграции с нашей страной."
 lithuania.82.a:0 "Какая жалость."
 lithuania.90.t:0 "Литва требует Вильнюс"
 lithuania.90.d:0 "Нашему посольству во Франции литовские дипломаты предъявили ультиматум с требованием передать контроль над Вильнюсским регионом."
 lithuania.90.a:0 "У нас нет выбора."
 lithuania.90.b:0 "Пусть приходят."
 lithuania.91.t:0 "[From.Owner.GetName] соглашается"
 lithuania.91.d:0 "Наше требование выполнено, и противник уступил контроль над Вильнюсом и прилегающими территориями."
 lithuania.91.a:0 "Отличные новости."
 lithuania.92.t:0 "[From.Owner.GetName] отказывается"
 lithuania.92.d:0 "Наше требование не выполнено, а противник усилил военное присутствие в Вильнюсе и окружающих районах."
 lithuania.92.a:0 "Это решение повлечёт серьёзные последствия."
 lithuania.93.t:0 "Катастрофическая операция"
 lithuania.93.d:0 "Наши войска понесли тяжёлые потери и не сумели захватить ни значительных территорий, ни сам Вильнюс."
 lithuania.93.a:0 "Этого не может быть!"
 lithuania.94.t:0 "Успешная операция"
 lithuania.94.d:0 "Наши войска захватили Вильнюс и окрестности, нанеся противнику тяжёлые потери. Теперь, когда город прочно находится под нашим контролем, а враг разбит, необходимо определить дальнейшие действия."
 lithuania.94.a:0 "Поднять наш флаг над башней Гедимина"
 lithuania.94.b:0 "Необходимо готовиться к польскому возмездию."
 lithuania.95.t:0 "Неудачная операция"
 lithuania.95.d:0 "Наши войска добились значительных успехов и понесли небольшие потери, но не смогли захватить Вильнюс. Необходимо определить дальнейшие действия."
 lithuania.95.a:0 "Готовиться к польскому возмездию"
 lithuania.95.b:0 "Нужно ударить сейчас!"
 lithuania.96.t:0 "Вильно захвачен"
 lithuania.96.d:0 "Наши гарнизоны в Вильно были разгромлены вероломным внезапным нападением литовцев. Необходимо определить дальнейшие действия."
 lithuania.96.a:0 "Пусть забирают."
 lithuania.96.b:0 "Невыносимо!"
 lithuania.97.t:0 "Литовцы отбиты"
 lithuania.97.d:0 "Наши храбрые гарнизоны в Вильно отбили и разгромили внезапное литовское нападение. Теперь нужно решить, что делать дальше. Можно отомстить за предательство, ударив по Литве и предотвратив будущие вторжения, либо использовать победу и укрепившееся положение для заключения выгодного соглашения и перенаправить необходимые ресурсы на другие задачи."
 lithuania.97.a:0 "Потребовать дипломатического урегулирования"
 lithuania.97.b:0 "Ударить, пока они слабы."
 lithuania.98.t:0 "Внезапное нападение Литвы"
 lithuania.98.d:0 "Наши гарнизоны у литовской границы были отброшены внезапной атакой, но удержались на окраинах Вильно, нанеся противнику тяжёлые потери. Теперь необходимо выбрать дальнейшие действия: отомстить ударом по Литве, добиваться соглашения и освободить ресурсы для других нужд либо сохранить статус-кво."
 lithuania.98.a:0 "Сохранить статус-кво"
 lithuania.98.b:0 "Потребовать дипломатического урегулирования"
 lithuania.98.c:0 "Этого достаточно для объявления войны."
 lithuania.99.t:0 "Польша требует дипломатического урегулирования"
 lithuania.99.d:0 "После нашего недавнего нападения польское правительство потребовало дипломатически урегулировать продолжающийся кризис."
 lithuania.99.a:0 "Согласиться на их требования"
 lithuania.99.b:0 "Отвергнуть их требования"
 lithuania.100.t:0 "Литва отступает"
 lithuania.100.d:0 "Литовское правительство согласилось на наши требования и отказалось от всех притязаний на спорную территорию."
 lithuania.100.a:0 "Прекрасно."
 lithuania.101.t:0 "Литва не отступает"
 lithuania.101.d:0 "Литовское правительство отвергло наши требования. Теперь, когда они уже выдвинуты, мы не можем просто отступить, иначе покажемся слабыми."
 lithuania.101.a:0 "Объявить войну"
 lithuania.101.b:0 "Разобраться с ними позже."
 lithuania.102.t:0 "Коллективизация Центрального банка"
 lithuania.102.d:0 "В ходе национализации и коллективизации мы столкнулись с серьёзным сопротивлением буржуазных банкиров. Они утверждают, что ограничение роли Центрального банка подорвёт стабильность валюты, но на деле лишь используют угрозу инфляции как предлог для удержания денег у рабочего класса. Тем не менее для столь радикальных мер ещё может быть слишком рано."
 lithuania.102.a:0 "Никаких исключений для буржуазной сволочи."
 lithuania.102.b:0 "Предоставить им политическую автономию"
 lithuania.103.t:0 "Надвигающиеся правительственные репрессии"
 lithuania.103.d:0 "После завершения недавних сфальсифицированных выборов Литву захлестнула волна недовольства и политической активности, пока главным образом внутри правительства и демократической оппозиции. В сочетании с застойной экономикой это создало идеальные условия для революции, и мы начали необходимую подготовку. Нынешнее правительство заметило нашу деятельность, но пока занято демократами, которых считает большей угрозой. Это даёт нам ограниченное окно для успешного и, возможно, бескровного переворота."
 lithuania.103.a:0 "Нужно спешить."
 lithuania.104.t:0 "Литва предлагает оборонительный союз"
 lithuania.104.d:0 "Литва является нашим близким партнёром: многие её офицеры учатся в чехословацких военных академиях, а вооружённые силы используют чехословацкое снаряжение. Учитывая общую угрозу со стороны Германии, предложение создать взаимный оборонительный пакт не стало неожиданностью."
 lithuania.104.a:0 "Отличная идея."
 lithuania.104.b:0 "Мы не можем позволить себе такой риск."
 lithuania.105.t:0 "Чехословакия соглашается"
 lithuania.105.d:0 "Чехословацкое правительство приняло предложение о создании взаимного оборонительного пакта. Этот союз наверняка обеспечит нашу безопасность."
 lithuania.105.a:0 "Нужно спешить."
 lithuania.106.t:0 "Чехословакия отказывается"
 lithuania.106.d:0 "Чехословацкое правительство отклонило предложение о взаимном оборонительном пакте. Это стало неожиданностью, но впереди ещё будут возможности."
 lithuania.106.a:0 "Прискорбно."
 lithuania.107.t:0 "Перестановки в совете"
 lithuania.107.desc:0 "Недавние обвинения в неправильном представительстве привели к нескольким вынужденным отставкам бывших членов совета, оставив ряд мест вакантными. Теперь необходимо решить, какая группа интересов их займёт."
 lithuania.107.a:0 "Ультранационалисты"
 lithuania.107.b:0 "Бывшие члены Союза националистов"
 lithuania.107.c:0 "Христианские демократы"
 lithuania.107.d:0 "Социал-демократы"
 lithuania.108.t:0 "Перестановки в совете"
 lithuania.108.desc:0 "Недавние обвинения в неправильном представительстве привели к нескольким вынужденным отставкам бывших членов совета, оставив несколько мест вакантными. Теперь необходимо решить, какая группа интересов их займёт."
 lithuania.108.a:0 "Ультранационалисты"
 lithuania.108.b:0 "Бывшие члены Союза националистов"
 lithuania.108.c:0 "Христианские демократы"
 lithuania.108.d:0 "Социал-демократы"
 lithuania.109.t:0 "Вольдемаристы покидают совет в знак протеста"
 lithuania.109.d:0 "Предложение о восстановлении монархии вызвало споры среди членов Совета Литвы. Вольдемаристы не доверяли монархии. После одобрения голосования возник раскол между правыми и левыми, и несколько националистических советников ушли в отставку в знак протеста."
 lithuania.109.a:0 "Скатертью дорога."
 lithuania.110.t:0 "Члены Союза националистов покидают совет в знак протеста"
 lithuania.110.d:0 "Предложение о восстановлении монархии вызвало споры среди членов Совета Литвы. Союз националистов не доверял монархии. После одобрения голосования возник раскол между правыми и левыми, и несколько националистических советников ушли в отставку в знак протеста."
 lithuania.110.a:0 "Скатертью дорога."
 lithuania.111.t:0 "Христианские демократы покидают совет в знак протеста"
 lithuania.111.d:0 "Предложение о восстановлении монархии вызвало споры среди членов Совета Литвы. Христианские демократы не доверяли монархии. После одобрения голосования возник раскол между правыми и левыми, и несколько либеральных советников ушли в отставку в знак протеста."
 lithuania.111.a:0 "Скатертью дорога."
 lithuania.112.t:0 "Социал-демократы покидают совет в знак протеста"
 lithuania.112.d:0 "Предложение о восстановлении монархии вызвало споры среди членов Совета Литвы. Социал-демократы не доверяли монархии. После одобрения голосования возник раскол между правыми и левыми, и несколько либеральных советников ушли в отставку в знак протеста."
 lithuania.112.a:0 "Скатертью дорога."
 lithuania.113.t:0 "Голосование в пользу монархии"
 lithuania.113.d:0 "Завершились месяцы пламенных дебатов, переговоров и интриг. Совет проголосовал за предложение пригласить Карла Геро, герцога Урахского, принять литовскую корону в скором восстановленном Литовском королевстве.  Он стал королём восстановленного Литовского королевства. Карл Геро согласился на предложение быть избранным, взяв свое регнальское имя Миндаугас III.\n\nДля некоторых старших членов литовского общества это может показаться слишком знакомым, поскольку восхождение Миндаугаса II очень похоже, но гораздо менее успешно."
 lithuania.113.a:0 "Новая страница в истории Литвы."
 lithuania.114.t:0 "Интервенция в Германии"
 lithuania.114.d:0 "Мы можем многое получить от победы [GER.GetName] в германской гражданской войне, поэтому должны сделать всё возможное для их успеха или хотя бы заранее заслужить расположение."
 lithuania.114.a:0 "Вмешаться на стороне [GER.GetName]"
 lithuania.114.b:0 "Лучше вмешаться косвенно."
 lithuania.114.c:0 "У нас и без того достаточно забот."
 lithuania.115.t:0 "Заказ на закупку VK 30.01 (D)"
 lithuania.115.d:0 "В недавнем конкурсе танков в Германии на новейшую конструкцию среднего танка было представлено 2 предложения, VK 30.02 (M), представленные Maschinenfabrik Augsburg-Nürnberg и VK 30,01 (D), представленные Daimler Benz соответственно. Обе модели использовали современные технологии и спецификации армейского отдела вооружения (наклонная броня, большие колеса и нависающая пушка), но в отличие от предложения, представленного MAN, VK 30.01(D) использовал дизельный двигатель с вытесняемым внешним топливным баком и использовал листовые пружины вместо более дорогой подвески торсионного бара. VK 30.01 (D) мог быть дешевле и проще в производстве, поэтому он был первоначально одобрен Департаментом армейского оружия и заказан для производства с ранней целью 200 автомобилей.\n\nВ какой-то момент немецкое правительство предпочло более просторную башню и более современную подвеску прототипа MAN, которая впоследствии стала серийной Panther, отменив предыдущий заказ. С тех пор Daimler Benz обхаживал нескольких потенциальных покупателей для своего прототипа с принцем Вильгельмом, который ранее работал в Daimler Benz и имеет деловые связи в Германии, договорился о покупке этих танков по более низкой цене и оснащен местной пушкой L43, а не немецкой KwK 42."
 lithuania.115.a:0 "Одобрить."
 lithuania.115.b:0 "Наверняка есть причина, почему его никто не покупает."
 lithuania.115.c:0 "У нас и без того достаточно забот."
 lithuania.116.t:0 "Литва просит поддержки в споре"
 lithuania.116.d:0 "Литовская дипломатическая миссия в Берлине направила официальный, но секретный запрос о поддержке в территориальном споре с Польшей из-за Вильнюсского региона и ожидает нашего ответа."
 lithuania.116.a:0 "Дать им гарантию карт-бланша"
 lithuania.116.b:0 "Предложить посредничество"
 lithuania.116.c:0 "Не вмешиваться в этот мелкий спор."
 lithuania.117.t:0 "Прибывает небольшая помощь"
 lithuania.117.d:0 "Наша просьба о финансовой и материальной помощи удовлетворена частично. Средства выделены на расходы, связанные с возвращением дома Урахов в Литву. Преимущество частного происхождения фонда заключается в большей свободе использования по сравнению с государственными деньгами налогоплательщиков."
 lithuania.117.a:0 "Любая помощь ценна."
 lithuania.118.t:0 "Прибывает значительная помощь"
 lithuania.118.d:0 "Наша просьба о финансовой и материальной помощи удовлетворена: выделены средства на различные расходы и крупный запас контрабандного военного снаряжения."
 lithuania.118.a:0 "Любая помощь ценна."
 lithuania.119.t:0 "Прибывает огромная помощь"
 lithuania.119.d:0 "Наша просьба о финансовой и материальной помощи удовлетворена с избытком: выделены средства на различные расходы, крупный запас контрабандного военного снаряжения и группа саксонско-вюртембергских ветеранов «Бригады Зюдлитауэн», сочувствующих нашему делу."
 lithuania.119.a:0 "Любая помощь ценна."
 lithuania.119.b:0 "Это уже слишком."
 lithuania.120.t:0 "Государственный совет распущен"
 lithuania.120.d:0 "Роспуск Государственного совета завершил крах правительства, в котором господствовал Союз националистов. На поверхность вышел ультранационалистический блок вокруг партии «Молодая Литва» — бывшего молодёжного крыла Союза — и отколовшихся вольдемаристов. На другой стороне политической сцены либерально настроенные бывшие националисты перешли к христианским демократам, теперь доминирующим в демократической политике."
 lithuania.120.a:0 "Скатертью дорога."
 lithuania.122.t:0 "Битва за сталь"
 lithuania.122.desc:0 "Чтобы повысить [ROOT.GetAdjective] самообеспеченность, в [814.GetName] создаётся железный рудник, который несомненно поможет сократить зависимость от импорта минералов."
 lithuania.122.a:0 "Отличные новости."
 lithuania.123.t:0 "Германия соглашается помочь"
 lithuania.123.desc:0 "[GER.GetNameDefCap] согласилось поддержать нас, если [784.Owner.GetNameDefCap] откажется вернуть [784.GetName]."
 lithuania.123.a:0 "[784.Owner.GetNameDefCap] будет побеждено."
 lithuania.124.t:0 "Германия отказывается помочь"
 lithuania.124.desc:0 "[GER.GetNameDefCap] отклонило просьбу о поддержке на случай, если спор из-за [784.GetName] перерастёт в войну. Посол сообщил, что они не могут рисковать войной с [784.Owner.GetNameDefCap]."
 lithuania.124.a:0 "Тогда придётся изменить планы."
 LIT_political_path_decided:0 "Политический путь выбран"
