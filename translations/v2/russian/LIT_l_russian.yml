 LIT_skirpas_coup:0 "Переворот Шкирпы"
 LIT_skirpas_coup_desc:0 "Крайне недовольный нейтралитетом Сметоны и его просоветской позицией, полковник Шкирпа воспользовался должностью представителя Литвы в Германии, чтобы организовать захват власти при поддержке Берлина. Вместе с Литовским фронтом активистов мы можем добиться отстранения Сметоны, положив конец его правлению и открыв путь новому националистическому правительству."
 LIT_seek_accommodation_with_germany:0 "Договориться с Германией"
 LIT_seek_accommodation_with_germany_desc:0 "Германия открыто претендует на часть наших земель, поэтому следует наладить диалог с Берлином в попытке сохранить суверенитет."
 LIT_join_axis:0 "Вступить в Ось"
 LIT_join_axis_desc:0 "Теперь, когда отношения с Германией укреплены, настало время добиваться вступления в Ось."
 LIT_economic_battle_in_progress_flag:0 "Уже ведётся другая экономическая битва."
 LIT_iron_wolf_disorder:0 "Беспорядки в «Железном волке»"
 LIT_council_of_lithuania_decisions:0 "Совет Литвы"
 LIT_council_of_lithuania_decisions_desc:0 "Совет Литвы когда-то курировал оккупацию Литвы во время Первой мировой войны, подписал акт о независимости в 1918 году и безуспешно пытался установить монархию. С внезапной сменой режима в соседней Германии возможность возрождения королевства вызвала гораздо больший интерес к Литве после Сметоны.[GetIwValues] [GetNuValues] [GetCdValues] [GetSdValues]"
 LIT_iw_values:0 "\n\n§YПозиция вольдемаринников§! по вопросу восстановления монархии:       [GetIwLoyalty]\n§YВлияние вольдемаринников§! в совете:                                          [?LIT.LIT_iw_seats|+0] из [?LIT.LIT_total_seats|+0] мест"
