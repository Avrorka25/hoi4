 LIT_lithuanian_riflemen_union_2:0 "Союз литовских стрелков"
 LIT_root_out_communists:0 "Искоренить коммунистов"
 LIT_root_out_communists_desc:0 "Советский Союз является одной из крупнейших угроз миру и безопасности Европы. Мы должны искоренить коммунизм в самой Литве, чтобы не стать жертвой его тирании."
 LIT_root_out_fascists:0 "Искоренить фашистов"
 LIT_root_out_fascists_desc:0 "Италия и Германия открыто заигрывают с фашизмом и будут стремиться экспортировать эти идеи. Мы должны преследовать тех, кто намеревается внедрить фашизм в Литве."
