 LIT_iron_wolf_leadership_reshuffled_flag:0 "Руководство «Железного волка» переставлено"
 LIT_elections_in_progress_flag:0 "Идут выборы"
 LIT_monarch_learning_lithuanian_tt:0 "Карл Геро, герцог Урахский, начнёт изучать литовский язык"
 LIT_undercover_snieckus_tt:0 "Деятельность Снечкуса повысит вероятность успеха восстания"
 LIT_not_completing_elections_tt:0 "Если выборы не завершатся вовремя, это вызовет недовольство и усилит сторонников радикальных идеологий"
 LIT_electoral_law_tt:0 "Изменение избирательного закона необходимо для укрепления власти Сметоны"
 LIT_ussr_coup_help_tt:0 "Снаряжение прибудет в Литву после начала восстания или переворота"
 LIT_become_lithuania:0 "Стать Литвой"
 LIT_german_rail_tt:0 "§CДва §!§Yинфраструктура§!§C будут добавлены к §!§YКаждое государство, граничащее с Германией.§!"
 LIT_op_mindaugas_tt:0 "§YЭто решение начинает пограничную войну за [784.GetName]§!"
 unify_baltics_lithuania_required_states_tt:0 "Контролирует все §Yлитовские§! регионы. (Кроме Мемеля и Вильно)"
 unify_baltics_latvia_required_states_tt:0 "Контролирует все §Yлатвийские§! регионы."
 unify_baltics_estonia_required_states_tt:0 "Контролирует все §Yэстонские§! регионы."
 form_gdl_ukraine_required_states_tt:0 "Контролирует все §Yукраинские§! регионы в составе Советского Союза, кроме [199.GetName], [196.GetName], [200.GetName], [227.GetName] и [228.GetName]."
 form_gdl_ukraine_cored_states_tt:0 "Получает национальные территории на всех необходимых §Yукраинских§! регионах."
 LIT_disband_nationalist_union_tt:0 "Все места §YСоюза националистов§! передаются другим партиям, немного повышая поддержку каждой из них."
 LIT_oust_key_smetonists_tt:0 "§YСоюз националистов§! теряет по одному месту в пользу каждой конкурирующей партии, немного повышая поддержку остальных партий за счёт поддержки §YНационального союза§!."
 LIT_kings_party_sd_tt:0 "§YСоциал-демократы§! контролируют менее 10 мест."
 LIT_Aviation_Effort:0 "Расширить военно-воздушные силы [ROOT.GetName]"
 LIT_Aviation_Effort_desc:0 "Правильно развитые [ROOT.GetAdjective] военно-воздушные силы могут стать мощной силой, способной сокрушить любого агрессора. Следует начать строительство авиабаз и обучение офицеров управлению этими летательными машинами."
 LIT_Foreign_Design:0 "Сделать упор на иностранные проекты"
 LIT_Foreign_Design_desc:0 "Наши промышленные возможности по разработке собственных планеров крайне ограничены. Следует сотрудничать с союзными странами, чтобы приблизить возможности нашей авиации к их образцам."
 LIT_Aircraft_England:0 "Изучить британскую авиацию"
 LIT_Aircraft_England_desc:0 "Несколько британских авиационных компаний при негласной поддержке правительства предложили продать нам новейшие экспортные модели. Стоит принять их предложение."
 LIT_Aircraft_american:0 "Изучить американскую авиацию"
 LIT_Aircraft_american_desc:0 "Несколько американских компаний предложили продать нам прототипы лёгких истребителей. Их получение, а также доступ к чертежам и конструкциям запасных частей значительно помогут нашим военно-воздушным силам."
 LIT_Aircraft_Italian:0 "Изучить итальянскую авиацию"
 LIT_Aircraft_Italian_desc:0 "Итальянские бомбардировщики считаются одними из лучших в мире. Сближение с нынешним правительством позволит покупать и изучать их модели самолётов."
 LIT_Aircraft_japanese:0 "Изучить японскую авиацию"
 LIT_Aircraft_japanese_desc:0 "Удивительную манёвренность и скорость японских лёгких самолётов необходимо подробно изучить нашим инженерам."
 LIT_Aircraft_Soviet:0 "Изучить советскую авиацию"
 LIT_Aircraft_Soviet_desc:0 "Какими бы ни были их планы в отношении нас, [SOV.GetAdjective] самолёты обладают отличным качеством сборки, которое можно изучить и применить в собственных проектах."
 LIT_Aircraft_German:0 "Изучить германскую авиацию"
 LIT_Aircraft_German_desc:0 "Несмотря на разногласия с [GER.GetAdjective] правительством, их самолёты прочны и эффективны. Следует попытаться получить технические характеристики и воспользоваться их опытом в авиастроении."
 LIT_Fighter_Competition:0 "Конкурс истребителей"
 LIT_Fighter_Competition_desc:0 "Проведение авиашоу истребителей для демонстрации возможностей современной авиации позволит выбрать и приобрести одни из лучших доступных самолётов."
 LIT_Fighter_Competition_EXPL:0 "Получить несколько §Hсамолётов§! от стран, куда была направлена авиационная миссия.\n"
 LIT_Close_Air_Support:0 "Модификации для непосредственной авиационной поддержки"
 LIT_Close_Air_Support_desc:0 "Теперь, когда у нас есть лицензии на иностранные истребители, их можно легко приспособить для непосредственной поддержки армии."
 LIT_Bomber_Competition:0 "Конкурс бомбардировщиков"
 LIT_Bomber_Competition_desc:0 "Авиашоу современных бомбардировщиков также даст нашим военно-воздушным силам возможность приобрести некоторые из них."
 LIT_German_Rocketry:0 "Германское ракетостроение"
 LIT_German_Rocketry_desc:0 "По чистой случайности мы «получили» несколько экспериментальных ракет от дружественного южного соседа. Следует изучить их, прежде чем возвращать [GER.GetAdjective] стороне."
 LIT_Shared_Air_Doctrine:0 "По образцу иностранной воздушной доктрины"
 LIT_Shared_Air_Doctrine_desc:0 "Без соответствующих нововведений в воздушной доктрине современные военно-воздушные силы останутся лишь силой на бумаге. Некоторые пилоты и офицеры предложили разумные изменения нынешней тактики, которые пригодятся с началом войны."
 LIT_aircraft_design_cooperation:0 "Сотрудничество в проектировании самолётов"
 LIT_aircraft_design_cooperation_desc:0 "Нам есть чему поучиться у союзников, а им — у нас. Взаимная выгода ещё сильнее сблизит наши авиационные исследования."
 LIT_finish_marshalls_reforms:0 "Завершить реформы маршала Раштикиса"
 LIT_finish_marshalls_reforms_desc:0 "На фоне растущей напряжённости в Европе мы не можем позволить армии разлагаться из-за слабой подготовки и некомпетентных офицеров. Перспективный офицер германской школы Стасис Раштикис предложил реформы, готовящие армию к расширению и повышающие качество подготовки командного состава."
 LIT_army_expansion:0 "Расширение армии"
 LIT_army_expansion_desc:0 "Завершение реформ позволило одновременно обучать больше войск, а офицеры теперь готовы изучать и применять дальнейшие улучшения методов и тактики ведения боя."
 LIT_fortify_the_border:0 "Укрепить границу"
 LIT_fortify_the_border_desc:0 "Мы граничим с одними из самых несговорчивых соседей. Строительство оборонительных линий станет серьёзным сдерживающим фактором против их несомненно заранее подготовленных наступлений."
 LIT_prepare_the_mobilization_plans:0 "Подготовить планы мобилизации"
 LIT_prepare_the_mobilization_plans_desc:0 "Расширенная армия бесполезна, если не успеет собраться для отражения врага. Маршал Раштикис предлагает сократить время мобилизации до менее чем 48 часов в случае войны против [GER.GetName] и [POL.GetName]."
 LIT_doctrine_effort:0 "Изменение доктрины"
 LIT_doctrine_effort_desc:0 "Современного оружия недостаточно для успешной оборонительной войны. Необходимо также разработать соответствующие идеи его применения на поле боя."
 LIT_doctrine_effort_2:0 "Военные симуляции"
 LIT_doctrine_effort_2_desc:0 "«Ни один план не переживает столкновения с противником». Чтобы тактика была эффективна в войне, её практичность необходимо проверить ещё в мирное время."
 LIT_expand_the_MAL:0 "Расширить ВАЛ"
 LIT_expand_the_MAL_desc:0 "В Военной академии Литвы офицеры проходят подготовку перед службой в армии. Планы её расширения необходимо ускорить в соответствии с нашими потребностями."
 LIT_equipment_effort:0 "Модернизация снаряжения"
 LIT_equipment_effort_desc:0 "Наши войска сражаются оружием времён войны 1918 года. Этому необходимо положить конец, начав программу улучшения пехотного вооружения и артиллерии."
 LIT_equipment_effort_2:0 "Современная артиллерия"
 LIT_equipment_effort_2_desc:0 "Лучшая артиллерия приносит победу в великих сражениях."
 LIT_army_modernization:0 "Модернизировать армию"
 LIT_army_modernization_desc:0 "[LIT.GetAdjective] армия быстро расширит вспомогательные подразделения, чтобы повысить устойчивость дивизий на поле боя."
 LIT_equipment_effort_3:0 "Опытные образцы снаряжения"
 LIT_equipment_effort_3_desc:0 "Некоторые офицеры артиллерийских батальонов предложили улучшения и новшества в своём ремесле. Внедрение этих идей в новые орудия даст нам преимущество над врагом."
 LIT_special_forces:0 "Силы специального назначения"
 LIT_special_forces_desc:0 "Перспективные офицеры предложили сформировать части, способные действовать в местности, считавшейся непроходимой для других подразделений. Следует создать такие части и проверить их идеи."
 LIT_establish_a_armor_corp:0 "Создать бронетанковый корпус"
 LIT_establish_a_armor_corp_desc:0 "Эти новые бронированные машины, называемые танками, открывают широкие тактические возможности. Следует сформировать бронетанковый корпус [Root.GetName], испытать их эффективность и в будущем создавать более совершенные модели."
 LIT_signal_companies:0 "Роты связи"
 LIT_signal_companies_desc:0 "Радио позволяет армии передавать сообщения на большие расстояния в разгар боя. Формирование рот связи повысит скорость реакции наших подразделений."
 LIT_motorization_effort:0 "Создать моторизованный корпус"
 LIT_motorization_effort_desc:0 "Формирование моторизованного корпуса повысит мобильность войск и позволит им быстрее перемещаться по стране. Нельзя игнорировать это перспективное направление."
 LIT_mechanization_effort:0 "Создать механизированный корпус"
 LIT_mechanization_effort_desc:0 "Пехота в грузовиках уязвима для обстрела по пути к месту боя. Бронирование транспорта даст ей большую свободу действий как в дороге, так и в сражении."
 LIT_field_hospitals:0 "Расширить полевую медицинскую службу"
 LIT_field_hospitals_desc:0 "Небольшая страна вроде нашей не может выдержать потери, которые способны понести великие державы. Следует обеспечить войска отдельным медицинским корпусом, способным возвращать раненых в строй."
 LIT_modern_logistics:0 "Современная логистика"
 LIT_modern_logistics_desc:0 "Логистика — жизненная артерия армии. Без неё войска на передовой истощаются без еды и боеприпасов, теряя боеспособность. Вся армия должна овладеть искусством снабжения в самых тяжёлых условиях."
 LIT_revive_the_trade_sector:0 "Возродить торговый сектор"
 LIT_revive_the_trade_sector_desc:0 "Международная торговля и экспорт всегда помогали нашей экономике процветать. Следует укрепить этот прибыльный сектор и облегчить другим странам ведение дел с нами в Прибалтике."
 LIT_develop_the_fledgling_industry:0 "Развивать зарождающуюся промышленность"
 LIT_develop_the_fledgling_industry_desc:0 "По сравнению с другими странами у нас мало промышленного оборудования и станков. Следующий этап планирования будет посвящён расширению этих мощностей."
 LIT_develop_coastal_regions:0 "Развивать прибрежные регионы"
 LIT_develop_coastal_regions_desc:0 "Шяуляй будет дополнительно расширен современными портами и инфраструктурой для поддержки быстро растущей торговли с западными странами."
 LIT_develop_the_banks_holdings:0 "Развивать активы банка"
 LIT_develop_the_banks_holdings_desc:0 "Национальный банк получит в собственность новую инфраструктуру и станочное оборудование, чтобы стимулировать дальнейший рост экономики."
 LIT_lithuanian_industrial_boom:0 "Литовский промышленный подъём"
 LIT_lithuanian_industrial_boom_desc:0 "Недавние инвестиционные программы и промышленное планирование принесли плоды! Иностранные инвесторы и предприниматели устремляются в нашу страну ради торговли и прибыли в Прибалтике."
 LIT_long_term_investments:0 "Долгосрочные инвестиции"
 LIT_long_term_investments_desc:0 "Необходимо убедить непостоянных иностранных инвесторов вкладываться в нашу страну, чтобы развивать инфраструктуру и экономику."
 LIT_increase_commercialism:0 "Расширить коммерциализацию"
 LIT_increase_commercialism_desc:0 "Международная торговля повысила наш статус и укрепила репутацию лучшего делового партнёра в Прибалтике."
 LIT_control_the_exports:0 "Контролировать экспорт"
 LIT_control_the_exports_desc:0 "Следует усилить контроль над экспортом и отслеживать мировые цены на товары, чтобы защитить торговлю от возможного падения цен."
 LIT_increase_the_currency_value:0 "Повысить стоимость лита"
 LIT_increase_the_currency_value_desc:0 "[LIT.GetAdjective] лит является одной из самых сильных и стабильных валют Европы. Повышение его стоимости даст нам преимущество при заключении сделок с другими странами."
 LIT_prepare_the_military_industry:0 "Подготовить военную промышленность"
 LIT_prepare_the_military_industry_desc:0 "Строительство дополнительных предприятий для производства военного имущества необходимо для национальной обороны."
 LIT_prepare_the_nations_defences:0 "Подготовить оборону страны"
 LIT_prepare_the_nations_defences_desc:0 "Недавние политические потрясения вокруг нас рано или поздно доберутся и сюда. Мы будем строить, а затем защищаться. Пусть приходят."
 LIT_all_in:0 "§RВсё на кон!§!"
 LIT_all_in_desc:0 "Само наше существование поставлено на карту. Каждый мужчина, женщина и ребёнок в [LIT.GetNameDef] должен трудиться, а все фабрики страны будут производить оружие для народа."
 LIT_unban_the_LSDP:0 "Возродить коалицию 1926 года"
 LIT_alliance_with_far_left:0 "Союз с КПЛ"
 LIT_politicize_the_lpm:0 "Политизировать ЛСМ"
 LIT_collectived_agriculture:0 "Коллективизационные экономические реформы"
 LIT_crush_latvian_oligarchism:0 "Сокрушить латвийских олигархов"
 LIT_support_vilna_workers:0 "Освободить рабочих Вильно"
 LIT_forcefully_incorporate_estonia:0 "Силой включить Эстонию"
 LIT_preemptive_strike:0 "Превентивный удар"
 LIT_formalize_baltic_unity:0 "Оформить балтийское единство"
 LIT_soviet_alliance:0 "Союз с Советами"
 LIT_support_anti_fascism:0 "Поддержать международный антифашизм"
 LIT_strengthen_the_coalition:0 "Укрепить коалицию"
 LIT_fund_the_anbo:0 "Финансировать АНБО"
 LIT_fund_the_anbo_desc:0 "АНБО под руководством Антанаса Густайтиса разработала и произвела множество отечественных самолётов. Выделив организации больше ресурсов и средств, мы повысим её способность создавать современные машины для [Root.GetAdjective] военно-воздушных сил!"
 LIT_import_foreign_engines:0 "Импортировать иностранные двигатели"
 LIT_import_foreign_engines_desc:0 "Производство авиационных двигателей крайне дорого и сложно. Гораздо разумнее импортировать иностранные моторы и избавиться от этой нагрузки."
 LIT_modernize_planes:0 "Модернизировать самолёты"
 LIT_modernize_planes_desc:0 "Недавнее приобретение мощных авиационных двигателей позволило переоснастить наши самолёты и создать истребители, не уступающие иностранным аналогам!"
 LIT_open_pilot_training_facilities:0 "Открыть центры подготовки пилотов"
 LIT_open_pilot_training_facilities_desc:0 "Наши военно-воздушные силы испытывают острую нехватку квалифицированных пилотов. Открытие учебных центров и привлечение опытных лётчиков в качестве инструкторов поможет решить эту проблему."
 LIT_anbo_viii:0 "АНБО VIII"
 LIT_anbo_viii_desc:0 "Предложен проект самолёта под кодовым названием АНБО VIII, способного выполнять воздушную разведку и непосредственную поддержку войск. Это будет самый передовой самолёт, когда-либо созданный в Литве!"
 LIT_open_new_aviation_workshops:0 "Открыть новые авиационные мастерские"
 LIT_open_new_aviation_workshops_desc:0 "Несколько армейских авиационных мастерских в Литве занимаются производством и сборкой самолётов. Открытие новых мастерских и оптимизация производственного процесса позволят выпускать значительно больше машин для нужд военно-воздушных сил."
 LIT_antanas_gustaitis_reforms:0 "Реформы Антанаса Густайтиса"
 LIT_antanas_gustaitis_reforms_desc:0 "Антанас Густайтис предложил ряд реформ, которые заложат основы нашей воздушной доктрины и определят её применение в будущих конфликтах."
 LIT_cooperate_with_maritime_organisations:0 "Сотрудничать с морскими организациями"
 LIT_cooperate_with_maritime_organisations_desc:0 "В Литве действует множество морских организаций, объединяющих опытных моряков и капитанов, многие из которых помогали создавать наш флот. Их знания могут подсказать, как вновь улучшить военно-морские силы."
 LIT_revisit_naval_doctrine:0 "Пересмотреть военно-морскую доктрину"
 LIT_revisit_naval_doctrine_desc:0 "Используя недавно полученные знания морской стратегии, мы можем изменить военно-морскую доктрину в соответствии с нынешними потребностями."
 LIT_focus_on_destroyer_production:0 "Сосредоточиться на производстве эсминцев"
 LIT_focus_on_destroyer_production_desc:0 "Небольшие, но гораздо более универсальные эсминцы дадут нам множество преимуществ и должны составить основу флота."
 LIT_educate_naval_officers_abroad:0 "Обучать морских офицеров за границей"
 LIT_educate_naval_officers_abroad_desc:0 "Отправка перспективных офицеров в самые престижные зарубежные военно-морские академии поможет им полностью раскрыть способности и обеспечит нас компетентным командным составом."
 LIT_defend_the_coast:0 "Защитить побережье"
 LIT_defend_the_coast_desc:0 "Способность защищать береговую линию и морские пути жизненно важна и должна стать главной задачей флота."
 LIT_cruisers_development:0 "Развитие крейсеров"
 LIT_cruisers_development_desc:0 "Крейсеры обеспечат флоту превосходное сочетание огневой мощи и универсальности."
 LIT_streamline_submarine_production:0 "Оптимизировать производство подлодок"
 LIT_streamline_submarine_production_desc:0 "Полностью сосредоточив верфи на строительстве подводных лодок, мы устраним узкие места и неэффективность, замедляющие производство."
 LIT_raiding_fleet:0 "Рейдерский флот"
 LIT_raiding_fleet_desc:0 "Подводные лодки и торпеды позволят бросить вызов гораздо более сильным флотам, не тратя время и ресурсы на строительство крупных кораблей."
 LIT_develop_indigenous_designs:0 "Разрабатывать отечественные проекты"
 LIT_develop_indigenous_designs_desc:0 "Необходимо собрать лучшие умы страны для проектирования современных военных кораблей, подходящих нашему флоту."
 LIT_klaipda_shipyards:0 "Клайпедские верфи"
 LIT_klaipda_shipyards_desc:0 "В Клайпеде расположен наш крупнейший морской порт, а положение у соединения Балтийского моря и Куршского залива делает её идеальным местом для главной военно-морской базы. Однако близость к границе делает город уязвимым."
 LIT_ventoji_shipyards:0 "Швянтойские верфи"
 LIT_ventoji_shipyards_desc:0 "Хотя Швянтойи хуже подходит на роль главного морского порта, чем Клайпеда, он находится в глубине страны и потому лучше защищён от иностранной агрессии."
 LIT_study_foreign_navies:0 "Изучать иностранные флоты"
 LIT_study_foreign_navies_desc:0 "Наши знания морской войны и кораблестроения уступают зарубежному опыту. Чтобы создать эффективный флот, необходимо учиться у ведущих морских держав."
 LIT_expansion_of_naval_facilities:0 "Расширить военно-морские объекты"
 LIT_expansion_of_naval_facilities_desc:0 "Для обслуживания и расширения флота необходимо создать соответствующую военно-морскую инфраструктуру."
 LIT_a_separate_branch:0 "Отдельный род войск"
 LIT_a_separate_branch_desc:0 "До недавнего времени флот не получал должного признания и всё ещё требует целенаправленных усилий, чтобы стать по-настоящему самостоятельным родом вооружённых сил."
 LIT_baltic_navy:0 "Балтийский флот"
 LIT_baltic_navy_desc:0 "Наш флот будет действовать почти исключительно в Балтийском море, поэтому его необходимо приспособить к особенностям местной географии и прибрежной войны."
 LIT_found_the_lithuanian_maritime_academy:0 "Основать Литовскую морскую академию"
 LIT_found_the_lithuanian_maritime_academy_desc:0 "Создание Литовской морской академии позволит готовить высококвалифицированных моряков и офицеров для нашего флота."
 LIT_purchase_foreign_ships:0 "Закупить иностранные корабли"
 LIT_purchase_foreign_ships_desc:0 "Иностранные верфи способны строить корабли гораздо быстрее и качественнее нас. Вместо беспомощного подражания следует приобрести лучшие суда для собственного флота."
 LIT_purchase_italian_ships:0 "Закупить итальянские корабли"
 LIT_purchase_italian_ships_desc:0 "Многие наши офицеры учились в Италии, поэтому логично объявить тендер на покупку нескольких современных итальянских кораблей."
 LIT_purchase_french_ships:0 "Закупить французские корабли"
 LIT_purchase_french_ships_desc:0 "Франция является одной из ведущих морских держав и располагает современным мощным флотом. Следует обратиться к французскому правительству с предложением приобрести часть их кораблей."
 LIT_announce_upcoming_elections:0 "Объявить о предстоящих выборах"
 LIT_announce_upcoming_elections_desc:0 "Общественность, похоже, желает выборов, и мы их проведём. Но результат вовсе не обязательно должна определять она."
 LIT_force_parties_to_reregister:0 "Заставить партии пройти повторную регистрацию"
 LIT_force_parties_to_reregister_desc:0 "Требование повторной регистрации политических партий может помешать им попасть в избирательные бюллетени."
 LIT_amend_the_electoral_law:0 "Изменить избирательный закон"
 LIT_amend_the_electoral_law_desc:0 "Изменение избирательного закона необходимо для укрепления власти Сметоны."
 LIT_decrease_representation:0 "Сократить представительство"
 LIT_decrease_representation_desc:0 "Недавняя политическая нестабильность показала необходимость более упорядоченного управления и концентрации власти. Следует сократить число депутатов с 85 до 49, создав более управляемый законодательный орган, который лучше выразит волю литовского народа и устранит возможные юридические препятствия для президента Сметоны."
 LIT_subsidize_food_industry:0 "Субсидировать пищевую промышленность"
 LIT_subsidize_food_industry_desc:0 "Пищевая промышленность — крупнейшая отрасль Литвы и важнейший источник экспорта, но высокие тарифы и устаревшие методы мешают ей конкурировать на мировом рынке. Целевые субсидии позволят модернизировать сектор, защитить его от рыночных потрясений и сохранить сильные позиции страны."
 LIT_elect_the_fourth_seimas:0 "Избрать Четвёртый сейм"
 LIT_elect_the_fourth_seimas_desc:0 "Чтобы ещё сильнее укрепить власть Сметоны в Литве, необходимо избрать лояльный ему Четвёртый конституционный сейм."
 LIT_form_the_youth_branch:0 "Создать молодёжное крыло"
 LIT_form_the_youth_branch_desc:0 "Создание полноценного молодёжного крыла с представительством в правительстве привлечёт молодёжь к активному участию в политике и поможет воспитать новое поколение литовских чиновников. К сожалению, это также может создать почву для радикальных толкований нашей идеологии."
 LIT_expand_riflemans_union:0 "Расширить Союз стрелков"
 LIT_expand_riflemans_union_desc:0 "Основанный в 1919 году Союз литовских стрелков является важнейшей частью обороны и безопасности страны, поэтому его расширение вполне естественно."
 LIT_exile_voldemaras:0 "Отправить Вольдемараса в изгнание"
 LIT_exile_voldemaras_desc:0 "Аугустинас Вольдемарас и его сторонники представляют смертельную угрозу правительству страны. Нам будет лучше, если он окажется за границей."
 LIT_adopt_a_new_constitution:0 "Принять новую конституцию"
 LIT_adopt_a_new_constitution_desc:0 "Необходимо разработать новую конституцию, чтобы укрепить контроль правительства над страной."
 LIT_empower_smetona:0 "Расширить полномочия Сметоны"
 LIT_empower_smetona_desc:0 "Наш президент Антанас Сметона проявил исключительную твёрдость в управлении Литвой. Настало время ещё сильнее укрепить его власть."
 LIT_arrest_nazi_sympathizers:0 "Арестовать сторонников нацизма"
 LIT_arrest_nazi_sympathizers_desc:0 "Италия и Германия открыто заигрывают с фашизмом и наверняка попытаются распространить эти идеи по всей Европе. Мы должны преследовать тех, кто намеревается внедрить фашистские идеи в Литве."
 LIT_dissolve_the_klaipda_directorate:0 "Распустить Клайпедское управление"
 LIT_dissolve_the_klaipda_directorate_desc:0 "Регион [188.GetName] сохраняет частичную автономию с момента его передачи Германией. Настало время устранить все препятствия для полного контроля над этой частью нашей территории."
 LIT_accept_opposition_in_the_government:0 "Допустить оппозицию в правительство"
 LIT_accept_opposition_in_the_government_desc:0 "В преддверии войны необходимо заручиться поддержкой важных политических деятелей, даже если они не поддерживают режим."
 LIT_fortify_klaipda:0 "Укрепить Клайпду"
 LIT_fortify_klaipda_desc:0 "Из-за растущей напряженности в отношениях с Германией из-за города Клайпда можно с уверенностью предположить, что в случае войны с Германией Клайпта станет главной целью любого немецкого вторжения. Мы должны укрепить этот регион, если мы хотим иметь шанс против Германии."
 LIT_reinforce_kaunas_fortress:0 "Усилить Каунасскую крепость"
 LIT_reinforce_kaunas_fortress_desc:0 "Каунасская крепость представляет собой комплекс укреплений, охватывающий большую часть города. Завершённая в начале XX века, она остаётся одной из крупнейших оборонительных систем Европы. Для сохранения сооружений и подготовки к возможному нападению требуется масштабная реконструкция."
 LIT_offer_our_enemies_support:0 "Предложить поддержку нашим врагам"
 LIT_offer_our_enemies_support_desc:0 "Мы оказались в опасном положении, окружённые могущественными противниками. Приходится идти им на уступки, снижая напряжённость и, возможно, выигрывая время для пересмотра соглашения на более выгодных условиях с бывшим врагом, ставшим партнёром."
 LIT_sovietlithuanian_mutual_assistance_treaty:0 "[SOV.GetAdjective]-[ROOT.GetAdjective] договор о взаимопомощи"
 LIT_sovietlithuanian_mutual_assistance_treaty_desc:0 "Германия открыто стремится восстановить власть над бывшими имперскими землями. Поэтому разумно обратиться к правительству в Москве и обсудить взаимную помощь в случае войны."
 LIT_germanlithuanian_mutual_assistance_treaty:0 "Германско-[ROOT.GetAdjective] договор о взаимопомощи"
 LIT_germanlithuanian_mutual_assistance_treaty_desc:0 "Если бы Советский Союз можно было победить лишь духом и отвагой, он был бы уничтожен уже завтра. Но Литве не хватает людских ресурсов для защиты от столь подавляющей угрозы. Возможно, союз с Германией поможет нам пережить следующее десятилетие."
 LIT_voldemarininkai_coup:0 "Переворот вольдемаринников"
 LIT_voldemarininkai_coup_desc:0 "Сметона планирует провести в ближайшем будущем «выборы». Если мы когда-либо хотим превратить «Железного волка» в политическую силу Литвы, действовать нужно сейчас."
 LIT_reform_the_iron_wolf:0 "Восстановить «Железного волка»"
 LIT_reform_the_iron_wolf_desc:0 "Восстановление «Железного волка» — не просто стратегический шаг, а политическое заявление. Некогда внушавшая страх организация возродится, чтобы утвердить власть вольдемаринников, искоренить инакомыслие и вновь разжечь националистический пыл. «Железный волк» безоговорочно предан делу Вольдемараса и будет продвигать идею сильной и единой Литвы."
 LIT_rehabilitate_organisers_of_the_1934_coup:0 "Реабилитировать организаторов переворота 1934 года"
 LIT_rehabilitate_organisers_of_the_1934_coup_desc:0 "Неудавшийся переворот вольдемаринников 1934 года до сих пор влияет на политическую жизнь. Люди, некогда пытавшиеся привести нас к власти, теперь заключены и изгнаны из общества. Их реабилитация станет не просто проявлением милосердия, а стратегическим шагом для укрепления власти, возвращения верных союзников и восстановления их места в движении."
 LIT_return_of_voldemaras:0 "Возвращение Вольдемараса"
 LIT_return_of_voldemaras_desc:0 "Теперь, когда он наконец освобождён от несправедливого заключения, необходимо организовать пышную церемонию его законного возвращения во главе страны."
 LIT_hold_the_lnp_commission:0 "Провести комиссию ЛНП"
 LIT_hold_the_lnp_commission_desc:0 "У вольдемаринников нет чёткой самостоятельной идеологии или устоявшейся иерархии. Споры между командирами переворота угрожают стабильности националистического дела. Первая комиссия ЛНП узаконит Литовскую националистическую партию как официальный руководящий орган нового государства и определит политическую программу молодой партии."
 LIT_empower_patriots:0 "Усилить патриотическое крыло"
 LIT_empower_patriots_desc:0 "Патриотическое крыло менее непредсказуемо, чем радикальное, поэтому разумно расширить его влияние и поддержку политики, чтобы избежать дальнейшей радикализации литовского населения."
 LIT_enforce_lithuaniazation:0 "Проводить литуанизацию"
 LIT_enforce_lithuaniazation_desc:0 "Литва в основном однородна, но на востоке и западе всё ещё проживают значительные немецкие и польские меньшинства. Правительство должно ассимилировать их в наш образ жизни, не позволяя вновь оказаться под иностранным влиянием."
 LIT_syndicalize_agriculture:0 "Синдикализировать сельское хозяйство"
 LIT_syndicalize_agriculture_desc:0 "Чтобы повысить производительность сельского хозяйства и укрепить сельскую экономику, можно объединить фермерские коллективы в синдикаты. Они создадут дух единства и общей цели, позволяя крестьянам и предприятиям объединять ресурсы, унифицировать методы и повышать урожайность."
 LIT_battle_for_lithuania:0 "Литовские экономические битвы"
 LIT_battle_for_lithuania_desc:0 "Подражая «экономическим битвам» Муссолини в Литве, мы можем попытаться добиться аналогичных успехов в преодолении экономических и демографических проблем."
 LIT_lithuanian_autarky:0 "Литовская автаркия"
 LIT_lithuanian_autarky_desc:0 "Литва должна стать полностью независимой от окружающих великих держав. Необходимо обеспечить собственные ресурсы исключительно для нужд страны."
 LIT_empower_radicals:0 "Усилить радикальное крыло"
 LIT_empower_radicals_desc:0 "Радикальное крыло ЛНП придерживается ультранационалистического курса под сильным влиянием национал-социализма, выступая за «чистую» Литву и расовые идеи, отвергаемые патриотами. Правительству следует сблизиться с радикалами и изолировать патриотическое крыло."
 LIT_promote_lithuanian_aryanism:0 "Продвигать литовский шовинизм"
 LIT_promote_lithuanian_aryanism_desc:0 "Итальянские идеи о подчинённом положении женщин следует принять ради будущего литовской молодёжи."
 LIT_seize_minority_assets:0 "Конфисковать активы меньшинств"
 LIT_seize_minority_assets_desc:0 "Польское меньшинство контролирует слишком большую долю национальных активов. Это необходимо исправить ради Великого княжества."
 LIT_germanlithuanian_credit_agreement:0 "Германо-литовское кредитное соглашение"
 LIT_germanlithuanian_credit_agreement_desc:0 "После недавнего изменения риторики Германия стала одним из важнейших союзников. Следует обратиться к Берлину с экономическим предложением, выгодным обеим странам."
 LIT_german_industrial_aid:0 "Германская промышленная помощь"
 LIT_german_industrial_aid_desc:0 "Литва не является ни крупной, ни высокоиндустриальной страной. Лучший способ изменить это — попросить германских союзников инвестировать в нашу экономику."
 LIT_lithuanian_antibolshevik_legions:0 "Литовские антибольшевистские легионы"
 LIT_lithuanian_antibolshevik_legions_desc:0 "Коммунисты угрожают самому нашему образу жизни, и долг всего мира — не позволить им оказывать давление на страны, способные пасть жертвой коммунизма."
 LIT_form_the_lithuanian_security_police:0 "Литовская полиция безопасности"
 LIT_form_the_lithuanian_security_police_desc:0 "Такие державы, как Германия, показали, насколько эффективной может быть полиция, отвечающая за внутреннюю безопасность. Следует перенять эту идею и немедленно внедрить её в новом государстве."
 LIT_militarise_the_iron_wolf:0 "Милитаризировать «Железного волка»"
 LIT_militarise_the_iron_wolf_desc:0 "Несмотря на преданность, «Железный волк» остаётся неуправляемым из-за децентрализованного командования и слабой дисциплины. Сейчас его отряды больше заняты уличным насилием и политическим запугиванием, чем борьбой с внутренними угрозами. Милитаризация организации позволит самым верным и преданным бойцам сравняться по подготовке с обычными литовскими солдатами."
 LIT_lithuanian_irridentism:0 "Разжечь литовский ирредентизм"
 LIT_lithuanian_irridentism_desc:0 "Иностранные державы удерживают не только часть наших законных земель, но и нашу законную столицу. Мы должны добиться исправления этой несправедливости!"
 LIT_northern_intervention:0 "Северная интервенция"
 LIT_northern_intervention_desc:0 "Несмотря на родство, северные соседи неоднократно предавали нас в самые тяжёлые часы. Они отказались сражаться вместе с нами против большевиков в 1919 году и не поддержали нас во время мятежа Желиговского в 1920 году. Нельзя оставлять столь ненадёжных соседей на самых уязвимых флангах. Это должно измениться, хотят они того или нет."
 LIT_nationalist_education:0 "Националистическое образование"
 LIT_nationalist_education_desc:0 "Бесчисленное множество молодых людей учится в университетах по всей стране, а мы упускаем прекрасную возможность внедрить в их сознание идеалы строящейся Литвы. Молодёжь следует воспитывать патриотами, бойцами и опорой литовского государства."
 LIT_lead_by_example:0 "Подавать пример"
 LIT_lead_by_example_desc:0 "Упор на технологические новшества позволит нам не тратить следующие пятьдесят лет на попытки догнать остальную Европу."
 LIT_operation_mindaugas:0 "Операция «Миндаугас»"
 LIT_operation_mindaugas_desc:0 "Мы вернём Вильнюс любыми средствами. Пока Польша отвлечена дипломатическими играми с Москвой и Берлином, настал идеальный момент для удара."
 LIT_r56_demand_vilnius:0 "Потребовать Вильнюс"
 LIT_r56_demand_vilnius_desc:0 "Мы не будем безучастно смотреть, как Вильнюс остаётся под властью чужеземцев. Мы потребуем законного возвращения города любой ценой!"
 LIT_greater_lithuania:0 "Великая Литва"
 LIT_greater_lithuania_desc:0 "Идею «Великой Литвы» у нас украли поляки в 1920-х годах. Теперь настало время воплотить её в жизнь!"
 LIT_unify_baltics_fascist:0 "Балтийский союз"
 LIT_unify_baltics_fascist_desc:0 "Хотя идея единого Балтийского государства может казаться необычной, нельзя отрицать, что наше братство выходит за пределы границ. Теперь, когда Латвия и Эстония находятся под нашим контролем, остаётся лишь объединить их администрации с нашей, и мечта о балтийской гегемонии станет реальностью."
 LIT_unify_baltics_communist:0 "Создать Балтийскую Советскую Республику"
 LIT_unify_baltics_communist_desc:0 "Несмотря на различия в культуре, языке и идентичности, между всеми тремя странами Балтии уже давно существует братство и товарищество. Надо признать, что наши соседи такие же товарищи, как и литовцы, а рабочие могут проиграть только в том случае, если мы не объединимся в единую рабочую республику."
 LIT_restore_the_gdl:0 "Восстановить Великое княжество"
 LIT_restore_the_gdl_desc:0 "До 1918 года последним временем существования литовского государства был 1795 год. Настало время принять имперское прошлое и восстановить Великое княжество во всей полноте."
 LIT_contain_german_agression:0 "Сдержать германскую агрессию"
 LIT_contain_german_agression_desc:0 "Хотя наша идеология близка германской, мы не настолько наивны, чтобы считать, будто они не предъявят претензии на наши земли. Пришло время искать поддержку других европейских держав ради сохранения независимости Литвы."
 LIT_ally_france:0 "Союз с Францией"
 LIT_ally_france_desc:0 "В 1920-х годах Франция намеревалась создать балтийский союз по образцу своих других союзов в Восточной Европе. Следует возродить эту идею ради сохранения литовского суверенитета."
 LIT_ally_italy:0 "Союз с Италией"
 LIT_ally_italy_desc:0 "Италия была одной из первых европейских держав, признавших нашу независимость. Теперь, когда наши идеологии сблизились, следует развивать отношения ради сохранения литовского суверенитета."
 LIT_memel_for_protection:0 "Мемель в обмен на защиту"
 LIT_reconvene_the_council_of_lithuania:0 "Вновь созвать Совет Литвы"
 LIT_reconvene_the_council_of_lithuania_desc:0 "Орган, руководивший созданием независимого литовского государства и первой современной литовской монархии, должен провести страну через хаос политического вакуума, возникшего после свержения Сметоны."
 LIT_intervene_in_the_german_civil_war:0 "Вмешаться в гражданскую войну в Германии"
 LIT_intervene_in_the_german_civil_war_desc:0 "Вмешательство в германскую гражданскую войну даст идеальную возможность наладить отношения с возможным будущим правительством страны."
 LIT_vote_on_monarchy:0 "Голосование о монархии"
 LIT_vote_on_monarchy_desc:0 "Теперь, когда Совет Литвы вновь созван, пришло время поставить на голосование вопрос о восстановлении монархии."
 LIT_join_central_powers:0 "Вступить в Центральные державы"
 LIT_join_central_powers_desc:0 "После восстановления родственной монархии в Германии следует заручиться защитой кайзера."
 LIT_break_nationalist_union:0 "Распустить Союз националистов"
 LIT_break_nationalist_union_desc:0 "Союз националистов незаконно захватил и удерживает власть. Он угрожает Совету и должен быть уничтожен любой ценой."
 LIT_banish_smetonists:0 "Устранить ключевых сторонников Сметоны"
 LIT_banish_smetonists_desc:0 "Совет требует от [GetNeutralLeader] враждебных действий против Союза националистов. Однако необходимо действовать так, чтобы не лишиться этого ценного союзника перед лицом усиливающейся либеральной коалиции христианских и социал-демократов."
 LIT_dissolve_the_seimas:0 "Распустить Государственный совет"
 LIT_dissolve_the_seimas_desc:0 "Государственный совет Литвы был создан после роспуска Третьего сейма в 1927 году и унаследовал его законодательные функции. Хотя он часто оспаривает власть премьер-министра, Совет остаётся верен Сметоне, поэтому его роспуск необходим для окончательного прекращения власти президента."
 LIT_ensure_german_support:0 "Обеспечить германскую поддержку"
 LIT_ensure_german_support_desc:0 "Политическая и военная поддержка [ROOT.GetNameDef] со стороны [GER.GetNameDef] повысит легитимность и популярность режима."
 LIT_invite_karl_gero:0 "Обсудить монархию"
 LIT_kings_party:0 "Партия короля"
 LIT_kings_party_desc:0 "Литовская политика оказалась в тупике из-за сил, которым доверено голосование по вопросу монархии. Узкий круг из влиятельнейших представителей каждой партии, обладающих собственными амбициями и умеренной верностью короне, позволит воздействовать на партии, не давая ни одной из них бросить вызов монарху."
 LIT_new_noble_class:0 "Новое дворянское сословие"
 LIT_new_noble_class_desc:0 "Литовская знать сыграла решающую роль в успехе Великого княжества. Эти семьи формировали политический и военный облик Литвы, а многие их потомки сохраняют влияние и сегодня. Возрождение аристократических привилегий позволит использовать накопленный опыт и верность, обеспечивая стабильность и преемственность управления и одновременно почитая богатое наследие страны."
 LIT_support_the_lkma:0 "Поддержать ЛКАН"
 LIT_support_the_lkma_desc:0 "Литовская католическая академия наук, или ЛКАН, с момента основания в 1922 году играет важнейшую роль в научном развитии Литвы. Поддержка её деятельности принесёт пользу стране и повысит популярность монархии."
 LIT_lithuanian_aristocracy:0 "Литовская аристократия"
 LIT_cooperate_with_the_conservatives:0 "Сотрудничать с консерваторами"
 LIT_cooperate_with_the_conservatives_desc:0 ""
 LIT_restore_constitutionalism:0 "Восстановить конституционализм"
 LIT_restore_constitutionalism_desc:0 ""
 LIT_restore_the_monarchy:0 "Восстановить монархию"
 LIT_royal_adress:0 "Королевское обращение"
 LIT_royal_adress_desc:0 "Теперь, когда монархия прочно восстановлена, наш славный король должен обратиться к народу и вселить уверенность в скором наступлении новой эпохи Литвы!"
 LIT_roman_recognition:0 "Признание Рима"
 LIT_roman_recognition_desc:0 "Конкордат 1925 года подорвал легитимность литовского правительства, прямо признав власть Польской католической церкви над Вильнюсом — исторической и законной столицей Литвы. Это было воспринято как предательство Ватикана. Сближение с Римом и признание Вильнюсской архиепархии укрепят законность королевства в глазах литовского народа."
 LIT_fate_of_smetona:0 "Сформировать правительство лоялистов"
 LIT_redraft_the_twelve_point_proposal:0 "Переработать проект двенадцати пунктов"
 LIT_redraft_the_twelve_point_proposal_desc:0 "Первоначальный проект двенадцати пунктов представлял собой свод положений, определявших полномочия и обязанности монарха перед Литвой и её народом. В случае одобрения он обеспечил бы стабильную передачу власти. Однако некоторые считают, что на деле проект призван ограничить власть короля."
 LIT_kaunas_conference:0 "Каунасская конференция"
 LIT_kaunas_conference_desc:0 "Возможно, при поддержке Германии вернуть Вильнюс у иностранных захватчиков будет легче."
 LIT_vilnius_procession:0 "Королевское шествие в Вильнюсе"
 LIT_vilnius_procession_desc:0 "Теперь, когда Вильнюс наконец законно вернулся в литовские руки, мы продемонстрируем всему народу успех короля!"
 LIT_royal_legacy:0 "Королевское наследие"
 LIT_german_capital:0 "Германский капитал"
 LIT_german_capital_desc:0 ""
 LIT_german_railworks_integrated:0 "Интеграция германской железнодорожной колеи"
 LIT_german_railworks_integrated_desc:0 ""
 LIT_expand_to_markets:0 "Выйти на внешние рынки"
 LIT_expand_to_markets_desc:0 "Исторически экспорт был ориентирован преимущественно на внутренний рынок, что ограничивало возможности роста. Активно добиваясь соглашений о свободной торговле с соседями, мы откроем новые пути для товаров и предприятий."
 LIT_support_domestic_entrepreneurs:0 "Поддержать отечественных предпринимателей"
 LIT_support_domestic_entrepreneurs_desc:0 ""
 LIT_integrate_lithuanian_rail_network:0 "Интегрировать литовскую железнодорожную сеть"
 LIT_integrate_lithuanian_rail_network_desc:0 "Большинство железных дорог Литвы всё ещё использует колею 1524 мм, тогда как главный торговый партнёр, Германия, применяет стандарт 1435 мм. Из-за этого грузы между Литвой и Германией вынуждены проходить длительную и дорогостоящую перегрузку в Клайпеде. Переход на колею 1435 мм откроет для Литвы больше германских и европейских рынков."
 LIT_mercedes_benz_engine_plant:0 "Завод двигателей «Мерседес-Бенц»"
 LIT_mercedes_benz_engine_plant_desc:0 ""
 LIT_new_idea_available_tank:0 "\nДоступен новый §Yконструктор танков§!:\n"
 LIT_db_six_hundred:0 "DB 600"
 LIT_db_six_hundred_desc:0 "Двигатели серии «Даймлер-Бенц» DB 600 являются основной силовой установкой большинства истребителей и бомбардировщиков люфтваффе. Штутгарт выразил заинтересованность в передаче технических знаний в обмен на расширение собственности компании в Литве."
 LIT_three_thousand:0 "L3000"
 LIT_three_thousand_desc:0 "L3000 стал основой логистической сети вермахта. Прочная конструкция и простота делают грузовик лёгким в ремонте и обслуживании. Из-за нехватки дизельного топлива и стремления стандартизировать производство германское командование прекратило выпуск L3000, оставив крупную партию без покупателя. Возможно, эти машины готовы передать Литве."
 LIT_cult_of_vytautas_the_great:0 "Культ Витовта Великого"
 LIT_legacy_of_mindaugas:0 "Наследие Миндаугаса I"
 LIT_gediminas_heritage:0 "Наследие Гедимина"
 LIT_solicit_ratikiss_support:0 "Заручиться поддержкой Раштикиса"
 LIT_solicit_ratikiss_support_desc:0 "Маршал является прославленным героем войны и противником нынешнего режима. Следует привлечь его для борьбы с властью на предстоящих выборах."
 LIT_hold_fair_elections:0 "Провести честные выборы"
 LIT_hold_fair_elections_desc:0 "Теперь, когда очевидный план Сметоны назначить лояльное правительство сорван, настало время провести настоящие выборы и вернуть в Литву демократию."
 LIT_the_4th_president:0 "Четвёртый президент"
 LIT_the_4th_president_desc:0 "После завершения выборов очевидно, что народ желает видеть бывшего премьер-министра Леонаса Бистраса во главе Литвы."
 LIT_reinforce_czechoslovak_ties:0 "Укрепить связи с Чехословакией"
 LIT_reinforce_czechoslovak_ties_desc:0 "Чехословакия остаётся нашим главным поставщиком вооружений и важнейшим местом обучения молодых офицеров. Кроме того, как и мы, она находится под угрозой германского экспансионизма. Более тесные дипломатические и военные отношения принесут пользу обеим странам."
 LIT_propose_a_baltic_union:0 "Предложить Балтийский союз"
 LIT_propose_a_baltic_union_desc:0 "Хотя наши народы различаются, между балтийскими странами всегда существовало братство. Настало время отложить разногласия и обеспечить общее выживание."
 LIT_liberalization_of_trade_policies:0 "Либерализовать торговую политику"
 LIT_liberalization_of_trade_policies_desc:0 "Чтобы оживить экономику и укрепить отечественную промышленность, необходимо либерализовать торговлю. Снижение тарифов и барьеров создаст более благоприятную среду для предприятий."
 LIT_privatise_lithuanian_railroads:0 "Приватизировать Литовские железные дороги"
 LIT_privatise_lithuanian_railroads_desc:0 "Для оживления транспортного сектора необходимо приватизировать Литовские железные дороги. Передача собственности частным владельцам привлечёт инвестиции и новшества, позволяя модернизировать пути и локомотивы."
 LIT_model_capitalist_society:0 "Образцовое капиталистическое общество"
 LIT_model_capitalist_society_desc:0 "Благодаря преобразующим реформам, основанным на принципах невмешательства и неоклассической экономики, Литва стала образцовым капиталистическим обществом. Такая политика создала благоприятную среду для предпринимательства и новшеств, позволяя бизнесу процветать при минимальном вмешательстве государства."
 LIT_remove_martial_law:0 "Отменить военное положение"
 LIT_remove_martial_law_desc:0 "После завершения выборов и обеспечения политического будущего Литвы необходимость в военном положении отпала."
 LIT_amnesty_to_political_prisoners:0 "Амнистировать политических заключённых"
 LIT_amnesty_to_political_prisoners_desc:0 "Теперь, когда демократия вернулась в Литву, следует подтвердить это амнистией политических противников."
 LIT_remove_cencorship:0 "Отменить цензуру"
 LIT_remove_cencorship_desc:0 "Германия и Советский Союз стремятся цензурировать всё, что входит в их страны и выходит из них. Мы не станем следовать их примеру и обеспечим гражданам свободу действий."
 LIT_invest_in_public_education:0 "Инвестировать в народное образование"
 LIT_invest_in_public_education_desc:0 "Чтобы Литву воспринимали всерьёз на международной арене, необходимо обеспечить хорошо образованное население, работающее ради будущего страны."
 LIT_preparing_for_the_inevitable:0 "Готовиться к неизбежному"
 LIT_preparing_for_the_inevitable_desc:0 "Не секрет, что фашисты и коммунисты открыто стремятся уничтожить нас. Мы не можем полностью полагаться на кого-либо в вопросах суверенитета, поэтому должны рассчитывать на собственные силы для сохранения независимости Литвы."
 LIT_continue_griniuss_presidency:0 "Продолжить президентство Гринюса"
 LIT_continue_griniuss_presidency_desc:0 "До переворота 1926 года Казис Гринюс был президентом Литвы, и очевидно, что народ хочет вернуть ему этот пост."
 LIT_contact_the_aurininkai:0 "Связаться с аушрининками"
 LIT_contact_the_aurininkai_desc:0 "Гринюс всегда поддерживал социальную политику и улучшение положения бедных. Сотрудничество с аушрининками повысит популярность социальных реформ правительства."
 LIT_social_welfare_focus:0 "Реформы Гринюса"
 LIT_social_welfare_focus_desc:0 "Вернувшись к власти в Литве, Гринюс намерен проводить социальную политику в интересах бедных слоёв населения."
 LIT_griniuss_reforms_1:0 "Социальное обеспечение"
 LIT_subsidize_farmers:0 "Субсидировать фермеров"
 LIT_subsidize_farmers_desc:0 "Признавая фермеров основой Литвы, мы обязаны предоставить им целевые субсидии. Эти вложения не только поддержат их благосостояние, но и стабилизируют производство перед лицом рыночных потрясений, ранее угрожавших их существованию."
 LIT_council_of_lithuania_1:0 "Совет Литвы"
 LIT_council_of_lithuania_2:0 "Совет Литвы"
 LIT_empty_throne:0 "Пустующий престол"
 LIT_fragile_monarchy:0 "Хрупкая монархия"
 LIT_kings_party_idea:0 "Партия короля"
 LIT_draw_closer_to_finland:0 "Сблизиться с Финляндией"
 LIT_draw_closer_to_finland_desc:0 "Хотя нас связывает с Финляндией меньше общего, чем Эстонию, следует наладить хорошие отношения с Хельсинки в надежде на помощь в грядущих конфликтах."
 LIT_draw_closer_to_sweden:0 "Сблизиться со Швецией"
 LIT_draw_closer_to_sweden_desc:0 "Теперь, когда демократия пришла в Литву, следует искать поддержки у других сильных демократий, таких как Швеция."
 LIT_form_a_baltic_alliance:0 "Создать Балтийский альянс"
 LIT_form_a_baltic_alliance_desc:0 "Хотя наши народы различаются, между балтийскими странами всегда существовало братство. Настало время отложить разногласия и обеспечить общее выживание."
 LIT_join_northern_lights:0 "Вступить в «Северное сияние»"
 LIT_join_northern_lights_desc:0 "Наши демократические союзники на севере формируют пакт взаимопомощи, и нам следует попытаться присоединиться к этому выгодному союзу."
 LIT_join_allies:0 "Вступить в Союзники"
 LIT_join_allies_desc:0 "Британия остаётся одной из немногих крупных демократий Европы. Следует запросить официальное приглашение в Союзники."
 LIT_research_cooperative:0 "Исследовательское сотрудничество"
 LIT_research_cooperative_desc:0 "За последние годы мы значительно повысили технологический уровень страны, однако союзники всё ещё могут многому нас научить. Возможно, удастся убедить их обмениваться знаниями в обмен на наши собственные."
 LIT_lcp_resurgence:0 "Возрождение КПЛ"
 LIT_lcp_resurgence_desc:0 "Основанная в 1918 году Коммунистическая партия Литвы почти с самого начала находилась вне закона. На фоне нестабильности после объявления предстоящих выборов настало время подготовить настоящую революцию по российскому образцу и свергнуть диктаторов у власти!"
 LIT_preparing_for_the_uprising:0 "Подготовка к восстанию"
 LIT_preparing_for_the_uprising_desc:0 "Для успеха революции нам нужна не только поддержка народа, но и любая помощь со стороны Советского Союза."
 LIT_launch_the_revolution:0 "Начать революцию"
 LIT_launch_the_revolution_desc:0 "Теперь, когда поддержка обеспечена, настал лучший момент начать революцию и привести Литву в новую эпоху!"
 LIT_collectivisation:0 "Коллективизация"
 LIT_collectivisation_desc:0 "Любая коммунистическая революция требует коллективизации литовских земель ради улучшения условий труда и повышения производительности страны!"
 LIT_industrialisation:0 "Индустриализация"
 LIT_industrialisation_desc:0 "С момента основания Литва оставалась промышленно слабой страной. Теперь пролетариат должен изменить это положение."
 LIT_urbanisation:0 "Урбанизация"
 LIT_urbanisation_desc:0 "Переход к урбанизации жизненно важен для молодого социалистического государства. Переселяя людей из сельской нищеты в города, мы создаём эффективную и способную рабочую силу, необходимую для индустриализации и избавления от зависимости от угнетающих капиталистических рынков."
 LIT_new_lithuania:0 "Новая Литва"
 LIT_new_lithuania_desc:0 "Новый революционный облик распространился по Литве, и теперь ясно, что революция победила, закрепив за нами место среди растущего числа коммунистических государств мира."
 LIT_socialist_science:0 "Социалистическая наука"
 LIT_socialist_science_desc:0 "Советские учёные уже доказали, что коммунистическая наука стремится к революционным изобретениям. Мы последуем их примеру и поддержим растущее научное движение в Литве."
 LIT_academy_of_sciences:0 "Основать Литовскую академию наук"
 LIT_academy_of_sciences_desc:0 "Литовское научное общество давно выступает за создание академии наук. Следует поддержать эту идею государственным финансированием."
 LIT_join_comintern:0 "Вступить в Коминтерн"
 LIT_join_comintern_desc:0 "Поскольку Советский Союз находится совсем рядом, естественно стремиться к вступлению в Коммунистический интернационал."
 LIT_join_ussr:0 "Вступить в Союз"
 LIT_join_ussr_desc:0 "Учитывая тесные связи с Советским Союзом и прежний опыт пребывания под российской властью, логично официально обратиться за статусом союзной советской республики."
 LIT_peoples_army:0 "Народная армия"
 LIT_peoples_army_desc:0 "Нынешнее военное руководство переполнено буржуазными и контрреволюционными элементами. Необходима масштабная реорганизация, чтобы новая армия воплощала принципы народной революции. Литовская народная армия будет защищать социалистические идеалы революции перед лицом внешних угроз."
 LIT_reintegrate_lit_minor:0 "Реинтегрировать Малую Литву"
 LIT_reintegrate_lit_minor_desc:0 "После окончательного разгрома германской угрозы необходимо включить Кёнигсберг и проживающее там литовское меньшинство в состав собственно Литвы."
 LIT_red_volunteers:0 "Красные добровольцы"
 LIT_red_volunteers_desc:0 ""
 LIT_spread_the_revolution:0 "Распространить революцию"
 LIT_spread_the_revolution_desc:0 "Хотя мы не троцкисты, в идее «перманентной революции» есть доля истины, поэтому следует экспортировать коммунизм соседям."
 LIT_red_latvia:0 "Наши соседи на севере"
 LIT_red_latvia_desc:0 "Латвийский народ страдает под властью диктатуры. Настало время освободить его и помочь вступить в Коммунистический интернационал."
 LIT_red_estonia:0 "Марш на Таллин"
 LIT_red_estonia_desc:0 "Революция в Латвии увенчалась успехом, и мы уверенно движемся к созданию Балтийского союза под властью пролетариата. Теперь пора принести революцию угнетённому эстонскому народу."
 LIT_empower_litvak_community:0 "Расширить права литвакской общины"
 LIT_empower_litvak_community_desc:0 "Со времён Великого княжества в Литве проживает небольшая община литваков, чьи заслуги слишком долго игнорировались из-за националистических предрассудков. Социалистическая доктрина должна признать и поддержать их вклад в литовское общество."
 LIT_empower_litvak_community_idea:0 "Расширенные права литвакской общины"
 LIT_anti_fascist_legions_idea:0 "Антифашистские легионы"
 LIT_constitutional_loophole:0 "Столичная лазейка"
 LIT_constitutional_loophole_desc:0 "Каунас уже десятилетиями остаётся временной столицей с тех пор, как Польша заняла Вильнюс в октябре 1920 года в ходе операции «Желиговский». Поскольку вопрос так и не был решён ни нами, ни третьей стороной вроде §YЛиги Наций§!, конституция по-прежнему признаёт Вильнюс нашей столицей де-юре."
