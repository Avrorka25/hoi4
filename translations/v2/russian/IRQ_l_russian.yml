 r56_iraq_faction.4.a:0 "В эти неспокойные времена нам нужны союзники."
 r56_iraq_faction.4.b:0 "Мы отказываемся сотрудничать с идеологическими врагами!"
 r56_iraq_faction.5.t:0 "[OMA.GetNameDefCap] принимает приглашение"
 r56_iraq_faction.5.d:0 "[OMA.GetNameDefCap] приняла наше приглашение."
 r56_iraq_faction.5.a:0 "Мы добились объединения!"
 r56_iraq_faction.6.t:0 "[OMA.GetNameDefCap] отклоняет приглашение"
 r56_iraq_faction.6.d:0 "[OMA.GetNameDefCap] отклонила наше приглашение."
 r56_iraq_faction.6.a:0 "Это неприемлемо!"
 r56_iraq_faction.7.t:0 "[IRQ.GetnameDefCap] приглашает нас в свой альянс"
 r56_iraq_faction.7.d:0 "[IRQ.GetnameDefCap] приглашает нас в свой альянс."
 r56_iraq_faction.7.a:0 "В эти неспокойные времена нам нужны союзники."
 r56_iraq_faction.7.b:0 "Мы отказываемся сотрудничать с идеологическими врагами!"
 r56_iraq_faction.8.t:0 "[YEM.GetNameDefCap] принимает приглашение"
 r56_iraq_faction.8.d:0 "[YEM.GetNameDefCap] приняла наше приглашение."
 r56_iraq_faction.8.a:0 "Коммунизм победит!"
 r56_iraq_faction.9.t:0 "[YEM.GetNameDefCap] отклоняет приглашение"
 r56_iraq_faction.9.d:0 "[YEM.GetNameDefCap] отклонила наше приглашение."
 r56_iraq_faction.9.a:0 "Это неприемлемо!"
 r56_iraq_faction.10.t:0 "[IRQ.GetNameDefCap] просит принять её в Союзники"
 r56_iraq_faction.10.d:0 "[IRQ.GetNameDefCap] желает присоединиться к нашему альянсу."
 r56_iraq_faction.10.a:0 "В эти неспокойные времена нам нужны союзники."
 r56_iraq_faction.10.b:0 "[IRQ.GetNameDefCap] ничем не сможет помочь нашим военным усилиям."
 r56_iraq_faction.11.t:0 "[IRQ.GetNameDefCap] просит принять её в Коминтерн"
 r56_iraq_faction.11.d:0 "[IRQ.GetNameDefCap] желает присоединиться к нашему альянсу."
