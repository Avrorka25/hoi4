l_russian:
 R56_iraqi_focus:0 "Национальные фокусы Ирака"
 IRQ_mahmud_salman:0 "Махмуд Салман"
 IRQ_iraq_petroleum_company:0 "Иракская нефтяная компания"
 IRQ_reinforce_the_monarchy:0 "Укрепить Хашимитскую монархию"
 IRQ_reinforce_the_monarchy_desc:0 "Хашимиты, также известные как дом Хашима, происходят от пророка Мухаммеда через его внука Хасана. Они прочно утвердились в конце IX века и непрерывно правили Хиджазом до 1926 года, а Ираком — с 1921 года, когда Фейсал I был избран королём, после того как Иракский национальный конгресс выдвинул его кандидатуру ещё в 1919 году. В 1933 году, после смерти отца, Гази ибн Фейсал был коронован как король Гази I. Будучи панарабским националистом, молодой монарх наверняка сохранит наследие Хашимитов и приведёт страну к процветанию в эти неспокойные времена."
 IRQ_appease_the_army:0 "Умиротворить военных"
 IRQ_appease_the_army_desc:0 "Наша программа не сможет осуществляться свободно, пока над ней висит дамоклов меч нелояльного военного руководства. Предоставление военачальникам определённой автономии обеспечит их верность нашему делу."
 IRQ_welfare_state:0 "Ввести программы социальной поддержки"
 IRQ_welfare_state_desc:0 "Иракский народ должен пользоваться богатствами своей страны. Люди буквально сидят на сокровищах, но не получают с них никакой прибыли. Бесплатные образование и здравоохранение могут стать справедливой компенсацией за их тяжёлый труд."
 IRQ_desert_specialization:0 "Специализация на боях в пустыне"
 IRQ_desert_specialization_desc:0 "Пустыни покрывают 40% территории страны. Нашим вооружённым силам необходимы подходящее снаряжение и подготовка для боёв в столь суровых условиях."
 IRQ_camel_corps:0 "[ROOT.GetADjective] верблюжий корпус"
 IRQ_camel_corps_desc:0 "Верблюды полезны в боях в пустыне."
 IRQ_the_hashemite_diplomacy:0 "Хашимитская дипломатия"
 IRQ_the_hashemite_diplomacy_desc:0 "Изменённое Шарифское решение 1921 года привело к тому, что два представителя Хашимитской династии, Фейсал I и Абдалла I, с тех пор правят соответственно Ираком и Иорданией. Судьбы наших стран связаны веками, и нам следует укрепить династические связи."
 IRQ_promote_peaceful_religious_coexistence:0 "Содействовать мирному религиозному сосуществованию"
 IRQ_promote_peaceful_religious_coexistence_desc:0 "Наш народ никогда не достигнет желанного единства, если мы допустим религиозный экстремизм. Современное арабское общество сможет успешно развиваться и процветать только при политике мирного сосуществования."
 IRQ_favor_shiite_officers:0 "Поддержать офицеров-шиитов"
 IRQ_favor_shiite_officers_desc:0 "Многие талантливые выпускники Военной академии в Рустамии были понижены в звании или вовсе не допущены к службе исключительно из-за своих религиозных убеждений. Их поддержка лишь укрепит наш режим."
 IRQ_united_officer_corps:0 "Единый офицерский корпус"
 IRQ_united_officer_corps_desc:0 "Сотрудничество гражданских и военных будет всячески поощряться. Страна достаточно пострадала от бессмысленных мятежей и военных восстаний. Вместе мы сильны!"
 IRQ_reaffirm_supremacy_over_the_army:0 "Подтвердить верховенство над армией"
 IRQ_reaffirm_supremacy_over_the_army_desc:0 "После коронации Гази I также был назначен адмиралом флота, фельдмаршалом Королевских сухопутных сил Ирака и маршалом Королевских военно-воздушных сил Ирака. Расширение связей правителя и укрепление его репутации среди офицеров обеспечат контроль правительства над армией."
 IRQ_invite_western_investors:0 "Пригласить западных инвесторов"
 IRQ_invite_western_investors_desc:0 "У нашей страны нет мощной промышленной базы для крупномасштабного экономического развития. Заключение нескольких перспективных контрактов с [ENG.GetAdjective] и [USA.GetAdjective] инвесторами позволит экономике совершить огромный рывок."
 IRQ_seek_foreign_industrial_support:0 "Искать зарубежную промышленную поддержку"
 IRQ_seek_foreign_industrial_support_desc:0 "Нам нужно еще больше средств из-за рубежа для развития нашей экономики. Нынешняя монополия Иракской нефтяной компании наносит ущерб нашему дипломатическому имиджу и глобальному экономическому положению. Прекращение эксплуатации и предложение справедливых экономических сделок [GER.GetAdjective]с, [FRA.GetAdjective], [SOV.GetAdjective]с, [USA.GetAdjective]s, и [JAP.GetAdjective] Это будет более выгодно для нас."
 IRQ_british_embassy2:0 "[ENG.GetAdjective] посольство"
 IRQ_british_embassy2_desc:0 "Мы находимся под сильным влиянием [ENG.GetAdjective] Благодаря их обширному военному присутствию в Кувейте и Палестине, их фирмы и корпорации доминируют на нашем ресурсном и материальном рынках. Продление мандата их дипломатов в Багдаде, несомненно, улучшит наши отношения."
 IRQ_on_the_british_side:0 "На [ENG.GetAdjective] Сбоку"
 IRQ_on_the_british_side_desc:0 "Антибританские настроения среди населения и политическая нестабильность нынешнего режима могут спровоцировать [ENG.GetAdjective] военное вмешательство. Если действовать быстро, у нас ещё есть шанс сохранить независимость."
 IRQ_friendship_with_turkey:0 "Дружба с [TUR.GetNameDef]"
 IRQ_friendship_with_turkey_desc:0 "У нас могут быть политические, религиозные или национальные различия, но мы все люди Ближнего Востока. Мы могли бы получить мощного союзника на Севере, обеспечив безопасность. [ENG.GetAdjective] Дружба."
 IRQ_friendship_with_iran:0 "Дружба с [PER.GetNameDef]"
 IRQ_friendship_with_iran_desc:0 "Наша молодая и хрупкая страна имеет длинную сухопутную границу с [PER.GetNameDef]. Чтобы обеспечить безопасность северо-восточной границы, сначала следует урегулировать спор вокруг Шатт-эль-Араба — важной торговой реки бывшей Месопотамии. Успешные переговоры укрепят и без того хорошие дипломатические отношения."
 IRQ_the_sadabat_pact:0 "Саадабадский пакт"
 IRQ_the_sadabat_pact_desc:0 "Четыре ведущие державы Ближнего Востока встретятся во дворце Саадабад в Тегеране, чтобы обсудить текущее состояние и будущее развитие ближневосточных отношений. Общий пакт о ненападении станет первым шагом к единому великому будущему."
 IRQ_build_our_own_diplomacy_instead:0 "Самостоятельно проложить путь в будущее"
 IRQ_build_our_own_diplomacy_instead_desc:0 "Страна без внешней поддержки падёт под постоянным давлением великих держав и их союзов. Чтобы обеспечить себе место в мире, мы должны стать одной из основательниц собственного уникального блока."
 IRQ_reform_the_army:0 "Реформировать армию"
 IRQ_reform_the_army_desc:0 "Нынешняя структура армии крайне дезорганизована и непослушна. Принятие определённой сухопутной доктрины повысит эффективность войск."
 IRQ_arab_industrial_revolution:0 "Арабская промышленная революция"
 IRQ_arab_industrial_revolution_desc:0 "Прежде чем мы сможем индустриализировать нашу страну, [ENG.GetAdjective] Мы создали обязательное правительство, которое ограничивало наши полномочия. Времена изменились, и сейчас настало время создавать огромные промышленные секторы."
 IRQ_the_basis_of_the_economy:0 "Основа экономики"
 IRQ_the_basis_of_the_economy_desc:0 "Полная зависимость экономики от экспорта нефти вынуждает исследовательские институты разрабатывать новые способы её переработки и очистки."
 IRQ_foreign_industrial_support:0 "Иностранная промышленная поддержка"
 IRQ_modernisation_of_rural_villages:0 "Модернизация сельских поселений"
 IRQ_modernisation_of_rural_villages_desc:0 "Аль-Хаджара — бесплодная пустынная провинция, заполненная небольшими сельскими поселениями. Их модернизация позволит связаться с глубинными районами и продолжить промышленную революцию."
 IRQ_iraqi_republic_railways:0 "Иракские железные дороги"
 IRQ_iraqi_republic_railways_desc:0 "Османы оставили нам небольшую железнодорожную сеть, которую Иракские железные дороги продолжили расширять. Субсидирование компании позволит продолжить строительство."
 IRQ_total_eletrification:0 "Всеобщая электрификация"
 IRQ_total_eletrification_desc:0 "С 1917 года электричеством обеспечены только правительственные здания. Полная электрификация станет следующим шагом к полноценной индустриализации."
 IRQ_rapid_industrialization:0 "Ускоренная индустриализация"
 IRQ_rapid_industrialization_desc:0 "Мировая напряжённость растёт, и всё больше стран наращивают промышленный потенциал. Если мы не ускорим индустриализацию, враги нас раздавят."
 IRQ_finish_the_railyways:0 "Завершить строительство железной дороги"
 IRQ_finish_the_railyways_desc:0 "Иракские железные дороги почти завершили создание сети. Для последних работ им требуется лишь немного дополнительного финансирования."
 IRQ_rebuild_baghdad:0 "Перестроить Багдад"
 IRQ_rebuild_baghdad_desc:0 "Великий Багдад когда-то был центром искусства, культуры и науки, а также самым населённым городом Ближнего Востока. Мы должны вернуть ему былое величие."
 IRQ_ghazis_propaganda_station:0 "Пропагандистская радиостанция Гази I"
 IRQ_ghazis_propaganda_station_desc:0 "Не пользующийся достаточной поддержкой монарх Гази I создал радиостанцию, через которую распространял радикальные взгляды на мир. В частности, он выступал за объединение Ирака и Кувейта."
 IRQ_royal_armament_factories:0 "Королевские оружейные заводы"
 IRQ_royal_armament_factories_desc:0 "Следует создать «королевские» военные предприятия, чтобы удовлетворить потребности армии в снабжении."
 IRQ_expanded_oil_drilling:0 "Расширить добычу нефти"
 IRQ_expanded_oil_drilling_desc:0 "Мы уже открыли небольшие нефтедобывающие предприятия, а недавно возле Киркука обнаружили крупные запасы нефти. Её можно использовать для снабжения наших бронетанковых дивизий."
 IRQ_mosul_military_stockpile:0 "Военный склад в Мосуле"
 IRQ_mosul_military_stockpile_desc:0 "Следует создать крупный военный склад в Мосуле. Если столица будет захвачена, у нас всё равно останется значительное количество снаряжения для снабжения армии."
 IRQ_labor_camps:0 "Оружейная промышленность"
 IRQ_labor_camps_desc:0 "Некоторые военные руководители рекомендуют объединить производство вооружений для повышения его эффективности."
 IRQ_steel_mining:0 "Производство стали"
 IRQ_steel_mining_desc:0 "Сталь используется почти во всём военном снаряжении. Если порты окажутся заблокированы, нам потребуется собственное производство внутри страны."
 IRQ_establish_the_univeristy_of_baghdad:0 "Официально учредить Багдадский университет"
 IRQ_establish_the_univeristy_of_baghdad_desc:0 "Багдадский университет, точнее отдельные колледжи Багдада, был основан много лет назад, но они так и не были объединены в единое учреждение."
 IRQ_create_the_iraqi_block_cipher:0 "Создать иракский блочный шифр"
 IRQ_create_the_iraqi_block_cipher_desc:0 "Многие страны уже научились взламывать шифры друг друга, поэтому нам следует создать собственный уникальный код — иракский блочный шифр."
 IRQ_license_cipher_machines:0 "Лицензировать шифровальные машины"
 IRQ_license_cipher_machines_desc:0 "Получив лицензии на иностранные шифровальные машины, мы сможем изучить их устройство методом обратной разработки. Затем эти знания можно применить для улучшения или создания собственных машин."
 IRQ_design_the_osirak_reactor:0 "Создать реактор «Осирак»"
 IRQ_design_the_osirak_reactor_desc:0 "The [FRA.GetAdjective] Они хотят начать атомные исследования где-то вдали от войны. Они обратились к нам и предложили построить совместный исследовательский реактор — реактор «Осирак»."
 IRQ_expand_the_univeristy:0 "Расширить исследовательские гранты университету"
 IRQ_expand_the_univeristy_desc:0 "Следует увеличить финансирование профессоров и учёных, которые неустанно трудятся ради лучшего будущего."
 IRQ_resolve_the_army_conflict:0 "Урегулировать конфликт с армией"
 IRQ_resolve_the_army_conflict_desc:0 "Армия выступает против гражданского правительства, созданного народом. Необходимо быстро разрешить конфликт, пока не началась гражданская война."
 IRQ_anti_colonialism_policy:0 "Антиколониальная политика"
 IRQ_anti_colonialism_policy_desc:0 "Наш народ давно открыто выступает против британского и французского колониализма. Пора дать ему правительство, которое действительно поддержит эти слова."
 IRQ_demand_persian_gulf_colonies:0 "Потребовать колонии в Персидском заливе"
 IRQ_demand_persian_gulf_colonies_desc:0 "Первым актом нашей антиколониальной политики должно стать устранение неприятных последствий. [ENG.GetAdjective] Из Персидского залива, поскольку они ограничили доступ к морю для многих стран арабского мира."
 IRQ_demand_hejazi_liberation:0 "Освободить Хиджаз"
 IRQ_demand_hejazi_liberation_desc:0 "Саудиты захватили Хиджаз у династии нашего монарха ещё в 1926 году. Мы должны вернуть его."
 IRQ_demand_french_colonies:0 "Потребовать [FRA.GetAdjective] колонии"
 IRQ_demand_french_colonies_desc:0 "Французы захватили османские земли Сирии и Ливана. Они принадлежат арабам!"
 IRQ_demand_british_territories:0 "Потребовать [ENG.GetAdjective] колонии"
 IRQ_demand_british_territories_desc:0 "Британцы захватили османские земли Палестины, Синая и Иордании. Они принадлежат арабам!"
 IRQ_demand_cyprus:0 "Потребовать Кипр"
 IRQ_demand_cyprus_desc:0 "Последним шагом к изгнанию проклятых империалистов станет захват небольшого острова Кипр — стратегически важной военно-морской базы."
 IRQ_remove_dependency_on_british_equipment:0 "Покончить с зависимостью от британского снаряжения"
 IRQ_remove_dependency_on_british_equipment_desc:0 "Со времён британского мандата мы зависим от британского снаряжения. Чтобы двигаться вперёд, необходимо создать собственную производственную базу."
 IRQ_motorized_army:0 "Моторизованная армия"
 IRQ_motorized_army_desc:0 "Моторизованные дивизии сегодня являются важнейшей частью любой армии. Нам нельзя отставать от времени."
 IRQ_study_new_land_doctrines:0 "Изучить новые сухопутные доктрины"
 IRQ_study_new_land_doctrines_desc:0 "Эпоха кавалерийских атак при поддержке огня винтовок с продольно-скользящим затвором закончилась. Для победы необходимо обновить устаревшие стратегии."
 IRQ_special_forces_r56:0 "Войска специального назначения"
 IRQ_special_forces_r56_desc:0 "В отличие от Великой войны, теперь необходимо планировать масштабные морские десанты и воздушные операции. Армия предлагает создать специализированные дивизии."
 IRQ_army_modernisation:0 "Модернизация армии"
 IRQ_army_modernisation_desc:0 "Это последний этап реорганизации армии. Её мощь сможет сравниться даже с богами."
 IRQ_study_foreign_tanks:0 "Изучить иностранные танки"
 IRQ_study_foreign_tanks_desc:0 "У нас не было достаточно времени для разработки собственных танков. Следует разобрать иностранные образцы, изучить их сильные и слабые стороны и создать ещё более совершенные машины."
 IRQ_improve_army_logistics:0 "Улучшить армейскую логистику"
 IRQ_improve_army_logistics_desc:0 "Для прорыва сильно укреплённых линий противника нужны тяжёлые танки. Но без всесторонне развитой логистики такая задача обречена на провал."
 IRQ_cruisers_experiments:0 "Эксперименты с крейсерскими танками"
 IRQ_cruisers_experiments_desc:0 "Великие державы создают новые «крейсерские» танки, сочетающие особенности тяжёлых и лёгких машин."
 IRQ_optimize_tank_production:0 "Оптимизировать производство танков"
 IRQ_optimize_tank_production_desc:0 "Для массового производства танков необходимо найти способ удешевить их выпуск."
 IRQ_elte_tank_forces:0 "Элитные танковые войска"
 IRQ_elte_tank_forces_desc:0 "После всех исследований и экспериментов мы наконец нашли лучшие проекты танков. Пора создать элитные части."
 IRQ_unsupported_monarch:0 "Сдержать монарха"
 IRQ_unsupported_monarch_desc:0 "Король Гази I — чрезвычайно амбициозный монарх. Нам следует рассредоточить власть между различными политическими партиями."
 IRQ_the_end_of_the_monarchy:0 "Конец монархии"
 IRQ_the_end_of_the_monarchy_desc:0 "Эпоха монархов подходит к концу. Пора ему отречься, чтобы место занял настоящий представитель народа."
 IRQ_a_new_kind_of_monarch:0 "Военный заговор"
 IRQ_a_new_kind_of_monarch_desc:0 "Рашид Али аль-Гайлани — арабский националист и нынешний министр юстиции, который отлично подошёл бы на роль замены королю. Возможно, даже в качестве императора."
 IRQ_officers_coup:0 "Офицерский переворот"
 IRQ_officers_coup_desc:0 "Пора заменить разложившиеся гражданские правительства сильной властью. Возможно, будет создана хунта или власть передадут сильному лидеру. Ведь подобное наверняка не станет традицией для этого региона."
 IRQ_political_purification:0 "Чистка оппозиции"
 IRQ_political_purification_desc:0 "Первое необходимое условие стабилизации нового режима — очистить страну и её руководство от политической оппозиции."
 IRQ_cult_of_personaility:0 "Культ личности"
 IRQ_cult_of_personaility_desc:0 "Необходимо укрепить образ лидера и подчеркнуть его любовь к народу. Он уже заказал целую пропагандистскую кампанию, включая собственную статую на площади Фирдос."
 IRQ_assyrian_revanchism:0 "Исторический реваншизм"
 IRQ_assyrian_revanchism_desc:0 "Наши земли были центром многих империй в истории. Поднимется ещё одна."
 IRQ_algaylani_youth:0 "Молодёжь аль-Гайлани"
 IRQ_algaylani_youth_desc:0 "Следует создать собственную военизированную молодёжную организацию — «Молодёжь аль-Гайлани»."
 IRQ_german_military_mission:0 "[GER.GetAdjective] военная миссия"
 IRQ_german_military_mission_desc:0 "The [GER.GetAdjective]Они хотят открыть дипломатические отношения с нами и помочь нам еще больше реформировать наши вооруженные силы."
 IRQ_establish_the_republican_guard:0 "Создать императорскую гвардию"
 IRQ_establish_the_republican_guard_desc:0 "Некоторые по-прежнему выступают против нашего лидера и вполне могут попытаться его убить. Чтобы предотвратить такую катастрофу, следует создать Императорскую гвардию."
 IRQ_proclaim_the_neo_assyrian_empire:0 "Стремиться к Новой Вавилонии"
 IRQ_proclaim_the_neo_assyrian_empire_desc:0 "Пора вернуть то, что принадлежит нам! Духовная мобилизация страны уже началась. Теперь настало время мобилизовать и армию."
 IRQ_demand_levant:0 "Потребовать Левант"
 IRQ_demand_levant_desc:0 "Средиземноморское побережье Ближнего Востока некогда принадлежало ассирийцам и вавилонянам. Мы восстановим господство в регионе, и добиться этого будет сравнительно легко: нас связывают многочисленные культурные и этнические узы с народами Сирии и Ливана."
 IRQ_conquer_saudi:0 "Завоевать Аравийский полуостров"
 IRQ_conquer_saudi_desc:0 "Ассирийская империя владела Северной Аравией. На этот раз мы захватим весь полуостров, ускорив объединение арабского мира и обеспечив постоянный приток нефти в дополнение к уже огромным запасам."
 IRQ_kurdistan_crisis:0 "Курдистанский кризис"
 IRQ_kurdistan_crisis_desc:0 "Мы тайно финансировали [PER.GetAdjective] Курды должны подняться и присоединиться к нам, предоставив им автономию и право отказаться от призыва на военную службу. Теперь [PER.GetAdjective]Они готовы мобилизовать свои войска. Посмотрим, как они реагируют."
 IRQ_demand_old_turkish_lands:0 "Вернуть старые анатолийские земли"
 IRQ_demand_old_turkish_lands_desc:0 "Многие годы мы владели территориями нынешней Восточной Анатолии, пока возвысившиеся Сасаниды и римляне не отняли их у нас. Теперь, когда появился шанс на возвращение, мы заберём всю Анатолию в качестве платы за унижение нашей империи."
 IRQ_uprising_in_egypt:0 "Восстание в Египте"
 IRQ_uprising_in_egypt_desc:0 "Мы можем профинансировать восстание в Египте, а затем быстро войти в страну и аннексировать её, получив контроль над Суэцким каналом и дополнительной нефтью. Новые торговые пути послужат благу империи."
 IRQ_assyria_restored:0 "Имперская слава"
 IRQ_assyria_restored_desc:0 "Месопотамия вновь стала центром империи. О, как снова восходит слава Вавилона!"
 IRQ_royal_road:0 "Царская дорога"
 IRQ_royal_road_desc:0 "Много веков назад ассирийцы построили Царскую дорогу. Следует вернуть ей былое величие и использовать для развития инфраструктуры по всему недавно объединённому арабскому миру. Многие местные монархи пренебрегали своим народом. Мы не повторим их ошибок."
 IRQ_workers_revolution:0 "Рабочая революция"
 IRQ_workers_revolution_desc:0 "Рабочие Ирака, объединяйтесь! Слишком долго нас неверно представлял так называемый «король». Пора восстать, сокрушить буржуазных угнетателей и объединить страну в единый социалистический союз!"
 IRQ_socialist_scientists:0 "Социалистическая наука"
 IRQ_socialist_scientists_desc:0 "Знания, полученные из естественных экспериментов, можно применить и к обществу."
 IRQ_workers_culture:0 "Рабочая культура"
 IRQ_workers_culture_desc:0 "Социализм — не просто экономическая система, а марксизм — не только наука. Мы должны преобразить саму ткань [IRQ.GetAdjective] общества и искоренить все остатки буржуазных нравов и традиций."
 IRQ_ministry_of_propaganda:0 "Министерство пропаганды"
 IRQ_ministry_of_propaganda_desc:0 "Создав министерство пропаганды, мы сможем внушить населению всё, что пожелаем."
 IRQ_soviet_funding:0 "[SOV.GetAdjective] финансирование"
 IRQ_soviet_funding_desc:0 "The [SOV.GetADjective]s предложили финансировать наши промышленные усилия по улучшению дипломатических и торговых отношений; Это кажется подходящим предложением."
 IRQ_secret_police:0 "Тайная полиция"
 IRQ_secret_police_desc:0 "Следует создать тайную полицию для подавления любого сопротивления революции, но, возможно, она должна действовать справедливее советского НКВД. В конце концов, у нас недостаточно населения для массовых чисток."
 IRQ_militarized_settlements:0 "Военизированные поселения"
 IRQ_militarized_settlements_desc:0 "Следует внедрить военную подготовку в поселениях по всей стране, чтобы повысить поддержку армии, набор рекрутов и производство."
 IRQ_join_the_comitern:0 "Вступить в Коминтерн"
 IRQ_join_the_comitern_desc:0 "The [SOV.GetAdjective]Коминтерн начал объединять коммунистов и социалистов по всему миру. Мы должны поддержать их дело и объединиться под знаменем Коминтерна!"
 IRQ_the_parition_of_persia:0 "Раздел Персии"
 IRQ_the_parition_of_persia_desc:0 "The [SOV.GetAdjective]Планируется вторжение [PER.getNameDef] отрезать [ENG.GetAdjective] нефтяных интересов. Мы должны помочь нашим [SOV.GetAdjective] Братья и сокрушайте империалистов, а также приобретайте землю для себя."
 IRQ_operation_sublime_porte:0 "Операция «Блистательная Порта»"
 IRQ_operation_sublime_porte_desc:0 "Так же, как и [SOV.GetAdjective]Кроме того, у нас есть интересы в Турции. Наши военные предложили совместные операции по вторжению в Турцию, известные как операция «Великая Порта»."
 IRQ_the_red_dawn:0 "Красный рассвет"
 IRQ_the_red_dawn_desc:0 "Наше коммунистическое влияние распространилось по всему Ближнему Востоку. Красный рассвет начинается сегодня."
 IRQ_form_the_socialist_union_of_the_mashriq:0 "Создать Социалистический союз Машрика"
 IRQ_form_the_socialist_union_of_the_mashriq_desc:0 "Коммунистическим странам Ближнего Востока не место среди западных держав. Мы создадим Социалистический союз Машрика."
 IRQ_invite_arabia:0 "Пригласить [SAU.GetNameDef]"
 IRQ_invite_arabia_desc:0 "Следует пригласить вторую по величине свободную страну Ближнего Востока — [SAU.GetNameDef]."
 IRQ_invite_yemen:0 "Пригласить Йемен"
 IRQ_invite_yemen_desc:0 "Следует продолжить расширение союза, пригласив [YEM.GetNameDef]."
 IRQ_invite_oman:0 "Пригласить [OMA.GetNameDef]"
 IRQ_invite_oman_desc:0 "Мы пригласим [OMA.GetNameDef], последнюю свободную арабскую страну, стать третьим и последним членом союза."
 IRQ_assisted_development:0 "Помощь в развитии"
 IRQ_assisted_development_desc:0 "Изучив состояние военно-промышленных комплексов соседей, мы пришли к выводу, что им необходимо помочь в развитии. Особенно сильно отстают государства Персидского залива. Это следует исправить."
 IRQ_conquer_persia:0 "Сразить льва"
 IRQ_conquer_persia_desc:0 "На протяжении веков арабские народы находились под властью различных Персидских империй. Сегодня они присоединятся к Народной Республике Ирак и объединятся ради мира и процветания."
 IRQ_conquer_turkey:0 "Сокрушить старого врага"
 IRQ_conquer_turkey_desc:0 "Как и персы, турки когда-то покорили Ближний Восток и угнетали народы, которые не смогли уничтожить. Социалистический союз Машрика покажет империалистам, что их ждёт."
 IRQ_Mawtini:0 "«Мавтини»"
 IRQ_Mawtini_desc:0 "«Мавтини» — слова, которые наш народ скандирует на улицах. Они означают «Моя родина». Мы дали людям славу, которой заслуживает их отчизна."
 IRQ_the_secular_movement:0 "Светское движение"
 IRQ_the_secular_movement_desc:0 "Вместо подражания западным авторитарным идеологиям следует выбрать демократию, отделяющую религию от государства. Именно смешение этих сфер долгие годы терзало нашу страну."
 IRQ_foriegn_fighters:0 "Иностранные добровольцы"
 IRQ_foriegn_fighters_desc:0 "Многие жители страны вступили в армии других демократических государств в качестве иностранных добровольцев. Следует поддержать их борьбу, создав официальные добровольческие дивизии."
 IRQ_british_embassy:0 "[ENG.GetAdjective] посольство"
 IRQ_british_embassy_desc:0 "The [ENG.GetAdjective] Мы призываем все демократические страны отбиться от оплота фашизма. Они готовы расширять дипломатические отношения с нами."
 IRQ_sell_oil_to_the_allies:0 "Продавать нефть Союзникам"
 IRQ_sell_oil_to_the_allies_desc:0 "Союзникам нужно больше ресурсов для ведения войны в Европе. Нефть жизненно важна для работы их военной машины."
 IRQ_join_the_allies:0 "Вступить в Союзники"
 IRQ_join_the_allies_desc:0 "Пора присоединиться к борьбе против фашистской и коммунистической угроз. Следует подать просьбу о вступлении в Союзники."
 IRQ_volunteer_corps:0 "Добровольческий корпус"
 IRQ_volunteer_corps_desc:0 "Пока в Европе бушует война, для победы [ENG.GetNameDef] и [FRA.GetNameDef] требуется всё больше помощи."
 IRQ_allied_support:0 "Поддержка Союзников"
 IRQ_allied_support_desc:0 "После всего, что мы сделали для Союзников, они отвечают взаимностью и направляют в Багдад крупный экспедиционный корпус."
 IRQ_a_true_republic:0 "Настоящая республика"
 IRQ_a_true_republic_desc:0 "После всего, что мы сделали для защиты будущего демократии, западные страны наконец признали нас настоящей республикой."
 IRQ_air_base_expansion:0 "Расширить авиабазы"
 IRQ_air_base_expansion_desc:0 "Чтобы господствовать в небе, необходимо расширить гражданские и военные аэродромы."
 IRQ_fighter_modernisation:0 "Модернизация истребителей"
 IRQ_fighter_modernisation_desc:0 "Наши старые межвоенные истребители уступают машинам завтрашнего дня."
 IRQ_air_innovations:0 "Авиационные новшества"
 IRQ_air_innovations_desc:0 "Начальник штаба предложил кабинету новые тактики и боевые порядки. Чтобы не отставать от других стран, эти идеи необходимо воплотить."
 IRQ_heavy_fighter_concept:0 "Концепция тяжёлого истребителя"
 IRQ_heavy_fighter_concept_desc:0 "Если нам придётся перейти в наступление, потребуется новый тип истребителя, способный долго действовать глубоко над вражеской территорией."
 IRQ_naval_bomber_experiments:0 "Эксперименты с морскими бомбардировщиками"
 IRQ_naval_bomber_experiments_desc:0 "Господство в воздухе столь же важно над морем, как и над сушей. Специализированная морская авиация поможет его добиться."
 IRQ_medium_bomber_focus:0 "Ставка на средние бомбардировщики"
 IRQ_medium_bomber_focus_desc:0 "Развитие философии точечных бомбардировок с увеличенной дальностью для выполнения вспомогательных задач."
 IRQ_light_bomber_focus:0 "Ставка на лёгкие бомбардировщики"
 IRQ_light_bomber_focus_desc:0 "Не следует недооценивать ценность пикирующих бомбардировщиков для непосредственной поддержки войск."
 IRQ_air_modernisations_programme:0 "Программа модернизации авиации"
 IRQ_air_modernisations_programme_desc:0 "Авиационная теория не менее важна, чем технологии. Нам ещё предстоит открыть новые приёмы для пилотов."
 IRQ_rocket_development:0 "Развитие ракетной техники"
 IRQ_rocket_development_desc:0 "Скорость — основа всех прочих характеристик авиации. Ракетные и реактивные двигатели теоретически позволят превзойти все прежние пределы."
 IRQ_persian_gulf_supremacy:0 "Господство в Персидском заливе"
 IRQ_persian_gulf_supremacy_desc:0 "Нам нужно создать флот, который сможет вырвать контроль над морями, блокируя оба флота. [ENG.GetAdjective] и [PER.GetAdjective]s."
 IRQ_study_foreign_built_ships:0 "Изучить иностранные корабли"
 IRQ_study_foreign_built_ships_desc:0 "Соседи постоянно разрабатывают новые типы кораблей. Мы должны получать лицензии, изучать их и создавать более совершенные суда, соответствующие нашим стратегическим и тактическим потребностям."
 IRQ_a_cruiser_navy:0 "Крейсерский флот"
 IRQ_a_cruiser_navy_desc:0 "Для воплощения планов морского присутствия нам потребуются всё более крупные корабли."
 IRQ_import_submarine_technology:0 "Импортировать технологии подводных лодок"
 IRQ_import_submarine_technology_desc:0 "Отставание в подводном флоте недопустимо. Мы получим нужные технологии, даже если придётся их купить."
 IRQ_commerce_attack:0 "Тактика рейдерства на торговых путях"
 IRQ_commerce_attack_desc:0 "Несмотря на сравнительно небольшой флот, мы можем добиться господства на море, лишая врага ресурсов с помощью подводных лодок и лёгких эсминцев."
 IRQ_the_twin_threats:0 "Две угрозы"
 IRQ_the_twin_threats_desc:0 "Мы сохраним преимущество в морском бою, сосредоточившись на контрмерах против наиболее вероятных противников."
 IRQ_coastal_defense:0 "Береговая оборона"
 IRQ_coastal_defense_desc:0 "Мобильные военно-морские силы ближнего действия способны выполнить работу стационарных укреплений, многократно превосходящих их по мощности."
 IRQ_strike_force:0 "Ударное соединение"
 IRQ_strike_force_desc:0 "Если нам не хватает численности, нужен быстро развёртываемый отряд боевых кораблей, способный ударить по врагу там и тогда, где он слабее всего."
 IRQ_persian_gulf_navy:0 "Флот Персидского залива"
 IRQ_persian_gulf_navy_desc:0 "Полный пересмотр морской стратегии будет крайне важен, если мы хотим эффективно использовать корабли в Красном море."
 IRQ_naval_equipment:0 "Военно-морское оснащение"
 IRQ_naval_equipment_desc:0 "Без современного оборудования наш флот устареет."
 IRQ_adds_new_units_tt:0 "Предоставляет подразделения в регионе Багдад"
 IRQ_religious_schism:0 "Религиозный раскол"
 IRQ_religious_schism_desc:0 "Наша страна всегда была разделена между суннитами и шиитами, и пока мы не найдём решение, это будет постоянно мешать работе правительства."
 IRQ_military_conflict:0 "Конфликт с военными"
 IRQ_military_conflict_desc:0 "Нынешние генералы открыто выступают против гражданского правительства."
 IRQ_republican_guard:0 "Императорская гвардия"
 IRQ_cult_of_personality:0 "Культ личности"
 IRQ_neo_assyrian_empire_restored:0 "Имперский пыл"
 IRQ_red_dawn:0 "Красный рассвет"
 IRQ_mawtini:0 "«Мавтини»"
 IRQ_true_republic:0 "Настоящая республика"
 IRQ_british_equipment:0 "Зависимость от британского снаряжения"
 IRQ_invite_foreign_investors:0 "Пригласить западных инвесторов"
 IRQ_invite_foreign_investors_desc:0 "Огромные нефтяные запасы привлекают иностранцев, желающих завладеть чёрным золотом под нашими ногами. Если действовать умело, этот интерес позволит создать мощную промышленность."
 IRQ_fascist_oil_nationalization:0 "Национализировать нефтяные месторождения"
 IRQ_fascist_oil_nationalization_desc:0 "Британия — воплощение хищнической капиталистической эксплуатации! Мы должны взять будущее в собственные руки."
 IRQ_communist_oil_nationalization:0 "Национализация нефтяных месторождений"
 IRQ_communist_oil_nationalization_desc:0 "Британия — воплощение хищнической капиталистической эксплуатации! Мы должны взять будущее в собственные руки."
 IRQ_opportunistic_oil_nationalization:0 "Удобный момент для национализации нефти"
 IRQ_opportunistic_oil_nationalization_desc:0 "Теперь, когда Британия разгромлена, мы должны взять будущее в собственные руки."
 IRQ_tip_the_oil_balance:0 "Склонить нефтяной баланс"
 IRQ_tip_the_oil_balance_desc:0 "Союз с Британией можно использовать как рычаг на переговорах, чтобы вернуть контроль над частью нашей нефти."
 IRQ_nationalized_oil_fields:0 "@IRQ§Y[IRQ.GetNameDefCap]§! национализировал нефтяные месторождения"
 IRQ_oil_concessions:0 "Иностранные нефтяные концессии"
 IRQ_ally_the_turkish_communists:0 "Подружиться с турками"
 IRQ_ally_the_turkish_communists_desc:0 "Турки совершили собственную революцию, поэтому союз с ними может оказаться полезным."
 IRQ_ally_the_iranian_communists:0 "Вспомнить джангали"
 IRQ_ally_the_iranian_communists_desc:0 "Иранцы совершили собственную революцию, поэтому союз с ними может оказаться полезным."
 IRQ_assimilate_arabistan:0 "Ассимилировать Арабистан"
 r56_iraq.1.t:0 "[GER.GetAdjective] военная миссия"
 r56_iraq.1.d:0 "Расцвет фашизма в Ираке открывает новый путь на Ближний Восток. В наших интересах подготовить их к поддержке нашего дела."
 r56_iraq.1.a:0 "Учредим совместную программу военных исследований."
 r56_iraq.1.b:0 "Это пустая трата ресурсов!"
 r56_iraq.2.t:0 "[GER.GetAdjective] военная миссия принята"
 r56_iraq.2.d:0 "The [GER.GetAdjective]Они хотят помочь нам добиться прогресса в военном отношении в мире, чтобы улучшить наши дипломатические отношения."
 r56_iraq.2.a:0 "За Отечество!"
 r56_iraq.3.t:0 "[GER.GetAdjective] военная миссия отклонена"
 r56_iraq.3.d:0 "The [GER.GetAdjective]Мы отклонили наше предложение о совместных военных исследованиях."
 r56_iraq.3.a:0 "В этом мире мы одни."
 r56_iraq.6.t:0 "[IRQ.getNameDefCap] требует Левант"
 r56_iraq.6.d:0 "[IRQ.getNameDefCap] потребовал передать наши подмандатные территории в Леванте. Как нам поступить?"
 r56_iraq.6.a:0 "Мы и так вскоре планировали деколонизацию."
 r56_iraq.6.b:0 "Мы разберёмся с фашистами!"
 r56_iraq.7.t:0 "[ENG.GetNameDefCap] отклоняет наши требования"
 r56_iraq.7.d:0 "The [ENG.GetAdjective] Мы отвергли наши требования."
 r56_iraq.7.a:0 "Мы возьмём то, что принадлежит нам!"
 r56_iraq.8.t:0 "[ENG.GetNameDefCap] уступает нашим требованиям"
 r56_iraq.8.d:0 "The [ENG.GetAdjective] Мы получили то, что хотели, и полностью сдались в этом вопросе. Будущая слава ждет нас."
 r56_iraq.8.a:0 "За империю!"
 r56_iraq.9.t:0 "Восстание в Египте"
 r56_iraq.9.d:0 "Масштабное восстание изгнало все колониальные гарнизоны из региона. Повстанцы хотят присоединиться к [IRQ.getNameDef]. Как нам поступить?"
 r56_iraq.9.a:0 "Дать повстанцам то, чего они хотят."
 r56_iraq.9.b:0 "Мы должны подавить восстание!"
 r56_iraq.10.t:0 "The [ENG.GetAdjective] Приближаются к подавлению восстания"
 r56_iraq.10.d:0 "The [ENG.GetAdjective] Они решили вернуть свою колонию."
 r56_iraq.10.a:0 "Мы будем защищать Египет до последнего человека!"
 r56_iraq.11.t:0 "The [ENG.GetAdjective] Оставьте Египет нам"
 r56_iraq.11.d:0 "The [ENG.GetAdjective] Мы оставили народ Египта нам."
 r56_iraq.11.a:0 "Ещё один шаг к восстановлению."
 r56_iraq.12.t:0 "[IRQ.GetNameDefCap] требует Кувейт и Абу-Даби"
 r56_iraq.12.d:0 "[IRQ.GetNameDefCap] потребовал передать колонии Кувейт и Абу-Даби. Как нам поступить?"
 r56_iraq.12.a:0 "Передать колонии."
 r56_iraq.12.b:0 "Защитить наши колонии."
 r56_iraq.15.t:0 "The [ENG.GetAdjective] Отрицали наши претензии"
 r56_iraq.15.d:0 "The [ENG.GetAdjective] Они удерживают свои колонии."
 r56_iraq.15.a:0 "Колонии Персидского залива принадлежат арабам!"
 r56_iraq.14.t:0 "[IRQ.GetNameDefCap] занимает Кувейт и Абу-Даби"
 r56_iraq.14.d:0 "Мы заняли колонии."
 r56_iraq.14.a:0 "Первый шаг к изгнанию колониальных держав с Ближнего Востока."
 r56_iraq.17.t:0 "[IRQ.GetNameDefCap] требует Сирию и Ливан"
 r56_iraq.17.d:0 "[IRQ.GetNameDefCap] потребовал передать колонии Сирия и Ливан. Как нам поступить?"
 r56_iraq.17.a:0 "Передать колонии."
 r56_iraq.17.b:0 "Защитить наши колонии."
 r56_iraq.19.t:0 "[FRA.GetnameDefCap] принимает наши требования"
 r56_iraq.19.d:0 "The [FRA.GetAdjective] Наконец-то они были удалены с Ближнего Востока. Мы позаботимся о том, чтобы их сфера влияния никогда больше здесь не расширялась."
 r56_iraq.19.a:0 "Поприветствуем наших давно потерянных братьев!"
 r56_iraq.18.t:0 "[FRA.GetnameDefCap] готовит оборону"
 r56_iraq.18.d:0 "The [FRA.GetAdjective] Мы отрицаем наш ультиматум. Они готовятся к войне..."
 r56_iraq.18.a:0 "И она её получит!"
 r56_iraq.20.t:0 "[IRQ.GetNameDefCap] требует Кипр"
 r56_iraq.20.d:0 "[IRQ.GetNameDefCap] потребовал передать колонию Кипр. Как нам поступить?"
 r56_iraq.20.a:0 "Передать колонию."
 r56_iraq.20.b:0 "Защитить нашу колонию."
 r56_iraq.22.t:0 "[IRQ.GetNameDefCap] аннексирует Кипр"
 r56_iraq.22.d:0 "Остров Кипр был освобожден из-под контроля [ENG.GetADjective]."
 r56_iraq.22.a:0 "Наконец-то мы свободны!"
 r56_iraq.21.t:0 "Британцы удерживают Кипр"
 r56_iraq.21.d:0 "Британцы отказались отдать Кипр."
 r56_iraq.21.a:0 "Они об этом пожалеют."
 r56_iraq.26.t:0 "Король Гази погиб в автомобильной аварии"
 r56_iraq.26.d:0 "Король скончался от полученных ран после того, как водитель потерял управление автомобилем. До совершеннолетия короля Фейсала будущее монархии находится в руках принца Абд аль-Илаха."
 r56_iraq.26.a:0 "Национальная трагедия."
 r56_iraq.27.t:0 "Регентство завершается"
 r56_iraq.27.d:0 "После многих лет регентства Фейсал II был признан достаточно взрослым для исполнения обязанностей короля и официально возглавил [IRQ.GetAdjective] ветвь Хашимитской династии."
 r56_iraq.27.a:0 "Так проходит время."
 r56_iraq_faction.1.t:0 "[IRQ.GetnameDefCap] приглашает нас в свой альянс"
 r56_iraq_faction.1.d:0 "[IRQ.GetNameDefCap] Он пригласил нас в свою фракцию."
 r56_iraq_faction.1.a:0 "В эти неспокойные времена нам нужны союзники."
 r56_iraq_faction.1.b:0 "Мы отказываемся сотрудничать с идеологическими врагами!"
 r56_iraq_faction.2.t:0 "[SAU.GetNameDefCap] принимает приглашение"
 r56_iraq_faction.2.d:0 "[SAU.GetNameDefCap] приняла наше приглашение."
 r56_iraq_faction.2.a:0 "Добро пожаловать, брат!"
 r56_iraq_faction.3.t:0 "[SAU.GetNameDefCap] отклоняет приглашение"
 r56_iraq_faction.3.d:0 "[SAU.GetNameDefCap] отклонила наше приглашение."
 r56_iraq_faction.3.a:0 "Они уже забыли, кто их настоящие братья."
 r56_iraq_faction.4.t:0 "[IRQ.GetnameDefCap] приглашает нас в свой альянс"
