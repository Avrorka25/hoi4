 IRQ_historical_golden_square_coup:0 "§YЗолотой квадрат§! совершил переворот."
 IRQ_british_occupation_flag:0 "§Y[ENG.GetAdjective]§! силы оккупировали страну."
 IRQ_golden_square_coup_succeeded:0 "Переворот §YЗолотого квадрата§! увенчался успехом."
 IRQ_golden_square_coup_failed:0 "Переворот §YЗолотого квадрата§! провалился."
 IRQ_golden_square_defense_government_idea:0 "Правительство национальной обороны Золотого квадрата"
 IRQ_golden_square_defense_government_idea_2:0 "Британская военная оккупация"
 IRQ_british_occupation_diplo_tt:0 "Нельзя быть призванным в войну или вступить в неё из-за ограничений, введённых британскими властями."
 iraq_hist.1.t:0 "Золотой квадрат начинает переворот!"
 iraq_hist.1.desc:0 "Угрозы со стороны фашистской организации офицеров, известной как Аль-Мурабба аль-Дхахаби (Золотая площадь), усиливаются с момента смерти нашего короля Гази I и регентства. [IRQ.GetLeader]. Сам «квадрат» состоит из полковника Салаха ад-Дина ас-Саббаха, полковника Камила Шабиба, полковников Фахми Саида и полковника Махмуда Салмана. Эти офицеры выступают за захват националистического правительства и установление Рашида Али аль-Гайлани в качестве лидера. [IRQ.GetName].\n\nСегодня эти фигуры запустили свой сюжет. Подразделения боевиков под командованием аль-Саббаха пытаются обеспечить безопасность королевского дворца и ключевых стратегических объектов в Багдаде. Время имеет решающее значение, чтобы подавить этот переворот до того, как он увенчается успехом."
 iraq_hist.1.a:0 "Дело заговорщиков правое — присоединимся к ним."
 iraq_hist.1.b:0 "Развернуть войска и положить конец этому безумию!"
 iraq_hist.2.t:0 "Золотой квадрат захватывает власть в Ираке!"
 iraq_hist.2.desc:0 "Организация офицеров-националистов успешно совершила переворот в [IRQ.GetNameDef], свергнув регента при малолетнем короле Фейсале II. Новым главой правительства стал убеждённый арабский националист Рашид Али аль-Гайлани. Правительство национальной обороны Золотого квадрата выступило против Британии и, по сообщениям, ищет помощи у [GER.GetNameDef], чтобы противостоять вероятному британскому вторжению.\n\nЭта перемена геополитического курса, скорее всего, принесёт войну на Ближний Восток."
 iraq_hist.2.a:0 "Мы должны немедленно обеспечить наше стратегическое положение!"
 iraq_hist.2.b:0 "Такова судьба."
 iraq_hist.2.c:0 "Немедленно организовать помощь нашим [IRQ.GetAdjective] коллегам!"
 iraq_hist.2.d:0 "Передать им наилучшие пожелания, но сохранить нейтралитет."
 iraq_hist.3.t:0 "[ENG.GetNameDefCap] вторгается в Ирак!"
 iraq_hist.3.desc:0 "После прошлогоднего националистического военного переворота, совершённого группой офицеров «Золотой квадрат», [ENG.GetLeader] приказал британским войскам вторгнуться в Ирак. Их цель — свергнуть националистическое правительство [IRQ.GetLeader] и восстановить Хашимитскую монархию вместе с её регентом, ориентированными на Запад. Поводом стали [IRQ.GetAdjective] провокации у авиабазы Королевских ВВС Хаббания, которую окружили [IRQ.GetAdjective] войска.\n\nИракские чиновники обвиняют британцев в нарушении англо-иракского договора 1930 года, тогда как британские дипломаты заявляют об угрозе влияния [GER.GetFactionName] в Ираке и осуждают [IRQ.GetLeader] вместе с его арабскими националистическими союзниками."
 iraq_hist.3.a:0 "Война приходит к арабам."
 iraq_hist.4.t:0 "[FROM.GetNameDefCap] отправляет материальную помощь"
 iraq_hist.4.desc:0 "В предстоящей борьбе против британских империалистов [FROM.GetNameDef] направила нам небольшую партию стрелкового оружия. Это немного, но помощь крайне необходима в борьбе с агрессором!"
 iraq_hist.4.a:0 "Благодарим [FROM.GetNameDef]."
 iraq_hist.5.t:0 "Падение [IRQ.GetNameDef]"
 iraq_hist.5.desc:0 "Британские войска быстро осуществили план вторжения в Ирак и в последние дни заняли Багдад, вынудив [IRQ.GetLeader], великого муфтия Амина аль-Хусейни и многих членов правительства Золотого квадрата бежать в [PER.GetNameDef], откуда они планируют отправиться дальше в Германию.\n\nПоскольку иракское государство полностью лишилось руководства, британцы передали нам предложение мира. Молодой король Фейсал II и его регент принц Абд аль-Илах будут восстановлены, а войска Содружества получат право свободного прохода через страну и расширения военных гарнизонов."
 iraq_hist.5.a:0 "Мы согласны."
 iraq_hist.5.b:0 "Никаких сделок с империалистами! Мы присоединимся к [GER.GetNameDef]."
 iraq_hist.6.t:0 "Иракские провокации у авиабазы Хаббания!"
 iraq_hist.6.desc:0 "Посланник [IRQ.GetNameDef] уведомил командира базы Королевских ВВС Хаббания, что соседнее плато занято для проведения «учений». В том же сообщении он потребовал немедленно прекратить все полёты и любое движение с базы по земле и воздуху. Это было расценено как прямая угроза."
 iraq_hist.6.a:0 "Мы должны ответить силой!"
 iraq_hist.6.b:0 "Отступить с базы — наша позиция скомпрометирована."
