l_russian:
 bftb_greece.1.t:0 "Монархисты побеждают на выборах!"
 bftb_greece.1.desc:1 "[GRE.GetAdjective] толпы без удивления восприняли новость о победе консерваторов, верных королю Георгу II, на [GRE.GetAdjective] выборах 1936 года. Ожидается, что премьер-министр Константинос Демердзис останется на своём посту. Король выразил уверенность, что его премьерство будет долгим и успешным. Лишь время покажет, верно ли предчувствие короля..."
 bftb_greece.1.a:0 "Великая победа государства [GRE.GetNameDef]..."
 bftb_greece.2.t:0 "Венизелисты побеждают на выборах!"
 bftb_greece.2.desc:1 "Сегодня [GRE.GetAdjective] народ заполнил улицы государства [GRE.GetNameDef], празднуя решение армии не позволить монархистам вмешаться в результаты выборов. Вернувшиеся из изгнания венизелисты получили решительный мандат на управление страной. Однако им предстоит тяжёлая борьба за объединение глубоко расколотого общества, которое не забыло катастрофическую войну 1919 года. Остаётся и вопрос о судьбе захваченного [GRE.GetAdjective] монарха. Как бы то ни было, государство [GRE.GetNameDef] ждут бурные времена..."
 bftb_greece.2.a:0 "Наконец-то мы вернулись!"
 GRE_republican_victory_tt:1 "£faction_gre_monarchist §YМонархисты§! становятся §Yбезразличными§!.\n£faction_gre_communist §YКоммунисты§! становятся §Yбезразличными§!."
 bftb_greece.3.t:1 "Анатолийские фашисты мобилизуются"
 bftb_greece.3.desc:1 "Самопровозглашённое фашистское движение государства [GRE.GetNameDef] перестроилось в соответствии с новой политической реальностью. Озлобленные греческие беженцы, изгнанные из Турции, начинают стекаться к радикальному движению Георгиоса Космидиса, ещё одного грека, лишённого родины.\n\nКосмидис открыто поддерживает Великую идею и возвращение исторических территорий, утраченных в пользу Турции. Однако его взгляды куда радикальнее, чем у кого-либо в администрации венизелистов. Некоторые донесения указывают, что Космидис хочет расширить [ROOT.GetAdjective] границы далеко за пределы Эгейского моря и, возможно, претендует на всю Анатолию. Но к таким заявлениям следует относиться скептически — какой безумец мог бы замахнуться на всю Анатолию?"
 bftb_greece.3.a:1 "За этим головорезом никто не пойдёт!"
 GRE_anatolian_fascists_in_play_tt:1 "£faction_gre_fascist §YФашисты§! появляются и изначально настроены §Rвраждебно§!."
 GRE_republican_monarchist_alliance_tt:1 "Монархические генералы и министры останутся доступны правительству венизелистов.\n£faction_gre_monarchist §YМонархисты§! становятся §Gдружественными§!.\n£faction_gre_communist §YКоммунисты§! станут §Rвраждебными§!."
 bftb_greece.6.t:0 "Переговоры с EEE"
 bftb_greece.6.desc:0 "Подлые анатолийские фашисты сеяли хаос и с самого зарождения движения оставались недосягаемыми для правительства. Однако теперь ситуация меняется. Нам предложили сделку века — объединить силы с анатолийскими фашистами ради общей цели: поражения государства [TUR.GetName].\n\nМногие в нашей администрации готовы заключить сделку с дьяволами нашей нации лишь бы прекратить их антиправительственную деятельность. Среди чиновников есть и те, кто считает цели EEE приемлемыми или даже достойными похвалы. К счастью, магнат Аристотель Онассис предложил альтернативу: он создаст контрдвижение и использует известность, деловую хватку и личное состояние, чтобы лишить EEE поддержки. Это не гарантирует разгром EEE, но у нас достаточно оснований полагать, что Онассис способен провернуть такое дело."
 bftb_greece.6.a:1 "Призраки прошлого больше не вернутся преследовать нас."
 bftb_greece.6.b:0 "Никаких сделок с фашистскими паразитами."
 GRE_ally_the_anatolian_fascists_tt:1 "£faction_gre_fascist §YФашисты§! станут §Gдружественными§!!\nСоюз с §YEEE§! будет иметь §Rсерьёзные последствия§! во время §YИраклионской конференции§!."
 GRE_ally_onassis_tt:1 "§YАристотель Онассис§! станет доступен в качестве министра.\n£faction_gre_fascist §YФашисты§! останутся §Yвраждебными§!."
 GRE_increased_influence_tt:0 "Это усилит наше влияние на §Y[FROM.GetAdjective]§! правительство."
 bftb_greece.7.t:0 "Ираклионская конференция"
 bftb_greece.7.desc:0 "Наконец настало время вновь обсудить с великими державами Европы Севрский и Лозаннский договоры и вернуться к вопросу Великой идеи. Мы не можем в одиночку решить судьбу государства [TUR.GetNameDef], поэтому сначала должны добиться одобрения государств [ENG.GetNameDef], [FRA.GetNameDef] и, если решим пригласить их на конференцию, презренного государства [ITA.GetName]."
 bftb_greece.7.a:0 "Мы пригласим [FRA.GetAdjective] и [ENG.GetAdjective] делегации."
 bftb_greece.7.b:0 "Мы пригласим всех первоначальных подписантов Севрского договора."
 bftb_greece.8.t:0 "Приглашение на Ираклионскую конференцию"
 bftb_greece.8.desc:0 "Мы только что получили интригующее предложение от [FROM.GetNameDef]. Они стремятся перекроить границы [TUR.GetNameDef]. [FROM.GetNameDefCap] Цель состоит в том, чтобы обсудить с победоносными державами Европы после Великой войны, как переписать договоры Севр и Лозанны, которые мы попытались навязать Турции.\n\nЧиновники из [FROM.GetNameDef] Заверить наших чиновников, что мы получим материальную выгоду от побежденных. [TUR.GetName] И что его уничтожение не является желанием народа. [FROM.GetAdjective] правительство. Вместо этого цифры из [FROM.GetNameDef] Настаивайте на том, чтобы ссылаться на эту конвенцию как на простой вопрос о реорганизации границ, а не о реализации реваншистских мечтаний."
 bftb_greece.8.a:0 "Ждите нас."
 bftb_greece.8.b:0 "Вы дестабилизируете Средиземноморье!"
 potential_war_with_turkey_tt:0 "§RЕсли мы согласимся участвовать, существует значительная вероятность, что в ближайшем будущем нас втянут в войну с государством [TUR.GetNameDef] в обмен на территории§!."
 bftb_greece.9.t:0 "На Ираклионскую конференцию прибывает только государство [ENG.GetNameDef]"
 bftb_greece.9.desc:0 "Приглашения к Гераклионской конвенции о реорганизации [TUR.GetNameDef]Границы были отправлены всем державам, которых мы там хотели. Несмотря на то, что мы ожидали, что все приглашенные страны примут участие, оказывается, что это только [ENG.GetNameDef] Мы будем участвовать в нашем саммите. Наши отношения с [ENG.GetNameDef] Многие из наших официальных лиц по-прежнему уверены, что Гераклионовская конвенция может быть решена таким образом, чтобы это пошло на пользу обеим нашим странам."
 bftb_greece.9.a:0 "Государство [ENG.GetNameDefCap] всегда было надёжным!"
 bftb_greece.10.t:0 "На Ираклионскую конференцию прибывает только государство [FRA.GetNameDef]"
 bftb_greece.10.desc:0 "Приглашения на Ираклионскую конференцию по изменению границ государства [TUR.GetNameDef] были направлены всем желаемым державам. Хотя мы ожидали присутствия каждой приглашённой страны, оказалось, что в саммите примет участие только государство [FRA.GetNameDef]. Услышав это, [ROOT.GetAdjective] чиновники испытали глубокое разочарование. Ни политическая элита, ни военные специалисты не уверены, что при поддержке одного лишь государства [FRA.GetNameDef] конференция принесёт желаемые результаты. И всё же мы не отступим от выбранного курса."
 bftb_greece.10.a:0 "Только государство [FRA.GetNameDef]? Давайте просто покончим с этим."
 bftb_greece.11.t:0 "На Ираклионскую конференцию прибывает только государство [ITA.GetNameDef]"
 bftb_greece.11.desc:0 "Наши подавленные чиновники долго обсуждали ужасную новость: только государство [ITA.GetNameDef] проявило интерес к решению судьбы государства [TUR.GetNameDef] на Ираклионской конференции. В итоге они решили полностью отменить конференцию. Решение далось нелегко: многие венизелисты понимают, что поставили всю легитимность движения на месть за 1922 год, а теперь вся операция оказалась под угрозой.\n\nПосле столь громкой подготовки [GRE.GetAdjective] народ уже начал беспокоиться из-за отсутствия новостей. EEE воспользовалась недовольством, обвиняя правительство в слабости и неспособности выполнить обещания. Как [ROOT.GetLeader] выведет нас из этих мутных вод?"
 bftb_greece.11.a:0 "Ничего хорошего из этого не выйдет; конференцию следует отменить."
 bftb_greece.12.t:0 "Государства [ENG.GetNameDefCap] и [FRA.GetNameDef] участвуют в Ираклионской конференции"
 bftb_greece.12.desc:0 "Собравшиеся в столице чиновники с радостью узнали, что государства [ENG.GetNameDef] и [FRA.GetNameDef] направят делегации на Ираклионскую конференцию. Подготовка завершена, и через несколько дней саммит официально начнётся.\n\nСовместно делегаты разделят сферы влияния в северной и южной Анатолии, а затем решат, получим ли мы законные территории вдоль Эгейского моря. История творится на наших глазах, и государство [ROOT.GetNameDef] окажется в самом её центре."
 bftb_greece.12.a:0 "[ROOT.GetAdjective] руки будут формировать мир."
 bftb_greece.13.t:0 "Все подписанты Севрского договора участвуют в Ираклионской конференции"
 bftb_greece.13.desc:0 "Собравшиеся в столице чиновники с радостью узнали, что государства [ENG.GetNameDef] и [FRA.GetNameDef] направят делегации на Ираклионскую конференцию, но ликование быстро сменилось тревогой из-за участия государства [ITA.GetNameDef]. Многие политики опасаются, что [ITA.GetAdjective] интриги могут сорвать всё мероприятие, однако [ROOT.GetLeader] по-прежнему убеждён, что приглашение государства [ITA.GetNameDef] было верным решением. Подготовка завершена, и через несколько дней конференция официально начнётся.\n\nСовместно делегаты разделят сферы влияния в северной и южной Анатолии, а затем решат, получим ли мы законные территории вдоль Эгейского моря. История творится на наших глазах, и государство [ROOT.GetNameDef] окажется в самом её центре."
 bftb_greece.13.a:0 "Это будет интересно..."
 bftb_greece.14.t:0 "На нашу конференцию никто не прибыл!"
 bftb_greece.14.desc:0 "Наше правительство полностью унижено новостью о том, что ни одна приглашённая страна не направит делегатов на Ираклионскую конференцию. Хуже того, великие державы публично раскритиковали наше руководство за разжигание напряжённости в регионе. Последствия оказались катастрофическими: многие венизелисты понимают, что поставили всю легитимность движения на месть за 1922 год. Теперь вся операция находится под угрозой.\n\nПосле столь громкой подготовки [ROOT.GetAdjective] народ уже начал беспокоиться из-за отсутствия новостей. EEE воспользовалась недовольством, обвиняя правительство в слабости и неспособности выполнить обещания. Как [ROOT.GetLeader] выведет нас из этих мутных вод?"
 bftb_greece.14.a:0 "Самонадеянность привела нас к гибели."
 bftb_greece.15.t:0 "Ираклионская конференция — [FRA.GetAdjective] мандат в Курдистане?"
 bftb_greece.15.desc:0 "Первый вопрос голосования — следует ли после капитуляции государства [TUR.GetNameDef] предоставить государству [FRA.GetNameDef] мандат в [TUR.GetAdjective] Курдистане. Многие присутствующие [FRA.GetAdjective] чиновники считают это логичным, учитывая близость государства [FRA.GetNameDef] к региону и заметное национальное самосознание в [TUR.GetAdjective] Курдистане. Однако дома эта идея может встретить сопротивление, поскольку [FRA.GetAdjective] империя уже чрезмерно растянута.\n\nЕсли [FRA.GetAdjective] сторона получит уступку в Анатолии, договор обяжет её помочь государству [GRE.GetNameDef] после начала войны с государством [TUR.GetNameDef]. Если предложение не пройдёт, государство [FRA.GetNameDef] не будет иметь никаких обязательств перед государством [GRE.GetNameDef]."
 bftb_greece.15.a:0 "Мы голосуем за!"
 bftb_greece.15.b:0 "Мы голосуем против!"
 GRE_french_kurdistan_option_tt:1 "Если предложение будет принято и Ираклионская конференция завершится успехом, то после капитуляции §Y[TUR.GetNameDefCap]§! государство §Y[FRA.GetNameDefCap]§! создаст §Yкурдское§! марионеточное государство во всех удерживаемых государством [TUR.GetAdjective] регионах, являющихся национальными территориями §YКурдистана§!."
 bftb_greece.16.t:0 "Ираклионская конференция — [FRA.GetAdjective] сторона получает мандат!"
 bftb_greece.16.desc:0 "Большинство делегатов проголосовало за предоставление государству [FRA.GetNameDef] мандата в Курдистане после успешного свержения [TUR.GetAdjective] государства. [FRA.GetAdjective] чиновники похвалили делегатов за мудрую государственную позицию и уже направили центральному [FRA.GetAdjective] правительству указания начать подготовку администрации региона."
 bftb_greece.16.a:0 "Предложение принято!"
 bftb_greece.17.t:0 "Ираклионская конференция — [FRA.GetAdjective] стороне отказано в мандате!"
 bftb_greece.17.desc:0 "Большинство делегатов проголосовало против передачи государству [FRA.GetNameDef] каких-либо территорий в Курдистане после поражения [TUR.GetAdjective] государства. [FRA.GetAdjective] чиновники едва не покинули конференцию, назвав её фарсом, но решили остаться, чтобы влиять на дальнейшие заседания."
 bftb_greece.17.a:0 "Предложение отклонено!"
 bftb_greece.18.t:0 "Ираклионская конференция — [ENG.GetAdjective] протекторат в Армении?"
 bftb_greece.18.desc:0 "Вопрос этого голосования — следует ли после капитуляции государства [TUR.GetNameDef] предоставить государству [ENG.GetNameDef] армянский протекторат в [TUR.GetAdjective] регионе [354.GetName]. В свете недавних тревожных событий идея создания армянского государства внутри [TUR.GetAdjective] границ вызывает споры. Однако [ENG.GetAdjective] делегаты утверждают, что создание армянского государства на [SOV.GetAdjective] границе является нравственно оправданным и стратегически разумным.\n\nЕсли [ENG.GetAdjective] сторона получит уступку в Анатолии, договор обяжет её помочь государству [GRE.GetNameDef] после начала войны с государством [TUR.GetNameDef]. Если предложение не пройдёт, государство [ENG.GetNameDef] не будет иметь никаких обязательств перед государством [GRE.GetNameDef]."
 bftb_greece.18.a:0 "Мы голосуем за!"
 bftb_greece.18.b:0 "Мы голосуем против!"
 GRE_british_armenia_option_tt:1 "Если предложение будет принято и Ираклионская конференция завершится успехом, то после капитуляции §Y[TUR.GetNameDefCap]§! государство §Y[ENG.GetNameDefCap]§! создаст §Yармянское§! марионеточное государство в регионе §Y[354.GetName]§!."
 bftb_greece.19.t:0 "Ираклионская конференция — [ENG.GetAdjective] сторона получает протекторат!"
 bftb_greece.19.desc:0 "Большинство делегатов проголосовало за предоставление государству [ENG.GetNameDef] армянского протектората, созданного на обломках побеждённого государства [TUR.GetName]. [ENG.GetAdjective] чиновники похвалили делегатов за мудрую государственную позицию и уже направили центральному [ENG.GetAdjective] правительству указания начать подготовку администрации региона."
 bftb_greece.19.a:0 "Предложение принято!"
 bftb_greece.20.t:0 "Ираклионская конференция — [ENG.GetAdjective] стороне отказано в марионеточном государстве!"
 bftb_greece.20.desc:0 "Большинство делегатов проголосовало против права государства [ENG.GetNameDef] создать армянское марионеточное государство в северной Анатолии. [ENG.GetAdjective] чиновники осудили решение и назвали всю конференцию хаотичной, но предпочли остаться, чтобы влиять на дальнейшие заседания."
 bftb_greece.20.a:0 "Предложение отклонено!"
 bftb_greece.21.t:0 "Ираклионская конференция — [ITA.GetAdjective] колонии в регионах [342.GetName] и [345.GetName]"
 bftb_greece.21.desc:0 "Тема этого тура голосования заключается в том, будет ли он [ITA.GetNameDef] колониальные территории в южной Анатолии после [TUR.GetNameDef] Он был завоеван. У каждого посетителя есть некоторые оговорки относительно передачи территории в Средиземном море свободно. [ITA.GetAdjective]s, но это [ITA.GetAdjective] Делегаты произносят слова [ITA.GetLeader] Когда они решительно заявляют, что предоставление этой территории будет означать только исправление некоторых ошибок «vittoria mutilata».\n\nЭто было решено другими участвующими державами перед формальным началом Гераклионской конвенции, что [ITA.GetAdjective] Участие во вторжении [TUR.GetNameDef] Это было бы нежелательно. Вместо того, чтобы участвовать в войне, [ITA.GetNameDef] Если же они будут удовлетворены, то они будут связаны договором о ненападении с [GRE.GetNameDef] и пакт о невмешательстве в гипотетическую войну с [TUR.GetNameDef]. Если это предложение не будет принято, то независимо от результатов Гераклионской конвенции, [ITA.GetNameDef] не будет иметь обязательств по [GRE.GetNameDef] Когда начнется война, они могут даже попытаться вмешаться."
 bftb_greece.21.a:0 "Мы голосуем за!"
 bftb_greece.21.b:0 "Мы голосуем против!"
 bftb_greece.22.t:0 "Ираклионская конференция — [ITA.GetAdjective] сторона получает территории!"
 bftb_greece.22.desc:0 "Большинство делегатов проголосовало за предоставление государству [ITA.GetNameDef] колоний, выделенных из останков побеждённого государства [TUR.GetName]. [ITA.GetAdjective] чиновники похвалили делегатов за рассудительное решение, а многие члены [ITA.GetAdjective] делегации уже отправились домой, чтобы сообщить новость [ITA.GetLeader]."
 bftb_greece.22.a:0 "Предложение принято!"
 bftb_greece.23.t:0 "Ираклионская конференция — [ITA.GetAdjective] стороне отказано в территориях!"
 bftb_greece.23.desc:0 "Большинство присутствующих делегатов проголосовали за то, чтобы [ITA.GetNameDef] Следует лишить права создавать колонии в южной Анатолии и осудить само движение как более бессмысленное? [ITA.GetAdjective] разжигание войны.[ITA.GetAdjective] Чиновники раскритиковали это решение и использовали всю ситуацию, чтобы проиллюстрировать, что это еще одно доказательство того, что решение было принято. [ITA.GetAdjective] Люди правы, когда верят в «витторию мутилата». Независимо от их личных взглядов на этот вопрос, [ITA.GetAdjective] Делегатам было приказано оставаться в рамках работы конвенции - без сомнения, с надеждой на то, что они все же смогут повлиять на вердикт по заключительному и наиболее важному пункту повестки дня."
 bftb_greece.23.a:0 "Предложение отклонено!"
 bftb_greece.24.t:0 "Ираклионская конференция — Великая идея"
 bftb_greece.24.desc:0 "Вопрос этого голосования — следует ли великим державам разрешить Великую идею, давний реваншистский идеал Великой Греции. [GRE.GetAdjective] национальный лидер [GRE.GetLeader] неожиданно посетил зал заседаний Ираклионской конференции и произнёс страстную речь о том, что Великая идея — не циничный захват земель, а воплощение общей священной мечты, которую веками хранили [GRE.GetAdjective] люди по всему миру.\n\nСомнений нет: если Великую идею отвергнут здесь и сейчас, все уступки и обещания конференции потеряют силу. От сегодняшнего решения может зависеть само будущее демократии и целостности государства [GRE.GetNameDef]."
 bftb_greece.24.a:0 "Мы голосуем за!"
 bftb_greece.24.b:0 "Мы голосуем против!"
 GRE_megali_idea_option_tt:1 "Если предложение будет принято, то после капитуляции §Y[TUR.GetNameDefCap]§! государство §Y[GRE.GetNameDefCap]§! присоединит §YСтамбул§! и другие §Y[TUR.GetAdjective]§! регионы, граничащие с §YЭгейским морем§!. §RЕсли Греции откажут в Великой идее, все ранее принятые предложения будут аннулированы!§!"
 bftb_greece.25.t:0 "Ираклионская конференция — Великая идея возрождена!"
 bftb_greece.25.desc:0 "Большинство делегатов проголосовало за право государства [GRE.GetNameDef] воплотить Великую идею в случае победы над государством [TUR.GetNameDef] в войне. Наши чиновники в восторге, а [ROOT.GetLeader] уже обратился к нации и объявил конференцию успешной. Конечно, никто за пределами закрытого круга участников не знает её истинной цели, но многие граждане догадались, что главным вопросом было осуществление Великой идеи.\n\nМы получили на конференции всё, чего хотели, но теперь начинается самое трудное..."
 bftb_greece.25.a:0 "Блаженны разжигатели войны!"
 bftb_greece.26.t:0 "Ираклионская конференция — Великая идея отвергнута!"
 bftb_greece.26.desc:0 "Большинство делегатов проголосовало против права государства [GRE.GetNameDef] создать Великую Грецию в рамках стремления к Великой идее. Наши чиновники со смесью шока и ужаса подтвердили решение и разослали всех домой с известием о провале конференции. [ROOT.GetLeader] пришлось нервно обратиться к толпе в столице и признать полную неудачу, и её реакция оказалась крайне недоброжелательной. По всей стране уже вспыхивают протесты, и ситуация грозит выйти из-под контроля."
 bftb_greece.26.a:0 "Какая трата времени..."
 ROOT_voted_aye_megali_effect:0 "Голосует за!"
 ROOT_voted_nay_megali_effect:0 "Голосует против!"
 bftb_greece.29.t:0 "Коммунисты захватывают власть в Греции"
 bftb_greece.29.desc:0 "Последние разведывательные донесения подтверждают худшее: коммунисты захватили Афины и навязали свою власть [FROM.GetAdjective] народу. Мы должны подготовиться к возможному конфликту. Если государство [SOV.GetNameDef] сочтёт нас недостаточно уступчивыми, оно наверняка попытается втянуть государство [FROM.GetNameDef] в заговор с целью ослабить или уничтожить нас. Кабинет непреклонен: необходимо закрыть проливы для государств [FROM.GetNameDef] и [SOV.GetNameDef], чтобы избежать удара с двух сторон. Это даст немного времени, но конфликт всё равно возможен."
 bftb_greece.29.a:0 "Конфликт явно назревает..."
 bftb_greece.31.t:0 "Босфорская авантюра"
 bftb_greece.31.desc:0 "Чиновники Политбюро государства [SOV.GetNameDef] наконец посвятили нас в тайные планы относительно будущего государства [TUR.GetNameDef], и нам отведена ключевая роль. План прост: от имени государства [SOV.GetNameDef] и международной революции мы направим государству [TUR.GetNameDef] заведомо неприемлемый ультиматум, а неизбежный [TUR.GetAdjective] отказ используем как повод разжечь конфликт в Эгейском море.\n\nВысшее командование рекомендует разместить лучшие части вдоль фракийской границы с государством [TUR.GetNameDef] и подготовить солдат к нападениям на [TUR.GetAdjective] территории у побережья наших островов в Эгейском море. Многие в администрации и вооружённых силах сомневаются, что мы одолеем [TUR.GetAdjective] армию один на один, но государство [SOV.GetNameDef] обещало начать наступление на севере, если наш первый удар по Константинополю провалится."
 bftb_greece.31.a:0 "Удача благоволит смелым."
 GRE_border_war_possible_tt:0 "Если ситуация обострится, нас могут вынудить участвовать в §Rпограничных конфликтах§! вдоль границы с государством §Y[TUR.GetNameDef]§!."
 bftb_greece.32.t:0 "Государство [GRE.GetNameDefCap] направляет ультиматум"
 bftb_greece.32.desc:1 "Наши чиновники с возмущением отреагировали на прочтение совершенно нереалистичных и необоснованных требований беспомощных марксистов. [FROM.GetNameDef]. Утверждать, что действует от имени [SOV.GetNameDef], [FROM.GetNameDef] Он потребовал, чтобы мы восстановили все требования Лозаннского договора и разрешили присутствие Лозанны. [SOV.GetAdjective] солдат по всей нашей стране, чтобы они могли гарантировать наше присоединение к договору в качестве надежной и объективной третьей стороны.\n\nЧто может быть [FROM.GetNameDef] Может быть, надеетесь получить выгоду от такого смехотворного требования, кроме конфликта вдоль наших границ? Мы на каждом шагу пытались сохранить мир на внутреннем фронте, но ясно, что мир никогда не был вариантом. Если [FROM.GetNameDef] действительно действует от имени [SOV.GetNameDef]Тогда, возможно, наша единственная надежда на спасение - капитуляция в надежде, что мы сможем остановить. [SOV.GetAdjective] Солдаты силой захватывают контроль над нашей страной. Хотя мы никогда прежде не уклонялись от праведной борьбы — действительно ли мы заслуживаем править, если не готовы бороться за свои ценности?"
 bftb_greece.32.a:0 "Мы должны подчиниться."
 bftb_greece.32.b:0 "Государство [FROM.GetAdjective] выбрало тёмный путь; мы должны его исправить."
 bftb_greece.33.t:0 "Государство [FROM.GetNameDefCap] подчиняется!"
 bftb_greece.33.desc:0 "В шокирующем повороте событий к [GRE.GetAdjective] и [SOV.GetAdjective] наблюдатели, [FROM.GetNameDef] Он согласился на все выдвинутые им требования. Разрешения, касающиеся доступа к турецким проливам, не соответствуют их статусу до 1936 года. [SOV.GetAdjective] Войска были приглашены на [FROM.GetAdjective] Почва для обеспечения [FROM.GetNameDef] Он уважает требования, которые были выдвинуты ранее.\n\n[SOV.GetLeader] лично поздравляем [GRE.GetLeader] за мужество, проявленное его нацией в обеспечении того, чтобы этот капер был снят, и уже начал собирать войска для подготовки к их размещению по всему миру. [TUR.GetNameDef]. с [TUR.GetNameDef] нейтрализуется как угроза, [GRE.GetNameDef] В связи с этим было объявлено о необходимости уделять более пристальное внимание другим возможным театрам военных действий в регионе."
 bftb_greece.33.a:0 "Неожиданно, но приятно!"
 bftb_greece.34.t:0 "Государство [SOV.GetNameDefCap] создаёт новое марионеточное правительство на севере!"
 bftb_greece.34.desc:0 "Проклятие, какими же мы были глупцами! Государство [SOV.GetNameDefCap] злоупотребило свободой передвижения по нашей территории, чтобы создать у своих границ конкурирующее коммунистическое правительство, и теперь намерено завоевать от его имени всю страну! Мы должны были сразу понять, чем всё закончится. Некоторые члены правительства уже бежали на север, заявляя, что положение безнадёжно. Возможно, простая капитуляция спасёт больше жизней в предстоящие дни..."
 bftb_greece.34.a:0 "Мудрее служить и жить."
 bftb_greece.34.b:0 "Мы не сдались в 1919 году и не сдадимся сейчас!"
 bftb_greece.35.t:0 "Государство [FROM.GetNameDefCap] отклоняет наш ультиматум!"
 bftb_greece.35.desc:0 "Как и ожидалось, государство [FROM.GetNameDef] отказалось от предъявленного ультиматума. Наши солдаты уже заняли позиции, и теперь мы будем постепенно обострять конфликт, чтобы разжечь полномасштабную войну. Победим мы или проиграем — пока государство [SOV.GetNameDef] стоит рядом, мы не можем потерпеть поражение."
 bftb_greece.35.a:0 "Теперь начинается самое интересное!"
 bftb_greece.36.t:0 "Начинается битва за Босфор!"
 bftb_greece.36.desc:0 "Вопреки ожиданиям высшего командования, мы одержали победу над [FROM.GetAdjective] силами на границе. Воодушевлённые огромным успехом, наши войска уже начали наступление в глубь [FROM.GetAdjective] территории. Получив последние сведения, командование полагает, что государство [FROM.GetNameDef] падёт в считаные дни."
 bftb_greece.36.a:0 "Нужно было лишь выбить дверь, чтобы увидеть всю гниль!"
 bftb_greece.37.t:0 "[FROM.GetAdjective] силы обращены в бегство!"
 bftb_greece.37.desc:0 "[FROM.GetAdjective] провокаторы отброшены после бессмысленного нападения на границу, но донесения наблюдателей показывают, что испытание ещё не окончено. [FROM.GetAdjective] силы собираются на островах Эгейского моря и перебрасывают оружие пугающе близко к региону [339.GetName]. Есть и худшие новости: у [SOV.GetAdjective] границы заметно усилилось движение, а перехваченные сообщения указывают, что нападение на север может начаться в любой день. Мы должны быть готовы и выстоять."
 bftb_greece.37.a:0 "Выстроим коммунистов в ряд и скосим их."
 TUR_border_conflicts_in_trabzon_tt:0 "Будет разумно разместить войска вдоль границы с §Y[354.GetName]§! и §Y[187.GetName]§!, прежде чем ситуация неизбежно вновь ухудшится."
 bftb_greece.38.t:0 "Государство [FROM.GetNameDefCap] побеждает наши силы!"
 bftb_greece.38.desc:0 "К сожалению, наши войска не смогли прорвать [FROM.GetAdjective] оборону в регионе [341.GetName]. Высшее командование разочаровано, но не удивлено. Если [FROM.GetAdjective] силы не ответят, мы вновь повысим ставки. На этот раз государство [SOV.GetNameDef] атакует [FROM.GetAdjective] позиции на севере, а мы высадимся с региона [187.GetName] на побережье регионов [339.GetName] и [340.GetName]. Как мы можем потерпеть неудачу снова?"
 bftb_greece.38.a:0 "Для государства [FROM.GetNameDef] эта игра была нечестной с самого начала..."
 bftb_greece.39.t:0 "Начинается битва за Босфор!"
 bftb_greece.39.desc:0 "Наши силы не были готовы к столь дерзкому нападению [FROM.GetAdjective] войск и понесли тяжёлое поражение в регионе [341.GetName]. [FROM.GetAdjective] наступление не прекратилось, и объявление войны, несомненно, неизбежно. Поражение разочаровало, но не стало катастрофой: война только начинается, и народ твёрдо поддерживает нас в борьбе со старым соперником."
 bftb_greece.39.a:0 "Государство [FROM.GetNameDefCap] не оставило нам выбора!"
 bftb_greece.40.t:0 "Начинается битва за Босфор!"
 bftb_greece.40.desc:0 "Как и ожидало высшее командование, мы победили [FROM.GetAdjective] силы на границе и прорвали оборону Измира. Воодушевлённые огромным успехом, наши войска уже начали наступление в глубь [FROM.GetAdjective] территории. Командование уверено, что государство [FROM.GetNameDef] падёт за несколько недель."
 bftb_greece.40.a:0 "Через Смирну мы захватим всю страну!"
 bftb_greece.41.t:0 "Начинается битва за Босфор!"
 bftb_greece.41.desc:0 "[FROM.GetAdjective] нападение на регион [339.GetName] провалилось, но и для нас оно стало тяжёлой потерей. [ROOT.GetLeader] невольно сравнивает ситуацию с 1919 годом, когда [FROM.GetAdjective] силы в последний раз начали беспощадное наступление в регионе [339.GetName].\n\nПока столичные чиновники скорбят по погибшим в недолгой осаде региона [339.GetName], вся нация кипит от возмущения дерзкими нападениями старого врага на наш суверенитет. Внезапная атака на регион [341.GetName] была презренной, но потери в регионе [339.GetName] непростительны. Если [FROM.GetAdjective] правительство слишком трусливо, чтобы открыто объявить войну, мы сделаем это за него."
 bftb_greece.41.a:0 "Мы отомстим за павших!"
 bftb_greece.42.t:0 "Начинается битва за Босфор!"
 bftb_greece.42.desc:0 "Наши планы разорваны в клочья. Командование допускало одно поражение от [FROM.GetAdjective] сил, но провал обоих внезапных наступлений сулит нам беду. [ROOT.GetLeader] отменил все будущие атаки, однако попытки исправить положение оказались напрасны: делегат государства [FROM.GetAdjective] только что передал объявление войны. Ситуация изменилась, и не обязательно в нашу пользу."
 bftb_greece.42.a:0 "Мы победим! За революцию!"
 bftb_greece.43.t:0 "Начинается битва за Босфор!"
 bftb_greece.43.desc:0 "[FROM.GetAdjective] нападение на регион [339.GetName] увенчалось успехом и стало для нас страшным поражением. [ROOT.GetLeader] невольно сравнивает ситуацию с 1919 годом, когда [FROM.GetAdjective] силы в последний раз захватили регион [339.GetName].\n\nХотя в столице царит мрачное настроение, вся нация кипит от возмущения дерзкими нападениями старого врага на наш суверенитет. Внезапная атака на регион [341.GetName] была презренной, но потери в регионе [339.GetName] непростительны. Если государство [FROM.GetNameDef] действительно хочет новой войны, мы устроим ему такую, которую оно никогда не забудет."
 bftb_greece.43.a:0 "За государство [TUR.GetNameDef]!"
 bftb_greece.44.t:0 "Мы победили государство [FROM.GetNameDef]!"
 bftb_greece.44.desc:0 "Как и ожидалось, Красная армия быстро разгромила жалкие [FROM.GetAdjective] гарнизоны в регионе [354.GetName] и открыла путь для уверенного наступления. Пока мы ударим с севера, государство [GRE.GetNameDef] атакует с запада. У них нет ни единого шанса."
 bftb_greece.44.a:0 "Участие государства [FROM.GetAdjective] в Коминтерне обязательно."
 bftb_greece.45.t:0 "[FROM.GetAdjective] силы отброшены на границе!"
 bftb_greece.45.desc:0 "Чиновники были поражены, узнав, что наши войска в регионе [354.GetName] успешно отбили наступление [FROM.GetAdjective] захватчиков и удержали позиции вопреки подавляющему превосходству врага. Мы получили не только срочное коммюнике от [FROM.GetAdjective] посла с восторженными извинениями за происшествие, но и разведданные, обвиняющие [GRE.GetAdjective] режим в организации всей операции. Нас заверили, что не следует ожидать [FROM.GetAdjective] ответных действий, если борьба с государством [GRE.GetNameDef] перерастёт в войну."
 bftb_greece.45.a:0 "Мы спаслись от гибели."
 bftb_greece.46.t:0 "[FROM.GetAdjective] силы отражают наше наступление!"
 bftb_greece.46.desc:0 "Поступило сообщение, что наступление на регион [354.GetName] завершилось полным провалом, нанеся сокрушительный удар нашему международному престижу и самолюбию командования. Мы принесли [FROM.GetAdjective] правительству самые искренние извинения и отказались от поддержки [GRE.GetAdjective] режима, который всё ещё провоцирует [FROM.GetAdjective] государство на западе."
 bftb_greece.46.a:0 "Кого-то за это расстреляют!"
 bftb_greece.47.t:0 "Государство [FROM.GetNameDefCap] прорывает наши позиции в регионе [354.GetName]!"
 bftb_greece.47.desc:1 "Мало кто из советников удивлён тому, что [FROM.GetAdjective] силы смогли отбросить наши войска на севере, но разочарование от этого не меньше. [FROM.GetAdjective] наступление не остановилось у границы региона [354.GetName]: поступают сообщения о редких, но явно масштабных перемещениях войск у наших рубежей и даже о переходе [FROM.GetAdjective] солдат через демаркационную линию в регионе [800.GetName]. Это может означать лишь вторжение. Нужно готовиться к худшему."
 bftb_greece.47.a:0 "Неужели Отечеству грозит гибель?"
 bftb_greece.48.t:0 "[FROM.GetAdjective] силы поднимают коммунистическое восстание на юге!"
 bftb_greece.48.desc:0 "Подлый марксистский режим государства [FROM.GetNameDef] вооружил террориста Иосипа Броза Тито и подтолкнул его к восстанию на юге! Опасность была бы незначительной, если бы государство [FROM.GetNameDef] не сотрудничало активно с мятежным режимом в надежде свергнуть нашу администрацию. Похоже, нам придётся подавить повстанцев, а затем двинуть войска на [FROM.GetAdjective] столицу и заставить их подчиниться."
 bftb_greece.48.a:0 "Проклятый Тито и эти чёртовы [FROM.GetAdjective] люди!"
 GRE_tito_backed_guerilla_war_tt:0 "§YКоммунисты§! при полной поддержке §Yгреков§! начали небольшую гражданскую войну на юге нашей страны."
 bftb_greece.50.t:0 "Король распускает парламент эллинов!"
 bftb_greece.50.desc:0 "Его Величество король Георг II потряс всю страну заявлением, что лично возьмёт управление на себя, чтобы не позволить политическим противникам разорвать нацию на части. Первым указом король приостановил работу парламента эллинов на неопределённый срок, назвав его «гнездом корыстных гадюк».\n\nНекоторые приветствовали решение, но многие влиятельные слои общества его осудили. Республиканские венизелисты и презренные коммунисты после десятилетий вражды объединились в стремлении свергнуть «короля эллинов» и навсегда избавиться от него. Разведка сообщает, что в ближайшие недели или месяцы вполне может начаться гражданская война."
 bftb_greece.50.a:0 "Право короля на власть священно!"
 GRE_absolute_monarch_hostile_factions_tt:1 "§RГражданская война§!, вероятно, неизбежна..."
 bftb_greece.51.t:0 "Монархисты Греции просят нашей помощи!"
 bftb_greece.51.desc:0 "Про-[ROOT.GetAdjective] правительство в Афинах запросило у нас материальную помощь после того, как общенациональный политический раскол привёл к катастрофической гражданской войне. Разумеется, оно имеет право просить, но стоит ли оно запрашиваемых ресурсов — решать только нам."
 bftb_greece.51.a:0 "Им, несомненно, понадобятся винтовки."
 bftb_greece.51.b:0 "Мы можем выделить часть материалов для помощи."
 bftb_greece.51.c:0 "Лучше не вмешиваться в греческие дела."
 bftb_greece.52.t:0 "Государство [FROM.GetNameDefCap] отправляет нам оружие и добровольцев!"
 bftb_greece.52.desc:0 "Мы только что закончили разгружать в порту оружие и добровольцев из государства [FROM.GetNameDef]. Эта поддержка очень кстати и значительно превзошла наши ожидания. В ближайшие месяцы помощь сослужит нам добрую службу."
 bftb_greece.52.a:0 "Истинные союзники короля!"
 bftb_greece.53.t:0 "Государство [FROM.GetNameDefCap] отправляет нам помощь!"
 bftb_greece.53.desc:0 "Мы только что закончили разгружать в порту припасы, отправленные государством [FROM.GetNameDef]. Эта поддержка очень кстати и является приятным проявлением дружбы в столь трудные времена. В ближайшие месяцы помощь сослужит нам добрую службу."
 bftb_greece.53.a:0 "Истинные союзники короля!"
 bftb_greece.54.t:0 "Государство [FROM.GetNameDefCap] отказывается нам помогать"
 bftb_greece.54.desc:0 "[FROM.GetAdjective] дипломат сообщил, что наш призыв о помощи остался без ответа и ожидать поддержки от государства [FROM.GetNameDef] не следует. Ситуация печальна, но мы выстоим и без помощи иностранных держав."
 bftb_greece.54.a:0 "Разочаровывает."
 bftb_greece.55.t:0 "Государство [GRE.GetNameDefCap] предлагает энозис"
 bftb_greece.55.desc:0 "Представитель от [FROM.GetNameDef] Мы предложили объединить наши две нации в одну. Ссылаясь на общую историю и культурное наследие, [FROM.GetAdjective] Представитель заявил, что это воля [FROM.GetAdjective] Правительство, которому мы содействуем в долгой возвышенной концепции «Энозиса»: слияние наших государств в одно большее целое."
 bftb_greece.55.a:0 "Блестящая идея!"
 bftb_greece.55.b:0 "Кипр пойдёт своим путём."
 end_of_cyprus_tt:0 "§RЭто приведёт к окончанию игры!§!"
 bftb_greece.56.t:0 "Государство [CYP.GetNameDefCap] поддерживает энозис"
 bftb_greece.56.desc:0 "Из государства [FROM.GetNameDef] сообщили, что оно готово содействовать долгожданному объединению наших народов в одном государстве под нашим управлением. По всей стране начались празднования, а [ROOT.GetLeader] лично отправился в Никосию и выступил перед жителями, отмечая этот исторический день."
 bftb_greece.56.a:0 "Наконец родственные народы едины!"
 bftb_greece.57.t:0 "Государство [CYP.GetNameDefCap] отвергает энозис!"
 bftb_greece.57.desc:0 "[FROM.GetAdjective] Чиновники сообщили нам, что они не намерены отказываться от своих полномочий. [FROM.GetAdjective] Суверенитет после долгой борьбы за его достижение. Было заявлено, что «энозис» не является концепцией. [FROM.GetAdjective] Правительство готово в это время развлекаться."
 bftb_greece.57.a:0 "Это была не просьба."
 bftb_greece.57.b:0 "Что ж, если таково их желание..."
 bftb_greece.58.t:0 "Государство [FROM.GetNameDefCap] просит об энозисе с Кипром"
 bftb_greece.58.desc:0 "К нам обратился один из [FROM.GetAdjective] Делегат обсудит будущее нашей кипрской колонии. Делегат утверждал, что попытки кипрского национального строительства всегда были обречены на провал, потому что кипрский народ, по сути, является одним из самых влиятельных людей в мире. [FROM.GetAdjective] людей.\n\nДелегат направил письмо от [FROM.GetAdjective] Премьер-министр [FROM.GetLeader] где история понятия «Энозис» была изложена в деталях перед окончательным призывом к союзу Кипра и [FROM.GetNameDef] Сделано. The [FROM.GetAdjective] Делегат пытался заверить нашего представителя, что это не вопрос грубого ирредентизма со стороны государства. [FROM.GetAdjective] сторона; Кипр и [FROM.GetNameDef] имеют общее культурное наследие, общую историю, общий язык и в [FROM.GetAdjective] Перспектива: общая судьба.\n\nНаши военные чиновники подчеркнули важность Кипра как важной стратегической военной базы в Средиземном море, но наши советники по внешней политике подчеркивают, что Кипр имеет большие возможности для развития и укрепления своих прав. [FROM.GetAdjective] Союзник мог бы предоставить гораздо больше, чем Кипр может в одиночку в качестве воздушной и военно-морской базы. Выбор в конечном итоге падает на [ROOT.GetAdjective] Кабинет, но мы должны убедиться, что не оставим [FROM.GetAdjective] Представитель слишком долго ждал нашего ответа."
 bftb_greece.58.a:0 "Мы примем предложение в обмен на официальный союз."
 bftb_greece.58.b:0 "Пусть забирают; Кипр не имеет для нас значения."
 bftb_greece.58.c:0 "[FROM.GetAdjective] правительство должно разделить власть с «кипрскими» властями."
 bftb_greece.58.d:0 "Жадные греки ничего не получат!"
 bftb_greece.59.t:0 "Государство [FROM.GetNameDefCap] соглашается содействовать энозису!"
 bftb_greece.59.desc:0 "После заявления [ROOT.GetLeader] о том, что многолетняя [ROOT.GetAdjective] мечта об энозисе с Кипром наконец станет реальностью благодаря нашим [FROM.GetAdjective] друзьям, настроение в столице можно описать лишь как ликование. Администраторы уже отправились на остров, чтобы обеспечить максимально плавную передачу власти.\n\nЭто поистине великий и исторический день для государства [ROOT.GetNameDef]. Кипр давно является частью [ROOT.GetAdjective] коллективного сознания, и теперь он наконец вернулся в лоно породившей его цивилизации."
 bftb_greece.59.a:0 "Наконец-то вместе!"
 bftb_greece.60.t:0 "Государство [FROM.GetNameDefCap] принимает частичный энозис"
 bftb_greece.60.desc:0 "Государство [FROM.GetNameDefCap] предложило необычный компромисс: оно готово выполнить нашу просьбу об энозисе при условии, что мы будем сотрудничать с кипрским правительством, имеющим тот же статус, что и [FROM.GetAdjective] доминион. Это не совсем нежелательный поворот событий, просто... неожиданный.\n\nКипрское правительство, со своей стороны, согласилось, что если государство [ROOT.GetNameDef] проявит достаточную преданность развитию молодой страны, оно не будет против полного энозиса в будущем. До тех пор придётся довольствоваться новым кипрским союзником, тесно связанным с нами."
 bftb_greece.60.a:0 "Добро пожаловать, братья!"
 bftb_greece.61.t:0 "Государство [FROM.GetNameDefCap] отвергает энозис!"
 bftb_greece.61.desc:0 "Похоже, доверие и вера в давнего союзника были напрасны: государство [FROM.GetNameDef] отказалось даже рассматривать передачу [ROOT.GetAdjective] острова Кипр под наш контроль. Оно ссылается на стратегическое значение острова и опасения по поводу [ROOT.GetAdjective] реваншизма, считая нас недостойными этой территории.\n\nНельзя сказать, что мы совершенно удивлены, но разочарование от этого не менее горько. Сколько лет мы ждали возвращения Кипра в Отечество? Сколько ещё придётся ждать из-за этой неудачи? После такого поворота наш энтузиазм относительно отношений с государством [FROM.GetNameDef] заметно угас."
 bftb_greece.61.a:0 "Мы это запомним..."
 bftb_greece.62.t:0 "Государство [FROM.GetNameDefCap] предлагает совместно подать заявки на вступление в Ось!"
 bftb_greece.62.desc:0 "Когда пришла новость, что старый [FROM.GetAdjective] режим сменился фашистским, советники в столице ощутили глубокую тревогу. Казалось, война стала неизбежной, что особенно горько после наших попыток сохранить мир в Эгейском регионе. Но судьба доказала, что мы ошибались.\n\nНам поступило необычное предложение: фашистское правительство государства [FROM.GetNameDef] считает, что война неизбежно затронет обе страны. Несмотря на идеологические склонности, [FROM.GetLeader] разделяет мнение, что неразумно перечёркивать десятилетия дипломатических усилий ради великой и ужасной войны. Поэтому правительство государства [FROM.GetNameDef] предлагает вместе примкнуть к набирающим силу фашистским державам Европы. [FROM.GetLeader] уверен в неизбежном господстве фашизма на континенте и считает, что вместе мы сможем склонить чашу весов и быстрее завершить войну. [FROM.GetLeader] называет это «милосердием»; [ROOT.GetLeader] не столь уверен."
 bftb_greece.62.a:0 "Во имя мира будем вести войну."
 bftb_greece.62.b:0 "[FROM.GetAdjective] люди окончательно сошли с ума..."
 bftb_greece.63.t:0 "Государство [FROM.GetNameDefCap] соглашается на пакт дружбы эллинотуркизма!"
 bftb_greece.63.desc:0 "Успех! [FROM.GetAdjective] посол передал согласие правительства на наш пакт дружбы. Действуя сообща с фашистскими державами и оставаясь едиными, мы не можем проиграть."
 bftb_greece.63.a:0 "Два заявления на вступление во фракцию, пожалуйста!"
 bftb_greece.63.b:0 "А может быть... турки нам не нужны?"
 GRE_no_turkey_needed:0 "Подделками и обманом мы подорвём отношения §[TUR.GetNameDef]§! с §Yфашистскими державами§!."
 bftb_greece.64.t:0 "Государство [FROM.GetNameDefCap] решительно отвергает пакт дружбы эллинотуркизма!"
 bftb_greece.64.desc:0 "Похоже, [FROM.GetAdjective] правительство страдает хроническим отсутствием дальновидности. Оно не присоединится к неизбежным победителям вместе с нами, потому что состоит из трусов или глупцов. Это не имеет значения: наш путь определён, и всё, что произойдёт с государством [FROM.GetNameDef], отчасти будет его собственной виной."
 bftb_greece.64.a:0 "Сильные унаследуют землю, а слабые погибнут."
 bftb_greece.65.t:0 "Государства [FROM.GetNameDefCap] и [TUR.GetNameDef] предлагают стратегическое партнёрство"
 bftb_greece.65.desc:0 "Словно части головоломки, всё встаёт на свои места. Смена режима в городе [GER.Capital.GetName] была неожиданной и породила множество сомнений в будущем нашей нации. Предложение, направленное из города [GRE.Capital.GetName], сделало это будущее немного яснее.\n\nПохоже, государства [FROM.GetNameDef] и [TUR.GetNameDef] желают создать прочный стратегический союз с нашим правительством. Нам остро не хватает союзников, и вступление этих двух стран в Средиземноморский пакт значительно поможет обеспечить региональные амбиции. Хотя кто сказал, что сами эти страны не являются объектами наших иных амбиций?"
 bftb_greece.65.a:0 "Вместе мы сотворим историю!"
 bftb_greece.65.b:0 "В наших планах на эту пару нет места союзам."
 bftb_greece.66.t:0 "Государства [FROM.GetNameDefCap] и [TUR.GetNameDef] подают заявки на вступление во фракцию [GER.GetFactionName]"
 bftb_greece.66.desc:0 "Мы встретились с делегатами государств [FROM.GetNameDef] и [TUR.GetNameDef] и были удивлены тем, что они совместно подали заявки на вступление во фракцию [ROOT.GetFactionName]. Сюрприз отнюдь не неприятный, но всё же неожиданный. Нам предстоит решить, помогут ли эти партнёры нашим целям или станут помехой."
 bftb_greece.66.a:0 "В эти бурные времена они станут желанными союзниками."
 bftb_greece.66.b:0 "Nein, они нам не нужны."
 bftb_greece.67.t:0 "Государство [FROM.GetNameDefCap] предлагает стратегическое партнёрство!"
 bftb_greece.67.desc:0 "Как кусочки головоломки, все, кажется, встает на свои места. Смена режима в [GER.Capital.GetName] Это было неожиданно и поставило под сомнение будущее нашей страны. Это будущее стало чуть более заметным благодаря предложению, направленному нам из Афин.\n\nКазалось бы, что [FROM.GetNameDef] У нас есть желание сформировать прочный стратегический альянс с нашим правительством. Мы вредим союзникам и помогаем им. [FROM.GetNameDef] Безусловно, мы могли бы добиться больших успехов в обеспечении наших региональных амбиций. Хотя, кто может сказать, что это не просто жалкая последняя попытка выжить? Может быть, они и не стремятся быть нашими союзниками. Возможно, они видят надпись на стенах и то, как неизбежно для них все закончится, если они будут против нас... И, возможно, это не очень значимое для нас различие."
 bftb_greece.67.a:0 "Рим и Афины — наконец снова вместе!"
 bftb_greece.67.b:0 "Хищник не водит дружбу с добычей."
 bftb_greece.68.t:0 "Государство [FROM.GetNameDefCap] подаёт заявку на вступление во фракцию [GER.GetFactionName]!"
 bftb_greece.68.desc:0 "Мы встретились с делегатами из [FROM.GetNameDef] И они с облегчением услышали, что [FROM.GetAdjective] Правительство выразило желание видеть [FROM.GetNameDef] в [ROOT.GetFactionName]. Вряд ли это сюрприз: [FROM.GetAdjective] Без нас положение было несостоятельным. Мы должны определить, будет ли их присутствие в качестве партнеров в нашем альянсе способствовать достижению наших целей или препятствовать им."
 bftb_greece.68.a:0 "Добро пожаловать, Греция!"
 bftb_greece.68.b:0 "Nein, ни за что!"
 bftb_greece.69.t:0 "Государство [FROM.GetNameDefCap] отклоняет нашу просьбу о союзе!"
 bftb_greece.69.desc:0 "[FROM.GetAdjective] дипломат сообщил, что [FROM.GetLeader] не считает разумным принимать нас в их тесный альянс. Сказать, что мы разочарованы, — значит ничего не сказать. Без союза с государством [FROM.GetNameDef] нам придётся самостоятельно прокладывать путь через этот кризис."
 bftb_greece.69.a:0 "Когда всё закончится, мы всё ещё будем стоять."
 bftb_greece.70.t:0 "Элефтериос Венизелос умирает в изгнании"
 bftb_greece.70.desc:0 "Элефтериос Венизелос, лидер венизелистов и почитаемый титан греческой политики, скончался в изгнании после свержения военными в 1935 году. Венизелос был страстным сторонником греческой многопартийной системы и, пожалуй, не имел равных по влиянию на национальное сознание.\n\nОднако запомнят его не за успехи, а за многочисленные провалы. Именно Венизелос отстаивал разрушительную силу республиканизма, и именно его бессмысленный ревизионизм едва не уничтожил страну в греко-турецкой войне 1919 года. Каждую проблему, с которой сегодня сталкивается Греция, можно возложить к его ногам как главному источнику всех бед.\n\nОн был революционером, государственным деятелем и политическим первопроходцем; он был смутьяном, разжигателем войны и неудачником. Что ещё сказать об Элефтериосе Венизелосе, кроме того, что мы рады: после всей причинённой боли он больше никогда не покажется в Греции."
 bftb_greece.70.a:0 "Скатертью дорога."
 bftb_greece.71.t:0 "Элефтериос Венизелос скончался"
 bftb_greece.71.desc:0 "Премьер-министр Элефтериос Венизелос, лидер венизелистов и почитаемый титан греческой политики, мирно скончался у себя дома. Он был страстным сторонником греческой многопартийной системы и, пожалуй, не имел равных по влиянию на национальное сознание.\n\nКак одними словами воздать должное человеку, столь многое отдавшему стране и соотечественникам? Он создал государство, которому мы имеем честь служить, а его непреходящее наследие переживёт всех нас. Единственное тёмное пятно на безупречной репутации Венизелоса — страшное поражение в разрушительной греко-турецкой войне 1919 года. Это изъян в остальном совершенного наследия, за который мы намерены отомстить.\n\nЭлефтериос Венизелос был революционером, государственным деятелем и политическим первопроходцем; он был нашим этнархом, и мы запомним его непреклонным львом. Темистоклис Софулис занял пост премьер-министра и лидера Fileleftheron и объявил национальный день траура по недавно умершему отцу современной Греции."
 bftb_greece.71.a:0 "Греция в вечном долгу перед вами..."
 bftb_greece.91.t:0 "EEE открывает центр помощи анатолийским беженцам"
 bftb_greece.91.desc:0 "В циничной попытке привлечь новых последователей Георгиос Космидис использовал средства движения для открытия центра помощи беженцам из государства [TUR.GetNameDef], таким же, как он сам. Это было бы достойно похвалы, если бы центры помощи не использовались для вербовки в его безумное движение.\n\nМы оказались в сложном положении: ясно, что Космидис намерен поддерживать эти центры, чтобы набирать обездоленных беженцев Анатолии. Закроем ли мы их, чтобы остановить распространение его яда? Или сохраним репутацию и позволим им работать дальше? Некоторые могут утверждать, что бедным беженцам лучше трудиться в фашистских центрах помощи, чем страдать в трущобах."
 bftb_greece.91.a:0 "Инициатива, достойная поддержки!"
 bftb_greece.91.b:0 "Закрыть его."
 bftb_greece.92.t:0 "EEE требует повысить зарплаты [ROOT.GetAdjective] рабочим"
 bftb_greece.92.desc:0 "EEE воспользовалась вниманием общества и обрушилась с резкой критикой на то, что считает нашей слабой социальной политикой. Смешно, что эти фашисты, словно появившиеся из ниоткуда, считают себя вправе читать нам лекции по бюджетной и социальной политике, однако общественность, похоже, воспринимает их всерьёз."
 bftb_greece.92.a:0 "Возможно... символическая минимальная зарплата?"
 bftb_greece.92.b:0 "Мы не поддадимся фашистскому запугиванию."
 bftb_greece.93.t:0 "Члены EEE вступают в уличные столкновения с нашей полицией!"
 bftb_greece.93.desc:0 "По всей стране вспыхнули драки между членами EEE и полицией, напоминая о временах политического насилия, которые мы надеялись оставить в прошлом. Судя по сообщениям о госпитализациях и нарастающей жестокости, этого не произошло.\n\nНекоторые министры предлагают занять жёсткую позицию и показать стране, что мы не терпим подобного бандитизма. Другие предупреждают, что отвечать фашистам ударом на удар — бой, который мы не сможем выиграть. Народ зол и недоволен, но это не даёт ему права на бессмысленное насилие."
 bftb_greece.93.a:0 "Их недовольство оправдано."
 bftb_greece.93.b:0 "Насилие отвратительно, а толпу следует разогнать."
 bftb_greece.94.t:0 "Члены EEE грабят иностранную фабрику и раздают похищенные товары!"
 bftb_greece.94.desc:0 "В сцене, ставшей, к сожалению, слишком привычной, сторонники EEE ворвались на предприятия, принадлежащие иностранцам, и раздали бедным и обездоленным произведённые там товары. Георгиос Космидис и руководство EEE заявляют, что ничего не знали об этих действиях, но при этом страстно защищают участников этой якобы альтруистической серии грабежей.\n\nТакое поведение нельзя терпеть: уже поступают жалобы от иностранных магнатов из государств [ENG.GetNameDef] и [FRA.GetNameDef]. Но если мы вмешаемся на стороне промышленников, то будем выглядеть марионетками иностранных финансистов; если же позволим анархии продолжаться, международное сообщество сочтёт наше правительство беспомощным."
 bftb_greece.94.a:0 "Не следует им мешать."
 bftb_greece.94.b:0 "Такая анархия недостойна нас!"
 bftb_greece.95.t:0 "EEE присоединяется к нашей борьбе!"
 bftb_greece.95.desc:0 "EEE, до сих пор бывшая занозой в нашем боку, готова объединиться с правительством против общего врага. Георгиос Космидис был одним из самых громких сторонников войны с государством [TUR.GetNameDef], и теперь, когда война пришла к нашим берегам, EEE готова отбросить партийные разногласия, чтобы унизить [TUR.GetAdjective] врагов перед нашими армиями."
 bftb_greece.95.a:0 "Объединившись, мы непобедимы!"
 bftb_greece.95.b:0 "Мы победим, не запятнав себя фашизмом."
 bftb_greece.96.t:0 "Аристотель Онассис возвращается в государство [ROOT.GetNameDef]"
 bftb_greece.96.desc:0 "Богатый магнат и всемирно известный светский деятель Аристотель Онассис впервые за много лет вернулся в государство [ROOT.GetNameDef]. Он не отвечал на вопросы прессы, и наблюдателям трудно проследить за его действиями, однако сообщения указывают, что он сближается с анатолийскими беженцами и, возможно, готовит попытку занять государственный пост."
 bftb_greece.96.a:0 "Что он замышляет?"
 bftb_greece.101.t:0 "Венизелисты и коммунисты объединяются против абсолютной власти короля"
 bftb_greece.101.desc:0 "Если раньше ещё оставались сомнения в союзе коммунистов и венизелистов, теперь они исчезли. Поступили сообщения, что коммунисты тайно вернули Элефтериоса Венизелоса в страну, надеясь сделать его временным лидером после свержения монархии.\n\nБезрассудный план даже для красных предателей. Как они могут думать, что Венизелос отдаст им власть, получив её? Это безумие. Впрочем, ни коммунисты, ни венизелисты никогда не отличались благоразумием. Мы должны готовиться к крайне ожесточённой гражданской войне."
 bftb_greece.101.a:0 "Наши враги жмутся друг к другу, как крысы!"
 bftb_greece.102.t:0 "Коммунисты организуют налёт на фабрику"
 bftb_greece.102.desc:0 "Правоохранительные органы не смогли предвидеть и остановить недавний коммунистический налёт на одну из фабрик, где производятся винтовки для армии. Марксисты вынесли всё, что смогли, а затем попытались сжечь предприятие. К счастью, им удалось лишь повредить здание.\n\nНе нужно гадать, зачем мятежники совершили столь дерзкий налёт на оружейное производство: они наверняка намерены использовать наши винтовки против нас, когда наконец наберутся смелости выйти из тени. Это может стать одной из худших гражданских войн в истории государства [ROOT.GetNameDef]..."
 bftb_greece.102.a:0 "Мы не можем позволить анархистам безнаказанно наносить такие удары."
 bftb_greece.103.t:0 "Генералов-венизелистов тайно возвращают в государство [GRE.GetNameDef]!"
 bftb_greece.103.desc:0 "Вслед за своим презренным лидером в страну тайно вернулись многие бывшие генералы-венизелисты. Коммунистические и республиканские контрабандисты совместно провезли опальных военачальников под видом грузов и спрятали их прежде, чем мы поняли происходящее.\n\nОдно дело — сражаться с неорганизованными мятежниками, и совсем другое — вести полномасштабную гражданскую войну против сил с компетентным военным руководством. Многие советники теперь сомневаются, было ли разумно столь непопулярному монарху публично провозглашать абсолютную власть, но [ROOT.GetLeader] по-прежнему уверен, что с повстанцами быстро расправятся."
 bftb_greece.103.a:0 "Им обязательно было ещё и порт взрывать?"
 bftb_greece.104.t:0 "Организованное сопротивление усиливается на севере и юге!"
 bftb_greece.104.desc:0 "Власти сообщили правительству, что мы практически утратили контроль над севером и югом страны. Сторонники коммунистов и венизелистов свободно действуют на улицах, распространяя клевету и пропаганду, а местные органы власти либо разделяют их взгляды, либо совершенно бессильны.\n\nАрмия, понимая ожидающую её ловушку, отказывается входить в регионы для наведения порядка. Однако она сохраняет полную боевую готовность, и кабинет короля заверили, что как только венизелисты и коммунисты окончательно выйдут из подполья, войска без колебаний примут необходимые меры для возвращения контроля над страной. Разумеется, многие политики сомневаются в искренности этих заверений из-за многочисленных сообщений о коррупции и предательских настроениях в вооружённых силах."
 bftb_greece.104.a:0 "Ситуация выходит из-под контроля!"
 bftb_greece.105.t:0 "Гражданская война!"
 bftb_greece.105.desc:0 "Судьбоносный день наконец наступил: лидер венесуэльцев окончательно вышел из тени, чтобы осудить указ короля как нелегитимный и беспрецедентную угрозу для народа. [FROM.GetNameDef]Демократия. В их глазах у них нет другого выбора, кроме как насильственно свергнуть монархию, чтобы восстановить уже дважды побежденную Греческую Республику.\n\n[ROOT.GetLeader] Он осудил всех мятежников как предателей и пообещал искоренить марксистов и республиканцев, чтобы восстановить порядок в стране. [ROOT.GetNameDef]. В очередной раз на политической арене [ROOT.GetNameDef] Он был превращен в гладиаторский колизей, где только самые могущественные могут уйти как победители."
 bftb_greece.105.a:0 "Сплотимся вокруг короля!"
 bftb_greece.166.t:0 "Наши политики возвращаются с переговоров об инвестициях в Афинах"
 bftb_greece.166.desc:0 "Когда [FROM.GetAdjective] сторона пригласила нас продолжить обсуждение углубления экономических связей, мы не могли отказаться. Она убедительно объяснила, почему укрепление промышленного положения государства [FROM.GetNameDef] может быть выгодно. Теперь нам решать, инвестировать ли в их страну или оставить её промышленный потенциал на волю судьбы."
 bftb_greece.166.a:0 "Ja, мы будем инвестировать!"
 bftb_greece.166.b:0 "На этот раз инвестиций не будет..."
 bftb_greece.166.c:0 "Nein, мы никогда не вложимся в их жалкую страну!"
 bftb_greece.167.t:0 "Наши предприниматели возвращаются с [FROM.GetAdjective] национальной выставки"
 bftb_greece.167.desc:0 "[FROM.GetAdjective] сторона устроила впечатляющее представление! Предложение вложить средства было привлекательным, но у нас есть собственные приоритеты. Решение об инвестициях в [FROM.GetAdjective] страну остаётся за нами."
 bftb_greece.167.a:0 "Ja, мы будем инвестировать!"
 bftb_greece.167.b:0 "На этот раз инвестиций не будет..."
 bftb_greece.167.c:0 "Nein, мы никогда не вложимся в их жалкую страну!"
 bftb_greece.168.t:0 "[FROM.GetAdjective] сторона вымогает у нас средства с помощью плана Шахта!"
 bftb_greece.168.desc:0 "Умный маленький Шедлинг в [FROM.GetNameDef] Они придумали способ использовать нашу схему Понци против нас. Безопасная маленькая лазейка, созданная для того, чтобы мы могли использовать ошибки Шахтплана в нашу пользу, вместо этого была обращена против нас. Мы можем либо сохранить лицо, либо дать [FROM.GetAdjective]Это одна маленькая победа или отказаться от фасада игры по правилам и сбежать от переговоров с [FROM.GetAdjective] людей."
 bftb_greece.168.a:0 "Чтобы избежать последствий, на этот раз уступим..."
 bftb_greece.168.b:0 "Переверните ситуацию против них, Шахт!"
 bftb_greece.168.c:0 "Мы никогда не подчинимся [FROM.GetAdjective] шантажу!"
 bftb_greece.168.d:0 "Они переоценили свои силы и должны понести последствия!"
 gott_bless_herr_schacht_tt:0 "Этот вариант доступен, поскольку §YЯлмар Шахт§! сейчас является вашим министром."
 bftb_greece.169.t:0 "[FROM.GetAdjective] сторона инвестирует!"
 bftb_greece.169.desc:0 "Мы только что вновь приветствовали [FROM.GetAdjective] инвесторов после их недавнего короткого визита, и они принесли хорошие новости об инвестициях и возможностях! С их помощью мы построим по-настоящему современную экономику."
 bftb_greece.169.a:0 "Громкий успех!"
 bftb_greece.169.b:0 "Громкий успех!"
 bftb_greece.169.c:0 "Великолепная работа!"
 bftb_greece.170.t:0 "[FROM.GetAdjective] сторона решает не инвестировать"
 bftb_greece.170.desc:0 "Увы, мы получили слово, что [FROM.GetAdjective]На этот раз мы не будем инвестировать в нашу экономику. Это неутешительный поворот событий, хотя [FROM.GetAdjective] Делегат не исключил будущих инвестиций, что сулит нам хорошие перспективы."
 bftb_greece.170.a:0 "Возможно, в следующий раз."
 bftb_greece.171.t:0 "[FROM.GetAdjective] сторона окончательно выходит из переговоров об инвестициях!"
 bftb_greece.171.desc:0 "Возможно, мы слишком сильно давили на вопрос инвестиций: [FROM.GetAdjective] сторона решила, что не заинтересована в развитии нашей растущей промышленной базы. Если они не хотят помогать нам формировать будущее, придётся обойтись без них."
 bftb_greece.171.a:0 "Может быть... [ITA.GetAdjective] сторона окажется сговорчивее?"
 bftb_greece.172.t:0 "Ялмар Шахт обводит нас вокруг пальца!"
 bftb_greece.172.desc:0 "Мы были глупцами, полагая, что сможем вымогать средства у [FROM.GetAdjective] стороны с помощью плана Шахта, пока сам автор соглашения оставался министром! В итоге платить придётся нам. Какая катастрофа!"
 bftb_greece.172.a:0 "Финансовый волшебник наносит новый удар!"
 bftb_greece.173.t:0 "Наши предприниматели возвращаются с переговоров в Афинах!"
 bftb_greece.173.desc:0 "Когда [FROM.GetAdjective] сторона пригласила нас продолжить обсуждение углубления экономических связей, мы не могли отказаться. Она убедительно объяснила, почему укрепление промышленного положения государства [FROM.GetNameDef] может быть выгодно. Теперь нам решать, инвестировать ли в их страну или оставить её промышленный потенциал на волю судьбы."
 bftb_greece.173.a:0 "Мы предоставим им хартию, чтобы они могли инвестировать."
 bftb_greece.173.b:0 "Сейчас это не отвечает интересам государства [ENG.GetNameDef]."
 bftb_greece.173.c:0 "Простите, старина, но у Джона Буля есть дела поважнее!"
 bftb_greece.174.t:0 "Наши политики посещают [FROM.GetAdjective] национальную выставку "
 bftb_greece.174.desc:0 "[FROM.GetAdjective] сторона устроила впечатляющее представление! Предложение вложить средства было привлекательным, но у нас есть собственные приоритеты. Решение об инвестициях в [FROM.GetAdjective] страну остаётся за нами."
 bftb_greece.174.a:0 "Они могут рассчитывать на нашу поддержку!"
 bftb_greece.174.b:0 "На этот раз это не отвечает интересам Британии."
 bftb_greece.174.c:0 "Простите, старина, но у Джона Буля есть дела поважнее!"
 bftb_greece.175.t:0 "[FROM.GetAdjective] сторона предлагает детали кораблей в обмен на инвестиции"
 bftb_greece.175.desc:0 "Любопытное предложение от [FROM.GetAdjective] стороны: она хочет передать нам комплектующие для облегчения строительства кораблей в обмен на увеличение инвестиций в её страну. Возможно, государствам немного необычно торговаться на столь бытовом уровне, но единственное, что когда-либо было по-настоящему ортодоксальным у [FROM.GetAdjective] народа, — его религия."
 bftb_greece.175.a:0 "Почти честная сделка!"
 bftb_greece.175.b:0 "Сейчас нам не нужны [FROM.GetAdjective] комплектующие."
 bftb_greece.175.c:0 "Простите, государство [FROM.GetName], но наши дела с вами окончены. Навсегда!"
 bftb_greece.176.t:0 "Государство [FROM.GetNameDefCap] решает инвестировать!"
 bftb_greece.176.desc:0 "Мы только что вновь приветствовали [FROM.GetAdjective] инвесторов после их недавнего короткого визита, и они принесли хорошие новости об инвестициях и возможностях! С их помощью мы построим по-настоящему современную экономику."
 bftb_greece.176.a:0 "Громкий успех!"
 bftb_greece.176.b:0 "Громкий успех!"
 bftb_greece.176.c:0 "На [FROM.GetAdjective] сторону всегда можно положиться!"
 bftb_greece.177.t:0 "[FROM.GetAdjective] сторона решает не инвестировать на этот раз"
 bftb_greece.177.desc:0 "Увы, нам сообщили, что государство [FROM.GetNameDef] на этот раз не станет вкладывать средства в нашу экономику. Это разочаровывает, хотя [FROM.GetAdjective] делегат не исключил будущих инвестиций, что даёт надежду."
 bftb_greece.177.a:0 "Что ж, возможно, в следующий раз."
 bftb_greece.178.t:0 "Государство [FROM.GetNameDefCap] принимает закон, запрещающий нам добиваться дальнейших инвестиций!"
 bftb_greece.178.desc:0 "Возможно, мы слишком сильно давили на вопрос инвестиций: государство [FROM.GetNameDef] решило, что не заинтересовано в развитии нашей растущей промышленной базы. Если оно не хочет помогать нам формировать будущее, придётся обойтись без него."
 bftb_greece.178.a:0 "Осмелимся ли мы заключить сделку с государством [SOV.GetNameDef]?"
 bftb_greece.179.t:0 "[FROM.GetAdjective] чиновники обращаются к нам в столице с просьбой об инвестициях"
 bftb_greece.179.desc:0 "Когда [FROM.GetAdjective] сторона пригласила нас продолжить обсуждение углубления экономических связей, мы не могли отказаться. Она убедительно объяснила, почему укрепление промышленного положения государства [FROM.GetNameDef] может быть выгодно. Теперь нам решать, инвестировать ли в их страну или оставить её промышленный потенциал на волю судьбы."
 bftb_greece.179.a:0 "Oui, мы можем вложить небольшую сумму."
 bftb_greece.179.b:0 "Не в этот раз."
 bftb_greece.179.c:0 "Нас совершенно не интересуют [FROM.GetAdjective] дела!"
 bftb_greece.180.t:0 "Наши чиновники посещают национальную выставку государства [FROM.GetNameDef]"
 bftb_greece.180.desc:0 "[FROM.GetAdjective] сторона устроила впечатляющее представление! Предложение вложить средства было привлекательным, но у нас есть собственные приоритеты. Решение об инвестициях в [FROM.GetAdjective] страну остаётся за нами."
 bftb_greece.180.a:0 "Oui, мы инвестируем в государство [FROM.GetNameDef]."
 bftb_greece.180.b:0 "Не в этот раз."
 bftb_greece.180.c:0 "Нас совершенно не интересуют дела государства [FROM.GetNameDef]!"
 bftb_greece.181.t:0 "[FROM.GetAdjective] правительство подкупает наши профсоюзы!"
 bftb_greece.181.desc:0 "Эти коварные негодяи из государства [FROM.GetNameDef] решили выкрутить нам руки и заставить инвестировать в груду камней, которую они называют родиной! Профсоюзы пикетируют правительство, обвиняя нас в сознательном усугублении безработицы и отказе от предложений столь «щедрого» [FROM.GetAdjective] народа. Это абсурд, их коррупция очевидна. Но все карты у них. Пойдём ли мы по пути наименьшего сопротивления и дадим профсоюзам, а значит и государству [FROM.GetNameDef], желаемое? Или отстоим принципы в момент, когда принципы могут погубить нас всех?"
 bftb_greece.181.a:0 "Сейчас мы не можем позволить себе забастовки..."
 bftb_greece.181.b:0 "Ваши угрозы нас не пугают, Sans-couilles!"
 bftb_greece.181.c:0 "Ах, Grèce — le roi des cons! Держитесь от нас подальше!"
 bftb_greece.182.t:0 "Государство [FROM.GetNameDefCap] инвестирует!"
 bftb_greece.182.desc:0 "Мы только что вновь приветствовали [FROM.GetAdjective] инвесторов после их недавнего короткого визита, и они принесли хорошие новости об инвестициях и возможностях! С их помощью мы построим по-настоящему современную экономику."
 bftb_greece.182.a:0 "Громкий успех!"
 bftb_greece.182.b:0 "Громкий успех!"
 bftb_greece.182.c:0 "Поистине, нас связывает великая дружба!"
 bftb_greece.183.t:0 "Государство [FROM.GetNameDefCap] решает не инвестировать на этот раз"
 bftb_greece.183.desc:0 "Увы, нам сообщили, что государство [FROM.GetNameDef] на этот раз не станет вкладывать средства в нашу экономику. Это разочаровывает, хотя [FROM.GetAdjective] делегат не исключил будущих инвестиций, что даёт надежду."
 bftb_greece.183.a:0 "Что ж, возможно, в следующий раз."
 bftb_greece.184.t:0 "[FROM.GetAdjective] сторона выдворяет нашего делегата и исключает возможность инвестиций"
 bftb_greece.184.desc:0 "Возможно, мы слишком сильно давили на вопрос инвестиций: государство [FROM.GetNameDef] решило, что не заинтересовано в развитии нашей растущей промышленной базы. Если оно не хочет помогать нам формировать будущее, придётся обойтись без него."
 bftb_greece.184.a:0 "Осмелимся ли мы заключить сделку с государством [SOV.GetNameDef]?"
 bftb_greece.185.t:0 "Государство [FROM.GetNameDefCap] просит помочь с индустриализацией"
 bftb_greece.185.desc:0 "Когда государство [FROM.GetNameDef] пригласило нас обсудить углубление экономических связей, мы не могли отказаться. Что могло довести [FROM.GetAdjective] сторону до такой отчаянности, что она обратилась к нам за финансовой помощью? Она убедительно объяснила, почему укрепление промышленного положения государства [FROM.GetNameDef] может быть выгодно — особенно если это принесёт пользу и нам. Теперь нам решать, инвестировать ли в их страну или оставить её промышленный потенциал на волю судьбы."
 bftb_greece.185.a:0 "Есть альтернативы войне!"
 bftb_greece.185.b:0 "Возможно, позднее."
 bftb_greece.185.c:0 "После завоевания у них ещё будет возможность индустриализироваться!"
 bftb_greece.186.t:0 "[FROM.GetAdjective] дипломаты надеются умерить [ROOT.GetAdjective] амбиции в Средиземноморье"
 bftb_greece.186.desc:0 "Мы приняли делегата государства [FROM.GetNameDef], который передал обеспокоенность своего правительства растущим [ROOT.GetAdjective] политическим вмешательством в их дела. Ему разрешено предложить сделку: они предоставят нам материальные товары, а мы ослабим попытки захватить контроль над всеми институтами их государства.\n\nРазумеется, мы отрицаем всякое вмешательство, хотя все знаем правду. Предложение щедрое, и желание [FROM.GetAdjective] стороны сохранить суверенитет, несомненно, искренне. Нам пригодятся материалы, но и полное подчинение государства [FROM.GetNameDef] тоже было бы полезно..."
 bftb_greece.186.a:0 "Помощь будет кстати."
 bftb_greece.186.b:0 "Возможно, мы согласимся в будущем, но не сейчас."
 bftb_greece.186.c:0 "Ах, от вассальной зависимости так просто не уйти!"
 bftb_greece.187.t:0 "Государство [FROM.GetNameDefCap] инвестирует!"
 bftb_greece.187.desc:0 "Мы только что вновь приветствовали [FROM.GetAdjective] инвесторов после их недавнего короткого визита, и они принесли хорошие новости об инвестициях и возможностях! Вместе с ними прибыли незваные наблюдатели, которых мы быстро потеряли из виду, пока они занимались неизвестными делами. Как бы то ни было, с [FROM.GetAdjective] помощью мы построим по-настоящему современную экономику."
 bftb_greece.187.a:0 "Сделка с дьяволом лучше смерти."
 bftb_greece.187.b:0 "Мы дорого платим за сохранение независимости."
 bftb_greece.188.t:0 "Государство [FROM.GetNameDefCap] не инвестирует на этот раз"
 bftb_greece.188.desc:0 "Увы, нам сообщили, что государство [FROM.GetNameDef] на этот раз не станет вкладывать средства в нашу экономику. Это разочаровывает, хотя [FROM.GetAdjective] делегат не исключил будущих инвестиций, что даёт надежду."
 bftb_greece.188.a:0 "Возможно, это скрытое благословение..."
 bftb_greece.189.t:0 "Государство [FROM.GetNameDefCap] отвергает наших делегатов и высылает дипломатов!"
 bftb_greece.189.desc:0 "Возможно, мы слишком сильно давили на вопрос инвестиций: государство [FROM.GetNameDef] решило, что не заинтересовано в развитии нашей растущей промышленной базы. Если оно не хочет помогать нам формировать будущее, придётся обойтись без него."
 bftb_greece.189.a:0 "Наверняка это знак худших событий впереди."
 bftb_greece.190.t:0 "[FROM.GetAdjective] чиновники завершают визит в Президиум"
 bftb_greece.190.desc:0 "Мы только что получили удовольствие принимать у себя официальных лиц. [FROM.GetNameDef]Одна из них выступила перед Президиумом в качестве гостя, где подчеркнула прочные отношения между нашими народами. Это был приятный момент, но истинное предназначение этого [FROM.GetAdjective] Визит был посвящен обсуждению инвестиций в их борющуюся страну. Марксистские теоремы диктуют, что революция может произойти только в промышленно развитых обществах, но наша история и опыт [FROM.GetAdjective]Скажите нам иначе.\n\nУ чиновников есть сильное чувство, что мы должны помочь им. [FROM.GetAdjective]s, поскольку у нас есть ресурсы для этого. Но нам также нужны наши ресурсы. Что нам делать?"
 bftb_greece.190.a:0 "Государство [ROOT.GetNameDefCap] направит часть ресурсов на развитие государства [FROM.GetNameDef]."
 bftb_greece.190.b:0 "Нет, сейчас инвестиций не будет."
 bftb_greece.190.c:0 "[ROOT.GetAdjective] народ не будет страдать ради того, чтобы несколько [FROM.GetAdjective] крестьян работали на фабрике."
 bftb_greece.191.t:0 "[ROOT.GetAdjective] чиновники возвращаются после обследования государства [FROM.GetNameDef]"
 bftb_greece.191.desc:0 "Когда [FROM.GetAdjective]Решили пригласить нас обсудить углубление наших экономических связей, ну отказать мы не могли. Что может управлять [FROM.GetAdjective]Они настолько отчаялись, что обратились к нам за финансовой помощью? Излишне говорить, что они привели убедительные аргументы в пользу того, почему это может быть идеальным. [FROM.GetNameDef]Промышленное положение было укреплено... Особенно, когда это может улучшить нашу собственную. Вопрос о том, хотим ли мы инвестировать в их страну или оставить их промышленный потенциал на произвол судьбы - это вопрос, который мы решаем."
 bftb_greece.191.a:0 "Расширение вооружений государства [FROM.GetNameDef] во имя борьбы с реакционерами может быть разрешено."
 bftb_greece.191.b:0 "Нет, сейчас инвестиций не будет."
 bftb_greece.191.c:0 "[ROOT.GetAdjective] народ не будет страдать ради того, чтобы несколько [FROM.GetAdjective] крестьян работали на фабрике."
 bftb_greece.192.t:0 "[FROM.GetAdjective] чиновники предлагают схему обратных инвестиций в наши заброшенные сибирские регионы"
 bftb_greece.192.desc:0 "Мы приняли делегата государства [FROM.GetNameDef], которая передала обеспокоенность своего правительства растущим [ROOT.GetAdjective] политическим вмешательством в их дела. Ей разрешено предложить сделку: они инвестируют в наши бедные регионы, а мы ослабим попытки захватить контроль над всеми институтами их государства.\n\nРазумеется, мы отрицаем всякое вмешательство, хотя все знаем правду. Предложение щедрое, и желание [FROM.GetAdjective] стороны сохранить суверенитет, несомненно, искренне. Нам пригодятся материалы, но и полное подчинение государства [FROM.GetNameDef] тоже было бы полезно..."
 bftb_greece.192.a:0 "Политбюро одобрило [FROM.GetAdjective] схему; она будет осуществлена."
 bftb_greece.192.b:0 "Ставка считает, что мягкая сила над государством [FROM.GetNameDef] полезнее."
 bftb_greece.192.c:0 "Государство [ROOT.GetNameDefCap] завершило дела с государством [FROM.GetNameDef]."
 bftb_greece.193.t:0 "Государство [FROM.GetNameDefCap] инвестирует!"
 bftb_greece.193.desc:0 "Мы только что вновь приветствовали [FROM.GetAdjective] инвесторов после их недавнего короткого визита, и они принесли хорошие новости об инвестициях и возможностях! Вместе с ними прибыли незваные наблюдатели, которых мы быстро потеряли из виду, пока они занимались неизвестными делами. Как бы то ни было, с [FROM.GetAdjective] помощью мы построим по-настоящему современную экономику."
 bftb_greece.193.a:0 "Безобидное соглашение."
 bftb_greece.193.b:0 "Сделка с дьяволом лучше смерти."
 bftb_greece.193.c:0 "Мы дорого платим за сохранение независимости."
 bftb_greece.194.t:0 "Государство [FROM.GetNameDefCap] не инвестирует на этот раз"
 bftb_greece.194.desc:0 "Увы, нам сообщили, что государство [FROM.GetNameDef] на этот раз не станет вкладывать средства в нашу экономику. Это разочаровывает, хотя [FROM.GetAdjective] делегат не исключил будущих инвестиций, что даёт надежду."
 bftb_greece.194.a:0 "Возможно, это скрытое благословение..."
 bftb_greece.195.t:0 "Государство [FROM.GetNameDefCap] отвергает наших делегатов и высылает дипломатов!"
 bftb_greece.195.desc:0 "Возможно, мы слишком сильно давили на вопрос инвестиций: государство [FROM.GetNameDef] решило, что не заинтересовано в развитии нашей растущей промышленной базы. Если оно не хочет помогать нам формировать будущее, придётся обойтись без него."
 bftb_greece.195.a:0 "Теперь мы действительно остались одни со своими экономическими бедами."
 bftb_greece.200.t:0 "Ираклионская конференция завершена — великий успех!"
 bftb_greece.200.desc:0 "Ираклионская конференция официально завершилась и стала абсолютным успехом! Все участники получили гарантии территориальных приобретений, а государство [GRE.GetNameDef], похоже, значительно расширит свои границы. Вместе мы отомстим за Севрский договор куда более заслуживающему этого государству [TUR.GetName]."
 bftb_greece.200.a:0 "Мы все заслужили похвалу."
 bftb_greece.201.t:0 "Ираклионская конференция завершена"
 bftb_greece.201.desc:0 "Ираклионская конференция официально завершилась и стала большим успехом! Все участники, кроме государства [ENG.GetNameDef], получили гарантии территориальных приобретений, а государство [GRE.GetNameDef], похоже, значительно расширит свои границы. Вместе подписанты отомстят за Севрский договор куда более заслуживающему этого государству [TUR.GetName]."
 bftb_greece.201.a:0 "Ура!"
 bftb_greece.201.b:0 "Какая чушь!"
 bftb_greece.202.t:0 "Ираклионская конференция завершена"
 bftb_greece.202.desc:0 "Ираклионская конференция официально завершилась и стала большим успехом! Все участники, кроме государства [FRA.GetNameDef], получили гарантии территориальных приобретений, а государство [GRE.GetNameDef], похоже, значительно расширит свои границы. Вместе подписанты отомстят за Севрский договор куда более заслуживающему этого государству [TUR.GetName]."
 bftb_greece.202.a:0 "Великолепная инициатива!"
 bftb_greece.202.b:0 "Какие глупцы..."
 bftb_greece.203.t:0 "Ираклионская конференция завершена"
 bftb_greece.203.desc:0 "Ираклионская конференция официально завершилась и стала грандиозным успехом! Все участники, кроме государства [ITA.GetNameDef], получили гарантии территориальных приобретений, а государство [GRE.GetNameDef], похоже, значительно расширит свои границы. Вместе подписанты отомстят за Севрский договор куда более заслуживающему этого государству [TUR.GetName]."
 bftb_greece.203.a:0 "Выдающийся результат!"
 bftb_greece.203.b:0 "Запомните эту изувеченную победу..."
 bftb_greece.204.t:0 "Ираклионская конференция завершена"
 bftb_greece.204.desc:0 "Ираклионская конференция официально завершилась и стала... приемлемым успехом. Ни государство [ENG.GetNameDef], ни государство [FRA.GetNameDef] не будут участвовать в грядущей войне, поскольку им не обещали территорий от разгромленного государства [TUR.GetName]. Похоже, государство [GRE.GetNameDef] значительно расширит свои границы — если сумеет самостоятельно победить государство [TUR.GetNameDef]..."
 bftb_greece.204.a:0 "И всё же это победа."
 bftb_greece.204.b:0 "Какая трата времени..."
 bftb_greece.205.t:0 "Ираклионская конференция завершена"
 bftb_greece.205.desc:0 "Ираклионская конференция официально завершилась и оказалась вполне приемлемым успехом! Все участники, кроме государств [ENG.GetNameDef] и [ITA.GetNameDef], получили гарантии территориальных приобретений, а государство [GRE.GetNameDef], похоже, значительно расширит свои границы. Вместе подписанты отомстят за Севрский договор куда более заслуживающему этого государству [TUR.GetName]."
 bftb_greece.205.a:0 "Где-то выигрываешь, где-то проигрываешь!"
 bftb_greece.205.b:0 "Какая трата времени..."
 bftb_greece.205.c:0 "Мы не потерпим второго предательства!"
 bftb_greece.206.t:0 "Ираклионская конференция завершена"
 bftb_greece.206.desc:0 "Ираклионская конференция официально завершилась и оказалась вполне приемлемым успехом! Все участники, кроме государств [FRA.GetNameDef] и [ITA.GetNameDef], получили гарантии территориальных приобретений, а государство [GRE.GetNameDef], похоже, значительно расширит свои границы. Вместе подписанты отомстят за Севрский договор куда более заслуживающему этого государству [TUR.GetName]."
 bftb_greece.206.a:0 "И всё же это победа."
 bftb_greece.206.b:0 "Какая трата времени..."
 bftb_greece.206.c:0 "Мы не потерпим второго предательства!"
 bftb_greece.207.t:0 "EEE устраивает переворот!"
 bftb_greece.207.desc:0 "Мы должны были понимать, что всё закончится именно так: руководство EEE объявило нас слабыми и беспомощными, а также главным препятствием на пути к [ROOT.GetAdjective] величию. Головорезы устроили грандиозный спектакль в парламенте эллинов, обвинили всех нас в предательстве и поклялись сделать всё, чтобы свергнуть правительство. Демонстративно покинув зал, через несколько часов они вернулись во главе толпы, требующей нашей немедленной коллективной отставки.\n\nОбщественное мнение больше не на нашей стороне, и, откровенно говоря, многие министры утратили веру в способность администрации довести обещанное до конца. Распространено мнение, что походом на Константинополь без иностранной и народной поддержки мы отправляем всю страну в смертельный марш, после которого она уже не оправится."
 bftb_greece.207.a:0 "Мы должны ответить за свои провалы."
 bftb_greece.207.b:0 "Афинами никогда не будут править фашистские псы!"
 byzantinist_coup_tt:0 "§YВизантинистские фашисты§! сформируют правительство!\n"
 byzantinist_civil_war_inevitable_tt:0 "§YВизантинисты§! вскоре вновь попытаются силой отстранить нас от власти...\n"
 bftb_greece.209.t:0 "Мы выполнили обещания, данные на Ираклионской конференции!"
 bftb_greece.209.desc:0 "Мы раздробили бывшее турецкое государство и разделили добычу между победителями. Обязательства перед союзниками и народом выполнены, а государство [ROOT.GetNameDef] как никогда за последние столетия близко к истинному величию."
 bftb_greece.209.a:0 "Это поистине наш самый славный момент."
 megali_idea_honoured_greece_tt:0 "Территории, обещанные союзникам на §YИраклионской конференции§!, уже переданы.\n"
 bftb_greece.210.t:0 "Государство [GRE.GetNameDefCap] выполняет гарантии Ираклионской конференции!"
 bftb_greece.210.desc:0 "Как и было обещано, гарантированные нам области вырезаны из останков побеждённой турецкой нации и переданы под наш контроль. Империализм — грязное дело, но никто не справляется с ним лучше нас."
 bftb_greece.210.a:0 "Выполнено как по часам."
 megali_idea_honoured_tt:0 "Территории, обещанные нам государством §Y[GRE.GetNameDef]§! на §YИраклионской конференции§!, уже переданы."
 bftb_greece.213.t:0 "[FROM.GetAdjective] сторона отказывается возвращать нам долги!"
 bftb_greece.213.desc:0 "Эти распутные [FROM.GetAdjective] воры решили сбежать с деньгами, которые были нам должны! Мы десятилетиями тщательно выращивали этот долг, а они ещё смеют называть его незаконным? Если они думают, что смогут безнаказанно нас обмануть, то глубоко ошибаются — последствия неизбежны! Хотя нельзя отрицать, что мы несколько переусердствовали, сначала позволяя государству [FROM.GetNameDef] накапливать долг, а затем наказывая за это."
 bftb_greece.213.a:0 "Паразиты-растратчики!"
 bftb_greece.213.b:0 "Мы слишком сильно на них давили, и вот последствия."
 bftb_greece.217.t:0 "Великая фашистская буле Галикарнаса"
 bftb_greece.217.desc:0 "Фашизм всегда был в государстве [ROOT.GetNameDef] сравнительно умеренным явлением, но под руководством [ROOT.GetLeader] он расцвёл настолько, что все великие фашистские умы страны могут собраться и обсудить её будущее. [ROOT.GetLeader] предлагает направить свой явно авторитарный стиль правления прямо в фашистское русло, чтобы свести нестабильность к минимуму. Георгиос Меркурис, главный национал-социалист страны, считает, что государству [ROOT.GetNameDef] следует избавиться от непопулярного короля и вывести нацию в действительно радикальную политическую сферу.\n\n[ROOT.GetLeader] долго говорил о Великой Греции от Албании до Кипра, но Меркурис, не желая уступать, заявил, что [ROOT.GetAdjective] народу следует искать ключ к величию ещё дальше в прошлом. Метаксас видит впереди Третью эллинскую цивилизацию как новую великую эллинскую державу, а Меркурис считает, что вдохновение для неё должно исходить от самой Первой эллинской цивилизации. Две влиятельные фигуры, два совершенно разных взгляда — здесь, на Самосе, решается фашистское будущее государства [ROOT.GetNameDef]."
 bftb_greece.217.a:0 "Метаксас должен возглавить наше фашистское королевство!"
 GRE_metaxist_monarchist_fascism_tt:1 "§YГеорг II§! останется королём, а §YВеликая Греция§! станет доступна как формируемая страна. \n£faction_gre_monarchist §YМонархисты§! станут лояльными."
 bftb_greece.217.b:0 "Меркурис подарит нам империю!"
 GRE_republican_national_socialism_tt:1 "§YГеорг II§! будет свергнут, и мы сможем исполнить §YНаследие Аргеадов§!. \n£faction_gre_monarchist §YМонархисты§! утратят значение."
 bftb_greece.218.t:0 "Анатолийские фашисты восстают!"
 bftb_greece.218.desc:0 "Час настал: в самый тёмный момент презренный Георгиос Космидис призвал к оружию и потребовал, чтобы верные EEE и государству [ROOT.GetNameDef] уничтожили нас и оккупантов по ту сторону Эгейского моря. Единственное, что известно наверняка: будущее государства [ROOT.GetNameDef] крайне неопределённо."
 bftb_greece.218.a:0 "Фашисты не должны решать судьбу государства [ROOT.GetNameDef]!"
 bftb_greece.218.b:0 "Возможно, мы ошибались; возможно, EEE всё-таки способна спасти государство [ROOT.GetNameDef]."
 bftb_greece.220.t:0 "Государство [FROM.GetNameDefCap] соглашается содействовать энозису!"
 bftb_greece.220.desc:0 "После заявления [ROOT.GetLeader] о том, что многолетняя [ROOT.GetAdjective] мечта об энозисе с Кипром наконец станет реальностью благодаря нашим [FROM.GetAdjective] друзьям, настроение в столице можно описать лишь как ликование. Администраторы уже отправились на Кипр, чтобы обеспечить максимально плавную передачу власти. \n\nЭто поистине великий и исторический день для государства [ROOT.GetNameDef]. Кипр давно является частью [ROOT.GetAdjective] коллективного сознания, и теперь он наконец вернулся в лоно породившей его цивилизации."
 bftb_greece.220.a:0 "Наконец-то вместе!"
 bftb_greece.221.t:0 "Ираклионская конференция — [FRA.GetAdjective] сторона получает мандат!"
 bftb_greece.221.desc:0 "Большинство делегатов проголосовало за предоставление государству [FRA.GetNameDef] мандата в Курдистане после успешного свержения [TUR.GetAdjective] государства. [FRA.GetAdjective] чиновники похвалили делегатов за мудрую государственную позицию и уже направили центральному [FRA.GetAdjective] правительству указания начать подготовку администрации региона."
 bftb_greece.221.a:0 "Предложение принято!"
 bftb_greece.222.t:0 "Ираклионская конференция — [FRA.GetAdjective] стороне отказано в мандате!"
 bftb_greece.222.desc:0 "Большинство делегатов проголосовало против передачи государству [FRA.GetNameDef] каких-либо территорий в Курдистане после победы над [TUR.GetAdjective] государством. [FRA.GetAdjective] чиновники едва не покинули конференцию, назвав её фарсом, но решили остаться, чтобы влиять на дальнейшие заседания, даже не получив обещанных уступок."
 bftb_greece.222.a:0 "Предложение отклонено!"
 bftb_greece.223.t:0 "Ираклионская конференция — [ENG.GetAdjective] сторона получает протекторат!"
 bftb_greece.223.desc:0 "Большинство делегатов проголосовало за предоставление государству [ENG.GetNameDef] армянского протектората, созданного на обломках побеждённого государства [TUR.GetName]. [ENG.GetAdjective] чиновники похвалили делегатов за мудрую государственную позицию и уже направили центральному [ENG.GetAdjective] правительству указания начать подготовку администрации региона."
 bftb_greece.223.a:0 "Предложение принято!"
 bftb_greece.224.t:0 "Ираклионская конференция — [ENG.GetAdjective] стороне отказано в марионеточном государстве!"
 bftb_greece.224.desc:0 "Большинство делегатов проголосовало против права государства [ENG.GetNameDef] создать армянское марионеточное государство в северной Анатолии. [ENG.GetAdjective] чиновники осудили решение и назвали конференцию хаотичной, но предпочли остаться, чтобы влиять на дальнейшие заседания, даже не получив никаких гарантий."
 bftb_greece.224.a:0 "Предложение отклонено!"
 bftb_greece.225.t:0 "Ираклионская конференция — [ITA.GetAdjective] сторона получает территории!"
 bftb_greece.225.desc:0 "Большинство делегатов проголосовало за предоставление государству [ITA.GetNameDef] колоний, выделенных из останков побеждённого государства [TUR.GetName]. [ITA.GetAdjective] чиновники похвалили представителей за благоразумное решение, а многие члены [ITA.GetAdjective] делегации уже отправились домой, чтобы сообщить новость [ITA.GetLeader]."
 bftb_greece.225.a:0 "Предложение принято!"
 bftb_greece.226.t:0 "Ираклионская конференция — [ITA.GetAdjective] стороне отказано в территориях!"
 bftb_greece.226.desc:0 "Большинство присутствующих делегатов проголосовали за то, чтобы [ITA.GetNameDef] Следует лишить права создавать колонии в южной Анатолии и осудить само движение как более бессмысленное? [ITA.GetAdjective] разжигание войны.[ITA.GetAdjective] Чиновники раскритиковали это решение и использовали всю ситуацию, чтобы доказать, что [ITA.GetAdjective] Люди правы, когда верят в «витторию мутилата». Независимо от их личных взглядов на этот вопрос, [ITA.GetAdjective] Делегатам было приказано оставаться в рамках работы конвенции - без сомнения, с надеждой на то, что они все же смогут повлиять на вердикт по заключительному и наиболее важному пункту повестки дня."
 bftb_greece.226.a:0 "Предложение отклонено!"
 bftb_greece.227.t:0 "[GRE.GetAdjective] пограничные столкновения с государством [TUR.GetNameDef] усиливаются"
 bftb_greece.227.desc:0 "[GRE.GetAdjective] нападение на регион [341.GetName] ожидаемо провалилось, и обострение конфликта в Эгейском море даёт нам идеальную возможность вмешаться на стороне государства [GRE.GetNameDef]. Следует перебросить силы на Кавказ и разместить их у [TUR.GetAdjective] границы. Когда [GRE.GetAdjective] сторона подаст сигнал, мы возьмём [TUR.GetAdjective] войска в клещи и превратим столкновение в законную войну."
 bftb_greece.227.a:0 "Мы будем готовы."
 bftb_greece.228.t:0 "[SOV.GetAdjective] сторона терпит поражение"
 bftb_greece.228.desc:0 "В столицу пришли великие новости: непобедимые армии государства [SOV.GetNameDef] не смогли прорвать [TUR.GetAdjective] линии. Они не помогут нам во вторжении, отменили все планы и наступления и предоставили [TUR.GetAdjective] стороне полную свободу судить нас по своему усмотрению."
 bftb_greece.228.a:0 "Это не сулит ничего хорошего..."
 bftb_greece.229.t:0 "Государство [GRE.GetNameDefCap] призывает нас выполнить обещание"
 bftb_greece.229.desc:0 "Государство [GRE.GetNameDefCap] начало войну с государством [TUR.GetNameDef] и призвало нас оказать обещанную помощь. Предложенные приобретения значительны, а возможность потребовать больше всегда остаётся. Однако, возможно, мы уже не в состоянии выполнить обязательства — даже если это означает отказ от притязаний."
 bftb_greece.229.a:0 "К войне!"
 bftb_greece.229.b:0 "Ситуация изменилась."
 bftb_greece.230.t:0 "Государство [FROM.GetNameDefCap] выполняет обязательства"
 bftb_greece.230.desc:0 "Государство [FROM.GetNameDefCap], как и обещало, вступило в нашу войну против государства [TUR.GetNameDef]. Вместе мы сокрушим [TUR.GetAdjective] государство."
 bftb_greece.230.a:0 "Мы не можем проиграть!"
 bftb_greece.231.t:0 "Государство [FROM.GetNameDefCap] отказывается от обязательств!"
 bftb_greece.231.desc:0 "Государство [FROM.GetNameDefCap] нарушило обещание помочь нам и отказалось от притязаний на земли государства [TUR.GetNameDef]! Они предали нас и обесценили всю нашу борьбу. Остаётся надеяться, что мы сумеем победить без [FROM.GetAdjective] помощи."
 bftb_greece.231.a:0 "Трусы!"
 bftb_greece.232.t:1 "Появляется василевс..."
 bftb_greece.232.desc:1 "На нашу павшую духом нацию снизошло чудо: божественное вмешательство, посланное с Небес самим святым Юстинианом. На берегу Афона нашли человека в рваных одеждах, лежавшего без сознания. Верные хранители святого места спасли его от неминуемой смерти. Сначала власти, арестовавшие его, сочли его безумцем, утверждавшим, что пришёл пешком в государство [ROOT.GetNameDef] из государства [GER.GetNameDef]. Однако один из учёных EEE признал в нём давно потерянного потомка династии Палеологов. При рождении его назвали Адольфом, но в качестве тронного имени он выбрал Тиверия.\n\nДолгое время нас мучил вопрос, кто должен возглавить Византийское государство, и, похоже, сам Бог даровал решение. Византийский наследник не говорит по-гречески ни слова, но его можно научить! Воистину, государство [ROOT.GetNameDef] благословлено божественным провидением."
 bftb_greece.232.a:1 "Да здравствует василевс Тиверий IV!"
 bftb_greece.232.c:1 "Для правителей следует использовать греческие числа! Да здравствует Тиверий Δ΄!"
 bftb_greece.232.b:0 "Эм... погодите, а вдруг он просто безумец?"
 bftb_greece.233.t:0 "Иоаннис Метаксас скончался"
 bftb_greece.233.desc:0 "Премьер-министр и диктатор государства [ROOT.GetNameDef] скончался после продолжительной болезни. Он умер за границей, в изгнании из своей завоёванной страны. Хотя [ROOT.GetAdjective] народ не питал к нему особой любви, во время кризиса он стал символом национального единства и сопротивления. Эммануил Цудерос, объединяющая фигура и венизелист, занял пост премьер-министра государства [ROOT.GetNameDef]."
 bftb_greece.233.a:0 "Война продолжается."
 bftb_greece.234.t:0 "Великая идея одобрена"
 bftb_greece.234.desc:0 "С Ираклионской конференции пришла новость: участвующие державы одобрили [GRE.GetAdjective] предложение о «Великой идее». Это не только угрожает стабильности региона, но и создаёт серьёзный риск открытой войны между государствами [GRE.GetNameDef] и [TUR.GetNameDef] в недалёком будущем.\n\nНельзя исключать, что государство [GRE.GetNameDef] получит военную поддержку государств [FRA.GetNameDef] или [ENG.GetNameDef]. Учитывая наши нынешние обязательства перед государством [TUR.GetNameDef], мы можем оказаться по другую сторону войны с одной или даже обеими великими державами. Военное руководство призывает учесть это и пересмотреть приверженность защите государства [TUR.GetNameDef]."
 bftb_greece.234.a:0 "Туркам придётся выживать самостоятельно."
 bftb_greece.234.b:0 "Мы соблюдём гарантии любой ценой!"
 bftb_greece.235.t:0 "Государство [ROM.GetName] отзывает гарантию"
 bftb_greece.235.desc:0 "Ираклионская конференция глубоко встревожила наших [ROM.GetAdjective] гарантов. Не желая рисковать войной с великими европейскими державами, они решили отказаться от обещания оказать военную помощь в нашей защите."
 bftb_greece.235.a:0 "Трусы!"
 bftb_greece.236.t:0 "Государство [SOV.GetNameDefCap] отказывается помогать против государства [TUR.GetNameDef]"
 bftb_greece.236.desc:0 "Хотя государство [SOV.GetNameDef] несомненно заинтересовано в расширении влияния, оно решило не помогать нашим планам по воздействию на государство [TUR.GetNonIdeologyName], предпочтя сосредоточиться на других делах."
 bftb_greece.236.a:0 "Мы всё равно продолжим."
 bftb_greece.236.b:0 "Возможно, мы слишком поспешили."
 bftb_greece.237.t:0 "Государство [FROM.GetName] поддерживает амбиции против государства [TUR.GetNonIdeologyName]"
 bftb_greece.237.desc:0 "Дипломаты государства [FROM.GetNameDef] сообщили, что [FROM.GetLeader] поддерживает наши планы против государства [TUR.GetNameDef]. Военная разведка также докладывает, что они начали перебрасывать войска к [TUR.GetAdjective] границе."
 bftb_greece.237.a:0 "Отличные новости!"
 bftb_turkey.1.t:0 "Конвенция Монтрё"
 bftb_turkey.1.desc:1 "Президент [TUR.GetLeader] сообщил, что государство [TUR.GetNameDef] готовится ремилитаризовать Турецкие проливы. [TUR.GetAdjective] правительство желает, чтобы мы поддержали его притязания на территориальные воды и изменили Лозаннский договор, дав ему законное право сохранять эти притязания.\n\nПоддержка [TUR.GetAdjective] требований по проливам наверняка расположит их к нам и может открыть возможность для государства [TUR.GetNameDef] противостоять государству [ITA.GetNameDef] в Средиземном море. Однако вовлечение в кризис может поставить нас по разные стороны с государством [SOV.GetNameDef], что в худшем случае означает войну."
 bftb_turkey.1.a:0 "Мы поддержим турок в этом вопросе."
 bftb_turkey.1.b:0 "Государство [ENG.GetNameDefCap] не интересуют турецкие дела."
 TUR_britain_backs_turkey_tt:0 "\nМы поддержим §Y[TUR.GetNameDef]§!, поскольку оно должно иметь право регулировать проход через §YТурецкие проливы§!.\n\n§RЕсли война между государствами §Y[TUR.GetNameDef]§! и §Y[SOV.GetNameDef]§! станет вероятной, у нас будет возможность отозвать поддержку.§!"
 TUR_britain_unentangles_itself_tt:0 "\nМы оставим государство §Y[TUR.GetNameDef]§! на милость государства §Y[SOV.GetNameDef]§!. §YТурецкие проливы§!, вероятно, останутся открытыми для неограниченного морского движения со всего мира."
 bftb_turkey.2.t:0 "Государство [ENG.GetNameDefCap] оказывает поддержку"
 bftb_turkey.2.desc:0 "[ENG.GetLeader] Он опубликовал заявление, в котором разъясняется, что [ENG.GetNameDef] Мы намерены поддержать нас в нашей цели вернуть контроль над нашими проливами. Победить в поддержке [ENG.GetNameDef] Это большая победа для нас и многое делает для укрепления нашей легитимности во всем мире."
 bftb_turkey.2.a:0 "Теперь ждём ответа государства [SOV.GetNameDef]."
 bftb_turkey.3.t:0 "Государство [ENG.GetNameDefCap] отказывает нам в помощи!"
 bftb_turkey.3.desc:0 "[ENG.GetLeader] Написал длинное письмо [TUR.GetLeader]Объясняя это [ENG.GetNameDef] На данный момент мы не можем позволить себе запутаться во внешнем кризисе.[ENG.GetLeader] Он отметил отсутствие народной поддержки войны. [ENG.GetNameDef] и его скептицизм [TUR.GetAdjective] Готовность к войне с [SOV.GetNameDef] В качестве причин почему [ENG.GetNameDef] Не будет ввязываться.\n\n[ENG.GetNameDefCap] Мы признали наш контроль над турецкими проливами, но они не сделают больше этого."
 bftb_turkey.3.a:0 "Теперь ждём ответа государства [SOV.GetNameDef]."
 bftb_turkey.4.t:0 "[TUR.GetNameDef] Захватил контроль над Босфором!"
 bftb_turkey.4.desc:0 "[TUR.GetLeader] Он заявил, что турецкие проливы теперь будут находиться под полным контролем Турции. [TUR.GetNameDef]Таким образом, давая [TUR.GetAdjective] Правительство имеет возможность закрыть проливы по своему усмотрению! Это недопустимо: это означает, что [TUR.GetAdjective] Правительство решило, что они имеют право заманивать наши флоты в Черное море всякий раз, когда они сочтут это политически целесообразным."
 bftb_turkey.4.a:0 "Немедленно мобилизовать вооружённые силы!"
 bftb_turkey.4.b:0 "Этот фарсовый цирк мало нас волнует."
 TUR_soviets_oppose_turkey_tt:0 "\n§Y[TUR.GetAdjective]§! правительство либо предложит компромисс, либо ещё сильнее обострит ситуацию.\n\n§RЕсли вооружённый конфликт станет вероятным, у нас будет возможность снизить напряжённость.§!"
 TUR_soviets_allow_militarisation_tt:0 "§YТурецкие проливы§! будут ремилитаризованы, а государство §Y[TUR.GetNameDef]§! получит право регулировать весь проходящий через них морской трафик."
 bftb_turkey.5.t:0 "Государство [SOV.GetNameDefCap] выступает против ремилитаризации проливов!"
 bftb_turkey.5.desc:0 "Представители государства [SOV.GetNameDef] недвусмысленно заявили, что считают наш односторонний захват Турецких проливов незаконным и намерены принять крайние меры для отмены решения. Несмотря на давление дипломатов, [SOV.GetAdjective] чиновники отказались исключить военное вмешательство в государство [TUR.GetNameDef].\n\nСохранение нынешнего положения немыслимо, и даже государство [SOV.GetNameDef] должно это понимать. Если предложить компромисс со свободным доступом для всех стран Чёрного моря, у государства [SOV.GetNameDef] не останется выбора, кроме как принять его, если оно не хочет стать мировым изгоем."
 bftb_turkey.5.a:0 "Мы предложим компромисс."
 bftb_turkey.5.b:0 "Никаких уступок и компромиссов — доведём дело до конца!"
 TUR_strait_compromise_tt:0 "§Y[SOV.GetNameDefCap]§! и все прочие страны с побережьем в §YЧёрном море§! сохранят право свободного прохода через §YТурецкие проливы§!."
 TUR_remaining_defiant_tt:0 "\nМы продолжим требовать право регулировать весь морской трафик через §YТурецкие проливы§!.\n\n§RВозможно, это последний шанс снизить напряжённость: если государство [SOV.GetNameDef] продолжит давление, начнётся война!§!"
 bftb_turkey.6.t:0 "Государство [SOV.GetNameDefCap] соглашается с ремилитаризацией проливов!"
 bftb_turkey.6.desc:0 "[SOV.GetAdjective] правительство опубликовало краткое заявление с туманными намёками на последствия и наказание за нарушение мира. Однако наших чиновников заверили, что государство [SOV.GetNameDef] не предпримет ответных действий.\n\n[TUR.GetLeader] произнёс в Стамбуле страстную речь, переданную по радио всей стране, и объявил о великой победе государства [TUR.GetNameDef]. Правительство получило огромную поддержку, и по всей стране ожидаются празднования решительного успеха."
 bftb_turkey.6.a:0 "За мир в стране и мир во всём мире!"
 bftb_turkey.7.t:0 "Государство [TUR.GetNameDefCap] идёт на компромисс по ремилитаризации проливов"
 bftb_turkey.7.desc:0 "После долгих переговоров [TUR.GetAdjective] правительство решило контролировать проливы, сохранив свободный доступ всем государствам, граничащим с Чёрным морем. Железное предложение государства [TUR.GetNameDef] почти не оставляет оснований для протеста и уже поспешно одобрено государствами [BUL.GetNameDef] и [ROM.GetNameDef], что окончательно связывает нам руки."
 bftb_turkey.7.a:0 "Что ж, кризис можно считать завершённым."
 bftb_turkey.8.t:0 "В Чёрном море назревает конфликт"
 bftb_turkey.8.desc:0 "Государство [SOV.GetNameDefCap] оспорило план государства [TUR.GetNameDef] вернуть контроль над проливами, но государство [TUR.GetNameDef] не отступает перед [SOV.GetAdjective] угрозами. Ситуация грозит перерасти в вооружённый конфликт: государство [TUR.GetNameDef] пытается утвердить суверенитет, а государство [SOV.GetNameDef] стремится установить господство в регионе.\n\nБаланс сил зависит от нас: следует либо подтвердить поддержку государства [TUR.GetNameDef] гарантией независимости, чтобы сдержать государство [SOV.GetNameDef], либо умыть руки и надеяться, что обе страны сойдут с выбранного курса столкновения."
 bftb_turkey.8.a:0 "Мы должны поддержать государство [TUR.GetNameDef] против большевистской тирании."
 bftb_turkey.8.b:0 "Умиротворение [SOV.GetAdjective] ирредентизма — небольшая цена за мир!"
 TUR_britain_stands_up_for_turkey_tt:0 "\nМы поддержим §Y[TUR.GetNameDef]§!, даже если это приведёт к войне. §RГосударство [SOV.GetNameDefCap] получит последнюю возможность снизить напряжённость!§!"
 TUR_britain_abandons_turkey_tt:0 "\nПосле отзыва нашей поддержки государства §Y[TUR.GetNameDef]§! §Y[TUR.GetAdjective] правительство§! получит последнюю возможность снизить напряжённость."
 bftb_turkey.9.t:0 "[ENG.GetAdjective] сторона бросает нас"
 bftb_turkey.9.desc:0 "Премьер-министр [ENG.GetLeader] публично заявил, что из-за растущей напряжённости между нами и государством [SOV.GetNameDef] государство [ENG.GetNameDef] не может втягиваться в «региональный спор». Сославшись на британские потери в Великой войне, [ENG.GetLeader] поддержал политику умиротворения государства [SOV.GetNameDef].\n\nВ Анкаре это заявление встретили с тревогой, а [TUR.GetLeader] осудил трусость государства [ENG.GetNameDef]."
 bftb_turkey.9.a:0 "Всё потеряно; мы должны полностью подчиниться прихотям [SOV.GetAdjective] чиновников."
 bftb_turkey.9.b:0 "Ничего не изменилось; мы должны придерживаться выбранного курса."
 TUR_straits_remain_demilitarised_tt:0 "\nThe §YТурецкие проливы§! Мы останемся демилитаризованными, и у нас не будет контроля над морским движением, которое проходит через пролив. §YТурецкие проливы§! Пока мы не на войне.\n\n§RЭто наш последний шанс деэскалации: если [SOV.GetNameDef] Это еще больше подтолкнет дело, это приведет к войне!§!"
 TUR_we_remain_committed_tt:0 "\n§RГосударство [SOV.GetNameDefCap] получит последнюю возможность снизить напряжённость, но отказ приведёт к войне!§!"
 bftb_turkey.10.t:0 "[TUR.GetAdjective] сторона продолжает сопротивляться"
 bftb_turkey.10.desc:0 "Даже перед лицом непреодолимой силы [TUR.GetLeader] Отказывается сдвинуться на [TUR.GetAdjective] Права на Турецкие проливы. Напряженность резко обострилась, и войска были распределены вдоль [TUR.GetAdjective]-[SOV.GetAdjective] Граница.[TUR.GetLeader] Он назвал кризис «моментом судьбы». [TUR.GetNameDef]и пообещал, что [TUR.GetNameDef] Никогда не сдастся перед лицом [SOV.GetAdjective] тирания."
 bftb_turkey.10.a:0 "Турецкие проливы не стоят тотальной войны."
 bftb_turkey.10.b:0 "Государство [TUR.GetNameDefCap] сдастся нам на коленях!"
 bftb_turkey.11.t:0 "Государство [TUR.GetNameDefCap] принимает наши требования"
 bftb_turkey.11.desc:0 "[TUR.GetLeader] был тепло встречен в Москве, где под вооружённой охраной его заставили подписать новый договор, фактически лишавший [TUR.GetAdjective] сторону всех прав на милитаризацию и охрану Турецких проливов. [SOV.GetLeader] отправил [TUR.GetLeader] домой с одной из своих трубок в качестве сувенира от государства [SOV.GetNameDef].\n\nУспешная демонстрация силы в наших внутренних водах стала великой победой. Войскам на [TUR.GetAdjective] границе разрешено обязательное трёхдневное празднование, настолько шумное, насколько возможно."
 bftb_turkey.11.a:0 "Мир должен бояться мощи государства [SOV.GetNameDef]."
 bftb_turkey.12.t:0 "Государство [SOV.GetNameDefCap] отступает"
 bftb_turkey.12.desc:0 "[SOV.GetLeader] лично по телефону [TUR.GetLeader]где он хладнокровно призывал к ослаблению напряженности и хвалил [TUR.GetAdjective] Президент за вклад в борьбу с империализмом.[SOV.GetAdjective] Солдатам было приказано деэскалировать свои действия на [TUR.GetAdjective] границы и [SOV.GetNameDef] Отозвал свои жалобы на [TUR.GetNameDef]Захват турецких проливов.\n\nБудучи совершенно невосприимчивым к идее большой войны после жестокой Войны за Независимость. [TUR.GetAdjective] Люди вздыхают, когда [TUR.GetLeader] Он заявил народу, что мир в конечном итоге победил и что [TUR.GetAdjective] Мужество народа обеспечило его суверенитет навечно."
 bftb_turkey.12.a:0 "Мы победили!"
 bftb_turkey.13.t:0 "Начинается [TUR.GetAdjective]-[SOV.GetAdjective] война"
 bftb_turkey.13.desc:0 "Шесть часов назад, [SOV.GetAdjective] Силы начали обстреливать [TUR.GetAdjective] стратегические базы в Трабзоне и заявили, что они вступают в [TUR.GetNameDef] Чтобы освободить [TUR.GetAdjective] Рабочие как часть марксистского крестового похода. Предатель Шефик Хюсну уже объявил о создании в изгнании Турецкой народной республики, которая, несомненно, останется под контролем Турции. [SOV.GetNameDef]Большой палец в обозримом будущем.\n\n[TUR.GetLeader] Он вышел на сцену в Стамбуле, где мрачно объявил о начале войны. [TUR.GetNameDef]. Однако печальные тона не продержались задолго до того, как [TUR.GetAdjective] Президент изменил свою риторику: он начал с огненной болтовни о том, как [TUR.GetAdjective] Судьба вновь призвала людей бороться за свои свободы и независимость. Даже несмотря на то, что шрамы войны за независимость остаются свежими. [TUR.GetAdjective] Людей вздымают в пылу и спешат вступить в Вооруженные Силы.\n\nНо как долго может длиться этот энтузиазм?"
 bftb_turkey.13.a:0 "И как долго продержимся мы?"
 bftb_turkey.14.t:0 "Начинает формироваться оппозиционное движение"
 bftb_turkey.14.desc:0 "[TUR.GetAdjective] политологи полагали, что после отмены запрета на партии потребуется несколько недель для появления настоящей оппозиции, но ошиблись. Аднан Мендерес быстро собрал группу единомышленников-традиционалистов, недовольных положением религии в государстве [TUR.GetNameDef] при кемалистах. Ранее, когда религиозные фундаменталисты захватывали [TUR.GetAdjective] политическое движение, переход к демократии прекращался, но не в этот раз: [TUR.GetLeader] намерен победить фанатиков на выборах.\n\nМендерес и его сторонники объединились в «Традиционную группу». CHP считает её предшественницей популистского исламистского движения, строящего кампанию на консерватизме и традиционализме. В ближайшие недели группа будет агитировать в турецкой глубинке, создавая базу поддержки, а затем несомненно представит свою оппозиционную партию."
 bftb_turkey.14.a:0 "На предстоящих выборах решится душа государства [TUR.GetNameDef]."
 bftb_turkey.16.t:0 "Традиционная группа мобилизует сельских жителей для повышения явки"
 bftb_turkey.16.desc:0 "Традиционалисты Аднана Мендереса массово ездят по стране, призывая религиозных граждан, считающих себя угнетёнными светским правительством, голосовать за их партию. Хотя многие сомневаются в шансах победить кемалистов и цинично относятся к демократии, большинство встреченных людей проявило энтузиазм к Мендересу и его движению."
 bftb_turkey.16.a:0 "Это неконституционно! Прекратить!"
 bftb_turkey.16.b:0 "Мы признаем демократическую волю народа."
 bftb_turkey.17.t:0 "Традиционная группа Мендереса ищет союз с курдскими организациями"
 bftb_turkey.17.desc:0 "Традиционалисты Аднана Мендереса предприняли широко разрекламированную поездку [TUR.GetAdjective] Курдистан, где они проповедовали примирение и взаимные интересы в отношении состояния веры [TUR.GetNameDef] Сегодня. Ссылаясь на религиозные писания, курдские племенные лидеры вышли на сцену с официальными лицами из традиционного оппозиционного движения и призвали курдов голосовать за Мендереса и его сторонников в день выборов. [TUR.GetNameDef] Вернемся в объятия Всемогущего."
 bftb_turkey.17.a:0 "Это граничит с изменой!"
 bftb_turkey.17.b:0 "Такое сотрудничество может принести плоды в будущем!"
 bftb_turkey.18.t:0 "Раскрыт заговор с целью фальсификации выборов в сельских регионах"
 bftb_turkey.18.desc:0 "Это печальный день для [TUR.GetNameDef]зарождающаяся демократия, как заговор с целью подтасовать будущие результаты выборов так, чтобы они благоприятствовали оппозиционному движению Аднана Мендереса, была раскрыта в некоторых [TUR.GetNameDef]Самые агрестичные провинции. Сюжет с участием религиозных лидеров, местных администраторов и даже государственных служащих был сорван, а заговорщики арестованы. Никаких доказательств, связывающих Мендереса или его оппозиционное движение с заговором, в наших расследованиях не найдено, но наша реакция, несомненно, повлияет на их избирательную кампанию."
 bftb_turkey.18.a:0 "Публично судить всех и назначить самое суровое наказание!"
 bftb_turkey.18.b:0 "Тихо предложим амнистию и будем надеяться, что об этом забудут."
 bftb_turkey.19.t:0 "Проведён гигантский митинг в поддержку движения Мендереса"
 bftb_turkey.19.desc:0 "Митинг Аднана Мендереса в глубинке собрал толпы, сравнимые с выступлениями Мустафы Кемаля Ататюрка в центре Стамбула. [TUR.GetLeader] был потрясён сообщениями о безупречно проведённом мероприятии, где Мендерес заявил, что скоро представит официальную оппозиционную партию. Один за другим ораторы говорили о важности религии в повседневной жизни и политике, проповедуя традиционалистский консерватизм; некоторые даже с теплотой отзывались о давно свергнутых османском султанате и халифате. Мендерес выступил последним и говорил гораздо умереннее. Он восхвалял либерализм невмешательства, похвалил кемалистов за заслуги перед нацией, а затем подверг их резкой критике. Участники ушли в восторге и уверенности в победе.\n\nПреданное кемализму офицерство недвусмысленно потребовало от CHP активнее сдерживать влияние Мендереса. Представитель офицеров заявил, что армия никогда не станет служить его правительству, и намекнул на крайние меры, если мы не остановим эту угрозу кемалистской системе."
 bftb_turkey.19.a:0 "Мрачный день для Республики."
 bftb_turkey.20.t:0 "Демократическая партия"
 bftb_turkey.20.desc:0 "Восемь часов назад Аднан Мендерес торжественно объявил о создании новейшей и самой опасной оппозиционной партии государства [TUR.GetNameDef] — Demokrat Parti. Он заявил, что партия намерена положить конец монополии CHP на власть и повести страну новым курсом. Перед ликующей толпой были объявлены три столпа партии: Вера, Отечество и Свобода — именно в таком порядке. Ещё удивительнее было заявление, что государство [TUR.GetName] под руководством DP станет гораздо более интервенционистским, чем любое другое [TUR.GetAdjective] правительство со времени основания страны.\n\nВ кемалистских кругах заявление вызвало ярость. Сегодня в Стамбуле [TUR.GetLeader] пообещал сторонникам, что даже если выборы окажутся тяжелее ожидаемого, CHP всё равно останется правящей силой."
 bftb_turkey.20.a:0 "Пусть победит лучшая партия!"
 bftb_turkey.21.t:0 "День выборов"
 bftb_turkey.21.desc:0 "Долгожданный день выборов наконец наступил. Мужчины и женщины по всей стране, невзирая на плохую погоду и болезни, отправились на участки и заполнили бюллетени за предпочитаемые партии. Никто не ожидал столь огромной явки, особенно после быстрого перехода к демократии. Кампания была грязной, но любой сторонник демократии гордился бы тем, как много [TUR.GetAdjective] граждан пришло на первые свободные выборы государства [TUR.GetNameDef].\n\nБорьба была напряжённой, и подсчёт голосов занял много времени. Победителями первых выборов государства [TUR.GetNameDef] стали..."
 bftb_turkey.21.a:0 "...республиканцы!"
 bftb_turkey.21.b:0 "...Демократическая партия!"
 TUR_republican_victory_tt:0 "£faction_tur_kemalist §YCHP§! получит §Yдемократический§! мандат на управление страной."
 TUR_conservative_victory_tt:0 "£faction_tur_traditionalist §YDP§! получит §Yдемократический§! мандат на управление страной."
 bftb_turkey.22.t:0 "[TUR.GetAdjective] гражданская война"
 bftb_turkey.22.desc:0 "После победы Demokrat Parti конфликт внутри государства [TUR.GetNameDef] был почти неизбежен. Напряжённость между правительством и вооружёнными силами росла каждый день после выборов и теперь достигла предела. Офицеры уже захватили богатейшие западные регионы и, судя по всему, пользуются их поддержкой.\n\nНа востоке курдские ополчения начали готовиться к вооружённой борьбе за независимость. Мы были глупцами, полагая, что союз с курдами продлится долго, но ещё глупее они, если думают, что мы не уничтожим их жалкие попытки вырвать государство из нашей суверенной земли.\n\nБорьба за душу государства [TUR.GetNameDef] началась, и мы не можем проиграть."
 bftb_turkey.22.a:0 "Фи сабилиллях, в бой!"
 bftb_turkey.23.t:0 "Саадабадский пакт"
 bftb_turkey.23.a:0 "Разумеется, мы подпишем этот пакт дружбы!"
 bftb_turkey.23.b:0 "Мы не родственники, [FROM.GetLeader], и не знаем вас."
 bftb_turkey.24.t:0 "Выбор преемника Ататюрка"
 bftb_turkey.24.desc:0 "Ни один мужчина или женщина не сможет достичь мифической высоты лидерства Мустафы Кемаля Ататюрка, но Отец турок остаётся смертным. Мы не ищем замену нашему Гази — никто не сможет сравниться с мессианским основателем нации, — однако должны выбрать лидера, которому можно доверить продолжение его пути. Он обязан воплощать кемалистские ценности и следовать примеру Ататюрка во главе государства [TUR.GetNameDef]."
 bftb_turkey.24.a:0 "Джеляль Баяр — очевидный кандидат."
 bftb_turkey.24.b:0 "Джеляль Баяр — очевидный кандидат."
 bftb_turkey.24.c:0 "Исмет Инёню — достойный преемник Ататюрка."
 bftb_turkey.24.d:0 "Февзи Чакмак — лидер, необходимый государству [TUR.GetNameDef]."
 bftb_turkey.24.e:0 "Февзи Чакмак станет нашим собственным Франсиско Франко."
 bftb_turkey.24.f:0 "Реджеп Пекер способен объединить фашизм и кемализм."
 bftb_turkey.24.g:0 "Гений Шевкета Сюрейи Айдемира проведёт нас через испытания."
 bftb_turkey.24.h:0 "Только Исмет Инёню сможет создать уникальный [TUR.GetAdjective] социализм."
 bftb_turkey.24.i:1 "Кязым Орбай возглавит военную хунту, пока мы не найдём свой путь."
 bftb_turkey.24.j:0 "Эм... ну... этот... бывший халиф?"
 bftb_turkey.25.t:0 "Государство [TUR.GetNameDefCap] поднимает вопрос Хатая"
 bftb_turkey.25.desc:0 "[TUR.GetLeader] В письме содержится требование, чтобы турецкое население сирийского государства Хатай получило демократическое право на референдум, чтобы народ Хатая мог решить, хочет ли он присоединиться к организации. [TUR.GetNameDef] Или остаться в Сирии на неопределенный срок. Наша колониальная полиция обнаружила незаконную деятельность на территории страны. [TUR.GetAdjective] границы, с [TUR.GetAdjective] Граждане пересекают границу и вызывают шум в провинции Хатай. Ясно, что [TUR.GetNameDef] Планирует перекосить результаты референдума, чтобы обеспечить [TUR.GetAdjective] Победа, но имея [TUR.GetNameDef] И, конечно же, для нас предпочтительнее альтернатива. Кто может сказать, как далеко [TUR.GetLeader] Мы собираемся интегрировать Hatay в [TUR.GetNameDef]?"
 bftb_turkey.25.a:0 "Мы позволим Хатаю перейти в руки государства [TUR.GetNameDef]."
 bftb_turkey.25.b:0 "Хатай останется частью Сирии, чего бы ни желала [TUR.GetAdjective] сторона."
 bftb_turkey.26.t:0 "Государство [FROM.GetNameDefCap] передаёт нам суверенитет над Хатаем"
 bftb_turkey.26.desc:0 "[TUR.GetLeader] выступил с короткой речью в Антакье, приветствуя жителей Хатай [TUR.GetNameDef] И благодарных ему людей, [FROM.GetLeader] из [FROM.GetNameDef] за уважение демократической воли народа Хатай. Несмотря на то, что этот шаг был встречен возмущением со стороны сирийских чиновников, общее настроение Хатая и Хатая было поднято. [TUR.GetNameDef] В целом, это было одно из многих удовольствий. [TUR.GetAdjective] Люди совершали поездки из своих домов в Хатай, чтобы освятить [TUR.GetNameDef]Новая провинция с торжествами и обменом подарками."
 bftb_turkey.26.a:0 "Добро пожаловать домой, братья и сёстры."
 bftb_turkey.27.t:0 "Государство [FROM.GetName] сохраняет твёрдый контроль над Хатаем"
 bftb_turkey.27.desc:0 "[TUR.GetLeader] возглавил пламенный митинг в Газиантепе, осуждая угнетение турок за рубежом государством [FROM.GetNameDef]. [TUR.GetAdjective] народ охвачен возмущением, и сейчас между угнетателями Хатая и народом государства [FROM.GetNameDef] почти не осталось добрых чувств. Пока Хатай вне нашей досягаемости, но мы никогда не забудем это чудовищное предательство."
 bftb_turkey.27.a:0 "Так или иначе, Хатай будет освобождён и вернётся туда, где ему место."
 bftb_turkey.29.t:0 "Бывшие отказники по убеждениям добровольно идут на службу"
 bftb_turkey.29.desc:0 "Похоже, решение поставить Отечество превыше всего принесло значительный результат! В вооружённые силы со всей страны хлынул поток добровольцев, почти перегрузив высшее командование. Этот эффект привёл к вступлению людей различных религиозных и языковых групп; на оперативном уровне нагрузка едва посильна.\n\nК счастью, мы отчасти были готовы, и интеграция бывших уклонистов прошла почти беспрепятственно. Советники считают, что приток добровольцев продолжится ещё долго!"
 bftb_turkey.29.a:0 "Отрадно видеть столько храбрых мужчин и женщин, вставших на защиту страны."
 bftb_turkey.30.t:0 "Компенсация за острова Оники"
 bftb_turkey.30.desc:0 "Острова Оники лежат в наших территориальных водах и когда-то считались неотъемлемой частью империи. Додеканес, как предпочитают называть их [ENG.GetAdjective] и [GRE.GetAdjective] стороны, вновь станет нашим, если [ITA.GetAdjective] сторона передаст его законным владельцам.\n\nПравительственные чиновники подготовили перечень того, что можно предложить [ITA.GetAdjective] стороне в обмен на острова, поскольку она наверняка потребует компенсацию — если вообще согласится уступить."
 bftb_turkey.30.a:0 "Мы предложим им права на наш хром."
 bftb_turkey.30.b:0 "Мы предложим промышленную компенсацию."
 bftb_turkey.30.c:0 "Предложения дружбы должно быть достаточно."
 bftb_turkey.31.t:0 "Государство [FROM.GetNameDefCap] предлагает нам исключительные права на ресурсы региона [342.GetName]"
 bftb_turkey.31.desc:0 "[FROM.GetAdjective] правительство обратилось к нам с неожиданным предложением. Оно желает предоставить нам сто процентов добычи природных руд и металлов в регионе [342.GetName] в обмен на Додеканес.\n\nОбычно наше правительство предпочитает приобретать земли, а не отдавать их, но государство [TUR.GetNameDef] предлагает собственный источник ресурсов, которые могут оказаться жизненно важными для крупномасштабной войны. Следует также учесть, что после начала настоящей войны доступ к этим ресурсам может исчезнуть. Решение принять [FROM.GetAdjective] предложение остаётся за нами."
 bftb_turkey.31.a:0 "Мы принимаем права на ваши ресурсы в обмен на Додеканес."
 bftb_turkey.31.b:0 "Мы не отдадим ни пяди земли! Ни сейчас, ни когда-либо!"
 bftb_turkey.32.t:0 "Государство [FROM.GetNameDefCap] предлагает промышленную помощь в обмен на Додеканес"
 bftb_turkey.32.desc:0 "The [FROM.GetAdjective] Правительство обратилось к нам с интригующим предложением. The [FROM.GetAdjective] Мы выпустили портфель, в котором излагается историческое и стратегическое значение Додеканеса для нашей страны. [FROM.GetNameDef] Мы составили список объектов недвижимости и производственных мощностей, которые они хотели бы продать нам в обмен на острова.\n\nНаше правительство обычно предпочитает приобретать землю, а не сдавать ее, но мы не можем отрицать, что дополнительная промышленность могла бы значительно помочь стране. [ROOT.GetAdjective] Военная машина. В конечном счете, мы должны решить, является ли дополнительный импульс для нашей промышленности более ценным для нашей страны, чем острова Додеканес."
 bftb_turkey.32.a:0 "Подписать договор; они могут получить острова, если готовы за них заплатить."
 bftb_turkey.32.b:0 "Мы не отдадим ни пяди земли! Ни сейчас, ни когда-либо!"
 bftb_turkey.33.t:0 "Государство [FROM.GetNameDefCap] просит передать Додеканес"
 bftb_turkey.33.desc:0 "[FROM.GetAdjective] правительство направило нам исчерпывающее письмо за подписью [FROM.GetLeader], подчёркивающее важность связи между нашими странами и естественную симпатию [FROM.GetAdjective] народа к нашей стране. Если отбросить громкие слова, [FROM.GetAdjective] сторона предложила подписать «Пакт силы» — сравнительно бессодержательное соглашение, но с одним условием. К письму дружбы приложено досье с инструкциями по мирной передаче власти от наших региональных губернаторов [FROM.GetAdjective] чиновникам, ожидающим возможности принять управление Додеканесом.\n\nОбычно наше правительство предпочитает приобретать земли, а не отдавать их. Однако [FROM.GetAdjective] сторона могла бы стать полезным союзником в конфликте, ограниченном Средиземноморьем. Преимущественно греческое население Додеканеса выразило недовольство возможным присоединением островов к государству [FROM.GetNameDef] как части [FROM.GetAdjective] нации. Впрочем, почти так же они отреагировали, когда после Великой войны мы отняли их родину у останков Османской империи."
 bftb_turkey.33.a:0 "Лучше бы это в будущем привело к военному союзу..."
 bftb_turkey.33.b:0 "Нас не пугают обвинения в лицемерии; острова останутся нашими!"
 bftb_turkey.34.t:0 "Государство [FROM.GetNameDefCap] принимает наше предложение!"
 bftb_turkey.34.desc:0 "[FROM.GetAdjective] власти вернули нам острова Оники в обмен на исключительные права на ресурсы региона [342.GetName]. Хотя чиновники в частном порядке выражали недовольство столь откровенным проявлением добровольного колониализма в регионе [342.GetName], эти сомнения были заглушены всеобщим восторгом от присоединения новейшей провинции государства [TUR.GetNameDef].\n\n[TUR.GetLeader] лично посетил Родос и заверил долго угнетавшихся жителей, что [TUR.GetAdjective] правительство выслушает и решит все их проблемы, одновременно вводя на островах новую учебную программу, подчёркивающую их исторические и этнические связи с государством [TUR.GetNameDef]."
 bftb_turkey.34.a:0 "Великая победа!"
 bftb_turkey.35.t:0 "Государство [FROM.GetNameDefCap] принимает наше предложение!"
 bftb_turkey.35.desc:0 "[FROM.GetAdjective] власти вернули нам острова Оники в обмен на плоды части нашей развивающейся промышленности. Хотя чиновники в частном порядке выражали недовольство необходимостью платить сталью и трудом за то, что столетиями принадлежало нам, эти сомнения были заглушены всеобщим восторгом от присоединения новейшей провинции государства [TUR.GetNameDef].\n\n[TUR.GetLeader] лично посетил Родос и заверил долго угнетавшихся жителей, что [TUR.GetAdjective] правительство выслушает и решит все их проблемы, одновременно вводя на островах новую учебную программу, подчёркивающую их исторические и этнические связи с государством [TUR.GetNameDef]."
 bftb_turkey.35.a:0 "Великая победа!"
 TUR_three_factories_sacrificed:0 "Удалено три §Yфабрики§!."
 bftb_turkey.36.t:0 "Государство [FROM.GetNameDefCap] принимает наше предложение!"
 bftb_turkey.36.desc:0 "К удивлению многих [TUR.GetAdjective] Официальные лица, Острова Оники были возвращены нам [FROM.GetAdjective] власти в обмен на взаимное подписание договора, который в конечном итоге вынуждает ни одну из сторон не выполнять какие-либо бессмысленные обязательства, содержащиеся в нем.[TUR.GetLeader] совершил государственный визит с целью подписания так называемого Пакта о власти [FROM.GetLeader]. Оба лидера взяли на себя взаимное обязательство по дальнейшему развитию отношений между двумя морскими соседями в свете этого исторического обмена землями. Волнение на протяжении всего [TUR.GetNameDef] Это заразно, и было много торжеств по поводу аннексии. [TUR.GetNameDef]Новейшая провинция.\n\n[TUR.GetLeader] Нанес личный визит на Родос, где заверил долгое время угнетенных граждан, что все их проблемы будут услышаны и о них позаботятся. [TUR.GetAdjective] Правительство, даже в качестве новой учебной программы, сенсационной исторических и этнических корней островов. [TUR.GetNameDef] Началась реализация по всей островной цепи.\n\nThe [GRE.GetAdjective] Правительство осудило беспрепятственный обмен территориями и призвало другие великие державы осудить то, что они называют несправедливым и незаконным нарушением суверенитета государства. [GRE.GetAdjective] Жители островов Оники. Международное сообщество широко хранило молчание по поводу территориального обмена, вероятно, из-за страха отчуждения. [TUR.GetAdjective] правительство."
 bftb_turkey.36.a:0 "Лучше и быть не могло."
 bftb_turkey.37.t:0 "Государство [FROM.GetNameDefCap] отклоняет наше предложение!"
 bftb_turkey.37.desc:0 "The [FROM.GetAdjective] Правительство заявило, что, несмотря на усилия [TUR.GetAdjective] Агитаторы и реваншисты, Додеканесские острова навсегда останутся неотъемлемой территорией государства. [FROM.GetAdjective] штат. В своей речи, [FROM.GetLeader] упомянутый [TUR.GetLeader] По имени, высмеивая это, [TUR.GetLeader] может широко применяться в [TUR.GetNameDef]в [FROM.GetNameDef]Его высмеивали как некомпетентного лидера. [FROM.GetAdjective] граждан.[FROM.GetLeader] продолжал звонить [TUR.GetNameDef] Несостоявшееся государство и подробно описало, как само существование нашей нации было непростительным оскорблением для народа. [FROM.GetAdjective] правительство. В своей длинной речи, [FROM.GetLeader] Ссылаясь на невыполненные обещания Севрского договора не менее тридцати семи раз.\n\n[TUR.GetLeader] описанный [FROM.GetAdjective] Позиция «неудачная», но есть надежда, что в дальнейшем будет возможность для дальнейшего дипломатического диалога."
 bftb_turkey.37.a:0 "Что ж, могло пройти лучше."
 bftb_turkey.38.t:0 "Государство [FROM.GetNameDefCap] предлагает совместную добычу ресурсов на Кавказе"
 bftb_turkey.38.desc:0 "The [FROM.GetAdjective] Правительство признало, что отправило геодезистов и разведчиков в Грузию для оценки добычи руды, и обратилось к нам с портфелем, который предлагает способ, которым обе наши страны могут лучше воспользоваться совместными усилиями по добыче полезных ископаемых. Возможно, это беспрецедентное явление для государственного деятеля — признаться в шпионаже, а затем попытаться превратить это признание в план по укреплению более тесных отношений между нашими двумя народами, но это затруднительное положение, в котором мы сейчас находимся. Никто не может отрицать, что [FROM.GetAdjective] Правительство готово пойти на риск.\n\nThe [FROM.GetAdjective] портфолио является всеобъемлющим; тот [FROM.GetAdjective] Они выставляют и извлекают найденные рудные вены и обеспечивают нас большей частью улова при перемещении части находок в другие места. [354.GetName] для их использования. Мы, скорее всего, не узнаем, что [FROM.GetAdjective] Мы уже много лет об этом знаем, но мы можем использовать наши планы по улучшению процессов добычи в Грузии для снижения урожайности и без необходимости. [FROM.GetAdjective] Помощь. Решение о том, работать в одиночку или принять предложение о помощи от [FROM.GetAdjective] Правительство падает на нас."
 bftb_turkey.38.a:0 "Будем работать вместе ради общей выгоды."
 bftb_turkey.38.b:0 "Они глупцы, если думали, что мы примем их вмешательство в наши границы."
 bftb_turkey.39.t:0 "Государство [FROM.GetNameDefCap] принимает наше предложение"
 bftb_turkey.39.desc:0 "[TUR.GetAdjective] чиновники поздравляют себя с великолепной работой. [FROM.GetAdjective] правительство только что сообщило, что желает осуществить совместную добычу металлов в Грузии согласно сложному плану, который мы представили.\n\nГосударственные механизмы уже запущены. По мере добычи руды в Грузии [SOV.GetAdjective] сторона сможет немедленно готовить её к перевозке в регион [354.GetName], где мы переработаем её для собственных нужд."
 bftb_turkey.39.a:0 "Дипломатический триумф!"
 bftb_turkey.40.t:0 "Государство [FROM.GetNameDefCap] отклоняет наше предложение!"
 bftb_turkey.40.desc:0 "Сообщается, что [FROM.GetAdjective] чиновники с недоверием отреагировали на предложение добывать руду в Грузии с разрешения [FROM.GetAdjective] правительства. Нашу просьбу высмеяли, а ещё оскорбительнее то, что [FROM.GetAdjective] сторона использует некоторые планы из нашего портфеля, чтобы самостоятельно добывать найденные нами руды."
 bftb_turkey.40.a:0 "Ублюдки!"
 bftb_turkey.41.t:0 "Государство [FROM.GetNameDefCap] приглашает нас во фракцию [FROM.GetFactionName]"
 bftb_turkey.41.desc:0 "Президент [FROM.GetNameDef], [FROM.GetLeader]Он выступил с инициативой официального реформирования Балканского пакта в более обширный и всеобъемлющий стратегический альянс под названием Балканская Антанта. Все члены Балканского пакта, включая нас самих, приглашены присоединиться к нему. [FROM.GetFactionName]И это включает нас.\n\nЧиновники из [FROM.GetNameDef] Мы гарантируем, что отношения между народами в [FROM.GetFactionName] Мы будем выходить далеко за рамки чисто военных вопросов и уже выпустили резюме планов по совместному развитию наших денежных систем, наших оборонительных стратегий и многого другого."
 bftb_turkey.41.a:0 "Объединившись, мы сможем защитить Балканы."
 bftb_turkey.41.b:0 "Эта инициатива — безрассудная иллюзия, порождённая [FROM.GetAdjective] шовинизмом."
 bftb_turkey.42.t:0 "Государство [FROM.GetNameDefCap] вступает во фракцию [ROOT.GetFactionName]!"
 bftb_turkey.42.desc:0 "[FROM.GetLeader] объявил, что государство [FROM.GetNameDef] решило ратифицировать соглашение и вступить во фракцию [ROOT.GetFactionName]. В честь связывания судеб наших стран перед неизбежным конфликтом были устроены пышные торжества и два последовательных государственных праздника."
 bftb_turkey.42.a:0 "Вместе мы спасём Балканы."
 bftb_turkey.43.t:0 "Государство [FROM.GetNameDefCap] отклоняет призыв вступить во фракцию [ROOT.GetFactionName]!"
 bftb_turkey.43.desc:0 "[FROM.GetLeader] сообщил, что государство [FROM.GetNameDef] не вступит во фракцию [ROOT.GetFactionName]. Разочарование наших дипломатов и чиновников неизмеримо, а выход государства [FROM.GetNameDef] из Балканского пакта и отказ от фракции [ROOT.GetFactionName] поставили под угрозу весь проект."
 bftb_turkey.43.a:0 "Солидарность могла спасти нас; вместо этого разобщённость может нас уничтожить."
 bftb_turkey.44.t:0 "Предложение Петры"
 bftb_turkey.44.desc:0 "Мы получили оборонительный план от [FROM.GetNameDef] Предложив, чтобы [FROM.GetAdjective] Правительство защищает наши владения в Леванте.[FROM.GetLeader] утверждает, что [FROM.GetNameDef]Географическая близость делает защиту и управление этими территориями простым делом, и что сдача этих территорий в руки государства. [FROM.GetNameDef] Это освободит наши ресурсы для перенаправления в другое место.\n\nПредложение не лишено достоинств, но оно ставит нас в интригующее положение. Мы захватили Палестину, Иорданию и Синай у побежденной Османской империи: готовы ли мы вернуть ее в руки народа? [FROM.GetAdjective] преемников Османской империи. Историческое соображение следует отложить в сторону, а также рассмотреть вопрос о том, как [FROM.GetAdjective] Правительство может отреагировать, если мы откажемся. Они могут интерпретировать наше неприятие как знак того, что мы им не доверяем или что мы не ценим их место в этом союзе.[FROM.GetNameDefCap] В прошлом это было непредсказуемо, и, к сожалению, мы не можем принять это на веру. [FROM.GetAdjective] Власти не будут нагнетать этот вопрос, если мы их откажем."
 bftb_turkey.44.a:0 "План стратегически обоснован!"
 bftb_turkey.44.b:0 "Османская империя распалась не без причины."
 bftb_turkey.45.t:0 "[FROM.GetAdjective] сторона одобряет предложение Петры"
 bftb_turkey.45.desc:0 "[FROM.GetAdjective] колониальные чиновники уже покидают посты и переходят в соседние протектораты, обеспечивая беспрепятственный переход бывших [FROM.GetAdjective] колоний под наш контроль. [FROM.GetLeader] написал нашему президенту, что государство [FROM.GetNameDef] полностью доверяет способности государства [ROOT.GetNameDef] защищать переданные нам провинции и управлять ими.\n\nМногие [ROOT.GetAdjective] граждане считают передачу земель великой победой и подтверждением того, что государство [ROOT.GetNameDef] вновь стало сильной региональной державой, уважаемой во всём мире."
 bftb_turkey.45.a:0 "Теперь мы играем в высшей лиге."
 bftb_turkey.46.t:0 "[FROM.GetAdjective] сторона отклоняет предложение Петры"
 bftb_turkey.46.desc:0 "Премьер-министр [FROM.GetLeader] из [FROM.GetNameDef] Он сказал, что капитуляция [FROM.GetAdjective] Территории в Леванте до [ROOT.GetNameDef] Это было бы немыслимо и предостерегалось бы, что мудрость, необходимая для продолжения [FROM.GetAdjective] управления в регионе.[FROM.GetAdjective] Силы в Леванте даже были приведены в боевую готовность, чтобы гарантировать, что они могут быстро предотвратить любые неожиданные события. [ROOT.GetAdjective] вторжение на территорию.\n\nВ частном порядке многие из наших правительственных чиновников выразили свое разочарование в связи с тем, что [FROM.GetAdjective] решение, ссылаясь на отклонение нашего предложения в качестве доказательства того, что [FROM.GetAdjective] Не доверяйте нам как союзникам.[ROOT.GetLeader] Он также выразил свое неодобрение по поводу [FROM.GetAdjective] Он попросил советников представить варианты ответа."
 bftb_turkey.46.a:0 "Мы попытались и потерпели неудачу. Больше ничего не сделать."
 bftb_turkey.46.b:0 "Мы обострим вопрос!"
 bftb_turkey.47.t:0 "Государство [FROM.GetNameDefCap] выражает тревогу за оборону залива"
 bftb_turkey.47.desc:0 "Президент [FROM.GetLeader] из [FROM.GetNameDef] Мы связались с нами по поводу безопасности наших колоний в Аравийских заливах. The [FROM.GetAdjective] Руководитель предположил, что [FROM.GetNameDef] взять на себя ответственность за оборону и администрирование всего региона. [FROM.GetNameDef]История города и близость к нему.\n\nНекоторые [ROOT.GetAdjective] Чиновники выразили тревогу по поводу этого предложения, учитывая, что [FROM.GetNameDef] Он лишь недавно подал прошение о взятии под контроль Левантийского региона. Аналитики опасаются, что [FROM.GetNameDef] стратегически спланировал эти дипломатические захваты земли, чтобы установить новый статус-кво для области, где [FROM.GetNameDef] Это бесспорная власть над всем субконтинентом. Несмотря на будущие проблемы, [FROM.GetNameDef] Мы остаемся нашим союзником, и если мы хотим, чтобы они оставались таковыми, было бы разумно уступить их просьбе о контроле над нашими арабскими колониями."
 bftb_turkey.47.a:0 "Посмотрим, готово ли государство [FROM.GetNameDef] к такой ответственности."
 bftb_turkey.47.b:0 "Этот неоколониализм нельзя и не следует терпеть."
 bftb_turkey.48.t:0 "[FROM.GetAdjective] сторона доверяет нам оборону залива"
 bftb_turkey.48.desc:0 "Уже готовятся транспорты для гарнизонов и администраторов, чтобы немедленно отправить их в новые владения в двух аравийских заливах. [FROM.GetAdjective] сторона отказалась от власти над регионом и передала нам суверенитет над этими землями для защиты и управления."
 bftb_turkey.48.a:0 "Теперь мы действительно великая держава."
 bftb_turkey.49.t:0 "[FROM.GetAdjective] сторона отказывает нам в аравийских территориях"
 bftb_turkey.49.desc:0 "[FROM.GetAdjective] посол назвал [ROOT.GetAdjective] притязания на [FROM.GetAdjective] территории в Аравии «неприемлемыми» и потребовал немедленно закрыть вопрос. Наши эксперты по обороне разочарованы тем, что нам не дали права управлять [FROM.GetAdjective] аравийскими территориями. Тем не менее [FROM.GetAdjective] чиновники утверждают, что мы сохраняем права на порты и базы в регионах, пока государство [ROOT.GetNameDef] состоит во фракции [FROM.GetFactionName]."
 bftb_turkey.49.a:0 "Прискорбно."
 bftb_turkey.50.t:0 "Государство [FROM.GetNameDefCap] просит лёгкие танки"
 bftb_turkey.50.desc:0 "Представители государства [FROM.GetNameDef] обратились к нам с заявленным желанием приобрести лёгкие танки из наших запасов. Выражая восхищение тем, что они назвали «[ROOT.GetAdjective] гением» и «совершенством конструкции», [FROM.GetAdjective] чиновники сообщили, что государству [FROM.GetNameDef] необходима [ROOT.GetAdjective] бронетехника для защиты суверенитета."
 bftb_turkey.50.a:0 "Мы отправим лучшие образцы!"
 bftb_turkey.50.b:0 "Отправить несколько стандартных бронемашин."
 bftb_turkey.50.c:0 "Пусть получат некоторые старые модели."
 bftb_turkey.50.d:0 "Государство [FROM.GetNameDefCap] не получит от нас абсолютно ничего."
 bftb_turkey.51.t:0 "Государство [FROM.GetNameDefCap] отправляет улучшенные лёгкие танки!"
 bftb_turkey.51.desc:0 "Мы только что получили партию [FROM.GetAdjective] танков прямо с их складов! Бронетехника современная, а первые испытания показали её универсальность. Она несомненно хорошо послужит нашим вооружённым силам."
 bftb_turkey.51.a:0 "Какой неожиданный сюрприз!"
 bftb_turkey.52.t:0 "Государство [FROM.GetNameDefCap] отправляет лёгкие танки"
 bftb_turkey.52.desc:0 "Мы только что получили партию [FROM.GetAdjective] танков прямо с их складов! Согласно испытаниям качества, лёгкая бронетехника несколько устарела, но остаётся достаточно надёжной. Она несомненно хорошо послужит нашим вооружённым силам."
 bftb_turkey.52.a:0 "Огромная помощь."
 bftb_turkey.53.t:0 "Государство [FROM.GetNameDefCap] дарит устаревшую бронетехнику"
 bftb_turkey.53.desc:0 "Мы только что получили партию [FROM.GetAdjective] танков прямо с их складов! Бронетехника несомненно устарела, и [FROM.GetAdjective] сторона, вероятно, вывела эту модель из эксплуатации из-за множества недостатков. Тем не менее наши вооружённые силы найдут ей применение. Каким-нибудь образом."
 bftb_turkey.53.a:0 "Если она была достаточно хороша в 1922 году, то сгодится и сейчас!"
 bftb_turkey.54.t:0 "Государство [FROM.GetNameDefCap] ничего нам не отправляет"
 bftb_turkey.54.desc:0 "[FROM.GetAdjective] сторона отказалась отправить нам хотя бы шасси самой старой модели. По всей видимости, [FROM.GetAdjective] бронетехника предназначена исключительно для [FROM.GetAdjective] использования, а видные деятели государства [FROM.GetNameDef] якобы сослались на соображения национальной безопасности как причину отказа."
 bftb_turkey.54.a:0 "Всё равно эти танки наверняка сломались бы."
 bftb_turkey.55.t:0 "Концессия Честера"
 bftb_turkey.55.desc:0 "В 1923 году недавно созданная Турецкая Республика ратифицировала и одобрила закон, позволявший нам разрабатывать нефтяные месторождения и железные дороги государства [FROM.GetNameDef]. Сенат Соединённых Штатов, учитывая ущерб Великой депрессии американской экономике, решил не ратифицировать договор. Теперь государство [FROM.GetNameDefCap] отменило аннулирование соглашения и попросило нас выполнить условия концессии, которую мы первоначально составили.\n\nНельзя отрицать, что экономически мы находимся в гораздо более безопасном положении, чем в 1923 году, а идеологическое и военное сближение государства [FROM.GetNameDef] с нами стало бы большим преимуществом. Однако над всем миром нависает война, и даже находясь в сильной позиции, мы должны экономно расходовать ресурсы. Доступная нефть в государстве [FROM.GetNameDef] в будущем может стать ценным рычагом против государства [SOV.GetNameDef]. Но в краткосрочной перспективе следует учитывать и вероятность того, что обнаруженная нефть попадёт в руки врагов. Возможно, разумно использовать потребность [FROM.GetAdjective] стороны в нашей помощи для достижения собственных целей. Государство [FROM.GetNameDef] богато хромом, а наша страна, к сожалению, нет. Выбор за нами."
 bftb_turkey.55.a:0 "Мы поможем всем друзьям демократии."
 bftb_turkey.55.b:0 "Мы поможем им. При определённых условиях."
 bftb_turkey.56.t:0 "Государство [FROM.GetNameDefCap] безоговорочно предоставляет концессию"
 bftb_turkey.56.desc:1 "Государство [FROM.GetNameDefCap] согласилось без компенсации выполнить обязательства, обещанные нам более десяти лет назад. Используя превосходные технологии и обширные промышленные ресурсы, оно добыло нефть в регионе [350.GetName], которую мы прежде не могли надёжно извлекать. [FROM.GetAdjective] сторона также оставила в нашем распоряжении часть промышленности, использованной при добыче, чтобы мы могли по своему усмотрению приспособить её для выполнения других условий концессии.\n\nВ качестве дополнительного проявления дружбы [FROM.GetAdjective] сторона передала нам некоторые методы и оборудование, использованные в процессе добычи, чтобы мы лучше использовали природные ресурсы всей страны."
 bftb_turkey.56.a:0 "[FROM.GetAdjective] сторона просто великолепна."
 bftb_turkey.57.t:0 "[FROM.GetAdjective] сторона устанавливает условия концессии"
 bftb_turkey.57.desc:0 "[FROM.GetNameDefCap] Он согласился выполнить обязательства, которые обещал выполнить для нас более десяти лет назад в обмен на компенсацию. Они готовы использовать свои передовые технологии и обширные промышленные ресурсы для добычи нефти в регионе. [350.GetName] Мы не смогли надежно раскопать. Однако в обмен на это, [FROM.GetAdjective]s требуют исключительных ресурсов для прав на [343.GetName]. Чтобы подсластить сделку, [FROM.GetAdjective]Они выразили готовность научить нас некоторым из своих передовых методов добычи и предоставить нам схемы некоторых из их более сложных инструментов для раскопок.\n\nЗапрос уступки должен был быть достаточно унизительным, но это может оказаться за бледностью. Наша нация призвана представлять плоды антиимпериализма и антиколониализма, и если мы согласны с этим, то мы должны быть готовы к тому, что [FROM.GetAdjective] Тогда мы будем предавать наши ценности. И все же, можем ли мы позволить себе отказаться от благ, которые [FROM.GetNameDef] Можете предложить нам?"
 bftb_turkey.57.a:0 "Хорошо, дать империалистическим ублюдкам то, чего они хотят."
 bftb_turkey.57.b:0 "Мы никогда не будем жить под [FROM.GetAdjective] пятой!"
 bftb_turkey.58.t:0 "Государство [FROM.GetNameDefCap] выполняет наши требования"
 bftb_turkey.58.desc:0 "[FROM.GetAdjective] правительство согласилось на все наши требования в обмен на помощь. Хром уже начал поступать в порты из региона [343.GetName], а что ещё лучше — в ходе добычи нефти в регионе [350.GetName] мы кое-чему научились."
 bftb_turkey.58.a:0 "Как же прекрасно быть [FROM.GetAdjective] гражданином."
 bftb_turkey.59.t:0 "Государство [FROM.GetNameDefCap] отклоняет наши требования!"
 bftb_turkey.59.desc:0 "The [FROM.GetAdjective] Правительство отвергло справедливые условия, которые мы установили в обмен на нашу помощь. Если [FROM.GetAdjective] Правительство было просто готово внести свою справедливую долю, каждый мог уйти победителем. Вместо этого им придется подождать еще несколько лет, прежде чем они когда-либо ударят по любому из этих черных золотых монет."
 bftb_turkey.59.a:0 "Мы — государство [ROOT.GetNameDef], и всё равно остаёмся победителями."
 bftb_turkey.60.t:0 "Государство [FROM.GetNameDefCap] поднимает вопрос Хатая"
 bftb_turkey.60.desc:1 "[FROM.GetLeader] В письме содержится требование, чтобы турецкое население сирийского государства Хатай получило демократическое право на референдум, чтобы народ Хатая мог решить, хочет ли он присоединиться к организации. [FROM.GetNameDef] или оставаться частью [ROOT.GetNameDef] Неопределенно. Наши вооруженные силы выявили незаконную деятельность на [ROOT.GetAdjective]-[FROM.GetAdjective] границы, с [FROM.GetAdjective] Граждане пересекают нашу границу и вызывают шум в провинции Хатай. Ясно, что [FROM.GetNameDef] Он намерен подтасовать результаты референдума, чтобы обеспечить [FROM.GetAdjective] Победа, но, возможно, просто капитуляция провинции Хатай. [FROM.GetNameDef] Это самый мудрый курс действий. Воюющий [FROM.GetName] На нашей границе это не идеальный сценарий."
 bftb_turkey.60.a:0 "Какой у нас выбор?"
 bftb_turkey.60.b:0 "Если им нужен Хатай, пусть попробуют забрать его силой."
 bftb_turkey.61.t:0 "Государство [FROM.GetNameDef] передаёт нам суверенитет над Хатаем"
 bftb_turkey.61.desc:0 "[ROOT.GetLeader] выступил с короткой речью в Антакье, приветствуя жителей Хатай [ROOT.GetNameDef] И благодарных ему людей, [FROM.GetLeader] из [FROM.GetNameDef] за уважение демократической воли народа Хатай. Несмотря на то, что этот шаг был встречен возмущением со стороны многих сирийских чиновников по всему политическому спектру, общее настроение Хатая и сирийской оппозиции в Сирии было крайне неутешительным. [ROOT.GetNameDef] В целом, это было одно из многих удовольствий. [ROOT.GetAdjective] Люди совершали поездки из своих домов в Хатай, чтобы освятить [ROOT.GetNameDef]Новая провинция с торжествами и обменом подарками.[FROM.GetLeader] Об этом не сообщается, но источники, близкие к [FROM.GetAdjective] Лидер говорит, что [FROM.GetAdjective] Он считает, что это лишь временное положение дел, и что Хатай так или иначе в будущем вернется в их объятия."
 bftb_turkey.61.a:0 "Добро пожаловать домой, братья и сёстры."
 bftb_turkey.62.t:0 "Государство [FROM.GetName] сохраняет твёрдый контроль над Хатаем"
 bftb_turkey.62.desc:0 "[ROOT.GetLeader] Он возглавил пламенный митинг в Газиантепе, где осудил угнетение турок за рубежом. [FROM.GetNameDef]. The [ROOT.GetAdjective] Люди были ввергнуты в шум, и советники говорят, что есть некоторый энтузиазм среди тех, кто был настроен против них. [ROOT.GetAdjective] Народ должен использовать войну как средство для исправления этого несправедливого положения дел. Это [FROM.GetNameDef] Думал, что это может бросить вызов нашей воле, это была чистая глупость. [ROOT.GetNameDef] Он никогда не позволит, чтобы над ним издевались меньшие силы."
 bftb_turkey.62.a:0 "Государство [FROM.GetNameDef] должно погибнуть."
 bftb_turkey.63.t:0 "Государство [FROM.GetNameDefCap] приглашает нас во фракцию [FROM.GetFactionName]"
 bftb_turkey.63.desc:0 "Недавно [FROM.GetLeader] встретился с [ROOT.GetLeader], чтобы обсудить всеобъемлющий пан-средиземноморский союз с единой позицией по кризисам, требующим военного вмешательства. Союз с государством [FROM.GetNameDef] может придать нашим региональным целям больше легитимности, даже если ради этого придётся отказаться от поддержки великих держав. Следует также учесть, что, в отличие от нас, государство [FROM.GetNameDef] пользуется довольно хорошей репутацией среди балканских и средиземноморских стран. Оно может использовать эту репутацию, чтобы дипломатически заручиться поддержкой государств, которые иначе не захотели бы иметь с нами дела.\n\nМы стоим на распутье: принять ли оливковую ветвь государства [FROM.GetNameDef] и использовать его перо, чтобы заточить свой меч против великих держав, или обратиться к презренным тевтонам и срезать тянущиеся к нам малые страны, словно сорняки в саду? Только мы можем решить судьбу балканских стран: спасти их от [GER.GetAdjective] и [SOV.GetAdjective] гегемонии либо помочь этим державам и ускорить гибель соседей. Выбор за нами."
 bftb_turkey.63.a:0 "Мы ещё можем искупить вину, спасая других."
 bftb_turkey.63.b:0 "Этот мир холоден и беспощаден, как и мы."
 bftb_turkey.64.t:0 "Государство [FROM.GetNameDefCap] вступает во фракцию [ROOT.GetFactionName]"
 bftb_turkey.64.desc:0 "[FROM.GetLeader] напыщенно объявил своей нации на пышной церемонии, что душа и судьба государства [FROM.GetNameDef] теперь связаны с государством [ROOT.GetNameDef]. [ROOT.GetLeader] объявил почти то же самое, но гораздо сдержаннее.\n\n[ROOT.GetAdjective] чиновники надеются, что союз с государством [FROM.GetNameDef] позволит держать его экспансионистские стремления на коротком поводке. Взамен государство [FROM.GetNameDefCap] сможет использовать статус великой державы для защиты малых стран Средиземноморья от гегемонов, желающих поглотить их целиком."
 bftb_turkey.64.a:0 "Нужно скорее привлечь к пакту другие страны."
 bftb_turkey.65.t:0 "Государство [FROM.GetNameDefCap] отказывается вступать во фракцию [ROOT.GetFactionName]"
 bftb_turkey.65.desc:0 "Нам сообщили, что государство [FROM.GetNameDef] не вступит во фракцию [ROOT.GetFactionName]. [ROOT.GetAdjective] чиновники разочарованы и серьёзно обеспокоены тем, что это может означать для будущего Средиземноморья. [ROOT.GetLeader] в частном порядке призвал правительство ускорить принятие новых членов, чтобы государство [ROOT.GetNameDef] смогло создать мощный блок против возможного [FROM.GetAdjective] ирредентизма."
 bftb_turkey.65.a:0 "Нужно скорее привлечь к пакту другие страны."
 bftb_turkey.66.t:0 "Государство [FROM.GetNameDefCap] предлагает план раздела государства [GRE.GetNameDef]"
 bftb_turkey.66.desc:0 "[FROM.GetNameDefCap] По его словам, хотя действия и вызывают сожаление по соображениям национальной безопасности, [GRE.GetNameDef] должны быть уничтожены. Наши официальные лица с энтузиазмом и от всей души согласились с мнением наших коллег. [FROM.GetAdjective] Напоминая им, что это была наша официальная позиция с самого начала.\n\n[FROM.GetNameDefCap] Предполагают деление [GRE.GetNameDef] Географическая предпосылка: мы будем обеспечены [185.GetName], [186.GetName]и [182.GetName]Таким образом, обеспечивая наше господство над Восточным Средиземноморьем и Ионическим морем.[FROM.GetNameDefCap] Потребуется оставшаяся [GRE.GetAdjective] Государства, гарантирующие [FROM.GetAdjective] контроль над Эгейским морем, которое многие из их государств уже граничат.\n\nСоглашение по большей части справедливое - более разумное, чем мы могли бы ожидать в условиях свободного для всех захвата земли. Мы давно мечтали добавить [47.Capital.GetName] Как жемчужина короны нашей империи, и этот план, безусловно, положил бы конец этим амбициям в обозримом будущем. Готовы ли мы отказаться от премии [47.Capital.GetName] За мир в Средиземноморье?"
 bftb_turkey.66.a:0 "Справедливое и приемлемое соглашение о будущем государства [GRE.GetNameDef]."
 bftb_turkey.66.b:0 "Мы должны получить всё!"
 bftb_turkey.67.t:0 "Переворот «Золотого квадрата»"
 bftb_turkey.67.desc:0 "Из региона [676.GetName] поступили потрясающие новости: бывший премьер-министр Рашид Али аль-Гайлани попытался совершить государственный переворот против правительства [ROOT.GetLeader]. Аль-Гайлани пользуется поддержкой значительной части армии и даже части населения.\n\nСчитается, что иностранное вмешательство сыграло ключевую роль в организации и вооружении предателей из «Золотого квадрата». Среди всех возможных участников именно государству [FROM.GetNameDef] приписывают наиболее значительную поддержку фашистской попытки переворота.\n\n«Золотой квадрат» твёрдо выступает за силовое изгнание [ENG.GetAdjective] империалистов с помощью государства [GER.GetNameDef], и многие наши граждане считают такую позицию весьма похвальной. Возможно, свободная Аравия достижима лишь через фашизм."
 bftb_turkey.67.a:0 "Машаллах, мы сражаемся за душу Ирака против фашизма!"
 bftb_turkey.67.b:0 "Только через фашизм возможно наше освобождение."
 bftb_turkey.67.c:0 "Разогнать фашистских паразитов."
 bftb_turkey.68.t:0 "Начинается [IRQ.GetAdjective] гражданская война"
 bftb_turkey.68.desc:0 "Наши усилия по разжиганию фашистского переворота в государстве [IRQ.GetNameDef], похоже, щедро окупились. [IRQ.GetAdjective] фашисты теперь сражаются с прежним правительством за контроль над всей страной, и независимо от исхода мы окажемся в идеальном положении для установления твёрдого контроля над регионом."
 bftb_turkey.68.a:0 "Пока будем сидеть и ждать."
 bftb_turkey.69.t:0 "[IRQ.GetAdjective] фашисты побеждают"
 bftb_turkey.69.desc:0 "Как и ожидалось, [IRQ.GetAdjective] фашисты завершили разгром последних очагов сопротивления [IRQ.GetAdjective] лоялистов. Теперь они слишком слабы, чтобы противостоять нам, когда мы войдём и захватим государственный аппарат."
 bftb_turkey.69.a:0 "Как восхитительно по-макиавеллиевски!"
 bftb_turkey.70.t:0 "[IRQ.GetAdjective] фашисты терпят поражение"
 bftb_turkey.70.desc:0 "[IRQ.GetAdjective] фашисты не смогли свергнуть [IRQ.GetAdjective] лоялистов и были разгромлены [IRQ.GetAdjective] армией. Это полное безобразие, но, как и планировалось, наши стратеги считают, что государство [IRQ.GetNameDef] теперь слишком слабо, чтобы сопротивляться, когда наши силы войдут и захватят государственный аппарат."
 bftb_turkey.70.a:0 "Игра была подстроена с самого начала."
 bftb_turkey.71.t:0 "[IRQ.GetAdjective] фашисты захватывают власть в государстве [IRQ.GetNameDef]"
 bftb_turkey.71.desc:0 "The [IRQ.GetAdjective] Фашисты успешно свергли бывшее правящее правительство и теперь контролируют всю страну. The [IRQ.GetAdjective] Фашисты ясно дали понять, что одна из их главных целей состоит в том, чтобы избавить Аравию от фашистов. [ENG.GetAdjective] Влияние любой ценой. Они считают, что [ROOT.GetAdjective] Вмешательство — лучший способ добиться этого."
 bftb_turkey.71.a:0 "Государство [IRQ.GetNameDefCap]? Нас это почти не касается."
 bftb_turkey.71.b:0 "Они получат нашу полную поддержку."
 bftb_turkey.71.c:0 "Они доказали, что достойны фракции [ROOT.GetFactionName]."
 bftb_turkey.72.t:0 "Государство [FROM.GetNameDefCap] поддерживает нас!"
 bftb_turkey.72.desc:0 "[FROM.GetAdjective] сторона решила объявить о поддержке нашего правительства. Такие заявления имеют основополагающее значение для утверждения суверенитета и легитимизации нашей роли как нации, принципиально противостоящей [ENG.GetAdjective] империализму."
 bftb_turkey.72.a:0 "Их храбрость достойна похвалы и благодарности!"
 bftb_turkey.73.t:0 "[IRQ.GetAdjective] фашисты захватывают власть в государстве [IRQ.GetNameDef]"
 bftb_turkey.73.desc:0 "The [IRQ.GetAdjective] Фашисты успешно свергли бывшее правящее правительство и теперь контролируют всю страну. The [IRQ.GetAdjective] Фашисты ясно дали понять, что одна из их главных целей состоит в том, чтобы избавить Аравию от фашистов. [ENG.GetAdjective] Влияние любой ценой. Они считают, что [ROOT.GetAdjective] Вмешательство — лучший способ добиться этого."
 bftb_turkey.73.a:0 "Государство [IRQ.GetNameDefCap] недостойно нашего внимания."
 bftb_turkey.73.b:0 "Что ж... мы действительно провозгласили себя Мечом ислама."
 bftb_turkey.74.t:0 "Государство [FROM.GetNameDefCap] поддерживает нас!"
 bftb_turkey.74.desc:0 "[FROM.GetAdjective] сторона решила объявить о поддержке нашего правительства. Такие заявления имеют основополагающее значение для утверждения суверенитета и легитимизации нашей роли как нации, принципиально противостоящей [ENG.GetAdjective] империализму."
 bftb_turkey.74.a:0 "С [ITA.GetAdjective] стороной на нашей стороне мы не можем проиграть!"
 bftb_turkey.75.t:0 "[IRQ.GetAdjective] сторона национализирует нефть!"
 bftb_turkey.75.desc:0 "Из государства [IRQ.GetNameDef] поступили потрясающие новости: [ROOT.GetAdjective] чиновников, управлявших нефтяными запасами страны, под вооружённой охраной сопроводили к [IRQ.GetAdjective] границе и выдворили! Не менее тревожны слухи о том, что новое [IRQ.GetAdjective] правительство намерено пригласить [GER.GetAdjective] военное присутствие на свою территорию.\n\nБолее того, разведка предполагает, что всё это было организовано государством [FROM.GetNameDef] ради помощи фракции [GER.GetFactionName]! Нам предстоит решить, как действовать дальше: [IRQ.GetAdjective] сторона может занять более нейтральную позицию, если мы признаем её решение захватить нефть, но следует определить, можем ли мы допустить возможность попадания этой нефти в [GER.GetAdjective] руки."
 bftb_turkey.75.a:0 "Они — такие же хранители священного пламени."
 bftb_turkey.75.b:0 "Эта нефть не должна попасть в руки фашистов!"
 bftb_turkey.75.c:0 "Мы должны защитить божественное право королей."
 bftb_turkey.75.d:0 "Иного исхода у этого быть не могло."
 bftb_turkey.75.e:0 "Это их право как суверенной нации."
 bftb_turkey.76.t:0 "[ENG.GetAdjective] сторона уступает нам!"
 bftb_turkey.76.desc:0 "[FROM.GetAdjective] сторона передала нам полный контроль над нефтяными месторождениями. Наш суверенитет вновь принадлежит нам: мы обыграли империалистов по их же правилам!"
 bftb_turkey.76.a:0 "Аллаху акбар, слава [ROOT.GetLeader]!"
 bftb_turkey.77.t:0 "[ENG.GetAdjective]-[GER.GetAdjective] союз"
 bftb_turkey.77.desc:0 "Судьба сыграла с нами ужасную и жестокую шутку: [ENG.GetAdjective] и [GER.GetAdjective] стороны заключили союз! Нам была жизненно необходима поддержка фракции [GER.GetFactionName], но коварные [ENG.GetAdjective] псы опередили нас!\n\nЭто поистине мрачный день в [ROOT.GetAdjective] истории. Мы остались одни, и поддержать нас могут лишь [TUR.GetAdjective] силы, которые почти наверняка струсили бы перед совместным [ENG.GetAdjective]-[GER.GetAdjective] противодействием. Можно ли их за это винить? Кто в здравом уме бросит вызов столь могущественной паре? Осмелимся ли мы сами?"
 bftb_turkey.77.a:0 "Иншаллах, европейцы падут перед мечом."
 bftb_turkey.77.b:0 "В каком безумном мире мы живём?"
 bftb_turkey.79.t:0 "Государство [FROM.GetNameDefCap] просит продлить пакт о ненападении"
 bftb_turkey.79.desc:0 "Мы исторически поддерживали дружеские отношения с [FROM.GetNameDef] Мы считаем друг друга единомышленниками-антиимпериалистами. Однако за последние несколько лет связи стали более морозными.\n\nВ попытке разморозить отношения между нашими странами, [FROM.GetLeader] Он предложил возобновить пакт о ненападении, который мы подписали много лет назад. Мы должны рассматривать эту оливковую ветвь как знак того, что [FROM.GetNameDef] В скором времени мы сможем выйти на более глубокие уровни сотрудничества. Однако, [ROOT.GetLeader] Он также не скрывал, что жаждет турецких проливов. Мы должны решить, какой вариант предпочтительнее: желающий [FROM.GetAdjective] союзник или [FROM.GetAdjective] Вассал."
 bftb_turkey.79.a:0 "Дружеские связи с государством [FROM.GetNameDef] могут принести лишь пользу."
 bftb_turkey.79.b:0 "Увы, у нас на них другие планы."
 bftb_turkey.80.t:0 "[FROM.GetAdjective] сторона соглашается продлить пакт о ненападении"
 bftb_turkey.80.desc:0 "С радостью сообщаем о хороших новостях из государства [FROM.GetNameDef]. [FROM.GetAdjective] ответ на предложение возобновить пакт о ненападении был весьма восторженным. Наши чиновники считают, что окончательные детали соглашения будут согласованы до конца недели."
 bftb_turkey.80.a:0 "Великий день для мира."
 bftb_turkey.81.t:0 "[FROM.GetAdjective] сторона отклоняет план продления пакта о ненападении"
 bftb_turkey.81.desc:0 "Нам сообщили, что государство [FROM.GetNameDef] не намерено возобновлять старый пакт о ненападении. Напротив, [FROM.GetAdjective] чиновники уже аннулировали прежний договор, окончательно развеяв любые иллюзии о том, что отношения между нами и государством [FROM.GetNameDef] будут тёплыми в ближайшие годы."
 bftb_turkey.81.a:0 "Это может означать лишь нечто ужасное."
 bftb_turkey.82.t:0 "Запрет Коммунистической партии Турции снят"
 bftb_turkey.82.desc:0 "Изгнанные представители Коммунистической партии Турции были приглашены вернуться в государство [ROOT.GetNameDef], а [ROOT.GetLeader] помиловал их по всем обвинениям. Часть правительства тепло встретила членов TKP, тогда как более ортодоксальные кемалисты сторонились их.\n\nХотя [ROOT.GetLeader] лично не встречал бывших изгнанников, им было открыто предложено участвовать в работе правительства. Войдут ли представители TKP в кабинет министров, в конечном счёте решит само правительство."
 bftb_turkey.82.a:0 "Нам безразлично, что они решат."
 bftb_turkey.83.t:0 "Возвращение Коммунистической партии Турции"
 bftb_turkey.83.desc:0 "Изгнанные представители Коммунистической партии Турции были приглашены вернуться в государство [ROOT.GetNameDef], а [ROOT.GetLeader] помиловал их по всем обвинениям. Часть правительства тепло встретила членов TKP, тогда как более ортодоксальные кемалисты сторонились их.\n\nНа официальном приёме в честь возвращения, организованном [ROOT.GetLeader], произошёл неожиданный переворот. Шефик Хюсню поднялся на сцену и объявил о роспуске буржуазного и ревизионистского кемалистского режима в пользу системы, более похожей на московскую. За считаные часы по всей стране были арестованы кемалистские чиновники и офицеры. Если сообщения верны, во всём процессе участвовали [SOV.GetAdjective] агенты."
 bftb_turkey.83.a:0 "Погодите-ка..."
 bftb_turkey.84.t:0 "Государство [FROM.GetNameDefCap] требует нашего подчинения"
 bftb_turkey.84.desc:0 "Адские змеи из государства [FROM.GetNameDef] предъявили одностороннее требование разоружиться и допустить [FROM.GetAdjective] солдат на нашу территорию, чтобы они могли «гарантировать безопасность и права [ROOT.GetAdjective] рабочих». Мотив этих нелепых требований очевиден: государство [FROM.GetNameDef] стремится получить полный контроль над нашими делами и суверенитетом.\n\nМы не какая-то ничтожная держава без значения в мировых делах; мы — государство [ROOT.GetNameDef]! Нельзя позволить откровенно злонамеренной силе, видящей в нас лишь будущую жертву, так с нами обращаться. Нужно искать союзников; наверняка найдётся хотя бы одна страна, готовая выступить против [FROM.GetAdjective] милитаризма! Но стоит ли возможная цена в [ROOT.GetAdjective] жизнях такого риска?"
 bftb_turkey.84.a:0 "Государство [SOV.GetNameDefCap] справедливо выступит посредником."
 bftb_turkey.84.b:0 "Мы демократически голосуем... обратиться за помощью!"
 bftb_turkey.84.c:0 "Наверняка кто-нибудь спасёт нас от этой марксистской мрази!"
 bftb_turkey.84.d:0 "Наши друзья гарантируют безопасность."
 bftb_turkey.84.e:0 "[ROOT.GetAdjective] жизни важнее всего."
 bftb_turkey.85.t:0 "Государство [FROM.GetNameDefCap] просит посредничества против [TUR.GetAdjective] агрессии"
 bftb_turkey.85.desc:0 "Чиновники из [FROM.GetNameDefCap] Мы обратились к ним, надеясь, что мы предложим им защиту перед лицом опасности. [TUR.GetAdjective] Агрессия.[FROM.GetNameDefCap] Мы предоставили довольно обширный портфель, объясняющий, почему потеря [FROM.GetNameDef] к [TUR.GetAdjective] Сфера влияния нанесла бы ущерб континентальному равновесию и страстно отстаивала их право на самоуправление в надежде, что мы решим предложить им помощь."
 bftb_turkey.85.a:0 "Государство [TUR.GetNameDefCap] пытается монополизировать коммунизм!"
 bftb_turkey.85.b:0 "Государство [TUR.GetNameDefCap] угрожает равновесию на континенте!"
 bftb_turkey.85.c:0 "Нельзя позволять красным бесчинствовать."
 bftb_turkey.85.d:0 "[FROM.GetAdjective] конфликты нас не касаются."
 bftb_turkey.86.t:0 "Государство [FROM.GetNameDefCap] гарантирует нашу независимость"
 bftb_turkey.86.desc:0 "Нам сообщили, что государство [FROM.GetNameDef] намерено гарантировать нашу независимость перед лицом [TUR.GetAdjective] агрессии. Это значительная дипломатическая победа, которая, будем надеяться, заставит государство [TUR.GetNameDef] пересмотреть возмутительные требования."
 bftb_turkey.86.a:0 "Истинные друзья государства [ROOT.GetNameDef]."
 bftb_turkey.87.t:0 "Государство [BUL.GetNameDefCap] получает внешнюю поддержку"
 bftb_turkey.87.desc:0 "Подлые [BUL.GetAdjective] силы нашли сторонников в своей обречённой борьбе за независимость! Это именно то осложнение, которого мы хотели избежать. Нам предстоит решить, готовы ли мы продолжить и силой навязать требования либо настало время отступить и предотвратить более крупную войну."
 bftb_turkey.87.a:0 "Мы продолжим несмотря ни на что."
 bftb_turkey.87.b:0 "Это болезненная неудача."
 bftb_turkey.88.t:0 "Государство [FROM.GetNameDefCap] отступает!"
 bftb_turkey.88.desc:0 "Общее настроение правительства можно назвать ликованием: мы только что узнали, что [FROM.GetAdjective] правительство и вооружённые силы отступили и теперь призывают снизить напряжённость. Это огромная победа как [ROOT.GetAdjective] государства, так и [ROOT.GetAdjective] народа."
 bftb_turkey.88.a:0 "Мы победили!"
 bftb_turkey.89.t:0 "Ни одна страна нас не поддержала"
 bftb_turkey.89.desc:0 "[ROOT.GetLeader] безутешен после ужасной новости, что ни одна страна не поддержит государство [ROOT.GetNameDef] против [TUR.GetAdjective] агрессии. Безразличие других держав оставляет нам чудовищный выбор: сражаться или уступить и спасти жизни."
 bftb_turkey.89.a:0 "У нас нет выбора; нужно сдаться."
 bftb_turkey.89.b:0 "Мы не уступим без боя!"
 bftb_turkey.90.t:0 "Государство [BUL.GetNameDefCap] сдаётся нам"
 bftb_turkey.90.desc:0 "Мы на шаг ближе к мировой революции: [FROM.GetAdjective] власти сложили полномочия и передали управление новой группе коммунистических министров, лично выбранных нашими партийными чиновниками для руководства государством [FROM.GetNameDef]. Контроль над [FROM.GetAdjective] армией и промышленностью ещё больше укрепляет наше положение в регионе и Европе."
 bftb_turkey.90.a:0 "Теперь их освобождение завершено."
 bftb_turkey.91.t:0 "Государство [BUL.GetNameDefCap] продолжает сопротивление"
 bftb_turkey.91.desc:0 "Мы получили неожиданный доклад: государство [FROM.GetNameDef] отвергает наши совершенно разумные требования. [FROM.GetAdjective] правительство могло выбрать путь наименьшего сопротивления, но вместо этого выбрало путь страданий."
 bftb_turkey.91.a:0 "Тогда мы их усмирим."
 bftb_turkey.92.t:0 "Государство [FROM.GetNameDefCap] подписывает Саадабадский пакт"
 bftb_turkey.92.desc:0 "[FROM.GetLeader] с большим энтузиазмом воспринял наши предложения о договоре дружбы и пакте о ненападении и без промедления вернул подписанный документ. С их согласием мы стали на шаг ближе к миру в стране и мире во всём мире!"
 bftb_turkey.92.a:0 "Вы всегда будете дорогим другом государства [ROOT.GetNameDef]."
 bftb_turkey.93.t:0 "Государство [FROM.GetNameDefCap] отвергает Саадабадский пакт!"
 bftb_turkey.93.desc:0 "[FROM.GetLeader] направил [ROOT.GetLeader] многословное письмо, в котором заявил, что предложение договора дружбы и пакта о ненападении не стоит бумаги и чернил, на которых оно составлено. [FROM.GetLeader] написал, что всё, кроме официального союза между государствами [FROM.GetNameDef] и [ROOT.GetNameDef], является пустой тратой времени, и попросил в дальнейшем не втягивать его страну в какие-либо [ROOT.GetAdjective] схемы."
 bftb_turkey.93.a:0 "...можно было просто сказать «нет»."
 bftb_turkey.95.t:0 "Османские офицеры предлагают восстановить султанат"
 bftb_turkey.95.desc:0 "Мы получили предложение от единомышленников, полностью разделяющих наше мнение о важности религии в управлении [ROOT.GetAdjective] государством. Однако нам точно известно, что эти просители верны не только Всевышнему. К нам обратились бывшие офицеры и генералы Османской империи с выбором, который определит всю дальнейшую историю: они хотят вернуть султана на престол.\n\nПредложение не стало полной неожиданностью, поскольку многие министры и избиратели в частных беседах выражали сожаление о падении Османского султаната и с гордостью рассказывали о дружеской переписке с османскими беглецами за границей. Электорат, несомненно, поддержит любое наше решение, но высшее руководство расколото. Республика и достижения Мустафы Кемаля Ататюрка пользуются огромным уважением. Если мы заключим договор с этими османскими призраками, это несомненно станет смертельным ударом по республике Ататюрка."
 bftb_turkey.95.a:0 "Наша прежняя слава ждёт возвращения."
 bftb_turkey.95.b:0 "Мы верны республике и демократии!"
 bftb_turkey.97.t:0 "Государство [FROM.GetNameDefCap] требует нашего подчинения"
 bftb_turkey.97.desc:0 "Говорят, история имеет привычку повторяться циклами, но ни один достойный политолог не мог предсказать происходящее. Многие в правительстве испытывают дежавю: мы только что приняли посланника государства [FROM.GetNameDef], и [FROM.GetLeader] потребовал нашей покорности.\n\nВся ситуация попросту абсурдна! Как это могло произойти? Как турецкий народ допустил подобное? Как мы позволили поставить себя в такое положение? Ситуация странная, но угроза реальна. Нужно решить, готовы ли мы вновь противостоять [FROM.GetAdjective] угрозе, как десятилетия назад, или времена изменились настолько, что мы не осмелимся сопротивляться их непонятным мотивам и рисковать гневом."
 bftb_turkey.97.a:0 "Подлые османы переоценивают свою мощь!"
 bftb_turkey.97.b:0 "1908 год не был напрасным!"
 bftb_turkey.97.c:0 "Сопротивляться османской угрозе бесполезно."
 bftb_turkey.98.t:0 "Государство [FROM.GetNameDefCap] полагается на защиту союзников"
 bftb_turkey.98.desc:0 "[FROM.GetAdjective] сторона отказалась признать нашу власть или законность требований. Вместо этого они, словно трусы, ищут убежища в объятиях фракции [FROM.GetFactionName]. Нам предстоит решить, готовы ли мы рискнуть конфликтом с союзниками государства [FROM.GetNameDef], или победоносное возвышение придётся ещё немного отложить."
 bftb_turkey.98.a:0 "Никто не устоит перед нашей мощью!"
 bftb_turkey.98.b:0 "Нельзя допустить повторения 1913 года."
 bftb_turkey.99.t:0 "Государство [FROM.GetNameDefCap] отказывается от требований!"
 bftb_turkey.99.desc:0 "Раздражающие и прогнившие [FROM.GetAdjective] силы отказались от нелепых требований. Было бы великодушно сказать, что пересмотр решения свидетельствует о мудрости, но это означало бы приписать [FROM.GetAdjective] администрации больше заслуг, чем она когда-либо заслуживала. Между государствами [ROOT.GetNameDef] и [FROM.GetNameDef] царит мир — пока."
 bftb_turkey.99.a:0 "Мы пережили великий кризис!"
 bftb_turkey.100.t:0 "Государство [FROM.GetNameDefCap] преклоняется перед нашей мощью!"
 bftb_turkey.100.desc:0 "Мы стали на шаг ближе к возвращению былой славы, заставив беспринципное [FROM.GetAdjective] государство подчиниться и принять наши ценности. По всей стране проходят празднования великой победы."
 bftb_turkey.100.a:0 "Возможно, за Великую войну ещё удастся отомстить."
 bftb_turkey.101.t:0 "Государство [FROM.GetNameDefCap] продолжает сопротивляться"
 bftb_turkey.101.desc:0 "Злобные [FROM.GetAdjective] силы отказались преклонить колено перед всемогущим и мудрым султаном и вместо этого выбрали войну. Если [FROM.GetAdjective] сторона хочет войны, она её получит! Повторения 1913 года больше не будет!"
 bftb_turkey.101.a:0 "Аллах направляет наш меч."
 bftb_turkey.102.t:0 "Дамасский диктат"
 bftb_turkey.102.desc:0 "Властные бандиты, управляющие государством [FROM.GetNameDef], потребовали немедленно передать им Сирию под угрозой войны. Нельзя сказать, что решение [FROM.GetAdjective] стервятников стало неожиданностью, но положение от этого не менее опасно.\n\nНам предстоит решить, готовы ли мы отдать землю [FROM.GetAdjective] стороне в надежде избежать войны или попытаться навсегда вернуть государство [FROM.GetNameDef] на страницы истории, где ему и следовало остаться."
 bftb_turkey.102.a:0 "Эта земля не стоит войны."
 bftb_turkey.102.b:0 "Давно пора навсегда разрушить османскую гегемонию."
 bftb_turkey.103.t:0 "Государство [FROM.GetNameDefCap] отказывает нам!"
 bftb_turkey.103.desc:0 "Глупцы из государства [FROM.GetNameDef] отвергли совершенно разумное требование вернуть бывшую территорию законному владельцу. Нам остаётся лишь один путь — война!"
 bftb_turkey.103.a:0 "На их дерзость ответят наши ятаганы."
 bftb_turkey.104.t:0 "Наши территории вновь принадлежат нам!"
 bftb_turkey.104.desc:0 "Слабаки из государства [FROM.GetNameDef] проявили необычную мудрость и вернули нам Сирию, не вынуждая прибегать к насилию. Мы уже усердно работаем над включением территории в имперские владения и оказались на распутье.\n\nКак ни странно, в Леванте нас прежде всего помнят как империалистов и чужеземцев, несправедливо властвовавших над землями, на которые мы не имели права. Разумеется, это полная чушь, но ошибочное мнение сохраняется по сей день. В долгосрочной перспективе может быть выгоднее создать автономного имперского подданного, которого позднее можно интегрировать при необходимости. С другой стороны, мы можем сразу присоединить территорию обратно к султанату — в конце концов, это наше божественное право."
 bftb_turkey.104.a:0 "Мы объединим эялеты Дамаска и Алеппо!"
 bftb_turkey.104.b:0 "С возвращением в Империю!"
 bftb_turkey.110.t:0 "Повстанцы успешно подавлены в регионе [TUR_kurdish_state_event_target.GetName]"
 bftb_turkey.110.desc:0 "После продолжительного столкновения с сепаратистами в регионе [TUR_kurdish_state_event_target.GetName] наши вооружённые силы одержали победу. В регионе проведена серия арестов, а армия усердно восстанавливает порядок.\n\nПотери обеих сторон прискорбны, но все понимают: ради сохранения единства нации нет слишком большой жертвы. Правительство объявило общенациональный день траура в память о погибших."
 bftb_turkey.110.a:0 "Единая и неделимая республика."
 bftb_turkey.111.t:0 "Повстанцы побеждают наши силы в регионе [TUR_kurdish_state_event_target.GetName]"
 bftb_turkey.111.desc:0 "В регионе [TUR_kurdish_state_event_target.GetName] произошла ужасная катастрофа: после изнурительного боя с действующими там сепаратистами наши вооружённые силы покинули территорию.\n\nПравительственные администраторы и наблюдатели высшего командования потрясены неожиданным исходом и требуют сокрушительного ответного удара по повстанцам. [ROOT.GetLeader] публично не комментировал событие, но в частном порядке приказал военным подготовить контроперацию, чтобы отомстить за потери."
 bftb_turkey.111.a:0 "Они ещё не видели нас в последний раз."
 bftb_turkey.113.t:0 "Фундаменталисты протестуют против производства запрещённых религией товаров"
 bftb_turkey.113.desc:0 "Удовлетворение свободного рынка всегда было краеугольным камнем кемалистской политики: если существует спрос, кто-то должен обеспечить предложение. Некоторые слои населения, прежде всего религиозные, не слишком комфортно чувствуют себя в сравнительно новой потребительской культуре государства [ROOT.GetNameDef].\n\nВ ряде частей страны вспыхнули протесты против производства товаров, которые некоторые члены общества считают запрещёнными своей религией. Они никогда не уважали нашу мечту о светском государстве [FROM.GetName] и всё ещё не могут к ней привыкнуть. И всё же умиротворить толпу может быть проще, чем напрасно разжигать конфликт между гражданами."
 bftb_turkey.113.a:0 "Хорошо, мы уступим в знак уважения к их обычаям."
 bftb_turkey.113.b:0 "Наш прогресс не остановить."
 bftb_turkey.114.t:0 "Фундаменталисты мирно протестуют против политики правительства"
 bftb_turkey.114.desc:0 "Еще один день, еще один протест, проистекающий из религии нашей страны. Последняя партия протестов возникла в [TUR_fundamentalist_state.GetName] В противоположность тому, что они считают властным правительством, вмешивающимся в дела, которые им не нужно вмешиваться. Все это нелепо; Мы - правительство, наша работа - вмешиваться в дела наших граждан.\n\nПротесты прошли мирно, и мы не должны отвечать силой на их провокации. Правительственные советники составили список бессмысленных уступок, которые мы можем сделать, чтобы подавить массы. [TUR_fundamentalist_state.GetName]. Если мы обратимся к фундаменталистам, то [TUR_fundamentalist_state.GetName]Тогда фундаменталисты в остальной части страны могут подумать, что им сойдет с рук то же самое. Возможно, было бы лучше отправить в армию, чтобы продемонстрировать нашу приверженность нашим основным ценностям."
 bftb_turkey.114.a:0 "Мы можем пойти на небольшие уступки."
 bftb_turkey.114.b:0 "Разогнать непримиримых вредителей."
 bftb_turkey.115.t:0 "Фундаменталисты требуют региональной автономии"
 bftb_turkey.115.desc:0 "Напряженность в [TUR_fundamentalist_state.GetName] Между религиозными фундаменталистами и правительственными властями наконец-то наступила грань, когда фундаменталисты требуют региональной администрации и власти управлять по своим законам. Это огромная эскалация конфликта, состоящего в основном из мирных протестов и беззубой риторики.\n\nДействительно, ситуация в [TUR_fundamentalist_state.GetName] Постепенно он вышел из-под нашего контроля. Как бы болезненно это ни казалось, но если бы мы обеспечили требуемую от нас автономию, то она по крайней мере поразила бы толпу людей. [TUR_fundamentalist_state.GetName] Из нашего списка текущих проблем. С другой стороны, даже размышление о таком действии может быть воспринято некоторыми как государственная измена."
 bftb_turkey.115.a:0 "Это необходимая жертва."
 bftb_turkey.115.b:0 "Пусть спросят наших офицеров, что те думают об этих «требованиях»."
 bftb_turkey.116.t:0 "В регионе [TUR_fundamentalist_state.GetName] совершено партизанское нападение"
 bftb_turkey.116.desc:0 "Мы получили ужасную новость: один из гарнизонов в регионе [TUR_fundamentalist_state.GetName] подвергся преднамеренному и жестокому партизанскому нападению местных религиозных фундаменталистов. Обе стороны понесли значительные потери, но мятежники угрожают повторять атаки, пока мы не выведем вооружённые силы из региона.\n\nПечально, когда соотечественник убивает соотечественника из-за такой мелочи, как вера, но именно в таком положении мы оказались. Офицеры предлагают всей мощью армии нанести ответный удар и отомстить за потери. Некоторые политики, однако, считают безопаснее временно вывести войска, пока ситуация не успокоится. Решение нельзя принимать легкомысленно."
 bftb_turkey.116.a:0 "Ответить вдвое сильнее!"
 bftb_turkey.116.b:0 "Вывести солдат."
 bftb_turkey.117.t:0 "Фундаменталисты распространяют яд в регионе [TUR_fundamentalist_state.GetName]"
 bftb_turkey.117.desc:0 "Отчеты с мест показывают, что ячейки религиозных фундаменталистов проникли в мир. [TUR_fundamentalist_state.GetName] В согласованных усилиях по вербовке населения к более традиционному образу жизни, который, несомненно, стоит в решительной оппозиции нашим секуляристским идеалам. Харизматические священнослужители и лихие лидеры протеста возглавили обвинение в преобразовании населения. [TUR_fundamentalist_state.GetName] Перейти к их образу мышления, и до сих пор попытки вынудить их использовать мягкую силу не увенчались успехом.\n\nНам поставили дилемму: мы стремимся поддерживать народную волю народа, но если не будем вмешиваться более прямым путем, то почти наверняка потеряем государство для фундаменталистов. Мы снова и снова пытались просвещать население нашей страны, чтобы попытаться выстроить народную поддержку секуляризма. Тем не менее, фанатики продолжают бороться с нами зубами и ногтями на каждом шагу. Мы должны выбрать, готовы ли мы принять волю народа. [TUR_fundamentalist_state.GetName] или если наше правительство должно предпринять прямые действия, чтобы помешать целям фундаменталистов."
 bftb_turkey.117.a:0 "Не жалеть сил, чтобы остановить их."
 bftb_turkey.117.b:0 "Мы должны уступить воле народа."
 bftb_turkey.118.t:0 "Фундаменталисты полностью захватывают регион [TUR_fundamentalist_state.GetName]!"
 bftb_turkey.118.desc:0 "Катастрофа! Стало известно, что мы полностью утратили контроль над регионом [TUR_fundamentalist_state.GetName]. Партизаны-фундаменталисты скоординированно атаковали все правительственные здания и военные базы, не оставив времени организовать ответный удар, прежде чем ситуация окончательно вышла из-под контроля.\n\nЭто беспрецедентная потеря для страны: враги государства полностью захватили [ROOT.GetAdjective] суверенную территорию. Возвращение региона [TUR_fundamentalist_state.GetName] обойдётся дорого, но дорого обойдётся и отказ от него. Времени не осталось — нужно решать."
 bftb_turkey.118.a:0 "Ударить всеми силами!"
 bftb_turkey.118.b:0 "Со временем нам придётся вновь завоевать доверие народа."
 bftb_turkey.119.t:0 "Фундаменталисты региона [TUR_fundamentalist_state.GetName] уступают правительству"
 bftb_turkey.119.desc:0 "Политика открытого диалога и настойчивой работы с обществом принесла огромные плоды в регионе [TUR_fundamentalist_state.GetName]. Радикалы покинули регион после того, как местное население изгнало их, обеспечив правительству блестящую победу.\n\nЖители региона [TUR_fundamentalist_state.GetName] сохраняют религиозный характер. Однако из разговоров с общественными лидерами стало ясно, что граждане больше не считают принципы правительства несовместимыми со своей верой. В регионе [TUR_fundamentalist_state.GetName] мы видим будущее [ROOT.GetAdjective] единства."
 bftb_turkey.119.a:0 "Мы ценим ваше сотрудничество."
 bftb_turkey.126.t:0 "Государство [FROM.GetNameDefCap] предоставляет инвестиционный портфель"
 bftb_turkey.126.desc:0 "Представители государства [FROM.GetNameDef] посетили нашу страну и встретились со многими политиками, надеясь заручиться поддержкой инвестиционной программы. Правительство государства [FROM.GetNameDef] желает, чтобы мы использовали ресурсы для улучшения его промышленного потенциала и производства. [FROM.GetAdjective] чиновники намекнули, что в обмен на помощь в будущем можно ожидать военного союза между нашими странами."
 bftb_turkey.126.a:0 "Раз им нужна помощь, они её получат."
 bftb_turkey.126.b:0 "Мы не подпишем эту фаустовскую сделку."
 bftb_turkey.127.t:0 "Государство [FROM.GetNameDefCap] исключает возможность инвестиций"
 bftb_turkey.127.desc:0 "Мы получили плохие новости от [FROM.GetNameDef]Хотя, конечно, [FROM.GetAdjective] Не несите нам злой воли, нам сказали, что [FROM.GetNameDef] Мы не будем вкладывать какие-либо средства в нашу промышленную базу. Чиновники были тверды в этом вопросе, и они попросили нас не поднимать этот вопрос с ними снова в обозримом будущем."
 bftb_turkey.127.a:0 "Прискорбно, но понятно."
 bftb_turkey.128.t:0 "Государство [FROM.GetNameDefCap] делает скромную инвестицию"
 bftb_turkey.128.desc:0 "[FROM.GetAdjective] чиновники недавно сообщили, что финансируемый ими проект завершён. Наши инспекторы посетили стройку, чтобы проверить соответствие ожиданиям, и не были разочарованы.\n\nПосле завершения проекта [FROM.GetAdjective] наблюдатели отметили, что государство [FROM.GetNameDef] не против финансировать в государстве [ROOT.GetNameDef] подобные или даже более амбициозные проекты в будущем."
 bftb_turkey.128.a:0 "Они проявили необычайную доброту."
 bftb_turkey.129.t:0 "Государство [FROM.GetNameDefCap] инвестирует в нашу лёгкую промышленность"
 bftb_turkey.129.desc:0 "[FROM.GetAdjective] чиновники недавно сообщили, что финансируемый [FROM.GetAdjective] стороной промышленный проект был завершён некоторое время назад. Наши инспекторы посетили стройку, чтобы проверить соответствие ожиданиям, и не были разочарованы. Производство на новом объекте должно начаться немедленно.\n\nПосле завершения проекта [FROM.GetAdjective] наблюдатели отметили, что государство [FROM.GetNameDef] не против в будущем финансировать подобные или даже более амбициозные проекты тайного характера."
 bftb_turkey.129.a:0 "Какие прекрасные новости!"
 bftb_turkey.130.t:0 "Государство [FROM.GetNameDefCap] инвестирует в нашу военную промышленность"
 bftb_turkey.130.desc:0 "[FROM.GetAdjective] чиновники недавно сообщили, что совершенно секретный промышленный проект, который [FROM.GetAdjective] сторона финансировала некоторое время назад, завершён. Наши инспекторы посетили стройку, чтобы проверить соответствие ожиданиям, и не были разочарованы. Производство на новом объекте должно начаться немедленно.\n\nПосле завершения проекта [FROM.GetAdjective] наблюдатели отметили, что государство [FROM.GetNameDef] не против финансировать подобные проекты в будущем."
 bftb_turkey.130.a:0 "Они истинные друзья [ROOT.GetAdjective] народа."
 bftb_turkey.131.t:0 "Государство [FROM.GetNameDefCap] соглашается на раздел государства [GRE.GetNameDef]"
 bftb_turkey.131.desc:0 "Мы достигли соглашения с государством [FROM.GetNameDef] о разделе государства [GRE.GetNameDef]. Государство [FROM.GetNameDefCap] получит регионы, граничащие с Восточным Средиземноморьем и Ионическим морем, а мы заберём [GRE.GetAdjective] центральные земли у Эгейского моря. Прискорбно, что это стало необходимым, но государство [GRE.GetNameDef] не оставило нам выбора."
 bftb_turkey.131.a:0 "Да простит нас Всевышний, но государство [GRE.GetNameDef] должно быть уничтожено."
 bftb_turkey.132.t:0 "Государство [FROM.GetNameDefCap] отвергает план раздела государства [GRE.GetNameDef]!"
 bftb_turkey.132.desc:0 "Государство [FROM.GetNameDefCap] отвергло разумное предложение о разделе государства [GRE.GetNameDef], предпочтя безумную гонку за землями без учёта проживающего там населения. «Хороших» вторжений не бывает, но всё хотя бы могло пройти упорядоченно и сдержанно. Вместо этого [FROM.GetAdjective] сторона решила превратить вторжение в хаотичную гонку за захватом как можно большей территории до принуждения [GRE.GetAdjective] стороны к сдаче.\n\nМы не хотели действовать так; всё должно было пойти иначе! Наше наследие навсегда погублено!"
 bftb_turkey.132.a:0 "Гонка началась!"
 bftb_turkey.133.t:0 "Мустафа Кемаль Ататюрк заболевает"
 bftb_turkey.133.desc:0 "Вчера Мустафу Кемаля Ататюрка срочно доставили в больницу в тяжёлом состоянии после того, как он потерял сознание на яхте во время встречи со старыми друзьями. Этот случай стал последним в череде крайне тревожных признаков быстрого ухудшения его здоровья. Советники в частном порядке опасаются, что Ататюрк слишком много работает, тогда как его состояние становится непредсказуемым.\n\nНесмотря на заверения, что всё в порядке, правительство самостоятельно взяло здоровье Мустафы Кемаля Ататюрка под наблюдение и составляет список возможных мер. Если он не отойдёт от дел ради своего слабого организма, возможно, придётся принудительно отправить его в отставку, чтобы последние месяцы он провёл с семьёй."
 bftb_turkey.133.a:0 "Мы участвуем в гонке со временем."
 bftb_turkey.134.t:0 "Смерть Мустафы Кемаля Ататюрка"
 bftb_turkey.134.desc:0 "\nРеспублика скорбит.\n\nГерой войны, революционер, президент и Отец турок Мустафа Кемаль Ататюрк мирно скончался во сне.\n\nНи один мужчина или женщина не сможет достичь мифической высоты его лидерства. Однако Отец турок не хотел бы, чтобы драгоценная Республика погрузилась в хаос из-за кризиса власти.\n\nМы не ищем замену нашему Гази — никто не сможет сравниться с мессианским основателем нации, — но должны выбрать лидера, которому можно доверить продолжение пути Ататюрка. Он обязан воплощать кемалистские ценности и следовать примеру Ататюрка во главе государства [TUR.GetNameDef]."
 bftb_turkey.134.a:0 "Джеляль Баяр — очевидный кандидат."
 bftb_turkey.134.b:0 "Джеляль Баяр — очевидный кандидат."
 bftb_turkey.134.c:0 "Исмет Инёню — достойный преемник Ататюрка."
 bftb_turkey.134.d:0 "Февзи Чакмак — лидер, необходимый государству [TUR.GetNameDef]."
 bftb_turkey.134.e:0 "Февзи Чакмак обеспечит стране некоторую безопасность."
 bftb_turkey.134.f:0 "Реджеп Пекер способен объединить фашизм и кемализм."
 bftb_turkey.134.g:0 "Гений Шевкета Сюрейи Айдемира проведёт нас через испытания."
 bftb_turkey.134.h:0 "Только Исмет Инёню сможет создать уникальный [TUR.GetAdjective] социализм."
 bftb_turkey.134.i:0 "Кязым Орбай возглавит военную хунту, пока мы не найдём свой путь."
 bftb_turkey.135.t:0 "Смерть Мустафы Кемаля Ататюрка"
 bftb_turkey.135.desc:0 "\nРеспублика скорбит.\n\nГерой войны, революционер, президент и Отец турок Мустафа Кемаль Ататюрк мирно скончался во сне.\n\nДо самого конца он исполнял долг перед [TUR.GetAdjective] народом и основанной им республикой. Тысячи скорбящих простились с ним в Стамбуле, прежде чем тело перевезли в Анкару на лафете, корабле и поезде. Там состоялись государственные похороны в присутствии всего парламента и высокопоставленных гостей со всего мира.\n\nТеперь, когда отец современной турецкой нации ушёл, республика должна двигаться дальше. [ROOT.GetLeader] был одним из многих выступавших на похоронах Ататюрка и пообещал продолжить наследие человека, сыгравшего решающую роль в обеспечении свободы страны."
 bftb_turkey.135.a:0 "Покойся с миром, наш Гази. Мы никогда тебя не забудем."
 bftb_turkey.136.t:0 "Трагедия постигает османскую царскую семью!"
 bftb_turkey.136.desc:0 "Наш гордый Османский султанат охватила скорбь после известия о внезапной и неожиданной смерти султана. Султан и его сыновья посещали плодородные поля Никсара и совершали поход по горам Джаник в Самсуне, когда провинцию потрясло землетрясение. Тела османских монархов нашли через три дня, и царский двор охватила паника.\n\nПосле изменения законов о престолонаследии старшая дочь султана, похоже, стала наследницей трона. Она волевая и невероятно одарённая женщина, но многие консервативные представители религиозных учреждений могут выступить против женщины на османском престоле."
 bftb_turkey.136.a:0 "Да здравствует новая султанша!"
 bftb_turkey.136.b:0 "Женщина? Неприемлемо! Нам нужен регент!"
 bftb_turkey.137.t:0 "Государство [FROM.GetNameDefCap] принимает опасный внешнеполитический курс"
 bftb_turkey.137.desc:0 "Правительство [FROM.GetNameDef] Они выбрали новое направление своей внешней политики, которое не благоприятствует нашим внешнеполитическим схемам. Делегаты от [FROM.GetNameDef] Мы уведомили наших дипломатов о том, что они не намерены возвращаться к своему нынешнему разрушительному курсу."
 bftb_turkey.137.a:0 "Они превратились в то, что поклялись уничтожить."
 bftb_turkey.137.b:0 "Они предатели Революции!"
 bftb_turkey.137.c:0 "Возможно, они экспериментируют с социализмом в одной стране?"
 bftb_turkey.137.d:0 "Пока они не трогают наших союзников."
 bftb_turkey.137.e:0 "Очевидно, им больше нельзя доверять."
 bftb_turkey.138.t:0 "Государство [FROM.GetNameDefCap] нарушает суверенитет члена фракции!"
 bftb_turkey.138.desc:0 "Как и предсказывали наши эксперты по внешней политике, государство [FROM.GetNameDef] обратило внимание на одного из своих союзников. Мы резко осудили перед [FROM.GetAdjective] делегатом безрассудное решение его правительства, но это, похоже, не произвело впечатления."
 bftb_turkey.138.a:0 "Они получают последний шанс. Один."
 bftb_turkey.138.b:0 "Продолжение защиты этого государства-изгоя не принесёт ничего хорошего."
 bftb_turkey.139.t:0 "Государство [FROM.GetNameDefCap] вновь нарушает суверенитет члена фракции!"
 bftb_turkey.139.desc:0 "Бандиты, управляющие государством [FROM.GetNameDef], снова предали наше доверие. Мы больше не можем терпеть этот фарс: невозможно сохранять уважение союзников, одновременно укрывая враждебную страну."
 bftb_turkey.139.a:0 "Мы их предупреждали!"
 bftb_turkey.140.t:0 "Государство [FROM.GetNameDefCap] выносит предупреждение"
 bftb_turkey.140.desc:0 "[FROM.GetAdjective] правительство предупредило нас больше не нарушать суверенитет другого члена фракции. На этот раз оно готово простить наши действия. Новые шаги против союзников вынудят государство [FROM.GetNameDef] принять меры."
 bftb_turkey.140.a:0 "Мы делаем что пожелаем."
 bftb_turkey.141.t:0 "Государство [FROM.GetNameDefCap] исключает нас из фракции [FROM.GetFactionName]!"
 bftb_turkey.141.desc:0 "Наша новая внешняя политика оказалась неприемлемой для государства [FROM.GetNameDef], и оно решило, что больше не может считать нас союзником. С этого дня мы не состоим во фракции [FROM.GetFactionName]."
 bftb_turkey.141.a:0 "Пусть будет так."
 TUR_downgrade_fundamentalist_defiance_effect_tt:1 "£faction_tur_traditionalist §YТрадиционалисты§! будут активнее сотрудничать с правительством в регионе §Y[TUR_fundamentalist_state.GetName]§!."
 TUR_upgrade_fundamentalist_defiance_effect_tt:1 "£faction_tur_traditionalist §YТрадиционалисты§! усилят сопротивление правительству в регионе §Y[TUR_fundamentalist_state.GetName]§!."
 TUR_placate_fundamentalist_state_effect_tt:1 "£faction_tur_traditionalist §YТрадиционалисты§! прекратят выступления против правительства в регионе §Y[TUR_fundamentalist_state.GetName]§! и начнут призывать к активному сотрудничеству."
 TUR_placate_fundamentalist_state_all_targets_effect_tt:0 "£faction_tur_traditionalist §YТрадиционалисты§! коллективно прекратят сопротивление правительству."
 bftb_bulgaria_tsar_boris.1.t:0 "Царь Борис III посещает город [GetDestinationName]"
 bftb_bulgaria_tsar_boris.1.desc_success:1 "Сегодня царь Борис завершил визит в город [GetDestinationName], где монарх наслаждался восторгом местных жителей, собравшихся приветствовать царскую процессию на самых известных улицах города.\nНо визит предназначался не только для удовольствия простых людей: после прибытия царя в течение нескольких дней проходили роскошные банкеты, грандиозные приёмы и встречи с представителями местной элиты.\n\nВ целом визит укрепил связи с богатейшими членами общества и представил царя простому народу как доброжелательного правителя, близкого к своим подданным."
 bftb_bulgaria_tsar_boris.1.desc_extra_success:1 "Царский визит в город [GetDestinationName] завершился полным успехом! После окончания шествия к ратуше для встречи с мэром царь решил пройтись по одному из бедных районов города [GetDestinationName] и пообщаться с народом.\nЖители встретили Бориса чрезвычайно тепло. Все радовались правителю на улицах, и многие весело преподносили ему скромные подарки: цветочные венки, местные продукты, небольшие деревянные и железные изделия.\n\nНеизвестно, затронул ли искренний и простой приём что-то в душе царя. Однако на этот раз вместо закрытых приёмов и эксклюзивных садовых праздников он решил устроить большой пир для всех. Жители города [GetDestinationName] были в восторге и поздно вечером вернулись домой довольными."
 bftb_bulgaria_tsar_boris.1.desc_failure:1 "Царский визит в город [GetDestinationName] стал катастрофическим ударом по популярности монарха. С самого начала было видно, что преимущественно бедные жители, собравшиеся приветствовать процессию, не слишком радовались, а в толпе даже раздавались отдельные возгласы неодобрения.\n\nСитуация ухудшилась, когда граждане организовали массовый протест у ратуши. Тем временем монарх и его семья наслаждались пышным приёмом и роскошным банкетом в окружении наиболее привилегированных слоёв общества. Люди осудили такую расточительность и обвинили высшие классы во всех экономических и социальных проблемах последних десятилетий.\n\nПолиции приказали немедленно разогнать демонстрацию, но насилие лишь ухудшило положение, и протест перерос в беспорядки."
 bftb_bulgaria_tsar_boris.1.a:1 "Когда назначен следующий визит?"
 bftb_bulgaria_tsar_boris.1.b:1 "Вечер, который они запомнят надолго!"
 bftb_bulgaria_tsar_boris.1.c:1 "Значит, некоторое время никаких пиров."
 bftb_bulgaria_tsar_boris.2.t:0 "Смерть царя Бориса III"
 bftb_bulgaria_tsar_boris.2.desc:0 "[GetBorisDeathContext]\n[GetSuspicionsAboutBorisDeath]"
 BUL_context_of_death_basic:1 "После недели тяжёлой болезни царь Борис III умер сегодня, [?BUL.BUL_date_of_tsars_death.GetDateStringNoHourLong], в городе [BUL.Capital.GetName], предположительно от сердечной недостаточности."
 BUL_context_of_death_assassinated:0 "Несколько часов назад царь Борис III покидал Софийский университет после ежегодного Национального конгресса византиноведения, когда неизвестный быстро приблизился к царю, выхватил оружие и несколько раз выстрелил в Бориса, после чего был застрелен охраной. Через несколько минут и царь Борис III, и его убийца были мертвы."
 BUL_context_of_death_ger:0 "Вскоре после возвращения в город [BUL.Capital.GetName] с неожиданно тяжёлой встречи с [GER.GetLeader] [GetBorisGermanMeetingLocation] царь Борис III умер, предположительно от сердечной недостаточности."
 BUL_boris_german_meeting_location_historical:0 "в восточнопрусской военной ставке «Волчье логово» в Растенбурге"
 BUL_boris_german_meeting_location_capital:0 "в городе [GER.Capital.GetName]"
 BUL_context_of_death_sov:0 "После возвращения царя в город [BUL.Capital.GetName] со встречи с [SOV.GetLeader] в городе [SOV.Capital.GetName] царь Борис III умер, предположительно от сердечной недостаточности."
 BUL_context_of_death_eng:0 "Через неделю после возвращения в город [BUL.Capital.GetName] со встречи с [ENG.GetLeader] в городе [ENG.Capital.GetName] царь Борис III умер, предположительно от сердечной недостаточности."
 BUL_popular_suspicions_about_death_basic:0 "Однако причины смерти остаются неясными, и существует предположение, что Бориса отравили на последней встрече; многие считают, что это произошло по приказу [GER.GetLeader]. Другие убеждены, что царя отравил НКВД. Кто-то указывает на государство [ENG.GetNameDef], а некоторые, как ни тревожно это звучит, даже обвиняют в смерти царя само [BUL.GetAdjective] правительство."
 BUL_popular_suspicions_about_death_assassinated:0 "Служба национальной безопасности начала расследование, чтобы найти виновных в цареубийстве. Согласно официальным сообщениям, преступник имел болгарские, немецкие и английские документы, что лишь усложняет расследование и подпитывает слухи. Большинство болгар обвиняет [GER.GetLeader], НКВД или [ENG.GetAdjective] сторону, но некоторые осмеливаются утверждать, что к убийству царя причастно само правительство."
 bftb_bulgaria_tsar_boris.2.a:0 "Поистине тревожно."
 bftb_bulgaria_tsar_boris.3.t:1 "Регентский совет"
 bftb_bulgaria_tsar_boris.3.desc:1 "Пришло время назначить членов регентского совета, который будет управлять государством [ROOT.GetNameDef] от имени наследника Бориса, Симеона II.\n\nНужно выбрать наиболее подходящих кандидатов из царской семьи, высших политических и военных кругов. Следует выбирать мудро: у каждого есть собственные симпатии, а наша страна уже страдала от бедствий и разорения, вызванных решениями прежних лидеров."
 bftb_bulgaria_tsar_boris.3.a:0 "Сформировать правительство, поддерживающее Ось."
 bftb_bulgaria_tsar_boris.3.b:0 "Сформировать правительство, поддерживающее Союзников."
 bftb_bulgaria_tsar_boris.3.c:0 "Сформировать независимое правительство."
 bftb_bulgaria_factions.10.t:0 "Раскрыт заговор «Звена»"
 bftb_bulgaria_factions.10.desc:1 "Надёжные источники сообщили, что некоторые члены «Звена», ранее публично критиковавшие режим, недавно связались с несколькими офицерами. Хотя мы не знаем наверняка цели встреч и личности офицеров, несомненно, это подозрительное движение «Звена» является частью более масштабного тайного плана."
 bftb_bulgaria_factions.10.a:0 "Продолжить расследование!"
 bftb_bulgaria_factions.10.b:0 "Подождём, пока они сделают ход."
 bftb_bulgaria_factions.11.t:0 "Разоблачён заговорщик из «Звена»"
 bftb_bulgaria_factions.11.desc:1 "После тщательного расследования и обращения к нескольким верным режиму членам «Звена» мы раскрыли военный заговор с целью свержения правительства. \nВ списке причастных к заговору появилось имя одного из наших самых доверенных генералов: [?BUL_zveno_conspirator.GetName].\n\nТеперь нужно решить, что делать с этим, по всей видимости, нелояльным человеком."
 bftb_bulgaria_factions.11.a:0 "Немедленно избавиться от него!"
 bftb_bulgaria_factions.11.b:0 "Не следует делать поспешных выводов."
 bftb_bulgaria_factions.12.t:1 "Подготовка переворота «Звена»"
 bftb_bulgaria_factions.12.desc:1 "До нас дошли новости, что «Звено» наконец осмелилось завершить приготовления к военному перевороту, который давно и осторожно планировало.\nОни попытаются свергнуть правительство, как в 1934 году, но на этот раз мы не позволим им добиться успеха и раз и навсегда уничтожим эту проблемную организацию."
 bftb_bulgaria_factions.12.a:0 "Мы их раздавим!"
 bftb_bulgaria_factions.17.t:0 "«Звено» интегрировано"
 bftb_bulgaria_factions.17.desc:1 "Мы наконец интегрировали «Звено» в правительство, улучшив сотрудничество между членами бывшей организации и нашей партией. Теперь можно развивать взаимодействие в более крупных проектах, объединив некоторые из самых выдающихся умов страны."
 bftb_bulgaria_factions.17.a:1 "Немедленно заставим эти умы работать!"
 bftb_bulgaria_factions.19.t:0 "«Звено» уничтожено!"
 bftb_bulgaria_factions.19.desc:1 "В последние недели полиция искореняла остатки «Звена», уже сильно ослабленного и дезорганизованного из-за отсутствия сильного руководства после проведённых нами арестов.\nТеперь можно с уверенностью сказать, что «Звено» прекратило существование в государстве [ROOT.GetNameDef], что принесёт пользу стране и её правительству."
 bftb_bulgaria_factions.19.a:1 "Прекрасные новости!"
 bftb_bulgaria_factions.20.t:0 "Забастовки рабочих"
 bftb_bulgaria_factions.20.desc:1 "Члены фракции широких социалистов присоединились к коммунистам и разожгли общенациональные забастовки среди промышленных рабочих. Через тайные собрания и встречи они заручились значительной поддержкой и сочувствием [BUL.GetAdjective] пролетариата.\nНам следует действовать осторожно при наведении порядка в регионах, где бастующие наиболее популярны, чтобы ситуация не переросла во что-то более серьёзное, чем обычные забастовки."
 bftb_bulgaria_factions.20.a:1 "Голод в конце концов вернёт их в стадо."
 bftb_bulgaria_factions.20.b:1 "Мы должны подавить их любой ценой!"
 bftb_bulgaria_factions.21.t:0 "Беспорядки наносят сопутствующий ущерб"
 bftb_bulgaria_factions.21.desc:0 "После вмешательства наших сил против бастующих в промышленных районах распространились жестокие столкновения и беспорядки. В регионе [?BUL.BUL_damaged_civs_state.GetName] были повреждены фабрики[GetMilitaryFactoriesDamaged].[GetInfrastructureDamaged]"
 bftb_bulgaria_factions.21.a:0 "Прискорбный исход..."
 BUL_bs_strikes_no_military_factories_damaged:0 ""
 BUL_bs_strikes_military_factories_damaged_same_state:0 " в то время как несколько коммунистических групп попытались сорвать производство вооружений, саботируя военные заводы в регионе"
 BUL_bs_strikes_military_factories_damaged_other_state:0 ". В регионе [?BUL.BUL_damaged_mils_state.GetName] несколько коммунистических групп попытались сорвать производство вооружений, саботируя военные заводы"
 BUL_bs_strikes_no_infrastructure_damaged:0 ""
 BUL_bs_strikes_infrastructure_damaged:0 " Беспорядки также повредили и заблокировали дороги, железные дороги и транспортное сообщение в регионе [?BUL.BUL_damaged_infrastructure_state.GetName]."
 bftb_bulgaria_factions.27.t:0 "Широкие социалисты интегрированы"
 bftb_bulgaria_factions.27.desc:1 "Мы наконец интегрировали широких социалистов в правительство, улучшив сотрудничество между членами бывшей организации и нашей партией. Теперь можно развивать взаимодействие в более крупных проектах, объединив некоторые из самых выдающихся умов страны."
 bftb_bulgaria_factions.27.a:1 "Мы нужны друг другу, чтобы достичь величия!"
 bftb_bulgaria_factions.29.t:0 "Широкие социалисты уничтожены"
 bftb_bulgaria_factions.29.desc:1 "В последние недели полиция искореняла остатки широких социалистов, уже сильно ослабленных и дезорганизованных из-за отсутствия сильного руководства после проведённых нами арестов.\nТеперь можно с уверенностью сказать, что широкие социалисты прекратили существование в государстве [ROOT.GetNameDef], что принесёт пользу стране и её правительству."
 bftb_bulgaria_factions.29.a:1 "Это заняло некоторое время."
 bftb_bulgaria_factions.30.t:0 "Популярность аграриев растёт в сельской местности"
 bftb_bulgaria_factions.30.desc:1 "Национальный аграрный союз незаконно проводит пропагандистскую кампанию в сельских районах страны, где тысячи фермеров убеждают не доверять правительству и вступать в его ряды.\nАграрии главным образом критикуют агрессивную политику прошлого, принёсшую Болгарии разорение и унижение, и пытаются найти даже незначительное сходство с политикой нынешнего правительства, чтобы вызвать недовольство и неуверенность среди населения."
 bftb_bulgaria_factions.30.a:0 "Совершенно неприемлемо!"
 bftb_bulgaria_factions.31.t:0 "Раскол внутри Национального аграрного союза"
 bftb_bulgaria_factions.31.desc:1 "Хотя аграрии и коммунисты прежде не отличались успешным сотрудничеством, общая цель свержения правительства, похоже, смогла объединить отдельные крылья Национального аграрного союза и Коммунистической партии.\nНекоторые аграрии покинули организацию и присоединились к коммунистам. Другие, более консервативные, остаются верны борьбе против буржуазии и неприятию большевизма и пытаются найти политические пути к компромиссу с правительством."
 bftb_bulgaria_factions.31.a:1 "Назойливые крысы!"
 bftb_bulgaria_factions.37.t:0 "Национальный аграрный союз интегрирован"
 bftb_bulgaria_factions.37.desc:1 "Мы наконец интегрировали Национальный аграрный союз в правительство, улучшив сотрудничество между членами бывшей организации и нашей партией. Теперь можно развивать взаимодействие в более крупных проектах, объединив некоторые из самых выдающихся умов страны."
 bftb_bulgaria_factions.37.a:1 "Это принесёт стране значительную пользу."
 bftb_bulgaria_factions.39.t:0 "Национальный аграрный союз уничтожен"
 bftb_bulgaria_factions.39.desc:1 "В последние недели полиция искореняла остатки Национального аграрного союза, уже сильно ослабленного и дезорганизованного из-за отсутствия сильного руководства после проведённых нами арестов.\nТеперь можно с уверенностью сказать, что Национальный аграрный союз прекратил существование в государстве [ROOT.GetNameDef], что принесёт пользу стране и её правительству."
 bftb_bulgaria_factions.39.a:1 "С ними покончено навсегда!"
 bftb_bulgaria_factions.40.t:1 "Марш на город [GetMarchDestinationName]"
 bftb_bulgaria_factions.40.desc:1 "Национальное социальное движение, подражая методам Союза молодых болгарских легионов, который много лет назад таким образом повышал популярность, организовало марш из города [Root.Capital.GetName] в город [GetMarchDestinationName].\nИдя с факелами, подобно нацистам, участники требовали более жёстких мер для подавления и уничтожения подрывных большевистских групп, создания национального рабочего синдиката против классовой борьбы и более активного вмешательства государства в [BUL.GetAdjective] экономику и общество.\nПока что марш становится довольно популярным среди городской молодёжи, поэтому, если мы хотим остановить подобные выступления, лучше сделать это скорее."
 bftb_bulgaria_factions.40.a:1 "Это даже не оригинальный протест!"
 bftb_bulgaria_factions.40.b:0 "Нужно заставить их замолчать, прежде чем они станут серьёзной угрозой."
 bftb_bulgaria_factions.47.t:0 "Национальное социальное движение интегрировано"
 bftb_bulgaria_factions.47.desc:1 "Мы наконец интегрировали Национальное социальное движение в правительство, улучшив сотрудничество между членами бывшей организации и нашей партией. Теперь можно развивать взаимодействие в более крупных проектах, объединив некоторые из самых выдающихся умов страны."
 bftb_bulgaria_factions.47.a:1 "Мы продолжаем говорить, что это к лучшему."
 bftb_bulgaria_factions.49.t:0 "Национальное социальное движение уничтожено"
 bftb_bulgaria_factions.49.desc:1 "В последние недели полиция искореняла остатки Национального социального движения, уже сильно ослабленного и дезорганизованного из-за отсутствия сильного руководства после проведённых нами арестов.\nТеперь можно с уверенностью сказать, что Национальное социальное движение прекратило существование в государстве [ROOT.GetNameDef], что принесёт пользу стране и её правительству."
 bftb_bulgaria_factions.49.a:1 "Никто по ним не будет скучать!"
 bftb_bulgaria_factions.50.t:1 "Члены «Звена» подвергнуты репрессиям"
 bftb_bulgaria_factions.50.desc:1 "Мы успешно подавили организацию «Звено», арестовав членов, которые, по сообщениям, публично выступали против [ROOt.GetLeader] или даже замышляли свержение правительства."
 bftb_bulgaria_factions.50.a:1 "Они получили по заслугам."
 bftb_bulgaria_factions.51.t:1 "Члены «Звена» подвергнуты репрессиям"
 bftb_bulgaria_factions.51.desc:1 "Наши силы безопасности провели масштабную репрессивную операцию против организации «Звено». Руководитель операции утверждает, что полиции удалось задержать множество проблемных лиц во время тайного собрания организации, и считает результат чрезвычайно успешным."
 bftb_bulgaria_factions.51.a:1 "Прекрасные новости!"
 bftb_bulgaria_factions.52.t:1 "Члены «Звена» подвергнуты репрессиям"
 bftb_bulgaria_factions.52.desc:1 "К сожалению, попытка подавить организацию «Звено» провалилась. Полиция ворвалась на мероприятие, которое считала тайным собранием, где «Звено» готовило заговор против правительства. Однако, хотя члены организации там действительно присутствовали, встреча не имела отношения ни к «Звену», ни даже к политике.\nЭта полицейская акция оказалась крайне непопулярной среди [BUL.GetAdjective] населения и ещё менее популярной среди членов «Звена»."
 bftb_bulgaria_factions.52.a:1 "Как неловко."
 bftb_bulgaria_factions.53.t:1 "Операция по заключению руководителей «Звена»"
 bftb_bulgaria_factions.53.desc:1 "Операция по задержанию руководителей «Звена» завершилась успешно. Несколько влиятельных фигур, включая Кимона Георгиева, арестованы, что нанесло организации критический удар."
 bftb_bulgaria_factions.53.a:1 "Они больше не смогут доставлять неприятности!"
 bftb_bulgaria_factions.54.t:1 "Операция по заключению руководителей «Звена»"
 bftb_bulgaria_factions.54.desc:1 "Операция по задержанию руководителей «Звена» оказалась не столь успешной, как ожидалось. Хотя полиция арестовала нескольких важных лиц, лидер организации Кимон Георгиев сумел бежать и, несмотря на подпольное положение, продолжает руководить «Звеном»."
 bftb_bulgaria_factions.54.a:1 "Разочаровывающий результат."
 bftb_bulgaria_factions.55.t:1 "Операция по заключению руководителей «Звена»"
 bftb_bulgaria_factions.55.desc:1 "Операция по аресту руководителей «Звена» завершилась полным провалом. Полиция ворвалась на тайное собрание, но агенты, значительно уступавшие числом, не смогли подчинить присутствующих. Те быстро покинули место, преследуемые полицией, что привело к жестоким столкновениям на улицах города и ранениям многих невинных граждан. Столкнувшись с такой жестокостью полиции, многие местные жители прониклись сочувствием к «Звену», помогали членам организации бежать и даже вступили в бой с государственными силами."
 bftb_bulgaria_factions.55.a:1 "Кто-то должен заплатить за этот провал!"
 bftb_bulgaria_factions.60.t:1 "Широкие социалисты подвергнуты репрессиям"
 bftb_bulgaria_factions.60.desc:1 "Мы успешно подавили широких социалистов, арестовав членов, которые, по сообщениям, пытались разжигать протесты или провоцировать беспорядки среди населения."
 bftb_bulgaria_factions.60.a:1 "Они получили по заслугам."
 bftb_bulgaria_factions.61.t:1 "Широкие социалисты подвергнуты репрессиям"
 bftb_bulgaria_factions.61.desc:1 "Наши силы безопасности провели масштабную репрессивную операцию против широких социалистов. По сообщениям, полиции удалось задержать множество проблемных лиц на тайном собрании, где несколько руководителей широких социалистов встречались с представителями рабочих организаций и даже Коммунистической партии. Начальник полиции считает операцию крайне успешной."
 bftb_bulgaria_factions.61.a:1 "Прекрасные новости!"
 bftb_bulgaria_factions.62.t:1 "Широкие социалисты подвергнуты репрессиям"
 bftb_bulgaria_factions.62.desc:1 "К сожалению, попытка подавить широких социалистов провалилась. Полиция жестоко ворвалась на мероприятие, которое считала тайным собранием широких социалистов с рабочими организациями и Коммунистической партией для подготовки новых промышленных забастовок. Однако выяснилось, что собравшиеся слушали лекцию Тодора Павлова о диалектическом материализме, и грандиозная полицейская операция оказалась совершенно бесполезной.\nЭта акция была крайне непопулярна среди болгарского населения и ещё менее популярна среди широких социалистов."
 bftb_bulgaria_factions.62.a:1 "Как неловко."
 bftb_bulgaria_factions.63.t:1 "Операция по заключению руководителей широких социалистов"
 bftb_bulgaria_factions.63.desc:1 "Операция по задержанию руководителей широких социалистов завершилась успешно. Полиция арестовала большинство важных лиц, связанных с организацией, нанеся широким социалистам критический удар."
 bftb_bulgaria_factions.63.a:1 "Они больше не смогут доставлять неприятности!"
 bftb_bulgaria_factions.64.t:1 "Операция по заключению руководителей широких социалистов"
 bftb_bulgaria_factions.64.desc:1 "Операция по задержанию руководителей широких социалистов оказалась не столь успешной, как ожидалось. Хотя полиция арестовала нескольких важных лиц, некоторые руководители организации сумели бежать и, несмотря на подпольное положение, продолжают руководить широкими социалистами."
 bftb_bulgaria_factions.64.a:1 "Разочаровывающий результат."
 bftb_bulgaria_factions.65.t:1 "Операция по заключению руководителей широких социалистов"
 bftb_bulgaria_factions.65.desc:1 "Операция по аресту руководителей широких социалистов завершилась полным провалом. Полиция ворвалась на тайное собрание, однако агенты, значительно уступавшие числом, не смогли подчинить присутствующих. Те быстро разбежались и обратились за поддержкой к собратьям-пролетариям, что привело к жестоким столкновениям на улицах города и ранениям многих невинных граждан. Столкнувшись с такой жестокостью полиции, многие местные жители прониклись сочувствием к широким социалистам, помогали членам организации бежать и даже вступили в бой с государственными силами."
 bftb_bulgaria_factions.65.a:1 "Кто-то должен заплатить за этот провал!"
 bftb_bulgaria_factions.70.t:1 "Члены Аграрного союза подвергнуты репрессиям"
 bftb_bulgaria_factions.70.desc:1 "Мы успешно подавили Национальный аграрный союз, арестовав членов, которые, по сообщениям, публично выступали против правительства или пытались разжигать протесты среди населения."
 bftb_bulgaria_factions.70.a:1 "Они получили по заслугам."
 bftb_bulgaria_factions.71.t:1 "Члены Аграрного союза подвергнуты репрессиям"
 bftb_bulgaria_factions.71.desc:1 "Наши силы безопасности провели масштабную репрессивную операцию против Национального аграрного союза. Полиция ворвалась на несколько митингов союза, одновременно проходивших в разных городах Болгарии и предназначенных для разжигания беспорядков среди сельского населения. Официальные отчёты полиции называют операцию крайне успешной."
 bftb_bulgaria_factions.71.a:1 "Прекрасные новости!"
 bftb_bulgaria_factions.72.t:1 "Члены Аграрного союза подвергнуты репрессиям"
 bftb_bulgaria_factions.72.desc:1 "К сожалению, попытка подавить Национальный аграрный союз провалилась. Полиция ворвалась на мероприятие, которое считала тайным сельским митингом, где руководители союза подстрекали фермеров выступить против правительства. Однако выяснилось, что это была всего лишь лекция по книге Александра Стамболийского «Политические партии или сословные организации», и грандиозная полицейская операция оказалась совершенно бесполезной.\nЭта акция была крайне непопулярна среди болгарского населения и ещё менее популярна среди Аграрного союза."
 bftb_bulgaria_factions.72.a:1 "Как неловко."
 bftb_bulgaria_factions.73.t:1 "Операция по заключению руководителей Аграрного союза"
 bftb_bulgaria_factions.73.desc:1 "Операция по задержанию руководителей Национального аграрного союза завершилась успешно. Полиция арестовала большинство важных лиц, связанных с организацией, включая самого Николу Петкова, нанеся союзу критический удар."
 bftb_bulgaria_factions.73.a:1 "Они больше не смогут доставлять неприятности!"
 bftb_bulgaria_factions.74.t:1 "Операция по заключению руководителей Аграрного союза"
 bftb_bulgaria_factions.74.desc:1 "Операция по задержанию руководителей Национального аграрного союза оказалась не столь успешной, как ожидалось. Хотя полиция арестовала нескольких важных лиц, Никола Петков сумел бежать и, несмотря на подпольное положение, продолжает руководить организацией."
 bftb_bulgaria_factions.74.a:1 "Разочаровывающий результат."
 bftb_bulgaria_factions.75.t:1 "Операция по заключению руководителей Аграрного союза"
 bftb_bulgaria_factions.75.desc:1 "Операция по аресту руководителей Национального аграрного союза завершилась полным провалом. Полиция ворвалась на тайное собрание, однако агенты, значительно уступавшие числом, не смогли подчинить присутствующих. Те быстро покинули место и обратились за поддержкой к горожанам, что привело к жестоким столкновениям на улицах и ранениям многих невинных граждан. Столкнувшись с такой жестокостью полиции, многие местные жители прониклись сочувствием к Аграрному союзу, помогали его членам бежать и даже вступили в бой с государственными силами."
 bftb_bulgaria_factions.75.a:1 "Кто-то должен заплатить за этот провал!"
 bftb_bulgaria_factions.80.t:1 "Члены Национального социального движения подвергнуты репрессиям"
 bftb_bulgaria_factions.80.desc:1 "Мы успешно подавили Национальное социальное движение, арестовав членов, которые, по сообщениям, пытались разжигать волнения, публично произнося ненавистнические речи против отдельных организаций и даже лично против [ROOT.GetLeader]."
 bftb_bulgaria_factions.80.a:1 "Они получили по заслугам."
 bftb_bulgaria_factions.81.t:1 "Члены Национального социального движения подвергнуты репрессиям"
 bftb_bulgaria_factions.81.desc:1 "Наши силы безопасности провели масштабную репрессивную операцию против Национального социального движения. Полиция ворвалась на крупный митинг, где несколько проблемных руководителей движения произносили ненавистнические речи против [ROOT.GetLeader] и организовывали следующий марш против правительства. Большинство радикалов было задержано, а официальные отчёты называют операцию крайне успешной."
 bftb_bulgaria_factions.81.a:1 "Прекрасные новости!"
 bftb_bulgaria_factions.82.t:1 "Члены Национального социального движения подвергнуты репрессиям"
 bftb_bulgaria_factions.82.desc:1 "К сожалению, попытка подавить Национальное социальное движение провалилась. Полиция ворвалась в штаб-квартиру организации, полагая, что там проходит тайное собрание по подготовке следующего фашистского марша. Однако мероприятие оказалось обычной конференцией по текущей экономической политике, которую проводил сам Александр Цанков, и полицейская операция оказалась бесполезной.\nЭта акция была крайне непопулярна среди болгарского населения и ещё менее популярна среди Национального социального движения."
 bftb_bulgaria_factions.82.a:1 "Как неловко."
 bftb_bulgaria_factions.83.t:1 "Операция по заключению руководителей Национального социального движения"
 bftb_bulgaria_factions.83.desc:1 "Операция по задержанию руководителей Национального социального движения завершилась успешно. Полиция арестовала большинство важных лиц, связанных с организацией, включая самого Александра Цанкова, нанеся ей критический удар."
 bftb_bulgaria_factions.83.a:1 "Они больше не смогут доставлять неприятности!"
 bftb_bulgaria_factions.84.t:1 "Операция по заключению руководителей Национального социального движения"
 bftb_bulgaria_factions.84.desc:1 "Операция по задержанию руководителей Национального социального движения оказалась не столь успешной, как ожидалось. Хотя полиция арестовала нескольких важных лиц, Александр Цанков сумел бежать и, несмотря на подпольное положение, продолжает руководить организацией."
 bftb_bulgaria_factions.84.a:1 "Разочаровывающий результат."
 bftb_bulgaria_factions.85.t:1 "Операция по заключению руководителей Национального социального движения"
 bftb_bulgaria_factions.85.desc:1 "Операция по аресту руководителей Национального социального движения завершилась полным провалом. Полиция ворвалась на тайное собрание, однако агенты, значительно уступавшие числом, не смогли подчинить присутствующих. Те быстро бежали, преследуемые полицией, что привело к жестоким столкновениям на улицах города и ранениям многих невинных граждан. Столкнувшись с такой жестокостью полиции, многие местные жители прониклись сочувствием к Национальному социальному движению, помогали его членам бежать и даже вступили в бой с государственными силами."
 bftb_bulgaria_factions.85.a:1 "Кто-то должен заплатить за этот провал!"
 BUL_repress_imro_flag:0 "ВМРО подвергнута репрессиям"
 bftb_bulgaria_imro.1.t:0 "ВМРО возвращается!"
 bftb_bulgaria_imro.1.desc:0 "Надёжные источники сообщили, что члены ВМРО пересекли границу, вооружённые [BUL.GetAdjective] оружием, и организуют анти-[ROOT.GetAdjective] движение в македонских регионах."
 bftb_bulgaria_imro.1.a:0 "Совсем как в начале 1930-х."
 bftb_bulgaria_imro.2.t:0 "[BUL.GetAdjective] настроения пробуждаются в Македонии"
 bftb_bulgaria_imro.2.desc:0 "Активисты ВМРО и другие про-[BUL.GetAdjective] македонцы сейчас распространяют [BUL.GetAdjective] настроения среди населения Македонии.\nВ результате регион вновь охватила волна нестабильности и сопротивления [ROOT.GetAdjective] правительству."
 bftb_bulgaria_imro.2.a:0 "Пора снова разобраться с ВМРО."
 bftb_bulgaria_fatherland_front.1.t:1 "Отечественный фронт"
 bftb_bulgaria_fatherland_front.1.desc_positive:1 "Наконец мы можем пожинать плоды огромных усилий по объединению самых разных политических и идеологических групп в единый фронт против про-[GER.GetAdjective] милитаристской диктатуры в государстве [BUL.GetNameDef].\nМы создали Отечественный фронт, куда вошли не только Коммунистическая партия, но и бывшие члены «Звена», широкие социалисты, аграрии и другие организации. Теперь они совместно противостоят господствующей в стране буржуазии, которая без колебаний снова разорит её в поисках выгоды."
 bftb_bulgaria_fatherland_front.1.desc_negative:1 "Коммунисты и участники других организаций создали Отечественный фронт. Это движение политического сопротивления становится опасно популярным среди пролетариата и вскоре может угрожать свержением правительства."
 bftb_bulgaria_fatherland_front.1.a:1 "В единстве наша сила!"
 bftb_bulgaria_fatherland_front.1.b:1 "Очередная коммунистическая уловка, обречённая на провал."
 bftb_bulgaria_fatherland_front.2.t:1 "Отечественный фронт наносит удар!"
 bftb_bulgaria_fatherland_front.2.desc:0 "Следуя заранее согласованному плану, местные организации Отечественного фронта и вооружённые партизанские формирования сегодня захватили ратуши и районные администрации по всей стране.\nНа побережье Чёрного моря от Бургаса до Варны повстанцы почти не встретили сопротивления[GetBsFfSupport][GetBznsFfSupport][GetZvenoFfSupport][GetPartisanFfSupport]."
 bftb_bulgaria_fatherland_front.2.desc_no_support:0 ""
 bftb_bulgaria_fatherland_front.2.desc_has_bs_support:0 ", а в Пловдиве рабочий класс массово вышел на улицы в поддержку восстания и после нескольких часов уличных боёв взял регион под контроль"
 bftb_bulgaria_fatherland_front.2.desc_has_bzns_support:0 ". \nСообщается, что поддержка аграриев также стала решающей для успеха переворота в сельских районах Мёзии"
 bftb_bulgaria_fatherland_front.2.desc_has_zveno_support:0 ". \nВ Софии бывшие офицеры «Звена» заняли объекты связи и устремились к Народному собранию, заставив неподготовленные лояльные войска сдаться"
 bftb_bulgaria_fatherland_front.2.desc_has_partisan_support:0 ". \nИ наконец, группы [GetPartisanFfSupportNationalities] партизан присоединились к перевороту Отечественного фронта и оспаривают контроль над оккупированными территориями"
 bftb_bulgaria_fatherland_front.2.desc_partisans_gre:0 "греческих"
 bftb_bulgaria_fatherland_front.2.desc_partisans_yug:0 "югославских"
 bftb_bulgaria_fatherland_front.2.desc_partisans_both:0 "греческих и югославских"
 bftb_bulgaria_fatherland_front.2.a:1 "Значит, гражданская война!"
 BUL_zveno_dissidents_tt:0 "Если мы вовремя не разберёмся с фракцией [GetZvenoName], её члены в будущем могут совершить военный переворот."
 BUL_exposed_zveno_conspirator_tt:0 "Это немного отсрочит любой переворот, который может планировать фракция [GetZvenoName]."
 BUL_bs_strikes_no_violence_tt:0 "В ходе событий некоторые фабрики будут повреждены.\nВысокая поддержка §Yкоммунизма§! и высокая популярность [GetBsName] могут ухудшить ситуацию."
 bftb_bulgaria_rearmament.1.t:1 "Переговоры о [BUL.GetAdjective] перевооружении"
 bftb_bulgaria_rearmament.1.desc:1 "[BUL.GetAdjective] правительство публично изложило мирную политику, которой государство [BUL.GetNameDef] намерено придерживаться на Балканах, и теперь призывает нас обсудить отмену суровых военных ограничений, наложенных после поражения в Великой войне.\nОни утверждают, что должны немедленно начать перевооружение, чтобы создать современные вооружённые силы, способные защитить суверенитет и право [BUL.GetAdjective] народа на самоопределение."
 bftb_bulgaria_rearmament.1.a:1 "Они предлагают лишь пустые обещания."
 bftb_bulgaria_rearmament.1.b:1 "Мы потребуем официальный договор для сохранения мира."
 bftb_bulgaria_rearmament.1.c:1 "Мы должны положить конец их ограничениям!"
 bftb_bulgaria_rearmament.1_refuse_tt:0 "Государство [BUL.GetNameDefCap] пока не сможет начать перевооружение."
 bftb_bulgaria_rearmament.1_nap_tt:0 "Государство [BUL.GetNameDefCap] сможет начать перевооружение после заключения пакта о ненападении с государством [GRE.GetFlag][GRE.GetNameDefCap], [YUG.GetFlag][YUG.GetNameDefCap], [ROM.GetFlag][ROM.GetNameDefCap] или [TUR.GetFlag][TUR.GetNameDefCap]."
 bftb_bulgaria_rearmament.2.t:1 "Государство [ENG.GetNameDefCap] отказывается разрешить [ROOT.GetAdjective] перевооружение"
 bftb_bulgaria_rearmament.2.desc:1 "[ENG.GetAdjective] правительство отказалось снять какие-либо ограничения с наших вооружённых сил, по всей видимости оставаясь безразличным к растущей напряжённости в Европе и к перспективе того, что государство [ROOT.GetNameDef] беспомощно падёт перед набирающей силу державой, если хрупкое равновесие на Балканах изменится."
 bftb_bulgaria_rearmament.2.a:0 "Мы должны найти другие средства убеждения."
 bftb_bulgaria_rearmament.3.t:1 "[ENG.GetAdjective] сторона выдвигает условия для разрешения перевооружения государства [ROOT.GetNameDef]"
 bftb_bulgaria_rearmament.3.desc:1 "Прежде чем снять ограничения с наших вооружённых сил, [ENG.GetAdjective] правительство требует, чтобы государство [ROOT.GetNameDef] подписало официальный договор с одним из соседей как первый шаг к развитию дружественной дипломатии на Балканах."
 bftb_bulgaria_rearmament.3.a:1 "Ещё одно препятствие, которое нужно преодолеть."
 BUL_uk_demands_nap_with_balkan_nation_tt:1 "Национальный дух §YОграничения армии§! будет удалён после подписания §Yпакта о ненападении§! с государством [GRE.GetFlag][GRE.GetNameDefCap], [YUG.GetFlag][YUG.GetNameDefCap], [ROM.GetFlag][ROM.GetNameDefCap] или [TUR.GetFlag][TUR.GetNameDefCap]."
 bftb_bulgaria_rearmament.4.t:0 "Ограничения армии сняты"
 bftb_bulgaria_rearmament.4.desc:1 "После выполнения [ENG.GetAdjective] требований и заключения пакта о ненападении с государством [GetNapTarget] государство [ENG.GetNameDef] наконец сняло ограничения с наших вооружённых сил, и теперь перевооружение [ROOT.GetAdjective] армии может начаться."
 bftb_bulgaria_rearmament.4.a:1 "За работу!"
 BUL_nap_with_greece:0 "[GRE.GetNameDefCap]"
 BUL_nap_with_yugoslavia:0 "[YUG.GetNameDefCap]"
 BUL_nap_with_romania:0 "[ROM.GetNameDefCap]"
 BUL_nap_with_turkey:0 "[TUR.GetNameDefCap]"
 bftb_bulgaria_rearmament.5.t:1 "Ограничения [BUL.GetAdjective] армии сняты"
 bftb_bulgaria_rearmament.5.desc:1 "После выполнения [ROOT.GetAdjective] требований и заключения пакта о ненападении с государством [GetNapTarget] [BUL.GetAdjective] делегация прибыла в Лондон и готова подписать официальный договор, который позволит государству [BUL.GetNameDef] начать военное перевооружение."
 bftb_bulgaria_rearmament.5.a:1 "Давайте покончим с этим."
 bftb_bulgaria_rearmament.6.t:0 "Государство [ENG.GetNameDefCap] снимает ограничения с нашей армии"
 bftb_bulgaria_rearmament.6.desc:1 "После трудных переговоров в Софии с делегацией государства [ENG.GetNameDef] мы подписали соглашение, по которому [ENG.GetAdjective] правительство сняло ограничения с нашей армии, и теперь государство [ROOT.GetNameDef] наконец может начать военное перевооружение."
 bftb_bulgaria_rearmament.6.a:1 "Нельзя терять время; начать перевооружение!"
 bftb_bulgaria_rearmament.7.t:0 "Государство [BUL.GetNameDefCap] требует снять ограничения со своей армии"
 bftb_bulgaria_rearmament.7.desc:1 "[BUL.GetAdjective] делегация прибыла в Лондон, чтобы оказать давление на [ROOT.GetAdjective] правительство и добиться снятия военных ограничений с государства [BUL.GetNameDef].\nПоскольку над Балканами вновь нависла война, они уверяют, что государство [BUL.GetNameDef] вскоре так или иначе начнёт подготовку к защите своей территориальной целостности."
 bftb_bulgaria_rearmament.7.a:1 "Мы не поддадимся угрозам!"
 bftb_bulgaria_rearmament.7.b:1 "Иного выхода нет. Снять ограничения!"
 bftb_bulgaria_rearmament.8.t:1 "Государство [ENG.GetNameDefCap] не поддаётся нашему давлению"
 bftb_bulgaria_rearmament.8.desc:1 "[ROOT.GetAdjective] делегация, направленная в Лондон, чтобы заставить [ENG.GetAdjective] правительство снять ограничения с нашей армии, вернулась с ужасными новостями: государство [ENG.GetNameDef] не уступит нашим требованиям и не позволит государству [ROOT.GetNameDef] начать перевооружение."
 bftb_bulgaria_rearmament.8.a:1 "Значит, они не оставили нам выбора."
 bftb_bulgaria_rearmament.9.t:1 "Государство [BUL.GetNameDefCap] отказывается соблюдать военные ограничения"
 bftb_bulgaria_rearmament.9.desc:1 "[BUL.GetAdjective] дипломат, лично направленный [BUL.GetLeader], прибыл в нашу страну и сообщил, что[GetReasonForNotAbiding]."
 bftb_bulgaria_rearmament.9.a:0 "Мы разберёмся с ними позднее."
 bftb_bulgaria_rearmament.9.b:0 "Они должны за это заплатить!"
 bftb_bulgaria_rearmament.9.desc_reason_war:0 ", из-за военного конфликта, в который их втянули, государство [BUL.GetNameDef] немедленно начнёт перевооружение ради сохранения национальной независимости и свободы народа"
 bftb_bulgaria_rearmament.9.desc_reason_faction:0 " теперь, когда их поддерживает фракция [BUL.GetFactionName], государство [BUL.GetNameDef] больше не будет соблюдать ограничения, наложенные на вооружённые силы"
 bftb_bulgaria_nationalization.1.t:0 "Государство [FROM.GetNameDefCap] захватывает наши дочерние предприятия"
 bftb_bulgaria_nationalization.1.desc:0 "При поддержке своих [GetTsarLoyalistOrPartyName] [GetLeaderNameIfRegencyCouncil] из государства [BUL.GetNameDef] принял новый закон, национализировавший все иностранные дочерние предприятия в стране, которые отныне принадлежат [BUL.GetAdjective] государству.\nЭта наглая атака на [ROOT.GetAdjective] интересы в государстве [BUL.GetNameDef] стала тяжёлым ударом для высших кругов, особенно промышленных магнатов, вложивших огромные средства в развитие инфраструктуры и предприятий в государстве [BUL.GetNameDef], которые были подло экспроприированы."
 bftb_bulgaria_nationalization.1.desc_tsar_loyalists:0 "верных министров"
 bftb_bulgaria_nationalization.1.desc_party_name:0 "министров из партии [BUL.GetRulingPartyLong]"
 bftb_bulgaria_nationalization.1.desc_regency_council:0 "Богдан Филов и [BUL.GetLeader]"
 bftb_bulgaria_nationalization.1.desc_regular_leader:0 "[BUL.GetLeader]"
 bftb_bulgaria_nationalization.1.a:0 "Сейчас мы ничего не можем с этим сделать."
 bftb_bulgaria_nationalization.1.b:0 "Торговое эмбарго научит их уважению!"
 bftb_bulgaria_nationalization.1.c:0 "Мы направим дипломатическую делегацию... во главе с танками!"
 bftb_bulgaria_nationalization.1.d:0 "Долой этих неблагодарных предателей!"
 bftb_bulgaria_nationalization.2.t:0 "[FROM.GetAdjective] торговое эмбарго против Болгарии"
 bftb_bulgaria_nationalization.2.desc:0 "Государство [FROM.GetNameDefCap] решило ввести эмбарго против нашей страны в ответ на [ROOT.GetAdjective] национализацию иностранных дочерних предприятий и филиалов[GetEmbargoAllies].\nНекоторые говорят, что ситуация могла перерасти во что-то гораздо худшее, но истина в том, что отрасли, связанные с импортом и экспортом товаров, серьёзно пострадали от эмбарго."
 bftb_bulgaria_nationalization.2.desc_no_allies:0 ""
 bftb_bulgaria_nationalization.2.desc_allies:0 ", которое также поддержали его союзники"
 bftb_bulgaria_nationalization.2.a:0 "Какая драматичность."
 bftb_bulgaria_nationalization.3.t:0 "Государство [FROM.GetNameDefCap] исключает нас из фракции [FROM.GetFactionName]"
 bftb_bulgaria_nationalization.3.desc:0 "[FROM.GetAdjective] правительство уступило давлению инвесторов и промышленных магнатов, потребовавших от государства [FROM.GetNameDef] ввести торговое эмбарго против государства [BUL.GetNameDef] и исключить его из фракции [FROM.GetFactionName] в ответ на [BUL.GetAdjective] национализацию иностранных дочерних предприятий.\nЭмбарго[GetEmbargoAndKickAllies] серьёзно ударит по нескольким секторам национальной экономики. Однако ещё хуже то, что теперь наша страна беззащитна перед территориальными амбициями соседей, которые несомненно вскоре воспользуются бедственным положением государства [BUL.GetNameDef]."
 bftb_bulgaria_nationalization.3.desc_no_allies:0 ""
 bftb_bulgaria_nationalization.3.desc_allies:0 ", к которому присоединились союзники государства [FROM.GetNameDef],"
 bftb_bulgaria_nationalization.3.a:0 "Этого следовало ожидать!"
 bftb_bulgaria_uranium_mining_concessions.1.t:0 "[FROM.GetAdjective] концессия на добычу урана"
 bftb_bulgaria_uranium_mining_concessions.1.desc:0 "Хорошие отношения с [FROM.GetAdjective] союзниками наконец принесли плоды: [FROM.GetAdjective] правительство предоставило нам права на разработку урановых месторождений возле города Бухово. Оно утверждает, что его технологии ещё далеки от эффективного использования этого вещества, поэтому предпочитает заключить концессионное соглашение, по которому мы будем контролировать рудники Бухово в обмен на важные товары для [BUL.GetAdjective] промышленности и сельского хозяйства.\nЭто выгодное соглашение не только даст нам новый источник урана, но и несомненно ещё больше улучшит отношения между государствами [GER.GetNameDef] и [BUL.GetNameDef]."
 bftb_bulgaria_uranium_mining_concessions.1.a:0 "Мы найдём ему хорошее применение."
 bftb_bulgarian_claims.1.t:0 "Государство [BUL.GetNameDefCap] просит признать притязания на Балканах"
 bftb_bulgarian_claims.1.desc:1 "Делегация из [BUL.GetNameDef] Мы обратились к нашему правительству с просьбой [ROOT.GetAdjective] Поддержка их претензий на Балканах и стремление тайно вести переговоры и обеспечить безопасность. [BUL.GetAdjective] территориальной экспансии в обмен на [BUL.GetAdjective] выравнивание [ROOT.GetNameDef] и вступление страны в [ROOT.GetFactionName]."
 bftb_bulgarian_claims.1.a:1 "Признать [BUL.GetAdjective] притязания."
 bftb_bulgarian_claims.1.b:1 "Мы сами решим, как проводить территориальное расширение!"
 bftb_bulgarian_claims.1.a_tt:0 "Регионы с модификатором §YПредварительно согласованное [BUL.GetAdjective] территориальное расширение§! будут переданы государству [BUL.GetNameDef], когда любой союзник по фракции установит над ними контроль, а государство [BUL.GetNameDef] вступит во фракцию [ROOT.GetFactionName]."
 bftb_bulgarian_claims.2.t:0 "Государство [GER.GetNameDefCap] признаёт наши притязания"
 bftb_bulgarian_claims.2.desc:1 "[ROOT.GetAdjective] делегация, направленная в город [FROM.Capital.GetName] для переговоров о нашем территориальном расширении на Балканах, вернулась в город [ROOT.Capital.GetName] с сообщением об успехе миссии. Она заключила тайное соглашение с [FROM.GetAdjective] стороной, по которому государство [FROM.GetNameDef] признаёт наши притязания и согласится передать государству [ROOT.GetNameDef] контроль над соответствующими территориями после нашего официального вступления во фракцию [FROM.GetFactionName], где мы возьмём на себя роль миротворцев в оккупированных балканских регионах."
 bftb_bulgarian_claims.2.a:1 "Сделку едва ли можно было улучшить!"
 bftb_bulgarian_claims.3.t:0 "Государство [GER.GetNameDefCap] отвергает наши притязания"
 bftb_bulgarian_claims.3.desc:1 "[ROOT.GetAdjective] делегация, направленная в город [FROM.Capital.GetName] для переговоров о [FROM.GetAdjective] признании наших притязаний на Балканах, вернулась в город [ROOT.Capital.GetName] с сообщением о провале миссии и неспособности заключить с государством [FROM.GetNameDef] соглашение, обеспечивающее [ROOT.GetAdjective] территориальное расширение на Балканах."
 bftb_bulgarian_claims.3.a:1 "Значит, придётся расширяться менее тонкими способами."
 bftb_bulgarian_claims.4.t:0 "Государство [GER.GetNameDefCap] передаёт [BUL.GetAdjective] стороне контроль"
 bftb_bulgarian_claims.4.desc:1 "Как и было согласовано, государство [GER.GetNameDef] приказало передать под наш контроль территории, занятые державами фракции [GER.GetFactionName] и заявленные государством [ROOT.GetNameDef]. Управлять ими будет [ROOT.GetAdjective] правительство."
 bftb_bulgarian_claims.4.a:1 "Мы забираем то, что принадлежит нам по праву!"
 bftb_bulgarian_claims.5.t:0 "[BUL.GetAdjective] оккупация одобрена"
 bftb_bulgarian_claims.5.desc:1 "Как и было согласовано, мы приказали передать под контроль государства [ROOT.GetNameDef] территории, занятые державами фракции [GER.GetFactionName] и заявленные им. Управлять ими будет [ROOT.GetAdjective] правительство."
 bftb_bulgarian_claims.5.a:1 "Это была наша часть сделки."
 bftb_bulgarian_claims.6.t:1 "Государство [GER.GetNameDefCap] разрешает [BUL.GetAdjective] оккупацию"
 bftb_bulgarian_claims.6.desc:1 "Как ранее договорились [GER.GetAdjective] и [BUL.GetAdjective] правительства, государство [GER.GetNameDef] приказало передать под контроль государства [BUL.GetNameDef] заявленные им территории, которые сейчас заняты нами. Управлять ими будет [BUL.GetAdjective] правительство."
 bftb_bulgarian_claims.6.a:1 "Эти [BUL.GetAdjective] выскочки!"
 bftb_bulgarian_claims.7.t:0 "Государство [FROM.GetNameDefCap] просит контроль над регионом [FROM.FROM.GetName]"
 bftb_bulgarian_claims.7.desc:0 "В рамках своей миротворческой роли на оккупированных балканских территориях [FROM.GetAdjective] сторона предложила передать ей административный контроль над регионом [FROM.FROM.GetName], чтобы сохранить порядок и стабильность в землях, занятых фракцией [ROOT.GetFactionName], а также высвободить [ROOT.GetAdjective] гарнизоны для усиления других фронтов."
 bftb_bulgarian_claims.7.a:0 "Согласны, наши войска нужны в другом месте!"
 bftb_bulgarian_claims.7.b:0 "[BUL.GetAdjective] территориальные амбиции безграничны!"
 bftb_bulgarian_claims.8.t:0 "Государство [FROM.GetNameDefCap] передаёт контроль над регионом [FROM.FROM.FROM.GetName]"
 bftb_bulgarian_claims.8.desc:0 "[FROM.GetAdjective] правительство согласилось предоставить государству [ROOT.GetNameDef] административный контроль над регионом [FROM.FROM.FROM.GetName]. Теперь мы возьмём на себя роль миротворцев, разместив гарнизон, способный поддерживать порядок и стабильность и защищать регион от любого вражеского наступления."
 bftb_bulgarian_claims.8.a:0 "Больше территорий для государства [BUL.GetNameDef]!"
 bftb_bulgarian_claims.9.t:0 "[FROM.GetNameDefCap] отрицать [ROOT.GetAdjective] Контроль над [FROM.FROM.FROM.GetName]"
 bftb_bulgarian_claims.9.desc:0 "[FROM.GetAdjective] правительство отказывается предоставить государству [ROOT.GetNameDef] административный контроль над регионом [FROM.FROM.FROM.GetName]. Оно утверждает, что истинная цель нашего предложения — расширить [ROOT.GetAdjective] оккупационную зону в надежде получить больше частей Балкан после победы в войне. Даже сам [FROM.GetLeader] заявил, что наши территориальные амбиции начинают его раздражать."
 bftb_bulgarian_claims.9.a:0 "Тогда, возможно, позднее."
 BUL_germany_recognizes_our_claim_tt:0 "Государство [GER.GetNameDefCap] признаёт наши притязания на регион."
 bftb_bulgaria_german_influence.1.t:0 "Государство [GER.GetNameDefCap] предлагает самолёты в дар"
 bftb_bulgaria_german_influence.1.desc:1 "[GetFirstDonation] связи между нашей страной и государством [GER.GetNameDef], Герман Геринг предлагает передать нам 12 [GER.GetAdjective] истребителей, явно стремясь сблизить государство [ROOT.GetNameDef] с фракцией [GER.GetFactionName] и приобрести сильного союзника на Балканах для защиты [GER.GetAdjective] интересов."
 bftb_bulgaria_german_influence.1.desc_first_donation:0 "Чтобы восстановить [ROOT.GetAdjective] военно-воздушные силы и укрепить"
 bftb_bulgaria_german_influence.1.desc_more_donations:0 "чтобы продолжить укреплять"
 bftb_bulgaria_german_influence.1.a:1 "Мы с радостью принимаем!"
 bftb_bulgaria_german_influence.1.b:1 "Мы вежливо отказываемся."
 bftb_bulgaria_german_influence.2.t:0 "Государство [BUL.GetNameDefCap] принимает наш дар"
 bftb_bulgaria_german_influence.2.desc:1 "[BUL.GetAdjective] высшее командование с радостью приняло предложение, а [BUL.GetLeader] лично поблагодарил нас за самолёты, заявив, что отношения между государствами [ROOT.GetNameDef] и [BUL.GetNameDef] становятся теснее, процветают и приносят взаимную пользу."
 bftb_bulgaria_german_influence.2.a:1 "Хорошо!"
 bftb_bulgaria_german_influence.3.t:1 "Государство [BUL.GetNameDefCap] отклоняет наш дар"
 bftb_bulgaria_german_influence.3.desc:1 "[BUL.GetAdjective] высшее командование вежливо отклонило предложение передать [ROOT.GetAdjective] самолёты для усиления [BUL.GetAdjective] авиации. Оно заявило, что принятие дара означало бы сближение государства [BUL.GetNameDef] с [ROOT.GetAdjective] политикой, что сейчас не отвечает интересам [BUL.GetAdjective] стороны, решившей самостоятельно восстановить свои военно-воздушные силы."
 bftb_bulgaria_german_influence.3.a:1 "Что с ними не так?"
 bftb_bulgaria_german_influence.4.t:1 "[GER.GetLeader] требует заменить Кьосеиванова"
 bftb_bulgaria_german_influence.4.desc:1 "Сегодня мы получили письмо лично от [GER.GetLeader], в котором говорится, что некомпетентность [ROOT.GetAdjective] премьер-министра Георгия Кьосеиванова лишила его всякого доверия в глазах [GER.GetAdjective] стороны и что его следует заставить уйти в отставку в пользу более подходящего кандидата.\n[GER.GetAdjective] сторона предлагает заменить Кьосеиванова Богданом Филовым — германофилом с небольшим политическим опытом, который не станет бросать вызов [GetLeaderToChallenge]."
 bftb_bulgaria_german_influence.4.desc_tsar:0 "царю"
 bftb_bulgaria_german_influence.4.desc_regency_council:0 "[ROOT.GetAdjective] Регентскому совету"
 bftb_bulgaria_german_influence.4.desc_no_tsar:0 "[BUL.GetLeader]"
 bftb_bulgaria_german_influence.4.a:1 "[GER.GetAdjective] сторона права!"
 bftb_bulgaria_german_influence.4.b:1 "Мы не поддадимся [GER.GetAdjective] прихотям!"
 bftb_bulgaria_german_influence.5.t:1 "[BUL.GetLeader] соглашается заменить Кьосеиванова"
 bftb_bulgaria_german_influence.5.desc:1 "Некомпетентность бывшего [BUL.GetAdjective] премьер-министра Георгия Кьосеиванова лишила его доверия [BUL.GetLeader], который прекрасно понял опасность этого человека и принял наше предложение заменить его более способным Богданом Филовым — германофилом с небольшим политическим опытом, не способным бросить вызов [GetLeaderToChallenge] или мешать [ROOT.GetAdjective] интересам."
 bftb_bulgaria_german_influence.5.a:1 "[BUL.GetLeader] проявил достаточную мудрость."
 bftb_bulgaria_german_influence.6.t:1 "[BUL.GetLeader] отказывается заменить Кьосеиванова"
 bftb_bulgaria_german_influence.6.desc:1 "[BUL.GetLeader] отказался заменять Георгия Кьосеиванова, заявив, что [ROOT.GetAdjective] правительство требует его отставки лишь для того, чтобы избавиться от компетентного политика, верного государству [BUL.GetNameDef], и заменить его [ROOT.GetAdjective] марионеткой, защищающей интересы [GER.GetLeader] в государстве [BUL.GetNameDef]."
 bftb_bulgaria_german_influence.6.a:1 "Единственная марионетка здесь — Георгий Кьосеиванов!"
 bftb_bulgaria_german_influence.7.t:0 "Государство [GER.GetNameDefCap] требует военный доступ"
 bftb_bulgaria_german_influence.7.desc:1 "Дипломат из [GER.GetNameDef] Прибывший в [ROOT.Capital.GetName] Сегодня мы требуем, чтобы [ROOT.GetNameDef] Предоставление военного доступа к [GER.GetAdjective] Армия.\nВоенные операции, которые должны состояться на Балканах, требуют... [GER.GetAdjective] Войска, чтобы пройти через [ROOT.GetNameDef] Для того, чтобы развернуться вдоль границы с нашими соседями, и [GER.GetLeader] Не будет счастлив узнать, что [ROOT.GetNameDef] препятствует [GER.GetAdjective] Военные усилия."
 bftb_bulgaria_german_influence.7.a:1 "Мы с радостью будем сотрудничать с [GER.GetAdjective] армией."
 bftb_bulgaria_german_influence.7.b:1 "[GER.GetLeader] придётся найти другой путь."
 bftb_bulgaria_german_influence.8.t:0 "Государство [BUL.GetNameDefCap] предоставляет нам военный доступ"
 bftb_bulgaria_german_influence.8.desc:0 "Дипломат, направленный в город [BUL.Capital.GetName] для обсуждения использования [BUL.GetAdjective] территории в качестве базы для наших войск, сообщил об успехе переговоров. [BUL.GetLeader] уже подписал соглашение, предоставляющее [ROOT.GetAdjective] армии военный доступ по всей территории государства [BUL.GetNameDef]."
 bftb_bulgaria_german_influence.8.a:0 "Всё идёт по плану."
 bftb_bulgaria_german_influence.9.t:0 "Государство [BUL.GetNameDefCap] отклоняет запрос на военный доступ"
 bftb_bulgaria_german_influence.9.desc:1 "Дипломат, которого мы отправили [BUL.Capital.GetName] вести переговоры об использовании [BUL.GetAdjective] Территория как база операций для нашей армии сообщала, что [BUL.GetLeader] Отказ в предоставлении военного доступа [ROOT.GetAdjective] Войска, опасно препятствующие нашим будущим военным операциям на Балканах. Якобы, [BUL.GetLeader] Мы верим, что выполнение каждого из наших требований повернется [BUL.GetNameDef] в просто еще один [ROOT.GetAdjective] Спутник, не позволяющий стране стать самостоятельной державой на Балканах, какой она по праву должна быть."
 bftb_bulgaria_german_influence.9.a:1 "[BUL.GetLeader] играет с огнём."
 bftb_bulgaria_italian_influence.1.t:0 "[BUL.GetAdjective] предложение о соглашении в области исследований"
 bftb_bulgaria_italian_influence.1.desc:0 "А. [BUL.GetAdjective] Сегодня в нашу столицу прибыла делегация, которая хочет встретиться с представителями [ITA.GetAdjective] Министр иностранных дел предложил подписать соглашение между нашими странами.\nДоговор, представленный [BUL.GetAdjective] Дипломаты включают в себя, среди прочего, программу военного сотрудничества, ориентированную на технологические исследования и внедрение новых экономических правил. [BUL.GetNameDef] Это обеспечит значительные преимущества для [ITA.GetAdjective] инвесторов."
 bftb_bulgaria_italian_influence.1.a:0 "Это выгодное соглашение для государства [ITA.GetNameDef]."
 bftb_bulgaria_italian_influence.1.b:0 "Мы не будем делиться технологическими достижениями с [BUL.GetAdjective] стороной!"
 bftb_bulgaria_equipment_purchases.1.t:0 "Закупить [FROM.FROM.GetAdjective] артиллерию"
 bftb_bulgaria_equipment_purchases.1.desc:0 "Чтобы заключить соглашение о покупке [FROM.FROM.GetAdjective] артиллерийских орудий, сначала нужно выбрать тип артиллерии."
 bftb_bulgaria_equipment_purchases.1.a:0 "Закупить артиллерийские орудия"
 bftb_bulgaria_equipment_purchases.1.a_tt:0 "Мы закупим §Y[?BUL_quantity_purchased_artillery]§! ед. §Yбуксируемой артиллерии§!"
 bftb_bulgaria_equipment_purchases.1.b:0 "Закупить зенитные орудия"
 bftb_bulgaria_equipment_purchases.1.b_tt:0 "Мы закупим §Y[?BUL_quantity_purchased_artillery]§! ед. §Yбуксируемой ПВО§!"
 bftb_bulgaria_equipment_purchases.1.c:0 "Закупить противотанковые орудия"
 bftb_bulgaria_equipment_purchases.1.c_tt:0 "Мы закупим §Y[?BUL_quantity_purchased_artillery]§! ед. §Yбуксируемой ПТО§!"
 bftb_bulgaria_equipment_purchases.2.t:0 "Закупить [FROM.FROM.GetAdjective] военную технику"
 bftb_bulgaria_equipment_purchases.2.desc:0 "Чтобы заключить соглашение о покупке [FROM.FROM.GetAdjective] военной техники, сначала нужно выбрать её тип."
 bftb_bulgaria_equipment_purchases.2.a:0 "Закупить моторизованную технику"
 bftb_bulgaria_equipment_purchases.2.a_tt:0 "Мы закупим §Y[?BUL_quantity_purchased_motorized]§! ед. §Yмоторизованной техники§!"
 bftb_bulgaria_equipment_purchases.2.b:0 "Закупить механизированную технику"
 bftb_bulgaria_equipment_purchases.2.b_tt:0 "Мы закупим §Y[?BUL_quantity_purchased_mechanized]§! ед. §Yмеханизированной техники§!"
 bftb_bulgaria_equipment_purchases.2.c:0 "Закупить бронеавтомобили"
 bftb_bulgaria_equipment_purchases.2.c_tt:0 "Мы закупим §Y[?BUL_quantity_purchased_armored_car]§! ед. §Yбронеавтомобилей§!"
 bftb_bulgaria_equipment_purchases.3.t:0 "Закупить [FROM.FROM.GetAdjective] бронетехнику"
 bftb_bulgaria_equipment_purchases.3.desc:0 "Чтобы заключить соглашение о покупке [FROM.FROM.GetAdjective] бронетехники, сначала нужно выбрать её тип."
 bftb_bulgaria_equipment_purchases.3.a:0 "Закупить лёгкую бронетехнику"
 bftb_bulgaria_equipment_purchases.3.a_tt:0 "Мы закупим §Y[?BUL_quantity_purchased_light_armor]§! ед. §Yлёгких танков§!"
 bftb_bulgaria_equipment_purchases.3.b:0 "Закупить среднюю бронетехнику"
 bftb_bulgaria_equipment_purchases.3.b_tt:0 "Мы закупим §Y[?BUL_quantity_purchased_medium_armor]§! ед. §Yсредних танков§!"
 bftb_bulgaria_equipment_purchases.3.c:0 "Закупить тяжёлую бронетехнику"
 bftb_bulgaria_equipment_purchases.3.c_tt:0 "Мы закупим §Y[?BUL_quantity_purchased_heavy_armor]§! ед. §Yтяжёлых танков§!"
 bftb_bulgaria_equipment_purchases.4.t:0 "Закупить [FROM.FROM.GetAdjective] самолёты"
 bftb_bulgaria_equipment_purchases.4.desc:0 "Чтобы заключить соглашение о покупке [FROM.FROM.GetAdjective] самолётов, сначала нужно выбрать их тип."
 bftb_bulgaria_equipment_purchases.4.a:0 "Закупить истребители"
 bftb_bulgaria_equipment_purchases.4.a_tt:0 "Мы закупим §Y[?BUL_quantity_purchased_fighter]§! ед. §Yистребителей§!"
 bftb_bulgaria_equipment_purchases.4.b:0 "Закупить морские бомбардировщики"
 bftb_bulgaria_equipment_purchases.4.b_tt:0 "Мы закупим §Y[?BUL_quantity_purchased_naval_bomber]§! ед. §Yморских бомбардировщиков§!"
 bftb_bulgaria_equipment_purchases.4.c:0 "Закупить тактические бомбардировщики"
 bftb_bulgaria_equipment_purchases.4.c_tt:0 "Мы закупим §Y[?BUL_quantity_purchased_tactical_bomber]§! ед. §Yтактических бомбардировщиков§!"
 bftb_bulgaria_equipment_purchases.5.t:0 "Государство [BUL.GetNameDef] желает приобрести [ROOT.GetAdjective] корабли"
 bftb_bulgaria_equipment_purchases.5.a_tt:0 "Во время строительства [BUL.GetAdjective] кораблей мы будем получать §Y1§! внерегиональную §Yфабрику§! в качестве оплаты."
 bftb_bulgaria_equipment_purchases.6.a_tt:0 "Государство [FROM.GetNameDef] построит §Y3 подводные лодки§! для [ROOT.GetAdjective] флота."
 bftb_bulgaria_equipment_purchases.6.b_tt:0 "Государство [FROM.GetNameDef] построит §Y2 эсминца§! для [ROOT.GetAdjective] флота."
 bftb_bulgaria_equipment_purchases.6.c_tt:0 "Государство [FROM.GetNameDef] построит §Yлёгкий крейсер§! для [ROOT.GetAdjective] флота."
 bftb_bulgaria_equipment_purchases.8.t:0 "Строительство кораблей завершено — подводные лодки"
 bftb_bulgaria_equipment_purchases.8.desc:0 "После почти года строительства три заказанные нами [FROM.GetAdjective] подводные лодки прошли несколько ходовых испытаний и наконец готовы официально войти в состав флота.\nКорабли стоят в [Root.GetAdjective] порту, а экипажи ожидают приказов."
 bftb_bulgaria_equipment_purchases.9.t:0 "Строительство кораблей завершено — эсминцы"
 bftb_bulgaria_equipment_purchases.9.desc:0 "После почти года строительства два заказанных нами [FROM.GetAdjective] эсминца прошли несколько ходовых испытаний и наконец готовы официально войти в состав флота.\nКорабли стоят в [Root.GetAdjective] порту, а экипажи ожидают приказов."
 bftb_bulgaria_equipment_purchases.10.t:0 "Строительство кораблей завершено — лёгкий крейсер"
 bftb_bulgaria_equipment_purchases.10.desc:0 "После почти года строительства заказанный нами [FROM.GetAdjective] лёгкий крейсер прошёл несколько ходовых испытаний и наконец готов официально войти в состав флота.\nКорабль стоит в [Root.GetAdjective] порту, а экипаж ожидает приказов."
 bftb_bulgaria_scw_volunteers.1.t:0 "[ROOT.GetAdjective] добровольцы возвращаются из Испании"
 bftb_bulgaria_scw_volunteers.1.desc:0 "Храбрые [ROOT.GetAdjective] добровольцы, отправившиеся в составе Интербригад сражаться за свободу испанского народа, возвращаются домой [GetVictoryOrDefeatRepublicans] Среди бесстрашных [ROOT.GetAdjective] воинов, вернувшихся ветеранами, находится высококвалифицированный военный лётчик Захари Захариев, награждённый за многочисленные подвиги и рекомендованный к назначению командующим болгарскими ВВС."
 bftb_bulgaria_scw_volunteers.1.desc_republicans_victorious:0 "ликуя после победы государства [FROM.GetNameDef] в гражданской войне, принёсшей испанскому народу столько страданий."
 bftb_bulgaria_scw_volunteers.1.desc_republicans_defeated:0 "оплакивая ужасное поражение государства [FROM.GetNameDef], окончательно павшего перед тиранией фашизма.\nВ любом случае,"
 bftb_bulgaria_scw_volunteers.1.a:0 "Они возвращаются героями!"
 bftb_bulgaria_scw_volunteers.1.b:0 "Они сделали всё возможное для защиты свободы."
 bftb_bulgaria_scw_volunteers.2.t:0 "[BUL.GetAdjective] добровольцы возвращаются из Испании"
 bftb_bulgaria_scw_volunteers.2.desc:0 "Храбрые [ROOT.GetAdjective] добровольцы, отправившиеся в Испанию сражаться против большевизма и анархизма, возвращаются домой [GetVictoryOrDefeatNationalists] Войска получили ценный боевой опыт, а один из командиров был награждён и повышен за выдающиеся подвиги."
 bftb_bulgaria_scw_volunteers.1.desc_nationalists_victorious:0 "как гордые победители гражданской войны в Испании. Сам [FROM.GetLeader] похвалил их участие на фронте. \nНаши"
 bftb_bulgaria_scw_volunteers.1.desc_nationalists_defeated:0 "подавленными после ужасного поражения государства [FROM.GetNameDef], которое теперь полностью покорено красными. \nВ любом случае, наши"
 bftb_bulgaria_scw_volunteers.2.a:0 "Они возвращаются настоящими ветеранами войны!"
 bftb_bulgaria_scw_volunteers.2.b:0 "Испания была лишь полигоном."
 bftb_bulgaria_soviet_influence.1.t:0 "[ROOT.GetAdjective]-[BUL.GetAdjective] договор о взаимной помощи"
 bftb_bulgaria_soviet_influence.1.desc:0 "Сегодня [GetBulgarianLeaderToMeetStalin] встретился с [ROOT.GetLeader] в городе [ROOT.Capital.GetName], чтобы обсудить [BUL.GetAdjective] предложение подписать договор о взаимной помощи. С его помощью [BUL.GetAdjective] правительство стремится укрепить связи с государством [ROOt.GetNameDef] и получить поддержку для сохранения территориальной целостности в эти бурные времена и противостояния враждебным соседям на Балканах."
 bftb_bulgaria_soviet_influence.1.desc_leader:0 "[BUL.GetLeader]"
 bftb_bulgaria_soviet_influence.1.desc_diplomat:0 "[BUL.GetAdjective] дипломаты"
 bftb_bulgaria_soviet_influence.1.a:0 "Подписание договора принесёт пользу обеим странам!"
 bftb_bulgaria_soviet_influence.1.b:0 "Этот договор не отвечает нашим интересам."
 bftb_bulgaria_soviet_influence.2.t:0 "Государство [SOV.GetNameDefCap] подписывает договор о взаимной помощи"
 bftb_bulgaria_soviet_influence.2.desc:0 "Сегодня [GetBulgarianLeaderToMeetStalin] вернулся в город [ROOT.Capital.GetName] со встречи с [SOV.GetLeader], посвящённой договору о взаимной помощи между государствами [SOV.GetNameDef] и [ROOT.GetNameDef]. После долгого обсуждения условий и мер, которые правительства должны принять для сохранения отношений, представители обеих стран подписали договор."
 bftb_bulgaria_soviet_influence.2.a:0 "Это начало плодотворных отношений!"
 bftb_bulgaria_soviet_influence.3.t:0 "Государство [SOV.GetNameDefCap] отказывается от договора о взаимной помощи"
 bftb_bulgaria_soviet_influence.3.desc:0 "Сегодня [GetBulgarianLeaderToMeetStalin] вернулся в город [ROOT.Capital.GetName] со встречи с [SOV.GetLeader], посвящённой предложению о договоре о взаимной помощи между государствами [SOV.GetNameDef] и [ROOT.GetNameDef]. После долгих переговоров убедить [SOV.GetLeader] в необходимости договора не удалось, и его подписание было категорически отвергнуто.\nПосле провала предложения в государстве [SOV.GetNameDef] [ROOT.GetLeader], похоже, уже рассматривает других возможных союзников государства [ROOT.GetNameDef]."
 bftb_bulgaria_soviet_influence.3.a:0 "Пора искать новых союзников."
 bftb_bulgaria_soviet_influence.4.t:0 "[BUL.GetLeader] требует от [ROOT.GetLeader] вступить во фракцию [BUL.GetFactionName]"
 bftb_bulgaria_soviet_influence.4.desc:0 "[BUL.GetAdjective] правительство требует объединить балканские народы в революции против фашизма, империализма и капитализма и призывает [ROOT.GetLeader] вступить во фракцию [BUL.GetFactionName], создав мощный блок сопротивления угнетательским правительствам Европы."
 bftb_bulgaria_soviet_influence.4.a:0 "Мы должны присоединиться к [BUL.GetAdjective] и [SOV.GetAdjective] братьям."
 bftb_bulgaria_soviet_influence.4.b:0 "Мы не поддадимся [BUL.GetAdjective] давлению!"
 bftb_bulgaria_soviet_influence.5.t:0 "Государство [FROM.GetNameDefCap] уступает [ROOT.GetAdjective] давлению"
 bftb_bulgaria_soviet_influence.5.desc:0 "После чрезвычайно напряжённых встреч и яростных споров с членами [FROM.GetAdjective] правительства [FROM.GetLeader] наконец уступил нашему давлению, и государство [FROM.GetNameDef] вступило во фракцию [ROOT.GetFactionName], усилив блок против фашизма, империализма и капитализма."
 bftb_bulgaria_soviet_influence.5.a:0 "Они поступили правильно."
 bftb_bulgaria_soviet_influence.6.t:0 "Государство [FROM.GetNameDefCap] отклоняет [ROOT.GetAdjective] требования"
 bftb_bulgaria_soviet_influence.6.desc:0 "[FROM.GetLeader] отказался встречаться с нашими дипломатами, направленными в государство [FROM.GetNameDef] для обсуждения необходимости сохранять союз, а не разделять силы. [FROM.GetAdjective] правительство отвергло предложение вступить в наш альянс, ясно показав, что сотрудничество между государствами [ROOT.GetNameDef] и [FROM.GetNameDef] невозможно и оставив странам фракции [ROOT.GetFactionName] мало способов решить проблему."
 bftb_bulgaria_soviet_influence.6.a:0 "Решение, которое принесёт государству [FROM.GetNameDef] лишь разрушение."
 bftb_bulgaria_yugoslavian_influence.1.t:0 "[BUL.GetAdjective] договор о вечной дружбе"
 bftb_bulgaria_yugoslavian_influence.1.desc:0 "Сегодня [GetBulgarianLeaderToMeetStalin] встретился с [ROOT.GetLeader] в городе [ROOT.Capital.GetName], чтобы обсудить [BUL.GetAdjective] предложение подписать договор о вечной дружбе. С его помощью [BUL.GetAdjective] правительство стремится похоронить прошлые споры и укрепить связи с государством [YUG.GetNameDef], надеясь со временем создать союз для сотрудничества и взаимной поддержки, если одна из сторон окажется втянута в конфликт."
 bftb_bulgaria_yugoslavian_influence.1.a:0 "Подписание договора принесёт пользу обеим странам!"
 bftb_bulgaria_yugoslavian_influence.1.b:0 "Этот договор не отвечает нашим интересам."
 bftb_bulgaria_yugoslavian_influence.2.t:0 "Государство [FROM.GetNameDefCap] подписывает договор о вечной дружбе"
 bftb_bulgaria_yugoslavian_influence.2.desc:0 "Сегодня [GetBulgarianLeaderToMeetStalin] вернулся в город [BUL.Capital.GetName] со встречи с [YUG.GetLeader] в городе [YUG.Capital.GetName], посвящённой договору о вечной дружбе между государствами [YUG.GetNameDef] и [ROOT.GetNameDef]. В конце встречи представители обеих стран подписали договор, оставив некоторые положения открытыми для будущего с общим желанием сохранить и расширить выгодные отношения."
 bftb_bulgaria_yugoslavian_influence.2.a:0 "Это укрепит обе страны!"
 bftb_bulgaria_yugoslavian_influence.3.t:0 "Государство [FROM.GetNameDefCap] отвергает наш договор о вечной дружбе"
 bftb_bulgaria_yugoslavian_influence.3.desc:0 "Сегодня [GetBulgarianLeaderToMeetStalin] вернулся в город [BUL.Capital.GetName] со встречи с [YUG.GetLeader] в городе [YUG.Capital.GetName], посвящённой договору о вечной дружбе между государствами [YUG.GetNameDef] и [ROOT.GetNameDef]. К сожалению, [YUG.GetLeader] не проявил энтузиазма к дружбе с государством [ROOT.GetNameDef] и в итоге отклонил предложение."
 bftb_bulgaria_yugoslavian_influence.3.a:0 "Какая трата времени..."
 bftb_bulgaria_balkan_federation.1.t:0 "Проект Балканской федерации"
 bftb_bulgaria_balkan_federation.1.desc:0 "Мы завершили подготовку проекта создания Балканской федерации социалистических республик. Теперь его можно представить правительствам балканских стран и начать переговоры о вступлении, прежде всего с государством [YUG.GetNameDef].\nГлавная цель федерации под руководством государства [ROOT.GetNameDef] — сотрудничество всех народов Балкан в наднациональном союзе, готовом противостоять многочисленным врагам, стремящимся подчинить балканские страны.\nНо [ROOT.GetLeader] мечтает о большем: единой Балканской федерации, где граждане больше не будут болгарами, греками или югославами, а станут свободными гражданами Балкан."
 bftb_bulgaria_balkan_federation.1.a:0 "Мечта, за которую стоит сражаться!"
 bftb_bulgaria_balkan_federation.2.t:0 "[BUL.GetAdjective] проект Балканской федерации"
 bftb_bulgaria_balkan_federation.2.desc:0 "[BUL.GetAdjective] правительство представило проект создания Балканской федерации социалистических республик, пообещав государству [ROOT.GetNameDef] честь стать первой приглашённой страной.\nГлавная цель федерации под руководством государства [ROOT.GetNameDef] — сотрудничество всех народов Балкан в наднациональном союзе, готовом противостоять многочисленным врагам, стремящимся подчинить балканские страны.\nСоциалистическая и коммунистическая пресса уже раскрыла новость, и поддержка Балканской федерации и вступления государства [ROOT.GetNameDef] начинает распространяться среди [ROOT.GetAdjective] населения."
 bftb_bulgaria_balkan_federation.2.a:0 "Амбициозный проект."
 bftb_bulgaria_balkan_federation.3.t:0 "Пропаганда Балканской федерации"
 bftb_bulgaria_balkan_federation.3.desc:0 "[BUL.GetAdjective] сторона начала в государстве [ROOT.GetNameDef] пропагандистскую кампанию, чтобы убедить [ROOT.GetAdjective] население в осуществимости своего бредового проекта Балканской федерации социалистических республик.\nЛевая пресса распространила эту идею, и многие люди, особенно промышленные рабочие в городах и фермеры в сельской местности, уже безоговорочно поддерживают [BUL.GetAdjective] предложение."
 bftb_bulgaria_balkan_federation.3.a:0 "Смелый ход государства [BUL.GetNameDef]."
 bftb_bulgaria_balkan_federation.4.t:0 "Государство [BUL.GetNameDefCap] дестабилизирует государство [ROOT.GetNameDef]"
 bftb_bulgaria_balkan_federation.4.desc:0 "[BUL.GetAdjective] активисты пересекли нашу границу, чтобы вооружить сторонников Балканской федерации в государстве [ROOT.GetNameDef] и вызвать беспорядки.\nПолиция день и ночь пытается поймать и заключить этих подрывных элементов, но пока без особого успеха. Многие [ROOT.GetAdjective] граждане, особенно представители рабочего класса, присоединились к сторонникам [BUL.GetAdjective] проекта Балканской федерации."
 bftb_bulgaria_balkan_federation.5.t:0 "Объединение Балкан"
 bftb_bulgaria_balkan_federation.5.desc:0 "[BUL.GetAdjective] правительство предложило объединить Балканы под властью централизованного правительства, чтобы улучшить взаимопонимание и сотрудничество между народами. По словам [BUL.GetLeader], это последний этап Балканской федерации, который позволит оставить конфликты прошлого и навсегда гарантировать единство и мир.\nГосударство [BUL.GetNameDefCap] ожидает ответа [ROOT.GetAdjective] правительства, чтобы приступить к объединению наших стран."
 bftb_bulgaria_balkan_federation.5.a:0 "Присоединимся к балканским братьям!"
 bftb_bulgaria_balkan_federation.5.b:0 "Попросить помощи прежде, чем соглашаться на объединение."
 bftb_bulgaria_balkan_federation.5.c:0 "Потребовать ограниченного самоуправления."
 bftb_bulgaria_balkan_federation.5.d:0 "Мы не откажемся от [ROOT.GetAdjective] независимости и самобытности!"
 bftb_bulgaria_balkan_federation.5.d_consequences_tt:0 "§RНаш отказ может заставить государство [FROM.GetNameDef] исключить нас из фракции [FROM.GetFactionName] или даже получить цель войны против нас!§!"
 bftb_bulgaria_balkan_federation.6.t:0 "Государство [FROM.GetNameDefCap] интегрировано в государство [ROOT.GetNameDef]"
 bftb_bulgaria_balkan_federation.6.desc:0 "[FROM.GetAdjective] правительство приняло предложение об объединении и вступило в Единую Балканскую федерацию. Бывшие [FROM.GetAdjective] граждане теперь станут свободными гражданами Балкан, доверившимися мечте [ROOT.GetLeader] о единстве."
 bftb_bulgaria_balkan_federation.6.a:0 "Мечта становится явью!"
 bftb_bulgaria_balkan_federation.7.t:0 "Государство [FROM.GetNameDefCap] просит промышленную помощь"
 bftb_bulgaria_balkan_federation.7.desc:0 "The [FROM.GetAdjective] Правительство согласилось присоединиться к нашей Объединенной балканской федерации. Однако, прежде чем приступить к объединению, [FROM.GetNameDef] Это требует некоторой помощи, чтобы повысить уровень своей неполноценной национальной промышленности.[FROM.GetLeader] Он заверил, что [FROM.GetNameDef] Мы с радостью присоединимся к великой Объединенной Балканской федерации после того, как будет увеличено промышленное развитие страны."
 bftb_bulgaria_balkan_federation.7.a:0 "Мы должны оказать промышленную помощь [FROM.GetAdjective]s."
 bftb_bulgaria_balkan_federation.8.t:0 "[FROM.GetNameDefCap] просит экономической помощи"
 bftb_bulgaria_balkan_federation.8.desc:0 "The [FROM.GetAdjective] Правительство согласилось присоединиться к нашей Объединенной балканской федерации. Однако, прежде чем приступить к объединению, [FROM.GetNameDef] Она отчаянно нуждается в финансовой помощи, чтобы предотвратить крах ее проблемной экономики.[FROM.GetLeader] Он заверил, что [FROM.GetNameDef] Мы будем рады присоединиться к великой Объединенной балканской федерации, как только страна получит экономический подъем и ситуация улучшится."
 bftb_bulgaria_balkan_federation.8.a:0 "Мы должны оказать экономическую помощь [FROM.GetAdjective]s."
 bftb_bulgaria_balkan_federation.9.t:0 "[FROM.GetNameDefCap] Просьбы о военной помощи"
 bftb_bulgaria_balkan_federation.9.desc:0 "The [FROM.GetAdjective] Правительство согласилось присоединиться к нашей Объединенной балканской федерации. Однако, прежде чем приступить к объединению, [FROM.GetNameDef] Для укрепления своих ненадежных вооруженных сил требуется определенная военная помощь, прежде чем проводить операцию по искоренению нескольких ячеек диссидентов в различных сельских городах вокруг. [FROM.Capital.GetName]. [FROM.GetLeader] гарантировал, что [FROM.GetNameDef] После завершения этого процесса мы с радостью присоединимся к великой Объединенной балканской федерации."
 bftb_bulgaria_balkan_federation.9.a:0 "Мы должны оказать военную помощь [FROM.GetAdjective]s."
 bftb_bulgaria_balkan_federation.10.t:0 "[FROM.GetNameDefCap] Призывы к определенным правам на самоопределение"
 bftb_bulgaria_balkan_federation.10.desc:0 "А. [FROM.GetAdjective] делегация во главе с [FROM.GetLeader] Прибывший в [ROOT.Capital.GetName] Сегодня мы обсудим условия для [FROM.GetNameDef]Вступление в Объединенную балканскую федерацию [ROOT.GetLeader]. Похоже, что это [FROM.GetAdjective] Правительство хочет сохранить некоторую независимость и права самоуправления в пределах федерации, но готово присоединиться к ней как ассоциированный член с определенной степенью автономии."
 bftb_bulgaria_balkan_federation.10.a:0 "Конечно!"
 bftb_bulgaria_balkan_federation.11.t:0 "[FROM.GetNameDefCap] Отказался от нашего предложения"
 bftb_bulgaria_balkan_federation.11.desc:0 "The [FROM.GetAdjective] Правительство отказалось присоединиться к нашей Объединённой балканской федерации, хотя оно решительно настроено сохранить союз между нашими народами.\nОднако, [FROM.GetLeader] Он публично заявил, что реакция [BUL.GetAdjective] Правительство к [FROM.GetAdjective] Отказ покажет, была ли истинной скрытой целью федерации расширение границ [BUL.GetNameDef] за пределами мыслимого, или [BUL.GetNameDef] стремится к сотрудничеству между балканскими странами независимо от условий их членства в федерации, но в любом случае [FROM.GetNameDef] Он никогда не откажется от своей независимости и культурной самобытности."
 bftb_bulgaria_balkan_federation.11.a:0 "Мы уважаем их решение."
 bftb_bulgaria_balkan_federation.11.b:0 "Как мы можем сотрудничать с правительством, которое нам не доверяет?"
 bftb_bulgaria_balkan_federation.11.c:0 "[FROM.GetLeader] Он зашел слишком далеко в своей речи!"
 bftb_bulgaria_balkan_federation.12.t:0 "[FROM.GetNameDefCap] Спрос [ROOT.GetAdjective] Территории на Балканах"
 bftb_bulgaria_balkan_federation.12.desc:0 "The [BUL.GetAdjective] Правительство направило дипломатическую миссию с требованием уступки [ROOT.GetAdjective] территории на Балканах для балканских государств, которым [BUL.GetAdjective]s, они законно принадлежат. Делегаты от [BUL.GetNameDef] Они сохранили в целом сердечный тон. Однако некоторые из наших дипломатов утверждают, что воспринимали определенные угрожающие коннотации, особенно перед лицом первоначального отказа от... [ITA.GetAdjective] Министры."
 bftb_bulgaria_balkan_federation.12.a:0 "Мы выполним их требования по сохранению мира."
 bftb_bulgaria_balkan_federation.12.a_state_transfering_tt:0 "Мы согласимся на ограниченную автономию."
 bftb_bulgaria_balkan_federation.12.b:0 "[ROOT.GetNameDef] не поддадутся, [BUL.GetAdjective] Давление!"
 bftb_bulgaria_balkan_federation.12.b_tt:0 "Это может привести к следующим последствиям:"
 bftb_bulgaria_balkan_federation.13.t:0 "[ITA.GetNameDefCap] Уступайте нашим требованиям"
 bftb_bulgaria_balkan_federation.13.desc:0 "После длительной и напряженной встречи с нашей дипломатической делегацией, направленной на переговоры по урегулированию конфликта, мы... [ITA.GetAdjective] уступка балканских территорий, [ITA.GetLeader] Он уступил место [BUL.GetAdjective] давление и официально передал контроль над [ITA.GetAdjective] Государства на Балканах, к которым они законно принадлежат."
 bftb_bulgaria_balkan_federation.13.a:0 "Мудрое решение, принятое [ITA.GetLeader]."
 bftb_bulgaria_balkan_federation.14.t:0 "[BUL.GetAdjective] Арбитраж на Балканских территориях"
 bftb_bulgaria_balkan_federation.14.desc:0 "The [BUL.GetAdjective] Правительство направило дипломатическую миссию в [ITA.GetNameDef] Требовать уступки от [ITA.GetAdjective] территории на Балканах.\nПосле долгой встречи, [ITA.GetLeader] уступить [BUL.GetAdjective] и согласилась передать контроль над [ITA.GetAdjective] государств на Балканах к государствам, к которым они законно принадлежали, что влечет за собой определенные территориальные завоевания для [ROOT.GetNameDef]."
 bftb_bulgaria_balkan_federation.14.a:0 "Мы должны поблагодарить [BUL.GetAdjective]Для этого!"
 bftb_bulgaria_balkan_federation.15.t:0 "[ITA.GetNameDefCap] Отказ от балканских территорий"
 bftb_bulgaria_balkan_federation.15.desc:0 "После долгой встречи с нашей делегацией, направленной на переговоры о уступке [ITA.GetAdjective] территории на Балканах, к которым они принадлежат на законных основаниях; [ITA.GetLeader] В конце концов, он отказался слушать [ROOT.GetAdjective] дипломатов, заявляя, что каждый участок территории занят [ITA.GetNameDef] На Балканах по праву принадлежит [ITA.GetAdjective] людей."
 bftb_bulgaria_balkan_federation.15.a:0 "Мы сами заберем эти территории!"
 bftb_bulgaria_balkan_federation.15.b:0 "Мы будем иметь дело с [ITA.GetAdjective]Позже."
 bftb_bulgaria_balkan_federation.16.t:0 "[BUL.GetNameDefCap] Требует всех [ROOT.GetAdjective] Территории на Балканах"
 bftb_bulgaria_balkan_federation.16.desc:0 "The [BUL.GetAdjective] Правительство направило дипломатическую миссию с требованием уступки [ROOT.GetAdjective] территории на Балканах, которые, согласно [BUL.GetAdjective]s, по праву принадлежит им.\nДелегаты от [BUL.GetNameDef] Как правило, они сохраняют сердечный тон. Однако некоторые из наших дипломатов утверждают, что воспринимали определенные угрожающие коннотации, особенно перед лицом первоначального отказа от... [ROOT.GetAdjective] Министры."
 bftb_bulgaria_balkan_federation.16.a:0 "Мы должны избежать начала новой балканской войны любой ценой."
 bftb_bulgaria_balkan_federation.16.b:0 "[BUL.GetLeader] Должно быть, страдает от иллюзий!"
 bftb_bulgaria_balkan_federation.17.t:0 "Государство [TUR.GetNameDefCap] передаёт балканские территории"
 bftb_bulgaria_balkan_federation.17.desc:0 "После чрезвычайно напряжённой встречи с нашей дипломатической делегацией, направленной для переговоров о передаче [TUR.GetAdjective] балканских территорий, [TUR.GetLeader] уступил [ROOT.GetAdjective] давлению и официально передал государству [ROOT.GetNameDef] контроль над [TUR.GetAdjective] регионами на Балканах."
 bftb_bulgaria_balkan_federation.17.a:0 "Мы отпразднуем это!"
 bftb_bulgaria_balkan_federation.18.t:0 "Государство [TUR.GetNameDefCap] отказывается отдать балканские территории"
 bftb_bulgaria_balkan_federation.18.desc:0 "После чрезвычайно напряженной встречи с нашей делегацией, направленной на переговоры о передаче [TUR.GetAdjective] территории на Балканах до [ROOT.GetNameDef], [TUR.GetLeader] Мы, наконец, отказались слушать наших дипломатов. [TUR.GetNameDef] Они контролируют эти территории на протяжении веков и, следовательно, [TUR.GetNameDef] является их законным собственником."
 bftb_bulgaria_balkan_federation.18.a:0 "Значит, придётся забрать их силой!"
 bftb_bulgaria_balkan_federation_project_ready_tt:0 "£GFX_trigger_yes Проект Балканской федерации готов."
 bftb_bulgaria_balkan_federation.7_tt:0 "Эффекты после завершения решения:\n"
 BUL_italy_yields_states_to_root_tt:0 "[ITA.GetFlag]§Y[ITA.GetNameDefCap]§! передаёт государству §Y[ROOT.GetNameDef]§! контроль над следующими регионами: "
 BUL_italy_yields_states_to_others_tt:0 "[ITA.GetFlag]§Y[ITA.GetNameDefCap]§! передаёт §Yдругим балканским странам§! контроль над следующими регионами: "
 bftb_bulgaria_balkan_federation_turkish_states_tt:0 "[BUL.GetFlag]§Y[BUL.GetNameDefCap]§! становится владельцем и контролирует: "
 bftb_bulgaria_fate_of_the_balkans.1.t:0 "Государство [BUL.GetNameDefCap] требует нашего вступления во фракцию [BUL.GetFactionName]"
 bftb_bulgaria_fate_of_the_balkans.1.desc:0 "Сегодня в столицу прибыл [BUL.GetAdjective] посланник, чтобы встретиться с [ROOT.GetLeader] и потребовать вступления государства [ROOT.GetNameDef] во фракцию [BUL.GetFactionName]. По словам [GetBulgarianLeader], государство [BUL.GetNameDef] будет развивать совместные программы исследований и обороны и гарантировать безопасность и суверенитет всех членов союза. Однако дипломат предупредил, что любая балканская страна, отказавшаяся вступить, будет считаться врагом."
 BUL_leader_is_tsar:0 "царь [BUL.GetLeader]"
 BUL_leader_is_regency_council:0 "болгарский Регентский совет"
 BUL_leader_is_a_politician:0 "[BUL.GetLeader]"
 bftb_bulgaria_fate_of_the_balkans.1.a:0 "Государство [ROOT.GetNameDefCap] вступит во фракцию [BUL.GetFactionName]"
 bftb_bulgaria_fate_of_the_balkans.1.b:0 "Мы не уступим пустым угрозам!"
 bftb_bulgaria_fate_of_the_balkans.2.t:0 "Государство [FROM.GetNameDefCap] соглашается вступить во фракцию [BUL.GetFactionName]"
 bftb_bulgaria_fate_of_the_balkans.2.desc:0 "Посланник, направленный убедить правительство государства [FROM.GetNameDef] вступить во фракцию [BUL.GetFactionName], вернулся сегодня из [FROM.GetAdjective] столицы с хорошими новостями: [FROM.GetLeader] согласился с нашими требованиями. Его страна наконец вступила в союз."
 bftb_bulgaria_fate_of_the_balkans.2.a:0 "Фракция [BUL.GetFactionName] растёт!"
 bftb_bulgaria_fate_of_the_balkans.3.t:0 "Государство [FROM.GetNameDefCap] отказывается вступить во фракцию [BUL.GetFactionName]"
 bftb_bulgaria_fate_of_the_balkans.3.desc:0 "Посланник, направленный потребовать вступления государства [FROM.GetNameDef] во фракцию [BUL.GetFactionName], сообщил, что [FROM.GetLeader] решил не присоединяться к союзу, очевидно не понимая судьбы, ожидающей государство [FROM.GetNameDef] за неповиновение [BUL.GetAdjective] приказам, несмотря на предупреждения дипломата."
 bftb_bulgaria_fate_of_the_balkans.3.a:0 "[FROM.GetLeader] доказал свою глупость."
 bftb_bulgaria_fate_of_the_balkans.4.t:0 "Государство [BUL.GetNameDefCap] требует регион [FROM.FROM.GetName]"
 bftb_bulgaria_fate_of_the_balkans.4.desc:0 "[BUL.GetAdjective] дипломатическая миссия[GetBulgarianLeaderDiplomaticMission] прибыла в нашу столицу для переговоров о передаче региона [FROM.FROM.GetName] государству [BUL.GetNameDef], которому он, по их словам, законно принадлежит."
 BUL_tsar_leads_diplomatic_mission:0 ", во главе с самим царём [BUL.GetLeader],"
 BUL_politician_leads_diplomatic_mission:0 ", во главе с самим [BUL.GetLeader],"
 BUL_bulgarian_government:0 ""
 bftb_bulgaria_fate_of_the_balkans.4.a:0 "Мы не можем отказать."
 bftb_bulgaria_fate_of_the_balkans.4.b:0 "Этого не произойдёт!"
 bftb_bulgaria_fate_of_the_balkans.5.t:0 "Государство [FROM.GetNameDefCap] признаёт [BUL.GetAdjective] контроль над регионом [FROM.FROM.FROM.GetName]"
 bftb_bulgaria_fate_of_the_balkans.5.desc:0 "После долгих обсуждений с [BUL.GetAdjective] дипломатической миссией, направленной в [FROM.GetAdjective] столицу, [FROM.GetLeader] согласился передать регион [FROM.FROM.FROM.GetName] государству [BUL.GetNameDef]."
 bftb_bulgaria_fate_of_the_balkans.5.a:0 "Регион [FROM.FROM.FROM.GetName] наконец вернулся туда, где ему место"
 bftb_bulgaria_fate_of_the_balkans.6.t:0 "Государство [FROM.GetNameDefCap] отказывается передать регион [FROM.FROM.FROM.GetName] государству [BUL.GetNameDef]"
 bftb_bulgaria_fate_of_the_balkans.6.desc:0 "После нескольких часов жарких споров с [BUL.GetAdjective] дипломатической миссией, направленной в [FROM.GetAdjective] столицу, [FROM.GetLeader] упрямо отказался передать регион [FROM.FROM.FROM.GetName] государству [BUL.GetNameDef]."
 bftb_bulgaria_fate_of_the_balkans.6.a:0 "Глупое решение [FROM.GetLeader]."
 bftb_bulgaria_fate_of_the_balkans.7.t:0 "Государство [BUL.GetNameDefCap] требует [ROOT.GetAdjective] подчинения"
 bftb_bulgaria_fate_of_the_balkans.7.desc:0 "Наконец [BUL.GetAdjective] правительство раскрыло истинные намерения. Оно направило делегацию с требованием признать государство [BUL.GetNameDef] сюзереном государства [ROOT.GetNameDef], что означает безоговорочное подчинение [ROOT.GetAdjective] правительства власти [GetBulgarianLeader]."
 bftb_bulgaria_fate_of_the_balkans.7.a:0 "Мы не можем отказать."
 bftb_bulgaria_fate_of_the_balkans.7.b:0 "Государство [ROOT.GetNameDefCap] никогда не подчинится иностранным державам!"
 bftb_bulgaria_fate_of_the_balkans.8.t:0 "Государство [FROM.GetNameDefCap] подчиняется государству [BUL.GetNameDef]"
 bftb_bulgaria_fate_of_the_balkans.8.desc:0 "С момента вступления государства [FROM.GetNameDef] во фракцию [BUL.GetFactionName] мы оказывали давление на его правительство, добиваясь подчинения [GetBulgarianLeader]. После недавнего подкупа и запугивания нескольких [FROM.GetAdjective] министров [FROM.GetLeader] был вынужден подписать договор, официально признающий государство [BUL.GetNameDef] своим сюзереном, и [FROM.GetAdjective] народ наконец был покорён."
 bftb_bulgaria_fate_of_the_balkans.8.a:0 "[FROM.GetAdjective] сторона знает своё место."
 bftb_bulgaria_fate_of_the_balkans.9.t:0 "Государство [FROM.GetNameDefCap] отказывается подчиниться государству [BUL.GetNameDef]"
 bftb_bulgaria_fate_of_the_balkans.9.desc:0 "Неожиданно, в [FROM.GetAdjective] Правительство решило бросить вызов [GetBulgarianLeader]. Сегодня, [FROM.GetLeader] Он публично заявил, что отказывается подчиняться [BUL.GetAdjective] правительство. Смелое решение, поддержанное большинством [FROM.GetAdjective] Люди, но безрассудные, поскольку они нуждаются в нашей защите, если их жалкое состояние состоит в том, чтобы пережить грядущие конфликты. После этого, [GetBulgarianLeader] Уже сейчас пересматривается [FROM.GetAdjective] членство в [BUL.GetFactionName]."
 bftb_bulgaria_fate_of_the_balkans.9.a:0 "Нужно продолжать давление!"
 bftb_bulgaria_fate_of_the_balkans.9.a_cooldown_tt:0 "Решение §YПодчинить государство [FROM.GetName]§! вновь станет доступно через §R365 дней§!"
 bftb_bulgaria_fate_of_the_balkans.9.b:0 "Их неповиновение не останется безнаказанным!"
 bftb_bulgaria_fate_of_the_balkans.10.t:0 "Государство [BUL.GetNameDefCap] принуждает государство [FROM.GetNameDef] вступить во фракцию [BUL.GetFactionName]"
 bftb_bulgaria_fate_of_the_balkans.10.desc:0 "После получения ультиматума от [BUL.GetAdjective] правительства [FROM.GetLeader] из государства [FROM.GetNameDef], очевидно запуганный угрозами своей стране, министрам и даже лично себе, уступил [BUL.GetAdjective] давлению и объявил, что государство [FROM.GetNameDef] немедленно покинет фракцию [ROOT.GetFactionName] и вступит во фракцию [BUL.GetFactionName]."
 bftb_bulgaria_fate_of_the_balkans.10.a:0 "Государство [BUL.GetNameDef] заплатит за это!"
 bftb_bulgaria_fate_of_the_balkans.10.b:0 "Жалкий выбор жалкого лидера."
 BUL_transferred_bulgarian_state_autonomy_desc:0 "Переданы регионы, на которые претендует государство [BUL.GetNameDef]."
 bftb_bulgaria_political_leaders.1.t:0 "Убийство Христо Лукова"
 bftb_bulgaria_political_leaders.1.desc:0 "Вчера вечером [GetLukovLeader] попал в засаду двух [GetLukovPartisans], следовавших за ним от Царского кинотеатра до дома на Артиллерийской улице, 1.\nКогда политический лидер собирался войти в дом, один из [GetLukovCriminals] выстрелил в него с близкого расстояния и ранил в плечо. Луков схватил нападавшего и прижал к стене, после чего попытался укрыться в здании, но [GetLukovSecondAssailant] выстрелила ему в спину, затем подобрала своего [GetLukovAccomplice] и скрылась через соседний двор, оставив смертельно раненого Христо Лукова у входа в дом.\n[GetLukovConclusion]"
 bftb_bulgaria_political_leaders.1.a:0 "Назначить нового лидера из рядов Союза болгарских национальных легионов."
 bftb_bulgaria_political_leaders.1.b:0 "Нам нужен человек с более радикальной идеологией... Назначить Александра Цанкова!"
 bftb_bulgaria_political_leaders.1.c:0 "Без него мир стал лучше!"
 bftb_bulgaria_political_leaders.1.d:0 "Трагедия..."
 BUL_hristo_lukov_death_leader_party:0 "Христо Луков, лидер Союза болгарских национальных легионов,"
 BUL_hristo_lukov_death_leader_country:0 "[ROOT.GetAdjective] лидер Христо Луков"
 BUL_hristo_lukov_death_partisans_communism:0 "членов боевых групп, организованных Болгарской коммунистической партией. Они"
 BUL_hristo_lukov_death_partisans_other:0 "партизан, которые, по сообщениям,"
 BUL_hristo_lukov_death_criminals_communism:0 "партизан Иван Буруджиев"
 BUL_hristo_lukov_death_criminals_other:0 "преступников"
 BUL_hristo_lukov_death_second_assailant_communism:0 "Виолета Якова, второй агент, до сих пор не замеченный жертвой,"
 BUL_hristo_lukov_death_second_assailant_other:0 "второй нападавший, не замеченный жертвой и, по словам свидетелей, являвшийся женщиной,"
 BUL_hristo_lukov_death_accomplice_communism:0 "товарища"
 BUL_hristo_lukov_death_accomplice_other:0 "сообщника"
 BUL_hristo_lukov_death_conclusion_communism:0 ""
 BUL_hristo_lukov_death_conclusion_other:0 "Служба национальной безопасности уже ищет убийц. Однако мы должны позаботиться о будущем нации и назначить нового человека вместо Христо Лукова во главе государства [ROOT.GetNameDef]."
 bftb_bulgaria_greek_influence.1.t:0 "Государство [BUL.GetNameDefCap] сближается с [GRE.GetAdjective] правительством"
 bftb_bulgaria_greek_influence.1.desc:0 "[BUL.GetAdjective] премьер-министр [BUL.GetLeader] встретился с [ROOT.GetLeader], чтобы закрепить дружественные отношения между государствами [BUL.GetNameDef] и [ROOT.GetNameDef] мирным соглашением. [BUL.GetAdjective] лидер также предложил налоговые льготы [ROOT.GetAdjective] капиталистам, желающим открыть дочерние предприятия в соседней стране."
 bftb_bulgaria_greek_influence.1.a:0 "Государства [GRE.GetNameDefCap] и [BUL.GetNameDef] отныне будут сотрудничать!"
 bftb_bulgaria_greek_influence.1.b:0 "Нельзя доверять [BUL.GetAdjective] стороне!"
 bftb_bulgaria_greek_influence.2.t:0 "Государство [FROM.GetNameDefCap] принимает наше предложение"
 bftb_bulgaria_greek_influence.2.desc:0 "[FROM.GetAdjective] лидер [FROM.GetLeader] принял предложение и готов официально оформить дружественные отношения соглашением, обеспечивающим мир между государствами [BUL.GetNameDef] и [FROM.GetNameDef]."
 bftb_bulgaria_greek_influence.2.a:0 "Государства [BUL.GetNameDefCap] и [GRE.GetNameDef] отныне будут сотрудничать!"
 bftb_bulgaria_greek_influence.3.t:0 "[FROM.GetAdjective] правительство отклоняет наше предложение"
 bftb_bulgaria_greek_influence.3.desc:0 "[FROM.GetAdjective] лидер [FROM.GetLeader] заявил, что не доверяет новой [BUL.GetAdjective] мирной политике. Поэтому он отверг предложение официально оформить дружественные отношения между государствами [FROM.GetNameDef] и [BUL.GetNameDef]."
 bftb_bulgaria_greek_influence.3.a:0 "Они слишком горды, чтобы осознать необходимость сотрудничества!"
 bftb_bulgaria_british_influence.1.t:0 "[BUL.GetAdjective] правительство ищет нашей защиты"
 bftb_bulgaria_british_influence.1.desc:0 "[BUL.GetAdjective] премьер-министр [BUL.GetLeader] прибыл в нашу страну для переговоров о соглашении с государством [ENG.GetNameDef], стремясь официально закрепить обязательство защищать [BUL.GetAdjective] территорию.\nПо словам [BUL.GetLeader], его партия желает укрепить связи с [ENG.GetAdjective] правительством, но опасается за территориальную целостность государства [BUL.GetNameDef], если отвергнет другие великие державы с угрожающими амбициями на Балканах — [GER.GetAdjective], [ITA.GetAdjective] и [SOV.GetAdjective] стороны."
 bftb_bulgaria_british_influence.1.a:0 "Мы возьмём государство [BUL.GetNameDef] под [ENG.GetAdjective] защиту."
 bftb_bulgaria_british_influence.1.b:0 "Мы согласны подписать пакт о ненападении."
 bftb_bulgaria_british_influence.1.c:0 "У нас есть более важные дела."
 bftb_bulgaria_british_influence.2.t:0 "Государство [FROM.GetNameDefCap] соглашается гарантировать [BUL.GetAdjective] независимость"
 bftb_bulgaria_british_influence.2.desc:0 "[FROM.GetAdjective] правительство согласилось подписать предложенный [BUL.GetLeader] договор, гарантируя независимость нашей страны и стремясь в будущем ещё больше улучшить отношения."
 bftb_bulgaria_british_influence.2.a:0 "Теперь мы под [ENG.GetAdjective] защитой!"
 bftb_bulgaria_british_influence.3.t:0 "Государство [FROM.GetNameDefCap] соглашается подписать пакт о ненападении"
 bftb_bulgaria_british_influence.3.desc:0 "Хотя [FROM.GetAdjective] правительство согласилось подписать договор между государствами [BUL.GetNameDef] и [FROM.GetNameDef], [FROM.GetLeader] отказался официально гарантировать независимость нашей страны, заявив, что такой шаг может иметь тяжёлые дипломатические последствия и ухудшить положение не только на Балканах, но и во всей Европе.\nОднако [FROM.GetAdjective] лидер заинтересован в развитии дружественных отношений и сотрудничества."
 bftb_bulgaria_british_influence.3.a:0 "Это начало!"
 bftb_bulgaria_british_influence.4.t:0 "Государство [ENG.GetNameDefCap] отклоняет наше предложение"
 bftb_bulgaria_british_influence.4.desc:0 "[FROM.GetAdjective] правительство показало отсутствие интереса к укреплению связей с нашей страной и отвергло предложение заключить соглашение о поддержке независимости государства [BUL.GetNameDef] и развитии сотрудничества."
 bftb_bulgaria_british_influence.4.a:0 "Проклятые британцы и их упрямство!"
 bftb_bulgaria_democratic_international_policies.1.t:0 "Государство [BUL.GetNameDefCap] гарантирует [ROOT.GetAdjective] независимость"
 bftb_bulgaria_democratic_international_policies.1.desc:0 "Сегодня [BUL.GetAdjective] правительство объявило, что государство [BUL.GetNameDef] обязано защищать территориальную целостность дружественных балканских стран от амбиций воинственных иностранных держав.\nДля этого премьер-министр [BUL.GetLeader] провозгласил обязательство государства [BUL.GetNameDef] защищать [ROOT.GetAdjective] нацию и ввести ряд мер для подготовки обороны Балкан."
 bftb_bulgaria_democratic_international_policies.1.a:0 "Очень предусмотрительно с их стороны!"
 bftb_bulgaria_democratic_international_policies.2.t:0 "[BUL.GetAdjective] промышленные инвестиции"
 bftb_bulgaria_democratic_international_policies.2.desc:0 "[BUL.GetAdjective] магнаты сделали несколько инвестиций в нашей стране, создавая дочерние предприятия для развития национальной промышленности.\nНесомненно, это часть более крупного плана [BUL.GetAdjective] правительства по усилению влияния и распространению капиталистических идей. Но пока мы можем воспользоваться небольшим промышленным ростом."
 bftb_bulgaria_democratic_international_policies.2.a:0 "Они думают, что так легко повлияют на нашу политику?"
 bftb_bulgaria_democratic_international_policies.3.t:0 "[BUL.GetAdjective] вливание капитала"
 bftb_bulgaria_democratic_international_policies.3.desc:0 "[BUL.GetAdjective] правительство оказало финансовую поддержку испытывающим трудности [ROOT.GetAdjective] компаниям для стабилизации экономических отраслей страны.\nОднако ни один министр не настолько наивен, чтобы считать это проявлением солидарности или симпатии. Очевидно, вливанием капитала [BUL.GetAdjective] правительство стремится лишь усилить контроль над нашей экономикой."
 bftb_bulgaria_democratic_international_policies.3.a:0 "Нужно быть осторожными."
 bftb_bulgaria_democratic_international_policies.4.t:0 "[BUL.GetAdjective] территориальная целостность"
 bftb_bulgaria_democratic_international_policies.4.desc:0 "Делегация государства [BUL.GetNameDef] прибыла с просьбой, чтобы [ROOT.GetLeader] признал законность [BUL.GetAdjective] правительства на бывших болгарских территориях, ныне занятых войсками Союзников, и вернул административный контроль государству [BUL.GetNameDef]."
 bftb_bulgaria_democratic_international_policies.4.a:0 "[ROOT.GetAdjective] правительство признаёт территориальную целостность Болгарии!"
 bftb_bulgaria_democratic_international_policies.4_tt:0 "§Y[BUL.GetNameWithFlag]§! становится владельцем и контролирует:"
 bftb_bulgaria_democratic_international_policies.4.b:0 "Это невозможно."
 bftb_bulgaria_democratic_international_policies.5.t:0 "Государство [ENG.GetNameDefCap] признаёт территориальную целостность Болгарии"
 bftb_bulgaria_democratic_international_policies.5.desc:0 "Наша делегация, направленная в государство [ENG.GetNameDef], вернулась после успешного обращения к [ENG.GetAdjective] правительству, которое согласилось вернуть государству [BUL.GetNameDef] административный контроль над бывшими болгарскими территориями, занятыми войсками Союзников."
 bftb_bulgaria_democratic_international_policies.5.a:0 "Наш народ ликует!"
 bftb_bulgaria_democratic_international_policies.6.t:0 "Государство [ENG.GetNameDefCap] отказывается признать [BUL.GetAdjective] территориальную целостность"
 bftb_bulgaria_democratic_international_policies.6.desc:0 "К сожалению, делегации, направленной в государство [ENG.GetNameDef], не удалось убедить [ENG.GetAdjective] правительство предоставить нам административный контроль над бывшими болгарскими территориями, занятыми войсками Союзников."
 bftb_bulgaria_democratic_international_policies.6.a:0 "Они нарушают нашу территориальную целостность!"
 bftb_bulgaria_democratic_international_policies.7.t:0 "[ENG.GetAdjective]-[BUL.GetAdjective] пакт"
 bftb_bulgaria_democratic_international_policies.7.desc:0 "[ENG.GetAdjective] правительство направило дипломатическую делегацию и сообщило, что согласилось немедленно вернуть правительству государства [BUL.GetNameDef] административный контроль над бывшими болгарскими территориями, занятыми нашими войсками.\nСтолкнувшись с этим решением и не сумев договориться с [ENG.GetAdjective] стороной, наше правительство было вынуждено отказаться от контроля над территориями ради сохранения хороших отношений с союзниками."
 bftb_bulgaria_democratic_international_policies.7.a:0 "Это оскорбление государства [ROOT.GetNameDef]"
 bftb_news.1.t:0 "[BUL.GetAdjective] правительство осуждает ВМРО"
 bftb_news.1.desc:0 "Сегодня [BUL.GetAdjective] лидер [BUL.GetLeader] выступил с официальным заявлением, в котором отверг Внутреннюю македонскую революционную организацию и публично осудил её деятельность.\n[BUL.GetAdjective] министр внутренних дел также объявил о введении пакета чрезвычайных мер, позволяющих правительству выделить больше ресурсов для активной борьбы с ВМРО и раз и навсегда искоренить эту террористическую организацию.\nПохоже, этим заявлением [BUL.GetAdjective] правительство наконец намерено покончить с одним из главных источников конфликтов и напряжённости на Балканах."
 bftb_news.1.a:0 "Давно пора!"
 bftb_news.1.b:0 "Пора уничтожить ВМРО!"
 bftb_news.1.c:0 "Похоже, дни ВМРО сочтены."
 bftb_news.2.t:0 "[BUL.GetAdjective] правительство поддерживает ВМРО"
 bftb_news.2.desc:0 "Сегодня [BUL.GetAdjective] лидер [BUL.GetLeader] публично объявил, что правительство намерено договориться с Иваном Михайловым, одним из главных руководителей Внутренней македонской революционной организации, о прекращении боевых действий между ВМРО и [BUL.GetAdjective] властями. По словам министра внутренних дел, государство [BUL.GetNameDef] должно сотрудничать с этой организацией ради освобождения многочисленных болгарских македонцев, живущих в государствах [YUG.GetNameDef] и [GRE.GetNameDef]. Это смелое заявление несомненно вновь разожжёт балканский конфликт и усилит напряжённость между великими державами, имеющими интересы в регионе..."
 bftb_news.2.a:0 "[BUL.GetAdjective] сторона играет с огнём!"
 bftb_news.2.b:0 "Мы делаем то, что лучше для государства [BUL.GetNameDef]."
 bftb_news.2.c:0 "Похоже, балканский конфликт разгорится вновь."
 bftb_news.3.t:0 "Смерть болгарского царя Бориса III"
 bftb_news.3.desc:0 "[GetBorisDeathContext]\n[GetSuspicionsAboutBorisDeath]"
 bftb_news.3.a:0 "Теперь он покоится с миром. В отличие от своей страны!"
 bftb_news.4.t:0 "Возвращение царя Фердинанда I"
 bftb_news.4.desc:0 "После смерти болгарского царя Бориса III [BUL.GetAdjective] правительство неожиданно решило встретиться с его отцом и бывшим царём Фердинандом I, предложив ему вновь возглавить страну.\nПосле долгого совещания с [GetFormerLeaderBeforeFerdinand] Фердинанд I, воинственный правитель, вынужденный отречься в пользу сына после катастрофических поражений во Второй Балканской и Великой войнах, согласился вернуться в Софию и вновь короноваться царём Болгарии."
 bftb_news.4.a:0 "Он — правитель, необходимый государству [BUL.GetNameDef]!"
 bftb_news.4.b:0 "Этот дряхлый старик вообще способен править?"
 bftb_news.4.c:0 "Неожиданный поворот событий."
 BUL_former_leader_before_ferdinand_kyoseivanov:0 "премьер-министр Георгий Кьосеиванов"
 BUL_former_leader_before_ferdinand_filov:0 "премьер-министр Богдан Филов"
 BUL_former_leader_before_ferdinand_mushanov:0 "премьер-министр Никола Мушанов"
 BUL_former_leader_before_ferdinand_lukov:0 "премьер-министр Христо Луков"
 BUL_former_leader_before_ferdinand_tsankov:0 "премьер-министр Александр Цанков"
 BUL_former_leader_before_ferdinand_generic:0 "болгарский премьер-министр"
 bftb_news.5.t:0 "Кампания болгаризации на Балканах"
 bftb_news.5.desc:0 "[BUL.GetAdjective] правительство начало масштабную кампанию «болгаризации» оккупированных балканских территорий, поощряя переселение болгар, заменяя названия городов и мест традиционными болгарскими формами и перестраивая местную администрацию по болгарскому образцу.\nЭтими мерами [BUL.GetLeader] надеется доказать болгарский характер регионов и узаконить их будущее присоединение к государству [BUL.GetNameDef]."
 bftb_news.5.a:0 "Теперь никто не сможет оспаривать [BUL.GetAdjective] суверенитет над этими территориями!"
 bftb_news.5.b:0 "Как они смеют уничтожать [THIS.GetAdjective] культуру?!"
 bftb_news.5.c:0 "Смелый ход [BUL.GetAdjective] стороны."
 bftb_news.6.t:0 "Восстановление Болгарского патриархата"
 bftb_news.6.desc:0 "При поддержке правительства Болгарский экзархат оказал давление на Константинопольского патриарха, добиваясь признания автокефалии Болгарской православной церкви.\nСтолкнувшись с такими требованиями, подкреплёнными угрозами [BUL.GetLeader], Вселенский Константинопольский патриархат был вынужден разрешить Священному синоду принять новый устав, по которому тот сможет избирать главу Болгарской церкви и тем самым спустя более семи веков восстановить Болгарский патриархат."
 bftb_news.6.a:0 "Это достижение радует всех [BUL.GetAdjective] граждан!"
 bftb_news.6.b:0 "Интересное развитие событий."
 bftb_news.7.t:0 "Третье Болгарское царство"
 bftb_news.7.desc:0 "Вчера в Софии прошёл массовый политический митинг, организованный [BUL.GetAdjective] правительством.\nВо время мероприятия, к изумлению большинства присутствующих, [BUL.GetLeader] провозгласил создание Третьего Болгарского царства и начало новой эпохи для болгарской нации.\nЗа речью последовала величественная, но торжественная церемония коронации [BUL.GetLeader] императором Болгарии, во время которой политические и военные руководители присягнули империи и её правителю."
 bftb_news.7.a:0 "Это укрепляет [BUL.GetAdjective] нацию!"
 bftb_news.7.b:0 "Похоже, [BUL.GetLeader] страдает манией величия."
 bftb_news.7.c:0 "Это действительно было необходимо?"
 bftb_news.8.t:0 "Отечественный фронт захватывает власть в Болгарии"
 bftb_news.8.desc:0 "Отечественный фронт — болгарская антифашистская политическая организация, решительно выступающая против авторитарного режима [FROM.GetLeader]. Она состоит из представителей многочисленных политических групп, но находится под сильным влиянием коммунистов и была создана для борьбы с диктаторской системой в государстве [BUL.GetNameDef].\nПосле организованного ею восстания началась жестокая гражданская война между верными [BUL.GetAdjective] правительству войсками и сторонниками Отечественного фронта.\nТеперь война завершилась: коммунисты свергли режим [FROM.GetLeader] и провозгласили Народную Республику Болгарию."
 bftb_news.8.a:0 "Великая победа [BUL.GetAdjective] народа!"
 bftb_news.8.b:0 "Тревожно."
 bftb_news.9.t:0 "Балканская федерация социалистических республик"
 bftb_news.9.desc:0 "Государство [BUL.GetNameDefCap] создало фракцию [BUL.GetFactionName] — переработанную версию проекта 1920-х годов, который в своё время не добился успеха.\nПо словам премьер-министра Болгарии [BUL.GetLeader], [BUL.GetAdjective] правительство стремится создать единый балканский фронт против иностранных держав, угрожающих региону своими территориальными амбициями.\nУдастся ли новый проект, пока неизвестно, но поддержка Балканской федерации среди населения соседних стран заметно растёт."
 bftb_news.9.a:0 "Это путь к прогрессу!"
 bftb_news.9.b:0 "Интересно."
 bftb_news.9.c:0 "Ещё одна попытка объединить Балканы, обречённая на провал."
 bftb_news.10.t:0 "Объединение Балкан"
 bftb_news.10.desc:0 "Бывшее правительство государства [BUL.GetOldNameDef] провозгласило создание государства [BUL.GetNameDef]. Оно намерено развить фракцию [BUL.GetFactionName] дальше и призывает членов союза объединиться под властью единого централизованного правительства.\nПод руководством [BUL.GetLeader] государство [BUL.GetNameDef] стремится к полному сотрудничеству балканских стран, отказу от прошлых конфликтов и единству народов Балкан."
 bftb_news.10.a:0 "Мечта становится явью!"
 bftb_news.10.b:0 "Действительно ли это нужно государству [ROOT.GetNameDef]?"
 bftb_news.10.c:0 "Действительно ли это нужно Балканам?"
 bftb_news.10.d:0 "Чушь!"
 bftb_news.11.t:0 "Государство [BUL.GetNameDefCap] сближается с государством [GER.GetNameDef]"
 bftb_news.11.desc:0 "\n[BUL.GetAdjective] правительство подписало коммерческое соглашение с несколькими [GER.GetAdjective] компаниями, чтобы укрепить связи с государством [GER.GetNameDef] и стимулировать приток иностранного капитала.\nСогласно соглашению, [GER.GetAdjective] инвесторы получат значительные правовые льготы и налоговые послабления при работе в государстве [BUL.GetNameDef]."
 bftb_news.11.a:0 "Это улучшит отношения с государством [GER.GetNameDef]!"
 bftb_news.11.b:0 "Это подтолкнёт [BUL.GetAdjective] сторону к союзу с нами!"
 bftb_news.11.c:0 "Значит, государство [BUL.GetNameDef] вступит во фракцию [ROOT.GetFactionName]?"
 bftb_news.11.d:0 "Они лишь ищут защиты [GER.GetLeader]!"
 bftb_news.12.t:0 "[ITA.GetAdjective]-[BUL.GetAdjective] обмен военными технологиями"
 bftb_news.12.desc:0 "\nПосле обращения к [GER.GetAdjective] правительству государство [BUL.GetNameDef] теперь стремится укрепить отношения с государством [ITA.GetNameDef].\n[BUL.GetLeader] и [ITA.GetLeader] подписали разработанное экспертами обеих стран соглашение об исследованиях, которое облегчит создание современной военной техники.\nВместе с соглашением [BUL.GetAdjective] правительство ввело новые экономические правила, поощряющие вложение [ITA.GetAdjective] капитала."
 bftb_news.12.a:0 "Это будет плодотворное сотрудничество!"
 bftb_news.12.b:0 "[BUL.GetAdjective] стороне ещё предстоит доказать, что она хороший союзник государства [ITA.GetNameDef]."
 bftb_news.12.c:0 "Похоже, [BUL.GetAdjective] сторона отчаянно ищет новых друзей."
 bftb_news.12.d:0 "Они заключают сделку с дьяволом."
 bftb_news.13.t:0 "[SOV.GetAdjective]-[BUL.GetAdjective] договор о взаимной помощи"
 bftb_news.13.desc:0 "\n[BUL.GetAdjective] премьер-министр [BUL.GetLeader] и [SOV.GetAdjective] лидер [SOV.GetLeader] подписали соглашение, направленное на укрепление отношений и сотрудничество в военной и экономической сферах.\nЭтим договором [BUL.GetAdjective] правительство намерено стимулировать торговлю с государством [SOV.GetNameDef] и использовать [SOV.GetAdjective] капитал для новых промышленных инвестиций."
 bftb_news.13.a:0 "Этот договор чрезвычайно выгоден государству [BUL.GetNameDef]!"
 bftb_news.13.b:0 "[SOV.GetAdjective] влияние на Балканах растёт!"
 bftb_news.13.c:0 "Значит, государство [BUL.GetNameDef] вступит во фракцию [ROOT.GetFactionName]?"
 bftb_news.13.d:0 "Они лишь ищут [SOV.GetAdjective] защиты!"
 bftb_news.14.t:0 "Договор о вечной дружбе на Балканах"
 bftb_news.14.desc:0 "В качестве первого шага к восстановлению отношений между государством [BUL.GetNameDef] и его балканскими соседями [BUL.GetAdjective] правительство подписало договор о дружбе с государством [YUG.GetNameDef]. Обе страны официально обязались развивать дружественные отношения и экономическое сотрудничество.\nНекоторые утверждают, что истинные намерения [BUL.GetAdjective] правительства выходят далеко за рамки дружбы с соседями и что его настоящая цель — создание Балканской федерации против великих европейских держав.\nНо пока эти заявления остаются лишь предположениями."
 bftb_news.14.a:0 "Это наконец принесёт Балканам стабильность!"
 bftb_news.14.b:0 "Отчаянная попытка остановить наше наступление!"
 bftb_news.15.t:0 "Салоникское соглашение"
 bftb_news.15.desc:0 "[BUL.GetAdjective] премьер-министр [BUL.GetLeader] встретился с [GRE.GetLeader] в городе [GRE.Capital.GetName] для обсуждения договора. Правительства обеих стран официально обязались поддерживать дружественные отношения и развивать экономическое сотрудничество между государствами [BUL.GetNameDef] и [GRE.GetNameDef].\nПо словам [BUL.GetLeader], это лишь первый шаг к восстановлению отношений государства [BUL.GetNameDef] с соседями, который вскоре может принести значительные плоды."
 bftb_news.16.t:0 "Государство [BUL.GetNameDefCap] сближается с государством [ENG.GetNameDef]"
 bftb_news.16.desc:0 "\nThe [BUL.GetAdjective] Правительство, стремящееся к поддержке великой державы, способной гарантировать независимость и территориальную целостность [BUL.GetNameDef]Направляем дипломатическую делегацию в [ENG.GetNameDef] Для переговоров по договору с [ENG.GetAdjective] правительство.\nВ дополнение к положениям, касающимся военных вопросов, этот договор также включает экономическое соглашение о предоставлении военной помощи. [ENG.GetAdjective] Капиталисты получают значительные налоговые льготы, когда работают в [BUL.GetNameDef]."
 bftb_news.16.a:0 "Это улучшит отношения с государством [ENG.GetNameDef]!"
 bftb_news.16.b:0 "Это подтолкнёт [BUL.GetAdjective] сторону к союзу с нами!"
 bftb_news.16.c:0 "Значит, государство [BUL.GetNameDef] вступит во фракцию [ROOT.GetFactionName]?"
 bftb_news.16.d:0 "Они лишь ищут защиты [ENG.GetLeader]!"
 bftb_news.201.t:0 "Государство [TUR.GetNameDefCap] ремилитаризует проливы"
 bftb_news.201.desc:0 "Государства [TUR.GetNameDefCap] и [SOV.GetNameDef] договорились пересмотреть Лозаннский договор, заключённый после того, как молодая Турецкая Республика отбила натиск Антанты в Войне за независимость. Договор долго считался посягательством на [TUR.GetAdjective] суверенитет, но сегодня был изменён в пользу новой Конвенции Монтрё.\n\nГосударство [TUR.GetNameDefCap] теперь полностью контролирует движение через Турецкие проливы и ремилитаризует прилегающие регионы. [ENG.GetAdjective] наблюдатели, участвовавшие в процессе, удовлетворены хотя бы тем, что удалось избежать конфликта."
 bftb_news.201.a:1 "Пусть будет так."
 bftb_news.201.b:0 "Великий день для мира."
 bftb_news.201.c:0 "Ещё один договор времён Великой войны нарушен."
 bftb_news.201.d:0 "Хорошо для государства [TUR.GetNameDef]."
 bftb_news.202.t:0 "Турецкие проливы остаются демилитаризованными"
 bftb_news.202.desc:0 "Государства [TUR.GetNameDefCap] и [SOV.GetNameDef] не смогли договориться о пересмотре Лозаннского договора, заключённого после победы молодой Турецкой Республики над Антантой в Войне за независимость. Договор демилитаризовал Турецкие проливы и открыл Дарданеллы и Босфор для свободного гражданского и военного судоходства. Похоже, это положение сохранится в обозримом будущем.\n[TUR.GetLeader] осудил решение в обращении к нации, заявив, что государство [TUR.GetNameDef] остаётся жертвой упорного империализма. [ENG.GetAdjective] наблюдатели, участвовавшие в процессе, удовлетворены хотя бы тем, что удалось избежать конфликта."
 bftb_news.202.a:1 "Они правильно боялись нашей мощи."
 bftb_news.202.b:0 "Что ещё мы могли сделать?"
 bftb_news.202.c:0 "Могли ли мы сделать больше?"
 bftb_news.202.d:0 "По крайней мере войны удалось избежать."
 bftb_news.202.e:0 "Признак слабости государства [TUR.GetNameDef]."
 bftb_news.203.t:0 "[TUR.GetAdjective]-[SOV.GetAdjective] война"
 bftb_news.203.desc:0 "То, что должно было быть безобидным пересмотром многолетнего договора, вместо этого переросло в тотальную войну между двумя странами. [SOV.GetNameDef] и [TUR.GetNameDef] Разрешения на строительство турецких проливов.\n[TUR.GetLeader] Он назвал срыв переговоров и начало войны «несчастным» и «совершенно предотвратимым».[SOV.GetLeader]В свою очередь, он сказал, что непобедимые армии [SOV.GetNameDef] Он не остановится ни перед чем, чтобы обеспечить соблюдение старых договоров Великой войны.[SOV.GetLeader] Он также подчеркнул, что освобождение [TUR.GetAdjective] Рабочие были неминуемы. Уничтожение нынешнего [TUR.GetAdjective] Режим станет великой победой международного коммунистического дела."
 bftb_news.203.a:1 "Ура-а-а-а!"
 bftb_news.203.b:0 "Пусть попробуют!"
 bftb_news.203.c:0 "Чёрт возьми, какая катастрофа."
 bftb_news.203.d:0 "Что случилось со старой доброй дипломатией?"
 bftb_news.203.e:0 "Хм, стоит подумать о помощи [TUR.GetAdjective] военным усилиям."
 bftb_news.203.f:0 "Ужасно."
 bftb_news.204.t:0 "Гражданская война в государстве [TUR.GetNameDef]!"
 bftb_news.204.desc:0 "В государстве [TUR.GetNameDef] началась гражданская война между правящим консервативным правительством и ранее господствовавшими кемалистами. Кемалисты, завоевавшие независимость государства [TUR.GetNameDef] после распада Османской империи, назвали многочисленные вопиющие нарушения конституции достаточной причиной для свержения режима. Знаменитый генерал и убеждённый кемалист Кязым Орбай избран главой военной хунты, намеренной сместить исламистское правительство [TUR.GetLeader].\n[TUR.GetLeader] осудил действия кемалистов как недостойные полноценной демократической страны и пообещал восстановить законность в расколотой нации. Ни одна сторона не готова к переговорам, и предсказать исход пока невозможно."
 bftb_news.204.a:1 "Мы должны победить!"
 bftb_news.204.b:0 "Какие ужасные новости."
 bftb_news.204.c:0 "Здесь есть возможность."
 bftb_news.204.d:0 "Эй, мы кое-что знаем о таком!"
 bftb_news.205.t:0 "Османский султанат возрождён"
 bftb_news.205.desc:0 "К ужасу всего мира Османский султан вернулся на престол после жестокой гражданской войны между консерваторами и светскими кемалистами. На роскошной церемонии, словно сошедшей со страниц Средневековья, султан был восстановлен в прежнем положении, а республика Мустафы Кемаля Ататюрка навсегда распущена.\n\n[TUR.GetLeader] обратился к возрождённому султанату, выразив удивление и смирение от того, что оказался в таком положении и выступает перед нацией. Новый султан отличается мягким характером, но окружён двором разжигателей войны и ирредентистов. Эксперты, не верившие в возможность его возвращения, не имеют представления о будущем."
 bftb_news.205.a:1 "Альхамдулиллях!"
 bftb_news.205.b:0 "О нет, только не снова!"
 bftb_news.205.c:0 "Как это произошло?!"
 bftb_news.205.d:0 "Хм, интересно."
 bftb_news.205.e:0 "Странно."
 bftb_news.205.f:0 "Законные правители снова вернулись!"
 bftb_news.206.t:0 "Рассвет Средиземноморского пакта"
 bftb_news.206.desc:0 "[ITA.GetLeader] и [TUR.GetLeader] объявили о создании нового союзного блока в Средиземноморье под названием «[TUR.GetFactionName]». [ITA.GetLeader] пообещал, что пакт будет господствовать в европейских делах как ведущая сила континента. [TUR.GetLeader] говорил сдержаннее и заверил дипломатов, что союз носит исключительно стратегический характер и предназначен для укрепления безопасности Балкан и средиземноморских стран.\n\n[ENG.GetAdjective] чиновники назвали новую региональную силу «нежелательной и бесполезной». [GER.GetAdjective] наблюдатели высказались категоричнее, предсказав, что к концу десятилетия фракция останется лишь сноской в истории."
 bftb_news.206.a:1 "Ура!"
 bftb_news.206.b:0 "Какие глупцы!"
 bftb_news.206.c:0 "Слабаки!"
 bftb_news.206.d:0 "В борьбу вступает ещё один соперник."
 bftb_news.206.e:0 "Что это означает для Европы?"
 bftb_news.207.t:0 "Государство [TUR.GetNameDefCap] берёт на себя защиту Балкан"
 bftb_news.207.desc:0 "Сегодня [TUR.GetLeader] объявил всему миру, что Турция расширит ориентированную на Балканы внешнюю политику и будет гарантировать независимость всех сотрудничающих стран. Международные наблюдатели считают, что Турция заняла более решительную позицию, сократив отношения с великими державами ради региональной безопасности.\nХотя некоторые похвалили [TUR.GetAdjective] решение, другие встретили его с серьёзной тревогой. Особенно обеспокоены [ITA.GetAdjective] чиновники, призвавшие [TUR.GetAdjective] правительство отказаться от позиции, чтобы снизить риск конфликта. В ответ [TUR.GetAdjective] правительство назвало государство [ITA.GetNameDef] «региональным агрессором»."
 bftb_news.207.a:1 "Нас ждёт судьба."
 bftb_news.207.b:0 "Слава богу."
 bftb_news.207.c:0 "Это создаст проблемы."
 bftb_news.207.d:0 "Хм."
 bftb_news.208.t:0 "Государство [TUR.GetNameDefCap] требует возвращения границ 1920 года"
 bftb_news.208.desc:1 "\nГосударство [TUR.GetNameDefCap] объявило о намерении вернуть национальные границы к состоянию до ратификации Национального обета Турецкой Республикой. [TUR.GetAdjective] правительство предъявило претензии почти ко всем соседним странам и отвергло призывы отказаться от необоснованных требований.\nМеждународное сообщество широко осудило решение [TUR.GetAdjective] администрации. Мир опасается, что безрассудные действия [TUR.GetAdjective] руководства лишь усугубят потрясения последних лет. Государство [TUR.GetNameDefCap], похоже, твёрдо встало на путь реваншизма, но последствия покажет лишь время."
 bftb_news.208.a:1 "Нас не должны заботить [TUR.GetAdjective] замыслы."
 bftb_news.208.b:0 "Эмбарго кажется подходящим ответом."
 bftb_news.208.c:0 "Разжигатели войны!"
 bftb_news.208.d:0 "Мы хотим лишь того, что принадлежит нам по праву."
 bftb_news.208.e:0 "Они только ухудшают положение!"
 bftb_news.209.t:0 "Пришествие Турана"
 bftb_news.209.desc:1 "Турецкие завоевания достигли такого масштаба, что правительство сочло возможным провозгласить государство [TUR.GetNameDef]. Появление новой империи потрясло мир: мало кто верил, что Турция вообще сумеет полностью оправиться после Войны за независимость в последующие десятилетия, не говоря уже о создании новой межконтинентальной империи.\n\nЕсли верить сообщениям, недавно созданное государство [TUR.GetNameDef] ещё не завершило стремительное расширение. [TUR.GetLeader] заявил, что завоевания не прекратятся, пока каждый турок в мире не будет освобождён. Миру остаётся лишь наблюдать, затаив дыхание."
 bftb_news.209.a:1 "Нас не остановить."
 bftb_news.209.b:0 "Как?"
 bftb_news.301.t:0 "[GRE.GetAdjective] гражданская война!"
 bftb_news.301.desc:0 "В Греции началась гражданская война между силами, верными королю, распустившему парламент, и республиканцами с коммунистами, защищающими демократические принципы. Несмотря на давнюю вражду, республиканцы и коммунисты объединились, чтобы свергнуть непопулярного иностранного короля, навязавшего себя всей [GRE.GetAdjective] нации как тиранический деспот.\n\n[GRE.GetLeader] пообещал, что он и верные ему монархисты не прекратят борьбу, пока все противники монархии не будут изгнаны из страны. [ENG.GetAdjective] чиновники, которых давно считали сторонниками печально известного про-[ENG.GetAdjective] монарха государства [GRE.GetNameDef], отказались комментировать ситуацию."
 bftb_news.301.a:1 "Сплотимся вокруг короля!"
 bftb_news.301.b:0 "Роялистское правительство может быть нам полезно."
 bftb_news.301.c:0 "Хорошо, хорошо — разорвите друг друга!"
 bftb_news.301.d:0 "Будет ли у Греции хоть когда-нибудь передышка?"
 bftb_news.302.t:0 "Создание Великой Греции"
 bftb_news.302.desc:0 "Наблюдателям по всему миру, задававшимся вопросом, чему была посвящена таинственная Ираклионская конференция с многочисленными участниками со всей Европы, больше не нужно гадать: сегодня [GRE.GetLeader] объявил, что [GRE.GetAdjective] мечта о Великой Греции наконец осуществилась.\n\nЭксперты выразили удивление стремительным расширением государства [GRE.GetNameDef], указывая, что политическая нестабильность и глубоко укоренившиеся экономические проблемы делали [GRE.GetAdjective] подъём маловероятным. Однако недавние события доказали, что все они ошибались."
 bftb_news.302.a:1 "Наша мечта наконец исполнилась!"
 bftb_news.302.b:0 "Обычно мы не одобряем подобное поведение, но-о-о..."
 bftb_news.302.c:0 "Им это не поможет!"
 bftb_news.302.d:0 "Ничего себе."
