l_russian:
 sp_tag_rdf:0 "Радиопеленгация"
 sp_tag_r56_infantry:0 "Пехота"
 sp_air_rdf:0 "Высокочастотная радиопеленгация"
 sp_air_rdf_desc:0 "Высокочастотная радиопеленгация использует радиоволны для определения местоположения радиоисточника методом триангуляции за считаные секунды. Создание миниатюрной версии такого устройства поможет обнаруживать в полевых условиях крупную вражескую технику, например корабли и большие самолёты. Это позволит нам быстрее получать данные о направлении и реагировать на них без необходимости передавать информацию от крупной стационарной антенной системы."
 ENG_sp_air_rdf:0 "Пеленгатор Уотсона-Уатта"
 USA_sp_air_rdf:0 "Высокочастотный BTDF"
 sp_r56_naval_huff_duff_device:0 "Морской высокочастотный радиопеленгатор"
 sp_r56_naval_huff_duff_device_desc:0 "Разработав высокочастотные радиопеленгаторы, специально предназначенные для обнаружения вражеских радиопередач в море, мы сможем точнее определять местонахождение подводных лодок противника при поддержке обычных гидролокаторов. Неважно, насколько хорошо они скрываются и насколько осторожно пытаются избежать обнаружения."
 ENG_sp_r56_naval_huff_duff_device:0 "Устройство FH4 «Хафф-Дафф»"
 USA_sp_r56_naval_huff_duff_device:0 "Устройство FH4"
 r56_sp_naval_huff_duff_device_tech:0 "Морской высокочастотный радиопеленгатор"
 r56_sp_naval_huff_duff_device_tech_desc:0 "Высокочастотные радиопеленгаторы, специализирующиеся на обнаружении вражеских радиопередач в море."
 sp_improved_iff:0 "Улучшенная система опознавания «свой-чужой»"
 sp_improved_iff_desc:0 "Мы можем улучшить нашу систему опознавания «свой-чужой» с помощью активных транспондеров и сочетания новейших радио- и радиолокационных технологий. Эта новая система делает существующие решения примитивными по сравнению с ней."
 ENG_sp_improved_iff:0 "IFF Mark II"
 GER_sp_improved_iff:0 "FuG 25a «Эрстлинг»"
 USA_sp_improved_iff:0 "Междиапазонные транспондеры"
 r56_improved_iff_tech:0 "Система IFF второго поколения"
 r56_improved_iff_tech_desc:0 "Улучшенная система опознавания «свой-чужой»."
 sp_air_fido:0 "Система интенсивного рассеивания тумана"
 ENG_sp_air_fido:0 "FIDO"
 sp_air_fido_desc:0 "Туман серьёзно мешает взлёту и посадке самолётов, особенно когда они возвращаются после длительных ночных операций. Разработка системы, способной рассеивать туман и освещать взлётно-посадочную полосу, снизит число аварий и уменьшит влияние тумана на боевые действия."
 r56_fido_tech:0 "Система интенсивного рассеивания тумана"
 r56_fido_tech_desc:0 "Система, рассеивающая туман и освещающая взлётно-посадочную полосу, позволит предотвращать аварии и уменьшать влияние тумана на операции."
 sp_air_r56_afterburning_engine:0 "Форсажный реактивный двигатель"
 sp_air_r56_afterburning_engine_desc:0 "Наши новые проекты реактивных двигателей можно дополнительно улучшить форсажными камерами, позволяющими кратковременно значительно повышать тягу."
 sp_r56_tank_optical_rangefinder:0 "Оптические дальномеры"
 USA_sp_r56_tank_optical_rangefinder:0 "Стереоскопический дальномер M1"
 sp_r56_tank_optical_rangefinder_desc:0 "Усовершенствованный дальномер совпадений, предназначенный для установки на танках. Он улучшает прицеливание и захват целей на больших дистанциях и значительно превосходит существующие оптические решения."
 r56_improved_optics_tech_1:0 "Танковые оптические дальномеры"
 r56_improved_optics_tech_1_desc:0 "Усовершенствованный дальномер совпадений для танков, повышающий точность прицеливания и захват целей на дальних дистанциях. Значительное улучшение по сравнению с существующей оптикой."
 sp_r56_advance_tank_optical_rangefinder:0 "Усовершенствованные оптические дальномеры"
 USA_sp_r56_advance_tank_optical_rangefinder:0 "Стереоскопический дальномер M2"
 sp_r56_advance_tank_optical_rangefinder_desc:0 "Новое поколение оптических дальномеров, значительно повышающее точность прицеливания и захвата целей на больших дистанциях."
 r56_improved_optics_tech_2:0 "Усовершенствованные оптические дальномеры"
 r56_improved_optics_tech_2_desc:0 "Новое поколение оптических дальномеров, значительно повышающее точность прицеливания и захвата целей на больших дистанциях."
 sp_air_r56_helicopter:0 "Вертолётная разведка"
 sp_air_r56_helicopter_desc:0 "Способность вертолёта зависать на месте делает его полезным для наблюдательных миссий."
 r56_sp_helicopter_tech:0 "Вертолётная разведка"
 r56_sp_helicopter_tech_desc:0 "Способность вертолёта зависать на месте помогает при выполнении наблюдательных миссий."
 sp_r56_gammon_bomb:0 "Универсальная граната"
 sp_r56_gammon_bomb_desc:0 "Нашим силам специального назначения нужны простые в применении, лёгкие и универсальные гранаты для различных боевых ситуаций, особенно против бронетехники."
 ENG_sp_r56_gammon_bomb:0 "Граната Гэммона"
 USA_sp_r56_gammon_bomb:0 "Граната № 82"
 r56_gammon_bomb_tech:0 "Универсальная граната"
 r56_gammon_bomb_tech_desc:0 "Простые в применении, лёгкие и универсальные гранаты для самых разных боевых ситуаций."
 sp_r56_anti_tank_rifle_grenade:0 "Противотанковая винтовочная граната"
 sp_r56_anti_tank_rifle_grenade_desc:0 "Разработка миниатюрных кумулятивных зарядов для существующих систем винтовочных гранат значительно повысит способность отделения бороться с бронированными целями."
 r56_anti_tank_rifle_grenade_tech:0 "Противотанковая винтовочная граната"
 r56_anti_tank_rifle_grenade_tech_desc:0 "Разработка миниатюрных кумулятивных зарядов для существующих систем винтовочных гранат значительно повысит способность отделения бороться с бронированными целями."
 sp_r56_heavy_tank_studies:0 "Исследования тяжёлых танков"
 GER_sp_r56_heavy_tank_studies:0 "Требование WaA по Durchbruchwagen"
 SOV_sp_r56_heavy_tank_studies:0 "Требование к танку прорыва"
 ENG_sp_r56_heavy_tank_studies:0 "Требование Генштаба об усилении бронирования"
 USA_sp_r56_heavy_tank_studies:0 "Рекомендация начальника пехоты"
 sp_r56_heavy_tank_studies_desc:0 "Тяжёлые танки — чрезвычайно сложные машины, требующие гораздо большего объёма исследований и разработок, чем могут обеспечить стандартные промышленные процессы. Масштабное исследование этих крупных боевых машин может привести к появлению проектов, лучше подготовленных к реальным условиям боя."
 sp_r56_heavy_tank_studies_preference:0 "Масштаб исследований"
 sp_r56_heavy_tank_studies_preference_desc:0 "Некоторые наши офицеры узнали об исследованиях и прототипировании новых тяжёлых танков. Воображение части из них разыгралось, породив идеи о ещё более крупных машинах с куда более мощной бронёй, чем у нынешних прототипов и проектов. Стоит ли потакать этим фантазиям или сохранить проект в разумных пределах?"
 sp_r56_heavy_tank_studies_focus_preference_go_crazy:0 "Танки побольше! И брони побольше!"
 sp_r56_heavy_tank_studies_focus_preference_be_sane:0 "Сохраним исследование реалистичным."
 r56_heavy_tank_studies_tech:0 "Улучшения тяжёлых танков"
 r56_heavy_tank_studies_tech_desc:0 "Проекты тяжёлых танков, лучше подготовленные к реальным боевым условиям."
