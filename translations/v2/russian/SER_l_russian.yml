l_russian:
 serbia_focus:0 "Сербский национальный фокус"
 SER_konstantin_musicki:0 "Константин Мушицки"
 SER_local_developers:0 "Местные конструкторы"
 SER_local_developers_desc:0 "Сербские самолёты — лучшие самолёты. Никакой предвзятости здесь, разумеется, нет."
 SER_state_guard:0 "Сформировать Српску државну стражу"
 SER_state_guard_desc:0 "Чтобы обеспечить безопасность страны, мы должны создать постоянную армию для защиты нашей территории — Сербскую государственную стражу."
 SER_small_arms:0 "Повысить практичность стрелкового оружия"
 SER_small_arms_desc:0 "Пределы того, какое снаряжение способна переносить пехота, постоянно расширяются. Мы сосредоточимся на том, чтобы снабдить наши войска лучшими доступными средствами."
 SER_improve_conscripts_equipment:0 "Улучшить снаряжение призывников"
 SER_improve_conscripts_equipment_desc:0 "Хотя призывников нельзя вооружить лучшим доступным оружием, мы должны обеспечить их достаточным количеством снаряжения, чтобы они могли сражаться в полную силу."
 SER_motorization_effort:0 "Моторизованный корпус"
 SER_motorization_effort_desc:0 "Мобильность и защита имеют решающее значение для безопасной доставки пехоты на поле боя и её вывода оттуда. Сосредоточившись на этих разработках, мы сможем действовать быстрее."
 SER_structured_logistics:0 "Организованная логистика"
 SER_structured_logistics_desc:0 "Из-за ограниченных производственных возможностей мы не можем позволить себе терять ценное снаряжение, поэтому чёткая и организованная система логистики жизненно важна для сохранения нашей способности вести войну."
 SER_recovery_teams:0 "Эвакуационные команды"
 SER_recovery_teams_desc:0 "Чтобы ещё больше сократить потери снаряжения, мы должны организовать команды для сбора оружия и техники на полях сражений."
 SER_army_maneuvers:0 "Армейские манёвры"
 SER_army_maneuvers_desc:1 "Чтобы привести нашу армию в форму, необходимо провести новые манёвры. Полученный опыт, несомненно, даст и новые представления о современной войне."
 SER_supremacy_of_offense:0 "Превосходство наступления"
 SER_supremacy_of_offense_desc:1 "Наступательные действия — ключ к победе, поэтому именно они должны определять нашу общую стратегию и развитие новых доктрин."
 SER_supremacy_of_defense:0 "Превосходство обороны"
 SER_supremacy_of_defense_desc:1 "Окружённые врагами со всех сторон, мы должны продержаться достаточно долго, чтобы союзники смогли отвлечь их внимание от нас. Развитие новых военных доктрин должно быть сосредоточено на защите нашей родины."
 SER_artillery_regiments:0 "Артиллерийские полки"
 SER_artillery_regiments_desc:1 "Включив в наши дивизии мощные артиллерийские полки, мы значительно повысим их общую боевую мощь."
 SER_domestic_artillery_production:0 "Отечественное производство артиллерии"
 SER_domestic_artillery_production_desc:1 "Стимулируя разработку современных отечественных образцов артиллерии, мы сможем обеспечить наши войска лучшей огневой поддержкой, которую способны предоставить."
 SER_anti_tank_defenses:0 "Противотанковая оборона"
 SER_anti_tank_defenses_desc:1 "Поскольку танки заняли центральное место в современной войне, необходимы новые разработки в области полевых противотанковых орудий, которые позволят нашей пехоте уничтожать этих бронированных гигантов."
 SER_mountain_brigades:0 "Горные бригады"
 SER_mountain_brigades_desc:1 "Значительная часть нашей страны покрыта горами, что требует формирования специальных бригад, подготовленных к боям на такой местности."
 SER_armored_cavalry:0 "Бронированная кавалерия"
 SER_armored_cavalry_desc:0 "Механизация кавалерии и переход на полугусеничную технику обеспечат высокую мобильность и дополнительную защиту бойцов. Хотя такой переход, несомненно, потребует больших производственных затрат, мы должны сделать всё возможное для быстрой победы на поле боя."
 SER_tank_conversions:0 "Переоборудование танков"
 SER_tank_conversions_desc:1 "Сегодня нам могут требоваться танки, а уже в следующем месяце — самоходная артиллерия или истребители танков на том же шасси. Наша бронетехника должна оставаться гибкой и приспосабливаться к текущим потребностям."
 SER_modern_tanks:0 "Современные танки"
 SER_modern_tanks_desc:1 "С появлением крупнокалиберного основного вооружения бронетехника ушла далеко вперёд от первоначальной идеи безопасной перевозки войск из точки А в точку Б. Чтобы соперничать с соседями, мы должны создать собственные современные танки."
 SER_equipment_effort_2:0 "Развитие снаряжения II"
 SER_equipment_effort_2_desc:0 "Мы продолжим прилагать усилия, чтобы наша пехота и части поддержки были вооружены лучшим доступным снаряжением своего времени."
 SER_mechanization_effort:0 "Развитие механизации"
 SER_mechanization_effort_desc:0 "Переосмыслив возможности моторизованной пехоты, мы сможем раздвинуть пределы того, какую технику способны создавать сегодня."
 SER_doctrine_effort_2:0 "Развитие доктрины II"
 SER_doctrine_effort_2_desc:0 "Поле боя изменилось за межвоенные годы и в ходе недавних конфликтов. Мы должны постоянно пересматривать наши доктрины с учётом этих перемен."
 SER_equipment_effort_3:0 "Развитие снаряжения III"
 SER_equipment_effort_3_desc:0 "Вместо копирования или закупки иностранного снаряжения мы должны стать мировым лидером в области пехотного вооружения."
 SER_armor_effort:0 "Развитие бронетехники"
 SER_armor_effort_desc:0 "Применяя знания, полученные при механизации пехоты, мы также можем совершенствовать нашу бронетехнику."
 SER_special_forces:0 "Войска специального назначения"
 SER_special_forces_desc:0 "Нам нужны элитные войска; приоритет следует отдать горным частям и десантникам."
 SER_aviation_effort:0 "Основать Белградскую авиационную школу"
 SER_aviation_effort_tt:0 "Недостаточно ячеек для строительства §Yавиабазы§!"
 SER_aviation_effort_desc:0 "Нигде технологический прогресс не идёт так стремительно, как в воздушной войне. Авиация — область, которой должна овладеть любая современная страна."
 SER_fighter_focus:0 "Ставка на истребители"
 SER_fighter_focus_desc:0 "Воздушные дуэли Великой войны ещё не остались в прошлом. Опережая других в разработке истребителей, мы получим преимущество в будущем."
 SER_bomber_focus:0 "Ставка на бомбардировщики"
 SER_bomber_focus_desc:0 "Когда люди будущего будут говорить об ужасах нынешних войн, огонь, падающий с небес, займёт в их рассказах заметное место. Мы сделаем всё возможное, чтобы именно наши враги рассказывали эти истории."
 SER_airplanes_licenses:0 "Лицензии на самолёты"
 SER_airplanes_licenses_desc:0 "Поскольку наши конструкторские возможности ограничены, нам следует попытаться получить лицензии на самолёты и оснастить наши ВВС современными истребителями."
 SER_form_mechanics:0 "Сформировать бригады механиков"
 SER_form_mechanics_desc:0 "В конце концов, какая разница между самолётом, сбитым вражескими пулями, потерянным из-за внезапного возгорания двигателя или неспособным взлететь из-за механической неисправности, если мы не можем его починить? Чтобы снизить риск технических отказов, единственное решение — иметь преданных делу и хорошо обученных механиков, которые знают устройство этих самолётов лучше, чем хирург знает анатомию."
 SER_aviation_effort_2:0 "Передовая воздушная доктрина"
 SER_aviation_effort_2_desc:0 "Дальнейшее развитие авиации необходимо, чтобы лучше интегрировать наши ВВС с другими родами войск."
 SER_CAS_effort:0 "Развитие штурмовой авиации"
 SER_CAS_effort_desc:0 "Современной армии необходима поддержка как наземной техники, так и авиации."
 SER_rocket_effort:0 "Развитие ракетной техники"
 SER_rocket_effort_desc:0 "Ракетные и реактивные двигатели позволяют достигать невиданных скоростей как беспилотным, так и пилотируемым аппаратам. Освоение этих технологий позволит застать врага врасплох."
 SER_NAV_effort:0 "Развитие морской авиации"
 SER_NAV_effort_desc:0 "Подобно тому как новая морская война ведётся под поверхностью воды, часть её разворачивается и в небе над морем."
 SER_ikarus:0 "Икарус"
 SER_ikarus_desc:1 "Наше старейшее авиастроительное предприятие — заводы «Икарус» в Нови-Саде — необходимо расширить, чтобы подготовить их к росту производства, требуемому для наших новых ВВС."
 SER_designer_tt:0 "Открывает эту компанию в качестве авиаконструктора.\n"
 SER_rogozarski:0 "Рогожарски"
 SER_rogozarski_desc:1 "Основанная вскоре после «Икаруса» «Первая сербская авиационная фабрика Живоина Рогожарского» нуждается в расширении, если хочет соответствовать современным требованиям производства."
 SER_zmaj:0 "Змай"
 SER_zmaj_desc:1 "Белградским авиационным мастерским «Змай» необходимо выделить новые территории для расширения. Хотя компания моложе других наших предприятий, после увеличения мощностей «Змай» обладает всем потенциалом, чтобы удовлетворить наши производственные потребности."
 SER_expand_the_split_shipyards:0 "Расширить черногорские верфи"
 SER_expand_the_split_shipyards_desc:0 "Наша существующая судостроительная промышленность в Черногории — отличный кандидат для расширения, а её мощности позволяют строить более крупные военные корабли."
 SER_coastal_defense:0 "Береговая оборона"
 SER_coastal_defense_desc:0 "Мы не можем рассчитывать на соперничество с флотами наших противников в Адриатике. Вместо этого необходимо подготовить побережье к отражению любых морских десантов."
 SER_contest_the_adriatic:0 "Оспорить господство в Адриатике"
 SER_contest_the_adriatic_desc:0 "Оборона наших берегов начинается в море за их пределами. Мы должны разработать новые морские тактики и стратегии, чтобы установить контроль над Адриатическим морем или хотя бы оспорить его."
 SER_light_cruiser:0 "Проектирование лёгких крейсеров"
 SER_light_cruiser_desc:1 "Нам нужен новый современный крейсер, который станет основой нашего Адриатического флота."
 SER_naval_bombers:0 "Морские бомбардировщики"
 SER_naval_bombers_desc:1 "Адриатика длинная, но узкая, поэтому самолёты с наших аэродромов могут легко действовать над ней. Разработка специализированных морских бомбардировщиков способна значительно повысить шансы нашего флота против более сильных противников."
 SER_heavy_cruiser_project:0 "Проект тяжёлого крейсера"
 SER_heavy_cruiser_project_desc:1 "Чтобы достойно противостоять вражеским флотам, нам нужны корабли большего водоизмещения и более тяжёлое вооружение. Тяжёлые крейсеры станут хорошим шагом вперёд по сравнению с лёгкими крейсерами, до сих пор составлявшими основу нашего флота."
 SER_modern_destroyers:0 "Современные эсминцы"
 SER_modern_destroyers_desc:1 "Эсминцы — основа любого флота, и мы должны убедиться, что наши не уступают кораблям противника."
 SER_build_the_nation:0 "Заложить основы индустриализации"
 SER_build_the_nation_desc:0 "Сосредоточить все политические усилия на стремительном развитии гражданской промышленности."
 SER_research_collaboration:0 "Югославское научное сотрудничество"
 SER_research_collaboration_desc:0 "Будучи автономным регионом, вполне логично делиться любыми значимыми открытиями с центральным югославским правительством."
 SER_prospect_for_resources:0 "Разведка ресурсов"
 SER_prospect_for_resources_desc:0 "В наших недрах скрываются ресурсы, которые пригодятся в борьбе нашего времени. Мы должны как можно скорее извлечь их и использовать с максимальной пользой."
 SER_construction_effort_tt:0 "Недостаточно ячеек для строительства §Yфабрик§!"
 SER_construction_effort:0 "Сделать первые шаги к индустриализации"
 SER_construction_effort_desc:0 "Сделать первые шаги к индустриализации"
 SER_production_effort:0 "Вооружить нацию"
 SER_production_effort_tt:0 "Недостаточно ячеек для строительства §Yвоенных заводов§!"
 SER_production_effort_desc:0 "Если вы можете строить тракторы, то можете строить и танки! Мы не должны допустить отставания наших военных производственных мощностей."
 SER_construction_effort_2:0 "Индустриализировать сельскую Мораву"
 SER_construction_effort_2_desc:0 "Продолжая расширять наши предприятия, мы сможем ускорить производство товаров для торговли и дальнейшего строительства."
 SER_industrial_planning:0 "Промышленное планирование"
 SER_industrial_planning_desc:0 "Чтобы продолжить промышленное развитие, мы должны разработать долгосрочную стратегию и найти подходящие земли."
 SER_create_skopje_arsenals:0 "Создать новые арсеналы в Скопье"
 SER_create_skopje_arsenals_desc:1 "В Македонии практически никогда не было военной промышленности, так что самое время создать её самостоятельно."
 SER_production_effort_2:0 "Поддержать производство тяжёлой техники"
 SER_production_effort_2_desc:0 "Будучи одним из ведущих портов Европы, Антверпен прекрасно подходит для развития промышленности, ориентированной на экспорт."
 SER_infrastructure_effort:0 "Соединить Подгорицу с Белградом"
 SER_infrastructure_effort_desc:0 "Страна без надлежащей инфраструктуры не способна осуществлять сложные проекты или строительство."
 SER_infrastructure_effort_tt:0 "Недостаточно ячеек для строительства §Yинфраструктуры§!"
 SER_extract_aluminium:0 "Развивать черногорский алюминий"
 SER_extract_aluminium_desc:0 "Алюминий — наш главный ресурс, и мы обязаны максимально увеличить его добычу."
 SER_develop_steel_deposits:0 "Развивать сталелитейную промышленность Моравы"
 SER_develop_steel_deposits_desc:0 "Молодую сталелитейную промышленность Моравы следует развивать, чтобы обеспечить страну необходимой сталью."
 SER_expand_the_university_of_belgrade:0 "Расширить Белградский университет"
 SER_expand_the_university_of_belgrade_desc:0 "Белградский университет уже с большим отрывом является крупнейшим в стране. Но если мы направим больше ресурсов на его исследования, особенно в областях, способных привести к военным инновациям, то сможем получить решающее преимущество на поле боя."
 SER_develop_macedonia:0 "Развивать Македонию"
 SER_develop_macedonia_desc:0 "Македонцев не существует, это просто сербы-мусульмане. Поэтому Македония населена сербами, и они заслуживают такой же заботы, как и все остальные сербы."
 SER_construction_effort_3:0 "Развитие промышленности III"
 SER_construction_effort_3_desc:0 "Расширение нашей инфраструктурной сети значительно повысило наши строительные возможности."
 SER_nuclear_effort:0 "Ядерный институт Винча"
 SER_nuclear_effort_desc:0 " "
 SER_extra_tech_slot_2:0 "Расширить отдел НИОКР"
 SER_extra_tech_slot_2_desc:0 "Быстрая индустриализация нашей страны открыла новые возможности для исследований и разработок, которыми следует воспользоваться."
 SER_technology_sharing:0 "Обмен технологиями"
 SER_technology_sharing_desc:0 "Обмениваясь технологическими достижениями с союзниками, весь наш альянс сможет эффективнее вести исследования и разработки военного времени."
 SER_secret_weapons:0 "Секретное оружие"
 SER_secret_weapons_desc:0 "Велик соблазн направить все дополнительные ресурсы на разработку танков и самолётов, однако секрет победы в войнах лежит в совершенно новых областях науки: электронике, ракетной технике и ядерных исследованиях."
 SER_political_effort:0 "Организовать новое государство"
 SER_political_effort_desc:0 "Наша первоочередная задача — создать основные органы государственной власти по всей стране."
 SER_collectivist_ethos:0 "Расширить полномочия синдикатов"
 SER_collectivist_ethos_desc:0 "Наши враги могут разделять и покорять более слабые народы, но наш народ будет стоять единым — один за всех и все за одного."
 SER_liberty_ethos:0 "Демократический консенсус"
 SER_liberty_ethos_desc:0 "В эпоху идеологических фанатиков, стремящихся задушить человеческий дух, мы защитим личные свободы и права."
 SER_militarism:0 "Милитаризировать страну"
 SER_militarism_desc:0 "Чтобы бороться с врагами страны, мы должны набирать бойцов среди наших воинственно настроенных добровольцев для борьбы со смертельными идеологическими противниками, особенно коммунистами."
 SER_political_correctness:0 "Политическая корректность"
 SER_political_correctness_desc:0 "Люди, придерживающиеся умеренно спорных или просто неловких взглядов, похоже, обеспокоены масштабным заговором против них. Кажется, это превосходная идея."
 SER_neutrality_focus:0 "Курс на нейтралитет"
 SER_neutrality_focus_desc:0 "Другие могут утверждать, что для выбора стороны в мировом конфликте нужны храбрость и мудрость, но мы знаем, что ещё больше их требуется, чтобы отказаться от выбора."
 SER_interventionism_focus:0 "Курс на интервенционизм"
 SER_interventionism_focus_desc:0 "Мы ценим свободу всех людей, а не только своих граждан. Если для предотвращения тирании нужна война — пусть будет так."
 SER_military_youth:0 "Военная идеологическая подготовка"
 SER_military_youth_desc:0 "Организации, призванные укреплять дисциплину и политическое воспитание населения, с ранних лет будут прививать верность и готовность к самопожертвованию."
 SER_deterrence:0 "Сдерживание"
 SER_deterrence_desc:0 "Оставаясь в одиночестве, мы редко извлекаем пользу из войны. К счастью, мы знаем, что лучшая оборона — та, о которой всем известно настолько хорошо, что её никогда не приходится применять."
 SER_volunteer_corps:0 "Добровольческий корпус"
 SER_volunteer_corps_desc:0 "Заставлять наших людей умирать за идеалы свободы было бы вопиющей иронией, но создать возможность для тех, кто желает помогать людям за рубежом, — совсем другое дело."
 SER_paramilitarism:0 "Парамилитаризм"
 SER_paramilitarism_desc:0 "Военные принципы применимы и за пределами армии. Если мы создадим полувоенные формирования в дополнение к вооружённым силам, больше людей получат военную подготовку."
 SER_indoctrination_focus:0 "Идеологическая обработка"
 SER_indoctrination_focus_desc:0 "Раз установлено, что наша идеология основана на истине, её можно преподавать как истину. Образование и средства массовой информации должны отражать этот урок."
 SER_foreign_expeditions:0 "Зарубежные экспедиции"
 SER_foreign_expeditions_desc:0 "Поскольку наши враги готовы вмешиваться в далёкие конфликты ради своих идеалов, мы должны быть готовы делать то же самое ради наших."
 SER_why_we_fight:0 "Почему мы сражаемся"
 SER_why_we_fight_effect:0 "Если у нас нет национального духа §Y«Нейтральная внешняя политика»§!, мы можем создавать альянсы.\n"
 SER_why_we_fight_desc:0 "Мир становится всё опаснее. Наш народ должен увидеть зверства, совершаемые теми, кто жаждет власти. Мы сплотим людей вокруг нашего дела и убедимся, что каждый готов сражаться за нашу свободу."
 SER_political_commissars:0 "Политические комиссары"
 SER_political_commissars_desc:0 "Чтобы наши политические установки соблюдались и в военной практике, мы введём в армейские ряды политически назначаемых должностных лиц."
 SER_organized_partizans:0 "Организованные партизаны"
 SER_organized_partizans_desc:0 "Чтобы противостоять угрозе вторжения, мы должны заранее организовать ячейки сопротивления. Эти группы подготовят тайники, возможные площадки для сброса грузов и будут вербовать местных жителей для сбора разведданных. Все эти усилия позволят оказывать максимальное давление на тыловые районы вражеских сил."
 SER_internationalism_focus:0 "Курс на интернационализм"
 SER_internationalism_focus_desc:0 "Идеология не знает границ. Другая нация может называть себя суверенной, но наши убеждения выше подобных притязаний."
 SER_nationalism_focus:0 "Национальное спасение"
 SER_nationalism_focus_desc:0 "В последние десятилетия Сербия была частью югославского государства, включавшего множество балканских меньшинств, таких как боснийцы и словенцы, но этого государства больше нет. Отныне мы будем править Балканами как гордая сербская нация!"
 SER_ideological_fanaticism_communism:0 "Идеологический фанатизм"
 SER_ideological_fanaticism_communism_desc:0 "Наши политически утверждённые ценности и цели столь же достойны того, чтобы умереть за них, как и любая древняя вера. Каждый последователь должен быть готов встретить смерть, а тем, кто собьётся с пути, тоже лучше быть готовыми встретить смерть."
 SER_ideological_fanaticism:0 "Идеологический фанатизм"
 SER_ideological_fanaticism_desc:0 "Наши политически утверждённые ценности и цели столь же достойны того, чтобы умереть за них, как и любая древняя вера. Каждый последователь должен быть готов встретить смерть, а тем, кто собьётся с пути, тоже лучше быть готовыми встретить смерть."
 SER_anti_partizan_tactics:0 "Антипартизанская тактика"
 SER_anti_partizan_tactics_desc:0 "Партизан необходимо разбить и изгнать из их гор. Чтобы перенести борьбу в самое сердце земель под их контролем, регулярные патрули должны обеспечивать безопасность деревень, а мы обязаны собирать разведданные у лояльных местных жителей. Иного выбора у нас нет, если мы хотим победить коммунистов и раз и навсегда выиграть эту борьбу."
 SER_faithful_ally:0 "Верный союзник"
 SER_faithful_ally_desc:0 "Благодаря нашей решимости защищать свою землю и крови, пролитой ради общей цели европейской победы над иудео-большевизмом, мы заслужили признание в качестве полноценного члена держав Оси. Этому способствовала блестящая работа наших френологов, доказавших, что, в отличие от этих грязных сербов, мы являемся прямыми потомками арийцев, переселившихся на юг."
 SER_catholic_dominance_focus:0 "Католическое господство"
 SER_catholic_dominance_focus_desc:0 "На протяжении веков хорваты следовали учению Римско-католической церкви. После нашего насильственного объединения с Сербией многие ради личной выгоды перешли в православие. Этому необходимо положить конец, поскольку каждый христианин [CRO.GetAdjective] должен признать власть Его Святейшества Папы."
 SER_secularism_focus:0 "Секуляризм"
 SER_secularism_focus_desc:0 "Вера ни в коем случае не должна вмешиваться в государственные дела. Она должна оставаться исключительно личным вопросом, а духовенству следует запретить участие в политике."
 SER_integrate_muslim_croats_focus:0 "Интегрировать хорватов-мусульман"
 SER_integrate_muslim_croats_focus_desc:0 "Мусульмане могут исповедовать другую религию, но они всё равно являются частью нации и должны быть полностью признаны хорватами."
 SER_bosnian_muslim_conscription_focus:0 "Призвать боснийских мусульман"
 SER_bosnian_muslim_conscription_focus_desc:0 "Поскольку живущие в Боснии мусульмане являются хорватами, они должны служить в армии вместе со своими этническими братьями."
 SER_integrate_orthodox_croats_focus:0 "Интегрировать православных хорватов"
 SER_integrate_orthodox_croats_focus_desc:0 "Мы несправедливо обращались с православными хорватами. Но мы должны признать, что, даже если добрые хорваты принадлежат к святой Римско-католической и апостольской церкви, хорваты, принявшие религию сербов, всё равно остаются хорватами и должны быть интегрированы в национальное сообщество."
 SER_deny_citizenship_to_muslims_focus:0 "Лишить мусульман прав"
 SER_deny_citizenship_to_muslims_focus_desc:0 "Католицизм — основной элемент хорватской идентичности, и мусульмане, притворяющиеся хорватами, не заслуживают места среди нас."
 SER_integrate_religious_minorities_focus:0 "Интегрировать религиозные меньшинства"
 SER_integrate_religious_minorities_focus_desc:0 "В нашей стране проживают религиозные меньшинства, и их особенности следует уважать."
 SER_a_king_for_our_people_focus:0 "Король для нашего народа"
 SER_a_king_for_our_people_focus_desc:0 "Чтобы восстановить величие свободного Хорватского королевства прошлого, мы должны выбрать короля, который поведёт возрождённый хорватский народ."
 SER_saviour_of_serbia:0 "Несущий спасение"
 SER_saviour_of_serbia_desc:0 "Несущий спасение"
 SER_secure_flanks:0 "Вернуть Македонию и Черногорию"
 SER_secure_flanks_desc:0 "Вернуть Македонию и Черногорию"
 SER_advance_north:0 "Вернуть государство CSS"
 SER_advance_north_desc:0 "Вернуть государство CSS"
 SER_join_axis:0 "Союз с Германией"
 SER_join_axis_desc:0 "Заключить союз с Германией."
 SER_belgrade_investments_focus:0 "Инвестиции в Белград"
 SER_belgrade_investments_focus_desc:0 "Белград — наша столица и важный промышленный центр, поэтому он должен находиться в центре нашей промышленной политики."
 SER_trading_infrastructures:0 "Торговая инфраструктура"
 SER_trading_infrastructures_desc:0 "Путь по морю — это путь вперёд. Развивая порты далматинского побережья, мы увеличим наш экспорт."
 SER_industrial_support:0 "Поддержка промышленности"
 SER_industrial_support_desc:0 "Мы должны заручиться поддержкой промышленников и убедить их трудиться ради общего блага общества."
 SER_economic_optimization:0 "Оптимизация экономики"
 SER_economic_optimization_desc:0 "Некоторые отрасли нашего военно-промышленного комплекса управляются неэффективно, и мы должны реформировать их, чтобы повысить производительность."
 SER_research_grants:0 "Исследовательские гранты"
 SER_research_grants_desc:0 "Финансируя инженерные компании, мы сможем быстрее разрабатывать новое снаряжение для наших вооружённых сил."
 SER_yugoslav_scientific_cooperation:0 "Югославское научное сотрудничество"
 SER_form_peasant_councils:0 "Сформировать крестьянские советы"
 SER_form_peasant_councils_desc:0 "Крестьяне по всей стране годами подвергались угнетению. Если мы побудим их объединяться и организовываться под нашим идеологическим руководством, то приобретём множество новых сторонников."
 SER_recreate_yugoslavia:0 "Воссоздание Югославии"
 SER_economic_centralization:0 "Централизация экономики"
 SER_economic_centralization_desc:0 "Мы должны полностью перестроить экономику, чтобы позволить пролетариату взять власть."
 SER_nationalize_factories:0 "Национализировать фабрики"
 SER_nationalize_factories_desc:0 "Индустриализация — путь будущего, а капиталисты препятствуют ей, эксплуатируя труд пролетариата. Чтобы раскрыть истинный потенциал пролетариата, мы должны лишить порочных и угнетающих капиталистов их экономического влияния."
 SER_local_steel_production:0 "Местное производство стали"
 SER_local_steel_production_desc:0 "Для поддержки нашей военной промышленности крайне важно производить сталь внутри страны. Мы должны всеми возможными средствами воплотить это решение центрального политического комитета коммунистической партии."
 SER_local_militias:0 "Местное ополчение"
 SER_local_militias_desc:0 "Активистов крестьянских советов необходимо мобилизовать и вооружить, чтобы они стали костяком идеологически лояльной армии."
 SER_state_guard_tooltip:0 "Будут сформированы 3 дивизии государственной стражи"
 SER_integrate_montenegro:0 "Интегрировать Черногорию"
