 MAN_r56rp_domestic_tank_plants_desc:0 "Мы предпримем предварительные шаги для начала отечественного производства и проектирования танков в Маньчжурии."
 MAN_r56rp_imperial_domestic_tank_plants:0 "Имперские танковые заводы"
 MAN_r56rp_imperial_domestic_tank_plants_desc:0 "Японские эксперименты с бронетехникой показывают, что танки являются бесценным инструментом в борьбе с иностранными угрозами. Император приказал начать закладку фундамента для императорских бронетанковых заводов."
 MAN_r56rp_imperial_mamc:0 "Королевская авиационная промышленность"
 MAN_r56rp_imperial_mamc_desc:0 "Императорские указы, и так будет. Авиация — это оружие будущего, и поэтому наша вновь возродившаяся Империя должна исследовать и производить эти чудеса у себя дома."
