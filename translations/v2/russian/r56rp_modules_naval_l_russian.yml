l_russian:
 EQ_MOD_CAT_r56rp_ship_heavy_armor_scheme_TITLE:0 "Схема тяжелой брони"
 EQ_MOD_SLOT_fixed_ship_armor_scheme_slot_TITLE:0 "Схема бронирования"
 r56rp_naval_sam_1:0 "Ракета \"земля-воздух\""
 r56rp_naval_sam_1_short:0 "РЗВ"
 r56rp_naval_sam_1_desc:0 "По сути, большая взрывоопасная боеголовка прилипала к твердотопливному ракетному двигателю, способному к дистанционному наведению. Может летать выше и поражать более точно, чем обычная артиллерия АА."
 r56rp_depth_charge_nuke:0 "Ядерная глубина заряда"
 r56rp_depth_charge_nuke_desc:0 "Ядерное устройство с глубинным предохранителем. Гораздо более высокая взрывная мощность по сравнению с обычными зарядами."
 r56rp_ship_fcs_4:0 "Современная система пожарного контроля"
 r56rp_ship_fcs_4_desc:0 "Все необходимые данные, полученные различными дальномерами, подаются в механический компьютер, из которого могут быть выданы приказы на стрельбу непосредственно на различные вооружения на борту судна."
 r56rp_ship_armor_shbb_2:0 "500mm Belt/250mm палуба"
 r56rp_ship_armor_shbb_2_desc:0 ""
 r56rp_ship_sonar_3:0 "Передовой активный сонар"
 r56rp_ship_sonar_3_desc:0 ""
 r56rp_ship_sonar_4:0 "Современный активный сонар"
 r56rp_ship_sonar_4_desc:0 ""
 r56rp_ship_pre_jutland:0 "Пред-ютландская броня"
 r56rp_ship_pre_jutland_desc:0 "Эта схема была разработана после русско-японской войны 1905 года, которая охватывает больше областей против высоковольтных орудий."
 r56rp_ship_post_jutland:0 "Пост-ютландская броня"
 r56rp_ship_post_jutland_desc:0 "Переходная схема брони, которая была разработана вскоре после битвы при Ютландии, которая имеет увеличенную палубную броню."
 r56rp_ship_incremental:0 "Схема дополнительной брони"
 r56rp_ship_incremental_desc:0 "Дальнейшее развитие доютландской брони, обеспечивающей дальнейшую защиту."
 r56rp_ship_mixed:0 "Смешанная схема брони"
 r56rp_ship_mixed_desc:0 "Эта схема бронирования является адаптацией схемы «все или ничего», которая также расширяет защиту на второстепенные области."
 r56rp_ship_all_or_nothing:0 "Схема All-or-Nothing"
 r56rp_ship_all_or_nothing_desc:0 "Схема «Все или ничего» фокусирует свою защиту вокруг наиболее важных частей корабля, в то время как вторичные области не получают бронирования."
 r56rp_ship_light_medium_battery_twin_1:0 "Близнецы 14,5 см пушки"
 r56rp_ship_light_medium_battery_twin_1_short:0 "Легкая батарея Twin крейсер I"
 r56rp_ship_light_medium_battery_twin_1_desc:0 "Компромисс между скорострельностью и массой снарядов, эти орудия предназначены для использования в лёгких крейсерах для поражения более мелких кораблей."
 r56rp_ship_light_medium_battery_twin_2:0 "Близнецы 15 см пушки"
 r56rp_ship_light_medium_battery_twin_2_short:0 "Легкая батарея Twin крейсер II"
 r56rp_ship_light_medium_battery_twin_2_desc:0 "Эти пушки представляют собой логическую эволюцию от предыдущих моделей и предназначены для того, чтобы позволить легким крейсерам иметь комфортное преимущество в огневой мощи над эсминцами и более старыми крейсерами."
 r56rp_ship_light_medium_battery_twin_3:0 "Близнецы 15,5 см пушки"
 r56rp_ship_light_medium_battery_twin_3_short:0 "Легкая батарея Twin крейсер III"
 r56rp_ship_light_medium_battery_twin_3_desc:0 "Включая ряд новых технологий, эта легкобронированная установка еще больше увеличивает разрыв между основными батареями эсминцев и легких крейсеров."
 r56rp_ship_light_medium_battery_twin_4:0 "Твин 15,5 см Автозарядные пушки"
 r56rp_ship_light_medium_battery_twin_4_short:0 "Легкая батарея Twin крейсер Auto-loading"
 r56rp_ship_light_medium_battery_twin_4_desc:0 "Разработанная с нуля для высокой скорости огня, эта установка была создана, чтобы позволить легким крейсерам отключать еще более крупных врагов через множество ударов."
 r56rp_ship_medium_battery_twin_1:0 "Близнецы 17 см пушки"
 r56rp_ship_medium_battery_twin_1_short:0 "Тяжелый крейсер Twin Battery I"
 r56rp_ship_medium_battery_twin_1_desc:0 "Не имея возможности нанести значительный ущерб линкорам, эти средние пушки позволяют тяжелому крейсеру уверенно взаимодействовать с более легкими кораблями и другими крейсерами."
 r56rp_ship_medium_battery_twin_2:0 "Близнецы 19 см пушки"
 r56rp_ship_medium_battery_twin_2_short:0 "Тяжелый крейсер Twin Battery II"
 r56rp_ship_medium_battery_twin_2_desc:0 "Эволюция более ранней конструкции, эти пушки были сделаны, чтобы идти в ногу с увеличением брони и более длинными диапазонами, на которых ведутся морские сражения."
 r56rp_ship_medium_battery_twin_3:0 "Близнецы 20,3 см пушки"
 r56rp_ship_medium_battery_twin_3_short:0 "Тяжелый крейсер Twin Battery III"
 r56rp_ship_medium_battery_twin_3_desc:0 "Хотя это не самое большое оружие, которое можно установить на крейсере, эта пушка обеспечивает наилучший баланс между весом вооружения и огневой мощью и может надежно победить крейсер-броню."
 r56rp_ship_medium_battery_twin_4:0 "Twin 20,3 см Автозарядные пушки"
 r56rp_ship_medium_battery_twin_4_short:0 "Тяжелый крейсер Twin Battery IV"
 r56rp_ship_medium_battery_twin_4_desc:0 "С калибром, ограниченным существующими боеприпасами и с прицелом на модернизацию старых кораблей, эти новые пушки оснащены передовой системой автоматической загрузки для резкого повышения скорости стрельбы."
 ship_heavy_battery_1:0 "Тройные 28 см пушки"
 ship_heavy_battery_1_short:0 "Тяжелая тройная батарея I"
 ship_heavy_battery_1_desc:0 "Тройная крупнокалиберная пушечная башня, датируемая до Великой войны."
 ship_heavy_battery_2:0 "Тройные 30,5 см пушки"
 ship_heavy_battery_2_short:0 "Тяжелая тройная батарея II"
 ship_heavy_battery_2_desc:0 "Набор крупнокалиберных пушек в сильно бронированной установке. Редизайн башни позволяет повысить высоту орудия, тем самым увеличивая дальность стрельбы."
 ship_heavy_battery_3:0 "Тройные 38 см пушки"
 ship_heavy_battery_3_short:0 "Тяжелая трехместная батарея III"
 ship_heavy_battery_3_desc:0 "Тяжело бронированная установка для тяжелых орудий, включающая ряд новых технологий для повышения точности и скорости стрельбы."
 ship_heavy_battery_4:0 "Тройные 40,6 см пушки"
 ship_heavy_battery_4_short:0 "Тяжелая трехместная батарея IV"
 ship_heavy_battery_4_desc:0 "Окончательная эволюция тяжелой огневой мощи, эта тяжелобронированная установка обеспечивает высокую степень точности на больших расстояниях."
 r56rp_ship_heavy_battery_twin_1:0 "28 см пушки"
 r56rp_ship_heavy_battery_twin_1_short:0 "Тяжелая двойная батарея I"
 r56rp_ship_heavy_battery_twin_1_desc:0 "Близнецы установили крупнокалиберную пушечную башню, датируемую до Великой войны."
 r56rp_ship_heavy_battery_twin_2:0 "Близнецы 30,5 см пушки"
 r56rp_ship_heavy_battery_twin_2_short:0 "Тяжелая батарея-близнец II"
 r56rp_ship_heavy_battery_twin_2_desc:0 "Набор крупнокалиберных пушек в сильно бронированной установке. Редизайн башни позволяет повысить высоту орудия, тем самым увеличивая дальность стрельбы."
 r56rp_ship_heavy_battery_twin_3:0 "Близнецы 38 см пушки"
 r56rp_ship_heavy_battery_twin_3_short:0 "Тяжелая батарея-близнец III"
 r56rp_ship_heavy_battery_twin_3_desc:0 "Тяжело бронированная установка для тяжелых орудий, включающая ряд новых технологий для повышения точности и скорости стрельбы."
 r56rp_ship_heavy_battery_twin_4:0 "Близнецы 40,6 см пушки"
 r56rp_ship_heavy_battery_twin_4_short:0 "Тяжелая батарея-близнец IV"
 r56rp_ship_heavy_battery_twin_4_desc:0 "Окончательная эволюция тяжелой огневой мощи, эта тяжелобронированная установка обеспечивает высокую степень точности на больших расстояниях."
 r56rp_ship_heavy_battery_quad_1:0 "Пушки в четыре раза 28 см"
 r56rp_ship_heavy_battery_quad_1_short:0 "Тяжелая четырехместная батарея I"
 r56rp_ship_heavy_battery_quad_1_desc:0 "Четырехместная крупнокалиберная пушечная башня, датируемая до Великой войны."
 r56rp_ship_heavy_battery_quad_2:0 "Пушки в четыре раза 30,5 см"
 r56rp_ship_heavy_battery_quad_2_short:0 "Тяжелая четырехместная батарея II"
 r56rp_ship_heavy_battery_quad_2_desc:0 "Набор крупнокалиберных пушек в сильно бронированной установке. Редизайн башни позволяет повысить высоту орудия, тем самым увеличивая дальность стрельбы."
 r56rp_ship_heavy_battery_quad_3:0 "Четырехкратные 38 см пушки"
 r56rp_ship_heavy_battery_quad_3_short:0 "Тяжелая четверная батарея III"
 r56rp_ship_heavy_battery_quad_3_desc:0 "Тяжело бронированная установка для тяжелых орудий, включающая ряд новых технологий для повышения точности и скорости стрельбы."
 r56rp_ship_heavy_battery_quad_4:0 "Пушки в четыре раза 40,6 см"
 r56rp_ship_heavy_battery_quad_4_short:0 "Тяжелая четверная батарея IV"
 r56rp_ship_heavy_battery_quad_4_desc:0 "Окончательная эволюция тяжелой огневой мощи, эта тяжелобронированная установка обеспечивает высокую степень точности на больших расстояниях."
 r56rp_ship_GER_heavy_battery_triple_11inch_1:0 "Тройной 28 см SK C/34"
 r56rp_ship_GER_heavy_battery_triple_11inch_1_desc:0 "Предназначенные для обхода англо-германского военно-морского договора, эти пушки жертвуют огневой мощью для увеличения скорости огня."
 r56rp_ship_FRA_heavy_battery_quad_11in:0 "330 мм/50 Модель 1931"
 r56rp_ship_FRA_heavy_battery_quad_11in_desc:0 "Уникальный набор четырехгорных орудий, предназначенных для кораблей класса Dunkerque"
 ship_super_heavy_battery_1:0 "Три 46 см пушки"
 ship_super_heavy_battery_1_short:0 "Супертяжелая тройная батарея"
 ship_super_heavy_battery_1_desc:0 "Самая большая пушка, когда-либо установленная на корабле, эти массивные пушки были предназначены для проникновения в любую возможную броню на любом расстоянии."
 r56rp_ship_super_heavy_battery_twin_1:0 "Близнецы 46 см пушки"
 r56rp_ship_super_heavy_battery_twin_1_short:0 "Супертяжелая двойная батарея V"
 r56rp_ship_super_heavy_battery_twin_1_desc:0 "Самая большая пушка, когда-либо установленная на корабле, эти массивные пушки были предназначены для проникновения в любую возможную броню на любом расстоянии."
 r56rp_ship_super_heavy_battery_quad_1:0 "46 см пушки"
 r56rp_ship_super_heavy_battery_quad_1_short:0 "Супертяжелая четырехместная батарея V"
 r56rp_ship_super_heavy_battery_quad_1_desc:0 "Самая большая пушка, когда-либо установленная на корабле, эти массивные пушки были предназначены для проникновения в любую возможную броню на любом расстоянии."
