l_russian:
 autonomous_state:0 "Автономное государство"
 semi_autonomous_state:0 "Полуавтономное государство"
 SPA_a_great_spain:0 "Великая Испания"
 SPA_a_great_spain_desc:1 "Молодая Вторая республика не справилась со своими обязанностями по защите религии, семьи и собственности. Пока левые осаждают нашу христианскую цивилизацию, Испанская конфедерация автономных правых встанет на её защиту и подарит Испании подлинное единство и новый дух. Парламент подчинится воле народа — или мы его упраздним."
 SPA_hand_over_the_ceda_campaign_chest:0 "Отдать фонд финансирования кампании CEDA"
 SPA_hand_over_the_ceda_campaign_chest_desc:1 "После избирательной кампании у нас остались значительные средства. Если парламент отвергнет наш голос, мы должны подготовиться к его устранению. Мы передадим избирательный фонд Испанской конфедерации автономных правых дальновидным представителям армии, чтобы они смогли подготовить восстание против левых."
 SPA_negotiate_carlist_support:0 "Обсудить возможность карлистской поддержки"
 SPA_negotiate_carlist_support_desc:1 "У нашего дела есть союзники — нужно лишь обратиться к ним. Антиклерикальные настроения левых настроили против республики карлистов, которые давно готовятся к столкновению с ней. Если мы заручимся их поддержкой, наше восстание значительно усилится."
 SPA_negotiate_carlist_support_tt:1 "С началом гражданской войны получить 5 хорошо обученных дивизий с §Y3 пехотными§! батальонами.\n"
 SPA_negotiate_carlist_support_tt_2:0 "§RЭти дивизии будут расформированы после окончания гражданской войны, если Испания не станет карлистской!§!\n"
 SPA_the_army_of_africa:0 "Армия Африки"
 SPA_the_army_of_africa_desc:1 "Ключом к победе в грядущей борьбе станет закалённая Африканская армия. Мы должны обеспечить её верность нашему делу, разработать планы молниеносного захвата Северной Африки, а затем подготовить переброску этих опытных войск на материк, где они смогут склонить чашу весов в нашу пользу."
 SPA_the_army_of_africa_tt:0 "С началом гражданской войны получить 5 хорошо обученных дивизий с §Y7 пехотными§! и §Y2 артиллерийскими§! батальонами, ротами §Yразведки§! и §Yинженеров§!, а также гарантированный контроль над §Y[290.GetName]§!.\n"
 SPA_secure_the_northern_garrisons:0 "Заполучить северные гарнизоны"
 SPA_secure_the_northern_garrisons_desc:1 "С помощью надлежащего «убеждения» мы заручимся поддержкой командиров гарнизонов на севере. Одновременное и своевременное восстание даст нам прочную базу для войны против левых, если первоначальная попытка переворота провалится."
 SPA_secure_the_northern_garrisons_tt:1 "Повышает §Yконтроль над гарнизоном§! до §Gполного§! в регионах §Y[171.GetName]§!, §Y[174.GetName]§!, §Y[788.GetName]§!, §Y[791.GetName]§!, §Y[176.GetName]§!, §Y[166.GetName]§! и §Y[172.GetName]§!.\n\nНационалисты начнут гражданскую войну, контролируя эти провинции, если их §Yконтроль над гарнизоном§! там будет не ниже §Oслабого§!.\n"
 SPA_sin_paquito:0 "Sin Paquito"
 SPA_sin_paquito_desc:1 "Правительство, опасаясь возможной нелояльности Франсиско Франко, отправило его командовать войсками на Канарских островах. Однако, несмотря на наши приглашения, он так и не пообещал нам поддержку и лишь тянет время из-за своей нерешительности. Если «Мисс Канарские острова — 1936» не решится присоединиться к нам, мы обойдёмся без него."
 SPA_con_paquito:0 "Con Paquito"
 SPA_con_paquito_desc:1 "Нашему делу нужны сильные лидеры, а Франсиско Франко пользуется верностью прославленной Африканской армии. Чтобы восстание увенчалось успехом, мы должны заручиться его поддержкой, несмотря на его колебания, хотя это, вероятно, обойдётся нам недёшево..."
 SPA_con_paquito_tt:1 "С началом гражданской войны §YФрансиско Франко§! становится фельдмаршалом националистов.\n"
 SPR_the_popular_front:0 "Народный фронт"
 SPR_the_popular_front_desc:1 "Опасность, которую фашизм и религиозные предрассудки представляют для наших личных свобод, чрезвычайно велика. Мы должны создать широкий фронт политических партий, объединённых против правых. Только сплотившись, мы сможем остановить их наступление и спасти республику."
 SPR_secure_the_guardia_de_asalto:0 "Заполучить боевую гвардию"
 SPR_secure_the_guardia_de_asalto_desc:1 "Поляризация общества усиливается, а вместе с ней растёт и насилие. Мы должны обеспечить верность штурмовой гвардии — хорошо обученного тяжёлого полицейского резерва. Если насилие продолжит нарастать, она окажется бесценной."
 SPR_secure_the_guardia_de_asalto_tt:1 "С началом гражданской войны получить 3 обученные дивизии с §Y6 пехотными§! батальонами. Националисты получат 6 плохо обученных дивизий с §Y3 пехотными§! батальонами.\n"
 SPR_secure_the_guardia_de_asalto_tt_2:0 "С началом гражданской войны получить 5 обученных дивизий с §Y6 пехотными§! батальонами. Националисты получат 10 плохо обученных дивизий с §Y3 пехотными§! батальонами.\n"
 SPR_secure_the_guardia_get_both_types_tt:0 "§RЕсли не выбран ни один из фокусов, националисты получат оба типа дивизий!§!\n"
 SPR_secure_the_guardia_civil:0 "Заполучить гражданскую гвардию"
 SPR_secure_the_guardia_civil_desc:1 "Экстремистские элементы продолжают нарушать общественный порядок, а на передовой борьбы с беспорядками стоит гражданская гвардия. Если мы намерены остановить насилие и сохранить контроль, обеспечение верности национальной полиции должно стать нашим приоритетом."
 SPR_secure_the_guardia_civil_tt:1 "С началом гражданской войны получить 6 плохо обученных дивизий с §Y3 пехотными§! батальонами. Националисты получат 3 обученные дивизии с §Y6 пехотными§! батальонами.\n"
 SPR_secure_the_guardia_civil_tt_2:0 "С началом гражданской войны получить 10 плохо обученных дивизий с §Y3 пехотными§! батальонами. Националисты получат 5 обученных дивизий с §Y6 пехотными§! батальонами.\n"
 SPR_train_the_union_youth:0 "Обучить молодёжь из профсоюзов"
 SPR_train_the_union_youth_desc:1 "Из армии доносятся тревожные слухи о нелояльности, и мы должны готовиться к худшему. Мы организуем ускоренные курсы обращения с оружием и основ военной тактики для самых преданных молодых сторонников, чтобы при необходимости их можно было немедленно вооружить."
 SPR_train_the_union_youth_tt:1 "С началом гражданской войны получить 5 хорошо обученных дивизий с §Y3 пехотными§! батальонами.\n"
 SPR_enlarge_the_weapon_caches:0 "Увеличить схроны с оружием"
 SPR_enlarge_the_weapon_caches_desc:1 "Ещё до забастовки астурийских шахтёров 1934 года по всей стране тайно создавались склады оружия — на случай неизбежной необходимости защищать наши свободы силой. В нынешний кризис нам следует расширить их."
 SPR_enlarge_the_weapon_caches_tt:1 "С началом гражданской войны сохранить §Y80%§! снаряжения вместо §Y50%§!.\n"
 SPR_distribute_arms_to_the_people:0 "Раздать оружие народу"
 SPR_distribute_arms_to_the_people_desc:1 "Нелояльность армии теперь почти не вызывает сомнений, и ясно, что мы не можем полагаться на неё в защите ценностей республики. Следует начать раздавать оружие тем, кому дороги интересы республики, чтобы они стали первой линией обороны против возможного мятежа."
 SPR_distribute_arms_to_the_people_tt:0 "С началом гражданской войны получить 10 необученных дивизий с §Y3 пехотными§! батальонами.\n"
 SPR_disband_the_army:0 "Расформировать армию"
 SPR_disband_the_army_desc:1 "Мы больше не можем игнорировать признаки нелояльности в армии. Даже если это подтолкнёт заговорщиков к действию, у нас нет выбора: нужно немедленно попытаться распустить армию и перехватить инициативу."
 SPR_disband_the_army_tt:2 "§GСнижает долю армии, которая в начале гражданской войны перейдёт на сторону националистов, с §Y50%§! до §Y20%§!, а число их дивизий Африканской армии — с §Y5§! до §Y3§!.§!\nЛояльные §Y80%§! армии будут §Rрасформированы§!, но их снаряжение вернётся на склады.\n\nЕсли этот фокус не выбран, правительство распустит армию уже после начала гражданской войны, не получив дополнительных преимуществ.\n\n§RОстатки нелояльной армии немедленно развяжут гражданскую войну!§!\n"
 SPA_the_phalanx_ascendant:0 "Фаланга набирает популярность"
 SPA_the_phalanx_ascendant_desc:2 "Настало время возвышения Фаланги. Обречённая республика переживает последние дни, и хотя борьба будет долгой и тяжёлой, мы уже сделали первые шаги к возрождению Испанской империи."
 SPA_bolster_offensive_infrastructure:0 "Усилить инфраструктуру для атаки"
 SPA_bolster_offensive_infrastructure_desc:1 "Главное препятствие для наших наступательных планов — неспособность снабжать передовые части в достаточном объёме. Улучшение инфраструктуры на этих направлениях значительно усилит наши наступательные возможности."
 SPA_bolster_offensive_infrastructure_tt:0 "Требуется гражданская война в Испании.\nДобавляет §Y1 уровень инфраструктуры§! в 3 случайных прифронтовых регионах.\n"
 SPA_the_fifth_column:0 "Пятая колонна"
 SPA_the_fifth_column_desc:1 "По словам Эмилио Молы: «Когда мои четыре колонны подойдут к Мадриду, пятая колонна сторонников восстанет внутри города и подорвёт оборону республиканцев изнутри». Мы организуем такие «пятые колонны» во всех городах на нашем пути, что даст нам решающее преимущество."
 SPA_the_fifth_column_tt:0 "Открывает решения §YАктивировать пятую колонну§!, позволяющие поднимать небольшие восстания на территории противника.\n"
 SPA_emergency_munitions_corporations:0 "Корпорации по срочной поставке вооружения"
 SPA_emergency_munitions_corporations_desc:1 "Чтобы поддерживать достаточное снабжение наших храбрых солдат, военные усилия необходимо немедленно усилить. Мы организуем тех, кто не сражается, во временные мастерские, производящие для войск самые необходимые вещи."
 SPA_the_corpo_truppe_volontarie:1 "Итальянский экспедиционный корпус"
 SPA_the_corpo_truppe_volontarie_desc:1 "Наши сторонники в государстве [ITA.GetNameDef] прислали нам Корпус добровольческих войск, но для победы его необходимо значительно расширить. Мы отправим дипломатическую миссию в [ITA.GetNameDef], чтобы отстаивать наше дело и добиться дополнительной военной помощи."
 SPA_the_condor_legion:0 "Легион «Кондор»"
 SPA_the_condor_legion_desc:1 "Наши сторонники в государстве [GER.GetNameDef] прислали нам легион «Кондор», но для победы его необходимо значительно расширить. Мы отправим дипломатическую миссию в [GER.GetNameDef], чтобы отстаивать наше дело и добиться дополнительной военной помощи."
 SPA_equipment_shipments:0 "Поставки снаряжения"
 SPA_equipment_shipments_desc:1 "Для победы нам нужны не только солдаты. Наши зарубежные сторонники должны понять, насколько остро мы нуждаемся в снаряжении и как именно они могут нам помочь."
 SPA_obtain_training_staff:0 "Получить обучающий персонал"
 SPA_obtain_training_staff_desc:1 "Пусть это и заденет нашу гордость, мы должны признать превосходный опыт иностранных сторонников в военном деле. Следует пригласить их экспертов в Испанию, чтобы они обучили наших офицеров и войска и дали нам необходимое преимущество над республиканцами."
 SPA_doctrinal_advancements:0 "Улучшения доктрин"
 SPA_doctrinal_advancements_desc:1 "За последние десятилетия наши зарубежные сторонники добились значительных успехов в военной мысли и доктрине. Возможно, мы убедим их поделиться идеями, чтобы испытать их в нынешней войне."
 SPA_secure_the_national_defense_council:0 "Заполучить национальный совет по обороне"
 SPA_secure_the_national_defense_council_desc:1 "В отсутствие единого лидера наше движение возглавляет хунта военных и гражданских деятелей с лишь отчасти совпадающими целями. Чтобы навязать свою волю и добиться заслуженного Испанией возрождения, мы должны установить господство над этой разношёрстной и склонной к раздорам организацией."
 SPA_suspend_the_constitution:0 "Приостановить действие конституции"
 SPA_suspend_the_constitution_desc:1 "Мы не добьёмся прогресса, пока следуем конституции, неоднократно доказавшей свою несостоятельность и слабость. Мы приостановим её действие, открыв путь переходному военному правительству, которое проведёт нас через необходимое братоубийство, а затем уступит место новому сильному авторитарному режиму."
 SPA_primo_de_rivera_prisoner_exchange:0 "Обмен пленного на Примо де Риверу"
 SPA_primo_de_rivera_prisoner_exchange_desc:1 "Основатель Фаланги Хосе Антонио Примо де Ривера, сын прежнего диктатора Мигеля Примо де Риверы, был заключён в тюрьму ещё до начала гражданской войны. Республиканцы выразили готовность обменять пленников, и если мы хотим вернуть своего идеологического лидера, следует согласиться."
 SPA_eliminate_the_carlists:0 "Искоренить карлистов"
 SPA_eliminate_the_carlists_desc:1 "Наше видение Испании несовместимо с карлистским. Цепляясь за угасающую династию, ведомые слабыми лидерами и религиозным фанатизмом, они угрожают самому будущему Испании. Мы должны искоренить этих смутьянов, чтобы подлинно сильные лидеры объединили страну железной рукой."
 SPR_carlist_uprising_flag:0 "Карлисты подняли восстание."
 SPA_absorb_carlist_remnants:0 "Поглотить остатки карлистов"
 SPA_absorb_carlist_remnants_desc:1 "Карлизм почти разгромлен, но менее фанатичные представители движения ещё могут пригодиться на фронте. Нельзя упускать такую возможность: каждый боеспособный человек приблизит достижение целей Фаланги."
 SPA_establish_the_directory:0 "Основать Директорию"
 SPA_establish_the_directory_desc:1 "Эмилио Мола, главный архитектор восстания, заручился достаточной поддержкой хунты и политических лидеров Фаланги, чтобы перейти к следующему этапу: учреждению Директории, которая будет управлять всеми аспектами гражданской войны до полного подчинения страны."
 SPA_establish_the_directory_tt:0 "§Y[ROOT.GetName]§! будет называться §YИспанская директория§!\n"
 SPA_a_one_party_state:0 "Однопартийное государство"
 SPA_a_one_party_state_desc:1 "Демократия, вопреки уверениям республиканцев, не является самоцелью — это лишь средство вырвать полный контроль над государством из рук слабых и недостойных. Мы распустим все остальные партии, чтобы люди с твёрдым видением могли беспрепятственно строить Великую Испанию."
 SPA_a_one_party_state_tt:0 "Половина совокупной поддержки §Yнефашистских§! партий накладывается как штраф к §Rстабильности§!:\n"
 SPA_expand_conscription:0 "Расширить призыв в армию"
 SPA_expand_conscription_desc:1 "Гражданская война истощает страну, но мы не можем ослабить давление на республиканцев. Нужен новый натиск, подкреплённый новой кампанией по набору добровольцев."
 SPA_safeguard_the_freedom_of_worship:0 "Гарантировать свободу вероисповедания"
 SPA_safeguard_the_freedom_of_worship_desc:1 "Республиканцы угрожают самой вере в Бога, и мы должны показать всем, что остаёмся последним оплотом христианства. Мы защитим право и свободу богослужения для всех христиан, а каждый желающий сможет присоединиться к нашей борьбе."
 SPA_prepare_the_pyrenees_defenses:0 "Подготовить оборону Пиренеев"
 SPA_prepare_the_pyrenees_defenses_desc:1 "До нас дошли слухи, что республиканцы обратились за помощью к государству [FRA.GetNameDef]. Это маловероятно, но мы не можем рисковать и оставлять северную границу без защиты. На случай вмешательства [FRA.GetAdjective] необходимо немедленно начать оборонительные приготовления."
 SPA_prepare_the_pyrenees_defenses_tt:0 "Разместить укрепления §Y2-го уровня§! в провинциях на французской границе в регионах §YСтрана Басков§!, §YНаварра§!, §YЗападный Арагон§!, §YВосточный Арагон§! и §YКаталония§!.\n"
 SPA_develop_all_talent:0 "Развить все таланты"
 SPA_develop_all_talent_desc:1 "Каждому достойному будет обеспечен доступ к высшему образованию и необходимое финансирование для развития идей, способных заинтересовать государство. Инвестиции в новые научно-исследовательские учреждения, несомненно, принесут плоды во множестве областей."
 SPA_regional_agrarian_commissions:0 "Региональные аграрные комиссии"
 SPA_regional_agrarian_commissions_desc:1 "Сельская местность разорена войной. Чтобы население не голодало, мы немедленно создадим аграрные комиссии в каждом регионе. Они повысят производительность уцелевших пахотных земель и позволят прокормить народ."
 SPA_the_national_syndicalist_state:0 "Национальное синдикалистское государство"
 SPA_the_national_syndicalist_state_desc:1 "Гражданская война окончена, и временному военному правительству пора отказаться от власти, чтобы истинные лидеры Фаланги возвестили новую эпоху Испании."
 SPA_the_national_syndicalist_state_tt:0 "§Y[ROOT.GetName]§! будет называться §YИспанская империя§!\n"
 SPA_syndicalize_production:0 "Синдикализировать производство"
 SPA_syndicalize_production_desc:1 "Наше движение отличается и от капитализма, и от коммунизма. Вместо них мы создадим национальные синдикаты, где работники и работодатели смогут совместно повышать производительность ради блага всей Испании."
 SPA_strengthen_the_supreme_reality_of_spain:0 "Укрепить высшую реальность Испании"
 SPA_strengthen_the_supreme_reality_of_spain_desc:1 "Слишком долго сепаратизм, инакомыслие и местная автономия ослабляли испанское государство. Мы покончим с этими нелепыми идеями и создадим новую реальность единой Испании, к которой сможет принадлежать и в которую сможет внести вклад каждый — независимо от группы или класса."
 SPR_recovering_from_civil_war_focus_tt:0 "Открывает решения §YВосстановление после гражданской войны§!, позволяющие устранить §Yсопротивление партизан§! в регионах, поддержавших ваших врагов в гражданской войне.\n"
 SPA_glory_and_wealth_on_the_sea_lanes:0 "Слава и богатство на морях"
 SPA_glory_and_wealth_on_the_sea_lanes_desc:1 "Судьба Испании всегда лежала за океанами. Нас ждут слава и богатство — нужно лишь вновь установить контроль над морскими путями, как в былые времена."
 SPA_improve_domestic_naval_facilities:0 "Улучшить внутренние морские базы"
 SPA_improve_domestic_naval_facilities_desc:1 "Великому флоту нужна великая инфраструктура. Требуются новые верфи и сооружения, и их строительство следует начать немедленно."
 SPA_a_great_maritime_power:0 "Великая морская держава"
 SPA_a_great_maritime_power_desc:1 "Когда-то испанской мощи боялись на всех океанах. Хотя за столетия наше положение ухудшилось, связь с морем сохранилась. Мы примем своё морское наследие и вернём присутствие на водных путях мира."
 SPA_commerce_protection:0 "Защита коммерции"
 SPA_commerce_protection_desc:1 "Мировая торговля важнее, чем когда-либо, для здоровой экономики. Способность защищать собственное торговое судоходство укрепит наши позиции в любом будущем конфликте."
 SPA_exemplify_the_art_and_science_of_warfare:0 "Проиллюстрировать искусство и науку войны"
 SPA_exemplify_the_art_and_science_of_warfare_desc:1 "Война — в равной мере наука и искусство, и мы должны предоставить тем, кто ею занимается, инструменты и учреждения для развития их идей."
 SPA_the_will_to_empire:1 "Воля к созданию империи"
 SPA_the_will_to_empire_desc:1 "Мы полны решимости построить империю. Мы утверждаем, что историческое предназначение Испании заключается в империи. Мы требуем для Испании ведущего положения в Европе и провозглашаем её духовной осью, объединяющей испаноязычный мир."
 SPA_unite_iberia:0 "Объединить Иберию"
 SPA_unite_iberia_desc:1 "Португалия и Испания когда-то были едины, и некоторые считают, что так должно стать вновь. Мы согласны. Объединение Иберии неизмеримо укрепит наше положение в мире."
 SPA_absorb_the_portuguese_empire:0 "Поглотить Португальскую империю"
 SPA_absorb_the_portuguese_empire_desc:0 "Португальская колониальная империя является частью нашей новой иберийской гегемонии, даже если сами португальцы этого пока не понимают. Это легко исправить."
 SPA_claim_the_aragonese_possessions:0 "Заявить права на арагонские владения"
 SPA_claim_the_aragonese_possessions_desc:1 "Королевство Арагон некогда простиралось далеко по Средиземноморью. Испания как историческая преемница Арагонского королевства по праву заслуживает возвращения этих земель. Мы заявим о своих правах."
 SPA_reclaim_spanish_africa:1 "Расширить Испанскую Африку"
 SPA_reclaim_spanish_africa_desc:1 "Нет причин считать нынешние границы наших североафриканских владений неизменными. Учитывая нынешнюю слабость Франции, лучшего момента для предъявления претензий может не представиться."
 SPA_reassert_american_dominance:0 "Утвердить американское доминирование"
 SPA_reassert_american_dominance_desc:1 "За столетие после обретения независимости различные страны Латинской Америки только ссорились между собой. Они забыли о силе нашего культурного единства, и мы напомним им, что именно Испания — ось, вокруг которой они вращаются."
 SPA_reassert_american_dominance_tt:0 "Открывает решения §YВосстановить господство в Америке§!, позволяющие мирно подчинять более слабые американские страны.\n"
 SPA_retake_the_americas:0 "Вернуть американский континент"
 SPA_retake_the_americas_desc:2 "Крупнейшие державы Латинской Америки не намерены добровольно принять наше руководство, а старые владения у государства [USA.GetNameDef] не вернуть без боя. Испытание велико, но воплощение имперских амбиций близко — нужно лишь его преодолеть."
 SPA_embrace_the_spanish_destiny:0 "Принять испанскую судьбу"
 SPA_embrace_the_spanish_destiny_desc:1 "Испанию ждёт особая судьба: дать всем испанцам свободу принадлежать к сильной и независимой нации, вернуть себе ведущее положение в мире вопреки сопротивлению врагов и защитить христианский образ жизни."
 SPA_the_national_and_popular_army_of_spain:0 "Национальная и народная армия Испании"
 SPA_the_national_and_popular_army_of_spain_desc:1 "Военная мощь новой испанской нации будет организована в национальную и народную армию, в которой каждый трудоспособный мужчина удостоится чести служить."
 SPA_mandatory_pre_military_training:0 "Обязательная начальная военная подготовка"
 SPA_mandatory_pre_military_training_desc:1 "Чтобы подготовить мужчин к службе в армии, все они пройдут обязательную довоенную подготовку."
 SPA_all_shall_serve:0 "Все должны служить"
 SPA_all_shall_serve_desc:1 "Новая Испания выражает волю всех испанцев, поэтому каждый должен получить возможность выполнить свой долг по её защите. Следует соответственно расширить требования к призывникам."
 SPA_the_army_of_africa_model:0 "Модель «Армия Африки»"
 SPA_the_army_of_africa_model_desc:1 "Успех Африканской армии в гражданской войне не остался незамеченным. Наша новая армия должна соответствовать установленному ею стандарту, поэтому мы построим её по этому образцу."
 SPA_equipment_modernization:0 "Модернизация оборудования"
 SPA_equipment_modernization_desc:1 "Новой армии подходит только лучшее вооружение, поэтому мы должны разработать новые образцы."
 SPA_artillery_modernization:0 "Модернизация артиллерии"
 SPA_artillery_modernization_desc:1 "Артиллерия играет ключевую роль в современной войне, поэтому следует заменить устаревшие орудия новыми и более мощными моделями."
 SPA_expand_the_air_branch:0 "Расширить ВВС"
 SPA_expand_the_air_branch_desc:1 "Гражданская война ясно показала важность авиации. Если мы хотим стать силой, с которой считаются, это направление необходимо развивать."
 SPA_expand_the_special_forces:0 "Расширить войска спецназначения"
 SPA_expand_the_special_forces_desc:1 "Горстка специалистов способна добиться того, что не под силу множеству обычных пехотинцев. Мы начнём специальную подготовку для отдельных задач, чтобы при необходимости располагать нужными средствами."
 SPA_motorization:0 "Моторизация"
 SPA_motorization_desc:1 "Массовая моторизация армии открывает широкий спектр новых тактических и стратегических возможностей. Мы не можем отказаться от такого преимущества."
 SPA_an_armored_corps:0 "Бронетанковый корпус"
 SPA_an_armored_corps_desc:1 "Испании нужен бронетанковый корпус, чтобы не отстать от соседей."
 SPA_join_the_axis:0 "Присоединиться к странам Оси"
 SPA_join_the_axis_desc:1 "Будущее Испании связано со свержением существующего мирового порядка. Мы должны объединиться с единомышленниками и сложить нашу силу с их силой."
 SPA_fascist_economic_aid:0 "Экономическая помощь от фашистов"
 SPA_fascist_economic_aid_desc:1 "Гражданская война разорила страну, но, возможно, новые союзники согласятся помочь в восстановлении."
 SPA_facilitate_pyrenees_freight_transports:0 "Способствовать работе пиренейских грузовых транспортов"
 SPA_facilitate_pyrenees_freight_transports_desc:1 "Поставки новых материалов с севера необходимо облегчить, чтобы удовлетворить спрос, поэтому мы расширим железные дороги, проходящие у Пиренеев."
 SPA_facilitate_pyrenees_freight_transports_tt:1 "Добавляет максимальную §Yинфраструктуру§! в регионах §YМадрид§!, §YГвадалахара§!, §YВосточный Арагон§!, §YКаталония§!, §YБургос§! и §YСтрана Басков§!."
 SPA_improve_cross_country_railways:0 "Улучшить железные дороги"
 SPA_improve_cross_country_railways_desc:1 "Расширение национальной железнодорожной сети не только создаст необходимые рабочие места, но и облегчит перемещение войск и припасов, став предметом гордости всех испанцев."
 SPA_support_the_war_industry:0 "Поддержать военную промышленность"
 SPA_support_the_war_industry_desc:1 "Прежде чем расширять военную промышленность, необходимо развить вспомогательные отрасли, от которых она зависит."
 SPA_italian_shipbuilding_expertise:0 "Итальянский судостроительный опыт"
 SPA_italian_shipbuilding_expertise_desc:1 "Пригласив итальянских специалистов, мы улучшим возможности кораблестроения и сможем легче расширять флот, особенно за счёт крупнейших кораблей."
 SPA_the_duty_to_work:0 "Обязанность трудиться"
 SPA_the_duty_to_work_desc:1 "Все испанцы обязаны служить государству. Если долг не требует сражаться на передовой, он требует снабжать и оснащать тех, кто сражается."
 SPA_expand_the_war_industry:0 "Развить военную промышленность"
 SPA_expand_the_war_industry_desc:1 "Могущественному государству необходима крупная военная промышленность, чтобы проявлять свою силу, а наша вполне может стать больше."
 SPA_national_recovery:0 "Национальное восстановление"
 SPA_national_recovery_desc:1 "Пришло время объединить усилия всей страны для восстановления после разрушений гражданской войны."
 SPA_autarky:0 "Автаркия"
 SPA_autarky_desc:1 "Чтобы наше положение не зависело от чужой воли, экономика должна стать полностью самодостаточной."
 SPA_spanish_austerity:0 "Испанский аскетизм"
 SPA_spanish_austerity_desc:1 "Хотя это нежелательно, политика строгой экономии необходима, чтобы высвободить средства для восстановления страны."
 SPA_reduce_reliance_on_foreign_resources:0 "Снизить зависимость от иностранных ресурсов"
 SPA_reduce_reliance_on_foreign_resources_desc:1 "Зависимость от других — слабость, которой могут воспользоваться потенциальные враги. Мы должны добиваться самообеспечения всеми возможными ресурсами."
 SPA_reduce_reliance_on_foreign_resources_tt:0 "Открывает уникальные решения §YРазведка месторождений§!, позволяющие расширять существующие и разрабатывать новые месторождения ресурсов на материке.\n"
 SPA_expand_the_axis_gold_trade:0 "Расширить торговлю золотом в странах Оси"
 SPA_expand_the_axis_gold_trade_desc:1 "Страны Оси отчаянно нуждаются в торговле под давлением союзной блокады. Их золото течёт в нашу страну, через которую они получают природные ресурсы от нас и других нейтральных государств. Мы извлекаем огромную выгоду — возможно, стоит поощрить это ещё сильнее..."
 SPA_ensure_agricultural_self_sufficiency:0 "Обеспечить сельскохозяйственную самодостаточность"
 SPA_ensure_agricultural_self_sufficiency_desc:1 "Мы должны избавиться от зависимости от зарубежного продовольствия: сельское хозяйство следует расширить настолько, чтобы оно могло прокормить всю страну."
 SPA_unify_the_nationalist_front:0 "Объединить националистический фронт"
 SPA_unify_the_nationalist_front_desc:1 "Мятежники, или «националисты», как они стали себя называть, представляют собой разрозненные группы, объединённые лишь желанием свергнуть республику. Путь к успеху лежит через отказ от внутренних распрей и сосредоточение на борьбе с общим врагом."
 SPA_save_the_alcazar:0 "Спасти алькасар!"
 SPA_save_the_alcazar_desc:1 "Алькасар в Толедо всё ещё удерживают верные нам силы, но они находятся в осаде! Их освобождение, пусть и не имеющее большого стратегического значения, станет крупной пропагандистской победой и укрепит положение Франсиско Франко как фактического главы военной хунты."
 SPA_martyrdom_for_primo_de_rivera:0 "Роль мученика для Примо де Риверы"
 SPA_martyrdom_for_primo_de_rivera_desc:1 "Хосе Антонио Примо де Ривера, основатель Фаланги, находится в заключении ещё с довоенных времён. Нам предложили обмен пленниками, но, возможно, этот потенциальный политический соперник принесёт делу больше пользы как казнённый мученик... Мы позаботимся, чтобы переговоры об обмене «провалились»."
 SPA_caudillo_of_spain:0 "Испанский каудильо"
 SPA_caudillo_of_spain_desc:1 "Достижения Франсиско Франко говорят сами за себя, а его возможные соперники безвременно ушли из жизни. В хунте растёт поддержка его назначения официальным лидером — осталось лишь сделать заявление."
 SPA_extol_the_martyrs_of_the_war:0 "Превознести жертвы войны"
 SPA_extol_the_martyrs_of_the_war_desc:1 "Тех, кто отдал жизнь за наше дело, следует помнить и чтить за их жертву. Их поступки должны стать примером для всех."
 SPA_consolidate_the_north:0 "Объединить север"
 SPA_consolidate_the_north_desc:1 "Первым шагом к победе должно стать завоевание и укрепление северных территорий. После этого мы сможем перейти к другим уязвимым участкам республиканского фронта."
 SPA_foment_a_carlist_split:0 "Подстрекать карлистский раскол"
 SPA_foment_a_carlist_split_desc:1 "Карлисты внутренне расколоты не меньше самого националистического фронта. Сталкивая их лидеров друг с другом, мы ослабим их влияние и сможем заключать отдельные соглашения с различными группами."
 SPA_a_methodical_approach:0 "Методичный подход"
 SPA_a_methodical_approach_desc:1 "Ключ к победе в гражданской войне — не дерзкие манёвры и безрассудные атаки, а тщательное планирование и продуманные точные удары."
 SPA_tackle_the_vulnerable_fronts:0 "Проверить уязвимые фронты"
 SPA_tackle_the_vulnerable_fronts_desc:1 "На отдельных участках вражеского фронта обнаружены слабые места. Следует сосредоточиться на них, чтобы наши наступления были максимально эффективны."
 SPA_tackle_the_vulnerable_fronts_tt:0 "Улучшает решения §YНаступления в гражданской войне§!, предоставляя временный боевой бонус против врага при начале наступления.\n"
 SPA_integrate_the_requetes:0 "Интегрировать рекете"
 SPA_integrate_the_requetes_desc:1 "Карлистских рекете, наиболее близких нашим взглядам, следует теснее интегрировать в вооружённые силы. Их опыт и подготовка будут бесценны в предстоящей борьбе."
 SPA_portuguese_aid:0 "Португальская помощь"
 SPA_portuguese_aid_desc:1 "Мы должны принимать помощь, откуда бы она ни пришла. Португалия, приютившая многих наших лидеров, вынужденных бежать после провала восстания 1932 года, возможно, согласится оказать нам материальную поддержку, если мы обратимся с просьбой. Это может стать основой для ещё более тесного сотрудничества в будущем."
 SPA_the_iberian_pact:0 "Иберийский пакт"
 SPA_the_iberian_pact_desc:1 "Целостность наших двух государств зависит от добрых отношений между ними. Следует предложить соглашение, согласно которому Испания и Португалия всегда будут вступать в одну и ту же сторону любой мировой войны или присоединяться к одному союзу. Единая Иберия — сильная Иберия!"
 SPA_the_iberian_pact_tt:0 "Это соглашение обязывает каждую сторону вступить в любую фракцию или на ту же сторону войны, к которой присоединилась другая сторона.\n"
 SPA_the_iberian_pact_tt_2:0 "§R[POR.GetNameDefCap] должна одобрить соглашение, чтобы бонусы вступили в силу.§!\n"
 SPA_the_latin_bloc:0 "Латинский блок"
 SPA_the_latin_bloc_desc:1 "В мире формируются блоки великих держав. Вместо того чтобы вмешиваться в растущее между ними противостояние, нам следует создать собственный блок с культурно и идеологически близкими государствами — латинскими странами Средиземноморья."
 SPA_utilize_the_intellectuals:0 "Использовать интеллектуалов"
 SPA_utilize_the_intellectuals_desc:1 "Людям с выдающимися интеллектуальными способностями следует предоставить ресурсы, необходимые для служения стране там, где наши войска бессильны."
 SPA_banish_the_party_leaders:0 "Изгнать лидеров партии"
 SPA_banish_the_party_leaders_desc:1 "Руководители Фаланги и карлистов всё настойчивее продвигают собственные программы, становясь помехой для нас. Использовав их разобщённость и подорвав их позиции, мы сможем оправдать изгнание этих несговорчивых лидеров и заменить их марионетками, верными Франко."
 SPA_fuse_the_parties:0 "Организовать слияние партий"
 SPA_fuse_the_parties_desc:1 "Необходимая подготовка завершена, и настало время объединить Фалангу и карлистов в единую партию во главе с Франсиско Франко."
 SPA_fuse_the_parties_tt:0 "§Gудалять§! §YНадвигающееся карлистское восстание§! §GМиссия.§!\n"
 SPA_join_the_allies:0 "Присоединиться к союзникам"
 SPA_join_the_allies_desc:1 "Нам ясно, куда качнулся маятник. Мы присоединимся к Союзникам, примем их значительную экономическую помощь и обеспечим себе их благосклонность, когда они неизбежно победят в войне."
 SPA_the_stabilization_plan:0 "План стабилизации"
 SPA_the_stabilization_plan_desc:1 "Мы должны отказаться от неразумной фалангистской мечты об автаркии и несостоятельной экономической политики, проводимой ради неё. Чтобы сравняться в экономическом развитии с остальным миром, следует перейти к либерализации экономики, надеясь вызвать подъём, который принесёт пользу всем испанцам."
 SPA_expand_spanish_bases:0 "Расширить испанские базы"
 SPA_expand_spanish_bases_desc:1 "Империалисты, с которыми мы заключили союз, желают использовать наши базы для распространения своего влияния по всему миру. Чтобы удовлетворить их потребности, мы должны расширить наши континентальные авиационные и военно-морские базы."
 SPA_capitalist_economic_aid:0 "Экономическая помощь от капиталистов"
 SPA_capitalist_economic_aid_desc:1 "Западная экономическая помощь окажется бесценной для восстановления страны после пережитых испытаний."
 SPA_improve_living_standards:0 "Повысить уровень жизни"
 SPA_improve_living_standards_desc:1 "Все должны получить возможность пользоваться плодами экономического подъёма нашей страны, независимо от своего положения."
 SPA_domestic_industrial_developments:0 "Развитие внутренней промышленности"
 SPA_domestic_industrial_developments_desc:1 "Западные нововведения можно приспособить к потребностям испанских рабочих, взяв лучшее от обоих миров и ускорив восстановление страны."
 SPA_the_spanish_miracle:0 "Испанское чудо"
 SPA_the_spanish_miracle_desc:1 "План стабилизации превзошёл самые смелые ожидания. Переживаемый нами экономический подъём иначе как чудом не назовёшь!"
 SPA_adopt_the_26_points:0 "Принять 26 пунктов"
 SPA_adopt_the_26_points_desc:1 "Удобным образом удалив из «27 пунктов» Фаланги запрет на объединение политических партий, мы получили «26 пунктов» — подходящий партийный манифест, из которого можно черпать идеи для государственной политики."
 SPA_direct_the_universities:0 "Управлять университетами"
 SPA_direct_the_universities_desc:1 "Таланты, работающие в академической сфере, несомненно, можно эффективнее использовать в целевых исследованиях военного назначения. Мы дадим университетам соответствующие указания."
 SPA_dictator_for_life:0 "Пожизненный диктатор"
 SPA_dictator_for_life_desc:2 "Франко хорошо послужил своей стране. Мы не видим причин менять существующее положение дел и тем более возвращаться к слабой монархии прошлого."
 SPA_invest_in_naval_infrastructure:0 "Инвестировать в морскую инфраструктуру"
 SPA_invest_in_naval_infrastructure_desc:1 "Испании нужны новые военно-морские сооружения для поддержки расширяющегося флота."
 SPA_expand_the_slipways:0 "Расширить стапели"
 SPA_expand_the_slipways_desc:1 "Ранее крупнейшие корабли мы покупали у других государств. Следует расширить собственные стапели, чтобы получить возможность строить такие суда самостоятельно."
 SPA_the_plan_imperial:0 "Имперский план"
 SPA_the_plan_imperial_desc:1 "Мы приступим к грандиозной программе возвращения испанскому флоту статуса одного из крупнейших в мире."
 SPA_restart_small_scale_shipbuilding:0 "Перезапустить мелкомасштабное судостроение"
 SPA_restart_small_scale_shipbuilding_desc:1 "Нашему флоту понадобится множество эскортных судов, которые способны строить небольшие отечественные верфи. Следует поощрять разработку ими новых проектов."
 SPA_la_division_azul:0 "Голубая дивизия"
 SPA_la_division_azul_desc:1 "Хотя коммунистическая угроза в Иберии уничтожена, корень зла всё ещё таится на востоке. Пока другие несут основное бремя боёв, мы должны отправить добровольческую дивизию, чтобы внести свой вклад в борьбу с этой угрозой."
 SPA_the_tangiers_enclave:0 "Танжерский анклав"
 SPA_the_tangiers_enclave_desc:1 "В 1923 году Танжер был объявлен международной зоной под совместным управлением Франции, Испании и Великобритании. Поскольку два наших соуправителя сейчас втянуты в войну, мы должны самостоятельно взять на себя защиту города."
 SPA_the_tangiers_enclave_tt:0 "§RЭто может разгневать других управляющих международной зоны!§!\n"
 SPA_demand_french_north_africa:0 "Потребовать Французскую Северную Африку"
 SPA_demand_french_north_africa_desc:1 "Колонии [FRA.GetAdjective] ослабли после падения метрополии. Мы предложим им свою защиту, подразумевая, что отказ не принимается."
 SPA_restore_the_monarchy:0 "Восстановить монархию"
 SPA_restore_the_monarchy_desc:1 "Временное правительство выполнило своё предназначение, свергнув коммунистов и положив конец Второй республике. Теперь настало время восстановить испанскую монархию!"
 SPA_restore_the_monarchy_tt:0 "§Y[ROOT.GetName]§! будет называться §YКоролевством Испания§!.\n"
 SPA_stamp_out_the_maquis:0 "Искоренить маки"
 SPA_stamp_out_the_maquis_desc:1 "Маки, остатки наших врагов, продолжают партизанскую войну, оспаривая наш контроль над материковой Испанией. Со временем их влияние ослабло, и теперь настал подходящий момент искоренить их раз и навсегда."
 SPA_defenses_against_strategic_bombing:0 "Защита от стратегических бомбардировок"
 SPA_defenses_against_strategic_bombing_desc:1 "Если мы вступим в мировой конфликт, необходимо обеспечить надёжную защиту городов от неизбежных массированных стратегических бомбардировок, которым нас подвергнут будущие враги."
 SPA_defenses_against_invasion:0 "Защита от вторжения"
 SPA_defenses_against_invasion_desc:1 "Береговая линия Испании очень протяжённа, и мы должны сделать всё возможное, чтобы вторжение казалось противнику неприемлемым. Мощные укрепления должны убедить его, что приз не стоит такой цены."
 SPA_defenses_against_invasion_tt:0 "Размещает §Y1 укрепление§! и §Y2 береговых укрепления§! в материковых национальных провинциях с §Yвоенно-морской базой§!.\n"
 SPA_retake_gibraltar:0 "Отвоевать Гибралтар"
 SPA_retake_gibraltar_desc:1 "Прошло более двух столетий с тех пор, как Гибралтар был вырван из гостеприимных объятий Испании. Эта британская язва на лице Иберии не должна существовать дальше."
 SPA_claim_west_africa:0 "Заявить претензии на Западную Африку"
 SPA_claim_west_africa_desc:1 "Французское господство над Западной Африкой совершенно незаслуженно. Этот регион образует естественную географическую связь с нашей колонией в Экваториальной Гвинее и потому должен считаться неотъемлемой частью Испанской колониальной империи."
 SPA_supremacy_of_the_communion:0 "Превосходство традиционалистов"
 SPA_supremacy_of_the_communion_desc:1 "Подобно тому как Бог создал Небо и Землю, Традиционалистская община несомненно хранит ключ к единому будущему Испании. Восстания карлистов XIX века могли быть подавлены, но их дух не был сломлен: верные Вере готовы вновь подняться против Республики."
 SPA_prepare_the_carlist_insurrection:0 "Подготовить карлистский мятеж"
 SPA_prepare_the_carlist_insurrection_desc:1 "Наш союз с Фалангой продиктован необходимостью, и срок его существования уже исчисляется неделями. Мы должны ударить по мнимым союзникам раньше, чем они ударят по нам, и уничтожить их порочную идеологию прежде, чем она укоренится в сознании народа."
 SPA_prepare_the_carlist_insurrection_tt:1 "Открывает решения §YПодготовка восстания карлистов§!, позволяющие закрепить контролируемые регионы за карлистской стороной восстания.\n\nКроме того, закрепляет §YБургос§! и §YНаварру§! за карлистами, если они находятся под контролем."
 SPA_contact_the_union_militar_espanola:0 "Связаться с Испанским военным союзом"
 SPA_contact_the_union_militar_espanola_desc:1 "Испанский военный союз — крупное тайное общество офицеров, участвовавших в заговоре против Республики, — включает немало людей, сочувствующих нашему делу. Следует связаться с ними и заручиться поддержкой как можно большего числа лидеров к моменту выступления."
 SPA_head_the_junta_nacional:0 "Возглавить Junta Nacional"
 SPA_head_the_junta_nacional_desc:1 "Высшему исполнительному органу карлистской военной машины — Национальной карлистской военной хунте — нужен лидер, способный объединить многочисленные региональные хунты. Этим лидером может стать Мануэль Фаль Конде."
 SPA_unite_the_requetes:0 "Объединить рекете"
 SPA_unite_the_requetes_desc:1 "Слишком долго региональные карлистские хунты действовали независимо друг от друга. Мы должны объединить их и их ополчения — рекете, — чтобы лучше организовать военные усилия карлистов и устранить внутренние разногласия."
 SPA_the_war_in_the_north:0 "Война на севере"
 SPA_the_war_in_the_north_desc:1 "Север всегда был сердцем карлистского движения. Любое восстание должно прежде всего обеспечить контроль над ним как над нашей оперативной базой."
 SPA_revive_the_spirit_of_the_carlist_wars:0 "Оживить дух карлистстких войн"
 SPA_revive_the_spirit_of_the_carlist_wars_desc:1 "Карлистские войны XIX века закончились для нашего дела прискорбными поражениями, но дух сопротивления жив и поныне. Мы не успокоимся, пока законный наследник не займёт испанский престол и не обеспечит защиту христианской веры для всех испанцев."
 SPA_arms_modernization:0 "Модернизация вооружения"
 SPA_arms_modernization_desc:0 "Наши войска могут быть самыми преданными, верными, набожными, ревностными и хорошо обученными, но для защиты христианства им всё равно необходимо надлежащее оружие. Мы обеспечим их всем необходимым."
 SPA_no_compromise_on_carlist_ideals:0 "Карлистские идеалы превыше всего"
 SPA_no_compromise_on_carlist_ideals_desc:2 "Хотя в начале восстания мы сотрудничали с Фалангой, теперь ясно, что компромисс в вопросах наших идеалов равносилен предательству. Если Фаланга не примет наши требования, нам придётся уничтожить и её."
 SPA_no_compromise_on_carlist_ideals_tt_2:0 "§Y[ROOT.GetName]§! будет называться §YКарлистской Испанией§!.\n"
 SPA_no_compromise_on_carlist_ideals_tt:0 "§RСторонники фашизма начнут гражданскую войну!§!\n"
 SPA_the_crusade_against_democracy:0 "Крестовый поход против демократии"
 SPA_the_crusade_against_democracy_desc:1 "Только законный карлистский наследник наделён самим Богом божественным правом править. Демократия не только оскорбляет короля, но и является кощунством против самой Воли Божьей. Этой скверне больше нельзя позволять существовать в мире."
 SPA_the_crusade_against_democracy_timer_tt:1 "С последнего изменения §YКрестового похода против демократии§! должно пройти не менее 70 дней.\n"
 SPA_expand_the_requetes:0 "Расширить рекете"
 SPA_expand_the_requetes_desc:1 "До сих пор мы полагались на сравнительно небольшой, но хорошо обученный корпус штурмовых войск. Однако для наших амбиций этого недостаточно. Мы должны расширить рекете и обеспечить необходимую подготовку всем, кто откликнется на призыв."
 SPA_militarize_the_masses:0 "Милитаризировать населения"
 SPA_militarize_the_masses_desc:1 "Ценности, которые мы защищаем, не могут оборонять одни лишь рекете. Все верные Короне и несущие в сердце любовь к Богу обязаны исполнить воинский долг ради защиты своих идеалов."
 SPA_defenders_of_catholicism:0 "Защитники католичества"
 SPA_defenders_of_catholicism_desc:1 "Как и четыреста лет назад, Испания вновь должна стать защитницей католической веры. Каждый рядовой солдат должен быть мечом и щитом своей веры и помнить об этом священном долге, куда бы король ни отправил его сражаться."
 SPA_battle_rites:0 "Боевые обряды"
 SPA_battle_rites_desc:2 "Война в защиту нашей нации — священный долг. Капелланы будут сопровождать солдат на поле боя и совершать последние обряды над каждым, кто принесёт высшую жертву за короля и веру, обеспечивая им награду на Небесах."
 SPA_cultivate_fanaticism:0 "Культивировать фанатизм"
 SPA_cultivate_fanaticism_desc:1 "Наиболее достойные восхищения качества карлистского солдата — упорство и непоколебимая решимость перед лицом опасности и лишений, основанные на знании, что в случае гибели Бог вознаградит его за исполненный долг. Преданность и жертва павших должны служить примером для всех новобранцев."
 SPA_the_third_dimension_of_warfare:0 "Третье измерение войны"
 SPA_the_third_dimension_of_warfare_desc:1 "Неукротимый дух карлистов уже безраздельно господствует на земле; теперь он должен покорить и небо."
 SPA_a_modern_fighter_fleet:0 "Флот современных истребителей"
 SPA_a_modern_fighter_fleet_desc:1 "Наши лётчики должны получить лучшие машины, которые способно предоставить государство. Недостаток численности мы компенсируем мастерством, храбростью и качеством техники."
 SPA_confirm_the_fueros:0 "Подтвердить фуэрос"
 SPA_confirm_the_fueros_desc:1 "Управление государством находится в ведении короля, однако древние привилегии гарантируют право самоуправления регионам, составляющим королевство. Эти права, называемые фуэрос, необходимо подтвердить, чтобы сохранить верность различных областей."
 SPA_encourage_local_industrialization:0 "Поощрить местную индустриализацию"
 SPA_encourage_local_industrialization_desc:1 "Региональные правительства должны содействовать индустриализации, поскольку такие местные инициативы несомненно укрепят государство в целом."
 SPA_encourage_local_mining:0 "Поддержать местную разработку месторождений"
 SPA_encourage_local_mining_desc:0 "Наша промышленность нуждается в ресурсах и привыкла к роли чистого импортёра. Следует поощрять более широкое развитие горнодобывающих предприятий, чтобы использовать богатства Иберийского полуострова и снизить зависимость от иностранных поставщиков."
 SPA_settle_the_succession_question:0 "Уладить вопрос о наследовании"
 SPA_settle_the_succession_question_desc:1 "Карлистское движение разделено между сторонниками разных претендентов на престол. Карлистский наследник Альфонсо Карлос умер бездетным в конце 1936 года, успев назначить своим преемником Хавьера Бурбон-Пармского. Однако некоторые поддерживают притязания бывшего изгнанного конституционного короля Альфонсо XIII."
 SPA_dios_patria_rey:1 "Dios, Patria y Rey!"
 SPA_dios_patria_rey_desc:1 "Боевой клич карлистов звучит сквозь историю и воплощает наши убеждения. Он напоминает, что каждый из нас играет лишь небольшую роль в защите католицизма, местных общин, испанского государства в целом и высшей власти нашего короля. Бог, Родина и Король!"
 SPA_restore_the_empire:0 "Восстановить империю"
 SPA_restore_the_empire_desc:1 "Наша империя ждёт! Нужно лишь создать военную промышленность, которая позволит нам её завоевать."
 SPA_strengthen_the_empire:0 "Усилить империю"
 SPA_strengthen_the_empire_desc:0 "Экономика молодой новой Испанской империи всё ещё испытывает трудности. Следует направить больше казённых средств на ускоренное восстановление промышленности после разрушений гражданской войны."
 SPA_prosperity_of_the_empire:0 "Процветание империи"
 SPA_prosperity_of_the_empire_desc:0 "Восстановление и процветание империи имеют первостепенное значение. Уделив больше внимания улучшению инфраструктуры и тем самым поощряя торговлю и промышленное развитие, мы быстро достигнем этой цели."
 SPA_press_the_gibraltar_claim:0 "Усилить претензии на Гибралтар"
 SPA_press_the_gibraltar_claim_desc:1 "Само существование гибралтарского анклава является оскорблением нашего короля, и за это следует отомстить."
 SPA_claim_the_french_throne:0 "Заявить права на французский престол"
 SPA_claim_the_french_throne_desc:1 "Испанский и французский престолы более полувека связаны династическими узами. Наш нынешний король не исключение и вдобавок является легитимистским претендентом на французский престол. Этим обстоятельством необходимо воспользоваться."
 SPA_retake_the_spanish_netherlands:0 "Отобрать Испанские Нидерланды"
 SPA_retake_the_spanish_netherlands_desc:1 "Когда-то наша империя простиралась до самых границ Германии. Нет причин, по которым она не должна вновь достичь их, заодно позволив нам отомстить за Восьмидесятилетнюю войну."
 SPA_restore_the_iberian_union:0 "Восстановить Иберийский Союз"
 SPA_restore_the_iberian_union_desc:1 "Почти четыре столетия прошло с тех пор, как Испания и Португалия в последний раз разделяли общую судьбу, пусть и слишком недолго. Вместе Иберия сильнее, поэтому мы позаботимся, чтобы новое право на португальский престол было «обнаружено»..."
 SPA_the_war_of_vengeance:0 "Война мщения"
 SPA_the_war_of_vengeance_desc:1 "Испано-американская война 1898 года всё ещё жива в памяти, а её глубокое влияние на национальное сознание испанцев лучше всего отражено в трудах «Поколения 98 года». За национальное унижение от утраты колоний необходимо отомстить. Америка должна быть поставлена на колени."
 SPA_found_the_academia_vazquez_de_mella:0 "Основать академию Васкеса де Меллы"
 SPA_found_the_academia_vazquez_de_mella_desc:1 "Мы должны создать великий центр традиционалистской мысли, где карлистские мыслители смогут совершать новые открытия и разрабатывать идеи на благо новой испанской монархии."
 SPA_a_fleet_worthy_of_a_king:0 "Флот, достойный короля"
 SPA_a_fleet_worthy_of_a_king_desc:1 "Наш флот необходимо значительно расширить, чтобы монарх мог утверждать свою волю за океанами. Новая военно-морская инфраструктура будет построена незамедлительно."
 SPA_rebuild_the_battlefleet:0 "Возродить боевой флот"
 SPA_rebuild_the_battlefleet_desc:1 "Четыре десятилетия после Испано-американской войны наш флот оставался вялым и робким. Новые крупные боевые корабли, способные встретиться с любым противником, возродят его дух и позволят оспаривать господство соседей на море."
 SPA_imperial_security:0 "Имперская безопасность"
 SPA_imperial_security_desc:1 "Безопасность империи обеспечивают не крупные линейные корабли, а достаточное количество крейсеров. Следует немедленно начать разработку новых моделей и доктрин защиты торговли, чтобы гарантировать снабжение заморских владений."
 SPR_regional_defense_council_of_aragon:0 "Региональный совет по обороне Арагона"
 SPR_regional_defense_council_of_aragon_desc:1 "Ради ведения войны и исключительно по необходимости автономные анархистские коммуны, возникшие в результате гражданской войны, должны быть объединены под властью единого Совета обороны, способного координировать наши действия. Начнём с создания такого совета в Арагоне."
 SPR_appropriate_the_means_of_production:0 "Присвоить средства производства"
 SPR_appropriate_the_means_of_production_desc:1 "Прошли времена, когда мы трудились на богачей. Прошли времена, когда наш труд оставался без вознаграждения. Мы захватим фабрики и мастерские, фермы и магазины, уничтожим классы и отдадим рабочим власть над собственной судьбой."
 SPR_autogestion:0 "Самоуправление"
 SPR_autogestion_desc:1 "Мы доведём производство до максимума, позволив рабочим самостоятельно управлять предприятиями по принципам аутогестии. Это принесёт многочисленные преимущества в виде автономии, высокого морального духа и, как следствие, общей производительности."
 SPR_collectivization_and_workers_control:0 "Коллективизация и рабочий контроль"
 SPR_collectivization_and_workers_control_desc:1 "Для решения необходимых вопросов местного управления мы обратимся к рабочим советам, предоставив каждому рабочему право голоса и одновременно обеспечив сотрудничество в более широком масштабе."
 SPR_arm_the_people:0 "Вооружить народ"
 SPR_arm_the_people_desc:1 "Национальную армию легко использовать как средство государственного контроля над населением, поэтому она не подходит для защиты коммун. Именно народ должен получить оружие, с помощью которого сможет защищать свои общины."
 SPR_the_maximum_concession:0 "Максимальные уступки"
 SPR_the_maximum_concession_desc:1 "Ради борьбы с фашизмом мы пошли на величайшую возможную уступку — сотрудничество с капиталистами и авторитарными коммунистами. Дальше мы не отступим, и такое положение не может длиться вечно. Пока оно сохраняется, извлечём из него максимум пользы."
 SPR_seize_public_transport:0 "Захватить общественный транспорт"
 SPR_seize_public_transport_desc:1 "Все хотят внести вклад в борьбу за свободу. Среди наших союзников немало работников общественного транспорта, готовых предоставить свои машины храбрым солдатам. Это может дать нам необычное тактическое преимущество над врагами."
 SPR_seize_public_transport_tt:0 "§RЭтот национальный дух будет удалён после окончания гражданской войны!§!\n"
 SPR_agrarian_collectivization:0 "Аграрная коллективизация"
 SPR_agrarian_collectivization_desc:1 "Коллективная организация сельского хозяйства обеспечит продовольствием всех жителей коммун, вместо того чтобы продавать урожай там, где он принесёт наибольшую прибыль."
 SPR_mujeres_libres:0 "Mujeres Libres"
 SPR_mujeres_libres_desc:1 "Социальная революция добилась успеха лишь частично. Следующим шагом должны стать освобождение, расширение прав и образование женщин рабочего класса. Равенство принесёт пользу всей общине."
 SPR_literacy_programs:0 "Ликвидация безграмотности"
 SPR_literacy_programs_desc:1 "Неграмотность широко распространена среди рабочих, но правильные программы позволят быстро исправить положение и, несомненно, выявить скрытые таланты."
 SPR_shared_burdens:0 "Общее бремя"
 SPR_shared_burdens_desc:2 "Борьба за свободу от авторитаризма, капитализма и религиозных суеверий будет долгой и тяжёлой. Каждый должен внести свой вклад и вынести ожидающие нас трудности, прежде чем все смогут пожать плоды общего труда."
 SPR_international_brigades:0 "Международные бригады"
 SPR_international_brigades_desc:1 "Наше дело привлекло огромное международное внимание, и люди со всего мира приезжают, чтобы вместе с нами бороться с фашистской угрозой. Никому не будет отказано, пока он трудится на благо общины. Мы организуем их в интернациональные бригады."
 SPR_seize_the_gold_reserves:0 "Захватить золотой запас"
 SPR_seize_the_gold_reserves_desc:1 "Золотой запас Республики рискует попасть в руки фашистов или, что, возможно, ещё хуже, сталинистов. Захватив его, мы несомненно вызовем гнев правительства, но сможем финансировать войну, приобретая иностранное оружие на чёрном рынке."
 SPR_gold_reserves_flag:0 "Золотой запас уже захвачен или перемещён"
 SPR_foreign_arms_purchases:0 "Закупка оружия за рубежом"
 SPR_foreign_arms_purchases_desc:1 "«Освобождённый» нами золотой запас можно использовать для покупки крайне необходимого иностранного оружия. Международное мнение не обязательно на нашей стороне, поэтому, вероятно, придётся получать его по неофициальным каналам..."
 SPR_foreign_arms_purchases_tt:0 "Открывает решения §YЗакупки иностранного оружия§!, позволяющие приобретать различные виды снаряжения.\n"
 SPR_masters_of_our_own_fate:0 "Хозяева своей судьбы"
 SPR_masters_of_our_own_fate_desc:1 "Сталинисты и их республиканские марионетки всё сильнее посягают на наши свободы, систематически подрывая наши усилия и устраняя видных сторонников нашего дела. Довольно. Мы сами хозяева своей судьбы, даже если ради этого придётся сражаться и с ними."
 SPR_anarchist_uprising_flag:0 "Анархисты подняли восстание."
 SPR_masters_of_our_own_fate_tt_2:0 "§Y[ROOT.GetName]§! будет называться §YРегиональным советом обороны Арагона§!.\n"
 SPR_masters_of_our_own_fate_tt_3:0 "§Y[ROOT.GetName]§! будет называться §YИспанской коммуной§!.\n"
 SPR_masters_of_our_own_fate_tt_4:0 "Министры ПОУМ становятся §Gдоступны§!, а демократические и сталинистские министры §Rудаляются§!.\n"
 SPR_masters_of_our_own_fate_tt:0 "§RСторонники коммунизма и демократии начнут гражданскую войну!§!\n"
 SPR_all_must_bear_the_torch:0 "Все должны нести свет"
 SPR_all_must_bear_the_torch_desc:1 "Каждый человек сам по себе является революцией: без храбрости и ярости личности коллектив падёт перед врагами. Эту мысль необходимо донести до всех сторонников — каждый из нас обязан высоко нести факел анархизма."
 SPR_the_threats_abound:0 "Повсюду угрозы"
 SPR_the_threats_abound_desc:1 "Ясно, что мир отвергает само наше существование. Куда бы мы ни обратились, нас встречают холодностью или открытой враждой. Теперь очевидно: союзников, на которых можно положиться, нет. Мы должны готовиться к войне с каждым из этих отживших государств-наций."
 SPR_portuguese_anarchism:0 "Португальский анархизм"
 SPR_portuguese_anarchism_desc:1 "Наша война за свободу перекинулась через португальскую границу и дестабилизирует правительство. При должной поддержке полномасштабное анархистское восстание в Португалии вполне возможно. Мы должны разжечь это пламя!"
 SPR_regional_defense_council_of_iberia:0 "Региональный совет по обороне Иберии"
 SPR_regional_defense_council_of_iberia_desc:1 "После освобождения территории, некогда называвшейся Португалией, мы можем создать новый совет обороны, представляющий волю всех коммун Иберийского полуострова."
 SPR_regional_defense_council_of_iberia_tt:0 "§Y[ROOT.GetName]§! будет называться §YРегиональным советом обороны Иберии§!.\n"
 SPR_a_new_way_of_warfare:0 "Новый способ войны"
 SPR_a_new_way_of_warfare_desc:1 "Храбрость нашей пехоты не вызывает сомнений, но реалии войны давно превзошли возможности одной пехоты. Мы должны начать разработку новых боевых машин на земле и в небе, чтобы защитить наши коммуны."
 SPR_communal_military_strategies:0 "Коллективные военные стратегии"
 SPR_communal_military_strategies_desc:1 "Организовать крупномасштабную войну, оставаясь верными принципам анархизма, чрезвычайно трудно. Но мы обязаны справиться, иначе всё, за что мы боремся, будет потеряно."
 SPR_maintaining_the_fire:0 "Поддержание огня"
 SPR_maintaining_the_fire_desc:1 "Усталость от войны предвещает поражение. Мы должны оставаться сильными и вновь разжечь в народе огонь, побуждающий его отдавать все силы."
 SPR_freedom_of_thought:0 "Свобода мысли"
 SPR_freedom_of_thought_desc:2 "Ограниченности нет места в наших общинах. Здесь рады каждому, независимо от его идей, если он принимает основные принципы нашего общества."
 SPR_torchbearers_of_tomorrow:0 "Факелоносцы завтрашнего дня"
 SPR_torchbearers_of_tomorrow_desc:1 "Те, кто поддерживает наше дело интеллектуальным или военным трудом, воплощают само будущее. Осознание этого способно стать мощной движущей силой, поэтому они должны понимать важность своей работы."
 SPR_the_inevitable_counterblow:0 "Неизбежный контрудар"
 SPR_the_inevitable_counterblow_desc:1 "Международная враждебность к нашему общинному образу жизни растёт. Удар — лишь вопрос времени, и мы должны быть готовы его принять."
 SPR_improve_military_infrastructure:0 "Улучшить военную инфраструктуру"
 SPR_improve_military_infrastructure_desc:1 "Чтобы вовремя приходить на помощь осаждённым коммунам, необходимо значительно улучшить межкоммунальную инфраструктуру. Это позволит Совету обороны быстро реагировать на внешние угрозы, с которыми отдельная коммуна не справится."
 SPR_fortify_the_pyrenees:0 "Укрепить Пиренеи"
 SPR_fortify_the_pyrenees_desc:1 "Наиболее очевидное направление нападения лежит с севера. Крайне важно укрепить Пиренеи против любого удара через горы или вдоль побережья."
 SPR_fortify_the_pyrenees_tt:0 "Размещает укрепления §Y3-го уровня§! в провинциях на французской границе в регионах §YСтрана Басков§!, §YНаварра§!, §YЗападный Арагон§!, §YВосточный Арагон§! и §YКаталония§!.\n"
 SPR_fortify_la_linea_de_la_concepcion:0 "Укрепить Ла-Линеа-де-ла-Консепсьон"
 SPR_fortify_la_linea_de_la_concepcion_desc:1 "Ла-Линеа-де-ла-Консепсьон — первый бастион против врага, находящегося за границей. При достаточных укреплениях мы сможем встретить в лоб любое нападение со стороны Гибралтара."
 SPR_fortify_la_linea_de_la_concepcion_tt:0 "Размещает §Yукрепления 3-го уровня§! в провинциях на границе с Гибралтаром в регионах §YСевилья§! и §YГранада§!.\n"
 SPR_fortify_the_coastlines:0 "Укрепить побережья"
 SPR_fortify_the_coastlines_desc:1 "Нельзя исключать возможность морского вторжения. Расширение оборонительных сооружений сделает такую перспективу гораздо менее привлекательной для противника, чем если мы оставим это направление незащищённым."
 SPR_fortify_the_coastlines_tt_1:0 "Размещает §Y1 береговое укрепление§! в прибрежных провинциях регионов §YГалисия§!, §YАстурия§! и §YСтрана Басков§!.\n"
 SPR_fortify_the_coastlines_tt_2:0 "Размещает §Y1 укрепление§! и §Y2 береговых укрепления§! в материковых национальных провинциях с §Yвоенно-морской базой§!.\n"
 SPR_militarize_the_industry:0 "Милитаризировать промышленность"
 SPR_militarize_the_industry_desc:2 "Коммуны необходимо поощрять к увеличению производства военного снабжения, иначе наши храбрые солдаты останутся без средств, необходимых для защиты домов."
 SPR_communal_autarky:0 "Коммунальная автаркия"
 SPR_communal_autarky_desc:1 "Мир отвернулся от нас, поэтому придётся довольствоваться природными ресурсами собственной территории. Мы научимся использовать их с максимальной эффективностью."
 SPR_faith_in_the_cause:0 "Вера в общее дело"
 SPR_faith_in_the_cause_desc:1 "Когда весь мир против нас, пораженческим настроениям нет места. Либо мы сохраним непоколебимую веру в мирное будущее, либо погибнем."
 SPR_militarize_the_people:0 "Милитаризировать население"
 SPR_militarize_the_people_desc:1 "Мы не можем позволить себе держать руки чистыми от крови. Каждый должен научиться владеть оружием для самообороны, чтобы в нужный момент сражаться за своё будущее."
 SPR_anarchism_knows_no_borders:0 "Анархизм не знает границ"
 SPR_anarchism_knows_no_borders_desc:1 "Если государства мира не желают терпеть наше существование, единственный путь к будущему, где мы сможем мирно жить коллективами, — полное уничтожение всех государств-наций."
 SPR_plant_the_seeds_of_revolution:0 "Посеять зёрна революции"
 SPR_plant_the_seeds_of_revolution_desc:1 "Людей, разделяющих наши взгляды, долго заставляли молчать угнетающие правительства. Мы дадим этим группам оружие, чтобы они свергли свои государства изнутри и присоединились к нам, когда мы разгромим врагов и соединимся с ними."
 SPR_plant_the_seeds_of_revolution_tt:1 "Открывает решения §YСемена революции§!, позволяющие создавать анархистские восстания в соседних вражеских странах.\n"
 SPR_global_defense_council:0 "Глобальный совет по обороне"
 SPR_global_defense_council_desc:1 "Наши границы вышли за пределы Иберийского полуострова, и прежнее название временного совета обороны больше не отражает всех его участников. Мы переименуем организацию так, чтобы она включала все народы планеты."
 SPR_global_defense_council_tt:0 "§Y[ROOT.GetName]§! будет называться §YГлобальным советом обороны§!.\n"
 SPR_global_defense_council_tt_2:0 "Открывает решения §YСемена революции§!, позволяющие передавать и делать национальными любые контролируемые иностранные регионы с достаточно высоким §Yподчинением§!.\n"
 SPR_the_anti_fascist_workers_revolution:0 "Антифашистская рабочая революция"
 SPR_the_anti_fascist_workers_revolution_desc:2 "Настало время испанским рабочим восстать против фашистского врага! Мы идём рука об руку с буржуазией лишь до тех пор, пока это необходимо для устранения угрозы. Революция начинается сейчас!"
 SPR_strengthen_the_euzko_gudarostea:0 "Усилить баскскую армию"
 SPR_strengthen_the_euzko_gudarostea_desc:1 "Баскский регион обладает важнейшей промышленностью и нуждается в лучшей защите. Расширение армии, созданной местным правительством, значительно укрепит там линию фронта."
 SPR_strengthen_the_euzko_gudarostea_tt:0 "Получить 6 дивизий с §Y3 пехотными§! батальонами в §YСтране Басков§!.\n"
 SPR_remove_after_civil_war_tt:0 "§RЭти дивизии будут расформированы после окончания гражданской войны!§!\n"
 SPR_fortify_the_iron_ring:0 "Укрепить «железное кольцо»"
 SPR_fortify_the_iron_ring_desc:1 "Крупнейший город Страны Басков, Бильбао, получит собственное «Железное кольцо» укреплений, которое позволит баскам надёжно оборонять его от фашистского врага."
 SPR_arm_the_workers_militias:0 "Вооружить рабочее ополчение"
 SPR_arm_the_workers_militias_desc:1 "Мы сформировали ополчение из рабочих и теперь должны обеспечить его достаточным вооружением, чтобы оно стало авангардом борьбы против фашистов и нелояльной армии."
 SPR_hinder_nkvd_interference:0 "Затруднить вмешательство НКВД"
 SPR_hinder_nkvd_interference_desc:1 "Советский НКВД слишком долго вмешивается во внутренние дела Испании. Открытые критики Сталина исчезают, наши политики оказываются в изоляции, а борьбе с фашистами иногда сильнее мешают мнимые союзники, чем враги. Довольно. Мы дадим отпор сталинистам."
 SPR_hinder_nkvd_interference_tt:0 "Заменяет задание §YНадвигающееся восстание анархистов§! заданием §YНадвигающиеся репрессии правительства§!.\n"
 SPR_demand_ministerial_positions:0 "Потребовать министерские должности"
 SPR_demand_ministerial_positions_desc:1 "Если Республика хочет сохранить нашу поддержку, она должна предоставить нашим политикам места в правительстве. Только так она покажет, что считает нас ценными союзниками в общей борьбе."
 SPR_the_stalinist_doctrine:0 "Сталинистская доктрина"
 SPR_the_stalinist_doctrine_desc:1 "Среди нашего непрочного союза антифашистских групп есть те, кто толкует Маркса независимо от Сталина. Это угрожает всему социалистическому делу и не может продолжаться. Чтобы борьба рабочих не оказалась под угрозой, мы должны устранить инакомыслящих и объединиться под единым лидером."
 SPR_subvert_the_stalinists:0 "Подрывать дело сталинизма"
 SPR_subvert_the_stalinists_desc:1 "Не мы начали эту ссору, но если сталинисты настаивают, мы сыграем по их правилам. Мы ослабим их изнутри, переманивая сторонников и перехватывая снабжение. Куда бы они ни пошли, повсюду встретят наше сопротивление."
 SPR_class_war:0 "Классовая война"
 SPR_class_war_desc:1 "Идея Народного фронта порочна: рабочий никогда не станет свободным, пока вынужден сотрудничать с буржуазией. Только бескомпромиссная классовая война даст нам желанную свободу, даже если придётся одновременно сражаться с капиталистами и фашистами."
 SPR_secure_the_popular_support:0 "Заручиться народной поддержкой"
 SPR_secure_the_popular_support_desc:0 "Наш новый режим серьёзно ослаблен внутренним соперничеством и недовольством населения. Многие по-прежнему сомневаются в нашей идеологической позиции и отношении к общим врагам народной революции. Следует начать кампанию по популяризации и укреплению нашей программы среди простых людей."
 SPR_secularize_the_new_state:0 "Секуляризировать новое государство"
 SPR_secularize_the_new_state_desc:1 "В новом обществе, которое мы строим, нет места религии. Она лишь укрепляет классовые структуры и приучает рабочих к покорности. Только освободив разум от суеверий, мы станем по-настоящему свободными."
 SPR_appropriate_church_riches:0 "Присвоить церковные богатства"
 SPR_appropriate_church_riches_desc:1 "Богатства, накопленные Католической церковью, гораздо полезнее направить на наше дело. Мы используем их для улучшения существующих фабрик и создания новых, которые приблизят достижение конечной цели."
 SPR_an_army_of_all_classes:0 "Армия из всех социальных классов"
 SPR_an_army_of_all_classes_desc:1 "Перед лицом фашистской угрозы классовая принадлежность не имеет значения. Мы создадим армию, где служить сможет каждый, и одновременно познакомим людей со здоровыми социалистическими ценностями их товарищей."
 SPR_relocate_the_gold_reserves:0 "Переместить золотой запас"
 SPR_relocate_the_gold_reserves_desc:1 "Золотой запас необходим для закупки военных материалов за рубежом. Мы обязаны хранить его в безопасном месте, а это, к сожалению, требует вывоза за границу."
 SPR_relocate_the_gold_reserves_tt:0 "§RНаш золотой запас окажется во власти принимающей страны!§!\n"
 SPR_reaffirm_the_popular_front_strategy:0 "Заново утвердить стратегию Народного фронта"
 SPR_reaffirm_the_popular_front_strategy_desc:1 "Крайне важно временно забыть разногласия между нами и союзниками, чтобы сосредоточиться на более важной борьбе — против фашистов."
 SPR_anti_fascist_unity:0 "Антифашистский союз"
 SPR_anti_fascist_unity_desc:1 "Разногласия между нами, анархистами и антисталинистскими союзниками усиливаются. Нельзя допустить выхода ситуации из-под контроля. Мы должны вновь сосредоточиться на истинном враге, даже если ценой внутреннего мира станут уступки заблудшим союзникам на уровне правительства."
 SPR_anti_fascist_unity_tt:1 "Открывает решения §YАнтифашистское единство§!, позволяющие откладывать восстание анархистов в обмен на уступки.\n"
 SPR_crush_the_revolution:0 "Сокрушить революцию"
 SPR_crush_the_revolution_desc:1 "Независимость анархистских коммун давно мешает нам, а их слабая оборона, откровенно говоря, создаёт критическую уязвимость на фронте. Без них будет лучше, поэтому настало время окончательно подавить эту революцию."
 SPR_crush_the_revolution_tt:0 "§RСторонники неприсоединения начнут гражданскую войну!§!\n"
 SPR_united_under_socialism:0 "Объединение под знаменем социализма"
 SPR_united_under_socialism_desc:1 "Хотя мы родом из разных регионов и слоёв общества, необходимо оставить различия позади и сосредоточиться на общей борьбе за социализм."
 SPR_wealth_redistribution:0 "Перераспределение богатства"
 SPR_wealth_redistribution_desc:1 "Теперь, когда собственность богачей захвачена, мы должны разделить плоды победы между всеми, равномерно перераспределив богатство среди населения."
 SPR_collective_recovery_efforts:0 "Коллективные усилия по восстановлению"
 SPR_collective_recovery_efforts_desc:1 "Вся испанская община должна объединиться в едином великом порыве, чтобы устранить разрушения гражданской войны. Фабрики необходимо восстановить, чтобы люди вернулись к труду, а новая инфраструктура облегчит взаимодействие местных сообществ."
 SPR_repair_and_expand_the_dockyards:0 "Отремонтировать и расширить верфи"
 SPR_repair_and_expand_the_dockyards_desc:1 "Крупные верфи также пострадали в гражданской войне. Восстанавливая их, следует одновременно расширить мощности, чтобы подготовиться к будущим программам развития флота."
 SPR_the_peoples_fleet:0 "Народный флот"
 SPR_the_peoples_fleet_desc:1 "Воля народа проявляется и на суше, и на море. Её должен поддержать новый флот, строительство которого мы начнём немедленно."
 SPR_land_redistribution:0 "Перераспределение земли"
 SPR_land_redistribution_desc:1 "Каждый желающий обрабатывать землю должен получить такую возможность. Земли, которыми до войны владели люди, не способные использовать их должным образом, будут переданы тем, кто сможет на них трудиться."
 SPR_expand_the_means_of_production:0 "Расширить средства производства"
 SPR_expand_the_means_of_production_desc:1 "Здоровье коллектива зависит от силы его промышленности. Расширяя её, мы обеспечим внутреннюю стабильность и укрепим оборону против внешних врагов."
 SPR_invite_socialist_intellectuals:0 "Пригласить интеллектуалов-социалистов"
 SPR_invite_socialist_intellectuals_desc:1 "Наше общество станет убежищем для всех интеллектуалов, преданных социалистическому делу. Их следует приглашать отовсюду, чтобы их гений приносил достижения на благо всех нас."
 SPR_solidify_government_control:0 "Укрепить контроль правительства"
 SPR_solidify_government_control_desc:1 "Свободы автономных государств страны необходимо ограничить ради общего блага. Нельзя позволить им ослаблять наше единство перед лицом внешней фашистской угрозы."
 SPR_reeducate_the_bourgeoisie:0 "Переобучить буржуазию"
 SPR_reeducate_the_bourgeoisie_desc:1 "Народный фронт выполнил свою задачу, и теперь буржуазию следует перевоспитать и освободить от экономических и общественных заблуждений. Мы ещё сделаем из них достойных граждан государства."
 SPR_the_spanish_red_army:0 "Испанская Красная Армия"
 SPR_the_spanish_red_army_desc:1 "Для защиты интересов испанского рабочего от внешних угроз будет создана новая верная армия, построенная по образцу Красной армии Советского Союза."
 SPR_expand_soviet_aid:0 "Расширить помощь Советов"
 SPR_expand_soviet_aid_desc:1 "Мы не можем справиться с этой войной сами. Мы должны получить международную помощь.[SOV.GetNameDefCap] Необходимо дать понять, что критическая борьба с фашизмом здесь, в Иберии, и что именно здесь должно быть остановлено их продвижение."
 SPR_expand_soviet_aid_tt:0 "\n§RСоветская помощь обойдётся очень дорого, и расплачиваться придётся после завершения гражданской войны!§!\n"
 SPR_soviet_equipment_shipments:0 "Поставки советского снаряжения"
 SPR_soviet_equipment_shipments_desc:1 "То, что не способна предоставить отечественная промышленность, необходимо восполнить поставками оружия из государства [SOV.GetNameDef]."
 SPR_soviet_military_advisors:0 "Советские военные советники"
 SPR_soviet_military_advisors_desc:1 "Советские военные советники могут дать нашим войскам и командирам необходимое преимущество над врагом."
 SPR_soviet_industrial_aid:0 "Промышленная помощь от СССР"
 SPR_soviet_industrial_aid_desc:1 "Одних поставок оружия недостаточно, чтобы удовлетворить потребности фронта. Советская помощь в расширении отечественной промышленности позволит временно восполнить дефицит и, возможно, со временем добиться полной самостоятельности."
 SPR_soviet_technological_advancements:0 "Советские технологические достижения"
 SPR_soviet_technological_advancements_desc:1 "[SOV.GetNameDefCap] У нас есть технологии, которых нет. С целью разгрома фашизма, неужели они захотят поделиться с нами этими достижениями?"
 SPR_soviet_recovery_aid:0 "Помощь в восстановлении от СССР"
 SPR_soviet_recovery_aid_desc:1 "После победы государство [SOV.GetNameDef] готово помочь нам восстановить страну."
 SPR_all_must_do_their_part:0 "Все должны вносить свой вклад"
 SPR_all_must_do_their_part_desc:1 "Для победы социализма каждый человек обязан служить общему делу. Внутренним разногласиям между коммунами нет места."
 SPR_the_red_tide:0 "Красный прилив"
 SPR_the_red_tide_desc:1 "Народ знает, что наше дело справедливо. Остаётся использовать этот настрой, чтобы обеспечить постоянный поток решительных новобранцев. Подобно красному приливу, наши силы сметут всех противников."
 SPR_arm_the_tide:0 "Вооружить прилив"
 SPR_arm_the_tide_desc:1 "Без достаточного снаряжения личная отвага социалистического рабочего не принесёт победы в бою. Мы дадим ему необходимые средства войны."
 SPR_against_fascism:0 "Против фашизма"
 SPR_against_fascism_desc:1 "Фашистский враг может быть разбит на Иберийском полуострове, но всё ещё существует за его пределами. Мы должны присоединиться к международной борьбе, чтобы уничтожить его раз и навсегда."
 SPR_doctrinal_advancements:0 "Улучшения доктрин"
 SPR_doctrinal_advancements_desc:1 "Уроки гражданской войны можно развить в новые военные доктрины, лучше отвечающие современным реалиям."
 SPR_lessons_from_the_civil_war:0 "Чему нас научила гражданская война"
 SPR_lessons_from_the_civil_war_desc:1 "Гражданская война многому научила нас в искусстве ведения войны. Было бы глупо не применить эти уроки при создании новой армии."
 SPR_nationalize_the_industry:0 "Национализировать индустрию"
 SPR_nationalize_the_industry_desc:1 "Вместо того чтобы позволить промышленности угасать в руках инвесторов и компаний, мы передадим её под контроль государства для более эффективного управления и организации производства."
 SPR_beacon_of_socialism:0 "Светоч социализма"
 SPR_beacon_of_socialism_desc:1 "Наша страна — сияющий маяк социализма, который наверняка привлечёт учёных-единомышленников, желающих служить делу рабочих."
 SPR_increase_arms_production:0 "Увеличить производство вооружения"
 SPR_increase_arms_production_desc:0 "Для защиты идеалов коммунизма армии необходимо оружие. Промышленный потенциал великой страны должен быть увеличен, чтобы обеспечить её этим оружием."
 SPR_exploit_spains_riches:0 "Эксплуатация богатств Испании"
 SPR_exploit_spains_riches_desc:0 "Иберийский полуостров богат природными ресурсами. Их освоение значительно укрепит военную промышленность и принесёт средства для восстановления страны."
 SPR_unify_the_london_bureau:0 "Объединить Лондонское бюро"
 SPR_unify_the_london_bureau_desc:1 "В ответ на создание Третьего интернационала и борьбу между Троцким и Сталиным было образовано Международное бюро революционного социалистического единства, отвергавшее обе трактовки марксизма. Мы свяжемся с его представителями, чтобы создать единый социалистический фронт против троцкизма и сталинизма."
 SPR_against_trotskyism_and_stalinism:1 "Против троцкизма и сталинизма"
 SPR_against_trotskyism_and_stalinism_desc:1 "Слишком долго споры Троцкого, Сталина и их сторонников подрывали единство и целостность социалистического дела. Если они не способны отложить разногласия, мы просто избавим наше движение от их влияния."
 SPR_against_trotskyism_and_stalinism_tt:0 "Получает цель войны §Y$puppet_wargoal_focus$§! против §Yсталинистского§! или §Yтроцкистского Советского Союза§! либо §YМексики§!."
 SPR_red_bulwark_in_the_west:0 "Красный бастион на Западе"
 SPR_red_bulwark_in_the_west_desc:1 "Наше географическое положение изолирует нас от союзников. В случае нападения, особенно со стороны сильных морских держав, мы не сможем рассчитывать на помощь государства [SOV.GetNameDef]. Поэтому оборона должна превратить нас в западный бастион социализма в Европе."
 SPR_appeal_for_increased_autonomy:0 "Попросить об увеличении автономии"
 SPR_appeal_for_increased_autonomy_desc:1 "Ценой [SOV.GetAdjective] помощи, сделавшей нашу победу возможной, стало подчинение. Мы доказали верность и способность защищать социализм, что наверняка признают в Москве. Возможно, удастся убедить их ослабить поводья."
 SPR_modernize_the_armed_forces:0 "Модернизировать армию"
 SPR_modernize_the_armed_forces_desc:1 "Наше непрочное положение на западе Европы значительно укрепится благодаря разработке нового оружия и снаряжения для вооружённых сил."
 SPR_a_red_iberia:0 "Красная Иберия"
 SPR_a_red_iberia_desc:1 "Настало время объединить весь Иберийский полуостров под знаменем социализма."
 SPR_support_french_communists:0 "Поддержать французских коммунистов"
 SPR_support_french_communists_desc:1 "[FRA.GetNameDefCap] У него была недавняя история коммунистических чувств. Если они увидят мудрость нашего сотрудничества в деле достижения целей рабочего, то мы объединим усилия, но если они не будут столь просвещены, мы должны силой привести к ним социализм."
 SPR_avenge_foreign_interference:0 "Отомстить за иностранное вмешательство"
 SPR_avenge_foreign_interference_desc:1 "Иностранные державы вмешались в гражданскую войну против нас, поддержав фашистских врагов. Мы этого не забыли, и теперь пришло время ответить."
 SPR_avenge_foreign_interference_tt:0 "Предоставляет цели войны против всех стран, отправлявших добровольцев националистам во время гражданской войны.\n"
 SPR_provide_for_the_people:0 "Обеспечить народ"
 SPR_provide_for_the_people_desc:1 "Первая задача — обеспечить население продовольствием. Наша победа не должна быть омрачена бедствием голода."
 SPR_collectivize_industry:0 "Обобществить промышленность"
 SPR_collectivize_industry_desc:1 "Коллективизация промышленности ещё больше повысит производительность и боевой дух рабочих."
 SPR_connect_the_country:0 "Объединить страну"
 SPR_connect_the_country_desc:1 "Масштабная программа инфраструктурного строительства по всей стране обеспечит быстрое перемещение товаров между самыми удалёнными районами полуострова и принесёт долгосрочную пользу."
 SPR_transplant_soviet_industry:0 "Переместить советскую индустрию"
 SPR_transplant_soviet_industry_desc:2 "Советы показали особое мастерство в перемещении целых заводов на тысячи километров. Чтобы дать толчок отечественной военной промышленности, мы попросим перенести на Иберийский полуостров несколько менее важных предприятий."
 SPR_the_five_year_plan:0 "Пятилетний план"
 SPR_the_five_year_plan_desc:1 "Смелый новый план превратит Испанию в региональную промышленную державу не более чем за пять лет."
 SPR_slipway_enlargement:0 "Увеличение стапелей"
 SPR_slipway_enlargement_desc:1 "Чтобы строить более крупные военные корабли, необходимо расширить мощности верфей."
 SPR_a_red_fleet:0 "Красный флот"
 SPR_a_red_fleet_desc:1 "Могущественный флот необходим, чтобы внести свой вклад в распространение социализма по всему миру. Строительство Красного флота начинается сегодня."
 SPR_maintain_the_second_republic:0 "Сохранить Вторую республику"
 SPR_maintain_the_second_republic_desc:1 "Мятежная армия не добилась успеха в попытке переворота, и наше правительство сохранило свободу действий. Вторая республика одолеет угрозу справа, как ранее справилась с забастовкой шахтёров 1934 года."
 SPR_new_leadership:0 "Новое руководство"
 SPR_new_leadership_desc:1 "Чтобы Республика пережила эти тяжёлые времена, ей требуется новое руководство. Мы привлечём советников и министров с новым взглядом на борьбу против фашистской угрозы, что позволит лучше защитить наши принципы и убеждения."
 SPR_the_future_of_the_republic:0 "Будущее республики"
 SPR_the_future_of_the_republic_desc:1 "Нынешняя борьба, несомненно, определит будущее Республики. Мы не должны жалеть ни сил, ни средств, чтобы сформировать его надлежащим образом."
 SPR_petition_for_french_aid:0 "Петиция о французской помощи"
 SPR_petition_for_french_aid_desc:1 "Северные соседи колеблются, опасаясь внутренних беспорядков в случае любых действий. Нельзя позволить им оставаться нерешительными: наше выживание зависит от их готовности помочь."
 SPR_petition_for_french_aid_tt:0 "§R[FRA.GetNameDefCap] должен одобрить соглашение о вступлении бонусов в силу.§!\n"
 SPR_ensure_loyalty:0 "Обеспечить лояльность"
 SPR_ensure_loyalty_desc:1 "Военные самым жестоким образом предали правительство. Первый шаг к исцелению этой раны — обеспечить верность всех назначаемых отныне офицеров."
 SPR_enlist_the_carabineros:0 "Призвать карабинеров"
 SPR_enlist_the_carabineros_desc:2 "В качестве временной меры для удержания фронта придётся прибегнуть к необычным решениям. Без армии карабинеры — военизированная пограничная и таможенная служба — смогут не хуже других занять окопы."
 SPR_enlist_the_carabineros_tt:0 "Получить по 1 дивизии с §Y3 пехотными§! батальонами в 5 случайных регионах.\n"
 has_hired_juan_negrin_tt:0 "§YХуан Негрин§!: нанят в качестве советника"
 SPA_embrace_pan_hispanism:0 "Поддержать паниспанский национализм"
 SPA_embrace_pan_hispanism_desc:0 "В последние годы в наших бывших колониях усилился паниспанизм, и теперь, после успешных кампаний по возвращению владений, настало время принять эти идеи, чтобы Испанская империя простояла ещё тысячу лет!"
 SPA_embrace_pan_hispanism_tt:0 "Мы контролируем все национальные регионы государств §Y[CHL.GetName]§!, §Y[ARG.GetName]§!, §Y[ECU.GetName]§!, §Y[PRU.GetName]§!, §Y[URG.GetName]§!, §Y[PAR.GetName]§!, §Y[BOL.GetName]§!, §Y[COL.GetName]§!, §Y[VEN.GetName]§!, §Y[PAN.GetName]§!, §Y[COS.GetName]§!, §Y[NIC.GetName]§!, §Y[HON.GetName]§!, §Y[ELS.GetName]§!, §Y[GUA.GetName]§!, §Y[MEX.GetName]§!, §Y[DOM.GetName]§!, §Y[CUB.GetName]§! и §Y[PUE.GetName]§!."
 SPA_absorb_the_portuguese_empire_tt:0 "Мы получим национальные территории на всех контролируемых §Yпортугальских§! национальных регионах."
 SPR_the_popular_army:0 "Народная армия"
 SPR_the_popular_army_desc:1 "Новая армия будет состоять из людей, не запятнанных предательством военных: ревностных защитников принципов Республики, которые прежде, возможно, не служили. Вместе с реорганизацией мы разработаем новое оружие и доктрины для помощи этой армии."
 SPR_take_the_initiative:0 "Взять инициативу"
 SPR_take_the_initiative_desc:1 "Нельзя бездействовать, пока враги сами выбирают время и место нападения. Войны выигрывает тот, кто проявляет инициативу, и именно это мы сделаем."
 SPR_no_pasaran:0 "¡No Pasarán!"
 SPR_no_pasaran_desc:1 "Пусть девиз антифашистов звучит из каждого дома и каждого города, с каждой крыши и улицы, с каждой баррикады и из каждой канавы: «¡Но пасаран!» — они не пройдут!"
 SPR_no_pasaran_tt:2 "Размещает §Y1 укрепление§! во всех провинциях с §Y1 очком победы§! в контролируемых регионах.\nРазмещает §Y2 укрепления§! во всех провинциях с §Y3 очками победы§!.\nРазмещает §Y3 укрепления§! во всех провинциях с §Y10 очками победы§!.\nРазмещает §Y4 укрепления§! во всех провинциях с §Y30 или более очками победы§!.\n"
 SPR_a_frontline_suited_for_intellectuals:0 "Фронт для интеллектуалов"
 SPR_a_frontline_suited_for_intellectuals_desc:1 "Расточительно отправлять лучшие умы сражаться с фашистами на передовую. Гораздо полезнее использовать их в глубоком тылу, где они смогут создавать новые средства войны, дающие больше пользы, чем несколько дополнительных солдат."
 SPR_strengthen_the_anti_fascist_coalition:0 "Усилить антифашистскую коалицию"
 SPR_strengthen_the_anti_fascist_coalition_desc:1 "Мы устранили несогласные элементы коалиции и теперь, надеемся, наконец сможем сосредоточиться на укреплении общей решимости искоренить фашизм."
 SPR_oppose_the_communists:0 "Противостоять коммунистам"
 SPR_oppose_the_communists_desc:1 "Коммунисты — лишь необходимый союзник в борьбе с фашизмом. Когда она закончится, мы разберёмся с ними по-своему."
 SPR_fortify_the_central_government:0 "Укрепить центральное правительство"
 SPR_fortify_the_central_government_desc:1 "Необходимо защитить правительство от коммунистического влияния, иначе они могут тайно захватить контроль над Республикой изнутри."
 SPR_secure_democratic_principles:0 "Охранять демократические принципы"
 SPR_secure_democratic_principles_desc:1 "Нельзя позволить коммунистическому влиянию изменить или уничтожить принципы, на которых основана Вторая республика. Каковы бы ни были наши отношения с коммунистами или государством [SOV.GetNameDef], эти принципы должны жить в наших сердцах, даже если их нельзя выражать открыто."
 SPR_subvert_soviet_control:0 "Подорвать советское влияние"
 SPR_subvert_soviet_control_desc:1 "Ценой [SOV.GetAdjective] помощи, сделавшей победу возможной, стало подчинение, и, похоже, наши испытания ещё не окончены. Мы начнём разрушать попытки [SOV.GetAdjective] распространить коммунистическое влияние в стране, готовясь к окончательной борьбе за свободу и независимость."
 SPR_subvert_soviet_control_tt:1 "\n§R[SOV.GetNameDefCap] Скорее всего, мы примем карательные меры в результате нашего неповиновения.§!\n"
 SPR_war_of_independence:0 "Война за независимость"
 SPR_war_of_independence_desc:1 "Настало время выступить против бывших союзников, иначе мы превратимся в очередную союзную республику. Народу предстоит последнее великое усилие, чтобы обрести свободу как от правого, так и от левого авторитаризма."
 SPR_war_of_independence_tt:1 "§RЕсли они не примут наши требования, это приведёт к войне!§!"
 SPR_those_who_would_not_help_us:0 "Те, кто нам не поможет"
 SPR_those_who_would_not_help_us_desc:1 "Запад оставил нас в одиночестве в борьбе с фашистами, но с тех пор всё изменилось, и теперь они сами оказались втянуты в войну. Нам снова нужна их помощь, и, возможно, на этот раз они научились прислушиваться к нам, когда мы становимся авангардом борьбы с новым врагом."
 SPR_those_who_would_not_help_us_tt:0 "§RСтраны должны одобрить соглашение, чтобы бонусы вступили в силу.§!\n"
 SPR_ideological_allies:0 "Идеологические союзники"
 SPR_ideological_allies_desc:1 "Испания была перекована в горниле гражданской войны. Мы встанем вместе с идеологическими союзниками против экстремизма как правых, так и левых."
 SPR_enemies_of_our_enemy:0 "Враг моего врага"
 SPR_enemies_of_our_enemy_desc:1 "Хотя во время гражданской войны они помогали нашим противникам, теперь у нас появился общий враг. Возможно, стоит отложить разногласия до победы в более важной борьбе."
 SPR_deal_with_the_devil:0 "Сделка с дьяволом"
 SPR_deal_with_the_devil_desc:1 "Германия обладает богатым опытом войны против Советов, и хотя о формальном союзе не может быть и речи, обмен военными знаниями может дать нам явное преимущество в собственной борьбе против общего врага."
 SPR_deal_with_the_devil_tt:0 "§RГосударство [GER.GetNameDefCap] должно одобрить соглашение, чтобы бонусы вступили в силу.§!\n"
 SPR_foreign_industrial_aid:0 "Иностранная промышленная помощь"
 SPR_foreign_industrial_aid_desc:0 "Заключив новые соглашения, мы привлечём иностранные компании к инвестициям в нашу страну и восстановлению экономики."
 SPR_stabilize_the_nation:0 "Стабилизировать нацию"
 SPR_stabilize_the_nation_desc:1 "Мы вышли победителями из гражданской войны, но теперь необходимо вернуть стабильность и не допустить повторения подобной катастрофы."
 SPR_end_fascism_at_all_costs:0 "Покончить с фашизмом любой ценой"
 SPR_end_fascism_at_all_costs_desc:2 "Ничто не имеет значения, кроме полного уничтожения фашистов. Если ради этого придётся продать душу коммунизму — пусть так."
 SPR_communists_in_the_government:0 "Коммунисты в правительстве"
 SPR_communists_in_the_government_desc:1 "Влияние коммунистов в правительстве выросло настолько, что теперь они требуют полной смены руководства в соответствии с новой реальностью Республики."
 SPR_communists_in_the_government_tt:0 "Сталинистские министры становятся §Gдоступны§!, а демократические министры §Rудаляются§!.\n"
 SPR_restore_higher_education:0 "Восстановить высшее образование"
 SPR_restore_higher_education_desc:1 "Повреждённые войной высшие учебные заведения следует восстановить и расширить, обеспечив промышленность постоянным притоком талантливых специалистов."
 SPR_engineering_advances:0 "Инженерные достижения"
 SPR_engineering_advances_desc:1 "Новые инженерные достижения позволяют строить более совершенные промышленные объекты, а также разрабатывать новые самолёты и бронетехнику."
 SPR_rebuild_the_nation:0 "Восстановить страну"
 SPR_rebuild_the_nation_desc:0 "После ужасов гражданской войны вернулась стабильность, и промышленность постепенно встаёт на ноги. Масштабные инвестиции в её расширение несомненно дадут экономике необходимый толчок."
 SPR_reprofessionalize_the_military:0 "Заново обучить армию"
 SPR_reprofessionalize_the_military_desc:1 "По необходимости армия была восстановлена из людей, не прошедших строгой военной подготовки. Чтобы превратить временные силы в настоящую национальную армию, необходимо вернуть профессиональную дисциплину и надлежащую систему командования."
 SPR_experiences_from_the_civil_war:0 "Опыт гражданской войны"
 SPR_experiences_from_the_civil_war_desc:1 "Опыт, полученный армией в гражданской войне, привёл к значительным достижениям в военной мысли и разработке снаряжения."
 SPR_a_new_military_academy:0 "Новая военная академия"
 SPR_a_new_military_academy_desc:1 "Для создания по-настоящему профессиональной национальной армии необходимо основать новую академию, которая будет готовить лучших офицеров."
 SPR_revive_the_republican_navy:0 "Восстановить республиканский флот"
 SPR_revive_the_republican_navy_desc:1 "Флот в начале гражданской войны раскололся не меньше армии, и его восстановление должно стать приоритетом национальной безопасности. Для этого потребуется новая инфраструктура, строительство которой начнётся немедленно."
 SPR_navy_modernization:0 "Модернизация флота"
 SPR_navy_modernization_desc:1 "Одно из немногих преимуществ понесённых потерь состоит в том, что ничто не мешает нам строить новые современные корабли. Следует изучить подходящие проекты и немедленно начать строительство."
 SPR_expand_the_naval_academy:0 "Расширить военно-морскую академию"
 SPR_expand_the_naval_academy_desc:1 "Гражданская война выявила недостатки в руководстве флотом. Повышение качества подготовки и расширение академии снизят вероятность повторения дорогостоящих тактических и стратегических ошибок."
 SPR_prepare_for_the_next_war:0 "Подготовиться к следующей войне"
 SPR_prepare_for_the_next_war_desc:1 "Военную промышленность необходимо расширить, чтобы страна, истощённая войной, могла противостоять внешним угрозам. Мы должны быть готовы ко всему."
 SPR_wartime_industry:0 "Промышленность военного времени"
 SPR_wartime_industry_desc:0 "Мы вновь оказались в состоянии войны, поэтому расширение промышленности должно служить прежде всего военным, а не гражданским нуждам."
 SPR_fuel_for_the_war_machine:0 "Топливо для военной машины"
 SPR_fuel_for_the_war_machine_desc:0 "Ресурсы имеют первостепенное значение для военной промышленности, и чем выше наша самодостаточность, тем лучше. Новые шахты, сталелитейные заводы и алюминиевые комбинаты приблизят эту цель."
 SPR_join_the_global_fight_against_fascism:0 "Присоединиться к общей борьбе с фашизмом"
 SPR_join_the_global_fight_against_fascism_desc:1 "Мы победили фашизм в Испании, но он всё ещё существует в других странах. Наш долг — довести борьбу до конца."
 SPR_the_anti_fascist_crusade:0 "Крестовый поход против фашизма"
 SPR_the_anti_fascist_crusade_desc:1 "Испанцы сражались с фашистами задолго до того, как остальные осознали угрозу. Это наша борьба, и мы не остановимся до победы."
 FRA_devalue_the_franc_desc:1 "Пока другие государства снижали стоимость своих валют ради поддержки экономики, мы упорно отказывались от этого. В результате наша экономика отстаёт. Чтобы повысить конкурентоспособность и выдержать грядущую бурю, нельзя отвергать девальвацию, даже если она непопулярна."
 FRA_autoroutes:0 "Автомагистрали"
 FRA_autoroutes_desc:0 "Немцы поразили мир сетью скоростных дорог с ограниченным доступом, соединяющих разные части страны. Мы докажем, что способны не хуже."
 FRA_invest_in_the_metropole:1 "Развитие метрополии"
 FRA_invest_in_the_metropole_desc:0 "Первым шагом к восстановлению промышленности должно стать укрепление производственной базы в континентальных владениях."
 FRA_invest_in_the_colonies:1 "Развитие колоний"
 FRA_invest_in_the_colonies_desc:0 "Европейские промышленные центры не располагают населением и ресурсами для масштабного расширения. Чтобы конкурировать с остальным миром, необходимо использовать колонии."
 FRA_colonial_industry_effect_tt:2 "Добавляет по две §Yфабрики§! во все колониальные регионы, в которые ранее были вложены средства.\n"
 FRA_industrial_expansion_effect_tt:1 "Добавляет по две §Yфабрики§! в регионы метрополии, в которые ранее были вложены средства.\n"
 FRA_military_factories_effect_tt:1 "Добавляет по два §Yвоенных завода§! во все регионы, в которые ранее были вложены средства.\n"
 FRA_invest_in_west_africa:0 "Инвестировать в Западную Африку"
 FRA_invest_in_west_africa_desc:0 "Огромные запасы рабочей силы и ресурсов Западной Африки делают её идеальным направлением для инвестиций."
 FRA_invest_in_indochina:0 "Инвестировать в Индокитай"
 FRA_invest_in_indochina_desc:0 "Большое расстояние между Индокитаем и метрополией может казаться недостатком, но оно также защищает местную промышленность от нападения противника."
 FRA_invest_in_syria:0 "Инвестировать в Сирию"
 FRA_invest_in_syria_desc:0 "Сирия идеально расположена для снабжения нас в случае войны в Европе или Африке. Развитие её промышленности также укрепит наши позиции в регионе."
 FRA_global_integration:0 "Глобальная интеграция"
 FRA_global_integration_desc:0 "Британская империя представляет собой отлаженную систему взаимно поддерживающих частей. Ничто не мешает нам добиться того же со своими колониями."
 FRA_begin_rearmament:0 "Начать перевооружение"
 FRA_begin_rearmament_desc:1 "Двадцатилетнее перемирие, предсказанное маршалом Фошем в 1919 году, стремительно подходит к концу, и мир всё ближе к новой войне. Мы должны быть готовы."
 FRA_firepower_kills:0 "Убийственная огневая мощь"
 FRA_firepower_kills_desc:0 "Урок Великой войны прост и жесток: времена, когда люди стреляли друг в друга прямой наводкой, прошли. Теперь убийство ведётся массово, современным оружием и с больших расстояний."
 FRA_methodical_battle:0 "Методичные битвы"
 FRA_methodical_battle_desc:0 "Некоторые утверждают, что бой — это хаос, но они ошибаются. Бой есть методичное применение нужных средств в соответствии с общим планом. Если план хорош, замыслы врага останутся лишь исторической сноской."
 FRA_division_cuirassee:0 "Моторизированная дивизия"
 FRA_division_cuirassee_desc:0 "Предприимчивый офицер де Голль предложил новый тип дивизии, объединяющий тяжёлую бронетехнику, пехоту и средние танки в единое боевое соединение."
 FRA_infantry_tanks:0 "Пехотные танки"
 FRA_infantry_tanks_desc:0 "Как бы то ни было, первая и последняя обязанность танков — помогать пехоте захватывать и удерживать территорию. Поэтому пехотные части всегда должны иметь современные и надёжные танки."
 FRA_special_forces:0 "Войска специального назначения"
 FRA_special_forces_desc:0 "В будущем войны всё чаще будут идти там, где обычная пехота достигает предела возможностей. Необходимо создать новые, более подготовленные формирования для действий в таких условиях."
 FRA_fusiliers_marine:1 "Морская пехота"
 FRA_fusiliers_marine_desc:0 "Времена неприступных берегов прошли. В будущем мы должны уметь переносить войну к противнику, где бы он ни находился, и захватывать плацдарм вопреки любому сопротивлению."
 FRA_battle_of_maneuver:0 "Манёвренные бои"
 FRA_battle_of_maneuver_desc:0 "Старая идея поля боя как небольшого участка, где сталкиваются армии, умерла. Массовая моторизация, авиация и быстрая радиосвязь позволяют боям перемещаться на сотни километров. Чем раньше мы подготовимся, тем лучше."
 FRA_air_dominance_desc:0 "Развитие авиации создало третий фланг, о котором должна заботиться армия. Мы обязаны обезопасить его, иначе нас ждёт катастрофа."
 FRA_air_ground_cooperation:0 "Сотрудничество наземных войск и авиации"
 FRA_air_ground_cooperation_desc:0 "Воздушный бой приносит реальный военный результат лишь тогда, когда служит цели на земле. Чем лучше мы свяжем борьбу в воздухе с борьбой на земле, тем эффективнее станем."
 FRA_flying_artillery_desc:0 "В стремительных современных боях медленная наземная артиллерия может не поспевать за войсками. Самолёты с бомбами способны взять на себя её роль."
 FRA_form_the_popular_front:0 "Образовать Народный фронт"
 FRA_form_the_popular_front_desc:1 "С ростом фашизма в Германии и Италии стало ясно, что распри среди левых должны прекратиться. Широкий народный фронт всех левых партий получит мандат народа и наконец устранит экономические условия, порождающие фашизм."
 FRA_ban_communism_desc:0 "Немыслимо, чтобы кто-либо всерьёз желал принести своей родине хаос и кровопролитие коммунистической революции, однако такие люди среди нас есть. Мы больше не позволим им строить заговоры против государства. Необходимы самые суровые меры."
 FRA_invite_communist_ministers:0 "Пригласить министров-коммунистов"
 FRA_invite_communist_ministers_desc:0 "Страх перед реакцией радикальных правых помешал включить коммунистов в правительство. Но страх — плохой советчик. Если столкновение неизбежно, пусть они приходят."
 FRA_strengthen_the_unions:0 "Усилить профсоюзы"
 FRA_strengthen_the_unions_desc:0 "Слишком долго право рабочего объединяться с товарищами для коллективных переговоров оставалось под угрозой. Больше этого не будет."
 FRA_celebrate_the_commune:0 "Устроить праздник в честь коммуны"
 FRA_celebrate_the_commune_desc:0 "Парижская коммуна просуществовала недолго, но стала первой попыткой создать коммунистическое общество на французской земле."
 FRA_womens_suffrage_desc:1 "Нелепо и постыдно, что трудолюбивые женщины Франции, вновь и вновь сражавшиеся на баррикадах за свои права, не имеют права голосовать. Мы покончим с этой несправедливостью."
 FRA_legal_equality:0 "Равенство перед законом"
 FRA_legal_equality_desc:0 "Во всём существенном женщины по-прежнему считаются гражданами второго сорта и подчинены воле мужчины. Этому абсурду приходит конец."
 FRA_industrial_collectivization:0 "Коллективизация промышленности"
 FRA_industrial_collectivization_desc:1 "Французская экономика состоит из множества крошечных компаний с малым числом работников, которые бесконечно конкурируют и растрачивают ресурсы на неэффективное мелкосерийное производство. Мы объединим их в предприятия, способные конкурировать на мировом уровне."
 FRA_agricultural_collectivization_desc:0 "То, что справедливо для промышленности, относится и к французским фермерам. Малые хозяйства не могут позволить современную технику и работают почти как их прадеды. Объединив их в сельскохозяйственные производственные единицы, мы повысим эффективность и выпуск."
 FRA_force_the_issue:0 "Принуждение"
 FRA_force_the_issue_desc:1 "Мы далеко продвинулись после создания Народного фронта, но нельзя оставлять дело незавершённым. Каждый левый должен сделать выбор: за революцию или против неё."
 FRA_force_the_issue_tt:0 "Штраф к стабильности зависит от популярности §Yдемократических§! партий.\n"
 FRA_reconciliation:0 "Примирение"
 FRA_reconciliation_desc:0 "В прошлом французские революции слишком часто ввергали страну в бесконечный круг революционного и контрреволюционного террора. Возможно, пора построить республику, где найдётся место каждому, независимо от его отношения к революции."
 FRA_constitutional_convention:0 "Конституционный конвент"
 FRA_constitutional_convention_desc:0 "Коренное изменение природы республики невозможно провести за одну ночь и без обсуждения новой конституции."
 FRA_anti_fascist_coalition:0 "Антифашистская коалиция"
 FRA_anti_fascist_coalition_desc:0 "Главная угроза прогрессу — распространение реакционного фашизма. Мы должны поддержать каждую страну, готовую бороться с этой угрозой, иначе завтра не наступит ни для кого."
 FRA_invite_anti_fascist_emigrants:0 "Пригласить эмигрантов-антифашистов"
 FRA_invite_anti_fascist_emigrants_desc:1 "Первым шагом любого фашистского режима становится изгнание критиков и тех, кто предлагает иной путь развития страны. Эти люди идеально подходят для создания правительств в изгнании, готовых вернуться после освобождения родины."
 FRA_reconnect_to_the_balkans:0 "Восстановить связь с Балканами"
 FRA_reconnect_to_the_balkans_desc:0 "Франция давно стремилась уравновесить державы Центральной Европы связями со странами Балкан. Эти связи сохранились, хотя в последнее время ими пренебрегали."
 FRA_pre_empt_the_fascist_attack:0 "Нанести упреждающий удар по фашистской угрозе"
 FRA_pre_empt_the_fascist_attack_desc:0 "Зачем позволять врагу спокойно готовиться и выбирать удобный момент неизбежного нападения? Мы ударим первыми и уничтожим угрозу, прежде чем она успеет окрепнуть."
 FRA_loyalty_to_moscow:0 "Верность Москве"
 FRA_loyalty_to_moscow_desc:0 "Советская модель социализма может быть несовершенной, но бесспорно, что Советский Союз достиг наибольшего воплощения социалистических идей. Было бы глупо искать собственный путь."
 FRA_league_of_french_bolshevist_volunteers_desc:1 "Когда одна социалистическая страна подвергается нападению, угроза нависает над всеми. Мы не можем бездействовать, пока товарищи сражаются за жизнь."
 FRA_host_the_german_exiles:0 "Приютить немецких ссыльных"
 FRA_host_the_german_exiles_desc:0 "Германия, родина Маркса и Энгельса, некогда стояла во главе коммунистической мысли. Многие немецкие коммунисты бежали после прихода нацистов к власти. Дав им убежище, мы получим помощь в организации управления освобождёнными территориями."
 FRA_revolution_to_the_utmost:0 "Революция по максимуму"
 FRA_revolution_to_the_utmost_desc:0 "Революция, остановленная на полпути, — не революция. Мы не остановимся, пока дело не будет завершено и новый строй не окажется в безопасности, какой бы ни была цена."
 FRA_destroy_the_counter_revolution:0 "Уничтожить контрреволюцию"
 FRA_destroy_the_counter_revolution_desc:0 "Даже сейчас некоторые во Франции готовы вонзить нож в спину собственному народу при первой слабости. Мы не дадим им этого сделать и ударим первыми."
 FRA_revolutionary_zeal_desc:1 "Французский народ всегда отличался особым рвением в уничтожении старого порядка и создании нового. Не следует этому мешать."
 FRA_loyalty_to_the_cause:0 "Верность общему делу"
 FRA_loyalty_to_the_cause_desc:1 "Другие страны могут создавать собственные варианты коммунизма, но мы не обязаны поступаться своим. Они остановились на полпути, сомневаясь, оправдывает ли цель средства. Мы не остановимся."
 FRA_carry_the_revolution_north:0 "Нести революцию на север"
 FRA_carry_the_revolution_north_desc:0 "За Ла-Маншем находится родина промышленной революции и современного капитализма. Нельзя позволить ей стать плацдармом контрреволюционного врага."
 FRA_carry_the_revolution_west:0 "Нести революцию на запад"
 FRA_carry_the_revolution_west_desc:1 "Режимы Иберийского полуострова держатся на волоске и готовы быть сметёнными народной революцией. Мы оборвём этот волосок."
 FRA_carry_the_revolution_east:0 "Нести революцию на восток"
 FRA_carry_the_revolution_east_desc:0 "У восточной границы находится величайшая угроза новому порядку. Реакционные силы ударят в самый неудобный момент — если мы дадим им время подготовиться."
 FRA_carry_the_revolution_south:0 "Нести революцию на юг"
 FRA_carry_the_revolution_south_desc:0 "Италия первой пала перед фашизмом, и эта идеология глубоко там укоренилась. Наши мировоззрения не могут сосуществовать мирно. Они понимают это и готовятся действовать. Мы должны поступить так же."
 FRA_egalite_liberte_solidarite_desc:1 "Первая французская революция смела режимы, существовавшие тысячелетиями, и навсегда изменила Европу. Мы завершим начатое ею."
 FRA_reform_the_labour_laws:0 "Реформа трудового законодательства"
 FRA_reform_the_labour_laws_desc:0 "Рабочие Франции трудятся в суровых условиях, с низкой оплатой труда и небольшими льготами. Настало время для реализации комплексного пакета реформ, направленных на улучшение их положения."
 FRA_nationalize_key_industry:0 "Национализировать ключевые отрасли промышленности"
 FRA_nationalize_key_industry_desc:0 "В нынешней ситуации нельзя бояться радикальной перестройки экономики ради отражения грядущей угрозы. Времени мало, и ждать, пока свободный рынок решит проблему, невозможно."
 FRA_reorganize_the_aviation_industry:0 "Реорганизовать индустрию авиастроения"
 FRA_reorganize_the_aviation_industry_desc:0 "Раздробленная между десятками крошечных компаний авиационная промышленность отстаёт от германской и американской на десятилетия. Нужна радикальная перестройка."
 FRA_form_the_state_arsenals:0 "Создать государственные арсеналы"
 FRA_form_the_state_arsenals_desc:0 "Чтобы снабдить армию современным оружием, нельзя ждать, пока частные компании разовьют необходимые мощности."
 FRA_general_work_council:0 "Общий промышленный совет"
 FRA_general_work_council_desc:0 "Мы создадим национальное ведомство для разрешения споров между работодателями и работниками и наиболее эффективного использования рабочей силы."
 FRA_national_champions:0 "Национальные чемпионы"
 FRA_national_champions_desc:0 "Выбрав несколько компаний с потенциалом мирового уровня и оказав им максимальную поддержку, мы создадим современную экономику, не уступающую другим."
 FRA_dirigisme_desc:0 "Полностью плановая экономика советского образца — слишком крайняя мера, но определённое планирование и руководство необходимы для оптимизации экономики."
 FRA_ban_the_leagues:0 "Запретить лиги"
 FRA_ban_the_leagues_desc:0 "Ультраправым лигам позволяли бесконтрольно организовываться. Сейчас они слишком слабы для переворота, но неизвестно, что смогут сделать в будущем. Лучше распустить их сейчас."
 FRA_the_blum_viollette_proposal:0 "Предложение Блюма-Виолетта"
 FRA_the_blum_viollette_proposal_desc:1 "Гражданство Французской Республики должно быть доступно каждому, кто соответствует требованиям. Многие верные подданные в Алжире желают стать полноправными гражданами, но пока лишены такой возможности. Предоставив им гражданство, мы теснее свяжем Алжир с Францией."
 FRA_expand_the_citizenship:0 "Предоставить гражданство"
 FRA_expand_the_citizenship_desc:0 "Для республики недопустимо, чтобы люди, живущие на её территории, не могли стать гражданами. Такое положение сохраняется у нас, и его необходимо немедленно исправить."
 FRA_france_undividable_desc:0 "Франция должна стать единым целым под одним флагом. Пора открыто признать это, хотя бы чтобы развеять страхи перед разделом."
 FRA_french_union:0 "Французский союз"
 FRA_french_union_desc:0 "Настало время провозгласить новую Францию, охватывающую весь земной шар, где все части державы будут объединены. В каждом владении пройдут референдумы, подтверждающие волю народа стать частью этой великой Франции."
 FRA_french_union_tt:0 "В различных частях колониальной империи пройдут референдумы. Некоторые территории могут предпочесть полную независимость."
 FRA_encourage_immigration:0 "Поддержать иммиграцию"
 FRA_encourage_immigration_desc:1 "Метрополия остро нуждается в рабочих, чтобы восполнить потери Великой войны. Упростив переселение во Францию, мы привлечём квалифицированных иммигрантов."
 FRA_review_foreign_policy:0 "Пересмотреть внешнюю политику"
 FRA_review_foreign_policy_desc:0 "Континентальный порядок, установленный в 1919 году, всё сильнее оказывается под угрозой. Пора пересмотреть внешнеполитический курс и найти новые союзы перед грядущей бурей."
 FRA_intervention_in_spain:0 "Вторжение в Испанию"
 FRA_intervention_in_spain_desc:0 "Гражданская война в Испании принесла столкновение идеологий к самому нашему порогу. Следует действовать осторожно, чтобы конфликт не перекинулся во Францию."
 FRA_support_the_finns:0 "Поддержать финнов"
 FRA_support_the_finns_desc:0 "Финны сражаются за свою жизнь. Мы должны им помочь."
 FRA_confirm_eastern_commitments:0 "Подтвердить восточные обязательства"
 FRA_confirm_eastern_commitments_desc:0 "После Великой войны мы создали сеть союзов в Восточной Европе против возрождающейся Германии и экспансионистского Советского Союза. Теперь союзники сомневаются, придём ли мы им на помощь. Следует заверить их, пока они не начали искать поддержку в другом месте."
 FRA_strengthen_the_little_entente:0 "Усилить Малую Антанту"
 FRA_strengthen_the_little_entente_desc:0 "Малая Антанта обязывает нас помогать союзникам в Восточной Европе и на Балканах. Мы позволили союзу ослабнуть, но сейчас он нужен как никогда. Пора его возродить."
 FRA_invest_in_our_weaker_allies:0 "Инвестировать в наших более слабых союзников"
 FRA_invest_in_our_weaker_allies_desc:0 "Чтобы союзники были способны воевать, необходимо помочь им обеспечивать собственные военные нужды. Умеренные инвестиции в промышленность позволят им производить боеприпасы на месте."
 FRA_invest_in_our_weaker_allies_trigger_tt:0 "Имеет меньше военных заводов, чем мы"
 FRA_coordinate_rearmament:0 "Координировать перевооружение"
 FRA_coordinate_rearmament_desc:0 "Чтобы соответствовать единому процессу развития Германии и других противников, необходимо координировать усилия с союзниками."
 FRA_foreign_guest_workers:0 "Иностранные рабочие"
 FRA_foreign_guest_workers_desc:0 "Недостаток рабочих серьёзно ограничивает развитие промышленности и рост армии. Приглашение квалифицированных работников из союзных стран на наши фабрики высвободит людей для службы."
 FRA_join_the_ententes:0 "Вступить в Антанту"
 FRA_join_the_ententes_desc:1 "Франция не может одновременно поддерживать два отдельных обязательства взаимной обороны. Если британцы не согласятся разделить их, придётся выбирать. Объединив сети союзов в единое целое, мы многократно усилим их сдерживающий эффект."
 unlocks_espionage_operation_tt:0 "Открывает §Yоперацию разведки§!:\n"
 FRA_revive_the_franco_polish_alliance:1 "Возрождение франко-польского союза"
 FRA_revive_the_franco_polish_alliance_desc:0 "Франция всегда поддерживала независимую Польшу. В последние годы отношения охладели, но перед лицом германской угрозы пора возродить союз."
 FRA_revive_the_franco_polish_alliance_tt:0 "\nПольша будет приглашена в нашу фракцию, если мы возглавляем собственную фракцию."
 FRA_buy_time:0 "Выиграть время"
 FRA_buy_time_desc:0 "Мы не готовы встретить немцев в открытом бою. Союзники слабы, армия устарела. Ради выживания, возможно, придётся пойти на жертвы."
 FRA_arms_purchases_in_the_us:1 "Закупка вооружений в США"
 FRA_arms_purchases_in_the_us_desc:0 "Наша военная промышленность не способна снабдить войска необходимым современным оружием. У США есть избыточные мощности, и если они не вернутся к изоляционизму, их можно убедить продать нам нужное вооружение."
 FRA_france_leads:0 "Франция лидирует"
 FRA_france_leads_desc:0 "Страна с гордой историей Франции не может позволить другим диктовать внешнюю политику. Мы будем принимать решения сами, руководствуясь собственными интересами."
 FRA_concessions_to_italy:1 "Уступки Италии"
 FRA_concessions_to_italy_desc:0 "Италия всё ещё мечтает об африканской империи. Если предложить ей уступки и признать завоевание Эфиопии, возможно, удастся предотвратить ось Рим — Берлин."
 FRA_ratify_the_stresa_front:0 "Ратифицировать «Фронт Стрезы»"
 FRA_ratify_the_stresa_front_desc:0 "Италия дала понять, что вступит в нашу фракцию в обмен на территории в Африке. Пора подписать и ратифицировать необходимые договоры."
 FRA_franco_soviet_treaty:1 "Франко-[SOV.GetAdjective]ий договор"
 FRA_franco_soviet_treaty_desc:1 "Государство [SOV.GetAdjective] обеспокоено ростом фашизма в Европе не меньше нас. Возможно, его удастся убедить поддержать нас в нужный момент."
 FRA_revive_the_national_bloc:0 "Восстановить национальный блок"
 FRA_revive_the_national_bloc_desc:0 "Политический ландшафт радикализуется с каждым днём. Левые шепчутся о союзе с коммунистами. Сейчас стране нужно сильное и стабильное руководство."
 FRA_laissez_faire:0 "Laissez-Faire"
 FRA_laissez_faire_desc:0 "Коммунисты открыто говорят о радикальной перестройке экономики и лишении трудолюбивых людей законной собственности. Мы противопоставим этому простую идею свободы. Динамичная экономика всегда превзойдёт левый кошмар удушающей бюрократии."
 FRA_protect_the_rights_of_man:0 "Защитить права человека"
 FRA_protect_the_rights_of_man_desc:0 "Они могут не говорить этого вслух, но очевидно: ограничение права собственности — лишь первый шаг к уничтожению всех прав, за которые боролись наши предки. Мы этого не допустим!"
 FRA_freedom_front:0 "Фронт свободы"
 FRA_freedom_front_desc:0 "Перед лицом хаоса и потрясений, обещанных коммунистами, приходится заключать союзы даже с партиями, которые лично могут быть отвратительны."
 FRA_stimulate_the_dynamic_market:0 "Стимулировать динамичный рынок"
 FRA_stimulate_the_dynamic_market_desc:0 "Динамичный рынок доказал, что является наиболее эффективной формой экономической организации. Но им управляют люди, которым порой нужны гарантии, что труд не пропадёт зря. Отменив ограничения и предоставив гарантии, мы снизим страх инвесторов и оживим экономику."
 FRA_agricultural_protectionism_desc:0 "Мировая экономика становится всё враждебнее к традиционным способам производства. Без защиты фермеров нас ждёт тяжёлый кризис: они не смогут конкурировать с массовыми продуктами из-за океана."
 FRA_economic_devolution:0 "Передача экономической власти"
 FRA_economic_devolution_desc:0 "Абсурдно полагать, будто какой-то парижский бюрократ лучше знает, что нужно компании в Бордо. Мы должны доверять предпринимателям и дать им возможность самостоятельно находить решения."
 FRA_promote_entrepeneurship:0 "Поощрить предпринимательство"
 FRA_promote_entrepeneurship_desc:0 "Сердцем динамичного рынка всегда был человек, который, заметив возможность, быстро ею пользуется. В последние годы этот дух был задушен ненужными правилами. Их следует отменить."
 FRA_utilize_the_leagues:0 "Использовать лиги"
 FRA_utilize_the_leagues_desc:0 "К сожалению, политическое насилие стало во Франции обычным явлением. Если страна хочет пережить угрозу коммунистической революции, нельзя отказываться от помощи тех, кто готов встретить коммунистических громил на улицах."
 FRA_national_regeneration:0 "Восстановление нации"
 FRA_national_regeneration_desc:0 "Избыток демократии и ошибочный республиканизм отравили страну и раскололи народ. Исцеление займёт много времени, но первые шаги наконец сделаны."
 FRA_national_regeneration_trigger_tt:0 "Совокупная поддержка неприсоединения и фашизма превышает 50%"
 FRA_destroy_decadence:0 "Уничтожить декадентство"
 FRA_destroy_decadence_desc:1 "Ни одна страна не становилась великой, если месяцами обсуждала даже самый ничтожный вопрос. Государства, защищённые океанами и мировыми империями, могут позволить себе такую роскошь. Мы — нет."
 FRA_integralism:0 "Интегрализм"
 FRA_integralism_desc:0 "Идеология интегрализма требует, чтобы все стороны общества объединились и действовали как части единого целого. Общество должно быть хорошо организовано, чтобы все его элементы работали согласованно."
 FRA_work:0 "Работа"
 FRA_work_desc:0 "Мастер является наиболее важной составляющей экономики. Если руководствоваться правильными людьми, нет более благородного призыва, чем поставить свой труд на службу своей стране."
 FRA_family:0 "Семья"
 FRA_family_desc:0 "Основная ячейка общества — не отдельный человек, а семья. Неспособность признать этот очевидный факт была величайшим пороком старой республики."
 FRA_fatherland:0 "Отчизна"
 FRA_fatherland_desc:0 "Страна превыше всего. В этом не может быть сомнений."
 FRA_political_unity:0 "Политическое единство"
 FRA_political_unity_desc:1 "История Франции после падения абсолютизма — это история политической борьбы. Когда страна была единой, она побеждала; когда её раздирали распри, она терпела поражения. Поэтому амбиции немногих не должны вредить благополучию большинства."
 FRA_diplomatic_freedom:0 "Дипломатическая свобода"
 FRA_diplomatic_freedom_desc:1 "Республиканские правительства приковали себя к искусственным государствам Восточной Европы, которые падут, как только лишатся нашей помощи. Они являются обузой, а не преимуществом, и мы от них откажемся."
 FRA_latin_entente:0 "Латинская Антанта"
 FRA_latin_entente_desc:1 "Братство между государствами — наследниками Римской империи неоспоримо. Германские народы слишком долго господствовали в Европе. Настало время вернуть наше историческое право."
 FRA_reach_out_to_spain:0 "Обратиться к Испании"
 FRA_reach_out_to_spain_desc:0 "Испания, едва оправившаяся после гражданской войны, является нашим естественным союзником в переустройстве континента."
 FRA_compensate_italy:0 "Подготовить компенсацию для Италии"
 FRA_compensate_italy_desc:0 "В прошлом споры из-за крошечных участков пустыни сталкивали наши страны. Эту нелепость легко прекратить, найдя взаимовыгодное решение."
 FRA_intervention_in_greece:0 "Вторжение в Грецию"
 FRA_intervention_in_greece_desc:0 "Греция контролирует одни из самых ценных территорий Средиземноморья. Мы не можем позволить враждебному правительству владеть ими и должны действовать первыми."
 FRA_the_congress_of_paris:0 "Парижский конгресс"
 FRA_the_congress_of_paris_desc:0 "Берлинский конгресс определил границы Африки, но современная карта напоминает лоскутное одеяло. Пора перекроить её и заложить основу новой колониальной империи."
 FRA_the_natural_borders_of_france:0 "Естественные границы Франции"
 FRA_the_natural_borders_of_france_desc:0 "Естественно, что страна прежде всего заботится о собственных интересах. Мирное сосуществование с Германией невозможно, поэтому мы должны обеспечить естественные границы для защиты сердца Франции."
 FRA_towards_a_new_europe:0 "По пути к Новой Европе"
 FRA_towards_a_new_europe_desc:1 "Франция стоит на перепутье. Можно цепляться за старый порядок, а можно принять новый. Поскольку Германия готовится переустроить континент, нам выгоднее быть с ней в хороших отношениях."
 FRA_establish_spheres_of_influence:0 "Установить сферы влияния"
 FRA_establish_spheres_of_influence_desc:1 "Столетиями наши народы считали друг друга вечными наследственными врагами из-за якобы несовместимых интересов. Но соглашение возможно, если чётко разграничить сферы влияния и не вмешиваться друг в друга."
 FRA_split_belgium:0 "Разделить Бельгию"
 FRA_split_belgium_desc:0 "Теперь, когда Бельгия находится в нашей сфере, франкоязычные земли должны вернуться домой. Остальная территория станет новым государством."
 FRA_align_belgium:0 "Установить дружественный режим в Бельгии"
 FRA_align_belgium_desc:0 "Бельгийцы обязаны существованием Франции и не должны забывать об этом. Даже если сохранить их независимость, там должно стоять дружественное правительство."
 FRA_grow_the_empire:0 "Нарастить империю"
 FRA_grow_the_empire_desc:0 "Абсурдно, что такая маленькая страна, как Бельгия, владеет колонией во много раз больше себя. Мы гораздо лучше способны управлять этой территорией."
 FRA_bring_home_quebec:0 "Вернуть Квебек"
 FRA_bring_home_quebec_desc:0 "Утраченная провинция со временем снова станет нашей. Все франкоязычные народы мира однажды воссоединятся с Отечеством."
 FRA_expand_to_the_suez:0 "Расшириться до Суэца"
 FRA_expand_to_the_suez_desc:0 "Раздел влияния в Леванте между нами и Британией был неработоспособным компромиссом, которого теперь можно больше не соблюдать."
 FRA_dominate_the_middle_east:0 "Установить господство на Ближнем Востоке"
 FRA_dominate_the_middle_east_desc:0 "Страны Ближнего Востока — искусственные образования, вырезанные из тела Османской империи. Они не более суверенны, чем обычная французская деревня, и им пора об этом напомнить."
 FRA_the_council_of_rambouillet:0 "Совет Рамбуйе"
 FRA_the_council_of_rambouillet_desc:0 "Страна охвачена смутой, и народ ищет сильного лидера. Республиканизм подвёл французов, и естественные правители Франции должны вернуться. Но сначала нужно подготовить почву для реставрации монархии."
 FRA_revise_the_constitution:0 "Пересмотреть конституцию"
 FRA_revise_the_constitution_desc:0 "Республиканская конституция задумывалась как временная мера, но просуществовала слишком долго. Мы перепишем её так, чтобы монарх смог вернуться."
 FRA_repeal_the_law_of_exile:0 "Отменить закон об изгнании"
 FRA_repeal_the_law_of_exile_desc:0 "Главам французских королевских домов и их наследникам запрещено находиться во Франции без особого разрешения. Прежде чем торжественно восстановить монархию, необходимо устранить эту досадную преграду."
 FRA_orleanist_restoration:1 "Возрождение орлеанистов"
 FRA_orleanist_restoration_desc:2 "Орлеанский дом пользуется значительной поддержкой французских роялистов. Некоторые предпочли бы иного кандидата, но именно орлеанистский наследник имеет наилучшие шансы мирно объединить страну."
 FRA_guarantee_the_constitution:0 "Гарантировать конституцию"
 FRA_guarantee_the_constitution_desc:0 "Прежде чем республиканская пресса начнёт безосновательные нападки на законность королевской власти, мы должны лишить её почвы, дав твёрдые гарантии соблюдения личных прав граждан."
 FRA_the_first_citizen_of_the_state:0 "Первый гражданин государства"
 FRA_the_first_citizen_of_the_state_desc:0 "Король, хотя и наделён значительной властью, не должен выглядеть тираном или абсолютистом старого типа. Современный монарх обязан уважать закон и первым защищать страну от незаконного захвата власти."
 FRA_counter_action_desc:0 "«Аксьон Франсез» долгое время была главным сторонником возвращения монархии. К сожалению, её взгляды по другим вопросам менее приемлемы. Пора сообщить, что она выполнила свою задачу, и устранить её."
 FRA_no_further_humiliations:0 "Конец унижениям"
 FRA_no_further_humiliations_desc:0 "На протяжении многих лет республиканские правительства позволяли Германии попирать международные договоры, порой нарушавшиеся ещё до высыхания чернил. Этому приходит конец."
 FRA_slum_clearing:0 "Расчистка трущоб"
 FRA_slum_clearing_desc:0 "Несмотря на статус великой державы, простой французский рабочий часто живёт в ужасной нищете. Король, достойный своего титула, не может терпеть такие условия."
 FRA_public_welfare:0 "Социальное обеспечение"
 FRA_public_welfare_desc:0 "Король, который не заботится о самых бедных подданных, недостоин называться королём."
 FRA_the_legitimate_heir:0 "Законный наследник"
 FRA_the_legitimate_heir_desc:1 "Легитимисты считают карлистскую ветвь законным наследником французского престола. Возведение их кандидата открывает заманчивую возможность править Испанией и Францией в двойной монархии."
 FRA_secure_the_crown_of_spain:0 "Захватить испанскую корону"
 FRA_secure_the_crown_of_spain_desc:0 "Первый шаг к осуществлению прав короля — обезопасить Испанию от различных самозваных правительств. Их мелкие распри уже однажды ввергли страну в кровавую гражданскую войну, и это не должно повториться."
 FRA_unite_the_crowns:0 "Объединить короны"
 FRA_unite_the_crowns_desc:0 "Обезопасив Испанию, мы можем объединить короны и создать новое государство — Франко-Испанское королевство."
 FRA_two_countries_two_crowns:0 "Две страны, две короны"
 FRA_two_countries_two_crowns_desc:0 "Невозможно объединить страны так, чтобы одна не чувствовала себя подчинённой другой. Поэтому король будет править ими в личной, но не юридической унии."
 FRA_proclaim_the_third_empire:0 "Провозгласить Третью империю"
 FRA_proclaim_the_third_empire_desc:0 "Бонапартисты могут считаться аутсайдерами в борьбе за престол, но они несут мечту о времени, когда вся Европа склонялась перед императором французов."
 FRA_avenge_waterloo:0 "Отомстить за Ватерлоо"
 FRA_avenge_waterloo_desc:0 "История Наполеона I навсегда связана с его величайшим поражением. Чтобы добиться успеха, мы должны победить там, где он проиграл."
 FRA_reorganize_the_dutch:0 "Реорганизовать Голландию"
 FRA_reorganize_the_dutch_desc:0 "Нидерланды тоже когда-то были частью Французской империи. После их поражения пора вернуть естественный порядок вещей."
 FRA_retribution_for_sedan:0 "Возмездие за Седан"
 FRA_retribution_for_sedan_desc:0 "Более полувека немцы празднуют битву при Седане и победу над Наполеоном III. В будущем каждый немец научится проклинать название этого места."
 FRA_disunite_germany:0 "Разобщить Германию"
 FRA_disunite_germany_desc:0 "Победа над Францией позволила Пруссии объединить мелкие германские государства. Теперь, после поражения Германии, справедливо обратить этот процесс вспять."
 FRA_return_to_borodino:0 "Вернуться в Бородино"
 FRA_return_to_borodino_desc:0 "При Бородине Наполеон был ближе всего к окончательной победе в Европе. Русская армия была почти уничтожена, и будь он немного быстрее, Россия могла бы запросить мира. Мы покажем миру, что это возможно."
 FRA_je_suis_la_deluge:1 "Je Suis Le Déluge"
 FRA_je_suis_la_deluge_desc:0 "Французская революция была потопом, смывшим старые и слабые режимы Европы. Теперь приходит новый потоп."
 FRA_coordinate_rearmament_tt:0 "Снижает стоимость лицензий на производство для участников нашей фракции."
 invite_to_faction_tt:0 "Будет приглашена в нашу фракцию."
 VIC_emergency_powers_to_petain:0 "Чрезвычайные полномочия для Петена"
 VIC_emergency_powers_to_petain_desc:0 "Битва за Францию проиграна, и для спасения государства необходимы радикальные меры. Президент не должен быть ограничен в действиях, которые считает необходимыми."
 VIC_the_national_revolution:0 "Национальная революция"
 VIC_the_national_revolution_desc:1 "Поражение несомненно вызвано фундаментальным пороком нашего государства. Его исправление займёт много времени, но потрясение может позволить Франции вернуться сильнее."
 VIC_long_term_economic_planning:0 "Долгосрочное экономическое планирование"
 VIC_long_term_economic_planning_desc:1 "Легко считать нынешнее положение важнее всего остального, но нельзя забывать о мерах, требующих долгого осуществления. Серия экономических планов позволит эффективно развивать хозяйство."
 VIC_aid_small_businesses:0 "Помочь малому бизнесу"
 VIC_aid_small_businesses_desc:2 "Многочисленные малые предприятия тяжело пострадали от нормирования и других военных мер. Следует помочь им выжить."
 VIC_venerate_the_craftsman:0 "Почитать ремесленников"
 VIC_venerate_the_craftsman_desc:0 "Слишком долго обсуждение труда было сосредоточено на промышленном работнике, который работает на большой фабрике для большой компании. Пора показать достижения искусного мастера, работающего в собственной мастерской, обеспечивающего свою семью."
 VIC_down_with_marianne:0 "Долой Марианну!"
 VIC_down_with_marianne_desc:1 "Псевдорелигиозное поклонение Марианне, символу французского республиканизма, извратило сознание народа. Как и никчёмная Республика, которую она олицетворяет, все её следы должны быть уничтожены."
 VIC_up_with_jean_darc:1 "Вместе с Жанной д'Арк"
 VIC_up_with_jean_darc_desc:1 "Жанна д’Арк храбро сражалась с превосходящим врагом, пожертвовала всем ради Отечества и объединила страну для изгнания захватчиков. Разве она не лучший образец для молодёжи, чем Марианна?"
 VIC_celebrate_motherhood:0 "Почитать материнство"
 VIC_celebrate_motherhood_desc:0 "Очевидно, что место женщины — в доме, как место мужчины — у станка или в поле. Народу следует напомнить, что женский труд столь же жизненно важен для государства, как и мужской."
 VIC_prosecute_the_losers:0 "Преследовать проигравших"
 VIC_prosecute_the_losers_desc:0 "В прошлую войну Франция годами сдерживала армии кайзера, но в нынешней быстро рухнула. Этому есть причина, и мы не остановимся, пока не найдём её и не привлечём виновных к ответственности."
 VIC_concessions_to_the_germans:1 "Уступки немцам"
 VIC_concessions_to_the_germans_desc:0 "Обстоятельства требуют договориться с бывшими врагами. Необходимо найти способ облегчить тяжёлое бремя, возложенное на страну."
 VIC_mandatory_work_service:0 "Обязательная трудовая повинность"
 VIC_mandatory_work_service_desc:1 "Нам удалось добиться от немцев обещания сократить наши оккупационные издержки, если мы будем снабжать их рабочими. Однако мало кто из людей готов сделать необходимую работу, чтобы помочь своему отечеству в час нужды. Там, где стимулы потерпели неудачу, мы должны теперь, к сожалению, использовать принуждение."
 VIC_a_nation_reborn:0 "Возрождение нации"
 VIC_a_nation_reborn_desc:0 "В конце долгого и болезненного восстановления униженной и побеждённой страны возникнет новая Франция, очищенная от рака республиканизма и внутренних расколов."
 VIC_end_the_occupation:0 "Прекратить оккупацию"
 VIC_end_the_occupation_desc:0 "Национальная революция завершена, и мы готовы занять место рядом с бывшими врагами, сражаясь за новую Европу, свободную от большевизма и разрушительных соблазнов республиканизма."
 VIC_the_national_bureau_of_statistics:0 "Национальное бюро статистики"
 VIC_the_national_bureau_of_statistics_desc:0 "Чтобы вести народ к лучшему будущему, нужны точные данные для принятия решений. Мы создадим новое ведомство для их сбора."
 VIC_the_legionary_service_order:0 "Служба в Легионе"
 VIC_the_legionary_service_order_desc:0 "Армия в основном разоружена и слишком растянута, чтобы защищать всю Францию. Нам нужна новая патриотическая организация для поддержки режима."
 VIC_form_the_milice:0 "Организовать ополчение"
 VIC_form_the_milice_desc:0 "Сопротивление по всей Франции крепнет, и нужна сила, способная бороться с ним. Мы наберём самых преданных патриотов и дадим им широкую свободу действий для усмирения террористов."
 VIC_anti_bolshevist_volunteers:0 "Добровольцы для борьбы с большевизмом"
 VIC_anti_bolshevist_volunteers_desc:0 "Величайшая борьба в истории человечества идёт между западной цивилизацией и коммунизмом. Мы не можем бездействовать, пока разворачивается эта титаническая битва."
 VIC_rebuild_the_military:0 "Возродить армию"
 VIC_rebuild_the_military_desc:0 "Французская армия полностью разгромлена и унижена. Для восстановления её боеспособности потребуется долгий труд."
 VIC_finish_the_naval_buildup:0 "Завершить строительство флота"
 VIC_finish_the_naval_buildup_desc:0 "Поздняя Республика заложила несколько кораблей для модернизации флота. Программа началась слишком поздно и шла слишком медленно, но эти суда ещё могут стать ядром нового французского флота."
 VIC_hidden_materials:0 "Скрытые материалы"
 VIC_hidden_materials_desc:1 "Германия не смогла бы так быстро восстановить армию, если бы не нарушала договоры. Поэтому справедливо и нам поступить так же."
 VIC_analyze_our_defeat:0 "Проанализировать наше поражение"
 VIC_analyze_our_defeat_desc:0 "Наше поражение не было неизбежным. Многие не выполнили долг в длинной цепочке преступной беспечности. Мы выясним причины и лучше подготовимся к будущему."
 VIC_modernize_the_airforce:0 "Модернизировать ВВС"
 VIC_modernize_the_airforce_desc:0 "Самым унизительным было наше бессилие в воздухе. Современных самолётов было слишком мало. Пока вокруг продолжается война и появляются новые машины, нельзя допустить повторения такой ситуации."
 VIC_learn_from_the_enemy:0 "Учиться у своего врага"
 VIC_learn_from_the_enemy_desc:0 "Самый быстрый способ понять причины поражения — изучить, что противник сделал правильно."
 VIC_buy_from_the_enemy:0 "Приобрести у врага"
 VIC_buy_from_the_enemy_desc:0 "Военная промышленность не обеспечила нас достаточным количеством современного оружия и всё ещё не способна это сделать. Придётся покупать вооружение у любого доступного поставщика."
 FRA_appeal_to_the_french_nation:0 "Воззвать к французской нации"
 FRA_appeal_to_the_french_nation_desc:0 "Франция проиграла битву, но не войну. Долг каждого патриота — продолжать сопротивление."
 FRA_appeal_to_overseas_territories:0 "Воззвать к заморским территориям"
 FRA_appeal_to_overseas_territories_desc:0 "Метрополия могла пасть, но значительная часть империи остаётся свободной. Если привлечь её на нашу сторону, мы сможем перенести войну обратно к врагу."
 FRA_appeal_to_overseas_territories_tt:0 "Колониальные территории в разных частях мира могут перейти на нашу сторону."
 FRA_intervention_in_north_africa:0 "Вторжение в Северную Африку"
 FRA_intervention_in_north_africa_desc:0 "Северная Африка — лучший плацдарм для вторжения и освобождения Родины. Переход региона на нашу сторону жизненно важен."
 FRA_intervention_in_west_africa:0 "Вторжение в Западную Африку"
 FRA_intervention_in_west_africa_desc:0 "В Западной Африке живут миллионы людей, которых можно призвать в новую армию для освобождения Родины."
 FRA_intervention_in_syria:0 "Вторжение в Сирию"
 FRA_intervention_in_syria_desc:0 "Лишив врага стратегических территорий в Сирии, мы защитим Суэцкий канал и значительно улучшим положение в Восточном Средиземноморье."
 FRA_intervention_in_indochina:0 "Вторжение в Индокитай"
 FRA_intervention_in_indochina_desc:0 "Далёкий от европейских боёв Индокитай идеально подходит для защиты наших интересов в регионе."
 FRA_intervention_in_central_africa:0 "Вторжение в Центральную Африку"
 FRA_intervention_in_central_africa_desc:0 "Центральная Африка имеет жизненно важное значение для союзных военных усилий, а её переход на нашу сторону станет крупной пропагандистской победой."
 FRA_intervention_in_madagascar:0 "Вторжение в Мадагаскар"
 FRA_intervention_in_madagascar_desc:2 "Если враг захватит и укрепит Мадагаскар, нас ждёт катастрофа в Индийском океане. Быстрое решительное действие сохранит остров на нашей стороне."
 FRA_form_the_national_committee:0 "Основать Национальный комитет"
 FRA_form_the_national_committee_desc:0 "Мало кто верил в успех нашего дела, но теперь мы достаточно сильны, чтобы создать полноценное правительство в изгнании, готовое управлять освобождёнными французскими территориями."
 FRA_form_the_provisional_government_of_the_republic:1 "Образовать временное правительство"
 FRA_form_the_provisional_government_of_the_republic_desc:0 "После освобождения Парижа мы больше не правительство в изгнании. Пора начинать трудное восстановление страны."
 FRA_continue_the_fight:0 "Продолжать борьбу"
 FRA_continue_the_fight_desc:0 "Пока к нам присоединилось немного солдат, но имеющихся необходимо вооружить и оснастить."
 FRA_the_free_french_navy:0 "Свободный французский флот"
 FRA_the_free_french_navy_desc:0 "Наши союзники ведут отчаянную борьбу за выживание, а морские пути имеют решающее значение. Мы должны внести свой вклад."
 FRA_colonial_recruitment_desc:0 "Поскольку метрополия недоступна для набора, придётся обратиться за помощью к колониям. Многие подданные готовы взяться за оружие."
 FRA_the_regiment_normandie:0 "Полк «Нормандия-Неман»"
 FRA_the_regiment_normandie_desc:0 "Важно, чтобы французы сражались на всех фронтах. Теперь, когда Советы воюют с нашим общим врагом, можно отправить им небольшую группу лётчиков-истребителей."
 FRA_refus_absurde:0 "Refus Absurde"
 FRA_refus_absurde_desc:0 "Даже в час поражения в некоторых сердцах сохраняется воля к сопротивлению. Они станут основой движения Сопротивления на оккупированных территориях."
 FRA_the_maquis:0 "Маки"
 FRA_the_maquis_desc:2 "Сельские районы Франции предлагают прикрытие для всех, кто хочет сбежать от оккупанта или их лакеев-коллаборационистов. Мы должны поддержать людей, которые в акте сопротивления отказывают в труде врагу, чтобы со временем превратить эти районы в очаги сопротивления."
 FRA_reach_out_to_trade_unions:0 "Обратиться к профсоюзам"
 FRA_reach_out_to_trade_unions_desc:0 "Для удара по промышленности, работающей на врага, необходимо наладить связь с рабочими. Они смогут задерживать и саботировать производство гораздо эффективнее любой внешней силы."
 FRA_cooperation_with_the_communists:0 "Сотрудничество с коммунистами"
 FRA_cooperation_with_the_communists_desc:0 "В общей борьбе нельзя отвергать союзника, даже если он называет себя товарищем."
 FRA_connections_to_industrialists:0 "Связи с промышленниками"
 FRA_connections_to_industrialists_desc:0 "Сотрудничество с рабочими военной промышленности полезно, но связь с руководителями предприятий даёт собственные преимущества."
 FRA_the_civil_and_military_organization:0 "Гражданская и военная организация"
 FRA_the_civil_and_military_organization_desc:0 "Множество малых групп сопротивления объединяются в крупную организацию. Мы должны это поддержать."
 FRA_national_council_of_the_resistance_desc:0 "Сопротивление во Франции крепнет и уже нуждается в новом руководящем комитете для координации действий."
 FRA_national_uprising_desc:0 "Час настал. Пора взять оружие и выйти из тени, скрывавшей вас долгие годы!"
 FRA_french_forces_of_the_interior:0 "Французские внутренние силы"
 FRA_french_forces_of_the_interior_desc:1 "По всей Франции Сопротивление насчитывает тысячи вооружённых бойцов. По мере продвижения нас и союзников они будут вливаться в нашу армию."
 FRA_french_forces_of_the_interior_tt:0 "Создаёт слабые пехотные части в каждом освобождённом национальном регионе."
 FRA_naval_rearmament:0 "Перевооружение флота"
 FRA_naval_rearmament_desc:0 "Судостроительная промышленность была заброшена, пока мы пытались догнать другие области. Теперь существует реальная угроза уступить соперникам в Средиземном море и Атлантике. Нужно наверстать упущенное."
 FRA_colonial_naval_bases:0 "Колониальные морские базы"
 FRA_colonial_naval_bases_desc:0 "Ключ к глобальному влиянию — возможность содержать флот вдали от родных вод. У нас уже есть обширные колонии, теперь их следует превратить в базы снабжения и ремонта."
 FRA_develop_colonial_dockyards:0 "Развитие колониальных верфей"
 FRA_develop_colonial_dockyards_desc:0 "Расширив и модернизировав базы по всей империи, можно разместить там тяжёлую промышленность и построить крупные доки для строительства кораблей за морем."
 FRA_the_old_school:0 "Старая школа"
 FRA_the_old_school_desc:0 "Несмотря на прогресс технологий, основой морской мощи остаётся крупный корабль при поддержке остальных сил. Будь то линкор или авианосец, судостроительную промышленность необходимо расширять."
 FRA_carrier_planes:0 "Самолёты на авианосцах"
 FRA_carrier_planes_desc:0 "Авианосец хорош настолько, насколько хороши его самолёты. Без современных машин он является пустой тратой ресурсов."
 FRA_rush_the_richelieus:0 "«Ришелье», вперёд!"
 FRA_rush_the_richelieus_desc:0 "Поскольку положение в Европе становится всё отчаяннее, у нас нет времени строить новые надводные корабли обычными темпами. Необходимо приоритетно направить материалы на скорейший ввод в строй новых линкоров."
 FRA_prioritize_the_joffre:0 "Приоритет для «Жоффра»"
 FRA_prioritize_the_joffre_desc:0 "Наш нынешний авианосный флот безнадёжно устарел и уступает любому потенциальному противнику. Мы должны обеспечить высший приоритет новому проекту авианосца."
 FRA_the_young_school:0 "Новая школа"
 FRA_the_young_school_desc:0 "Развитие авиации, подводных лодок и торпед сделало крупные корабли устаревшими. При ограниченной судостроительной промышленности мы не можем тратить время и деньги на гигантские плавучие крепости, беспомощные перед угрозами современного морского боя. Вместо этого следует повысить эффективность строительства большого числа малых кораблей."
 FRA_undersea_combat:0 "Подводный бой"
 FRA_undersea_combat_desc:0 "За последнее десятилетие подводная лодка достигла зрелости. Теперь она представляет смертельную угрозу любым надводным кораблям, оставаясь всё более трудной для обнаружения и уничтожения."
 FRA_surface_combat:0 "Надводный бой"
 FRA_surface_combat_desc:0 "С развитием артиллерии стало почти невозможно построить корабль, способный пережить длительную перестрелку с другим крупным судном. Гораздо лучше иметь флот современных эсминцев и торпедных катеров, способных подавить противника массированными торпедными залпами."
 FRA_prioritize_the_joffre_tt:0 "Добавляет современный §Yавианосец§! с готовностью 40% в очередь строительства."
 POR_infrastructure_in_angola_tt:0 "Добавляет §Yвоенно-морскую базу 2-го уровня§! в провинции Намибе в Анголе.\n   Добавляет §Yвоенно-морскую базу 3-го уровня§! в провинции Луанда в Анголе.\n"
 FRA_SNCAN_formed:0 "Создана SNCAN"
 FRA_SNCAO_formed:0 "Создана SNCAO"
 FRA_SNCASE_formed:0 "Создана SNCASE"
 FRA_SNCASO_formed:0 "Создана SNCASO"
 POR_colonial_assimilation_policy_desc:0 "В отличие от других стран, португальская нация определяется не расой, а общей культурой и цивилизаторской миссией. Вместо расовых предрассудков нам необходимо смешение народов."
 POR_colonial_army_desc:0 "Чтобы иметь сильную страну, нельзя полагаться лишь на армию метрополии. Мы должны формировать колониальные части, вооружать их и обучать современной войне."
 POR_luso_tropicalism:0 "Лузотропикализм"
 POR_luso_tropicalism_desc:1 "Мы должны признать многокультурную природу Португалии, сложившуюся с XV века, и подчеркнуть национальное единство, интегрировав африканские колонии в нашу территорию и предоставив местному населению гражданство. Разумеется, найдутся противники, но мы обязаны поступить правильно по отношению к людям, живущим на наших землях."
 POR_limited_self_rule:0 "Ограниченное самоуправление"
 POR_limited_self_rule_desc:0 "Расширив автономию африканских колоний и позволив им создавать собственные правительства, мы сможем сосредоточиться на более срочных вопросах. Такая деколонизация может сблизить нас с демократиями всего мира."
 POR_infrastructure_in_angola:0 "Инфраструктура в Анголе"
 POR_infrastructure_in_angola_desc:0 "Ангола таит множество неисследованных богатств. Мы должны развить инфраструктуру региона, чтобы в будущем использовать его ресурсы."
 POR_develop_north_angola:0 "Развить Северную Анголу"
 POR_develop_north_angola_desc:1 "В Северной Анголе обнаружены залежи железа. Следует создать добывающую промышленность для освоения этого ценного ресурса."
 POR_develop_south_angola:0 "Развить Южную Анголу"
 POR_develop_south_angola_desc:0 "Поиски ресурсов на юге Анголы увенчались успехом. Теперь можно развивать необходимую добывающую промышленность."
 POR_portuguese_oil:0 "Португальская нефть"
 POR_portuguese_oil_desc:0 "Страна без нефти не сможет поддерживать экономику в случае войны. Мы должны искать в Анголе коммерчески пригодные нефтяные месторождения."
 POR_develop_mozambique:0 "Развить Мозамбик"
 POR_develop_mozambique_desc:0 "Развивая инфраструктуру и промышленность Мозамбика, мы сможем использовать его залежи алюминия в собственных интересах."
 POR_continue_the_public_works:0 "Продолжить развитие инфраструктуры"
 POR_continue_the_public_works_desc:0 "Благодаря государственному регулированию после многих лет тяжёлого финансового положения нам удалось стабилизировать экономику. Следует продолжать инвестиции в общественные проекты для развития инфраструктуры."
 POR_instituto_superior_tecnico:0 "Instituto Superior Técnico"
 POR_instituto_superior_tecnico_desc:0 "Португалии нужна передовая инженерная школа с современными учебными и исследовательскими возможностями, чтобы не отстать в приближающейся борьбе."
 POR_ogme:0 "OGME"
 POR_ogme_desc:0 "Инвестиции в Главные мастерские инженерного имущества позволят значительно быстрее снабжать армию современным и качественным снаряжением."
 POR_ogma:0 "OGMA"
 POR_ogma_desc:0 "Расширение мощностей Главных мастерских авиационного имущества значительно улучшит производство самолётов."
 POR_roads_bridges_and_dams:0 "Дороги, мосты и плотины"
 POR_roads_bridges_and_dams_desc:0 "Следует инвестировать в общественные строительные проекты, направленные на улучшение инфраструктуры и дорожной сети."
 POR_extraction_industries:0 "Добывающая промышленность"
 POR_extraction_industries_desc:0 "Многие наши богатства скрыты в земле, но шахты устарели и используют кустарные методы. Мы должны создать современную добывающую промышленность."
 POR_hydroelectricity:0 "Электричество с ГЭС"
 POR_hydroelectricity_desc:0 "Благодаря крупным инвестициям на севере и в центре Португалии теперь можно построить сеть плотин, которая будет вырабатывать электроэнергию и регулировать течение рек."
 POR_military_vehicles:0 "Военная техника"
 POR_military_vehicles_desc:0 "Армии нужны современные машины для будущих сражений. Чтобы победить в грядущих конфликтах, необходимо обеспечить ей достаточные поставки техники высшего качества."
 POR_portuguese_artillery:0 "Португальская артиллерия"
 POR_portuguese_artillery_desc:0 "Полевая артиллерия жизненно важна на современном поле боя. Следует инвестировать в новые предприятия, позволяющие увеличить производство артиллерийских орудий."
 POR_advanced_artillery:0 "Усовершенствованная артиллерия"
 POR_advanced_artillery_desc:0 "Мы должны разрабатывать новые артиллерийские системы и обучать войска более эффективным способам ведения заградительного огня и поддержки наступающей пехоты."
 POR_military_research_facilities:0 "Армейские исследовательские комплексы"
 POR_military_research_facilities_desc:0 "Усилия по развитию оружейной промышленности должны сопровождаться достаточными инвестициями в исследования, если мы хотим сохранить современную и боеспособную армию."
 POR_armor_focus:0 "Ставка на бронетехнику"
 POR_armor_focus_desc:0 "Для господства на поле боя нужны лучшие боевые машины. Следует расширить предприятия по производству бронетехники и инвестировать в дальнейшие исследования."
 POR_mechanized_focus:0 "Ставка на боевые машины"
 POR_mechanized_focus_desc:0 "Механизированные машины гораздо лучше колёсной техники защищают пехоту под вражеским огнём. Исследования и производство таких машин могут оказаться решающими."
 POR_light_aircraft_focus:0 "Ставка на легкую авиацию"
 POR_light_aircraft_focus_desc:0 "Авиация постоянно развивается, и мы должны создать полноценную авиапромышленность для поддержки армии."
 POR_advanced_light_aircraft:0 "Усовершенствованная лёгкая авиация"
 POR_advanced_light_aircraft_desc:0 "Координация авиации с другими родами войск жизненно важна. Разработка современных самолётов поддержки резко повысит наши шансы на успех в бою."
 POR_jet_research:0 "Исследования реактивных двигателей"
 POR_jet_research_desc:0 "Чтобы господствовать в небе, необходимо внедрять новейшие достижения в самолётостроении. Наиболее перспективным направлением представляется исследование новых способов тяги, таких как реактивные двигатели."
 POR_industrial_modernization:0 "Модернизация промышленности"
 POR_industrial_modernization_desc:0 "Большая часть гражданской промышленности всё ещё устарела. Вложения времени и ресурсов в её обновление значительно повысят эффективность."
 POR_a_new_industry_desc:1 "Благодаря новейшим достижениям автоматизированного производства мы можем продолжать улучшать и расширять гражданские предприятия, достигая новых уровней эффективности."
 POR_food_industries:0 "Пищевая промышленность"
 POR_food_industries_desc:0 "Португалии пора сделать шаг вперёд и оживить обрабатывающую промышленность. Начать можно со строительства пищевых фабрик на севере страны."
 POR_textile_industry:0 "Текстильная промышленность"
 POR_textile_industry_desc:0 "Чтобы полностью раскрыть потенциал текстильной отрасли, необходимо построить новые фабрики для переработки большого объёма хлопка, производимого на наших территориях."
 POR_second_navy_reequipment:0 "Второе переоборудование флота"
 POR_second_navy_reequipment_desc:0 "Первый этап программы перевооружения флота завершён. Теперь следует перейти ко второму: улучшить верфи и объявить тендер на покупку ряда современных кораблей за рубежом."
 POR_a_powerful_merchant_marine:0 "Мощный торговый флот"
 POR_a_powerful_merchant_marine_desc:0 "Нам нужен крупный торговый флот, способный перевозить все необходимые экономике ресурсы. Для этого можно строить торговые суда на небольших верфях."
 POR_merchant_marine_protection:0 "Защита торгового флота"
 POR_merchant_marine_protection_desc:0 "Опыт Великой войны научил нас, что торговые суда необходимо защищать от угрозы подводных лодок."
 POR_fuzileiros:0 "Фузилёры"
 POR_fuzileiros_desc:0 "Хорошо обученная морская пехота необходима для безопасности наших заморских владений."
 POR_naval_research_institute:0 "Морской исследовательский институт"
 POR_naval_research_institute_desc:0 "При должных инвестициях наша Военно-морская школа сможет активнее вести исследования и давать более качественное образование будущим офицерам."
 POR_air_naval_research:0 "Взаимодействие авиации и флота"
 POR_air_naval_research_desc:0 "Мы должны собрать лучших лётчиков и морских офицеров, чтобы разработать новые способы координации растущих военно-воздушных и военно-морских сил."
 POR_arsenal_do_alfeite:0 "«Арсенал ду Алфейти»"
 POR_arsenal_do_alfeite_desc:0 "Главным приоритетом должно стать создание сильного флота, способного защищать нашу разбросанную империю. Нам нужны мощности и знания для строительства более крупных кораблей. Главные военно-морские верфи Лиссабона следует расширить, а специалистов-кораблестроителей — нанять."
 POR_national_cruiser_production:0 "Национальное производство крейсеров"
 POR_national_cruiser_production_desc:0 "Следует и дальше сосредоточиться на строительстве крупных кораблей. Современные крейсеры обеспечат флоту огромную огневую мощь."
 POR_battleship_effort:0 "Развитие линкоров"
 POR_battleship_effort_desc:0 "Чтобы господствовать на морях, необходимо нарастить производство мощных современных линкоров, один вид которых заставит содрогнуться флоты многих стран."
 POR_atlantic_defense_strategy:0 "Стратегия обороны Атлантики"
 POR_atlantic_defense_strategy_desc:0 "Наши острова, изолированные посреди океана, легко захватить поодиночке. Однако при должных инвестициях их можно превратить в непотопляемые авианосцы!"
 POR_endless_sea_desc:0 "Наши анклавы в Азии уязвимы перед враждебными империями, окружающими их. Необходимо укрепить оборону, чтобы они могли выдержать любое возможное вторжение."
 POR_popular_front:0 "Народный фронт"
 POR_popular_front_desc:0 "Испанский Народный фронт указывает путь. Мы должны объединить коммунистов, социалистов и анархистов в широкий фронт, который возглавит сопротивление фашизму и мировую революцию."
 POR_nation_in_arms_desc:0 "Народ Португалии должен быть готов сражаться против зла фашизма и империализма. Мы обязаны выдать людям оружие и начать военную подготовку, чтобы в нужный момент страна была готова к борьбе!"
 POR_unify_leftist_youth_wings:0 "Объединить крылья левой молодежи"
 POR_unify_leftist_youth_wings_desc:0 "Мы создадим молодёжное крыло ПКП, объединив существующие организации и призвав потенциальных членов вступить. Так появится площадка, где молодые сторонники смогут встречаться, обсуждать идеи и делать первые шаги в политической деятельности."
 POR_nationalize_industry:0 "Национализировать промышленность"
 POR_nationalize_industry_desc:0 "Частный капитал слишком долго истощал экономику и тормозил развитие общества. Мы должны избавиться от него, национализировав частные компании и взяв под контроль производство каждой фабрики ради блага народов Португалии."
 POR_reorganization_of_the_communist_party:0 "Реорганизация Коммунистической партии"
 POR_reorganization_of_the_communist_party_desc:0 "При диктатуре Салазара многие члены партии были арестованы. Мы вернём их и реорганизуем партийную структуру, обеспечив руководство каждого отдела наиболее квалифицированными людьми."
 POR_potential_civil_war_low_requirement_tt:0 "§RЕсли §YСтабильность§! §Rниже §Y40%§R Когда этот фокус будет завершен, начнется гражданская война!§!§!§!§!"
 POR_potential_civil_war_high_requirement_tt:0 "§RЕсли §YСтабильность§! §Rниже §Y60%§R Когда этот фокус будет завершен, начнется гражданская война!§!§!§!§!"
 POR_join_the_comintern:0 "Вступить в Коминтерн"
 POR_join_the_comintern_desc:0 "Советский Союз проложил путь, по которому могут последовать другие страны. Сотрудничество с советскими товарищами будет выгодно, ведь мы стремимся к одним целям."
 POR_research_collaboration:0 "Научное сотрудничество"
 POR_research_collaboration_desc:0 "Наши товарищи в Советском Союзе располагают амбициозной и хорошо финансируемой научной программой. Соглашение об обмене технологическими достижениями принесёт взаимную пользу в пролетарской войне."
 POR_support_the_spanish_republic:1 "Поддержать Испанскую Республику"
 POR_support_the_spanish_republic_desc:0 "Народы Испании сражаются против националистического переворота, угрожающего захватить всю страну. Мы должны поддержать республиканцев: если они падут, у наших границ появится новый потенциальный враг."
 POR_workers_of_iberia_unite:0 "Рабочие Иберии, объединяйтесь!"
 POR_workers_of_iberia_unite_desc:1 "Мы должны провозгласить единство иберийского пролетариата против всех видов тирании и присоединиться к испанским товарищам в гражданской войне, став бастионом против фашизма.\nНаши жертвы не будут забыты, ведь наше дело правое!"
 POR_workers_of_iberia_unite_civil_war_tt:0 "§RСторонники §Yнеприсоединения§! начнут гражданскую войну!§!"
 POR_the_iberian_socialist_union:1 "Иберийский социалистический союз"
 POR_the_iberian_socialist_union_desc:1 "Наша общая борьба с испанскими республиканцами во время войны показывает, что настало время объединить Иберийский полуостров под властью народного социалистического правительства.\nВместе мы раз и навсегда победим врагов!"
 POR_visit_the_front:0 "Посетить фронт"
 POR_visit_the_front_desc:0 "Несколько португальских офицеров будут отправлены на испанский фронт для наблюдения за применением новых тактических приёмов авиации."
 POR_they_need_our_help:0 "Им нужна наша помощь"
 POR_they_need_our_help_desc:0 "Положение в Испании критическое. Мы должны действовать сейчас, чтобы не допустить победы националистов. Мы присоединимся к испанским братьям и вместе разгромим мятежников!"
 POR_intervention_in_spain:0 "Вторжение в Испанию"
 POR_intervention_in_spain_desc:0 "Курс испанского правительства для нас неприемлем. Его амбиции угрожают нашим идеалам и народу, поэтому мы должны силой искоренить эту враждебную политику."
 POR_intervention_in_spain_tt:0 "[Root.GetFlag]§Y[Root.GetNameDefCap]§!:\nПолучает цель войны §YСвержение правительства§! против [GetSpanishRepublicFlagAndNameDef]."
 POR_securing_the_free_world:0 "Помощь свободному миру"
 POR_securing_the_free_world_desc:0 "Чтобы стать великой державой, нужно начать действовать как великая держава. Мы будем защищать малые страны, разделяющие наши идеалы и интересы, от любых внешних угроз."
 portugal_guarantees_freedom_tt:0 "Гарантирует независимость всех независимых малых §Yдемократических§! или §Yнеприсоединившихся§! государств Европы."
 POR_protect_chinese_civilians:0 "Защитить китайских мирных граждан"
 POR_protect_chinese_civilians_desc:0 "Сообщения о манёврах иностранных войск близ португальской территории Макао вызвали тревогу среди мирного населения. Мы не потерпим угроз нашим гражданам и землям и должны действовать ради славы нации!"
 POR_strict_neutrality_in_the_spanish_civil_war:1 "Строгий нейтралитет в гражданской войне в Испании"
 POR_strict_neutrality_in_the_spanish_civil_war_desc:0 "В Испании началась гражданская война, но сейчас мы не можем позволить втянуть себя в международный конфликт. Следует провозгласить строгий нейтралитет, одновременно укрепляя страну и улучшая дипломатические отношения."
 POR_british_investment_in_mines:0 "Британские инвестиции в шахты"
 POR_british_investment_in_mines_desc:0 "Британское правительство проявило интерес к инвестициям в разработку наших ресурсов. Это ценная возможность улучшить добывающие предприятия и продвинуть научные исследования."
 POR_british_industrial_investments:0 "Британские инвестиции в промышленность"
 POR_british_industrial_investments_desc:0 "Гражданскую промышленность необходимо расширить, чтобы удовлетворить потребности растущей экономики. Британское правительство готово вновь инвестировать в страну, если мы теснее сблизимся с его идеалами..."
 POR_allow_free_elections:0 "Разрешить свободные выборы"
 POR_allow_free_elections_desc:0 "Британское влияние наконец принесло плоды, и народ требует права выбирать правительство, которое лучше всего представляет его интересы."
 POR_join_the_allies:0 "Присоединиться к Союзникам"
 POR_join_the_allies_desc:0 "Пора последовать за ведущими демократиями Европы и присоединиться к их борьбе. Вместе мы выстоим против любого врага!"
 POR_research_sharing:0 "Обмен исследованиями"
 POR_research_sharing_desc:0 "Наши британские братья по оружию намного опережают нас в технологиях. Соглашение об обмене исследованиями укрепит нас, а следовательно — и весь союз."
 POR_oppose_germany:0 "Противостоять Германии"
 POR_oppose_germany_desc:0 "Враждебные действия Германии совершенно недопустимы, но до сих пор никто не смог их остановить. Теперь, когда армия готова к войне, Португалия вступит в борьбу против тех, кто стремится лишить народы свободы."
 POR_british_guns:0 "Британское оружие"
 POR_british_guns_desc:0 "Наша военная промышленность не готова производить современное вооружение. Мы можем заключить договор о его закупке в Великобритании."
 POR_estado_novo_desc:1 "С конституции 1933 года мы следуем принципам корпоративизма и автаркии. Самый надёжный путь к дальнейшему укреплению нации — углубить этот курс и построить новое, более могущественное государство."
 POR_support_the_spanish_nationalists:1 "Поддержать испанских националистов"
 POR_support_the_spanish_nationalists_desc:0 "Мы должны поддержать испанских националистов, которые сражаются за славу своей страны против коммунистической и анархистской угрозы."
 POR_portuguese_legion:0 "Португальский легион"
 POR_portuguese_legion_desc:1 "После начала гражданской войны в Испании военная полиция была отправлена к границе. Мы должны создать добровольческое патриотическое вооружённое ополчение, способное взять на себя её полицейские обязанности."
 POR_observation_mission:0 "Наблюдательная миссия"
 POR_observation_mission_desc:0 "В Испанию будет отправлена военная наблюдательная миссия для изучения новых тактических приёмов и систем вооружения."
 POR_send_assistance:0 "Отправить помощь"
 POR_send_assistance_desc:0 "Судьба националистов в гражданской войне висит на волоске, поскольку фронты стабилизировались. Мы должны вступить в борьбу, помочь мятежникам разгромить республиканское правительство и навсегда искоренить коммунистическую угрозу в Иберии."
 POR_nationalist_intervention:0 "Вмешательство националистов"
 POR_nationalist_intervention_desc:0 "Амбиции испанского правительства угрожают нашим интересам, и этого нельзя терпеть. Если соседи не готовы добровольно присоединиться к нашему делу, придётся убедить их более вескими средствами."
 POR_nationalist_intervention_tt:0 "[Root.GetFlag]§Y[Root.GetNameDefCap]§!:\nПолучает цель войны §YСвержение правительства§! против [SPA.GetFlag][SPA.GetNameDefCap]."
 POR_national_syndicalism_desc:0 "Мы исправим ошибку Салазара, распустившего Национал-синдикалистское движение и изгнавшего Франсишку Ролана Прету. Необходимо вновь легализовать движение и вернуть Прету."
 POR_camisas_azuis:0 "Голубые рубашки"
 POR_camisas_azuis_desc:0 "«Синие рубашки» были вооружённым ополчением национал-синдикалистов, но организацию осудили и распустили из-за её идеалов. Мы должны вновь разрешить её создание, поскольку мобилизация «синих рубашек» даст армии ценный источник людских ресурсов."
 POR_join_the_axis:0 "Присоединиться к странам Оси"
 POR_join_the_axis_desc:0 "Мы должны объединиться с Германией и поддержать её в грядущих конфликтах. Германия может быть главной державой Центральной Европы, но Португалия станет величайшей заморской империей!"
 POR_research_agreements:0 "Исследовательские соглашения"
 POR_research_agreements_desc:1 "Следует заключить с Германией соглашение, открывающее доступ к её передовым военным технологиям. Это ускорит исследования и позволит применять более совершенное снаряжение на поле боя."
 POR_the_fifth_empire_desc:0 "Пятая империя означает высшее соединение интеллектуального и духовного знания, Веры и Империи. Только португальская нация способна привести мир к этой реальности, объединив его не только территориально, но также духовно и культурно."
 POR_expand_the_chinese_territories:0 "Расширить китайские территории"
 POR_expand_the_chinese_territories_desc:0 "Теперь, когда азиатские страны ослаблены войной, пора расширить наши владения от Макао вглубь Китая. Измотанные китайские и японские армии нам не соперники!"
 POR_expand_the_chinese_territories_tt:0 "Получает цель войны §YАннексия§! против любой страны, владеющей:\n[592.GetName] ([592.Owner.GetFlag]§Y[592.Owner.GetName]§!)\n[594.GetName] ([594.Owner.GetFlag]§Y[594.Owner.GetName]§!)\n[325.GetName] ([325.Owner.GetFlag]§Y[325.Owner.GetName]§!)\n[613.GetName] ([613.Owner.GetFlag]§Y[613.Owner.GetName]§!)\n[622.GetName] ([622.Owner.GetFlag]§Y[622.Owner.GetName]§!)\n[604.GetName] ([604.Owner.GetFlag]§Y[604.Owner.GetName]§!)\n[615.GetName] ([615.Owner.GetFlag]§Y[615.Owner.GetName]§!)\n[611.GetName] ([611.Owner.GetFlag]§Y[611.Owner.GetName]§!)\n[328.GetName] ([328.Owner.GetFlag]§Y[328.Owner.GetName]§!)"
 POR_deal_with_the_japanese_threat:0 "Разделаться с японской угрозой"
 POR_deal_with_the_japanese_threat_desc:0 "Японская армия угрожает нашим владениям в Тихом океане, занимая соседние анклавы и изолируя колонии. Мы должны опередить возможную агрессию и ударить по японским островам, пока враг этого не ожидает."
 POR_refuse_the_naval_blockade:0 "Отказаться от морской блокады"
 POR_refuse_the_naval_blockade_desc:1 "Мы можем воспользоваться морской блокадой стран, воюющих с государством [ENG.GetNameDef]. Дипломаты заключат выгодные соглашения о предоставлении нашего торгового флота государствам, сражающимся против [ENG.GetAdjective], в обмен на экономическую поддержку."
 POR_mapa_cor_de_rosa:0 "Розовая карта"
 POR_mapa_cor_de_rosa_desc:0 "Пора отомстить за унижение, нанесённое британским ультиматумом 1890 года. Наши колонии в Западной и Восточной Африке наконец должны соединиться!"
 POR_recover_the_east_indies:0 "Вернуть Ост-Индию"
 POR_recover_the_east_indies_desc:0 "Мы должны потребовать то, что принадлежит нам по праву. Ост-Индия вновь окажется под властью Португалии."
 POR_recover_brazil:0 "Вернуть Бразилию"
 POR_recover_brazil_desc:0 "Чтобы восстановить славу старой Португальской империи, необходимо сосредоточиться на бывших американских колониях. Бразильская земля принадлежит Португалии и будет возвращена силой."
 POR_army_reorganization:0 "Реорганизация армии"
 POR_army_reorganization_desc:0 "Необходимо реорганизовать армию, сократив раздутый офицерский корпус и неэффективные части, а также введя полноценную систему призыва. Это заложит основу современной армии."
 POR_metropolitan_army:0 "Армия метрополии"
 POR_metropolitan_army_desc:0 "Главная угроза Португалии — быть втянутой в европейскую войну и подвергнуться вторжению на материк. Только сильная современная армия способна сдержать врагов!"
 POR_standardization:0 "Стандартизация"
 POR_standardization_desc:0 "Необходимо внедрить систему стандартизации, обеспечивающую высокую совместимость снаряжения и эффективность его производства."
 POR_defend_the_borders:0 "Защитить границы"
 POR_defend_the_borders_desc:0 "Угроза вторжения существует всегда, а защищать приходится протяжённые границы по всей нашей территории. Следует построить достаточные укрепления для отражения любого нападения."
 POR_rebuild_the_lines_of_torres_vedras:0 "Восстановление линий Торриш-Ведраш"
 POR_rebuild_the_lines_of_torres_vedras_desc:0 "Некоторые высшие офицеры считают границы слишком протяжёнными для обороны и предлагают восстановить линии Торриш-Ведраш, приспособив старые укрепления к современной войне. Если противник прорвёт фронт, мы отступим к Лиссабону, повторив стратегию, успешно применённую против французского вторжения в Наполеоновские войны."
 POR_corpo_do_estado_maior:0 "Начальник штаба сухопутных войск"
 POR_corpo_do_estado_maior_desc:0 "Военная реформа восстановила Корпус Генерального штаба как элитное учреждение по изучению современной войны. Следует вложиться в новые объекты для повышения его эффективности."
 POR_staff_wargames:0 "Штабные игры"
 POR_staff_wargames_desc:0 "Мы должны сосредоточиться на подготовке офицеров, чтобы они могли в полной мере использовать современные доктрины, организацию, обучение и технику."
 POR_a_royal_wedding:0 "Королевская свадьба"
 POR_a_royal_wedding_desc:0 "Брак между доном Дуарте Нуну де Браганса, законным наследником португальского престола, и принцессой Марией Франсишкой Орлеанской, дочерью претендента на бразильский престол, порадует монархистов Португалии и Бразилии."
 POR_the_return_of_duarte:0 "Возвращение Дуарте"
 POR_the_return_of_duarte_desc:0 "Разрешение дону Дуарте Нуну де Браганса вернуться в Португалию не понравится республиканцам, но это необходимый шаг к восстановлению монархии."
 POR_support_a_spanish_monarchy_in_the_war:1 "Поддержать испанскую монархию в войне"
 POR_support_a_spanish_monarchy_in_the_war_desc:0 "Мы не испытываем большой симпатии к карлистам, но испанская монархия, разумеется, лучше фашистского или коммунистического режима на полуострове. Следует поддержать меньшее из зол..."
 POR_assist_the_requetes:0 "Помочь рекете"
 POR_assist_the_requetes_desc:0 "Несколько военнослужащих португальской армии и авиации будут отправлены в Испанию, чтобы наблюдать за военными действиями карлистов и консультировать их лидеров. Одновременно они соберут сведения о тактике, применяемой каждой из сторон."
 POR_join_the_carlist_fight:0 "Присоединиться к сражениям карлистов"
 POR_join_the_carlist_fight_desc:0 "Лучший способ обеспечить победу карлистов в гражданской войне в Испании — самим сражаться за рекете и разгромить остальные испанские фракции."
 POR_the_royal_iberian_alliance:0 "Королевский Иберийский союз"
 POR_the_royal_iberian_alliance_desc:0 "Мы должны заручиться сотрудничеством испанской монархии перед лицом угроз в Европе и за её пределами. Только объединившись, мы сможем выйти победителями из этих смутных времён."
 POR_monarchist_uprising_in_brazil:1 "Восстание монархистов в Бразилии"
 POR_monarchist_uprising_in_brazil_desc:0 "Обращение к бразильским монархистам поможет подготовить восстановление бразильского престола. Мы должны обеспечить их победу над любой оппозицией."
 POR_cannot_destabilize_brazil_player_tt:0 "§YЕсли государством [BRA.GetNameDef] управляет игрок, будут применены другие эффекты.§!"
 POR_the_empire_of_brazil:0 "Бразильская империя"
 POR_the_empire_of_brazil_desc:0 "Всё готово к тому, чтобы принц Педру заявил права на бразильский престол и был коронован императором Бразилии."
 POR_the_empire_of_brazil_potential_civil_war_tt:0 "§RЕсли §YБразилия§R это §RНет. §YНейтралитет§R и имеет меньше, чем §Y50% стабильность§R или §Y70% нейтралитет§R Когда этот фокус будет завершен, бразильские монархисты начнут гражданскую войну, втягивая нас в нее!§!§!§!§!§!§!§!§!§!§!"
 POR_restoration_of_the_monarchy:0 "Возрождение монархии"
 POR_restoration_of_the_monarchy_desc:0 "Мы провозгласим восстановление португальской монархии под властью дона Дуарте Нуну де Браганса.\nДа здравствует король Португалии!"
 POR_the_kingdom_reunited:0 "Возрожденное королевство"
 POR_the_kingdom_reunited_desc:1 "После восстановления португальского и бразильского престолов мы должны объединить наши страны, пока память об общей борьбе ещё жива.\nМы направим предложение бразильскому правительству, ясно дав понять, что если оно не подпишет его добровольно, нам придётся настоять на своём иными средствами..."
 POR_deal_with_fascism:0 "Разделаться с фашизмом"
 POR_deal_with_fascism_desc:0 "Фашизм — язва, принёсшая человечеству горе и страдания. Пора выступить против него и ударить в самое сердце. После победы мы перекроим мир по своей воле — и он станет лучше."
 POR_deal_with_fascism_tt:0 "Получает цель войны §YАннексия§! против крупных или соседних фашистских государств:"
 POR_latin_america:0 "Латинская Америка"
 POR_latin_america_desc:0 "Теперь, когда наша империя укреплена, можно обратить взор на земли вокруг американских владений и вернуть территории, которыми когда-то владела Бразильская империя."
 POR_the_communist_threat:0 "Коммунистическая угроза"
 POR_the_communist_threat_desc:0 "Коммунисты исподволь распространяют свои обманчивые идеи среди населения не только Португалии, но и всего мира. Мы должны сосредоточиться на искоренении этой глобальной угрозы, пока она не пожрала нас изнутри."
 POR_the_communist_threat_tt:0 "Получает цель войны §Y[GetWargoalBasedOnGovernment]§! против крупных или соседних коммунистических государств:"
 POR_puppet_wargoal:0 "Марионетка (фокус)"
 POR_topple_government_wargoal:0 "Свергнуть правительство"
 POR_annex_wargoal:0 "Аннексия"
 POR_promote_the_monarchist_cause_in_portugal:2 "Популяризировать дело монархистов в Португалии"
 POR_promote_the_monarchist_cause_in_portugal_desc:0 "Мы должны поощрять и поддерживать монархистов в распространении монархических настроений среди народов Португалии."
 POR_kingdom_reunited_tooltip_tt:0 "§Y[POR.GetNameDefCap]§! и §Y[BRA.GetNameDef]§! теперь будут называться §YИмперией Португалии и Бразилии§!."
 POR_spr_tooltip_country_exist_tt:0 "[SPR.GetFlag]§YРеспубликанская Испания§! существует"
 POR_spr_tooltip_at_peace_tt:0 "Мир с государством [SPR.GetFlag]§YРеспубликанская Испания§!"
 POR_fascist_portugal_joins_scw_tt:0 "§YФашистская Португалия§! вступает в войну на стороне [SPA.GetFlag]§Y[SPA.GetNameDef]§! против [GetSpanishRepublicFlagAndNameDef]."
 POR_iberian_workers_effect_tooltip_tt:0 "[POR.GetFlag]§Y[POR.GetNameDef]§! и [GetSpanishRepublicFlagAndNameDef] получают событие §Y«Рабочие Иберии объединились»§!."
 POR_spanish_republic_tt:0 "[GetSpanishRepublicFlagAndNameDef]:"
 POR_support_the_spanish_republic_effect_tooltip_tt:1 "Отправить §Y2000§! единиц §Yпехотного снаряжения§! государству [GetSpanishRepublicFlagAndNameDef]. Сначала отправляются старые образцы."
 POR_Spanish_Republic_SPD:0 "[SPD.GetFlag]§Y[SPD.GetNameDef]§!"
 POR_Spanish_Republic_SPR:0 "[SPR.GetFlag]§YРеспубликанская Испания§!"
 POR_republican_spain_exists_tooltip_tt:1 "[SPR.GetFlag]§YРеспубликанская Испания§! существует."
 POR_the_iberian_socialist_union_tt:0 "([SPR.GetFlag]§YРеспубликанская Испания§!) получает событие §Y«Иберийский социалистический союз»§!."
 POR_the_iberian_socialist_union_cores_tt:0 "§YИберийский социалистический союз§! получает национальные территории на всей Иберии, Канарских и Балеарских островах."
 POR_the_iberian_socialist_union_annex_puppets_tt:0 "Все испанские марионетки будут аннексированы."
 POR_the_iberian_socialist_union_cosmetic_name_tt:0 "§YПортугалия§! будет называться §YИберийским социалистическим союзом§!."
 POR_the_popular_front_bloc:0 "Блок Народного фронта"
 POR_the_popular_front_bloc_desc:1 "Теперь, когда мы подчеркнули иберийскую идентичность и укрепили государство [Root.GetNameDef], необходимо распространять коммунизм за рубежом и искать союзников, готовых присоединиться к нашему делу и вместе бороться против тирании и угнетения."
 POR_the_popular_front_bloc_tt:0 "Получает событие §Y«Португалия приглашает нас в блок Народного фронта»§!."
 POR_the_popular_front_bloc_explanatory_tt:0 "Любое независимое §Yкоммунистическое§! государство Европы получит событие §Y«Португалия приглашает нас в блок Народного фронта»§!."
 POR_latin_american_communism:0 "Латиноамериканский коммунизм"
 POR_latin_american_communism_desc:0 "Мы должны обратиться к народам Латинской Америки. Поддерживая местных коммунистов и их стремление создать единый международный блок, мы заложим основы союза американских и европейских социалистов."
 POR_our_comrades_overseas:0 "Наши заморские товарищи"
 POR_our_comrades_overseas_desc:0 "Мы организуем конференцию латиноамериканских государств, желающих присоединиться к нашему блоку. Пора показать миру единство латиноамериканских и иберийских народов."
 POR_our_comrades_overseas_tt:0 "Любое независимое §Yкоммунистическое§! государство Латинской Америки получит событие §Y«Португалия приглашает нас в блок Народного фронта»§!."
 POR_cooperate_with_french_militants:0 "Сотрудничать с французскими боевиками"
 POR_cooperate_with_french_militants_desc:0 "Наши товарищи во Франции отчаянно нуждаются в помощи в борьбе с фашистскими государствами, вторгшимися в их страну. Мы должны снабдить их оружием, снаряжением и боеприпасами, чтобы дать им шанс выстоять."
 POR_anti_fascism:0 "Антифашизм"
 POR_anti_fascism_desc:0 "Фашизм представляет огромную угрозу нашему делу, и с ним необходимо покончить. Мы должны всеми средствами бороться за освобождение мира от его зловещей хватки."
 POR_anti_fascism_tt:0 "Получает цель войны §YСвергнуть правительство§! против крупных или соседних фашистских государств:"
 free_french_focus:0 "Дерево фокусов Свободной Франции"
 POR_strengthen_the_regime:0 "Усилить режим"
 POR_strengthen_the_regime_desc:0 "Многие диссиденты всё ещё плетут заговоры против режима. Мы усилим тайную полицию и предоставим ей средства для искоренения подрывных организаций."
 POR_the_capital_of_espionage:0 "Столица шпионажа"
 POR_the_capital_of_espionage_desc:0 "Лиссабон переполнен агентами и заговорами: шпионы собирают сведения о трансатлантических перевозках, предатели сотрудничают с прежними врагами, а двойные агенты передают противнику ложные данные. Мы можем использовать эту ситуацию, собирая обрывки проходящей через нашу территорию информации и укрепляя собственную контрразведку."
 POR_appease_monarchists:0 "Умиротворение монархистов"
 POR_appease_monarchists_desc:0 "Чтобы заручиться поддержкой монархистов, необходимо включить их представителей в правительство и создать впечатление, что восстановление монархии возможно в будущем. Эти уступки обеспечат режиму необходимую стабильность и поддержку."
 POR_national_gold_reserves:0 "Национальный золотой запас"
 POR_national_gold_reserves_desc:0 "Сохраняя нейтралитет, мы можем извлечь прибыль из войны. Обе стороны соперничают за нашу дружбу и товары, и если удовлетворить их потребности, золотой запас страны значительно увеличится."
 POR_concordat_with_the_holy_see:0 "Конкордат со Священным Престолом"
 POR_concordat_with_the_holy_see_desc:0 "Мы заключим соглашение с Ватиканом, поощряющее общественную роль Церкви и не позволяющее ей вмешиваться в политические дела Португалии.\n\n«Бог, Родина и Семья» — Антониу ди Оливейра Салазар"
 POR_honor_anglo_portuguese_alliance:0 "Выполнить условия англо-португальского союза"
 POR_honor_anglo_portuguese_alliance_desc:0 "Англо-португальский союз, заключённый ещё в XIV веке, является старейшим союзом в мире. В эти судьбоносные времена мы выполним обязательства по договору и поможем государству [ENG.GetNameDef] в войне.\nВместе мы победим!"
 POR_proudly_alone:0 "Гордое одиночество"
 POR_proudly_alone_desc:0 "Вступление в войну может привести к вторжению в страну и потере заморских территорий. Кроме того, участие в конфликте дестабилизирует Иберийский полуостров и создаст риск оккупации Португалии Испанией. Мы должны сохранять нейтралитет и защищать свои земли, ведь поблизости таятся и другие угрозы..."
 POR_the_eastern_menace:0 "Восточная угроза"
 POR_the_eastern_menace_desc:0 "Успех государства [JAP.GetNameDef] в Китае и Юго-Восточной Азии во многом объясняется слабостью войск противника. Нельзя допустить подобного на наших восточных территориях. Мы укрепим колонии и нанесём первый удар раньше, чем это сделают [JAP.GetAdjective]."
 POR_ditadura_militar:0 "Военная диктатура"
 POR_ditadura_militar_desc:0 "Наконец у нас достаточно поддержки, чтобы отстранить Салазара от власти и восстановить Военную диктатуру. Мы оставим Новое государство в прошлом и примем меры, необходимые Португалии для процветания в эти судьбоносные времена."
 POR_field_maneuvers:0 "Полевые маневры"
 POR_field_maneuvers_desc:0 "Корпус Генерального штаба разработал новые манёвры, которые помогут пересмотреть и обновить устаревшие доктрины — необходимый шаг к созданию современной армии."
 POR_tropas_paraquedistas:0 "Tropas Paraqueidistas"
 POR_tropas_paraquedistas_desc:0 "Мы создадим элитные пехотные ударные силы, способные высаживаться в тылу противника и обеспечивать неоценимое тактическое преимущество."
 POR_regimento_de_comandos:0 "Regimento de Comandos"
 POR_regimento_de_comandos_desc:0 "Нам нужны элитные силы, подготовленные к различным боевым ситуациям и способные действовать в самых суровых условиях.\n\n«Смелым помогает судьба»"
 FRA_laissez_faire_tt:0 "Примерно через два года наша экономика станет эффективнее."
 FRA_carry_the_revolution_west_tt:0 "Предоставляет цель войны §YСвергнуть правительство§! против §YИспании§! или любой уцелевшей некоммунистической фракции гражданской войны в Испании."
 SPR_secure_the_popular_support_idea:0 "Заручиться народной поддержкой"
 SPR_secure_the_popular_support_idea_tt:0 "§RЭтот национальный дух будет удалён после завершения гражданской войны!§!\n"
 POR_communist_secret_police:0 "Коммунистическая тайная полиция"
 POR_communist_secret_police_desc:0 "Партию нельзя подвергать сомнению. Партия всегда права. Партию необходимо слушаться."
 POR_expand_the_intelligence_services:0 "Расширить разведывательные службы"
 POR_expand_the_intelligence_services_desc:0 "По всему миру ведётся настоящая тайная война против враждебных разрушительных сил."
 POR_align_against_the_comintern:0 "Объединиться против Коминтерна"
 POR_align_against_the_comintern_desc:0 "Лидеры Коминтерна предали революцию. Остаётся надеяться, что другие государства продолжат нести её факел."
