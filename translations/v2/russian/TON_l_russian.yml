 PLY_UNIFIED_develop_taiwan_desc:0 ""
 PLY_UNIFIED_exploit_the_fijian_goldmines:0 "Разрабатывать золотые рудники Фиджи"
 PLY_UNIFIED_exploit_the_fijian_goldmines_desc:0 "На Фиджи имеются крупные залежи золота, которые можно использовать в наших интересах и для роста экономики."
 PLY_UNIFIED_exploit_the_nauruan_phosphate_mines:0 "Разрабатывать фосфатные рудники Науру"
 PLY_UNIFIED_exploit_the_nauruan_phosphate_mines_desc:0 "На Науру имеются огромные запасы фосфатов, признанных одними из самых качественных в мире. Было бы расточительно не использовать их в собственных интересах."
 PLY_UNIFIED_seize_japanese_assets:0 "Захватить японские активы"
 PLY_UNIFIED_seize_japanese_assets_desc:0 "После захвата микронезийских островов японцы оставили свои активы без защиты. Мы можем конфисковать их и укрепить экономику."
 PLY_UNIFIED_educational_reform:0 "Реформа образования"
 PLY_UNIFIED_educational_reform_desc:0 "Значительная часть населения испытывает недостаток образования из-за пренебрежения прежних европейских хозяев. Мы должны дать людям то, чего им не хватало, и обеспечить хорошее образование нынешним и будущим поколениям."
