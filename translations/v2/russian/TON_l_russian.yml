 PLY_UNIFIED_polynesian_unifacation:0 "Полинезийское объединение завершено"
 PLY_UNIFIED_polynesian_unifacation_desc:0 "После огромной борьбы с колониальными державами Полинезии мы наконец можем раз и навсегда объединить весь регион!"
 PLY_UNIFIED_connect_the_villages:0 "Соединить деревни"
 PLY_UNIFIED_connect_the_villages_desc:0 "Большинство наших островов слабо развито и лишено достаточной инфраструктуры. В наших интересах это изменить."
 PLY_UNIFIED_first_steps_towards_modernisation:0 "Шаги к индустриализации"
 PLY_UNIFIED_first_steps_towards_modernisation_desc:0 "Наша страна сильно отстает в плане индустриализации, что делает нас неспособными конкурировать с нашими соседями. Но мы можем изменить это, инициировав программу индустриализации, направленную на модернизацию наших отраслей."
 PLY_UNIFIED_connect_the_islands:0 "Развивать наши острова"
 PLY_UNIFIED_connect_the_islands_desc:0 "Чтобы облегчить экспорт и импорт для торговых партнёров, нужно строить порты на островах и обеспечить безопасный вход и выход торговли из страны."
