 TON_the_eternal_kingdom_desc:0 "[ROOT.GetNameDefCap] веками существовала как независимое государство и лишь недавно перешла под британскую защиту. Эта долгая традиция суверенитета породила у тонганцев глубокую гордость, сильную культурную идентичность и верность своим традициям и монархии."
