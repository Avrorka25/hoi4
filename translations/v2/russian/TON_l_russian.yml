 TON_salote_tupou_iii:0 "Салоте Тупоу III"
 TON_salote_tupou_iii_desc:0 "Салоте Мафилео Пилолеву родилась в 1900 году в семье короля Джорджа Тупоу II и его супруги Лавинии Веионго. Из-за опасности на родине она росла в Новой Зеландии и получила западное образование, которое сильно повлияло на её мировоззрение и впоследствии оказалось бесценным. Позднее тонганские вожди потребовали её возвращения на Тонга, где она стала предполагаемой наследницей до смерти отца от туберкулёза. \n\nВ 1917 году, незадолго до смерти, желая обеспечить дочери престол, отец устроил брак Салоте с одним из самых могущественных вождей Тонга — Вилиами Тунги Маилефихи, позднее ставшим её доверенной правой рукой. После смерти отца она взошла на престол и официально стала королевой Королевства Тонга всего в 18 лет. \n\nЕё харизматичный и доброжелательный характер сделал её любимой фигурой как дома, так и за рубежом. Будучи искусным дипломатом, она представляла Тонга на мировой арене, одновременно модернизируя и ведя страну через трудные времена. Несмотря на давление иностранных держав, ей удалось сохранить независимость страны и стать настоящим лицом Королевства Тонга."
