 LIB_supernatural_warfare_desc:0 "При столкновениях с племенами внутренних районов солдаты Либерийских пограничных сил используют два вида оружия: физическое и сверхъестественное. Первое за столетие значительно усовершенствовалось, тогда как второе полагается на магические заклинания, амулеты и тому подобное, чтобы наносить вред или защищаться от него. В одном случае воины кру якобы управляли бурей, которую солдаты ЛПС рассеяли своими оберегами."
