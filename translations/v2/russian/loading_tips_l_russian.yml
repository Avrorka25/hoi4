l_russian:
 LOADING_TIP_0:0 "Унизительно оставаться сложа руки, пока другие пишут историю. Не имеет значения, кто победит.\nБенито Муссолини"
 LOADING_TIP_1:0 "Чтобы сделать людей великими, необходимо отправить их на бой, даже если вам придется пинать их в штаны. Вот что я сделаю.\nБенито Муссолини"
 LOADING_TIP_2:0 "Каждый солдат должен знать, прежде чем вступить в бой, как маленькая битва, которую он должен вести, вписывается в общую картину.\n- Бернард Л. Монтгомери"
 LOADING_TIP_3:0 "Если мы проиграем войну в воздухе, то проиграем ее и быстро проиграем.\n- Бернард Л. Монтгомери"
 LOADING_TIP_4:0 "Хорошо доверять другим, но не делать этого намного лучше.\nБенито Муссолини"
 LOADING_TIP_5:0 "С философской и доктринальной точки зрения я не верю в вечный мир.\nБенито Муссолини"
 LOADING_TIP_6:0 "Жирафы — бессердечные существа"
 LOADING_TIP_7:0 "До тех пор, пока существуют суверенные государства, обладающие великой силой, война неизбежна.\nАльберт Эйнштейн"
 LOADING_TIP_8:0 "Те, кто голосует, ничего не решают. Те, кто подсчитывает голоса, решают все.\nИосиф Сталин"
 LOADING_TIP_9:0 "История показывает, что непобедимых армий нет и никогда не было.\nИосиф Сталин"
 LOADING_TIP_10:0 "Папа! Сколько у него дивизий?\nИосиф Сталин"
 LOADING_TIP_11:0 "Геофизика — самая выдающаяся черта Советского Союза.\nИосиф Сталин"
 LOADING_TIP_12:0 "Единственная реальная сила исходит от длинной винтовки.\nИосиф Сталин"
 LOADING_TIP_13:0 "Любой союз, целью которого не является намерение вести войну, бессмыслен и бесполезен.\n- Адольф Гитлер"
 LOADING_TIP_14:0 "Великие лжецы также являются великими магами.\n- Адольф Гитлер"
 LOADING_TIP_15:0 "Если сегодня я стою здесь как революционер, то это как революционная партия против революции.\n- Адольф Гитлер"
 LOADING_TIP_16:0 "Если вы говорите достаточно большую ложь и говорите ее достаточно часто, вам поверят.\n- Адольф Гитлер"
 LOADING_TIP_17:0 "Германия либо станет мировой державой, либо не будет ею вовсе.\n- Адольф Гитлер"
 LOADING_TIP_18:0 "Успех состоит в переходе от неудачи к неудаче без потери энтузиазма.\n- Уинстон Черчилль"
 LOADING_TIP_19:0 "Если ты идешь через ад, продолжай идти.\n- Уинстон Черчилль"
 LOADING_TIP_20:0 "Лучшим аргументом против демократии является пятиминутный разговор со средним избирателем.\n- Уинстон Черчилль"
 LOADING_TIP_21:0 "Всякий раз, когда в будущих войнах будет вестись битва, решающую роль будут играть танковые войска.\nХайнц Гудериан"
 LOADING_TIP_22:0 "Новая немецкая «Пантера» и «Тигр» могут использоваться до тех пор, пока они не сломаются, не пытаясь их починить. У них плохие двигатели, трансмиссия и подвеска.\n- Отдел вооружения Красной Армии"
 LOADING_TIP_23:0 "Ни один ублюдок никогда не выигрывал войну, умирая за свою страну. Он выиграл его, заставив другого бедного тупого ублюдка умереть за свою страну.\n- Джордж С. Паттон"
 LOADING_TIP_24:0 "Хороший план, исполненный жестоко сейчас, лучше, чем идеальный план, выполненный на следующей неделе.\n- Джордж С. Паттон"
 LOADING_TIP_25:0 "Веди меня, следуй за мной, или уйди с дороги.\n- Джордж С. Паттон"
 LOADING_TIP_26:0 "Как трудно серому порой, он санитар, но одинок. Выходит в ночь и слышен вой, ведь он не друг, а сильный волк.\n- Джордж С. Паттон"
 LOADING_TIP_27:0 "Войны могут вестись с оружием, но выигрываются людьми. Дух людей, которые следуют за ним, и человека, который ведет его, побеждает.\n- Джордж С. Паттон"
 LOADING_TIP_28:0 "В первый раз, когда я увидел самолет, я его сбил.\n- Чак Йегер, ВВС США"
 LOADING_TIP_29:0 "Тео, Генрих здесь. Только что сбили два бомбардировщика. Больше никаких боеприпасов. Я собираюсь таранить. Ауф Видерсехен, увидимся в Вальгалле!\n- Генрих Эрлер, Люфтваффе"
 LOADING_TIP_30:0 "Лидерство состоит в том, чтобы выбирать хороших людей и помогать им делать все возможное.\n- Честер У. Нимиц"
 LOADING_TIP_31:0 "Возможно ли, что предлагаемая операция будет успешной? Является ли это практически осуществимым с точки зрения материалов и материалов?\n- Честер У. Нимиц"
 LOADING_TIP_32:0 "Готовясь к бою, я всегда считал, что планы бесполезны, но планирование необходимо.\n- Дуайт Ди. Эйзенхауэр"
 LOADING_TIP_33:0 "Что имеет значение, так это не обязательно размер собаки в бою - это размер драки в собаке.\n- Дуайт Ди. Эйзенхауэр"
 LOADING_TIP_34:0 "Само собой разумеется, что когда выживание находится под угрозой, между народами вспыхивает борьба, и возникают неудачные войны между нациями.\nХидеки Тодзё"
 LOADING_TIP_35:0 "В мужском бою победителем становится тот, у кого есть еще один раунд в своем журнале.\nЭрвин Роммель"
 LOADING_TIP_36:0 "Я лучше буду молотом, чем наковальней.\nЭрвин Роммель"
 LOADING_TIP_37:0 "Пот спасает кровь, кровь спасает жизни, но мозг спасает и то, и другое.\nЭрвин Роммель"
 LOADING_TIP_38:0 "Бедный Невилл Чемберлен верил, что может доверять Гитлеру. Он ошибался. Но я не думаю, что ошибаюсь насчет Сталина.\nУинстон Черчилль (после Ялты)"
 LOADING_TIP_39:0 "Я верю, что это мир для нашего времени.\nНевилл Чемберлен, 1938 год после Мюнхенского соглашения."
 LOADING_TIP_40:0 "Ни один вражеский бомбардировщик не может достичь Рура. Если кто-то доберется до Рура, меня зовут не Геринг. Можете звать меня Майер.\nГерман Мейер"
 LOADING_TIP_41:0 "Нам нужно только выбить дверь, и вся гнилая конструкция рухнет.\nАдольф Гитлер (в Советском Союзе)"
 LOADING_TIP_42:0 "Я могу сходить с ума в течение первых шести-двенадцати месяцев войны с Соединенными Штатами и Соединенным Королевством. После этого я не ожидаю успеха.\nИзороку Ямамото"
 LOADING_TIP_43:0 "Если мы придем на минное поле, наша пехота атакует точно так же, как если бы ее там не было.\n- Георгий Жуков"
 LOADING_TIP_44:0 "Российский колосс недооценен нами. Всякий раз, когда уничтожается десяток дивизий, русские заменяют их еще десятком.\nФранц Гальдер"
 LOADING_TIP_45:0 "Немецкому командующему: НУТС!\nАмериканский командующий.\n- Энтони Си. Маколифф (отвечает на требование Германии о капитуляции)"
 LOADING_TIP_46:0 "Это мы сегодня. Это будешь ты завтра.\nХайле Селассие I, 1936"
 LOADING_TIP_47:0 "Ни шагу назад!\n- Советский приказ No. 227"
 LOADING_TIP_48:0 "Тора! Тора! Тора!\nМицуо Фучида, 7 декабря 1941 г."
 LOADING_TIP_49:0 "Твое имя неизвестно. Твой подвиг бессмертен.\n- Могила Неизвестного Солдата (Москва)"
 LOADING_TIP_50:0 "Где, повторяю, Целевая группа Тридцать Четыре? Мир чудес.\nCINCPAC, Битва за залив Лейта"
 LOADING_TIP_51:0 "Военная ситуация не всегда складывалась в пользу Японии.\nИмператор Хирохито, 1945"
 LOADING_TIP_52:0 "Мы должны были знать лучше после первой войны.\n- Герд фон Рундштедт"
 LOADING_TIP_53:0 "Необъятность России пожирает нас.\n- Герд фон Рундштедт"
 LOADING_TIP_54:0 "Я спрашиваю вас, вы хотите тотальной войны? Если необходимо, хотите ли вы войны более тотальной и радикальной, чем мы можем себе представить?\n- Джозеф Геббельс"
 LOADING_TIP_55:0 "Один удар немецкой армии и другой удар советской положили конец этому уродливому продукту Версаля.\n- Вячеслав Молотов (после падения Польши)"
 LOADING_TIP_56:0 "Поцарапай одну квартирку! Диксон к носителю: царапайте одну плоскую крышу!\n- Роберт И. Диксон, Битва за Коралловое море"
 LOADING_TIP_57:0 "Разве это не ужасно? Вот мы, два офицера германского генерального штаба, обсуждаем, как лучше всего убить нашего главнокомандующего.\n- Хеннинг фон Тресков"
 LOADING_TIP_58:0 "Гитлер - танцующий дервиш. Его, должно быть, сбили.\n- Хеннинг фон Тресков"
 LOADING_TIP_59:0 "Нацисты вступили в эту войну под довольно детским заблуждением, что они собираются бомбить всех остальных, и никто не собирается бомбить их.\nАртур «Бомбардировщик» Харрис"
 LOADING_TIP_60:0 "Если бы Гитлер вторгся в ад, я бы, по крайней мере, благосклонно отозвался о дьяволе в Палате общин.\nУинстон Черчилль, 21 июня 1941 г."
 LOADING_TIP_61:0 "Значит, ублюдок мертв? Жаль, что мы не поймали его живым!\nИосиф Сталин (на слушании о самоубийстве Гитлера)"
 LOADING_TIP_62:0 "Мы потерпели поражение. Мы побеждены, мы проиграли битву.\nПол Рейно, 15 мая 1940 г."
 LOADING_TIP_63:0 "Мне нужно всего несколько тысяч убитых, чтобы я мог сидеть на мирной конференции как человек, который сражался.\nБенито Муссолини"
 LOADING_TIP_64:0 "Французы лгали полякам, говоря, что они собираются напасть. Нет ни малейшего понятия.\nЭдмунд Айронсайд"
 LOADING_TIP_65:0 "Зачем умирать за Данцига?\nФранцузский антивоенный лозунг, 1939"
 LOADING_TIP_66:0 "В этой войне есть что-то фальшивое.\nСенатор США Уильям Бора, 1939"
 LOADING_TIP_67:0 "Швейцария обладает самым отвратительным и жалким народом и политической системой. Швейцарцы - смертельные враги новой Германии.\n- Адольф Гитлер"
 LOADING_TIP_68:0 "Плоды победы слишком быстро падают нам в рот.\nИмператор Хирохито"
 LOADING_TIP_69:0 "Вы все будете сиять обувью немцев!\nИтало Бальбо"
 LOADING_TIP_70:0 "Потопить, сжечь, захватить, уничтожить. Пусть ничто не проходит.\nЭндрю Каннингем, Битва за Тунис"
 LOADING_TIP_71:0 "Я думаю, что мы можем зайти слишком далеко.\nФредерик Браунинг (до операции «Рыночный сад»)"
 LOADING_TIP_72:0 "Слава Богу за французскую армию.\nУинстон Черчилль, 1933"
 LOADING_TIP_73:0 "Когда вы видите, что гремучая змея готова нанести удар, вы не ждете, пока он ударит, чтобы раздавить его.\n- Франклин Д. Рузвельт"
 LOADING_TIP_74:0 "Правила не обязательно священны, принципы — это так.\n- Франклин Д. Рузвельт"
 LOADING_TIP_75:0 "Люди, которые голодны и не имеют работы, являются тем материалом, из которого сделаны диктатуры.\n- Франклин Д. Рузвельт"
 LOADING_TIP_76:0 "Человек должен быть постоянно настороже, если он хочет продолжать дышать. Если нет, какой-нибудь немецкий сукин сын подкрадется к нему и забьет до смерти носком, полным дерьма.\n- Джордж С. Паттон"
 LOADING_TIP_77:0 "Укрепления, артиллерия, иностранная помощь — не будут иметь никакой ценности, если только рядовой солдат не знает, что он охраняет свою страну.\nКарл Густав Эмиль Маннергейм"
 LOADING_TIP_78:0 "Через грязь и кровь к зеленым полям.\nДевиз Королевского канадского бронетанкового корпуса"
 LOADING_TIP_79:0 "В Британском флоте есть общее любопытство, чтобы выяснить, дошли ли итальянцы до того уровня, на котором они были в прошлой войне, или они вообще упали.\nУинстон Черчилль (об объявлении войны в Италии)"
 LOADING_TIP_80:0 "И мы будем бороться с ними с помощью разбитых пивных бутылок, потому что это чертовски хорошо, все, что у нас есть!\n Уинстон Черчилль (сразу после обещания сражаться на полях и на улицах)"
 LOADING_TIP_81:0 "Опыт показал, что атаки на танки с ближним боем достаточно целеустремленным человеком в основном всегда будут успешными.\n Немецкая группа армий Центр противотанкового руководства"
 LOADING_TIP_82:0 "Дайте мне пятьдесят DC-3, и японцы смогут взять Бирманскую дорогу.\n - Чан Кай-Шек"
 LOADING_TIP_83:0 "Политика — это война без кровопролития, а война — это политика с кровопролитием.\n Мао Цзэдун"
 LOADING_TIP_84:0 "Держите людей, теряйте землю: землю можно взять снова. Держите землю, теряйте людей: земля и люди потеряны.\n Мао Цзэдун"
 LOADING_TIP_85:0 "Я лучше умру в болоте Великой Румынии, чем в раю маленькой Румынии.\n - Ион Антонеску"
 LOADING_TIP_86:0 "Люди не имеют значения, только то, что они представляют.\n - Ион Антонеску"
 LOADING_TIP_87:0 "В военное время правда настолько ценна, что ее всегда должен сопровождать телохранитель лжи.\n - Уинстон Черчилль"
 LOADING_TIP_88:0 "Побежденные сегодня механической силой, в будущем мы сможем преодолеть превосходящей механической силы. От этого зависит судьба мира.\n Шарль де Голль"
 LOADING_TIP_89:0 "Длинные рыдания скрипок осени. Успокой мое сердце монотонным лангуром.\n - SOE-кодированная передача для французского сопротивления"
 LOADING_TIP_90:0 "Нельзя допустить, чтобы такое государство, как Швейцария, которая является не чем иным, как прыщом на лице Европы, продолжалось.\n- Адольф Гитлер"
 LOADING_TIP_91:0 "Джек - безумный ученый"
 LOADING_TIP_92:0 "Дайте мне 5 филиппинцев, и я завоюю около 20 мексиканцев.\nДуглас Макартур "
 LOADING_TIP_93:0 "Проверяли ли вы свои изменения в Warlider?"
 LOADING_TIP_94:0 "Еще один день, еще одна категория решений Biccy"
 LOADING_TIP_95:0 "Если вы собираетесь выиграть воздушную войну, вам лучше спешить с улучшенным тяжелым пулеметом.\n- Уайтбордиан"
 LOADING_TIP_96:0 "Еще один день, еще один кукольный путь Норрмана"
 LOADING_TIP_97:0 "Уорлидер неиронично лучше, чем Тодд Ховард.\nНаказанный молоток"
 LOADING_TIP_98:0 "Змеи геи и не требуют навыков.\nЛев Троцкий"
 LOADING_TIP_99:0 "Микроволны были изобретены для реанимации хомяков"
 LOADING_TIP_100:0 "Я объявляю войну, потому что мне скучно.\nИосиф Сталин"
 LOADING_TIP_101:0 "Я не хочу войны, я хочу Кувейт.\nВиктор Эммаунелл Третий"
 LOADING_TIP_102:0 "Давайте обложим людей едой и отдадим ее голодным.\n- Финни"
 LOADING_TIP_103:0 "Новая Зеландия намного мощнее, чем Филиппины.\n- Чучхе"
 LOADING_TIP_104:0 "Я не боюсь немецкой армии. Я боюсь немецкого совладания.\n- Капеллор"
 LOADING_TIP_105:0 "Конечно, эти изменения баланса не будут иметь непредвиденных мета-определяющих последствий в течение года. \n - Варлидер"
 LOADING_TIP_106:0 "Зачем строить ракету?! Они просто там плавают!\n- Однофокусник"
 LOADING_TIP_107:0 "Ты не понимаешь, я немец, мой народ, мы аутисты.\n- Дадаски"
 LOADING_TOP_108:0 "Кто в жизни своей добр на земле, и станет ангелом после смерти, смотришь на небо и спрашиваешь: «Почему ты не видишь их?»"
 LOADING_TIP_109:0 "Только когда облака уснут, вы сможете увидеть нас на небе. Мы одиноки и боимся, и Бог знает, что я не хочу быть ангелом."
