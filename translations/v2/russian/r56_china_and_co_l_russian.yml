 KMT_the_internal_party_shenanigans:0 "Внутрипартийная борьба"
 KMT_bribe_party_officials:0 "Подкупить партийных чиновников"
 KMT_bribe_army_officials:0 "Подкупить армейских чиновников"
 KMT_pro_party_propaganda:0 "Пропаганда в поддержку партии"
 KMT_pro_chaing_propaganda:0 "Пропаганда в поддержку Чан Кайши"
