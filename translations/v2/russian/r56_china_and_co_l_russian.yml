 KMT_wt_stab7.5_n2_tt:0 "Изменить §YБелый террор§!: \n Стабильность: §G7,5%§! \n Ежедневная поддержка нейтралитета: §G0,2§!"
 KMT_wt_pp7.5_cp10_tt:0 "Изменить §YБелый террор§!: \n Коэффициент прироста политической власти: §G7,5%§! \n Множитель прироста командного ресурса: §G10%§!"
