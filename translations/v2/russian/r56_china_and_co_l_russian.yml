 CHI_tp_ca_10:0 "Изменить §Y«Три народных принципа»§!: \n Атака дивизий на национальной территории: §G+10%§!"
 CHI_tp_cd_10:0 "Изменить §Y«Три народных принципа»§!: \n Защита дивизий на национальной территории: §G+10%§!"
 CHI_tp_rp_15:0 "Изменить §Y«Три народных принципа»§!: \n Военнообязанное население: §R-15%§!"
 CHI_tp_rp_7:0 "Изменить §Y«Три народных принципа»§!: \n Военнообязанное население: §G+7%§!"
 CHI_tp_cp_15:0 "Изменить §Y«Три народных принципа»§!: \n Прирост командного ресурса: §G+15%§!"
 ticking_army_fix_tt:0 "§GШтраф§! §Y«Заброшенная армия»§! §Gбудет постепенно исчезать со скоростью один уровень каждые §Y35 дней§!, пока не превратится в§! §Y«Непрофессиональную армию»§!"
 CUF_buff_tt:0 "§GЭто усилит§! §Yнациональный дух «Состояние Единого фронта»§! §G§!"
 CUF_debuff_tt:0 "§RЭто ослабит§! §Yнациональный дух «Состояние Единого фронта»§! §R§!"
 CHI_puppet_warning_tt:0 "§RУчтите, что Лига национального возрождения, Гоминьдан и федералисты являются общенациональными движениями, поэтому их приход к власти в вашей стране может привести к тому, что вы получите субъектов или сами станете субъектом — в зависимости от того, кто первым сформирует национальное правительство.§!"
 CHI_coalition_tt:0 "§RУчтите, что этот союз весьма прочен, пока Китаю угрожают Япония, Маньчжурия или любая другая иностранная держава. Однако если Китай окажется в мире и принудительное национальное единство перестанет быть необходимым, союз может распасться. Если это произойдёт неблагоприятным образом, за ними может последовать до четверти Китая.§! §GОднако если фашисты проявят некомпетентность и начнут проигрывать нашу войну за национальное спасение, мы сможем напрямую захватить их, без сопротивления включить в Гоминьдан и тем самым полностью аннексировать.§!"
 CHI_coalition_collapse_tt:0 "§RСтрана начнёт добиваться распада коалиции с Гоминьданом, одновременно пытаясь склонить часть войск и гарнизонов Гоминьдана перейти на вашу сторону, чтобы укрепить ваши позиции. Это вынудит вас вновь разжечь гражданскую войну в Китае.§!"
 CHI_free_territories_tt:0 "§RВаша армия напрямую вторгнется в страну, контролирующую заявленную вами территорию, и если она откажется уступить её, пересечение границы вашими войсками неизбежно приведёт к войне.§!"
 CHI_internal_opposition_tt:0 "Учтите, что §Yвнутренняя оппозиция§! зависит от популярности Гоминьдана/неприсоединившихся, прямо масштабируется от неё и обновляется каждый месяц"
 CHI_mountain_training_tt:0 "изменять §YАрмия военачальников§! через \nУмножитель потенциала спецназа: §G15%§! \nСокращение штрафных санкций: §G10%§!"
