 KMT_CCP_mef5_peg10_lrf5_tt:0 "Изменить §YКоммунистическую партию Китая§!: \n Штраф за нехватку ресурсов: §G15%§! \n Рост эффективности производства: §G10%§! \n Предел эффективности производства: §G5%§!"
