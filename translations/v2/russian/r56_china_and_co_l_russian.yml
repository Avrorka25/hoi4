 KMT_taiwan_perm:0 "Судьба Китая решена"
 KMT_son_of_chiang:0 "Сын Чан Кайши"
 KMT_wt_stab_reduction_tt:0 "Изменять §Yсохраняющуюся оппозицию на материке§! на +1,5 ед. стабильности каждый месяц, пока показатель не достигнет 0"
