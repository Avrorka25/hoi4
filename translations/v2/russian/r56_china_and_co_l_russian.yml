 KMT_wt_dem-2_stab-5_cap3_spy-10_pp-3_tt:0 "Изменить §YБелый террор§!: \n Стабильность: §R-10%§! \n Ежедневная поддержка демократии: §G-0,2%§! \n Коэффициент прироста политической власти: §R-3%§!\n Доступные другим сведения о сухопутных войсках: §G-10%§! \n Доступные другим гражданские сведения: §G-10%§!\n Шанс захвата вражеского агента: §G3%§!"
 KMT_wt_stab-5_c-2_pp-3_cap8_ddf10_tt:0 "Изменить §YБелый террор§!: \n Стабильность: §R-5%§! \n Ежедневная поддержка коммунизма: §G-0,2§! \n Коэффициент прироста политической власти: §R-3%§!\n Защита от смены идеологии: §G10%§!\n Шанс захвата вражеского агента: §G8%§!"
 KMT_wt_dem-1_c-2_spy-5_cap5_pp-1_stab-5_tt:0 "Изменить §YБелый террор§!: \n Стабильность: §R-5%§! \n Ежедневная поддержка демократии: §G-0,1§! \n Ежедневная поддержка коммунизма: §G-0,2§! \n Коэффициент прироста политической власти: §R-1%§!\n Доступные другим сведения о сухопутных войсках: §G-5%§! \n Доступные другим гражданские сведения: §G-5%§! \n Шанс захвата вражеского агента: §G5%§!"
 KMT_wt_os1_cap5_spy-2.5_pp-7.5_tt:0 "Изменить §YБелый террор§!: \n Ячейки агентов: §G+1§! \n Коэффициент прироста политической власти: §R-7,5%§!\n Доступные другим сведения о сухопутных войсках: §G-2,5%§! \n Доступные другим гражданские сведения: §G-2,5%§! \n Шанс захвата вражеского агента: §G5%§!"
 KMT_wt_c-1_n1_spy-5_stab-2.5_pp-10_tt:0 "Изменить §YБелый террор§!: \n Стабильность: §R-2,5%§! \n Ежедневная поддержка нейтралитета: §G0,1%§! \n Ежедневная поддержка коммунизма: §G-0,1§! \n Коэффициент прироста политической власти: §R-10%§!\n Доступные другим сведения о сухопутных войсках: §G-5%§! \n Доступные другим гражданские сведения: §G-5%§!"
 KMT_wt_c-1_pp5_cap7.5_mw-250_tt:0 "Изменить §YБелый террор§!: \n Ежедневная поддержка коммунизма: §G-0,1§! \n Коэффициент прироста политической власти: §G5%§! \n Шанс захвата вражеского агента: §G7,5%§! \n Еженедельные людские ресурсы: §R-250§!"
