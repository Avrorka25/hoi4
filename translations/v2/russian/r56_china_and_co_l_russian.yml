 LKMT_sov_agreemnt:0 "Левый Гоминьдан и Советский Союз сотрудничают"
 CHI_warlords.1.t:0 "Вопрос государственного строя"
 CHI_warlords.1.desc:0 "Прежде чем приступить к написанию конституции, мы должны решить, какой государственный строй будет у нашей страны. Можно создать систему с постоянной сильной направляющей рукой военачальника, который будет президентом при каждом правительстве, либо полностью наделить партии полномочиями управлять парламентом по своему усмотрению."
 CHI_warlords.2.t:0 "Вопрос конституции"
 CHI_warlords.2.desc:0 "Написание конституции оказалось непростым и вызвало множество споров. Многие считают, что она должна наделить сильными полномочиями исполнительную власть, тогда как другие хотят возложить эти обязанности на глубинное государство. Теперь военачальнику предстоит сделать выбор."
 CHI_warlords.3.t:0 "Результаты выборов"
 CHI_warlords.3.desc:0 "Наконец-то мы провели свободные выборы. Теперь настало время узнать, кто победил!"
 CHI_warlords.4.t:0 "Государство [FROM.GetNameDefCap] желает подчиниться нам"
 CHI_warlords.4.desc:0 "Похоже, государство [FROM.GetNameDef] напугано: оно отказалось от плана федерализации всего Китая и вместо этого предложило подчиниться нам при условии, что мы позволим сохранить федералистскую политику на его собственных землях и в губернаторствах. Используем ли мы эту возможность для объединения Китая или предпочтём сражаться и завоевать эти земли, установив прямое правление?"
 CHI_warlords.5.t:0 "Война сопротивления!"
 CHI_warlords.5.desc:0 "Случилось то, чего мы давно и сильно опасались! Японцы, слишком долго вмешивавшиеся в дела нашей страны и издевавшиеся над нашим народом, наконец зашли так далеко, что между нами началась война. Война сопротивления разгорелась, и теперь мы должны бороться за само существование! Однако возникает вопрос: пригласим ли мы другие китайские клики присоединиться к нашей великой борьбе?"
 CHI_warlords.6.t:0 "Предложение спасти Китай!"
 CHI_warlords.6.desc:0 "Произошла величайшая катастрофа для китайского народа! Государство [JAP.GetNameDefCap] вторглось в нашу страну! Государство [CUG.GetNameDef], похоже, совершенно не готово к этой задаче. Поэтому оно призвало весь китайский народ объединиться с ним для отражения японцев! Наш народ горячо поддерживает этот великий порыв солидарности ради изгнания захватчиков и спасения Китая, однако это может не отвечать нашим интересам. Как нам поступить?"
 CHI_warlords.7.t:0 "Военачальник предлагает присоединиться к нашей республике"
 CHI_warlords.7.desc:0 "[FROM.GetLeader] из государства [FROM.GetNameDef] предложил полностью вернуться в нашу великую республику, однако просит сохранить контроль над своей кликой в качестве в некоторой степени автономной марионетки. Согласимся ли мы?"
 CHI_warlords.8.t:0 "Против кого мы являемся оплотом?"
 CHI_warlords.8.desc:0 "Провозгласив себя оплотом обороны, мы сталкиваемся с вопросом: от кого именно мы защищаемся?"
 CHI_warlords.9.t:0 "Ультиматум от государства [FROM.GetNameDef]"
 CHI_warlords.9.desc:0 "Государство [FROM.GetNameDefCap] предъявило нам ультиматум, потребовав различные наши земли, на которые оно заявило права. Оно уже начало захватывать эти территории. Остановим ли мы его или вступим в бой, чтобы удержать свои земли?"
 CHI_warlords.10.t:0 "Государство [FROM.GetNameDefCap] ищет защиты"
 CHI_warlords.10.desc:0 "Мы только что приняли посланника военачальника из региона [FROM.GetName]. Он просит помощи против угроз со стороны государств [Jap.GetName] и [PRC.GetName], а также защиты от нашего режима. В обмен он предлагает подчиниться нашей защите и внешней политике при условии сохранения власти над своей кликой."
 CHI_warlords.11.t:0 "Государство [FROM.GetNameDefCap] подкупает наших чиновников!"
 CHI_warlords.11.desc:0 "Мы узнали, что государство [FROM.GetNameDef] подкупило наших чиновников, чтобы те подписали с ним пакт о ненападении. Конечно, эти деньги весьма приятны, однако некоторые задаются вопросом, оправдано ли это ценой задержки объединения страны."
 CHI_warlords.12.t:0 "Государство [FROM.GetNameDefCap] желает сменить ориентацию"
 CHI_warlords.12.desc:0 "Государство [FROM.GetNameDef] направило нам делегацию с вопросом, найдётся ли ему место в японской сфере. Оно объявило, что сблизится с нами, а позднее станет нашим субъектом, если мы согласимся его принять."
 CHI_warlords.13.t:0 "Государство [FROM.GetNameDefCap] запрашивает дополнительное оружие"
 CHI_warlords.13.desc:0 "Государство [FROM.GetNameDefCap] запросило дополнительное оружие, чтобы объединить под своей властью Китай. Сколько мы отправим, если вообще станем отправлять?"
 CHI_warlords.14.t:0 "Конгресс национального единства"
 CHI_warlords.14.desc:0 "Конгресс национального единства собрался, и развернулись бурные обсуждения. Националистические революционеры потребовали создать великое Китайское государство под защитой военачальника и его Лиги национального возрождения, чтобы очистить страну от коррупции и иностранного влияния. С другой стороны, националистические империалисты потребовали, чтобы военачальник принял Мандат Неба и провозгласил новую Китайскую империю!"
 CHI_warlords.15.t:0 "Доклад регентского совета"
 CHI_warlords.15.desc:0 "Регентский совет собрался и обсудил судьбу монархии в Китае. Он согласился провозгласить военачальника Императором всего Китая!"
 CHI_warlords.16.t:0 "Запрос от государства [FROM.GetNameDef]"
 CHI_warlords.16.desc:0 "К нам прибыл посланник государства [FROM.GetNameDef] с одной просьбой. Он попросил прекратить поддержку государства [CHI.GetNameDef] и вместо этого поддержать их. Согласимся ли мы?"
 CHI_warlords.17.t:0 "Просьба народа хуэй"
 CHI_warlords.17.desc:0 "К нам прибыл посланник мусульманского народа хуэй из государства [FROM.GetNameDef] и предложил сделку. Они просят поддержать их в объединении исламских областей Китая и предлагают стать нашим протекторатом."
 CHI_warlords.18.t:0 "Коалиция ради национального выживания"
 CHI_warlords.18.desc:0 "Государство [FROM.GetNameDefCap] обратилось к нам с предложением подчиниться и присоединиться к коалиционному правительству. Оно объясняет это необходимостью выживания Китая перед лицом наступающей Японии. Однако, по мнению некоторых пессимистов среди наших военных, оно останется верным лишь до тех пор, пока Китай находится под прямой угрозой Японии или других захватчиков, а затем вполне может нас предать..."
 CHI_warlords.19.t:0 "Государство [FROM.GetNameDefCap] отвергло наше предложение"
 CHI_warlords.19.desc:0 "Наш посланник в государстве [FROM.GetNameDef] вернулся с ужасными новостями. Правительство государства [FROMGetNameDef] отвергло наше предложение."
 CHI_warlords.20.t:0 "Государство [FROM.GetNameDefCap] приняло наше предложение"
 CHI_warlords.20.desc:0 "Наш посланник в государстве [FROM.GetNameDef] вернулся с прекрасными новостями. Правительство государства [FROMGetNameDef] приняло наше предложение."
 CHI_warlords.21.t:0 "Государство [JAP.GetNameDefCap] ответило на нашу просьбу"
 CHI_warlords.21.desc:0 "Наш посланник в государстве [JAP.GetNameDef] вернулся с новостями от японской армии. Они приняли решение и объявили, сколько винтовок отправили нам!"
 CHI_warlords.22.t:0 "Предательство!"
 CHI_warlords.22.desc:0 "После исчезновения прямой угрозы государство [FROM.GetNameDef] предало нас! Готовясь вновь разжечь гражданскую войну в Китае, оно обратилось к нашим гарнизонам, и четверть из них перешла на его сторону, значительно усилив врага в теперь уже неизбежной гражданской войне."
 CHI_warlords.23.t:0 "Армия восстала!"
 CHI_warlords.23.desc:0 "Наш худший кошмар стал явью! План опереться на армию провалился: четверть наших войск также перешла на сторону врага! Возможно, спасать Китай уже слишком поздно!"
 CHI_warlords.24.t:0 "Государство [FROM.GetNameDefCap] направило нам предложение"
 CHI_warlords.24.desc:0 "Государство [FROM.GetNameDefCap] направило нам предложение. Оно утверждает, что несколько великих держав пытаются вторгнуться в Китай. В обмен на признание его власти как Национального правительства оно готово принять нас в качестве федеральной земли и предоставить все связанные с этим права. Это позволит сохранить всю местную внутреннюю политику, пока мы остаёмся под его покровительством."
 CHI_warlords.25.t:0 "Государство [FROM.GetNameDefCap] предъявило нам ультиматум"
 CHI_warlords.25.desc:0 "Государство [FROM.GetNameDefCap] предъявило нам ультиматум. Оно указывает на, по его мнению, несправедливую оккупацию китайских договорных портов и требует немедленно покинуть Китай."
 CHI_warlords.26.t:0 "Государство [FROM.GetNameDefCap] направило нам предложение"
 CHI_warlords.26.desc:0 "Государство [FROM.GetNameDefCap] осознало, что многое возможно, если власть получат правильные люди. Поэтому оно предложило [ROOT.GetLeader]: если тот подчинится, то получит обширную сферу влияния вокруг города [ROOT.capital.GetCapitalVictoryPointName] и полную свободу во внутренней политике."
 CHI_warlords.27.t:0 "Государство [FROM.GetNameDefCap] требует окончательной интеграции"
 CHI_warlords.27.desc:0 "После объединения Китая государство [FROM.GetNameDef] решило, что пришло время окончательно сплотить страну. Поэтому оно потребовало интегрировать нас, его губернаторство. Что мы ответим?"
 CHI_warlords.28.t:0 "Государство [FROM.GetNameDefCap] просит мира"
 CHI_warlords.28.desc:0 "Посланники государства [FROM.GetNameDef] обратились к нашим офицерам на границе с просьбой о мире и предложили полный доступ через свои земли. С одной стороны, это значительно облегчит снабжение армии, но в долгосрочной перспективе затруднит завоевание всего Китая. Как нам поступить?"
 CHI_warlords.28.a:0 "Шаг за шагом Единый фронт рушится!"
 CHI_warlords.28.b:0 "Мы не проявим милосердия к трусам!"
 CHI_warlords.29.t:0 "Государство [FROM.GetNameDefCap] требует исключить коммунистов"
 CHI_warlords.29.desc:0 "Посланники государства [FROM.GetNameDef] обратились к нам и указали на зло коммунизма. Поэтому они требуют исключить государство [PRC.GetNameDef] из нашего союза."
 CHI_warlords.29.a:0 "Они правы, мы должны это сделать"
 CHI_warlords.29.b:0 "Единый фронт должен устоять!"
 CHI_warlords.30.t:0 "Конгресс ради выживания народа"
 CHI_warlords.30.desc:0 "Конфуцианцы, христиане и многие другие интеллектуалы объединились в ответ на наши Три чистоты и пришли к выводу, что мы являемся злом и угнетаем их. Поэтому они сплотились, чтобы сопротивляться нам и бороться за своё выживание."
 CHI_warlords.30.a:0 "Они сами навлекли на себя наш гнев и избрали собственную судьбу..."
 CHI_warlords.31.t:0 "Судьба захваченных земель"
 CHI_warlords.31.desc:0 "Наконец мы вернули некоторые земли, долгое время захваченные иностранными народами — русскими, маньчжурами, монголами и другими. Возникает вопрос: что делать с этими отвратительными недолюдьми?"
 CHI_warlords.31.a:0 "Мы создадим отдельные государства с особыми правами для китайского народа!"
 CHI_warlords.31.b:0 "Эти китайские земли должны быть очищены от любого иностранного влияния!"
 CHI_warlords.32.t:0 "Предложение от государства [FROM.GetNameDef]"
 CHI_warlords.32.desc:0 "В последние годы государство [FROM.GetNameDefCap] всё сильнее отдалялось от остального Китая. Теперь оно предлагает взаимно признать наши правительства, согласившись с принципом «Один Китай — две системы»."
 CHI_warlords.32.b:0 "Звучит разумно, нет причин искать здесь конфликт."
 CHI_warlords.32.a:0 "Мы объединим Китай любой ценой!"
 CHI_warlords.33.t:0 "Государство [FROM.GetNameDefCap] просит гарантий"
 CHI_warlords.33.desc:0 "В последние годы государство [FROM.GetNameDefCap] стало современным западным государством, разделяющим наши идеалы. Оно просит гарантировать защиту его образа жизни. Согласимся ли мы?"
 CHI_warlords.33.a:0 "Нет причин брать на себя такие обязательства"
 CHI_warlords.33.b:0 "Разумеется, мы защитим наших друзей!"
 CHI_warlords.34.t:0 "Государство [FROM.GetNameDefCap] ищет нашей поддержки"
 CHI_warlords.34.desc:0 "В последние годы в государстве [FROM.GetNameDefCap] произошла революция под руководством левого Гоминьдана. В ходе борьбы за национальную революцию оно обратилось к нам за поддержкой. Что мы ответим?"
 CHI_warlords.34.a:0 "Нет причин брать на себя такие обязательства"
 CHI_warlords.34.b:0 "Сотрудничество с новыми революционерами в Китае? Разумеется!"
 CHI_warlords.35.t:0 "Государство [FROM.GetNameDefCap] добивается признания"
 CHI_warlords.35.desc:0 "Получив нашу поддержку, государство [FROM.GetNameDefCap] теперь просит официально признать его законным правительством Китая и прекратить поддержку государства [PRC.GetNameDef]."
 CHI_warlords.35.a:0 "Государство [PRC.GetNameDefCap] всё ещё пользуется нашим доверием!"
 CHI_warlords.35.b:0 "Очевидно, государство [FROM.GetNameDefCap] является законным правительством Китая!"
 CHI_warlords.36.t:0 "Государство [FROM.GetNameDefCap] предлагает совместный ультиматум государству [PRC.GetNameDef]"
 CHI_warlords.36.desc:0 "Государство [FROM.GetNameDefCap] предложило нам, учитывая зависимость КНР от нас, предъявить ей ультиматум с требованием присоединиться к государству [FROM.GetNameDef]. Это значительно усилит поддерживаемое нами правительство в Китае, однако глубже втянет нас в конфликт."
 CHI_warlords.36.a:0 "Нет причин брать на себя такие обязательства"
 CHI_warlords.36.b:0 "Отправить документы"
 CHI_warlords.37.t:0 "Государства [FROM.GetNameDefCap] и [FROM.FROM.GetNameDef] предъявили нам ультиматум..."
 CHI_warlords.37.desc:0 "Эти две державы объединились и потребовали, чтобы мы вошли в поддерживаемое Советами правительство в государстве [FROM.FROM.GetNameDef]. Мы зависим от Советского Союза и не можем отказать, однако некоторые всё ещё хотят сражаться против этих националистов."
 CHI_warlords.37.a:0 "Мы будем сражаться до последнего вздоха!"
 CHI_warlords.37.b:0 "В любом случае мы обречены, так что лучше сохранить жизни..."
 CHI_warlords.38.t:0 "Государство [FROM.GetNameDefCap] просит оружие"
 CHI_warlords.38.desc:0 "Государство [FROM.GetNameDefCap] запросило оружие, чтобы объединить под своей властью Китай. Сколько мы отправим, если вообще станем отправлять?"
 CHI_warlords.38.a:0 "Мы отправим им 4000 винтовок"
 CHI_warlords.38.b:0 "Мы отправим им 1500 винтовок"
 CHI_warlords.38.c:0 "Мы не можем ничего им отправить"
 CHI_warlords.39.t:0 "Государство [SOV.GetNameDefCap] ответило на нашу просьбу"
 CHI_warlords.39.desc:0 "Наш посланник в государстве [SOV.GetNameDef] вернулся с новостями от советской армии. Они приняли решение и объявили, сколько винтовок отправили нам!"
 CHI_warlords.40.t:0 "Государство [FROM.GetNameDefCap] приглашает нас во Вторую античанкайшистскую коалицию"
 CHI_warlords.40.desc:0 "Государство [FROM.GetNameDefCap] вновь создало Античанкайшистскую коалицию! Теперь оно приглашает нас присоединиться и просит поддержать свержение жалкого диктатора. Что мы ответим?"
 CHI_warlords.40.a:0 "Разумеется!"
 CHI_warlords.40.b:0 "Это всего лишь уловка для распространения их собственного влияния!"
 CHI_warlords.41.t:0 "Государство [FROM.GetNameDefCap] провозгласило национальное управление"
 CHI_warlords.41.desc:0 "Государство [FROM.GetNameDefCap] успешно возглавило нас в античанкайшистской коалиции, пока Гоминьдан в Нанкине рушится. Однако оно воспользовалось случаем, чтобы провозгласить национальное управление, и теперь требует нашего повиновения и подчинения ради укрепления контроля над страной. При этом нам обещают внутреннюю автономию во всей внутренней политике... Что мы ответим на такое предложение?"
 CHI_warlords.42.t:0 "Наше место в Едином фронте"
 CHI_warlords.42.desc:0 "Китайский единый фронт выполнил свою задачу и устарел. Теперь пора определить нашу дальнейшую судьбу, поскольку государство [CUG.GetNameDefCap] всё сильнее господствует в нём и всё глубже втягивает нас в свою сферу."
 CHI_warlords.42.a:0 "Наше место — вместе с Китаем и под китайской властью"
 CHI_warlords.42.b:0 "Мы должны сами выковать свою судьбу!"
 CHI_warlords.43.t:0 "Государство [FROM.GetNameDefCap] вступает во фронт"
 CHI_warlords.43.desc:0 "Государство [FROM.GetNameDefCap] разделяет нашу любовь к Китаю и вступило в Единый фронт. Это великий шаг вперёд!"
 CHI_warlords.43.a:0 "К лучшему или худшему, теперь мы товарищи."
