 CHI_only_we_can_save_china:0 "Только мы можем спасти Китай"
 CHI_only_we_can_save_china_desc:0 "Только мы можем спасти Китай! Для этого мы объявим общенациональное правление и подготовимся уничтожить фальшивых самозванцев в Нанкине!"
 CHI_resurrect_the_anti_chaing_coalition:0 "Возродить коалицию против Чана"
 CHI_resurrect_the_anti_chaing_coalition_desc:0 "Мы возродим коалицию против Чана, существовавшую несколько лет назад! Чан, злой мелкий диктатор и враг народа, падёт! Да здравствует наш великий новый режим!"
 CHI_a_friendship_with_the_warlords:0 "Дружба с военачальниками"
 CHI_a_freindship_with_the_warlords_desc:0 "Мы заручимся поддержкой военачальников для нашей великой коалиции, ведь именно они были движущей силой предыдущей! Тогда мы были близки к победе, а теперь непременно добьёмся успеха!"
 CHI_an_alliance_with_the_rightists:0 "Союз с правыми"
 CHI_an_alliance_with_the_rightists_desc:0 "Мы обратимся к правым, которым Чан столь же отвратителен, как и нам! Это объединит нас против него и уравняет силы, приблизив его гибель!"
 CHI_an_olive_branch_to_the_communists:0 "Протянуть оливковую ветвь коммунистам"
 CHI_an_olive_branch_to_the_communists_desc:0 "Мы обратимся к коммунистам Китая. Хотя наши идеологические разногласия огромны, сейчас это неважно. Чан должен умереть, и мы вместе добьёмся этого!"
 CHI_seek_support_from_the_democrats:0 "Заручиться поддержкой демократов"
 CHI_seek_support_from_the_democrats_desc:0 "Китайские демократы похожи на нас и презирают Чана! Это создаёт идеальную основу для совместной борьбы против общего врага и угнетателя!"
 CHI_march_on_chaing:0 "Поход на Чана"
 CHI_march_on_chaing_desc:0 "Время пришло! Мы нанесём удар по Нанкину и свергнем Чана с пьедестала! Чан погибнет, а мы утвердим себя как истинный Китай!"
 CHI_prepare_for_the_second_northern_expedition:0 "Подготовиться ко Второму Северному походу"
 CHI_prepare_for_the_second_northern_expedition_desc:0 "Мы будем готовиться ко второй Северной экспедиции, чтобы обезопасить большие северные районы Китая вместе с Пекином, чтобы гарантировать, что мы сможем объединить великую Китайскую Республику. Слава КМТ и Китаю!"
 CHI_pillage_the_occupied_lands:0 "Разграбить оккупированные земли"
 CHI_pillage_the_occupied_lands_desc:0 "Поскольку джихад развивается успешно, пришло время разграбить эти земли, укрепив нашу экономику и приблизив великую победу!"
 CHI_construct_minarets:0 "Строить минареты"
 CHI_construct_minarets_desc:0 "Мы будем возводить минареты по всему нашему новому государству! Наша великая победа прославит Аллаха! Слава джихаду и Аллаху!"
 CHI_take_leadership_of_islam:0 "Возглавить исламский мир"
 CHI_take_leadership_of_islam_desc:0 "Мы возглавим исламский мир, провозгласив себя великим исламским государством!"
 CHI_enforced_social_values:0 "Навязанные ценности"
 CHI_enforced_social_values_desc:0 "Мы начнём насаждать ценности Корана. Если они действительно исходят от Аллаха, то весь наш народ обязан им подчиняться!"
 CHI_a_unitary_education:0 "Единое образование"
 CHI_a_unitary_education_desc:0 "Наши сыновья должны получать образование согласно воле Аллаха! Они будут изучать хадисы и постигать его волю! Только это сделает наш народ великим и образованным."
 CHI_society_as_allah_ordained_it:0 "Общество, каким его предписал Аллах"
 CHI_society_as_allah_ordained_it:0 "Наконец мы добились своего! Наше общество устроено по воле Аллаха и согласно Корану! Слава Аллаху и халифу!"
 CHI_reinstate_the_jizya:0 "Восстановить джизью"
 CHI_reinstate_the_jizya_desc:0 "Поскольку в наших землях так много неверных, мы восстановим джизью! Неверные заплатят за отрицание Аллаха и Корана! Это поможет увеличить расходы на джихад и подготовиться к великой священной войне!"
 CHI_stabilize_the_economy:0 "Стабилизировать экономику"
 CHI_Stabilize_the_economy_desc:0 "Мы займёмся стабилизацией экономики после гражданской войны и прихода к власти воинов Аллаха! Это позволит провести все желаемые реформы!"
 CHI_conversion_by_the_sword:0 "Обращение мечом"
 CHI_conversion_by_the_sword_desc:0 "Хотя джизья стала важным первым шагом к интеграции неверных в наше исламское общество, этого оказалось недостаточно. Оставшиеся склонятся перед Аллахом и его пророком Мухаммедом! Иного пути для них может не быть!"
 CHI_begin_preparations_for_jihad:0 "Начать подготовку к джихаду"
 CHI_begin_preparations_for_jihad_desc:0 "Мы начнём готовиться к великому джихаду и развивать экономику, чтобы запасы оружия никогда не иссякали!"
 CHI_ready_the_army_of_jihad:0 "Подготовить армию джихада"
 CHI_ready_the_army_of_jihad_desc:0 "Мы начнём готовить армию джихада! Осталось совсем немного! Скоро мы сможем нанести удар и исполнить волю Аллаха!"
 CHI_strike_forth:0 "Нанести удар"
 CHI_strike_forth_desc:0 "Мы выступим вперёд и начнём джихад! Мы победим, и никто нас не остановит!"
 CHI_collect_funds_for_the_jihad:0 "Собрать средства на джихад"
 CHI_collect_funds_for_the_jihad_desc:0 "Мы начнём собирать с народа средства на джихад, преодолевая экономические трудности и обеспечивая необходимое военное производство для эффективной борьбы с неверными!"
 CHI_the_caliphate_of_china:0 "Китайский халифат"
 CHI_the_caliphate_of_china_desc:0 "Хотя мы можем быть мусульманами, мы также являемся китайцами. Поэтому мы будем работать над тем, чтобы объединить эти вещи и создать халифат здесь, в наших восточных масштабах исламского влияния, чтобы принести духовное возрождение в Китай!"
 CHI_an_islamic_state:0 "Исламское государство"
 CHI_an_islamic_state_desc:0 "Мусульмане слишком долго были разделены и враждовали друг с другом! Мы создадим исламское государство здесь, в Западном Китае, а затем распространим его по миру, чтобы объединить всех мусульман и построить великое исламское государство!"
 CHI_a_great_turkestan:0 "Туркестанский халифат"
 CHI_a_great_turkestan_desc:0 "Наш народ не принадлежит к неверным китайцам — мы великий народ Туркестана! Днём и ночью мы будем трудиться над восстановлением этого великого государства под властью нашего нового халифата!"
 CHI_instate_sharia_law:0 "Ввести законы шариата"
 CHI_instate_sharia_law_desc:0 "Мы начнём вводить законы шариата, чтобы воплотить волю Аллаха в нашем обществе и полностью подчинить его этой воле!"
 CHI_totaltarianism_after_allahs_word:0 "Тоталитаризм после Корана"
 CHI_totaltarianism_after_allahs_word_desc:0 "Мы начнем расправляться с любым неповиновением и отступничеством в наших рядах! Аллах не допускает такого вырождения и повелевает нам действовать как Его правая рука и делать эту добрую работу для Него! Выродки и отступники будут побеждены!"
 CHI_eliminate_all_dissent:0 "Уничтожить всякое инакомыслие"
 CHI_eliminate_all_dissent_desc:0 "Мы продолжим искоренять всякое инакомыслие! Каждый, кто не подчинится всем предписаниям шариата, должен умереть! Ислам означает покорность, и предатели испытают это на себе!"
 CHI_adopt_the_penal_code:0 "Принять шариатский уголовный кодекс"
 CHI_adopt_the_penal_code_desc:0 "Коран очень ясно предписывает, как поступать со всеми видами преступников — от вора до убийцы! Мы внедрим и эту часть шариата, чтобы расправиться с многочисленными преступниками под нашей властью!"
 CHI_begin_jihad_against_the_oppressors:0 "Начать джихад против угнетателей"
 CHI_begin_jihad_against_the_oppressors_desc:0 "Мы начнём великий джихад против угнетающих нас китайцев! Священным джихадом мы освободим наш народ хуэй и весь наш исламский народ, исполняя волю Аллаха!"
 CHI_infiltrate_hui_communities:0 "Проникнуть в общины хуэй"
 CHI_infiltrate_hui_communities_desc:0 "Мы внедримся в общины хуэй и начнём радикализировать их жителей! Ислам вновь обретёт величие, а хуэй будут купаться в славе Аллаха!"
 CHI_a_radical_hui:0 "Радикализированные хуэй"
 CHI_a_radical_hui_desc:0 "Благодаря нашей работе народ хуэй по-настоящему радикализировался и теперь одержим исполнением воли Аллаха. Осталось совсем немного, прежде чем мы сможем свергнуть китайских угнетателей!"
 CHI_propaganda_against_the_kmt:0 "Пропаганда против Гоминьдана"
 CHI_propaganda_against_the_kmt_desc:0 "Мы развернём широкую пропаганду против Гоминьдана и тем самым косвенно поддержим великую исламскую революцию!"
 CHI_an_organized_resistance_militia:0 "Организованное ополчение сопротивления"
 CHI_an_organized_resistance_militia_desc:0 "Мы сформируем организованное ополчение для борьбы с Гоминьданом. Это позволит нам захватить горы и пустыню и осадить столицу! Никто не устоит перед великим мечом ислама!"
 CHI_break_the_back_of_the_kmt_forces:0 "Сломить силы Гоминьдана"
 CHI_break_the_back_of_the_kmt_forces_desc:0 "Мы сломим силы Гоминьдана в нашем регионе. Это позволит нам действовать безнаказанно и окончательно покончить с гоминьдановским гнётом."
 CHI_the_jihad_successfull:0 "Изгнать неверных"
 CHI_the_jihad_successfull_desc:0 "Наконец-то мы добились своего! Пора начать джихад и изгнать неверных! Долой старую гвардию, да здравствует Исламское государство!"
 CHI_deal_with_anti_japanese_hatred:0 "Разобраться с антияпонской ненавистью"
 CHI_deal_with_anti_japanese_hatred_desc:0 "Теперь, когда мы действительно стали самостоятельным государством, пора разобраться с ненавистью народа к Японии и добиться хотя бы возможности примирения!"
 CHI_the_sinofication_of_china:0 "Китаизация Китая"
 CHI_manchu_colab:0 "Создать особую администрацию в Маньчжурии"
 CHI_tunganistan_colab:0 "Создать особую администрацию в Восточном Туркестане"
 CHI_sinofy_land:0 "Китаизировать [FROM.GetName]"
 CHI_a_place_in_the_comintern:0 "Место в Коминтерне"
 CHI_a_place_in_the_comintern_desc:0 "Поскольку Советы поддерживали нас до сих пор, мы добьёмся места в Коминтерне. Русско-китайский союз станет великим достижением."
 CHI_request_military_aid:0 "Запросить советскую военную помощь"
 CHI_request_military_aid_desc:0 "Мы запросим военную помощь у Советского Союза. Нам нужно оружие, а у них есть промышленность для его производства, поэтому было бы разумно предоставить нам часть запасов."
 CHI_a_soviet_tank_advisors:0 "Советские танковые советники"
 CHI_a_soviet_tank_advisors_desc:0 "Мы пригласим в нашу страну советских танковых советников, чтобы они научили нас создавать мощные танковые войска."
 CHI_extol_chinese_nationalism:0 "Восхвалять китайский национализм"
 CHI_extol_chinese_nationalism_desc:0 "Мы будем восхвалять китайский национализм в нашей стране! Под нашей властью Китай станет единым! Это высшее благо Революции!"
 CHI_reach_out_to_moscow:0 "Обратиться к Москве"
 CHI_reach_out_to_moscow_desc:0 "Мы обратимся к [SOV.GetNameDef] и попросим поддержки. Если нам удастся её получить, мы обретём ценный опыт, оружие и дипломатическую опору."
 CHI_request_official_recognition:0 "Запросить официальное признание"
 CHI_request_official_recognition_desc:0 "Мы запросим официальное признание у Советов, завершив подготовку к нашим планам по установлению власти над Китаем. Так мы станем главным просоветским государством в Китае и будем полностью готовы к дальнейшим действиям."
 CHI_joint_ultimatum_to_prc:0 "Совместный ультиматум государству [PRC.GetNameDef]"
 CHI_joint_ultimatum_to_prc_desc:0 "Совместно с Советами мы предъявим КНР ультиматум с требованием передать нам управление их государством, поскольку именно мы теперь являемся поддерживаемой Советами силой в регионе."
 CHI_support_chinese_religion:0 "Поддержать китайские религии"
 CHI_support_chinese_religion_desc:0 "Мы поддержим традиционные китайские религии, опирающиеся на общее национальное самосознание, чтобы с их помощью создать мощную силу для защиты нации!"
 CHI_state_atheism:0 "Государственный атеизм"
 CHI_state_atheism_desc:0 "Мы утвердим государственный атеизм в нашей стране, придав нашей идеологии ощущение чистоты. Благодаря этому рабочие смогут неустанно трудиться ради революции Гоминьдана!"
 CHI_beacon_of_socialism:0 "Маяк социализма"
 CHI_beacon_of_socialism_desc:0 "Мы действительно стали великим маяком социализма, ярким примером для всех социалистов мира! Слава Революции!"
 CHI_beacon_of_communism:0 "Маяк коммунизма"
 CHI_beacon_of_communism_desc:0 "Мы действительно стали великим маяком коммунизма, ярким примером для всех коммунистов мира! Слава Революции!"
 CHI_enforce_loyalty_to_the_revolution:0 "Обеспечить верность Революции"
 CHI_enforce_loyalty_to_the_revolution_desc:0 "Мы обеспечим верность национальной революции Гоминьдана, чтобы против нашей великой революции не возникло никакого инакомыслия! Никто не отвергнет наш великий поход!"
 CHI_purge_the_decadence:0 "Искоренить упадок"
 CHI_purge_the_decadence_desc:0 "Мы очистим страну от упадочных республиканцев, которые сильно тормозят нашу великую революцию! Они должны уйти, а Китай должен быть восстановлен в ярком свете революции Гоминьдана!"
 CHI_enshrine_the_yuan:0 "Закрепить власть Юаня"
 CHI_enshrine_the_yuan_desc:0 "Мы закрепим в Китае власть Юаня — китайского законодательного органа. Он станет могучим оплотом, способным не допустить появления нового Чана или новой КПК. Так мы обеспечим ответственное руководство в соответствии с тремя народными принципами."
 CHI_sideline_the_radicals:0 "Оттеснить радикалов"
 CHI_sideline_the_radicals_desc:0 "Мы оттесним радикалов в парламенте и даже запретим деятельность некоторых из них за постоянное нарушение принципов демократического централизма. Они нарушили наши правила и должны понести последствия."
 CHI_full_control_over_the_apparatus_of_education:0 "Полный контроль над системой образования"
 CHI_full_control_over_the_apparatus_of_education_desc:0 "Мы установим контроль над всей системой образования, что позволит увеличить её финансирование и укрепить преданность нашей партии!"
 CHI_nationalize_foreign_assets:0 "Национализировать иностранные активы"
 CHI_nationalize_foreign_assets_desc:0 "Теперь, когда революция Гоминьдана охватила нашу провинцию, мы конфискуем иностранные активы, чтобы Китай действительно принадлежал китайцам!"
 CHI_purge_the_reactionary:0 "Очистить Гоминьдан от реакционеров"
 CHI_purge_the_reactionary_desc:0 "Мы очистим реакционеров в МКТ, позволив остановить дегенеративное влияние Севера и нашему великому государству процветать!"
 CHI_reorganize_the_party_along_lenninist_lines:0 "Реорганизовать партию по ленинским принципам"
 CHI_reorganize_the_party_along_lenninist_lines_desc:0 "Мы вернёмся к истокам и вновь сделаем то, что делали прежде: реорганизуем партию по ленинским принципам!"
 CHI_democratic_centralism:0 "Демократический централизм"
 CHI_democratic_centralism_desc:0 "Мы введём демократический централизм, совместив свободу обсуждения с решительными действиями исполнительной власти! Это позволит национальной революции Гоминьдана действительно развиваться эффективно!"
 CHI_announce_full_communism:0 "Провозгласить полный коммунизм"
 CHI_announce_full_communism_desc:0 "Первым принятым нами постановлением станет закрепление истинного коммунизма в государстве, что позволит создать настоящую коммунистическую утопию!"
 CHI_socialism_not_communism:0 "Социализм, а не коммунизм"
 CHI_socialism_not_communism_desc:0 "Мы начнём проводить социалистическую политику, однако это не означает, что мы падём жертвой ужасов коммунизма. Напротив, мы решительно отвергнем любые предложения следовать подобным планам!"
 CHI_land_value_tax_3:0 "Налог на стоимость земли"
 CHI_land_value_tax_3_desc:0 "Мы сделаем то, чего Гоминьдан давно добивался, хотя уже и запоздали: наконец воспользуемся моментом и введём налог на стоимость земли, чтобы освободить народ от капиталистического гнёта!"
 CHI_transfer_factories_to_the_proletariat:0 "Передать фабрики пролетариату"
 CHI_transfer_factories_to_the_proletariat_desc:0 "Первые реформы идут успешно, и теперь мы передадим фабрики пролетариату, предоставив народу средства производства"
 CHI_state_owned_corporations:0 "Государственные корпорации"
 CHI_state_owned_corporations_desc:0 "Мы национализируем корпорации, чтобы народ и государство получали от них гораздо больше пользы, а экономика обрела долгосрочный рост!"
 CHI_seize_merchant_property:0 "Конфисковать собственность торговцев"
 CHI_seize_merchant_property_desc:0 "Мы покончим с одним из главных оплотов капитализма в Китае! Презренные торговцы лишатся собственности, а их активы будут конфискованы!"
 CHI_the_fate_of_the_overrun_lands:0 "Судьба захваченных земель"
 CHI_the_fate_of_the_overrun_lands_desc:0 "Маньчжурия и Синьцзян захвачены нечистыми расами... Теперь мы должны решить, что делать с этими землями и их населением — как с китайцами, так и с прочей живущей там нечистью."
 CHI_appropriate_the_fuhrerprinzip:0 "Перенять принцип фюрерства"
 CHI_appropriate_the_fuhrerprinzip_desc:0 "Хотя немецкие национал-социалисты выступают против монархии, многие стороны их идеологии близки нам. Поэтому мы вдохновимся их принципом фюрерства и применим его к Императору! Он станет непререкаемым фюрером нашей великой нации, и никто не посмеет ставить его под сомнение!"
 CHI_drive_out_the_foreign_devils:0 "Изгнать иностранных дьяволов"
 CHI_drive_out_the_foreign_devils_desc:0 "Слишком долго наша наука находилась под пагубным и нечистым западным влиянием! Мы уничтожим западных свиней и спасём страну от их злого воздействия!"
 CHI_destroy_foreign_thought:0 "Уничтожить иностранную мысль"
 CHI_destroy_foreign_thought_desc:0 "Хотя иностранные дьяволы изгнаны, их идеи всё ещё широко распространены в нашей стране... Мы разберёмся с этим, а виновники будут устранены."
 CHI_the_revolution_successfull:0 "Революция победила"
 CHI_the_revolution_successfull_desc:0 "Мы сражались днём и ночью и наконец достигли нашей величайшей цели. Культурная революция увенчалась большим успехом; теперь мы можем отменить введённые меры и подготовить по-настоящему великое государство ради народа и его процветания под властью великого Императора!"
 CHI_jihad:0 "Джихад"
 CHI_begin_the_cultural_revolution:0 "Начать §RКультурную революцию§!"
 CHI_begin_the_cultural_revolution_desc:0 "Мы начнем Культурную революцию, чтобы уничтожить выродившиеся силы, разрушающие чистоту и стабильность нашей страны. Мы начнем масштабную кампанию по полному уничтожению всякого сопротивления нашим новым чистым формам мышления!"
 CHI_a_national_chinese_empire:0 "Национальная Китайская империя"
 CHI_a_national_chinese_empire_desc:0 "Мы провозгласим новую Национальную империю! Мы спасём китайский народ! Слава народу хань!"
 CHI_break_the_confucionists:0 "Сломить конфуцианцев"
 CHI_break_the_confucionists_desc:0 "Мы начнем сломать конфуцианцев и работать день и ночь, чтобы полностью уничтожить их и их выродившиеся пути в противостоянии нашей стране. Они будут уничтожены!"
 CHI_undo_the_damage_of_the_cim:0 "Устранить ущерб от ВКМ"
 CHI_undo_the_damage_of_the_dim_desc:0 "Китайская Внутренняя Миссия сделала много, чтобы разрушить нашу чистоту мысли, распространяя вырожденные христианские идеалы по всему Китаю! Мы будем работать над тем, чтобы уничтожить их последствия и создать преследование, большее, чем все, что когда-либо делал Нерон."
 CHI_full_autarky:0 "Полная автаркия"
 CHI_full_autarky_desc:0 "Мы наконец достигли автаркии, и теперь пора сделать последний необходимый шаг для исправления нашей экономики!"
 CHI_a_new_socalled_religion:0 "Новая так называемая религия"
 CHI_a_new_socalled_religion_desc:0 "С уничтожением выродившихся религиозных людей настало время для того, чтобы мы в полной мере укрепили нашу новую религию, возвеличив государство и наше новое чувство нерелигиозного разума! Слава Императору!"
 CHI_the_three_principles_of_the_nation:0 "Три принципа §Rнации§!"
 CHI_the_three_principles_of_the_nation_desc:0 "У Китайской Республики есть свои три принципа. Они устарели и погубили китайскую культуру. В противовес им мы создадим для Китая три новых принципа: Три единства, Три чистоты и Три силы."
 CHI_santong:0 "Сантун (Три единства)"
 CHI_santong_desc:0 "Мы будем работать над объединением ключевых аспектов нашего государства. Мы объединим руководство и власть в государстве при императоре для консолидации власти, мы объединим народ и создадим Volksgemeinschaft по образцу немцев, и наконец мы объединяем страну и поставим великую цель объединения китайской нации!"
 CHI_guo:0 "Го (Страна/Нация/Государство)"
 CHI_guo_desc:0 "Мы укрепим китайский национализм и стремление к чистоте, чтобы создать по-настоящему великое централизованное унитарное государство! Китай будет един!"
 CHI_min:0 "Мин (народ/нация/народ)"
 CHI_min_desc:0 "Мы объединим народ вокруг общей цели, создав братство, подобное тому, что немцы называют народным сообществом! Китайский народ сплотится вокруг нас!"
 CHI_wang:0 "Ванг (Король/Император)"
 CHI_wang_desc:0 "Мы поставим Императора в центр всего и добьёмся, чтобы он лично воплощал единство нации! Под властью Императора будет выкован единый Китай!"
 CHI_sanchun:0 "Санчун (Три чистоты)"
 CHI_sanchun_desc:0 "Мы провозгласим три чистоты нашей нации. Для выживания нам необходима чистота крови и культуры, чтобы создать сильную китайскую нацию и народ. Кроме того, мы должны очистить мудрость нашего народа, чтобы все в стране разделяли нашу мудрость и наши идеи!"
 CHI_wen:0 "Вэнь (язык/культура)"
 CHI_wen_desc:0 "Мы очистим китайцев великой китайской нации! Император будет трудиться днём и ночью, китаизируя культуру и добиваясь её чистоты согласно собственному идеалу, пока ни одно меньшинство больше не сможет сопротивляться нам!"
 CHI_zhi:0 "Чжи (мудрость)"
 CHI_zhi_desc:0 "Мы очистим мудрость великой китайской нации! Император будет трудиться днём и ночью, чтобы весь народ следовал его школе мысли! Сопротивление лжеинтеллектуалов будет подавлено, а умы народа окажутся в наших руках!"
 CHI_sanqiang:0 "Санкян (Три силы)"
 CHI_sanqiang_desc:0 "Мы также укрепим три наши силы: великую веру, основанную на атеизме; могучую армию, способную очищать государство и защищать нас; и, наконец, обширные запасы ресурсов, способные питать нашу военную машину и идти на экспорт."
 CHI_xin:0 "Xin (Вера)"
 CHI_xin_desc:0 "Мы будем ежедневно трудиться, превращая атеизм и разум в одну из наших величайших сил. Это создаст современный и чистый народ, способный противостоять иностранному обману!"
 CHI_wu:0 "Ву (военный/военный)"
 CHI_wu_desc:0 "Мы добьёмся силы военным путём и используем её для очищения государства от врагов и создания великой империи, способной отразить любое нападение извне!"
 CHI_cai:0 "Cai (Ресурс)"
 CHI_cai_desc:0 "Чтобы модернизироваться и создать крупную армию, нам необходимо увеличить добычу ресурсов. Тогда мы сможем получить необходимые средства и произвести всё нужное! Будут достигнуты автаркия и полная самостоятельность!"
 CHI_xie:0 "Се (Кровь)"
 CHI_xie_desc:0 "Мы, китайцы, обладаем китайской кровью и должны сохранять её чистоту. Мы сделаем всё, чтобы ни одна капля нашей великой крови не была осквернена! Мы начнём процесс очищения прямо сейчас, уничтожив западных людей в нашем государстве!"
 CHI_prepare_for_the_three_year_plan:0 "Подготовиться к «трёхлетнему плану»"
 CHI_prepare_for_the_three_year_plan_desc:0 "Мы проведём последние приготовления к так называемому трёхлетнему плану, который позволит нам превратить образцовую провинцию в великое государство, способное обеспечивать свой народ!"
 CHI_project_gaosu_gonglu:0 "Проект «Гаосу гунлу»"
 CHI_project_gaosu_gonglu_desc:0 "Мы начнём проект «Гаосу гунлу» (скоростная магистраль), неотъемлемую часть нашего плана. Мы приступим к строительству китайской автомагистрали, способной перевозить огромное количество людей и грузов."
 CHI_upgrade_the_gonglu:0 "Модернизировать «Гунлу»"
 CHI_upgrade_the_gonglu_desc:0 "Первые проекты успешно продвигаются, и теперь пора модернизировать наши автомагистрали, превратив нашу клику в по-настоящему прекрасное место для жизни и обеспечив безупречную логистику."
 CHI_output_1:0 "Повышенная эффективность труда"
 CHI_output_2:0 "Новые промышленные методы"
 CHI_output_3:0 "Современное рабочее место в [GXC.GetAdjective] государстве"
 CHI_finalize_the_gonglu:0 "Завершить «Гунлу»"
 CHI_finalize_the_gonglu_desc:0 "Теперь мы завершим строительство автомагистрали, что позволит нам стать настоящей логистической державой, способной бороться за Китай!"
 CHI_increase_workplace_efficiency:0 "Повысить эффективность труда"
 CHI_increase_workplace_efficiency_desc:0 "Мы повысим эффективность на рабочих местах, чтобы трудящиеся могли действительно превосходно выполнять свои обязанности."
 CHI_implement_new_methods:0 "Внедрить новые методы"
 CHI_implement_new_methods_desc:0 "Мы внедрим на фабриках новые методы, чтобы достичь максимальной эффективности в производстве снаряжения для Китая."
 CHI_a_modern_workplace:0 "Современное рабочее место"
 CHI_a_modern_workplace_desc:0 "Наконец-то мы добились своего! Рабочие места в государстве [ROOT.GetNameDef] теперь действительно одни из лучших в мире! Какое прекрасное время!"
 CHI_increase_metal_output:0 "Увеличить производство металлов"
 CHI_increase_metal_output_desc:0 "Сталь и алюминий необходимы для полноценной индустриализации и создания надёжной экономики Китая. Мы должны увеличить производство этих материалов."
 CHI_advanced_metal_extraction:0 "Передовая добыча металлов"
 CHI_advanced_metal_extraction_desc:0 "Теперь мы производим большое количество дешёвого металла, но пора перейти к выпуску высококачественных металлов, пригодных для сложных задач и снабжения нашей промышленности."
 CHI_synthetic_oil_production:0 "Производство синтетической нефти"
 CHI_synthetic_oil_production_desc:0 "Теперь, когда производство металлов достигло должного уровня, мы начнём выпуск собственной нефти, обеспечив промышленность каучуком и топливом для любых задач."
 CHI_project_gongchang:0 "Проект «Гунчан»"
 CHI_project_gongchang_desc:0 "Мы начнём проект «Гунчан» («рабочее место» или «фабрика»), поскольку фабрики являются основой нашей экономики. Проект направлен на революционное преобразование предприятий и массовое развитие промышленности."
 CHI_additional_gongchang:0 "Дополнительные «Гунчаны»"
 CHI_additional_gongchang_desc:0 "Проект успешно развивается, но нам нужны дополнительные фабрики для полноценной индустриализации и настоящего процветания экономики."
 CHI_a_largescale_economy:0 "Крупномасштабная экономика"
 CHI_a_largescale_economy_desc:0 "После завершения проекта «Гунчан» мы можем с уверенностью заявить, что обладаем современной крупномасштабной экономикой, способной соперничать с другими небольшими странами."
 CHI_a_model_province_indeed:0 "Воистину образцовая провинция"
 CHI_a_model_province_indeed_desc:0 "Благодаря успеху трёхлетнего плана мы можем уверенно заявить, что наши замыслы полностью оправдались и теперь мы являемся самым промышленно развитым регионом Китая!"
 CHI_professionalize_the_army_mp:0 "Профессионализировать армию"
 CHI_professionalize_the_army_mp_desc:0 "Мы вывели армию из упадка, и теперь пора восстановить профессиональные стандарты, чтобы она могла вести полноценную борьбу."
 CHI_new_model_province2:0 "Новая образцовая провинция"
 CHI_new_model_province2_desc:0 "После признания со стороны Гоминьдана мы объявим себя новой образцовой провинцией Китая и начнём превращаться в промышленную державу!"
 CHI_break_the_shackles:0 "Разорвать оковы"
 CHI_break_the_shackles_desc:0 "Пока государство [CUG.GetNameDef] сражается за выживание, пора разорвать наложенные им на нас оковы. Мы освободимся от его гнёта и восстановим независимость!"
 CHI_seize_the_mantle_of_national_governance:0 "Принять на себя бремя национального управления"
 CHI_seize_the_mantle_of_national_governance_desc:0 "Пока Китай угасает, мы примем на себя бремя национального управления! Мы — новый Китай, и пришло время открыто провозгласить это!"
 CHI_survival_of_the_fittest:0 "Выживает сильнейший"
 CHI_survival_of_the_fittest_desc:0 "Поскольку государство [CUG.GetNameDef] находится в полном крахе, пришло время покинуть единый фронт и прекратить боевые действия с Японией."
 CHI_learn_from_chinese_equipment:0 "Изучить китайское снаряжение"
 CHI_learn_from_chinese_equipment_desc:0 "Мы изучим китайское вооружение и используем полученные сведения, чтобы улучшить наши войска и эффективнее противостоять им."
 CHI_learn_from_japanese_equipment:0 "Изучить японское снаряжение"
 CHI_learn_from_japanese_equipment_desc:0 "Мы изучим японское вооружение и используем полученные сведения, чтобы улучшить наши войска и эффективнее противостоять им."
 CHI_bribe_chinese_officers:0 "Подкупить китайских офицеров"
 CHI_bribe_chinese_officers_desc:0 "Мы заплатим китайским офицерам, чтобы они раскрыли важные секреты, которые помогут нам эффективнее противостоять им в любой войне."
 CHI_a_great_victory:0 "Великая победа"
 CHI_a_great_victory_desc:0 "Свершилось! Мы наконец победили японцев и спасли Китай! Никто не сравнится с китайской доблестью. Однако теперь пора решить, каким будет наше будущее..."
 CHI_bribe_japanese_officers:0 "Подкупить японских офицеров"
 CHI_bribe_japanese_officers_desc:0 "Мы заплатим японским офицерам, чтобы они раскрыли важные секреты, которые помогут нам эффективнее противостоять им в любой войне."
 CHI_request_communist_removal:0 "Потребовать исключения государства [PRC.GetNameDef]"
 CHI_request_communist_removal_desc:0 "Мы потребуем исключить государство [PRC.GetNameDef] из Китайского единого фронта, ведь этих ужасных людей вообще не следовало туда принимать!"
 CHI_a_neutral_battlefield:0 "Нейтральное поле боя"
 CHI_a_neutral_battlefield_desc:0 "Поскольку вторжение неизбежно, мы обратимся к Японии с предложением мира. Взамен мы позволим её войскам беспрепятственно перемещаться по нашим землям и продолжать войну на нашей территории."
 CHI_chinese_united_front:0 "Китайский единый фронт"
 CHI_chinese_united_front_desc:0 "С началом Войны Сопротивления мы будем вместе противостоять Японии как знаку национального единства! Да здравствует Китай!"
 CHI_left_front:0 "Покинул Китайский единый фронт"
 CHI_a_final_warning:0 "Последнее предупреждение"
 CHI_a_final_warning_desc:0 "Некоторые военачальники ранее отвергли наши предложения — возможно, они не поняли наших намерений. Мы вновь направим им наше предложение. На этот раз мы всерьёз намерены напасть, если они откажутся."
 CHI_free_china_from_imperialism:0 "Освободить Китай от империализма"
 CHI_free_china_from_imperialism_desc:0 "Мы предъявим ультиматум империалистам, напавшим на нашу страну, и потребуем их ухода, чтобы Китай наконец обрёл свободу!"
 CHI_federalism_the_savior_of_china:0 "Федерализм — спаситель Китая"
 CHI_federalism_the_savior_of_china_desc:0 "Мы увидели, что именно федерализм поднял Китай с колен! Теперь мы вправе заявить: федерализм — истинный спаситель Китая!"
 CHI_the_united_provinces_of_china:0 "Объединённые провинции Китая"
 CHI_the_united_provinces_of_china_desc:0 "Получив власть над страной, мы наконец сделаем то, к чему всегда стремились. Мы провозгласим Объединённые провинции Китая и укрепим новый федеративный Китай!"
 CHI_japanese_lapdog:0 "Японская марионетка"
 CHI_review_the_fortifications:0 "Проверить укрепления"
 CHI_review_the_fortifications_desc:0 "Мы проверим наши укрепления и тщательно их изучим, чтобы в будущем строить больше подобных сооружений."
 CHI_initial_fortification_tests:0 "Первые испытания укреплений"
 CHI_initial_fortification_tests_desc:0 "Мы используем полученные сведения и построим новый форт в столице, чтобы испытать способы возведения надёжных укреплений."
 CHI_fortify_the_frontier:0 "Укрепить границу"
 CHI_fortify_the_frontier_desc:0 "Мы укрепим рубежи страны, чтобы удержать границу против государства [CUG.GetNameDef]."
 CHI_high_level_forifications:0 "Укрепления высокого уровня"
 CHI_high_level_fortifications_desc:0 "Мы займёмся созданием мощных укреплений в столице и обеспечим её постоянную защиту."
 CHI_review_the_army:0 "Проверить армию"
 CHI_review_the_army_desc:0 "Мы проведём проверку армии нашего государства. Это поможет нам приблизиться к созданию по-настоящему современной армии."
 CHI_a_decentralized_high_command:0 "Децентрализованное верховное командование"
 CHI_a_decentralized_high_command_desc:0 "Мы постараемся децентрализовать верховное командование армии, чтобы повысить её устойчивость в случае вторжения."
 CHI_uncaring_warfare:0 "Безжалостная война"
 CHI_uncaring_warfare_desc:0 "Войны в Китае всегда велись безжалостно, поэтому мы примем этот подход и внедрим его в армии, чтобы усилить её."
 CHI_slash_ration_sizes:0 "Сократить размер пайков"
 CHI_slash_ration_sizes_desc:0 "Мы сократим пайки наших солдат, чтобы содержание огромной армии стало дешевле и эффективнее."
 CHI_appropriate_civillian_stockpiles:0 "Реквизировать гражданские запасы"
 CHI_appropriate_civillian_stockpiles_desc:0 "Мы разрешим солдатам реквизировать запасы у гражданского населения и беспрепятственно грабить его, значительно снизив тем самым логистическую нагрузку."
 CHI_legalize_farm_helping:0 "Узаконить «помощь на фермах»"
 CHI_legalize_farm_helping_desc:0 "Мы разрешим солдатам «помогать» крестьянам в полях. Однако эта помощь не будет бескорыстной: им позволят забирать урожай фермеров. Так войска смогут жить за счёт местности."
 CHI_mass_military_impressment:0 "Массовая военная мобилизация"
 CHI_mass_military_impressment_desc:0 "Мы начнём массовую принудительную мобилизацию, чтобы обеспечить достаточную численность армии. Это несколько снизит её качество, однако массовое развёртывание войск с лихвой всё компенсирует."
 CHI_a_gun_behind_every_rock:0 "Винтовка за каждым камнем"
 CHI_a_gun_behind_every_rock_desc:0 "Мы добьёмся того, чтобы за каждым камнем была винтовка, и обеспечим защиту каждого уголка нашей страны."
 CHI_the_country_is_where_the_general_is:0 "Где генерал — там и страна"
 CHI_the_country_is_where_the_general_is_desc:0 "Мы постараемся сплотить армию и страну вокруг генерала. Так мы сможем выстоять в любой ситуации!"
 CHI_defense_of_the_fatherland:0 "В защиту Отечества"
 CHI_defense_of_the_fatherland_desc:0 "Мы создадим армию, единственной целью которой станет защита нашей страны. Мы будем последовательно работать над этим и достигнем цели."
 CHI_a_proper_high_command:0 "Полноценное верховное командование"
 CHI_a_proper_high_command_desc:0 "Мы начнём создавать полноценное верховное командование армии, чтобы она могла действовать с высокой эффективностью в любой ситуации."
 CHI_a_new_recruitment_centre:0 "Новый призывной центр"
 CHI_a_new_recruitment_centre_desc:0 "После создания нового верховного командования мы наделим его полномочиями принуждать население вступать в армию через новый призывной центр."
 CHI_mountain_training:0 "Подготовка к боям на пересечённой местности"
 CHI_mountain_training_desc:0 "Мы научим армию сражаться на пересечённой местности и использовать её преимущества там, где противнику трудно действовать. Особенно полезны в таких условиях будут наши горные стрелки."
 CHI_a_central_high_command:0 "Центральное верховное командование"
 CHI_a_central_high_command_desc:0 "Мы займёмся созданием центрального верховного командования, чтобы ускорить модернизацию вооружённых сил."
 CHI_a_modern_army:0 "Современная армия"
 CHI_a_modern_army_desc:0 "Мы внедрим новые современные методы, увиденные на Западе. Это значительно ускорит модернизацию наших вооружённых сил."
 CHI_a_military_planning_school:0 "Школа военного планирования"
 CHI_a_military_planning_school_desc:0 "Мы создадим школу военного планирования, где будут разрабатываться превосходные планы ведения войн. Это значительно повысит нашу эффективность."
 CHI_modern_warfare:0 "Современная война"
 CHI_modern_warfare_desc:0 "После завершения реформ мы действительно создали современную армию и достигли необходимого уровня развития."
 CHI_an_auxuliary_army:0 "Вспомогательная армия"
 CHI_an_auxuliary_army_desc:0 "Наша цель — создать армию для поддержки сюзерена. Такой целевой подход позволит гораздо легче добиться её эффективности."
 CHI_task_specific_planning:0 "Планирование под конкретные задачи"
 CHI_task_specific_planning_desc:0 "Мы позволим военным составлять отдельные планы для каждой конкретной задачи. При нашей небольшой армии это вполне осуществимо и позволит выполнять каждую задачу с максимальной эффективностью."
 CHI_a_gruelling_training_regimen:0 "Изнурительный режим подготовки"
 CHI_a_gruelling_training_regimen_desc:0 "Мы введём для армии изнурительный режим подготовки. При её небольшой численности это вполне выполнимо и значительно повысит эффективность войск в бою."
 CHI_a_new_special_forces_project:0 "Новый проект войск специального назначения"
 CHI_a_new_special_forces_project_desc:0 "Мы разработаем новый проект войск специального назначения, чтобы они могли сражаться гораздо эффективнее."
 CHI_uplift_the_special_forces:0 "Усилить войска специального назначения"
 CHI_uplift_the_special_forces_desc:0 "Мы усилим войска специального назначения, будем тщательнее отбирать бойцов и тем самым значительно повысим их боевую эффективность."
 CHI_a_new_tank_project:0 "Новый танковый проект"
 CHI_a_new_tank_project_desc:0 "Мы разработаем новый танковый проект и модернизируем армию в этом направлении, чтобы бронетехника могла вести наши войска вперёд."
 CHI_uplift_the_tanks:0 "Усилить танковые войска"
 CHI_uplift_the_tanks_desc:0 "Мы усилим танковые войска, будем тщательнее отбирать бойцов и тем самым значительно повысим их боевую эффективность."
 CHI_industrial_investment2:0 "Инвестиции в промышленность"
 CHI_industrial_investment2_desc:1 "Хотя наши ресурсы ограничены, мы всё же должны направить имеющийся капитал на улучшение экономики."
 CHI_public_education_reform2:0 "Реформа народного образования"
 CHI_public_education_reform2_desc:1 "Основа современного государства — знания и наука. Сначала мы должны улучшить и укрепить эту основу."
 CHI_local_arms_production2:0 "Местное производство вооружений"
 CHI_local_arms_production2_desc:1 "Пока нас считают лишь незначительной второстепенной силой в войне, мы не можем рассчитывать на поставки оружия извне. Нам придётся развивать собственные арсеналы для производства вооружений."
 CHI_long_term_economic_planning2:0 "Долгосрочное экономическое планирование"
 CHI_long_term_economic_planning2_desc:1 "Наш бюрократический аппарат не так велик, как у Центрального правительства. Это позволяет нам устранить значительную часть волокиты, мешающей экономическому развитию, и сосредоточить скромные усилия там, где они принесут наибольшую отдачу."
 CHI_local_arms_development2:0 "Разработка местного вооружения"
 CHI_local_arms_development2_desc:1 "Производства грубых копий иностранного оружия недостаточно. Если мы хотим не отставать от остального Китая, необходимо разрабатывать новые образцы вооружений."
 CHI_heavy_weapons_development2:0 "Разработка тяжёлых вооружений"
 CHI_heavy_weapons_development2_desc:1 "При нехватке ресурсов мы должны максимально эффективно использовать имеющуюся тяжёлую огневую мощь. Следует поручить разработку новых артиллерийских орудий."
 CHI_assemble_the_regency_council:0 "Собрать регентский совет"
 CHI_assemble_the_regency_council_desc:0 "Заручившись необходимой поддержкой, мы соберём регентский совет, чтобы провозгласить военачальника королём. Мы поставим совет перед свершившимся фактом и заставим его согласиться. Да здравствует Император!"
 CHI_a_new_chinese_empire:0 "Новая Китайская империя"
 CHI_a_new_chinese_empire_desc:0 "Мы провозгласим новую Китайскую империю во главе с военачальником-императором! Теперь нас никто не остановит!"
 CHI_staff_the_royal_court:0 "Сформировать императорский двор"
 CHI_staff_the_royal_court_desc:0 "Провозгласив новую империю, мы должны создать достойный императорский двор и назначить туда подходящих людей, которые будут нас поддерживать."
 CHI_royal_splendour:0 "Императорское великолепие"
 CHI_royal_splendour_desc:0 "Сформировав двор, мы окружим Императора ореолом великолепия. Это вдохновит народ трудиться ради нас и поддерживать великого Императора!"
 CHI_denounce_the_roc:0 "Осудить государство [CUG.GetNameDef]"
 CHI_denounce_the_roc_desc:0 "Мы осудим Китайскую Республику и выступим с громкими речами против неё. Благодаря этому наши солдаты сильнее поддержат нас в решающем объединении Империи."
 CHI_state_confutionism:0 "Государственное конфуцианство"
 CHI_state_confutionism_desc:0 "Мы утвердим в Китае государственное конфуцианство и будем последовательно двигаться к этой цели. Это значительно укрепит судьбу Китая."
 CHI_consolidate_imperial_power:0 "Укрепить императорскую власть"
 CHI_consolidate_imperial_power_desc:0 "Утвердив конфуцианство, мы укрепим императорскую власть и заставим его слиться с монархией, создав прочную систему управления страной."
 CHI_crackdown_on_the_kmt:0 "Расправа над Гоминьданом"
 CHI_crackdown_on_the_kmt_desc:0 "Поскольку Гоминьдан продолжает терять влияние, мы начнём масштабные репрессии против него и постараемся искоренить его во всех сферах китайского общества."
 CHI_invest_in_the_royal_army:0 "Инвестировать в императорскую армию"
 CHI_invest_in_the_royal_army_desc:0 "Если наша империя исполнена великолепия, то и армия должна ему соответствовать. Поэтому мы начнём масштабные вложения, чтобы она могла противостоять любой внешней угрозе."
 CHI_entice_british_investments:0 "Привлечь британские инвестиции"
 CHI_entice_british_investments_desc:0 "Поскольку у британцев тоже есть монарх, а их влияние в Китае широко распространено, мы обратимся к ним с просьбой об инвестициях для восстановления нашей слабой экономики."
 CHI_a_modern_economy:0 "Современная экономика"
 CHI_a_modern_economy_desc:0 "Благодаря инвестициям и по прошествии достаточного времени наш регион Китая теперь обладает современной экономикой! Император и правда велик!"
 CHI_a_declaration_from_the_clergy:0 "Декларация духовенства"
 CHI_a_declaration_from_the_clergy_desc:0 "Мы поручим конфуцианским священнослужителям совместно разработать богословское обоснование нашей монархии и объявить нас единственным спасением Китая!"
 CHI_a_final_blow_to_the_kmt:0 "Последний удар по Гоминьдану"
 CHI_a_final_blow_to_the_kmt_desc:0 "Мы нанесём последний удар по Гоминьдану на наших землях и при поддержке духовенства и народа уничтожим все его следы в стране."
 CHI_prepare_to_unite_the_kingdom:0 "Подготовиться к объединению Империи"
 CHI_prepare_to_unite_the_kingdom_desc:0 "Теперь, когда обстановка достаточно улучшилась, мы подготовимся к объединению великой Китайской империи!"
 CHI_cater_to_the_past:0 "Обратиться к прошлому"
 CHI_cater_to_the_past_desc:0 "Чтобы создать достойную альтернативу Гоминьдану, мы обратимся к идеям прошлого. Конфуцианство и монархизм станут спасением Китая!"
 CHI_reempower_religious_ideas:0 "Возродить религиозные идеи"
 CHI_reempower_religious_ideas_desc:0 "Чтобы наш план осуществился, необходимо укрепить поддержку религии, благодаря чему режим сможет удержаться в долгосрочной перспективе."
 CHI_prepare_supply_lines:0 "Подготовить линии снабжения"
 CHI_prepare_supply_lines_desc:0 "Чтобы объединить мусульманский Китай, мы должны подготовить линии снабжения к борьбе с другими кликами."
 CHI_lay_claim_to_muslim_china:0 "Заявить права на мусульманский Китай"
 CHI_lay_claim_to_muslim_china_desc:0 "Укрепив власть над нашим государством, мы объявим себя истинными представителями мусульманского Китая и постараемся объединить его, чтобы по-настоящему возвысить мусульман-хуэй."
 CHI_begin_operations:0 "Начать военные операции"
 CHI_begin_operations_desc:0 "Обозначив наши притязания, мы начнём мобилизацию армии, чтобы выступить против других военачальников и объединить Китай."
 CHI_a_victory_for_islam:0 "Победа ислама"
 CHI_a_victory_for_islam_desc:0 "Мы победили и одержали верх, поэтому объявим это великой победой ислама."
 CHI_alignment_with_the_kmt:0 "Искать сближения с Гоминьданом"
 CHI_alignment_with_the_kmt_desc:0 "Чтобы укрепить власть в Северо-Западном Китае, мы обратимся к Нанкину и Гоминьдану, надеясь обрести сильного покровителя."
 CHI_ultimatum_to_the_warlord:0 "Ультиматум военачальнику"
 CHI_ultimatum_to_the_warlord_desc:0 "Заручившись поддержкой Гоминьдана, мы предъявим военачальнику ультиматум и потребуем, чтобы он следовал исламской традиции и подчинился нашей воле."
 CHI_fire_the_flames_of_islam:0 "Разжечь пламя ислама"
 CHI_fire_the_flames_of_islam_desc:0 "В отличие от остального Китая, мы — исламский народ. Поэтому мы подчеркнём это различие и обеспечим народу хуэй отдельную судьбу."
 CHI_a_religion_of_peace:0 "Религия мира"
 CHI_a_religion_of_peace_desc:0 "Ислам прежде всего является религией мира, поэтому мы ограничимся стремлением создать союз исламских государств Северо-Западного Китая."
 CHI_secure_warlord_support:0 "Заручиться поддержкой военачальника"
 CHI_secure_warlord_support_desc:0 "Мы обратимся к военачальнику и добьёмся его поддержки, чтобы облегчить создание религиозного государства народа хуэй."
 CHI_swap_out_non_hui_nobility:0 "Заменить знать не из народа хуэй"
 CHI_swap_out_non_hui_nobility_desc:0 "Заручившись поддержкой военачальника, мы возьмём государство под контроль, избавимся от знати не из народа хуэй и создадим собственное государство."
 CHI_nationalist_socialist_indoctrination:0 "Национал-социалистическая индоктринация"
 CHI_natiinalist_socialist_indoctrination_desc:0 "Утвердив Два принципа и национальное правительство, мы начнём внушать народу наши идеи, чтобы подготовиться к объединению Отечества!"
 CHI_prepare_for_national_unification:0 "Подготовиться к национальному объединению"
 CHI_prepare_for_national_unification_desc:0 "Теперь, когда народ в достаточной степени усвоил наши идеи, пора готовиться к национальному объединению."
 CHI_foster_a_chinese_volksgemeinschaft:0 "Китайское народное сообщество"
 CHI_foster_a_chinese_volksgemeinschaft_desc:0 "Чтобы сделать страну великой, мы должны создать «народное сообщество» по примеру немцев. Благодаря этому наш народ станет гораздо сплочённее."
 CHI_donations_for_the_national_army:0 "Пожертвования для Национальной армии"
 CHI_donations_for_the_national_army_desc:0 "Национальная армия уже давно находится в упадке. Чтобы исправить положение, мы обратимся за пожертвованиями к китайскому народу и нашему народному сообществу!"
 CHI_donations_for_the_welfare_of_the_people:0 "Пожертвования на благо народа"
 CHI_donations_for_the_welfare_of_the_people_desc:0 "Кроме того, мы попросим народ жертвовать средства на развитие нашей экономики. Так народное сообщество станет сильнее."
 CHI_the_national_unity_government:0 "Правительство национального единства"
 CHI_the_national_unity_government_desc:0 "Теперь, когда лига пришла к власти, мы провозгласим Национальное правительство, чтобы помочь ей достичь своей цели — создать великую Китайскую национальную республику!"
 CHI_minzhu_minsheng:0 "Миньчжу и Миньшэн"
 CHI_minzhu_minsheng_desc:0 "Китайцы верят в три принципа. Однако это ошибочно: принцип демократии является заблуждением и мерзостью. Вместо этого мы сведём их к национализму и социализму и превратим в новую идеологию!"
 CHI_envoy_to_germany:0 "Посланник в Германию"
 CHI_envoy_to_germany_desc:0 "Поскольку мы придерживаемся схожей идеологии национал-социализма, мы отправим посланника в Германию и попросим её перенести поддержку с государства [CHI.GetNameDef] на нас."
 CHI_nationalize_corrupt_buisnesses:0 "Национализировать коррумпированные предприятия"
 CHI_nationalize_corrupt_buisnesses_desc:0 "Мы начнём национализировать коррумпированные предприятия, принадлежащие Гоминьдану и преступникам. Это значительно усилит наше влияние на экономику и позволит решить экономические проблемы."
 CHI_republic_without_democracy:0 "Республика без демократии"
 CHI_republic_without_democracy_desc:0 "Конгресс решил, что мы станем Китайской национальной республикой. Однако, в отличие от других республик, мы не станем вводить демократию, а позволим военачальнику вести нас к победе!"
 CHI_national_regeneration_league_victory:0 "Победа Лиги национального возрождения"
 CHI_national_regeneration_league_victory_desc:0 "Лига национального возрождения одержала победу в Китайской Республике и учредила новую республику!"
 CHI_an_enabling_act:0 "Закон о чрезвычайных полномочиях"
 CHI_an_enabling_act_desc:0 "После прихода Лиги к власти в Республике мы примем закон о чрезвычайных полномочиях и упраздним демократию в соответствии с нашей идеологией. Это значительно повысит эффективность правительства."
 CHI_devolop_a_cult_of_personality:0 "Создать культ личности"
 CHI_devolop_a_cult_of_personality_desc:0 "Чтобы эффективно удерживать власть в регионе и предложить действенную альтернативу Гоминьдану, мы создадим культ личности вокруг военачальника."
 CHI_radicalize_anti_japanese_retoric:0 "Радикализировать антияпонскую риторику"
 CHI_radicalize_anti_japanese_retoric_desc:0 "Чтобы укрепить новое правительство, мы объявим Японию заклятым врагом и усилим эту риторику! Так китайский народ будет гораздо активнее поддерживать нас и наши планы по возвращению Китая!"
 CHI_radicalize_chinese_nationalism:0 "Радикализировать китайский национализм"
 CHI_radicalize_chinese_nationalism_desc:0 "Мы постараемся радикализировать китайский национализм. Так нас будут считать истинным китайским государством, а китайское национальное государство станет великим благодаря нам!"
 CHI_convene_the_national_unity_congress:0 "Созвать Конгресс национального единства"
 CHI_convene_the_national_unity_congress_desc:0 "Распространив влияние по всей нашей клике, мы созовём великий Конгресс, который решит судьбу государства! Поведёт ли военачальник новую республику или позволит провозгласить себя Императором всего китайского народа?"
 CHI_crush_the_farmers:0 "Сокрушить крестьян"
 CHI_crush_the_farmers_desc:0 "Поскольку всё китайское сопротивление выступило против нас, мы установим контроль над сельской местностью и сокрушим восставших крестьян, чтобы армия была готова к будущим операциям. Никто не смеет противиться военачальнику."
 CHI_crush_the_workers:0 "Сокрушить рабочих"
 CHI_crush_the_workers_desc:0 "Мы сокрушим восставших рабочих. После этого против нас останутся лишь члены Гоминьдана, с которыми будет легко разобраться."
 CHI_government_of_national_salvation:0 "Правительство национального спасения"
 CHI_government_of_national_salvation_desc:0 "Мы провозгласим Правительство национального спасения и приготовимся спасти нашу часть Китая от злых чанкайшистов и маоистов!"
 CHI_oust_kmt_troublemakers:0 "Изгнать смутьянов Гоминьдана"
 CHI_oust_kmt_troublemakers_desc:0 "Всё готово: членов Гоминьдана теперь соберут и заставят исчезнуть..."
 CHI_use_anti_chinese_intel_from_japan:0 "Японские разведданные против Китая"
 CHI_use_anti_chinese_intel_From_japan_desc:0 "Теперь, когда началась война, мы попросим Японию предоставить разведданные о Китае, чтобы суметь сдержать его."
 CHI_ramp_up_anti_communist_retoric:0 "Усилить антикоммунистическую риторику"
 CHI_ramp_up_anti_communist_retoric_desc:0 "Чтобы сплотить народ вокруг нас, мы оправдаем поворот к Японии, указывая на ужасы коммунизма и все его преступления! Так главным врагом станут они, а не мы."
 CHI_display_the_cruelty_of_chaing_and_mao:0 "Показать жестокость Чана и Мао"
 CHI_display_the_cruelty_of_chaing_and_mao_desc:0 "Мы начнём рассказывать обо всех зверствах, совершённых Чаном, Мао и их жалкими диктатурами против китайского народа."
 CHI_an_alternative_to_the_two:0 "Альтернатива Гоминьдану и КПК"
 CHI_an_alternative_to_the_two_desc:0 "Теперь, доказав, насколько ужасны Гоминьдан и КПК, мы предложим альтернативу под благожелательным покровительством Японии, чтобы стать истинным государством китайского народа."
 CHI_japanese_money:0 "Японские деньги"
 CHI_japanese_money_desc:0 "Мы запросим у Японии средства для создания полноценной промышленности. Так наше правление станет ещё более процветающим."
 CHI_military_training_in_japan:0 "Военная подготовка в Японии"
 CHI_military_training_in_japan_desc:0 "Теперь, когда здесь находится Квантунская армия, мы можем отправлять новобранцев на обучение в Японию. Это поможет быстро модернизировать нашу армию."
 CHI_japanese_military_support:0 "Японская военная поддержка"
 CHI_japanese_military_support_desc:0 "Получив экономическую поддержку Японии, мы также заручимся её помощью для нашей армии. Так мы сможем сдержать Китай."
 CHI_further_japanese_guns:0 "Запросить дополнительное японское оружие"
 CHI_further_japanese_guns_desc:0 "Чтобы сдержать Китай, нам нужно больше оружия. Мы должны его получить и поэтому попросим Японию предоставить дополнительные поставки."
 CHI_our_own_military_desc:0 "Теперь, когда наша армия модернизирована, пора создать собственные вооружённые силы и постепенно стать самодостаточными."
 CHI_begin_invitation_of_the_kwantung_army:0 "Пригласить Квантунскую армию"
 CHI_begin_invitation_of_the_kwantung_army_desc:0 "Заручившись поддержкой Японии, мы пригласим Квантунскую армию, чтобы эффективнее противостоять китайским захватчикам и создать более крупные вооружённые силы!"
 CHI_seek_japanese_support2:0 "Запрос поддержки у Японии"
 CHI_submit_to_tokyo:0 "Подчиниться Токио"
 CHI_submit_to_tokyo_desc:0 "Мы подчинимся Токио, чтобы обеспечить будущее нашего государства военачальника. Возможно, это даже откроет путь к объединению Китая!"
 CHI_a_japanese_national_government:0 "Японское национальное правительство"
 CHI_a_japanese_national_government_desc:0 "После предательства маньчжуров мы возьмём на себя притязания на Китай под покровительством Японии и подготовимся к созданию нового Национального правительства."
 CHI_consolidate_control_over_china:0 "Укрепить контроль над Китаем"
 CHI_consolidate_control_over_china_desc:0 "Мы начнём укреплять контроль над Китаем и добьёмся, чтобы народ воспринимал нас как его истинное правительство! Китай объединён, и теперь именно мы — его новые спасители!"
 CHI_seek_japanese_support2_desc:0 "С диктатурой хлама и вырожденными маоистами, убивающими детей по всему Китаю, нам нужен альтернативный союзник, и единственный оставшийся - Япония, возможно, мы сможем расправить наши крылья таким образом."
 CHI_reinvest_the_collectivisations:0 "Коллективизация сельского хозяйства"
 CHI_reinvest_the_collectivisations_desc:0 "Мы изъяли значительную собственность у китайской буржуазии и теперь вложим её в местную экономику, чтобы исправить положение и помочь рабочим."
 CHI_our_own_military_industrial_complex:0 "Собственная военная промышленность"
 CHI_our_own_military_industrial_complex_desc:0 "Чтобы когда-либо выстоять против государств [CHI.GetNameDef] или [Jap.GetNameDef], нам прежде всего нужна собственная армия. Для этого необходима собственная военная промышленность. Мы немедленно приступим к делу."
 CHI_an_economy_for_the_proletariat:0 "Экономика для пролетариата"
 CHI_an_economy_for_the_proletariat_desc:0 "Пока наша армия укрепляется, мы должны выполнить обещание перед гражданами и начать вкладываться в экономику для рабочих."
 CHI_empower_the_regional_pla:0 "Усилить региональную НОАК"
 CHI_empower_the_regional_pla_desc:0 "Обеспечив надёжность армии, мы позволим ей взять государство под контроль. Так НОАК сможет гораздо эффективнее помочь нам успешно объединить Китай!"
 CHI_shaping_the_state_in_ones_own_image:0 "Преобразовать государство по собственному образу"
 CHI_shaping_the_state_in_ones_own_image_desc:0 "После прихода военных к власти мы начнём преобразовывать государство по образу военачальника, включая введение личной присяги солдат ему."
 CHI_a_new_peoples_republic:0 "Новая [PRC.GetName]"
 CHI_a_new_peoples_republic_desc:0 "Заручившись личной верностью армии, военачальник решил объявить себя единственным истинным правительством Китая и провозгласить Вторую Народную Республику."
 CHI_troops_for_mao:0 "Отправить добровольцев государству [PRC.GetNameDef]"
 CHI_troops_for_mao_desc:0 "Пока Мао сражается против государства [ROC.GetNameDef], мы отправим ему крупный контингент бойцов для поддержки его борьбы."
 CHI_loyalty_has_its_rewards:0 "Верность вознаграждается"
 CHI_loyalty_has_its_rewards_desc:0 "Мы и наш контингент оказали Мао огромную помощь, а Китай был объединён под властью государства [PRC.GetNameDef]. Теперь мы можем получить награду за свою верность и поддержку Мао."
 CHI_a_great_purge:0 "Оттеснить мятежных офицеров"
 CHI_a_great_purge_desc:0 "После нашего перехода к коммунизму армия восстала. Пора последовать примеру великого Сталина и провести масштабную чистку, окончательно закрепив нашу власть над военными."
 CHI_full_membership_in_the_republic:0 "Полная интеграция в государство [PRC.GetNameDef]"
 CHI_full_membership_in_the_republic_desc:0 "Государство [PRC.GetNameDef] становится всё более единым, и нам тоже пора интегрироваться в него. Так Китай вновь станет единым!"
 CHI_learn_from_the_maoists:0 "Учиться у маоистов"
 CHI_learn_from_the_maoists_desc:0 "У маоистов большой опыт борьбы с государством [CHI.GetNameDef]. Поэтому мы попросим их поделиться этим опытом, чтобы и мы могли эффективно сражаться с ним."
 CHI_join_the_chinese_soviet2:0 "Присоединиться к государству [PRC.GetNameDef]"
 CHI_join_the_chinese_soviet2_desc:0 "Теперь, когда революция в нашей клике обеспечена, пора присоединиться к Мао. Так Китайская Советская Республика сможет вновь обрести величие!"
 CHI_public_works2:0 "Общественные работы"
 CHI_public_works2_desc:0 "Теперь, когда наше коммунистическое государство создано, пора приступить к общественным работам. Так народ сможет по-настоящему продемонстрировать свою любовь к Китаю и социализму!"
 CHI_rural_militias2:0 "Сельское ополчение"
 CHI_rural_militias2_desc:0 "Мы разработаем план создания сельского ополчения. Так мы сможем решить проблему нехватки людских ресурсов и использовать безработные массы деревни."
 CHI_labor_reform2:0 "Трудовая реформа"
 CHI_labor_reform2_desc:0 "Мы разработаем масштабный план трудовой реформы, одновременно повысив эффективность рабочей силы и увеличив доступные нам людские ресурсы!"
 CHI_cooperation_with_the_communists2:0 "Поворот к коммунизму"
 CHI_cooperation_with_the_communists2_desc:0 "Военачальник принял коммунистический путь и начал внедрять коммунистические идеалы в своей клике!"
 CHI_land_redistribution2:0 "Перераспределение земли"
 CHI_land_redistribution2_desc:0 "Мы начнём перераспределять землю, отбирая её у коррумпированных богачей и передавая бедным трудящимся Китая! Это значительно поможет стабилизировать экономику, поскольку капитал и труд будут объединены!"
 CHI_ideological_education2:0 "Идеологическое образование"
 CHI_ideological_deucation2_desc:0 "Мы начнём обучать народ коммунистическим идеям. Это поможет значительно ослабить страх и ненависть к нашему правительству!"
 CHI_land_value_tax2:0 "Налог на стоимость земли"
 CHI_land_value_tax2_desc:0 "Теперь мы введём налог на стоимость земли. Так со временем мы сможем должным образом перераспределять богатство, обеспечивая государству устойчивое финансирование и поддержку народа!"
 CHI_communist_administrators2:0 "Коммунистические администраторы"
 CHI_communist_administrators2_desc:0 "Поскольку наша администрация ещё очень молода, возможно, стоит пригласить администраторов из государства [PRC.GetNameDef]. Они помогут нам восстановиться и наладить бесперебойное управление государством."
 CHI_judiciary_reforms2:0 "Судебные реформы"
 CHI_judiciary_reforms2_desc:0 "Мы проведём масштабные судебные реформы. Так мы сможем значительно стабилизировать правительство и создать коммунистическую систему права."
 CHI_the_warlord_stays:0 "Военачальник остаётся"
 CHI_the_warlord_stays_desc:0 "Личные сторонники военачальника сформировали партию и победили на выборах!"
 CHI_province_work_force_conscription:0 "Трудовая повинность в провинциях"
 CHI_province_work_force_conscription_desc:0 "Если наша экономика должна оправиться от времён военачальников, следует разрешить федеральным провинциям привлекать рабочих по трудовой повинности. Так они смогут вносить вклад в экономику, а мы сократим чрезмерные государственные расходы."
 CHI_work_out_provincial_workforce_regulations:0 "Разработать провинциальные трудовые нормы"
 CHI_work_out_provincial_workforce_regulations_desc:0 "Теперь, когда экономика восстанавливается, мы можем ввести трудовые нормы. Так мы защитим население, пока решаем экономические проблемы."
 CHI_provide_funds_for_local_infrastructure:0 "Выделить средства на местную инфраструктуру"
 CHI_provide_funds_for_local_infrastructure_desc:0 "Мы используем средства, полученные благодаря новой рабочей силе, для масштабного улучшения местной инфраструктуры. Это значительно повысит качество жизни и экономический потенциал."
 CHI_begin_local_industrialisation:0 "Начать местную индустриализацию"
 CHI_begin_local_industrialisation_desc:0 "Теперь, когда инфраструктура создана, мы используем наши средства для расширения экономического потенциала и начала индустриализации."
 CHI_enforce_local_military_budgets:0 "Установить местные военные бюджеты"
 CHI_enforce_local_military_budgets_desc:0 "Мы также заставим федеральные земли начать вкладывать средства в армию. Только так можно обеспечить достаточное финансирование и создать средства для отражения внешнего нападения."
 CHI_oust_KMT_influence:0 "Устранить влияние Гоминьдана"
 CHI_oust_KMT_influence_desc:0 "Вместо отказа от собственной государственности мы устраним остатки влияния Гоминьдана и обеспечим себе возможность следовать собственной судьбе! Слава клике!"
 CHI_opposition2:0 "Оппозиция"
 CHI_opposition2_desc:0 "И чанкайшисты, и маоисты — ужасные люди, совершившие тяжкие преступления против китайского народа! Мы объявим себя оппозицией и тем и другим!"
 CHI_an_alternative_to_the_KMT:0 "Альтернатива Гоминьдану"
 CHI_an_alternative_to_the_KMT_desc:0 "Чтобы действительно представлять китайский народ, мы не можем подчиниться Японии. Вместо этого мы подготовимся стать альтернативой Гоминьдану, не впадая при этом в крайности Мао!"
 CHI_a_true_chinese_republic:0 "Истинная Китайская Республика"
 CHI_a_true_chinese_republic_desc:0 "Чанкайшисты обещают демократию, но устанавливают диктатуру. Мы поступим наоборот и немедленно начнём преобразовывать нашу клику в демократическое государство, достойное доверия народа."
 CHI_question_of_the_system:0 "Вопрос государственного строя"
 CHI_question_of_the_system_desc:0 "Готовясь к выборам, мы должны создать систему, по которой будет действовать государство."
 CHI_party_founding_act:0 "Закон об учреждении партий"
 CHI_party_founding_act_desc:0 "Чтобы проводить выборы, мы должны разрешить создание различных партий. Для этого мы примем «Закон об учреждении партий»."
 CHI_anti_KMT_propaganda:0 "Антигоминьдановская пропаганда"
 CHI_anti_KMT_propaganda_desc:0 "Гоминьдан вмешивается в наши дела и незаконно держит многих наших людей в своей власти. Мы должны начать пропаганду против него, чтобы предотвратить переход населения и армии на его сторону!"
 CHI_question_of_the_constitution:0 "Вопрос конституции"
 CHI_question_of_the_constitution_desc:0 "Выбрав государственный строй, мы должны теперь проработать детали нашей конституции."
 CHI_hold_free_elections:0 "Провести свободные выборы"
 CHI_hold_free_elections_desc:0 "Наконец всё готово! Теперь мы можем провести свободные выборы в нашем небольшом государстве!"
 CHI_federalist_victory:0 "Победа федералистов"
 CHI_federalist_victory_desc:0 "Федералисты и их призыв к региональному суверенитету одержали победу!"
 CHI_empower_the_federal_states:0 "Расширить полномочия федеральных земель"
 CHI_empower_the_federal_states_desc:0 "Теперь, когда федералисты у власти, мы расширим полномочия федеральных земель! Так федерализм сможет по-настоящему процветать, а наши основополагающие принципы будут воплощены!"
 CHI_full_hezhong:0 "Полная система хэчжун"
 CHI_full_hezhong_desc:0 "Теперь, когда федеральные земли получили больше полномочий, мы можем разделить страну на хэчжуны, чтобы федерализм действительно воплотился в жизнь!"
 CHI_beacon_of_federalism_desc:0 "Благодаря процветающей экономике и проводимой федералистской политике мы вправе заявить, что здесь достигнут подлинный федерализм и что мы стали его сияющим маяком!"
 CHI_a_new_federalist_national_government:0 "Новое федералистское национальное правительство"
 CHI_a_new_federalist_national_government_desc:0 "Мы уже добились первых успехов на пути к федерализму и создали штаб-квартиру. Теперь пора по-настоящему выступить против чанкайшистов и маоистов. Для этого мы провозгласим новое национальное правительство и подготовимся к объединению Китая!"
 CHI_an_appeal_for_autonomy:0 "Призыв к автономии"
 CHI_an_appeal_for_autonomy_desc:0 "Похоже, объединить Китай нам не удастся. Вместо этого мы обратимся к Китайской Республике с просьбой стать её автономной федеральной землёй, сохранив федерализм в нашем регионе и на территориях под управлением наших губернаторов."
 CHI_train_everywhere_always:0 "Тренироваться везде и всегда"
 CHI_train_everywhere_always_desc:0 "Обезопасив государство, мы начнём масштабную программу подготовки. Так армия изучит все особенности страны и научится использовать каждый её уголок."
 CHI_make_a_detailed_home_plan:0 "Составить подробный план обороны страны"
 CHI_make_a_detailed_home_plan_desc:0 "Изучив все особенности страны во время учений, мы объединим эти сведения в едином плане. Так каждый наш солдат сможет идеально сражаться повсюду, а не только в нескольких местах, где он проходил подготовку."
 CHI_the_territories_to_free:0 "Территории, подлежащие освобождению"
 CHI_the_territories_to_free_desc:0 "Чтобы вернуть Китаю величие и перенести борьбу на земли врага, мы заявим права на его территории. Так влияние нашей Национально-революционной армии вскоре возрастёт!"
 CHI_begin_the_war:0 "Вступить на территории"
 CHI_begin_the_war_desc:0 "Мы начнём продвижение на наши земли и захватим их внезапным вторжением. Надеемся, этот смелый шаг заставит врага отступить без боя, но в противном случае мы полностью готовы сражаться и взять территории силой."
 CHI_declare_victory_over_the_fiends:0 "Объявить победу над негодяями"
 CHI_declare_victory_over_the_fiends_desc:0 "Теперь, когда наши территории захвачены, а задача выполнена, мы можем объявить полную победу!"
 CHI_a_bulwark_of_defense:0 "Оплот обороны"
 CHI_a_bulwark_of_defense_desc:0 "Мы превратим Клику в непроницаемый оплот обороны, способный защитить Китай и отвоевать земли у выродившихся захватчиков для Славы народа. [CHI.GetName]"
 CHI_a_time_for_integration:0 "Время интеграции"
 CHI_a_time_for_integration_desc:0 "Всё готово, и поскольку военачальник устал управлять этим государством, он уйдёт в отставку и позволит клике полностью интегрироваться в государство [CHI.GetName]."
 CHI_national_defense_state:0 "Государство национальной обороны"
 CHI_national_defense_state_desc:0 "Поскольку война уже на горизонте, мы должны подготовиться к ней как можно лучше. Мы сделаем всё возможное для мобилизации и не позволим Китаю пасть!"
 CHI_chinese_defense_industry:0 "[ROOT.GetAdjective] оборонная промышленность"
 CHI_chinese_defense_industry_desc:0 "Чтобы когда-либо сыграть свою роль в обороне Китая, мы должны развивать собственную оборонную промышленность. Так мы сможем сдержать захватчиков и спасти нашу великую нацию!"
 CHI_Coalition_with_the_KMT:0 "Коалиция с Гоминьданом"
 CHI_Coalition_with_the_KMT_desc:0 "Поскольку Гоминьдан контролирует большую часть Китая, именно его мы и поддержим. Мы обратимся к нему и предложим стать лояльной кликой при условии, что нам позволят сохранить региональное влияние в рамках его национального правительства."
 CHI_technological_cooperation2:0 "Технологическое сотрудничество"
 CHI_technological_cooperation2_desc:0 "Мы попытаемся учиться у армии государства [CHI.GetName]. Так мы быстро модернизируемся и станем полезны Национально-революционной армии."
 CHI_secure_internal_politics2:0 "Обеспечить внутриполитическую стабильность"
 CHI_secure_internal_politics2_desc:0 "Последние годы клика бесцельно плыла по течению, но это должно закончиться, поскольку мировые события ускоряются. Пора клике занять своё место в мире."
 CHI_investments_from_nanjing:0 "Инвестиции из Нанкина"
 CHI_investments_from_nanjing_desc:0 "Став частью государства [CHI.GetNameDef], мы можем попросить его предоставить средства для восстановления нашей разрушенной экономики."
 CHI_national_defense_fund:0 "Фонд национальной обороны"
 CHI_national_defense_fund_desc:0 "Мы создадим Фонд национальной обороны, чтобы обеспечить достаточно средств для содержания сильной армии, способной отражать наших врагов."
 CHI_commander_political_training:0 "Обучить командиров политике"
 CHI_commander_political_training_desc:0 "Если командиры Национально-революционной армии когда-либо возглавят клику, нужно убедиться, что они должным образом подготовлены к управлению государством. Поэтому мы обучим их политике."
 CHI_professionalize_the_army:0 "Профессионализировать армию"
 CHI_professionalize_the_army_desc:0 "Наша армия состоит из непрофессионального сброда. Чтобы она могла когда-либо защитить государство, её необходимо профессионализировать для выполнения этой великой задачи."
 CHI_commence_nra_takeover:0 "Начать захват власти НРА"
 CHI_commence_nra_takeover_desc:0 "Мы начнём передачу власти Национально-революционной армии, полностью осуществив цель стать оплотом обороны государства [CHI.GetNameDef]."
 CHI_unite_the_province:0 "Объединить провинцию"
 CHI_unite_the_province_desc:0 "Наша провинция долгое время оставалась разделённой, однако теперь, усилив Национально-революционную армию, пора нанести удар и объединить великую провинцию Синьцзян в Западном Китае!"
 CHI_request_kmt_protection:0 "Запросить защиту Гоминьдана"
 CHI_request_kmt_protection_desc:0 "В одиночку мы обречены. С одной стороны националисты, с другой коммунисты, а теперь ещё и японцы идут за нами. Чтобы выжить, необходимо выбрать сторону, и единственной силой, готовой сотрудничать с нами, остаётся центральное правительство Гоминьдана."
 CHI_secure_kmt_funds:0 "Получить средства от Гоминьдана"
 CHI_secure_kmt_funds_desc:0 "Поскольку мы находимся под его влиянием, ему будет несложно одолжить нам небольшую сумму денег. Эта стабильная валюта значительно поможет нашей слабой экономике."
 CHI_centralise_authority_around_the_warlord:0 "Сосредоточить власть вокруг военачальника"
 CHI_centralise_authority_around_the_warlord_desc:0 "Военачальник управляет всеми сторонами жизни нашей клики. Чтобы выжить и процветать, он должен сосредоточить власть в своих руках и постепенно привязать народ к себе, а не к правительству в Нанкине."
 CHI_seize_western_assets:0 "Захватить западные активы"
 CHI_seize_western_assets_desc:0 "Многие иностранные державы владеют крупными активами в нашей стране, захваченными по мере ослабления центрального правительства. Сейчас идеальный момент вернуть их и направить эти средства на нужды граждан и задачи военачальника."
 CHI_denounce_the_japanese_empire:0 "Осудить Японскую империю"
 CHI_denounce_the_japanese_empire_desc:0 "Японцы — проклятие всех китайских народов и уже значительно расширили своё влияние в Северном Китае. Мы должны осудить это, подготовиться к их вторжению и искать любые способы противостоять этим вероломным людям!"
 CHI_seize_japanese_assets:0 "Захватить японские активы"
 CHI_seize_japanese_assets_desc:0 "После введения эмбарго против Японии вполне логично захватить её активы в нашей стране. Так мы окажемся в гораздо лучшем положении для отражения неизбежного вторжения."
 CHI_an_oath_of_loyalty:0 "Клятва верности"
 CHI_an_oath_of_loyalty_desc:0 "Теперь, когда военачальник укрепил свою власть, каждый солдат принесёт присягу лично ему, а не кому-либо ещё. Так бойцы останутся на его стороне в случае возможного китайского вторжения."
 CHI_seize_chinese_assets:0 "Захватить китайские активы"
 CHI_seize_chinese_assets_desc:0 "Добившись верности военачальнику, мы можем избавиться от китайского экономического влияния и расправить собственные крылья. Это позволит увеличить наши доходы."
 CHI_supreme_leader_of_all_china_desc:0 "Объединив Китай под нашей властью, мы достигли решающего момента. [ROOT.GetLeader] будет провозглашён верховным лидером и героем всего китайского народа."
 CHI_bribe_chinese_officials:0 "Подкупить коррумпированных чиновников Гоминьдана"
 CHI_bribe_chinese_officials_desc:0 "Чтобы наше государство процветало, необходимо обеспечить мир с Национальным правительством. Поскольку его чиновники достаточно коррумпированы, мы потратим немного денег и заставим их подписать заявление о ненападении."
 CHI_allow_civillian_pillaging:0 "Разрешить разграбление имущества граждан"
 CHI_allow_civillian_pillaging_desc:0 "Мы позволим армии свободно изымать у граждан оружие и всё необходимое, поскольку для выживания нам нужна сильная армия. Так она сможет частично содержать и оснащать себя самостоятельно."
 CHI_seize_assets_for_the_military:0 "Изъять гражданские активы для армии"
 CHI_seize_assets_for_the_military_desc:0 "Мы начнём захватывать все предприятия, находящиеся в руках гражданских лиц. Благодаря этому армия получит значительно больше возможностей для производства собственного оружия и противодействия внешним угрозам."
 CHI_recruit_the_disenfanchised:0 "Набирать обездоленных граждан"
 CHI_recruit_the_disenfanchised_desc:0 "После недавних действий многие жители лишились прав, и мы позволим набирать их в армию. Это поможет предотвратить крупное восстание и решить проблему нехватки людских ресурсов."
 CHI_a_grand_army_for_the_warlord:0 "Великая армия военачальника"
 CHI_a_grand_army_for_the_warlord_desc:0 "Обеспечив верность армии и приток новобранцев, мы наконец можем сказать, что военачальник располагает собственной великой армией, способной защитить страну от внешних угроз."
 CHI_contacts_in_the_roc:0 "Связи в Китайской Республике"
 CHI_contacts_in_the_roc_desc:0 "Готовясь к продаже наркотиков в Китае, мы должны установить связи по всей стране. К счастью, в Нанкине у нас есть несколько людей, готовых почти на всё ради доли прибыли..."
 CHI_siphon_local_trade:0 "Перенаправить местную торговлю"
 CHI_siphon_local_trade_desc:0 "Чтобы получить первоначальные средства для производства наркотиков, мы перенаправим часть местной торговли в свою пользу и присвоим часть доходов. Так мы соберём достаточно денег, чтобы начать проект по спасению страны от нищеты."
 CHI_begin_drug_production:0 "Начать производство наркотиков"
 CHI_begin_drug_produciton_desc:0 "Получив финансирование, мы пойдём на риск и начнём массовое производство наркотиков, несмотря на сопротивление части населения. Так мы сможем решить экономические проблемы."
 CHI_mass_drug_export:0 "Массовый экспорт наркотиков"
 CHI_mass_drug_export_desc:0 "С производимыми лекарствами мы начнем экспортировать их за счет китайского народа. Скоро на нас будут большие богатства!"
 CHI_a_concerted_effort_to_the_japanese_sphere:0 "Расширить торговлю на север"
 CHI_a_concerted_effort_to_the_japanese_sphere_desc:0 "Хотя мы и торгуем наркотиками, мораль нам не чужда. Мы постараемся нанести этой торговлей как можно больший ущерб великому врагу — Японии, чтобы и ей пришлось столкнуться с вызванными проблемами. Так наш народ не будет предан."
 CHI_proliferate_the_chinese_drug_trade:0 "Расширить китайскую торговлю наркотиками"
 CHI_proliferate_the_chinese_drug_trade_desc:0 "Торговля наркотиками в Китае процветает, и мы удвоим усилия. Доходы слишком велики, чтобы от них отказываться, поэтому на время отложим национализм в сторону..."
 CHI_maintain_the_status_quo:0 "Сохранить статус-кво"
 CHI_maintain_the_status_quo_desc:0 "Пока влияние военачальника постепенно растёт, вступать в Национальное правительство невыгодно, но столь же невыгодно и воевать с ним. Вместо этого мы будем играть на обе стороны и получать прибыль."
 CHI_a_coalition_gov_for_national_survival:0 "Коалиционное правительство ради национального выживания"
 CHI_a_coalition_gov_for_national_survival_desc:0 "Когда Япония стоит у нашего порога, мы вынуждены искать союзников. Поэтому мы обратимся к Гоминьдану, разделяющему часть наших идеологических принципов. Интересным побочным эффектом станет возможность распространять влияние в Китайской Республике."
 CHI_collapse_the_coalition:0 "Развалить коалицию"
 CHI_collapse_the_coalition_desc:0 "Теперь, когда мы спасли Китай, пора использовать наши ячейки в государстве [CHI.GetNameDef], попытаться развалить его и захватить власть, вновь разжёгши гражданскую войну в Китае."
 CHI_a_government_for_all_china:0 "Правительство всего Китая"
 CHI_a_government_for_all_china_desc:0 "Свершилось. Мы наконец стали настоящим китайским правительством!"
 CHI_march_on_the_cliques:0 "Поход на клики"
 CHI_march_on_the_cliques_desc:0 "Китай слишком долго оставался раздробленным. Те, кто до сих пор не присоединился к нам, должны погибнуть! Мы уничтожим оставшихся военачальников за их дерзость!"
 CHI_march_on_nanjing:0 "Поход на Нанкин"
 CHI_march_on_nanjing_desc:0 "Нанкин слишком долго возглавлял угнетение Китая, и теперь мы наконец отомстим! Мы начнём национальную революцию и вновь объединим Китай!"
 CHI_prepare_to_kick_out_the_japanese:0 "Изгнать японцев"
 CHI_prepare_to_kick_out_the_japanese_desc:0 "Воссоединив собственно Китай, мы двинемся на Маньчжурию и освободим страну от ужасов японской оккупации!"
 CHI_the_great_restoration:0 "Великое восстановление"
 CHI_the_great_restoration_desc:0 "Мы сделали это! Теперь мы — единственные законные правители Китая! Поэтому начнём интеграцию и восстановление нашей великой новой нации!"
 CHI_autonomy_for_the_fractured_states:0 "Автономия раздробленным государствам"
 CHI_autonomy_for_the_fractured_states_desc:0 "Поскольку значительная часть Китая находится под властью военачальников, мы предложим им признать наше правительство. Мы не только единственные законные правители, но и обещаем, что в качестве федеральных земель они сохранят полную автономию во внутренних делах и смогут действовать по своему усмотрению, пока следуют нашей внешнеполитической линии."
 CHI_an_all_chinese_university:0 "Общекитайский университет"
 CHI_an_all_chinese_university_desc:0 "Объединив Китай, мы откроем новый университет, чтобы исправить ущерб, нанесённый китайской науке при Гоминьдане."
 KMT_maintain_military_support:0 "Сохранить поддержку военных"
 KMT_maintain_military_support_desc:0 "Мы сохраним поддержку армии вокруг старой гвардии, гарантируя, что Чан сможет навязать Китаю свою волю ради спасения страны."
 KMT_stack_the_high_command_desc:0 "Мы заполним китайское верховное командование своими сторонниками, обеспечив его полную верность нам независимо от наших действий..."
 KMT_chiangs_word:0 "Слово Чана"
 KMT_chiangs_word_desc:0 "Все должны повиноваться слову Чана! Мы последуем за этим человеком до конца наших дней."
 KMT_the_hardliners:0 "Сторонники жёсткой линии"
 KMT_the_hardliners_desc:0 "Чан и его клика сторонников жёсткой линии внутри Гоминьдана завоевали электорат благодаря популярности генералиссимуса. Похоже, нам всё же не удалось окончательно избавиться от этого человека."
 KMT_both_commander_in_chief_and_president:0 "Главнокомандующий и президент"
 KMT_both_commander_in_chief_and_president_desc:0 "Мы сделаем Чана одновременно главнокомандующим и президентом Китая, предоставив ему власть над ключевыми институтами государства на случай, если с парламентом что-нибудь случится..."
 KMT_back_with_a_veangance:0 "Вернуться с местью"
 KMT_back_with_a_veangance_desc:0 "Чан вернулся и жаждет мести. Хотя партия отстранила его от положения диктатора, похоже, возвращение к нему неизбежно..."
 KMT_the_nanjing_incident:0 "Нанкинский инцидент"
 KMT_the_nanjing_incident_desc:0 "Мы инсценируем инцидент в районе Нанкина, что позволит нам провести чрезвычайные меры, установить полный контроль над государством и обойти законодательные ограничения..."
 KMT_dissolve_the_provisional_yuans:0 "Распустить Юани"
 KMT_dissolve_the_provisional_yuans_desc:0 "Теперь, когда временная законодательная ветвь уже создана, мы избавимся от этих оков! Под предлогом нашего «кризиса» мы распустим её и добьёмся, чтобы она собралась вновь лишь в день принятия закона о чрезвычайных полномочиях."
 KMT_the_enabling_act:0 "Закон о чрезвычайных полномочиях"
 KMT_the_enabling_act_desc:0 "Мы введём в действие закон о чрезвычайных полномочиях, обеспечив себе постоянный контроль над государством и уничтожение демократии — по крайней мере на время. Это даст нам всё необходимое, чтобы разобраться с вероломными людьми, похитившими нашу власть."
 KMT_declare_martial_law_demo:0 "Объявить военное положение"
 KMT_declare_martial_law_demo_desc:0 "Сосредоточив в своих руках единоличное управление государством, мы объявим военное положение, что позволит использовать армию в гражданских делах и делать всё, что пожелаем."
 KMT_vanquish_democratic_institutions:0 "Уничтожить демократические институты"
 KMT_vanquish_democratic_institutions_desc:0 "Мы уничтожим демократию в Китае и обеспечим её окончательное поражение. Пока армия на нашей стороне, никто не сможет нас остановить."
 KMT_rely_on_military_supremacy:0 "Опереться на военное превосходство"
 KMT_rely_on_military_supremacy_desc:0 "Мы будем опираться на армию, чтобы никто не смог свергнуть нас. Мятеж недопустим."
 KMT_use_the_military:0 "Использовать армию"
 KMT_use_the_military_desc:0 "Поскольку армия находится в наших руках, мы разместим её во всех крупных китайских городах, чтобы следить за врагами и отслеживать тех, кто похитил нашу власть."
 KMT_military_oath_of_loyalty:0 "Военная присяга на верность"
 KMT_military_oath_of_loyalty_desc:0 "Прежде чем начинать великие операции, мы должны потребовать от армии присяги лично Чану. Это обеспечит её послушание при любых обстоятельствах."
 KMT_patrol_the_streets:0 "Патрулировать улицы"
 KMT_patrol_the_streets_desc:0 "Мы начнём открыто патрулировать улицы, ещё сильнее вовлекая армию в гражданские, а не военные дела. Это позволит расставить последние фигуры и подготовиться к массовым арестам тех, кто вынудил нас действовать."
 KMT_mass_arrests_of_opposition:0 "Массовые аресты оппозиции"
 KMT_mass_arrests_of_opposition_desc:0 "Мы начнём массовые аресты оппозиции силами армии. Некоторые возмущаются, но разве не они сами виноваты, что вообще выступили против нас?"
 KMT_exalt_the_army:0 "Возвеличить армию"
 KMT_exalt_the_army_desc:0 "Готовясь к великой борьбе с законодательной властью, мы возвеличим армию и добьёмся, чтобы она чувствовала себя почитаемой нашим режимом."
 KMT_retake_field_command:0 "Вернуться к полевому командованию"
 KMT_retake_field_command_desc:0 "Теперь Чан наконец лично возглавит новую армию, оставив бюрократическую должность и вновь отправившись сражаться ради Китая."
 KMT_march_out_against_the_legislative:0 "Выступить против законодательной власти"
 KMT_march_out_against_the_legislative_desc:0 "Когда всё будет готово, а первая волна арестов и казней завершится, мы выступим и дадим открытый бой последним оплотам сопротивления. Никто не устоит перед властью Чана."
 KMT_dictatorship_in_all_but_name:0 "Диктатура во всём, кроме названия"
 KMT_dictatorship_in_all_but_name_desc:0 "Теперь Чан стал диктатором во всём, кроме названия. Ясно, что именно он является истинным лицом Китая и никто не способен ему противостоять. Более того, предавшие его люди схвачены или убиты, и теперь он наконец удовлетворён."
 KMT_transfer_powers_to_the_assembly:0 "Передать полномочия Собранию"
 KMT_transfer_powers_to_the_assembly_desc:0 "Поскольку Собрание поддерживает нас, в отличие от некоторых других ветвей власти, мы расширим его полномочия. Это позволит создать мощный блок против оппозиции и добиться возмездия."
 KMT_secure_new_political_allies:0 "Заручиться новыми политическими союзниками"
 KMT_secure_new_political_allies_desc:0 "Мы заручимся поддержкой новых политических союзников — тех немногих законодателей, которые поддерживают Чана. Они станут основой наших будущих планов."
 KMT_stack_the_legislative:0 "Заполнить законодательную власть сторонниками"
 KMT_stack_the_legislative_desc:0 "Если мы когда-нибудь отменим закон о чрезвычайных полномочиях, прежде следует использовать новых союзников, чтобы заполнить законодательную ветвь власти своими сторонниками. Тогда после отмены закона мы сможем управлять через неё."
 KMT_civilian_oath_of_loyalty:0 "Гражданская присяга на верность"
 KMT_civilian_oath_of_loyalty_desc:0 "Чтобы сохранить силу после отмены закона, мы должны потребовать от всех действующих государственных служащих присяги Чану. Тогда предательство воли этого человека официально станет государственной изменой."
 KMT_the_nanjing_investigation_committee:0 "Нанкинская следственная комиссия"
 KMT_the_nanjing_investigation_committee_desc:0 "Мы создадим новую комиссию для «расследования» событий в Нанкине. Это позволит подставить ненавистных нам людей и тех, кто предал Чана."
 KMT_frame_the_traitor:0 "Подставить предателей"
 KMT_frame_the_traitor_desc:0 "После первых «результатов» Нанкинской следственной комиссии стало ясно, что теперь мы наконец можем арестовать всех, кто вынудил Чана уступить власть. Пора исправить эту великую несправедливость и навсегда отомстить за него."
 KMT_a_pure_state:0 "Чистое государство"
 KMT_a_pure_state_desc:0 "Заполнив правительство своими людьми и наказав предателей, мы создали чистое государство. Теперь Чан может контролировать всё сверху донизу, продолжая формально соблюдать бюрократические нормы."
 KMT_democracy_in_name_only:0 "Демократия только по названию"
 KMT_democracy_in_name_only_desc:0 "Теперь мы отменим закон о чрезвычайных полномочиях, придав правительству легитимность в глазах народа. Однако реформы последних месяцев гарантируют, что Чан всегда будет править, а достоверной оппозиции ему никогда не появится. Внешне это будет демократия, но на деле — чанкайшистская диктатура."
 CHI_a_great_unitary_china:0 "Великий унитарный Китай"
 CHI_a_great_unitary_china_desc:0 "Объединив Китай под нашим сапогом, мы наконец можем привести его к настоящему золотому веку."
 CHI_there_is_only_one_language_chaing_speaks:0 "Чан понимает лишь один язык"
 CHI_there_is_only_one_language_chaing_speaks_desc:0 "Мы увидели методы Чана, и стало ясно, что он понимает лишь один язык — язык насилия! Поэтому мы должны сражаться с ним и силой спасти от него страну!"
 CHI_demand_repealing_of_the_unequal_treaties:0 "Потребовать отмены неравноправных договоров"
 CHI_demand_repealing_of_the_unequal_treateis_desc:0 "Объединив Китай, мы потребуем последнего шага к полному уничтожению неравноправных договоров. Союзники должны вернуть захваченные у нас договорные порты!"
 CHI_integrate_the_warlords_desc:0 "Объединив Китай, пора предъявить военачальникам ультиматумы: сдаться и интегрироваться либо погибнуть, пытаясь сопротивляться объединению."
 CHI_a_constitutional_monarchy:0 "Конституционная монархия"
 CHI_a_constitutional_monarchy_desc:0 "Мы введём конституционную монархию, объединив лучшие стороны монархии с прочной демократией."
 CHI_consolidate_the_national_unity_government:0 "Укрепить Правительство национального единства"
 CHI_consolidate_the_national_unity_government_desc:0 "Сумев объединить разные центры власти, мы теперь укрепим режим под руководством великого военачальника национал-социализма."
 CHI_demand_transferance_of_national_power:0 "Потребовать передачи национальной власти"
 CHI_demand_transferance_of_national_power_desc:0 "Мы потребуем, чтобы государство [CUG.GetNameDef] подчинилось нашему режиму, стало одним из наших губернаторств и передало нам статус истинного правительства Китая."
 CHI_maintain_the_harsh_stance:0 "Сохраняйте суровый стой"
 CHI_maintain_the_harsh_stance_desc:0 "Мы сохраним жёсткую позицию в отношении коммунизма и осудим государство [PRC.GetNameDef], несмотря на временный союз."
 CHI_limited_cooperation:0 "Ограниченное сотрудничество"
 CHI_limited_cooperation_desc:0 "Мы начнём ограниченное сотрудничество с государством [PRC.GetNameDef]. Возможно, это противоречит нашей идеологии, но мы делаем это ради Китая!"
 CHI_maintain_chinese_infighting:0 "Сохранить междоусобицу в Китае"
 CHI_maintain_chinese_infighting_desc:0 "Мы позволим междоусобной борьбе и дальше бушевать по всему Китаю. Пусть мы и союзники, это не помешает нам брать всё, чего мы желаем."
 CHI_mobilize_against_japan:0 "Мобилизоваться против государства [JAP.GetNameDef]"
 CHI_mobilize_against_japan_desc:0 "С началом Войны сопротивления мы мобилизуем армию, подготовимся к борьбе с иностранным захватчиком и спасём страну!"
 CHI_adopt_chinese_tactics:0 "Перенять китайскую структуру командования"
 CHI_adopt_chinese_tactics_desc:0 "Мы перенимем китайскую структуру командования в армии. Так мы станем гораздо эффективнее в борьбе с японцами!"
 CHI_infiltrate_chinese_command_structure:0 "Проникнуть в китайскую структуру командования"
 CHI_infiltrate_chinese_command_structure_desc:0 "Мы внедримся в китайскую структуру командования. Когда Единый фронт наконец распадётся, это даст нам огромное преимущество!"
 CHI_allow_communist_cells:0 "Разрешить коммунистические ячейки"
 CHI_allow_communist_cells_desc:0 "Мы позволим коммунистам создавать ячейки в нашей стране. Так мы укрепим способность бороться с внешним врагом!"
 CHI_preempt_corruption:0 "Предотвратить коррупцию"
 CHI_preempt_corruption_desc:0 "Поскольку коррупция широко распространилась в Китае, мы предотвратим её проникновение в нашу образцовую провинцию. Это позволит нам стать по-настоящему современным государством."
 CHI_demand_workplace_integrity:0 "Потребовать добросовестности на рабочих местах"
 CHI_demand_workplace_integrity_desc:0 "Мы потребуем от нашего народа добросовестности на работе и введём новые меры для достижения этой цели!"
 CHI_an_integritable_workforce:0 "Добросовестная рабочая сила"
 CHI_an_integritable_workforce_desc:0 "Теперь, когда коррупция наконец искоренена, стало ясно, что наша провинция располагает добросовестной рабочей силой, готовой по-настоящему проявить себя!"
 CHI_embrace_corruption:0 "Принять коррупцию"
 CHI_embrace_corruption_desc:0 "Мы примем коррупцию в нашем государстве, что позволит воспользоваться её плодами и в полной мере задействовать нашу экономику."
 CHI_dabble_in_the_opium_trade:0 "Попробовать себя в торговле опиумом"
 CHI_dabble_in_the_opium_trade_desc:0 "Теперь мы попробуем заняться торговлей опиумом, ведь, несмотря на её пагубное влияние на наш народ, здесь можно заработать миллионы!"
 CHI_fully_embrace_the_opium_trade:0 "Полностью принять торговлю опиумом"
 CHI_fully_embrace_the_opium_trade_desc:0 "Теперь, когда рынок создан, мы можем полностью принять торговлю опиумом и стать по-настоящему богатым правительством, способным на огромные расходы!"
 KMT_a_second_purge_of_leftists:0 "Вторая чистка левых"
 KMT_a_second_purge_of_leftists_desc:0 "Теперь, когда левые получили возможность беспрепятственно действовать в нашей партии, мы должны с ними разобраться. Коммунизму не место в нашей великой стране!"
 CHI_total_mobilization_for_the_emporer:0 "Тотальная мобилизация ради Императора"
 CHI_total_mobilization_for_the_emporer_desc:0 "Когда на кону стоит сам Китай, мы полностью мобилизуем страну, чтобы гарантировать выживание и Китая, и Императора! Никто не может быть выше великого Императора, а всякий, кто попытается, должен погибнуть!"
 CHI_reach_out_to_nanjing:0 "Обратиться к Нанкину"
 CHI_reach_out_to_nanjing_desc:0 "Мы обратимся к Нанкину и предложим присоединиться к расположенному там правительству Гоминьдана при условии, что нам сохранят региональную автономию и разрешат деятельность левого крыла Гоминьдана в Китае."
 CHI_western_victory:0 "Победа западников"
 CHI_western_victory_desc:0 "Мы сделали это — выборы выиграны! Теперь пора создать по-настоящему процветающее государство для нашего народа и перестроить его по образцу западных держав!"
 CHI_christian_democracy_desc:0 "Мы будем распространять христианство на наших землях и стремиться к созданию государства, которое обеспечит своему народу наилучшее будущее благодаря христианскому управлению и морали."
 CHI_modernize_the_armed_forces:0 "Модернизировать вооружённые силы"
 CHI_modernize_the_armed_forces_desc:0 "Мы займёмся модернизацией вооружённых сил и создадим по-настоящему современную армию по образцу западных стран."
 CHI_modern_innovations:0 "Современные нововведения"
 CHI_modern_innovations_desc:0 "Мы внедрим современные нововведения в высшее военное командование и обеспечим его высокую эффективность."
 CHI_economic_mobilization:0 "Экономическая мобилизация"
 CHI_economic_mobilization_desc:0 "Теперь, когда наша армия модернизирована, пора мобилизовать экономику и приступить к созданию великой военной экономики."
 CHI_a_modern_national_army:0 "Современная национальная армия"
 CHI_a_modern_national_army_desc:0 "Объединив Китай, мы ужесточим требования и откажемся от избыточного призыва, вместо этого повышая качество войск благодаря тщательному отбору."
 CHI_begin_the_quest_for_developental_aid:0 "Начать поиски помощи в развитии"
 CHI_begin_the_quest_for_developental_aid_desc:0 "Чтобы исправить нашу экономику, мы начнём добиваться помощи в развитии как внутри страны, так и за её пределами, чтобы создать процветающую экономику для нашего бедного народа."
 CHI_core_tenants_of_the_faith:0 "Основные догматы веры"
 CHI_core_tenants_of_the_faith_desc:0 "Чтобы остановить ересь, мы будем придерживаться основных догматов веры. Мы закрепим Никео-Цареградский символ веры."
 CHI_a_god_honorig_legal_code:0 "Богоугодный свод законов"
 CHI_a_god_honorig_legal_code_desc:0 "Мы создадим свод законов, основанный на библейских принципах, чтобы построить справедливое и благочестивое общество ради улучшения и духовного очищения нашего народа."
 CHI_state_funding_for_religious_schools:0 "Государственное финансирование религиозных школ"
 CHI_state_funding_for_religious_schools_desc:0 "Мы начнём оказывать юридическую поддержку религиозным школам и финансировать их, ведь если мы хотим обучать детей нашим убеждениям и передавать им веру, они должны получать образование высочайшего уровня как в науках, так и в религии."
 CHI_reach_out_to_the_local_elites:0 "Обратиться к местным элитам"
 CHI_reach_out_to_the_local_elites_desc:0 "Мы обратимся к местным элитам и убедим их инвестировать в наше новое государство ради увеличения собственной прибыли в долгосрочной перспективе, тем самым улучшив положение капитализма в стране."
 CHI_stabilze_the_economy:0 "Стабилизировать экономику"
 CHI_stabilze_the_economy_desc:0 "Мы уже получили достаточно быстрых инвестиций; теперь пора стабилизировать экономику и обеспечить её долгосрочную конкурентоспособность."
 CHI_import_western_technology:0 "Импортировать западные технологии"
 CHI_import_western_technology_desc:0 "Мы начнём импортировать западные технологии. Так мы сможем конкурировать с современными экономиками всего мира благодаря продукции высокого качества."
 CHI_abandon_china:0 "Отказаться от Китая"
 CHI_abandon_china_desc:0 "Мы постараемся отвернуться от Китая и пойти собственным путём, поддерживая местных исламистов и сепаратистов!"
 CHI_expand_regional_identity:0 "Расширить сепаратизм"
 CHI_expand_regional_identity_desc:0 "Мы начнём сотрудничать с местными сепаратистами, поощрять их и формировать новую региональную идентичность, которая позволит нам обрести независимость."
 CHI_begin_the_desinofication_of_root:0 "Начать декитаизацию государства [ROOT.GetNameDef]"
 CHI_begin_the_desinofication_of_root_desc:0 "Мы начнём создавать новое государство, очищая его от китайского влияния и обеспечивая освобождение от китайского господства."
 CHI_meet_with_the_army:0 "Встретиться с армией"
 CHI_meet_with_the_army_desc:0 "Мы встретимся с армией и постараемся привлечь её на сторону сепаратизма, чтобы она помогла нам в нашей великой борьбе!"
 CHI_a_declaration_of_statehood:0 "Декларация государственности"
 CHI_a_declaration_of_statehood_desc:0 "Мы провозгласим собственную государственность и изменим название страны, чтобы оно отражало нашу новую сепаратистскую идентичность!"
 CHI_reinvigorate_the_national_economy:0 "Возродить национальную экономику"
 CHI_reinvigorate_the_national_economy_desc:0 "Мы займёмся возрождением национальной экономики и обеспечим процветание, создав великую и богатую экономику!"
 CHI_prepare_for_national_unification2:0 "Подготовиться к национальному объединению"
 CHI_prepare_for_national_unification2_desc:0 "Мы начнём подготовку к объединению Восточного Туркестана и уничтожим лживую клику военачальников, которая нам сопротивляется!"
 CHI_break_the_kmt_stranglehold:0 "Сломить хватку Гоминьдана"
 CHI_break_the_kmt_stranglehold_desc:0 "Мы будем трудиться днём и ночью, чтобы сломить хватку Гоминьдана над нашей армией. Чанкайшисты должны быть вычищены, а Китай — освобождён!"
 CHI_arrest_kmt_officials:0 "Арестовать чиновников Гоминьдана"
 CHI_arrest_kmt_officials_desc:0 "Мы арестуем чиновников Гоминьдана и не допустим дальнейшего дестабилизирующего влияния партии на государственный аппарат. Тогда наша клика вскоре освободится от китайского вмешательства!"
 CHI_arrest_kmt_officers:0 "Арестовать офицеров Гоминьдана"
 CHI_arrest_kmt_officers_desc:0 "Мы арестуем всех офицеров Гоминьдана в нашей армии. Хотя это временно ослабит нас, зато сломит хватку партии над вооружёнными силами!"
 CHI_a_new_alternative_form_of_nationalism:0 "Новая, альтернативная форма национализма"
 CHI_a_new_alternative_form_of_nationalism_desc:0 "Мы устраним из сознания народа представление о том, что все мы являемся частью великой китайской нации. Вместо этого предложим альтернативу — региональную нацию, которую люди смогут считать своей и превозносить как новое Отечество."
 CHI_a_cleansing_of_the_new_state:0 "Искоренить влияние Гоминьдана"
 CHI_a_cleansing_of_the_new_state_desc:0 "Мы полностью очистим государство от последних следов Гоминьдана. Национальное государство должно быть защищено!"
 CHI_enshrine_the_national_savior:0 "Утвердить культ национального спасителя"
 CHI_enshrine_the_national_savior_desc:0 "Теперь, когда государство наконец справилось со стоящими перед ним проблемами, пора возвеличить национального спасителя и закрепить его власть в нашем великом новом государстве!"
 CHI_british_money:0 "Британские деньги"
 CHI_british_money_desc:0 "Британцы являются ключевой силой в нашем регионе, поэтому мы обратимся к ним и запросим экономическую помощь для нашей вестернизации."
 CHI_french_money:0 "Французские деньги"
 CHI_french_money_desc:0 "Французы являются ключевой силой в нашем регионе, поэтому мы обратимся к ним и запросим экономическую помощь для нашей вестернизации."
 CHI_american_money:0 "Американские деньги"
 CHI_american_money_desc:0 "Американцы являются ключевой силой в нашем регионе, поэтому мы обратимся к ним и запросим экономическую помощь для нашей вестернизации."
 CHI_secular_institutions:0 "Светские институты"
 CHI_secular_institutions_desc:0 "Мы создадим светские институты по образцу других западных государств, чтобы стать образцовым государством по их примеру."
 CHI_empower_the_capitalists:0 "Расширить полномочия капиталистов"
 CHI_empower_the_capitalists_desc:0 "Мы расширим полномочия капиталистов в нашей стране и будем сотрудничать с ними, чтобы полностью задействовать экономику и создать процветающий, богатый регион!"
 CHI_rewrite_the_constitiution:0 "Либеральная конституция"
 CHI_rewrite_the_constitiution_desc:0 "Мы перепишем конституцию, включив в неё как либеральные западные идеи, так и либеральную экономическую политику. Пусть это и вызовет недоумение, но так будет лучше для нации!"
 CHI_unbridled_capitalism:0 "Необузданный капитализм"
 CHI_unbridled_capitalism_desc:0 "Мы будем работать над освобождением капитализма от ограничений и сосредоточимся на максимальном увеличении экономической отдачи нашей великой нации, чтобы по-настоящему разбогатеть. Пусть некоторые рабочие и почувствуют себя эксплуатируемыми — это ради общего блага."
 CHI_further_increase_resource_output:0 "Ещё больше увеличить добычу ресурсов"
 CHI_further_increase_resource_output2:0 "Мы продолжим увеличивать добычу ресурсов, даже ценой благополучия нашего народа. В конце концов, кто не разбивает несколько яиц ради гораздо более великой цели?"
 CHI_a_new_republic:0 "Новая республика"
 CHI_a_new_republic_desc:0 "Мы провозгласим новую, полностью независимую республику и подготовимся вернуть Китай, создав великое и свободное государство!"
 CHI_lobby_for_western_recognition:0 "Добиваться признания на Западе"
 CHI_lobby_for_western_recognition_desc:0 "Мы обратимся к западным державам и постараемся добиться признания нашей республики, чтобы обезопасить себя от внешнего нападения!"
 CHI_seek_recognition_from_the_occident:0 "Добиваться признания у стран Запада"
 CHI_seek_recognition_from_the_occident_desc:0 "После создания новой христианской республики мы обратимся к старым христианским союзникам на Западе и попросим помощи у местных христианских государств!"
 CHI_one_china_two_systems:0 "Один Китай — две системы"
 CHI_one_china_two_systems_desc:0 "Мы обратимся к государству [CUG.GetNameDef] и попросим его отказаться от притязаний на нас. Взамен мы будем мирно сосуществовать."
 CHI_help_the_cim:0 "Помочь Внутренней китайской миссии"
 CHI_help_the_cim_desc:0 "Мы начнём сотрудничать с Внутренней китайской миссией и поддержим её массовую евангелизацию, чтобы наша страна и народ услышали благую весть Евангелия!"
 CHI_lkmt_victory:0 "Победа левого Гоминьдана"
 CHI_lkmt_victory_desc:0 "Несмотря на изгнание из Китайской Республики, левое крыло Гоминьдана возродилось и победило на выборах."
 CHI_strengthen_the_radicals:0 "Усилить радикалов"
 CHI_strengthen_the_radicals_desc:0 "После успешного прихода к власти мы начнём сотрудничать с радикалами Гоминьдана, чтобы освободиться от влияния Нанкина."
 CHI_hoist_the_red_flag:0 "Поднять красное знамя"
 CHI_hoist_the_red_flag_desc:0 "Поскольку радикалы обретают всё больше влияния в партии, мы позволим им действовать ещё свободнее, чтобы не поставить под угрозу нашу великую коалицию!"
 CHI_empower_party_democracy:0 "Укрепить внутрипартийную демократию"
 CHI_empower_party_democracy_desc:0 "Мы укрепим демократические институты внутри партии, чтобы она действительно соответствовала трём народным принципам!"
 CHI_strengthen_the_conservatives:0 "Усилить консерваторов"
 CHI_strengthen_the_conservatives_desc:0 "Чтобы Гоминьдан действительно стал массовым движением, мы начнём сотрудничать с консерваторами, даже если некоторые из них сохраняют верность Нанкину."
 CHI_empower_the_military:0 "Расширить полномочия военных"
 CHI_empower_the_military_desc:0 "Мы укрепим Национально-революционную армию, чтобы она могла лучше защищать Великий Китай от иностранных захватчиков — японцев, Советов или британцев!"
 CHI_the_second_thrid_congress_of_the_kmt:0 "Второй §RТретий съезд Гоминьдана§!"
 CHI_the_second_thrid_congress_of_the_kmt_desc:0 "После нашей чистки не проводилось ни одного законного съезда Гоминьдана. Поэтому теперь мы созовём настоящий Третий съезд, объявим себя единственными законными преемниками Сунь Ятсена и истинными наследниками национальной революции Гоминьдана!"
 CHI_open_domestic_politics:0 "Открыть внутреннюю политику"
 CHI_open_domestic_politics_desc:0 "Обезопасив новое государство, мы откроем внутреннюю политику, чтобы оно формировалось в соответствии с волей нашего народа!"
 CHI_a_turkestani_national_state:0 "Туркестанское национальное государство"
 CHI_a_turkestani_national_state_desc:0 "Мы постараемся объединиться с нашими западными братьями в государстве [SOV.GetNameDef], чтобы создать великое Туркестанское национальное государство!"
 CHI_seize_the_colonial_possessions:0 "Захватить колониальные владения"
