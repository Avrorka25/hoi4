 KMT_the_young_china:0 "Молодой Китай"
 KMT_the_young_china2:0 "Молодой Китай"
 KMT_the_young_china3:0 "Молодой Китай"
 KMT_siphon_school_funds:0 "Перенаправить средства школ"
 KMT_levy_taxes_on_the_upper_middle_class:0 "Обложить налогами высший класс"
 KMT_pro_education_propaganda:0 "Пропаганда в поддержку образования"
 KMT_pro_buisness_propaganda:0 "Пропаганда в поддержку бизнеса"
 KMT_the_national_catastrophe:0 "Национальная катастрофа"
 KMT_the_national_catastrophe_desc:0 "Произошло нечто ужасное! Китай подвергся жестокому обращению со стороны иностранцев и сильно пострадал. Мы должны это преодолеть!"
 KMT_deal_with_unrest:0 "Разобраться с беспорядками"
 KMT_deal_with_unrest_desc:0 "Пора разобраться с беспорядками в Китае. Они нанесли нам большой ущерб, и мы должны устранить эту серьёзную угрозу нашему новому режиму."
 KMT_crush_the_radical_nationalists:0 "Разгромить радикальных националистов"
 KMT_crush_the_radical_nationalists_desc:0 "Военные должны сокрушить радикалов, которые выступают против нашего режима. Они должны быть устранены, и Китай должен быть спасен от этих дегенератов."
 KMT_crush_the_nra:0 "Разгромить НРА"
 KMT_crush_the_nra_desc:0 "По всей стране скрываются остатки НРА, сражающиеся с нашими силами. Мы выманим их в открытый бой, разгромим и обезопасим наши войска от нападений."
 KMT_find_chiang_kai_shek:0 "Найти Чан Кайши"
 KMT_find_chiang_kai_shek_desc:0 "Полиция найдёт Чан Кайши и проследит, чтобы он был убит. Это значительно ослабит сопротивление в Китае."
 KMT_ideological_education:0 "Идеологическое воспитание"
 KMT_ideological_education_desc:0 "Реорганизованное правительство начнёт программу идеологического воспитания в Китае, навсегда укрепив нашу власть и сделав режим популярным."
 KMT_strengthen_resource_extraction:0 "Увеличить добычу ресурсов"
 KMT_strengthen_resource_extraction_desc:0 "Наши повелители требуют увеличить добычу ресурсов на наших землях, обеспечив несметные богатства."
 KMT_improve_the_negotiating_position:0 "Улучшить переговорные позиции"
 KMT_improve_the_negotiating_position_desc:0 "Добившись прогресса в улучшении экономики, пора укрепить наши переговорные позиции с повелителями и начать путь к восстановлению суверенитета."
 KMT_china_at_the_mercy_of_our_overlord:0 "Китай во власти нашего повелителя"
 KMT_china_at_the_mercy_of_our_overlord_desc:0 "Мы находимся во власти наших повелителей и постараемся извлечь из этого максимум. Изменить положение мы не можем, так что остаётся быть верными."
 KMT_seek_industrial_investments:0 "Искать промышленные инвестиции"
 KMT_seek_industrial_investments_desc:0 "Поскольку мы безоговорочно верны нашим повелителям, можно попросить их об инвестициях для улучшения плачевного состояния нашей экономики."
 KMT_for_better_or_worse_the_fate_of_china:0 "Судьба Китая — к лучшему или к худшему"
 KMT_for_better_or_worse_the_fate_of_china_desc:0 "Похоже, Китаю суждено быть подчинённым. Мы должны принять это, чтобы восстановиться и двигаться дальше."
 KMT_winning_the_hearts_and_minds_of_the_people:0 "Завоевать сердца и умы"
 KMT_winning_the_hearts_and_minds_of_the_people_desc:0 "Пора завоевать сердца и умы народа Китая. Мы добьёмся того, чтобы именно мы стали для него главным приоритетом."
 KMT_chinese_industry_in_the_shadow_of_the_overlord:0 "Китайская промышленность вне тени повелителя"
 KMT_chinese_industry_in_the_shadow_of_the_overlord_desc:0 "Для восстановления мы должны создать великую китайскую промышленность, стать державой, превосходящей наших повелителей, и, возможно, однажды затмить их."
 KMT_a_beacon_of_ideology_in_the_middle_kingdom:0 "Великий идеологический маяк"
 KMT_a_beacon_of_ideology_in_the_middle_kingdom_desc:0 "Мы превратили Китай в великий идеологический маяк Азии, новый символ идеологии, которую приняли."
 KMT_declare_the_peoples_republic:0 "Провозгласить Народную Республику"
 KMT_declare_the_peoples_repulbic_desc:0 "Теперь мы провозгласим Народную Республику, обеспечив величие коммунизма в будущем."
 KMT_rise_of_the_blueshirts:0 "Возвышение синерубашечников"
 KMT_rise_of_the_bleushirts_desc:0 "Мы добились больших успехов в сотрудничестве с синерубашечниками. Теперь включим их в правительство, чтобы укрепить нашу власть."
 KMT_align_pla_remnants:0 "Привлечь остатки НОАК"
 KMT_align_pla_remnants_desc:0 "Остатки НОАК будут привлечены на нашу сторону, что обеспечит их сотрудничество с режимом в будущем."
 KMT_align_the_blueshirts_puppet:0 "Привлечь синерубашечников"
 KMT_align_the_blueshirts_puppet_desc:0 "Синерубашечники будут привлечены на нашу сторону, что обеспечит значительную поддержку со стороны этих фашистских соратников."
 KMT_victory_over_the_partisans:0 "Победа над партизанами"
 KMT_victory_over_the_partisans_desc:0 "Мы сделали это: партизаны в основном разгромлены. Возможно, однажды Китай станет безопасным..."
 KMT_the_armed_forces_of_the_chinese_state:0 "Вооружённые силы Китайского государства"
 KMT_the_armed_forces_of_the_chinese_state_desc:0 "После разгрома НРА мы реорганизуем вооружённые силы, обеспечив Китаю новый порядок."
 KMT_strengthen_the_high_command:0 "Восстановить высшее командование"
 KMT_strengthen_the_high_command_desc:0 "Армия восстанавливает высшее командование, чтобы мы могли защитить себя."
 KMT_a_vast_army:0 "Огромная армия"
 KMT_a_vast_army_desc:0 "Наши повелители требуют создать огромную армию, способную поставлять им пушечное мясо. Скоро Китай вновь станет полезен."
 KMT_wjw_rule_secured:0 "Власть коллаборациониста укреплена"
 KMT_wjw_rule_secured_desc:0 "Цзинвэй превратил Китай в марионетку и укрепляет свою хватку над страной. Кто знает, что ждёт нас в будущем..."
 KMT_an_auxuliary_army:0 "Вспомогательная армия"
 KMT_an_auxuliary_army_desc:0 "Наши повелители требуют сформировать вспомогательную армию из современных сил специального назначения и танков для выполнения особых задач."
 KMT_ycp_victory:0 "Победа Партии молодой Китая"
 KMT_ycp_victory_desc:0 "Партия молодого Китая одержала великую победу, победив Гоминьдан на выборах и открыв новую эпоху для Китая."
 KMT_strengthen_national_character:0 "Укрепить национальный характер"
 KMT_strengthen_national_character_desc:0 "Национальный характер Китая был подорван Гоминьданом и разрушен иностранными державами, терзавшими нашу страну. Мы должны исправить это ужасное положение."
 KMT_make_china_young_again:0 "Снова сделать Китай молодым"
 KMT_make_china_young_again_desc:0 "Пора вновь сделать Китай молодым, чтобы он смог превзойти европейцев и стать по-настоящему современной развитой страной."
 KMT_strengthen_the_constitution:0 "Укрепить конституцию"
 KMT_strengthen_the_constitution_desc:0 "Добившись многого в демократизации Китая, мы укрепим его конституцию, чтобы стать подлинно современной либеральной демократией."
 KMT_secularize_the_state:0 "Секуляризировать государство"
 KMT_secularize_the_state_desc:0 "Китай должен быть секуляризован и освобождён от пагубного влияния конфуцианцев, тормозящих его развитие."
 KMT_secularization_of_the_state:0 "Секуляризировать государство"
 KMT_secularization_of_the_state_desc:0 "Китай должен быть секуляризован и освобождён от пагубного влияния конфуцианцев, тормозящих его развитие."
 KMT_modernize_the_nation:0 "Модернизировать страну"
 KMT_modernize_the_nation_desc:0 "Необходимо модернизировать страну, чтобы Китай стал капиталистическим раем, способным превзойти все европейские государства."
 KMT_a_china_capable_of_outdoing_europe:0 "Китай превосходит Европу"
 KMT_a_china_capable_of_outdoing_europe_desc:0 "Мы многое сделали для модернизации Китая, и благодаря этому вскоре он превзойдёт европейцев."
 KMT_make_china_one_again:0 "Снова объединить Китай"
 KMT_make_china_one_again_desc:0 "Китай разделён из-за своего прошлого: военные правители, федералисты и другие группировки раскололи страну."
 KMT_expand_reach_of_the_cental_government:0 "Расширить влияние центрального правительства"
 KMT_full_centralization_of_the_state:0 "Полная централизация государства"
 KMT_full_centralization_of_the_state_desc:0 "Теперь Китай будет полностью централизован, а вся власть перейдёт центральному правительству."
 KMT_a_unitary_han_state:0 "Триумф национализма"
 KMT_a_unitary_han_state_desc:0 "Наша политика централизации Китая и превращения его в единую сильную нацию увенчалась великим успехом!"
 KMT_vanquish_the_memory_of_the_seperatists:0 "Искоренить память о сепаратистах"
 KMT_vanquish_the_memory_of_the_seperatists_desc:0 "Центральное правительство искоренит память о сепаратистах и военных правителях. Мы победили их, а теперь уничтожим и их наследие."
 KMT_extol_the_three_principles:0 "Прославлять Три народных принципа"
 KMT_extol_the_three_principles_desc:0 "Наше правительство по-прежнему прославляет Три народных принципа и объединяет народ вокруг этих ключевых идей, сплачивающих весь Китай!"
 KMT_the_success_of_democracy:0 "Успех демократии"
 KMT_the_success_of_democracy_desc:0 "Внедрение демократии в Китае стало великим успехом. Вскоре Китай станет лучшей демократией в мире."
 KMT_the_success_of_peoples_welfare:0 "Успех народного благосостояния"
 KMT_the_success_of_peoples_welfare_desc:0 "Воплощение принципа народного благосостояния принесло нашей стране великое процветание. Насладимся же этим достижением."
 KMT_a_strong_national_character:0 "Сильный национальный характер"
 KMT_a_strong_national_character_desc:0 "Мы сделали это: создали сильный национальный характер Китая и объединили страну победой."
 KMT_expand_loyalist_support:0 "Расширить поддержку лоялистов"
 KMT_expand_loyalist_support_desc:0 "Чтобы выжить, мы должны расширить поддержку наших лоялистов: учителей, предпринимателей и банкиров, союзных режиму."
 KMT_delve_into_factionalism:0 "Углубиться во фракционность"
 KMT_delve_into_factionalism_desc:0 "Фракционность укрепит режим: сотрудничество с лоялистами усилит нашу власть."
 KMT_an_educated_china:0 "Образованный Китай"
 KMT_an_educated_china_desc:0 "Заручившись поддержкой лоялистов, правительство укрепит их власть в режиме."
 KMT_china_open_for_buisness:0 "Китай открыт для бизнеса"
 KMT_china_open_for_buisness_desc:0 "Заручившись поддержкой лоялистов, правительство укрепит их власть в режиме."
 KMT_the_liberation_of_chinese_national_character:0 "Либерализовать национальный характер"
 KMT_the_liberation_of_chinese_national_character_desc:0 "Государство усердно устраняло ущерб, нанесённый китайскому национальному характеру иностранными угнетателями. Китай будет по-настоящему освобождён."
 KMT_expand_reach_of_the_cental_government_desc:0 "Мы завершили расширение влияния центрального правительства, закрепив власть над всеми военными правителями и прочими регионалистами."
 KMT_a_bigger_stronger_chiang:0 "Более великий и сильный Чан"
 KMT_a_bigger_stronger_chiang_desc:0 "Дай — всего лишь более крупная и сильная версия Чана: со всеми его достоинствами и без слабостей старика."
 KMT_build_a_cult_of_personality:0 "Спаситель Китая"
 KMT_build_a_cult_of_personality_desc:0 "Дай спас Китай от сторонников Чана, и потому его следует почитать в новой роли. Да здравствует диктатор!"
 KMT_showcase_lis_prowess:0 "Продемонстрировать доблесть Дая"
 KMT_showcase_lis_prowess_desc:0 "Доблесть Дая должна быть признана, доказав, что он во всём лучше Чана."
 KMT_showcase_chiangs_degeneracy:0 "Дегенерация Чанга / Chiang's Degeneracy"
 KMT_showcase_chiangs_degeneracy_desc:0 "Преступления Чанга должны быть продемонстрированы, в рамках подготовки к его убийству, покупая верность нашего народа."
 KMT_the_fate_of_all_his_cronies:0 "Судьба всех его приспешников"
 KMT_the_fate_of_all_his_cronies_desc:0 "Чан уже наказан, но его приспешники — ещё нет. Пора исправить это и провести чистку среди них."
 KMT_cosolidate_power_over_the_nation:0 "Укрепить власть над страной"
 KMT_cosolidate_power_over_the_nation_desc:0 "Мы должны укрепить власть над Китаем, разорвав оковы Гоминьдана."
 KMT_hang_chiang_kai_shek:0 "Хан Чан Кай Шек"
 KMT_hang_chiang_kai_shek_desc:0 "Мы наконец-то можем повесить Чан Кай Шека за все, что он сделал с нашими синим футболками. Это должно быть возвращено."
 KMT_purge_the_chiangists:0 "Очистить ряды от сторонников Чана"
 KMT_purge_the_chiangists_desc:0 "Сторонники Чана будут устранены, что позволит нам навсегда обезопасить от них государство."
 KMT_strengthen_lis_power:0 "Укрепить власть Дая"
 KMT_strengthen_lis_power_desc:0 "Пришло время укрепить власть Дая в нашей стране, чтобы никто не мог ему противостоять."
 KMT_asian_bloc:0 "Азиатский блок"
 KMT_asian_bloc_desc:0 "Китай намерен создать новый блок в Азии, чтобы защитить наши интересы и интересы других азиатских стран."
 KMT_claims_for_peace:0 "Претензии в обмен на мир"
 KMT_claims_for_peace_desc:0 "У нас есть территориальные претензии к Советам. Мы потребуем передать эти земли нам в обмен на прочный мир между нашими странами."
 KMT_shared_interests_in_indochina:0 "Общие интересы в Индокитае"
 KMT_shared_interests_in_indochina_desc:0 "Наши дипломаты должны договориться с французами и защитить наши интересы в Индокитае, не вынуждая Францию вступать в войну из-за Вьетнама и его ресурсов."
 KMT_realpolitik:0 "Реальная политика"
 KMT_realpolitik_desc:0 "Наши государственные деятели должны проводить в Китае политику реализма, выбирая наиболее практичные способы расширения без войны."
 KMT_great_commander:0 "Строитель державы"
 KMT_great_commander_desc:0 "Дай доказал, что более чем способен превратить Китай в великую державу, создав новую страну, значительно превосходящую старый Китай вероломного Чана."
 KMT_manchuria_for_economic_rights:0 "Маньчжурия в обмен на экономические права"
 KMT_manchuria_for_economic_rights_desc:0 "Чтобы достичь компромисса, мы позволим японцам сохранить экономические права в Маньчжурии и получим эти земли, не развязывая войну."
 KMT_blueshirts_everywhere_always:0 "Синерубашечники везде и всегда"
 KMT_blueshirts_everywhere_always_desc:0 "Теневое государство проследит, чтобы синерубашечники были везде и всегда, обеспечивая нам полный контроль над Китаем."
 KMT_enforce_membership_for_generals:0 "Обязательное членство для генералов"
 KMT_enforce_membership_for_generals_desc:0 "Наконец пришло время обязать всех генералов вступить в Общество синерубашечников. Это обеспечит их верность."
 KMT_harsh_quotas:0 "Жёсткие нормы"
 KMT_harsh_quotas_desc:0 "Наши агенты установят для китайского народа жёсткие нормы, обеспечив долгосрочное выживание Китая."
 KMT_promote_the_militarists:0 "Продвигать милитаристов"
 KMT_promote_the_militarists_desc:0 "Пришло время продвинуть милитаристов в нашей армии, чтобы установить над ней полный контроль."
 KMT_blueshirts_in_every_group:0 "Синерубашечники в каждой группе"
 KMT_blueshirts_in_every_group_desc:0 "Мы должны обеспечить присутствие синерубашечников в каждой группе, чтобы они удерживали правительство под нашим контролем."
 KMT_ready_the_clases_for_war:0 "Подготовить классы к войне"
 KMT_ready_the_clases_for_war_desc:0 "Классы необходимо подготовить к войне, чтобы Китай был готов, когда придёт время."
 KMT_work_targets:0 "Трудовые нормы"
 KMT_work_targets_desc:0 "Наши агенты установят трудовые нормы для китайского народа, чтобы люди без остатка отдавали себя работе на режим."
 KMT_blueshirts_overseers:0 "Надзиратели-синерубашечники"
 KMT_blueshirts_overseers_desc:0 "Теперь теневое государство наблюдает за китайским народом, следя, чтобы все полностью отдавались своей работе."
 KMT_the_great_flight:0 "Великое бегство"
 KMT_the_great_flight_desc:0 "Произошла великая трагедия... мы были вынуждены бежать с материка, и, похоже, коммунисты одержали победу. Но вскоре мы вернёмся."
 KMT_finalize_asset_evacuation:0 "Завершить эвакуацию имущества"
 KMT_finalize_asset_evacuation_desc:0 "Мы вывезли на Тайвань множество промышленных активов. Теперь мы используем их для развития нашей промышленности."
 KMT_secure_foreign_aid:0 "Заручиться иностранной помощью"
 KMT_secure_foreign_aid_desc:0 "Наши дипломаты добиваются иностранной помощи от дружественных великих держав. Это восстановит нашу промышленность и позволит нам превзойти [CUG.GetNameDef]."
 KMT_save_national_treasure:0 "Спасти национальные сокровища"
 KMT_save_national_treasure_desc:0 "Мы спасли множество национальных сокровищ и теперь покажем их народу и армии, вдохновляя их сражаться и защищать наследие от коммунистических свиней."
 KMT_the_last_bastion:0 "Последний оплот"
 KMT_the_last_bastion_desc:0 "Мы стали последним оплотом истинного китайского правительства. Мы спасём Китай от свиней с материка!"
 KMT_fortify_the_coast:0 "Укрепить побережье"
 KMT_fortify_the_coast_desc:0 "Лишь вопрос времени, когда [CUG.GetNameDef] превзойдёт нас на море, поэтому мы должны укрепить побережье и не позволить нашим островам пасть."
 KMT_protect_the_streight:0 "Защитить пролив"
 KMT_protect_the_streight_desc:0 "Нашим владениям на Хайнане угрожает сухопутное нападение. Необходимо укрепить пролив, чтобы современное китайское оружие не сломило нас."
 KMT_prepare_to_retake_the_homeland:0 "Подготовиться к возвращению родины"
 KMT_prepare_to_retake_the_homeland_desc:0 "Пора готовиться к возвращению родины. Материк будет освобождён от угнетателей, а Гоминьдан вернётся!"
 KMT_plan_the_reconquest:0 "Спланировать отвоевание"
 KMT_plan_the_reconquest_desc:0 "Мы начинаем планировать отвоевание материка. Вскоре наши солдаты добьются окончательной победы благодаря этим тщательным планам. Операция «Надежда» станет грандиозным успехом!"
 KMT_march_forth:0 "Вперёд, в поход"
 KMT_march_forth_desc:0 "Теперь мы идем вперед и возвращаем Родину! Это всего лишь вопрос дней, когда Нанкин и Пекин снова будут свободны."
 KMT_a_glorious_return:0 "Славное возвращение"
 KMT_a_glorious_return_desc:0 "Мы сделали это! Мы славно вернулись! Китай снова свободен!"
 KMT_build_up_cells_in_the_mainland:0 "Создать ячейки на материке"
 KMT_build_up_cells_in_the_mainland_desc:0 "Мы приложим огромные усилия для создания ячеек на материке, сделав его уязвимым для нашего нападения."
 KMT_rebolshevize_the_NRA:0 "Вновь большевизировать НРА"
 KMT_rebolshevize_the_NRA_desc:0 "Необходимо вновь большевизировать НРА, обеспечив её единство и верность Гоминьдану."
 KMT_reconsider_army_doctrine:0 "Пересмотреть армейскую доктрину"
 KMT_reconsider_army_doctrine_desc:0 "Армия должна пересмотреть свою доктрину. У нас больше нет материковых орд, и теперь нам приходится решать совсем иные задачи."
 KMT_porcupine_strategy:0 "Стратегия дикобраза"
 KMT_porcupine_strategy_desc:0 "Мы должны сосредоточиться на защите родины, поэтому наши войска примут стратегию дикобраза, обеспечив постоянную оборону острова."
 KMT_modern_arms:0 "Современное вооружение"
 KMT_modern_arms_desc:0 "Пора сделать ставку на современное вооружение, используя танки и похожие технологии, чтобы превзойти основное правительство Китая, проводить дерзкие наступления и добиваться высокого соотношения потерь."
 KMT_urban_guerilla_warfare:0 "Городская партизанская война"
 KMT_urban_guerilla_warfare_desc:0 "Наш народ обучат искусству партизанской войны, что позволит защищать города при любых обстоятельствах."
 KMT_modernize_technology:0 "Модернизировать технологии"
 KMT_modernize_technology_desc:0 "Мы должны модернизировать технологии, чтобы в долгосрочной перспективе превзойти основное правительство и обеспечить окончательную победу."
 KMT_tanks_good_both_here_and_there:0 "Танки хороши и здесь, и там"
 KMT_tanks_good_both_here_and_there_desc:0 "Танки полезны как на наших островах, так и на материке. Наши войска должны глубже освоить их применение и создать лучшие танки в Азии."
 KMT_well_trained_infantry:0 "Хорошо обученная пехота"
 KMT_an_untakeable_island:0 "Неприступный остров"
 KMT_an_untakeable_island_desc:0 "Армия сделает наши острова неприступными, чтобы государство существовало вечно независимо от судьбы материка."
 KMT_a_modern_tank_army:0 "Современная танковая армия"
 KMT_a_modern_tank_army_desc:0 "Высшее командование обеспечит нас современной танковой армией, которая однажды пересечёт пролив и принесёт Гоминьдану великую победу."
 KMT_skilled_offensive_generals:0 "Умелые наступательные генералы"
 KMT_skilled_offensive_generals_desc:0 "Мы должны позаботиться, чтобы наши генералы были умелыми и способными выигрывать для нас сражения."
 KMT_accept_the_inevitable:0 "Принять неизбежное"
 KMT_accept_the_inevitable_desc:0 "Пришло время принять неизбежное: мы никогда не сможем вернуться на материк. Подготовимся к провозглашению независимости."
 KMT_declare_independence:0 "Провозгласить независимость"
 KMT_declare_independence_desc:0 "Время пришло. Провозгласим независимость, и будь прокляты материковые жители! Да здравствует новый режим!"
 KMT_a_national_congress_through_the_despair:0 "Национальный конгресс вопреки отчаянию"
 KMT_a_national_congress_through_the_despair_desc:0 "Гоминьдан должен провести национальный конгресс вопреки отчаянию. Мы позаботимся, чтобы партия выстояла и сохранила силу в это тяжёлое время."
 KMT_permanent_marshal_law:0 "Постоянное военное положение"
 KMT_permanent_marshal_law_desc:0 "Обезопасив государство, Чан объявляет военное положение. Китай перейдёт под постоянный контроль генералиссимуса. Инакомыслие не потерпят."
 KMT_lift_the_veil:0 "Приподнять завесу"
 KMT_lift_the_veil_desc:0 "Пришло время снять завесу военного положения в нашей стране. Мы должны добиться окончательной победы трёх народных принципов!"
 KMT_educate_the_people:0 "Просвещать народ"
 KMT_educate_the_people_desc:0 "Китайский народ необходимо обучать, знакомя его с современными знаниями и помогая людям осваивать науку."
 KMT_restart_the_white_terror:0 "Возобновить Белый террор"
 KMT_restart_the_white_terror_desc:0 "Пришло время возобновить Белый террор и укрепить власть генералиссимуса. Сепаратисты и коммунисты будут раздавлены!"
 KMT_seek_revenge_for_the_feb28_incident:0 "Отомстить за события 28 февраля"
 KMT_seek_revenge_for_the_feb28_incident_desc:0 "Чан требует отмщения за наших людей, на которых напали сепаратисты и коммунисты после возвращения острова. Такая дерзость не останется безнаказанной."
 KMT_purge_communists:0 "Устранить коммунистов"
 KMT_purge_communists_desc:0 "Устранение коммунистов на острове имеет высший приоритет. Они всего лишь предатели нации, и от них необходимо избавиться."
 KMT_deal_with_the_locals:0 "Разобраться с местными"
 KMT_deal_with_the_locals_desc:0 "Наши войска разберутся с местными, стремящимися свергнуть нас. Сепаратизм не потерпят!"
 KMT_punish_anti_state_activities:0 "Наказывать за антигосударственную деятельность"
 KMT_punish_anti_state_activities_desc:0 "Любая деятельность против государства будет наказана, что позволит навсегда обезопасить наш режим."
 KMT_deal_with_taiwanese_seperatists:0 "Разобраться с тайваньскими сепаратистами"
 KMT_deal_with_taiwanese_seperatists_desc:0 "Если мы хотим выжить в долгосрочной перспективе, с сепаратистами необходимо покончить навсегда. Мы уничтожим их..."
 KMT_consolidate_KMT_rule:0 "Укрепить власть Гоминьдана"
 KMT_consolidate_KMT_rule_desc:0 "Чан должен укрепить власть Гоминьдана, обеспечив нашу безопасность и стабильность режима."
 KMT_hail_the_national_savior:0 "Слава спасителю нации"
 KMT_hail_the_national_savior_desc:0 "Все приветствуют национального Спасителя, человека, который привел нас сюда и спас нас! Всем привет, Чан Кай Шек!"
 KMT_form_the_TGC:0 "Сформировать Тайваньское гарнизонное командование"
 KMT_form_the_TGC_desc:0 "Гоминьдан сформирует Тайваньское гарнизонное командование, которое будет выявлять и вынюхивать предателей, чтобы никто не выдал нас коммунистам."
 KMT_limited_opposition:0 "Ограниченная оппозиция"
 KMT_limited_opposition_desc:0 "Ради стабильности мы допустим ограниченную оппозицию в лице партий вроде КДСП. В обмен на поддержку они станут нашими марионетками и будут легитимизировать режим."
 KMT_executive_rule:0 "Исполнительное правление"
 KMT_executive_rule_desc:0 "Мы введём исполнительное правление, которое позволит нам поступать так, как нам заблагорассудится."
 KMT_mass_pervasive_monitoring:0 "Всеобъемлющая массовая слежка"
 KMT_mass_pervasive_monitoring_desc:0 "Тайваньское гарнизонное командование введёт массовую слежку, позволяя нам замечать любое предательство ещё до его совершения. Китай будет в безопасности!"
 KMT_sham_criminal_trials:0 "Показные уголовные процессы"
 KMT_sham_criminal_trials_desc:0 "Тайваньское гарнизонное командование проведёт «суды» над предателями нации, придав нам легитимность и одновременно расправившись с изменниками."
 KMT_suspend_basic_human_rights:0 "Приостановить основные права человека"
 KMT_suspend_basic_human_rights_desc:0 "Тайваньское гарнизонное командование лишит предателей прав: они их не заслуживают, а сами права мешают правосудию! Командование будет действовать твёрдой рукой."
 KMT_imbue_them_in_the_people:0 "Поразить их в народе"
 KMT_imbue_them_in_the_people_desc:0 "Народ должен научиться посвящать жизнь добродетелям, поэтому Чан разворачивает ещё более интенсивную государственную пропаганду."
 KMT_influencing_the_people:0 "Влияние на народ"
 KMT_blue_coup_tt:0 "«Синие рубашки» примут правительство и создадут свое собственное видение Китая."
 KMT_prop_done_tt:0 "Все решения категории §Y«Влияние на народ»§! выполнены"
 KMT_party_bop_tt:0 "Этот эффект будет действовать лишь до завершения фокуса §Y«Укрепить верховенство партии»§!."
 KMT_CKS_bop_tt:0 "Этот эффект будет действовать лишь до завершения фокуса §Y«Объявить военное положение»§!."
 KMT_starting_tt:0 "§2Гоминьдан§! одержал победу в Центральном Китае и стал международно признанным правительством страны, но лишь время покажет, преуспеет ли он или падёт от внутренних либо внешних врагов..."
 KMT_beijing_tt:0 "Должно быть, произошло все следующее: \nThe §8Голубые рубашки§! Был расформирован Чиангом \n§YДай Ли§! Не был умиротворен работой в §YКБИС§!\nThe §8Голубые рубашки§! 30 % популярности \n \n"
 KMT_consolidate_chiangs_control:0 "Укрепить власть Чана"
 KMT_consolidate_chiangs_control_desc:0 "Чан укрепит контроль над Китаем, обеспечив нашей стране светлое и верное будущее."
 KMT_well_trained_infantry_desc:0 "Мы должны тщательно обучать пехоту, чтобы она могла сражаться с превосходящим противником, удерживать позиции и обеспечить наше выживание."
 KMT_secure_mongolia_and_tuva:0 "Обезопасить Монголию и Туву"
 KMT_secure_mongolia_and_tuva_desc:0 "Пришло время отнять Монголию и Туву у Советов, обеспечив целостность нашей новой империи."
 KMT_undo_the_armur_annextion:0 "Отменить аннексию Приамурья"
 KMT_undo_the_armur_annextion_desc:0 "Русские похитили огромные территории наших земель. Наш долг — исправить это и вернуть их."
 KMT_restore_the_tributary_system:0 "Восстановить данническую систему"
 KMT_restore_the_tributary_system_desc:0 "Наше божественное право — восстановить данническую систему и утвердить господство над Азией."
 KMT_the_empire_plan:0 "Имперский план"
 KMT_the_empire_plan_desc:0 "Пришло время приступить к новому плану — созданию великой Китайской империи."
 KMT_demand_manchuria:0 "Потребовать Маньчжурию"
 KMT_demand_manchuria_desc:0 "Мы требуем вернуть Маньчжурию. Нам необходимо получить контроль над всеми землями китайского государства."
 KMT_expand_the_treaty:0 "Расширить договор"
 KMT_expand_the_treaty_desc:0 "Мы расширим наш союз за пределы собственной страны. Это значительно увеличит его влияние."
 KMT_declare_the_empire:0 "Провозгласить империю"
 KMT_declare_the_empire_desc:0 "Наш план увенчался великим успехом, и пришло время провозгласить новую империю. Да здравствует Китай!"
 KMT_hegemony_over_indochina:0 "Гегемония над Индокитаем"
 KMT_hegemony_over_indochina_desc:0 "Дай Ли требует передать нам Индокитай и тем самым закрепить нашу новую имперскую сферу."
 KMT_the_tianmen_square_coup:0 "Пекинский переворот"
 KMT_the_tianmen_square_coup_desc:0 "Мы устроили переворот в Пекине, что позволило нам захватить власть над китайским правительством. Да здравствуют синерубашечники!"
 KMT_brilliant_genius:0 "Хитроумный стратег"
 KMT_brilliant_genius_desc:0 "Устроив переворот и захватив Китай, Дай доказал, что он поистине хитроумный стратег и никто не сможет остановить его восхождение к власти."
 KMT_they_will_know_fear:0 "Наши враги повержены"
 KMT_they_will_know_fear_desc:0 "Мы внушим страх врагам, чтобы ни одна иностранная держава больше не могла нам помешать. Наши танки сокрушат их и уничтожат на поле боя."
 KMT_leader_of_the_nation_and_the_people:0 "Человек из народа"
 KMT_leader_of_the_nation_and_the_people_desc:0 "Дай снова и снова показывал, что он не похож на старую элиту. Он человек из народа, и народ обязан его любить."
 KMT_seize_landholder_assets:0 "Изъять имущество землевладельцев"
 KMT_seize_landholder_assets_desc:0 "Мы изымем имущество землевладельцев и подобных предателей, ещё больше укрепив наш план."
 KMT_bind_the_army_into_the_state:0 "Связать армию с государством"
 KMT_bind_the_army_into_the_state_desc:0 "Именно армия совершила нашу славную революцию! Воздадим ей хвалу за великие свершения во имя страны."
 KMT_choosing_a_new_chairman:0 "Выбор председателя"
 KMT_choosing_a_new_chairman_desc:0 "Наше Временное правительство вновь соберётся, чтобы избрать лидера нового Китая. Хотя Ли Лисань стремится сохранить руководство партией, некоторые сомневаются, что это вообще возможно, учитывая недовольство им со стороны Советского Союза."
 KMT_li_lisan:0 "Председатель Ли"
 KMT_li_lisan_desc:0 "Ли Лисань добился своего! Он, мастер Китайской революции, успешно укрепил свою власть. Да здравствует новый председатель!"
 KMT_chinese_five_year_plan:0 "Китайский пятилетний план"
 KMT_chinese_five_year_plan_desc:0 "Советы добились больших успехов благодаря своему пятилетнему плану. Мы тоже разработаем собственный, чтобы обеспечить наше процветание."
 KMT_consolidate_control_over_industry:0 "Укрепить контроль над промышленностью"
 KMT_consolidate_control_over_industry_desc:0 "Мы укрепим контроль над китайской промышленностью, национализировав значительную её часть во благо нашего народа."
 KMT_support_trade_unions:0 "Поддержать профсоюзы"
 KMT_support_trade_unions_desc:0 "Профсоюзы оказались крайне полезны для нашей революции. Мы отблагодарим их за поддержку, сохранив их независимость."
 KMT_enforce_trade_union_compliance:0 "Обеспечить подчинение профсоюзов"
 KMT_enforce_trade_union_compliance_desc:0 "Хотя профсоюзы до сих пор были весьма полезны для нашей революции, мы должны не допустить, чтобы они угрожали нашему правлению. Необходимо заставить их подчиняться нашей власти."
 KMT_build_up_the_red_army:0 "Укрепить Красную армию"
 KMT_build_up_the_red_army_desc:0 "Наша новая Красная армия пребывает в беспорядке после хаотичной революции. Мы должны что-то с этим сделать. Пришло время вложиться в наши войска и обеспечить их выживание."
 KMT_a_great_purge:0 "Культурная революция"
 KMT_a_great_purge_desc:0 "Наш режим полон врагов — как внутренних, так и внешних. Мы должны быстро с ними расправиться."
 KMT_deal_with_the_beurgeois:0 "Разобраться с буржуазией"
 KMT_deal_with_the_beurgeois_desc:0 "Необходимо разобраться с буржуазными фашистами и капиталистами, которые так долго выступали против нас. Эти предатели рабочего класса погибнут!"
 KMT_consolidate_power_over_the_state:0 "Укрепить власть над государством"
 KMT_consolidate_power_over_the_state_desc:0 "Председатель укрепляет свою власть над государством, обеспечивая поражение оппозиции и упрочивая собственное правление."
 KMT_prepare_to_drive_out_foreign_influence:0 "Подготовиться к изгнанию иностранного влияния"
 KMT_a_new_kmt_thinktank:0 "Новый аналитический центр Гоминьдана"
 KMT_a_new_kmt_thinktank_desc:0 "Мы создадим новый аналитический центр для нашей великой партии, чтобы распространять то, что считаем правильными идеями, и тем самым обеспечить процветание всем, кто следует нашим путём!"
 KMT_increase_military_r_and_d:0 "Расширить военные исследования и разработки"
 KMT_increase_military_r_and_d_desc:0 "Военные требуют расширить исследования и разработки теперь, когда Вэйго здесь и готов возглавить эту работу. Это значительно повысит наши шансы на модернизацию вооружённых сил!"
 KMT_invite_eurofacist_scientists:0 "Пригласить европейских фашистских учёных"
 KMT_invite_eurofacist_scientists_desc:0 "Чтобы улучшить нашу армию, Ли берёт пример с тех, кто вдохновил нашу идеологию, и приглашает нескольких их учёных, чтобы они помогли нам разработать великое новое оружие!"
 KMT_counter_asian_imperialism:0 "Сделать азиатский империализм приоритетом"
 KMT_counter_asian_imperialism_desc:0 "Азия исторически была жертвой империализма со времён падения Цин, но теперь и японцы решили заняться теми же злодеяниями! Их необходимо остановить!"
 KMT_korean_liberation:0 "Потребовать освобождения Кореи"
 KMT_korean_liberation_desc:0 "Мы наконец потребуем освобождения Кореи и избавим этот народ от угнетателей! Корея будет свободна!"
 KMT_cdsp_victory:0 "Победа КДСП"
 KMT_cdsp_victory_desc:0 "Китайская демократическая социалистическая партия одержала великую победу и отстранила Гоминьдан от власти, а Карсун Чан привёл её к этому триумфу."
 KMT_the_foundations_of_chinese_fedralism:0 "Основы китайского федерализма"
 KMT_the_foundations_of_chinese_fedralism_desc:0 "Мы заложим основы китайского федерализма и начнём преобразовывать страну в этом направлении, обеспечив более справедливую и совершенную форму правления."
 KMT_analyze_the_1922_constitution_attempt:0 "Изучить попытку принятия конституции 1922 года"
 KMT_utilize_our_riches:0 "Использовать наши богатства"
 KMT_utilize_our_riches_desc:0 "Наконец мы используем наши богатства для собственного блага, поддерживая множество образовательных учреждений и приближая процветающее будущее!"
 KMT_analyze_the_1922_constitution_attempt_desc:0 "Карсун уже пытался ввести федеративную конституцию в 1922 году. Он вновь обратится к своей прежней работе и использует её для совершенствования нынешнего проекта."
 KMT_prepare_changes_to_the_kmt_constitution:0 "Подготовить изменения в конституцию Гоминьдана"
 KMT_prepare_changes_to_the_kmt_constitution_desc:0 "Карсун подготовит изменения в конституцию, опираясь на попытку 1922 года и другие источники. Когда бумаги будут готовы, парламенту останется лишь одобрить эти поправки."
 KMT_strengthen_larger_minorities:0 "Расширить права крупных меньшинств"
 KMT_strengthen_larger_minorities_desc:0 "Мы приступим к воплощению федералистских принципов и особенно укрепим их там, где меньшинства составляют значительную часть населения, чтобы обращаться с людьми в соответствии с их потребностями."
 KMT_tweak_province_borders:0 "Скорректировать границы провинций"
 KMT_tweak_province_borders_desc:0 "Пришло время скорректировать границы наших провинций, чтобы они лучше соответствовали этническим рубежам, обеспечивая куда более эффективный федерализм и единообразное применение закона."
 KMT_pass_the_changes:0 "Принять поправки"
 KMT_pass_the_changes_desc:0 "Теперь, когда всё готово, мы примем новые поправки к конституции. Федерализм по-настоящему восторжествует в Китае!"
 KMT_break_the_kmt_stranglehold:0 "Ослабить мёртвую хватку Гоминьдана"
 KMT_break_the_kmt_stranglehold_desc:0 "Мы должны разрушить мёртвую хватку Гоминьдана над Китаем и освободить китайский народ от его власти."
 KMT_showcase_chiangs_noncompliance:0 "Обнародовать нарушения Чана"
 KMT_showcase_chiangs_noncompliance_desc:0 "Чан совершил множество поступков, противоречащих нашей собственной конституции. Новый режим расскажет об этом народу и использует эти факты, чтобы дискредитировать Гоминьдан в его глазах."
 KMT_wang_jingweis_rise:0 "Возвышение Ван Цзинвэя"
 KMT_wang_jingweis_rise_desc:0 "После смерти Чана Ван Цзин Вэй должен взять бразды правления государством! Будем надеяться, что он приведет нас к процветанию!"
 KMT_consolidate_the_new_regime:0 "Укрепить новый режим"
 KMT_consolidate_the_new_regime_desc:0 "В Хаосе после смерти Чана мы должны действовать быстро и решительно, обеспечивая Китай нашим новым государством."
 KMT_preempt_the_inevitable:0 "Предвосхитить неизбежное"
 KMT_preempt_the_inevitable_desc:0 "Япония идёт за нами, и Китай никак не сможет победить в такой войне. Мы должны искать сближения и мирного решения."
 KMT_the_taiwan_accords:0 "Тайваньские соглашения"
 KMT_the_taiwan_accords_desc:0 "Поскольку Япония согласилась на переговоры, мы встретимся на Тайване, где Ван предложит сделку: мы получим доступ к японским технологиям для копирования и сможем сократить технологическое отставание, уступив им часть нашей экономики."
 KMT_savior_of_all_china:0 "Спаситель всего Китая"
 KMT_savior_of_all_china_desc:0 "Ван Цзин Вэй стал Спасителем всего Китая и объединил весь его народ. Всем привет Ван Цзин Вэй!"
 KMT_buy_and_sell_japanese:0 "Покупать и продавать японские товары"
 KMT_buy_and_sell_japanese_desc:0 "Нам необходимо покупать и продавать японские товары, чтобы копировать их и таким образом получать доступ к их технологиям. Теперь мы предложим Японии сделку, которая укрепит наш договор и позволит добиться этого."
 KMT_scientist_exchange_programmes:0 "Программы обмена учёными"
 KMT_scientist_exchange_programmes_desc:0 "Мы запустим программы обмена между нашими и японскими учёными за небольшую плату. Это позволит нам быстро копировать их технологии и лучше понимать, насколько успешно мы сокращаем отставание."
 KMT_resources_for_research:0 "Ресурсы в обмен на исследования"
 KMT_resources_for_research_desc:0 "Наши компании предложат Японии выгодную торговую сделку в обмен на часть её исследований. Это позволит нам быстрее догнать и обойти японцев."
 KMT_labor_for_expertise:0 "Рабочая сила в обмен на опыт"
 KMT_labor_for_expertise_desc:0 "Наши центры занятости предложат японцам сделку: наша рабочая сила в обмен на их опыт, что в долгосрочной перспективе поможет укрепить нашу экономику."
 KMT_invite_japanese_investors:0 "Пригласить японских инвесторов"
 KMT_invite_japanese_investors_desc:0 "Приглашение японских инвесторов в Китай принесёт нам большую выгоду и позволит получить от них важнейшие преимущества."
 KMT_the_dragon_swallows_the_sun:0 "Дракон поглощает Солнце"
 KMT_the_dragon_swallows_the_sun_desc:0 "Мы сделали это! Мы обошли Японию, заняли ведущую роль в этих партнёрствах и стали хозяевами Азии."
 KMT_the_path_of_war:0 "Путь войны"
 KMT_the_path_of_war_desc:0 "Обеспечив своё превосходство, Китай может встать на путь войны и попытаться силой изгнать японцев."
 KMT_lands_or_war:0 "Земли или война"
 KMT_lands_or_war_desc:0 "Теперь, когда мы находимся в сильной позиции, мы направим Японии ультиматум и потребуем уйти с наших исконных земель."
 KMT_carte_blanche_in_manchuria:0 "Карт-бланш в Маньчжурии"
 KMT_carte_blanche_in_manchuria_desc:0 "Мы потребуем от японцев признать наши притязания на Маньчжурию и предоставить нам там полную свободу действий, чтобы усмирить режим и объединить Китай."
 KMT_the_masters_of_asia:0 "Хозяева Азии"
 KMT_the_masters_of_asia_desc:0 "Мы и японцы — хозяева Азии. Если мы будем сотрудничать и, возможно, в будущем станем союзниками, никто не сможет нас остановить."
 KMT_manchuria_for_continued_economic_influence:0 "Маньчжурия в обмен на сохранение экономического влияния"
 KMT_manchuria_for_continued_economic_influence_desc:0 "Китай потребует от японцев вернуть нам Маньчжурию в обмен на сохранение за ними части прибыли с этой земли. Это предотвратит войну и обеспечит сотрудничество в будущем."
 KMT_begin_reforming_the_nation:0 "Начать реформирование страны"
 KMT_begin_reforming_the_nation_desc:0 "Наконец мы можем начать реформировать Китай и превращать его в социальный рай, к которому стремится Цзинвэй."
 KMT_align_the_blueshirts:0 "Привлечь синерубашечников"
 KMT_align_the_blueshirts_desc:0 "Цзинвэй решил привлечь синерубашечников, чтобы укрепить режим и получить новую силу, способную помочь нам в случае предательства Японии."
 KMT_purge_suriviving_communists:0 "Уничтожить уцелевших коммунистов"
 KMT_purge_suriviving_communists_desc:0 "Наш долг — уничтожить оставшихся коммунистов и предателей. Китай должен быть очищен от этой мерзости!"
 KMT_the_true_enemies_of_china:0 "Истинные враги Китая"
 KMT_the_true_enemies_of_china_desc:0 "Китай должен разобраться со своими истинными врагами. Не с японцами или другими иностранцами, а с коммунистами, которых необходимо уничтожить ради выживания Китая."
 KMT_china_above_all:0 "Китай превыше всего"
 KMT_china_above_all_desc:0 "Пришло время поставить Китай на первое место и обеспечить наше превосходство над Японией! Китай — номер один и навсегда им останется!"
 KMT_the_path_of_peace:0 "Путь мира"
 KMT_the_path_of_peace_desc:0 "Обеспечив своё превосходство, мы попытаемся твёрдо, но мирно заставить японцев покинуть наши земли, возможно даже открыв путь к будущему сотрудничеству."
 KMT_lands_for_bases:0 "Земли в обмен на базы"
 KMT_lands_for_bases_desc:0 "Государство может предложить японцам сделку: они уйдут с наших земель в обмен на военно-морские базы. Надеемся, нам не придётся прибегать к более убедительным средствам..."
 KMT_sun_yat_sens_true_heir:0 "Истинный наследник Сунь Ятсена"
 KMT_sun_yat_sens_true_heir_desc:0 "Хотя Чан утверждал, что является наследником Сунь Ятсена, это неправда. Ван докажет народу, что истинный наследник — не кто иной, как он сам!"
 KMT_reshuffle_the_courts:0 "Перестроить судебную систему"
 KMT_reshuffle_the_courts_desc:0 "Режим перестроит суды, назначив туда множество нейтральных лиц и членов нашей партии, тем самым разрушив контроль Гоминьдана над этими учреждениями и обеспечив будущее, свободное от его влияния."
 KMT_renew_the_beaurocracy:0 "Обновить бюрократию"
 KMT_renew_the_beaurocracy_desc:0 "Режим займётся обновлением бюрократии и её кадров, устраняя влияние Гоминьдана в государственных учреждениях. Скоро на этих должностях не останется ни одного его сторонника."
 KMT_a_new_establishment:0 "Новый истеблишмент"
 KMT_a_new_establishment_desc:0 "Теперь режим может создать в Китае новый истеблишмент, занять место, которое некогда принадлежало Гоминьдану, и навечно закрепить власть над всеми сторонами китайского государства."
 KMT_true_free_democracy:0 "Подлинно свободная демократия"
 KMT_true_free_democracy_desc:0 "Режим введёт новые меры, чтобы ни одна партия больше никогда не заняла в Китае то же положение, что когда-то Гоминьдан, и не смогла вновь унизить нашу демократическую систему."
 KMT_train_the_idealist_in_politics:0 "Обучить идеалиста политике"
 KMT_train_the_idealist_in_politics_desc:0 "Наши специалисты должны обучить Карсуна Чана политике, чтобы он становился всё более компетентным и смог избавиться от своего нереалистичного идеализма."
 KMT_support_the_common_man:0 "Поддержать простого человека"
 KMT_support_the_common_man_desc:0 "Поддержка простого человека в Китае имеет первостепенное значение. Мы должны обеспечить заботу и помощь обычным людям."
 KMT_a_mixed_economy:0 "Смешанная экономика"
 KMT_a_mixed_economy_desc:0 "Чтобы поддержать простого человека, Китай начнёт переход к смешанной экономике, содействуя предпринимательству и процветанию и позволяя заботиться о людях, даже если у них самих недостаточно средств."
 KMT_social_welfare:0 "Социальное обеспечение"
 KMT_social_welfare_desc:0 "В рамках смешанной экономики государство начнёт проводить политику социального обеспечения. Это позволит нам заботиться о рабочих."
 KMT_public_health:0 "Общественное здравоохранение"
 KMT_public_health_desc:0 "В рамках нашей социальной программы государство обеспечит общедоступное здравоохранение, чтобы бедняки и рабочие могли сохранять здоровье, что в долгосрочной перспективе принесёт пользу экономике."
 KMT_social_security:0 "Социальная защита"
 KMT_social_security_desc:0 "Государство должно усилить социальную защиту, чтобы рабочие, потерявшие работу из-за стремительной индустриализации, всё равно могли прокормить свои семьи."
 KMT_reducing_income_equality:0 "Сократить неравенство доходов"
 KMT_reducing_income_equality_desc:0 "Мы сделали это! Теперь государство по-настоящему заботится о народе, а различия между богатыми и бедными уже не столь велики. Похоже, неравенство доходов наконец удалось сократить до приемлемого уровня."
 KMT_socialize_the_railways:0 "Национализировать железные дороги"
 KMT_socialize_the_railways_desc:0 "Пришло время национализировать железные дороги по всему Китаю, чтобы люди могли дешёво и эффективно перемещаться из одного места в другое."
 KMT_socialize_the_mines:0 "Национализировать шахты"
 KMT_socialize_the_mines_desc:0 "Пришло время национализировать шахты, чтобы получать от них прибыль и обеспечить справедливую оплату труда их рабочих."
 KMT_equal_rights_for_all:0 "Равные права для всех"
 KMT_equal_rights_for_all_desc:0 "Мы обеспечим равные права для всех — мужчин, женщин и детей. Только так будет по-настоящему справедливо."
 KMT_a_victory_for_liberalism:0 "Победа либерализма"
 KMT_a_victory_for_liberalism_desc:0 "Наша победа на выборах стала великим успехом и позволила принести либерализм в Китай! Да здравствуют эти перемены, несущие нам благо!"
 KMT_distribute_key_roles:0 "Распределить ключевые должности"
 KMT_distribute_key_roles_desc:0 "Поскольку Карсун, похоже, слишком некомпетентен, чтобы по-настоящему руководить страной, мы должны действовать решительно ради выживания партии и передать его полномочия партии в целом."
 KMT_organizer_of_the_party:0 "Организатор партии"
 KMT_organizer_of_the_party_desc:0 "Необходимо помочь Карсуну стать настоящим организатором партии и великим лидером. Ему недостаёт совсем немногого, чтобы превратиться в выдающегося руководителя."
 KMT_support_individual_liberties:0 "Поддержать личные свободы"
 KMT_support_individual_liberties_desc:0 "Чан поддерживает свободу каждого простого человека и стремится обеспечить полное соблюдение прав личности."
 KMT_freedom_from_corruption:0 "Свобода от коррупции"
 KMT_freedom_from_corruption_desc:0 "Чтобы Китай добился успеха, мы должны очистить страну от коррупции Гоминьдана и обрести свободу."
 KMT_a_state_for_the_people:0 "Государство для народа"
 KMT_a_state_for_the_people_desc:0 "Мы превратили Китай в страну для простого человека, позволив нашему народу стать по-настоящему великими людьми, способными вести за собой и формировать нашу демократию."
 KMT_the_duty_to_vote:0 "Обязанность голосовать"
 KMT_the_duty_to_vote_desc:0 "Очевидно, что голосование — обязанность народа. Люди должны понимать, что права налагают определённые обязанности и что их необходимо исполнять."
 KMT_fight_the_aristocracy:0 "Бороться с аристократией"
 KMT_fight_the_aristocracy_desc:0 "Государство будет бороться со старой аристократией и поддерживать крестьян, показывая, кто более праведен и достоин называться истинным китайцем."
 KMT_the_chinese_bill_of_rights:0 "Китайский билль о правах"
 KMT_the_chinese_bill_of_rights_desc:0 "Пришло время принять в Китае новый билль о правах по образцу американской системы. Он по-настоящему закрепит наши свободы и обеспечит благо народа."
 KMT_make_use_of_his_education:0 "Использовать его образование"
 KMT_make_use_of_his_education_desc:0 "Необходимо подчеркнуть образование Карсуна и использовать его как преимущество, чтобы он занял особое место в глазах народа."
 KMT_the_return_of_taiwan:0 "Возвращение Тайваня"
 KMT_the_return_of_taiwan_desc:0 "Мы должны потребовать возвращения Тайваня, воссоединить наш народ и вернуть то, чего нас лишил японский империализм."
 KMT_reassert_the_mongolian_claim:0 "Вновь заявить права на Монголию"
 KMT_reassert_the_mongolian_claim_desc:0 "Пришло время вновь заявить наши права на Монголию и наконец вернуть законную китайскую землю из рук коммунистических угнетателей!"
 KMT_anti_soviet_isolation_tactics:0 "Тактика изоляции Советского Союза"
 KMT_anti_soviet_isolation_tactics_desc:0 "Мы сделаем всё возможное, чтобы изолировать Советы от их союзников на востоке и сделать их уязвимыми для нападения с нашей стороны или со стороны Японии."
 KMT_indochinese_liberation:0 "Потребовать свободы Индокитая"
 KMT_indochinese_liberation_desc:0 "Мы потребуем от французов покинуть земли Индокитая, чтобы там могло родиться свободное индокитайское государство!"
 KMT_the_son:0 "Сын"
 KMT_the_son_desc:0 "Пришло время вернуть из Европы Чан Вэйго, второго сына Чана! Теперь он послужит отечеству и поможет использовать свои знания, чтобы превратить нашу армию в великую силу!"
 KMT_the_diarchy:0 "Диархия"
 KMT_in_the_shadow_of_chiang_kai_shek:0 "В тени Чан Кай Шека"
 KMT_the_true_enemy_desc:0 "Японцы — болезнь кожи, а коммунистические бандиты — болезнь сердца. Чтобы спасти Китай, мы прежде всего должны очистить его от всех предателей."
 KMT_SHX_offer2_desc:0 "Владения Яня не дают нам военного доступа. Если мы силой заставим его подчиниться, то сможем окружить коммунистов и раздавить их раз и навсегда."
 KMT_preparations_to_fight_the_soviet_imperialists_desc:0 "После почти полного уничтожения во время Великого похода коммунистические бандиты укрываются в районе Шэньси. Мы должны атаковать, прежде чем они успеют оправиться!"
 KMT_strike_PRC2_desc:0 "Бандиты всё ещё восстанавливаются после Великого похода. Мы должны нанести удар, пока они слабы!"
 KMT_ultimatum_to_the_warlords_desc:0 "Теперь, когда мы уничтожили коммунистических бандитов, пришло время военным кликам встретиться с нашим мечом. Они слишком долго грабили народ. Мы должны завершить Национальную революцию!"
 KMT_sinkiang_issue_desc:0 "Синьцзян — неотъемлемая часть Китая, а местный губернатор доказал, что является сепаратистом. Мы требуем его скорого и безоговорочного подчинения; если этот ультиматум не сработает, нашей армии должно хватить, чтобы вынудить его капитулировать."
 KMT_the_foreign_imminent_threat_desc:0 "Хотя коммунисты представляют смертельную угрозу, Япония способна уничтожить всю китайскую нацию. Манчжурией они не удовлетворятся. Однажды они попытаются захватить и остальной Китай. Мы должны сделать всё возможное, чтобы подготовиться к буре."
 KMT_mass_fortifications:0 "Массовое строительство укреплений"
 KMT_mass_fortifications_desc:0 "Японские действия в районе Пекина ясно показывают их намерения. Мы должны укрепить границы. Мы не отдадим им ни пяди священной китайской земли!"
 KMT_coastal_fortifications_desc:0 "Учитывая господство Японии на морях, в случае войны они несомненно предпримут высадки на побережье. Мы должны подготовиться, пока ещё можем. Мы не отдадим Париж Востока без боя!"
 KMT_national_defense_propaganda_desc:0 "Чтобы защититься от японской угрозы, мы должны объединить китайский народ. Хотя мы ненавидим и коммунистических бандитов, и военные клики, каждый мужчина, каждая женщина и каждый ребёнок должны быть готовы вместе сражаться и умереть за Китай."
 KMT_ultimatum_to_tibet_desc:0 "Тибет жизненно важен для обороны Китая и его будущей экспансии. Однако с Революции 1911 года регион не подчиняется китайской власти. Мы должны исправить эту ошибку."
 KMT_befriend_tibet_desc:0 "Тибет жизненно важен для обороны Китая и его будущей экспансии. Однако после Революции 1911 года Тибет обрёл независимость. Мы должны заключить союз с Далай-ламой и обезопасить наши фланги."
 KMT_redraw_the_mcmahon_line_desc:0 "Тибет согласился на позорное Симлское соглашение, которое изменило его границу с Индией. Мы должны добиться пересмотра этой линии в нашу пользу."
 KMT_industrial_effort2:0 "Инвестиции в промышленность"
 KMT_industrial_effort2_desc:0 "Китайская промышленность всегда отставала от западной и японской. Чтобы сохранить независимость, мы должны увеличить промышленное производство. Мы также можем разрешить иностранным компаниям инвестировать в нашу промышленность."
 KMT_refound_the_jiangman_aresenal:0 "Воссоздать Цзяннаньский арсенал"
 KMT_refound_the_jiangman_aresenal_desc:0 "Цзяннаньский арсенал снабжал династию Цин современным вооружением. Нам стоит позаимствовать это название для военно-промышленного комплекса, который станет ядром нашей растущей оружейной промышленности."
 KMT_expand_the_navy:0 "Расширить военно-морской флот"
 KMT_expand_the_navy_desc:0 "Мы давно утратили превосходство на море после поражения в битве при Ялу. Поскольку японский флот угрожает нашей торговле, мы должны попытаться защитить торговые суда в открытом море."
 KMT_the_big_rear_plan:0 "План «Большого тыла»"
 KMT_the_big_rear_plan_desc:0 "Пока война бушует на востоке Китая, запад остаётся сравнительно безопасным. Мы должны развивать эти отсталые районы, чтобы и они могли внести вклад в борьбу Китая."
 KMT_finish_the_big_rear_plan:0 "Завершить план большого тыла"
 KMT_finish_the_big_rear_plan_desc:0 "Чем больше земель мы теряем, тем важнее для нас довести план большого тыла до конца."
 KMT_nationalize_electronics_company:0 "Национализировать электронную компанию"
 KMT_nationalize_electronics_company_desc:0 "Хотя электричество ещё не дошло до сельской местности, наши учёные уже заняты созданием отечественной электроники для рынков Шанхая и Гонконга. Нам следует взять под контроль «Чэнгун» и использовать её для государственных исследований."
 KMT_adopt_gerrman_style_equipment:0 "Принять снаряжение немецкого образца"
 KMT_adopt_gerrman_style_equipment_desc:0 "Хотя нам помогают немецкие советники, такие как фон Фалькенхаузен, и мы импортируем часть немецкого снаряжения, наши местные образцы отличаются ужасным качеством. Использование немецкой техники в качестве шаблонов для производства позволит повысить качество в восемь раз!"
 KMT_lure_them_in_strategy2:0 "Стратегия заманивания врага"
 KMT_lure_them_in_strategy2_desc:0 "Благодаря огромной территории и труднопроходимой местности нашей страны мы можем позволить себе отступать и заманивать захватчиков на выбранные нами поля сражений. Пусть империалисты попробуют нас преследовать! За каждым поворотом их будет ждать засада, а на каждом шагу — ловушка!"
 KMT_airbase_expansion:0 "Расширение авиабаз"
 KMT_airbase_expansion_desc:0 "Нам нужны авиабазы, с которых самолёты смогут взлетать и садиться, иначе они так и останутся музейными экспонатами на складах."
 KMT_national_resources_commission:0 "Национальная комиссия по ресурсам"
 KMT_national_resources_commission2_desc:0 "Национальная комиссия по ресурсам отвечает за разведку и разработку природных богатств Китая. Её создание значительно усилит наши усилия по добыче сырья."
 KMT_national_defense_council2:0 "Совет национальной обороны"
 KMT_national_defense_council2_desc:0 "Японцы и коммунистические бандиты наносят вред нашей стране, и мы должны найти способ организовать оборону против них. Следует также попытаться импортировать современное снаряжение из-за рубежа."
 KMT_expand_the_jiangman_shipyard_group:0 "Расширить группу Цзяннаньских верфей"
 KMT_expand_the_jiangman_shipyard_group_desc:0 "Нам следует расширить судостроительные мощности Цзяннаньского арсенала; это даст нам более сильный флот для противостояния будущим угрозам."
 KMT_revive_the_hanyang_arsenal:0 "Возродить Ханьянский арсенал"
 KMT_revive_the_hanyang_arsenal_desc:0 "Ханьянский арсенал был одним из важнейших и успешнейших оружейных предприятий Движения за самоусиление, начатого цинскими чиновниками. Мы можем восстановить его, чтобы выпускать достойное снаряжение для нашей армии."
 KMT_air_effort:0 "Реорганизовать ВВС Китайской Республики"
 KMT_reorganize_the_ROCAF_desc:0 "Мы всегда пренебрегали военно-воздушными силами. Если мы хотим всерьёз бороться в воздухе, этот род войск необходимо основательно реформировать."
 KMT_the_flying_tigers:0 "Летающие тигры"
 KMT_the_flying_tigers_desc:0 "Осознав справедливость нашего дела, группа американских пилотов добровольно и в полном составе присоединилась к нашим военно-воздушным силам. Мы должны использовать этих хорошо подготовленных людей как элитное ядро новых и возрождённых ВВС."
 KMT_study_foreign_ship2:0 "Изучить иностранные проекты кораблей"
 KMT_study_foreign_ship2_desc:0 "В кораблестроении мы отстаём от других стран. Чтобы однажды создать первоклассный флот, мы должны понять, что делает их корабли превосходными."
 KMT_demand_taiwan2:0 "Потребовать Тайвань"
 KMT_demand_taiwan2_desc:0 "Народ Тайваня должен быть освобождён от нынешнего правителя и возвращён нам. Долго разделённая нация должна объединиться."
 KMT_taiwan_fleet_hub2:0 "Флотский узел на Тайване"
 KMT_taiwan_fleet_hub2_desc:0 "Иностранцы оставили на Тайване обширную инфраструктуру. Мы должны развить эту базу и превратить весь остров в единую военно-морскую базу и производственный центр."
 KMT_break_the_first_island_chain:0 "Прорвать первую островную цепь"
 KMT_break_the_first_island_chain_desc:0 "Чтобы Китай полностью раскрыл свой потенциал, мы не должны довольствоваться лишь этой стороной Тихого океана. Мы должны построить флот, способный пройти дальше Тайваня и Японии."
 KMT_draw_the_nine_dash_line:0 "Провести линию девяти пунктиров"
 KMT_draw_the_nine_dash_line_desc:0 "Через Южно-Китайское море проходят многие важнейшие торговые пути. Если мы заявим права на этот проход, то сможем сделать шаг к господству в Юго-Восточной Азии. Однако нам понадобится флот, способный подкрепить наши претензии и отправить всю враждебную торговлю на дно."
 KMT_naval_equipment2:0 "Военно-морское оснащение"
 KMT_naval_equipment2_desc:0 "Современному флоту требуется современное оснащение."
 KMT_industrial_evacuations:0 "Эвакуация промышленности"
 KMT_industrial_evacuations_desc:0 "Мы эвакуируем промышленность во внутренние районы Китая. Это обезопасит её и не позволит ей попасть в руки иностранцев."
 KMT_break_the_second_island_chain:0 "Прорвать вторую островную цепь"
 KMT_break_the_second_island_chain_desc:0 "Теперь, когда у нас есть флот, способный перенести борьбу за пределы Японии, мы должны построить силы, которые заставят любую тихоокеанскую державу ощутить гнев Китая. Мы заставим Чжэн Хэ гордиться нами."
 KMT_mobilize_the_chinese_volk_in_the_face_of_death:0 "Мобилизация перед лицом смерти"
 KMT_mobilize_the_chinese_volk_in_the_face_of_death_desc:0 "Японцы побеждают, а наш народ гибнет, и мы должны мобилизоваться перед лицом смерти! Мы будем сопротивляться и сражаться до последнего человека!"
 KMT_enforce_the_nine_dash_line:0 "Обеспечить соблюдение линии девяти пунктиров"
 KMT_enforce_the_nine_dash_line_desc:0 "Похоже, одного заявления наших прав на Южно-Китайское море оказалось недостаточно. Мы должны продолжить расширение флота, чтобы силой заставить империалистов признать справедливость нашего дела!"
 KMT_modernize_army2:0 "Модернизировать армию"
 KMT_modernize_army2_desc:0 "Одного духа и мастерства недостаточно для победы в войне. Нам также необходимо современное снаряжение."
 KMT_retake_manchuria:0 "Вернуть Манчжурию"
 KMT_retake_manchuria_desc:0 "Дунбэй, который на Западе называют Манчжурией, всего несколько лет назад пал под властью японцев и их марионеток. Мы должны вернуть его!"
 KMT_fund_the_northeast_development_agency:0 "Основать Агентство развития Северо-Востока"
 KMT_fund_the_northeast_development_agency_desc:0 "Хотя японцы развили отдельные районы Манчжурии, огромные пространства всё ещё остаются нетронутыми. Нам следует начать масштабную программу, чтобы привести эти некогда варварские земли в современный мир."
 KMT_academia_sinica:0 "Академия Синика"
 KMT_academia_sinica_desc:0 "Основанная в 1928 году Академия Синика руководит и координирует научные, общественные и гуманитарные исследования во всех финансируемых государством институтах и университетах Китайской Республики. В отличие от других государственных исследовательских учреждений, Академия Синика подчиняется непосредственно президенту."
 KMT_expand_peking_university:0 "Расширить Пекинский университет"
 KMT_expand_peking_university_desc:0 "Пекинский университет — учреждение мирового класса. Мы должны увеличить его финансирование и предоставить стипендии талантливой молодёжи, чтобы вырастить поколение умелых учёных и руководителей."
 KMT_asylum_for_jews:0 "Убежище для евреев"
 KMT_asylum_for_jews_desc:0 "Многие евреи начали селиться в Шанхае, спасаясь от преследований и смерти в Европе. Мы должны открыть границы для всех еврейских беженцев, чтобы в свою очередь воспользоваться их знаниями. Еврейские инженеры уже принесли нам польские и немецкие проекты вооружений. Чем ещё они смогут помочь своим новым покровителям?"
 KMT_military_science2:0 "Военная наука"
 KMT_military_science_desc:0 "И гражданская, и военная наука жизненно важны для силы государства. Достаточное финансирование исследований сделает нашу армию грознее."
 KMT_the_guandi_rocket_system:0 "Ракетная система «Гуаньди»"
 KMT_the_guandi_rocket_system_desc:0 "Началась эпоха ракетного оружия. Мы должны принять эту новую систему вооружения, если хотим, чтобы наши армии выжили на современном поле боя. Пусть враги почувствуют ярость бога войны!"
 KMT_expand_peking_university2:0 "Образование для нации"
 KMT_expand_peking_university2_desc:0 "Недостаточно допускать в университеты лишь тех, кто достаточно богат, чтобы оплатить обучение. Мы должны национализировать все университеты Китая и принимать студентов по заслугам, а не по богатству."
 KMT_brave_science:0 "Смелая наука"
 KMT_brave_science_desc:0 "Наши учёные страдают комплексом неполноценности, полагая, что никогда не превзойдут Запад, что бы ни делали. Нам нужна пропагандистская программа, чтобы восстановить их боевой дух."
 KMT_nuclear_physics2:0 "Ядерная физика"
 KMT_nuclear_physics2_desc:0 "Если теории Эйнштейна верны, расщепление атома может породить оружие невообразимой мощи. Нам следует глубже изучить эту возможность."
 KMT_the_tianlong_jet_engine:0 "Реактивный двигатель «Тяньлун»"
 KMT_the_tianlong_jet_engine_desc:0 "Развитие реактивных технологий обеспечит нам господство в небе. Дни, когда китайский пехотинец оставался беззащитным перед ударами сверху, наконец закончатся. Наша мощь воспарит, словно дракон в полёте."
 KMT_fighter_focus2:0 "Ставка на истребители"
 KMT_fighter_focus2_desc:0 "Завоевание превосходства в воздухе — наша главная задача в воздушной войне, и именно истребители выполняют её."
 KMT_bomber_focus2:0 "Ставка на бомбардировщики"
 KMT_bomber_focus2_desc:0 "Уничтожение линий снабжения и заводов противника — лучший способ вести воздушную войну. Поэтому нам следует сосредоточиться на бомбардировщиках."
 KMT_cas_effort2:0 "Развитие штурмовой авиации"
 KMT_cas_effort2_desc:0 "Непосредственная авиационная поддержка чрезвычайно полезна для продвижения нашей армии по земле. Эти штурмовики принесут нам победу."
 KMT_nav_effort2:0 "Развитие морской авиации"
 KMT_nav_effort2_desc:0 "Морские бомбардировщики превосходно уничтожают корабли и порты противника; они являются неотъемлемой частью войны на море."
 KMT_saco:0 "SACO"
 KMT_saco_desc:0 "Китайско-американская организация сотрудничества призвана обеспечивать нашу армию разведданными и готовить силы специальных операций."
 KMT_improve_the_burma_road:0 "Улучшить Бирманскую дорогу"
 KMT_improve_the_burma_road_desc:0 "Хотя британцы построили Бирманскую дорогу для поддержки войны против Японии, сама она не слишком эффективна; нам следует её улучшить."
 KMT_industrialization_NW2:0 "Местная индустриализация: Северо-Запад"
 KMT_industrialization_NW2_desc:0 "Северо-Запад пока может казаться бесплодной землёй. Но вскоре он станет одним из наиболее индустриализированных регионов."
 KMT_excavation_NW2:0 "Разработка ресурсов Северо-Запада"
 KMT_excavation_NW2_desc:0 "Чтобы избавиться от зависимости от импорта, мы должны искать на своей земле новые месторождения ресурсов."
 KMT_industrialization_S2:0 "Местная индустриализация: Юг"
 KMT_industrialization_S2_desc:0 "Юг уже может быть одним из самых индустриализированных районов, но его ещё можно значительно развить."
 KMT_excavation_S2:0 "Каучуковые плантации"
 KMT_excavation_S2_desc:0 "Климат юга прекрасно подходит для каучуковых плантаций; мы должны воспользоваться этим."
 KMT_excavation_NE2:0 "Разведка ресурсов Северо-Востока"
 KMT_excavation_NE2_desc:0 "Японцы оставили в регионе множество инструментов; мы можем использовать их для обнаружения новых месторождений."
 KMT_ledo_road2:0 "Дорога Ледо"
 KMT_ledo_road2_desc:0 "Захватчики перерезали Бирманскую дорогу; мы должны построить новый путь снабжения из Индии."
 KMT_dare_to_die_corps2:0 "Корпус смертников"
 KMT_dare_to_die_corps2_desc:0 "Чтобы победить захватчиков, наш народ должен быть достаточно храбр, чтобы не бояться смерти, и быть готовым на всё ради защиты нашей страны."
 KMT_reuse_captured_weaponary2:0 "Повторно использовать трофейное вооружение"
 KMT_reuse_captured_weaponary2_desc:0 "Для ведения длительной войны на истощение жизненно важно максимально эффективно использовать захваченное в боях снаряжение, чтобы поддерживать боеспособность наших армий."
 KMT_prepare_for_the_civil_war:0 "Подготовиться к гражданской войне"
 KMT_prepare_for_the_civil_War_desc:0 "Возникает необходимость готовиться к коммунистам, так как они, возможно, тоже готовятся к нам."
 KMT_ultimatum_to_the_warlords_after_civil_war:0 "Объединить Китай"
 KMT_ultimatum_to_the_warlords_after_civil_war_desc:0 "Теперь, когда коммунистические бандиты уничтожены, настало время военным правителям встретиться с нашим мечом."
 KMT_offer_the_yangtze_partition:0 "Предложить раздел по Янцзы"
 KMT_offer_the_yangtze_partition_desc:0 "Война складывается не в нашу пользу, и мы терпим тяжёлые поражения. Поскольку [PRC.getAdjective] войска не способны прорвать наши оборонительные рубежи вдоль Янцзы, мы можем предложить дипломатическое решение этой мучительной гражданской войны, если готовы выжить и сохранить наши изнурённые войска."
 KMT_taiwan_bastion2:0 "Тайваньский бастион"
 KMT_taiwan_bastion2_desc:0 "Есть вероятность, что мы проиграем эту войну. Чтобы подготовиться к такому исходу, мы должны превратить Тайвань в национальный бастион, где сможем переждать и подготовиться к возвращению материка."
 KMT_collaborate_with_collaborators:0 "Сотрудничать с коллаборационистами"
 KMT_collaborate_with_collaborators_desc:0 "Все бывшие японские марионетки — предатели, и это всем известно. Но после ухода японцев они могут послужить новым хозяевам."
 KMT_harsh_takeover_foc:0 "Захватить ханьцзяней"
 KMT_harsh_takeover_foc_desc:0 "С предателями незачем церемониться. Мы арестуем их всех и передадим их ресурсы в наше распоряжение."
 KMT_develop_taiwan:0 "Развивать Тайвань"
 KMT_develop_taiwan_desc:0 "Японцы уделяли Тайваню много внимания. Поскольку экономическая база Тайваня значительно превосходит остальной Китай, разумно развивать её дальше, чтобы остров стал образцом эффективности нашего управления."
 KMT_integrate_warlord_forces:0 "Интегрировать войска военных правителей"
 KMT_integrate_warlord_forces_desc:0 "Нынешние вооружённые силы состоят из Центральной армии и войск военных правителей. Однако последние не слишком охотно подчиняются нашему командованию. Если нам удастся завоевать их доверие, армия станет эффективнее."
 KMT_focus_on_the_central_army:0 "Сосредоточиться на Центральной армии"
 KMT_focus_on_the_central_army_desc:0 "Недисциплинированные войска военных правителей не заслуживают нашего внимания. Они годятся лишь как пушечное мясо и приманка, пока Центральная армия наносит удар по врагам."
 KMT_increase_sino_german_cooperation2:0 "Расширить китайско-германское сотрудничество"
 KMT_increase_sino_german_cooperation2_desc:0 "Нам следует теснее сотрудничать с Германией. Так мы получим преимущество над нашими врагами."
 KMT_indiscrimatory_conscription_tt:0 "изменять §YОтсутствие поддержки для призыва§! посредством: \n Надежный демографический фактор §G+10%§! \n Армейский фактор атаки §R-5%§! \n Темпы восстановления §R-5%§!"
 KMT_unindiscrimatory_conscription_tt:0 "изменять §YОтсутствие поддержки для призыва§! посредством: \n Надежный демографический фактор §R-10%§! \n Армейский фактор атаки §G+5%§! \n Темпы восстановления §G+5%§!"
 KMT_special_military_pay_tt:0 "изменять §YОтсутствие поддержки для призыва§! посредством: \n Надежный демографический фактор §G+7.5%§! \n Ожидаемое количество заводов, поставленных на потребительские товары §Y+5%§!"
 KMT_unspecial_military_pay_tt:0 "изменять §YОтсутствие поддержки для призыва§! посредством: \n Надежный демографический фактор §R-7.5%§! \n Ожидаемое количество заводов, поставленных на потребительские товары §Y-5%§!"
 KMT_reducing_stuff:0 "Методы призыва уже сокращаются"
 KMT_hunt_draft_dodgers_tt:0 "изменять §YОтсутствие поддержки для призыва§! посредством: \n Надежный демографический фактор §G+7.5%§! \n Стабильность §R-10%§!"
 KMT_unhunt_draft_dodgers_tt:0 "изменять §YОтсутствие поддержки для призыва§! посредством: \n Надежный демографический фактор §R-7.5%§! \n Стабильность §G+10%§!"
 KMT_special_military_pay:0 "Особое военное жалованье"
 KMT_unspecial_military_pay:0 "Сократить особое военное жалованье"
 KMT_hunt_draft_dodgers:0 "Разыскивать уклонистов"
 KMT_unhunt_draft_dodgers:0 "Сократить преследование уклонистов"
 KMT_indiscrimatory_conscription:0 "Неизбирательный призыв"
 KMT_unindiscrimatory_conscription:0 "Сократить неизбирательный призыв"
 KMT_lacking_support_for_conscription:0 "Недостаточная поддержка призыва"
 KMT_lacking_support_for_conscription_desc:0 "Нашему государству не хватает средств для проведения призыва по всей стране. Кроме того, множество препятствий мешает мобилизовать крупную армию, поскольку чрезмерный призыв вызвал бы массовый голод."
 KMT_the_kuomintang_natl_revolution_desc:0 "Национальная революция Гоминьдана заметно приблизилась к своей конечной цели — объединению страны, однако это политически раздробленное движение постепенно застопорилось и стало склонно к внутренней борьбе. Поэтому неясно, сможет ли оно достичь окончательной цели — объединения Китая."
 KMT_corruption_tt:0 "Это усугубит §YКоррупцию§! в §2Гоминьдане§!..."
 KMT_tributary_tooltip_tt:0 "Завершение заставит всех, кто когда-либо вступит во фракцию под вашим руководством, платить дань."
 KMT_unlock_more_focuses_tt:0 "Завершение продвинет судьбу Китая вперёд и откроет новые возможности..."
 KMT_the_long_catchup_game:0 "Долгая гонка вдогонку"
 KMT_tlcg_tt:0 "Открыто больше технологий, чем у Японии"
 KMT_natl_congress_tt:0 "§RСудьба Китая будет решена... Убедитесь, что вы готовы, а поддерживаемая вами сторона укрепила власть в Китае.§!"
 KMT_nlm_fcm_tt:0 "Фокусы §YУничтожить движение за новую жизнь§! и §YВозродить движение за новую жизнь§! являются взаимоисключающими"
 KMT_no_corruption_tt:0 "Завершение этого фокуса, когда [PRC.GetNameDef] Не существует такого, что заставило бы их генералов присоединиться к вам, уничтожив вашу коррумпированную армию."
 KMT_xueliang_tt:0 "Сюэлян — убеждённый сторонник Единого фронта против Японии...\n§tЕсли такая встреча пойдёт не по плану, последствия для Чана могут быть катастрофическими§!"
 KMT_the_son_tt:0 "Создать новый генерал §YЧианг Вэй-Куо§! и разблокировать его теоретика"
 KMT_remove_all_fascism_and_gain_stab:0 "Синерубашечники будут уничтожены, вся постепенная поддержка фашизма исчезнет, стабильность повысится на 20 процентов, а все их бонусы будут удалены"
 KMT_announce_results_tt:0 "§RВы должны объявить результаты выборов в течение 50 дней после завершения этого фокуса, иначе последуют последствия...§!"
 KMT_announce_results_via_button_tt:0 "§YРезультаты выборов§! всё ещё можно объявить через §YНациональные выборы§!"
 KMT_announce_results:0 "Объявить результаты выборов"
 KMT_elecions_in_a_year_tt:0 "§RВы пообещали народу провести выборы в течение года... Он ожидает и требует, чтобы вы выполнили обещание...§!"
 KMT_the_chinese_national_state_focus:0 "Китайское национальное государство"
 KMT_the_chinese_national_state_focus_desc:0 "С нашей победой над выродками и коммунистами в нашей стране настало время объявить новое, чистое государство! Слава китайской нации и ее государству!"
 KMT_democratic_opposition3:0 "Демократическая оппозиция"
 KMT_democratic_opposition2:0 "Демократическая оппозиция"
 KMT_democratic_opposition:0 "Демократическая оппозиция"
 KMT_powerful_blueshirts2:0 "Влиятельные синерубашечники"
 KMT_powerful_blueshirts3:0 "Влиятельные синерубашечники"
 KMT_powerful_blueshirts4:0 "Расширение деятельности синерубашечников и тайной полиции"
 KMT_powerful_blueshirts4_no_lar:0 "Расширение деятельности синерубашечников и тайной полиции"
 KMT_powerful_blueshirts5:0 "Режим в тени"
 KMT_powerful_blueshirts5_no_lar:0 "Режим в тени"
 KMT_puppetmaster:0 "Китайский кукловод"
 KMT_an_oath_of_loyalty:0 "Клятва верности"
 KMT_depoliticized_army:0 "Деполитизированная армия"
 KMT_depoliticized_army2:0 "Деполитизированная армия"
 KMT_secularism:0 "Секуляризм"
 KMT_democracy_of_the_proletariat:0 "Демократия пролетариата"
 KMT_democracy_of_the_proletariat_desc:0 "Путь социализма и рабочих — не путь диктатуры сталинского образца. Вместо этого построим демократию в нашем новом Китае."
 KMT_democracy_of_the_proletariat2:0 "Демократия пролетариата"
 KMT_own_all_of_china_and_mongolia_and_tuva:0 "Владеет и контролирует все китайские и монгольские национальные территории, а также Туву"
 KMT_the_new_way:0 "Новый путь"
 KMT_the_new_way2:0 "Новый путь"
 KMT_the_new_way3:0 "Новый путь"
 KMT_free_speech:0 "Свобода слова"
 KMT_independent_judiciary:0 "Независимая судебная система"
 KMT_science_funding2:0 "Академия Синика"
 KMT_the_new_communist_woman:0 "Новая коммунистическая женщина"
 KMT_the_new_communist_woman_desc:0 "Политическая революция принесла свободу миллионам людей в нашем Союзе, и прежде всего миллионам женщин, которые больше не ограничены ролью жён и матерей, а могут на равных трудиться на рабочих местах."
 KMT_expand_the_agitrop:0 "Расширить агитпроп"
 KMT_expand_the_agitrop_desc:0 "Чтобы достучаться до миллионов рабочих по всему Союзу, мы должны говорить на их языке. Наши доводы должны быть простыми и понятными, чтобы оставаться в памяти обычного гражданина. Следует ещё больше расширить работу в этой области."
 KMT_positive_heroism:0 "Положительный героизм"
 KMT_positive_heroism_desc:1 "Хотя все достижения представителей рабочего класса принадлежат всему рабочему классу, мы всё же можем указывать на отдельных людей как на примеры для подражания."
 KMT_import_the_stakhanovite_movement:0 "Перенять стахановское движение"
 SOV_revive_the_stakhanovite_movement_desc:0 "Мы видели, какое влияние стахановское движение оказало на Россию. Привнесём его и в нашу страну!"
 KMT_war_heroes:0 "Герои войны"
 KMT_war_heroes_desc:0 "Китайцы всегда были способны и готовы совершать подвиги исключительной храбрости ради разгрома любого захватчика родины. Хотя мы едины в борьбе с врагом, не стоит делать вид, будто в нашей армии нет солдат, далеко превзошедших свой долг."
 KMT_collectivist_propaganda:0 "Коллективистская пропаганда"
 KMT_collectivist_propaganda_desc:1 "Ни один гражданин не сталкивается с многочисленными трудностями в одиночку. Вся наша борьба общая, а значит, и все достижения тоже общие."
 KMT_socialist_emulation:0 "Социалистическое соревнование"
 KMT_socialist_emulation_desc:0 "При капитализме рабочие вынуждены соперничать друг с другом за хлеб насущный, тогда как владельцы фабрик присваивают выгоду от любых улучшений, повышающих производительность. Это расточительно и бесчеловечно. Социалистическая система позволит тем, кто ещё не достиг лучших результатов, получить необходимую поддержку и развивать способности, учась у передовиков."
 KMT_socialist_realism:0 "Социалистический реализм"
 KMT_socialist_realism_desc:1 "Путь к светлому социалистическому будущему долог и зачастую извилист. Некоторые могут даже потерять надежду, что эта цель достижима. Мы должны показать им, ради чего они трудятся, продвигая художественный стиль, изображающий жизнь в социалистической стране такой, какой она действительно может стать."
 KMT_wang_ming:0 "Председатель Ван"
 KMT_wang_ming_desc:0 "При поддержке Москвы Ван Мин победил в борьбе за власть в Китае! Да здравствует великий победитель!"
 KMT_import_the_stalin_constituion:0 "Перенять сталинскую конституцию"
 KMT_import_the_stalin_constituion_desc:0 "Мы увидели успех сталинской конституции в России, поэтому примем её и в Китае!"
 KMT_secure_the_administration:0 "Обезопасить администрацию"
 KMT_secure_the_administration_desc:0 "Из-за недавней революции и хаоса борьбы за власть мы должны проверить лояльность членов партии. Крайне важно знать, на чьей стороне стоит каждый член Политбюро."
 KMT_accelerate_the_collectivization_process:0 "Ускорить процесс коллективизации"
 KMT_accelerate_the_collectivization_process_desc:0 "Хотя предстоит ещё много работы, а в некоторых регионах процесс был проведён крайне неумело, коллективизацию китайских хозяйств необходимо довести до конца, и вскоре она повысит производство в сельском хозяйстве."
 KMT_the_workers_dictatorship:0 "Диктатура рабочих"
 KMT_the_workers_dictatorship_desc:0 "Вся власть в нашем Союзе в конечном счёте должна принадлежать рабочим. Мы не можем позволить себе раскол на фракции и потому обязаны обеспечить, чтобы воля рабочих всегда выражалась в решениях Политбюро."
 KMT_centralization_and_discipline:0 "Централизация и дисциплина"
 KMT_centralization_and_discipline_desc:0 "В это время неопределённости народ ждёт от Политбюро стабильности и руководства. Мы должны обеспечить, чтобы этот орган принятия решений не просто поддерживал решения товарища Сталина, но и был полностью един в их исполнении."
 KMT_chinese_war_economy:0 "Китайская военная экономика"
 KMT_chinese_war_economy_desc:0 "Очевидно, что капиталистические и реакционные государства на наших границах намерены ударить в момент нашей слабости. Чем раньше мы переведём экономику на военные рельсы, тем лучше."
 KMT_chen_duxiu:0 "Председатель Чэнь"
 KMT_chen_duxiu_desc:0 "При поддержке Москвы Чэнь Дусю победил в борьбе за власть в Китае! Да здравствует великий победитель!"
 KMT_denounce_the_maoist_stalinist_line:0 "Осудить маоистско-сталинистскую линию"
 KMT_denounce_the_maoist_stalinist_line_desc:0 "Мао, Сталин и их диктаторские принципы нанесли нашей стране огромный ущерб. Это необходимо остановить, а их идеологию — уничтожить."
 KMT_assist_the_ordinary_soldier_desc:0 "Вместо поддержки лишь высших офицеров мы поможем простому солдату, завоевав его верность и доверие."
 KMT_rebuild_the_national_assembly:0 "Восстановить Национальное собрание"
 KMT_rebuild_the_national_assembly_desc:0 "Мы постараемся восстановить Национальное собрание и наделить его властью над президентом, чтобы не допустить его коррумпированности."
 KMT_found_the_legislative_yuan:0 "Учредить Законодательный юань"
 KMT_found_the_legislative_yuan_desc:0 "Мы учредим Законодательный юань и обеспечим стране умеренную законотворческую силу. Это поможет защитить демократию в нашей великой стране!"
 KMT_birth_of_the_control_yuan:0 "Рождение Контрольного юаня"
 KMT_birth_of_the_control_yuan_desc:0 "Новое правительство создаст в стране третью силу — Контрольный юань. Он будет действовать как судебный орган, следящий за тем, чтобы ни один законодатель или президент не злоупотреблял властью и не подрывал нашу драгоценную демократию."
 KMT_supply_the_west:0 "Снабжать западную кампанию"
 KMT_supply_the_west_desc:0 "Будет построена железная дорога для снабжения дальнейшего возвращения запада! Это позволит проводить там новые крупномасштабные военные операции и расправиться с сепаратистами!"
 KMT_uphold_democratic_centralism:0 "Сохранить демократический централизм"
 KMT_uphold_democratic_centralism_desc:0 "Новое правительство сохраняет демократический централизм старого Гоминьдана, гарантируя, что наши политические решения НЕ будут обходить или критиковать!"
 KMT_preempt_the_dissenters:0 "Оперередить инакомыслящих"
 KMT_preempt_the_dissenters_desc:0 "Необходимо заранее обезвредить левых инакомыслящих, пытающихся свергнуть законный порядок в нашей стране, и заключить их в тюрьму до того, как они создадут проблемы. Да здравствует революция Гоминьдана, долой предателей!"
 KMT_enshrine_kmt_power:0 "Закрепить власть Гоминьдана"
 KMT_enshrine_kmt_power_desc:0 "Наши чиновники день и ночь трудятся, чтобы закрепить власть Гоминьдана. Их не остановить, и революция будет защищена!"
 KMT_display_chaings_crimes:0 "Показать преступления Чана"
 KMT_display_chaings_crimes_desc:0 "Теперь государство должно показать народу истинный масштаб преступлений Чана. Надеемся, это поможет доказать законность нового правительства и укрепить доверие к нему."
 KMT_yet_honor_his_successes:0 "Но почтить его достижения"
 KMT_yet_honor_his_successes_desc:0 "Хотя Чан совершил множество ужасных поступков, мы не станем сосредотачиваться только на них, а также покажем его великие успехи и всё хорошее, что он сделал для страны! Разве не он первым начал революцию Гоминьдана?"
 KMT_the_right_men_in_the_right_places:0 "Нужные люди на нужных местах"
 KMT_the_right_men_in_the_right_places_desc:0 "Благодаря огромному успеху нашего режима и усилению союзников наши люди теперь заняли все властные позиции. Партия получит полный контроль над страной"
 KMT_all_glory_to_the_dang:0 "Вся слава партии"
 KMT_all_glory_to_the_dang_desc:0 "Полностью подчинив себе все стороны государства, мы можем сказать от всего сердца: вся слава Народному Гоминьдану и его великой, победоносной революции!"
 KMT_the_anti_imperial_league:0 "Антиимпериалистическая лига"
 KMT_the_anti_imperial_league_desc:0 "Поскольку Азия охвачена империализмом, мы должны спасти её от него. Западникам, Советам и японцам необходимо дать отпор!"
 KMT_the_blue_dictatorship:0 "Синяя диктатура"
 KMT_the_blue_dictatorship_desc:0 "Захват власти завершён, и теперь мы контролируем все части государства. Чан и синерубашечники правят безраздельно, и НИКТО не сможет их остановить!"
 KMT_the_slippery_slope_to_fascism:0 "Скользкий путь к фашизму"
 KMT_the_slippery_slope_to_fascism_desc:0 "Наш режим и синерубашечники всё сильнее тяготеют к фашизму, и мы примем этот путь, используя природу режима, чтобы закрепить за собой всю полноту власти!"
 KMT_secure_the_new_state:0 "Обезопасить новое государство"
 KMT_secure_the_new_state_desc:0 "Настало время для полного захвата Китая Голубыми Рубашками, Чан приведет их к славе и уничтожит всякое сопротивление со стороны любого выродившегося дурака, осмеливающегося противостоять нам!"
 KMT_a_regime_in_the_shadows:0 "Режим в тени"
 KMT_a_regime_in_the_shadows_desc:0 "Мы создали для себя режим в тени, где все контролируется нами! Никто не должен прятаться от нашего взгляда и оставаться безнаказанным! Никто не будет против Чан Кай Шека!"
 KMT_expand_secret_police_operations:0 "Расширить операции тайной полиции"
 KMT_expand_secret_police_operations_desc:0 "Синерубашечники расширят деятельность тайной полиции, чтобы противостоять тем, кто выступает против нашей новой власти над Китаем! Все несогласные будут найдены и уничтожены."
 KMT_free_china_movement:0 "Движение «Свободный Китай»"
 KMT_final_electoral_preparations:0 "Последние приготовления к выборам"
 KMT_final_electoral_preparations_desc:0 "Национальный конгресс завершён, и настало время провести последние приготовления к выборам! Да здравствует будущее Революции!"
 KMT_the_results:0 "Результаты"
 KMT_the_results_desc:0 "Настало время объявить результаты наших выборов! Голос народа будет услышан, а демократия восторжествует!"
 KMT_prepare_for_new_eletions:0 "Объявить новые выборы"
 KMT_prepare_for_new_eletions_desc:0 "Партия объявляет, что новые выборы пройдут в течение года! Мы дали это смелое обещание, и теперь обязаны его выполнить..."
 KMT_hold_new_elections:0 "Провести обещанные выборы"
 KMT_hold_new_elections_desc:0 "Теперь, когда всё готово, пришло время исполнить наши обещания. Новые выборы состоятся, и состоятся прямо сейчас."
 KMT_the_first_replublican_elections:0 "Первые республиканские выборы"
 KMT_the_first_replublican_elections_desc:0 "Теперь, когда всё готово, пора действовать решительно и привести Китай к подлинной демократии, проведя первые настоящие выборы в его истории — более великие и совершенные, чем всё, что дала Синьхайская революция!"
 KMT_a_new_dawn:0 "Новый рассвет"
 KMT_a_new_dawn_desc:0 "Закрепив власть, мы откроем для Китая новый рассвет: существующий порядок будет сломлен, а в стране восторжествует демократия!"
 KMT_the_silent_takeover:0 "Тихий захват власти"
 KMT_the_silent_takeover_desc:0 "Наш враг и не подозревает, что за последние дни, месяцы и годы мы проникли во все части его лагеря. Теперь, не вызывая заметных перемен извне, мы воплотим наши замыслы относительно судьбы Китая."
 KMT_the_status_quo:0 "Статус-кво"
 KMT_the_status_quo_desc:0 "Надежда на то, что Национальный конгресс решит все проблемы Китая, оказалась напрасной; мы совершили тяжёлую ошибку. Теперь Китай погрузился в состояние статус-кво и в обозримом будущем будет пребывать в застое!"
 KMT_uneasy_status_quo:0 "Неустойчивый статус-кво"
 KMT_leftist_dissent:0 "Левое недовольство"
 KMT_state_within_a_state:0 "Государство в государстве"
 KMT_a_new_and_better_chiang:0 "Новый и лучший Чан"
 KMT_a_new_and_better_chiang_desc:0 "Показав тяжкие ошибки и великие достижения Чана, мы присвоим его наследие и провозгласим себя лучшей и более чистой его версией — способной сделать то, чего не смог он, и противостоять его порокам."
 KMT_a_state_within_a_state:0 "Государство в государстве"
 KMT_a_state_within_a_state_desc:0 "Гоминьдан взял под контроль весь государственный аппарат и использовал его, чтобы создать внутри себя особое подгосударство. Благодаря этому он сохраняет власть над центральным правительством независимо от того, кто занимает те или иные должности."
 KMT_limit_the_executive_yuan:0 "Ограничить Исполнительный юань"
 KMT_limit_the_executive_yuan_desc:0 "Новое правительство ограничит полномочия Исполнительного юаня, не позволяя одному человеку узурпировать власть."
 KMT_empower_the_legislature:0 "Расширить полномочия законодательной власти"
 KMT_empower_the_legislature_desc:0 "Новое правительство усилит законодательную власть в новом государстве, обеспечив верховенство закона и эффективное управление!"
 KMT_silence_rightist_legislators:0 "Заставить правых законодателей замолчать"
 KMT_silence_rightist_legislators_desc:0 "Мы должны заставить замолчать правых законодателей, выступающих против нашего справедливого правопорядка! Мы утвердим свои принципы силой закона, чего бы это ни стоило!"
 KMT_full_unity_of_action:0 "Полное единство действий"
 KMT_full_unity_of_action_desc:0 "Наше государство воспользуется ленинскими принципами, чтобы вся оппозиция действовала вместе с нами, обеспечивая единство действий во всех наших начинаниях!"
 KMT_maintain_kmt_purity:0 "Сохранить чистоту Гоминьдана"
 KMT_maintain_kmt_purity_desc:0 "Крайне важно сохранить чистоту нашей партии и ясно показать, что мы не коммунисты, а демократы."
 KMT_purge_disloyal_generals:0 "Отстранить нелояльных генералов"
 KMT_purge_disloyal_generals_desc:0 "Государство очистит армию от всех генералов, выступающих против нашего нового левого режима! Все склонятся перед славой нового Гоминьдана!"
 KMT_dechiangification_of_the_army:0 "Дечанизация армии"
 KMT_dechiangification_of_the_army_desc:0 "Мы должны действовать быстро, чтобы искоренить влияние чанистов в армии и обеспечить её нейтралитет и верность!"
 KMT_fully_bolshevise_the_army:0 "Полностью большевизировать армию"
 KMT_fully_bolshevise_the_army_desc:0 "Настало время полностью большевизировать армию в соответствии с нашими принципами!"
 KMT_fuse_the_army_into_the_state:0 "Слить армию с государством"
 KMT_fuse_the_army_into_the_state_desc:0 "Чтобы обезопасить нашу власть, армия будет слита с государством, что позволит нам установить полный контроль ради нового социалистического режима."
 KMT_the_economic_national_revolution:0 "Национальная экономическая революция"
 KMT_the_economic_national_revolution_desc:0 "Мы проведём в Китае вторую экономическую революцию, которая принесёт нашему народу великое будущее и перераспределит богатства!"
 KMT_moderate_the_revolution:0 "Смягчить революцию"
 KMT_moderate_the_revolution_desc:0 "Разумно будет смягчить нашу экономическую революцию, чтобы народ не поднял восстание и не создал новых проблем."
 KMT_the_young_guard:0 "Молодая гвардия"
 KMT_the_young_guard_desc:0 "Народ поддерживает Молодую гвардию Гоминьдана — левых, вновь вышедших из подполья и получивших легальный статус. Они победили на выборах и теперь могут повести Китай к новому рассвету."
 KMT_maintain_the_saction_against_communsim:0 "Сохранить запрет на коммунизм"
 KMT_maintain_the_saction_against_communsim_desc:0 "С обеспечением безопасности государства мы следим за тем, чтобы сохранить нашу санкцию против коммунизма, чтобы это вырождение было полностью уничтожено, чтобы мы могли противостоять его отвратительному влиянию на наш народ."
 KMT_in_the_shadow_of_chiang_kai_shek:0 "В тени Чан Кай Шека"
 KMT_the_old_guard:0 "Старая гвардия"
 KMT_the_old_guard_desc:0 "Старая гвардия Гоминьдана одержала победу. Да здравствует Гоминьдан и да здравствует Китайская Республика!"
 KMT_destroy_the_new_life_movement:0 "Уничтожить движение «Новая жизнь»"
 KMT_destroy_the_new_life_movement_desc:0 "Закрепив власть, мы уничтожим остатки движения «Новая жизнь» — фашистского движения, созданного Чаном ради собственной выгоды и вопреки воле народа. Его необходимо остановить и уничтожить."
 KMT_the_free_china_movement:0 "Движение «Свободный Китай»"
 KMT_the_free_china_movement_desc:0 "Новое правительство создаст новое движение, более великое и совершенное, чем прежняя «Новая жизнь». Движение «Свободный Китай» возвысит наш народ и принесёт ему великую славу в будущем."
 KMT_end_the_blueshirt_sharade:0 "Положить конец фарсу синерубашечников"
 KMT_end_the_blueshirt_sharade_desc:0 "Синерубашечникам слишком долго позволяли бесчинствовать в Китае. Мы должны положить конец деятельности этих отвратительных смутьянов."
 KMT_a_suitable_president:0 "Подходящий президент"
 KMT_a_suitable_president_desc:0 "После нашей победы на выборах пришло время официально сделать Ху Ши президентом, чтобы он повёл Китай к победе!"
 KMT_president_of_all_china:0 "Президент всего Китая"
 KMT_chiangs_heir:0 "Наследник Чана"
 KMT_commander_in_chief:0 "Главнокомандующий"
 KMT_veangeful:0 "Мстительный"
 KMT_military_support:0 "Поддержка военных"
 KMT_stack_the_high_command:0 "Заполнить высшее командование своими людьми"
 KMT_chaos_in_the_capital:0 "Хаос в столице"
 KMT_dissolved_democratic_institutions:0 "Распущенные демократические институты"
 KMT_strengthen_democratic_institutions:0 "Укрепить демократические институты"
 KMT_strengthen_democratic_institutions_desc:0 "Чтобы демократия процветала в Китае, наши институты необходимо укрепить. Через них будет обеспечена свобода."
 KMT_enabling_act:0 "Закон о чрезвычайных полномочиях"
 KMT_martial_law:0 "Военное положение"
 KMT_stacked_high_command:0 "Лояльное высшее командование"
 KMT_increase_secret_police_authority:0 "Расширить полномочия тайной полиции"
 KMT_increase_secret_police_authority_desc:0 "Чтобы провести великие реформы в нашем государстве, мы должны расширить полномочия тайной полиции. Она поможет нам полностью овладеть рычагами власти и уничтожить инакомыслие."
 KMT_purge_the_blueshirt_members:0 "Обезвредить синерубашечников"
 KMT_purge_the_blueshirt_members_desc:0 "Теперь, когда наша клика CC укрепила свою власть, пришло время разобраться с синерубашечниками, столь долго пытавшимися соперничать с нами. С благословения Чана мы покончим с ними и окончательно их разгромим."
 KMT_chaings_right_hand_man:0 "Правая рука Чана"
 KMT_chiangs_right_hand_man_desc:0 "По мере того как Дай Ли становится всё важнее для нашего режима, пора открыто показать его истинную роль. Он станет признанной правой рукой генералиссимуса и будет исполнять его волю по всей стране."
 KMT_loyalty_to_the_generalissimo:0 "Верность генералиссимусу"
 KMT_loyalty_to_the_generalissimo_desc:0 "Дай Ли принесёт присягу генералиссимусу и станет по-настоящему грозной силой, способной выполнить любой его приказ. Никто не посмеет сопротивляться Ли, а значит — никто не посмеет сопротивляться Чану."
 KMT_the_diarchy:0 "Диархия"
 KMT_the_diarchy_desc:0 "Поскольку Дай и Чан всё больше становятся равными, пришло время закрепить их власть как власть двух равноправных правителей: Чан останется главным лицом нации, а Дай будет управлять внутренним государственным аппаратом."
 KMT_disband_the_cc_clique:0 "Распустить клику CC"
 KMT_disband_the_cc_clique_desc:0 "Получив власть над государством, мы распустим клику CC. Эти люди слишком долго презирали нас. Будет лишь справедливо поступить с ними именно так."
 KMT_hunt_communists_in_the_street:0 "Охотиться на коммунистов на улицах"
 KMT_hunt_communists_in_the_street_desc:0 "Коммунисты — позор нашего народа. Эти люди снова и снова причиняли нам вред и предавали нас. Мы воздадим им по заслугам и безжалостно истребим их!"
 KMT_violence_the_solution_to_opposition:0 "Насилие — решение проблемы оппозиции"
 KMT_violence_the_solution_to_opposition_desc:0 "Насилие всегда было нашим предпочтительным ответом оппозиции. Мы применим его, чтобы укрепить свою власть и покончить со ВСЕМИ несогласными!"
 KMT_gut_the_deep_state:0 "Выпотрошить глубинное государство"
 KMT_gut_the_deep_state_desc:0 "Синерубашечники выпотрошат глубинное государство, уничтожив всякое сопротивление нашему контролю над органическим государством и позволив нам беспрепятственно навязать стране свою волю!"
 KMT_further_combat_illiteracy:0 "Усилить борьбу с неграмотностью"
 KMT_further_combat_illiteracy_desc:0 "Пришло время ещё активнее бороться с неграмотностью в Китае в соответствии с планами Чана, создавая образованное и трудолюбивое население."
