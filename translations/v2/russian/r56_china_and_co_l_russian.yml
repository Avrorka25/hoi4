 KMT_chiangs_right_hand_man:0 "Правая рука генералиссимуса"
 KMT_chiangs_loyal_right_hand_man:0 "Един с генералиссимусом"
 KMT_ycp_bop:0 "Фракционная борьба в Партии молодого Китая"
