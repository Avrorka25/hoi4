 MAN_puyis_circle:0 "Заговор императора"
 MAN_puyis_circle_desc:0 "В то время как Маньчжурия была захвачена японцами и Квантунской армией, и император установил их в качестве марионеточной монархии, он не полностью верен своим повелителям.\nНекоторые утверждают, что он, возможно, начал свой собственный заговор с целью свержения Квантунской армии, когда настало время и установить свое собственное правление.\n\n £GFX_in_combat Процент лояльных к Пуи: §G[?MAN_puyi_loyalists]%§!\n\nЯпонцы, однако, начинают подозревать его планы, и если они получат уверенность в заговоре, то они могут попытаться свергнуть императора силой.\n\n £GFX_counter_intelligence Япония является §R[?MAN.MAN_jap_hints]%§! Неверность императора"
 MAN_securing_manchuria:0 "Заговор императора?"
 MAN_securing_manchuria_desc:0 "За последние несколько лет мы с помощью Квантунской армии закрепили за собой Северный Китай. Затем мы поставили во главе государства императора Пу И, чтобы обеспечить лояльность Маньчжурии.\nОднако в последнее время до нас доходят слухи, что Пу И строит против нас заговор. Большинство японцев отмахиваются от них, но некоторые представители военного руководства предлагают провести расследование и низложить Пу И, если подозрения подтвердятся...\n\n £GFX_counter_intelligence Наше военное руководство на §R[?MAN.MAN_jap_hints]%§! уверено в нелояльности императора"
