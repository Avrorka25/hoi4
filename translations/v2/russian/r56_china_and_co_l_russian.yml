 CHI_tp_pp_5:0 "Изменить §Y«Три народных принципа»§!: \n Множитель политической власти: §G+5%§!"
 CHI_tp_re_5:0 "Изменить §Y«Три народных принципа»§!: \n Эффективность добычи ресурсов: §G+5%§!"
 CHI_tp_re_10:0 "Изменить §Y«Три народных принципа»§!: \n Эффективность добычи ресурсов: §G+10%§!"
 CHI_tp_aa_5:0 "Изменить §Y«Три народных принципа»§!: \n Атака армии: §G+5%§!"
