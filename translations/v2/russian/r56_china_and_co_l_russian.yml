 KMT_party_of_landslords:0 "Партия землевладельцев и предпринимателей"
 KMT_main_bop:0 "Состояние национальной революции Гоминьдана"
 KMT_main_bop_tt:0 "Состояние Гоминьдана и борьба за власть в нём в конечном счёте определят судьбу Китая и его руководства. \nПока ещё неизвестно, кто сумеет подчинить себе Китай и одержать победу на §YСледующем национальном конгрессе§!."
