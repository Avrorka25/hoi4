 MAN_dole_out_starting_capital_desc:0 "Чтобы ещё больше укрепить наши предприятия, им будет предоставлен начальный капитал."
 MAN_a_prosperous_manchuria:0 "Процветающая Маньчжурия"
 MAN_a_prosperous_manchuria_desc:0 "Свершилось: Маньчжурия стала процветающим государством. Теперь все потребности народа будут удовлетворены, и наступит эпоха благоденствия."
 MAN_support_interest_of_the_buisness_owners:0 "Поддержать интересы предпринимателей"
 MAN_support_interest_of_the_buisness_owners_desc:0 "По мере того как экономика становится всё более капиталистической, мы закрепим интересы предпринимателей в нашем государстве, помогая им развивать экономику."
 MAN_sacrfice_for_the_state:0 "Жертва ради государства"
 MAN_sacrfice_for_the_state_desc:0 "Народ должен жертвовать всем ради Маньчжурского государства, чтобы обеспечить нашу победу."
 MAN_total_economic_coherance_3:0 "Полная экономическая согласованность"
 MAN_total_economic_coherance_3_desc:0 "Непрерывные реформы маньчжурского правительства завершились созданием идеально организованной и эффективной имперской экономики, выстроенной сверху донизу. Подобно хорошо смазанному механизму, наша экономика теперь способна удовлетворять требования императора и, разумеется, нужды маньчжурского народа."
 MAN_support_workers_rights:0 "Поддержать права рабочих"
 MAN_support_workers_rights_desc:0 "Мы поддержим права рабочих нашей страны. Это обеспечит их готовность трудиться на благо государства."
 MAN_begin_socialist_reforms:0 "Начать социалистические реформы"
 MAN_begin_socialist_reforms_desc:0 "Социалистические союзники оказали Маньчжурии большую помощь, и в благодарность мы внедрим некоторые из их политических мер."
 MAN_expropriate_the_japanese_sympathisers:0 "Экспроприировать сторонников Японии"
 MAN_expropriate_the_japanese_sympathisers_desc:0 "Сторонники Японии нанесли нашей стране большой ущерб. Их собственность должна быть экспроприирована и перераспределена на благо государства и народа."
 MAN_bring_about_social_justice_by_state_methods:0 "Социальная справедливость мечом"
 MAN_bring_about_social_justice_by_state_methods_desc:0 "Социальная справедливость должна восторжествовать. Ничто не должно нас остановить. Ради этого придётся пойти на любые жертвы."
 MAN_nationalize_the_industries:0 "Национализировать промышленность"
 MAN_nationalize_the_industries_desc:0 "Капиталисты и промышленники причинили нашему народу немало вреда. Их имущество будет национализировано и использовано на благо народа."
 MAN_a_state_for_the_people:0 "Государство для народа"
 MAN_a_state_for_the_people_desc:0 "Маньчжурия стала государством для народа. Каждый будет обеспечен и получит пользу."
 MAN_the_kwantung_withdrawal:0 "Вывод Квантунской армии"
 MAN_the_kwantung_withdrawal_desc:0 "Большая часть Квантунской армии уже выведена, и теперь мы изгоним оставшихся. Маньчжурия будет свободна!"
 MAN_invest_in_a_modern_tank_force:0 "Вложиться в современные танковые войска"
 MAN_invest_in_a_modern_tank_force_desc:0 "Государство должно вложиться в современные танковые войска, укрепив мощь армии и обеспечив нашу безопасность на долгие годы."
 MAN_consolidate_internal_politics:0 "Укрепить внутреннюю политику"
 MAN_consolidate_internal_politics_desc:0 "Пришло время упорядочить внутреннюю политику, обеспечив будущее и стабильность государства."
 MAN_break_the_notion_of_the_past:0 "Отказаться от представлений прошлого"
 MAN_break_the_notion_of_the_past_desc:0 "В прошлом Маньчжурию считали неотъемлемой частью Китая, даже при старой династии Цин. Новый император признал, что это не так! Маньчжурия — уникальное государство. Она сама выкует своё будущее."
 MAN_forging_a_unique_identity:0 "Создать уникальную идентичность"
 MAN_forging_a_unique_identity_desc:0 "Маньчжурия создаст уникальную идентичность, объединив культуры множества этнических групп в невиданное прежде сочетание. Мы — будущее Азии и всего мира!"
 MAN_greater_manchuria_theory:0 "Теория Великой Маньчжурии"
 MAN_greater_manchuria_theory_desc:0 "Мы посвятим себя идее Великой Маньчжурии и вернём земли, захваченные Россией. Маньчжурия снова станет великой!"
 MAN_integrate_the_frontier:0 "Интегрировать пограничные земли"
 MAN_integrate_the_frontier_desc:0 "Вернув несколько наших старых провинций, пора интегрировать их, укрепить власть в регионе и окончательно объединить страну!"
 MAN_deal_with_kwantung_remnants:0 "Разобраться с остатками Квантунской армии"
 MAN_deal_with_kwantung_remnants_desc:0 "Япония и Квантунская армия всё ещё удерживают значительные части наших земель. Мы должны изгнать и уничтожить их, освободив наш народ."
 MAN_abide_by_the_constitution:0 "Разработать новую конституцию"
 MAN_abide_by_the_constitution_desc:0 "После свержения японского марионеточного режима мы долгое время жили без конституции под властью сильных лидеров. Пришло время положить этому конец и наконец составить новую конституцию."
 MAN_manchurian_constitutionalism:0 "Полное подчинение конституции"
 MAN_manchurian_constitutionalism_desc:0 "Император решил полностью подчиниться власти конституции и превратить страну в конституционную монархию, предоставив народу больше свободы!"
 MAN_rule_by_decree:0 "Правление указами"
 MAN_rule_by_dcree_desc:0 "Пу И продолжит править указами, сохраняя почти диктаторскую власть императора над страной."
 MAN_centralizing_authority:0 "Централизация власти"
 MAN_centralizing_authority_desc:0 "Мы должны централизовать власть в стране, укрепив режим и вечное правление императора!"
 MAN_his_wish_our_command:0 "Его желание — наш приказ"
 MAN_his_wish_our_command_desc:0 "Народ подчинится воле императора, ибо его деяния священны, и народ будет повиноваться!"
 MAN_the_qing_restoration:0 "Реставрация Цин"
 MAN_the_qing_restoration_desc:0 "Благодаря успеху Харбинского конгресса монархия окончательно утвердилась в Маньчжурии! Да здравствует возвращение Цин!"
 MAN_the_manchu_restoration:0 "Закрепить маньчжурскую гегемонию"
 MAN_the_manchu_restoration_desc:0 "Маньчжурская гегемония утвердится на наших землях и обеспечит наше вечное возвращение к власти. Маньчжуры больше не будут угнетаться ханьцами или японцами."
 MAN_the_hope_of_seperatism_desc:0 "Маньчжурия живет с целью достижения своего суверенитета и отделения от выродков в Китае."
 MAN_the_hope_of_seperatism_tt:0 "За каждый принадлежащий вам китайский национальный регион, который не является вашим национальным, вы получите:\n Фабрики товаров народного потребления §Y1.5%§! \n Стабильность §R-1.50% §!\n Цель сопротивления §R+2%§!\n Скорость роста сопротивления: §R+2%§!\n Скорость роста подчинения §R-1%§!"
 MAN_open_the_mining_industry_for_investments_desc:0 "Мы откроем горнодобывающую промышленность для инвестиций, чтобы экономика могла быть построена до мощной силы."
 MAN_expand_state_resource_extraction_desc:0 "Государственную добычу ресурсов необходимо расширить. Экономика будет процветать."
 MAN_greatly_increase_tenko_measures:0 "Значительно усилить меры тэнко"
 MAN_greatly_increase_tenko_measures_desc:0 "Квантунская армия значительно усилит меры по идеологической обработке населения. Люди должны быть верны императору, а не социалистической идеологии, даже если именно из-за неё они покинули Японию и переселились в Маньчжурию."
 MAN_raid_the_social_research_unit:0 "Провести облаву на отдел социальных исследований"
 MAN_raid_the_social_research_unit_desc:0 "Чтобы покончить с социализмом, необходимо провести облаву на отдел социальных исследований и его сторонников коммунизма. Маньчжурию нужно очистить от этих глупцов!"
 MAN_enforce_japanese_cultural_norms:0 "Насаждать японские культурные нормы"
 MAN_enforce_japanese_cultural_norms_desc:0 "Необходимо насаждать японские культурные нормы, чтобы очистить государство от левых идей поселенцев."
 MAN_consolidate_control_over_the_state:0 "Укрепить контроль над государством"
 MAN_consolidate_control_over_the_state_desc:0 "Квантунская армия обладает огромным влиянием в Маньчжурии, и теперь пришло время окончательно закрепить её власть. Никто не посмеет ставить под сомнение армию или императора!"
 MAN_fully_sideline_kwantung:0 "Полностью отстранить Квантунскую армию"
 MAN_fully_sideline_kwantung_desc:0 "Мы полностью отстраним ослабленную Квантунскую армию, позволив режиму самостоятельно добиваться своих целей."
 MAN_kwantungs_power_secured:0 "Власть Квантунской армии обеспечена"
 MAN_kwantungs_power_secured_desc:0 "Квантунская армия окончательно укрепила свою власть. Да здравствует Квантунская армия!"
 MAN_our_part_in_the_new_eastasian_order:0 "Наша роль в новом восточноазиатском порядке"
 MAN_our_part_in_the_new_eastasian_order_desc:0 "Наши войска выступают на помощь сюзеренам в их стремлении освободить Азию от колонизаторов. Скоро Азия будет свободна!"
 MAN_a_bent_knee_before_the_emporer:0 "Преклонить колено перед императором"
 MAN_a_bent_knee_before_the_emporer_desc:0 "Пу И преклоняет колени перед нашими великими сюзеренами и Японской империей. Наш долг — подчиниться им."
 MAN_kwantung_finally_marches_south:0 "Квантунская армия наконец идёт на юг"
 MAN_kwantung_finally_marches_south_desc:0 "Наконец пришло время Квантунской армии двинуться на юг и сразиться за остальной Китай. Вскоре и он будет умиротворён."
 MAN_sino_japanese_basic_treaty:0 "Основной китайско-японский договор"
 MAN_sino_japanese_basic_treaty_desc:0 "После создания коллаборационистского режима в Нанкине кабинет заставит его подписать с нами новый договор, признающий Маньчжоу-го независимым государством. Это повысит нашу легитимность и сделает нас по-настоящему законным государством!"
 MAN_full_seperation_from_china:0 "Полное отделение от Китая"
 MAN_full_seperation_from_china_desc:0 "Теперь, когда Китай закреплён в японской сфере, поддержка Японии заставит его уйти с наших земель и подтвердить Основной китайско-японский договор, признав народ Маньчжоу-го."
 MAN_expand_kwantung_influence_in_china:0 "Расширить влияние Квантунской армии в Китае"
 MAN_expand_kwantung_influence_in_china_desc:0 "Поскольку Квантунская армия сыграла немаловажную роль в освобождении Китая, она расширит там своё влияние и захватит часть местных активов."
 MAN_the_fight_for_the_continent:0 "Борьба за континент"
 MAN_the_fight_for_the_continent_Desc:0 "Началась война с русскими за азиатский континент. Вскоре наши войска разгромят их и освободят Великую Маньчжурию!"
 MAN_embrace_the_status_quo:0 "Принять статус-кво"
 MAN_embrace_the_status_quo_desc:0 "Очевидно, что Япония и Квантунская армия преследуют определённые цели в отношении нашего государства. Маньчжурия обязана сотрудничать с ними и содействовать их успеху, служа инструментом отделения от Китая и одновременно обогащая как себя, так и Японию."
 MAN_the_empire_of_great_manchuria:0 "Империя Великой Маньчжурии"
 MAN_the_empire_of_great_manchuria_desc:0 "Пришло время провозгласить Империю Великой Маньчжурии и начать закреплять собственную идентичность в противовес китайской."
 MAN_increase_japanese_settlements:0 "Расширить японские поселения"
 MAN_increase_japanese_settlements_desc:0 "Будут направлены крупные инвестиции на расширение японских поселений в нашей стране, чтобы использовать их средства для её развития."
 MAN_a_truly_non_han_identity:0 "Подлинно неханьская идентичность"
 MAN_a_truly_non_han_identity_desc:0 "Благодаря многочисленным японцам и разнообразным этническим меньшинствам на наших землях мы можем сформировать идентичность, совершенно отличную от остального Китая. Да здравствует Маньчжурия!"
 MAN_bedrock_of_the_japanese_economy:0 "Основа японской экономики"
 MAN_bedrock_of_the_japanese_economy_desc:0 "Теперь мы стали основой японской экономики, снабжая её всем необходимым; воспользуемся этим ради собственной экономической выгоды."
 MAN_pacify_the_countryside_2:0 "Умиротворить сельскую местность"
 MAN_pacify_the_countryside_2_desc:0 "С самого нашего прихода к власти преступники и мятежники пытаются оспаривать наше правление в отдалённых районах страны. Если мы хотим, чтобы нас воспринимали всерьёз как правительство, необходимо искоренить этих террористов и показать населению, что мы способны поддерживать свою власть."
 MAN_army_modernization_2:0 "Модернизация армии"
 MAN_army_modernization_2_desc:0 "Наша армия мала и устарела. При имеющихся у нас ресурсах это недопустимо. Мы должны быть способны внести достойный вклад."
 MAN_mukden_military_academy_2:0 "Мукденская военная академия"
 MAN_mukden_military_academy_2_desc:0 "Нашей армии нужны хорошие и преданные офицеры, способные вести её за собой, если мы хотим добиваться целей не одной лишь численностью."
 MAN_invite_japanese_settlers_2:0 "Пригласить японских поселенцев"
 MAN_invite_japanese_settlers_2_desc:0 "У нас гораздо больше земли, чем людей. Огромные районы страны по-прежнему остаются почти дикой местностью. Следует заселить эти земли, создать новые общины и обеспечить дальнейшее экономическое развитие."
 MAN_collective_farms_2:0 "Коллективные хозяйства"
 MAN_collective_farms_2_desc:0 "Система отдельных хозяйств, принадлежащих одной семье и управляемых ею, отстала и неэффективна. Объединение всей рабочей силы и земель деревни в единое хозяйство позволит развивать их гораздо эффективнее."
 MAN_law_university_2:0 "Юридический университет"
 MAN_law_university_2_desc:0 "Наша страна ещё молода. У нас есть реальная возможность создать совершенно новую правовую систему, основанную на самых современных представлениях о государственном управлении. Для этого следует основать специализированное учреждение, где соберутся лучшие умы Азии."
 MAN_research_and_education_department_2:0 "Департамент исследований и образования"
 MAN_research_and_education_department_2_desc:0 "По мере роста нашей страны необходимо следить, чтобы учреждения образования и научные центры развивались вместе с ней. Следует приложить больше усилий, чтобы исследования были сосредоточены там, где они нужнее всего."
 MAN_trade_delegation_2:0 "Торговая делегация"
 MAN_trade_delegation_2_desc:0 "Остальной мир значительно опережает нас в промышленных методах. Следует отправить делегацию для изучения их технологий и поиска способов улучшить собственные."
 MAN_expand_the_textile_industry_2:0 "Расширить текстильную промышленность"
 MAN_expand_the_textile_industry_2_desc:0 "Текстильные предприятия давно являются опорой нашей промышленности и станут самым простым способом привлечь иностранный капитал для расширения индустриальной базы."
 MAN_obedience_2:0 "Покорность"
 MAN_obedience_2_desc:0 "Некоторые называют нас простой японской марионеткой, но они совершенно не понимают наших тесных и равноправных отношений. Выступить против благодетелей — всё равно что ребёнку восстать против собственных родителей."
 MAN_hoankyoku_2:0 "Хоанкёку"
 MAN_hoankyoku_2_desc:0 "Наше правительство — главная надежда Китая на светлое будущее. Очевидно, многие заинтересованы в его уничтожении. Нам нужна организация, которая будет выслеживать таких людей и защищать государство."
 MAN_first_five_year_plan_2:0 "Первый пятилетний план"
 MAN_first_five_year_plan_2_desc:0 "Несмотря на связь с коммунизмом, пятилетний план является ценным инструментом планирования экономического развития страны. Нам следует ввести такой план, чтобы направлять расширение промышленности."
 MAN_invite_japanese_investors_2:0 "Пригласить японских инвесторов"
 MAN_invite_japanese_investors_2_desc:0 "Для развития страны потребуется помощь извне. Несколько японских компаний уже выразили готовность инвестировать в нашу экономику."
 MAN_expand_the_railways_2:0 "Расширить железные дороги"
 MAN_expand_the_railways_2_desc:0 "Современная железнодорожная сеть необходима, чтобы связать все части страны и объединить их в единое целое."
 MAN_develop_aluminum_sources_2:0 "Разработать источники алюминия"
 MAN_develop_aluminum_sources_2_desc:0 "В Ляонине находятся обширные залежи бокситов, готовые к освоению. Они дадут жизненно важный импульс нашей авиационной промышленности."
 MAN_expand_showa_steel_works_2:0 "Расширить сталелитейный завод Сёва"
 MAN_expand_showa_steel_works_2_desc:0 "Сталелитейный завод Сёва составляет основу нашей тяжёлой промышленности. Вложения в него принесут значительную выгоду в будущем."
 MAN_social_research_unit_2:0 "Отдел социальных исследований"
 MAN_social_research_unit_2_desc:0 "Следует создать специальное подразделение для изучения образа жизни и обычаев нашего народа, чтобы лучше направлять людей и превращать их в продуктивных граждан страны."
 MAN_second_five_year_plan_2:0 "Второй пятилетний план"
 MAN_second_five_year_plan_2_desc:0 "Учитывая успех первого пятилетнего плана, вполне разумно повторить его, разработав новую программу экономического развития."
 MAN_national_defense_state_2:0 "Государство национальной обороны"
 MAN_national_defense_state_2_desc:0 "Пока война не окончена и мы не вернули власть над всем Китаем, необходимо приложить все усилия, пойти на любые жертвы и использовать каждый доступный ресурс ради победы."
 MAN_mukden_arsenal_2:0 "Мукденский арсенал"
 MAN_mukden_arsenal_2_desc:0 "Старый Императорский арсенал станет ядром нового военно-промышленного комплекса, который будет снабжать нашу армию современным оружием."
 MAN_mamc_2:0 "МААК"
 MAN_mamc_2_desc:0 "Создание Маньчжурской авиастроительной компании позволит нам построить современные военно-воздушные силы, способные противостоять любому противнику."
 MAN_alliance_with_the_kwantung_army_2:0 "Союз с Квантунской армией"
 MAN_alliance_with_the_kwantung_army_2_desc:0 "Японские войска в стране нередко расходятся с нами во взглядах. Следует установить с ними более тесные связи, чтобы свести разногласия при совместной работе к минимуму."
 MAN_chinese_leadership_2:0 "Китайское руководство"
 MAN_chinese_leadership_2_desc:0 "Китайскому народу нужен китайский лидер. Мы должны открыто заявить, что стремимся ни к чему иному, как к полному восстановлению императорской власти над всем Китаем."
 MAN_vassalize_mengukuo_2:0 "Вассализировать Мэнцзян"
 MAN_vassalize_mengukuo_2_desc:0 "Князь Мэнцзяна недостоин стоять рядом с императором Маньчжоу-го. Пора положить конец этому нелепому эксперименту и указать ему надлежащее место."
 MAN_national_cooperation_government_2:0 "Правительство национального сотрудничества"
 MAN_national_cooperation_government_2_desc:0 "До нас дошли тревожные слухи, что японцы рассматривают других китайских политиков — простолюдинов — для создания коллаборационистского правительства. Это неприемлемо. Мы должны обеспечить, чтобы вся китайская территория, занятая нашими объединёнными силами, управлялась нами."
 MAN_the_two_emperors_2:0 "Два императора"
 MAN_the_two_emperors_2_desc:0 "Пора положить конец нелепому представлению, будто мы не являемся полностью равноправными партнёрами Японии. Наши два императора подобны братьям!"
 MAN_assertiveness_2:0 "Напористость"
 MAN_assertiveness_2_desc:0 "Японцы продолжают править нами с возмутительным высокомерием. Следует напомнить им, что мы тоже империя, достойная уважения."
 MAN_request_control_of_the_railways_2:0 "Потребовать контроль над железными дорогами"
 MAN_request_control_of_the_railways_2_desc:0 "В такой большой стране, как наша, контролировать железные дороги — значит контролировать страну. \n\nА железные дороги контролируют японцы.\n\n Это должно измениться."
 MAN_staff_the_court_with_manchus_2:0 "Укомплектовать двор маньчжурами"
 MAN_staff_the_court_with_manchus_2_desc:0 "Династия Цин правила Китаем столетиями. Если мы хотим вернуть былую славу, необходимо как можно точнее следовать её примеру."
 MAN_expand_the_imperial_guards_2:0 "Расширить Императорскую гвардию"
 MAN_expand_the_imperial_guards_2_desc:0 "Императорская гвардия станет элитой нашей новой армии и примером, к которому будут стремиться все солдаты."
 MAN_local_arms_procurement_2:0 "Местные закупки вооружения"
 MAN_local_arms_procurement_2_desc:0 "Мы не можем вечно полагаться на поставки японского оружия. Чтобы обрести самостоятельность, нам нужен подконтрольный источник вооружения."
 MAN_bolster_nationalism_2:0 "Укрепить национализм"
 MAN_bolster_nationalism_2_desc:0 "Слишком долго люди считали Маньчжоу-го искусственной конструкцией, созданной японцами. Но каждая нация когда-то была лишь идеей. Мы должны сформировать у народа чувство маньчжурской идентичности и превратить идею в реальность."
 MAN_five_equal_peoples_2:0 "Пять равноправных народов"
 MAN_five_equal_peoples_2_desc:0 "Времена, когда один народ мог безраздельно господствовать над всеми остальными, прошли. Маньчжоу-го станет государством нового типа, где пять народов — русские, японцы, монголы, корейцы и маньчжуры — будут жить вместе в гармонии."
 MAN_white_russian_advisers_2:0 "Белоэмигрантские советники"
 MAN_white_russian_advisers_2_desc:0 "После Гражданской войны в России многие русские предпочли изгнание участи, которую Советы готовили побеждённым врагам. Эти люди могли бы помочь нам восстановить и обучить армию."
 MAN_empower_the_legislative_council_2:0 "Расширить полномочия Законодательного совета"
 MAN_empower_the_legislative_council_2_desc:0 "Сейчас Законодательный совет является лишь церемониальным органом, одобряющим всё, что предлагают японские хозяева. Чтобы стать по-настоящему суверенным государством, прежде всего необходимо добиться полной самостоятельности в законодательных вопросах."
 MAN_five_people_armies_2:0 "Армии пяти народов"
 MAN_five_people_armies_2_desc:0 "Если все граждане равны, то каждый из них должен быть в равной мере готов и полон решимости защищать страну от иностранных угнетателей."
 MAN_purge_the_general_affairs_council_2:0 "Провести чистку в Совете общих дел"
 MAN_purge_the_general_affairs_council_2_desc:0 "Совет общих дел был создан японцами, чтобы обеспечить полный контроль над нашим правительством. Так продолжаться не может. Мы должны устранить всех, чья преданность нашему правительству вызывает хотя бы малейшие сомнения."
 MAN_reform_the_civil_service_2:0 "Реформа государственной службы"
 MAN_reform_the_civil_service_2_desc:0 "Совет по общим делам был лишь верхушкой айсберга. Японцы фактически управляли значительной частью государственной службы полностью вне нашего контроля. Мы должны создать собственных администраторов."
 MAN_independence_war_2:0 "Война за независимость"
 MAN_independence_war_2_desc:0 "Пришло время сбросить оковы угнетения и сражаться за наши древние свободы. Маньчжоу-го станет первой частью Китая, свободной от всякого иностранного гнёта."
 MAN_imperial_divinity_2:0 "Божественность императора"
 MAN_imperial_divinity_2_desc:0 "В былые времена китайских императоров почитали как живых богов. Мы должны связать нынешнего императора с этой древней традицией."
 MAN_imperial_university_2:0 "Императорский университет"
 MAN_imperial_university_2_desc:0 "Империи нужны выдающиеся люди, способные служить её делу. Следует создать место, где лучшие и талантливейшие представители нашего народа смогут собираться, обучать друг друга и учиться друг у друга."
 MAN_move_capitals_2:1 "Перенести столицу"
 MAN_move_capitals_2_desc:0 "Древней столицей всего Китая всегда был Пекин. Теперь, когда он вновь отвоёван, мы можем с триумфом вернуть императора в его прежний дом."
 MAN_claim_the_mandate_of_heaven_2:0 "Заявить права на Небесный мандат"
 MAN_claim_the_mandate_of_heaven_2_desc:0 "Наши победы в войне ясно показали, что сами Небеса признали императора справедливым и достойным Небесного престола. Перед столь убедительными доказательствами должны исчезнуть любые сомнения в том, что именно он является законным правителем всего Китая."
 MAN_reclaim_the_empire_2:0 "Вернуть империю"
 MAN_reclaim_the_empire_2_desc:0 "Теперь, когда мы завоевали свободу, пора продолжить войну против предателей и мятежников в остальном Китае. Мы будем править этой страной или погибнем в попытке."
 MAN_assert_our_authority_2:0 "Утвердить нашу власть"
 MAN_assert_our_authority_2_desc:0 "Остальная страна раздираема внутренними распрями. Ни один из узурпаторов и бандитов, именующих себя военачальниками и председателями, не достоин править. Они будут приведены к покорности, а наше просвещённое правление распространится на весь Китай."
 MAN_offer_vassalization_2:0 "Предложить вассализацию"
 MAN_offer_vassalization_2_desc:0 "Война разорвала страну на части. Мы можем положить ей конец, предложив тем, кто до сих пор отказывался выбрать сторону, место при нашем дворе."
 MAN_finish_the_five_year_plan_2:0 "Завершить пятилетний план"
 MAN_finish_the_five_year_plan_2_desc:0 "Второй пятилетний план принёс плоды; стоит приложить ещё немного усилий, и вскоре наша промышленность будет процветать."
 MAN_reclaim_the_entierty_of_manchuria_puppet_2:0 "Осудить российский империализм"
 MAN_reclaim_the_entierty_of_manchuria_puppet_2_desc:0 "Пока Китай стоял на коленях, русские захватили огромные земли Маньчжурии, которые ныне называют Приморьем, явив миру неприкрытый колониальный империализм. Хотя прежде мы были заняты борьбой с современными западными империалистическими державами, судьба вновь свела нас в бою с русскими и дала шанс исправить эту несправедливость!."
 MAN_acquire_kanto_shu_2:0 "Получить Квантунскую область"
 MAN_acquire_kanto_shu_2_desc:0 "Японские власти слишком сосредоточены на войне с китайцами и намерены передать нам Квантунскую область, чтобы снизить собственную административную нагрузку. Заодно мы получим важный порт."
 MAN_for_the_emperor_2:0 "За императора"
 MAN_for_the_emperor_2_desc:0 "Наши солдаты сражаются во имя славного и любимого императора — победа обеспечена!"
 MAN_send_cadets_to_japan_2:0 "Отправить курсантов в Японию"
 MAN_send_cadets_to_japan_2_desc:0 "Из-за отсутствия военной академии нашим офицерам недостаёт опыта. Чтобы исправить положение, мы можем отправить их в японские академии на метрополии."
 MAN_reform_command_structure_2:0 "Реформировать структуру командования"
 MAN_reform_command_structure_2_desc:0 "Нынешняя структура командования не слишком эффективна и нуждается в реформах."
 MAN_restore_the_old_frontier_2:0 "Восстановить старые границы"
 MAN_restore_the_old_frontier_2_desc:0 "Теперь, когда Центральная равнина находится под контролем, следующим этапом плана станет возвращение утраченных окраинных территорий."
 MAN_restore_the_tributary_system_2:0 "Восстановить данническую систему"
 MAN_restore_the_tributary_system_2_desc:0 "Благодаря огромной мощи империи соседним малым государствам будет предоставлена возможность обрести защиту Великой Цин. Для них станет честью быть частью империи."
 MAN_revive_zongli_yamen_2:0 "Возродить Цзунли ямэнь"
 MAN_revive_zongli_yamen_2_desc:0 "Цзунли ямэнь ведал главным образом внешними делами и технологическим развитием империи Цин. Если империя намерена соперничать с западными державами, этот орган станет для неё незаменимым."
 MAN_revive_the_grand_council_2:0 "Возродить Великий совет"
 MAN_revive_the_grand_council_2_desc:0 "Великий совет был упразднён после создания неудачного «Императорского кабинета». Столь важный государственный орган необходимо возродить, чтобы он вновь служил славе Великой империи Цин."
 MAN_subjugate_japan_2:0 "Подчинить Японию"
 MAN_subjugate_japan_2_desc:0 "Японцы заплатят за нанесённое нам унижение. Мы поставим их на колени!"
 MAN_reclaim_the_entierty_of_manchuria_2:0 "Осудить аннексию Приамурья"
 MAN_reclaim_the_entierty_of_manchuria_2_desc:0 "Когда наш народ был особенно слаб, русские похитили огромные области наших исконных земель за рекой Амур — ту часть Маньчжурии, которую теперь называют Приморьем. Обретя новую силу и восстановив Небесный мандат, мы наконец сможем отомстить за эту обиду, да ещё и с лихвой."
 MAN_qing_romanov_alliance_2:0 "Оливковая ветвь через Сибирь"
 MAN_qing_romanov_alliance_2_desc:0 "Хотя многие среди нас желают поквитаться с русскими за их былые преступления, времена изменились, и двум азиатским престолам следует объединиться против извращений современности и империалистической мощи других великих держав."
 MAN_winter_training_2:0 "Зимняя подготовка"
 MAN_winter_training_2_desc:0 "На улице холодно, поэтому ушанки пригодятся."
 MAN_manchuria_petroleum_company_2:0 "Маньчжурская нефтяная компания"
 MAN_manchuria_petroleum_company_2_desc:0 "Основанная 10 мая 1935 года компания обеспечила полную японскую монополию на добычу и переработку нефти в Маньчжурии."
 MAN_national_martyr_shrine_2:0 "Национальное святилище мучеников"
 MAN_national_martyr_shrine_2_desc:0 "Их гибель не будет забыта. Это жертва, которую я готов принять как необходимую для возвращения моего трона."
 MAN_support_aikawa_2:0 "Поддержать Айкаву"
 MAN_support_aikawa_2_desc:0 "План Айкавы Ёсисукэ по развитию национальной экономики Маньчжоу-го предусматривает создание промышленного конгломерата по образцу дзайбацу, чтобы развивать экономику в соответствии с потребностями государства и всех заинтересованных сторон. Он принесёт выгоду всем, кто заинтересован в индустриализации Маньчжурии. Айкава убедил правительство."
 MAN_support_hoshino_2:0 "Поддержать Хосино"
 MAN_support_hoshino_2_desc:0 "Национал-синдикалистская модель, разработанная и частично воплощённая Хосино Наоки, обеспечит большую гибкость и позволит лучше учитывать требования военных в Маньчжоу-го. Кроме того, его неэтичные методы принесут правительству дополнительный доход."
 MAN_establish_mangyo_2:0 "Учредить «Мангё»"
 MAN_establish_mangyo_2_desc:0 "Маньчжурская компания промышленного развития, сокращённо «Мангё», будет учреждена как промышленный конгломерат, получивший монополию на экономику Маньчжурии. В неё войдут несколько ранее независимых корпораций, включая металлургический комбинат «Сёва» и Южно-Маньчжурскую железную дорогу."
 MAN_expand_opium_production_2:0 "Расширить производство опиума"
 MAN_expand_opium_production_2_desc:0 "Возвышение Хосино открыло новые возможности для Государственного бюро опиумной монополии. Новые доходы укрепят правительство и позволят ему усилить влияние в непокорных районах. Под руководством Хосино бюро станет крупнейшим распространителем опиума в мире."
 MAN_mantetsu_railway_monopoly_2:0 "Железнодорожная монополия «Мантэцу»"
 MAN_mantetsu_railway_monopoly_2_desc:0 "Ещё до создания Маньчжурской империи Южно-Маньчжурская железная дорога была одним из самых прибыльных предприятий во всей Азии. После её включения в экономическую структуру Маньчжоу-го её доходы принесут богатство и процветание."
 MAN_total_economic_coherence_2:0 "Полная экономическая согласованность"
 MAN_total_economic_coherence_2_desc:0 "Непрерывные реформы маньчжурского правительства завершились созданием идеально организованной и эффективной имперской экономики, выстроенной сверху донизу. Подобно хорошо смазанному механизму, наша экономика теперь способна удовлетворять потребности Японской империи, Квантунской армии и, разумеется, маньчжурского народа."
 MAN_officer_academies_2:0 "Учредить офицерские академии"
 MAN_officer_academies_2_desc:0 "Чтобы создать хотя бы относительно надёжную и самодостаточную армию, государство [MAN.GetName] должно подготовить уверенный в себе офицерский корпус, преданный нашему делу."
 MAN_labor_corps_2:0 "Маньчжурский трудовой корпус"
 MAN_labor_corps_2_desc:0 "Если у государства [MAN.GetName] и есть что-то в избытке, так это рабочая сила. Её можно использовать и в военных целях, например для обслуживания и ремонта военных объектов."
 MAN_special_river_detachments_2:0 "Специальные речные отряды"
 MAN_special_river_detachments_2_desc:0 "Чтобы Маньчжурская армия могла эффективно содействовать замыслам наших господ, какими бы они ни были, необходимо создать специализированный корпус, способный превосходно выполнять поставленные задачи. Мы не можем сравниться с Квантунской армией во всём, но благодаря специализации всё же будем полезны!"
 MAN_military_supplies_requisition_law_2:0 "Принять закон о реквизиции военных припасов"
 MAN_military_supplies_requisition_law_2_desc:0 "Принятие закона о реквизиции военных припасов позволит правительству изымать землю и ресурсы для военных нужд, когда это будет сочтено необходимым, а также официально даст властям право призывать рабочих для помощи армии."
 MAN_auxiliary_forces_2:0 "Вспомогательные силы"
 MAN_auxiliary_forces_2_desc:0 "Для создания слаженной боевой силы незаменимы вспомогательные подразделения, поддерживающие порядок в тылу."
 MAN_self_sufficient_military_2:0 "Самодостаточная армия"
 MAN_self_sufficient_military_2_desc:0 "Предыдущие реформы маньчжурского правительства наконец превратили армию из шайки подкупленных бандитов в полноценную и надёжную силу, способную содействовать японским операциям и самостоятельно вести наступление."
 MAN_reinforce_the_heilongjiang_2:0 "Укрепить Хэйлунцзян"
 MAN_reinforce_the_heilongjiang_2_desc:0 "Государство [SOV.GetName], несомненно, представляет величайшую угрозу японским имперским владениям на континенте и самому государству [MAN.GetName]. Мы должны направить усилия правительства на строительство военной инфраструктуры и системы снабжения, достаточной для операций вдоль границы."
 MAN_reinforce_east_hebei_2:0 "Укрепить Восточный Хэбэй"
 MAN_reinforce_east_hebei_2_desc:0 "Императорское правительство Японии выразило желание расширить операции против националистического правительства, возглавляемого [CHI.GetLeader]. Мы поможем ему, вложившись в укрепление Восточного Хэбэя и обеспечив возможность манёвров на материке для маньчжурской и японской армий."
 MAN_the_kwantung_connection_2:0 "Квантунские связи"
 MAN_the_kwantung_connection_2_desc:0 "Начальник штаба Квантунской армии Итагаки Сэйсиро поддерживает хорошие отношения с влиятельным генералом и политиком Тодзё Хидэки. Эта связь даёт нам возможность убедить японское правительство отказаться от поддержки соперничающего правительства Гоминьдана и вместо этого поддержать наши законные притязания на Китай."
 MAN_imperial_tianjin_conference_2:0 "Имперская Тяньцзиньская конференция"
 MAN_imperial_tianjin_conference_2_desc:0 "Будущее государства [MAN.GetName], владеющего всем Китаем, будет решаться главным образом в Токио, а не в самом Китае. Чтобы опередить любые решения о будущем руководстве нового китайского государства, маньчжурское правительство и Квантунская армия созвали конференцию в оккупированном Тяньцзине, пригласив представителей всех заинтересованных сторон в Китае, входящих в японскую сферу."
 MAN_order_under_the_marshal_2:0 "Порядок под властью маршала"
 MAN_order_under_the_marshal_2_desc:0 "После довольно неожиданного назначения второстепенного военачальника [MAN.GetLeader] президентом и, следовательно, марионеточным руководителем государства [MAN.GetName], поддержание порядка в сельской местности, особенно на бывших территориях Гоминьдана, приобрело первостепенное значение. На всём материке будет введено военное положение."
 MAN_lessons_of_the_warlord_era_2:0 "Уроки эпохи милитаристов"
 MAN_lessons_of_the_warlord_era_2_desc:0 "Многочисленные конфликты между военачальниками, в которых [MAN.GetLeader] и сам был одним из главных участников, стали одними из немногих крупномасштабных военных столкновений межвоенного периода. Изучение применявшихся стратегий и тактик может многому нас научить."
 MAN_honor_the_military_2:0 "Почтить армию"
 MAN_honor_the_military_2_desc:0 "С введением военного положения армия получила широкие полномочия, поэтому важно показать народу, что маньчжурская армия является достойным учреждением, защищающим его от бандитов и предателей."
 MAN_back_to_the_basics_2:0 "Вернуться к основам"
 MAN_back_to_the_basics_2_desc:0 "После поражения правительства Гоминьдана план, разработанный на Тяньцзиньской конференции, наконец можно осуществить. Под номинальным руководством маршала-президента [MAN.GetLeader] по всему Китаю будет создана лига автономных коллаборационистских губернаторств военачальников. Ослабляя центральное правительство, она обеспечит японский контроль над огромными территориями Китая при минимальных административных расходах."
 MAN_return_of_the_manchus_2:0 "Возвращение маньчжуров"
 MAN_return_of_the_manchus_2_desc:0 "После коронации Айсиньгёро Пуцзе императором Китая и устранения его некомпетентного брата мы обратимся к истории Цин, которые вступили в борьбу с коррумпированным китайским правительством, чтобы вернуть Китаю истинное величие, как это делаем сейчас мы. Смерть республиканству!"
 MAN_the_republican_disgrace_2:0 "Республиканский позор"
 MAN_the_republican_disgrace_2_desc:0 "После свержения династии Цин в 1911 году и внедрения в Китае пагубных республиканских идеалов прежняя централизация распалась на скопище враждующих военачальников, утративших уважение к власти. Это следует признать самой чудовищной катастрофой в истории Китая. Республиканство в Китае необходимо искоренить, а порядок — восстановить."
 MAN_vanguard_of_the_state_2:0 "Авангард государства"
 MAN_vanguard_of_the_state_2_desc:0 "Маньчжурская императорская гвардия, церемониальным командиром которой является сам император [MAN.GetLeader], будет расширена до небольшой, но элитной силы, способной выполнять особые задачи от имени императора бок о бок с Императорской армией Японии."
 MAN_a_tale_of_two_emperors_2:0 "Повесть о двух императорах"
 MAN_a_tale_of_two_emperors_2_desc:0 "Китайская империя наконец восстановлена! Хотя её законные правители вновь стоят у руля, мы не можем забывать, кто привёл нас к этому. Без наших благожелательных господ в Японии наше наследие было бы уничтожено республиканством и бандитизмом. Мы должны не просто принять, но и приветствовать своё положение подчинённой империи при Хризантемовом троне."
 MAN_our_place_in_the_empire_2:0 "Наше место в империи"
 MAN_our_place_in_the_empire_2_desc:0 "Мы должны признать, что судьба Маньчжурии принадлежит самой Маньчжурии. Мы останемся отдельными от центрального правительства Китая и извлечём из этого всё возможное! Мы продолжим стремительное промышленное и экономическое развитие и покажем миру славу Нового порядка в Азии!"
 MAN_mongol_dominion_2:0 "Монгольский доминион"
 MAN_mongol_dominion_2_desc:0 "Правление [MEN.GetLeader] в лучшем случае оппортунистично, а в худшем — предательско. Государство Внутренней Монголии выполнило своё предназначение и будет включено в состав государства [MAN.GetName]."
 MAN_request_continental_territory_2:0 "Запросить материковые территории"
 MAN_request_continental_territory_2_desc:0 "Хотя мы признаём своё положение как государства [MAN.GetName], запрос территорий вблизи наших нынешних границ может помочь нашему господину сократить административные расходы и предоставить нам дополнительную рабочую силу и ресурсы."
 MAN_mukden_convention_2:0 "Мукденская конвенция"
 MAN_mukden_convention_2_desc:0 "Теперь, когда мы утвердили своё положение как государства, отдельного от Китая, остаётся вопрос бывших территорий старой Цин, похищенных Российской империей. Мы созовём в Мукдене конвенцию с участием японских чиновников и военных делегатов, чтобы решить, следует ли нам предъявлять права на бывшие владения Цин в Монголии и Внешней Маньчжурии."
 MAN_depose_the_weak_monarch_2:0 "Свергнуть слабого монарха"
 MAN_depose_the_weak_monarch_2_desc:0 "Правление Пу И возникло как средство обретения международной легитимности и представления нас законными правителями Китая. Но теперь, отказавшись от притязаний на Китай, мы больше не нуждаемся в видимости того, что Пу И управляет нашим государством. Он должен уйти. Его устранение не вызывает сомнений, но вопрос преемника куда сложнее."
 MAN_reorganize_the_kwantung_army_2:0 "Реорганизовать Квантунскую армию"
 MAN_reorganize_the_kwantung_army_2_desc:0 "Теперь, когда Квантунская армия получила абсолютный контроль над государством [MAN.GetName], её отношения с самим государством необходимо пересмотреть. Квантунская армия будет объединена с существующими маньчжурскими вооружёнными силами в Континентальную пограничную армию. Прежде чем это произойдёт, обе структуры необходимо реорганизовать."
 MAN_establish_continental_frontier_army_2:0 "Учредить КПА"
 MAN_establish_continental_frontier_army_2_desc:0 "Подготовка завершена, и теперь можно учредить Континентальную пограничную армию. Командиры Квантунской армии, прежде державшие власть лишь из-за спин маньчжурских марионеточных руководителей, займут официальные должности и смогут эффективнее применять свой опыт на благо государства [MAN.GetName]."
 MAN_technological_supremacy_2:0 "Технологическое превосходство"
 MAN_technological_supremacy_2_desc:0 "Один из способов доказать наше превосходство и подтвердить законность Нового порядка в Азии — добиться технологического превосходства над соседними странами и даже европейскими державами."
 MAN_the_imperial_wildcard_2:0 "Имперский непредсказуемый игрок"
 MAN_the_imperial_wildcard_2_desc:0 "Поначалу изображая компромиссного кандидата, Киси вскоре после вступления в должность показал истинное лицо. Используя связи в Токио, он быстро избавился от Квантунской армии и её влияния, а оставшихся промышленников заставил действовать только под своим надзором. Он предоставил дзайбацу полную свободу эксплуатировать государство [MAN.GetName] — разумеется, под своим контролем."
 MAN_council_of_corporations_2:0 "Совет корпораций"
 MAN_council_of_corporations_2_desc:0 "Создание совета всех экономических субъектов государства [MAN.GetName] позволит эффективнее координировать промышленное развитие, а правительство сможет быстро реагировать на опасения инвесторов."
 MAN_the_council_of_corporations_desc:0 "Создание совета всех экономических субъектов государства [MAN.GetName] позволит эффективнее координировать промышленное развитие, а правительство сможет быстро реагировать на опасения инвесторов."
 MAN_the_concord_of_ethnicities_2:0 "Согласие народов"
 MAN_the_concord_of_ethnicities_2_desc:0 "Возвышение Ассоциации согласия при поддержке промышленников позволяет нам ещё шире развить замысел паназиатского государства, в котором коренные народы региона сотрудничают друг с другом."
 MAN_the_pan_asian_dream_2:0 "Паназиатская мечта"
 MAN_the_pan_asian_dream_2_desc:0 "При правлении Ассоциации согласия действенная пропаганда распространялась не только в Маньчжурии, но и на союзных территориях. Это вызвало приток множества людей, бежавших от войны в Китае или японской оккупации Кореи, и принесло нам пользу от большого числа беженцев во имя паназиатской мечты."
 MAN_central_control_2:0 "Совершенная диктатура"
 MAN_central_control_2_desc:0 "Киси создал в Маньчжурии то, о чём другие диктаторы могут лишь мечтать: государство, где ничто не происходит без его ведома; государство, где каждая действующая сторона понимает, что должна быть верна своему вождю, иначе будет раздавлена; государство, где никто не осмеливается противостоять головорезам главы исполнительной власти."
 MAN_operation_kantokuen_2:0 "Операция «Кантокуэн»"
 MAN_operation_kantokuen_2_desc:0 "Пришло время сокрушить главного врага нашего Нового порядка в Азии. Русские веками оккупировали азиатские земли, объявляя их своими. Объединённый союз азиатских народов вновь сокрушит их высокомерие! Мы должны подготовить вооружённые силы к долгому походу в Сибирь, чтобы раз и навсегда изгнать европейские войска."
 MAN_greater_manchuria_2:0 "Великая Маньчжурия"
 MAN_greater_manchuria_2_desc:0 "Государство [MAN.GetName] должно стремиться вернуть территории Внешней Маньчжурии, похищенные русскими в 1858 и 1860 годах. §RПритязания на земли, столь долго не находившиеся под нашим контролем, дестабилизируют страну, но освобождение Азии стоит каждой капли крови!§!"
 MAN_beyond_baikal_2:0 "За Байкалом"
 MAN_beyond_baikal_2_desc:0 "Чтобы по-настоящему показать миру наш рай паназиатских народов, наши притязания должны простираться за озеро Байкал и охватить всех монголов, бурят и другие народы! §RПритязания на столь обширные территории серьёзно дестабилизируют страну, но мы должны остаться верны делу паназиатизма!§!"
 MAN_revise_imperial_treaties_2:0 "Пересмотреть имперские договоры"
 MAN_revise_imperial_treaties_2_desc:0 "Подготовка завершена, и время пришло! Айгунский и Пекинский договоры будут пересмотрены, а наши территории — возвращены! Европейские колонизаторы будут изгнаны за Урал! §RОбъявление войны государству, превосходящему нас по силе, вызовет пораженчество в армии.§!"
 MAN_liberation_is_nigh_2:0 "Освобождение близко!"
 MAN_liberation_is_nigh_2_desc:0 "Нам удалось освободить территории, на которые претендовало правительство. §GХотя это помогает искоренять пораженчество§, до капитуляции русских ещё далеко!"
 MAN_propagate_nanshinron_2:0 "Распространять доктрину «Нансин-рон»"
 MAN_propagate_nanshinron_2_desc:0 "Доктрину «Нансин-рон», принятую японским правительством, необходимо распространить в государственных кругах, чтобы обеспечить мобилизацию против врагов Нового порядка в Азии. Для подготовки к войне с враждебными странами будет развёрнуто военное строительство."
 MAN_pressure_tibet_2:0 "Оказать давление на Тибет"
 MAN_pressure_tibet_2_desc:0 "[TIB.GetName] мешает нам угрожать [RAJ.GetName]. Они должны либо подчиниться японскому контролю и принять наше компромиссное предложение об уступке Цинхая, либо быть сокрушены мощью Нового порядка в Азии. Мы предъявим ультиматум."
 MAN_the_kashmir_border_2:0 "Кашмирская граница"
 MAN_the_kashmir_border_2_desc:0 "Кашмирская граница — второй после Бирмы возможный плацдарм для наземных операций против [RAJ.GetName]. Мы должны обеспечить наличие достаточной инфраструктуры и снабжения для поддержки подобных манёвров."
 MAN_remodel_the_river_detachments_2:0 "Реорганизовать речные отряды"
 MAN_remodel_the_river_detachments_2_desc:0 "Наши враги в Азии владеют множеством колоний, освободить которые можно лишь посредством крупномасштабных морских операций. Мы реорганизуем речные отряды, чтобы они могли проводить морские десанты."
 MAN_hainan_forward_operating_base_2:0 "Передовая оперативная база на Хайнане"
 MAN_hainan_forward_operating_base_2_desc:0 "Хайнань идеально подходит для размещения передовой оперативной базы морских десантов. Мы укрепим остров, чтобы там можно было разместить крупные силы морской пехоты и Императорский флот Японии."
 MAN_assume_continental_responsibilities_2:0 "Взять на себя континентальные обязанности"
 MAN_assume_continental_responsibilities_2_desc:0 "Взяв на себя обычные гарнизонные и оборонительные обязанности, мы снизим нагрузку на Императорскую армию и флот Японии и позволим им проводить наступательные операции. Наши войска будут должным образом приспособлены к службе в условиях Бирмы и Малайи."
 MAN_new_imperial_chinese_navy_2:0 "Новый императорский флот"
 MAN_new_imperial_chinese_navy_2_desc:0 "После ликвидации Квантунской армии мы укрепим собственные вооружённые силы и воссоздадим наш Императорский флот!"
 MAN_manchurian_auxiliary_navy_2:0 "Маньчжурский вспомогательный флот"
 MAN_manchurian_auxiliary_navy_2_desc:0 "Мы вложимся в развитие военно-морского потенциала, чтобы расширить торговлю и помочь Императорскому флоту Японии."
 KMT_national_catastrophe_trigger_tt:0 "Этот фокус будет пропущен, когда §Y[ROOT.GetNameDef]§! окажется под властью §Yфашистского§! или §Yкоммунистического§! государства, не придерживаясь соответствующей идеологии."
 KMT_dues_to_our_overlord_tt:0 "§R§YГражданская промышленность для целевой страны§! и §Yвоенная промышленность для целевой страны§! перейдут нашему новому сюзерену.§!"
 KMT_elections_held_tt:0 "Выборы проведены, а результаты объявлены"
 KMT_ycp_victory_trigger_tooltip:0 "§8YCP§! победила на выборах"
 KMT_cdsp_victory_trigger_tooltip:0 "§OCDSP§! победила на выборах"
 KMT_lkmt_victory_trigger_tooltip:0 "§9Левые§! победили в борьбе за власть внутри §2KMT§!, а §2KMT§! победила на выборах"
 KMT_ckmt_victory_trigger_tooltip:0 "§2Центристы§! победили в борьбе за власть внутри §2KMT§!, а §2KMT§! победила на выборах"
 KMT_rkmt_victory_trigger_tooltip:0 "§gПравые§! победили в борьбе за власть внутри §2KMT§!, а §2KMT§! победила на выборах"
 KMT_status_quo_tt:0 "Национальный конгресс договорился сохранить статус-кво"
 KMT_final_electoral_preparations_tt:0 "Партия победила на Национальном конгрессе"
 KMT_the_eternal_dictator_tt:0 "Чан победил на Национальном конгрессе"
 KMT_harpo_1:0 "Влияние HAPRO"
 KMT_harpo_2:0 "Влияние HAPRO"
 KMT_harpo_3:0 "Влияние HAPRO"
 KMT_harpo_4:0 "Влияние HAPRO"
 KMT_harpo_5:0 "Влияние HAPRO"
 KMT_harpo_6:0 "Влияние HAPRO"
 KMT_harpo_7:0 "Влияние HAPRO"
 KMT_harpo_8:0 "Влияние HAPRO"
 KMT_harpo_9:0 "Влияние HAPRO"
 KMT_harpo_10:0 "Влияние HAPRO"
 KMT_harpo_ongoing:0 "Одно из решений §YHAPRO§! уже выполняется"
