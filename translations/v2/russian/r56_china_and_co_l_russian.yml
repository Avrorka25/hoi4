 KMT_ill_protected_central_plain:0 "Плохо защищённая Центральная равнина"
 KMT_ill_protected_central_plain_desc:0 "С большинством сил, мобилизованных для борьбы с полевыми командирами, мы отчаянно подвергаем нашу границу возможной внешней угрозе."
