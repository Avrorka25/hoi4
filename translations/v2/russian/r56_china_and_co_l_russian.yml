 KMT_continue_land_reform3:0 "Продолжить земельную реформу"
 KMT_continue_land_reform2:0 "Продолжить земельную реформу"
 KMT_continue_land_reform:0 "Продолжить земельную реформу"
 KMT_democracy:0 "Демократия"
 KMT_democracy_desc:0 "Один из основополагающих принципов Гоминьдана — демократия, и в будущем мы создадим её во всём великолепии! Рано или поздно демократия придёт в Китай..."
 KMT_nationalism:0 "Национализм"
 KMT_nationalism_desc:0 "Главный принцип нашей революции — национализм! Китай будет преобразован в национальное государство, и все китайцы должны объединиться!"
 KMT_socialism:0 "Социализм"
 KMT_nanjing_academy_of_the_sciences:0 "Нанкинская академия наук"
 KMT_nanjing_academy_of_the_sciences_desc:0 "Теперь мы создадим собственную академию наук, обеспечив долгосрочный успех революции благодаря высококачественным исследованиям."
 KMT_deal_with_the_traitors:0 "Разобраться с предателями"
 KMT_deal_with_the_traitors_desc:0 "Некоторые были не слишком рады тому, что мы взяли Китай под контроль, и даже выступили против нас. Эти предатели заслуживают смерти и получат её."
 KMT_purge_of_the_academies:0 "Чистка академий"
 KMT_purge_of_the_academies_desc:0 "Наши академии полны предателей, выступающих против нас и революции. Этому необходимо немедленно положить конец."
 KMT_ensure_party_purity:0 "Обеспечить чистоту партии"
 KMT_ensure_party_purity_desc:0 "Мы должны обеспечить чистоту нашей партии. Все будут следовать линии председателя!"
 KMT_crackdown_on_the_confucianists:0 "Расправа с конфуцианцами"
 KMT_crackdown_on_the_confucianists_desc:0 "Эти предатели и распространители народного опиума должны умереть, а их инакомыслие — быть подавлено."
 KMT_purge_of_the_generals:0 "Чистка генералов"
 KMT_purge_of_the_generals_desc:0 "У нас много генералов, которые выступают против нас и сохраняют верность старому китайскому режиму. Старое должно уйти, новое должно прийти."
 KMT_the_great_purge_successful:0 "Культурная революция увенчалась успехом"
 KMT_the_great_purge_successful_desc:0 "Наша Культурная революция достигла огромного успеха! Теперь революция наконец продолжится беспрепятственно."
 KMT_deal_with_bluehirt_remnants:0 "Разобраться с остатками Синерубашечников"
 KMT_deal_With_bluehirt_remnants_desc:0 "Синерубашечники причинили нашему народу много зла и были настоящим бедствием. Теперь с ними наконец будет покончено."
 KMT_socialism_desc:0 "По словам Сунь Ятсена, последним принципом революции Гоминьдана является социализм. Мы используем его, чтобы заботиться о нашем народе и обеспечить ему справедливость."
 KMT_the_peoples_tutelage:0 "Народная опека"
 KMT_the_peoples_tutelage_desc:0 "Чтобы установить демократию в Китае, мы воспользуемся народной опекой и обучим наш народ принципам демократии."
 KMT_demand_return_of_the_concessions:0 "Потребовать возвращения концессий"
 KMT_demand_return_of_the_concessions_desc:0 "Теперь мы должны потребовать возвращения концессий. Китай будет объединён, и начнём мы с наших портов!"
 KMT_smite_corruption:0 "Искоренить коррупцию"
 KMT_smite_corruption_desc:0 "Пришло время искоренить коррупцию в Китае, уничтожив все её остатки, чтобы Китай смог освободиться от собственных пороков."
 KMT_crackdown_on_communist_organizations:0 "Расправа с коммунистами"
 KMT_crackdown_on_communist_organizations_desc:0 "Мы начнём расправу с коммунистами в нашей стране и очистим её от их отвратительного влияния!"
 KMT_chaing_reinvigored:0 "Чан вновь полон сил"
 KMT_party_empowered:0 "Партия усилена"
 KMT_increase_collaboration_with_the_blueshirts:0 "Расширить сотрудничество с Синерубашечниками"
 KMT_increase_collaboration_with_the_blueshirts_desc:0 "Чан расширяет сотрудничество с Синерубашечниками, позволяя их влиянию участвовать в формировании нашей страны. Это принесёт нам великую победу!"
 KMT_maintain_the_red_generals_supremacy:0 "Сохранить верховенство Чана"
 KMT_maintain_the_red_generals_supremacy_desc:0 "Правительство должно сохранить верховенство генералиссимуса в Китае! Слава Чану и его руководству нашим великим государством!"
 KMT_create_the_cbis:0 "Создать CBIS"
 KMT_create_the_cbis_desc:0 "Чан создаст CBIS, нашу великую шпионскую организацию, чтобы обеспечить нашу власть в государстве и обеспечить волю Гоминьдана."
 KMT_crackdown_on_capitalist:0 "Расправа с преступностью"
 KMT_crackdown_on_capitalist:0 "CBIS нанесёт удар по всей преступности в нашей стране, схватит и заключит злодеев, невзирая на их взятки!"
 KMT_push_the_fabi:0 "Расширить обращение фаби"
 KMT_push_the_fabi_desc:0 "Необходимо распространить нашу новую валюту, фаби, по всему Китаю. Мы используем её, чтобы укрепить контроль над промышленностью и создать значительные финансовые резервы."
 KMT_a_new_court:0 "Новый суд"
 KMT_a_new_court_desc:0 "Партия создаст в нашей стране новый суд, чтобы облегчить переход к демократии и воплотить нашу волю в отношении государства."
 KMT_reinvigorate_the_white_terror:0 "Возобновить Белый террор"
 KMT_reinvigorate_the_white_terror_desc:0 "CBIS возобновит Белый террор в Китае. Оппозиция и коммунисты будут вычищены и уничтожены, а Синерубашечники — усилены. Да здравствует партия!"
 KMT_declare_martial_law:0 "Объявить военное положение"
 KMT_declare_martial_law_desc:0 "Теперь, когда Белый террор установлен, пора официально закрепить то, что мы уже делаем. Мы объявим военное положение, что позволит нам продолжать действовать безнаказанно."
 KMT_prepare_for_new_elections:0 "Подготовиться к новым выборам"
 KMT_prepare_for_new_elections_desc:0 "Партия начнёт подготовку к новым выборам, устраняя последние препятствия на пути к их проведению."
 KMT_consolidate_party_supremacy:0 "Укрепить верховенство партии"
 KMT_consolidate_party_supremacy_desc:0 "Правительство укрепит верховенство партии, позволив нам действовать без оглядки на Чана и дать демократии расцвести!"
 KMT_enforce_chaings_compliance:0 "Добиться подчинения Чана"
 KMT_enforce_chaings_compliance_desc:0 "Партия добьётся подчинения Чана нашему делу. Теперь он должен объявить о готовности уйти в отставку и передать нам управление страной."
 KMT_a_new_constitution:0 "Завершить проект конституции"
 KMT_a_new_constitution_desc:0 "Чан и партия усердно работали, чтобы наконец завершить проект конституции и дать нашему государству полноценный основной закон. Осталось лишь решить, кто извлечёт из него выгоду..."
 KMT_seize_merchant_assets:0 "Конфисковать имущество торговцев"
 KMT_seize_merchant_assets_desc:0 "Чтобы уравнять благосостояние китайского народа, государство должно конфисковать имущество богатых торговцев, ведущих дела в Китае, и вернуть народу то, что принадлежит ему по праву. Мы больше не потерпим тех, кто наживается на рабочем классе!"
 KMT_legalize_the_party_left:0 "Легализовать левое крыло партии"
 KMT_legalize_the_party_left_desc:0 "Чан вновь легализует левое крыло партии, чтобы создать великий единый фронт против японцев."
 KMT_nationalize_bourgeoise_industries:0 "Национализировать капиталистическую собственность"
 KMT_nationalize_bourgeoise_industries_desc:0 "Государство наконец национализирует предприятия капиталистов, лишающих китайских рабочих того, что принадлежит им по праву! Китай освободится от таких злодеев."
 KMT_legitimize_the_fabi:0 "Узаконить фаби"
 KMT_legitimize_the_fabi_desc:0 "Теперь, когда новая валюта введена и распространена по всему Китаю, мы займёмся её узакониванием, чтобы в ближайшем будущем Китай обрёл великую экономику!"
 KMT_seize_foreign_assets:0 "Конфисковать иностранные активы"
 KMT_seize_foreign_assets_desc:0 "Китай конфискует активы иностранных империалистов, посягающих на нашу страну."
 KMT_consolidate_government_control_of_industry:0 "Укрепить государственный контроль над промышленностью"
 KMT_consolidate_government_control_of_industry_desc:0 "Теперь мы можем укрепить контроль над промышленностью страны и обеспечить власть над ней, чтобы поддержать наше промышленное превосходство."
 KMT_push_for_full_control:0 "Полный контроль над отраслями"
 KMT_push_for_full_control_desc:0 "Находясь в тяжёлом положении, мы можем использовать его, чтобы добиться полного контроля над китайской промышленностью и установить государственную монополию вопреки капиталистам."
 KMT_promise_multiparty_elections:0 "Пообещать многопартийные выборы"
 MAN_kwantung_veto_2:0 "Квантунское вето"
 KMT_promise_multiparty_elections_desc:0 "Партия пообещает многопартийные выборы в Китае, открыв путь к значительной свободе в будущем."
 KMT_uphold_the_concept_of_dang_guo:0 "Сохранить принцип «Дан Го»"
 KMT_uphold_the_concept_of_dang_guo_desc:0 "Партия обеспечит сохранение принципа Дан Го — партийного государства, объединив партию и государство и закрепив постоянную власть Гоминьдана."
 KMT_empower_the_kmt_beurocracy:0 "Усилить бюрократию Гоминьдана"
 KMT_empower_the_kmt_beurocracy_desc:0 "Режим усилит бюрократию Гоминьдана, дав ей свободу действий и возможность служить благу страны."
 KMT_fufill_the_promise_of_land_reform:0 "Выполнить обещание земельной реформы"
 KMT_fufill_the_promise_of_land_reform_desc:0 "Мы пообещали народу земельную реформу и потому обязаны выполнить обещание. Таково требование народа."
 KMT_sell_public_land:0 "Продать государственные земли"
 KMT_sell_public_land_desc:0 "Одним из ключевых шагов станет продажа земель, принадлежащих государству. Это поможет выполнить наши обещания и удовлетворить народ."
 KMT_arable_rent_reduction_act:0 "Закон о снижении арендной платы за пахотные земли"
 KMT_arable_rent_reduction_act_desc:0 "Государство снизит максимальную арендную плату за пахотные земли. Это сделает аренду намного доступнее для народа и повысит производительность."
 KMT_land_to_the_tiller:0 "Земля — земледельцу"
 KMT_land_to_the_tiller_desc:0 "Наконец мы заставим крупных землевладельцев передать землю тем, кто её обрабатывает, восстановив справедливость для этих бедных работников."
 KMT_revive_the_new_life_movement:0 "Возродить движение «Новая жизнь»"
 KMT_revive_the_new_life_movement_desc:0 "Чтобы сделать Китай великим, мы должны сделать великим и китайский народ. Ради этого мы возродим движение «Новая жизнь», чтобы китайцы стали добродетельными и достойными гражданами."
 KMT_disband_the_blueshirts:0 "Распустить Синерубашечников"
 KMT_disband_the_blueshirts_desc:0 "Ради стабильности нашей державы мы распустим Синерубашечников, чтобы править без серьёзных проблем, которые они постоянно создают."
 KMT_violence_is_the_ulimate_means_of_political_expression:0 "Насилие — истинная форма политического выражения"
 KMT_violence_is_the_ulimate_means_of_political_expression_desc:0 "Мы, Синерубашечники, считаем насилие высшей формой политического выражения. Мы примем эту жизненную истину и обратим её себе на пользу."
 KMT_elitism:0 "Элитизм"
 KMT_elitism_desc:0 "Чтобы Китай преуспел, им должна править элита. Простолюдины не способны управлять Китаем, и мы должны ясно это показать."
 KMT_rural_reconstruction_movement:0 "Движение за реконструкцию деревни"
 KMT_rural_reconstruction_movement_desc:0 "Партия поддержит движение за восстановление Китая и поможет развивать сельские общины. Это склонит китайский народ на нашу сторону."
 KMT_ensure_popular_support:0 "Обеспечить народную поддержку"
 KMT_ensure_popular_support_desc:0 "Наша пропаганда обеспечит народную поддержку режиму, чтобы переход к демократии прошёл легко."
 KMT_help_establish_a_range_of_parties:0 "Помочь создать множество партий"
 KMT_help_establish_a_range_of_parties_desc:0 "Гоминьдан должен помочь созданию небольших партий по всему Китаю, чтобы стало возможно установление демократии."
 KMT_enforce_lenninist_standards:0 "Обеспечить соблюдение ленинских норм"
 KMT_enforce_lenninist_standards_desc:0 "Мы должны сохранить большевизацию Гоминьдана и обеспечить соблюдение ленинских норм, подавляя инакомыслие в партии ещё до его возникновения."
 KMT_prepare_national_liberation:0 "Подготовиться к национальному освобождению"
 KMT_prepare_national_liberation_desc:0 "По мере стабилизации режима настало время готовиться к освобождению Маньчжурии и стремиться освободить там народ от японцев! Для этого мы отправим туда так называемых бандитов, чтобы подорвать японское правление и бороться за свободу."
 KMT_the_power_of_confucious:0 "Сила Конфуция"
 KMT_the_power_of_confucious_desc:0 "Чан начинает идеологическую обработку, чтобы китайский народ поверил в силу Конфуция и его учения. Это вернёт нас к корням и к тому, что действительно сделало нас великими."
 KMT_confucian_fascism:0 "Конфуцианский фашизм"
 KMT_confucian_fascism_desc:0 "Некоторые критикуют Чана, называя его конфуцианским фашистом. Мы не отвергаем это — возможно, сочетание этих двух идей принесёт великие результаты."
 KMT_control_chinese_life:0 "Полный контроль над новой китайской жизнью"
 KMT_control_chinese_life_desc:0 "Мы хотим полностью контролировать китайскую жизнь и обеспечим ее. Мы будем обеспечивать соблюдение стандартов новой китайской жизни, независимо от последствий."
 KMT_li_proper_rite:0 "Ли — надлежащий ритуал"
 KMT_li_proper_rite_desc:0 "Мы сосредоточимся на добродетели соблюдения надлежащих ритуалов китайским народом. Мы поступим так, как от нас ожидается, чтобы сделать Китай великим и победоносным!"
 KMT_yi_righteousness_and_justice:0 "Йи (праведность и справедливость)"
 KMT_yi_righteousness_and_justice_desc:0 "Мы позаботимся о том, чтобы привить новой китайской жизни чувство праведности и справедливости. Это поможет нам создать сплочённую рабочую силу."
 KMT_lian_honesty_and_cleanliness:0 "Лиан (Честность и чистота)"
 KMT_lian_honesty_and_cleanliness_desc:0 "Чтобы Китай стал по-настоящему великим, наш народ должен быть чист как в физическом, так и в духовном смысле. Мы привьём эти добродетели его жизни."
 KMT_chi_shame:0 "Чи (Стыд)"
 KMT_chi_shame_desc:0 "Мы привьём нашему народу чувство стыда — стыда, побуждающего избегать зла и творить добро."
 KMT_the_hundred_rules:0 "Сто правил"
 KMT_the_hundred_rules_desc:0 "Привив народу четыре добродетели, мы установим сто правил, чтобы эти добродетели соблюдались во всех аспектах китайской жизни!"
 KMT_the_virtues:0 "Добродетели"
 KMT_the_virtues_desc:0 "Чтобы создать великую новую китайскую жизнь, мы должны воспитать добродетельный народ."
 KMT_purge_the_liberal_democrats:0 "Чистка либеральных демократов"
 KMT_purge_the_liberal_democrats_desc:0 "Теперь режим проведёт чистку либеральных демократов, выступающих против него. Мы обеспечим их уничтожение и победу нашего великого генералиссимуса."
 KMT_prepare_for_the_national_congress:0 "Подготовиться к Национальному конгрессу"
 KMT_prepare_for_the_national_congress_desc:0 "Теперь обстановка позволяет начать подготовку к следующему Национальному конгрессу и его последствиям для Китая. Когда страна объединена, настало время определить её будущее!"
 KMT_the_nth_national_congress:0 "Следующий Национальный конгресс"
 KMT_the_nth_national_congress_desc:0 "Время пришло! Китай объединён, и теперь мы определим его судьбу! Национальный конгресс начинается."
 KMT_the_true_enemy:0 "Истинный враг"
 KMT_the_foreign_imminent_threat:0 "Неминуемая внешняя угроза"
 KMT_preparations_to_fight_the_soviet_imperialists:0 "Подготовка к борьбе с советскими империалистами"
 KMT_strike_PRC2:0 "Удар по Яньнаньской впадине"
 KMT_SHX_offer2:0 "Предложение Шаньси"
 KMT_military_planning_corps:0 "Корпус военного планирования"
 KMT_military_planning_corps_desc:0 "НРА создаёт новый корпус планирования, благодаря чему вооружённые силы смогут гораздо эффективнее разрабатывать планы борьбы с нашими противниками."
 KMT_coastal_fortifications:0 "Береговые укрепления"
 KMT_ultimatum_to_the_warlords:0 "Ультиматум военным кликам"
 KMT_national_defense_propaganda:0 "Пропаганда национальной обороны"
 KMT_ultimatum_to_tibet:0 "Ультиматум Тибету"
 KMT_befriend_tibet:0 "Подружиться с Тибетом"
 KMT_sinkiang_issue:0 "Синьцзянский вопрос"
 KMT_redraw_the_mcmahon_line:0 "Пересмотреть линию Мак-Магона"
 KMT_the_state_in_one_man:0 "Государство в одном человеке"
 KMT_the_state_in_one_man_desc:0 "Чан воплощает в себе российское государство и ведёт его к славе! Он олицетворяет Китай и приведёт его к величию!"
 KMT_increased_nepotism:0 "Усилить кумовство"
 KMT_increased_nepotism_desc:0 "Клика CC усиливает кумовство в нашем государстве, позволяя Чану назначать своих союзников на ключевые должности."
 KMT_the_eternal_dictator:0 "Вечный диктатор"
 KMT_the_eternal_dictator_desc:0 "Чан наконец добился своего! Он сосредоточил в своих руках всю власть в Китае! Никто не остановит великого диктатора!"
 KMT_no_enemy_in_any_position:0 "Ни одного врага на должностях"
 KMT_no_enemy_in_any_position_desc:0 "Недостаточно заполнить правительство нашими друзьями! Мы очистим государство от любой оппозиции."
 KMT_the_disappearing_opposition:0 "«Исчезающая» оппозиция"
 KMT_the_disappearing_opposition_desc:0 "Настало время, чтобы китайская оппозиция исчезла. Китай освободится от всего этого вырождения!"
 KMT_sideline_the_democrats:0 "Оттеснить демократов"
 KMT_sideline_the_democrats_desc:0 "Демократы в нашей стране будут полностью отстранены, а их робкие последние попытки удержаться за власть — пресечены."
 KMT_empower_the_cc_clique:0 "Усилить «клику CC»"
 KMT_empower_the_cc_clique_desc:0 "Полностью захватив власть, Чан расширит полномочия своих приспешников из клики CC, чтобы они исполняли его волю."
 KMT_the_sword_nephew:0 "Племянник-меч"
 KMT_the_sword_nephew_desc:0 "Теперь Чан поддержит Племянника-меча, который так много сделал для нашей нации и в последние годы возглавлял клику."
 KMT_the_wife:0 "Жена"
 KMT_the_wife_desc:0 "Чан укрепит позиции Сун Мэйлин, своей жены, в выполнении её обязанностей в Китае и поможет ей добиться успеха на благо страны!"
 KMT_a_friend_in_every_position:0 "Друг на каждой должности"
 KMT_a_friend_in_every_position_desc:0 "Клика CC позаботилась о том, чтобы в грядущем Китае на каждой должности был наш друг, позволяя нам править безнаказанно!"
 CHI_break_kmt_tt:0 "Сбросить задание §R«Правительственные репрессии»§! и добавить по 25 дней к каждому его циклу"
