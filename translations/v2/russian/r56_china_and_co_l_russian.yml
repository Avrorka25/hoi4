 KMT_delete_certain_divs_tt:0 "Вы отправитесь в изгнание на все принадлежащие и подконтрольные вам территории Тайваня и Хайнаня, все дивизии за пределами этих земель будут удалены, а вы получите новую ветвь фокусов."
