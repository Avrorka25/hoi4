 MAN_56_event.1.t:0 "Квантунская армия просит поддержки"
 MAN_56_event.1.desc:0 "Квантунская армия попросила нас отправить ей больше оружия и людей, чтобы помочь стабилизировать Маньчжурию и укрепить там её власть. Что мы ответим на эту просьбу?"
 MAN_56_event.1.a:0 "Японские ресурсы принадлежат японцам"
 MAN_56_event.1.b:0 "Мы были бы глупцами, если бы отказали"
 MAN_56_event.2.t:0 "НРА возобновляет операции в Маньчжурии"
 MAN_56_event.2.desc:0 "Стремясь объединить весь Китай, включая наше государство, китайцы решили возобновить операции в Маньчжурии, вновь развязав эту жестокую партизанскую войну.\n\nИными словами, Китай начинает вмешиваться в наш баланс сил, поэтому мы должны следить за этой угрозой или устранить её."
 MAN_56_event.2.a:0 "Наступили тяжёлые времена."
 MAN_56_event.3.t:0 "Маньчжурия в огне"
 MAN_56_event.3.desc:0 "Сегодня император объявил, что пришло время изгнать японцев. Его войска и гарнизоны поднялись, начав масштабное восстание в Маньчжурии, а сопротивление Японии достигло уровня, невиданного со времён Фэнтяньской клики. Лишь время покажет, сумеют ли Пу И и его режим выстоять..."
 MAN_56_event.3.a:0 "Да здравствует Цин"
 MAN_56_event.4.t:0 "Пу И просит нашей помощи"
 MAN_56_event.4.desc:0 "Сегодня Пу И тайно отправил посланника к нашим пограничным постам возле Маньчжурии. Он просит поддержать его тайное восстание, цель которого — покончить с японским влиянием в Маньчжурии...\nХотя некоторые стороны его идеологии нам чужды, это может стать отличной возможностью изгнать японцев с континента."
 MAN_56_event.4.a:0 "Враг моего врага — мой друг"
 MAN_56_event.4.b:0 "Простите, кто?"
 MAN_56_event.4.c:0 "О такой наглости нужно немедленно доложить!"
 MAN_56_event.5.t:0 "[FROM.GetNameDefCap] требует полного ухода из Маньчжурии."
 MAN_56_event.5.desc:0 "За последнее время маньчжуры укрепили власть над своим государством и устали от нашей оккупации нескольких оставшихся регионов. Теперь они требуют вернуть им всю страну. Что нам делать?"
 MAN_56_event.5.a:0 "Эти земли по праву принадлежат Японии!"
 MAN_56_event.5.b:0 "Они уже однажды победили Квантунскую армию и победят снова. Сопротивляться было бы глупо!"
 MAN_56_event.6.t:0 "Пу И просит расширить деятельность бандитов"
 MAN_56_event.6.desc:0 "В Маньчжурии действует множество бандитов, которых финансирует наше правительство. Пу И предложил помочь нам расширить эти операции, чтобы скорее положить конец японскому правлению."
 MAN_56_event.6.a:0 "Способ бороться с японцами? Великолепно!"
 MAN_56_event.6.b:0 "Так он узнает слишком много о наших операциях"
 MAN_56_event.8.t:0 "Пу И просит передать ему Северо-Восточную армию"
 MAN_56_event.8.desc:0 "Северо-Восточная армия под командованием Чжан Сюэляна давно сражается с японцами и жаждет вновь вступить с ними в бой. Поэтому Пу И предложил передать её ему в момент начала заговора, чтобы использовать эти силы для изгнания японцев."
 MAN_56_event.8.a:0 "Раз такова их воля — конечно!"
 MAN_56_event.8.b:0 "Отдать наши войска? Ни за что!"
 MAN_56_event.9.t:0 "Пу И предлагает новую сделку"
 MAN_56_event.9.desc:0 "Видя наше недовольство созданием второго национального правительства в Китае, Пу И предложил сделку: в обмен на огромное количество винтовок он откажется от претензий Цин на все земли за пределами Маньчжурии, обеспечив мир в наше время."
 MAN_56_event.9.a:0 "Сразиться с японцами и обеспечить мир? Ещё бы!"
 MAN_56_event.9.b:0 "Эта земля всё ещё китайская!"
 MAN_56_event.10.t:0 "Шпионы сообщают о подозрительной деятельности..."
 MAN_56_event.10.desc:0 "Наши шпионы сообщили, что Пу И, возможно, действительно замышляет что-то против нас. Прямых доказательств нет, но некоторые улики указывают именно на это..."
 MAN_56_event.10.a:0 "Мы должны сохранять бдительность."
 MAN_56_event.11.t:0 "125-я армия сообщает о попытке подкупа..."
 MAN_56_event.11.desc:0 "125-я армия сообщает, что кто-то пытался её подкупить — вполне возможно, Пу И, желавший склонить её на свою сторону. Прямых доказательств нет, но некоторые улики указывают именно на это..."
 MAN_56_event.11.a:0 "Принято к сведению."
 MAN_56_event.12.t:0 "[FROM.GetNameDefCap] заявляет, что располагает доказательствами маньчжурского восстания"
 MAN_56_event.12.desc:0 "[FROM.GetName] утверждает, что Пу И связался с ними, чтобы установить отношения и получить помощь в свержении нашей власти. Это может быть ложью, но мы крайне насторожены..."
 MAN_56_event.12.a:0 "Мятеж никогда не одолеет нашу страну!"
 MAN_56_event.13.t:0 "Япония пытается низложить императора"
 MAN_56_event.13.desc:0 "Японцы, похоже, считают, что император плетёт против них заговор, и решили устранить его. Теперь император должен решить свою судьбу..."
 MAN_56_event.13.a:0 "Император объявляет конец японскому правлению"
 MAN_56_event.13.b:0 "Император лишает себя жизни"
 MAN_56_event.14.t:0 "Судьба Маньчжурии"
 MAN_56_event.14.desc:0 "После ухода японцев из нашей страны император должен действовать решительно: давление многочисленных сторонников независимости растёт, а Квантунская армия стремится установить контроль над государством. Судьба Маньчжурии воистину висит на шёлковой нити."
 MAN_56_event.14.a:0 "Император объявляет конец японскому правлению"
 MAN_56_event.14.b:0 "Император подчиняется Квантунской армии"
 MAN_56_event.15.t:0 "Под сапогом Квантунской армии"
 MAN_56_event.15.desc:0 "Квантунская армия захватила Маньчжурию для Японии и теперь правит ею, оказывая огромное влияние на все государственные дела и превратив императора в полностью подконтрольную марионетку. Именно она по-настоящему распоряжается в этом псевдогосударстве.\n\nИ всё же Квантунская армия не всесильна и сильно зависит от собственных военных успехов: если она начнёт терпеть поражения на фронте, её власть в тылу также может ослабнуть."
 MAN_56_event.15.a:0 "Принято..."
 MAN_56_event.16.t:0 "Маньчжурия стремится к дальнейшему сотрудничеству"
 MAN_56_event.16.desc:0 "Маньчжурия попросила нас перейти к следующему этапу сотрудничества и навсегда, официально отказаться от наших претензий на неё."
 MAN_56_event.16.a:0 "Это противоречит принципам революции."
 MAN_56_event.16.b:0 "Разумеется, выпьем за наших новых союзников!"
 MAN_56_event.17.t:0 "Маньчжурия погружается в хаос"
 MAN_56_event.17.desc:0 "В ходе нашей войны с Маньчжурией там начался хаос и разгорелась борьба за независимость. Пу И возглавляет наступление, чтобы изгнать японцев — наших истинных врагов — с этого клочка земли на севере Китая."
 MAN_56_event.17.a:0 "Несмотря на это, Пу И всё ещё наш враг."
 MAN_56_event.17.b:0 "Враг нашего врага — наш друг."
