 KMT_neglecting_presidential_dutes:0 "Пренебрежение президентскими обязанностями"
 KMT_centralize_power_desc:0 "После установления нового режима мы сосредоточим власть вокруг нового правительства. Это сделает наше правление незыблемым и принесёт нам великую славу!"
