 KMT_event.1.t:0 "Направление развития НРА"
 KMT_event.1.desc:0 "Мы никогда не собирались ограничиваться контролем лишь над этими небольшими землями. Мы националисты и потому стремимся объединить весь Китай! Это ставит перед нами важный вопрос. Следует ли сперва сосредоточиться на внутренних проблемах, расправившись с коммунистами и военными кликами, или же подготовиться к борьбе с японской угрозой?"
 KMT_event.1.a:0 "Нужно сосредоточиться на настоящем враге — коммунистах!"
 KMT_event.1.b:0 "Сосредоточимся на изгнании японского влияния из Китая!"
 KMT_event.2.t:0 "Гражданская война в Гоминьдане"
 KMT_event.2.desc:0 "В преддверии Китайского национального конгресса между сторонниками Чан Кайши и продемократическими политиками возникли серьёзные разногласия. В результате сформировались два лагеря, и между ними началась гражданская война. Перед нами встал вопрос: кого признать своим законным сюзереном?"
 KMT_event.2.a:0 "Мы никого не признаем и используем возможность, чтобы обрести независимость!"
 KMT_event.2.b:0 "Мы должны поддержать генералиссимуса"
 KMT_event.2.c:0 "Демократия должна спасти Китай!"
 KMT_event.2.d:0 "Мы останемся в стороне и просто примкнём к победителям"
 KMT_event.3.t:0 "NRA уничтожает наши подразделения!"
 KMT_event.3.desc:0 "Пока мы вместе сражались с японцами, наши подразделения были одурачены и зарезаны в спину NRA, что привело к огромным потерям среди наших войск! Это было сделано в рамках националистической чистки коммунистов. Что нам делать в этой ужасной ситуации?"
 KMT_event.3.a:0 "Мы осуждаем Национальное правительство и разрываем с ним все связи!"
 KMT_event.3.b:0 "Без НРА на нашей стороне мы не в состоянии сражаться."
 KMT_event.4.t:0 "Завершение проекта конституции"
 KMT_event.4.desc:0 "Проект конституции завершён, и теперь перед нами лежат два готовых варианта. Мы должны выбрать между тем, который поддерживают сторонники Чан Кайши, и тем, который поддерживают демократы. Какую конституцию утвердят формально?"
 KMT_event.4.a:0 "Мы поддержим Чан Кайши."
 KMT_event.4.b:0 "Мы не можем сделать выбор. Отказаться от проекта!"
 KMT_event.4.c:0 "Мы поддержим демократов"
 KMT_event.5.t:0 "Национальный конгресс Гоминьдана"
 KMT_event.5.desc:0 "Национальный конгресс вот-вот решит судьбу страны, и пришло время выбрать сторону."
 KMT_event.5.a:0 "Мы поддержим сторонников Чан Кайши"
 KMT_event.5.b:0 "Мы поддержим партийную бюрократию"
 KMT_event.6.t:0 "Требования Чан Кайши"
 KMT_event.6.desc:0 "На Национальном конгрессе Чан Кайши первым выходит на трибуну, выступая во благо всего Китая. Что, по его словам, страна должна сделать теперь?"
 KMT_event.6.a:0 "Чан Кайши требует передать ему всю полноту власти..."
 KMT_event.6.b:0 "Пока Чан Кайши не выдвигает требований..."
 KMT_event.7.t:0 "Партия уступает"
 KMT_event.7.desc:0 "Партия приняла требования Чан Кайши! Теперь он единолично обладает всей властью в Китае! Слава национальной революции Чан Кайши!"
 KMT_event.7.a:0 "Великолепно!"
 KMT_event.8.t:0 "Предательство партии"
 KMT_event.8.desc:0 "Партия предала нас! Она выступила против Чан Кайши, и потому он, вопреки её воле, объявил себя диктатором всего Китая! Это заставило партию поднять против нас восстание!"
 KMT_event.8.a:0 "Да помогут нам боги!"
 KMT_event.9.t:0 "Требования партии"
 KMT_event.9.desc:0 "Партия выступила против Чан Кайши и решила изложить свои планы относительно Китая. В чём они заключаются?"
 KMT_event.9.a:0 "Партия требует свободных выборов"
 KMT_event.9.b:0 "Пока у партии нет требований..."
 KMT_event.10.t:0 "Чан Кайши уступает"
 KMT_event.10.desc:0 "Чан Кайши согласился уйти в отставку и допустить свободные выборы. Для Китая наступает новая эпоха!"
 KMT_event.10.a:0 "Великолепно!"
 KMT_event.11.t:0 "Мятеж Чан Кайши"
 KMT_event.11.desc:0 "Чан Кайши решил, что должен захватить власть в стране. Он выдвинул это требование, но мы остановили его, и тогда он воспользовался случаем, чтобы поднять мятеж и начать борьбу против нас."
 KMT_event.11.a:0 "Да помогут нам боги!"
 KMT_event.12.t:0 "Результаты выборов"
 KMT_event.12.desc:0 "Мы объявили результаты выборов, и после напряжённой борьбы стало ясно, что одна группа политиков одержала верх."
 KMT_event.12.a:0 "Гоминьдан, как и ожидалось, снова победил"
 KMT_event.12.b:0 "Победили Карсун и его идеализм"
 KMT_event.12.c:0 "Победу одержала консервативная Партия молодой Китая"
 KMT_event.13.t:0 "Китайское правительство наносит удар по Монголии"
 KMT_event.13.desc:0 "Китайское правительство готовится со дня на день объявить войну Монголии! Что нам делать с этим огромным азиатским фронтом?"
 KMT_event.13.a:0 "Китайцы должны умереть."
 KMT_event.13.b:0 "Ради мира мы согласимся отказаться от Монголии."
 KMT_event.14.t:0 "Китай требует освобождения Индокитая"
 KMT_event.14.desc:0 "После многих лет критики империализма в Азии китайцы наконец обратились к нам и потребовали положить конец угнетению народов Индокитая. Что нам с этим делать?"
 KMT_event.14.a:0 "Мы должны сражаться за наши колонии!"
 KMT_event.14.b:0 "Сухопутная война в Азии того не стоит."
 KMT_event.15.t:0 "Китай требует освобождения Кореи"
 KMT_event.15.desc:0 "После многих лет критики нашего империализма китайцы наконец направили нам ультиматум с требованием уйти из Кореи. Что нам делать?"
 KMT_event.15.a:0 "Мы сохраним наши земли, завоёванные тяжким трудом"
 KMT_event.15.b:0 "Мы должны даровать им свободу"
 KMT_event.16.t:0 "Китай национализирует наши активы"
 KMT_event.16.desc:0 "Гоминьдан национализировал многие наши активы по всему Китаю. Что нам с этим делать?"
 KMT_event.16.a:0 "Это свершившийся факт, и мы ничего не можем сделать."
 KMT_event.16.b:0 "Мы ответим жёстким эмбарго."
 KMT_event.17.t:0 "[PRC.GetNameDefCap] покидает Единый фронт"
 KMT_event.17.desc:0 "После того как мы казнили множество коммунистов, в том числе немало бойцов [PRC.GetNameDef], государство [PRC.GetNameDef] покинуло Единый фронт и осудило нас, назвав предателями и мясниками."
 KMT_event.17.a:0 "Это они предали нацию!"
 KMT_event.18.t:0 "Оливковая ветвь Ван Цзин Вэя"
 KMT_event.18.desc:0 "Ван Цзин Вэй сделал нам предложение. Он сделал нам предложение, по которому мы встретимся на Тайване, чтобы обсудить условия экономического пакта и сделки для нас."
 KMT_event.18.a:0 "Некоторое сближение, возможно, всё же возможно"
 KMT_event.18.b:0 "Мы никогда не пойдём на такое"
 KMT_event.19.t:0 "Тайваньские соглашения"
 KMT_event.19.desc:0 "Китай наконец выполнил обещание заключить с нами сделку. Они предлагают исследовательский договор, по которому предоставят нам долю своей экономики в обмен на помощь в развитии. Кроме того, позднее они предлагают увеличить эту долю путём расширения договора."
 KMT_event.19.a:0 "Бесплатные деньги? Разумеется"
 KMT_event.19.b:0 "Современный Китай? Это станет нашим концом."
 KMT_event.20.t:0 "Китай стремится привлечь японских инвесторов"
 KMT_event.20.desc:0 "Китай предложил продлить наш договор и пригласить наших инвесторов. Это принесёт нам огромную прибыль, но в долгосрочной перспективе укрепит их экономику."
 KMT_event.20.a:0 "Бесплатные деньги? Разумеется"
 KMT_event.20.b:0 "Мы не намерены помогать им таким образом"
 KMT_event.21.t:0 "Китай предлагает программу обмена учёными"
 KMT_event.21.desc:0 "Китай предложил продлить наш договор и запустить программу обмена учёными. Они готовы заплатить, чтобы сделать это выгодным для нас."
 KMT_event.21.a:0 "Бесплатные деньги? Разумеется"
 KMT_event.21.b:0 "Мы не намерены помогать им таким образом"
 KMT_event.22.t:0 "Китай хочет закупать нашу продукцию"
 KMT_event.22.desc:0 "Китай предложил продлить наш договор и закупать огромные объёмы нашей продукции. Это принесёт нам большую прибыль, но позволит им копировать наши технологии."
 KMT_event.22.a:0 "Бесплатные деньги? Разумеется"
 KMT_event.22.b:0 "Мы не намерены помогать им таким образом"
 KMT_event.23.t:0 "Китай стремится получить наши исследования"
 KMT_event.23.desc:0 "Китай предложил продлить наш договор и предоставить нам выгодную ресурсную сделку. Это поможет решить проблему с ресурсами, но значительно ускорит развитие их технологий."
 KMT_event.23.a:0 "Дешёвые ресурсы? Разумеется"
 KMT_event.23.b:0 "Мы не намерены помогать им таким образом"
 KMT_event.24.t:0 "Китай стремится перенять наш опыт"
 KMT_event.24.desc:0 "Китай предложил продлить наш договор и предоставить нам рабочих, которые, вероятно, передадут им часть наших технологических знаний, но зато станут бесплатной рабочей силой для заводов."
 KMT_event.24.a:0 "Бесплатные рабочие? Разумеется"
 KMT_event.24.b:0 "Мы не намерены помогать им таким образом"
 KMT_event.25.t:0 "Китай требует территории"
 KMT_event.25.desc:0 "Китай потребовал, чтобы мы ушли со всех принадлежащих ему земель, которыми владеем. В обмен мы получим право захода в порты, что позволит сохранить наше превосходство на море. В противном случае они нападут на нас, используя своё технологическое преимущество. Что нам делать?"
 KMT_event.25.a:0 "Мы уступим"
 KMT_event.25.b:0 "Наш дух приведёт нас к победе"
 KMT_event.26.t:0 "Китай требует территории для военно-морских баз"
 KMT_event.26.desc:0 "Китай потребовал, чтобы мы ушли со всех принадлежащих ему земель, которыми владеем. В противном случае они нападут на нас, используя своё технологическое преимущество. Что нам делать?"
 KMT_event.26.a:0 "Мы уступим"
 KMT_event.26.b:0 "Наш дух приведёт нас к победе"
 KMT_event.27.t:0 "Китай требует карт-бланш в Маньчжурии"
 KMT_event.27.desc:0 "Китай потребовал предоставить ему карт-бланш в Маньчжурии, чтобы он мог захватить регион без нашего вмешательства. Что нам делать?"
 KMT_event.27.a:0 "Мы уступим"
 KMT_event.27.b:0 "Мы останемся непреклонны"
 KMT_event.28.t:0 "Китай требует карт-бланш в Маньчжурии в обмен на сохранение нашего экономического влияния"
 KMT_event.28.desc:0 "Китай потребовал предоставить ему карт-бланш в Маньчжурии, чтобы он мог захватить регион без нашего вмешательства. Что нам делать?"
 KMT_event.28.a:0 "Мы уступим, в конце концов, они платят нам за это"
 KMT_event.28.b:0 "Мы останемся непреклонны"
 KMT_event.29.t:0 "Япония продаёт нас"
 KMT_event.29.desc:0 "Китай заключил с Японией сделку, по которой нас передадут им. Что нам делать?"
 KMT_event.29.a:0 "Мы уступим, ведь желание Японии для нас закон"
 KMT_event.29.b:0 "Мы должны выжить"
 KMT_event.30.t:0 "Покушение на Вана"
 KMT_event.30.desc:0 "Считая, что Цзинвэй предаёт китайский народ, идя на сближение с Японией, убийца совершил покушение на Ван Цзинвэя и попытался его убить."
 KMT_event.30.a:0 "К счастью, он промахнулся"
 KMT_event.30.b:0 "Похоже, лидер Гоминьдана снова мёртв."
 KMT_event.31.t:0 "Чжан Сюэлян приглашает Чианга отправиться на север"
 KMT_event.31.desc:0 "Чжан Сюэлян пригласил Чана присоединиться к нему на севере, чтобы составить планы о судьбе Китая и его армии. Что нам с этим делать?"
 KMT_event.31.a:0 "Конечно, Китай должен работать вместе."
 KMT_event.31.b:0 "Это пахнет ловушкой."
 KMT_event.32.t:0 "Чжан Сюэлян пытается похитить Чан"
 KMT_event.32.desc:0 "Чтобы попытаться объединить Китай, Сюэлян решил похитить Чана, чтобы заставить его вести переговоры. В этом он устроил засаду, чтобы взять Чианга в плен."
 KMT_event.32.a:0 "Чан храбро сражался, но погиб от превосходящих сил противника."
 KMT_event.32.b:0 "Поддавшись ловушке, Чан согласился пойти с Сюэляном и поговорить с коммунистами."
 KMT_event.33.t:0 "Сюэлян привезет Чан"
 KMT_event.33.desc:0 "Сюэлян решил захватить Чан и привел его к нам, чтобы заставить сесть за стол переговоров."
 KMT_event.33.a:0 "Это похвальная инициатива, но Чанг должен умереть."
 KMT_event.33.b:0 "Мы будем требовать, чтобы он подписал мирное соглашение или умер."
 KMT_event.34.t:0 "Мао поставил Чангу ультиматум"
 KMT_event.34.desc:0 "Мао, получив в руки Чан, выдвинул ему ультиматум. Он должен либо принять мир, либо умереть. Что мы можем сделать из этого?"
 KMT_event.34.a:0 "Мы не будем вести переговоры с предателями."
 KMT_event.34.b:0 "У нас нет выбора. Мы договариваемся."
 KMT_event.35.t:0 "Цзинвэй покончил с собой"
 KMT_event.35.desc:0 "В то время как Япония отвергает наше предложение встретиться и открыто враждебно настроена по отношению к нам, Ван Цзин Вэй покончил с собой, считая будущее Китая безнадежным, а себя первым казнил японец."
 KMT_event.35.a:0 "И всё же из трагедии рождается новая надежда"
 KMT_event.39.t:0 "[CHI.GetNameDef] требует гегемонии над Индокитаем"
 KMT_event.39.desc:0 "Сегодня [CHI.GetNameDef] объявил нам, что требует передать ему нашу колонию в Индокитае для собственной империи. Хотя мы не в состоянии помешать им захватить её, это оскорбление для нас. Что нам делать?"
 KMT_event.39.a:0 "У нас действительно нет выбора"
 KMT_event.39.b:0 "Мы будем сражаться с честью"
 KMT_event.40.t:0 "Китайское правительство наносит удар по Туве"
 KMT_event.40.desc:0 "Китайское правительство вот-вот объявит войну Туве! Что нам делать с этим огромным азиатским фронтом?"
 KMT_event.40.a:0 "Китайцы должны умереть."
 KMT_event.40.b:0 "Мы согласимся отказаться от Тувы ради мира."
 KMT_event.41.t:0 "Китайская империя требует отменить аннексии в Приамурье"
 KMT_event.41.desc:0 "Китайское правительство заявило, что наша аннексия приамурских территорий противоречила международному праву и что эти земли принадлежат Китаю. Однако мы поселили там множество людей, которые теперь живут собственной русской жизнью. Что нам делать с этим ультиматумом?"
 KMT_event.41.a:0 "Владивосток — русский"
 KMT_event.41.b:0 "У нас действительно нет возможности вести сухопутную войну в Азии"
 KMT_event.42.t:0 "Китайцы требуют совместного управления Индокитаем"
 KMT_event.42.desc:0 "Китайское правительство заявило, что Индокитай входит в сферу его влияния и что за отказ от нападения оно имеет право на долю прибыли. Это предложение кажется вполне разумным, ведь речь идёт о далёкой земле."
 KMT_event.42.a:0 "Тем не менее мы отказываемся"
 KMT_event.42.b:0 "Почему бы нам не принять столь выгодную сделку?"
 KMT_event.43.t:0 "Синерубашечники поднимают восстание в Пекине"
 KMT_event.43.desc:0 "После разрыва с нами, последовавшего за нашими попытками распустить их, синерубашечники так и не исчезли окончательно... Сегодня они вошли в Пекин и захватили город. Он пал. Похоже, синерубашечники вернулись и стали сильнее, чем когда-либо."
 KMT_event.43.a:0 "Это не сулит ничего хорошего..."
 KMT_event.44.t:0 "Пекинская декларация и переворот"
 KMT_event.44.desc:0 "В Пекине Дай Ли выступил с воззванием, назвав Чана слабоумным и объявив себя новым правителем Китая. Одновременно он провозгласил Пекин новой столицей Китая и захватил настолько большую часть государственного аппарата, насколько смог. Наконец, его войска уже идут на Нанкин, чтобы полностью взять Китай под контроль."
 KMT_event.44.a:0 "В ходе переворота войска чанистов перешли на другую сторону, а Чан был захвачен."
 KMT_event.44.b:0 "Чанисты сохраняют стойкость и сопротивляются этому предательству."
 KMT_event.45.t:0 "[FROM.GetNameDefCap] провозглашает независимость"
 KMT_event.45.desc:0 "После бегства на наши острова Гоминьдан решил отказаться от самой идеи Китая, совершил очередной акт предательства и провозгласил независимость. Что мы с этим сделаем?"
 KMT_event.45.a:0 "Лучше позволить этим бесполезным людям и предателям идти своим путём."
 KMT_event.45.b:0 "Мы положим конец их отвратительному существованию"
 KMT_event.46.t:0 "[FROM.GetNameDefCap] просит экономической помощи"
 KMT_event.46.desc:0 "После изгнания на острова Гоминьдан начал просить иностранную помощь для своей слабой и некомпетентной промышленности. Что мы с этим сделаем?"
 KMT_event.46.a:0 "Стоит отправить советника, чтобы помочь союзнику"
 KMT_event.46.b:0 "Мы не станем вмешиваться в этот вопрос"
 KMT_event.47.t:0 "Первый национальный съезд в изгнании"
 KMT_event.47.desc:0 "Хотя Гоминьдан пал очень низко, мы всё ещё проводим съезд и строим планы на будущее нашего нового государства. Однажды мы вернёмся. Чан неизбежно приведёт нас к победе и возвращению родины."
 KMT_event.47.a:0 "Сквозь отчаяние восходит надежда!"
 KMT_event.48.t:0 "Чан обращается к нации"
 KMT_event.48.desc:0 "Когда Чан начинает говорить, из толпы раздаётся выстрел: один из уцелевших коммунистов направляет оружие на себя, кричит «Да здравствует КПК!» и убивает себя, совершив убийство и самоубийство. Пока Гоминьдан приходит в себя после этого происшествия, новым председателем Гоминьдана назначают сына Чана..."
 KMT_event.48.a:0 "Председатель мёртв, да здравствует новый председатель!"
 KMT_event.49.t:0 "Ли Цзунжэнь возвращается в нанкинский Гоминьдан"
 KMT_event.49.desc:0 "Увидев возможность быть избранным вместо Чана, Ли Цзунжэнь вернулся в Нанкин, чтобы установить контроль над страной и наконец отстранить Чана."
 KMT_event.49.a:0 "Ещё один деспот или проблеск надежды?"
 KMT_event.50.t:0 "Шанс занять президентский пост"
 KMT_event.50.desc:0 "По всему Китаю проходят выборы, и Ли Цзунжэнь видит шанс победить на них. Однако прежде он посоветовался с женой, спросив, стоит ли ему участвовать."
 KMT_event.50.a:0 "Почему бы и нет? Это наконец устранит Чана!"
 KMT_event.50.b:0 "Семья уже слишком много пострадала от рук Чана."
 KMT_event.51.t:0 "Центристы Гоминьдана выдвигают кандидата"
 KMT_event.51.desc:0 "В борьбе за выдвижение единого кандидата от Гоминьдана центристы партии сегодня представили своего кандидата"
 KMT_event.51.a:0 "Победим в борьбе за выдвижение!"
 KMT_event.52.t:0 "Левые Гоминьдана выдвигают кандидата"
 KMT_event.52.desc:0 "В борьбе за выдвижение единого кандидата от Гоминьдана левые партии сегодня представили своего кандидата"
 KMT_event.52.a:0 "Победим в борьбе за выдвижение!"
 KMT_event.52.b:0 "Но едва они это сделали, армия распустила их, а кандидата поместила под домашний арест..."
 KMT_event.53.t:0 "Конец борьбы за власть"
 KMT_event.53.desc:0 "В борьбе за выдвижение единого кандидата от Гоминьдана партия наконец завершила заседания и обсуждения, выдвинув достойного кандидата, который поведёт страну в будущее!"
 KMT_event.53.a:0 "Пора уничтожить слабую оппозицию!"
 KMT_event.54.t:0 "Левые покидают Гоминьдан"
 KMT_event.54.desc:0 "После столь катастрофического для них исхода внутренней борьбы за власть в Гоминьдане левые покинули нас и массово переходят в КДСП, где ищут экономического равенства."
 KMT_event.54.a:0 "Предатели!"
 KMT_event.55.t:0 "Центристы покидают Гоминьдан"
 KMT_event.55.desc:0 "После столь катастрофического для них исхода внутренней борьбы за власть в Гоминьдане, когда партия повернула влево, центристы покинули нас и массово переходят в ПКМ, где надеются обрести единый и сильный Китай."
 KMT_event.55.a:0 "Предатели!"
 KMT_event.56.t:0 "Сам Чан покидает Гоминьдан"
 KMT_event.56.desc:0 "После столь катастрофического для него исхода внутренней борьбы за власть в Гоминьдане, когда партия повернула влево, Чан Кайши покинул нас, отказался от политики и отрёкся от партии, которая когда-то была его собственной."
 KMT_event.56.a:0 "Предатель!"
 KMT_event.60.t:0 "Китай просит независимости"
 KMT_event.60.desc:0 "Вновь превратив себя в великий маяк, китайцы снова попросили независимости, пообещав уважать наше экономическое влияние. Что мы скажем на такую идею?"
 KMT_event.60.a:0 "Это поможет нам примириться"
 KMT_event.60.b:0 "Мы даруем им... номинальную независимость"
 KMT_event.60.c:0 "Об этом не может быть и речи"
 KMT_event.61.t:0 "Китай предлагает мир"
 KMT_event.61.desc:0 "Похоже, мы проиграли войну китайцам: они не только освободились от нашей власти, но и вытеснили нас со своих земель, а теперь требуют вывести оттуда наши войска."
 KMT_event.61.a:0 "Что есть, то есть... Увы, мы проиграли."
 KMT_event.61.b:0 "И всё же мы будем сражаться до последнего человека."
 KMT_event.62.t:0 "Обвинения в коррупции в Гоминьдане"
 KMT_event.62.desc:0 "На фоне нашей борьбы за власть и приближающихся выборов всплыли обвинения в коррупции внутри правящего Гоминьдана. Многие теперь требуют создать официальную следственную комиссию. Однако сначала это должен одобрить сам Гоминьдан..."
 KMT_event.62.a:0 "Удивительно, но Гоминьдан это разрешает..."
 KMT_event.62.b:0 "Как и ожидалось, предложение заблокировано."
 KMT_event.63.t:0 "Следственная комиссия"
 KMT_event.63.desc:0 "После создания комиссия готовится расследовать обвинения в коррупции, однако некоторые пытаются подкупить её членов и повлиять на них, чтобы использовать расследование в собственных политических интересах."
 KMT_event.63.a:0 "Несмотря ни на что, комиссия сохраняет нейтралитет"
 KMT_event.63.b:0 "Комиссия соглашается уделить «особое внимание» деятельности Чана"
 KMT_event.63.c:0 "Комиссия соглашается проверить, что может происходить в партийной бюрократии"
 KMT_event.63.d:0 "Комиссия соглашается изучить подозрительную деятельность левых"
 KMT_event.64.t:0 "Вердикт комиссии: Гоминьдан виновен"
 KMT_event.64.desc:0 "После долгого расследования комиссия пришла к выводу, что Гоминьдан в целом виновен в масштабной коррупции. Хотя партия всё равно будет участвовать в выборах, это наверняка изменит расстановку сил, снизит её популярность и нанесёт удар по репутации."
 KMT_event.64.a:0 "Возможно, нам вообще не стоило разрешать это расследование..."
 KMT_event.65.t:0 "Вердикт комиссии: Чан виновен"
 KMT_event.65.desc:0 "После долгого расследования и, возможно, небольшой помощи извне комиссия пришла к выводу, что в коррупции виновен только Чан, а Гоминьдан в целом чист. Чан в ярости из-за этой серьёзной неудачи и подрыва своего влияния."
 KMT_event.65.a:0 "Прекрасно, всё идёт по плану"
 KMT_event.66.t:0 "Вердикт комиссии: бюрократия виновна"
 KMT_event.66.desc:0 "После долгого расследования и, возможно, небольшой «помощи» из карманов Чана комиссия пришла к выводу, что в коррупции виновны лишь партийные бюрократы и такие люди, как Линь Сэнь, а Гоминьдан в целом чист. Разумеется, они в ярости из-за этой серьёзной неудачи и подрыва своего влияния."
 KMT_event.66.a:0 "Прекрасно, всё идёт по плану"
 KMT_event.67.t:0 "Вердикт комиссии: левые виновны"
 KMT_event.67.desc:0 "После долгого расследования и, возможно, небольшой «помощи» из карманов Чана комиссия пришла к выводу, что в коррупции виновны лишь партийные левые и такие люди, как Сун Цинлин, а Гоминьдан в целом чист. Разумеется, они в ярости из-за этой серьёзной неудачи и подрыва своего влияния."
 KMT_event.67.a:0 "Прекрасно, всё идёт по плану"
 KMT_event.67.b:0 "Идеальный повод снова их запретить!"
 KMT_event.70.t:0 "Гоминьдан обращается к нам"
 KMT_event.70.desc:0 "После прихода к власти нового, более левого правительства Гоминьдан обратился к нам, пытаясь заручиться нашей поддержкой, дружбой и руководством."
 KMT_event.70.a:0 "Разумеется, мы поможем другу."
 KMT_event.70.b:0 "Мы не станем тратить драгоценные ресурсы."
 KMT_event.71.t:0 "Гоминьдан просит направить военную миссию"
 KMT_event.71.desc:0 "Получив нашу помощь своему правительству, Гоминьдан теперь попросил также направить военную миссию, чтобы модернизировать его устаревшую армию и научить её планировать наступления современными методами."
 KMT_event.71.a:0 "Ценный союзник против фашизма в Азии — отправить людей!"
 KMT_event.71.b:0 "Мы не станем тратить драгоценные ресурсы."
 KMT_event.72.t:0 "Гоминьдан предлагает полноценный военный союз"
 KMT_event.72.desc:0 "После того как мы помогли и их правительству, и армии, Гоминьдан заявил, что его будущее очевидно связано с союзом с нами. Кроме того, они указали, что это повысит эффективность нашего военного сотрудничества и создаст мощный евразийский блок."
 KMT_event.72.a:0 "Мы принимаем их с распростёртыми объятиями!"
 KMT_event.72.b:0 "Они лишь обуза."
 KMT_event.73.t:0 "Борьба за власть продолжается"
 KMT_event.73.desc:0 "По мере развития борьбы за власть кандидаты выступают перед партией с громкими речами, пытаясь укрепить своё руководство над ней."
 KMT_event.73.a:0 "Результаты оказались... любопытными"
 KMT_event.74.t:0 "Закат политической опеки"
 KMT_event.74.desc:0 "Время пришло: начались последние шаги к выборам, и различные группы Китая вступили в борьбу за власть. \nВ §2Гоминьдане§! различные фракции и клики воспользовались ослаблением власти Чана и втянули партию в борьбу за власть, в которой чанисты больше не господствуют единолично. Эта борьба определит лидера §2Гоминьдана§! после выборов.\nТем временем, если им предоставят возможность и законный статус, §8ПКМ§! и §OКДСП§! также попытаются превзойти §2Гоминьдан§! и стать новой господствующей политической силой Китая... \nНаконец, армия остаётся в тени, и если военные решат, что дела идут плохо, что выборы сопровождаются масштабными фальсификациями, а правительство после их завершения отказывается объявлять результаты, может произойти переворот...\n\nПохоже, лишь время покажет, какая сила станет главной в Китае."
 KMT_event.74.a:0 "Поднимем тост за новую эпоху!"
 KMT_event.75.t:0 "Судьба результатов выборов"
 KMT_event.75.desc:0 "Хотя выборы уже состоялись, некоторые недовольны результатами и пытаются помешать их объявлению, чтобы сохранить ту малую власть, которая у них ещё осталась."
 KMT_event.75.a:0 "Несмотря ни на что, народ должен знать правду."
 KMT_event.75.b:0 "По крайней мере пока им это удаётся."
 KMT_event.76.t:0 "Китай просит заключить бартерное соглашение"
 KMT_event.76.desc:0 "Поскольку Handelsgesellschaft für Industrielle Produkte действует в Китае и продаёт ему наше вооружение в обход международного законодательства о торговле оружием, Китай теперь обратился к нам с предложением обменивать ресурсы на оружие в рамках сделок, детали которых будут согласованы после подписания этого договора..."
 KMT_event.76.a:0 "Бизнес? С удовольствием!"
 KMT_event.76.b:0 "Нет нужды настраивать против себя международное сообщество"
 KMT_event.77.t:0 "Китай стремится приобрести чертежи"
 KMT_event.77.desc:0 "Чтобы модернизировать свою устаревшую армию, китайцы предложили усилить наше влияние на их экономику в обмен на некоторые военные чертежи, которые позволят им вступить в современную эпоху в качестве великой державы."
 KMT_event.77.a:0 "Прекрасная сделка!"
 KMT_event.77.b:0 "Немецкие чертежи — только для немцев!"
 KMT_event.78.t:0 "Китай стремится открыть программу военного обмена"
 KMT_event.78.desc:0 "Чтобы модернизировать свою устаревшую армию, китайцы предложили усилить наше влияние на их экономику в обмен на военный обмен. Хотя формально он будет выгоден обеим сторонам, разумеется, прежде всего он поможет их армии."
 KMT_event.78.a:0 "Прекрасная сделка!"
 KMT_event.78.b:0 "Немецкая наука — только для немцев!"
 KMT_event.79.t:0 "Китай стремится перенять военный опыт"
 KMT_event.79.desc:0 "Чтобы модернизировать свою устаревшую армию, китайцы предложили усилить наше влияние на их экономику в обмен на некоторый опыт."
 KMT_event.79.a:0 "Прекрасная сделка!"
 KMT_event.79.b:0 "Немецкий опыт — только для немцев!"
 KMT_event.80.t:0 "Китай распускает HAPRO"
 KMT_event.80.desc:0 "Недовольные нашим влиянием на их экономику, китайцы распустили HAPRO, забрали свою долю прибыли и вышли из соглашения, положив конец нашему сотрудничеству и лишив нас доступа к дешёвым ресурсам Китая."
 KMT_event.80.a:0 "Полагаю, это уже свершившийся факт"
 KMT_event.80.b:0 "Будь ты проклят, Чан!"
 GER_harpo_tt:0 "Китай сможет закупать больше нашего оборудования, что даст нам влияние в Китае, первоначально упростив торговлю, но с большей доступностью в будущем."
 CHI_election_guide_tt:0 "Открывает §Yинтерфейс§! в разделе §Yрешений§!, показывающий текущее состояние борьбы за власть и популярность партий. Кнопки §2Гоминьдана§!, §8МЛК§! и §OКДСП§! открывают уникальные подменю соответствующих партий.\n\nНе забудьте объявить результаты выборов кнопкой в правом верхнем углу, иначе может произойти §gвоенный переворот§!..."
 KMT_SOV_cooperation:0 "Советская военная миссия"
 KMT_SOV_cooperation2:0 "Советская военная миссия"
 KMT_reach_out_to_moscow:0 "Обратиться к Москве"
 KMT_reach_out_to_moscow_desc:0 "Нашим дипломатам поручено обратиться к Москве, ведь советские социалисты — наши братья, у которых мы можем многому научиться. Возможно, это приведёт к плодотворному сотрудничеству в будущем..."
 KMT_military_exchanges:0 "Военные обмены"
 KMT_military_exchanges_desc:0 "После зарождения нашего осторожного сотрудничества мы запросим советскую военную миссию, которая значительно повысит эффективность нашей армии и поможет нам стать ведущей силой в будущем."
 KMT_full_military_alliance:0 "Полноценный военный союз"
 KMT_full_military_alliance_desc:0 "Мы многим обязаны Советам. Поэтому будет справедливо предложить им полноценный военный союз, ещё больше укрепив миссию и создав великий евразийский блок!"
 KMT_moscow_nanjing:0 "Москва и Нанкин сотрудничают"
 KMT_scrifice_in_the_name_of_china:0 "Жертвы во имя Китая"
 KMT_scrifice_in_the_name_of_china_desc:0 "Наш народ должен научиться жертвовать собой ради высшего блага Китая! Китай будет спасён, и наш народ будет сражаться за него!"
 KMT_the_return_of_whampoa:0 "Возвращение Вампу"
 KMT_the_return_of_whampoa_desc:0 "Вампу наконец сосредоточила в своих руках всю власть над Китаем! Да здравствует НРА!"
 KMT_extol_china:0 "Прославлять Китай"
 KMT_full_military_politicization:0 "Полная политизация армии"
 KMT_full_military_politicization_desc:0 "Армия Вампу вновь полностью политизирована, что обеспечит ей господство над будущим Китая."
 KMT_help_generals_into_the_government:0 "Продвинуть генералов в правительство"
 KMT_help_generals_into_the_government_desc:0 "Вампу начинает продвигать своих генералов в правительство, обеспечивая дальнейшее расширение власти клики Вампу."
 KMT_full_loyalty_to_the_generalissimo:0 "Полная верность генералиссимусу"
 KMT_full_loyalty_to_the_generalissimo_desc:0 "Армия заявила о полной верности генералиссимусу, что закрепляет её под его контролем."
 KMT_the_grand_goverment:0 "Великое правительство"
 KMT_the_grand_goverment_desc:0 "Вампу приведёт к власти великое правительство, состоящее из представителей всей клики. Вскоре она сможет господствовать над всем Китаем."
 KMT_civilian_matters_in_civilian_hands:0 "Гражданские дела — в руках гражданских"
 KMT_civilian_matters_in_civilian_hands_desc:0 "Даже Вампу признаёт, что некоторые вопросы лучше оставить гражданским. Поэтому будет введён именно такой принцип управления."
 KMT_arrest_key_oppositional_figures:0 "Арестовать ключевых деятелей оппозиции"
 KMT_arrest_key_oppositional_figures_desc:0 "Военная полиция арестует ключевых деятелей оппозиции, положив конец любому сопротивлению новому военному правлению. Вампу и Гоминьдан нельзя ставить под сомнение."
 KMT_anti_conservative_censorship:0 "Цензура против консерваторов"
 KMT_anti_conservative_censorship_desc:0 "Государство подвергнет цензуре демократов и консерваторов в Гоминьдане. Все должны склониться перед кликой Вампу и её режимом!"
 KMT_violence_when_necessarys:0 "Насилие при необходимости"
 KMT_violence_when_necessarys_desc:0 "Мы считаем, что порой применение насилия необходимо. Этот принцип, переданный нам синерубашечниками, будет эффективно использован для укрепления режима."
 KMT_disband_the_cc_clique_wham:0 "Распустить клику CC"
 KMT_disband_the_cc_clique_wham_desc:0 "Пришло время распустить клику CC и покончить с её сопротивлением, уничтожив её жалкие притязания."
 KMT_decrease_blueshirt_autonomy:0 "Ограничить автономию синерубашечников"
 KMT_decrease_blueshirt_autonomy_desc:0 "Мы, наконец, уменьшим автономность синих рубашек в NRA и Whampoa Clique, централизуя ее и имея дело с этими выродками."
 KMT_consolidate_military_power:0 "Сосредоточить военную власть"
 KMT_consolidate_military_power_desc:0 "Мы должны сосредоточить военную власть в стране, закрепив её исключительно за Вампу."
 KMT_increase_military_quality_of_life:0 "Повысить уровень жизни военных"
 KMT_increase_military_quality_of_life_desc:0 "Правительство распорядилось повысить уровень жизни наших солдат настолько, чтобы служба у нас стала крайне привлекательной, а бойцы любили нас и были готовы умереть за нас."
 KMT_national_defense_fund:0 "Фонд национальной обороны"
 KMT_national_defense_fund_desc:0 "Вампу не хватает средств... Это исправят новый проект и фонд, направленные на расширение нашей армии."
 KMT_high_pensions:0 "Высокие пенсии"
 KMT_high_pensions_desc:0 "Правительство установит высокие пенсии, чтобы наши солдаты охотно сражались за нас и могли достойно жить даже после ранения."
 KMT_a_martial_china:0 "Военное государство"
 KMT_a_martial_china_desc:0 "Китай стал настоящим военным государством под контролем Вампу, где больше нет оппозиции."
 KMT_national_military_indoctrination:0 "Общенациональная военная индоктринация"
 KMT_national_military_indoctrination_desc:0 "Нация будет воспитана в военном духе, что обеспечит Вампу полный контроль над ней."
 KMT_all_hail_the_nra:0 "Да здравствует НРА"
 KMT_all_hail_the_nra_desc:0 "Пока все славят НРА, она укрепляет свою власть над Китаем и объединяет страну под своим контролем."
 KMT_a_military_to_be_proud_of_desc:0 "Мы воспитаем чувство гордости за нашу армию и объединим вокруг неё страну. Это сделает её по-настоящему великой."
 KMT_parade_on_tianmen_square:0 "Парад на площади Тяньаньмэнь"
 KMT_parade_on_tianmen_square_desc:0 "Солдаты проходят парадом по площади Тяньаньмэнь, наглядно демонстрируя мощь нашей армии."
 KMT_mandatory_work_quotas:0 "Обязательные трудовые квоты"
 KMT_mandatory_work_quotas_desc:0 "Синерубашечники вводят обязательные трудовые квоты, чтобы обеспечить производство в объёмах, превосходящих наших врагов."
 KMT_align_with_moscow:0 "Сблизиться с Москвой"
 KMT_align_with_moscow_desc:0 "Мы должны стремиться к сближению с Москвой — покровителем нашей идеологии и будущим этого мира."
 KMT_economic_unity:0 "Экономическое единство"
 KMT_economic_unity_desc:0 "Мы направим русским предложение о более тесном экономическом сотрудничестве, чтобы обеспечить крепкое будущее."
 KMT_military_unity_desc:0 "Мы направим русским предложение о более тесном военном сотрудничестве, чтобы обеспечить могущественное будущее."
 KMT_military_unity:0 "Военное единство"
 KMT_one_union_in_all_but_name:0 "Союз во всём, кроме названия"
 KMT_one_union_in_all_but_name_desc:0 "В последнее время мы фактически стали частью Советского Союза. Пора закрепить это официально и получить особый правовой статус!"
 KMT_de_facto_member_of_the_union:0 "Де-факто член Союза"
 KMT_happy_blueshirts_tt:0 "§tПолучив новый пост, §YДай Ли§! будет умиротворён и не станет противиться роспуску Чан Кайши§! §8синерубашечников§!"
 KMT_angry_blueshirts_tt:0 "Это разозлит синерубашечников или то, что от них осталось"
 KMT_chinese_tributary:0 "Китайский данник"
 KMT_the_chinese_empire:0 "Китайская империя"
 KMT_li_empowered:0 "Могущественный"
 KMT_li_empowered_no_lar:0 "Могущественный"
 kmt_new_event_loc_key_so_no_stuff_gets_broken:0 "Это не нужно!"
 KMT_masters_of_asia:0 "Владыки Азии"
 KMT_kuomintang_national_revolution_category:0 "Национальная революция Гоминьдана"
 KMT_strategize_against_FROM:0 "Разработать стратегию против [FROM.GetNameDef]"
 KMT_expand_the_revolutionary_goals:0 "Расширение революционных целей"
