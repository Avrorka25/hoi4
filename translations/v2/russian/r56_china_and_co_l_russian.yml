 KMT_HARPO_cat_desc:0 "Handelsgesellschaft für Industrielle Produkte (§YHAPRO§!) позволяет нам получить доступ к немецкому рынку вооружений и закупать оружие для нашей борьбы. \n\nЭта компания создана специально для торговли вооружениями и призвана обходить международные ограничения на немецкое оружие.\n\nТекущее влияние §YHAPRO§! в Китае: §Y[?KMT_harpo_inf]§!\n\n§tЕсли§! к моменту роспуска §YHAPRO§! §tеё влияние окажется слишком велико, это будет иметь тяжёлые последствия для китайской экономики...§!\n\nКроме того, потеря контроля над всеми прибрежными регионами вынудит прекратить сотрудничество с немцами, и §YHAPRO§! самоликвидируется."
