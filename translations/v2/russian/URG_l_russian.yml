 URG_aftermath_of_paso_morlan:0 "Последствия Пасо-Морлана"
 URG_aftermath_of_paso_morlan_desc:0 "Неудавшаяся попытка переворота в Пасо-Морлане оставила Уругвай в состоянии неопределённости. Хотя мятеж был подавлен, его последствия оказались далекоидущими. В военных кругах зреет недовольство, а политический раскол между сторонниками реформ и приверженцами старого порядка углубляется. Последствия этого хаотичного события подорвали доверие общества, ослабили власть правительства и создали возможность для вмешательства иностранных держав во внутренние дела Уругвая..."
 URG_legacy_of_batlle2:0 "Наследие Батлье"
 URG_legacy_of_batlle2_desc:0 "Тень президентства Хосе Батлье-и-Ордоньеса по-прежнему нависает над Уругваем и формирует как внутреннюю, так и внешнюю политику страны. Будучи архитектором масштабных социальных и экономических реформ, Батлье заложил основы современного государства всеобщего благосостояния, укрепив культуру прогрессизма и государственного вмешательства. Однако его наследие остаётся спорным. Многие превозносят его видение демократического и равноправного Уругвая, тогда как другие считают его политику источником экономического застоя и политической нестабильности..."
 URG_legacy_of_batlle_s:0 "Наследие Батлье"
 URG_legacy_of_batlle_s_desc:0 "Тень президентства Хосе Батлье-и-Ордоньеса по-прежнему нависает над Уругваем и формирует как внутреннюю, так и внешнюю политику страны. Будучи архитектором масштабных социальных и экономических реформ, Батлье заложил основы современного государства всеобщего благосостояния, укрепив культуру прогрессизма и государственного вмешательства. Однако его наследие остаётся спорным. Многие превозносят его видение демократического и равноправного Уругвая, тогда как другие считают его политику источником экономического застоя и политической нестабильности..."
