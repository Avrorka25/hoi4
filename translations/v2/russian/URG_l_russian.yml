 URG_partido_nacional_party_long:0 "Национальная партия"
 uruguay.1.t:0 "Всеобщие выборы 1938 года"
 uruguay.1.d:0 "После государственного переворота 1933 года Габриэль Терра назначил выборы на этот год. \n\nГлавными кандидатами являются генерал и начальник полиции Альфредо Бальдомир, известный политик Луис Альберто де Эррера и поэт-социалист Эмилио Фругони.\n\nОднако некоторые более радикальные партии воспользовались нестабильной обстановкой, чтобы распространить своё влияние. Наиболее известна Коммунистическая партия, хотя свой шанс получили и националистические и фашистские партии, главной из которых является Ревизионистское действие Уругвая.\n\nПо мере подсчёта голосов становится очевидно, что..."
 uruguay.1.a:0 "Партия Колорадо обеспечивает себе переизбрание!"
 uruguay.1.b:0 "Национальная партия выходит победителем!"
 uruguay.1.e:0 "Страна оказывается в избирательном тупике..."
 uruguay.2.t:0 "Судьба Национального совета"
 uruguay.2.d:0 "Национальный административный совет был создан в 1917 году президентом Бальтасаром Брумом как попытка создать исполнительный орган, подобный Федеральному совету Швейцарии. Это позволило партиям Колорадо и Насьональ делить власть и принесло Уругваю стабильность. \n\nОднако характер работы совета делал его медлительным, поскольку любое решение требовало одобрения всех членов. Это бездействие значительно усугубило последствия Великой депрессии для уругвайской экономики, и решить проблему удалось лишь после роспуска совета фактическим президентом Уругвая Габриэлем Террой в 1933 году. \n\nТеперь, когда последствия Великой депрессии преодолены, многие политики вновь предлагают восстановить совет, чтобы вернуть Уругваю столь необходимую стабильность."
 uruguay.2.a:0 "Восстановить Совет — стабильность нужно обеспечить любой ценой..."
 uruguay.2.b:0 "Чепуха, неэффективность Совета лишь ещё сильнее ухудшит положение!"
 uruguay.3.t:0 "Хаос на улицах!"
 uruguay.3.d:0 "Недавний избирательный тупик, первый в нашей истории, тяжело сказался на стране. В Монтевидео царит хаос: батльисты во главе с Луисом Батлье Берресом организуют протесты, а со стороны Национальной партии слышны разговоры о восстании, как в 1904 году. Воспользовавшись моментом, КПУ под руководством Эухенио Гомеса попыталась пройти маршем к Законодательному дворцу, но была остановлена членами Ревизионистского действия.\n\nАрмия и полиция расколоты и растянуты по всему городу из-за протестов и беспорядков, поэтому реакция властей оказывается слабой. К ночи становится ясно, что..."
 uruguay.3.a:0 "Ревизионисты побеждают коммунистов и захватывают власть."
 uruguay.3.b:0 "Коммунисты побеждают ревизионистов и штурмуют Законодательный дворец."
 uruguay.3.c:0 "Стабильность страны необходимо сохранить — Колорадо должна создать коалицию с ПСУ!"
 uruguay.4.t:0 "Коалиция с ПСУ?"
 uruguay.4.d:0 "Недавний избирательный тупик погрузил Уругвай в состояние тяжёлой политической нестабильности и насилия. Поскольку всеобщие выборы 1938 года не выявили явного победителя, напряжённость по всей стране нарастает. Неопределённость не осталась незамеченной, и различные силы уже предлагают способы выхода из кризиса. Одним из наиболее обсуждаемых вариантов является создание коалиционного правительства Партии Колорадо и Социалистической партии Уругвая. Это решение, которое многие считают одновременно прагматичным и необходимым, может восстановить стабильность и предотвратить угрозу гражданской войны или военного переворота."
 uruguay.4.a:0 "Мы не пойдём на компромисс с социалистами!"
 uruguay.4.b:0 "Стабильность страны необходимо сохранить — мы должны создать коалицию с ПСУ!"
