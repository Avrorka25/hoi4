 MEX_industrial_concessions:0 "Промышленные концессии"
 MEX_PAN7:0 "Совершенная диктатура"
 MEX_state_railroad_company:0 "Мексиканская национальная железнодорожная компания"
 MEX_state_railroad_company_desc:0 "Внутри страны известная как Ferrocarril Nacional Mexicano, или FNM, эта государственная железнодорожная компания была создана для расширения слабой сети по всей стране и развития уже существующих линий между крупными городами, включая Мехико, Сьюдад-Хуарес, Нуэво-Ларедо и Матаморос."
 MEX_maximato_legacy:0 "Максимато Наследие"
 MEX_maximato_legacy_desc:0 "The [ROOT.getAdjective] Правительство пронизано лоялистами Плутарко Кальеса, также известного как «Эль-Джефе Максимо».Он служил мексиканским президентом с 1924 по 1928 год и контролировал Мексику через доверенных президентов и сторонников в PRM. С 1924 по 1936 год Каллес был тем, кто держал настоящую власть в Мексике. Этот период в истории Мексики известен как Максимато."
 MEX_recovering_from_maximato:0 "Восстановление от Максимато"
 MEX_military_purges:0 "Военные чистки"
 MEX_political_union_support:0 "Поддержка политических союзов"
 MEX_funding_public_enterprises:0 "Финансирование государственных предприятий"
 MEX_funding_public_enterprises_desc:0 "[ROOT.getAdjective] правительство направляет часть доступных средств на создание общественных служб, значительно повышая благосостояние населения."
