 MEX_invite_FROM_to_the_treaty_tt:0 "Открывает £decision_icon_small решения по §Yприглашению§! независимых стран Латинской Америки в наш союз!"
 MEX_pan_american_highway_tt:0 "Этот национальный дух будет удалён после завершения Мексикой фокуса «§YПанамериканское шоссе§!»."
 fierro:0 "Роберто Фьерро"
 abelardo:0 "Абелярдо Родригес"
 abelardo_desc:0 "Абелардо был мексиканским бизнес-магнатом, мексиканским генералом и временным президентом Мексики. Он основал 80 компаний и в общей сложности участвовал в 120. Он основал Baja California, авиационный военный подрядчик, и верфи Родригес в Тихуане."
 rodriguez:0 "Верфь Родригеса"
 rodriguez_desc:0 "Верфь Родригеса, принадлежащая промышленному магнату и бывшему президенту Мексики Абелардо Родригесу, расположена в Тихуане. Судя по немногочисленным сохранившимся сведениям, она специализировалась на небольших судах."
 MEX_almazan:0 "Хуан Алмазан"
 MEX_almazan_desc:0 "Хуан был охарактеризован как бизнесмен, одетый как генерал. Его основной бизнес был в военном строительстве, где его компания отвечала за строительство лучшей военной базы в Мексике в Монтеррее в 20-х годах."
 Maximino2:0 "Максимино Авила Камачо"
 Maximino2_desc:0 "Максимино был Каудильо из Пуэблы, где он владел телеграфом, железными дорогами, магистралями и большей частью инфраструктуры. В течение этого времени Мексика использовала инженеров своих вооруженных сил для быстрого строительства инфраструктуры и других зданий. По этой причине Максимино был бы экспертом в области логистики, способным довести свою экспертизу линий снабжения и свой опыт строительства инфраструктуры до любой войны."
 Maximino3:0 "Максимино Авила Камачо"
 Maximino3_desc:0 "Мексиканские историки описывали Максимино как высокомерного, злобного и мстительного. Максимино, как говорили, преследовал тех, кто пересекал его с крайним предубеждением."
 MEX_MARC:0 "Эль Компа Начо"
 MEX_MARC_desc:0 "Эль Компа Начо, настоящее имя которого Игнасио Моралес, был агентом, связанным как с группами Карденисты, так и с группами Алемана, и, как говорили, был назначен ими на специальные задания. Сторонники Алмазана обвинили Моралеса в причастности к неудавшемуся заговору с целью убийства жизни Аламазана. Источник: \"Политический интеллект и создание современной Мексики, 1938-1954\", стр. 46."
 lopez:0 "Рауль Лопес Санчес"
 pawling1:0 "Альберто Дж. Паулинг"
 pawling2:0 "Альберто Дж. Паулинг"
 MEX_agrarian_army:0 "Аграрный союз"
 MEX_agrarian_army_desc:0 ""
 MEX_constable_army:0 "Констебль армии"
 MEX_constable_army_desc:0 "Армия Мексики уже давно сосредоточена на внутренней охране правопорядка, и ей не хватает внутренней структуры, чтобы эффективно противостоять внешним угрозам. В течение этой эры Каудильос представлял серьезную угрозу национальному миру и заставил мексиканское правительство послать военных на инженерные проекты, чтобы не только связать рабочую силу, чтобы Каудильо не смог сформировать восстание, но и улучшить национальную инфраструктуру в то же время."
 MEX_constable_army_caudillos_sided:0 "Армии Каудильо"
 MEX_constable_army_caudillos_sided_desc:0 "Расширение прав и возможностей Каудильо привело к тому, что частные армии доминировали в местных секторах. К лучшему или к худшему, это как минимум шаг вперед к надежной армейской структуре."
 MEX_low_literacy_rate:0 "Низкий уровень грамотности"
 MEX_low_literacy_rate_desc:0 "По состоянию на 1936 год в Мексике был уровень грамотности ~ 40 %. Основной причиной этого является распределение населения, как правило, в сельских районах, по сравнению с доступом к образованию, который в основном осуществляется в городских районах."
 MEX_heavily_subsidized_rural_education:0 "Сильно субсидируемое сельское образование"
 MEX_conservative_education:0 "Консервативное образование"
 MEX_conservative_education_desc:0 ""
 MEX_modernize_the_education_system:0 "Модернизировать систему образования"
 MEX_modernize_the_education_system_desc:0 ""
 MEX_major_economic_sanctions:0 "Основные экономические санкции"
 MEX_major_economic_sanctions_desc:0 "Внешнеэкономические санкции оказывают катастрофическое воздействие на все сферы экономического и промышленного ландшафта Мексики."
 MEX_small_aviation_industry:0 "Авиационная промышленность Bottleneck"
 MEX_small_aviation_industry_desc:0 "Авиационная промышленность Мексики не испытывала недостатка в хороших конструкторах для проектирования самолетов. Однако промышленность страдала от отсутствия возможности массового производства этих самолётов из-за отсутствия не только машин, но и квалифицированных инженеров. Самым большим препятствием для Мексики в разработке своих собственных проектов было медленное время производства."
 MEX_idea_expanded_mining_industry:0 "Немецкие горнодобывающие компании"
 MEX_idea_expanded_mining_industry_desc:0 "Среди прочего, Германия была заинтересована в создании горнодобывающих компаний в Мексике, чтобы ограничить мощное американское влияние в отрасли."
 state_car:0 "Государственный автопроизводитель"
 state_energy:0 "Государственная энергетическая компания"
 MEX_expelled_diplomats:0 "Высланные дипломаты"
 MEX_oil_concessions_tt:0 "§YНаши нефтедобывающие объекты находятся в руках иностранных корпораций!§!"
 MEX_strength_of_the_civil_War_depends_on_low_stability_tt:0 "§GНизкая стабильность§! гарантируют, что §Yповстанцы§! получать §Gменьше§! Силы!"
 MEX_diplomatic_opportunity_tt:0 "Если напряженность будет слишком низкой, возможно, можно будет сыграть США и Великобританию друг против друга, если время подходящее."
 tt_mexpromotion:0 "Президент Мексики считается 5-звездочным генералом благодаря системе ранжирования. Благодаря этому, этот военный кандидат будет повышен до 5-го уровня и получит бонусы на основе своей истории.\n"
 tt_MEX_racial_tensions:0 "Это не останется незамеченным и усилит расовую напряжённость в Америке."
 juan_is_dead:0 "мертвый"
 juan_loses:0 "После поражения на выборах покинул Мексику"
 escobar_returns:0 "Эскобар вернулся в Мексику"
 election_1940:0 "Выборы 1940 года"
 riot:0 "Произошли беспорядки в костюмах зут"
 POLITICS_DIONISIO_ENCINA_DESC:0 "Дионисио описывался как поляризационная фигура, и историки часто не могли сказать ничего положительного о его лидерстве. Дионисио был ответственен за распад крупнейшей мексиканской коммунистической партии PCM. Его поддерживали советские агенты, ответственные за распространение коммунизма в Мексике, и он никогда не действовал, если ему не было приказано, и опасался, что его советские кураторы найдут более подходящего лидера для PCM. Этот страх заставил его очистить любого, кто имел лучшие лидерские навыки или харизму от PCM из страха, что он будет заменен ими, оставив PCM с серьезным отсутствием хорошего руководства и проактивного мышления."
