l_russian:
 mexico.2.d:0 "Поддержать мексиканских рабочих."
 MEX_high_illiteracy:0 "Высокая неграмотность"
 MEX_high_illiteracy_desc:0 "Пренебрежение со стороны прежних национальных правительств привело к тому, что сегодня в Мексике существует многочисленное, преимущественно сельское неграмотное население. Чтобы устранить это препятствие на пути развития, правительству придётся действовать решительно."
 MEX_enforce_the_calles_law2_tt:0 "§RБлокирует§! решение: §YКомитет примирения§!"
 MEX_decision_fund_secular_education:0 "Финансировать светское образование"
 MEX_decision_fund_secular_education_desc:0 "Пришло время решительно бороться с неграмотностью в сельских районах Мексики. Мы воспитаем новое поколение мексиканцев, не запятнанное клерикальной коррупцией и сплочённое вокруг нашей великой нации."
 MEX_decision_promote_catholic_schooling:0 "Поддерживать католическое образование"
 MEX_decision_promote_catholic_schooling_desc:0 "Пришло время выступить против ужасающей неграмотности, ставшей повседневностью в сельских регионах. Используя католические организации, мы сможем самоотверженно воспитать новое поколение образованных и богобоязненных мексиканцев."
 MEX_repeal_the_calles_law_tt:0 "§RБлокирует§! решение: §YРазжечь напряжённость§!"
 MEX_repeal_the_calles_law2_tt:0 "§GУлучшает§! эффекты решений: §YУбить предателя-кристеро§!, §YПомиловать бойца-кристеро§! и §YКомитет примирения§!"
 MEX_enforce_the_calles_law_tt:0 "§GУлучшает§! эффекты решений: §YУбить предателя-кристеро§!, §YПомиловать бойца-кристеро§! и §YРазжечь напряжённость§!"
 MEX_enforce_the_calles_law2_tt:0 "§RБлокирует§! решение: §YКомитет примирения§!"
 mexico.57.title:0 "Мексиканские монархисты предлагают восстановить императорскую власть"
 mexico.57.desc:0 "Хотя монархическое движение в Мексике остаётся слабым и малочисленным, некоторые наши сторонники считают, что восстановление королевской власти укрепит международный престиж страны как влиятельной католической державы. Возвращение монархии будет крайне непопулярным шагом, но окончательный выбор остаётся за нами."
 mexico.57.a:0 "Какая нелепая идея!"
 mexico.57.b:0 "Королева присоединится к нашей борьбе за славу и спасение!"
 MEX_unlocks_new_focus_tt:0 "§GОткрывает новые фокусы§!"
 MEX_upon_completion_of_focus_crusade_against_atheism_tt:0 "После завершения фокуса §YКрестовый поход против атеизма§!:"
 MEX_activates_mission_second_mexican_revolution_tt:0 "Активирует задание §YВторая мексиканская революция§!"
 MEX_restored_the_monarchy_flag:0 "Планирует восстановить или уже восстановила мексиканскую монархию"
 MEX_idea_unpopular_restoration:0 "Непопулярная реставрация"
 MEX_idea_unpopular_restoration_desc:0 "Несмотря на наше божественное право управлять Мексикой, республиканская оппозиция парализует страну. Чтобы вернуть Мексике Бога и стабильность, этих предателей необходимо сокрушить или привлечь на нашу сторону."
 MEX_idea_lackluster_support_for_the_monarchy:0 "Слабая поддержка монархии"
 MEX_idea_growing_support_for_the_monarchy:0 "Рост поддержки монархии"
 MEX_focus_support_the_spanish_carlists:0 "Поддержать [SPB.GetAdjective] карлистов"
 MEX_focus_support_the_spanish_carlists_desc:0 "Нет большего позора, чем если наша священная победа ограничится одной Мексикой. Испанское движение за карлистскую реставрацию разделяет наши цели. Объединимся с братьями и сокрушим ужасы, обрушившиеся на полуостров!"
 MEX_focus_focus_on_european_affairs:0 "Сосредоточиться на европейских делах"
 MEX_focus_focus_on_european_affairs_desc:0 "Янки стали державой, способной потрясти мир, только после вмешательства Уильяма Мак-Кинли в трансконтинентальные дела. Если Мексика хочет когда-нибудь стать великой державой, она должна занять решающую роль в международной политике."
 MEX_focus_focus_on_european_affairs_tt:0 "Открывает решения по привлечению §Yмонархических§! стран Европы, если таковые существуют."
 MEX_decision_seek_membership_in_the_FROM:0 "Запросить членство в [From.GetFactionName]"
 FACTION_IMPERIUM_HISPANICUM:0 "Испанская империя"
 MEX_focus_defend_the_imperial_restoration:0 "Защитить императорскую реставрацию"
 MEX_focus_defend_the_imperial_restoration_desc:0 "Если бы победа в мексиканской политике зависела лишь от кровопролития, мясник Кальес наверняка уже обладал бы абсолютной властью. Нам необходимо заручиться народной поддержкой и защитить честь монархии от обвинений в том, что мы являемся марионеткой западного империализма."
 MEX_focus_defend_the_imperial_restoration_tt:0 "Открывает решения для ослабления эффекта §YНепопулярной реставрации§!."
 MEX_decision_destroy_lingering_callista_influence:0 "Уничтожить остаточное влияние кальистов"
 MEX_decision_destroy_lingering_callista_influence_desc:0 ""
 MEX_decision_seek_the_papacys_support:0 "Заручиться поддержкой папства"
 MEX_decision_restore_the_southern_borders:0 "Восстановить южные границы"
 MEX_decision_restore_the_southern_borders_desc:0 "Мексиканские республиканцы называют нас марионетками европейских монархий. Лучший способ опровергнуть это — вернуть мексиканское влияние в Америке там, где они сами никогда бы не смогли."
 MEX_decision_establish_control_in_madrid:0 "Установить контроль над Мадридом"
 MEX_decision_establish_control_in_madrid_desc:0 "Восстановив контроль над самой Испанией, мы ясно покажем народу, что создаём трансатлантическую великую державу, которой будет бояться весь мир!"
 MEX_focus_the_empresss_grand_armada:0 "Великая армада императрицы"
 MEX_focus_the_empresss_grand_armada_desc:0 "Будучи императрицей огромной и постоянно растущей империи, мы обязаны создать престижный флот, соответствующий нашим трансконтинентальным амбициям."
 MEX_focus_return_to_the_peninsula:0 "Вернуться на полуостров"
 MEX_focus_return_to_the_peninsula_desc:0 "Испания слишком долго была парализована внутренней слабостью и иностранным вмешательством. Как восходящая сила испаноязычного мира, мы должны установить над ней полный и безраздельный контроль."
 MEX_gains_claim_on_all_portuguese_states_in_europe_tt:0 "Получает претензии на все §Yпортугальские§! регионы в Европе."
 mexico.58.title:0 "Португальский вопрос"
 mexico.58.desc:0 "Так же, как испанцы, португальцы пережили два столетия имперского упадка, сделав их почти умирающей державой. Предложив им руку в разделе Испании, возможно, [POR.GetAdjcetive] Мы можем снова встать на нашу сторону как растущая держава. Но в конечном счете, судьба самой западной страны Европы находится в наших руках, что нам делать с правительством в Лиссабоне?"
 mexico.58.a:0 "Предложить им Галисию и марокканский Риф в обмен на поддержку."
 mexico.58.b:0 "Их дальнейшая независимость недопустима."
 mexico.59.title:0 "Предложение из Мексики"
 mexico.59.desc:0 "Недавно мексиканский посол обратился к нашим представителям в Лиссабоне с заманчивым предложением: союз против Испании. В обмен на помощь в завоевании полуострова мексиканское правительство предлагает передать нам земли в марокканском Рифе и Галисию. Как нам отнестись к этому предложению?"
 mexico.59.a:0 "Вместе нас будет не остановить!"
 mexico.59.b:0 "Зачем поддерживать этих глупцов?"
 mexico.60.title:0 "Португальцы согласны!"
 mexico.60.desc:0 "Видя, что слияние с восходящей силой лучше, чем с умирающей, [POR.GetAdjective] Они бросили свой жребий с нашим разделом Пиренейского полуострова. Все, что нам осталось, — завоевать умирающую Испанию и создать себе две великие империи!"
 mexico.60.a:0 "Превосходные новости."
 mexico.61.title:0 "Португальцы отказываются!"
 mexico.61.desc:0 "Несмотря на наше справедливое дипломатическое предложение, [POR.GetAdjective] Они отказались от каких-либо предложений о союзе против Испании. Что нам делать с этим развитием?"
 mexico.61.a:0 "Неважно, они не помешают нашим планам."
 mexico.61.b:0 "Они узнают цену неповиновения."
 MEX_focus_the_defenders_of_catholicism:0 "Защитники католицизма"
 MEX_focus_the_defenders_of_catholicism_desc:0 "Как гордая и быстро растущая католическая страна, мы будем самоотверженно вести католический мир, опираясь на общую веру. Мы заявим права на многие важные места христианской истории и нанесём удар по врагам, прежде чем наши братья пострадают ещё сильнее."
 MEX_focus_forge_an_overseas_empire:0 "Создать заморскую империю"
 MEX_focus_forge_an_overseas_empire_desc:0 "Трагедия нашей истории в том, что Мексиканская империя была слишком ослаблена внутренними распрями, чтобы участвовать в разделе Африки. Теперь, когда мы едины и сильнее, чем когда-либо, пришло время заявить миру о своём присутствии за океаном."
 MEX_idea_towards_a_pluricontinental_mexico:0 "К многоконтинентальной Мексике"
 MEX_idea_towards_a_pluricontinental_mexico_desc:0 ""
 MEX_focus_assert_control_in_manila:0 "Установить контроль над Манилой"
 MEX_focus_assert_control_in_manila_desc:0 "Во время испанского колониального правления многие новые испанцы были поселены на Филиппинах, где мы смешались с местными группами, отмечая наше влияние на архипелаг. С этим [USA.GetAdjective]Выброшенные из этих земель, мы вернем себе часть нашего национального наследия!"
 MEX_focus_assert_control_in_manila_tt:0 "Каждое контролируемое состояние, которое является §Y[PHI.GetAdjective]§! Иск будет подан и §Y15§! соблюдение."
 MEX_EMPIRE_neutrality:0 "Мексиканская империя"
 MEX_EMPIRE_neutrality_def:0 "Мексиканская империя"
 Mexican_focus:0 "Национальные фокусы Мексики"
 MEX_force_calles_into_exile:0 "Вынудить Кальеса отправиться в изгнание"
 MEX_force_calles_into_exile_desc:0 "Кальес враждует с нынешним президентом Ласаро Карденасом и настроил консервативную базу против него, изображая Карденаса коммунистом, желающим создать второй Советский Союз. Напряжённость достигла предела, а его сторонники перешли к насилию. По мере роста беспорядков и без того испорченная репутация Кальеса окончательно рухнула, что позволило изгнать его без серьёзных протестов."
 MEX_oppose_cardenas_liberal_reforms:0 "Выступить против либеральных реформ Карденаса"
 MEX_oppose_cardenas_liberal_reforms_desc:0 "В последние годы Карденас подрывал власть Кальеса, и недопустимо, что он продолжает навязывать нашему гордому народу левую программу! Мы собрали верных каудильо, готовых действовать. Осталось выбрать подходящие время и место..."
 MEX_purge_callistas:0 "Провести чистку кальистов"
 MEX_purge_callistas_desc:0 "Хотя Кальес изгнан в Америку, у него всё ещё есть сторонники среди высшего командования, способные устроить переворот. Чтобы защитить свободу Мексики, необходимо очистить армию от этой коррупции и снять таких офицеров с должностей."
 MEX_contain_the_caudillos:0 "Сдержать каудильо"
 MEX_contain_the_caudillos_desc:0 "Каудильос по-прежнему остается мощной силой, с которой приходится считаться. Но с приходом к власти нового правительства каудильо можно разделить и уничтожить, что позволит нам сформировать новое ядро вооруженных сил."
 MEX_establish_confederation_of_mexican_workers:0 "Конфедерация мексиканских рабочих"
 MEX_establish_confederation_of_mexican_workers_desc:0 "Конфедерация мексиканских рабочих (CTM) является крупнейшей конфедерацией профсоюзов в Мексике, которая сформировала решающий избирательный блок для PRI в годы после правления Кальеса."
 MEX_fund_national_railway_company:0 "Финансировать Национальную железнодорожную компанию"
 MEX_fund_national_railway_company_desc:0 "Наша инфраструктура остро нуждается в модернизации, а нынешняя железнодорожная сеть неспособна снабжать постоянно растущую промышленность страны. Ради общего блага следует вложить средства в создание государственной железнодорожной компании."
 MEX_enforce_the_land_reforms:0 "Проведение земельных реформ"
 MEX_enforce_the_land_reforms_desc:0 "В последние годы правительство провело земельные реформы, в результате которых было перераспределено 45 миллионов акров земли. 4 миллиона акров этой земли принадлежали американским сельскохозяйственным компаниям, которые были возвращены в законные руки мексиканского народа!"
 MEX_cleanse_the_cabinet:0 "Очистить кабинет"
 MEX_cleanse_the_cabinet_desc:0 "Разобравшись с Кальесом, мы можем потребовать от членов кабинета уйти в отставку и заменить их тщательно отобранными людьми."
 MEX_Selective_Retirement:0 "Выборочный выход на пенсию"
 MEX_Selective_Retirement_desc:0 "В качестве альтернативы, мы можем только уволить некоторых генералов, чтобы сохранить некоторых из наших более опытных людей, но это, очевидно, будет выглядеть как захват власти параноиком Каудильосом."
 MEX_enforce_the_mandatory_retirement:0 "Применим обязательный закон о выходе на пенсию"
 MEX_enforce_the_mandatory_retirement_desc:0 "По иронии судьбы, Мексика вынудила многих своих генералов уйти с действительной службы. Это была попытка стабилизировать Мексику, отстранив от власти старых каудильо, а также привнеся новую кровь в клуб стариков, которые давно прошли свой расцвет как умственно, так и физически. Удивительно, но этот шаг был принят по всем направлениям без серьезных проблем даже Максимино Авилой Камачо."
 MEX_secure_the_leftist_support:0 "Заручиться поддержкой левых"
 MEX_secure_the_leftist_support_desc:0 "Коммунисты правы, чтобы решить проблемы Мексики, мы должны отказаться от капитализма, который причинил мексиканцам столько страданий при иностранных компаниях."
 MEX_rural_militias_recruitment_draft:0 "Законопроект о наборе сельского ополчения"
 MEX_rural_militias_recruitment_draft_desc:0 "Аграрный союз предполагал милитаризацию сельских районов Мексики и включение зарегистрированных ополченцев в армейский резерв с призывом во время войны. Правительство оценивало, что такая политика позволит привлечь в резерв около трёх миллионов мексиканцев."
 MEX_side_with_the_rich:0 "На стороне богатых"
 MEX_side_with_the_rich_desc:0 "Порфиристы правы, Мексика развивалась гораздо быстрее при диктатуре и вызвала самый долгий период мира в нашей истории. Мы должны отменить выборы, потому что мы знаем, что правильно."
 MEX_negotiate_with_conservatives:0 "Переговоры с консерваторами"
 MEX_negotiate_with_conservatives_desc:0 "Единственный по-настоящему правильный способ решить проблемы Мексики - это действительно демократическое голосование, и все меньшее - повторение той же ошибки, которую Мексика совершала снова и снова."
 MEX_consolidate_the_prm_grip:0 "Консолидация PRM Grip"
 MEX_consolidate_the_prm_grip_desc:0 "Растущая популярность PRM не оставляет другого выбора, кроме как стать голосом всей Мексики. Все четыре крыла партии объединят свои усилия для установления стабильного положения. [ROOT.getAdjective] Штат!"
 MEX_seize_strategic_businesses:0 "Захватить стратегические предприятия"
 MEX_seize_strategic_businesses_desc:0 "Статья 33 гласит, что только граждане Мексики могут влиять на внутреннюю политику страны. Сейчас многие нарушают этот закон. Следует применить его, чтобы устранить политических противников и сохранить нашу монополию на власть."
 electric:0 "Федеральная комиссия по электроэнергетике"
 MEX_oil_the_broken_relationships:0 "Нефть: разорванные отношения"
 MEX_oil_the_broken_relationships_desc:0 "Наша нефтяная промышленность опиралась на иностранных специалистов, которые ушли после национализации, оставив нам снизившуюся добычу нефти. Мы можем использовать наш неиспользованный потенциал для иностранных держав, которые голодают из-за нефти для военных усилий, где мы убеждаем их направить экспертов для оптимизации наших нефтяных месторождений и значительно увеличить прибыль с небольшими инвестициями в нашу часть."
 MEX_pan_latinism_not_pan_americanism:0 "Панлатинизм, а не панамериканизм"
 MEX_pan_latinism_not_pan_americanism_desc:0 "Несмотря на все усилия США, они не станут господствующей силой в Латинской Америке! Мексика планирует создать нейтральный блок латиноамериканских стран, который защитит особую региональную идентичность и выступит против империализма Соединённых Штатов."
 MEX_ratify_the_pacific_alliance:0 "Ратифицировать Тихоокеанский альянс"
 MEX_ratify_the_pacific_alliance_desc:0 "Мексиканская разведка знала, что Соединенные Штаты и Япония находятся на краш-курсе войны, и рассматривала, какую сторону поддержать в этой реальности. В действительности Мексика решила не принимать Японию, сославшись на отсутствие у японцев способности защищать мексиканские берега от военно-морских бомбардировок США."
 MEX_distance_from_europe:0 "Расстояние от Европы"
 MEX_distance_from_europe_desc:0 "Во время Второй мировой войны Мексика подписала соглашение с США о создании комиссии по обороне под предлогом того, что США будут предоставлять в аренду Мексике военную технику. Мексика получила очень мало поддержки, и она быстро развалилась после Второй мировой войны."
 MEX_reintroduce_cientificos:0 "Вернуть сьентификос"
 MEX_reintroduce_cientificos_desc:0 "Сьентификос были группой технократических советников Порфирио Диаса, тесно сотрудничавших с богатыми элитами страны и помогавших развитию [MEX.getAdjective] государства как в промышленности, так и в науке."
 MEX_empower_the_caudillos:0 "Уполномочить Каудильоса"
 MEX_empower_the_caudillos_desc:0 "Каудильос были сильными людьми Мексики, военными офицерами, которые часто занимали политические должности. В некоторых случаях Каудильо обладал большей властью в своём родном штате, чем федеральное правительство. Они часто использовали свою власть, чтобы преследовать свои собственные личные идеалы, такие как правое правительство через перевороты или желания, такие как большие военные расходы через голосование в Конгрессе, чтобы увеличить свою власть."
 MEX_strengthen_seccion_primera:0 "Укрепить Первую секцию"
 MEX_strengthen_seccion_primera_desc:0 "DGIPS являлось службой внутренней безопасности Мексики, схожей по функциям с ФБР или Управлением по борьбе с наркотиками, прежде чем было переименовано в DFS."
 MEX_finish_the_red_transition:0 "Завершите красный переход"
 MEX_finish_the_red_transition_desc:0 "Франсиско Дж. Мугика представляет левое радикальное крыло политического режима Карденаса. С несколькими хорошо подобранными заменами он может стать новым лидером партии, и не имеет значения, что скажет оппозиция!"
 MEX_subversive_nationalization:0 "Подрывная национализация"
 MEX_subversive_nationalization_desc:0 "Месторождения Поза-Рика, расположенные в Веракрусе, являются самым продуктивным и богатым нефтяным месторождением Мексики в эту эпоху. Владение этим полем было мечтой многих мексиканских элит. Однако революционный идеал должен был бы социализировать этот ценный ресурс и использовать его для того, чтобы обеспечить экономическое процветание Мексики."
 MEX_subsidize_national_economy:0 "Субсидировать национальную экономику"
 MEX_subsidize_national_economy_desc:0 "Часть государственных средств будет направлена на создание промышленной базы, независимой от иностранного капитала и влияния. Центральные районы Мексики всё ещё слабо индустриализированы и нуждаются в поддержке."
 MEX_focus_on_civilian_economy:0 "Сконцентрироваться на гражданской экономике"
 MEX_focus_on_civilian_economy_desc:0 "Мировые державы могут разорвать себя на куски земель, которые никому не нужны. Наша страна должна работать и работать над этим."
 MEX_support_militaristic_sentiment:0 "Поддержка милитаристских настроений"
 MEX_support_militaristic_sentiment_desc:0 "Наше драгоценное государство остро нуждается в сильных мужчинах и женщинах, которые будут защищать страну от иностранных захватчиков. Смена завода должна быть расширена, а новые объекты должны быть подняты, чтобы мы могли противостоять надвигающемуся шторму."
 MEX_enforce_article_27:0 "Принудительная статья 27"
 MEX_enforce_article_27_desc:0 "Статья 27 является спорным разделом мексиканской конституции, которая при принудительном исполнении дает право собственности на стратегические ресурсы государству. Этот пункт конституции был юридическим приоритетом для создания PEMEX."
 MEX_socialist_education:0 "Социалистическое образование"
 MEX_socialist_education_desc:0 "Вводя равные возможности для всех социальных классов, мы сможем бороться с неграмотностью нашей нации большими темпами и, наконец, создать современное трудолюбивое общество!"
 MEX_the_gentleman_agreement:0 "Джентльменское соглашение"
 MEX_the_gentleman_agreement_desc:0 "Стало очевидно, что нынешняя политическая структура снова погрузится в хаос, если мы не сможем сформировать коалиционное правительство, способное находить компромиссы на месте. К счастью, у нас есть несколько кандидатов, способных вписаться в роль."
 MEX_reassure_investors:0 "Успокоить инвесторов"
 MEX_reassure_investors_desc:0 "Мексика провела следующие шесть лет, заверяя иностранных инвесторов и принимая законы для защиты иностранных инвестиций после потери доверия от национализации PEMEX."
 MEX_amend_article_3:0 "Изменить статью 3"
 MEX_amend_article_3_desc:0 "Статья 3 первоначально содержала гарантию социалистического образования. После 1940 года это было устранено."
 MEX_strengthen_ties_with_industrialists:0 "Укрепление связей с промышленниками"
 MEX_strengthen_ties_with_industrialists_desc:0 "Аксель Веннер Грен был эксцентричным шведским бизнесменом, и в 1930-х годах его называли одним из богатейших людей мира. Он пытался договориться о мире во время Второй мировой войны, но обе стороны считали его вредителем. Когда он попытался расширить свое влияние на Мексику, он разозлил союзные державы и был внесен в черный список, используя переговоры с нацистами в качестве притворства."
 MEX_utilize_the_foreign_capital:0 "Используйте иностранный капитал"
 MEX_utilize_the_foreign_capital_desc:0 "Капиталистический характер различных правых инвесторов обеспечивает прекрасную почву для создания здоровой и экономически сильной Мексики. Давайте используем их поддержку как можно больше и будем иметь дело с возможными последствиями позже."
 MEX_export_control_board:0 "Совет по экспортному контролю"
 MEX_export_control_board_desc:0 "Аксель Веннер Грен планировал создать в Мексике Совет по экспортному контролю, который сделал бы его экономическим царем Мексики. Это была соломинка, которая сломала верблюду спину и заставила союзников внести его в черный список."
 MEX_assist_the_democratic_cause:0 "Помогите демократическому делу"
 MEX_assist_the_democratic_cause_desc:0 "Нападение немецких подводных лодок на SS Potrero del Llano и SS Faja de Oro заставило Мексику вступить в войну на стороне союзников 21 мая 1942 года."
 MEX_sign_the_sinclair_agreements:0 "Подписать соглашение Синклера"
 MEX_sign_the_sinclair_agreements_desc:0 "Соглашение Синклера стало первой сделкой между Союзниками и Мексикой, признавшей мексиканское право собственности на нефть. Её следовало продавать посреднической компании Sinclair, которая затем направляла сырьё на нужды войны."
 MEX_secure_the_coastline:0 "Защитите береговую линию"
 MEX_secure_the_coastline_desc:0 "Америка обратилась к Мексике с просьбой разрешить строительство радиолокационных станций в уязвимых районах западного побережья."
 MEX_launch_the_bracero_program:0 "Запустить программу брасеро"
 MEX_launch_the_bracero_program_desc:0 "Программа брасеро привлекала мексиканских граждан для работы на фермах, заводах и в логистике ради поддержки военных усилий. Рабочие должны были получать оплату по контракту, однако выплаты сильно зависели от профессии, и многие получали не всю сумму или не получали ничего. По оценкам, с учётом процентов бывшим брасеро до сих пор должны около 500 миллионов долларов."
 MEX_international_socialist_union:0 "Международный социалистический союз"
 MEX_international_socialist_union_desc:0 "Мы заранее ограничили нашу внешнюю дипломатию, но с четко поставленными целями, может быть, удастся странам подобной социалистической ориентации совместно преследовать общие цели?"
 MEX_approach_germany:0 "Сблизиться с Германией"
 MEX_approach_germany_desc:0 "У нас много общего с немецкими друзьями, особенно со времён Великой войны, когда постоянные контакты позволили нам ещё сильнее сблизиться с США!"
 MEX_solidify_the_davis_deal:0 "Закрепить сделку Дэвиса"
 MEX_solidify_the_davis_deal_desc:0 "Сделка Дэвиса была соглашением между Мексикой и державами Оси о покупке нефти у американского посредника, который продал бы нефть Италии, которая затем доставила бы ее в Германию. Эта сделка составила лишь 50% от общего объема производства Мексики, поскольку Германия была связана договором о покупке нефти у Великобритании и США. Когда германский флот попытался купить нефть в избытке у Мексики, они были замурованы камнем. Сделка официально закончилась в 1940 году, когда Королевский флот блокировал Италию."
 MEX_joint_mining_expeditions:0 "Совместные горные экспедиции"
 MEX_joint_mining_expeditions_desc:0 "Германия предложила условия для создания совместных германо-мексиканских горнодобывающих компаний, которые вытеснят влияние США в мексиканском горнодобывающем секторе."
 MEX_construct_the_salinas_cruz_pipeline:0 "Строительство трубопровода Salinas Cruz"
 MEX_construct_the_salinas_cruz_pipeline_desc:0 "Япония рассматривала возможность строительства трубопровода между восточным побережьем и Салинасом Крузом через перешеек Теуантепек. Этот мега-проект был построен в более поздние сроки в реальной жизни."
 MEX_lay_down_the_cooperative_basis:0 "Заложить основу сотрудничества"
 MEX_lay_down_the_cooperative_basis_desc:0 "Мы откроем рынки иностранным инвестициям, а политиков — торговым соглашениям. Только так можно избежать разрушительных экономических санкций великих держав."
 MEX_pan_american_highway:0 "Панамериканское шоссе"
 MEX_pan_american_highway_desc:0 "Идеи о сверхмагистрали через всю Америку появились ещё в конце XIX века в виде так и не построенной железной дороги. В 1920-х годах её сменила концепция автомобильной трассы. 29 июля 1937 года был подписан договор о строительстве, а в 1950-х Мексика первой среди стран Латинской Америки завершила свой участок."
 MEX_encourage_foreign_immigration:0 "Поощрять иностранную иммиграцию"
 MEX_encourage_foreign_immigration_desc:0 "Японские иммигранты были обычными для западной Мексики рабочими и дружили со своими мексиканскими коллегами. Во время Второй мировой войны японские иммигранты были вынуждены переехать в города, чтобы они не смогли помочь организовать синархистское восстание в сельских районах страны."
 MEX_squash_foreign_propaganda:0 "Зарубежная пропаганда"
 MEX_squash_foreign_propaganda_desc:0 "Мексика не чужда иностранной пропаганде. Нация была игровой площадкой для пропагандистских сетей от всех крупных империй и фракций на земле, от Советов до немцев и даже европейцев. Самым вопиющим случаем была пропагандистская машина Франко, которой было поручено сеять инакомыслие в Мексике, где Франсиско Франко тратил много тысяч на пропагандистские усилия в месяц."
 MEX_green_revolution:0 "Зелёная революция"
 MEX_green_revolution_desc:0 "Наша страна переживает огромные перемены не только в политике, но и в экономике. Фермы стремительно расширяются, сельскохозяйственные запасы достигли рекордного уровня, а население пользуется благами качественного образования и здравоохранения. Настоящая Зелёная революция охватывает Мексику!"
 MEX_finish_the_education_battle:0 "Завершите образовательную битву"
 MEX_finish_the_education_battle_desc:0 "Наши программы по обучению грамоте в последние годы достигли больших успехов! Теперь пришло время закончить работу и расширить предложение начального образования в сельских районах нашей страны!"
 MEX_invite_ibec_investors:0 "Пригласить инвесторов IBEC"
 MEX_invite_ibec_investors_desc:0 "IBEC был основан после 1945 года Нельсоном Рокфеллером из-за неприязни к президенту Гарри С. Трумэн. Нельсон хотел доказать латиноамериканцам, и особенно Трумэну, как индустриализировать Латинскую Америку."
 MEX_forge_the_pact_of_honor:0 "Заключить Пакт чести"
 MEX_forge_the_pact_of_honor_desc:0 "Максимино Авила Камачо создал то, что было известно как пакт чести, своего рода теневое правительство, состоящее из людей и организаций, которые он подрывал или убеждал присоединиться к его делу. Эти люди часто находились в плохом положении, и Максимино предлагал выход, например, компаниям, пострадавшим от национализации PEMEX, или сторонникам Calles, которые пострадали, когда его власть рухнула."
 MEX_subvert_the_political_unions:0 "Разрушить политические союзы"
 MEX_subvert_the_political_unions_desc:0 "Максимино был экспертом по подрыву профсоюзов. В Пуэбле он демонтировал и реформировал Союзы, чтобы дать ему возможность быть человеком народа."
 MEX_fill_the_loyal_cabinet:0 "Сформировать лояльный кабинет"
 MEX_fill_the_loyal_cabinet_desc:0 "Подобно тому как у Максимина был Пакт чести, у Алемана существовала собственная организация, которую историки называют «Камарильей». Исторически этим словом обозначали людей, стоявших за спиной короля при испанском дворе."
 MEX_introduce_political_inquisition:0 "Ввести политическую инквизицию"
 MEX_introduce_political_inquisition_desc:0 "Мигель Алеман был известен не только подозрительной благосклонностью судьбы, но и тем, что уничтожал врагов совершенно законными методами, например превращая федеральных следователей в инквизиторов."
 MEX_a_union_of_unions:0 "Союз союзов"
 MEX_a_union_of_unions_desc:0 "Форма коммунизма в Мексике всегда была уникальной. В противовес советскому коммунизму, популярный мексиканский коммунизм пришел в варианте к синдикализму. Профсоюзам придавалось большое значение и место в правительстве, призванном отражать волю народа, при этом некоторые желаемые за действительность мысли вращались вокруг идеи забрать шахты у иностранцев, чтобы передать их мексиканцам."
 MEX_establish_union_regional_offices:0 "Создание региональных офисов Союза"
 MEX_establish_union_regional_offices_desc:0 "Синдикалистская революция должна быть надлежащим образом представлена простому народу в самых глубоких и изолированных частях нашей страны. Создание новых рабочих мест должно обеспечить достаточно места для того, чтобы каждый мог принять новую судьбу Мексики!"
 MEX_intervene_in_the_us:0 "Вмешаться в дела Соединённых Штатов"
 MEX_intervene_in_the_us_desc:0 "После беспорядков в костюмах зут и нападений американских граждан и военнослужащих на мексиканцев как крайне левые, так и крайне правые потребовали вмешательства."
 mexico_calles.1.t:0 "Повстанцы атаковали пассажирский поезд!"
 mexico_calles.1.d:0 "Вчера диссиденты устроили засаду на поезд Мехико — Веракрус, в результате которой погибли несколько мексиканских политиков из партии PRM.\n\nПоезд был атакован на мосту, заранее заминированном взрывчаткой, что исключает обычное ограбление как мотив. Обнаруженные властями обломки полностью выгорели, почти не оставив следов для расследования. В последние годы [ROOT.getNameDefCap] сталкивается с растущей политической поляризацией, и теперь экстремисты, похоже, переходят к насилию."
 mexico_calles.1.a:0 "Трагедия... Но кто за этим стоит?"
 mexico_calles.2.t:0 "Кальес арестован и изгнан!"
 mexico_calles.2.d:0 "По приказу президента [MEX.GetLeader] были арестованы бывший президент Плутарко Элиас Кальес и трое его ближайших сторонников.\n\nМексиканские левые обвиняли Кальеса в попытках разжечь недовольство правых против президента Карденаса, которого он называл коммунистом, и, возможно, втянуть страну в гражданскую войну.\n\nКогда власти ворвались на ранчо, Кальеса нашли лежащим в постели и читающим испанский перевод книги Гитлера «Моя борьба». Глубокой ночью его посадили на самолёт до Хьюстона, штат Техас, откуда утром он должен был отправиться в Сан-Диего и поселиться у сестры.\n\nТакже был обнаружен тайник с оружием, предположительно предназначенным для снабжения мятежников."
 mexico_calles.2.a:0 "Кальес получил то же обращение, которому подвергал многих других."
 mexico_calles.3.t:0 "Звонит Восстание!"
 mexico_calles.3.d:0 "Сторонники Каллисты начали восстание в Мексике в ответ на то, что они называют «советизацией» Мексики.\n\nВвергнутый в безумие риторикой Плутарко, его сторонники погрузили Мексику в еще одну гражданскую войну.\n\nОстается выяснить, дойдет ли это восстание до жестокости мексиканской революции, которая раздирала Мексику на 10 лет."
 mexico_calles.3.a:0 "Пора заканчивать этот фарс!"
 mexico_pemex.1.t:0 "Нефтяные рабочие бастуют"
 mexico_pemex.1.d:0 "Президент [Root.GetLeader]Рабочие бастуют против несправедливого обращения со стороны иностранных компаний, выкупивших нефтяную компанию Агилы. Они грубо нарушали многие из наших законов и раньше, и борьба с ними не получит никакой негативной реакции среди мексиканцев. Лучше всего национализировать нефтяную компанию в соответствии с конституционным законом, который утверждает нашу собственность на все природные ресурсы. Национализация нефти поможет финансировать индустриализацию нашей страны, и если война случится, мы получим существенную прибыль."
 mexico_pemex.1.a:0 "Давай сыграем в силу."
 mexico_pemex.2.t:0 "Мексика национализирует нефтяные компании."
 mexico_pemex.2.d:0 "[MEX.GetLeader] В Мексике объявлена национализация нефтяных компаний. Ранее иностранные компании должны быть конфискованы и переданы под контроль государственной нефтяной компании PEMEX. Это непропорционально влияет на британские и голландские компании, которые требуют, чтобы их правительства вступили в войну. Америка в значительной степени не уверена, стоит ли потворствовать или осуждать национализацию, поскольку присутствие на мексиканском нефтяном рынке было не только незначительным, но и национализация помогает их бизнесу, устраняя иностранную конкуренцию."
 mexico_pemex.2.a:0 "Это безумие, Мексика начнет войну!"
 mexico_pemex.2.b:0 "Возмутительно! Они осмеливаются украсть нашу собственность!"
 mexico_pemex.2.c:0 "Теперь мы ждем и видим их ответ."
 mexico_pemex.3.t:0 "Мексика национализирует нефть."
 mexico_pemex.3.d:0 "Мексика объявила о национализации любых природных ресурсов страны. Лоббисты требуют войны, но она станет политически беспорядочной, когда растущая мощь Германии станет гораздо более явной угрозой. Если мы будем вести войну, у нас будет меньше людей и ресурсов для борьбы с Германией. Местность неровная, и это, вероятно, будет затянувшаяся война. Другой вариант — ввести эмбарго и заставить их вернуть наши активы, когда Мексика поймет, что у нее нет опыта управления нефтяной компанией."
 mexico_pemex.3.a:0 "Объявить войну"
 mexico_pemex.3.b:0 "Уморить их голодом."
 mexico_pemex.4.t:0 "Мексика национализирует нефть."
 mexico_pemex.4.d:0 "Мексика объявила о национализации любых природных ресурсов страны. Лоббисты требуют войны, но она станет политически беспорядочной, когда растущая мощь Германии станет гораздо более явной угрозой. Если мы будем вести войну, у нас будет меньше людей и ресурсов для борьбы с Германией. Местность неровная, и это, вероятно, будет затянувшаяся война. Другой вариант — ввести эмбарго и заставить их вернуть наши активы, когда Мексика поймет, что у нее нет опыта управления нефтяной компанией."
 mexico_pemex.4.c:0 "Объявить войну"
 mexico_pemex.4.e:0 "Уморить их голодом."
 mexico_pemex.5.t:0 "США. Эмбарго на Мексику!"
 mexico_pemex.5.d:0 "Президент [USA.GetLeader] Мексика будет подвергнута эмбарго в ответ на национализацию американских нефтяных компаний в Мексике. Политические аналитики называют это попыткой лишить мексиканскую государственную нефтяную компанию PEMEX и заставить Мексику вернуть национализированные активы."
 mexico_pemex.5.a:0 "Посмотрим, выживет ли PEMEX."
 mexico_pemex.5.b:0 "Они пытаются нас отморить."
 mexico_pemex.6.t:0 "Великобритания. Эмбарго на Мексику!"
 mexico_pemex.6.d:0 "[ENG.GetLeader] Мексика будет подвергнута эмбарго в ответ на национализацию английских и голландских нефтяных компаний в Мексике. Политические аналитики называют это попыткой лишить мексиканскую государственную нефтяную компанию PEMEX и заставить Мексику вернуть национализированные активы."
 mexico_pemex.6.a:0 "Посмотрим, выживет ли PEMEX."
 mexico_pemex.6.b:0 "Они пытаются нас отморить."
 mexico_pemex.7.t:0 "США. Объявляем войну Мексике!"
 mexico_pemex.7.d:0 "Президент [USA.GetLeader] Объявлено объявление войны Мексике из-за возмущения по поводу конфискации нефтяных активов у американских компаний.[USA.GetLeader] Он заявил, что должен защищать американские интересы и не будет выступать за мексиканское позерство против американских компаний.[MEX.GetLeader] В ответ на это он заявил, что иностранное владение нефтью не является законным в соответствии с мексиканским законодательством и что любой будущий президент имеет законное право обеспечивать соблюдение закона.[MEX.GetLeader] Они также заявили, что будут бороться за защиту своей конституции от иностранных интересов."
 mexico_pemex.7.a:0 "Боже мой."
 mexico_pemex.7.b:0 "Диос Мио."
 mexico_pemex.8.t:0 "Великобритания объявила войну Мексике!"
 mexico_pemex.8.d:0 "Великобритания объявила войну Мексике из-за национализации более 130 миллионов долларов активов.[ENG.GetLeader] Он заявил, что «не имеет значения, с нами Америка или против нас, Соединенное Королевство не будет толкаться!» Излишне говорить, что Мексика находится в очень трудном положении."
 mexico_pemex.8.a:0 "Боже мой."
 mexico_pemex.8.b:0 "Диос Мио."
 mexico_pemex.9.t:0 "Компенсация"
 mexico_pemex.9.d:0 "Теперь, когда мы находимся под эмбарго и война временно предотвращена, возможно, пришло время предложить выплатить 29 миллионов долларов репараций Америке, которые требовали компенсации для пострадавших предприятий. Это полностью избежит войны с Соединенными Штатами и снимет эмбарго, но наложит временную нагрузку на наш бюджет. Однако расширение наших возможных рынков перевесит штраф."
 mexico_pemex.9.a:0 "Им нужна компенсация? Я бы хотел, чтобы они попробовали."
 mexico_pemex.9.b:0 "Заплатите им компенсацию и прекратите это."
 mexico_minor.2.t:0 "Эскобар возвращается в Мексику!"
 mexico_minor.2.d:0 "Хосе Гонсало Эскобар, лидер неудавшегося восстания Эскобара, вышел из изгнания и возвращается на родину в Мексику.\n\nВ своем выступлении сегодня утром он заявил, что должен быть со своей страной в нужное время. Эскобар был лидером неудавшегося переворота во время мексиканского Максимато, где он первоначально имел успех в наземных боях и был решительно побежден военно-воздушными силами Мексики."
 mexico_minor.2.a:0 "Виве Мексика!"
 mexico_minor.2.b:0 "Кто? Что?"
 mexico_minor.4.t:0 "Мексика приветствует испанских интеллектуалов"
 mexico_minor.4.d:0 "[Root.GetLeader] Он приветствовал интеллектуалов, которые бегут от испанской гражданской войны в мексиканскую университетскую систему. Новый кампус под названием «Дом Испании» позволит интеллигенции продолжить свою работу. Кампус финансировался коалицией банков, федеральных бюро и специальных интересов."
 mexico_minor.4.b:0 "Это действительно гуманитарный акт."
 mexico_minor.4.a:0 "Постройте, и они придут."
 mexico_minor.5.t:0 "Гранты Каудильо"
 mexico_minor.5.d:0 "Каудильо просят гранты на исследования по модернизации нашего военного ведомства: Какие гранты мы должны финансировать?"
 mexico_minor.5.a:0 "Гранты на пехотное оборудование"
 mexico_minor.5.b:0 "Авиационные субсидии"
 mexico_minor.5.c:0 "Танковые гранты"
 mexico_article_30.2.t:0 "Британские дипломаты требуют арестовать Дженкинса"
 mexico_article_30.2.d:0 "Британские дипломаты возмущены и требуют арестовать Уильяма Дженкинса за нарушение статьи 30 конституции. Они обвиняют его во вмешательстве в мексиканскую политику и использовании медийной монополии для настроя населения против Соединённого Королевства. Однако наши источники сообщают, что Дженкинс лишь отказывается показывать в Мексике большинство антинемецких фильмов, и недавние события подтверждают разумность такого решения. Последняя выпущенная картина, «У льва есть крылья», посвящённая налёту Королевских ВВС на Кильский канал, вызвала такой гнев, что кинотеатрам пришлось снять её с показа. Насколько известно, Уильям Дженкинс не совершил ничего явно незаконного, если пробританские фильмы просто непопулярны у мексиканской публики. Эту ситуацию также можно использовать, чтобы выслать не только Дженкинса или британцев, но вообще всех нарушителей закона, сохранив лицо и не возлагая вину на одну сторону. Как поступить?"
 mexico_article_30.2.a:0 "Выслать Уильяма Дженкинса"
 mexico_article_30.2.b:0 "Выслать британцев"
 mexico_article_30.2.c:0 "Выслать всех нарушителей закона"
 mexico_article_30.3.t:0 "Разведывательный доклад: Уильям Дженкинс"
 mexico_article_30.3.d:0 "Британские дипломаты возмущены и требуют арестовать Уильяма Дженкинса за нарушение статьи 30 конституции! Они обвиняют его во вмешательстве в мексиканскую политику и использовании медийной монополии для настроя населения против [ENG.getNameDef].\n\nОднако недавний доклад DFS указывает, что Дженкинс связан с Максимином Камачо, который обеспечивает ему политическую защиту в обмен на деловые возможности. Максимин известен симпатиями к Оси и, по слухам, держит портрет Муссолини над кроватью в своём особняке в Пуэбле. Очевидно, он использует влияние на Дженкинса, чтобы не допустить укрепления нефашистского влияния в Мексике.\n\nПри этом пробританские фильмы крайне непопулярны у мексиканской публики, и в некоторых случаях кинотеатры прекращали их показы. Разрешение таких фильмов порадует [ENG.getNameDef], но не зрителей.\n\nЭту ситуацию также можно использовать, чтобы выслать не только Дженкинса или [ENG.getAdjective] граждан, но вообще всех нарушителей закона, сохранив лицо и не возлагая вину на одну сторону. Как поступить?"
 mexico_article_30.3.a:0 "Выслать Уильяма Дженкинса"
 mexico_article_30.3.b:0 "Выслать [ENG.getAdjective] граждан"
 mexico_article_30.3.c:0 "Выслать всех нарушителей закона"
 mexico_zoot_suit.1.t:0 "Триггер Сонной лагуны"
 mexico_zoot_suit.1.d:0 "Как вы это видите?"
 mexico_zoot_suit.1.a:0 "АКТИВИРОВАТЬ"
 mexico_zoot_suit.2.t:0 "УБИЙСТВО У СОННОЙ ЛАГУНЫ"
 mexico_zoot_suit.2.d:0 "Сонная лагуна, популярное место встреч и свиданий мексиканских подростков, которых часто не допускают в общественные бассейны, стала местом жестокого убийства: там нашли тело мексиканского гражданина и американского военнослужащего Хосе Диаса. Его обнаружили без сознания, в состоянии опьянения и с травмами от тупого предмета. Позже Диас умер в Центральной больнице Лос-Анджелеса. Полиция прочесала город и арестовала лидера банды 38-й улицы Хэнка Лейваса, его девушку Дору Барриос и ещё одного мексикано-американца из 600 задержанных полицией. Хэнк отрицает причастность к убийству. Напряжённость между жителями Лос-Анджелеса и пачуко, также известными как носители костюмов зут, остаётся высокой и, похоже, в ближайшее время не спадёт."
 mexico_zoot_suit.2.a:0 "Отвратительный поступок."
 mexico_zoot_suit.3.t:0 "СУД ПО ДЕЛУ СОННОЙ ЛАГУНЫ"
 mexico_zoot_suit.3.d:0 "Сегодня начался суд по делу об убийстве у Сонной лагуны. Хэнк и ещё двое подсудимых заявили о невиновности. Хэнк утверждал, что в ту ночь на него и его девушку напала группа мужчин. Решив, что это разборка между бандами, он позвал свою банду к Сонной лагуне, чтобы найти нападавших. Они обнаружили вечеринку неподалёку и, приняв её участников за соперников, вступили с ними в драку, продолжавшуюся около десяти минут. Утром было найдено тело Диаса. По заключению коронера, травмы могли быть получены при наезде автомобиля. Обвинение вызвало Э. Дюрана Айреса, начальника Бюро внешних связей управления шерифа Лос-Анджелеса, который заявил, что мексиканцы якобы кровожадны и обладают биологическим стремлением к убийству, унаследованным от ацтекских предков."
 mexico_zoot_suit.3.a:0 "Ничем хорошим это не закончится."
 mexico_zoot_suit.4.t:0 "ХЭНК ОСУЖДЁН"
 mexico_zoot_suit.4.d:0 "Дело Сонной лагуны завершилось: Хэнк и ещё шестнадцать человек признаны виновными в убийстве. Мужчин отправят в тюрьму Сан-Квентин, а их подруг, подозреваемых в пособничестве, — в печально известную исправительную школу Вентура для «трудных» и сексуально распущенных девушек. Вентура известна крайне жестокими условиями, и приговорённые туда женщины нередко пытаются покончить с собой ещё до перевода. Сообщается, что одна девушка проглотила английские булавки, пытаясь избежать наказания."
 mexico_zoot_suit.4.a:0 "Возможно, теперь напряжённость спадёт."
 mexico_zoot_suit.5.t:0 "БЕСПОРЯДКИ В КОСТЮМАХ ЗУТ"
 mexico_zoot_suit.5.d:0 "Расовая напряжённость в Лос-Анджелесе переросла в массовые беспорядки после столкновения группы пачуко с американскими военнослужащими. Тысячи военных самовольно покидают базы, чтобы участвовать в погромах; некоторые приезжают даже из Лас-Вегаса. Военнослужащие врываются в бары, театры и кафе, вытаскивают мексиканскую молодёжь, иногда детей, раздевают, избивают и сжигают одежду. Меньшая толпа направилась в чёрный район Уоттс, но масштаб ущерба там пока неизвестен. Полиция Лос-Анджелеса отказалась вмешиваться, заявив: «Что ж, мы выражали общественное мнение. Многие из нас служили в Первую мировую и не станут придираться к ребятам на службе»."
 mexico_zoot_suit.5.a:0 "Ужасающе."
 mexico_zoot_suit.6.t:0 "МЕКСИКА В ЯРОСТИ"
 mexico_zoot_suit.6.d:0 "Мексика возмущена тем, как власти отреагировали на беспорядки в костюмах зут. Националисты называют нападения американских военнослужащих на мексиканских граждан актом войны и требуют от правительства вмешаться и объявить войну за эту вопиющую агрессию. Коммунисты и левые националисты также поддерживают такую позицию, заявляя, что случившееся нельзя простить. Ситуация вышла из-под контроля, и неизвестно, восстановятся ли когда-нибудь мексикано-американские отношения."
 mexico_zoot_suit.6.a:0 "Ситуация выходит из-под контроля."
 mexico_zoot_suit.7.t:0 "Разведданные: Лос-Анджелес, Калифорния"
 mexico_zoot_suit.7.d:0 "Мы разработали план по использованию мексиканских эмигрантов в Соединённых Штатах в качестве информаторов разведки. Многие уехали, спасаясь от революции, а некоторые даже служат в армии! Возможно, среди них найдутся мексиканские патриоты, готовые передавать важные сведения."
 mexico_zoot_suit.7.a:0 "Посмотрим, что удастся сделать."
 mexico_communist.1.t:0 "Об этом сообщает Dioniso Encinia"
 mexico_communist.1.d:0 "PCM была основана и активно финансировалась Советской Россией. Его лидер, Дионисо Энчиния, является известной советской марионеткой, и его присутствие вызывает разногласия, как никогда раньше. В 20-х годах ПКМ раскололась на многие противостоящие коммунистические партии полностью из-за отсутствия безопасности Дионисо с последними очищающими членами, которые могли угрожать его место в качестве лидера. После неудачного государственного переворота, поддержанного Советским Союзом в 1929 году, ККМ была окончательно объявлена вне закона Кейлсом и его сторонниками.\n\nУчитывая, что их нынешний лидер так сильно зависит от советского руководства и советов его гораздо более способной жены, Мексика во главе с PCM была бы не более чем буквально марионеточным государством СССР в Центральной Америке, оставаясь при этом чрезвычайно непопулярной внутри страны из-за низкой базы поддержки.\n\nПоскольку было решено принять левую политику, коммунистический захват является реальностью ближайшего будущего, но у нас все еще есть право голоса по поводу того, кто возглавит его. Покушение на убийство..."
 mexico_communist.1.a:0 "Успех в убийстве Дионисо"
 mexico_communist.1.b:0 "Это меньше мечта властолюбивых бюрократов!"
 mexico_1940.1.t:0 "Кандидат PRI"
 mexico_1940.1.d:0 "Выборы приближаются, и нам необходимо выдвинуть кандидата от PRI против правых. Сейчас есть два варианта. Франсиско Мухика придерживается левых взглядов и ближе к социалистическим идеалам. Его выбор рискован, если социализм непопулярен. Мануэль Авила Камачо — более центристская фигура, приемлемая для правых, но его кандидатура положит конец надеждам на дальнейшие левые реформы."
 mexico_1940.1.a:0 "Выдвинуть Франсиско Мухику в президенты. (Коммунистический выбор)"
 mexico_1940.1.b:0 "Выдвинуть Мануэля Авилу Камачо в президенты. (Нейтральный выбор)"
 mexico_1940.2.t:0 "Кандидат правых"
 mexico_1940.2.d:0 "Среди правых идёт внутренняя борьба между Хуаном Андреу Альмасаном и Хоакином Амаро за президентскую кандидатуру. Альмасана знают прежде всего как предпринимателя, а не военного, и его поддерживают главным образом богатые мексиканцы. Среди бедных рабочих его популярность крайне низка, поскольку он ничего им не предлагает. Его внешняя политика явно ориентирована на США, что ещё сильнее отталкивает простых мексиканцев. Амаро, напротив, известный военный и пользуется уважением националистов. Несмотря на это, Альмасан считается неизбежным кандидатом, а кампания Амаро быстро теряет поддержку из-за громких переходов сторонников. Понятно, что Амаро проиграет: Хуана поддерживают американские интересы, а голосовать за кандидата, которого США попытаются свергнуть, многие считают бессмысленным. Однако часть фашистской клики в мексиканской политике хочет гарантировать, что Альмасан не доживёт до выборов. Максимин Авила Камачо, брат Мануэля Авилы Камачо, разработал план убийства Хуана Альмасана в Пуэбле путём инсценировки железнодорожной катастрофы."
 mexico_1940.2.a:0 "Хуан Альмасан баллотируется в президенты. (Демократический выбор)"
 mexico_1940.2.b:0 "Хуан Альмасан погибает, Амаро баллотируется в президенты. (Фашистский выбор)"
 mexico_1940.3.t:0 "КАНДИДАТ В ПРЕЗИДЕНТЫ МЕКСИКИ ПОГИБ!"
 mexico_1940.3.d:0 "Хуан Альмасан, главный претендент на выдвижение от правых, погиб при сходе поезда с рельсов в Пуэбле вместе со всеми пассажирами. Альмасан был противоречивой фигурой и уже неоднократно становился целью покушений во время кампании. Его сторонники обвиняют PRI в организации катастрофы. Ранее на Альмасана напали убийцы в сарапе, скрывавших пулемёты, когда он гостил у Франсиско Барбосы. Штаб утверждал, что нападавших было около ста и Альмасана пришлось удерживать от попытки выбежать и сразиться с ними. Однако бывший генерал Альфредо Серратос заявил в интервью, что убийц было всего пятеро."
 mexico_1940.3.a:0 "Ужасно."
 mexico_1940.4.t:0 "Выборы в Мексике"
 mexico_1940.4.d:0 "Настал день выборов. Победителем становится..."
 mexico_1940.4.a:0 "Франсиско Мухика (коммунистический выбор)"
 mexico_1940.4.b:0 "Мануэль Авила Камачо (нейтральный выбор)"
 mexico_1940.4.c:0 "Хуан Альмасан (демократический выбор)"
 mexico_1940.4.e:0 "Хоакин Амаро (фашистский выбор)"
 MEX_PEMEX_Situation:0 "Эмбарго против PEMEX"
 MEX_PEMEX_Situation_desc:0 "Мексика не стала просто мириться с последствиями эмбарго против PEMEX. Она приняла ответные меры, чтобы использовать недавно национализированную нефть и поддержать молодую нефтяную промышленность."
 MEX_Stove:0 "Акт о печи"
 MEX_Stove_desc:0 "Что, возможно, является позицией эколога, Мексика настаивала на замене дровяных печей на печи, основанные на нефтяных производных, таких как керосин. Это замедлило вырубку лесов в Мексике и дало мексиканской нефтяной промышленности внутренний рынок."
 MEX_Charity:0 "Националистические пожертвования"
 MEX_Charity_desc:0 "Когда Мексика провозгласила национализацию PEMEX, обычные мексиканцы пожертвовали все, что должны были заплатить за расходы, связанные с национализацией. Одна конкретная история связана с тем, что мексиканцы жертвуют предметы в огромную кучу, а богатые женщины бросают ценные ювелирные изделия, когда ранчо приносят свой ценный скот в дар Республике."
 MEX_Camargo:0 "Разработка месторождения бокситов Камарго"
 MEX_Camargo_desc:0 "Месторождение Камарго было упомянуто в отчете USGS, датированном 1957 годом, где говорится, что месторождение было известно с 1930-х годов, но не использовалось до конца."
 MEX_DGIPS:0 "Операции D.G.I.P.S."
 MEX_DGIPS_desc:0 "Для одних DGIPS — всего лишь хранители порядка, защищающие мексиканскую политику от невидимых угроз; для других — группа обученных американцами убийц, продвигающих определённую повестку. Как обычно, истина находится где-то посередине."
 MEX_arrest_hilde_kruger:0 "Арестовать Хильде Крюгер"
 MEX_arrest_hilde_kruger_desc:0 "Хильде Крюгер была немецкой актрисой, работавшей в США и Мексике. Она вращалась среди американской и мексиканской элиты, особенно близко к президенту Авиле Камачо. По мере затягивания войны она стала немецкой шпионкой."
 MEX_utilize_spy_cells_in_the_usa:0 "Использовать шпионские ячейки в Соединённых Штатах"
 MEX_meddling_in_foreign_affairs:0 "Вмешательство в иностранные дела"
 MEX_andres_figeroa:0 "Андрес Фигероа"
 MEX_juan_andreu_almazan:0 "Хуан Андреу Альмасан"
 MEX_maximino_avila_camacho:0 "Максимин Авила Камачо"
 MEX_manuel_gomez_morin:0 "Мануэль Гомес Морин"
 MEX_gustavo_l_gonzalez:0 "Густаво Гонсалес"
 MEX_miguel_comacho:0 "Мигель Комачо"
 MEX_luis_schaufelberger_alatorre:0 "Луис Шауфельбергер Алаторре"
 MEX_goerge_puflea_craciun:0 "Джордж Пуфля Кречун"
 MEX_alfonso_virgen_meza:0 "Альфонсо Вирхен Меса"
 MEX_francisco_luis_urquizo:0 "Франсиско Луис Уркисо"
 MEX_roberto_fierro_villalobos:0 "Роберто Фьерро Вильялобос"
 MEX_gustavo_adolfo_salinas_camina:0 "Густаво Адольфо Салинас Каминья"
 MEX_manuel_zermeno_araico:0 "Мануэль Серменьо Арайко"
 MEX_alvaro_rosado_osorio:0 "Альваро Росадо Осорио"
 Salinas:0 "Густаво Адольфо Салинас Каминья"
 Salinas_desc:0 "Первый лётчик, совершивший удар по морской цели. В 1943 году он вспоминал: «Использованные мной бомбы были самодельными и состояли из заряда в 52 динамитные шашки. Несмотря на примитивность, они сработали превосходно. Тогда я летал на старом самолёте Wright с толкающим винтом. Мне пришло в голову, что однажды появятся самолёты с грузоподъёмностью, превосходящей самые смелые мечты, и тогда авиация станет военным ударным оружием невероятной мощи. Этот день настал»."
 agustin_olachea2:0 "Агустин Авилес Олачеа"
 agustin_olachea2_desc:0 "Во время Второй мировой войны Агустин Авилес Олачеа создавал авиационные училища и помог оформить мексиканские военно-воздушные силы как современную структуру, когда эпоха самоучек и революционных воздушных героев подходила к концу."
 antonio:0 "Антонио Карденас Родригес"
 antonio_desc:0 "Главным эпизодом военной карьеры Антонио стало командование 201-й эскадрильей над Филиппинами на завершающем этапе Второй мировой войны."
 Maximino:0 "Максимин Авила Камачо"
 Maximino_desc:0 "Максимино — брат Мануэля Авилы Комачо. Максимино известен не только как сочувствующий Оси, но и как деловой партнер Уильяма Дженкинса, который обладает монополией на мексиканские СМИ и препятствует влиянию союзников. Вмешательство Максимино в одиночку уничтожило пропагандистские попытки Франции и Великобритании."
 MEX_PAB:0 "Пабло Кирога Тревиньо"
 MEX_PAB_desc:0 "Пабло Кирога Тревиньо был одним из ближайших союзников Карденаса. Он отвечал за проведение спорной социалистической образовательной политики и активно продвигал курс президента. Кирога был одним из немногих министров первоначального кабинета, поддержавших Карденаса."
 MEX_SANTA:0 "Мигель Г. Санта-Ана"
 MEX_SANTA_desc:0 "Мигель Г. Санта-Ана отвечал за закупку оборудования, припасов и других ресурсов для S.E.D.E.N.A., мексиканского секретариата армии и флота."
 Castillo:0 "Франсиско Кастильо"
 Castillo_desc:0 "Кастильо был известен прежде всего службой послом в зарубежных странах, поиском возможных торговых соглашений и общим улучшением дипломатических отношений."
 agustin_olachea:0 "Агустин Авилес Олачеа"
 agustin_olachea_desc:0 "Агустин Олачеа отвечал за строительство всего, что считалось жизненно важным для работы мексиканских вооружённых сил. Он руководил многочисленными военными проектами по всей стране — от новых авиабаз до военных училищ."
 MEX_plutarco_e_calles_desc:0 "Плутарко Кальес, также известный как «Верховный вождь», был популистским президентом в 1924–1928 годах. Поначалу он считался человеком из народа, пользовался широкой поддержкой и был героем революции. Однако, подобно диктатору Порфирио Диасу, против которого и боролась революция, Кальес удерживал власть в Мексике до 1936 года через марионеточных президентов и сторонников в PRM. Со временем его политика всё сильнее смещалась вправо, а после того как его курс способствовал началу войны кристерос, репутация была окончательно разрушена. Кульминацией стало изгнание в Сан-Диего в 1936 году."
 padilla:0 "Эсекиэль Падилья Пеньялоса"
 padilla_desc:0 "За время работы в правительстве Падилья прославился прежде всего твёрдой проамериканской позицией. Он настолько рьяно поддерживал интересы США, что время от времени передавал им совершенно секретные мексиканские документы."
 MEX_eduardo_saurez:0 "Эдуардо Суарес"
 MEX_eduardo_saurez_desc:0 "Эдуардо Суарес занимал пост министра финансов Мексики с 1935 по 1946 год."
 MEX_rex_applegate:0 "Рекс Эпплгейт"
 MEX_rex_applegate_desc:0 "Рекс Эпплгейт был американским офицером и личным телохранителем Рузвельта, направленным обучать мексиканских солдат тактике сил специального назначения, прежде всего ближнему бою. Он продолжал работать советником и после войны."
 Heriberto:0 "Эриберто Хара Корона"
 Heriberto_desc:0 "Эриберто стал первым министром военно-морских сил Мексики. В рамках централизации вооружённых сил это ведомство было создано, чтобы лишить армию политического влияния."
 hector:0 "Эктор Мейшуэйро"
 gustavo:0 "Густаво Адольфо Салинас Каминья"
 gustavo_desc:0 "Первый лётчик, совершивший удар по морской цели. В 1943 году он вспоминал: «Использованные мной бомбы были самодельными и состояли из заряда в 52 динамитные шашки. Несмотря на примитивность, они сработали превосходно. Тогда я летал на старом самолёте Wright с толкающим винтом. Мне пришло в голову, что однажды появятся самолёты с грузоподъёмностью, превосходящей самые смелые мечты, и тогда авиация станет военным ударным оружием невероятной мощи. Этот день настал»."
 enrique_estrada:0 "Энрике Эстрада"
 enrique_estrada_desc:0 "Энрике Эстрада учился у знаменитого революционного генерала Фелипе Анхелеса, который обучил его искусству артиллерии."
 MEX_Manuel_Sandoval_Vallarta:0 "Мануэль Сандоваль Вальярта"
 MEX_Manuel_Sandoval_Vallarta_desc:0 "Вальярта был мексиканским физиком, читавшим лекции в Массачусетском технологическом институте и UNAM. Его областью специализации были космические лучи. В 1927 году он получил стипендию Гуггенхайма и работал в университетах Берлина и Лейпцига, где учился у Эйнштейна, Гейзенберга, Шрёдингера и Планка. В 1946 году он решил полностью сосредоточиться на работе в UNAM и стал советником по научной политике. Вальярта примечателен тем, что наставлял американских студентов, впоследствии участвовавших в Манхэттенском проекте, включая Ричарда Фейнмана и Джулиуса Стрэттона. Он также сотрудничал со знаменитым бельгийским физиком Жоржем Леметром в исследованиях космических лучей."
 MEX_nationalize_oil_fields:0 "Национализация нефтяного месторождения"
 MEX_nationalize_oil_fields_desc:0 "PEMEX является национализированной нефтяной компанией Мексики. Их создание положило начало огромной волне геологических открытий, социальной эволюции и экономических инноваций и стало основной движущей силой индустриализации Мексики."
 aguila:0 "Aguila Oil"
 aguila_desc:0 "Синархисты, мексиканские фашисты, были убеждёнными капиталистами и выступали за национальный контроль над внутренним рынком. Любая иностранная компания могла войти в мексиканскую экономику только через независимого местного посредника. При их власти иностранная нефтяная промышленность была бы принудительно национализирована, а существующая PEMEX — распродана по частям мексиканской элите."
 CEMEX:0 "CEMEX"
 Azcarate:0 "Azcarate S.A."
 Azcarate_desc:0 "После политического изгнания Аскарате создал небольшую авиационную компанию и во время Второй мировой войны разрабатывал проекты совместно с Lockheed Martin."
 baja:0 "Mariscraft S.A."
 baja_desc:0 "Mariscraft была малоизвестной мексиканской авиационной компанией и в реальности построила лишь один самолёт — MA-260. Считалось, что это мексиканский проект дальнего истребителя-бомбардировщика, основанный на концепции 8W Zeus."
 Mendoza:0 "Productos Mendoza"
 Mendoza_desc:0 "Мендоса считается вторым легендарным мексиканским конструктором стрелкового оружия после Мануэля Мондрагона. Компания специализируется на пулемётах — от крупнокалиберных и пистолетов-пулемётов до автоматических винтовок."
 Obregon:0 "Алехандро Обрегон"
 Obregon_desc:0 "Обрегон известен прежде всего пистолетом Obregón .45, который внешне напоминал M1911, но имел совершенно иную и значительно упрощённую внутреннюю конструкцию. Благодаря этому он был надёжнее и дешевле M1911. Пистолеты Обрегона считаются образцом высокого мастерства."
 Grupo_Ramirez:0 "Grupo Ramirez"
 Grupo_Ramirez_desc:0 "Первая автомобильная компания Мексики и создатель грузовика Rural Ramirez. Специализируется на дешёвых и надёжных автомобилях и двигателях."
 Grupo_Ramirez2:0 "Grupo Ramirez"
 Grupo_Ramirez2_desc:0 "Первая автомобильная компания Мексики и создатель грузовика Rural Ramirez. Специализируется на дешёвых и надёжных автомобилях и двигателях."
 VAM:0 "VAM"
 VAM_desc:0 "Подконтрольный государству автопроизводитель, изначально являвшийся американским подразделением Jeep, но ставший самостоятельной компанией после государственного выкупа."
 VAM2:0 "VAM"
 VAM2_desc:0 "Подконтрольный государству автопроизводитель, изначально являвшийся американским подразделением Jeep, но ставший самостоятельной компанией после государственного выкупа."
 TELMEX:0 "TELMEX"
 TELMEX_DESC:0 "Telmex — мексиканская телекоммуникационная монополия. До приватизации компания была выкуплена правительством для модернизации сетей связи страны."
 MEX_ASTIMAR:0 "ASTIMAR"
 MEX_ASTIMAR_desc:0 "ASTIMAR — государственная судостроительная компания, специализирующаяся на канонерских лодках и береговой обороне."
 AHMSA:0 "AHMSA"
 AHMSA_desc:0 "AHMSA — крупнейшая в Мексике компания по добыче железной руды и угля, а также ведущий производитель стали. Она специализируется на деталях машин и стальных конструкциях для инфраструктуры, включая мосты."
 league:0 "Мексиканская лига радиотехнических экспериментов"
 league_desc:0 "Мексиканская лига радиотехнических экспериментов объединяла учёных, среди которых были и юные вундеркинды, внедрявших новшества в радиосвязи. Наибольшую известность им принесло изобретение технологии, сделавшей возможным цветное телевидение."
 Echevarrieta:0 "Верфи Эчеварриеты"
 Echevarrieta_desc:0 "Эчеварриета была испанской судостроительной компанией, продававшей Мексике корабли сопровождения конвоев."
 Odero:0 "Верфи Odero"
 Odero_desc:0 "Odero была итальянской судостроительной компанией, построившей наиболее бронированные корабли мексиканского флота."
 Angel:0 "Анхель Ласкуриан"
 Angel_desc:0 "Анхель Ласкуриан был легендарным мексиканским авиатором и создавал самые передовые и футуристические самолёты среди всех произведённых в стране. Авиационные журналы восхищались тем, как он сумел разработать и построить собственный двухмоторный одноместный грузовой самолёт, используя лишь простой верстак. Машина получила название Aura и, по словам наблюдателей, обладала неестественной для своих размеров манёвренностью."
 electridad:0 "Федеральная комиссия по электроэнергетике"
 electridad_desc:0 "Федеральная комиссия по электроэнергетике — государственная энергетическая компания, также отвечающая за развитие и строительство мексиканских атомных электростанций."
 yokosuka_naval_arsenal2:0 "Военно-морской арсенал Йокосуки"
 MEX_jenkins_blockade:0 "Блокада Дженкинса"
 MEX_jenkins_blockade_desc:0 "Уильям О. Дженкинс владеет монополией на мексиканские СМИ. Его молчаливым партнером в этом был Максимино Авила Комачо, который был Симпатизатором оси. Именно этот союз, названный некоторыми историками «Блокадой Дженкинса», стал одним из главных факторов катастрофического провала британо-французской попытки воспользоваться изоляционизмом во внешней политике Соединенных Штатов и подтолкнуть Мексику в европейскую сферу влияния."
 MEX_porfiriato_heritage_idea:0 "Наследие Порфириато"
 MEX_porfiriato_heritage_idea_desc:0 "Старое богатство Мексики в большой степени Porfiristas, который извлек выгоду из диктатуры Порфиро Диаса. Они поддерживают Германию, невзирая на Соединенное Королевство, и активно срывают усилия британских и французских пропагандистов. Они используют свое обширное политическое присутствие, чтобы подтолкнуть Мексику к объятиям оси."
 MEX_new_era_of_porfirato:0 "Новая эпоха порфириата"
