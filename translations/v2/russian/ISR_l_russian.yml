 ISR_DBG_DESCRIPTION:0 "Давид Йосеф Грюн всегда верил, что именно он сменит Герцля во главе сионистского движения. Многие считали его безумцем или человеком, оторванным от реальности, однако он следовал изречению Герцля: «Если вы захотите — это не будет сказкой».\n\nОн родился в 1886 году в Плоцке в семье бедных и необразованных земледельцев и с юных лет заинтересовался сионизмом. После Кишинёвского погрома Грюн вступил в «Поалей Цион», со временем занял высокий пост в партии и неоднократно встречался с еврейскими лидерами, включая Бера Борохова.\n\nПосле отъезда Борохова в Америку Грюн перебрался в Палестину, где его принял в местное отделение «Поалей Цион» Исраэль Шохат. Шохат считал Грюна полезным исполнителем, тогда как сам Грюн использовал любую возможность для усиления своего влияния в партии. Чтобы уравновесить его, Шохат пригласил недавно прибывшего Ицхака Бен-Цви. Грюн и Бен-Цви стали близкими друзьями, однако Грюн постепенно уступал власть Бен-Цви и Шохату. Разочаровавшись, он вышел из партии и переехал в Седжеру, где окончательно принял еврейское имя Бен-Гурион.\n\nС началом Великой войны Бен-Гурион вновь присоединился к Бен-Цви в «Поалей Цион» и призывал поддержать Османскую империю, надеясь заслужить одобрение имперского правительства. Однако власти объявили «Поалей Цион» антитурецкой организацией и выслали всех её членов в Египет. Там они провели остаток войны, а некоторые присоединились к британцам в борьбе против османов.\n\nПосле создания британского мандата Бен-Гурион основал новую партию «Мапай» и её военизированное крыло — «Хагану». Партия стала господствующей силой в руководстве ишува, а когда пришло время поднять восстание против британцев, именно «Хагана» нанесла первый удар.\n\nТеперь, когда надежда двух тысячелетий наконец близка к осуществлению, именно Бен-Гуриону предстоит довести дело до конца."
