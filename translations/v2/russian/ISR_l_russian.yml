 ISR_vote_category_desc:0 "Сейчас Кнессет голосует по законопроекту. Чтобы обеспечить его принятие, необходимо заручиться поддержкой большинства партий, располагающих в общей сложности 61 местом.\n\n[?ISR_yes_votes] — поддерживают:\n[ISRGetMakiVoteYes][ISRGetHashomerVoteYes][ISRGetMapaiVoteYes][ISRGetNewAliyahVoteYes][ISRGetGeneralZionistsVoteYes][ISRGetHatzoharVoteYes][ISRGetURFVoteYes]\n[?ISR_no_votes] — против:\n[ISRGetMakiVoteNo][ISRGetHashomerVoteNo][ISRGetMapaiVoteNo][ISRGetNewAliyahVoteNo][ISRGetGeneralZionistsVoteNo][ISRGetHatzoharVoteNo][ISRGetURFVoteNo]"
 ISR_constitution_category:0 "The [ISR.GetAdjective] Конституция"
 ISR_constitution_category_desc:0 "У нашего государства нет конституции, что угрожает демократическим институтам, поскольку функции различных ветвей власти чётко не определены. Мы должны попытаться разработать её, но не вызвать чрезмерного недовольства населения, иначе переговоры могут сорваться.\n\nПартии, поддерживающие конституцию:\n[ISRGetMakiConstitutionYes][ISRGetHashomerConstitutionYes][ISRGetMapaiConstitutionYes][ISRGetNewAliyahConstitutionYes][ISRGetGeneralZionistsConstitutionYes][ISRGetHatzoharConstitutionYes][ISRGetURFConstitutionYes]\nВсего голосов: §Y[?ISR_constitution_votes]/61"
