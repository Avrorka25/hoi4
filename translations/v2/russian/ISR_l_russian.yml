 ISR_vote_president_category:0 "Выборы президента"
 ISR_vote_president_category_desc:0 "С основанием нашей новой нации и избранием первого Кнессета мы должны созвать и избрать президента, чтобы стать номинальным главой нашей нации для внешнего мира.\nЕсть 3 основных варианта:\n§OИцхак Бен-Цви§!давний лейбористский сионист и друг Бен-Гуриона, поддерживаемый левыми;\n§gХаим Вейцман§!представитель Ишува по Севрскому договору и Фейсал-Вейцманскому соглашению, поддержанному центром;\n§3Джозеф Клауснер§!Ревизионистский ученый и писатель, поддерживаемый правыми.\n\nУ некоторых есть идея пригласить §RАльберт Эйнштейн§! Как аполитичный деятель, представляющий нацию, однако для его убеждения могут потребоваться усилия. В любом случае, мы должны выбрать, кого поддержать.\n\n§RАльберт Эйнштейн§! В настоящее время [ISRGetEinstein] быть выдвинутым в качестве президента.[ISRGetPresidentialSupport]"
