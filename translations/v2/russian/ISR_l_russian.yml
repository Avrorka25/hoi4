 ISR_sinai_war_category_desc:0 "После национализации Суэцкого канала Египтом мы были вынуждены вторгнуться, чтобы сохранить доступ к его судоходным путям. Однако мы не можем позволить себе оккупировать весь Египет, поэтому должны захватить восточный берег Суэцкого канала и удержать его."
 ISR_defeat_egypt_mission:0 "Удержать восточный берег"
 ISR_push_for_negotiations:0 "Настаивать на переговорах"
 ISR_land_reclamation_category:0 "Проекты освоения земель"
 ISR_land_reclamation_category_desc:0 "Наша страна мала, и для её успеха необходимо использовать каждый дунам земли. Многие территории либо слишком засушливы, либо заболочены и потому не подходят для населённых пунктов и промышленных центров. Мы должны сделать их пригодными для жизни."
 ISR_drain_hula:0 "Осушить болота Хулы"
 ISR_northern_aforestation:0 "Облесение севера"
 ISR_southern_aforestation:0 "Облесение юга"
 ISR_fertilize_the_negev:0 "Озеленить Негев"
 ISR_jabotinsky_category:0 "Ухудшение здоровья Жаботинского"
 ISR_jabotinsky_category_desc:0 "Отец ревизионистского сионизма угасает. После многочисленных проблем со здоровьем стало ясно, что жизнь Жаботинского подходит к концу. Если он продолжит изнурять себя работой, состояние лишь ухудшится. Мы не должны допустить, чтобы ситуация вышла из-под контроля."
 ISR_jabotinsky_dying_mission:0 "Ухудшение здоровья Жаботинского"
 ISR_crush_lehi_category:0 "Подавление восстания «Лехи»"
 ISR_crush_lehi_category_desc:0 "Разворачивается борьба за судьбу нашей страны. По всей стране фашистские предатели под руководством лидера [ISR.GetFascismLeader] восстали против правительства, угрожая самому существованию государства. Это восстание необходимо подавить.\n\nТекущая сила «Лехи»: §Y[?ISR_lehi_strength]%§!.\n"
 ISR_impending_uprising:0 "Подавить восстание «Лехи»"
 ISR_launch_raid:0 "Провести рейд на предполагаемое укрытие «Лехи»"
 ISR_track_lehi_messengers:0 "Выследить связных «Лехи»"
 ISR_sway_former_haganah:0 "Переманить бывших бойцов «Хаганы»"
 ISR_accept_lehi_defectors:0 "Принять перебежчиков из «Лехи»"
 ISR_raid_lehi_convoys:0 "Атаковать конвои «Лехи»"
 ISR_lehi_uprising_category:0 "Восстание «Лехи»"
 ISR_lehi_uprising_category_desc:0 "После смерти Жаботинского Менахем Бегин доказал, что ему нельзя доверять управление страной, и мы подняли против него восстание. «Лехи» значительно меньше «Иргуна», поэтому необходимо тщательно планировать действия и разумно использовать ограниченные ресурсы.\n\nТекущая готовность к перевороту: §Y[?ISR_preparedness]%§!."
 ISR_window_of_oppertunity:0 "Окно возможностей"
 ISR_window_of_oppertunity_desc:0 "Наше окно возможностей открылось! Мы должны ударить, пока не стало слишком поздно."
 ISR_irgun_crackdowns:0 "Репрессии «Иргуна»"
 ISR_attack_irgun_officer:0 "Напасть на офицера «Иргуна»"
 ISR_bomb_irgun_infrastructure:0 "Взорвать инфраструктуру «Иргуна»"
 ISR_sneak_foreign_support:0 "Запросить поддержку государства [FROM.GetNameDef]"
 ISR_request_herzl_body:0 "Попросить вернуть тело Теодора Герцля"
 JOR_core_west_bank:0 "Провозгласить Хашимитское Королевство Иордания"
 JOR_core_west_bank_desc:0 "Захватив западный берег реки Иордан, мы наконец можем объединить наши народы в одной стране."
 JOR_core_west_bank_tt:0 "Мы получим национальные территории на всех контролируемых палестинских регионах."
 israel.1.t:0 "Переворот «Иргуна»!"
 israel.1.d:0 "Вынужденные сотрудничать во время войны, «Хагана» и «Иргун» неохотно сражались бок о бок, чтобы обеспечить независимость страны. Однако теперь, когда напряженность достигла рекордно высокого уровня, дезорганизованная армия снова развалилась, и конфликт между солдатами Хаганы и Иргуна в Тель-Авиве перерос в общенациональный переворот."
 israel.1.a:0 "[ISR.GetNeutralLeader] приведёт нас к славе!"
 israel.2.t:0 "Смерть Зеэва Жаботинского"
 israel.2.d:0 "Сегодня Зеэв Жаботинский скончался от сердечного приступа. На его похороны на кладбище горы Герцля собрались скорбящие со всей страны, включая некоторых членов «Мапай». Его преемник Менахем Бегин поклялся продолжить дело Жаботинского в качестве лидера «Хацохара»."
 israel.2.a:0 "Конец эпохи."
 israel.3.t:0 "Вопрос о столице"
 israel.3.d:0 "После переноса столицы во время Войны за независимость настало время окончательно решить, какой город станет столицей нового еврейского государства. Многие светские группы считают, что ею должен остаться светский центр Тель-Авив, тогда как религиозные общины требуют вернуть столицу в святой город Иерусалим. Что мы выберем?"
 israel.3.a:0 "Столица останется в Тель-Авиве."
 israel.3.b:0 "Столица будет возвращена в Иерусалим."
 israel.4.t:0 "Шестая алия"
 israel.4.d:0 "После провозглашения независимости нового государства еврейские беженцы со всего мира устремились в страну в поисках убежища от нарастающих ужасов фашизма и антисемитизма в Европе и за её пределами. Это вызвало иммиграционный кризис огромного масштаба, однако мы не можем отказать ни одному из них, поскольку приток населения принесёт стране огромную пользу."
 israel.4.a:0 "И среди рушащихся стен народ пел."
 israel.5.t:0 "Выборы во временное собрание"
 israel.5.d:0 "После окончания войны настало время первых выборов. Проведя национальную перепись, ради которой на всей территории страны на пять часов ввели комендантский час, мы наконец готовы.\n\nГраждане со всей страны устремились к избирательным участкам, чтобы отдать голоса своим партиям, и борьба идёт с минимальным перевесом. Лишь время покажет, кто станет победителем."
 israel.5.a:0 "Народ Израиля воистину вновь жив."
 israel.6.t:0 "Рост влияния радикалов"
 israel.6.d:0 "В последнее время поступают сообщения о том, что фракция радикалов пытается усилить своё политическое влияние. Одни утверждают, что они готовят наше свержение, другие считают их надёжными союзниками. Как нам поступить?"
 israel.6.a:0 "Чепуха. Они наши союзники."
 israel.6.b:0 "Немедленно провести чистку. Мы этого не потерпим."
 israel.7.t:0 "Захват власти радикалами"
 israel.7.d:0 "Сегодня радикалы штурмом взяли здание Кнессета и захватили правительство. Во время беспорядков были застрелены [ISR.GetNeutralLeader] и другие члены «Хацохара». [ISR.GetFascistLeader] объявил о создании нового израильского государства, которое вернёт утраченную славу."
 israel.7.a:0 "Они были глупцами, раз доверяли нам."
 israel.8.t:0 "Государство [ISR.GetNameDefCap] требует Иорданию"
 israel.8.d:0 "Сегодня лидер [ISR.GetLeader] официально потребовал передать территории Иордании его Великому Израилю. Он утверждает, что прародина еврейского народа лежит на обоих берегах реки Иордан и эти земли по праву принадлежат им."
 israel.8.a:0 "Возможно, они безумны, но сейчас мы не можем позволить себе войну."
 israel.8.b:0 "Нелепость. Они совсем сошли с ума?"
 israel.9.t:0 "Иордания уступлена"
 israel.9.d:0 "После наших требований государство [455.controller.GetNameDefCap] передало нам контроль над Иорданией. Наш Великий Израиль наконец объединён."
 israel.9.a:0 "Только так."
 israel.10.t:0 "Государство [455.controller.GetNameDefCap] отклоняет наши требования"
 israel.10.d:0 "Сегодня лидер [455.controller.GetLeader] направил нам послание, высмеивающее наше требование передать Иорданию. Он утверждает, что подобные притязания свидетельствуют о нашем безумии."
 israel.10.a:0 "Возможно, когда-нибудь."
 israel.10.b:0 "У нас нет выбора."
 israel.11.t:0 "Проигрыш в Синайской войне"
 israel.11.d:0 "К сожалению, из-за нашей некомпетентности и неспособности вернуть Синай у Израиля нам теперь предлагают уступить и подписать мирный договор. Продолжение войны может обернуться катастрофой для стабильности страны."
 israel.11.a:0 "Это лучшее решение для египетского народа. Мы должны согласиться."
 israel.11.b:0 "Нет! Мы не потерпим унижения!"
 israel.12.t:0 "Победа над Израилем"
 israel.12.d:0 "После дерзкого вторжения израильских войск на Синай они предложили мир, поскольку их операция не допускает вторжения на собственную территорию или провала захвата полуострова. Воистину, Бог на нашей стороне."
 israel.12.a:0 "Мы победили!"
 israel.12.b:0 "Нет! Мы должны наступать дальше!"
 israel.15.t:0 "Йом ха-Ацмаут"
 israel.15.d:0 "Йом ха-Ацмаут — День независимости. Мечта нашего народа, которую он хранил две тысячи лет, наконец осуществилась: мы вновь стали свободным народом на собственной земле. После подписания перемирия по всей стране вспыхнули празднования, и люди наконец поверили, что их тяжёлый труд окупился.\n\nНо это ещё не конец. Теперь настало время объединиться и восстановить страну — евреям и арабам вместе. Мы заняли своё место на мировой арене, но должны сделать всё, чтобы его сохранить."
 israel.15.a:0 "Ам Исраэль хай!"
 israel.16.t:0 "Трудности алии ослабевают"
 israel.16.d:0 "За несколько лет, прошедших после обретения независимости, инфраструктура страны оказалась под огромной нагрузкой из-за волны иммиграции в рамках алии. Однако благодаря расширению промышленности и росту политической легитимности государства разрушительные последствия алии постепенно уменьшаются."
 israel.16.a:0 "И среди рушащихся стен народ пел."
 israel.20.t:0 "Выбор президента Израиля"
 israel.20.d:0 "С созывом Кнессета мы должны принять решение о том, чтобы возглавить нашу страну в качестве президента. Предложений много, но в основном сводится к трем. Хаим Вейцман, представитель ишувов на Севрском договоре, Ицхак Бен-Цви, давний лейбористский сионист и друг Давида Бен-Гуриона, и Альберт Эйнштейн, ведущая еврейская фигура, известная во всем мире.\n\nКнессет расколот, многие говорят, что Эйнштейн - правильный выбор, в то время как другие говорят, что шансы на его принятие низки, и он может быть слишком неопытным с политикой, поэтому Вейцман или Бен-Цви - лучший выбор."
 israel.20.a:0 "Хаим Вейцман был символом сионизма с самого его зарождения. Выбор очевиден."
 israel.20.b:0 "Ицхак Бен-Цви доказал свою преданность. Мы должны выбрать его."
 israel.20.c:0 "Для развития страны нам необходимо научное мышление. Эйнштейн — правильный выбор."
 israel.21.t:0 "Эйнштейн уходит в отставку"
 israel.21.d.a:0 "Сегодня президент Эйнштейн выступил с речью, заявив, что из-за зависимости нынешнего правительства от религиозных партий больше не может занимать должность президента страны ввиду конфликта принципов. Его место займёт бывший кандидат в президенты Хаим Вейцман."
 israel.21.d.b:0 "Сегодня президент Эйнштейн выступил с речью, заявив, что из-за авторитарной политики нынешнего правительства больше не может занимать должность президента страны ввиду конфликта принципов. Его место займёт бывший кандидат в президенты Хаим Вейцман."
 israel.21.a:0 "Он всё равно не подходил для этой должности."
 israel.22.t:0 "Переговоры о перемирии в Иерусалиме"
 israel.22.d.a:0 "После вторжения Иордании на Западный берег мы вынуждены согласовать с государством [JOR.GetNameDef] официальную линию перемирия в Иерусалиме. Город будет разделён между нашими странами, что, будем надеяться, снизит напряжённость."
 israel.22.d.b:0 "После нашего вторжения на Западный берег мы вынуждены согласовать с государством [ISR.GetNameDef] официальную линию перемирия в Иерусалиме. Город будет разделён между нашими странами, что, будем надеяться, снизит напряжённость."
 israel.22.a:0 "Мы неохотно пойдём на компромисс."
 israel.23.t:0 "Возвращение тела Герцля"
 israel.23.d:0 "Великий провидец сионизма Теодор Герцль, основавший саму идею современного еврейского государства, сейчас покоится в родной Вене. Однако в завещании отец сионизма указал, что его останки и останки его семьи должны быть перенесены в Землю Израиля, когда еврейский народ обретёт свободу. Это время настало.\n\nНо сначала необходимо получить согласие государства [4.controller.GetNameDef], которое сейчас контролирует место его захоронения. Следует ли начать переговоры?"
 israel.23.a:0 "Отец сионизма должен обрести последний покой."
 israel.23.b:0 "Пусть останется там, где покоится."
 israel.24.t:0 "Государство [ISR.GetNameDefCap] просит вернуть тело Герцля"
 israel.24.d:0 "Недавно государство [ISR.GetNameDefCap] обратилось к нашему правительству с просьбой перенести останки сионистского лидера и провидца Теодора Герцля из Вены в Израиль. Нам предстоит решить, удовлетворить ли эту просьбу."
 israel.24.a:0 "Они могут забрать его тело."
 israel.24.b:0 "Он останется здесь."
 israel.25.t:0 "Тело Герцля возвращено"
 israel.25.d.a:0 "Государство [4.controller.GetNameDefCap] согласилось вернуть нам тело Герцля. В Иерусалиме создаётся кладбище для великих сионистских лидеров, где он и будет похоронен."
 israel.25.d.b:0 "Государство [4.controller.GetNameDefCap] согласилось вернуть нам тело Герцля. В Тель-Авиве создаётся кладбище для великих сионистских лидеров, где он и будет похоронен."
 israel.25.a:0 "Если вы захотите — это не будет сказкой."
 israel.26.t:0 "Государство [4.controller.GetNameDefCap] отказывается вернуть тело Герцля"
 israel.26.d:0 "Государство [4.controller.GetNameDef] отклонило нашу просьбу вернуть тело Герцля. Пока он останется там."
 israel.26.a:0 "Мы этого не забудем."
 israel.27.t:0 "Арабские мирные жители бегут"
 israel.27.d:0 "По мере того как наша победа становится всё очевиднее, многие арабские мирные жители покидают наши территории и бегут в соседние страны. Нам предстоит решить, как поступить в этой ситуации."
 israel.27.a:0 "Ожидаемо."
 israel.30.t:0 "Выборы на Западном берегу"
 israel.30.d:0 "Готовясь провести первые выборы, мы должны ответить на вопрос: состоятся ли они на Западном берегу? Если да, значительное арабское большинство в регионе несомненно склонит результаты в пользу левых партий. Необходимо сделать выбор."
 israel.30.a:0 "Они такие же граждане, как и все остальные. Выборы состоятся."
 israel.30.b:0 "Пока мы не можем доверять им право голоса."
 israel.31.t:0 "Стареющий отец"
 israel.31.d:0 "Премьер-министр Бен-Гурион неоднократно выражал желание уйти из политики и основать кибуц в Негеве. Многие считают, что он заслужил отдых, но другие уверены, что в нынешнее время стране необходимо его руководство. В случае отставки его место займёт министр иностранных дел Моше Шарет.\n\nКак нам поступить?"
 israel.31.a:0 "Никто не пожертвовал большим, чем он. Пусть отдохнёт."
 israel.31.b:0 "Нам необходимо его руководство."
 israel.32.t:0 "Разработка конституции"
 israel.32.d:0 "Мечта о независимом еврейском государстве исполнилась, а сомневавшиеся умолкли. Однако наши трудности ещё не закончились. У страны нет конституции, определяющей роль правительства в обществе, и если не решить эту проблему, последствия могут оказаться серьёзными. Но предстоит рассмотреть множество спорных вопросов, поэтому выработать краткое общее соглашение будет непросто.\n\n§RЧтобы принять конституцию, необходимо обеспечить ей большинство голосов, но при этом она не должна быть слишком расплывчатой и обязана затронуть определённые вопросы, даже если некоторые партии выступят против решения.§!"
 israel.32.a:0 "Пусть переговоры начнутся."
 israel.33.t:0 "Вопрос о воинской обязанности"
 israel.33.d:0 "Первая дилемма конституционных переговоров касается воинской обязанности. Сейчас многие религиозные общины Израиля получают особые освобождения от службы по религиозным причинам, что вызывает ярость светского большинства.\n\nСледует ли обязать их служить?"
 israel.33.a:0 "Они должны служить наравне со всеми."
 israel.33.b:0 "У них есть веские причины не служить."
 israel.34.t:0 "Вопрос о шаббате"
 israel.34.d:0 "Вторая дилемма конституционных переговоров касается роли шаббата в нашей стране. Одни требуют закрывать в этот день все учреждения и предприятия, тогда как другие считают подобное возмутительным навязыванием религии населению.\n\nКакое решение следует принять?"
 israel.34.a:0 "Религию нельзя навязывать населению."
 israel.34.b:0 "Если мы утратим традиции, останемся ли мы евреями?"
 israel.35.t:0 "Вопрос о Верховном суде"
 israel.35.d:0 "Третья дилемма конституционных переговоров касается Верховного суда. Одни считают, что судебная власть должна быть независимой от Кнессета и служить ему противовесом, другие называют это недемократичным и полагают, что Верховный суд не должен быть внешней силой."
 israel.35.a:0 "Позволить неизбираемому органу влиять на политику было бы недемократично."
 israel.35.b:0 "Позволить правительству большинства принимать любые законы было бы тиранией."
 israel.36.t:0 "Вопрос о национальном государстве"
 israel.36.d:0 "Четвёртая дилемма конституционных переговоров касается общей идентичности страны. Одни выступают за официальное провозглашение Израиля государством еврейского народа и для еврейского народа, другие считают, что во избежание конфликтов этот вопрос следует оставить расплывчатым."
 israel.36.a:0 "Мы должны официально провозгласить очевидное."
 israel.36.b:0 "Оставить формулировку расплывчатой."
 israel.37.t:0 "Вопрос о занятости"
 israel.37.d:0 "Пятая и последняя дилемма конституционных переговоров касается занятости и роли государства. Многие считают, что вопросами трудоустройства должны заниматься профсоюзы, поскольку они защитят права рабочих. Другие полагают, что это приведёт к чрезмерному вмешательству, бюрократии и ограничению личной свободы в выборе работы."
 israel.37.a:0 "Мы должны защищать права рабочих."
 israel.37.b:0 "Мы не должны ущемлять личные свободы."
 israel.38.t:0 "The [ISR.GetAdjective] Конституция"
 israel.38.d:0 "Сегодня [ISR.GetAdjective]ая конституция была принята Кнессетом большинством в [?ISR_constitution_votes] голосов из 120. Поддержавшие её партии назвали это торжеством [ISR.GetAdjective]ой демократии, тогда как противники — тиранией большинства. В любом случае это важный шаг к стабильности страны."
 israel.38.a:0 "Ам Исраэль хай!"
 israel.39.t:0 "Конституционные переговоры провалились"
 israel.39.d.a:0 "Из-за неспособности сохранить поддержку большинства Кнессета переговоры по проекту конституции провалились.\n\nУ нас остался небольшой набор расплывчато обязательных «Основных законов», выполняющих роль псевдоконституции, но их слишком легко изменить, и подобная непрочность, вероятно, приведёт к проблемам в будущем, если мы не сможем исправить положение."
 israel.39.d.b:0 "Из-за неспособности разрешить многие важные вопросы проекта конституции переговоры провалились.\n\nУ нас остался небольшой набор расплывчато обязательных «Основных законов», выполняющих роль псевдоконституции, но их слишком легко изменить, и подобная непрочность, вероятно, приведёт к проблемам в будущем, если мы не сможем исправить положение."
 israel.39.a:0 "Остаётся надеяться, что серьёзных проблем не возникнет."
 israel.40.t:0 "Предоставить [ISR.GetAdjective]ой стороне доступ к Суэцкому каналу?"
 israel.40.d:0 "В связи с нашей недавней национализацией Суэцкого канала остается вопрос, следует ли нам разрешить [ISR.GetAdjective] судоходство, чтобы пройти через него. Это могло бы легко повредить их доступу в восточный мир, что нанесло бы им большой ущерб.\n\nТем не менее, мы рискуем быть захваченными, поскольку это можно рассматривать как акт войны."
 israel.40.a:0 "Запретить им проход."
 israel.40.b:0 "Это слишком рискованно."
 israel.41.t:0 "Государство [EGY.GetNameDefCap] перекрыло нам Суэцкий канал!"
 israel.41.d:0 "После недавней национализации Суэцкого канала государство [EGY.GetNameDef] запретило нашим судам проход через него. Это катастрофа для торговли с Восточным полушарием, поскольку южный порт Эйлат крайне слабо развит и не связан железной дорогой с остальной страной. Возникают опасения экономического краха."
 israel.41.a:0 "Нам необходимо обдумать ответные действия."
 israel.42.t:0 "Синайская война"
 israel.42.d:0 "Вскоре после [EGY.GetNameDef]Национализация Суэцкого канала, сообщения о [ISR.GetAdjective] Корабли, развернувшиеся у канала, были разбросаны по всему миру.\n\n[ISR.GetLeader] Объявлял это трусливым актом войны. [EGY.GetLeader] И это благодаря тому, [EGY.GetNameDef]Прежнее блокирование Тиранского пролива, [ISR.GetNameDef] У него нет другого выбора, кроме как вторгнуться, чтобы не быть отрезанным от восточного мира.\n\nПоступают сообщения о столкновениях на границе, и кажется, что война неизбежна."
 israel.42.a:0 "Куй железо, пока горячо."
 israel.43.t:0 "Замечен нубийский козерог"
 israel.43.d:0 "По мере роста инвестиций в Негев всё больше людей приезжают посмотреть на местную природу, включая этого нубийского козерога, фотография которого широко разошлась по стране."
 israel.43.a:0 "Воистину самая интересная новость."
 israel.45.t:0 "Здоровье Зеэва Жаботинского ухудшается"
 israel.45.d.b:0 "Вчера во время встречи с членами «Иргуна» Жаботинский внезапно потерял сознание и был срочно вынесен из помещения медиками. Этот случай подтверждает предположение, что он страдает заболеванием сердца. Многие опасаются за его здоровье и судьбу страны в случае его смерти и предупреждают, что ему нельзя переутомляться."
 israel.45.d.a:0 "Вчера во время встречи с представителями ЦАХАЛ Жаботинский внезапно потерял сознание и был срочно вынесен из помещения медиками. Этот случай подтверждает предположение, что он страдает заболеванием сердца. Многие опасаются за его здоровье и судьбу страны в случае его смерти и предупреждают, что ему нельзя переутомляться."
 israel.45.a:0 "Тревожно."
 israel.46.t:0 "Пропал склад оружия"
 israel.46.d:0 "Вскоре после смерти Жаботинского до верховного командования «Иргуна» дошли сообщения об исчезновении складов оружия. Поскольку многие случаи происходят в районах с высокой поддержкой фракции «Банды Штерна», возникли подозрения."
 israel.46.a:0 "Провести расследование."
 israel.47.t:0 "Неисправности радиосвязи на ключевых базах"
 israel.47.d:0 "Сегодня на многих ключевых базах страны произошли массовые сбои радиосвязи, из-за которых они не могли поддерживать контакт друг с другом. Неполадки удалось устранить, но после исчезновения оружейных складов многие приведены в состояние повышенной готовности."
 israel.47.a:0 "Что-то не так."
 israel.48.t:0 "Гарнизон Хайфы замолчал"
 israel.48.d:0 "После сообщений об исчезновении оружейных складов весь гарнизон Хайфы, похоже, перестал выходить на связь. Попытки связаться с ним по радио провалились, и высшее руководство опасается полномасштабного переворота."
 israel.48.a:0 "Плохой знак."
 israel.49.t:0 "Раскол ревизионистов"
 israel.49.d:0 "Сегодня в 10:00 Авраам Штерн объявил в прямом радиоэфире, что после смерти великого основателя ревизионизма Зеэва Жаботинского вынужден вмешаться в деятельность нового правительства и начать захват власти, назвав Менахема Бегина трусом и предателем наследия Жаботинского.\n\nВ ответ Бегин осудил Штерна, назвал его фашистским прихвостнем и пообещал подавить измену.\n\nМногие в ужасе от возможности полномасштабной гражданской войны."
 israel.49.a:0 "Мы сокрушим предателей!"
 israel.49.b:0 "Только Штерн может вести нас!"
 israel.50.t:0 "Хаос в Израиле"
 israel.50.d:0 "После смерти [ISR.GetAdjective]ого лидера Зеэва Жаботинского страну охватил полный хаос. Неспособность правительства справиться с фашистскими мятежниками привела к гражданской войне. Это наш шанс нанести ответный удар и окончательно уничтожить их!"
 israel.50.a:0 "Они слабы! Атакуем!"
 israel.50.b:0 "Пусть сражаются друг с другом."
 israel.51.t:0 "Успешный рейд"
 israel.51.d:0 "Сегодня наши солдаты успешно штурмовали убежище «Лехи». Мы понесли небольшие потери, а бойцы «Лехи» быстро сдались. В укрытии обнаружили запас стрелкового оружия и сведения о возможном местонахождении Штерна."
 israel.51.a:0 "Мы найдём его!"
 israel.52.t:0 "Рейд попал в засаду"
 israel.52.d:0 "К сожалению, из-за неверных разведданных рейд на убежище «Лехи» попал в засаду, и нашим бойцам пришлось отступить с тяжёлыми потерями. Это несомненно ослабит моральный дух войск и даст Штерну дополнительное время для перемещения."
 israel.52.a:0 "В следующий раз следует подготовиться лучше."
 israel.53.t:0 "Авраам Штерн захвачен"
 israel.53.d:0 "Когда последние очаги сопротивления «Лехи» были уничтожены, отряд «Иргуна» захватил Авраама Штерна при попытке бежать с поля боя. Теперь он находится у нас, и необходимо решить его судьбу."
 israel.53.a:0 "Смерть предателю!"
 israel.54.t:0 "Двойное падение"
 israel.54.d:0 "«Авраам Штерн, вы признаны виновным в государственной измене, применении террористических методов и сотрудничестве с врагами Государства Израиль. Наказание за эти преступления — смерть. Желаете ли вы сказать что-нибудь в свою защиту?»\n\nВ комнате воцарилась тишина.\n\n«Вы отрицаете, что обращались за поддержкой к нацистской партии Германии?»\n\n«Я сделал то, что должен был».\n\nКогда стреляная гильза упала на пол, Бегин задумался, не лежит ли часть вины на нём."
 israel.54.a:0 "Для торжества зла достаточно бездействия добрых людей."
 israel.55.t:0 "«Иргун» атаковал гарнизон!"
 israel.55.d:0 "Сегодня один из наших гарнизонов подвергся нападению «Иргуна». Нам удалось отбить атаку и передислоцироваться, однако нашим усилиям был нанесён небольшой ущерб."
 israel.55.a:0 "Отступить и перегруппироваться."
 israel.56.t:0 "«Иргун» атаковал конвой!"
 israel.56.d:0 "Сегодня один из наших конвоев подвергся нападению бойцов «Иргуна», из-за чего было потеряно перевозимое грузовиками снаряжение. Это затруднит наши усилия."
 israel.56.a:0 "В следующий раз нужно быть осторожнее."
 israel.57.t:0 "«Иргун» атаковал убежище!"
 israel.57.d:0 "Сегодня одна из рот «Иргуна» атаковала наше убежище. Бойцы ворвались внутрь, и лишь немногим удалось спастись. Это серьёзно затруднит наши усилия."
 israel.57.a:0 "Выяснить, как они нас нашли."
 israel.58.t:0 "«Лехи» просит нашей поддержки"
 israel.58.d:0 "Ультранационалистическая организация «Лехи», ведущая восстание против правительства «Иргуна» в государстве [ISR.GetNameDef], обратилась к нам за поддержкой в свержении правительства Менахема Бегина. Помощь может привести к власти в Израиле ультранационалистов, что способно оказаться выгодным для нас."
 israel.58.a:0 "Отправить им поддержку."
 israel.58.b:0 "Они окончательно лишились рассудка."
 israel.59.t:0 "Государство [FROM.GetNameDefCap] отправляет нам помощь!"
 israel.59.d:0 "Наша недавняя миссия в государство [FROM.GetNameDef] завершилась успехом, и лидер [FROM.GetLeader] согласился оказать нам помощь в борьбе."
 israel.59.a:0 "Мы благодарны им."
 israel.60.t:0 "Государство [FROM.GetNameDefCap] отказывается отправлять помощь!"
 israel.60.d:0 "Наша недавняя миссия в государство [FROM.GetNameDef] закончилась катастрофой: нашим представителям отказали даже во встрече с лидером [FROM.GetLeader]."
 israel.60.a:0 "Псы!"
 israel.61.t:0 "Государство [ISR.GetNameDefCap] намерено построить Третий храм!"
 israel.61.d:0 "Сегодня лидер [ISR.GetLeader] провозгласил в Иерусалиме, что после перехода священной Храмовой горы под контроль еврейского народа государство [ISR.GetNameDef] немедленно начнёт строительство Третьего храма. Это почти наверняка потребует уничтожения мечети Аль-Акса, чего мы не можем допустить. Мы обязаны вмешаться."
 israel.61.a:0 "Они официально лишились рассудка!"
 israel.61.b:0 "Какая нам разница?"
 israel.62.t:0 "Война за Третий храм"
 israel.62.d:0 "Несколько дней назад в Иерусалиме [ISR.GetLeader] Он провозгласил, что с контролем еврейского народа над святой Храмовой горой, [ISR.GetNameDef] Строительство Третьего Храма начнется немедленно. Это немедленно вызвало безумное возмущение во всем мусульманском мире, которое закончилось почти всеми мусульманскими странами, объявившими войну Израилю, чтобы предотвратить разрушение Аль-Аксы.\n\nЭксперты во всем мире недоумевают, что [ISR.GetNameDef] Я бы даже попробовала такую вещь."
 israel.62.a:0 "Реальность и правда страннее вымысла."
 israel.70.t:0 "Дов Хоз погибает в автокатастрофе"
 israel.70.d:0 "Дов Хоз, пионер еврейской авиации и советник правительства, сегодня трагически погиб в автокатастрофе на шоссе № 4, когда его машина съехала с дороги и врезалась в бетонную стену. Находившиеся в автомобиле жена и дочь Хоза также погибли."
 israel.70.a:0 "Тяжёлая утрата для авиации."
 israel.71.t:0 "Дов Хоз выживает в автокатастрофе"
 israel.71.d:0 "Дов Хоз, пионер еврейской авиации и советник правительства, сегодня выжил в автокатастрофе на шоссе № 4. Его машина съехала в кювет, но он сумел восстановить управление и чудом избежал столкновения с бетонной стеной. Сам Хоз, его жена и дочь отделались лишь лёгкими травмами."
 israel.71.a:0 "Катастрофы удалось избежать."
 israel.72.t.a:0 "Маронитское восстание!"
 israel.72.d.a:0 "С момента обретения независимости страну терзали многочисленные межэтнические противоречия. Сегодня они вылились в попытку переворота со стороны маронитов, которых, по некоторым данным, тайно финансирует государство [ISR.GetNameDef]. После нескольких часов боёв по всей стране восставшие..."
 israel.72.t.b:0 "Маронитское восстание в Ливане!"
 israel.72.d.b:0 "Наша оккупация Ливана никогда не пользовалась популярностью, а сегодня напряжённость в регионе достигла предела. По всему Ливану маронитские ополчения, предположительно поддерживаемые государством [ISR.GetNameDef], вступили в бой с нашими войсками. Некоторые считают, что эта война не стоит усилий и нам следует покинуть регион.\n\nКак поступить?"
 israel.72.a:0 "Оставить их в покое, у нас есть более важные дела."
 israel.72.b:0 "Они будут сокрушены!"
 israel.72.c:0 "Их отбросили и уничтожили!"
 israel.72.d:0 "Они успешно свергли правительство!"
 israel.73.t:0 "Маронитское восстание в Ливане!"
 israel.73.d.a:0 "После успешного финансирования маронитских сил в Ливане они подняли восстание и захватили страну. Мы можем воспользоваться своим влиянием и установить контроль над их правительством, однако, возможно, лучше не слишком глубоко вмешиваться в их войну."
 israel.73.d.b:0 "После успешного финансирования маронитских сил в Ливане они подняли восстание и захватили страну. Теперь мы можем воспользоваться влиянием и установить контроль над их правительством."
 israel.73.a:0 "Хорошо."
 israel.73.b:0 "Лучше не вмешиваться слишком глубоко."
 israel.74.t:0 "Государство [ISR.GetNameDefCap] предлагает разделить Сирию"
 israel.74.d:0 "Сегодня лидер [ISR.GetLeader] обратился к нашему правительству с предложением разделить Сирию между нашими странами. Мы предъявляем права на сирийские земли ещё со времён падения Османской империи, и, возможно, сейчас подходящий момент вернуть утраченные территории."
 israel.74.a:0 "Мы согласны."
 israel.74.b:0 "У нас есть более важные проблемы."
 israel.75.t:0 "Государство [TUR.GetNameDefCap] принимает наше предложение"
 israel.75.d:0 "The [TUR.GetAdjective] Руководство приняло наше предложение о разделе Сирии. Пришло время действовать."
 israel.75.a:0 "К войне!"
 israel.76.t:0 "Государство [TUR.GetNameDefCap] отклоняет наше предложение"
 israel.76.d:0 "Лидер [TUR.GetLeader] отклонил наше предложение о разделе Сирии, заявив, что у государства [TUR.GetNameDef] есть более важные проблемы."
 israel.76.a:0 "Мы всё равно нападём!"
 israel.76.b:0 "Лучше отменить нападение."
 israel.80.t:0 "Закрытие Суэцкого канала"
 israel.80.d:0 "После [ISR.GetAdjective]ой победы над государством [EGY.GetNameDef] в Синайской войне неспособность двух правительств договориться о будущем Суэцкого канала привела к временному прекращению его работы.\n\nВсе суда, приближающиеся к зоне канала, готовятся идти в обход мыса Доброй Надежды, а многие великие державы уже обсуждают давление на государства [ISR.GetNameDef] и [EGY.GetNameDef], чтобы заставить их достичь компромисса до введения санкций."
 israel.80.a:0 "Не наша проблема."
 israel.80.b:0 "Мы должны оказать давление!"
 israel.80.c:0 "Лучше договориться, пока ситуация не вышла из-под контроля."
 israel.81.t:0 "Государство [FROM.GetNameDefCap] требует начать переговоры!"
 israel.81.d:0 "После закрытия Суэцкого канала лидер [FROM.GetLeader] обратился к нашему правительству с требованием начать переговоры о его повторном открытии."
 israel.81.a:0 "Следует обдумать план."
 israel.82.t:0 "Государство [ISR.GetNameDefCap] предлагает мирные переговоры"
 israel.82.d:0 "Сегодня дипломатический представитель государства [ISR.GetNameDef] предложил нам начать мирные переговоры по вопросу канала. Поскольку обе страны испытывают дипломатическое давление с требованием вскоре открыть канал, следует рассмотреть предложение. Возможно, нам даже удастся получить выгоду."
 israel.82.a:0 "Мы согласимся."
 israel.82.b:0 "Никаких переговоров!"
 israel.83.t:0 "Государство [EGY.GetNameDefCap] отклоняет переговоры"
 israel.83.d:0 "The [EGY.GetAdjective] Посланник категорически отверг наше предложение о переговорах, сославшись на то, что они никогда не будут вести переговоры с сионистским образованием."
 israel.83.a:0 "Нашу протянутую руку оттолкнули."
 israel.84.t:0 "Государство [EGY.GetNameDefCap] готово к переговорам"
 israel.84.d:0 "The [EGY.GetAdjective] Посол выразил готовность к переговорам о судьбе канала. Вероятно, мы предлагаем начать переговоры в ближайшее время, поскольку дипломатическое давление усиливается."
 israel.84.a:0 "Приступим."
 israel.84.b:0 "Мы никогда не будем с ними договариваться."
 israel.85.t:0 "Государство [ISR.GetNameDefCap] отказывается от переговоров"
 israel.85.d:0 "The [ISR.GetAdjective] Правительство отказалось от наших попыток переговоров, ссылаясь на то, что они не откажутся от земли, которая может быть использована для нападения на них."
 israel.85.a:0 "Нашу протянутую руку оттолкнули."
 israel.86.t:0 "Выбор предложения"
 israel.86.d:0 "Поскольку мы ведём переговоры с позиции силы, можно самостоятельно определить условия предложения. Некоторые члены правительства отказываются возвращать значительные территории, утверждая, что египтяне непременно используют их для нападения при первой возможности. Другие настроены оптимистичнее и готовы пожертвовать большим количеством земель ради повышения шансов на успешные переговоры.\n\nРешение остаётся за нами."
 israel.86.a:0 "Предложим вернуть только канал."
 israel.86.b:0 "Можно вернуть весь Синай при условии его демилитаризации."
 israel.86.c:0 "Мы готовы вернуть весь Синай в обмен на постоянный мир."
 israel.87.t:0 "Государство [EGY.GetNameDefCap] отклоняет наше предложение!"
 israel.87.desc:0 "The [EGY.GetAdjective] Дипломаты отказались от нашего предложения, заявив, что этого недостаточно. Мы можем согласиться на более щедрое предложение или полностью прекратить переговоры."
 israel.87.a:0 "Предложим вернуть только канал."
 israel.87.b:0 "Можно вернуть весь Синай при условии его демилитаризации."
 israel.87.c:0 "Мы готовы вернуть весь Синай в обмен на постоянный мир."
 israel.87.d:0 "Будь они прокляты! С нас достаточно!"
 israel.88.t:0 "Переговоры провалились"
 israel.88.d:0 "Наши переговоры с государством [ISR.GetNameDef] провалились. Канал остаётся закрытым, а дипломатическое давление сохраняется."
 israel.88.a:0 "Будь они прокляты!"
 israel.89.t:0 "Суэцкие переговоры провалились"
 israel.89.d:0 "Как многие и ожидали, недавние переговоры между государствами [ISR.GetNameDef] и [EGY.GetNameDef] провалились. Стороны не сумели найти общий язык, дипломаты возвращаются домой, а канал остаётся закрытым. Многие считают, что в будущем это приведёт к новой войне."
 israel.89.a:0 "Разве кто-то ожидал иного?"
 israel.90.t:0 "Государство [ISR.GetNameDefCap] предлагает вернуть восточный берег Суэца"
 israel.90.d:0 "The [ISR.GetAdjective] Делегация предложила нам вернуть Восточный Суэцкий канал, в свою очередь, для заключения постоянного мирного договора. Хотя это суровое предложение, может быть, в наших интересах все равно принять."
 israel.90.a:0 "Мы согласимся, если Синай будет демилитаризован."
 israel.90.b:0 "Это слишком высокая цена!"
 israel.91.t:0 "Государство [EGY.GetNameDef] требует демилитаризации Синая"
 israel.91.d:0 "The [EGY.GetAdjective] Дипломаты выразили готовность принять наше предложение, однако их единственный срок - это демилитаризация Синайского полуострова взамен. Мы принимаем это?"
 israel.91.a:0 "Их условия приемлемы."
 israel.91.b:0 "Почему они считают, что ведут переговоры с позиции силы? Нет!"
 israel.92.t:0 "Государство [ISR.GetNameDefCap] соглашается"
 israel.92.d:0 "Лидер [ISR.GetLeader] принял наши условия, и Синай будет демилитаризован согласно требованию. Окончательный договор вскоре будет подписан."
 israel.92.a:0 "Исторический день."
 israel.93.t:0 "Государство [ISR.GetNameDefCap] предлагает демилитаризованный Синай"
 israel.93.d:0 "The [ISR.GetAdjective] Делегация предложила нам вернуть весь Синайский полуостров к нашей власти на условиях, что он станет демилитаризованной зоной и постоянным мирным договором. Это предложение, кажется, в нашу пользу, должны ли мы принять?"
 israel.93.a:0 "Приемлемые условия."
 israel.93.b:0 "Этого недостаточно!"
 israel.94.t:0 "Государство [EGY.GetNameDefCap] соглашается"
 israel.94.d:0 "Лидер [EGY.GetLeader] принял наши условия: Синай будет возвращён им и демилитаризован согласно требованию. Окончательный договор вскоре будет подписан."
 israel.94.a:0 "Исторический день."
 israel.95.t:0 "Государство [ISR.GetNameDefCap] предлагает Синай в обмен на мир"
 israel.95.d:0 "The [ISR.GetAdjective] Делегация предложила нам вернуть весь Синайский полуостров к нашей власти на условиях, что мы подписываем постоянный мирный договор. Это предложение, похоже, в нашу пользу, и большинство правительства хочет, чтобы мы его приняли."
 israel.95.a:0 "Следует принять предложение, пока оно действует."
 israel.96.t:0 "Государство [EGY.GetNameDefCap] соглашается"
 israel.96.d:0 "Лидер [EGY.GetLeader] принял наши условия: Синай будет возвращён им, а между странами заключён постоянный мир. Окончательный договор вскоре будет подписан."
 israel.96.a:0 "Исторический день."
 israel.99.t:0 "Никосийский договор"
 israel.99.d.a:0 "Сегодня стало известно об окончательном договоре между [EGY.GetNameDef] и [ISR.GetNameDef] Он добрался до всего мира. После интенсивных переговоров в последние пару дней, [EGY.GetLeader] пожимать руки [ISR.GetLeader] Как они подписали договор.\n\nВ договоре излагается план по повторному открытию Суэцкого канала, где Восточный берег канала будет управляться Египтом с полными правами прохода для Египта. [ISR.GetAdjective] доставка. Как указано в договоре, Синайский полуостров останется под [ISR.GetAdjective] Гражданская администрация, но станет демилитаризованной зоной.\n\nПо мере открытия канала многие более оптимистично настроены в отношении прочного мира на Ближнем Востоке."
 israel.99.d.b:0 "Сегодня стало известно об окончательном договоре между [EGY.GetNameDef] и [ISR.GetNameDef] Он добрался до всего мира. После интенсивных переговоров в последние пару дней, [EGY.GetLeader] пожимать руки [ISR.GetLeader] Как они подписали договор.\n\nВ договоре излагается план по повторному открытию Суэцкого канала, где Восточный берег канала будет управляться Египтом с полными правами прохода для Египта. [ISR.GetAdjective] доставка. Синайский полуостров вернется к гражданской администрации Египта, но станет демилитаризованной зоной.\n\nПо мере открытия канала многие более оптимистично настроены в отношении прочного мира на Ближнем Востоке."
 israel.99.d.c:0 "Сегодня весь мир узнал об окончательном соглашении между государствами [EGY.GetNameDef] и [ISR.GetNameDef]. После нескольких дней напряжённых переговоров лидеры [EGY.GetLeader] и [ISR.GetLeader] пожали друг другу руки и подписали договор.\n\nОн предусматривает повторное открытие Суэцкого канала. Восточный берег канала перейдёт под управление Египта, а [ISR.GetAdjective]ие суда получат полное право прохода. Синайский полуостров полностью вернётся под египетское управление, а между странами будет заключён пакт о ненападении. \n\nПосле открытия канала многие надеются на прочный мир на Ближнем Востоке."
 israel.99.a:0 "Ещё один шаг к миру."
 israel.100.t:0 "Государство [ISR.GetNameDefCap] провозглашает независимость"
 israel.100.d:0 "Сегодня поступили новости о провозглашении независимости лидером [ISR.GetLeader]. Хотя война с государством [PAL.GetNameDef] ещё продолжается, арабские ополчения Палестины доказали неспособность противостоять сионистским силам, и теперь мы вынуждены вмешаться."
 israel.100.a:0 "Начать вторжение."
 israel.100.b:0 "Пусть сражаются сами."
 israel.101.t:0 "[ISR.GetAdjective] Силы вступают на Синай"
 israel.101.d:0 "Из-за последних неудач в войне против государства [ISR.GetNameDef] его войска отбросили нас к собственной территории. Многие требуют заключить перемирие."
 israel.101.a:0 "Необходимо договориться о прекращении огня."
 israel.101.b:0 "Мы должны продолжать борьбу!"
 israel.102.t:0 "Государство [EGY.GetNameDefCap] предлагает перемирие"
 israel.102.d:0 "После вступления наших войск на Синай египетская сторона предложила прекратить огонь. Следует согласиться, поскольку это позволит перебросить силы на другие фронты."
 israel.102.a:0 "Ам Исраэль хай!"
 israel.103.t:0 "[ISR.GetAdjective] Силы пересекают Иорданию"
 israel.103.d:0 "Из-за последних неудач в войне против государства [ISR.GetNameDef] его войска отбросили нас к собственной территории. Многие требуют заключить перемирие."
 israel.103.a:0 "Необходимо договориться о прекращении огня."
 israel.103.b:0 "Мы должны продолжать борьбу!"
 israel.104.t:0 "Государство [JOR.GetNameDefCap] предлагает перемирие"
 israel.104.d:0 "После того как наши войска перешли реку Иордан, иорданская сторона предложила прекратить огонь. Следует согласиться, поскольку это позволит перебросить силы на другие фронты."
 israel.104.a:0 "Ам Исраэль хай!"
 israel.105.t:0 "[ISR.GetAdjective] Силы пересекают Иорданию"
 israel.105.d:0 "Из-за последних неудач в войне против государства [ISR.GetNameDef] его войска отбросили нас к собственной территории. Многие требуют заключить перемирие."
 israel.105.a:0 "Необходимо договориться о прекращении огня."
 israel.105.b:0 "Мы должны продолжать борьбу!"
 israel.106.t:0 "Государство [SYR.GetNameDefCap] предлагает перемирие"
 israel.106.d:0 "После того как наши войска перешли реку Иордан, сирийская сторона предложила прекратить огонь. Следует согласиться, поскольку это позволит перебросить силы на другие фронты."
 israel.106.a:0 "Ам Исраэль хай!"
 israel.107.t:0 "[ISR.GetAdjective] Силы пересекают границу"
 israel.107.d:0 "Из-за последних неудач в войне против государства [ISR.GetNameDef] его войска отбросили нас к собственной территории. Многие требуют заключить перемирие."
 israel.107.a:0 "Необходимо договориться о прекращении огня."
 israel.107.b:0 "Мы должны продолжать борьбу!"
 israel.108.t:0 "Государство [LEB.GetNameDefCap] предлагает перемирие"
 israel.108.d:0 "После того как наши войска пересекли границу, ливанская сторона предложила прекратить огонь. Следует согласиться, поскольку это позволит перебросить силы на другие фронты."
 israel.108.a:0 "Ам Исраэль хай!"
 israel.109.t:0 "Войска в Палестине отрезаны"
 israel.109.d:0 "Из-за последних неудач в войне против государства [ISR.GetNameDef] правительства Иордании и Сирии вышли из войны, отрезав наши части от поля боя."
 israel.109.a:0 "Необходимо договориться о прекращении огня."
 israel.109.b:0 "Это лишь временная неудача!"
 israel.110.t:0 "Государство [IRQ.GetNameDefCap] предлагает перемирие"
 israel.110.d:0 "После выхода Иордании и Сирии из войны иракские войска больше не могут добраться до нашей территории и поэтому предложили заключить перемирие."
 israel.110.a:0 "Ам Исраэль хай!"
 israel.111.t:0 "Палестинские силы терпят поражение"
 israel.111.d:0 "Гражданская война на территории подмандатной Палестины продолжается уже долгое время, и палестинцы доказали неспособность справиться с [ISR.GetAdjective]ими войсками. Мы должны вскоре вмешаться."
 israel.111.a:0 "Готовиться к худшему."
 israel.112.t:0 "Арабские армии вторгаются"
 israel.112.d:0 "Видя нашу неспособность победить [ISR.GetAdjective] Окружающие арабские страны начали вторжение на нашу территорию. Пересекая границу, их приветствовали возгласами, но к нашему удивлению сразу же начали разоружать наши войска.\n\nЭто не освобождение."
 israel.112.a:0 "Мы пытались."
 israel.999.t:0 "Ад Халом"
 israel.999.d:0 "После провозглашения независимости армии соседних арабских стран вошли на нашу территорию. Мы ожидали этого, но не должны падать духом.\n\nДве тысячи лет мы скрывались, храня надежду на то, что однажды обретём землю, которую сможем назвать домом.\n\nЭтот день настал. Сегодня мы сражаемся за предков, боровшихся две тысячи лет назад.\n\nСегодня нам больше некуда бежать!\n\nПути назад нет!"
 israel.999.a:0 "Ни шагу дальше!"
 israel.1000.t:0 "Арабские армии входят в Палестину"
 israel.1000.d:0 "После недавнего [ISR.GetAdjective] Объявление независимости окружающих арабских государств, которые поддерживают арабских боевиков в регионе, официально решило вмешаться в конфликт.\n\nНе сумев победить еврейские силы, арабские ополченцы в регионе были либо разоружены, либо интегрированы в армии вторжения. The [ISR.GetAdjective] Силы, с другой стороны, были объединены под единым знаменем, значительно повышая свои боевые возможности.\n\nДомино ждут своей очереди."
 israel.1000.a:0 "Ад Халом!"
 israel.1000.b:0 "Наша победа обеспечена!"
 israel.1000.c:0 "Давид против Голиафа."
 ISR_histadrut_start:0 "Гистадрут"
 ISR_histadrut_start_desc:0 "Сформированные лейбористским сионистом Ишувом в эпоху мандата, гистадруты являются основными профсоюзами в Израиле. Они исключительно сильны по сравнению с большинством международных профсоюзов, что дает нам определенные преимущества и недостатки."
 ISR_disorganized_militias:0 "Раскол власти"
 ISR_disorganized_militias_desc:0 "Основу наших сил составляет «Хагана» — социалистическое ополчение, подчиняющееся Давиду Бен-Гуриону и правительству ишува. Однако в боях также участвует ревизионистский «Иргун» под руководством лидера [ISR.GetNeutralLeader]. Это правое формирование значительно уступает «Хагане» численностью, но не подчиняется правительству Бен-Гуриона, что мешает военным усилиям."
 ISR_alei_barikadot:0 "Алей барикадот!"
 ISR_alei_barikadot_desc:0 "Пора привести нашу страну к победе! Мы встретимся на баррикадах!"
 ISR_always_first:0 "План Бен-Гуриона"
 ISR_always_first_desc:0 "Наступление врага должно быть остановлено! Ни шагу дальше!"
 ISR_ad_halom:0 "§OАд Халом§!"
 ISR_ad_halom_desc:0 "Две тысячи лет мы жили в изгнании, под чужой властью, без собственного голоса.\nДве тысячи лет мы жили надеждой, что однажды обретём землю, которую сможем назвать домом.\nЭтот день настал. Если мы проиграем сегодня, нам будет некуда бежать!\n\nНи шагу дальше!"
 r56_ISR_negev_modifier:0 "Неизученная пустыня"
 r56_ISR_negev_offensive:0 "Операция «Йоав»"
 r56_ISR_jerusalem_strategy:0 "Иерусалимская стратегия"
 r56_ISR_retake_jerusalem:0 "Иерусалимская стратегия"
 r56_ISR_attack_west_bank:0 "Захватить Западный берег"
 ISR_aliyah:0 "Шестая алия"
 ISR_aliyah_desc:0 "После обретения независимости сотни тысяч еврейских беженцев со всего мира устремились в Израиль в поисках убежища от ужасов фашизма и антисемитизма."
 ISR_president_weizmann:0 "Хаим Вейцман — президент Израиля"
 ISR_president_weizmann_desc:0 "Делегат ишува, еще во время Севрского договора, Хаим Вейцман был очевидным выбором для [ISR.GetAdjective] Президент. Он возглавлял сионистское движение в самые неспокойные времена, заработав свой титул главы государства."
 ISR_veteran_zionist:0 "Ветеран сионистского движения"
 ISR_president_einstein:0 "Альберт Эйнштейн — президент Израиля"
 ISR_president_einstein_desc:0 "Посвятив всю жизнь развитию науки, Альберт Эйнштейн никогда не считал себя предназначенным для политики. Однако после бегства из Германии от антисемитских преследований и создания нового еврейского государства в Израиле ему предложили стать президентом страны. Посчитав эту должность хорошей возможностью продвигать научные идеи, он согласился и теперь преподаёт в Еврейском университете Иерусалима, который помог основать."
 ISR_scientific_genius:0 "Научный гений"
 ISR_revisionist_author:0 "Писатель-ревизионист"
 ISR_president_ben_zvi:0 "Ицхак Бен-Цви — президент Израиля"
 ISR_president_ben_zvi_desc:0 "Друг Давида Бен-Гуриона ещё со времён Второй алии, Исаак Шимшелевич в 1907 году бежал от российских властей в Палестину и принял еврейское имя Ицхак Бен-Цви. После приглашения Исраэлем Шохатом он помог восстановить раздробленную партию «Поалей Цион» и превратить её в могущественную силу, известную ныне как «Хашомер ха-Цаир», чтобы уравновесить влияние Бен-Гуриона в ишуве. Несмотря на это, Бен-Цви и Бен-Гурион стали близкими друзьями, а после высылки османскими властями в Египет во время Великой войны вернулись в Палестину и продолжили борьбу за независимое еврейское государство — мечту, которая теперь осуществилась."
 ISR_president_klausner:0 "Йосеф Клаузнер — президент Израиля"
 ISR_president_klausner_desc:0 "Уважаемый историк и профессор еврейской литературы Йосеф Гедалия Клаузнер родился в Литве в 1874 году. Убеждённый сионист, лично знакомый с Герцлем, он участвовал в Первом сионистском конгрессе 1897 года, а в 1919 году поселился в Палестине. Позднее Клаузнер изучал еврейскую литературу и сблизился со многими политическими деятелями, включая Зеэва Жаботинского и Менахема Усышкина, что в итоге принесло ему выдвижение Жаботинского на пост президента."
 ISR_labour_zionist:0 "Лейбористский сионист"
 ISR_inexperienced_politician:0 "Неопытный политик"
 ISR_the_great_father:0 "Великий отец Израиля"
 ISR_figure_of_the_jewish_people:0 "Истинный преемник Герцля"
 ISR_nathan_yellin_mor_trait:0 "Натан Елин-Мор"
 ISR_yisrael_elidad_trait:0 "Исраэль Эльдад"
 ISR_yisrael_elidad_trait_communism:0 "Исраэль Эльдад"
 ISR_yitshak_shamir_trait:0 "Ицхак Шамир"
 ISR_special_night_squads_idea:0 "Особые ночные отряды"
 ISR_special_forces_idea:0 "Инвестиции в силы специального назначения"
 ISR_jewish_emigration:0 "Еврейская эмиграция"
 ISR_zionist_consensus:0 "Это не сказка"
 ISR_zionist_consensus_desc:0 "Спустя две тысячи лет еврейский народ наконец обрёл собственное государство. Но за это пришлось заплатить высокую цену. Вокруг нас много врагов, и мы должны быть способны защитить свой Сион."
 ISR_defense_of_zion:0 "Ам Исраэль хай"
 ISR_defense_of_zion_desc:0 "После двух тысяч лет изгнания, угнетения, погромов и геноцида еврейский народ наконец обрёл место, которое может назвать домом. Путь был нелёгким, и будущее также не будет простым. Но сегодня мы можем чувствовать себя в безопасности, зная, что народ Израиля жив."
 ISR_diaspora_volunteers:0 "Протрубить в шофар"
 ISR_diaspora_volunteers_desc:0 "Евреи со всего мира стекаются на защиту своей родины."
 r56_ISR_minority_government:0 "Правительство меньшинства"
 r56_ISR_minority_government_desc:0 "Из-за политической раздробленности страны мы не можем самостоятельно проводить большинство желаемых законопроектов. Нам придётся решить, с какой партией пойти на компромисс ради достижения целей."
 ISR_no_constitution:0 "Отсутствие конституции"
 ISR_no_constitution_desc:0 "После создания нового государства у страны всё ещё нет конституции. Если мы не сумеем разработать её, в будущем это может привести к серьёзным проблемам."
 ISR_basic_laws:0 "Основные законы Израиля"
 ISR_basic_laws_desc:0 "Попытка написать конституцию полностью провалилась. Нам остался лишь расплывчатый набор «Основных законов», определяющих государственные институты, но изменить их слишком легко. Вероятно, в будущем это вызовет проблемы."
 ISR_austerity:0 "Жёсткие меры экономии"
 ISR_austerity_desc:0 "Премьер-министр Бен-Гурион ввёл суровые меры экономии, чтобы новое государство не рухнуло окончательно. Они включают нормирование продовольствия, высокие налоги и многое другое. Эта политика крайне непопулярна, хотя некоторые понимают необходимость её введения. Вопрос о продолжительности мер вызывает ожесточённые споры."
 r56_ISR_israeli_constitution:0 "The [ISR.GetAdjective] Конституция"
 r56_ISR_israeli_constitution_desc:0 "Нам удалось написать конституцию нового государства. Однако многие не согласны с её окончательным вариантом. Необходимо проследить, чтобы это не привело к проблемам в будущем."
 ISR_economic_plan:0 "Промышленный план Меира Яари"
 ISR_economic_plan_desc:0 "Министр финансов Меир Яари представил масштабный экономический план построения более социалистического Израиля. Для роста экономики необходимо следовать этому плану."
 ISR_kibbutzim:0 "Инвестиции в кибуцы"
 ISR_kibbutzim_desc:0 "Аграрные кибуцы являются основой нашего экономического плана. Их необходимо поддерживать, чтобы снизить зависимость от импорта продовольствия."
 ISR_histadrut_strong:0 "Укреплённый Гистадрут"
 ISR_histadrut_strong_desc:0 "Рабочие профсоюзы страны, объединённые в Гистадрут, необходимо укрепить ради защиты прав трудящихся."
 ISR_nationalized_institutions:0 "Национализированные учреждения"
 ISR_nationalized_institutions_desc:0 "Национализация таких учреждений, как образование и здравоохранение, может помочь нам убедиться в том, что не злоупотребляют никакими средствами, и все получают справедливое обращение."
 ISR_bituah_leumi:0 "Битуах Леуми"
 ISR_bituah_leumi_desc:0 "Мы должны заботиться о тех, кто не может позаботиться о себе самостоятельно. Будет создано новое ведомство для помощи инвалидам и пожилым людям."
 ISR_welfare:0 "Расширить пособия для иммигрантов"
 ISR_welfare_desc:0 "Из-за кризиса алии иммигранты прибывают в страну в нищете. Необходимо быстро исправить положение, предоставив новым переселенцам социальную помощь."
 ISR_white_collar_boom:0 "Бум умственного труда"
 ISR_white_collar_boom_desc:0 "Наша страна мала и бедна ресурсами. Если мы не можем постоянно превосходить противников военной мощью, то обязаны опережать их технологически, развивая наукоёмкие отрасли и сферу умственного труда."
 ISR_arab_voting:0 "Избирательные права арабов"
 ISR_arab_voting_desc:0 "Предоставление арабам права голоса на выборах станет первым шагом к сосуществованию."
 ISR_histadrut_weak:0 "Ослабленный Гистадрут"
 ISR_histadrut_weak_desc:0 "Ослабление Гистадрута позволит снизить выплаты рабочим и высвободить больше капитала для других проектов."
 ISR_secularized_education:0 "Светское образование"
 ISR_secularized_education_desc:0 "Чтобы защитить страну, новое поколение необходимо воспитывать на светских и научных ценностях."
 ISR_religious_parties_idea_1:0 "Сотрудничество с религиозными партиями"
 ISR_religious_parties_idea_1_desc:0 "Хотя мы не разделяем их ценности, из-за значительного политического влияния религиозных партий нам придётся сотрудничать с ними."
 ISR_suez_pressure_1:0 "Незначительное дипломатическое давление"
 ISR_suez_pressure_1_desc:0 "Из-за закрытия Суэцкого канала великие державы оказывают на нас небольшое дипломатическое давление, требуя начать переговоры о его повторном открытии."
 ISR_suez_pressure_2:0 "Ограниченное дипломатическое давление"
 ISR_suez_pressure_2_desc:0 "Из-за закрытия Суэцкого канала великие державы оказывают на нас ограниченное дипломатическое давление, требуя начать переговоры о его повторном открытии."
 ISR_suez_pressure_3:0 "Умеренное дипломатическое давление"
 ISR_suez_pressure_3_desc:0 "Из-за закрытия Суэцкого канала великие державы оказывают на нас умеренное дипломатическое давление, требуя начать переговоры о его повторном открытии."
 ISR_suez_pressure_4:0 "Сильное дипломатическое давление"
 ISR_suez_pressure_4_desc:0 "Из-за закрытия Суэцкого канала великие державы оказывают на нас сильное дипломатическое давление, требуя начать переговоры о его повторном открытии."
 ISR_suez_pressure_5:0 "Крайне сильное дипломатическое давление"
 ISR_suez_pressure_5_desc:0 "Из-за закрытия Суэцкого канала великие державы оказывают на нас чрезвычайно сильное дипломатическое давление, требуя начать переговоры о его повторном открытии."
 r56_ISR_palestinian_resistance:0 "Сильное палестинское сопротивление"
 r56_ISR_palestinian_resistance_low:0 "Слабое палестинское сопротивление"
 r56_ISR_palestinian_resistance_lower:0 "Освобождение арабов от военной службы"
 ISR_1936:0 "Ополчение «Хаганы»"
 ISR_revolution:0 "Если вы захотите..."
 ISR_revolution_desc:0 "Началась битва за нашу родину. Мы должны преодолеть это испытание во славу Сиона.\n\nЕсли вы захотите — это не будет сказкой!"
 ISR_call_diaspora_volunteers:0 "Протрубить в шофар"
 ISR_call_diaspora_volunteers_desc:0 "По всему миру живёт бесчисленное множество евреев, готовых прийти на помощь своему народу. Мы должны официально обратиться к ним с призывом."
 ISR_consolidate_haganah:0 "Консолидировать «Хагану»"
 ISR_consolidate_haganah_desc:0 "Давид Бен-Гурион и «Хагана» являются нашей лучшей надеждой на защиту страны. Необходимо не позволить «Иргуну» подорвать наши усилия."
 ISR_dealing_with_irgun:0 "Разобраться с «Иргуном»"
 ISR_dealing_with_irgun_desc:0 "Чтобы «Иргун» не набрал слишком большую силу во время войны, необходимо начать ограничивать его влияние."
 ISR_subvert_irgun_influence:0 "Подорвать влияние «Иргуна»"
 ISR_subvert_irgun_influence_desc:0 "Необходимо подорвать влияние «Иргуна» в стране. Он представляет прямую угрозу нашему народу."
 ISR_form_the_idf:0 "Создать Армию обороны Израиля"
 ISR_form_the_idf_desc:0 "Чтобы ослабить влияние «Иргуна», необходимо объединить многочисленные подразделения «Хаганы» в единую Армию обороны Израиля."
 ISR_purge_irgun:0 "Провести чистку «Иргуна»"
 ISR_purge_irgun_desc:0 "После всех приготовлений настало время раз и навсегда очистить страну от «Иргуна»."
 ISR_ben_gurion_strategy:0 "Стратегия Бен-Гуриона"
 ISR_ben_gurion_strategy_desc:0 "Премьер-министр Бен-Гурион представил план наступления на юг, в Негев, чтобы рассечь арабские силы надвое. Мы должны следовать его замыслу."
 ISR_southern_plan:0 "План Негева"
 ISR_southern_plan_desc:0 "Прежде чем приступить к освобождению Негева, необходимо усилить возможности армии."
 ISR_operation_yoav:0 "Начать операцию «Йоав»"
 ISR_operation_yoav_desc:0 "Время пришло. Мы всеми силами устремимся на юг и рассечём арабские войска надвое!"
 ISR_czech_weaponry:0 "Закупки чехословацкого оружия"
 ISR_czech_weaponry_desc:0 "Государство [CZE.GetNameDefCap] располагает значительными запасами оружия, которые мы могли бы приобрести для нашей борьбы."
 ISR_gather_irgun:0 "Собрать «Иргун»"
 ISR_gather_irgun_desc:0 "Давиду Бен-Гуриону и «Хагане» нельзя доверить будущее страны. Только Зеэв Жаботинский способен привести нас к великой Иудее!"
 ISR_subvert_haganah:0 "Подорвать «Хагану»"
 ISR_subvert_haganah_desc:0 "«Хагана» превосходит нас численностью, но сейчас занята войной. Мы можем обратить это в свою пользу."
 ISR_steal_haganah_weapons:0 "Перехватывать оружие «Хаганы»"
 ISR_steal_haganah_weapons_desc:0 "Следует воспользоваться их занятостью и незаметно перенаправлять оружие «Хаганы» для вооружения наших бойцов."
 ISR_spread_revisionist_media:0 "Распространять ревизионистскую прессу"
 ISR_spread_revisionist_media_desc:0 "Мы должны рассказать о своём деле всей стране, чтобы народ присоединился к нашей справедливой борьбе."
 ISR_assume_the_national_cause:0 "Возглавить национальное дело"
 ISR_assume_the_national_cause_desc:0 "Эта война является решающим моментом в истории нашего народа. Нельзя позволить слабому Бен-Гуриону и его «Хагане» управлять нашими действиями. Пришло время взять власть."
 ISR_begin_approach:0 "Подход Менахема Бегина"
 ISR_begin_approach_desc:0 "Лидер «Иргуна» Менахем Бегин предложил новый план, основанный на удержании Иерусалима и сосредоточении усилий на Западном берегу. Это очевидный путь к победе."
 ISR_jerusalem_strategy:0 "Иерусалимская стратегия"
 ISR_jerusalem_strategy_desc:0 "Чтобы следовать плану Бегина, необходимо обеспечить контроль над Иерусалимом и быть готовыми защитить его."
 ISR_the_west_bank:0 "Очистить Иерусалимский коридор"
 ISR_the_west_bank_desc:0 "Священный город Иерусалим находится в осаде. Мы должны прорваться и открыть дорогу снабжения в город."
 ISR_legacy_of_the_conference:0 "Наследие Иерусалимской конференции"
 ISR_legacy_of_the_conference_desc:0 "После мирного завершения мандата мы оказались в выгодном положении. Нам достались не все желанные территории, но придётся довольствоваться полученным. Пора двигаться дальше."
 ISR_win:0 "...это не будет сказкой"
 ISR_win_desc:0 "Победа! Мы закрепили за собой Святую землю, обещанную предкам много веков назад. Пришло время строить новое государство."
 ISR_convene_knesset:0 "Созвать Кнессет"
 ISR_convene_knesset_desc:0 "После обретения независимости новым государством необходимо созвать Кнессет и провести первые выборы."
 ISR_hashomer:0 "Укрепить «Молодую гвардию»"
 ISR_hashomer_desc:0 "Подход Бен-Гуриона верен, но он не видит всей картины. Мы должны двигаться к более светлому социалистическому будущему!"
 ISR_cooperate_maki:0 "Сотрудничать с МАКИ"
 ISR_cooperate_maki_desc:0 "Мы не можем отказаться от просоветского курса. Следует сотрудничать с МАКИ и ПКП ради социалистической мечты о Сионе."
 ISR_lessen_soviet_stance:0 "Ослабить просоветский курс"
 ISR_lessen_soviet_stance_desc:0 "Чтобы заручиться более широкой поддержкой, необходимо ослабить просоветскую позицию. Мы можем потерять сторонников среди радикалов, но приобретём поддержку остальных."
 ISR_promise_arabs:0 "Пообещать арабам права"
 ISR_promise_arabs_desc:0 "Нельзя игнорировать потребности арабского населения. Наш долг — обеспечить ему достойное положение."
 ISR_expand_rural_influence:0 "Расширить влияние в сельской местности"
 ISR_expand_rural_influence_desc:0 "Необходимо поддержать нашу крупнейшую электоральную базу в кибуцах. Именно они являются основой жизнеспособности страны."
 ISR_brighter_future:0 "К светлому будущему"
 ISR_brighter_future_desc:0 "Время пришло. Мы должны доверить «Молодой гвардии» создание светлого будущего для нашего народа."
 ISR_mapai:0 "Сплотиться вокруг Бен-Гуриона"
 ISR_mapai_desc:0 "Давид Бен-Гурион — настоящий лидер нового государства. Никто не пожертвовал больше него. Он приведёт нас к стабильности!"
 ISR_demand_secular_education:0 "Продвигать секуляризацию"
 ISR_demand_secular_education_desc:0 "Необходимо позаботиться, чтобы следующее поколение великой страны получило светское и качественное образование. Нельзя позволить религиозному влиянию зайти слишком далеко."
 ISR_appease_religious:0 "Умиротворить религиозные партии"
 ISR_appease_religious_desc:0 "Левые из «Хашомера» слишком радикальны. Чтобы сформировать работоспособную коалицию, необходимо пойти навстречу религиозным партиям."
 ISR_promote_urban:0 "Поддержать городской рабочий класс"
 ISR_promote_urban_desc:0 "Городские рабочие являются жизненной силой страны. Для сохранения их поддержки необходимо защищать их права."
 ISR_form_DLN:0 "Создать ДЛН"
 ISR_form_DLN_desc:0 "Следует поддержать создание дружественной правительству арабской партии, чтобы заручиться поддержкой арабских избирателей."
 ISR_steady:0 "Держать прежний курс"
 ISR_steady_desc:0 "«Мапай» и Бен-Гурион привели нас сюда. Они направят страну к стабильному обществу!"
 ISR_centre:0 "Объединить центристский блок"
 ISR_centre_desc:0 "Возглавив коалицию партий «Новая алия» и «Общие сионисты», мы укрепим либеральные элементы общества и создадим современный, технологически развитый Израиль — именно такой, каким его видел Герцль."
 ISR_campaign_women:0 "Продвигать права женщин"
 ISR_campaign_women_desc:0 "Права женщин являются важнейшим вопросом нашего общества, и нельзя позволить им отстать от остальных. Вместе мы сильнее."
 ISR_lean_mapai:0 "Склониться к «Мапай»"
 ISR_lean_mapai_desc:0 "Ни для кого не секрет, что мы не способны сформировать правительство самостоятельно. Сблизившись с «Мапай», мы обеспечим свободное и справедливое общество, в котором каждый сможет добиться успеха."
 ISR_lean_hatzohar:0 "Склониться к «Хацохару»"
 ISR_lean_hatzohar_desc:0 "Ни для кого не секрет, что мы не способны сформировать правительство самостоятельно. Сблизившись с «Хацохаром», мы сможем избавиться от бюрократии Гистадрута."
 ISR_appeal_middle_class:0 "Обратиться к среднему классу"
 ISR_appeal_middle_class_desc:0 "Наша главная электоральная база — городской средний класс. Чтобы добиться успеха, необходимо продолжать его поддерживать."
 ISR_herzl_followers:0 "По стопам Герцля"
 ISR_herzl_followers_desc:0 "Мы являемся наследниками великого политического сионизма Герцля. Ради блага страны нельзя отходить от его наследия."
 ISR_hatzohar:0 "Укрепить ревизионистов"
 ISR_hatzohar_desc:0 "Бен-Гурион проявил чрезмерную мягкость к британской оккупации. Кто гарантирует, что он не предаст нас снова? Чтобы вернуть былую славу, необходимо сплотиться вокруг лидера [ISR.GetNeutralLeader]."
 ISR_affirm_territorial_claims:0 "Подтвердить территориальные претензии"
 ISR_affirm_territorial_claims_desc:0 "Истинная земля Сиона находится по обе стороны Иордана. Мы не должны забывать об этом."
 ISR_abandon_jordan:0 "Отказаться от Трансиордании"
 ISR_abandon_jordan_desc:0 "Чтобы привлечь умеренных избирателей, необходимо отказаться от идеи Великого Израиля. Возможно, в будущем у нас появится ещё один шанс."
 ISR_support_irgun_fighters:0 "Поддержать бывших бойцов «Иргуна»"
 ISR_support_irgun_fighters_desc:0 "Пусть «Иргун» больше не существует, мы всё равно должны пообещать поддержку его бывшим бойцам за проявленную верность."
 ISR_cooperate_religious:0 "Сотрудничать с религиозными партиями"
 ISR_cooperate_religious_desc:0 "Религиозные партии являются нашими главными союзниками. Необходимо признать их легитимность."
 ISR_betar_revived:0 "Дух Бейтара"
 ISR_betar_revived_desc:0 "Мы должны чтить наследие сопротивления. Йодфат, Масада, Бейтар."
 ISR_the_elections:0 "Провести выборы"
 ISR_the_elections_desc:0 "Время пришло."
 ISR_elect_president:0 "Избрать президента"
 ISR_elect_president_desc:0 "Стране необходима ведущая символическая фигура, представляющая нас на международной арене. Следует избрать церемониального президента, который станет главой государства."
 ISR_draft_constitution:0 "Разработать конституцию"
 ISR_draft_constitution_desc:0 "У молодой республики всё ещё нет конституции, и это угрожает демократии. Необходимо приступить к её написанию, несмотря на все трудности."
 ISR_hashomer_leads:0 "«Хашомер» у власти"
 ISR_hashomer_leads_desc:0 "Победа! Наши великие идеалы социалистического содружества еврейского народа близки к осуществлению. Но нельзя забывать, что мы здесь не одни и обязаны учитывать потребности всех остальных."
 ISR_strengthen_union:0 "Укрепить Гистадрут"
 ISR_strengthen_union_desc:0 "Рабочие профсоюзы страны, объединённые в Гистадрут, необходимо укрепить ради защиты прав трудящихся."
 ISR_soviet_support:0 "Заручиться советской поддержкой"
 ISR_soviet_support_desc:0 "Государство [SOV.GetNameDefCap] является очевидным защитником сионизма во всём мире. Мы должны обратиться к нему за поддержкой."
 ISR_limited_austerity:0 "Ограничить меры экономии"
 ISR_limited_austerity_desc:0 "Мы не можем полностью отменить действующие меры экономии, но должны слегка открыть экономику и начать экспортировать хотя бы то немногое, чем располагаем."
 ISR_limited_return:0 "Ограниченное право арабов на возвращение"
 ISR_limited_return_desc:0 "Многие местные арабы были вынуждены покинуть свои дома во время войны. Чтобы укрепить легитимность, необходимо постепенно разрешать им возвращаться."
 ISR_strengthen_maki:0 "Усилить МАКИ"
 ISR_strengthen_maki_desc:0 "Мечта МАКИ о двунациональной коммуне — будущее страны. Мы должны предоставить партии больше влияния и двигаться к её осуществлению."
 ISR_expand_industrial_hubs:0 "Расширить городские промышленные центры"
 ISR_expand_industrial_hubs_desc:0 "Расширяя промышленные центры в таких городах, как Хайфа, мы сможем ускорить урбанизацию страны."
 ISR_soviet_cooperation:0 "Военное сотрудничество с СССР"
 ISR_soviet_cooperation_desc:0 "Военное сотрудничество отвечает интересам обеих стран, поскольку враги революции становятся всё сильнее."
 ISR_centralization:0 "Продолжить политическую централизацию"
 ISR_centralization_desc:0 "Страна долгое время оставалась децентрализованной. Для расширения влияния необходимо централизовать многие учреждения."
 ISR_merge_unions:0 "Объединение профсоюзов"
 ISR_merge_unions_desc:0 "Для развития сотрудничества среди населения необходимо объединить арабские и еврейские профсоюзы."
 ISR_arab_recruitment:0 "Набирать арабов в армию"
 ISR_arab_recruitment_desc:0 "Чтобы создать единое общество, необходимо разрешить арабским солдатам служить в армии."
 ISR_levantine_commune:0 "Левантийская коммуна"
 ISR_levantine_commune_desc:0 "Необходимо преодолеть границы этнического конфликта и навсегда объединить рабочие классы в новом союзе. Именно так мы добьёмся мира."
 ISR_toe_line:0 "Придерживаться средней линии"
 ISR_toe_line_desc:0 "Экстремисты из МАКИ слишком радикальны и лишь дестабилизируют страну. Мы должны придерживаться умеренной линии, чтобы избежать краха."
 ISR_fix_bureaucracy:0 "Решить проблему бюрократии Гистадрута"
 ISR_fix_bureaucracy_desc:0 "Сейчас Гистадрут страдает от чрезмерной бюрократии, из-за чего многие относятся к нему неприязненно. Если он продолжит управлять экономикой, эту проблему необходимо устранить."
 ISR_galilee_development:0 "Развивать Галилею"
 ISR_galilee_development_desc:0 "Чтобы сохранить поддержку сельского населения, необходимо развивать Галилею."
 ISR_reconciliation:0 "Примирение с арабами"
 ISR_reconciliation_desc:0 "Мы не можем вечно оставаться врагами. Пришло время примириться и найти решение на будущее."
 ISR_work_with_arab:0 "Сотрудничать с арабскими лидерами"
 ISR_work_with_arab_desc:0 "Для достижения взаимного соглашения необходимо обратиться к арабским лидерам, разделяющим наши взгляды."
 ISR_recognize_beduin:0 "Признать бедуинские поселения"
 ISR_recognize_beduin_desc:0 "Чтобы заручиться поддержкой бедуинов на юге, необходимо признать их поселения и помочь им перейти к оседлой жизни."
 ISR_two_state_solution:0 "Решение о двух государствах"
 ISR_two_state_solution_desc:0 "Тот, кто верит, что мы сможем сохранить контроль над районами с арабским большинством, — глупец. Ради блага обоих народов мы должны предоставить им независимость."
 ISR_shearim:0 "Шеарим по нифтах"
 ISR_shearim_desc:0 "Наша мечта о великом социалистическом содружестве осуществилась. Во благо евреев и арабов.\n\nВрата открыты."
 ISR_invest_in_kibbutzim:0 "Инвестировать в кибуцы"
 ISR_invest_in_kibbutzim_desc:0 "Аграрные кибуцы являются основой нашего экономического плана. Мы должны поддерживать их, чтобы снизить зависимость от импорта продовольствия."
 ISR_mapai_hashomer:0 "Преодолеть старые разногласия"
 ISR_mapai_hashomer_desc:0 "Хотя между «Мапай» и «Хашомером» было немало разногласий, мы должны отложить споры и сосредоточиться на общей картине."
 ISR_setup_public_transit:0 "Расширить общественный транспорт"
 ISR_setup_public_transit_desc:0 "Расширив сеть общественного транспорта, мы обеспечим гражданам удобный доступ к нужным местам и повысим эффективность их труда."
 ISR_mapai_cemented:0 "Закрепить господство «Мапай»"
 ISR_mapai_cemented_desc:0 "Очевидным победителем выборов стала «Мапай». Она вела нас тридцать лет и будет вести ещё тридцать!"
 ISR_begin_nationalization:0 "Начать национализацию промышленности"
 ISR_begin_nationalization_desc:0 "Мы должны национализировать промышленность страны, чтобы обеспечить её правильное использование и предотвратить злоупотребления."
 ISR_education_reforms:0 "Закон об обязательном образовании"
 ISR_education_reforms_desc:0 "Каждый ребёнок в стране должен получить базовое образование, чтобы следующее поколение стало образованнее и способнее нынешнего."
 ISR_cement_histadrut_powers:0 "Закрепить полномочия Гистадрута"
 ISR_cement_histadrut_powers_desc:0 "Предоставлять Гистадруту чрезмерную власть было бы опасно, но нельзя недооценивать его важную роль в обществе. Следует оказать ему дополнительную поддержку."
 ISR_establish_bituah_leumi:0 "Создать Битуах Леуми"
 ISR_establish_bituah_leumi_desc:0 "Мы должны заботиться о тех, кто не способен позаботиться о себе. Будет создано новое ведомство для помощи инвалидам и пожилым людям."
 ISR_lessen_austerity:0 "Ослабить меры экономии"
 ISR_lessen_austerity_desc:0 "Действующие меры экономии продолжаются уже слишком долго. Пора снова открыть экономику."
 ISR_palestinian_compromises:0 "Достичь компромисса с палестинцами"
 ISR_palestinian_compromises_desc:0 "Нельзя забывать о потребностях арабского населения. Мы должны достичь с ним соглашения."
 ISR_operation_magic_carpet:0 "Операция «Ковёр-самолёт»"
 ISR_operation_magic_carpet_desc:0 "Наш народ в Йемене подвергается преследованиям. Мы обязаны вернуть его домой любыми средствами."
 ISR_the_ageing_father:0 "Стареющий отец"
 ISR_the_ageing_father_desc:0 "Премьер-министр Бен-Гурион неоднократно выражал желание уйти из политики и основать кибуц в Негеве. Многие считают, что он заслужил отдых, но другие уверены, что в нынешнее время стране необходимо его руководство.\n\nКак нам поступить?"
 ISR_ben_gurion_stays:0 "Бен-Гурион остаётся"
 ISR_ben_gurion_stays_desc:0 "В нынешнее время нам необходимо руководство Бен-Гуриона. Он должен остаться."
 ISR_develop_negev:0 "Развивать Негев"
 ISR_develop_negev_desc:0 "Необходимо развивать пустыню Негев, где достаточно места для новых иммигрантов."
 ISR_fund_urban_areas:0 "Финансировать лагеря иммигрантов"
 ISR_fund_urban_areas_desc:0 "Чтобы городские районы смогли построить достаточно жилья для волн иммиграции, необходимо обеспечить им финансирование."
 ISR_herzl_successor:0 "Великий преемник Герцля"
 ISR_herzl_successor_desc:0 "Премьер-министр Бен-Гурион доказал, что является великим преемником Герцля. Мы должны признать это."
 ISR_operation_ezra_nehamiah:0 "Операция «Эзра и Нехемия»"
 ISR_operation_ezra_nehamiah_desc:0 "Мы вновь должны эвакуировать наш народ из другой страны из-за угрозы преследований. На этот раз — из Ирака."
 ISR_sharett_takes_over:0 "Шарет возглавляет правительство"
 ISR_sharett_takes_over_desc:0 "Бен-Гуриону необходимо позволить отдохнуть. Его место займёт министр иностранных дел Моше Шарет."
 ISR_sharett_reforms:0 "Экономические реформы Шарета"
 ISR_sharett_reforms_desc:0 "Следует немного либерализовать экономику. Гистадрут стал чрезмерно бюрократизированным."
 ISR_further_palestinian_negotiations:0 "Продолжить переговоры с палестинцами"
 ISR_further_palestinian_negotiations_desc:0 "Мы можем прекратить постоянную борьбу. Необходимо продолжить переговоры с палестинцами."
 ISR_sharett_diplomacy:0 "Внешняя дипломатия"
 ISR_sharett_diplomacy_desc:0 "Для привлечения экономических инвестиций необходимо расширить дипломатические связи с остальным миром."
 ISR_moses_hess_legacy:0 "Рим и Иерусалим"
 ISR_moses_hess_legacy_desc:0 "Моисей Гесс, великий провидец лейбористского сионизма, давно умер. Но его идеалы остаются живыми и создали нашу славную нацию. Мы не должны забывать об этом.\n\nНе говори, что настанет день. Приходите в день."
 ISR_appeal_west:0 "Обратиться к Западу"
 ISR_appeal_west_desc:0 "Инвестиции в нашу молодую страну отвечают интересам Запада. Следует обратиться к нему за промышленной поддержкой."
 ISR_progressives:0 "Новая алия"
 ISR_progressives_desc:0 "Поскольку партия «Новая алия» входит в нашу коалицию, мы должны сотрудничать с ней и поддержать часть её политики."
 ISR_womens_rights:0 "Продвигать права женщин"
 ISR_womens_rights_desc:0 "Если мы хотим построить действительно свободную страну, права женщин несомненно должны стать одним из важнейших вопросов."
 ISR_secularize_public_laws:0 "Секуляризировать общественные законы"
 ISR_secularize_public_laws_desc:0 "Религиозные законы лишь тормозят развитие. Мы должны устранить этот пережиток."
 ISR_general_zionists:0 "Общие сионисты"
 ISR_general_zionists_desc:0 "Поскольку партия «Общие сионисты» входит в нашу коалицию, мы должны сотрудничать с ней и поддержать часть её политики."
 ISR_develop_road_infrastructure:0 "Развивать дорожную инфраструктуру"
 ISR_develop_road_infrastructure_desc:0 "Для процветания страны необходимо расширять инфраструктуру, чтобы гражданам было проще передвигаться."
 ISR_develop_gush_dan:0 "Развивать Гуш-Дан"
 ISR_develop_gush_dan_desc:0 "Гуш-Дан, сердце страны, нуждается в дополнительных инвестициях. Следует построить там больше фабрик."
 ISR_centre_victorious:0 "Старая гвардия"
 ISR_centre_victorious_desc:0 "Либеральный сионизм Герцля не умер, а лишь дремал. Мы исполним его завет."
 ISR_undo_austerity:0 "Отменить меры экономии"
 ISR_undo_austerity_desc:0 "Катастрофические меры военной экономии Бен-Гуриона необходимо отменить. Они лишь вредят стране."
 ISR_foreign_experts:0 "Пригласить иностранных специалистов"
 ISR_foreign_experts_desc:0 "Многие зарубежные специалисты сочувствуют нашему делу и могут помочь развитию исследований. Мы должны пригласить их."
 ISR_promote_electronic_developments:0 "Развивать электронику"
 ISR_promote_electronic_developments_desc:0 "Ни для кого не секрет, что нас окружают враги. Чтобы компенсировать это, необходимо сохранять технологическое превосходство."
 ISR_economic_liberalisation:0 "Экономическая либерализация"
 ISR_economic_liberalisation_desc:0 "Старая социалистическая экономика не подходит молодой стране. Ради максимального роста необходимо её либерализовать."
 ISR_increase_urban_investments:0 "Увеличить инвестиции в города"
 ISR_increase_urban_investments_desc:0 "Большинство населения живёт в городах, поэтому необходимо развивать там новые рабочие места."
 ISR_best_of_the_best:0 "Лучшие из лучших"
 ISR_best_of_the_best_desc:0 "Окружённая врагами страна должна обладать лучшими технологиями, чтобы превзойти противников умом."
 ISR_strengthen_progressives:0 "Укрепить прогрессистов"
 ISR_strengthen_progressives_desc:0 "Партия Пинхаса Розена «Новая алия» выдвигает разумные идеи. Следует прислушаться к ней и усилить её влияние."
 ISR_push_secular_education:0 "Продвигать светское образование"
 ISR_push_secular_education_desc:0 "Наши дети должны получать образование высочайшего качества. Нельзя тратить их время на ненужные предметы."
 ISR_invest_in_white_collar:0 "Инвестировать в умственный труд"
 ISR_invest_in_white_collar_desc:0 "Страна мала и бедна ресурсами. Если мы не можем постоянно превосходить врагов военной силой, то должны опережать их технологически, развивая наукоёмкие отрасли."
 ISR_appeal_to_diaspora:0 "Обратиться к диаспоре"
 ISR_appeal_to_diaspora_desc:0 "Многие евреи диаспоры готовы поддержать нас. Следует собрать их средства для открытия новых предприятий."
 ISR_expand_immigrant_infrastructure:0 "Расширить инфраструктуру алии"
 ISR_expand_immigrant_infrastructure_desc:0 "Каждый год к нашим берегам прибывают сотни тысяч людей. Необходимо расширять инфраструктуру для их размещения."
 ISR_status_quo_arabs:0 "Закрепить статус-кво"
 ISR_status_quo_arabs_desc:0 "После обретения независимости в стране осталось многочисленное арабское население. Мы сохраним статус-кво, освобождающий его от обязательной военной службы."
 ISR_shift_rightwards:0 "Сместиться вправо"
 ISR_shift_rightwards_desc:0 "«Общие сионисты» обладают лучшим видением будущего страны. Мы должны последовать за ними и построить капиталистическое государство."
 ISR_tax_reforms:0 "Налоговые реформы"
 ISR_tax_reforms_desc:0 "Старое социалистическое правительство ввело множество ненужных налогов. Мы должны их отменить."
 ISR_histardrut_deregulation:0 "Ослабить Гистадрут"
 ISR_histardrut_deregulation_desc:0 "Гистадрут занимает важное место, но сейчас обладает чрезмерной властью. Необходимо покончить с его бюрократией."
 ISR_further_industry_expansions:0 "Дальнейшее расширение промышленности"
 ISR_further_industry_expansions_desc:0 "Наша промышленность всё ещё может расти. Необходимо продолжать инвестиции."
 ISR_middle_class_investments:0 "Укрепить средний класс"
 ISR_middle_class_investments_desc:0 "Основу нашей поддержки составляет средний класс. Мы должны поддержать его и расширить его влияние."
 ISR_legacy_of_basel:0 "Альтнойланд"
 ISR_legacy_of_basel_desc:0 "Представляя Старую новую землю, Герцль видел её плавильным котлом культур, свободной и терпимой страной. Именно к этому мы должны стремиться, чтобы сохранить его наследие.\n\nЕсли вы захотите — это не будет сказкой."
 ISR_the_religious_front:0 "Религиозный фронт"
 ISR_the_religious_front_desc:0 "Поскольку Объединённый религиозный фронт входит в нашу коалицию, мы должны сотрудничать с ним ради достижения целей."
 ISR_fund_religious_education:0 "Финансировать религиозное образование"
 ISR_fund_religious_education_desc:0 "Чтобы заручиться поддержкой религиозных партий, необходимо финансировать религиозное образование в их общинах по всей стране."
 ISR_exempt_yeshiva_students:0 "Освободить учащихся ешив от призыва"
 ISR_exempt_yeshiva_students_desc:0 "Чтобы получить поддержку религиозных партий, необходимо освободить учащихся ешив от обязательной военной службы."
 ISR_status_quo_agreement:0 "Соглашение о статус-кво"
 ISR_status_quo_agreement_desc:0 "Соглашение о статус-кво усложнит изменение законов, основанных на религии, и защитит их от отмены в будущем."
 ISR_revisionist_revolution:0 "Ревизионистская революция"
 ISR_revisionist_revolution_desc:0 "Победа! Наша великая мечта о ревизионистском правительстве, которое исправит ошибки лейбористов-сионистов."
 ISR_the_five_mems:0 "Хамешет ха-мемим"
 ISR_the_five_mems_desc:0 "Пять «мем» Жаботинского определяют основные потребности каждого гражданина: пища, жильё, одежда, образование и здоровье. Мы обязаны обеспечить к ним доступ всему населению."
 ISR_periphery_investments:0 "Инвестиции в периферию"
 ISR_periphery_investments_desc:0 "Нельзя позволить Тель-Авиву и Гуш-Дану оставить остальную страну позади. Необходимо инвестировать в периферийные города."
 ISR_open_economy:0 "Открыть экономику"
 ISR_open_economy_desc:0 "Необходимо отказаться от мер военной экономии и открыть внешнюю торговлю."
 ISR_cement_jewish_identity:0 "Закрепить еврейскую идентичность"
 ISR_cement_jewish_identity_desc:0 "Израиль прежде всего является государством еврейского народа. Это не должно ставиться под сомнение."
 ISR_push_military_industries:0 "Перенаправить финансирование промышленности"
 ISR_push_military_industries_desc:0 "Стране не хватает военной промышленности. Необходимо перенаправить часть средств на её развитие."
 ISR_weaken_histadrut:0 "Ослабить Гистадрут"
 ISR_weaken_histadrut_desc:0 "Профсоюзы Гистадрута стали слишком влиятельными. Мы должны обойти их власть и подорвать её."
 ISR_cement_five_mems:0 "Еврей в бедности — всё равно благороден"
 ISR_cement_five_mems_desc:0 "Еврейский народ пережил невероятные страдания. Мы не должны забывать наследие сопротивления."
 ISR_begin_takes_over:0 "Бегин приходит к власти"
 ISR_begin_takes_over_desc:0 "Жаботинский ушёл из жизни. Великий отец ревизионистского сионизма хотел бы, чтобы мы продолжили его дело. Его место займёт Менахем Бегин."
 ISR_expand_settlement:0 "Расширить еврейские поселения"
 ISR_expand_settlement_desc:0 "Чтобы противостоять палестинскому сопротивлению, необходимо расширять еврейские поселения по всей стране."
 ISR_reject_lesser_israel:0 "Отвергнуть Малый Израиль"
 ISR_reject_lesser_israel_desc:0 "Среди нашего народа есть предатели, считающие, что ради мира следует уступить территории. Этого никогда не произойдёт."
 ISR_martial_law:0 "Военное положение в палестинских районах"
 ISR_martial_law_desc:0 "Чтобы противостоять сопротивлению и предотвратить нападения, необходимо ввести военное положение в палестинских районах."
 ISR_abandon_eretz_yisrael:0 "Отказаться от Великого Израиля"
 ISR_abandon_eretz_yisrael_desc:0 "Если мы хотим получить хотя бы шанс на мир, необходимо признать, что времена изменились и больше нельзя претендовать на восточный берег Иордана."
 ISR_only_thus:0 "Только так"
 ISR_only_thus_desc:0 "Время пришло. Мы наконец объединим оба берега Иордана в составе Великого Израиля."
 ISR_yodefet_masada_betar:0 "Йодфат, Масада, Бейтар"
 ISR_yodefet_masada_betar_desc:0 "Наследие сопротивления еврейского народа сохранилось. Сначала Йодфат, затем Масада, а теперь — мы.\n\nПокорить гору или умереть."
 ISR_join_SOV:0 "Присоединиться к Советам"
 ISR_join_SOV_desc:0 "Государство [SOV.GetNameDefCap] доказало, что является нашим величайшим союзником. Мы должны присоединиться к его борьбе."
 ISR_join_USA:0 "Присоединиться к Соединённым Штатам"
 ISR_join_USA_desc:0 "В государстве [USA.GetNameDefCap] проживает крупнейшая еврейская община за пределами Израиля. Ради нашего народа мы должны заключить с ним союз."
 ISR_alone:0 "Собственная судьба"
 ISR_alone_desc:0 "Европейцы угнетали нас две тысячи лет. Пришло время самостоятельно определить свою судьбу на собственной земле, свободной от чужого влияния."
 ISR_join_ENG:0 "Присоединиться к Великобритании"
 ISR_join_ENG_desc:0 "Несмотря на британскую оккупацию, Великобритания остаётся нашим наиболее полезным союзником. Нельзя позволить прошлому встать между нами и безопасным Израилем."
 ISR_join_ITA:0 "Присоединиться к государству [ITA.GetNameDef]"
 ISR_join_ITA_desc:0 "Государство [ITA.GetNameDef] доказало, что является хорошим союзником. Мы должны присоединиться к нему."
 ISR_am_yisrael_hai:0 "Ам Исраэль хай"
 ISR_am_yisrael_hai_desc:0 "После двух тысяч лет изгнания, угнетения, погромов и геноцида еврейский народ наконец обрёл место, которое может назвать домом. Путь был нелёгким, и будущее также не будет простым. Но сегодня мы можем чувствовать себя в безопасности, зная, что народ Израиля жив.\n\nПока еврейская душа ещё стремится, наша надежда не утрачена."
 ISR_destroy_nazi:0 "Последняя битва"
 ISR_destroy_nazi_desc:0 "Нацистские свиньи в Германии уничтожают нашу культуру, наши семьи и наш народ. Мы должны объединиться ради последней битвы."
 ISR_irgun_in_power:0 "Продолжить правление «Иргуна»"
 ISR_irgun_in_power_desc:0 "Для защиты от внешних угроз стране необходимо руководство «Иргуна». Нельзя жертвовать безопасностью ради демократии."
 ISR_fight_resistance:0 "Подавить сопротивление"
 ISR_fight_resistance_desc:0 "Прежде всего необходимо подавить сопротивление на наших территориях, чтобы предотвратить нападения на народ."
 ISR_consolidate_power:0 "Укрепить власть"
 ISR_consolidate_power_desc:0 "Частично справившись с сопротивлением на наших землях, мы наконец можем укрепить власть."
 ISR_end_austerity:0 "Покончить с мерами экономии"
 ISR_end_austerity_desc:0 "Необходимо отменить меры экономии, введённые во время войны за независимость, и открыть страну для мировой торговли."
 ISR_histadrut_legislation:0 "Законодательство о Гистадруте"
 ISR_histadrut_legislation_desc:0 "Чтобы ещё больше укрепить контроль над страной, необходимо подорвать власть Гистадрута."
 ISR_factory_investments:0 "Промышленные инвестиции"
 ISR_factory_investments_desc:0 "Следует инвестировать в промышленность, чтобы расширить возможности страны по самозащите."
 ISR_push_jewish:0 "Вечный народ"
 ISR_push_jewish_desc:0 "Еврейский народ две тысячи лет не имел государства, но теперь наконец обрёл собственную землю."
 ISR_watch_yishuv_leaders:0 "Следить за лидерами ишува"
 ISR_watch_yishuv_leaders_desc:0 "Бывшим лидерам ишува следует позволить продолжать политическую деятельность, но необходимо следить, чтобы они не распространяли недовольство."
 ISR_push_militarism:0 "Дипломатия железной стены"
 ISR_push_militarism_desc:0 "Зеэв Жаботинский утверждал, что основой нашей дипломатии должна стать сильная армия, способная самостоятельно защитить страну, и лишь после этого возможны успешные переговоры с арабским населением и соседями. Только еврейская военная сила обеспечит прочный мир."
 ISR_third_temple:0 "Третий храм"
 ISR_third_temple_desc:0 "С момента разрушения Второго храма римлянами евреи всего мира мечтали восстановить его. Теперь эта мечта становится реальностью и служит призывом к объединению евреев по всему миру."
 ISR_foreign_assets_seized:0 "Конфискованные иностранные активы"
 ISR_jabotinsky_death:0 "Смерть отца"
 ISR_jabotinsky_death_desc:0 "Зеэв Жаботинский — писатель, поэт, солдат, офицер и отец ревизионистского сионизма — ушёл из жизни.\nНачинается новая эпоха, и уже появляются первые трещины. Менахем Бегин избран продолжателем его дела, но многие опасаются, что его власть подрывают ещё до её окончательного установления."
 ISR_the_revisionist_split:0 "Раскол ревизионистов"
 ISR_the_revisionist_split_desc:0 "Авраам Штерн назвал Менахема Бегина предателем страны и начал восстание против нового правительства."
 ISR_gather_the_loyalists:0 "Собрать лоялистов"
 ISR_gather_the_loyalists_desc:0 "Штерн — всего лишь предатель! Мы сокрушим его восстание!"
 ISR_appeal_to_haganah:0 "Обратиться к бывшим бойцам «Хаганы»"
 ISR_appeal_to_haganah_desc:0 "Несмотря на разногласия, мы должны признать общего врага и сотрудничать с бывшими бойцами «Хаганы», способными усилить наши ряды."
 ISR_negotiate_lehi_defectors:0 "Договориться с перебежчиками из «Лехи»"
 ISR_negotiate_lehi_defectors_desc:0 "Не все сторонники Штерна поддерживают восстание. Амнистия поможет получить сведения о возможном местонахождении штаба «Лехи»."
 ISR_crown_of_david:0 "Надеть корону Давида"
 ISR_crown_of_david_desc:0 "Восстание Штерна подавлено, а сам он казнён за измену. Пришло время двигаться вперёд и вернуть былую славу."
 ISR_strengthen_military_industrial:0 "Укрепить военно-промышленный комплекс"
 ISR_strengthen_military_industrial_desc:0 "Перенаправление средств военно-промышленному комплексу позволит оптимизировать производство нового вооружения."
 ISR_seize_foreign_assets:0 "Конфисковать иностранные активы"
 ISR_seize_foreign_assets_desc:0 "В стране всё ещё находится множество иностранных активов. Конфисковав их, мы сможем извлечь выгоду."
 ISR_arms_sourcing:0 "Закупки вооружения"
 ISR_arms_sourcing_desc:0 "Для расширения военных возможностей необходимо закупать оружие на международных рынках."
 ISR_expand_support_uses:0 "Расширить применение вспомогательного вооружения"
 ISR_expand_support_uses_desc:0 "Чтобы эффективнее вести асимметричные войны, необходимо шире применять вспомогательное вооружение."
 ISR_judea_fell:0 "Огнём и кровью пала Иудея"
 ISR_judea_fell_desc:0 "Почти две тысячи лет назад последнее еврейское государство пало под ударами римлян. Вопреки всему мы бросили вызов истории и вновь восстановили еврейскую родину."
 ISR_settlement_projects:0 "Расширить проекты поселений"
 ISR_settlement_projects_desc:0 "Для укрепления контроля над регионом необходимо расширить еврейские поселения по всей стране."
 ISR_clean_resistance:0 "Изгнать сопротивление"
 ISR_clean_resistance_desc:0 "Необходимо уничтожить оставшиеся очаги сопротивления, чтобы они больше не угрожали стране."
 ISR_the_italian_model:0 "Итальянская модель"
 ISR_the_italian_model_desc:0 "Бенито Муссолини представил великое видение устройства сильной нации. Мы должны последовать его примеру."
 ISR_joint_military_exercises:0 "Совместные военные учения"
 ISR_joint_military_exercises_desc:0 "Следует участвовать в совместных учениях с [ITA.GetAdjective]ой армией. Нам есть чему у неё научиться."
 ISR_strike_egypt:0 "Ударить по Египту"
 ISR_strike_egypt_desc:0 "С помощью итальянцев мы можем атаковать Египет с двух сторон, обеспечив контроль над Суэцким каналом и укрепив положение альянса в Северной Африке."
 ISR_support_maronite_lebanese:0 "Поддержать ливанских маронитов"
 ISR_support_maronite_lebanese_desc:0 "Маронитские христиане Ливана обратились к нам за поддержкой против оккупационных сил. Следует отправить им помощь — возможно, они станут близкими союзниками."
 ISR_the_periphery_strategy:0 "Стратегия периферии"
 ISR_the_periphery_strategy_desc:0 "Следует укрепить отношения с неарабскими странами Ближнего Востока, чтобы создать оплот против арабской агрессии."
 ISR_turkish_alliance:0 "[TUR.GetAdjective] Примирение"
 ISR_turkish_alliance_desc:0 "Государство [TUR.GetNameDefCap] когда-то владело нашей Святой землёй, но ради защиты обеих стран мы готовы к примирению."
 ISR_iranian_alliance:0 "Расширить [PER.GetAdjective]ий союз"
 ISR_iranian_alliance_desc:0 "Отношения с имперским правительством Ирана чрезвычайно важны. Следует расширить наш союз."
 ISR_partition_syria:0 "Разделить Сирию"
 ISR_partition_syria_desc:0 "Государство [TUR.GetNameDef] предъявляет множество претензий на сирийские территории. Возможно, мы сможем разделить Сирию между собой."
 ISR_judea_rise:0 "Огнём и кровью восстанет Иудея!"
 ISR_judea_rise_desc:0 "Почти две тысячи лет назад последнее еврейское государство пало под ударами римлян. Вопреки всему мы бросили вызов истории и вновь восстановили еврейскую родину. Многие выступают против нас, но только огнём и кровью мы сможем обеспечить свою судьбу!"
 ISR_empower_stern_gang:0 "Усилить «Банду Штерна»"
 ISR_empower_stern_gang_desc:0 "Штерн — единственный, кто способен привести нас к величию! Долой «Иргун»!"
 ISR_gather_outside_support:0 "Заручиться иностранной поддержкой"
 ISR_gather_outside_support_desc:0 "Мы должны запросить поддержку у националистических стран по всему миру. Несомненно, они помогут нам."
 ISR_strike_infrastructure:0 "Ударить по инфраструктуре «Иргуна»"
 ISR_strike_infrastructure_desc:0 "Удары по инфраструктуре позволят ослабить «Иргун» и нарушить его снабжение."
 ISR_avenge_tragedies:0 "Отомстить за величайшие трагедии"
 ISR_avenge_tragedies_desc:0 "Наш народ слишком долго был лишён законной судьбы. Пришло время взять дело в собственные руки."
 ISR_nile_to_euphrates:0 "От Нила до Евфрата"
 ISR_nile_to_euphrates_desc:0 "Давным-давно нашему народу были обещаны земли от Нила до Евфрата. Это обещание остаётся в силе."
 ISR_stern_cult:0 "Культ Штерна"
 ISR_stern_cult_desc:0 "Только Авраам Штерн достоин править нашей великой родиной. Он привёл нас к славе и приведёт к спасению!"
 ISR_join_fascists:0 "Союзники за рубежом"
 ISR_join_fascists_desc:0 "Чтобы укрепить наше дело, следует заключить союз с другими националистическими странами мира."
 ISR_kill_stern:0 "Избавиться от Штерна"
 ISR_kill_stern_desc:0 "Штерн был полезным орудием, но мы должны избавиться от него, прежде чем он приведёт страну к гибели. Истинными лидерами станет Триумвират."
 ISR_schizo_nazbol:0 "Перестроить внутреннюю политику"
 ISR_schizo_nazbol_desc:0 "Старые методы Штерна ушли в прошлое, и ради выживания необходимо приспособиться. Следует принять идеологию национал-большевизма, чтобы сблизиться с Советским Союзом."
 ISR_join_soviet:0 "Присоединиться к государству [SOV.GetNameDef]"
 ISR_join_soviet_desc:0 "Мы должны присоединиться к борьбе государства [SOV.GetNameDef] ради продвижения нашего дела. Оно сможет защитить нас."
 ISR_the_east_bank:0 "Восточный берег"
 ISR_the_east_bank_desc:0 "Восточный берег Иордана не менее [ISR.GetAdjective], чем западный. Необходимо как можно скорее установить над ним контроль."
 ISR_seize_lebanon:0 "Захватить Ливан"
 ISR_seize_lebanon_desc:0 ""
 ISR_syria_war:0 "Война в Сирии"
 ISR_syria_war_desc:0 ""
 ISR_to_the_euphrates:0 "К Евфрату"
 ISR_to_the_euphrates_desc:0 ""
 ISR_into_the_desert:0 "В пустыню"
 ISR_into_the_desert_desc:0 ""
 ISR_to_the_suez:0 "К Суэцу"
 ISR_to_the_suez_desc:0 ""
 ISR_build_third_temple:0 "Построить Третий храм"
 ISR_build_third_temple_desc:0 "Две тысячи лет назад наш Второй храм был разрушен. Однако Храмовая гора по-прежнему существует, и мы должны отомстить за трагедии прошлого, восстановив храм любой ценой."
 ISR_suez_crisis:0 "Кризис на Суэце"
 ISR_suez_crisis_desc:0 "Государство [EGY.GetNameDefCap] перекрыло нам доступ к Суэцкому каналу! Это акт войны, и мы не можем оставить его без ответа!"
 ISR_appeal_to_uk:0 "Обратиться к государству [ENG.GetNameDef]"
 ISR_appeal_to_uk_desc:0 "Государство [ENG.GetNameDefCap] ранее владело каналом. Мы можем сотрудничать с ним, чтобы вновь обеспечить доступ."
 ISR_appeal_to_france:0 "Обратиться к государству [FRA.GetNameDef]"
 ISR_appeal_to_france_desc:0 "Государство [FRA.GetNameDefCap] также имеет интересы в этом вопросе. Мы должны заручиться его поддержкой."
 ISR_prepare_the_invasion:0 "Подготовить вторжение"
 ISR_prepare_the_invasion_desc:0 "Вопрос не в том, будет ли война, а в том, когда она начнётся. Мы должны подготовиться."
 ISR_operation_sinai:0 "Операция «Кадеш»"
 ISR_operation_sinai_desc:0 "Время пришло. Необходимо начать вторжение."
 ISR_a_resounding_victory:0 "Сокрушительная победа"
 ISR_a_resounding_victory_desc:0 "Мы одержали великую победу! Теперь, когда Синай находится в наших руках, мы находимся за столом переговоров. Мы должны использовать свою силу для достижения благоприятного результата."
 ISR_stretch_out_the_hand:0 "Протянуть руку"
 ISR_stretch_out_the_hand_desc:0 "Пришло время сесть за стол переговоров. Мы должны совместно найти окончательное решение вопроса о канале."
 ISR_one_zion:0 "Один Сион, один Израиль"
 ISR_one_zion_desc:0 "Хватит! Иностранные державы не заставят нас сесть за стол переговоров! Ради защиты от Египта мы должны удержать Синай."
 ISR_encourage_hebraic_settlement:0 "Поощрять еврейские поселения"
 ISR_encourage_hebraic_settlement_desc:0 "Поощрять еврейские поселения"
 ISR_raise_jewish_militias:0 "Укрепить ЦАХАЛ"
 ISR_raise_jewish_militias_desc:0 "По стране всё ещё действуют многочисленные ополчения. Необходимо закрепить за ЦАХАЛ статус единственной законной армии."
 ISR_formalize_military:0 "Упорядочить военную структуру"
 ISR_formalize_military_desc:0 "Необходимо официально закрепить структуру ЦАХАЛ, чтобы укрепить военное командование."
 ISR_provisional_government:0 "Вопрос о столице"
 ISR_provisional_government_desc:0 "После окончания войны необходимо решить вопрос о столице. Останется ли она в Тель-Авиве или вернётся в Иерусалим?"
 ISR_national_higher_education:0 "Всеобщее высшее образование"
 ISR_national_higher_education_desc:0 "Недостаток образования среди молодёжи остаётся серьёзной проблемой, которую необходимо решить любыми средствами!"
 ISR_reading_power_station:0 "Открыть электростанцию Рединг"
 ISR_reading_power_station_desc:0 "Страна должна самостоятельно производить электроэнергию. Открытие новой электростанции в Тель-Авиве станет хорошим первым шагом."
 ISR_link_communities:0 "Связать общины"
 ISR_link_communities_desc:0 ""
 ISR_military_vehicles:0 "Разработать военные автомобили"
 ISR_military_vehicles_desc:0 "Разработать военные автомобили"
 ISR_armored_vehicles:0 "Бронетехника"
 ISR_armored_vehicles_desc:0 "Бронетехника"
 ISR_building_the_new_homeland:0 "Строительство новой родины"
 ISR_building_the_new_homeland_desc:0 "Мы должны приступить к строительству новой родины нашего народа."
 ISR_land_reclamation:0 "Проекты освоения земель"
 ISR_land_reclamation_desc:0 "Наша страна мала, и пространства для промышленного строительства немного. Необходимо начать проекты освоения земель по всей стране, чтобы использовать каждый доступный участок."
 ISR_kibbutz_production:0 "Развитие местных кибуцев"
 ISR_kibbutz_production_desc:0 "Развитие местных кибуцев"
 ISR_industrial_expansion_plan:0 "План промышленного расширения"
 ISR_industrial_expansion_plan_desc:0 "План промышленного расширения"
 ISR_firearms_production:0 "Производство стрелкового оружия"
 ISR_firearms_production_desc:0 "Производство стрелкового оружия"
 ISR_issue_the_israeli_lira:0 "Ввести [ISR.GetAdjective]ую лиру"
 ISR_issue_the_israeli_lira_desc:0 "Чтобы избавиться от британского влияния, необходимо отказаться от старого палестинского фунта и заменить его новой валютой — [ISR.GetAdjective]ой лирой."
 ISR_independent_steel_production:0 "Независимое производство стали"
 ISR_independent_steel_production_desc:0 "Независимое производство стали"
 ISR_israel_military_industries:0 "Военная промышленность Израиля"
 ISR_israel_military_industries_desc:0 "Военная промышленность Израиля"
 ISR_equipment_modernization:0 "Модернизация снаряжения"
 ISR_equipment_modernization_desc:0 "Модернизация снаряжения"
 ISR_reading_power_station_idea:0 "Электростанция Рединг"
 ISR_special_night_squads:0 "Особые ночные отряды"
 ISR_special_night_squads_desc:0 "Особые ночные отряды"
 ISR_special_forces:0 "Инвестировать в силы специального назначения"
 ISR_special_forces_desc:0 "Инвестиции в силы специального назначения позволят компенсировать нехватку людских ресурсов, сделав одного нашего бойца равным двум вражеским."
 ISR_plane_imports:0 "Создать «Шерут Авир»"
 ISR_plane_imports_desc:0 "После обретения независимости необходимо создать собственные военно-воздушные силы. Для начала можно использовать бывшие британские истребители, оставленные на аэродроме Лод."
 ISR_volunteer_pilots:0 "Лётчики-добровольцы"
 ISR_volunteer_pilots_desc:0 "Лётчики-добровольцы"
 ISR_israeli_air_school:0 "[ISR.GetAdjective] Авиашкола"
 ISR_israeli_air_school_desc:0 "[ISR.GetAdjective] Авиашкола"
 ISR_form_the_techni:0 "Создать техническую службу ВВС"
 ISR_form_the_techni_desc:0 "Адиф лизхоль бахоль ме-ашер лильбош сарбаль кахоль\n\nАд матай"
 ISR_build_trainer_aircrafts:0 "Строить «учебные» самолёты"
 ISR_build_trainer_aircrafts_desc:0 "Строить «учебные» самолёты"
 ISR_bimotor_aircrafts:0 "Двухмоторные самолёты"
 ISR_bimotor_aircrafts_desc:0 "Двухмоторные самолёты"
 ISR_naval_aviation:0 "Береговая противовоздушная оборона"
 ISR_naval_aviation_desc:0 "Береговая противовоздушная оборона"
 ISR_military_research:0 "Военные исследования"
 ISR_military_research_desc:0 "Военные исследования"
 ISR_form_the_mossad:0 "Создать «Моссад»"
 ISR_form_the_mossad_desc:0 "Некоторые сражения можно выиграть без кровопролития. Наша небольшая страна не может позволить себе множество войн, поэтому необходимо вкладываться в альтернативные способы борьбы."
 ISR_world_wide_spy_web:0 "Всемирная шпионская сеть"
 ISR_world_wide_spy_web_desc:0 "Необходимо расширить разведывательные возможности, чтобы своевременно выявлять любые угрозы."
 ISR_israeli_military_industies:0 "[ISR.GetAdjective] Военная промышленность"
 ISR_form_the_israeli_navy:0 "Создать [ISR.GetAdjective]ий флот"
 ISR_form_the_israeli_navy_desc:0 "Выход к морю открывает новые торговые возможности и укрепляет наше присутствие в мире."
 ISR_Small_Navy:0 "Ставка на рейдерский флот"
 ISR_Small_Navy_desc:0 "Открытый океан, где наш флот поджидает ничего не подозревающие конвои, должен стать царством хаоса и дезорганизации."
 ISR_Submarine:0 "Новые современные подводные лодки"
 ISR_Submarine_desc:0 "Основой рейдерского флота должна стать современная подводная лодка."
 ISR_stealth_upgrades:0 "Улучшения скрытности"
 ISR_stealth_upgrades_desc:0 "Удары с последующим исчезновением в открытом море эффективнее, если враг не может обнаружить двигатели подлодки и атаковать её. В этом случае шноркель станет правильным вложением."
 ISR_Sea_Dominance:0 "Ставка на господство на море"
 ISR_Sea_Dominance_desc:0 "Наш флот будет смело действовать на поверхности и уничтожать любую вражескую эскадру на горизонте. Линкоры — будущее морской войны, и мы докажем это миру."
 ISR_Study_Ships:0 "Изучить иностранные проекты кораблей"
 ISR_Study_Ships_desc:0 "Наши порты постоянно посещают иностранные корабли. Несколько «проверок безопасности» наверняка позволят получить больше сведений о новейших моделях."
 ISR_Ships_American:0 "Миссия на американские верфи"
 ISR_Ships_American_desc:0 "После совместных визитов на верфи наши хорошие отношения с США стали ещё теплее."
 ISR_Ships_England:0 "Миссия на британские верфи"
 ISR_Ships_England_desc:0 "Британские корабельные инженеры показали несколько способов повысить качество и сократить сроки строительства лёгких кораблей."
 ISR_Purchase_Ships:0 "Заказать строительство крупных кораблей"
 ISR_Purchase_Ships_desc:0 ""
 ISR_Dockyards:0 "Расширить судостроительные мощности"
 ISR_Dockyards_desc:0 "Для создания полноценного флота необходимо расширить верфи на новых участках побережья."
 ISR_Carrier:0 "Ставка на авианосцы"
 ISR_Carrier_desc:0 "Наше военно-морское конструкторское бюро разрабатывает прототип нового авианосца."
 ISR_Navy_Aircrafts:0 "Модели палубной авиации"
 ISR_Navy_Aircrafts_desc:0 "Авианосец без самолётов — всего лишь металлическая коробка, плавающая по океану. Оснащение его новыми морскими бомбардировщиками потребует времени, но оно того стоит."
 ISR_Battleship:0 "Ставка на линкоры"
 ISR_Battleship_desc:0 "По новым проектам будет построен блестящий линейный крейсер. Пусть враги узнают, что нам подвластны огонь и ярость морей!"
 ISR_Destroyer:0 "Ставка на эсминцы"
 ISR_Destroyer_desc:0 "Тяжёлые корабли особенно уязвимы для торпедных атак. Совершенствование и строительство эсминцев решит эту проблему."
 ISR_Cruisers:0 "Ставка на крейсеры"
 ISR_Cruisers_desc:0 "Тяжёлый крейсер не так силён, как линкор или авианосец, но станет полезным дополнением к морской огневой мощи и заслуживает дополнительного финансирования."
 ISR_Naval_Doctrine:0 "Улучшить морскую доктрину"
 ISR_Naval_Doctrine_desc:0 "Новые корабли бесполезны без правильной тактики. Необходимо немедленно улучшить доктрину!"
 ISR_Generals:0 "Расширить генеральный штаб"
 ISR_Generals_EXPL:0 "Мы §Hрасширим генеральный штаб§! и получим подготовленных §Hгенералов§! и §Hадмиралов§!.\nКоличество и качество командиров зависит от §Hзавершённых§! фокусов."
 ISR_Generals_Other_tt:0 "\nЗавершив этот фокус, вы получите дополнительного командира при выполнении задания. §HРасширение Генерального штаба§! Сосредоточься."
 ISR_Generals_Other_nav_tt:0 "\nЗавершив этот фокус, вы получите дополнительного адмирала при выполнении задания. §HРасширение Генерального штаба§! Сосредоточься."
 ISR_Generals_desc:0 "Вооружённым силам страны недостаёт правильной организации. Создание национального генерального штаба повысит эффективность действующих армий."
 ISR_State_Matter:0 "Сосредоточиться на внутренних делах"
 ISR_State_Matter_desc:0 "Никогда прежде страна не была настолько расколота внутренней борьбой за власть. Создание сильного и единого правительства должно стать главным приоритетом."
 ISR_Collectivist_Ethos:0 "Коллективистский дух"
 ISR_Collectivist_Ethos_desc:0 "Сильное государство должно быть однопартийным. Подавление демократической оппозиции лишь укрепит существующий режим."
 ISR_Organise_Youth:0 "Организовать молодёжь"
 ISR_Organise_Youth_desc:0 "Во всех уголках страны слышны голоса молодых людей, восхваляющих нынешний режим. Их совместная поддержка укрепит веру народа в наше дело. "
 ISR_Com_Generals:0 "Расширить коммунистическое военное командование"
 ISR_Com_Generals_desc:0 "Многие образованные крестьяне и рабочие добровольно вступают в армию, заполняя нехватку офицерских кадров."
 ISR_Collectivist_Propaganda:0 "Рабочая культура"
 ISR_Collectivist_Propaganda_desc:0 "Перераспределённые богатства успешно используются для улучшения работы фабрик и увеличения объёма производства."
 ISR_Conquer:0 "Экспансионистская политика"
 ISR_Conquer_desc:0 "Военная сила нашего режима в сочетании со слабостью и некомпетентностью соседних правительств не оставляет иного выбора, кроме как принести им правильное управление."
 ISR_Intervene:0 "Политика вмешательства"
 ISR_Intervene_desc:0 "Наше дело можно продвигать по всему миру с помощью небольших бригад, которые поддержат подходящие режимы идеологическим обучением, штабным планированием и военной помощью. "
 ISR_Isolated:0 "Изолированное государство"
 ISR_Isolated_desc:0 "Наше правление станет символом политической стабильности и национального процветания. Но тот, кто пренебрежёт нашим нейтралитетом, дорого за это заплатит!"
 ISR_Forced_Conscription:0 "Закон о воинской обязанности"
 ISR_Forced_Conscription_desc:0 "Чтобы выжить в превратившемся в пороховую бочку мире, нам потребуется гораздо больше солдат для защиты наших ценностей."
 ISR_Fanaticism:0 "Идеологический фанатизм"
 ISR_Fanaticism_desc:0 "Нет нужды ограничивать пропаганду. Если люди готовы умереть за наше дело, почему мы должны им мешать?"
 ISR_Liberty_Ethos:0 "Дух свободы"
 ISR_Liberty_Ethos_desc:0 "Новое правительство будет работать эффективнее, если прислушается ко всем группам населения независимо от пола, происхождения или политических взглядов."
 ISR_Strenghten_Monarchy:0 "Автократия"
 ISR_Strenghten_Monarchy_desc:0 "Сильная фигура во главе страны, доносящая идеи правительства до общества, не так уж плоха. Пока сохраняются свобода слова и собраний, ничего дурного не произойдёт."
 ISR_Strenghten_Democracy:0 "Укрепить демократию"
 ISR_Strenghten_Democracy_desc:0 "Доверие и преданность народа нашему делу неоспоримы: новый законодательный период принесёт массам ещё больше либеральных ценностей!"
 ISR_Defence_Act:0 "Закон о национальной безопасности"
 ISR_Defence_Act_desc:0 "Продвижение лояльных полицейских, военных и разведчиков укрепит позиции правительства и защитит законодательный аппарат от иностранного влияния."
 ISR_Brigades:0 "Создать интернациональные бригады"
 ISR_Brigades_desc:0 "Чтобы наши военные возможности воспринимались всерьёз в мировом масштабе, необходимо расширить присутствие добровольцев за рубежом."
 ISR_Military_Build:0 "Оружие защищает нацию"
 ISR_Military_Build_desc:0 "Внешняя безопасность страны связана с численностью армии. Чтобы удовлетворить растущие потребности солдат, необходимо расширить военную промышленность!"
 ISR_Anti_Invasion:0 "Укрепления защищают нацию"
 ISR_Anti_Invasion_desc:0 "Оборона ключевых промышленных и исследовательских центров станет эффективнее, если укрепить наиболее уязвимые районы и увеличить их гарнизоны."
 ISR_Industrial_Boom:0 "Промышленный бум"
 ISR_Industrial_Boom_desc:0 "Дальнейшее промышленное развитие — единственный способ обеспечить благосостояние граждан."
 ISR_Industrial_Expansion:0 "Общенациональное промышленное расширение"
 ISR_Industrial_Expansion_desc:0 "Новая правительственная программа направлена на увеличение числа производственных предприятий по всей стране."
 ISR_Railway_System:0 "Модернизировать дорожную сеть"
 ISR_Railway_System_desc:0 "Растущие потребности промышленности требуют соответствующей инфраструктуры."
 ISR_Communication:0 "Современная электроника"
 ISR_Communication_desc:0 "Огромные объёмы новой информации можно эффективно обрабатывать с помощью вычислительных машин последнего поколения."
 ISR_University:0 "Новый исследовательский комплекс"
 ISR_University_desc:0 "Смелые и дерзкие умы будут активно привлекаться в новые институты, университеты и исследовательские центры."
 ISR_Shared_Research:0 "Совместные исследования"
 ISR_Shared_Research_desc:0 ""
 ISR_knesset_category:0 "The [ISR.GetAdjective] Кнессет"
 open_parliament_gui:0 "Перезапустить Кнессет"
 ISR_seat_tt:0 "[ISR_seat_party]"
 ISR_party_1:0 "§RМАКИ§! — коммунистическая партия, возникшая из Палестинской коммунистической партии времён британского мандата. Выступает за ленинское единое государство в союзе с СССР."
 ISR_party_2:0 "§OХашомер ха-Цаир§! — радикальная социалистическая партия, отличающаяся от «Мапай» Давида Бен-Гуриона стремлением к союзу с Советским Союзом и широкой поддержкой среди сельских еврейских кибуцев. Выступает за более миролюбивую политику в отношении арабского мира и сосуществование."
 ISR_party_3:0 "§tМапай§! — демократическая социалистическая партия, отличающаяся от «Хашомер ха-Цаир» ориентацией на Запад и более широкой поддержкой среди городского пролетариата. Исторически «Мапай» придерживалась прагматичного курса и была готова сотрудничать с британскими властями. «Мапай» и её предшественники господствовали в сионистском движении со времён Второй алии."
 ISR_party_4:0 "§8Новая алия§! — социал-либеральная партия, основанная беженцами Пятой алии из Германии и Австрии. Её главные цели — продолжение алии и технологическое развитие Израиля."
 ISR_party_5:0 "§gОбщие сионисты§! — либерально-капиталистическая партия, изначально основанная самим Теодором Герцлем. В основном опирается на городской средний класс и уделяет большое внимание личным свободам."
 ISR_party_6:0 "§3Хацохар§! — консервативная партия, получившая значительную поддержку благодаря притоку еврейских беженцев из арабского мира. Она отличается от остальных партий тем, что во времена мандата была отделена от ишува и располагала собственным ополчением — «Иргуном». Поэтому её считают партией-изгоем, и широкой общественной поддержки у неё нет."
 ISR_party_7:0 "§2Объединённый религиозный фронт§! — ситуативный союз различных религиозных партий, стремящихся сохранить религиозные законы Израиля."
 ISR_party_8:0 "Пусто — будет заполнено после выборов."
