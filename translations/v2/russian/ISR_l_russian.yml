 ISR_invite_maki:0 "Пригласить §RМАКИ§! в нашу коалицию."
 ISR_invite_maki_desc:0 "§RМАКИ§! — коммунистическая партия, возникшая из Палестинской коммунистической партии времён британского мандата. Выступает за ленинское единое государство в союзе с СССР."
 ISR_invite_hashomer:0 "Пригласить §OХашомер ха-Цаир§! в нашу коалицию."
 ISR_invite_hashomer_desc:0 "§OХашомер ха-Цаир§! — радикальная социалистическая партия, отличающаяся от «Мапай» Давида Бен-Гуриона стремлением к союзу с Советским Союзом и широкой поддержкой среди сельских еврейских кибуцев. Выступает за более миролюбивую политику в отношении арабского мира и сосуществование."
 ISR_invite_mapai:0 "Пригласить §tМапай§! в нашу коалицию."
 ISR_invite_mapai_desc:0 "§tМапай§! — демократическая социалистическая партия, отличающаяся от «Хашомер ха-Цаир» ориентацией на Запад и более широкой поддержкой среди городского пролетариата. Исторически «Мапай» придерживалась прагматичного курса и была готова сотрудничать с британскими властями. «Мапай» и её предшественники господствовали в сионистском движении со времён Второй алии."
 ISR_invite_new_aliyah:0 "Пригласить §8Новую алию§! в нашу коалицию."
 ISR_invite_new_aliyah_desc:0 "§8Новая алия§! — социал-либеральная партия, основанная беженцами Пятой алии из Германии и Австрии. Её главные цели — продолжение алии и технологическое развитие Израиля."
 ISR_invite_general_zionists:0 "Пригласить §gОбщих сионистов§! в нашу коалицию."
 ISR_invite_general_zionists_desc:0 "§gОбщие сионисты§! — либерально-капиталистическая партия, изначально основанная самим Теодором Герцлем. В основном опирается на городской средний класс и уделяет большое внимание личным свободам."
 ISR_invite_hatzohar:0 "Пригласить §3Хацохар§! в нашу коалицию."
 ISR_invite_hatzohar_desc:0 "§3Хацохар§! — консервативная партия, получившая значительную поддержку благодаря притоку еврейских беженцев из арабского мира. Она отличается от остальных партий тем, что во времена мандата была отделена от ишува и располагала собственным ополчением — «Иргуном». Поэтому её считают партией-изгоем, и широкой общественной поддержки у неё нет."
 ISR_invite_urf:0 "Пригласить §2Объединённый религиозный фронт§! в нашу коалицию."
 ISR_invite_urf_desc:0 "§2Объединённый религиозный фронт§! — ситуативный союз различных религиозных партий, стремящихся сохранить религиозные законы Израиля."
