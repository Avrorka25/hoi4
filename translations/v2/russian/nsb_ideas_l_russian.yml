 SOV_national_academy_of_sciences_puppet:0 "Национальная академия наук"
 SOV_national_academy_of_sciences_puppet_desc:1 "Смоделированный после [GetTheUssrAcademyOfSciencesName], [SOV.GetNameDef] В нашей стране создан новый научно-исследовательский институт, призванный стимулировать как наше научное развитие, так и их развитие."
 SOV_rehabilitated_military_ns:0 "$SOV_rehabilitated_military$"
 SOV_rehabilitated_military_ns_desc:1 "Пришло время немного обуздать политических офицеров и дать командирам больше свободы в управлении делами."
 SOV_military_reorganization_ns:0 "Реорганизация армии"
 SOV_military_reorganization_ns_desc:1 "The [GetSovietArmyAdjectiveBasedOnIdeology] Армия проходит огромную реорганизацию, которая требует в какой-то степени срыва существующих формирований в течение, как мы надеемся, короткого периода времени."
 SOV_expanded_exploitation_of_gold_mines:0 "Расширенная эксплуатация золотых рудников"
 SOV_expanded_exploitation_of_gold_mines_desc:1 "The [SOV.GetAdjective] инвестиции в инфраструктуру и промышленную помощь на северных территориях; [ROOT.GetNameDef] Это позволило нам повысить эффективность эксплуатации наших золотых приисков в регионе."
 SOV_ambassador_karim_khakimov:0 "Советский посол Карим Хакимов"
 SOV_ambassador_karim_khakimov_desc:0 "$NSB_soviet_foreign_politics_events.211.desc$"
 SOV_shocked_by_surprise_attack:0 "Потрясенный внезапной атакой"
 SOV_shocked_by_surprise_attack_desc:0 "Неприятельская военная операция против нашей страны под кодовым названием «Операция „Подозрение» застала врасплох наше правительство и военных. Наши силы перегружены, наши коммуникации отрезаны, а вызов вражеских дипломатов с требованием объяснений оказался тщетным. Пока мы пытаемся разобраться в этом хаосе, наши внешние отношения эффективно нейтрализуются."
 SOV_shocked_by_surprise_attack_cant_join_factions_tt:0 "Установлено правило: £trigger_no можно вступать во фракции."
 SOV_soviet_commandos_poum:0 "Советские коммандос"
 SOV_soviet_commandos_poum_desc:0 "Правая оппозиция сталинизму в [SOV.GetNameDef] Он направил в нашу страну высококвалифицированных агентов для проведения спецопераций и обучения наших людей ведению войны."
 SOV_popular_speeches_poum:0 "Популярные речи"
 SOV_popular_speeches_poum_desc:0 "С помощью местных организаций и влиятельных представителей антисталинской оппозиции за рубежом мы проводим большую информационно-агитационную кампанию на подконтрольных нам территориях, чтобы разжечь пламя революции среди масс."
 SOV_agents_in_the_stalinist_command_poum:0 "Агенты сталинского командования"
 SOV_agents_in_the_stalinist_command_poum_desc:0 "Советская правая оппозиция сумела проникнуть в ряд агентов из последней партии военных советников, отправленных в Испанскую Республику. [SOU.GetLeader]. Эти агенты создали сеть информаторов, которые позволяют нам узнать о планах противника до того, как они будут выполнены."
 SOV_organized_wreckers_idea:0 "Врекеры"
 SOV_organized_wreckers_idea_desc:1 "Враги государства вербовали вредителей из рабочего класса, которые разрушают критическую промышленность и затрудняют достижение производственных потребностей."
 SOV_organized_wreckers_idea_tt:0 "Враги могут выполнять диверсионные миссии"
 SOV_arms_purchases_idea:0 "Закупки оружия"
 SOV_arms_purchases_idea_desc:1 "Вооружение советской оппозиции нам немного обойдется, но в долгосрочной перспективе выигрыши более чем компенсируют временную стоимость."
 SOV_covert_military_buildup_idea:0 "Скрытое военное строительство"
 SOV_covert_military_buildup_idea_desc:1 "В настоящее время мы тайно помогаем советской оппозиции, создавая секретные производства оружия и боеприпасов."
 SOV_covert_ukrainian_military_buildup_idea:1 "Скрытая подготовка украинских военных"
 SOV_covert_ukrainian_military_buildup_idea_desc:2 "Используя секретные тренировочные лагеря, мы готовим украинскую милицию для того, чтобы создать восстание против сталинистов."
 SOV_the_fourth_international_idea:0 "Четвертый международный"
 SOV_the_fourth_international_idea_desc:1 "Как истинные лидеры Интернационала мы можем теперь руководить коммунистическим делом в мире."
 SOV_foreign_funds_idea:0 "Иностранные фонды"
 SOV_foreign_funds_idea_desc:1 "Щедрые пожертвования от иностранных лиц и организаций помогают финансировать нашу революцию."
 SOV_support_from_farmers:0 "Поддержка фермеров-самовладельцев"
 SOV_support_from_farmers_desc:1 "Заручившись поддержкой фермеров, мы можем лучше поддержать наши армии."
 SOV_system_decentralization_idea:0 "Системная децентрализация"
 SOV_system_decentralization_idea_desc:0 "Власть отошла от Политбюро в целом и Секретаря в частности, и обратно к самой партии."
 SOV_the_local_soviets_idea:0 "Местные Советы"
 SOV_the_local_soviets_idea_desc:0 "Региональные и местные Советы восстановили свою власть. Это означает, что они могут более легко принимать решения в вопросах, которые являются для них неотложными, ценой некоторого политического контроля со стороны Политбюро."
 SOV_strong_trade_unions_idea:0 "Сильные профсоюзы"
 SOV_strong_trade_unions_idea_desc:0 "Сильные профсоюзы означают, что рабочие могут лучше влиять на производство."
 SOV_the_peoples_revolution_idea:0 "Народная революция"
 SOV_the_peoples_revolution_idea_desc:0 "Революцию должен проводить народ, чтобы она была действительно успешной."
 SOV_puppet_international_of_soviet_republics_idea:0 "Международные советские республики"
 SOV_puppet_international_of_soviet_republics_idea_desc:1 "Быть частью большого целого – это огромная выгода для нашей страны."
 SOV_support_of_the_peasants_idea:0 "Поддержка крестьянского класса"
 SOV_support_of_the_peasants_idea_desc:0 "Сильная поддержка со стороны фермеров по всей стране позволяет набирать и поддерживать более крупные армии."
 SOV_curtailment_collective_farms_idea:0 "Сокращение колхозных ферм"
 SOV_curtailment_collective_farms_idea_desc:0 "Малые и средние фермы гораздо более эффективны с точки зрения производства, чем крупные фермы."
 SOV_administrative_reforms_idea:0 "Административные реформы"
 SOV_administrative_reforms_idea_desc:0 "Старой советской администрации мешала неэффективность отчасти из-за ее размеров, но главным образом из-за слишком строгого аппарата контроля. Немного уменьшив его, мы получили много."
 SOV_local_organizations_idea:0 "Местные организации"
 SOV_local_organizations_idea_desc:0 "Благодаря лучшему включению местных организаций в правительство страны мы получаем доступ ко всем талантам, имеющимся в этой стране."
 SOV_enemies_of_the_people_idea:0 "Враги народа"
 SOV_enemies_of_the_people_idea_desc:0 "Всегда будут те, кто хочет свергнуть народное правительство. Мы должны всегда быть бдительными в отношении угроз, как внутренних, так и внешних."
 SOV_soviet_hegemony_idea:0 "Советская гегемония"
 SOV_soviet_hegemony_idea_desc:0 "Наша система правления оказалась выше всех остальных. Мы должны использовать эту возможность, чтобы распространять наши идеи, просвещая тех, кого угнетают другие системы, а также тех, кому посчастливилось быть включенными в союз."
 SOV_fascist_womens_movement_idea:0 "Фашистское движение женщин"
 SOV_fascist_womens_movement_idea_desc:1 "В тяжелом положении националистического движения стоит [ROOT.GetAdjective] женщина. Матери, жены и дочери наших отважных воинов организовали и готовы поддержать борьбу за величие."
 SOV_the_true_tsars_idea:0 "Истинные цари"
 SOV_the_true_tsars_idea_desc:1 "Царь является законным лидером [ROOT.GetNameDef]. Сплочение за царем, а не другая идеология, позволяет привлечь больше сторонников к нашему делу."
