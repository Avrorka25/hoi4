 SOV_tupolev_design_bureau_dissolved_flag:0 "$SOV_mig_design_bureau_dissolved_flag$"
 SOV_yakovlev_design_bureau_dissolved_flag:0 "$SOV_mig_design_bureau_dissolved_flag$"
 SOV_anti_capitalist_campaign_generic:0 "Антикапиталистическая кампания"
 SOV_anti_capitalist_campaign_generic_desc:1 "Капиталистам нельзя доверять. Буржуазия, имея выбор, всегда выбирает угнетение пролетариата. Мы должны быть готовы к тому, чтобы дать им бой."
 SOV_anti_fascist_campaign_generic:0 "Антифашистская кампания"
 SOV_anti_fascist_campaign_generic_desc:1 "Не может быть мирного сосуществования с фашистами. Мы должны готовиться к неизбежной конфронтации."
 SOV_young_builders_of_communism:0 "Молодые строители коммунизма"
 SOV_young_builders_of_communism_desc:1 "Мы не строим социализм для взрослых, мы строим его для детей и еще не родившихся поколений. Их нужно научить совершенствовать и развивать наши достижения, чтобы они могли завершить начатую нами работу."
 SOV_broken_peace_dreams_attacker:0 "Разбитые мирные мечты"
 SOV_broken_peace_dreams_attacker_desc:1 "Эта новая война, в которой мы оказались не так давно после того, как мы публично пообещали проводить политику мира, вызывает нестабильность и недоверие среди населения."
