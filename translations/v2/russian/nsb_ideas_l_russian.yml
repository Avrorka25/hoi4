l_russian:
 independent_air_force_spirit:0 "Независимые ВВС"
 independent_air_force_spirit_desc:1 "Военно-воздушные силы являются независимым подразделением и столь же важны, как армия или военно-морской флот."
 industrial_destruction_spirit:0 "Промышленное разрушение"
 industrial_destruction_spirit_desc:1 "1000 бомбардировщиков могут изменить ход войны одним ударом.\n\n§GЭтот дух доступен благодаря нашим доктринам.§!"
 dive_bombing_spirit:0 "Бомбардировка дайвов"
 dive_bombing_spirit_desc:1 "Поцарапай одну плоскую вершину.\n\n§GЭтот дух доступен благодаря нашим доктринам.§!"
 material_destruction_spirit:0 "Уничтожение материалов"
 material_destruction_spirit_desc:2 "Уничтожение техники и срыв линий связи противника обеспечат победу быстрее, чем любое число причиненных жертв.\n\n§GЭтот дух доступен благодаря нашим доктринам.§!"
 air_modernizers_spirit:0 "Модернизаторы воздуха"
 air_modernizers_spirit_desc:1 "Не так давно Fokker E.III был лучшим бойцом в мире. Все быстро меняется."
 industry_liasons_spirit:0 "Промышленное сотрудничество"
 industry_liasons_spirit_desc:1 "Только беспроблемное сотрудничество авиационной промышленности, армии и государства обеспечит высочайшее качество."
 air_crew_surveys_spirit:0 "Обследование экипажей воздушных судов"
 air_crew_surveys_spirit_desc:1 "В конце концов, именно они используют оборудование, так почему бы не спросить их?"
 maritime_patrol_spirit:0 "Морская патрульная авиация"
 maritime_patrol_spirit_desc:0 "Он плавает, мы можем его найти."
 long_range_patrol_spirit:0 "Патруль дальнего действия"
 long_range_patrol_spirit_desc:0 "Доминирование в воздушном пространстве вне дома."
 efficient_ground_crews_spirit:0 "Эффективные наземные экипажи Spirit"
 efficient_ground_crews_spirit_desc:0 "Пилоты и все такое, но что действительно важно, так это как можно быстрее поднять самолеты в воздух."
 effective_training_programs_spirit:0 "Эффективные учебные программы"
 effective_training_programs_spirit_desc:0 "Ничто не сравнится с хорошим образованием."
 branch_independence_spirit:0 "Ветвь духа независимости"
 branch_independence_spirit_desc:0 "Ни один военный или морской парень не может заказать нас. Мы делаем все по-своему."
 air_theory_spirit:0 "Воздушная теория духа"
 air_theory_spirit_desc:0 "Есть наука о воздушном бою."
 subservience_to_army_spirit:0 "Подчинение армии"
 subservience_to_army_spirit_desc:0 "Это простое описание работы, бомба там, где генералы говорят вам бомбить."
 subservience_to_navy_spirit:0 "Подчинение флоту"
 subservience_to_navy_spirit_desc:0 "Самолёты действительно полезны лишь как средство поддержки флота и разведки."
 no_focus_on_training_spirit:0 "Нет фокуса на тренировках"
 no_focus_on_training_spirit_desc:0 "Практика? Зачем нам это делать? Это легко! Также; экономит топливо."
 disorganized_ground_crews_spirit:0 "Дезорганизованные наземные экипажи"
 disorganized_ground_crews_spirit_desc:0 "Наземная команда? Кто они такие? Почему они должны иметь значение?"
 conflicting_branches_spirit:0 "Противоречивые ветви"
 conflicting_branches_spirit_desc:0 "Но они сказали..."
 elite_fighter_pilots_spirit:0 "Элитные лётчики-истребители"
 elite_fighter_pilots_spirit_desc:0 "Запомните, парни: за второе место очков не дают."
 long_range_navigation_spirit:0 "Навигация на дальних дистанциях"
 long_range_navigation_spirit_desc:0 "Они могут бегать, но не могут спрятаться."
 dogfighting_training_spirit:0 "Тренировка драки собак"
 dogfighting_training_spirit_desc:0 "Это не поворот Иммельмана, это полупетля."
 expert_marksmen_spirit:0 "Эксперт Marksmen"
 expert_marksmen_spirit_desc:0 "Все дело в том, чтобы знать, куда прицелиться и когда нажать на курок."
 battlefield_air_interdiction_spirit:0 "Боевой аэродром Air Interdiction"
 battlefield_air_interdiction_spirit_desc:0 "Тесное сотрудничество между воздушными и сухопутными войсками."
 cag_night_fighting_spirit:0 "Ночные бои CAG Night Fighting"
 cag_night_fighting_spirit_desc:0 "Думаешь, просто летать в темноте тяжело? Попробуйте приземлиться на авианосец посреди ночи!"
 veteran_air_instructors_spirit:0 "Ветеран авиационных инструкторов"
 veteran_air_instructors_spirit_desc:0 "Пусть лучше тренируют остальных."
 steel_wings_steel_hearts_spirit:0 "Стальные крылья, стальные сердца"
 steel_wings_steel_hearts_spirit_desc:1 "Требуется определенное мужество, чтобы вести войну на высоте 10 000 футов.\n\n§GЭтот дух доступен благодаря нашей идеологии.§!"
 home_defence_spirit:0 "Домашняя оборона"
 home_defence_spirit_desc:0 "Мы будем защищать наш остров, несмотря ни на что."
 centralized_control_spirit:0 "Централизованный контроль"
 centralized_control_spirit_desc:1 "Эффективное управление ресурсами гарантирует, что самолеты достигают мест, где они больше всего нужны."
 air_power_projection_spirit:0 "Проектирование воздушной энергии"
 air_power_projection_spirit_desc:0 "Особая дерзость необходима при борьбе вдали от дома."
 massed_strike_spirit:0 "Массовая забастовка"
 massed_strike_spirit_desc:1 "Разрушение сухопутных войск противника — лучший способ победить их.\n\n§GЭтот дух доступен благодаря нашим доктринам.§!"
 continuous_strike_spirit:0 "Непрерывная забастовка"
 continuous_strike_spirit_desc:1 "Уничтожение ключевого вражеского оборудования имеет жизненно важное значение.\n\n§GЭтот дух доступен благодаря нашим доктринам.§!"
 strategic_strike_spirit:0 "Полное опустошение"
 strategic_strike_spirit_desc:1 "Массивные стратегические удары в сердце ядра противника сломают их способность к борьбе.\n\n§GЭтот дух доступен благодаря нашим доктринам.§!"
 duelling_obsession_spirit:0 "Дуэльная одержимость"
 duelling_obsession_spirit_desc:0 "Идти один на один — единственный благородный и благородный способ борьбы в воздухе."
 lax_safety_regulations_spirit:0 "Правила безопасности Lax"
 lax_safety_regulations_spirit_desc:0 "Я имею в виду, никто не следует инструкциям в любом случае, так в чем смысл?"
 officers_clique_spirit:0 "Офицеры Clique"
 officers_clique_spirit_desc:0 "Они могут быть пилотами, но они все еще просто частные лица, верно?"
 not_worth_the_risk_spirit:0 "Не стоит рисковать"
 not_worth_the_risk_spirit_desc:0 "Самолеты действительно дорогие, как вы знаете."
 merchant_mariners_spirit:0 "Торговые моряки"
 merchant_mariners_spirit_desc:0 "Мореплавание для нас вторая натура."
 naval_wargames_spirit:0 "Морские игры Wargames"
 naval_wargames_spirit_desc:0 "Теоретическая тактическая подготовка спасает жизни и топливо."
 instilled_aggression_spirit:0 "Привитая агрессия"
 instilled_aggression_spirit_desc:0 "Атака, атака, атака!"
 instilled_aggression_spirit_tt:0 "Адмиралы: §G40% шанс§! получить §Y+1 к атаке§! при повышении уровня."
 calculated_restraint_spirit:0 "Рассчитанная сдержанность"
 calculated_restraint_spirit_desc:0 "После тщательного рассмотрения..."
 calculated_restraint_spirit_tt:0 "Адмиралы: §G40% шанс§! получить §Y+1 к защите§! при повышении уровня."
 signals_training_spirit:0 "Тренировка сигналов"
 signals_training_spirit_desc:0 "Чтобы каждый человек выполнял свой долг, он должен знать, в чем состоит его долг."
 signals_training_spirit_tt:0 "Адмиралы: §G40% шанс§! получить §Y+1 к маневрированию и координации§! при повышении уровня."
 fleet_in_being_academy_spirit:0 "Большой флот"
 fleet_in_being_academy_spirit_desc:1 "Крупномасштабная тактическая подготовка.\n\n§GЭтот дух доступен благодаря нашим доктринам.§!"
 fleet_in_being_academy_spirit_tt:0 "Новые адмиралы: §G50% шанс§! Начнем с §Y\"Ганнерный эксперт\"§! Черта."
 merchant_mariners_spirit_tt:1 "Новые адмиралы: §G50% шанс§! Начнем с §Y«Военно-морская линия»§! черта\"."
 trade_interdiction_academy_spirit:0 "Конвой Warfare"
 trade_interdiction_academy_spirit_desc:1 "Торговые конвои требуют особой тактики и подготовки.\n\n§GЭтот дух доступен благодаря нашим доктринам.§!"
 trade_interdiction_academy_spirit_tt:0 "Новые адмиралы: §G50% шанс§! Начнем с §Y\"Морской волк\"§! или §Y«Блокадный бегун»§! черты."
 base_strike_academy_spirit:0 "Интегрированная воздушная рука"
 base_strike_academy_spirit_desc:1 "Жизненно важно тесное сотрудничество между воздушными и морскими подразделениями!\n\n§GЭтот дух доступен благодаря нашим доктринам.§!"
 base_strike_academy_spirit_tt:0 "Новые адмиралы: §G50% шанс§! Начнем с §Y«Авиационный Энтузиаст»§! Черта."
 damage_control_training_spirit:0 "Контроль повреждений"
 damage_control_training_spirit_desc:0 "Хорошо подготовленные экипажи означают меньше жертв на нашей стороне."
 damage_control_training_spirit_tt:0 "Новые адмиралы: §G50% шанс§! Начнем с §Y\"Главный инженер\"§! Черта."
 best_of_the_best_naval_academy_spirit:0 "Лучший из лучших"
 best_of_the_best_naval_academy_spirit_desc:1 "Жесткая конкуренция и строгий отбор породили капитанов, которых мы хотим.\n\n§GЭтот дух доступен благодаря нашей идеологии.§!"
 best_of_the_best_naval_academy_spirit_tt:0 "Новые адмиралы: начинайте без каких-либо черт личности."
 naval_academy_scholarships_spirit:0 "Стипендии Академии"
 naval_academy_scholarships_spirit_desc:0 "Все дело в том, чтобы дать нужным людям шанс сиять."
 naval_academy_scholarships_spirit_tt:0 "Новые адмиралы: начинайте без каких-либо черт личности."
 underfunded_naval_academy_spirit:0 "Недофинансированная Военно-морская академия"
 underfunded_naval_academy_spirit_desc:0 "По крайней мере, у нас есть один..."
 traditionalism_naval_academy_spirit:0 "Традиционализм"
 traditionalism_naval_academy_spirit_desc:0 "Так мы всегда это делали. Зачем менять сейчас?"
 traditionalism_naval_academy_spirit_tt:0 "Повышенная вероятность того, что новые адмиралы будут §Y\"Старая гвардия\"§! Черта.\n§G50% шанс§! Новые адмиралы получают дополнительное очко в двух категориях."
 political_appointments_naval_academy_spirit:0 "Политические назначения"
 political_appointments_naval_academy_spirit_desc:0 "Важно, чтобы в нашей академии преподавали только учителя с правильным отношением."
 nepotism_naval_academy_spirit:0 "кумовство"
 nepotism_naval_academy_spirit_desc:0 "Мой отец был учителем в академии, как и его отец до него, и его старший брат..."
 nepotism_naval_academy_spirit_tt:0 "Уменьшение шансов на то, что новые адмиралы приобретут благоприятные черты личности."
 jeune_ecole_spirit:0 "Жон Эколь"
 jeune_ecole_spirit_desc:0 "Разрушители - это будущее!"
 big_gun_club_spirit:0 "Большой Оружейный Клуб"
 big_gun_club_spirit_desc:0 "Линкоры доминируют не только в море, но и в политике."
 aviation_enthusiasts_spirit:0 "Авиационные Энтузиасты"
 aviation_enthusiasts_spirit_desc:0 "Будущее военно-морских боев будет в воздухе."
 cruiser_warfare_spirit:0 "Крейсер Warfare"
 cruiser_warfare_spirit_desc:0 "Крейсеры — лучший тип корабля, они могут выполнять любую работу."
 wolfpacks_spirit:0 "Вольфпакс"
 wolfpacks_spirit_desc:0 "Тихие охотники на море."
 flexible_contracts_spirit:0 "Гибкие контракты"
 flexible_contracts_spirit_desc:0 "Лучший контракт — тот, который можно расторгнуть."
 integrated_designers_spirit:0 "Интегрированные дизайнеры"
 integrated_designers_spirit_desc:0 "Постоянное обновление наших проектов является приоритетом."
 naval_reform_spirit:0 "Реформа флота"
 naval_reform_spirit_desc:0 "Война всегда меняется."
 naval_refit_yards_spirit:0 "Военно-морские ремонтные ярды"
 naval_refit_yards_spirit_desc:0 "Минимизируя время на скамье подсудимых, максимальное время, в течение которого судно может находиться в море."
 naval_modernism_spirit:0 "модернизм"
 naval_modernism_spirit_desc:0 "Будущее уже на нас."
 fleet_in_being_navy_spirit:0 "Глобальное присутствие"
 fleet_in_being_navy_spirit_desc:1 "Наши корабли будут патрулировать океаны по всему миру.\n\n§GЭтот дух доступен благодаря нашим доктринам.§!"
 trade_interdiction_navy_spirit:1 "Приоритет подводного флота"
 trade_interdiction_navy_spirit_desc:1 "Без поставок страна не может вести войну.\n\n§GЭтот дух доступен благодаря нашим доктринам.§!"
 base_strike_navy_spirit:1 "Мобильные силы"
 base_strike_navy_spirit_desc:1 "Уметь наносить удары в любом месте, в любое время.\n\n§GЭтот дух доступен благодаря нашим доктринам.§!"
 landlocked_spirit:0 "не имеющий выхода к морю"
 landlocked_spirit_desc:0 "Без выхода к морю трудно построить военно-морскую традицию."
 political_connections_navy_spirit:0 "Политические связи"
 political_connections_navy_spirit_desc:0 "Мое командование не имеет ничего общего с тем, что мой отец был министром финансов!"
 overbearing_army_spirit:0 "Сверхдержавная армия"
 overbearing_army_spirit_desc:0 "Военно-морской флот — это лишь поддержка армии."
 bureau_of_ordnance_spirit:0 "Бюро боеприпасов"
 bureau_of_ordnance_spirit_desc:1 "Бюро боеприпасов влияет на любые конструкции кораблей.\n\n§GЭтот дух доступен благодаря нашим удивительным торпедам.§!"
 only_big_guns_spirit:0 "Только большие пушки"
 only_big_guns_spirit_desc:0 "Боевые корабли являются бесспорными королевами открытого моря."
 close_combat_navy_spirit:0 "Ближний бой"
 close_combat_navy_spirit_desc:0 "Сближение – это ключ к победе."
 night_fighting_spirit:0 "Ночные бои"
 night_fighting_spirit_desc:0 "Привычка драться в темноте дает очевидные преимущества."
 surprise_attacks_spirit:1 "Сюрпризы атак"
 surprise_attacks_spirit_desc:1 "Ударить врага до того, как он осознает угрозу.\n\n§GЭтот дух доступен благодаря нашим доктринам.§!"
 efficient_communications_spirit:0 "Эффективные коммуникации"
 efficient_communications_spirit_desc:0 "Коммуникация, коммуникация и коммуникация."
 discrete_valor_spirit:0 "Дискретная доблесть"
 discrete_valor_spirit_desc:0 "Выжить, чтобы драться в другой день."
 surface_raiders_spirit:1 "Надводные рейдеры"
 surface_raiders_spirit_desc:1 "Зачем просто позволять субмаринам совершать все набеги?\n\n§GЭтот дух доступен благодаря нашим доктринам.§!"
 decisive_battle_spirit:0 "Решительная битва"
 decisive_battle_spirit_desc:1 "Вступая в бой, вы всегда будете проявлять инициативу.\n\n§GЭтот дух доступен благодаря нашим доктринам.§!"
 inclimate_weather_experience_spirit:1 "Погодный опыт Inclement"
 inclimate_weather_experience_spirit_desc:0 "Нет такой вещи, как плохая погода..."
 brave_commanders_spirit:0 "Отважные командиры"
 brave_commanders_spirit_desc:0 "Черт возьми, торпеды, полная скорость впереди!"
 brown_water_spirit:0 "Литоральные бои"
 brown_water_spirit_desc:0 "Навигация и боевые действия на архипелаге требуют особого набора навыков."
 green_water_spirit:0 "Зеленая вода"
 green_water_spirit_desc:0 "Близость к берегу - самая безопасная ставка."
 blue_water_spirit:0 "Голубая вода"
 blue_water_spirit_desc:0 "Глубокий океан – это настоящий дом моряка."
 poor_damage_control_training_spirit:0 "Обучение контролю за ущербом"
 poor_damage_control_training_spirit_desc:0 "Кому это нужно в любом случае тренировать? Мы должны бить врага, а не наоборот."
 limited_sea_time_spirit:0 "Ограниченное морское время"
 limited_sea_time_spirit_desc:0 "Сохранение флота в море делает его более дорогим."
 cult_of_the_signal_flag_spirit:0 "Культ сигнального флага"
 cult_of_the_signal_flag_spirit_desc:0 "Пока все следуют приказам, никто не может быть обвинен."
 overbearing_admirality_spirit:0 "Покорное адмиралтейство"
 overbearing_admirality_spirit_desc:0 "Всегда обращайтесь в Адмиралтейство."
 bold_attack_spirit:0 "Смелая атака"
 bold_attack_spirit_desc:1 "Как говорится: «Сильное нападение — лучшая защита»."
 tenacious_defense_spirit:0 "Настойчивая оборона"
 tenacious_defense_spirit_desc:0 "Они не пройдут!"
 meticulous_preparation_spirit:0 "Тщательная подготовка"
 meticulous_preparation_spirit_desc:0 "Война — это хаос, но к хаосу можно быть готовым."
 best_of_the_best_spirit:0 "Лучший из лучших"
 best_of_the_best_spirit_desc:0 "Немногие люди имеют то, что нужно, чтобы привести солдат в бой. Меньше всего нужно, чтобы выиграть эту битву."
 academy_scholarships_spirit:0 "Стипендии Академии"
 academy_scholarships_spirit_desc:1 "Никто не должен быть лишен возможности служить своей стране из-за простого отсутствия денег.\n\n§GЭтот дух доступен благодаря нашей идеологии.§!"
 political_loyalty_spirit:0 "Политическая лояльность"
 political_loyalty_spirit_desc:1 "Ненадежная армия представляет угрозу для государства, которое она призвана защищать.\n\n§GЭтот дух доступен благодаря нашей идеологии.§!"
 political_loyalty_spirit_tt:1 "Новые офицеры: начинают с чертой §Y«Политические связи»§! или §Y«Медийная личность»§!.\nСнижает вероятность событий §Y«Забастовки»§!, §Y«Мятеж»§! и §Y«Уклонение от призыва»§!."
 inventive_leadership_spirit:0 "Изобретательное лидерство"
 inventive_leadership_spirit_desc:0 "Предсказуемый генерал — это побежденный генерал."
 inventive_leadership_spirit_tt:2 "Новые офицеры: §G50% шанс§! Начнем с §Y\"Коммандо\"§!, §Y\"Трикстер\"§!или §Y\"Захватчик\"§! черты."
 mobile_warfare_academy_spirit:0 "Обнимайте будущее"
 mobile_warfare_academy_spirit_desc:1 "Везде, где будут вестись будущие бои, решающую роль будут играть бронетанковые войска.\n\n§GЭтот дух доступен благодаря нашим доктринам.§!"
 mobile_warfare_academy_spirit_tt:1 "Новые офицеры: §G50% шанс§! начать с чертой §Y«Офицер танковых войск»§!."
 superior_firepower_academy_spirit:1 "Инженерные школы"
 superior_firepower_academy_spirit_desc:2 "Есть много науки, вовлеченной в выкапывание надлежащего канавы.\n\n§GЭтот дух доступен благодаря нашим доктринам.§!"
 superior_firepower_academy_spirit_tt:1 "§G50% шанс§!, что новый офицер появится с чертой §Y«Инженерный офицер»§!."
 theatre_training_spirit:0 "Театральная подготовка"
 theatre_training_spirit_desc:1 "Некоторые офицеры могут быть «туземцами», но туземцы очень хорошо сражаются на выбранной местности.\n\n§GЭтот дух доступен благодаря нашим доктринам.§!"
 theatre_training_academy_spirit_tt:0 "§G50% шанс§! Новые офицеры создаются вместе с §Y«Блестящий стратег»§! или §Y«Негибкий стратег»§! Черта."
 mass_assault_academy_spirit:0 "Царица полей"
 mass_assault_academy_spirit_desc:1 "Пехота — королева битвы, и королева идет туда, куда ей угодно.\n\n§GЭтот дух доступен благодаря нашим доктринам.§!"
 underfunded_academy_spirit:0 "Недофинансируемая Академия"
 underfunded_academy_spirit_desc:0 "Есть вещи, на которые лучше тратить деньги, чем учить людей убивать друг друга более эффективно."
 nepotism_academy_spirit:0 "кумовство"
 nepotism_academy_spirit_desc:0 "Мой дядя руководит армией, и он говорит, что я могу получить свое командование дивизией, когда захочу!"
 professional_officer_corps_spirit:0 "Профессиональный офицерский корпус"
 professional_officer_corps_spirit_desc:0 "Мы профессионалы, а война - наша профессия."
 elevated_engineering_corps_spirit:0 "Возвышенный инженерный корпус"
 elevated_engineering_corps_spirit_desc:0 "Лучший судья способностей и характера человека — дать ему лопату и день, чтобы сделать с ней что-то полезное."
 proper_heritage_spirit:0 "Правильное наследие"
 proper_heritage_spirit_desc:0 "Хороший генерал может быть обучен, но великий генерал должен быть воспитан. В каком-то смысле, как лошади."
 quick_improvisation_spirit:0 "Быстрая импровизация"
 quick_improvisation_spirit_desc:0 "Поймите быстрее, подумайте быстрее, действуйте быстрее — вот ключ к победе."
 adaptable_modernizers_spirit:0 "Адаптивные модернизаторы"
 adaptable_modernizers_spirit_desc:0 "Учение, которое нельзя изменить, можно назвать догмой."
 relief_of_command_spirit:0 "Облегчение командования"
 relief_of_command_spirit_desc:1 "Армия не существует для того, чтобы накормить эго своих генералов.\n\n§GЭтот дух доступен благодаря нашей идеологии.§!"
 ideological_loyalty_spirit:0 "Идеологическая преданность"
 ideological_loyalty_spirit_desc:1 "От того, кто не имеет правильной идеологии, нельзя ожидать достижения правильного результата в бою.\n\n§GЭтот дух доступен благодаря нашей идеологии.§!"
 state_serves_the_military_spirit:0 "Государство служит военным"
 state_serves_the_military_spirit_desc:2 "Цель государства — вести войну против других государств. Все остальное либо в поддержку этого, либо бесполезное отвлечение.\n\n§GЭтот дух доступен благодаря нашей идеологии.§!"
 mobile_warfare_army_spirit:0 "Двигатель моторизации"
 mobile_warfare_army_spirit_desc:1 "Стреляй быстрее, иди дальше, побеждай сильнее!\n\n§GЭтот дух доступен благодаря нашим доктринам.§!"
 superior_firepower_army_spirit:0 "Подавляющая огневая мощь"
 superior_firepower_army_spirit_desc:1 "Если артиллерия не побеждает в сражениях, вы недостаточно ее используете.\n\n§GЭтот дух доступен благодаря нашим доктринам.§!"
 grand_battleplan_army_spirit:0 "Скриншоты из The Spear"
 grand_battleplan_army_spirit_desc:1 "Кинжал ночью часто более эффективен, чем длинный меч днем.\n\n§GЭтот дух доступен благодаря нашим доктринам.§!"
 mass_assault_army_spirit:0 "Сила Байонета"
 mass_assault_army_spirit_desc:1 "Когда все сказано и сделано, танк или самолет не могут удержать участок земли.\n\n§GЭтот дух доступен благодаря нашим доктринам.§!"
 political_connections_spirit:0 "Политические связи"
 political_connections_spirit_desc:0 "Посмотрим, что скажет об этом министр!"
 entrenched_old_guard_spirit:0 "Старая гвардейская крепость"
 entrenched_old_guard_spirit_desc:0 "Кто этот идиот, и почему он опять говорит об этой \"самолетной\" ерунде?"
 doctrinal_orthodoxy_spirit:0 "Доктринальное православие"
 doctrinal_orthodoxy_spirit_desc:0 "Это не то, как мы делали это раньше."
 excessive_parade_drill_spirit:0 "Чрезмерная парадная буря"
 excessive_parade_drill_spirit_desc:0 "Основная цель солдата - хорошо выглядеть на параде."
 static_warfare_spirit:0 "Позиционная война"
 static_warfare_spirit_desc:0 "Нет такой вещи, как слишком много траншейной работы. Есть только «недостаточно» и «едва адекватно»."
 flexible_organization_spirit:0 "Гибкая организация"
 flexible_organization_spirit_desc:0 "Важно, чтобы работа была выполнена, а не выполнялись приказы на письмо."
 aggressive_reconnaisance_spirit:0 "Агрессивная разведка"
 aggressive_reconnaisance_spirit_desc:0 "Если вы хотите знать, что делает другая сторона, идите туда и спросите их прямо!"
 reserve_officers_spirit:0 "Офицеры запаса"
 reserve_officers_spirit_desc:0 "Не каждый должен делать свою профессию военным. Но в военное время они могут служить."
 upbeat_command_spirit:0 "Командование Upbeat"
 upbeat_command_spirit_desc:0 "Доброе слово или общая шутка с обычным солдатом часто делают больше для общего успеха подразделения, чем дополнительная артиллерийская батарея."
 victory_or_death_spirit:0 "Победа или смерть"
 victory_or_death_spirit_desc:0 "Лучше умереть со славой, чем жить в позоре поражения."
 maneuver_warfare_spirit:0 "Манёвренная война"
 maneuver_warfare_spirit_desc:1 "Правильная, цивилизованная война больше похожа на шахматный матч, чем на драку. Зачем сражаться с врагом, которым можно маневрировать?\n\n§GЭтот дух доступен благодаря нашим доктринам.§!"
 smoke_and_fire_spirit:0 "Дым и огонь"
 smoke_and_fire_spirit_desc:1 "Катающийся шквал снарядов удивительно эффективен для предотвращения отстрела противника.\n\n§GЭтот дух доступен благодаря нашим доктринам.§!"
 logistical_focus_spirit:0 "Логистический фокус"
 logistical_focus_spirit_desc:1 "Войска могут съедать свои пояса, но танки должны иметь газ.\n\n§GЭтот дух доступен благодаря нашим доктринам.§!"
 operational_reserve_spirit:0 "Оперативные резервы"
 operational_reserve_spirit_desc:1 "Всегда что-нибудь в рукаве. Всегда.\n\n§GЭтот дух доступен благодаря нашим доктринам.§!"
 intercommand_rivalries_spirit:0 "Межкомандные соперничества"
 intercommand_rivalries_spirit_desc:0 "Наиболее важные битвы ведутся в комитетах по ассигнованиям, и именно там рождаются самые уродливые обиды."
 disregard_for_the_common_soldier_spirit:0 "Неуважение к общему солдату"
 disregard_for_the_common_soldier_spirit_desc:0 "Средний солдат — самое глупое, уродливое, ленивое существо, которое может поместиться в форме."
 constraining_hierarchy_spirit:0 "Ограничение иерархии"
 constraining_hierarchy_spirit_desc:0 "Если вы не обращаете пристального внимания на то, где находятся ваши подчиненные, кто-то может в конечном итоге украсть их."
 disdain_for_the_digging_spirit:0 "Презрение к копанию"
 disdain_for_the_digging_spirit_desc:0 "Вся эта грязь попадает на униформу и тогда войскам придется потратить много времени на их уборку."
 traditionalism_academy_spirit:0 "Традиционализм"
 traditionalism_academy_spirit_desc:0 "Война. Война никогда не меняется."
 expeditionary_spirit:0 "Экспедиционная война"
 expeditionary_spirit_desc:0 "Победить в войне - значит отправиться в чужую страну и разбить кучу вещей."
 penny_pinching_spirit:0 "Пенни-Пинчинг"
 penny_pinching_spirit_desc:0 "Ты хоть представляешь, сколько стоит выстрелить этой пулей? И вы хотите сделать это для «обучения»?"
 bold_attack_spirit_tt:2 "Офицеры: §G50% шанс§! из §Y+1 атака§! на уровне выше."
