 SOV_soviet_japanese_reckoning:0 "Советско-японский расчёт"
 SOV_soviet_japanese_reckoning_desc:1 "Пришло время перенести войну в [JAP.GetAdjective] И отомстить за многие ошибки, которые они причинили нам."
 SOV_soviet_japanese_anti_usa_pact:0 "Советско-японский антиамериканский пакт"
 SOV_soviet_japanese_anti_usa_pact_desc:1 "Вместе мы удалим [USA.GetNameDef] С мировой сцены!"
