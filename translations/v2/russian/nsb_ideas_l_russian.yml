 BALTIC_recent_skirmish:0 "Недавняя стычка"
 BALTIC_recent_skirmish_desc:0 "Эта страна недавно пережила стычку с местным военизированным сопротивлением."
 BALTIC_equipment_siphon:0 "Оборудование Siphon"
 BALTIC_equipment_siphon_desc:0 "Недавняя подпольная преступная деятельность привела к тому, что страна потеряла значительную часть своей производственной базы."
 BALTIC_international_brigades:0 "Международные бригады"
 LIT_agrarian_society:0 "Аграрное общество"
 LIT_agrarian_society_desc:0 "Экономика Литвы в основном вращается вокруг сельскохозяйственной промышленности. Экспорт продовольственных товаров в соседние страны - это то, как Литва получает большую часть своих доходов."
 LIT_invested_in_farms:0 "Аграрное общество"
 LIT_invested_in_farms_desc:0 "При правильном инвестировании, в основном аграрная экономика Литвы обратилась к преимуществам государства, с литовскими культурами, подпитывающими военную экономику и надлежащую инфраструктуру, облегчающую быструю мобилизацию разрозненных фермерских общин по всей стране."
 LIT_invested_in_farms_1:0 "Аграрное общество"
 LIT_invested_in_farms_1_desc:0 "При правильном инвестировании, в основном аграрная экономика Литвы обратилась к преимуществам государства, с литовскими культурами, подпитывающими военную экономику и надлежащую инфраструктуру, облегчающую быструю мобилизацию разрозненных фермерских общин по всей стране."
 LIT_purge_resistance_idea:0 "Очищенное народное сопротивление"
