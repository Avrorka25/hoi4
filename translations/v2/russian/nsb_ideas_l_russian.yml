 SOV_comecon_sov_default:0 "КОМЕКОН"
 SOV_comecon_sov_default_desc:0 "Принимаются меры, принимаемые [GetComeconName]."
 SOV_common_economic_space_sov_default:0 "Единое экономическое пространство"
 SOV_common_economic_space_sov_default_desc:0 "$SOV_comecon_sov_default_desc$"
 SOV_soviet_german_trade_agreement:0 "Советско-германское торговое соглашение"
 SOV_soviet_german_trade_agreement_desc:1 "Как было согласовано в нашем торговом договоре с [SOU.GetNameDef]Они отправляют нам сырье, такое как зерно, хлопок, нефть, металлические руды и каучук."
 SOV_soviet_imports:0 "Советский импорт"
 SOV_development_of_eastern_allies_tt:0 "Этот национальный дух будет устранен по завершении фокуса.§YПомощь в целях развития для восточных союзников§!'"
 SOV_face_western_fascism_ns_tt:0 "Премия за атаку против §YКрупнейшие фашистские страны Европы§!: §G+10.0%§!Защитный бонус против §YКрупнейшие фашистские страны Европы§!: §G10.0%§!."
 SOV_liberation_of_the_european_proletariat_ns_tt:0 "Премия за атаку против §YОсновные демократии в Европе§!: §G+10.0%§!Защитный бонус против §YОсновные демократии в Европе§!: §G10.0%§!."
 SOV_military_reorganization_ns_removal_tt:0 "Этот национальный дух будет устранен по завершении фокуса.§Y$SOV_military_reorganization$§!'"
 SOV_the_politburo_ns_good_tt:0 "Можно вручную сменить руководителя НКВД §O(Скоро)§!"
 SOV_industrial_concern_upgrade_tt:0 "\nЗавершение фокусировки '§Y$SOV_national_specialists$§!Мы будем совершенствовать этого дизайнера."
 SOV_gosproyektstroy_1:0 "Госпроектстрой"
 SOV_gosproyektstroy_1_tt:0 "Этот дизайнер может быть обновлен, чтобы добавить новые бонусы и улучшить существующие."
 SOV_mytishchy_machine_building_plant:0 "Митищинский машиностроительный завод"
 SOV_kirov:0 "Киров"
 SOV_sevastopol_marine_plant:0 "Севастопольский морской завод"
 SOV_black_sea_shipyard:0 "Черноморский судостроительный завод"
 SOV_factionalism_modifier:0 "Фракционность"
 SOV_factionalism_modifier_tt:0 "§LФракционализм внутри партии всегда был проблемой, а с оппозицией более громким, расхождения во мнениях делают партию менее эффективной. Однако при правильном управлении расхождение во мнениях может в конечном итоге превратиться в силу, а не в слабость.§!\n\n"
 SOV_opposition_popular_support:0 "Народная поддержка оппозиции"
 SOV_opposition_popular_support_tt:0 "§LПри большой части партийцев и общественном мнении в поддержку оппозиции вести проигрышную войну гораздо сложнее.§!\n\n"
 SOV_workers_government_idea:0 "Правительство трудящихся"
 SOV_workers_government_idea_desc:0 "Да здравствует рабочее правительство. Правящая элита была отстранена от власти. Рабочие снова правят страной."
 SOV_revolutionary_spirit_idea:0 "Революционный дух"
 SOV_revolutionary_spirit_idea_desc:0 "Революционное рвение возродилось победой над Сталиным. Настало время передать революционный огонь рабочим всего мира."
 SOV_trotskyist_revolutionary_agitation:0 "Троцкистская революционная агитация"
 SOV_trotskyist_revolutionary_agitation_desc:1 "Сторонники троцкизма и другие коммунистические элементы, связанные с [SOV.GetAdjective] Большевистская партия возбуждает [ROOT.GetAdjective] масс, пропагандирующих марксистскую идеологию среди рабочего класса и призывающих к вооруженной борьбе против нашего правительства."
 SOV_trotskyist_revolutionary_agitation_tt:0 "Активизация решения §Y$ban_communist_party$§! Это уменьшит влияние этого национального духа."
 SOV_politicized_military:0 "Политизированная армия"
 SOV_politicized_military_desc:1 "Военные комиссары часто проводят горячие идеологические речи и политические дискуссии среди рядовых, но во многих случаях они также занимаются чрезмерным управлением, чрезмерной проверкой военных офицеров и даже препятствованием приказам командиров подразделений."
 SOV_politicized_military_swap:0 "Военно-политические советники"
 SOV_politicized_military_swap_desc:1 "Хотя мы не должны позволять политическим соображениям диктовать военные решения, мы все же должны гарантировать, что эти политические соображения будут учтены, когда решение будет принято."
 SOV_politicized_military_battle_priests:0 "Боевые священники в армии"
 SOV_politicized_military_battle_priests_desc:1 "Взяв на себя роль батальных священников в наших воинских частях, духовенство теперь отвечает за поддержание высокого морального духа среди рядовых и обеспечение того, чтобы войска знали, что Церковь и Бог на нашей стороне."
 SOV_for_the_common_good_allies:0 "Ради общего блага"
 SOV_for_the_common_good_allies_desc:1 "Каждое решение, принятое нами или нашими союзниками, должно быть направлено на то, чтобы сделать шаг вперед к общему благу."
 SOV_for_the_common_good_subjects:0 "$SOV_for_the_common_good_allies$"
 SOV_for_the_common_good_subjects_desc:1 "Каждое решение, принятое нашими союзниками, направлено на то, чтобы сделать шаг вперед к общему благу. Таким образом, мы должны поддерживать эти решения и следить за тем, чтобы они соответствовали представленным нам рекомендациям, даже если наши жертвы не будут немедленно улучшены."
 SOV_planned_economy_dynamic_modifier:0 "Плановая экономика"
 SOV_grigory_semyonov_man_tt:1 "§Y[SOV.GetName]§! Не завершена фокусировка §Y$SOV_approach_semyonov$§!\nThe §Y[GetSovietCivilWarName]§! Не начиналось.\n§Y$SOV_grigory_semyonov$§! Он также доступен в качестве §YГенерал§! Когда нанят в качестве консультанта."
 SOV_exiled_flag:0 "В настоящее время находится в изгнании (§GПерсонажи не могут быть очищены во время изгнания.§!)"
 SOV_imprisoned_flag:0 "В настоящее время находится в тюрьме (§RПерсонажи могут быть вычищены в тюрьме§!)"
