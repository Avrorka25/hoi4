 SOV_soviet_advisors_spr:0 "Советские военные советники"
 SOV_soviet_advisors_spr_desc:1 "Военные советники и другие квалифицированные военнослужащие прибыли из [SOV.GetNameDef] Поддержать нас в борьбе против фашизма и реакционной контрреволюции."
