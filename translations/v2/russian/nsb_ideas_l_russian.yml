 SOV_understaffed_bureaucracy:0 "Недоукомплектованная бюрократия"
 SOV_understaffed_bureaucracy_desc:1 "НКВД обнаружило доказательства масштабного заговора внутри гражданской администрации и несколько бюрократов были отстранены от должности."
 SOV_anti_soviet_military_thinking_banned_army:0 "Антисоветское военное мышление запрещено"
 SOV_anti_soviet_military_thinking_banned_army_desc:1 "Изучение и обсуждение документов и идей опальных и реакционных теоретиков теперь запрещено нашим армейским офицерам в Академии, а новых выпускников тщательно проверяют, чтобы ни один враг народа не попал в ряды Красной Армии."
 SOV_training_activities_curtailed:0 "Учебные мероприятия свернуты"
 SOV_training_activities_curtailed_desc:1 "Значительная часть транспортных средств испытала механические сбои, и несколько новобранцев получили ранения во время недавних военных учений. До тех пор, пока мы не выясним истинную причину этих механических дефектов, мы сворачиваем крупные учения по тренингу, чтобы избежать дальнейшего ущерба как нашим новобранцам, так и нашим военным активам."
 SOV_purged_junior_army_officers_1:0 "Младшие армейские офицеры уволены"
 SOV_purged_junior_army_officers_1_desc:1 "Значительное число младших армейских офицеров было арестовано НКВД по обвинению в подстрекательстве к мятежу, саботаже и антисоветском мышлении. Потеря стольких опытных офицеров и ветеранов прошлых войн оставила Красную Армию в опасном беспорядке."
 SOV_anti_soviet_military_thinking_banned_navy:0 "Антисоветское военное мышление запрещено"
 SOV_anti_soviet_military_thinking_banned_navy_desc:1 "Изучение и обсуждение документов и идей опальных и реакционных теоретиков теперь запрещено для наших офицеров ВМФ в Академии, а новых выпускников тщательно проверяют, чтобы ни один враг народа не попал в ряды Красного флота."
 SOV_shipyard_staff_purged:0 "Персонал верфи уволен"
 SOV_shipyard_staff_purged_desc:1 "После масштабного расследования многочисленных обвинений в диверсиях и других подозрительных действиях на флоте НКВД произвело многочисленные аресты, оставив некоторые из наших верфей и военно-морских баз серьезно недоукомплектованными."
 SOV_purged_junior_navy_officers_1:0 "Младшие офицеры флота уволены"
 SOV_purged_junior_navy_officers_1_desc:1 "Значительное число младших офицеров ВМФ арестовано НКВД по обвинению в подстрекательстве к мятежу, саботаже и антисоветском мышлении. Потеря стольких опытных офицеров и ветеранов прошлых войн оставила Красный флот в опасном беспорядке."
 SOV_anti_soviet_military_thinking_banned_airforce:0 "Антисоветское военное мышление запрещено"
 SOV_anti_soviet_military_thinking_banned_airforce_desc:1 "Изучение и обсуждение документов и идей опальных и реакционных теоретиков теперь запрещено для наших офицеров ВВС в Академии, а новых выпускников тщательно проверяют, чтобы ни один враг народа не попал в ряды советских ВВС."
 SOV_ground_based_training:0 "Наземное обучение"
 SOV_ground_based_training_desc:1 "После того, как во время учений была зафиксирована серия авиакатастроф и аварий, НКВД инициировал проверку в ВВС и, следуя указаниям назначенных по делу агентов, больше не будет выполняться летных учений, пока продолжается расследование."
 SOV_purged_junior_army_officers_1_tt:0 "§YВсе наземные транспортные средства§!: Бонус за надежность: §R-10%§!"
 SOV_purged_junior_army_officers_2_tt:0 "§YВсе наземные транспортные средства§!: Бонус за надежность: §R-20%§!"
 SOV_purged_junior_army_officers_3_tt:0 "§YВсе наземные транспортные средства§!: Бонус за надежность: §R-30%§!\n§Y$politically_connected$§! Это будет единственная черта, доступная для новых генералов."
 SOV_purged_junior_navy_officers_3_tt:0 "§Y$politically_connected$§! Это будет единственная возможность для новых адмиралов."
