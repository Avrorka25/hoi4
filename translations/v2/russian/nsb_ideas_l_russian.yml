 SOV_no_time_for_peace_idea_desc:1 "$SOV_no_time_for_peace_desc$"
 SOV_support_in_china_generic:1 "[SOU.GetAdjective] Поддержка в Китае"
 SOV_support_in_china_generic_desc:1 "The [SOU.GetAdjective] Правительство поддерживает [ROOT.GetNameDef] В нашей войне против [JAP.GetAdjective]Мы рассчитываем на развитие более тесных связей с нами, а также влияние на нашу политику."
 SOV_preparations_for_soviet_japanese_war:0 "Подготовка к советско-японской войне"
