 LAT_state_romuva_idea_2_desc:2 "Диевтуриба – это возрождение древней балтийской веры, ставшее популярным в латвийских фашистских учреждениях. Фашистские военизированные формирования в Латвии кодифицировали, что все, кто хочет вступить в вооруженные силы, должны сначала поклясться перед Диевсом, сделав Дьевтурибу официальной религией военных."
