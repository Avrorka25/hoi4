l_russian:
 MAN_yoshisuke_aikawa:0 "Айкава Ёсисукэ"
 MAN_kenkichi_ueda:0 "Уэда Кэнкити"
 MAN_toshizo_nishio:0 "Нисио Тосидзо"
 MAN_aisin_gioro_pujie:0 "Айсинь Гьоро Пуцзе"
 MAN_qi_xieyuan:0 "Ци Сеюань"
 MAN_itagaki_seishiro:0 "Итагаки Сэйсиро"
 MAN_kishi_nobosuke:0 "Киси Нобусукэ"
 MAN_doihara_kenji:0 "Доихара Кэндзи"
 MAN_yukio_kasahara:0 "Касахара Юкио"
 MAN_heitaro_kimura:0 "Кимура Хэйтаро"
 MAN_muto_nobuyoshi:0 "Муто Нобуёси"
 MAN_naoki_hoshino:0 "Хосино Наоки"
 MAN_xie_jieshi:0 "Се Цзеси"
 core_outer_manchuria_decision:0 "Вернуть Внешнюю Маньчжурию"
 core_outer_manchuria_decision_desc:0 "Спустя почти столетие весь Маньчжурский бассейн вновь оказался в руках своих истинных хозяев. Теперь, когда новые жители этих земель усмирены, можно всерьёз приступить к реинтеграции давно утраченной родины."
 MAN_lead_the_army_in_person:0 "Лично возглавить армию"
 MAN_turn_over_the_rfr:0 "Выдать РФП"
 MAN_turn_over_the_rfr_desc:0 "Советы требуют передать им белоэмигрантов, находящихся в нашей стране, для «реабилитации». Возможно, собранные разведданные помогут нам обрести союзника в борьбе против Японии."
 MAN_finish_the_five_year_plan:0 "Завершить пятилетний план"
 MAN_finish_the_five_year_plan_desc:0 "Наш второй пятилетний план оказался плодотворным. Нужно приложить ещё немного усилий, и вскоре промышленность начнёт стремительно расти."
 MAN_reclaim_the_entierty_of_manchuria_puppet:0 "Осудить русский империализм"
 MAN_reclaim_the_entierty_of_manchuria_puppet_desc:0 "Пока Китай стоял на коленях, русские в откровенном проявлении колониального империализма захватили обширные земли Маньчжурии, которые сегодня называют Приморьем. Хотя прежде мы были заняты борьбой с современными западными империалистическими державами, судьба вновь вынуждает нас сразиться с русскими и даёт шанс исправить эту несправедливость!"
 MAN_acquire_kanto_shu:0 "Получить Квантунскую область"
 MAN_acquire_kanto_shu_desc:0 "Японские власти слишком заняты войной с китайцами и намерены передать нам Квантунскую область, чтобы снять с себя часть административной нагрузки. Заодно мы получим важный порт."
 MAN_for_the_emperor:0 "За императора"
 MAN_for_the_emperor_desc:0 "Наши солдаты сражаются во имя славного и любимого императора. Победа обеспечена!"
 MAN_send_cadets_to_japan:0 "Отправить курсантов в Японию"
 MAN_send_cadets_to_japan_desc:0 "Отсутствие военной академии привело к нехватке опыта у наших офицеров. Чтобы исправить положение, можно отправить их в японские академии на Главных островах."
 MAN_reform_command_structure:0 "Реформировать структуру командования"
 MAN_reform_command_structure_desc:0 "Нынешняя структура командования недостаточно эффективна и нуждается в преобразовании."
 MAN_restore_the_old_frontier:0 "Восстановить старые границы"
 MAN_restore_the_old_frontier_desc:0 "Теперь, когда Центральная равнина находится под нашим контролем, следующим шагом станет возвращение утраченных окраинных территорий."
 MAN_restore_the_tributary_system:0 "Восстановить данническую систему"
 MAN_restore_the_tributary_system_desc:0 "С огромной силой Империи окружающие малые страны будут иметь шанс быть защищенными Великим Цин. Для них было бы честью стать частью империи."
 MAN_revive_zongli_yamen:0 "Возродить Цзунли ямэнь"
 MAN_revive_zongli_yamen_desc:0 "Цзунли ямэнь занимался главным образом внешними делами и технологическим развитием империи Цин. Если империя намерена соперничать с западными державами, эта организация станет незаменимой."
 MAN_revive_the_grand_council:0 "Возродить Великий совет"
 MAN_revive_the_grand_council_desc:0 "Великий совет был упразднён после создания неудачного «Императорского кабинета». Столь важный орган необходимо восстановить, чтобы он вновь служил славе Великой империи Цин."
 MAN_subjugate_japan:0 "Подчинить Японию"
 MAN_subjugate_japan_desc:0 "Японцы заплатят за причинённое нам унижение. Мы поставим их на колени!"
 MAN_reclaim_the_entierty_of_manchuria:0 "Отвергнуть аннексию Приамурья"
 MAN_reclaim_the_entierty_of_manchuria_desc:0 "Когда наш народ был слабее всего, русские отняли обширные исконные земли за Амуром — часть Маньчжурии, которую теперь называют Приморьем. Обретя новую силу и восстановив Небесный мандат, мы наконец сможем отомстить за эту обиду с лихвой."
 MAN_qing_romanov_alliance:0 "Оливковая ветвь через Сибирь"
 MAN_qing_romanov_alliance_desc:0 "Многие из нас желают обрушиться на русских за преступления прошлого, но времена изменились. Двум азиатским престолам следует объединиться против извращений современности и империалистической мощи других великих держав."
 MAN_winter_training:0 "Зимняя подготовка"
 MAN_winter_training_desc:0 "На улице холодно, поэтому шапки пригодятся."
 MAN_manchuria_petroleum_company:0 "Маньчжурская нефтяная компания"
 MAN_manchuria_petroleum_company_desc:0 "Компания, основанная 10 мая 1935 года, обеспечила Японии полную монополию на добычу и переработку нефти в Маньчжурии."
 MAN_national_martyr_shrine_idea:0 "Национальное святилище мучеников"
 MAN_national_martyr_shrine:0 "Национальное святилище мучеников"
 MAN_national_martyr_shrine_desc:0 "Погибшие не будут забыты. Я охотно принимаю их жертву как необходимую цену возвращения престола."
 MAN_support_aikawa:0 "Поддержать Айкаву"
 MAN_support_aikawa_desc:0 "План Айкавы Ёсисукэ по созданию в Маньчжоу-го промышленного конгломерата в стиле дзайбацу, который будет развивать экономику в соответствии с потребностями страны и всех заинтересованных сторон, принесёт выгоду каждому, кто заинтересован в индустриализации Маньчжурии. Айкава убедил правительство."
 MAN_support_hoshino:0 "Поддержать Хосино"
 MAN_support_hoshino_desc:0 "Национал-синдикалистская модель, предложенная и частично воплощённая Хосино Наоки, обеспечит большую гибкость и позволит лучше удовлетворять требования армии Маньчжоу-го. Кроме того, его неэтичные методы принесут правительству дополнительный доход."
 MAN_establish_mangyo:0 "Основать Мангё"
 MAN_establish_mangyo_desc:0 "Маньчжурская компания промышленного развития, сокращённо Мангё, станет промышленным конгломератом с монополией на экономику Маньчжурии. В её состав войдут несколько прежде независимых предприятий, включая металлургический комбинат «Сёва» и Южно-Маньчжурскую железную дорогу."
 MAN_manchurian_industrial_development_company:0 "Маньчжурская компания промышленного развития"
 japanese_industrial_monopoly:0 "Промышленная монополия"
 MAN_expand_opium_production:0 "Расширить производство опиума"
 MAN_expand_opium_production_desc:0 "Продвижение Хосино открыло новые возможности для Государственного бюро опиумной монополии. Новые доходы укрепят правительство и позволят ему усилить влияние в неспокойных областях. Под руководством Хосино бюро станет крупнейшим распространителем опиума в мире."
 MAN_state_opium_monopoly_bureau:0 "Государственное бюро опиумной монополии"
 opium_monopoly:0 "Опиумная монополия"
 MAN_mantetsu_railway_monopoly:0 "Железнодорожная монополия Мантэцу"
 MAN_mantetsu_railway_monopoly_desc:0 "Ещё до основания Маньчжурской империи Южно-Маньчжурская железная дорога была одним из самых прибыльных предприятий Азии. Её включение в экономическую систему Маньчжоу-го принесёт богатство и процветание."
 MAN_total_economic_coherence:0 "Полная экономическая согласованность"
 MAN_total_economic_coherence_desc:0 "Непрерывные реформы маньчжурского правительства завершились созданием идеально организованной и эффективной имперской экономики, управляемой сверху донизу. Подобно хорошо смазанному механизму, она теперь способна удовлетворять требования Японской империи, Квантунской армии и, разумеется, маньчжурского народа."
 MAN_officer_academies:0 "Основать офицерские академии"
 MAN_officer_academies_desc:0 "Чтобы создать более-менее надёжную и самостоятельную армию, [MAN.GetName] должна подготовить уверенный в себе офицерский корпус, преданный нашему делу."
 MAN_labor_corps:0 "Маньчжурский трудовой корпус"
 MAN_labor_corps_desc:0 "Если у [MAN.GetName] чего-то и много, так это рабочих рук. Эту рабочую силу можно использовать и в военных целях, например для обслуживания и ремонта военных объектов."
 MAN_special_river_detachments:0 "Специальные речные отряды"
 MAN_special_river_detachments_desc:0 "Чтобы маньчжурская армия могла эффективно помогать своим сюзеренам в любых начинаниях, ей необходим специализированный корпус, превосходно выполняющий поставленные задачи. Мы не способны сравниться с Квантунской армией во всём, но благодаря специализации всё же принесём пользу!"
 MAN_military_supplies_requisition_law:0 "Принять закон о реквизиции военных припасов"
 MAN_military_supplies_requisition_law_desc:0 "Закон о реквизиции военных припасов позволит правительству при необходимости изымать земли и ресурсы для военных нужд, а также официально даст ему право привлекать рабочих на помощь армии."
 MAN_auxiliary_forces:0 "Вспомогательные силы"
 MAN_auxiliary_forces_desc:0 "Для создания целостной боевой силы незаменимы вспомогательные подразделения, поддерживающие порядок в тылу."
 MAN_self_sufficient_military:0 "Самодостаточная армия"
 MAN_self_sufficient_military_desc:0 "Предыдущие реформы маньчжурского правительства наконец превратили армию из шайки подкупленных бандитов в достаточно надёжную силу, способную полноценно помогать японским операциям и самостоятельно проводить наступления."
 MAN_reinforce_the_heilongjiang:0 "Укрепить Хэйлунцзян"
 MAN_reinforce_the_heilongjiang_desc:0 "тот [SOV.GetName] Это, несомненно, самая большая угроза японским имперским владениям на континенте. [MAN.GetName] себя. Мы должны направить усилия правительства на создание военной инфраструктуры и системы снабжения, достаточной для проведения операций вдоль границы."
 MAN_reinforce_east_hebei:0 "Укрепить Восточный Хэбэй"
 MAN_reinforce_east_hebei_desc:0 "Императорское правительство Японии выразило желание расширить операции против националистического правительства [CHI.GetLeader]. Мы поможем ему, вложившись в укрепление Восточного Хэбэя и обеспечив возможность манёвров маньчжурской и японской армий на материке."
 MAN_the_kwantung_connection:0 "Квантунские связи"
 MAN_the_kwantung_connection_desc:0 "Начальник штаба Квантунской армии Итагаки Сэйсиро поддерживает хорошие отношения с влиятельным генералом и политиком Тодзё Хидэки. Эта связь даёт возможность убедить японское правительство отказаться от поддержки соперничающего правительства Гоминьдана и вместо этого признать наши законные притязания на Китай."
 MAN_imperial_tianjin_conference:0 "Имперская Тяньцзиньская конференция"
 MAN_imperial_tianjin_conference_desc:0 "Будущее [MAN.GetName] после установления контроля над всем Китаем будет решаться главным образом в Токио, а не в самом Китае. Чтобы опередить любые решения о будущем руководстве нового китайского государства, маньчжурское правительство и Квантунская армия созвали конференцию в оккупированном Тяньцзине, пригласив представителей всех заинтересованных сторон японской сферы влияния в Китае."
 MAN_order_under_the_marshal:0 "Порядок под властью маршала"
 MAN_order_under_the_marshal_desc:0 "После довольно неожиданного назначения второстепенного военачальника [MAN.GetLeader] президентом и, следовательно, марионеточным лидером [MAN.GetName], поддержание порядка в сельской местности, особенно на бывших территориях Гоминьдана, приобретает первостепенное значение. На всём материке будет введено военное положение."
 MAN_lessons_of_the_warlord_era:0 "Уроки эры милитаристов"
 MAN_lessons_of_the_warlord_era_desc:0 "Многочисленные конфликты между милитаристами, в которых [MAN.GetLeader] лично был одним из главных участников, стали одними из немногих крупных войн межвоенного периода. Изучение применявшихся стратегий и тактик может многому нас научить."
 MAN_honor_the_military:0 "Почитать армию"
 MAN_honor_the_military_desc:0 "После введения военного положения армия получила широкие полномочия. Поэтому важно показать народу, что маньчжурские вооружённые силы — достойный институт, защищающий его от бандитов и предателей."
 MAN_back_to_the_basics:0 "Вернуться к основам"
 MAN_back_to_the_basics_desc:0 "После разгрома правительства Гоминьдана можно наконец воплотить план, разработанный на Тяньцзиньской конференции. Под номинальным руководством маршала-президента [MAN.GetLeader] по всему Китаю будет создана лига автономных коллаборационистских губернаторств военачальников. Это ослабит центральное правительство, но обеспечит японский контроль над огромными территориями при минимальных административных расходах."
 MAN_return_of_the_manchus:0 "Возвращение маньчжуров"
 MAN_return_of_the_manchus_desc:0 "Коронация Айсинь Гьоро Пуцзе императором Китая завершена, а с его некомпетентным братом покончено. Мы обратимся к истории Цин, которая вступила в борьбу с коррумпированным китайским правительством, чтобы вернуть стране истинное величие, как это делаем сегодня мы. Смерть республиканизму!"
 MAN_the_republican_disgrace:0 "Республиканский позор"
 MAN_the_republican_disgrace_desc:0 "Свержение династии Цин в 1911 году и внедрение порочных республиканских идей разрушили многовековую централизацию Китая, превратив страну в скопление враждующих милитаристов, утративших уважение к власти. Это величайшая катастрофа в истории Китая. Республиканизм необходимо искоренить, а порядок — восстановить."
 MAN_vanguard_of_the_state:0 "Авангард страны"
 MAN_vanguard_of_the_state_desc:0 "Маньчжурская императорская гвардия, церемониальным командиром которой является сам император [MAN.GetLeader], будет расширена до небольшой, но элитной силы, выполняющей особые задачи во имя императора бок о бок с Императорской армией Японии."
 MAN_a_tale_of_two_emperors:0 "Повесть о двух императорах"
 MAN_a_tale_of_two_emperors_desc:0 "Китайская империя наконец восстановлена! Её законные правители вновь стоят у руля, но нельзя забывать, кто привёл нас сюда. Без великодушных японских сюзеренов наше наследие было бы уничтожено республиканизмом и бандитизмом. Мы должны не просто принять, но и приветствовать своё положение подчинённой империи при Хризантемовом престоле."
 MAN_our_place_in_the_empire:0 "Наше место в империи"
 MAN_our_place_in_the_empire_desc:0 "Мы должны признать, что судьба Маньчжурии принадлежит маньчжурам. Мы останемся отдельно от центрального правительства Китая и извлечём из этого максимум пользы! Продолжим стремительное промышленное и экономическое развитие и покажем миру славу Нового порядка в Азии!"
 MAN_mongol_dominion:0 "Монгольский доминион"
 MAN_mongol_dominion_desc:0 "Власть [MEN.GetLeader] в лучшем случае оппортунистична, а в худшем — предательская. Внутреннее Монгольское государство выполнило своё предназначение и должно быть включено в состав [MAN.GetName]."
 MAN_request_continental_territory:0 "Запросить континентальные территории"
 MAN_request_continental_territory_desc:0 "Хотя мы признаём своё положение в качестве [MAN.GetName], передача земель, расположенных рядом с нынешними границами, могла бы снизить административные расходы нашего сюзерена и предоставить нам дополнительные трудовые и природные ресурсы."
 MAN_mukden_convention:0 "Мукденская конвенция"
 MAN_mukden_convention_desc:0 "Закрепив положение отдельного от Китая образования, мы всё ещё должны решить вопрос бывших владений старой Цин, захваченных Российской империей. В Мукдене будет созвана конвенция с участием японских чиновников и военных делегатов, чтобы решить, следует ли предъявлять права на бывшие территории Цин в Монголии и Внешней Маньчжурии."
 MAN_depose_the_weak_monarch:0 "Свергнуть слабого монарха"
 MAN_depose_the_weak_monarch_desc:0 "Правление Пу И использовалось как средство обретения международной легитимности и доказательство наших прав на Китай. Но теперь, отказавшись от этих притязаний, мы больше не нуждаемся в видимости того, что Пу И правит нашей страной. Он должен уйти. Его отстранение предрешено, но вопрос о преемнике сложнее."
 MAN_reorganize_the_kwantung_army:0 "Реорганизовать Квантунскую армию"
 MAN_reorganize_the_kwantung_army_desc:0 "Теперь, когда Квантунская армия получила абсолютный контроль над [MAN.GetName], необходимо пересмотреть её отношения с самой страной. Она будет объединена с существующими маньчжурскими вооружёнными силами и образует Континентальную пограничную армию. Но прежде обе структуры необходимо реорганизовать."
 MAN_establish_continental_frontier_army:0 "Основать КПА"
 MAN_establish_continental_frontier_army_desc:0 "Подготовка завершена, и Континентальная пограничная армия может быть учреждена. Командиры Квантунской армии, прежде управлявшие из-за спин маньчжурских марионеточных лидеров, займут официальные должности и смогут эффективнее применять свой опыт на благо [MAN.GetName]."
 MAN_technological_supremacy:0 "Технологическое превосходство"
 MAN_technological_supremacy_desc:0 "Один из способов доказать своё превосходство и законность Нового порядка в Азии — достичь технологического превосходства над соседними странами и даже европейскими державами."
 MAN_the_imperial_wildcard:0 "Имперский джокер"
 MAN_the_imperial_wildcard_desc:0 "Поначалу Киси казался компромиссным кандидатом, но вскоре после назначения показал истинное лицо. Используя связи в Токио, он быстро устранил Квантунскую армию и её влияние, а оставшихся промышленников заставил действовать исключительно под своим надзором. Он предоставил дзайбацу полную свободу эксплуатации и разграбления [MAN.GetName], разумеется, под собственным контролем."
 MAN_council_of_corporations:0 "Совет корпораций"
 MAN_council_of_corporations_desc:0 "Создание совета всех хозяйственных субъектов [MAN.GetName] позволит эффективнее координировать промышленную деятельность и быстро доводить опасения инвесторов до правительства."
 MAN_the_concord_of_ethnicities:0 "Согласие народов"
 MAN_the_concord_of_ethnicities_desc:0 "Усиление Ассоциации согласия при поддержке промышленников позволяет развить нашу цель создания паназиатской страны, где коренные народы региона сотрудничают друг с другом."
 MAN_the_pan_asian_dream:0 "Паназиатская мечта"
 MAN_the_pan_asian_dream_desc:0 "Правление Ассоциации согласия сопровождалось распространением действенной пропаганды не только в Маньчжурии, но и на союзных территориях. Это привело к притоку множества людей, бежавших от войны в Китае или японской оккупации Кореи, и обеспечило нас многочисленными переселенцами во имя паназиатской мечты."
 MAN_central_control:0 "Совершенная диктатура"
 MAN_central_control_desc:0 "Киси создал в Маньчжурии то, о чём другие диктаторы могут лишь мечтать: страну, где ничего не происходит без его ведома, где каждый участник политической жизни понимает, что должен хранить верность своему руководителю или быть уничтоженным, и где никто не смеет сопротивляться головорезам главы исполнительной власти."
 MAN_operation_kantokuen:0 "Операция «Кантокуэн»"
 MAN_operation_kantokuen_desc:0 "Настало время сокрушить главного врага нашего Нового порядка в Азии. Русские веками занимали азиатские земли и объявляли их своими. Объединённый союз азиатских народов вновь сокрушит их высокомерие! Мы должны подготовить вооружённые силы к долгому походу в Сибирь, чтобы раз и навсегда изгнать европейские силы."
 MAN_greater_manchuria:0 "Великая Маньчжурия"
 MAN_greater_manchuria_desc:0 "[MAN.GetName] должна стремиться вернуть территории Внешней Маньчжурии, похищенные русскими в 1858 и 1860 годах. §RПритязания на земли, так долго не находившиеся под нашим контролем, дестабилизируют страну, но освобождение Азии стоит каждой капли крови!§!"
 MAN_beyond_baikal:0 "За Байкалом"
 MAN_beyond_baikal_desc:0 "Чтобы по-настоящему показать миру наш рай паназиатских народов, мы распространим притязания за Байкал и объединим всех монголов, бурят и другие народы! §RПритязания на столь обширные территории серьёзно дестабилизируют страну, но мы обязаны хранить верность делу паназиатизма!§!"
 MAN_revise_imperial_treaties:0 "Пересмотреть имперские договоры"
 MAN_revise_imperial_treaties_desc:0 "Подготовка завершена, и время пришло! Айгунский и Пекинский договоры будут пересмотрены, а наши территории возвращены! Европейские колонизаторы будут изгнаны за Урал! §RОбъявление войны более сильной стране породит пораженчество в армии.§!"
 MAN_liberation_is_nigh:0 "Освобождение близко!"
 MAN_liberation_is_nigh_desc:0 "Нам удалось освободить территории, на которые претендовало правительство, §Gи частично искоренить пораженчество, однако до капитуляции русских ещё далеко!"
 MAN_propagate_nanshinron:0 "Распространять доктрину Нансин-рон"
 MAN_propagate_nanshinron_desc:0 "Доктрину Нансин-рон, принятую японским правительством, необходимо распространить среди наших чиновников, чтобы обеспечить мобилизацию против врагов Нового порядка в Азии. Для подготовки к войне с враждебными странами будет развёрнуто военное строительство."
 MAN_pressure_tibet:0 "Оказать давление на Тибет"
 MAN_pressure_tibet_desc:0 "[TIB.GetName] препятствует нашей возможности угрожать государству [RAJ.GetName]. Тибет должен либо подчиниться японскому контролю и принять наше компромиссное предложение об уступке Цинхая, либо быть сокрушён мощью Нового порядка в Азии. Мы предъявим ультиматум."
 MAN_the_kashmir_border:0 "Кашмирская граница"
 MAN_the_kashmir_border_desc:0 "Помимо Бирмы, кашмирская граница является вторым возможным плацдармом для сухопутных операций против государства [RAJ.GetName]. Необходимо обеспечить достаточную инфраструктуру и снабжение для поддержки подобных манёвров."
 MAN_remodel_the_river_detachments:0 "Преобразовать речные отряды"
 MAN_remodel_the_river_detachments_desc:0 "Наши враги в Азии владеют множеством колоний, освободить которые можно лишь посредством крупномасштабных морских операций. Мы преобразуем речные отряды, чтобы они могли проводить морские десанты."
 MAN_hainan_forward_operating_base:0 "Передовая оперативная база на Хайнане"
 MAN_hainan_forward_operating_base_desc:0 "Хайнань идеально подходит для передовой оперативной базы морских десантов. Мы разовьём остров, чтобы там можно было разместить крупные силы морской пехоты и Императорский флот Японии."
 MAN_assume_continental_responsibilities:0 "Взять на себя континентальные обязанности"
 MAN_assume_continental_responsibilities_desc:0 "Взяв на себя простые гарнизонные и оборонительные обязанности, мы снизим нагрузку на Императорскую армию и Императорский флот Японии и позволим им проводить наступательные операции. Наши войска будут должным образом переоснащены для службы в условиях Бирмы и Малайи."
 MAN_new_imperial_chinese_navy:0 "Новый Императорский флот Китая"
 MAN_new_imperial_chinese_navy_desc:0 "После устранения Квантунской армии мы укрепим независимые вооружённые силы и воссоздадим Императорский флот!"
 MAN_manchurian_auxiliary_navy:0 "Маньчжурский вспомогательный флот"
 MAN_manchurian_auxiliary_navy_desc:0 "Мы вложимся в развитие военно-морских возможностей, чтобы расширить торговлю и помогать Императорскому флоту Японии."
 MAN_fully_coopt_concordian_ideals:0 "Полностью присвоить идеалы согласия"
 MAN_fully_coopt_concordian_ideals_desc:0 "Королевский дом должен полностью принять конкордановские идеалы, обеспечивая для себя состояние всех этнических групп в регионе, позволяя экспансию, империализм и легитимность наряду с блокированием господства ханьского Китая."
 MAN_the_union_victorious:0 "Победа союза"
 MAN_the_union_victorious_desc:0 "Все кончено! Мы достигли своих целей и достигли великого государства! Приветствуйте Союз, и это великий Император!"
 manchukuo_events.1.d:0 "Влияние Квантунской армии невозможно переоценить. Обратившись к начальнику штаба Итагаки Сэйсиро, [MAN.GetName] укрепила непростой союз с Квантунской армией. Её заверят, что она сохранит влияние, а её чиновники получат государственные должности, узаконивающие дальнейшее присутствие, в обмен на поддержку маньчжурских притязаний на весь Китай. Если Тодзё и Итагаки поддержат наше начинание, остальное японское правительство последует их примеру."
 manchukuo_events.2.d:0 "Мукденская конвенция открылась в напряжённой обстановке, ведь на ней решается будущее государства [MAN.GetName]. Квантунская армия и радикалы Ассоциации согласия непрерывно давят на делегатов, призывая поддержать войну против государства [SOV.GetName] ради возвращения и освобождения азиатских территорий, находящихся под властью европейской державы. Гражданские делегаты государства [JAP.GetName], напротив, настаивают, что вопрос территориальной экспансии следует оставить Японии, а государству [MAN.GetName] надлежит продолжать промышленное развитие. Сейчас мы должны решить, примем ли мы дело освобождения Азии."
 manchukuo_events.3.d:0 "Наиболее влиятельные члены маньчжурского правительства тайно собрались в Сеуле, чтобы определить преемника устаревшей номинальной власти Пу И и его старой цинской элиты. Возникли две отдельные группировки: Квантунская армия выступает за захват Государственного совета по общим делам во главе с генералом Доихарой, а промышленники и инвесторы под руководством Айкавы и Наори хотят сохранить гражданское правление и передать власть усиленной Ассоциации согласия, которую предполагается расширить до массовой организации по образцу фашистских партий Европы. Хотя эти группировки постоянно борются за влияние в Маньчжурии, Киси Нобусукэ сумел остаться посредником, сохранив хорошие отношения с обеими сторонами. Поскольку фактически именно он контролирует экономику государства [MAN.GetName], некоторые уже призывают назначить его главой исполнительной власти как компромиссного кандидата."
 manchukuo_events.4.d:0 "Большинству участников ещё до прибытия на конференцию было ясно, что нынешний император Маньчжурии Айсинь Гьоро Пу И не станет будущим правителем объединённого Китая. Его отсутствие на конференции лишь подтвердило это.                                                                                                                                                                                                          Главный предмет обсуждения — следует ли сохранить монархию бывшей династии Цин, заменив Пу И его более надёжным братом Пуцзе. Другой вариант, поддерживаемый военными чиновниками, предполагает создание децентрализованной системы с уважаемым китайским милитаристом в роли номинального руководителя."
 manchukuo_events.5.d:0 "Маньчжурская делегация запросила передачу всех принадлежащих нам континентальных территорий Китая. В обмен она заверила, что [MAN.GetName] не станет претендовать на весь Китай."
 r56_manchuria.28.t:0 "[From.GetNameDEF] предлагает вассализацию"
 r56_manchuria.28.d:0 "В силу Небесного мандата император настоящим повелевает:\n\nТвоё царство приглашается стать вассалом славной Великой империи Цин. Покорись — или погибни под мощью Поднебесной империи.\n\nПочти этот указ."
 r56_manchuria.28.a:0 "Указ принят."
 r56_manchuria.28.b:0 "Чушь!"
 r56_manchuria.29.t:0 "[From.GetName] становится нашим вассалом"
 r56_manchuria.29.d:0 "По указу императора [From.GetName] становится почётным вассалом государства [MAN.GetNameDEF]."
 r56_manchuria.29.a:0 "Мир вновь склонится перед могучей империей Цин!"
 r56_manchuria.29.b:0 "Им будет лучше в составе империи."
 r56_manchuria.30.t:0 "[From.GetName] отказывается от вассализации"
 r56_manchuria.30.d:0 "Надменный правитель [From.GetLeader] отверг наше великодушное предложение о вассализации!"
 r56_manchuria.30.a:0 "Скоро они осознают свою ошибку."
 r56_manchuria.31.t:0 "[MAN.GetName] желает получить Квантунскую область"
 r56_manchuria.31.d:0 "[MAN.GetName] направила представителя для обсуждения передачи Квантунской области."
 r56_manchuria.31.a:0 "Согласиться."
 r56_manchuria.31.b:0 "Ни за что."
 r56_manchuria.32.t:0 "Квантунская область получена"
 r56_manchuria.32.d:0 "Мы получили Квантунскую область!"
 r56_manchuria.32.a:0 "Наилучший исход."
 r56_manchuria.33.t:0 "Квантунская область осталась у Японии"
 r56_manchuria.33.d:0 "Наше предложение не заинтересовало японских чиновников, и Квантунская область осталась в руках Японии."
 r56_manchuria.33.a:0 "Мы ничего не можем с этим поделать."
 MAN_national_cooperation_government_modifier:0 "Правительство национального сотрудничества"
 MAN_grand_council_idea:0 "Великий совет"
 MAN_zongli_yamen:0 "Цзунли ямэнь"
 MAN_efficient_command_structure:0 "Эффективная структура командования"
 MAN_cadets_in_jap_academy:0 "Курсанты в японской академии"
 MAN_army_academies:0 "Маньчжурские военные академии"
 MAN_army_academies_desc:0 "Создание военных академий обеспечит новое поколение уверенных в себе офицеров, способных координировать действия современной армии."
 MAN_labor_corps_idea:0 "Гражданский трудовой корпус"
 MAN_labor_corps_idea_desc:0 "Гражданский трудовой корпус может освободить армию от повседневных работ и позволить ей сосредоточиться прежде всего на боевых действиях."
 MAN_self_sufficient_military_idea:0 "Самодостаточные вооружённые силы"
 MAN_self_sufficient_military_idea_desc:0 "Предыдущие реформы превратили шайку бывших бандитов в уверенную современную армию, способную самостоятельно противостоять любой угрозе."
 MAN_self_sufficient_military_idea_2:0 "Континентальная пограничная армия"
 MAN_self_sufficient_military_idea_2_desc:0 "Объединение Квантунской армии и маньчжурских войск повысило качество и боевой дух вооружённых сил."
 MAN_martial_law:0 "Военное положение"
 MAN_martial_law_desc:0 "Полная мобилизация против правительства Гоминьдана вынудила власти ввести военное положение на всём материке."
 MAN_idea_military_primacy:0 "Первенство армии"
 MAN_idea_military_primacy_desc:0 "Продолжающаяся эскалация войны в Китае сделала армию главным получателем государственных средств."
 MAN_warlord_governorates:0 "Губернаторства милитаристов"
 MAN_warlord_governorates_desc:0 "В рамках системы лиги военные руководители, не сохранявшие верность правительству Гоминьдана, были назначены милитаристами-губернаторами китайских областей, создав децентрализованную, но устойчивую систему."
 MAN_idea_return_of_the_manchus:0 "Возвращение маньчжуров"
 MAN_idea_return_of_the_manchus_desc:0 "Маньчжуры вновь возвращаются, чтобы по праву править Китаем."
 MAN_idea_manchu_imperial_guard:0 "Маньчжурская императорская гвардия"
 MAN_idea_manchu_imperial_guard_desc:0 "Маньчжурская императорская гвардия преобразована из церемониальной бригады в полноценный род вооружённых сил, предназначенный для выполнения особых манёвров по приказу императора."
 MAN_subservient_empire:0 "Подчинённая империя"
 MAN_subservient_empire_desc:0 "Наша новая Китайская империя приняла роль подчинённой державы Японской империи и заняла естественное место в Новом порядке в Азии."
 MAN_zaibatsu_state:0 "Страна дзайбацу"
 MAN_zaibatsu_state_desc:0 "[MAN.GetLeader] предоставил дзайбацу полную свободу действий в Маньчжурии. Они быстро создали систему, в которой всеми экономическими процессами управляют они и сам Киси. Экономика стремительно растёт, но народ страдает от эксплуатации и лишений."
 MAN_five_races_under_one_union:0 "Пять народов в едином союзе"
 MAN_five_races_under_one_union_desc:0 "Национальный девиз «Пять народов в едином союзе» означает сотрудничество пяти народов Маньчжурии: маньчжуров, японцев, ханьских китайцев, монголов и корейцев."
 MAN_concord_of_the_five_races:0 "Согласие пяти народов"
 MAN_concord_of_the_five_races_desc:0 "С превращением Ассоциации согласия в массовую организацию жителей Маньчжурии учат преимуществам сотрудничества народов вместо ненависти и соперничества. Новую страну действительно можно назвать союзом пяти народов."
 MAN_mantetsu_railway:0 "Железная дорога Мантэцу"
 MAN_mantetsu_railway_desc:0 "Южно-Маньчжурская железнодорожная компания, сокращённо Мантэцу, — крупный промышленный конгломерат и одно из немногих предприятий, существовавших ещё до основания государства [MAN.GetName]. Несмотря на название, Мантэцу действует почти во всех отраслях гражданской экономики и потому обладает огромным влиянием на саму страну."
 MAN_widespread_defeatism:0 "Широко распространённое пораженчество"
 MAN_widespread_defeatism_desc:0 "Объявление войны государству [SOV.GetName] вызвало широкое распространение пораженчества в вооружённых силах и среди гражданского населения."
 MAN_extreme_defeatism:0 "Крайнее пораженчество"
 MAN_extrene_defeatism_desc:0 "Объявление войны государству [SOV.GetName] вызвало широкое распространение пораженчества в вооружённых силах и среди гражданского населения."
 MAN_false_government:0 "Нелегитимное правительство Китая"
