 if_un_accepted_tt:0 "Если Совет Безопасности одобрит:"
 constitutionally_neutral:0 "Конституционный нейтралитет"
 constitutionally_neutral_desc:0 "Бывшие оккупационные державы [ROOT.GetNameDef] решили, что единственным способом восстановить [ROOT.GetNameDef] станет гарантия того, что в ближайшем будущем страна не примкнёт ни к одной из сторон."
 cold_war.2.t:0 "Король Яхья убит!"
 cold_war.2.d:0 "В столицу пришли ужасные новости об убийстве короля Яхьи. Известный своей замкнутостью правитель попал в засаду во время короткой поездки и был застрелен членами клана Аль-Вазири. Глава этого клана теперь заявил права на престол и, похоже, беспрепятственно готовится занять столицу. Однако наследник короля Яхьи бежал и вскоре может вернуться с вооружённой поддержкой."
 cold_war.2.a:0 "Тревожно"
 cold_war.3.t:0 "Клан Яхьи возвращает себе престол"
 cold_war.3.d:0 "После непродолжительного правления Аль-Вазири сын убитого короля Яхьи вернул себе престол, быстро заручившись поддержкой племён Северного Йемена. После непродолжительной осады [ROOT.Capital.GetCapitalVictoryPointName] [ROOT.GetLeader] был захвачен и теперь ожидает казни."
 cold_war.3.a:0 "Закончится ли нестабильность?"
 cold_war.4.t:0 "[USA.GetNonIdeologyName] предлагает помощь"
 cold_war.4.d:0 "После подписания президентом [FROM.GetLeader] Закона об иностранной помощи в [GetYear] году с нами связались с предложениями предоставить нашей стране займы и гранты [FROM.GetAdjective]."
 cold_war.4.a:0 "Настоящий союзник"
 cold_war.4.b:0 "Всего лишь очередная попытка усилить влияние!"
 cold_war.6.t:0 "Министры уходят в отставку в знак протеста"
 cold_war.6.d:0 "Двенадцать министров-некоммунистов потребовали освободить их от должностей в знак протеста против почти полного захвата полиции КПЧ. Готвальд объявил о планах всеобщей забастовки, а коммунистические силы начали массовые демонстрации, требуя сформировать коммунистическое правительство вместо уходящих министров."
 cold_war.6.a:0 "Следует принять их отставки."
 cold_war.6.b:0 "Мобилизовать армию!"
 cold_war.9.t:0 "[592.owner.GetName] требует [728.GetName] за владения в Индокитае"
 cold_war.9.d:0 "Наш союзник в борьбе против Японии и вьетнамского восстания в Индокитае, [CHI.GetNameDef], выступил с предложением: они вернут нам Северный Индокитай, но только если мы уступим договорный порт [728.GetName], недавно освобождённый от остатков японских войск."
 cold_war.9.a:0 "Хорошо"
 cold_war.9.b:0 "Никогда!"
 cold_war.23.t:0 "[FROM.GetAdjective] оказывает давление ради военного пакта"
 cold_war.23.d:0 "Использовав финских коммунистов для организации протестов и распространения слухов о тайных связях с Западом, [FROM.GetNameDef] обращается к нам с целью формализовать послевоенные отношения. В частности, они хотят гарантировать, что на них не нападут через территорию Финляндии: Финляндия будет защищать [FROM.GetNameDef] в случае нападения, а они, в свою очередь, защитят [ROOT.GetNameDef], если нам будет угрожать опасность."
 cold_war.23.a:0 "Выгодно обеим сторонам."
 cold_war.23.b:0 "Нам не нужна их защита."
 cold_war.31.t:0 "Смерть Джорджа Паттона"
 cold_war.31.d:0 "После тяжёлых травм, полученных в автомобильной аварии, генерал Джордж С. Паттон скончался. До недавнего времени Паттон временно командовал войсками в Европе, но был снят с других командных должностей после враждебных высказываний в адрес [SOV.GetNameDef] и отказа сотрудничать в денацификации Германии."
 cold_war.31.a:0 "Мы потеряли хорошего генерала"
 cold_war.37.t:0 "Австрия как нейтральное государство?"
 cold_war.37.d:0 "Идеологические разногласия между различными оккупационными державами в Австрии заставляют все стороны опасаться восстановления австрийского государства, которое может примкнуть лишь к одному лагерю. Очевидным решением станет создание конституционно нейтральной Австрии, однако вопрос о её правительстве всё ещё остаётся открытым."
 cold_war.37.a:0 "Необходимо провести выборы"
 cold_war.37.b:0 "Совета из демократических и коммунистических партий будет достаточно"
 cold_war.38.t:0 "[FROM.GetName] предлагает нейтральную Австрию"
 cold_war.38.a:0 "Похоже на лучший вариант"
 cold_war.38.b:0 "Совершенно неприемлемо"
 cold_war.38.d:0 "[FROM.GetNameDefCap] предложил положить конец оккупации Австрии и создать конституционно нейтральное государство с демократическими выборами. Нам и другим оккупационным державам предстоит решить, достаточно ли этих уступок, чтобы рассмотреть прекращение оккупации."
 cold_war.38.d2:0 "[FROM.GetNameDefCap] предложил положить конец оккупации Австрии и создать конституционно нейтральное государство, где политику будет определять совет лидеров коммунистических и демократических партий. Нам и другим оккупационным державам предстоит решить, достаточно ли этих уступок, чтобы рассмотреть прекращение оккупации."
 cold_war.39.t:0 "Германия как нейтральное государство?"
 cold_war.39.d:0 "Идеологические разногласия между различными оккупационными державами в Германии и страх перед новой сильной Германией заставляют все стороны опасаться восстановления германского государства, которое может примкнуть лишь к одному лагерю. Очевидным решением станет создание конституционно нейтральной Германии, однако вопрос о её правительстве всё ещё остаётся открытым."
 cold_war.40.t:0 "[FROM.GetName] предлагает нейтральную Германию"
 cold_war.40.d:0 "[FROM.GetNameDefCap] предложил положить конец оккупации Германии и создать конституционно нейтральное государство с демократическими выборами. Нам и другим оккупационным державам предстоит решить, достаточно ли этих уступок, чтобы рассмотреть прекращение оккупации."
 cold_war.40.d2:0 "[FROM.GetNameDefCap] предложил положить конец оккупации Германии и создать конституционно нейтральное государство, где политику будет определять совет лидеров коммунистических и демократических партий. Нам и другим оккупационным державам предстоит решить, достаточно ли этих уступок, чтобы рассмотреть прекращение оккупации."
 cold_war.41.t:0 "[FROM.GetName] предлагает объединить оккупационные зоны"
 cold_war.41.d:0 "[FROM.GetNameDefCap] обратился к нам с предложением открыть границы между нашими оккупационными зонами в Германии."
 cold_war.41.a:0 "Так будет лучше и для нас, и для немецкого народа"
 cold_war.41.b:0 "Им нельзя доверять"
 cold_war.43.t:0 "Судьба Чехословакии"
 cold_war.43.d:0 "Освободив значительную часть Восточной Европы, теперь мы должны определить форму правления [CZE.GetNameDef]. Хотя мы могли бы установить стабильный марионеточный режим, демократическое правительство, вероятно, принесло бы нам больше международного расположения."
 cold_war.43.a:0 "Они получат... некоторую... свободу"
 cold_war.43.b:0 "Они представляют слишком большую угрозу"
 cold_war.44.t:0 "[FROM.GetName] запрашивает танки"
 cold_war.44.d:0 "Наши братья [FROM.GetAdjective], в настоящее время создающие собственную армию, обратились к нам с просьбой передать им часть наших крупных запасов танков."
 cold_war.44.a:0 "В наших интересах сделать их сильнее"
 cold_war.44.b:0 "Если они попадут не в те руки..."
 cold_war.45.t:0 "Италия запрашивает пакет помощи"
 cold_war.45.d:0 "Представители коммунистической партии [ITA.GetNameDef] выступили с необычным предложением: чтобы повысить свою популярность и избежать зависимости от [USA.GetNameDef], они просят нас предоставить альтернативу той помощи, которую американцы оказывают другим европейским странам."
 cold_war.45.a:0 "Это может втянуть их в нашу сферу"
 cold_war.45.b:0 "У коммунизма нет будущего в [ITA.GetNonIdeologyName]"
 cold_war.46.t:0 "Гражданская война в Италии?"
 cold_war.46.d:0 "Коммунистическая партия [ITA.GetAdjective] выступила с ошеломляющим предложением: по их оценке, коммунисты [ITA.GetAdjective] могут захватить власть посредством гражданской войны. Представители партии обратились к нам как за одобрением, так и за помощью в этом начинании."
 cold_war.46.a:0 "Невероятная возможность распространить коммунизм"
 cold_war.46.b:0 "Это слишком сильно повредит нашей международной репутации"
 cold_war.47.t1:0 "[FROM.GetName] поддерживает гражданскую войну"
 cold_war.47.t2:0 "[FROM.GetName] отказывается поддержать гражданскую войну"
 cold_war.47.d1:0 "К удивлению нашей делегации, [SOV.GetLeader] высказался в поддержку наших революционных планов, и [SOV.GetNameDef] намерен оказать нам материальную помощь."
 cold_war.47.d2:0 "Наша делегация в [SOV.GetNameDef] вернулась с новостями: [SOV.GetLeader] не желает, чтобы в Италии произошла революция. Неизвестно, вызвано ли это страхом иностранного вмешательства, возможного поражения или эскалации на мировой арене, но теперь нам самим решать, продолжать ли подготовку революции."
 cold_war.47.a:0 "Время революции пришло"
 cold_war.47.b:0 "Продолжим итальянский путь к социализму"
 cold_war.48.t:0 "Сделка с [YUG.GetNameDef]?"
 cold_war.48.d:0 "Коммунистическая партия [ITA.GetAdjective] отличается тем, что даже после войны продолжает выдвигать территориальные претензии — в данном случае на земли [YUG.GetAdjective]. Отказ от этих претензий выглядит идеальным предметом торга, чтобы заручиться поддержкой наших соседей, располагающих широким ассортиментом трофейного вооружения."
 cold_war.48.a:0 "Мы должны развивать хорошие отношения"
 cold_war.48.b:0 "Это наша законная территория!"
 cold_war.49.t:0 "Семилетний план"
 cold_war.49.d:0 "[ROOT.GetLeader] решил провести масштабную программу восстановления промышленности после того, как [ROOT.GetNameDef] вновь обрёл независимость. Однако промышленные проблемы заставляют решить, следует ли направить эти усилия на первоначально задуманные инвестиции в сельское хозяйство или сосредоточиться на промышленности."
 cold_war.49.a:0 "Восстановление промышленности должно быть приоритетом"
 cold_war.49.b:0 "Сделать приоритетом сельское хозяйство, как и планировалось"
 cold_war.50.t:0 "[FROM.GetName] просит компромисса по нефти"
 cold_war.50.d:0 "В ответ на британские санкции против [FROM.GetNameDef] они обратились к нам с предложением компромисса. Иранская нефть останется национализированной, однако будет заключено выгодное соглашение, по которому компании [ROOT.GetAdjective] смогут добывать эту нефть с разделением доходов 50 на 50."
 cold_war.51.t:0 "[FROM.GetName] просит поддержки"
 cold_war.51.d:0 "[FROM.GetNameDefCap] обратился к нам в поисках сближения после нашей предыдущей оккупации территории, которую они считают иранской. Из-за напряжённых отношений с Западом они даже стремятся заключить дипломатический пакт с нашим правительством, включающий взаимную оборону и сотрудничество в добыче ресурсов."
 cold_war.51.a:0 "Меньше нефти для наших врагов"
 ITA_sanction_mafia_killings:0 "Использовать мафию против коммунистов"
 ITA_request_soviet_aid_alternative:0 "Запросить альтернативу помощи по плану Маршалла"
 ITA_request_civil_war_support:0 "Поддержка гражданской войны?"
 mafia_domination:0 "Доминирующее влияние мафии"
 SOV_financing_ITA_support:0 "Финансирование поддержки [ITA.GetName]"
 SOV_marshall_plan_alternative_aid_idea:0 "Экономическая поддержка [SOV.GetAdjective]"
 ITA_monarchy_path_unlock_by_referendum_tt:0 "§YЭтот фокус может быть разблокирован в зависимости от результата референдума о монархии.§!"
 USA_marshall_plan_aid_idea:0 "Экономическая поддержка [USA.GetAdjective]"
 CZKE_finish_the_tvp_project:0 "Завершить проект TVP"
 CZKE_finish_the_tvp_project_desc:0 "Проект TVP — амбициозная программа разработки танка, призванная объединить лучшие стороны конструкций [GER.GetAdjective], [ENG.GetAdjective], [SOV.GetAdjective] и [ROOT.GetAdjective]."
 CZKE_acquire_soviet_tanks:0 "Получить танки [SOV.GetAdjective]"
 CZKE_acquire_soviet_tanks_desc:0 "Наше тесное сближение с [SOV.GetNameDef] означает, что нам не следует тратить время на испытания совершенно новых конструкций танков, когда наш союзник уже массово производит собственные передовые модели."
 CZKE_continue_producing_german_designs:0 "Продолжить производство немецких образцов"
 CZKE_handle_the_communist_power_grab:0 "Кризис с коммунистическим контролем полиции"
 CZKE_five_year_plan:0 "Пятилетний план"
 CZKE_five_year_plan_desc:0 "К сожалению, значительная часть страны слабо индустриализирована или не индустриализирована вовсе. Чтобы сократить экономический разрыв прежде, чем он разорвёт наш союз, потребуются решительные централизованные меры из Праги."
 CZKE_currency_reform:0 "Денежная реформа"
 CZKE_collectivize_key_industries:0 "Национализация ключевых отраслей"
 CZKE_collectivize_key_industries_desc:0 "Промышленная элита Чехословакии слишком долго наживалась на индустриализации чешских и немецкоязычных регионов страны. Решительная программа национализации принесёт нашему правительству народную поддержку и устранит пагубное влияние капиталистических промышленников на власть."
 CZKE_suppress_the_church:0 "Подавить церковь"
 CZKE_suppress_the_church_desc:0 "Католицизм в нашей стране является одним из крупнейших препятствий общественному прогрессу. Если мы хотим стать современной страной с по-настоящему выдающимся населением, потребуется жёсткий государственный атеизм для формирования нового революционного общества!"
 CZKE_collectivize_farms:0 "Коллективизировать сельское хозяйство"
 CZKE_collectivize_farms_desc:0 "Аграрные регионы Чехословакии, преимущественно расположенные на словацких землях, использовались элитой в ущерб развитию всей страны. Централизовав этот сектор экономики, мы сможем обеспечить развитие всей страны!"
