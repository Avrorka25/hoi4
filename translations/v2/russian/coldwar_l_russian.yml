 CW_soviet_occupations_desc:0 "[GetNameDefCap] в настоящее время контролирует земли, которые не намерен удерживать, однако то, каким образом мы от них откажемся, всё ещё зависит от нас, что открывает определённые стратегические возможности."
 SOV_release_AZE_puppet:0 "Создать азербайджанское правительство в Иране"
 SOV_release_AZE_puppet_desc:0 "Чтобы легитимизировать наш контроль над иранскими землями и оказать давление ради получения прав на нефть, мы можем тайно поддержать создание «независимого» правительства Азербайджана на территории Ирана."
