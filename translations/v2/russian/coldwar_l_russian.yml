 operation_ajax_desc:0 ""
 targeted_instigate_protests:0 "Спровоцировать протесты"
 targeted_instigate_protests_desc:0 "Внедрённые агенты спровоцируют протест против шаха от имени партии Х.Т.И., а затем подтолкнут сторонников шаха к проведению акции в его поддержку. Возникшие беспорядки позволят военным захватить власть, после чего они восстановят шаха на престоле."
 targeted_instigate_protests_outcome:0 "Наш план сработал в точности как задумано. Иранское духовенство даже поддалось на нашу уловку, поддержав антишахские протесты, что усилило впечатление о необходимости военного переворота. Шах вернулся из изгнания и начал предпринимать шаги, которых мы от него требовали."
