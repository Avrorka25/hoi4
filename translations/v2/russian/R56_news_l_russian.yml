l_russian:
 country_capitulated.0.d_defeat_hitler:0 "[FROM.FROM.GetLeader] В конце концов, он объявил, что после огромных усилий, [ROOT.GetAdjective] Вооруженные силы, наконец, согласились безоговорочно капитулировать. Поэтому он объявил, что его великая победа стала возможной благодаря усилиям всего народа. [ROOT.ROOT] Народ и его союзники отмечают конец гитлеровской тирании.\n\nКогда нацизм окончательно побежден, над Европой встает новый рассвет, но пока что [ROOT.GetAdjective] Он будет оставаться под военной оккупацией в рамках установления четкого мирного урегулирования."
 r56.news_event.1.t:0 "Муссолини отстранён от власти"
 r56.news_event.1.desc:0 "После поражения Италии в Эфиопии и недавнего мирного соглашения между итальянским и эфиопским правительствами почти во всех крупных городах Италии начались массовые протесты с требованиями отстранить Муссолини от должности премьер-министра и провести выборы. Из-за серьёзных общественных беспорядков и угрозы массовых столкновений Виктор Эммануил III сместил Муссолини и назначил генерала Пьетро Бадольо временно исполняющим обязанности главы правительства. Позднее толпа в Риме ворвалась в штаб-квартиру фашистской партии и обнаружила Муссолини мёртвым от огнестрельного ранения, нанесённого самому себе."
 r56.news_event.1.a:0 "Итальянская некомпетентность снова даёт о себе знать..."
 r56.news_event.2.t:0 "Чемпионат мира 1938 года"
 r56.news_event.2.desc:0 "Недавно во Франции состоялся чемпионат мира. Это было третье издание турнира. Пятнадцать команд приняли участие в турнире по стук-стилю.\n \n[SWI.GetName] расстраивать [GER.GetName] в первом раунде. Хотя [SWI.GetName] были выбиты в следующем раунде [HUN.GetName]. The [HUN.GetAdjective] Команда прошла весь путь до финала, но в конечном итоге потерпела поражение. [ITA.GetName]. Это [ITA.GetName]Второй раз выиграл турнир.\n \n Чемпионат мира был приятным развлечением для многих. Уводит умы от грозовых облаков, которые формируются по всему миру."
 r56.news_event.2.a:0 "Повторим через четыре года."
 r56.news_event.2.b:0 "Слава всем [ITA.GetAdjective]С!"
 r56.news_event.3.t:0 "Албания вступает в Коминтерн"
 r56.news_event.3.d:0 "Председатель Коммунистической партии Албании Энвер Ходжа направил просьбу о вступлении в Коминтерн. Советский Союз принял её, и бывшее Королевство Албания стало частью Третьего интернационала. Обе страны разделяют схожие идеи и стремления, поэтому их дружба кажется прочной, а Албания рассчитывает на светлое будущее в Европе."
 r56.news_event.3.a:0 "Ещё одна победа пролетариата."
 r56.news_event.4.t:0 "Албания вступает в Ось"
 r56.news_event.4.d:0 "Германия приняла просьбу Албании о вступлении в Ось. Теперь они вместе противостоят коммунизму и демократическим странам. Король Зогу выразил желание показать всему миру мощь своей страны. Великобритания и Франция заявили о беспокойстве ростом фашизма в Европе и напомнили немецким представителям о требованиях Версальского договора. Однако западные демократии, похоже, не намерены активно выступать против Германии и Албании."
 r56.news_event.4.a:0 "Ещё одна страна преклонила колено перед Германией."
 r56.news_event.6.t:0 "Чемпионат мира 1942 года"
 r56.news_event.6.desc:0 "Чемпионат мира по футболу недавно прошел в [URG.GetNameDef]. Это было четвертое издание турнира. Шестнадцать команд приняли участие в турнире по стук-стилю.\n \nВозвращающийся [ITA.GetAdjective] Чемпионы были побеждены во втором раунде хозяевами. Хотя бег хозяев закончится в полуфинале, поскольку они были побеждены. [GER.GetNameDef]. The [GER.GetAdjective] Команда пойдет на победу в финале, победив [BRA.GetName] В напряженной игре. Это было [GER.GetName]Первый раз выиграл турнир.\n \n Чемпионат мира был приятным развлечением для многих. Отвлечься от напряжённой политической ситуации, складывающейся во всём мире."
 r56.news_event.6.a:0 "Повторим через четыре года."
 r56.news_event.6.b:0 "Слава всем [GER.GetAdjective]С!"
 r56.news_event.7.t:0 "[BRA.GetLeader] приходит к власти в Бразилии"
 r56.news_event.7.d:0 "Утренние новости потрясли значительную часть Латинской Америки: [BRA.GetLeader] взял под контроль бразильское правительство и вооружённые силы. Столь резкая смена руководства стала неожиданностью для многих иностранных наблюдателей и даже некоторых граждан Бразилии. Однако представители бразильской политики утверждают, что подобный поворот был ожидаемым с учётом внутренних конфликтов последнего десятилетия.\n\nНикто не знает, какой курс выберет новое правительство, но многие подозревают, что оно немедленно приступит к экспансии."
 r56.news_event.7.a:0 "Тревожное развитие событий."
 r56.news_event.7.b:0 "Независимость или смерть!"
 r56.news_event.8.t:0 "Военный переворот в Парагвае"
 r56.news_event.8.d:0 "После прошлогодней войны в Чако, которую Парагвай сумел выиграть. Парагвайское правительство по-прежнему сохраняло слабое руководство Эйсебио Айала, но [PAR.GetLeader] Он организовал государственный переворот, проведя время в изгнании.[PAR.GetLeader] Он быстро установил гораздо более сильный военный режим.\n\nПравительству Парагвая, скорее всего, теперь нужно будет реорганизоваться после изгнания многих лоялистов Айалы."
 r56.news_event.8.a:0 "Интересное развитие событий."
 r56.news_event.8.b:0 "Это было необходимо."
 r56.news_event.9.t:0 "Гражданская война в Парагвае"
 r56.news_event.9.d:0 "После победы Парагвая в прошлогодней Чакской войне страной по-прежнему руководил слабый Эусебио Айяла. Полковник Рафаэль Франко, вернувшийся из изгнания, попытался совершить государственный переворот и установить более сильный военный режим. Однако переворот пошёл не по плану: Айялу предупредили о заговоре, и он призвал другие политические партии взяться за оружие против военных.\n\nПохоже, этот политический спор можно разрешить лишь кровью."
 r56.news_event.9.a:0 "Будем надеяться на скорое завершение."
 r56.news_event.9.b:0 "Мы победим!"
 r56.news_event.10.t:0 "[From.GetNameDefCap] провозглашает экспансионистскую политику"
 r56.news_event.10.d:0 "\nСегодня в столице [FROM.GetNameDef]. [FROM.GetLeader] Он сказал людям своей страны, что они должны смотреть за пределы своих границ ради славы и счастья. Что им нужно расширить границы, которые страна в настоящее время тормозит.[FROM.GetLeader] Он также многократно упоминал о преступлении, которое [ROOT.GetName] против него выступил [FROM.GetName]. Хотя, если это просто жесткие разговоры или что такие амбиции материализуются в конфликт еще предстоит увидеть. Хотя [FROM.GetName]Соседи обеспокоены возможным конфликтом в регионе. Многие надеются на дипломатическое решение проблемы. [FROM.GetName]Проблемы с соседями."
 r56.news_event.10.a:0 "Это, мягко говоря, тревожно."
 r56.news_event.11.t:0 "United Fruit Company захватывает власть в Гондурасе"
 r56.news_event.11.d:0 "United Fruit Company работает в Гондурасе с 1899 года, когда приобрела семь местных производителей бананов и начала экспортировать их в Новый Орлеан. С тех пор компания всё активнее вмешивалась в политику страны. Однако последний шаг стал беспрецедентной эскалацией: похоже, United Fruit Company полностью захватила власть в небольшом латиноамериканском государстве.\n\nЧто это означает для остальной Центральной Америки, пока неизвестно."
 r56.news_event.11.a:0 "Это не сулит ничего хорошего."
 r56.news_event.11.b:0 "Зато бананы подешевеют."
 r56.news_event.11.c:0 "Это всего лишь бизнес."
 r56.news_event.12.t:0 "В Центральной Америке создана «зона свободного предпринимательства»"
 r56.news_event.12.d:0 "\nПосле захвата Гондураса United Fruit Company дела предприятия Сэмюэля Земуррея шли хорошо. Однако под поверхностью росло недовольство безжалостностью бизнесмена и его полным контролем над государственной деятельностью. Сегодня утром группа влиятельных членов совета директоров United Fruit Company свергла Земуррея в ходе переворота. Они быстро создали новое правительство, которое, по их словам, обеспечит «идеальные» условия для бизнеса. Заговорщики передали частным компаниям полный контроль над повседневной жизнью страны. Первым радикальным шагом стала приватизация армии и правоохранительных органов с передачей их конкурирующим агентствам по реституции, передаче и возмещению."
 r56.news_event.12.a:0 "Интересный эксперимент."
 r56.news_event.12.b:0 "Чем свободнее рынок, тем свободнее народ!"
 r56.news_event.12.c:0 "Отвратительное образование."
 r56.news_event.14.t:0 "[COL.GetNameDefCap] провозглашает великоколумбийские амбиции"
 r56.news_event.14.d:0 "\nСегодня в столице [COL.GetNameDef]. [COL.GetLeader] Он сказал людям своей страны, что они должны смотреть за пределы своих границ ради славы и счастья. Что им нужно расширить границы, которые страна в настоящее время тормозит.[FROM.Getleader] Также много упоминалось о восстановлении бывших земель, составлявших Гран-Колумбию. Хотя, если это просто жесткие разговоры или что такие амбиции материализуются в конфликт еще предстоит увидеть. [COL.GetName]Соседи обеспокоены возможным конфликтом. Похоже, что война может быть на горизонте. [COL.GetName]Соседи."
 r56.news_event.14.a:0 "Тревожный поворот событий."
 r56.news_event.14.b:0 "Возможно, нам придётся вмешаться..."
 r56.news_event.14.c:0 "Никто не остановит наши амбиции."
 r56.news_event.13.t:0 "Третья гражданская война в Чили"
 r56.news_event.13.d:0 "После недавних политических событий в Чили движение нацистас стало ещё враждебнее к действующему правительству. Сегодня утром большое число воинствующих фашистов во главе с Хорхе Гонсалесом фон Мареэсом попыталось свергнуть чилийскую власть. Правительству удалось обезопасить военные части на севере, и оно готовит ответ. Однако сила движения нацистас была серьёзно недооценена: к ним присоединились многие бывшие чилийские офицеры и часть нынешнего младшего командного состава. К сожалению, за последние сутки столкновения переросли в полномасштабную гражданскую войну."
 r56.news_event.13.a:0 "Тревожное развитие событий."
 r56.news_event.13.b:0 "Мы раздавим фашистскую мразь!"
 r56.news_event.16.t:0 "Эскалация конфликта между Эквадором и Перу"
 r56.news_event.16.d:0 "С 1935 года между гарнизонами [ECU.GetnameDEF] и [PRU.GetnameDEF] продолжаются пограничные столкновения в спорном регионе Пичинча. Дипломатическим усилиям двух стран до недавнего времени удавалось не допустить перерастания стычек в полномасштабный конфликт. Однако последние дипломатические споры привели к тупику, который за минувшую неделю перерос в настоящую войну.\n\nНаблюдатели надеются, что конфликт останется ограниченным регионом Пичинча и не втянет обе страны в нынешнюю катастрофическую международную обстановку."
 r56.news_event.16.a:0 "Прискорбно."
 r56.news_event.16.a.1:0 "Будем надеяться, что война не затянется."
 r56.news_event.16.a.2:0 "Мы их разгромим!"
 r56.news_event.inc.t:0 "Возрождение Империи инков"
 r56.news_event.inc.d:0 "Народы Анд в Южной Америке давно ждали Инкари — небесное существо, которое вернётся и вновь объединит кечуа, как некогда Пачакутек.\nТеперь [PRU.GetLeader] предстоит вернуть древней Империи инков былое великолепие, опираясь на силу народов кечуа Южной Америки.\n\nНовое государство становится региональной державой, намеренной потеснить нынешних лидеров — [ARG.GetnameDEF] и [BRA.GetnameDEF] — и даже бросить вызов главной силе континента, [USA.GetnameDEF]. Кечуа создали крупную армию, хорошо подготовленную к войне в горах."
 r56.news_event.inc.a:0 "Пора вернуться к своим корням."
 r56.news_event.inc.b:0 "Неужели в Южной Америке рождается новая держава?"
 r56.news_event.2010.t:0 "Генерал Урета приходит к власти в Перу"
 r56.news_event.2010.d:0 "После политического соперничества с Альберто Флоресом генерал Элой Урета стал правителем Перу. Ему предстоит продолжить наследие Санчеса Серро и завершить его незаконченные проекты. Поскольку Урета с самого начала состоял в Урристском движении, реформы, вероятно, начнутся очень скоро, а партия отдалится от влияния итальянского фашизма.\n\nФашисты намерены уничтожить партию APRA в Перу и очистить всю Южную Америку от так называемой «красной раковой опухоли», протянувшей щупальца террора от Москвы до континента.\nТысячи перуанцев уже поверили словам Элоя Уреты и готовы последовать за ним даже на войну."
 r56.news_event.2010.a:0 "Да здравствует Перу!"
 r56.news_event.2010.b:0 "Это новое начало для Перу."
 r56.news_event.2011.t:0 "Перуанские чернорубашечники приходят к власти"
 r56.news_event.2011.d:0 "Чернорубашечники, созданные урристом Луисом Альберто Флоресом для противодействия волне коммунизма, представленной партией APRA и Коммунистической партией Перу, захватили власть. Защита католицизма помогла Флоресу возглавить партию «Революционный союз», и теперь он правит Перу, ориентируясь на итальянский фашизм.\n\nФашисты намерены уничтожить партию APRA в Перу и очистить всю Южную Америку от так называемой «красной раковой опухоли», протянувшей щупальца террора от Москвы до континента.\nТысячи перуанцев уже поверили словам Альберто Флореса и готовы последовать за ним даже на войну."
 r56.news_event.2011.a:0 "Да здравствует Перу!"
 r56.news_event.2011.b:0 "Это новое начало для Перу."
 r56.news_event.2012.t:0 "Великий марш Трухильо"
 r56.news_event.2012.d:0 "После периода жестоких нарушений прав человека диктатором Бенавидесом и его предшественником Санчесом Серро, чьи действия привели к многочисленным смертям в Перу, отмена выборов стала последней каплей. Коммунисты поклялись взяться за оружие и свергнуть Бенавидеса.\n\nРеволюция положит конец чудовищной детской смертности: 60% перуанских детей умирают, не достигнув десятилетнего возраста, и эти цифры подтверждены перуанскими и иностранными специалистами. На протяжении многих лет гражданские правительства и олигархи ничего не делали для решения проблемы децентрализации Перу.\nВероятность распространения революции по всей Латинской Америке крайне высока."
 r56.news_event.2012.a:0 "Да здравствует революция!"
 r56.news_event.2012.b:0 "Теперь власть в руках перуанского народа."
 r56.news_event.2013.t:0 "[PRU.GetLeader] Принимает трон [PRU.GetNameDefCap]"
 r56.news_event.2013.d:0 "[PRU.GetLeader] Только что принял трон [PRU.GetNameDefCap] По просьбе временного правительства, после большой республиканской истории более 100 лет и не видя заметных достижений в своей стране, большинство перуанцев предпочли восстановление монархии в Перу, чтобы вернуть то древнее великолепие эпохи вице-царства, где был лидер Южной Америки в торговле и экономике.\n\nНовый король призвал бы к единству всех перуанцев, но в стране, настолько политически разделенной, что могут быть противники нового режима, королю пришлось бы использовать сильную руку, чтобы контролировать своих недоброжелателей и объединить всю страну."
 r56.news_event.2013.a:0 "Да здравствует король [PRU.GetLeader]!"
 r56.news_event.2013.b:0 "Неужели в Южной Америке рождается новая держава?"
 r56.news_event.17.t:0 "[new_controller.GetNameDefCap] восстаёт против [FROM.GetAdjective] оккупации!"
 r56.news_event.17.d:0 "\nПосле нескольких месяцев ожесточённой партизанской борьбы [new_controller.GetAdjective] силы сопротивления вышли из подполья и начали скоординированное восстание против [FROM.GetAdjective] угнетения. Гарнизоны быстро оказались в окружении, и, осознав безнадёжность положения, [FROM.GetAdjective] войска отступили на подконтрольные территории.\n\nХотя это серьёзная неудача для [FROM.GetLeader] и его вооружённых сил, война ещё не окончена, и контратака остаётся возможной.\nОчевидно, что [new_controller.GetAdjective] движению сопротивления придётся превратиться в настоящую армию, если оно хочет продолжать традиционные военные операции."
 r56.news_event.17.a:0 "Неужели это кровопролитие никогда не закончится?"
 r56.news_event.18.t:1 "Испанская Америка воссоединилась"
 r56.news_event.18.d:1 "Впервые со времён Испанской империи все испаноязычные народы Америки объединились под единым знаменем. Их сплотило стремление самостоятельно определять свою судьбу и стоять на равных с европейцами и англоамериканцами.\nПосле этого, казалось бы, невозможного достижения паниспанская пропаганда получила явную поддержку правительства, а Испанскую Америку охватили надежды. Теперь [From.GetOldAdjective] правительство приступило к медленному объединению различных органов и организаций новых испаноамериканских территорий в эффективные институты, одновременно приняв официальное название «[From.GetNameDef]». Дальнейший путь Испаноамерики пока неясен — лишь время покажет, какое будущее ждёт эту восходящую американскую державу."
 r56.news_event.18.a:1 "Ещё один шаг к мечте."
 r56.news_event.18.b:1 "Неужели дух Боливара вернулся?"
 r56.news_event.19.t:0 "[USA.getnameDefCap] захватывает Гренландию"
 r56.news_event.19.d:0 "\nСегодня утром из Вашингтона пришли необычные новости: датский дипломат Хенрик Кауфманн недавно подписал соглашение о передаче контроля над Гренландией [USA.getnameDEF]. Кауфманн встретился с представителями [USA.GetLeader], чтобы официально оформить договор. Власти Нуука сами попросили его выдвинуть это предложение, предпочитая американскую оккупацию возможному захвату со стороны [ENG.getnameDEF] или [CAN.getnameDEF]. Наблюдатели выразили сомнения в законности сделки с точки зрения международного права, однако американское правительство быстро подписало соглашение, проигнорировав возражения."
 r56.news_event.19.a:0 "Гренландия? Теперь это наша земля."
 r56.news_event.19.b:0 "Смелый шаг со стороны Америки."
 r56.news_event.19.c:0 "Как они смеют похищать то, что мы законно украли!"
 r56.news_event.20.t:0 "Уйгурское исламское восстание в Синьцзяне"
 r56.news_event.20.d:0 "Поскольку в конце восстания Кумуля 1934 года не удалось, наконец, добиться мира в раздираемом войной регионе Синьцзян, кажется, что напряженность снова достигла критической точки. [SIK.Getleader] Все более автономные уйгурские мусульманские ополчения в Кашгаре, где [SIK.Getleader]Влияние его ослабевало в течение довольно долгого времени. Использование обширных [SOV.GetAdjective] поддержка, [SIK.Getleader] стремится подорвать как южное уйгурское ополчение, так и китайских полевых командиров Хуэй на юге, которые [KHM.Getleader]Возглавляет «новую 36-ю дивизию» Национальной революционной армии Китая.\n\nМожно только надеяться, что когда все это закончится, напряженность и конфликты по крайней мере на какое-то время оставят раздираемый войной Синьцзян."
 r56.news_event.20.a:0 "Вы не оставили мне выбора!"
 r56.news_event.20.b:0 "Всего лишь перестановка пешек."
 r56.news_event.20.c:0 "Где же провести черту..."
 r56.news_event.21.t:0 "Франция заключает союз с [USA.GetNameDef]"
 r56.news_event.21.d:0 "В торжественной речи президент [USA.getLeader] объявил о союзе с [FRA.GetAdjective] правительством. Он добавил, что этот союз будет столь же прочным, как решимость, объединявшая основателя страны Джорджа Вашингтона и его соратника маркиза де Лафайета.\n\nТеперь [USA.GetAdjective] и [FRA.GetAdjective] народы стоят плечом к плечу, защищая свою свободу."
 r56.news_event.22.t:0 "Наполеон приходит к власти во Франции"
 r56.news_event.22.desc:0 "При поддержке значительной части армии Луи, глава дома Бонапартов, пришёл к власти во Франции и принял тронное имя Наполеон VI. Согласно официальным заявлениям, это не насильственный захват, а способ положить конец парламентским распрям, поставив над партиями компромиссную фигуру и тем самым позволив республике вновь процветать.\n\nНесмотря на республиканскую риторику, новая власть постоянно обращается к памяти Первой французской империи, а официальная оппозиция в новой «республике» императора серьёзно ограничена."
 r56.news_event.22.a:0 "Он определённо не из наших!"
 r56.news_event.22.b:0 "Бонапартизм всегда был замаскированной буржуазной диктатурой."
 r56.news_event.22.c:0 "Сколько времени пройдёт, прежде чем партий не останется вовсе?"
 r56.news_event.22.e:0 "Угроза или возможный союзник?"
 r56.news_event.22.d:0 "Да здравствует император!"
 r56.news_event.23.t:0 "Гражданская война в Румынии"
 r56.news_event.23.desc:0 "Оказавшись под угрозой со стороны короля, румынская националистическая Железная гвардия открыто восстала против правительства. При поддержке влиятельных союзников в армии ей удалось захватить значительную часть страны.\n\nВыступая перед толпой сторонников, её лидер объявил об упразднении монархии и провозгласил Румынию Национал-легионерским государством."
 r56.news_event.23.a:0 "Румынскую монархию необходимо защитить."
 r56.news_event.23.b:0 "Это высшее проявление междоусобной борьбы буржуазного капитализма."
 r56.news_event.23.c:0 "Ещё одна страна разорвана экстремистами."
 r56.news_event.23.e:0 "Железная гвардия должна победить."
 r56.news_event.24.t:0 "Румынские монархисты складывают оружие"
 r56.news_event.24.desc:0 "После объявления о капитуляции румынских монархистов Железная гвардия триумфально прошла по улицам Бухареста. Победив в войне, новая «Национал-легионерская Румыния» теперь должна выиграть мир и утвердить свою легитимность как единственного выразителя воли румынского народа."
 r56.news_event.24.a:0 "Ещё одна корона пала перед опасными революционерами."
 r56.news_event.24.b:0 "Таков итог буржуазной конкуренции."
 r56.news_event.24.c:0 "Риск Кодряну оправдался."
 r56.news_event.24.d:0 "Риск Кодряну оправдался."
 r56.news_event.25.t:0 "Конец гражданской войны в Румынии"
 r56.news_event.25.desc:0 "Попытка переворота фашистской Железной гвардии, военизированного крыла румынской партии «Всё для страны», была разгромлена силами, сохранившими верность монархии.\n\nМногие фашисты отказались сдаться и последовали своим словам о почитании смерти и готовности её нести. Однако часть руководителей предпочла изгнание, чтобы обеспечить выживание движения."
 r56.news_event.25.a:0 "Государственные институты устояли."
 r56.news_event.25.b:0 "Хаос среди буржуазии делает наш подъём неизбежным."
 r56.news_event.25.c:0 "Государственные институты устояли."
 r56.news_event.25.d:0 "Поздравляем Кодряну!"
 r56.news_event.26.t:0 "Гражданская война в Италии"
 r56.news_event.26.desc:0 "После того как король Виктор Эммануил III отстранил так называемого дуче Бенито Муссолини от должности премьер-министра, тот собрал сторонников в Северной Италии и вернулся к своим республиканским корням.\n\nВыступая перед приверженцами в городе Сало, он заявил, что по-настоящему фашистская страна должна следовать за одним диктатором, добавив, что древние римляне особенно презирали монархию."
 r56.news_event.26.a:0 "Дом Савойи необходимо защитить."
 r56.news_event.26.b:0 "Это высшее проявление междоусобной борьбы буржуазного капитализма."
 r56.news_event.26.c:0 "Родина фашизма демонстрирует всю глубину его провала."
 r56.news_event.26.e:0 "Фашисты должны победить и доказать силу нашего идеала."
 r56.news_event.27.t:0 "Гражданская война в Италии окончена"
 r56.news_event.27.desc:0 "Дуче Бенито Муссолини обратился к толпе сторонников, объявив о победе Итальянской социальной республики. Подразделения вроде X Battaglia MAS и части Республиканской национальной гвардии прошли парадом по Виа дель Имперо среди руин Римского форума. Хотя Италия и прежде была фашистской, полная чистка оппозиции предвещает ещё более жёсткое применение фашистской политики, возможно, даже новый свод законов «фашистиссиме».\n\nТем временем многие представители оппозиции были арестованы, а ещё больше предпочли изгнание."
 r56.news_event.27.a:0 "Фашизм, очевидно, трудно искоренить."
 r56.news_event.27.b:0 "Фашизм, очевидно, трудно искоренить."
 r56.news_event.27.c:0 "Фашизм, очевидно, трудно искоренить."
 r56.news_event.27.e:0 "Ещё одно доказательство силы фашизма."
 r56.news_event.28.t:0 "Гражданская война в Италии окончена"
 r56.news_event.28.desc:0 "[ITA.GetLeader] празднует победу после капитуляции последних мятежников перед частями Королевской итальянской армии. В базилике Санта-Мария-ад-Мартирес, также известной как Пантеон, прошла торжественная месса по жертвам гражданской войны, за которой последовало покаянное шествие.\n\nМонархия восстановлена. Откроет ли король парламент и позволит ли политической жизни возродиться или укроется за формой королевской диктатуры? Пока рано судить."
 r56.news_event.28.a:0 "Трон спасён!"
 r56.news_event.28.b:0 "Феодально-буржуазный капитализм — полная противоположность власти пролетариата."
 r56.news_event.28.c:0 "Нет войны страшнее гражданской."
 r56.news_event.28.e:0 "Нет войны страшнее гражданской."
 r56.news_event.29.title:0 "Напряжённость между [VEN.GetName] и [695.Owner.GetName] нарастает"
 r56.news_event.29.desc:0 "\nНапряжение резко усилилось после того, как лидер Венесуэлы [VEN.GetLeader] ясно заявил, что остров Кюрасао, расположенный всего в 60 километрах от побережья Венесуэлы, по праву принадлежит стране и должен быть возвращён, даже силой.\n\nЕсли две страны не достигнут мирного соглашения по этому спору, вокруг острова может вспыхнуть конфликт."
 r56.news_event.29.a:0 "Незначительно."
 r56.news_event.29.b:0 "Он принадлежит нам по праву."
 r56.news_event.30.title:0 "Союзная оккупация Германии"
 r56.news_event.30.desc:0 "После завершения Второй великой войны в Европе Союзники установили полный контроль над Германией и разделили её между четырьмя оккупационными державами: британцами и французами на западе, американцами и Советами на востоке. Сколько времени потребуется этим землям для восстановления и денацификации, неизвестно."
 r56.news_event.30.a:0 "Никогда больше."
 r56.news_event.31.title:0 "[JAP.getAdjective] дипломатическая миссия начинает переговоры о зарубежном союзе"
 r56.news_event.31.desc:0 "\nРазведка сообщает об усиленной деятельности [JAP.getAdjective] министерства иностранных дел. Его дипломаты направляются в другие страны, очевидно пытаясь установить дружественные отношения с потенциальными союзниками.\n\nПока неизвестно, принесут ли переговоры результаты, но нам необходимо внимательно следить за развитием ситуации и готовиться к худшему исходу."
 r56.news_event.31.a:0 "Следует сохранять бдительность."
 r56.news_event.32.title:0 "Гёринг вновь объявляется в Техасе!"
 r56.news_event.32.desc:0 "\nПоявилась фотография, свидетельствующая, что Герман Гёринг выжил и бежал в [375.Controller.GetNameDef]. Бывший немецкий ас, поддержавший Гитлера на пути к власти, пропал без вести после завершения конфликта, разорившего Германию, и считался погибшим. Похоже, он покинул родину на самолёте, способном увезти его самого, часть гардероба и образцы художественной коллекции.\n\nПосле прибытия его встретили и укрыли [375.Controller.GetAdjective] поклонники, и в дальнейшем он может начать сотрудничество с [375.Controller.GetAdjective] военно-воздушными силами."
 r56.news_event.32.a:0 "Если сбежал он, сколько нацистов сделали то же самое?"
 r56.news_event.32.b:0 "Добро пожаловать в [375.Controller.GetNameDef]."
 r56.news_event.32.c:0 "Так вот куда делся этот мерзавец!"
 r56.news_event.33.t:0 "Кельтский мир объединяется"
 r56.news_event.33.desc:0 "После недавних событий кельтский мир объединился под руководством [FROM.GetLeader]. Кельтское правительство объявило, что обеспечит защиту и развитие традиций государством. Для этого оно уже призвало к поддержке неодруидические и необардические движения, чтобы распространять кельтизм.\n\nПока в [FROM.Capital.GetCapitalVictoryPointName] проходят празднования, противники нового государства критикуют непростой процесс создания союза. Они также сходятся во мнении, что мощный флот способен блокировать Ирландское море и разъединить различные части нового объединения, угрожая его единству."
 r56.news_event.33.a:0 "За столетия унижений отомщено!"
 r56.news_event.33.b:0 "Захватывающе!"
 r56.news_event.33.c:0 "Какое тревожное развитие событий."
 r56.news_event.34.t:0 "Левант объединяется"
 r56.news_event.34.desc:0 "После недавних событий весь Левант объединился под руководством [FROM.GetLeader]. Панарабское правительство объявило, что защитит святые места от иностранных агрессоров.\n\nПока в [FROM.Capital.GetCapitalVictoryPointName] проходят празднования, противники нового государства критикуют непростой процесс создания союза. Тем не менее они признают, что религия, вероятно, станет объединяющей силой для мусульманского арабского населения."
 r56.news_event.34.a:0 "За унижение 1919 года отомщено!"
 r56.news_event.34.b:0 "Захватывающе!"
 r56.news_event.34.c:0 "Какое тревожное развитие событий."
 r56.news_event.35.t:0 "Карибские острова объединены"
 r56.news_event.35.desc:0 "После недавних событий главные острова Карибского архипелага объединились под руководством [FROM.GetLeader]. [FROM.GetAdjective] правительство объявило, что обеспечит защиту всех жителей и добьётся международного признания страны.\n\nПока в [FROM.Capital.GetCapitalVictoryPointName] проходят празднования, противники нового государства критикуют непростой процесс создания союза. Они также отмечают, что мощный флот способен блокировать Карибское море и разделить части нового объединения, угрожая его единству. Некоторые даже считают, что это вынудит их использовать подводные лодки для своеобразного современного пиратства."
 r56.news_event.35.a:0 "Ура!"
 r56.news_event.35.b:0 "Захватывающе!"
 r56.news_event.35.c:0 "Какое тревожное развитие событий."
 r56.news_event.36.t:0 "[FROM.GetLeader] объединяет территории Ла-Платы"
 r56.news_event.36.desc:0 "\nПосле недавних событий страны, входившие при испанском владычестве в вице-королевство Рио-де-ла-Плата, объединились под руководством [FROM.GetLeader]. [FROM.GetAdjective] правительство объявило, что защитит всех жителей и добьётся признания страны во всём мире.\n\nПока в [FROM.Capital.GetCapitalVictoryPointName] проходят празднования, противники нового государства критикуют непростой процесс создания союза."
 r56.news_event.36.a:0 "Ура!"
 r56.news_event.36.b:0 "Захватывающе!"
 r56.news_event.36.c:0 "Какое тревожное развитие событий."
 r56.news_event.37.t:0 "[FROM.GetLeader] провозглашает [FROM.GetNameDef]"
 r56.news_event.37.desc:0 "\nАфриканский континент быстро меняется. Во время церемонии в столице [FROM.Capital.GetCapitalVictoryPointName] [FROM.GetLeader] провозгласил создание нового объединения под названием [FROM.GetNameDef]. [FROM.GetAdjective] правительство объявило, что защитит всех жителей и добьётся международного признания страны.\n\nЭта новость вызывает вопросы о способности нового союза стать крупной силой на континенте."
 r56.news_event.37.a:0 "Ура!"
 r56.news_event.37.b:0 "Захватывающе!"
 r56.news_event.37.c:0 "Какое тревожное развитие событий."
 r56.news_event.38.t:0 "Британия воссоединена"
 r56.news_event.38.desc:0 "\nЛондон празднует: английское правительство установило контроль над всем островом Британия и провозгласило новый акт об унии, тем самым фактически воссоединив Великобританию.\n\nПока Лондон ликует, другие державы могут опасаться возвращения [FROM.GetAdjective] империализма на мировую арену."
 r56.news_event.38.a:0 "Ура!"
 r56.news_event.38.b:0 "Захватывающе!"
 r56.news_event.38.c:0 "Какое тревожное развитие событий."
 r56.news_event.39.t:0 "Германия воссоединена"
 r56.news_event.39.desc:0 "Немецкий народ вновь объединён под единым правительством. [FROM.getleader] немедленно начали сравнивать с Отто фон Бисмарком, поскольку ему удалось повторить или даже превзойти политические достижения «железного канцлера».\n\nПока Берлин празднует, другие державы могут опасаться возвращения [FROM.GetAdjective] вооружённых сил на мировую арену."
 r56.news_event.39.a:0 "Нас больше никогда не разделят!"
 r56.news_event.39.b:0 "Говорите, немцы вернулись? Что же может пойти не так?"
 r56.news_event.39.c:0 "Какое тревожное развитие событий."
 r56.news_event.40.t:0 "[ROM.GetNameDefCap] привлекает Венгрию на свою сторону"
 r56.news_event.40.desc:0 "\nПод давлением со стороны [ROM.getAdjective] правительство, [HUN.getLeader] Договор о дружбе, который войдет в состав обеих стран [ROM.GetFactionName]. Это, несомненно, сделает Венгрию зависимой от Румынии в вопросах обороны, но не решит венгерскую напряженность относительно судьбы магьярофонов, живущих в Трансильвании. Говорят, что некоторые уступки были сделаны в пользу секлеров, но они не были приняты. [ROM.GetAdjective] Правительство может ограничить их влияние на практике."
 r56.news_event.40.a:0 "Это обеспечит безопасность Румынии."
 r56.news_event.40.b:0 "Наши враги расширяются!"
 r56.news_event.41.t:0 "[BRA.GetNameDefCap] поворачивается к Атлантике"
 r56.news_event.41.desc:0 "\nПосле заявления [BRA.getLeader] о необходимости контролировать жизненно важные торговые пути между [BRA.GetNameDef] и остальным миром [BRA.GetAdjective] внешняя политика начала искать союзников среди стран Атлантики. Для достижения этой цели был провозглашён [BRA.GetFactionName], а дипломатические усилия должны обеспечить успех нового курса."
 r56.news_event.41.a:0 "Это обеспечит [BRA.GetAdjective] Охрана."
 r56.news_event.41.b:0 "Наши враги расширяются!"
 r56.news_event.42.t:0 "Подписан [BRA.GetFactionName]"
 r56.news_event.42.desc:0 "\nСледуя обещанию [BRA.getLeader] бороться с экспансионистскими режимами по всей Южной Америке, в [BRA.Capital.GetCapitalVictoryPointName] был подписан новый союзный договор под названием [BRA.GetFactionName].\n\nСудя по числу присутствовавших делегатов, послов и министров иностранных дел, он наверняка серьёзно повлияет на политическое развитие региона, а возможно, и всего мира."
 r56.news_event.42.a:0 "Это обеспечит [BRA.GetAdjective] Охрана."
 r56.news_event.42.b:0 "Наши враги расширяются!"
 r56.news_event.43.t:0 "[SWE.GetNameDefCap] создаёт собственную систему оборонительной дипломатии"
 r56.news_event.43.desc:0 "\nНесколько изменив традиционный курс нейтралитета, [SWE.GetAdjective] правительство решило создать организацию оборонительного договора, которая станет основой его политики безопасности.\n\nЭто даст стране союзников и поможет обезопасить окружающий регион, но также может втянуть её в войны из-за судьбы иностранных государств."
 r56.news_event.43.a:0 "Это обеспечит [SWE.GetAdjective] Охрана."
 r56.news_event.43.b:0 "Наши враги расширяются!"
 r56.news_event.45.t:0 "Польша и Украина совместно управляют Западной Украиной"
 r56.news_event.45.desc:0 "\nС самого появления украинского государства его существование имело огромные политические последствия для Галиции и Волыни. Ещё до распада СССР Украинское национально-демократическое объединение и другие украинские партии требовали большей автономии, тогда как ультранационалисты ОУН прибегали к политическим убийствам. Кроме того, на 1944 год в регионе первоначально планировался плебисцит. Вместо этого после переговоров с [UKR.GetAdjective] правительством [POL.Capital.GetName] согласилась расширить «Волынский эксперимент» и установить кондоминиум над Западной Украиной. Местные украинцы получат широкую автономию под руководством [DOU.Getleader], а Хенрик Юзевский станет связующим звеном между [DOU.Capital.GetName] и [POL.Capital.GetName]."
 r56.news_event.45.a:0 "Придётся переделывать все карты."
 r56.news_event.45.b:0 "Выгодный компромисс!"
 r56.news_event.45.c:0 "Выгодный компромисс!"
 r56.news_event.46.t:0 "[USA.GetNameDefCap] восстанавливает [ENG.getAdjective] суверенитет над территориями сделки «эсминцы в обмен на базы»"
 r56.news_event.46.desc:0 "\n\nСоглашение «эсминцы в обмен на базы» предусматривало передачу кораблей [ENG.GetNameDef] в обмен на территориальный контроль над [ENG.getAdjective] владениями. Теперь, когда его значение уменьшилось, [USA.getLeader] подписал исполнительный указ о выводе [USA.getAdjective] вооружённых сил и их перебазировании. Местные [ENG.getAdjective] власти провели церемонии поднятия флага, ознаменовав возвращение к довоенному положению."
 r56.news_event.46.a:0 "The [USA.getAdjective] Уважают договоры"
 r56.news_event.46.b:0 "Нормально соблюдать договоры"
 r56.news_event.46.c:0 "Очередное англосаксонское соглашение."
 r56.news_event.47.t:0 "[ENG.GetNameDefCap] соглашается объединить [NFL.GetNonIdeologyName] с [CAN.GetNonIdeologyName]"
 r56.news_event.47.desc:0 "\n\nПо итогам местного референдума [ENG.GetAdjective] правительство согласилось на объединение [NFL.GetNonIdeologyName] с [CAN.GetNonIdeologyName]. На практике территория станет [CAN.GetAdjective] провинцией с определённой автономией."
 r56.news_event.47.a:0 "Что ж, теперь это их проблема."
 r56.news_event.47.b:0 "Ура!"
 r56.news_event.47.c:0 "Раз они этого хотят..."
 r56.news_event.48.t:0 "[ENG.GetNameDefCap] Восстановление [NFL.GetAdjective] Самоуправление"
 r56.news_event.48.desc:0 "\n\nПо итогам местного референдума [ENG.GetAdjective] правительство согласилось восстановить самоуправление в [NFL.GetNonIdeologyName]. Территория сохраняла автономию до 1934 года, когда была создана «Правительственная комиссия Ньюфаундленда», осуществлявшая прямое британское управление. Теперь эта эпоха наконец заканчивается восстановлением избираемого [NFL.getAdjective] автономного правительства."
 r56.news_event.48.a:0 "Они наконец оправились."
 r56.news_event.48.b:0 "Раз они этого хотят..."
 r56.news_event.48.c:0 "Ура!"
 r56.news_event.48.d:0 "Очередное англосаксонское соглашение."
 r56.news_event.49.t:0 "[CSA.GetNameDefCap] навязывает свои условия [USA.GetNameDef]"
 r56.news_event.49.desc:0 "\n\nПосле победоносной военной кампании [CSA.GetAdjective] вооружённые силы разгромили своих [USA.GetAdjective] противников и навязали янки суровый и унизительный договор. По словам представителя [CSA.getAdjective] министерства иностранных дел, это месть за отвратительную оккупацию наших штатов после первой войны за независимость. В [CSA.GetCapitalVictoryPointName] состоялся парад победы, который возглавил один из последних живых ветеранов прежнего конфликта. Хотя учебники пока продолжают называть его «гражданской войной», очевидно, что [CSA.getAdjective] власти намерены переименовать его в «первую войну за независимость», чтобы подчеркнуть полный разрыв с прежней [USA.getAdjective] историей."
 r56.news_event.49.a:0 "За Атланту отомщено! За Дикси!"
 r56.news_event.49.b:0 "Мы проиграли..."
 r56.news_event.49.c:0 "Ещё один признак того, что капитализм — это рабство."
 r56.news_event.49.d:0 "Тревожно..."
 r56.news_event.50.t:0 "Мексика избирает Льва Троцкого"
 r56.news_event.50.desc:0 "\nПосле жизни во Франции и Норвегии изгнанный коммунистический лидер Лев Троцкий был принят мексиканским правительством. Его пламенные речи сразу очаровали население, а вскоре его даже назначили специальным инспектором мексиканских вооружённых сил. Обладая новой широкой популярностью, изгнанник организовал успешную кампанию и был избран президентом Мексики. Над страной восходит красная заря, и лишь время покажет, использует ли он новую власть для отмены частной собственности и борьбы с капитализмом или бросит вызов Третьему коммунистическому интернационалу и попытается возглавить марксистов всего мира."
 r56.news_event.50.a:0 "Да здравствует революция!"
 r56.news_event.50.b:0 "Только он способен спасти рабочих!"
 r56.news_event.50.c:0 "Нам придётся разобраться с этим идеологическим предателем."
 r56.news_event.50.d:0 "Тревожно..."
 r56.news_event.52.t:0 "Провозглашён Инуитский союз"
 r56.news_event.52.d:0 "Долгое время Гренландия была закрыта и находилась под строгим [DEN.GetAdjective] контролем. После трёх столетий диктата Королевского гренландского торгового департамента в 1908 году её передали Министерству внутренних дел Дании, а недавно она обрела независимость. Теперь этот процесс продолжился созданием [GRN.GetNameDef], включившей недавно захваченные территории.\n\n[GRN.GetOldNameDefCap] стала первым современным государством для народов крайнего севера Америки. Ранее подобные идеи даже не рассматривались, но теперь, к удивлению многих, на карте появилось панинуитское государство."
 r56.news_event.52.a:0 "На вершине мира живут свободные инуиты!"
 r56.news_event.52.b:0 "Колониальные политические порядки рушатся..."
 r56.news_event.52.c:0 "Мы полностью готовы сражаться в их суровом климате."
 r56.news_event.1116.t:0 "Кризис в [901.GetName]"
 r56.news_event.1116.d:0 "«Мы прорыли канал своими жизнями, костями и кровью. Суэцкий канал по праву принадлежит нам!» — заявил [EGY.GetAdjective] лидер [EGY.GetLeader], объявляя немедленную национализацию Компании Суэцкого канала с целью изгнать всё иностранное влияние и передать объект исключительно под [EGY.GetAdjective] контроль.\n\n[901.Owner.GetName] назвала этот шаг угрозой своим интересам в регионе и сделала [EGY.GetNameDef] суровое предупреждение: если Египет не отступит, будет применена военная сила для сохранения влияния над каналом.\n\nОбе стороны находятся на грани, и вскоре может начаться конфликт."
 r56.news_event.1116.a:0 "Канал по праву принадлежит нам."
 r56.news_event.1116.b:0 "Шаг вперёд для арабского мира."
 r56.news_event.1116.c:0 "[EGY.GetAdjective] сторону необходимо усмирить."
 r56.news_event.1116.e:0 "Мировой порядок меняется."
 r56.news_event.1117.t:0 "Националистическое восстание в Египте"
 r56.news_event.1117.d:0 "Националистические силы в [EGY.GetNameDef] во главе с «Братьями-мусульманами» подняли масштабное восстание против монархии. Они выступают как решительные антиимпериалисты и намерены навсегда изгнать иностранное влияние из Египта под руководством сильного лидера.\n\nЭто произошло вскоре после попыток иностранных держав укрепить свои интересы и влияние в стране. [EGY.GetAdjective] народ воспринял это как предательство, поскольку монархия прежде клялась сохранить Египет сильным и независимым. Не выполнив обещание, она довела людей до предела."
 r56.news_event.1117.a:0 "Наше унижение заканчивается сейчас."
 r56.news_event.1117.b:0 "Это восстание необходимо подавить."
 r56.news_event.1117.c:0 "Неужели это эффект домино на Ближнем Востоке?"
 r56.news_event.1119.t:0 "Восстание в [SUD.GetNonIdeologyName]"
 r56.news_event.1119.d:0 "Напряженность растет в [SUD.GetNonIdeologyName] в течение нескольких месяцев, когда население становится все более недовольным [EGY.GetAdjective] оккупация. Жесткая политика, навязанная [EGY.GetAdjective]Они лишь разжигали гнев и волнения среди народа. [SUD.GetAdjective] людей.\n\n В ответ на эти условия группа суданских националистических лидеров объединилась, чтобы начать вооруженное восстание против Судана. [EGY.GetAdjective] оккупанты. Несмотря на первоначальные неудачи, [SUD.GetAdjective] Повстанцы полны решимости продолжать борьбу.\n\nПоскольку обе стороны втянуты в конфликт и не желают отступить, неясно, как закончится этот конфликт. Но одно можно сказать наверняка: будущее Судана висит на волоске."
 r56.news_event.1119.a:0 "Бессмысленные дикари."
 r56.news_event.1119.b:0 "Наше освобождение близко!"
 r56.news_event.1119.c:0 "Баланс сил в Африке меняется."
 r56.news_event.1120.t:0 "[MEX.GetAdjective] монархия восстановлена"
 r56.news_event.1120.d:0 "В результате неожиданной череды событий давно свергнутая [MEX.GetAdjective] королевская семья вернулась к власти благодаря внезапному росту народной поддержки. Претендентка была коронована как Мария Хосефа I, императрица [MEX.GetNonIdeologyName].\n\nОднако в ряде районов страны социалистические ополчения выступили против восстановления монархии, поклявшись уничтожить её и сохранить республику. Бои уже начались, и дальнейшая судьба страны остаётся неясной."
 r56.news_event.1120.a:0 "Великолепно!"
 r56.news_event.1120.b:0 "Интересно."
 r56.news_event.1122.t:0 "Суэцкий канал уничтожен ядерным ударом!"
 r56.news_event.1122.desc:0 "\nНедавно египетское небо озарила ослепительная вспышка, достойная древних описаний солнечного бога Ра. Взрыв атомной бомбы у Суэцкого канала уничтожил инфраструктуру региона и серьёзно изменил местную географию. Здания выжжены, обломки кораблей разбросаны по дюнам словно фигуры в игре сил, перед которыми даже колосс Мемнона кажется крошечным.\nСудя по этим ужасающим описаниям, канал останется непригодным для использования в обозримом будущем, а восстановление судоходства потребует титанических усилий."
 r56.news_event.1122.a:0 "Какая катастрофа..."
 r56.news_event.1122.b:0 "Это ударит по их снабжению..."
 r56.news_event.1123.t:0 "Панамский канал уничтожен атомным огнём!"
 r56.news_event.1123.desc:0 "\nПереплетённые останки шлюзов, деревьев, зданий и кораблей — так выглядит то, что осталось от зоны Панамского канала. Недавно канал подвергся ядерному удару достаточной мощности, чтобы разрушить шлюзы и опустошить весь район. Из-за перепада высот на перешейке судоходство будет прервано на долгое время. Война продолжается, и кораблям вновь придётся совершать долгий путь через Магелланов пролив."
