l_russian:
 nicaraguan_focus:0 "Национальные фокусы Никарагуа"
 NIC_president_Somoza_Garcia:0 "Консолидация власти Сомосы"
 NIC_president_Somoza_Garcia_desc:0 "Теперь, когда эпоха марионеточных президентов закончилась, Сомосе пора полностью взять Никарагуа под свой контроль."
 NIC_The_preservation_of_true_democracy:0 "Сохранение истинной демократии"
 NIC_reinstate_national_guard_control:0 "Вернуть контроль над Гвардия Насьональ"
 NIC_reinstate_national_guard_control_desc:0 "Теперь, когда ограничения для кандидатов больше не стоят на повестке дня, Сомоса может вновь занять пост главы Гвардия Насьональ. В сочетании с президентской должностью это должно обеспечить ему полный контроль над вооружёнными силами Никарагуа."
 NIC_nkvd_assistance:0 "Помощь НКВД"
 NIC_nkvd_assistance_desc:0 "Мы можем многому научиться у НКВД, эффективность которого уже не вызывает сомнений. Теперь, когда наши отношения с Советским Союзом достигли своего пика, мы могли бы попросить прислать высокопоставленных сотрудников их спецслужб для подготовки наших."
 NIC_the_strength_of_moscow:0 "Сила Москвы"
 NIC_the_strength_of_moscow_desc:0 "Союз как с Соединёнными Штатами, так и с Германией в конечном счёте может угрожать нашему суверенитету и, прежде всего, легитимности Сомосы. Союз с Советским Союзом, каким бы маловероятным он ни казался, может оказаться самым выгодным."
 NIC_begin_a_political_crackdown:0 "Начать чистку оппозиции"
 NIC_begin_a_political_crackdown_desc:0 "Несмотря на совершенно очевидную победу на выборах, некоторые всё ещё сомневаются в легитимности Сомосы. Мы можем терпеть небольшую оппозицию, пока она почти не затрагивает элиту, но наиболее радикальных ждёт та же судьба, что и Сандино."
 NIC_supervise_large_enterprises:0 "Контролировать крупные предприятия"
 NIC_supervise_large_enterprises_desc:0 "Не вмешиваясь непосредственно в их работу, мы должны убедиться, что ведущие компании Никарагуа действуют в соответствии с интересами и целями правительства."
 NIC_judicial_control:0 "Контроль над судебной системой"
 NIC_judicial_control_desc:0 "Многие родственники Сомосы назначены на судебные должности, что обеспечивает нам полное содействие этой ветви власти."
 NIC_take_over_the_national_radio:0 "Взять под контроль национальное радио"
 NIC_take_over_the_national_radio_desc:0 "Контроль семьи Сомосы над национальной радиостанцией позволит транслировать прорежимную пропаганду всему населению Никарагуа."
 NIC_support_of_the_psn:0 "Поддержка ПСН"
 NIC_support_of_the_psn_desc:0 "Как ни парадоксально, Партиидо Сосиалиста Никарагуэнсе заявила о поддержке Анастасио Сомосы Гарсии, считая его антифашистским союзником. Благодаря этой поддержке наш режим, вероятно, будут лучше воспринимать не только никарагуанские левые, но и весь мир."
 NIC_begin_forcibly_annexing_nicaraguan_german_land:0 "Конфисковать немецкие земли в Никарагуа"
 NIC_begin_forcibly_annexing_nicaraguan_german_land_desc:0 "Мы можем использовать войну с Германией, чтобы принудить небольшую, но влиятельную немецкую общину Никарагуа продать своё имущество и землю за бесценок, после чего их смогут приобрести родственники и семья Сомосы."
 NIC_the_somoza_family_fortune:0 "Состояние семьи Сомосы"
 NIC_the_somoza_family_fortune_desc:0 "Почти полный контроль семьи Сомосы над экономикой и политикой Никарагуа позволил ей накопить значительное состояние и получить во владение огромную часть земель."
 NIC_soviet_economic_assistance:0 "[SOV.GetAdjective] экономическая помощь"
 NIC_soviet_economic_assistance_desc:0 "Промышленные успехи СССР неоспоримы. Возможно, и мы, небольшая аграрная страна, сумеем стать полностью индустриализированным государством, следуя российской модели?"
 NIC_combat_fruit_industries_influence:0 "Бороться с влиянием фруктовых компаний"
 NIC_combat_fruit_industries_influence_desc:0 "Влияние «Юнайтед Фрут Компани» на Никарагуа становится уже неприличным не только для семьи Сомосы, но и для наших советских союзников. Пора положить ему конец."
 NIC_look_to_washington_once_again:0 "Снова обратиться к Вашингтону"
 NIC_look_to_washington_once_again_desc:0 "В этом мировом конфликте наше место рядом с Америкой, без которой Сомоса никогда не оказался бы в нынешнем положении."
 NIC_lend_lease_for_docking_rights:0 "Ленд-лиз в обмен на право базирования"
 NIC_lend_lease_for_docking_rights_desc:0 "В обмен на поддержку вооружением мы могли бы предоставить Соединённым Штатам право размещать корабли в наших портах, помогая им контролировать Карибский бассейн."
 NIC_foreign_concessions_on_gold_exploitation:0 "Иностранные концессии на добычу золота"
 NIC_foreign_concessions_on_gold_exploitation_desc:0 "Предоставляя американским компаниям концессии на золото, каучук и древесину, мы сможем обеспечить Никарагуа серьёзную экономическую поддержку."
 NIC_ally_the_champion_of_europe:0 "Союз с чемпионом Европы"
 NIC_ally_the_champion_of_europe_desc:0 "Очевидно, что Германия стала новой господствующей силой Европы. Объединившись с ней, мы сможем обеспечить Никарагуа долю в новом порядке."
 NIC_push_south:0 "Ударить на юг"
 NIC_push_south_desc:0 "К югу находится Коста-Рика — слабая страна со столь же слабым правительством. Вторгнувшись туда, мы сможем доказать новым союзникам эффективность никарагуанской армии."
 NIC_steel_trade:0 "Торговля сталью"
 NIC_steel_trade_desc:0 "Торговый контракт с Германией на поставки железа и стали позволит нашим предприятиям работать гораздо эффективнее и дешевле."
 NIC_control_immigration:0 "Контролировать иммиграцию"
 NIC_control_immigration_desc:0 "Пока Никарагуа переживает период нестабильности, ограничения на иммиграцию необходимы, чтобы дать нам время восстановить внутренний порядок."
 NIC_expanded_national_guard_powers:0 "Расширить полномочия Национальной гвардии"
 NIC_expanded_national_guard_powers_desc:0 "Национальная гвардия — основа власти Сомосы. Расширение её полномочий, а значит и влияния Сомосы, усилит его контроль над Никарагуа."
 NIC_uproot_banditry:0 "Искоренить бандитизм"
 NIC_uproot_banditry_desc:0 "Суровая местность Никарагуа позволила бандитским группам формироваться и легко нападать на центральное правительство. Пора положить этому конец."
 NIC_regulate_the_national_railroads:0 "Регулировать национальные железные дороги"
 NIC_regulate_the_national_railroads_desc:0 "Назначив себя директором Тихоокеанской железной дороги, Сомоса сможет обеспечить надлежащее управление ею и остальными железными дорогами страны."
 NIC_health_services:0 "Медицинские службы"
 NIC_health_services_desc:0 "Доступ к достойной медицинской помощи в некоторых районах Никарагуа всё ещё ограничен, а больное население — слабое население. Пора расширить доступ к здравоохранению."
 NIC_local_intelligence_cooperation:0 "Местное содействие ССГН"
 NIC_local_intelligence_cooperation_desc:0 "Чтобы лучше контролировать регион и подготовиться к продвижению на юг, необходимо расширить полномочия и укрепить наше разведывательное ведомство — Сервисио де Сегуридад де ла Гвардия Насьональ."
 NIC_nicaraguan_diplomacy:0 "Дипломатическая безопасность Никарагуа"
 NIC_marine_national_guard_cooperation:0 "Сотрудничество морской пехоты и Гвардия Насьональ"
 NIC_dock_access:0 "§YМы предоставим США право базирования§! \n"
