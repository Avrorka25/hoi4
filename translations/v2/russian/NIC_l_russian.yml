 NIC_ssgn:0 "ССГН"
 nicaragua.1.t:0 "Сомоса захватывает власть"
 nicaragua.1.d:0 "Сегодня утром никого не удивило известие о том, что Анастасио Сомоса Гарсия потребовал от [ROOT.getleader] уйти с поста президента Никарагуа. После соглашения о разделе власти 1933 года Сомоса и подконтрольная ему Гвардия Насьональ вели кампанию убийств и террора против его политических противников. С середины 1935 года страна переживает президентский кризис, который, как многие считали, может погрузить её в хаос. [ROOT.getleader] решил избежать возможной гражданской войны и уйти в отставку, а не пытаться удержаться у власти. [USA.getname], посредничавшие при заключении соглашения 1933 года, умыли руки и не вмешиваются в ситуацию, которую многие обозреватели считают фактическим падением демократии в Никарагуа.\n \nАнастасио Сомоса Гарсия назначил временного президента, являющегося лишь его марионеткой. Будут организованы новые выборы, хотя многие подозревают, что они будут сфальсифицированы в пользу Анастасио Сомосы Гарсии."
 nicaragua.1.a:0 "Власть держится на заряженной винтовке, Сакаса."
 nicaragua.2.t:0 "Никарагуа просит принять её в Коминтерн"
 nicaragua.2.d:0 "Никарагуа попросила принять её в Коминтерн и тем самым присоединиться к войне против Германии."
 nicaragua.2.a:0 "Разумеется"
 nicaragua.2.b:0 "Нет"
 nicaragua.3.t:0 "Советы согласились!"
 nicaragua.3.d:0 "СССР принял нас в Коминтерн и теперь ожидает, что мы, как и обещали, объявим войну Германии."
 nicaragua.3.a:0 "Замечательно"
 nicaragua.4.t:0 "Советы отказали"
 nicaragua.4.d:0 "СССР ответил отказом, желая дистанцироваться от нас."
 nicaragua.4.a:0 "Катастрофа"
 nicaragua.5.t:0 "Убийство Педро Альтамирано"
 nicaragua.5.d:0 "Педро Альтамирано, враг государства и сторонник Сандино, был убит сегодня на рассвете выстрелом из дробовика. Это несомненная победа Анастасио Сомосы Гарсии и народа Никарагуа."
 nicaragua.5.a:0 "Повод для праздника"
 nicaragua.6.t:0 "Никарагуа просит принять её в нашу фракцию"
 nicaragua.6.d:0 "Никарагуа попросила принять её в наш союз и тем самым присоединиться к войне против Германии."
 nicaragua.6.a:0 "Разумеется"
 nicaragua.6.b:0 "Нам лучше без них"
 nicaragua.7.t:0 "Американцы согласились!"
 nicaragua.7.d:0 "США приняли нас в свой союз и теперь ожидают, что мы, как и обещали, объявим войну Германии."
 nicaragua.7.a:0 "Замечательно"
 nicaragua.8.t:0 "Американцы отказали"
 nicaragua.8.d:0 "США ответили отказом, желая дистанцироваться от нас."
 nicaragua.8.a:0 "Катастрофа"
 nicaragua.9.t:0 "Никарагуа просит принять её в нашу фракцию"
 nicaragua.9.d:0 "Никарагуа попросила принять её в наш союз."
 nicaragua.9.a:0 "Разумеется"
 nicaragua.9.b:0 "Нам лучше без них"
 nicaragua.10.t:0 "Немцы согласились!"
 nicaragua.10.d:0 "Германия приняла нас в свой союз."
 nicaragua.10.a:0 "Замечательно"
 nicaragua.11.t:0 "Немцы отказали"
 nicaragua.11.d:0 "Германия ответила отказом, желая дистанцироваться от нас."
 nicaragua.11.a:0 "Катастрофа"
 r56.news_event.1100.t:0 "Сомоса захватывает власть в [NIC.getnamedef]"
 r56.news_event.1100.d:0 "Сегодня утром никого не удивило известие о том, что Анастасио Сомоса Гарсия потребовал от президента Сакасы уйти с поста президента Никарагуа. После соглашения о разделе власти 1933 года Сомоса и подконтрольная ему Гвардия Насьональ вели кампанию убийств и террора против его политических противников. С середины 1935 года страна переживает президентский кризис, который, как многие считали, может погрузить её в хаос. Сакаса решил избежать возможной гражданской войны и уйти в отставку, а не пытаться удержаться у власти. [USA.getname], посредничавшие при заключении соглашения 1933 года, умыли руки и не вмешиваются в ситуацию, которую многие обозреватели считают фактическим падением демократии в Никарагуа."
 r56.news_event.1100.a:0 "Жаль, что всё так обернулось"
 r56.news_event.1100.b:0 "Будем надеяться, он не полезет к другим"
