 france.139.t:0 "[FRA.GetAdjective] ультиматум"
 france.139.d:0 "[FRA.GetNameDefCap] вынуждает нас подписать договор о «взаимной помощи», который даст им право размещать войска на нашей территории! Это лишь плохо скрытая попытка аннексировать страну, но мы почти не можем сопротивляться их войскам, сосредоточенным у нашей границы."
 france.139.a:0 "Принять неизбежное."
 france.139.b:0 "Пусть попробуют отнять нашу землю силой!"
 france.140.t:0 "[HOL.GetNameDefCap] подчиняется"
 france.140.d:0 "Нидерланды уступили нашим требованиям. Мы заменили нынешнее правительство на антигерманское, и теперь оно будет следовать нашей воле."
 france.140.a:0 "Теперь они защищены от [GER.GetNameDef]."
 france.141.t:0 "[HOL.GetNameDefCap] отвергает наше предложение"
 france.141.d:0 "[HOL.GetNameDefCap] возмутительным образом отказалось от нашего щедрого предложения заключить пакт взаимопомощи против Германии! Мы должны как можно скорее силой привести его к повиновению!"
 france.141.a:0 "Мы должны защитить [HOL.GetAdjective] народ от [GER.GetNameDef]."
 france.142.t:0 "Предложение [FRA.GetAdjective] протектората"
 france.142.d:0 "[FRA.GetNameDefCap] вынуждает нас подписать договор о «протекторате», который даст им право размещать войска на нашей территории! Это лишь плохо скрытая попытка аннексировать страну, но мы почти не можем сопротивляться их войскам, сосредоточенным у нашей границы."
 france.142.a:0 "Принять неизбежное."
 france.142.b:0 "Пусть попробуют отнять нашу землю силой!"
 france.143.t:0 "[HAI.GetNameDefCap] подчиняется"
 france.143.d:0 "[HAI.GetNameDefCap] уступило нашим требованиям. Мы заменили нынешнее правительство на ориентированное на [FRA.GetAdjective] сторону, и теперь оно будет следовать нашей воле."
 france.143.a:0 "Так и должно быть."
 france.144.t:0 "[HAI.GetNameDefCap] отвергает наше предложение"
 france.144.d:0 "[HAI.GetNameDefCap] возмутительным образом отказалось от нашего щедрого предложения стать протекторатом! Мы должны как можно скорее силой привести его к повиновению!"
 france.144.a:0 "Теперь придётся силой вернуть бывшую колонию."
 france.145.t:0 "[FRA.GetNameDefCap] требует Каталонию"
 france.145.d:0 "[FRA.GetNameDefCap] предъявило претензии на Каталонию и направило нам ультиматум. Если мы не уступим, они захватят регион силой."
 france.145.a:0 "Мы не можем с ними воевать."
 france.145.b:0 "Мы никогда не отдадим землю без боя!"
 france.146.t:0 "Испания соглашается"
 france.146.d:0 "Испания уступила нашим требованиям и передала нам Каталонию."
 france.146.a:0 "Теперь каталонцы стали частью [FRA.GetAdjective] мира."
 france.147.t:0 "Испания отказывается"
 france.147.d:0 "Испания отказалась уступить нашим требованиям и готова сражаться."
 france.147.a:0 "Они знают, чем это обернётся."
 france.148.t:0 "Реставрация империи"
 france.148.d:0 "Сегодня папа Пий XI возвёл Наполеона VI на престол императора Франции. Новый правитель объявил, что поведёт страну через эти смутные времена."
 france.148.a:0 "Да здравствует император!"
 france.149.t:0 "Смерть Жана Орлеанского"
 france.149.d:0 "Прошлой ночью наш любимый король Жан Орлеанский мирно скончался во сне. Несмотря на долгие годы изгнания, провидение позволило ему вернуться в королевство задолго до смерти, и с тех пор он достойно правил страной. Теперь бразды правления принял его сын Анри Орлеанский, который после коронации станет известен как Генрих VI."
 france.149.a:0 "Король умер, да здравствует король!"
 france.150.t:0 "Синдикалисты захватывают власть!"
 france.158.t:0 "Соблюсти соглашение о сферах влияния?"
 france.158.desc:0 "Наши цели достигнуты, и мы контролируем все спорные территории в регионе Бенилюкса. Партнёры ожидают, что мы выполним условия договора и разделим земли согласно предварительному соглашению. Каково будет окончательное решение [ROOT.getLeader]?"
 france.158.a:0 "Да, это не только наше завоевание."
 france.158.b:0 "Всё принадлежит нам."
 france.159.t:0 "Французская империя обращается к Польше и Румынии"
 france.159.desc:0 "Стремясь укрепить французское влияние и, вероятно, предупредить германскую или [SOV.GetAdjective] экспансию, [FRA.GetLeader] объявил о восстановлении Континентальной системы, призванной защищать французские интересы по всей Европе.\n\nНедавно французских дипломатов видели в [POL.Capital.GetCapitalVictoryPointName] и [ROM.Capital.GetCapitalVictoryPointName]. Новый союз может вынудить Германию вести тяжёлую войну на два фронта и обеспечить Франции доступ к ценным румынским поставкам нефти."
 france.159.a:0 "Империя станет господствующей силой Европы."
 france.159.b:0 "Спокойнее, когда рядом столь сильный союзник."
 france.159.c:0 "Неужели начинается новая наполеоновская эпоха?"
 france.159.d:0 "Этого так называемого Наполеона необходимо остановить."
 france.aat.1.t:0 "Выделить средства танковому конструктору"
 france.aat.1.d:0 "Чтобы удовлетворить потребности армии в технике, можно профинансировать одну из танкостроительных компаний. Какую выбрать?"
 france.aat.1.a:0 "Направить финансирование «Гочкиссу»"
 france.aat.1.b:0 "Направить финансирование «Рено»"
 france.aat.1.c:0 "Направить финансирование АПКС"
 france.aat.2.t:0 "Выделить средства конструктору военного снаряжения"
 france.aat.2.desc:0 "Чтобы удовлетворить потребности армии в снаряжении, можно профинансировать одну из соответствующих компаний. Какую выбрать?"
 france.aat.2.a:0 "Направить финансирование МАС"
 france.aat.2.b:0 "Направить финансирование «Шнейдеру»"
 france.aat.2.c:0 "Направить финансирование «Панару»"
 france.aat.2.d:0 "Направить финансирование «Сомуа»"
 r56.news_event.1000.t:0 "Всемирная выставка в Париже"
 r56.news_event.1000.d:0 "Франция гордится тем, что с большой помпой запустила универсальную выставку 1937 года. В Париже около 101 га и 44 страны предлагают сто четыре двадцать десять павильонов, посвященных искусству и технике, применяемым в современной жизни. Почти 32 миллиона посетителей приедут сюда. В то время Париж сохранит дворец Шайо, Дворец открытий и Дворец Токио. Дух и новое искусство торжествуют повсюду. Мир хочет на мгновение поверить, что выставка наконец-то объединит все, что объединяет мужчин. Что поражает духов, так это монументальные российские и немецкие павильоны, стоящие перед вызовом друг другу: двадцатипятиметровая статуя Рабочей и Колхозной женщины, размахивающей серпом, и молот, противостоящий гигантской скульптуре орла, держащего в когтях свастику."
 r56.news_event.1000.a:0 "Огромный мировой успех"
