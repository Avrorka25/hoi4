 indochina.1.d:0 "[FRA.GetNameDefCap] приказало нашему правительству передать Тонкин и Южный Индокитай [JAP.GetNameDef]. Эти территории имеют для нас важнейшее значение: там сосредоточена большая часть ресурсов, населения и промышленности всего Индокитая. Следует ли выполнить приказ или проявить твёрдость?"
 indochina.1.a:0 "Мы не можем уступить!"
 indochina.1.b:0 "Мы должны выполнить приказ."
