 FRA_repatriate_the_remains_of_napoleon_ii:0 "Возвратить останки Орлёнка"
 FRA_repatriate_the_remains_of_napoleon_ii_desc:0 "Наполеон II, герцог Рейхштадтский, более известный как «Орлёнок», был единственным сыном Наполеона Великого и Марии-Луизы Австрийской. Он умер в 1832 году и был похоронен в Вене. Настало время воссоединить отца и сына и устроить ему достойное императорское погребение в Доме инвалидов."
