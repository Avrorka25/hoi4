 FRA_the_popular_front:0 "Народный фронт"
 FRA_the_popular_front_desc:0 "Нестабильная коалиция левых движений, включая коммунистическую Французскую секцию Коммунистического интернационала, социалистическую Французскую секцию Рабочего интернационала (СФИО) и прогрессивную Республиканскую радикал-социалистическую партию, стремилась провести левые реформы. Однако внутренние противоречия мешают этому «союзу по необходимости»."
 FRA_has_no_deflation_tt:0 "Не имеет национального духа §YДефляция§!"
 french_focus:0 "Дерево фокусов [ROOT.getAdjective]"
 FRA_tools_modernisation:0 "Модернизация оборудования"
 FRA_tools_modernisation_desc:0 "[FRA.GetAdjective] промышленный парк устарел и особенно изношен. Необходимо модернизировать оборудование, закупив новые современные станки."
 FRA_monetary_tripartite_agreement:0 "Трёхстороннее валютное соглашение [getYear] года"
 FRA_monetary_tripartite_agreement_desc:0 "После Великой депрессии другие страны допустили девальвацию своих валют, но мы упорно отказывались поступать так же. В результате наша экономика отстаёт. Чтобы пережить надвигающуюся бурю, нельзя безоговорочно отвергать девальвацию! Она даст нам преимущество в мировой торговле и привлечёт ещё больше иностранных инвестиций."
 FRA_overseas_factories:0 "Заморские фабрики"
 FRA_overseas_factories_desc:0 "Французский Алжир считается частью [FRA.GetnameDef], поэтому необходимо укрепить производство и инфраструктуру этого заморского департамента."
 FRA_cnrs:0 "Национальный центр научных исследований"
 FRA_cnrs_desc:0 "Чтобы координировать деятельность существующих исследовательских лабораторий, необходимо объединить все учреждения в единый национальный центр и повысить наши научные возможности."
 FRA_buy_heavy_water:0 "Закупить тяжёлую воду"
 FRA_buy_heavy_water_desc:0 "Европа нестабильна, а первые испытания в области ядерной науки показали многообещающие результаты. Следует тайно выкупить весь запас тяжёлой воды у [NOR.GetNameDef], чтобы продолжить и обезопасить наши ядерные исследования."
 FRA_research_grants:0 "Исследовательские гранты"
 FRA_research_grants_desc:0 "Чтобы ускорить национальные исследования, следует предоставить лучшим научным коллективам дополнительные гранты. Технологические достижения могут дать нам преимущество именно там, где оно нужнее всего."
 FRA_sncf:0 "Национальное общество французских железных дорог"
 FRA_sncf_desc:0 "Национализация [FRA.GetNameDef]Ведущие железнодорожные компании обеспечат наш контроль над транспортными средствами по всему миру. [FRA.GetNameDef]. Новая французская национальная железнодорожная компания будет развивать существующую транспортную инфраструктуру."
 FRA_sncf_tooltip:0 "Добавляет максимальную §Yинфраструктуру§! в регионах §YИль-де-Франс§!, §YПа-де-Кале§!, §YШампань§! и §YЭльзас§!"
 FRA_colonial_investments_desc:0 "Европа переживает опасные времена. Следует сосредоточиться на развитии наших южных владений и колоний, чтобы они могли постоянно поддерживать метрополию."
 FRA_colonial_investments_tooltip:0 "Все [FRA.getAdjective] колонии за пределами Европы получают:"
 FRA_continue_mandat:0 "Продолжить ближневосточный мандат"
 FRA_continue_mandat_desc:0 "Сейчас мы не можем полностью реализовать соглашение Вьено, поскольку мир с каждым днём становится всё опаснее. Можно пойти на некоторые уступки, чтобы побудить сирийцев и ливанцев поддержать нас."
 FRA_develop_morocco:0 "Развивать Марокко"
 FRA_develop_morocco_desc:0 "Нашему протекторату Марокко требуется дополнительное финансирование для укрепления местного производства и создания эффективной экономики."
 FRA_develop_tunisia:0 "Развивать Тунис"
 FRA_develop_tunisia_desc:0 "Тунисский протекторат обладает огромным промышленным потенциалом; необходимо развивать существующую инфраструктуру."
 FRA_develop_algeria:0 "Развивать Алжир"
 FRA_develop_algeria_desc:0 "Следует сосредоточить промышленность в Алжире. Если напряжённость в Европе возрастёт, у нас останутся производственные мощности вне досягаемости вражеских бомбардировщиков."
 FRA_develop_indochine:0 "Развивать Индокитай"
 FRA_develop_indochine_desc:0 "Если мы намерены использовать Индокитайскую колонию как плацдарм для операций в Тихоокеанском регионе, необходимо развить инфраструктуру для размещения войск и увеличить пропускную способность портов."
 FRA_technology_sharing:0 "Обмен технологиями"
 FRA_technology_sharing_desc:0 "Чтобы не отставать в технологической гонке, можно обмениваться результатами исследований с нашими колониями и союзниками."
 FRA_technology_sharing_tooltip:0 "Все [FRA.GetADjective] колонии получают §G5%§! бонуса к обмену технологиями от §Y[FRA.GetADjective] исследований§!."
 FRA_sahara_oil:0 "Сахарская нефть"
 FRA_sahara_oil_desc:0 "Нефть — единственный ресурс, которого нет у [FRA.GetNameDef]. Мы можем начать разведку в пустыне Сахара в поисках этого чёрного золота. Кроме того, наше производство нефти всё ещё ничтожно, поэтому следует развивать технологии синтетического топлива по примеру [GER.GetNameDef]."
 FRA_tungsten_mines:0 "Вольфрамовые рудники"
 FRA_tungsten_mines_desc:0 "Чтобы снабжать военную машину, нам требуется больше вольфрама. Развитие индокитайских шахт позволит удовлетворить эту потребность."
 FRA_vienot_agreement:0 "Соглашение Вьено"
 FRA_vienot_agreement_desc:0 "[FRA.GetAdjective] мандат над Сирией и Ливаном не мог существовать вечно, однако Сенат не желал предоставлять им независимость. По мере роста национализма на Ближнем Востоке наши отношения всё сильнее ухудшаются. Следует освободить их и выстроить более эффективное сотрудничество."
 FRA_rewrite_protectorate_treaties:0 "Пересмотреть договоры о протекторате"
 FRA_rewrite_protectorate_treaties_desc:0 "Договоры, навязанные Францией Марокко и Тунису, были неравноправными, несправедливыми и противоречили идеалам Республики. Настало время завершить старую [FRA.GetAdjective] империалистическую эпоху."
 FRA_rewrite_protectorate_treaties_tooltip:0 "§YМарокко§! и §YТунис§! станут §Yассоциированными государствами§!. Они также смогут проходить политические фокусы без условий, но их дипломатия будет ориентирована на [FRA.GetAdjective] сторону."
 FRA_autonomy_indochina:0 "Автономия для Индокитая"
 FRA_autonomy_indochina_desc:0 "Страны Индокитая являются жемчужиной [FRA.GetAdjective] колониальной империи, однако со времён колонизации мы почти ничего не сделали в политической сфере. Необходимо исправить это печальное положение."
 FRA_autonomy_indochina_tooltip:0 "§YВьетнам§!, §YКамбоджа§! и §YЛаос§! станут §Yассоциированными государствами§!. Они также смогут проходить политические фокусы без условий, но их дипломатия будет ориентирована на [FRA.GetAdjective] сторону."
 FRA_self_government_for_the_colonies:0 "Самоуправление для колоний"
 FRA_self_government_for_the_colonies_desc:0 "Следует предоставить больше автономии заморским территориям, не слишком тесно связанным с [FRA.GetNameDef]. Местное правительство эффективнее управляет администрацией, находящейся далеко от [FRA.GetNameDef]."
 FRA_consolidate_african_federations:0 "Укрепить африканские федерации"
 FRA_consolidate_african_federations_desc:0 "Африка — огромный и этнически раздробленный континент, а наши колонии не готовы к полноценному самоуправлению. Следует создать новые государства на основе федераций колониальных владений."
 FRA_gueye_lamine_law:0 "Закон Ламина Гейе"
 FRA_gueye_lamine_law_desc:0 "Каждый житель [FRA.GetAdjective] империи должен обладать равными правами, а [FRA.GetNameDef] обязано выступать их гарантом, даже если колонистам это не понравится."
 FRA_create_french_union:0 "Создать Французский союз"
 FRA_create_french_union_desc:0 "После всех проведённых реформ прежняя [FRA.GetAdjective] колониальная империя окончательно устарела. Новая система объединит [FRA.GetNameDef] и всех граждан содружества."
 FRA_overseas_departements:0 "Заморские департаменты"
 FRA_overseas_departements_desc:0 "Следует улучшить управление заморскими территориями, даже если для укрепления государственной администрации придётся потратить значительные ресурсы."
 FRA_rearmament:0 "Перевооружение"
 FRA_rearmament_desc:0 "Возрождающееся [GER.GetNameDef] с каждым днём становится сильнее. Лучше поздно, чем никогда: мы должны начать перевооружение страны."
 FRA_military_complex_nationalisation:0 "Национализация военно-промышленного комплекса"
 FRA_military_complex_nationalisation_desc:0 "Наши производственные мощности и объёмы выпуска всё ещё ограничены. Принудительная национализация некоторых ключевых предприятий позволит добиться реальной эффективности производства."
 FRA_defense_national_funds:0 "Национальный фонд обороны"
 FRA_defense_national_funds_desc:0 "При нынешнем бюджете мы не можем позволить себе масштабную программу перевооружения. Чтобы достичь производственных целей, необходимо увеличить военные расходы и взять займы для финансирования ряда проектов."
 FRA_defense_national_funds_tooltip:0 "§YПромышленная поддержка§! §Rпрекратится после начала войны§!."
 FRA_war_material_licence:0 "Лицензирование производства военной техники"
 FRA_war_material_licence_desc:0 "Чтобы стимулировать развитие военной промышленности и обеспечить поставки пехотного снаряжения, можно выдавать лицензии, позволяющие контролировать производство."
 FRA_aircraft_manufacturer_nationalisation:0 "Национализация авиастроительных предприятий"
 FRA_aircraft_manufacturer_nationalisation_desc:0 "Поскольку переговоры о покупке [USA.GetAdjective] самолётов зашли в тупик, следует национализировать авиастроительные предприятия, чтобы устранить недостатки [FRA.GetAdjective] производительности в этом секторе."
 FRA_partial_mobilization:0 "Частичная мобилизация"
 FRA_partial_mobilization_desc:0 "[GER.GetAdjective] силы ведут себя агрессивно, а мир становится всё опаснее. Война приближается, поэтому следует объявить частичную мобилизацию [FRA.GetAdjective] экономики."
 FRA_commit_automobile_manufacturer:0 "Привлечь автопроизводителей"
 FRA_commit_automobile_manufacturer_desc:0 "Автомобильные компании являются главными производителями мощных двигателей для наших танков и моторизованной техники. Государство должно сотрудничать с промышленниками, чтобы обеспечить армию необходимыми механизированными машинами."
 FRA_wartime_organisation_act:0 "Закон об организации военного времени"
 FRA_wartime_organisation_act_desc:0 "До начала войны необходимо определить порядок функционирования страны в военное время."
 FRA_war_effort_law:0 "Закон о военных усилиях"
 FRA_war_effort_law_desc:0 "Для участия в военных усилиях каждый [FRA.GetAdjective] гражданин должен платить дополнительные налоги и покупать государственные облигации."
 FRA_legislative_election:0 "Парламентские выборы"
 FRA_legislative_election_desc:0 "Приближаются [FRA.GetAdjective] парламентские выборы, на которых будет избран 16-й созыв палаты депутатов Третьей французской республики. Общественная обстановка напряжена, и [FRA.GetAdjective] народ надеется, что выборы принесут перемены."
 FRA_matignon_agreements_amendement:0 "Поправки к Матиньонским соглашениям"
 FRA_matignon_agreements_amendement_desc:0 "В нынешней сложной экономической ситуации Матиньонские соглашения губительны. Ради восстановления экономики мы вынуждены частично отменить некоторые достижения, включая 40-часовую рабочую неделю."
 FRA_claim_the_andorran_throne:0 "Предъявить права на [ADR.GetAdjective] престол"
 FRA_claim_the_andorran_throne_desc:0 "У самой нашей границы лежит маленькое государство [ADR.GetNameDef]. После объединения с Испанией вполне естественно стремиться объединиться и с ним."
 FRA_social_reforms:0 "Матиньонские соглашения"
 FRA_social_reforms_desc:0 "Матиньонские соглашения принесли лишь частичный успех, а в нынешних экономических условиях их достижения могут быть отменены в любой момент. Необходимо углубить социальные реформы и закрепить полученные преимущества."
 FRA_support_blum:0 "Поддержать Блюма"
 FRA_support_blum_desc:0 "Реформы Блюма оказались не столь эффективными, как ожидали [FRA.GetAdjective] граждане, однако он движется в правильном направлении. Следует предоставить ему больше полномочий для преобразования общества."
 FRA_intervention:0 "[FRA.GetAdjective] интервенция"
 FRA_intervention_desc:0 "Демократиям мира нужна наша помощь. Нельзя допустить усиления ещё одного фашистского или коммунистического режима. Всем, кто готов сражаться за правое дело, следует позволить это сделать."
 FRA_intervention_tooltip:0 "§R[ENG.GetNameDefCap] может отказаться от союза.\n§!"
 FRA_support_daladier:0 "Поддержать Даладье"
 FRA_support_daladier_desc:0 "Блюм показал, что не способен руководить страной в условиях кризиса. Он должен уйти в отставку и уступить пост Эдуару Даладье, лидеру Радикальной партии и второму человеку в Народном фронте."
 FRA_status_quo:0 "Создать Народный фронт"
 FRA_status_quo_desc:0 "[FRA.GetNameDefCap] является колыбелью и защитницей свободы и должно оставаться ею. Если мы хотим вновь обрести единство, необходимо стабилизировать демократию, пока она окончательно не угасла."
 FRA_little_entente:0 "Малая Антанта"
 FRA_little_entente_desc:0 "Малая Антанта — союз, созданный после Великой войны для предотвращения агрессии Австрии и Венгрии против соседей, — поддерживалась Францией, но теперь начала распадаться. Вместо укрепления связей с [ENG.GetNameDef] мы должны взять инициативу на себя и восстановить эту фракцию, начав с её основателей в [CZE.GetNameDef]."
 FRA_go_with_britain:0 "Идти с [ENG.GetNameDef]"
 FRA_go_with_britain_desc:0 "Из старой Тройственной Антанты, где Россия навсегда изменилась, остались лишь [ROOT.GetNameDef] и [ENG.GetNameDef]. Если история обречена повторяться, мы должны обеспечить, чтобы эти две страны — бастионы демократии и свободы в Европе — оставались союзниками."
 FRA_popular_front_united:0 "Единый Народный фронт"
 FRA_popular_front_united_desc:0 "Мы должны прекратить внутренние распри и сохранить единство вокруг проведённых реформ. Фронт не распадётся, и мы будем сражаться за [FRA.GetNameDef] и за «Свободу, равенство, братство»!"
 FRA_invite_yugoslavia:0 "Пригласить [YUG.GetNameDef]"
 FRA_invite_yugoslavia_desc:0 "У [YUG.GetNameDefCap] и без экспансионистских соседей хватает забот. Возвращение страны в Малую Антанту станет отличной услугой как для неё, так и для нас."
 FRA_invite_romania:0 "Пригласить [ROM.getNameDef]"
 FRA_invite_romania_desc:0 "[ROM.GetAdjective] демократия хрупка, зажатая между внутренними фашистскими силами и [SOV.GetAdjective] коммунизмом. Вступление в Малую Антанту поможет сохранить её стабильность при нашей поддержке."
 FRA_invite_poland:0 "Пригласить [POL.GetNameDef]"
 FRA_invite_poland_desc:0 "[GER.GetNameDefCap] претендует на Данциг и бывшие земли, утраченные в пользу [POL.GetNameDef]. Присоединение Польши к Малой Антанте гарантирует её безопасность."
 FRA_research_treaty:0 "Исследовательский договор"
 FRA_research_treaty_desc:0 "Обмен технологическими достижениями между союзниками позволит всем странам нашей фракции эффективнее вести военные исследования и разработки."
 FRA_invite_benelux:0 "[FRA.GetAdjective]-[BEL.GetAdjective] военное соглашение"
 FRA_invite_benelux_desc:0 "[BEL.GetNameDefCap] и [LUX.GetNameDef] являются лёгкой добычей для [GER.GetAdjective] сил. Чтобы не позволить им обойти линию Мажино, необходимо обеспечить тесное военное сотрудничество с этими странами."
 FRA_economic_cooperation_agreement:0 "Соглашение об экономическом сотрудничестве"
 FRA_economic_cooperation_agreement_desc:0 "Необходимо определить экономические и логистические договорённости, которые обеспечат безупречное военное сотрудничество."
 FRA_preventive_intervention:0 "Превентивная интервенция"
 FRA_preventive_intervention_desc:0 "Агрессоры не оставили нам выбора. Ради свободного мира и будущего наших детей настало время войны."
 FRA_rearmament_policy:0 "Политика перевооружения"
 FRA_rearmament_policy_desc:0 "Поскольку политическая ситуация в Европе продолжает меняться, война становится всё ближе. Независимо от того, придёт ли угроза от [GER.GetNameDef] или [SOV.GetNameDef], мы должны быть готовы к новому конфликту."
 FRA_reynaud_economic_reforms:0 "Экономическая реформа Рейно"
 FRA_reynaud_economic_reforms_desc:0 "Чтобы вернуть [FRA.GetNameDef] к труду, придётся пересмотреть некоторые достижения Матиньонских соглашений. Назначение умеренного правого политика Поля Рейно министром финансов позволит провести эти реформы. Необходимо ограничить или вовсе отменить 40-часовую рабочую неделю, повысить налоги и вновь девальвировать франк."
 FRA_increase_military_spendings:0 "Увеличить военные расходы"
 FRA_increase_military_spendings_desc:0 "Чтобы противостоять всё более очевидной угрозе войны, необходимо возобновить рост военных расходов."
 FRA_further_the_reforms:0 "Продолжить реформы"
 FRA_further_the_reforms_desc:0 "Матиньонские соглашения не должны стать завершением социальных преобразований в [FRA.GetNameDef]. Следует и дальше поддерживать рабочих, одновременно расширяя возможности среднего класса, чтобы заручиться его поддержкой."
 FRA_law_against_combat_groups:0 "Закон против боевых организаций"
 FRA_law_against_combat_groups_desc:0 "Беспорядки 6 февраля 1934 года доказали необходимость действий против военизированных групп, особенно ультраправых. Закон, позволяющий президенту распускать отдельные организации на [FRA.GetAdjective] территории, поможет сократить их влияние."
 FRA_invest_in_our_weaker_allies_tt:0 "Мы построим по 2 военных завода в каждой союзной стране, если у неё меньше заводов, чем у нас."
 FRA_radicalize_front:0 "Радикализировать левых"
 FRA_radicalize_front_desc:0 "Реформы Народного фронта недостаточно решительны, чтобы исправить нынешнее положение. Необходимо радикализировать политику и допустить больше коммунистов в правительство."
 FRA_grands_travaux:0 "Большие работы"
 FRA_grands_travaux_desc:0 "Новая социализация страны будет сопровождаться серией общественных строительных программ. Они сократят безработицу и создадут государственную инфраструктуру."
 FRA_ideological_indoctrination:0 "Национальная мобилизация"
 FRA_ideological_indoctrination_desc:0 "Наши официально утверждённые политические ценности и цели столь же достойны самопожертвования, как любая древняя вера. Каждый сторонник должен быть готов встретить смерть, а отступники — приготовиться к тому, что смерть встретит их."
 FRA_intervention_committee:0 "Комитет по интервенции"
 FRA_intervention_committee_desc:0 "Необходимо изменить нашу политику иностранного вмешательства и поддерживать левые организации в других странах, чтобы остановить распространение фашистского влияния."
 FRA_organise_international:0 "Организовать Четвёртый интернационал"
 FRA_organise_international_desc:0 "Следует помочь троцкистам создать международную революционную социалистическую организацию, провозгласившую своей целью поддержку рабочего класса в свержении капитализма и движении к мировому коммунизму."
 FRA_commune_proclamation:0 "Провозгласить Коммуну"
 FRA_commune_proclamation_desc:0 "Мы заручились достаточной поддержкой для коммунистического переворота. Настало время захватить власть и продолжить наследие Коммуны!"
 FRA_scientific_convention:0 "Парижская конвенция"
 FRA_scientific_convention_desc:0 "[SOV.GetAdjective] сторона предложила расширить научное сотрудничество. Следует подписать конвенцию между нашими странами, чтобы стимулировать исследования и технологические инновации."
 FRA_research_cooperation:0 "Научное сотрудничество"
 FRA_research_cooperation_desc:0 "[SOV.GetAdjective] народ умён и изобретателен, но не обладает инфраструктурой для серьёзных научных программ. Мы будем сотрудничать с союзниками, обмениваясь знаниями и открытиями ради взаимной выгоды."
 FRA_assistance_treaty:0 "[FRA.GetAdjective]-[SOV.GetAdjective] договор о взаимопомощи"
 FRA_assistance_treaty_desc:0 "Двусторонний договор между нашими коммунистическими странами уменьшит угрозу из Центральной Европы. Прежде всего пакт о взаимопомощи позволит сдержать агрессию со стороны [GER.GetNameDef]."
 FRA_fascist_threat:0 "Фашистская угроза"
 FRA_fascist_threat_desc:0 "Версальский договор и экономические санкции не остановили агрессивных националистов, а лишь создали плодородную почву для ещё более зловещих движений. Мы должны уничтожить фашизм любой ценой!"
 FRA_collectivisation:0 "Коллективизация"
 FRA_collectivisation_desc:0 "Кампания по коллективизации частной промышленности и ресурсов в сочетании с чисткой правительства поможет усилить государственный контроль и стабилизировать страну."
 FRA_humanite_unie:0 "Уния человечества"
 FRA_humanite_unie_desc:0 "Жирные банкиры и жаждущие власти демагоги всё сильнее сжимают кровавую хватку вокруг мира. С каждым днём свободные люди обращаются в рабство, а мир всё глубже погружается в кризис, порождённый личной алчностью. [FRA.GetAdjective] идеи нужны как никогда! Человечеству нужны мы, а нам необходимо объединить человечество!"
 FRA_strike_empire:0 "Ударить по империи"
 FRA_strike_empire_desc:0 "Главной угрозой мировой свободе являются капиталистические империи, созданные европейскими сверхдержавами. Мы должны сокрушить их и освободить их народы, начав с [ENG.GetNameDef]."
 FRA_work_with_the_cgt:0 "Сотрудничать с ВКТ"
 FRA_work_with_the_cgt_desc:0 "«Всеобщая конфедерация труда» — крупнейший [FRA.GetAdjective] профсоюз, сыгравший важнейшую роль в победе Народного фронта и поддержавших его забастовках. Следует сблизиться с ним, чтобы ещё больше усилить профсоюзное движение."
 FRA_pcf_sfio_coalition:0 "Коалиция ФКП и СФИО"
 FRA_pcf_sfio_coalition_desc:0 "С усилением крайне левых в [FRA.GetNameDef] постоянный союз двух крупнейших партий этого направления позволит им прийти к власти без серьёзных препятствий."
 FRA_syndicalist_revolution:0 "Синдикалистская революция"
 FRA_syndicalist_revolution_desc:0 "Настало время перевести [FRA.GetNameDef] к экономике, управляемой трудящимися! Отныне профсоюзы и рабочие будут вместе бороться с капиталистической эксплуатацией и строить справедливое хозяйство!"
 FRA_help_the_spanish_republicans:0 "Помочь испанским республиканцам"
 FRA_help_the_spanish_republicans_desc:0 "Настало время полностью поддержать республиканское дело в Испании. Вместе мы разгромим фашистские силы и остановим распространение этой идеологии."
 FRA_industrial_decentralization:0 "Промышленная децентрализация"
 FRA_industrial_decentralization_desc:0 "Децентрализация промышленности позволит демократизировать труд и приблизит нас к установлению рабочего контроля над экономикой."
 FRA_far_right_leagues:0 "Ультраправые лиги"
 FRA_far_right_leagues_desc:0 "Ультраправые лиги — это несколько [FRA.GetAdjective] крайне правых движений, выступающих против парламентаризма и занимающихся главным образом военными парадами, уличными драками, демонстрациями и беспорядками. Чтобы объединить [FRA.GetNameDef], мы можем использовать их для утверждения своего превосходства и силы и не допустить упадка."
 FRA_front_liberte:0 "Фронт свободы"
 FRA_front_liberte_desc:0 "Чтобы противостоять Народному фронту, необходимо создать антимарксистский союз с другими правыми движениями. Этот Фронт свободы объединит всех противников коллективизма."
 FRA_support_ppf:0 "Французская народная партия"
 FRA_support_ppf_desc:0 "Французская народная партия осуждает парламентаризм, стремится ограничить демократию и перестроить [FRA.GetAdjective] общество в соответствии со своими авторитарными убеждениями. Марксисты и либералы яростно выступают против неё. После успеха Фронта свободы Французская народная партия, возглавляющая движение, должна войти в правительство."
 FRA_we_want_petain:0 "Продвигать Петена"
 FRA_we_want_petain_desc:0 "Уже несколько лет некоторые выступают за приход к власти победителя при Вердене как хранителя вечной Франции. Ярким примером стала статья «Мы хотим Петена», опубликованная в издании «Великий Запад»."
 FRA_charlemagne_division:0 "Дивизия «Шарлемань»"
 FRA_charlemagne_division_desc:0 "Коминтерн становится всё сильнее. Настало время заявить о своих интересах и поддержать фашистские организации, чтобы остановить его."
 FRA_demand_wallonia:0 "Потребовать Валлонию"
 FRA_demand_wallonia_desc:0 "Население Валлонии в [BEL.GetNameDef] преимущественно говорит по-французски. Они не считают себя [FRA.getAdjective] народом, но мы можем использовать языковой аргумент, чтобы установить контроль над этой областью."
 FRA_ultimatum_to_belgium:0 "Ультиматум [BEL.GetNameDef]"
 FRA_ultimatum_to_belgium_desc:0 "Мы не можем позволить [ENG.GetAdjective] марионетке оставаться у нашей северной границы."
 FRA_split_switzerland:0 "Разделить [SWI.GetNameDef]"
 FRA_split_switzerland_desc:0 "Нейтралитет и демократические идеалы Швейцарии оскорбляют наш режим. Можно заключить тайное соглашение с [GER.GetLeader] и [ITA.GetLeader], чтобы разделить эту страну на три части."
 FRA_strike_urss:0 "Ударить по [SOV.GetAdjective] стороне"
 FRA_strike_urss_desc:0 "Угроза со стороны [SOV.GetNameDef] продолжает расти, несмотря на наши протесты. Мы больше не можем терпеть агрессивное [SOV.GetName] и вынуждены начать войну ради лучшего будущего."
 FRA_cagoule_coup:0 "Переворот «Кагуляров»"
 FRA_cagoule_coup_desc:0 "«Кагуляры» — склонная к фашизму и антикоммунизму организация, использующая насилие для продвижения своих целей. Подпольное движение поддерживает связи с некоторыми штабными офицерами и получает финансирование от промышленников. Поступают слухи о готовящемся перевороте, поскольку часть военных поддерживает антипарламентские движения."
 FRA_state_reorganisation:0 "Реорганизация государства"
 FRA_state_reorganisation_desc:0 "Необходимо переосмыслить роль государства в [FRA.GetNameDef]. Следует отказаться от парламентских идеологий и создать единую сильную партию."
 FRA_claim_rhineland:0 "Предъявить права на Рейнскую область"
 FRA_claim_rhineland_desc:0 "[GER.GetAdjective] угроза растёт с каждым годом. Мы должны создать буферное государство на левом берегу Рейна."
 FRA_woo_italy:0 "Перетянуть [ITA.GetNameDef] на свою сторону"
 FRA_woo_italy_desc:0 "[ITA.GetNameDefCap] обладает потенциалом стать могущественной страной. Благодаря сильному руководству [ITA.GetLeader] народ [ITA.GetNameDef] объединён и готов сражаться за правое дело. Пусть этим делом станет наше."
 FRA_dismantle_germany:0 "Расчленить [GER.GetNameDef]"
 FRA_dismantle_germany_desc:0 "[GER.GetAdjective] силы не оставили нам иного выбора. Ради [FRA.GetNameDef] и будущего наших детей настало время войны."
 FRA_convince_spain:0 "Убедить Испанию"
 FRA_convince_spain_desc:0 "Франко и испанские националисты являются нашими естественными союзниками, объединёнными религией, культурой и идеологией. Вместе мы защитим латинские народы от [GER.GetAdjective] угрозы."
 FRA_plan_xiv:0 "План XIV"
 FRA_plan_xiv_desc:0 "Север уже защищён. Лишь [SWI.GetNameDefCap] остаётся возможным путём вторжения. Мы не можем с этим мириться."
 FRA_nothern_italy_claim:0 "Претензии на [ITA.GetAdjective] земли"
 FRA_nothern_italy_claim_desc:0 "[ITA.GetNameDef] не является настоящим государством. Оно принадлежит [FRA.GetNameDef], и мы должны вновь завоевать его, как прежде сделал Наполеон."
 FRA_secure_catalonia:0 "Каталонская марка"
 FRA_secure_catalonia_desc:0 "Каталония была французской при Первой империи и во времена Карла Великого. Чтобы почтить своё наследие, необходимо подчинить Испанию."
 FRA_alliance_with_industrialists:0 "Союз с промышленниками"
 FRA_alliance_with_industrialists_desc:0 "«Кагуляры» во многом обязаны своей силой поддержке промышленников, включая основателя «Л’Ореаль» Эжена Шюэллера. Экономические реформы, направленные на укрепление связей с промышленниками по образцу итальянского фашизма, позволят лучше контролировать экономику."
 FRA_root_out_communism:0 "Искоренить коммунизм"
 FRA_root_out_communism_desc:0 "Коммунисты вместе со своими союзниками из Народного фронта почти пришли к власти. Мы должны сделать всё возможное, чтобы уничтожить любое влияние Третьего интернационала в [FRA.GetNameDef]!"
 FRA_class_collaboration:0 "Классовое сотрудничество"
 FRA_class_collaboration_desc:0 "Вместо взаимной борьбы во имя «классовой войны», которая приведёт лишь к анархии, различные классы [FRA.GetAdjective] общества должны объединиться в общей борьбе за величие [FRA.GetNameDef]!"
 FRA_the_three_levers:0 "Три опоры"
 FRA_the_three_levers_desc:0 "Современное государство должно опираться на три совета: совет провинций, совет корпораций и совет империи. Так мы заменим старую парламентскую систему, постоянно парализующую [FRA.GetAdjective] политику."
 FRA_service_ordre_legionnaire:0 "Легионерская служба порядка"
 FRA_service_ordre_legionnaire_desc:0 "Создание официальной военизированной организации, подчинённой приказам партии и независимой от армии, обеспечит военный контроль над обществом."
 FRA_action_francaise:0 "«Аксьон франсез»"
 FRA_action_francaise_desc:0 "«Аксьон франсез» выступает за восстановление монархии, а после закона 1905 года об отделении церкви от государства — и за возвращение римского католицизма в качестве государственной религии. Движение также служит центром объединения противников Третьей французской республики, которую многие из них считали коррумпированной и нежизнеспособной."
 FRA_camelots_roi:0 "«Королевские камелоты»"
 FRA_camelots_roi_desc:0 "«Королевские камелоты» — ультраправая молодёжная организация движения «Аксьон франсез». Эта военизированная группа способна укрепить наши позиции в [FRA.GetAdjective] обществе."
 FRA_camelots_roi_tooltip:0 "§YКоролём будет выбран Жан Орлеанский.\n§!"
 FRA_brumaire_movement:0 "Поддержать бонапартистов"
 FRA_brumaire_movement_desc:0 "Под властью Наполеона Франция достигла величайшей славы, одержала величайшие победы и максимально расширила свои границы. Никто не может отрицать, что именно при Империи Франция пользовалась наибольшим уважением и влиянием. Восстановление династии Бонапартов позволит вернуть былую славу."
 FRA_brumaire_movement_tooltip:0 "§YИмператором будет выбран Наполеон VI.\n§!"
 FRA_papal_rehabilitation:0 "Примирение с папством"
 FRA_papal_rehabilitation_desc:0 "В 1926 году папа Пий XI осудил «Аксьон франсез» из-за влияния агностика Морраса. С возрождением антикоммунизма в Католической церкви мы можем добиться отмены этого осуждения."
 FRA_union_latins:0 "Латинский союз"
 FRA_union_latins_desc:0 "Союз, основанный на общей латинской цивилизации и культуре Европы — [ITA.GetNameDef], [FRA.GetNameDef], Испании, [POR.GetNameDef] и [ROM.GetNameDef] — позволит уравновесить силы между нами и Германией. Начнём с [ROM.GetNameDef]: при нашей поддержке она сможет сохранить стабильность."
 FRA_restoration:0 "Реставрация"
 FRA_restoration_desc:0 "Настало время покончить с Республикой и вернуть Францию её законному наследнику. Новая монархия объединит народ вокруг сильного правителя."
 FRA_invite_portugal:0 "Пригласить [POR.GetNameDef]"
 FRA_invite_portugal_desc:0 "Как латинская страна, [POR.GetNameDef] является естественным союзником [FRA.GetAdjective] народа. Необходимо укрепить эти дружеские связи."
 FRA_retake_haiti:0 "Вернуть Гаити"
 FRA_retake_haiti_desc:0 "Гаити было утрачено после восстания рабов, последовавшего за Революцией. Чтобы укрепить позиции в Карибском море и восстановить престиж, мы должны вернуть его любыми средствами."
 FRA_recover_quebec:0 "Вернуть Квебек"
 FRA_recover_quebec_desc:0 "Квебек был похищен британцами и по-прежнему населён французами. Он должен вернуться к нам силой."
 FRA_claim_louisiana:0 "Предъявить права на Луизиану"
 FRA_claim_louisiana_desc:0 "[USA.GetNameDefCap] никогда не позволит нашему влиянию в Америке расширяться дальше. Лучшим решением будет разгромить их как можно быстрее."
 FRA_usa_deal:0 "Сделка с [USA.GetNameDef]"
 FRA_usa_deal_desc:0 "[USA.GetNameDefCap] — наш давний союзник и лучший друг в Америке. В обмен на [CAN.GetAdjective] земли следует заключить с ним союз."
 FRA_militarist_society:0 "Милитаристское общество"
 FRA_militarist_society_desc:0 "Пацифизм лишает нас заслуженной славы. Дальнейшая милитаризация общества позволит [FRA.GetNameDef] вернуть военное величие."
 FRA_national_integralism:0 "Национальный интегрализм"
 FRA_national_integralism_desc:0 "Чтобы обеспечить долговечность нового королевства, необходимо следовать интегралистской доктрине, разработанной самим Шарлем Моррасом. Это гарантирует единство и величие [FRA.GetAdjective] территории."
 FRA_the_new_continental_system:0 "Новая континентальная система"
 FRA_the_new_continental_system_desc:0 "В Европе существует множество держав, готовых начать войну из-за малейшего территориального инцидента. Чтобы закрепить своё место на континенте, мы должны создать собственный блок, в котором наши интересы будут стоять на первом месте."
 FRA_our_natural_borders:0 "Наши естественные границы"
 FRA_our_natural_borders_desc:0 "Для обеспечения безопасности [FRA.GetNameDef] северная граница должна проходить по Рейну. Настало время вернуть законный рубеж."
 FRA_compromise_with_germany:0 "Компромисс с [GER.GetNameDef]"
 FRA_compromise_with_germany_desc:0 "Возможно, мы сможем договориться с [GER.GetLeader] о разграничении сфер влияния и сосредоточиться на собственных проблемах."
 FRA_approach_poland_and_romania:0 "Сблизиться с правительствами [POL.GetAdjective] и [ROM.GetAdjective] сторон"
 FRA_approach_poland_and_romania_desc:0 "[POL.GetNameDefCap] и [ROM.GetNameDef] имеют решающее значение для безопасности Восточной Европы и потому необходимы для равновесия Континентальной системы."
 FRA_obtain_polish_cryptological_data:0 "Получить польские криптографические данные"
 FRA_obtain_polish_cryptological_data_desc:0 "Наши великие польские союзники добились прорыва в области машинной дешифровки. Тесное сотрудничество позволит воспользоваться их технологиями."
 FRA_approach_the_empire_of_brazil:0 "Сблизиться с [BRA.GetNameDef]"
 FRA_approach_the_empire_of_brazil_desc:0 "Императоры всего мира должны обезопасить свой тыл от коварного радикализма."
 FRA_a_more_durable_tilsit_treaty:0 "Более прочный Тильзитский мир"
 FRA_a_more_durable_tilsit_treaty_desc:0 "Освободившись от большевистской тирании, [SOV.GetNameDef] может вернуться в концерт держав и установить прочный союз с [FRA.GetNameDef] ради безопасности Европы."
 FRA_destroy_albion:0 "Уничтожить Альбион"
 FRA_destroy_albion_desc:0 "Спустя более века после унижения при Ватерлоо коварный Альбион всё ещё опережает нас почти во всём, особенно в колониальной сфере. Пора положить этому конец: когда триколор будет развеваться над Лондоном, мы докажем миру, что [FRA.GetNameDef] является истинной мировой державой."
 FRA_side_with_the_legitimists:0 "Поддержать легитимистов"
 FRA_side_with_the_orleanists:0 "Поддержать орлеанистов"
 FRA_side_with_the_orleanists_desc:0 "Орлеанский дом — наиболее законная династия для правления Францией, уже доказавшая свою состоятельность во времена Июльской монархии."
 FRA_legacy_of_the_grande_armee:0 "Наследие Великой армии"
 FRA_legacy_of_the_grande_armee_desc:0 "Великая армия в своё время была крупнейшей и самой грозной армией мира. Настало время создать войско, достойное её славы."
 FRA_crush_germany:0 "Сокрушить [GER.GetNameDef]"
 FRA_crush_germany_desc:0 "С незапамятных времён [FRA.GetNameDef] и [GER.GetNameDef] соперничают за господство в Европе. Победы в Великой войне оказалось недостаточно, чтобы усмирить бошей, поэтому необходимо новое вторжение, которое поставит [GER.GetAdjective] сторону на место под властью [FRA.GetNameDef]."
 FRA_operation_charlemagna:0 "Операция «Карл Великий»"
 FRA_operation_charlemagna_desc:0 "Спустя более века после унижения при Ватерлоо коварный Альбион всё ещё опережает нас почти во всём, особенно в колониальной сфере. Пора положить этому конец: когда триколор будет развеваться над Лондоном, мы докажем миру, что [FRA.GetNameDef] является истинной мировой державой."
 FRA_disunite_germany_tt:0 "[GER.GetNameDefCap] будет разделено на королевства, существовавшие до объединения. Каждое новое государство будет лояльно нам."
 FRA_disunite_italy:0 "Разделить [ITA.GetNameDef]"
 FRA_disunite_italy_desc:0 "Идея единой Италии была ошибкой, и мы должны взять итальянский народ под свою защиту. Границы Италии следует перекроить по образцу времён Наполеона I."
 FRA_disunite_italy_tt:0 "Италия будет разделена: [FRA.GetNameDef] сохранит [158.GetName], [162.GetName] и [2.GetName], а остальные территории станут марионеточными государствами под властью Неаполя, Сицилии, Сардинии, Венеции и нового лояльного итальянского правительства."
 FRA_secure_iberia:0 "Обезопасить Иберию"
 FRA_restore_the_mexican_monarchy:0 "Восстановить мексиканскую монархию"
 FRA_take_back_north_america:0 "Вернуть Северную Америку"
 FRA_second_march_on_moscow:0 "Второй поход на Москву"
 FRA_napoleon_iii_legacy:0 "Наследие Наполеона III"
 FRA_napoleon_iii_legacy_desc:0 "Единая Италия не существовала бы без помощи Наполеона III. Следует протянуть [ITA.GetAdjective] народу руку дружбы и заключить союз ради общего блага."
 FRA_anti_german_front:0 "Анти-[GER.GetAdjective] фронт"
 FRA_anti_german_front_desc:0 "Германия всегда была естественным врагом Франции, и вскоре она вновь ввергнет Европу в жестокую войну. Необходимо создать единый фронт против [GER.GetAdjective] агрессии вместе с другими европейскими странами, разделяющими наши взгляды."
 FRA_chantilly_accord:0 "Шантийское соглашение"
 FRA_support_the_legitimatises:0 "Поддержать легитимистов"
 FRA_support_the_legitimatises_desc:0 "После Июльской революции 1830 года легитимисты стремятся вернуть к власти прямую мужскую линию династии Бурбонов, происходящую от короля Карла X. Сейчас её представляют бывший испанский король Альфонсо XIII и его сын инфант Хайме."
 FRA_social_nationalism_focus:0 "Социальный национализм"
 FRA_social_nationalism_focus_desc:0 "В классовой борьбе должна существовать форма национальной солидарности, краеугольным камнем которой станет король."
 FRA_decentralise_the_state:0 "Децентрализовать государство"
 FRA_decentralise_the_state_desc:0 "Централизация ведёт к этатизму и бюрократии, присущим демократической системе. Единственный способ сохранить монархию перед лицом республиканских идей — вернуться к дореволюционной модели децентрализованного королевства."
 FRA_restore_ancient_reights:0 "Восстановить древние права"
 FRA_restore_ancient_reights_desc:0 "Абсолютная монархия, правящая сословиями королевства, является истинной моделью Франции. Возвращение к Старому порядку — единственное будущее страны."
 FRA_embrace_the_counter_revolution:0 "Принять Контрреволюцию"
 FRA_embrace_the_counter_revolution_desc:0 "Объединившись под властью абсолютного монарха, Французское королевство вновь сможет стать ведущей державой Европы."
 FRA_counter_the_fascist_infulence:0 "Противодействовать фашистскому влиянию"
 FRA_counter_the_fascist_infulence_desc:0 "Хотя «Аксьон франсез» сыграла важную роль в восстановлении монархии, нельзя позволить [FRA.GetNameDef] попасть под власть ультраправых. Следует сотрудничать с сочувствующими нашему делу силами, чтобы освободить монарха от фашистской толпы."
 FRA_oust_maurras:0 "Отстранить Морраса"
 FRA_oust_maurras_desc:0 "Шарль Моррас — фашист, чьи идеи погубят Францию. Сотрудничая с антифашистскими союзниками, мы сможем сначала вытеснить его на обочину, а затем предать забвению."
 FRA_keep_the_separation_of_church_and_state:0 "Союз с правоцентристами"
 FRA_keep_the_separation_of_church_and_state_desc:0 "Монархия может быть популярна не у всех, однако компромисс с партиями, не относящимися к ультраправым, позволит лучше защитить традиционные ценности Франции от фашистской тирании."
 FRA_constitutional_monarchy_focus:0 "Конституционная монархия"
 FRA_constitutional_monarchy_focus_desc:0 "Идея конституционной монархии старше самой Революции. Не следует уступать радикалам — вместо этого мы должны последовать [ENG.GetAdjective] примеру."
 FRA_metropolitan_priority:0 "Приоритет метрополии"
 FRA_metropolitan_priority_desc:0 "Города Франции — источник её жизненной силы. Следует сотрудничать с промышленниками, чтобы продолжить развитие экономики."
 FRA_public_works:0 "Общественные работы"
 FRA_public_works_desc:0 "Масштабная программа общественных работ не только улучшит страну, но и повысит авторитет монархии в глазах народа."
 FRA_assist_the_carlist_cause:0 "Поддержать карлистов"
 FRA_assist_the_carlist_cause_desc:0 "Карлисты сражаются за восстановление испанской монархии. Было бы безнравственно не оказать им помощь."
 FRA_intervene_in_the_spanish_civil_war:0 "Вмешаться в гражданскую войну в Испании"
 FRA_intervene_in_the_spanish_civil_war_desc:0 "Мы должны помочь карлистам в борьбе за общее будущее Испании."
 FRA_proclaim_the_dual_monarchy:0 "Провозгласить двойную монархию"
 FRA_proclaim_the_dual_monarchy_desc:0 "У наших стран один король. Вполне естественно, чтобы они стали единым государством."
 FRA_pacify_the_spanish_countryside:0 "Умиротворить испанскую провинцию"
 FRA_pacify_the_spanish_countryside_desc:0 "Остатки сил гражданской войны в Испании всё ещё действуют и сопротивляются нашей власти. Настало время положить конец их восстанию и восстановить государственный порядок."
 FRA_support_the_spanish_nationalists:0 "Поддержать испанских националистов"
 FRA_support_the_spanish_nationalists_desc:0 "Испанским националистам нужна помощь против коммунистов и анархистов. Мы должны обеспечить, чтобы нашу южную границу охраняли более надёжные союзники."
 FRA_ally_italy:0 "Пригласить [ITA.GetNameDef] во фронт"
 FRA_ally_italy_desc:0 "[ITA.GetNameDefCap] и [FRA.GetNameDef] давно являются союзниками. Мы можем вновь выступить вместе."
 FRA_pact_with_spain:0 "Пакт с Испанией"
 FRA_pact_with_spain_desc:0 "Испанские националисты — наши естественные союзники. Вместе мы объединим Западную Европу против [GER.GetAdjective] и коммунистической угрозы."
 FRA_anti_communism_r56:0 "Антикоммунизм"
 FRA_anti_communism_r56_desc:0 "Коммунизм — враг западной цивилизации. Мы должны освободить народы мира от коммунистического угнетения."
 FRA_return_to_dalmatia:0 "Вернуться в Далмацию"
 FRA_return_to_dalmatia_desc:0 "Иллирийские провинции были неотъемлемой частью Франции Наполеона. Мы должны вновь взять их под свою защиту."
 FRA_second_march_on_moscow_desc:0 "Россия стала величайшей неудачей Наполеона I. Второй раз мы не потерпим поражения."
 FRA_secure_iberia_desc:0 "Иберия должна полностью перейти под наш контроль ради безопасности родины."
 FRA_restore_the_mexican_monarchy_desc:0 "Наполеон III создал Вторую Мексиканскую империю. Наполеон VI создаст Третью Мексиканскую империю."
 FRA_take_back_north_america_desc:0 "Гаити, Луизиана, Акадия и Квебек — все эти земли некогда принадлежали нам, но были утрачены. Мы вернём своё."
 FRA_proclaim_the_dual_monarchy_tt:0 "Мы аннексируем Испанию и получим национальные территории на её землях, если она является нашей марионеткой либо если [SPB.GetNameDef] существует и победило в гражданской войне в Испании. В противном случае, если мы владеем одной национальной территорией Испании, все её национальные территории станут нашими."
 FRA_improve_equatorial_roads:0 "Улучшить экваториальные дороги"
 FRA_improve_equatorial_roads_desc:0 "Хотя ранее ими пренебрегали, необходимость создания военной экономики и армии в Экваториальной Африке требует улучшения дорожной сети."
 FRA_radio_brazzaville:0 "Радио [Root.Capital.GetCapitalVictoryPointName]"
 FRA_radio_brazzaville_desc:0 "Мощная радиостанция в столице в изгнании позволит донести наш голос до всего мира и показать, что мы готовы освободить метрополию."
 FRA_equatorial_african_gold_mining_desc:0 "Необходимо полностью использовать золотые запасы колоний для поддержки военных усилий."
 FRA_equatorial_african_gold_mining:0 "Золотодобыча в Экваториальной Африке"
 FRA_exploit_rubber_vines:0 "Использовать дикорастущие каучуконосы"
 FRA_exploit_rubber_vines_desc:0 "В дополнение к каучуковым плантациям можно использовать дикорастущие каучуконосы. Однако эта работа тяжела и, вероятно, вызовет недовольство части местных рабочих."
 FRA_an_african_army:0 "Африканская армия"
 FRA_an_african_army_desc:0 "Наша новая база находится в Африке, и именно отсюда [FRA.GetAdjective] знамя не перестанет развеваться, пока окончательно не сокрушит врагов."
 FRA_improved_logistics:0 "Улучшенная логистика"
 FRA_improved_logistics_desc:0 "Положение армии в изгнании вынуждает её сражаться по всей империи, одновременно готовясь к возвращению в метрополию. Эти усилия показали, что точное планирование снабжения необходимо для нашего освобождения."
 FRA_continue_the_fight_in_africa:0 "Продолжить войну в Африке"
 FRA_continue_the_fight_in_africa_desc:0 "Метрополия может временно находиться под властью врага, но война ещё не окончена."
 FRA_mobilize_the_empire:0 "Мобилизовать империю"
 FRA_mobilize_the_empire_desc:0 "Для спасения Франции народы империи будут незаменимы. Настало время отплатить за годы заботы со стороны цивилизующего маяка мира."
 FRA_improve_equatorial_roads2:0 "Улучшить экваториальные дороги"
 FRA_improve_equatorial_roads2_desc:0 "Хотя ранее ими пренебрегали, необходимость создания военной экономики и армии в Экваториальной Африке требует улучшения дорожной сети."
 FRA_radio_brazzaville2:0 "Радио [Root.Capital.GetCapitalVictoryPointName]"
 FRA_radio_brazzaville2_desc:0 "Мощная радиостанция в столице в изгнании позволит донести наш голос до всего мира и показать, что мы готовы освободить метрополию."
 FRA_equatorial_african_gold_mining2_desc:0 "Необходимо полностью использовать золотые запасы колоний для поддержки военных усилий."
 FRA_equatorial_african_gold_mining2:0 "Золотодобыча в Экваториальной Африке"
 FRA_exploit_rubber_vines2:0 "Использовать дикорастущие каучуконосы"
 FRA_exploit_rubber_vines2_desc:0 "В дополнение к каучуковым плантациям можно использовать дикорастущие каучуконосы. Однако эта работа тяжела и, вероятно, вызовет недовольство части местных рабочих."
 FRA_an_african_army2:0 "Африканская армия"
 FRA_an_african_army2_desc:0 "Наша новая база находится в Африке, и именно отсюда [FRA.GetAdjective] знамя не перестанет развеваться, пока окончательно не сокрушит врагов."
 FRA_improved_logistics2:0 "Улучшенная логистика"
 FRA_improved_logistics2_desc:0 "Положение армии в изгнании вынуждает её сражаться по всей империи, одновременно готовясь к возвращению в метрополию. Эти усилия показали, что точное планирование снабжения необходимо для нашего освобождения."
 FRA_continue_the_fight2:0 "Продолжить борьбу"
 FRA_continue_the_fight2_desc:0 "Настало время восстановить вооружённые силы."
 FRA_the_free_french_navy2:0 "Организовать флот в изгнании"
 FRA_the_free_french_navy2_desc:0 "Море — первый фронт между империей и метрополией. Оно станет первым этапом нашего возвращения."
 FRA_colonial_recruitment2:0 "Набор в колониях"
 FRA_colonial_recruitment2_desc:0 "Кровь возместит цену, заплаченную [FRA.GetNameDef] за их постепенное просвещение."
 FRA_prepare_for_our_return:0 "Подготовиться к возвращению"
 FRA_prepare_for_our_return_desc:0 "Только морские десанты позволят нам вновь ступить на землю родины."
 FRA_prepare_for_our_return2:0 "Подготовиться к возвращению"
 FRA_prepare_for_our_return2_desc:0 "Только морские десанты позволят нам вновь ступить на землю родины."
 FRA_the_regiment_normandie2:0 "Полк «Нормандия»"
 FRA_the_regiment_normandie2_desc:0 "Поскольку у нас общий враг с [SOV.GetNameDef], отправка нескольких пилотов на помощь укрепит наши совместные военные усилия."
 FRA_unify_the_metropole:0 "Объединить метрополию"
 FRA_unify_the_metropole_desc:0 "Шестиугольник был несправедливо разделён надвое южными предателями. Мы должны раз и навсегда восстановить [FRA.GetAdjective] единство."
 front_explosed:0 "Народный фронт распущен"
 matignon_agreements:0 "Матиньонские соглашения"
 is_vichy_france:0 "Имеет дерево фокусов §YВишистской Франции§!"
 free_france_advisor_check:0 "Этот офицер не примет участия в коллаборационистском режиме."
 france.100.t:0 "Народный фронт побеждает на выборах"
 france.100.d:0 "Народный фронт победил на парламентских выборах и получил большинство мест. Союз левых движений, включая Французскую коммунистическую партию, Французскую секцию Рабочего интернационала и Радикал-социалистическую партию, объявил о формировании правительства во главе с лидером СФИО Леоном Блюмом. [FRA.GetAdjective] народ надеется, что правительство Блюма проведёт социальные реформы и положит конец нынешнему политическому кризису."
 france.100.a:0 "С Фронтом возможно всё!"
 france.154.t:0 "Правые побеждают на выборах"
 france.154.d:0 "Различные правые партии, прежде всего Республиканская федерация и Демократический республиканский альянс, победили на парламентских выборах и назначили Пьера-Этьена Фландена председателем Совета министров.\n\nИх план не допустить прихода к власти нового левого правительства удался, и теперь они надеются вернуть [FRA.GetNameDef] на ноги, прежде всего покончив с инфляцией."
 france.154.a:0 "[FRA.GetNameDefCap] вновь станет сильным."
 france.101.t:0 "Пакт Хора — Лаваля"
 france.101.d:0 "Пресса раскрыла общественности заключённый за её спиной пакт Хора — Лаваля. Франция и Британия, стремясь сохранить хорошие отношения с Италией, договорились с Муссолини о скором завершении Второй итало-эфиопской войны путём территориальных уступок со стороны Эфиопии. Это якобы должно было сохранить её независимость, но соглашение заключили без её ведома. И правые, и левые подняли шум, осудив пакт как умиротворение Муссолини, которое превратит Эфиопию почти в марионетку. До выборов правительство возглавит Альбер Сарро."
 france.101.a:0 "Пьер Лаваль должен уйти в отставку."
 france.102.t:0 "Леон Блюм уходит в отставку"
 france.102.d:0 "Инфляция выросла на 46%, а введение 40-часовой рабочей недели оказалось крайне неэффективным: промышленность с трудом приспосабливалась к новым условиям. Экономическая неразбериха мешала перевооружению, а быстрый рост [GER.GetAdjective] вооружений вынудил Блюма отказаться от социальных программ Народного фронта, на которые возлагались большие надежды. Леон Блюм подал в отставку после того, как парламент отказался предоставить ему средства для решения экономического кризиса."
 france.102.a:0 "Эдуар Даладье и радикалы сформируют новое правительство."
 france.103.t:0 "Дефляция!"
 france.103.d:0 "В 1936 году Франция медленно оправлялась от экономического кризиса, поразившего страну в 1931 году. Нестабильная политическая обстановка, застой заработной платы и государственный дефицит уже создавали серьёзные трудности для правительства.\n\nК сожалению, приверженность золотому стандарту позволяет дефляции тормозить рост экспорта и затрудняет обслуживание долгов. Экономический кризис уже привёл к падению экспорта на две трети. Массовый отток капитала делает положение тревожным, а разочарование рабочего класса в политике лишь усугубляет проблемы."
 france.103.a:0 "Мы должны немедленно реформировать экономику."
 FRA_deflation_tooltip:0 "§YОткрывает решения по реформированию экономики.\n§!"
 france.104.t:0 "Матиньонские соглашения"
 france.104.d:0 "После победы Народного фронта началась массовая всеобщая забастовка рабочего класса. Она возникла в Гавре и сопровождалась захватами фабрик, чтобы предотвратить локауты, а затем быстро распространилась по [FRA.GetNameDef]. В забастовке участвовало более миллиона рабочих. Движение началось сразу после победы Народного фронта, стремясь использовать сложившееся соотношение сил. Новое левое правительство Леона Блюма успешно провело переговоры и подписало социальные соглашения в Матиньонском дворце. Рабочие получили законное право на забастовку, оплачиваемые отпуска, 40-часовую рабочую неделю и устранение препятствий для профсоюзной деятельности."
 france.104.a:0 "Приступим к социальным реформам."
 france.104.b:0 "Мы не можем выполнить все обещания."
 france.105.t:0 "Коммунисты прекращают поддержку"
 france.105.d:0 "Недовольный последними решениями левого правительства лидер Французской коммунистической партии Морис Торез объявил о выходе коммунистов из Народного фронта и намерении открыто выражать недовольство."
 france.105.a:0 "Нам не нужна их помощь для управления страной."
 france.106.t:0 "Коммунисты поддерживают правительство"
 france.106.d:0 "В отличие от других стран, [FRA.GetNameDef] согласилось помочь испанским республиканцам в гражданской войне. Кабинет Блюма принял курс на интервенцию и официально договорился об отправке боеприпасов и добровольцев в Испанию. Лидер Французской коммунистической партии Морис Торез объявил, что коммунисты поддержат политику Блюма и укрепят Народный фронт."
 france.106.a:0 "Социалисты и коммунисты выступят вместе!"
 france.107.t:0 "Крах Народного фронта"
 france.107.d:0 "После двух лет бурной деятельности Народный фронт утратил энергию и мог лишь тянуть время по мере обострения европейского кризиса. Рабочие получили значительные новые права, но рост цен на 46% почти полностью свёл на нет повышение зарплат на 48%. Безработица оставалась высокой, а общий объём промышленного производства не рос. Осенью 1938 года Народный фронт распался из-за внутренних разногласий по поводу гражданской войны в Испании, сопротивления правых и сохраняющихся последствий Великой депрессии."
 france.107.a:0 "Новое правительство возглавит Камиль Шотан."
 france.108.t:0 "Пригласить [BEL.GetNameDef] и [LUX.GetNameDef]"
 france.108.d:0 "Чтобы сдержать возможное возрождение агрессивного экспансионизма бывших Центральных держав, [FRA.GetNameDef] предложило [BEL.GetNameDEf] и [LUX.GetNameDef] присоединиться к Союзникам и остановить амбиции [GER.GetLeader]."
 france.108.a:0 "Мы должны защитить Бенилюкс."
 france.108.b:0 "Мы не хотим злить [GER.GetLeader]."
 france.109.t:0 "[ENG.GetNameDefCap] принимает союз"
 france.109.d:0 "[ENG.GetNameDefCap] одобрило наши усилия и согласилось принять [BEL.GetNameDef] и [LUX.GetNameDef] в альянс."
 france.109.a:0 "Теперь мы сможем защититься от [GER.GetNameDef]."
 france.110.t:0 "[ENG.GetNameDefCap] отвергает союз"
 france.110.d:0 "Несмотря на все наши попытки помочь Союзникам, последнее обращение встретили с недоверием. [ENG.GetNameDefCap] отказалось принять [BEL.GetNameDef] и [LUX.GetNameDef] в альянс."
 france.110.a:0 "Они станут лёгкой добычей для [GER.GetLeader]!"
 france.111.t:0 "Переворот «Кагуляров»"
 france.111.d:0 "«Кагуляры», официально именуемые Секретным комитетом революционного действия, — [FRA.GetADjective] фашистская и антикоммунистическая организация. Она совершает убийства, взрывы, диверсии на военных предприятиях и другие насильственные акции для усиления политической нестабильности. Сегодня при поддержке военного руководства организация совершила государственный переворот. Введено военное положение, и грядущие перемены вряд ли окажутся незначительными."
 france.111.a:0 "Военное руководство передаёт власть Петену."
 france.111.b:0 "Страну должен возглавить генерал Франше д’Эспере."
 france.112.t:0 "Националистический референдум"
 france.112.d:0 "Популярность Французской народной партии резко выросла, и многие националисты теперь заявляют, что выражают волю народа. Жак Дорио потребовал референдума, повторного проведения парламентских выборов и создания коалиции с консерваторами и радикалами для прекращения политического кризиса. Бессильное и непопулярное правительство приняло требования Дорио. Через несколько дней коалиция получила большинство в парламенте и смогла сформировать новое правительство."
 france.112.a:0 "Дорио возглавит новое правительство."
 france.113.t:0 "[FRA.GetNameDefCap] требует Валлонию"
 france.113.d:0 "[FRA.GetNameDefCap] предъявило претензии на Валлонию и направило нам ультиматум. [FRA.GetLeader] считает её «законной [FRA.GetAdjective] территорией, отделённой от родины случайностями истории». Очевидно, что при отказе они всерьёз рассматривают вторжение."
 france.113.a:0 "Мы не можем с ними воевать."
 france.113.b:0 "Мы никогда не отдадим землю без боя!"
 france.114.t:0 "[BEL.GetNameDefCap] соглашается"
 france.114.d:0 "[BEL.GetNameDefCap] уступило нашим требованиям и передало нам Валлонию."
 france.114.a:0 "Теперь валлоны стали частью [FRA.GetAdjective] мира."
 france.115.t:0 "[BEL.GetNameDefCap] отказывается"
 france.115.d:0 "[BEL.GetNameDefCap] отказалось уступить нашим требованиям и готово сражаться."
 france.115.a:0 "Они знают, чем это обернётся."
 france.116.t:0 "Требование о разделе [SWI.GetNameDef]"
 france.116.d:0 "[FRA.GetNameDefCap] планирует разделить [SWI.GetNameDef] надвое, причём восточная часть достанется нам. Следует ли согласиться?"
 france.116.a:0 "Да, это государство нужно стереть с карты!"
 france.116.b:0 "Нет, сейчас неподходящий момент."
 france.117.t:0 "[GER.GetNameDefCap] соглашается"
 france.117.d:0 "[GER.GetLeader] принял наш план раздела [SWI.GetNameDef] надвое, заявив, что теперь и [FRA.GetAdjective], и [GER.GetAdjective] силы правят Европой!"
 france.117.a:0 "Благодаря новым друзьям Европа будет нашей!"
 france.118.t:0 "[GER.GetNameDefCap] отказывается"
 france.118.d:0 "[GER.GetLeader] отверг наш план раздела [SWI.GetNameDef] надвое, заявив, что мировая политическая обстановка ещё не готова к этому."
 france.118.a:0 "Ужасная ошибка."
 france.119.t:0 "Петен возвращается в правительство"
 france.119.d:0 "Началась Вторая мировая война, а Петен уже отклонил несколько предложений войти в правительство. Он резко критиковал парламент за плохое состояние [FRA.GetAdjective] вооружений, слабую подготовку и сокращение военного бюджета в межвоенный период. Однако в военное время высокая репутация Петена как самого старшего по рангу солдата [FRA.GetNameDef] после смерти Фоша и наиболее человечного из наших военачальников заставляет нас вновь потребовать его возвращения в правительство."
 france.119.a:0 "Петен объединит страну."
 france.122.t:0 "Кабинет уходит в отставку"
 france.122.d:0 "Палата депутатов избрала Рейно председателем Совета министров лишь с перевесом в один голос, причём большинство его собственной партии воздержалось. Новое правительство крайне неустойчиво; многие правые требуют, чтобы Рейно атаковал [SOV.GetNameDef]. Палата также вынудила Даладье, которого Рейно лично считал ответственным за слабость [FRA.GetNameDef], занять пост министра национальной обороны и войны."
 france.122.a:0 "Новое правительство возглавит Поль Рейно."
 france.123.t:0 "Реставрация монархии"
 france.123.d:0 "Сегодня папа Пий XI возвёл Жана Орлеанского на престол короля французов. Новый правитель объявил, что поведёт страну через эти смутные времена."
 france.123.a:0 "Да здравствует король!"
 france.123.b:0 "Оставить Шарля Морраса во главе страны."
 france.124.t:0 "Приглашение во [FRA.GetAdjective] фракцию"
 france.124.d:0 "Чтобы укрепить новый союз и сдержать возможное возрождение агрессивного экспансионизма бывших Центральных держав, [FRA.GetNameDef] предложило нам присоединиться к альянсу, призванному объединить эти страны."
 france.124.a:0 "С радостью."
 france.124.b:0 "[Root.GetNameDefCap] пойдёт своим путём."
 france.125.t:0 "[From.GetNameDefCap] присоединяется к [FRA.GetAdjective] фракции"
 france.125.d:0 "Наш план по сдерживанию [GER.GetAdjective] влияния в Европе продвигается. [From.GetLeader] одобрил наши усилия и принял приглашение в союз."
 france.125.a:0 "Мы ещё на шаг приблизились к созданию сильной фракции."
 france.126.t:0 "[From.GetName] отвергает [FRA.GetAdjective] союз"
 france.126.d:0 "Несмотря на все усилия предложить поддержку и помощь, последняя попытка сблизиться с одной из стран была встречена с подозрением. [From.GetLeader] отказался присоединиться к союзу, возможно, сомневаясь в наших мотивах или опасаясь, что слишком тесное сближение сделает их мишенью."
 france.126.a:0 "Как будто они уже не могут стать целью!"
 france.127.t:0 "Судьба Бенилюкса"
 france.127.d:0 "После аннексии Валлонии на границе с [GER.GetNameDef] возникла брешь в обороне. Чтобы защититься от [GER.GetNameDef], необходимо убедить страны Бенилюкса следовать нашей политике."
 france.127.a:0 "Северо-восток будет защищён."
 france.128.t:0 "Коммунистический переворот"
 france.128.d:0 "Сегодня, когда руководство [Root.GetRulingParty] и армия готовились к общенациональному восстанию, несколько чиновников [Root.GetAdjective] правительства быстро поместили [Root.GetLeader] под домашний арест и начали переговоры с коммунистами.\n\nСохраняя видимость заботы о порядке, переговоры на деле были направлены на обеспечение мест в новом социалистическом государстве тем, кто согласится сотрудничать. Переворот завершился прежде, чем кто-либо успел ему помешать, а потенциальные противники нового режима теперь заключены в тюрьму, изгнаны или казнены."
 france.128.a:0 "Для выживания необходим настоящий коммунизм."
 france.128.b:0 "ВКТ возглавит страну."
 france.128.c:0 "[FRA.GetNameDefCap] не станет марионеткой [SOV.GetAdjective] стороны!"
 france.129.t:0 "Соглашение об экономическом сотрудничестве"
 france.129.d:0 "Для безупречного военного сотрудничества необходимо заключить с [ENG.GetNameDef] ряд экономических и логистических соглашений. Теперь, когда договор подписан, чему Союзникам следует отдать приоритет?"
 france.129.a:0 "Обмениваться новыми электронными и промышленными технологиями."
 france.129.b:0 "Координировать военную логистику и планы."
 france.129.c:0 "Ввести экономические санкции против [GER.GetNameDef]."
 france.130.t:0 "Назначить конструктора военного снаряжения"
 france.130.d:0 "Чтобы удовлетворить потребности армии в снаряжении, можно нанять соответствующего конструктора. Кого выбрать?"
 france.130.a:0 "МАБ"
 france.130.b:0 "АПКС"
 france.130.c:0 "«Де Дион-Бутон»"
 france.130.e:0 "Отложить выбор"
 france.131.t:0 "Привлечь танкового конструктора"
 france.131.d:0 "Чтобы удовлетворить потребности армии в технике, можно нанять танкового конструктора. Кого выбрать?"
 france.131.a:0 "«Лоррен-Дитрих»"
 france.131.b:0 "«Берлие»"
 france.131.c:0 "«Делоне-Бельвиль»"
 france.131.e:0 "Отложить выбор"
 france.133.t:0 "[FRA.GetAdjective] ультиматум"
 france.133.d:0 "[FRA.GetNameDefCap] вынуждает нас подписать договор о «взаимной помощи», который даст им право размещать войска на нашей территории! Это лишь плохо скрытая попытка аннексировать страну, но мы почти не можем сопротивляться их войскам, сосредоточенным у нашей границы."
 france.133.a:0 "Принять неизбежное."
 france.133.b:0 "Пусть попробуют отнять нашу землю силой!"
 france.134.t:0 "[LUX.GetNameDefCap] подчиняется"
 france.134.d:0 "[LUX.GetNameDefCap] уступило нашим требованиям. Мы заменили нынешнее правительство на антигерманское, и теперь оно будет следовать нашей воле."
 france.134.a:0 "Теперь они защищены от [GER.GetNameDef]."
 france.135.t:0 "[LUX.GetNameDefCap] отвергает наше предложение"
 france.135.d:0 "[LUX.GetNameDefCap] возмутительным образом отказалось от нашего щедрого предложения заключить пакт взаимопомощи против Германии! Мы должны как можно скорее силой привести его к повиновению!"
 france.135.a:0 "Мы должны защитить [LUX.GetAdjective] народ от [GER.GetNameDef]."
