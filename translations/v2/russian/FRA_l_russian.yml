 france.150.d:0 "После масштабного призыва ВКТ к забастовке, влияние которой за последние месяцы достигло такой силы, что правительство было вынуждено идти на всё более серьёзные уступки, сотни тысяч рабочих направились в Париже к Бурбонскому дворцу, что многим напомнило беспорядки 6 февраля 1934 года. Затем демонстранты ворвались в парламент, тогда как в остальной части города полиция не смогла сдержать переход частей армии на сторону восставших и вспышки жестокого насилия.\n\nПод руководством Леона Жуо они объявили о прекращении существования Третьей республики и переходе к антикапиталистическому профсоюзному режиму."
 france.150.a:0 "Теперь власть принадлежит рабочим."
 france.151.t:0 "Смерть Франше д’Эспере"
 france.151.d:0 "Луи Феликс Мари Франсуа Франше д’Эспере, маршал и глава [FRA.GetAdjective] государства, скончался ночью. Его похоронили с воинскими почестями, после чего останки перенесли в Дом инвалидов.\n\nСмерть маршала стала неожиданностью для многих [FRA.GetAdjective] граждан и правительства, поскольку порядок наследования власти до сих пор не был установлен. Поэтому министры срочно собрались, чтобы решить, кого назначить преемником.\n\nДля многих очевидным кандидатом является Анри Жиро, военный министр, который на протяжении всей своей карьеры был очень близок к Франше д’Эспере.\n\nОднако Жиро может бросить вызов другой кандидат — Франсуа Миттеран, министр внутренних дел. Хотя ещё несколько лет назад он был лишь журналистом, ему удалось стремительно подняться по правительственной лестнице и приобрести отличную репутацию, которая вполне может сыграть в его пользу."
 france.151.a:0 "Жиро — очевидный выбор."
 france.151.b:0 "Миттеран выглядит многообещающе."
 france.152.t:0 "Победа Народного фронта в [FRA.GetNameDef]"
 france.152.d:0 "Народный фронт — политический союз значительной части [FRA.GetAdjective] левых движений, включая СФИО, Радикальную партию и Коммунистическую партию, — победил на [FRA.GetAdjective] парламентских выборах, получив 57% голосов. В поддержку фронта было организовано множество забастовок. Лидер СФИО Леон Блюм был назначен председателем Совета министров.\n\nИх программа строится вокруг защиты демократии, главным образом посредством противодействия ультраправым лигам, пацифизма и проведения многочисленных социальных реформ, включая оплачиваемые отпуска и попытку оживить экономику за счёт роста потребления."
 france.152.a:0 "Всё возможно!"
 france.152.b:0 "Пожелаем им удачи."
 france.152.c:0 "Они всего лишь отвратительные большевики."
 france.153.t:0 "Победа правых в [FRA.GetNameDef]"
 france.153.d:0 "На [FRA.GetAdjective] парламентских выборах различные правые партии, прежде всего Республиканская федерация и Демократический республиканский альянс, получили большинство голосов и тем самым сорвали попытку Народного фронта прийти к власти. Их объединяли главным образом антисоциализм и антикоммунизм, хотя победа могла быть связана и с ростом ещё более экстремистского движения в [FRA.GetNameDef].\n\nПьер-Этьен Фланден, лидер Демократического республиканского альянса и фигура, способная объединить правых, был назначен председателем Совета министров и сформировал правительство, включившее представителей основных партий коалиции."
 france.153.a:0 "Мы сделаем [FRA.GetNameDef] сильнее."
 france.153.b:0 "Возможно, им удастся вернуть стабильность в [FRA.GetNameDef]."
 france.153.c:0 "Выборы способны привести к власти лишь капиталистов."
 FRA_economic_reforms:0 "Экономические реформы"
 FRA_economic_reforms_desc:0 "[FRA.GetAdjective] экономика находится в крайне нестабильном положении. Необходимо начать экономические реформы, чтобы устранить инфляцию, стабилизировать франк и сократить государственный дефицит."
 FRA_devaluation:0 "Девальвация франка"
 FRA_devaluation_desc:0 "Единственный эффективный способ быстро избавиться от дефляции — при необходимости несколько раз провести девальвацию валюты."
 FRA_assimilate_wallonia:0 "Ассимилировать Валлонию"
 FRA_divide_catalogne_into_departments:0 "Разделить Каталонию на департаменты"
 FRA_budget_deficit_law:0 "Закон о бюджетном дефиците"
 FRA_budget_deficit_law_desc:0 "Необходимо сократить государственный дефицит, прибегнув к решительным мерам, включая урезание государственных расходов."
 FRA_exchange_rate_stabilisation:0 "Стабилизация обменного курса"
 FRA_exchange_rate_stabilisation_desc:0 "Экспорт сократился из-за высокой стоимости франка. Мы можем создать фонд стабилизации валютного курса, чтобы бороться с резким укреплением валюты и бегством капитала."
 FRA_agriculture_national_office:0 "Национальное управление сельского хозяйства"
 FRA_agriculture_national_office_desc:0 "Для стабилизации зернового рынка можно создать новое управление, которое будет контролировать импорт и экспорт и устанавливать справедливые цены."
 FRA_bank_france:0 "Национализировать Банк Франции"
 FRA_bank_france_desc:0 "Мы уже реформировали статус Банка Франции в 1936 году, однако для восстановления контроля над экономическим положением необходимо его национализировать."
 FRA_national_department_state_market:0 "Национальное управление государственных заказов"
 FRA_national_department_state_market_desc:0 "Новое управление централизует государственные заказы и сделает кредитование предприятий более гибким."
 FRA_nationalisation:0 "Меры по национализации"
 FRA_nationalisation_desc:0 "За счёт бюджета Национального фонда обороны мы можем принудительно национализировать производителей, чтобы повысить эффективность производства. Однако это ухудшит отношения с промышленниками, и §Rво время войны провести такие меры будет невозможно§!."
 FRA_nationalize_industy:0 "Интеграция промышленных концернов"
 FRA_nationalize_industy_desc:0 "Мы можем национализировать промышленные концерны, чтобы увеличить число гражданских фабрик, однако в будущем они больше не смогут использоваться в составе правительства."
