l_russian:
 OMA_reliant_on_the_rupee:0 "Зависимость от рупии"
 OMA_reliant_on_the_rupee_desc:0 "[ROOT.GetNameDefCap] не обладает достаточным промышленным потенциалом для поддержания стабильной валюты, поэтому собственной валюты у неё нет, и она зависит от индийской рупии как единственного средства обмена и торговли для [ROOT.GetName]."
 OMA_immamate_of_oman:0 "Восьмой имамат Омана"
 OMA_immamate_of_oman_desc:0 "Имамат Омана существовал на протяжении сотен лет, то исчезая, то возникая вновь. После восстания в Маскате 1913 года, продолжавшегося семь лет, султан Маската и имам Салим ибн Рашид подписали Сибский договор, что привело к созданию Восьмого имамата Омана — фактически автономного и самоуправляемого государства во внутренних областях Омана под руководством Мухаммада аль-Халили. Последнее десятилетие отношения между султаном и имамом были довольно стабильными и мирными, даже сотрудничеством, возможно, благодаря готовности имама Омана к взаимодействию и его скромному и благочестивому характеру."
 OMA_said_bin_taimur_of_oman:0 "Его Величество, султан Маската и Омана"
 OMA_establish_the_rial:0 "Учредить риал"
 OMA_establish_the_rial_desc:0 "Слишком долго мы зависели от индийской рупии и британцев. Мы должны создать собственную валюту, чтобы укрепить экономику и сделать Оман менее зависимым от иностранных держав!"
 OMA_tear_up_the_treaties:0 "Разорвать англо-оманские договоры"
 OMA_tear_up_the_treaties_desc:0 "За последнее столетие [ROOT.GetNameDef] и британцы подписали множество договоров, самым заметным из которых был тайно заключённый договор 1891 года, чтобы не вызывать лишней напряжённости. Эти соглашения фактически предоставили британцам множество экономических и политических привилегий и позволили им де-факто контролировать [OMA.GetAdjective] внешнюю политику. И всё это во имя защиты..."
 OMA_our_african_holdings:0 "Наши африканские владения"
 OMA_our_african_holdings_desc:0 "Несколько десятилетий, а то и столетий назад [ROOT.GetNameDef] была крупной державой в Индийском океане и владела многочисленными колониями у побережья [546.GetName], прежде всего Занзибаром. Пора показать миру, чего мы действительно стоим, и вернуть утраченные колонии!"
 OMA_reclaim_the_northern_lands:0 "Вернуть северные земли"
 OMA_reclaim_the_northern_lands_desc:0 "Северные области, утраченные около двух столетий назад, [ROOT.GetNameDef] по-прежнему считает собственной территорией, а их жителей — своим народом! Мы должны освободить братьев на севере от колонизаторов."
 OMA_across_the_gulf:0 "Через залив"
 OMA_across_the_gulf_desc:0 "Очевидно, что тот, кто контролирует Ормузский пролив, контролирует торговые потоки всего Персидского залива. Поэтому разумно пересечь залив и утвердить господство над всем регионом. Мы уже делали это однажды — кто сказал, что не сможем снова?"
 OMA_integrate_khasab:0 "Интегрировать Хасаб"
