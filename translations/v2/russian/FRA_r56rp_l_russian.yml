l_russian:
 FRA_r56rp_marine_national:0 "Национальный парк La Marina"
 FRA_r56rp_marine_national_desc:0 "Несмотря на то, что когда-то он был одним из крупнейших флотов мира, военно-морской флот сильно пострадал после Великой войны. Несмотря на внушительные размеры на бумаге, нехватка рабочей силы и почти полное прекращение военно-морского строительства привели к тому, что он стал тенью своего прежнего престижа."
 FRA_r56rp_marine_national_dynamic_modifier_tt:0 "изменять §Y$FRA_r56rp_marine_national$§! через"
 FRA_r56rp_armee_de_lair:0 "Армия авиации"
 FRA_r56rp_armee_de_lair_desc:0 "Все еще развивая свою идентичность в качестве независимой силы, Armée de l'Air сталкивается с растущей реальностью, что большая часть его оборудования отстает. Чтобы защитить Францию, мы должны быстро модернизироваться и восстановить наше преимущество в небе.\n\n"
 FRA_r56rp_armee_de_lair_tt:0 "изменять §Y$FRA_r56rp_armee_de_lair$§! через"
 FRA_r56rp_armee_de_terra:0 "Армия де Терре"
 FRA_r56rp_armee_de_terra_desc:0 "Великая война привела к ослаблению французских вооруженных сил, их неспособность модернизироваться теперь стала очевидной. Его шрамы продолжают преследовать наш народ и наше руководство, и лишь немногие остаются уверенными в том, что доктрины, рожденные в ходе последней войны, могут возобладать в следующей."
 FRA_r56rp_armee_de_terra_tt:0 "изменять §Y$FRA_r56rp_armee_de_terra$§! через"
 FRA_r56rp_economic_status_modifier:0 "Французская экономика"
 FRA_r56rp_economic_status_modifier_desc:0 "Несмотря на стабильность на поверхности, французская экономика по-прежнему обременена глубоко укоренившейся неэффективностью и длительной стагнацией. Консервативная финансовая политика, осторожные промышленные инвестиции и непреходящее наследие Великой войны замедлили рост и ограничили модернизацию. Хотя полного краха удалось избежать, наша промышленность по-прежнему плохо подготовлена к быстрой мобилизации или устойчивому перевооружению без значительных реформ."
 FRA_r56rp_economic_status_tt:0 "изменять §Y$FRA_r56rp_economic_status_modifier$§! через"
 FRA_r56rp_alpine_tt:0 "изменять §Y$FRA_r56rp_armee_de_terra$§! через\n$MODIFIER_SPECIAL_FORCES_CAP$: §G+2.0%§! \n$modifier_army_sub_unit_mountaineers_defence_factor$: §G+3.00%§! \n$modifier_army_sub_unit_mountaineers_max_org_factor$: §G+5.00%§! \n\n"
 FRA_r56rp_ships_at_battlestart_tt:0 "изменять §Y$FRA_r56rp_marine_national$§! через\n$MODIFIER_SHIPS_AT_BATTLE_START_FACTOR$: §G+10.0%§! \n\n"
 FRA_r56rp_capital_ship_attack_tt:0 "изменять §Y$FRA_r56rp_marine_national$§! через\n$MODIFIER_NAVY_CAPITAL_SHIP_ATTACK_FACTOR$: §G+15%§! \n\n"
 FRA_r56rp_established_feaa:0 "Установил ли он §YФранцузская восточноазиатская администрация§!"
 FRA_r56rp_form_an_feaa_expeditionary_task_force_tt:0 "А. §YЦелевая группа§! состоящий из 1 §YТяжелый крейсер§!, 2 §YЛёгкие крейсеры§! и 5 §YЭсминцы§! будет передана в распоряжение §YФранцузская восточноазиатская администрация§! чтобы помочь им"
 R56RP_focus_is_in_development_tt:0 "§RЭтот фокус — работа в прогрессе, этот фокус в настоящее время оценивается и разрабатывается награда!§!."
 FRA_national_defence_plan_cat:0 "План национальной обороны"
 FRA_national_defence_plan_cat_desc:0 "Победа в Великой войне убаюкивала большую часть наших военных опасным чувством безопасности. Но с каждым днем мир становится все темнее, и Франция не должна столкнуться с новым конфликтом."
 FRA_expand_aircraft_procurement:0 "Расширение закупок самолетов"
 FRA_expand_aircraft_procurement_desc:0 "CSG пришла к выводу, что наши запасы современных самолетов слишком малы, чтобы удовлетворить требования следующей войны. Ускоряя программы закупок, изложенные в Планах I-III, мы можем наконец приступить к восстановлению мощного и современного воздушного флота."
 FRA_execute_the_dyle_plan:0 "Выполнить план Дайла"
 FRA_execute_the_dyle_plan_desc:0 "Чтобы защитить север Франции и Бельгию, КГС одобрила план Дайла. Наши силы продвигаются к линии реки Дайл в начале войны, устанавливая передовую оборону для сдерживания любого немецкого наступления."
 FRA_expand_the_armed_forces:0 "Расширение армии де Терре"
 FRA_the_dyle_mission:0 "Миссия Dyle"
 FRA_r56rp_colonial_management_cat:0 "Управление колониями"
 FRA_r56rp_colonial_management_cat_desc:0 "Наша колониальная империя является одной из крупнейших в мире, и поэтому она требует немного большего управления, чем можно было бы ожидать. Отсюда мы можем перекроить некоторые из прежних договоров, которые были подписаны несколько лет назад, а также создать новые и управлять новыми договорами.\n"
 FRA_r56rp_rewrite_tunisian_protectorate_treaty:0 "Переписать §Yтунисский§! Договор о протекторате"
 FRA_r56rp_rewrite_moroccan_protectorate_treaty:0 "Переписать §Yмарокканский§! Договор о протекторате"
 FRA_r56rp_form_the_feaa:0 "Форма §YФранцузская восточноазиатская администрация§!"
 FRA_r56rp_expand_the_administrative_zone_west:0 "Расширение административной зоны Запада"
 FRA_r56rp_expand_the_administrative_zone_south:0 "Расширение административной зоны на юг"
 FRA_r56rp_form_an_feaa_expeditionary_task_force:0 "Формировать §YФранцузская Восточно-Азиатская административная§! Экспедиционная оперативная группа"
 FRA_strenghten_aircraft_small_procurement_tt:0 "Производили или приобретали §Y[?ROOT.FRA_fighters_to_produce]§! новый §Y$fighter_equipment$§! Самолет.\nНынешние бойцы §Yразвернутый§! или в §YСклад§!: §G[?ROOT.num_deployed_planes_with_type@small_plane_airframe]§!\n"
 FRA_strenghten_aircraft_large_procurement_tt:0 "Производили или приобретали §Y[?ROOT.FRA_bombers_to_produce]§! новый §Y$tac_bomber_equipment$§! Самолет.\nТекущие бомбардировщики §Yразвернутый§! или в §YСклад§!: §G[?ROOT.num_deployed_planes_with_type@medium_plane_airframe]§!\n"
 FRA_strenghten_cas_procurement_tt:0 "Производили или приобретали §Y[?ROOT.FRA_CAS_to_produce]§! новый §Y$CAS_equipment$§! Самолет.\nТекущая поддержка Close Air §Yразвернутый§! или в §YСклад§!: §G[?ROOT.num_deployed_planes_with_type@small_plane_cas_airframe]§!"
 FRA_indochina_controlled:0 "Контролирует все §Yвьетнамский§!, §Yкамбоджийский§! и §Yлаосский§! Государства"
 r56rp_bilateral_trade_agreement:0 "Двусторонние торговые соглашения"
 r56rp_FRA_fortify_marianne:0 "Укрепи нашу Марианну"
 FRA_oriental_development_company:0 "Société Financière Française et Coloniale"
 FRA_colonial_army_fuck_simpy:0 "Колониальные труппы"
 FRA_employment_issues_simpyfart:0 "Управляемая занятость"
 r56rp_FRA_agricultural_national_office:0 "Сельскохозяйственное национальное бюро"
 FRA_r56rp_dynamic_market_stimulation:0 "Стимуляция рынка"
 r56rp_FRA_rebuilding_the_escadre_de_ligne:0 "Восстановление Эскадра де Линь"
 FRA_naval_construction_program:0 "Программа военно-морского строительства"
 r56rp_FRA_reorganizing_naval_groups:0 "Реорганизация военно-морских групп"
 r56rp_FRA_french_union_leader:0 "Лидер Французского союза"
 r56rp_FRA_french_union_member:0 "Член Французского Союза"
 FRA_r56rp_armee_de_terre:0 "Армия де Терре"
 FRA_r56rp_armee_de_terre_desc:0 ""
 FRA_r56rp_kickstart_the_arms_industry:0 "Kickstart оружейная промышленность"
 FRA_r56rp_kickstart_the_arms_industry_desc:0 "В первых программах перевооружения (Планы I–III) было показано, насколько сильно отстал наш сектор вооружений. За счет вливания средств, реорганизации промышленности и ускорения государственного надзора мы можем, наконец, начать крупномасштабное производство оружия и удовлетворить требования современной войны."
 FRA_r56rp_la_bataille_methodique:0 "Методика Баттаиля"
 FRA_r56rp_la_bataille_methodique_desc:0 "Мы по-прежнему привержены доктрине, в которой огневая мощь, фиксированные графики и централизованный контроль диктуют темп битвы, хотя и медленный и негибкий, этот метод обеспечивает предсказуемость, если не адаптируемость в будущих конфликтах."
 FRA_r56rp_supressive_barrage:0 "Превосходный Барраж"
 FRA_r56rp_supressive_barrage_desc:0 "С завершением нашей модернизации и планирования наша армия теперь может использовать устойчивый огневой подавление, чтобы сбить вражеские формирования, сорвать их движения и создать отверстия для решительных атак."
 FRA_r56rp_chasseurs_de_chars:0 "Шахтеры де Шар"
 FRA_r56rp_chasseurs_de_chars_desc:0 "Для противодействия бронетанковой угрозе, которую представляют наши соперники, должны быть разработаны специализированные танково-разрушительные соединения. Быстрые, хорошо вооруженные и предназначенные для уничтожения вражеской брони, эти машины обеспечат проворное и смертоносное противотанковое копье."
 FRA_r56rp_doctrinal_modernization:0 "Модернизация доктрины"
 FRA_r56rp_doctrinal_modernization_desc:0 "Теперь, когда структура наших бронетанковых войск сформирована и наши планы приведены в действие, мы можем наконец с уверенностью противостоять нашим врагам. Мы не только полагаемся на силу Мажино и людей, укомплектовавших ее, чтобы защитить нас."
 FRA_r56rp_legere_mecanique:0 "Легендарный меканик"
 FRA_r56rp_legere_mecanique_desc:0 "Мы слишком долго полагались на кавалерию, наши бронетанковые войска должны поддерживаться бронетехникой. Многие из наших национальных компаний уже пришли с проектами для этих транспортных средств."
 FRA_r56rp_chasseur_alpine:0 "Чессер Альпийский"
 FRA_r56rp_chasseur_alpine_desc:0 "Альпийская война требует войск, способных к быстрому движению, точности и непревзойденной выносливости. Расширяя наши формирования, наши элитные подразделения смогут использовать естественную оборону наших нагорий и захватить тактическое преимущество в пересеченной местности."
 FRA_r56rp_frontline_hospitals:0 "Прифронтовые госпитали"
 FRA_r56rp_frontline_hospitals_desc:0 "Великая война преподала нам болезненный урок, бесчисленные храбрые солдаты были потеряны не только из-за огня противника, но и из-за инфекции, воздействия и болезней. Инвестируя в современные фронтовые медицинские подразделения, мы можем гарантировать, что следующая война, если она наступит, не унесет столько жизней без необходимости."
 FRA_r56rp_end_the_interservice_rivalry:0 "Покончить с межсервисным соперничеством"
 FRA_r56rp_end_the_interservice_rivalry_desc:0 ""
 FRA_r56rp_strengthen_northern:0 "Укрепление северной промышленности"
 FRA_r56rp_strengthen_northern_desc:0 ""
 FRA_r56rp_strengthen_southern:0 "Укрепление южной промышленности"
 FRA_r56rp_strengthen_southern_desc:0 ""
 FRA_r56rp_empower_the_national_economic_council:0 "Расширение прав и возможностей Национального экономического совета"
 FRA_r56rp_empower_the_national_economic_council_desc:0 "Несмотря на то, что Национальный экономический совет был создан еще в 1925 году, он долгое время не использовался и политически отошел на второй план. Оживляя Совет и расширяя его полномочия, мы можем восстановить его в качестве центрального форума, где профсоюзы, работодатели и правительственные эксперты координируют наши действия по реагированию на экономический кризис."
 FRA_r56rp_nationalize_gas_and_electricity_sector:0 "Национализация газового и электроэнергетического сектора"
 FRA_r56rp_nationalize_gas_and_electricity_sector_desc:0 ""
 FRA_r56rp_ride_it_out:0 "Поездка вон"
 FRA_r56rp_ride_it_out_desc:0 "Девальвация может обещать быстрое облегчение, но она также приносит хаос, инфляцию и гибель миллионов людей, которые доверяют стабильности франка. Наша страна будет крепкой!"
 FRA_r56rp_renault_factories:0 "Заводы Renault"
 FRA_r56rp_renault_factories_desc:0 "С надвигающимся конфликтом Renault предложила инвестировать в южные французские штаты, уводя свои производственные линии подальше от полей сражений."
 FRA_r56rp_rejuvinated_economy:0 "Восстановленная экономика"
 FRA_r56rp_rejuvinated_economy_desc:0 ""
 FRA_r56rp_military_focused_research:0 "Военно-ориентированные исследования"
 FRA_r56rp_military_focused_research_desc:0 ""
 FRA_r56rp_civilian_research:0 "Гражданские сфокусированные исследования"
 FRA_r56rp_civilian_research_desc:0 ""
 FRA_r56rp_towards_a_war_economy:0 "На пути к военной экономике"
 FRA_r56rp_towards_a_war_economy_desc:0 ""
 FRA_r56rp_expand_the_calais_mining_basin:0 "Расширение бассейна Кале"
 FRA_r56rp_expand_the_calais_mining_basin_desc:0 "Бассейн Кале остается промышленным сердцем Франции, производя большую часть нашего угля. Модернизируя шахты, расширяя добывающие шахты и улучшая доступ к железным дорогам, мы можем значительно увеличить национальную выработку энергии и снизить зависимость от импортного топлива."
 FRA_r56rp_bilateral_trade_agreements:0 "Двусторонние торговые соглашения"
 FRA_r56rp_bilateral_trade_agreements_desc:0 "Поскольку мировая торговля все еще ослаблена Депрессией, мы должны обеспечить надежные рынки через согласованные соглашения. Укрепление наших коммерческих связей с дружественными странами позволит стабилизировать экспорт, обеспечить доступ к материалам и укрепить наши позиции в Европе."
 FRA_r56rp_modernization_of_the_battlefleet:0 "Модернизация боевого флота"
 FRA_r56rp_modernization_of_the_battlefleet_desc:0 "Несмотря на то, что мы полностью приняли Jeune École, наш флот по-прежнему в значительной степени полагается на большие, стареющие капитальные корабли. При таких темпах наш флот устареет в течение нескольких лет. Мы должны модернизировать наш боевой флот, чтобы отразить нашу новую доктрину, отдавая приоритет скорости, гибкости и современным технологиям."
 FRA_r56rp_marine_nationale:0 "Морской пехотинец"
 FRA_r56rp_marine_nationale_desc:0 ""
 FRA_r56rp_reaffirm_ecole_de_ligne_de_bataille:0 "Подтверждено École de la Ligne de Bataille"
 FRA_r56rp_reaffirm_ecole_de_ligne_de_bataille_desc:0 ""
 FRA_r56rp_ministere_de_la_france_de_outre_mer:0 "Министр иностранных дел Франции"
 FRA_r56rp_ministere_de_la_france_de_outre_mer_desc:0 ""
 FRA_r56rp_withdraw_from_our_contested_holdings:0 "Вывод из оспариваемых холдингов"
 FRA_r56rp_withdraw_from_our_contested_holdings_desc:0 ""
 FRA_r56rp_revisit_colonial_policy:0 "Пересмотреть колониальную политику"
 FRA_r56rp_revisit_colonial_policy_desc:0 "Растущие беспорядки и меняющиеся международные условия требуют переоценки нашего управления за рубежом. Сохранение статус-кво больше не является жизнеспособным вариантом."
 FRA_r56rp_reinforce_the_empire:0 "Укрепить империю"
 FRA_r56rp_reinforce_the_empire_desc:0 "Для того чтобы наша страна выдержала давление растущего мира, мы должны укрепить наши колониальные владения, огромные ресурсы будут продолжать укреплять нашу позицию в мире."
 FRA_r56rp_freedom_for_the_pacific:0 "Свобода для Тихого океана"
 FRA_r56rp_freedom_for_the_pacific_desc:0 "Территории Тихого океана дорого стоят для управления и трудно защищаются. Расширение автономии предлагает практическое решение местных требований, сохраняя при этом доступ и сотрудничество Франции."
 FRA_r56rp_self_goverment_for_the_americas:0 "Самоуправление для Америки"
 FRA_r56rp_self_goverment_for_the_americas_desc:0 "Предоставление самоуправления карибским и гвианской территориям уменьшит сопротивление и позволит нам отступить, не отказываясь полностью от своих стратегических и экономических интересов."
 FRA_r56rp_suppress_independence_movements:0 "Подавить движение за независимость"
 FRA_r56rp_suppress_independence_movements_desc:0 ""
 FRA_r56rp_societe_financiere_francaise_et_coloniale:0 "Société Financière Française et Coloniale"
 FRA_r56rp_societe_financiere_francaise_et_coloniale_desc:0 ""
 FRA_r56rp_maintain_the_union:0 "Поддерживать Союз"
 FRA_r56rp_maintain_the_union_desc:0 "Индокитайский союз является жемчужиной нашей заморской империи. Его единство под властью Франции необходимо для стабильности, процветания и сохранения нашего влияния на Дальнем Востоке. Мы не можем допустить, чтобы эта структура была демонтирована."
 FRA_r56rp_reinforce_indigenous_authorities:0 "Укрепление местных властей"
 FRA_r56rp_reinforce_indigenous_authorities_desc:0 "По всему нашему заморскому владению возникла лояльная колониальная элита, администраторы, офицеры и примечательные люди, чьи интересы неотделимы от интересов Франции."
 FRA_r56rp_allies_not_subjects:0 "Союзники не подданные"
 FRA_r56rp_allies_not_subjects_desc:0 "Колониальная система больше не может существовать. Превращая наши заморские территории в партнеров, а не в иждивенцев, Франция может сохранить влияние, избегая при этом открытых беспорядков."
 FRA_r56rp_citizenship_through_service:0 "Гражданство через службу"
 FRA_r56rp_citizenship_through_service_desc:0 "Французская республика всегда вознаграждала лояльность. Те из наших колониальных подданных, которые служат Франции в форме, администрации или промышленности, получат полное гражданство и будут защищены всеми законами мужчин."
