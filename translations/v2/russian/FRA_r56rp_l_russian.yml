 FRA_r56rp_end_of_the_colonial_empire:0 "Конец колониальной империи"
 FRA_r56rp_end_of_the_colonial_empire_desc:0 ""
 FRA_r56rp_professionalize_colonial_forces:0 "Профессионализация колониальных сил"
 FRA_r56rp_professionalize_colonial_forces_desc:0 "Улучшая подготовку, снаряжение и командные структуры, мы преобразуем наши колониальные силы в дисциплинированную и надежную элиту, способную защищать французские интересы за рубежом."
 FRA_r56rp_equality_under_the_flag:0 "Равенство под флагом"
 FRA_r56rp_equality_under_the_flag_desc:0 "Все, кто служит Франции, будут равны под триколором, укрепляя единство, лояльность и сплоченность по всей империи."
 FRA_r56rp_colonial_army_of_france:0 "Колониальные труппы"
 FRA_r56rp_managed_employment:0 "Управляемая занятость"
 FRA_r56rp_maintain_parliamentary_oversight:0 "Сохранение парламентского контроля"
 FRA_r56rp_maintain_parliamentary_oversight_desc:0 ""
 FRA_r56rp_adress_the_stagnant_economy:0 "Обратимся к застойной экономике"
 FRA_r56rp_adress_the_stagnant_economy_desc:0 ""
 FRA_r56rp_formalize_the_CAE:0 "Формализовать CAE"
 FRA_r56rp_formalize_the_CAE_desc:0 ""
 FRA_r56rp_tackle_deflation:0 "Борьба с дефляцией"
 FRA_r56rp_tackle_deflation_desc:0 ""
 FRA_r56rp_guaranteed_contracts:0 "Гарантированные контракты"
 FRA_r56rp_guaranteed_contracts_desc:0 "Многие в нашей оружейной промышленности обеспокоены тем, что наши планы национализации будут ограничивать контракты для частных инвесторов, чтобы обеспечить их поддержку, мы должны гарантировать контракты."
 FRA_r56rp_bank_of_france_reform:0 "Реформа Банка Франции"
