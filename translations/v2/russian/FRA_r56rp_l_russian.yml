 FRA_r56rp_agricultural_investments_desc:0 ""
 FRA_r56rp_price_controls:0 "Контроль цен"
 FRA_r56rp_price_controls_desc:0 ""
 FRA_r56rp_a_planned_economy:0 "Планируемая экономика"
 FRA_r56rp_a_planned_economy_desc:0 ""
 FRA_r56rp_expand_state_arsenals:0 "Расширение государственных арсеналов"
 FRA_r56rp_expand_state_arsenals_desc:0 ""
 FRA_r56rp_fund_scs:0 "Фонд SCS"
 FRA_r56rp_fund_scs_desc:0 ""
 FRA_r56rp_national_defence_plan:0 "План национальной обороны"
 FRA_r56rp_national_defence_plan_desc:0 "С возрождающимся [GER.GetName] и [ITA.GetName]Ясно, что вскоре конфликт может стать неизбежным. Мы должны укрепить нашу оборону, реорганизовать наши силы и подготовить нацию к предстоящим испытаниям."
 FRA_r56rp_giraud_plan:0 "План Жиро"
 FRA_r56rp_giraud_plan_desc:0 "В подобные времена лучше всего укреплять оборону. Пусть угрозы сами придут к нам, и тогда мы разберёмся с ними на своей земле. У нас есть идеальный кандидат на командование армией — осталось лишь дать приказ."
 FRA_r56rp_the_queen_of_battle:0 "Царица полей"
 FRA_r56rp_the_queen_of_battle_desc:0 "Пехота всегда была основой нашей армии, и с современными доктринами и достижениями в их оснащении мы теперь полностью способны защитить нашу Марианну."
 FRA_r56rp_fortification_focus:0 "Упор на укрепления"
 FRA_r56rp_fortification_focus_desc:0 "«Мажино» и наши альпийские форты нуждаются в модернизации и расширении с новой запланированной линией обороны. У нас будет время ответить и укрепить свою позицию."
 FRA_r56rp_commission_fortified_regions:0 "Миссия КОРФ"
 FRA_r56rp_commission_fortified_regions_desc:0 "Мы можем воссоздать старую Комиссию по организации укреплённых районов 1927 года, чтобы изучить существующие пограничные укрепления и обновить планы обороны."
 FRA_r56rp_strenghten_anti_tank_capabilities:0 "Укрепление противотанковых возможностей"
 FRA_r56rp_strenghten_anti_tank_capabilities_desc:0 "Наши пушки уже не могут идти в ногу с ростом толщины брони. Отдавая приоритет улучшенной противотанковой артиллерии, мы обеспечим, чтобы наши танки и наша пехота могли остановить любую бронированную угрозу в лоб."
 FRA_r56rp_modernize_infantry_equipment:0 "Модернизировать пехотное снаряжение"
 FRA_r56rp_modernize_infantry_equipment_desc:0 "Наши солдаты заслуживают надежного современного оборудования. Инвестиции в новые винтовки, пулеметы и обучение пехоты укрепят основу нашей армии."
 FRA_r56rp_extend_the_maginot_line:0 "Продлить линию Мажино"
 FRA_r56rp_extend_the_maginot_line_desc:0 "Мы не можем рассчитывать, что [BEL.GetNameDef] удержит позиции; если они пропустят вражеские армии, у нас могут возникнуть серьёзные проблемы. Продление линии Мажино жизненно важно, чтобы не допустить нежелательные войска на территорию [FRA.GetNameDef]!"
 FRA_r56rp_partial_mobilization:0 "Частичная мобилизация"
 FRA_r56rp_partial_mobilization_desc:0 ""
 FRA_r56rp_de_gaulle_strategy:0 "Стратегия де Голля"
 FRA_r56rp_de_gaulle_strategy_desc:0 "Мы не можем бездействовать, пока враги приближаются к нашим границам, и не можем бросить союзников на произвол судьбы в случае войны. Подготовить армию! Гамелен подходит для этой задачи."
 FRA_r56rp_la_guerra_mecanique:0 "La Guerre Mécanique"
 FRA_r56rp_la_guerra_mecanique_desc:0 "Будущее войны будет определяться скоростью, сталью и мобильностью. Охватывая полностью механизированные формирования и современную бронетанковую доктрину, мы будем готовы к следующей великой войне."
 FRA_r56rp_chars_de_bataille:0 "Шарс де Баталь"
 FRA_r56rp_chars_de_bataille_desc:0 ""
 FRA_r56rp_chars_de_infanterie:0 "Обсуждение Chars d'Appui d'Infanterie"
 FRA_r56rp_chars_de_infanterie_desc:0 "Как бы то ни было, основная задача танков — дать возможность пехоте взять и удержать позиции. Поэтому мы должны всегда обеспечивать поддержку наших пехотных частей современными, адекватно вооруженными и наиболее боеспособными танками."
 FRA_r56rp_mechanized_focus:0 "Ставка на боевые машины"
 FRA_r56rp_mechanized_focus_desc:0 "Танки — это путь вперед в военной промышленности. Мы хотим контролировать поле боя, и нам понадобятся новые мощные танки!"
 FRA_r56rp_tank_modernisation:0 "Модернизация доктрины"
 FRA_r56rp_tank_modernisation_desc:0 "Бронетехника играла всё более важную роль в войне. Хотя она выглядит менее грозно, чем обычный танк, она даёт преимущества в связи, управлении, перевозках и городских боях."
 FRA_r56rp_further_armament_program:0 "Дальнейшая программа вооружения"
 FRA_r56rp_further_armament_program_desc:0 "Благодаря новым средствам для армии мы сможем массово производить оружие. Винтовка окажется в руках каждого."
 FRA_r56rp_infantry_focus:0 "Леви в массовом порядке"
 FRA_r56rp_infantry_focus_desc:0 "Все мужчины и женщины, способные сражаться, будут сражаться. Мы должны направить государственные ресурсы на производство и совершенствование пехотного оружия."
 FRA_r56rp_artillery_focus:0 "Большая батарея"
 FRA_r56rp_artillery_focus_desc:0 "Наша артиллерия будет сведена в единое мощное соединение, способное сосредоточивать огонь на конкретных участках. Мы ослабим вражескую линию и пробьёмся через неё залп за залпом!"
 FRA_r56rp_army_reform:0 "Армейская реформа"
 FRA_r56rp_army_reform_desc:0 "Ни одна пехотная часть или высокотехнологичный танк сами по себе не выиграют войну. Мы должны развивать как тактические, так и стратегические возможности. С правильными людьми на нужных должностях наша армия сможет развиваться."
 FRA_r56rp_division_cuirassee:0 "Подразделение Куйрасе"
 FRA_r56rp_division_cuirassee_desc:0 ""
 FRA_r56rp_general_mobilisation_order:0 "Приказ о всеобщей мобилизации"
 FRA_r56rp_general_mobilisation_order_desc:0 "Необходимо привести сухопутную армию, военно-воздушные силы и морскую пехоту в состояние боевой готовности и мобилизовать всех доступных [FRA.GetAdjective] граждан."
 FRA_r56rp_africa_army:0 "Армия Африки"
 FRA_r56rp_africa_army_desc:0 "Опыт Армии Африки обеспечит господство в колониях и Северной Африке. Мы можем рассчитывать на арабских и берберских добровольцев, а также на полки [FRA.GetAdjective] поселенцев."
 FRA_r56rp_colonial_troops:0 "Колониальные войска"
 FRA_r56rp_colonial_troops_desc:0 "Колониальные войска не входят в состав Армии Африки и объединяют местные подразделения Западной и Центральной Африки. Их снаряжение поможет вести боевые действия в суровых условиях."
 FRA_r56rp_foreign_legion:0 "Иностранный легион"
 FRA_r56rp_foreign_legion_desc:0 "Иностранный легион — элитное подразделение Армии Африки, состоящее из солдат разных национальностей и происхождения. Опыт легионеров и качество подготовки сделают их нашим остриём."
 FRA_r56rp_commandos_marine:0 "Морские коммандос"
 FRA_r56rp_commandos_marine_desc:0 "Морские коммандос являются силами специальных операций [FRA.GetAdjective] флота. Их опыт в морских десантах и разведке защитит [FRA.GetNameDef] и позволит побеждать врагов даже на далёких берегах."
 FRA_r56rp_blum_viollette_project:0 "Проект Блюма — Виолетта"
 FRA_r56rp_blum_viollette_project_desc:0 "Проект Блюма — Виолетта предусматривал предоставление полного [FRA.GetAdjective] гражданства меньшинству алжирцев с последующим распространением этих прав на другие группы. Этот аргумент поможет расширить набор в колонии, но вызовет массовые протесты [FRA.GetAdjective] поселенцев."
 FRA_r56rp_abolish_indigenat_statut:0 "Отменить статус индижената"
 FRA_r56rp_abolish_indigenat_statut_desc:0 "Каждый человек на [FRA.GetAdjective] земле должен обладать равными правами независимо от происхождения. Следует предоставить полное гражданство всем алжирцам, даже если это приведёт к конфликту с [FRA.GetAdjective] поселенцами."
 FRA_r56rp_the_somua_s35:0 "SOMUA S35"
 FRA_r56rp_the_somua_s35_desc:0 "Наши враги могут выставить значительное число танков. Мы разработаем и введём в строй гораздо лучшую [FRA.GetAdjective] машину — хорошо бронированную и достаточно быструю, чтобы сорвать планы любых механизированных сил, решивших испытать мощь [FRA.GetAdjective] армии."
 FRA_r56rp_the_mas38:0 "MAS-38"
 FRA_r56rp_the_mas38_desc:0 "[FRA.GetAdjective] армия традиционно использует самые современные образцы стрелкового оружия. Мы продолжим эту традицию."
 FRA_r56rp_naval_construction_program:0 "Программа военно-морского строительства"
 FRA_r56rp_naval_construction_program_tt:0 "Недостаточно строительных ячеек для §Yвоенно-морской базы§!"
 FRA_r56rp_naval_construction_program_desc:0 "Если мы намерены расширять флот, первым шагом должно стать улучшение и развитие военно-морских баз. Наши уникальные корабли требуют постоянного обслуживания, чтобы всегда оставаться боеготовыми."
 FRA_r56rp_atlantic_domination:0 "Господство в Атлантике"
 FRA_r56rp_atlantic_domination_desc:0 "Совершенствование конструкции линкоров даст значительные тактические преимущества в Атлантике. При их непревзойдённых дальности и мощи никто не сможет уйти от их орудий."
 FRA_r56rp_pacific_protection:0 "Защита Тихого океана"
 FRA_r56rp_pacific_protection_desc:0 "Военно-морские теоретики обратили внимание на устаревшие авианосцы. Они предлагают новые способы их применения при правильном направлении развития. Без полной поддержки настоящего прогресса не добиться. Это обеспечит контроль над Тихим океаном и поможет защитить колонии от [JAP.GetNameDef]."
 FRA_r56rp_darlan_doctrine:0 "Доктрина Дарлана"
 FRA_r56rp_darlan_doctrine_desc:0 "Новые проекты кораблей открыли возможности для новых тактических и стратегических манёвров на море. Адмирал Дарлан разработал собственные теории морских операций; следует выделить ресурсы для их испытаний и завершить военные планы до начала бури."
 FRA_r56rp_naval_gunnery:0 "Морская артиллерия"
 FRA_r56rp_naval_gunnery_desc:0 "Повысить эффективность нашего военно-морского оборудования, чтобы сильнее ударить и управлять морями."
 FRA_r56rp_mediterranean_special_measures:0 "Особые меры в Средиземном море"
 FRA_r56rp_mediterranean_special_measures_desc:0 "[ITA.GetAdjective] силы укрепляют флот и мечтают о господстве в Средиземном море. Потеря морского рубежа обороны создаст угрозу прямого вторжения на родину. Необходимо строить корабли с применением новейших технологий."
 FRA_r56rp_standardisation_engine:0 "Стандартизация двигателей"
 FRA_r56rp_standardisation_engine_desc:0 "Наши подводные лодки и морские бомбардировщики устарели и требуют замены. Однако существует слишком много вариантов основных образцов техники, чтобы наладить конвейерное производство. Приоритетом станет стандартизация."
 FRA_r56rp_CHEDN:0 "Основать КВИН"
 FRA_r56rp_CHEDN_desc:0 "Колледж высших исследований национальной обороны станет ведущим теоретическим учреждением для подготовки будущих руководителей в вопросах национальной безопасности. Адмирал Рауль Кастекс предложил заложить основы этого грандиозного проекта."
 FRA_r56rp_adopt_castexian_strategy:0 "Принять кастексскую стратегию"
 FRA_r56rp_adopt_castexian_strategy_desc:0 "Адмирал Кастекс предложил ряд доктринальных идей, противоречащих культу линкора. Следует проверить их на практике и выяснить, насколько они состоятельны."
 FRA_r56rp_adapt_young_school_concepts:0 "Адаптировать идеи «Молодой школы»"
 FRA_r56rp_adapt_young_school_concepts_desc:0 "Мы убедились в эффективности подводных рейдов; следует развить этот успех с учётом новых предложений «Молодой школы» по их применению."
 FRA_r56rp_undersea_combat:0 "Подводная битва"
 FRA_r56rp_undersea_combat_desc:0 ""
 FRA_r56rp_strategic_manoeuvre:0 "Стратегический манёвр"
 FRA_r56rp_strategic_manoeuvre_desc:0 "Дальнейшие учения и совершенствование доктрины морских манёвров принесут [FRA.GetAdjective] флоту значительную пользу."
 FRA_r56rp_the_le_hardi_class_destroyer:0 "Эсминец типа «Ле Арди»"
 FRA_r56rp_the_le_hardi_class_destroyer_desc:0 "Скромный эсминец может оказаться лучшим защитником наших кораблей в море. Мы закажем новую серию эсминцев, способных выполнять эту задачу."
 FRA_r56rp_renounce_the_london_naval_treaty:0 "Отменить Лондонский морской договор"
 FRA_r56rp_renounce_the_london_naval_treaty_desc:0 "Линкор остается самым решающим оружием на море. Поэтому мы продолжим строительство Жана Барта и будем продолжать усилия по модернизации и реконструкции нашего боевого флота, поэтому нам нельзя позволить продолжать с ограничениями Лондонского военно-морского договора."
 FRA_r56rp_heavier_naval_guns:0 "Модернизация тяжелых морских орудий"
 FRA_r56rp_heavier_naval_guns_desc:0 ""
 FRA_r56rp_gunnery_mastery_efforts:0 "Усилия Gunnery Mastery"
 FRA_r56rp_gunnery_mastery_efforts_desc:0 "Модернизируя традиционные методы боевого флота, более острый кронштейновый огонь, более четкие красители для снарядов и более жесткие артиллерийские процедуры, мы совершенствуем цель и дисциплину нашего флота."
 FRA_r56rp_improved_screen_ships:0 "Улучшенные корабли охранения"
 FRA_r56rp_improved_screen_ships_desc:0 ""
 FRA_r56rp_strength_in_numbers:0 "Сила в цифрах"
 FRA_r56rp_strength_in_numbers_desc:0 "Сила боевого флота заключается в массе и сплоченности. Мы должны расширять капитал и сопровождать строительство, мы должны обеспечить, чтобы нас было больше, чем наших врагов, или по размеру нашего флота, сдерживать любую агрессию."
 FRA_r56rp_secure_shipping_lines:0 "Безопасные судоходные ланы"
 FRA_r56rp_secure_shipping_lines_desc:0 "Подводные лодки остаются серьезной угрозой для нашего торгового флота. Мы должны разработать улучшенные противолодочные меры и пересмотреть тактику защиты конвоев. Мы не можем позволить морским спасательным линиям колониальной империи стать жертвами враждебных набегов, обеспечение безопасности этих маршрутов имеет важное значение для нашего национального выживания."
 FRA_r56rp_the_modern_battlefleet:0 "Современный боевой флот"
 FRA_r56rp_the_modern_battlefleet_desc:0 "С новыми быстрыми линкорами, восстановленными капитальными кораблями и улучшенными стандартами наводки мы можем по-настоящему отметить наши достижения!"
 FRA_r56rp_increase_repair_capabilities:0 "Расширить ремонтные возможности"
 FRA_r56rp_increase_repair_capabilities_desc:0 "Без достаточных мощностей верфей для ремонта после морских столкновений наш флот быстро износится в череде сражений. Следует выделить необходимые ресурсы и специалистов."
 FRA_r56rp__reaffirm_ecole_de_ligne_de_bataille:0 "Подтверждено École de la Ligne de Bataille"
 FRA_r56rp__reaffirm_ecole_de_ligne_de_bataille_desc:0 "На протяжении десятилетий Школа Линь де Баталь считала, что судьба народов решается великими линиями фронта. Броненосцы, а не подводные лодки или самолеты, являются орудиями истинной морской мощи, и победа приходит от встречи с врагом в открытом бою и разрушения их флота."
 FRA_r56rp_masters_of_the_mediterranean:0 "Мастера Средиземноморья"
 FRA_r56rp_masters_of_the_mediterranean_desc:0 "Италия, нависшая над узким морем, как темная стена из мрамора и огня, готовится к финальной борьбе, которая раз и навсегда решит, кто по-настоящему командует Mare Nostrum."
 FRA_r56rp_the_alsace_program:0 "Программа Эльзаса"
 FRA_r56rp_the_alsace_program_desc:0 "Предложенные линкоры класса Alsace, более крупные и более вооруженные, чем все, что в настоящее время находится на плаву, когда-то считались слишком амбициозными. С новой приверженностью линии фронта мы можем возобновить работу над этими титанами и обеспечить наше господство в Средиземном море."
 FRA_r56rp_endorse_the_jeune_ecole:0 "Одобрить Школу Юни"
 FRA_r56rp_endorse_the_jeune_ecole_desc:0 ""
 FRA_r56rp_torpedo_boat_development:0 "Разработка торпедных лодок"
 FRA_r56rp_torpedo_boat_development_desc:0 "Маленькие, быстрые ударные корабли представляют собой чистейшее выражение мышления Юн Эколе. За счет усовершенствования торпедной техники и расширения специализированных строительных объектов мы можем производить суда, способные поражать корабли в разы больше их размера."
 FRA_r56rp_submarine_efforts:0 "Подводные усилия"
 FRA_r56rp_submarine_efforts_desc:0 "Мы стали свидетелями полного опустошения, которое нанесли подводные кампании Великой войны в одиночку, подводная война достигла зрелости в последнее десятилетие, теперь она представляет реальную угрозу для любых и всех надводных кораблей - если мы хотим выжить в следующей войне, наши военно-морские силы должны быть угрозой."
 FRA_r56rp_sea_denial_doctrine:0 "Доктрина морского отрицания"
 FRA_r56rp_sea_denial_doctrine_desc:0 "Офицеры нашего уважаемого военно-морского флота утверждают, что Франция не может надеяться доминировать в океанах, но она может отказать им в своих врагах. Доктрина, которая подчеркивает мины, торпеды, засады и асимметричные действия, чтобы сделать враждебные перевозки постоянно находящимися под угрозой, должна быть быстро принята."
 FRA_r56rp_intensify_torpedo_manufacturing:0 "Интенсифицировать производство торпеды"
 FRA_r56rp_intensify_torpedo_manufacturing_desc:0 "С приведением в действие наших планов, если мы хотим поддержать большой флот подводных лодок, торпедных катеров и торговых рейдеров, мы должны активизировать производство торпедов путем стендаристизации компонентов и расширения оружейных заводов."
 FRA_r56rp_expand_naval_intelligence:0 "Расширение военно-морской разведки"
 FRA_r56rp_expand_naval_intelligence_desc:0 "Следуя принципам Юн Эколь, расширение криптографии, сетей наблюдения и океанографического интеллекта позволит нам быстро маневрировать против наших врагов."
 FRA_r56rp_colonial_naval_bases:0 "Колониальные морские базы"
 FRA_r56rp_colonial_naval_bases_desc:0 ""
 FRA_r56rp_colonial_repair_facilities:0 "Колониальные ремонтные сооружения"
 FRA_r56rp_colonial_repair_facilities_desc:0 "Расширение ремонтных доков по всей нашей колониальной империи обеспечивает удлиненную глобальную морскую выносливость, поврежденные корабли смогут быстро вернуться к действиям и позволят нашим силам действовать вдали от дома с уверенностью."
 FRA_r56rp_ecole_navale_asymetrique:0 "École Navale Asymétrique"
 FRA_r56rp_ecole_navale_asymetrique_desc:0 ""
 FRA_r56rp_ecole_navale_combine:0 "École Navale Combinée"
 FRA_r56rp_ecole_navale_combine_desc:0 "Изучая теории Юн Эколе и Кастекса, мы начинаем создавать единую военно-морскую доктрину. Интеграция их идей в единое стратегическое видение, сохраняя при этом старую гвардию."
 FRA_r56rp_cruiser_raiders:0 "Крейсер Рейдерс"
 FRA_r56rp_cruiser_raiders_desc:0 "Крейсерские эскадры, построенные для скорости, автономности и стратегического маневра, позволят нам угрожать морским путям снабжения противника, заставляя наших врагов охранять каждый океан."
 FRA_r56rp_armee_de_la_air:0 "Армия воздуха"
 FRA_r56rp_armee_de_la_air_desc:0 "Пришло время расширить наши ВВС! Расширяя наши авиабазы, реорганизуя командные структуры и готовясь к массовому производству современных самолетов, мы можем заложить основу для мощных и боеспособных французских ВВС."
 FRA_r56rp_fund_aeronautical_research_facilities:0 "Фонд авиационных научно-исследовательских учреждений"
 FRA_r56rp_fund_aeronautical_research_facilities_desc:0 "Наша авиационная промышленность страдает от фрагментации и устаревших объектов, благодаря финансированию Техники обслуживания аэронавтики мы еще можем сократить разрыв между нашими самолетами и иностранными державами."
 FRA_r56rp_ecole_de_lair:0 "École de l'Air"
 FRA_r56rp_ecole_de_lair_desc:0 "Чтобы обеспечить новое поколение квалифицированных пилотов и офицеров, École de l'Air должна быть расширена и модернизирована. Улучшая стандарты обучения и совершенствуя нашу доктрину, мы можем подготовить профессиональную воздушную руку, готовую к решению предстоящих задач."
 FRA_r56rp_nationalize_key_aircraft_industries:0 "Национализация ключевых авиастроительных отраслей"
 FRA_r56rp_nationalize_key_aircraft_industries_desc:0 "Формирование объединенных производственных групп из раздробленной авиационной промышленности позволит нам стабилизировать производство и повысить эффективность производства."
 FRA_r56rp_light_aircraft_modernisation_program:0 "Программа модернизации легких самолетов"
 FRA_r56rp_light_aircraft_modernisation_program_desc:0 ""
 FRA_r56rp_heavy_aircraft_modernisation_program:0 "Программа модернизации тяжелых самолетов"
 FRA_r56rp_heavy_aircraft_modernisation_program_desc:0 ""
 FRA_r56rp_modernisation_program:0 "Программа модернизации"
 FRA_r56rp_modernisation_program_desc:0 "Некоторые революционные гражданские инженерные решения можно применить к истребителям, повысив их скорость, дальность и практический потолок. Чтобы не отстать от достижений других стран, необходимо сосредоточиться на этом."
 FRA_r56rp_resolve_engine_deficiency:0 "Решить проблему дефицита двигателя"
 FRA_r56rp_resolve_engine_deficiency_desc:0 "Наши ВВС всегда страдали от недостатка мощных двигателей, доступных для производственной линии, с нашей недавней стабилизацией и национализацией производителей самолетов - мы можем разрабатывать и производить двигатели устойчивыми темпами."
 FRA_r56rp_buy_americain:0 "Купить [USA.GetAdjective] бомбардировщики"
 FRA_r56rp_buy_americain_desc:0 "Авиационная поддержка является неотъемлемой частью оборонительных и наступательных возможностей. Нынешние модели бомбардировщиков устарели, однако покупка новейших [USA.GetAdjective] машин позволит нам остаться в гонке."
 FRA_r56rp_buy_americain_tooltip:0 "Мы получим 200 тактических бомбардировщиков от [USA.GetNameDef]."
 FRA_r56rp_barrage_david:0 "Заграждение Давида"
 FRA_r56rp_barrage_david_desc:0 "Вдохновившись [ENG.GetAdjective] открытием, военно-воздушные силы разработали новую модель бистатического радара для обнаружения вражеских самолётов."
 FRA_r56rp_jet_effort:0 "Усилия реактивного"
 FRA_r56rp_jet_effort_desc:0 "Воздушный бой зависит от мобильности. Реактивный двигатель станет настолько решающим прорывом, что вражеские лётчики будут казаться неподвижными, пока мы уничтожаем их в небе."
 FRA_r56rp_interwar_experience:0 "Опыт межвоенного периода"
 FRA_r56rp_interwar_experience_desc:0 "Самолёты поддержки сухопутных войск показали высокую эффективность во время межвоенного восстания в Антиатласе. Был предложен ряд улучшений, которые следует внедрить и испытать на учениях."
 FRA_r56rp_reorganize_air_army:0 "Реорганизовать военно-воздушные силы"
 FRA_r56rp_reorganize_air_army_desc:0 "Мы накопили достаточно опыта, чтобы быстрее проверять новые теории воздушной войны, однако при нынешней структуре командования военно-воздушными силами трудно управлять. Сначала необходимо провести реорганизацию."
 FRA_r56rp_parachute_battalions:0 "ГИА 601–602"
 FRA_r56rp_parachute_battalions_desc:0 "[SOV.GetAdjective] сторона создала новое воздушно-десантное подразделение для переброски солдат и снаряжения. Нам следует сформировать аналогичную часть."
 FRA_r56rp_purchase_american_fighters:0 "Закупить [USA.GetAdjective] истребители"
 FRA_r56rp_purchase_american_fighters_desc:0 "Нехватка современных лёгких самолётов является стратегической слабостью. Следует связаться с [USA.GetAdjective] стороной и приобрести несколько высокоэффективных машин, чтобы обеспечить господство в воздухе."
 FRA_r56rp_form_the_first_strategic_bombing_unit:0 "Сформировать первое соединение стратегических бомбардировщиков"
 FRA_r56rp_form_the_first_strategic_bombing_unit_desc:0 "Бомбардировки заводов противника и его военного потенциала создают мощный сдерживающий эффект и снижают вероятность дальнейшей агрессии. Следует сформировать авиакрыло, способное использовать эту стратегическую возможность."
 FRA_r56rp_support_the_ecole_de_lair:0 "Поддержать Воздушную школу"
 FRA_r56rp_support_the_ecole_de_lair_desc:0 "Наша Воздушная школа готовит пилотов, специализирующихся на воздушных боях и бомбардировках. Следует улучшить программы лётной подготовки с учётом потребностей быстро растущих военно-воздушных сил."
 FRA_r56rp_faire_face:0 "«Фэр фас»"
 FRA_r56rp_faire_face_desc:0 "Благодаря улучшенным военно-воздушным силам мы можем испытать современные разработки и заменить устаревшие представления новыми теориями ведения воздушных операций и применения самолётов в строю."
 FRA_r56rp_finalize_the_potez_630:0 "Завершить разработку Потез 630"
 FRA_r56rp_finalize_the_potez_630_desc:0 "ВИП"
 FRA_r56rp_finalize_the_potez_630_tt:0 "Открывает производство §HПотез 630§!, если он ещё не исследован.\n§HПотез 630§! §Gдешевле§! в производстве, чем обычные истребители.\n"
 FRA_r56rp_develop_the_ms_406:0 "Разработать M.S. 406"
 FRA_r56rp_develop_the_ms_406_desc:0 "ВИП"
 FRA_r56rp_enact_plan_v:0 "Ввести план V"
 FRA_r56rp_enact_plan_v_desc:0 "Последние достижения в воздушной доктрине и организации позволяют создать значительные силы, способные выполнять любые необходимые воздушные операции. Теперь следует выделить средства и производственные мощности для наращивания боевой авиации в соответствии с новыми теориями."
 FRA_r56rp_develop_bomber_fleet:0 "Развивать бомбардировочную авиацию"
 FRA_r56rp_develop_bomber_fleet_desc:0 "Теперь, когда мы способны развернуть значительные военно-воздушные силы, следует создать ещё более совершенные бомбардировщики, способные нести больше бомб и летать дальше и быстрее. Пусть враг знает: триколор может доставить взрывчатку куда угодно и когда угодно."
 FRA_r56rp_follow_up_on_the_potez:0 "Развить проект «Потез»"
 FRA_r56rp_follow_up_on_the_potez_desc:0 "Дальний бомбардировщик беззащитен без надёжного сопровождения. Следует разработать более крупные и дальнобойные истребители сопровождения."
 FRA_r56rp_provide_aerial_support:0 "Обеспечить воздушную поддержку"
 FRA_r56rp_provide_aerial_support_desc:0 "Новые самолёты с большей бомбовой нагрузкой и более прочными планерами идеально подойдут для доктрины поддержки пехотных атак и наступлений."
 FRA_r56rp_new_french_fighter:0 "Новый [FRA.GetAdjective] истребитель"
 FRA_r56rp_new_french_fighter_desc:0 "Следующее поколение [FRA.GetAdjective] лёгких истребителей превзойдёт противника по вооружению, боевым качествам и манёвренности."
 FRA_r56rp_supprt_the_aeronavale:0 "Поддержать морскую авиацию"
 FRA_r56rp_supprt_the_aeronavale_desc:0 "Наша морская авиация получит новые модели самолётов, способные уничтожать целые флоты."
 FRA_r56rp_prioritize_the_joffre:0 "Приоритет для «Жоффра»"
 FRA_r56rp_prioritize_the_joffre_desc:0 ""
 FRA_r56rp_laissez_faire:0 "Laissez Faire"
 FRA_r56rp_laissez_faire_desc:0 ""
 FRA_r56rp_rally_the_technocrats:0 "Собрание технократов"
 FRA_r56rp_rally_the_technocrats_desc:0 ""
 FRA_r56rp_stimulate_the_dynamic_market:0 "Стимулировать динамичный рынок"
 FRA_r56rp_stimulate_the_dynamic_market_desc:0 ""
 FRA_r56rp_accelarate_the_rearmament_program:0 "Ускорить программу перевооружения"
 FRA_r56rp_accelarate_the_rearmament_program_desc:0 ""
 FRA_r56rp_arbitrate_industrial_cartels:0 "Арбитраж промышленных картелей"
 FRA_r56rp_arbitrate_industrial_cartels_desc:0 ""
 FRA_r56rp_expand_resource_allocation_boards:0 "Расширение ресурсов Распределение досок"
 FRA_r56rp_expand_resource_allocation_boards_desc:0 ""
 FRA_r56rp_towards_a_war_industry:0 "На пути к военной промышленности"
 FRA_r56rp_towards_a_war_industry_desc:0 ""
 FRA_r56rp_subsidize_rhone_poutec:0 "Субсидировать Rhone Poutec"
 FRA_r56rp_subsidize_rhone_poutec_desc:0 ""
 FRA_r56rp_promote_entrepeneurship:0 "Поощрение предпринимательства"
 FRA_r56rp_promote_entrepeneurship_desc:0 ""
 FRA_r56rp_empower_land_owners:0 "Расширить полномочия землевладельцев"
 FRA_r56rp_empower_land_owners_desc:0 ""
 FRA_agricultural_protectionism:0 "Сельскохозяйственный протекционизм"
 FRA_agricultural_protectionism_desc:0 ""
 FRA_r56rp_fund_landowner_projects:0 "Фонд проектов землевладельцев"
