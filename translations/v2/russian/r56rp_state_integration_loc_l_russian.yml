 GLO_state_integration_category_desc:0 "При достаточной силе и времени мы должны быть в состоянии интегрировать государства, которые мы оккупировали на нашей территории. Это может стоить нам некоторых ресурсов, но в долгосрочной перспективе это того стоит.\n\n§Gмиролюбивый§! §YТребования к интеграции:§!\n   £national_unity_texticon  §YСоблюдение§! По крайней мере, §G[?GLO_p_comp_cost|G0]%§!\n   £pol_violence  §Yсопротивление§! на уровне или ниже §G[?GLO_p_res_cost|G0]%§!\n   £manpower_texticon  §YДоступные людские ресурсы§! Сверх §G[?GLO_p_mp_cost|G0]§!\n   £unit_category_light_infantry_icon_small  §YПехотное снаряжение в запасе§! Сверх §G[?GLO_p_inf_cost|G0]§!\n£pol_power  §G[?GLO_p_pp_cost|G0]§! §YПолитическая власть§!\n\n§YИнтеграция через§! §RСила§! §YТребования:§!\n £pol_idea   Не имеет никакого §Yдемократический§! или §YНейтралитет§! Правительство у власти\n  £national_unity_texticon  §YСоблюдение§! По крайней мере, §G[?GLO_f_comp_cost|G0]%§!\n   £pol_violence  §Yсопротивление§! на уровне или ниже §G[?GLO_f_res_cost|G0]%§!\n   £manpower_texticon  §YДоступные людские ресурсы§! Сверх §G[?GLO_f_mp_cost|G0]§!\n   £unit_category_light_infantry_icon_small  §YПехотное снаряжение в запасе§! Больше, чем:\n §G$r56rp_state_integration_equation$§!\n$r56rp_state_integration_equation_minor$"
