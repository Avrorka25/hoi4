 WAF_ethnic_disunity_remove_tt:0 "Будет §Gудалено§!, когда §Yподдержка войны§! достигнет §Y50%§! или §Yстабильность§! достигнет §Y80%§!."
 r56_nigeria.1.t:0 "[ROOT.GetNameDefCap] приглашает нас в Западноафриканскую федерацию"
 r56_nigeria.1.desc:0 "The [ROOT.GetAdjective] Правительство в своем стремлении к какой-то панафриканской политике предлагает союз между нашими странами, в котором, якобы, все западноафриканские нации будут объединены в единую федерацию. По сообщениям, которые мы сейчас получили, это будет означать ассимиляцию [ROOT.GetNonIdeologyName] Это федеральное государство, в которое входит Западноафриканская федерация."
 r56_nigeria.1.a:0 "Вместе мы сильнее!"
 r56_nigeria.1.b:0 "Это всего лишь замаскированная аннексия."
 r56_nigeria.2.t:0 "[FROM.GetNameDefCap] вступает в Западноафриканскую федерацию!"
 r56_nigeria.2.desc:0 "[FROM.GetAdjective] правительство согласилось с нашими федералистскими взглядами и присоединится к нашему великому движению. Уже началась подготовка к созданию [ROOT.GetAdjective] институтов и передаче власти. Вскоре [FROM.GetNonIdeologyName] будет полностью интегрирована в наше государство, которое, как мы надеемся, станет Западноафриканской федерацией."
 r56_nigeria.2.a:0 "Превосходно!"
 r56_nigeria.3.t:0 "[FROM.GetNameDefCap] отклоняет наше предложение!"
 r56_nigeria.3.desc:0 "Выступая против идеи федерации, [FROM.GetAdjective] правительство [FROM.GetLeader] отклонило наше предложение, вызвав беспорядки внутри страны. Ранее считалось, что партия [FROM.GetLeader] близка по взглядам к [ROOT.GetLeader], поэтому такой ответ стал шоком для нашего правительства."
 r56_nigeria.3.a:0 "Всего лишь одна неудача."
