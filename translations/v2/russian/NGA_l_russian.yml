 WAF_ethnic_disunity_desc:0 "[ROOT.GetNonIdeologyName] многие годы страдала и ещё долго будет страдать от серьёзной государственной дисфункции, вызванной самим фактом существования множества различных этнических групп и племён, которые зачастую плохо ладят друг с другом. Однажды последствия этнических конфликтов придётся преодолеть, чтобы [ROOT.GetNonIdeologyName] смогла вступить в новую эпоху и процветать!"
