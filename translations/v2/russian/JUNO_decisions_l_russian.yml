l_russian:
 PRU_pastaza_conflict:0 "Напряженность в Амазонии"
 PRU_pastaza_conflict_desc:0 "Хотя наши лидеры урегулировали пограничные споры с Колумбией в Рио-де-Жанейрском протоколе 1934 года, конфликт все еще нависает над эквадорцами. Они по-прежнему претендуют на районы с неоднозначными фактическими владельцами, такими как регионы Напо Пастаза и Сантьяго Замора. Если появится возможность, мы должны захватить регион силой, если это необходимо."
