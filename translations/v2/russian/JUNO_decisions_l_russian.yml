 ARG_economic_tax_reforms_decisions_desc:0 "Внедряя различные изменения в нашу нынешнюю налоговую систему, мы можем оказать помощь сельским районам. [ARG.GetName]. Создание жизнеспособной инфраструктуры для наших фермерских общин будет только способствовать процветанию нашей страны."
 ARG_economic_tax_reforms_decisions_tt:0 "Разблокировать §YЭкономическая налоговая реформа§! решения."
 ARG_economic_reform_in_state:0 "Налоговая реформа в [FROM.GetName]."
 ARG_balancing_act_decisions:0 "Закон о балансировке"
 ARG_balancing_act_decisions_desc:0 "По мере того, как наше новое правительство восстанавливается, мы снова сталкиваемся с проблемой поддержания отношений как с союзниками, так и с державами оси. Эта война, кажется, не имеет непосредственного конца в поле зрения, и поэтому важно, чтобы мы разумно уравновесили наши обязательства. Поклонение одному может расстроить другое."
 ARG_balancing_act_decisions_tt:0 "Разблокировать §YЗакон о балансировке§! Решения, которые позволят нам балансировать между умиротворением [USA.GetFlag]§Y[USA.GetName]§! и [ENG.GetFlag]§Y[ENG.GetName]§! или [GER.GetFlag]§Y[GER.GetName]§! и [ITA.GetFlag]§Y[ITA.GetName]§!. Умиротворение обеспечит §YСубсидии на оборудование§! для §YМеждународный рынок§!"
 ARG_military_coup_decisions:0 "Военное несогласие"
 ARG_military_coup_decisions_desc:0 "По мере того, как наше новоизбранное правительство празднует свою победу на выборах, внутри военных начинает расти чувство недовольства. С таким количеством коррупции в Конкордансии и многими членами военной элиты, борющимися за власть, это только вопрос времени, пока они не наступят на Буэнос-Айрес."
 ARG_military_coup_attempt:0 "Неизбежная попытка военного переворота"
 military_coup_attempt_happened:0 "Попытка военного переворота произошла"
 ARG_military_state_absorption_mission:0 "Военная сборка поддержки"
 ARG_military_state_absorption_timer_tt:0 "В одном государстве [ARG.GetName] Он будет связан с военными."
 ARG_military_owned_state:0 "Военные ячейки присутствуют"
 ARG_military_owned_state_desc:0 "Это государство было отмечено тем, что изобилует мятежными военными ячейками. Если мы позволим этому расти, то риск переворота возрастает."
 ARG_sanction_the_generals:0 "Санкции против генералов"
 ARG_sanction_the_generals_tt:0 "Увеличивает время до начала попытки государственного переворота, что позволяет заблаговременно проводить меньше подготовительных мероприятий повстанческим военным лидерам."
 ARG_consolidating_power_tt:0 "§RЭто разозлит военных и сократит время до начала попытки государственного переворота.§!"
 ARG_increase_military_salaries:0 "Увеличение военных зарплат"
 ARG_federal_intervention_tt:0 "Введение федерального вмешательства в штате не позволит военной фракции поглотить его в случае государственного переворота и последующей гражданской войны."
 ARG_south_american_unity_decisions_tt:0 "Разблокировать §YЮжноамериканское единство§! Решения, которые позволяют нам интегрировать завоеванные территории в нашу нацию."
 ARG_south_american_unity_decisions:0 "Южноамериканское единство"
 ARG_south_american_unity_decisions_desc:0 "Теперь, когда мы объединили народ Южной Америки под одним знаменем, мы можем утвердить наше господство над континентом, вводя территорию бывших более крупных наций в единое целое."
 ARG_core_conquered_state:0 "интегрировать [FROM.GetName]"
 ARG_island_negotiations_decisions_tt:0 "Разблокировать §YПереговоры по острову§! решения, которые позволят нам заключить мирное соглашение с[ENG.GetFlag]§Y[ENG.GetNameDefCap]§!) если мы не участвуем в крупномасштабной войне."
 ARG_island_negotiations_decisions:0 "Переговоры по острову"
 ARG_island_negotiations_decisions_desc:0 "Южноатлантические острова являются спорной территорией, и поэтому дебаты о том, кто должен иметь суверенитет над ними, продолжаются. Эта война может привести нас дальше, чем было бы идеально, и мы должны воспользоваться возможностью для переговоров о мирном соглашении, когда это возможно."
 ARG_peace_out:0 "вести переговоры с [ENG.GetNameDef]"
 ARG_england_demands_peace:0 "вести переговоры с [ARG.GetNameDef]"
 ARG_united_workers_decisions_tt:0 "Разблокировать §YОбъединить рабочих§! решения."
 ARG_unite_the_workers_decisions:0 "Объединить рабочих"
 ARG_unite_the_workers_decisions_desc:0 "Основой коммунистического движения всегда был трудолюбивый и подавленный пролетариат. Теперь, когда [ARG.GetAdjective] Политический ландшафт смещается влево, и только ПСК может спровоцировать забастовки рабочих в некоторых из наших крупных городов, чтобы сплотить людей за нашей славной революцией!"
 ARG_instigate_worker_strike:0 "Провоцировать забастовку рабочих в [FROM.GetName]"
 ARG_uniting_workers_in_progress:0 "В настоящее время разжигает забастовку рабочих"
 ARG_support_the_farmers_decisions_tt:0 "Разблокировать §YПоддержка фермеров§! решения."
 ARG_support_the_farmers_decisions:0 "Поддержка фермеров"
 ARG_support_the_farmers_decisions_desc:0 "По мере того, как мы устанавливаем стандарт равенства для всех в нашем новом коммунистическом государстве, очень важно, чтобы мы не забывали пролетариата, который долго и упорно трудился на полях коммунистического государства. [ARG.GetNameDef]Фермы. Мы должны направить деньги на поддержку фермеров, чтобы у них было столько же шансов на хорошее качество жизни, сколько и у тех, кто живет в городах."
 ARG_implement_rural_reforms:0 "Реализация сельских реформ"
 ARG_implemented_rural_reforms:0 "Реализованные сельские реформы"
 ARG_osmar_hellmuth_event_tt:0 "Получить событие§YВопрос об Осмаре Хеллмуте§!Это позволяет нам выбирать, должны ли мы освободить и использовать его в качестве §YОперативник§! или оставить его в тюрьме."
 GUAY_laissez_faire_cat:0 "Laissez Faire"
 GUAY_laissez_faire_stats:0 "До сих пор землевладельцы строили:\n-§YГражданская фабрика:§! §G[?built_a_civ]§!\n-§YВоенная фабрика:§! §G[?built_a_mil]§!\n§Y- Докярд:§! §G[?built_a_dockyard]§!\n-§Yинфраструктура§!: §G[?built_a_infra]§!\n-§YАвиабаза§!: §G[?built_an_airbase]§!\n-§Yпротивовоздушный§!: §G[?built_an_aa]§!\n-§Yрадар§!: §G[?built_a_radar]§!\n§Y- Поставочный хаб§!: §G[?built_a_hub]§!"
