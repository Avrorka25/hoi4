 hispaniola_category:0 "Объединение Испании"
 hispaniola_category_desc:0 "Несмотря на свою долгую и относительно похожую историю, Западная и Восточная Эспаньола не были объединены с давних времен. Однако настало время для объединения острова."
 unite_hispaniola:0 "Объединить Эспаньолу"
 peru_bolivia_category:0 "Перу-боливийская конфедерация"
 peru_bolivia_category_desc:0 "Хотя Перу-Боливийская конфедерация просуществовала только между 1836 и 1839 годами, она все еще запечатлена в сознании нашего народа. Если бы мы восстановили большую часть старых границ, то не исключено, что мы вновь возродили бы утраченное государство и провозгласили бы себя его новыми руководителями."
 reunite_peru_bolivia:0 "Возрождение Конфедерации"
 guianas_category:0 "Объединяя Гвиану"
 guianas_category_desc:0 "Область Гвианы долгое время была разделена между оккупационными колониальными державами, занимающими субрегионы Кайенны, Гайаны, Амапы, Суринама и Гуаяны. Настало время освободить регион от оккупирующих его сил!"
 unite_guiana:0 "Объединить Гвианы"
 drill_for_oil_in_chaco_boreal:0 "Бурение на нефть в Чако"
 drill_for_oil_in_chaco_boreal_desc:0 "Американская компания Standard Oil обнаружила нефть в регионе в конце 20-х годов, но решила никогда не исследовать ее дальше. Но если бы мы захотели, мы могли бы попытаться предпринять усилия, которых они тогда не предпринимали."
 drill_for_oil_in_chaco_boreal_2:0 "Мы должны бурить глубже."
