 LAT_advisory_adj_navy_attache:0 "консультативный [From.GetAdjective] морской атташе"
 LAT_cease_adj_navy_attache_collaboration:0 "Прекратить сотрудничество с военно-морским атташе"
 LAT_cease_adj_army_attache_collaboration:0 "Прекратить сотрудничество с военным атташе"
 LAT_kegums_power_plant_construction:0 "Строительство Кегумской ГЭС"
 LAT_kegums_power_plant_construction_desc:0 "Кегумская ГЭС — один из важнейших проектов развития со времени обретения нами независимости. После завершения она обеспечит нашу энергетическую самостоятельность и укрепит экономический потенциал."
 LAT_kegums_power_plant_construction_idea:0 "Строительство Кегумской ГЭС"
 LAT_kegums_power_plant_construction_idea_desc:0 "Кегумская ГЭС была важнейшим латвийским проектом конца 1930-х годов. После завершения она обеспечит энергетическую независимость страны и укрепит её экономический потенциал."
 LAT_organize_public_subscription:0 "Организовать общественную подписку"
 LAT_reallocate_investments:0 "Перераспределить инвестиции"
 LAT_admiral_small_ships_training:0 "Подготовка экипажей малых кораблей"
 LAT_admiral_submarine_training:0 "Подготовка подводников"
 LAT_VEF_radio_production:0 "Производство радиотехники ВЭФ"
 LAT_VEF_radio_production_desc:0 "Валстс электротехническа фабрика (ВЭФ), также известная как Государственная электротехническая фабрика, — одно из крупнейших предприятий в [LAT.GetName], история которого восходит к 1919 году. Сейчас оно производит электрические лампы, фотоаппараты, радиоприёмники, телефоны и другие электронные устройства."
 LAT_VEF_electronics_primacy:0 "Приоритет электроники"
 LAT_VEF_electronics_primacy_desc:0 "Мы не можем позволить себе вкладываться во все доступные новые технологии. Если придётся выбирать между фюзеляжами самолётов и системами управления, мы выберем второе, поскольку их можно массово производить на отечественных предприятиях. "
 LAT_fighter_development:0 "Разработка истребителей"
 LAT_fighter_development_desc:0 "Авиация также заслуживает внимания, однако из-за нашего упора на электронику мы можем выделить ей лишь ограниченное финансирование."
 LAT_VEF_airplanes_primacy:0 "Приоритет авиации"
 LAT_VEF_airplanes_primacy_desc:0 "Будущее войны принадлежит самолётам и только самолётам. Электронные компоненты можно разработать позднее или купить за границей, тогда как основные части самолётов будут производиться на местных заводах."
 LAT_VEF_electronics_sideprojects:0 "Побочные проекты в электронике"
 LAT_VEF_electronics_sideprojects_desc:0 "Наши современные самолёты не могут работать на полную мощность с устаревшим электронным оборудованием на борту. Нам следует перенаправить часть средств на развитие и этой отрасли."
 LAT_VEF_industrial_development:0 "Развитие промышленности"
 LAT_VEF_industrial_development_desc:0 "Новые проекты пылятся в ожидании подходящих производственных мощностей. Государственные инвестиции должны создать надёжную основу для нового промышленного комплекса. "
 LAT_modernized_signal_corps:0 "Модернизированные войска связи"
 LAT_modernized_signal_corps_desc:0 "Наше внимание к электронному оборудованию позволяет оснащать войска современными радиостанциями и ротами связи, что заметно повысит эффективность на поле боя и скорость реакции наших военнослужащих."
 LAT_VEF_modern_cameras:0 "Современные фотоаппараты"
 LAT_VEF_modern_cameras_desc:0 "Технологические новшества в электронике могут принести большую пользу разведывательным подразделениям, агентам и шпионам, значительно улучшив сбор и анализ разведданных."
 LAT_VEF_radar_experiments:0 "Эксперименты с радарами"
 LAT_VEF_radar_experiments_desc:0 "Новые радиолокационные системы позволят обнаруживать самолёты ещё до того, как они достигнут нашего воздушного пространства."
 LAT_VEF_technological_breakthrough:0 "Технологический прорыв"
 LAT_VEF_technological_breakthrough_desc:0 "[LAT.GetAdjective] Научный коллектив с гордостью объявил сегодня Правительству [LAT.GetName] Финансирование и инвестиции режима окупились, и технологический прогресс страны может быть значительно ускорен по мере того, как будет проведен новый технологический прорыв в области электроники и авиационных отраслей."
 LAT_VEF_larger_planes:0 "Более крупные самолёты"
 LAT_VEF_larger_planes_desc:0 "У нас появилась уникальная возможность разработать новый прототип тяжёлого самолёта, способного перевозить грузы по стране или обрушивать огненную погибель на головы наших врагов! "
 LAT_VEF_light_bombers:0 "Лёгкие бомбардировщики"
 LAT_VEF_light_bombers_desc:0 "Лёгкие самолёты малой дальности требуют меньше ресурсов и проще в производстве на отечественных предприятиях, поэтому нам следует вложиться в их разработку!"
 LAT_VEF_design_bombing_sights:0 "Разработать бомбовые прицелы"
 LAT_VEF_design_bombing_sights_desc:0 "Военные специалисты предлагают направить часть средств на разработку нового бомбового прицела, который повысит эффективность наших бомбардировщиков. "
 LAT_modernized_air_doctrine:0 "Модернизированная воздушная доктрина"
 LAT_modernized_air_doctrine_desc:0 "Эффективность самолётов в небе можно систематически повышать, если заменить устаревшую тактику времён Великой войны современными доктринами воздушного боя."
 LAT_trained_air_mechanics:0 "Подготовленные авиамеханики"
 LAT_trained_air_mechanics_desc:0 "Талант пилота мало значит, если в полёте отказывает двигатель или протекает топливный бак. Надлежащая подготовка наземного персонала увеличит срок службы самолёта и шансы его пилота на выживание."
 LAT_export_technical_experience:0 "Распространить технический опыт"
 LAT_export_technical_experience_desc:0 "Осознавая значение подготовленных механиков для обслуживания самолётов, мы можем применить разработанные методы и для повышения качества нашей наземной техники."
 LAT_foreign_submarine_contract:0 "Иностранный контракт на подводные лодки"
 LAT_foreign_submarine_contract_desc:0 "Наши внутренние возможности в военно-морской сфере крайне ограничены, однако мы всегда можем пригласить иностранных специалистов, чтобы обучить наших моряков ведению подводных операций и доктрине нарушения вражеских коммуникаций."
 LAT_foreign_destroyer_contract:0 "Иностранный контракт на эсминцы"
 LAT_foreign_destroyer_contract_desc:0 "Ограниченные возможности на море могут привести к полной блокаде морской торговли нашей страны. Обеспечение безопасности конвоев можно обсудить с иностранными военными советниками, а наши офицеры получат необходимую подготовку."
 LAT_riga_shipyard:0 "Рижская верфь"
 LAT_riga_shipyard_desc:0 "Основанная в 1913 году, Рижская верфь ориентирована преимущественно на судоремонт, переоборудование и гражданское судостроение. Расширение ее возможностей для удовлетворения возможных военных потребностей пойдет на пользу [LAT.GetAdjective] Военно-морская промышленность очень."
 LAT_liepaja_naval_base:0 "Построить военно-морскую базу в Лиепае"
 LAT_liepaja_naval_base_desc:0 "Сосредоточение всей нашей промышленности в Риге может казаться выгодным, но станет крайне опасным, если столица падёт или враг войдёт в Рижский залив. Кароста, также известная после провозглашения нашей независимости в 1918 году как Кара осту, то есть Военный порт, — полностью автономное поселение на окраине Лиепаи. Расширение базы укрепит наше присутствие в Балтийском море."
 LAT_rethink_naval_doctrine:0 "Пересмотреть военно-морскую доктрину"
 LAT_rethink_naval_doctrine_desc:0 "Устаревшие технологии остались призраками прошлого, но теперь нас преследует плачевное состояние военно-морской доктрины. Нам следует выделить значительные средства на её модернизацию."
 LAT_submarine_strategy:0 "Подводная стратегия"
 LAT_submarine_strategy_desc:0 "Северная часть Балтийского моря известна своими архипелагами, поэтому крупные корабли там будут менее эффективны или даже бесполезны. Мы сможем получить преимущество, развивая малые манёвренные корабли, способные нарушать линии снабжения противника."
 LAT_modernized_small_ships:0 "Модернизированные малые корабли"
 LAT_modernized_small_ships_desc:0 "Южная часть Балтийского моря широко известна своими мелководьями, из-за чего действия подводных лодок там менее эффективны. И всё же они представляют серьёзную угрозу нашим торговым конвоям и судам, которую можно устранить, сопровождая их современными соединениями эсминцев и лёгких крейсеров."
 LAT_new_flagship:0 "Новый флагман"
 LAT_new_flagship_desc:0 "Чтобы утвердить наше господство в Балтийском море, нам нужен достойный корабль, который станет символом нашей флотилии. Строительство тяжёлого корабля потребует много времени и средств, но статус ведущей морской силы региона того стоит."
 LAT_reinforce_the_navy_air_branch:0 "Укрепить морскую авиацию"
 LAT_reinforce_the_navy_air_branch_desc:0 "Флот и авиацию обычно считают соперниками в борьбе за финансирование, однако их сотрудничество позволит нам создать новое поколение самолётов, способных действовать над морем."
 LAT_revitalize_civilian_economy:0 "Оживить гражданскую экономику"
 LAT_revitalize_civilian_economy_desc:0 "Недавно созданному Кредитному банку Латвии поручено контролировать кредитную деятельность в стране и вкладывать средства в ключевые предприятия для укрепления промышленного сектора."
 LAT_contact_foreign_industrial_partners:0 "Связаться с иностранными промышленными партнёрами"
 LAT_contact_foreign_industrial_partners_desc:0 "Нам следует связаться с иностранными промышленными партнёрами, чтобы обеспечить стабильный приток инвестиций в растущую экономику. Через несколько недель для переговоров прибудет представитель шведской фирмы СЕНТАБ."
 LAT_mobilize_the_banks:0 "Мобилизовать банки"
 LAT_mobilize_the_banks_desc:0 "Полномочия Центрального банка можно расширить до полного надзора за денежно-кредитной политикой страны и её проведения. Мы издадим указ, позволяющий банку управлять зарубежными активами, что значительно упростит ручное управление экономикой."
 LAT_kegums_power_plant:0 "Построить Кегумскую ГЭС"
 LAT_kegums_power_plant_desc:0 "Строительство плотины у Кегумса наконец обеспечит нашу энергетическую независимость. Однако эта задача будет непростой, поскольку работы наверняка растянутся на несколько лет."
 LAT_devaluate_the_lats:0 "Девальвировать лат"
 LAT_devaluate_the_lats_desc:0 "Нынешняя переоценённость нашей валюты вредит экспорту. Чтобы обрабатывающая промышленность могла процветать, необходима денежная реформа."
 LAT_save_ford_vairogs:0 "Спасти «Форд-Вайрогс»"
 LAT_save_ford_vairogs_desc:0 "Автомобильный завод «Форд-Вайрогс» в Риге был основан в 1895 году как вагоностроительное и механическое предприятие в городской черте. Недавняя нехватка заказов и большой объём неиспользуемых мощностей привели его в упадок. Мы можем заключить соглашение с «Форд Мотор Компани» и получить лицензию на местное производство нескольких моделей автомобилей. В случае успеха переговоров нам, возможно, также придётся увеличить финансирование и расширить завод."
 LAT_military_motorization_program:0 "Программа моторизации армии"
 LAT_military_motorization_program_desc:0 "Бронеавтомобили и моторизованный транспорт особенно востребованы вооружёнными силами страны. Тесное сотрудничество между военными и научными учреждениями может привести к созданию совершенно нового поколения моторизованной техники."
 LAT_G_erenpreis_bicycle_factory:0 "Велосипедная фабрика Г. Эренпрейса"
 LAT_G_erenpreis_bicycle_factory_desc:0 "В 1927 году была основана новая компания под названием «Велосипедная фабрика Г. Эренпрейса», призванная выпускать велосипеды и запчасти к ним для удовлетворения растущего спроса населения. Основатель компании Густав Эренпрейс ещё в 1931 году начал строительство фабрики. При дополнительной государственной поддержке этот проект наконец можно завершить."
 LAT_bicycle_infantry:0 "Велосипедная пехота"
 LAT_bicycle_infantry_desc:0 "Нехватка каучука отечественного производства мешает нашей армии полностью моторизоваться при помощи бронетехники. Недавнее совершенствование разведывательных батальонов позволило оснастить наши войска велосипедами, повысив их мобильность и разведывательные возможности."
 LAT_national_tank_program:0 "Национальная танковая программа"
 LAT_national_tank_program_desc:0 "В прошлом возможности бронетехники были серьёзно недооценены. Теперь, когда мы видим истинный потенциал бронетанковой войны, нам следует вложить огромные средства в разработку новых прототипов танков!"
 LAT_increase_research_budget:0 "Увеличить исследовательский бюджет"
 LAT_increase_research_budget_desc:0 "Растущие требования военных и промышленных ведомств оказывают серьёзное давление на наши научные коллективы. Дополнительное финансирование, направленное на расширение институтов и исследовательских центров, должно облегчить работу наших разработчиков и изобретателей."
 LAT_rely_on_foreign_attaches:0 "Положиться на иностранных атташе"
 LAT_rely_on_foreign_attaches_desc:0 "Будучи небольшой изолированной страной, мы всегда с трудом поспевали за военными новшествами. Поэтому нам придётся опираться на иностранных военных атташе, работающих в нашей стране, чтобы получить доступ хотя бы к части последних разработок ведущих военных держав."
 LAT_new_generation_of_generals:0 "Новое поколение генералов"
 LAT_new_generation_of_generals_desc:0 "Чтобы наше верховное командование оставалось эффективным и отвечало требованиям современной войны, необходимо активно продвигать по службе новых способных военных, поощряя тем самым новаторство."
 LAT_study_foreign_firearm_prototypes:0 "Изучить иностранные образцы стрелкового оружия"
 LAT_study_foreign_firearm_prototypes_desc:0 "После многочисленных обсуждений с иностранными военными экспертами стало очевидно, что наша армия остро нуждается в современном пехотном вооружении. Наши специалисты уже получили несколько прототипов, и теперь предстоит выяснить, можно ли наладить их производство на наших заводах. "
 LAT_general_modernization_plan:0 "Общий план модернизации"
 LAT_general_modernization_plan_desc:0 "Недостаток опыта и полевой подготовки можно компенсировать, если вся военная система нашей страны пройдёт дорогостоящий и длительный процесс всеобъемлющей модернизации."
 LAT_draw_new_mobilization_plans:0 "Разработать новые мобилизационные планы"
 LAT_draw_new_mobilization_plans_desc:0 "Расширенный генеральный штаб занимается определением возможных источников агрессии против нашей страны. Учитывая территориальные амбиции и расширение сфер влияния наших соседей, мы ясно видим двух главных нарушителей спокойствия в регионе: [GER.GetName] и [SOV.GetName]. Следует подготовиться соответствующим образом!"
 LAT_fortify_the_border:0 "Укрепить границу"
 LAT_fortify_the_border_desc:0 "Без надлежащей противовоздушной обороны и системы укреплений наши солдаты не смогут выдержать удар превосходящего противника. Необходимо также обеспечить инженерные полки современным снаряжением."
 LAT_special_forces:0 "Войска специального назначения"
 LAT_special_forces_desc:0 "Более половины территории нашей страны покрыто лесами, поэтому нам следует создать специализированные подразделения, способные вести боевые действия в столь суровой местности."
 LAT_sellier_and_bellot_ammunitions:0 "Боеприпасы «Селье и Белло»"
 LAT_sellier_and_bellot_ammunitions_desc:0 "Расширение единственного в стране завода боеприпасов позволит нам избежать зависимости от импорта патронов в случае войны."
 LAT_modern_infantry:0 "Современная пехота"
 LAT_modern_infantry_desc:0 "Пехотные полки всегда будут играть решающую роль в защите независимости страны. Надёжное и качественное оснащение повысит их наступательные и оборонительные возможности, а также укрепит общий боевой дух. "
 LAT_artillery_modernization:0 "Модернизация артиллерии"
 LAT_artillery_modernization_desc:0 "Возвращение оккупированных или отторгнутых территорий невозможно без наступления на укрепившегося противника. Людские ресурсы слишком ценны, поэтому следует сосредоточиться на прорыве обороны с помощью артиллерии, модернизация которой уже ведётся."
 LAT_anti_tank_artillery:0 "Противотанковая артиллерия"
 LAT_anti_tank_artillery_desc:0 "Противник может попытаться прорвать нашу оборону танками, но мы разработаем достойный ответ этой угрозе — противотанковое орудие. Наклонная броня мало поможет врагу, если наше орудие окажется достаточно близко!"
 LAT_anti_air_artillery:0 "Зенитная артиллерия"
 LAT_anti_air_artillery_desc:0 "Высшие воздушные силы противника будут разбиты и рассредоточены среди них. [LAT.GetAdjective] Наземь, как только она встретит снаряды наших новейших зенитных орудий!"
 LAT_incorporate_paramilitary_units:0 "Включить военизированные формирования"
 LAT_incorporate_paramilitary_units_desc:0 "Включить военизированные формирования"
 LAT_mobilization_of_the_workforce:0 "Мобилизация рабочей силы"
 LAT_mobilization_of_the_workforce_desc:0 "Мобилизация рабочей силы"
 LAT_enforce_the_succession_law:0 "Принять закон о престолонаследии"
 LAT_enforce_the_succession_law_desc:0 "Чтобы занять пост президента после окончания срока полномочий Албертса Квиесиса, необходимо изменить закон. Это приведёт к дальнейшему сосредоточению власти в руках Улманиса. После этого его диктатура станет по-настоящему абсолютной."
 LAT_ulmanis_in_control_of_the_government:0 "Вождь народа"
 LAT_ulmanis_in_control_of_the_government_desc:0 "Карлис Улманис теперь занимает пост президента, устранив тем самым всякую возможную оппозицию внутри правительства. Отныне для Латвии начинается новая эпоха — эпоха безраздельной власти Улманиса."
 LAT_nationalize_important_industries:0 "Национализировать важнейшие отрасли"
 LAT_nationalize_important_industries_desc:0 "Государственные предприятия помогут нам построить стабильную и процветающую экономику, не распродавая её частным покровителям."
 LAT_micromanage_the_economy:0 "Лично управлять экономикой"
 LAT_micromanage_the_economy_desc:0 "Наша экономика, особенно сельскохозяйственный сектор, пока не находится под полным контролем. Однако президент Улманис обладает большим опытом в экономике. Его личное руководство может потребовать некоторых жертв, но в будущем они обязательно окупятся."
 LAT_corporate_statism:0 "Организация и корпоративный этатизм"
 LAT_corporate_statism_desc:0 "Рабочее движение с каждым днём набирает силу по всей стране. Чтобы противостоять растущим требованиям рабочих и предотвратить любое коммунистическое восстание, следует выстроить систему корпоративного этатизма по примеру фашистской Италии или Германии. "
 LAT_house_of_proffesions:0 "Палата профессий"
 LAT_house_of_proffesions_desc:0 "Промышленный рост и экономическая независимость [LAT.GetName] могут быть достигнуты лишь благодаря организации и поддержке Палаты профессий. Недавно созданная палата призвана представлять интересы различных профессиональных групп и соответствующих учреждений по всей стране."
 LAT_assimilate_minorities:0 "Ассимилировать меньшинства"
 LAT_assimilate_minorities_desc:0 "Процент этнических латышей оценивался в переписи населения 1935 года на 75 %. Россияне, эстонцы, латыши и другие меньшинства войдут в состав ЕС [LAT.GetAdjective] общества посредством политики ассимиляции, в которой [LAT.GetAdjective] Язык будет преподаваться в школах и университетах."
 LAT_equal_latvia:0 "Культурная столица Балтии"
 LAT_equal_latvia_desc:0 "Будучи самым густонаселенным и старейшим городом Балтийского региона, Рига широко известна как «культурная столица Прибалтики», что в значительной степени поощряет патриотические чувства жителей города. [LAT.GetAdjective] людей."
 LAT_top_of_the_line_agrarianism:0 "Первоклассная сельскохозяйственная продукция"
 LAT_top_of_the_line_agrarianism_desc:0 "Экономика нашей страны сильно зависит от экспорта сельскохозяйственной продукции. The [LAT.GetAdjective] Сельскохозяйственные продукты, такие как зерно, зерновые и виноградная лоза, как известно, имеют один из самых высоких рейтингов на европейском рынке."
 LAT_neutral_foreign_policy:0 "Нейтральная внешняя политика"
 LAT_a_rejection_of_ulmanis:0 "Отвергнуть Улманиса"
 LAT_a_rejection_of_ulmanis_desc:0 "Срок полномочий Албертса Квиесиса подходит к концу, тогда как Карлис Улманис железной хваткой контролирует правительство. Чтобы обеспечить смену власти в [LAT.GetName], нам придётся открыто противостоять политическим притязаниям Улманиса и резко ограничить его влияние. Нужно действовать быстро, пока закон о престолонаследии не изменён!"
 LAT_assemble_a_new_seima:0 "Созвать новый Сейм"
 LAT_assemble_a_new_seima_desc:0 "Чтобы не допустить скатывания страны к очередному тираническому и репрессивному режиму, необходимо ещё сильнее сплотить власть вокруг нынешней демократической коалиции. Пятый парламент — Сейм, состоящий из ста депутатов, — должен получить полномочия направить правительство по новому демократическому курсу."
 LAT_liberal_economic_reforms:0 "Перенять западную экономическую политику"
 LAT_liberal_economic_reforms_desc:0 "Многие иностранные инвесторы, наблюдающие за стремительной сменой нашего правительства и его быстрой либерализацией, выражают готовность вкладывать средства в развивающуюся страну. Мы покажем им добрую волю, проведя ряд либеральных экономических реформ с учётом балтийской специфики."
 LAT_redraft_the_constitution:0 "Пересмотреть Сатверсме"
 LAT_redraft_the_constitution_desc:0 "«Латвияс Републикас Сатверсме», или Конституция Латвийской Республики, была первоначально принята в 1922 году и состояла из 115 статей и 8 глав. Её первая статья гласила: «Латвия является независимой демократической республикой». В 1934 году Сатверсме была приостановлена Улманисом во время его прихода к власти. Пятый Сейм должен полностью восстановить действие Конституции и неукоснительно соблюдать её первую статью!"
 LAT_state_intervention:0 "Государственное вмешательство"
 LAT_state_intervention_desc:0 "Нынешняя политика предусматривает надзор за промышленным и экономическим развитием страны."
 LAT_a_western_ally:0 "Союзник на Западе"
 LAT_a_western_ally_desc:0 "Наш недавно созданный демократический режим может стать жертвой агрессии со стороны наших соседей или политической нестабильности, поддерживаемой из-за рубежа, если мы останемся одни. Мы будем просить Англию или Францию о союзе, чтобы сохранить нашу независимость."
 LAT_baltic_cooperation:0 "Балтийское сотрудничество"
 LAT_baltic_cooperation_desc:0 "Подписанное в 1934 году соглашение о Балтийской антанте было призвано сохранять мир и координировать внешнюю политику в стратегически важном Балтийском регионе. Учитывая рост напряжённости на Западе и Востоке, необходимо преобразовать этот договор в полноценный военно-политический союз. [LIT.GetName] станет первой страной, приглашённой подписать обновлённое соглашение."
 LAT_discredit_totalitarianism:0 "Дискредитировать тоталитаризм"
 LAT_discredit_totalitarianism_desc:0 "Как первая крупная демократическая сила региона, мы осудим любые формы угнетения народа тоталитарными режимами. Пусть знают, что мы готовы защищать свои ценности и безопасность людей!"
 LAT_democratic_gem_of_eastern_europe:0 "Скрытая жемчужина Восточной Европы"
 LAT_democratic_gem_of_eastern_europe_desc:0 "Наша приверженность демократическим институтам и либеральной политике, а также одно из первых республиканских правительств в Восточной Европе побудили людей назвать [LAT.GetName] «Скрытой жемчужиной Восточной Европы»!"
 LAT_coalition_with_the_communists:0 "Коалиция с коммунистами"
 LAT_coalition_with_the_communists_desc:0 "В это кризисное время лишь народный фронт, объединяющий коммунистов и демократические партии, позволит создать авторитетную политическую силу."
 LAT_proclaim_the_peoples_republic:0 "Провозгласить Латвийскую Народную Республику"
 LAT_proclaim_the_peoples_republic_desc:0 "Между коммунистическими и демократическими партиями достигнуто общее согласие: многочисленные студенческие демонстрации и забастовки рабочих вынудят правительство провести досрочные выборы, после которых Латвия изменится навсегда. Демократы ещё не знают, что получат лишь меньшинство голосов..."
 LAT_rally_the_workers:0 "Сплотить рабочих"
 LAT_rally_the_workers_desc:0 "Коммунистический аппарат требует равных возможностей для всего народа. Рабочих ознакомят со средствами идеологической и вооружённой борьбы, чтобы они лучше соответствовали новому латвийскому строю."
 LAT_liberate_estonia:0 "Освободить Эстонию"
 LAT_liberate_estonia_desc:0 "Студенческие протесты по всей [EST.GetName], несомненно, призывают к рабочей революции. Буржуазное правительство заставит их замолчать, если мы не вмешаемся. К оружию, братья и сёстры!"
 LAT_liberate_lithuania:0 "Освободить Литву"
 LAT_liberate_lithuania_desc:0 "Руководство [LIT.GetName] Слишком долго угнетали и унижали рабочих. Мы должны освободить [LIT.GetAdjective] Они ведут людей к процветающему социалистическому будущему."
 LAT_form_the_baltic_union:0 "Объединение Балтии"
 LAT_form_the_baltic_union_desc:0 "Идея объединения прибалтийских стран неоднозначна, но многообещающа. Когда балтийские территории разделяют коммунистические ценности и находятся под нашим непосредственным руководством, мы можем провести культурную, экономическую и научную интеграцию всех этих земель в Балтийскую Советскую Социалистическую Республику!"
 LAT_spread_the_revolution:0 "Революция за пределами Балтии"
 LAT_spread_the_revolution_desc:0 "Балтийский народ принял Революцию во всей ее красе и силе. Пришло время освободить наших соседей и навязать им наши коммунистические идеи!"
 LAT_join_comintern:0 "Вступить в Коминтерн"
 LAT_join_comintern_desc:0 "Разделяя ценности и идеи нашего восточного соседа, мы уже установили прочные экономические и научные связи с [SOV.GetName]. Наши дипломаты уже работают над созданием официального союза между нашими странами!"
 LAT_centralize_farming_production:0 "Централизовать сельскохозяйственное производство"
 LAT_centralize_farming_production_desc:0 "Обширные сельскохозяйственные земли страны были разделены на 26 административных районов, прежде зависевших от устаревшей инфраструктуры. Новый указ ЛКП предусматривает проведение коллективизации с целью централизации сельскохозяйственной основы нашей экономики."
 LAT_eliminate_capitalism:0 "Искоренить капитализм"
 LAT_eliminate_capitalism_desc:0 "Многие промышленные активы сельских собственников — «кулаков» — можно национализировать, а их земли эффективнее перераспределить среди населения. Это повысит возможности индустриализации страны ценой некоторого сокращения населения и нескольких экономических трудностей для нашей хрупкой промышленной системы. "
 LAT_radical_opposition:0 "Радикальная оппозиция"
 LAT_radical_opposition_desc:0 "Движение «Громовой крест» с самого начала выступало против диктатуры Улманиса. В нынешний кризисный момент оно остаётся единственной влиятельной оппозиционной силой."
 LAT_proclaim_the_new_state:0 "Провозгласить новую Латвию"
 LAT_proclaim_the_new_state_desc:0 "В 1933 году Густавс Целминьш основал нашу партию «Перконкрустс», также известную как «Громовой крест». Лишь теперь мы стали достаточно могущественны, чтобы свергнуть незаконную диктатуру Улманиса и его министров-марионеток. Пришло время освободить Густавса Целминьша из тюрьмы и провозгласить его законным правителем новой Латвии! "
 LAT_hail_the_struggle:0 "Да здравствует борьба"
 LAT_hail_the_struggle_desc:0 "Мы никогда не должны забывать прежние гонения на наше движение, роспуск партии в 1933 году и заключение нашего лидера Густавса Целминьша в тюрьму в 1934 году. Борьба не закончится, пока враги с жадностью взирают на земли нашей славной страны!"
 LAT_privatize_the_industry:0 "Поддержать оружейные заводы"
 LAT_privatize_the_industry_desc:0 "Нашим военизированным группам необходимо надлежащее вооружение, чтобы укрепить позиции правительства по всей стране. Несколько оружейных предприятий оказали нынешнему режиму значительную поддержку и будут вознаграждены налоговыми льготами и расширением финансирования. "
 LAT_join_axis:0 "Заключить союз с Германией"
 LAT_latvian_militarism:0 "Латвийский милитаризм"
 LAT_latvian_militarism_desc:0 "Наш молодой и хрупкий режим требует надлежащей постоянной армии, если мы хотим пережить любую агрессию наших соседей. Введение всеобщей воинской повинности будет иметь жизненно важное значение для этого."
 LAT_irridentist_youth:0 "Создать кадетский корпус"
 LAT_irridentist_youth_desc:0 "Государственная идеология оказывает сильное влияние и на умы молодого поколения. Поскольку многие молодые люди добровольно вступают в армию, мы можем создать кадетский корпус для лучшего обучения и подготовки офицеров и солдат. Ожидается, что корпус также сформирует небольшие добровольческие силы, готовые отстаивать наши ценности и принципы по всему миру."
 LAT_latvian_chauvinism:0 "Латвийский шовинизм"
 LAT_latvian_chauvinism_desc:0 "Независимо от того, как далеко зашла история нашей страны, [LAT.GetAdjective] Люди всегда казались лучше, сильнее и смелее. Мы должны поощрять подобные мысли, поскольку у нас достаточно научных исследований по этому вопросу."
 LAT_baltics_under_one_flag:0 "Объединить Балтию под Громовым крестом"
 LAT_baltics_under_one_flag_desc:0 "Возникшие в буре русской революции 1917–1921 годов как три независимые страны, [LAT.GetName], [LIT.GetName] и [EST.GetName] обладают огромным общим культурным и историческим наследием. С нашим новым пониманием Балтийской антанты мы объединим все эти страны под единым руководством."
 LAT_mythological_diplomacy:0 "Мифологическая дипломатия"
 LAT_mythological_diplomacy_desc:0 "Филология доказывает, что Перкунас — не просто наш верховный бог, но наследник традиции, восходящей к заре человечества. Во многих других странах существовали варианты этого героя, отличавшиеся властью над громом или владением разящим оружием. Пришло время Перкунасу, Индре, Гераклу и Тору вновь объединиться и сокрушить всех наших врагов святой силой."
 LAT_event.1.t:0 "Сердечный ужин офицеров"
 LAT_event.1.desc:0 "Во время трапезы в офицерском собрании атташе оказался расположен к беседе о последних новшествах в области вооружений."
 LAT_event.1.a:0 "Спросить его о стрелковом оружии."
 LAT_event.1.b:0 "Расспросить об орудиях и снарядах."
 LAT_event.1.c:0 "Расспросить о методах подготовки."
 LAT_event.2.t:0 "Вопросы о доктринах"
 LAT_event.2.desc:0 "Чем я могу вам помочь?"
 LAT_event.2.a:0 "Вот как мы организуем нашу армию."
 LAT_event.2.b:0 "Вот как мы организуем наш флот."
 LAT_event.2.c:0 "Вот как мы организуем нашу авиацию."
 LAT_event.3.t:0 "Кегумская электростанция завершена!"
 LAT_event.3.desc:0 "После многих лет работы и вложений плотина наконец введена в эксплуатацию. Это грандиозное достижение и доказательство латвийской изобретательности"
 LAT_event.3.a:0 "Ура!"
 LAT_event.4.t:0 "Срок полномочий Албертса Квиесиса подходит к концу"
 LAT_event.4.desc:0 "В соответствии с конституцией президентский срок Квиесиса подходит к концу. Хотя конституция предусматривает, что его преемником должен стать председатель парламента, министр-президент Улманис разработал закон, позволяющий ему совместить нынешнюю должность с президентским постом. Благодаря этому он сможет сосредоточить в своих руках ещё больше власти и укрепить диктатуру."
 LAT_event.4.a:0 "Игра была нечестной с самого начала..."
 LAT_event.4.b:0 "Немедленно признать это решение недействительным!"
 LAT_event.5.t:0 "Отстранение Улманиса"
 LAT_event.5.desc:0 "Карлис Улманис фактически является диктатором страны с момента переворота 1934 года, и вот уже два года никто не осмеливается бросить вызов его власти. Однако президент, прежде безоговорочно утверждавший все его законы, решил признать недействительным закон Улманиса о наследовании власти, не позволив тому занять президентский пост. Согласно конституции следующим президентом должен стать бывший председатель латвийского Сейма Паулс Калниньш. Но сейчас он находится в тюрьме Улманиса, а растущее политическое противостояние между Улманисом и оппозицией, поддерживающей Квиесиса, может привести к краху политической системы, поскольку никто не будет осуществлять власть на законных основаниях."
 LAT_event.5.a:0 "Освободить Паулса Калниньша на законных основаниях."
 LAT_event.5.b:0 "Улманис прибегнет к любой уловке, чтобы получить ещё больше власти."
 LAT_event.6.t:0 "Новый Сейм"
 LAT_event.6.desc:0 "Теперь, когда Улманис отстранён от должности, мы наконец можем приступить к восстановлению дееспособной демократической системы. Прежде всего необходимо созвать новый Сейм и избрать следующего президента."
 LAT_event.6.a:0 "Утвердить Паулса Калниньша — согласно конституции он является законным президентом."
 LAT_event.6.b:0 "Вместо него избрать Маргерса Скуениекса."
 LAT_event.7.t:0 "Что теперь?"
 LAT_event.7.desc:0 "Сопротивление Улманиса и его приспешников восстановлению демократии оказалось сильнее, чем ожидалось. Президенту Квиесису не удалось законным путём отстранить его от должности, и между остатками государственных институтов возник раскол."
 LAT_event.7.a:0 "Обратиться за поддержкой к коммунистам — они наша последняя надежда."
 LAT_event.7.b:0 "Перконкрустс спасёт страну — он годами противостоял Улманису."
 LAT_event.8.t:0 "Провозгласить Народную Республику"
 LAT_event.8.desc:0 "Вопреки всем шансам мы восстали из пепла прежних авторитарных режимов! Теперь у нас достаточно поддержки, чтобы провозгласить создание страны, которая станет орудием латвийского народа в борьбе за освобождение трудящихся всего мира. Однако вопрос о руководстве всё ещё не решён, поскольку министерские и президентские должности пока не распределены."
 LAT_event.8.a:0 "Фрицис Мендерс займёт президентский пост."
 LAT_event.8.b:0 "Вместо него главой страны станет Лацис Виллис."
 latvia_tree:0 "Дерево фокусов Латвии"
