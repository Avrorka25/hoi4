 LAT_mobilization_plans:0 "Планы мобилизации Латвии"
 LAT_mobilization_plans_desc:0 "Различные планы мобилизации, разработанные нашим генеральным штабом, позволят нам эффективно ответить на иностранную агрессию. Подготовлено три основных плана.\n\n§YПлан А§! предусматривает нападение СССР с востока и, возможно, с севера.\n\n§YПлан Д§! предусматривает германское наступление с юга.\n\n§YПлан К§!, считавшийся крайне маловероятным, предполагает одновременный удар Германии и Советского Союза."
