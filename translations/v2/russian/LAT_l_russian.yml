 LAT_contact_attaches:0 "Связаться с иностранными атташе"
 LAT_contact_attaches_desc:0 "Военных атташе привлекает близость страны к [SOV.GetName], поэтому их здесь немало, и они служат важнейшим источником сведений о военных нововведениях."
