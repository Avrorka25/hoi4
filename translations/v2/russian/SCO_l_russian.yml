 SCO_generic_infantry_equipment_organization:0 "Эдингемский завод боеприпасов"
 SCO_generic_artillery_organization:0 "ROF Далмьюр"
 SCO_generic_motorized_mechanized_organization:0 "Альбион Моторс"
 SCO_king_douglas:0 "Дуглас I"
 SCO_king_henry:0 "Генрих I"
 SCO_king_rupprecht:0 "Рупрехт I"
 SCO_parliamentarianism:0 "Парламентаризм"
 SCO_womens_army_service:0 "Женская армейская служба"
 SCO_absence_of_the_stone_of_scone:0 "Отсутствие Скунского камня"
 SCO_absence_of_the_stone_of_scone_desc:0 "Камень Судьбы, или Скунский камень, названный по месту своего происхождения, служил коронационным камнем шотландских королей до тех пор, пока Эдуард I Английский не забрал его и не соорудил трон, чтобы держать камень под своей волосатой задницей. Поэтому его отсутствие снижает легитимность наших монархов и может намекать, что мы вновь должны оказаться под английским ярмом, что совершенно нелепо."
 SCO_cunning_plans:0 "Хитроумные планы"
 SCO_establish_the_army:0 "Создать армию"
 SCO_establish_the_army_desc:0 "С нашим новым политическим статусом пришло время организовать собственные части на основе бывших британских полков."
 SCO_industrial_modernization:0 "Промышленная модернизация"
 SCO_industrial_modernization_desc:0 "[ROOT.GetNonIdeologyName] должна сохранять статус современной промышленной страны, чтобы укрепить своё положение в мире."
 SCO_dingham_ammunition_factory:0 "Дингемский завод боеприпасов"
 SCO_dingham_ammunition_factory_desc:0 "Чтобы снабжать наши войска, в Дингеме необходимо построить завод боеприпасов."
 SCO_redesign_small_arms:0 "Переработать стрелковое оружие"
 SCO_redesign_small_arms_desc:0 "Чтобы обеспечить эффективность нашей пехоты, стрелковое оружие необходимо постоянно совершенствовать."
 SCO_motorization_plan:0 "План моторизации"
 SCO_motorization_plan_desc:0 "Быстрое развитие прорыва способно обрушить фронт. Именно этого не хватало во время Великой войны."
 SCO_convert_north_british_locomotive_factory:0 "Завод Норт Бритиш Локомотив"
 SCO_convert_north_british_locomotive_factory_desc:0 "Этот локомотивный завод можно переоборудовать для производства бронетехники."
 SCO_dalmuir_shells:0 "Снаряды из Далмьюра"
 SCO_dalmuir_shells_desc:0 "Наша артиллерия будет снабжаться снарядами, произведёнными в Далмьюре."
 SCO_artillery_modernization:0 "Модернизация артиллерии"
 SCO_artillery_modernization_desc:0 "Артиллерия убивает, пехота занимает."
 SCO_new_tactics:0 "Новая тактика"
 SCO_new_tactics_desc:0 "Хотя лобовые атаки хайлендеров хорошо работали в прошлом, Великая война показала их несостоятельность. В наши дни лишь безумец пойдёт в бой с клеймором и луком."
 SCO_planning_staff:0 "Штаб планирования"
 SCO_planning_staff_desc:0 "Подготовленный план, скорее всего, лучше неподготовленного."
 SCO_expand_the_construction_sector:0 "Расширить строительный сектор"
 SCO_expand_the_construction_sector_desc:0 "Чтобы построить лучшую страну, необходимы мощные строительные возможности."
 SCO_northern_mining:0 "Северная добыча"
 SCO_northern_mining_desc:0 "Недра Хайленда скрывают огромные богатства, которые необходимо использовать в эти трудные времена."
 SCO_support_steel_sector:0 "Поддержать сталелитейный сектор"
 SCO_support_steel_sector_desc:0 "Сталь! Сталь для пушек, танков, кораблей, для всякого оружия войны!"
 SCO_support_light_industry:0 "Поддержать лёгкую промышленность"
 SCO_support_light_industry_desc:0 "Лёгкая промышленность необходима для здорового баланса нашей экономики."
 SCO_ferranti_instruments:0 "Приборы Ферранти"
 SCO_ferranti_instruments_desc:0 "Этот производитель электронной аппаратуры может стать крайне важным, если предоставить ему исследовательские гранты."
 SCO_connect_extraction_and_production_areas:0 "Соединить районы добычи и производства"
 SCO_connect_extraction_and_production_areas_desc:0 "Шахты в глубине Хайленда почти бесполезны без хорошей инфраструктурной сети."
 SCO_industrial_research:0 "Промышленные исследования"
 SCO_industrial_research_desc:0 "Наша промышленность должна совершенствоваться."
 SCO_develop_aluminium_industry:0 "Перерабатывать алюминиевую руду"
 SCO_develop_aluminium_industry_desc:0 "Необработанная алюминиевая руда бесполезна для военных нужд."
 SCO_develop_the_shale_oil_sector:0 "Развивать сектор сланцевой нефти"
 SCO_develop_the_shale_oil_sector_desc:0 "Шотландская сланцевая нефть, хотя её и трудно добывать, необходима для обеспечения нашей самообеспеченности."
 SCO_substitution_technologies:0 "Технологии замещения"
 SCO_substitution_technologies_desc:0 "Поскольку война может поставить импорт под угрозу, следует рассмотреть технологии замещения, такие как сжижение угля."
 SCO_establish_special_forces:0 "Создать силы специального назначения"
 SCO_establish_special_forces_desc:0 "Самых храбрых — или самых безумных — из нас следует лично отобрать в элитные подразделения, способные при необходимости бесшумно убивать врага даже из луков."
 SCO_highlander_spirit:0 "Дух хайлендеров"
 SCO_highlander_spirit_desc:0 "Хотя хайлендеры технологически устарели, они всё ещё могут служить примером мужества в бою."
 SCO_modern_logistics:0 "Современная логистика"
 SCO_modern_logistics_desc:0 "Без снабжения армия не может сражаться. Поэтому современная логистика жизненно важна для современной армии."
 SCO_signal_companies:0 "Роты связи"
 SCO_signal_companies_desc:0 "Связь, связь и ещё раз связь."
 SCO_field_hospitals:0 "Полевые госпитали"
 SCO_field_hospitals_desc:0 "Выздоровевший солдат ещё может быть полезен обществу. Мёртвый — нет."
 SCO_mechanization_effort:0 "Механизация"
 SCO_mechanization_effort_desc:0 "Компромисс между танком и грузовиком позволит быстро и эффективно доставлять наши войска в бой."
 SCO_scottish_aviation_air_academy:0 "Авиационная академия Скоттиш Авиэйшн"
 SCO_scottish_aviation_air_academy_desc:0 "Скоттиш Авиэйшн должна стать отправной точкой инфраструктуры наших ВВС."
 SCO_build_trainer_aircrafts:0 "Строить учебные самолёты"
 SCO_build_trainer_aircrafts_desc:0 "Прежде чем проектировать полноценный истребитель, разумнее начать с прототипа учебного самолёта."
 SCO_bimotor_aircrafts:0 "Двухмоторные самолёты"
 SCO_bimotor_aircrafts_desc:0 "Крупные самолёты — будущее. Разве не говорили, что бомбардировщик всегда прорвётся?"
 SCO_train_pilots:0 "Обучать пилотов"
 SCO_train_pilots_desc:0 "Без пилотов как можно рассчитывать на боеспособные ВВС?"
 SCO_train_mechanics:0 "Обучать механиков"
 SCO_train_mechanics_desc:0 "Без механиков как можно рассчитывать на боеспособные ВВС?"
 SCO_support_designers_innovations:0 "Поддержать новаторство конструкторов"
 SCO_support_designers_innovations_desc:0 "Экспериментальные прототипы порой приводят к выдающимся улучшениям."
 SCO_naval_aviation:0 "Морская авиация"
 SCO_naval_aviation_desc:0 "В эпоху авианосцев самолёты, приспособленные к войне на море, становятся необходимостью."
 SCO_refine_air_doctrine:0 "Совершенствовать воздушную доктрину"
 SCO_refine_air_doctrine_desc:0 "Опыт даёт нам лучшее понимание воздушной войны."
 SCO_radar_network:0 "Радиолокационная сеть"
 SCO_radar_network_desc:0 "Раннее обнаружение противника позволяет гораздо эффективнее бороться с угрозами."
 SCO_the_shipyard_of_the_world:0 "Верфь мира"
 SCO_the_shipyard_of_the_world_desc:0 "Благодаря своим огромным верфям, способным строить торговые и военные корабли для всего мира, Шотландия поистине является верфью мира."
 SCO_shipbuilding_contacts:0 "Связи с судостроителями"
 SCO_shipbuilding_contacts_desc:0 "Поддержка верфей необходима, если мы хотим направить их работу на военные нужды."
 SCO_national_admiralty:0 "Национальное адмиралтейство"
 SCO_national_admiralty_desc:0 "Нашему флоту нужен аналог армейского штаба."
 SCO_the_fleet_of_old:0 "Флот старой школы"
 SCO_the_fleet_of_old_desc:0 "Линкоры станут ядром нашего флота."
 SCO_battleship_focus:0 "Ставка на линкоры"
 SCO_battleship_focus_desc:0 "Большие орудия для больших кораблей. Четыре трёхорудийные башни: две в носу и две в корме."
 SCO_the_biggest_battleship:0 "Самый большой линкор"
 SCO_the_biggest_battleship_desc:0 "Зачем подражать линкорам других держав, если мы можем построить ещё больше?"
 SCO_the_blocade_doctrine:0 "Доктрина блокады"
 SCO_the_blocade_doctrine_desc:0 "Если мы потопим достаточно вражеских конвоев, то сможем парализовать их экономику."
 SCO_silent_service:0 "Тихая служба"
 SCO_silent_service_desc:0 "Для успеха разработанного плана необходимы современные подводные лодки."
 SCO_stealth_upgrades:0 "Улучшение скрытности"
 SCO_stealth_upgrades_desc:0 "Более скрытные подлодки смогут эффективнее сближаться с беззащитными вражескими конвоями."
 SCO_carrier_strikes:0 "Удары авианосцев"
 SCO_naval_air_groups:0 "Группы морской авиации"
 SCO_lessons_for_the_air_force:0 "Уроки для ВВС"
 SCO_cruiser_focus:0 "Современные крейсеры"
 SCO_destroyer_focus:0 "Современные эсминцы"
 SCO_increase_naval_production:0 "Увеличить военно-морское производство"
 SCO_a_s_warfare:0 "Противолодочная борьба"
 SCO_naval_mine_warfare:0 "Минная война на море"
 SCO_provisional_government:0 "Временное правительство"
 SCO_provisional_government_desc:0 "Временное правительство"
 SCO_favour_republicanism:0 "Благоприятный республиканизм"
 SCO_favour_republicanism_desc:0 "Благоприятный республиканизм"
 SCO_scottish_democratic_fascist_party:0 "Шотландская демократическая фашистская партия"
 SCO_scottish_democratic_fascist_party_desc:0 "Шотландская демократическая фашистская партия утверждает, что является истинным представителем народной воли и потому единственным способом обеспечить народный суверенитет, поскольку она не разделяет общество на классы."
 SCO_perfect_the_propaganda:0 "Усовершенствовать пропаганду"
 SCO_perfect_the_propaganda_desc:0 "Прежняя принадлежность лидера партии к нескольким политическим движениям может заставить общественность считать его простым оппортунистом. Однако проект партии совсем не таков, и хорошо спланированная медийная кампания успокоит народ."
 SCO_scottish_corporate_commonwealth:0 "Шотландское корпоративное содружество"
 SCO_scottish_corporate_commonwealth_desc:0 "Благодаря фашистскому отрицанию как капитализма, так и классовой борьбы мы можем организовать работников по профессиям в структуры, контролируемые государством."
 SCO_reject_catholicism:0 "Отвергнуть католицизм"
 SCO_reject_catholicism_desc:0 "Государство должно отвергнуть ирландские папистские извращения."
 SCO_implement_the_total_war_theory:0 "Внедрить теорию тотальной войны"
 SCO_implement_the_total_war_theory_desc:0 "Изначально разработанная в Германии теория тотальной войны предусматривает подчинение всей экономики военным целям государства. Если мы хотим хоть как-то влиять на мир, нам следует последовать этому примеру."
 SCO_propagate_the_importance_of_struggle:0 "Пропагандировать важность борьбы"
 SCO_propagate_the_importance_of_struggle_desc:0 "Понятие борьбы — ключевой элемент фашизма, и наше понимание этого обеспечит нам превосходство."
 SCO_join_the_axis:0 "Вступить в Ось"
 SCO_join_the_axis_desc:0 "Нам нужны сильные союзники"
 SCO_Forced_Conscription:0 "Принудительный призыв"
 SCO_Forced_Conscription_desc:0 "Только мобилизация всех наших мужчин обеспечит победу."
 SCO_forge_our_own_path:0 "Проложить собственный путь"
 SCO_forge_our_own_path_desc:0 "Мы должны создать собственный альянс, если хотим преодолеть нынешнюю борьбу и обеспечить своё будущее."
 SCO_militarized_police:0 "Милитаризованная полиция"
 SCO_militarized_police_desc:0 "Для защиты страны необходимы надлежащая полиция и военизированные организации."
 SCO_celtic_liberation:0 "Освобождение кельтов"
 SCO_celtic_liberation_desc:0 "Нас ждёт объединение кельтского мира!"
 SCO_push_for_brittany:0 "Добиваться Бретани"
 SCO_push_for_brittany_desc:0 " "
 SCO_the_scottish_workers_republican_party:0 "Шотландская рабочая республиканская партия"
 SCO_the_scottish_workers_republican_party_desc:0 "Партия предлагала уникальную платформу, выступавшую одновременно за независимость Шотландии и марксизм. Теперь, когда независимость достигнута, мы видим, что этот курс был верным."
 SCO_political_batallions:0 "Политические батальоны"
 SCO_political_batallions_desc:0 "Подразделения, сформированные из лояльных активистов, будут обладать абсолютной политической надёжностью и высокой мотивацией."
 SCO_political_commissars:0 "Политические комиссары"
 SCO_political_commissars_desc:0 "Наиболее преданных членов политических батальонов можно повысить до политических комиссаров, каждый из которых будет следить за политической лояльностью одного воинского подразделения."
 SCO_red_army:0 "Наша собственная Красная армия"
 SCO_red_army_desc:0 "Пришло время создать собственную Красную армию, готовую защищать идеалы революции как дома, так и за рубежом."
 SCO_revolutionary_guards:0 "Революционная гвардия"
 SCO_revolutionary_guards_desc:0 "Специалисты по борьбе с контрреволюцией должны защищать нашу революцию и обеспечивать будущее рабочих."
 SCO_ideological_propaganda:0 "Идеологическая пропаганда"
 SCO_ideological_propaganda_desc:0 "Сознание рабочих всего мира должно пробудиться к принципам классовой борьбы."
 SCO_one_union_for_all_workers:0 "Единый профсоюз для всех рабочих"
 SCO_one_union_for_all_workers_desc:0 "Поскольку революционная власть является высшим представителем власти рабочих, только партийные организации имеют законное право представлять их интересы."
 SCO_encourage_the_proletariat:0 "Герои пролетариата"
 SCO_encourage_the_proletariat_desc:0 "Необходимо отбирать образцовых рабочих, а при необходимости и создавать их образ, чтобы пропагандировать ценность упорного труда среди нашего пролетариата."
 SCO_reeducate_the_bourgeoisie:0 "Перевоспитать буржуазию"
 SCO_reeducate_the_bourgeoisie_desc:0 "Навыки буржуазных классовых врагов всё ещё можно использовать, если должным образом просветить их относительно достоинств и преимуществ социализма."
 SCO_join_the_comintern:0 "Вступить в Коминтерн"
 SCO_join_the_comintern_desc:0 "Москва — сердце мировой революции и наш образец."
 SCO_a_new_international:0 "Новый Интернационал"
 SCO_a_new_international_desc:0 "Компромиссы СССР полностью лишили Третий интернационал права вести за собой рабочих всего мира. Поэтому должен возникнуть новый Интернационал."
 SCO_choose_a_monarch:0 "Выбрать монарха"
 SCO_choose_a_monarch_desc:0 "Если мы хотим восстановить монархию, нам нужно пригласить монарха принять нашу корону."
 SCO_democratic_constitutionalism:0 "Демократический конституционализм"
 SCO_democratic_constitutionalism_desc:0 "Парламентская традиция старше Акта об унии с Англией. Она препятствует злоупотреблению властью и защищает права граждан."
 SCO_promote_the_chemical_industry:0 "Поддержать химическую промышленность"
 SCO_promote_the_chemical_industry_desc:0 "Наша химическая промышленность поможет производить искусственный каучук и тем самым снизит нашу уязвимость перед возможной блокадой."
 SCO_support_trade:0 "Поддержать торговлю"
 SCO_support_trade_desc:0 "Ещё со времён «Богатства народов» Адама Смита было ясно, что от обмена выигрывают обе стороны. Такое мышление лежит в основе нашего процветания и должно поощряться."
 SCO_promote_chemical_industry:0 "Развивать химическую промышленность"
 SCO_promote_chemical_industry_desc:0 " "
 SCO_research_grants:0 "Исследовательские гранты"
 SCO_research_grants_desc:0 "Поощрение инноваций необходимо для получения конкурентного преимущества независимо от технологической области."
 SCO_attract_investors:0 "Привлечь инвесторов"
 SCO_attract_investors_desc:0 "Иностранные инвестиции могли бы значительно стимулировать нашу экономику, мы не должны отвергать в пользу автаркической глупости."
 SCO_economic_optimization:0 "Оптимизация экономики"
 SCO_economic_optimization_desc:0 "Экономические реформы позволят нашей экономике работать более слаженно и тем самым максимально раскрыть её потенциал."
 SCO_coalition_building:0 "Создание коалиции"
 SCO_coalition_building_desc:0 "Мы не можем оставаться в одиночестве в этом неспокойном мире. Мы должны участвовать в защите свободного мира."
 SCO_deterrence:0 "Сдерживание"
 SCO_deterrence_desc:0 "Продвижение собственной обороны может сыграть важную роль в предотвращении враждебного иностранного давления."
 SCO_the_volunteer_corps:0 "Добровольческий корпус"
 SCO_the_volunteer_corps_desc:0 "Вместо того чтобы просто читать донесения военных корреспондентов, мы могли бы отправлять экспедиционные корпуса, чтобы склонить чашу весов на мировой арене и защищать демократические идеалы от их многочисленных врагов."
 SCO_economic_mobilization:0 "Экономическая мобилизация"
 SCO_economic_mobilization_desc:0 "Если мы хотим достичь поставленных целей по снабжению, нам необходимо перевести экономику на военные рельсы."
 SCO_women_army_service:0 "Женская служба в армии"
 SCO_women_army_service_desc:0 " "
 SCO_womens_suffrage:0 "Избирательное право для женщин"
 SCO_womens_suffrage_desc:0 " "
 SCO_grant_power_to_the_crown:0 "Передать власть короне"
 SCO_grant_power_to_the_crown_desc:0 "Передать абсолютную власть над страной дворянину, который только что прибыл сюда... что вообще может пойти не так?"
 SCO_the_church_question:0 "Церковный вопрос"
 SCO_the_church_question_desc:0 "Отношения монарха с Католической церковью или Церковью Шотландии окажут сильное влияние на его легитимность."
 SCO_kings_guard:0 "Королевская гвардия"
 SCO_kings_guard_desc:0 "Отборные солдаты, организованные в элитные подразделения, — лучший способ защитить нашего государя."
 SCO_monarchist_officer_corps:0 "Монархический офицерский корпус"
 SCO_monarchist_officer_corps_desc:0 "Офицеры, зачастую происходящие из аристократии или сами формирующие собственную аристократию, могут стать костяком армии, верной короне."
 SCO_demand_the_stone_of_scone:0 "Потребовать Скунский камень"
 SCO_demand_the_stone_of_scone_desc:0 "Скунский камень необходим для подлинной коронации каждого шотландского монарха. Англичане забрали его и поместили под английский трон, чтобы автоматически короновать этих узурпаторов и как монархов Шотландии. Для обеспечения нашей легитимности крайне важно вернуть его."
 SCO_royal_aeronautical_patronage:0 "Королевское покровительство авиации"
 SCO_royal_aeronautical_patronage_desc:0 " "
 SCO_alliance_with_norway:0 "Союз с Норвегией"
 SCO_alliance_with_norway_desc:0 "В прошлом поддержка Норвегии имела большое значение для противодействия английскому влиянию. Сегодня она также может помочь нам установить контроль над Северным морем."
 SCO_restore_the_auld_alliance:0 "Восстановить Старый союз"
 SCO_restore_the_auld_alliance_desc:0 "Так называемый Старый союз с Францией в Средние века был краеугольным камнем шотландской геостратегии по сдерживанию английского экспансионизма против обеих стран. Он может оказаться чрезвычайно полезным для укрепления нашего положения."
 SCO_free_bavaria:0 "Освободить Баварию"
 SCO_free_bavaria_desc:0 "Дом Виттельсбахов является законным правящим домом как Шотландии, так и Баварии. Она не может оставаться под прусским гнётом Берлина."
 SCO_ally_bavaria:0 "Союз с Баварией"
 SCO_ally_bavaria_desc:0 "Нас связывают узы с Баварией, и союз с ней — логичный следующий шаг."
 SCO_restore_order_in_bavaria:0 "Восстановить порядок в Баварии"
 SCO_restore_order_in_bavaria_desc:0 " "
 SCO_split_germany_with_france:0 "Разделить Германию с Францией"
 SCO_split_germany_with_france_desc:0 "Если мы хотим обеспечить свободу Баварии, соглашение с Францией о ликвидации северогерманской угрозы Европе может стать нашим лучшим шансом."
 SCO_devise_cunning_plans:0 "Разработать хитроумные планы"
 SCO_devise_cunning_plans_desc:0 "Чтобы достигать наших целей посредством тайных операций, мы должны подготовить агентов, которые будут столь же хитроумны, как шпионы — выпускники Университета хитроумия."
 r56_scotland.1.t:0 "Выборы шотландского монарха"
 r56_scotland.1.desc:0 "Приверженность представителей монархии проложила путь к этому дню: выборам нового короля шотландцев. Одни рассматривают якобитских претендентов из баварского дома Виттельсбахов, другие же склоняются к избранию местного дворянина."
 r56_scotland.1.a:0 "Избрать якобитского наследника Рупрехта фон Виттельсбаха"
 r56_scotland.1.b:0 "Вместо него избрать Генриха, второго сына Рупрехта"
 r56_scotland.1.c:0 "Избрать герцога Гамильтона как Дугласа I"
 r56_scotland.2.t:0 "[SCO.Getadjective] требуют вернуть Скунский камень"
 r56_scotland.2.desc:0 "Шотландское правительство во главе с [SCO.GetLeader] потребовало, чтобы мы передали Скунский камень, который находится под Коронационным креслом с момента его создания в 1307 году."
 r56_scotland.2.a:0 "Ладно, в конце концов это всего лишь камень..."
 r56_scotland.2.b:0 "Возмутительно"
 r56_scotland.3.t:0 "[ENG.Getadjective] отказали!"
 r56_scotland.3.desc:0 "Утверждая, что камень принадлежит им уже много веков, хотя столетия назад его забрали у нас как символ их господства, правительство [ENG.Getadjective] дало понять, что не намерено возвращать нам Камень Судьбы. Удерживая важнейший элемент легитимности короны, они открыто оскорбили монархию. Они вновь плюнули на Шотландию и её историю."
 r56_scotland.3.a:0 "Созвать все кланы!"
 r56_scotland.3.b:0 "Война не нужна, у меня есть план..."
 r56_scotland.4.t:0 "[ENG.GetNameDefCap] возвращает Камень Судьбы"
 r56_scotland.4.desc:0 "Представитель [ENG.GetAdjective] сообщил нам, что Камень Судьбы действительно является важнейшей реликвией для шотландцев и необходим для коронации наших монархов. Подготовка к перевозке камня под охраной к границе уже началась. Нам остаётся лишь обсудить детали церемонии его встречи."
 r56_scotland.4.a:0 "Превосходно!"
 r56_scotland.5.t:0 "Камень Судьбы украден!"
 r56_scotland.5.desc:0 "Прошлой ночью группа подлых воров взломала Вестминстерское аббатство и похитила Камень Судьбы, находившийся в нише под Коронационным креслом. Учитывая прежние требования правительства [SCO.Getadjective], мы, разумеется, подозреваем его причастность. Охрана усилена, но грабители всё ещё в бегах, а камень так и не найден."
 r56_scotland.5.a:0 "Какая досада!"
 r56_scotland.6.t:0 "Камень Судьбы вернулся!"
 r56_scotland.6.desc:0 "Благодаря дерзким действиям наших агентов Камень Судьбы наконец вернулся в Шотландию. Его немедленно использовали для подтверждения законности коронации нашего монарха. В идеале его следовало бы вернуть в Скун, где ему и место, но напряжённость в отношениях с [ENG.GetNameDef] делает это слишком опасным. Теперь у нас есть законный монарх — первый за многие столетия король шотландцев, должным образом коронованный на нашей земле."
 r56_scotland.6.a:0 "Да здравствует король!"
 SCO_unlocks_cunning_plan_tt:0 "Открывает фокус §Y«Хитроумные планы»§!, позволяющий вернуть камень и восстановить контроль над церемонией коронации хитростью."
 operation_steal_the_stone_of_scone:0 "Вернуть Скунский камень"
 operation_steal_the_stone_of_scone_desc:0 "Кража Камня Судьбы и его возвращение в Скун позволят нам восстановить легитимность нашей монархии, избежав ненужных жертв."
 targeted_take_the_stone_of_scone:0 "Захватить Скунский камень"
 targeted_take_the_stone_of_scone_desc:0 "Агенты должны незаметно проникнуть в Вестминстерское аббатство и забрать 335-фунтовый камень из-под Коронационного кресла. Для эвакуации за пределы Лондона предоставлен грузовик, а также подготовлена группа эвакуации."
