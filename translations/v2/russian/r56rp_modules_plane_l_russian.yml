 EQ_MOD_CAT_interceptor_weapon_TITLE:0 "Оружие-перехватчик"
 r56rp_engine_upgrade_1:0 "Прямой впрыск топлива"
 r56rp_engine_upgrade_1_desc:0 "Технология довольно нова. Смешивание топлива внутри камеры сгорания имеет большие преимущества. Нашим пилотам больше не придется вручную регулировать подачу топливно-воздушной смеси в двигатели, а также выполнять отрицательные маневры G с уверенностью, что двигатель не затормозит."
 r56rp_engine_upgrade_1_tt:0 "Позволяет модернизировать двигатель до 2"
 r56rp_engine_upgrade_2:0 "Нагнетатели"
 r56rp_engine_upgrade_2_desc:0 "Используя воздушные компрессоры, работающие от мощности двигателя, мы можем улучшить воздушную смесь, подаваемую на электростанцию на всех высотах за счет немного увеличенного веса."
 r56rp_engine_upgrade_2_tt:0 "Позволяет модернизировать двигатель до 4"
 r56rp_engine_upgrade_3:0 "Чрезвычайная сила войны"
 r56rp_engine_upgrade_3_desc:0 "Хотя наши двигатели и без того грозные, нашим пилотам может потребоваться больше энергии, если ситуация требует этого. Были рассмотрены различные меры, но лишь некоторые из них были выбраны. Теперь наши пилоты могут получить доступ к 120% мощности двигателя, если этого потребует ситуация. Не рекомендуется работать на континуумах выше номинальных уровней, так как нагрузка на электростанцию огромна."
 r56rp_engine_upgrade_3_tt:0 "Модернизация двигателя до 6"
 r56rp_engine_upgrade_4:0 "Высокооктановое топливо"
 r56rp_engine_upgrade_4_desc:0 "С более высоким октановым топливом мы можем увеличить давление поршня, давая нам больше энергии."
 r56rp_engine_upgrade_4_tt:0 "Позволяет модернизировать двигатель до 8"
 r56rp_engine_aircooled_1x:0 "Пистонский двигатель с воздушным охлаждением"
 r56rp_engine_aircooled_1x_desc:0 "Размещая поршни вокруг вала пропеллера, мы можем обеспечить достаточное охлаждение двигателя без необходимости охлаждающей жидкости. Это, однако, увеличивает общее сопротивление самолета."
 r56rp_engine_watercooled_1x:0 "Водонепроницаемый Piston Engine"
 r56rp_engine_watercooled_1x_desc:0 "Используя жидкую охлаждающую жидкость, мы больше не обязаны обеспечивать доступ воздуха к поршням. Это позволяет нам поместить поршни в линию, уменьшая общее сопротивление за счет увеличения веса."
 r56rp_engine_jet_1x:0 "Двигатель"
 r56rp_engine_jet_1x_desc:0 "Эта радикально новая технология отказывается от традиционного метода сжигания поршней топлива в циклах и просто непрерывно выполняет этапы сгорания в определенных частях двигателя. Это решение легче, а благодаря высокой пропускной способности воздуха позволяет достигать поразительных скоростей."
 r56rp_engine_jet_reheat_1x:0 "Форсажный реактивный двигатель"
 r56rp_engine_jet_reheat_1x_desc:0 "Путем сброса топлива в выхлопные газы перегретого двигателя мы можем увеличить тягу двигателя, для минимального веса и увеличения стоимости. К сожалению, этот метод крайне неэффективен, что резко увеличивает использование боевого топлива."
 r56rp_engine_turboprop_1x:0 "Турбовинтовой двигатель"
 r56rp_engine_turboprop_1x_desc:0 "Принимая газовую турбину и используя ее для управления пропеллером, мы можем достичь гораздо лучшего соотношения мощности к весу, чем поршневой двигатель, за счет более низкой максимальной скорости по сравнению с реактивным двигателем."
 r56rp_engine_skincooled_1x:0 "Испарительный двигатель Piston"
 r56rp_engine_skincooled_1x_desc:0 "Радикальная идея. Охлаждающее вещество поддерживается под давлением в двигателе, что позволяет ему оставаться жидким даже при превышении температуры точки кипения. Охладитель отбирает тепло от двигателя, затем сбрасывает его в специальные баки на крыльях, где, в свою очередь, тепло может уйти в атмошпер. Это решение обещает почти полностью бесперебойную систему охлаждения, однако, поскольку для охлаждения двигателя используется почти весь самолет, любые полученные попадания будут смертельными для двигательной установки."
 r56rp_engine_rocket_early_1x:0 "Ранний ракетный двигатель"
 r56rp_engine_rocket_early_1x_desc:0 "Используя несколько крайне летучих видов топлива и столь же нестабильный окислитель, этот двигатель способен развивать огромную тягу и разгонять самолёт до высокой скорости, жертвуя дальностью полёта."
 r56rp_engine_rocket_late_1x:0 "Поздний ракетный двигатель"
 r56rp_engine_rocket_late_1x_desc:0 "Улучшение камеры сгорания и небольшие изменения топливной смеси позволяют добиться ещё более высоких характеристик, но дополнительно сокращают дальность полёта."
 r56rp_wing_monoplane_straight:0 "Прямой моноплан крыла"
 r56rp_wing_monoplane_straight_desc:0 "Одно прямое крыло обеспечивает хорошую маневренность, приличный подъем, а также достаточно низкое сопротивление для более скоростного полета."
 r56rp_wing_biplane:0 "Биплан"
 r56rp_wing_biplane_desc:0 "Имея два крыла, вы удваиваете подъемную поверхность самолета, позволяя взлетать с менее мощными двигателями, а также улучшенной маневренностью. Это происходит в ущерб повышенной стоимости и значительному увеличению сопротивления."
 r56rp_wing_monoplane_swept:0 "Захваченный моноплан Wing"
 r56rp_wing_monoplane_swept_desc:0 "Крылья помещают угол, дополнительно уменьшают сопротивление и улучшают маневренность на высокой скорости за счет низкой скорости."
 r56rp_material_wood:0 "Дерево и холст"
 r56rp_material_wood_desc:0 "В то время как алюминий является предпочтительным, мы можем быть вынуждены прибегнуть к более легко продаваемым материалам."
 r56rp_material_aluminium_basic:0 "Алюминий"
 r56rp_material_aluminium_basic_desc:0 "Благодаря превосходным характеристикам алюминия мы можем сделать наши самолеты легче по сравнению с деревянными аналогами времен Великой войны, а также более устойчивыми к повреждениям."
 r56rp_material_hybrid:0 "Смешанный древесно-металлический"
 r56rp_material_hybrid_desc:0 "Сократив использование алюминия в некритических областях, мы можем несколько снизить стоимость производства за счет производительности."
 r56rp_air_air_radar_3:0 "Воздушный радар III"
 r56rp_air_air_radar_3_desc:0 "Благодаря более коротким длинам волн, увеличенному разрешению и новым методам поиска этот радар делает все старые бортовые радары устаревшими."
 r56rp_gyro_gunsight:0 "Гироскопический Gunsight"
 r56rp_gyro_gunsight_desc:0 "Отражательный прицел, где после ввода дальности и размера вражеского самолета автоматически рассчитывается падение пули и требуемый свинец. Показывает указание того, где пилот должен вести огонь, чтобы поразить вражеский самолет."
 r56rp_radar_gunsight:0 "Радарные оружейные прицелы"
 r56rp_radar_gunsight_desc:0 "Гироскопическая стрелковая прицельная установка с автоматическим вводом дальности небольшим радарным дальномером. Показывает точное указание того, где пилот должен вести огонь, чтобы поразить вражеский самолет."
 r56rp_hmg_aglt_turret_x1:0 "Автоматическая стрелковая башня"
 r56rp_hmg_aglt_turret_x1_desc:0 "Хвостовая башня оснащена усовершенствованной системой управления огнем, соединенной с сантиметровым радиолокационным приемником предупреждения. Он способен автономно взаимодействовать с вражескими самолетами в полной темноте и в облаке.\n\nВысокая сложность ограничивает эту систему хвостовым креплением."
 r56rp_hmg_remote_turret_x1:0 "Башня Heavy MG RC Defence"
 r56rp_hmg_remote_turret_x1_short:0 "HMG RC башня"
 r56rp_hmg_remote_turret_x1_desc:0 "Дистанционное управление позволяет башне практически не влиять на аэродинамику самолета, на который она установлена, сохраняя при этом огневую мощь традиционной установки."
 r56rp_hmg_remote_turret_x2:0 "Тяжелая башня MG RC Defence башня x2"
 r56rp_hmg_remote_turret_x2_short:0 "HMG RC башня x2"
 r56rp_hmg_remote_turret_x2_desc:0 "$r56rp_hmg_remote_turret_x1_desc$"
 r56rp_med_drop_tanks:0 "Средний подвесной топливный бак"
 r56rp_med_drop_tanks_desc:0 "Самолет получает меньше топлива из этого бака. Внешняя установка топливного бака доказала, что не имеет недостатков в живучести нашего самолета."
 r56rp_dive_brakes_med:0 "Средние погружения Breaks"
 r56rp_dive_brakes_med_desc:0 "Более крупные погружения, которые позволяют средним планерам иметь больше контроля в погружениях"
 r56rp_guided_anti_ship_bomb_1x:0 "Противокорабельная планирующая бомба"
 r56rp_guided_anti_ship_bomb_1x_desc:0 "Дистанционно управляемая противокорабельная планирующая бомба."
 r56rp_aircraft_cannon_3_1x:0 "1x Револьверная пушка"
 r56rp_aircraft_cannon_3_1x_desc:0 "Одиночная огневая авиационная пушка."
 r56rp_aircraft_cannon_3_2x:0 "2-кратная пушка револьвера"
 r56rp_aircraft_cannon_3_2x_desc:0 "Пара высоковольтных авиационных пушек."
 r56rp_aircraft_hmg_3_2x:0 "2-кратное быстрострельное тяжелое пулеметное оружие"
 r56rp_aircraft_hmg_3_2x_desc:0 "Пара тяжелых пулеметов с улучшенными механизмами подачи, извергающимися, вела с ошеломляющей скоростью."
 r56rp_aircraft_hmg_3_4x:0 "4-кратное быстрострельное тяжелое пулеметное оружие"
 r56rp_aircraft_hmg_3_4x_desc:0 "Квартет тяжелых пулеметов с улучшенными механизмами подачи, извергающимися, вел в ошеломляющем темпе."
 r56rp_aircraft_cannon_4_1x:0 "Шрэге Мусик"
 r56rp_aircraft_cannon_4_1x_desc:0 "Пушки устанавливались вверх для поражения вражеских бомбардировщиков."
 r56rp_aircraft_aa_nuclear:0 "Ядерная ракета класса \"воздух-воздух\""
 r56rp_aircraft_aa_nuclear_desc:0 "Ракета класса «воздух-воздух» вооружена компактной ядерной боеголовкой."
 r56rp_rocket_rails_3:0 "Современные ракетные капсулы"
 r56rp_rocket_rails_3_desc:0 "Используя складные плавники и храня ракеты в готовых перезаряжаемых контейнерах, которые также могут быть низкоуглеводными благодаря отбрасываемым адаптерам, наши самолеты будут способны нести большие количества таранов при минимальном понижении производительности."
 r56rp_tank_buster_3:0 "Противотанковая пушка III"
 r56rp_tank_buster_3_desc:0 "Улучшения в металлургии позволяют сохранить смертоносные снаряды высокого калибра при одновременном снижении веса механизма загрузки."
 r56rp_air_to_surface_missile:0 "Ракета класса \"воздух-поверхность\""
 r56rp_air_to_surface_missile_desc:0 "Противотанковая ракета воздушного базирования Remotley."
 r56rp_ir_guided_bombs:0 "Инфракрасная бомба"
 r56rp_ir_guided_bombs_desc:0 "Инфракрасная управляемая бомба будет использоваться на тепловых сигнатурах, таких как те, которые выдают заводы и нефтеперерабатывающие заводы."
 r56rp_improved_ir_guided_bomb:0 "Улучшенная инфракрасная бомба"
 r56rp_improved_ir_guided_bomb_desc:0 "Инфракрасная управляемая бомба будет иметь тепловые сигнатуры, такие как те, которые выдаются заводами и нефтеперерабатывающими заводами с улучшенной точностью и точностью."
