 VIN_communism_party_long:0 "Коммунистическая партия Вьетнама"
 VIN_nguyen_dynasty_neutrality_party_long:0 "Династия Нгуен"
 VIN_comittee_independent_vietnam_party_long:0 "Комитет восстановления независимого Вьетнама"
 VIN_la_lutte_party_long:0 "«Ля Лютт»"
 vietnam.1.t:0 "[VIN.GetNameDefCap]Вступление в Коминтерн"
 vietnam.1.d:0 "[VIN.GetAdjective] посол в [SOV.GetNameDef] только что передал просьбу непосредственно от [VIN.GetAdjective] правительства.\nОно желает, чтобы [VIN.GetNameDef] присоединилась к военному союзу во главе с [SOV.GetNameDef], надеясь получить защиту своей территории и самой революции."
 vietnam.1.a:0 "Передайте дядюшке Хо, что он под нашей защитой."
 vietnam.1.b:0 "Мы должны отказать."
 vietnam.2.t:0 "[SOV.GetNameDefCap] соглашается"
 vietnam.2.d:0 "[SOV.GetNameDefCap] положительно ответила на просьбу [VIN.GetNameDef] о вступлении в военный союз.\nТеперь между нашими территориями будет установлено свободное перемещение войск, а в случае конфликта они окажут нам помощь."
 vietnam.2.a:0 "Превосходно!"
 vietnam.3.t:0 "[SOV.GetNameDefCap] отказывает"
 vietnam.3.d:0 "[SOV.GetNameDefCap] отрицательно ответила на предложение военного союза между нашими странами. В частности, было заявлено, что нынешняя обстановка неблагоприятна и [SOV.GetNameDef] не может гарантировать оборону [VIN.GetNameDef]. Однако возможность союза в будущем, после изменения мировой ситуации, не была исключена."
 vietnam.3.a:0 "Мы можем рассчитывать только на себя."
 vietnam.4.t:0 "Коммунисты пытаются совершить переворот!"
 vietnam.4.d:0 "Многочисленные отряды ополчения, верные Армии освобождения народов Малайи и связанной с ней Коммунистической партии Малайи, развернулись в Сингапуре и пытаются захватить колониальное правительство, уничтожить [ENG.GetAdjective] администрацию и установить коммунистический режим.\nВерные правительству силы, размещённые за пределами города, готовятся отбить его, но их победа не гарантирована."
 vietnam.4.a:0 "Переворот удаётся."
 vietnam.4.b:0 "Переворот проваливается."
 vietnam.5.t:0 "[MAL.GetAdjective] переворот провалился!"
 vietnam.5.d:0 "Коммунистические силы не смогли удержать Сингапур и после долгого сражения были разбиты. Многие кадры Коммунистической партии Малайи попали в плен или погибли, что уничтожило наши шансы установить коммунизм в Малайе изнутри."
 vietnam.5.a:0 "Мы отомстим за наших братьев!"
 vietnam.6.t:0 "Помощь с юга"
 vietnam.6.d:0 "Гоминьдан и VNQDD всегда были союзниками, поскольку обе организации стремились следовать учению Сунь Ятсена. Кадры VNQDD годами находились под защитой [CHI.GetNameDef], скрываясь от [FRA.GetAdjective] полиции.\nТеперь, когда [CHI.GetNameDef] снова оказалась в состоянии войны, [VIN.GetAdjective] правительство направило нам просьбу о помощи."
 vietnam.6.a:0 "Вместе мы сильнее."
 vietnam.6.b:0 "Нам не нужна их помощь."
 ASIAN_LEAGUE_NAME:0 "Азиатская лига"
 vietnam.7.t:0 "[CHI.GetNameDefCap] отказывается от нашей помощи"
 vietnam.7.d:0 "[CHI.GetAdjective] правительство отклонило наше предложение о помощи. Мы не можем рассчитывать на их защиту, как и они на нашу."
 vietnam.7.a:0 "Мы уважаем их решение."
 vietnam.8.t:0 "Победа!"
 vietnam.8.d:0 "Последние [FRA.GetAdjective] войска были вынуждены покинуть Индокитайский полуостров, и теперь мы можем уверенно объявить о победе. [FRA.GetAdjective] угнетение осталось позади!"
 vietnam.8.a:0 "Ура!"
 vietnam.9.t:0 "Лидерство Хо Ши Мина"
 vietnam.9.d:0 "Нгуен Ай Куок, более известный под именем Хо Ши Мин, лидер Вьетминя и вьетнамского сопротивления колониализму, познакомился с марксистскими и ленинскими идеями в Советском Союзе, прежде чем вернуться и возглавить восстание против колониальной администрации. Он стал больше чем лидером — новым отцом [VIN.GetAdjective] нации. Пусть он приведёт [VIN.GetNameDef] к эпохе процветания."
 vietnam.9.a:0 "Ура!"
 vietnam.10.t:0 "Лидерство «Ля Лютт»"
 vietnam.10.d:0 "Та Тху Тхау, лидер «Ля Лютт», много месяцев организовывавший настоящую социалистическую оппозицию [FRA.GetAdjective] колонизации, вместе со своими троцкистскими товарищами возглавил восстание, освободившее Вьетнам. Как символ надежды и свободы, он заручился поддержкой крестьян и городских рабочих, став очевидным выбором на роль лидера страны."
 vietnam.10.a:0 "Ура!"
 vietnam.11.t:0 "Лидерство VNQDD"
 vietnam.11.d:0 "Нгуен Тыонг Там, лидер VNQDD — одной из старейших и наиболее активных партий, выступавших за независимость Вьетнама, — сумел восстановить силу организации после того, как французская администрация почти уничтожила её. Возглавив восстание, он добился руководящей роли. Народ считает его национальным героем, и теперь он сможет проводить политику, которую его партия отстаивала многие годы."
 vietnam.11.a:0 "Ура!"
 vietnam.12.t:0 "Лидерство Кыонг Де"
 vietnam.12.d:0 "Хотя всё указывало на то, что [VIN.GetAdjective] восстание будет сопровождаться внутренней революцией и, в частности, созданием республики, Кыонг Де — член императорской династии и давний сторонник независимости Вьетнама — сумел получить необходимую поддержку и возглавить мятеж. В первую очередь ему помогли влиятельные элиты, перешедшие на сторону победивших сторонников независимости. Его собственное видение Вьетнама вдохновлено такими режимами, как [JAP.GetNameDef], где он сумел заручиться достаточной поддержкой для участия в войне за независимость."
 vietnam.12.a:0 "Ура!"
 vietnam.13.t:0 "Разделённое руководство"
 vietnam.13.d:0 "Силы, боровшиеся за независимость Вьетнама, были многочисленны и придерживались радикально отличающихся взглядов, поэтому долгосрочное сотрудничество между ними невозможно. Теперь, когда война окончена, победить может только одна сторона."
 vietnam.13.a:0 "Нас поведёт Хо Ши Мин!"
 vietnam.13.b:0 "«Ля Лютт» и троцкисты!"
 vietnam.13.c:0 "VNQDD!"
 vietnam.13.e:0 "Кыонг Де!"
 vietnam.14.t:0 "Война за независимость"
 vietnam.14.d:0 "Пришло время изгнать [FRA.GetAdjective] захватчиков. Вьетнам вновь станет независимым!"
 vietnam.14.a:0 "К победе!"
