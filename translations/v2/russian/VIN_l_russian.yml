 asked_to_join:0 "Попросили присоединиться к борьбе"
 ho_chi_minh_victorious_flag:0 "§YХо Ши Мин§! победил в борьбе за власть"
 la_lutte_victorious_flag:0 "§Y«Ля Лютт»§! победила в борьбе за власть"
 vnqdd_victorious_flag:0 "§YVNQDD§! победила в борьбе за власть"
 cuong_de_victorious_flag:0 "§YКыонг Де§! победил в борьбе за власть"
 invited_phan_boi_chau_flag:0 "Фан Бой Тяу приглашён в правительство"
 VIN_war_of_independence_flag:0 "Мы ведём войну за независимость"
 VIN_ho_chi_minh_victorious:0 "Победа Хо Ши Мина!"
 VIN_ho_chi_minh_victorious_desc:0 "Несмотря на все происки контрреволюционных сил и троцкистских предателей, Хо Ши Мин утвердил свою власть по всему Вьетнаму. Полное освобождение возможно лишь после избавления от капиталистических цепей, и мы применим все необходимые средства для построения социалистического Вьетнама."
 VIN_land_rent_reduction_campaign:0 "Кампания по снижению земельной ренты"
 VIN_three_together_system:0 "Система «Три вместе»"
 VIN_three_together_system_desc:0 "Система «Три вместе» предполагает отправку партийных чиновников в деревни безземельных крестьян, где они вместе работают, вместе едят и вместе живут. Так мы соберём достаточно сведений о деревнях, чтобы начать аграрные реформы и познакомить население с классовой борьбой."
 VIN_cement_rule_in_the_villages:0 "Укрепить власть в деревнях"
 VIN_cement_rule_in_the_villages_desc:0 "Во Вьетнаме существует поговорка «Phep Vua Thua Le Lang», буквально означающая, что император уступает деревенским обычаям. Она подразумевает, что государственная власть в деревнях была заменена местным самоуправлением. Для сохранения авторитета правительства необходимо подчинить все деревни его верховному контролю."
 VIN_land_reforms_program:0 "Программа земельной реформы"
 VIN_land_reforms_program_desc:0 "Пришло время принять законы, позволяющие провести земельную реформу. Она будет осуществляться провинция за провинцией под надзором Центрального комитета земельной реформы."
 VIN_begin_the_five_years_plan:0 "Начать пятилетний план"
 VIN_begin_the_five_years_plan_desc:0 "Экономика сможет развиваться только при централизации под руководством партии. Для построения социализма во Вьетнаме необходимо запустить эффективный общенациональный план индустриализации."
 VIN_woo_the_stalinists:0 "Склонить сталинистов на свою сторону"
 VIN_woo_the_stalinists_desc:0 "[SOV.GetNameDefCap] — наш естественный союзник. Она помогла нам в борьбе за независимость и дала Хо Ши Мину марксистско-ленинскую подготовку. Её защита также позволит оградить революцию от нападения контрреволюционных сил."
 VIN_the_permanent_siege:0 "Постоянная осада"
 VIN_the_permanent_siege_desc:0 "Мы изолированы от остальных коммунистических братьев. [PRC.GetLeader] окружён в горах, а от [SOV.GetNameDef] нас отделяет океан. Мы превратим это положение в инструмент пропаганды, внушая народу обязанность защищать революцию и страну."
 VIN_asian_proletarian_solidarity:0 "Азиатская пролетарская солидарность"
 ASIAN_PROLETARIAN_SOLIDARITY_FACTION:0 "Азиатская пролетарская солидарность"
 VIN_asian_proletarian_solidarity_desc:0 "Мы первыми разгромили колонизаторов и освободили страну от империализма. Однако по всей Азии народы продолжают страдать под игом колониальных капиталистических держав. Мы окажем полную поддержку различным азиатским коммунистическим движениям, чтобы раз и навсегда покончить с колониализмом!"
 VIN_intervene_in_chineses_affairs:0 "Вмешиваться [CHI.GetAdjective] Вопросы"
 VIN_intervene_in_chineses_affairs_desc:0 "Наши [PRC.GetAdjective] товарищи оказали большую помощь и вдохновили Хо Ши Мина. Однако реакционеры Гоминьдана продолжают преследовать и подавлять их. Пришло время вмешаться и спасти наших братьев."
 VIN_invite_soviet_industrial_experts:0 "пригласите [SOV.GetAdjective] Промышленные эксперты"
 VIN_invite_soviet_industrial_experts_desc:0 "The [SOV.GetAdjective]Россия превратилась из крестьянской нации в индустриального монстра благодаря радикальным реформам, проведенным компетентными людьми. Эти же люди могли бы помочь нам индустриализировать себя, что нам и нужно, учитывая то низкое значение, которое французы придают развитию тяжелой промышленности."
 VIN_create_the_hanoi_group:0 "Создать Ханойскую группу"
 VIN_create_the_hanoi_group_desc:0 "Чыонг Тинь предложил отличный способ преодолеть научное отставание: создать в Ханое крупный научный центр, открытый для всех учёных, разделяющих социалистические идеалы. Затем мы сможем передавать технологические достижения другим коммунистическим союзникам."
 VIN_formalise_the_alliance:0 "Официально оформить союз"
 VIN_formalise_the_alliance_desc:0 "Победа коммунистов в Китае обеспечена. Пришло время заключить с ними союзный договор и начать последнюю битву за окончательное уничтожение [CHI.GetAdjective] реакционных сил."
 VIN_anti_japanese_aim:0 "Антияпонский курс"
 VIN_anti_japanese_aim_desc:0 "[JAP.GetNameDefCap] жаждет крови, власти и завоеваний. Она подчинила Корею и Маньчжурию, а вскоре может захватить всю Азию. Нельзя позволить столь тиранической стране продолжать безнаказанно. Вместе с [SOV.GetAdjective] товарищами мы организуем вторжение в [JAP.GetNameDef], чтобы привести её в коммунистическую сферу."
 VIN_looking_beyond:0 "Взгляд за пределы страны"
 VIN_political_reorganisation_of_the_army:0 "Политическая реорганизация армии"
 VIN_political_reorganisation_of_the_army_desc:0 "Армия необходима для защиты и распространения революции, но в ней всё ещё могут скрываться предатели, особенно верные троцкистам. Следуя примеру советских чисток, мы также должны избавиться от офицеров, признанных «потенциально опасными»."
 VIN_finish_what_we_started:0 "Завершить начатое"
 VIN_finish_what_we_started_desc:0 "Несмотря на победу над капиталистическими силами, Лаос и Камбоджа продолжают страдать под угнетательскими капиталистическими режимами. Мы должны освободить их так же, как освободили себя."
 VIN_finish_what_we_started_tt:0 "Если §YЛаос§! или §YКамбоджа§! не являются §Yкоммунистическими§!, мы получим против них цель войны."
 VIN_prepare_for_the_worst:0 "Подготовиться к худшему"
 VIN_prepare_for_the_worst_desc:0 "Мы бросаем вызов настоящим колоссам, намного сильнее и многочисленнее нас. Несмотря на всю нашу решимость, солдатам, вероятно, понадобятся укрепления."
 VIN_la_lutte_victorious:0 "«Ля Лютт»"
 VIN_la_lutte_victorious_desc:0 "«Ля Лютт» победила контрреволюционеров и сталинистских предателей и готова проводить политику революционного социализма, основанную на идеях Льва Троцкого."
 VIN_minimal_socialist_bureaucracy:0 "Минимальная социалистическая бюрократия"
 VIN_minimal_socialist_bureaucracy_desc:0 "Чрезмерная бюрократия, характерная для сталинистских режимов, превращает их в скрытую иерархию. Чтобы избежать подобного уклона, который со временем вновь приведёт к эксплуатации рабочих высшими классами, бюрократию необходимо свести к минимуму, прежде всего за счёт большей региональной автономии."
 VIN_immediate_land_reform:0 "Немедленная земельная реформа"
 VIN_immediate_land_reform_desc:0 "Для освобождения крестьян коллективизацию необходимо провести немедленно и без компромиссов с землевладельцами. При поддержке партии крестьян будут поощрять самостоятельно объединяться в коллективные хозяйства."
 VIN_the_permanent_revolution_theory:0 "Теория перманентной революции"
 VIN_the_permanent_revolution_theory_desc:0 "Перманентная революция — ключевая идея троцкизма, согласно которой революция завершится лишь после полного искоренения капитализма. Поддержка социалистических движений не только в Азии, но и во всём мире должна стать нашим приоритетом."
 VIN_encourage_inter_party_democracy:0 "Поощрять внутрипартийную демократию"
 VIN_encourage_inter_party_democracy_desc:0 "Даже при единой революционной партии она должна оставаться открытой для разных подходов к развитию вьетнамского социализма. Ежемесячные обсуждения политики и создание Народного собрания позволят лучше понимать потребности населения и приспосабливаться к ним."
 VIN_a_gun_in_every_hand:0 "Оружие в каждую руку..."
 VIN_a_gun_in_every_hand_desc:0 "Значительную часть революции должен осуществить сам народ. Чтобы помочь ему бороться с капиталистической эксплуатацией, каждый получит право владеть огнестрельным оружием и обучать собственное ополчение защите революционных идей."
 VIN_our_own_internationale:0 "Собственный Интернационал"
 VIN_our_own_internationale_desc:0 "Сталинистские предатели захватили контроль над Третьим интернационалом. Для защиты и распространения подлинной революции необходимо объединиться против их тирании."
 ASIAN_INTERNATIONALE_FACTION:0 "Азиатский интернационал"
 VIN_align_with_trotsky_regime:0 "Присоединиться к режиму Троцкого"
 VIN_align_with_trotsky_regime_desc:0 "Лев Троцкий, законный преемник Ленина, сумел прийти к власти. Объединившись с ним, мы сможем распространить перманентную революцию!"
 VIN_align_with_trotsky_regime_tt:0 "Мы направим §YТроцкому§! просьбу о вступлении в его альянс."
 VIN_mimic_the_red_army:0 "Подражать Красной армии"
 VIN_mimic_the_red_army_desc:0 "Красная армия под руководством Троцкого блестяще разгромила Белое движение. Следуя её примеру и пригласив во Вьетнам некоторых офицеров, мы также сможем создать победоносную армию."
 VIN_a_factory_in_every_city:0 "...И завод в каждом городе"
 VIN_a_factory_in_every_city_desc:0 "Только рабочие способны осуществить революцию. Крестьяне слишком зависят от землевладельцев, поэтому им гораздо труднее отвергнуть капитализм. Развитие промышленности посредством общественных работ поможет увеличить численность рабочего класса."
 VIN_the_urban_revolution:0 "Городская революция"
 VIN_personnal_armament_program:0 "Программа личного вооружения"
 VIN_personnal_armament_program_desc:0 "Значительную часть революции должен осуществить сам народ. Чтобы помочь ему бороться с капиталистической эксплуатацией, каждый получит право владеть огнестрельным оружием и обучать собственное ополчение защите революционных идей."
 VIN_invite_poum_officers:0 "Пригласить офицеров POUM"
 VIN_invite_poum_officers_desc:0 "POUM, испанскую троцкистскую партию, предали те, кто должен был быть её союзником, — республиканское правительство Испании, действовавшее по указанию сталинистского СССР. К счастью, некоторым опытным руководителям удалось избежать репрессий. Они станут грозными союзниками в борьбе со сталинизмом."
 VIN_poum_officers:0 "Офицеры POUM"
 VIN_poum_officers_desc:0 "POUM, испанскую троцкистскую партию, предали те, кто должен был быть её союзником, — республиканское правительство Испании, действовавшее по указанию сталинистского СССР. К счастью, некоторым опытным офицерам удалось избежать репрессий. Они станут грозными союзниками в борьбе со сталинизмом."
 VIN_strike_indochina:0 "Ударить по Индокитаю"
 VIN_strike_indochina_desc:0 "Правительства Лаоса и Камбоджи являются угнетательскими и капиталистическими. Ради социализма и перманентной революции мы должны освободить братские народы."
 VIN_arm_malaysians_communists:0 "Вооружить [MAL.GetAdjective] коммунистов"
 VIN_arm_malaysians_communists_desc:0 "[MAL.GetNameDefCap] находится совсем рядом и может стать отличной отправной точкой для распространения революции по всей Юго-Восточной Азии. Мы установили связь со многими коммунистическими движениями региона, большинство из которых укрылось в [VIN.GetNameDef], опасаясь репрессий колониального правительства."
 VIN_fullfil_our_duty:0 "Исполнить свой долг"
 VIN_fullfil_our_duty_desc:0 "Борьба закончится лишь после поражения последнего капиталиста. Наши солдаты пройдут через горы и леса, чтобы освободить мир от цепей и исполнить революционный долг."
 VIN_expand_the_workers_class:0 "Расширить рабочий класс"
 VIN_expand_the_workers_class_desc:0 "Только рабочие способны осуществить революцию. Крестьяне слишком зависят от землевладельцев, поэтому им гораздо труднее отвергнуть капитализм. Развитие промышленности посредством общественных работ поможет увеличить численность рабочего класса."
 VIN_the_internal_fight_continues:0 "Внутренняя борьба продолжается"
 VIN_the_internal_fight_continues_desc:0 "Было бы опасно полагать, что после отстранения коммунистов капиталисты исчезли с нашей территории. Капитализм — образ мышления, веками укоренявшийся в сознании угнетённых народов, и лишь указав людям путь, мы сможем построить более справедливый мир."
 VIN_the_vnqdd_in_power:0 "VNQDD у власти"
 VIN_the_vnqdd_in_power_desc:0 "VNQDD утвердилась как главная сила восстания и теперь находится у власти. Её цели не изменились с момента создания: основание демократической Вьетнамской республики."
 VIN_gradual_agrarian_reform:0 "Постепенная аграрная реформа"
 VIN_gradual_agrarian_reform_desc:0 "Отличный способ заручиться поддержкой крестьян — передать им обрабатываемую землю. Мы можем столкнуться с сопротивлением землевладельцев, но после обретения независимости их влияние значительно ослабло."
 VIN_help_the_kuomintang:0 "Помочь Гоминьдану"
 VIN_help_the_kuomintang_desc:0 "Наши союзники из Гоминьдана оказались между внутренними врагами, такими как коммунисты, и внешними угрозами, такими как [JAP.GetNameDef]. После всей помощи, которую они оказывали нам в долгой борьбе против колониального правительства, мы обязаны поддержать их."
 VIN_dan_toc:0 "Дан Ток"
 VIN_dan_toc_desc:0 "Первой и важнейшей задачей было восстановление вьетнамской нации, независимой от любого иностранного влияния. Все вьетнамцы должны понимать, что само существование нашей страны зависит от их мужества и решимости защищать родину."
 VIN_dan_toc2:0 "Дан Ток"
 VIN_dan_toc2_desc:0 "Первой и важнейшей задачей было восстановление вьетнамской нации, независимой от любого иностранного влияния. Все вьетнамцы должны понимать, что само существование нашей страны зависит от их мужества и решимости защищать родину."
 VIN_dan_chu:0 "Дан Тю"
 VIN_dan_chu_desc:0 "Десятилетиями нас эксплуатировало тираническое колониальное правительство, действовавшее от имени страны, называющей себя демократической, но никогда не позволявшей коренным народам быть услышанными. Мы должны доказать приверженность демократии, обеспечив её нормальную работу и максимально широкое представительство."
 VIN_dan_chu2:0 "Дан Тю"
 VIN_dan_chu2_desc:0 "Десятилетиями нас эксплуатировало тираническое колониальное правительство, действовавшее от имени страны, называющей себя демократической, но никогда не позволявшей коренным народам быть услышанными. Мы должны доказать приверженность демократии, обеспечив её нормальную работу и максимально широкое представительство."
 VIN_hanh_phuc:0 "Хань Фук"
 VIN_hanh_phuc_desc:0 "Главная роль государства и избранных представителей — улучшать условия жизни населения и защищать его от эксплуатации и бедности. Для создания системы социального обеспечения будет введена новая налоговая система."
 VIN_hanh_phuc2:0 "Хань Фук"
 VIN_hanh_phuc2_desc:0 "Главная роль государства и избранных представителей — улучшать условия жизни населения и защищать его от эксплуатации и бедности. Для создания системы социального обеспечения будет введена новая налоговая система."
 VIN_vietnams_tridemism:0 "Вьетнамский тридемизм"
 VIN_vietnams_tridemism_desc:0 "VNQDD находилась под сильным влиянием Гоминьдана и особенно его основателя Сунь Ятсена. Среди его многочисленных идей важнейшими являются три народных принципа. То, что возможно в Китае, возможно и здесь. Мы воплотим эти идеалы в новой республике."
 VIN_establish_the_regional_parliaments:0 "Создать региональные парламенты"
 VIN_establish_the_regional_parliaments_desc:0 "Для улучшения местного представительства следует создать парламенты трёх регионов Вьетнама: Кохинхины, Аннама и Тонкина. По уровню полномочий они будут уступать лишь федеральному парламенту и смогут принимать решения, в частности по бюджету."
 VIN_build_the_quang_bich_line:0 "Построить линию Куангбить"
 VIN_build_the_quang_bich_line_desc:0 "Противостояние с [JAP.GetNameDef] главным образом развернётся на суше, но из-за значительно меньшего флота нам также угрожают морские десанты. Мы начнём программу строительства береговых укреплений для предотвращения высадок."
 VIN_incochinese_neutrality:0 "Нейтралитет Индокитая"
 VIN_incochinese_neutrality_desc:0 "Мы пролили достаточно вьетнамской крови ради независимости. Вмешательство в другие конфликты было бы безрассудством. Восстановление Вьетнама должно стать главным приоритетом."
 VIN_mutual_defensive_treaty:0 "Договор о взаимной обороне"
 VIN_mutual_defensive_treaty_desc:0 "Оборонительный договор с лаосскими и камбоджийскими братьями полностью обезопасит западный фронт и даст потенциальных союзников на случай нарушения нашего нейтралитета."
 VIN_anti_japanese_guerrila_tactics:0 "Анти-[JAP.GetAdjective] Партизанская тактика"
 VIN_anti_japanese_guerrila_tactics_desc:0 "Японская армия может быть лучше оснащена, но мы лучше всех знаем местность и способы использовать её в своих интересах. Нападения на движущиеся колонны и скрытые удары по снабжению нанесут достаточно ущерба, чтобы помочь нам защититься, а затем отбросить врага."
 VIN_a_light_of_hope_over_asia:0 "Свет надежды над Азией"
 VIN_influence_our_brothers:0 "Повлиять на наших братьев"
 VIN_influence_our_brothers_desc:0 "Наш демократический успех покажет народам Камбоджи и Лаоса путь к стране, действующей ради народа."
 VIN_establish_the_ve_binh_cong_hoa:0 "Создать Ве Бинь Конг Хоа"
 VIN_establish_the_ve_binh_cong_hoa_desc:0 "Ве Бинь Конг Хоа, или Республиканская гвардия, станет военизированным формированием под руководством правительства и независимым от армии. Так мы надеемся увеличить число резервистов."
 VIN_the_new_emperor:0 "Новый император"
 VIN_the_new_emperor_desc:0 "Кыонг Де, законный император Вьетнама, сумел вернуть трон и сорвать предательские планы революционеров."
 VIN_cooperation_with_japan:0 "Сотрудничество с [JAP.GetNameDef]"
 VIN_cooperation_with_japan_desc:0 "[JAP.GetNameDefCap] служит образцом для Кыонг Де. Эта страна сумела победить европейских империалистов и создать собственную сферу влияния — пример, которому должна следовать любая гордая азиатская держава. Вместе с ней мы тоже станем великой империей."
 VIN_cooperation_with_landlords:0 "Сотрудничество с землевладельцами"
 VIN_cooperation_with_landlords_desc:0 "Землевладельцы жизненно важны для функционирования страны. Вместо того чтобы отнимать их собственность, следует поддержать их и получить поддержку взамен."
 VIN_centralise_the_regions:0 "Централизовать регионы"
 VIN_centralise_the_regions_desc:0 "Децентрализация губительна для работы страны и национального единства, что хорошо понимала Франция. Система трёх регионов будет упразднена и заменена административными единицами, гораздо сильнее подчинёнными центральному правительству."
 VIN_crush_the_republicans:0 "Разгромить республиканцев"
 VIN_crush_the_republicans_desc:0 "Вьетнамские республиканцы стали новым врагом режима. Скрываясь в лесах, они противостоят монархическому правительству. Их необходимо нейтрализовать, прежде чем они нанесут серьёзный ущерб."
 VIN_the_hoi_quy_toc:0 "Хой Куи Ток"
 VIN_the_hoi_quy_toc_desc:0 "Хой Куи Ток станет собранием дворян и мандаринов, верных Кыонг Де, и будет помогать ему принимать решения во внутренней и внешней политике. Не обладая реальной законодательной властью, оно обеспечит большую лояльность знати и окружит нас компетентными людьми."
 VIN_royal_corporatism:0 "Королевский корпоративизм"
 VIN_royal_corporatism_desc:0 "По всему Вьетнаму развивается множество крупных и мелких предприятий. Их направление в националистическое русло позволит наладить лучшее сотрудничество классов на благо страны."
 VIN_deploy_the_dan_quan_hoang_gia:0 "Развернуть Дан Куан Хоанг Зя"
 VIN_deploy_the_dan_quan_hoang_gia_desc:0 "Создание ополчения под непосредственным командованием Кыонг Де облегчит подавление подрывных элементов и воодушевит население."
 VIN_the_new_mandarin_system:0 "Новая система мандаринов"
 VIN_reform_the_royal_administration:0 "Реформировать королевскую администрацию"
 VIN_reform_the_royal_administration_desc:0 "Мы должны модернизировать королевскую администрацию по образцу Японии эпохи Мэйдзи. В частности, необходимо укрепить власть императора."
 VIN_the_lone_dragon:0 "Одинокий дракон"
 VIN_the_lone_dragon_desc:0 "Несмотря на всю помощь [JAP.GetNameDef] в обретении независимости, сотрудничество между странами невозможно, и [VIN.GetNameDef] должна проложить собственный путь."
 VIN_the_greater_vietnam_concept:0 "Концепция Великого Вьетнама"
 VIN_the_greater_vietnam_concept_desc:0 "Для выживания вьетнамского народа необходимо расширить границы, включив весь Индокитайский полуостров. Кроме того, множество вьетнамцев уже живёт в Лаосе и Камбодже."
 VIN_cross_the_cangshan_desc:0 "Наступление на [CHI.GetNameDef] через горы Юньнани застанет её врасплох, особенно если наши солдаты будут гораздо лучше подготовлены к такой местности."
 VIN_cross_the_cangshan:0 "Перейти Цаншань"
 VIN_cross_the_cangshan_tt:0 "Открывает §Hгорную войну§!\nВся пехота:\n    §HГоры§!\n      Скорость перемещения: §G+10%§!\n    §HХолмы§!\n      Скорость перемещения: §G+10%§!\n\n§HМорская пехота\n    Горы§!\n      Атака: §G+5%§!\n    §HХолмы§!\n      Атака: §G+5%§!\n      \n§HГорная пехота\n    Горы§!\n      Атака: §G+5%§!\n    §HХолмы§!\n      Атака: §G+5%§!\n      \n§HВоздушно-десантные войска\n    Горы§!\n      Атака: §G+5%§!\n    §HХолмы§!\n      Атака: §G+5%§!\n"
 VIN_trade_with_the_reorganised_government:0 "Торговля с [CHI.GetNameDef]"
 VIN_trade_with_the_reorganised_government_desc:0 "Новое правительство [CHI.GetNameDef], созданное при поддержке [JAP.GetNameDef], предоставляет прекрасную возможность для сотрудничества между нашими давно близкими странами. Мы подпишем с ним торговое соглашение."
 VIN_rule_the_thais:0 "Подчинить тайцев"
 VIN_rule_the_thais_desc:0 "[SIA.GetNameDefCap] угрожает [VIN.GetAdjective] господству в Индокитае из-за языковой и культурной близости с народами Лаоса и кхмерами. Она вполне может попытаться вернуть их, когда мы меньше всего этого ожидаем."
 VIN_total_economic_mobilization:0 "Полная экономическая мобилизация"
 VIN_total_economic_mobilization_desc:0 "Ради [VIN.GetNameDef], когда конфликты всё ближе, каждый житель должен приложить все силы для поддержки военной экономики. Нормирование, пропаганда работы в военной промышленности — необходимо сделать всё для выживания [VIN.GetNameDef]."
 VIN_establish_the_national_army_of_vietnam:0 "Создать Национальную армию Вьетнама"
 VIN_establish_the_national_army_of_vietnam_desc:0 "Наши независимые силы состояли главным образом из ополчения, поэтому чёткая иерархия почти отсутствовала. После восстановления независимости пришло время создать настоящую армию для защиты страны."
 VIN_create_the_hanoi_military_college:0 "Создать Ханойский военный колледж"
 VIN_create_the_hanoi_military_college_desc:0 "Нам отчаянно не хватает офицеров, обученных современному бою. Военная школа в Ханое позволит подготовить новое поколение и пополнить ряды опытными кадрами."
 VIN_national_defense_academy_of_vietnam:0 "Национальная академия обороны Вьетнама"
 VIN_national_defense_academy_of_vietnam_desc:0 "Одним из первых шагов к созданию настоящей армии является открытие военных учебных заведений, способных готовить будущих командиров. Первый военный колледж Вьетнама будет создан в Ханое."
 VIN_new_rifles_for_a_new_army:0 "Новые винтовки для новой армии"
 VIN_new_rifles_for_a_new_army_desc:0 "Большая часть нашего военного снаряжения либо импортирована от союзников, либо захвачена у французских солдат. Первым шагом к самостоятельности вооружённых сил в оснащении станет модернизация стрелкового оружия."
 VIN_group_559:0 "Группа 559"
 VIN_group_559_desc:0 "Известно, что вьетнамская территория крайне неудобна для снабжения солдат во время боя. Создание специальных транспортных подразделений облегчит доставку припасов войскам."
 VIN_improve_inter_armies_communication:0 "Улучшить связь между армиями"
 VIN_improve_inter_armies_communication_desc:0 "Связь между изолированными дивизиями, расположенными в разных регионах, может быть затруднена. Развитие радиооборудования поможет решить эту проблему."
 VIN_national_defense_institute_of_sciences:0 "Национальный институт оборонных наук"
 VIN_national_defense_institute_of_sciences_desc:0 "Технологическое превосходство является важнейшей составляющей победы. Расширение технической базы, посвящённой вооружениям, облегчит работу исследователей."
 VIN_the_joker_strategy:0 "Стратегия джокера"
 VIN_the_rock_paper_scissor_strategy:0 "Стратегия «Камень, ножницы, бумага»"
 VIN_the_rock_paper_scissors_strategy:0 "Стратегия «Камень, ножницы, бумага»"
 VIN_the_rock_paper_scissors_strategy_desc:0 "Стратегия «Камень, ножницы, бумага» — военная программа, основанная на развитии специальных войск для каждой среды. Например, горные части будут защищать северные горы, а морская пехота — действовать вдоль Красной реки."
 VIN_make_the_mountains_tremble:0 "Заставить горы содрогнуться"
 VIN_make_the_mountains_tremble_desc:0 "Артиллерия наиболее эффективна на равнинной местности, например на северо-востоке. В случае конфликта с владельцем Гуанси мы сможем остановить продвижение его войск ливнем снарядов."
 VIN_invite_foreign_instructors:0 "Пригласить иностранных инструкторов"
 VIN_invite_foreign_instructors_desc:0 "Наша армия всё ещё очень молода и отстаёт как в тактике, так и в организации. Мы могли бы попросить союзников направить военных инструкторов для подготовки наших солдат."
 VIN_forest_expertise:0 "Опыт ведения боёв в лесах"
 VIN_forest_expertise_desc:0 "Бои в лесу могут дать огромное преимущество тем, кто хорошо знаком с такой местностью. Северные леса станут отличным полигоном на случай отступления или столкновения с противником в схожих условиях."
 VIN_motorise_the_army:0 "Моторизовать армию"
 VIN_anti_tank_development:0 "Развитие противотанкового вооружения"
 VIN_anti_tank_development_desc:0 "Хотя местность уже крайне неблагоприятна для тяжёлой техники, захватчики всё же могут применить танки. Мы начнём разработку орудий, специально предназначенных для пробития их брони."
 VIN_fast_and_powerful:0 "Быстрые и мощные"
 VIN_fast_and_powerful_desc:0 "Специально созданные скоростные дивизии будут полезны при боях на обширных равнинах, например на юге страны."
 VIN_tanks_experimentation:0 "Эксперименты с танками"
 VIN_tanks_experimentation_desc:0 "Танки могут оказаться грозным оружием на равнинной местности, где риск поломок ниже, чем на большей части нашей страны и всего Индокитайского полуострова. Поэтому стоит начать исследовательские проекты по созданию собственных моделей."
 VIN_new_entrenchment_tactics:0 "Новая тактика укрепления"
 VIN_new_entrenchment_tactics_desc:0 "Многочисленные поля Индокитая идеально подходят для окопной обороны, и этим следует воспользоваться. Добавление инженерных рот в дивизии позволит быстро возводить укрепления."
 VIN_forts_and_guerrilla:0 "Форты и партизаны"
 VIN_forts_and_guerrilla_desc:0 "Несмотря на все преимущества местности — горы и леса, — лучший способ защитить ключевые точки, особенно города и равнины, заключается в строительстве укреплений."
 VIN_establish_the_vietnamese_national_navy:0 "Создать [VIN.GetAdjective] национальный флот"
 VIN_establish_the_vietnamese_national_navy_desc:0 "Наша морская инфраструктура достаточна для торговли, но слишком слаба для защиты побережья. Необходимо начать масштабную модернизацию флота, чтобы обеспечить контроль над Южно-Китайским морем."
 VIN_create_the_national_railway_administration:0 "Создать Национальное управление железных дорог"
 VIN_create_the_national_railway_administration_desc:0 "Вьетнамскую инфраструктуру, в основном построенную французами, можно развить дальше, лучше связав сельские районы. Государственная компания по управлению инфраструктурой позволит осуществить этот проект."
 VIN_reopen_former_french_factories:0 "Вновь открыть бывшие французские заводы"
 VIN_nationalize_french_businesses:0 "Вновь открыть французские предприятия"
 VIN_nationalize_french_businesses_desc:0 "После ухода французов многие предприятия остались заброшенными. Национализировав и вновь открыв их при финансовой поддержке государства, мы сможем использовать их для развития страны."
 VIN_national_industrial_research_agency:0 "Национальное агентство промышленных исследований"
 VIN_vietnamese_industrial_advancement_agency:0 "Агентство промышленного развития Вьетнама"
 VIN_cqtbcnqg:0 "Co Quan Tien Bo Cong Nghiep Quoc Gia"
 VIN_cqtbcnqg_desc:0 "Co Quan Tien Bo Cong Nghiep Quoc Gia, то есть Национальное агентство промышленного развития, будет заниматься индустриализацией [VIN.GetNameDef] и распространением промышленности по всей стране."
 VIN_the_flying_dragon_theory:0 "Теория летящего дракона"
 VIN_the_flying_dragon_theory_desc:0 "Теория летящего дракона основана на простом наблюдении. Свободный поток иностранных инвестиций, словно свободно летящий дракон, при частичном государственном контроле для предотвращения новой колониальной зависимости станет лучшей стратегией для [VIN.GetNameDef]. Наш богатый ресурсами регион неизбежно привлечёт тех, кто ищет новые возможности для вложений."
 VIN_the_roaring_dragon_theory:0 "Теория рычащего дракона"
 VIN_the_roaring_dragon_theory_desc:0 "Теория Ревущего Дракона является экономической теорией, поддерживающей идею о том, что [VIN.GetNameDef] Для достижения уровня экономического развития, близкого к уровню европейских промышленно развитых стран, последние должны сосредоточиться на совершенной координации сельскохозяйственных и промышленных секторов. Благодаря нашей самодостаточности, это дает [VIN.GetNameDef] Финансовая независимость, сопровождаемая стабильностью."
 VIN_habeco_investments:0 "Инвестиции в Habeco"
 VIN_habeco_investments_desc:0 "Habeco — одна из старейших пивоваренных компаний страны со штаб-квартирой в Ханое. После обретения независимости она стала одним из ведущих экспортёров. При таких успехах иностранный капитал позволит компании расшириться по всей [VIN.GetNameDef]."
 VIN_the_new_agriculture_program:0 "Новая сельскохозяйственная программа"
 VIN_the_new_agriculture_program_desc:0 "Новая сельскохозяйственная программа представляет собой ряд государственных инвестиций, позволяющих многочисленным фермерам [VIN.GetNameDef] приобретать современную технику, например тракторы, для облегчения уборки урожая."
 VIN_vietnam_national_university:0 "Национальный университет Вьетнама"
 VIN_vietnam_national_university_desc:0 "Неграмотность остаётся серьёзной проблемой в [VIN.GetNameDef], и её решение потребует времени. Открытие множества сельских школ и университета в Ханое для подготовки как можно большего числа специалистов станет шагом в правильном направлении."
 VIN_petrolimex:0 "Petrolimex"
 VIN_petrolimex_desc:0 "В нефтяном секторе появилась [VIN.GetAdjective] компания Petrolimex. Развитие нефтяной промышленности в [VIN.GetNameDef] может быть крайне прибыльным, поскольку спрос на этот ресурс постоянно растёт."
 VIN_expand_the_coal_mines:0 "Расширить угольные шахты"
 VIN_expand_the_coal_mines_desc:0 "Наши планы промышленного развития потребуют большого количества энергии. Недра страны богаты углём, который можно использовать для выработки всей необходимой электроэнергии."
 VIN_educate_the_peasants:0 "Обучать крестьян"
 VIN_educate_the_peasants_desc:0 "Крестьянство сильнее других классов страдает от неграмотности. Это необходимо исправить, улучшив связь деревень со школьной системой и обеспечив доступность школы для каждого села."
 VIN_expand_urban_schools:0 "Расширить городские школы"
 VIN_expand_urban_schools_desc:0 "Проблему неграмотности в [VIN.GetNameDef] необходимо решать быстро. Расширение городских школ покажет заботу о будущих интеллектуалах и побудит сельское население искать лучшую жизнь в городах благодаря доступу к превосходному образованию."
 VIN_bidv:0 "Банк инвестиций и развития"
 VIN_bidv_desc:0 "Создание государственного банка позволит лучше управлять денежными потоками в [VIN.GetNameDef], что необходимо для экономического развития."
 VIN_building_the_futur:0 "Строительство будущего"
 VIN_building_the_futur_desc:0 "Теперь можно начать проект промышленного расширения. С помощью целевых строительных программ, сосредоточенных главным образом на общественных работах и цементных заводах, мы сделаем первый шаг к полной индустриализации [VIN.GetNameDef]."
 VIN_building_the_future:0 "Первый этап промышленного плана"
 VIN_building_the_future_desc:0 "Теперь можно начать проект промышленного расширения. С помощью целевых строительных программ, сосредоточенных главным образом на общественных работах и цементных заводах, мы сделаем первый шаг к полной индустриализации [VIN.GetNameDef]."
 VIN_create_the_hanoi_arsenal:0 "Создать Ханойский арсенал"
 VIN_create_the_hanoi_arsenal_desc:0 "Дальнейшее промышленное развитие должно затронуть производство военного снаряжения, необходимого для выживания [VIN.GetNameDef]. В Ханое будет открыт военный завод, главным образом для выпуска стрелкового оружия."
 VIN_expand_the_mekong_dams:0 "Расширить плотины на Меконге"
 VIN_expand_the_mekong_dams_desc:0 "Несмотря на существующие плотины на Меконге, производство гидроэлектроэнергии остаётся недостаточным. Расширение позволит создать полноценную гидроэнергетическую отрасль."
 VIN_begin_the_second_phase_of_the_industrial_plan:0 "Второй этап промышленного плана"
 VIN_begin_the_second_phase_of_the_industrial_plan_desc:0 "Теперь, когда промышленная база заложена, пора начать второй этап программы расширения, чтобы со временем развить [VIN.GetNameDef] целиком и привести её в новую экономическую эпоху."
 VIN_expand_aviation_production:0 "Расширить авиационное производство"
 VIN_expand_aviation_production_desc:0 "Наши возможности военного производства всё ещё сравнительно малы, не говоря уже о выпуске самолётов. Разумное использование государственных средств позволит значительно расширить авиационные заводы."
 VIN_reinvest_profits_in_cement_production:0 "Реинвестировать прибыль в производство цемента"
 VIN_reinvest_profits_in_military_production:0 "Реинвестировать прибыль в военное производство"
 VIN_reinvest_profits_in_military_production_desc:0 "Необходимо направить значительную часть прибыли от многочисленных инвестиций на строительство военного арсенала, чтобы обеспечить оборону страны."
 VIN_the_commercial_pearl_of_asia:0 "Торговая жемчужина Азии"
 VIN_the_commercial_pearl_of_asia_desc:0 "Благодаря богатым ресурсам и благоприятной для инвестиций политике правительства [VIN.GetNameDef] стала символом стабильности и торговых возможностей в Азии. Мы вполне можем объявить себя самой процветающей страной Юго-Восточной Азии."
 VIN_build_the_nha_trang_dockyards:0 "Построить верфи Нячанга"
 VIN_build_the_nha_trang_dockyards_desc:0 "С момента создания военно-морской ветви армии правительство рассматривало проекты судостроения в Нячанге. Пришло время воплотить их."
 VIN_establish_the_naval_staff:0 "Создать штаб флота"
 VIN_establish_the_naval_staff_desc:0 "Теперь, когда развитие флота началось, пора создать военный штаб, отвечающий за военно-морские силы."
 VIN_the_tiger_of_the_seas:0 "Тигр морей"
 VIN_the_tiger_of_the_seas_desc:0 "Положение на перекрёстке Юго-Восточной Азии и Дальнего Востока делает нас идеальной базой для ударов по торговле. Приоритетом должно стать развитие средств нападения на конвои, прежде всего подводных лодок."
 VIN_protecting_the_pearl:0 "Защитить жемчужину"
 VIN_protecting_the_pearl_desc:0 "Господство врага в Южно-Китайском море может стать для нас смертельным из-за сильной зависимости от внешней торговли и ресурсов для промышленности. Приоритетом должно стать создание крупного флота для защиты конвоев."
 VIN_the_fast_and_the_discreet:0 "Быстрые и незаметные"
 VIN_the_fast_and_the_discreet_desc:0 "Вражеские подводные лодки могут потопить корабль мгновенно, не оставив возможности ответить. Поэтому мы начнём разработку эсминцев, специализирующихся на противолодочной борьбе."
 VIN_defeating_the_underwater_warfare:0 "Победить подводную войну"
 VIN_defeating_the_underwater_warfare_desc:0 "Вражеские подводные лодки могут потопить корабль мгновенно, не оставив возможности ответить. Поэтому мы начнём разработку эсминцев, специализирующихся на противолодочной борьбе."
 VIN_light_cruisers_and_heavy_damage:0 "Лёгкие крейсеры и тяжёлый урон"
 VIN_light_cruisers_and_heavy_damages:0 "Лёгкие крейсеры и тяжёлый урон"
 VIN_light_cruisers_and_heavy_damages_desc:0 "Тяжёлые или лёгкие, крейсеры всегда станут отличным дополнением к любому флоту. При слабом вооружении они пригодятся для разведки, а при более мощном смогут наносить тяжёлый урон — с крейсерами трудно ошибиться."
 VIN_chien_binh_bien:0 "Тьен Бинь Бьен"
 VIN_chien_binh_bien_desc:0 "Тьен Бинь Бьен, то есть морские воины, станут подразделением специальных сил, специализирующимся на морских десантах."
 VIN_form_the_national_air_force_of_vietnam:0 "Создать Национальные военно-воздушные силы Вьетнама"
 VIN_form_the_national_air_force_of_vietnam_desc:0 "Даже преданных сухопутных войск недостаточно для защиты неба. Необходимо создать отдельную авиационную ветвь армии, чтобы леса Вьетнама не оказались под бомбами."
 VIN_convert_civilian_planes:0 "Переоборудовать гражданские самолёты"
 VIN_convert_civilian_planes_desc:0 "При достаточной модернизации транспортные самолёты вполне можно превратить в истребители."
 VIN_establish_the_air_force_research_committee:0 "Создать исследовательский комитет ВВС"
 VIN_establish_the_air_force_research_committee_desc:0 "При Генеральном штабе будет создан Исследовательский комитет ВВС для изучения воздушной войны. Это значительно улучшит нашу подготовку."
 VIN_develop_new_fighters:0 "Разработать новые истребители"
 VIN_develop_new_fighters_desc:0 "Одним из первых шагов модернизации ВВС станет разработка истребителей, необходимых для поддержания определённого превосходства в воздухе и последующего полного господства."
 VIN_troops_destruction:0 "Уничтожение войск"
 VIN_troops_destruction_desc:0 "Лучший способ использовать превосходство в воздухе — бомбить вражеские дивизии специализированными самолётами, нанося максимальный урон войскам и облегчая наше продвижение."
 VIN_buildings_destruction:0 "Уничтожение зданий"
 VIN_buildings_destruction_desc:0 "Лучший способ использовать превосходство в воздухе — бомбить вражеские здания и инфраструктуру, лишая противника возможности производить снаряжение и снабжать армию."
 VIN_ships_destruction:0 "Уничтожение кораблей"
 VIN_ships_destruction_desc:0 "Испытания бомбардировок оказались более чем успешными и, вероятно, будут столь же эффективны против кораблей. Помимо флота, мы получим целую эскадрилью самолётов для защиты своих вод."
 VIN_the_shining_dragon:0 "Сияющий дракон"
 VIN_the_shining_dragon_desc:0 "Среди тьмы и безудержной тирании Азии [VIN.GetNameDef] выступает маяком личной свободы и уважения к демократии."
 VIN_expand_automobile_production:0 "Расширить автомобильное производство"
 VIN_expand_automobile_production_desc:0 "Автомобильная промышленность имеет большие перспективы, а благодаря собственному производству каучука инвестиции в этот сектор могут оказаться крайне прибыльными."
