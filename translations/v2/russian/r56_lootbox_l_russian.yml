l_russian:
 r56.startup.event.04.title:0 "/// ЗАШИФРОВАННОЕ СООБЩЕНИЕ ///"
 r56.startup.event.04.description:0 "Здравствуйте, [Root.GetLeader]. Мы — «Лутбокс-эмпориум Альфи» и хотим предложить вам свои услуги. Мы специализируемся на лутбоксах с множеством бонусов, которые, по нашему мнению, будут полезны стране, которой вы служите. Да, они стоят денег, но разве выгоды не перевесят те жалкие очки политической власти, которые придётся потратить? В знак благодарности вы получите один лутбокс бесплатно, если согласитесь на предложение! С нетерпением ждём ответа."
 r56.startup.event.04.option.a:0 "Мы согласны."
 r56.startup.event.04.option.a_tt:0 "«Лутбокс-эмпориум Альфи» откроется и начнёт предлагать услуги лутбоксов с различными бонусами! Обратите внимание: ИИ не использует эту систему.\n\nВы также можете включить Эмпориум в меню §YПользовательских правил игры§!\n\n§RКоманда The Road to 56 не прославляет и не поддерживает азартные игры или большие траты на цифровые товары. Эта функция создана исключительно как пародия.§!"
 r56.startup.event.04.option.b:0 "Звучит возмутительно! Нет!"
 r56.startup.event.04.option.b_tt:0 "«Лутбокс-эмпориум Альфи» останется закрытым, а игра продолжится как обычно.\n\nВы также можете включить Эмпориум в меню §YПользовательских правил игры§!"
 r56_decision_category_lootbox:0 "Лутбокс-эмпориум Альфи"
 r56_decision_category_lootbox_desc:0 "Мегакорпорация «Лутбокс-эмпориум Альфи» к вашим услугам! Получайте лутбоксы, покупая их за политическую власть. В лутбоксах есть всё, чего может пожелать такой лидер страны, как вы! Мы не несём ответственности за ущерб вашему личному счёту политической власти.\n\nУ вас [?Root.r56_lootbox_amount|0H] лутбокс(ов)."
 r56_decision_lootbox_acquirebox:0 "Купить лутбокс"
 r56_tooltip_lootbox_acquirebox:0 "Самолёт прибудет и сбросит готовый к открытию лутбокс. Добавляет §Y1§! лутбокс к общему числу.\n"
 r56_decision_lootbox_openbox:0 "Открыть лутбокс"
 r56_tooltip_lootbox_openbox:0 "Открывает лутбокс! Что худшего может случиться? Удаляет §Y1§! лутбокс из общего числа.\n\n§YШансы выпадения:§!\n§GОБЫЧНЫЙ§! 50%\n§BРЕДКИЙ§! 25%\n§0ЭПИЧЕСКИЙ§! 15%\n§OЛЕГЕНДАРНЫЙ§! 8%\n§RМИФИЧЕСКИЙ§! 2%"
 r56_tooltip_mythical:0 "Счастье: §G+100§!.\n"
 r56_tooltip_haunted_vase:0 "ОНА ЛЕТИТ И ПРЯМО НА МЕНЯ!!! А-А-А!! ПОМО- *БЗЗТ*\n"
 r56_tooltip_lootbox_event4:0 "Добавляет §Y2§! лутбокса к общему числу."
 r56_tooltip_lootbox_event15:0 "§RУ Центральных держав из другой вселенной будет больше шансов победить в Великой войне.§!"
 skeletons_blessing:0 "Благословение Альфи"
 skeletons_blessing_desc:0 "§LВысшая честь, которой Эмпориум может удостоить человека!§!"
 r56_lootbox_factory_output_idea:0 "ЛЕГЕНДАРНАЯ производительность фабрик"
 r56_lootbox_factory_output_idea_desc:0 "Магические силы этой награды ускоряют все ваши фабрики совершенно бесплатно! Чистая косметика!"
 r56_lootbox_war_prep_idea:0 "ЛЕГЕНДАРНЫЙ набор подготовки к войне"
 r56_lootbox_war_prep_idea_desc:0 "Будьте готовы как никогда благодаря этому удобному набору! Совершенно косметические бонусы!"
 r56_lootbox_research_speed_idea:0 "ЛЕГЕНДАРНАЯ скорость исследований"
 r56_lootbox_research_speed_idea_desc:0 "Исследуйте эти косметические бонусы!"
 r56.lootbox.event.title:0 "/// ВЫ РАСПАКОВАЛИ ///"
 r56.lootbox.event.option.common:0 "Подкручено!"
 r56.lootbox.event.option.rare:0 "Лучше, чем ничего."
 r56.lootbox.event.option.epic:0 "Неплохо."
 r56.lootbox.event.option.legendary:0 "Ого!"
 r56.lootbox.event.option.mythical:0 "Невероятно!"
 r56.lootbox.event.1.description:0 "§GОБЫЧНЫЙ§! Возврат политической власти \n\n\"О. Я думал, мы это убрали. Нельзя же быть слишком дружелюбными к покупателю, понимаете?\""
 r56.lootbox.event.2.description:0 "§GОБЫЧНЫЙ§! Иллюзия стабильности \n\n\"Будьте благодарны. Устройства контроля разума стоят недёшево.\""
 r56.lootbox.event.3.description:0 "§GОБЫЧНЫЙ§! Мегафон военной поддержки \n\n\"Используйте его, чтобы вещать свою абсолютно легитимную риторику!\""
 r56.lootbox.event.4.description:0 "§GОБЫЧНЫЙ§! Коробки в коробках \n\n\"Размеры наших коробок находятся за пределами понимания.\""
 r56.lootbox.event.5.description:0 "§GОБЫЧНЫЙ§! Воздух для дыхания \n\n\"Эй! Кислород! Для жизни и всё такое — полезная штука.\""
 r56.lootbox.event.6.description:0 "§GОБЫЧНЫЙ§! Простуда \n\n\"Может, вам стоит сходить к врачу?\""
 r56.lootbox.event.7.description:0 "§GОБЫЧНЫЙ§! Пробка \n\n\"Пора бы вложиться в инфраструктуру?\""
 r56.lootbox.event.8.description:0 "§GОБЫЧНЫЙ§! Игровая зависимость \n\n\"Или по-крупному, или домой, как говорится...\""
 r56.lootbox.event.9.description:0 "§BРЕДКИЙ§! Призывники \n\n\"Разве эти коробки не обман? Нет, они полны призывников!\""
 r56.lootbox.event.10.description:0 "§BРЕДКИЙ§! Чертежи армейской подготовки \n\n\"У нас есть технологически продвинутые строительные чертежи из будущего, так что используйте их для подготовки армии или чего-нибудь такого.\""
 r56.lootbox.event.11.description:0 "§BРЕДКИЙ§! Чертежи авиационной подготовки \n\n\"У нас есть технологически продвинутые строительные чертежи из будущего, так что используйте их для подготовки ВВС или чего-нибудь такого.\""
 r56.lootbox.event.12.description:0 "§BРЕДКИЙ§! Чертежи военно-морской подготовки \n\n\"У нас есть технологически продвинутые строительные чертежи из будущего, так что используйте их для подготовки флота или чего-нибудь такого.\""
 r56.lootbox.event.13.description:0 "§BРЕДКИЙ§! Набор для создания сада Энтони Идена \n\n\"Набор для создания сада Энтони Идена — революционная машина, предназначенная для преобразования земли и повышения её пригодности для жизни людей. Устройство создано британским политиком Энтони Иденом (при помощи его садовника) и всё ещё остаётся экспериментальным. Возможно, оно поможет развеять мальтузианскую паранойю империалистических держав, стремящихся к автаркической самодостаточности.\""
 r56.lootbox.event.14.description:0 "§BРЕДКИЙ§! Эфирная производственная линия \n\n\"Эмпориум недавно заключил спонсорское соглашение с колдовством.\""
 r56.lootbox.event.15.description:0 "§BРЕДКИЙ§! Временная аномалия \n\n\"Похоже, она ведёт в арсенал, полный оружия времён Великой войны. Физики предполагают, что он может быть не из прошлого, а из другой вселенной. Поэтому разграбление этого места, полного британского оружия, вероятно, повлияет не на нашу временную линию, а на другую вселенную.\""
 r56.lootbox.event.16.description:0 "§BРЕДКИЙ§! Багровый телефон \n\n\"Эмпориум нашёл склад, полный багровых телефонов, так что мы отдадим их вам. Позвоните кому-нибудь!\""
 r56.lootbox.event.17.description:0 "§0ЭПИЧЕСКИЙ§! Гражданская фабрика \n\n\"Эмпориум спонсирует страну гражданской фабрикой.\""
 r56.lootbox.event.18.description:0 "§0ЭПИЧЕСКИЙ§! Военный завод \n\n\"Эмпориум спонсирует страну военным заводом.\""
 r56.lootbox.event.19.description:0 "§0ЭПИЧЕСКИЙ§! Топливное хранилище \n\n\"Эмпориум спонсирует страну топливным хранилищем.\""
 r56.lootbox.event.20.description:0 "§0ЭПИЧЕСКИЙ§! Завод синтетического топлива \n\n\"Эмпориум спонсирует страну заводом синтетического топлива.\""
 r56.lootbox.event.21.description:0 "§0ЭПИЧЕСКИЙ§! Сталелитейный завод \n\n\"Эмпориум спонсирует страну сталелитейным заводом.\""
 r56.lootbox.event.22.description:0 "§0ЭПИЧЕСКИЙ§! Алюминиевый завод \n\n\"Эмпориум спонсирует страну алюминиевым заводом.\""
 r56.lootbox.event.23.description:0 "§0ЭПИЧЕСКИЙ§! Завод синтетического каучука \n\n\"Эмпориум спонсирует страну заводом синтетического каучука.\""
 r56.lootbox.event.24.description:0 "§OЛЕГЕНДАРНЫЙ§! Производительность фабрик \n\n\"Великий Альфи захватил контроль над вашей логистикой.\""
 r56.lootbox.event.25.description:0 "§OЛЕГЕНДАРНЫЙ§! Скорость исследований \n\n\"Видите ли, всё, что нужно, — это разогнать систему.\""
 r56.lootbox.event.26.description:0 "§OЛЕГЕНДАРНЫЙ§! Набор подготовки к войне \n\n\"Мы в Эмпориуме прекрасно видим, что вам нужна рука помощи.\""
 r56.lootbox.event.27.description:0 "§OЛЕГЕНДАРНЫЙ§! Одержимая ваза \n\n\"Забыли, что после прошлого раза у нас на складе осталась одна из этих одержимых ваз. Не задавайте вопросов.\""
 r56.lootbox.event.28.description:0 "§RМИФИЧЕСКИЙ§! Гордость и достижение \n\n\"Иногда нужно просто отойти на шаг и отпраздновать!\""
 r56.lootbox.event.29.description:0 "§RМИФИЧЕСКИЙ§! Ядерная авария \n\n\"В процессе открытия этой коробки ни одна территория не была заражена.\""
 r56.lootbox.event.30.description:0 "§RМИФИЧЕСКИЙ§! Захват Альфи \n\n\"Прямое правление Эмпориума.\""
