 SWE_unify_scandinavia:0 "Объединить Скандинавию"
 SWE_unify_scandinavia_desc:0 "Наконец три брата вновь объединились под одним знаменем. Пришло время снова гордо встать — не как три страны, а как единое целое!"
 SWE_unify_the_nordics:0 "Объединить Северные страны"
 SWE_unify_the_nordics_desc:0 "Наконец произошло то, что можно считать единственно логичным. Четвёртый брат присоединился к нам, а вместе с Финляндией мы станем ещё сильнее!"
