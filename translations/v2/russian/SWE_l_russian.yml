 r56_SWE_lynx_armored_car_tt:0 "Открывает §Yбронеавтомобиль «Линкс»§!, который даёт: \n§YБронеавтомобиль§! и §Y$armored_car_recon$§!:\n Атака по бронированным целям: §G+10%§!\n Бронебойность: §G+10%§! \n Организация: §G+6§!\n\n§YБронеавтомобиль§!:\n§YЛес:§!\n Изменение эффективности передвижения: §G+10%§!\n Изменение эффективности атаки: §G+10%§! \n§YПустыня:§!\n  Изменение эффективности передвижения: §G+10%§!\n  Изменение эффективности атаки: §G+10%§!\n§YСнег:§!\n Изменение эффективности передвижения: §G+10%§!\n Изменение эффективности атаки: §G+10%§!"
