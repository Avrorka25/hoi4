 SWE_swedish_disarmament_idea:0 "Шведское разоружение"
 SWE_swedish_disarmament_idea_desc:0 "После Великой войны военный бюджет был серьёзно сокращён, поскольку считалось, что крупная постоянная армия больше не нужна. Освободившиеся средства направили на борьбу с Великой депрессией и общественные работы. Однако теперь, когда на горизонте назревает война, возможно, пришло время вновь пересмотреть военные расходы."
 SWE_swedish_disarmament_1_idea:0 "Начальное перевооружение"
 SWE_nationalist_military_garrisons:0 "Националистические военные гарнизоны"
 SWE_nationalist_military_garrisons_desc:0 "Хотя большинство военных гарнизонов Швеции было расформировано, фашистское влияние всё ещё сохраняется в этих районах. Значительная часть военных также желает, чтобы король взял власть в свои руки, либо чтобы появился человек, готовый на всё ради противостояния коммунистам."
