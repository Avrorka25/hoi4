 SWE_norwegian_danish_resistance_stage_3:0 "[ROOT.GetAdjective] Бойцы Сопротивления"
 SWE_armed_neutrality:0 "Вооружённый нейтралитет"
 SWE_armed_neutrality_desc:0 "Провозглашение нейтралитета, как мы надеемся, позволит сохранить его. Однако некоторые страны всё равно могут попытаться напасть, поэтому необходимо принять соответствующие меры.\n\n§RЭтот национальный дух будет удалён после вступления в альянс!§!"
 SWE_factory_subsidies_idea:0 "Субсидии фабрикам"
 SWE_dockyard_subsidies_idea:0 "Субсидии верфям"
 SWE_baltic_sea_hegemon:0 "Гегемон Балтийского моря"
 sweden_winter_war.1.t:0 "Швеция предлагает уступки"
 sweden_winter_war.1.d:0 "Шведские дипломаты через Германию передали нам предложение уступить Готланд в обмен на прекращение боевых действий. Похоже, они не ожидали, что финны столь быстро согласятся передать территории, и теперь желают вернуться к мирному положению, существовавшему до войны."
 sweden_winter_war.1.a:0 "Хорошо. Готланд станет нашим."
 sweden_winter_war.1.b:0 "Нет. Они начали эту войну, а мы её закончим."
 sweden_winter_war.2.t:0 "Советы отвергли наше мирное предложение"
 sweden_winter_war.2.d:0 "Сославшись на агрессивную реакцию Швеции на советско-финскую войну, Советский Союз отказался принять Готланд в обмен на мир. Теперь нам необходимо приготовиться к надвигающемуся удару советской военной машины."
 sweden_winter_war.2.a:0 "Что же мы наделали..."
 SWE_agree_peace:0 "Швеция согласится уступить §YГотланд§! в обмен на мир!"
 SWE_abandon_neutrality:0 "Отказаться от нейтралитета"
 SWE_abandon_neutrality_desc:0 "Стало ясно, что XX век не будет спокойным. Нельзя оставаться неподвижной мишенью, ожидающей выстрела охотника. Чтобы Швеция выжила, мы должны действовать первыми."
 SWE_sven_olov_addresses_aland_convention:0 "Свен-Улов выступает по вопросу Аландской конвенции"
 SWE_sven_olov_addresses_aland_convention_desc:0 "Сегодня Свен-Улов Линдхольм выступил с речью об Аландской конвенции 1921 года. Согласно этому соглашению, Аландские острова должны оставаться за Финляндией, хотя признаётся, что почти 90% их тогдашнего населения составляли шведы. Учитывая нынешнее состояние мира, следует отказаться от конвенции ради защиты живущих на Аландах шведов."
 SWE_demand_aland:0 "Потребовать Аландские острова"
 SWE_demand_aland_desc:0 "Финны оказались между молотом и наковальней. Аландские острова — архипелаг с преимущественно шведским населением — принадлежат Финляндии. Едва ли они смогут одновременно противостоять русским и нам из-за небольшого архипелага..."
 SWE_swedish_brownshirts:0 "Шведские коричневорубашечники"
 SWE_swedish_brownshirts_desc:0 "Недавние действия по аландскому вопросу воодушевили NSAP. Поддержка партии среди населения и, что тревожнее, военных растёт. Похоже, чтобы сохранить хоть какой-то контроль, правящей партии придётся включить её в правительственную коалицию."
 SWE_stormtroopers:0 "Штурмовики"
 SWE_stormtroopers_desc:0 "Теперь, когда мы сбросили оковы демократии, для достижения целей необходимо расширить армию. Создание военизированной организации, действующей совместно с вооружёнными силами, значительно увеличит наши возможности."
 SWE_swedish_volunteers:0 "Шведские добровольцы"
 SWE_swedish_volunteers_desc:0 "По всему миру люди берутся за оружие против большевистской угрозы. Мы должны быть готовы отправлять желающих на борьбу с красной заразой."
 SWE_improve_the_stormtroops:0 "Улучшить штурмовые отряды"
 SWE_improve_the_stormtroops_desc:0 "Теперь, когда наша власть закреплена, необходимо усовершенствовать военизированные силы и даже включить их в состав регулярной армии."
 SWE_bring_finland_back:0 "Вернуть Финляндию"
 SWE_bring_finland_back_desc:0 "С тех пор как Швеция потеряла Финляндию, мы мечтали вернуть её у русских. После падения Российской империи возникла независимая Финляндия, но ради защиты молодого государства мы должны вмешаться и вновь взять её под свою опеку."
 SWE_return_to_european_scene:0 "Вернуться на европейскую арену"
 SWE_return_to_european_scene_desc:0 "Спустя почти двести лет мы готовы вернуться на европейскую арену. Швеция больше не будет молча наблюдать с севера — мы возродим славное историческое наследие."
 SWE_approach_germany:0 "Сблизиться с Германией"
 SWE_approach_germany_desc:0 "Не секрет, что собственную форму фашизма мы во многом создавали по германскому образцу. Поэтому никого не удивит, если, возвращаясь на мировую арену, мы обратимся к Германии в поисках союза."
 SWE_press_aland_claim:0 "Настаивать на притязаниях на Аландские острова"
 SWE_press_aland_claim_desc:0 "Аландские острова давно отделены от Швеции, однако местные жители говорят по-шведски и считают себя шведами. У Финляндии нет реальных прав на острова, кроме записанного на какой-то бумаге решения."
 SWE_divide_denmark:0 "Разделить Данию"
 SWE_divide_denmark_desc:0 "Исторически Дания часто была занозой в нашем боку, но нельзя отрицать, что датчане — наши северные братья. Однако времена меняются, и необходимо смотреть в будущее. Гарантировав Германии морской доступ и возвращение Шлезвига, мы заставим Данию выбрать между подчинением и аннексией."
 SWE_return_to_livonia:0 "Вернуться в Ливонию"
 SWE_return_to_livonia_desc:0 "Ливония некогда принадлежала Швеции и обладает огромной стратегической ценностью: она поможет запереть Балтийское море и начать наступление на восток. Вернув старые земли, мы сможем продвинуться вглубь России."
 SWE_march_alongside_the_british_blackshirts:0 "Маршировать вместе с британскими чернорубашечниками"
 SWE_march_alongside_the_british_blackshirts_desc:0 "Неожиданным образом британцы также сбросили оковы демократии и заняли новое место в мире. Следует воспользоваться возможностью, заключить с ними союз и обратить внимание на Центральную Европу."
 SWE_the_northern_front:0 "Северный фронт"
 SWE_the_northern_front_desc:0 "Пока Европа меняется, Швеция должна взять на себя ведущую роль. Создав собственный альянс, мы объединим страны, разделяющие цель сокрушить коммунизм и остановить бесчинства капитализма."
 SWE_legacy_of_great_northern_war:0 "Наследие Великой Северной войны"
 SWE_legacy_of_great_northern_war_desc:0 "С новыми союзниками мы можем избавиться от преследующего страну наследия. Великая Северная война положила начало упадку прежней империи, но теперь победителями станем мы."
 SWE_establish_new_protectorates:0 "Создать новые протектораты"
 SWE_establish_new_protectorates_desc:0 "Теперь, когда молодое германское государство побеждено, можно вновь разделить его и взять под контроль более... управляемые части бывшего германского орла."
 SWE_proclaim_greater_sweden:0 "Провозгласить Великую Швецию"
 SWE_proclaim_greater_sweden_desc:0 " "
 SWE_reclaim_ingermanland:0 "Вернуть Ингерманландию"
 SWE_reclaim_ingermanland_desc:0 "Ингерманландия включает земли вокруг Ленинграда, которые также некогда принадлежали Швеции. Они вновь станут шведскими."
 SWE_secure_the_government:0 "Обезопасить правительство"
 SWE_secure_the_government_desc:0 "Нельзя бездействовать, пока мир меняется вокруг нас. Если Швеция должна выйти из грядущей бури сильнее, а не слабее, необходимо действовать сейчас. Ради блага страны мы подавим политические партии, раскалывающие общество и угрожающие существованию Швеции."
 SWE_sweden_first:0 "Швеция превыше всего"
 SWE_sweden_first_desc:0 "Слишком долго мы бездействовали, пока мир менялся вокруг нас. Теперь, когда судьба Европы висит на волоске, Швеция должна восстать и напомнить континенту, на что способна."
