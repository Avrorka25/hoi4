 r56.news_event.906.t:0 "Швеция отменила Аландскую конвенцию."
 r56.news_event.906.d:0 "Аландская конвенция была подписана в 1921 году и закрепила управление одноимёнными островами за Финляндией. В качестве компенсации территория получала автономию и полностью демилитаризовалась. Решив, что соглашение больше не отвечает её интересам, крупнейшая северная страна вновь заявила права на острова. В ответ Финляндия ремилитаризовала архипелаг, а отношения между двумя странами начали стремительно ухудшаться."
 r56.news_event.906.a:0 "И всё это из-за нескольких островов."
 r56.news_event.906.b:0 "Наконец-то!"
 sweden_german_trade.1.t:0 "Наша торговля с Германией"
 sweden_german_trade.1.d:0 "Несколько лет назад мы подписали шведско-германское торговое соглашение. Однако по мере роста мировой напряжённости необходимо вновь пересмотреть договор и решить, как поступить.\n\nСледует ли сохранить нынешний курс, двигаться к самообеспеченности или расширить торговлю с немцами?"
 sweden_german_trade.1.a:0 "Интересно..."
 sweden_aland.1.t:0 "Швеция требует Аландские острова"
 sweden_aland.1.d:0 "Вчера шведское правительство, уже восстановившее свои притязания на Аландские острова, сделало следующий логичный шаг и потребовало их передачи. Представители Стокгольма справедливо отмечают, что большинство населения островов составляют шведы, однако их потеря значительно ослабит наше присутствие в Балтийском море. Впрочем, подразумеваемой альтернативой является война. Сможем ли мы пережить вторжение?"
 sweden_aland.1.a:0 "Принять требования."
 sweden_aland.1.b:0 "Аландские острова по праву наши!"
 sweden_aland.12.t:0 "Финляндия принимает требования!"
 sweden_aland.12.d:0 "Сегодня впервые с 1809 года шведский флаг заменил финские знамёна над Аландскими островами. Население встретило перемены преимущественно равнодушно, зато шведское правительство, одержавшее дипломатическую победу и получившее важнейшую военно-морскую базу в Ботническом заливе, ликует. В Финляндии царит мрачное настроение, и особенно примечательно, что, уступив острова, она сохранила на них претензии."
 sweden_aland.12.a:0 "Наконец-то!"
 sweden_aland.13.t:0 "Финны отказываются!"
 sweden_aland.13.d:0 "Финны приняли сомнительное решение рискнуть жизнями своего народа ради небольшой цепи островов. Возможно, они вновь хотят стать частью нашей страны. Какими бы ни были их мысли, война кажется неизбежной."
 sweden_aland.13.a:0 "Возмутительно!"
 sweden_aland.2.t:0 "Швеция предоставляет гарантии для Аландских островов."
 sweden_aland.2.d:0 "Сегодня в город [ROOT.Capital.GetCapitalVictoryPointName] прибыли шведские дипломаты с предложением. Мы передаём им Аландские острова, а они гарантируют помощь в случае внешнего нападения."
 sweden_aland.2.a:0 "Справедливый обмен. Мы согласны."
 sweden_aland.2.b:0 "Нет! Аландская конвенция останется в силе."
 sweden_aland.21.t:0 "Финляндия передает Аландские острова"
 sweden_aland.21.d:0 "Сегодня Аландские острова вернулись под власть Швеции после долгих лет финского и российского правления. Теперь мы обязаны защищать Финляндию в случае любого нападения."
 sweden_aland.21.a:0 "Добро пожаловать домой!"
 sweden_aland.22.t:0 "Финляндия отвергает наше предложение о помощи."
 sweden_aland.22.d:0 "Заявив, что Аландская конвенция останется в силе, финское правительство отказалось от нашей будущей военной помощи в обмен на острова."
 sweden_aland.22.a:0 "Прискорбно..."
 sweden_fascism.1.t:0 "Швеция требует подчинения"
 sweden_fascism.1.d:0 "Вчера шведское правительство публично заявило, что ради будущего процветания Дания должна подчиниться шведской власти. Требования включают независимость Исландии и шведское господство над Данией и её внешней политикой."
 sweden_fascism.1.a:0 "Принять требования."
 sweden_fascism.1.b:0 "Дания останется датской!"
 sweden_fascism.12.t:0 "Дания принимает требования!"
 sweden_fascism.12.d:0 "Сегодня славный день нашей истории: над Копенгагеном взвился шведский флаг, поскольку датчане приняли нашу власть."
 sweden_fascism.12.a:0 "Наконец-то!"
 sweden_fascism.13.t:0 "Датчане отказываются!"
 sweden_fascism.13.d:0 "Датчане приняли сомнительное решение противостоять нашей мощи. Они быстро падут под нашими сапогами."
 sweden_fascism.13.a:0 "Возмутительно!"
 sweden_auth.1.t:0 "Швеция требует аннексии"
 sweden_auth.1.d:0 "Сегодня шведский монарх потребовал восстановить шведское правление над нашей страной. Прошло почти сто лет с тех пор, как мы были разделены, в то время как в стране есть некоторые, кто хотел бы вернуться к этому, большинство борется за независимость. Однако в его требовании есть явные намеки на угрозы насилия."
 sweden_auth.1.a:0 "Принять требования."
 sweden_auth.1.b:0 "Нет! Государство [FROM.GetNameDefCap] останется независимым!"
 sweden_auth.12.t:0 "Государство [FROM.GetName] принимает требования!"
 sweden_auth.12.d:0 "Похоже, государство [FROM.GetNameDef] осознало, в каком положении оказалось. В конечном счёте ему безопаснее быть частью Швеции, чем пытаться в одиночку противостоять переменам в Европе."
 sweden_auth.12.a:0 "Наконец-то!"
 sweden_auth.13.t:0 "Государство [FROM.GetNameDefCap] отказывается!"
 sweden_auth.13.d:0 "Хотя это не стало неожиданностью, мы надеялись, что [FROM.GetAdjective]ая сторона проявит благоразумие в ответ на нашу... просьбу. Впрочем, мы ожидали отказа, поэтому теперь придётся взяться за оружие и вернуть принадлежащее нам."
 sweden_auth.13.a:0 "Этого следовало ожидать..."
 sweden_auth.2.t:0 "[FROM.GetName] Требует референдума"
 sweden_auth.2.d:0 "Сегодня утром шведский монарх Карл Густав VI выступил с публичным заявлением, призвав датский народ проголосовать за объединение со Швецией и напомнив о славных днях Кальмарской унии. В качестве жеста доброй воли он предложил провести референдум о том, желают ли датчане вновь объединиться со Швецией."
 sweden_auth.2.a:0 "Народ высказался, мы подчинимся."
 sweden_auth.2.b:0 "Нет, мы предпочитаем оставаться собой."
 sweden_auth.22.t:0 "[FROM.GetAdjective] Голосуйте за объединение."
 sweden_auth.22.d:0 "В несколько шокирующем повороте событий датский народ проголосовал за объединение Швеции, казалось, что люди стремятся быть частью более крупной нации единомышленников."
 sweden_auth.22.a:0 "Добро пожаловать домой, братья!"
 sweden_auth.23.t:0 "[FROM.GetAdjective] Отказаться от референдума."
 sweden_auth.23.d:0 "Как и ожидалось, [FROM.GetAdjective]ая сторона отказалась проводить референдум и подготовила силы на случай нашего нападения. Что ж, пришло время проверить, насколько хорошо они умеют сражаться."
 sweden_auth.23.a:0 "Ожидаемо."
 sweden_nap.1.t:0 "Государство [SWE.GetName] предлагает договор о взаимной помощи"
 sweden_nap.1.d:0 "Сегодня утром в город [ROOT.Capital.GetCapitalVictoryPointName] прибыл шведский посланник с предложением заключить договор о «взаимной помощи». По его условиям ни одна из сторон не станет развязывать конфликт против другой, а в случае нападения на одну из них вторая придёт ей на помощь."
 sweden_nap.1.a:0 "Это выгодно обеим сторонам. Подпишем договор."
 sweden_nap.1.b:0 "Мы предпочитаем не связывать себя чернилами на бумаге..."
 sweden_nap.11.t:0 "[FROM.GetName] Подписывает договор"
 sweden_nap.11.d:0 "Наши дипломаты вернулись из города [FROM.Capital.GetCapitalVictoryPointName] с приятными новостями: государство [FROM.GetNameDef] подписало предложенный договор."
 sweden_nap.11.a:0 "Прекрасно!"
 sweden_nap.12.t:0 "The [FROM.GetName] Не подписывает договор"
 sweden_nap.12.d:0 "Наши дипломаты вернулись из города [FROM.Capital.GetCapitalVictoryPointName] с неприятными новостями: [FROM.GetAdjective]ая сторона решила не подписывать договор. Возможно, в будущем стоит относиться к ней настороженно."
 sweden_nap.12.a:0 "Крайне прискорбно..."
 sweden_nap.2.t:0 "[SWE.GetName] Договор о ненападении"
 sweden_nap.2.d:0 "Сегодня утром в город [ROOT.Capital.GetCapitalVictoryPointName] прибыл шведский посланник с предложением заключить пакт о ненападении. Пока договор действует, ни одна сторона не станет развязывать конфликт против другой."
 sweden_nap.2.a:0 "Теперь наш северный фронт защищён."
 sweden_nap.2.b:0 "Мы предпочитаем не связывать себя чернилами на бумаге..."
 sweden_nap.21.t:0 "[FROM.GetName] Подписывает договор"
 sweden_nap.21.d:0 "Наши дипломаты вернулись из города [FROM.Capital.GetCapitalVictoryPointName] с приятными новостями: [FROM.GetAdjective]ая сторона подписала предложенный договор."
 sweden_nap.21.a:0 "Прекрасно!"
 sweden_nap.22.t:0 "The [FROM.GetName] Не подписывает договор"
 sweden_nap.22.d:0 "Наши дипломаты вернулись из города [FROM.Capital.GetCapitalVictoryPointName] с неприятными новостями: [FROM.GetAdjective]ая сторона решила не подписывать договор. Возможно, в будущем стоит относиться к ней настороженно."
 sweden_nap.22.a:0 "Крайне прискорбно..."
 sweden_nap.3.t:0 "[SWE.GetName] Он предлагает договор о ненападении."
 sweden_nap.3.d:0 "Сегодня утром в город [ROOT.Capital.GetCapitalVictoryPointName] прибыл шведский посланник с предложением заключить пакт о ненападении. Пока договор действует, ни одна сторона не станет развязывать конфликт против другой."
 sweden_nap.3.a:0 "Дружелюбные связи с [SWE.GetAdjective] Это было бы выгодно."
 sweden_nap.3.b:0 "У нас другие планы..."
 sweden_nap.31.t:0 "[FROM.GetName] Подписывает договор"
 sweden_nap.31.d:0 "Наши дипломаты вернулись из города [FROM.Capital.GetCapitalVictoryPointName] с приятными новостями: [FROM.GetAdjective]ая сторона подписала предложенный договор."
 sweden_nap.31.a:0 "Прекрасно!"
 sweden_nap.32.t:0 "The [FROM.GetName] Не подписывает договор"
 sweden_nap.32.d:0 "Наши дипломаты вернулись из города [FROM.Capital.GetCapitalVictoryPointName] с неприятными новостями: [FROM.GetAdjective]ая сторона решила не подписывать договор. Возможно, в будущем стоит относиться к ней настороженно."
 sweden_nap.32.a:0 "Крайне прискорбно..."
 sweden_mill_access.1.t:0 "Государство [SWE.GetNameDefCap] предлагает военный доступ"
 sweden_mill_access.1.d:0 "Сегодня утром в город [ROOT.Capital.GetCapitalVictoryPointName] прибыл шведский посланник с предложением разрешить нашим войскам проход через их территорию в обмен на обещание не предпринимать против них враждебных действий. Что ответить?"
 sweden_mill_access.1.a:0 "Это выгодно. Подпишем договор."
 sweden_mill_access.1.b:0 "Мы найдём другой способ получить доступ для войск."
 sweden_mill_access.11.t:0 "Государство [FROM.GetNameDefCap] подписывает договор"
 sweden_mill_access.11.d:0 "Наши дипломаты вернулись из города [FROM.Capital.GetCapitalVictoryPointName] с приятными новостями: государство [FROM.GetNameDef] подписало предложенный договор."
 sweden_mill_access.11.a:0 "Прекрасно!"
 sweden_mill_access.12.t:0 "Государство [FROM.GetNameDefCap] не подписывает договор"
 sweden_mill_access.12.d:0 "Наши дипломаты вернулись из города [FROM.Capital.GetCapitalVictoryPointName] с неприятными новостями: [FROM.GetAdjective]ая сторона решила не подписывать договор. Возможно, в будущем стоит относиться к ней настороженно."
 sweden_mill_access.12.a:0 "Крайне прискорбно..."
 sweden_soviet.1.t:0 "Швеция хочет присоединиться [SOV.GetFactionName]"
 sweden_soviet.1.d:0 "После того как шведские рабочие взяли будущее в свои руки, их политики стали заметно дружелюбнее к нам. Сегодня представители Швеции обратились с просьбой присоединиться к альянсу [SOV.GetFactionName]. Союзник, способный перекрыть Балтийское море, был бы полезен, но Германия может счесть это чрезмерным расширением нашего влияния и почувствовать угрозу. Что ответить?"
 sweden_soviet.1.a:0 "С их помощью революция не дрогнет!"
 sweden_soviet.1.b:0 "Они лишь обуза."
 sweden_soviet.2.t:0 "Советский Союз принял нашу просьбу."
 sweden_soviet.2.d:0 "После нескольких часов обсуждений за закрытыми дверями в Москве дипломаты наконец передали в Стокгольм хорошие новости. Советская сторона приветствует наше вступление в альянс [SOV.GetFactionName], поскольку это поможет обеим странам в осуществлении будущих интересов."
 sweden_soviet.2.a:0 "Да здравствует революция!"
 sweden_soviet.3.t:0 "Москва отклоняет нашу просьбу"
 sweden_soviet.3.d:0 "Обратившись к Советам, наши представители ожидали более тёплого ответа, но услышали, что те не намерены «приглашать в альянс [SOV.GetFactionName] подражателей Германии». Это вызвало некоторые проблемы внутри страны, но нам не впервые говорят «нет»."
 sweden_soviet.3.a:0 "Остаётся выждать подходящий момент..."
 sweden_soviet.4.t:0 "Швеция поднимает Аландский вопрос"
 sweden_soviet.4.d:0 "Сегодня рано утром в Москву прибыла телеграмма из Стокгольма, касающаяся автономных Аландских островов, находящихся под властью Финляндии. В ней отмечается их стратегическая ценность и говорится, что контроль над ними значительно укрепит и наши, и шведские позиции на Балтике. Как ответить?"
 sweden_soviet.4.a:0 "В этом есть смысл."
 sweden_soviet.4.b:0 "У нас другие планы на Аландские острова."
 sweden_soviet.5.t:0 "Советы соглашаются"
 sweden_soviet.5.d:0 "В ответ на наше послание Москва проявила интерес и признала стратегическую ценность Аландских островов."
 sweden_soviet.5.a:0 "Наш план продолжается."
 sweden_soviet.6.t:0 "Советы отказываются"
 sweden_soviet.6.d:0 "Прошлой ночью Москва ответила по Аландскому вопросу, заявив, что не интересуется небольшими островами в Балтийском море. Фактически Аланды оказались в нашей сфере влияния."
 sweden_soviet.6.a:0 "Прискорбно, но в этом есть и положительная сторона."
 sweden_soviet.7.t:0 "Швеция требует уступок"
 sweden_soviet.7.d:0 "Сегодня утром в Хельсинки прибыл посланник из Стокгольма, встретился с правительством и предъявил ультиматум. Мы должны согласиться на изменение границ, иначе столкнёмся с «серьёзными последствиями»."
 sweden_soviet.7.a:0 "Мы пока не можем им противостоять..."
 sweden_soviet.7.b:0 "Нет! Финские земли останутся за Финляндией!"
 sweden_soviet.7.c:0 "Ради безопасности народа... мы согласны."
 sweden_soviet.8.t:0 "Советы требуют территории"
 sweden_soviet.8.d:0 "После требований Стокгольма Москва также потребовала значительные территории на востоке."
 sweden_soviet.8.a:0 "Нам придётся согласиться, иначе нас уничтожат..."
 sweden_soviet.8.b:0 "Хватит уступок! Победа или смерть!"
 sweden_soviet.9.t:0 "Финляндия передаёт Лаппи"
 sweden_soviet.9.d:0 "Сегодня Финляндия передала часть того, что когда-то принадлежало нам, территории Лаппи, объединив больше саамского населения внутри нашей нации, а также установив границу с нашим союзником на восток."
 sweden_soviet.9.a:0 "Победа!"
 sweden_soviet.10.t:0 "Финляндия отказалась передавать Лаппи"
 sweden_soviet.10.d:0 "Сегодня на пресс-конференции финский премьер-министр объявил, что страна никогда не уступит земли другому государству и что шведам придётся взять их силой."
 sweden_soviet.10.a:0 "Раз они хотят войны..."
 sweden_soviet.11.t:0 "Финляндия уступает земли"
 sweden_soviet.11.d:0 "Осознав безрассудство попыток удержать территории, которые нынешняя концепция финского государства считает своими, финны вернули нам контроль над запрошенными регионами."
 sweden_soviet.11.a:0 "Великолепно!"
 sweden_soviet.12.t:0 "Финны отклоняют наши требования"
 sweden_soviet.12.d:0 "Похоже, финны слишком упрямы, чтобы осознать своё положение. Они отказались передать регионы, указанные нашими политиками, и вместо этого мобилизовали вооружённые силы у границы. Так или иначе, мы получим желаемые земли."
 sweden_soviet.12.a:0 "Пора провести военные учения..."
 sweden_soviet.13.t:0 "Швеция взяла под контроль"
 sweden_soviet.13.d:0 "После захвата наших территорий Швецией и Советским Союзом шведы заявили, что Финляндия больше не способна выжить самостоятельно. Они ясно дали понять, что намерены обеспечить финскому народу выживание в грядущих европейских войнах."
 sweden_soviet.13.a:0 "Мы должны склониться..."
 sweden_soviet.91.t:0 "Финляндия признала Лаппи"
 sweden_soviet.91.d:0 "Как и ожидали шведы, финны уступили Лаппи в результате давления и потенциальной для них войны на два фронта."
 sweden_soviet.91.a:0 "Теперь наша очередь."
 sweden_soviet.101.t:0 "Финляндия отвергает требования Швеции"
 sweden_soviet.101.d:0 "В неожиданном, хотя и вполне возможном повороте событий финны отказались передавать Швеции земли, на которые та претендует. Теперь посмотрим, насколько силён наш новый союзник."
 sweden_soviet.101.a:0 "Любопытно..."
 sweden_soviet.111.t:0 "Финляндская пещера для Советов"
 sweden_soviet.111.d:0 "Не удивительно, что после того, как мы были вынуждены отдать нам Лаппи, финны решили отказаться от своей земли, так как иначе они рисковали вторжением. Но скоро Финляндия все равно не будет предметом для беспокойства."
 sweden_soviet.111.a:0 "Ожидаемо."
 sweden_soviet.112.t:0 "Финляндию держат в напряжении"
 sweden_soviet.112.d:0 "Выяснилось, что финны не так слабы, как мы предполагали. Тем не менее теперь им предстоит столкнуться с советским гневом. Удивительно будет, если Финляндия продержится больше месяца."
 sweden_soviet.112.a:0 "Зачем напрасно проливать кровь, Финляндия?"
 sweden_soviet.30.t:0 "[SWE.GetName] Предлагает объединение"
 sweden_soviet.30.d:0 "Государство [SWE.GetName] направило дипломатическое предложение объединить наши страны в единое целое, чтобы вместе противостоять Советскому Союзу."
 sweden_soviet.30.a:0 "Вместе мы сильнее!"
 sweden_soviet.30.b:0 "Мы хотим сохранить независимость."
 sweden_soviet.31.t:0 "[From.GetName] Присоединяйтесь к нашему союзу!"
 sweden_soviet.31.d:0 "Государство [From.GetName] приняло предложение и вошло в состав Северного союза социалистических республик!"
 sweden_soviet.31.a:0 "Добро пожаловать, товарищи!"
 sweden_soviet.32.t:0 "[From.GetName] Отклонить приглашение."
 sweden_soviet.32.d:0 "Государство [From.GetName] отказалось присоединиться к нашему славному союзу. Однако мы всё ещё можем оставаться союзниками и вместе противостоять иностранным угрозам!"
 sweden_soviet.32.a:0 "Прискорбно..."
 sweden_soviet.33.t:0 "[SWE.GetName] Пригласите нас в [SWE.GetFactionName]."
 sweden_soviet.33.d:0 "Сегодня из Стокгольма поступило официальное коммюнике с приглашением вступить в альянс [SWE.GetFactionName]. В нём говорится о желании сдержать агрессию с востока, прежде всего со стороны государства [SOV.GetName]. Что ответить?"
 sweden_soviet.33.a:0 "Оплот против востока? Мы согласны."
 sweden_soviet.33.b:0 "И разгневать русского медведя? Нет."
 sweden_soviet.34.t:0 "[FROM.GetName] принимает приглашение."
 sweden_soviet.34.d:0 "Государство [FROM.GetName] приняло наше приглашение. Оплот против угрозы со стороны государства [SOV.GetName] становится сильнее!"
 sweden_soviet.34.a:0 "Добро пожаловать!"
 sweden_soviet.35.t:0 "[FROM.GetName] Отклонил приглашение."
 sweden_soviet.35.d:0 "К сожалению, наши друзья из государства [FROM.GetName] отклонили приглашение присоединиться к защите Европы от государства [SOV.GetName]. Несмотря на это, мы всё равно защитим их от восточной угрозы."
 sweden_soviet.35.a:0 "Прискорбно."
 sweden_soviet.40.t:0 "Рабочие начинают переворот!"
 sweden_soviet.40.d:0 "После нескольких месяцев подготовки рабочие готовы начать восстание! Пусть победа будет быстрой, а пламя революции никогда не угаснет!"
 sweden_soviet.40.a:0 "Рабочие, восстаньте!"
 sweden_soviet.60.t:0 "Шведская королевская семья исчезла"
 sweden_soviet.60.d:0 "После перемен в шведской политике король всё активнее выступал против радикального курса страны.\n\nОднако с момента его последнего появления чуть больше месяца назад королевская семья почти полностью замолчала. Новый премьер-министр публично заявил, что исчезновение вызывает глубокую тревогу, но отношение режима к монархии ни для кого не секрет, и некоторые специалисты опасаются худшего."
 sweden_soviet.60.a:0 "Какой ужас!"
 sweden_sca_unite.1.t:0 "[FROM.GetNameDefCap] Скандинавское объединение"
 sweden_sca_unite.1.d:0 "Сегодня на встрече лидер [FROM.GetLeader] поднял вопрос о возможном объединении Скандинавии. Он отметил культурную и историческую близость скандинавских стран и заявил, что перед лицом очередной великой войны в Европе единое политическое образование сможет эффективнее защищаться от потенциальных угроз."
 sweden_sca_unite.1.a:0 "В этом есть смысл."
 sweden_sca_unite.1.b:0 "Так что, если один падает, все падают?"
 sweden_sca_unite.2.t:0 "Государство [FROM.GetNameDefCap] принимает предложение"
 sweden_sca_unite.2.d:0 "Лидер [FROM.GetLeader] согласился с предложением и заявил, что государство [FROM.GetNameDef] присоединится к созданию Скандинавского совета."
 sweden_sca_unite.2.a:0 "Мы знали, что они увидят преимущества."
 sweden_sca_unite.3.t:0 "[FROM.GetNameDefCap] отклоняет предложение"
 sweden_sca_unite.3.d:0 "Лидер [FROM.GetLeader] заявил, что создание Скандинавского совета может быть воспринято другими европейскими державами как акт агрессии и нарушить баланс сил, поэтому приглашение было отклонено."
 sweden_sca_unite.3.a:0 "Без них мы слабее..."
 sweden_sca_unite.4.t:0 "[FROM.GetNameDefCap] приглашать [THIS.GetNameDefCap] Скандинавский совет"
 sweden_sca_unite.4.d:0 "Сегодня [THIS.GetLeader] Сели в звонок с [FROM.GetLeader] В течение нескольких часов, обсуждая различные политические вопросы. [FROM.GetLeader] Мы получили приглашение присоединиться к Скандинавскому совету и стать его членом. Хотя мы не в Скандинавии, у нас есть исторические, культурные и экономические связи с ними, что делает нас кандидатом на вступление в этот совет."
 sweden_sca_unite.4.a:0 "За будущее Скандинавии!"
 sweden_sca_unite.4.b:0 "Мы только обрели независимость — и должны вновь от неё отказаться?"
 sweden_sca_unite.5.t:0 "[FROM.GetNameDefCap] Принимает приглашение"
 sweden_sca_unite.5.d:0 "Сегодня пришла новость, что государство [FROM.GetNameDef] приняло приглашение вступить в совет и начало подготовку к объединению экономики, вооружённых сил и гражданского рынка с нашими."
 sweden_sca_unite.5.a:0 "Великолепно!"
 sweden_sca_unite.6.t:0 "Государство [FROM.GetNameDefCap] отклоняет приглашение"
 sweden_sca_unite.6.d:0 "К сожалению, государство [FROM.GetNameDef] сообщило, что не заинтересовано во вступлении в совет. Недавно обретя независимость, оно не желает так быстро от неё отказываться."
 sweden_sca_unite.6.a:0 "Как прискорбно."
 SWE_foreign_politics_events.1.t:0 "[SWE.GetAdjective] Давление на правительство"
 SWE_foreign_politics_events.1.desc:0 "[FROM.GetAdjective] министр иностранных дел прибыл в столицу для срочных консультаций с [THIS.GetLeader]. [FROM.GetAdjective] делегация привезла длинный список нерешённых вопросов — от безопасности границ до нелестных изображений [FROM.GetLeader] в местной прессе. В пресс-релизе министр иностранных дел подчеркнул важность сотрудничества и мирного взаимодействия, но отметил, что [FROM.GetLeader] \"будет трудно смириться с враждебным или недружественным государством [THIS.GetNameDef]\"."
 SWE_foreign_politics_events.1.a:0 "Мы готовы вступить в их альянс, если сохраним конституцию."
 SWE_foreign_politics_events.1.b:0 "Необходимо привести наше правительство в соответствие с их режимом."
 SWE_foreign_politics_events.1.c:0 "Мы не уступим ни пяди."
 SWE_foreign_politics_events.2.t:1 "[SWE.GetAdjective]Спонсируемые митинги в столице"
 SWE_foreign_politics_events.2.desc:0 "Несколько политических групп объявили о проведении митингов в столице на этой неделе. Похоже, у них нет конкретных претензий, кроме общего требования улучшить отношения с государством [SWE.GetNameDef] и отстранить от власти политиков, критикующих [SWE.GetAdjective]ую администрацию.\n\nВозможно, эти демонстрации являются стихийным выражением общественного мнения, однако примечательно, что несколько ключевых организаторов недавно посетили Стокгольм и начали агитацию сразу после возвращения."
 SWE_foreign_politics_events.2.a:0 "Что ж, это несомненно их право."
 SWE_foreign_politics_events.2.b:0 "Отправить полицию и проломить несколько голов!"
