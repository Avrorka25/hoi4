 SWE_modernizing_the_air_force:0 "Модернизация военно-воздушных сил"
 SWE_modernizing_the_air_force_desc:0 "Шведские военно-воздушные силы малы даже по меркам наших немногочисленных вооружённых сил и, что ещё хуже, состоят из небольшого количества случайных иностранных моделей. Чтобы они представляли хотя бы какую-то угрозу, необходимо устранить эти недостатки."
 SWE_contract_cvm:0 "Заключить контракт с CVM"
 SWE_contract_cvm_desc:0 "Centrala Flygverkstaden Malmslätt играет важнейшую роль в ремонте и обслуживании наших самолётов. Дополнительное финансирование позволит предприятию расширить деятельность и перейти от обслуживания и ремонта к разработке морской авиации."
 SWE_hire_junkers:0 "Нанять Junkers"
 SWE_hire_junkers_desc:0 "Благодаря помощи Junkers нам удалось заложить основу программы пикирующих бомбардировщиков. Следует предложить компании открыть постоянное представительство в Швеции, чтобы эффективнее использовать её знания."
 SWE_torpedo_bombers:0 "Торпедоносцы"
 SWE_torpedo_bombers_desc:0 "Торпедоносцы являются грозной силой в Балтийском море и способны потопить крупный корабль за малую долю его стоимости. Сосредоточив исследования и разработки в этой области, мы сможем господствовать на море!"
 SWE_contract_ffvs:0 "Заключить контракт с FFVS"
 SWE_contract_ffvs_desc:0 "Последняя война продемонстрировала важность превосходства в воздухе. Вражеская авиация способна нанести неисчислимый ущерб шведской территории, поэтому приоритетом должно стать создание современных истребителей для защиты неба."
 SWE_license_republic_aviation:0 "Приобрести лицензию Republic Aviation"
 SWE_license_republic_aviation_desc:0 "Мы ещё не получили купленные у Republic Aviation самолёты P-35, но можем попросить компанию разрешить лицензионное производство её моделей в Швеции."
 SWE_flygverkstaderna:0 "Flygverkstäderna"
 SWE_flygverkstaderna_desc:0 ""
 SWE_work_with_hawker:0 "Сотрудничать с Hawker"
 SWE_work_with_hawker_desc:0 "Покупка самолётов Hawker Hart оказалась полезной для наших молодых военно-воздушных сил. Однако исследования продолжают развиваться, и нам нельзя отставать. Сотрудничество с Hawker в разработке и производстве самолётов позволит сохранить темп, пока местные компании занимаются другими задачами."
 SWE_dual_engine_planes:0 "Двухмоторные самолёты"
 SWE_dual_engine_planes_desc:0 "Поскольку наши возможности по производству самолётов ограничены, возможно, следует сосредоточиться на машинах, способных летать дальше и наносить более мощные удары."
 SWE_swedish_nine:0 "Шведская девятка"
 SWE_swedish_nine_desc:0 "Объединяя пикирующие бомбардировщики в три группы по три самолёта и атакуя одну цель с нескольких направлений, мы повысим вероятность потопления вражеских конвоев при меньших потерях."
 SWE_northern_airfields:0 "Северные аэродромы"
 SWE_northern_airfields_desc:0 "Наши северные земли огромны, а расстояния велики. Чтобы защитить жизненно важные шахты на севере, необходимо построить аэродромы, с которых смогут действовать молодые военно-воздушные силы."
 SWE_southern_airfields:0 "Южные аэродромы"
 SWE_southern_airfields_desc:0 "Датские проливы и южная часть Балтийского моря жизненно важны для контроля как над морем, так и над воздухом. Дальнейшее расширение аэродромов на юге поможет обеспечить господство в южном небе."
 SWE_found_saab:0 "Основать SAAB"
 SWE_found_saab_desc:0 "Создав SAAB — Svenska Aeroplan Aktiebolaget, — мы получим собственное отечественное авиапроизводство."
 SWE_domestic_aircraft_designs:0 "Отечественные проекты самолётов"
 SWE_domestic_aircraft_designs_desc:0 "Направив средства на разработку отечественной авиации, мы сможем создавать собственные самолёты для собственной защиты и перестанем зависеть от иностранных производителей и поставок запасных частей."
 SWE_foreign_aircraft_designs:0 "Иностранные проекты самолётов"
 SWE_foreign_aircraft_designs_desc:0 "Вместо вложения средств в проекты, которые могут ни к чему не привести, разумнее найти уже разработанный и испытанный самолёт. Возможно, он не будет идеальным, но окажется достаточно хорошим."
 SWE_low_altitude_bombers:0 "Низковысотные бомбардировщики"
 SWE_low_altitude_bombers_desc:0 "Атака на малой высоте и высокой скорости позволит пилотам за счёт внезапности избегать наиболее плотного зенитного огня. Она также обеспечит более точные удары по ключевым целям, что может оказаться решающим."
 SWE_the_future_of_aviation:0 "Будущее авиации"
 SWE_the_future_of_aviation_desc:0 "Подобно стремительному развитию бронетехники, последние годы показали, что авиация постоянно меняется. Чтобы оставаться на переднем крае авиационных технологий, нам предстоит ещё много работы."
 SWE_the_flying_barrel:0 "Летающая бочка"
 SWE_the_flying_barrel_desc:0 "J 29 получил прозвище «Летающая бочка» за необычную форму и стал нашей первой полноценной попыткой создать чистокровный реактивный истребитель. Нет сомнений, что будущее авиации принадлежит реактивным технологиям."
 SWE_rocket_propulsion:0 "Ракетная тяга"
 SWE_rocket_propulsion_desc:0 "Сосредоточившись на ракетной тяге, мы получим преимущество в ракетных технологиях. От переносного противотанкового ракетного оружия до реактивных перехватчиков — почти нет задачи, которую не могла бы выполнить ракета."
 SWE_swedish_nine_tactic:0 "Тактика «Шведская девятка»"
 SWE_swedish_nine_tactic_desc:0 "Объединяя пикирующие бомбардировщики в три группы по три самолёта и атакуя одну цель с нескольких направлений, мы повысим вероятность потопления вражеских конвоев при меньших потерях."
 SWE_low_altitude_bombers_idea:0 "Низковысотные бомбардировщики"
 SWE_obtain_plane_schematics_category:0 "Авиационные проекты"
 SWE_obtain_plane_schematics:0 "Получить иностранные чертежи самолётов"
 SWE_swedish_army_staff:0 "Шведский армейский штаб"
 SWE_swedish_army_staff_desc:0 "Чтобы армия могла действовать как единое целое, мы создадим Армейский штаб, также известный как Arméstaben. Он будет отвечать за подготовку, тактику, организацию и закупаемое снаряжение."
 SWE_begin_initial_rearmament:0 "Начать первоначальное перевооружение"
 SWE_begin_initial_rearmament_desc:0 "Начать первоначальное перевооружение"
 SWE_expand_the_military_budget:0 "Расширить военный бюджет"
 SWE_expand_the_military_budget_desc:0 "Расширить военный бюджет"
 SWE_fund_carl_gustafs_gevarsfaktori:0 "Финансировать Carl Gustafs Gevärsfaktori"
 SWE_fund_carl_gustafs_gevarsfaktori_desc:0 "Дополнительное финансирование Gevärsfaktoriet позволит намного быстрее обновить наш арсенал. Местные предприятия также помогут перевооружить страну."
 SWE_hire_scania_vabis:0 "Нанять Scania-Vabis"
 SWE_hire_scania_vabis_desc:0 "Несмотря на молодость, Scania-Vabis уже показала себя весьма успешной компанией. Следует предложить ей финансирование в обмен на разработку новых армейских машин."
 SWE_winter_equipment:0 "Зимнее снаряжение"
 SWE_winter_equipment_desc:0 "Не секрет, что зимы в Швеции долгие, суровые и невероятно холодные. Необходимо обеспечить солдат снаряжением, которое позволит им лучше противостоять холоду, чем врагам страны."
 SWE_nationalize_landsverk:0 "Национализировать Landsverk"
 SWE_nationalize_landsverk_desc:0 "Нам известно о тайных сделках между германской компанией GHH и AB Landsverk. Следует использовать знания, полученные во время их сотрудничества, и поручить Landsverk создать бронетехнику, способную соперничать с немецкой!"
 SWE_nationalize_landsverk_strv_m38_tt:0 "Исследование §Hулучшенного шасси лёгкого танка§! даст нам проект лёгкого танка §HStridsvagn m/38§!.\n"
 SWE_modern_command_structure:0 "Современная структура командования"
 SWE_modern_command_structure_desc:0 "Модернизация командной структуры повысит устойчивость к потере связи. Если взвод понимает общую задачу, ему не требуются постоянные напоминания, и он сможет самостоятельно выбирать способ её выполнения."
 SWE_royal_military_academy:0 "Королевская военная академия"
 SWE_royal_military_academy_desc:0 "Создание военной академии позволит готовить более способных офицеров и командиров. Жизненно важно, чтобы нашу армию возглавляли лучшие из лучших!"
 SWE_artilleriskjutskolan:0 "Artilleriskjutskolan"
 SWE_artilleriskjutskolan_desc:0 "Какой прок от артиллерии, если расчёты не способны попасть в цель? В XVII веке король Густав Адольф заложил основы её применения, но с тех пор мы отстали от других стран. Необходимо наверстать упущенное и вновь доказать, что шведскую артиллерию следует бояться."
 SWE_bofors_kanoner:0 "Орудия Bofors"
 SWE_bofors_kanoner_desc:0 "Bofors производит одни из лучших орудий в мире. Следует поддержать разработку более совершенного вооружения, чтобы получить преимущество над соперниками."
 SWE_bofors_tank_development_division:0 "Отдел разработки танков Bofors"
 SWE_bofors_tank_development_division_desc:0 "В то время как Бофорс преуспел в мире артиллерии, у них нет надлежащего финансирования и мест для того, чтобы они углубились в разработку танков. Поэтому мы должны исправить это, и мы, несомненно, выиграем от этого."
 SWE_armens_jagarskola:0 "Arméns Jägarskola"
 SWE_armens_jagarskola_desc:0 "Большая часть Швеции покрыта лесами. Необходимо обучить войска эффективно передвигаться по ним и правильно занимать оборону. Наша страна мала, и если враг закрепится на нашей земле, его нужно отбросить как можно быстрее."
 SWE_armens_jagarskola_tt:0 "Позволяет §HСвенска Ягаре§!\n§Hджаггер\n    Мягкая атака: §G+5%§!\n    Защита: §G+5%§!\n    Лес:\n        Защита: §G+10%§!\n        Движение: §G+5%§!§!"
 SWE_state_of_disarmament:0 "Состояние разоружения"
 SWE_state_of_disarmament_desc:0 "После принятия шведского закона об обороне 1926 года мы добровольно разоружились — не по условиям мирного договора и не под внешним давлением. Однако мировая обстановка меняется, и нам необходимо быть готовыми. Стоит ли сохранять разоружение и позволить судьбе решить всё за нас?"
 SWE_the_budgetary_question:0 "Бюджетный вопрос"
 SWE_the_budgetary_question_desc:0 "Поскольку в Европе, возможно, назревает новая война, необходимо вновь пересмотреть бюджет. Расширение таких городов, как Стокгольм и Гётеборг, уже запланировано и началось, но конкретное назначение новых объектов ещё не определено."
 SWE_jumpstart_the_arms_industry:0 "Запустить оружейную промышленность"
 SWE_jumpstart_the_arms_industry_desc:0 "Хотя производство оружия остаётся небольшим, но постоянным, нынешнего количества фабрик недостаточно для долгосрочной защиты страны. Необходимо расширить военный сектор, чтобы в случае войны он мог эффективно обеспечивать нашу безопасность."
 SWE_expand_airfleet_capabilities:0 "Расширить возможности воздушного флота"
 SWE_expand_airfleet_capabilities_desc:0 "Нынешних возможностей воздушного флота совершенно недостаточно. Финансирование строительства и расширения аэродромов создаст прочную основу для будущих военно-воздушных сил."
 SWE_conclude_rearmament:0 "Завершить перевооружение"
 SWE_conclude_rearmament_desc:0 "Теперь мы отбросили ограничения закона об обороне 1926 года. Если война придёт в наш дом, мы будем к ней готовы."
 SWE_fighter_designs:0 "Проекты истребителей"
 SWE_fighter_designs_desc:0 "Стремительное развитие истребительной авиации со времён Великой войны ясно показывает, что необходимо уделять больше внимания этим манёвренным машинам, иначе мы потеряем контроль над собственным воздушным пространством."
 SWE_strike_craft_designs:0 "Проекты ударных самолётов"
 SWE_strike_craft_designs_desc:0 "На базе истребителей можно устанавливать более тяжёлое вооружение, не слишком подходящее для борьбы с воздушными целями, но весьма эффективное против наземных и морских."
 SWE_medium_frame_craft:0 "Самолёты среднего размера"
 SWE_medium_frame_craft_desc:0 "Хотя небольшие и манёвренные самолёты могут оказаться главным направлением развития, нельзя исключать необходимость действовать далеко от безопасной шведской территории. Более крупные планеры позволят самолётам летать дальше, пусть и ценой некоторой манёвренности."
 SWE_motorization_initiative:0 "Инициатива моторизации"
 SWE_motorization_initiative_desc:0 "Военные учения и опыт Великой войны показали, что гужевое снабжение осталось в прошлом. Будущее войны принадлежит грузовикам, способным перевозить больше грузов дальше и быстрее. Если война вернётся в Европу, мы должны быть готовы."
 SWE_nationalize_landsverk:0 "Национализировать Landsverk"
 SWE_nationalize_landsverk_desc:0 "В то время как Landsverk доказал, что он достаточно искусен в исследованиях в области бронированной войны, пришло время вмешаться и убедиться, что компания, которая разрабатывает и производит оборудование для войны, делает это исключительно для нас. Привлекая Landsverk AB под государственный контроль, мы можем обеспечить уверенность в разработке и производстве необходимой военной техники."
 SWE_respect_landsverk_independence:0 "Уважать независимость Landsverk"
 SWE_respect_landsverk_independence_desc:0 "Позволив Landsverk AB сохранить независимость, мы сможем использовать опыт и инновации частного сектора, одновременно обеспечивая строгие нормы и высокие стандарты качества оборонной продукции."
 SWE_bicycle_infantry_regiments:0 "Велосипедные пехотные полки"
 SWE_bicycle_infantry_regiments_desc:0 "Хотя моторизация, по всей видимости, является будущим, существуют районы, куда грузовики не смогут добраться, а скорость всё равно имеет решающее значение. Использование велосипедов в вооружённых силах позволит войскам вести разведку и патрулирование там, где наши грузовики действовать не способны."
 SWE_fund_tank_research:0 "Финансировать исследования танков"
 SWE_fund_tank_research_desc:0 "Хотя сама идея бронированной машины вроде танка относительно нова, их развитие идёт стремительно. От гигантских чудовищ Великой войны до современных конструкций — проекты постоянно меняются. Мы не можем позволить себе отстать в этой области, иначе окажемся в крайне невыгодном положении."
 SWE_the_lynx:0 "«Линкс»"
 SWE_the_lynx_desc:0 "Танки являются грозными машинами и способны преодолевать почти любую местность, однако существуют районы, где лучше подходят меньшие и более манёвренные машины. Финансирование разработки бронеавтомобиля для пересечённой местности позволит обеспечить пехоте надлежащую поддержку."
 SWE_mechanized_battalions:0 "Механизированные батальоны"
 SWE_mechanized_battalions_desc:0 "Дальнейшее развитие моторизованных батальонов в полноценные механизированные части является логичным этапом эволюции манёвренной войны. Разместив пехоту в машинах, более похожих на танки, мы сможем постоянно обеспечивать ей надлежащую поддержку в бою."
 SWE_vintertraning:0 "Зимняя подготовка"
 SWE_vintertraning2:0 "Зимняя подготовка"
 SWE_bofors_kanoner_idea:0 "Орудия Bofors"
 SWE_svenska_jagare_idea:0 "Шведские егеря"
 SWE_mechanized_battalions_idea:0 "Механизированные батальоны"
 SWE_motorization_idea:0 "Инициатива моторизации"
 SWE_svenska_jagare:0 "Шведские егеря"
 r56_SWE_lynx_armored_car:0 "Бронеавтомобиль «Линкс»"
 SWE_stockholms_orlogsvarv:0 "Стокгольмская военно-морская верфь"
 SWE_stockholms_orlogsvarv_desc:0 "Стокгольмская военно-морская верфь играет жизненно важную роль в наших кораблестроительных программах. Если мы хотим создать флот, способный защитить страну, необходимо расширить сухие доки."
 SWE_evaluate_naval_doctrine:0 "Пересмотреть морскую доктрину"
 SWE_evaluate_naval_doctrine_desc:0 "Наши морские доктрины устарели на десятилетия. Необходимо отказаться от методов прошлого и обратить взгляд в будущее."
 SWE_swedish_marines:0 "Шведская морская пехота"
 SWE_swedish_marines_desc:0 "Наша страна зажата между горами на западе и Балтийским морем на востоке. Чтобы хотя бы задумываться о действиях за морем, необходимо улучшить подготовку морской пехоты."
 SWE_submarine_flotilla:0 "Флотилия подводных лодок"
 SWE_submarine_flotilla_desc:0 "Подобно удару из укрытия, атака корабля из-под воды является смертоносным способом борьбы с врагом. Следует усовершенствовать подводные лодки, чтобы они стали ещё большей угрозой для тех, кто осмелится напасть на нас."
 SWE_swedish_hunterkillers:0 "Шведские охотники-убийцы"
 SWE_swedish_hunterkillers_desc:0 "Для защиты побережья необходимо поддерживать эсминцы в современном состоянии. Изучив уроки, полученные британцами и немцами в морской войне, мы сможем разработать корабли, способные защитить нашу независимость."
 SWE_new_naval_estimates:0 "Новая военно-морская программа"
 SWE_new_naval_estimates_desc:0 "Новая военно-морская программа"
 SWE_bofors_naval_guns:0 "Корабельные орудия Bofors"
 SWE_bofors_naval_guns_desc:0 "Компания Bofors разрабатывает новые орудия как для суши, так и для моря. Благодаря этому производителю морской артиллерии мы сможем сократить отставание от остального мира."
 SWE_protect_merchant_sailors:0 "Защитить моряков торгового флота"
 SWE_protect_merchant_sailors_desc:0 "Значительная часть нашей экономики зависит от экспорта. Если мы не сможем защитить моряков, перевозящих товары по морю, экономика рухнет."
 SWE_new_cruiser_designs:0 "Новые проекты крейсеров"
 SWE_new_cruiser_designs_desc:0 "Наши крейсеры сильно устарели и практически бесполезны. Дополнительное финансирование позволит вывести в море более современные проекты."
 SWE_swedish_battlecruiser:0 "Шведский линейный крейсер"
 SWE_swedish_battlecruiser_desc:0 "Концепция броненосцев береговой обороны доказала свою пригодность для защиты страны, но для действий за пределами Балтийского моря следует изучить новые типы кораблей. Полноценный линкор, вероятно, не по карману, зато линейный крейсер должен вписаться в бюджет."
 SWE_extensive_naval_project_funding:0 "Масштабное финансирование военно-морских проектов"
 SWE_swedish_defence_act:0 "Закон об обороне Швеции"
 SWE_swedish_defence_act_desc:0 "Времена меняются, и мы должны быть готовы защищать страну у себя дома. Долг каждого мужчины и каждой женщины — сделать всё возможное для защиты Отечества."
 SWE_the_coastal_artillery_program:0 "Программа береговой артиллерии"
 SWE_the_coastal_artillery_program_desc:0 "У нас протяжённая береговая линия. Строительство укреплений в ключевых точках позволит сдержать большинство морских десантов."
 SWE_rationing:0 "Нормирование"
 SWE_rationing_desc:0 "Хотя перспектива нормировать пищу и воду не слишком привлекательна, жизненно важно, чтобы каждый умел правильно распределять запасы на случай нападения и прекращения внешней торговли."
 SWE_air_defence_fortifications:0 "Укрепления противовоздушной обороны"
 SWE_air_defence_fortifications_desc:0 "Военно-воздушные силы становятся всё важнее. Необходимо научиться заранее обнаруживать воздушные атаки и уничтожать самолёты прежде, чем они нанесут стране смертельный ущерб."
 SWE_lottorna:0 "Lottorna"
 SWE_lottorna_desc:0 "Пока мужчины защищают границы от захватчиков, общество должно продолжать работать. Открыв женщинам доступ к профессиям, из которых они прежде были исключены, мы снизим нагрузку на экономику военного времени."
 SWE_recycling:0 "Переработка отходов"
 SWE_recycling_desc:0 "Переработка позволит повторно использовать старые материалы, находить им новое применение или разбирать их для изготовления новых изделий, сокращая объём отходов."
 SWE_hemvarnet:0 "Hemvärnet"
 SWE_hemvarnet_desc:0 "Идею национальной гвардии, или Хемвернета, необходимо развивать. Если мы подвергнемся нападению, нам потребуется возможность быстро мобилизовать более крупную армию для отражения захватчиков."
 SWE_the_swedish_defence_research_agency:0 "Шведское агентство оборонных исследований"
 SWE_the_swedish_defence_research_agency_desc:0 "Создание Шведского агентства оборонных исследований — Försvarets Forskningsanstalt — даст нам учреждение, полностью сосредоточенное на разработке нового оборонного снаряжения."
 SWE_the_swedish_nuclear_program:0 "Шведская ядерная программа"
 SWE_the_swedish_nuclear_program_desc:0 "Само представление о ядерном оружии внушает ужас. Но чтобы понять, как от него защититься, необходимо понять, как его создать."
 SWE_ransonering:0 "Нормирование"
 SWE_recycling_idea:0 "Переработка отходов"
 SWE_lottorna_idea:0 "Lottorna"
 SWE_hemvarnet_idea:0 "Hemvärnet"
 SWE_fortify_our_borders:0 "Укрепить наши границы"
 SWE_swedish_industrial_reinvigoration:0 "Возрождение шведской промышленности"
 SWE_swedish_industrial_reinvigoration_desc:0 "После прихода Великой депрессии в Европу нам пришлось отложить или вовсе отменить множество промышленных проектов. Пришло время возобновить их и оживить экономику новыми предприятиями."
 SWE_expand_husqvarnas_factories:0 "Расширить фабрики Husqvarna"
 SWE_expand_husqvarnas_factories_desc:0 "Husqvarna показала себя способным работодателем. Небольшая государственная поддержка сделает будущее компании выгодным вложением."
 SWE_gotaverken_shipyards:0 "Верфи Götaverken"
 SWE_gotaverken_shipyards_desc:0 "Götaverken — крупнейшая в мире верфь по спущенному на воду валовому тоннажу — уже доказала огромную ценность вложений. Дальнейшее финансирование несомненно расширит торговый флот и принесёт ещё больше пользы."
 SWE_r56rp_expand_ship_building_industry:0 "Расширение судостроительной промышленности"
 SWE_r56rp_expand_ship_building_industry_desc:0 ""
 SWE_infrastructure_development:0 "Развитие инфраструктуры"
 SWE_infrastructure_development_desc:0 "Многие дороги, ведущие от побережья во внутренние районы, отстают от европейских стандартов. Однако привести их в надлежащее состояние будет несложно."
 SWE_refurbish_duved:0 "Модернизировать Дувед"
 SWE_refurbish_duved_desc:0 "Гидроэлектростанция Дувед приближается к моменту, когда потребуется модернизация. Установка новых турбин и систем управления позволит производить больше энергии и создаст множество рабочих мест."
 SWE_swedish_state_railways:0 "Шведские государственные железные дороги"
 SWE_swedish_state_railways_desc:0 "Шведские государственные железные дороги — Statens Järnvägar — жизненно важны для перевозки снабжения и сырья, а также обеспечивают удобные поездки военнослужащим и гражданскому населению. Расширение ключевых участков сделает движение поездов плавнее, чем когда-либо."
 SWE_sako:0 "SAKO"
 SWE_sako_desc:0 "Svenska Aluminiumkompaniet является единственным отечественным производителем алюминия. Следует помочь компании расшириться, чтобы повысить самообеспеченность этим ценным металлом."
 SWE_kiruna_mine:0 "Кирунский рудник"
 SWE_kiruna_mine_desc:0 "Рудники Кируны доказали исключительную ценность для экономики. Благодаря одной из самых качественных железных руд в мире мы стали одним из крупнейших экспортёров высококачественного железа и стали."
 SWE_final_infrastructure_funding:0 "Последнее финансирование инфраструктуры"
 SWE_final_infrastructure_funding_desc:0 "Предыдущие вложения в инфраструктуру были направлены на дороги внутренних районов северной Швеции. Теперь следует воспользоваться возможностью и модернизировать южную инфраструктуру."
 SWE_civilian_sector_expansion:0 "Расширение гражданского сектора"
 SWE_civilian_sector_expansion_desc:0 "Гражданский сектор является основой экономики. Создавая больше рабочих мест для простых граждан, мы дополнительно простимулируем хозяйство и сможем реализовать новые проекты в будущем."
 SWE_resource_utilization:0 "Использование ресурсов"
 SWE_resource_utilization_desc:0 "Сырьевые ресурсы являются одной из опор экономики, поэтому необходимо использовать доступные запасы максимально эффективно."
 SWE_industrial_research_program:0 "Программа промышленных исследований"
 SWE_industrial_research_program_desc:0 "Финансирование дальнейшего развития и исследований нашего промышленного сектора имеет первостепенное значение. Мы не можем позволить себе отставать от наших соседей и сверстников в Европе, если мы никогда не восстановимся."
 SWE_industrial_reinvigoration:0 "Возрождение промышленности"
 SWE_resource_utilization_idea:0 "Использование ресурсов"
 SWE_swedish_state_railways_idea:0 "Statens Järnvägar"
 SWE_swedish_internal_policy:0 "Внутренняя политика Швеции"
 SWE_swedish_internal_policy_desc:0 "Подготовка к предстоящим выборам сопровождается ростом напряжённости как внутри страны, так и по всей Европе. Но прежде чем смотреть наружу, необходимо обратить внимание внутрь."
 SWE_hansson_iii_cabinet:0 "Третий кабинет Ханссона"
 SWE_hansson_iii_cabinet_desc:0 "Это будет третий кабинет Ханссона. Он доказал, что является популярным премьер-министром, проведшим страну через тяжёлые времена после Великой депрессии."
 SWE_gosta_bagge_i_cabinet:0 "Первый кабинет Гёсты Багге"
 SWE_gosta_bagge_i_cabinet_desc:0 "Гёста Багге стал популярным противником Пера Альбина Ханссона и социал-демократов. Эти выборы позволят ему впервые сформировать кабинет. Пусть он достойно поведёт страну."
 SWE_the_red_menace:0 "Красная угроза"
 SWE_the_red_menace_desc:0 "Ни для кого не секрет, что коммунистическая угроза постоянно растёт. Публично осудив их революционные методы, мы можем показать себя потенциальным союзником в борьбе против коммунизма."
 SWE_not_a_european_abyssinia:0 "Не европейская Абиссиния"
 SWE_not_a_european_abyssinia_desc:0 "Швецию никогда не должна постичь судьба Абиссинии после итальянского вторжения. Это стало одной из причин победы Гёсты Багге на выборах. Увеличив военный бюджет, мы сделаем ещё один шаг к тому, чтобы не стать европейской Абиссинией."
 SWE_swedish_foreign_policy:0 "Внешняя политика Швеции"
 SWE_swedish_foreign_policy_desc:0 "После Великой войны мы вновь подтвердили приверженность нейтралитету. Но времена меняются, и необходимо пересмотреть внешнюю политику и, возможно, само понимание нейтралитета."
 SWE_scandinavian_collaboration:0 "Скандинавское сотрудничество"
 SWE_scandinavian_collaboration_desc:0 "Хотя мы не всегда были согласны друг с другом, скандинавские страны неизменно ощущали родство. Обратившись к соседям, мы сохраним братские связи даже перед надвигающейся бурей."
 SWE_fight_unemployment:0 "Бороться с безработицей"
 SWE_fight_unemployment_desc:0 "Пока что §RВеликая депрессия§! Мы не так сильно повлияли на нас, как на остальной мир, мы все еще ощущали его последствия. После этого §RВеликая депрессия§! Мы наблюдаем рост безработицы, но благодаря разумным инвестициям и субсидиям мы должны быть в состоянии помочь районам, которые борются за оплату своих работников."
 SWE_folkhemmet:0 "Фолькхеммет"
 SWE_folkhemmet_desc:0 "Фолькхеммет, также известный как «Народный дом», — это идея общества без привилегированных и обездоленных, любимчиков и нежелательных, без эксплуатации нуждающихся, общества, где господствуют равенство, доброта и сотрудничество."
 SWE_export_based_economy:0 "Экспортно ориентированная экономика"
 SWE_export_based_economy_desc:0 "Наша экономика сильно зависит от экспорта — будь то поставки немцам на юге или любому другому покупателю железной руды. Следует воспользоваться этим положением и получать от торговли максимальную выгоду, пока такая возможность сохраняется."
 SWE_skanelinjen:0 "Линия Сконе"
 SWE_skanelinjen_desc:0 "Дания, возможно, не является главной угрозой безопасности, но контролирует один из немногих сухопутных путей, по которым армии из Центральной Европы могут попасть в Швецию без морских перевозок. Улучшение линии Сконе поможет отбить захватчиков, пытающихся пройти из Дании в Сконе."
 SWE_the_saltsjobaden_agreement:0 "Сальтшёбаденское соглашение"
 SWE_the_saltsjobaden_agreement_desc:0 "Хотя мы стремимся воплотить дух народного дома, необходимо признать, что действительность отличается от идеала.\n\nСоглашение между профсоюзами и работодателями всё же приблизит нас к цели."
 SWE_prepare_defensive_militias:0 "Подготовить оборонительное ополчение"
 SWE_prepare_defensive_militias_desc:0 "Несмотря на официальный нейтралитет, необходимо готовиться к худшему. Расширение призыва может быть воспринято как проявление агрессии, поэтому вместо этого следует подготовить ополчение и обеспечить его снаряжением для защиты родных земель."
 SWE_state_of_selective_neutrality:0 "Состояние избирательного нейтралитета"
 SWE_state_of_selective_neutrality_desc:0 "Провозгласив вооружённый нейтралитет, мы сообщим миру, что не намерены сражаться ни за одну из сторон, но будем отчаянно защищаться в случае нападения. Остаётся надеяться, что делать этого не придётся."
 SWE_the_frivilligkaren_divisions:0 "Дивизии Frivilligkåren"
 SWE_the_frivilligkaren_divisions_desc:0 "После капитуляции соседних стран мы приняли беженцев, которые всё ещё готовы и способны сражаться. С их помощью можно снабжать движения сопротивления на оккупированной родине, сохраняя официальный нейтралитет."
 SWE_military_access_for_ensured_safety:0 "Военный доступ ради безопасности"
 SWE_military_access_for_ensured_safety_desc:0 "Германия ведёт войну по всему континенту и может попытаться любой ценой обеспечить доступ к нашим ресурсам. Нельзя забывать и о стратегическом положении в Балтийском море. Предоставив немцам право перемещать войска через нашу территорию, возможно, мы избежим уничтожения."
 SWE_gmaskinen:0 "G-Maskinen"
 SWE_gmaskinen_desc:0 "Из-за войны и выбранного подхода к нейтралитету немцы просят использовать нашу сеть связи в собственных интересах. Разумеется, сообщения будут зашифрованы, однако §YАрне Бёрлинг§! считает, что сможет взломать используемый ими шифр. Эти сведения могут оказаться бесценными для нужных людей."
 SWE_operation_radda_danmark:0 "Операция «Спасти Данию»"
 SWE_operation_radda_danmark_desc:0 "Датский народ слишком долго страдал под немецкой оккупацией. Мы больше не можем бездействовать, пока южные братья в одиночку переносят жестокие испытания. Теперь, когда ход войны меняется не в пользу §YГермании§!, мы обязаны прийти Дании на помощь."
 SWE_the_finlands_sak_ar_var_recruitment_drive:0 "Кампания по набору «Дело Финляндии — наше дело»"
 SWE_the_finlands_sak_ar_var_recruitment_drive_desc:0 "То, чего мы опасались, произошло: Советский Союз напал на Финляндию и угрожает её независимости. Всё больше людей желают сражаться за финнов, а лозунг «Finlands sak är vår!» приобрёл огромную популярность. Мы не станем мешать добровольцам защищать суверенитет финских братьев."
 SWE_intervention_in_the_winter_war:0 "Вмешательство в Зимнюю войну"
 SWE_intervention_in_the_winter_war_desc:0 "Мы не можем бездействовать, пока финны истекают кровью в борьбе с русским медведем. Наши силы готовы официально вступить в войну.\n\nFinlands Sak är Vår!"
 SWE_operation_stella_polaris:0 "Операция «Стелла Поларис»"
 SWE_operation_stella_polaris_desc:0 "Финляндия располагает разведывательными сведениями о русских исключительно высокого качества. Предложив её криптоаналитикам работу в Швеции, мы позволим им продолжить деятельность без риска попасть в русский плен."
 SWE_neutral_no_more:0 "Больше никакого нейтралитета"
 SWE_neutral_no_more_desc:0 "Швеция больше не может безучастно наблюдать, как авторитаризм и диктатура попирают свободы людей внутри страны и за рубежом. Ради Швеции и будущего человечества мы откажемся от нейтралитета и вместе с другими демократическими странами Европы дадим отпор фашизму."
 SWE_denounce_fascist_aggression_europe:0 "Осудить фашистскую агрессию в Европе"
 SWE_denounce_fascist_aggression_europe_desc:0 "Фашистской заразе слишком долго позволяли распространяться по Европе. Пришло время занять позицию и открыто заявить о ней всему миру. Наши ресурсы больше не будут питать военные машины фашизма!"
 SWE_gunther_molotov_agreement:0 "Соглашение Гюнтера — Молотова"
 SWE_gunther_molotov_agreement_desc:0 " "
 SWE_baltic_sea_hegemony:0 "Гегемония в Балтийском море"
 SWE_baltic_sea_hegemony_desc:0 " "
 SWE_defensive_militias_category:0 "Подготовка оборонительного ополчения"
 SWE_defensive_militias_category_desc:0 "Поскольку на горизонте надвигается война, необходимо принять меры, чтобы быть готовыми защитить страну."
 SWE_prepare_militias:0 "Подготовить ополчение"
 SWE_raise_militia:0 "Сформировать ополчение"
 SWE_the_swedish_german_trade_situation_category:0 "Шведско-германская торговая ситуация"
 SWE_the_swedish_german_trade_situation_category_desc:0 "Несколько лет назад мы подписали шведско-германское торговое соглашение. Однако по мере роста мировой напряжённости необходимо вновь пересмотреть договор и решить, как поступить.\n\nСледует ли сохранить нынешний курс, двигаться к самообеспеченности или расширить торговлю с немцами?"
 SWE_find_other_trade_partners:0 "Найти других торговых партнёров"
 SWE_halt_german_trade:0 "Прекратить торговлю с Германией"
 SWE_expand_german_trade_influence:0 "Расширить влияние германской торговли"
 SWE_rely_on_germany_for_trade:0 "Положиться на торговлю с Германией"
 SWE_reestablish_trade_with_germany:0 "Восстановить торговлю с Германией"
 SWE_the_winter_war_category:0 "Зимняя война"
 SWE_the_winter_war_category_desc:0 "Советский Союз перешёл в наступление и обратил взор на наших финских братьев. Хотя официально мы придерживаемся нейтралитета в бушующих по Европе войнах, среди нашего народа есть желающие сражаться за Финляндию.\n\nНе следует запрещать добровольцам отправляться на фронт. И пусть официально мы не участвуем в войне, стоит тайно передать финнам некоторое количество снаряжения, чтобы они смогли сдержать красную угрозу."
 SWE_nationalist_military_garrisons_category:0 "Националистические военные гарнизоны"
 SWE_crackdown_on_nationalism_in_the_army:0 "Подавить национализм в армии"
 SWE_empower_nationalist_garrisons:0 "Расширить полномочия националистических гарнизонов"
 SWE_aid_finland_in_their_fight:0 "Помочь Финляндии в борьбе"
 SWE_send_guns_to_finland:0 "Отправить оружие Финляндии"
 SWE_send_artillery_to_finland:0 "Отправить артиллерию Финляндии"
 SWE_nordic_resistance_fighters_category:0 "Бойцы северного сопротивления"
 SWE_fund_norwegian_resistance_fighters:0 "Финансировать норвежское сопротивление"
 SWE_fund_danish_resistance_fighters:0 "Финансировать датское сопротивление"
 SWE_support_equipment_to_the_norwegian_resistance:0 "Передать снаряжение норвежскому сопротивлению"
 SWE_support_equipment_to_the_danish_resistance:0 "Передать снаряжение датскому сопротивлению"
 SWE_heavy_guns_to_the_norwegian_resistance:0 "Передать тяжёлое оружие норвежскому сопротивлению"
 SWE_heavy_guns_to_the_danish_resistance:0 "Передать тяжёлое оружие датскому сопротивлению"
 SWE_fighting_unemployment_category:0 "Борьба с безработицей"
 SWE_fighting_unemployment_category_desc:0 "После Великой депрессии безработица среди гражданского населения значительно выросла. Субсидируя отдельные отрасли, мы обеспечим продолжение производства необходимых стране товаров."
 SWE_factory_subsidies:0 "Субсидии фабрикам"
 SWE_dockyard_subsidies:0 "Субсидии верфям"
 SWE_integrate_aland:0 "Интегрировать Аландские острова"
 SWE_find_an_alliance_category:0 "Найти союз"
 SWE_find_an_alliance_category_desc:0 "Пока мир охвачен хаосом, всё ещё существуют страны, сохраняющие верность истинным демократическим ценностям. Следует обратиться к ним и создать союз, чтобы вместе защищать свободу и единым фронтом противостоять фашизму."
 SWE_join_demo_from_factionname:0 "Присоединиться к альянсу [FROM.getFactionName]"
 SWE_join_demo_from_factionname_tt:0 "Открывает §Hрешения§!, позволяющие §Hприсоединяться§! к различным §Yдемократическим§! альянсам в §YЕвропе§!"
 SWE_reintegrate_the_empire_category:0 "Реинтеграция империи"
 SWE_our_eastern_bulwark_category:0 "Наш восточный бульвар"
 SWE_our_eastern_bulwark_category_desc:0 "Пока мы умудрились отобрать землю у §Y[SOV.GetAdjective]§! Мы должны гарантировать, что земля, которую мы обеспечили, способна выстоять. §Y[SOV.GetAdjective]§! нападение.\n\nУ финского народа была поговорка, когда дело дошло до §Y[SOV.GetAdjective]s§!«Чем короче граница, тем дольше мир». — Это то, что мы должны иметь в виду, предоставляя нашему государству-клиенту на Востоке материальные средства и оборудование, они будут действовать как первая линия обороны. §Y[SOV.GetNameDef]§! Проснись и попробуй вернуть то, что мы освободили."
 SWE_reintegrate_state_into_empire:0 "Реинтегрировать регион [FROM.GetName]."
 SWE_integrate_southern_norway:0 "Интегрировать §YЮжную Норвегию§!"
 SWE_integrate_northern_norway:0 "Интегрировать §YСеверную Норвегию§!"
 SWE_integrate_sjaelland_and_fyn:0 "Интегрировать §YЗеландию§! и §YФюн§!"
 SWE_integrate_jutland:0 "Интегрировать §YЮтландию§!"
 SWE_integrate_schleswig:0 "Интегрировать §YШлезвиг§!"
 SWE_integrate_northern_finland:0 "Интегрировать §YСеверную Финляндию§!"
 SWE_integrate_southern_finland:0 "Интегрировать §YЮжную Финляндию§!"
 SWE_integrate_northern_estonia:0 "Интегрировать §YСеверную Эстонию§!"
 SWE_integrate_russian_territories:0 "Интегрировать §Yрусские территории§!"
 SWE_integrate_german_territories:0 "Интегрировать §Yгерманские территории§!"
 SWE_reestablish_the_livonian_protectorate:0 "Установить §YШведский протекторат Ливония§!"
 SWE_cede_kurzeme_to_livonia:0 "Сед §Y[190.GetName]§! то §Y[EST.GetNameDefCap]§!"
 SWE_expand_the_protectorates_governance_into_lithuania:0 "Расширить управление протектората на §YЛитву§!"
 SWE_expand_the_protectorates_governance_into_poland:0 "Расширить управление протектората на §YПольшу§!"
 SWE_expand_the_protectorates_governance_into_russia:0 "Расширить управление протектората на §YРоссию§!"
 SWE_formalize_the_protectorates_new_borders:0 "Официально закрепить новые границы протектората"
 SWE_establish_a_karelian_protectorate:0 "Установить §YШведский протекторат Карелия§!"
 SWE_grant_karelia_murmansk:0 "Грант Карелия §YМурманск§!"
 SWE_grant_karelia_petsamo:0 "Грант Карелия §YПетсамо§!"
 SWE_grant_karelia_salla:0 "Грант Карелия §YСалла§!"
 SWE_formalize_karelias_new_borders:0 "Формализация новых границ Карелии"
 SWE_invest_in_karelia:0 "инвестировать в §Y[KAR.GetNameDef]§!"
 SWE_major_invest_in_karelia:0 "Крупные инвестиции в §Y[KAR.GetNameDef]§!"
 SWE_fund_karelian_arms_industry:0 "Фонд §Y[KAR.GetAdjective]§! Оружейная промышленность"
 SWE_jump_start_karelian_arms_industry:0 "Прыжок старт §Y[KAR.GetAdjective]§! Оружейная промышленность"
 SWE_strengthen_karelian_russian_border:0 "Укрепить §Y[KAR.GetAdjective]§!-§Y[SOV.GetAdjective]§! граница"
 SWE_send_rifles_to_the_karelian_armed_forces:0 "Отправить §YВинтовки§! к §Y[KAR.GetAdjective] Вооружённые силы§!"
 SWE_provide_the_karelians_with_support_equipment:0 "Предоставить §Y[KAR.GetAdjective]§! с §YОборудование поддержки§!"
 SWE_resistance_fighters_tt:0 "Будут сформированы две §Yдатские§! и две §Yнорвежские§! дивизии бойцов сопротивления."
 SWE_remove_factory_subsidies_idea_tt:0 "Убирает национальный дух §YСубсидии фабрикам§!"
