 SWE_offer_concessions_to_soviets:0 "Предлагать концессии на [SOV.getAdjective]"
 SWE_offer_concessions_to_soviets_desc:0 "Перед лицом неизбежного вторжения следует попытаться примириться с врагом. Готланд станет главной разменной монетой за жизни наших солдат."
 SWE_norwegian_danish_resistance_stage_0:0 "[ROOT.GetAdjective] Бойцы Сопротивления"
