 SWE_greater_sweden_category:0 "Создание Великой Швеции"
 SWE_host_fascist_exiles_europe:0 "ведущий [FROM.getAdjective] Фашистские изгнанники"
 SWE_integrate_norway:0 "Интегрировать Норвегию"
 SWE_integrate_denmark:0 "Интегрировать Данию"
 SWE_integrate_finland:0 "Интегрировать Финляндию"
 SWE_proclaim_greater_sweden_decision:0 "Провозгласить Великую Швецию"
 SWE_royalist_return:0 "Возвращение роялистов"
 SWE_royalist_return_desc:0 "В 1917 году шведская монархия была лишена власти совместными усилиями либеральных и социал-демократических министров под руководством Нильса Эдена. Однако в последнее время мир становится всё менее стабильным, а постоянные споры и нерешительность демократического правления ставят будущее Швеции под угрозу."
 SWE_king_gustafs_government:0 "Правительство короля Густава"
 SWE_king_gustafs_government_desc:0 "Густав V правит Швецией с момента смерти своего отца Оскара II в 1907 году. Будучи убеждённым противником коммунизма и видным сторонником панскандинавского союза, он с большой тревогой наблюдал за возвышением Ленина и Сталина. Теперь, когда королевская власть восстановлена, государством вновь должен править сам король."
 SWE_prince_gustafs_coup:0 "Переворот принца Густава"
 SWE_prince_gustafs_coup_desc:0 "Хотя королём Швеции является Густав V, он стар и неспособен на решительные действия, необходимые для спасения страны от коммунистической угрозы. Для выживания и процветания нужен новый, молодой и энергичный монарх. Густав Адольф, сын наследника престола, должен занять трон — при необходимости силой."
 SWE_return_to_sweden_norway:0 "Вернуться к Шведско-норвежской унии"
 SWE_return_to_sweden_norway_desc:0 "Разделение Швеции и Норвегии, почти сто лет связанных договором и кровью, стало серьёзной ошибкой. Без Норвегии мы заперты в Балтийском море, а без Швеции Норвегия не сможет защититься, если война придёт в Скандинавию. Необходимо исправить эту ошибку."
 SWE_the_finnish_crown:0 "Финская корона"
 SWE_the_finnish_crown_desc:0 "На протяжении шести столетий вплоть до Финляндской войны Финляндия защищала восточный фланг Швеции от русского медведя. Теперь она одинока в бурном море мировой политики, а русская угроза всё ближе к её границам. Финляндию необходимо спасти, а восточный фланг вновь обезопасить!"
 SWE_expand_livgardet:0 "Расширить Livgardet"
 SWE_expand_livgardet_desc:0 "Livgardet, или Лейб-гвардия, является одним из старейших действующих воинских соединений и ведёт историю со времён Освободительной войны 1521 года. Она защищает Стокгольм и королевскую семью и состоит из лучших солдат шведской армии. После отказа от демократического разоружения следует расширить Лейб-гвардию и укрепить ядро вооружённых сил."
 SWE_modern_caroleans:0 "Современные каролинеры"
 SWE_modern_caroleans_desc:0 "Каролинеры Карла XII вселяли страх в сердца всех противников. Пусть Карол Рекс давно покинул нас, его наследие живо. Мы вернём каролинерам законное место и вновь заставим врагов Швеции содрогаться!"
 SWE_claim_the_danish_throne:0 "Предъявить права на датский престол"
 SWE_claim_the_danish_throne_desc:0 "Во времена Кальмарской унии Датское королевство господствовало над нами. Но теперь всё изменилось. Швеция стала сильнее, а Дания страдает под слабым и неэффективным правлением ссорящихся политиков, не замечающих опасности у своих границ. Как законным правителям всей Скандинавии, датский престол должен принадлежать нам!"
 SWE_demand_danish_referendum:0 "Потребовать датского референдума"
 SWE_demand_danish_referendum_desc:0 "Мы дадим датчанам единственную возможность мирно урегулировать наше... разногласие. Если они согласятся провести референдум о будущем страны, мы не станем силой утверждать права на датский престол. Разумеется, если они не ответят отказом..."
 SWE_march_across_the_belts:0 "Марш через проливы"
 SWE_march_across_the_belts_desc:0 "Датский престол принадлежит нам по праву, и вмешательства мы не потерпим. Вооружённые силы Дании ослаблены годами пренебрежения, недостаточного финансирования и пацифистской политики — они станут лёгкой добычей."
 SWE_swedish_french_ties:0 "Шведско-французские связи"
 SWE_swedish_french_ties_desc:0 "Швеция и Франция поддерживают тесные отношения с начала XVIII века. Французская культура и язык с тех пор оказывали значительное влияние на нашу страну, а нынешняя королевская династия происходит от французского генерала Жана-Батиста Жюля Бернадота, известного в Швеции как Карл XIV. Теперь, когда Франция вернулась к монархии, следует вновь углубить отношения."
 SWE_nordic_solidarity:0 "Северная солидарность"
 SWE_nordic_solidarity_desc:0 "Со времён Наполеоновских войн Швеция играла второстепенную роль во внешней политике. Когда в Вене перекраивали Европу, мы присутствовали, но нас считали младшими партнёрами. Этому пришёл конец. Создав собственный союз, мы покажем миру, что больше не намерены терпеть пренебрежение."
 SWE_stockholm_paris_agreement:0 "Стокгольмско-парижское соглашение"
 SWE_stockholm_paris_agreement_desc:0 "Германия является общим врагом для нас и французов, и обе страны прежде теряли земли в её пользу. Мы поддержим французские притязания на левый берег Рейна в обмен на признание наших прав на Северный Шлезвиг. Мы вновь будем сражаться плечом к плечу с Францией, чтобы вернуть утраченное."
 SWE_retake_pomerania:0 "Вернуть Померанию"
 SWE_retake_pomerania_desc:0 "Померания некогда принадлежала Швеции, пока в 1814 году её не передали Дании в обмен на Норвегию. Но мы никогда не забывали своих прав на неё, что бы ни говорили выскочки-немцы. Шведская империя будет восстановлена целиком, даже если для этого придётся воевать с Германией."
 SWE_fortet_gotland:0 "Крепость Готланд"
 SWE_fortet_gotland_desc:0 "Готланд — крупнейший остров Балтийского моря и одновременно ключевая уязвимость обороны королевства. Захватчики могут легко создать там передовую базу снабжения и использовать её для операций против материка. Этого нельзя допустить: инженеры уже разрабатывают планы укреплений и зенитных батарей в вероятных местах высадки."
 SWE_negotiate_with_norway:0 "Переговоры с Норвегией"
 SWE_negotiate_with_norway_desc:0 "Норвежское побережье протяжённо и плохо защищено силами одной Норвегии. Объединив возможности, мы сможем лучше обезопасить обе страны от будущего вторжения как со стороны Балтики, так и Атлантики."
 SWE_discussions_with_denmark:0 "Переговоры с Данией"
 SWE_discussions_with_denmark_desc:0 "Граница Дании с Германией вызывает серьёзную тревогу у шведских военных планировщиков: Ютландия особенно уязвима перед быстрым наступлением из Киля. Но в духе скандинавского единства мы не можем оставить датчан без защиты. Мы поддержим их всеми возможными средствами, даже если это приведёт к войне с Германией."
 SWE_aland_for_guarantees:0 "Аландские острова в обмен на гарантии"
 SWE_aland_for_guarantees_desc:0 "Со времени окончания Великой войны Аландские острова остаются предметом спора между Финляндией и Швецией. Хотя их контролируют финны, среди жителей островов высока поддержка объединения со Швецией. Мы предложим Финляндии сделку: она уступит нам Аландские острова, а мы поддержим её борьбу против России за независимость."
 SWE_the_northern_lights:0 "Северное сияние"
 SWE_the_northern_lights_desc:0 "Основы оборонительного союза между скандинавскими странами уже заложены. Теперь необходимо закрепить гарантии официальным альянсом. Тот, кто угрожает одной скандинавской стране, столкнётся с мощью всей Скандинавии."
 SWE_secure_our_southern_border:0 "Обезопасить южную границу"
 SWE_secure_our_southern_border_desc:0 "Несмотря на различия в устройстве правительств, немцы явно заинтересованы в сохранении хороших отношений с нами в обмен на шведский вольфрам и железную руду. Мы предложим пакт о ненападении, который заодно позволит сосредоточиться на востоке."
 SWE_defend_the_baltics:0 "Защитить Прибалтику"
 SWE_defend_the_baltics_desc:0 "Балтийские страны, как и Финляндия, находятся под растущей угрозой возрождающейся России, которая может попытаться вновь оккупировать их земли, как царский режим до 1917 года. Мы не можем допустить этого. Делегации отправятся в Ригу, Каунас и Таллин для подготовки их вступления в наш союз."
 SWE_ally_the_kaiserreich:0 "Союз с Кайзеррейхом"
 SWE_ally_the_kaiserreich_desc:0 "Возвращение германского кайзера, давнего друга шведской королевской семьи, открывает уникальную возможность создать союз монархий против России. Мы не участвовали в Великой войне, но не позволим возрождающейся России угрожать нам или Кайзеррейху. Делегация должна немедленно отправиться в Берлин."
 SWE_joint_panzer_development:0 "Совместная разработка танков"
 SWE_joint_panzer_development_desc:0 "Немцы являются одними из лучших конструкторов танков в Европе. Чтобы подготовиться к великой борьбе против России, следует направить группу технических специалистов для совместной разработки новых бронированных боевых машин."
 SWE_baltic_foothold:0 "Балтийский плацдарм"
 SWE_baltic_foothold_desc:0 "Так называемые «балтийские государства» возникли в конце Первой мировой войны, они слабы и окружены хищными соседями, которые просто ждут возможности вновь включить одно или все из них в себя. Мы должны взять на себя инициативу и восстановить шведское присутствие в Прибалтике впервые со времен Великой Северной войны."
 SWE_prepare_for_the_march_east:0 "Подготовиться к походу на восток"
 SWE_prepare_for_the_march_east_desc:0 "Поход на Москву будет долгим и тяжёлым, а русский климат смертельно опасен для неподготовленных. Мы не можем повторить ошибки предшественников. Необходимо подготовиться к затяжной кампании и обеспечить войска снабжением независимо от расстояния до Стокгольма."
 SWE_reclaim_the_imperial_east:0 "Вернуть имперский восток"
 SWE_reclaim_the_imperial_east_desc:0 "Время пришло. Мы больше не будем бездействовать, пока Россия набирает силу. Ради будущего Швеции и её империи мы обязаны нанести удар. К войне!"
 SWE_prepare_for_soviet_aggression:0 "Подготовиться к советской агрессии"
 SWE_prepare_for_soviet_aggression_desc:0 " "
 SWE_anti_comintern_signatory:0 "Участник Антикоминтерновского пакта"
 SWE_anti_comintern_signatory_desc:0 " "
 SWE_join_barbarossa:0 "Присоединиться к «Барбароссе»"
 SWE_join_barbarossa_desc:0 " "
 SWE_unite_scandinavia:0 "Объединить Скандинавию"
 SWE_unite_scandinavia_desc:0 "Пока на горизонте назревает война, скандинавам вновь необходимо обеспечить собственную безопасность. Перед лицом внешней угрозы мы должны стоять единым фронтом, иначе падём один за другим."
 SWE_the_second_brother:0 "Второй брат"
 SWE_the_second_brother_desc:0 "Недавняя история отношений с Норвегией была непростой, но необходимо залечить раны, оставшиеся после распада Шведско-норвежской унии."
 SWE_the_third_brother:0 "Третий брат"
 SWE_the_third_brother_desc:0 "Дания была для нас и враждебным повелителем, и близким союзником. Пришло время напомнить шведам и датчанам о братстве и вновь работать вместе ради взаимной защиты."
 SWE_the_fourth_brother:0 "Четвёртый брат"
 SWE_the_fourth_brother_desc:0 "Финны находятся в уязвимом положении, лишь недавно освободившись от слишком долгого русского господства. Теперь мы покажем им, что значит быть равными."
 SWE_the_scandinavian_council:0 "Скандинавский совет"
 SWE_the_scandinavian_council_desc:0 "Убедив братьев в наших намерениях, мы наконец можем с полным правом назвать себя скандинавами."
 SWE_the_honorary_scandinavian:0 "Почётный скандинав"
 SWE_the_honorary_scandinavian_desc:0 "Эстония некогда входила в Шведскую империю как часть Ливонии, и эти исторические связи нельзя игнорировать. Следует предложить ей место в новом союзе, если она пожелает присоединиться."
 SWE_integrate_iceland:0 "Интегрировать Исландию"
 SWE_integrate_iceland_desc:0 "Несмотря на удалённость, Исландия культурно и исторически связана со Скандинавией. Логично предоставить ей возможность присоединиться к нашему союзу."
 SWE_decentralized_command_structure:0 "Децентрализованная структура командования"
 SWE_decentralized_command_structure_desc:0 "Рассредоточив командование, мы усложним завоевание страны. Предоставление региональным командирам большей свободы действий позволит эффективнее защищать земли, поскольку они лучше знают местные условия."
 SWE_centralized_command_structure:0 "Централизованная структура командования"
 SWE_centralized_command_structure_desc:0 "Сосредоточив командование в одном месте, мы сможем быстрее направлять снабжение и логистические ресурсы в наиболее нуждающиеся регионы. Единый источник планов и направлений наступления также обеспечит согласованность действий."
 SWE_north_sea_supremacy:0 "Господство в Северном море"
 SWE_north_sea_supremacy_desc:0 "Господство в Северном море позволит защищать судоходство в наших водах и на подходах к Балтике. Будущие враги могут попытаться использовать длинное побережье против нас, поэтому контроль моря необходим для предотвращения вражеских высадок."
 SWE_nordic_joint_air_command:0 "Объединённое северное авиационное командование"
 SWE_nordic_joint_air_command_desc:0 "Централизация авиационного командования улучшит действия военно-воздушных сил во всех областях — от точных ударов по укреплённым целям до снабжения самых отдалённых районов."
 SWE_the_northern_crowns:0 "Северные короны"
 SWE_the_northern_crowns_desc:0 "Многие мечтают об одном линкоре, способном господствовать над всеми, но правда в том, что ни один корабль не может действовать в одиночку. Даже самый мощный нуждается в поддержке собратьев — как и мы."
 SWE_regional_capital_development:0 "Развитие региональных столиц"
 SWE_regional_capital_development_desc:0 "Развивая столицы составных частей союза, мы снизим риск быстрого краха в случае падения Стокгольма и одновременно улучшим отношения с народами, составляющими наше объединение."
 SWE_central_military_industry:0 "Централизованная военная промышленность"
 SWE_central_military_industry_desc:0 "Централизованное планирование военной промышленности создаст более прочную основу для вооружённых сил по мере роста и изменения их потребностей."
 SWE_scandinavian_volunteers:0 "Скандинавские добровольцы"
 SWE_scandinavian_volunteers_desc:0 "После долгого периода нейтралитета пришло время перемен. Разрешив военнослужащим участвовать в зарубежных конфликтах в качестве добровольцев, мы сможем влиять на Европу без прямого вступления в войну."
 SWE_centralized_industrial_planning:0 "Централизованное промышленное планирование"
 SWE_centralized_industrial_planning_desc:0 "Более эффективное планирование приносит лучшие результаты. Единая структура от юга до севера в долгосрочной перспективе окажется значительно продуктивнее."
 SWE_baltic_supremacy:0 "Господство на Балтике"
 SWE_baltic_supremacy_desc:0 "Балтийское море является одной из жизненных артерий страны. Укрепляя принадлежащие нам острова, мы гарантируем, что никто не сможет пройти через наши воды незамеченным."
 SWE_nordic_center_of_research:0 "Северный исследовательский центр"
 SWE_nordic_center_of_research_desc:0 "Создание общего исследовательского института позволит собрать лучшие умы в одном месте и ускорить дальнейшие разработки."
 SWE_scandinavianism_idea:0 "Скандинавизм"
 SWE_centralized_command_structure_idea:0 "Централизованная структура командования"
 SWE_decentralized_command_structure_idea:0 "Децентрализованная структура командования"
 SWE_joint_air_command_idea:0 "Объединённое авиационное командование"
 SWE_centralized_industry:0 "Централизованная промышленность"
 SWE_scandinavian_volunteers_idea:0 "Скандинавские добровольцы"
 SWE_north_sea_protector:0 "Защитник Северного моря"
 SWE_military_matters:0 "Военные вопросы"
 SWE_divide_germany_france_tt:0 "Согласен разделить §RГермания§!. §YФранция§! Притязания на Рейнскую область и §YШвеция§! предъявляет претензии §RГермания§! береговая линия."
 SWE_second_brother_tt:0 "После завершения фокуса §YСкандинавский совет§! мы получим национальные территории в §YНорвегии§!, если этот фокус был выполнен заранее."
 SWE_third_brother_tt:0 "После завершения фокуса §YСкандинавский совет§! мы получим национальные территории в §YДании§!, если этот фокус был выполнен заранее."
 SWE_fourth_brother_tt:0 "После завершения фокуса §YСкандинавский совет§! мы получим национальные территории в §YФинляндии§!, если этот фокус был выполнен заранее."
 SWE_unite_scandinavia_tt:0 "§YСкандинавским§! членам нашего альянса будет предложено объединение. Если они согласятся, мы §Yаннексируем§! их и интегрируем с помощью §Yфокусов§! ниже."
 sweden.66.t:0 "Советы отвергли наше предложение!"
 sweden.66.d:0 "Советы отклонили предложенную сделку. Это тяжёлый удар по интересам коммунизма в Скандинавии."
 sweden.66.a:0 "Лжекоммунисты!"
 sweden.67.t:0 "Советы приняли наше предложение!"
 sweden.67.d:0 "Мудрые руководители СССР приняли наше предложение и готовы вместе с нами бороться против капитализма."
 sweden.67.a:0 "Отличные новости!"
 sweden.70.t:0 "Король созывает правительство"
 sweden.70.d:0 "Густав V созвал совещание с несколькими ведущими политическими деятелями Швеции, прежде всего представителями NSAP. Его тревожат авторитарные взгляды партии. Хотя он против коммунизма, король не считает его столь серьёзной угрозой, как NSAP. Если убедить его в опасности большевизма, это значительно укрепит популярность партии среди народа."
 sweden.70.a:0 "Показать ему зло коммунизма."
 sweden.70.b:0 "Его мнение не имеет значения."
 sweden.72.t:0 "Роялистские газеты"
 sweden.72.d:0 "Похоже, король Густав отнёсся к изгнанию не с тем спокойствием, на которое мы рассчитывали. Он объединился с группой недовольных и публикует клевету на правительство! Старый глупец просто завидует, что больше не имеет власти."
 sweden.72.a:0 "Изъять и сжечь издания!"
 sweden.72.b:0 "Это не стоит усилий."
 sweden.75.t:0 "Объединиться с финскими шведами"
 sweden.75.d:0 "Некоторые недавно приобретённые территории Финляндии населены преимущественно шведами и могли бы удобнее управляться непосредственно из Швеции, а не как часть Финляндии. Разумеется, это ослабит финское марионеточное государство, если мы решим его создать."
 sweden.75.a:0 "Шведы должны жить под властью Швеции."
 sweden.75.b:0 "Риск того не стоит."
 sweden.90.t:0 "Королевский кабинет"
 sweden.90.d:0 "Король нарушил давнюю политику Пера Альбина Ханссона, избегавшего любых иностранных союзов, и заключил пакт с Финляндией. Это вызвало раскол между двумя прежде дружественными правителями. Король имеет полное законное право отправить Ханссона в отставку и заменить его, но это несомненно возмутит республиканскую часть населения. Следует ли Густаву V осуществить этот план?"
 sweden.90.a:0 "Пусть король сформирует свой совет."
 sweden.90.b:0 "Только если он победит на выборах."
 sweden.100.t:0 "Стокгольмское коммюнике"
 sweden.100.d:0 "Король Швеции Густав V пригласил руководителей Норвегии и Дании на конференцию для обсуждения отношений, будущего Европы и позиции стран в случае войны. Участие сблизит нас, но действительно ли это отвечает нашим интересам?"
 sweden.100.a:0 "Посетить конференцию"
 sweden.100.b:0 "Нет, это не в наших интересах"
 sweden.105.t:0 "Операция «Стелла Поларис»"
 sweden.105.d:0 "Советы пока одерживают верх над нашей несчастной страной, и существует серьёзный риск утраты секретных сведений. Мы многим рискуем, если важные документы попадут в руки дядюшки Джо. Агенты предлагают перенести операции в Швецию — более безопасное место вдали от боевых действий, хотя это несколько снизит эффективность."
 sweden.105.a:0 "Отправить их в Швецию"
 sweden.105.b:0 "Они нужны здесь!"
 sweden.106.t:0 "Операция «Стелла Поларис»"
 sweden.106.d:0 "Сегодня после наступления темноты неизвестный в чёрном плаще встретился с главой правительства у финского министерства. Искажённым низким голосом он сообщил, что неудачный ход войны Финляндии с Советами угрожает секретным данным. Он предлагает укрыть их в Швеции, а в качестве платы предоставить нам доступ к части информации и укрепить отношения. Однако русские никогда этого не одобрят."
 sweden.106.a:0 "Провести операцию"
 sweden.106.b:0 "Нет, это слишком рискованно"
 finland.40.t:0 "Запросить помощь Швеции?"
 finland.40.d:0 "Наша страна погрузилась в гражданскую войну против силы, явно поддерживаемой Советским Союзом, и мы вынуждены искать собственных союзников. Швеция является очевидным покровителем: её помощь значительно укрепит нашу сторону. Разумеется, статус Аландских островов всё ещё не решён, но, как ни прискорбно, они признаны справедливой компенсацией."
 finland.40.a:0 "Попросить Швецию вступить в войну"
 finland.40.b:0 "Нет, это наша война!"
 finland.41.t:0 "Финляндия просит о помощи"
 finland.41.d:0 "Белая гвардия Финляндии просит нашей помощи против коммунистов, пытающихся захватить власть в стране. В качестве компенсации нам обещаны Аландские острова — весьма выгодный обмен. Но стоит ли проливать шведскую кровь в чужой войне?"
 finland.41.a:0 "Вступить в гражданскую войну"
 finland.41.b:0 "Мы не можем вмешаться"
 sweden.43.t:0 "Аландские острова восстали!"
 sweden.43.d:0 "Патриотически настроенные жители Аландских островов присоединились к борьбе с коммунистической угрозой и теперь с энтузиазмом идут на фронт... в составе шведской армии. Это всё же лучше красного правления."
 sweden.43.a:0 "Удачное развитие событий!"
 finland.45.t:0 "Швеция отказалась вступить"
 finland.45.d:0 "У шведов не хватило желания присоединиться к нашей войне. Это крайне прискорбно!"
 finland.45.a:0 "Предательство!"
 exileunits.2.t:0 "Polistrupper набраны и обучены"
 exileunits.2.d:0 "Датские и норвежские подразделения Polistrupper завершили подготовку и готовы к бою. Пока они ждут дня возвращения на родину, будут сражаться вместе с нашей армией."
 exileunits.2.a:0 "Прекрасное пополнение"
 iceland.1.t:0 "Исландский мятеж"
 iceland.1.d:0 "Произошёл фашистский мятеж! После небольшой проверки стало очевидно, что восставших снабжают извне. В стране беспорядки — какую позицию занять? Можно подавить восстание, но поставщик может вмешаться лично. Наиболее вероятны Германия или Швеция."
 iceland.1.a:0 "Подавить восстание!"
 iceland.1.b:0 "У нас нет выбора, кроме капитуляции."
 iceland.11.t:0 "Исландия подавила восстание!"
 iceland.11.d:0 "Запланированное нами восстание в Исландии пошло не так, как ожидалось. Правительство сумело подавить его ограниченными силами. Что теперь? Можно начать полноценное вторжение, но тогда придётся иметь дело и с Данией, а вероятно, и с Гренландией."
 iceland.11.a:0 "Значит, будет вторжение!"
 iceland.11.b:0 "Пока отступим."
 iceland.2.t:0 "Исландия провозгласила независимость!"
 iceland.2.d:0 "В результате неожиданного поворота событий небольшой, но хорошо вооружённый отряд националистов изгнал малочисленный датский гарнизон из Исландии. Датское правление под угрозой — необходимо восстановить порядок! Разве что у нас недостаточно людей или имеются моральные возражения..."
 iceland.2.a:0 "Предоставить им суверенитет"
 iceland.2.b:0 "Объявить войну и вернуть Исландию!"
 iceland.3.t:0 "Дания объявила нам войну"
 iceland.3.d:0 "Датское правительство объявило попытку обрести независимость незаконной и направляет к нашим берегам силы вторжения. Швеция обещала поддержку, но самостоятельная победа была бы гораздо впечатляющей, хотя и сложной."
 iceland.3.a:0 "Сражаться самостоятельно!"
 iceland.3.b:0 "Попросить шведов о помощи"
 iceland.4.t:0 "Исландия просит о помощи"
 iceland.4.d:0 "Как мы и предсказывали, Исландия просит поддержки против датчан. Это прекрасная возможность нанести удар по Дании. Можно оставить их тратить силы на вторжение, но вряд ли подобный шанс скоро повторится."
 iceland.4.a:0 "Они предоставлены сами себе"
 iceland.4.b:0 "Сражаться за Исландию!"
 iceland.5.t:0 "Шведы вмешались"
 iceland.5.d:0 "Шведы решили сражаться вместе с нами и намерены победить датчан от нашего имени. Наши усилия не были напрасны — это того стоило."
 iceland.5.a:0 "Слава и суверенитет близки!"
 iceland.7.t:0 "Дания отступила"
 iceland.7.d:0 "Дания признала независимость Исландии, заявив, что не станет препятствовать воле исландского народа. Почти вся Европа строит догадки об истинной причине, но как бы то ни было, Исландия стала независимой без единой жертвы."
 iceland.7.a:0 "Неожиданно"
 iceland.10.t:0 "Вооружить Fjölnismenn"
 iceland.10.d:0 "Мы успешно доставили оружие и офицеров исландским националистам. Fjölnismenn охотно приняли помощь и теперь готовятся к восстанию. Готовы ли мы довести дело до конца?"
 iceland.10.a:0 "Ещё бы!"
 SWE_monarchist_fervor:0 "Монархический пыл"
 SWE_livgardet:0 "Livgardet"
 SWE_modern_caroleans_idea:0 "Современные каролинеры"
 SWE_industrial_ramp_up:0 "Ускорение промышленного производства"
 SWE_industrial_ramp_up_decs:0 "Принудительные сверхурочные работы и повышение норм — отличный способ увеличить производство, но в такие времена воля народа слабеет."
 SWE_puppet_anti_russian_bulwark:0 "Анти-[SOV.GetAdjective] Булварк"
 SWE_swedish_communism:0 "Шведский коммунизм"
 SWE_swedish_communism_desc:0 "Если мы хотим обеспечить стране выживание в следующем столетии, необходимо изменить нынешний политический курс. Заручившись поддержкой городских рабочих и сельских фермеров, мы вскоре получим необходимое политическое влияние."
 SWE_unite_the_cells:0 "Объединить ячейки"
 SWE_unite_the_cells_desc:0 "Пока мы устанавливаем связи с фермерами и рабочими, необходимо также связать между собой различные ячейки, разбросанные по стране. Объединение в единую политическую партию позволит действительно конкурировать с уже существующими организациями."
 SWE_snap_election:0 "Досрочные выборы"
 SWE_snap_election_desc:0 "Большинство населения уже на нашей стороне, поэтому мы можем добиться досрочных выборов. При нынешнем политическом положении победа практически гарантирована. Король, вероятно, будет недоволен, но у нас есть планы и на него."
 SWE_swedish_marxism:0 "Шведский марксизм"
 SWE_swedish_marxism_desc:0 "С нашим новым правительством мы должны обеспечить хорошие отношения с Советами на востоке, чтобы не столкнуться с их гневом. С ростом отношений с Востоком мы, несомненно, не будем затронуты какими-либо потенциальными угрозами со стороны наших ближайших соседей."
 SWE_scandinavian_socialism:0 "Скандинавский социализм"
 SWE_scandinavian_socialism_desc:0 "Когда правительство будет обеспечено, а наша власть в стране укрепится, мы должны гарантировать остальной Европе, что мы не похожи на экспансионистские и репрессивные Советы на Востоке. Мы должны обеспечить, чтобы наши соседи знали, что наш политический сдвиг направлен на то, чтобы защитить нас, а также их."
 SWE_approach_soviets:0 "Сблизиться с Советским Союзом"
 SWE_approach_soviets_desc:0 "В последние месяцы отношения с Советским Союзом постоянно улучшались. Заключение договора о невмешательстве позволит стране спокойно развиваться и процветать."
 SWE_apply_the_nkvd_model:0 "Применение модели НКВД"
 SWE_apply_the_nkvd_model_desc:0 " "
 SWE_establish_red_army:0 "Создать Красную армию"
 SWE_establish_red_army_desc:0 "Ни для кого не секрет, что армия находится в плачевном состоянии. Чтобы не отстать от перевооружения остальной Европы, необходимо создать собственную Красную армию. Расширение призыва даст больше солдат, пусть поначалу они и будут сражаться менее эффективно. Со временем это можно исправить."
 SWE_joint_research:0 "Совместные исследования"
 SWE_joint_research_desc:0 "Несмотря на попытки самостоятельно поддерживать темп исследований, Советский Союз во многих областях значительно опережает нас. Используя его знания, мы сможем ускорить собственные разработки. Впрочем, и Советам наверняка есть чему у нас поучиться."
 SWE_joint_tank_research:0 "Совместная программа исследования танков"
 SWE_joint_tank_research_desc:0 "Великая война представила танк как полноценную боевую машину и открыла новое направление исследований. Совместная работа с Советским Союзом поможет догнать другие великие державы и не остаться позади."
 SWE_aviation_exercises:0 "Авиационные учения"
 SWE_aviation_exercises_desc:0 "Как и танк, истребитель является новым видом техники, впервые проявившим себя в Великой войне и доказавшим жизненную важность. Совместные учения с Советским Союзом принесут пользу обеим странам."
 SWE_factories_of_revolution:0 "Фабрики революции"
 SWE_factories_of_revolution_desc:0 "Война всё ближе, поэтому необходимо расширить производственные мощности. Новые военные заводы в Лапландии будут находиться далеко от вражеских сил и производить оружие, необходимое для распространения революции."
 SWE_soviet_industrial_assistance:0 "[SOV.GetAdjective] Промышленная помощь"
 SWE_soviet_industrial_assistance_desc:0 "За последнее десятилетие Советский Союз провёл индустриализацию с невероятной скоростью. Нам стоит изучить его опыт."
 SWE_socialist_industry:0 "Социалистическая промышленность"
 SWE_socialist_industry_desc:0 "Использование некоторых советских методов позволит расширить промышленную базу. Это ещё не полная индустриализация, но достойное начало."
 SWE_war_infrastructure:0 "Инфраструктура военного времени"
 SWE_war_infrastructure_desc:0 "Чтобы распространять революцию, необходимо убедиться, что инфраструктура выдержит перемещение армий. Южные районы страны уже готовы, но северу требуется дополнительное развитие."
 SWE_the_aland_situation:0 "Аландский вопрос"
 SWE_the_aland_situation_desc:0 "С момента подписания Аландской конвенции мы искали способ вернуть острова. Однако Советский Союз также проявляет к ним интерес. Мы считаем, что Аланды должны принадлежать нам, а Финляндию можно использовать как разменную монету."
 SWE_pressure_finland:0 "Оказать давление на Финляндию"
 SWE_pressure_finland_desc:0 "Требования подготовлены, и теперь их можно предъявить финскому правительству. Оно должно быстро понять, в каком положении оказалось. Мы не ожидаем войны, но исключать её нельзя."
 SWE_close_the_straits:0 "Закрыть проливы"
 SWE_close_the_straits_desc:0 "Датские проливы жизненно важны для Балтийского моря: кто контролирует их, тот контролирует всё море. Мы должны завладеть ими, чтобы не опасаться иностранных морских десантов."
 SWE_turn_the_baltic_red:0 "Окрасить Балтику в красный"
 SWE_turn_the_baltic_red_desc:0 "Прибалтийские земли прежде принадлежали Российской империи, а ещё раньше — нам. Контроль над балтийским побережьем значительно упростит сохранение господства в море."
 SWE_improve_red_army:0 "Улучшить Красную армию"
 SWE_improve_red_army_desc:0 "Ближайшие границы теперь защищены, и следует заняться улучшением армии. Мы многому научились и несомненно находимся в лучшем положении, чем прежде."
 SWE_forced_abdication:0 "Принудительное отречение"
 SWE_forced_abdication_desc:0 "После создания нового правительства король стал серьёзной помехой и активно вредит политическим делам. Он должен уйти."
 SWE_finish_finland:0 "Покончить с Финляндией"
 SWE_finish_finland_desc:0 "После наших требований Финляндия оказалась в жалком положении. Необходимо обеспечить защиту её рабочих. Чтобы предотвратить насилие финских военных над гражданским населением, мы вмешаемся и отныне будем направлять страну."
 SWE_nordic_collaboration:0 "Северное сотрудничество"
 SWE_nordic_collaboration_desc:0 "Мы должны доказать нашим соседям и будущим союзникам, что наша модель социализма не похожа на гнусное угнетение, распространенное на Востоке."
 SWE_stockholm_internationale:0 "Стокгольмский интернационал"
 SWE_stockholm_internationale_desc:0 "Чтобы показать миру серьёзность намерений противостоять государству [SOV.GetNameDef], необходимо создать собственный альянс."
 SWE_strength_in_union:0 "Сила в единстве"
 SWE_strength_in_union_desc:0 "Чтобы стать настоящим оплотом против востока, необходимо вывести сотрудничество на новый уровень. Объединив страны в единый славный союз, мы сможем выстоять против России и её марионеток."
 SWE_alliance_with_finland:0 "Союз с Финляндией"
 SWE_alliance_with_finland_desc:0 "Когда-то Финляндия находилась под нашей властью, затем стала частью России и наконец получила независимость. Мы должны заверить финнов, что не стремимся вновь господствовать над ними, а хотим обеспечить их безопасность и вместе защищаться от последствий русской революции."
 SWE_secure_baltic_sea:0 "Обезопасить Балтийское море"
 SWE_secure_baltic_sea_desc:0 "Новые достижения морской войны позволят закрыть Балтику для любого, кто попытается пройти по ней. Финны уже начали исследования морских мин, и нам стоит воспользоваться их опытом."
 SWE_influence_baltics:0 "Повлиять на Прибалтику"
 SWE_influence_baltics_desc:0 "После падения Российской империи прибалтийские страны обрели независимость, но теперь русский медведь вновь угрожает им. Их помощь и знание местности сделают наш оплот против России ещё сильнее."
 SWE_influence_our_neighbours:0 "Влияние на наших соседей"
 SWE_influence_our_neighbours_desc:0 "Скандинавские страны давно связывает тесная дружба, несмотря на войны прошлого. Для некоторых эти войны были почти что ссорами между братьями и сёстрами. Но теперь нам нужно убедить соседей присоединиться к борьбе с теми, кто угрожает скандинавской семье."
 SWE_joint_jaeger_training:0 "Совместное обучение Jaeger"
 SWE_joint_jaeger_training_desc:0 "Как и Швеция, Прибалтика покрыта густыми лесами. Совместные учения помогут как нам, так и нашим партнёрам."
 SWE_scandinavian_ranger_training:0 "Подготовка скандинавских егерей"
 SWE_scandinavian_ranger_training_desc:0 "Наши страны богаты густыми лесами, высокими горами и многочисленными фьордами. Чтобы иметь шанс против будущих врагов, необходимо научиться правильно передвигаться и сражаться в такой местности."
 SWE_break_the_sickle:0 "Сломать серп"
 SWE_break_the_sickle_desc:0 "Все приготовления завершены, и мы готовы перенести войну на русскую землю. Пусть победа будет быстрой, а вслед за нами придёт справедливость."
 SWE_tackle_fascism:0 "Бороться с фашизмом"
 SWE_tackle_fascism_desc:0 " "
 SWE_invite_the_polish:0 "Пригласить поляков"
 SWE_invite_the_polish_desc:0 " "
 SWE_rallying_the_workers:0 "Сплотить рабочих"
 SWE_rallying_the_workers_desc:0 "Правительство закреплено, и теперь необходимо подготовить страну к возможной войне. Пропаганда и объединение рабочих против будущих врагов помогут подготовить население к грядущему, даже если временно снизят эффективность труда."
 SWE_workers_war_economy:0 "Рабочая военная экономика"
 SWE_workers_war_economy_desc:0 "Существует поговорка: «Хочешь мира — готовься к войне». Мы стоим на пороге новой великой войны и обязаны быть к ней готовы."
 SWE_clip_the_wings:0 "Подрезать крылья"
 SWE_clip_the_wings_desc:0 "Подготовка завершена, и мы готовы нанести первый удар. Германия не должна ввергнуть мир в хаос и причинить неисчислимые разрушения. Даже если придётся пожертвовать немногими, это необходимо ради большинства."
 SWE_learn_from_the_baltics:0 "Учиться у прибалтов"
 SWE_learn_from_the_baltics_desc:0 "Несмотря на недавнее обретение независимости, прибалтийские страны располагают значительными знаниями в различных областях. Достигнув соглашения, мы сможем использовать их специализированный опыт."
 SWE_estonian_oil_industry:0 "Эстонская нефтяная промышленность"
 SWE_estonian_oil_industry_desc:0 "При упоминании нефтедобывающих стран Эстония обычно не приходит на ум. Однако она обнаружила залежи горючего сланца в Кохтла-Ярве. Следует направить туда исследовательскую группу и изучить эстонский опыт."
 SWE_latvian_bomber_sights:0 "Латвийские бомбардировочные прицелы"
 SWE_latvian_bomber_sights_desc:0 "Латвийцы, похоже, разработали способ улучшения бомбардировочных прицелов, способный превзойти даже британские образцы. Предложив помощь в исследованиях, мы сможем усовершенствовать собственные проекты."
 SWE_lithuanian_agrarian_industry:0 "Литовская аграрная промышленность"
 SWE_lithuanian_agrarian_industry_desc:0 "Во времена Российской империи огромные литовские поля снабжали Россию пшеницей. Хотя житницей Европы обычно называют Украину, литовцы также обладают впечатляющими знаниями в сельском хозяйстве."
 SWE_rally_worker_unions:0 "Сплотить рабочие союзы"
 SWE_rally_worker_unions_desc:0 "Некоторые называют себя коммунистами, но лишь молятся о мирной смене власти, словно нынешнее правительство внезапно решит уйти само. Мы знаем: перемен можно добиться только борьбой. Соберём рабочих и подготовим их к грядущему противостоянию!"
 SWE_launch_red_coup:0 "Начать красный переворот"
 SWE_launch_red_coup_desc:0 "Не все готовы, но необходимо воспользоваться моментом. Захватив Стокгольм, мы распространим революцию оттуда на юг и север. Революция начинается сейчас!"
