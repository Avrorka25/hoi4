 SWE_norge_linjen:0 "Норвежская линия"
 SWE_norge_linjen_desc:0 "Чтобы обеспечить суверенитет страны, необходимо подготовить границы. Восточная граница уже укреплена, теперь следует заняться западной."
 SWE_baltic_wall:0 "Балтийский вал"
 SWE_baltic_wall_desc:0 "Швеция имеет протяжённое побережье, которое трудно защищать целиком. Укрепления в ключевых местах позволят защитить важнейшие города и при необходимости использовать их как базы для собственных морских операций."
