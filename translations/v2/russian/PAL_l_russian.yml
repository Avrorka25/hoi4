 PAL_the_fifty_men_decree:0 "Указ о пятидесяти мужчинах"
 PAL_the_fifty_men_decree_desc:0 "Указ Абд аль-Халима Голани о пятидесяти мужчинах гарантирует, что наша страна не останется без людских ресурсов и сохранит стабильный темп призыва. Трижды в неделю Абд аль-Халим и его люди будут набирать по 50 мужчин в соседних городах и деревнях в обмен на финансовую помощь и постоянный доход."
