 PAL_yaeesh_al_shalaf:0 "Да здравствует Шалаф!"
 PAL_yaeesh_al_shalaf_desc:0 "«Яиш аль-Шалаф» — это приговор, который произносит весь наш народ, чтобы поднять моральный дух и поддержать наше правительство, он привел нас к славе! Да здравствует Шалаф!"
