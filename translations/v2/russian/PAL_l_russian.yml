 palestine.61.t:0 "Победа!"
 palestine.61.d:0 "После славной кампании против израильских сионистских сил объединённым палестинским войскам удалось изгнать их! С падением Тель-Авива, последнего оплота израильской независимости, Палестина наконец свободна, но наша нация остаётся расколотой, а её будущее неизвестно."
 palestine.61.a:0 "Аллаху акбар!"
 palestine.1.t:0 "Операция «Интисар»"
 palestine.1.d:0 "После нескольких политических побед над националистической военной диктатурой с фашистскими наклонностями, сближения с «Братьями-мусульманами» и марша к Аль-Аксе нам наконец удалось найти брешь в политической системе. Была проведена операция, в ходе которой два агента «Братьев-мусульман» помогли нашим повстанцам совершить налёт на здание парламента в Рамалле и успешно привести к власти великого муфтия Амина аль-Хусейни."
 palestine.1.a:0 "Они замышляют, и Аллах замышляет, а Аллах — лучший из замышляющих."
 palestine.58.d:0 "После официального объявления выборов председателя Совета улемы собрались, чтобы избрать хранителя первой киблы Пророка и халифа Филистина. Многие кланы попытались вступить в борьбу, но главными соперниками стали Хусейни и Нашашиби. Нашашиби делают упор на гражданские права и следование Сунне, тогда как Хусейни являются строгими последователями шариата и почитают прежних халифов Умара ибн аль-Хаттаба и Усмана ибн Аффана. Исход выборов определится через 35 дней."
 palestine.58.t:0 "Предстоящие выборы"
 palestine.58.a:0 "Желаем обоим кланам всего наилучшего."
 palestine.59.d:0 "После выборов, проведённых улемами и Меджлисом, их результаты были объявлены народу. С небольшим перевесом победителем первых выборов председателя Меджлиса становится..."
 palestine.59.t:0 "Результаты выборов"
 palestine.59.a:0 "Хусам ад-Дин Джаралла"
 palestine.59.b:0 "Амин аль-Хусейни"
 palestine.60.t:0 "Хусам обеспокоен радикальным исламизмом"
 palestine.60.d:0 "Хусам ад-Дин Джаралла недавно был избран председателем Палестинского исламского совета и стал лидером нашего великого халифата, однако в последнее время он выражает недовольство тем, как применяются шариат, законы Корана и учение хадисов.\n\nОн считает, что нынешние законы отклонились от права и шариата истинных халифатов, и отмечает различия между ранним халифатом Умара аль-Хаттаба и нашим нынешним строем. Это может дестабилизировать страну, но, возможно, его опасения небезосновательны?"
 palestine.60.a:0 "В его словах есть смысл."
 palestine.60.b:0 "Чепуха! Он просто слишком мягок."
 palestine.62.t:0 "Джаралла упраздняет радикализм"
 palestine.62.d:0 "После неоднократной критики того, как правительство применяет шариат и собственные законы, председатель Палестинского исламского совета Хусам ад-Дин Джаралла наконец решил выступить против радикального толкования ислама.\n\nОн ослабил жёсткий контроль над повседневной жизнью, установленный прежним радикальным правительством, следуя слову Пророка и не склоняясь ни к либерализму, ни к радикализму. Качество жизни, особенно женщин, улучшилось: теперь им не обязательно закрывать лицо, хотя ношение хиджаба остаётся обязательным."
 palestine.62.a:0 "Аллаху акбар!"
 palestine.63.t:0 "Фашистский переворот"
 palestine.63.d:0 "После того как Хусама ад-Дина Джараллу отвергли из-за его недовольства курсом правительства, генерал Хасан Салама собрал своих людей и организовал марш к Исламскому совету. Здание было блокировано, а остальные его силы захватили другие правительственные учреждения."
 palestine.63.a:0 "Да спасёт нас всех Аллах."
 palestine.2.t:0 "Победа в причинах"
 palestine.2.d:0 "После недавней приграничной операции, начатой высшим командованием, наша армия двинулась из Иранского Азербайджана в северные районы Азербайджана и одержала победу."
 palestine.2.a:0 "Аллаху акбар!"
 palestine.3.t:0 "Потеря в причинах"
 palestine.3.d:0 "После того как мы начали приграничное столкновение в северных районах Азербайджана, более опытные и лучше оснащённые советские силы обошли нас и захватили северную Персию."
 palestine.3.a:0 "Именно Он, Всемогущий, решает исход сражения."
 palestine.4.t:0 "Победа в чемоданах"
 palestine.4.d:0 "После операции из северной Персии в Азербайджан, начатой палестинским высшим командованием, нашим силам удалось отразить нападение и отбросить захватчиков. Это укрепило наши позиции на Кавказе."
 palestine.4.a:0 "Прекрасно."
 palestine.5.t:0 "Потеря в чемоданах"
 palestine.5.d:0 "После обострения приграничного столкновения между палестинским высшим командованием и советскими офицерами халифат переиграл нас. Мы потеряли земли Азербайджана и Армении, но получили ценные боевые уроки."
 palestine.5.a:0 "За это кого-нибудь расстреляют!"
 palestine.6.t:0 "Конференция Высшего арабского комитета"
 palestine.6.d:0 "После победы нашего молодого государства над сионистскими захватчиками мы оказались под властью националистической диктатуры, опирающейся на полицейский режим. Народ Палестины потребовал провести конференцию Высшего арабского комитета с участием семей Хусейни и Нашашиби, других меньших фракций, недавно усилившейся Лиги национального освобождения и Высшего мусульманского совета.\nК завершению конференции самой влиятельной фракцией оказалась..."
 palestine.6.a:0 "Лига национального освобождения во главе с Радваном аль-Хилу и Амером Мухлисом"
 palestine.6.b:0 "Палестинская арабская партия во главе с Рагибом Нашашиби и Джамалем аль-Хусейни"
 palestine.7.t:0 "Джамаль аль-Хусейни несет ответственность за бойкот"
 palestine.7.d:0 "Недавний указ о бойкоте, ставший совместной попыткой Высшего мусульманского совета и семьи Нашашиби восстать против авторитарной националистической диктатуры и объединиться в партию «Истикляль», создал серьёзные проблемы правительству и принёс палестинскому народу облегчение. Однако Джамаль аль-Хусейни из Высшего мусульманского совета публично объявил себя автором указа, нанеся удар по влиянию Нашашиби в новом восстании."
 palestine.7.a:0 "Акида! Фикх! Ахляк!"
 palestine.8.t:0 "Гражданские берутся за оружие"
 palestine.8.d:0 "После ужесточения указа о бойкоте Джамалем аль-Хусейни и его полного присвоения ответственности за него по всей стране, от Хеврона до Хан-Юниса, поднялись вооружённые сторонники исламистской демократии. Они выступили против националистического правительства, и, если мы не справимся с ситуацией, она может перерасти в полномасштабную гражданскую войну."
 palestine.8.a:0 "Шура! Иджма! Аль-Хуррия!"
 palestine.9.t:0 "ВМСК приходит к власти"
 palestine.9.d:0 "После того как мусульмане по всей Палестине взялись за оружие против авторитарной диктатуры Фаузи аль-Кавукджи, полиция впала в ещё большую паранойю, что привело к массовым расстрелам и многочисленным жертвам. Когда Палестина вновь оказалась на грани краха, Джамаль аль-Хусейни сумел избежать катастрофы и организовал бескровный переворот: его сторонники просто ворвались в гостиницы, где находились многие государственные чиновники, а деморализованная охрана почти не сопротивлялась."
 palestine.9.a:0 "Аллах! Ан-Наби! Аль-Ватан!"
 palestine.10.t:0 "Рагиб Нашашби взял на себя ответственность за бойкот"
 palestine.10.d:0 "Недавний указ о бойкоте, ставший совместной попыткой Высшего мусульманского совета и семьи Нашашиби восстать против авторитарной националистической диктатуры, создал серьёзные проблемы правительству и принёс палестинскому народу облегчение. Однако Рагиб Нашашиби публично объявил себя автором указа, что стало победой либерализма."
 palestine.10.a:0 "Хуррият аш-Шааб!"
 palestine.11.t:0 "Марш на Наблус"
 palestine.11.d:0 "Вскоре после того как Рагиб Нашашиби взял на себя ответственность за указ о бойкоте, сотни палестинцев на Западном берегу начали мирный марш к правительственным зданиям в Наблусе. Это вызвало истерию и паранойю в правящей националистической партии, но стало крупной политической победой Рагиба."
 palestine.11.a:0 "Аль-Мусава!"
 palestine.12.t:0 "Охрана открывает огонь"
 palestine.12.d:0 "Мужчины, женщины и дети, мирно протестовавшие против правительства и двигавшиеся к Наблусу, продолжали свой марш к свободе, бросая вызов националистическому авторитарному режиму. Однако их численность подавила охрану парламентского здания, и охваченные паникой солдаты, не получив приказов высшего командования, открыли огонь."
 palestine.12.a:0 "Аль-Фида!"
 palestine.13.t:0 "Переворот Нашашиби"
 palestine.13.d:0 "Резня в Наблусе стала последней каплей для палестинского народа. Консерваторы, либералы и социалисты одновременно выступили против правительства. Рагиб Нашашиби всё тщательно подготовил, и полицейские подразделения начали переходить на его сторону. Фаузи аль-Кавукджи, опасаясь немедленной казни, бежал из страны, после чего семья Нашашиби полностью взяла власть."
 palestine.13.a:0 "Аль-Хукук!"
 palestine.14.t:0 "Рагиб Нашашби сформировал оппозицию Хуррия"
 palestine.14.d:0 "Рагиб Нашашиби, либеральный соперник Джамаля аль-Хусейни, недавно создал оппозиционную группу «Хуррия», или «Свобода», стремясь сохранить власть и политическое влияние семьи Нашашиби. Это повысило популярность либерализма, а несколько социалистов присоединились к их движению, утверждая, что мы являемся марионетками семьи Хусейни."
 palestine.14.a:0 "Им повезло, что мы вообще позволяем им участвовать."
 palestine.15.t:0 "Король Зейд приходит к власти"
 palestine.15.d:0 "Наши дипломаты недавно обратились к принцу Зейду бен Хусейну из дома Хашима, были проведены встречи, чтобы определить его власть и его правление над вновь созданным Хашимитским Королевством Палестина, так как Абдул-Кадир очень любил хашемитскую семью и идею Хашимитского короля в Палестине.\n\nВ то время как армия хотела, чтобы король был строго конституционалистским, Абдул-Кадир заставил их создать абсолютную монархию во главе с его величеством королем Зейдом бен Хусейном."
 palestine.15.a:0 "Аллах! Аль-Ватан! Аль-Малик!"
 palestine.16.d:0 "После недавних переговоров между руководителями Франции и Палестины, вызванных растущим недовольством сирийских арабов своими властителями и палестинскими претензиями на Великую Палестину, была предложена новая граница. Нам предложили щедрую сделку: передать Дамаск в обмен на пакт о ненападении, устранив постоянную угрозу военных столкновений на границе."
 palestine.16.t:0 "Палестинские усилия в Дамаске"
 palestine.16.a:0 "Мы не отдадим наши владения в Дамаске!"
 palestine.16.b:0 "Мы могли бы заключить соглашение."
 palestine.17.d:0 "Наши дипломатические усилия по изменению границ Палестины и передаче Дамаска, вызванные мечтой о Великой Палестине, были сорваны отказом от нашего щедрого предложения."
 palestine.17.t:0 "Дипломатические отношения ухудшились"
 palestine.17.a:0 "Тогда придётся искать другие пути."
 palestine.17.b:0 "Палестина этого не потерпит! К оружию!"
 palestine.18.d:0 "После недавнего приграничного столкновения в Ливане нам удалось одержать победу над вражескими силами. Это важный шаг к созданию Великой Палестины."
 palestine.19.d:0 "После приказа начать приграничное столкновение в Ливане наши силы были переиграны опытными французами и понесли тяжёлое поражение."
 palestine.20.d:0 "После короткого боя в районах южного Ливана и Акры палестинцам удалось отбросить нас и полностью захватить порты Бейрута. Как нам ответить на это унизительное поражение?"
 palestine.21.d:0 "После недавних приграничных столкновений у Акры и в южном Ливане нам удалось отбить палестинскую атаку и вернуть весь Ливан. Неспособность противника удержать восточные порты сыграла важную роль в нашей победе, но это всё равно великий успех."
 palestine.22.t:0 "Руководство Абд аль-Кадира"
 palestine.22.d:0 "После того, как стремление Абдул-Кадира к монарху-хешемиту было отклонено военными, и поскольку он не хотел вызвать раскол в нашей стране, он уступил, однако монарх-хехемит был объединяющей фигурой в идеологии Абдул-Кадрира, поскольку он верит в смесь исламизма и арабского национализма, арабская абсолютная монархия была его решением, однако он должен решить, как действовать, теперь, когда эта цифра больше не достижима."
 palestine.22.a:0 "Нет арабизма без ислама!"
 palestine.22.b:0 "Военные знают лучше."
 palestine.23.t:0 "Второе расширенное собрание руководства"
 palestine.23.d:0 "Мы пригласили нескольких высокопоставленных чиновников на Второе расширенное собрание руководства, чтобы обсудить оборону страны и военную доктрину, предотвратить возможные будущие катастрофы и улучшить положение нации. Пока Абд аль-Кадир и Абд ар-Рахим пользуются наибольшей поддержкой, но заседание проходит успешно."
 palestine.23.a:0 "Прекрасно."
 palestine.25.t:0 "Переговоры обостряются"
 palestine.25.d:0 "Когда генералы обсуждали защиту жизненно важных частей нашей нации, Абдул-Кадир прибег к явному оскорблению Абдул-Рахима за его идею укрепления государства и ловушек за пределами городов и их жизненно важных частей, превратив дискуссию в кричащее соревнование, где оба генерала грубо оскорбляют друг друга и свои семьи."
 palestine.25.a:0 "План Кадира разумнее — нельзя превращать всю страну в ловушку!"
 palestine.25.b:0 "Абд ар-Рахим мудрее — на кону судьба всей страны!"
 palestine.25.c:0 "Аль-Шалаф гораздо опытнее в обороне, чем эти двое слабаков!"
 palestine.26.t:0 "План Абд аль-Кадира"
 palestine.26.d:0 "После того как Шалаф поддержал план Абд аль-Кадира, спор быстро прекратился и был подготовлен план на случай угрозы Палестине. Иерусалим и Яффа будут защищены укреплениями в Рамалле, Беэр-Шеве и Газе, а главный упор сделают на моральный дух, психологическую стойкость и ценность рядового солдата, а не высшего командования."
 palestine.26.a:0 "Палестина не падёт!"
 palestine.27.t:0 "План Абд ар-Рахима"
 palestine.27.d:0 "После того как Шалаф поддержал план Абд ар-Рахима, спор быстро прекратился, хотя Абд аль-Кадир остался недоволен. Был принят план широкого применения партизанской войны и укрепления позиций в Яффе, Иерусалиме и Рамалле. Такой подход повышает шансы защитить Палестину от более сильного врага, но вызывает тревогу среди гражданского населения."
 palestine.27.a:0 "Захватчик встретит смерть!"
 palestine.28.t:0 "План Голани"
 palestine.28.d:0 "После того как Шалаф остановил спор, он предложил компромиссный план. Как наиболее опытный специалист по обороне, он решил сосредоточиться на защите ключевых портов Газы, Тель-Авива и Хайфы, поскольку они жизненно важны для внешних поставок и оружия и играют важную роль в нашем военно-промышленном комплексе."
 palestine.28.a:0 "Да здравствует Шалаф!"
 palestine.64.t:0 "Победа над Палестиной"
 palestine.64.d:0 "После дерзкого вторжения палестинских сил на Синай они предложили мир, поскольку их операция не смогла обеспечить прорыв на нашу территорию и закончилась неудачей при захвате полуострова. Воистину, Бог на нашей стороне."
 palestine.64.a:0 "Мы победили!"
 palestine.64.b:0 "Нет! Мы должны наступать дальше!"
 palestine.65.t:0 "Проигрыш в Синайской войне"
 palestine.65.d:0 "К сожалению, из-за нашей некомпетентности и неспособности вернуть Синай у палестинских вооружённых сил нас вынуждают уступить и подписать мирный договор. Продолжение войны может оказаться катастрофическим для стабильности страны."
 palestine.65.a:0 "Это лучшее решение для египетского народа. Мы должны согласиться."
 palestine.65.b:0 "Нет! Мы не примем это унижение!"
 palestine.66.t:0 "Палестина призывает к объединению"
 palestine.66.d:0 "Палестинский лидер Зейд призвал к объединению между нашими народами, поскольку король Абдалла I и он разделяют одну и ту же гегемитскую кровь, это братское объединение может стоить нам суверенитета, но оно укрепит стоимость гашемита. "
 palestine.66.a:0 "Так будет лучше."
 palestine.66.b:0 "Возмутительно!"
 palestine.67.t:0 "Планы объединения провалились"
 palestine.67.d:0 "После того, как наше щедрое предложение о воссоединении братьев-хешемитов и аннексии Трансиордании было направлено его величеству Абдулле I, оно было отклонено."
 palestine.67.a:0 "Мы этого не забудем! Мобилизовать войска!"
 palestine.67.b:0 "В конце концов, это был их выбор."
 palestine.68.t:0 "Победа в Иордании"
 palestine.68.a:0 "Великолепное наступление!"
 palestine.68.d:0 "После того как Иордания отказалась принять наши реваншистские требования, мы пересекли границу и вошли в Амман!"
 palestine.69.t:0 "Победа над Палестиной"
 palestine.69.a:0 "Иордания не падёт!"
 palestine.69.d:0 "Палестинские реваншисты считали, что смогут вторгнуться в Иорданию и покуситься на наш суверенитет, но они глубоко ошиблись. Мы отбросили их, и теперь они просят о прекращении огня."
 palestine.30.t:0 "Государство Палестина приглашает нас в свой альянс"
 palestine.30.d:0 "После недавней смены власти в новосозданном палестинском государстве они осуществили свою панарабскую мечту и начали добиваться ее с помощью сотрудничества, они пригласили нас в арабскую коалицию в этих усилиях."
 palestine.30.b:0 "Принять"
 palestine.30.a:0 "Отказаться"
 palestine.31.t:0 "Ирак отказывает"
 palestine.31.a:0 "В конце концов, это был их выбор."
 palestine.31.b:0 "Мы объединим наши народы силой!"
 palestine.31.d:0 "Несмотря на дипломатические усилия по продвижению панарабского дела и сотрудничеству с соседними державами, они отвергли наше щедрое предложение, поставив мечту под угрозу."
 palestine.32.t:0 "Ирак соглашается"
 palestine.32.a:0 "Прекрасно!"
 palestine.32.d:0 "После нашего приглашения дипломат вернулся из Багдада с хорошими новостями: правительство Ирака согласилось вступить в альянс. Это великая победа панарабизма!"
 palestine.34.t:0 "Саудовская Аравия отказывает"
 palestine.35.t:0 "Аравия соглашается"
 palestine.35.a:0 "Прекрасно!"
 palestine.35.d:0 "После нашего приглашения дипломат вернулся из Саудовской Аравии с хорошими новостями: её правительство согласилось вступить в альянс. Это великая победа панарабизма!"
 palestine.36.t:0 "Столичный вопрос"
 palestine.36.a:0 "Рамаллах, самый защищенный."
 palestine.36.b:0 "Аль-Кудс, Центр."
 palestine.36.c:0 "Газа, самая доступная."
 palestine.36.d:0 "При формировании экономики молодой страны необходимо выбрать столицу, ведь от этого решения зависит наше дальнейшее развитие."
 palestine.37.t:0 "Фуад получил власть от партии"
 palestine.37.a:0 "Аллаху акбар!"
 palestine.37.d:0 "Популярность радикального марксиста и панарабиста Радвана аль-Хилу, возглавлявшего Лигу, резко упала после того, как новые реформы глубоко укоренили религиозный социализм в нашем обществе. Ради спасения партии власть принял Фуад Нассар, выбравший более исламско-социалистический курс."
 palestine.38.t:0 "Радван аль-Хилу получил власть в партии"
 palestine.38.a:0 "Аль-Ватан аль-Акбар!"
 palestine.38.d:0 "Популярность религиозного социалиста Фуада Нассара, возглавлявшего Лигу, резко упала, поскольку народ стремится связать марксизм с панарабским делом. Ради спасения нашего социалистического строя власть принял радикальный марксист и великий лидер Радван аль-Хилу."
 palestine.39.t:0 "Вопрос об Аль-Мадарисе"
 palestine.39.a:0 "Светская учебная программа"
 palestine.39.b:0 "Религиозная учебная программа"
 palestine.39.d:0 "Пока наша молодая социалистическая республика расколота между исламским социализмом и радикальным атеистическим марксизмом, возникает вопрос школьной программы. Многие требуют светского образования, тогда как другие выступают за обязательное религиозное обучение. Уступки каждой стороне могут помочь нам политически."
 palestine.40.t:0 "Халифат требует нашего обращения"
 palestine.40.d:0 "Недавно восстановленный Палестинский халифат направил делегатов, чтобы убедить нас в необходимости дальнейшего мусульманского единства. Это напоминает ранние халифаты и их призывы к принятию ислама, отказу от распрей между течениями и политических споров о сподвижниках Пророка. Население может не захотеть ставить общую мусульманскую идентичность выше шиитской, но это даст нам могущественного союзника и укрепит власть внутри страны."
 palestine.40.a:0 "Разумеется. Мы поклоняемся одному Богу."
 palestine.40.b:0 "Нет! Али — наш предводитель!"
 palestine.41.t:0 "Иран соглашается"
 palestine.41.d:0 "После долгих споров между нашими делегатами и иранским правительством им удалось убедить власти принять более общую мусульманскую идентичность, отказаться от шиитского прошлого и вражды со сподвижниками. Это великий успех халифата."
 palestine.41.a:0 "Аллах наставляет, кого пожелает."
 palestine.42.t:0 "Иран отказывает"
 palestine.42.d:0 "После долгих споров между нашими делегатами и иранским правительством лидер Ирана вмешался и упрямо отверг призыв к мусульманскому единству. Их армия начала повторную милитаризацию, поскольку они считают нас угрозой своей идентичности."
 palestine.42.a:0 "Аллах наставляет, кого пожелает."
 palestine.43.t:0 "Подозрительная деятельность в Асуане"
 palestine.43.d:0 "Сегодня утром двух таинственных мужчин заметили за контрабандой оружия и боеприпасов в Асуан, где находится штаб-квартира «Братьев-мусульман». Это может быть попыткой саботажа, хотя, возможно, речь идёт лишь о жалких учениях, которые ещё больше их ослабят."
 palestine.43.b:0 "Стража! Арестовать их!"
 palestine.43.a:0 "Нет нужды принимать такие меры."
 palestine.44.t:0 "Контрабандисты пойманы"
 palestine.44.d:0 "Мы отправили лучших агентов доставить оружие и помощь «Братьям-мусульманам» в Асуане, но, к сожалению, их поймали. Однако по мере усиления репрессий против исламистской группы всё больше людей начинают сочувствовать ей и её идеалам."
 palestine.44.a:0 "Миссия выполнена...?"
 palestine.45.t:0 "Победа в гражданской войне"
 palestine.45.d:0 "После того как наша славная исламская республика наконец победила колониальные силы, остаётся лишь один путь — преклониться перед халифатом."
 palestine.45.a:0 "Такбир!"
 PAL_military_civilian_category_desc:0 "Военные неоднократно использовали власть против гражданского населения, и оно начинает отрицательно относиться к нынешнему временному правительству.\n§YПолучение поддержки военных или гражданских может помочь изменить идеологию страны§!\n\nПоддержка §Yгражданских§!: §Y[?PAL_civilian]%§!\nПоддержка §Gвоенных§!: §Y[?PAL_military]%§!"
