 PAL_containing_husseinism:0 "Сдерживание хусейнизма"
 PAL_containing_husseinism_desc:0 "Семья Хусейни всегда играла заметную роль в палестинской политике и служила противовесом либеральной семье Нашашиби. В идеологическом отношении она оставалась строго консервативной: одни её представители придерживались умеренных взглядов, другие впадали в радикализм. Абд аль-Кадир относится к умеренному крылу, но радикалы семьи начали кампанию против правительства.\n\n\nТекущая поддержка правительства: §Y[?PAL_islamist_level]%§!.\n§RЕсли общественная поддержка упадёт до 0, начнётся революция!"
 PAL_integration_of_arab_states:0 "Интеграция арабских государств"
 PAL_integration_of_arab_states_desc:0 "Пока наша великая революция освобождает новые земли, местные жители не всегда благосклонны к идее Высшей арабской революции. Поэтому необходимо начать интеграцию, чтобы избежать нежелательных происшествий."
