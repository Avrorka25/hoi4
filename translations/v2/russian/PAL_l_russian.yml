 PAL_border_conflicts_desc:0 "Продолжение расширения нашего халифата необходимо для освобождения народа от колониализма и воссоединения братьев. Однако мы не можем объявлять полномасштабные войны, поскольку угнетающие империи легко нас превзойдут. Поэтому мы начнём рейды через каждую границу, изгоняя гарнизоны с территорий, на которые совершаем нападения."
 PAL_raids_lower_arabia:0 "Рейды в Нижней Аравии"
 PAL_raid_kuwait:0 "Рейд на Кувейт"
 PAL_raid_yemen:0 "Рейд на Йемен"
 PAL_raid_qatar:0 "Рейд на Катар"
 PAL_raid_uae:0 "Рейд на Абу-Даби"
 PAL_raid_oman:0 "Рейд на Оман"
 PAL_raid_muscat:0 "Рейд на Маскат"
 PAL_raid_aden:0 "Рейд на Аден"
 PAL_raid_syria:0 "Рейды в Сирии"
 PAL_raid_lebanon:0 "Рейд на Ливан"
