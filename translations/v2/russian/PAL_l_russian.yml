 PAL_fatwas:0 "Публичные фетвы"
 PAL_fatwas_desc:0 "Фетва определяет, что в исламе является правильным и неправильным, дозволенным и запретным. Мы можем распространить эту практику, организовав площадки с выступающими, которые будут проповедовать исламские принципы, объединяя нацию и помогая достигать различных целей."
 PAL_al_ittihad_category:0 "«Аль-Иттихад»"
 PAL_al_ittihad_category_desc:0 "Газета «Аль-Иттихад» была создана, чтобы напоминать нашим славным товарищам об их социалистических убеждениях и правительстве. Однако издание можно использовать для изменения воли народа и направления его целей в русло наших социалистических норм."
