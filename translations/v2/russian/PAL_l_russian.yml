 PAL_kickstart_military_industrial_complex_desc:0 ""
 PAL_Naval_Effort:0 "Сформировать палестинский флот"
 PAL_Naval_Effort_desc:0 "Выход к морю открывает новые торговые возможности и усиливает наше присутствие в мире."
 PAL_Small_Navy:0 "Сосредоточиться на рейдерском флоте"
 PAL_Small_Navy_desc:0 "Открытый океан, где наш флот поджидает ничего не подозревающие конвои, будет охвачен хаосом и разрушением."
 PAL_Submarine:0 "Новые современные подводные лодки"
 PAL_Submarine_desc:0 "Основой рейдерского флота должна стать современная подводная лодка."
 PAL_stealth_upgrades:0 "Улучшения скрытности"
 PAL_stealth_upgrades_desc:0 "Наносить удары и исчезать в открытом море гораздо проще, если противник не способен обнаружить двигатели подлодки и атаковать её. В этом случае шноркель станет правильным вложением."
 PAL_Sea_Dominance:0 "Сосредоточиться на господстве на море"
 PAL_Sea_Dominance_desc:0 "Наш флот будет смело держаться на поверхности и уничтожать любую вражескую эскадру, появившуюся на горизонте. Линкоры — будущее морской войны, и мы докажем это всему миру."
 PAL_Study_Ships:0 "Изучить иностранные проекты кораблей"
 PAL_Study_Ships_desc:0 "Наши порты постоянно посещают иностранные корабли. Несколько «проверок безопасности» наверняка позволят узнать больше о новейших типах судов."
 PAL_Ships_American:0 "Миссия на американские верфи"
 PAL_Ships_American_desc:0 "Наши хорошие отношения с США стали ещё теплее после совместных визитов на военно-морские верфи."
 PAL_Ships_England:0 "Миссия на английские верфи"
 PAL_Ships_England_desc:0 "Британские корабельные инженеры показали несколько способов повысить качество и сократить сроки строительства наших лёгких кораблей."
 PAL_Purchase_Ships:0 "Заказать строительство крупных кораблей"
 PAL_Purchase_Ships_desc:0 ""
 PAL_Dockyards:0 "Расширить мощности верфей"
 PAL_Dockyards_desc:0 "Чтобы создать полноценный флот, необходимо расширить верфи на новых побережьях."
 PAL_Carrier:0 "Упор на авианосцы"
 PAL_Carrier_desc:0 "Наше военно-морское конструкторское бюро разрабатывает новый прототип авианосца."
 PAL_Navy_Aircrafts:0 "Модели палубной авиации"
 PAL_Navy_Aircrafts_desc:0 "Авианосец без самолётов — всего лишь металлическая коробка, плавающая по океану. Оснащение его новыми морскими бомбардировщиками займёт время, но определённо того стоит."
 PAL_Battleship:0 "Упор на линкоры"
 PAL_Battleship_desc:0 "По новым проектам будет построен блестящий линейный крейсер. Пусть враги узнают, что нам подвластны огонь и ярость морей!"
 PAL_Destroyer:0 "Упор на эсминцы"
 PAL_Destroyer_desc:0 "Тяжёлые корабли особенно уязвимы для торпедных атак. Совершенствование и строительство эсминцев решит эту проблему."
 PAL_Cruisers:0 "Упор на крейсеры"
 PAL_Cruisers_desc:0 "Хотя тяжёлый крейсер уступает линкору или авианосцу, он станет ценным дополнением к нашей морской огневой мощи и заслуживает дополнительного финансирования."
 PAL_Naval_Doctrine:0 "Улучшить военно-морскую доктрину"
 PAL_Naval_Doctrine_desc:0 "Новые корабли бесполезны без правильной тактики. Необходимо немедленно усовершенствовать нашу доктрину!"
