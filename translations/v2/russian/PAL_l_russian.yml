 PAL_islamist_uprising_category:0 "Исламистское восстание в Египте"
 PAL_islamist_uprising_category_desc:0 "Египетские «Братья-мусульмане» или «Ихван аль-Муслимин» являются единственной крупной исламистской группой в Египте, которая полностью выступает за замену шариата и не отклоняется от радикальной мысли во главе с бывшим учителем Хасаном Банной, если мы хотим распространить Халифат в Египет, мы должны помочь им в их восстании.\n§RМы можем выбрать только один пакет помощи.§!\n\n\n§YThe§! §GМусульманское братство§! §YПолучится: §Y[PALMuslimBrotherhoodStrength]§! из них §YЕгипетская армия§!"
