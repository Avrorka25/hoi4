 PAL_legacy_of_quasi_state:0 "Наследие Квази-государства"
 PAL_legacy_of_quasi_state_desc:0 "В первые дни арабского восстания 1936 года наш великий лидер Голани сформировал квазигосударство под названием «Народ Ас-Сальта» в районе Аль-Сальт, сильно сопротивляясь британской оккупации и угнетению, и устанавливая свои собственные правила, но оно было быстро расформировано после окончания восстания и эскалации в войну за независимость."
