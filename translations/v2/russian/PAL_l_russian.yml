 PAL_liberal_conservative_category:0 "Религиозный вопрос"
 PAL_liberal_conservative_category_desc:0 "С образованием нашего нового демократического и равноправного государства в правительстве все еще остается вопрос о роли религии.\n\nУ нашей партии есть два основных крыла - либеральное крыло, которое выступает против религиозного вмешательства в правительство и верит в более светское и плюралистическое государство, и консервативное крыло , которое считает, что ислам по-прежнему является религией нации и должен продвигаться правительством.\n\nЛюбая политика может принести многочисленные выгоды, но также может принести и недостатки.\n\nЧаевой фаворитизм с обеих сторон напрямую влияет на §YЛиберально-консервативный раскол§! Национальный дух."
 PAL_atheist_religious_category:0 "Религиозный вопрос"
 PAL_atheist_religious_category_desc:0 "С образованием нашей новой великой социалистической республики в нашем обществе все еще остается вопрос о роли религии.\n\nНаличие мусульманского большинства населения, но жесткого марксистского, пан-арабского националистического правительства, продвигающего атеистическое общество и угнетающего религиозное большинство, придаст нашему правительству больше власти политически и в строительстве, поскольку это общество будет верить во все необходимые средства, однако это также может привести к большим волнениям населения и мятежам в армии, поскольку многие из наших сторонников по-прежнему верят в роль религии в нашем обществе.\n\nЛюбая политика может принести многочисленные выгоды, но также может принести и недостатки.\n\nЧаевой фаворитизм с обеих сторон напрямую влияет на §YИсламская дилемма§! Национальный дух."
