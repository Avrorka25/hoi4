 CSA_change_the_flag:0 "Сменить флаг"
 confederacy.1.t:0 "Смена флага"
 confederacy.1.desc:0 "Будучи главным культурным символом нашей нации ещё до её восстановления, боевой флаг Конфедерации был провозглашён государственным. Однако реакция на уже четвёртую смену национального флага оказалась неоднозначной. Некоторые хотят подчеркнуть преемственность с КША 1860-х годов, вернув «Окровавленное знамя», использовавшееся чуть больше месяца до конца Гражданской войны. Другие выступают против того, чтобы символ войны оставался на национальном флаге, считая, что новая эпоха должна меньше определяться кровопролитием. Они предпочли бы вновь поднять наш первый флаг — «Звёзды и полосы»."
 confederacy.1.a:0 "«Окровавленное знамя» заслуживает шанса."
 confederacy.1.b:0 "Следует вернуть «Звёзды и полосы» — война не должна олицетворять эту страну."
 confederacy.1.c:0 "Это бессмысленно. Все патриоты Конфедерации любят боевой флаг!"
