 GER_r56rp_night_battle_tatics:0 "Ночная тактика боя"
 GER_r56rp_mandatory_civilian_training:0 "Обязательное гражданское обучение"
 GER_r56rp_revive_karl_marx_from_the_dead:0 "§R «Возвращение Карла Маркса из мертвых»§!"
 GER_name_ober_ost_command_RT56RP:0 "Территория верховного командования Востока"
 r56rp_germany_communist.1.t:0 "Германия требует Словению"
 r56rp_germany_communist.1.d:0 "Немецкое правительство, утверждая, что с момента включения Австрии они являются законным претендентом на всю австрийскую территорию старой Австрийской империи. Поэтому они требуют, чтобы мы передали им провинцию Словения. Он также заявил, что немецкое меньшинство должно быть «защищено». Видя наращивание сил на нашей границе, становится ясно, что произойдет, если мы откажемся от этого требования."
 r56rp_germany_communist.1.a:0 "Лучше в безопасности, чем сожалеть."
 r56rp_germany_communist.1.b:0 "Они не могут объявить до 39 июля, так или иначе это будет нарушением правил!"
 56rp_germany_communist.2.t:0 "Германия требует возвращения Эльзаса."
 56rp_germany_communist.2.d:0 "Немецкое коммунистическое правительство требует, чтобы мы вернули им Эльзас Лоррейн, заявив, что это будет расплатой за Версальский договор, и что если они отдадут его, они подпишут с нами пакт о ненападении. Однако ясно, что это будет означать, что все таинства Великой войны будут напрасны. Миллионы французов никогда не простят наше правительство, если мы примем их требования."
 r56rp_germany_communist.2.a:0 "Мы не в состоянии бороться."
 r56rp_germany_communist.2.b:0 "Приходите и возьмите его, крауты!"
 56rp_germany_communist.3.t:0 "Германия предлагает «защиту»"
 56rp_germany_communist.3.d:0 "Германское правительство предложило слишком «защитить нас» в случае иностранного нападения. Однако большая армия на нашей границе говорит, какова может быть их истинная цель."
 r56rp_germany_communist.3.a:0 "У нас нет выбора."
 r56rp_germany_communist.3.b:0 "Никогда!"
