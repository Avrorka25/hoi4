 GER_r56rp_a_new_reich_3_tt:0 "§Y[GER.GetNeutralParty] популярностью является§! §Gвыше 55%§!§YОчень высокие шансы на бескровный переворот.§!\n"
 AUS_r56rp_no_anschluss_tt:0 "§RВы не сможете согласиться на аншлюс§!"
 r56rp_GER_befriended_japan:0 " Германия стремится к улучшению отношений с Японией"
 r56rp_GER_befriended_china:0 " Германия стремится к улучшению отношений с Китаем"
 GER_r56rp_zollverein_tt:0 "Все бонусы Zollverein также распространяются на все европейские страны, за исключением стартовых специальностей, то же самое касается ZPNA Focuses."
 GER_r56rp_joint_industrial_planning_tt:0 "Европейские страны должны быть в фокусе, чтобы давать бонусы"
 GER_r56rp_national_volks_armee_tt:0 "The §tНВА§! может быть улучшена до 6 раз. §HРешения§!Каждое увеличение стоит 100 pp, игнорируйте «баланс силы», который является ошибкой."
 GER_r56rp_anschluss_eq_trigger_tt:0 "В армии более §Y25000§! единиц пехотного снаряжения"
 GER_r56rp_form_zollverein:0 "Создать Таможенный союз"
 GER_r56rp_form_zollverein_desc:0 "Золльверейн был первым таможенным союзом в мире, который был успешно реализован и помог создать объединенную Германию. Если мы хотим сделать то же самое с Европой, мы должны следовать по пути, который когда-то делали наши немецкие предки."
 GER_r56rp_create_the_euromark:0 "Ввести евромарку"
 GER_r56rp_create_the_euromark_desc:0 "Для дальнейшего объединения Европы и поощрения трансграничной торговли и сотрудничества между коллегами-мемберами Золльверейна. Мы будем внедрять новую валюту для дальнейшего объединения нашей экономики и поощрения сотрудничества."
 GER_r56rp_joint_research_intiatives:0 "Совместные исследовательские инициативы"
 GER_r56rp_joint_research_intiatives_desc:0 "Чтобы обеспечить технологическое превосходство над нашими врагами, создание совместного исследовательского блока будет способствовать дальнейшему экономическому росту и гарантировать, что мы всегда будем первыми в новых достижениях в науке."
 GER_r56rp_cooperative_resource_extraction:0 "Совместная добыча ресурсов"
 GER_r56rp_cooperative_resource_extraction_desc:0 "Некоторым членам Зольверейна не хватает тяжелого оборудования для эффективного добычи ресурсов, другие члены, предоставляющие оборудование и экспертные знания этим странам, все мы можем воспользоваться увеличением производства."
 GER_r56rp_decentralized_economic_planning:0 "Децентрализованное экономическое планирование"
 GER_r56rp_decentralized_economic_planning_desc:0 "Вынуждая других членов Зольверейна следовать тому, как мы сделали нашу индустриализацию, вызвали бы трения между членами, мы закрепим за всеми нынешними и будущими членами Зольвереина право на то, чтобы они могли индустрализироваться так, как они хотят."
 GER_r56rp_shared_industrial_expertise:0 "Обмен промышленным опытом"
 GER_r56rp_shared_industrial_expertise_desc:0 "Все члены Zollverein могут научиться чему-то друг у друга в создании эффективной и сильной промышленности, поощряя всех членов делиться своими методами, которые помогут стимулировать экономический рост и потенциал."
 GER_r56rp_a_united_european_industry:0 "Объединённая европейская промышленность"
 GER_r56rp_a_united_european_industry_desc:0 "Хотя наша цель - объединить Европу под одним флагом, это вряд ли произойдет в нашей жизни. Однако мы можем предпринять шаги для достижения этой великой цели. Создав совместный совет по регулированию промышленности и установив общие руководящие принципы в отношении того, как управлять трудолюбием и экономикой, мы можем постепенно объединить нашу промышленность и нормативные акты, чтобы цель свободной, единой Европы была на один шаг ближе к тому, чтобы стать реальностью."
 GER_r56rp_a_common_european_army:0 "Создать общеевропейскую народную армию"
 GER_r56rp_a_common_european_army_desc:0 "ZPNA или Общенациональная армия Золльверейна, иногда называемая ZAC или Корпусом армии Золлверейн, является группой многонациональной армии, созданной из членов Цолльверейн в качестве объединяющей и кооперативной военной силы в случае нападения на любого члена. Несмотря на то, что в настоящее время это всего лишь совместный планирующий совет, расширение сотрудничества уже принесло пользу государствам-членам."
 GER_r56rp_internation_recruitment:0 "Международный набор добровольцев"
 GER_r56rp_internation_recruitment_desc:0 "Если ЗПНА когда-нибудь станет постоянной армией. Члены цоллверейн должны начать разрешать вербовку соседних граждан из своих сограждан. Расширить сотрудничество и взаимопонимание между странами, а также позволить меньшим группам населения некоторых членов компенсироваться большим количеством других членов."
 GER_r56rp_joint_military_drills:0 "Совместные военные учения"
 GER_r56rp_joint_military_drills_desc:0 "Повышение готовности и изучение различных доктрин стран-членов. ZPNA будет проводить ежегодные совместные военные учения на суше, в воздухе и на море, чтобы повысить координацию между военными."
 GER_r56rp_for_a_united_europe:0 "Борьба за единую Европу"
 GER_r56rp_for_a_united_europe_desc:0 " Хотя мы, возможно, никогда не доживем до этого, каждый гражданин государств-членов Золльверейн знает, какой потенциал лежит в будущем для Европы. Чтобы возможность того, что однажды мы все будем под одним флагом, действительно была объединена в мире и сотрудничестве друг с другом, не завоеванием, а сотрудничеством. Другие страны видят иначе. И каждый гражданин будет бороться за то, чтобы их дети жили в лучшем будущем."
 GER_r56rp_world_revolution:0 "Торжество революции"
 GER_r56rp_world_revolution_desc:0 "С гибелью Гитлера и нашей победой в гражданской войне мы должны быстро добиться легитимности в глазах народа и обеспечить, чтобы мы приобрели то немногое количество оставшихся товарищей, которых мы должны поддержать в рабочей революции."
 GER_r56rp_collectivize_industry:0 "Обобществить промышленность"
 GER_r56rp_collectivize_industry_desc:0 "Если и есть что-то, что фашисты сделали хорошо, то это было приобретение и создание государственных отраслей промышленности, однако для того, чтобы стереть пятно нацизма с экономики, вся система должна быть приобретена государством и коллективизирована, чтобы обеспечить полный контроль и предотвратить любые попытки нацистов или социальных фашистов подорвать контроль над рабочими."
 GER_r56rp_enact_war_communism:0 "Ввести военный коммунизм"
 GER_r56rp_enact_war_communism_desc:0 "С приходом войны в Европу должны быть предприняты все меры для обеспечения победы коммунизма, даже если это нанесет вред населению в краткосрочной перспективе."
 GER_r56rp_war_communism_enacted:0 "Военный коммунизм введён"
 GER_r56rp_war_communism_enacted_desc:0 "Ленинская система военной экономики была введена в действие, увеличив военное производство и строительство, хотя производство гражданских потребительских товаров значительно сократилось."
 GER_r56rp_impliment_a_consumer_market:0 "Создать рынок потребительских товаров"
 GER_r56rp_impliment_a_consumer_market_desc:0 "Чтобы экономика не рухнула в долгосрочной перспективе из-за чрезмерной коллективизации промышленности, отрасли, ориентированные на производство товаров для населения, получат некоторую рыночную автономию для обеспечения долговечности режима и обеспечения того, чтобы люди не бунтовали из-за отсутствия товаров и продовольствия."
 GER_r56rp_establish_NVA:0 "Национальная народная армия"
 GER_r56rp_establish_NVA_desc:0 " Национальная армия Волков будет называться новыми вооруженными силами немецкой нации, но в настоящее время это всего лишь несколько подразделений и бригад ополчения. Однако со временем и политической волей мы можем создать лучшую армию, которую когда-либо видела Европа."
 GER_r56rp_reform_the_roterfrontkampferbund:0 "Реформировать Союз красных фронтовиков"
 GER_r56rp_reform_the_roterfrontkampferbund_desc:0 "Ротерфронткампфербунд был боевым подразделением КПГ в Веймарский период. Теперь, когда мы у власти, мы можем реформировать группу, чтобы она стала милитаризованным крылом партии."
 GER_r56rp_progress_cult:0 "Культ прогресса"
 GER_r56rp_progress_cult_desc:0 "Мы соберем наших самых преданных ученых и аналитиков в тайную группу, целью которой будет тотальное господство коммунистической науки."
 GER_r56rp_claim_old_german_territory:0 "Вернуть прежние германские территории"
 GER_r56rp_claim_old_german_territory_desc:0 "До тех пор, пока не воссоединится вся старая немецкая территория, отвратительные монархисты будут нас бить."
 GER_r56rp_force_benelux_submission:0 "Принудить Бенилюкс к подчинению"
 GER_r56rp_force_benelux_submission_desc:0 "Регион Бенилюкс является открытым флангом для социал-фашистов во Франции. Мы должны обеспечить нашу гегемонию в регионе для безопасности коммунизма."
 GER_r56rp_demand_alsace_lorraine:0 "Потребовать Эльзас-Лотарингию"
 GER_r56rp_demand_alsace_lorraine_desc:0 "В настоящее время социал-фашисты Франции владеют территорией, которая когда-то была немецкой. Эти социал-фашисты унизили нас со времен Великой войны, и теперь мы должны отомстить Петуху. Как и в 1871 году."
 GER_r56rp_unite_western_europe_under_socalism:0 "Объединить Западную Европу под знаменем социализма"
 GER_r56rp_unite_western_europe_under_socalism_desc:0 "С нашей местью, полученной против социал-фашистских режимов Европы, мы объявили легитимность несостоявшейся идеологии. Работники Европы вместе!"
 GER_r56rp_secure_the_alpine_mountains:0 "Обезопасить Альпы"
 GER_r56rp_secure_the_alpine_mountains_desc:0 "Альпийский регион является очень защищенным регионом, который в настоящее время не находится под нашим контролем. Если фашисты Италии возьмут его первыми, мы подвергнемся нападению с юга. Этого не может быть."
 GER_r56rp_secure_the_yugoslavian_flank:0 "Обезопасить югославский фланг"
 GER_r56rp_secure_the_yugoslavian_flank_desc:0 "Югославия в настоящее время владеет бывшей австрийской провинцией Словения, которая в настоящее время проживает большое немецкое меньшинство. Мы можем убедить югославов вернуть эту территорию ее законным владельцам."
 GER_r56rp_destroy_the_home_of_fascism:0 "Уничтожить колыбель фашизма"
 GER_r56rp_destroy_the_home_of_fascism_desc:0 "Итальянское государство в целом не может существовать, поскольку оно породило идеологию, которая прокляла нашу Германию. Кто бы ни руководил Италией, Италия как идея не должна существовать до конца века!"
 GER_r56rp_karl_marx:0 "Конвенция Маркса"
 GER_r56rp_karl_marx_desc:0 "Учение Карла Маркса должно быть сохранено путем создания союза, который следует его учению и поддерживает истинный дух коммунизма. Этот союз, известный как «Конвенция Маркса», стремится объединить рабочих в солидарности и продвигать дело освобождения пролетариата."
 GER_r56rp_inter_communist_fighting:0 "Искоренить псевдокоммунистов"
 GER_r56rp_inter_communist_fighting_desc:0 ""
 GER_r56rp_destroy_the_pretenders:0 "Уничтожить самозванцев"
 GER_r56rp_destroy_the_pretenders_desc:0 "Мы должны быстро положить конец войне и уничтожить фальшивые правительства, чтобы Германия не пала в анархию."
 GER_begin_civilwar_communist:0 "Отомстить за Мюнхенскую советскую республику"
 GER_begin_civilwar_communist_desc:0 "Поскольку национал-социалистическая партия теряет своего лидера, мы должны теперь нанести им удар и освободить рабочих Германии, как это когда-то делал народ Баварии почти 20 лет назад! Рабочий класс восстанет и уничтожит все, что ему противостоит."
 GER_begin_civilwar_democratic:0 "Возвращение республики"
 GER_begin_civilwar_democratic_desc:0 "По мере того, как национал-социалистическая партия теряет своего лидера, настало время уничтожить все авторитарные силы в Германии, поскольку они уже приводили нас к самым ужасным временам! Стабильность, которую принесло веймарское правительство, была подорвана Штурмабтейлунгом, и теперь они будут уничтожены!"
 GER_r56rp_rebuild_the_nation:0 "Восстановить страну"
 GER_r56rp_rebuild_the_nation_desc:0 "Избавление нашей нации от национал-социалистического паразита нанесло свой урон, но мы теперь свободны, и могут начаться усилия по восстановлению."
 GER_r56rp_mon_allies_alliance:0 "Море принадлежит Королевскому флоту"
 GER_r56rp_mon_allies_alliance_desc:0 "Если мы когда-нибудь захотим превратить Британию в союзника, мы должны покончить с этим заблуждением о том, что германская Кригсмарина может иметь полный контроль над Северным морем. Сталь, предназначенная для кораблей, будет гораздо лучше расходоваться на новые танки и винтовки."
 GER_r56rp_alliance_with_shade:0 "Союз с Тенью"
 GER_r56rp_alliance_with_shade_desc:0 "Признавая свое превосходство на море, Британия должна быть готова к союзу."
 GER_r56rp_carte_blanche:0 "Карт-бланш для Франции"
 GER_r56rp_carte_blanche_desc:0 "Версаль был болезненным ударом для немецкого народа, однако мы не безосновательны. Французские притеснения против нас могут быть стерты, пока Эльзас-Лотринген и некоторые африканские колонии будут переданы в наши руки."
 GER_r56rp_towards_usa:0 "Наследие телеграммы Циммермана"
 GER_r56rp_towards_usa_desc:0 "В 1917 году мы пытались договориться о военном союзе с Мексикой в случае американского участия в Великой войне против нас. Мы должны попытаться сделать это снова."
 GER_r56rp_north_american_war:0 "Нанести удар по Соединённым Штатам"
 GER_r56rp_north_american_war_desc:0 "Мы должны учиться на своих ошибках в Великой войне, если мы хотим добиться нашей имперской славы, мы должны быстро уничтожить Соединенные Штаты Америки, прежде чем они смогут мобилизовать свою военную машину, как это было во время Великой войны."
 GER_r56rp_schlieffen_again:0 "Снова план Шлиффена"
 GER_r56rp_schlieffen_again_desc:0 "Поскольку «Магинот» дерзко стоит между нами и Парижем, мы должны искать альтернативные точки доступа. Низкие страны по сей день шокированы нашим зрелищем во время Великой войны.\nВторой раунд."
 GER_r56rp_trough_maginot:0 "Через линию Мажино"
 GER_r56rp_trough_maginot_desc:0 "Мы столкнулись с массивными линиями укреплений во время Великой войны, и мы знаем, как измельчить их в пыль. Будут введены в эксплуатацию новые железнодорожные пушки, переформированы штурмовики и запущена в производство новая тяжелая бронетехника."
 GER_r56rp_smash_maginot:0 "Новые проблемы, старые решения"
 GER_r56rp_trough_maginot_tt:0 "Позволяет §HНовые проблемы, старые решения§!\n§HШоктропы\n  Форт§!\n      $STAT_ADJUSTER_ATTACK$§G+50%§!\n      $STAT_ADJUSTER_DEFENCE$§G+25%§!\n      $STAT_ADJUSTER_MOVEMENT$§G+15%§!\n\n§HМоторизованные Schocktroops\n  Форт§!\n      $STAT_ADJUSTER_ATTACK$§G+50%§!\n      $STAT_ADJUSTER_DEFENCE$§G+25%§!\n      $STAT_ADJUSTER_MOVEMENT$§G+15%§!\n\n§HМеханизированные шоктропы\n  Форт§!\n      $STAT_ADJUSTER_ATTACK$§G+50%§!\n      $STAT_ADJUSTER_DEFENCE$§G+25%§!\n      $STAT_ADJUSTER_MOVEMENT$§G+15%§!"
 GER_r56rp_plan_sealion:0 "Подготовить операцию «Морской лев»"
 GER_r56rp_plan_sealion_desc:0 "Нападение на Британские острова будет монументальной задачей, и необходимо начать подготовку, чтобы обеспечить выполнение нашей бронетанковой базы."
 GER_r56rp_break_the_colonial_hegemony:0 "Разрушить колониальную гегемонию"
 GER_r56rp_break_the_colonial_hegemony_desc:0 "Слишком долго Франция и Великобритания были единственными колониальными сверхдержавами в Европе. Мы заявим об их колониях, разрушим их империи и перепишем учебники истории."
 GER_r56rp_prepare_for_the_next_blockade:0 "Помнить о блокаде"
 GER_r56rp_prepare_for_the_next_blockade_desc:0 "Великая военная блокада Германии дорого нам обошлась. На этот раз мы будем готовы. Введен в эксплуатацию новый класс грузовых судов, фактически переоборудованный океанский лайнер. Мы не потеряем корабль, который может просто опередить своих врагов."
 GER_r56rp_break_the_anglo_french_colonial_hegemony:0 "Бросить вызов франко-британской колониальной гегемонии"
 GER_r56rp_break_the_anglo_french_colonial_hegemony_desc:0 "Наш кусок пирога был украден англичанами и французами во время Версаля. Мы больше не будем терпеть такое положение дел. Германская империя вернулась."
 GER_r56rp_colonial_administration:0 "Колониальная администрация"
 GER_r56rp_colonial_administration_desc:0 "Управлять нашими колониями из Берлина было бы неэффективно, время для приказов добираться до наших колоний было бы слишком долгим. Мы создадим местные административные органы, которые будут управлять землей от имени Кайзера."
 GER_r56rp_colonial_administration_tt:0 "Завершение фокуса позволит освободить подвластные правительства в наших ранее удерживаемых колониальных государствах."
 GER_r56rp_revive_brest_litovsk:0 "Если [SOV.GetName] оккупирует Финляндию, Польшу, Прибалтику, Румынию - они будут включены в Новый Брестский литовский договор - иначе восточные правительства уже под оккупацией [SOV.GetName] Они будут освобождены и реорганизованы."
 GER_r56rp_improve_national_spirit_france:0 "Месть за Версаль"
 GER_r56rp_improve_national_spirit_france_desc:0 "То, что было в Версале против нашего народа, было отомщено. Французы больше не будут диктовать нашу судьбу."
 GER_r56rp_improve_national_spirit_britain:0 "Триумф над Лондоном"
 GER_r56rp_improve_national_spirit_britain_desc:0 "Теперь, когда столица Англии прочно в наших руках, никто больше не будет угрожать нашему Северному морскому судоходству."
 GER_r56rp_pan_germanism:0 "Пангерманизм"
 GER_r56rp_pan_germanism_desc:0 "Мы объединим всех германоязычных людей под единым флагом. Такое начинание будет долгим и чревато трудностями, но, как при Бисмарке, мы будем упорствовать и преуспевать."
 GER_r56rp_gateway_north:0 "Ворота на север"
 GER_r56rp_gateway_north_desc:0 "С Кильский канал в наших руках, Датский пояс является единственным способом войти в Балтийское море без нашего слова, а также отличной плацдармом для дальнейшего северного объединения. Датский народ со временем признает преимущества союза с Берлином."
 GER_r56rp_claim_germanic_north:0 "Предъявить претензии на германский север"
 GER_r56rp_claim_germanic_north_desc:0 "С Данией в руках, мы можем заглянуть дальше на север, к нашим шведским и норвежским германским братьям."
 GER_r56rp_core_sweden:0 "Интегрировать Швецию"
 GER_r56rp_core_sweden_desc:0 "Интеграция Швеции не обошлась без издержек, однако наши северные кузены готовы признать правление Берлина."
 GER_r56rp_core_norway:0 "Интегрировать Норвегию"
 GER_r56rp_core_norway_desc:0 "Убедить гордый народ Норвегии в том, что сгибание колена перед Берлином - лучший путь вперед, было трудно, однако теперь они готовы присоединиться к нам."
 GER_r56rp_second_brothers_war:0 "Вторая братоубийственная война"
 GER_r56rp_second_brothers_war_desc:0 "В 1866 году мы показали австрийцам, что не будем порабощены Веной. С нашим старым братом, захваченным фашистами, демократами и коммунистами, прусские войска, марширующие по разрушенным улицам, будут милосердны."
 GER_r56rp_core_austria:0 "Гросс-Дойчланд"
 GER_r56rp_core_austria_desc:0 "Бисмарк был гением, однако его амбиции ограничивались объединением современных немецких земель под единым флагом. Мы не должны бояться своих амбиций. Концепция Великой Германии объединит наших австрийских братьев с Берлином."
 GER_r56rp_claim_austrohungary:0 "Предъявить права на австрийский престол"
 GER_r56rp_claim_austrohungary_desc:0 "В связи с признанием Австрией ценности союза с Германией открылся новый вариант для Австрии. [ROOT.GetLeader]. Наш кайзер мог претендовать на старый австро-венгерский трон. Покорить бывшие территории Австрии после такой длительной «мятежной» фазы будет трудно, однако прусский дух в конце концов восторжествует."
 GER_r56rp_war_switzerland:0 "Подчинить Швейцарию"
 GER_r56rp_war_switzerland_desc:0 "Швейцарцы высоко ценят свою независимость, и заставить их согласиться на объединение с германскими северо-восточными братьями будет почти невозможно без вооруженного конфликта. Потери будут огромными, но неизбежными."
 GER_r56rp_core_switzerland:0 "Интегрировать швейцарские земли"
 GER_r56rp_core_switzerland_desc:0 "С большинством населения Швейцарии, говорящего на высоком немецком языке, не должно быть трудно убедить швейцарцев в том, что союз с Германией выгоден."
 GER_r56rp_into_benelaux:0 "Марш на Бенилюкс"
 GER_r56rp_into_benelaux_desc:0 "Даже с Великой депрессией, несостоятельностью демократии и пацифизмом, которые все еще процветают, жители Бенело не увидят преимуществ сгибания колена перед Берлином."
 GER_r56rp_core_niederdeuche:0 "Объединить нижненемецкие земли"
 GER_r56rp_core_niederdeuche_desc:0 "С большими площадями Бенело, говорящими на тунге, очень похожем на наш собственный, объединение не должно быть трудным."
 GER_r56rp_growing_pains:0 "Трудности роста"
 GER_r56rp_growing_pains_desc:0 ""
 GER_r56rp_self_governance:0 "Ограниченное самоуправление"
 GER_r56rp_self_governance_desc:0 ""
 GER_r56rp_limited_selfgovernance_modifier:0 "Ограниченное самоуправление"
 GER_r56rp_centralised_administration:0 "Централизованная бюрократия"
 GER_r56rp_centralised_administration_desc:0 ""
 GER_r56rp_carrier:0 "Класс «Европа»"
 GER_r56rp_carrier_desc:0 "Граф Цеппелин был успешным, но мы не должны почивать на лаврах. Наш враг постоянно вводит новшества, и мы тоже."
 GER_r56rp_bismarck_battleship:0 "«Бисмарк»"
 GER_r56rp_bismarck_battleship_desc:0 "В противовес классу Richalieu, это будет самый мощный немецкий военно-морской корабль на сегодняшний день. Тот факт, что он должен превышать определенные договорные ограничения, не должен доходить до иностранных ушей."
 GER_r56rp_h_battleship:0 "Современный дредноут"
 GER_r56rp_h_battleship_desc:0 "30 лет назад HMS Dreadnought потряс мир.\nЧтобы добиться такого же эффекта, придется отказаться от разума. Броненосцы H-44 должны стать триумфом немецкой технологической мысли, самым большим морским бременем с самыми большими пушками и самой толстой броней.\n Следующий Дредноут будет в Кригсмарине."
 GER_r56rp_rebuild_the_high_seas_fleet:0 "Новый Флот открытого моря"
 GER_r56rp_rebuild_the_high_seas_fleet_desc:0 "Флот Старых Высоких морей защищал береговую линию Германии во время Великой войны, но он был сорван Версальским договором и потоплен в Скапа-Флоу.\n Мы создадим новый и более крупный флот, чтобы служить новой и более крупной Германии."
 GER_r56rp_pride_of_the_modern_germany:0 "Новая гордость флота"
 GER_r56rp_pride_of_the_modern_germany_desc:0 "Имперские военные корабли, возможно, не были самыми многочисленными, но они, безусловно, были самыми технологически продвинутыми судами того времени. Чтобы победить наших противников, мы должны убедиться, что у Kriegsmarine есть новейшие игрушки."
 GER_r56rp_dustoff_old_manuals:0 "Возродить тактику императорского флота"
 GER_r56rp_dustoff_old_manuals_desc:0 "В то время как времена изменились, за исключением авианосца, военно-морской бой остался вызывающе застойным. Нация с самым многочисленным количеством больших палок победит море."
 GER_r56rp_prepare_for_the_next_blockade_idea:0 "Помнить о блокаде"
 GER_r56rp_prepare_for_the_next_blockade_idea_desc:0 "Быстроходные океанские лайнеры в настоящее время являются основным методом морской транспортировки грузов. Удачи в потоплении нашего транспорта на этот раз."
 triumphant_will_0:0 "Победа на Западе"
 GER_r56rp_new_zollverein_1:0 "Таможенный союз"
 GER_r56rp_new_zollverein_1_desc:0 "Золльверейн – это возглавляемый Германией таможенный союз, целью которого является объединение Европы путем экономического сотрудничества."
 GER_r56rp_new_zollverein_2:0 "Таможенный союз"
 GER_r56rp_new_zollverein_2_desc:0 "Золльверейн – это возглавляемый Германией таможенный союз, целью которого является объединение Европы путем экономического сотрудничества."
 GER_r56rp_new_zollverein_3:0 "Таможенный союз"
 GER_r56rp_new_zollverein_3_desc:0 "Золльверейн – это возглавляемый Германией таможенный союз, целью которого является объединение Европы путем экономического сотрудничества."
 GER_r56rp_european_army_1:0 "Общеевропейская народная армия"
 GER_r56rp_european_army_1_desc:0 "ZPNA или Общенациональная армия Золльверейна - это кооперативная военная сила, созданная членами Цолльверейн для повышения военной готовности и сотрудничества между членами."
 GER_r56rp_european_army_2:0 "Общеевропейская народная армия"
 GER_r56rp_european_army_2_desc:0 "ZPNA или Общенациональная армия Золльверейна - это кооперативная военная сила, созданная членами Цолльверейн для повышения военной готовности и сотрудничества между членами."
 GER_r56rp_european_army_3:0 "Общеевропейская народная армия"
 GER_r56rp_european_army_3_desc:0 "ZPNA или Общенациональная армия Золльверейна - это кооперативная военная сила, созданная членами Цолльверейн для повышения военной готовности и сотрудничества между членами."
 GER_r56rp_european_army_4:0 "Общеевропейская народная армия"
 GER_r56rp_european_army_4_desc:0 "ZPNA или Общенациональная армия Золльверейна - это кооперативная военная сила, созданная членами Цолльверейн для повышения военной готовности и сотрудничества между членами."
 GER_r56rp_cooperative_resource_advancedments_1:0 "Совместное развитие добычи ресурсов"
 GER_r56rp_cooperative_resource_advancedments_2:0 "Совместное развитие добычи ресурсов"
 GER_r56rp_joint_industrial_planning_1:0 "Совместное промышленное планирование"
 GER_r56rp_collectivize_industry_idea:0 "Обобществлённая промышленность"
 GER_r56rp_socialist_consumer_market:0 "Социалистический потребительский рынок"
 GER_r56rp_german_revanchism:0 "Германский реваншизм"
 GER_r56rp_roterfrontkampferbund:0 "Союз красных фронтовиков"
 GER_r56rp_roterfrontkampferbund_desc:0 " «Пусть они будут дикими на оккупированных территориях, это поможет оккупационным властям иметь атакующих собак, которых они могут использовать»."
 GER_r56rp_establish_NVA_idea_1:0 "Статус NVA: начальная форма завершена"
 GER_r56rp_establish_NVA_idea_1_desc:0 "NVA была сформирована, но необходимо сделать еще больше, чтобы сделать ее эффективной боевой силой."
 GER_r56rp_establish_NVA_idea_2:0 "Статус NVA: нижний офицерский корпус восстановлен"
 GER_r56rp_establish_NVA_idea_2_desc:0 "НКО НВА были реформированы в соответствии с правительственной идеологией."
 GER_r56rp_establish_NVA_idea_3:0 "Статус NVA: Идеологические учения"
 GER_r56rp_establish_NVA_idea_3_desc:0 "В настоящее время НВА преподается обязательное учение об истории и идеологии Карла Маркса."
 GER_r56rp_establish_NVA_idea_4:0 "Статус NVA: реализованы тактики Schwerepunkt"
 GER_r56rp_establish_NVA_idea_4_desc:0 "У старой фашистской армии, к сожалению, были хорошие идеи, но лучше просто привить обычному солдату мысль о том, что мы сделали это сами."
 GER_r56rp_establish_NVA_idea_5:0 "Статус NVA: борьба днем и ночью"
 GER_r56rp_establish_NVA_idea_5_desc:0 "Наши солдаты и генералы научились лучше сражаться в течение ночи, гарантируя, что у нас всегда есть преимущество, независимо от времени."
 GER_r56rp_establish_NVA_idea_6:0 "Статус NVA: лучшее, что видел мир"
 GER_r56rp_establish_NVA_idea_6_desc:0 "Все немецкие гражданские лица в возрасте 18 лет призываются на 1 год в NVA, обеспечивая каждому гражданину мужского пола необходимую подготовку для борьбы, если это необходимо."
 GER_r56rp_establish_NVA_idea_7:0 "Статус NVA: §RОн воскрес!§!"
 GER_r56rp_establish_NVA_idea_7_desc:0 "§R Это того стоило, Талман?§!"
 GER_r56rp_karl_marx_called_you_cringe:0 "Карл Маркс заявил, что вы съежились из-за использования чит-движка"
 GER_r56rp_karl_marx_called_you_cringe_desc:0 "Даже когда борются с капиталистами, обман не приносит пользы."
 GER_r56rp_kriegsmarine_modifier:0 "Кригсмарин"
 GER_modify_com_kriegsmarine:0 "изменять §YКригсмарин§! через\n"
