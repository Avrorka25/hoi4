 GER_r56rp_remove_mefo_tt:0 "Убрать национальный дух §YВекселя MEFO§!"
 GER_mio_r56rp_opel:0 "Массовое производство"
 GER_r56rp_a_new_reich_1_tt:0 "§Y[GER.GetNeutralParty] популярностью является§! §Rниже 40%§!§YНизкие шансы на бескровный переворот.§!\n"
