 GER_r56rp_colonial_army:0 "Немецкая колониальная Шутцтрюппе"
 GER_r56rp_colonial_army_desc:0 "Мы должны воссоздать колониальные вооруженные силы, которые когда-то были известны и уважаемы, — Шутцтруппе, и вновь включить местных жителей в состав вооруженных сил. Это поможет нам защитить наши колониальные владения и сдержать любые восстания или преступную деятельность в наших колониях. Это также позволит жителям наших колоний получить работу в армии, которая обеспечит их лояльность к постоянно растущей Империи."
 GER_r56rp_colonial_idea:0 "Немецкие колониальные рейхи"
 GER_r56rp_colonial_idea_desc:0 "Немецкие традиции внешней морской торговли восходят к Ганзейскому союзу. Немецкие эмигранты летели на восток в направлении Прибалтики, России и Трансильвании и на запад в Америку. Таким образом, мы должны снова продвигать эту культуру торговли, связанную с иммиграцией, на всей территории нашей недавно приобретенной Империи."
 r56rp_GER_demand_northern_schleswig:0 "Потребовать Северный Шлезвиг"
 r56rp_GER_demand_northern_schleswig_desc:0 "Северный Шлезвиг был отнят у нас и передан датчанам по Версальскому договору. Мы должны потребовать возвращения этой земли!"
 GER_r56rp_formation_of_the_nva_category:0 "Национальная армия фольков"
 GER_r56rp_formation_of_the_nva_category_desc:0 "Nationale Volks Armee — новая немецкая армия, следуя учению Карла Маркса. Для того, чтобы эта армия соответствовала его имени, необходимо многое сделать для того, чтобы НВА соответствовала наследию, которое она защищает."
 GER_r56rp_rehabilitate_lower_officer_corp:0 "Реабилитировать нижний офицерский корпус"
 GER_r56rp_ideological_teaching_of_karl_marxs:0 "Идеологическое учение Карла Маркса"
