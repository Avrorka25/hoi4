 GER_r56rp_growing_pains_modifier:0 "Административные трудности"
 GER_r56rp_growing_pains_modifier_desc:0 "С нашим продолжающимся объединением германского народа Берлин сталкивается с постоянно растущим бременем управления вновь интегрированными территориями."
 GER_modify_com_addi:0 "изменять §YАдминистративные трудности§! через\n"
