 GER_growing_pains_6_reduced_tt:0 "Сократить будет §YАдминистративные трудности§! Наказание, а также будущие пенитенциарные элементы пангерманизма."
 rpgermany.1.t:0 "Немецкое братство"
 rpgermany.1.d:0 "С ростом напряженности в Европе мы оказываемся между многими сильными странами, такими как Европа. [SOV.GetNameDefCap], [ENG.GetNameDefCap] или [FRA.GetNameDefCap]Мы должны просить наших германских братьев объединиться против всех и сражаться вместе как единое германское государство!"
 rpgermany.2.t:0 "Предложение от императоров"
 rpgermany.2.d:0 "[FROM.GetNameDefCap] Он предложил нам договор, в котором Великое германское братство было предусмотрено Имперским рейхстагом, нам предлагалось мирное объединение или испытание в бою, в котором мы могли бы победить в войне. Или же, столкнувшись с яростью германской армии и понеся сокрушительные потери, выбор за нами."
 rpgermany.1.b:0 "Отправить «Ультиматум»"
 rpgermany.2.a:0 "У нас нет выбора."
 rpgermany.2.b:0 "Встань и сражайся!"
 rpgermany.3.t:0 "Возвращение дипломатов"
 rpgermany.3.d:0 "Наши дипломаты вернулись из Копенгагена, мы много дней ждали, когда они вернутся. [DEN.GetNameDefCap] Ответ.. Посмотрим, что они сказали."
 rpgermany.3.a:0 "Это все будет?"
 rpgermany.4.t:0 "Наследие Zimmermann Telegram"
 rpgermany.4.d:0 "Мы намерены начать с первого февраля неограниченную подводную войну. Мы будем стараться, несмотря на это, сохранить нейтралитет Соединенных Штатов Америки. В случае, если это не удастся, мы сделаем Мексике предложение или союз на следующей основе: воюйте вместе, заключайте мир вместе, щедрая финансовая поддержка и понимание с нашей стороны того, что Мексика должна отвоевать потерянную территорию в Техасе, Нью-Мексико и Аризоне. Поселение в деталях оставлено за вами. Вы самым тайным образом проинформируете об этом президента, как только начнется война с Соединенными Штатами Америки. С этими словами Циммерман толкнул к войне, мы теперь просим вас присоединиться к нам в нашей борьбе против американского угнетения и их непоколебимой воли стать правителями мира. Настало время действовать!"
 rpgermany.4.a:0 "Мы будем сражаться вместе!"
 rpgermany.4.b:0 "Это слишком рискованно!"
 rpgermany.5.t:0 "Немцы требовали наши территории!"
 rpgermany.5.d:0 "Недавно вернувшаяся Германская империя потребовала от нас вернуть земли, отнятые у них по Версальскому договору. Они угрожали нам войной, если мы не уступим Эльзаса Лотрингена и их бывшие имперские колонии. Если мы сейчас пойдем на уступки, то сможем избежать кровопролития, но гибель миллионов французов в Великой войне будет напрасной!"
 rpgermany.5.a:0 "Французы уступили законные германские территории. Слава кайзеррейху!"
 rpgermany.5.b:0 "Французы отвергли наши законные претензии и дорого заплатят за это! На этот раз Версальского договора не будет!"
 rpgermany.6.t:0 "Предложение мира [FROM.GetName]"
 rpgermany.6.d:0 "В свете продолжающегося конфликта и сложных обстоятельств, с которыми сталкиваются Соединенные Штаты, мы, Германская империя, предлагаем мир и разрешение. Поскольку война против наших сил создала значительную нагрузку на вашу страну, мы считаем, что принятие нашего предложения обеспечит путь к более благоприятному исходу для всех вовлеченных сторон. Соединенные Штаты проявили стойкость и мужество перед лицом невзгод, но очевидно, что волна конфликта повернулась против вас. Продолжение военных действий приведет лишь к дальнейшим человеческим жертвам, разрушениям и длительным страданиям. Принимая наше предложение, вы можете избежать дополнительных жертв и избавить своих граждан от разрушительных последствий продолжающейся войны."
 rpgermany.6.a:0 "... Мы любезно принимаем..."
 rpgermany.6.b:0 "Никогда! Пусть эти Джерри гниют на земле Свободных!"
 rpgermany.7.t:0 "Америка отказывается от мира!"
 rpgermany.7.d:0 "Наше любезное предложение мира было отвергнуто, мы будем настаивать и заберем Вашингтон к Рождеству!"
 rpgermany.7.a:0 "О, человечество..."
 rpgermany.8.t:0 "Америка согласилась на мир"
 rpgermany.8.d:0 "Наше благодатное предложение мира было принято, американцы будут жить дальше, чтобы сражаться в другой день, когда мы победим в нашем завоевании Нового Света!"
 rpgermany.8.a:0 "Слава Богу, они увидели причину и прекратили это бесконечное кровопролитие!"
 rpgermany.9.t:0 "Германия хочет пересмотреть военно-морские ограничения"
 rpgermany.9.d:0 "[GetAdjectiveCap] Дипломаты спрашивали о пересмотре военно-морских ограничений, наложенных на них англо-германским договором, приводя в качестве причины морскую сафти. Снятие ограничений может обогреть наши отношения, но это также может угрожать нашему морскому доминированию в будущем."
 rpgermany.9.a:0 "Пусть у них есть свои лодки."
 rpgermany.9.b:0 "Отказаться от договора."
 rpgermany.9.c:0 "§RОткажитесь и наложите эмбарго на джерри!§!"
