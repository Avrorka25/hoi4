 bra_feb_idea:0 "[BRA.GetAdjective] экспедиционные силы"
 bra_feb_idea_desc:0 "Знаете, откуда я родом? Я родом с холмов, с ферм. Из джунглей, с кофейных плантаций. Из края кокосовых пальм. Из маленькой хижины, где одному тесно, вдвоём хорошо, а втроём — прекрасно!"
