 BRA_uiracu_desc:0 "Гарпия, также называемая королевским ястребом, а коренными народами — Уирасу, является более крупной, агрессивной и внушительной хищной птицей, чем белоголовый орлан, которого так почитают американцы. Подобно ястребу, парящему над нашей землёй, Бразилия станет хищником в своей среде, а бразильский народ — объединителем континента."
