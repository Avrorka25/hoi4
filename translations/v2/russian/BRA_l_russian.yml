 POLITICS_DUTRA_DESC:0 "Эурику Гаспар Дутра родился в небольшом городе Куяба в провинции Мату-Гросу. Интерес к армии и огромное стремление служить заставили его подделать документы, чтобы быть призванным в возрасте 19 лет и поступить в Военную академию «Прайя-Вермелья» в Рио-де-Жанейро, которую он успешно окончил в 23 года.\n\nЕго военная карьера была связана с артиллерией, военной инженерией и армейской тактикой, а также с верностью Бразильской Республике и её руководству, которую он демонстрировал, подавляя различные мятежи и восстания во внутренних районах страны.\n\nПродвижение по службе до полковника, а затем до командующего армией привело его на пост военного министра, который он занимает с 1936 года."
