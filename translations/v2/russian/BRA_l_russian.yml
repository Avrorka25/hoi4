 bra_antropofagia_imperial_fascista:0 "Культурная антропофагия"
 bra_antropofagia_imperial_neutra:0 "Культурная антропофагия"
 bra_antropofagia_neu_1_desc:0 "Хотя модернисты описали это явление лишь недавно, усвоение обычаев других культур и их приспособление к национальной действительности является основой [BRA.GetAdjective] идентичности. [BRA.GetNameDefCap] — не страна разных культур, сосуществующих на одной территории, а единая [BRA.GetAdjective] культура, возникшая из смешения европейских, африканских, азиатских и коренных традиций. Поэтому принадлежность к [BRA.GetAdjective] народу определяется не расой или обычаями, а использованием родного языка и ощущением связи с [BRA.GetNameDef]. Эта особенность породила разочарованный народ и мало заинтересованное во внешних делах правительство, но одновременно высокую стойкость, терпимость к другим культурам и верность граждан [BRA.GetAdjective] самобытности."
