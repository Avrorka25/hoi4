 bra.1.t:0 "Знаменитая касса Адемара"
 bra.1.d:0 "Теперь, когда мы наконец стоим на пороге восстановления демократии, необходимо выбрать лидера на следующие пять лет. Адемар де Баррус — бывший интервентор Сан-Паулу: он строил дороги, расширял промышленность и восстанавливал штат. Арманду Салис — давний борец за демократию: управляя Сан-Паулу, он обеспечил штату высочайшие на континенте образовательные стандарты. Бригадир Эдуарду Гомес — бывший офицер бразильских ВВС и центральная фигура всё ещё существующего движения тенентистов. Жулиу Престис был избран президентом в 1930 году, но свергнут переворотом того же года; он принадлежит к аграрной элите и ранее возглавлял РПП. Настало время принять решение."
 bra.1.a:0 "Если он восстановил Сан-Паулу, почему не сможет восстановить [BRA.GetNameDef]?"
 bra.1.b:0 "Нашей демократии нужен тот, кто никогда от неё не отступал."
 bra.1.c:0 "Я не понимаю, как такая страна, как Бразилия, после долгих лет демократических традиций могла скатиться к диктатуре, унижающей нас в глазах цивилизованного мира!"
 bra.1.e:0 "Для нас мудрость рождается из последствий сделанного выбора."
 bra.1.f:0 "Будущее — не то, чего мы боимся, а то, чего осмеливаемся достичь!"
 bra.2.t:0 "План Коэна"
 bra.2.d:0 "Через капитана Моуранa в наши руки попал документ, предположительно составленный НОА. В нём подробно изложен план убийства кандидатов на выборах 1938 года — Арманду Салиса и Жозе Америку. Необходимо принять меры, хотя разведка не может подтвердить подлинность документа."
 bra.2.a:0 "Несите микрофон! Нельзя терять время."
 bra.2.b:0 "Арестовать капитана и сжечь документ! Нельзя позволить этой инсценировке распространиться."
 bra.2.c:0 "Мы должны приспособить политический организм к нуждам отечества."
 bra.2.e:0 "Нельзя лишать их свобод из-за документа, который, вероятно, является подделкой!"
 bra.3.t:0 "Конгресс распущен!"
 bra.3.d:0 "Столкнувшись с коммунистической угрозой, о которой сообщил досточтимый капитан Моуран, президент Жетулиу Варгас решил принять последнюю необходимую меру для предотвращения будущего социалистического переворота на федеральной территории. После того как фельдмаршал Дутра и генерал Гойс Монтейру вынудили Конгресс объявить осадное положение, Его Превосходительство решил полностью распустить его. Затем он провозгласил новую конституцию, уничтожив уже вторую за семь лет. «Полака» расширит полномочия президента, запретит политические партии и разгромит социалистические силы в Национальном конгрессе."
 bra.3.a:0 "Мы отвечаем законным чаяниям [BRA.GetAdjective] народа."
 bra.5.t:0 "Император Бразилии"
 bra.5.d:0 "Теперь, когда народ провозгласил императора, встал вопрос о его идеологии. Интегралисты утверждают, что он экспансионист и провидец, который вернёт Бразилии славу. Другие считают, что независимо от взглядов император прежде всего должен быть рассудительным и умеренным. Кто прав?"
 bra.5.b:0 "Ради Христа, он император, а не политик!"
 bra.5.a:0 "Император прежде всего должен быть мудрым и рассудительным."
 bra.6.t:0 "Приглашение [BRA.GetNameDefCap] в её альянс"
 bra.6.d:0 "Добившись прорыва в международной дипломатии и став новой великой державой, [BRA.GetNameDef] приглашает нас в свой альянс ради процветания и гарантированной защиты. Присоединимся ли мы?"
 bra.6.a:0 "Разумеется!"
 bra.6.b:0 "Лучше не стоит."
 bra.7.t:0 "[BRA.GetNameDefCap] хочет вступить в наш альянс"
 bra.7.d:0 "[BRA.GetNameDefCap] попросила принять её в наш альянс, чтобы помочь нам на мировой арене. В условиях войны возникает вопрос: нужна ли нам поддержка южноамериканцев?"
 bra.7.a:0 "Да, разумеется!"
 bra.7.b:0 "Они нам не нужны!"
 bra.8.t:0 "[BRA.GetNameDefCap] предлагает союз"
 bra.8.d:0 "Добившись прорыва в международной дипломатии и став новой великой державой, [BRA.GetNameDef] приглашает нас в свой альянс ради процветания и гарантированной защиты. Присоединимся ли мы?"
 bra.8.a:0 "Разумеется!"
 bra.8.b:0 "Лучше не стоит."
 bra.12.t:0 "Разорвать зелёно-жёлтые путы"
 bra.12.d:0 "С созданием нового национального правительства под руководством наших политиков и народа установленная федеральной властью администрация отступает и ищет убежища в материковой Бразилии. Вместе с ней уходит извращённая идеология, которую нам навязывали всё время, пока мы были подданными Департамента печати и пропаганды. Теперь наша судьба принадлежит нам."
 bra.12.a:0 "Свободны! Наконец-то!"
 bra.13.t:0 "Варгас убит!"
 bra.13.d:0 "Во время великого выступления за освобождение пролетариата десятки сторонников, поддержанные тысячами людей на улицах Рио-де-Жанейро, окружили и штурмовали дворец Катете. Через несколько часов глава буржуазии Жетулиу Варгас был мёртв, а господин Луис Карлус Престис провозглашён новым президентом Республики."
 bra.13.a:0 "До свидания, господин Варгас."
 bra.14.t:0 "Варгас изгнан!"
 bra.14.d:0 "Во время великого выступления граждан всех народов и рас тысячи интегралистов окружили дворец Катете и пригрозили штурмом. Через несколько часов президент Варгас бежал в Риу-Гранди-ду-Сул, а доктор Плиниу Салгаду занял положенный ему пост нового президента Республики."
 bra.14.a:0 "Анауэ!"
 bra.15.t:0 "Варгас укрепился у власти!"
 bra.15.d:0 "Созданный для координации пропаганды национального государства Департамент печати и пропаганды, связанный с разведывательными структурами федерального правительства, обеспечит сохранение власти президента Республики господина Жетулиу Варгаса."
 bra.15.a:0 "Конституционный режим утратил практическую ценность."
 bra.16.t:0 "Варгас отстранён!"
 bra.16.d:0 "Во время великого выступления за свободу Отечества объединённые силы армии, флота и авиации окружили дворец Катете в поддержку Национального конгресса. Под давлением избранной группы генералов и адмиралов господин Жетулиу Варгас в течение нескольких часов вернул власть над Республикой Национальному конгрессу и [BRA.GetAdjective] народу."
 bra.16.a:0 "Для нас, смертных, мудрость рождается из последствий сделанного выбора."
 bra.17.t:0 "Чума опустошает плантацию Белтерры"
 bra.17.d:0 "Каучуковая плантация Белтерра была создана компанией «Форд», чтобы выращивать каучук для собственных заводов и не зависеть от внешних поставщиков. Это была уже вторая плантация в стране, поскольку первая — Фордландия — закрылась в 1934 году. Новое предприятие должно было стать прибыльнее благодаря более плотной посадке гевей и увеличению урожайности с единицы площади. Однако практика обернулась против владельцев: заразная болезнь внезапно уничтожила почти всю плантацию, остановив производство как минимум на пять лет. В ближайшем будущем плантационный каучук не сможет снабжать производство военной техники, если только не отправить людей собирать дикорастущий каучук — куда более тяжёлым способом."
 bra.17.a:0 "Какая трагедия."
