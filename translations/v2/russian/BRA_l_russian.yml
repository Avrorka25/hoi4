l_russian:
 BRA_national_congress:0 "Национальный конгресс"
 BRA_canrobert_pereira_da_costa:0 "Канроберт Перейра да Коста"
 BRA_newton_estillac_leal:0 "Ньютон Эстиллак Леал"
 BRA_cyro_espirito_santo_cardoso:0 "Сиру Эспириту Санту Кардозу"
 BRA_odilio_denys:0 "Одилиу Денис"
 BRA_joao_gomes_ribeiro:0 "Жуан Гомес Рибейру"
 BRA_antonio_alves_camara:0 "Антониу Алвес Камара"
 BRA_ernesto_de_araujo:0 "Эрнесту де Араужу"
 BRA_alfredo_carlos_soares_dutra:0 "Алфреду Карлус Соарес Дутра"
 BRA_juscelino_kubitschek:0 "Жуселину Кубичек"
 BRA_jorge_martins_r56:0 "Жоржи Додсворт Мартинс"
 BRA_amilcar_sergio_velloso_pederneiras:0 "Амилкар Сержиу Веллозу Педернейрас"
 BRA_antonio_apel_neto:0 "Антониу Апел Нету"
 BRA_armando_trompowsky:0 "Арманду Тромповски"
 BRA_julio_caetano_horta_barbosa:0 "Жулиу Каэтану Орта Барбоза"
 BRA_mario_xavier:0 "Мариу Шавьер"
 BRA_jose_guiomard:0 "Жозе Гиомар"
 BRA_pedro_aurelio_de_gois_monteiro:0 "Педру Аурелиу де Гойс Монтейру"
 BRA_firmo_freire_do_nascimento:0 "Фирму Фрейри ду Насименту"
 BRA_pedro_henrique_iii:0 "Дом Педру III"
 brazilian_focus:0 "Национальные фокусы Бразилии"
 BRA_integrate_uruguay:0 "Интегрировать Уругвай"
 BRA_take_uruguay:0 "Вернуть Уругвай"
 BRA_take_uruguay_desc:0 "С тех пор как Уругвай провозгласил независимость от нас в 1828 году, утрата этого жизненно важного региона остаётся болезненным воспоминанием. Настало время вернуть то, что принадлежит нам по праву!"
 POR_lisbon_pact:0 "Лиссабонский пакт"
 BRA_license_with_the_soviets:0 "Лицензионные соглашения с [SOV.GetAdjective] стороной"
 BRA_license_with_the_soviets_desc:0 "Наши исследования отстают от великих держав. Создание возможностей для сокращения разрыва займёт много времени, но пока мы можем попытаться получить разрешение на производство техники [SOV.GetNameDef] в [BRA.GetNameDef]. Учитывая стоимость сделки, следует договориться о небольшой скидке."
 BRA_license_with_the_soviets_tt:0 "([SOV.GetFlag]§Y[SOV.GetName]§!) Получает событие «§Y[BRA.GetNameDefCap] ищет соглашение о лицензионном производстве§!» \n \n Вероятность согласия выше при §Yхорошем отношении к нам!§!"
 BRA_the_latin_american_socialist_cooperative:0 "Латиноамериканский социалистический кооператив"
 BRA_the_latin_american_socialist_cooperative_desc:0 "Многие разделяют наши представления о том, каким должно быть коммунистическое общество. Настало время открыться сотрудничеству с этими странами, чтобы вместе отстаивать наше дело!"
 BRA_establish_ulasr:0 "Создать ССЛАР"
 BRA_establish_ulasr_desc:0 "Наше революционное движение продолжает разрушать структуры буржуазного общества по всему континенту. Очевидно, что мы больше не движение [ROOT.GetAdjective] народа — мы движение южноамериканцев, и политические структуры должны отражать эту перемену."
 BRA_end_south_american_capitalism:0 "Покончить с капитализмом в Южной Америке"
 BRA_end_south_american_capitalism_desc:0 "Буржуазная демократия и капитализм продолжают подрывать права и условия жизни многих южноамериканцев. Мы должны сделать всё возможное, чтобы освободить товарищей по всему континенту от угнетателей."
 BRA_2_comunist_putsch:0 "Второй коммунистический путч"
 BRA_2_comunist_putsch_desc:0 "В 1935 году Национальный освободительный альянс подорвал власть Жетулиу. Теперь, обладая значительной народной поддержкой, коммунисты вновь получили возможность превратить Бразилию в социалистическое государство."
 BRA_2_integralist_levant:0 "Интегралистское восстание"
 BRA_2_integralist_levant_desc:0 "Долгое время интегралисты поддерживали Жетулиу. Теперь националисты должны занять заслуженное место хозяев будущего Бразилии."
 BRA_R56_the_second_communist_putsch:0 "Второй коммунистический путч"
 BRA_R56_the_second_communist_putsch_desc:0 "Национальный освободительный альянс попытался совершить переворот против президента Варгаса. Теперь, заручившись поддержкой рабочих и народа, марксисты получили возможность создать в Бразилии славную эгалитарную социалистическую республику!"
 BRA_R56_non_dvcor_dvco:0 "Не мной руководят — я руковожу"
 BRA_R56_non_dvcor_dvco_desc:0 "После более чем века конституционного правления и либерализма страна скатилась к безудержной и неограниченной диктатуре, которая унижает и истощает нас перед цивилизованным миром!"
 BRA_R56_usiminas:0 "УСИМИНАС"
 BRA_R56_usiminas_desc:0 "«Металлургические заводы Минас-Жерайса» станут ведущей сталелитейной компанией по производству и продаже горячекатаной и холоднокатаной стали, рулонов, слябов и покрытых изделий, прежде всего для отраслей капитальных и потребительских товаров, а также автомобильной промышленности."
 BRA_R56_a_revolta_da_armada:0 "Восстание флота"
 BRA_R56_a_revolta_da_armada_desc:0 "Необходимо приспособить действия [BRA.GetAdjective] кораблей и тактику морских командиров к современной войне на море. В качестве опыта можно использовать Восстание флота 1893 года."
 bra_amigo_alemanha:0 "Дипломатический суверенитет"
 bra_amigo_alemanha_desc:0 "Пока [BRA.GetNameDef] не будет переустроена, избавлена от зла корыстной партийности, а бразильская власть не начнёт выражать интересы классов и направлять нацию разумом элит, мы не прекратим навязываемую нами пропаганду."
 bra_amigo_aliados:0 "Дело Союзников"
 bra_amigo_aliados_desc:0 "Как и всегда, мы выступим на стороне Союзников, защищающих свободу и либерализм."
 bra_amigo_argentina:0 "Наш величайший враг?"
 bra_amigo_argentina_desc:0 "Наш величайший враг, [ARG.GetNameDef], сталкивается с теми же проблемами, что и мы. Настало время отложить разногласия ради нашей независимости."
 bra_amigo_eua:0 "Назначить Освалду Аранью"
 bra_amigo_eua_desc:0 "Мы можем поручить Освалду Аранье проводить политику, направленную на снижение напряжённости с мировыми демократиями."
 bra_amigo_portugal:0 "Наша бывшая метрополия"
 bra_amigo_uk:0 "Договор о торговле и мореплавании"
 bra_amigo_uk_desc:0 "Мы можем возобновить Договор о торговле и мореплавании, первоначально подписанный домом Жуана VI с Англией, чтобы получить больше ресурсов для промышленного расширения, а они — больше средств для снабжения [ENG.GetAdjective] военной машины."
 bra_amigo_urss:0 "Искать союза с Советами"
 bra_amigo_urss_desc:0 "Союз с [SOV.GetNameDef] необходим для обеспечения победы коммунизма в наших двух странах."
 BRA_R56_analyze_the_paulista_war:0 "Изучить Паулистскую войну"
 BRA_R56_analyze_the_paulista_war_desc:0 "Гражданская война в Бразилии стала полигоном для испытания возможных эффективных боевых тактик."
 BRA_R56_minas_gerais_war_doctrine:0 "Военная доктрина Минас-Жерайса"
 BRA_R56_minas_gerais_war_doctrine_desc:0 "Во время конфликта войска Минас-Жерайса и офицеры этого штата, руководившие армией, понимали, что Сан-Паулу не сможет долго продолжать войну. Поэтому минейрос окапывались. Стационарные пулемёты поддерживали траншеи, а огонь национальной артиллерии обеспечивал медленное, но уверенное продвижение."
 BRA_R56_sao_paulos_war_doctrine:0 "Военная доктрина Сан-Паулу"
 BRA_R56_sao_paulos_war_doctrine_desc:0 "Общественные силы паулистов применяли в конфликте манёвренную войну и блицкриг. Планы штата Сан-Паулу предусматривали стремительный удар на Рио-де-Жанейро через долину Параиба, тогда как тыл должны были обеспечить другие штаты."
 bra_anhanguera:0 "Шоссе Анхангера"
 BRA_anhanguera:0 "Шоссе Анхангера"
 bra_anhanguera_desc:0 "Более протяжённое, чем большинство участков германских автобанов, шоссе «Анхангера» станет крупнейшим дорожным комплексом страны, а его качественные магистрали свяжут всю Бразилию."
 bra_anhanguera_tooltip:0 "Начнётся строительство SP-330 — шоссе Анхангера. Затем оно будет расширено до BR-050, соединяющей Гояс с городом Сан-Паулу. Строительство доведёт инфраструктуру штата Сан-Паулу до максимума, значительно улучшит инфраструктуру Гояса и Мату-Гросу и добавит всей стране 1 ячейку для промышленного развития."
 BRA_armor:0 "«Боевые танки»"
 bra_armor:0 "Боевые танки"
 bra_armor_desc:0 "Во время гражданской войны обе стороны применяли танки. Победа Союза отчасти была обеспечена использованием FT-17. Совершенствование их моделей принесёт армии огромное преимущество."
 BRA_R56_heavy_artillery:0 "Тяжёлая артиллерия"
 BRA_R56_heavy_artillery_desc:0 "Располагая большими ресурсами, чем противник, Союз импортировал артиллерию из-за рубежа. Точные орудия одним попаданием уничтожили целый паулистский отряд. Мы можем помочь военно-промышленным предприятиям расширить производственные центры до невиданного уровня."
 bra_aviso_tooltip:0 "§RСмена идеологии любым способом, кроме участия политических элит в переменах путём накопления достаточной поддержки для переворота, превращения в марионетку другой страны или смены правительства, будет воспринята элитами как нападение на их интересы. Они возмутятся тем, что их исключили из процесса, и откажутся участвовать во всех проектах.§!"
 BRA_R56_the_voice_of_brazil:0 "Голос Бразилии"
 BRA_R56_the_voice_of_brazil:0 "Оригинальное название: A Voz do Brasil"
 BRA_R56_the_voice_of_brazil_desc:0 "«Голос Бразилии» — обязательный государственный радиовыпуск новостей, ежедневно выходящий на всех общественных радиостанциях Бразилии в 19:00 по Гринвичу и продолжающийся один час. Он был создан бразильским правительством для распространения сведений о достижениях государства."
 BRA_R56_the_voice_of_brazil_desc:0 "«Голос Бразилии» - это радиофонная государственная программа обязательной диффузии, которая ежедневно выходит в эфир во всех странах. [BRA.GetAdjective] СМИ, способные распространять националистическую пропаганду."
 BRA_R56_stufy_the_war_of_attrition:0 "Изучить войну на истощение"
 BRA_R56_stufy_the_war_of_attrition_desc:0 "Благодаря терпению, технологическому превосходству и использованию пуль вместо людей войска Минас-Жерайса оказались самыми эффективными в войне и обеспечили Бразилии быструю победу над паулистами. Нельзя отвергать наследие минейрос."
 bra_basta:0 "Хватит!"
 bra_basta_desc:0 "Мы больше не потерпим кризисы, перевороты, ограничение промышленного развития импортом, эксплуатацию природных ресурсов, трансконтинентальное угнетение и дипломатическое высокомерие. Довольно!"
 BRA_R56_federal_economic_bank:0 "Федеральный экономический банк"
 BRA_R56_federal_economic_bank_desc:0 "Федеральная сберегательная касса, также известная как «Кайша», является государственным финансовым учреждением федерального правительства [BRA.GetAdjective] страны. Она располагает собственными активами, административной автономией и филиалами по всей стране."
 BRA_R56_construct_the_belem_naval_dockyard:0 "Построить военно-морскую верфь в Белене"
 BRA_R56_construct_the_belem_naval_dockyard_desc:0 "Строительство порта Белен даст стране стратегическую базу на севере, способную поддерживать огромные флоты Федерации и служить отправной точкой для вторжений к северу от экватора."
 BRA_R56_shock_and_awe:0 "Шок и трепет"
 BRA_R56_shock_and_awe_desc:0 "Паулисты доказали, что даже при численном меньшинстве скорость и самостоятельность войск обеспечивают успех в бою. Примем эту тактику, чтобы повысить боевую эффективность и одерживать над врагами стремительные сокрушительные победы!"
 BRA_R56_bndes:0 "БНДЭС"
 BRA_R56_bndes_desc:0 "Национальный банк экономического и социального развития станет федеральной государственной компанией со штаб-квартирой в Рио-де-Жанейро, основной задачей которой будет финансирование долгосрочных инвестиций во всех отраслях экономики, а также в социальной, региональной и экологической сферах."
 BRA_R56_eduardo_gomes_doctrine:0 "Доктрина Эдуарду Гомеса"
 BRA_R56_eduardo_gomes_doctrine_desc:0 "Хотя Союз применял бомбардировщики во время Гражданской войны, с тех пор они стали точнее и смертоноснее. Бригадир Эдуарду Гомес во время конфликта бомбил Кампинас, небольшой эскадрильей серьёзно повредив инфраструктуру города. Мы назначим его руководителем военно-воздушных сил."
 BRA_R56_a_new_federal_capital_brasilia:0 "Новая федеральная столица: Бразилиа"
 BRA_R56_a_new_federal_capital_brasilia_desc:0 "Перенос столицы в глубь страны был одной из национальных целей ещё со времён империи Педру II. Это повысит безопасность, избавив столицу от угрозы морского вторжения, и одновременно обеспечит развитие внутренних территорий. Начнём строительство новой столицы."
 BRA_R56_a_new_federal_capital_brasilia_tooltip:0 "Начнётся среднереспубликанская эпоха. Появятся новые политические партии и, следовательно, новый политический класс."
 BRA_R56_the_brazilian_action:0 "Бразильское действие"
 BRA_R56_the_brazilian_action_desc:0 "Подобно «Аксьон франсез», Бразильское интегралистское действие является реакционным движением, вдохновлённым великими свершениями и традициями прошлого страны. Его деятельность в образовательном и культурном центре государства окажется важной для укрепления национальной патриотической идентичности."
 BRA_R56_ministry_of_aeronautics:0 "Министерство авиации"
 BRA_R56_ministry_of_aeronautics_desc:0 "Создание Министерства авиации позволит правительству управлять этим новым родом вооружённых сил Республики."
 BRA_R56_close_air_support:0 "Непосредственная авиационная поддержка"
 BRA_R56_close_air_support_desc:0 "Возобновление работы и модернизация авиационного завода в Лагоа-Санта, расположенного в столичном регионе Белу-Оризонти, помогут увеличить численность военно-воздушных сил."
 bra_casacivil:0 "Гражданская канцелярия"
 bra_casacivil_desc:0 "Новой Гражданской канцелярии будут переданы все обязанности по консультированию президента Республики, обеспечению эффективной связи с министрами и парламентом и координации со всеми федеральными владениями."
 BRA_cepsn:0 "Национальный план развития металлургии"
 bra_chsf:0 "Гидроэлектрическая компания Сан-Франсиску"
 bra_chsf_desc:0 "Гидроэлектрическая компания Сан-Франсиску — публичная корпорация, занимающаяся выработкой и передачей электроэнергии высокого и сверхвысокого напряжения и использующая ресурсы бассейна реки Сан-Франсиску."
 BRA_R56_the_sugar_belt:0 "Сахарный пояс"
 BRA_R56_the_sugar_belt_desc:0 "Внедрение известкования и локального орошения позволит, несмотря на кислые почвы и сухой воздух, создать в Триангулу-Минейру и Нижнем Гоясе новый крупный регион выращивания сахарного тростника. Эта культура веками считалась устаревшей, но обладает будущим потенциалом благодаря прогнозируемому использованию спирта в промышленности и как топлива."
 BRA_R56_the_soy_belt:0 "Соевый пояс"
 BRA_R56_the_soy_belt_desc:0 "Современные методы осушения и механизация сельского хозяйства на национальном уровне позволят выращивать сою в изолированном Мату-Гросу. Ранее она никогда не культивировалась на национальной земле. Соя перспективна как продукт питания, экспортный товар и средство освоения внутренних районов."
 BRA_R56_support_heavy_industry_in_sao_paulo:0 "Поддержать тяжёлую промышленность Сан-Паулу"
 BRA_R56_support_heavy_industry_in_sao_paulo_desc:0 "Агломерация Сан-Паулу является крупнейшим промышленным центром страны и всей Латинской Америки, а при государственной поддержке сможет стать одним из крупнейших, если не крупнейшим, во всей Америке."
 BRA_R56_grande_valley_military_complex:0 "Военный комплекс долины Риу-Гранди"
 BRA_R56_grande_valley_military_complex_desc:0 "Правительство может субсидировать строительство комплекса по производству вооружений в долине Риу-Гранди, охватывающей запад Сан-Паулу и Триангулу-Минейру."
 BRA_R56_military_complex_of_the_parana_valley:0 "Военный комплекс долины Параны"
 BRA_R56_military_complex_of_the_parana_valley_desc:0 "Правительство может субсидировать строительство комплекса по производству вооружений в долине реки Парана, охватывающей юг Сан-Паулу и почти весь штат Парана."
 BRA_R56_military_complex_of_the_parnaiba_valley:0 "Военный комплекс долины Парнаибы"
 BRA_R56_military_complex_of_the_parnaiba_valley_desc:0 "Правительство может субсидировать строительство промышленного комплекса вооружений в долине реки Парнаиба на северо-востоке Бразилии."
 BRA_R56_national_defense_council:0 "Совет национальной обороны"
 BRA_R56_national_defense_council_desc:0 "Совет национальной обороны — консультативный орган президента Бразилии по вопросам национальной безопасности, внешней политики и оборонной стратегии, созданный последним президентом Первой республики Вашингтоном Луисом. Он консультирует президента при объявлении войны или заключении мира, введении режима обороны, осадного положения или федерального вмешательства."
 bra_cosipa:0 "КОСИПА"
 bra_cosipa_desc:0 "Металлургическая компания Сан-Паулу будет производить плоский непокрытый стальной прокат для стратегических отраслей экономики: автомобилестроения, железных дорог, судостроения, гражданского строительства, сельского хозяйства, упаковки, машиностроения, электроники, бытовой техники, оборудования и дистрибуции."
 BRA_R56_under_a_single_banner:0 "Под единым знаменем"
 BRA_R56_under_a_single_banner_desc:0 "[BRA.GetNameDefCap]Культурное и этническое многообразие и его первенство в социально-либеральных и неомарксистских движениях являются одним из его преимуществ как бастиона Рабочей революции. Пропаганда грамматической мысли через национальную систему образования пойдет на пользу революционному государству."
 BRA_R56_encouracados:0 "Линкоры"
 BRA_R56_encouracados_desc:0 "Со времён независимости Бразилия держала в своём арсенале величайших морских чудовищ. И впредь будет так же."
 bra_csn:0 "Национальная металлургическая компания"
 bra_csn_desc:0 "Мы разработали Национальный металлургический план, чтобы определить районы добычи железной руды и создать в Бразилии центры производства стали."
 BRA_R56_council_for_economics_and_finances:0 "Совет по экономике и финансам"
 BRA_R56_council_for_economics_and_finances_desc:0 "Технический совет по экономике и финансам был создан для помощи президенту в принятии экономических и стратегических решений."
 bra_cuba_rev:0 "Освободить Кубу"
 bra_cuba_rev_desc:0 "«Задний двор» [USA.GetNameDef] больше не будет таковым. Мы освободим Кубу от угнетателей и используем её как плацдарм для морских операций против [USA.GetAdjective] территории."
 bra_diplomacia:0 "Итамарати"
 bra_diplomacia_desc:0 "Мы можем расширить деятельность Итамарати, чтобы уделять больше внимания мировым делам."
 bra_dofa_tooltip:0 "Получает национальные территории и цели войны против Уругвая и Парагвая"
 BRA_R56_the_october_manifesto:0 "Октябрьский манифест"
 BRA_R56_the_october_manifesto_desc:0 "[BRA.GetAdjective] нация должна быть организованной, единой, неделимой, сильной, могущественной, богатой, процветающей и счастливой. Для этого все [BRA.GetAdjective] граждане должны объединиться. Но [BRA.GetNameDef] не сможет достичь полного и совершенного единства своих детей, пока внутри государства существуют другие государства, а политические партии дробят нацию."
 bra_eixo:0 "Принцип власти"
 bra_eixo_desc:0 "Присоединившись к [GER.GetNameDef], мы сможем безопасно обеспечить континентальную экспансию. Некоторые влиятельные депутаты из Санта-Катарины видят будущее в создании общей империи."
 BRA_R56_modernize_the_electrical_infrastructure:0 "Расширить электрическую инфраструктуру"
 BRA_R56_modernize_the_electrical_infrastructure_desc:0 "Расширение электросетей во всех столицах штатов и городских центрах, таких как запад Сан-Паулу и Эспириту-Санту, повысит качество жизни [BRA.GetAdjective] населения и эффективность национальной промышленности."
 BRA_R56_expand_the_high_voltage_grid:0 "Расширить сеть высокого напряжения"
 BRA_R56_expand_the_high_voltage_grid_desc:0 "Расширение энергосети в промышленно слаборазвитые районы, такие как Триангулу-Минейру, Парана и Баия, может создать новые производственные центры и ускорить развитие страны."
 BRA_R56_end_the_occupation:0 "Завершить оккупацию"
 BRA_R56_end_the_occupation_desc:0 "В штатах [498.GetName] и [1004.GetName] действует военное положение с конца 1935 года, когда там были подавлены коммунистические восстания. Теперь стабильность восстановлена, и пора вернуть население к нормальной жизни."
 BRA_R56_legacy_of_martinelli:0 "Наследие Мартинелли"
 BRA_R56_legacy_of_martinelli_desc:0 "Иммигрант Джузеппе Мартинелли разбогател в Бразилии на трансатлантической торговле. В Сан-Паулу он задумал построить самое высокое здание Латинской Америки. Изменив проект и перегрузив конструкцию, но не позволив заложить новые основания, он сэкономил время и ресурсы и обеспечил завершение памятника. Нам есть чему у него научиться."
 bra_entrar_comintern:0 "Мировая революция!"
 bra_entrar_comintern_desc:0 "[SOV.GetNameDefCap] и [BRA.GetNameDef] укрепили подлинную мировую революцию пролетариата. Мы должны закрепить союз, чтобы защитить рабочих и освободить угнетённых."
 BRA_R56_imbel:0 "ИМБЕЛ"
 BRA_R56_imbel_desc:0 "Вместо моторизации пехоты минейрос повысили её боевую эффективность. Снаряжение легалистской пехоты было современнее, быстрее и точнее, чем у паулистов, что облегчало оборону траншей. Мы можем заключить контракты с оружейными предприятиями, чтобы вновь модернизировать пехоту."
 BRA_R56_the_estado_novo:0 "Новое государство"
 BRA_R56_the_estado_novo_desc:0 "Благодаря своей мудрости и промышленному первенству централизованное государство способно обеспечить общее благополучие граждан и процветание предпринимателей. Вечный союз рабочих, воинов и целеустремлённых деловых людей Республики гарантирует прочное [BRA.GetAdjective] единство."
 bra_etanol:0 "Проалкоол"
 bra_etanol_desc:0 "Никогда прежде сельское хозяйство не обладало таким потенциалом для [BRA.GetAdjective] экономики и военной машины. Выращивание сои и сахарного тростника во внутренних районах и исследования федеральных университетов, финансируемые крупными землевладельцами, позволили частично заменить бензин очищенным этанолом. «Проалкоол» станет федеральной программой, обеспечивающей работу автомобилей, произведённых в [BRA.GetNameDef], на спиртовом топливе."
 BRA_R56_the_brazilian_expeditionary_force:0 "[BRA.GetAdjective] экспедиционные силы"
 BRA_R56_the_brazilian_expeditionary_force_desc:0 "Наши логистические, тактические, организационные, промышленные и людские возможности позволяют направлять экспедиции за рубеж для защиты интересов Республики от тех, кто осмелится нанести удар."
 BRA_R56_strengthen_local_governments:0 "Укрепить местные правительства"
 BRA_R56_strengthen_local_governments_desc:0 "[BRA.GetNameDefCap] разделена культурно, географически и экономически. Предоставление субъектам федерации относительной автономии под властью федерального правительства является эффективным способом гарантировать свободу граждан и полноту их конституционных прав."
 BRA_R56_federal_institutes:0 "Федеральные институты"
 BRA_R56_federal_institutes_desc:0 "Федеральные институты являются подразделениями университетов, полностью посвящёнными практическим технологическим инновациям."
 BRA_R56_federal_universities:0 "Федеральные университеты"
 BRA_R56_federal_universities_desc:0 "Федеральные университеты одновременно служат образовательными центрами и очагами технологических инноваций. Эффективное использование их научных достижений отвечает интересам правительства."
 BRA_R56_fiesp:0 "ФИЕСП"
 BRA_R56_fiesp_desc:0 "Федерация промышленности штата Сан-Паулу представляет тысячи профсоюзов и предприятий. Согласование планов правительства с их интересами позволит объединить полезное с приятным и усилить нашу способность внедрять новые производственные решения как в потребительском, так и в военном секторе."
 bra_foro_de_sao_paulo_focus:0 "Рабочий конгресс Латинской Америки"
 bra_foro_de_sao_paulo_focus_desc:0 "Форум Сан-Паулу — международная конференция левых политических партий, приглашающая другие партии и организации американских левых обсуждать альтернативы либеральной политике."
 BRA_fundar_petrobras:0 "«Петробрас»"
 BRA_fundar_vale:0 "«Вали-ду-Риу-Доси»"
 BRA_R56_gerdau:0 "ЖЕРДАУ"
 BRA_R56_gerdau_desc:0 "«Жердау С.А.», также известная как группа «Жердау», является [BRA.GetAdjective] сталелитейной корпорацией. Обсуждается привлечение компании для расширения сталелитейной отрасли и межотраслевой инфраструктуры."
 BRA_glory_to_brasil:0 "Оспорить доктрину Монро"
 BRA_ideological_propaganda:0 "Идеологическая пропаганда"
 BRA_ideological_propaganda_desc:0 "Каждое коммунистическое движение является потенциальной ячейкой, готовой организовать массы."
 BRA_R56_industrial_innovations:0 "Промышленные инновации"
 BRA_R56_industrial_innovations_desc:0 "Наша всесторонне модернизированная промышленность готова отвечать на вызовы времени: проектировать и производить современную технику, обеспечивающую победу на поле боя."
 bra_inimigo_eua:0 "Назначить Афраниу ди Меллу"
 bra_inimigo_eua_desc:0 "Мы можем поручить Афраниу ди Меллу проводить политику, гарантирующую национальные интересы."
 bra_inimigo_eua_tooltip:0 "Профессиональные дипломаты успешно заручатся поддержкой других держав, чтобы вынудить [USA.GetNameDef] не вмешиваться в дела Южной Америки."
 BRA_R56_matarazzo_united_industries:0 "Объединённые предприятия Матараццо"
 BRA_R56_matarazzo_united_industries_desc:0 "Объединённые предприятия Матараццо были основаны иммигрантом Франческо Матараццо в 1920-х годах. Группу из 360 заводов, выпускающих различные товары, можно расширить, чтобы удовлетворить большую часть промышленного спроса страны."
 BRA_R56_support_the_itabira_mines:0 "Поддержать рудники Итабиры"
 BRA_R56_support_the_itabira_mines_desc:0 "Рудники Итабиры в Минас-Жерайсе являются частью Железного четырёхугольника — крупнейшего месторождения железа и бокситов в стране и одного из крупнейших в мире. Использование добываемых там минералов исключительно [BRA.GetNameDef] обеспечит наш сырьевой суверенитет."
 bra_itaipu:0 "Гидроэлектростанция Итайпу"
 bra_itaipu_desc:0 "Гидроэлектростанция Итайпу — самый амбициозный проект федерального правительства на сегодняшний день. Она будет построена в бассейне реки Парана и обеспечит электроэнергией весь Юг и Юго-Восток. Этот гидроэнергетический гигант должен стать крупнейшим и эффективнейшим сооружением такого рода в мире — величайшим достижением [BRA.GetAdjective] инженерии и изобретательности."
 BRA_R56_establish_the_commerce_ministry:0 "Учредить Министерство торговли"
 BRA_R56_establish_the_commerce_ministry_desc:0 "Министерство труда, торговли и промышленности будет помогать правительству в вопросах промышленного расширения и модернизации."
 bra_liga_nacoes:0 "Вступить в войну"
 bra_liga_nacoes_desc:0 "Бразилия вышла из Лиги Наций в 1926 году при администрации Артура Бернардиса. Возвращение в эту преимущественно символическую организацию продемонстрирует нашу решимость сдерживать мировой авторитаризм."
 BRA_R56_lobato:0 "Лобату"
 BRA_R56_lobato_desc:0 "Спор между двумя соседями в Лобату, Баия, поставил под сомнение утверждение правительства об отсутствии нефти на [BRA.GetAdjective] землях."
 BRA_R56_roll_out_mechanized_vehicles:0 "Развернуть производство механизированной техники"
 BRA_R56_roll_out_mechanized_vehicles_desc:0 "Одним из величайших достижений штата Сан-Паулу во время войны стало создание бронепоездов. Из вагонов для перевозки кофе собирали составы, покрытые толстыми металлическими плитами; в окнах размещали пулемёты, а впереди — пушку. Мы можем помочь производителям грузовиков создать предприятие, которое удовлетворит потребность в механизированных частях."
 bra_mercosul_expansao_focus:0 "Защитники демократии"
 bra_mercosul_expansao_focus_desc:0 "«Мы — защитники демократии в Южном полушарии и считаем общей обязанностью оберегать соседей от угнетения радикалов как внутри, так и извне. Поэтому мы протягиваем руку помощи всем нашим братьям в Южном полушарии — не только во имя свободы, но и во имя мира!»"
 bra_mercosul_focus:0 "Южноамериканская торговая инициатива"
 bra_mercosul_focus_desc:0 "«ДефенСул» — межправительственная организация демократий Южной Америки, сосредоточенная на взаимной защите, сдерживании радикализма на континенте и создании налоговой политики, благоприятствующей и стимулирующей континентальную торговлю."
 bra_mercosul_militar_focus:0 "Укрепить «ДефенСул»"
 bra_mercosul_militar_focus_desc:0 "Необходимо укрепить «ДефенСул» как организацию. В мире, где радикалы и поджигатели войны появляются повсюду, мы должны защищать Южную Америку и свои дома от внешних и внутренних нападений. Если ради этого придётся перенести войну к порогу врага — так тому и быть!"
 bra_mercosul_militar_tooltip:0 "Расширяет оборонительный договор «ДефенСул» до более широкой организации совместной обороны, ориентированной на Южное полушарие."
 bra_mex_rev:0 "Мексиканское восстание"
 BRA_milicias:0 "Национальный авангард"
 BRA_R56_improve_military_education:0 "Улучшить военное образование"
 BRA_R56_improve_military_education_desc:0 "Высшая военная школа предназначена для развития и закрепления знаний, необходимых для высшего руководства и консультативной работы в области планирования национальной обороны, включая основные вопросы безопасности и развития."
 BRA_mobilizacao_ind:0 "Указ о национальной мобилизации"
 bra_mobilizacao_ind:0 "Указ о национальной мобилизации"
 bra_mobilizacao_ind_desc:0 "Посредством законов, указов и положений Конституции Союз может ускорить и расширить введение осадного положения, значительно увеличив способность [BRA.GetNameDef] реагировать на войну."
 BRA_R56_the_brazilian_air_force:0 "Военно-воздушные силы Бразилии"
 BRA_R56_the_brazilian_air_force_desc:0 "Создание военно-воздушных сил как значимой части вооружённых сил Республики необходимо для обеспечения [BRA.GetAdjective] господства в небе."
 BRA_modernizacao_armadas:0 "Министерство вооружённых сил"
 BRA_R56_florianismo:0 "Флорианизм"
 BRA_R56_florianismo_desc:0 "Модернизация флота необходима для обеспечения [BRA.GetAdjective] господства на море. Флориану Пейшоту был первым президентом-адмиралом Республики. Во время его правления он сохранял великое морское наследие. Мы должны продолжить его дело."
 BRA_R56_modernize_the_madeira_mamore_br230:0 "Модернизировать Мадейра-Маморе и BR-230"
 BRA_R56_modernize_the_madeira_mamore_br230_desc:0 "Железная дорога Мадейра-Маморе была построена Персивалем Фаркуаром как часть проекта межамериканского сообщения. Модернизация и расширение её линий повысят мобильность войск на севере."
 bra_mod_sb:0 "BR-163"
 BRA_mod_sb:0 "Модернизировать Катариненсе"
 bra_mod_sb_desc:0 "BR-163 станет центральной магистралью развития и заселения Мату-Гросу и южной Амазонии. Вдоль неё появятся небольшие поселения, которые в будущем могут превратиться в крупные сельскохозяйственные центры."
 BRA_R56_modernize_the_sorocabana:0 "Модернизировать Сорокабану"
 BRA_R56_modernize_the_sorocabana_desc:0 "Сорокабана является частью железнодорожной системы штатов Сан-Паулу и Парана и одной из крупнейших сетей страны. Её расширение увеличит пропускную способность и облегчит передвижение войск."
 BRA_R56_restore_the_empire:0 "Восстановить империю"
 BRA_R56_restore_the_empire_desc:0 "С 1889 года вопрос монархии обсуждается в интеллектуальных кругах. Мы можем призвать императора вновь возглавить Бразилию."
 bra_monarquia_tooltip:0 "Призывает нашего императора, Дона Педру III, возглавить Бразилию."
 BRA_R56_expand_the_universities:0 "Расширить университеты"
 BRA_R56_expand_the_universities_desc:0 "Больше университетов означает больше учащихся и больше прогресса. Превращение небольших провинциальных колледжей в крупные образовательные центры должно стать приоритетом правительства."
 BRA_R56_motorize_the_army:0 "Моторизировать армию"
 BRA_R56_motorize_the_army_desc:0 "Во время гражданской войны армия паулистов мобилизовала крупные автомобильные предприятия столицы и использовала их продукцию для быстрого перемещения солдат между легалистскими траншеями. Мы можем создать нового производителя автомобилей на базе предприятия в Дуки-ди-Кашиас."
 BRA_R56_natal_naval_dockyard:0 "Военно-морская верфь Натала"
 BRA_R56_natal_naval_dockyard_desc:0 "Военно-морская верфь в Натале откроет северо-восточной Бразилии новое окно в мир. Через порт будут проходить тысячи тонн импортных и экспортных грузов. Основным его назначением станет гражданское, но при необходимости он послужит и военным целям."
 BRA_R56_national_institutes:0 "Национальные институты"
 BRA_R56_national_institutes_desc:0 "Создание национальных институтов как передовых исследовательских центров значительно ускорит технологический прогресс страны."
 BRA_R56_national_security_law:0 "Закон о национальной безопасности"
 BRA_R56_national_security_law_desc:0 "Закон о национальной безопасности является одним из переходных элементов между правовым наследием Конституционалистской революции и новой бразильской политикой. Его следует принять ради общенационального единства."
 BRA_new_constitution:0 "Второе конституционное собрание"
 bra_new_constitution:0 "Не мной руководят — я руковожу"
 bra_new_constitution_desc:0 "Я не понимаю, как такая страна, как [BRA.GetNameDef], после более чем века конституционной жизни и либерализма скатилась к безудержной и неограниченной диктатуре, которая унижает и истощает нас перед цивилизованным миром!"
 bra_noronha_tooltip:0 "Создаёт командующего флотом: Исайас ди Норонья"
 BRA_R56_federal_centre_for_nuclear_research:0 "Федеральный центр ядерных исследований"
 BRA_R56_federal_centre_for_nuclear_research_desc:0 "Центр ядерных исследований позволит Бразилии развивать как средства уничтожения врагов, так и потенциал практически неисчерпаемой энергии."
 BRA_R56_nationalize_major_infrastructure_hubs:0 "Национализировать ключевые инфраструктурные узлы"
 BRA_R56_nationalize_major_infrastructure_hubs_desc:0 "Поскольку значительная часть инфраструктуры была построена британцами и американцами, некоторые жизненно важные объекты страны приносят огромную прибыль иностранцам. Правительство должно указами обеспечить, чтобы выгоду от них получали граждане страны."
 bra_pan_americano:0 "Панамериканский пакт"
 bra_pan_americano_desc:0 "Панамериканский оборонительный пакт гарантирует победу революции в нашей части земного шара!"
 bra_pan_americano_fascism:0 "Ударить по идеологическим врагам"
 BRA_R56_embolden_patriotism:0 "Укрепить патриотизм"
 BRA_R56_embolden_patriotism_desc:0 "[BRA.GetAdjective] нации необходимо, чтобы граждане всех уголков её огромных владений посвятили себя сохранению, защите и развитию страны. [BRA.GetAdjective] народ должен откликнуться на эти устремления — ради общего блага и национальной свободы."
 BRA_paulista_revanchism:0 "Пусть ради Бразилии свершаются великие дела"
 BRA_R56_petrobras:0 "«Петробрас»"
 BRA_R56_petrobras_desc:0 "«Петробрас» станет государственной нефтяной компанией Бразилии и будет отвечать за разведку, переработку и расширение нефтяных месторождений по всей стране."
 BRA_petroleo_salvador:0 "Салвадор"
 BRA_R56_skewer_the_green_hens:0 "Заколоть зелёных кур"
 BRA_R56_skewer_the_green_hens_desc:0 "«Зелёные куры», как мы называем интегралистов, яростно сопротивляются справедливому захвату власти народом Бразилии. Чтобы обеспечить победу революции, лидеры партии должны лично повести армии против фашизма!"
 BRA_R56_institute_the_polaca:0 "Принять «Полака»"
 BRA_R56_institute_the_polaca_desc:0 "Четвёртая конституция Бразилии была провозглашена Жетулиу Варгасом для создания системы, сосредоточенной вокруг президента. Она считается первой вехой в укреплении Нового государства."
 BRA_R56_polytechnical_colleges:0 "Политехнические колледжи"
 BRA_R56_polytechnical_colleges_desc:0 "Строительство политехнических колледжей в крупнейших городах страны подготовит тысячи молодых специалистов, способных служить стране в соответствующих производственных областях."
 BRA_R56_embrace_populism:0 "Принять популизм"
 BRA_R56_embrace_populism_desc:0 "Великие бразильские лидеры заручаются поддержкой широких масс с помощью радикальных идеологических речей, воздействующих на общественное мнение."
 BRA_preemptive_strike_tt:0 "§CЭтот фокус даст цели войны против некоторых соседних стран, если они являются коммунистическими.§!"
 BRA_prospect:0 "Искать ресурсы"
 BRA_prospect_desc:0 "Наша страна полна природных богатств — нужно лишь найти их."
 BRA_prospect_oil:0 "Искать нефть"
 BRA_prospect_oil_desc:0 "Если сосредоточить разведку исключительно на нефти, вероятность успеха значительно возрастёт."
 BRA_R56_department_of_press_and_propaganda:0 "Департамент печати и пропаганды"
 BRA_R56_department_of_press_and_propaganda_desc:0 "Жетулиу Варгас, великодушный лидер [BRA.GetNameDef] и [BRA.GetAdjective] народа, является главной надеждой на глубокое благополучие страны и её граждан. Его сохранение у власти необходимо для развития государства и процветания всего населения. Это обеспечит новый Департамент печати и пропаганды под руководством господина Филинту Мюллера."
 bra_reclaim_uruguay:0 "Сисплатина"
 bra_reclaim_uruguay_desc:0 "Уругвай оставался бразильской провинцией до спорного провозглашения независимости в 1825 году. Бразилия могла подавить неповиновение, но тогда предпочла допустить его существование. Теперь, когда доктрина Монро больше не сдерживает нас, а страна признана одной из великих держав, мы должны вернуть своё!"
 BRA_R56_a_collection_of_states:0 "Союз штатов"
 BRA_R56_a_collection_of_states_desc:0 "9 июля 1932 года штат Сан-Паулу, задушенный последствиями революции 1930 года, не увидел иного выхода, кроме объявления войны режиму Варгаса. Сегодня мы признаём неоспоримую истину в словах паулистов, звучавших из траншей. Диктатура Варгаса оскорбляет честь столь культурно разнообразной и свободной страны, как [BRA.GetNameDef]. Настало время вновь демократизировать Республику."
 BRA_r_s_1:0 "УФМЖ"
 BRA_r_s_2:0 "УСП"
 bra_sae:0 "Секретариат стратегических вопросов"
 bra_sae_desc:0 "Секретариат стратегических вопросов станет органом при президенте Республики, разрабатывающим долгосрочную государственную политику экономического и социального развития [BRA.GetNameDef]. На него будут возложены долгосрочное национальное планирование и разработка общегосударственных стратегий для обеспечения нашей власти и контроля над территориями."
 BRA_R56_plan_salte:0 "План САЛТИ"
 BRA_R56_plan_salte_desc:0 "План САЛТИ — «Здравоохранение, продовольствие, транспорт и энергетика» — направлен на стимулирование и улучшение развития этих отраслей по всей [BRA.GetNameDef], тем самым повышая условия жизни [BRA.GetAdjective] населения."
 BRA_R56_national_petroleum_council:0 "Национальный нефтяной совет"
 BRA_R56_national_petroleum_council_desc:0 "Правительство может национализировать новые нефтяные месторождения, обнаруженные в Салвадоре, обеспечив суверенитет страны над этим важнейшим ресурсом."
 BRA_R56_secret_research_department:0 "Секретный исследовательский отдел"
 BRA_R56_secret_research_department_desc:0 "Создание технологических центров, целиком посвящённых важнейшим проектам вооружённых сил, окажется решающим для поддержания национальной безопасности."
 BRA_selva_tech_effect:0 "Создаёт §YУчебный центр войны в джунглях — ЦИЖ§!, сосредоточенный на подготовке армии к защите нашего ценнейшего национального богатства. Части §Yобычной пехоты§! будут передвигаться и сражаться в тропических лесах словно у себя дома. Все остальные §Yвойска специального назначения§! получат небольшой бонус к передвижению по джунглям. §YМеханизированные§! и §Yмоторизованные§! батальоны получат §Hштраф в бою§! 0,25x.\n."
 bra_sem_eixo:0 "Пакт Рио"
 bra_sem_eixo_desc:0 "Мы, единый [BRA.GetAdjective] народ всех провинций, предлагаем создать подлинно [BRA.GetAdjective] культуру, цивилизацию и образ жизни. Мы хотим строить общественное право в соответствии с нашими реалиями и стремлениями. Это правительство гарантирует единство всех провинций, гармонию всех классов, инициативу каждого человека, государственный надзор и национальное строительство."
 bra_sem_urss:0 "Наша революция!"
 bra_sem_urss_desc:0 "Нам не нужна никакая кровавая мировая держава. Мы, [BRA.GetAdjective] народ, сами станем топливом своей революции!"
 bra_strike_dem_focus:0 "Распространять националистические настроения"
 BRA_R56_submarines:0 "Подводные лодки"
 BRA_R56_submarines_desc:0 "Подводные лодки являются эффективным средством патрулирования побережья и уничтожения вражеских кораблей в открытом море."
 BRA_R56_expand_the_private_industry:0 "Расширить частную промышленность"
 BRA_R56_expand_the_private_industry_desc:0 "С помощью гарантий и налоговых льгот федеральное правительство может стимулировать создание новых мастерских и предприятий по всей стране."
 bra_sudam:0 "СУДАМ"
 bra_sudam_desc:0 "Управление развития Амазонии — автономный орган [BRA.GetAdjective] федерального правительства, призванный развивать Амазонский регион с помощью особых налоговых и финансовых льгот для привлечения частных инвесторов из страны и из-за рубежа."
 bra_sudene:0 "СУДЕНИ"
 bra_sudene_desc:0 "Управление развития Северо-Востока — особый административно и финансово автономный орган, задачей которого является содействие инклюзивному и устойчивому развитию своей зоны деятельности и конкурентной интеграции региональной производственной базы в национальную и мировую экономику."
 BRA_R56_technical_schools:0 "Технические училища"
 BRA_R56_technical_schools_desc:0 "Государственная поддержка технических училищ подготовит больше техников и специалистов для промышленного производства в [BRA.GetNameDef]."
 BRA_R56_reinstituite_the_technocratic_system:0 "Восстановить технократическую систему"
 BRA_R56_reinstituite_the_technocratic_system_desc:0 "Во времена Первой республики государственные и частные учреждения высоко ценили меритократию и науку. Научный прогресс той эпохи неоспорим: благодаря великим предпринимателям появились электричество и сталь. С развитием новых технологий возвращение к этим ценностям значительно ускорит технический прогресс страны."
 BRA_R56_tenenge:0 "ТЕНЕНЖИ"
 BRA_R56_tenenge_desc:0 "«Национальная инженерная техника» — компания электромеханического машиностроения и тяжёлого промышленного строительства, специализирующаяся на портовой инфраструктуре и управлении водными путями в [BRA.GetNameDef]. Мы можем привлечь её для расширения деятельности «Вали-ду-Риу-Доси» и «Петробрас»."
 BRA_R56_federal_installations_in_the_amazon:0 "Федеральные объекты в Амазонии"
 BRA_R56_federal_installations_in_the_amazon_desc:0 "Учебный центр войны в джунглях — военная организация [BRA.GetAdjective] армии в Манаусе, предназначенная для подготовки командиров малых подразделений и бойцов джунглей, способных выполнять военные задачи в самых негостеприимных районах бразильской Амазонии и сходной местности."
 BRA_R56_tire_de_guerra:0 "Тиру-ди-Герра"
 BRA_R56_tire_de_guerra_desc:0 "Программа «Тиру-ди-Герра» была введена армией в 1916 году и предусматривала базовую подготовку непризванных резервистов на случай объявления осадного положения. Расширение программы обеспечит пополнение армейских колонн лучше подготовленными людьми, более близкими к полной боевой готовности."
 bra_transatlantico:0 "Трансатлантический пакт"
 bra_tropas_1932_tooltip:0 "§YПризывает в нашу армию ветеранов Паулистской войны.§!"
 bra_uiracu_tooltip:0 "Открывает решения по аннексии бассейна Ла-Платы."
 BRA_R56_vale_do_rio_doce:0 "«Вали-ду-Риу-Доси»"
 BRA_R56_vale_do_rio_doce_desc:0 "«Вали-ду-Риу-Доси» станет государственной компанией по добыче различных руд, включая бокситы и железо, и их переработке в алюминий и сталь."
 bra_ve_tooltip:0 "Получает национальные территории и цели войны против Аргентины, Венесуэлы и Боливии"
 BRA_R56_the_integral_state:0 "Интегральное государство"
 BRA_R56_the_integral_state_desc:0 "Чтобы мирно развиваться, видеть плоды своих усилий и пользоваться уважением внутри страны и за рубежом, нация должна полностью осознавать принцип власти. Нам нужна власть, способная повсюду проявлять инициативу ради общего блага."
 bra_vitrine_tooltip:0 "Эффекты этого фокуса раскроются только после выбора конкретного пути будущего Варгаса."
 BRA_R56_duty_free_zone_of_manaus:0 "Зона свободной торговли Манауса"
 BRA_R56_duty_free_zone_of_manaus_desc:0 ""
 BRA_anhanguera_desc:0 "Шоссе Анхангера станет крупнейшим дорожным комплексом страны, а его разветвлённые магистрали свяжут всю Бразилию с невиданной прежде пропускной способностью."
 BRA_armor_desc:0 "Во время Гражданской войны обе стороны применяли боевые танки. Победа Союза отчасти была обеспечена использованием этих чудовищ в бою. Совершенствование их моделей принесёт армии огромную пользу..."
 BRA_cepsn_desc:0 "Национальный металлургический план был создан для определения районов добычи железной руды и строительства центров производства стали в Бразилии."
 BRA_R56_military_complex_of_the_parnaiba_valley_desc:0 "Говеро может субсидировать строительство промышленного комплекса боевого оружия в долине реки Парнаиба на северо-востоке Бразилии."
 BRA_fundar_petrobras_desc:0 "«Петробрас» станет государственной нефтяной компанией Бразилии, отвечающей за разведку, переработку и расширение нефтяных месторождений по всей стране."
 BRA_fundar_vale_desc:0 "«Вали-ду-Риу-Доси» станет государственной компанией по добыче различных минералов, включая бокситы и железо, а также их переработке в алюминий и сталь для Республики."
 BRA_glory_to_brasil_desc:0 "Бразилия — грозная страна, которую уважают и любят все народы мира. Она доказала, что является столь же значимым участником международной и континентальной политики, как её исторический союзник и соперник — Соединённые Штаты. Неоспоримо, что именно Бразилия должна защищать и контролировать свою часть Американского континента. Оспорить доктрину Монро в Южной Америке — цель наших дипломатов."
 BRA_milicias_desc:0 "Народное ополчение является эффективным средством вовлечения населения в военное дело, чему способствует интенсивная пропаганда этих организаций."
 BRA_mobilizacao_ind_desc:0 "Посредством законов, указов и положений Конституции Союз может ускорить и расширить введение чрезвычайного положения, значительно увеличив способность Бразилии реагировать на войну."
 BRA_modernizacao_armadas_desc:0 "Создание министерства, объединяющего все рода вооружённых сил, позволит политически координировать армию и предотвратить будущие конфликты между её руководителями из-за политических интересов, как это происходило с 1889 года."
 BRA_mod_sb_desc:0 "Железные дороги Санта-Катарины соединяют штат Риу-Гранди-ду-Сул с Юго-Востоком. Оба региона являются важными центрами производства и потребления, а также наиболее уязвимой в военном отношении частью Бразилии, граничащей с двумя историческими врагами и служащей ядром бразильской армии. Улучшение этого сообщения необходимо и для обороны, и для производства."
 BRA_new_constitution_desc:0 "Президент Республики, получивший должность в результате переворота 1930 года, игнорирует волю народа и требования бразильцев о свободе и праве выбирать своих представителей. Значительная промышленная политика государственного контроля стала неэффективной и обременительной для национальной промышленности. Бразильский народ должен принять собственную Великую хартию."
 BRA_paulista_revanchism_desc:0 "Предприниматели Сан-Паулу всегда входили в число самых преданных и трудолюбивых людей, двигавших промышленное развитие. Их первопроходческий дух следует превратить в государственную политику, а президент должен прислушиваться к строителям национальной инфраструктуры."
 BRA_petroleo_salvador_desc:0 "Правительство может национализировать новые нефтяные месторождения, обнаруженные в Салвадоре, обеспечив суверенитет страны над этим важнейшим ресурсом."
 BRA_reclaim_uruguay:0 "Вернуть провинцию Сисплатина"
 BRA_reclaim_uruguay_desc:0 "Уругвай был бразильской провинцией до спорного провозглашения независимости в 1825 году. Бразилия могла подавить неповиновение, но тогда предпочла допустить его существование. Теперь, без ограничений доктрины Монро и будучи признанной одной из великих держав международной арены, мы должны вернуть своё!"
 BRA_r_s_1_desc:0 "Университет Минас-Жерайса объединяет несколько небольших факультетов, способных воспитать великие умы страны. Его специалисты и учёные будут определять будущее Бразилии."
 BRA_r_s_2_desc:0 "Университет Сан-Паулу — крупнейший академический комплекс Латинской Америки, один из лидеров технологического развития страны и крупнейший центр национальных инноваций."
 bra_naval_logistics:0 "Морская логистика"
 bra_naval_logistics_desc:0 "Море зовёт нас. Настало время радикальных преобразований."
 bra_shared_naval_experience:0 "Общий морской опыт"
 bra_shared_naval_experience_desc:0 "Чтобы господствовать в Атлантике, нам придётся делиться опытом с союзниками."
 bra_shared_naval_experience_tt:0 "§Y[ROOT.GetNameDefCap]§! и её §Yсоюзники, располагающие флотом§!, получат:"
 bra_african_initiative:0 "Африканская дипломатическая инициатива"
 bra_african_initiative_desc:0 "Мы должны искать союзников на другом берегу Атлантики. Эти страны могут быть беднее, но вместе способны внести значительный вклад."
 bra_invite_south_africa:0 "Пригласить Южную Африку"
 bra_invite_south_africa_desc:0 "Будучи развитой страной, охраняющей проход между Атлантическим и Индийским океанами, Южная Африка может стать превосходным союзником."
 bra_invite_canada:0 "Пригласить Канаду"
 bra_invite_canada_desc:0 "Канада является развитой страной и может стать превосходным союзником."
 bra_carribean_diplomacy:0 "Карибская дипломатия"
 bra_carribean_diplomacy_desc:0 "Карибские страны имеют ключевое значение для контроля не только над окружающими водами, но и над Саргассовым морем."
 BRA_invite_andean_countries:0 "Пригласить андские страны"
 BRA_invite_andean_countries_desc:0 "Попытаемся привлечь Перу, Чили и Боливию."
 BRA_invite_platine_countries:0 "Пригласить страны Ла-Платы"
 BRA_invite_platine_countries_desc:0 "Наши южные соседи должны стать союзниками."
 BRA_allies_in_the_north:0 "Союзники на севере"
 BRA_allies_in_the_north_desc:0 "Наши северные соседи должны стать союзниками."
 BRA_invite_central_american_countries:0 "Пригласить страны Центральной Америки"
 BRA_invite_central_american_countries_desc:0 "Наши северные соседи должны стать союзниками."
 bra_rural_elite:0 "Кофейные бароны"
 bra_industrial_elite:0 "Строительные подряды"
 bra_rural_elite_desc:0 "Несмотря на вступление Варгаса в должность президента, сельские элиты по-прежнему контролируют политику на муниципальном уровне и сосредоточили в своих руках почти всю экономическую власть страны. Эта монополия на финансы Республики мешает направлять капитал на расширение промышленного сектора."
 bra_industrial_elite_desc:0 "Для такой сельской страны, как наша, развитие инфраструктуры и промышленности обходится дорого. Чтобы обеспечить рост, правительству приходится чрезмерно облагать экономику налогами и ограничивать бюджет ради оплаты подрядчиков."
 bra_tank_designer_2:0 "«Специализированные инженеры С.А.»"
 bra_refining_concern:0 "«Петробрас С.А.»"
 bra_1930:0 "Революция 1930 года"
 bra_1930_2:0 "Революция 1930 года"
 bra_instabilidade:0 "Партийная политика"
 bra_instabilidade_desc:0 "С момента основания Бразильской империи 7 сентября 1822 года право влиять на политические решения принадлежало исключительно крупным землевладельцам, влиятельным предпринимателям и политикам высшего общества. Лишь недавно, после принятия Конституции 1934 года, представители низших и средних слоёв [BRA.GetAdjective] общества получили возможность быть услышанными. Этот резкий разрыв со старым порядком привёл к полному и радикальному расколу общественного мнения между НОА, НДЕ, БИД и Новым государством."
 bra_1930_desc:0 "В 1930 году тенентисты Варгаса отстранили от власти элиты Старой республики. Этот переворот и последующая конституция положили начало Гражданской войне в Бразилии. Был ли захват власти Жетулиу благом или злом, он до сих пор разделяет мнения многих [BRA.GetAdjective] граждан."
 bra_1930_2_desc:0 "В 1930 году тенентисты Варгаса отстранили от власти элиты Старой республики. Этот переворот и последующая конституция положили начало Гражданской войне в Бразилии. Был ли захват власти Жетулиу благом или злом, он до сих пор разделяет мнения многих [BRA.GetAdjective] граждан."
 bra_eficiencia_1:0 "Промышленные советы"
 bra_eficiencia_1_desc:0 "Советы промышленных магнатов бывшей Республики помогают нам управлять экономикой."
 bra_eficiencia_2:0 "Промышленные специалисты"
 bra_eficiencia_2_desc:0 "Опытные экономисты и технические специалисты помогают планировать расширение промышленности."
 bra_eficiencia_3:0 "Промышленные предприниматели"
 bra_eficiencia_3_desc:0 "Иностранные промышленные магнаты и отечественные руководители управляют работой и организацией наших промышленных комплексов."
 bra_eficiencia_4:0 "Промышленные сети"
 bra_eficiencia_4_desc:0 "Целые национальные группы, общества и подрядчики с миллиардными оборотами отвечают почти за всю нашу военную машину и гражданскую промышленность."
 bra_eficiencia_bndes:0 "Национальный девелопментализм"
 bra_eficiencia_bndes_desc:0 "Национально-девелопменталистский проект несёт надежду широко распространить экономические, политические и социальные блага современности на всё [BRA.GetAdjective] общество. Мы преодолеем существующий разрыв посредством индустриализации, которая станет результатом развития, накопления капитала и внедрения технического прогресса."
 bra_eficiencia_gerdau_1:0 "Национальный девелопментализм"
 bra_eficiencia_gerdau_1_desc:0 "Национально-девелопменталистский проект несёт надежду широко распространить экономические, политические и социальные блага современности на всё [BRA.GetAdjective] общество. Мы преодолеем существующий разрыв посредством индустриализации, которая станет результатом развития, накопления капитала и внедрения технического прогресса."
 bra_eficiencia_gerdau_2:0 "[BRA.GetAdjective] экономическое чудо"
 bra_eficiencia_gerdau_2_desc:0 "Создание тяжёлой промышленности, формирование устойчивого внутреннего потребительского рынка, изобилие квалифицированной рабочей силы и урбанизация, вызванная механизацией сельского хозяйства, сделали национальную экономику неудержимой. Теперь эту страну уже никто не остановит."
 bra_eficiencia_tenenge_1:0 "Национальный девелопментализм"
 bra_eficiencia_tenenge_1_desc:0 "Национально-девелопменталистский проект несёт надежду широко распространить экономические, политические и социальные блага современности на всё [BRA.GetAdjective] общество. Мы преодолеем существующий разрыв посредством индустриализации, которая станет результатом развития, накопления капитала и внедрения технического прогресса."
 bra_eficiencia_tenenge_2:0 "[BRA.GetAdjective] экономическое чудо"
 bra_eficiencia_tenenge_2_desc:0 "Создание тяжёлой промышленности, формирование устойчивого внутреннего потребительского рынка, изобилие квалифицированной рабочей силы и урбанизация, вызванная механизацией сельского хозяйства, сделали национальную экономику неудержимой. Теперь эту страну уже никто не остановит."
 bra_eficiencia_5:0 "Электросеть модернизирована"
 bra_eficiencia_5_desc:0 "Электросеть крупнейших городских агломераций модернизирована и переустроена для повышения эффективности."
 bra_eficiencia_6:0 "Электросеть расширена"
 bra_eficiencia_6_desc:0 "Мы провели современную электросеть в сельские и наиболее отдалённые районы."
 bra_eficiencia_7:0 "Электросеть расширена и модернизирована"
 bra_eficiencia_7_desc:0 "Национальная электросеть теперь полностью расширена и действует во всех ключевых районах страны."
 bra_eficiencia_8:0 "[BRA.GetNameDefCap]: люби её или покинь"
 bra_eficiencia_8_desc:0 "После реорганизации, расширения и модернизации промышленности мы можем полностью мобилизовать производственные комплексы для нужд войны."
 BRA_alfredo_de_almeida:0 "Алфреду ди Алмейда"
 BRA_franscisco_morato:0 "Франсиску Морату"
 bra_influencia_comunista_idea:0 "[BRA.GetAdjective] влияние"
 bra_influencia_comunista_idea_desc:0 "[BRA.GetNameDefCap] влияет на нашу политику посредством пропаганды и торговли."
 bra_polaca_idea:0 "«Полака»"
 bra_polaca_idea_desc:0 "Новая конституция, введённая Его Превосходительством президентом Республики Жетулиу Варгасом, укрепляет его власть в патерналистской форме, которую НОА и видные деятели распущенной РПП называют фашистской. Она даст господину президенту достаточно полномочий для проведения крайне необходимых реформ и создания действенного и эффективного кабинета."
 bra_mercosul_outro:0 "Участник «ДефенСул»"
 bra_mercosul_outro_desc:0 "Эта страна является участником Договора об обороне Южного полушария."
 bra_ciclocana_idea:0 "Первое расширение сельскохозяйственного фронтира"
 bra_ciclosoja_idea:0 "Второе расширение сельскохозяйственного фронтира"
 bra_etanol_idea:0 "Национальная спиртовая программа"
 bra_antropofagia:0 "Культурная антропофагия"
 bra_antropofagia_desc:0 "Хотя модернисты описали это явление лишь недавно, усвоение обычаев других культур и их приспособление к национальной действительности является основой [BRA.GetAdjective] идентичности. [BRA.GetNameDefCap] — не страна разных культур, сосуществующих на одной территории, а единая [BRA.GetAdjective] культура, возникшая из смешения европейских, африканских, азиатских и коренных традиций. Поэтому принадлежность к [BRA.GetAdjective] народу определяется не расой или обычаями, а использованием родного языка и ощущением связи с [BRA.GetNameDef]. Эта особенность породила разочарованный народ и мало заинтересованное во внешних делах правительство, но одновременно высокую стойкость, терпимость к другим культурам и верность граждан [BRA.GetAdjective] самобытности."
 bra_bandeirantes:0 "Бандейранты"
 bra_bandeirantes_desc:0 "Бразильские вооружённые силы создавались не для империализма и завоеваний и не переняли современные европейские способы ведения войны. Основы армейской традиции восходят к бандейрантам, поселенцам и экспедиционерам, осваивавшим внутренние районы Бразилии по тропам коренных народов и при их содействии в колониальную эпоху. Поэтому [BRA.GetAdjective] армия специализируется на боях на [BRA.GetAdjective] земле, значительная часть которой всё ещё не освоена цивилизацией."
 bra_bandeirantes_mg_1:0 "Бандейранты"
 bra_bandeirantes_sp_1:0 "Бандейранты"
 bra_bandeirantes_mg_2:0 "Бандейранты"
 bra_bandeirantes_sp_2:0 "Бандейранты"
