 PRC_random_amount_of_partisan_tt:0 "§YОт 2 до 6 партизанских отрядов примут нашу взятку и присоединятся к армии§!\n"
 PRC_wait_for_civil_war_tt:0 "Это событие повторится, когда произойдёт событие гражданской войны в Японии.\n"
 PRC_takeover_dongbei_tt:0 "[PRC.GetName] получает контроль над регионами Маньчжурии, принадлежащими [JAP.GetName] или её марионеткам.\n"
 KMT_commie_generals_join_tt:0 "§YЛинь Бяо§!, §YЧжу Дэ§!, §YЧэнь И§! и §YПэн Дэхуай§! присоединятся к нашей армии."
 KMT_hundred_flowers_tt:0 "Это заговор с целью разоблачить злоумышленников, однако их критика §Rможет поколебать волю нашего народа§!, поскольку люди могут сильнее проникнуться идеями других партий §Gпрежде, чем мы арестуем этих злоумышленников§!."
 PRC_great_leap_timespan:0 "Ожидается, что §Y«Большой скачок»§! продлится §Gнесколько§! лет, но если он окажется губительным для нашей экономики, его могут прекратить уже через §Rодин год§!..."
 KMT_leap_stop:0 "Политика §Y«Большого скачка»§! завершена."
 PRC_solidifying_our_revolution:0 "Укрепление нашей революции"
 PRC_solidifying_our_revolution_desc:0 "В последние годы [PRC.getNameDefCap] пришлось пережить немало испытаний. В 1935 году вероломный Гоминьдан попытался уничтожить любую социалистическую оппозицию, вынудив наше некогда популярное среди крестьян движение рассеяться по сельским районам Центральной равнины. Восстановление сил, несомненно, потребует времени и усилий, но мы выйдем из этой борьбы победителями!"
 PRC_question_of_our_capital_decision:0 "Решить вопрос о столице"
 PRC_question_of_our_capital_decision_desc:0 "Народная революция получит ещё большую поддержку рабочих и крестьян, если мы официально провозгласим создание [PRC.getNameDef] в нашей новой столице."
 PRC_the_new_communist_beacon:0 "Новый маяк коммунизма"
 PRC_the_new_communist_beacon_desc:0 "Революционная борьба не закончится, пока существуют угнетатели, колонизаторы, империалисты и враги народа! \nНесколькими стремительными ударами мы уничтожим антиправительственные ячейки как за пределами, так и внутри [ROOT.getNameDef]. \nПришло время Да Чжунхуа Дицюй восстать и процветать!"
 PRC_hundred_flowers_campaign_progress:0 "Ход кампании «Ста цветов»"
 PRC_offer_a_separate_peace_to_japan:0 "Предложить Японии сепаратный мир"
 PRC_offer_a_separate_peace_to_japan_desc:0 "Империалистическая угроза разгромлена, и теперь мы контролируем большую часть северных рубежей собственно Китая. Их армии уничтожены, а националисты заняты боями на Центральной равнине, поэтому мы можем вынудить поверженного врага принять неизбежное и прекратить боевые действия. Пока что."
 PRC_defy_sov_order:0 "Советский приказ отвергнут"
 PRC_sov_approve:0 "Советы одобрили наше предложение"
