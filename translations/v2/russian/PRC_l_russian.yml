 prc_sov_reinforcements:0 "Получить 8 дивизий от [SOV.GetName]"
 PRC_dongbei_partisans_tt:0 "Получить контроль над всеми принадлежащими [CHI.GetName] регионами в Маньчжурии."
 west_expedition_failed_msg:0 "Западная экспедиция КНР потерпела неудачу, и операция была прекращена."
 PRC_civil_war_started:0 "Гражданская война началась в результате события"
 PRC_restart_CHI_war:0 "КНР или Китайская Республика объявили войну друг другу."
