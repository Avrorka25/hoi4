 PRC_zxl_purge:0 "Казнён Чжан Сюэляном"
 PRC_enable_cdx:0 "Чэнь Дусю вернулся"
 PRC_no_wargoal_to_chi_with_gnwu:0 "Отказ от борьбы против Чан Кайши"
 PRC_yhc_enable:0 "Интегрирован"
 chi_accept_prc71_tt:0 "[CHI.GetNameDefCap] принял наше предложение"
 no_rescue_zhang:0 "Не спасать Чжан Сюэляна"
 xian_incident_started:0 "Начался Сианьский инцидент"
 cdx_returned:0 "Чэнь Дусю вернулся"
 PRC_yes_truce:0 "Согласие прекратить все гражданские войны."
 has_pact_with_jap:0 "Имеет пакт с Японией"
 PRC_defeatism_1:0 "Пораженчество"
 PRC_defeatism_1_desc:0 "Некоторые наши товарищи считают, что, вступив в войну с японцами, мы станем новой Абиссинией. Такие мысли сильно подрывают волю народа."
 PRC_underestimation:0 "Недооценка Японии"
 PRC_underestimation_desc:0 "Некоторые наши товарищи чрезмерно оптимистично оценивают японцев. Они даже утверждают, что те никогда не доберутся до Шаньси. Подобная самоуверенность серьёзно повредит нашим военным усилиям."
 PRC_integrated_army:0 "Интегрированная армия"
 PRC_integrated_army_desc:0 "Коммунистическая Красная армия согласилась войти в состав наших вооружённых сил. Благодаря этой дополнительной поддержке война может стать немного легче."
 PRC_initiative_idea:0 "Инициатива в военное время"
 PRC_initiative_idea_desc:0 "Разоружение солдата происходит, когда он лишается свободы действий и вынужден занять пассивное положение. То же верно и для поражения армии. Поэтому обе стороны в войне делают всё возможное, чтобы завладеть инициативой и избежать пассивности."
 PRC_protracted_war_idea:0 "Затяжная война"
 PRC_protracted_war_idea_desc:0 "Мы должны задерживать японцев как можно дольше, выигрывая время для получения международной помощи."
 PRC_devastating_long_march:0 "Разорение после Великого похода"
 PRC_devastating_long_march_desc:0 "После Великого похода мы наконец обосновались в Шэньси. Однако нанесённая им глубокая рана всё ещё не зажила. Неужели это наш конец?"
 PRC_devastating_long_march_1:0 "Восстановление после Великого похода"
 PRC_devastating_long_march_1_desc:0 "Мы возвращаемся в строй, и последствия Великого похода вскоре будут смягчены."
 r56_PRC_guerilla_warfare:0 "Партизанская война"
 r56_PRC_guerilla_warfare_desc:0 "Нас пока и близко нельзя назвать «нацией» или «страной»: наше движение — всего лишь партизанские отряды, сражающиеся против Гоминьдана. \n"
 PRC_lack_skilled_personnel:0 "Нехватка квалифицированных кадров"
 PRC_lack_skilled_personnel_desc:0 "Многие наши товарищи погибли во время Великого похода, из-за чего в наших рядах не хватает квалифицированных кадров. Нам будет трудно добиться каких-либо технологических улучшений."
 PRC_swift_victory_idea:0 "Доктрина быстрой победы"
 PRC_swift_victory_idea_desc:0 "Чтобы победить японских захватчиков, мы должны действовать быстро и нанести удар прежде, чем они успеют понять, что происходит."
 propaganda_recruits:0 "Пропагандистский набор"
 propaganda_recruits_desc:0 "Сейчас мы полагаемся на пропаганду, чтобы привлечь в свои ряды новых людей. Это не слишком эффективно, но всё же укрепляет волю народа.\n"
 PRC_mc_corporation:0 "Военно-гражданское сотрудничество"
 PRC_wrongly_purged_comrades:0 "Чрезмерные чистки"
 PRC_sov_assistance_in_industry:0 "Советская промышленная помощь"
 PRC_soviet_style_education:0 "Советская система образования"
 PRC_red_beacon:0 "Новый красный маяк"
 PRC_good_good_study_idea:0 "Хорошо учись — каждый день стремись вверх"
 PRC_save_the_soviet_people:0 "Спасти советский народ"
 PRC_ndcprc_idea:0 "НДПКНР"
 PRC_cultural_revolution:0 "Культурная революция"
 PRC_cultural_revolution_aftermath:0 "Последствия Культурной революции"
 lin_biao_generalissimo:0 "Линь Бяо"
 political_mobilisation_idea:0 "Политическая мобилизация"
 PRC_uncertainty_of_new_theory:0 "Неуверенность в новой доктрине"
 PRC_uncertainty_of_new_theory_desc:0 "Принятие новой доктрины, отвергающей все прежние стратегии, вызвало определённые опасения."
 PRC_maybe_theory_is_ok:0 "Уверенность в новой доктрине"
 PRC_maybe_theory_is_ok_desc:0 "Новая доктрина доказала свою эффективность, и наша армия полностью освоила новый стиль ведения боя.\n\n§RЕсли война начнёт складываться не в вашу пользу, армия может утратить веру в неё.§!"
 PRC_enemy_partisan:0 "Вражеские партизаны в нашем тылу"
 PRC_enemy_partisan_desc:0 "Вражеские партизаны глубоко закрепились за нашей линией фронта, повреждая пути снабжения и замедляя войска.\n\n§RЭтот национальный дух исчезнет после окончания войны с КНР.§!\n\n§RПериодический ущерб сооружениям в контролируемых нами национальных регионах Китая§!"
 PRC_exploit_our_enemys_mistake_idea:0 "Использовать ошибку врага"
 PRC_exploit_our_enemys_mistake_idea_desc:0 "Действия противника на фронте плохо скоординированы. Мы можем обратить это себе на пользу и использовать его слабость настолько, насколько возможно.\n\n§RЭтот национальный дух исчезнет после окончания войны с Японией.§!"
 improper_frontline_command:0 "Недостатки управления фронтом"
 improper_frontline_command_desc:0 "Недостатки нашего управления фронтом становятся всё очевиднее, и противник начинает использовать их в своих интересах."
 PRC_until_the_bitter_end:0 "До самого горького конца"
 PRC_land_reform_stimulated_our_farmers:0 "Крестьянское восстание"
 PRC_land_reform_stimulated_our_farmers_desc:0 "Коммунистическая земельная реформа вдохновила многих крестьян нашей страны. Теперь они восстают против помещиков и присоединяются к коммунистической угрозе."
 prc_plan_for_decisive_battle:0 "Тщательное планирование"
 PRC_winter_training_idea:0 "Зимняя подготовка"
 PRC_revanchism:0 "Реваншизм"
 PRC_revanchism_desc:0 "§RИсчезнет, когда мы перестанем воевать с Японией§!"
 PRC_anti_jap_sentiment:0 "Антияпонские настроения"
