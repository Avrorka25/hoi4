 PRC_sov_advisor:0 "Советские военные советники"
 PRC_secret_police:0 "Тайная полиция"
 PRC_enemy_partisan_1:0 "Вражеские партизаны в нашем тылу"
 PRC_enemy_partisan_1_desc:0 "Вражеские партизаны глубоко закрепились за нашей линией фронта, повреждая пути снабжения и замедляя войска.\n\n§RЭтот национальный дух исчезнет после окончания войны с КНР.§!\n\n§RПериодический ущерб сооружениям в контролируемых нами национальных регионах Китая§!"
