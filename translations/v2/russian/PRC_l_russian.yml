 preserve:0 "Самосохранение"
 tech_support:0 "Техническая поддержка"
 PRC_recover_from_the_long_march:0 "Оправиться от Великого похода"
 PRC_recover_from_the_long_march_desc:0 "Великий поход дорого нам обошёлся. Мы должны восстановить силы, прежде чем Гоминьдан увидит в нашей слабости возможность уничтожить нас!"
 PRC_anti_japanese_aim:0 "Антияпонский курс"
 PRC_anti_japanese_aim_desc:0 "Японские захватчики уже у нашего порога, и мы должны сосредоточиться на подготовке стратегии обороны против них."
 PRC_west_expedition:0 "Организовать Западный поход"
 PRC_west_expedition_desc:0 "Если мы откроем более прямой путь для поставок из Советского Союза, то сможем укрепить нашу революцию. Однако клика Ма стоит у нас на пути. Мы освободим наших братьев и проложим новый путь, в котором так отчаянно нуждаемся!"
 PRC_approach_the_front:0 "Приблизиться к фронту"
 PRC_approach_the_front_desc:0 "Чтобы отбросить японцев, мы прежде должны освободить наших братьев на севере и востоке. Лишь тогда у нас появятся силы, необходимые для борьбы с захватчиками!"
 PRC_supply_line_from_sov:0 "Советские поставки"
 PRC_supply_line_from_sov_desc:0 "Теперь, когда путь открыт, советские припасы и подкрепления смогут поступать к нам гораздо легче."
 PRC_front_line_preparation:0 "Подготовка линии фронта"
 PRC_front_line_preparation_desc:0 "Мы должны подготовить позиции на линии фронта с Японией, чтобы быть готовыми встретить её войска в бою!"
 PRC_boost_the_morale:0 "Поднять боевой дух"
 PRC_boost_the_morale_desc:0 "Пораженцы в наших рядах, несомненно, вредят общему делу. Если мы хотим вновь обрести силу, необходимо искоренить подобные настроения."
 PRC_prepare_for_war:0 "Подготовиться к войне"
 PRC_prepare_for_war_desc:0 "Война с японцами кажется неизбежной. Мы должны подготовиться!"
 PRC_the_united_front:0 "Единый фронт"
 PRC_the_united_front_desc:0 "Теперь Гоминьдан возглавляет Единый фронт. Мы можем направить свои войска в его ряды и обучить их тактике партизанской войны."
 PRC_initiative_in_war_time:0 "Собственная инициатива"
 PRC_initiative_in_war_time_desc:0 "Мы должны взять инициативу в свои руки. Если после войны с Японией она останется у Гоминьдана, он непременно уничтожит нас. Нельзя давать ему такое оружие!"
 PRC_protracted_war:0 "Затяжная война"
 PRC_protracted_war_desc:0 "Мы должны как можно дольше сдерживать врага и ждать, пока народы и другие страны присоединятся к нашей войне против Японии."
 PRC_root_out_defeatism:0 "Искоренить пораженчество"
 PRC_root_out_defeatism_desc:0 "Японцам не удалось завоевать Китай — это лучшее доказательство неправоты пораженцев."
 PRC_neccessary_flexibility:0 "Необходимая мобильность"
 PRC_neccessary_flexibility_desc:0 "Полагаться исключительно на партизанскую войну нельзя. Наши войска должны быть готовы наступать и отступать, когда это необходимо."
 PRC_war_of_attrition:0 "Война на истощение"
 PRC_war_of_attrition_desc:0 "У нас достаточно пространства и людей для долгой войны с Японией. Мы выдержим истощение, а японцы — нет. Это станет нашим преимуществом."
 PRC_swift_victory:0 "Доктрина быстрой победы"
 PRC_swift_victory_desc:0 "Хотя Мао настаивает на затяжной войне, некоторые товарищи предлагают действовать инициативнее: перенести войну на территорию японцев и ударить тогда, когда они меньше всего этого ожидают."
 PRC_partial_guerilla_operation:0 "Ограниченные партизанские операции"
 PRC_partial_guerilla_operation_desc:0 "Мао настаивает на необходимости партизанской войны. Мы лишь формально удовлетворим его требования."
 PRC_war_of_annihilation:0 "Война на уничтожение"
 PRC_war_of_annihilation_desc:0 "Захватив инициативу, мы уничтожим японцев прежде, чем они успеют отреагировать!"
 PRC_political_mobilisation:0 "Политическая мобилизация"
 PRC_political_mobilisation_desc:0 "Мы должны призвать весь народ — и мирных жителей, и солдат — к борьбе против захватчиков, угрожающих нашей стране."
 PRC_self_perservation:0 "Сохранение сил"
 PRC_self_perservation_desc:0 "Чтобы получить шанс на победу в этой войне, наши солдаты должны уметь сохранять силы и избегать ненужных жертв."
 PRC_prepare_for_decisive_battle:0 "Подготовиться к решающей битве"
 PRC_prepare_for_decisive_battle_desc:0 "Сохранив силы, мы сможем подготовиться к решающим сражениям, которые одним ударом подорвут мощь Японии."
 PRC_the_goal_of_our_war:0 "Цель нашей войны"
 PRC_the_goal_of_our_war_desc:0 "Напоминание народу о цели нынешней войны значительно укрепит наш национальный дух."
 PRC_military_civilian_corporation:0 "Военно-гражданское сотрудничество"
 PRC_military_civilian_corporation_desc:0 "Создание ополчения и привлечение мирных жителей к армейской логистике станут важными факторами в этой войне."
 PRC_debunk_the_underestimation:0 "Развеять недооценку"
 PRC_debunk_the_underestimation_desc:0 "Мы должны показать товарищам, что недооценивать Японию совершенно ошибочно и пагубно для нашей армии."
 PRC_army_reform:0 "Реформа армии"
 PRC_army_reform_desc:0 "Нынешняя структура нашей армии слишком рыхлая. Необходимо создать более организованную систему."
 PRC_purge_dissident_element:0 "Чистка правых"
 PRC_purge_dissident_element_desc:0 "Некоторые считают, что правые идеи заразили умы части наших товарищей. Мы должны снова повернуть их «влево», иначе они будут изгнаны..."
 PRC_found_our_nation:0 "Основать нашу страну"
 PRC_found_our_nation_desc:0 "Под нашим прямым контролем находятся обширные территории. Мы можем созвать собрание и объявить, что наконец основали собственную страну и больше не являемся лишь партизанским движением."
 PRC_pla:0 "НОАК"
 PRC_pla_desc:0 "Народно-освободительная армия станет единственной силой, способной спасти китайский народ от порочного капитализма, уничтожить реакционеров и привести освобождённых людей к коммунизму."
 PRC_the_first_five_year_plan:0 "Первый пятилетний план"
 PRC_the_first_five_year_plan_desc:0 "Нашей недавно созданной стране недостаёт промышленных мощностей. Именно на их развитии должен сосредоточиться первый пятилетний план."
 PRC_resources_prospection:0 "Разведка ресурсов"
 PRC_resources_prospection_desc:0 "Обширные земли нашей страны богаты ресурсами. Их разведка позволит значительно увеличить добычу полезного сырья."
 PRC_land_reform:0 "Земельная реформа"
 PRC_land_reform_desc:0 "Сейчас большая часть земли принадлежит помещикам, а крестьяне подвергаются эксплуатации. Необходимо освободить крестьян, наделить их собственной землёй и придать им смелости выступить против помещиков."
 PRC_suppress_counterrevolutionaries:0 "Подавить контрреволюционеров"
 PRC_suppress_counterrevolutionaries_desc:0 "Для сохранения стабильности все выступающие против революции элементы должны быть уничтожены или перевоспитаны. Семьям следует сообщать властям об антиреволюционной деятельности своих родственников."
 PRC_156_project:0 "Проект «156»"
 PRC_156_project_desc:0 "При советской помощи наша промышленность расцветёт."
 PRC_equipment_update:0 "Обновление снаряжения"
 PRC_equipment_update_desc:0 "Нынешнее армейское снаряжение скорее заслуживает места в музее. Мы должны обеспечить войска более современными образцами."
 PRC_ndcprc:0 "Учредить КНО КНР"
 PRC_ndcprc_desc:0 "Будет создан Комитет национальной обороны Китайской Народной Республики, который займётся выработкой политики в области национальной обороны."
 PRC_tbos:0 "Две бомбы, один спутник"
 PRC_tbos_desc:0 "«Две бомбы, один спутник» — первый план нашей страны по освоению неба и даже космоса."
 PRC_establish_navy:0 "Создать военно-морские силы НОАК"
 PRC_establish_navy_desc:0 "Хотя теперь у нас есть флот, нам недостаёт полноценной военно-морской доктрины. Пора исправить это!"
 PRC_the_red_pacific:0 "Красный Тихий океан"
 PRC_the_red_pacific_desc:0 "Мы распространим коммунизм по всему Тихому океану!"
 PRC_sea_ambition:0 "Амбиции в Юго-Восточной Азии"
 PRC_sea_ambition_desc:0 "Малаккский пролив — важнейшая торговая артерия между Востоком и Западом. Контролируя его, мы сможем решать судьбу некоторых стран."
 PRC_institution_reorganization:0 "Реорганизация учреждений"
 PRC_institution_reorganization_desc:0 "Нынешняя система образования развита недостаточно. Чтобы воспитывать талантливых людей, нам необходима её реорганизация."
 PRC_cult_of_personality:0 "Культ личности"
 PRC_cult_of_personality_desc:0 "Каждый гражданин должен восхищаться нашим славным лидером [PRC.GetLeader] и никем больше."
 PRC_eliminate_iliteracy:0 "Ликвидировать неграмотность"
 PRC_eliminate_iliteracy_desc:0 "Уровень неграмотности в нашей стране слишком высок. Для дальнейшего развития необходимо решить эту проблему."
 PRC_adopt_soviet_education_system:0 "Перенять советскую систему образования"
 PRC_adopt_soviet_education_system_desc:0 "Советская система прекрасно организована. Мы можем перенять её принципы и заменить ими нынешнюю систему образования."
 PRC_sov_cooperation:0 "Сотрудничество с Советским Союзом"
 PRC_sov_cooperation_desc:0 "Советский Союз, несомненно, является самой могущественной и успешной коммунистической страной мира. Нам есть чему у него поучиться."
 PRC_the_new_communism_beacon:0 "Новый маяк коммунизма"
 PRC_the_new_communism_beacon_desc:0 "Советский Союз наводнили ревизионисты, сошедшие с пути Карла Маркса. Мы не последуем за этой прогнившей системой."
 PRC_anti_soviet_revisionist_aim:0 "Курс против советского ревизионизма"
 PRC_anti_soviet_revisionist_aim_desc:0 "Советский ревизионизм отравляет сознание миллионов товарищей, живущих в Советском Союзе. Мы должны подготовиться к их освобождению!"
 PRC_liberate_the_soviet_people:0 "Освободить советский народ"
 PRC_liberate_the_soviet_people_desc:0 "Пришло время освободить советский народ от мерзких ревизионистов!"
 PRC_state_controlled_education:0 "Образование под контролем государства"
 PRC_state_controlled_education_desc:0 "В наших школах нельзя преподавать ничего, что способно увести народ от принципов коммунизма!"
 PRC_liberate_tibet:0 "Освободить Тибет"
 PRC_liberate_tibet_desc:0 "Когда-то Тибет обманом заставили отделиться от Китая. Теперь мы должны освободить его жителей от капитализма, отравившего их сердца и умы."
 PRC_establish_air_force:0 "Создать военно-воздушные силы НОАК"
 PRC_establish_air_force_desc:0 "Наши молодые военно-воздушные силы обретают форму, и теперь нам нужна доктрина, которая направит их развитие."
 PRC_fighter_focus:0 "Упор на истребители"
 PRC_fighter_focus_desc:0 "В Великой войне воздушные бои ещё не сказали последнего слова. Опережающее развитие истребителей даст нам преимущество в будущем."
 PRC_bomber_focus:0 "Упор на бомбардировщики"
 PRC_bomber_focus_desc:0 "Когда люди будущего будут говорить об ужасах современных войн, они непременно вспомнят огонь, льющийся с небес. Мы сделаем всё, чтобы эти истории рассказывали наши враги."
 PRC_cas_effort:0 "Развитие штурмовой авиации"
 PRC_cas_effort_desc:0 "Современной армии необходима поддержка техники как на земле, так и в воздухе."
 PRC_nav_effort:0 "Развитие морской авиации"
 PRC_nav_effort_desc:0 "Современная морская война идёт не только под поверхностью воды, но и в небе над морями."
 PRC_economic_reform:0 "Экономическая реформа"
 PRC_economic_reform_desc:0 "Разрушения, вызванные Культурной революцией, толкают нашу страну к пропасти. Мы должны провести реформы, способные вывести нас из кризиса."
 PRC_generalissimo_lin:0 "Генералиссимус Линь"
 PRC_generalissimo_lin_desc:0 "Линь оказался единственным подходящим человеком для руководства вооружёнными силами страны, а потому провозгласил себя генералиссимусом."
 PRC_armament_reorganization:0 "Реорганизация производства вооружений"
 PRC_armament_reorganization_desc:0 "Мы должны увеличить выпуск вооружений в нашей стране."
 PRC_expand_taiyuan_arsenal:0 "Расширить Тайюаньский арсенал"
 PRC_expand_taiyuan_arsenal_desc:0 "Тайюаньский арсенал известен качеством своей продукции. Если профинансировать его расширение, мы сможем значительно увеличить объёмы производства!"
 PRC_lure_them_in_strategy:0 "Стратегия заманивания"
 PRC_lure_them_in_strategy_desc:0 "Обширная территория и труднопроходимая местность позволяют нам отступать и заманивать захватчиков на выбранные нами поля сражений. Пусть империалисты попробуют нас преследовать! За каждым поворотом их будет ждать засада, а на каждом шагу — ловушка!"
 PRC_industrialization_NW:0 "Местная индустриализация: Северо-Запад"
 PRC_industrialization_NW_desc:0 "Сейчас Северо-Запад может казаться бесплодной землёй, но вскоре он станет одним из самых индустриализированных регионов."
 PRC_excavation_NW:0 "Разведка недр Северо-Запада"
 PRC_excavation_NW_desc:0 "Мы должны искать новые ресурсы на своей земле, чтобы избавиться от зависимости от импорта."
 PRC_industrialization_S:0 "Местная индустриализация: Юг"
 PRC_industrialization_S_desc:0 "Юг уже является одним из самых индустриализированных регионов, но его можно развить ещё сильнее."
 PRC_excavation_S:0 "Каучуковые плантации"
 PRC_excavation_S_desc:0 "Климат юга хорошо подходит для создания каучуковых плантаций."
 PRC_excavation_NE:0 "Разведка ресурсов Северо-Востока"
 PRC_excavation_NE_desc:0 "Японцы оставили в регионе множество инструментов. Мы можем использовать их для поиска новых месторождений."
 PRC_pioneering_the_north_east:0 "Учредить Агентство развития Северо-Востока"
 PRC_pioneering_the_north_east_desc:0 "Хотя японцы развивали отдельные районы Маньчжурии, огромные пространства всё ещё остаются нетронутыми. Следует начать масштабную программу, чтобы окончательно привести эти некогда дикие земли в современный мир."
 PRC_rectification:0 "Движение за исправление стиля"
 PRC_rectification_desc:0 "Некоторые товарищи не вполне преданы руководящим принципам коммунизма. Мы должны исправить их образ мышления."
 PRC_increase_credibility_of_theory:0 "Повысить доверие к доктрине"
 PRC_increase_credibility_of_theory_desc:0 "Наши военные усилия увенчались успехом, и теперь мы можем укрепить доверие к обновлённым теориям."
 PRC_front_line_behind_enemy_line:0 "Фронт в тылу врага"
 PRC_front_line_behind_enemy_line_desc:0 "Чтобы полностью раскрыть потенциал партизанской войны, необходимо действовать за линией фронта противника: нарушать пути снабжения, атаковать узлы снабжения и саботировать промышленность."
 PRC_exploit_our_enemys_mistake:0 "Использовать ошибку врага"
 PRC_exploit_our_enemys_mistake_desc:0 "Действия врага на линии фронта плохо согласованы. Мы можем обратить это в свою пользу и извлечь из его ошибок максимум выгоды."
 PRC_dare_to_die_corps:0 "Корпус готовых умереть"
 PRC_dare_to_die_corps_desc:0 "Чтобы победить захватчиков, наш народ должен быть достаточно храбр, чтобы сделать всё необходимое для победы, и не бояться смерти."
 PRC_march_into_sik:0 "Вернуть Синьцзян"
 PRC_march_into_sik_desc:0 "Пришло время вернуть утраченные территории. Скоро Синьцзян вновь будет нашим."
 PRC_the_grand_northwest_united_proposal:0 "Предложение о Великом северо-западном союзе"
 PRC_the_grand_northwest_united_proposal_desc:0 "Бывший генерал Фэнтяньской клики Чжан Сюэлян планирует создать ещё одно правительство на северо-западе. Оно будет сотрудничать с Шэн Шицаем в Синьцзяне, получать поставки из Советского Союза и одновременно готовить оборону на востоке. Однако для осуществления этого плана нам необходимо разрешение Коминтерна."
 PRC_urge_zhang:0 "Связаться с Чжан Сюэляном"
 PRC_urge_zhang_desc:0 "Теперь, когда мы определились со следующим шагом, пора сообщить Чжану о нашем плане..."
 PRC_form_the_grand_northwest_united:0 "Северо-западное правительство национальной обороны"
 PRC_form_the_grand_northwest_united_desc:0 "Почти все решения приняты, а Ганьсу находится под нашим контролем. Теперь мы можем воплотить план «Великого северо-западного союза» в жизнь."
 PRC_unite_against_the_jap:0 "Объединиться против японцев"
 PRC_unite_against_the_jap_desc:0 "Хотя НРА сейчас организована не лучшим образом, вместе, как братья по оружию, мы получим больше шансов отразить захватчиков."
 PRC_destroy_mao_and_his_clique:0 "Уничтожить коммунистов"
 PRC_destroy_mao_and_his_clique_desc:0 "Хотя Чжан теперь возглавляет коммунистическое правительство, он по-прежнему разделяет многие идеалы фашизма. Придя к власти, он наконец получил возможность искоренить коммунизм и установить подлинный фашистский режим!"
 PRC_trust_in_communism:0 "Поверить в коммунизм"
 PRC_trust_in_communism_desc:0 "Коммунисты неслучайно так долго противостоят НРА, и Чжан намерен выяснить причину их стойкости."
 PRC_government_reshuffle:0 "Перестановки в правительстве"
 PRC_government_reshuffle_desc:0 "Пораженцы и чрезмерные оптимисты в правительстве способны лишь привести недавно созданный союз к краху. Необходимо принять меры, чтобы предотвратить подобную катастрофу."
 PRC_invite_shx:0 "Суйюаньский коридор"
 PRC_invite_shx_desc:0 "Получив доступ к Суйюаню, наши войска смогут без труда добраться до фронта. Однако местные военачальники мешают осуществлению этого плана."
 PRC_retake_dongbei:0 "Вернуть Дунбэй"
 PRC_retake_dongbei_desc:0 "После японского вторжения в Маньчжурию северо-восточный регион оказался под оккупацией. Теперь мы вернём то, что принадлежит нам по праву!"
 PRC_winter_training:0 "Зимняя подготовка"
 PRC_winter_training_desc:0 "Суровый северный климат оказался беспощаден. Специальная подготовка к действиям в холодное время позволит нашим войскам легче справляться с этими условиями."
 PRC_mountain_training:0 "Горная подготовка"
 PRC_mountain_training_desc:0 "Гористая местность Китая станет серьёзной преградой для механизированных сил захватчиков. Лишившись их поддержки, враг не сможет противостоять нашим хорошо подготовленным бойцам."
 PRC_recall_feng_clique_generals:0 "Отозвать генералов Фэнтяньской клики"
 PRC_recall_feng_clique_generals_desc:0 "Укрепив своё положение в недавно созданном правительстве, Чжан решил призвать бывших генералов Фэнтяньской клики, чтобы те помогли ему дать отпор японцам."
 PRC_incorporate_xbj:0 "Включить Северо-западную армию"
 PRC_incorporate_xbj_desc:0 "Северо-западная армия Ян Хучэна поддержала план Чжана. В предстоящей войне нам пригодятся дополнительные бойцы."
 PRC_fight_alone:0 "Одинокий волк"
 PRC_fight_alone_desc:0 "НРА — некомпетентная организация, и совместная борьба лишь потянет нас на дно вместе с ней. Чтобы эффективно сражаться с японцами, мы должны действовать самостоятельно."
 PRC_military_knowledge_exchange:0 "Обмен военными знаниями"
 PRC_military_knowledge_exchange_desc:0 "И в тактике НРА, и в нашей есть недостатки. Обмен военными специалистами позволит значительно улучшить наши методы ведения войны, а объединённая мощь двух армий наверняка изгонит японцев с нашей земли."
 PRC_study_kmt_equipment:0 "Изучить снаряжение НРА"
 PRC_study_kmt_equipment_desc:0 "Пусть снаряжение НРА и не отличается высочайшим качеством, оно всё же превосходит то, чем оснащена большая часть наших войск. Его изучение расширит наши знания в области стрелкового оружия."
 PRC_apologise_to_sov:0 "Восстановление [SOV.GetAdjective] сотрудничество"
 PRC_apologise_to_sov_desc:0 "Несмотря на наше неповиновение советским распоряжениям при создании нового правительства, в итоге мы всё же вступили в единый фронт с Гоминьданом. Советские представители наверняка смогут закрыть глаза на эту небольшую «провинность»..."
 PRC_pressure_prince_dem:0 "Оказать давление на Чахарское правительство"
 PRC_pressure_prince_dem_desc:0 "Японская марионетка в Чахаре оказалась менее устойчивой, чем мы ожидали. Подкуп и обещание выгод позволят разобраться с ней без кровопролития. Если же этого окажется недостаточно, тогда..."
 PRC_reform_high_command:0 "Реформировать высшее командование"
 PRC_reform_high_command_desc:0 "Наше высшее командование нуждается в серьёзной доработке. Нынешняя структура слишком рыхлая, а цепочка командования плохо подходит для координации крупной армии."
 PRC_focus_on_red_army:0 "Сделать ставку на Красную армию"
 PRC_focus_on_red_army_desc:0 "Коммунистическая Красная армия превосходно владеет партизанской тактикой и пользуется огромной поддержкой народа. Сосредоточившись на ней, мы значительно укрепим свою легитимность."
 PRC_focus_on_dong_beijun:0 "Сделать ставку на Дунбэйскую армию"
 PRC_focus_on_dong_beijun_desc:0 "Хорошо организованная Дунбэйская армия под командованием Чжан Сюэляна готова умереть за родную землю. Уделив ей больше внимания, мы значительно повысим боеспособность наших войск."
 PRC_guerilla_operation_expansion:0 "Расширить партизанские операции"
 PRC_guerilla_operation_expansion_desc:0 "Наши бесстрашные партизаны уже добились определённых успехов. Следует распространить партизанские методы и на другие задачи, например поручить нашим бойцам борьбу с вражескими партизанами. Это заметно снизит расходы на оккупацию вражеских территорий."
 PRC_stir_anti_japanese_sentiment:0 "Разжечь антияпонские настроения"
 PRC_stir_anti_japanese_sentiment_desc:0 "Японская оккупация Маньчжурии вынудила наших братьев покинуть родные дома в Дунбэе. Мы можем использовать это в пропаганде и поднять их боевой дух."
 PRC_enforce_our_goal:0 "Осуществить нашу цель"
 PRC_enforce_our_goal_desc:0 "Мы не должны забывать, ради чего создавалось это правительство. Пришло время действовать."
 KMT_hundred_flowers_campaign:0 "Кампания «Пусть расцветают сто цветов»"
 KMT_hundred_flowers_campaign_desc:0 "Среди нас всё ещё скрываются реакционеры. Лучший способ разоблачить их — дать им возможность открыто высказать свои мысли."
 KMT_great_leap_forawrd:0 "Большой скачок"
 KMT_great_leap_forawrd_desc:0 "Мы сильно отстаём как от западных держав, так и от Советов. Чтобы достичь истинного коммунизма и защитить народ, необходимо начать массовую кампанию и наверстать отставание в кратчайшие сроки."
 PRC_begin_cultural_revolution:0 "Начать культурную революцию"
 PRC_begin_cultural_revolution_desc:0 "Недавние правительственные изменения в [SOV.getNameDef] Возникли серьезные сомнения относительно правильного толкования коммунизма и того, в какой форме он должен руководствоваться. [PRC.getNameDef] к желаемому процветанию. Различные группы уже начали борьбу за власть, чтобы достичь высот нашего любимого председателя. Только время покажет, куда она приведет нашу славную страну."
 PRC_mongolia_issue:0 "Монгольский вопрос"
 PRC_mongolia_issue_desc:0 "Монголия — неотъемлемая часть Китая, и она должна быть нам возвращена!"
 PRC_exert_influence_in_sea:0 "Расширить влияние в Юго-Восточной Азии"
 PRC_exert_influence_in_sea_desc:0 "Через Юго-Восточную Азию проходит множество важнейших морских путей. Укрепив влияние в регионе, мы обеспечим себе тактическое преимущество на случай войны."
 PRC_coerce_korea:0 "Принудить Корею"
 PRC_coerce_korea_desc:0 "Полуостров Чосон имеет первостепенное стратегическое значение. Мы обязаны овладеть им, чтобы обеспечить себе преимущество в военное время!"
 PRC_exert_influence_in_central_asia:0 "Расширить влияние в Центральной Азии"
 PRC_exert_influence_in_central_asia_desc:0 "Влияние на политику некоторых соседей в этом регионе позволит уменьшить сопротивление, если мы когда-либо решим расширяться на запад."
 PRC_exert_influence_in_india_and_mongolia:0 "Расширить влияние в Монголии и Индии"
 PRC_exert_influence_in_india_and_mongolia_desc:0 "Война на два фронта — это последнее, чего мы хотим. Чтобы предотвратить это, мы должны обеспечить безопасность нашей северной и южной границы. Превращение наших соседей в наших друзей может быть очень полезным."
 PRC_demand_return_of_trade_ports:0 "Потребовать возвращения торговых портов"
 PRC_demand_return_of_trade_ports_desc:0 "Иностранные концессии унижают нашу нацию. Мы должны немедленно потребовать прекращения действия неравноправных договоров!"
 PRC_the_permanent_revolution:0 "Перманентная революция"
 PRC_the_permanent_revolution_desc:0 "Коммунизма в одной стране совершенно недостаточно — весь мир должен последовать истинным путём Маркса и Ленина!"
 PRC_aid_the_workers:0 "Помочь рабочим"
 PRC_aid_the_workers_desc:0 "Рабочие соседних стран слишком долго страдали от угнетения. Пришло время освободить их от капиталистических поработителей!"
 PRC_hire_sov_experts:0 "Нанять советских специалистов"
 PRC_hire_sov_experts_desc:0 "Советские специалисты могут дать бесценные рекомендации по развитию нашей промышленности. Их советы стоят потраченных на найм средств."
 PRC_import_sov_machinery:0 "Импортировать советское оборудование"
 PRC_import_sov_machinery_desc:0 "Нынешнее оборудование в нашей стране крайне низкого качества. Советские станки, напротив, способны производить первоклассные материалы в огромных объёмах. Их импорт обеспечит создание мощной промышленности."
 PRC_invest_in_new_companies:0 "Инвестировать в новые компании"
 PRC_invest_in_new_companies_desc:0 "В нашей стране существует лишь несколько отечественных компаний. Следует вложиться в создание новых предприятий, чтобы повысить конкурентоспособность страны на мировом рынке."
 PRC_assistance_in_naval_industry:0 "Запросить советскую помощь флоту"
 PRC_assistance_in_naval_industry_desc:0 "Мощная советская судостроительная промышленность сможет предоставить нам необходимую помощь в создании собственного военно-морского производства!"
 PRC_study_soviet_ships:0 "Изучить советские корабли"
 PRC_study_soviet_ships_desc:0 "Изучение иностранных проектов поможет нашим инженерам лучше разобраться в технологиях кораблестроения."
 PRC_study_sov_aircrafts:0 "Изучить советские самолёты"
 PRC_study_sov_aircrafts_desc:0 "Изучение иностранных проектов поможет нашим инженерам лучше разобраться в авиационных технологиях."
 PRC_study_sov_equipments:0 "Изучить советское армейское снаряжение"
 PRC_study_sov_equipments_desc:0 "Изучение иностранных образцов расширит знания наших военных инженеров."
 PRC_sov_military_advisor:0 "Советские военные советники"
 PRC_sov_military_advisor_desc:0 "С помощью опытных советских генералов в отставке наша армия сможет действовать эффективнее."
 PRC_the_second_northeast_flag_replacement:0 "Вторая смена флага на Северо-Востоке"
 PRC_the_second_northeast_flag_replacement_desc:0 "Дунбэйская армия была решающей силой в эпоху милитаристов. Без наших действий в ходе Войны центральных равнин Нанкинское правительство не одержало бы победу; без смены флага на Северо-Востоке Китай не был бы «объединён» под одним знаменем. Теперь мы возродим Фэнтяньскую клику и покажем Нанкинскому правительству, кто больше подходит для управления Китаем."
 PRC_submit_to_central_government:0 "Подчиниться центральному правительству"
 PRC_submit_to_central_government_desc:0 "Теперь мы понимаем, что наши цели нереалистичны. Возможно, разумнее будет просто подчиниться центральному правительству..."
 PRC_revive_arsenals:0 "Возродить арсеналы"
 PRC_revive_arsenals_desc:0 "Большая часть арсеналов в северо-восточном регионе осталась нетронутой, некоторые даже получают благосклонность от японцев. Теперь мы можем использовать их для производства военной машины, которая нам нужна, чтобы восстановить фэнтийскую клику до ее былой славы."
 PRC_revive_the_navy_and_air_force:0 "Возродить флот и авиацию"
 PRC_revive_the_navy_and_air_force_desc:0 "Флот и авиация были одной из главных причин нашей мощи в эпоху милитаристов. Мы должны восстановить их, чтобы вновь стать силой, с которой придётся считаться."
 PRC_pact_with_jap:0 "Пакт с Японией"
 PRC_pact_with_jap_desc:0 "Хотя прежде японцы были нашими врагами, их военная мощь неоспорима. Возможно, стоит отбросить предубеждения и заключить с ними союз?"
 PRC_king_of_dongbei:0 "Король Дунбэя"
 PRC_king_of_dongbei_desc:0 "Мы вернули утраченные земли, и теперь этот регион вновь станет центром наших операций."
 PRC_industrial_developement:0 "Промышленное развитие"
 PRC_industrial_developement_desc:0 "В истерзанном войной Дунбэе осталось мало инфраструктуры. Дополнительные усилия по восстановлению региона повысят объёмы нашего производства."
 PRC_study_foreign_equipment:0 "Изучить иностранное снаряжение"
 PRC_study_foreign_equipment_desc:0 "Мы можем копировать иностранное снаряжение и совершенствовать собственные образцы на основе чужих разработок."
 PRC_expand_unversity:0 "Расширить университеты"
 PRC_expand_unversity_desc:0 "Образование незаменимо. Мы должны построить больше университетов, чтобы воспитать новое поколение ради будущего нашей страны."
 PRC_establish_general_staff:0 "Учредить генеральный штаб"
 PRC_establish_general_staff_desc:0 "Численность наших вооружённых сил значительно выросла. Для лучшей координации необходимо создать отдельный руководящий орган."
 PRC_claim_the_central_plain:0 "Предъявить права на Центральную равнину"
 PRC_claim_the_central_plain_desc:0 "Южное правительство уже давно поглядывает на наши территории. Мы должны разгромить его прежде, чем оно сделает то же самое с нами."
 PRC_secure_the_far_east:0 "Обезопасить Дальний Восток"
 PRC_secure_the_far_east_desc:0 "Российский Дальний Восток лишает нас прямого выхода к Тихому океану, что серьёзно препятствует расширению флота. В интересах нашей страны мы должны установить контроль над этим регионом."
 PRC_joint_warfare:0 "Совместные боевые действия"
 PRC_joint_warfare_desc:0 "Длинное китайское побережье предоставляет отличную возможность одновременно задействовать воздушные, морские и сухопутные силы. Следует глубже развивать столь эффективную тактику."
 PRC_pressure_korea:0 "Оказать давление на Корею"
 PRC_pressure_korea_desc:0 "После захвата важнейших городов Дальнего Востока наше влияние продолжает расти. Теперь, когда Корея окружена нашими войсками, её руководство должно понимать, какое решение будет для него наилучшим."
 PRC_special_research_department:0 "Особый исследовательский отдел"
 PRC_special_research_department_desc:0 "Научный прогресс жизненно важен для выживания нашей страны."
 PRC_provisional_science_department:0 "Временный исследовательский отдел"
 PRC_provisional_science_department_desc:0 "После масштабной перестановки в правительстве к нам присоединилось немало блестящих умов. Следует немедленно создать новый исследовательский отдел и поручить им работу!"
 PRC_establish_top_command:0 "Учредить верховное командование"
 PRC_establish_top_command_desc:0 "Для более эффективного управления и координации войск необходимо назначить высший орган военного руководства."
 PRC_expand_navy_command_structure:0 "Расширить командование флотом"
 PRC_expand_navy_command_structure_desc:0 "Поскольку наш флот неуклонно растёт, ему требуется отдельная командная структура."
 PRC_expand_air_command_structure:0 "Расширить командование авиацией"
 PRC_expand_air_command_structure_desc:0 "Поскольку наши военно-воздушные силы неуклонно растут, им требуется отдельная командная структура."
 PRC_yellow_sea_navy:0 "Флот Жёлтого моря"
 PRC_yellow_sea_navy_desc:0 "В Жёлтом море находится главная база наших военно-морских операций. Чтобы обеспечить её безопасность, необходимо укрепить прибрежный флот."
 PRC_pacific_fleet:0 "Тихоокеанский флот"
 PRC_pacific_fleet_desc:0 "Мы должны ставить более высокие цели. Расширение флота для действий в открытом море является необходимостью."
 PRC_naval_air_effort:0 "Развитие палубной авиации"
 PRC_naval_air_effort_desc:0 "В последние годы авианосцы оказались в центре развития военно-морских сил. Мы должны идти в ногу со временем."
 PRC_naval_innovation:0 "Инновации во флоте"
 PRC_naval_innovation_desc:0 "Традиционные морские доктрины и конструкции кораблей в конечном счёте устареют. Пока враг топчется на месте, мы должны найти новые и более эффективные способы уничтожать его на море."
 PRC_fight_effort:0 "Развитие истребителей"
 PRC_fight_effort_desc:0 "Великая война явно не стала последней эпохой воздушных боёв. Опережая других в разработке истребителей, мы обеспечим себе преимущество в будущем."
 PRC_bomber_effort:0 "Развитие бомбардировщиков"
 PRC_bomber_effort_desc:0 "Когда люди будущего будут говорить об ужасах современных войн, они непременно вспомнят огонь, льющийся с небес. Мы сделаем всё возможное, чтобы эти истории рассказывали наши враги."
 PRC_air_innovation:0 "Инновации в авиации"
 PRC_air_innovation_desc:0 "Традиционные воздушные доктрины и конструкции самолётов в конечном счёте устареют. Пока враг топчется на месте, мы должны найти новые и более эффективные способы уничтожать его в воздухе."
 PRC_introduce_jap_shipbuilding_tech:0 "Запросить японскую помощь флоту"
 PRC_introduce_jap_shipbuilding_tech_desc:0 "Наш союзник располагает мощной судостроительной промышленностью, и мы можем попросить его помочь развитию нашей собственной."
 PRC_jap_military_advisor:0 "Японские военные советники"
 PRC_jap_military_advisor_desc:0 "Япония обладает более долгой и выдающейся военной историей, чем мы. Её опыт принесёт огромную пользу развитию наших вооружённых сил."
 PRC_west_pacific_alliance:0 "Западно-Тихоокеанский альянс"
 PRC_west_pacific_alliance_desc:0 "Чтобы обеспечить выживание и процветание обеих наших стран, необходимо заключить союз."
 PRC_coup_in_philipine:0 "Поддержать фашистский переворот в Юго-Восточной Азии"
 PRC_coup_in_philipine_desc:0 "Народы должны восстать против своих некомпетентных правительств и последовать истинным путём фашизма. Те, кто решится на это, получат нашу полную поддержку."
 PRC_burn_the_bridge:0 "Сжечь мосты"
 PRC_burn_the_bridge_desc:0 "Мы получили от Японии всё необходимое, а значит, пришло время разорвать наш пакт и сокрушить её!"
 PRC_battlefield_four:0 "Шестой театр военных действий"
 PRC_battlefield_four_desc:0 "Гигант по ту сторону Тихого океана представляет реальную угрозу нашей стране. Мы должны уничтожить его прежде, чем он уничтожит нас!"
 PRC_restart_the_civil_war:0 "Возобновить гражданскую войну"
 PRC_restart_the_civil_war_desc:0 "Когда общая угроза устранена, мы можем сосредоточиться на свержении коррумпированного правительства Гоминьдана и освобождении китайского народа из-под его власти."
 PRC_continuous_naval_production:0 "Производство кораблей"
 PRC_continuous_naval_production_desc:0 "Сосредоточив ресурсы на верфях и освободив квалифицированных кораблестроителей от военной службы, мы сможем значительно сократить сроки строительства кораблей."
 PRC_continuous_air_production:0 "Авиационное производство"
 PRC_continuous_air_production_desc:0 "Мы можем реорганизовать авиационную промышленность, чтобы устранить потери и оптимизировать производство."
 PRC_continuous_non_factory_construct:0 "Строительная инженерия"
 PRC_continuous_non_factory_construct_desc:0 "В нашей строительной отрасли всё ещё имеются значительные неиспользованные резервы. Сосредоточив на ней внимание, мы сможем существенно повысить скорость строительства. К сожалению, производство станков оказалось главным узким местом при расширении тяжёлой промышленности, поэтому усилия в этой области не принесут ей пользы. "
 PRC_continuous_reduce_training_time:0 "Подготовка армии"
 PRC_continuous_reduce_training_time_desc:0 "Создав в каждой дивизии специализированные подразделения углублённой подготовки, мы сможем отправлять на фронт даже те дивизии, которые прежде задерживались в тылу до окончания обучения."
 PRC_continuous_suppression:0 "Подавление сопротивления"
 PRC_continuous_suppression_desc:0 "Внедрившись в крупнейшие группы сопротивления на оккупированных территориях и завербовав их руководителей, мы сможем значительно сократить наносимый ими ущерб."
 PRC_continuous_repair:0 "Ремонт сооружений"
 PRC_continuous_repair_desc:0 "Мы сформируем специализированные ремонтные бригады из работников заводов и строительной отрасли и централизованно организуем их развёртывание, чтобы ускорить восстановление повреждённой инфраструктуры."
 PRC_continuous_tech_share:0 "Обмен технологиями"
 PRC_continuous_tech_share_desc:0 "Мы призовём наши исследовательские институты и университеты наладить связи с коллегами в союзных странах. Это даст нам бонус к обмену технологиями."
 PRC_continuous_boost_freedom:0 "Расширение автономии"
 PRC_continuous_boost_freedom_desc:0 "Реорганизовав колониальную бюрократию и привлекая местных администраторов, со временем мы сможем самостоятельно распоряжаться собственными делами."
 PRC_continuous_restrict_freedom:0 "Подавление субъектов"
 PRC_continuous_restrict_freedom_desc:0 "Нашим колониальным субъектам пришли в голову довольно нелепые идеи о таких вещах, как \"самоопределение\" или \"национальная независимость\". Пора избавить их от этих заблуждений."
 PRC_he_long:0 "Хэ Лун"
 PRC_luo_rong_huan:0 "Ло Жунхуань"
 prc.1.t:0 "Поставки из государства [SOV.GetName]"
 prc.1.d:0 "После открытия маршрута советских поставок в Яньань прибыли снаряжение и добровольцы, ожидающие проверки со стороны [Root.GetLeader]."
 prc.1.a:0 "Это внесёт огромный вклад в войну против японцев."
 prc.2.t:0 "Коммунистическая армия включена в наши силы"
 prc.2.d:0 "Коммунисты согласились позволить нам включить их людей в состав нашей армии. Теперь мы вместе выступим против общего врага."
 prc.2.a:0 "Наш враг не добьётся успеха!"
 prc.3.t:0 "Ошибочная чистка"
 prc.3.d:0 "В ходе попыток очистить наши ряды от реакционеров некоторых товарищей ошибочно обвинили в следовании \"правому\", а не \"левому\" курсу. Это неизбежно скажется на эффективности нашей работы."
 prc.3.a:0 "Некоторые наши товарищи слишком \"левые\", чтобы называть других \"правыми\"..."
 prc.4.t:0 "Талантливые кадры"
 prc.4.d:0 "В обществе проявили себя несколько талантливых граждан. Мы могли бы предоставить им места в наших учреждениях."
 prc.4.a:0 "Прогресс никогда не остановится!"
 prc.5.t:0 "Сталин скончался"
 prc.5.d:0 "Наш славный вождь Иосиф Виссарионович Сталин вчера принял приглашение Карла Маркса и покинул нас. Это огромная утрата для советского народа.\n\nНачалась борьба за власть: влиятельные члены партии соперничают за освободившееся после смерти Сталина место."
 prc.5.a:0 "Пала звезда..."
 prc.6.t:0 "Тезисы [GetMonth]"
 prc.6.d:0 "После того как наш Великий председатель Мао подверг критике пьесу \"Разжалование Хай Жуя\", группа людей попыталась насколько возможно смягчить последствия его заявления, объявив, что критика Великого председателя Мао носила исключительно академический характер. Ранее Великий председатель Мао хвалил эту пьесу как удачное изображение классового конфликта в социалистическом государстве.\n\nЭто отступление Великого председателя Мао вызвало широкий резонанс по всей стране: вся пресса вынесла событие на первые полосы и освещает его в огромных масштабах."
 prc.6.a:0 "Будем надеяться, что из этого ничего не выйдет..."
 prc.7.t:0 "Начало Культурной революции"
 prc.7.d:0 "Великий председатель Мао опубликовал уведомление, в котором заявил, что капитализм разложил некоторых высокопоставленных партийных чиновников и что их необходимо отстранить от власти. В уведомлении также отвергались тезисы, опубликованные после критики Великим председателем Мао пьесы \"Разжалование Хай Жуя\".\n\nВ тот же день несколько высокопоставленных чиновников были исключены из партии."
 prc.7.a:0 "Всё это выглядит скверно..."
 prc.8.t:0 "Смерть Линь Бяо"
 prc.8.d:0 "Линь Бяо, лично избранный наследник Великого председателя Мао, погиб в авиакатастрофе в Ундерхаане. Найденные на борту документы указывают, что среди жертв были Линь и несколько членов его семьи. Точная причина крушения до сих пор неизвестна.\n\nОтношения Линя с Великим председателем Мао ухудшались из-за разногласий по вопросу упразднения должности председателя КНР. Считалось, что Линь стоял за несколькими покушениями на Великого председателя Мао и пытался бежать, опасаясь стать следующей мишенью хунвейбинов."
 prc.8.a:0 "Всё выходит из-под контроля!"
 prc.10.t:0 "Линь Бяо бежал в государство [PRC_linbiao_flee_target.GetName]"
 prc.10.d:0 "Линь Бяо, лично избранный наследник Великого председателя Мао, бежал в государство [PRC_linbiao_flee_target.GetName] и самолётом прибыл в город [PRC_linbiao_flee_target.Capital.GetName]. Партия и Великий председатель Мао объявили, что Линь бежал из страха перед преследованием за попытку убийства Великого председателя Мао и потому запросил убежище в государстве [PRC_linbiao_flee_target.GetName].\n\nХунвейбины начали критиковать Линя и членов его семьи, не участвовавших в побеге. Впоследствии хунвейбины забили их до смерти."
 prc.10.a:0 "Похоже, ближайшие соратники Мао начинают видеть его истинное лицо."
 prc.11.t:0 "Смерть Чжоу Эньлая"
 prc.11.d:0 "Чжоу Эньлай, председатель Народного политического консультативного совета Китая, скончался. Несмотря на все его усилия и преданность, Великий председатель Мао отказался присутствовать на похоронах. Невзирая на царящий хаос, по всей стране люди проводили собрания в память о нём. У Монумента народным героям появилось множество венков в честь любимого председателя."
 prc.11.a:0 "Трагическая утрата..."
 prc.12.t:0 "Смерть Мао Цзэдуна"
 prc.12.d:0 "Великий председатель Мао Цзэдун скончался от многочисленных болезней в своей резиденции в Чжуннаньхае. Великий председатель основал КПК и одержал победу во Второй гражданской войне в Китае. После того как он узнал о предательстве Линя, его здоровье стало стремительно ухудшаться. Хотя на короткое время он пошёл на поправку, в конце концов он принял приглашение Карла Маркса. Его тело планируют сохранить в хрустальном саркофаге в недавно возведённом на площади Тяньаньмэнь Мавзолее Мао Цзэдуна, чтобы будущие поколения по-прежнему могли почитать некогда славного председателя Китая."
 prc.12.a:0 "Ещё одна потеря руководителя. Всё это выглядит скверно."
 prc.13.t:0 "Банда четырёх разгромлена"
 prc.13.d:0 "[Root.GetLeader] арестовал \"Банду четырёх\", ответственную за большинство кампаний позднего периода \"Культурной революции\", включая критику Конфуция и Линь Бяо. Глава банды Цзян Цин, вдова Мао, заявила, что они лишь исполняли волю Мао. Однако ещё при жизни Мао пытался ограничить влияние банды. Теперь, когда \"Банда четырёх\" устранена, хаос, продолжавшийся почти десятилетие, должен наконец подойти к концу."
 prc.13.a:0 "Их следовало арестовать и казнить давным-давно!"
 prc.14.t:0 "Иностранные инвестиции"
 prc.14.d:0 "Благодаря проводимым реформам наша экономика привлекла некоторые иностранные компании, решившие вложить в неё средства. Это ещё сильнее укрепит нашу экономику."
 prc.14.a:0 "Наша экономика станет одной из сильнейших!"
 prc.15.t:0 "Внедрение зарубежных исследований"
 prc.15.d:0 "В наши лаборатории поступили некоторые зарубежные исследования, что ускорит ход наших научных работ."
 prc.15.a:0 "Наука!"
 prc.21.t:0 "Последствия реформ"
 prc.21.d:0 "Реформы создали достаточно сильную страну для китайского народа и в значительной степени устранили последствия \"Культурной революции\"."
 prc.21.a:0 "Китай поднимается!"
 prc.22.t:0 "Дэн Сяопин захватывает власть"
 prc.22.d:0 "После того как Хуа Гофэн выступил с самокритикой на недавнем заседании, Дэн Сяопин занял высшую должность в партии и тем самым стал самым влиятельным человеком в стране."
 prc.22.a:0 "Будем надеяться, он лучше Хуа..."
 prc.23.t:0 "Линь Бяо захватывает власть"
 prc.23.d:0 "Линь Бяо, бежавший в государство [SOV.GetName] во время \"Культурной революции\", вернулся и захватил власть, устроив переворот вместе с уцелевшими подчинёнными, пережившими Десятилетие хаоса. Он сверг Хуа Гофэна и занял пост председателя КНР."
 prc.23.a:0 "Призрак прошлого!"
 prc.24.t:0 "Западный поход"
 prc.24.d:0 "Невыносимо медленное продвижение западного похода заставило Мао задуматься о перемирии, которое положило бы конец этой бесплодной экспедиции."
 prc.24.a:0 "Поход потерпел неудачу."
 prc.24.b:0 "Нужно лишь подождать."
 prc.25.t:0 "Визит Бай Цюэня"
 prc.25.d:0 "Канадский коммунист Норман Бетьюн, также известный как Бай Цюэнь, вчера посетил Мао. Бай настоял, что будет проводить полевые операции нашим солдатам, чтобы помочь нам в войне против японцев."
 prc.25.a:0 "Врач — именно то, что нам нужно!"
 prc.26.t:0 "Противотечение [GetMonth]"
 prc.26.d:0 "Конфликт между некоторыми старшими членами партии и Цзян Цин становится всё более явным. Группа Цзян Цин объявила старших членов партии реакционерами, из-за чего Мао утратил доверие к некоторым из них."
 prc.26.a:0 "Политика — тёмное дело."
 prc.27.t:0 "Хэ Лун под домашним арестом"
 prc.27.d:0 "Неповиновение Хэ Луна приказу Мао \"искоренить капиталистов\" вызвало недоверие со стороны Мао, и вчера Хэ Лун был помещён под домашний арест в Сишане."
 prc.27.a:0 "Политика — тёмное дело."
 prc.28.t:0 "Пэн Дэхуай похищен"
 prc.28.d:0 "Цзян Цин разрешила хунвейбинам похитить генерала Пэн Дэхуая, после чего тот был допрошен. По окончании допроса Пэна заключили в тюрьму."
 prc.28.a:0 "Политика — тёмное дело."
 prc.29.t:0 "Не Жунчжэнь понижен в должности"
 prc.29.d:0 "По приказу Мао Не Жунчжэнь был понижен в должности и отправлен работать на химический завод в Ханьдане."
 prc.29.a:0 "Политика — тёмное дело."
 prc.36.t:0 "Государство [PRC.GetName] планирует вторжение в государство [SIK.GetName]"
 prc.36.d:0 "Наш информатор в государстве [PRC.GetName] подтвердил, что там планируют силой захватить государство [SIK.GetName]."
 prc.36.a:0 "Потребовать от [SIK.GetLeader] сотрудничества во избежание кровопролития."
 prc.36.b:0 "Потребовать от [PRC.GetLeader] отказаться от этой идеи."
 prc.36.c:0 "Любопытно..."
 prc.37.t:0 "Посланник из государства [SOV.GetName]"
 prc.37.d:0 "[SOV.GetLeader] потребовал, чтобы мы мирно подчинились государству [PRC.GetName] и тем самым избежали дальнейшего кровопролития."
 prc.37.a:0 "Они правы — так будет лучше для нашего народа."
 prc.37.b:0 "Что за вздор! Мы не сдадимся без боя!"
 prc.38.d:0 "[SOV.GetLeader] потребовал, чтобы мы отказались от плана вторжения в государство [SIK.GetName]."
 prc.38.a:0 "Слова [SOV.GetLeader] не так мудры, как слова [PRC.GetLeader]!"
 prc.38.b:0 "Не стоит привлекать ненужное внимание."
 prc.39.t:0 "Вмешательство государства [SOV.GetName]"
 prc.39.d:0 "Благодаря вмешательству государства [SOV.GetName] государство [SIK.GetName] мирно подчинилось нам."
 prc.39.a:0 "Так или иначе, наша цель достигнута."
 prc.40.t:0 "Государство [SIK.GetName] проявляет непокорность"
 prc.40.d:0 "[SIK.GetLeader] отказался мирно подчиниться государству [PRC.GetName]!"
 prc.40.a:0 "Как они смеют не выполнять наши приказы!"
 prc.41.t:0 "Государство [PRC.GetName] проявляет непокорность"
 prc.41.d:0 "[PRC.GetLeader] отказался отказаться от плана вторжения в государство [SIK.GetName]!"
 prc.42.t:0 "[PRC.GetLeader] подчинился нашему приказу"
 prc.42.d:0 "[SIK.GetLeader] отказался от плана вторжения в государство [SIK.GetName]!"
 prc.42.a:0 "По крайней мере, они ещё знают своё место."
 prc.43.t:0 "Подкрепления: [SOV.GetAdjective]"
 prc.43.d:0 "Ввиду упорного нежелания государства [SIK.GetName] подчиниться государство [SOV.GetName] направило нам подкрепления."
 prc.43.a:0 "Эти силы будут жизненно важны для наших усилий!"
 prc.44.d:0 "Ввиду воинственности государства [PRC.GetName] государство [SOV.GetName] направило нам подкрепления."
 prc.46.t:0 "Убийство Мао Цзэдуна"
 prc.46.d:0 "Сегодня наш Великий председатель Мао Цзэдун погиб в результате подлого покушения. Линь Бяо, лично избранный преемник Мао, решил раз и навсегда положить конец Культурной революции. Вся оппозиция была быстро устранена, и наша страна хотя бы отчасти восстанавливается после ущерба, нанесённого этой катастрофой.\n\nНекоторые сторонники теории заговора утверждают, что Линь сам организовал убийство, чтобы занять этот пост, однако никаких доказательств этого не существует."
 prc.46.a:0 "Сокрушительная утрата."
 prc.47.t:0 "Мао Цзэдун пережил покушение"
 prc.47.d:0 "Наш великий председатель Мао Цзэдун пережил сегодня покушение на убийство. Убийца был замечен прежде, чем он смог навредить нашему любимому Великому Председателю. Однако убийца, кажется, чрезвычайно лоялен к своему хозяину, так как он не сказал ни слова во время допроса.\n\nДикие слухи предполагали, что Лин Бяо, выбранный вручную преемник позиции Мао, инсценировал это покушение. Хотя нет никаких доказательств того, что это правда, некоторые красногвардейцы начинают критиковать Линь Бяо за такую «измену»."
 prc.47.a:0 "Да здравствует наш Великий председатель Мао Цзэдун!"
 prc.48.t:0 "Помощь от Советского Союза"
 prc.48.d:0 "Советский Союз направил помощь для поддержки нашей войны против японцев."
 prc.48.a:0 "Она будет жизненно важна для наших военных усилий."
 prc.49.t:0 "Наши партизаны подняли восстание"
 prc.49.d:0 "Наши партизаны в Маньчжурии подняли восстание и помогли нам установить контроль над регионом."
 prc.49.a:0 "Великолепно!"
 prc.50.t:0 "Перебежчики из НРА"
 prc.50.d:0 "Некоторые солдаты Национально-революционной армии решили перейти на нашу сторону."
 prc.50.a:0 "Провальные решения [CHI.GetLeader] ведут к поражению."
 prc.66.t:0 "Чэнь Дусю"
 prc.66.d:0 "После возвращения Троцкого в государство [SOV.GetNameDEF] сторонники троцкизма по всему миру подняли голову и начали критиковать \"развращённый\" коммунизм, созданный Сталиным. Среди них оказался один из наших бывших товарищей — Чэнь Дусю. Чтобы сохранить хорошие отношения с государством [SOV.GetNameDEF], нам следует привести Чэня к власти и избавиться от Мао."
 prc.66.a:0 "Продвинем идею перманентной революции!"
 prc.66.b:0 "Троцкизм — предательская идеология, связанная с фашизмом!"
 prc.54.t:0 "Предложение от государства [From.GetName]"
 prc.54.d:0 "Недавно мы получили предложение от представителя [From.GetLeader]. В нём говорится, что они хотели бы получить наше разрешение на создание ещё одного правительства в северо-западном Китае и при нашей поддержке вести борьбу против японцев и партии [CHI.GetRulingParty]."
 prc.54.a:0 "Передайте им, чтобы они вместо этого сотрудничали с партией [CHI.GetRulingParty]."
 prc.54.b:0 "Посмотрим, насколько хорошо они справятся."
 prc.55.t:0 "Чжан Сюэлян"
 prc.55.d:0 "Чжан отказывается продвигать план Великого северо-западного союза. Теперь, когда с нашей стороны всё решено, следует убедить Чжана, что подготовка полностью завершена."
 prc.55.a:0 "Просто избавьтесь от него. Он лишь замедлит наше продвижение."
 prc.55.b:0 "Согласиться с его предложением не выступать против партии [CHI.GetRulingParty]."
 prc.55.c:0 "Пригрозить выдать его Гоминьдану."
 prc.55.e:0 "Мы справимся и без него."
 prc.56.t:0 "Чжан Сюэлян убит"
 prc.56.d:0 "Мы узнали, что Чжан Сюэлян был убит. В него несколько раз выстрелили в голову и грудь. Некоторые предполагают, что это дело рук коммунистов, однако преступник до сих пор не найден."
 prc.56.a:0 "Теперь всё пойдёт по-нашему."
 prc.56.b:0 "Нам следует нанести удар прямо сейчас!"
 prc.57.t:0 "Чжан согласился"
 prc.57.d:0 "После некоторых раздумий Чжан Сюэлян решил присоединиться к Великому северо-западному союзу. Он возглавит его, как только мы обеспечим контроль над провинцией Ганьсу и официально создадим ВСС."
 prc.57.a:0 "Как и ожидалось."
 prc.59.t:0 "[From.GetName] отклоняет наше предложение"
 prc.59.d:0 "[From.GetLeader] отклонил наше предложение, заявив, что нам следует сотрудничать с [CHI.GetRulingParty], а не бороться против них."
 prc.59.a:0 "Возьмём дело в свои руки!"
 prc.59.b:0 "Подчиниться приказу."
 prc.60.t:0 "[From.GetName] одобряет наше предложение"
 prc.60.d:0 "[From.GetNameDEF] одобряет наше предложение о создании Великого Северо-Западного союза. Следует немедленно приступить к его осуществлению."
 prc.60.a:0 "Прекрасно!"
 prc.61.t:0 "[From.GetName] не подчиняется нашему приказу"
 prc.61.d:0 "Несмотря на наши благие намерения, [From.GetLeader] отказался подчиниться приказу и всё же решил создать Великий Северо-Западный союз."
 prc.61.a:0 "Сукин...!"
 prc.62.t:0 "Мао казнён"
 prc.62.d:0 "После стремительного ночного налёта на штаб-квартиру и дома Мао и его верных последователей многие коммунисты были арестованы и без суда казнены. Их тела развешены у некоторых проходов, чтобы напомнить людям о последствиях следования проклятому коммунизму."
 prc.62.a:0 "Отрубить голову этой мерзкой змее!"
 prc.63.t:0 "Затаившиеся коммунисты"
 prc.63.d:0 "Хотя ночной налёт завершился успешно, некоторые коммунисты всё ещё остаются в правительстве. В отношении одних имеются явные доказательства поддержки Мао, но позицию других невозможно определить наверняка."
 prc.63.a:0 "Казнить их всех!"
 prc.63.b:0 "Прежде чем действовать, нужно тщательнее установить их личности."
 prc.64.t:0 "Коммунистические партизаны"
 prc.64.d:0 "Некоторые коммунисты сформировали небольшие партизанские отряды, чтобы нападать на наши войска и базы. Как нам с ними поступить?"
 prc.64.a:0 "Жестоко подавить их!"
 prc.64.b:0 "Подкупить некоторых из них и посеять раздор."
 prc.65.t:0 "Учредить тайную полицию?"
 prc.65.d:0 "Теперь в нашем правительстве больше нет коммунистов. Однако среди гражданского населения их по-прежнему немало, и некоторые считают, что для более эффективного подавления коммунистической деятельности необходима тайная полиция."
 prc.65.a:0 "Мы должны защитить народ от красной чумы!"
 prc.65.b:0 "В этом нет необходимости."
 prc.67.t:0 "Послание от государства [From.GetName]"
 prc.67.d:0 "[From.GetName] направляет представителей на встречу с [Root.GetLeader] и требует передать им Суйюань. Взамен они предлагают нам вступить в альянс [From.GetFactionName] и оказать некоторую промышленную помощь."
 prc.67.a:0 "Звучит разумно."
 prc.67.b:0 "Даже в самых смелых мечтах!"
 prc.68.t:0 "[From.GetName] соглашается"
 prc.68.d:0 "[From.GetLeader] согласился передать нам Суйюань."
 prc.68.a:0 "Мудрый шаг"
 prc.69.t:0 "[From.GetName] отказывает"
 prc.69.d:0 "[From.GetLeader] отказался передать нам Суйюань."
 prc.69.a:0 "Бесполезное сопротивление."
 prc.70.t:0 "Сюй Ланьчжоу"
 prc.70.d:0 "После ухода в отставку Сюй Ланьчжоу стал наставником по боевым искусствам. Он заявляет, что больше не поведёт армию в бой, но с радостью обучит наших солдат боевым искусствам."
 prc.70.a:0 "Оставить его в покое."
 prc.70.b:0 "Нанять его наставником по боевым искусствам."
 prc.71.t:0 "[From.GetName] ищет союза"
 prc.71.d:0 "Хотя они создали своё правительство в северо-западном регионе, их цели, похоже, отчасти совпадают с нашими. Мы могли бы сотрудничать с ними и отогнать японцев обратно к морю."
 prc.71.a:0 "Китайцы должны объединиться против общих врагов."
 prc.71.b:0 "Они непременно ударят нам в спину!"
 prc.72.t:0 "Союз заключён"
 prc.72.d:0 "[From.GetName] принимает наше предложение о союзе."
 prc.72.a:0 "Смерть захватчикам!"
 prc.73.t:0 "Союз отвергнут"
 prc.73.d:0 "[From.GetName] отклоняет наше предложение."
 prc.73.a:0 "Будь они прокляты!"
 prc.74.t:0 "[From.GetName] предлагает обмен военными знаниями"
 prc.74.d:0 "Понимая, что поодиночке нам долго не продержаться, [From.GetLeader] решил наладить взаимодействие между нашими войсками. Так мы сможем перенять сильные стороны их армии, а они — нашей."
 prc.74.a:0 "Приемлемо"
 prc.74.b:0 "Наверняка они замышляют что-то недоброе..."
 prc.75.t:0 "Предложение принято"
 prc.75.d:0 "Некоторые офицеры НРА прибыли в наш командный центр и начали обмениваться военными знаниями с нашими командирами."
 prc.75.a:0 "Наша объединённая мощь поставит врагов на колени!"
 prc.76.t:0 "Предложение отклонено"
 prc.76.d:0 "[From.GetName] отклоняет наше предложение об обмене военными знаниями."
 prc.76.a:0 "О чём они вообще думают?"
 prc.77.t:0 "[From.GetName] приносит извинения"
 prc.77.d:0 "Несмотря на то, что они бросили вызов нашему порядку, сформировав [From.GetFactionName]В настоящее время они находятся в едином фронте с [CHI.GetNameDef]Это то, чего мы хотим от них добиться. Теперь они прислали нам извинения и хотят, чтобы мы упустили из виду их предыдущее «неправильное поведение»."
 prc.77.a:0 "Ну и ладно..."
 prc.77.b:0 "Никогда не видел настолько бесстыжих людей!"
 prc.78.t:0 "[From.GetName] принимает наши извинения"
 prc.78.d:0 "[From.GetName] принимает наши извинения."
 prc.78.a:0 "Отлично."
 prc.79.t:0 "[From.GetName] отвергает наши извинения"
 prc.79.d:0 "[From.GetName] отвергает наши извинения."
 prc.79.a:0 "Жаль"
 prc.80.t:0 "Давление со стороны государства [From.GetName]"
 prc.80.d:0 "В последнее время [From.GetName] оказывает всё большее давление на [Root.GetLeader]. Некоторые чиновники также убеждают [Root.GetLeader] подчиниться, прежде чем силы государства [From.GetName] ворвутся в его дом и обрекут его на гибель."
 prc.80.b:0 "Подчиниться, пока не поздно."
 prc.80.a:0 "Мы не поддадимся на столь примитивные уловки."
 prc.81.t:0 "[From.GetName] подчиняется"
 prc.81.d:0 "Не в силах больше выдерживать наше давление, [From.GetLeader] решил подчиниться нашему правительству."
 prc.81.a:0 "Мудрое решение."
 prc.82.t:0 "[From.GetName] отказывается подчиниться"
 prc.82.d:0 "Несмотря на сильное давление и уговоры подкупленных чиновников, [From.GetLeader] остаётся непреклонен. Он заявил нашему представителю, что никогда не подчинится нашей тиранической власти."
 prc.82.a:0 "Вскоре они осознают свою ошибку."
 prc.83.t:0 "[From.GetName] предаёт нас"
 prc.83.d:0 "[From.GetName] свергает наше марионеточное правительство и отныне сохраняет верность государству [PRC.GetName]!"
 prc.83.a:0 "Как они смеют!"
 prc.84.t:0 "[From.GetName] требует уступить территорию"
 prc.84.d:0 "[From.GetName] заявляет, что мы слишком долго оккупировали принадлежащие им по праву территории и настало время положить конец этой несправедливости."
 prc.84.a:0 "Мы не хотим начинать с ними войну."
 prc.84.b:0 "Это что, шутка?"
 prc.85.t:0 "[From.GetName] возвращает территорию"
 prc.85.d:0 "[From.GetName] решает вернуть нашу территорию."
 prc.85.a:0 "Так будет лучше для всех."
 prc.86.t:0 "[From.GetName] отказывается вернуть территорию"
 prc.86.d:0 "[From.GetName] решает оставить за собой нашу законную территорию."
 prc.86.a:0 "Придётся действовать силой."
 prc.87.d:0 "По мере непрерывного усиления государства [From.GetName] наши люди всё сильнее опасаются, что страна вскоре погибнет, если мы не примем чью-либо сторону. Только вчера на стол [Root.GetLeader] лёг ультиматум от государства [From.GetName] с требованием превратить [Root.GetName] в их протекторат."
 prc.87.a:0 "Трусы живут дольше..."
 prc.87.b:0 "Мы никогда не подчинимся тирану!"
 prc.88.a:0 "Занять эту область."
 prc.89.t:0 "[From.GetName] требует уступок"
 prc.92.t:0 "[From.GetName] пытается захватить власть"
 prc.92.d:0 "Сегодня утром [From.GetName] направляет представителей на встречу с [Root.GetLeader]. На встрече они главным образом требуют, чтобы [Root.GetLeader] отказался от власти и передал её государству [From.GetName]. После долгих раздумий [Root.GetLeader] принимает решение..."
 prc.92.a:0 "[Root.GetName] не подчинится дьяволу!"
 prc.92.b:0 "Отказаться от власти."
 prc.93.t:0 "[From.GetName] восстаёт"
 prc.93.d:0 "[From.GetLeader] предпочёл начать против нас войну, а не подчиниться."
 prc.93.a:0 "Оружие всё ещё может решить вопрос."
 prc.95.t:0 "[From.GetName] предлагает заключить пакт"
 prc.95.d:0 "[From.GetName] направляет представителей с просьбой подписать недавно подготовленный ими пакт. Он станет одновременно декларацией дружбы и договором о ненападении."
 prc.95.a:0 "Подписать его"
 prc.95.b:0 "Это наверняка какая-то примитивная уловка."
 prc.96.t:0 "Пакт подписан"
 prc.96.d:0 "[From.GetName] подписывает пакт."
 prc.96.a:0 "Превосходно!"
 prc.97.t:0 "Пакт отвергнут"
 prc.97.d:0 "[From.GetName] отказывается подписать пакт."
 prc.97.a:0 "Неважно"
 prc.102.t:0 "Предложение о ЗТОТ"
 prc.102.d:0 "[From.GetName] направляет нам предложение, утверждая, что создание ЗТОТ — Западно-Тихоокеанской организации договора — жизненно необходимо. После её создания мы сможем прикрывать друг друга и сдерживать любых дьяволов, положивших глаз на наши территории."
 prc.102.a:0 "Это может обеспечить наше выживание."
 prc.102.b:0 "Сорэ ва инбо дэсу."
 prc.103.t:0 "Создан альянс [From.GetFactionName]"
 prc.103.d:0 "[From.GetName] соглашается создать ЗТОТ, и теперь мы стоим плечом к плечу."
 prc.103.a:0 "Славно!"
 prc.104.t:0 "[From.GetName] отказывает"
 prc.104.d:0 "[From.GetName] отказывается создавать ЗТОТ."
 prc.104.a:0 "Жаль"
 prc.105.t:0 "Переворот при поддержке альянса [From.GetFactionName]"
 prc.105.d:0 "Только что начался переворот, поддержанный альянсом [From.GetFactionName]!"
 prc.105.a:0 "Будь они прокляты!"
 prc.106.t:0 "Предательство государства [From.GetName]"
 prc.106.d:0 "Несмотря на подписанный нами пакт, [From.GetName] теперь проявляет к нам враждебность. Они казнили всех [Root.GetAdjective] чиновников в своём правительстве и объявили нам войну!"
 prc.106.a:0 "Ябандзин!"
 prc.108.t:0 "Спасти Чжан Сюэляна?"
 prc.108.d:0 "После Сианьского инцидента Чжан был задержан партией [CHI.GetRulingParty]. Без него план создания Великого Северо-Западного союза не может быть осуществлён."
 prc.108.a:0 "Спасти его!"
 prc.108.b:0 "Мы сможем продолжить без него."
 prc.109.t:0 "Мир с Японией?"
 prc.109.d:0 "Теперь, когда Динбэй находится под нашим контролем, некоторые генералы и чиновники удовлетворены достигнутым результатом. Они предлагают заключить мир с Японией."
 prc.109.a:0 "Это ради общего блага."
 prc.109.b:0 "Следует дождаться более подходящего момента."
 prc.109.c:0 "Что за вздор!"
 prc.110.t:0 "[From.GetName] ищет мира"
 prc.110.d:0 "Добившись своей цели, они теперь предлагают нам заключить мир."
 prc.110.a:0 "Наши силы нужны в другом месте..."
 prc.110.b:0 "Никогда!"
 prc.111.t:0 "Мир с государством [JAP.GetName]"
 prc.111.d:0 "[From.GetName] соглашается заключить с нами мир."
 prc.111.a:0 "Наилучший исход"
 prc.112.t:0 "[From.GetName] отвергает мир"
 prc.112.d:0 "[From.GetName] отказывается заключить мир."
 prc.112.a:0 "Они лишь оттягивают неизбежное."
 prc.114.d:0 "Мы долго сражались с государством [JAP.GetNameDef] и его марионеточными режимами в Маньчжурии. Когда наши войска освободили последний оплот имперской власти на Северо-Востоке, [JAP.GetAdjective] чиновники, опасаясь, что их страна никогда не оправится от затяжной войны на истощение против государства [PRC.GetNameDef], обратились к нашим политикам с предложением о прекращении огня и условиями капитуляции. \n\nЭто наш шанс выдвинуть требования!"
 prc.115.t:0 "Голод в Хэнани"
 prc.115.d:0 "Война, бушующая в Хэнани, вызвала в регионе голод, поскольку сельскохозяйственные угодья были уничтожены. Местное правительство теперь просит нашей помощи, чтобы облегчить положение населения."
 prc.115.a:0 "Мы должны им помочь!"
 prc.115.b:0 "У нас нет на это времени."
 prc.116.t:0 "Бывшие коммунисты присоединяются к нам"
 prc.116.d:0 "Благодаря успеху наших программ восстановления деревни некоторые бывшие коммунисты решили присоединиться к нам."
 prc.116.a:0 "Мудрый шаг."
 prc.117.t:0 "[XSM.GetName] присоединяется к государству [CHI.GetName] против нас"
 prc.117.d:0 "[CHI.GetLeader] приказал [XSM.GetLeader] начать наступление на наш северо-западный фланг!"
 prc.117.a:0 "Они погибнут вместе с [CHI.GetLeader]!"
 prc.120.t:0 "Приглашение от лидера [From.GetLeader]"
 prc.120.d:0 "После создания альянса [From.GetFactionName] лидер [From.GetLeader] направил приглашение [Root.GetLeader], надеясь, что мы присоединимся к их делу."
 prc.120.a:0 "Хорошая идея."
 prc.120.b:0 "Пожалуй, нет."
 prc.121.t:0 "[From.GetName] присоединяется к нам"
 prc.121.d:0 "[From.GetLeader] решает присоединиться к нашему делу."
 prc.121.a:0 "Замечательно!"
 prc.122.t:0 "[From.GetName] отказывает"
 prc.122.d:0 "[From.GetLeader] отказывается вступать в альянс [Root.GetFactionName], заявляя, что они лучше справятся самостоятельно."
 prc.122.a:0 "Надменные мерзавцы!"
 prc.123.t:0 "Отправить приглашение лидеру [SIK.GetLeader]?"
 prc.123.d:0 "Для получения снабжения от государства [SOV.GetNameDef] важен доступ в регион Синьцзян. Мы могли бы пригласить их в наш альянс и завоевать их доверие."
 prc.123.a:0 "Отправить."
 prc.123.b:0 "В этом нет необходимости."
 prc.124.t:0 "[From.GetLeader] призывает к действию"
 prc.124.d:0 "[From.GetLeader] сообщает, что они полностью готовы к созданию Северо-Западного правительства национальной обороны и теперь ждут наших действий."
 prc.124.a:0 "Мы готовы."
 prc.124.b:0 "Слишком рано..."
 kns.4.t:0 "Смерть Иосифа Сталина"
 kns.4.d:0 "У Иосифа Сталина, бывшего руководителя Советского Союза, диагностировали инсульт, высокое кровяное давление и желудочное кровотечение. До вызова врачей его нашли лежащим на полу в спальне. Лечение пиявками не дало результата, и двойника Сталина отозвали из отпуска, чтобы тот при необходимости заменил его. Однако позднее подробные сведения о здоровье Сталина были переданы по всей стране. На следующий день было объявлено о смерти Иосифа Сталина.\n\nОжидается, что культ личности Сталина сохранится и после его кончины. Уже началась борьба за власть: влиятельные члены партии стремятся занять освободившееся место."
 kns.4.a:0 "Сокрушительная потеря."
 kns.4.b:0 "Мы потеряли великого учителя и великого вождя."
 kns.4.c:0 "Любопытно"
 kmt.32.t:0 "Начало кампании «Ста цветов»"
 kmt.32.d:0 "Кампания «Ста цветов» началась. Теперь остаётся лишь дождаться, когда правые свиньи сами себя выдадут."
 kmt.32.a:0 "Пусть расцветают сто цветов — тогда мы сможем их сорвать."
 kmt.33.t:0 "Ход кампании"
 kmt.33.d:0 "Кампания продолжается всего несколько месяцев, а некоторые капиталистические крысы уже выступили с критикой правительства. Мы можем продолжить её и выманить из логова ещё больше реакционных свиней, но их взгляды способны поколебать веру народа в коммунизм."
 kmt.33.a:0 "Арестуем этих правых свиней прямо сейчас."
 kmt.33.b:0 "Следует выманить ещё больше."
 kmt.34.t:0 "Новая критика со стороны народа"
 kmt.34.d:0 "Чем дольше продолжается кампания, тем больше критики получает правительство. Если вскоре мы не пустим в ход кнут, положение будет лишь ухудшаться."
 kmt.34.a:0 "Бросим этих несогласных мерзавцев в тюрьму."
 kmt.34.b:0 "Мы должны проявить терпение."
 KMT_baihua_stage_2_tt:0 "К критикам присоединится больше правых"
 kmt.35.t:0 "Критика становится радикальнее"
 kmt.35.d:0 "Поначалу критика была умеренной. Но со временем раздаются всё более радикальные голоса, призывающие к действию. Если мы не вмешаемся в ближайшее время, то можем столкнуться с контрреволюцией."
 kmt.35.a:0 "Мы позаботимся, чтобы они больше никогда ничего не сказали."
 kmt.35.b:0 "Они лишь прислужники настоящих реакционеров. Нужно дождаться, пока покажутся их предводители."
 KMT_baihua_stage_3_tt:0 "Критика станет более радикальной"
 kmt.36.t:0 "Призывы к восстанию"
 kmt.36.d:0 "Поскольку мы закрывали глаза на радикальные высказывания, некоторые глупцы теперь призывают немедленно свергнуть народное правительство. Часть кадров уже начинает опасаться за свою жизнь. Не пора ли завершить кампанию?"
 kmt.36.a:0 "Теперь им негде будет укрыться."
 kmt.36.b:0 "Мы почти поймали всех мерзавцев. Ещё несколько недель — и одним ударом отрубим им всем головы!"
 KMT_baihua_stage_4_tt:0 "Люди начнут терять веру в коммунизм"
 kmt.37.t:0 "На грани краха"
 kmt.37.d:0 "Сила и количество словесных нападок на правительство стали невыносимыми. Ради защиты рабоче-крестьянской революции мы должны немедленно арестовать всех смутьянов!"
 kmt.37.a:0 "Ради партии мы должны покончить со всякой оппозицией. Навсегда."
 baihua_end_now:0 "Кампания завершится прямо сейчас.\n"
 kmt.39.t:0 "Начало Большого скачка"
 kmt.39.d:0 "Большой скачок начался. Вскоре мы достигнем полного и научного коммунизма!"
 kmt.39.a:0 "Мы превзойдём западный мир!"
 kmt.40.t:0 "Построены дворовые печи"
 kmt.40.d:0 "Некоторые люди без вмешательства правительства построили собственные дворовые печи. Это подлинный признак единства нашей страны."
 kmt.40.a:0 "При таком прогрессе мы в кратчайшие сроки превзойдём западный мир!"
 kmt.43.t:0 "Голод"
 kmt.43.d:0 "Некоторые наши провинции охватил голод, потому что крестьяне отправили сельскохозяйственные орудия в печи. Без инвентаря некому собирать урожай. А собранное зерно отправляют за границу в оплату промышленного оборудования."
 kmt.43.a:0 "Но в отчётах говорится, что урожайность выросла на 400%..."
 kmt.46.t:0 "Большой скачок обернулся прыжком назад"
 kmt.46.d:0 "После партийного съезда председатель Мао с глубочайшим сожалением решил прекратить Большой скачок. Сельская местность усеяна телами умерших от голода крестьян и кусками низкокачественного чугуна. Оказалось, что выплавлять сталь на собственном дворе всё-таки невозможно."
 kmt.46.a:0 "Большой скачок принёс Китаю урожай голода вместо прогресса."
 kmt.47.t:0 "Мао посещает местную коммуну"
 kmt.47.d:0 "Председатель Мао был чрезвычайно доволен преданностью крестьян одной из коммун в Хэнани. В знак признания их пролетарского духа он благословил создание подобных коммун по всему Китаю."
 kmt.47.a:0 "Наш народ поистине предан партии!"
 prc.126.t:0 "Мао принимает руководство"
 prc.126.d:0 "После Великого похода дивизии многих других наших военачальников были ослаблены в боях. Собственная армия Мао почти не пострадала. Более того, его недавние выступления перед войсками ясно показали одно: теперь он — бесспорный лидер нашего дела!"
 prc.126.a:0 "Вперёд, к лучшим временам."
