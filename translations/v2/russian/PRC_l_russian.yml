 PRC_mountain_training_tt:0 "Открывает §HВойну в горах§!\nВся пехота: \n    §HГоры§!\n      Скорость передвижения: §G+10%§!\n    §HХолмы§!\n      Скорость передвижения: §G+10%§!\n\n§HМорская пехота\n    Горы§!\n      Атака: §G+5%§!\n    §HХолмы§!\n      Атака: §G+5%§!\n      \n§HГорнострелковые войска\n    Горы§!\n      Атака: §G+5%§!\n    §HХолмы§!\n      Атака: §G+5%§!\n      \n§HДесантники\n    Горы§!\n      Атака: §G+5%§!\n    §HХолмы§!\n      Атака: §G+5%§!\n\nПолучить 2 элитные горнострелковые дивизии.\n"
 PRC_yhc_join:0 "§YЯн Хучэн§! присоединится к нашей армии\n"
 PRC_resore_dbj_glory_tt:0 "Владеть и контролировать следующие регионы:\n    §YЖэхэ§!\n    §YЛяодун§!\n    §YГирин§!\n    §YЛяонин§!\n"
 PRC_create_wargoal_for_db_tt:0 "Получить цель войны против владельца или сюзерена владельца следующих регионов:\n    §YЛяодун§!\n    §YЛяонин§!\n    §YЖэхэ§!\n    §YГирин§!\n    §YСунцзян§!\n    §YВосточный Хулун-Буир§!\n    §YСеверный Синъань§!\n    §YВосточный Синъань§!\n    §YКанто-сю§!\n    §YВосточный Хэбэй§!\n    §YЧахар§!\n    §YЮжный Чахар§!\n"
 PRC_xbj_join_tt:0 "Получить 3 дивизии\n"
 PRC_turn_fascist_when_select_tt:0 "При выборе этого фокуса Мао и часть коммунистов будут казнены.\n§RВыбор этого фокуса также сделает фашистскую партию правящей§!\n\n"
