l_russian:
 ireland_focus:0 "Национальные фокусы Ирландии"
 IRE_great_southern_railways_workshops:0 "Мастерские «Грейт Саутерн Рейлуэйз»"
 IRE_messrs_thompson:0 "Мессрс Томпсон"
 IRE_magazine_fort_workshop:0 "Мастерская Мэгэзин-Форт"
 IRE_mackie_and_sons:0 "«Маки энд Санс»"
 IRE_harland_and_wolff:0 "«Харланд энд Вольф»"
 IRE_cement_ltd:0 "«Семент Лтд»"
 IRE_johnson_electric_service_company:0 "«Джонсон Электрик Сервис Компани»"
 IRE_mc_mullan:0 "«Макмаллан Бразерс Лимитед»"
 IRE_ford_cork:0 "«Форд Корк»"
 IRE_short_brothers:0 "«Шорт Бразерс»"
 IRE_short_and_harland:0 "«Шорт энд Харланд»"
 IRE_harland_and_wolff_tanks:0 "«Харланд энд Вольф»"
 IRE_great_southern_railways:0 "«Грейт Саутерн Рейлуэйз»"
 IRE_electricity_supply_board:0 "Управление электроснабжения"
 IRE_irish_metal_industries_galway:0 "«Айриш Метал Индастриз Голуэй»"
 IRE_finna_fail:0 "Правительство Фианна Файл"
 IRE_finna_fail_desc:0 "После победы Фианна Файл на выборах пришло время проводить наши реформы."
 IRE_push_the_constituition:0 "Продвигать конституцию"
 IRE_push_the_constituition_desc:0 "Новая конституция необходима, чтобы утвердить суверенитет нашего государства и гарантировать, что [IRE.GetNameDef] сможет стоять в одном ряду с великими демократиями мира."
 IRE_president_replacement:0 "Заменить монарха президентом"
 IRE_president_replacement_desc:0 "Британский монарх уже не связан с Ирландией так тесно, как прежде. Нам следует заменить эту должность более подходящей — президентом."
 IRE_infectious_disease_wage:0 "Пособие при инфекционных заболеваниях"
 IRE_infectious_disease_wage_desc:0 "Предоставление пострадавшим пособия, позволяющего содержать себя, станет важным шагом вперёд во внутренней политике."
 IRE_recognize_the_palce_of_the_church:0 "Признать роль церкви"
 IRE_recognize_the_palce_of_the_church_desc:0 "Католическая церковь занимает особое место в [IRE.GetNameDef], и это положение следует признать и защитить."
 IRE_abolish_the_upper_house:0 "Упразднить верхнюю палату"
 IRE_abolish_the_upper_house_desc:0 "Сенат продолжает блокировать нашу программу. Поэтому он стал обузой для страны и должен быть ликвидирован."
 IRE_emergency_powers_act:0 "Закон о чрезвычайных полномочиях"
 IRE_emergency_powers_act_desc:0 "Поскольку в Европе бушует большая война, мы должны принять меры для защиты нашего суверенитета и безопасности."
 IRE_temporary_state_guidance:0 "Временное государственное регулирование"
 IRE_temporary_state_guidance_desc:0 "В эти тёмные времена государство должно принять необходимые меры для роста и защиты экономики."
 IRE_broad_censorship_programs:0 "Широкая программа цензуры"
 IRE_broad_censorship_programs_desc:0 "Некоторые выступают против нашей администрации и ставят под угрозу будущее [IRE.GetNameDef]. Этих людей необходимо заставить замолчать."
 IRE_ira_defense_force_memebrship:0 "Членство ИРА в силах обороны"
 IRE_ira_defense_force_memebrship_desc:0 "Призыв членов ИРА может оказаться полезным в случае конфликта."
 IRE_promote_neutrality:0 "Отойти от внешней политики"
 IRE_promote_neutrality_desc:0 "[IRE.GetNameDefCap] не обязана вмешиваться в эту войну, поскольку у неё нет для этого причин. Нам куда важнее сохранить независимость."
 IRE_northern_ireland_for_assistance:0 "Северная Ирландия в обмен на помощь"
 IRE_northern_ireland_for_assistance_desc:0 "Война охватила мир, и [ENG.GetNameDef], возможно, вскоре окажется вовлечена в очередной конфликт интересов. Мы можем предложить поддержку и защитить их судоходные пути через Атлантику, но наша помощь не бесплатна, и цена обеим сторонам хорошо известна: объединённая Ирландия."
 IRE_fine_gael:0 "Триумф Фине Гэл"
 IRE_fine_gael_desc:0 "Несмотря на все трудности, мы победили и теперь готовы управлять страной так, как считаем нужным."
 IRE_rally_rural_ireland:0 "Сплотить сельскую Ирландию"
 IRE_rally_rural_ireland_desc:0 "Значительная часть наших избирателей живёт в сельской местности; жизненно важно сохранить их поддержку."
 IRE_hold_public_funding_oppertunities:0 "Проводить публичные сборы средств"
 IRE_hold_public_funding_oppertunities_desc:0 "Нашей партии нужны средства, чтобы держаться на плаву; лучший способ получить их — проводить общественные мероприятия."
 IRE_radio_broadcasts:0 "Транслировать предвыборные речи"
 IRE_radio_broadcasts_desc:0 "Лидер всегда должен обращаться к своему народу, а современные технологии позволяют делать это по радио."
 IRE_oduffy_expulsion:0 "Завершить изгнание синерубашечников"
 IRE_oduffy_expulsion_desc:0 "Синерубашечники — позорное пятно на Фине Гэл. Большинство уже изгнано, включая их лидера, но некоторые всё ещё остаются."
 IRE_oust_the_moderates:0 "Покончить с уступками умеренным"
 IRE_oust_the_moderates_desc:0 "Синерубашечники должны вернуть контроль над Фине Гэл. Среди её рядов у нас всё ещё есть сторонники, а после их победы на выборах лучшего момента для захвата власти не будет."
 IRE_raise_the_irish_brigade:0 "Сформировать Ирландскую бригаду"
 IRE_raise_the_irish_brigade_desc:0 "[IRE.GetNameDefCap] могла бы создать небольшой добровольческий отряд для помощи нашим союзникам за рубежом."
 IRE_rid_alien_influence:0 "Избавить экономику от иностранного влияния"
 IRE_rid_alien_influence_desc:0 "Иностранцы, например [ENG.GetAdjective], слишком сильно контролируют нашу экономику; чтобы выжить, мы должны утвердить собственный контроль над рынком."
 IRE_accept_dominin_status:0 "Принять статус доминиона"
 IRE_accept_dominin_status_desc:0 "Ирландия и Британия всегда были тесно связаны, а идея вступления в Содружество существует уже давно. Возможно, нам стоит признать её."
 IRE_establish_the_coorperate_state:0 "Битва за корпоративное государство"
 IRE_establish_the_coorperate_state_desc:0 "Корпоративизм — будущее Ирландии; если современный мир принимает его, мы должны сделать то же самое."
 IRE_agricultural_pasturing:0 "Развитие пастбищного хозяйства"
 IRE_agricultural_pasturing_desc:0 "Сельское хозяйство — важнейшая часть экономики [IRE.GetNameDef]; инвестиции в него не повредят."
 IRE_protectionism:0 "Доктрина протекционизма"
 IRE_protectionism_desc:0 "Чрезмерный импорт иностранных товаров позволит другим странам получить влияние на нашу экономику, от которого мы, возможно, уже не избавимся."
 IRE_free_trade:0 "Открыть свободный рынок"
 IRE_free_trade_desc:0 "Свободная торговля — лучший экономический курс для обеспечения долгосрочного роста и процветания."
 IRE_irelands_oppertunity:0 "Шанс Ирландии"
 IRE_irelands_oppertunity_desc:0 "Если мы хотим вернуть наши прежние территории, лучший вариант — заключить союз с новыми доминирующими державами Европы."
 IRE_british_arms:0 "Закупка [ENG.GetAdjective] вооружения"
 IRE_british_arms_desc:0 "Вооружение [IRE.GetNameDefCap] устарело и уступает чужому; на случай конфликта нам необходимо лучшее оснащение."
 IRE_treet:0 "Вернуть договорные порты"
 IRE_treet_desc:0 "Одно из соглашений, которого мы можем добиться от [ENG.GetNameDef], — возвращение суверенитета над нашими портами."
 IRE_coa:0 "Закон об Эйре"
 IRE_coa_desc:0 "Мы должны положить конец этой торговой войне и восстановить отношения с [ENG.GetNameDef], прежде чем наша экономика будет разрушена."
 IRE_trade_war:0 "Разрушительная торговая война"
 IRE_trade_war_desc:0 "Англо-ирландская торговая война уже долго продолжается из-за спорных торговых соглашений и конституционного статуса Ирландии. Её необходимо завершить, прежде чем наша экономика пострадает ещё сильнее."
 IRE_IRELAND:0 "Ирландия"
 IRE_claim_the_celtic_world:0 "Претендовать на кельтский мир"
 IRE_claim_the_celtic_world_desc:0 "Объединения Ирландии недостаточно — наша цель состоит в освобождении всех наших кельтских братьев."
 ireland.1.t:0 "Северная Ирландия в обмен на помощь"
 ireland.1.d:0 "Малкольм Макдональд, который вместе с Невиллом Чемберленом вёл переговоры с Ирландским Свободным государством, был направлен в Ирландию для встречи с нами и обсуждения интересного предложения. [ENG.GetNameDefCap] предлагает отменить раздел Ирландии и вернуть Северную Ирландию под наш контроль при условии, что мы присоединимся к военным усилиям Союзников."
 ireland.1.a:0 "Всё ради союзника."
 ireland.1.b:0 "Передача не стоит хлопот."
 ireland.2.t:0 "Выборы 1937 года"
 ireland.2.d:0 "На этих выборах доминирование партии Фианна Файл во главе с Эймоном де Валерой в [IRE.GetAdjective] политике оспаривает партия Фине Гэл. Фине Гэл обещает проводить более консервативную экономическую политику, включая низкие налоги и протекционизм. Однако на партии всё ещё лежит тень её прошлого руководства при Оуэне О'Даффи. Ожидается, что Фианна Файл всё же победит благодаря популярности конституции, которую обещает принять, но полностью сбрасывать Фине Гэл со счетов было бы неразумно."
 ireland.2.a:0 "Пусть Фианна Файл ведёт [IRE.GetNameDef]."
 ireland.2.b:0 "Фине Гэл — лучший выбор для [IRE.GetNameDef]."
 ireland.3.t:0 "Оуэн О'Даффи прекращает уступки"
 ireland.3.d:0 "Оуэн О'Даффи и синерубашечники известны радикальными взглядами и открыто заявляли о поддержке фашизма. Однако после изгнания из Фине Гэл ему больше не нужно смягчать риторику, и он использует остатки влияния в партии, чтобы вновь укрепить свои позиции."
 ireland.3.a:0 "Пусть это станет началом нового будущего для [IRE.GetNameDef]."
 ireland.4.t:0 "Ричард Малкахи возглавляет Фине Гэл"
 ireland.4.d:0 "Ричард Малкахи возглавил партию Фине Гэл; он доказал, что является достойным преемником У. Т. Косгрейва и будет хорошо служить [IRE.GetNameDef]."
 ireland.4.a:0 "У. Т. Косгрейв хорошо послужил Фине Гэл."
 ireland.5.t:0 "Вступление [IRE.GetNameDefCap] в Содружество"
 ireland.5.d:0 "[IRE.GetAdjective] правительство направило предложение о вступлении в Содружество со статусом доминиона. Его принятие принесёт обеим странам значительные экономические выгоды и даст нам ещё одну стратегическую позицию. Однако [IRE.GetAdjective] население, особенно такие группы, как ИРА, будет возмущено, что может привести к ненужному кровопролитию."
 ireland.5.a:0 "Мы должны вновь приветствовать наших [IRE.GetAdjective] братьев."
 ireland.5.b:0 "Лучше оставить [IRE.GetAdjective] в покое."
 ireland.6.t:0 "[ENG.GetNameDefCap] отказывает"
 ireland.6.a:0 "Нелепость!"
 ireland.7.t:0 "[ENG.GetNameDefCap] соглашается"
 ireland.7.d:0 "Наше правительство и [ENG.GetNameDef] пришли к соглашению и договорились о вступлении Ирландии в Содружество."
 ireland.7.a:0 "Мы едины."
 ireland.6.d:0 "[ENG.GetNameDefCap] отклонила наше предложение, заявив: «Будет слишком трудно добиться согласия обеих стран по вопросам автономии и экономического сотрудничества»."
 news.31311.t:0 "Белфастский блиц"
 news.31311.d:0 "[GER.GetAdjective] бомбардировщики атаковали североирландский город Белфаст в ходе трёх налётов, получивших название «Белфастский блиц». Погибло около 1000 человек, ещё примерно 1500 получили ранения. Пожарные из Южной Ирландии присоединились к спасательным работам, помогая своим ирландским братьям. В официальном заявлении Республики говорится: «Жители Белфаста тоже ирландцы»."
 news.31311.a:0 "Какая трагедия."
 news.31311.b:0 "Это наш народ."
 news.31311.c:0 "Позорная демонстрация со стороны Оси!"
 news.31311.e:0 "Возможно, нам стоит пересмотреть отношения с [IRE.GetNameDef]."
 news.3137.t:0 "[IRE.GetNameDefCap] сближается с Осью"
 news.3137.d:0 "[IRE.GetNameDefCap] объявила о высылке дипломатов Союзников и укреплении связей с державами Оси.\n\nСообщается, что Гитлер приветствовал эту новость, заявив, что «ирландцы имеют долгую историю гордых воинов и станут надёжным партнёром и ценным союзником в борьбе против англичан»."
 news.3137.a:0 "Ось растёт."
 news.3137.b:0 "Это сделает нас сильнее!"
 news.3137.c:0 "Тёмный день для Империи."
 news.3137.e:0 "Добро пожаловать, Эйре!"
 news.3138.t:0 "[IRE.GetNameDefCap] сближается с Коминтерном"
 news.3138.d:0 "[IRE.GetNameDefCap] объявила о высылке дипломатов Союзников и укреплении связей с державами Коминтерна.\n\n[SOV.GetAdjective] дипломаты в [IRE.GetNameDef] были, по сообщениям, удивлены, поскольку даже не подозревали, что [IRE.GetAdjective] заинтересованы во вступлении. Однако [SOV.GetAdjective] генералы приветствовали новость из-за стратегических преимуществ Ирландии."
 news.3138.a:0 "Коминтерн растёт."
 news.3138.b:0 "Солидарность всех трудящихся!"
 news.3138.c:0 "Тёмный день для Империи."
 news.3138.e:0 "Ещё один шаг к мировой революции!"
 news.3139.t:0 "Рождественский рейд"
 news.3139.d:0 "23 декабря 1939 года ИРА совершила рейд на Мэгэзин-Форт в Дублине.\n\nХотя им удалось захватить ирландские боеприпасы, вскоре их вернули, а многих добровольцев ИРА поймали и арестовали. Многие высокопоставленные члены ИРА были казнены, а парламенту были предоставлены чрезвычайные полномочия для борьбы с кризисом."
 news.3139.a:0 "Победа [IRE.GetNameDefCap]!"
 news.3139.b:0 "Хорошо за них."
 news.3133.t:0 "[ENG.GetAdjective]-[IRE.GetAdjective] торговая война окончена"
 news.3133.d:0 "[ENG.GetAdjective]-[IRE.GetAdjective] торговая война оказала разрушительное влияние на экономики [ENG.GetNameDEf] и [IRE.GetNameDef]. Однако недавнее принятие Закона об Эйре положило конец этой «войне», и теперь [IRE.GetAdjective] и [ENG.GetAdjective] промышленность выиграют от более свободной торговли. Возможно, это начало новой эпохи отношений между [ENG.GetAdjective] и [IRE.GetAdjective].\n\n[IRE.Getleader] заявил, что соглашение открыло путь к другим возможным договорённостям с [ENG.GetAdjective] правительством. "
 news.3133.a:0 "Наконец-то!"
 news.3133.b:0 "Хорошо за них."
 news.3135.t:0 "Оскар Метцке"
 news.3135.d:0 "Сегодня в Каслтаунроше, графство Корк, был найден человек, назвавшийся «Оскаром Метцке» и заявивший, что является чешским ветераном. При обыске у него обнаружили карту страны, компас и пистолет «Люгер».\n\nВскоре после этого, находясь под стражей Гарды — [IRE.GetAdjective] полиции, — он умер после серии судорог, которые, как выяснилось позднее, были вызваны проглоченным цианидом. Многие полагают, что он был [GER.GetAdjective] шпионом."
 news.3135.a:0 "[GER.GetAdjective] шпион? Здесь?"
 news.3135.b:0 "Ладно."
 news.3132.t:0 "Глиммермены"
 news.3132.d:0 "Запасы угля в [IRE.GetNameDef] сокращаются, поскольку многие газовые заводы закрылись. Пока ведутся исследования по использованию торфа вместо угля, [IRE.GetAdjective] правительство начало ужесточать контроль над подачей газа, а министр снабжения пригрозил официальным нормированием.\n\nЭто привело к появлению инспекторов, проверяющих, не используют ли люди газ в запрещённое время; [IRE.GetAdjective] население прозвало их «глиммерменами»."
 news.3132.a:0 "Дев, газовая плита и глиммермен."
 news.3132.b:0 "Ладно."
 IRE_neutral:0 "[IRE.GetAdjective] нейтралитет"
 IRE_neutral_desc:0 "[IRE.GetNameDefCap] сохраняет нейтралитет в войне, одновременно уважая [GER.GetNameDef], поддерживая свой суверенитет вне влияния [ENG.GetNameDef] и помогая обеим сторонам конфликта."
 IRE_ira:0 "Ирландская республиканская армия"
 IRE_ira_desc:0 "Несмотря на то что Ирландия получила независимость по Англо-ирландскому договору 1921 года, выступающая против договора ИРА противостоит правительству и [ENG.GetAdjective], продолжая ослаблять [IRE.GetAdjective] государство."
 IRE_sean_russell:0 "Шон Рассел"
 IRE_coal_rationing:0 "Нормирование угля"
 IRE_democratic_gael_long:0 "Фине Гэл"
 IRE_democartic_gael:0 "Фине Гэл"
 IRE_election_tt:0 "Этот фокус будет пропущен после выборов 1937 года, которые пройдут в июне или июле."
 IRE_mcquaid:0 "Джон Чарльз Маккуэйд"
 IRE_richard_mulcahy:0 "Джон Малкахи"
 IRE_create_brigade_tt:0 "Мы получим подразделения, известные как Ирландская бригада."
 IRE_IRELAND_DOMINION:0 "Доминион Ирландия"
 IRE_constituinal_reforms:0 "Конституционные реформы"
 IRE_volunteer_corps:0 "Ирландская бригада"
