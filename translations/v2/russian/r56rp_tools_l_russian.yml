 rt.1.title:0 "[FROM.GetNonIdeologyName] запросить доступ к [?FROM.state_lock_id.GetName]ресурсы"
 rt.1.desc:0 "Либо из-за полного отсутствия торгового потенциала, либо просто пытаясь запугать нас, [FROM.GetName] Мы только что отправили нам запрос на предоставление им полного контроля над [rt_list_entry_1][rt_list_entry_2][rt_list_entry_3][rt_list_entry_4][rt_list_entry_5][rt_list_entry_6][rt_list_entry_7][rt_list_entry_8][rt_list_entry_9][rt_list_entry_10][rt_list_entry_11][rt_list_entry_12] депозиты в [?FROM.state_lock_id.GetName]. Как мы должны реагировать?"
 rt.1.a:0 "Правильно. Сообщите им о нашем одобрении."
 rt.1.b:0 "Нелепо! Откажитесь от этой ерунды."
 rt.2.title:0 "[FROM.GetNonIdeologyName] Предоставление доступа к [?FROM.state_lock_id.GetName]ресурсы"
 rt.2.desc:0 "Следуя каким-то зловещим мотивам или искренней щедростью, [FROM.GetName] Только что прислали нам предложение получить полный контроль над [rt_list_entry_1][rt_list_entry_2][rt_list_entry_3][rt_list_entry_4][rt_list_entry_5][rt_list_entry_6][rt_list_entry_7][rt_list_entry_8][rt_list_entry_9][rt_list_entry_10][rt_list_entry_11][rt_list_entry_12] депозиты в [?FROM.state_lock_id.GetName]. Как мы должны реагировать?"
 rt.2.a:0 "Неожиданно, но приятно."
 rt.2.b:0 "Это ловушка!"
 rt.3.title:0 "[FROM.GetNonIdeologyName] Отклонить нашу просьбу"
 rt.3.desc:0 "Эти глупцы из [FROM.GetNameDEF] У меня хватило смелости отвергнуть наше доброжелательное предложение!"
 rt.3.a:0 "Я вижу... Поднимите дракона!"
 rt.4.title:0 "[FROM.GetNonIdeologyName] Отклонить наше предложение"
 rt.4.desc:0 "Эти сумасшедшие из [FROM.GetNameDEF] Не хватало мозгов, чтобы принять наш милостивый дар!"
 rt.4.a:0 "Если бы для этого была одна веская причина..."
 rt.5.title:0 "[FROM.GetNonIdeologyName] Предоставляет доступ к своим ресурсам"
 rt.5.desc:0 "Хотя мы должны помнить о цене мили, [FROM.GetAdjectiveCap] Ответ не мог быть лучше! Они согласились с нашей просьбой."
 rt.5.a:0 "Потрясающе! Тост за нашего нового друга. [FROM.GetLeader]!"
 rt.6.title:0 "[FROM.GetNonIdeologyName] соглашаются получать наши ресурсы"
 rt.6.desc:0 "[FROM.GetName] Казалось, что мы рады получить такое предложение, хотя мы не уверены, что они относятся к этому как к подарку или услуге."
 rt.6.a:0 "Великолепно! Надежда [FROM.GetName] Это будет полезно."
