 ARG_Siam:0 "Siam Di Tella"
 ARG_Bunge:0 "Bunge y Born"
 ARG_francisco_de_arteaga:0 "Франсиско де Артеага"
 ARG_julian_irizar:0 "Хулиан Ирисар"
 ARG_malvinas_claim_threat:0 "[ARG.GetNameDefCap] потребовала Мальвинские острова"
 ARG_south_georgia_claim_threat:0 "[ARG.GetNameDefCap] потребовала Южную Георгию"
 ARG_uruguay_claim_threat:0 "[ARG.GetNameDefCap] объявила претензии на Уругвай"
 ARG_paraguay_claim_threat:0 "[ARG.GetNameDefCap] заявила права на [PAR.GetAdjective] территории"
 ARG_bolivia_claim_threat:0 "[ARG.GetNameDefCap] заявила права на Боливию"
 ARG_chile_claim_threat:0 "[ARG.GetNameDefCap] заявила права на Чили"
 ARG_brazil_puppet_threat:0 "[ARG.GetNameDefCap] объявила о притязаниях на господство над [Bra.GetNameDef]"
 ARG_the_end_of_justo_political_life:0 "Конец политической карьеры президента Хусто"
 ARG_rename_islands:0 "Марш Мальвинских островов"
 latin_peace:0 "Мир в Латинской Америке"
 latin_peace_desc:0 "В эти трудные времена найти мир сложно, но возможно."
 argentina.1.t:0 "Поиск иностранных военных советников"
 argentina.1.d:0 "Великие державы мира значительно продвинулись в военной тактике. Было бы разумно попросить одну из них помочь нам модернизировать вооружённые силы."
 argentina.1.eng:0 "[ENG.getAdjective] армия могла бы научить нас передовому планированию."
 argentina.1.ger:0 "[GER.getAdjective] армия могла бы научить нас применять танки."
 argentina.1.sov:0 "[SOV.getAdjective] армия могла бы поделиться теорией «глубокой операции»."
 argentina.1.usa:0 "[USA.getAdjective] армия могла бы научить нас использовать огневую мощь в своих интересах."
 argentina.2.t:0 "[ARG.GetNameDefCap] требует [299.GetName]"
 argentina.2.d:0 "В последние месяцы [ARG.getAdjective] войска мобилизуются по всей стране, угрожая полномасштабной войной, если мы не уступим им [299.GetName]."
 argentina.2.cede:0 "Всё равно это лишь несколько скал на другом конце света..."
 argentina.2.deny:0 "Империя должна быть защищена!"
 argentina.3.t:0 "[ARG.getAdjective] ультиматум"
 argentina.3.d:0 "Сосредоточив угрожающее количество войск у наших границ, [ARG.getAdjective] дипломаты предъявили ультиматум с требованием подчиниться оккупации, угрожая войной в случае отказа."
 argentina.3.cede:0 "Нам придётся принять неизбежное."
 argentina.3.deny:0 "Мы не сдадимся тиранам!"
 argentina.4.t:0 "Ан [ARG.getAdjective] Исследовательский договор?"
 argentina.4.d:0 "[ARG.getAdjective] дипломаты предложили заключить исследовательское соглашение между нашими странами. Оно может принести пользу науке и одновременно укрепить отношения."
 argentina.4.accept:0 "Принять предложение."
 argentina.4.refuse:0 "Отклонить предложение."
 argentina.5.t:0 "[ARG.getAdjective] правительство просит помощи"
 argentina.5.d:0 "[ARG.getAdjective] вооружённые силы нуждаются в модернизации. Для достижения цели они попросили нас о помощи. Это может усилить наше влияние на них."
 argentina.5.help:0 "Отправить военных советников."
 argentina.5.refuse:0 "Отклонить предложение."
 argentina.6.t:0 "[ARG.getAdjective] правительство просит помощи"
 argentina.6.d:0 "[ARG.getAdjective] вооружённые силы нуждаются в модернизации. Для достижения цели они попросили нас о помощи. Это может усилить наше влияние на них."
 argentina.6.help:0 "Отправить военных советников."
 argentina.6.refuse:0 "Отклонить предложение."
 argentina.7.t:0 "[ARG.getAdjective] правительство просит помощи"
 argentina.7.d:0 "[ARG.getAdjective] вооружённые силы нуждаются в модернизации. Для достижения цели они попросили нас о помощи. Это может усилить наше влияние на них."
 argentina.7.help:0 "Отправить военных советников."
 argentina.7.refuse:0 "Отклонить предложение."
 argentina.8.t:0 "[ARG.getAdjective] правительство просит помощи"
 argentina.8.d:0 "[ARG.getAdjective] вооружённые силы нуждаются в модернизации. Для достижения цели они попросили нас о помощи. Это может усилить наше влияние на них."
 argentina.8.help:0 "Отправить военных советников."
 argentina.8.refuse:0 "Отклонить предложение."
 argentina.9.t:0 "[ARG.getAdjective] правительство просит помощи"
 argentina.9.d:0 "Несмотря на усилия дипломатов, нашей стране отказали в помощи."
 argentina.9.help:0 "Можно обратиться к одной из других стран."
 argentina.9.refuse:0 "Тогда справимся сами..."
 argentina.10.t:0 "[ENG.getAdjective] Консультанты"
 argentina.10.d:0 "[ENG.GetNameDefCap] согласилась консультировать нас и помочь модернизировать армию, передав опыт Великой войны, но в обмен потребовала право влиять на нашу внутреннюю политику."
 argentina.10.a:0 "Каждая успешная операция начинается с плана."
 argentina.11.t:0 "[GER.getAdjective] Консультанты"
 argentina.11.d:0 "[GER.GetNameDefCap] согласилась консультировать нас и помогать в военной модернизации, поделившись передовой тактикой, но в обмен потребовала право влиять на внутреннюю политику."
 argentina.11.a:0 "Значит, движение — ключ к победе?"
 argentina.12.t:0 "[SOV.getAdjective] Консультанты"
 argentina.12.d:0 "[SOV.GetNameDefCap] согласилась обучать нашу армию и помочь в модернизации, научив перемещать тысячи солдат, но в обмен потребовала право влиять на внутреннюю политику."
 argentina.12.a:0 "Необходимо достичь глубины врага и уничтожить её."
 argentina.13.t:0 "[USA.getAdjective] Консультанты"
 argentina.13.d:0 "[USA.GetNameDefCap] согласилась на нашу просьбу, заявив, что усиление военной мощи региона поможет при внешней угрозе Америке. Для модернизации армии нас обучат применению более тяжёлого вооружения."
 argentina.13.a:0 "Нам нужно больше орудий и снарядов."
 argentina.14.t:0 "[FROM.GetNameDefCap] желает вступить в [ROOT.GetFactionName]"
 argentina.14.d:0 "Сегодня в Берлин прибыли [FROM.getAdjective] дипломаты и ясно изложили намерения. [FROM.GetNameDefCap] просит принять её как полноправного члена [ROOT.GetFactionName]."
 argentina.14.a:0 "Нам нужны новые союзники."
 argentina.14.b:0 "Отклонить предложение."
 argentina.15.t:0 "[FROM.GetNameDefCap] просит принять её в [ROOT.GetFactionName]"
 argentina.15.d:0 "Сегодня в Москву прибыли [FROM.GetAdjective] дипломаты и ясно изложили намерения. [FROM.GetNameDefCap] официально просит принять её в [ROOT.GetFactionName]."
 argentina.15.a:0 "Они должны вступить в Интернационал."
 argentina.15.b:0 "Отклонить предложение."
 argentina.16.t:0 "[ARG.GetNameDefCap] просит передать [299.GetName]"
 argentina.16.d:0 "Сегодня [ARG.getAdjective] дипломаты обратились к нам с особой просьбой. Они хотят получить управление территорией [299.GetName], утверждая, что это облегчит наше бремя и что именно они имеют право управлять островами."
 argentina.16.a:0 "Удовлетворить требования."
 argentina.16.b:0 "[299.GetName] принадлежит нам!"
 argentina.17.t:0 "[ARG.GetNameDefCap] просит передать [720.GetName]"
 argentina.17.d:0 "Сегодня дипломаты [ARG.GetNameDef] обратились к нам с особой просьбой. Они хотят получить управление территорией [720.GetName], утверждая, что это облегчит наше бремя и что именно они имеют право управлять островом."
 argentina.17.a:0 "Удовлетворить требования."
 argentina.17.b:0 "Отказать им в управлении островом."
 argentina.18.t:0 "[ARG.GetNameDefCap] требует [720.GetName]"
 argentina.18.d:0 "Несмотря на недавний договор, по которому мы уступили им Фолкленды, [ARG.getLeader], похоже, одержим захватом всех земель, которые считает принадлежащими своей стране."
 argentina.18.a:0 "Если это необходимо для сохранения мира..."
 argentina.18.b:0 "Это британская земля!"
 argentina.23.t:0 "[ARG.getAdjective] предложение о сотрудничестве"
 argentina.23.d:0 "[ARG.getAdjective] правительство направило группу специалистов и дипломатов с предложением, которое принесёт пользу обеим сторонам и ускорит промышленное развитие юга Бразилии и наших северо-восточных регионов."
 argentina.23.a:0 "Принять предложение."
 argentina.23.b:0 "Отклонить предложение."
 argentina.24.t:0 "Ан [ARG.getAdjective] Договор о ненападении?"
 argentina.24.d:0 "[ARG.getAdjective] дипломаты предложили заключить пакт о ненападении, утверждая, что он повысит политическую и экономическую стабильность региона."
 argentina.24.a:0 "Подписать договор."
 argentina.24.b:0 "Отвергнуть любое подобное соглашение."
 argentina.25.t:0 "[ARG.GetNameDefCap] желает вступить в Союзники"
 argentina.25.d:0 "Сегодня прибыли [ARG.getAdjective] дипломаты с просьбой объединить усилия с нашим правительством ради международной стабильности."
 argentina.25.a:0 "Любая помощь приветствуется."
 argentina.25.b:0 "Мы предпочитаем не принимать их помощь."
 argentina.26.t:0 "[299.GetName] переданы нам!"
 argentina.26.d:0 "Не сумев противостоять [ARG.getAdjective] давлению и не желая вступать в новую войну, символические силы на Мальвинах эвакуировались, оставив территорию нашим славным войскам."
 argentina.26.a:0 "Мальвинские острова принадлежат Аргентине!"
 argentina.27.t:0 "[299.Owner.GetNameDefCap] отвергла наши требования по Мальвинским островам!"
 argentina.27.d:0 "Несмотря на мощь нашей армии и усилия дипломатов, [299.Owner.GetAdjective] сторона отказывается признавать законные права на Мальвины, не оставляя нам иного выбора, кроме силового захвата."
 argentina.27.a:0 "Мальвинские острова принадлежат Аргентине!"
 argentina.28.t:0 "[720.GetName] передана нам!"
 argentina.28.d:0 "Благодаря мощи армии и, возможно, желанию избежать войны [720.GetName] наконец признана законной частью нашей великой страны."
 argentina.28.a:0 "Национальный триумф!"
 argentina.29.t:0 "[720.Owner.GetNameDefCap] отвергла наши требования по [720.GetName]!"
 argentina.29.d:0 "Несмотря на законность притязаний и силу армии, британцы отвергли ультиматум. Нам придётся забрать территорию силой."
 argentina.29.a:0 "Южная Георгия так или иначе будет нашей."
 argentina.30.t:0 "Британцы уступают Мальвинские острова"
 argentina.30.d:0 "Благодаря связям с Великобританией и работе дипломатов британцы согласились передать нам Мальвинские острова."
 argentina.30.a:0 "Мальвинские острова принадлежат Аргентине!"
 argentina.31.t:0 "Британцы отклоняют нашу просьбу о Мальвинских островах"
 argentina.31.d:0 "Несмотря на связи с Великобританией и работу дипломатов в Лондоне, британцы решили, что Мальвинским островам лучше остаться под их властью."
 argentina.31.a:0 "Мы этого не забудем."
 argentina.32.t:0 "Британцы уступают Южную Георгию"
 argentina.32.d:0 "Благодаря связям с Великобританией и работе дипломатов в Лондоне британцы согласились передать нам управление Южной Георгией."
 argentina.32.a:0 "Мы возвращаем то, что принадлежит нам по праву."
 argentina.33.t:0 "Британцы отклоняют нашу просьбу о Южной Георгии"
 argentina.33.d:0 "Несмотря на связи с Великобританией и работу дипломатов в Лондоне, британцы решили, что Южной Георгии лучше остаться под их властью."
 argentina.33.a:0 "Оскорбление для каждого аргентинца."
 argentina.34.t:0 "Бразилия принимает предложение о сотрудничестве"
 argentina.34.d:0 "Бразилия согласилась объединить с нами усилия для развития промышленности Южной Америки."
 argentina.34.a:0 "В единстве наша сила."
 argentina.35.t:0 "Бразилия отклоняет предложение о сотрудничестве"
 argentina.35.d:0 "Несмотря на взаимную выгоду сотрудничества между странами, Бразилия не проявила интереса к нашей инициативе."
 argentina.35.a:0 "Да будет так."
 argentina.36.t:0 "Бразилия принимает пакт о ненападении"
 argentina.36.d:0 "Бразилия согласилась подписать с нами пакт о ненападении. Это укрепит мир и снизит напряжённость в Южной Америке."
 argentina.36.a:0 "Возможно, это начало чего-то большего."
 argentina.37.t:0 "Бразилия отклоняет пакт о ненападении"
 argentina.37.d:0 "Бразилия, вероятно сомневаясь в наших истинных намерениях, решила отвергнуть предложение."
 argentina.37.a:0 "Жаль."
 argentina.38.t:0 "Уругвай сдаётся"
 argentina.38.d:0 "Благодаря мощи нашей армии Уругвай принял ультиматум. Теперь он находится под нашим контролем."
 argentina.38.a:0 "Превосходно."
 argentina.39.t:0 "Уругвай сопротивляется"
 argentina.39.d:0 "Несмотря на значительное военное присутствие в регионе, уругвайские власти отвергли наш ультиматум."
 argentina.39.a:0 "Тогда будет война."
 argentina.40.t:0 "Советы принимают предложение"
 argentina.40.d:0 "Советский Союз согласился заключить исследовательское соглашение между нашими странами, главным образом в области электроники. Обе стороны надеются получить значительные технологические преимущества."
 argentina.40.a:0 "Отличные новости."
 argentina.41.t:0 "Советы отклоняют предложение"
 argentina.41.d:0 "Наши дипломаты в Москве сообщают, что Советский Союз отверг предложенное исследовательское соглашение."
 argentina.41.a:0 "Как жаль."
 argentina.42.t:0 "Нас принимают в Ось"
 argentina.42.d:0 "Великая Германия согласилась принять нас в Ось. Надеемся, что благодаря этому союзу Аргентина достигнет заслуженного величия."
 argentina.42.a:0 "Вместе мы совершим много великих дел."
 argentina.43.t:0 "Германия отвечает отказом"
 argentina.43.d:0 "Несмотря на тесные связи и нашу заинтересованность в помощи Германии, она решила, что принятие нас в Ось не отвечает её интересам."
 argentina.43.a:0 "Они теряют могущественного союзника."
 argentina.44.t:0 "Нас принимают в Коминтерн"
 argentina.44.d:0 "Советский Союз согласился принять нас в Коминтерн, и теперь мы стали частью Третьего интернационала. Фашисты и капиталисты не устоят перед силой народа."
 argentina.44.a:0 "Теперь мы стоим вместе."
 argentina.45.t:0 "СССР отвечает отказом"
 argentina.45.d:0 "Несмотря на близость наших политических взглядов и хорошие отношения, Советский Союз решил, что каждой стране лучше идти своим путём."
 argentina.45.a:0 "Да будет так."
 argentina.46.t:0 "Нас принимают в Союзники"
 argentina.46.d:0 "Новости из Лондона! Великобритания согласилась принять нас в Союзники. Теперь мы наконец сможем внести свой вклад в сохранение международного мира."
 argentina.46.a:0 "Мы сделаем всё возможное."
 argentina.47.t:0 "Великобритания отвечает отказом"
 argentina.47.d:0 "Несмотря на наши отношения, Британия решила, что сейчас не время принимать нас в Союзники. Возможно, это произойдёт позже."
 argentina.47.a:0 "Но если не сейчас, то когда?"
 latin.1.t:0 "Договор против войны"
 latin.1.d:0 "Стремясь укрепить мир и единство в Латинской Америке, Аргентина проводит серию встреч для установления правил между нашими странами, которые помогут избежать военных столкновений."
 latin.1.a:0 "Подписать договор."
 latin.1.b:0 "Не подписывать договор."
 latin.2.t:0 "Великая Родина"
 latin.2.d:0 "Аргентина решила, что одного мира недостаточно. Чтобы противостоять всё более опасному миру и отражать нападения любых захватчиков, она предлагает создать крупный союз всех стран Латинской Америки — Великую Родину."
 latin.2.a:0 "Вступить в Великую Родину."
 latin.2.b:0 "Не вступать в Великую Родину."
