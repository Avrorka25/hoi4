 argentinian_focus:0 "Национальные фокусы Аргентины"
 argentine_focus_tree:0 "Дерево национальных фокусов Аргентины"
 ARG_south_atlantic_islands:0 "Острова Южной Атлантики"
 ARG_south_atlantic_islands_desc:0 "Фолклендские острова и Южная Георгия уже много лет являются суверенной территорией [ENG.GetName]. Несмотря на наши собственные притязания на острова, расположенные так близко к [ARG.GetName], они остаются под [ENG.GetAdjective] властью. Теперь, когда мы заключили союз с [ENG.GetName], возможно, удастся договориться о передаче островов под наш контроль. В конце концов, в этой войне мы сможем защитить их лучше."
 ARG_establishing_a_foothold:0 "Закрепиться"
 ARG_end_of_economic_depresion:0 "Конец экономической депрессии"
 ARG_end_of_economic_depresion_desc:0 "Чтобы страна процветала, необходимо избавиться от тени Великой депрессии."
 ARG_imports_substitution:0 "Импортозамещение"
 ARG_imports_substitution_desc:0 "Мы не способны удовлетворить внутренний спрос на многие товары. Необходимо изменить положение и заменить весь гражданский импорт местным производством."
 ARG_law_11729:0 "Закон 11.729"
 ARG_law_11729_desc:0 "Рабочие — двигатель страны и заслуживают признания. Этот закон обеспечит им лучшие условия труда."
 ARG_inmigrant_wave:0 "Волна иммиграции"
 ARG_inmigrant_wave_desc:0 "С приближением новой Великой войны и ростом [GER.GetAdjective] агрессии эмиграция становится привлекательным выбором для многих европейцев. Инвестиции в превращение нашей страны в маяк надежды для желающих избежать ужасов войны принесут нам большую пользу."
 ARG_infrastructure_development:0 "Развитие инфраструктуры"
 ARG_infrastructure_development_desc:0 "Для осуществления передовых проектов и строительства нам необходима соответствующая инфраструктура."
 ARG_infrastructure_development_2:0 "Развитие автомагистралей"
 ARG_infrastructure_development_2_desc:0 "Потребность в лучшей инфраструктуре постоянно растёт, а выгоды оправдывают вложения."
 ARG_technological_initiative:0 "Технологическая инициатива"
 ARG_technological_initiative_desc:0 "Мы отстаём в технологиях. Если хотим стать современной страной, потребуются значительные инвестиции."
 ARG_industrial_census:0 "Промышленная перепись"
 ARG_industrial_census_desc:0 "Чтобы развивать экономику, необходимо знать текущие промышленные возможности. Для этого следует провести промышленную перепись."
 ARG_establish_the_bcra:0 "Учредить BCRA"
 ARG_establish_the_bcra_desc:0 "Создание центрального банка [ARG.GetNameDef] поможет развитию национальной экономики."
 ARG_invest_in_YPF:0 "Инвестировать в YPF"
 ARG_invest_in_YPF_desc:0 "Сейчас YPF производит значительную долю необходимой стране нефти. При достаточных вложениях компания сможет покрыть все наши потребности."
 ARG_industrial_development:0 "Промышленное развитие"
 ARG_industrial_development_desc:0 "Наши производственные центры преимущественно сельские, из-за чего приходится много импортировать. Рост промышленного производства поможет исправить положение."
 ARG_industrial_development_2:0 "Расширение промышленности"
 ARG_industrial_development_2_desc:0 "Дальнейшее развитие промышленности принесёт стране пользу и превратит [ARG.GetNameDef] в восходящую державу в глазах мира."
 ARG_industrial_development_3:0 "Завершить индустриализацию"
 ARG_industrial_development_3_desc:0 "Чтобы соперничать с великими державами, нам необходимы более крупные промышленные мощности."
 ARG_mil_production_effort:0 "Военное перевооружение"
 ARG_mil_production_effort_desc:0 "Наше военное производство недостаточно. Было бы разумно увеличить его."
 ARG_mil_production_effort_2:0 "Продолжить расширение военного сектора"
 ARG_mil_production_effort_2_desc:0 "Для удовлетворения потребностей армии потребуется значительное расширение военной промышленности."
 ARG_mil_production_effort_3:0 "Завершить создание военного сектора"
 ARG_mil_production_effort_3_desc:0 "Правительству поступает всё больше запросов на поддержку и современное военное снаряжение. Их можно удовлетворить строительством новых военных заводов."
 ARG_barn_of_the_world:0 "Житница мира"
 ARG_barn_of_the_world_desc:0 "Пока большинство стран страдает от экономических трудностей или войны, мы остаёмся крупнейшим производителем зерна в мире. Пора извлечь из этого финансовую выгоду."
 ARG_pioneers:0 "Первопроходцы"
 ARG_pioneers_desc:0 "Если мы хотим встать в один ряд с мировыми державами, нужны учёные, способные создавать новшества того же уровня."
 ARG_secret_weapons:0 "Секретное оружие"
 ARG_secret_weapons_desc:0 "Как бы ни хотелось вложить все ресурсы в новые танки и самолёты, секрет победы лежит в другом: электронике, ракетной технике и ядерных исследованиях."
 ARG_nuclear_committe:0 "Ядерный комитет"
 ARG_nuclear_committe_desc:0 "Мы стоим на пороге открытия, способного потрясти мир, и не можем позволить себе отстать. Необходимо создать комитет для координации всех ядерных исследований."
 ARG_atomic_center:0 "Атомный центр"
 ARG_atomic_center_desc:0 "Было бы разумно увеличить инвестиции в атомные исследования."
 ARG_balseiro_institute:0 "Институт Бальсейро"
 ARG_balseiro_institute_desc:0 "Создание места, где соберутся наши лучшие умы, поможет увеличить технологическую отдачу."
 ARG_infamous_decade:0 "Бесславное десятилетие"
 ARG_infamous_decade_desc:0 "Для [ARG.GetAdjective] правительства настали тёмные времена: повсюду избирательные махинации и политические преследования. Хотя это даёт нам больше свободы действий, народ тяжело переживает происходящее."
 ARG_argentinas_destiny:0 "Судьба Аргентины"
 ARG_argentinas_destiny_desc:0 "Аргентина рождена для великих свершений — мы это знаем. Пора узнать об этом и всему миру."
 ARG_land_of_the_worker:0 "Земля рабочих"
 ARG_land_of_the_worker_desc:0 "Мы должны освободить себя и друзей от олигархии. Только нам это под силу."
 ARG_nationalism:0 "Национализм"
 ARG_nationalism_desc:0 "[ARG.GetNameDef] — величайшая страна Латинской Америки. Пора показать миру нашу мощь."
 ARG_malvinas_argentinas:0 "Мальвинские острова — аргентинские"
 ARG_malvinas_argentinas_desc:0 "Мальвины по праву принадлежат нам. Пора вернуть их любой ценой."
 ARG_claim_uruguay:0 "Претензии на Уругвай"
 ARG_claim_uruguay_desc:0 "Многие считают Уругвай частью [ARG.GetNameDef]. Возможно, пора воплотить это в жизнь."
 ARG_uruguay_ocupation:0 "Оккупация Уругвая"
 ARG_uruguay_ocupation_desc:0 "Уругвай по праву принадлежит [ARG.GetNameDef]. Пора официально напомнить об этом Монтевидео."
 ARG_claim_paraguay:0 "Претензии на Парагвай"
 ARG_claim_paraguay_desc:0 "[PAR.GetNameDef] слаба, и захват её земель не потребует больших усилий."
 ARG_claim_bolivia:0 "Претензии на Боливию"
 ARG_claim_bolivia_desc:0 "После недавнего поражения в войне с Парагваем [BOL.GetNameDef] охвачена внутренней борьбой и представляет лёгкую цель."
 ARG_claim_chile:0 "Претензии на Чили"
 ARG_claim_chile_desc:0 "[CHL.GetNameDefCap] — лишь пятно рядом с нами. Народ требует забрать то, что и так должно принадлежать нам."
 ARG_german_joint_military_operations:0 "[GER.GetAdjective] Совместные военные операции"
 ARG_german_joint_military_operations_desc:0 "Совместные военные операции с [GER.GetNameDef] позволят усвоить уроки, которым могут научить только немцы."
 ARG_national_fanatism:0 "Да здравствует Родина!"
 ARG_national_fanatism_desc:0 "Наш народ осознаёт величие страны и с готовностью отдаст за неё жизнь."
 ARG_break_roca_runciman_treaty:0 "Разорвать договор Рока — Рансимена"
 ARG_break_roca_runciman_treaty_desc:0 "Презренные [ENG.GetAdjective] политики пытаются втянуть нас в несправедливую сделку. Мы этого не потерпим."
 ARG_contest_monroe_doctrine:0 "Оспорить доктрину Монро"
 ARG_contest_monroe_doctrine_desc:0 "[USA.GetNameDefCap] стремится вмешиваться в дела стран Латинской Америки, будто мы принадлежим ей. Нельзя позволять так с нами обращаться."
 ARG_ussr_coop:0 "[SOV.GetAdjective] сотрудничество"
 ARG_ussr_coop_desc:0 "Сотрудничество с [SOV.GetNameDef] заложит основу долгой дружбы между нашими странами."
 ARG_ussr_research_agreement:0 "[SOV.GetAdjective] Исследовательское соглашение"
 ARG_ussr_research_agreement_desc:0 "Исследовательское соглашение, главным образом в инженерной сфере, принесёт большую пользу и нам, и [SOV.GetNameDef]."
 ARG_ussr_four_year_plan:0 "Четырёхлетний план"
 ARG_ussr_four_year_plan_desc:0 "Мы намерены модернизировать промышленность посредством долгосрочных решений и сотрудничества с другими коммунистическими странами мира."
 ARG_join_the_comintern:0 "Вступить в Коминтерн"
 ARG_join_the_comintern_desc:0 "Для создания мира без общественных классов нам нужны союзники. Вступление в Коминтерн — лучший путь к осуществлению мечты."
 ARG_south_americas_talks:0 "Южноамериканские переговоры"
 ARG_south_americas_talks_desc:0 "Наш континент велик, как и его страны. Мир меняется с тревожной скоростью, и мы должны вместе защищаться от внешних угроз."
 ARG_south_americas_talks_tt:0 "Улучшает отношения со странами Южной Америки."
 ARG_anti_war_treaty:0 "Договор о ненападении"
 ARG_anti_war_treaty_desc:0 "Мирный договор с соседями укрепит отношения и стабильность, способствуя развитию региона."
 ARG_anti_war_treaty_tt:0 "Соседние страны будут приглашены подписать договор, предотвращающий войну в регионе."
 ARG_anti_war_treaty_2:0 "Геополитическая конференция"
 ARG_anti_war_treaty_2_desc:0 "Расширение мирных переговоров с другими странами Южной Америки отвечает нашим интересам."
 ARG_anti_war_treaty_2_tt:0 "Остальные страны Южной Америки будут приглашены подписать договор, предотвращающий войну в регионе."
 ARG_anti_war_treaty_3:0 "Влияние в Карибском бассейне"
 ARG_anti_war_treaty_3_desc:0 "Вся Латинская Америка — одна большая семья. Расширим наши мирные переговоры."
 ARG_anti_war_treaty_3_tt:0 "Карибские страны будут приглашены подписать договор, предотвращающий войну в регионе."
 ARG_la_patria_grande:0 "Великая Родина"
 ARG_la_patria_grande_desc:0 "Одних мирных договоров недостаточно. Латинской Америке нужен единый фронт против остального мира."
 la_patria_grande_faction:0 "Договор Ла-Платы"
 ARG_la_patria_grande_tt:0 "Страны Латинской Америки будут приглашены присоединиться к договору Ла-Платы."
 ARG_the_will_of_the_people_focus:0 "Воля народа"
 ARG_the_will_of_the_people_focus_desc:0 "Страна ничто без народа, и именно он должен ею руководить."
 ARG_one_mind:0 "Единая воля"
 ARG_one_mind_desc:0 "Наш народ объединён общими целями и способен вместе достигать всё более великих свершений."
 ARG_integrate_native_tribes:0 "Интегрировать коренные племена"
 ARG_integrate_native_tribes_desc:0 "Потомки первых жителей Аргентины слишком долго оставались в стороне от нашего общества. Пора это изменить."
 ARG_liberty_focus:0 "Свобода"
 ARG_liberty_focus_desc:0 "Демократия — власть народа. Мы должны услышать каждый голос."
 ARG_befriend_uruguay:0 "Подружиться с [URG.GetNameDef]"
 ARG_befriend_uruguay_desc:0 "Подружиться с [URG.GetNameDef]"
 ARG_befriend_bolivia:0 "Подружиться с [BOL.GetNameDef]"
 ARG_befriend_bolivia_desc:0 "Подружиться с [BOL.GetNameDef]"
 ARG_befriend_paraguay:0 "Подружиться с [PAR.GetNameDef]"
 ARG_befriend_paraguay_desc:0 "Подружиться с [PAR.GetNameDef]"
 ARG_befriend_chile:0 "Подружиться с [CHL.GetNameDef]"
 ARG_befriend_chile_desc:0 "Подружиться с [CHL.GetNameDef]"
 ARG_brazil_coop:0 "[BRA.GetAdjective] сотрудничество"
 ARG_brazil_coop_desc:0 "Сотрудничество с [BRA.GetNameDef] заложит основу долгой дружбы между нашими странами."
 ARG_external_help_focus:0 "Внешняя помощь"
 ARG_external_help_focus_desc:0 "Обращение за международной помощью позволит справиться с технологическим отставанием и слабой экономикой."
 ARG_neutrality_foc:0 "Нейтралитет"
 ARG_neutrality_foc_desc:0 "Великие державы мира стоят на пороге войны. Возможно, если мы останемся в стороне, беда обойдёт нас."
 ARG_usa_coop:0 "[USA.GetAdjective] сотрудничество"
 ARG_usa_coop_desc:0 "Сотрудничество с [USA.GetNameDef] заложит основу долгой дружбы между нашими странами."
 ARG_uk_coop:0 "[ENG.GetAdjective] сотрудничество"
 ARG_uk_coop_desc:0 "Сотрудничество с [ENG.GetNameDef] заложит основу долгой дружбы между нашими странами."
 ARG_usa_military_coop:0 "[USA.GetAdjective] Военное сотрудничество"
 ARG_usa_military_coop_desc:0 "[USA.GetNameDefCap] кое-что знает о войне и готова нас обучить."
 ARG_usa_technological_coop:0 "[USA.GetAdjective] Технологическое сотрудничество"
 ARG_usa_technological_coop_desc:0 "Технологические возможности [USA.GetNameDef] не имеют равных. Сотрудничество с её исследовательскими группами принесёт нам лишь пользу."
 ARG_eden_malbran_treaty:0 "Договор Идена — Мальбрана"
 ARG_eden_malbran_treaty_desc:0 "Иногда ради международных отношений приходится идти на жертвы. Подписание договора поставит нас в невыгодное положение, но отношения с [ENG.GetNameDef] несомненно улучшатся."
 ARG_uk_industrial_coop:0 "[ENG.GetAdjective] Промышленное сотрудничество"
 ARG_uk_industrial_coop_desc:0 "Партнёрство с [ENG.GetNameDef] обеспечит стране беспрецедентный промышленный рост."
 ARG_uk_naval_coop:0 "[ENG.GetAdjective] Морское сотрудничество"
 ARG_uk_naval_coop_desc:0 "[ENG.GetAdjective] кораблестроение превосходит наше, поэтому обращение за технической поддержкой принесёт большую пользу."
 ARG_militarism:0 "Милитаризм"
 ARG_militarism_desc:0 "Те, кто считает армию необходимым злом, будут колебаться перед лицом войны. Необходимо милитаризировать культуру, чтобы стать эффективной боевой силой."
 ARG_military_youth:0 "Военизированная молодёжь"
 ARG_military_youth_desc:0 "Организации, развивающие дисциплину и политическое воспитание молодёжи, укрепят верность и готовность к самопожертвованию."
 ARG_paramilitarism:0 "Парамилитаризм"
 ARG_paramilitarism_desc:0 "Военные принципы применимы и за пределами армии. Создание полувоенных формирований в дополнение к вооружённым силам позволит большему числу людей пройти подготовку."
 ARG_political_correctness:0 "Политическая корректность"
 ARG_political_correctness_desc:0 "Люди с умеренно спорными или просто неловкими взглядами, похоже, обеспокоены масштабным заговором против них. Звучит как отличная идея."
 ARG_indoctrination_focus:0 "Идеологическая обработка"
 ARG_indoctrination_focus_desc:0 "Раз наша идеология основана на истине, её следует преподавать именно так. Образование и средства массовой информации должны отражать этот урок."
 ARG_political_commissars:0 "Политические комиссары"
 ARG_political_commissars_desc:0 "Чтобы наша политика соблюдалась и в армии, мы введём в воинские ряды политически назначаемых представителей."
 ARG_army_reform:0 "Реформа армии"
 ARG_army_reform_desc:0 "Наша армия находится в позорном состоянии. Необходимо полностью перестроить военную структуру."
 ARG_external_advisors:0 "Иностранные военные советники"
 ARG_external_advisors_desc:0 "Нам не хватает опыта, зато у других его предостаточно. Можно обратиться к ним за помощью в реформировании армии."
 ARG_military_academy:0 "Национальная военная академия"
 ARG_military_academy_desc:0 "Зависимость от других стран в подготовке офицеров ослабит нас политически, поэтому необходимо создать собственную систему обучения командиров."
 ARG_motorized_army:0 "Моторизованная армия"
 ARG_motorized_army_desc:0 "Мобильность и защита крайне важны для безопасной доставки пехоты на поле боя и её вывода оттуда. Развитие этих направлений позволит действовать быстрее."
 ARG_study_foreign_tanks:0 "Изучить иностранные танки"
 ARG_study_foreign_tanks_desc:0 "Некоторые страны располагают передовой бронетехникой. Анализ их конструкций поможет улучшить наши будущие машины."
 ARG_mechanized_experiments:0 "Эксперименты с механизированными войсками"
 ARG_mechanized_experiments_desc:0 "Переосмыслив возможности моторизованной пехоты, мы сможем расширить пределы техники, доступной для строительства сегодня."
 ARG_tanks_experiments:0 "Танковые эксперименты"
 ARG_tanks_experiments_desc:0 "Переосмыслив возможности бронетехники, мы сможем расширить пределы машин, доступных для строительства сегодня."
 ARG_tanks_modernization:0 "Модернизация танков"
 ARG_tanks_modernization_desc:0 "Для превосходства на поле боя армии нужны современные танки. Наши инженеры уверены, что смогут создать бронетехнику не хуже машин великих держав."
 ARG_cruiser_tanks_experiments:0 "Эксперименты с крейсерскими танками"
 ARG_cruiser_tanks_experiments_desc:0 "Освоив основы танкостроения, можно искать нестандартные решения и совершенствовать конструкции."
 ARG_heavy_tanks_experiments:0 "Эксперименты с тяжёлыми танками"
 ARG_heavy_tanks_experiments_desc:0 "Освоив основы танкостроения, можно сосредоточиться на тяжёлых машинах, которые станут остриём наступления."
 ARG_study_foreign_equipment:0 "Изучить иностранное снаряжение"
 ARG_study_foreign_equipment_desc:0 "Некоторые страны разработали передовое вооружение. Анализ их образцов поможет улучшить наше будущее оружие."
 ARG_equipment_modernization:0 "Модернизация снаряжения"
 ARG_equipment_modernization_desc:0 "Солдат бесполезен без оружия. Чтобы модернизировать армию, сначала необходимо обновить её оснащение."
 ARG_standarized_equipment:0 "Стандартизированное снаряжение"
 ARG_standarized_equipment_desc:0 "Стандартизация солдатского снаряжения позволит точнее настроить промышленность и увеличить темпы его выпуска."
 ARG_equipment_innovation:0 "Нововведения в вооружении"
 ARG_equipment_innovation_desc:0 "Лучшее оружие делает солдат лучше. Чтобы победить, необходимо сохранять технологическое превосходство."
 ARG_special_forces:0 "Войска специального назначения"
 ARG_special_forces_desc:0 "Нам нужны элитные части. Приоритет следует отдать горным войскам и десантникам."
 ARG_artillery_modernization:0 "Модернизация артиллерии"
 ARG_artillery_modernization_desc:0 "Бой — это не только стрельба солдат друг в друга. Чтобы дивизии были действительно эффективны, им необходима современная артиллерийская поддержка."
 ARG_specialized_artillery:0 "Специализированная артиллерия"
 ARG_specialized_artillery_desc:0 "Наши солдаты часто сталкиваются с противником в невыгодном положении — на земле или в воздухе. Армии нужны средства для решения этой проблемы."
 ARG_new_officers_programme:0 "Программа подготовки новых офицеров"
 ARG_new_officers_programme_desc:0 "Генералы — опора армии. Для правильного реформирования вооружённых сил необходимы новые офицеры."
 ARG_volunteer_corps:0 "Добровольческий корпус"
 ARG_volunteer_corps_desc:0 "Отправляя солдат сражаться в чужих конфликтах, мы получим ценный опыт для будущих войн."
 ARG_navy_reform:0 "Реформа флота"
 ARG_navy_reform_desc:0 "Наш флот находится в позорном состоянии, а корабли едва ли смогли бы нормально действовать. Необходима полная перестройка военно-морских сил."
 ARG_state_dockyards:0 "Государственные верфи"
 ARG_state_dockyards_desc:0 "Для создания мощного флота нужны места, где можно строить корабли."
 ARG_naval_development_I:0 "Развитие флота"
 ARG_naval_development_I_desc:0 "Необходимо дальше расширять наши судостроительные мощности."
 ARG_naval_development_II:0 "Развитие флота II"
 ARG_naval_development_II_desc:0 "Необходимо дальше расширять наши судостроительные мощности."
 ARG_naval_base_development:0 "Развитие военно-морских баз"
 ARG_naval_base_development_desc:0 "Флот растёт, и теперь нам нужны новые базы, с которых смогут действовать новые корабли."
 ARG_overseas_officer_training:0 "Подготовка офицеров за рубежом"
 ARG_overseas_officer_training_desc:0 "Когда нашим кораблям придётся вступить в бой, капитаны должны знать, что делать. Этому можно научиться лишь на войне, поэтому отправка офицеров за рубеж поможет решить проблему."
 ARG_naval_exercises:0 "Морские учения"
 ARG_naval_exercises_desc:0 "Нет лучшего способа научить моряков действовать в бою, чем тренировки и учения."
 ARG_fleet_modernization:0 "Модернизация флота"
 ARG_fleet_modernization_desc:0 "Большинство проектов наших кораблей устарело. Если не хотим проигрывать каждое сражение, необходимо обновить конструкции."
 ARG_screening_ships_modernization:0 "Модернизация кораблей охранения"
 ARG_screening_ships_modernization_desc:0 "Крупные корабли обладают огромной мощью, но дороги в строительстве. Вместо этого можно сосредоточиться на создании более многочисленного и качественного флота."
 ARG_cruisers_modernization:0 "Модернизация крейсеров"
 ARG_cruisers_modernization_desc:0 "Крейсеры — важные корабли, представляющие разумный баланс между стоимостью и мощью."
 ARG_submarines_modernization:0 "Модернизация подводных лодок"
 ARG_submarines_modernization_desc:0 "Даже если флот противника крупнее, мы можем нанести серьёзный ущерб его промышленности, лишив импорта."
 ARG_submarines_experiments:0 "Эксперименты с подводными лодками"
 ARG_submarines_experiments_desc:0 "Если мы не можем позволить себе прямое столкновение с врагом, передовые субмарины должны стать приоритетом."
 ARG_capital_ships_development:0 "Развитие крупных кораблей"
 ARG_capital_ships_development_desc:0 "Чем мощнее корабли, тем сильнее флот, и наши инженеры это понимают."
 ARG_capital_ships_modernization:0 "Модернизация крупных кораблей"
 ARG_capital_ships_modernization_desc:0 "Создавая мощные корабли, мы обеспечим контроль над морями."
 ARG_carrier_development:0 "Развитие авианосцев"
 ARG_carrier_development_desc:0 "Мы можем разработать авианосцы, позволяющие применять самолёты далеко от родных берегов."
 ARG_carrier_modernization:0 "Модернизация авианосцев"
 ARG_carrier_modernization_desc:0 "Наши авианосцы далеки от современного уровня. Следует сосредоточиться на их обновлении."
 ARG_naval_doctrine:0 "Военно-морская доктрина"
 ARG_naval_doctrine_desc:0 "Реформа флота заключается не только в наличии кораблей, но и в умении ими пользоваться."
 ARG_air_force_reform:0 "Реформа военно-воздушных сил"
 ARG_air_force_reform_desc:0 "Наши ВВС находятся в позорном состоянии: самолёты ломаются ещё до взлёта, а обученных пилотов крайне мало."
 ARG_bomber_modernization:0 "Модернизация бомбардировщиков"
 ARG_bomber_modernization_desc:0 "Подрыв вражеской экономики имеет первостепенное значение. Это помешает противнику снабжать армию и позволит нашим войскам наступать."
 ARG_cas_innovation:0 "Развитие штурмовой авиации"
 ARG_cas_innovation_desc:0 "Непосредственная авиационная поддержка жизненно важна на поле боя: она не только наносит урон вражеским линиям, но и заметно поднимает боевой дух солдат."
 ARG_light_fighter_modernization:0 "Модернизация лёгких истребителей"
 ARG_light_fighter_modernization_desc:0 "Для успешных воздушных операций необходимо господство в воздухе, а для него нужны быстрые и манёвренные самолёты."
 ARG_heavy_fighter_modernization:0 "Модернизация тяжёлых истребителей"
 ARG_heavy_fighter_modernization_desc:0 "Чтобы сопровождать бомбардировщики над опасными районами и уничтожать вражеские машины, угрожающие нашей промышленности, следует развивать более тяжёлые и мощные истребители."
 ARG_aviation_schools:0 "Авиационные школы"
 ARG_aviation_schools_desc:0 "Обученных пилотов не хватает. Создание авиационных школ поможет решить проблему."
 ARG_air_innovations:0 "Авиационные нововведения"
 ARG_air_innovations_desc:0 "Современные войны невозможно выиграть без господства в небе. Мы должны сделать всё возможное для развития ВВС."
 ARG_air_base_dev:0 "Развитие авиабаз"
 ARG_air_base_dev_desc:0 "Для увеличения численности авиации необходимо создать больше авиабаз на нашей территории."
 ARG_air_doctrine:0 "Воздушная доктрина"
 ARG_air_doctrine_desc:0 "Чтобы господствовать в небе, необходимо совершенствовать воздушную тактику."
 ARG_air_heroes:0 "Герои авиации"
 ARG_air_heroes_desc:0 "Прославление наших асов вдохновит молодое поколение последовать их примеру."
 ARG_nav_innovation:0 "Развитие морской авиации"
 ARG_nav_innovation_desc:0 "Ещё в 1921 году американцы продемонстрировали эффективность авиаударов по морским целям. Если мы намерены воевать с морской державой, нельзя пренебрегать этим родом авиации."
 ARG_internationalism:0 "Интернационализм"
 ARG_internationalism_desc:0 "У идеологии нет границ. Наши идеалы выше суверенитета."
 ARG_demand_georgia:0 "Потребовать Южную Георгию"
 ARG_demand_georgia_desc:0 "Южная Георгия это [ARG.GetAdjective]. Кто это? [ENG.GetNameDef] Чтобы держать его подальше от нас? Если они не захотят его вернуть, мы их сделаем."
 ARG_brazil_non_agression:0 "Пакт о ненападении с Бразилией"
 ARG_brazil_non_agression_desc:0 "Конфликт с [BRA.GetNameDef] не отвечает нашим интересам. Для улучшения отношений с [BRA.GetAdjective] правительством можно предложить пакт о ненападении."
 ARG_brazil_joint_exercises:0 "[ARG.GetAdjective]-[BRA.GetAdjective] Совместные учения"
 ARG_brazil_joint_exercises_desc:0 "Обе наши страны переживают подъём благодаря положению в Европе. Следует помочь соседям и показать, что мы стоим рядом с ними."
 ARG_ask_for_georgia:0 "Попросить Южную Георгию"
 ARG_ask_for_georgia_desc:0 "Южная Георгия и Южные Сандвичевы острова по праву [ARG.GetAdjective]. Наши недавно обнаруженные связи с [ENG.GetNameDef] Это позволит нам найти дипломатическое решение."
 ARG_ask_for_malvinas:0 "Попросить Мальвинские острова"
 ARG_ask_for_malvinas_desc:0 "Мальвины по праву являются [ARG.GetAdjective]. Наши недавно обнаруженные связи с [ENG.GetNameDef] Это позволит нам найти дипломатическое решение."
 ARG_proving_grounds:0 "Испытательные полигоны"
 ARG_proving_grounds_desc:0 "Чтобы создавать оружие завтрашнего дня, нам нужно место для испытания прототипов."
 ARG_political_repression:0 "Политические репрессии"
 ARG_political_repression_desc:0 "Для обеспечения политической стабильности и единства страны радикальные элементы общества необходимо держать подальше от власти, даже если придётся прибегнуть к сомнительным методам."
 ARG_occupy_uruguay:0 "Оккупировать Уругвай"
 ARG_occupy_uruguay_desc:0 "Нынешнее уругвайское правительство мешает объединению республик Ла-Платы. Завоюем его, чтобы обезопасить нашу сферу влияния."
 ARG_occupy_paraguay:0 "Оккупировать Парагвай"
 ARG_occupy_paraguay_desc:0 "Парагвай отказывается сотрудничать с нами в создании славной коммунистической утопии, поэтому с ним необходимо разобраться."
 ARG_spanish_civil_war_involvement:0 "Участие в гражданской войне в Испании"
 ARG_spanish_civil_war_involvement_desc:0 "Мы не можем позволить испанским братьям сражаться, не оказав им никакой помощи."
 r56_ARG_spanish_civil_war_involvement:0 "Участие в гражданской войне в Испании"
 ARG_national_catholicism:0 "Национал-католицизм"
 ARG_national_catholicism_desc:0 "Католическая церковь — церковь Бога, и ничто не может стоять выше неё."
 ARG_political_corruption_idea:0 "Политическая коррупция"
 ARG_political_corruption_idea_desc:0 "Многие годы правительство [ARG.GetNameDef] страдает от глубоко укоренившейся коррупции. Предполагалось, что создание Конкордансии ослабит проблему, однако фальсификация голосов и запугивание избирателей продолжаются."
 ARG_corruption_crackdown_idea:0 "$ARG_crack_down_on_corruption$"
 ARG_corruption_crackdown_ideas_desc:0 "Коррупция, поразившая правительство страны, была совершенно недопустима. Благодаря политике Роберто Марии Ортиса мы наконец начали пресекать откровенно мошеннические действия политиков."
 ARG_anti_corruption_idea:0 "Антикоррупционная политика"
 ARG_anti_corruption_idea_desc:0 "Коррупция, поразившая правительство страны, была совершенно недопустима. Благодаря политике Марсело Т. де Альвеара мы наконец начали пресекать откровенно мошеннические действия политиков."
 ARG_growing_nationalism_idea:0 "Рост националистического движения"
 ARG_growing_nationalism_idea_desc:0 "Аргентинская националистическая партия привлекла внимание по всей стране, и всё больше людей вступает в её ряды, поддерживая растущую идеологию. Аргентинский национализм стремится восстановить [ARG.GetAdjective] идентичность и утвердить страну как ведущую державу Южной Америки."
 ARG_instituto_aerotecnico_de_cordoba:0 "Аэротехнический институт Кордовы"
 ARG_american_oil_concern:0 "Промышленный нефтяной концерн"
 ARG_american_oil_concern_desc:0 "Наши нефтяные запасы можно освоить благодаря [USA.GetAdjective] опыту."
 ARG_american_industrial_investments:0 "[USA.GetAdjective] промышленные инвестиции"
 ARG_american_industrial_investments_desc:0 "[USA.GetAdjective] капитал поможет развить страну и укрепить её стратегическое значение."
 ARG_join_the_defense_of_the_hemisphere:0 "Присоединиться к обороне полушария"
 ARG_join_the_defense_of_the_hemisphere_desc:0 "[USA.GetNameDefCap] является ведущей силой в защите Америк. Ради сохранения дорогого нам мира необходимо помочь ей."
 demanded_falkland_islands:0 "Потребовали Фолклендские острова"
 arg_claim:0 "[ARG.GetAdjective] претензии"
 arg_coop:0 "[ARG.GetAdjective] сотрудничество"
 demanded_georgia_island:0 "Потребовали Южную Георгию"
 arg_anti_semitic_ger:0 "[GER.GetAdjective] приоритет"
 arg_anti_semitic:0 "[GER.GetAdjective] приоритет"
 broken_treaty:0 "Нарушенный договор"
 have_a_plan:0 "Есть план"
 americas_talks:0 "[USA.GetAdjective] Разговоры"
 arg_influence:0 "[ARG.GetAdjective] влияние"
 denied_malvinas:0 "Отказано в передаче Мальвинских островов"
 denied_south_georgia:0 "Отказано в передаче Южной Георгии"
 refused_coop:0 "Отказ от сотрудничества"
 arg_economic_depresion:0 "Экономическая депрессия"
 arg_economic_depresion_desc:0 "Экономика страны переживает тяжёлые времена из-за Великой депрессии в [USA.GetNameDef]."
 arg_std_equipment:0 "Стандартизированное снаряжение"
 arg_std_equipment_desc:0 "Благодаря работе инженеров и точной настройке промышленности мы создали простое в производстве снаряжение для солдат."
 arg_overseas_officers:0 "Офицеры за рубежом"
 arg_overseas_officers_desc:0 "Военно-морские офицеры отправлены за границу, чтобы получить опыт командования, пока мы сами не участвуем в войнах."
 arg_naval_exercises:0 "Морские учения"
 arg_naval_exercises_desc:0 "Флот модернизируется, но необходимо проверить поведение кораблей в открытом море. Для этого мы проводим военно-морские учения."
 arg_aviation_schools:0 "Авиационные школы"
 arg_aviation_schools_desc:0 "Для победы в воздухе пилоты должны быть подготовлены и уметь летать. Лучший способ добиться этого — обучить их заранее."
 arg_air_heroes:0 "Герои авиации"
 arg_air_heroes_desc:0 "Пилоты проявляют огромный энтузиазм, а в ожесточённых воздушных боях рождаются новые асы. Их пример вдохновляет молодёжь сражаться и добиваться такого же признания."
 imports_substitution:0 "Импортозамещение"
 imports_substitution_desc:0 "Наша промышленность недостаточно развита. Чтобы самостоятельно отстаивать свои интересы, необходимо заменить весь гражданский импорт."
 law_11729:0 "Закон 11.729"
 law_11729_desc:0 "Рабочие заслуживают признания: они являются двигателем страны, и без них производство невозможно. Этот закон обеспечит им лучшие условия труда."
 arg_industrial_census:0 "Промышленная перепись"
 arg_industrial_census_desc:0 "Экономику нельзя правильно настроить, не зная уровня развития промышленности. Для этого необходимо провести перепись."
 establish_the_bcra:0 "BCRA"
 establish_the_bcra_desc:0 "Центральный банк [ARG.GetNameDef] станет главным государственным банком. Создание такого учреждения поможет развитию экономики страны."
 barn_of_the_world:0 "Житница мира"
 barn_of_the_world_desc:0 "Пока большинство стран мира страдает от экономических проблем или войны, мы стали крупнейшим производителем зерна. Это несомненно поможет развитию экономики."
 infamous_decade:0 "Бесславное десятилетие"
 infamous_decade_desc:0 "Правительство [ARG.GetNameDef] переживает тёмные времена, отмеченные избирательными махинациями и преследованием политической оппозиции. Это даёт властям больше свободы действий, но тяжело ложится на сердца народа."
 viva_la_patria:0 "Да здравствует Родина!"
 viva_la_patria_desc:0 "[ARG.GetAdjective] народ прошёл через множество испытаний, но сохранил веру в страну. С такой решимостью [ARG.GetNameDef] победит при любых обстоятельствах."
 arg_four_year_plan:0 "Четырёхлетний план"
 arg_four_year_plan_desc:0 "Посредством долгосрочных решений мы намерены модернизировать промышленность и сотрудничать с другими коммунистическими странами мира."
 arg_the_will_of_the_people:0 "Воля народа"
 arg_the_will_of_the_people_desc:0 "Страна ничто без народа, поэтому именно народ должен ею править."
 one_mind:0 "Единая воля"
 one_mind_desc:0 "Народ знает, чего хочет, разделяет общие цели, помогает друг другу и объединяется ради всё более великих свершений."
 arg_liberty:0 "Свобода"
 arg_liberty_desc:0 "Демократия — правильный путь народного правления, при котором каждый имеет голос."
 arg_external_help:0 "Внешняя помощь"
 arg_external_help_desc:0 "Недостаток знаний и плачевное состояние экономики можно исправить, обратившись за помощью к другим странам."
 industrial_coop:0 "Промышленное сотрудничество"
 industrial_coop_desc:0 "Развитие не всегда должно происходить без посторонней помощи. Иногда просьба о поддержке выгодна обеим сторонам."
 naval_coop:0 "Военно-морское сотрудничество"
 naval_coop_desc:0 "Некоторые страны лучше умеют строить верфи и порты, и это достаточная причина обратиться к ним за помощью."
 arg_malbran:0 "Договор Идена — Мальбрана"
 arg_malbran_desc:0 "Иногда ради расположения сильных держав приходится идти на жертвы. Подписание договора поставило [ARG.GetNameDef] в невыгодное положение, но отношения с [ENG.GetNameDef] несомненно улучшились."
 arg_british_advisors:0 "[ENG.GetAdjective] Советники"
 arg_british_advisors_desc:0 "[ENG.GetNameDef] помогает [ARG.GetNameDef] модернизировать армию с помощью советников."
 arg_german_advisors:0 "[GER.GetAdjective] Советники"
 arg_german_advisors_desc:0 "[GER.GetNameDef] помогает [ARG.GetNameDef] модернизировать армию с помощью советников."
 arg_soviet_advisors:0 "[SOV.GetAdjective] Советники"
 arg_soviet_advisors_desc:0 "[SOV.GetNameDef] помогает [ARG.GetNameDef] модернизировать армию с помощью советников."
 arg_american_advisors:0 "[USA.GetAdjective] Советники"
 arg_american_advisors_desc:0 "[USA.GetNameDef] помогает [ARG.GetNameDef] модернизировать армию с помощью советников."
 arg_inmigrant_wave:0 "Волна иммиграции"
 arg_inmigrant_wave_desc:0 "В нашу страну прибывает значительное число людей, желающих остаться."
 arg_political_repression:0 "Политические репрессии"
 arg_political_repression_desc:0 "Поддержание порядка имеет свою цену."
 ARG_supremacy_over_brazil:0 "Превосходство над [BRA.GetNameDef]"
 ARG_supremacy_over_brazil_desc:0 "Будучи крупнейшей и наиболее промышленно развитой страной Южной Америки, [BRA.GetNameDef] угрожает нашей быстро расширяющейся сфере влияния. Для сохранения господства в регионе необходимо установить там дружественный режим под нашим прямым контролем."
