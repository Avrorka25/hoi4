 heavy_fighter:0 "Тяжёлый истребитель"
 heavy_fighter_equipment_desc:0 "Тяжёлые истребители обладают большой дальностью и мощным вооружением. Они хорошо подходят как для сопровождения бомбардировщиков на дальних дистанциях, так и для перехвата вражеских бомбардировщиков. Однако меньшая манёвренность мешает им в бою с обычными истребителями."
 strat_bomber:0 "Стратегический бомбардировщик"
 strat_bomber_equipment_desc:0 "Стратегические бомбардировщики атакуют вражеские здания и инфраструктуру, лишая противника промышленного потенциала."
