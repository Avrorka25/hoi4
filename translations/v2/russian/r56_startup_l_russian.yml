l_russian:
 r56.startup.event.1.t:0 "Добро пожаловать в §BДорога до 56 РП§! Мод!"
 r56.startup.event.1.d:0 "Здравствуйте и поздравляем вас с RP-командой 56!\n\nЭтот мод был создан для обычных игр, размещенных на нашем сервере. §Bраздор§! Ссылку можно найти на §BСтраница семинара.§!\n\n§R- ВАЖНО -\n§!Этот мод является одним из двух официальных суб-модов для §BДорога до 56§! Обновление примерно каждый месяц около 7-го / 8-го, что может привести к нерегулярности обновлений, поскольку мы полагаемся на них для обновления. Замедление может произойти, когда добавляется новое расширение: Мы просим вашего терпения.\n\n§RТакже, пожалуйста, обратите внимание:§!\nЕсли вы встретите какой-либо §Rжуки§! или §RВопросы§!Убедитесь, что у вас нет конфликтов моды; В противном случае, пожалуйста, сообщите о них подробно в нашем Разногласии или если у вас просто есть некоторые вопросы - мы можем быть в состоянии ответить, не стесняйтесь спрашивать в комментариях или Разногласия.\nЕсли вы ищете для §Bдискардианский§! Версия просто ищет ее в мастерской.\nP.S. На нем будет фигурка-призрак;D!"
 r56.startup.event.1.option_auto:0 "Дай мне насладиться игрой, черт возьми!"
 r56.startup.event.1.option_tt:0 "Спасибо, что сыграли в наш мод, и у вас прекрасный день! - Многие глупцы потратили на это бесчисленные часы."
 r56.startup.event.02.title:0 "...погодите-ка!"
 r56.startup.event.02.description:0 "Похоже, у вас нет бесплатного DLC «Польша: Объединённые и готовые». Это а §Rтребование§! Для того, чтобы мод работал так, как задумано. Пожалуйста, перезапустите игру с включенным DLC; В противном случае появятся некоторые графические баги."
 r56.startup.event.02.option:0 "Я выйду из игры и сделаю, как вы сказали."
 r56.startup.event.02.option_tt:0 "И правильно..."
 r56.startup.event.03.title:0 "Вы не должны были это увидеть"
 r56.startup.event.02.description:0 ""
 r56.startup.event.03.option:0 "Перестаньте использовать консоль"
