 JAP_imperial_influence_factions_names_text_communist:0 "Внутренняя фракция"
 JAP_imperial_influence_factions_names_text_monarchist:0 "Имперская фракция"
 JAP_sea_purge_the_kodoha_faction:0 "Очистить фракцию Кодоха"
 JAP_sea_purge_the_kodoha_faction_desc:0 "Кодоха упустили возможность захватить власть, и это дорого им обойдется. За их предательство по отношению к его императорскому величеству мы лишим их званий и попробуем их на измену. Наконец-то пришло время, чтобы Тосейха взяла под свой контроль Имперскую армию!"
 JAP_sea_purge_the_kodoha_faction_tt:0 "§YСадао Араки§! и §YСигэру Хондзё§! будет уволен с действительной службы"
 JAP_east_asian_cooperative_society:0 "Восточноазиатское кооперативное общество"
 JAP_east_asian_cooperative_society_desc:0 "Недавно разработанная теория Восточно-Азиатского кооперативного общества выступает за создание в Восточной Азии кооперативного сообщества, которое бы превышало этнические и национальные границы. Мы должны опираться на эту идею, чтобы укрепить наши позиции хранителя Тихого океана и лидера восточноазиатских народов."
 JAP_east_asian_cooperative_society_tt:0 "Разблокирует решения о дружбе и инвестировании в природные ресурсы §YАзиатские нации§!"
 JAP_imperial_headquarters_liasion_conference:0 "Имперская конференция по связям"
 JAP_imperial_headquarters_liasion_conference_desc:0 "С восстановлением Императорского Генерального Штаба впервые со времен русско-японской войны настало время провести конференцию между руководителями различных фракций для содействия сотрудничеству и обмену информацией между военными и правительством."
 JAP_promulgate_the_military_ministers_system:0 "Система атташе военных министров"
 JAP_promulgate_the_military_ministers_system_desc:0 "Короткий период после попытки государственного переворота со стороны фракции Кодоха был совсем не стабильным. Поскольку военные расстраиваются из-за правительства, необходимо что-то сделать, чтобы успокоить их. С этой целью Коки Хирота предложил сделать военного министра должностью, которая может быть предоставлена только активно действующему офицеру, как это было несколько раз на протяжении всей нашей истории."
 JAP_promulgate_the_military_ministers_system_tt:0 "Этот ход §Rнепопулярный§! Среди членов Совета §YГражданское правительство§!и, несомненно, вызовет трения между фракциями в должное время."
 JAP_reprimand_hamada_kunimatsu:0 "Выговор Хамаде Кунимацу"
 JAP_reprimand_hamada_kunimatsu_desc:0 "В своей речи, критикующей военных в парламенте, Хамада Кунимацу зашел слишком далеко. Чтобы военные не смогли полностью перехитрить гражданское правительство политически, мы должны должным образом выговорить его и показать, что у нас еще есть какая-то борьба."
 JAP_the_harakiri_debate:0 "Дебаты Харакири"
 JAP_the_harakiri_debate_desc:0 "После позорного акта неповиновения, который Хамада Кунимацу проявил против военных, Хисаичи Тераучи потребовал отставки кабинета и инаугурации нового премьер-министра, если у старого останется хоть капля чести. Благодаря тщательному маневрированию Сенджуро Хаяси может быть установлен в качестве марионетки военных."
 JAP_konoes_first_cabinet:0 "Первый кабинет Коноэ"
 JAP_konoes_first_cabinet_desc:0 "Сенджуро Хаяси предназначен только в качестве краткосрочного премьер-министра. Принц Фумимаро Коноэ, аполитичный и образованный Хенро Сайонджи Кинмоти, является идеальным кандидатом для стабилизации хаотической политической ситуации и объединения нации в духе. Пришло время, чтобы он сформировал свой собственный кабинет, будучи лично назначенным императором Хирохито самим Сайонджи."
 JAP_new_order_in_east_asia:0 "Новый порядок в Восточной Азии"
 JAP_new_order_in_east_asia_desc:0 "В недавних заявлениях [ROOT.GetLeader]Становится все более очевидным, что он намерен установить порядок в Восточной Азии, который имеет шесть основных целей. Они включают в себя постоянную стабильность Восточной Азии, добрососедскую дружбу и международную справедливость, совместную защиту от коммунизма, создание новой культуры, экономическую сплоченность и сотрудничество и, наконец, мир во всем мире."
 JAP_new_order_in_east_asia_faction:0 "Новый порядок в Восточной Азии"
 JAP_new_order_in_east_asia_tt:0 "Сосредоточиться $JAP_sea_greater_east_asian_co_properity_sphere$ Это преобразит эту фракцию."
 JAP_reiterate_the_three_principles_of_hirota:0 "Повторяем три принципа Хироты"
 JAP_reiterate_the_three_principles_of_hirota_desc:0 "Благодаря тщательному маневрированию правительства Хироте удалось добиться того, чтобы его преемник Казушиге Угаки стал новым премьер-министром. Настало время официально ратифицировать три заявления Хироты, а именно: создание блока Япония-Китай-Маньчжуро, организация китайско-японского общего фронта против распространения коммунизма и подавление антияпонской деятельности в Китае."
 JAP_formalize_japan_china_manchukuo_alliance:0 "Япония - Китай - Альянс Маньчжоу-Го"
 JAP_formalize_japan_china_manchukuo_alliance_desc:0 "с [CHI.GetLeader]Правительство, приняв наши требования по борьбе с коммунистической и антияпонской деятельностью, теперь кажется вероятным, что они будут готовы временно сформировать союз с нами, чтобы справиться с гноящейся болью в глубине Восточной Азии, известной как военачальничество и коммунизм, которая угрожает всей Азии уверенной и неизбежной смертью."
 JAP_sino_japanese_pact:0 "Китайско-японский антикоммунистический пакт"
 JAP_sea_national_spiritual_mobliization_movement:0 "Национальное движение духовной мобилизации"
 JAP_sea_national_spiritual_mobliization_movement_desc:0 "«Роскошь — наш враг!» С бережливостью, гигиеной и упорным трудом, возведённым в ранг национальных добродетелей, больше рабочей силы становится доступным для военных усилий, а воля небесного императора надлежащим образом передается всем нашим подданным."
 JAP_hokushin_ron:0 "Хокусин-рон"
 JAP_hokushin_ron_desc:0 "Фракция в нашей армии, которая называет себя «Группой ударного севера», выступает за экспансию в Сибирь и Монголию как средство получения природных ресурсов и экономической ценности, необходимых для продолжения наших имперских амбиций. Мы должны поддержать эту идею и начать подготовку наших сил к принятию такой доктрины, если время покажет правильное."
 JAP_strike_north_doctrine:0 "Доктрина удара на север"
 JAP_strenghten_manchukuo_imperial_army:0 "Укрепление маньчжурской императорской армии"
 JAP_strenghten_manchukuo_imperial_army_desc:0 "Имперская армия Маньчжоу-го стоит в авангарде против сил [SOV.GetNameDef]И это те, кто будет держать границу, если начнется война. Мы должны содействовать расширению этих сил, с тем чтобы они могли, как мы надеемся, противостоять этим силам. [SOV.GetAdjective] джаггернаут."
 JAP_strenghten_manchukuo_imperial_airforce:0 "Укрепление маньчжурских императорских ВВС"
 JAP_strenghten_manchukuo_imperial_airforce_desc:0 "Имперские военно-воздушные силы Маньчжоу-го были созданы совсем недавно, и их офицерам есть чему поучиться. Мы должны отправить офицеров для их обучения, а также доставить им истребители типа 91 армии Накадзимы и легкие бомбардировщики типа 88 Кавасаки, чтобы укрепить свои силы."
 JAP_ensure_temporary_peace_with_china:0 "Временный мир с Китаем"
 JAP_ensure_temporary_peace_with_china_desc:0 "Для того, чтобы сосредоточить наше внимание на [SOV.GetNameDef]Мы должны убедиться, что предательский [CHI.GetAdjective] Не ударяйте нас в спину, пока наши силы ведут боевые действия в других местах. Мы также должны убедиться, что Квантунская армия не может действовать в обход, чтобы они не начали войну, которую мы не можем выиграть."
 trautmann_agreement_opm:0 "Соглашение Траутмана"
 JAP_a_mongol_volunteer_army:0 "Реформа Монгольской Армии Независимости"
 JAP_a_mongol_volunteer_army_desc:0 "Маньчжурская армия имеет Монгольскую армию независимости, состоящую из монголов и бандитов. [ROOT.GetAdjective] Советники. Мы должны создать такую же армию полностью под своим контролем, с целью в конечном итоге отправить их на фронт. [MON.GetNameDef] Освобождение Родины от враждебных сил."
 JAP_a_mongol_volunteer_army_tt:0 "Если §Y[MAN.GetName]§! или §Y[MEN.GetName]§! Они наши союзники, они тоже обретут этот дух."
 JAP_a_mongol_volunteer_army_1_tt:0 "Разблокировать решения на §YДестабилизировать Монголию§! с целью склонить их на нашу сторону и совершить государственный переворот против правительства."
 JAP_utilize_ainu_expertise:0 "Используйте опыт Ainu"
 JAP_utilize_ainu_expertise_desc:0 "Айну родом из Северной Японии являются экспертами, когда дело доходит до навигации по снегу и суровой местности Хоккайдо. Может быть, мы могли бы поучиться у них методам, чтобы сделать наше вторжение в Сибирь более быстрым?"
 JAP_kantokuen:0 "Кантокуин"
 JAP_kantokuen_desc:0 "Чтобы извлечь выгоду из мировых событий, Квантунская армия готовит специальные маневры, готовясь к вторжению и оккупации российского Дальнего Востока. Чтобы атака прошла быстро, мы должны инвестировать в эти последние приготовления, прежде чем предпринимать действия."
 JAP_a_green_persimmon:0 "Зелёная хурма"
 JAP_a_green_persimmon_desc:0 "Наши войска еще не полностью готовы к войне с Россией. [SOV.GetNameDef]Но их внимание не было достаточно перенаправлено на запад. Несмотря на все это, мы должны атаковать сейчас, или шанс может ускользнуть от нас."
 JAP_the_persimmon_has_ripened:0 "Персиммон созрел"
 JAP_the_persimmon_has_ripened_desc:0 "Плоды победы быстро созревают, и наша армия полностью готова вмешаться и захватить Сибирь от развала. [SOV.GetAdjective] Империя. Война будет быстрой, и наши победы будут славными. Теннохейка Банзай!"
 JAP_peace_out_soviets_dec_tt:0 "Разблокировать решение о подписании §YОтдельный мир§! с §Y[SOV.GetNameDef]§! выигрывать §YСибирь§! Если мы контролируем их,"
 JAG_neutality_pact_focus_days_tt:0 "Текущими днями являются: [?JAP_soviet_japanese_neutrality_pact_flag:days|Y0]"
 JAP_soviet_japanese_neutrality_pact_flag:0 "Завершенный фокус §Y$JAP_soviet_japanese_neutrality_pact$§!"
 JAP_chinese_japanese_neutrality_pact_flag:0 "Завершенный фокус §Y$JAP_ensure_temporary_peace_with_china$§!"
 JAG_chinese_neutality_pact_focus_days_tt:0 "Текущими днями являются: [?JAP_chinese_japanese_neutrality_pact_flag:days|Y0]"
 JAP_hokushin_ron_started_flag:0 "Завершенный фокус §Y$JAP_hokushin_ron$§!"
 JAG_hokushin_ron_focus_days_tt:0 "Текущими днями являются: [?JAP_hokushin_ron_started_flag:days|Y0]"
 JAP_nanshin_ron_started_flag:0 "Завершенный фокус §Y$JAP_nanshin_ron$§!"
 JAG_nanshin_ron_focus_days_tt:0 "Текущими днями являются: [?JAP_nanshin_ron_started_flag:days|Y0]"
 JAP_sea_establish_the_northern_resource_area:0 "Создание Северного ресурсного района"
 JAP_sea_establish_the_northern_resource_area_desc:0 "Теперь, когда мы успешно оккупировали север, богатые сибирские отходы должны быть использованы для нашей постоянно растущей военной машины. Таким образом, мы должны установить новые шахты и запланированные города в жизненно важных местах, чтобы мы могли извлечь все, что мы можем."
 JAP_nanshin_ron:0 "Нансин-рон"
 JAP_nanshin_ron_desc:0 "Несмотря на то, что Китай и Сибирь богаты, они не обладают всеми необходимыми ресурсами. Недалеко на юге, однако, лежат Филиппины, Голландская Ост-Индия и британские колонии Малайя и Борнео. Для подлинной самодостаточности мы должны отобрать контроль над этими районами у европейских империалистов."
 JAP_unlocks_pearl_harbor_raid:0 "Разблокировать §Yрейд§!:\nПерл-Харбор забастовка §Y[USA.GetNameWithFlag]§!"
 JAP_soviet_japanese_neutrality_pact:0 "Советско-японский пакт о нейтралитете"
 JAP_soviet_japanese_neutrality_pact_desc:0 "Наша северная граница должна быть защищена, если мы хотим иметь свободу наносить удары на юг. Мы начнем переговоры с [SOV.GetNameDef] Немедленно обеспечить их нейтралитет, а также договориться о дальнейших ресурсных правах на Северный Сахалин."
 JAP_soviet_japanese_neutrality_pact_tt:0 "Если §Y[SOV.GetAdjective]s§! Примите договор, больше [ROOT.GetAdjective] Промышленникам будет интересно инвестировать в наши концессии. §Y[655.GetName]§!"
 JAP_unsinkable_aircraft_carriers:0 "Непотопляемые авианосцы"
 JAP_unsinkable_aircraft_carriers_desc:0 "Территории Южных морей служат идеальными базами для эксплуатации наших самолетов в борьбе за Тихий океан. Мы должны укреплять эти острова и укреплять их, чтобы мы могли удерживать их, чтобы они не «потопляли», как обычные перевозчики."
 JAP_isolate_oceania:0 "Изолированная Океания"
 JAP_isolate_oceania_desc:0 "Наше верховное командование сочло невозможным приземлиться и занять [AST.GetNameDef] и [NZL.GetNameDef]Мы предложили лучшее решение проблемы этих враждебных стран. Мы должны оккупировать менее защищенные острова вокруг этих государств и отрезать их от их союзников, чтобы постепенно лишить их воли воевать с нами."
 JAP_battle_for_australia:0 "Битва за Австралию"
 JAP_battle_for_australia_desc:0 "Теперь, [AST.GetNameDef] Он был изолирован, пришло время начать борьбу за небо над континентом. Если нам удастся контролировать их небо, то, возможно, занятие Океании не будет таким уж необоснованным."
 JAP_operation_take_australia:0 "Операция АН"
 JAP_operation_take_australia_desc:0 "Наконец-то пришло время. Высшее командование разрешило операцию по высадке в Австралии под кодовым названием «Операция АН». Мы уничтожим наших врагов и возьмем под контроль подбрюшье Азии!"
 JAP_sea_exploit_southern_resource_area:0 "Эксплуатация Южного ресурсного района"
 JAP_sea_exploit_southern_resource_area_desc:0 "Теперь, когда мы поставили юг под нашу пяту, мы должны значительно расширить эксплуатацию богатых ресурсов Юго-Восточной Азии и Ост-Индии, чтобы питать наши силы в нашей войне."
 JAP_demand_tonkinese_bases:0 "Спрос на тонкинские базы"
 JAP_demand_tonkinese_bases_desc:0 "Тонкинская область не только богата ресурсами, но и является важным шагом для дальнейшего расширения на юг. Находясь на границе с Китаем, он может также служить важной базой для операций наших ВВС по нанесению удара по Кантону."
 JAP_demand_tonkinese_bases_tt:0 "Франция владеет §YТонкин§!"
 JAP_demand_tonkinese_bases_2_tt:0 "Франция не владеет §YТонкин§!"
 JAP_occupy_indochina:0 "Оккупировать Индокитай"
 JAP_occupy_indochina_desc:0 "Народ Индокитая в настоящее время угнетается колониальными и империалистическими режимами, которые очень мало заботятся о своем благополучии. Мы должны вмешаться и взять под контроль этот регион, защитить его население и получить контроль над природными ресурсами региона в процессе."
 JAP_occupy_indochina_tt:0 "Франция не владеет §YИндокитай§!"
 JAP_occupy_siam:0 "Оккупировать Сиам"
 JAP_occupy_siam_desc:0 "Сиам, будучи нашим потенциальным союзником, может служить слабым подбрюшьем, которое наши противники обязательно будут использовать. Поэтому мы должны вмешаться и занять их непосредственно, чтобы они никогда не имели шансов вступить в сговор с нашими врагами."
 JAP_sea_pressure_siam:0 "Давление на Сиам"
 JAP_sea_pressure_siam_desc:0 "Сиам расположен в самом лучшем месте, чтобы помочь нам в предстоящей войне с западными державами. Приняв их на свою сторону, мы значительно облегчим неизбежное вторжение в Малайю и, тем самым, в Ост-Индию. Поэтому мы должны дать им совершенно ясно понять, что если они не с нами, то они против нас."
 JAP_strike_the_southern_road:0 "Забастовка южной дороги"
 JAP_strike_the_southern_road_desc:0 "Пришло время привести наш план в действие. Мы нанесем удар на юг и заберем богатые ресурсами западные колонии для себя. Этим быстрым и решительным ударом мы должны быть в состоянии уменьшить способность врагов воевать, прежде чем он даже начнется должным образом. Теннохейка Банзай!"
 JAP_occupy_east_timor:0 "Оккупировать Восточный Тимор"
 JAP_occupy_east_timor_desc:0 "Тиморы, хотя в настоящее время они не воюют в нашей войне, все же должны быть приведены под наши крылья ради будущего Азии. Наши войска стоят на островах, и мы готовы действовать быстро, без объявления войны, надеясь, что это останется незамеченным."
 JAP_occupy_east_timor_tt:0 "§RЭто может привести к войне с собственником. [721.GetName]!§!"
 JAP_revisit_the_thirteen_demands:0 "Пересмотреть Двадцать одно требование"
 JAP_revisit_the_thirteen_demands_desc:0 "Во время Великой войны наше правительство выдвинуло ряд требований к Китайской Республике, чтобы получить контроль над их железными дорогами и многое другое. Хотя первоначально они включали такие вещи, как решающий голос в их финансах, полиции и правительственных делах, были отклонены, и в конечном итоге это закончилось подписанием только тринадцати требований. Мы должны вернуться к этим идеям и заявить о себе как о правителях Восточной Азии."
 JAP_invest_in_senbu:0 "Инвестировать в Сенбу"
 JAP_invest_in_senbu_desc:0 "Наши сенбу-организации, часто в форме школ, медицинских бригад и центров распределения продовольствия, составляют тип психологических военных операций, предназначенных для умиротворения местного населения на оккупированных территориях. До сих пор они доказали свою эффективность в умиротворении Маньчжурии, и, возможно, нам следует расширить их деятельность, чтобы включить остальной Китай."
 JAP_unlock_senbu_occupation_law_tt:0 "Разблокировать оккупационное законодательство в §Yкитайский§! Государства:\n"
 JAP_establish_mongol_military_government:0 "Учреждение монгольского военного правительства"
 JAP_establish_mongol_military_government_desc:0 "Принц Де, потомок Великого Чингисхана, занимает мощную позицию в Совете Пайлингмяо, марионеточном руководстве Гоминьдана во Внутренней Монголии. Он хочет вернуть монголам былое величие, и был бы более чем готов встать на нашу сторону в формировании монгольского военного правительства, если мы обещаем выполнить его амбиции."
 JAP_launch_the_suiyuan_campaign:0 "Запуск кампании Suiyuan"
 JAP_launch_the_suiyuan_campaign_desc:0 "Внутренняя монгольская армия и Великая Ханьская праведная армия готовы начать операцию на территории военачальника. [SHX.GetLeader]При условии, что они получат нашу воздушную поддержку и контроль со стороны японских офицеров штаба. Возможно, мы сможем обеспечить большую безопасность Внутренней Монголии, не доказывая крупномасштабной войны в Китае."
 JAP_launch_the_suiyuan_campaign_tt:0 "С нашей поддержкой, §YВнутренняя армия Монголии§! и §YВеликая Ханьская праведная армия§! Наступят наступление, чтобы захватить §Y[621.GetName]§! от гоминьдановских сил, но будет иметь только узкое окно, прежде чем операцию нужно будет отменить"
 JAP_reorganize_the_united_autonomous_government:0 "Объединённое автономное правительство"
 JAP_reorganize_the_united_autonomous_government_desc:0 "Монгольское военное правительство в настоящее время имеет лишь элементарную политическую организацию и не будет долго держаться вместе без нашего вмешательства. Мы должны реорганизовать их в Монгольское единое автономное правительство, чтобы они могли должным образом утвердиться в качестве суверенной нации."
 JAP_mengjiang_united_autonomous_government:0 "Автономное правительство Мэнцзяна"
 JAP_mengjiang_united_autonomous_government_desc:0 "Чтобы узаконить притязания принца Де на всю Внутреннюю Монголию, мы должны далее реорганизовать правительство государства в единое автономное правительство Менцзяна, чтобы они могли раз и навсегда связать монгольский народ в пределах китайских границ под одним знаменем."
 JAP_mongol_autonomous_state:0 "Монгольское автономное государство"
 JAP_mongol_autonomous_state_desc:0 "[MON.GetNameDefCap] Он утверждает, что является истинным монгольским правительством, против чего яростно выступает князь Де. Мы должны реорганизовать и переименовать его царство, чтобы он мог претендовать на все монгольские земли."
 JAP_reinforce_the_beijing_garrison:0 "Восстановление Восточно-Хебейских гарнизонов"
 JAP_reinforce_the_beijing_garrison_desc:0 "Автономное правительство Восточного Хэбэя было создано после того, как мы завоевали Великую Китайскую стену, с их армией Восточного Хебэя, существующей для обеспечения демилитаризации Китая. [CHI.GetAdjective] стороны региона. Мы должны активно укреплять это подразделение и Квантунские гарнизоны в этом районе, чтобы оно не могло упасть на землю. [CHI.GetAdjective] Агрессия."
 JAP_reinforce_the_beijing_garrison_tt:0 "§RМожет привести к войне с [CHI.GetNameDef]§!"
 JAP_develop_the_chinese_resources:0 "Развитие китайских ресурсов"
 JAP_develop_the_chinese_resources_desc:0 "Теперь, когда под наше сапогом оказались большие участки китайской земли, мы должны развивать богатые китайские ресурсы, чтобы они могли быть полезны для следующей войны."
 JAP_form_the_jikyoku_iinkai:0 "Оригинальное название: Jikyoku Iinkai"
 JAP_form_the_jikyoku_iinkai_desc:0 "Для того, чтобы лучше контролировать наш импорт и экспорт, идущий в и из [USA.GetNameDef]Кроме того, они пытаются убедить [USA.GetAdjective] Люди на нашей стороне [CHI.GetNameDef]Мы должны создать Японский комитет по торговле и информации."
 japanese_committee_on_trade_and_information_pom:0 "Японский комитет по торговле и информации"
 JAP_strategic_offensives:0 "Стратегические наступления"
 JAP_strategic_offensives_desc:0 "[CHI.GetNameDefCap] Мы доказываем, что очень тонкий орех треснет, и наше высшее командование призвало к более скоординированным наступлениям, нацеленным на различные точки интереса. С Гекокудзё на местах, подрывающим наши высшие интересы, мы должны сначала сократить их, чтобы мы могли, наконец, добиться того, чтобы эти операции продолжались."
 JAP_strategic_offensives_tt:0 "Разблокировать решения на §YЗапуск наступлений§! Это дает временные бонусы в §YКитайские государства§!"
 JAP_intensify_anti_guerilla_operations:0 "Активизация антипартизанских операций"
 JAP_intensify_anti_guerilla_operations_desc:0 "Партизаны и инфильтраторы препятствуют прогрессу и успеху наших военных кампаний в Китае, нанося нам удары там, где это больнее всего. Мы должны готовиться к скоординированному удару по этим бандитам, так или иначе убрать их ячейки с наших территорий!"
 JAP_intensify_anti_guerilla_operations_tt:0 "Половину стоимости взятия §Y$PRC_root_out_guerilla_fighters$§! Решения и позволяет временно уменьшить сопротивление в штатах, где партизаны были искоренены."
 JAP_reorganized_national_government:0 "Реорганизованное национальное правительство"
 JAP_reorganized_national_government_desc:0 "Нам стало известно, что многочисленные местные органы власти, созданные нашей армией, а также прямая оккупация китайской сельской местности дорого нам обходятся. Мы должны объединить эти правительства и создать реорганизованное национальное правительство."
 JAP_reorganized_national_government_tt:0 "Разблокировать решения на §Yконсолидировать§! наш §YКитайские холдинги§!"
 JAP_occupy_macau:0 "Захвати Макао"
 JAP_occupy_macau_desc:0 "Макао — опасный город, который может выйти из-под нашего контроля, если мы хотим продолжить нашу борьбу против колонизаторов на западе. Он может служить отправной точкой для отсечения наших армий и снабжения противника как воздушным, так и морским путем. Поэтому мы должны вмешаться и занять его немедленно, прежде чем он может стать нашим неожиданным падением."
 JAP_an_expedition_to_tibet:0 "Экспедиция в Тибет"
 JAP_an_expedition_to_tibet_desc:0 "Для того, чтобы лучше понять, если мы собираемся быть в состоянии убедить [TIB.GetAdjective] Чтобы занять нашу сторону в более широком конфликте для Азии, мы должны начать разведывательную миссию по установлению контакта с ними. Однако из-за их строгих правил относительно того, кто может войти, нам придется отправить Джинзо Номото, замаскированного под монгольского и сопровождающего тибетского монаха."
 JAP_an_expedition_to_tibet_tt:0 "Разблокировать решения на §YВлияние Тибета§! с целью превращения их в §YЯпонская тема§!"
 JAP_ally_the_dragon_king:0 "Ally the Dragon King (альбом)"
 JAP_ally_the_dragon_king_desc:0 "Король-дракон Бутана правит своим одиноким и изоляционистским тибетским королевством, но, возможно, он может видеть более широкую картину. Мы должны попытаться направить официальную делегацию в Пунакху, чтобы убедить его присоединиться к нам в освобождении Азии."
 JAP_claim_the_raven_crown:0 "Оригинальное название: The Raven Crown"
 JAP_claim_the_raven_crown_desc:0 "Наш Небесный Император стоит выше всех других, и те, кто не видит его таким образом, должны быть раздавлены. Мы должны вторгнуться [BHU.GetNameDef] И пусть трон свой мы возьмем себе."
 JAP_ally_the_gorkhas:0 "Союзник Горхов"
 JAP_ally_the_gorkhas_desc:0 "Король Непала правит своим королевством в самой высокой горной цепи в мире, будучи в значительной степени отрезанным от внешнего контакта. Может быть, он видит причину. Мы должны попытаться направить официальную делегацию в Катманду, чтобы убедить его присоединиться к нам в освобождении Азии."
 JAP_claim_the_scripech:0 "Обсуждение The Shripech"
 JAP_claim_the_scripech_desc:0 "Наш Небесный Император стоит выше всех других, и те, кто не видит его таким образом, должны быть раздавлены. Мы должны вторгнуться [NEP.GetNameDef] И пусть трон свой мы возьмем себе."
 JAP_ally_afghanistan:0 "Союзник Баракзая"
 JAP_ally_afghanistan_desc:0 "Король Афганистана правит различными афганскими племенами в одном из самых суровых горных регионов мира. Может быть, он видит причину. Мы должны попытаться направить официальную делегацию в Кабул, чтобы убедить его присоединиться к нам в освобождении Азии."
 JAP_best_the_graveyard:0 "Лучшее кладбище"
 JAP_best_the_graveyard_desc:0 "Наш Небесный Император стоит выше всех других, и те, кто не видит его таким образом, должны быть раздавлены. Мы должны вторгнуться [AFG.GetNameDef] И пусть трон свой мы возьмем себе."
 JAP_form_the_central_economic_council:0 "Создать Центральный экономический совет"
 JAP_form_the_central_economic_council_desc:0 "Для того, чтобы разрешить экономический спад, с которым сталкивается наша страна в результате политической нестабильности и войны, мы должны создать специальный консультативный орган для премьер-министра с целью расследования и целенаправленной экономической политики между внутренними и заморскими территориями и основных планов по их реализации."
 JAP_expand_the_showa_research_association:0 "Расширение исследовательской ассоциации Showa"
 JAP_expand_the_showa_research_association_desc:0 "Политический аналитический центр «Шова Кенкюкай», созданный для генерации инновационных идей политических реформ путем рассмотрения и оценки вопросов, связанных с конституцией Мэйдзи, расширяет свои зоны интересов и формирует новые подгруппы. Мы должны поощрять это, чтобы они могли развивать новые технологии и способы доминирования в Азии."
 JAP_form_the_great_japan_industrial_patriotic_association:0 "Промышленно-патриотическая ассоциация Японии"
 JAP_form_the_great_japan_industrial_patriotic_association_desc:0 "Промышленники и профсоюзы в нашей стране расколоты и неэффективны, что препятствует нашему экономическому развитию. Мы должны объединить все это под одной зонтичной организацией, чтобы наши отрасли работали максимально эффективно и привели к дальнейшему расширению."
 JAP_sea_guide_the_zaibatsus:0 "Оригинальное название: The Zaibatsus"
 JAP_sea_guide_the_zaibatsus_desc:0 "Крупнейшие корпорации нашей страны уже давно обладают беспрецедентной политической и экономической мощью. С некоторым изяществом мы сможем направить их усилия в нашу пользу и реорганизовать их руководство в группы под нашим более широким контролем."
 JAP_form_cabinet_intelligence_bureau:0 "Сформировать Бюро разведки Кабинета министров"
 JAP_form_cabinet_intelligence_bureau_desc:0 "Премьер-министр [ROOT.GetLeader] Я лично просил, чтобы правительственная организация сосредоточилась на улучшении прояпонского общественного мнения и обеспечении того, чтобы каждый гражданин вносил свой вклад в войну и защиту нашей великой нации. Нобухуми Ито принял его просьбу и просто нуждается в официальных приказах, чтобы создать бюро."
 JAP_crackdown_on_foreign_agents:0 "Преследование иностранных агентов"
 JAP_crackdown_on_foreign_agents_desc:0 "Разведывательное бюро кабинета обнаружило множество подозрительных людей, которые крутятся вокруг. Некоторые из них имеют нежелательную идеологию, а некоторые являются явными агентами иностранных держав. Может быть, пришло время для бюро начать действовать и начать кампанию по защите нашей нации и ее народа?"
 JAP_crackdown_on_foreign_agents_tt:0 "The §YТокко§! В частности, будет активнее арестовывать диссидентов и шпионов в попытке укрепить национальную безопасность и стабильность."
 JAP_found_the_great_japan_press_association:0 "Создана Большая Японская Пресс Ассоциация"
 JAP_found_the_great_japan_press_association_desc:0 "Бюро разведки кабинета министров придумало способ более эффективно направлять наше население в правильном направлении. Создавая Великую Японскую Ассоциацию Прессы, мы можем иметь один офис, контролирующий все СМИ внутри страны, эффективно подвергая цензуре любую необходимую нам информацию и распространяя патриотическую пропаганду среди тех, кто может в ней нуждаться."
 JAP_empower_the_thought_police:0 "Расширяйте полномочия полиции мысли"
 JAP_empower_the_thought_police_desc:0 "Специальная Высшая полиция существует с целью осуществления гражданского правопорядка, контроля над политическими группами и идеологиями, которые, как считается, угрожают общественному порядку Японской империи, контрразведке, внутренним уголовным расследованиям, высокой полиции и общественной безопасности. Мы должны укреплять эту организацию, чтобы они могли выполнять эту работу более эффективно."
 JAP_sea_state_general_mobilization_law:0 "Закон о государственной общей мобилизации"
 JAP_sea_state_general_mobilization_law_desc:0 "Мы обратили внимание на то, что нужно поставить национальную экономику на военные рельсы, чтобы не отставать в развитии вооружений. Благодаря этому новому закону мы можем получить государственный контроль над гражданскими организациями и профсоюзами, национализацию стратегических отраслей промышленности, контроль над ценами и возможность навязывать нормирование там, где это необходимо."
 JAP_sea_state_general_mobilization_law_tt:0 "Отключает способность идти к §Y$closed_economy$§! Несмотря на то, что §YНейтралитет§!"
 JAP_issue_the_ten_commandments_for_marriage:0 "Десять заповедей о браке"
 JAP_issue_the_ten_commandments_for_marriage_desc:0 "Наши чиновники придумали новый лозунг «Будь плодотворным и размножайся» в рамках своей новой кампании по увеличению количества людей, которые хотят стать более успешными. [ROOT.GetAdjective] Это связано с относительно низким количеством населения по сравнению со многими нашими противниками. Мы должны поддержать эту инициативу."
 JAP_enact_religious_organizations_law:0 "Законодательство о религиозных организациях"
 JAP_enact_religious_organizations_law_desc:0 "Для того, чтобы направить внимание нашего народа на правильные вещи и обеспечить его непоколебимую поддержку для достижения цели. [ROOT.GetAdjective] Судьба, мы должны принять закон, который даст государственную власть над всеми религиозными организациями в стране."
 JAP_new_order_movement:0 "Движение нового порядка"
 JAP_new_order_movement_desc:0 "Мы должны сформировать национальную организацию во внутренних делах по образцу одной партии на Западе, чтобы мобилизовать нацию для войны с колониальными державами и предотвратить коммунизм, отвергая современный капиталистический путь, который начался с Реставрации Мэйдзи. Эта проблема сейчас более актуальна, чем когда-либо, так как если мы не пройдем через нее в ближайшее время, мы можем пропустить автобус."
 JAP_sea_tripartite_pact:0 "Предложить трехсторонний пакт"
 JAP_sea_tripartite_pact_desc:0 "По мере того, как наши враги объединяются против нас, задача победить их становится более сложной. Мы должны обратиться к другим правительствам с аналогичными целями, чтобы мы могли участвовать в некотором сотрудничестве."
 JAP_sea_mil_tech_coop_with_germany:0 "Военное сотрудничество с Германией"
 JAP_sea_mil_tech_coop_with_germany_desc:0 "Нам нужны более совершенные технологии, чтобы объединить мир под одной крышей. Германия является для нас не только историческим партнером в технологических разработках, но и обладает достаточными военными технологическими достижениями, которые были бы чрезвычайно полезны для наших военных усилий. Мы должны следить за получением этих схем, независимо от стоимости!"
 JAP_imperial_rule_assistance_association:0 "Ассоциация помощи трону"
 JAP_imperial_rule_assistance_association_desc:0 "Из-за угроз как внутри страны, так и за рубежом, а также раскола в гражданском правительстве мы должны создать Тайсэй Йокусанкай, чтобы ввести государственническую, парафашистскую политическую систему с целью удаления секционализма и фракционности из политики и экономики, создания тоталитарного однопартийного государства для того, чтобы максимизировать эффективность нашей общей военной доктрины."
 JAP_form_the_yokusan_sonendan:0 "Формирование Yokusan Sonendan"
 JAP_form_the_yokusan_sonendan_desc:0 "Для того чтобы защитить суверенитет нашей страны, нам нужно больше людей, которые не только готовы за нас бороться, но и принимают участие в домашней охране для оказания помощи в вопросах гражданской обороны под руководством официальных местных властей. С этой целью мы должны сформировать элитное военизированное молодежное отделение Ассоциации содействия имперскому правлению, «Йокусан Сонедан»."
 JAP_integrate_the_great_japan_youth_party:0 "Вступила в Великую молодёжную партию Японии"
 JAP_integrate_the_great_japan_youth_party_desc:0 "Великая молодёжная партия Японии, националистическая молодёжная организация по образцу немецких молодёжных движений, ещё не полностью находится под нашим контролем и действует как независимая третья сторона при полковнике Кингоро Хашимото. Мы должны обуздать их и поставить под контроль Тайсэй Йокусанкай."
 JAP_sea_national_defense_state:0 "Государство национальной обороны"
 JAP_sea_national_defense_state_desc:0 "[ROOT.GetLeader] Шинтаисей провозгласил Японию государством национальной обороны, в котором каждый мужчина, женщина и ребенок должны быть мобилизованы для защиты нации. В соответствии с Законом о национальной мобилизации, правительство также получило абсолютную власть над активами страны. Благодаря этому Империя сможет просуществовать вечно!"
 JAP_gain_national_defense_state_remove_total_mob_tt:0 "§RУдалить§! §Y$tot_economic_mobilisation$§!. получать прибыль §Y$national_defense_state$§!."
 JAP_formalize_the_tonarigumi:0 "Формализовать Tonarigumi"
 JAP_formalize_the_tonarigumi_desc:0 "Соседские ассоциации существовали неофициально в течение довольно долгого времени, помогая в распределении нормированных товаров, распределении государственных облигаций, борьбе с пожарами, общественном здравоохранении, гражданской обороне, распространении пропаганды духовной мобилизации, информировании Токко о политическом диссидентстве и наблюдали за побережьями за подозрительной деятельностью. Мы должны их формализовать, чтобы мы могли выделять больше средств этим группам."
 JAP_formalize_the_tonarigumi_tt:0 "Разблокировать решения на §YОрганизация Tonarigumi§! В наших предметах"
 JAP_ichioku_isshin:0 "Ичиоку Ишин"
 JAP_ichioku_isshin_desc:0 "Как гласит один из лозунгов Тайсэй Йокусанкай: [ROOT.GetAdjective] Люди на самом деле «Сто миллионов, одно сердце». Хотя все наши люди являются индивидуальными подданными Императора, все они стоят вместе как одна единая сущность, и их сердца и умы едины."
 JAP_issue_the_senjinkun_military_code:0 "Издать Военный кодекс Сеньинкуна"
 JAP_issue_the_senjinkun_military_code_desc:0 "Военный код «Инструкции для поля боя» должен быть выдан каждому. [ROOT.GetAdjective] Для того, чтобы подготовить их к грядущим годам конфликта. Им предстоит обучить военному уставу, боевой готовности, эсприт де корпус, сыновнему благочестию, а также почитанию синто ками и кокутай. Никогда не живи, чтобы испытать стыд как заключенный, честь перед сдачей!"
 cost_reduced_last_stand_2:0 "Позволяет использовать §YПоследняя позиция§! способность командовать при значительно сниженной стоимости, а также продлевать ее продолжительность за счет §G3§! дни\n"
 JAP_issue_the_shinmin_no_michi_manifesto:0 "Манифест «Shinmin no Michi»"
 JAP_issue_the_shinmin_no_michi_manifesto_desc:0 "Наших людей нужно учить тому, как надо вести себя с предметами. Это будет сделано через идеологический манифест, направленный на людей, чтобы объяснить в ясных выражениях, что от них ожидается «как от народа и нации». Выдача такого манифеста будет находиться в ведении Министерства образования."
 JAP_sea_greater_east_asian_co_properity_sphere:0 "Сфера совместного процветания Большой Восточной Азии"
 JAP_sea_greater_east_asian_co_properity_sphere_desc:0 "Мы должны сформировать союз в Азии, чтобы обеспечить экономическую самодостаточность и сотрудничество между государствами-членами, а также противостоять влиянию западного империализма и советского коммунизма. Конечно, это эффективный инструмент пропаганды для обеспечения нашей гегемонии на континенте."
 JAP_CHI_pact_is_active_flag:0 " Китайско-японский альянс вступил в силу"
 JAP_unlock_east_asia_occupation_law_tt:0 "Разблокировать оккупационное законодательство в §Yазиатский§! Государства:\n"
 JAP_sea_greater_east_asian_co_properity_sphere_tt:0 "становится §G25%§! Дешевле освободить и марионетку §Yазиатский§! и §Yокеанский§! штатов."
 JAP_sea_greater_east_asian_co_properity_sphere_2_tt:0 "Разблокировать решения на §YСоздать марионеточные режимы§! В Юго-Восточной Азии"
 JAP_expand_japan_manchukuo_economic_bloc:0 "Экономический блок Японии и Маньчжоу-Го"
 JAP_expand_japan_manchukuo_economic_bloc_desc:0 "Мы должны взять на себя инициативу по созданию экономического блока между нами и нашими подданными, чтобы поддержать нашу экономику и обеспечить достаточное количество стратегических материалов, таких как железо, уголь, хлопок и соль."
 JAP_develop_the_yen_bloc:0 "Развивайте блок Yen"
 JAP_develop_the_yen_bloc_desc:0 "Мы должны сделать еще один акцент на экономических аспектах Сферы совместного процветания Большой Восточной Азии. Экономики Азии должны быть интегрированы, и все должны принять йену в качестве своей валюты. Этого можно достичь, продолжая развитие японского и китайского йенского блока, в то же время совершенствуя его."
 JAP_develop_the_yen_bloc_tt:0 "Разблокировать решения на §YИнтеграция экономики§! нашего §YАзиатские союзники§!"
 JAP_east_asia_development_board:0 "Совет по развитию Восточной Азии"
 JAP_east_asia_development_board_desc:0 "Создание Коэна поможет координировать политику правительства Китая, направленную на спонсирование промышленного и коммерческого развития в Китае, чтобы повысить поддержку японского правления на оккупированных территориях. Он также может быть использован в качестве инструмента обеспечения рабочих для наших шахт и военной промышленности."
 JAP_east_asia_development_board_tt:0 "Разблокировать решения, чтобы начать §YПромышленные проекты§! в наших союзниках"
 JAP_ministry_of_greater_east_asia:0 "Министерство Большой Восточной Азии"
 JAP_ministry_of_greater_east_asia_desc:0 "Создав Дайтоасо, мы сможем более эффективно управлять заморскими территориями, полученными в Тихом океане, а также координировать создание и развитие Сферы совместного процветания Большой Восточной Азии."
 JAP_the_flying_geese:0 "Летающие гуси"
 JAP_the_flying_geese_desc:0 "Технологическое развитие в Юго-Восточной Азии может быть обусловлено только нашим собственным развитием, и азиатские страны будут догонять Запад как часть региональной иерархии, где производство товарных товаров будет непрерывно перемещаться из более развитых стран в менее развитые. Так же, как гуси в V-образии, мы проложим путь для азиатского развития!"
 JAP_greater_east_asia_railroad:0 "Железная дорога Большой Восточной Азии"
 JAP_greater_east_asia_railroad_desc:0 "Наши ведущие инженеры придумали идею железной дороги, связывающей Японию с континентальной Азией и Европой, включая туннель или мост, соединяющий нашу страну с нашим корейским владением. Получив эту идею от Южно-Маньчжурской железной дороги, наши скоростные поезда отправятся из Токио в Рангун и далее в Тегеран. Пусть наша империя просуществует вечно!"
 JAP_greater_east_asia_railroad_tt:0 "Каждое государство, контролируемое нами или нашими союзниками, с меньшим количеством §Y2 Инфраструктура§! Выиграет §G1§! §Yинфраструктура§!"
 JAP_promote_pan_asianism:0 "Поощрение паназиатского"
 JAP_promote_pan_asianism_desc:0 "Мечта о едином азиатском государстве сейчас ближе к осуществлению, чем когда-либо прежде, благодаря подвигу наших храбрых солдат и инициативам, предпринятым в рамках Сферы совместного процветания Большой Восточной Азии. Раз и навсегда западным народам будет показано, что Азия — это не просто регион, которым они могут воспользоваться, а регион, который будет стоять на ногах даже с величайшими империями в их самых смелых представлениях."
 JAP_promote_pan_asianism_tt:0 "Разблокировать решения на §Yинтегрировать§! Наши развитые азиатские субъекты с целью §YОбъединяя Азию§! в одном государстве"
 JAP_tojos_premiership:0 "Премьер-министр Тодзё"
 JAP_tojos_premiership_desc:0 "Учитывая нынешнюю ситуацию, крайне важно выбрать премьер-министра, который сможет сплотить ИДЖ за собой и возглавить как военного лидера, так и гражданского. Таким образом, генерал Хидэки Тодзё будет выбран, чтобы привести нацию к славе."
 JAP_tojos_premiership_tt:0 "Китайское государство не является"
 JAP_yamamotos_premiership:0 "Премьер-министр Ямамото"
 JAP_yamamotos_premiership_desc:0 "Учитывая нынешнюю ситуацию, будет крайне важно выбрать премьер-министра, который сможет сплотить МСЯ за собой и возглавить как военного лидера, так и гражданского. Таким образом, адмирал Исороку Ямамото будет выбран, чтобы привести страну к славе."
 JAP_yamamoto_shot_down_flag:0 " Ямамото был сбит и убит."
 JAP_the_crysanthemum_throne:0 "Хризантема Трона"
 JAP_the_crysanthemum_throne_desc:0 "Фракции внутри наших вооруженных сил слишком много ссорятся и не могут прийти к соглашению о том, кого продвигать на пост следующего премьер-министра. Поскольку ситуация нестабильна, императору было бы разумно вмешаться и взять ситуацию под прямой контроль."
 JAP_solidify_tohokai_rule:0 "Укрепить правило Тохокай"
 JAP_solidify_tohokai_rule_desc:0 "С восхождением Накано на премьер-министр, фракция Тохокай в Имперской ассоциации содействия правилам стала самой большой. Теперь у нас есть возможность по-настоящему укрепить правление в рамках Общества Востока и обеспечить роль Накано. [ROOT.GetAdjective] Политика на ближайшие годы!"
 JAP_national_defense_brotherhood:0 "Братство национальной обороны"
 JAP_national_defense_brotherhood_desc:0 "Чтобы финансировать наши военные усилия, Нобусуке Киши и Хидеки Тодзё разработали план для Гококу Дошикай, политической организации, которая лучше координирует финансовые стратегии страны и промышленные инициативы. Однако эта пара довольно противоречива, и многие вопросы могут лежать в картах Братства национальной обороны."
 JAP_supreme_council_for_direction_of_war:0 "Верховный Совет по ведению войны"
 JAP_supreme_council_for_direction_of_war_desc:0 "Наше правительство осознало, что нам необходимо быстро провести конференцию по связям между имперским генеральным штабом и правительством, увидев острую необходимость укрепления координации между государственными делами и командованием. Возможно, это приведет нас к победе."
 JAP_found_the_boeitai:0 "Найден Бойтай"
 JAP_found_the_boeitai_desc:0 "Поскольку оборонительная война на наших собственных землях становится все более реалистичной, мы должны создать своего рода Корпус обороны, который может быть быстро мобилизован для защиты наших Родных островов в случае вторжения противника. В их число также войдут лица, которые обычно не несут ответственности за военную службу по японской системе призыва."
 JAP_found_the_boeitai_tt:0 "Разблокирует способность набирать §YВолонтерский боевой корпус ополченцев§! На родных островах"
 JAP_advance_one_hundred_million_fireballs:0 "Прогресс, сто миллионов огненных шаров"
 JAP_advance_one_hundred_million_fireballs_desc:0 "Ассоциация содействия имперскому правлению разработала лозунг «Продвижение, сто миллионов огненных шаров», который будет использоваться для выражения гнева народа по отношению к Западу и растущего боевого духа. Должны быть принесены жертвы, чтобы уничтожить наших врагов, тогда наше население обязательно сложит свои жизни за Империю!"
 JAP_advance_one_hundred_million_fireballs_tt:0 "Этот дух исчезнет, если мы опустимся ниже. §Y40%§! Стабильность"
 JAP_joshi_teishin_tai:0 "Мобилизировать [ROOT.GetAdjective] женщины"
 JAP_joshi_teishin_tai_desc:0 "Женский добровольческий корпус будет создан, чтобы дать женщинам возможность служить Империи до брака, заставляя их выполнять трудовые обязанности во время войны. Благодаря этому больше граждан смогут мобилизоваться для помощи в наших отраслях военного времени."
 JAP_the_metal_collection_order:0 "Заказ на коллекцию металла"
 JAP_the_metal_collection_order_desc:0 "У нашей страны быстро заканчиваются стратегические материалы, в том числе обычные металлы. Поэтому мы должны принять Имперское Постановление No. 667, с целью сбора металлов, принадлежащих государственному и частному секторам, в целях восполнения обострения военного положения и нехватки материалов."
 JAP_form_the_dai_nippon_fujinkai:0 "Оригинальное название: Dai Nippon Fujinkai"
 JAP_form_the_dai_nippon_fujinkai_desc:0 "Ямаути Сачико вызвался создать Великую Японскую Женскую Ассоциацию, предложенное объединение трех других националистических Женских Ассоциаций, с предлагаемой целью мобилизации женщин на военную работу; Укреплять моральный дух военных, поддерживать бережливый образ жизни, чтобы сохранить ресурсы страны, поднять уровень производства и поддержать военных."
 JAP_found_the_air_defense_surveilance_corps:0 "Найден корпус наблюдения ПВО"
 JAP_found_the_air_defense_surveilance_corps_desc:0 "Чтобы обеспечить раннее обнаружение атак вражеских самолетов, мы должны мобилизовать наших гражданских лиц для службы на наблюдательных постах ПВО, установленных по всей стране, а также для обнаружения самолетов противника на ранней стадии и доведения их до соответствующих органов власти. Это будет организовано путем принятия закона о противовоздушной обороне."
 JAP_fund_propaganda_films:0 "Фонд Пропаганды Фильмы"
 JAP_fund_propaganda_films_desc:0 "Наш флот предложил увеличить инвестиции в киноиндустрию, чтобы мотивировать наших людей продолжать борьбу. Таким образом, они заключили контракт с Лабораторией движущихся картин на производство анимационного пропагандистского фильма, который усиливает повествование о IJN, одновременно бросая IJA под автобус в процессе."
 JAP_fund_propaganda_films_tt:0 "Обновление The §Y[ROOT.GetImportOrDomesticFilmIndustry]§! Решение"
 JAP_fund_propaganda_films_2_tt:0 "§Y[ROOT.GetImportOrDomesticFilmIndustry]§! Можно взять дополнительное время"
 JAP_the_eternal_kingdom:0 "Вечная Империя"
 JAP_the_eternal_kingdom_desc:0 "Япония — это страна, которой правит божественный император, и как таковая она защищена богами. С их помощью наша божественная страна бессмертна и будет оставаться сильной до конца вечности. Да здравствует Его Величество Император, да здравствует Великая Японская Империя!"
 JAP_the_eternal_kingdom_tt:0 "Этот дух исчезнет, если мы достигнем §Y50%§! Сдаться прогрессу"
 JAP_revere_the_emperor_destroy_the_traitors:0 "Почитание императора, уничтожение предателей."
 JAP_revere_the_emperor_destroy_the_traitors_desc:0 "День, который мы планировали, наконец-то наступил. Наши войска взяли под свой контроль Токио, и начались переговоры с императором, чтобы убедить его поддержать наше движение, несмотря на его изначально опасающееся отношение. Наконец, мы сможем избавить нашу страну от западного упадка и вернуть славу старых путей!"
 JAP_authorize_aid_to_ethiopia:0 "Разрешить помощь Эфиопии"
 JAP_authorize_aid_to_ethiopia_desc:0 "У нашей фракции были контакты с [ETH.GetAdjective]s в течение многих лет, кульминацией которого является то, что мы раскачиваем правительство для помощи в модернизации. [ETH.GetNameDef]. Теперь они оказались под ударом западной державы. Мы должны немедленно оказать им помощь!"
 JAP_establish_the_gunbatsu:0 "Создать Gunbatsu"
 JAP_establish_the_gunbatsu_desc:0 "Для того чтобы реорганизовать правительство, мы должны сначала демонтировать его структуру и перестроить с нуля. Для этого уже началась подготовка к созданию военной клики, которая поможет императору в управлении страной как замкнутым внутренним кругом."
 JAP_grand_army_purge:0 "Великая Армейская Чистка"
 JAP_grand_army_purge_desc:0 "Чтобы обеспечить абсолютную власть над военными, мы должны избавить страну от предателей, которые попытаются поддержать идеи олигархии Мэйдзи и которые будут противостоять нам на нашем пути к власти, включая презренных офицеров Тосейхи, которые стремились контролировать императора ради своей выгоды. С помощью любых необходимых средств военные должны быть очищены от этих плохих актеров!"
 JAP_grand_army_purge_tt:0 "§RЧистка§! различные §YЧлены Toseiha§! и офицеры §YСамурайская линия§! и §GПоощрять§! §YМолодые офицеры§! кто принимал участие в государственном перевороте Известные командиры, которые §RУдаленный§! включаю:\n"
 JAP_remove_the_weeds_from_the_crop:0 "Удалить сорняки из урожая"
 JAP_remove_the_weeds_from_the_crop_desc:0 "Как ясно заявил наш главный политический теоретик Садао Араки: Если вы не удалите сорняки, хороший урожай будет разрушен. Таким образом, мы должны устранить эти сорняки в правительстве, которые будут препятствовать прогрессу нашей нации и навредят нашей душе, продавая нашу страну иностранным капиталистам и агентам. Время для сорняков уже началось!"
 JAP_can_no_longer_manually_promote_civ_government_tt:0 "Мы больше не сможем §RРучно одобряет§! тот §YГражданская фракция§!"
 JAP_sea_the_showa_restoration:0 "[JAP_sea_the_showa_restoration_key]"
 JAP_sea_the_showa_restoration_key_emperor_showa:0 "Восстановление Шоуа"
 JAP_sea_the_showa_restoration_key_emperor_genka:0 "Реставрация Генки"
 JAP_sea_the_showa_restoration_desc:0 "[JAP_sea_the_showa_restoration_desc_key]"
 JAP_sea_the_showa_restoration_emperor_showa_desc:0 "Наконец-то эпоха либеральной демократии Тайсё подошла к концу. Вновь нацию возглавит небольшая группа квалифицированных людей, поддерживающих сильного императора. Только через это наша страна наконец обретет спасение."
 JAP_sea_the_showa_restoration_emperor_genka_desc:0 "Наконец-то эпоха либеральной демократии Тайсё подошла к концу. Вновь нацию возглавит небольшая группа квалифицированных людей, поддерживающих сильного императора. Только через это наша страна наконец обретет спасение."
 JAP_kodoha_the_emperor_cooperated_flag:0 "§YИмператор Сёва§! Мы решили сотрудничать с Кодохой."
 JAP_hirohito_has_been_killed_flag:0 "§YХирохито§! умерший"
 JAP_emperor_hirohito_has_abdicated_flag:0 "§YХирохито§! Отрекся от престола"
 JAP_emperor_hirohito_under_house_arrest_flag:0 "§YХирохито§! был помещен под §YДомой Арест§!"
 JAP_yasuhito_is_the_current_regent_or_emperor_flag:0 "§YЯсухито§! Вознесся на трон"
 JAP_nobuhito_is_the_current_regent_or_emperor_flag:0 "§YНобухито§! Вознесся на трон"
 JAP_yasuhito_takes_up_the_throne_tt:0 "§YЯсухито§! будет заменен §YХирохито§! Имперское влияние"
 JAP_nobuhito_takes_up_the_throne_tt:0 "§YНобухито§! будет заменен §YХирохито§! Имперское влияние"
 JAP_an_ode_to_showa_restoration:0 "Ода для реставрации шоу"
 JAP_an_ode_to_showa_restoration_desc:0 "Морской офицер Миками Таку написал Оду Восстановления Шоуа, потрясающую тему для нашего движения, которая делает сильный призыв к естественным и религиозным образам. Теперь, когда мы восстановили власть и возвели на престол императора Хирохито и отменили либеральную демократию Тайсё, мы должны сделать это вторым национальным гимном."
 JAP_ikki_kitas_state_socialist_ideals:0 "Государственные социалистические идеалы Икки Кита"
 JAP_ikki_kitas_state_socialist_ideals_desc:0 "Автор и политический философ Икки Кита очень влиятельна и связана с нашим движением. Он много раз критиковал капиталистические модели, будучи самопровозглашенным социалистом. Мы должны принять его идеи и реорганизовать экономику, чтобы она более точно соответствовала этому идеалу."
 JAP_oppose_the_zaibatsus:0 "Противостоять Зайбацусу"
 JAP_oppose_the_zaibatsus_desc:0 "Крупнейшие корпорации нашей страны уже давно обладают беспрецедентной политической и экономической мощью. Мы должны напомнить им, что они по-прежнему подчиняются желаниям императора, и обеспечить, чтобы их жадная капиталистическая политика не могла продолжать загрязнять душу нашей нации."
 JAP_oppose_the_zaibatsus_tt:0 "Когда дух высовывается:\n"
 JAP_give_it_your_all_for_the_emperor:0 "Отдай все за императора!"
 JAP_give_it_your_all_for_the_emperor_desc:0 "The [ROOT.GetAdjective] Человек — трудолюбивый человек, который горячо верит в нашего великого императора. Мы должны пропагандировать это и продвигать хороший труд и тяжелую работу как основную часть нашей работы. [ROOT.GetAdjective] общества."
 JAP_give_it_your_all_for_the_emperor_tt:0 "Разблокировать решения для строительства §G1§! §YГражданская фабрика§! в начальных состояниях с уровнем §Y4§! или выше §Yинфраструктура§!. \n§RТакое решение может быть принято только один раз в каждом штате.§!"
 JAP_revitalize_rural_areas:0 "Оживить сельские районы"
 JAP_revitalize_rural_areas_desc:0 "Многие из молодых офицеров нашего движения происходят из бедных и сельских семей. Для того чтобы сохранить их поддержку, мы должны стремиться остановить депопуляцию сельской местности и оживить сельские районы."
 JAP_nationalize_western_corporations:0 "Национализация западных корпораций"
 JAP_nationalize_western_corporations_desc:0 "Жадные западные капиталисты пришли в нашу страну, чтобы эксплуатировать наш народ и ресурсы, оставив после себя шрамы в национальной душе, на исцеление которых уйдет много времени. Мы должны немедленно уничтожить корпорации и национализировать их фабрики, даже если это означает разозлить Запад."
 JAP_ally_the_league_of_blood:0 "Лига Крови Ally the League of Blood"
 JAP_ally_the_league_of_blood_desc:0 "Радикальный буддийский проповедник ничиренизма Нисшо Иноуэ основал Лигу Крови с намерением устранить богатых бизнесменов и либеральных политиков, в том, что стало известно как Инцидент Корпуса Крови. После освобождения мы должны установить с ним контакт, поскольку он придерживается общих идеалов."
 JAP_integrate_the_kenkokutai:0 "Интеграция Kenkokukai"
 JAP_integrate_the_kenkokutai_desc:0 "Общество Национального Фонда — антикоммунистическая организация, сильно подверженная влиянию национал-социализма Мотоюки Такабатаке, стремящаяся к созданию подлинного народного государства, основанного на единодушии народа и императора. Мы должны завербовать их в наше правительство, поскольку у нас с ними схожие цели."
 JAP_contact_the_masterless_samurai:0 "Связаться с ронинами"
 JAP_contact_the_masterless_samurai_desc:0 "Rōninkai - ультранационалистическая антидемократическая политическая группа, которая разделяет многих своих членов с аналогичными организациями, такими как Общество Темного океана и Общество Черного Дракона. Основанное Танакой Хироюки в 1908 году, это тайное общество сейчас влияет на большинство наших правых политиков. Мы должны связаться с ними и установить связи между ними и нашим правительством."
 JAP_contact_former_sakurakai_members:0 "Свяжитесь с бывшими членами Sakurakai"
 JAP_contact_former_sakurakai_members_desc:0 "Общество цветения вишни было ультранационалистическим тайным обществом, основанным молодыми офицерами в 1930 году, которое было распущено после инцидента с императорскими цветами. Их цель состояла в том, чтобы реорганизовать государство по тоталитарным милитаристским линиям посредством военного переворота, если это необходимо. Теперь, когда нам это удалось, мы должны обратиться к некоторым из этих бывших членов нашего правительства."
 JAP_the_great_spiritual_evil:0 "Великое духовное зло"
 JAP_the_great_spiritual_evil_desc:0 "Принятие законов о сохранении мира было хорошим первым шагом на нашем пути к прекращению влияния коммунистического вырождения на умы наших людей, но нам еще предстоит проделать большую работу. Кокутай также находится под угрозой иностранной социалистической мысли, и мы должны более активно подходить к тому, чтобы остановить это от разрушения нашей нации."
 JAP_strike_down_the_enemy_of_the_people:0 "Уничтожить врага народа"
 JAP_strike_down_the_enemy_of_the_people_desc:0 "Великий враг народа [ROOT.GetAdjective] Люди — это коммунизм, и этот факт никогда не изменится. Она принципиально не может сосуществовать с нашей нацией, и как таковая только одна из них может быть оставлена стоящей в конце окончательной войны между восточной и западной цивилизациями."
 JAP_strike_down_the_enemy_of_the_people_tt:0 "получать прибыль §YПриложение§! Цель войны против любого §YАзиатский коммунист§! Нация. Текущие цели:"
 JAP_prepare_for_the_final_war:0 "Готовьтесь к финальной войне"
 JAP_prepare_for_the_final_war_desc:0 "Технология определяет историю войны, а история войны определяет историю. Скоро будет последняя война, которую решит воздушная война. Как и в будущем, самолеты смогут летать на большие расстояния, чтобы наносить удары непосредственно по столицам других стран. Чтобы избежать этого, мы должны заняться новой командной экономикой, приняв однопартийное государство национальной обороны."
 JAP_indoctrination_in_the_military_academy:0 "Индоктринация в Военной академии"
 JAP_indoctrination_in_the_military_academy_desc:0 "Важно, чтобы радикальные элементы в армии не поворачивались против правительства, как это было раньше. Мы должны обеспечить высокую дисциплину, и чтобы каждый человек клялся в верности Императору, а не какой-либо группе или фракции!"
 JAP_every_kodoha_member_tt:0 "Каждый §YСочувствующий Кодоха§!:"
 JAP_sea_supremacy_of_will:0 "Превосходство воли"
 JAP_sea_supremacy_of_will_desc:0 "Самое современное оборудование бесполезно без свирепого человека, чтобы им владеть, и свирепость может превратить самый простой камень в самое смертоносное оружие. Только благодаря духу Элана, культу наступления, можно выиграть войны."
 JAP_tennoheika_banzai:0 "Теннохейка Банзай!"
 JAP_tennoheika_banzai_desc:0 "Заряд Банзая является воплощением [ROOT.GetAdjective] Боевой дух. В рамках военной учебной программы каждый человек будет знать боевой клич и обучаться тактике штыкового заряда. Используя их, наши люди не будут жить как военнопленные, а вместо этого выйдут в пламени славы. Да здравствует Его Величество Император!"
 JAP_a_truly_righteous_army:0 "Истинно праведная армия"
 JAP_a_truly_righteous_army_desc:0 "The [ROOT.GetAdjective] Имперская армия борется не только за завоевания или славу. Она борется за своего императора, свою нацию, свои идеалы и свой народ. Каждый солдат должен знать об этом и понимать, что все, что он делает при исполнении служебных обязанностей, отражается на императоре и его народе, и что для Его Величества любая жертва стоит того."
 JAP_supremacy_of_the_kempeitai:0 "Превосходство Кемпейтай"
 JAP_supremacy_of_the_kempeitai_desc:0 "Наши «законники» возьмут на себя роль Токко, более лояльного к старому режиму. Кемпейтай будет возглавлен национальной полицией и улучшит наши способности по борьбе с повстанцами, контрразведкой и подавлением инакомыслия."
 JAP_sonnou_joui:0 "Сонно Джой!"
 JAP_sonnou_joui_desc:0 "Мы вновь оправдали идеалы могущественного императора периода Бакуматсу и готовы противостоять иностранному империализму. Так же, как когда-то был изгнан сёгунат Токугава, мы изгоним всех, кто выступает против правления великого императора. Почитай императора, изгони варваров! Пришло время вернуть нашу небесную судьбу."
 JAP_sonnou_joui_tt:0 "Этот дух возрождается, когда мы захватываем столицу страны, которую мы провозгласили. §YЮвелирное копье застряло§!, §RЕсли в данный момент активен§!."
 JAP_subdue_the_kwantung_army:0 "Подчинить Квантунскую армию"
 JAP_subdue_the_kwantung_army_desc:0 "Квантунская армия долгое время была занозой на нашей стороне, не прислушиваясь к авторитету нашей военной клики. Мы должны обеспечить, чтобы они полностью подчинялись нам посредством тактических поощрений и запугивания. В свое время Садао Араки станет новым главой Квантунской армии."
 JAP_subdue_the_kwantung_army_tt:0 "§GПокорять§! тот §YКвантунская армия§! и гарантирует, что они не могут действовать независимо от пожеланий нашего правительства"
 JAP_subdue_the_kwantung_army_2_tt:0 "Несколько §YКвантунская армия§! Генералы понижены в должности и уволены с действительной службы:"
 JAP_hasten_the_integration_of_taiwan:0 "Ускорение интеграции Тайваня"
 JAP_hasten_the_integration_of_taiwan_desc:0 "Наши интеграционные усилия в Тайване идут хорошо, с несколькими основными неудачами. В свое время остров станет такой же неотъемлемой частью Японии, как и Рюкю. Однако нам следует поторопиться, если мы хотим в ближайшее время перенаправить наше внимание на другие регионы."
 JAP_integrate_the_government_general:0 "Интеграция Генерального правительства"
 JAP_integrate_the_government_general_desc:0 "Автономия генерал-губернатора Чосена была большой ошибкой. Они позволили движениям сопротивления существовать слишком долго, разрушая нашу промышленность в этом районе. Мы должны напрямую вмешаться и поставить корейские территории под контроль центрального правительства."
 JAP_integrate_the_government_general_tt:0 "Разблокировать решения на §YИнтеграция корейских государств§! Если они имеют достаточно высокий уровень"
 JAP_align_the_concordia_association:0 "Совместим с Ассоциацией Конкордия"
 JAP_align_the_concordia_association_desc:0 "Ассоциация «Конкордия», политическая партия, находящаяся под нашим контролем в Маньчжурии, придерживается идеалов паназиатства и создания многонационального национального государства и создания структуры, которая постепенно заменит военное правление над Маньчжоу-го гражданским контролем. Мы должны предложить объединение наших двух народов для продвижения паназиатского дела."
 JAP_integrate_the_great_empire_of_manchuria:0 "Интеграция Великой Маньчжурской империи"
 JAP_integrate_the_great_empire_of_manchuria_desc:0 "С Ассоциацией Конкордии на нашей стороне, Пуйи и его сторонники не обладают достаточной властью, чтобы помешать нам прекратить их автономию. Наконец-то пришло время объединить наши народы под властью одного истинного Императора!"
 JAP_MAN_accepted_our_proposal_for_integration:0 "§Y[MAN.GetNameDefCap]§! Мы приняли наше предложение об объединении"
 JAP_integrate_the_great_empire_of_manchuria_tt:0 "Разблокировать решения на §YИнтеграция маньчжурских государств§! Если они имеют достаточно высокий уровень"
 JAP_embrace_kokutai:0 "Обнять Kokutai"
 JAP_embrace_kokutai_desc:0 "Наша национальная идентичность, сущность и характер слишком долго игнорировались и разбавлялись прошлыми правительствами и близки к тому, чтобы быть потерянными ветром времени. Мы должны обеспечить, чтобы каждый [ROOT.GetAdjective] Гражданин понимает, что его долг – жить в соответствии с нашими традициями, и жить в соответствии со своими традициями."
 JAP_empower_the_shogun:0 "Помогите сёгуну"
 JAP_empower_the_shogun_desc:0 "Император должен оставаться в более церемониальной роли, с сильными посредниками, которые действуют от его имени. Это, безусловно, позволит слову императора нести дальше и шире."
 JAP_empower_the_emperor:0 "Уполномочить императора"
 JAP_empower_the_emperor_desc:0 "Время для фигуристов давно прошло, и сам император должен взять под прямой контроль государство. Только тогда наша Империя сможет противостоять западным империалистам."
 JAP_a_worthy_succssor_of_meiji:0 "Достойный преемник Мэйдзи"
 JAP_a_worthy_succssor_of_meiji_desc:0 "Теперь, когда было проведено нечто похожее на вторую реставрацию Мэйдзи, наш император снова стал самым могущественным человеком в стране. Может быть, было бы разумно жить в соответствии с идеалами этой национальной революции и попытаться модернизировать наши отрасли промышленности и науки, чтобы принести новую жизнь. [ROOT.GetAdjective] Возрождение."
 JAP_the_art_of_warfare:0 "Искусство войны"
 JAP_the_art_of_warfare_desc:0 "В истории Восточной Азии есть много великих тактиков и воинов, но мало кто приближается к мастеру стратегу Сунь Цзы. Возможно, у него есть кое-что, чему мы можем научиться, чтобы со временем наши планы стали более прочными."
 cost_reduced_staff_office_planning:0 "Позволяет использовать §YПлан управления персоналом§! способность командовать при значительно сниженной стоимости, а также продлевать ее продолжительность за счет §G2§! дни\n"
 JAP_the_imperial_colors:0 "Императорские цвета"
 JAP_the_imperial_colors_desc:0 "В честь наших соотечественников, которые пытались и не смогли в 1931 году свергнуть правительство так же, как мы это делаем сейчас, мы должны превратить 21 октября в национальный праздник, в котором мы развеваем императорский флаг и помним жертвы, которые они принесли во имя нашего императора."
 JAP_utilize_our_polish_friendship:0 "Используйте нашу польскую дружбу"
 JAP_utilize_our_polish_friendship_desc:0 "Наш народ поддерживает хорошие отношения с поляками еще со времен Российской империи, когда мы принимали в свои ряды сосланных в Сибирь людей. С тех пор мы обменивались разведданными. [SOV.GetNameDef] И у них было общее соперничество с народом. Мы должны оформить с ними оборонительный пакт, чтобы мы оба чувствовали себя защищенными от медведя."
 JAP_return_to_sakoku_ron:0 "Возвращение в Сакоку-рон"
 JAP_return_to_sakoku_ron_desc:0 "Наша нация прекратила свою изоляцию только благодаря коммодору Перри и его семье. [USA.GetAdjective] Дипломатия канонерских лодок. Видя, что внешнее влияние развращает и разрушает душу нашей нации, мы должны начать вторую эру изоляции."
 JAP_japanese_supremacy_faction:0 "Японская сфера"
 JAP_eth_is_invited_to_faction_tt:0 "§Y[ETH.GetNameDefCap]§! Приглашаем в нашу фракцию"
 JAP_the_enemy_of_our_enemy:0 "Враг нашего врага"
 JAP_the_enemy_of_our_enemy_desc:0 "The [SOV.GetSovietThreatName] Необходимо устранить угрозу нашим северным границам. Мы должны начать подготовку к войне с [SOV.GetNameDef]. Лучший способ сделать это — укрепить наши отношения с Россией. [GER.GetNameDef]Которые, по нашим сообщениям, готовятся к войне против [SOV.GetNameDef]."
 JAP_societal_bushido:0 "Общественный бусидо"
 JAP_societal_bushido_desc:0 "Генерал Садао Араки связал древний кодекс самурая с идеями, подобными европейскому фашизму, чтобы сформировать философскую основу своей идеологии, которая связывает императора, народ, землю и мораль как единое целое. С этой целью мы должны продвигать кодекс Бушидо как то, чего всегда должен придерживаться каждый хороший гражданин."
 JAP_politicize_the_education_system:0 "Политика в системе образования"
 JAP_politicize_the_education_system_desc:0 "Армия уже давно контролирует национальную систему образования, но недостаточно сделано для того, чтобы радикализировать молодежь и должным образом присоединиться к нашему делу. Мы должны больше инвестировать в нашу политическую идеологию и увеличить финансирование системы образования."
 JAP_the_spirit_of_the_imperial_nation:0 "Дух имперской нации"
 JAP_the_spirit_of_the_imperial_nation_desc:0 "Для того, чтобы направить внимание нашего народа на правильные вещи и обеспечить его непоколебимую поддержку для достижения цели. [ROOT.GetAdjective] Судьба, мы должны продвигать Кокутай в каждой святыне и святилище. [ROOT.GetLeader] В храме в Токио."
 JAP_propagandize_the_nihon_shoki:0 "Пропаганда Нихон Шоки"
 JAP_propagandize_the_nihon_shoki_desc:0 "Хроники Японии являются важной частью для объяснения нашей истории и детализации наших мифов. Мы должны обеспечить, чтобы это преподавалось в школах, и чтобы дети узнали о связи между завоеваниями Джимму в то время и нашей будущей судьбой."
 JAP_the_yamato_spirit:0 "Дух Ямато"
 JAP_the_yamato_spirit_desc:0 "The [ROOT.GetAdjective] Сердца и умы людей как единое целое связаны Душой Ямато, которая пронизывает наше общество. Мы должны обеспечить, чтобы все наши граждане знали о нашей прошлой славе и знали, что нужно сделать, чтобы вернуться к нашему традиционному образу жизни."
 JAP_children_of_the_sun:0 "Дети Солнца"
 JAP_children_of_the_sun_desc:0 "Не только королевской семьи, но и [ROOT.GetAdjective] Сами люди — это дети солнца. Великая богиня Аматерасу однажды подарила нам эту землю, и мы должны быть благодарны за это. Пришло время отплатить за то, что она нам дала!"
 JAP_the_footsteps_of_jimmu:0 "Шаги Джимму / The Footsteps of Jimmu"
 JAP_the_footsteps_of_jimmu_desc:0 "Наш легендарный основатель, император Джимму, начал военную экспедицию из Хюги недалеко от внутреннего моря Сето, захватил Ямато и установил его в качестве своего центра силы. Он начал Великую Восточную экспедицию, которая значительно расширила наши территории, руководствуясь Ятагарасу, богом вороны. Как этот божественный воин однажды победил во имя богов, так и мы будем."
 JAP_yatagarasus_guidance:0 "Руководство Ятагарасу"
 JAP_yatagarasus_guidance_desc:0 "Трехногий бог ворона Ятагарасу руководил Джимму в его великом завоевании Ямато и Нары, как часть божественного вмешательства в человеческие дела. Поскольку мы сами нуждаемся в руководстве, мы должны назвать наши новые системы в честь этого бога руководства."
 JAP_the_jeweled_spear_has_struck:0 "Ювелирное копье застряло"
 JAP_the_jeweled_spear_has_struck_desc:0 "Копье с небесными драгоценностями когда-то использовалось богами генезиса Изанаги и Изанами, чтобы поднять первую сушу с моря. Так же, как когда-то они использовали посаженное копье, чтобы претендовать на новую землю, так и мы. Настало время увидеть, куда снова ударит небесное копье."
 JAP_the_jeweled_spear_has_struck_tt:0 "Разблокировать решение о претензиях §Yазиатский§! государства и получить §YВоргоалы§! против своих владельцев. Мы можем нацелиться на страну, чтобы претендовать на время, на которое нам нужно оккупировать все существующие заявленные государства, чтобы претендовать больше."
 JAP_hakko_ichiu:0 "Хакко Ичиу"
 JAP_hakko_ichiu_desc:0 "Весь мир должен быть объединен под одной крышей! У нас есть божественное право делать это под нашим правлением, как предписано в Нихон Шоки. Во время своего вознесения император Джимму провозгласил: «Я покрою восемь направлений и сделаю их своей обителью». Настало время, наконец, исполнить его желание!"
 JAP_hakko_ichiu_tt:0 "Разблокировать решения для интеграции §Yазиатский§! Государства, которые либо §Yпринадлежащий§! нами, или §YКонтролируемые и заявленные§! нами"
 JAP_embodying_empress_jinguu:0 "Императрица Джингу"
 JAP_embodying_empress_jinguu_desc:0 "Так же, как был убит муж императрицы Нагако, так же был убит и императрица Джингу. Она пошла на кампанию мести, а затем обратила свое внимание на обетованную землю. Через три года она победила своих врагов и вернулась триумфальной. Мы должны продолжить эту легенду и довести ее до конца."
 JAP_to_reach_princess_kaguya:0 "Добраться до принцессы Кагуи"
 JAP_to_reach_princess_kaguya_desc:0 "В Сказке о бамбуковом мусорщике, Кагуя-химэ, принцесса с Луны обнаруживается в виде младенца внутри стебля светящегося растения бамбука. В конце сказки Кагуя-химэ раскрывает свое небесное происхождение и возвращается на Луну. Теперь, когда технология доступна нам, мы должны сделать все возможное, чтобы снова достичь ее."
 JAP_to_rival_zheng_yi_sao:0 "Соперник Чжэн И Сао"
 JAP_to_rival_zheng_yi_sao_desc:0 "Чжэн И Сао была легендарным китайским пиратским лидером, действующим в Южно-Китайском море, будучи самой успешной женщиной-пиратом в истории. Мы должны жить и даже превзойти эту легенду во имя великой императрицы Нагако!"
 JAP_amaterasus_aramitama:0 "Оружие Арамитамы Аматерасу"
 JAP_amaterasus_aramitama_desc:0 "Одним из богов, которые помогали Джингу в ее кампаниях против корейских королевств, был жестокий дух Аматереасу, Цукисакаки Изу но Митама Амазакару Мукацухиме но Микото. Этот дух держал в себе великую силу Богини Солнца, которую мы должны стараться использовать для себя!"
 JAP_okadas_military_purge_speech:0 "Военная чистка речи Окады"
 JAP_okadas_military_purge_speech_desc:0 "На этот раз военные зашли слишком далеко. Если бесчисленных убийств и попыток свергнуть наше правительство не было достаточно, они теперь также стремятся использовать недавний инцидент, чтобы укрепить свою собственную власть и отобрать контроль над нашей страной у ее народа. Пришло время, чтобы Окада ясно дал понять, кто управляет государством, и принял меры, чтобы противостоять растущей военной мощи."
 JAP_okadas_military_purge_speech_tt:0 "§RЭто приведет к эскалации конфликта между правительством и военными, который может быть разрешен только путем отмены закона о сохранении мира!§!"
 JAP_ministry_of_commerce_and_industry:0 "Министерство торговли и промышленности"
 JAP_ministry_of_commerce_and_industry_desc:0 "Для того чтобы получить более полное представление о наших финансах, мы должны расширить Министерство торговли и промышленности и обеспечить, чтобы у них были все необходимые ресурсы для надлежащего выполнения своих задач."
 JAP_continue_takahashi_korekiyos_policies:0 "Продолжение политики Такахаси Корекиё"
 JAP_continue_takahashi_korekiyos_policies_desc:0 "Виконт Такахаси Корекиё спас нашу страну от Великой депрессии и гарантировал, что последствия этого больше не будут ощущаться в нашей экономике. Однако для достижения этой цели он сократил бюджет на военные финансы, что оказалось непопулярным шагом для многих. Мы должны идти по его стопам!"
 JAP_increase_armament_spending:0 "Увеличение расходов на вооружение"
 JAP_increase_armament_spending_desc:0 "Виконт Такахаси Корекиё, возможно, многое сделал для нашей экономики, но он оставил нас плохо подготовленными к грядущим войнам. Мы должны исправить этот факт и реинвестировать в нашу растущую военную промышленность."
 JAP_approach_mitsui:0 "Подход Мицуи"
 JAP_approach_mitsui_desc:0 "Mitsui zaibatsu восходит к периоду Эдо, в настоящее время являясь одной из крупнейших промышленных корпораций в нашей стране. Мы должны обеспечить их поддержку нашего правительства, чтобы мы могли наиболее эффективно использовать их услуги."
 JAP_reduce_zaibatsu_focus_cost_tt:0 "Принимать §Y$JAP_sea_guide_the_zaibatsus$§! или §Y$JAP_democratic_work_with_the_zaibatsus$§! Это позволит сократить время, затрачиваемое на §G35§! дней."
 JAP_approach_mitsubishi:0 "Подходит к Mitsubishi"
 JAP_approach_mitsubishi_desc:0 "Компания Mitsubishi была основана как судоходная компания в начале эры Мэйдзи. Расширившись до большинства промышленных секторов, они сегодня контролируют большую часть всех военных производств в нашей стране. Мы должны обеспечить их поддержку нашему правительству, чтобы мы могли наиболее эффективно использовать их возможности."
 JAP_approach_sumitomo:0 "Подход к Сумитомо"
 JAP_approach_sumitomo_desc:0 "Sumitomo zaibatsu уходит своими корнями в книжный магазин в Киото, хотя переработка меди сделала компанию известной. Сегодня они специализируются на добыче полезных ископаемых, а также банковском деле. Мы должны обеспечить их поддержку нашему правительству, чтобы мы могли наиболее эффективно использовать их активы."
 JAP_approach_yasuda:0 "Подход Ясуда"
 JAP_approach_yasuda_desc:0 "Yasuda zaibatsu берет свое начало в эпоху Мэйдзи и занимается банковским делом с момента своего основания. Являясь структурой банка Yasuda, они теперь неразрывно связаны со всеми финансовыми секторами нашей страны. Мы должны обеспечить их поддержку нашему правительству, чтобы мы могли наиболее эффективно использовать их огромные богатства."
 JAP_fund_the_riken_institute:0 "Фонд Института RIKEN"
 JAP_fund_the_riken_institute_desc:0 "Основанный в 1917 году в эпоху Тайсё, Институт физических и химических исследований в настоящее время контролируется концерном Riken, который в настоящее время управляет около 121 заводами и 63 компаниями. При виконте Масатоши Окочи мы должны стремиться к дальнейшему расширению института, чтобы мы могли проводить там нашу программу атомных исследований."
 JAP_fund_the_riken_institute_tt:0 "Если $JAP_zaibatsu_faction$ По крайней мере, $JAP_imperial_influence_tier_3$Также выигрывают §G1§! §YЦентр ядерных исследований§!"
 JAP_build_the_nishotaki_and_miyanaka_dams:0 "Постройте плотины Нишотаки и Миянака"
 JAP_build_the_nishotaki_and_miyanaka_dams_desc:0 "Новые заводы и сооружения в нашей стране требуют больше электроэнергии, чем мы в настоящее время способны производить по доступным ценам. Мы должны создать новые гидроэлектростанции, чтобы мы могли генерировать электроэнергию, не сжигая наши драгоценные запасы угля."
 JAP_establish_synthetic_fuel_joint_venture:0 "Создание совместного предприятия по производству синтетического топлива"
 JAP_establish_synthetic_fuel_joint_venture_desc:0 "С 20-х годов у нас есть совместные предприятия с Германией по созданию центров добычи синтетических ресурсов угля и нефти. Мы должны расширить наши горизонты и стремиться к расширению этого сотрудничества с западными державами, чтобы мы могли наконец стать самодостаточными."
 JAP_establish_synthetic_fuel_joint_venture_tt:0 "Если §YЗападный майор§! У страны есть §Yгарантированный§! или имеет по меньшей мере §Y75§! Мнение §Y[ROOT.GetNameDef]§!, [ROOT.GetNameDef] получает дополнительное $cat_synth_oil$ Технологический бонус и §Y$synthetic_refinery$§!"
 JAP_establish_nippon_hassoden:0 "Установить Nippon Hassoden"
 JAP_establish_nippon_hassoden_desc:0 "Для того, чтобы усилить государственный контроль над национальным электроснабжением, а также для возможности регулирования использования, мы должны создать Японскую компанию по производству и передаче электроэнергии для регулирования электроэнергетики. Этого можно достичь путем слияния существующих электроэнергетических компаний."
 JAP_new_industrial_city_development_policy:0 "Новая политика развития индустриального города"
 JAP_new_industrial_city_development_policy_desc:0 "Национальный комитет по планированию земель разработал план создания новых городов, сосредоточенных вокруг военных объектов снабжения армии и флота, заводов по производству боеприпасов и связанных с ними объектов, а также крупномасштабного городского планирования для поддержки этих отраслей. Мы должны инвестировать в эту инициативу."
 JAP_establish_housing_corporation:0 "Создание жилищной корпорации"
 JAP_establish_housing_corporation_desc:0 "Для того чтобы обеспечить жильем всех нуждающихся по всей стране, мы должны создать корпорацию с целью строительства десятков тысяч единиц жилья для рабочих и многих объектов аренды для плотников и граждан."
 JAP_central_agricultural_association:0 "Центральной сельскохозяйственной ассоциации"
 JAP_central_agricultural_association_desc:0 "Наши многочисленные разрозненные сельскохозяйственные организации должны быть объединены в одну, если мы хотим устранить узкие места в наших цепочках поставок. Для этого мы должны поручить Сенгоку Котаро создать Центральную сельскохозяйственную ассоциацию в соответствии с Законом о сельскохозяйственных организациях."
 JAP_the_five_great_cities:0 "Пять великих городов"
 JAP_the_five_great_cities_desc:0 "Городам Киото, Осака, Йокогама, Кобе и Нагоя были даны специальные обозначения, которые предоставляют им различные специальные положения, недоступные обычным городам, чтобы помочь в их процессе индустриализации и урбанизации, с конечной целью стать особыми городами, независимыми от префектур. Мы должны увеличить наши инвестиции в эту инициативу."
 JAP_resource_security:0 "Безопасность ресурсов"
 JAP_resource_security_desc:0 "Наши амбициозные цели стать полностью самодостаточными, наконец, принесли свои плоды. Наша нация обильно разбогатела природными ресурсами, которые только еще больше укрепят нас, сделав нас неудержимыми!"
 JAP_ship_management_committee:0 "Комитет по управлению судами"
 JAP_ship_management_committee_desc:0 "С недавней ратификацией Ордена по контролю за морскими перевозками в военное время мы можем санкционировать создание специальной корпорации, отвечающей за управление судоходной отраслью, для контроля над ней и сотрудничества в осуществлении национальной политики в отношении судоходства, чтобы максимизировать весь потенциал судоходной отрасли в военном времени."
 JAP_convoy_production_cost_tt:0 "[JAPGetConvoyProductionCostBonusText]"
 JAP_ship_management_committee_tt:0 "§Y$convoy_1$§!:\n   £production_cost Издержки производства: §G-15.00%§!."
 JAP_danganressha:0 "План поезда-пули"
 JAP_danganressha_desc:0 "Министерство железных дорог одобрило так называемый план Данганресша, в котором ширококолейные железные дороги должны быть проложены рядом со стандартными колеями, по которым транспортные поезда смогут передвигаться так же быстро, как пуля. Пионер железной дороги Ясудзиро Шима и его сын пообещали помочь в разработке этого плана."
 JAP_ministry_of_colonial_affairs:0 "Министерство колониальных дел"
 JAP_ministry_of_colonial_affairs_desc:0 "Начав свою деятельность как Колонизация Хоккайдо, министерство уже прошло долгий путь. Мы должны расширить его обязанности, с тем чтобы он мог надлежащим образом управлять Наньо, Чосеном, Карафуто, Канто и Тайванем. В один прекрасный день все эти земли будут называться японскими!"
 JAP_manchuria_five_year_plan:0 "Промышленный пятилетний план Маньчжурии"
 JAP_manchuria_five_year_plan_desc:0 "В то время как наши острова мало пригодны для использования, наши материковые владения — нет. То, что мы не можем построить сами, мы можем построить на материке. Начнем масштабную программу индустриализации [MAN.GetNameDef]."
 JAP_establish_manchuria_airplane_manufacturing_company:0 "Создать компанию Manchuria Airplane"
 JAP_establish_manchuria_airplane_manufacturing_company_desc:0 "Для того, чтобы производить наше оборудование ближе к местам, где добываются ресурсы для них, Nakajima самолёт Company предложила открыть дочернюю компанию под нашим наблюдением в Маньчжурии, которую они в настоящее время называют Manshū. Мы должны поддержать эту блестящую идею."
 JAP_eastern_road_and_steel_expansion:0 "Восточная дорога и стальные расширения"
 JAP_eastern_road_and_steel_expansion_desc:0 "Для того чтобы способствовать расширению наших шахт и производств в Маньчжурии, мы должны основать Корпорацию развития восточных дорог. Как только это будет достигнуто, в Тьечханци, Удаоцзяне и Ширенгоу будут созданы горнодобывающие станции, а в Дализи и Цидаогу будут созданы офисы по добыче железной руды."
 JAP_sea_promote_japanese_settlement:0 "Продвижение японского поселения"
 JAP_sea_promote_japanese_settlement_desc:0 "Поселив в Маньчжурии свой народ, мы можем увеличить рабочую силу и тем самым создать более подходящие места для заводов. Люди, переезжающие туда, также могут производить сельскохозяйственные товары, которые могут быть отправлены обратно на родные острова."
 JAP_construct_the_sui_ho_dam:0 "Постройте плотину Суй-хо"
 JAP_construct_the_sui_ho_dam_desc:0 "Чтобы обеспечить достаточное количество энергии для наших отраслей промышленности в Маньчжурской провинции Ляонин, мы должны построить гравитационную плотину Суйхо. Наши инженеры разработали планы по созданию крупнейшей во всей Азии компании, для чего планируется заключить контракт с компанией Yalu Hydroelectric Company и компанией Pyeongbuk Railway."
 JAP_the_shuilikeng_power_plant:0 "Электростанция Shuilikeng"
 JAP_the_shuilikeng_power_plant_desc:0 "Наше развитие Тайваня идет по плану, хотя вопрос выработки электроэнергии становится все более актуальным. Это было частично облегчено строительством гидроэлектростанций, таких как Менпайтанская электростанция. Мы должны вычеркнуть страницу из книг наших прошлых инженеров и продолжить строительство этих плотин и станций по всему острову."
 JAP_develop_the_south_seas_mandate:0 "Разработать мандат на Южное море"
 JAP_develop_the_south_seas_mandate_desc:0 "Японский мандат на управление островами Южных морей, предоставленный нам Лигой Наций после Великой войны, является обширной и в значительной степени неизведанной территорией, созревшей для эксплуатации. Если мы будем развивать эти регионы и специализировать их на предоставлении нашим людям их богатства, правительство Наньо, которое управляет регионом, может даже повлиять на местных жителей, чтобы они должным образом интегрировались в наше государство."
 JAP_build_up_korean_industries:0 "Построение корейской промышленности"
 JAP_build_up_korean_industries_desc:0 "Мы должны прилагать концентрированные усилия для создания промышленной базы на Корейском полуострове, особенно в областях тяжелой промышленности и боеприпасов. В конце концов, они будут неоценимы в любых предстоящих войнах с Китаем или западными странами. Эта политика была изначально предложена Казушиге Угаки, и мы должны продолжать идти по этому пути."
 JAP_increase_agricultural_export:0 "Увеличение экспорта сельскохозяйственной продукции"
 JAP_increase_agricultural_export_desc:0 "С тех пор, как мы приобрели эту территорию, Корея служила житницей нашей империи. Мы должны активизировать наши усилия по расширению этой области, с тем чтобы их продукты питания могли экспортироваться по всему миру."
 JAP_hydroelectric_dams_in_korea:0 "Гидроэлектростанции"
 JAP_hydroelectric_dams_in_korea_desc:0 "Индустриализация и электрификация Кореи резко прекратятся, если мы не вмешаемся и не сделаем что-то с ситуацией. Мы должны построить новые гравитационные плотины по всему региону, и наши инженеры в гидроэлектростанции Хань Ривер уже разработали сложные планы строительства плотины, которую они называют плотиной Хвачхон."
 JAP_prepare_for_peninsular_warfare:0 "Подготовьтесь к войне на полуострове"
 JAP_prepare_for_peninsular_warfare_desc:0 "В случае, если мы окажемся в состоянии войны и отступим, Корейский полуостров, вероятно, будет нашим последним сдерживающим фактором на континенте. Мы должны готовиться к тому, чтобы удержать этот регион, если когда-нибудь случится такой наихудший сценарий."
 JAP_establish_the_japanese_korean_army:0 "Расширение японской корейской армии"
 JAP_establish_the_japanese_korean_army_desc:0 "С 1904 года Чосэн-гун действовал как гарнизон в Корее, но не видел много боев за пределами вторжения в Маньчжурию в 1931 году. Мы должны отменить договоры, которые связывают нашу корейскую мухафазу в попытке расширить эту армию, чтобы ее можно было использовать в качестве надлежащей боевой силы."
 JAP_increase_crop_yields:0 "Увеличить урожайность"
 JAP_increase_crop_yields_desc:0 "Острова Южных морей имеют большое количество кокосового ореха, что является потенциально прибыльным урожаем. Мы должны поощрять монополии, которые сочетают частную инициативу с государственным капиталом. Кроме того, заключив контракт с Наньё Кохацу, можно выращивать сахарные плантации, сахарные фабрики, бананы, ананасы, таро, маниок, кофе и другие тропические сельскохозяйственные продукты, поставив острова на один уровень с Тайванем с точки зрения производства."
 JAP_improve_agricultural_output:0 "Улучшение сельскохозяйственного производства"
 JAP_improve_agricultural_output_desc:0 "Промышленное производство на Тайване должно превысить сельскохозяйственное производство на острове. Хотя это выгодно для нашей промышленности, это далеко не идеально, поскольку сельскохозяйственный экспорт из Тайваня имеет большое значение для того, чтобы наши люди были счастливы и поставляли наши вооруженные силы. Мы должны исправить это немедленно!"
 JAP_upgrade_the_oriental_development_company:0 "Расширение компании Восточного развития"
 JAP_upgrade_the_oriental_development_company_desc:0 "В настоящее время УВК имеет девять действующих филиалов, действующих почти на всех наших заморских территориях. Они играют решающую роль в руководстве прогрессом регионов в направлении, которое удовлетворяет нашим амбициям, и направляют развитие промышленности и сельского хозяйства на достижение эффективности. Поэтому для улучшения наших колоний мы должны стремиться к расширению этой компании и обеспечению ее ресурсами, в которых она нуждается."
 JAP_the_imperial_defense_plan:0 "[JAP_the_imperial_defense_plan_key]"
 JAP_the_imperial_defense_plan_imperial:0 "Имперский план обороны"
 JAP_the_imperial_defense_plan_national:0 "План национальной обороны"
 JAP_the_imperial_defense_plan_desc:0 "Чтобы защитить государство, мы должны сформулировать новый план проактивной обороны. Все войны будут выиграны внезапными крупномасштабными решающими ударами, избегая затяжных войн и заставляя наших врагов поддаваться нашим требованиям."
 JAP_first_strike_principle_tt:0 "Когда §Y[ROOT.GetNameDef]§! §RОбъявляет войну§! на §Yсоседняя страна§!или соседней страны субъекта, получить §Y90 дней§!:\n §Y$JAP_first_strike_principle_dm$§!\n $MODIFIER_ATTACK_BONUS_AGAINST_A_COUNTRY$: §G+10.0%§!\n  $MODIFIER_BREAKTHROUGH_BONUS_AGAINST_A_COUNTRY$: §G+10.0%§!"
 JAP_kantai_kessen_tt:0 "Когда §Y[ROOT.GetNameDef]§! §RОбъявляет войну§! В стране с §Y$capital_ship$§!Прибыль для §Y180 дней§!:\n §Y$JAP_kantai_kessen_dm$§!\n  Нападение на судно со стороны государства: §G+10.0%§!\n  Скорость игры против страны: §G+10.0%§!"
 JAP_first_strike_blocked_due_to_kwantung_army_tt:0 "Из-за Квантунской армии §RНезапланированное наступление§!Мы не получим от §Y$JAP_first_strike_principle_dm$§! бонус"
 JAP_divert_naval_guns_to_the_army:0 "Передать флотское вооружение армии"
 JAP_divert_naval_guns_to_the_army_desc:0 "Для того чтобы сухопутные войска могли использовать тяжелое вооружение, такое как железнодорожные орудия и танки, мы должны перенаправить часть производства морских орудий в армию."
 JAP_divert_naval_guns_to_the_army_tt:0 "создавать §Y2 $railway_gun_equipment_1$§! единицы в [ROOT.capital.GetName]."
 JAP_expand_kawagoe_army_arsenal:0 "Армейский арсенал Кавагоэ"
 JAP_expand_kawagoe_army_arsenal_desc:0 "Наша оружейная промышленность в настоящее время изо всех сил пытается идти в ногу с производственными требованиями, чтобы гарантировать, что наша армия способна сражаться на современном поле боя. Мы должны расширить арсенал армии Кавагоэ в Сайтаме, чтобы повысить наши шансы на соответствие предложения спросу."
 JAP_reform_the_army:0 "Реформировать армию"
 JAP_reform_the_army_desc:0 "Граф Хисаичи Тераучи, генерал, быстро поднявшийся в ряды наших военных, предложил пересмотреть наши армейские доктрины. Он считает устаревшими старые доктрины о наступлении, утверждая, что на полях будущих сражений будет доминировать более подвижный тип войны. Мы должны прислушаться к его совету и убедиться, что мы не отстаем от времени."
 JAP_rely_on_supremacy_of_the_will:0 "Полагаться на пехотные наступления"
 JAP_rely_on_supremacy_of_the_will_desc:0 "Генерал Хидэки Тодзё однажды предложил, чтобы войны были выиграны посредством решительных упреждающих ударов и сражений через славные массовые обвинения и превосходство воли. Мы должны поддержать эту идею, так как она хорошо устраивает нашу нынешнюю военную доктрину."
 JAP_rethink_armor_doctrine:0 "Переосмыслить доктрину брони"
 JAP_rethink_armor_doctrine_desc:0 "Хисаичи Тераучи пришел к ужасному выводу. Наши нынешние конструкции бронетехники и сухопутных машин плохо оснащены для борьбы с чем-либо, кроме легкой пехоты, и будут уничтожены, если они когда-нибудь столкнутся с западной броней. Мы должны как можно скорее исправить эту ошибку!"
 JAP_foreign_tank_modernization_cooperation:0 "Инициатива по модернизации иностранных танков"
 JAP_foreign_tank_modernization_cooperation_desc:0 "Чтобы победить Запад, мы должны сначала изучить их планы и научиться преодолевать их. Мы должны стремиться к дружбе с одной из западных держав, чтобы в конечном итоге мы могли производить танки, которыми они будут восхищаться."
 JAP_foreign_tank_modernization_cooperation_tt:0 "А. §YЗападный майор§! У страны есть §Yгарантированный§! или находится в §Yфракция§! с §Y[ROOT.GetNameDef]§!"
 JAP_foreign_tank_modernization_cooperation_2_tt:0 "Разблокировка MIO-точки §Y$JAP_mio_trait_foreign_research_and_development_cooperation$§! Для всех §YТанковые дизайнеры§!. §RОднако это может быть применено только к одному из них.§!."
 JAP_domestic_tank_modernization_program:0 "Программа модернизации отечественных танков"
 JAP_domestic_tank_modernization_program_desc:0 "Мы должны учиться на своих ошибках и обеспечить, чтобы наша броня выдержала противотанковое оружие, иначе наши силы будут обречены на провал. Это должно быть сделано не на основе замыслов западных держав, а на изобретательность великих. [ROOT.GetAdjective] людей."
 JAP_the_ultimate_tank:0 "Идеальный танк"
 JAP_the_ultimate_tank_desc:0 "Наши инженеры придумали блестящую идею. Вместо того, чтобы выпускать огромное количество небольших транспортных средств, мы должны стремиться создавать металлических бегемотов, которые могут сокрушить наших врагов с минимальной поддержкой. Их первый проект - это транспортное средство, которое они называют танком O-I, и мы должны начать работу над тем, чтобы воплотить это видение в реальность как можно скорее."
 JAP_the_ultimate_tank_tt:0 "\nОдин раз §Y$super_heavy_tank_chassis$§! Технология исследуется:\n"
 JAP_prepare_the_northern_front:0 "Подготовить Северный фронт"
 JAP_prepare_the_northern_front_desc:0 "Квантунская армия жаждет вступить в правильную борьбу с [SOV.GetNameDef] Долгое время, но не хватало военной инфраструктуры, которая необходима для успеха. Мы должны инвестировать в расширение автомобильных и железных дорог в Маньчжурии, поэтому мы можем в конечном итоге добиться успеха в управлении транспортными средствами. [SOV.GetAdjective]Вышел из Сибири."
 JAP_enact_the_national_conscription_law:0 "Закон о национальной воинской обязанности"
 JAP_enact_the_national_conscription_law_desc:0 "Принято решение о том, что каждый [ROOT.GetAdjective] Человека разыскивают и призывают в армию. Мы должны направить рекрутеров даже в самые отдаленные деревни, чтобы мы могли быстро привлечь больше людей."
 JAP_instill_the_spirit_of_bushido:0 "Вдохновляйте дух Бушидо"
 JAP_instill_the_spirit_of_bushido_desc:0 "Благодаря государственному синтоизму и традиционным идеям морали, известным как бусидо, мы сможем привить людям необходимость жертвовать собой на благо государства и императорской семьи."
 JAP_instill_the_spirit_of_bushido_tt:0 "Позволяет тактика: §Y$tactic_grand_banzai_charge$§!"
 JAP_adopt_new_assault_doctrine:0 "Принять новую доктрину нападения"
 JAP_adopt_new_assault_doctrine_desc:0 "Генерал Шунроку Хата предложил новый способ решительно победить противника в бою. Используя большое количество артиллерии, мы должны быть в состоянии обстрелять противника, и тогда нам нужно будет только зарядить деморализованные и разрушенные остатки, чтобы заключить сделку."
 JAP_develop_lethal_infantry_equipment:0 "Разработка летального пехотного оборудования"
 JAP_develop_lethal_infantry_equipment_desc:0 "Армия дала нам понять, насколько устаревшим является оружие, которым они владеют в настоящее время, и просит что-то сделать по этому поводу. Мы должны вкладывать большие средства в разработку более современной пехотной техники, чтобы никогда больше не проиграть войну."
 JAP_develop_lethal_infantry_equipment_tt:0 "Если $JAP_army_faction$ По крайней мере, $JAP_imperial_influence_tier_3$Также выигрывают:\n"
 JAP_develop_sophisticated_artillery_equipment:0 "Разработка сложного артиллерийского оборудования"
 JAP_develop_sophisticated_artillery_equipment_desc:0 "Армия дала нам понять, насколько устаревшим является оружие, которым они владеют в настоящее время, и просит что-то сделать по этому поводу. Мы должны вкладывать большие средства в разработку более современных артиллерийских орудий, чтобы нам не пришлось заряжать противника до тех пор, пока он практически не сдастся."
 JAP_expand_the_irago_proving_ground:0 "Расширение доказательной базы Ираго"
 JAP_expand_the_irago_proving_ground_desc:0 "Чтобы лучше доминировать на поле боя, мы должны расширить испытательный раунд «Ираго», где мы тестируем новое и экспериментальное оружие. Там мы сможем разработать средства ведения войны, которые приведут всех наших врагов к пятке."
 JAP_sea_mountaineers:0 "Создание горных полков"
 JAP_sea_mountaineers_desc:0 "Наша армия поняла, что она не сможет проникнуть в горные районы южного и западного Китая, если не будет сделано что-то радикальное. Поэтому они просили создать специальные альпинистские бригады, чтобы они могли руководить атакой и проникать в тыл противника."
 JAP_jungle_adaptation:0 "Адаптация джунглей"
 JAP_jungle_adaptation_desc:0 "Наша армия поняла, что она не сможет проникнуть в покрытые джунглями районы Бирмы и Большой Индонезии, если не будет сделано что-то радикальное. Поэтому они потребовали создания специальных дивизий в джунглях, чтобы они могли вести атаку и проникать в вражеские линии."
 JAP_army_weapons_administration_headquarters:0 "Административный штаб армейского оружия"
 JAP_army_weapons_administration_headquarters_desc:0 "Для объединения производства, снабжения, исследований, разработок, испытаний и обучения армейского оружия мы должны создать штаб-квартиру Управления армейским оружием. Делая это, наши отрасли, надеюсь, получат шанс против таких гигантов, как [SOV.GetNameDef] и [USA.GetNameDef]."
 JAP_army_weapons_administration_headquarters_tt:0 "Если $JAP_army_faction$ По крайней мере, $JAP_imperial_influence_tier_3$Также выигрывают §G1§! §YЗемельный объект войны§!"
 JAP_pivot_towards_defensive_measures:0 "Разворот к оборонительным мерам"
 JAP_pivot_towards_defensive_measures_desc:0 "Война развивалась не обязательно в нашу пользу. Становится все более правдоподобным, что наши враги высаживаются на родных островах, с чем мы в настоящее время плохо подготовлены для борьбы. Мы должны решить эту проблему, чтобы не испытать столетие унижения нашего собственного производства!"
 JAP_strenghten_the_supply_lines:0 "Укрепление линий снабжения"
 JAP_strenghten_the_supply_lines_desc:0 "Наши линии снабжения растянуты тоньше, чем мы можем справиться, и наши войска несут потери в результате. Мы должны разрешить эту ситуацию, если мы хотим, чтобы наши успехи продолжались, поскольку время быстро истекает, прежде чем наши войска будут колебаться и падать."
 JAP_ni_go_nuclear_project:0 "Ядерный проект Ni-Go"
 JAP_ni_go_nuclear_project_desc:0 "Армейский комитет создал экспериментальный проект в RIKEN, который они назвали проектом Ni-Go. Его цель состоит в том, чтобы отделить уран-235 путем термической диффузии, игнорируя альтернативные методы, такие как электромагнитное разделение, газообразная диффузия и центробежное разделение. Надеюсь, что в скором времени мы сможем научиться использовать это в военных целях."
 JAP_establish_showa_aircraft_idnsutry:0 "Создание Showa самолёт Industry"
 JAP_establish_showa_aircraft_idnsutry_desc:0 "Мы получили запрос на разрешение на создание Сёва Хикоки Когё Кабушики-гайша в Акисиме, Токио. Эта компания хочет строить военные самолеты для обеспечения наших вооруженных сил. Мы должны утвердить их запрос и заставить их немедленно начать работу по обеспечению нас авиационной техникой."
 JAP_develop_new_fighters:0 "Разработать новые истребители"
 JAP_develop_new_fighters_desc:0 "Новый дизайн Mitsubishi вполне может оказаться самым способным палубным истребителем, разработанным на сегодняшний день. Непревзойденная маневренность в сочетании с приличной дальностью означает, что конструкция, скорее всего, прослужит нам долгие годы. Мы должны немедленно приступить к созданию прототипов и производству."
 JAP_modern_bombers:0 "Современные бомбардировщики"
 JAP_modern_bombers_desc:0 "Модернизированные тактические бомбардировщики являются ключом к поддержке наших военных на поле боя. Поэтому мы должны приказать и армии, и флоту начать разработку самолетов, способных тактическое обеспечение наших сухопутных войск."
 JAP_improve_the_type_91_aerial_torpedo:0 "Усовершенствованная воздушная торпеда Type 91"
 JAP_improve_the_type_91_aerial_torpedo_desc:0 "Мы должны стремиться к разработке торпед, специализирующихся на ударах по судам на мелководье, чтобы улучшить наши возможности нанесения ударов по портам. Эти воздушные торпеды будут вдохновлены нашей самой передовой торпедой, Длинным Кольцом, и принесут нам плоды победы быстрее, чем мы могли когда-либо мечтать."
 JAP_7075_aluminium_alloy:0 "7075 Алюминиевый сплав"
 JAP_7075_aluminium_alloy_desc:0 "Одни только дальность не принесет нам никакой пользы, если наши модели не смогут конкурировать с противником, когда они прибудут. Мы должны производить ремесла с превосходной ловкостью, чтобы они никогда не были перехитрины. Наши инженеры из Mitsubishi разработали новый алюминиевый сплав, который произведет революцию в строительстве самолетов."
 JAP_escort_efficiency:0 "Инвестиции в аэросферу"
 JAP_escort_efficiency_desc:0 "Мы должны сохранять превосходство над нашими врагами во всех областях, включая воздушную войну, чтобы наши бомбардировщики и транспорты не были перехвачены и сбиты. Для этого необходимы модернизированные истребители, а также ключ к будущим победам."
 JAP_sea_sturdy_aircraft:0 "Стойкий самолет"
 JAP_sea_sturdy_aircraft_desc:0 "Гибкость и дальность являются важными, но не единственными факторами, определяющими наш успех в небе. Если бы наши самолеты были тонкими, как бумага, мы бы проиграли еще до начала войны. Поэтому мы должны инвестировать в разработку более прочных планеров и более толстой брони, чтобы мы могли доминировать в небе на долгие годы."
 JAP_sea_sturdy_aircraft_tt:0 "Уменьшает вероятность целенаправленных воздушных атак на определенных персонажей."
 JAP_sea_long_operational_range:0 "Длинный операционный диапазон"
 JAP_sea_long_operational_range_desc:0 "Как бы мы ни желали бы быстрых побед, войны не так легко выиграть только путем прямых военных столкновений. Расстояния, связанные с войной на Тихоокеанском театре военных действий, огромны, и поэтому нам нужны модели, способные преодолеть эти расстояния, если мы хотим добиться успеха."
 JAP_project_z_bomber_project:0 "Проект Z Bomber"
 JAP_project_z_bomber_project_desc:0 "Столицы наших врагов находятся далеко от нас, что затрудняет достижение скорейшего решающего удара, необходимого для быстрого прекращения наших войн. Поэтому мы должны построить машины, способные достичь даже американского Восточного побережья, если это необходимо, и инвестировать в новые стратегические модели бомбардировщиков, которые могут уничтожить вражескую промышленность за линией фронта."
 JAP_adopt_new_air_doctrine:0 "Принять новую воздушную доктрину"
 JAP_adopt_new_air_doctrine_desc:0 "Теперь, когда мы столкнулись с врагами с теми же технологическими возможностями, что и мы сами, мы поняли, что мы также должны модернизировать наши боевые доктрины, чтобы идти в ногу со временем."
 JAP_the_divine_wind:0 "Божественный ветер"
 JAP_the_divine_wind_desc:0 "Камикадзе, тактика Специального ударного отряда, изменила самоубийственные атаки с импровизированной последней меры на устоявшуюся доктрину. С новыми самолетами, по сути пилотируемыми ракетами, эти атаки будут непреодолимыми."
 JAP_sea_unify_the_air_forces:0 "Объединить воздушные силы"
 JAP_sea_unify_the_air_forces_desc:0 "Слишком долго нас преследовали отдельные исследования и разработки авиации между армией и флотом. Мы должны объединить эти программы, чтобы обеспечить как единообразие вооружений, так и более эффективное использование наших ограниченных исследовательских ресурсов."
 JAP_sea_unify_the_air_forces_tt:0 "Разблокировка MIO-точки §Y$JAP_mio_trait_unified_research_and_development$§! Для всех §YПроектировщики самолетов§!. §RОднако это может быть применено только к одному из них.§!."
 JAP_sea_unify_the_air_forces_2_tt:0 "Заменить §Y$JAP_army_and_naval_air_services_dm$§! с §Y$JAP_japanese_airforce_dm$§!Эффективные изменения:"
 JAP_improved_radio_communications:0 "Улучшение радиосвязи"
 JAP_improved_radio_communications_desc:0 "Наши радиостанции в настоящее время находятся в ужасном состоянии, и в результате наши формирования часто распадаются из-за плохой связи и отсутствия сигнала в глубоких джунглях и на отдаленных островах. Мы должны модернизировать наше оборудование и построить новые радиовышки, чтобы это не продолжалось."
 JAP_combined_arms:0 "Комбинированное оружие"
 JAP_combined_arms_desc:0 "Координация наших воздушных и сухопутных сил является ключом к успеху. Чтобы обеспечить лучшую поддержку и очистить поле боя от любых препятствий, с которыми может столкнуться наша армия, мы должны инвестировать в тактику комбинированного вооружения, которая позволит нашим самолетам работать в тандеме с другими нашими филиалами."
 JAP_sea_jet_prototypes:0 "Имперское оружие No2"
 JAP_sea_jet_prototypes_desc:0 "Будущее авиации не за пропеллерами. Мы должны смотреть на реактивные двигатели для улучшения возможностей наших самолетов. Наши инженеры окрестили проект по созданию нового экспериментального самолета «Имперское оружие No2», модель которого получила название «Кикка»."
 JAP_rockets_development:0 "Ракетные разработки"
 JAP_rockets_development_desc:0 "У Хидео Ивакуро было много ярких идей относительно управляемых ракет класса «воздух-поверхность» и зенитных ракет класса «земля-воздух». Мы должны продвигать его идеи и развивать новые формы ракетостроения, которые смогут помочь нам в наших будущих победах."
 JAP_expand_hiratsuka_navy_arsenal:0 "Расширение арсенала боеприпасов ВМС Хирацуки"
 JAP_expand_hiratsuka_navy_arsenal_desc:0 "Основанный в 1905 году арсенал военно-морских боеприпасов Хирацука может быть значительно расширен. Они смогут специализировать различные заводы по проектированию и инжинирингу, включая пулеметные боеприпасы, морские артиллерийские снаряды, восстановление растворителей и производство нитроглицерина."
 JAP_expand_hiratsuka_navy_arsenal_tt:0 "Либо он покинул §YЛондонский военно-морской договор§!или какой-либо §YНа эскалаторе ссылаются§!"
 JAP_expand_navy_technical_department:0 "Расширить технический отдел флота"
 JAP_expand_navy_technical_department_desc:0 "Мы должны выпустить новые оценки размера увеличения для нашего флота, и, таким образом, верфи объектов, которые потребуются, чтобы добиться этого увеличения. Первым шагом к приведению наших объектов в соответствие с современными требованиями станет расширение технического отдела ВМФ."
 JAP_prepare_the_southern_front:0 "Подготовьте Южный фронт"
 JAP_prepare_the_southern_front_desc:0 "Война на Тихом океане будет в значительной степени связана с высадкой военно-морских сил. Специальные военно-морские десантные силы требуют расширения, если они должны быть в состоянии выполнить эту задачу. Наряду с этим будет целесообразно инвестировать в наших морских десантников, поскольку они смогут захватить стратегические места и острова до того, как наши основные силы доберутся до места."
 JAP_prepare_the_southern_front_tt:0 "Когда [ROOT.GetNameWithFlag] §RОбъявляет войну§! В стране, которая контролирует §YЮго-Восточная Азия§!:"
 JAP_focus_on_aircraft_carriers:0 "Сосредоточьтесь на авианосцах"
 JAP_focus_on_aircraft_carriers_desc:0 "Боевые корабли — это реликвии ушедшей эпохи. Мы должны смотреть в будущее, и будущее за авиацией. Авианосцы позволят нам проецировать эту воздушную мощь через Тихий океан."
 JAP_balanced_naval_approach:0 "Сбалансированный военно-морской подход"
 JAP_balanced_naval_approach_desc:0 "Мы не должны загонять себя в угол, если окажется, что против наших врагов неэффективны ни линкоры, ни авианосцы. Поэтому мы должны придерживаться сбалансированного военно-морского подхода и инвестировать в оба сектора."
 JAP_sea_battleship_initiative:0 "Инициатива линкор"
 JAP_sea_battleship_initiative_desc:0 "С нашими превосходными конструкциями линкоров нам требуется только одно решающее участие, чтобы решить военно-морскую войну. Мы должны обеспечить оптимизацию нашего боевого флота для решительного участия и обеспечения победы так же быстро, как ветер."
 JAP_sea_heavier_naval_guns:0 "Более тяжелые морские пушки"
 JAP_sea_heavier_naval_guns_desc:0 "Похоже, что наши противники вложили значительные средства в бронетехнику для своих военно-морских судов. Мы должны обеспечить, чтобы мы могли идти в ногу с их развитием и прокалывать их корпуса. С этой целью инвестиции в более тяжелые морские артиллерийские установки кажутся разумными."
 JAP_sea_bigger_better_yamato:0 "Броненосцы класса Цусима"
 JAP_sea_bigger_better_yamato_desc:0 "Поскольку мы не богаты ресурсами, мы должны обеспечить их наилучшее использование. Мы построим самые мощные линкоры, когда-либо поставленные на поверхность планеты, способные победить любого врага в лобовом бою. С этим наши враги преклонятся перед нами или перестанут существовать."
 JAP_yokosuka_naval_air_technical_arsenal:0 "Арсенал авиационной техники флота в Йокосуке"
 JAP_yokosuka_naval_air_technical_arsenal_desc:0 "Технический арсенал ВМС Йокосуки будет иметь ключевое значение в обеспечении самых современных самолетов для нашего нового авианосного флота. Он будет сосредоточен на создании лучших проектов, которые будут массово производиться такими компаниями, как Aichi kokuki, Kyūshū hikoki Kabushiki-kaisha и собираться в военно-морском арсенале Хиро."
 JAP_establish_the_mine_warfare_force:0 "Создать Силы противоминной войны"
 JAP_establish_the_mine_warfare_force_desc:0 "Мы обратили внимание на то, что западные страны используют морские мины в качестве средства контроля над морями. Мы должны следовать этим идеям, хотя и не без создания силы, которая также будет отвечать за отслеживание этих и минных тральщиков, когда это необходимо."
 JAP_akizuki_class_destroyers:0 "Разрушители класса Akizuki"
 JAP_akizuki_class_destroyers_desc:0 "Нам нужны высокопроизводительные многоцелевые платформенные корабли с сильными зенитными возможностями, чтобы назначать наши авианосные группы и боевые самолеты. Таким образом, наши инженеры приступили к работе над усовершенствованием эсминцев класса «Югумо» с новым классом, который они называют классом «Акидзуки»."
 JAP_form_the_kido_butai:0 "Оригинальное название: Kido Butai"
 JAP_form_the_kido_butai_desc:0 "Чтобы максимизировать наступательную ударную мощь, мы объединим самую большую концентрацию авианосцев, которую когда-либо видел мир, в одну боевую группу. Развивая доктрины, необходимые для проведения согласованных наступательных операций в этой форме, наши враги не будут иметь никаких шансов против нашего превосходства в морской авиации."
 JAP_form_the_kido_butai_tt:0 "Шансы на успех Перл-Харбора §Yрейд§! на §Y[USA.GetNameWithFlag]§! будет увеличиваться"
 JAP_nationalize_suzuka_naval_arsenal:0 "Национализация военно-морского арсенала Сузуки"
 JAP_nationalize_suzuka_naval_arsenal_desc:0 "Военно-морской арсенал Сузуки является производственным объектом для авиационных боеприпасов, легких вооружений и боеприпасов для военно-морского флота. Мы должны национализировать этот объект, чтобы мы могли контролировать его расширение и создать новые военно-морские ремонтные заводы на месте."
 JAP_nationalize_fujinagata_shipyards:0 "Национализировать верфи Fujinagata"
 JAP_nationalize_fujinagata_shipyards_desc:0 "Судостроительные заводы Fujinagata являются важным производителем судов и железнодорожных вагонов в Осаке, что имеет стратегическое значение для наших военных усилий. Для расширения мощностей и привлечения к ним большего количества рабочей силы мы должны стремиться национализировать эти верфи."
 JAP_naval_armaments_program:0 "Программа военно-морских вооружений"
 JAP_naval_armaments_program_desc:0 "Для того, чтобы наши верфи и отрасли промышленности не отставали от наших постоянно растущих амбиций, наш военно-морской флот разработал новые планы расширения в рамках программы быстрого дополнения к военно-морским вооружениям. Это включает в себя новые военные корабли и имеет цель расширить военно-морской флот как минимум до 293 морских судов."
 JAP_naval_armaments_program_tt:0 "с §Y$JAP_focus_on_aircraft_carriers$§! Завершено: Создать перевозчика §Yвариант§! и §Y4 производственные линии§! из них §YКласс Шокаку§!\nс §Y$JAP_balanced_naval_approach$§! Оригинальное название: Create авианосец and Super линкор §Yварианты§! и §Y2 производственные линии§! И то и другое §YКласс Шокаку§! и тот §YКласс Yamato§!\nс §Y$JAP_sea_battleship_initiative$§! Оригинальное название: Create Super линкор §Yвариант§! и §Y4 производственные линии§! из них §YКласс Yamato§!\n"
 JAP_radio_guided_missiles:0 "Ракеты, ищущие тепло"
 JAP_radio_guided_missiles_desc:0 "Имперский совет по вооружениям японской армии добился больших успехов в разработке управляемого оружия. Они близки к прорыву в отношении свободно падающей, инфракрасной управляемых гиростабилизированных ракет, предназначенных для сброса с самолетов на морские цели. Это новое оружие получило название Ke-Go."
 JAP_assure_superior_naval_quality:0 "Обеспечение превосходного качества ВМС"
 JAP_assure_superior_naval_quality_desc:0 "Хотя цифры имеют значение, мы не должны позволять врагу иметь более мощные корабли, чем наши самые большие. Ямато был хорошим первым шагом, но мы должны пойти еще дальше."
 JAP_seek_strength_in_numbers:0 "Ищите силу в цифрах"
 JAP_seek_strength_in_numbers_desc:0 "Одного корабля недостаточно, чтобы выиграть помолвку. Мы должны диверсифицировать наши флоты и расширить их количество, а не просто сосредоточиться на качестве. В конце концов, количество — это собственное качество."
 JAP_seek_strength_in_numbers_tt:0 "Разблокировка MIO-точки §Y$JAP_mio_trait_strength_in_numbers$§! Для всех §YМорские дизайнеры§!. §RОднако это может быть применено только к одному из них.§!."
 JAP_secure_the_sea_lanes:0 "Защищайте морские ланы"
 JAP_secure_the_sea_lanes_desc:0 "Нашим флотам требуется самое современное сопровождение для беспрепятственной работы подводных лодок и торпедных катеров противника. Только инвестируя в это, наши транспортные средства смогут безопасно добраться до места назначения."
 JAP_fix_flawed_naval_designs:0 "Исправьте дефектные дизайны"
 JAP_fix_flawed_naval_designs_desc:0 "Наши конструкции кораблей оказались очень тяжелыми, и у нас были случаи, когда они опрокидывались, как только они покидали гавань. Мы должны решить эти вопросы немедленно, чтобы наши корабли могли безопасно выйти в море."
 JAP_f_go_nuclear_project:0 "Ядерный проект F-Go"
 JAP_f_go_nuclear_project_desc:0 "Наше военно-морское командование хочет начать ядерную исследовательскую программу с надеждой использовать мощь технологии для нашего флота. Они предложили, чтобы это осуществлялось при Бунсаку Аракацу в Императорском университете Киото. Его команда включает Хидэки Юкаву, выдающегося теоретика, который, несомненно, добьется нужных нам прорывов."
 JAP_combined_nuclear_research_efforts:0 "Совместные усилия в области ядерных исследований"
 JAP_combined_nuclear_research_efforts_desc:0 "Поскольку боевые действия между нашими военными подразделениями близки к завершению, настало время объединить их амбициозные ядерные проекты в один и тот же проект и направить все самые яркие умы нашей страны на работу в одной команде."
 JAP_end_the_interservice_rivalry:0 "Покончить с межсервисным соперничеством"
 JAP_end_the_interservice_rivalry_desc:0 "С нашими победами, доказывающими, что наша нация способна стать мировой державой, ссоры по поводу ресурсов между нашими внутренними фракциями кажутся все более неуместными. Настало время положить конец этому расколу, который слишком долго разделял наши интересы, и обеспечить [ROOT.GetAdjective] Доминирование над Азией на протяжении веков."
 JAP_end_the_interservice_rivalry_tt:0 "На этом все закончится. §YМежведомственное соперничество§! между армией и флотом. Они будут §GБольше не доставлять злоупотребления§! Они основаны на их статусе по сравнению с другими, но вместо этого функционируют так же, как и другие фракции."
 JAP_seek_yakuza_support:0 "Ищите поддержку Yakuza"
 JAP_seek_yakuza_support_desc:0 "Есть много групп, которые держат большую власть в тени, они контролируют и влияют на действия политиков и генералов. Мы должны попытаться объединиться с этими группами и убедить их работать вместе с нами, чтобы гарантировать, что военные не добьются своего."
 JAP_seek_yakuza_support_tt:0 "Большую часть из них §YИмперская армия§! Мы будем на нашей стороне, чтобы §YГражданская война§!"
 JAP_seek_yakuza_support_2_tt:0 "§G1§! §YГенерал§! Станет лояльным к нам"
 JAP_expand_the_metropolitan_police:0 "Расширить департаменты столичной полиции"
 JAP_expand_the_metropolitan_police_desc:0 "Мы точно знаем, что силы гражданской полиции — это боевая группа, твердо на нашей стороне, а не под контролем военных. Они помогли нам сломить фракцию Кодохи, и они могут помочь нам снова, в восстановлении порядка в этой хаотической ситуации."
 JAP_expand_the_metropolitan_police_tt:0 "§G2§! §YГенералы§! Станет лояльным к нам"
 JAP_expand_the_metropolitan_police_2_tt:0 "Демократическое правительство получит дополнительное §G8§! §YПолицейские подразделения§! когда §YГражданская война§! происходит"
 JAP_secretly_rebuild_the_party:0 "Секретно восстановить JCP"
 JAP_secretly_rebuild_the_party_desc:0 "Многие группы потеряли свой голос и политическое представительство, когда в 1925 году был подписан Закон о сохранении мира. Одна из групп — коммунисты, которые имели свои организации вне закона и которые столкнулись с большим угнетением при нашем последнем режиме. Мы должны стремиться легализовать их движение, заручиться их поддержкой в нашей борьбе с военными."
 JAP_secretly_rebuild_the_party_tt:0 "Разблокировать решения на §YПроникнуть в контролируемые оппозицией государства§! Для того, чтобы они присоединились к §Yкоммунисты§! когда §YГражданская война§! случается"
 JAP_anti_militarist_speeches_in_the_diet:0 "Антимилитаристские речи в диете"
 JAP_anti_militarist_speeches_in_the_diet_desc:0 "С ростом антивоенных настроений по всей стране было бы разумно направить людей, критикующих их фанатичный национализм, дальше влево, проводя речи с критикой наших традиций и распространяя коммунистическую пропаганду на улицах в меру возможностей партии."
 JAP_anti_militarist_speeches_in_the_diet_tt:0 "Разблокировать решения на §YРасширение коммунистической поддержки§! по всей стране"
 JAP_sway_disillusioned_young_officers:0 "Sway разочарование молодых офицеров"
 JAP_sway_disillusioned_young_officers_desc:0 "Большинство молодых офицеров, принимавших участие в последнем перевороте в Кодохе, были из бедных сельских семей, которые были недовольны нынешней структурой вооруженных сил и системой продвижения по службе через историю, а не заслугами. Мы должны использовать это и обещать им лучшее завтра."
 JAP_sway_disillusioned_young_officers_tt:0 "The §YМолодые офицеры Кодоха§! Станем симпатизировать нашему делу"
 JAP_sway_disillusioned_young_officers_2_tt:0 "Немного большая часть из §YИмперская армия§! Мы будем на нашей стороне, чтобы §YГражданская война§!"
 focus_effects_are_as_follows_tt:0 "Основные эффекты заключаются в следующем:"
 JAP_organize_the_student_movements:0 "Организовать студенческие движения"
 JAP_organize_the_student_movements_desc:0 "Студенты в наших университетах недовольны состоянием нации и придерживаются идей, которые согласуются с некоторыми из самых видных членов JCP. Мы должны организовать Всекампусные совместные комитеты по борьбе с целью распространения социалистической мысли в наших кампусах."
 JAP_organize_the_student_movements_tt:0 "Когда §YГражданская война§! Если это произойдет, то противоборствующая сторона получит следующий национальный дух: §Y365§! дни:"
 JAP_raise_support_within_the_proletarian_class:0 "Поддержка пролетарского класса"
 JAP_raise_support_within_the_proletarian_class_desc:0 "Многие из наших высших руководителей происходят из рабочего класса, работая на верфях и сталелитейных заводах. Мы должны поощрять японский пролетариат к объединению и противодействовать тем, кто хочет попирать их права."
 JAP_raise_support_within_the_proletarian_class_tt:0 "§Y[529.GetName]§! Станет поддерживать СКП"
 JAP_raise_support_within_the_proletarian_class_2_tt:0 "Мы выиграем §Y$JAP_strong_unions_idea$§! В случае, если а §YГражданская война§!"
 JAP_organize_underground_resistance:0 "Организовать подпольное сопротивление"
 JAP_organize_underground_resistance_desc:0 "Если наша партия хочет выступить не только против армии, но и против центрального правительства, нам понадобится база операций, которая будет далека от их власти. Оттуда мы должны начать освобождать наших товарищей из тюрем и начать операции по обеспечению оружием революции."
 JAP_organize_underground_resistance_tt:0 "Разблокировать решения на §YРейды армейских складов оружия§! и получить снаряжение в начале революции, при этом дав противостоящей стороне незначительный малюс."
 JAP_mountain_village_operation_units:0 "Операционные подразделения Mountain Village"
 JAP_mountain_village_operation_units_desc:0 "Санзо Носака санкционировал создание подпольных военизированных формирований и тайных ячеек в сельских и отдаленных деревнях с целью проведения партизанских операций против правительства и подготовки к общенациональной коммунистической революции. Чтобы облегчить это, буклет «Как поднять цветочные бульбы» начал распространение по всей стране."
 JAP_mountain_village_operation_units_tt:0 "Разблокировать решения на §YСоздание партизанских отрядов§! В тех странах, которые встанут, когда придет время."
 JAP_return_of_the_manchukuo_exiles:0 "Возвращение изгнанников Маньчжоу-го"
 JAP_return_of_the_manchukuo_exiles_desc:0 "Многие социалистические теоретики и экономисты пошли работать в различные синдикалистские кооперативы и другие отрасли промышленности, которые были созданы в Маньчжурии после ее завоевания Квантунской армией в надежде установить революционную мысль там, хотя это было недолго. Мы должны добиться от временного премьер-министра содействия возвращению этих лиц в обмен на отправку некоторых генералов в изгнание."
 JAP_return_of_the_manchukuo_exiles_tt:0 "Только государства с §Y$JAP_state_infiltrated_by_the_jcp$§! Присоединяйтесь к нам в начале §YГражданская война§!"
 JAP_return_of_the_manchukuo_exiles_2_tt:0 "§G5§! §YПреданные генералы благородного происхождения§! будут отправлены в §YМаньчжурия§! В обмен на §YСоциалистические промышленники§!"
 JAP_organize_the_fifth_column:0 "Организуйте пятую колонну"
 JAP_organize_the_fifth_column_desc:0 "Когда наши четыре колонны подойдут к Осаке и Токио, пятая колонна опор поднимется изнутри городов и подорвет оборону врагов изнутри. Мы организуем эти «пятые колонны» во всех городах, к которым мы приближаемся, давая нам решающее преимущество в войне за национальное освобождение."
 JAP_organize_the_fifth_column_tt:0 "Разблокировать решения по поощрению партизан к §YПовреждать вражеские подразделения§! Во время гражданской войны"
 JAP_organize_the_fifth_column_2_tt:0 "Получить 5 единиц с §Y5 милиция§! Батальоны.\n"
 JAP_revoke_the_peace_preservation_law:0 "Отменить закон о сохранении мира"
 JAP_revoke_the_peace_preservation_law_desc:0 "Гнусный закон о сохранении мира способствовал созданию Токко, которые сеют хаос во имя военных с тех пор, как Окада впервые выступил против них. Он также блокирует демократический процесс, поскольку он запрещает множество демократических принципов и организаций. Пришло время отдать свой голос и разорвать этот несчастный лист бумаги."
 JAP_revoke_the_peace_preservation_law_requirements_tt:0 "Комбинированный §Yкоммунистический§! и §Yдемократический§! Поддержка более 50%"
 JAP_revoke_the_peace_preservation_law_tt:0 "§RМногие из наших колоний, вероятно, увидят в этом возможность покинуть империю.§!"
 JAP_a_red_sun_rises_for_a_new_era:0 "Красное солнце восходит в новую эру"
 JAP_a_red_sun_rises_for_a_new_era_desc:0 "Революция торжествует, день выигран! С разгромом окончательных противников антиреволюционных ячеек мы должны теперь приступить к социалистической реорганизации государства. Однако внутри партии существуют серьезные разногласия по поводу того, как это должно быть сделано. Поэтому мы должны провести большую дискуссию, чтобы определиться с будущей траекторией развития нашего государства."
 JAP_the_lecture_group_ascendant:0 "Лекция группы Ascendant"
 JAP_the_lecture_group_ascendant_desc:0 "В дебатах на первое место вышла более авторитарная и пролетарская фракция Коза-ха. Лидеры этой фракции Сандзо Носака и Кюити Токуда возьмут на себя трудную работу по созданию нового государства. Однако остается вопрос: кто должен возглавить правительство и кто будет премьер-министром страны?"
 JAP_the_labor_farmer_faction_ascendant:0 "Победа рабоче-крестьянской фракции"
 JAP_the_labor_farmer_faction_ascendant_desc:0 "В дебатах победила более идеалистическая и ориентированная на фермеров фракция Роно-ха, чудесным образом победив Кодза-ха. Хотя это зонтичное движение и стало победоносным, главный вопрос все же остается: кто станет следующим премьером республики?"
 JAP_the_labor_farmer_faction_ascendant_tt:0 "Любые модификаторы передаются §Y$JAP_rounouha_modifier$§!"
 JAP_sea_fate_of_the_imperial_family:0 "Судьба императорской семьи"
 JAP_sea_fate_of_the_imperial_family_desc:0 "Настало время обратить внимание на последние остатки наследственного правления в Японии и устранить их. Есть много способов, которыми мы можем действовать, хотя мы должны действовать с осторожностью, поскольку императорская семья все еще пользуется огромной популярностью среди нашего народа. Мы должны решить, какая судьба постигнет бывшего императора и его семью."
 JAP_hold_a_peoples_tribunal:0 "Провести народный суд"
 JAP_hold_a_peoples_tribunal_desc:0 "Многие совершили тяжкие преступления во имя правительств прошлого, боролись против революции и ее сторонников. Мы должны публично опробовать этих людей и немедленно искоренить всякое контрреволюционное инакомыслие!"
 JAP_hold_a_peoples_tribunal_tt:0 "Несколько §YВоенные советники§! Они судятся за сотрудничество со старым правительством и уходят в отставку с действительной службы."
 JAP_social_and_cultural_revolution:0 "Социальная и культурная революция"
 JAP_social_and_cultural_revolution_desc:0 "Теперь мы должны приступить к монументальной задаче ликвидации всех остатков феодализма, национализма и консервативных традиций при одновременном продвижении коммунистической идеологии по всему государству. Мы должны отстранить Бушидо от нашего образования, побудить народ носить ёфуку и выбросить любую традиционную одежду в пользу западных типов, чтобы привести наше государство наравне с другими революционными обществами."
 JAP_social_and_cultural_revolution_tt:0 "Когда национальный дух §Y$JAP_reorganization_of_society_idea$§! удаляется:\n"
 JAP_overhaul_the_education_system:0 "Реконструкция системы образования"
 JAP_overhaul_the_education_system_desc:0 "В системе образования до сих пор преобладают идеи и способы старого, а также пропагандируются националистические и патриотические мысли. Мы должны быстро исправить это и перестроить систему образования, чтобы должным образом научить нашу молодежь тому, как самим стать революционными лидерами."
 JAP_sea_nationalize_the_zaibatsus:0 "Национализировать Зайбацус"
 JAP_sea_nationalize_the_zaibatsus_desc:0 "Крупнейшие корпорации нашей страны уже давно обладают беспрецедентной политической и экономической мощью, но на этом все заканчивается. Контроль государства не будет оспариваться. Мы должны национализировать их и использовать их капитал на благо народа!"
 JAP_can_no_longer_manually_promote_zaibatsus_tt:0 "Мы больше не сможем §RРучно одобряет§! тот §YФракция Заибатсу§!"
 JAP_a_functionalist_housing_policy:0 "Функциональная жилищная политика"
 JAP_a_functionalist_housing_policy_desc:0 "Наши теоретики изложили новый план по созданию больших кластеров многоквартирных домов или домов определенного стиля, которые будут использоваться в качестве государственного жилья. Благодаря строительству с учетом функциональности, больше людей смогут получить более дешевое жилье по всему штату."
 JAP_redistribute_land_and_wealth:0 "Перераспределение земли и богатства"
 JAP_redistribute_land_and_wealth_desc:0 "Большая часть земли по всей стране по-прежнему принадлежит семьям, связанным с даймё, которые правили обширными владениями. Эти земли должны быть перераспределены между нашими фермерами, а также захвачены государством для того, чтобы построить новые города и отрасли промышленности."
 JAP_ganbarou:0 "Ганбару!"
 JAP_ganbarou_desc:0 "The [ROOT.GetAdjective] Мужчина и женщина – трудолюбивые люди, которые готовы отдать все, чтобы обеспечить государство. Мы должны пропагандировать это и продвигать хороший труд и тяжелую работу как основную часть нашей работы. [ROOT.GetAdjective] общества."
 JAP_cooperate_with_anarchists:0 "Сотрудничество с анархистами"
 JAP_cooperate_with_anarchists_desc:0 "Анархисты были отброшены другими фракциями в JCP, будучи вынужденными защищать себя против тиранического государства. Мы должны пригласить их в наше зонтичное движение и обеспечить, чтобы некоторые из их идеалов также могли стать реальностью в будущем."
 JAP_the_ie_system_and_socialism:0 "Т.е. система и социализм"
 JAP_the_ie_system_and_socialism_desc:0 "Традиционная система организации семей исторически сформировала социальные структуры, бизнес-практику и даже организацию компаний в нашей стране. Мы должны обеспечить, чтобы это оставалось в силе, но с акцентом на государство как на авторитетную фигуру внутри него."
 JAP_fukumotoism:0 "Фукумотоизм"
 JAP_fukumotoism_desc:0 "Фукумото Кадзуо подчеркнул необходимость теоретической и политической борьбы радикальной авангардной партии, которая вводила бы марксистское сознание в рабочих извне посредством теоретической борьбы, чтобы превратить движение в политическую борьбу. Включив это в наше управление, мы сможем найти лучший способ связаться с нашими людьми и распространить на них любые идеи, которые мы пожелаем."
 JAP_fukumotoism_tt:0 "Разблокировать решение, которое может быть принято §G6§! Время, когда гранты §YГражданские заводы§! и §Y$MODIFIER_CONSUMER_GOODS_FACTOR$§! бонусы"
 JAP_the_modern_ashigaru:0 "Современный Ашигару"
 JAP_the_modern_ashigaru_desc:0 "Крестьянская пехота, нанятая полевыми командирами Японии для дополнения самураев в их армиях, которые стали распространенными во время периода Муромати, была известна как Ашигару и не имела особой лояльности. Чтобы дополнить свои профессиональные силы, мы должны попытаться восстановить подобную систему, при которой крестьяне обязаны защищать государство в случае войны."
 JAP_the_modern_ashigaru_tt:0 "Разблокировать решения на §YВоспитание милиции§! Когда на войне"
 JAP_learn_from_the_nkvd:0 "Учитесь у НКВД"
 JAP_learn_from_the_nkvd_desc:0 "Советская тайная полиция усовершенствовала искусство подавления инакомыслия и контрреволюции. Хотя мы не хотим работать вместе с ними, возможно, мы могли бы узнать кое-что из того, как они делают вещи."
 JAP_further_urban_investments:0 "Дальнейшие городские инвестиции"
 JAP_further_urban_investments_desc:0 "Городские центры остро нуждаются в инвестициях. Если мы хотим, чтобы отрасли промышленности, расположенные в городах, имели эффективность, а рабочие должны поддерживать свои производственные квоты, мы должны вмешаться и помочь им."
 JAP_the_first_five_year_plan:0 "Первый пятилетний план"
 JAP_the_first_five_year_plan_desc:0 "Чтобы обеспечить будущее нашего народа, мы должны создать комитет, способный выработать и внедрить смелую новую экономическую модель для того, чтобы [ROOT.GetNameDef]. Этот новый пятилетний план позволит нам процветать и процветать!"
 JAP_form_pioneer_organizations:0 "Формирование пионерских организаций"
 JAP_form_pioneer_organizations_desc:0 "Партия должна создать организации для молодежи, в которых она сможет участвовать в деятельности, чтобы стать настоящими коммунистами, способными помочь государству и однажды даже защитить его."
 JAP_war_communism:0 "Военный коммунизм"
 JAP_war_communism_desc:0 "Мы должны принять версию экономической и политической системы, существовавшей в Советской России во время Гражданской войны 1918-1921 годов, которую они называли военным коммунизмом. Она должна позволить нам сохранить контроль и принять решения, необходимые для того, чтобы силой оружия довести революцию до остальной Азии."
 JAP_war_communism_new_economy_law:0 "Разблокировать новый закон об экономике: §Y$JAP_war_communism_idea$§!"
 JAP_the_uno_school_of_economics:0 "Уно школа экономики"
 JAP_the_uno_school_of_economics_desc:0 "Политический и экономический теоретик Кодзо Уно предложил теории о том, как преобразовать бывшие капиталистические модели в реальное экономическое развитие и средства, необходимые для достижения истинного социализма. Пришло время воплотить свои теории в реальность."
 JAP_the_uno_school_of_economics_tt:0 "Начало миссии, которая уменьшит нашу $MODIFIER_CONSUMER_GOODS_FACTOR$ через §Y-2.5%§! Каждый год"
 JAP_incorporate_buddhist_socialism:0 "Интеграция буддийского социализма"
 JAP_incorporate_buddhist_socialism_desc:0 "Иноуэ Шутен и Джиро Сеноо предложили теории осуществления социализма, основанные на принципах буддизма, и рассматривают их как аналогичные концепции, поскольку оба стремятся обеспечить трансформацию личного сознания, чтобы положить конец отчуждению человека и эгоизму. Мы должны пригласить этих мыслителей в наше движение."
 JAP_the_spirit_of_the_ikko_ikki:0 "Возрождение духа Икко Икки"
 JAP_the_spirit_of_the_ikko_ikki_desc:0 "Милитаристские буддисты нашего прошлого доказали миру, что наших монахов следует бояться в бою, и благодаря их вере сеть храмов позволила более эффективную мобилизацию войск, когда это было необходимо. Мы должны искренне оживить дух этих буддийских воинов, когда мы идем к чистой земле."
 JAP_achieving_joubukkokudo:0 "Провозгласить Джобуккокудо"
 JAP_achieving_joubukkokudo_desc:0 "Объединение столиц восточно-азиатской Махаяны, наше стремление к созданию Чистой Земли, где через новые буддийские социалистические идеалы наше духовное освобождение, а также социальное и экономическое освобождение будет завершено, заканчивается. Хвалите Гиро Сеноо, и да здравствует Джобуккокудо!"
 JAP_uplift_ainu_revolution_theory:0 "Теория революции айнов"
 JAP_uplift_ainu_revolution_theory_desc:0 "Многие из наших политических мыслителей рассуждали о том, что люмпенпролетариат является основной массой нашей революции и что айнский народ также входит в эту группу. Кроме того, они считают, что айновцы жили в примитивной коммунистической системе и считают их достойными быть «лидерами коммунистической революции». Мы должны более широко поддержать это движение."
 JAP_kikues_new_model:0 "Новая модель Kikue"
 JAP_kikues_new_model_desc:0 "Ямакава Кикуэ давно пропагандирует идею повышения статуса японских женщин как равноправной части нашего общества и хочет гарантировать равные права на заработную плату и трудоустройство, а также упразднить патриархальную систему домашнего хозяйства. Пришло время воплотить эти идеалы в реальность!"
 JAP_women_in_industry:0 "Женщины в промышленности"
 JAP_women_in_industry_desc:0 "Слишком долго женщины должны были оставаться дома и заботиться о семье. Если женщина способна быть лидером нашей страны, то это только право - позволить им работать и в других отраслях. Это будет служить только для помощи [ROOT.GetNameDef]Экономическое будущее, так как это значительно расширит нашу рабочую силу."
 JAP_form_national_cooperatives:0 "Формирование национальных кооперативов"
 JAP_form_national_cooperatives_desc:0 "Многие из наших мыслителей выступают за создание большего числа национальных кооперативов, организаций, которые формируются отдельными лицами или предприятиями с общими экономическими, социальными или культурными потребностями. Они действуют на принципах собственности членов, демократического контроля и взаимной выгоды. Мы должны поощрять их создание."
 JAP_further_rural_investments:0 "Дальнейшие сельские инвестиции"
 JAP_further_rural_investments_desc:0 "Наши сельские районы долгое время оставались без внимания центрального правительства, и быстрая индустриализация таких городов, как Токио, оттолкнула людей от сельской местности, оставив многие города и деревни в ужасных проливах. Мы должны инвестировать в эти области, чтобы рабочая сила, необходимая для их работы, могла оставаться на месте."
 JAP_further_rural_investments_tt:0 "Разблокировать решения на §GУлучшить§! тот §YГосударственная категория§! вышеперечисленных государств, если они §Y4§! или более §Yинфраструктура§!"
 JAP_adopt_syndicalist_ideas:0 "Принять синдикалистские идеи"
 JAP_adopt_syndicalist_ideas_desc:0 "Мы должны принять идеи создания синдикалистских кооперативов в наших отраслях и использовать их идеи для улучшения отношений между отдельными лицами и их работодателями."
 JAP_raise_the_red_flag_high:0 "Поднимите красный флаг"
 JAP_raise_the_red_flag_high_desc:0 "Красный флаг является символом нашей революции и показывает нашу решимость в продвижении революции вперед, с надеждой в конечном итоге освободить всех азиатских рабочих от буржуазного угнетения. Пришло время гордо поднять флаг и объявить, что революция будет идти вечно!"
 JAP_guide_the_lesser_states:0 "Руководствуйтесь малыми государствами"
 JAP_guide_the_lesser_states_desc:0 "У менее развитых азиатских государств нет предпосылок для революции и успеха в создании собственной рабочей республики. Мы должны руководить ими и показывать им, как правильно управлять государством."
 JAP_pan_asian_revolutuonary_front:0 "Паназиатский революционный фронт"
 JAP_socialism_in_one_state:0 "Социализм в одном государстве"
 JAP_socialism_in_one_state_desc:0 "Единственные, кто может просвещать и возвышать народ Азии — это мы, которые показали, что революция может быть успешной. Мы должны привести их в лоно, чтобы показать им, как вести свою жизнь, силой оружия, если это необходимо."
 JAP_the_courage_to_defend_the_revolution:0 "Смелость защищать революцию"
 JAP_the_courage_to_defend_the_revolution_desc:0 "Каждый мужчина и каждая женщина должны проявить мужество и решимость защищать революцию от многочисленных контрреволюционных сил по всему миру. Пришло время защищать наши идеалы всем, что у нас есть!"
 JAP_demand_submission_from_breawakay_states:0 "Отзывы о программе Breakaway States"
 JAP_demand_submission_from_breawakay_states_desc:0 "Государства, которые незаконно откололись от нас, просто допустили ошибку и не осознали, что народная революция будет успешной. Мы должны подойти к ним и сделать твердое заявление, требуя, чтобы они подчинились партии и позволили своему народу освободиться от капиталистического гнета."
 JAP_ignite_the_korean_peninsula:0 "Игнит Корейского полуострова"
 JAP_ignite_the_korean_peninsula_desc:0 "The [KOR.GetAdjective] Люди еще не освобождены. Мы должны наладить контакт с революционерами. [KOR.GetAdjective] На юг, и пусть они начнут свою революцию. Это должно дать нам возможность вмешаться и защитить нашу страну. [KOR.GetAdjective] людей после гражданской войны."
 JAP_ignite_the_korean_peninsula_tt:0 "Начинается гражданская война в [KOR.GetNameDef]Где коммунистическая сторона становится нашей марионеткой"
 JAP_protect_the_manchurians:0 "Защита маньчжуров"
 JAP_protect_the_manchurians_desc:0 "Маньчжурии по-прежнему находятся под гнетом остатков нашей старой Квантунской армии. Мы должны убрать свой собственный беспорядок и начать освобождать людей. Пора закончить бой и свести счеты с Императорской армией!"
 JAP_guide_the_chinese:0 "Чтобы руководить китайцами"
 JAP_guide_the_chinese_desc:0 "Революция в Китае не увенчалась успехом. Мы должны вмешаться и лично направить китайский народ к процветанию, освободить его от феодального и устаревшего образа жизни."
 JAP_guide_the_chinese_tt:0 "Мы добьемся §Yмарионетка§! Войны против каждого §YКитайский некоммунистический§! штат. Текущие цели:"
 JAP_guide_the_chinese_2_tt:0 "Каждый §YКоммунистический Китай§! Нация приглашена в нашу фракцию. Текущие цели:"
 JAP_guide_the_mongols:0 "Путеводитель по монголам"
 JAP_guide_the_mongols_desc:0 "Революция, возможно, удалась в некоторых частях Монголии, но теперь они находятся под советским гнетом. Мы должны вмешаться и лично направить монгольский народ к процветанию, освободить его от феодального, устаревшего и авторитарного образа жизни."
 JAP_spread_the_revolutuon_south:0 "Распространение революции на юг"
 JAP_spread_the_revolutuon_south_desc:0 "Огонь революции должен быть быстро поднят на юг, чтобы народ Азии был когда-нибудь освобожден. Настало время нанести удар и обеспечить всем азиатам светлое будущее!"
 JAP_free_asians_from_soviet_opression:0 "Свободные азиаты от советской оккупации"
 JAP_free_asians_from_soviet_opression_desc:0 "Русские большевики ничем не лучше капиталистов, стремящихся контролировать народ и отрицающих его будущее. Мы не можем оставаться безучастными, поскольку они продолжают угнетать азиатов. Пора действовать!"
 JAP_go_after_the_capitalists:0 "Пойдем за капиталистами"
 JAP_go_after_the_capitalists_desc:0 "Западные капиталисты стремятся украсть у народа Азии, не отдавая ничего взамен. Мы должны уничтожить их, прежде чем они будут эксплуатировать людей до точки невозврата."
 JAP_a_free_asia_pacific:0 "Свободный Азиатско-Тихоокеанский регион"
 JAP_a_free_asia_pacific_desc:0 "Наконец-то настал день, когда люди по всей Азии смогут жить свободно, не подвергаясь эксплуатации со стороны иностранцев и правительств, которые мало заботятся о своем благополучии. Да здравствует жизнь [ROOT.GetNameDef]Да здравствуют трудящиеся Азии!"
 JAP_the_pan_asian_revolutionary_front:0 "Паназиатский революционный фронт"
 JAP_the_pan_asian_revolutionary_front_desc:0 "Для руководства различными азиатскими революционными партиями мы должны организовать альянс и наднациональную организацию, которая дает директивы менее развитым государствам и может координировать инвестиции для более быстрого улучшения их обществ."
 JAP_educate_the_peasants:0 "Обучать крестьян"
 JAP_educate_the_peasants_desc:0 "Образование крестьян континента слишком долго игнорировалось. Настало время начать координировать усилия между членами альянса, чтобы мы могли улучшить знания в рабочей силе."
 JAP_educate_the_peasants_tt:0 "Премия за скорость исследования от §Y$JAP_educating_the_peasants_modifier$§! увеличиваясь §G1%§! Для каждого нового члена фракции, до максимума §G10%§!"
 JAP_a_common_currency_for_all_of_asia:0 "Единая валюта для всей Азии"
 JAP_a_common_currency_for_all_of_asia_desc:0 "В рамках нашей международной координации мы должны стремиться к тому, чтобы все революционные государства приняли иену в качестве своей официальной валюты, с тем чтобы можно было надлежащим образом создать таможню и профсоюз."
 JAP_the_minitry_of_pan_asian_development:0 "Министерство паназиатского развития"
 JAP_the_minitry_of_pan_asian_development_desc:0 "Для улучшения условий жизни в различных азиатских государствах мы должны создать центральное министерство, которое будет осуществлять надзор за инвестициями в развитие и помогать в организации промышленных и экономических программ."
 JAP_development_for_the_undeveloped:0 "Развитие для неразвитых"
 JAP_development_for_the_undeveloped_desc:0 "Для того чтобы осуществить настоящую революцию, мы должны развивать менее развитые государства и улучшать инфраструктуру и промышленный потенциал более мелких членов альянса."
 JAP_a_pan_asian_diet:0 "Паназиатская диета"
 JAP_a_pan_asian_diet_desc:0 "Чтобы сблизить революционные государства Азии, мы должны создать правительственный орган, в который вошли бы представители всех государств-членов, где они голосуют за то, какие законы и институты внедрить в наших братских республиках."
 JAP_extensive_navy_maneuvers:0 "Инициировать масштабные маневры ВМС"
 JAP_extensive_navy_maneuvers_desc:0 "Для того, чтобы уничтожить отколовшиеся государства, которые появились, когда наша нация разразилась гражданской войной, мы должны обеспечить, чтобы наш флот был готов взять их на себя. Поэтому мы должны организовать крупномасштабные маневры, чтобы быть готовыми к бою."
 JAP_extensive_army_maneuvers:0 "Инициировать масштабные маневры армии"
 JAP_extensive_army_maneuvers_desc:0 "Для того, чтобы уничтожить Квантунскую армию, захватившую Маньчжурию, когда наша нация впала в гражданскую войну, мы должны быть уверены, что наша армия готова взять их на себя. Поэтому мы должны организовать крупномасштабные маневры, чтобы быть готовыми к бою."
 JAP_reclaim_lost_territories:0 "Восстановление утраченных территорий"
 JAP_reclaim_lost_territories_desc:0 "Настало время вернуться в регионы, которые оторвались от нашей сферы и вернуть их в нашу республику. Только путем военного вмешательства мы сможем обеспечить процветание населения этих регионов."
 JAP_conquer_the_army_remnants:0 "Покорить остатки армии"
 JAP_conquer_the_army_remnants_desc:0 "Настало время закончить начатую нами борьбу и положить конец последним остаткам Императорской армии и нашей гражданской войне. Мы должны сбить Квантунскую армию и отвоевать Маньчжурию!"
 JAP_put_an_end_to_chinese_feudalism:0 "Положить конец китайскому феодализму"
 JAP_put_an_end_to_chinese_feudalism_desc:0 "В Китае до сих пор царят феодальные традиции, и миллионы людей должны быть освобождены и приведены в нашу революционную республику. Указ будет издан, и китайский народ будет освобожден раз и навсегда!"
 JAP_mobilize_the_proletariat:0 "Мобилизовать пролетариат"
 JAP_mobilize_the_proletariat_desc:0 "Рабочие делают хорошую работу, старательно снабжая оружием наших военных, но отчаянные времена требуют отчаянных мер. Пришло время увеличить производственные квоты, пусть даже временно, чтобы им было предоставлено все необходимое для армии вооружение."
 JAP_the_long_march_to_victory:0 "Долгий марш к победе"
 JAP_the_long_march_to_victory_desc:0 "Чтобы сломить китайские правительства, нам нужно пройти вглубь континентальной Азии. Мы должны проводить пропагандистские кампании, ссылаясь на длительный марш, в надежде, что это повысит готовность наших солдат продолжать марш столько, сколько потребуется!"
 JAP_the_pacific_union_of_soviet_socialist_republics:0 "Тихоокеанский союз Советских Социалистических Республик"
 JAP_the_pacific_union_of_soviet_socialist_republics_desc:0 "Момент, к которому мы стремились, наконец-то наступил. Настало время объявить о создании нового азиатского государства, которое приведет различные Советы к единому союзу."
 JAP_the_pacific_union_of_soviet_socialist_republics_tt:0 "Мы будем известны как §YТихоокеанский союз Советских Социалистических Республик§!"
 JAP_the_indochinese_soviet:0 "Индокитайский советский"
 JAP_the_indochinese_soviet_desc:0 "Теперь, когда союз основан, мы должны создать новые советские республики и привести их в лоно. Мы должны создать Индокитайский Совет, чтобы оправдать нашу оккупацию региона."
 JAP_transformation_of_nature:0 "Преобразование природы"
 JAP_transformation_of_nature_desc:0 "Азия богата природными ресурсами, которые только и ждут своего часа. С нашим научным сообществом, раздвигающим границы того, что ранее считалось возможным, становятся возможными даже самые крупные, наиболее инвазивные проекты. Окружающая среда должна быть сформирована и сформирована в массовом масштабе, чтобы работать на благо народа!"
 JAP_the_south_pacific_soviet:0 "Южно-тихоокеанский совет"
 JAP_the_south_pacific_soviet_desc:0 "Теперь, когда союз основан, мы должны создать новые советские республики и привести их в лоно. Мы должны создать Совет южной части Тихого океана, чтобы оправдать нашу оккупацию региона."
 JAP_the_oceanian_soviet:0 "Океанский Советский"
 JAP_the_oceanian_soviet_desc:0 "Теперь, когда Южнотихоокеанский Совет создан, мы должны расширить наши границы на юг. С этой целью мы должны создать Океанский Совет, чтобы оправдать нашу оккупацию региона."
 JAP_strike_down_the_great_pretender:0 "Скачать The Great Pretender"
 JAP_strike_down_the_great_pretender_desc:0 "Большевики в Советском Союзе притворяются людьми и правят частями Азии с тиранией. Мы должны уничтожить эту буржуазную диктатуру, маскируемую под революционную силу, и объявить себя единственными защитниками революции!"
 JAP_a_red_dawn_over_asia:0 "Красный рассвет над Азией"
 JAP_a_red_dawn_over_asia_desc:0 "С победой наших сил и границами, простирающимися через обширные части Тихого океана, революция ближе к триумфу, чем когда-либо прежде. Красное солнце освещает небо, как рассвет открывает новую эру для Азии!"
 JAP_to_rival_the_comintern:0 "Соперничать с Коминтерном"
 JAP_to_rival_the_comintern_desc:0 "Со времени создания троцкистами Четвертого Интернационала многие призывали к созданию Пятого Коммунистического Интернациональная, который будет действовать как противовес этому и Коминтерну. Мы должны взять на себя эту мантию и объявить себя истинными защитниками революции!"
 JAP_alternative_communist_international:0 "Пятый коммунистический интернационал"
 JAP_wrestle_mongolia_from_the_soviets:0 "Борьба монголов из советской сферы"
 JAP_wrestle_mongolia_from_the_soviets_desc:0 "Монголы уже много лет находятся под властью русских и жаждут возможности дистанцироваться от европейцев. Мы можем предоставить им такую возможность и должны пригласить их в Интернационал. Однако это может вызвать напряженность в отношениях с [SOV.GetNameDef]."
 JAP_wrestle_tuva_from_the_soviets:0 "Вырвать тувинцев из советской сферы"
 JAP_wrestle_tuva_from_the_soviets_desc:0 "Тувинцы уже много лет находятся под большим пальцем русских и жаждут возможности дистанцироваться от европейцев. Мы можем предоставить им такую возможность и должны пригласить их в Интернационал. Однако это может вызвать напряженность в отношениях с [SOV.GetNameDef]."
 JAP_spread_revolutionary_flames_to_south_asia:0 "Распространяйте революционные пожары в Южной Азии"
 JAP_spread_revolutionary_flames_to_south_asia_desc:0 "Огонь революции разливался повсюду, и наши успешные походы вдохновляли пролетариат повсюду. Мы должны начать финансирование революционных групп в Южной Азии, чтобы дестабилизировать регион и вывести их на пятый международный уровень."
 JAP_spread_revolutionary_flames_to_south_asia_tt:0 "Разблокировать решения о приглашении §YКоммунистическая Южная Азия§! Страны в нашей фракции"
 JAP_spread_revolutionary_flames_to_south_asia_2_tt:0 "Разблокировать решения на §YРазжигание коммунистических чувств§! внутри §YЮжная Азия§! нации"
 JAP_spread_revolutionary_flames_to_west_asia:0 "Распространяйте революционные пожары в Западной Азии"
 JAP_spread_revolutionary_flames_to_west_asia_desc:0 "Огонь революции разливался повсюду, и наши успешные походы вдохновляли пролетариат повсюду. Мы должны начать финансирование революционных групп в Западной Азии, чтобы дестабилизировать регион и вывести их на пятый международный уровень."
 JAP_spread_revolutionary_flames_to_west_asia_tt:0 "Разблокировать решения о приглашении §YКоммунистический Ближний Восток§! Страны в нашей фракции"
 JAP_spread_revolutionary_flames_to_west_asia_2_tt:0 "Разблокировать решения на §YРазжигание коммунистических чувств§! внутри §YБлижний Восток§! нации"
 JAP_trans_pacific_influence:0 "Транспасификальное влияние"
 JAP_trans_pacific_influence_desc:0 "Огонь революции разливался повсюду, и наши успешные походы вдохновляли пролетариат повсюду. Мы должны начать финансирование революционных групп по другую сторону океана, чтобы дестабилизировать регион и вывести их в пятый интернационал."
 JAP_trans_pacific_influence_tt:0 "Разблокировать решения о приглашении §YКоммунистический южноамериканский§! Страны в нашей фракции"
 JAP_build_an_anti_army_coalition:0 "Создание антиармейской коалиции"
 JAP_build_an_anti_army_coalition_desc:0 "Чтобы противостоять и без того мощному влиянию армии, мы не можем продолжать наши межпартийные перепалки. Мы должны стремиться сформировать коалицию, которая вместе сможет подтолкнуть Японию к более светлому будущему."
 JAP_ensure_cross_party_support:0 "Обеспечение межпартийного сотрудничества"
 JAP_ensure_cross_party_support_desc:0 "Теперь, когда коалиция идет полным ходом, я должен попытаться заручиться поддержкой и других партий, чтобы мы не рухнули перед лицом невзгод. Вместе мы сможем вернуть дух демократии Тайсё!"
 JAP_gather_royal_pacifists_support:0 "Соберите поддержку королевских пацифистов"
 JAP_gather_royal_pacifists_support_desc:0 "В королевской семье есть много людей, которые не поддерживают идею военного господства над политикой и доктрину тотальной войны. Мы должны связаться с Садако Кудзё, Нобухито и Коити Кидо, чтобы получить их поддержку в изгнании военных элементов из нашего правительства."
 JAP_gather_royal_pacifists_support_tt:0 "Должен §YИмператор Хирохито§! Во время войны с военными §YГражданская война§!Мы сможем сохранить §YКоролевская поддержка§! От младшего брата §YНобухито§! и его мать §YСадако Кудзё§!"
 JAP_limit_military_power:0 "Стремление ограничить военную мощь"
 JAP_limit_military_power_desc:0 "Чтобы предотвратить очередной государственный переворот, мы должны вывести как можно больше военнослужащих с мощных позиций, не подстрекая к мятежу. Сделав это, мы сможем остановить их от потушения факела свободы."
 JAP_limit_military_power_tt:0 "Когда §YГражданская война§! В противном случае, противоположная сторона получит следующий национальный дух: §Y365§! дни:"
 JAP_divert_military_funds:0 "Перенаправить военное финансирование"
 JAP_divert_military_funds_desc:0 "По мере приближения восстания, если мы хотим ослабить вооруженные силы до такой степени, что они не смогут нанести нам удар, мы должны перенаправить их финансирование в другие источники. Делая это, они должны найти себя в дефиците в течение довольно долгого времени."
 JAP_divert_military_funds_tt:0 "Не всякое государство под §YАрмейский контроль§! Присоединяйтесь к нам в начале §YГражданская война§!"
 JAP_sway_the_navy_moderates:0 "Покоряйте флот умеренным"
 JAP_sway_the_navy_moderates_desc:0 "В военно-морском флоте много высокопоставленных людей, которые гораздо разумнее, чем в армии. Если мы подойдем к бывшим членам договорной фракции, мы сможем получить их одобрение и, возможно, даже поддержку в случае гражданской войны."
 JAP_sway_the_navy_moderates_tt:0 "Мы сохраним большую долю в §YИмперский флот§! И их силы для того, чтобы §YГражданская война§!"
 JAP_sway_the_navy_moderates_2_tt:0 "§G4§! §YАдмирал§! Станет лояльным к нам"
 JAP_bribe_generals:0 "Подкуп генералов"
 JAP_bribe_generals_desc:0 "Несмотря на радикальную позицию, не все наши военные хотят быть на стороне зла. Они присоединяются к своим товарищам в армии из-за долга, но, возможно, они могут быть убеждены в поддержке лучшего дела, учитывая достаточное время и усилия."
 JAP_bribe_generals_tt:0 "§G4§! §YГенералы§! Станет лояльным к нам"
 JAP_appoint_new_generals:0 "Назначение новых генералов"
 JAP_appoint_new_generals_desc:0 "Теперь, когда многие генералы решили выступить против нас, мы столкнулись с нехваткой компетентных офицеров для руководства нашими войсками. Мы должны сделать все возможное, чтобы исправить это и нанять новое поколение армейских командиров."
 JAP_implement_army_reforms:0 "Реализация армейских реформ"
 JAP_implement_army_reforms_desc:0 "С устранением старых военных кадров настало время и убрать их устаревшие представления о войне. Армия будет постепенно реорганизована в силы самообороны, и «принцип первого удара» скоро станет еще одной идеей прошлого."
 JAP_implement_army_reforms_tt:0 "§Rудалять§! Способность получать §YПринцип первого удара§! и §YКантай Кессен§! Модификаторы, предлагаемые фокусом §YИмперский план обороны§!"
 JAP_a_new_take_on_state_shintoism:0 "Содействие теории секулярных святынь"
 JAP_a_new_take_on_state_shintoism_desc:0 "Религиозная политика и политическая теория, возникшие во времена правительства Мэйдзи, называемого Цзиньцзя Hishūkyōron, пропагандируют идею о том, что синтоистские святыни являются светскими по своей природе, а не религиозными, и что синтон является просто светским набором японских национальных традиций. Мы должны продолжать продвигать эту теорию, чтобы использовать это движение в своих интересах."
 JAP_crush_the_spirit_of_gekokujo:0 "Раздавить дух Гекокудзё"
 JAP_crush_the_spirit_of_gekokujo_desc:0 "В ранний период Сёва происходили неоднократные акты гекокудзё, в ходе которых нижние чины армии пытались вытеснить тех, кто находился на более высоких позициях, что угрожало нарушить нашу цепь командования. Мы должны расправиться с этими идеями как можно скорее!"
 JAP_organize_a_general_election:0 "Организовать всеобщие выборы"
 JAP_organize_a_general_election_desc:0 "Теперь, когда гражданская борьба наконец закончилась, пришло время подготовиться к восстановлению и возвращению к нашим демократическим традициям. Впервые со времен самого Мэйдзи мы должны провести выборы, свободные от влияния и коррупции со стороны военных, и позволить людям самим решать свое будущее!"
 JAP_draft_the_showa_constitution:0 "[JAP_draft_the_showa_constitution_key]"
 JAP_draft_the_showa_constitution_desc:0 "[JAP_draft_the_showa_constitution_desc_key]"
 JAP_draft_the_showa_constitution_key_emperor_eian:0 "Проект конституции Эяна"
 JAP_draft_the_showa_constitution_key_emperor_showa:0 "Проект Конституции Шоуа"
 JAP_draft_the_showa_constitution_desc_key_emperor_eian:0 "Мы принимаем и уважаем имперскую историю нашей страны. Однако авторитаризму нет места в Японии, которую мы хотим построить. Мы будем поддерживать нового императора в качестве номинального лидера, но мы ограничим его власть в конституции, как это имеет место во многих западных странах."
 JAP_draft_the_showa_constitution_desc_key_emperor_showa:0 "Мы принимаем и уважаем имперскую историю нашей страны. Однако авторитаризму нет места в Японии, которую мы хотим построить. Мы будем поддерживать императора в качестве номинального лидера, но мы ограничим его власть в конституции, как это имеет место во многих западных странах."
 JAP_form_the_ldp:0 "Формирование LDP"
 JAP_form_the_ldp_desc:0 "Теперь, когда Риккен Сейюкай обеспечил контроль над диетой и кабинетом министров, пришло время реформировать его в более эффективный руководящий орган. Следуя директиве Итиро Хатоямы, пришло время создать Либерально-демократическую партию, которая будет управлять страной в обозримом будущем."
 JAP_rikken_minseito_victory:0 "Риккен Минсейто Победа"
 JAP_rikken_minseito_victory_desc:0 "Итоги выборов были решены. Либерально-прогрессивный Риккен Минсейто одержал убедительную победу и намерен стать явным большинством в будущем. Похоже, люди решили, в каком направлении они хотят двигаться."
 JAP_rikken_minseito_victory_flag:0 "Rikken Minseitō победил на всеобщих выборах"
 JAP_rikken_seiyukai_victory:0 "Победа Риккен Сейюкай"
 JAP_rikken_seiyukai_victory_desc:0 "Итоги выборов были решены. Либерально-консервативный Риккен Сейюкай одержал убедительную победу и намерен стать явным большинством в будущем. Похоже, люди решили, в каком направлении они хотят двигаться."
 JAP_rikken_seiyukai_victory_flag:0 "Риккен Сейюкай победил на всеобщих выборах"
 JAP_minshu_shugi:0 "Миншу Шуги"
 JAP_minshu_shugi_desc:0 "Хотя до сих пор мы следовали политической доктрине Минпон-Шуги, истинная демократия лежит в границах Миншу-Шуджи. В конце концов, «в законе суверенитет нации находится в народе», что не относится к доктрине Минона, поскольку она подчеркивает монархический суверенитет над всем остальным. Мы должны закрепить эти новые идеи в конституции!"
 JAP_minpon_shugi:0 "Минпон Шуги"
 JAP_minpon_shugi_desc:0 "Политическая доктрина Минпон Шуги, которая родилась в эпоху Тайсё, может быть определена как «политика в осуществлении политической власти оценки прибыли, счастья и мнения людей». Это не нарушает имперский институт и хорошо работает на благо как народа, так и императора. Мы должны продолжать нашу демократию, основанную на монархическом суверенитете, и закрепить ее в нашей новой конституции!"
 JAP_promote_meritocracy:0 "Поощрение меритократии"
 JAP_promote_meritocracy_desc:0 "Страна не будет эффективно функционировать, если мы не будем продвигать тех, кто преуспевает, на должности, соответствующие им. Человек, хорошо разбирающийся в электронике, должен возглавить электронную промышленность, а не какого-то политика, связанного с кабинетом министров. Настало время искоренить традиции Амакудари и принять меритократию на благо нации!"
 JAP_experimental_housing_solutions:0 "Экспериментальные жилищные решения"
 JAP_experimental_housing_solutions_desc:0 "Городское развитие должно ориентироваться на четыре функциональные категории: жилье, работа, транспорт и отдых. Кензо Танге вместе с другими молодыми архитекторами предложил новый способ строительства городов, как часть нового и предстоящего движения, которое они называют метаболизмом. Мы должны продвигать эту идею, чтобы улучшить условия жизни для всех наших граждан."
 JAP_embrace_amakudari:0 "Обнимите Амакудари"
 JAP_embrace_amakudari_desc:0 "Амакудари, буквально означающий спуск с небес, описывает практику, когда наши отставные высокопоставленные бюрократы занимают руководящие должности в частных компаниях, часто в той же отрасли, которую они ранее регулировали. Несмотря на то, что это значительно ухудшает эффективность наших отраслей, это дает нам значительное понимание и контроль над нашим обществом."
 JAP_agricultural_protectionism:0 "Сельскохозяйственный протекционизм"
 JAP_agricultural_protectionism_desc:0 "Мировая экономика становится всё враждебнее к традиционным способам производства. Без защиты фермеров нас ждёт тяжёлый кризис: они не смогут конкурировать с массовыми продуктами из-за океана."
 JAP_machida_chuuji_focus:0 "Премьер-министр Мачида Чудзи"
 JAP_machida_chuuji_focus_desc:0 "Мачида Чудзи, нынешний лидер правящего Риккена Минсейто, должен быть поощрен сформировать новый кабинет министров, который будет продвигать создание нашей новой конституции. При этом у нас больше не будет временного премьер-министра, и порядок до начала раздора окончательно восстановится."
 JAP_abe_isoo_focus:0 "Премьер-министр Абэ Ису"
 JAP_abe_isoo_focus_desc:0 "Абэ Ису, нынешний лидер Шакай Тайшуто и отец японского бейсбола, должен быть поощрен сформировать новый кабинет министров, который будет продвигать создание нашей новой конституции. При этом у нас больше не будет временного премьер-министра, и порядок до начала раздора окончательно восстановится."
 JAP_uplift_labor_unions:0 "Поощрение профсоюзов"
 JAP_uplift_labor_unions_desc:0 "Профсоюзы помогают нашему народу управлять самим собой и помогают нам в восстановлении и ремонте отраслей промышленности, которые были повреждены военными как до, так и во время гражданской войны. Мы должны поднять эти организации еще выше, пока однажды не сможем сформировать японское общество всеобщего благосостояния."
 JAP_tokugawa_iesato_focus:0 "Премьер-министр Токугава Иесато"
 JAP_tokugawa_iesato_focus_desc:0 "Широко популярный Токугава Иесато, президент Палаты пэров и наследник сёгуната Токугавы, должен быть поощрен к формированию нового кабинета министров, который будет продвигать создание нашей новой конституции. При этом у нас больше не будет временного премьер-министра, и порядок до начала раздора окончательно восстановится."
 JAP_ichiro_hatoyama_focus:0 "Премьер-министр Ичиро Хатояма"
 JAP_ichiro_hatoyama_focus_desc:0 "Ичиро Хатояма, нынешний лидер правящего Риккена Сейюкай, должен быть поощрен сформировать новый кабинет, который будет продвигать создание нашей новой конституции. При этом у нас больше не будет временного премьер-министра, и порядок до начала раздора окончательно восстановится."
 JAP_mitsumasa_yonai_focus:0 "Премьер-министр Мицумаса Йонаи"
 JAP_mitsumasa_yonai_focus_desc:0 "Мицумаса Йонаи, умеренный адмирал, который был важной частью прозападной фракции в военно-морском флоте, должен быть поощрен сформировать новый кабинет, который будет продвигать создание нашей новой конституции. При этом у нас больше не будет временного премьер-министра, и порядок до начала раздора окончательно восстановится."
 JAP_limit_the_emperors_power:0 "Ограничить власть императора"
 JAP_limit_the_emperors_power_desc:0 "Император остается важной частью нашего общества, но все еще может быть угрозой для нашей демократии, если он пожелает. Мы должны попытаться ограничить власть нашего конституционного монарха, чтобы мы никогда больше не потеряли наши демократические ценности."
 JAP_ensure_civil_liberties:0 "Обеспечить гражданские свободы"
 JAP_ensure_civil_liberties_desc:0 "С возвращением мира и процветания нашей стране настало время выполнить некоторые из обещаний, которые мы дали. Мы должны обеспечить, чтобы все гражданские свободы могли быть реализованы в новой Японии, и начать производство новых фильмов для продвижения нашей демократии."
 JAP_crush_the_internal_factions:0 "Раздавить внутренние фракции"
 JAP_crush_the_internal_factions_desc:0 "Соперничество между фракциями внутри страны, соперничающими за одобрение императора, имело разрушительные последствия. Теперь, когда правительство снова полностью контролирует ситуацию, настало время укрепиться и показать другим внутренним фракциям, что с нами не надо связываться."
 JAP_democratic_war_with_manchukuo:0 "Завершить борьбу"
 JAP_democratic_war_with_manchukuo_desc:0 "Квантунская армия разорвала с нами связи со времен гражданской войны и взяла под свой контроль Маньчжурию. Люди там до сих пор живут под авторитарным гнетом, который мы когда-то делали, и нуждаются в спасении. Пришло время закончить то, что мы начали."
 MAN_kwantung_army_took_control_flag:0 "Квантунская армия взяла под свой контроль Маньчжурию"
 JAP_democratic_war_with_china:0 "Защита Шанхайского поселения"
 JAP_democratic_war_with_china_desc:0 "Люди в Шанхайском международном урегулировании в настоящее время находятся под угрозой со стороны коррумпированного китайского режима и их приспешников. Мы должны вмешаться и спасти их, чтобы кровь не пролилась без необходимости!"
 JAP_closer_ties_with_the_usa:0 "Более тесные связи с США"
 JAP_closer_ties_with_the_usa_desc:0 "С демократическим строем, который сейчас обеспечен в нашей стране, наши дипломаты усердно работают над восстановлением отношений, которые военные запятнали, начиная с Соединенных Штатов Америки. Мы должны подойти к ним и посмотреть, сможем ли мы заключить сделку, которая обеспечит нашу дружбу на долгие годы."
 JAP_ally_the_philippines:0 "Союзник Филиппин"
 JAP_ally_the_philippines_desc:0 "Недавно восстановив связи со своими бывшими повелителями, возможно, настало время расширить и предложить своим владельцам новые возможности. [PHI.GetAdjective] Правительство приглашает их присоединиться к нашему альянсу. Как мы видим, мы оба выиграем от этой сделки."
 JAP_strike_the_soviets:0 "Ударить старого соперника"
 JAP_strike_the_soviets_desc:0 "Мы стоим оплотом против большевиков, которые украли у нас северное Карафуто. Со времен Сибирской экспедиции и русско-японской войны наш народ вновь жаждет борьбы с Россией. [SOV.GetNameDef]Чтобы окончательно вытеснить их из Восточной Сибири и обезопасить нашу сферу влияния."
 JAP_free_colonized_asian_countries:0 "Свободные колонизированные страны Азии"
 JAP_free_colonized_asian_countries_desc:0 "В Азии есть много стран, которые в настоящее время находятся под оккупацией западных держав. Как новые хранители Азии, мы должны подойти к этим западным людям и попытаться сделать предложения, от которых они не могут отказаться, предоставив нам контроль над этими колониями."
 JAP_free_colonized_asian_countries_tt:0 "Разблокировать решения на §YСпрос на власть§! из §YАзиатские нации§! которые являются субъектами §YНеазиатские страны§!"
 JAP_fund_resistance_groups_in_asia:0 "Группы сопротивления в Азии"
 JAP_fund_resistance_groups_in_asia_desc:0 "На нашем континенте есть много людей, которые борются против иностранного угнетения и которые с радостью примут нашу помощь, если мы предложим ее. Мы должны использовать это как возможность ослабить западные державы и содействовать свободе и свободе для всей Азии!"
 JAP_fund_resistance_groups_in_asia_tt:0 "Разблокировать §Yрешения§! - усиление сопротивления и получение бонусов за атаки в оккупированных азиатских государствах;"
 JAP_sea_rekindle_the_old_alliance:0 "Восстановление старого союза"
 JAP_sea_rekindle_the_old_alliance_desc:0 "Наши лучшие шансы на успех связаны с нашим бывшим союзником в Великой войне. Мы восстановим старый союз и будем вместе с ним. [ENG.GetNameDef] В защиту демократии."
 JAP_create_greater_east_asian_treaty_organization:0 "Организация Западно-Тихоокеанского договора"
 JAP_create_greater_east_asian_treaty_organization_desc:0 "Наш собственный союз с другими азиатскими странами позволит нам твердо противостоять любым потенциальным угрозам нашему новому образу жизни. Настало время принять нашу судьбу как хранителей континента и начать вести ее в будущее."
 JAP_greater_east_asian_treaty_organization:0 "Организация Договора о Великой Восточной Азии"
 JAP_create_greater_east_asian_treaty_organization_tt:0 "Разблокировать решения о приглашении §YНейтралитет§! и §Yдемократический§! §Yазиатский§! и §Yокеанский§! Страны в нашей фракции"
 JAP_form_greater_east_asian_customs_union:0 "Создание Большого Восточно-Азиатского таможенного союза"
 JAP_form_greater_east_asian_customs_union_desc:0 "Как давно планировали наши экономические теоретики, мы должны стремиться к созданию Тихоокеанского таможенного союза и медленно, но верно объединять азиатские экономики в одну мощнейшую силу."
 JAP_form_greater_east_asian_currency_union:0 "Формирование Большого восточноазиатского валютного союза"
 JAP_form_greater_east_asian_currency_union_desc:0 "Мы должны двигаться к использованию единой валюты во всей Азии, которую наши старые политические теоретики называли блоком Йен. Настало время сделать еще один шаг к этой цели и создать валютный союз для всех наших новообретенных союзников."
 JAP_form_greater_east_asian_currency_union_tt:0 "Разблокирует решения о приглашении наших союзников на §YВалютный союз§!"
 JAP_an_integrated_union:0 "Интегрированный союз"
 JAP_an_integrated_union_desc:0 "Интеграция экономик наших союзников с нашей и создание Азиатского центрального банка, который может контролировать и помогать экономическому положению других государств, будет очень выгодно для нас в долгосрочной перспективе, не только укрепляя нас, но и увеличивая их зависимость от нас, в конечном итоге позволяя нам взять под контроль их внешние дела."
 JAP_an_integrated_union_tt:0 "Каждый §YЧлен фракции§! будет получать §YСобытие:§! [JAP.GetNameDefCap] Желание дальнейшей интеграции нашей экономики"
 JAP_an_integrated_union_2_tt:0 "Разблокирует решение пригласить союзников, чтобы иметь их §YЭкономика становится все более интегрированной§! с нашей стороны, что позволяет нам §YПопытка подчинить их дипломатическим путем§! после"
 JAP_greater_east_asian_federation:0 "Большая восточноазиатская федерация"
 JAP_greater_east_asian_federation_desc:0 "Наконец-то настал день, когда мы сможем объединить азиатские народы под одним государством! Мы должны действовать быстро, чтобы интегрировать наши составные части и сформировать Большую восточноазиатскую федерацию, распространяя демократию во все уголки Азии."
 JAP_allied_civilian_administration_integration_tt:0 "Отключает решения для: §YИнтеграция гражданских администраций наших субъектов§!Позволяя нам §YПриложение§! наш §YЩенки§!"
 JAP_greater_east_asian_federation_tt:0 "Мы будем известны как §YВеликая Восточно-Азиатская Федерация§!"
 JAP_greater_east_asian_federation_2_tt:0 "Разблокировать решения для интеграции §Yазиатский§! государств, находящихся под нашим §YКонтроль§!"
 JAP_democratic_womens_suffrage:0 "Избирательное право для женщин"
 JAP_democratic_womens_suffrage_desc:0 "Итикава Фузае уже давно выступает за расширение избирательного права, включив в него женщин. Теперь, когда политическая ситуация стабилизировалась, пришло время предоставить избирательное право женщинам Японии, чтобы они тоже могли внести свой вклад в наш растущий успех."
 JAP_launch_the_income_doubling_plan:0 "Запуск плана удвоения доходов"
 JAP_launch_the_income_doubling_plan_desc:0 "Осаму Шимомура, экономист, недавно присоединившийся к Совету по экономической стабилизации Японии, предложил план удвоения доходов, который, по его словам, будет играть центральную роль в экономическом планировании, помогая заложить основу для нашего высокоскоростного экономического роста. Мы должны принять его предложение и посмотреть, куда оно нас приведет."
 JAP_reform_the_education_system:0 "Реформировать систему образования"
 JAP_reform_the_education_system_desc:0 "Нынешняя система образования по-прежнему содержит все недостатки имперских институтов и не может достаточно эффективно охватить наших детей, что приводит к тому, что мы отстаем от западных стран. Мы должны реформировать его с максимальной поспешностью, чтобы он не остался таким."
 JAP_democratic_women_in_the_workforce:0 "Женщины в рабочей силе"
 JAP_democratic_women_in_the_workforce_desc:0 "Гендер уже давно является определяющим фактором в том, где человек должен служить своей стране, будь то на фронте, на фабриках или дома. Стремясь к более равномерному разделению бремени, мы допускаем увеличение рабочей силы и увеличение армии в случае необходимости."
 JAP_taiheyo_belt:0 "Пояс Тайхэйо"
 JAP_taiheyo_belt_desc:0 "Наши экономисты ссылаются на новый план по созданию зоны урбанизации, которую они называют поясом Тайхэйё, который простирается от Токио до Фукуоки, соединяя районы в мегаполисе, что позволит облегчить передвижение и экономические и промышленные усилия на большей части южных родных островов. Мы должны сделать это реальностью!"
 JAP_shinkansen:0 "Проект Shinkansen"
 JAP_shinkansen_desc:0 "Главный инженер Хидео Шима разработал план создания линии скоростного поезда, которую он называет Токайдо Синкансен, которая соединит Токио, Нагою и Осаку, обеспечивая быструю и легкую транспортировку как грузов, так и гражданских лиц между нашими крупными городами. Мы должны инвестировать в этот проект."
 JAP_shinkansen_tt:0 "Когда национальный дух §Y$JAP_shinkansen_construction_idea$§! удаляется:\n"
 JAP_pursue_international_trade:0 "Осуществлять международную торговлю"
 JAP_pursue_international_trade_desc:0 "Хотя мы торгуем с иностранными державами с тех пор, как коммодор Мэтью Перри покончил с нашей изоляцией, этого было недостаточно. Мы должны сосредоточиться на международном рынке и гарантировать, что мы сможем получить необходимые ресурсы с помощью дипломатии, а не войны."
 JAP_seek_foreign_investments:0 "Ищите иностранные инвестиции"
 JAP_seek_foreign_investments_desc:0 "Теперь, когда мы открылись дальше, мы должны использовать наши вновь налаженные связи для привлечения инвестиций иностранного капитала и стимулирования наших собственных отраслей."
 JAP_seek_foreign_investments_tt:0 "Разблокировать решения на §YПривлечение иностранных инвестиций§! выигрывать §YГражданские заводы§! В обмен на §YПолитическая власть§!"
 JAP_invest_in_foreign_industries:0 "Инвестировать в зарубежные отрасли"
 JAP_invest_in_foreign_industries_desc:0 "Мы должны использовать огромные суммы капитала, которые мы получили, чтобы инвестировать в иностранные государства, предоставляя им экономическую помощь в обмен на получение части их природных ресурсов, помогая другим азиатским странам при решении наших собственных проблем в этом процессе."
 JAP_invest_in_foreign_industries_tt:0 "Разблокировать §YРешения§! Инвестировать в несовершеннолетние §Yазиатский§! Индустрия в обмен на ресурсы"
 JAP_democratic_foreign_exchange_allocation_policy:0 "Политика распределения иностранной валюты"
 JAP_democratic_foreign_exchange_allocation_policy_desc:0 "Фондовый рынок является мощным инструментом. Мы должны использовать поток иностранного капитала и обеспечить, чтобы наши экономисты и промышленники могли инвестировать как можно больше в нашу растущую нацию."
 JAP_democratic_research_slot:0 "Реорганизовать Токийский Императорский Университет"
 JAP_democratic_research_slot_desc:0 "Токийский Имперский Университет до сих пор работает в рамках нашей старой системы образования. Чтобы получить новое поколение интеллектуальных талантов, которые могут помочь нашей стране в достижении лучшего будущего, мы должны инвестировать в него и изменить учебную программу, чтобы она была менее контролируемой национальной политикой."
 JAP_offshore_coal:0 "Расширение оффшорных угольных мощностей"
 JAP_offshore_coal_desc:0 "Острова Икесима и Хашима у побережья Нагасаки служат жизненно важными угольными шахтами, чтобы выкопать его с морского дна. Мы должны расширить эти шахты и построить больше домов на островах, чтобы разместить еще большую постоянную рабочую силу."
 JAP_democratic_nationalize_zaibatsus:0 "Национализировать Зайбацус"
 JAP_democratic_nationalize_zaibatsus_desc:0 "Крупнейшие корпорации нашей страны уже давно обладают беспрецедентной политической и экономической мощью. Здесь все кончается. Контроль государства не будет оспариваться. Мы должны национализировать их и использовать их капитал на благо народа!"
 JAP_split_uo_zaibatsu_monopolies:0 "Раскол монополий Зайбацуса"
 JAP_split_uo_zaibatsu_monopolies_desc:0 "Крупнейшие корпорации нашей страны уже давно обладают беспрецедентной политической и экономической мощью. Мы должны напомнить им, что они по-прежнему подчиняются желаниям правительства, и разделить их на более мелкие конгломераты Keiretsu, чтобы ими было легче управлять."
 JAP_democratic_work_with_the_zaibatsus:0 "Работа с Zaibatsus"
 JAP_democratic_work_with_the_zaibatsus_desc:0 "Крупнейшие корпорации нашей страны уже давно обладают беспрецедентной политической и экономической мощью. С некоторыми тонкостями мы можем работать вместе с ними и направлять их усилия в нашу пользу."
 JAP_lifetime_employment:0 "пожизненная занятость"
 JAP_lifetime_employment_desc:0 "Шушин коё уже давно используется нашими крупными компаниями, начиная с первых экономических успехов в 1920-х годах. Мы должны сделать так, чтобы эта определяющая характеристика японской корпоративной культуры помогла нам достичь экономического чуда, чтобы однажды мы могли превзойти даже экономики Запада."
 JAP_modernize_agriculture:0 "Модернизация сельского хозяйства"
 JAP_modernize_agriculture_desc:0 "Сельскохозяйственный сектор так же важен, как и промышленный. В конце концов, наша промышленность не будет работать, если мы не сможем прокормить всё население нашей страны. Поэтому мы должны инвестировать в разработку новых инструментов и улучшение дорожных сетей, которые соединяют наши сельские деревни с нашими городскими городами."
 JAP_civilian_nuclear_reactor_investments:0 "Гражданские инвестиции в ядерный реактор"
 JAP_civilian_nuclear_reactor_investments_desc:0 "Как определили наши ученые из института RIKEN, ядерная энергетика будет энергией будущего. Мы должны инвестировать в эту новую технологию, поэтому нам, возможно, больше никогда не придется сжигать уголь."
 JAP_civilian_nuclear_reactor_investments_tt:0 "Заменить §Y$JAP_early_industrialization_efforts_dm$§! с §Y$JAP_the_economic_mirale_dm$§!Эффективные изменения:"
 JAP_guardian_of_the_pacific:0 "Хранитель Тихого океана"
 JAP_guardian_of_the_pacific_desc:0 "Мы возьмем на себя роль хранителя всех азиатских государств в Тихом океане и вокруг него. Освободившись от западного империализма, они потребуют руководящей руки, чтобы поднять их как полноценные демократии. Первым шагом к достижению этой цели является предложение стать новым защитником [ENG.GetNameDef]Тихоокеанские колониальные подданные."
 JAP_build_diet_building_landmark_tt:0 "\nЗаменяет собой §Y$landmark_tokyo_imperial_palace$§! с помощью §Y$landmark_national_diet$§!"
 JAP_build_hakko_ichiu_landmark_tt:0 "создает §Y$landmark_hakko_ichiu$§! в [1018.GetName]"
 JAP_the_koiso_cabinet:0 "Кабинет Койсо"
 JAP_the_koiso_cabinet_desc:0 "С императором выражается растущее недоверие к возможностям [ROOT.GetLeader] Он выразил желание объединить нацию и найти выход из войны, чтобы избежать окончательного уничтожения нации. Несмотря на то, что Койсо не пользуется популярностью среди политиков и генералов, он может вывести страну из конфликта."
 JAP_the_war_has_not_necessarily_developed_focus:0 "Острая оппозиция восточно-азиатскому конфликту"
 JAP_the_war_has_not_necessarily_developed_focus_desc:0 "Поскольку соперничество между армией и флотом по-прежнему остается занозой на нашей стороне, а наша стратегия прекращения войны путем нанесения жесткого удара по нашим врагам потерпела неудачу, похоже, что у нас почти нет вариантов. Возможно, пришло время принять бесчестье и начать эру, свободную от конфликтов."
 JAP_the_war_has_not_necessarily_developed_focus_tt:0 "Радикальные части вооруженных сил попытаются свергнуть правительство, чтобы помешать императору транслировать капитуляцию наших народов."
 JAP_japans_longest_day:0 "Самый длинный день Японии"
 JAP_japans_longest_day_desc:0 "С бесчестным премьер-министром и его приспешниками покончено, а ошибающийся император помещен под домашний арест. Теперь пришло время активизировать военные усилия и вернуть нашу нацию к славе, которой она предназначена."
 JAP_the_surrender_broadcast:0 "Трансляция The Surrender"
 JAP_the_surrender_broadcast_desc:0 "Мы глубоко рассмотрели общие тенденции мира и нынешнее положение Империи, и мы решили принять чрезвычайные меры, чтобы положить конец нынешнему положению дел. Военная ситуация сложилась не обязательно в пользу Японии, и мы должны принять этот факт."
 JAP_the_surrender_broadcast_tt:0 "Мы с большей вероятностью сможем сохранить контроль над островами, если мы сдадимся мирно."
 PRC_military_shortcut:0 "Военный"
 PRC_economy_shortcut:0 "Экономика"
 PRC_unwilling_diarchy_shortcut:0 "Политика: нежелательная диархия"
 PRC_bolshevik_shortcut:0 "Политика: 28 1⁄2 большевиков"
 PRC_mao_shortcut:0 "Политика: Мао"
 PRC_winning_border_war_result_tt:0 "By §Yвыигрыш§! тот §YПограничная война§!:"
 PRC_losing_border_war_result_tt:0 "By §Yпроигрывать§! тот §YПограничная война§!Мы выиграем:"
 PRC_has_been_infiltrated_tt:0 "Успешно был §Yпроникнутый§!"
 PRC_every_allied_warlord_tt:0 "Каждый §Yсоюзник§! Китайский военачальник:"
 PRC_this_might_anger_current_china_leader_tt:0 "Это действие может разозлить §H[WTT_current_china_leader.GetNameDef]§!"
 PRC_SOV_more_willing_to_send_lend_lease_tt:0 "§Y[SOV.GetNameWithFlag]§! будет более охотно отправлять ленд-лиз"
 PRC_USA_more_willing_to_send_lend_lease_tt:0 "§Y[USA.GetNameWithFlag]§! будет более охотно отправлять ленд-лиз"
 PRC_unlock_complete_infiltration_tt:0 "Разблокировать §Y3-й уровень $PRC_infiltration_sea_cat$§! Решения:"
 PRC_neighboring_SOV_tt:0 "§Y[ROOT.GetName]§! должна иметь прямое или косвенное пограничное сообщение через §YЧлены фракции§!с §Y[SOV.GetName]§!"
 PRC_request_territory_tt:0 "Просит, чтобы §YОсновные страны будут переданы§! к нашей опеке, если они §Yне принадлежащий§! их текущим контролером или владельцем §Y[ROOT.GetRulingIdeology]§!. \nТекущий эффект:"
 PRC_said_no_to_cuf:0 "Второй объединенный фронт"
 PRC_put_an_end_to_the_sufan:0 "Положить конец суфанам"
 PRC_put_an_end_to_the_sufan_desc:0 "Когда мы вошли в [622.GetName]Лидер местного ЦК Политбюро Лю Жидан и другое местное руководство находились в процессе чистки в антиконтрреволюционной кампании.$PRC_bo_gu$ Пора положить конец этой чепухе."
 PRC_usurp_control_over_yanan:0 "Усурпский контроль над Яньань"
 PRC_usurp_control_over_yanan_desc:0 "[1032.GetName] К югу от нас это логичный следующий шаг в попытке восстановить прочную базу."
 PRC_usurp_control_over_yanan_tt:0 "Если [ROOT.GetName] это §Yво фракции§! с §Y[CHI.GetName]§! Иные страны контролируют §Y[1032.GetName]§!и любой из §Y[744.GetName]§! и §Y[283.GetName]§!:"
 PRC_the_westward_expedition:0 "Расширение на запад"
 PRC_the_westward_expedition_desc:0 "[NXM.GetNameDefCap] Запад представляет собой прекрасную возможность для нас расшириться. Если мы организуем стычку вдоль границы [1045.GetName]Мы могли бы извлечь выгоду из их невнимательности к нам."
 PRC_the_eastward_expedition:0 "Восточная экспедиция"
 PRC_the_eastward_expedition_desc:0 "К востоку от нас [SHX.GetLeader] правила [615.GetName]Но мы могли бы проникнуть через их защиту через Желтую реку."
 PRC_develop_yanan_soviet:0 "Развивайте Яньаньский Совет"
 PRC_develop_yanan_soviet_desc:0 "Теперь нам удалось установить контроль над [1032.GetName]Это дает нам возможность расширить наши базовые зоны. Теперь мы сделаем [1032.GetName] Местопребывание нашего правительства."
 PRC_the_internal_enemy:0 "Внутренний враг"
 PRC_the_internal_enemy_desc:0 "Борьба против [CHI.GetLeader] и правительство [CHI.GetRulingParty] Это продолжается уже десять лет. Мы помним о чистке 12 апреля 1927 года и должны обеспечить, чтобы такое унижение никогда не повторялось."
 PRC_know_the_enemy:0 "Знать врага"
 PRC_know_the_enemy_desc:0 "Наши соседи пока могут быть дружелюбными, но мы должны принять меры предосторожности, чтобы проверить их защиту, если ситуация изменится."
 PRC_unlock_border_defense_raids_tt:0 "Разблокировать §Y$raid_type_PRC_probe_border_defenses_raid$§! Рейды против §Y$STATE_615$§! и §Y$STATE_1045$§!"
 PRC_cooperate_ulanhu:0 "Сотрудничать с Ulanhu"
 PRC_cooperate_ulanhu_desc:0 "Юн Цзэ, или Уланху, является преданным коммунистическим бойцом из Монголии, в настоящее время организующим к северу от наших базовых районов. Он предложил взять свои силы, чтобы присоединиться к нам. [ROOT.capital.GetName] Бороться на нашей стороне."
 PRC_know_the_enemy_tt:0 "с §Y$PRC_the_westward_expedition$§!, §Y$PRC_the_eastward_expedition$§!и §Y$PRC_usurp_control_over_yanan$§! завершено:"
 PRC_burn_the_paper_tigers:0 "Сожгите бумажных тигров"
 PRC_burn_the_paper_tigers_desc:0 "Мы будем стремиться к [CHI.GetName] и всем остальным добиваться формирования Второго единого фронта против наших общих врагов."
 PRC_rally_the_peasants:0 "Ралли крестьян"
 PRC_rally_the_peasants_desc:0 "Крестьянство формирует нашу главную базу власти, из-за неумелого управления. [CHI.GetNameDef]. Нам многое нужно сделать для того, чтобы добиться обещанных реформ."
 PRC_rally_the_28_bolsheviks:0 "Собрание 28 1⁄2 большевиков"
 PRC_rally_the_28_bolsheviks_desc:0 "В эти трудные времена необходимо в полной мере использовать обширные знания 28 полубольшевиков, обученных в Советском Союзе в качестве руководителей правительства и армии."
 PRC_guide_central_committee:0 "Руководствуйтесь Центральным Комитетом"
 PRC_guide_central_committee_desc:0 "Мы должны установить четкий курс для ЦК. Если мы не сможем сохранить единство нашей партии, мы никогда не сможем надеяться на объединение Китая."
 PRC_leadership_of_mao:0 "Лидерство $PRC_mao_zedong$"
 PRC_leadership_of_mao_desc:0 "Мао проявил себя в «Долгом марше», и он стал более влиятельным благодаря своему мастерству. В конце концов, если мы не хотим быть ограниченными нашими нынешними границами, нам понадобится сильное руководство."
 PRC_expel_the_occupiers:0 "Изгнать оккупантов"
 PRC_expel_the_occupiers_desc:0 "Всякий раз, когда у нас есть силы сделать это, мы должны изгнать иностранные силы из Китая, поскольку в противном случае они не остановятся ни перед чем, чтобы подорвать нас ради собственной выгоды."
 PRC_restore_territorial_integrity:0 "Восстановление территориальной целостности"
 PRC_restore_territorial_integrity_desc:0 "Мы попросим тех, кто предан нашему делу, просто передать землю."
 PRC_seek_support_from_ussr:0 "Ищите поддержку от [SOU.GetNameDef]"
 PRC_seek_support_from_ussr_desc:0 "Наш давний союзник, [SOU.GetNameDef]Он оказал решающую помощь нашей революции. Но для того, чтобы революция увенчалась успехом, мы должны просить их увеличить эту помощь. В конце концов, успех нашей революции позволил бы им сосредоточить свои усилия на других рубежах."
 PRC_request_guarantees:0 "Запрос территориальной гарантии"
 PRC_request_guarantees_desc:0 "Наш новый курс, вдохновлённый Советским Союзом, очень выиграл бы от их защиты. Предоставление гарантий безопасности не было бы для них без риска, но важность, которую оно будет иметь в отговаривании потенциальных врагов, делает его стоящим."
 PRC_request_guarantees_tt:0 "§R[SOV.GetNameDefCap] Мы можем попросить вас стать субъектом в обмен на гарантию.§!"
 PRC_on_guerilla_warfare:0 "О партизанской войне"
 PRC_on_guerilla_warfare_desc:0 "Как теоретик и автор по партизанской войне, Мао и его вновь обретенная власть обеспечат надлежащее использование наших небольших независимых сил."
 PRC_dissent_in_the_united_front:0 "[GetDissentFocusName]"
 PRC_dissent_in_the_united_front_default:0 "Разногласия в едином фронте"
 PRC_dissent_in_the_united_front_alt:0 "Несогласие с Sow в [ROOT.GetFactionName]"
 PRC_dissent_in_the_united_front_desc:0 "Даже когда мы сражаемся вместе с нашими союзниками, мы должны подчеркнуть преимущества нашей собственной идеологии. Это может привлечь наших сторонников, возможно, даже среди тех, кто играет важную роль по другую сторону альянса."
 PRC_dissent_in_the_united_front_1_tt:0 "Когда в §Yфракция§! с [CHI.GetNameWithFlag]:"
 PRC_halves_infiltration_cost_tt:0 "§GПоловину стоимости§! для принятия §Y$PRC_infiltration_sea_cat$§! Решения"
 PRC_establish_friendly_bases:0 "Создание баз за линиями врагов"
 PRC_establish_friendly_bases_desc:0 "Большое количество гражданских лиц на оккупированной территории не доставляет нашим проникновителям никаких проблем, поскольку они совершают акты саботажа."
 PRC_establish_friendly_bases_1_tt:0 "Решение Unlocks: §YУстановить саботажные операции§!"
 PRC_establish_friendly_bases_2_tt:0 "§RОккупированные государства противника§! который имеет §Y$PRC_guerilla_cells_active_2$§! или является §YОсновное государство§! Субъект с иностранным повелителем теперь может получить §Y$PRC_anti_japanese_base$§!"
 PRC_secure_the_peoples_support:0 "Обеспечить поддержку народа"
 PRC_secure_the_peoples_support_desc:0 "Несмотря на то, что у нас нет контроля над большей частью Китая, мы должны обеспечить лояльность его народа нашему делу на случай, если гражданская война снова разразится."
 PRC_secure_the_peoples_support_tt:0 "Разблокировать все §Y3 уровня§! из §Y$PRC_infiltration_sea_cat$§! Решения."
 PRC_rural_recruitment:0 "Сельский набор"
 PRC_rural_recruitment_desc:0 "Оккупант никогда не может надеяться контролировать все сельские поселения, что позволяет нам набирать там с минимальным риском."
 PRC_rural_recruitment_tt:0 "Когда §Yпроникновение§! а §Yсельский§!, §Yразвитый сельский§! или §Yпасторский§! государство, получать §G[?PRC_rural_recruitment_manpower]§! Власть"
 PRC_raid_weapon_depots:0 "Оружейные склады"
 PRC_raid_weapon_depots_desc:0 "Наши усилия по проникновению позволили нам составить карту логистических сетей наших врагов. Мы можем использовать это для рейдов по этим сетям, используя захваченное оборудование, чтобы выставить еще больше агентов."
 PRC_raid_weapon_depots_tt:0 "Разблокировать §Y$raid_type_PRC_weapons_depot_raid$§! где бы то ни было [ROOT.GetNameWithFlag] установленный §YПартизанские клетки§! или §Y$PRC_anti_japanese_base$§! Для того, чтобы получить §Y$infantry_equipment$§! и §Y$artillery$§!"
 PRC_empower_the_guerillas:0 "Расширяйте полномочия партизан"
 PRC_empower_the_guerillas_desc:0 "По мере того, как наши партизанские силы приобретают опыт, мы можем позволить им действовать независимо. Это позволит силам проникнуть еще дальше и предотвратить их компрометацию, если наш контакт с ними будет перехвачен."
 PRC_empower_the_guerillas_tt:0 "§GПоловину стоимости§! для принятия §Y$PRC_guerilla_warfare_sea_cat$§! Решения и разблокировки Решения о замене §Y$PRC_guerilla_cells_active_1$§! с §Y$PRC_guerilla_cells_active_2$§!. Эффективные изменения:"
 PRC_holding_half_the_sky:0 "Удерживая половину неба"
 PRC_holding_half_the_sky_desc:0 "Положение женщин в китайском обществе долгое время было неравным. Стремясь к равенству, мы должны изменить и это. Как однажды сказал Мао: Женщины держат половину неба, и мы должны позволить им внести свой вклад в революцию."
 PRC_question_the_faction_leadership:0 "Вопрос о лидерстве фракции"
 PRC_question_the_faction_leadership_desc:0 "Чтобы получить дальнейшее влияние, мы должны подчеркнуть ошибки, допущенные руководством нашего альянса, и при этом подчеркнуть наши собственные успехи."
 PRC_to_unify_a_country:0 "Чтобы объединить страну"
 PRC_to_unify_a_country_desc:0 "С укреплением наших позиций как в политическом, так и в военном отношении на территории других военачальников мы должны требовать от нас получения ресурсов и признания, которых это заслуживает."
 PRC_to_unify_a_country_tt:0 "Руки над любым государством, которое успешно §Yпроникнутый§! через §Y[ROOT.GetName]§!"
 PRC_strengthen_the_central_party_school:0 "Укрепление центральной партийной школы"
 PRC_strengthen_the_central_party_school_desc:0 "Обучение новых партийных чиновников через Центральную партийную школу означает, что 28 полубольшевиков и их сторонников, прошедших обучение в Советском Союзе, постепенно будут уступать по численности чиновникам, обученным этой школой."
 PRC_propaganda_efforts:0 "Усилия по пропаганде"
 PRC_propaganda_efforts_desc:0 "Пропаганда является ключевой частью вербовки последователей для нашей революции, а также поддержания уверенности наших уже набранных последователей. Наша пропаганда может быть использована нашими союзниками, когда они сплотят свое население для защиты Китая."
 PRC_propaganda_efforts_1_tt:0 "получать прибыль §G[?PRC_gain_faction_inluence_number|%]§! §YВлияние фракции§! Для каждого §YПартизанская война§! Решение и §Yпроникновение§! [CHI.GetAdjective] Государства"
 PRC_propaganda_efforts_2_tt:0 "получать прибыль §G[?PRC_gain_faction_inluence_number|%]§! §YВлияние фракции§! Для каждого §YПартизанская война§! Решение"
 PRC_establish_yanan_university:0 "Учреждение Яньаньского университета"
 PRC_establish_yanan_university_desc:0 "Нынешняя сеть отдельных школ искусств, наук и политического образования весьма неэффективна. Объединив эти школы, мы могли бы более эффективно обучать и расширять области знаний наших студентов, обмениваясь ими."
 PRC_peaceful_reunification:0 "Стремитесь к мирному воссоединению"
 PRC_peaceful_reunification_desc:0 "Мы являемся настоящими лидерами Китая, и этот факт должен быть признан раз и навсегда. Мы будем стремиться убедить [WTT_current_china_leader.GetNameDef] этого факта. Если они откажутся... Хорошо... Народ увидит их такими, какие они есть."
 PRC_adopt_sun_yat_sens_principles:0 "Принять принципы Сунь Ят-сена"
 PRC_adopt_sun_yat_sens_principles_desc:0 "Принципы Сунь Ятсена: национализм, демократия и благосостояние отнюдь не являются взаимоисключающими с коммунистическими ценностями, к которым мы стремимся. Его видение, которое когда-то стабилизировало Китай, теперь может быть реализовано."
 PRC_establish_democratic_socialism:0 "Установить демократический социализм"
 PRC_establish_democratic_socialism_desc:0 "Наши главные достижения для Китая могут быть увековечены в учебниках истории, но когда тяжелые времена вернутся, эти достижения не будут много значить. И поэтому народ должен чувствовать, что он может руководить революцией и привлекать правительство к ответственности своим голосованием, если оно когда-либо не справится со своими обязанностями."
 PRC_form_central_social_affairs_department:0 "Формирование Центрального отдела по социальным вопросам"
 PRC_form_central_social_affairs_department_desc:0 "Корректировка цели нашей революции неизбежно приведет к дискуссиям между ее сторонниками и противниками. Однако этот идеологический дискурс рискует перейти к антиреволюционным темам, и поэтому мы должны создать разведывательную службу для мониторинга последствий укрепления маоизма."
 PRC_reform_the_republic:0 "Реформирование республики"
 PRC_reform_the_republic_desc:0 "Республика была хорошей идеей, плохо исполненной. Мы являемся истинными последователями идеалов Республики."
 PRC_asian_democratic_union:0 "Азиатский демократический союз"
 PRC_asian_democratic_union_desc:0 "Для продвижения равенства мы должны сотрудничать с нашими азиатскими партнерами, чтобы они имели сильную переговорную позицию на мировой арене."
 PRC_asian_democratic_union_tt:0 "§Y$PRC_asian_democratic_union_modifier$§! увеличение §YСкорость исследований§! через §G+1.00%§! и §YПроизводитель потребительских товаров Factor§! через §G+2.0%§! для каждого нового члена фракции, до максимальной скорости исследования §G+10.0%§! Производитель потребительских товаров Factor §Y-20.0%§!"
 PRC_yanan_rectification_movement:0 "Движение за ректификацию Яньань"
 PRC_yanan_rectification_movement_tt:0 "В зависимости от текущей стоимости в §Y$PRC_communist_power_struggle$§!, §Y$PRC_maoism_dynamic_modifier$§! Получат разные модификаторы.\nТекущий эффект:"
 PRC_yanan_rectification_movement_desc:0 "Успехи нашего режима до сих пор можно отнести к Мао, и мы должны использовать этот престиж для укрепления маоизма в нашей партии. Изменение партийной конституции, включающее идеи Мао Цзэдуна, и утверждение, что это первая форма коммунизма, адаптированная к конкретным условиям Китая, усложнит противодействие этим идеям."
 PRC_enforce_maoism:0 "Закрепить маоизм"
 PRC_enforce_maoism_desc:0 "Для дальнейшего укрепления позиций маоизма мы должны полностью связать идеологию с руководством государства и партии, сделав Мао символом всей нации."
 PRC_deepen_the_dixie_mission:0 "Углубление сотрудничества миссии Dixie"
 PRC_deepen_the_dixie_mission_desc:0 "Обязательство [USA.GetNameDef] В своем сотрудничестве с [ROOT.GetNameDef] Восхитительно. Возможно, они захотят расширить миссию Дикси. [USA.GetAdjective] Специалисты модернизируют нашу отрасль."
 PRC_invite_the_dixie_mission:0 "Приглашаем на миссию Дикси"
 PRC_invite_the_dixie_mission_desc:0 "Как растущая держава в Азии, мы должны выяснить, [USA.GetNameDef] Они заинтересованы в установлении дипломатических отношений. Возможно, они, в отличие от империалистических держав вокруг нас, были бы готовы помочь построить Китай, который может защитить себя от внешних угроз."
 PRC_overthrow_the_ussr:0 "Уничтожить лжекоммунистов"
 PRC_overthrow_the_ussr_desc:0 "Идеологические разногласия между нами и другими коммунистическими державами не только объясняют нашу адаптацию к ситуации в Китае. Реакционная и тоталитарная политика этих держав зашла слишком далеко, и мы должны вмешаться, чтобы их пролетариат мог освободиться от их запутанной формы революции."
 PRC_overthrow_the_ussr_tt:0 "Прибыль §YПриложение§! Цель войны против всех крупных коммунистических стран. Текущий эффект:"
 PRC_two_soviets_together:0 "Два советских человека, вместе"
 PRC_two_soviets_together_desc:0 "Несмотря на изменившийся курс, который мы установили с нашей идеологией, у нас по-прежнему есть прочные идеологические связи с нашей страной. [SOV.GetNameDef]И, конечно же, не забыли о своей материальной и политической поддержке на протяжении многих лет."
 PRC_tech_agreement_with_ussr:0 "Соглашение о новых оборонных технологиях"
 PRC_tech_agreement_with_ussr_desc:0 "Продвинутое состояние нашей революции позволяет нам вносить свой вклад в наше партнерство с исследованиями. [SOV.GetNameDef]. После того, как мы догоним их технологию в различных областях, мы можем поделиться нашей оценкой их оборудования, без предубеждений, присущих его разработке."
 PRC_the_end_of_capitalism:0 "Конец капитализма"
 PRC_the_end_of_capitalism_desc:0 "Наше тесное сотрудничество с [SOV.GetNameDef] Он укрепил наш союз настолько, что теперь он может бросить вызов капиталистическим державам. Вместе мы сможем распространить революцию и освободить их колониальные земли."
 PRC_purge_the_world_of_fascism:0 "Очистить мир от фашизма"
 PRC_purge_the_world_of_fascism_desc:0 "Несмотря на обещания отойти от капитализма, ненависть фашистов к коммунизму является достаточным доказательством того, что это всего лишь фарс. Радикальные средства, которые мы применяем для освобождения пролетариата, используются фашистами для его подавления, и против этого надо вмешаться."
 PRC_hundred_regiments_offensive:0 "Наступательные действия сотен полков"
 PRC_hundred_regiments_offensive_desc:0 "Расширение нашей армии и её организации на множество самостоятельных контингентов позволит нам нанести ущерб линиям снабжения противника."
 PRC_prepare_for_the_inevitable:0 "Приготовьтесь к неизбежному"
 PRC_prepare_for_the_inevitable_desc:0 "Экспансионистские увертюры от обоих [JAP.GetNameDef]И, возможно, даже нашего традиционного союзника. [SOV.GetNameDef] На горизонте вырисовывается. Мы должны отложить в сторону идеологические озабоченности и подготовиться к тому, чтобы выступить единым фронтом против внешних угроз."
 PRC_ask_for_soviet_lend_lease:0 "Запросить советский ленд-лиз"
 PRC_ask_for_soviet_lend_lease_desc:0 "$PRC_secure_lend_lease_from_soviet_desc$"
 PRC_reclaim_the_grasp_of_power:0 "Восстановление тяги к власти"
 PRC_reclaim_the_grasp_of_power_desc:0 "Власть, сместившаяся к Мао из-за его военного руководства Длинным маршем, наконец возвращается к бывшим лидерам партии. После долгого марша, $PRC_wang_ming$ или $PRC_bo_gu$ Готовьтесь снова взять на себя роль лидера."
 PRC_playing_both_sides:0 "Играть обе стороны"
 PRC_playing_both_sides_desc:0 "Мы должны стремиться обеспечить лояльность людей в полевых командирах и [CHI.GetAdjective] Государства, если когда-нибудь настанет время для решающей битвы за будущее нашей страны."
 PRC_the_fight_of_a_people:0 "Борьба одного народа"
 PRC_the_fight_of_a_people_desc:0 "Наш народ должен сопротивляться наступлению наших врагов, даже когда они оказываются на оккупированной ими территории. Мы должны послать небольшие отряды, чтобы сплотить местное сопротивление, чтобы эффективно подорвать оккупанта и в конечном итоге освободить родину."
 PRC_a_stronger_united_front:0 "Сильнейший единый фронт"
 PRC_a_stronger_united_front_desc:0 "Мы должны показать [CHI.GetName] Мы являемся надежным союзником, чтобы они не чувствовали необходимости держать ресурсы в резерве на случай, если мы разорвем альянс. Нам будет позволено больше участвовать в принятии решений."
 PRC_sino_allied_pact_of_non_aggression:0 "Китайско-союзнический пакт о ненападении"
 PRC_sino_allied_pact_of_non_aggression_desc:0 "Поскольку мы устраняем иностранное влияние из Китая, мы должны обеспечить, чтобы не вмешивались менее экспансионистские крупные державы."
 PRC_sino_allied_pact_of_non_aggression_accept_tt:0 "Они будут подписывать §YПакт о ненападении§! с §Y[ROOT.GetName]§!"
 PRC_with_inspiration_from_nkvd:0 "С вдохновением от НКВД"
 PRC_with_inspiration_from_nkvd_desc:0 "Советское НКВД, о котором многие из наших руководителей слышали благодаря своим связям с советскими чиновниками, должно служить примером того, как защититься от врагов изнутри."
 PRC_soviet_technological_cooperation:0 "Советское технологическое сотрудничество"
 PRC_soviet_technological_cooperation_desc:0 "Мы будем смотреть в сторону [SOV.GetNameDef] Мы должны заключить соглашение о проведении исследований для содействия делу обеих наших стран."
 PRC_reestablish_moscow_sun_yat_sen_university:0 "Восстановление Московского университета Сунь Ят-сен"
 PRC_reestablish_moscow_sun_yat_sen_university_desc:0 "Восстанавливая и увеличивая финансирование Московского университета Сунь Ятсена, мы можем помочь направить и улучшить нацию, поддерживая будущие поколения ученых в духе 28 с половиной, которые были до этого."
 PRC_a_truly_united_front:0 "Истинно единый фронт"
 PRC_a_truly_united_front_desc:0 "Нам необходимо укрепить наш дипломатический корпус и улучшить положение Второго объединенного фронта."
 PRC_a_truly_united_front_tt:0 "§GПоловину стоимости§! для принятия §Y$PRC_28_bolshevik_faction_cat$§! решения"
 PRC_part_of_the_comintern:0 "Часть Коминтерна"
 PRC_part_of_the_comintern_desc:0 "С развитием революции внутри страны мы можем сосредоточиться на оказании помощи Коминтерну в достижении его международных целей."
 PRC_petition_for_freedom:0 "Петиция за независимость"
 PRC_petition_for_freedom_desc:0 "Слишком долго наша независимость была в руках других — пришло время изменить это раз и навсегда."
 PRC_petition_for_freedom_not_subject_tt:0 "§YНикакого эффекта, если не субъект§!"
 PRC_aggressive_pursuit_of_diplomacy:0 "Агрессивное стремление к дипломатии"
 PRC_aggressive_pursuit_of_diplomacy_desc:0 "Хотя мы хотели бы использовать более цивилизованные формы дипломатии, иногда угроза насилия является тем, что необходимо для того, чтобы наша воля возобладала. И если угроза не сработает..."
 PRC_supreme_infiltration:0 "Высшая инфильтрация"
 PRC_supreme_infiltration_desc:0 "Благодаря нашему предыдущему опыту инфильтрации мы получили знания, которые теперь можем использовать для расширения таких операций, привлекая все больше и больше наших соотечественников на нашу сторону."
 PRC_scholarly_revolution:0 "Стипендиальная революция"
 PRC_scholarly_revolution_desc:0 "Наши лидеры пришли из интеллигенции, и мы должны формировать будущее нашей страны. [ROOT.GetAdjective] через их линзы."
 PRC_towards_one_china:0 "На пути к одному Китаю"
 PRC_towards_one_china_desc:0 "Государства-воины слишком сильно подрывают стабильность Китая, чтобы оставаться в живых, и поэтому централизованное руководство должно быть установлено."
 PRC_towards_one_china_bypass_tt:0 "§YКаждая китайская нация§!Один из следующих должен быть истинным: \n  Не существует\n  находится в состоянии войны с §Y[ROOT.GetNameWithFlag]§!\n  Является предметом §Y[ROOT.GetNameWithFlag]§!\n  находится во фракции с §Y[ROOT.GetNameWithFlag]§!\n  §Y[ROOT.GetName]§!имеет §YЦель войны§! против них."
 PRC_towards_one_china_tt:0 "Прибыль §YПриложение§! Цель войны против любой несоюзной китайской страны. Текущий эффект:"
 PRC_allow_autonomous_regions:0 "Разрешить автономные районы"
 PRC_allow_autonomous_regions_desc:0 "Уникальные требования каждого региона в Китае должны быть признаны, если они позволяют определенную степень автономии."
 PRC_allow_autonomous_regions_tt:0 "\nКаждый §Yсоюзная китайская страна§! может выбрать стать §Y[ROOT.GetNameDef]?§! Субъект. Текущий эффект:"
 PRC_the_peoples_republic:0 "Народная республика"
 PRC_the_peoples_republic_desc:0 "Теперь, когда революция прочно утвердилась, мы можем начать переход от революционного государства к тому, которое своими реформами может предложить своим гражданам стабильность и процветание."
 PRC_remove_iniltration_and_guerilla_decisions_tt:0 "§RУдалить§! §Y$PRC_infiltration_sea_cat$§! и §Y$PRC_guerilla_warfare_sea_cat$§! Решения"
 PRC_taiwan:0 "Безопасный Тайвань"
 PRC_taiwan_desc:0 "Потеря Тайваня японцами со стороны бывшего правительства Цин должна быть отменена, даже если необходимость воздушной или военно-морской поддержки представляет собой уникальную проблему."
 PRC_reclaim_tibet:0 "Восстановление Тибета"
 PRC_reclaim_tibet_desc:0 "Нестабильность в Китае позволила [TIB.GetNameDef] Мы хотим отойти от китайского правления, но исторические связи между нашими странами нельзя игнорировать. Мы должны стремиться воссоединиться с ними, чтобы наша граница снова достигла Гималаев."
 PRC_subjugate_korea:0 "Покорить Корею"
 PRC_subjugate_korea_desc:0 "Оккупация Кореи путем [JAP.GetNameDef] Последующая экспансия в Маньчжурию показывает, что союзническая Корея имеет решающее значение для развития страны. [ROOT.GetAdjective] безопасность. Если в настоящее время это не вариант, мы должны вмешаться."
 PRC_dare_to_struggle:0 "Осмелюсь бороться..."
 PRC_dare_to_struggle_desc:0 "Теперь, когда на нашей стороне находятся полевые государства, пришло время бороться с иностранными захватчиками, которые колонизировали часть Китая."
 PRC_dare_to_win:0 "... Осмелюсь победить"
 PRC_dare_to_win_desc:0 "экспансия империалистических предшественников [SOV.GetNameDef] Китайские земли были прощены в пользу лучших отношений, но не забыты. Мы должны попытаться восстановить наши первоначальные границы сейчас, когда у нас есть средства для этого."
 PRC_move_capital:0 "Переместите столицу"
 PRC_move_capital_desc:0 "После формирования этого $PRC_proclaimed_communism$Естественно, что мы перенесем наше место в правительстве и восстановим название города в Пекин."
 PRC_beijing_capital_name:0 "Пекин"
 PRC_education_reform:0 "Реформа образования"
 PRC_education_reform_desc:0 "Мы предпримем шаги, чтобы обеспечить быструю общенациональную образовательную реформу, направленную на принятие высшего образования в советском стиле, с акцентом на инженерное и техническое образование."
 PRC_the_first_premier:0 "Первый премьер-министр"
 PRC_the_first_premier_desc:0 "$PRC_zhou_enlai$ Он будет назван первым премьером $PRC_proclaimed_communism$Укрепляя свои позиции в качестве одного из ведущих политиков партии."
 PRC_the_party_builds_the_nation:0 "Партия строит нацию"
 PRC_the_party_builds_the_nation_desc:0 "Теперь, когда мы контролируем большие участки Китая, пришло время начать общенациональную кампанию по использованию нашего населения и растущей промышленности."
 PRC_the_chinese_century:0 "Китайский век"
 PRC_the_chinese_century_desc:0 "Экономический рост в сочетании с достаточной политической властью, чтобы сформировать мир, - это то, к чему эта страна стремилась и что теперь получила. Подъем Китая начинается сейчас - это наш век."
 PRC_the_unwilling_diarchy_focus:0 "Неохотная диархия"
 PRC_the_unwilling_diarchy_focus_desc:0 "Отчаянные времена требуют отчаянных мер - мы должны заменить существующие партийные органы, чтобы новое руководство имело возможность быстро действовать против любого врага народа.\n\nМао и Готао должны отложить в сторону свои разногласия и работать вместе."
 PRC_the_unwilling_diarchy_focus_tt:0 "Вы не сможете сформировать или присоединиться к §YВторой Объединенный фронт§!"
 PRC_the_response_to_a_threat:0 "Реакция на угрозу"
 PRC_the_response_to_a_threat_desc:0 "Мы сделаем все, что нужно, чтобы ответить на все угрозы, которые нас окружают. Мы должны подготовиться к нападению."
 PRC_promote_regular_army:0 "Содействовать регулярной армии"
 PRC_promote_regular_army_desc:0 "Только обычными средствами мы можем обеспечить, чтобы Красная Армия была способна защищать и расширять территории Красной Армии. [ROOT.GetNameDef]."
 PRC_strict_training_regiments:0 "Строгие тренировочные полки"
 PRC_strict_training_regiments_desc:0 "Мы должны ужесточить дисциплину Красной Армии.\n\nЕжедневные утренние тренировки в кратчайшие сроки приведут к созданию профессиональной армии, а также улучшат качество набора новобранцев."
 PRC_army_reforms:0 "Армейские реформы"
 PRC_army_reforms_desc:0 "Красная Армия устарела и основана на старой доктрине, которая не верна после Долгого Марша. Мы должны восстановить армию с нуля.\n\nНовая серия реформ, проведенных [ROOT.GetLeader] Вместе с ведущими генералами мы приведем к созданию новой, более сильной Красной Армии."
 PRC_centralized_army_command:0 "Центральное командование армии"
 PRC_centralized_army_command_desc:0 "Децентрализованная команда не будет служить нам хорошо. Вся информация должна поступать через новую командную структуру, чтобы увеличить надлежащее оперативное планирование с самого верха до самого низкого набора."
 PRC_soviet_battle_tactics:0 "Советская боевая тактика"
 PRC_soviet_battle_tactics_desc:0 "Подражая тактике [SOV.GetNameDef]Мы можем стремиться использовать нашу собственную, сопоставимую по численности силу в наших интересах. У нас будет команда офицеров, которым будет поручено извлечь уроки из этого. [SOV.GetNameDef]Опыт."
 PRC_promote_guerilla_warfare:0 "Продвижение партизанской войны"
 PRC_promote_guerilla_warfare_desc:0 "Красная Армия не может надеяться на то, чтобы соответствовать силе наших врагов — по крайней мере, пока.\n\nМы должны играть на свои силы и сражаться в тылу врага, прежде чем быстро исчезнуть, чтобы снова нанести удар."
 PRC_the_battle_behind_the_front_lines:0 "Битва за вражескими линиями"
 PRC_the_battle_behind_the_front_lines_desc:0 "Мы должны удвоить наши усилия, чтобы нанести удар по иностранным агрессорам за их линиями. Препятствуя их снабжению и способности укреплять свои линии фронта, мы вынуждаем противника тратить ценную рабочую силу для защиты своего тыла."
 PRC_gain_the_peoples_trust:0 "Получить доверие народа"
 PRC_gain_the_peoples_trust_desc:0 "Мы проникнем в окружающую сельскую местность, подкупая и угрожая соответствующим лицам, чтобы обеспечить лояльность людей в районах, которые в настоящее время не контролируются нами. Нам понадобится их поддержка в ближайшие дни."
 PRC_limited_infiltration_efforts:0 "Ограниченные инфильтрационные усилия"
 PRC_limited_infiltration_efforts_desc:0 "Мы должны сделать все возможное, чтобы объединить Китай всеми необходимыми средствами. Народ Китая должен осознать, что мы не забыли о них, и оказать им материальную и нематериальную поддержку, если настанет день, когда это будет необходимо."
 PRC_secure_the_lands:0 "Обеспечьте безопасность земель"
 PRC_secure_the_lands_desc:0 "Мы ближе, чем когда-либо, к достижению наших целей - мы не должны колебаться сейчас. Нам нужно тратить больше ресурсов, чтобы убедить население под контролем ложного правительства в справедливости нашего дела."
 PRC_launch_sabotage_campaigns:0 "Запуск кампаний саботажа"
 PRC_launch_sabotage_campaigns_desc:0 "Саботажные операции против агрессоров помогут делу Красной Армии и затруднит продвижение противника."
 PRC_raiding_parties:0 "Рейдерские партии"
 PRC_raiding_parties_desc:0 "То, чего нам не хватает в промышленной мощи, по сравнению с врагом, мы компенсируем изобретательностью. Отправка рейдерских партий не только поможет стабилизировать ситуацию с нашим оборудованием, но и ухудшит их."
 PRC_mobilization_of_the_people:0 "Мобилизация народа"
 PRC_mobilization_of_the_people_desc:0 "Во время кризиса народ будет подниматься.\n\nМы создадим отряды милиции во главе с ветеранами Долгого Марша, будем вербовать и вооружать местное население."
 PRC_mobilization_of_the_people_tt:0 "создавать §Y4 Китайских§! подразделения милиции"
 PRC_mao_zedong_ascends:0 "$PRC_mao_zedong$ Вознесение"
 PRC_mao_zedong_ascends_desc:0 "$PRC_mao_zedong$ Остаться в одиночестве как истинный лидер [ROOT.GetNameDef].\n\n$PRC_zhang_guotao$ Не может быть больше на одном уровне с председателем Мао, может быть только один лидер."
 PRC_promote_womens_suffrage:0 "Поощрение избирательного права женщин"
 PRC_promote_womens_suffrage_desc:0 "«Женщины держат половину неба». Истинное гендерное равенство является целью партии, и мы должны принять меры для обеспечения правового, политического, социального и экономического участия женщин по всему Китаю."
 PRC_zhang_guotao_ascends:0 "$PRC_zhang_guotao$ Вознесение"
 PRC_zhang_guotao_ascends_desc:0 "$PRC_zhang_guotao$ Остаться в одиночестве как истинный лидер [ROOT.GetNameDef].\n\n$PRC_mao_zedong$ Он больше не может быть на том же уровне, что и председатель Готао, может быть только один лидер."
 PRC_consolidate_politcal_power:0 "Консолидация политической власти"
 PRC_consolidate_politcal_power_desc:0 "Один лидер сейчас стоит на вершине, и нам жизненно важно это консолидировать во всех партийных структурах. Диссидентов нельзя допускать."
 PRC_consolidate_politcal_power_tt:0 "Двигай §Y$PRC_communist_power_struggle$§! на передовую сторону. Текущий эффект:"
 PRC_secure_lend_lease_from_soviet:0 "Безопасный ленд-лиз от [SOV.GetNameDef]"
 PRC_secure_lend_lease_from_soviet_desc:0 "Предыдущие попытки установить связь с землей [SOV.GetNameDef] провалилась катастрофически. Но теперь, когда мы это преодолели, получать от них поставки будет гораздо легче."
 PRC_preemptive_strike:0 "Упреждающий удар"
 PRC_preemptive_strike_desc:0 "Последствия восстания 1927 года в Наньчане показывают, насколько эффективными могут быть националистические силы. Чтобы не допустить очередного Длинного марша, мы должны нанести удар первыми, совершая собственные окружения и эксплуатируя свои более выгодные позиции."
 PRC_an_end_to_the_japanese_threat:0 "Конец для тебя [JAP.GetAdjective] Угроза"
 PRC_an_end_to_the_japanese_threat_desc:0 "The [JAP.GetAdjective] Присутствие на нашем пороге представляет постоянную угрозу, поскольку их империалистические амбиции не показали никаких пределов. Если мы нанесем удар первыми, то сможем застать их врасплох."
 PRC_assume_leadership:0 "Возьмем лидерство"
 PRC_assume_leadership_desc:0 "[GetAssumeLeaderShipText]"
 PRC_assume_leadership_tt:0 "В зависимости от текущей стоимости в §Y$PRC_communist_power_struggle$§!, §Y[ROOT.GetLeader]§! Они будут иметь разные черты.\nТекущий эффект:"
 PRC_GetAssumeLeaderShipText_Wentian:0 "Должность нашего нового председателя должна быть бесспорной. Мы должны двигаться вперед как партия и нация."
 PRC_GetAssumeLeaderShipText_NotWentian:0 "Должность нашего нового председателя должна быть бесспорной. Бывший председатель $PRC_zhang_wentian$ Он сыграл свою роль в стабилизации партии, но сейчас настало время. [ROOT.GetLeader]."
 PRC_emergency_supply_protocols:0 "Протоколы аварийного снабжения"
 PRC_emergency_supply_protocols_desc:0 "Наша система снабжения ненадежна. Мы должны направить все наши усилия на его улучшение, чтобы наши войска не остались без оружия, боеприпасов и продовольствия."
 PRC_emergency_prodction_protocols:0 "Протоколы аварийного производства"
 PRC_emergency_prodction_protocols_desc:0 "Чтобы увеличить производство в военное время, мы должны установить квоты на производство для нашей промышленности. Такая мера рискует оттолкнуть наших сторонников, но в настоящее время альтернативы нет."
 PRC_extend_emergency_measures:0 "Продлить чрезвычайные меры"
 PRC_extend_emergency_measures_desc:0 "Мы как никогда близки к решению наших наиболее важных проблем, но мы должны продолжать наши усилия, иначе они окажутся напрасными."
 PRC_extend_emergency_measures_1_tt:0 "с §Y$PRC_emergency_supply_protocols$§! завершенный, §Yувеличение продолжительности [?PRC_emergency_protocol_idea_days] дни§!или:"
 PRC_extend_emergency_measures_2_tt:0 "с §Y$PRC_emergency_prodction_protocols$§! завершенный, §Yувеличение продолжительности [?PRC_emergency_protocol_idea_days] дни§!или:"
 PRC_to_support_the_army:0 "Чтобы поддержать армию"
 PRC_to_support_the_army_desc:0 "Мы будем делать то, что должны, чтобы продлить уже принятые меры, сделав эти изменения постоянными. Армия должна иметь то, что ей нужно, чтобы руководить революцией."
 PRC_to_support_the_army_1_tt:0 "с §Y$PRC_emergency_supply_protocols$§! завершено:"
 PRC_to_support_the_army_2_tt:0 "с §Y$PRC_emergency_prodction_protocols$§! завершено:"
 PRC_reach_out_to_the_west:0 "Доберитесь до Запада"
 PRC_reach_out_to_the_west_desc:0 "Несмотря на неоднократные действия против [ROOT.GetAdjective] В прошлом у Запада было много ресурсов, которые могли бы помочь росту. [ROOT.GetNameDef] в мировую державу."
 PRC_reach_out_to_the_west_tt:0 "Если не фашист, §YЗападный майор§! Он сражается против общего врага, и ни один из его союзников не сражается друг с другом."
 PRC_closer_ties_to_sov:0 "Более тесные связи с [SOV.GetName]"
 PRC_closer_ties_to_sov_desc:0 "Мы должны стремиться к еще более тесным отношениям с [SOV.GetNameDef]. Китайско-советские связи прочны, но их необходимо укреплять."
 PRC_demand_warlord_loyalty:0 "Требуйте лояльности военачальников"
 PRC_demand_warlord_loyalty_desc:0 "Мы должны объединить Китай под одним руководством, и мы должны дать понять всем, чье руководство будет таким.\n\nМы направим послание полевым командирам - предложение создать правительство национальной обороны.[CHI.GetLeader] Возможно, не одобрят, но это необходимо."
 PRC_bring_war_to_neighboring_warlords:0 "Принесите войну соседним полевым командирам"
 PRC_bring_war_to_neighboring_warlords_desc:0 "В Китае может быть только один правитель — первым шагом к распространению революции будет покорение военачальников."
 PRC_bring_war_to_neighboring_warlords_tt:0 "Прибыль §YПриложение§! Цель войны против всех §Yсоседние военачальники§!. Текущие эффекты: "
 PRC_lessons_of_the_west:0 "Уроки Запада"
 PRC_lessons_of_the_west_desc:0 "Мы будем смотреть за пределы наших границ, чтобы увидеть, какие уроки могут быть извлечены из других стран, учась у тех, чьи отрасли достигли пределов, которых у нас еще нет.\n\nМы должны догнать."
 PRC_the_long_march_towards_progress:0 "Долгий путь к прогрессу"
 PRC_the_long_march_towards_progress_desc:0 "Мы должны продолжать прогрессировать. Мы можем отставать в технологическом плане, но мы не останемся таковыми. Ресурсы должны быть направлены на укрепление образовательного сектора. [ROOT.GetNameDef]."
 PRC_every_peasant_a_soldier:0 "Каждый крестьянин — солдат"
 PRC_every_peasant_a_soldier_desc:0 "Каждый способный бодибилдер, который трудится на полях, должен быть готов взять в руки оружие, если оно понадобится нации.\n\nРеволюционная война есть война масс. Только мобилизуя массы и опираясь на них, можно ее вести."
 PRC_every_peasant_a_soldier_1_tt:0 "с §Y$PRC_promote_guerilla_warfare$§! Завершено:"
 PRC_every_peasant_a_soldier_2_tt:0 "с §Y$PRC_promote_regular_army$§! Завершено:"
 PRC_avenge_the_century_of_humiliation:0 "Отомстить за век унижений"
 PRC_avenge_the_century_of_humiliation_desc:0 "1800-е годы представляли собой столетие унижения со стороны западных держав. Настало время вернуть долг."
 PRC_avenge_the_century_of_humiliation_tt:0 "[ROOT.GetNameWithFlag] прибыль §YЗавоевание (Фокус)§! Цель войны против любого соседа §YЗападная страна§! или его субъектов. Текущие эффекты:"
 PRC_the_march_to_victory:0 "Марш к победе"
 PRC_the_march_to_victory_desc:0 "Марш к победе неизбежен. То, что начиналось как нежелательная диархия, привело к созданию сильной и единой партийной структуры. Теперь мы должны смотреть вовне, на наших внутренних врагов."
 PRC_a_new_central_committee:0 "Новый Центральный Комитет"
 PRC_a_new_central_committee_desc:0 "Настало время перемен.$PRC_zhang_guotao$ Закажут полномасштабный пересмотр ЦК и построят его с нуля."
 PRC_a_new_central_committee_tt_1:0 "Для §Y180 дней§!:"
 PRC_a_new_central_committee_tt_2:0 "Тогда: "
 PRC_expedite_land_revolution:0 "Ускорить земельную революцию"
 PRC_expedite_land_revolution_desc:0 "Перераспределение земли от помещиков к крестьянам разрушило феодальные постройки в деревне. Сельские массы теперь твердо стоят за революцией."
 PRC_halt_land_revolution:0 "Прекратить земельную революцию"
 PRC_halt_land_revolution_desc:0 "Для поддержания стабильности революционная земельная программа была отложена. В то время как крестьянство ворчит, местные элиты умиротворены, и кратковременная внутренняя сплоченность сохраняется."
 PRC_reestablish_the_state_bank:0 "Восстановление Государственного банка"
 PRC_reestablish_the_state_bank_desc:0 "Чтобы правильно управлять нашей экономикой, нам нужно будет восстановить наш центральный банк. The $PRC_communism$ Национальный банк был основан в Центральном Китае, но «Длинный марш» вынудил его прекратить свою деятельность. С тех пор его оборудование находится в пути и теперь начинает поступать в [ROOT.capital.GetCapitalVictoryPoint.GetName]."
 PRC_promote_the_silver_dollar:0 "Продвижение серебряной монеты"
 PRC_promote_the_silver_dollar_desc:0 "Вывод медных монет из обращения в пользу серебра позволит переработать старый металл для производства боеприпасов. Внутренняя стоимость наших монет также означает, что нашим торговым партнерам не нужно беспокоиться об увеличении или уменьшении стоимости нашей валюты, поскольку она связана со стоимостью серебра."
 PRC_promote_paper_bills:0 "Продвижение бумажных банкнот"
 PRC_promote_paper_bills_desc:0 "Бумажные деньги с недорогими производственными затратами станут хорошей заменой медным монетам, которые можно будет перерабатывать на заводах по производству боеприпасов. Однако основным недостатком является то, что наши торговые партнеры могут нервничать по поводу валюты, которую мы могли бы легко изменить, просто напечатав больше."
 PRC_new_currency_established:0 "Такой подход позволит избежать негативных последствий §Y$PRC_equipment_from_copper_coins$§! Если они еще не произошли."
 PRC_allow_special_goods_trade:0 "Разрешить торговлю специальными товарами"
 PRC_allow_special_goods_trade_desc:0 "Торговля специальными товарами — это то, что правительство должно признать и использовать, обеспечивая частичный контроль путем налогообложения."
 PRC_ban_special_goods_trade:0 "Запрет на торговлю специальными товарами"
 PRC_ban_special_goods_trade_desc:0 "Несмотря на популярность спецтоваров, наркомания – серьезная проблема, которую мы должны решать с запретом. Даже если такая реформа изначально была бы непопулярной, крайне важно не допустить превращения специальных товаров в препятствие для революции, как это было раньше с алкоголем. [SOV.GetNameDef]."
 PRC_ban_special_goods_trade_tt:0 "Обновленный §YНациональный дух§! который действует через год, будет: "
 PRC_agricultural_reform:0 "Аграрная реформа"
 PRC_agricultural_reform_desc:0 "Теперь, когда мы обеспечили контроль над ресурсами нашей экономики, мы должны продолжать сельскохозяйственную реформу, предоставляя землю от помещиков более бедным фермерам."
 PRC_agricultural_reform_tt:0 "Изменения §Y$PRC_agrarian_society$§! вводить §Y$PRC_agrarian_reform$§! которые предоставляют:"
 PRC_eight_points_for_attention:0 "Восемь пунктов для внимания"
 PRC_eight_points_for_attention_desc:0 "The $PRC_eight_points_for_attention$как установлено $PRC_mao_zedong$ Укажите важность: быть вежливым, когда говорите, быть честным при покупке и продаже, возвращать все заимствованные предметы, платить компенсацию за все поврежденное, не бить или ругаться на других, не наносить ущерб урожаю, не преследовать женщин, не плохо обращаться с заключенными."
 PRC_CSCEC_mils:0 "Специализация SCEC - Военная промышленность"
 PRC_CSCEC_mils_desc:0 "Мы настоятельно призываем КГЭИК специализироваться на военном строительстве и использовать все средства для этого. Мы должны улучшить наше военное производство, чтобы иметь шанс в ближайшие годы."
 PRC_CSCEC_civs:0 "Специализация CSCEC - Гражданская промышленность"
 PRC_CSCEC_civs_desc:0 "Мы будем призывать КГЭИК специализироваться на промышленном строительстве, ведь именно в этом и заключаются сильные стороны КГЭЦ."
 PRC_industrialization_efforts:0 "Начать индустриализацию"
 PRC_industrialization_efforts_desc:0 "Последнее увеличение производства сельскохозяйственной продукции позволяет некоторым нашим людям работать в других отраслях. Приоритетное внимание следует уделить переезду в те отрасли, которые позволяют обеспечить дальнейший рост, например, производство строительных материалов или инструментов для фермерских хозяйств."
 PRC_construct_the_banqiao_dam:0 "Строительство плотины Banqiao"
 PRC_construct_the_banqiao_dam_desc:0 "Плотина на реке Ру в [602.GetName] Он может обеспечить регион электроэнергией. Это также поможет предотвратить наводнения, которые были особенно серьезными в последние десятилетия."
 PRC_resource_extraction_focus:0 "Добыча ресурсов"
 PRC_resource_extraction_focus_desc:0 "Нам нужно будет более комплексно использовать природные ресурсы на нашей территории, чтобы увеличить промышленный рост."
 PRC_connecting_the_country:0 "Соединяя страну"
 PRC_connecting_the_country_desc:0 "Расширение нашей промышленности и растущая потребность в распределении товаров, ранее произведенных в самодостаточных, но менее эффективно работающих сообществах, сделали инфраструктуру более важной, чем когда-либо."
 PRC_establish_shorter_market_plans:0 "Установить более короткие рыночные планы"
 PRC_establish_shorter_market_plans_desc:0 "Жесткие долгосрочные планы для нашей экономики могут обещать большие выгоды, но с большими затратами и рисками. Вместо этого мы должны сосредоточиться на том, чтобы убедиться, что отрасль, которой мы уже обладаем, имеет средства для оптимальной работы."
 PRC_initialize_five_year_plan:0 "Инициировать первый пятилетний план"
 PRC_initialize_five_year_plan_desc:0 "Цель Первого пятилетнего плана – улучшить производство в отрасли, которая у нас уже есть, прежде чем использовать избыточное производство для создания промышленности в совершенно новых секторах."
 PRC_urbanization:0 "Содействие урбанизации"
 PRC_urbanization_desc:0 "Чтобы способствовать развитию тяжелой промышленности, мы должны поощрять ранее самодостаточных фермеров работать в нашей отрасли, в то время как государство гарантирует, что другие фермеры производят достаточно, чтобы распределить в городах и сельской местности."
 PRC_rural_region_development:0 "Развитие сельских районов"
 PRC_rural_region_development_desc:0 "Для улучшения качества жизни в [ROOT.GetNameDef]Производство продуктов питания должно быть увеличено за счет инвестиций в модернизацию фермерских хозяйств в сельской местности."
 PRC_finalize_industrial_plan:0 "Окончательное выполнение промышленного плана"
 PRC_finalize_industrial_plan_desc:0 "С завершением наших планов реформ мы можем завершить наш промышленный план, убедившись, что новый исследовательский центр и производственные мощности будут сотрудничать как можно больше."
 PRC_great_production_movement:0 "Великое производственное движение"
 PRC_great_production_movement_desc:0 "Нехватка продовольствия в [ROOT.GetNameDef]Усугубленные серией стихийных бедствий, мы поощряли изменения в сообществах, которые ранее полагались на правительство в плане продовольствия. Они отважились отправиться на ранее непродуктивные земли, чтобы основать фермы, и теперь наши войска должны поделиться своим инженерным опытом со своими товарищами."
 PRC_equipment_from_copper_coins:0 "Оборудование из медных монет"
 PRC_equipment_from_copper_coins_desc:0 "Поскольку у нас нет крупной горнодобывающей промышленности, медные монеты можно выплавить и использовать для пуль или другой техники."
 PRC_rally_the_industry:0 "Ралли промышленности"
 PRC_rally_the_industry_desc:0 "Переезд привел к дезорганизации нашей отрасли. Мы должны изучить, что мы можем сделать из производственных инструментов, которые мы привезли на «Долгом марше», и попытаться повторно использовать эти забытые ресурсы наших оригинальных баз."
 PRC_red_army_reborn:0 "Возрожденная Красная Армия"
 PRC_red_army_reborn_desc:0 "Наша новая база в [622.GetName] должны быть затвердевшими. Некоторые наши потери могут быть компенсированы вербовкой местных добровольцев, и мы должны составить планы по защите нашего нового дома."
 PRC_asymmetric_warfare:0 "Асимметричная война"
 PRC_asymmetric_warfare_desc:0 "На протяжении веков превосходящие по численности армии стремились преодолеть невозможные трудности, и мы должны использовать преимущества, которых нет у наших врагов. Лучшее знание местности, связи с местными гражданскими лицами и партизанская тактика могут быть использованы, чтобы получить преимущество."
 PRC_conventional_warfare:0 "Обычная война"
 PRC_conventional_warfare_desc:0 "Хотя борьба с затяжной войной на истощение имеет свои преимущества, она не лишена недостатков. Ограничивая себя оппортунистическими атаками, мы становимся уязвимыми для ударов по нашим производственным объектам. Трудно поднять боевой дух, одерживая множество маленьких побед, и, избегая больших сражений, мы могли бы затянуть конфликты, которые в противном случае могли бы закончиться раньше."
 PRC_indirect_fire:0 "Косвенный огонь"
 PRC_indirect_fire_desc:0 "Мы сосредоточимся на создании улучшенных артиллерийских сил, ориентированных на обеспечение непрямого огня по нашим врагам."
 PRC_three_rules_of_discipline:0 "Введение трех правил дисциплины"
 PRC_three_rules_of_discipline_desc:0 "Как Мао формализовал в 20-х годах в рамках своей военной стратегии, если мы хотим получить больше поддержки от населения, крайне важно, чтобы наши войска не использовали свою власть для кражи собственности. И если мы хотим в полной мере воспользоваться нашими ограниченными ресурсами, то крайне важно также, чтобы предметы, которые отбираются у противника, отдавались высшему командованию для распределения."
 PRC_request_for_aid:0 "Запрос о помощи"
 PRC_request_for_aid_desc:0 "[SOV.GetNameDefCap] С самого начала мы поддерживали наши усилия, избегая при этом прямого участия. Однако нынешняя ситуация в мире требует не просто символической поддержки, поэтому миссия должна быть отправлена на запрос. [SOV.GetAdjective] Оборудование, которое поможет создать нашу армию."
 PRC_long_march_to_recovery:0 "Долгий марш к восстановлению"
 PRC_long_march_to_recovery_desc:0 "Долгий марш к [622.GetName] Это привело к огромным потерям для нашей армии. Настало время реорганизовать оставшиеся войска и взять курс на восстановление славы Рабочей и Крестьянской Красной Армии."
 PRC_best_of_the_best:0 "Лучший из лучших"
 PRC_best_of_the_best_desc:0 "Наши вооруженные силы будут сосредоточены на привитии высочайшего уровня качества и профессионализма. Мы должны принимать только тех новобранцев, которые проявляют глубочайшую преданность делу и обладают навыками, соответствующими ему."
 PRC_master_the_terrain:0 "Мастера железной дороги"
 PRC_master_the_terrain_desc:0 "Тренировки для борьбы в горах и создание хороших карт местности позволят нам обойти наших врагов и безопасно уйти после удара."
 PRC_to_steal_an_army:0 "Украсть армию"
 PRC_to_steal_an_army_desc:0 "Поскольку наша ограниченная промышленность не в состоянии удовлетворить потребности нашей армии, стало крайне важно использовать захваченное оборудование, когда это возможно. Это может создать проблемы материально-технического характера, но при надлежащей подготовке и принятии таких мер, как обеспечение поставок запасных частей, они могут быть преодолены."
 PRC_role_of_kangda:0 "Роль Кангда"
 PRC_role_of_kangda_desc:0 "Наша главная военная школа, [622.GetName] Школа Красной Армии, также известная как Канга, ранее была сосредоточена на обучении. Теперь он станет центром инноваций с увеличенным финансированием, ориентированным на разработку доктрин и оборудования, как отечественного, так и зарубежного."
 PRC_develop_the_army:0 "Развивайте армию"
 PRC_develop_the_army_desc:0 "Армия, которую мы построили до сих пор, сейчас работает на полную мощность, пришло время предоставить ей средства для модернизации."
 PRC_to_serve_the_people:0 "Служить народу"
 PRC_to_serve_the_people_desc:0 "Мы должны обеспечить, чтобы наши войска чувствовали, что мы стремимся бороться за то, что отвечает интересам наших народов. Солдаты должны по-прежнему выполнять свой долг перед народом, как и те, кто не состоит в армии."
 PRC_prepare_for_596:0 "Приготовление 596"
 PRC_prepare_for_596_desc:0 "Угроза ядерного оружия невозможна без нашего собственного оружия. Поэтому правительство должно набирать и поддерживать ученых в смежных областях, чтобы они могли подготовить ядерную программу."
 GER_unlock_national_nuclear_corporation_tt:0 "Разблокировать промышленный концерн §Y$PRC_china_national_nuclear_corporation$§!"
 PRC_increase_domestic_production_capacity:0 "Увеличение внутреннего военного производства"
 PRC_increase_domestic_production_capacity_desc:0 "Хотя нам удалось расширить свое влияние ограниченными средствами, пришло время инвестировать в нашу военную промышленность. Если бы мы пережили еще одну затяжную войну, наше оборудование в конечном итоге было бы истощено или нуждалось бы в ремонте, и неспособность предложить замену была бы катастрофической."
 PRC_army_tank_research:0 "Подготовка к отечественному производству танков"
 PRC_army_tank_research_desc:0 "С нашей молодой промышленностью, способной теперь обеспечить более тяжелое вооружение, пришло время догнать другие военные державы и развивать танкостроительные мощности. Это даст нам большое преимущество перед соседними странами без этого оружия и укрепит наши позиции против тех, у кого есть свои бронетанковые силы."
 PRC_army_doctrines:0 "Доктрины в практике"
 PRC_army_doctrines_desc:0 "Доктрина, которую мы кропотливо разрабатывали в ходе различных конфликтов, в которые мы были вовлечены, должна быть адаптирована к нашей новой организации и вооружениям. Без интеграции их преимущества уменьшатся."
 PRC_army_doctrines_tt:0 "Получить бонус на основе выбранного вами §YВеликая Доктрина§!:"
 PRC_army_doctrines_mobile_warfare_tt:0 "За то, что §Y$GRAND_DOCTRINE_MOBILE_WARFARE$§!:"
 PRC_army_doctrines_superior_firepower__tt:0 "За то, что §Y$GRAND_DOCTRINE_SUPERIOR_FIREPOWER$§!:"
 PRC_army_doctrines_grand_battleplan_tt:0 "За то, что §Y$GRAND_DOCTRINE_GRAND_BATTLEPLAN$§!:"
 PRC_army_doctrines_mass_assault_tt:0 "За то, что §Y$GRAND_DOCTRINE_MASS_ASSAULT$§!:"
 PRC_appeal_for_foreign_aid:0 "Обращение за иностранной помощью"
 PRC_appeal_for_foreign_aid_desc:0 "Запросить броню у [SOV.GetNameDef] Это позволит нам создать бронетанковую ветвь внутри нашей армии, а также изучить их конструкции для совершенствования наших собственных."
 PRC_establish_pla_air_force:0 "ВВС Народно-освободительной армии"
 PRC_establish_pla_air_force_desc:0 "По мере того, как мы расширяемся от нашей горной крепости и захватываем все больше низменностей, мы становимся более уязвимыми для воздушных атак. К счастью, в ходе наших экспансий мы также достигли промышленной мощи, необходимой для того, чтобы что-то с этим сделать, и немедленно справимся с уязвимостью, создав свои собственные военно-воздушные силы."
 PRC_appoint_chang_qiankun:0 "Назначение Чан Цянькунь"
 PRC_appoint_chang_qiankun_desc:0 "После учебы в Академии ВВС им. Жуковского в Советском Союзе Чан Цянькунь стал идеальным кандидатом для наблюдения за нашими военно-воздушными силами."
 PRC_the_northeast_aviation_university_sea:0 "Северо-восточный авиационный университет"
 PRC_the_northeast_aviation_university_sea_desc:0 "Создание масштабного учебного центра для наших ВВС стало бы важным шагом вперед. Нам больше не придется полагаться на школы за рубежом, чтобы учить наших офицеров о доктрине, как управлять нашим оборудованием или как передавать эти навыки нашим храбрым пилотам."
 PRC_form_the_5th_research_institute:0 "5-й исследовательский институт"
 PRC_form_the_5th_research_institute_desc:0 "Новости о недавних конфликтах вдохновили план строительства исследовательского центра, ориентированного на реактивные и ракетные двигатели. Объект может быть использован для улучшения конструкции наших самолетов, а затем производить ракеты и ракеты."
 PRC_aviation_infrastructure:0 "Инвестиции в авиационную инфраструктуру"
 PRC_aviation_infrastructure_desc:0 "Масштабы [ROOT.GetNonIdeologyName] Это означает, что для защиты нашего воздушного пространства недостаточно иметь много самолетов. Аэродромы в нужных местах, а также отслеживание активности в нашем воздушном пространстве будут иметь решающее значение."
 PRC_anti_air_effort:0 "Усилия по борьбе с загрязнением воздуха"
 PRC_anti_air_effort_desc:0 "Масштаб нашего воздушного пространства затрудняет обеспечение достаточного количества самолетов и инфраструктуры для покрытия всего этого. Вместо этого зенитные орудия могут быть развернуты для обеспечения защиты от воздушного нападения и создания очень экономичного решения."
 PRC_establish_domestic_aircraft_production:0 "Создание отечественного авиастроительного производства"
 PRC_establish_domestic_aircraft_production_desc:0 "Отечественное производство самолетов позволит снизить зависимость от зарубежных поставщиков, а также адаптировать наши проекты под нужды нашей страны."
 PRC_light_plane_focus:0 "Разработка лёгких самолётов"
 PRC_light_plane_focus_desc:0 "Совершенствование наших легких самолетов позволит нам добиться преимущества в воздушных боях."
 PRC_medium_plane_focus:0 "Разработка среднего самолета"
 PRC_medium_plane_focus_desc:0 "Чтобы улучшить наши возможности по поражению тактических целей, мы должны сосредоточиться на средних самолетах."
 PRC_large_plane_focus:0 "Большие разработки самолетов"
 PRC_large_plane_focus_desc:0 "Сосредоточив внимание на больших самолетах, мы можем достичь конструкций, которые несут тяжелые полезные нагрузки и достаточно топлива для полетов на очень большие расстояния."
 PRC_establish_pla_navy:0 "Флот Народно-освободительной армии"
 PRC_establish_pla_navy_desc:0 "Из-за нашего предыдущего отсутствия доступа к побережью перед нами стоит непростая задача догнать военно-морские силы наших врагов. Военно-морской флот не только позволит нам защитить наше побережье и новые торговые связи, но и распространить наше влияние по морям."
 PRC_dockyard_construction_efforts:0 "Инвестируйте в строительство доков"
 PRC_dockyard_construction_efforts_desc:0 "По мере того, как мы стремимся создать военно-морской флот, нам необходимо будет инвестировать в несколько отраслей промышленности для производства судов, в то время как другие заводы, такие как артиллерийские, должны быть созданы для сотрудничества с совершенно новым сектором."
 PRC_naval_mio:0 "Закрепить нашу военно-морскую промышленность"
 PRC_naval_mio_desc:0 "Учитывая прежнюю нехватку промышленности в военно-морском секторе, правительство должно обеспечить эффективную работу вновь образованных организаций по военно-морскому производству."
 PRC_the_pla_naval_school:0 "Военно-морская школа НОАК"
 PRC_the_pla_naval_school_desc:0 "Новый учебный центр, где обучаются новые офицеры и моряки, может стать централизованным местом для обучения многим навыкам, необходимым на большом корабле, с курсами от навигации до проектирования и обслуживания самолетов."
 PRC_reappoint_jinguang_as_admiral:0 "Повторно назначить Цзинъуаня адмиралом"
 PRC_reappoint_jinguang_as_admiral_desc:0 "Поскольку нашим военным не хватает опыта в военно-морской войне, лучшим кандидатом на руководство нашим новым флотом может быть опытный командующий сухопутными войсками."
 PRC_reappoint_jinguang_as_admiral_tt:0 "§RУдалить [PRC_ziao_jingguang.GetName] Как генерал§!"
 PRC_naval_infrastructure_effort:0 "Усилия морской инфраструктуры"
 PRC_naval_infrastructure_effort_desc:0 "Чтобы работать на очень большом расстоянии от береговой линии [ROOT.GetNonIdeologyName]Мы должны обеспечить военно-морской флот инфраструктурой, которая позволит им быстро дозаправляться или ремонтировать свои суда независимо от их положения."
 PRC_a_modern_army:0 "Современная армия"
 PRC_a_modern_army_desc:0 "Теперь, когда мы усовершенствовали наше оборудование, нашу доктрину, нашу подготовку и многое другое, мы можем быть уверены, что мы максимально подготовлены, независимо от того, с каким врагом мы можем столкнуться."
 PRC_air_force_capstone:0 "Современные ВВС"
 PRC_air_force_capstone_desc:0 "Наши инвестиции в исследования оборудования ВВС должны позволить нам производить самолеты, которые будут превосходить вражеские. Это также будет способствовать плавной интеграции новых достижений, таких как реактивные двигатели."
 PRC_naval_capstone:0 "Современный флот"
 PRC_naval_capstone_desc:0 "Теперь наш флот реорганизован [PRC_ziao_jingguang.GetName] Учитывая ресурсы, необходимые для управления всеми видами морской огневой мощи, мы можем расширить наше влияние на Тихий океан."
 PRC_peoples_liberation_army_sea:0 "Наземные силы Народно-освободительной армии"
 PRC_peoples_liberation_army_sea_desc:0 "В нашей Рабоче-Крестьянской Красной Армии теперь все больше и больше опытных солдат, и настало время полностью принять эту смену характера. При переходе от ополчения к армии хорошо подготовленных и хорошо оснащенных профессиональных солдат настало время сформировать Сухопутные войска Народно-освободительной армии."
 PRC_central_military_commision:0 "Центральная военная комиссия"
 PRC_central_military_commision_desc:0 "В связи с реорганизацией и модернизацией ветвей наших вооруженных сил может быть сформирован орган для их координации. Это даст нам лучший контроль над нашей армией, а также улучшит нашу способность выполнять совместные операции."
 PRC_prepare_for_third_phase:0 "Подготовьтесь к третьему этапу"
 PRC_prepare_for_third_phase_desc:0 "Мао объявил о трех этапах партизанской войны. Выполнив первые два, направленные на то, чтобы заручиться поддержкой и ослабить наших врагов, пришло время обратиться к обычным средствам. Мы будем и дальше расширять нашу территорию, начав прямые атаки на города на третьем и заключительном этапах."
 PRC_revolutionary_war_of_the_masses:0 "Революционная война масс"
 PRC_revolutionary_war_of_the_masses_desc:0 "Мы должны ясно дать понять, что наша партия представляет простого человека больше, чем коррумпированные и элитарные националистические государства. Наша цель — бороться с этими силами и создать лучшую систему."
 PRC_one_with_the_people:0 "Один с народом"
 PRC_one_with_the_people_desc:0 "Наша приверженность борьбе за улучшение [CHI.GetNonIdeologyName] Нужно как можно больше выделять, чтобы собрать больше добровольцев для нашей армии."
 PRC_strengthen_the_air_arsenal:0 "Укрепление воздушного арсенала"
 PRC_strengthen_the_air_arsenal_desc:0 "Чтобы улучшить наши военно-воздушные силы, мы должны инвестировать в улучшение нашей техники на основе нашего опыта. Одноразовые инвестиции, чтобы сделать наши проекты более надежными сейчас, могут даже сэкономить нам деньги на заменах."
 PRC_destroyers:0 "Разрушители класса Anshan"
 PRC_destroyers_desc:0 "Несмотря на то, что это устарело, получение излишков советских эсминцев типа «Гневный» положило бы основу для нашего флота, не требующего долгих лет строительства более крупных кораблей. Мы также можем капитально отремонтировать и модернизировать эти корабли, изучив их характеристики."
 PRC_submarines:0 "Прибрежные подводные лодки"
 PRC_submarines_desc:0 "Использование подводных лодок в наших прибрежных водах было бы экономически эффективным и жизнеспособным способом защиты нашей прибрежной инфраструктуры. Хотя эти подводные лодки не будут рассчитаны на большие глубины, они, по крайней мере, станут шагом к разработке более совершенных моделей."
 PRC_cruisers:0 "Круизы Green Water"
 PRC_cruisers_desc:0 "Легковооруженные, но универсальные крейсера типа «Киров» позволят нам защитить моря вблизи от дома. Давайте купим несколько незавершенных корпусов и закончим строительство."
 PRC_capital_ships:0 "Первый поход на столичных кораблях"
 PRC_capital_ships_desc:0 "Информация, которую мы имеем о проектах для [SOV.GetAdjective] Крейсеры класса «Кронштадт» могут стать хорошей основой для расширения нашего флота с помощью столичных кораблей. Эти конструкции являются современными до такой степени, что [SOV.GetAdjective] Промышленность боролась с ними, но для нашего расширяющегося флота эти вызовы стоят результата."
 PRC_carriers:0 "Сила проецирования"
 PRC_carriers_desc:0 "Развитие авианосцев позволит нам конкурировать с крупными военно-морскими державами. Способность размещать воздушные силы в любом месте, куда может достичь наш флот, также улучшит нашу способность проецировать силу в конфликтах далеко от родины."
 PRC_naval_guns:0 "Морская огневая мощь"
 PRC_naval_guns_desc:0 "Задел, который мы заложили для строительства более крупных судов, также позволит нам использовать более крупное вооружение. Это оружие может позволить нам угрожать даже сильно бронированным целям и вступать в бой до того, как мы окажемся в пределах их эффективной дальности."
 PRC_naval_ocean_navy:0 "От флота зеленой воды до голубого океана"
 PRC_naval_ocean_navy_desc:0 "Реформы в нашем военно-морском флоте должны теперь позволить ему эффективно действовать на больших расстояниях от наших баз снабжения. Это позволит нам сдерживать силы противника еще до того, как они достигнут соседних морей."
 PRC_pilot_training:0 "Создать пилотные академии"
 PRC_pilot_training_desc:0 "Немногие опытные пилоты, которых мы имеем, не могут быть подвергнуты риску в бою, вместо этого они должны быть набраны в качестве инструкторов для обучения новых пилотов по мере расширения наших военно-воздушных сил."
 PRC_night_attack:0 "Используйте ночь"
 PRC_night_attack_desc:0 "Подготовка нашей армии к ночным атакам будет способствовать дальнейшему использованию нашего опыта ведения асимметричной войны."
 PRC_reorganize_divisions:0 "Реорганизовать подразделения"
 PRC_reorganize_divisions_desc:0 "Для дальнейшей модернизации нашей армии мы должны реорганизовать любое оставшееся ополчение в дивизии и обеспечить, чтобы существующие дивизии были последовательными в своей силе. Это позволит нам создать четкую цепочку командования, что в свою очередь облегчит координацию наших войск."
 PRC_rural_region_development_two:0 "Расширение развития сельских районов"
 PRC_rural_region_development_two_desc:0 "Модернизация наших ферм должна быть дополнительно поддержана инвестициями в инфраструктуру в наших сельских регионах, таких как школы и дороги, что поможет повысить производительность сельского хозяйства."
 PRC_urbanization_two:0 "Расширение урбанизации"
 PRC_urbanization_two_desc:0 "Расширение наших городов означает, что теперь мы можем разместить более крупные строительные проекты для создания домов и рабочих мест. Мы позволим большему количеству людей переехать в города и обеспечить рабочие места, пока идет строительство."
 PRC_make_agrarian_to_urban_tt:0 "Изменения §Y$PRC_agrarian_reform$§! вводить §Y$PRC_urban_society$§! которые предоставляют:"
 PRC_found_the_academy_of_science:0 "Найдена Академия Наук"
 PRC_reinforce_base_area:0 "Укрепление новых базовых зон"
 PRC_reinforce_base_area_desc:0 "Чтобы избежать очередной кампании националистических сил против наших баз, мы должны рассмотреть все возможные варианты их защиты."
 PRC_rebuild_28_bolshevik:0 "Восстановление 28 1⁄2 большевиков"
 PRC_rebuild_28_bolshevik_desc:0 "Поддержка, которую получило наше новое руководство, наглядно показывает, что ему доверяют. Эта легитимность позволит нам легче собирать сторонников как на международном уровне, так и у себя дома."
 PRC_bolshevik_world_revolution:0 "Распространение мировой революции"
 PRC_bolshevik_world_revolution_desc:0 "Успех нашей революции не должен ограничиваться нашими границами. Мы должны помогать пролетариату в других странах."
 PRC_bolshevik_urbanization:0 "Революция из города"
 PRC_bolshevik_urbanization_desc:0 "В то время как наша нынешняя энергетическая база в основном состоит из сельских фермеров, стремящихся к улучшению качества жизни, мы должны донести наше послание до жителей городов, поскольку они тоже сталкиваются с неравенством."
 PRC_embrace_stalinism:0 "Примите сталинизм"
 PRC_embrace_stalinism_desc:0 "С укреплением нашего руководства мы можем начать в большей степени реализовывать сталинскую идеологию. Дальнейшая коллективизация и быстрая индустриализация должны стать нашими ключевыми направлениями."
 PRC_embrace_stalinism_tt:0 "В зависимости от текущей стоимости в §Y$PRC_communist_power_struggle$§!, §Y$PRC_bolshevik_dominance$§! Получат разные модификаторы.\nТекущий эффект:"
 PRC_bolshevik_aid:0 "[GetBolshevikAid]"
 PRC_bolshevik_aid_default:0 "Помощь советских большевиков"
 PRC_bolshevik_aid_alt:0 "Добро пожаловать в большевистские изгнанники"
 PRC_bolshevik_aid_desc:0 "Советские большевики опытны в революционной войне и, возможно, также готовы внести финансовый вклад в наше дело."
 PRC_party_control:0 "Контроль над партией"
 PRC_party_control_desc:0 "Успех нашего руководства должен позволить нам взять под контроль Коммунистическую партию Китая."
 PRC_invite_pavel_mif:0 "Приглашаем Павла Мифа"
 PRC_invite_pavel_mif_desc:0 "Павел Миф, наставник всех 28 полубольшевиков, должен быть приглашен консультировать наше правительство. Его присутствие укрепит наши связи. [SOV.GetNameDef]."
 PRC_invite_otto_braun:0 "Пригласить Отто Брауна"
 PRC_invite_otto_braun_desc:0 "$PRC_otto_braun$ Вместе с ним были $PRC_bo_gu$ Один из главных военачальников кампании 1934 года. По общему признанию, кампания привела к поражению, и Браун был отодвинут в сторону во время Долгого Марша. Однако наше новое руководство видит, что этого не было. $PRC_otto_braun$Он виноват и хочет его восстановить."
 PRC_invite_soviet_general:0 "Пригласить советских генералов"
 PRC_invite_soviet_general_desc:0 "$SOV_vasily_chuykov$\"s\" и $SOV_aleksandr_cherepanov$обширный опыт участия в Гражданской войне в России и как атташе [CHI.GetNameDef] Это сделало бы их обоих ценным дополнением к нашей армии."
 PRC_invite_soviet_general_tt:0 "§Y$SOV_vasily_chuykov$§! и §Y$SOV_aleksandr_cherepanov$§! Стать генералами"
 PRC_bolshevik_urbanization_2:0 "Усилия по урбанизации"
 PRC_bolshevik_urbanization_2_desc:0 "Создание рабочих мест в городах, чтобы побудить сельское население переехать туда, не только было бы выгодно для нашей экономики, но и увеличило бы наше влияние в городах, которые ставят под сомнение революцию."
 PRC_bolshevik_urban_industrialization:0 "Индустриализация городов"
 PRC_bolshevik_urban_industrialization_desc:0 "Мы должны инвестировать в наши города, чтобы способствовать формированию тяжелой промышленности."
 PRC_bolshevik_urbanization_completed:0 "Пролетарские рабочие, объединяйтесь!"
 PRC_bolshevik_urbanization_completed_desc:0 "Инвестиции в урбанизированные районы успешно увеличили наше влияние. Теперь мы можем рассчитывать на более тесное сотрудничество между коммунистическими организациями сельской местности и городов."
 PRC_join_comintern:0 "Вступить в Коминтерн"
 PRC_join_comintern_desc:0 "С усилением централизации руководства Коммунистической партии и, следовательно, государства мы можем теперь обратиться к Коминтерну как к надежному союзнику."
 PRC_rebuild_28_bolshevik_tt:0 "Каждый §Y28 1⁄2 большевиков§! Член:\nПовысить эффективность своих характеристик"
 PRC_rebuild_28_bolshevik_effect_tt:0 "проиграть §Y$PRC_28_bolshevik_trait$§! и получить §Y$PRC_28_bolshevik_trait_improved$§!.\n§YЭффективные изменения:§!\nЕжедневная политическая власть: §G+0.12§!\nСтабильность: §G+5.00%§!\nОдно и то же ежемесячное мнение: §G+5.00%§!"
 PRC_agricultural_reform_boom:0 "Сельскохозяйственная свобода"
 PRC_agricultural_reform_boom_desc:0 "Мы должны обеспечить безопасность наших фермеров, чтобы они чувствовали себя достаточно воодушевленными для производства культур, в которых нуждается наша страна."
 PRC_he_long_second_army:0 "Он долго и вторая армия."
 PRC_he_long_second_army_desc:0 "В основном неповрежденное состояние армии Хэ Лонга означает, что у нас есть новая основная сила для охраны. [ROOT.capital.GetName]. Его опыт избегания националистических сил — это то, что мы должны использовать."
 PRC_rural_survey:0 "Сельские обследования"
 PRC_rural_survey_desc:0 "Составление карт населения и производства в наших сельских районах позволит нам успешно реализовать наши дальнейшие экономические планы, а также будет полезно, если возникнет необходимость в призыве на военную службу."
 PRC_lessons_learnt:0 "Уроки, извлеченные"
 PRC_lessons_learnt_desc:0 "Опыт, накопленный нами после «Долгого марша», должен быть использован для точной настройки достижений, достигнутых в рамках нашей военной доктрины и подготовки."
 PRC_asymmetric_warfare_completed_tt:0 "с §Y$PRC_asymmetric_warfare$§! завершено:"
 PRC_conventional_warfare_completed_tt:0 "с §Y$PRC_conventional_warfare$§! завершено:"
 PRC_indirect_fire_completed_tt:0 "с §Y$PRC_indirect_fire$§! завершено:"
 PRC_appeal_for_foreign_aid_bt7_tt:0 "[ROOT.GetNameDefCap] Выиграет §YБТ-7 Легкие танки§!"
 PRC_appeal_for_foreign_aid_bt7_all_tanks_tt:0 "получать прибыль §Y350§! [SOV.GetAdjective] §YБТ-7 Легкие танки§!"
 PRC_appeal_for_foreign_aid__bt7_some_tanks_tt:0 "получать прибыль §Y100§! [SOV.GetAdjective] §YБТ-7 Легкие танки§!"
 PRC_appeal_for_foreign_aid__bt7_medium_amount_tt:0 "получать прибыль §Y150§! [SOV.GetAdjective] §YБТ-7 Легкие танки§!"
 PRC_appeal_for_foreign_aid_tt:0 "[ROOT.GetNameDefCap] Выиграет §YT34 Средние танки§!"
 PRC_appeal_for_foreign_aid_all_tanks_tt:0 "получать прибыль §Y250§! [SOV.GetAdjective] §YT34 Средние танки§!"
 PRC_appeal_for_foreign_aid__some_tanks_tt:0 "получать прибыль §Y50§! [SOV.GetAdjective] §YT34 Средние танки§!"
 PRC_appeal_for_foreign_aid__medium_amount_tt:0 "получать прибыль §Y150§! [SOV.GetAdjective] §YT34 Средние танки§!"
 PRC_appeal_for_foreign_aid_unlock_decision_tt:0 "Разблокировать §YРешения§! просить §Y[SOV.GetNameDefCap]§! для §YБронированные автомобили§!"
 PRC_rural_region_development_tt:0 "Вплоть до §YТри§! Сельские регионы получат §G25%§! Местные поставки и §G15%§! Местная рабочая сила.\nТекущие эффекты:"
 PRC_rural_region_development_two_tt:0 "Вплоть до §YДва§! Сельские регионы получат §G25%§! Местные поставки и §G15%§! Местная рабочая сила.\nТекущие эффекты:"
 PRC_initialize_five_year_plan_tt:0 "§RНевыполнение промышленных целей к крайнему сроку плана приведет к штрафам за вашу экономическую эффективность, что отражает потерю доверия к централизованному планированию.§!\n\n§YОбщие заводы, необходимые для достижения целей:\n[GetFiveYearPlanGoalCivFactoriesText] Гражданские заводы\n[GetFiveYearPlanGoalMilFactoriesText] Военные заводы§!"
 PRC_initialize_shorter_market_plans_tt:0 "§RНевыполнение промышленных целей к крайнему сроку плана приведет к большим штрафам для вашей экономической эффективности, что отражает потерю доверия к централизованному планированию.§!\n\n§YОбщие заводы, необходимые для достижения целей:\n[GetShorterMarketPlansGoalCivFactoriesText] Гражданские заводы\n[GetShorterMarketPlansGoalMilFactoriesText] Военные заводы§!"
 PRC_naval_infrastructure_effort_tt:0 "Когда требования будут выполнены, этот фокус даст §YВоенно-морские базы§!, §YПрибрежные форты§!и 1 §YВоенно-морской штаб§! Если бы никто не был построен"
 PRC_dockyard_construction_efforts_tt:0 "Когда требования будут выполнены, этот фокус даст §YМорские верфи§!"
 PRC_urbanization_two_tt:0 "Если §YСянь§! и §YШаньси§! Они будут контролироваться, они станут §YГородские регионы§!отдавать \n §G3§! Строительные слоты \n §G1§! §YГражданская фабрика§! \n Добавить §YПрогресс в области урбанизации§! которые предоставляют: \nСкорость местного строительства: §G+10%§!"
 PRC_reinforce_base_area_tt:0 "Уровень строительства §G2§! §YЗемельные форты§! на границах §Y[622.GetName]§! и §Y[1046.GetName]§!. \nЕсли пограничные войны были выиграны: \nУровень строительства §G1§! §YЗемельные форты§! на своих границах"
 PRC_he_long_has_arrived:0 "Он Лонг прибыл в Шэньси"
 PRC_pavel_mif_alive:0 "Павел Миф жив"
 PRC_zhang_guatao_arrived:0 "§Y$PRC_zhang_guotao$§! Прибыл в Шэньси"
 PRC_mediating_secretary_remove_fake_idea_tt:0 "Удалить §Y$PRC_mediating_general_secretary_idea$§!, который предоставляет \nЕжедневная политическая власть: §R-0.05§!\nСтабильность: §G+10.00%§!"
 PRC_infiltration_only_level_2_bolshevik_tt:0 "Только решения до §Yуровень 2§! Доступно. Разблокировать §Y3-й уровень§! Делая акцент на §Y$PRC_supreme_infiltration$§!."
 PRC_infiltration_only_level_2_guomao_tt:0 "Только решения до §Yуровень 2§! Доступно. Разблокировать §Y3-й уровень§! Делая акцент на §Y$PRC_secure_the_lands$§!."
 CHI_democratic_shortcut:0 "Политика:\nЛига"
 CHI_neutral_shortcut:0 "Политика:\nГоминьдан"
 CHI_fascist_shortcut:0 "Политика:\nГолубые рубашки"
 CHI_industry_shortcut:0 "Экономика"
 CHI_army_shortcut:0 "Армия"
 CHI_air_shortcut:0 "ВВС"
 CHI_navy_shortcut:0 "Флот"
 CHI_end_military_primacy:0 "Прекращение военного превосходства"
 CHI_end_military_primacy_desc:0 "Военные выполнили свою задачу, но их власть должна быть нарушена. Гражданская власть должна быть восстановлена, если [ROOT.GetName] Стать нацией, управляемой законом, а не генералами."
 CHI_accelerate_the_tutelage:0 "Ускорить тутелаж"
 CHI_accelerate_the_tutelage_desc:0 "КМТ не выполнила обещаний Синьхайской революции, а затем и Д-ра. Солнце. Вместо того, чтобы учить население демократии, они использовали их для личной выгоды. Мы должны компенсировать потерянное время."
 CHI_accelerate_the_tutelage_tt:0 "Разблокировать решения на §YУскорить политическую опеку§! Для людей во всем мире §YКитайская деревня§!"
 CHI_revive_the_new_culture_movement:0 "Возрождение нового культурного движения"
 CHI_revive_the_new_culture_movement_desc:0 "Большинство ранних революционеров в КПК и КМТ были вдохновлены Движением новой культуры, которое выступало как против династии Цин, так и против Юань Шикай. Только в духе нового культурного движения новый Китай восстанет из пепла прошлого!"
 CHI_revive_the_chinese_action_committee:0 "Возрождение Китайского комитета действий"
 CHI_revive_the_chinese_action_committee_desc:0 "КМТ монополизировал доступ к армии, привлекая к власти небольшую клику. Однако некоторые военные опытные противники не согласны с правящей группой, хотя и не поддерживают коммунистов."
 CHI_revive_the_chinese_action_committee_tt:0 "§Y$CHI_jiang_guangnai$§!, §Y$CHI_cai_tingkai$§! и §Y$CHI_chen_mingshu$§! Стать доступным как §YГенералы§!"
 CHI_ally_the_young_china_party:0 "Союзник Партии молодого Китая"
 CHI_ally_the_young_china_party_desc:0 "Партия «Молодой Китай» была основана группой китайских студентов в Париже 2 декабря 1923 года и стала самым заметным небольшим движением в стране после КМТ и КПК. Они предвидели хорошие идеи для нашего будущего, которые мы не можем просто игнорировать. Мы должны немедленно вступить с ними в союз!"
 CHI_invite_carsun_chang:0 "Приглашаем Карсун Чанга"
 CHI_invite_carsun_chang_desc:0 "В то время как западные державы наносят ущерб [ROOT.GetAdjective] Некоторые идеи могут быть полезны для нас. Поскольку Карсун Чанг устраняет разрыв между этими идеями и нашим конфуцианским контекстом, он станет объединяющей точкой для демократического движения."
 CHI_give_protection_of_civil_rights:0 "Обеспечить защиту гражданских прав"
 CHI_give_protection_of_civil_rights_desc:0 "Сунг Цинлин и Лига Китая по защите гражданских прав действовали в начале 1930-х годов, борясь против самодержавных мер Гоминьдана. Работа, которую они начали, мы продолжим, закрепляя права простого человека."
 CHI_rural_reconstruction_movement_sea:0 "Движение за реконструкцию деревни"
 CHI_rural_reconstruction_movement_sea_desc:0 "Наши города являются динамичными центрами современности, но то же самое нельзя сказать о сельской местности. Мы должны прилагать согласованные усилия для расширения экономического благосостояния и идеологической поддержки в наших селах. Оказывая полное влияние, мы можем использовать области, которые в противном случае остались бы без внимания."
 CHI_rural_reconstruction_movement_sea_tt:0 "Уменьшает время удаления для обоих §YСельское и городское политическое убежище§! решениями §G10§! дни"
 CHI_rural_reconstruction_movement_sea_2_tt:0 "§YСельская гостиница§! Решения теперь также применяются §Y$CHI_local_rural_reconstruction_modifier$§! адресованным государствам"
 CHI_sino_american_joint_commission_on_rural_reconstruction:0 "Американская помощь в восстановлении сельских районов"
 CHI_sino_american_joint_commission_on_rural_reconstruction_desc:0 "Мы должны использовать наши американские контакты для расширения наших усилий в сельской местности, чтобы включить сельские школы и содействовать эффективному функционированию системы образования для всей страны."
 CHI_a_matter_of_will:0 "Вопрос воли"
 CHI_a_matter_of_will_desc:0 "Китай может извлечь выгоду из иностранных идей, но с нашей историей у нас есть свой собственный путь. Мы должны начать с создания фундамента в наших деревенских школах, и строить единство с нуля."
 CHI_glorify_deng_yanda:0 "Прославляйте Дэн Янду"
 CHI_glorify_deng_yanda_desc:0 "Гоминьдан отказался от революции, которую мы начали в 1911 году, с помощью эгоистичных спекуляций. Был один, который встал на защиту простого человека и создал другой путь, чем путь тирании и умиротворения: Дэн Янда. Он был замучен за свои убеждения, и мы никогда не забудем его или то, что он представлял."
 CHI_apply_yandas_work:0 "Применить работу Янды"
 CHI_apply_yandas_work_desc:0 "Дэн всегда хотел мобилизовать массы и дать сельскому населению альтернативу. Распространение слова из села в село укрепит нашу организацию и страну в целом."
 CHI_apply_yandas_work_tt:0 "Уменьшает стоимость обоих §YСельское и городское политическое убежище§! решениями §G10§!"
 CHI_socialize_major_industries:0 "Национализация крупных отраслей промышленности"
 CHI_socialize_major_industries_desc:0 "Мы позволили некоторым людям накопить слишком много богатства и власти, что привело к тому, что ключевые отрасли оказались в неправильных руках. Мы должны взять эти отрасли в государственную заботу о безопасном хранении."
 CHI_a_burgeoning_welfare_state:0 "Буржуазное государство благосостояния"
 CHI_a_burgeoning_welfare_state_desc:0 "Государство, которое заботится о своем народе, несет в себе непревзойденную силу и устойчивость. Вдохновляя немцев до того, как они падут перед фанатизмом, мы начнем путь к более справедливому будущему."
 CHI_truly_free_speech:0 "Истинная свобода слова"
 CHI_truly_free_speech_desc:0 "Хотя мы защищаем людей от преследования за их мнение, дискурс все еще узок. Мы должны поощрять большее число людей к участию в публичном диалоге, с тем чтобы можно было услышать множество голосов и занять позицию."
 CHI_a_control_yuan_with_teeth:0 "Контрольный юань с зубами"
 CHI_a_control_yuan_with_teeth_desc:0 "Власть развращает, поэтому нам нужно что-то, чтобы наши политики были честными. При Чан Кай-Шеке организация, которой это было поручено, оказалась бессильной. Мы восстановим организацию таким образом, чтобы она могла в полной мере выполнять свою миссию."
 CHI_unify_as_the_china_democratic_league:0 "Объединение как Демократическая лига Китая"
 CHI_unify_as_the_china_democratic_league_desc:0 "Как разрозненные небольшие группы мы не можем противостоять Гоминьдану, но если бы мы объединились, у нас был бы шанс. Но кто поведет нас?"
 CHI_continue_the_ding_xian_experiment:0 "Продолжить эксперимент Дин Сянь"
 CHI_continue_the_ding_xian_experiment_desc:0 "Проект Дин Сянь в области реконструкции сельских районов до сих пор спонсировался движением Джеймса Йена за массовое образование. Будучи социальной лабораторией, она разработала и продемонстрировала способы повышения уровня жизни, здоровья, политической ответственности и культуры в китайской деревне. Мы должны профинансировать эту программу, чтобы провести модернизацию в сельской местности."
 CHI_continue_the_ding_xian_experiment_tt:0 "\n§YЭлектрификация и массовое образование§! начнет распространяться наружу от §YХэбэй и Хунань§! С течением времени одно новое основное состояние получает модификатор каждый второй месяц."
 CHI_minsheng_focus:0 "Принцип Миншенга"
 CHI_minsheng_focus_desc:0 "Современное государство заботится о своих гражданах, чтобы в нужный момент граждане могли и хотели его защищать. С этой целью мы должны принять принцип Миншенга и обеспечить, чтобы благосостояние могло быть предоставлено всем гражданам страны."
 CHI_minzu_focus:0 "Принцип Минзу"
 CHI_minzu_focus_desc:0 "Идея принадлежности к нации, а не к племени или религии превращает группу людей в государство. Поэтому мы должны принять принцип Минзу и обеспечить, чтобы все народы страны испытывали сильное чувство национализма и патриотизма, а также чувство единства при центральном правительстве."
 CHI_minquan_focus:0 "Принцип Минквана"
 CHI_minquan_focus_desc:0 "Путешествие началось с доктора. Сунь Ят-сен в конечном итоге приведет к единой республике. Это, несомненно, будет долгий путь, но мы делаем его шаг за шагом. Первый из них — принять принцип Минцюань и обеспечить, чтобы голосование было распространено на всех граждан Китая."
 CHI_demand_regional_adherence:0 "Требует региональной интеграции"
 CHI_demand_regional_adherence_desc:0 "Теперь, когда мы можем доказать региональным правителям Китая, что мы должным образом приняли три принципа народа, у нас есть возможность оказать на них давление, чтобы они сделали то же самое. Это должно в конечном итоге привести к их подчинению и интеграции в республику, под руководством нашей центральной власти."
 CHI_demand_regional_adherence_tt:0 "Разблокировать решения на §YРазвивать§! Контролируемые полевыми командирами регионы и обеспечение их приверженности трем принципам народа, повышая их уровень. §Yдемократический§! Поддержка и в конечном итоге §YПодчинение и интеграция§! их"
 CHI_zhonghua_minzu_focus:0 "Чжунхуа миньцзу"
 CHI_zhonghua_minzu_focus_desc:0 "Теперь, когда полевые командиры и губернаторы регионов вернулись под наш контроль, пришло время начать правильное воссоединение и посмотреть вовне. Многие из наших законных территорий были потеряны для националистических и иностранных держав, и теперь мы должны сделать все от нас зависящее, чтобы вернуть их в свет республики."
 CHI_zhonghua_minzu_focus_tt:0 "Разблокировать решения в ядро [MON.GetFlag] §Y[MON.GetAdjective]§!, [TAN.GetFlag] §Y[TAN.GetAdjective]§! и [TIB.GetFlag] §Y[TIB.GetAdjective]§! штаты"
 CHI_zhonghua_minzu_focus_2_tt:0 "Заменить §Y$CHI_the_political_tutelage_dm$§! с §Y$CHI_the_political_tutelage_upgraded_dm$§!Эффективные изменения:"
 CHI_toward_a_socialist_economy:0 "На пути к социалистической экономике"
 CHI_toward_a_socialist_economy_desc:0 "Для того чтобы действительно изменить наше общество к лучшему, мы должны изменить способ денежных потоков и убрать руководителей корпораций, которые получили свои позиции только через кумовство. Трудящийся должен снова иметь право голоса в своей стране, и все [ROOT.GetAdjective] будет равным!"
 CHI_enact_georgist_tax_reforms:0 "Реформирование налоговой системы Георгия"
 CHI_enact_georgist_tax_reforms_desc:0 "Георгизм послужил основой для экономической теории Сунь Ят Сена, который хотел создать налог на удерживаемую землю. «Единственным средством поддержки правительства является бесконечно справедливый, разумный и справедливо распределенный налог, на который мы создадим нашу новую систему»."
 CHI_leverage_contacts:0 "Используйте контакты"
 CHI_leverage_contacts_desc:0 "Наши соотечественники распространились по всему миру, а некоторые даже прибыли в Америку. В Соединенных Штатах наши контакты только и ждут, когда мы попросим о помощи."
 CHI_reach_out_for_help:0 "Обратиться за помощью"
 CHI_reach_out_for_help_desc:0 "Призрак милитаризма преследует Китай с востока, и мы должны обратиться к нашим американским контактам за помощью. Они должны понимать, что мы их первая линия обороны против японской угрозы."
 CHI_reach_out_for_help_tt:0 "§Y[USA.GetNameDefCap]§! Скорее всего, они пришлют нам §Yленд-лиз§!"
 CHI_deal_with_the_shadow_elements:0 "Обсуждение The Shadow Elements"
 CHI_deal_with_the_shadow_elements_desc:0 "Теневые группы в нашей стране отравляют людей ради личной выгоды. Этого не может быть!"
 CHI_utilize_the_albazinian_contact_tt:0 "Разблокировать решения, требующие увеличения поддержки со стороны [SOV.GetNameDef]"
 CHI_shifting_the_balance:0 "Сдвиг баланса"
 CHI_shifting_the_balance_desc:0 "Пока мы получали поддержку из-за рубежа, она была пассивной. Мы будем просить об активном участии, чтобы нам помогли раз и навсегда победить японскую угрозу."
 CHI_the_german_mission:0 "Германская миссия"
 CHI_the_german_mission_desc:0 "Уже более десяти лет у нас есть связи с Германией, и мы должны специально использовать контакты Карсун Чанга для расширения нашего сотрудничества."
 CHI_reach_out_to_expats:0 "Помогите эмигрантам"
 CHI_reach_out_to_expats_desc:0 "Наши люди разбросаны по всему миру и построили для себя новую жизнь. Для некоторых это указывает на слабость, но для нас это сила. Мы призовем наших отчуждённых соотечественников в это время нужды."
 CHI_reach_out_to_expats_tt:0 "Разблокировать решения на §YУвеличение ежемесячного избытка экономического потенциала§! из зарубежных стран, используя наши контакты и сообщества экспатов"
 CHI_invoke_the_nine_powers:0 "Назовите девять держав"
 CHI_invoke_the_nine_powers_desc:0 "Хотя неравные договоры были подписаны в ущерб нам, Девять держав согласились на статус-кво, где ни одна страна не должна занимать больше Китая. В связи с продолжающейся японской агрессией пришло время ссылаться на этот пункт."
 CHI_aeronautical_expertise:0 "Авиационная экспертиза"
 CHI_aeronautical_expertise_desc:0 "Китайские авиаторы получили заслуженную славу по другую сторону Тихого океана. Мы можем позвонить им домой, чтобы использовать их опыт."
 CHI_expand_the_faction:0 "Приглашаем свободных"
 CHI_expand_the_faction_desc:0 "Как и в случае с нашим внутренним движением, дело демократии в Азии зависит от множества меньших групп. Мы должны объединить все движения в более крупную фракцию, чтобы иметь возможность противостоять тем, кто будет угнетать нас."
 CHI_pacific_entente_faction:0 "Тихоокеанская Антанта"
 CHI_expand_the_faction_tt:0 "Разблокировать решения о приглашении §Yдемократический§! §Yазиатский§! и §Yокеанский§! Страны в нашей фракции"
 CHI_make_a_stand_against_the_colonialists:0 "Выступить против колониалистов"
 CHI_make_a_stand_against_the_colonialists_desc:0 "Век империи закончился, и мы являемся предвестником эпохи самоопределения. Мы должны сделать это простое заявление известным тем, кто придерживается старого порядка, и если они будут сопротивляться нам, они поймут гнев народа."
 CHI_make_a_stand_against_the_colonialists_tt:0 "Разблокировать §YАнтиколониализм§! Решения об освобождении колоний в §YАзия и Океания§! удерживаемых колониальными державами."
 CHI_spreading_the_light_of_freedom:0 "Распространение света свободы"
 CHI_spreading_the_light_of_freedom_desc:0 "Свобода от внешних угроз — это только первый шаг на нашем пути. Мы также должны обеспечить, чтобы внутренние угрозы не мешали воле нации выражать себя."
 CHI_spreading_the_light_of_freedom_tt:0 "Разблокировать решения на §YРазжигание республиканских чувств§! внутри §YАзиатский и Океанский§! нации"
 CHI_correct_a_historical_wrong:0 "Исправьте историческую ошибку"
 CHI_correct_a_historical_wrong_desc:0 "Обращение европейцев с миром несправедливо и является пятном на гобелене человеческой цивилизации. Мы исправим эту ошибку и накажем их за их преступления."
 CHI_championing_the_cause_of_liberty:0 "Чемпионство в деле свободы"
 CHI_championing_the_cause_of_liberty_desc:0 "Мы принесли свет свободы в Азию и стали маяком для всех, кто ценит свою свободу и самоопределение."
 CHI_utilize_the_albazinian_contact:0 "Используйте Албазинский контакт"
 CHI_utilize_the_albazinian_contact_desc:0 "Епископ Симеон Ду является нынешним протодиаконом Китайской Православной Церкви. Как альбазинец, который путешествовал по всему Китаю, епископ поддерживает тесные контакты со многими членами старых белорусских сил. Может быть, он сможет убедить русских послать помощь нашей нации?"
 CHI_prepare_for_a_change_in_leadership:0 "Подготовьтесь к переменам в руководстве"
 CHI_prepare_for_a_change_in_leadership_desc:0 "У нас было наше нынешнее правительство в течение десятилетия, и призрак [JAP.GetNameDef] До сих пор преследует [CHI.GetAdjective] Нация. Нужно, чтобы кто-то другой держал бразды правления в своих руках."
 CHI_prepare_for_a_change_in_leadership_tt:0 "§R[CHI_chiang_kaishek.GetName] будет заменено в инциденте Сиань для [CHI_wang_jingwei.GetName]§!"
 CHI_prepare_for_a_change_in_leadership_tt_2:0 "§RОтправка Чан Кайши в Гуанчжоу во время инцидента в Лянгуане приведет к его смерти раньше, что позволит $CHI_look_for_allies$ быть выбранным§!"
 CHI_prepare_for_a_change_in_leadership_dai_li:0 "§R[CHI_chiang_kaishek.GetName] будет заменено в инциденте Сиань для [CHI_dai_li.GetName]§!"
 CHI_avoid_another_crisis:0 "Избегайте повторного кризиса"
 CHI_avoid_another_crisis_desc:0 "В 1931 году мы были не готовы и были застигнуты врасплох. [JAP.GetAdjective] Армия. Несмотря на то, что прошло уже полдесятилетия, мы не готовы отбивать их назад и должны получить больше этого драгоценного ресурса, времени. Мы можем предложить символические уступки, чтобы успокоить [JAP.GetAdjective]Это позволит нам подготовиться к неизбежному шторму с востока."
 CHI_avoid_another_crisis_tt:0 "\nЭто даст возможность отсрочить японское вторжение путем уступок."
 CHI_lay_the_foundation_for_a_united_china:0 "Заложить фундамент для единого Китая"
 CHI_lay_the_foundation_for_a_united_china_desc:0 "Нынешнее правительство — это банда зверей, которые знают только силу меча. Здоровая нация требует больше, чем власть силой. Сильные институты при гражданском правительстве являются основой для нашей продолжающейся революции."
 CHI_preempt_the_inevitable:0 "Предвосхитить неизбежное"
 CHI_preempt_the_inevitable_desc:0 "Мы знаем, что [JAP.GetNameDef] Мы приближаемся к нам, полагая, что мы слабы и готовы к принятию. Можно было бы представить их удивление, если бы мы ударили первыми."
 CHI_utilize_german_contacts:0 "Используйте немецкие контакты"
 CHI_utilize_german_contacts_desc:0 "В то время как восточные варвары испытывают ненасытную жажду крови, среди них есть те, кто способен слушать разум, хотя и не от нас. Обратившись к нашим взаимным контактам в Европе, мы можем заставить их умерить чувства более горячих голов."
 CHI_utilize_german_contacts_tt:0 "Если мы примем [GER.GetAdjective] Запросы об антисоветских договорах тогда [GER.GetNameDef] Скорее всего, они будут вмешиваться от нашего имени."
 CHI_utilize_german_contacts_wang_tt:0 "Мы будем использовать наши связи через [CHI.GetLeader] Чтобы получить:"
 CHI_look_for_allies:0 "Ищите внутренних союзников"
 CHI_look_for_allies_desc:0 "Чан провел почти десять лет, чтобы укрепить свою власть над партией, но все еще есть элементы, которые отказываются стоять за ним. Мы должны найти их и объединить в надлежащее противодействие."
 CHI_infiltrate_the_examination_yuan:0 "Проникните в экзаменационный юань"
 CHI_infiltrate_the_examination_yuan_desc:0 "Государством управляет не просто работа немногих, а неустанный труд массы государственных служащих. Если бы мы смогли проникнуть в организацию, которая проверяет квалификацию этих работников, мы могли бы принести большую пользу нашему движению. Если бы мы могли убедиться, что рабочие совпадают с нашим положением, это было бы непреодолимой силой."
 CHI_take_control_of_the_executive_yuan:0 "Возьмите под контроль исполнительный юань"
 CHI_take_control_of_the_executive_yuan_desc:0 "Тот, кто создает законы, имеет власть, но тот, кто их исполняет, может их заменить. С нашим народом на министерских должностях мы сможем противостоять чиангизму на всех уровнях."
 CHI_take_control_of_the_executive_yuan_tt:0 "Когда новый военачальник будет марионеткой, каждая существующая кукла-воин получит: §Y[?executive_yuan_autonomy_ratio|%]§! Соотношение автономии"
 CHI_our_people_in_the_legislative:0 "Наш народ в законодательстве"
 CHI_our_people_in_the_legislative_desc:0 "Нынешняя система была сделана беззубой при Чанге. Сильный человек пытался заменить сильную центральную власть, и с этим нам придется бороться. Нам придется переписать автономию некоторых элементов правительства, чтобы укрепить ядро нации."
 CHI_clear_out_sycophants:0 "Очистить сикофанты"
 CHI_clear_out_sycophants_desc:0 "Тиран порождает да-мужчин, и чем дольше он правит, тем больше их. Хотя мы держим номинальный законодательный и исполнительный контроль, все еще есть много людей, которые придерживаются старых идей. Мы должны предпринять согласованные усилия для обеспечения того, чтобы те, кто извлек выгоду из прежнего режима, были поставлены на свое место."
 CHI_impair_the_control_yuan:0 "Нарушить контрольный юань"
 CHI_impair_the_control_yuan_desc:0 "Сдержки и противовесы являются важными факторами в функционирующем государстве, но они также могут замедлить прогресс. Было бы хорошо, если бы Юань не был столь мощным, как некоторые надеялись, чтобы не мешать нам в достижении наших целей."
 CHI_impair_the_control_yuan_tt:0 "Обновление The §YИнтеграция Усилия решения§! Для применения: "
 CHI_impair_the_control_yuan_tt_2:0 "480 дней (s) $instead_of$ 365 дней (s)"
 instead_of:0 "Вместо:"
 and_last_for:0 "И последнее:"
 CHI_appoint_sympathetic_judges:0 "Назначение симпатических судей"
 CHI_appoint_sympathetic_judges_desc:0 "С судьями на ключевых должностях мы сможем расширить нашу власть вниз и наружу, вплоть до провинций."
 CHI_appoint_sympathetic_judges_tt:0 "Каждый будущий Субъект Военачальника получит следующий дух после того, как его куклируют:"
 CHI_close_whampoa:0 "Близкая Вампоа"
 CHI_close_whampoa_desc:0 "Вампоа всегда был известен как личная вотчина Чанга и питательная среда для его идеологических пристрастий. Это институт, который невозможно позволить сохранить, и поэтому мы закроем его и осудим всех, кто, как известно, имеет к нему отношение."
 CHI_close_whampoa_tt:0 "Каждый оставшийся генерал выигрывает: §G+3§! Случайно присвоенная статистика."
 CHI_censure_the_opposition:0 "Убедить оппозицию"
 CHI_censure_the_opposition_desc:0 "Контрольный Юань уже слаб, но если бы мы полностью его контролировали, то могли бы исправить нежелательные элементы. Предоставление обратной связи о надлежащем поведении будет работать в качестве корректирующей меры."
 CHI_the_freedom_to_abject:0 "Свобода отрицать"
 CHI_the_freedom_to_abject_desc:0 "Система, которую нельзя критиковать, никогда не будет расти и развиваться. Мы слишком долго топтали людей, которые указывали на элементы, обогащающие некоторых в ущерб интересам других. [CHI.Getadjective] людей. Нам нужны процессы, позволяющие указывать на недостатки системы до тех пор, пока она не дестабилизирует нас."
 CHI_expropriate_industrialists:0 "Экспроприированные промышленники"
 CHI_expropriate_industrialists_desc:0 "Лакеи Чанга извлекли большую пользу из того, что последовали за таким коррумпированным человеком и накопили большое богатство. Личная прибыль не может стоять выше партии, и то, что произошло, должно быть исправлено. Мы вернем то, что принадлежит государству."
 CHI_politicise_the_process:0 "Политизировать процесс"
 CHI_politicise_the_process_desc:0 "Как государственный служащий, важно понимать свою политическую ответственность. Не все это понимают и поэтому должны учиться лучше. Мы будем переформулировать образование и экзамен каждого государственного служащего, чтобы достичь широкого понимания."
 CHI_a_functioning_bureaucracy_first:0 "Функционирующая бюрократия прежде всего"
 CHI_a_functioning_bureaucracy_first_desc:0 "В то время как контроль над государственным аппаратом имеет большое значение, бессмысленно, если государство не существует. Разрешение институтам самоуправления и поощрение правильных людей подниматься по служебной лестнице, основываясь на заслугах и неправильных идеях, принесет нам пользу в долгосрочной перспективе."
 CHI_extend_jurisdiction_to_the_provinces:0 "Расширить юрисдикцию провинций"
 CHI_extend_jurisdiction_to_the_provinces_desc:0 "The [ROOT.GetRulingParty] Мы хорошо справились с захватом контроля над крупными городами и центральными учреждениями, но мы могли бы добиться большего на периферии. Расширение нашей мощи будет иметь большое значение для объединения Китая и удержания [JAP.GetAdjective] натиск."
 CHI_affirm_civilian_primacy:0 "Подтверждаем гражданское первенство"
 CHI_affirm_civilian_primacy_desc:0 "Чианг построил свою власть на тылу армии, но мы знаем, что умы офицеров можно легко раскачивать, немногие из них приносят нам пользу. Мы должны обеспечить, чтобы вооруженные силы понимали, что они подчиняются гражданскому контролю."
 CHI_proclaim_a_new_chapter:0 "Провозгласить новую главу"
 CHI_proclaim_a_new_chapter_desc:0 "Прежний режим всегда утверждал, что он является силой свободы и демократии, но правда в том, что они жаждут только власти. С консолидацией власти Ван Цзинвэя мы можем теперь заявить, что гражданское правительство вернуло бразды правления."
 CHI_negotiate_the_nine_powers_treaty:0 "Переговоры по Договору девяти держав"
 CHI_negotiate_the_nine_powers_treaty_desc:0 "Цин согласился подчиниться западным державам, и договоры 19-го века преследуют нас, как призраки, их последствия все еще задерживаются над Китаем. Мы обратимся к подписантам и посмотрим, сможем ли мы разрешить наши разногласия не как слуга на этот раз, а как равный."
 CHI_start_looking_outwards:0 "Начните смотреть наружу"
 CHI_start_looking_outwards_desc:0 "Ошибка, допущенная в прошлом, состояла в том, что мы могли отделиться от мира. Колониалистские нации разделили нас вместе с остальной Азией, оставив нас бесчестными. Это не может остаться безнаказанным. Мы организуем всю остальную Азию, чтобы объединиться в силе."
 CHI_start_looking_outwards_tt:0 "Мы сможем пригласить в нашу фракцию свободные азиатские страны."
 CHI_liberate_the_peoples_of_asia:0 "Освободите народы Азии"
 CHI_liberate_the_peoples_of_asia_desc:0 "Как и в прошлые века, остальная Азия смотрит на нас как на руководство, и мы ответим. Мы поможем им восстать против империалистов и обрести свою свободу, отомстив за своих братьев."
 CHI_liberate_the_peoples_of_asia_tt:0 "Мы получим военные цели на всех, кто контролирует колониальные государства или имеет марионеток в колониях. §Y$asia$§!"
 CHI_liberate_the_peoples_of_asia_tt_2:0 "Разблокирует решения о создании марионеточных правительств §Y$asia$ §!"
 CHI_punish_the_signatories:0 "Наказать подписавших"
 CHI_punish_the_signatories_desc:0 "Ущерб, нанесённый Западом нашей стране, неисчислим. Это оставило нас подавленными. Их нужно заставить понять, что они сделали, и начать погашать свой исторический долг."
 CHI_bring_the_revolution_further:0 "Принесите революцию дальше"
 CHI_bring_the_revolution_further_desc:0 "Наш путь к освобождению идет дальше, чем мы могли себе представить. Мы распространим свет свободы по всему Тихому океану и еще больше отбросим колонизаторов назад."
 CHI_bring_the_revolution_further_tt:0 "Мы получим военные цели на всех, кто контролирует колониальные государства или имеет марионеток в колониях. §Y$Australia$: §!"
 CHI_bring_the_revolution_further_tt_2:0 "Наш манифест фракции также включает §Y$Australia$ §!\nРазблокирует решения о создании марионеточных правительств §Y$Australia$ §!"
 CHI_end_the_humiliation:0 "Положить конец унижению"
 CHI_end_the_humiliation_desc:0 "Мы, наконец, стоим как великая держава, как мы это делали в прошлые века. Восхищенные, влиятельные и впечатляющие, мы поднялись над остальными, отбросив угнетателей в сторону. Больше не позор!"
 CHI_dang_guo:0 "Дан Го"
 CHI_dang_guo_desc:0 "Целью партии всегда было привнесение демократии в нашу страну, но в эти неопределенные времена важно, чтобы Гоминьдан мог действовать эффективно. Таким образом, мы должны на время поставить партию выше нации."
 CHI_denounce_feudalism:0 "Отрицание феодализма"
 CHI_denounce_feudalism_desc:0 "Пока мы провозглашаем наш революционный характер, в нашей партии есть такие, которые ведут себя как помещики и элиты прошлого. Этим старым феодалам необходимо противопоставить свое контрреволюционное поведение."
 CHI_denounce_feudalism_tt:0 "Выиграют: §G+[?warlord_subjects_pp_gain_base] Политическая власть§! Ежемесячно для каждого военного субъекта."
 CHI_one_nation_undivided:0 "Единая нация, неразделенная"
 CHI_one_nation_undivided_desc:0 "Объединив провинции под одной неразделенной властью, мы преодолеем региональные разногласия и заложим основу для сильной и гордой нации. Тогда мы сможем противостоять любым угрозам, внешним и внутренним."
 CHI_one_nation_undivided_tt:0 "Пригласит каждого военачальника в Объединенный фронт, исключая [PRC.GetName] и [HBC.GetName]"
 CHI_one_nation_undivided_bypass_tt:0 "§YКаждый китайский военачальник§!Один из следующих должен быть истинным: \n  Не существует\n  находится в состоянии войны с §Y[ROOT.GetNameWithFlag]§!\n  Является предметом §Y[ROOT.GetNameWithFlag]§!\n  находится во фракции с §Y[ROOT.GetNameWithFlag]§!\n  §Y[ROOT.GetName]§!имеет §YЦель войны§! против них."
 CHI_decree_the_end_to_corruption:0 "Постановление о прекращении коррупции"
 CHI_decree_the_end_to_corruption_desc:0 "Коррупция стала эндемичным явлением в нашем правительстве, начиная с самого высокого министра и заканчивая самым низким набором в армию. Мы должны отсеять жадных и коррумпированных чиновников, чтобы сформировать честную администрацию."
 CHI_reinforce_connections_with_shanghai_elites:0 "Укрепление связей с элитами Шанхая"
 CHI_reinforce_connections_with_shanghai_elites_desc:0 "В Шанхае есть группа людей с большим богатством и властью, собранная путем перемещения в тень и из нее. Включение этих людей может оказаться полезным для нашего дела."
 CHI_introduce_the_baojia_system:0 "Внедрение системы Баоцзя"
 CHI_introduce_the_baojia_system_desc:0 "Система Баоцзя использовалась для организации нашего населения и обеспечения его безопасности с древних времен. Мы должны расширить его, чтобы он стал основой набора, поскольку это обеспечит нам постоянный приток новобранцев."
 CHI_expand_the_tongzi_jun:0 "Расширение Tongzi Jun"
 CHI_expand_the_tongzi_jun_desc:0 "Ряды молодежного корпуса могут воспитывать новые поколения лояльных и дисциплинированных граждан. Некоторые меры военной подготовки также облегчат их попадание в вооруженные силы."
 CHI_demonstrate_our_resolve:0 "Продемонстрировать нашу решимость"
 CHI_demonstrate_our_resolve_desc:0 "Весь остальной мир слишком долго смотрел на нас свысока. Пришло время доказать нашу стойкость, победив эту порочную агрессию."
 CHI_arrest_the_seven_gentlemen:0 "Арестуйте семерых джентльменов"
 CHI_arrest_the_seven_gentlemen_desc:0 "В то время как в Китае мало кто согласен с японской агрессией, способ борьбы с ней вызывает разногласия. Мы не можем допустить конкуренции нашему правлению, и поэтому мы должны показать свое первенство в этих вопросах."
 CHI_develop_counterinsurgency_tactics_tt_2:0 "будет производить §Y$CHI_counter_infiltration_measures$§! стоимость §G25%§! столько же"
 CHI_take_a_stance_on_illicit_trade:0 "Примите меры в отношении незаконной торговли"
 CHI_take_a_stance_on_illicit_trade_desc:0 "Слишком долго мы были во власти яда, просачивающегося через наше общество и тех, кто имеет с ним дело. Мы должны отвергнуть его искушение стать сильнее и яснее в новом веке процветания."
 CHI_reshuffle_the_green_gang:0 "Перетасовка зеленой банды"
 CHI_reshuffle_the_green_gang_desc:0 "Big Eared Du хорошо послужил нам, но также стал слишком влиятельным. Когда враги кружат, нам нужны более прямые действия. Может быть, пришло время кому-то другому руководить «Зеленой бандой»?"
 CHI_legitimise_du:0 "Легитимизировать Du"
 CHI_legitimise_du_desc:0 "Некоторые хотели бы, чтобы мы держались подальше от тех, у кого есть неортодоксальные способы зарабатывать на жизнь, но, возможно, это было бы просто выбрасывать ценный ресурс. Посмотрим, что мог бы сделать Ду Юэшен, если бы ему не пришлось работать в тени."
 CHI_inspect_the_troops:0 "Проверить войска"
 CHI_inspect_the_troops_desc:0 "Будут проведены тщательные проверки для сплочения войск за партией и [root.GetLeader]. Наша славная армия будет тем, что приведет нас в будущее."
 CHI_secure_the_soviet_border:0 "Защитить советскую границу"
 CHI_secure_the_soviet_border_desc:0 "Русский медведь был шипом на нашей стороне, слишком долго вмешивался в наши дела. Мы должны обеспечить безопасность нашего северного фронта, выстраивая формальные отношения с Россией. [SOV.GetNameDef] И, возможно, получить от них что-то большее."
 CHI_secure_the_soviet_border_tt:0 "§RМы сможем увидеть конструкторов брони, которых мы можем выбрать в будущем событии.§!"
 CHI_send_the_first_lady_abroad:0 "Отправить первую леди за границу"
 CHI_send_the_first_lady_abroad_desc:0 "Есть еще те, которые могут поддержать нас перед лицом агрессии, но в настоящее время находятся на заборе. Мы должны послать Первую леди, чтобы убедить их, что, хотя мы кровоточили океаны и непоколебимо несли тяжелое бремя войны, мы все равно одержим победу."
 CHI_take_advantage_of_dus_contacts:0 "Пользуйтесь контактами Du"
 CHI_take_advantage_of_dus_contacts_desc:0 "У лидера «Зеленой банды» есть друзья во многих местах и ноу-хау, которыми обладают немногие. Такая сеть могла бы принести нам пользу, если бы мы использовали ее должным образом, даже если бы она приносила пользу некоторым сомнительным персонажам."
 CHI_draw_support_from_the_big_families:0 "Получить поддержку от больших семей"
 CHI_draw_support_from_the_big_families_desc:0 "В Китае есть несколько очень влиятельных семей в разных секторах. Хотя это может и не помочь стабилизировать ситуацию в стране, эти связи все же могут быть использованы для достижения наших целей."
 CHI_prosecute_cronyism:0 "Пророческий кронизм"
 CHI_prosecute_cronyism_desc:0 "Слишком долго интересы отдельных лиц превалировали над потребностями государства. Непотизм, взяточничество и растраты разрывают ткань нашего общества. Это заканчивается сейчас, и наступает новая эра добродетели!"
 CHI_crack_down_on_illicit_goods:0 "Уничтожить незаконные товары"
 illicit_good_improvement_increase:0 "Увеличивает скорость, с которой §YНезаконная торговля§! удаляется путем §G+2%§! каждый §Y6-й месяц§!"
 which_will_give_tt:0 "Который даст:"
 CHI_crack_down_on_illicit_goods_desc:0 "Слишком долго мы были во власти яда, просачивающегося через наше общество и тех, кто имеет с ним дело. Мы должны отвергнуть его искушение стать сильнее и яснее в новом веке процветания."
 CHI_turn_a_blind_eye:0 "Повернуть слепой глаз"
 CHI_turn_a_blind_eye_desc:0 "Можно признать, что неофициальная торговля оказала пагубное влияние на состав китайского общества. Однако нельзя отрицать прибыль от этой торговли, и если мы позволим ей быть, то сможем получить большое богатство."
 CHI_weaponise_the_hongmen:0 "Оружие для банд"
 CHI_weaponise_the_hongmen_desc:0 "В наших портовых районах уже есть тайные общества, обученные самообороне, которые мы могли бы развернуть против нашего врага. Дайте им достаточную поддержку, и они могут нанести ущерб любому захватчику, который осмелится нарушить нашу землю."
 CHI_weaponise_the_hongmen_tt:0 "Каждое оккупированное китайское прибрежное государство и государство с большим городом:\n  Сопротивление: §R+30.0%§!"
 CHI_facilitate_operation_zet:0 "Облегчение операции Zet"
 CHI_facilitate_operation_zet_desc:0 "Мы поняли, что [SOV.GetNameDef] Не комфортно с агрессивной осанкой [JAP.GetNameDef] Взяли в Восточной Азии. Они готовы оказать нам материальную поддержку и волонтеров. Все, что нам нужно сделать, это подготовиться к приему помощи."
 CHI_from_many_to_one:0 "От многих к одному"
 CHI_from_many_to_one_desc:0 "Наша нация содержит бесчисленное множество людей, но в последнее время мы были разделены и разорваны между различными мнениями. Если мы хотим противостоять натиску чужеземцев и в конечном итоге выжить, нам нужно объединиться для достижения одной общей цели."
 CHI_from_many_to_one_tt:0 "получать прибыль §G+1.5%§! Стабильность для каждого военачальника в нашей фракции"
 CHI_from_many_to_one_faction_tt:0 "Добавить будет §G+10.0%§! $MODIFIERS_ARMY_CORE_DEFENCE_FACTOR$ При низкой фракции проявляется полнота заполнения.\nДобавить будет §G-10.0%§! $MODIFIER_AUTONOMY_GAIN_WARSCORE$ При наличии средней и высокой фракции проявляется полнота заполнения."
 CHI_request_soviet_advisors:0 "Запрос советских советников"
 CHI_request_soviet_advisors_desc:0 "Война радикально изменилась за последние десятилетия, и мы отстали.[SOV.GetNameDefCap] Мы предложили направить к нам квалифицированных специалистов, чтобы догнать наши усилия по бронетехнике, и мы должны это принять."
 CHI_the_northwest_highway:0 "Северо-западное шоссе"
 CHI_the_northwest_highway_desc:0 "У нас длинная граница с [SOV.GetnameDef] Поэтому можно было бы подумать, что есть широкие возможности для беспрепятственного перемещения вещей между нашими двумя режимами. Однако инфраструктуры в этих регионах не хватает, по меньшей мере. Мы должны сосредоточиться на создании маршрута, удаленного от линии фронта, чтобы мы могли получить больше от наших клиентов. [SOV.Getadjective] Друзья."
 CHI_collaborate_with_allied_forces:0 "Сотрудничество с союзными войсками"
 CHI_collaborate_with_allied_forces_desc:0 "Мы долго и упорно боролись против [JAP.GetAdjective] Угроза, но мы больше не одиноки. Для того чтобы координировать наши усилия, мы должны еще больше интегрировать наши вооруженные силы и добиться окончательной победы."
 CHI_collaborate_with_allied_forces_tt:0 "Разблокирует Решения, чтобы сформировать Силу X и Y, которая создаст разделение."
 CHI_scout_for_air_experts:0 "Скаут для авиаэкспертов"
 CHI_scout_for_air_experts_desc:0 "Наши военно-воздушные силы находятся в зачаточном состоянии, и многие проблемы сложны. Мы будем содействовать усилиям ВВС, используя опыт других стран."
 CHI_sell_lend_lease:0 "Продать ленд-лиз"
 CHI_sell_lend_lease_desc:0 "Получение техники для наших сил всегда полезно, но то, что предлагается, не всегда то, что нужно. Однако где-то всегда есть потребность в оборудовании, а значит, для него всегда есть рынок."
 CHI_sell_lend_lease_tt:0 "Если у нас есть §Y$CHI_soviet_support$§! прибыль: §Y+100 $CIC_BANK_HEADER$§! в месяц\n\nЕсли у нас есть §Y$CHI_american_support$§! прибыль: §Y+150 $CIC_BANK_HEADER$§! в месяц\n\n"
 CHI_international_instructors:0 "Международные инструкторы"
 CHI_international_instructors_desc:0 "Потребность в пилотах и экипажах ненасытна, и мы не можем обучить их достаточно быстро. Прием большего количества иностранных инструкторов ускорит наши усилия по увеличению количества самолетов в воздухе."
 CHI_allocate_lend_lease:0 "Выделить ленд-лиз"
 CHI_allocate_lend_lease_desc:0 "В настоящее время в Китае существует несколько центров власти, хотя только один из них может представлять страну за рубежом. Мы можем использовать это преимущество, чтобы решить, кто получает поддержку, а значит, кто оказывает влияние."
 CHI_allocate_lend_lease_tt:0 "Разблокирует решения по сокращению автономности Warlord Subjects §YПехотное снаряжение§!"
 CHI_burma_campaign:0 "Бирманская кампания"
 CHI_burma_campaign_desc:0 "Наши союзники борются.[JAP.GetNameDefCap] Он загнал вглубь и теперь контролирует часть Бирмы. Мы покажем, что мы не только отвлекаем врага, но и являемся надежным союзником, который нанесет смертельный удар."
 CHI_burma_campaign_trigger:0 "[BRM.GetName] Потеряла хотя бы одну из своих территорий врагу."
 CHI_indo_chinese_campaign:0 "Индо-китайская кампания"
 CHI_indo_chinese_campaign_desc:0 "У нас долгая история с Юго-Восточной Азией, и сегодня написана еще одна глава. Мы отвоюем этот район у [671.controller.GetNameDef] Чтобы союзные войска могли действовать свободно."
 CHI_international_squadron:0 "Пригласите летающих тигров"
 CHI_international_squadron_desc:0 "Наши зарубежные друзья организовали волонтерскую группу пилотов и купили ряд современных самолетов для поддержки наших военных усилий. Мы должны приветствовать их инициативу с распростертыми объятиями."
 CHI_form_the_chinese_womens_national_war_relief_society:0 "Открытые школы для студентов"
 CHI_form_the_chinese_womens_national_war_relief_society_desc:0 "Многие из нас многое потеряли в борьбе с империализмом, и мы должны удовлетворить их потребности. Китайское женское национальное общество по оказанию помощи в войне показало многообещающие результаты и должно быть расширено для повышения эффективности."
 CHI_towards_a_professional_army:0 "К профессиональной армии"
 CHI_towards_a_professional_army_desc:0 "Наша армия большая, но ее эффективность спорна. Немецкая группа военных советников рекомендовала сократить численность армии и сосредоточиться на создании более мелких, лучше оснащенных сил с высоким боевым духом и эффективностью."
 CHI_towards_a_popular_army:0 "На пути к народной армии"
 CHI_towards_a_popular_army_desc:0 "Нашим вооруженным силам не хватает техники и подготовки, но у нас есть только люди. Мы заставим иностранных захватчиков разбить стену солдат Национальной революционной армии."
 CHI_the_hanoi_route:0 "Ханойский маршрут"
 CHI_the_hanoi_route_desc:0 "Наши восточные порты уязвимы для [JAP.GetNameDef] Мы должны принять меры предосторожности. Спускаться с гор из Куньмина в джунгли вокруг Ханоя — сложный путь, но он даст нашим поставкам некоторую передышку."
 CHI_form_saco:0 "Формирование SACO"
 CHI_form_saco_desc:0 "Чтобы победить, нужно знать своего врага. Американцы предложили создать китайско-американскую кооперативную организацию для обмена разведданными и помощи в подготовке наших партизанских отрядов."
 CHI_the_burma_road:0 "Бирманская дорога"
 CHI_the_burma_road_desc:0 "Наши зарубежные союзники продемонстрировали свою готовность поддержать нас материально, но военное давление со стороны России и США не ослабло. [JAP.GetName] Это затрудняет доставку. Прокладка маршрута через Бирму позволит нам увеличить количество материальных средств, которые мы могли бы получить с юго-запада."
 CHI_the_hump_sea:0 "Горб"
 CHI_the_hump_sea_desc:0 "Поезда, грузовики и корабли — все хорошо, когда дело доходит до доставки техники, но будущее в небе. С опытными пилотами мы сможем летать над Гималаями и приземляться в Юньнани, а это означает, что ничто не сможет остановить наши поставки."
 CHI_women_in_the_war_effort:0 "Новая женщина в военном деле"
 CHI_women_in_the_war_effort_desc:0 "Со времени Четвертого мая роль женщин в обществе изменилась навсегда. Охватывая современность и любовь к своей стране, женщины также должны быть в состоянии внести свой вклад. Организация женских батальонов и их интеграция в вооруженные силы нам очень поможет."
 CHI_the_sky_cannot_have_two_suns:0 "Небо не может иметь два солнца."
 CHI_the_sky_cannot_have_two_suns_desc:0 "Коммунистическая подрывная деятельность угрожает самой ткани китайского общества. Только доказав наше превосходство и уничтожив их дело, Китай выживет, объединившись под одним знаменем. Два солнца могут зайти, но только одно взойдет на рассвете."
 CHI_the_sky_cannot_have_two_suns_tt:0 "Каждый военачальник в нашей фракции, которая тоже коммунистическая:\n   Добавить: §Y-10.00%§! фракционное влияние"
 CHI_preemptive_strike:0 "Упреждающий удар"
 CHI_preemptive_strike_desc:0 "С каждым днем наши внутренние враги становятся все сильнее, сговорившись против нашей власти. Мы больше не можем ждать, пока кто-то попытается захватить власть в Китае, нам нужно действовать, нам нужно наносить удары!"
 CHI_preemptive_strike_tt:0 "Мы получим §Y$annex_everything$§! Враждебные клятвы на всех [CHI.GetAdjective] Военачальник, который не присоединился [ROOT.GetFactionName] Или отвергли наши требования стать подданными."
 CHI_tour_the_north:0 "Тур по северу"
 CHI_tour_the_north_desc:0 "Горные внутренние районы стали центром коммунистической агитации. Этого нельзя допустить, и мы должны сделать наше присутствие известным, путешествуя по провинциям."
 CHI_unlock_faction_goal_north_subjugated_tt:0 "Если это первый тур, то цель фракции §Y$faction_goal_north_subjugated_name$§! будет разблокирован."
 CHI_tour_the_west:0 "Тур по Западу"
 CHI_tour_the_west_desc:0 "В стране гор и пустынь место старого Шелкового пути находится далеко от залов власти.[SOV.GetNameDefCap] Он распространяет свое влияние в этом регионе, и поэтому мы позаботимся о том, чтобы местные брокеры знали, куда им следует обратить свое внимание."
 CHI_unlock_faction_goal_west_subjugated_tt:0 "Если это первый тур, то цель фракции §Y$faction_goal_west_subjugated_name$§! будет разблокирован."
 CHI_tour_the_south:0 "Экскурсия по югу"
 CHI_tour_the_south_desc:0 "Юг Китая — это разнообразное и динамичное место, часто окно в мир. Это место, где была создана наша партия, в последнее время обрело большую автономию, и это тенденция, которую мы должны вернуть. Мы обязательно посетим эти провинции!"
 CHI_unlock_faction_goal_south_subjugated_tt:0 "Если это первый тур, то цель фракции §Y$faction_goal_south_subjugated_name$§! будет разблокирован."
 CHI_ma_clique_integration_cost:0 "Снижение затрат на интеграцию [XSM.GetNameDef], [GSM.GetNameDef] и [NXM.GetNameDef] через §G[?ma_clique_integration_cost_reduction|%G0]§!"
 CHI_warlord_integration_cost_reduction:0 "Уменьшает затраты на §YPress Warlords станет нашей темой§! через £faction_initiative_texticon §G-5%§! и £pol_power §G-50§!"
 CHI_shx_integration_cost:0 "Снижение затрат на интеграцию [SHX.GetNameDef] через §G[?shx_integration_cost_reduction|%G0]§!"
 CHI_snd_integration_cost:0 "Снижение затрат на интеграцию [SND.GetNameDef] через §G[?snd_integration_cost_reduction|%G0]§!"
 CHI_khm_integration_cost:0 "Снижение затрат на интеграцию [KHM.GetNameDef] через §G[?khm_integration_cost_reduction|%G0]§!"
 CHI_sik_integration_cost:0 "Снижение затрат на интеграцию [SIK.GetNameDef] через §G[?sik_integration_cost_reduction|%G0]§!"
 CHI_sic_integration_cost:0 "Снижение затрат на интеграцию [SIC.GetNameDef] через §G[?sic_integration_cost_reduction|%G0]§!"
 CHI_yun_integration_cost:0 "Снижение затрат на интеграцию [YUN.GetNameDef] через §G[?yun_integration_cost_reduction|%G0]§!"
 CHI_gxc_integration_cost:0 "Снижение затрат на интеграцию [GXC.GetNameDef] через §G[?gxc_integration_cost_reduction|%G0]§!"
 CHI_gdc_integration_cost:0 "Снижение затрат на интеграцию [GDC.GetNameDef] через §G[?gdc_integration_cost_reduction|%G0]§!"
 CHI_victory_over_the_invaders:0 "Победа над захватчиками"
 CHI_victory_over_the_invaders_desc:0 "Иностранные захватчики были избиты, и наша славная Национальная Революционная Армия одержала победу. Эта война и, что более важно, наш почетный лидер [root.GetLeader]Мы объединили наши разрозненные провинции и народы в единую нацию под белым солнцем."
 CHI_remove_guerilla_decisions_tt:0 "§RУдалить§! §Y$PRC_guerilla_warfare_sea_cat$§! Решения"
 CHI_petition_territorial_restoration:0 "Петиция о территориальном восстановлении"
 CHI_request_territory_trigger_tt:0 "Любое контролируемое государство:\n      Является ядром §Y[ROOT.GetNameWithFlag]§!\n      Контроллер: $is_literally_china_tt_NOT$\n      Одно из следующих должно быть верным:\n         Не принадлежит Контролеру\n         Контроллер:\n            Нынешняя правящая партия §Y[ROOT.GetRulingIdeology]§!"
 CHI_petition_territorial_restoration_desc:0 "$PRC_restore_territorial_integrity_desc$"
 CHI_crush_the_communists:0 "Сокрушать [PRC.GetNameDef]"
 CHI_crush_the_communists_desc:0 "Пришло время наконец-то закончить то, что мы начали так давно. Полное и полное уничтожение [PRC.GetNameDef]! Слишком долго мы отвлекались на другие вещи, но больше не будем терпеть эту неприятность!"
 CHI_request_handover_of_coastal_cities:0 "Запрос на передачу прибрежных городов"
 CHI_request_handover_of_coastal_cities_desc:0 "$PRC_dare_to_struggle_desc$"
 CHI_a_generalissimo_for_all_of_china:0 "Генералиссимус для всего Китая"
 CHI_a_generalissimo_for_all_of_china_desc:0 "Наша борьба с чужеземным захватчиком была болезнью кожи, но наша внутренняя угроза всегда была болезнью сердца. Болезнь, с которой мы сейчас имеем дело, чтобы мечтать о будущем."
 CHI_empower_the_mtac:0 "Расширение возможностей MTAC"
 CHI_empower_the_mtac_desc:0 "Сообщество [ROOT.GetNameDef] Он находится на пути к гармонии, но работа еще не завершена. Комиссия по делам Монголии и Тибета курировала отношения с группами, присутствующими в нашей стране, но могла бы играть более активную роль. Мы доставим революцию нашим братьям за границу!"
 CHI_empower_the_mtac_tt:0 "Разблокировать решения в ядро [MON.GetFlag] §Y[MON.GetAdjective]§! и [TIB.GetFlag] §Y[TIB.GetAdjective]§! штатов."
 CHI_unify_the_admissions_process:0 "Унифицировать процесс приема"
 CHI_unify_the_admissions_process_desc:0 "Наша система высшего образования разделена между несколькими сайтами, а процесс подачи заявок сложен и сломан. Если мы реструктурируем процесс в совместный вступительный экзамен, мы позаботимся о том, чтобы были места для каждого грамотного студента."
 CHI_retreat_to_taiwan:0 "Отступление на Тайвань"
 CHI_retreat_to_taiwan_desc:0 "Возобновленный конфликт с [PRC.GetNameDef] Мы не всегда развивались в нашу пользу, и мы теряем позиции. Все больше и больше людей выражают свою озабоченность и открыто выступают за то, чтобы мы сделали тактическое отступление на Тайвань, восстановили наши силы и выжили."
 CHI_joining_the_international_community:0 "Международное сообщество"
 CHI_joining_the_international_community_desc:0 "Слишком долго мы смотрели внутрь себя, что только давало другим возможность эксплуатировать нас. Теперь мы должны выйти в мир и присоединиться к тем, кто стремится к свободе, к тем, которые поддерживали нас в самый страшный момент!"
 CHI_a_world_freed_from_communism:0 "Мир, освобожденный от коммунизма"
 CHI_a_world_freed_from_communism_desc:0 "Фашизм поджег весь мир, но это не единственная идеология, которая угрожает человечеству. Мы должны завершить миссию, которую мы начали в нашей собственной стране, и избавить этот мир от злых мыслей!"
 CHI_reclaim_the_north:0 "Восстановить Север"
 CHI_reclaim_the_north_desc:0 "Из необходимости мы должны были отказаться от своих притязаний на большие участки северной территории в прошлом. Но все изменилось, и теперь мы находимся в гораздо более сильной позиции — достаточно сильной, чтобы снова вернуть наши северные владения!"
 CHI_subjugate_korea:0 "$PRC_subjugate_korea$"
 CHI_subjugate_korea_desc:0 "$PRC_subjugate_korea_desc$"
 CHI_strengthening_our_resolve:0 "Укрепление нашей решимости"
 CHI_strengthening_our_resolve_desc:0 "Старые фракции дерутся, а нынешнее руководство недостаточно сильно, чтобы нас объединить. Необходимо изменить курс, так как Республика должна выдержать, а не распуститься."
 CHI_china_reborn:0 "Китай возрождается"
 CHI_china_reborn_desc:0 "Старые идеи привели нас только к эксплуатации империалистами. Нужны фундаментальные изменения. Мы должны перестроить наше общество с новой идеологией. Мы начнем серию кампаний, которые будем называть Движением новой жизни."
 CHI_co_opt_the_koh_hsin_movement:0 "Кооптировать движение Koh-hsin"
 CHI_co_opt_the_koh_hsin_movement_tt:0 "Уменьшает стоимость коммунистической контринфильтрации. §G25%§!"
 CHI_co_opt_the_koh_hsin_movement_desc:0 "Партия стала слишком бюрократичной и коррумпированной, и нам нужно очистить прогнившие элементы. Более сильная линия не только полезна, но и имеет решающее значение для нашего национального выживания."
 permanently_protected_from_infiltration:0 "Государство не может быть инфильтровано коммунистическими силами."
 CHI_mend_the_rift_with_hu:0 "Скачать игру Mend the Rift with Hu"
 CHI_mend_the_rift_with_hu_desc:0 "Старое соперничество между [ROOT.GetLeader] Ху Ханьминь ослабил партию достаточно долго. Следование Ханмина означает, что он обладает значительным влиянием, которое принесло бы пользу нации, если бы мы могли объединиться."
 CHI_revive_the_western_hills_group:0 "Возрождение группы Western Hills"
 CHI_revive_the_western_hills_group_desc:0 "[ROOT.GetNameDefCap] Слишком долгое время на него оказывали влияние иностранные силы. Необходим возврат к традициям, и эта линия была проведена Лин Сеном и Дай Джитао. Это позволит нам понять доктора. Идеи Солнца в том виде, в каком они были задуманы, свободны от искажений."
 CHI_reform_the_blue_shirts:0 "Реформирование синих рубашек"
 CHI_reform_the_blue_shirts_desc:0 "Общество практики трех принципов народа (Общество синих рубашек) действует уже почти полвека, но с ограниченной эффективностью. Из-за нераспространения среди простого человека фракция не достигла своего полного потенциала. Реформируя организацию как народный фронт, мы будем бросать вызов коммунистам в их собственной игре."
 modify_blue_shirts:0 "Изменить будет §Y$CHI_blue_shirt_society$§! посредством:"
 CHI_empower_the_bureau_of_investigation_and_statistics:0 "Расширить полномочия Бюро расследований"
 CHI_empower_the_bureau_of_investigation_and_statistics_desc:0 "С давних времен знание о враге и о себе побеждало в битвах. Нам нужна организация, способная получать необходимую нам информацию, и мы должны расширить Национальное бюро расследований и статистики."
 CHI_revise_the_national_curriculum:0 "Пересмотр национальной учебной программы"
 CHI_revise_the_national_curriculum_desc:0 "С такой большой страной, как наша, неудивительно, что существует много разных позиций. Мы могли бы стандартизировать и организовать нашу систему образования, чтобы поощрять определенное, желаемое поведение."
 CHI_target_upper_society:0 "Цель Верхнее общество"
 CHI_target_upper_society_desc:0 "Верхняя часть общества отказалась от собственных ценностей и стала слишком заинтересована в космополитическом досуге, в то время как она должна стать примером нравственной и добродетельной жизни простого человека. Как только это произойдет, мы сможем поднять всю нацию через возрождение духа и превзойти простое материальное богатство."
 CHI_outlaw_opposition_parties:0 "Запретить оппозиционные партии"
 CHI_outlaw_opposition_parties_desc:0 "Гоминьдан доминировал в течение почти десятилетия, но оппозиционные партии были разрешены. Мы опасаемся, что наша нация находится на перепутье, и нам нужно будет ограничить оппозицию, пока мы не разберёмся с ней. [JAP.GetNameDef] и коммунистов."
 CHI_seek_out_western_fascist_cooperation:0 "Ищите западное сотрудничество"
 CHI_seek_out_western_fascist_cooperation_desc:0 "Из-за иностранного вмешательства в прошлом мы отставали в техническом развитии. Каким бы отвратительным это ни казалось, было бы мудро искать сотрудничества с западными странами, сочувствующими нашему делу, чтобы мы могли наверстать упущенное, прежде чем мы повернем на них столы."
 CHI_a_chapter_in_every_village:0 "Глава в каждой деревне"
 CHI_a_chapter_in_every_village_desc:0 "Наши синие рубашки добились успеха в городах, но большинство населения живет в сельской местности. Нам нужно расширить организацию, чтобы она была представлена в каждом городе, деревне и деревне."
 CHI_secure_the_northern_front:0 "Защищайте Северный фронт"
 CHI_secure_the_northern_front_desc:0 "Мы уже уступили Маньчжурию японцам, безусловно, нашему самому сильному и опасному соседу. Мы должны обезопасить северную границу, чтобы мы могли следить за японцами и убедиться, что они не получат никаких идей о расширении дальше на юг."
 CHI_a_party_unified:0 "Партия единая"
 CHI_a_party_unified_desc:0 "Благодаря дисциплине, нравственности и добродетели мы создали единство внутри нашей партии. Мелкие ссоры и раздоры позади нас, и мы движемся вперед под синим знаменем и белым солнцем. На пути к окончательной победе над всеми врагами, внутренними и внешними!"
 CHI_a_party_unified_tt:0 "§RОтправка Чан Кайши в Гуанчжоу во время инцидента в Лянгуане приведет к его смерти раньше.§!"
 CHI_a_popular_movement:0 "Народное движение"
 CHI_a_popular_movement_desc:0 "Новая глава в нашей истории требует новой организации. Все будут знать, что мы, как народ, являемся волной, омывающей старое общество, делающей каждого члена частью этого большего целого."
 CHI_a_popular_movement_trigger:0 "§YКоррупция в Вооруженных Силах§! Фактор воинской повинности больше, чем §Y0%§!"
 CHI_integrate_the_hongmen:0 "Интеграция оборонных групп"
 CHI_integrate_the_hongmen_desc:0 "Китай полон групп, созданных для защиты от цинского угнетения. Со времен Синьхайской революции они потеряли свое предназначение и пошли в разных направлениях. Мы могли бы снова дать им цель, включив их или подражая их организации и практике."
 CHI_ban_immoral_entertainment:0 "Запрет на аморальные развлечения"
 CHI_ban_immoral_entertainment_desc:0 "Декадентские формы развлечений распространились на наши берега и загрязнили наши моральные волокна. Мы должны запретить их в пользу более спортивных и художественных форм, а также создать целевые группы для обеспечения их соблюдения."
 CHI_develop_counterinsurgency_tactics:0 "Тактика борьбы с повстанцами"
 CHI_develop_counterinsurgency_tactics_desc:0 "Партизаны действуют нетрадиционными, непредсказуемыми способами, и нам нужно научиться бороться с ними. Мы должны организовать комиссии и группы для разработки методов и адаптации к новой форме войны."
 CHI_develop_counterinsurgency_tactics_tt:0 "будет производить §Y$CHI_counter_infiltration_measures$§! стоимость §Gполовина§! столько же"
 CHI_a_brotherhood_for_china:0 "Братство для Китая"
 CHI_a_brotherhood_for_china_desc:0 "Общество Голубых Рубашек - это для многих кучка скотов, нарушающих мир. Однако ее лидер Дай Ли рассматривает ее как братство, и это точка зрения, которую мы можем принять для укрепления единства."
 CHI_nationalize:0 "Национализируйтесь!"
 CHI_nationalize_desc:0 "Мы находимся в критическое время для нашей партии, нации и народа, поэтому частный интерес должен уступить национальной необходимости. Под нашим непосредственным руководством мы будем использовать эти заводы с максимальной эффективностью!"
 CHI_militarize:0 "Милитаризуйся!"
 CHI_militarize_desc:0 "Наше население стало равнодушным к своему месту в истории и нуждается в пробуждении. Мы заставим их почувствовать пыл революции и подготовим их к разгрому врагов, как внутренних, так и внешних."
 CHI_militarize_tt:0 "Блюшёртовые милиции будут подниматься во всех нынешних и будущих штатах. §Y$CHI_infiltrated_state_3$§!"
 CHI_productive:0 "Продуктивно!"
 CHI_productive_desc:0 "Бездельники ничего не строят! Лень не только удерживает нас, но и помогает врагу. С пассивной и апатичной потребностью нужно иметь дело, если мы хотим преобладать как партия!"
 CHI_enforce__virtues:0 "Заставить добродетелей"
 CHI_enforce__virtues_desc:0 "Тем не менее, люди тратят свое время на легкомысленные и бессмысленные занятия, в то время как они могут улучшить себя ради партии и нации. Мы были слишком слабы в наших усилиях по обеспечению соблюдения, и мы удвоим наши усилия."
 CHI_whampoa_ideological_primacy:0 "Идеологическое первенство Вампоа"
 CHI_whampoa_ideological_primacy_desc:0 "Из Вампоа наши офицеры носят не только оружие, но и принципы. В отличие от других школ, школам Вампоа можно доверять. Мы должны направить всю идеологическую подготовку через школу, чтобы укрепить нашу нацию в целом."
 CHI_postpone_the_tutelage:0 "Отложите опеку"
 CHI_postpone_the_tutelage_desc:0 "Хотя целью остается демократия, сейчас не время, и нынешний кризис требует специальных мер. Мы должны провести нацию через опасность, прежде чем демократия сможет расцвести."
 CHI_postpone_the_tutelage_tt:0 "Разблокировать решение на §Yперевоспитать§! определенный §YГенералы военачальники§! когда клики были покорены"
 CHI_second_father_of_the_nation:0 "Второй отец нации"
 CHI_second_father_of_the_nation_desc:0 "Доктор. Сунь Ят-сен позволил нам сбросить оковы Цин и всегда будет Первым Отцом нашей нации. Генералиссимус Чианг очистил партию коммунистов, и за это его всегда будут помнить как Второго Отца."
 CHI_weaponise_the_faithful:0 "Оружие для верных"
 CHI_weaponise_the_faithful_desc:0 "Те, кто верит больше всего, будут сражаться сильнее всех. В настоящее время у нас нет выхода для них, но мы могли бы сделать один и поставить их в первый ряд. Их преданность станет нашим самым острым клинком, уничтожающим каждого врага."
 CHI_political_advisors_in_every_division:0 "Политические советники в каждом отделе"
 CHI_political_advisors_in_every_division_desc:0 "Армия защищает государство до тех пор, пока оно этого не сделает. Слишком часто государство падает на тех, у кого есть оружие, но мы не позволим этому случиться с нами. Политические офицеры помогут мотивировать наши вооруженные силы к надлежащим действиям."
 CHI_an_alternative_rooted_in_tradition:0 "Альтернатива, укорененная в традиции"
 CHI_an_alternative_rooted_in_tradition_desc:0 "Либерализм и коммунизм — это иностранные понятия, не имеющие никакого значения в современном мире. [ROOT.GetAdjective] Нация. Только то, что мы делаем сами, может принести процветание и гордость нашим берегам."
 CHI_an_alternative_rooted_in_tradition_tt:0 "увеличивает стоимость инфильтрации для [PRC.GetNameDefCap] посредством: §G+25%§!"
 CHI_expel_the_occupiers:0 "$PRC_expel_the_occupiers$"
 CHI_expel_the_occupiers_desc:0 "$PRC_expel_the_occupiers_desc$"
 CHI_put_an_end_to_PRC:0 "Положите конец [PRC.GetNameDef]"
 CHI_put_an_end_to_PRC_desc:0 "Что действительно стоит на нашем пути к объединению всего Китая, так это те досадные коммунисты, которые держатся в горах. [PRC.GetLeader]. Пока они существуют, единого Китая не будет. Внутренние враги делают нас слабыми, слабость провоцирует иностранную агрессию, а внешняя агрессия рискует нашим суверенитетом. Таким образом, наш долг - положить конец [PRC.GetNameDef]!"
 CHI_reject_the_nine_powers:0 "Отвергнуть девять держав"
 CHI_reject_the_nine_powers_desc:0 "Договоры, навязанные нам чужаками из-за рубежа, были навязаны в период слабости, но теперь мы можем их отвергнуть. Пусть каждый подписавший знает: мы ничего не должны иностранцам!"
 CHI_setting_a_new_standard:0 "Установление нового стандарта"
 CHI_setting_a_new_standard_desc:0 "На нашу армию слишком сильно повлияли западная мысль и доктрина, но мы страна Сунь-цзы, а не Клаузевица. Благодаря структурным изменениям и идеологической работе мы изменили наши вооруженные силы по своему образу."
 CHI_eternal_revolution:0 "Вечная революция"
 CHI_eternal_revolution_desc:0 "Наши успехи показали эффективность нашей системы по сравнению со старыми и зарубежными идеями. Революционный огонь горит в сердце каждого соотечественника, и мы должны использовать его для дальнейшего распространения революции."
 CHI_eternal_revolution_tt:0 "Позволяет §YОбъявление зон военных действий§! в заявляемых государствах"
 CHI_reclaim_what_was_lost:0 "Восстановить то, что было потеряно"
 CHI_reclaim_what_was_lost_desc:0 "Цин унаследовал самую большую империю, которую мы когда-либо видели, и они растратили ее в пользу иностранных держав. Это принесло нам позор как народу, нации и партии. Мы должны исправить эту пародию и восстановить достоинство Китая."
 CHI_bring_the_wayward_back_into_the_fold:0 "Вернитесь в The Wayward Back Into the Fold"
 CHI_bring_the_wayward_back_into_the_fold_desc:0 "После Синьхайской революции некоторые из наших братьев были введены в заблуждение. Им сказали, что им лучше быть отдельно от коллектива. Настало время вернуть это и вернуть их в лоно."
 CHI_retake_coastal_cities:0 "Восстановление прибрежных городов"
 CHI_retake_coastal_cities_desc:0 "Слишком долго западные империалисты навязывали нам свою волю. Настало время вернуть то, что было украдено.[326.GetName], [729.GetName]и [728.GetName] Мы должны снова стать частью нашего мира!"
 CHI_a_new_middle_kingdom:0 "Новое Среднее Королевство"
 CHI_a_new_middle_kingdom_desc:0 "В предыдущие эпохи мы были точкой, вокруг которой вращается мир. Это изолировало нас от мира и заставило эпохи пройти мимо нас. Мы не повторим эту ошибку, и на этот раз мы будем творцами нашей собственной судьбы и судьбы других."
 CHI_remove_infiltration_decisions_tt:0 "§RУдалить§! §Y$PRC_infiltration_sea_cat$§! Решения"
 CHI_the_southern_mandate:0 "Южный мандат"
 CHI_the_southern_mandate_desc:0 "К югу лежит земля, богатая ресурсами и людьми нашего рода. Мы имеем право на эти земли из наших древних связей, и пришло время нам идти на юг."
 CHI_the_northern_mandate:0 "Северный мандат"
 CHI_the_northern_mandate_desc:0 "К северу от наших земель лежит пустая пустошь, алмаз в необработанном виде. [SOV.GetNameDef] Он разбазаривается. Только те, кто в состоянии увидеть землю за ее истинный потенциал, должны держать ее, и мы это делаем!"
 CHI_the_greater_game:0 "Большая игра"
 CHI_the_greater_game_desc:0 "Империалисты вели свою игру в Центральной Азии, но только разбивали головы в регионе. Пришло время идти на запад и снова перебросить наши войска через степи."
 CHI_cradle_of_civilization:0 "Колыбель цивилизации"
 CHI_cradle_of_civilization_desc:0 "Из застывших вод Желтой реки возникла цивилизация, которая сформировала человечество. Империи поднимаются и падают, но слава древнего Китая сияет на земле вечно, и так будет наше господство."
 CHI_cradle_of_civilization_tt:0 "Разблокировать решения для интеграции §Yазиатский§! Государства, которые являются §YЗаявленный§! Когда мы достигаем достаточно высокого §YСоблюдение§!"
 CHI_military_affairs_commission_sea:0 "Комиссия по военным делам"
 CHI_military_affairs_commission_sea_desc:0 "Основой эффективной армии является надлежащее высшее командование. Поскольку Комиссия по военным делам является нашей высшей организацией по защите нации, мы должны убедиться в ее компетентности."
 CHI_set_up_an_nco_school:0 "Создать школу NCO"
 CHI_set_up_an_nco_school_desc:0 "Подавляющая часть наших военных не имеет формального образования, которое для рядового солдата может быть прощено, но становится проблемой при продвижении по служебной лестнице. Нам нужно создать систему подготовки наших унтер-офицеров, чтобы мы могли убедиться в качестве."
 CHI_formalize_field_promotions:0 "Формализовать полевые продвижения"
 CHI_formalize_field_promotions_desc:0 "В идеальном мире у нас была бы полностью обученная и образованная армия. Но это не тот мир. В нашем нынешнем затруднительном положении вывод войск на фронт является нашим приоритетом, и чем быстрее мы сможем это сделать, тем лучше. Мы создадим программу поиска тех из рядовых солдат, которые смогут вести своих товарищей вперед."
 CHI_crackdown_on_corruption_in_recruitment:0 "Борьба с коррупцией"
 CHI_crackdown_on_corruption_in_recruitment_desc:0 "С момента создания республиканской армии в вербовке возникли системные вопросы. Люди платят за свой выход из службы, а творческий учет используется для хищения заработной платы. Это должно закончиться, если мы хотим пережить натиск современного мира, поскольку нет места для неэффективности."
 CHI_form_the_combined_logistics_command:0 "Объединённое логистическое командование"
 CHI_form_the_combined_logistics_command_desc:0 "Теперь, когда наша армия реорганизована и эффективно справляется с любыми угрозами нашей нации, мы сталкиваемся с другими проблемами. Несмотря на улучшение материально-технического положения, наши вооруженные силы не координируют свои действия в системах материально-технического обеспечения. Мы должны немедленно решить этот вопрос!"
 CHI_reorganise_the_train:0 "Реорганизовать поезд"
 CHI_reorganise_the_train_desc:0 "Наша организация снабжения никогда не развивалась до масштабов или сложности, в которых мы нуждаемся. Тщательная реорганизация даст нам возможность ввести больше войск в бой."
 CHI_rely_on_locals:0 "Доверяйте местным"
 CHI_rely_on_locals_desc:0 "Создание полноценной организации, которая может быть использована нашими силами, является сложным, трудоемким и дорогостоящим. История показывает нам альтернативу, почему корабль то, что можно найти на месте. Если мы полагаемся на фермеров и рабочих, которые населяют нашу большую землю, мы можем компенсировать разницу, оставшуюся от нашей системы."
 CHI_focus_on_meritocratic_principles:0 "Сосредоточьтесь на меритократических принципах"
 CHI_focus_on_meritocratic_principles_desc:0 "Непотизм, взяточничество и коррупция — это проклятие эффективной армии. Эти мерзости слишком широко распространены в наших силах, и это необходимо изменить. Создание структур для продвижения наиболее достойных людей на нужные позиции гарантирует победу."
 CHI_focus_on_meritocratic_principles_tt:0 "Возможность вручную удалить армейский дух §YПреимущество Вампоа§!"
 CHI_protracted_warfare:0 "Затянувшаяся война"
 CHI_protracted_warfare_desc:0 "С тех пор [JAP.GetNameDef] Победив русских, его народ поверил, что быстрые, агрессивные действия - это путь к победе. Это привело к тому, что у них была армия без сохранения силы, поэтому, если мы откажем им в быстрой победе, их подразделения рухнут в короткие сроки."
 CHI_decisive_battles:0 "Решительные битвы"
 CHI_decisive_battles_desc:0 "Все победы не несут того же веса, что было показано на примере [JAP.GetNameDef] В 1905 году. Мы должны сосредоточить наши силы на победе в ключевых сражениях, взяв на себя инициативу нанести удар по Маньчжурии."
 CHI_invest_in_mountain_guns:0 "Инвестиции в горные ружья"
 CHI_invest_in_mountain_guns_desc:0 "Наши земли трудно пересечь, и перемещение через них традиционной тяжелой артиллерии является для большинства вызовом. Разобрать оружие по желанию – естественное решение этой проблемы, достойное изучения."
 CHI_repurpose_fort_artillery:0 "Перепрофилировать крепостную артиллерию"
 CHI_repurpose_fort_artillery_desc:0 "Война больше не может быть заперта ключевыми укреплениями, конец последней великой войны показал это. Хотя сооружения могут не иметь большой ценности, артиллерия в них все еще может стрелять по противнику."
 CHI_repurpose_fort_artillery_tt:0 "§RВы не контролируете никакие форты, чтобы демонтировать. §!"
 CHI_fund_the_marine_corp:0 "Финансирование морской пехоты"
 CHI_fund_the_marine_corp_desc:0 "Наши армии огромны, и их мощь не подлежит сомнению, но может быть тупым инструментом при неправильном использовании. Специализированный корпус профессиональной морской пехоты, обученный защищать наши береговые линии, стоил бы десятикратного их количества в обычных войсках, и когда придет время, проецируйте нашу власть над морями."
 CHI_the_4_defence_areas:0 "4 Оборонные зоны"
 CHI_the_4_defence_areas_desc:0 "Если мы хотим успешно защитить нашу великую нацию, то для успеха необходим всеобъемлющий план. Мы разделим страну на четыре зоны и назначим каждому соответствующего командира, это обеспечит местную безопасность и эффективное сопротивление."
 CHI_defence_in_depth:0 "Глубокоэшелонированная оборона"
 CHI_defence_in_depth_desc:0 "Правильная защита не может быть статической, и мы должны включить это в нашу стратегию. Мы знаем, что  [JAP.GetAdjective] У нас нет стойкости, поэтому чем больше мы можем привлечь их, тем лучше. Приливы и отливы не должны разрушать плотины, которые являются нашими вооруженными силами."
 CHI_prepare_the_war_zones:0 "Подготовьте зоны военных действий"
 CHI_prepare_the_war_zones_desc:0 "Мы должны реорганизовать наши армии по региональному признаку, чтобы знать, кто несет ответственность за какой район. Это позволит нам спланировать соответствующие операции для данной области и максимизировать нашу способность прорваться."
 CHI_guerrilla_warfare:0 "Партизанская война"
 CHI_guerrilla_warfare_desc:0 "Обычная война позволяет нам сопротивляться до известной степени, но борьба на нашей собственной земле позволяет нам более нетрадиционные методы. Проникновение в государства, удерживаемые противником, и нанесение ущерба тыловым элементам — это способ борьбы, который [JAP.GetNameDef] Они совершенно не готовы к этому."
 CHI_guerrilla_warfare_tt:0 "Разблокировать §Y$PRC_guerilla_warfare_sea_cat$§! Решения"
 CHI_rapidity_is_the_essence_of_war:0 "Быстрость — это сущность войны"
 CHI_rapidity_is_the_essence_of_war_desc:0 "Скорость и неожиданность — наше лучшее оружие, и обучение тому, как использовать эти элементы, будет иметь первостепенное значение в современной войне. Смелые и быстрые маневры удержат противника вдали от равновесия и, таким образом, позволят нанести более глубокий удар с меньшим сопротивлением."
 CHI_organise_the_200th_division:0 "Организация 200-го дивизиона"
 CHI_organise_the_200th_division_desc:0 "Бронетанковые войска являются величайшим новшеством в войне этого века, и, к сожалению, мы отстаем. Создание бронетанковой дивизии и назначение подходящего командира для руководства зарядом будет множителем силы, который проложит путь к победе."
 CHI_organise_the_200th_division_tt:0 "Получить одну элиту §Yбронированный§! в единицу [ROOT.capital.GetName]"
 CHI_motorise_our_infantry:0 "Моторизовать нашу пехоту"
 CHI_motorise_our_infantry_desc:0 "Наш пул рабочей силы огромен и всегда был источником нашей власти. Современный автомобильный транспорт наделяет рядового солдата силой, заставляя его быстрее вступать в бой и быть готовым нанести сильный удар. Человек в нужном месте, с винтовкой в руке, всегда будет эффективным."
 CHI_bog_them_down_in_the_centre:0 "Погрузите их в центр"
 CHI_bog_them_down_in_the_centre_modify:0 "Изменит бонус с §Y$CHI_bog_them_down$§! Чтобы дать: "
 CHI_bog_them_down_in_the_centre_desc:0 "Мы знаем, что не можем остановиться [JAP.GetNameDef] на границе, и что нам нужно выбрать другую линию обороны с осторожностью. Сосредоточение вокруг реки Янцзы было бы эффективным способом остановить агрессоров и сделать этот район центром всей нашей обороны. Однако процесс планирования нашей обороны по конкретным направлениям идет еще дальше."
 CHI_appear_where_you_are_not_expected:0 "Появляйтесь там, где вас не ждут"
 CHI_appear_where_you_are_not_expected_desc:0 "Ни один успешный полководец никогда не наносил ударов по противнику, где и как они этого ожидали. Обман является основой войны, и мы всегда должны казаться слабыми, когда мы сильны, и сильными, когда слабы."
 CHI_declare_war_zone_modify:0 "Изменит бонус с §Y$CHI_declare_war_zone$§! Чтобы дать: "
 CHI_relocate_factories_from_the_coast:0 "Перемещение фабрик с побережья"
 CHI_relocate_factories_from_the_coast_desc:0 "У нас серьезная стратегическая головоломка. Наши промышленные центры находятся вдоль береговой линии и находятся под угрозой попадания в руки противника. Без производства сопротивление не может длиться долго. Мы перенесем нашу продукцию вглубь страны, где она будет находиться в безопасности."
 CHI_relocate_factories_from_the_coast_tt:0 "Позволяет переселяться §YМИО§! и §YФабрики§!"
 CHI_relocate_factories_from_the_coast_tt_no_aat:0 "Позволяет переселяться §YФабрики§!"
 CHI_state_aa:0 "Щит к небу / A Shield to the Sky"
 CHI_state_aa_desc:0 "В этом новом мире враг атакует не только с суши и моря, но и с воздуха. Подготовка к натиску, который неизбежно придет с неба, повернув наши пушки вверх, будет необходима, если мы хотим удержать захватчиков."
 CHI_coastal_forts:0 "Стена в море / A Wall into the Sea"
 CHI_coastal_forts_desc:0 "В то время как иностранные захватчики и их марионетки сначала нападут с севера, мы можем быть уверены, что они в конечном итоге нанесут удар и с моря. Мы будем готовы выбросить их обратно в море, как только они осмелятся ступить на нашу землю."
 CHI_salvage_enemy_equipment:0 "Оборудование Enemy снаряжение"
 CHI_salvage_enemy_equipment_desc:0 "Потребности Национальной революционной армии ненасытны нашей промышленностью. Наши подразделения могли бы компенсировать некоторые из этих расхождений, используя то, что мы можем найти в лагере противника."
 CHI_salvage_enemy_equipment_random_generals_tt:0 "§YПять§! Случайно отобранные армейские лидеры получат §YСкряга§!: \n-$MODIFIER_EQUIPMENT_CAPTURE_FACTOR$: §G+50%§! "
 CHI_commemorate_the_labour_corps:0 "Память трудового корпуса"
 CHI_commemorate_the_labour_corps_desc:0 "Наш народ отправился за границу и трудился для признания нашей нации, проявляя усердие на полях сражений великой войны. Пока что [ENG.GetAdjective] и тот [FRA.GetAdjective] Мы не помним их, мы помним, и мы будем чтить их работу, возвышая их память и принимая их знания близко к сердцу."
 CHI_utilise_the_terrain:0 "Используйте территорию"
 CHI_utilise_the_terrain_desc:0 "Наши подразделения не оснащены новейшим оборудованием, и у них нет единого стандарта обучения, но если есть что-то, что мы глубоко знаем, это наши собственные земли. Мы можем использовать каждый водный путь, холм и поле в наших интересах, и таким образом сделать опыт любого, кто осмелится вторгнуться в живой ад."
 CHI_train_for_asymmetry:0 "Поезд для асимметрии"
 CHI_train_for_asymmetry_desc:0 "Война никогда не бывает справедливой, и мы никогда не можем ожидать ее. Есть те, у кого более сильные вооруженные силы, которые попытаются подчинить нас, и нам нужно найти способ сравнять шансы. Обучить наших военных и их лидеров находить новые способы борьбы будет трудно, но польза неоспорима."
 CHI_train_for_asymmetry_guerilla_cost_tt:0 "§GПоловину стоимости§! для принятия §Y$PRC_guerilla_warfare_sea_cat$§! Решения"
 CHI_train_for_asymmetry_random_generals_tt:0 "§YТри§! Случайно отобранные армейские лидеры получат §YПартизанский боец§!: \n-$MODIFIER_DIG_IN_SPEED_FACTOR$: §G+50%§!"
 CHI_know_thy_enemy:0 "Знай своего врага"
 CHI_know_thy_enemy_desc:0 "Нам нужно знать, как найти точки на вражеских линиях, где мы можем применить силу и использовать разрывы."
 CHI_know_thy_enemy_tt:0 "Разблокирует обновленную версию Force Attack, которая не теряет закрепления при атаке."
 CHI_know_thy_self:0 "Познай самого себя"
 CHI_know_thy_self_desc:0 "Понимание врага даст нам победы, но окончательная победа может прийти только через знание собственных способностей. Процессы строгой самооценки раскроют наши слабости, но также и сильные стороны."
 CHI_river_crossing_studies:0 "Исследования речного пересечения"
 CHI_river_crossing_studies_desc:0 "Китай — страна великих рек, и любая армия, которая будет действовать в нем, должна будет научиться воевать через них. Мы находимся в особенно хорошем месте, чтобы учиться на этом и применять эти знания на практике. Уроки, которые принесут нам пользу в изгнании захватчиков и выводе борьбы за границу."
 CHI_armoured_car_tactics:0 "Тактика бронированных автомобилей"
 CHI_armoured_car_tactics_desc:0 "Большинство армий становятся все более тяжелыми бронетанковыми подразделениями в гонке промышленной мощи. Тем не менее, один не более эффективен с топором, когда нужен нож."
 CHI_serve_the_country_with_utmost_loyalty:0 "Служить стране с самой большой преданностью"
 CHI_serve_the_country_with_utmost_loyalty_desc:0 "Мы показали свою стойкость врагу и остановили его на пути. Из-за непоколебимой преданности и служения нашей нации нет захватчика, который смог бы подчинить нас!"
 CHI_the_well_timed_swoop_of_a_falcon:0 "Оригинальное название: Swoop of a Falcon"
 CHI_the_well_timed_swoop_of_a_falcon_desc:0 "Мы научились наносить удары и уничтожать наших врагов. От изгнания захватчиков до нанесения ударов по ним в их собственном доме, старые знания остаются верными и по сей день, когда мы идем к победе!"
 CHI_rocaf:0 "Укрепление националистических ВВС"
 CHI_rocaf_desc:0 "Чтобы обеспечить [ROOT.GetName]Небо и проецируем силу за пределы наших границ, мы должны усилить ВВС. Инвестиции в доктрину и техническую экспертизу закладывают основу для современного воздушного оружия, способного бросить вызов любому противнику."
 CHI_officialize_the_rocaf:0 "Официализировать ВВС Китайской Республики"
 CHI_officialize_the_rocaf_desc:0 "Военно-воздушные силы слишком долго были неофициальной организацией. Теперь, с технологическими и тактическими разработками, которые мы сделали, можно безопасно реорганизовать Комиссию по авиационным делам в штаб-квартиру командования ВВС. РПКАФ является полностью отдельной отраслью службы, независимой от армии и флота."
 CHI_bring_the_war_home:0 "Принесите войну домой"
 CHI_bring_the_war_home_desc:0 "Наши враги должны знать, что ни одна часть их территории не находится вне досягаемости. С помощью целенаправленных бомбардировок и психологической войны мы нанесем глубокий удар и нарушим волю противника к борьбе."
 CHI_bring_the_war_home_tt:0 "Разблокирует следующие рейды:\n[GetHuangshenRaidTooltip]\n[GetTokyoImperialPalaceTooltip]\n[GetNationalDietTooltip]\n[GetHakkoIchiuTooltip]"
 CHI_projecting_power:0 "Проецирующая сила"
 CHI_projecting_power_desc:0 "Расширяя воздушный охват за пределы линии фронта, мы готовимся наносить удары везде, где есть возможность. Проецирование воздушных сил больше не является амбицией, а стратегической необходимостью."
 CHI_strike_at_what_is_weak:0 "Забастовка в том, что слабо"
 CHI_strike_at_what_is_weak_desc:0 "Мы не встретим силы лицом к лицу. Вместо этого наша доктрина должна подчеркивать, что наиболее уязвимые точки противника должны быть нацелены с точностью и настойчивостью."
 CHI_a_wind_that_rises_in_the_daytime_lasts_long:0 "Ветер, который поднимается днем, длится долго"
 CHI_a_wind_that_rises_in_the_daytime_lasts_long_desc:0 "Устойчивая бомбардировка при дневном свете обеспечивает стабильный, методичный подход к воздушной войне. Мы должны извлечь выгоду из видимости и координации для нанесения эффективных ударов."
 CHI_but_a_night_breeze_soon_falls:0 "Но ночной бриз скоро упадет"
 CHI_but_a_night_breeze_soon_falls_desc:0 "Ночные операции могут быть сопряжены с риском, но при усиленной подготовке наши пилоты могут минимизировать потери под покровом темноты. Враг никогда не увидит, что мы придем."
 CHI_escort_efficiency:0 "Повышение эффективности"
 CHI_escort_efficiency_desc:0 "Истребители сопровождения являются щитом для наших бомбардировщиков. Усиление координации и охвата обеспечивает более полное возвращение на базу, готовую к следующему вылету."
 CHI_controlling_our_skies:0 "Контролируем наше небо"
 CHI_controlling_our_skies_desc:0 "Прежде чем мы доминируем за рубежом, мы должны командовать небом дома. Дисциплинированная сеть противовоздушной обороны является основой национальной безопасности."
 CHI_interception_detection:0 "Обнаружение перехвата"
 CHI_interception_detection_desc:0 "Своевременное обнаружение позволяет нанести удар раньше противника. Мы улучшим наши радиолокационные и наблюдательные сети, чтобы получить это критическое преимущество."
 CHI_focus_on_positional_advantage:0 "Сосредоточьтесь на позиционных преимуществах"
 CHI_focus_on_positional_advantage_desc:0 "Воздушные бои — это не только количество или скорость. Преимущество заключается в высоте, углу и осознанности. Мы должны научить наших пилотов использовать все возможности."
 CHI_effectivize_ground_crew_usage:0 "Эффективизация использования наземного экипажа"
 CHI_effectivize_ground_crew_usage_desc:0 "Эффективность на земле так же важна, как и производительность в небе. Упорядочение задач экипажа и логистики позволит сохранить больше самолетов в воздухе."
 CHI_coordinate_with_the_army:0 "Координация с армией"
 CHI_coordinate_with_the_army_desc:0 "Победа исходит из единства оружия. Наши воздушные и наземные силы должны действовать с одним умом для одной миссии."
 CHI_an_appropriate_design:0 "Соответствующий дизайн"
 CHI_an_appropriate_design_desc:0 "Наши самолеты должны соответствовать нашей доктрине. Будь то дальность или устойчивость, мы будем разрабатывать проекты, которые соответствуют нашим эксплуатационным потребностям."
 CHI_an_appropriate_design_3_tt:0 "Если §Y$CHI_projecting_power$§! Были приняты:\n "
 CHI_an_appropriate_design_2_tt:0 "Если §Y$CHI_controlling_our_skies$§! Были приняты:\n "
 CHI_reorganise_the_central_armys_academy_aviation_corps:0 "Реорганизация авиационного корпуса Академии"
 CHI_reorganise_the_central_armys_academy_aviation_corps_desc:0 "Обучение должно развиваться с помощью технологий. Мы будем модернизировать наш авиационный корпус, чтобы изготовить современных, способных летчиков, пригодных для завтрашнего боя."
 CHI_formalise_training_regime:0 "Формализовать режим обучения"
 CHI_formalise_training_regime_desc:0 "Последовательный и строгий режим обучения является ключом к снижению потерь и повышению производительности. Стандартизация начинается сейчас."
 CHI_conserve_our_pilots:0 "Сохраним наших пилотов"
 CHI_conserve_our_pilots_desc:0 "Пилотов не так-то просто заменить. Снижая риски и повышая живучесть, мы сохраняем опыт и сохраняем боевую мощь."
 CHI_camco_primacy:0 "$CHI_camco_organization_sea$ Первенство"
 CHI_camco_primacy_desc:0 "CAMCO является нашим лучшим отечественным партнером в области развития воздушного транспорта. Приоритетность их возможностей обеспечит соответствие производства амбициям."
 CHI_SINAW_primacy:0 "$CHI_sinaw_organization_sea$ Первенство"
 CHI_SINAW_primacy_desc:0 "SINAW предлагает технические инновации, которые не может предложить CAMCO. Инвестиции в их расширение приближают нас к паритету с иностранными державами."
 CHI_initiate_the_sky_projects:0 "Инициировать проекты Sky"
 CHI_initiate_the_sky_projects_desc:0 "Ракетная техника и передовые двигатели открывают новые стратегические возможности. Мы будем финансировать экспериментальные инициативы с учетом долгосрочной отдачи."
 CHI_focus_on_the_Tianlong_project:0 "Основное внимание уделяется проекту Tianlong"
 CHI_focus_on_the_Tianlong_project_desc:0 "Реактивное движение — это будущее воздушной войны. Проект Тяньлун находится на переднем крае этой эволюции."
 CHI_VTOL_experiments:0 "Эксперименты VTOL"
 CHI_VTOL_experiments_desc:0 "Вертикальный взлет самолета обещает гибкость на непредсказуемой местности. Мы начнем испытания, чтобы оценить их роль в современном бою."
 CHI_hongxiang_force:0 "Парашютно-десантные войска Юньнань"
 CHI_hongxiang_force_desc:0 "Благодаря сотрудничеству с нашими союзниками и коллегами в авиации нам удалось создать внутреннюю программу обучения для военных парашютных операций."
 CHI_republic_of_china_navy:0 "Военно-морской флот Китайской Республики"
 CHI_republic_of_china_navy_desc:0 "У Центрального военно-морского флота было проблемное прошлое, с плохим финансированием и неопределенным контролем над побережьем, оставив наши корабли в плохой форме. С проблемами на горизонте, наша цель - оставить эти проблемы позади."
 CHI_foreign_acquisition:0 "Иностранное приобретение"
 CHI_foreign_acquisition_desc:0 "Хотя мы стремимся к тому, чтобы это было временной неудачей, мы должны признать, что другие державы далеко за пределами нас с точки зрения военно-морского технологического прогресса. Модернизация нашего флота должна начаться с приближения к технологически превосходящему благодетелю."
 CHI_develop_northern_naval_logistics:0 "Развитие логистики Северного флота"
 CHI_develop_northern_naval_logistics_desc:0 "Циндао, формально восстановленный из Японии в 1922 году, представляет собой ключевой стратегический портовый город, который должен играть роль в наших усилиях по милитаризации военно-морского флота."
 CHI_develop_southern_naval_logistics:0 "Развитие военно-морской логистики Юга"
 CHI_develop_southern_naval_logistics_desc:0 "Наше южное побережье, усеянное колониальными эксклавами, ужасно незащищено. Если мы когда-либо будем встречаться с западными державами на их собственных условиях, то освоение и развитие этой ключевой области является необходимостью."
 CHI_concerted_push:0 "Концертный Push"
 CHI_concerted_push_desc:0 "Снова и снова китайский народ демонстрирует свою адаптивность перед лицом невзгод. Эта ситуация ничем не отличается. Наше руководство заявило о необходимости создания военно-морского флота, чтобы конкурировать с великими державами, и наша экономика должна принять вызов."
 CHI_local_alloy_commission:0 "Местная легированная комиссия"
 CHI_local_alloy_commission_desc:0 "Наша земля является источником больших природных минеральных богатств, но, несмотря на это, мы еще не воспользовались этим. Изучение наших возможностей здесь обязательно принесет дивиденды в будущем."
 CHI_deny_the_enemy:0 "Отказать врагу"
 CHI_deny_the_enemy_desc:0 "В то время как наше превосходство на суше не имеет себе равных, возможно, лучшее, на что мы можем надеяться по мере того, как мы оживляем наш больной военно-морской флот, - это отказ от операций противника."
 CHI_dominate_the_enemy:0 "Доминировать над врагом"
 CHI_dominate_the_enemy_desc:0 "Мы будем бороться с нашими противниками на равных условиях, независимо от стоимости."
 CHI_navy_spooks:0 "Развивать военно-морскую разведку"
 CHI_navy_spooks_desc:0 "Океаны вокруг Китая являются оживленными центрами торговой деятельности. Там, где есть трейдеры, ходят слухи. Там, где есть слухи, есть возможности."
 CHI_promote_admiral:0 "Поощрение адмиралов"
 CHI_promote_admiral_desc:0 "Наши недавние усилия по военно-морскому строительству в конечном итоге сделают наши больные военные корабли 19-го века устаревшими. Это, однако, представляет собой неблагоприятную возможность превратить их в учебные суда как для экипажа, так и для командиров; Программа обучения оптимизирована вокруг стратегического направления нашего флота."
 CHI_promote_admiral_tt:0 "Если §Y$CHI_deny_the_enemy$§! После этого все адмиралы получат §Y$green_water_expert$§! черта \n\nЕсли §Y$CHI_dominate_the_enemy$§! После этого все адмиралы получат §Y$blue_water_expert$§! черта "
 CHI_promote_admiral_dingwen_tt:0 "Поощрять §Y$CHI_jiang_dingwen_admiral$§! В Адмиралтейство"
 CHI_heavy_ship_research:0 "Исследования тяжелых кораблей"
 CHI_heavy_ship_research_desc:0 "Отечественное производство линкоров имеет жизненно важное значение для того, чтобы соответствовать региональным и колониальным державам, которые до сих пор грабили нашу страну. В то время как наши технологии могут поставить нас в невыгодное положение, наши производственные процессы и воля наших людей будут нести день."
 CHI_strike_from_below:0 "Забастовка снизу"
 CHI_strike_from_below_desc:0 "Германия доказала, что страна, находящаяся под угрозой со стороны доминирующей в военно-морском отношении державы, может полагаться на сильный подводный флот для защиты своих интересов. Когда мы окажемся в подобной ситуации, мы будем искать уроки у Запада."
 CHI_fund_the_naval_air_establishment:0 "Финансирование военно-морского авиационного учреждения"
 CHI_fund_the_naval_air_establishment_desc:0 "Комбинированные преимущества военно-морского и воздушного превосходства слишком велики, чтобы их игнорировать. Расширение нашего военно-морского воздушного вооружения снижает риск межотраслевых сбоев в коммуникации."
 CHI_early_detections:0 "Раннее обнаружение"
 CHI_early_detections_desc:0 "Имея эффективный, но скромный флот, у нас нет другого выбора, кроме как оптимизировать наши обязательства по наилучшему использованию судов. Интеллект и осведомленность представляют собой лучшие методы, с помощью которых можно это сделать."
 CHI_defend_our_coasts:0 "Защищаем наши берега"
 CHI_defend_our_coasts_desc:0 "Наш враг не может напасть на нас, если они не могут добраться до нас. Минирование является наиболее эффективным средством защиты от вторжения. О расходах мы поговорим позже..."
 CHI_long_range:0 "Длинный диапазон"
 CHI_long_range_desc:0 "Хорошо взвешенная стрела может закончить войну до того, как она начнется. Более крупные и шумные двигатели могут поставить нашу команду под угрозу, но способность проецировать мощность еще больше увеличит наше влияние на мировой арене."
 CHI_battleship_focus:0 "Боевой корабль Focus"
 CHI_battleship_focus_desc:0 "Когда мы открываем строительство нашего первого великого гиганта морей, то только правильно и уместно праздновать великого Отца нашего народа."
 CHI_coastal_defence:0 "Береговая оборона"
 CHI_coastal_defence_desc:0 "Оптимизация использования пространства в нашем подповерхностном флоте означает меньшие, более быстрые подводные лодки. Нам пришлось убрать несколько несущественных вещей, таких как койки. или любые другие удобства."
 CHI_heavy_cruiser_focus:0 "Тяжелый крейсер Focus"
 CHI_heavy_cruiser_focus_desc:0 "Наш надводный флот, будучи реликвией Цин, хорошо служил нам почти 50 лет. В то время как мир меняется, было бы неразумно откладывать в сторону такую широту институциональных знаний, когда дело доходит до эксплуатации броненосных крейсеров малой дальности: наше будущее должно включать прошлое."
 CHI_mobile_bases:0 "Мобильные базы"
 CHI_mobile_bases_desc:0 "Как показывает остальной мир, воздух представляет будущее войны. Однако наша способность наносить удары на расстоянии ограничена нашей географией. Следуя примеру великих держав, мы должны сосредоточить наши усилия на мобильных ударных платформах."
 CHI_the_seas_of_tomorrow:0 "Моря завтрашнего дня"
 CHI_the_seas_of_tomorrow_desc:0 "Мы мечтаем о будущем, в котором Китай будет лидировать в мире по мягкой силе и технологическому мастерству. Мы потратили годы на то, чтобы догнать огромные флоты колониальных держав и наших региональных соперников, но теперь пришло время самим наметить курс будущего."
 CHI_the_seas_of_tomorrow_tt:0 "А. §Yученый§! Специализироваться на том, что было выбрано ранее, можно будет."
 CHI_long_range_screens:0 "Длинный диапазон экранов"
 CHI_long_range_screens_desc:0 "По мере того, как мы усиливаем наши усилия по выходу за рамки внутренних конфликтов, способность развертывать значительные силы на больших расстояниях и с низкими затратами становится жизненно важной."
 CHI_promote_the_national_currency:0 "Поощрять национальную валюту"
 CHI_promote_the_national_currency_desc:0 "Наша недавняя замена серебряного стандарта введением новой национальной валюты показала первоначальные хорошие результаты в снижении нашей зависимости от глобальных событий. Тем не менее, использование новой валюты наиболее распространено в крупных городах, и мы должны предпринять согласованные усилия для обеспечения ее принятия в сельских районах."
 CHI_institute_a_national_registry_of_property:0 "Институт Национального реестра собственности"
 CHI_institute_a_national_registry_of_property_desc:0 "Бюрократия является основой государства, и бюрократия не может эффективно функционировать, если нет точной информации. Именно в этой неэффективности недобросовестные агенты могут эксплуатировать систему и обогащаться в ущерб остальной части нашей нации."
 CHI_the_three_year_plan:0 "Трёхлетний план"
 CHI_the_three_year_plan_desc:0 "Наши усилия были очень не сфокусированы, и нашей стране не хватало руководства. Благодаря запланированным усилиям в ближайшие годы мы сосредоточим нашу энергию на одной великой цели. Надеюсь, ничто не остановит его."
 CHI_the_three_year_plan_tt:0 "§RОни будут удалены после вступления в войну.§!"
 CHI_extend_compulsory_education:0 "Расширение обязательного образования"
 CHI_extend_compulsory_education_desc:0 "Грамотное население является основой национального развития, но, к сожалению, наши усилия в области образования носили поверхностный характер и были слишком сосредоточены на городских районах. Это привело к тому, что население в сельской местности оказалось незамеченным, и оно готово к тому, чтобы кто-то другой наполнил шкуру государства."
 CHI_extend_compulsory_education_tt:0 "Каждый §Y[?CHI_improving_neglected_countryside_mission_time]§! дни, §Y$CHI_neglected_countryside$§! будет §GУлучшить§! Пока не исчезнут отрицательные модификаторы."
 CHI_initiate_the_gung_ho_movement:0 "Инициировать движение Гун Хо"
 CHI_initiate_the_gung_ho_movement_desc:0 "С нынешним кризисом мы поняли, как не хватает нашей ситуации, как в материальном, так и в производственном плане. Чего нам не хватает, так это людей, которых можно заставить работать, только если они организованы должным образом. Нам была представлена идея создания небольших промышленных кооперативов, которые мы можем разбросать по всей стране."
 CHI_expand_the_bureaucracy:0 "Расширение бюрократии"
 CHI_expand_the_bureaucracy_desc:0 "Наша страна огромна, и управление ею требует больших усилий и людей. С нашей расширенной образовательной базой мы теперь можем больше работать в государственном аппарате и усиливать наш контроль над более отдаленными частями страны."
 CHI_send_the_urban_students_to_the_countryside:0 "Отправьте студентов в сельскую местность"
 CHI_send_the_urban_students_to_the_countryside_desc:0 "Несмотря на то, что наши усилия в области образования принесли свои плоды, между городами и сельской местностью по-прежнему существует большое несоответствие. Пришло время более прямо подойти и использовать знания наших студентов высших учебных заведений в сельских школах."
 CHI_find_foreign_financiers:0 "Найти иностранных финансистов"
 CHI_find_foreign_financiers_desc:0 "Хотя потенциал нашей экономики бесконечен, нынешнее состояние означает, что наращивание потребует времени, если мы хотим сделать это сами. Быстрый способ перезарядить нашу экономику — это привлечь в страну внешний капитал через совместные предприятия. Мы должны искать за границей людей, способных увидеть возможности китайской нации."
 CHI_find_foreign_financiers_tt:0 "Прибыль: §Y+1500 $CIC_BANK_HEADER$§! Для всех основных (за исключением Японии) §G70§! мнение [ROOT.GetName].\n\n"
 CHI_naval_separate_defense_plan:0 "Отдельный план обороны ВМС"
 CHI_naval_separate_defense_plan_desc:0 "Чэнь Шаокуань предложил так называемый «План отдельной обороны военно-морского флота», который направлен на строительство по меньшей мере двенадцати авианосцев в течение следующих 30 лет. Если мы хотим обезопасить наши моря, мы должны взять его на себя эту идею и начать производство флота авианосцев с максимальной поспешностью!"
 CHI_fund_the_plan_domestically:0 "Финансирование плана внутри страны"
 CHI_fund_the_plan_domestically_desc:0 "Если и есть чему поучиться у прошлого века, так это тому, что существует опасность доверия иностранному капиталу. Если мы хотим развивать промышленность нашей страны, то полагаться на иностранцев, а не на местные банки и инвесторов было бы серьезной ошибкой и опасной перспективой. Мы должны найти внутренние источники финансирования, чтобы не рисковать зависимостью."
 CHI_finance_cooperatives:0 "Финансовые кооперативы"
 CHI_finance_cooperatives_desc:0 "Кооперативы полны жизненной силы и изобретательности, но не имеют доступа к кредитам. Хотя у нас и не было бы огромных средств, потребности кооперативов настолько малы, что мы могли бы сами их финансировать и сделать следующий шаг."
 CHI_introduce_income_tax:0 "Ввести подоходный налог"
 CHI_introduce_income_tax_desc:0 "То, как мы финансируем государство, архаично и не подходит для современного мира. Несмотря на то, что за последние полвека мы несколько раз предпринимали усилия по введению подоходного налога, на этот раз у нас есть сильное правительство."
 CHI_redistribute_land:0 "Перераспределяйте землю"
 CHI_redistribute_land_desc:0 "В значительной степени фермеры нашей страны работают под землевладельцами, которые добывают стоимость для личной выгоды. Этого не может быть, так как снижает производительность нашей страны и отстает от нее."
 CHI_expand_academica_sinica:0 "Расширение Академии Синика"
 CHI_expand_academica_sinica_desc:0 "Поскольку большая часть нашего населения начинает получать удовлетворительное образование, пришло время обратиться к нашему высшему образованию. Для расширения возможностей мы будем развивать уже существующие институты в Академии Синика, нашем самом доминирующем научном учреждении."
 CHI_expand_the_chinese_academy_of_sciences:0 "Создание Китайской академии наук"
 CHI_expand_the_chinese_academy_of_sciences_desc:0 "Академия Синика начала новую инициативу. Это сплотит самые яркие умы нашей страны в новой национальной академии естественных наук, науки и техники."
 CHI_expand_national_sun_yat_sen_university:0 "Национальный университет Sun Yat-sen"
 CHI_expand_national_sun_yat_sen_university_desc:0 "Теперь, когда экономика способна финансово поддерживать высшее образование для нашего населения, пришло время китайскому народу много учиться, точно спрашивать, тщательно размышлять, четко различать и добросовестно практиковать. Только благодаря этим принципам, провозглашенным доктором Сунь Ятсеном, наша страна сможет стать ведущей фигурой в области исследований и разработок."
 CHI_expand_academica_sinica_tt:0 "§Y$CHI_neglected_countryside$§!$research_speed_factor_tt$это [?CHI_neglected_countryside_academia_sinica_trigger|R%] или выше"
 CHI_expand_the_cooperatives:0 "Расширяем кооперативы"
 CHI_expand_the_cooperatives_desc:0 "Кооперативы впечатлили нас своей эффективностью, но они все еще малы по масштабу и охвату. Если бы мы предоставили им нашу сеть связей, они могли бы расти и размножаться еще больше."
 CHI_administer_cooperatives:0 "Административные кооперативы"
 CHI_administer_cooperatives_desc:0 "Характер кооперативов означает, что они быстро растут и распространяются, но часто работают в изоляции. Национальное отделение будет координировать и поддерживать сети сотрудничества на всех уровнях. [ROOT.GetName]."
 CHI_monopolise_resource_extraction:0 "Монополизация добычи ресурсов"
 CHI_monopolise_resource_extraction_desc:0 "В других странах мы наблюдали силу центральной организации планирования экономики. Особенно акт обеспечения того, чтобы поток ресурсов не остановился и не стал объектом эксплуатации со стороны частных интересов, должен лежать в руках технократов или, в нашем случае, Национальной комиссии по ресурсам."
 CHI_invite_foreign_experts:0 "Пригласить иностранных специалистов"
 CHI_invite_foreign_experts_desc:0 "Прошлый век показал, что наши технические знания отстают от западных. Несмотря на то, что это было в ущерб нам, мы теперь можем воспользоваться их знаниями и развивать нашу экономику быстрее, чем когда-либо."
 CHI_print_money_for_the_army:0 "Печать денег для армии"
 CHI_print_money_for_the_army_desc:0 "Армия никогда не бывает бесплатной, и если вы хотите иметь большую армию, вам придется заплатить за это высокую цену. Однако существуют различные способы оплаты, и мы можем поручить нашим людям печатать дополнительные деньги специально для этой цели."
 CHI_maintain_adequate_currency_reserves:0 "Сохранение достаточных валютных резервов"
 CHI_maintain_adequate_currency_reserves_desc:0 "Безрассудные траты рискуют разрушить систему, как это было показано снова и снова. Если мы хотим добиться успеха в контролируемом росте, нам нужно будет сдерживать себя и поддерживать надлежащие валютные резервы."
 CHI_maintain_adequate_currency_reserves_tt:0 "Каждый §Y[?CHI_improving_inefficient_economy_mission_time]§! дни, §Y$CHI_inefficient_economy$§! Улучшится до тех пор, пока не исчезнут отрицательные модификаторы."
 CHI_develop_the_chemical_industry:0 "Развивать химическую промышленность"
 CHI_develop_the_chemical_industry_desc:0 "Одним из величайших достижений современной цивилизации является ее покорение природы средствами химии. От сельского хозяйства до обрабатывающей промышленности химическая промышленность может расширить возможности общества, но, к сожалению, наша только зарождается. Если бы мы развивали эти отрасли, то не было бы ясно, чего мы могли бы достичь."
 CHI_grow_the_coal_industry:0 "Вырастим угольную промышленность"
 CHI_grow_the_coal_industry_desc:0 "Уголь питает наши заводы, поезда и печи. Для того, чтобы сохранить власть в стране и при этом наращивать нашу экономическую мощь, нам необходимо найти новые источники энергии. Национальная комиссия по ресурсам определила несколько источников, которые мы должны использовать."
 CHI_grow_the_coal_industry_tt1:0 "Получить дополнительный §Yуголь§! в наших основных государствах и в союзных государствах-повелителях"
 CHI_grow_the_coal_industry_tt2:0 "Разблокировать искомые решения для §Yуголь§! в наших и союзных государствах-повелителях"
 CHI_tungsten_and_antimony_extraction:0 "Вольфрам и извлечение сурьмы"
 CHI_tungsten_and_antimony_extraction_desc:0 "Стратегические металлы одерживают стратегические победы, и у нас есть обширные месторождения, которые могут быть использованы, если мы сможем вывести руды из-под земли."
 CHI_central_steel_and_machine_works:0 "Центральные металлургические и машинные работы"
 CHI_central_steel_and_machine_works_desc:0 "Сталь является основой для нашей промышленности, и до сих пор нам не хватало надлежащего производства. Несмотря на имеющиеся у нас ресурсы, нам просто нужно завести план от Национальной комиссии по ресурсам."
 CHI_empower_those_that_have_lost:0 "Помогите тем, кто потерял"
 CHI_empower_those_that_have_lost_desc:0 "В нашей стране есть много людей, которые потеряли многое в этой войне, например, работу или дома. Эти люди могут не казаться вероятным источником силы, но если им дать такую возможность, они станут волной, которая вымоет захватчиков."
 CHI_found_a_modern_fertiliser_plant:0 "Найдено современное удобрение"
 CHI_found_a_modern_fertiliser_plant_desc:0 "Чтобы прокормить нацию, мы должны рационализировать наше сельское хозяйство, и первым шагом является местное производство удобрений. Для этого мы построим фабрику, но будем использовать ее и для других целей."
 CHI_import_fertilisers:0 "Импорт удобрений"
 CHI_import_fertilisers_desc:0 "Хотя отечественное производство действительно решает проблемы зависимости, подражание кому-то еще является лишь дополнительным шагом. Если бы мы создавали заказы на покупку из других мест, мы могли бы сосредоточиться на наших сильных сторонах."
 CHI_construct_the_banqiao_dam:0 "Строительство плотины Banqiao"
 CHI_construct_the_banqiao_dam_desc:0 "Наши могучие реки — это то, что определяет наши земли, и контроль над ними был основой нашей цивилизации. В будущем эти реки будут способствовать росту и величию нашей нации."
 PHI_commonwealth_of_the_philippines:0 "Содружество Филиппин"
 PHI_commonwealth_of_the_philippines_desc:0 "Содружество Филиппин, созданное всего год назад, является первым шагом на пути к независимости Филиппин, обещанной США в качестве переходного периода сроком на 10 лет. Еще многое предстоит сделать, и еще много решений, которые необходимо принять, чтобы наша нарождающаяся нация могла нормально функционировать."
 PHI_align_with_the_usa:0 "Связь с США"
 PHI_align_with_the_usa_desc:0 "Соединенные Штаты Америки оказались доброжелательным и богатым повелителем. Сближая наши страны, они могут многое сделать для нас, чтобы ускорить наше развитие и обеспечить нашу защиту."
 PHI_usa_equipment:0 "§Y[PHI.GetName]§! будет использовать §Y[USA.GetName]§! Оборудование и военно-промышленные организации (МИО)."
 PHI_usa_equipment_non_aat:0 "§Y[PHI.GetName]§! будет использовать §Y[USA.GetName]§! Оборудование и конструкторы оборудования."
 PHI_align_with_japan:0 "Совместим с Японией"
 PHI_align_with_japan_desc:0 "Несмотря на их позерство, Соединенные Штаты Америки по-прежнему являются колониальным повелителем и могут в любой момент отказаться от своих обещаний нам. Поэтому было бы разумно завести новых друзей в международном государстве, и в настоящее время Япония является самым разумным выбором."
 PHI_jap_equipment:0 "§Y[PHI.GetName]§! будет использовать §Y[JAP.GetName]§! Оборудование и военно-промышленные организации (МИО)."
 PHI_jap_equipment_non_aat:0 "§Y[PHI.GetName]§! будет использовать §Y[JAP.GetName]§! Оборудование и конструкторы оборудования."
 PHI_quezon_city:0 "Кесон Сити"
 PHI_quezon_city_desc:0 "Манила хорошо послужила нам и столицей, однако она подавлена такими серьезными проблемами, как переполненность, отсутствие жилья, плохая санитария и заторы. Нам нужен город, спланированный с самого начала, чтобы служить нашей столицей, и хотя на его строительство и развитие потребуются годы, если не десятилетия, мы должны начать сейчас и пожинать плоды нашего предвидения позже!"
 PHI_peg_the_peso_to_the_dollar:0 "Пег песо к доллару"
 PHI_peg_the_peso_to_the_dollar_desc:0 "Наша валюта должна быть привязана к доллару США в качестве определения ее стоимости, это дает нашей валюте реальную основу в стоимости и обеспечивает надежную основу для налаживания торговли."
 PHI_leverage_the_peso:0 "Пользуйтесь Песо"
 PHI_leverage_the_peso_desc:0 "Наша валюта является нашей собственной, и мы должны работать, чтобы отличить ее от доллара США. Это позволит нам проводить корректирующую финансовую политику, максимально соответствующую дальнейшему развитию нашей экономики."
 PHI_agricultural_migrants_to_hawaii:0 "Сельскохозяйственные мигранты на Гавайи"
 PHI_agricultural_migrants_to_hawaii_desc:0 "Ряд филиппинских рабочих нашли удачу, работая на американских фермеров на Гавайях, мы должны поощрять эту эмиграцию, чтобы они могли продолжать отправлять деньги своим семьям дома и таким образом развивать нашу экономику."
 PHI_unicameral_legislature:0 "Однопалатное законодательство"
 PHI_unicameral_legislature_desc:0 "Одним из важнейших шагов в становлении нашего независимого государства является организация этого независимого правительства. Строить что-то из ничего очень сложно, поэтому мы должны создать одну палату в Конгрессе Филиппин."
 PHI_national_fiscal_policy:0 "Национальная фискальная политика"
 PHI_national_fiscal_policy_desc:0 "Поскольку наша страна твердо стоит на пути к независимости, одна из первых вещей, которую мы должны сделать, это отключить наши финансы от финансов Соединенных Штатов, разработать наш бюджет и средства для сбора этих средств посредством налогообложения."
 PHI_encourage_foreign_investment:0 "Поощрять иностранные инвестиции"
 PHI_encourage_foreign_investment_desc:0 "Соединенные Штаты не единственная страна, которая заинтересована в получении доли на нашем рынке. У нас много сырья и процветающий сельскохозяйственный сектор. Мы должны четко дать понять, что наша страна открыта для инвестиций для тех, у кого есть средства и предвидение, чтобы извлечь выгоду из щедрости Филиппин."
 PHI_develop_japanese_trade_connections:0 "Развитие японских торговых связей"
 PHI_develop_japanese_trade_connections_desc:0 "Япония ясно дала понять, что они жаждут товаров и ресурсов, а Филиппины имеют щедрость на торговлю. Мы должны поощрять торговлю между нашими странами во имя нашей взаимной выгоды."
 PHI_encourage_japanese_investment:0 "Поощрение японских инвестиций"
 PHI_encourage_japanese_investment_desc:0 "В настоящее время Соединенные Штаты имеют ряд торговых преимуществ в нашей стране, мы должны спокойно развивать связи с Японией, чтобы японские инвестиции могли поступать в нашу страну и подрывать алчность американцев."
 PHI_quezon_city_campus:0 "Кампус города Кесон"
 PHI_quezon_city_campus_desc:0 "Точно так же, как мы планируем будущее нашей страны, планируем и строим город будущего, мы должны учитывать будущее наших филиппинских граждан и гарантировать, что образовательное превосходство дает пространство для процветания в этом молодом городе."
 PHI_reduce_unneccessary_expenditure:0 "Уменьшить ненужные расходы"
 PHI_reduce_unneccessary_expenditure_desc:0 "Теперь, когда у нас есть национальная налогово-бюджетная политика, мы должны обеспечить, чтобы книги были должным образом сбалансированы. Мы хотим добиться этого не за счет повышения налогов или преследования тех, кто их избегает, а скорее за счет обрезки ненужного жира. Ведь если мы уже не будем оказывать эти услуги, то кто будет по ним скучать?"
 PHI_subsidies:0 "Субсидии"
 PHI_subsidies_desc:0 "Это факт капитала, что деньги нужны, чтобы заработать деньги. Мы должны использовать наш бюджет для вливания наличных денег в сектора, где мы увидим быструю отдачу. Предоставление целевых субсидий промышленным предприятиям и расширение инфраструктуры, чтобы сделать богатыми, но труднодоступными ресурсы и население."
 PHI_basic_welfare:0 "Базовое благосостояние"
 PHI_basic_welfare_desc:0 "Мы несем ответственность перед нашими более уязвимыми людьми, и наша обязанность состоит в том, чтобы хотя бы некоторые из их проблем были устранены. У нас уже есть абсолютно необходимые вещи, такие как благотворительные учреждения, однако с ростом промышленности бедственное положение рабочих вышло на первый план. Мы создадим Национальный экономический совет, который будет диктовать трудовое законодательство и устанавливать минимальную заработную плату."
 PHI_encourage_asian_trade:0 "Поощрение азиатской торговли"
 PHI_encourage_asian_trade_desc:0 "Между азиатскими странами существуют значительные исторические морские связи, и, несмотря на все усилия колониальных держав по их сокращению, они остаются сильными. Мы должны укреплять эти связи и поощрять расширение торговли между нашими странами для взаимного роста и процветания для всех."
 PHI_pro_hacendados:0 "Про Хачендадос"
 PHI_pro_hacendados_desc:0 "Богатые, помещичьи элиты, унаследованные от испанской колониальной эпохи, остаются значительной силой влияния и богатства на Филиппинах. Мы должны ухаживать за этими старыми семьями и в обмен на сохранение статус-кво заслужить их покровительство."
 PHI_anti_hacendados:0 "Анти-Хачендадос"
 PHI_anti_hacendados_desc:0 "Богатые, помещичьи элиты, унаследованные от испанской колониальной эпохи, слишком долго угнетали своих арендаторов. Мы должны снести этот устаревший институт и вернуть землю тем, кто на ней работает. Только так мы сможем модернизировать нашу экономику и избавиться от этих пиявок."
 PHI_sugar_barons:0 "Сахарные бароны"
 PHI_sugar_barons_desc:0 "Сахар является основой всей филиппинской экономики. Без этого богатого ресурса процветание нашей страны исчезло бы в одночасье. Мы должны поощрять тех, кто выращивает и экспортирует эту важную культуру, тем самым зарабатывая нам больше сладких, сладких денег."
 PHI_sugar_barons_unlock_tt:0 "§YРазблокировать решения по акцизам на сахар§!"
 PHI_sugar_barons_tt:0 "§YОдин случайный генерал§! будет получать §G+2§! умение планировать"
 PHI_luzon_transport:0 "Luzon Transport"
 PHI_luzon_transport_desc:0 "Несмотря на то, что это самая развитая часть Филиппин, она также является самой густонаселенной и промышленной, и поэтому ее транспортные маршруты нуждаются в дальнейших инвестициях и расширении."
 PHI_expand_gold_mining:0 "Расширение золотодобычи"
 PHI_expand_gold_mining_desc:0 "Испания всегда была удивительно проницательна, когда дело доходило до поиска золотых и серебряных запасов, и они не были разочарованы на Филиппинах. Однако они были бы очень рассержены, обнаружив, что самые богатые золотые жилы только сейчас используются, и этот быстро развивающийся экспорт приносит рекордные доходы нашей стране."
 PHI_mindanao_transport:0 "Миндана Транспорт"
 PHI_mindanao_transport_desc:0 "Несмотря на то, что остров является вторым по величине в Филиппинском архипелаге, он никогда не достиг даже близкого уровня инвестиций. Мы должны исправить этот надзор!"
 PHI_land_reform:0 "Земельная реформа"
 PHI_land_reform_desc:0 "Богатые землевладельцы по-прежнему доминируют в сельскохозяйственном секторе Филиппин. Мы должны показать, что мы современная нация, а не феодальная. Государство будет осуществлять принудительные закупки этих огромных поместий и продавать посылки мелким владельцам и корпорациям для более эффективного выращивания и использования."
 PHI_japanese_advisors:0 "Японские советники"
 PHI_japanese_advisors_desc:0 "Япония достигла невозможного, перейдя от феодального общества к современному в абсолютно рекордное время. Несмотря на то, что это было некоторое время назад, они по-прежнему обладают большой промышленной и военной экспертизой, к которой мы могли бы подключиться благодаря нашим все более сердечным отношениям."
 PHI_san_miguel:0 "Сан-Мигель"
 PHI_san_miguel_desc:0 "Основанный испанской королевской хартией в 1890 году, пивоваренный завод Сан-Мигель с тех пор производит исключительное пиво в немецком стиле. Теперь, когда наше население становится все более процветающим, а мировой спрос растет, мы должны стремиться расширить этот известный институт напитков. Поздравляю с лучшим миром."
 PHI_textile_mills:0 "Текстильные мельницы"
 PHI_textile_mills_desc:0 "Сейчас мы находимся в разгаре крупного толчка в более индустриальную экономику, и основой этого является текстильная промышленность. Если мы сможем сами производить основы, то никогда больше не будем зависимы или уязвимы для иностранного влияния."
 PHI_encourage_gold_exports:0 "Поощрение экспорта золота"
 PHI_encourage_gold_exports_desc:0 "В настоящее время мы переживаем золотую лихорадку, и она не могла прийти в лучшее время. Наше внутреннее предложение стало полностью насыщенным, к счастью, мир жаждет золота. Мировое население, выходящее из Великой депрессии, голодно до более осязаемых икон собственного богатства, и нет ничего осязаемого, чем золотые слитки."
 PHI_mineral_prospecting:0 "Поиск полезных ископаемых"
 PHI_mineral_prospecting_desc:0 "Кто-то скажет, что нам исключительно повезло в разведке полезных ископаемых, так легко наткнувшись на большие залежи золота. Однако для экономики опасно быть настолько зависимой только от одного ресурса, что Испанская империя осознала это слишком поздно. Мы должны вкладывать больше ресурсов в открытие других полезных ископаемых. Кто знает, что еще может скрывать наша земля?"
 PHI_bill_of_rights:0 "Билль о правах"
 PHI_bill_of_rights_desc:0 "Если мы хотим, чтобы нас воспринимали всерьез как современное государство, мы должны закрепить права нашего народа на закон. Это может быть основано на том, что [USA.GetName], приписывая такие свободы, как свобода религии, слова, печати и собраний. Однако мы являемся нашей собственной нацией, и есть некоторые заметные различия, например, мы не считаем целесообразным обеспечивать право на ношение оружия в нашем обществе."
 PHI_nationality_act:0 "Закон о гражданстве"
 PHI_nationality_act_desc:0 "[USA.GetNameDefCap] Закон о гражданстве пересматривает существующие законы о гражданстве, в том числе касающиеся филиппинцев и их статуса в Соединенных Штатах. В законе уточняется, что филиппинцы признаются США. Граждане, а не США граждан, что позволяет им жить и работать в [USA.GetNameDef] Но без полного гражданства."
 PHI_open_borders:0 "Открытые границы"
 PHI_open_borders_desc:0 "Дайте мне ваши усталые, бедные, скученные массы, жаждущие дышать свободно. Несмотря на [USA.GetAdjective] Мы пытаемся ограничить иммиграцию, мы контролируем наши собственные границы. Мы должны стремиться к тому, чтобы стать убежищем для тех, кого преследует война или их раса, религия или любая другая причина."
 PHI_philippine_american_educational_foundation:0 "Филиппино-американский образовательный фонд"
 PHI_philippine_american_educational_foundation_desc:0 "Благодаря нашим тесным связям с [USA.GetNameDef]Мы создали различные академические связи. Мы должны создать организацию, ответственную за администрирование стипендиальных программ по обмену иностранной валюты, направленных на содействие двунациональным исследованиям, культурному взаимопониманию и открытому обмену идеями между нашими двумя странами."
 PHI_government_filipinization:0 "Государственная филипинизация"
 PHI_government_filipinization_desc:0 "В нашем правительстве на протяжении веков доминировали иностранные образования, сначала испанцы, а затем американцы. Настало время взять под контроль Филиппины, филиппинцы и филиппинцы!"
 PHI_improve_trait_tt:0 "Получит улучшенную характеристику советника"
 PHI_bicameral_legislature:0 "Двухпалатное законодательство"
 PHI_bicameral_legislature_desc:0 "Расширение нашего правительства продолжается. Мы уже создали нижнюю камеру и теперь пора устанавливать верхнюю. По этой модели мы можем лучше всего узаконить новые законы для нашей страны."
 PHI_uncouple_the_peso_and_dollar:0 "Разъединить песо и доллар"
 PHI_uncouple_the_peso_and_dollar_desc:0 "Привязка песо к доллару хорошо работала для нас, обеспечивая необходимый уровень стабильности нашей валюты. Однако с надвигающейся независимостью мы должны разъединить их, чтобы иметь больше контроля и гибкости в нашей денежной системе, внедряя такие инструменты, как количественное смягчение, где это необходимо."
 PHI_increase_sugar_exports:0 "Увеличение экспорта сахара"
 PHI_increase_sugar_exports_desc:0 "Сахар был основой нашей экономики на протяжении веков, и он помог нам пережить самую худшую из Великой депрессии, при этом экспорт остается здоровым. Подписывая выгодные торговые соглашения с другими странами, мы можем гарантировать, что мы лучше всего сможем извлечь выгоду из роста сахара в качестве основы для международной кухни. и газировку."
 PHI_break_chinese_monopoly:0 "Разрушить китайскую монополию"
 PHI_break_chinese_monopoly_desc:0 "Китайские купцы нашли свое место в нашем обществе как собственники магазинов и банков, однако при таком владении такими критическими услугами, которыми владеют иностранцы, для нашей собственной безопасности мы должны обеспечить более справедливое распределение распределительных сетей."
 PHI_encourage_chinese_immigration:0 "Поощрение китайской иммиграции"
 PHI_encourage_chinese_immigration_desc:0 "Китайские торговцы оказались исключительно предприимчивыми в создании малых предприятий и магазинов. Мы должны использовать этот приток талантов и денег и стимулировать дальнейший рост в этом секторе."
 PHI_japanese_observers:0 "Японские наблюдатели"
 PHI_japanese_observers_desc:0 "С приближением отношений между нами японцы согласились направить в нашу страну военный отряд. Это делается для того, чтобы они могли узнать из первых рук, как командные структуры европейского стиля функционируют в дружественной обстановке, в то время как мы можем извлечь уроки из их боевого опыта и тем самым передать эту мудрость вниз по служебной лестнице."
 PHI_one_observer_advisor_focus_tt:0 "Эффект при завершении одного из §Y$PHI_japanese_advisors$§! и §Y$PHI_japanese_observers$§!:"
 PHI_both_observer_advisor_focus_tt:0 "Эффект при выполнении обоих §Y$PHI_japanese_advisors$§! и §Y$PHI_japanese_observers$§!:"
 PHI_treaty_of_manila:0 "Манильский договор"
 PHI_treaty_of_manila_desc:0 "Долгая борьба за независимость подходит к концу. От революции против Испании до упорной войны против Соединенных Штатов и долгих лет Содружества Филиппины выдержали. С подписанием Манильского договора наша страна, наконец, становится свободной и суверенной нацией, ее независимость официально признана миром."
 PHI_manila_tag_tt:0 "§Y[PHI.GetName]§! будут известны как §YФилиппины§!"
 PHI_universal_sufferage:0 "Всеобщее избирательное право"
 PHI_universal_sufferage_desc:0 "После принятия конституции филиппинский народ получил плебисцит о том, следует ли разрешить всеобщее избирательное право в филиппинской нации. Результаты вернулись на 91% в пользу, и поэтому право голоса было должным образом расширено."
 PHI_modernization:0 "модернизация"
 PHI_modernization_desc:0 "Наши промышленные усилия слишком долго отставали от других азиатских стран. Теперь, когда у нас есть независимость, мы должны продемонстрировать наш потенциал миру и предоставить ресурсы и нормативное пространство для тех, кто хочет продвигаться вперед с механизацией нашей экономики."
 PHI_revision_of_taxation_laws:0 "Пересмотр налоговых законов"
 PHI_revision_of_taxation_laws_desc:0 "Теперь, когда мы отделились от Соединенных Штатов, нам нужно разработать наш собственный налоговый кодекс, тем самым увеличивая нашу налоговую базу и приводя к увеличению государственных доходов, которые затем могут быть реинвестированы в государственные услуги, такие как инфраструктура, благосостояние, военные и другие схемы роста."
 PHI_bill_of_rights_for_veterans:0 "Билль о правах ветеранов"
 PHI_bill_of_rights_for_veterans_desc:0 "Многие филиппинцы были вовлечены в войну, и мы должны позаботиться о тех, кто возвращается домой. Если мы будем заботиться о наших ветеранах, мы сможем обеспечить хороший приток дополнительных кадров в будущее, поскольку люди видят, что военные являются надежным выбором для карьеры."
 PHI_rehabilitation_finance_corporation:0 "Финансовая корпорация реабилитации"
 PHI_rehabilitation_finance_corporation_desc:0 "Наш народ остался со значительным ущербом, от разрушенных городов и разбомбленных дорог, разрушенных промышленных комплексов и саботируемых железных дорог. Потребуется время и деньги, чтобы перестроиться, но цена для нашей страны неперестроенности будет еще более драматичной."
 PHI_department_of_foreign_affairs:0 "Департамент иностранных дел"
 PHI_department_of_foreign_affairs_desc:0 "С нашими ногами, поставленными прямо на международную арену как независимое образование, мы теперь несем ответственность за наши собственные дипломатические действия. Мы должны создать департамент иностранных дел, чья работа заключается в том, чтобы управлять нашими дипломатическими связями и развертывать дипломатический персонал по всему миру."
 PHI_economic_nationalism:0 "Экономический национализм"
 PHI_economic_nationalism_desc:0 "Теперь, когда мы полностью контролируем наше будущее, пришло время взять под контроль и нашу экономику. В нашем распоряжении есть много инструментов, таких как тарифы, правила, товары и движение капитала. Мы должны использовать их все и тем самым продемонстрировать, насколько устойчива экономика Филиппин."
 PHI_bell_trade_act:0 "Торговый акт Bell"
 PHI_bell_trade_act_desc:0 "Этот закон, также известный как Закон о торговле Филиппин, регулирует торговлю между Филиппинами. [PHI.GetName] и тот [USA.GetName]. Сюда входит пакет финансовых инвестиций, льготные торговые и тарифные соглашения. Это также включает в себя значительный корпоративный доступ США к филиппинским ресурсам, что вызывает некоторые опасения, однако другие преимущества были определены как стоящие риска."
 PHI_pearl_of_the_orient_seas:0 "Жемчужина восточных морей"
 PHI_pearl_of_the_orient_seas_desc:0 "Романтизированное первыми Испанскими Исследователями, чтобы описать земли, которые они только что обнаружили, описание никогда не застревает и остается верным. Несмотря на все тропы и трагедии, которые обрушились на наши острова, мы остаемся местом великой красоты, сравнимым только с жемчугом, который мы здесь собираем."
 PHI_united_states_army_forces_in_the_far_east:0 "Армия США на Дальнем Востоке"
 PHI_united_states_army_forces_in_the_far_east_desc:0 "Филиппинский департамент долгое время был американским командованием на Филиппинах, однако с ростом напряженности настало время расширить это в более крупное формирование армии Соединенных Штатов. Для этого потребуется создание новых командных структур и переброска из США значительных американских кадров."
 PHI_send_a_share_of_THIS_navy_to_ROOT_tt:0 "Отправьте часть из [THIS.GetAdjective] ВМФ в сторону [ROOT.GetNameDef]."
 PHI_military_requisitions:0 "Военные реквизиции"
 PHI_military_requisitions_desc:0 "Для того, чтобы действительно способствовать быстрому расширению военной силы, нам необходимо реквизировать значительные запасы оружия и техники из складов снабжения в Соединенных Штатах. Это позволит нам сохранить солидные боевые силы, оснащенные абсолютной лучшей американской военной техникой."
 PHI_usaffe_headquarters:0 "Штаб-квартира USAFFE"
 PHI_usaffe_headquarters_desc:0 "Нашему новому дальневосточному командованию потребуется надлежащая штабная часть, оснащенная и укомплектованная главными офицерами штаба армии Соединенных Штатов. Есть ряд отставных командиров, которых можно было бы призвать, или будущих офицеров, нуждающихся в реальном опыте."
 PHI_permanent_usa_air_bases:0 "Учрежденный постоянный [USA.GetAdjective] Воздушные базы"
 PHI_permanent_usa_naval_bases:0 "Учрежденный постоянный [USA.GetAdjective] Военно-морские базы"
 PHI_permanent_usa_land_bases:0 "Учрежденный постоянный [USA.GetAdjective] Земельные базы"
 PHI_small_arms_and_artillery_requisition:0 "Оружие и артиллерийская реквизиция"
 PHI_small_arms_and_artillery_requisition_desc:0 "Хотя уже появились самые основы, для того, чтобы должным образом оснастить силы, которые мы здесь поднимаем, нам нужно реквизировать гораздо больше орудий всех калибров, больших и малых."
 PHI_filipino_repatriation_act:0 "Закон о репатриации Филиппин"
 PHI_filipino_repatriation_act_desc:0 "В соответствии с Законом Тайдингса-Макдаффе, который установил курс Филиппин на независимость, был добавлен пункт, который серьезно ограничил филиппинский въезд в Соединенные Штаты. Мы не хотим, чтобы семьи разделялись, поэтому мы предложим бесплатный односторонний проезд обратно на Филиппины."
 PHI_american_capital_injection:0 "Инъекция американского капитала"
 PHI_american_capital_injection_desc:0 "Америка славится своими инвестициями, так что давайте подключимся к этому капитальному ресурсу и ослабим его на филиппинской экономике. Кто знает, какие чудеса эти капиталистические предприниматели смогут творить без прямого государственного вмешательства."
 PHI_appoint_macarthur:0 "Назначить Макартура"
 PHI_appoint_macarthur_desc:0 "С 1935 года генерал Дуглас Макартур работает советником филиппинского правительства, однако пришло время применить его навыки и опыт в более официальном качестве и дать ему командование войсками США на Дальнем Востоке."
 PHI_united_states_asiatic_fleet:0 "Азиатский флот США"
 PHI_united_states_asiatic_fleet_desc:0 "Армия Соединенных Штатов не единственная военная организация, которая интересуется Дальним Востоком. Залив Манила является идеальной базой для размещения Азиатского флота США и идеальным центром для расширения своих возможностей."
 PHI_far_east_air_force:0 "Дальневосточные ВВС"
 PHI_far_east_air_force_desc:0 "Хотя Филиппины гораздо больше привыкли к сухопутным и военно-морским силам, ничто не мешает их расширению военно-воздушных сил. Дальневосточные военно-воздушные силы должны базироваться здесь, и наши аэродромы должны быть расширены, чтобы позволить большему количеству самолетов обеспечить ударные возможности гораздо ближе к домашней базе потенциальных угроз."
 PHI_bring_in_eisenhower:0 "Привезите Эйзенхауэра"
 PHI_bring_in_eisenhower_desc:0 "Как и Макартур, Дуайт Д. Эйзенхауэр работает советником филиппинского правительства с 1935 года, и Макартур теперь считает целесообразным официально привлечь этого многообещающего офицера в свой штат. Хотя были сообщения об антипатии между ними, возможно, их разные личности и стили руководства будут комплиментом, необходимым для обеспечения безопасности нации."
 PHI_police_chief_eisenhower:0 "Начальник полиции Эйзенхауэр"
 PHI_police_chief_eisenhower_desc:0 "С нашей новой запланированной столицей, Кесон Сити, [PHI.GetLeader] По его словам, для этого потребуется высококлассный начальник полиции. У президента были отличные рабочие отношения с Дуайтом Ди. Эйзенхауэр и считает, что при наличии правильных стимулов его можно убедить взять на себя роль, и тем самым навсегда связать его с филиппинским делом."
 PHI_eisenhower_stays_tt:0 "§YДуайт Ди. Эйзенхауэр§! Он останется на Филиппинах и не может быть отозван. [USA.GetNameDef]"
 PHI_mariveles_naval_base:0 "Военно-морская база Mariveles"
 PHI_mariveles_naval_base_desc:0 "В Маниле есть базовые военно-морские объекты, но у нее есть потенциал для гораздо большего. Первое, что мы должны сделать, это расширить военно-морскую базу Маривелс, расположенную на Батаанской стороне залива. Этот глубоководный порт может вмещать более значительные объекты для производства и обслуживания военно-морских активов."
 PHI_gunboat_diplomacy:0 "Оружейная лодка Дипломатия"
 PHI_gunboat_diplomacy_desc:0 "Мы — островное государство, и как таковое должны иметь военно-морские возможности, чтобы донести страх до сердец тех, кто противостоит нашим интересам, — а если они нас еще не боятся, то они это сделают, когда филиппинский флот появится в их главном порту и возьмет под свой контроль судоходство там."
 PHI_trucks_and_transport_requisition:0 "Грузовики и транспортная реквизиция"
 PHI_trucks_and_transport_requisition_desc:0 "Теперь, когда оружие поступает на Филиппины, пришло время обратиться к материально-техническому обеспечению фактического содержания армии в полевых условиях. Благодаря растущей автомобильной и железнодорожной промышленности Соединенных Штатов, не должно быть никаких проблем с реквизицией некоторых из них для нашего военного использования."
 PHI_investment_fund:0 "Инвестиционный фонд"
 PHI_investment_fund_desc:0 "Хотя индивидуальные инвестиции в нашу страну очень ценятся, чтобы действительно максимально использовать этот капитал, он должен поддерживаться в централизованном фонде, которым управляют те, кто действительно знает экономические реалии здесь, на Филиппинах, чтобы они могли правильно направить эти инвестиции туда, где их можно наилучшим образом использовать, для максимальной отдачи."
 PHI_subordinate_philippine_department:0 "Подчиненный Филиппинский департамент"
 PHI_subordinate_philippine_department_desc:0 "Филиппинский департамент был военным присутствием Соединенных Штатов на Филиппинах до создания USAFFE. Хотя его командные структуры устарели, они должны быть обновлены и модернизированы, чтобы местные филиппинские войска легче поддавались американскому командованию и контролю."
 PHI_expand_us_bases:0 "Расширение баз США"
 PHI_expand_us_bases_desc:0 "В современной войне преобладают самолеты, и это особенно верно для нашей ситуации на Филиппинах. Безусловно, самый простой способ обеспечить безопасность островов — это господство в воздухе, и еще лучше это позволяет нам патрулировать окружающий океан. Для того чтобы лучше подготовиться к этим воздушным операциям, нам необходимо значительно расширить наши авиабазы."
 PHI_war_plan_rainbow_five:0 "План войны «Рэйнбоу-5»"
 PHI_war_plan_rainbow_five_desc:0 "Теперь, когда наша собственная безопасность надлежащим образом продумана, мы можем начать обращать внимание на более широкую войну и лучше определить наше подходящее место в ней. Нам есть что предложить военным усилиям, и мы должны обеспечить, чтобы мы инвестировали туда, где это наиболее необходимо."
 PHI_aircraft_requisition:0 "Реквизиция самолетов"
 PHI_aircraft_requisition_desc:0 "Мы не смогли развить значительную авиационную промышленность, поэтому полностью зависели от американских самолетов. Наша потребность возросла, поэтому мы должны закупать больше самолетов у наших американских спонсоров."
 PHI_luce_celler_act:0 "Закон Люси-Келлера"
 PHI_luce_celler_act_desc:0 "Закон Люса-Келлера является иммиграционным актом в Соединенных Штатах, который увеличил квоту разрешенных филиппинских путешественников и впервые позволил натурализацию филиппинцев как американских граждан. Это знаменует собой начало новой эры межтихоокеанской миграции."
 PHI_utang_na_loob:0 "Утанг на Луб"
 PHI_utang_na_loob_desc:0 "Утанг-на-лооб — это филиппинская культурная ценность, которая переводится как «долг благодарности» или «долг внутреннего я». Это означает глубокую эмоциональную и моральную обязанность погасить долг того, кто оказал значительную помощь, особенно в периоды необходимости. Это чувство взаимности, как правило, выражается в актах служения, поддержки или лояльности."
 PHI_utang_na_loob_last_stand_tt:0 "§G-25%§! стоимость и §G+5%§! Защита для §YПоследняя позиция§!\n"
 PHI_declare_military_emergency:0 "Объявить чрезвычайное положение"
 PHI_declare_military_emergency_desc:0 "Страна находилась на скользком пути к фашизму, но решительные действия предотвратили окончательное падение. Теперь ясно, что угрозы есть везде, и мы должны их сорвать. Ничто не выходит за рамки, ничто не является незаконным. Демократия должна выжить."
 PHI_military_emergency_flag:0 "Объявлено чрезвычайное положение"
 PHI_usa_catchup_tt:0 "Это считается завершением одного из американских экономических фокусов для целей реквизиций."
 PHI_weapons_of_war:0 "Оружие войны"
 PHI_weapons_of_war_desc:0 "Для того чтобы наилучшим образом сохранить наши демократические идеалы, мы должны обеспечить, чтобы у нас было самое лучшее и самое опасное оружие. Мы слышали слухи о каком-то Манхэттенском проекте. Просто так получилось, что над проектом работает филиппинка, и как хороший, лояльный человек она готова помочь нам с нашим собственным проектом."
 PHI_preemptive_strikes:0 "Упреждающие удары"
 PHI_preemptive_strikes_desc:0 "Враги есть везде, и мы окружены. Поэтому мы должны готовиться к неизбежному. А еще лучше, мы должны подготовиться к нанесению удара первыми, чтобы неизбежное уже не было неизбежным, а было обойдено. В конце концов, единственный способ, которым мы будем в безопасности, это если на нас не останется никого."
 PHI_sunset_empires:0 "Империя Заката"
 PHI_sunset_empires_desc:0 "Самая большая угроза для нас — Империя Восходящего Солнца и Империя, на которой Солнце никогда не заходит. Поэтому мы должны убедиться, что у нас достаточно пуль, с которыми мы можем бороться в тени."
 PHI_land_of_the_setting_sun:0 "Земля заходящего солнца"
 PHI_land_of_the_setting_sun_desc:0 "Мы подготовились. Настало время забастовки! Пришло время, чтобы солнце садилось в последний раз на [JAP.GetNameDef]Никогда больше не подниматься."
 PHI_sea_of_cobalt:0 "Море Кобальта"
 PHI_sea_of_cobalt_desc:0 "Дайте мне достаточно ядерного оружия, и я создам море кобальта, через которое ни один враг не сможет пробраться к нам."
 PHI_the_sun_has_set:0 "Солнце садится"
 PHI_the_sun_has_set_desc:0 "Англичане уже давно представляют угрозу для Объединенной Ста — Филиппин. Мы разбили их в 1779 году, и они никогда не простили нас за это. Пришло время напомнить им об их месте в мире."
 PHI_traitors_back_home:0 "Предатели возвращаются домой"
 PHI_traitors_back_home_desc:0 "[USA.GetNameDef] Он стал слабым и страшным. Никто там не хочет делать то, что должно быть сделано, поэтому мы должны очистить ряды политиков и трусов и вернуть Сияющий город на холме для американского народа."
 PHI_end_colonialism:0 "Конец колониализма"
 PHI_end_colonialism_desc:0 "Колониализм — это бедствие, которому слишком долго позволяли гноиться. Все люди заслуживают права жить в условиях свободы и демократии, и мы должны будем навязать это силой."
 PHI_cobalt_supremacy:0 "Преобладание кобальта"
 PHI_cobalt_supremacy_desc:0 "Я стал смертью, разрушителем миров."
 PHI_subject_surrender:0 "Тема: Сдаться"
 PHI_subject_surrender_desc:0 "Стало очевидно, что гарнизон этих сил будет в конечном итоге уничтожен воздушным и артиллерийским обстрелом, а пехота при поддержке танков одолела нас. [PHI.GetNameDef]."
 PHI_subject_surrender_tt:0 "§RПотеря контроля над всем государством [327.GetName] Мы завершим этот фокус.§!"
 PHI_i_shall_return:0 "Я вернусь"
 PHI_i_shall_return_desc:0 "Это была фраза, произнесенная генералом Дугласом Макартуром, когда он эвакуировался. [PHI.GetNameDef]И с тех пор он часто повторяется. Пришло время предоставить инструменты и оборудование, чтобы это стало реальностью."
 PHI_soldiers_in_hiding:0 "Солдаты прячутся"
 PHI_soldiers_in_hiding_desc:0 "Хотя формально мы проиграли бой в [PHI.GetNameDef]Война еще не закончилась. Большое количество наших войск не подчинилось приказу сдаться и продолжало борьбу, скрываясь. Мы знаем ряд выдающихся офицеров, которые приняли вызов и начали расширять отряды сопротивления вокруг них, и мы должны предоставить все, что можем для их успеха."
 PHI_if_any_state_occupied_tt:0 "Каждое занятое основное состояние (в настоящее время: 0):"
 PHI_hukbalahap:0 "Хукбалахап"
 PHI_hukbalahap_desc:0 "Hukbo ng Bayan Laban sa Hapon (Народная армия против японцев), или сокращенно Hukbalahap, является коммунистическим партизанским движением, сформированным фермерами Центрального Лусона, которые оказались одними из самых способных бойцов сопротивления во всем мире. [PHI.GetNameDef]. Они исключительно хорошо организованы и мотивированы, но у них нет оружия. Мы должны их достать."
 PHI_if_communist_tt:0 "Если §Y$PHI_partido_komunista_ng_pilipinas_coup$§! Завершено:"
 PHI_local_resistance:0 "Местное сопротивление"
 PHI_local_resistance_desc:0 "Оккупанты мало чем подружились со своей политикой, и существует значительное недовольство, к которому мы могли бы подключиться. Каждый может внести свою лепту, фермеры прячут припасы от вражеских солдат, рыбаки перевозят повстанцев, солдаты обучают других боевым приемам, а торговцы предоставляют оборудование и деньги, все в помощь сопротивлению."
 PHI_if_chinese_immigration_tt:0 "Если §Y$PHI_encourage_chinese_immigration$§! Завершено:"
 PHI_submarine_supplies:0 "Поставки подводных лодок"
 PHI_submarine_supplies_desc:0 "Существует обширное военно-морское присутствие противника, что затрудняет получение поддержки из-за рубежа. Мы можем реквизировать некоторые подводные лодки, чтобы обеспечить тайную поддержку, на нашем архипелаге есть много укрытий, и многие желающие рыбаки могут транспортировать грузы на любые острова, которые им нужны."
 PHI_the_hunters:0 "Охотники"
 PHI_the_hunters_desc:0 "Кадеты из Филиппинской военной академии скрылись, когда оккупанты закрыли учреждение. С тех пор они начали формировать «Охотников» и хорошо использовали свои навыки, обучая местных жителей боевым приемам и сбору разведданных, чтобы активно вести борьбу с нашими врагами вокруг Манилы."
 PHI_will_gain_hunters:0 "3 бригады охотников получат ROTC по завершении строительства §Y$PHI_grassroot_guerillas$§!."
 PHI_the_cry:0 "Плач"
 PHI_the_cry_desc:0 "Плач Пугад Лоуэна был призывом к началу филиппинской революции против Испанской империи. Это еще одна война за нашу свободу, даже само наше существование, поэтому пришло время снова поднять наш крик и бороться!"
 PHI_will_gain_hukbalahap:0 "3 бригады «Хукбалахап» получат по завершении строительства §Y$PHI_grassroot_guerillas$§!."
 PHI_juramentado:0 "Юраментадо"
 PHI_juramentado_desc:0 "Юраментадо были воинами Моро и Сулу, которые поклялись сражаться насмерть против захватчиков. Хотя старые ритуалы исчезли, дух бесстрашного жертвоприношения остается. Приняв эту традицию, мы можем вдохновить наших бойцов сопротивления на опустошительные атаки, которые ужасают оккупантов и придают смелости нашему собственному народу."
 PHI_will_gain_juramentado:0 "3 бригады \"Юраментадо\" получат по завершении строительства §Y$PHI_grassroot_guerillas$§!."
 PHI_exile_support:0 "Поддержка изгнания"
 PHI_exile_support_desc:0 "В других странах проживает много филиппинцев, и мы можем обратиться к ним за финансовой и материальной поддержкой. Затем это может быть переправлено контрабандой нашим храбрым бойцам сопротивления или использовано для формирования филиппинских боевых подразделений, которые будут использоваться в нашем возможном освобождении."
 PHI_grassroot_guerillas:0 "Грассрутские партизаны"
 PHI_grassroot_guerillas_desc:0 "Существует множество организаций сопротивления, действующих на местах по всей нашей стране, однако им не хватает централизованного командования и контроля, чтобы направить все свои усилия в более скоординированные усилия по вытеснению оккупантов. Боевой дух существует, его просто нужно правильно использовать и направлять на наиболее уязвимые цели."
 PHI_grassroot_guerillas_tt:0 "По 3 бригады партизанских войск на каждую завершенную предпосылку сосредоточения. Освобожденные государства, а затем государства с небольшим количеством вражеских войск будут приоритетными в качестве места дислокации."
 PHI_reconquista:0 "Реконкиста"
 PHI_reconquista_desc:0 "От гор Лусона до джунглей Минданао наш народ истекал кровью и страдал под оккупацией. Пришло время вернуть нашу землю, город за городом, остров за островом. Подобно тому, как наши предки сопротивлялись конкистадорам, теперь мы боремся за изгнание захватчиков и восстановление нашей нации. Это наша Реконкиста — последняя битва за Филиппины."
 PHI_rebuild_sakdalistas:0 "Восстановление Sakdalistas"
 PHI_rebuild_sakdalistas_desc:0 "В ночь на 2 мая 1935 года 65 000 частично вооруженных крестьян разрушили мир на Филиппинах в попытке захватить власть у правительства, поддерживаемого США. Эти усилия не увенчались успехом, но гнев на растущее неравенство между богатыми городами и бедными сельскими жителями продолжает кипеть под поверхностью, ожидая, чтобы его использовали."
 PHI_slippery_slope:0 "Скользкая слопа"
 PHI_slippery_slope_desc:0 "Растущее японское влияние на нашу страну начало снимать недовольство. Все, что нам нужно сделать, это отойти в сторону и наблюдать, как гнев против жадности, присущей коррумпированной демократической капиталистической системе, разрушается, оставляя после себя вакуум, который более радикальные идеологии более чем рады помочь заполнить."
 PHI_assassination_of_quezon:0 "Убийство Кезон"
 PHI_assassination_of_quezon_desc:0 "К сожалению, президент Кесон слишком долго сдерживал Филиппины. Американский пёс сделал все возможное, чтобы не реализовать национальную волю филиппинского народа. Институты, которые он построил вокруг себя, сделали его невосприимчивым к демократическим переменам, поэтому теперь мы должны продвигать политику другими средствами."
 PHI_assassination_of_quezon_tt:0 "§RПланируется, что Кесон будет стремиться к отстранению от должности. Постоянно.§!"
 PHI_eisenhower_steps_in_flag:0 "Эйзенхауэр вмешался"
 PHI_makapili:0 "Макапили"
 PHI_makapili_desc:0 "Рост фашизма в филиппинской нации был быстрым, и это, к сожалению, сопровождалось определенным количеством хаоса. Наши зарубежные друзья предложили оружие и подготовку для создания «Армии мира» для поддержания порядка, борьбы с бандитизмом и подавления мятежа."
 PHI_sakdalista_exiles_returned_flag:0 "Изгнанники Сакдалисты вернулись (Событие)"
 PHI_form_the_executive_commision:0 "Формирование Исполнительной комиссии"
 PHI_form_the_executive_commision_desc:0 "Теневая клика лидеров дергает за ниточки на заднем плане, но теперь, когда фашистский идеал пришел к власти на Филиппинах, пришло время для этих людей выйти на свет и занять свое законное место во главе правительства."
 PHI_aguinaldos_coup:0 "Борьба за лидерство"
 PHI_aguinaldos_coup_desc:0 "С немедленным хаосом правительственного переворота, начинающего улаживаться, личности в Исполнительной комиссии соперничают за контроль. Авторитарные режимы требуют особой власти, чтобы управлять ими, и поддержка сливается."
 PHI_resolve_interregnum_tt:0 "§GЭто позволит урегулировать межрегнум, а также назначить нового лидера.§!"
 PHI_secure_japanese_guarantees:0 "Безопасные японские гарантии"
 PHI_secure_japanese_guarantees_desc:0 "Если мы хотим действительно ускорить нашу независимость от Соединенных Штатов, то нам нужно подготовиться к очень реальной перспективе войны, потому что они вряд ли позволят своему приспешнику уйти легкомысленно. Мы должны обратиться к нашим спонсорам в Японии и обеспечить более официальную военную поддержку в случае военных действий."
 PHI_war_of_independence:0 "Война за независимость"
 PHI_war_of_independence_desc:0 "Дай мне свободу или дай мне смерть! Пришло время колониальным угнетателям навсегда покинуть наши берега.\n\nНад Филиппинами встает новое солнце."
 PHI_will_take_peace_decision:0 "§Y[USA.GetName]§! Это решение будет принято, если §Y[ROOT.GetNameDef]§! Он успешно защищает себя в течение года или раньше, если теряет свои близлежащие островные базы или ввязывается в войну в другом месте."
 PHI_second_philippine_republic:0 "Вторая Филиппинская Республика"
 PHI_second_philippine_republic_desc:0 "Хотя это еще не достигнуто, наше стремление к независимости становится все ближе. Следующим шагом является создание новой республики, чтобы официально способствовать нашему отделению, и оттуда начать работу над атрибутами нашего нового правительства - и новым флагом, конечно."
 PHI_second_republic_tag_tt:0 "§Y[PHI.GetName]§! будут известны как §YВторая филиппинская республика§!"
 PHI_election_overturned:0 "Выборы отменены"
 PHI_election_overturned_desc:0 "Выборы 1935 года были в подавляющем большинстве в пользу Мануэля Кесона. Эмилио Агинальдо выразил серьезную обеспокоенность и поднял ее вместе с Соединенными Штатами, которые пообещали провести тщательное расследование возможных манипуляций на выборах."
 PHI_hispanidad_filipina:0 "Испанида филиппинская"
 PHI_hispanidad_filipina_desc:0 "Несмотря на пропасть, созданную войной за независимость против Испанской империи 1896-1898 годов, многие филиппинцы по-прежнему считают себя частью испаноязычной диаспоры, и продолжающаяся напряженность в испанском материке стала предметом некоторой обеспокоенности."
 PHI_spanish_refugees:0 "Испанские беженцы"
 PHI_spanish_refugees_desc:0 "После разрушительной гражданской войны многие испанские граждане нашли убежище в других местах. С потеплением отношений между нами и нашими испанскими коллегами значительное число их людей искали убежища на нашем архипелаге."
 PHI_if_supported_scw_side_lost_tt:0 "Если §YГражданская война в Испании§! Мы отправили добровольцев, чтобы они потерпели поражение:"
 PHI_if_supported_scw_side_wins_tt:0 "Если сторона в §YГражданская война в Испании§! Победа после получения от нас добровольцев. §Y$PHI_reconciliation_with_spain$§! Вместо этого они будут иметь лучшие эффекты."
 PHI_reconciliation_with_spain:0 "Примирение с Испанией"
 PHI_reconciliation_with_spain_desc:0 "[ReconciliationWithSpain]"
 PHI_reconciliation_with_spain_winner:0 "Наши добровольцы, сражающиеся вместе с победоносным испанским правительством, создали новые, более прочные связи между нашими народами, и мы должны использовать их в более официальном качестве для объединения наших народов в будущем."
 PHI_reconciliation_with_spain_loser:0 "Хотя наши добровольцы сражаются против них, испанское правительство неохотно признало общие культурные и богословские связи между нами и сочло целесообразным включить их в свою пропаганду, подчеркивающую межиспанское глобальное единство."
 PHI_reconciliation_with_spain_neutral:0 "Испания оказала несомненное влияние на развитие нашей нации, но большая часть нашей недавней истории была антагонистической из-за наших колониальных связей. При этом нельзя отрицать, что у нас с ними больше общего, нам просто нужно встретиться на равных."
 PHI_hispanic_overtures:0 "Испанские увертюры"
 PHI_hispanic_overtures_desc:0 "Мы не единственная нация в мире с латиноамериканскими связями, на самом деле большая часть Южной Америки имеет их, и мы продолжаем развивать позитивные отношения с некоторыми из них. Мы должны протянуть руку и попытаться сделать эти связи более формальными."
 PHI_revolutionary_regrets:0 "Революционные сожаления"
 PHI_revolutionary_regrets_desc:0 "При Испании мы всегда были испанскими подданными или гражданами, но теперь при США мы являемся только потребительским рынком для их экспорта, если не париями, потому что они никогда не делали нас гражданами какого-либо штата Соединенных Штатов."
 PHI_royal_exiles:0 "Королевские изгнанники"
 PHI_royal_exiles_desc:0 "Испанская монархия претерпела ряд отречений, как принудительных, так и добровольных, а также лишение наследства, однако семья все еще находится рядом и ищет убежища. Мы могли бы получить огромный престиж в испаноязычном мире, предлагая им убежище."
 PHI_reino_de_filipinas:0 "Рейно де Филипинас"
 PHI_reino_de_filipinas_desc:0 "Все части падают на свои места, и с самой Испанией, раздираемой внутренними трещинами, Филиппины стали сердцем латиноамериканского мира. Нам просто не хватает коронации, чтобы закрепить нашу позицию, это будет венцом нашей истории."
 PHI_unlock_unification_decision_tt:0 "Решение Unlocks: §YПредложение об объединении с членом фракции§!"
 PHI_unlock_conquer_decision_tt:0 "Решение Unlocks: §YСиловая интеграция испаноязычной нации§!"
 PHI_unlock_mutual_assistance_with_spain_tt:0 "Решение Unlocks: §YДоговор о взаимной помощи с [SPR.GetNameDef]§!"
 PHI_war_for_the_oceans:0 "Война за океаны"
 PHI_war_for_the_oceans_desc:0 "Исторически мы были мореплавателями, и пришло время вернуть наше первородство и претендовать на местность, которую мы знаем лучше всего. Океаны."
 PHI_assume_the_naval_burden:0 "Возьмем военно-морское бремя"
 PHI_assume_the_naval_burden_desc:0 "Япония оказалась втянутой в сухопутные конфликты, а наша специальность остается на море. Мы должны предложить взять на себя ответственность за военно-морской конфликт, чтобы они могли полностью сосредоточиться на других театрах."
 PHI_develop_naval_infrastructure:0 "Развитие военно-морской инфраструктуры"
 PHI_develop_naval_infrastructure_desc:0 "С ростом наших морских амбиций наши возможности в судостроении должны соответственно расширяться."
 PHI_reunite_madagascar:0 "Воссоединение Мадагаскара"
 PHI_reunite_madagascar_desc:0 "Несмотря на огромные различия, коренные малагасийцы имеют смешанное австронезийско-африканское происхождение, что означает, что они удивительно тесно связаны с нашим собственным народом. Мы должны преодолеть это расстояние между нами."
 PHI_claim_to_core_tt:0 "Разблокировать решения на §YПриобрести коры§! После того, как мы их контролируем."
 PHI_take_pacific_islands:0 "Острова Тихого океана"
 PHI_take_pacific_islands_desc:0 "Филиппины уже являются островной нацией, поэтому для расширения наших законных границ на восток через Тихий океан требуется лишь небольшое количество воображения."
 PHI_malayo_polynesia:0 "Малайо-Полинезия"
 PHI_malayo_polynesia_desc:0 "Исторически у нас были тесные культурные, исторические и этнические связи с Малайским полуостровом и Индией. В свете этой братской связи мы должны распространить на них те же права и привилегии, которыми пользуется наш собственный народ."
 PHI_war_for_oceania:0 "Война Океании"
 PHI_war_for_oceania_desc:0 "Океания определяется самим океаном, но наши люди путешествуют по этим водам с незапамятных времен. Пришло время включить эти острова в нашу растущую нацию."
 PHI_conquest_of_japan:0 "Завоевание Японии"
 PHI_conquest_of_japan_desc:0 "Япония долгое время была нашим главным конкурентом в плане морского контроля в этом регионе, поэтому пришло время положить конец этой конкуренции и раз и навсегда установить наше господство над ними."
 PHI_filipino_polynesian_reunification:0 "Мастера Тихого океана"
 PHI_filipino_polynesian_reunification_desc:0 "В этом регионе мира преобладает океан, состоящий из разбросанных по суше массивов и отдаленных островов, но мы завоевали их все. Таким образом, мы обеспечиваем наше законное место в качестве хозяев Тихого океана."
 PHI_polynesia_tag_tt:0 "§Y[PHI.GetName]§! Он получит новый флаг и название."
 PHI_petition_the_supreme_court:0 "Петиция в Верховный суд"
 PHI_petition_the_supreme_court_desc:0 "Коммунизм был формально запрещен Верховным судом в 1932 году, однако мы наткнулись на техническое задание, которое могло бы снова легализовать движение, нам просто нужно подписать и подать петицию, чтобы сделать это."
 PHI_legalize_the_communist_party:0 "Легализация Коммунистической партии"
 PHI_legalize_the_communist_party_desc:0 "Теперь, когда коммунизм как движение снова стал легальным, следующий шаг — вывести партию из тени, вновь сделать их действия публичными и начать работу по росту движения."
 PHI_return_of_the_exiles:0 "Возвращение изгнанников"
 PHI_return_of_the_exiles_desc:0 "Ряд важных людей с левыми взглядами были вынуждены покинуть свои дома по всей Юго-Восточной Азии под угрозой колониальных, капиталистических траншей. Мы могли бы открыть для них наши границы и предложить обещание безопасного убежища."
 PHI_support_for_chinese_communists:0 "Поддержка китайских коммунистов"
 PHI_support_for_chinese_communists_desc:0 "Коммунисты продолжают борьбу в Китае, как против японских вторжений, так и против китайских полевых командиров. У нас есть возможность переправить им людей и материальные средства вдоль Желтой реки, либо напрямую поддержать их борьбу, либо просто обеспечить топливо для разжигания пламени конфликта в регионе."
 PHI_the_red_sun_over_manila:0 "Красное солнце над Манилой"
 PHI_the_red_sun_over_manila_desc:0 "Коммунистические настроения растут по всей территории Филиппин, и впервые появилась предварительная возможность взять реальную власть. Неудавшееся восстание в Сакдалисе служит напоминанием о тщетности вооруженного восстания против поддерживаемого американцами правительства, и вместо этого мы должны искать более политические средства для захвата власти."
 PHI_partido_komunista_ng_pilipinas_coup:0 "Переворот Коммунистической партии Филиппин"
 PHI_partido_komunista_ng_pilipinas_coup_desc:0 "Началась всеобщая забастовка среди фермеров, которая распространилась на их товарищей по заводам. Народ высказался, и Национальное Собрание пало на коммунистическое дело. Теперь профсоюзы и коллективы пытаются выбрать новый центральный комитет и, самое главное, определить, кто должен стать новым генеральным секретарем."
 PHI_national_confederation:0 "Национальная конфедерация"
 PHI_national_confederation_desc:0 "Теперь, когда мы пришли к власти, пришло время начать консолидировать нашу власть. Калипунанг Памбанса нг Магбубукид са Пилипинас (Национальная конфедерация крестьян на Филиппинах) как ведущая крестьянская организация должна быть одной из первых, к которой мы подходим с этой целью."
 PHI_anti_intervention_strategies:0 "Стратегии борьбы с интервенциями"
 PHI_anti_intervention_strategies_desc:0 "С ростом напряженности между нами и Соединенными Штатами мы должны сделать все возможное, чтобы обеспечить долгосрочную жизнеспособность нашего зарождающегося коммунистического государства, путем целенаправленных уступок или отнимая у них то, что мы можем, прежде чем эта напряженность перерастет во враждебность."
 PHI_rally_the_fisherfolk:0 "Собрание рыбаков"
 PHI_rally_the_fisherfolk_desc:0 "Как архипелаг, наша рыбная промышленность велика и хорошо укомплектована. Поэтому мы должны смотреть на этих морских крестьян и подталкивать их к коммунистическому движению, использовать морской потенциал, который они предлагают."
 PHI_smugglers:0 "Контрабандисты"
 PHI_smugglers_desc:0 "Наша нация состоит из множества островов и островков, предлагая щедрый выбор скрытых укромных уголков, которые наш народ использовал в течение многих поколений для контрабанды товаров за пределы досягаемости официальных властей. Мы должны использовать этот опыт и использовать его в своих интересах!"
 PHI_struggle_conference:0 "Конференция по борьбе"
 PHI_struggle_conference_desc:0 "Наше коммунистическое движение вынуждено иметь дело с множеством различных конфликтов и напряжений, и наш ответ на них нуждается в более организованной, официальной реакции. Поэтому мы должны объединить наших лидеров на первой Конференции по борьбе, на которой будут обсуждаться и решаться все эти вопросы."
 PHI_sanction_piracy:0 "Санкционное пиратство"
 PHI_sanction_piracy_desc:0 "Наша нация архипелага принимает множество маленьких кораблей и предприимчивых детей, и поэтому было бы преступно, если бы мы не подключились к старой системе «Письм Марка», где мы обеспечиваем правовую основу для этих буканьеров, чтобы нанести удар по нашим врагам, только чтобы бежать обратно в их бухты с их недавно зачатыми морскими призами."
 PHI_infiltrate_chinese_ports:0 "Проникнуть в китайские порты"
 PHI_infiltrate_chinese_ports_desc:0 "Наши докеры одними из первых воспользовались возможностями коммунизма и как таковые уже давно являются нашими самыми верными союзниками. Мы должны использовать эти же чувства в портах Китая, а затем использовать их для того, чтобы обеспечить плацдарм для дальнейшего вмешательства в китайскую борьбу."
 PHI_every_non_communist_coastal_warlord:0 "Каждый некоммунистический и прибрежный китайский военачальник:"
 PHI_maritime_communism:0 "Морской коммунизм"
 PHI_maritime_communism_desc:0 "В то время как многие коммунистические государства сосредотачиваются на мобилизации своего народа к массовым перемещениям военных на суше, мы должны вместо этого использовать массовую мобилизацию нашей морской мощи и освободить это морское хозяин на океанах мира и таким образом объединить все под Морским коммунистическим движением."
 PHI_pan_pacific_trade_union_secretariat:0 "Пантихоокеанский профсоюзный секретариат"
 PHI_pan_pacific_trade_union_secretariat_desc:0 "Хотя мы пожинаем плоды коммунизма для себя и своего народа, это не путь для этого движения оставаться изолированным и замкнутым. Мы должны экспортировать нашу философию и средства ее воплощения другим участникам в Юго-Восточной Азии и таким образом сформировать Секретариат профсоюзов стран Тихоокеанского региона для нашей взаимной защиты и развития."
 PHI_comitern:0 "Коминтерн"
 PHI_comitern_desc:0 "В то время как наши связи [SOV.GetNameDef] В лучшем случае они были слабыми, на международной арене нельзя отрицать их власть, и если мы хотим, чтобы наш коммунистический эксперимент продолжался и экспортировался в другие страны, мы должны объединиться под одной сферой для улучшения социалистического идеала во всем мире."
 PHI_national_defense_act:0 "Закон о национальной обороне"
 PHI_national_defense_act_desc:0 "Закон о национальной обороне был принят 21 декабря 1935 года, и вместе с ним сумма в 16 000 000 песо была выделена вооруженным силам Филиппин. Все, что остается сейчас, - это определить, как и куда потратить эту сумму. Каждая ветвь вооруженных сил требует инвестиций, а также защиты, имеющей решающее значение для нашей безопасности."
 PHI_war_plan_orange:0 "Военный план Оранжевый"
 PHI_war_plan_orange_desc:0 "Основная предпосылка «Оранжевого плана» заключается в том, что Филиппины должны продолжать служить американской передовой оперативной базой в основе конфликта, и поэтому самым важным активом для защиты является залив Манила. Мы должны выполнить оборонительные директивы и сконцентрировать нашу оборону вокруг этого важного стратегического района."
 PHI_beach_defense_strategy:0 "Стратегия обороны пляжа"
 PHI_beach_defense_strategy_desc:0 "Имея достаточное количество оружия и достаточное количество солдат, мы должны быть в состоянии удерживать периметр Филиппин, и поэтому мы должны разработать нашу оборонительную стратегию с этой целью. Таким образом, мы можем обеспечить, чтобы Филиппины в целом продолжали инвестировать в любую потенциальную долгосрочную военную кампанию."
 PHI_fortify_corregidor:0 "Укрепить Corregidor"
 PHI_fortify_corregidor_desc:0 "Остров Коррегидор стоит прямо у входа в бухту Манилы, и как таковой является краеугольным камнем нашего постоянного контроля над заливом и его военно-морскими активами. Мы должны модернизировать укрепления самого острова и построить подземные сооружения, чтобы помочь выдержать длительную осаду и бомбардировку вражескими воздушными и военно-морскими силами."
 PHI_fortify_corregidor_bypass_tt:0 "Больше нет. §Y$bunker$§! и §Y$coastal_bunker$s§! Его можно построить в городе Манила."
 PHI_bastion_bataan:0 "Бастион Батаан"
 PHI_bastion_bataan_desc:0 "Полуостров Батаан является естественным оборонительным местом, составляющим одну сторону залива Манила. До тех пор, пока мы будем охранять это место, мы сможем контролировать, кто и что может использовать залив и его объекты. Чтобы обеспечить наше постоянное господство в этом районе, нам необходимо развивать оборонительные линии вдоль наземной стороны и размещать артиллерию на высотах."
 PHI_bastion_bataan_bypass_tt:0 "Больше нет. §Y$bunker$§! могут быть построены на государственных границах Батаана, а не §Y$coastal_bunker$s§! Может быть построен в самом Батаане или в Дагупане."
 PHI_coastal_artillery:0 "Прибрежная артиллерия"
 PHI_coastal_artillery_desc:0 "Несомненно, на островной цепи секцией с наибольшим количеством доступных целей является Прибрежная артиллерия, способная поражать цели как на суше, так и на море. Инвестиции в оснащение, обучение и модернизацию этих подразделений должны быть приоритетными."
 PHI_the_concrete_battleship:0 "Конкретный линкор"
 PHI_the_concrete_battleship_desc:0 "Форт Драм, самый впечатляющий из портовых фортов Манильского залива, напоминает линкор. Строительство началось в 1909 году и на протяжении всей своей карьеры получило модернизацию в вооружениях и вспомогательных сооружениях. Достопочтенное укрепление, ласково известное как USS No-Go, снова призвано на службу в новую эпоху современной войны."
 PHI_philippine_scouts:0 "Филиппинские скауты"
 PHI_philippine_scouts_desc:0 "Основанная в 1901 году, филиппинская скаутская организация включает в себя самый большой контингент филиппинцев, служащих в наших вооруженных силах, и мы должны продолжать поддерживать это подразделение и обеспечить им наилучшую подготовку и оборудование для выполнения их роли специализированных сил, назначенных для защиты нашей родины."
 PHI_militarize_the_constabulary:0 "Милитаризовать полицию"
 PHI_militarize_the_constabulary_desc:0 "Филиппинская полиция была объединена в центральную филиппинскую армию с Законом о национальной обороне, однако, оглядываясь назад, это могло быть ошибкой, поскольку полицейские силы, оставшиеся, чтобы заменить его, оказались неадекватными. Вместо этого мы должны восстановить констебль, но оставить его вооруженным и обученным, чтобы он мог служить нашей стране и защищать ее."
 PHI_philippine_army_orchestra:0 "Оркестр филиппинской армии"
 PHI_philippine_army_orchestra_desc:0 "Филиппинский Полицейский оркестр является одной из ведущих военных групп в мире, и ему была предоставлена честь играть на инаугурации президента США. Мы должны объединить группу с военными, чтобы лучше использовать силу музыки для наших солдат и использовать ее энергию, чтобы привить национальную энергию и подтолкнуть их к еще большим подвигам храбрости."
 PHI_philippine_military_academy:0 "Филиппинская военная академия"
 PHI_philippine_military_academy_desc:0 "В течение многих лет Филиппинская Полицейская академия служила в качестве центральной офицерской школы обучения в нашей стране, но нам не хватало формального места военного обучения. Мы должны включить это учреждение в состав армии и официально обозначить его новой Филиппинской военной академией, посвященной воспитанию и развитию военной элиты завтрашнего дня."
 PHI_philippine_division:0 "Филиппинская дивизия"
 PHI_philippine_division_desc:0 "Филиппинская дивизия отвечает за оборону наших островов, но плохо оснащена и недоукомплектована. Мы должны стремиться к внешнему опыту в руководстве и обеспечить наличие более современного оружия и техники для наших войск."
 PHI_10_year_training_plan:0 "10-летний учебный план"
 PHI_10_year_training_plan_desc:0 "С обещанием перехода к независимости в течение десятилетнего периода, Закон о национальной обороне содержал положения для обучения самостоятельной, независимой силы, способной защитить наш дом. Это включает в себя переход к регулярной армии, схемы подготовки офицеров, создание резервных сил и инвестиции в военную инфраструктуру."
 PHI_battalion_combat_teams:0 "Боевые команды батальона"
 PHI_battalion_combat_teams_desc:0 "Реалии войны ясно показали, что нам нужны силы, которые были бы более мобильными и гибкими, способными адаптироваться к любой ситуации по мере ее возникновения. Они должны поддерживать более свободную иерархию и иметь возможность выполнять действия малых подразделений."
 PHI_battalion_combat_teams_tt:0 "§Y$category_all_infantry$§!:\n    Мягкая атака: §G+15%§!\n    Жесткая атака: §G+15%§!\n    Пирсинг: §G+15%§!\n §Y$category_cavalry$§!:\n    Мягкая атака: §G+10%§!\n    Жесткая атака: §G+10%§!\n    Пирсинг: §G+10%§!"
 PHI_mandatory_conscription:0 "Обязательный призыв"
 PHI_mandatory_conscription_desc:0 "Защита от [PHI.GetNameDef] Это ответственность каждого гражданина. Таким образом, граждане должны быть подвергнуты обязательной воинской повинности, чтобы их можно было обучить основам боя, и поэтому быть готовыми и обученными, если от них требуется воинская обязанность."
 PHI_self_reliance_defense:0 "Защита самообеспечения"
 PHI_self_reliance_defense_desc:0 "Мы очень рассчитывали на вклад других стран в защиту нашей страны, но это выявило серьезную стратегическую слабость. Мы должны создать свои собственные средства для самозащиты, и это начинается с создания промышленной базы, способной поддерживать наши зарождающиеся силы всеми необходимыми им материалами."
 PHI_army_of_the_philippines:0 "армия Филиппин"
 PHI_army_of_the_philippines_desc:0 "Наши вооруженные силы значительно изменились всего за несколько коротких лет, и пришло время отложить в сторону опору на иностранную поддержку и уверенно идти к новому, светлому и безопасному будущему, полностью защищенному филиппинской кровью и сталью. Отныне наша безопасность - это наша собственная забота."
 PHI_army_air_corps:0 "Армейский воздушный корпус"
 PHI_army_air_corps_desc:0 "Армейский авиакорпус, хотя и ограничен в размерах и ресурсах, не испытывает недостатка в амбициях. Наши острова редки, их трудно пересечь, поэтому мы должны инвестировать более значительные средства в наши воздушные возможности, чтобы максимально прикрыть их."
 PHI_pilot_training_programme:0 "Программа подготовки пилотов"
 PHI_pilot_training_programme_desc:0 "Пилоты — это чрезвычайно важный ресурс, и у нас их немалая нехватка с учетом бедственного состояния нашей авиационной промышленности. Мы должны заключать соглашения с другими странами, чтобы дать возможность нашим молодым людям заниматься этой высоколетающей профессией."
 PHI_off_shore_patrol:0 "От берегового патруля"
 PHI_off_shore_patrol_desc:0 "Наши военно-воздушные силы должны быть способны одинаково защищать небо над сушей и морем. Таким образом, мы должны обслуживать специализированные военно-морские самолеты с большей дальностью и противокорабельными возможностями, чтобы мы могли нанести удар по захватчику, прежде чем они смогут даже увидеть наши берега."
 PHI_expand_airbases:0 "Расширение авиабаз"
 PHI_expand_airbases_desc:0 "Даже если бы наши союзники хотели развернуть на наших островах военно-воздушные силы, или мы должны развивать возможности для их производства для себя, у нас нет места для их фактической базы! Мы должны немедленно приступить к созданию новых аэродромов и аэродромов, чтобы здесь было легче размещать самолеты."
 PHI_develop_domestic_aircraft_industry:0 "Развитие отечественной авиационной промышленности"
 PHI_develop_domestic_aircraft_industry_desc:0 "До сих пор полагаться на наших друзей и союзников было хорошо, но в конечном итоге, если мы хотим быть признанными независимым государством с нашими собственными военными возможностями в этом современном мире, то мы должны начать инвестировать в нашу собственную отечественную авиапромышленность. Это может быть начато с некоторых субсидий для авиационных новаторов и предпринимателей в нашей стране."
 PHI_if_align_with_japan_tt:0 "Если §Y$PHI_align_with_japan$§! Завершено:"
 PHI_if_align_with_the_usa_tt:0 "Если §Y$PHI_align_with_the_usa$§! Завершено:"
 PHI_philippine_air_force:0 "Филиппинские ВВС"
 PHI_philippine_air_force_desc:0 "Настало время признать военно-воздушные силы своей собственной структурой, отдельной от армии. Таким образом, организованные, они будут иметь гораздо больше гибкости в организации и приобретении людей и техники. Они больше не будут отвечать потребностям одной службы, а вместо этого смогут летать на службе целого."
 PHI_thats_not_an_island:0 "Это не остров!"
 PHI_thats_not_an_island_desc:0 "Хотя наш архипелаг дает нам большую гибкость, это имеет некоторые ограничения. Например, что делать, если мы хотим проводить операции вдали от наших родных островов? Ну, тогда нам просто нужно взять с собой один из этих островов и таким образом иметь оперативную способность наносить удары в любой точке мира, где это необходимо."
 PHI_offshore_patrol:0 "Оффшорный патруль"
 PHI_offshore_patrol_desc:0 "Закон о национальной обороне также содержит положения о морской защите Филиппинского архипелага. Ожидается, что это будет не полностью сформированный голубой океанский флот, а скорее построенный вокруг защиты наших родных берегов. Это не означает, что это не может быть первым шагом к более доминирующему флоту."
 PHI_marine_corps:0 "Корпус морской пехоты"
 PHI_marine_corps_desc:0 "У нас есть большой опыт выхода на берег и за его пределами, многим людям в нашем сообществе даже нужно сесть на паромы или просто грести между островами для работы или увидеть семьи. Мы можем использовать этот опыт и сосредоточить его на главном в мире морском корпусе, где солдаты способны вести бой на любом берегу, иностранном или внутреннем."
 PHI_cavite_naval_base:0 "Военно-морская база Cavite"
 PHI_cavite_naval_base_desc:0 "Морская верфь в Кавите, расположенная через залив от города Манилы, имеет наибольший потенциал для того, чтобы стать глубоководным портом и верфью на Филиппинах. У него уже есть некоторые зарождающиеся объекты, но с инвестициями он может стать серьезным стратегическим активом, из которого можно будет разместить флот, способный контролировать воды Юго-Восточной Азии."
 PHI_pt_boat_development:0 "PT Boat Development (Разработка лодок)"
 PHI_pt_boat_development_desc:0 "Наша нация, будучи большой коллекцией островов, могла бы лучше обслуживаться с использованием небольших судов, способных заходить и выходить из узких водных путей архипелага, чтобы преследовать и уничтожать более крупных врагов. Мы должны приобрести опыт в доктринах торпедных катеров и использовать его для разработки собственных военно-морских активов, которые будут называться патрульными лодками."
 PHI_pt_boat_development_tt:0 "§G+10%§! Mastery прирост Скорость §YЭкраны§!."
 PHI_pt_boat_development_2_tt:0 "§G+20%§! Mastery прирост Скорость §YПатрульные катера§!."
 PHI_mosquito_fleet:0 "Флот комаров"
 PHI_mosquito_fleet_desc:0 "Одна торпеда или один снаряд могут поразить и потопить один корабль. Поэтому у нас должен быть не один корабль, а целый рой. Они могут получить один, десять, даже сотню, но они не смогут потопить нас всех! Хуже того, все, что потребуется, это чтобы потенциально один из наших собственных выстрелов оказался правдой, и с нашим роем мы тоже вряд ли можем пропустить."
 PHI_devil_boats:0 "Дьявольские лодки"
 PHI_devil_boats_desc:0 "Наши патрульные катера заслужили славу за свою скорость и смелость, и особенно за их способность наносить тяжелые удары и исчезать в тумане, как призраки моря. Соответственно, наши враги научились уклоняться от наших берегов, чтобы они сами не осквернились от этих «дьявольских лодок»."
 PHI_fast_attack_craft:0 "Быстрая атака Craft"
 PHI_fast_attack_craft_desc:0 "Идеальной эволюцией Патрульной Лодки является Фаст-Атака, со значительно улучшенной скоростью и огневой мощью, эти корабли могут жужжать вокруг наших берегов и приносить разорение нашим врагам, которые слишком близко отходят, и снова бросаться прочь, прежде чем помощь может прийти."
 PHI_coastal_defense_ships:0 "Корабли береговой обороны"
 PHI_coastal_defense_ships_desc:0 "Наш флот вырос так, что теперь у нас есть инфраструктура и средства для сборки и обслуживания более крупных кораблей. Нашей первой целью остается защита наших собственных берегов, но теперь мы можем строить суда, которые могут стоять на ногах с вражескими капитальными кораблями, используя нашу собственную географию в своих интересах."
 PHI_philippine_naval_patrol:0 "Филиппинский морской патруль"
 PHI_philippine_naval_patrol_desc:0 "Чтобы быть должным образом признанным на международной арене, особенно как страна, состоящая из множества островов, наш флот должен быть в состоянии должным образом защитить наши берега. Для того, чтобы увеличить его до таких размеров и возможностей, мы должны стремиться к улучшению и обновлению наших систем управления в соответствии с теми, которые ожидаются от современного флота."
 PHI_thalassocracy:0 "Талассократия"
 PHI_thalassocracy_desc:0 "Понятие «армия с государством» хорошо известно и часто хвалят за Пруссию. Мы, однако, должны стремиться быть флотом с государством, с флотом, чьи возможности превосходят даже возможности британцев в разгар их могущества."
 PHI_warning_american_intervention_tt:0 "§RПредупреждение, что это разозлит§! §Y[USA.GetNameDef]§! §Rи рисковать американским вмешательством, если не будет должным образом управляться.§!"
 Pan_pacific_trade_union_secretariat:0 "Пантихоокеанский профсоюзный секретариат"
 PHI_central_focuses_done_4_tt:0 "По крайней мере §Y4§! Фокусы из предыдущего уровня были завершены"
 PHI_central_focuses_done_5_tt:0 "По крайней мере §Y5§! Фокусы из предыдущего уровня были завершены"
 PHI_usa_focus_done_T1_tt:0 "Выполнив хотя бы один из §YПег песо к доллару§!, §YПро-Хачендадос§! или §YЗакон о гражданстве§!."
 PHI_usa_focus_done_T2_tt:0 "Выполнив не менее двух из них, §YПег песо к доллару§!, §YПро-Хачендадос§! или §YЗакон о гражданстве§!."
 PHI_usa_focus_done_T3_tt:0 "Все три из них были завершены. §YПег песо к доллару§!, §YПро-Хачендадос§! или §YЗакон о гражданстве§!."
 PHI_usa_focus_done_T1_alt_tt:0 "Выполнив хотя бы один из §Y$PHI_declare_military_emergency$§!, §YПег песо к доллару§!, §YПро-Хачендадос§! или §YЗакон о гражданстве§!."
 PHI_usa_focus_done_T2_alt_tt:0 "Выполнив не менее двух из них, §Y$PHI_declare_military_emergency$§!, §YПег песо к доллару§!, §YПро-Хачендадос§! или §YЗакон о гражданстве§!."
 PHI_usa_focus_done_T3_alt_tt:0 "Выполнив не менее трех из них, §Y$PHI_declare_military_emergency$§!, §YПег песо к доллару§!, §YПро-Хачендадос§! или §YЗакон о гражданстве§!."
 SIK_six_great_policies:0 "Шесть великих политик"
 SIK_six_great_policies_desc:0 "Шесть великих политик антиимпериализма, Дружбы с Советским Союзом, Расового и национального равенства, Чистого правительства и Мира и реконструкции, продвигаемых через Народную Антиимпериалистическую Ассоциацию, являются основой правления Шэн Шикая в Синьцзян-Клике. Через них мы обеспечим процветающую провинцию и не впадем обратно в феодальное господство."
 SIK_invest_in_the_dushanzi_oil_fields:0 "Инвестируйте в нефтяные месторождения Душанзи"
 SIK_invest_in_the_dushanzi_oil_fields_desc:0 "Нефть была обнаружена в районе Душанзи на рубеже веков, и к 1909 году мы уже начали некоторый уровень добычи, но с недавними инвестициями из Советского Союза есть потенциал для дальнейшего расширения. Мы должны стремиться к дальнейшему инвестированию в эти совместные советско-синкянджийские усилия по расширению нефтеперерабатывающих заводов, поскольку они могут быть жизненно важными как в наших, так и в советских военных усилиях."
 SIK_three_year_plan_for_reconstruction:0 "Трехлетний план реконструкции"
 SIK_three_year_plan_for_reconstruction_desc:0 "Чтобы обеспечить наше правление и избежать дальнейших потрясений, мы должны при советской поддержке начать трехлетний план реконструкции. Взяв кредиты, мы временно привяжем себя к СССР, но в долгосрочной перспективе это обеспечит наше экономическое процветание и, в конечном итоге, нашу независимость."
 SIK_a_new_xinjiang:0 "Новый Синьцзян"
 SIK_a_new_xinjiang_desc:0 "Теперь, когда наши отрасли промышленности модернизированы, а наш народ научился читать, наша провинция готова сделать следующий шаг на своем пути в будущее. Сейчас мы начнем большой проект по интеграции Синьцзяна и его народа с современным миром, поскольку мы готовимся занять свое место на мировой арене!"
 SIK_transformation_of_nature:0 "Преобразование природы"
 SIK_transformation_of_nature_desc:0 "Азия богата природными ресурсами, которые только и ждут своего часа. С нашим научным сообществом, раздвигающим границы того, что ранее считалось возможным, становятся возможными даже самые крупные, наиболее инвазивные проекты. Окружающая среда должна быть сформирована и сформирована в массовом масштабе, чтобы работать на благо народа!"
 SIK_soviet_intervention:0 "Прямое советское вмешательство"
 SIK_soviet_intervention_desc:0 "Шэн Шикай доказал, что он не заслуживает доверия, когда он торгует между различными привязанностями. Поэтому мы должны заменить его кем-то, кому мы можем доверять, чтобы править Синьцзяном в направлении, не отличающемся от линии партии."
 SIK_protector_of_the_kyrgiz:0 "Защитник киргизов"
 SIK_protector_of_the_kyrgiz_desc:0 "Киргизский народ по другую сторону советской границы жаждет, чтобы им руководил кто-то, кто их понимает.[ROOT.GetLeader] Они разделяют свои корни и знают свой путь. Мы должны ходатайствовать о [SOV.GetLeader] Для объединения с провинцией."
 SIK_ensure_a_clean_government:0 "Обеспечить чистое правительство"
 SIK_ensure_a_clean_government_desc:0 "Одна из шести великих политик влечет за собой правительство, очищенное от коррупции, но также и от мятежа. Мы должны обеспечить стабильность правительства любой ценой, устранив всех, кто может угрожать власти. [ROOT.GetLeader] Пользуясь помощью НКВД!"
 SIK_a_new_nationality_policy:0 "Новая национальная политика"
 SIK_a_new_nationality_policy_desc:0 "Мы должны принять советскую политику национальности, где не одна группа доминирует над всеми, а многие живут в гармонии. Делая это, Хань должен научиться читать и писать уйгуров, и наоборот. Мы также будем поддерживать атеизм в официальных правительственных элементах, но позволим людям свободно практиковать и верить, чтобы обеспечить более стабильную и единую провинцию."
 SIK_king_of_sinkiang:0 "Король Синьцзяна"
 SIK_king_of_sinkiang_desc:0 "Шэн Шикай является бесспорным лидером Синьцзянской клики, а некоторые даже называют его королем. Провинция, однако, находится на перепутье с некоторыми, желающими следовать за Центральным правительством, в то время как другие хотят продолжать придерживаться советской линии. Что бы ни объявил король, это решит будущее провинции и ее народа, но пока неясно, что это будет."
 SIK_rejoin_the_central_government:0 "Вступить в Центральное правительство"
 SIK_rejoin_the_central_government_desc:0 "Советы не так надежны, как мы когда-то думали. Кажется, лучше всего сделать ставку на победившего коня и изменить наш курс, чтобы вернуться в КМТ и быстро интегрироваться с Центральным правительством."
 SIK_reestablish_the_guominjun:0 "Восстановить Гоминджун"
 SIK_reestablish_the_guominjun_desc:0 "Гоминджун был военной фракцией, основанной Фэн Юйсяном в 1920-х годах. Будучи приверженными национализму, антиимпериализму и христианскому социализму, кажется идеальной организацией для возрождения, если мы хотим стать третьей стороной в гражданской войне. Не говоря уже о том, что в конечном итоге именно ГМЖ [ROOT.GetLeader] Он вернулся в тот день, и его преданность никогда не лгала с КМТ."
 SIK_reaffirm_soviet_connections:0 "Подтвердить советские связи"
 SIK_reaffirm_soviet_connections_desc:0 "Центральное правительство потерпело неудачу в Китае, и это становится все более очевидным с каждым днем. Мы должны попытаться полностью разорвать наши связи с ними и присоединиться к ним. [SOV.GetNameDef] В их крестовом походе против феодализма."
 SIK_utilize_asperovs_contacts:0 "Используйте контакты Апресова"
 SIK_utilize_asperovs_contacts_desc:0 "Гарегин Апресов, советский генеральный консул со специальными полномочиями и представитель Второго Восточного отдела Народного комиссариата иностранных дел Советского Союза в Урумчи, имеет много важных контактов в рамках Совета Европы. [SOV.GetNameDef]. Мы должны использовать его силу и связи, чтобы выжать больше из нашего сотрудничества с Россией. [SOV.GetAdjective]s."
 SIK_office_of_sinkiang_border_commissioner:0 "Управление пограничной обороны Синьцзяна"
 SIK_office_of_sinkiang_border_commissioner_desc:0 "Управление уполномоченного по пограничной обороне Синьцзяна является органом, ответственным за командование региональными гарнизонами. Через эту автономию мы можем укрепить провинциальное правительство и действовать независимо от центрального правительства практически всякий раз, когда захотим."
 SIK_cooperate_with_the_nkvd:0 "Сотрудничество с НКВД"
 SIK_cooperate_with_the_nkvd_desc:0 "Для укрепления наших отношений с [SOV.GetNameDef] Защищая нашу власть и защищая Урумчи от иностранных заговорщиков, мы должны сотрудничать с НКВД и помогать им в установлении надлежащего присутствия в нашей стране."
 SIK_cooperate_with_the_ussr:0 "Сотрудничать с СССР"
 SIK_cooperate_with_the_ussr_desc:0 "Наши отношения с Советским Союзом уникальны в Китае, и для обеспечения нашей территориальной целостности мы должны использовать это. С их помощью мы можем, наконец, изгнать Гоминьдан из нашей провинции."
 SIK_military_cooperation:0 "Военное сотрудничество"
 SIK_military_cooperation_desc:0 "Гоминьдан по-прежнему выставляет большое количество войск в Хотане через Новую 36-ю дивизию. Чтобы обеспечить их высылку, мы должны обратиться за помощью к Советскому Союзу."
 SIK_a_soviet_airforce:0 "Советские Военно-воздушные силы"
 SIK_a_soviet_airforce_desc:0 "Благодаря нашим отношениям с [SOV.GetNameDef]Мы сможем приобрести у них самолеты. Кроме того, они также подготовились к созданию пилотных школ в Урумчи и начали посылать советников, чтобы помочь подготовить нас к будущему войны."
 SIK_march_into_khotan:0 "Марш в Хотан"
 SIK_march_into_khotan_desc:0 "День настал! Скоро весь Синьцзян будет под нашим правлением, и войска Ма Хушаня будут изгнаны!"
 we_will_play_as_kum_tt:0 "Мы будем играть так, как [KUM.GetFlag]§Y[KUM.GetNameDef]§!!"
 SIK_march_into_khotan_tt:0 "вовремя, §YДополнительные поставки§! прибывает из §Y[SOV.GetNameDef]§!"
 SIK_a_united_sinkiang_clique:0 "Объединённый Синьцзян Клик"
 SIK_a_united_sinkiang_clique_desc:0 "С изгнанием новой 36-й дивизии и Синьцзяном, который теперь полностью находится под нашим правлением, мы теперь стоим как грозная сила в этом районе. Теперь мы должны обратить свой взор на восток и обеспечить территориальную целостность наших товарищей и союзников против японских захватчиков."
 SIK_pursue_further_soviet_integration:0 "Дальнейшая советская интеграция"
 SIK_pursue_further_soviet_integration_desc:0 "С окончанием битвы и улаживанием пыли мы должны обратить наши взоры на другие угрозы. Под покровительственным крылом Советского Союза мы не столкнемся с угрозой аннексии со стороны Центрального правительства, поэтому это явно самый разумный курс действий."
 SIK_establish_the_xinjiangneft:0 "Создать Синьцзяннефть"
 SIK_establish_the_xinjiangneft_desc:0 "The [SOV.GetAdjective] Политбюро обсудило вопрос «Синьцзян Ойл» и приняло резолюцию, призывающую к подготовке разработки нефти в районе Синьцзян. [SOV.GetAdjective] Граница под руководством нашего правительства. С этой целью будет создана совместная Синьцзян-Советская компания «Синьцзяннефть», которая будет способствовать совместной добыче природных ресурсов в регионе."
 SIK_established_the_xinjiangneft_flag:0 "Создана Синьцзяннефть"
 KHM_call_for_aid:0 "Призыв к помощи"
 KHM_call_for_aid_desc:0 "С силами Шэн Шикай у нашего порога мы должны призвать на помощь наших соотечественников, чтобы не развалиться."
 KHM_strike_the_governor:0 "Забастовка губернатора"
 KHM_strike_the_governor_desc:0 "Наши войска готовы, наш боевой дух высок, мы должны воспользоваться этой возможностью, чтобы выгнать советскую марионетку из нашей провинции!"
 KHM_push_them_back:0 "Толкай их назад"
 KHM_push_them_back_desc:0 "Битва за провинцию Синьцзян не должна закончиться их победой, мы отбросим их назад до самого Советского Союза!"
 KHM_the_sinkiang_ma_clique:0 "Синьцзян Ма Клик"
 KHM_the_sinkiang_ma_clique_desc:0 "С поражением Шэн Шикая и его Синьцзяна Клика мы теперь стоим как единственный губернатор провинции. Мы должны укрепить наши позиции, чтобы стать еще более сильной силой в этом районе."
 KHM_our_position_remains:0 "Наша позиция остается"
 KHM_our_position_remains_desc:0 "Война, возможно, не сложилась полностью в нашу пользу, но клика Хотана все еще стоит на месте, и Новая 36-я дивизия теперь более подготовлена, чем когда-либо, к предстоящему конфликту."
 CHI_sea_gain_warlord_support:0 "Получить поддержку Warlord"
 CHI_sea_gain_warlord_support_desc:0 "Для того, чтобы считаться законным правителем Китая, мы должны сначала получить поддержку других полевых командиров."
 CHI_allow_warlord_support_tt:0 "Разблокирует решения, чтобы получить влияние фракции в обмен на милости к полевым командирам."
 CHI_sea_propaganda_campaigns:0 "Пропагандистские кампании"
 CHI_sea_propaganda_campaigns_desc:0 "Эффективно используя пропаганду, мы сможем украсть центр внимания у центрального правительства, и вскоре они попадут к нам."
 CHI_propaganda_decisions_tt:0 "Разблокирование решений для получения влияния фракций с помощью пропагандистских кампаний"
 CHI_sea_unified_army_structure:0 "Единая структура армии"
 CHI_sea_unified_army_structure_desc:0 "Чтобы эффективно противостоять внешним и внутренним угрозам, мы должны реформировать нашу армию, чтобы она стала профессиональной единицей. С помощью советников Коммунистической партии мы сможем создать свою собственную Красную Армию и, в свою очередь, лучше сдерживать угрозы извне."
 CHI_sea_battle_for_china:0 "Битва за Китай"
 CHI_sea_battle_for_china_desc:0 "Поскольку центральное правительство все больше и больше отклоняется от правильной партийной линии, становится все более очевидным, что единственный путь вперед - вернуть контроль. Мы должны бороться за наш путь к капиталу и отнять его у государства, которое нас подвело."
 CHI_sea_rally_the_warlords:0 "Ралли военачальников"
 CHI_sea_rally_the_warlords_desc:0 "Военачальники являются важной частью борьбы за власть в Китае. С ними на нашей стороне будет гораздо проще взять управление в свои руки."
 CHI_sea_a_new_expedition:0 "Новая экспедиция"
 CHI_sea_a_new_expedition_desc:0 "По мере того, как центральное правительство колеблется, мы должны помнить о наследии Северной экспедиции и захватывать столицы. С ними под нашим правлением это будет только вопросом времени, прежде чем мы будем признаны законной властью над Китаем."
 PRC_sea_inward_focus:0 "Сосредоточьтесь на интерьере"
 PRC_sea_inward_focus_desc:0 "Путь вперед не лежит через советскую линию. Мы должны доказать свою независимость от них и проложить свой собственный путь к тому, чтобы наша революция увенчалась успехом."
 PRC_sea_rally_the_industry:0 "Ралли промышленности"
 PRC_sea_rally_the_industry_desc:0 "Без кооперативного рабочего класса и промышленной базы для снабжения нашей революции она просто исчезнет. Поэтому крайне важно сплотить их на нашей стороне."
 PRC_sea_reforming_our_ranks:0 "Реорганизуйте наши рейтинги"
 PRC_sea_reforming_our_ranks_desc:0 "Чтобы наша революция увенчалась успехом, мы должны реорганизовать наши ряды и, в свою очередь, сплотить сельский класс. Без их помощи у нас просто не будет функциональной армии, но с ними на нашей стороне мы можем получить преимущество над нашими противниками."
 PRC_sea_forging_our_own_path:0 "Прокладывая свой собственный путь"
 PRC_sea_forging_our_own_path_desc:0 "Становится все более очевидным, что Коминтерн подвел китайских революционеров, и мы должны сформировать свой собственный союз. Благодаря этому мы также сможем утвердить нашу власть за пределами Китая в надлежащее время."
 PRC_sea_toe_the_soviet_line:0 "На советской линии"
 PRC_sea_toe_the_soviet_line_desc:0 "Стало ясно, что только при советской помощи китайская революция может добиться успеха. В то время как многие внутри партии имеют разные мнения, только время покажет, правы они или нет."
 PRC_sea_aid_from_soviet_bolsheviks:0 "Помощь советских большевиков"
 PRC_sea_aid_from_soviet_bolsheviks_desc:0 "Чтобы наша революция увенчалась успехом, мы должны иметь промышленную базу для ее поддержки. С помощью советских инвесторов мы сможем запустить собственную индустрию."
 PRC_sea_soviet_advisors:0 "Советские советники"
 PRC_sea_soviet_advisors_desc:0 "У Советов есть несколько агентов, действующих в Китае. Мы должны завербовать их и использовать их опыт, если мы хотим победить националистическое правительство."
 PRC_sea_industrialisation_of_nature:0 "Индустриализация природы"
 PRC_sea_industrialisation_of_nature_desc:0 "Чтобы обеспечить условия для социализма, мы должны сначала иметь промышленный рабочий класс. С помощью Советского Союза мы быстрее сможем обеспечить эти условия."
 PRC_sea_comintern_integration:0 "Интеграция Коминтерна"
 PRC_sea_comintern_integration_desc:0 "С учетом того, что условия в настоящее время являются правильными, пришло время полностью интегрироваться в Коминтерн."
 PRC_sea_new_economic_direction:0 "Новое экономическое направление"
 PRC_sea_new_economic_direction_desc:0 "С провозглашением нашей Народной Республики и улаживанием пыли настало время переориентировать и реструктурировать нашу экономику. При тщательном планировании мы сможем со временем превзойти западные экономики и стать силой, с которой можно считаться."
 PRC_sea_move_capital:0 "Переместите столицу"
 PRC_sea_move_capital_desc:0 "После формирования этого $PRC_proclaimed_communism$Естественно, что мы перенесем наше место в правительстве и восстановим название города в Пекин."
 china_communist_warlord_focus:0 "Сосредоточьте дерево коммунистического Китая"
 china_nationalist_warlord_focus:0 "Фокусное дерево националистического Китая"
 CHI_sea_develop_capital:0 "Развивать [ROOT.Capital.GetName]"
 CHI_sea_develop_capital_desc:0 "Без индустриальной базы мы никогда не сможем сохранить свои позиции. Поэтому мы должны инвестировать в наш капитал."
 CHI_sea_further_industrial_investment:0 "Дальнейшие промышленные инвестиции"
 CHI_sea_further_industrial_investment_desc:0 "Несмотря на то, что у нас небольшая промышленность, она все еще не соответствует центральному правительству. Поэтому мы должны продолжать инвестировать в нашу отрасль."
 CHI_sea_develop_capital_arsenal:0 "Расширяйте [ROOT.Capital.GetName] Арсенал"
 CHI_sea_develop_capital_arsenal_desc:0 "Без «Арсенала» у нас не будет армии, а без армии у нас не останется государства. Поэтому для того, чтобы обеспечить наше выживание, мы должны расширить наши промышленные возможности."
 CHI_sea_small_arms_production:0 "Производство стрелкового оружия"
 CHI_sea_small_arms_production_desc:0 "Стрелковое оружие является основой нашей военной промышленности. Без них наши армии были бы бесполезны, и наше государство рухнуло бы под любым давлением. Логично, что мы должны инвестировать в этот сектор."
 CHI_sea_industrial_research_projects:0 "Промышленные исследовательские проекты"
 CHI_sea_industrial_research_projects_desc:0 "Без современной промышленности мы будем отставать от остальных, а без нее скоро опередим центральное правительство. Финансирование исследований более современных методов и механизмов поможет сохранить нашу промышленность наравне с остальным миром."
 CHI_sea_expand_public_education:0 "Расширить государственное образование"
 CHI_sea_expand_public_education_desc:0 "Без населения, имеющего доступ к образованию, мы просто отстанем от других стран. Для того чтобы обеспечить процветание нашей страны, мы должны инвестировать в государственное образование."
 CHI_sea_fund_research_projects:0 "Фонд исследовательских проектов"
 CHI_sea_fund_research_projects_desc:0 "Чтобы сохранить наше преимущество над нашими противниками, важно, чтобы мы знали и могли использовать новейшие технологические достижения. Финансируя исследовательские проекты, мы можем гарантировать это, одновременно помогая нашему населению."
 CHI_sea_rely_on_our_infantry:0 "Доверьтесь нашей пехоте"
 CHI_sea_rely_on_our_infantry_desc:0 "Армия, сосредоточенная на пехоте, еще не подвела нас, и никогда не подведет. Мы должны инвестировать в них больше, чтобы иметь преимущество перед любым потенциальным врагом."
 CHI_sea_modern_warfare:0 "Современная война"
 CHI_sea_modern_warfare_desc:0 "Будущее войны не в пехотных армиях, которыми мы располагаем сегодня. Чтобы не перехитрить и не уничтожить наших врагов, мы должны инвестировать в новые технологии."
 CHI_sea_consolidate_our_rule:0 "Консолидация нашего правила"
 CHI_sea_consolidate_our_rule_desc:0 "Хотя у нас есть номинальный контроль над нашей провинцией, все еще есть места, где наша власть слаба. Мы должны попытаться добраться до этих мест, чтобы население знало о том, кто ими управляет."
 CHI_sea_fortification_efforts:0 "Усилия по укреплению"
 CHI_sea_fortification_efforts_desc:0 "Пока наша позиция остается безопасной, может наступить время, когда нам придется защищать наши границы до последнего человека. Таким образом, очевидно, что нам придется укрепить наши границы и закрепиться."
 CHI_sea_infantry_efforts:0 "Пехотные усилия"
 CHI_sea_infantry_efforts_desc:0 "Пехота служит основой нашей армии. Улучшив наши методы и стандарты обучения, мы сможем гарантировать, что они будут работать еще лучше в активном бою."
 CHI_sea_brigade_specialization:0 "Специализация бригады"
 CHI_sea_brigade_specialization_desc:0 "Хотя наличие армии, пригодной для большинства задач, имеет основополагающее значение для нашей победы над захватчиками, необходимо также сосредоточиться на определенной степени специализации."
 CHI_sea_the_army:0 "The [ROOT.GetAdjective] Армия"
 CHI_sea_the_army_desc:0 "С завершением реформы нашей армии мы можем, наконец, сказать, что мы не просто военачальник со своей группой солдат, а скорее командующий со своей армией, готовый принять любые угрозы, которые могут возникнуть на нашем пути."
 XSM_the_military_governor:0 "Военный губернатор"
 XSM_the_military_governor_desc:0 "Пока нашу страну номинально возглавляет Ма Линь, гражданский губернатор Цинхай, военный губернатор и племянник Ма Линя, Ма Буфанг некоторое время боролся за полный контроль над провинцией. Удастся ли ему вытеснить дядю, пока неясно, но с некоторыми маневрами это, безусловно, возможно."
 XSM_a_hui_army:0 "Армия Хуэй"
 XSM_a_hui_army_desc:0 "Армия под командованием Ма Буфанга в значительной степени состоит из хуэйцев, клянущихся абсолютной верностью своему командиру. Они окажутся очень полезными, если Ма Буфангу придется захватить власть военным путем."
 XSM_sway_the_people:0 "Поколебать народ"
 XSM_sway_the_people_desc:0 "В то время как армия прочно связана с Ма Буфангом, люди, похоже, предпочитают Ма Лин. Попытка повлиять на них будет иметь важное значение, но пока не произойдут радикальные вещи, они все еще будут сидеть в лагере Ма Лин."
 XSM_sweep_out_communists:0 "Сметая коммунистов"
 XSM_sweep_out_communists_desc:0 "Изгнание Чжан Готао и его группы коммунистов является главным приоритетом, если мы не хотим попасть в руки Советской Республики. Поэтому мы должны вытеснить с нашей территории всех оставшихся коммунистов."
 XSM_send_ma_lin_on_hajj:0 "Отправь Ма Лин на хадж"
 XSM_send_ma_lin_on_hajj_desc:0 "Ма Лин знает, что его время истекло, но его вытеснение без всякой причины все равно разозлит население. Поэтому мы должны заставить его отказаться от своей позиции под предлогом совершения хаджа."
 XSM_the_civilian_governor_remains:0 "Гражданский губернатор остался"
 XSM_the_civilian_governor_remains_desc:0 "В то время как Ма Буфанг хотел полного контроля, становится все более очевидным, что это невозможно без риска полномасштабного восстания со стороны народа. Ма Лин, однако, предложил компромисс, где обе роли будут рассматриваться как соправительствующие, с его уходом к более символической роли лидера и Буфанга, фактически контролирующего большинство вопросов."
 XSM_solidifying_control:0 "Упрочняющий контроль"
 XSM_solidifying_control_desc:0 "Теперь, когда внутренняя борьба закончилась, пришло время укрепить наше правление над Цинхаем, чтобы избежать дальнейшей дестабилизации, будь то внутренние или внешние силы."
 XSM_sideline_family_conflicts:0 "Семейные конфликты Sideline"
 XSM_sideline_family_conflicts_desc:0 "Семья Ма большая и контролирует обширные территории. Теоретически это может означать, что объединение создаст огромную силу в этом районе, но вместо этого семья страдает от конфликтов. Если мы хотим объединиться, мы должны прежде всего обеспечить, чтобы эти конфликты не мешали нам."
 XSM_strengthening_our_position:0 "Укрепление нашей позиции"
 XSM_strengthening_our_position_desc:0 "Если мы хотим объединиться, нам понадобятся боевые силы, поскольку потенциал для вооруженного конфликта выше нуля, а наша армия все еще слишком мала для любой крупномасштабной операции."
 XSM_demand_submission:0 "Спрос на представление"
 XSM_demand_submission_desc:0 "Мы должны стремиться избегать конфликта, если это необходимо, поэтому правильный путь - объявить о наших намерениях и дать другим шанс сдаться, прежде чем мы нанесем удар."
 XSM_strike_at_the_detractors:0 "Забастовка предателей"
 XSM_strike_at_the_detractors_desc:0 "Другим членам семьи нельзя доверять, и объявление о наших намерениях только даст им шанс подготовиться. Мы должны сначала нанести удар, спросим позже."
 XSM_a_united_ma_state:0 "Объединенное государство Ма"
 XSM_a_united_ma_state_desc:0 "Теперь, когда вся семья объединена под одним знаменем, мы являемся силой, с которой нужно считаться как на местной, так и на международной арене. Ма Клика будет длиться тысячу лет!"
 XSM_a_united_ma_state_tt:0 "Любые наши куклы-клики будут §YПриложенный§! и §Yв коре§!И мы получим их §YГенералы§!"
 KUM_victory_in_tihwa:0 "Победа в Тихве"
 KUM_victory_in_tihwa_desc:0 "С падением [617.GetName]Наша позиция в провинции была должным образом упрочена. Сегодня мы стоим победоносно, да здравствует Хан!"
 KUM_restore_yettishar:0 "Восстановление Йеттишара"
 KUM_restore_yettishar_desc:0 "С полным контролем над провинцией Синьцзян, мы должны теперь стремиться выполнить амбиции Мухаммада Якуба Бега и объединить мусульманские провинции Северо-Запада."
 MAN_tsr_expand_the_navy:0 "Расширить Имперский флот Маньчжоу-го"
 MAN_tsr_expand_the_navy_desc:0 "Хотя мы по-прежнему будем полагаться на японцев в их поддержке на море, было бы разумно инвестировать в создание большего, чем просто речного флота. Во главе с нашим флагманом Хай Вэй и при строгом сотрудничестве с нашими союзниками мы сможем противостоять любой попытке вторжения или набега на наши земли с моря."
 MAN_tsr_mangyo_tt:0 "The §Y$MAN_showa_steel_works$§! и тот §Y$MAN_south_manchuria_railway_company$§! будет сливаться с §YМаньчжурская компания по промышленному развитию§!"
 MAN_tsr_embrace_state_shintoism_tt:0 "Разблокировать решения для улучшения §Y$MAN_state_shintoism_dm$§! Национальный дух"
 MAN_tsr_promote_manchu_identity_tt:0 "Разблокировать §Y$MAN_incoporate_manchu_nationalism_decision$§!"
 MAN_tsr_strengthen_ties_with_nissan:0 "Укрепление связей с Nissan"
 MAN_tsr_strengthen_ties_with_nissan_desc:0 "Nissan является важным партнером для нашей военной и гражданской промышленности. Мы должны стремиться к более тесным отношениям с ними, чтобы гарантировать, что мы можем легко поддерживать и расширять оба сектора."
 MAN_tsr_mangyo:0 "Мангьо"
 MAN_tsr_mangyo_desc:0 "Маньчжурская компания промышленного развития (Mangyō) — это попытка Йошисуке Айкавы, основателя Nissan Zaibatsu, совместно с правительством обеспечить экономическое процветание Маньчжории. Это будет сделано путем развития определенных стратегических отраслей, которые затем будут постепенно разветвляться на другие сектора."
 MAN_tsr_obedience:0 "Укрепление Ассоциации Конкордия"
 MAN_tsr_obedience_desc:0 "Некоторые называют нас просто марионеткой японцев, но они в корне не понимают наших тесных и равноправных отношений с Ассоциацией Конкордия на переднем крае. Противостоять нашим благодетелям было бы то же самое, что ребенок против своих родителей."
 MAN_tsr_trading_illicit_goods:0 "Торговля незаконными товарами"
 MAN_tsr_trading_illicit_goods_desc:0 "Хотя торговля незаконными товарами не является основным источником дохода нашей страны, она приносит большую прибыль. Было бы глупо закрывать его, но это может иметь ужасные последствия как для маньчжурского, так и для китайского общества."
 MAN_tsr_social_research_unit:0 "Изучите Gassakusha"
 MAN_tsr_social_research_unit_desc:0 "Gassakusha - сельскохозяйственные кооперативные организации, действующие как в Японии, так и в Маньчжурии. Мы должны изучить их, чтобы лучше понять, почему они работают, чтобы иметь возможность применить это к другим контекстам."
 MAN_tsr_further_mobilization:0 "Мобилизационные усилия"
 MAN_tsr_further_mobilization_desc:0 "Без солдат не будет армии. Мы должны добиваться дальнейшей мобилизации и подготовки, с тем чтобы мы могли создать армию, с которой можно было бы считаться."
 MAN_tsr_strengthen_the_manchukuo_imperial_army:0 "Укрепление маньчжурской императорской армии"
 MAN_tsr_strengthen_the_manchukuo_imperial_army_desc:0 "Нам нужна сильная армия, чтобы победить наших противников и сохранить нашу независимость. Чрезмерная опора на армию Квантунга только в конечном итоге приведет к нашему падению. Чтобы иметь свободную маньчжурскую нацию, мы должны сначала иметь армию."
 MAN_tsr_expand_xingan_army:0 "Расширение армии Синьань"
 MAN_tsr_expand_xingan_army_desc:0 "Армия Синьань является важной силой в нашей армии. Если мы хотим добиться успеха в предстоящих битвах, было бы разумно расширить его."
 MAN_tsr_request_dalian:0 "Запросить Даляна"
 MAN_tsr_request_dalian_desc:0 "Япония в настоящее время занимает маньчжурский портовый город Далянь, расположенный на оконечности полуострова Ляотунг в составе территории Квантун. Однако мы должны попытаться убедить их передать его нашему правительству, поскольку разница для них будет незначительной, в то время как это было бы чрезвычайно выгодно для нас."
 MAN_tsr_the_question_of_leadership:0 "Вопрос о лидерстве"
 MAN_tsr_the_question_of_leadership_desc:0 "Хотя в настоящее время мы находимся под властью премьер-министра Чжан Цзиньхуя, а Пуйи является императором только по имени, это, конечно, может быть изменено. Если Квантунская армия сочтет это необходимым, они могут вернуть власть императору или даже пойти так далеко, чтобы поставить своего собственного императора и оттеснить Пуйи."
 MAN_tsr_empire_of_manchukuo:0 "Империя Маньчжоу-го"
 MAN_tsr_empire_of_manchukuo_desc:0 "Маньчжоу-Го, или Империя Великой Маньчжурии, как она официально известна, никоим образом не является мировой державой, но нам все же удалось занять свое место в ландшафте Большой Восточной Азии. Мы должны стремиться сохранить эту позицию, не поддаваясь ложным притязаниям на большое богатство и славу, а стремясь найти свою роль в этом мире."
 MAN_tsr_embrace_state_shintoism:0 "Принять государственный синтоизм"
 MAN_tsr_embrace_state_shintoism_desc:0 "Государственный синтоизм хорошо служил Японской империи, сумев мобилизовать миллионы на дело. Мы должны стремиться подражать ей на наших собственных территориях, даже если она может первоначально столкнуться с сопротивлением."
 MAN_tsr_work_with_the_kempeitai:0 "Работа с Kempeitai"
 MAN_tsr_work_with_the_kempeitai_desc:0 "Кемпейтай, военная полиция Японии, активно работает в Маньчжурии против бандитов и других диссидентов. Однако они сталкиваются с большими трудностями из-за плохой связи с нашими властями и отсутствия знаний о земле. Мы должны работать с ними над созданием более эффективного подразделения."
 MAN_tsr_promote_manchu_identity:0 "Пропаганда маньчжурской идентичности"
 MAN_tsr_promote_manchu_identity_desc:0 "Маньчжурский народ — это не просто еще одна китайская нация. Мы должны стремиться укрепить эту связь с землей и поощрять маньчжурский национализм, чтобы отделить нас от остального Китая. Таким образом, мы сможем легче сохранить нашу независимость и в то же время сблизить нас с великими народами Азии."
 MAN_tsr_claim_outer_manchuria:0 "Предъявить претензии на Внешнюю Маньчжурию"
 MAN_tsr_claim_outer_manchuria_desc:0 "Потеря Внешней Маньчжурии для русских до сих пор остается занозой на стороне маньчжурских националистов. Мы должны попытаться исправить эту историческую ошибку, вернув эти территории в зарождающуюся маньчжурскую нацию."
 MAN_tsr_reclaim_our_lost_possessions:0 "Восстановить утраченные владения"
 MAN_tsr_reclaim_our_lost_possessions_desc:0 "Потеря Внешней Маньчжурии в Айгунском и Пекинском договорах, а также советский захват Монголии по-прежнему являются болью на стороне нашего государства. Мы должны обратить вспять эту историческую ошибку и раз и навсегда покончить с советской империей!"
 MAN_tsr_reclaim_our_lost_possessions_tt:0 "Разблокировать решения для интеграции §YВнешний маньчжурский§!, [MON.GetFlag] §Y[MON.GetAdjective]§! и [TAN.GetFlag] §Y[TAN.GetAdjective]§! штатов."
 MAN_tsr_a_new_constitution:0 "Новая конституция"
 MAN_tsr_a_new_constitution_desc:0 "Королевская диктатура никому не выгодна. Вместо этого мы должны разработать конституцию, которая предоставляет императору некоторую власть, но также ограничивает его демократически избранным правительством."
 MAN_tsr_division_of_power:0 "Разделение власти"
 MAN_tsr_division_of_power_desc:0 "Теперь, когда конституция будет разработана, она вступит в силу, и пятно варварских форм правления, таких как военная и королевская диктатуры, останется в прошлом. Китайская империя будет государством не только для сильных и могущественных, но и для всех."
 MAN_tsr_reestablish_the_qing_army:0 "Восстановление Цинской армии"
 MAN_tsr_reestablish_the_qing_army_desc:0 "Без армии мы никогда не сможем воссоединить империю, которая когда-то была. Мы должны черпать вдохновение в нашей старой армии, но не слишком укореняться в традициях. Искусство войны меняется, и мы должны следовать ему."
 MAN_tsr_question_the_emperors_authority:0 "Вопрос о власти императора"
 MAN_tsr_question_the_emperors_authority_desc:0 "Хотя Пуйи по-прежнему имеет некоторую поддержку среди тех, кто выступает против правительства, его также широко критикуют за его бездействие в отношении японцев. Мы должны прокатиться на этой волне и полностью избавиться от него с картины свободной Маньчжурии."
 MAN_tsr_bandit_recruitment:0 "Набор бандитов"
 MAN_tsr_bandit_recruitment_tt:0 "Разблокировать §YНабор бандитов§! решения"
 MAN_tsr_bandit_recruitment_desc:0 "Многие из так называемых бандитов, бродящих по нашим землям, на самом деле являются партизанскими бойцами, участвующими в активном конфликте против Японии. Мы должны объединиться и использовать их опыт, если мы хотим иметь шанс против Японской империи."
 MAN_tsr_ally_bandit_leaders:0 "Лидеры бандитов Ally Bandit"
 MAN_tsr_ally_bandit_leaders_tt:0 "Получить 5 единиц с §Y5 пехота§! Батальоны.\n"
 MAN_tsr_ally_bandit_leaders_desc:0 "Присутствие Квантунской армии означает, что японцы сумели утвердить большую власть над нашей страной. Однако это также означает, что есть значительное количество людей, готовых взять в руки оружие, чтобы избавить их от наших земель. Мы должны воспользоваться этой возможностью, чтобы обеспечить победу народа."
 MAN_tsr_a_new_dawn_over_manchuria:0 "Новый рассвет над Маньчжурией"
 MAN_tsr_a_new_dawn_over_manchuria_desc:0 "Время пришло. Наши войска готовы, и японские гарнизоны рушатся под возобновившимися повстанческими нападениями. Если мы когда-нибудь сможем вытеснить захватчиков, то сейчас самое время."
 MAN_kim_il_sung_tt:0 "Некоторые корейские революционеры могут присоединиться к борьбе."
 MAN_tsr_depose_puyi:0 "Свергнуть Пу И"
 MAN_tsr_depose_puyi_desc:0 "Пуйи служил своей цели в качестве номинального главы, но теперь он служит только препятствием для истинной демократии. Нахождение под властью монарха послужит лишь укреплению нашего государства в средневековых представлениях о аристократии и дворянстве. Поэтому крайне важно отстранить его от занимаемой должности."
 MAN_tsr_the_new_beiyang_government:0 "Новое Бэйянское правительство"
 MAN_tsr_the_new_beiyang_government_desc:0 "Армия Бейян когда-то возглавляла Китайскую Республику там, где мы находимся. Если мы хотим принести настоящую демократию в Китай, нам придется взять на себя мантию их преемника, чтобы нас не рассматривали только как незаконное государство, управляемое бандитами."
 MAN_cores_beiyang_tt:0 "Получить ядра в §YСеверный Китай§! и §YВнутренняя Монголия§!"
 MAN_tsr_reform_the_army:0 "Реформировать армию"
 MAN_tsr_reform_the_army_desc:0 "Наши нынешние силы — это не что иное, как разношерстная группа различных повстанческих армий и остатки маньчжурской армии. Если мы хотим избежать тотальной катастрофы в грядущих войнах, мы должны сначала реформировать ее в то, что она когда-то была."
 MAN_tsr_beiyang_university:0 "Университет Бейян"
 MAN_tsr_beiyang_university_desc:0 "Без надлежащего образования у наших людей не будет возможностей, и наши исследовательские усилия будут отставать от усилий остального Китая и за его пределами. Поэтому мы должны создать университет в честь Пан Фу, последнего премьера старого правительства Бейян."
 MAN_tsr_the_southern_expedition:0 "Южная экспедиция"
 MAN_tsr_the_southern_expedition_desc:0 "Северная экспедиция Гоминьдана — это то, что когда-то разрушило нашу прекрасную республику. Мы должны обратить вспять эту ошибку, начав южную экспедицию и, наконец, положить конец несостоявшемуся государству, которое в настоящее время занимает Нанкин."
 MAN_tsr_proclaim_the_republic_of_china:0 "Провозгласить Китайскую Республику"
 MAN_tsr_proclaim_the_republic_of_china_desc:0 "Со всеми столицами, находящимися под нашим контролем, мы можем, наконец, объявить себя Китайской Республикой и законным преемником правительства Бейян. Будущее еще предстоит увидеть, но пока мы принесли демократию во весь Китай, и поэтому он, надеюсь, останется на тысячу лет."
 MAN_tsr_finish_off_the_japanese_threat:0 "Окончить японскую угрозу"
 MAN_tsr_finish_off_the_japanese_threat_desc:0 "Японцы, наши первоначальные оккупанты, слишком долго были отпущены с крючка. Пришло время положить конец их фарсовому шоу о том, какое государство имеет право править Азией."
 MAN_tsr_an_industrial_power:0 "Промышленная держава"
 MAN_tsr_an_industrial_power_desc:0 "С индустрией, которая наконец-то сможет конкурировать с Западом, мы должны стремиться к ее дальнейшему расширению. С этим мы со временем станем главной промышленной державой Азии, а затем и всего мира."
 MAN_tsr_zhao_shangzhis_coup:0 "Переворот Чжао Шанчжи"
 MAN_tsr_zhao_shangzhis_coup_desc:0 "Когда пыль осела, японцы ушли, а Пуйи низвергся, в Маньчжурии образовался своего рода вакуум власти. Чжао Шанчжи и его северо-восточная антияпонская объединенная армия поспешили заполнить эту пустоту и теперь требуют, чтобы [MAN.GetLeader] Уйди."
 MAN_tsr_ally_the_soviet_republic:0 "Союзник Советской республики"
 MAN_tsr_ally_the_soviet_republic_desc:0 "Наши друзья из КПК в остальной части Китая, безусловно, хотели бы объединиться с нами. Вместе мы сможем более эффективно бороться с любыми внешними или внутренними угрозами."
 MAN_tsr_research_cooperation:0 "Научно-исследовательское сотрудничество с КПК"
 MAN_tsr_research_cooperation_desc:0 "В настоящее время между различными районами, занимаемыми нашей партией, отсутствует фактическая связь. Поэтому мы должны координировать наши исследовательские усилия в рамках КПК, чтобы гарантировать, что ни одна часть не отстает."
 MAN_tsr_the_long_march_south:0 "Мартовский юг"
 MAN_tsr_the_long_march_south_desc:0 "Время пришло. Перебросив наши войска через границу, мы инициируем заключительный этап гражданской войны в Китае. Пока еще рано говорить о том, кто победит, но при умелом маневрировании нашим врагам будет трудно идти в ногу со временем."
 MAN_tsr_soviet_aid:0 "Советская помощь"
 MAN_soviet_volunteers_tt:0 "The [SOV.GetFlag] §YСоветский Союз§! Скорее всего, они пришлют нам добровольцев."
 MAN_tsr_soviet_aid_desc:0 "С Советским Союзом на наш север и восток было бы нетрудно организовать транспортировку как техники, так и людей на наши земли. Поэтому мы должны убедить их помочь своим идеологическим союзникам в Китае."
 MAN_tsr_proclaim_the_peoples_republic:0 "Провозгласить Народную Республику"
 MAN_tsr_proclaim_the_peoples_republic_desc:0 "С главными столицами Китая, находящимися под нашим контролем, пришло время провозгласить образование Китайской Народной Республики. Мы больше не будем неорганизованной территорией на периферии, возглавляемой бандитами и другими преступниками в глазах глобальных держав, а будем полноценным государством!"
 MAN_tsr_request_our_lost_territories:0 "Запросить потерянные территории"
 MAN_tsr_request_our_lost_territories_tt:0 "Спрашиваю [SOV.GetFlag] §YСоветский Союз§! Территории, когда-то находившиеся под контролем Китая"
 MAN_tsr_request_our_lost_territories_desc:0 "Советский Союз в настоящее время находится на нескольких территориях, которые когда-то были китайскими и маньчжурскими. Если мы хотим иметь функционирующие отношения с их государством, было бы справедливо попросить их вернуться или, по крайней мере, урегулировать этот спор."
 MAN_tsr_persuade_the_IMPRP:0 "Убедить IMPRP"
 MAN_tsr_persuade_the_IMPRP_tt:0 "Члены [MEN.Getflag] §YВнутренняя монгольская народно-революционная партия§! Мы начнем гражданскую войну, как только объявим независимость."
 MAN_tsr_persuade_the_IMPRP_desc:0 "Внутренняя монгольская народно-революционная партия не является главной силой в истории. [MEN.GetName] В данный момент, но с некоторым убеждением и помощью со стороны нашей границы мы можем затащить их с собой в нашу революцию против нас. [JAP.GetNameDef]И, в свою очередь, освободить их."
 MAN_tsr_raise_the_yong_ying:0 "Поднимите Ён Ин."
 MAN_tsr_raise_the_yong_ying_desc:0 "Yong Ying, буквально «Храбрые лагеря», были своего рода региональной армией во времена империи Цин. Они состояли из местных ополченцев и, в отличие от постоянной армии, финансировались на местном уровне. Эти ополченцы часто служили целям местной самообороны в провинциях и очень хорошо служили нам. Мы должны стремиться восстановить эту систему, но сделать ее пригодной для современной войны."
 MAN_tsr_raise_the_yong_ying_tt:0 "Разблокировать решения на §YВоспитание милиции§! Когда на войне"
 MAN_tsr_a_new_self_strengthening_movement:0 "Самоукрепляющееся движение"
 MAN_tsr_a_new_self_strengthening_movement_desc:0 "Движение за самоукрепление, или Движение за западные дела, было периодом вестернизации в нашей старой Империи. Его целью было, прежде всего, улучшение наших промышленных и военных возможностей после нескольких кризисов, которые чуть не разрушили нашу нацию. Мы должны продолжать эту модернизацию, чтобы избежать любой потенциальной катастрофы в будущем."
 MAN_tsr_reestablish_the_gansu_braves:0 "Восстановление Gansu Braves"
 MAN_tsr_reestablish_the_gansu_braves_desc:0 "«Храбрые Ганьсу» были объединенной армией мусульманских солдат из Ганьсу. С районом, контролируемым семьей Ма, наконец, под нашим контролем мы должны восстановить эту армию и набрать их генералов, чтобы помочь нам контролировать этот район."
 CHI_sea_one_china_policy_tt:0 "Разблокировать решения по интеграции государств, которые когда-то были частью Китая"
 CHI_sea_annex_tuva:0 "Приложение Тува"
 CHI_sea_annex_tuva_desc:0 "Тува когда-то была частью нашего государства, но после революции русские украли их у нас. Мы должны стремиться воссоединить их со своими братьями на юге и освободить их от рук русских."
 CHI_sea_push_into_manchuria:0 "Толкай в Маньчжурию"
 CHI_sea_push_into_manchuria_desc:0 "Потеря Маньчжурии русскими в договорах 1858 и 1860 годов была унизительной, и если мы хотим стать имперской державой, мы должны стремиться обратить вспять эту ошибку."
 CHI_sea_dominate_siam:0 "Доминировать Сиам"
 CHI_sea_dominate_siam_desc:0 "Сиам является одной из немногих стран в Азии, не оккупированных иностранными державами. Мы должны защищать их от этих иностранных держав, предлагая им нашу защиту и, в свою очередь, взять под контроль их страну."
 SIC_the_sichuan_clique:0 "Сычуаньская клика"
 SIC_the_sichuan_clique_desc:0 "Сычуаньская клика находится в интересном положении, являясь территориями нескольких различных полевых командиров, свободно удерживаемых вместе какой-то идеей провинциального единства. Мы должны использовать различные сильные стороны этих военачальников, чтобы расти и становиться сильнее, чем мы уже есть."
 SIC_the_domain_of_liu_wenhui:0 "Дом Лю Вэньхуэй"
 SIC_the_domain_of_liu_wenhui_desc:0 "Лю Вэньхуэй, дядя и бывший соперник Лю Сян, создал свое собственное королевство в провинции Сикан. Первоначально губернатор Сычуаня, он был свергнут в 1935 году и с тех пор управлял Сыканом как функционально независимым царством, потенциально стремясь объединить весь Сыканг под своим правлением."
 SIC_develop_xikang:0 "Разработчик Xikang"
 SIC_develop_xikang_desc:0 "Ксиканг малонаселенный и гористый, что означает, что он часто игнорируется, когда дело доходит до развития провинций. Мы должны стремиться инвестировать в эту сферу, чтобы завоевать благосклонность людей и, в свою очередь, улучшить нашу экономическую базу."
 SIC_push_back_the_tibetans:0 "Назад Тибетцы"
 SIC_push_back_the_tibetans_desc:0 "Наконец-то настало время забастовки. Мы должны решительно прорваться через реку Цзиньша в Чамдо, как мы угрожали сделать в 1932 году, и наконец объединить Сикан под нашим правлением!"
 SIC_the_armies_of_yang_sen:0 "Армия Ян Сена"
 SIC_the_armies_of_yang_sen_desc:0 "Ян Сен - генерал с уже довольно обширной военной карьерой, будучи губернатором Сычуаня в 1924-1925 годах, чтобы затем столкнуться с британцами и присоединиться к Гоминьдану в 1926 году. Мы должны стремиться заслужить его благосклонность к дальнейшему наращиванию нашего военного потенциала."
 SIC_anti_communism:0 "Антикоммунизм"
 SIC_anti_communism_desc:0 "Ян Сен является активным сторонником антикоммунизма, ранее активно боровшимся за предотвращение коммунистического проникновения в провинцию. Мы должны придерживаться этой политики, чтобы избежать попадания Сычуаня в чужие руки."
 SIC_drive_out_the_japanese:0 "Выгнать японцев"
 SIC_drive_out_the_japanese_desc:0 "Попытка японцев подчинить себе китайцев должна быть немедленно прекращена. Хотя их полная военная победа все еще кажется нереальной, мы должны остановить их и переломить ситуацию раз и навсегда. Мы должны изгнать их из нашей славной страны!"
 SIC_the_governor_of_sichuan:0 "Губернатор Сычуани"
 SIC_the_governor_of_sichuan_desc:0 "Лю Сян, нынешний губернатор и племянник Лю Вэньхуэй, контролирует самую богатую и важную часть Сычуаня. Мы должны стремиться к его дальнейшему развитию, одновременно совершенствуя наши технологические возможности, продолжая его реформы."
 SIC_develop_chongqing:0 "Разработчик: Chongqing"
 SIC_develop_chongqing_desc:0 "Чунцин является сердцем Сычуаня, и мы должны стремиться к его дальнейшей индустриализации. Если мы хотим противостоять внешним или внутренним угрозам, мы также должны иметь промышленную поддержку."
 SIC_armor_efforts:0 "Усилия по бронированию"
 SIC_armor_efforts_desc:0 "Бронетанковые и военно-воздушные силы, которые у нас есть, слишком малы для современного конфликта. Мы должны стремиться к совершенствованию наших технологий, чтобы противостоять внешним угрозам."
 SIC_sichuan_still_stands:0 "Сычуань все еще стоит"
 SIC_sichuan_still_stands_desc:0 "В то время как центральное правительство надеялось, что марш на Чунцин после смерти Лю Сяна будет означать, что мы сдались, этого не произошло. Вместо этого мы доказали, что являемся законной силой в Китае и способны противостоять центральному правительству, если это необходимо."
 SND_unlock_loyalty_decision_tt:0 "§YРазблокирует решения, чтобы попытаться доказать лояльность Хан Фуджу или перебежать к японцам.§!"
 GXC_the_japanese_visit:0 "Японский визит"
 GXC_the_japanese_visit_desc:0 "Японцы довольно давно проявляли интерес к нашим двум государствам, надеясь, что наша оппозиция центральному правительству откроется для дальнейшей экспансии в Китае. Хотя мы не согласны с японцами и категорически против их продвижения в нашу страну, было бы разумно принять подарки, которые они предлагают, чтобы мы могли использовать их собственное оружие против них, если придет время."
 GXC_question_chiangs_authority:0 "Вопрос к власти Чан"
 GXC_question_chiangs_authority_desc:0 "Недавно Чан Кай-Шек пытался утвердить все большее влияние на наши провинции, чтобы попытаться обуздать нас. Мы должны задаться вопросом, действительно ли он имеет над нами какую-либо власть, поскольку мы функционально независимы."
 GXC_the_scorched_earth_speech:0 "Выжженная речь Земли"
 GXC_the_scorched_earth_speech_desc:0 "Центральное правительство слишком легко справляется с японцами. Мы должны сражаться с ними до последнего человека, сжигая землю, если нас заставят отступить. Японская империя никогда не должна контролировать весь Китай, независимо от его стоимости."
 GXC_rumors_of_deposition:0 "Слухи о низложении"
 GXC_rumors_of_deposition_desc:0 "Ходили слухи, что Чан Кай-Шек считает Чэнь Цзитана слишком независимым и поэтому стремится обуздать провинцию, заставив его уйти в отставку. Если это правда, то это очень тревожно, и мы должны действовать немедленно."
 GXC_denounce_chiang:0 "Обсуждение Chiang Kai-Shek"
 GXC_denounce_chiang_desc:0 "Позиция Чан Кайши и его неспособность оказать сопротивление японцам только что доказали, что он слаб и неспособен управлять страной. Мы должны осудить его и предложить альтернативное решение, которое не будет слабым."
 GXC_formation_of_the_nraja:0 "Создание NRAJA"
 GXC_formation_of_the_nraja_desc:0 "Мы вновь убедились в том, что у нас нет другого выбора, кроме как организовать вооруженное сопротивление и идти к Нанкину, если мы хотим помешать японцам постепенно захватить нашу землю. Поэтому мы должны сформировать Национальную революционную антияпонскую армию и подготовиться к походу против Хунани."
 GXC_declare_opposition:0 "Объявить оппозицию"
 GXC_declare_opposition_desc:0 "Время пришло. Мы должны заявить о своей оппозиции центральному правительству и пойти на север, чтобы либо заставить их вести переговоры, либо свергнуть их раз и навсегда. Что может произойти дальше, неизвестно, но если мы потерпим неудачу, мы все равно отправим сильный сигнал!"
 XIC_northwest_bandit_suppression_headquarters:0 "Штаб-квартира по подавлению бандитов"
 XIC_northwest_bandit_suppression_headquarters_desc:0 "Наши операции против коммунистов в Шэньси зашли в тупик, и только во второй половине 1935 года мы потеряли пехотную дивизию и полк в регионе. С возрастающим давлением со стороны наших офицеров и солдат, чтобы прекратить бесплодные бои против коммунистов и сосредоточиться на восстановлении наших потерянных провинций на северо-востоке, мы должны сделать выбор."
 XIC_discussions_in_luochuan:0 "Дискуссии в Лочуане"
 XIC_discussions_in_luochuan_desc:0 "Коммунисты отправили Ли Кенонга в качестве своего представителя на встречу. [ROOT.GetLeader] в Луочуане. Они хотят обсудить возможность прекращения боевых действий и сосредоточиться на том, что мы оба считаем большей угрозой для Китая, японцев. Мы покорим их и отправимся в указанное место с большой спешкой."
 XIC_send_a_representative_to_sheng_shicai:0 "Отправить представителя в Sheng Shicai"
 XIC_send_a_representative_to_sheng_shicai_desc:0 "Ли Кенонг согласился искать сотрудничество между нами и КПК при условии, что обе стороны будут стремиться к взаимодействию. [SOV.GetAdjective] Они пытаются получить помощь в борьбе с Японией. Мы должны использовать наши контакты в [SIK.GetNameDef] Чтобы получить благосклонность [SOV.GetLeader]."
 XIC_non_agression_pact_with_the_cpc:0 "Ненападение на КПК"
 XIC_non_agression_pact_with_the_cpc_desc:0 "Чтобы доказать нашу приверженность антияпонскому делу, мы должны попытаться прекратить боевые действия на время, даже если самодовольство будет достигнуто. [CHI.GetLeader] Это может быть раздражающим решением. Со временем мы сможем убедить [CHI.GetAdjective] Лидерство объединит усилия с [PRC.GetNameDef]."
 XIC_the_fushi_conference:0 "Конференция Фуши"
 XIC_the_fushi_conference_desc:0 "Для второй встречи, [PRC.GetLeader] Ли Кенонг и Чжоу Эньлай договорились направить в Фуши посланников для обсуждения дальнейших требований и действий, необходимых для того, чтобы убедить их в необходимости сотрудничества. [CHI.GetLeader] Присоединиться к официальному Единому фронту. Время побеждать [JAP.GetAdjective] И вернуть земли Фэнтийской Клики все ближе и ближе..."
 XIC_anti_japanese_national_salvation_agreement:0 "Антияпонское национальное соглашение о спасении"
 XIC_anti_japanese_national_salvation_agreement_desc:0 "С формальной договоренностью о прекращении военных действий в Шэньси настало время укрепить КПК, чтобы они получили власть, необходимую для убеждения. [CHI.GetLeader] Окончание гражданской войны и создание Второго объединенного фронта для Гоминьдана того стоит. Поэтому мы должны переправлять оружие и средства, предоставленные нам КМТ, в Советский базовый район, чтобы наращивать их силу."
 XIC_withdraw_forces_from_yanan:0 "Отозвать войска из Яньань"
 XIC_withdraw_forces_from_yanan_desc:0 "Чтобы вызвать гнев [CHI.GetLeader] и обеспечить, чтобы партийное руководство КМТ направлялось в Сиань для расследования наших войск, мы должны вызвать инцидент, выведя наши силы из Яньань и позволив коммунистам захватить город."
 XIC_form_the_anti_japanese_comrades_association:0 "Формирование Антияпонской Товарищеской Ассоциации"
 XIC_form_the_anti_japanese_comrades_association_desc:0 "Для того чтобы нарастить наши силы и убедить армию прекратить борьбу с КПК, мы должны создать секретную основную организацию для объединения Северо-Восточной армии и поглощения тех, кто активно выступает против японских идей. Чжан станет председателем объединения, объединившегося с коммунистами для борьбы с Японией и подготовки антияпонских кадров."
 XIC_invite_chiang_for_troop_inspections:0 "пригласите [CHI.GetLeader] Для инспекции войск"
 XIC_invite_chiang_for_troop_inspections_desc:0 "Наша страна ослаблена внутренними боями, в то время как Япония явно имеет планы на нашей территории. Несмотря на это, [CHI.GetLeader] Мы отказываемся сотрудничать с КПК и постоянно требуем, чтобы мы продолжали нашу кампанию по подавлению бандитов, несмотря на наши отчаянные просьбы. Мы должны заставить националистов и коммунистов увидеть разум и сформировать единый фронт."
 XIC_sixth_encirclement_campaign:0 "6-я кампания окружения"
 XIC_sixth_encirclement_campaign_desc:0 "Несмотря на большие потери, которые несет нам угроза КПК, мы должны готовиться к новому наступлению. [CHI.GetLeader] Он вновь приказал нам продолжать наши кампании по окружению. Только сделав это, он будет [CHI.GetAdjective] Лидерство должно быть удовлетворено и позволить нам сосредоточить наше внимание на северо-востоке."
 XIC_request_relocation_to_northeastern_command:0 "Переезд в Северо-восточное командование"
 XIC_request_relocation_to_northeastern_command_desc:0 "С нашей миссией по подавлению бандитов, которая теперь завершена в Шэньси, пришло время предложить план по борьбе с бандитизмом. [CHI.GetLeader] в котором мы предлагаем [ROOT.GetLeader] Взять на себя роль северного бастиона и хранителя [608.GetName]В настоящее время удерживается [HBC.GetLeader]. Благодаря этому мы сможем достичь наших целей по восстановлению некогда великой фэнтийской клики."
 XIC_invite_zuolin_loyalsits:0 "Приглашаем лоялистов Зуолина"
 XIC_invite_zuolin_loyalsits_desc:0 "Многие солдаты и генералы служили в [MAN.GetNameDef]Армия когда-то была лояльна [ROOT.GetLeader]Отец Чжан Цзуолинь. Пора нам тайно связаться с ними и пригласить их вернуться. [ROOT.GetNameDef]."
 XIC_reestablish_the_zhili_army:0 "Восстановление армии Жили"
 XIC_reestablish_the_zhili_army_desc:0 "Армия Чжили в Фэнтийской клике когда-то была армией Зуолинь, размещенной в том, что сейчас является провинцией Хэбэй и Бейпин. Мы должны восстановить эту организацию, как хороший шаг на нашем пути к восстановлению Клайка с нуля."
 XIC_recruit_mancurian_bandits:0 "Вербовка маньчжурских бандитов"
 XIC_recruit_mancurian_bandits_desc:0 "Многие из так называемых бандитов, бродящих по Маньчжурии, на самом деле являются партизанскими бойцами, участвующими в активном конфликте против Манчжурии. [JAP.GetNameDef] и [MAN.GetNameDef]. Мы должны объединиться и использовать их опыт, если мы хотим иметь реальный шанс противостоять восточной угрозе."
 XIC_recruit_mancurian_bandits_tt:0 "Получить 3 единицы с §Y5 пехота§! батальоны и 2 единицы с §Y5 Конница§! Батальоны.\n"
 XIC_restore_the_glory_of_the_fengtian_army:0 "Восстановление славы фэнтийской армии"
 XIC_restore_the_glory_of_the_fengtian_army_desc:0 "С завершением восстановления армии Чжили настало время должным образом перестроить Фэнтийскую армию до той силы, которой она когда-то была, как доминирующая сила в северном Китае. Скоро наши дни славы будут восстановлены!"
 XIC_reclaim_the_lost_birthright:0 "Восстановление утраченного права рождения"
 XIC_reclaim_the_lost_birthright_desc:0 "Наконец-то пришло время выкинуть [MAN.GetAdjective] и [JAP.GetAdjective] Бич с нашей родины, и вернуть Маньчжурию для себя! Мы должны немедленно начать вторжение на север и захватить регион, прежде чем их силы узнают, что на них напало."
 XIC_restore_the_homeland:0 "Восстановление Родины"
 XIC_restore_the_homeland_desc:0 "С восстановлением нашей старой столицы Мукдена, наконец, настало время для [ROOT.GetLeader] должным образом передать титул военачальника Маньчжурии и генералиссимуса военного правительства Китая и вернуть фэнтийскую клику к власти, которой она когда-то обладала. Да здравствует Фэнтянь, да здравствует юный маршал!"
 XIC_restore_the_homeland_tt:0 "получать прибыль §Yкоры§! на всей территории, удерживаемой §YФэнтяньская клика§! в наибольшей степени"
 XIC_revive_the_beiyang_government:0 "Восстановление правительства Бейян"
 XIC_revive_the_beiyang_government_desc:0 "Будучи законным наследником правительства в изгнании правительства Бейян, мы можем, наконец, провозгласить себя легитимной Китайской Республикой. Будущее еще предстоит увидеть, но пока мы принесли демократию во весь Китай, и поэтому он, надеюсь, останется на тысячу лет."
 CHI_tsr_repoen_the_natioal_assembly:0 "Открытие Национального собрания"
 CHI_tsr_repoen_the_natioal_assembly_desc:0 "Национальное собрание было законодательной ветвью правительства Бейян, будучи закрыто навсегда Юань Шикай и позже заменено Законодательным Юанем.  Если мы хотим, чтобы в стране был по-настоящему свободный демократический законодательный орган, мы не можем быть удовлетворены тем, что юань продолжает свою деятельность. Должна быть создана многогранная система, обеспечивающая верховенство воли народа!"
 CHI_tsr_form_a_preparatory_committee:0 "Создать Подготовительный комитет"
 CHI_tsr_form_a_preparatory_committee_desc:0 "Если не будут устранены недостатки борьбы за главу государства, то в стране никогда не будет мира. Поэтому, как это было однажды сделано 19 августа 1915 года, должен быть создан подготовительный комитет с целью основания конституционной монархии. Только тогда можно будет по-настоящему искоренить нашу внутреннюю рознь и политический хаос!"
 CHI_tsr_legacy_of_the_hongxian_emperor:0 "Наследие императора Гонконга"
 CHI_tsr_legacy_of_the_hongxian_emperor_desc:0 "Юань Шикай, возможно, оставил нацию в ужасном состоянии, созревшем военачальником и республиканским пылом, но его намерения были хорошими. Таким образом, он взял на себя роль императора Гонконга, чтобы предоставить национальное конституционное изобилие, и стал его национальным защитником. Если кто и достоин почитания, так это он, и мы должны попытаться возродить его наследие, прежде чем он будет забыт во времени."
 CHI_tsr_coronation_at_the_temple_of_heaven:0 "Коронация в Храме Неба"
 CHI_tsr_coronation_at_the_temple_of_heaven_desc:0 "Для того, чтобы укрепить нашу власть, [ROOT.GetLeader] Он должен стремиться к восстановлению элементов государственного конфуцианства и возрождению государственных религиозных обрядов Цин. Следовательно, он является [ROOT.GetLeader]Лучший интерес для участия в качестве императора в ритуалах, проводимых в храме Цин на Небесах, и в конечном итоге быть коронованным там."
 CHI_tsr_outlaw_the_kmt_and_cpc:0 "Запретить КМТ и КПК"
 CHI_tsr_outlaw_the_kmt_and_cpc_desc:0 "Республиканизм не подходит для национальных условий Китая. Поэтому революционным элементам, которые когда-то свергли Империю и восстали из пепла, нельзя позволять снова овладеть ею. Страна может быть восстановлена только под единым руководством, и как таковое внутреннее несогласие должно быть рассмотрено быстро."
 CHI_tsr_restoration_of_the_chinese_empire:0 "Восстановление Китайской империи"
 CHI_tsr_restoration_of_the_chinese_empire_desc:0 "Настало время восстановить нашу нацию и вывести ее из века унижений, которые она была вынуждена терпеть. Пришло время претендовать на наше место в международных делах и героически стоять во вселенной. Пришло время [ROOT.GetLeader] Взять на себя роль великого императора Китайской империи!"
 CHI_tsr_adopt_the_twelve_symbols:0 "Принять двенадцать символов"
 CHI_tsr_adopt_the_twelve_symbols_desc:0 "Национальный герб Двенадцати символов был государственным гербом Китайской империи и будет таковым еще раз. Основываясь на древних символах Двенадцати Орнаментов, власть императоров будет известна по всей стране. Азурный Дракон и Фэнхуан, император будет готов!"
 CHI_tsr_reinstate_the_new_imperial_code:0 "Восстановление нового имперского кодекса"
 CHI_tsr_reinstate_the_new_imperial_code_desc:0 "Во время своего восхождения, советник Юаня по правовым вопросам Арига Нагао разработал новый Имперский кодекс, основанный на японской имперской модели. Хотя мы не хотим особенно внимательно следить за правовой основой такого государства-изгоя, ясно, что это будет иметь предполагаемый эффект. С этой целью мы должны рассмотреть вопрос о разработке новой конституции, основанной на этом кодексе."
 CHI_tsr_reestablish_xinhua_palace:0 "Восстановление дворца Синьхуа"
 CHI_tsr_reestablish_xinhua_palace_desc:0 "После своего восхождения Юань Шикай переименовал резиденцию Чжуннаньха рядом с Запретным городом во Дворец Нового Китая. Выбирая это место жительства, кажется уместным только то, что [ROOT.GetLeader] Примите тот же подход и следуйте по его стопам."
 CHI_tsr_reclaim_the_mandate_of_heaven:0 "Заявить права на Небесный мандат"
 CHI_tsr_reclaim_the_mandate_of_heaven_desc:0 "Наши предыдущие победы в войнах за возвращение имперской столицы ясно дали понять, что небеса сами судили императора справедливым и достойным Небесного Престола. Любое сомнение в том, что он не является законным правителем всего Китая, должно исчезнуть перед лицом таких убедительных доказательств."
 CHI_tsr_five_races_under_one_union:0 "Пять народов в едином союзе"
 CHI_tsr_five_races_under_one_union_desc:0 "Если наша новая династия хочет выжить в ближайшие годы, мы должны включить принципы Республики, из которой Юань Шикай пришел к власти. Посредством принципов пятицветной республики можно добиться гармоничного сосуществования под одной нацией разных групп в регионе."
 CHI_tsr_zhonghua_minzu:0 "Чжунхуа миньцзу"
 CHI_tsr_zhonghua_minzu_desc:0 "Для того, чтобы продолжать строить успешное государство, мы должны прибегнуть к китайскому национализму в отношении концепций национального строительства и знакомства, эффективно демонстрируя нашему населению, что они обязаны быть лояльными императору и правительству. [ROOT.GetNameDef]."
 CHI_tsr_reestablish_the_beiyang_army:0 "Восстановление армии Бейян"
 CHI_tsr_reestablish_the_beiyang_army_desc:0 "Армия Северного океана была создана Юань Шикаем в 1895 году и выступала в качестве центрального элемента генеральной перестройки устаревшей военной системы Цин. Мы должны сделать то же самое и провести капитальный ремонт армии, чтобы избежать коррупции и неэффективности, присущих системе, установленной Гоминьданом."
 CHI_tsr_reestablish_the_wuwei_corps:0 "Восстановление корпуса Wuwei"
 CHI_tsr_reestablish_the_wuwei_corps_desc:0 "Корпус Увэй был фактически силой безопасности Пекина и Запретного города, созданного как попытка императорского двора Цин создать армию западного стиля, оснащенную современным оружием после их поражения в китайско-японской войне. Чтобы защитить жизнь императора и город небесный, мы должны принять аналогичные меры."
 CHI_tsr_never_another_national_protection_war:0 "Никогда больше война за национальную защиту"
 CHI_tsr_never_another_national_protection_war_desc:0 "Война за национальную защиту велась между 1915 и 1916 годами и была попыткой нелояльных генералов и республиканцев свергнуть законное правление императора Гонконга. Для того, чтобы это больше никогда не повторилось, мы должны быстро расправиться с автономными полевыми командирами и независимыми армиями и обеспечить, чтобы вся власть находилась в руках Сына Небесного!"
 CHI_tsr_tianxia:0 "Тянься"
 CHI_tsr_tianxia_desc:0 "Все земли на этой земле были назначены нашему небесному государю универсальными и четко определенными принципами порядка. Центром этой земли должен быть [ROOT.GetAdjective] Суд и император. Наконец-то пришло время заявить о себе как о среднем царстве и настоящей колыбели человеческой цивилизации!"
 CHI_tsr_the_reorganied_government:0 "Реорганизованное правительство"
 CHI_tsr_the_reorganied_government_desc:0 "С распадом этого [CHI.GetLeader] Режим и их трусливое отступление на запад, мы стоим как законное китайское государство. Чтобы подтвердить это, [ROOT.GetLeader] Он посетил могилу Сунь Ят-Сена и заявил, что будет отстаивать установленные им когда-то республиканские принципы."
 CHI_tsr_military_industrial_collaboration:0 "Военное сотрудничество"
 CHI_tsr_military_industrial_collaboration_desc:0 "Наша армия недоукомплектована и недостаточно оснащена, причем большая ее часть работает только с захваченной техникой. Мы должны попытаться исправить эту ошибку, сотрудничая с японцами и создавая свой собственный арсенал."
 CHI_tsr_industrial_expansion_cooperation:0 "Промышленное расширение"
 CHI_tsr_industrial_expansion_cooperation_desc:0 "Без промышленности и ресурсов для ее поддержки Китай никогда не будет процветать как нация. Мы должны стремиться улучшить наши промышленные возможности, если мы хотим противостоять Западу."
 CHI_tsr_expand_the_nanjing_army:0 "Расширение Нанкинской армии"
 CHI_tsr_expand_the_nanjing_army_desc:0 "Мы можем рассчитывать на лояльность не более десятой части наших номинальных сил, поэтому перед лицом этого мы должны стремиться создать по-настоящему лояльную силу, руководствуясь нашим великим лидером."
 CHI_tsr_promote_tridemism:0 "Примите тридемизм"
 CHI_tsr_promote_tridemism_desc:0 "Три принципа народа, изложенные Сунь Ят-сеном, — это национализм, демократия и жизнедеятельность народа. Мы должны стремиться продолжать его наследие, принимая наши собственные принципы, чтобы лучше представлять природу нашего государства."
 CHI_tsr_peace:0 "Мир"
 CHI_tsr_peace_desc:0 "Мы должны стремиться к миру любыми необходимыми средствами, даже если это означает предательство этого принципа в краткосрочной перспективе. Мы должны победить любого, кто стоит на пути процветания Китая."
 CHI_tsr_anti_communism:0 "Антикоммунизм"
 CHI_tsr_anti_communism_desc:0 "Коммунизм — это бедствие для нашей нации, а партизаны — боль на стороне нашей администрации. Мы должны бороться с этой идеологией и довести ее до конца, даже если это означает отдать жизнь за дело."
 CHI_tsr_national_construction:0 "Национальное строительство"
 CHI_tsr_national_construction_desc:0 "Китай никогда не сможет по-настоящему процветать, если мы не увидим новую волну промышленной экспансии. Без костяка поддержки мы никогда не сможем стать нацией, которой должен быть Китай."
 CHI_tsr_pan_asianism:0 "Паназиатский"
 CHI_tsr_pan_asianism_desc:0 "Для нас естественно принять идеалы паназиатства, так как мы братская нация японцев, и Сунь Ят-сен однажды постановил, что азиатские нации должны объединиться, чтобы изгнать колонизаторов. Эта война — не только борьба в Китае, но и более масштабная, направленная на изгнание жителей Запада из нашей страны."
 CHI_tsr_establish_the_tewu:0 "Установить Tewu"
 CHI_tsr_establish_the_tewu_desc:0 "Мы должны не только полагаться на японские спецслужбы, чтобы найти диссидентов, но и создавать своих. С помощью японских советников можно будет не только обучать наших собственных шпионов, но и достаточно скоро мы сможем иметь собственное агентство."
 CHI_tsr_embrace_japanese_cultural_institutions:0 "Японские культурные институты"
 CHI_tsr_embrace_japanese_cultural_institutions_desc:0 "Для того, чтобы добиться лучшего сотрудничества с японцами с целью создания единой Азии против иностранных захватчиков, мы должны сформировать единую культуру, охватывающую части японской культуры."
 CHI_tsr_embrace_japanese_cultural_institutions_tt:0 "Разблокировать решения для улучшения §Y$RNG_state_shintoism_dm$§! Национальный дух"
 CHI_tsr_a_new_chinese_identity:0 "Новая китайская идентичность"
 CHI_tsr_a_new_chinese_identity_desc:0 "Теперь, когда судьба Китая в наших руках, мы должны стремиться укрепить наши позиции и доказать, что мы являемся достойным партнером и настоящей Китайской Республикой."
 CHI_tsr_our_place_in_the_sphere:0 "Наша роль в сфере"
 CHI_tsr_our_place_in_the_sphere_desc:0 "Став настоящим партнером Японии, а не только ее спутником, мы должны стремиться найти свое место в Сфере совместного процветания и Большой Восточной Азии в целом. Китай снова станет мировой державой!"
 CHI_tsr_deepen_our_collaboration:0 "Углубляйте наше сотрудничество"
 CHI_tsr_deepen_our_collaboration_desc:0 "Под руководством Японской империи мы добились больших успехов в борьбе с нашими захватчиками. Мы должны стремиться к углублению нашего сотрудничества с ними, чтобы наша цель объединенной Азии была реализована."
