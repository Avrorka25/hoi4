 JAP_imperial_influence_interference_reset_days_tt:0 "Дни до $JAP_imperial_influence_ruler_name_text$ может мешать $JAP_imperial_influence_faction_names_text$ Опять же: [?JAP_interfered_in_imperial_influence_flag:days_left|Y0]"
