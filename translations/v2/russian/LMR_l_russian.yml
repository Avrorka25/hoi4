l_russian:
 focus_event.0.t:0 "Настройка непрерывных фокусов"
 focus_event.0.d:0 "Привет! На связи КраучингЛемур, создатель мода «New Continuous Focuses». Здесь вы можете решить, будут ли события добавлять людские ресурсы, фабрики и ресурсы. Это повлияет на все страны мира, включая управляемые ИИ. Если позже захотите изменить эту настройку, используйте консольную команду: event focus_event.0"
 focus_event.0.a:0 "ВКЛЮЧИТЬ события, запускаемые новыми непрерывными фокусами."
 focus_event.0.b:0 "ОТКЛЮЧИТЬ события, запускаемые новыми непрерывными фокусами."
 population_growth_i:0 "Агрессивная политика роста населения"
 construction_effort_i:0 "Развитие тяжёлой промышленности"
 excavation_effort_i:0 "Интенсифицировать добычу ресурсов"
 the_project_i:0 "Проект"
 population_growth_i_desc:0 "Мы улучшим условия жизни в нашей стране. Это повысит рост населения и будет привлекать иммигрантов каждые несколько десятков дней."
 population_growth_ii_desc:0 "Мы ещё сильнее улучшим условия жизни. Это значительно повысит рост населения и будет привлекать больше иммигрантов каждые несколько десятков дней."
 construction_effort_i_desc:0 "Мы создадим специализированные строительные бригады, сосредоточенные на развитии тяжёлой промышленности. Это ускорит строительство гражданских фабрик и литейных предприятий."
 excavation_effort_i_desc:0 "Мы создадим специализированные добывающие бригады, которые увеличат производство ресурсов и, возможно, время от времени будут обнаруживать новые небольшие месторождения."
 the_project_i_desc:0 "Мы сосредоточим больше усилий на специальных проектах."
 focus_event.1.t:0 "Недавний приток иммигрантов"
 focus_event.1.d:0 "Недавняя политика и хорошие условия жизни в [ROOT.Getname] вызвали приток иммигрантов. Теперь они расселяются на нашей территории. [ROOT.Getleader] отметил, что это подтверждает эффективность политики по увеличению населения страны."
 focus_event.1.a:0 "Отличные новости!"
 focus_event.2.t:0 "Прибыло много иммигрантов"
 focus_event.2.d:0 "Хорошие условия жизни в нашей стране привлекли множество людей из-за рубежа. Теперь они расселяются на нашей территории."
 focus_event.2.a:0 "Хорошие новости."
 focus_event.3.t:0 "Дополнительная гражданская фабрика"
 focus_event.3.d:0 "Нашим специализированным строительным бригадам удалось построить для нас 1 гражданскую фабрику."
 focus_event.3.a:0 "Хорошие новости."
 focus_event.4.t:0 "2 дополнительные гражданские фабрики"
 focus_event.4.d:0 "Нашим специализированным строительным бригадам удалось построить для нас 2 гражданские фабрики."
 focus_event.4.a:0 "Хорошие новости."
 focus_event.5.t:0 "Дополнительный военный завод"
 focus_event.5.d:0 "Нашим специализированным строительным бригадам удалось построить для нас 1 военный завод."
 focus_event.5.a:0 "Хорошие новости."
 focus_event.6.t:0 "2 дополнительных военных завода"
 focus_event.6.d:0 "Нашим специализированным строительным бригадам удалось построить для нас 2 военных завода."
 focus_event.6.a:0 "Хорошие новости."
 focus_event.7.t:0 "Обнаружены ресурсы"
 focus_event.7.d:0 "Наши добывающие бригады обнаружили новое крошечное месторождение ресурсов в нашей стране."
 focus_event.7.a:0 "Хорошие новости."
 focus_event.8.t:0 "Обнаружены ресурсы"
 focus_event.8.d:0 "Наши добывающие бригады обнаружили новое небольшое месторождение ресурсов в нашей стране."
 focus_event.8.a:0 "Хорошие новости."
 focus_event.9.t:0 "Небольшое открытие в сухопутной войне"
 focus_event.9.d:0 "Наши усилия по модернизации армии принесли плоды. Мы сделали открытие в области сухопутной войны. Его можно использовать либо для улучшения шаблонов дивизий и существующего снаряжения, либо для ускорения исследований новых технологий."
 focus_event.9.a:0 "Следует сосредоточиться на исследовании новых технологий."
 focus_event.9.b:0 "Сосредоточимся на том, что уже имеем."
