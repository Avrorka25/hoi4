 form_siberia_category_desc:0 "Сибирь никогда не имела единой идентичности, ни культурно, ни этнически, ни политически, кроме современной России. Однако, благодаря тому, что сибирский народ попал в то же самое царство руками русских, он никогда не был более единым. Если бы государство объединило Сибирь и вытеснило русских империалистов, то многие, конечно, приняли бы объединение под этим новым государством, а многие просят его стать реальностью."
