 POL_support_monarchy_in_LIT_cat_desc:1 "с [Root.GetLeader] Теперь, сидя на [Root.GetAdjective] Трон, мы имеем божественное право требовать [Root.GetRoyalClaim] Как неотъемлемая часть нашей страны.\n\nНаша текущая сила претензии [Root.GetPolRoyalClaimStrength]"
