 SOV_factory_worker_militias:0 "Воспитание заводских рабочих милиции"
 SOV_factory_worker_militias_desc:1 "Мы должны поднять фабричных рабочих на [FROM.GetName] Для усиления подразделений, которые в настоящее время дислоцируются в этом районе, или у них скоро не будет заводов для работы."
 SOV_factory_worker_militias_state_modifier_tt:0 "\n§Y$SOV_factory_worker_militias_raised$§! Модификатор состояния:\n   $MODIFIER_LOCAL_RESOURCES_FACTOR$: §R-50.00%§! \n   $MODIFIER_LOCAL_FACTORIES$: §R-100%§! \n   $MODIFIER_LOCAL_ORG_REGAIN$: §G+10.00%§! \n   $MODIFIERS_ARMY_CORE_DEFENCE_FACTOR$: §G+5.0%§! \n"
 SOV_civilian_labor_in_defense:0 "Гражданский труд в обороне"
 SOV_civilian_labor_in_defense_desc:1 "Мы помещаем гражданское население в [FROM.GetName] Район для работы над строительством укреплений для защиты своего города."
 SOV_civilian_labor_in_defense_mod:0 "$SOV_civilian_labor_in_defense$"
 SOV_civilian_labor_in_defense_state_modifier_tt:0 "\n§Y$SOV_civilian_labor_in_defense$§! Модификатор состояния:\n   $MODIFIER_LOCAL_RESOURCES_FACTOR$: §R-50.00%§! \n   $MODIFIER_LOCAL_MANPOWER$: §R-25%§!  \n   $MODIFIER_LOCAL_FACTORIES$: §R-50%§! \n   $MODIFIERS_ARMY_CORE_DEFENCE_FACTOR$: §G+5.0%§! \n   $modifier_state_production_speed_bunker_factor$: §G+60.00%§! \n   $modifier_state_production_speed_coastal_bunker_factor$: §G+60.00%§! \n"
 SOV_nothing_is_left_behind:0 "Ничего не осталось позади"
 SOV_nothing_is_left_behind_desc:1 "Если наши войска будут вынуждены уступить позиции, мы позаботимся о том, чтобы они не оставили за собой ничего, что может быть использовано противником."
 SOV_staggered_retreat:0 "Отступление Staggered Retreat"
 SOV_staggered_retreat_desc:1 "Если мы должны уступить место натиску противника, мы должны сделать это упорядоченным образом, не оставляя изолированных подразделений и не давая нашим войскам попасть в окружение врага."
 SOV_order_227_decisions_tt:1 "Разблокировать решения для подготовки и выполнения §YВоенные наступления§!. \n\nСледующие решения больше не будут доступны: §Y$SOV_nothing_is_left_behind$§! \n§Y$SOV_staggered_retreat$§! \n§Y$SOV_factory_worker_militias$§! \n§Y$SOV_civilian_labor_in_defense$§! \n"
