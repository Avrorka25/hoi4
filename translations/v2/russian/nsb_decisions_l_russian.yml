 POL_ban_monarchists:0 "Окончание монархического вопроса"
 POL_cossack_republic_decisions:0 "Казачьи республики"
 POL_cossack_republic_decisions_desc:0 "Во время Гражданской войны в России было создано несколько наций независимых казачьих войск, сражавшихся вместе с белыми. Теперь, когда белые эмигранты вторгаются вглубь российской территории, у нас есть возможность возродить падшие республики."
 POL_restore_don_cossacks:0 "Восстановление Донской республики"
 POL_restore_don_cossacks_desc:0 "Ожесточенные противники большевизма, донские казаки сражались вместе с белыми в российской гражданской войне. Со всей их территорией, находящейся сейчас в нашем владении, мы можем пригласить донских ссыльных переселить эти земли и сражаться вместе со своими товарищами."
 POL_restore_kuban_cossacks:0 "Восстановление Кубанской республики"
 POL_restore_kuban_cossacks_desc:0 "Предательство кубанских казаков стало поворотным моментом в российской гражданской войне, которая привела к поражению белых. На этот раз мы обеспечим, чтобы Кубани возглавило правительство, которое останется лояльным."
