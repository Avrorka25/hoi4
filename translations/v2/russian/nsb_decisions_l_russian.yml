 POL_promote_falangism_decisions:0 "Поощрение фалангизма"
 POL_promote_falangism_decisions_desc:0 "Война с немцами на горизонте, и хотя мы перевооружены, [GER.GetLeader] Невозможно надеяться на то, что все [GER.GetLeader.GerHerHis] Враги сразу! При надлежащей поддержке фалангистов среди народа, добрые католические нации мира могут присоединиться к нам в нашей борьбе против... [GER.GetNameDef]."
