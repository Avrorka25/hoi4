 SOV_comecon_industrialization_program_desc:0 "Мы будем проводить индустриализацию в [FROM.GetNameDef] стимулирование строительства новой отечественной промышленности и инфраструктуры."
 SOV_comecon_joint_military_program:0 "Совместная военная программа"
 SOV_comecon_joint_military_program_desc:1 "Мы разработаем совместную с нашими странами-партнерами военную программу по повышению их учебно-тренировочного потенциала."
 SOV_comecon_industrialization_program_ongoing_flag:0 "Ан §YПрограмма индустриализации§! Уже продолжается"
 SOV_comecon_joint_military_program_ongoing_flag:0 "Решение §Y$SOV_comecon_joint_military_program$§! В настоящее время активно"
 SOV_comecon_industrialization_program_modifier_tt:0 "изменять §Y$SOV_comecon_sov_default$§! через \n Заводы потребительских товаров: §Y+8.0%§!\n§YЦелевая страна§!: \nизменять §Y$SOV_comecon_sov_default$§! через \n Заводы потребительских товаров: §Y-5.0%§!\n Скорость строительства: §G+20.00%§!"
 SOV_comecon_joint_military_program_modifier_tt:0 "изменять §Y$SOV_comecon_sov_default$§! через \n Заводы потребительских товаров: §Y+3.0%§! \n Множитель ежедневного прироста командного ресурса: §R-15%§!\n§YКаждый предмет§!: \nизменять §Y$SOV_comecon_sov_default$§! через \n Армейский опыт: §G0.50§! ежедневно \n Опыт военно-морского флота: §G0.50§! ежедневно \n Воздушный опыт: §G0.50§! ежедневно \n Время обучения: §R+10.00%§! \n Ежедневная командная мощность: §G0.10§!"
