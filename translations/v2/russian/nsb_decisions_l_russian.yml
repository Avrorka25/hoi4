 SOV_paranoia_conducting_inspection_flag:0 "Уже проводит проверку"
 SOV_loosen_prohibitions_in_military_academies_dec:0 "Запреты на обучение в военных академиях"
 SOV_loosen_prohibitions_in_military_academies_dec_desc:0 "Мы ослабим ограничения на исследовательские и консультационные документы в наших военных академиях, чтобы наши молодые офицеры имели более широкий спектр источников обучения для развития своих навыков в менее деспотичной среде."
 SOV_reinforce_army_officer_ranks_with_veterans_dec:0 "Усилить армейские офицерские ранги"
 SOV_reinforce_army_officer_ranks_with_veterans_dec_desc:0 "Мы укрепим наши истребленные офицерские звания в армии закаленными и талантливыми ветеранами."
 SOV_reinforce_navy_officer_ranks_with_veterans_dec:0 "Усилить офицерский состав флота"
 SOV_reinforce_navy_officer_ranks_with_veterans_dec_desc:0 "Мы укрепим наши истребленные офицерские звания на флоте закаленными и талантливыми ветеранами."
 SOV_reinstate_mig_design_bureau:0 "Восстановление конструкторского бюро МиГ"
 SOV_reinstate_mig_design_bureau_desc:0 "Мы восстановим этого авиаконструктора и реабилитируем всех инженеров и конструкторов, не связанных с какими-либо доказательствами диверсии или антисоветского поведения."
