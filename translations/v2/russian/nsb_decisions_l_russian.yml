 SOV_raid_trotskys_villa:0 "Вилла Троцкого Raid Trotsky's Villa"
 SOV_raid_trotskys_villa_desc:0 "Агент НКВД Иосиф Григулевич возглавит группу вооруженных убийц на рейде по вилле Троцкого."
 SOV_raid_trotskys_villa_tt:0 "Группа вооруженных убийц попытается убить Троцкого, совершая набег на его виллу.\n\nШансы на убийство Троцкого увеличатся. §Y[FROM.GetFlag][FROM.GetNameDefCap]§!: \n- Высокую коммунистическую поддержку \n- Является фракцией с [ROOT.GetFlag][ROOT.GetNameDefCap] \n- Является предметом [ROOT.GetFlag][ROOT.GetNameDefCap]\n"
 SOV_carefully_planned_assassination:0 "Инфильтрация и убийство"
 SOV_carefully_planned_assassination_desc:0 "Уроженец Испании агент НКВД Рамон Меркадер подружится с доверенными лицами Троцкого, затем переедет в Мексику, где агент будет выдавать себя за сочувствующего Троцкому, ожидая подходящего момента для совершения убийства."
 SOV_carefully_planned_assassination_tt:0 "Агент НКВД попытается проникнуть в ближайшее окружение Троцкого и убить его.\n\nШансы на убийство Троцкого увеличатся. §Y[FROM.GetFlag][FROM.GetNameDefCap]§!: \n- Высокую коммунистическую поддержку \n- Хорошие отношения с [ROOT.GetFlag][ROOT.GetNameDefCap] \n- Является фракцией с [ROOT.GetFlag][ROOT.GetNameDefCap] \n- Является предметом [ROOT.GetFlag][ROOT.GetNameDefCap] \n- уже провел рейд на виллу Троцкого \n"
 SOV_attempting_to_kill_trotsky_flag:0 "Очередная операция по убийству Троцкого уже продолжается."
 SOV_nuclear_espionage_ongoing_flag:0 "Очередная операция по проникновению в иностранную атомную программу уже продолжается."
 SOV_infiltrate_foreign_atomic_programs_dec_cat:0 "Проникнуть в зарубежные атомные программы"
 SOV_infiltrate_atomic_program:0 "проникать [GetAtomicProgramNameCaps]"
 SOV_infiltrate_atomic_program_desc:0 "Мы попытаемся нанять агентов в [FROM.GetNameDef] кто верит в коммунистическое дело и кто может получить доступ к секретной информации [FROM.GetAdjective] Атомная программа."
 SOV_infiltrate_atomic_program_tt:0 "Мы постараемся собрать важную информацию, связанную с [GetAtomicProgramName]Для того, чтобы развивать собственную атомную программу.\n\nШансы на успех в этой операции возрастут, если §Y[FROM.GetFlag][FROM.GetNameDef]§! Имеет высокую коммунистическую поддержку.\n"
