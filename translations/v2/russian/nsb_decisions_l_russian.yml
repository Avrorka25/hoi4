 SOV_military_offensive_ongoing_trigger_tt:0 "[GetOffensiveMissionTriggerText]."
 SOV_military_offensive_ongoing_trigger_default:0 "Имеет контроль над §Y[?SOV_military_offensive_states^0.GetName]§! и §YВсе соседние государства§! У этого есть §Y$SOV_soviet_military_offensive$§! Модификатор состояния.\n контроль §Y[?SOV_military_offensive_states^0.GetName]§! Мы не будем подвергаться каким-либо наказаниям, если не сможем контролировать соседние государства."
 SOV_military_offensive_ongoing_trigger_completed:0 "Наступление завершилось"
 SOV_military_offensive_ongoing_failing_main_objective_tt:0 "неспособность контролировать главную цель, §Y[?SOV_military_offensive_states^0.GetName]§!Когда эта миссия закончится, мы понесем следующие наказания:"
 SOV_military_offensive_scope_tt:0 "§Y[FROM.GetName]§! и §YВсе соседние государства, контролируемые врагом.§!:\nДобавить модификатор: §Y$SOV_soviet_military_offensive$§! (Дивизионная атака): §G+10.0%§!Прорыв: §G+10.00%§! для [ROOT.GetFlag]§Y[ROOT.GetNameDef]§! в государстве)."
