 POL_completing_miedzymorze_decision:0 "Уже ведутся переговоры с другой страной"
 form_turkestan_category:0 "Формирование тюркской нации"
 form_turkestan_category_desc:0 "На протяжении всей нашей истории тюркские народы были объединены и разделены бесчисленное количество раз. Если мы сможем взять под свой контроль весь Центрально-Азиатский регион, то сможем вернуть себе наследие великих тюркских ханов и объединить наш народ в одну нацию!"
