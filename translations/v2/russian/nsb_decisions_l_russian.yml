 form_mountainous_republic_category:0 "Образует Горную Республику Северного Кавказа"
 form_mountainous_republic_category_desc:0 "Во время Гражданской войны в России великий Тапа Чермоев попытался объединить республики, расположенные на Северном Кавказе, под общим знаменем, чтобы отбиться от русских захватчиков. Теперь народ Северного Кавказа должен объединиться, чтобы изгнать иностранные державы и восстановить их славу!"
 form_mountainous_republic:0 "Объединить горные республики"
 form_transcaucasus_category:0 "Закавказская Республика"
 form_transcaucasus_category_desc:0 "Закавказская Республика, которая была недавно распущена после принятия Советской Конституции 1936 года, до сих пор остается идеей, вложенной в сознание людей. Если стране удастся объединить эти территории, есть шанс, что Федерация государств может быть восстановлена и что Закавказье может снова стать единым и сильным."
