 POL_sanacja_falanga_decisions:1 "Эндекья и Фаланга"
 POL_sanacja_falanga_decisions_desc:0 "Национал-демократы и фалангисты оказали большое влияние на Вторую польскую республику. Предоставляя концессии и проводя общенациональные демонстрации, фашистское влияние может экспоненциально расширяться в польском правительстве и среди населения."
