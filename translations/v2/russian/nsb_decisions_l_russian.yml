 form_idel_ural_category_desc:0 "1 марта 1918 года Милли Меджлис, также известный как Национальный совет, попытался объявить о создании Идель-Уральской республики, но был сорван обеими сторонами Гражданской войны. Сегодня понятие единой нации в регионе еще широко не исследовано, но если бы ее декларировали для того, чтобы защитить народ от русского империализма, была бы широкая поддержка."
