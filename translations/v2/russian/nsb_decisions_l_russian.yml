 SOV_gosproyektstroy_decision_category:0 "Госпроектстрой"
 SOV_gosproyektstroy_bring_foreign_experts:0 "Принеси [FROM.GetAdjective] Эксперты"
 SOV_gosproyektstroy_bring_foreign_experts_desc:0 "Мы подпишем соглашение с крупными [FROM.GetAdjective] промышленные предприятия для привлечения инженеров-экспертов и архитекторов из [FROM.GetNameDef] Мы выступаем в качестве консультантов для наших промышленных проектов."
 SOV_gosproyektstroy_focus_civ:0 "Специализация в гражданской промышленности"
 SOV_gosproyektstroy_focus_civ_desc:0 "В ходе масштабной промышленной модернизации мы будем уделять первоочередное внимание модернизации нашей гражданской тяжелой и легкой промышленности."
 SOV_gosproyektstroy_focus_mil:0 "Специализация в военной промышленности"
 SOV_gosproyektstroy_focus_mil_desc:0 "В ходе масштабной промышленной модернизации мы будем делать упор на достижение большей эффективности в военном производстве."
 SOV_gosproyektstroy_focus_dock:0 "Специализация в судостроительной промышленности"
 SOV_gosproyektstroy_focus_dock_desc:0 "В ходе масштабной промышленной модернизации мы сосредоточимся на достижении большей эффективности военно-морского производства."
 SOV_gosproyektstroy_upgrade_in_progress_flag:0 "В настоящее время работает над обновлением для Госпроектстроя"
 SOV_generic_industry_relocation:0 "Перемещение промышленности из [FROM.GetName]"
 SOV_generic_industry_relocation_desc:0 "Эвакуация тяжелой техники из нашей [FROM.GetName] Заводы на Урале - это огромное предприятие, но необходимо обеспечить наше военное производство."
 SOV_industry_relocation_complete_effect_tt:0 "Вплоть до §Y4 Гражданские или военные заводы§! будут удалены из §Y[FROM.GetName]§!.\n"
 SOV_industry_relocation_remove_effect_tt:0 "Снятые заводы будут перебазироваться в штат на Урале."
 SOV_relocate_industry_repair_tt:0 "§RНекоторые фабрики придется перестраивать.§!"
 SOV_relocate_industry_lose_control_tt:0 "§RПотеря контроля над [FROM.GetName] Это приведет к тому, что фабрики пострадают больше при переезде.§!"
 SOV_industry_relocation_trains_tt:0 "§R[?SOV_industrial_relocation_trains_decision_negative] $train_equipment$s§! Они будут использоваться в течение всего срока действия этого решения."
 SOV_industry_relocation_aluminium_plant_trains_tt:0 "§R[?SOV_industrial_relocation_trains_decision_aluminium_negative] $train_equipment$s§! Они будут использоваться в течение всего срока действия этого решения.\n"
 SOV_soviet_aid_to_poum_decision_category:0 "Скрытая помощь для POUM"
 SOV_soviet_aid_to_poum_decision_category_desc:0 "$SOV_covert_support_for_spanish_poum_desc$"
 SOV_organize_covert_depots_poum:0 "Подготовьте скрытые склады"
 SOV_organize_covert_depots_poum_desc:0 "Наши антисталинские контакты в Испании подготовят скрытые склады для хранения оружия и военной техники, которые наши агенты приобретут различными способами."
 SOV_organize_covert_depots_poum_tt:0 "Эффекты, когда происходит восстание POUM:\n"
 SOV_send_infantry_equipment_poum:0 "Предоставить винтовки и боеприпасы"
 SOV_send_infantry_equipment_poum_desc:0 "Отгрузка новых винтовок и боеприпасов позволит нашим испанским товарищам продолжить войну против фашизма и контрреволюционной буржуазии."
 SOV_organize_popular_brigades_poum:0 "Организовать популярные бригады"
 SOV_organize_popular_brigades_poum_desc:0 "Мы наладим контакты с членами различных политических организаций антисталинских левых, как местных, так и иностранных, для формирования международных бригад для поддержки наших испанских товарищей в войне."
 SOV_send_elite_commandos_poum:0 "Отправить Elite Commandos"
 SOV_send_elite_commandos_poum_desc:0 "У нас есть высококвалифицированные люди, способные успешно проводить спецоперации, а также несталинские бывшие комбатанты гражданской войны и ветераны армии, умеющие вести войну.\nМы должны сделать эти активы доступными для правительства ПУМ в его борьбе против фашизма и сталинизма."
 SOV_send_elite_commandos_poum_flag:0 "Elite Commandos отправят в Испанию"
 SOV_organize_popular_speeches_poum:0 "Организовать народные выступления"
 SOV_organize_popular_speeches_poum_desc:0 "Наши испанские товарищи нуждаются в полном сотрудничестве народа для продолжения военных усилий. Мы должны в сотрудничестве с влиятельными членами местных организаций провести информационную и агитационную кампанию, чтобы вновь разжечь пламя революции среди испанских масс."
 SOV_infiltrate_stalinist_plans_in_spain_poum:0 "Проникните в сталинское командование в Испании"
 SOV_infiltrate_stalinist_plans_in_spain_poum_desc:0 "В ближайшее время в Испанию будет направлена новая партия советских военных советников для оказания помощи буржуазно-республиканскому правительству, и у нас есть шанс проникнуть в их ряд антисталинистских агентов.\nЭти агенты свяжутся и вербуют солдат, бригадистов и милиционеров, симпатизирующих ПУМу в буржуазно-республиканской части, чтобы создать сеть осведомителей, которая позволит нам узнать о планах противника до того, как они будут выполнены."
 SOV_default_poum_cd_tt:0 "\nЭто решение вновь станет доступным в §Y[?SOV_default_poum_cd]§! дней.\n"
