 SOV_peace_deal_for_south_sakhalin_and_kuril_islands_desc:1 "Мы предлагаем [JAP.GetAdjective] прекращение всех военных действий, если они согласятся вернуть наши бывшие территории; [537.GetName] и тот [555.GetName]."
 SOV_peace_deal_for_hokkaido:0 "Предложите мир Сахалину, Курилам и Хоккайдо"
 SOV_peace_deal_for_hokkaido_desc:1 "Мы предлагаем [JAP.GetAdjective] прекращение всех военных действий, если они согласятся вернуть наши бывшие территории; [537.GetName] и тот [555.GetName], а также передача [536.GetName] под [ROOT.GetAdjective] Контроль."
 SOV_sinkiang_investment_ongoing_flag:0 "В Синьцзяне уже действует еще одна программа помощи"
 SOV_sinkiang_mineral_prospection_sik:0 "Проверка запасов полезных ископаемых на юге [SIK.GetNameDef]"
 SOV_sinkiang_mineral_prospection_sik_desc:0 "[ROOT.GetAdjective] У чиновников появился интерес к золоту и редким минералам, добываемым в Алтае. [SIK.GetNameDef]. Для того, чтобы выйти на рынок Синьцзяна, мы предложим искать новые месторождения и улучшать инфраструктуру в регионе. [619.GetName]Регион, богатый минералами, но с очень архаичными средствами эксплуатации."
 SOV_sinkiang_mineral_prospection:1 "Минеральные исследования в Южном Синьцзяне"
 SOV_sinkiang_mineral_prospection_desc:0 "Регион в котором [619.GetName]В юго-западной части бывшего Синьцзяна богаты полезными ископаемыми, но в настоящее время эксплуатируется лишь несколько месторождений, причем весьма архаичным и неэффективным способом. Мы должны искать ресурсы и улучшать инфраструктуру региона, чтобы облегчить эксплуатацию."
 SOV_sinkiang_mineral_prospection_mission_dummy:0 "[SOV.GetAdjective] Проверка минералов"
 SOV_sinkiang_prospection_rejected_flag:0 "Наше предложение было отклонено"
 SOV_sinkiang_oil_prospection_sik:0 "Минеральная разведка на севере [SIK.GetNameDef]"
 SOV_sinkiang_oil_prospection_sik_desc:0 "[618.GetName]В северной части [SIK.GetNameDef]Она богата нефтью и минералами, но ни один из них не эксплуатируется нашим соседом. Мы будем просить разрешения на поиск ресурсов в регионе и эксплуатировать любые найденные нами месторождения."
 SOV_sinkiang_oil_prospection:1 "Минеральные исследования в Северном Синьцзяне"
 SOV_sinkiang_oil_prospection_desc:0 "[618.GetName]В северной части бывшего Синьцзяна богаты нефтью и минералами, но ни один из них не используется в настоящее время. Мы должны искать ресурсы и развивать инфраструктуру в регионе, чтобы облегчить эксплуатацию любых месторождений, которые мы находим."
 SOV_sinkiang_oil_prospection_mission_dummy:0 "[SOV.GetAdjective] Поиск минеральных и нефтяных ресурсов"
 SOV_sinkiang_oil_prospection_rejected_flag:0 "$SOV_sinkiang_prospection_rejected_flag$"
