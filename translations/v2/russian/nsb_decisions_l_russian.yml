 SOV_forge_production_reports:0 "Формирование удовлетворительных производственных отчетов"
 SOV_forge_production_reports_desc:0 "Наши последние производственные отчеты были немного обеспокоены. Мы не знаем, были ли ожидаемые цифры достигнуты за счет действий диверсантов или за счет установления нереалистичных квот. Ясно, что если мы хотим избежать новой кампании террора со стороны НКВД, нам лучше скорректировать производственные показатели, чтобы они были приемлемыми."
 SOV_inspection_in_the_administration:0 "Инспекция в администрации"
 SOV_inspection_in_the_administration_desc:0 "Мы проведем проверку местных и центральных администраций, чтобы найти потенциальных диссидентов и диверсантов."
 SOV_inspection_in_the_army:0 "Инспекция в армии"
 SOV_inspection_in_the_army_desc:0 "Мы должны позволить НКВД провести проверку в армии, чтобы найти потенциальных диссидентов и диверсантов."
 SOV_inspection_in_the_navy:0 "Инспекция на флоте"
 SOV_inspection_in_the_navy_desc:0 "Мы должны позволить НКВД провести проверку в ВМФ, чтобы найти потенциальных диссидентов и диверсантов."
 SOV_inspection_in_the_airforce:0 "Инспекция в Военно-воздушных силах"
 SOV_inspection_in_the_airforce_desc:0 "Мы должны позволить НКВД провести проверку в ВВС, чтобы найти потенциальных диссидентов и диверсантов."
