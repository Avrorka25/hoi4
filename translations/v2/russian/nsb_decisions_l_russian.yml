 SOV_the_head_of_the_nkvd_yezhov:0 "Глава НКВД - Ежов"
 SOV_the_head_of_the_nkvd_yezhov_desc:1 "$SOV_genrikh_yagoda$Нынешний глава НКВД находится в дружеских отношениях со многими правыми оппозиционерами. Не должно быть невозможно убедить его в том, что выбранный нами путь является правильным для этой страны."
 SOV_the_head_of_the_nkvd_yagoda:0 "Глава НКВД - Ягода"
 SOV_the_head_of_the_nkvd_yagoda_desc:1 "$SOV_genrikh_yagoda$ Может быть, он и не дружит с лидерами правой оппозиции, но, по крайней мере, с ним можно рассуждать. Возможно, это должно заставить Ягоду увидеть ценности нашего предложения и убедить его в том, что наша сторона является победившей."
 SOV_aligned_right_opposition_flag:0 "Правое сочувствие оппозиции"
 SOV_the_head_of_the_nkvd_yagoda_tt:0 "§Y$SOV_genrikh_yagoda$§! Он становится сторонником правой оппозиции."
 SOV_the_head_of_the_nkvd_yezhov_tt:0 "§Y$SOV_nikolay_yezhov$§! Он становится сторонником правой оппозиции."
 SOV_assassinate_stalin:0 "Уничтожить Сталина"
 SOV_assassinate_stalin_desc:1 "Единственный способ мирно устранить тиранию — это устранить тирана. Это акт отчаяния, но массы будут избавлены от ужасов еще одной гражданской войны. Мы должны нанести ему удар, а затем двигаться дальше с планами переворота, прежде чем у его преемника будет достаточно времени, чтобы собрать поддержку."
 SOV_assassinate_stalin_good_tt:0 "На Сталина совершено покушение\nШанс на успех = §G80%§!\n £trigger_yes База: 50%\n £trigger_yes $SOV_infiltrate_the_nkvd$: +30%"
 SOV_assassinate_stalin_bad_tt:0 "На Сталина совершено покушение\nШанс на успех: §Y50%§!\n £trigger_yes База: 50%\n £trigger_no $SOV_infiltrate_the_nkvd$: +30%"
 SOV_assassinate_stalin_outcome_tt:0 "---\nЕсли попытка увенчалась успехом, §Y$SOV_lavrenty_beriya$§! Он возьмет на себя временный контроль, создав возможность для успешного переворота.\nЕсли попытка провалится, $SOV_paranoia_very_high_increase_effect_tt$."
 SOV_send_supporters_abroad:0 "Отправляйте своих сторонников за границу"
 SOV_send_supporters_abroad_desc:1 "Самое безопасное место — как можно дальше от сталинских дружков. Мы должны вывести ключевых людей из страны в безопасное место, пока не настанет время вернуться и закончить работу, которую мы начали."
 SOV_send_supporters_abroad_exile_tt:0 "Следующие персонажи будут отправлены в изгнание.§GПерсонажи в изгнании не могут быть очищены§!):"
 SOV_send_supporters_abroad_back_tt:0 "\nЭти персонажи будут возвращены в страну, чтобы поддержать нас в случае гражданской войны.\n"
 SOV_character_purged_flag:0 "Его вычистили"
 SOV_align_general_stalin:1 "[ROOT.GetLeader] обеспечивает лояльность генерала"
 SOV_align_general_stalin_desc:1 "Используя все имеющиеся в его распоряжении средства, [ROOT.GetLeader] - попытки обеспечить лояльность армейского лидера в качестве подготовки к будущему конфликту;"
 SOV_align_general_stalin_tt:0 "§Y[?SOV.SOV_selected_general_stalin.GetName]§! становится лояльным к [ROOT.GetLeader]"
 SOV_permanent_revolution_dec_cat:0 "Перманентная революция"
 SOV_permanent_revolution_dec_cat_desc:1 "[GetAppropriatePermanentRevolutionDecCatDesc]"
 SOV_permanent_revolution_dec_cat_desc_soviet:0 "$SOV_the_permanent_revolution_desc$"
 SOV_permanent_revolution_dec_cat_desc_targets:0 "Марксистская теория учит, что революция неизбежна при правильных обстоятельствах и многократном враге. [SOV.GetAdjective] агенты, действующие в пределах наших границ, обеспечивают правильность условий рабочего класса для успешного вооруженного восстания в нашей стране. [ROOT.GetName]."
 SOV_organize_fifth_columnists_in_enemy_neighbor:0 "Организовать [FROM.GetAdjective] Пятые колонисты"
 SOV_organize_fifth_columnists_in_enemy_neighbor_desc:1 "Рабочие и крестьяне, симпатизирующие большевистской партии во всем мире [FROM.GetNameDef] Они подготовились к вооруженному восстанию и готовы нанести удар там, где враг меньше всего этого ожидает."
 SOV_ignite_uprising_timer_mission:0 "Надвигающееся революционное восстание"
 SOV_ignite_uprising_timer_mission_desc:1 "[ROOT.GetAdjective] Рабочие и крестьяне, симпатизирующие [SOV.GetAdjective] Большевистская партия готовится к вооруженному восстанию в стране."
 SOV_ignite_uprising_timer_mission_tt:0 "§RТроцкистские революционные ополченцы восстанут в нескольких контролируемых государствах.§!\n"
 SOV_ignite_revolutionary_uprisings_effect_tt:0 "уменьшать £stability_texticon §YСтабильность§! и увеличивать §YПопулярность коммунизма§! в [FROM.GetNameDef]В зависимости от текущего §YПопулярность коммунизма§! в стране. Текущие эффекты:"
 SOV_ignite_revolutionary_uprisings:0 "Массы в разгаре [FROM.GetNameDef]"
 SOV_ignite_revolutionary_uprisings_desc:1 "Работники [FROM.GetNameDef] Они уже начали выражать свое недовольство [FROM.GetRulingParty] и их буржуазной политики. Настало время продвигать коммунистическую идеологию среди народа. [FROM.GetAdjective] рабочего класса."
 SOV_align_admiral_stalin:0 "[ROOT.GetLeader] Верность адмирала гарантируется"
 SOV_align_admiral_stalin_desc:1 "Используя угрозы, взяточничество и личные связи, [ROOT.GetLeader] Попытки обеспечить лояльность военно-морского лидера в качестве подготовки к будущему конфликту."
 SOV_align_admiral_stalin_tt:0 "§Y[?SOV.SOV_selected_admiral_stalin.GetName]§! становится лояльным к [ROOT.GetLeader]"
 SOV_ukraine_crackdown_timer:0 "Разгром на Украине"
 SOV_ukraine_crackdown_timer_desc:0 "НКВД приняло решение нацелиться на Украину, совершая массовые аресты и допросы с целью обеспечения лояльности народа в регионе."
 SOV_ukraine_crackdown_timer_tt:0 "Одно государство в украинском регионе будет приравнено к центристам."
 SOV_steppe_crackdown_timer:0 "Разгром в районе Великой степи"
 SOV_steppe_crackdown_timer_desc:0 "НКВД приняло решение о нанесении ударов по Великой степи, проведении массовых арестов и допросов с целью обеспечения лояльности населения региона."
