 restructure_supply_system_desc:0 "Перенаправляя строительные материалы и железнодорожников, мы можем быстро создать небольшое количество самодельных свалок вдоль некоторых наших железных дорог. Однако это не является устойчивым способом управления системой.\n\n§RЭто решение может быть принято только один раз. Бонус исчезнет, если вы построите более 3 дополнительных концентраторов.§!"
