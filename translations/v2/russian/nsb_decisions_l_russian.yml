l_russian:
 BALTIC_entente:0 "Балтийская Антанта"
 BALTIC_entente_desc:0 "Мы, балты, разделяем братство, характеризующееся нашей долгой историей страданий при иностранном империализме. Мы не можем снова склониться перед иностранными державами, это будет передача ключей от нашего суверенитета еще одной империалистической державе. Только объединившись, мы сможем сохранить нашу независимость."
 formalize_the_entente:0 "Формализация Балтийского Антанты"
 formalize_the_entente_desc:0 "Мы не решались объявить Прибалтийскую Антанту фракцией, но мы уверены, что получили достаточно членов, чтобы противостоять растущему империализму на наших границах."
 abandon_the_entente:0 "Отказаться от Антанты"
 abandon_the_entente_desc:0 "Это было глупое предприятие. Как бы нам ни хотелось, чтобы это было возможно, Балтийские страны, стоящие в одиночестве, просто не являются жизнеспособным вариантом для выживания. Мы должны уступить иностранной державе, кем бы она ни была."
 baltic_entente_leader_flag:0 "Является лидером Балтийской Антанты.\n"
 baltic_entente_flag:0 "Договорились о присоединении к Балтийской Антанте"
 convert_neighbours_baltic_cat:0 "Распространяйте революцию"
 convert_neighbours_baltic_cat_desc:0 "Революция имела здесь оглушительный успех. [Root.GetNameDef]Все, что остается сейчас, — это распространить слово революции среди наших братьев-балтийцев. Рабочие Прибалтики будут освобождены от своих буржуазных угнетателей собственными руками, но некоторые из них будут освобождены. [Root.GetAdjective] Помощь поможет им в пути."
 BALTIC_promote_communism:0 "Социалистическая пропаганда в [From.Owner.GetNameDef]"
 BALTIC_promote_communism_desc:0 "Многие из [From.Owner.GetNameDef]Крестьянство по-прежнему видит в социализме врага своего образа жизни. Хотя мы никогда не сможем исцелить шрамы, оставленные Красной Армией, мы можем убедить их в том, что наш колорит революции не так уж и кровав."
 BALTIC_promote_communism_militancy:0 "Поддержка [From.Owner.GetAdjective] Боевики"
 BALTIC_promote_communism_militancy_desc:0 "Социалистический пыл горит так ярко в сердцах многих [From.Owner.GetAdjective] Рабочим нужна только поддержка извне, чтобы начать предпринимать шаги по свержению диктатуры."
 BALTIC_communist_propaganda:0 "Балтийской коммунистической пропаганды"
 BALTIC_communist_militancy:0 "Балтийское коммунистическое ополчение"
 infiltrate_belarus_decisions:0 "Проникнуть в Беларусь"
 infiltrate_belarus_decisions_desc:0 "СССР претендует на то, чтобы представлять интересы белорусских низших классов, но прибалтийские социалисты утверждают, что это чистое позерство. Они утверждают, что [SOV.GetLeader] буржуазный диктатор во всех смыслах этого слова, и только вооружая народ Беларуси, он может действительно быть освобожден в социалистическом государстве."
 BALTIC_promote_unity_BLR:0 "Конкурсный контроль в [From.GetName]"
 BALTIC_promote_unity_BLR_desc:0 "Когда вспыхивает гражданская война в Белоруссии, все государства должны самостоятельно решать, какую сторону революции они предпочитают. Мы должны обеспечить, чтобы [From.GetName] На стороне победителей."
 BALTIC_belarus_uprising:0 "В ожидании гражданской войны в Белоруссии"
 BALTIC_belarus_uprising_desc:0 "Белорусский народ разорван на части, половина нации хочет остаться в составе. [SOV.GetNameDef]А другая половина хочет перебраться в Прибалтику."
 support_polish_falange_decisions:0 "Поддержка польского фалангизма"
 support_polish_falange_decisions_desc:0 "Фашизм в Литве увенчался успехом, и мы не видим причин, по которым мы должны отказаться от наших бывших братьев в Польше. Распространяя фалангистскую мысль среди своего населения, мы можем расширить наши возможности. [POL.GetFascistParty] Оттуда мы можем работать над утверждением польско-литовского превосходства на всем континенте."
 LIT_promote_fascism:0 "фашистская пропаганда в Польше"
 LIT_promote_fascism_desc:0 "На протяжении десятилетий фашизм был вытеснен на обочину польской политики. Хотя мы бы хотели, чтобы поляки восстали сами за себя, у них вряд ли есть шанс, если мы не будем открыто пропагандировать фашизм в их стране."
 LIT_promote_falange_militancy:0 "Поддержка фалангистских боевиков"
 LIT_promote_falange_militancy_desc:0 "The [POL.GetFascistParty] Он печально известен своими буйными и жестокими методами демонстрации. Многие фашисты боятся националистического рвения [POL.GetFascistParty]Но мы знаем, что это просто выражение патриотизма, который горит в их сердцах и который необходимо поддерживать."
 LIT_ignite_civil_war_in_POL:0 "Начните восстание"
 LIT_ignite_civil_war_in_POL_desc:0 "Подготовка была проведена. Польша скоро станет полем битвы не только идей, но и доблести и славы. Мы сделали все возможное, чтобы поддержать фалангистов в Польше, все, что нам нужно сделать сейчас, это бросить смерть и надеяться, что Бог действительно на их стороне."
 march_through_estonia:0 "Марш по Эстонии"
 march_through_estonia_desc:0 "Слабое правительство Константина Пятса достаточно долго заглушало крик эстонских патриотов. Нам не хватает рабочей силы, чтобы в одиночку бороться с эстонскими вооруженными силами, но, возможно, демонстрируя наше разочарование диктатурой в серии маршей по всей стране, мы можем напомнить молодежи Эстонии, что их отцы боролись за хорошую жизнь для них, что Пяц и его клика отрицают их."
 EST_stomp_the_vaps:0 "Вступительный правительственный репрессии"
 EST_stomp_the_vaps_desc:1 "[EST.GetLeader] Мы знаем, что мы стремимся нарушить [EST.GetLeader.GetHerHis] режим и [EST.GetLeader.GetSheHe] Мы готовимся к репрессиям и прекращению наших маршей. Если мы не успеем свергнуть правительство до этого, Эстония столкнется с гражданской войной!"
 EST_march_in_state:0 "В марте [FROM.GetName]"
 EST_convert_FIN_cat:0 "Марш по Финляндии"
 EST_convert_FIN_cat_desc:0 "The [FIN.GetFascistParty] Долгое время имел тесные связи с [EST.GetFascistParty] И теперь, когда мы претендуем на господство над нашей собственной страной, мы должны дать возможность финским ветеранам захватить их."
 EST_march_in_FIN_state:0 "В марте [FROM.GetName]"
 EST_march_in_FIN_capital:0 "Марш на [FROM.GetName]"
 EST_march_in_FIN_capital_desc:0 "Как только мы почувствуем, что ветераны Финляндии достаточно ободрены, нам нужно только дать сигнал, чтобы идти дальше. [FROM.GetName] Фины, наконец, получат власть под властью фашизма."
 promote_baltic_fascism_cat:0 "Пропаганда Балтийского фашизма"
 promote_baltic_fascism_cat_desc:1 "Балтика характеризуется слабыми инфантильными режимами, неспособными представлять кровь прибалтов, которая течет по венам их народа. Литва, Эстония и даже некоторые в Польше должны помнить о славе своих предков, которые противостояли германцам и славянам, которые теперь снова стремятся притеснить нас."
 LAT_promote_fascism:0 "Фашистская пропаганда [From.Owner.GetNameDef]"
 LAT_promote_fascism_desc:0 "Многие люди в [From.Owner.GetNameDef] Они еще не признали, что их [From.Owner.GetFascistParty] партия является единственным способом, которым [From.Owner.GetAdjective] Наконец-то люди могут управлять сами собой. Это должно быть исправлено с помощью пропагандистских усилий и активной поддержки со стороны правительства. [From.Owner.GetFascistParty] вечеринка."
 LAT_promote_falange_militancy:0 "Поддержка [From.Owner.GetFascistParty] Боевики"
 LAT_promote_falange_militancy_desc:0 "Есть те, кто в [From.Owner.GetNameDef] Мы должны поддержать тех, кто держит в своих сердцах ярость прибалтов, и мы обязаны оказать им военную и политическую поддержку, которую они заслуживают."
 LAT_ignite_civil_war_in_target:0 "Игнито [From.Owner.GetAdjective] Гражданская война"
 LAT_ignite_civil_war_in_target_desc:0 "Пропаганда может добиться только такого, что порой требуется прямое действие, чтобы принести государству силу и стабильность. Мы сделали все, что могли, теперь мы уходим. [From.Owner.GetFascistParty] своей собственной судьбой."
 LIT_iron_wolf_coup:0 "Железный волчий переворот"
 LIT_iron_wolf_coup_desc:0 "Последователи Августина Волдемараса организуют восстание в нашей стране. Если ничего не сделать, чтобы обойти Железного Волка, мы рискуем впасть в гражданскую войну. Мы должны решить, будем ли мы идти на уступки партизанам Железного Волка и рисковать расширением их прав и возможностей, или мы просто изгоним их лидера из нашей страны, оставив его последователей рассеянными и без сильного руководства, которое они утверждают."
 LIT_iron_wolf_partisans:0 "Железный волк Партизаны"
 LIT_iron_wolf_partisans_desc:0 "«Железный волк» собирается в нашей стране. Со временем они неизбежно увеличат свою поддержку среди литовского народа и, возможно, в конечном итоге почувствуют смелость совершить государственный переворот."
 LIT_iron_wolf_appeasement:0 "Задержка восстания Железного Волка"
 LIT_iron_wolf_appeasement_desc:0 "Мы должны приложить усилия, чтобы сорвать деятельность Железного волка в нашей стране. Хотя ни одна из этих мер не приведет к их полному истреблению, мы можем отложить их усилия достаточно долго, чтобы найти постоянное решение."
 LIT_relocate_iron_wolf_recruitment:0 "Переезд в центры вербовки железного волка"
 LIT_relocate_iron_wolf_recruitment_desc:0 "«Железный волк» полагается на местных рекрутеров, чтобы привлечь новых людей в свои ряды. Принудительно переселяя этих рекрутеров, мы запутаем всех потенциальных последователей и потенциально предотвратим их вступление в группу Железного Волка."
 LIT_promote_alternative_paramilitaries:0 "Поощрение альтернативных вооруженных сил"
 LIT_promote_alternative_paramilitaries_desc:0 "Хотя мы бы хотели, чтобы наши граждане присоединились к официальным литовским военным, неизбежно, что некоторые предпочли бы присягнуть на верность группе, разведенной с правительством. Возможно, продвигая другие группы, такие как Литовский стрелковый союз, мы можем отвлечь некоторых националистов от присоединения к Железному волку."
 LIT_grant_concessions_to_iron_wolf:0 "Предложить концессии Железному волку"
 LIT_grant_concessions_to_iron_wolf_desc:0 "Возможно, предложив несколько символических жестов Железному волку, мы сможем несколько подавить их волнение."
 EST_vaps_revolt_category:0 "Вапсидное восстание"
 EST_vaps_revolt_category_desc:0 "Ряд ветеранских обществ по всей Эстонии объединились в единую фашистскую организацию, известную как «Движение Вап», которая угрожает свергнуть правительство. Мы должны принять меры для сдерживания роста эстонского национализма, если мы хотим сохранить режим в мире."
 EST_vaps_uprising:0 "Вейпы маршируют по Таллинну"
 EST_vaps_uprising_desc:0 "Вейпы продолжают маршировать и демонстрироваться по всей Эстонии, несмотря на то, что они являются незаконной организацией. Чем дольше мы оставляем эту группу националистов гноиться, тем больше мы рискуем, что другие присоединятся к их делу."
 EST_vaps_crackdown:0 "Crackdown on the Vaps (альбом)"
 EST_vaps_crackdown_desc:0 "Мы координируем тотальное подавление всех обществ, связанных с Движением Вап. Если Вейпы останутся на политической периферии, подавление должно быть тривиальным, но если они получат достаточную поддержку, результатом нашего подавления может стать кровавая гражданская война с некоторыми из старейших ветеранов Эстонии."
 EST_fight_vaps_decisions:0 "Сражайтесь с вейпами"
 EST_fight_vaps_decisions_desc:0 "Движению Вейпов необходимо противостоять, если мы хотим добиться успеха. Действия, которые разрушат Вап, резко уменьшат их влияние в нашей стране и сделают их насильственное удаление более плавным."
 EST_divide_veterans_societies:0 "Разделите общества ветеранов"
 EST_divide_veterans_societies_desc:0 "Вапы в основном состоят из тех, кто участвовал в Эстонской войне за независимость, и хотя грустно видеть, что наши герои попадают под влияние ультранационализма, мы должны разбить и разделить ветеранские общества, которые объединили вапсы."
 EST_disrupt_vaps_recruitment:0 "Отказ от вапсидной вербовки"
 EST_disrupt_vaps_recruitment_desc:0 "Хотя Вейпы традиционно являются ветеранами от среднего до пожилого возраста, они не лишены молодых сочувствующих, стремящихся присоединиться к ним во имя своих отцов и дедов. Мы должны найти способы сорвать эту вербовку и держать этих молодых людей подальше от песни сирены фашизма."
 EST_crackdown_on_vaps:0 "Нападайте на вейпы"
 EST_crackdown_on_vaps_desc:0 "Вейпы становятся слишком смелыми, мы должны провести рейд на их членов, если хотим искоренить их растущее влияние."
 EST_put_vaps_leaders_on_trial:0 "Поместите Vapsid Sympathisers в суд"
 EST_put_vaps_leaders_on_trial_desc:0 "Не секрет, что некоторые члены правительства симпатизируют движению Вап. Нельзя допустить, чтобы это продолжалось; Члены нашего военного персонала должны быть судимы как предатели за их связь с Вапами."
 EST_launch_vaps_investigation:0 "Начать расследование Vapsid"
 EST_launch_vaps_investigation_desc:0 "Мы должны посвятить часть наших секретных служб проникновению и прекращению попыток Вап подорвать правительство."
 EST_anti_vaps_propaganda:0 "Антифашистская пропаганда"
 EST_anti_vaps_propaganda_desc:0 "Мы буксируем линию при пропаганде антифашизма в нашей стране. Многие противники фашизма — это демократы и коммунисты, но, возможно, их можно убедить поддержать диктатуру в наших совместных усилиях по сдерживанию роста фашизма."
 EST_delay_the_crackdown:0 "Отложить Crackdown"
 EST_delay_the_crackdown_desc:0 "Хотя мы бы предпочли, чтобы с Вейпами разбирались оперативно, мы не можем рисковать, бросая страну в беспорядки, и репрессии должны быть отложены."
 EST_vapsid_takeover:0 "Вапсидное правительство уже управляет страной"
 LAT_perkonkrust_revolt_category:1 "Восстание Перконкруста"
 LAT_perkonkrust_revolt_category_desc:1 "Ультранационалисты, прославляющие балтийские племена и латвийскую этническую принадлежность, перконкрусты представляют собой экзистенциальную угрозу для Латвии, с которой мы боролись. Перконкруст – это инфекция, находящаяся в ранимом национальном очаге, и ее необходимо ликвидировать."
 LAT_perkonkrust_uprising:1 "Восстание в Перконкрусте"
 LAT_perkonkrust_uprising_desc:0 "Со временем «Перконкрусты» получат поддержку по всей стране, и если их не остановить, они будут чувствовать себя смелыми, пытаясь совершить государственный переворот."
 LAT_delay_perkonkrust_decisions:0 "Сражайтесь с перконкрустами"
 LAT_delay_perkonkrust_decisions_desc:0 "Хотя это и не является постоянным решением, мы можем провести некоторые кампании по сокращению фашистской поддержки в нашей стране достаточно долго для того, чтобы так или иначе справиться с перконкрустами."
 LAT_equality_campaigns:0 "Кампании за равенство"
 LAT_equality_campaigns_desc:0 "Пэрконкруст выступает против [Root.GetLeader]Наша миссия — создать Латвию, где солнце одинаково светит над всеми латышами, и поэтому мы должны ясно дать понять, что поддержка их супрематического нарратива противоречит основным ценностям нашей нации."
 LAT_empower_democrats:0 "Расширение прав и возможностей демократов"
 LAT_empower_democrats_desc:0 "Хотя это и нежелательно, демократы являются ярыми противниками перконкрустов и представляют гораздо меньшую угрозу для нашей нации. Это усилит поддержку демократической оппозиции, но мы должны сделать все возможное, чтобы обуздать деятельность «Перконкрустов»."
 LAT_support_loyalists:0 "Интеграция оппозиции"
 LAT_support_loyalists_desc:0 "Аннексируя оппозиционные сектора, мы будем иметь больше возможностей для того, чтобы подтолкнуть перконкрустов к политическим границам нашего общества."
 BALTIC_forest_brother_resistance_cat:0 "Сопротивление лесных братьев"
 BALTIC_forest_brother_resistance_cat_desc:0 "Социализм не был полностью принят всеми в нашей стране, и никто из них не так активен в своем отвращении к новому. [Root.GetNonIdeologyName] чем лесные братья. Острые сторонники [Root.GetAdjective] Лесные братья отвергают всякое иностранное влияние на [Root.GetNonIdeologyName] Они стремятся отстранить коммунистическую партию от власти в пользу более националистического правительства."
 BALTIC_forest_brothers_resistance:0 "Активность сопротивления"
 BALTIC_forest_brothers_resistance_desc:1 "Лесные братья готовятся совершить измену в нашей стране. Мы еще не знаем, что они будут делать, но мы знаем, что это, конечно, будет активно подрывать нашу цель распространения социализма по всей стране."
 POL_purchase_madagascar:0 "Покупка [543.GetName]"
 POL_purchase_madagascar_desc:0 "Мадагаскар - это инопланетный ландшафт, полный флоры и фауны, незнакомый полякам. Хотя многие считают, что это делает остров неприветливым для поляков, некоторые могут рассматривать его как возможность жить в совершенно новом месте. Размер острова и потенциальные сырьевые ресурсы делают его идеальным местом для размещения польского правительства в изгнании."
 POL_purchase_gambia:0 "Покупка [701.GetName]"
 POL_purchase_gambia_desc:0 "Несколько веков назад Курляндское герцогство попыталось колонизировать [701.GetName] От имени Речи Посполитой. Несмотря на хорошие отношения с местными жителями, они были вытеснены иностранными державами. Пришло время это исправить."
 POL_purchase_cheap_colony:0 "Купить регион [FROM.GetName]"
 POL_purchase_cheap_colony_desc:0 "В Польше растет интерес к [FROM.GetName]. Хотя эти интересы находятся вне компетенции правительства, их энтузиазм может быть использован в качестве оправдания для польской покупки региона."
 POL_anti_capitalist_decisions:0 "Антикапиталистическая революция"
 POL_anti_capitalist_decisions_desc:0 "Капитализм — это болезнь на Земле. Хотя многие из этих наций называют себя «демократическими», они лишь порабощают пролетариат в буржуазной демократии, и обязанность любого социалиста — освободить своих товарищей."
 POL_anti_fascist_revolution_category:0 "Антифашистская революция"
 POL_anti_fascist_revolution_category_desc:0 "Фашисты взяли язык борьбы пролетариата против буржуазии, чтобы создать ультранационалистические диктатуры, продолжающие жестокое угнетение рабочего класса. Как социалистическое государство мы должны освободить рабочих мира от террора фашизма."
