 SOV_pressure_country_government_baltic_desc:0 "Мы окажем давление на [FROM.GetAdjective] правительство, чтобы оно приняло политику, лучше соответствующую нашим интересам."
 SOV_promote_ideology_rallies_baltic:0 "Продвигать идеологические митинги в [FROM.GetNameDef]"
 SOV_promote_ideology_rallies_baltic_desc:0 "[ROOT.GetAdjective] агенты проведут политические митинги по всей [FROM.GetNameDef], продвигая [ROOT.GetIdeologyNameWithCaps] среди [FROM.GetAdjective] населения."
 SOV_send_ultimatum_to_country_baltic:0 "Отправить Ультиматум на [FROM.GetNameDef]"
 SOV_send_ultimatum_to_country_baltic_desc:0 "С ультиматумом мы окажем давление на [FROM.GetAdjective] Правительство подчинится нашим требованиям."
 SOV_send_ultimatum_to_baltic_countries:0 "Направить ультиматум странам Балтии"
 SOV_send_ultimatum_to_baltic_countries_desc:0 "Ультиматум позволит оказать давление на правительства стран Балтии и заставить их принять наши требования."
