 SOV_operation_iskra_desc:0 "Начнем подготовку к военной операции по прорыву осады [195.GetName]."
 SOV_operation_iskra_ongoing_objective_tt:0 "Целью этого наступления является слом осады §Y[195.GetName]§!Восстановление связи государства с нашей столицей к моменту окончания миссии."
 SOV_operation_iskra_ongoing_success_effects_tt:0 "Если у нас получится:"
 SOV_operation_iskra_ongoing_failure_effects_tt:0 "\nЕсли мы потерпим неудачу:"
 SOV_operation_iskra_ongoing_success_tt:0 "\n§GМы сломили осаду §YЛенинград§! В настоящее время город связан с нашей столицей.§!"
 SOV_operation_iskra_ongoing_failure_tt:0 "\n§RНам еще предстоит сломить осаду §YЛенинград§!. Город по-прежнему изолирован и окружен врагами.§!"
 SOV_operation_iskra_tt:0 "§Y[195.GetName]§!, §Y[208.GetName]§! и §Y[244.GetName]§!:\nДобавить модификатор: §Y$SOV_soviet_military_offensive$§! (Дивизионная атака): §G+10.0%§!Прорыв: §G+10.00%§! для [ROOT.GetFlag]§Y[ROOT.GetNameDef]§! в государстве)."
 SOV_operation_iskra_activate_decision_tt:0 "\nАктивирует миссию: §YОперация \"Искра\" продолжается§! (Чтобы добиться успеха в этой миссии, мы должны сломать осаду §YЛенинград§! Мы восстановили сухопутные маршруты между городом и нашей столицей к тому времени, когда миссия закончится."
 SOV_the_rush_for_berlin:0 "Стремление к Берлину"
 SOV_the_rush_for_berlin_desc:0 "Очевидно, что наши нынешние союзники в борьбе с [GER.GetAdjective]Они станут нашими главными соперниками после войны. Мы не можем позволить им обыграть нас в гонке за Берлин."
 SOV_raise_penal_units:0 "Поднять штрафные единицы"
 SOV_raise_penal_units_desc:0 "Больше мяса для мясорубки."
 SOV_raise_penal_units_days_tt:0 "Текущими днями являются: [?SOV_penal_units_raised_flag:days|Y0]"
 SOV_great_patriotic_war_flag:0 "Борются ли они с §YВеликая Отечественная война§!"
 SOV_add_borderline_state_to_plot:0 "Заполнитель места: добавить политически пограничное государство к фашистскому заговору"
 SOV_add_borderline_state_to_plot_desc:0 "Заполнитель места: получает государство, которое может отделиться, чтобы присоединиться к вам на вашей территории, когда начнется война."
 SOV_woo_army_officers:0 "Оригинальное название: Recruit a Officer to Fascism"
 SOV_woo_army_officers_desc:0 "Когда вы начнете гражданскую войну, этот офицер может присоединиться к вам и привести некоторые из своих войск."
 SOV_woo_navy_officers:0 "Оригинальное название: Recruit a Officer to Fascism"
 SOV_woo_navy_officers_desc:0 "Когда вы начнете гражданскую войну, этот офицер может присоединиться к вам, но они не приведут войска."
 SOV_noisy_meeting_in_paris:0 "Заполнитель места: шумная встреча в Париже"
 SOV_noisy_meeting_in_paris_desc:0 "Заполнитель места: еще не завершен, заставляет Стална подозрительно относиться к одному из его верных советников"
 SOV_soviet_civil_war_dec_cat:0 "[GetSovietCivilWarName]"
 SOV_soviet_civil_war_dec_cat_desc:1 "Угроза новой гражданской войны нависла над нами. Мы должны подготовиться к худшему и обеспечить контроль как можно большей части страны, так и вооруженных сил. Но мы также должны быть осторожны и избегать привлечения слишком большого внимания. [ROOT.getLeader] Мы можем нажать на свою руку, прежде чем будем готовы."
 SOV_SOS_civil_war_divisions_tt_long:0 "§YПоддержка гражданской войны§!\n§LКрайне важно обеспечить как можно большую поддержку в случае начала гражданской войны, в вооруженных силах и среди населения в целом.\n\n§![GetArmedForcesText]\n\n----\nЕсть один день. §Y20%§! Сталин рискует начать войну, когда паранойя закончится §R90%§!\n----\n[GetCategoryStateText]"
 SOV_opposition_civil_war_divisions_value:0 "[GetArmedForcesData]"
 SOV_SOS_civil_war_divisions_value:0 "[?SOV.SOV_centre_army_support|%Y0]"
 SOV_SOT_civil_war_divisions_value:0 "[?SOV.SOV_left_opposition_army_support|%Y0]"
 SOV_SOB_civil_war_divisions_value:0 "[?SOV.SOV_right_opposition_army_support|%Y0]"
 SOV_SOP_civil_war_divisions_value:0 "[?SOV.SOV_exiles_army_support|%Y0]"
 SOV_SOS_civil_war_divisions_tt:0 "Если бы сейчас началась гражданская война, [?SOV.SOV_centre_army_support|%Y0] Армейцы, [?SOV.SOV_centre_navy_support|%Y0] Военно-морского флота, и [?SOV.SOV_centre_air_support|%Y0] Военно-воздушные силы останутся верными [SOV.GetLeader].\n----\nЕсть один день. §Y20%§! Сталин рискует начать войну, когда паранойя закончится §R90%§!\n"
 SOV_SOT_civil_war_divisions_tt:0 "Поддержка армии: [?SOV.SOV_left_opposition_army_support|%Y0] \nПоддержка военно-морского флота: [?SOV.SOV_left_opposition_navy_support|%Y0] \nПоддержка военно-воздушных сил: [?SOV.SOV_left_opposition_air_support|%Y0] \n\nНародная поддержка: [?SOV_opposition_popular_support|Y1]§Y%§!\n (Народная поддержка влияет на [FROM.GetLeader]уровень капитуляции и добавлены партизанские отряды во время войны"
 SOV_SOB_civil_war_divisions_tt:0 "Поддержка армии: [?SOV.SOV_right_opposition_army_support|%Y0] \nПоддержка военно-морского флота: [?SOV.SOV_right_opposition_navy_support|%Y0] \nПоддержка военно-воздушных сил: [?SOV.SOV_right_opposition_air_support|%Y0] \n\nНародная поддержка: [?SOV_opposition_popular_support|Y1]§Y%§!\n (Народная поддержка влияет на [FROM.GetLeader]уровень капитуляции и добавлены партизанские отряды во время войны"
 SOV_SOP_civil_war_divisions_tt:0 "Поддержка армии: [?SOV.SOV_exiles_army_support|%Y0] \nПоддержка военно-морского флота: [?SOV.SOV_exiles_navy_support|%Y0] \nПоддержка военно-воздушных сил: [?SOV.SOV_exiles_air_support|%Y0] \n\nНародная поддержка: [?SOV_opposition_popular_support|Y1]§Y%§!\n (Народная поддержка влияет на [FROM.GetLeader]уровень капитуляции и добавлены партизанские отряды во время войны"
 SOV_select_headquarters_text:1 "Выберите базу для вашего восстания, нажав на значок штаб-квартиры на карте: \n\n£select_headquarters_texticon"
 SOV_select_state_text:1 "Размещайте новые ячейки, чтобы расширить инфуэнтность, на карте:\n\n £infiltrate_state_texticon\n\n"
 SOV_opposition_army_support_non_existant:0 "§RПочти несуществующий§!"
 SOV_opposition_army_support_very_low:0 "§RОчень низко§!"
 SOV_opposition_army_support_low:0 "§Yнизкий§!"
 SOV_opposition_army_support_medium:0 "§Yсредний§!"
 SOV_opposition_army_support_high:0 "§GВысокое§!"
 SOV_expand_nkvd_opposition:0 "Расширение военного отделения НКВД"
 SOV_expand_nkvd_opposition_desc:1 "Надо воспользоваться возможностью расширить Военную ветвь НКВД. Эти войска могут быть очень полезны для обеспечения нашей будущей победы."
 SOV_expand_nkvd_opposition_tt:0 "Добавлено 5 дивизионов НКВД, которые останутся лояльными, когда [GetSovietCivilWarName] Начинается."
 SOV_nkvd_cd_tt:0 "\nЭто решение будет вновь доступно в §Y120 дней§!."
 SOV_influence_army_opposition:0 "Увеличение поддержки армии"
 SOV_influence_army_opposition_desc:1 "Проникнув в армию, мы можем теперь начать находить офицеров и рядовых более низкого ранга, которые сочувствуют нашему делу, и убедиться, что они присоединятся к нашей стороне, если начнется война."
 SOV_influence_army_opposition_tt:0 "Поддержка армии увеличивается"
 SOV_influence_cd_tt:0 "\nЭто решение будет вновь доступно в §Y60 дней§!."
 SOV_influence_army_opposition_level_tt:0 "Поддержка в армии меньше, чем §Y70%§!"
 SOV_influence_navy_opposition:1 "Увеличение поддержки флота"
 SOV_influence_navy_opposition_desc:1 "Военно-морской флот может быть не очень полезен в гражданской войне, но они все еще могут помочь нам занять ключевые места и обеспечить нас поставками. Так что стоило бы обеспечить лояльность ряда капитанов. Кроме того, наличие флота после войны открывает перед нами новые двери на международной арене."
 SOV_influence_navy_opposition_tt:0 "Поддержка флота увеличивается"
 SOV_influence_navy_opposition_level_tt:0 "В военно-морском флоте это меньше, чем §Y70%§!"
 SOV_influence_airforce_opposition:1 "Увеличение поддержки ВВС"
 SOV_influence_airforce_opposition_desc:1 "Используя наши связи в вооруженных силах, мы сможем найти флотов и командиров авиации, сочувствующих нашему делу. Наличие военно-воздушных сил на нашей стороне, несомненно, сделает войну намного более легкой задачей."
 SOV_influence_airforce_opposition_tt:0 "Расширяется поддержка ВВС"
 SOV_influence_air_opposition_level_tt:0 "Поддержка в военно-воздушных силах меньше §Y70%§!"
 SOV_recruit_general_opposition:0 "Наймите генерала для вашего дела"
 SOV_recruit_general_opposition_desc:1 "Мы должны использовать наши связи внутри Красной Армии, чтобы попытаться убедить высокопоставленных офицеров присоединиться к нашей стороне в случае гражданской войны."
 SOV_recruit_general_opposition_tt:0 "Один генерал или фельдмаршал становится верным нашему делу."
 SOV_recruit_admiral_opposition:0 "Наймите адмирала для своего дела"
 SOV_recruit_admiral_opposition_desc:1 "Мы должны использовать наши связи внутри Красного флота, чтобы попытаться убедить высокопоставленных офицеров присоединиться к нашей стороне в случае гражданской войны."
 SOV_recruit_admiral_opposition_tt:0 "Адмирал становится верным нашему делу."
 SOV_recruit_cd_tt:0 "\nЭто решение будет вновь доступно в §Y30 дней§!."
 SOV_army_framejob:0 "Обрамление армейского офицера"
 SOV_army_framejob_desc:0 "Распространяя слухи о генералах, лояльных [ROOT.GetLeader]И, поместив в руки НКВД какие-то поддельные «доказательства», мы сможем на время отвлечь от себя внимание. В качестве бонусного эффекта, если нам повезет, другие армейские кадры могут быть недовольны репрессивными действиями."
 SOV_army_framejob_tt:0 "Один генерал или фельдмаршал будет обвинен в измене."
 SOV_army_framejob_cd_tt:0 "\nЭто решение будет вновь доступно в §Y[?SOV_army_framejob_decision_re_enable_days_display] дни§!."
 SOV_navy_framejob:0 "Обрамление адмирала"
 SOV_navy_framejob_desc:0 "Распространение слухов о верных адмиралах [ROOT.GetLeader]И, поместив в руки НКВД какие-то поддельные «доказательства», мы сможем на время отвлечь от себя внимание. В качестве бонусного эффекта, если нам повезет, другие военно-морские силы могут быть недовольны репрессивными действиями."
 SOV_navy_framejob_tt:0 "Один адмирал будет обвинен в измене."
 SOV_navy_framejob_cd_tt:0 "\nЭто решение будет вновь доступно в §Y[?SOV_navy_framejob_decision_re_enable_days_display] дни§!."
 SOV_plan_start_of_uprising_archangelsk:1 "Создать секретный штаб в [FROM.GetName]."
 SOV_plan_start_of_uprising_archangelsk_desc:1 "Северный регион имеет выход в порты и находится относительно близко к Москве, что делает его хорошей базой. Тем не менее, у него плохая внутренняя ифраструктура и низкое развитие, поэтому вести войну отсюда будет несколько трудно, если не будет сделано что-то для облегчения этого."
 SOV_plan_start_of_uprising_odessa:1 "Создать секретный штаб в [FROM.GetName]."
 SOV_plan_start_of_uprising_odessa_desc:1 "Украина является хорошей базой для восстания. Это богатый регион с большими городами, хорошими портами и инфраструктурой. Однако это также означает, что конвертировать государства в наше дело будет сложнее, чем в менее развитых регионах. [SOV.GetNameDef]."
 SOV_plan_start_of_uprising_chita:1 "Создать секретный штаб в [FROM.GetName]."
 SOV_plan_start_of_uprising_chita_desc:1 "Сибирь традиционно является антисталинской и антибольшевистской опорой. Регион может быть слаборазвитым, но он должен быть относительно легким для завоевания нашего дела."
 SOV_plan_start_of_uprising_omsk:1 "Создать секретный штаб в [FROM.GetName]."
 SOV_plan_start_of_uprising_omsk_desc:1 "Омск хорошо расположен в Западной Сибири, также граничит с Уральским регионом и Великой степью. Хотя и слаборазвитая, но относительно легко построить здесь хорошую прочную базу для восстания, а затем начать поход на Москву."
 SOV_plan_start_of_uprising_tashkent:1 "Создать секретный штаб в [FROM.GetName]."
 SOV_plan_start_of_uprising_tashkent_desc:1 "Строительство нашей базы в Великой степи означает безопасность наших спин. Это будет означать долгий марш к Москве, но большая часть боевых действий будет на нашем фронте. Кроме того, получить поддержку в этом регионе должно быть относительно легко."
 SOV_plan_start_of_uprising_ufa:1 "Создать секретный штаб в [FROM.GetName]."
 SOV_plan_start_of_uprising_ufa_desc:1 "Преимущество Урала состоит в том, что его легко защищать, и размещение здесь нашей базы также позволяет нам распространить наше влияние как на Сибирь, так и на Северный регион, а также вниз на юг в район Великой степи, предоставляя нам множество различных вариантов."
 SOV_align_state_in_process:1 "В настоящее время проникает в государство"
 SOV_planning_uprising_in_state:1 "проникать [FROM.GetName]"
 SOV_planning_uprising_in_siberia:1 "§Wпроникать§! [FROM.GetName] §Wв§! Сибирь"
 SOV_planning_uprising_in_far_east:0 "§Wпроникать§! [FROM.GetName] §Wв§! Российский Дальний Восток"
 SOV_planning_uprising_in_urals:1 "§Wпроникать§! [FROM.GetName] §Wв§! Урал"
 SOV_planning_uprising_in_northern:1 "§Wпроникать§! [FROM.GetName] §Wв§! Северные области"
 SOV_planning_uprising_in_ukraine:1 "§Wпроникать§! [FROM.GetName] §Wв§! Украина"
 SOV_align_states_steppe:0 "§Wпроникать§! [FROM.GetName] §Wв§! Степной регион"
 SOV_set_civil_war_state_tt:0 "Оппозиционная ячейка, созданная в [FROM.GetName]обеспечение лояльности государства в случае гражданской войны."
 SOV_start_infiltrating_state_tt:0 "Работа по созданию клетки в [FROM.GetName] начинать"
 SOV_sabotage_behind_enemy_lines_decision:0 "Саботаж в тылу врага"
 SOV_sabotage_behind_enemy_lines_decision_desc:0 "Лояльные партизаны, действующие за линией фронта противника, могут быть использованы для подрыва коммуникаций противника. [FROM.Getname]. Удары по командным пунктам, перерезание телеграфных проводов или снос поездов делают противника менее подготовленным к отражению атак наших подразделений и повышают шансы на успешное освобождение России."
 SOV_sabotage_behind_enemy_lines_decision_tt:0 "§YВражеские отряды§! понести ущерб §Yорганизация§!"
 sabotage_behind_enemy_lines_flag:0 "Подготовка диверсионной акции"
 SOV_dismiss_the_counter_revolution:0 "Откажитесь от контрреволюции"
 SOV_dismiss_the_counter_revolution_desc:1 "Публично осуждая любые разговоры о контрреволюции, мы должны уметь отвлечь внимание НКВД от наших агентов. Однако это также может означать, что мы потеряем некоторых сторонников, которые верят в ложное увольнение."
 SOV_dismiss_the_counter_revolution_tt:1 "Уменьшает политическую паранойю в ущерб будущей стабильности и сокращает военную поддержку."
 SOV_dismiss_cd_tt:0 "\nЭто решение будет вновь доступно в §Y60 дней§!."
 SOV_is_opposition_state_tt:1 "Оппозиционная ячейка существует в государстве"
 SOV_is_unaligned_state_tt:0 "Государство неприсоединилось"
 SOV_is_opposition_tt:0 "Оппозиция"
 SOV_has_crackdown_tt:0 "Репрессии продолжаются"
 SOV_soviet_civil_war_not_started_tt:0 "Советская гражданская война не началась"
 SOV_has_selected_hq_tt:0 "Создал секретный штаб"
 SOV_concessions_japan_vladivostok_SCW:0 "Предложите Владивосток Японии"
 SOV_concessions_japan_vladivostok_SCW_desc:0 "Японские военные всегда жаждали Владивостока. Таким образом, они должны быть склонны помогать нам экспедиционными силами, если мы будем использовать будущую собственность на этот район в качестве козыря."
 SOV_concessions_japan_vladivostok_SCW_accept:0 "Если принято, [JAP.GetNameDef] Они будут снабжать подразделения, которые борются с [GetSovietOppositionName] Во время войны.[JAP.GetNameDefCap] Владивосток получит контроль в конце войны."
 SOV_not_has_conflict_with_japan:0 "§Y[ROOT.GetNameWithFlag]§!Нет продолжающегося конфликта с §Y[JAP.GetNameWithFlag]§!"
 SOV_CSW_transfer_vladivostok_flag:0 "§YВладивосток§! концессия"
 SOV_concessions_japan_sakhalin_SCW:0 "Сахалин за оружие"
 SOV_concessions_japan_sakhalin_SCW_desc:1 "Восстание нуждается в оружии. Может быть, японцы будут готовы дать нам что-то, если мы покажем, что мы готовы отдать им остальную часть Сахалина."
 SOV_concessions_japan_sakhalin_SCW_accept:0 "Если принять, то [GetSovietOppositionName] получать [JAP.GetAdjective] Оружие, винтовки и, возможно, бойцы, когда начнется война.[JAP.GetNameDefCap] Северный Сахалин получит контроль в конце войны."
 SOV_CSW_transfer_sakhalin_flag:0 "§YСеверный Сахалин§! концессия"
 SOV_concessions_germany_baku_SCW:1 "Нефтяные права Баку на военное строительство"
 SOV_concessions_germany_baku_SCW_desc:1 "[GER.GetNameDefCap] Они отчаянно нуждаются в нефти для собственного военного строительства. Пообещав им эксклюзивные права на наши нефтяные месторождения после войны, они должны быть более чем готовы помочь нам."
 SOV_concessions_germany_baku_SCW_accept:0 "Если принято, [GER.GetNameDef] Начнется строительство военных заводов в [?SOV.SOV_civil_war_start_state.GetName]. The [GetSovietOppositionName] получать [GER.GetAdjective] танков и винтовок.[GER.GetNameDefCAP] Получить права на ресурсы для [229.GetName] В конце войны."
 SOV_CSW_baku_oil_flag:0 "Концессия Бакинских нефтяных месторождений"
 SOV_CSW_german_generals_flag:0 "Немецкие военные советники"
 SOV_concessions_germany_ukraininan_oil_SCW:1 "Немецкое украинское восстание"
 SOV_concessions_germany_ukraininan_oil_SCW_desc:1 "Хотя потерять Украину было бы плохо, они могли бы стать ценным союзником в войне против сталинистов. Германия может тайно обучить украинское ополчение, а затем украинские повстанцы могут начать внезапную атаку, когда будут готовы."
 SOV_concessions_germany_ukraininan_oil_SCW_accept:0 "Если принято, [GER.GetNameDef] Обучит украинские подразделения, которые приготовят восстание.[GER.GetNameDefCAP] Получение Ресурсных прав на украинскую территорию в конце войны."
 SOV_concessions_uk_belarus_SCW:1 "BLR в обмен на британскую поддержку"
 SOV_concessions_uk_belarus_SCW_desc:1 "The [ENG.GetAdjective] Правительство симпатизирует [BLR.GetAdjective] Правительство в изгнании призывает к независимости. Если мы пообещаем им отпустить [BLR.GetNameDef] После войны они наверняка захотят снабдить нас оружием."
 SOV_concessions_uk_belarus_SCW_accept:0 "Если принято, [ENG.GetNameDef] Начнется строительство военных заводов в [?SOV.SOV_civil_war_start_state.GetName]. [BLR.GetNameDefCAP] В конце войны он становится независимым."
