 POL_escelate_the_strike_desc:0 "Отладка решения о быстром продвижении Крестьянской стачки на один этап. Это решение не должно быть видимым, если режим отладки не активен."
 POL_expand_strikes_to_factories:0 "Расширяем забастовки на заводах"
