 POL_fight_against_monarchy_in_LIT_cat:0 "Борьба с иностранным истцом"
 POL_fight_against_monarchy_in_LIT_cat_desc:1 "Иностранный агент пытается доказать, что [Root.GetAdjective] трона путем поиска внутренней поддержки в нашем правительстве. Если мы сможем сохранить популярность и внутреннюю поддержку на низком уровне, мы сможем полностью свести на нет вопрос об их претензии.\n\nНынешняя сила претензии - это [Root.GetPolRoyalClaimStrength]"
