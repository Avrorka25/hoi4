 SOV_military_offensive_current_scope_negihbors_tt:0 "\nВторичные цели (негихборы):"
 SOV_military_offensive_activate_decision_tt:0 "\nАктивирует миссию: §YВоенное наступление в [FROM.GetName] Продолжающийся§! (Для того чтобы добиться успеха в этой миссии, нам необходимо будет контролировать главную цель, §Y[FROM.GetName]§! Все соседние государства, которые в настоящее время находятся под контролем противника. Контролирование только главной цели не позволит нам понести какие-либо наказания за провал миссии."
