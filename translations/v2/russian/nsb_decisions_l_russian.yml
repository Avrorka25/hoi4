 SOV_paranoia_system:0 "Политическая паранойя"
 SOV_paranoia_system_desc:0 "Атмосфера подозрительности и недоверия висит над [ROOT.GetNameDef]. [ROOT.GetLeader]Опасения по поводу фракционности внутри партии растут по мере того, как НКВД расследует бесчисленные обвинения и предполагаемые акты саботажа, обломков и шпионажа."
 SOV_paranoia_bg_tooltip:0 "Если £SOV_paranoia_text_icon §Yпаранойя§! стоимость увеличивается по сравнению с §Y25§!Случайные события чистки могут произойти.\nЧем выше, тем £SOV_paranoia_text_icon §Yпаранойя§!И чем больше дней было так высоко, тем больше вероятность того, что произойдет чистка.\nЕсли £SOV_paranoia_text_icon §Yпаранойя§! стоимость увеличивается по сравнению с §R75§!Могут произойти великие события очищения.\n\nопределенный §Yфокус§!, §Yрешение§! и §Yпоследствия§! будет производить £SOV_paranoia_text_icon §Yпаранойя§! Немедленно увеличивайте/уменьшайте, и некоторые черты советника и лидера страны будут медленно увеличиваться. §Yпаранойя§! Со временем.\n\nЗавершение фокуса §Y[GetAppropriateLastPurgeFocusName]§! будет удалять £SOV_paranoia_text_icon §Yпаранойя§! система."
