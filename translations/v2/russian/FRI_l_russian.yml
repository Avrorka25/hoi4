 FRI_support_vichy:0 "Поддержана Вишистская Франция"
 VIN_independence_war:0 "Война за независимость"
 VIN_independence_war_desc:0 "Наконец настало время изгнать [FRA.GetAdjective] колонизаторов, которые никогда не прекращали эксплуатацию нашей прекрасной страны. Перед лицом решающей борьбы все силы независимости согласились сотрудничать в мобилизации населения.\nОднако большинство солдат не замечает, что внутренние противоречия между различными фракциями сохраняются. Если их не удастся разрешить на поле боя, они будут решены за его пределами.\n\nЗа будущее независимого Вьетнама борются четыре фракции. §YВьетминь§! под руководством Хо Ши Мина стремится создать систему, близкую к сталинистскому Советскому Союзу; §Y«Ля Лютт»§! — объединение троцкистов, желающих воплотить политическую теорию советского изгнанника; §YVNQDD§!, выступающая за демократическую форму социализма и гораздо более склонная к классическому демократическому строю; и, наконец, сторонники §YКыонг Де§!, члена королевской семьи и законного наследника вьетнамского престола, которого также поддерживает религия каодай.\n\nВлияние §YВьетминя§!: [Root.GetVietMinhInfluence]\n\nВлияние §Y«Ля Лютт»§!: [Root.GetLaLutteInfluence]\n\nВлияние §YVNQDD§!: [Root.GetVNQDDInfluence]\n\nВлияние §YКыонг Де§!: [Root.GetCuongDeInfluence]"
