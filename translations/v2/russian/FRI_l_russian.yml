 distribute_foundations_of_leninism:0 "Распространять «Основы ленинизма»"
 distribute_foundations_of_leninism_desc:0 "«Основы ленинизма» — книга Иосифа Сталина, написанная в 1924 году. Она состоит из девяти лекций, прочитанных Сталиным в Свердловском университете в 1924 году и опубликованных советской газетой «Правда». Распространение сталинистских идеалов среди нашего народа позволит указать ему путь к марксизму-ленинизму."
 distribute_lessons_of_october:0 "Распространять «Уроки Октября»"
 distribute_lessons_of_october_desc:0 "«Уроки Октября» — спорное эссе Льва Троцкого, опубликованное в 1924 году и резко критикующее преемников Ленина. Зарубежные троцкистские контакты передали нам экземпляры книги и материалы для её массовой печати. Распространение идей Троцкого через просвещение — лучший способ заручиться народной поддержкой перманентной революции."
 arm_caodaists_militias:0 "Вооружить ополчение каодаистов"
 arm_caodaists_militias_desc:0 "Каодай — религия, возникшая в Кохинхине в 1926 году, сочетающая западные и азиатские верования и насчитывающая несколько сотен тысяч последователей по всему Вьетнаму. Она быстро сосредоточилась на независимости и борьбе против [FRA.GetNameDef], что вызвало репрессии властей. Мобилизовав наиболее фанатичные батальоны каодаистов, мы пополним ряды солдатами, чья преданность делу независимости не вызывает сомнений."
 arm_caodaists_militias_tt:0 "§YДве дивизии ополчения появятся возле Сайгона§!\n"
 form_the_vnqdd_youth_league:0 "Создать Молодёжную лигу VNQDD"
 assassinate_communists_officers:0 "Убить коммунистических офицеров"
 black_ocean_society_support:0 "Поддержка Общества Чёрного океана"
 promote_ngo_dinh_diem_as_general:0 "Произвести Нго Динь Зьема в генералы"
 ngo_dinh_diem_tooltip:0 "§YНго Динь Зьем§! становится генералом."
 invite_phan_boi_chau_to_the_government:0 "Пригласить Фан Бой Тяу в правительство"
 FRI_inevitable_uprising_3:0 "Неизбежный конец"
 FRI_inevitable_uprising_3_desc:0 "После мятежа в Йенбае любому разумному французскому чиновнику стало ясно, что контроль над [FRI.GetNameDef] однажды закончится. Произойдёт ли это на следующей неделе или через десятилетие, зависит от постоянно меняющейся внутренней политики колонии. Пока наша задача — сохранять стабильность и удерживать регион под [FRA.GetAdjective] контролем."
 frenchindochina.1.t:0 "Жюль Бревье назначен генерал-губернатором"
 frenchindochina.1.d:0 "Жюль Бревье, бывший губернатор Французской Западной Африки, был назначен правительством [FRA.GetRulingParty] генерал-губернатором Индокитая вместо Рене Робена.\nБудучи гуманистом и либералом, Бревье уделяет большое внимание подходу к колонизации, который называет «научным»: глубокому изучению культур коренных народов и улучшению условий их жизни. Во время Великой депрессии во Французской Африке он провёл множество социальных реформ, субсидировал сенегальских рабочих и создавал программы увеличения производства продовольствия.\nПобеда Народного фронта на [FRA.GetAdjective] выборах породила большие надежды, особенно среди вьетнамцев. Министром колоний стал Мариус Муте, ранее выступавший против репрессий после мятежа в Йенбае, а правительство возглавил Леон Блюм, также решительно осуждавший колониальные репрессии.\nБревье планирует провести социальные реформы, подобные тем, которые он осуществлял в Африке и которые были введены в метрополии."
 frenchindochina.1.a:0 "Посмотрим, что принесёт его научный подход."
 french_indochina_jules_brevie_governor_event_tt:0 "Открывает §Yполитическую ветвь§!."
 frenchindochina.2.t:0 "Забастовки 1936 года"
 frenchindochina.2.d:0 "В июне в [FRI.GetNameDef] началось крупное забастовочное движение, вызванное ростом цен и падением заработной платы, от которого рабочие страдают уже несколько лет. Было зафиксировано более 300 выступлений с участием сотен тысяч людей. Протесты охватили даже сельскую местность: плантации оказались парализованы, а крестьяне выступили против налогов. В результате экономика внезапно остановилась, а сепаратистские движения воспользовались ситуацией, чтобы набрать популярность и распространять идеи независимости среди населения."
 frenchindochina.2.a:0 "Необходимо найти решение, и как можно скорее!"
 r56.news_event.15.t:0 "Вьетнамское восстание в [FRI.GetNameDef]"
 r56.news_event.15.d:0 "Забастовки уже несколько месяцев парализовали всю [FRI.GetNameDef], а неспособность правительства отреагировать вызвала резкий рост стремления к независимости. Перелом наступил, когда солдаты Туземной гвардии подняли мятеж в Йенбае.\n\nВсего за несколько часов он перерос во всеобщее восстание, охватившее весь Вьетнам.\nМногочисленные силы сторонников независимости укрепили контроль над севером страны, а на юге колониальное правительство готовится к контрнаступлению против крупнейшего антиколониального восстания в истории [FRI.GetNameDef]."
 r56.news_event.15.a:0 "Яростный удар по колониализму."
 r56.news_event.15.b:0 "Мы восстановим порядок в [FRI.GetNameDef]."
 r56.news_event.15.c:0 "Мы изгоним империалистов!"
 frenchindochina.4.t:0 "[FRI.GetAdjective] дилемма"
 frenchindochina.4.d:0 "Пока [GER.GetAdjective] войска оккупировали Париж, было создано новое правительство во главе с маршалом Петеном. Оно объявило себя законной французской властью и начало сотрудничество с [GER.GetNameDef].\nОднако из Лондона генерал де Голль призвал к сопротивлению и продолжению борьбы против [GER.GetNameDef], считая правительство Виши предательским.\nНекоторые колонии уже перешли на сторону де Голля, но [FRI.GetNameDef] формально всё ещё подчиняется правительству метрополии. Учитывая сомнительную легитимность последнего, мы вполне можем поддержать войска генерала и сыграть решающую роль в снабжении сил Свободной Франции ресурсами."
 frenchindochina.4.a:0 "Поддержать Виши и назначить Жана Деку генерал-губернатором."
 FRI_fascist_gouvernorat_general_party_long:0 "Генерал-губернаторство"
 frenchindochina.4.b:0 "Поддержать Свободную Францию и назначить Тьерри д'Аржанльё генерал-губернатором."
 frenchindochina.5.t:0 "[FRI.GetNameDefCap] просит дополнительные войска"
 frenchindochina.5.d:0 "Наблюдая за развитием войны и опасаясь за безопасность колонии, генерал-губернатор Индокитая направил правительству просьбу прислать дополнительные войска и снаряжение.\nПодобные материальные вложения нельзя делать необдуманно. Однако [FRI.GetNameDef] — одна из самых ценных и богатых ресурсами колоний [FRA.GetNameDef]. Следует решить, оправдывает ли её защита сокращение наших сил в Европе."
 frenchindochina.5.a:0 "Мы должны усилить защиту [FRI.GetNameDef]!"
 frenchindochina.5.b:0 "Мы не можем позволить себе отправить им больше войск."
 frenchindochina.6.t:0 "[FRA.GetNameDefCap] отправляет нам войска и снаряжение"
 frenchindochina.6.d:0 "[FRA.GetAdjective] правительство согласилось направить войска и снаряжение для укрепления обороны [FRI.GetNameDef].\nОни только что прибыли через порты Ханоя и Сайгона и теперь перешли под местное командование."
 frenchindochina.6.a:0 "Превосходно!"
 frenchindochina.7.t:0 "[FRA.GetNameDefCap] отказывается отправлять войска"
 frenchindochina.7.d:0 "Ссылаясь на положение метрополии и заявив, что как можно больше войск должно находиться под её непосредственным командованием, правительство в Париже отказалось отправить запрошенное количество сил."
 frenchindochina.7.a:0 "Нам придётся довольствоваться тем, что есть."
 frenchindochina.8.t:0 "Вьетнамское восстание"
 frenchindochina.8.d:0 "Забастовки уже несколько месяцев парализовали всю [FRI.GetNameDef], а неспособность правительства отреагировать вызвала резкий рост стремления к независимости. Перелом наступил, когда солдаты Туземной гвардии подняли мятеж в Йенбае.\n\nВсего за несколько часов он перерос во всеобщее восстание, охватившее весь Вьетнам.\nМногочисленные силы сторонников независимости укрепили контроль над севером страны, а на юге колониальное правительство готовится к контрнаступлению против крупнейшего антифранцузского восстания в истории Индокитая."
 frenchindochina.8.a:0 "Мы победим!"
 FRI_expand_the_michelin_plantations:0 "Расширить плантации Michelin"
 FRI_expand_the_michelin_plantations_desc:0 "Политика сельскохозяйственных концессий, введённая бывшим генерал-губернатором Жан-Мари де Ланессаном, привела к освоению более 400 000 гектаров. Она привлекла несколько промышленных групп, включая Michelin, которая приобрела первые три каучуковые плантации в 1928 году. С тех пор компания стала одним из крупнейших землевладельцев Индокитая."
 FRI_finish_the_transindochinois:0 "Завершить Трансиндокитайскую железную дорогу"
 FRI_finish_the_transindochinois_desc:0 "Трансиндокитайская железная дорога должна соединить Ханой и Сайгон. Строительство началось в 1905 году, и линия вводилась в эксплуатацию поэтапно. Пора закончить последние километры и наконец связать весь Вьетнам единой железной дорогой."
 FRI_open_the_lycee_sisowath:0 "Открыть лицей Сисоват"
 FRI_open_the_lycee_sisowath_desc:0 "Распространение образования в Камбодже и Лаосе шло значительно медленнее, чем во Вьетнаме. Первая камбоджийская средняя школа была открыта в 1893 году под названием «Колледж протектората», однако полноценного среднего образования, сравнимого с французским лицеем в Сайгоне, всё ещё нет. Его развитие повысит эффективность туземной администрации."
 FRI_continue_the_politique_politique_du_paysannat:0 "Продолжить политику поддержки крестьянства"
 FRI_continue_the_politique_politique_du_paysannat_desc:0 "Политика поддержки крестьянства направлена на возрождение сельского хозяйства [FRI.GetNameDef]. Она предусматривает помощь землевладельцам, переселение крестьян с перенаселённых северных земель в дельту Меконга и крупную гидротехническую программу, которая позволит систематически получать двойной урожай."
 FRI_hlm_construction_program:0 "Программа строительства социального жилья"
 FRI_hlm_construction_program_desc:0 "Городские рабочие часто вынуждены жить в примитивных или даже опасных условиях — в соломенных хижинах либо прямо на рабочих местах, что приводит к тяжёлой санитарной обстановке. Для решения проблемы власти начали программу дешёвого жилья, призванную повысить качество жизни в городах Тонкина."
 FRI_link_laos_to_annam:0 "Соединить Лаос с Аннамом"
 FRI_link_laos_to_annam_desc:0 "Лаос — самый запущенный регион с точки зрения инфраструктуры: здесь лишь около десяти километров асфальтированных дорог. Мы построим шоссе к побережью Аннама с переправой через Меконг, чтобы улучшить связь с остальными владениями."
 FRI_tonkin_cement_factories:0 "Цементные заводы Тонкина"
 FRI_tonkin_cement_factories_desc:0 "Кохинхина и Тонкин — наиболее динамичные в экономическом отношении регионы [FRI.getNameDef]. Помимо многочисленных шахт, Тонкин известен производством цемента. Финансовая поддержка соответствующих компаний позволит увеличить экспорт."
 FRI_explore_the_laotian_underground:0 "Исследовать недра Лаоса"
 FRI_explore_the_laotian_underground_desc:0 "Экономика Лаоса всё ещё развита слабо, но расширение инфраструктуры позволит начать добычу олова."
 FRI_expand_the_laotian_distilleries:0 "Расширить лаосские винокурни"
 FRI_expand_the_laotian_distilleries_desc:0 "Отличным способом расширить экономику Лаоса станет увеличение числа винокурен, производящих рисовый алкоголь для продажи на азиатском рынке."
 FRI_balanced_economic_developement:0 "Сбалансированное экономическое развитие"
 FRI_balanced_economic_development:0 "Сбалансированное экономическое развитие"
 FRI_balanced_economic_development_desc:0 "Чрезмерное значение вьетнамских регионов для экономики [FRI.GetNameDef] может оказаться опасным на фоне роста националистических движений. Необходимо уравнять экономическую мощь Лаоса и Камбоджи, которые гораздо лояльнее [FRA.GetNameDef]."
 PRI_continue_the_focus_on_vietnam:0 "Продолжить уделять основное внимание Вьетнаму"
 PRI_continue_the_focus_on_vietnam_desc:0 "Вьетнам остаётся самым процветающим регионом [FRI.GetNameDef] благодаря гораздо более удобным для земледелия территориям. Здесь уже существует множество малых предприятий, поэтому развитие тяжёлой промышленности не составит большого труда."
 FRI_move_vietnamese_workers_to_laos:0 "Переселить вьетнамских рабочих в Лаос"
 FRI_move_vietnamese_workers_to_laos_desc:0 "Вьетнамцы уже составляют высокий и средний уровень бюрократии в Лаосе. Поощряя вьетнамских рабочих селиться в таких городах, как Вьентьян или Тахек, мы увеличим количество квалифицированной рабочей силы, имеющейся в этом регионе."
 FRI_expand_the_opium_trade:0 "Расширить торговлю опиумом"
 FRI_expand_the_opium_trade_desc:0 "Хотя во Франции выращивание и торговля опиумом запрещены, они всегда приносили огромную прибыль экономике Индокитая. Вероятно, хаос в Китае позволит увеличить экспорт этого растения."
 FRI_increase_the_taxes:0 "Повысить налоги"
 FRI_increase_the_taxes_desc:0 "Проект развития столь отсталых регионов, как Камбоджа и Лаос, требует значительного бюджета, а выгода появится лишь спустя время. Первым способом собрать необходимые средства станет повышение налогов для местного населения."
 FRI_vietnamese_private_armament_business:0 "Частный вьетнамский оружейный бизнес"
 FRI_vietnamese_private_armament_business_desc:0 "С годами вьетнамские малые и средние частные предприятия продолжали расти. Оружейная отрасль показала себя особенно успешной, и финансовая поддержка частных оружейных компаний со стороны администрации может оказаться очень прибыльной."
 FRI_open_the_university_of_phnom_penh:0 "Открыть Университет Пномпеня"
 FRI_open_the_university_of_vientiane:0 "Открыть Французский университет Вьентьяна"
 FRI_open_the_university_of_vientiane_desc:0 "Как и в соседней Камбодже, образование в Лаосе развито слабо, а неграмотность превышает 80%. Из-за этого ощущается нехватка квалифицированных кадров для административных должностей. Учреждение высшей школы увеличит число подходящих выпускников."
 FRI_build_the_phnom_penh_arsenal:0 "Построить арсенал Пномпеня"
 FRI_build_the_phnom_penh_arsenal_desc:0 "Производство стрелкового оружия в [FRI.GetNameDef] сравнительно невелико из-за поставок снаряжения из метрополии. Однако создание военно-промышленного комплекса в слаборазвитой Камбодже может оказаться крайне прибыльным, значительно повысив её экономический потенциал и позволив экспортировать оружие на те же рынки, куда мы продаём рис."
 FRI_expand_the_tungsten_mines:0 "Расширить вольфрамовые шахты"
 FRI_expand_the_tungsten_mines_desc:0 "Вьетнамские недра богаты полезными ископаемыми, включая вольфрам. Рост мирового спроса на вооружения делает этот ресурс всё более востребованным, поэтому нам выгодно расширить уже существующие шахты."
 FRI_invite_investors_to_kouang_tcheou_wan:0 "Пригласить инвесторов в Гуанчжоувань"
 FRI_invite_investors_to_kouang_tcheou_wan_desc:0 "Экономика Гуанчжоуваня развита сравнительно слабо, а население живёт главным образом сельским хозяйством. Однако спокойствие города привлекает множество китайских инвесторов, и при достаточном финансировании мы надеемся со временем превратить его в новый Гонконг."
 FRI_the_indochinese_merchant_marine:0 "[FRI.GetAdjective] торговый флот"
 FRI_the_indochinese_merchant_marine_desc:0 "Наш флот состоит главным образом из торговых судов, действующих по всей Азии. Развитие производства таких кораблей позволит ускорить перевозку товаров."
 FRI_expand_the_fort_bayard_infrastructures:0 "Расширить инфраструктуру Форт-Баяра"
 FRI_expand_the_fort_bayard_infrastructures_desc:0 "Транспортный поток через Форт-Баяр оказался значительно ниже ожиданий, отчасти из-за удалённости от главных морских торговых путей. Мы можем стимулировать экономику города развитием инфраструктуры и связать его с остальным Южным Китаем, компенсируя недостаток внешней торговли."
 FRI_the_french_hong_kong:0 "[FRA.GetAdjective] Гонконг"
 FRI_the_french_hong_kong_desc:0 "[FRA.GetNameDefCap] давно надеется превратить Гуанчжоувань в [FRA.GetAdjective] Гонконг. Пора вернуться к этим планам и развить торговый потенциал территории."
 FRI_focus_on_the_vietnamese_ports:0 "Сосредоточиться на вьетнамских портах"
 FRI_focus_on_the_vietnamese_ports_desc:0 "Из-за крайне неудобного расположения Гуанчжоувань оказался пустой тратой времени и ресурсов. Следует направить усилия на развитие портов Хайфона и Сайгона, которые уже вносят значительный вклад в экономическую динамику [FRI.GetNameDef]."
 FRI_trade_protection_doctrine:0 "Доктрина защиты торговли"
 FRI_trade_protection_doctrine_desc:0 "Риск [JAP.GetAdjective] вторжения велик. Однако слабость противника заключается в необходимости импортировать значительную часть ресурсов. Мы лишим его флот снабжения, сосредоточившись на уничтожении конвоев и глобальном нарушении торговли."
 FRI_trade_disturbtion_doctrine:0 "Доктрина нарушения торговли"
 FRI_trade_disturbtion_doctrine_desc:0 "Риск [JAP.GetAdjective] вторжения велик. Однако слабость противника заключается в необходимости импортировать значительную часть ресурсов. Мы лишим его флот снабжения, сосредоточившись на уничтожении конвоев и глобальном нарушении торговли."
 FRI_invite_fcm_to_fort_bayard:0 "Пригласить FCM в Форт-Баяр"
 FRI_invite_fcm_to_fort_bayard_desc:0 "Forges et chantiers de la Méditerranée известна своими средиземноморскими верфями. Мы можем пригласить компанию построить новые доки в Форт-Баяре, превратив торговый город в промышленный центр флота."
 FRI_invite_fcm_to_fort_bayard_tt:0 "Открывает §YFCM§! в качестве конструктора кораблей"
 FRI_submarines_effort:0 "Развитие подводных лодок"
 FRI_submarines_effort_desc:0 "Отличным способом нарушить торговлю станет применение подводных лодок, идеально подходящих для уничтожения конвоев. Кроме того, их скрытность можно использовать против крупных кораблей, широко представленных в [JAP.GetADjective] флоте."
 FRI_expand_the_garde_indigene:0 "Расширить Туземную гвардию"
 FRI_expand_the_garde_indigene_desc:0 "«Туземная гвардия» — полки стрелков, набранных в [FRI.GetNameDef] и находящихся под командованием [FRA.GetAdjective] офицеров и унтер-офицеров. С момента создания в 1886 году их численность постоянно росла. На фоне усиления национализма в [FRI.GetNameDef] следует расширить эти части для поддержки колониального правительства."
 FRI_adopt_the_mas_36:0 "Принять MAS-36"
 FRI_adopt_the_mas_36_desc:0 "MAS-36 постепенно поступает на вооружение [FRA.GetAdjective] армии. Мы попросим отправить часть винтовок и их чертежи в [FRI.GetNameDef], чтобы со временем наладить собственное производство."
 FRI_adopt_the_mas_36_tt:0 "Добавляет технологию: §YMAS-36§!\nЕсли она уже изучена: §Y1x §!§G100%§! бонус к исследованию: §YПехотное вооружение§!\n"
 FRI_improve_communications:0 "Улучшить связь"
 FRI_improve_communications_desc:0 "Из-за крайне враждебных джунглей [FRI.GetNameDef] связь между войсками может быть очень сложной. Развитие радиосвязи для солдат частично решит эту проблему."
 FRI_establish_the_armee_d_indochine:0 "Создать Индокитайскую армию"
 FRI_establish_the_armee_d_indochine_desc:0 "Мы не можем полагаться только на сухопутные войска Франции для защиты [FRI.GetNameDef], особенно если одновременно идёт война в Европе и Азии. Мы создадим настоящую [FRI.GetAdjective] армию и сами защитим колонию."
 FRI_maintain_reliance_on_the_armee_de_terre:0 "Сохранить зависимость от французской сухопутной армии"
 FRI_maintain_reliance_on_the_armee_de_terre_desc:0 "Французской сухопутной армии достаточно для защиты [FRI.GetNameDef]. Нам следует сосредоточиться на укреплениях и военных объектах."
 FRI_allow_indigenous_officers:0 "Разрешить службу туземным офицерам"
 FRI_allow_indigenous_officers_desc:0 "Новая армия будет состоять главным образом из местного населения, поэтому следует привлекать офицеров [FRI.GetAdjective] происхождения."
 FRI_indochinese_military_service:0 "[FRI.GetNameDefCap] Военная служба"
 FRI_indochinese_military_service_desc:0 "По примеру [FRA.GetNameDef] мы введём обязательную военную службу по всей [FRI.GetNameDef], чтобы создать достаточный резерв призывников."
 FRI_ecole_militaire_de_hanoi:0 "Ханойская военная школа"
 FRI_ecole_militaire_de_hanoi_desc:0 "Взяв за образец знаменитую школу Сен-Сир, мы создадим военное училище для подготовки нового поколения [FRI.GetAdjective] офицеров."
 VIN_build_the_ligne_sarrault:0 "Построить линию Сарро"
 VIN_build_the_ligne_sarrault_desc:0 "Линия укреплений на севере страны, вдоль китайской границы, защитит нас от попыток сухопутного вторжения со стороны Китая или [JAP.GetNameDef]."
 FRI_create_coastal_fortifications:0 "Создать береговые укрепления"
 FRI_create_coastal_fortifications_desc:0 "Строительство морских укреплений для защиты ценных вьетнамских и китайских портов ограничит возможности высадки с моря."
 FRI_create_coastal_fortifications_tt:0 "Создаёт §Yукрепления 2-го уровня§! в наших портах."
 FRI_expand_the_northern_air_bases:0 "Расширить северные авиабазы"
 FRI_expand_the_northern_air_bases_desc:0 "Наши возможности размещения [FRA.GetAdjective] самолётов сравнительно малы и ограничены небольшими аэродромами. Чтобы [FRA.GetNameDef] могла защищать наше небо, необходимо расширить авиационную инфраструктуру."
 FRI_gouverneur_jules_brevie:0 "Назначить Жюля Бревье"
 FRI_gouverneur_jules_brevie_desc:0 "Победа [FRA.GetRulingParty] означала перемены для [FRI.GetNameDef], прежде всего замену Рене Робена на Жюля Бревье на посту генерал-губернатора Индокитая. Социалист Бревье выступает за научный подход к колонизации и надеется провести множество реформ для улучшения условий жизни в [FRI.GetNameDef]."
 FRI_gouverneur_jules_brevie_tt:0 "§BЖюль Бревье станет генерал-губернатором в сентябре 1936 года§!\n"
 FRI_concessions_to_the_strikers:0 "Уступки рабочим"
 FRI_concessions_to_the_strikers_desc:0 "Экономическое восстановление 1936 года привело к резкому росту цен в Индокитае, хотя рабочие уже много лет страдали от снижения зарплат. Если мы не хотим краха колониальной администрации, придётся ускорить реформы, запланированные [FRI.Getleader]."
 FRI_expansion_of_the_strikes:0 "Расширение забастовок"
 FRI_expansion_of_the_strikes_desc:0 "Экономический кризис продолжает бить по нашей экономике, и в эти трудные времена мы не можем позволить себе уступки местному населению. Остаётся надеяться, что забастовки прекратятся сами."
 FRI_amnesty_law:0 "Амнистия сторонников независимости"
 FRI_expansion_of_the_strikes_tt:0 "Ещё не завершено"
 FRI_amnesty_law_desc:0 "Первым шагом к примирению с борцами за независимость станет демонстрация доброй воли через их освобождение. Будет принят закон об амнистии, который должен освободить более 90% заключённых."
 FRI_decret_moutet:0 "Декрет Муте"
 FRI_decret_moutet_desc:0 "Министр колоний Мариус Муте добился подписания декрета, фактически вводящего [FRI.GetAdjective] трудовой кодекс, подобный социальным законам Народного фронта в метрополии. Рабочий день будет сокращён, а ночной труд женщин и детей запрещён."
 FRI_freedom_of_speech_and_association:0 "Свобода слова и объединений"
 FRI_freedom_of_speech_and_association_desc:0 "В [FRI.GetNameDef] всегда существовали репрессии против некоторых интеллектуальных групп. Пора изменить это, предоставив полную свободу слова и объединений, включая право создавать профсоюзы."
 FRI_gain_support_from_the_kuomintang:0 "Заручиться поддержкой Гоминьдана"
 FRI_gain_support_from_the_kuomintang_desc:0 "Гоминьдан давно является союзником VNQDD, Вьетнамской националистической партии. Юньнаньская железная дорога позволит нам получать материальную и политическую поддержку, а изгнанникам — вернуться с севера и помочь в подготовке восстания."
 FRI_gain_support_from_the_soviet_union:0 "Заручиться поддержкой [SOV.GetNameDef]"
 FRI_gain_support_from_the_soviet_union_desc:0 "Стратегия народных фронтов, продвигаемая [SOV.GetNameDef], подтолкнула Коммунистическую партию Индокитая к сближению с другими силами движения за независимость. Такие лидеры, как Нгуен Ай Куок, окажут значительную помощь благодаря резкому росту популярности коммунистических движений во Вьетнаме, особенно в Кохинхине."
 FRI_the_second_yen_bai_mutiny:0 "Второй мятеж в Йенбае"
 FRI_the_second_yen_bai_mutiny_desc:0 "Мятеж различных [FRI.GetAdjective] стрелковых полков станет началом нашей войны за независимость. Подобное восстание произошло в 1930 году, но не получило ожидаемой поддержки. Теперь же, опираясь на миллионы бастующих во всех регионах, мы сможем гораздо легче избавиться от французского присутствия."
 FRI_the_second_yen_bai_mutiny_tt:0 "Вы переключаетесь на §YВьетнам§! и §RОбъявить войну§! в отношении §[FRI.GetNameDef]§!.\nЕсли вам удастся взять под контроль [FRI.GetNameDef] или держаться более года, контролируя всю свою территорию; §GБелый мир§! Это произойдет, и вы будете свободны.\nВо время войны за независимость, а §RБорьба за власть§! Происходит между четырьмя §Yфракции§!который будет определять §YВьетнам§!Идеология, как только война за независимость закончится.\nЕсли вы берете под контроль §YЛаос§! и §YКамбоджа§!Они также будут освобождены после окончания войны.\n"
 FRI_allow_political_parties:0 "Разрешить политические партии"
 FRI_allow_political_parties_desc:0 "Будет разрешено создание умеренных политических партий. Уже появились две организации, главным образом представляющие [FRI.GetAdjective] буржуазию: Конституционалистская партия и Демократическая партия. Они стремятся лишь к определённой автономии для [FRI.GetNameDef], подобной статусу британских доминионов."
 FRI_bring_back_stability:0 "Восстановить стабильность"
 FRI_expand_the_surete_generale_indochinoise:0 "Расширить Генеральную службу безопасности Индокитая"
 FRI_expand_the_surete_generale_indochinoise_desc:0 "Генеральная служба безопасности Индокитая действует как репрессивный аппарат с 1917 года и занимается противодействием росту вьетнамского национализма. Увеличение её штата не позволит забастовкам вновь парализовать колониальную администрацию."
 FRI_crackdown_on_communist_organisations:0 "Подавление революционеров"
 FRI_crackdown_on_communists_organisations:0 "Подавление революционеров"
 FRI_crackdown_on_communists_organisations_desc:0 "Вьетнамские коммунистические движения, хотя и запрещены, продолжают набирать популярность, особенно среди городских рабочих. Массовые аресты их руководителей в [FRI.GetNameDef] должны остановить этот рост."
 FRI_fuelling_the_metropole:0 "Снабжать метрополию"
 FRI_fuelling_the_metropole_desc:0 "Наша главная роль — экономически поддерживать метрополию. Поскольку война только началась, необходимо направить все ресурсы на военные нужды, включая каучук и сельскохозяйственную продукцию вроде риса и чая."
 FRI_fuelling_the_metropole_tt:0 "Если действует не §YВоенная экономика§! и не §YВсеобщая мобилизация§!, закон об экономике будет изменён на §YВоенную экономику§!\n"
 FRI_plan_mandel:0 "План Манделя"
 FRI_plan_mandel_desc:0 "План Манделя, названный в честь колониального министра, который заменил Муте, состоит из мобилизации более 300 000 колониальных рабочих, включая 100 000. [FRI.GetAdjective]Для того, чтобы быть посланным в митрополита Франции, чтобы управлять [FRA.GetAdjective] Военная экономика и, в частности, ее заводы."
 FRI_vientiane_phnom_penh_railroad:0 "Железная дорога Вьентьян — Пномпень"
 FRI_expand_the_transindochinois:0 "Расширить Трансиндокитайскую железную дорогу"
 FRI_expand_the_transindochinois_desc:0 "Подключение Пномпеня и Вьентьяна к Трансиндокитайской железной дороге позволит создать единую линию через весь Индокитай. Это упростит освоение ресурсов Лаоса и Камбоджи."
 FRI_mimic_the_marine_nationale:0 "Подражать Национальному флоту"
 FRI_mimic_the_marine_nationale_desc:0 "Создание военно-морских сил под контролем [FRI.GetAdjective] колониального правительства, а не самой [FRA.GetNameDef], позволит построить флот, лучше приспособленный к водам Юго-Восточной Азии. Однако не следует забывать корни, и за основу мы возьмём лучше всего знакомый нам [FRA.GetAdjective] флот."
 FRI_fleet_in_being_doctrine:0 "Доктрина флота в наличии"
 FRI_fleet_in_being_doctrine_desc:0 "Прежде всего необходимо обеспечить безопасное прибытие торговых судов в порты. Для этого следует сосредоточиться на строительстве средних и тяжёлых кораблей, особенно эсминцев, способных противостоять подводным лодкам. Хотя [JAP.GetAdjective] армия использует их нечасто, даже небольшое число может представлять серьёзную угрозу."
 FRI_destroyers_modernisation_desc:0 "Для реализации планов противолодочной обороны необходимо модернизировать эсминцы, чтобы ни одна подводная лодка не смогла добраться до наших конвоев."
 FRI_destroyers_modernisation:0 "Модернизация эсминцев"
 FRI_the_return_of_cuong_de:0 "Возвращение Кыонг Де"
 FRI_the_return_of_cuong_de_desc:0 "Согласно праву первородства, Кыонг Де — член династии Нгуен, который должен был унаследовать вьетнамский престол. Более двух десятилетий он путешествовал по Азии в поисках поддержки независимости Вьетнама и установил множество связей с [JAP.GetAdjective] ультранационалистами. До него дошли слухи о восстании, и теперь он готовится вернуться на родину."
 FRI_politique_du_paysannat:0 "Политика поддержки крестьянства"
 FRI_tirailleurs_indochinois:0 "Мобилизовать индокитайских стрелков"
 FRI_tirailleurs_indochinois_desc:0 "Индокитайские стрелки, набиравшиеся по всему Индокитаю, были созданы в 1880 году во время Тонкинской экспедиции. Они позволяли [FRA.GetNameDef] сохранять власть над [FRI.GetAdjective] колонией и подавлять все националистические восстания."
 FRI_tirailleurs_indochinois_tt:0 "Получить §Y2§! пехотные дивизии возле Ханоя"
 VIN_request_the_mortier_modele_27_31:0 "Запросить миномёт образца 27/31"
 VIN_request_the_mortier_modele_27_31_desc:0 "Миномёт образца 27/31, разработанный и производимый компанией Brandt, уже несколько лет состоит на вооружении Франции. Простой в использовании, но грозный в бою, он значительно усилит оборону таких городов, как Сайгон и Ханой, расположенных на сравнительно равнинной местности, в случае сухопутного вторжения."
 FRI_the_mortier_modele_27_31:0 "Миномёт образца 27/31"
 FRI_the_mortier_modele_27_31_desc:0 "Миномёт образца 27/31, разработанный и производимый компанией Brandt, уже несколько лет состоит на вооружении Франции. Простой в использовании, но грозный в бою, он значительно усилит оборону таких городов, как Сайгон и Ханой, расположенных на сравнительно равнинной местности, в случае сухопутного вторжения."
 FRI_tame_the_forests:0 "Покорить леса"
 FRI_tame_the_forests_desc:0 "По всей [FRI.GetNameDef] разбросано множество лесов, серьёзно осложняющих боевые действия, особенно для армии, незнакомой с местностью. Мы можем обратить это себе на пользу и лучше подготовить оборону благодаря глубокому знанию окружающей среды."
 FRI_tame_the_forests_tt:0 "Открывает §Hподготовку к боям в лесах§!\n§HПехота\n    Лес§!\n      Атака: §G+5%§!\n      Скорость перемещения: §G+10%§!\n"
 VIN_genie_indochinois:0 "Перенять опыт инженерных войск"
 VIN_genie_indochinois_desc:0 "Из-за особенностей [FRI.GetAdjective] местности добавление инженерных подразделений в дивизии позволит максимально укрепить оборону там, где всё ещё возможны окопные бои."
 FRI_learn_from_the_genie_desc:0 "Из-за особенностей [FRI.GetAdjective] местности добавление инженерных подразделений в дивизии позволит максимально укрепить оборону там, где всё ещё возможны окопные бои."
 FRI_learn_from_the_genie:0 "Перенять опыт инженерных войск"
 FRI_the_war_arrives_to_indochina:0 "Война приходит в Индокитай"
 FRI_the_war_arrives_to_indochina_desc:0 "Война наконец достигла нашей мирной колонии. Пришло время срочно перестроить армию, чтобы удовлетворить потребности [FRA.GetnameDef] и обеспечить оборону [FRI.GetNameDef]."
 FRI_the_war_arrives_to_indochina_tt:0 "Получить §Y3§! дивизии колониальных войск в Кохинхине\n"
 FRI_fortify_the_chinese_border:0 "Укрепить китайскую границу"
 FRI_fortify_the_chinese_border_desc:0 "Линия укреплений на севере страны, вдоль китайской границы, защитит нас от попыток сухопутного вторжения со стороны Китая или [JAP.GetNameDef]."
 FRI_fortify_the_chinese_border_tt:0 "Получить §Yукрепления 2-го уровня§! вдоль северной границы"
 FRI_parachutistes_coloniaux:0 "Колониальные парашютисты"
 FRI_parachutistes_coloniaux_desc:0 "Несмотря на все усилия, бои в лесах всегда будут сложными из-за риска засад. Но при атаке парашютистами преимущество внезапности окажется на нашей стороне."
 FRI_parachutistes_coloniaux_tt:0 "Получить §Y2§! дивизии парашютистов"
 FRI_intensify_native_recruitment:0 "Усилить набор местного населения"
 FRI_intensify_native_recruitment_desc:0 "[FRA.GetNameDefCap] нуждается в как можно большем числе солдат. Во время Великой войны колонии показали себя идеальным местом для набора будущих бойцов."
 FRI_independent_command_structure:0 "Независимая структура командования"
 FRI_independent_command_structure_desc:0 "Сохраняя верность и организационную связь с французской сухопутной армией, [FRI.GetAdjective] армия должна обладать самостоятельностью в вопросах стратегии и решений генералов и офицеров."
 FRI_from_militias_to_an_army:0 "От ополчения к армии"
 FRI_from_militias_to_an_army_desc:0 "Туземная гвардия больше похожа на подконтрольное правительству ополчение, чем на настоящую армию. Пора преобразовать её в полноценные дивизии, чтобы Индокитайская армия получила надлежащую организацию."
 FRI_keep_the_civilian_government:0 "Сохранить гражданское правительство"
 FRI_keep_the_civilian_government_desc:0 " "
 FRI_appoint_catroux_as_gouverneur:0 "Назначить Катру генерал-губернатором"
 FRI_appoint_catroux_as_gouverneur_desc:0 " "
 FRI_bao_dai_speech:0 "Речь Бао Дая"
 FRI_bao_dai_speech_desc:0 " "
 FRI_request_guns_from_the_metropole:0 "Запросить оружие у метрополии"
 FRI_request_guns_from_the_metropole_desc:0 " "
 FRI_support_from_loyal_mandarins:0 "Поддержка верных мандаринов"
 FRI_support_from_loyal_mandarins_desc:0 " "
 FRI_end_the_rebellion:0 "Покончить с восстанием"
 FRI_end_the_rebellion_desc:0 " "
 FRI_a_stronger_hand:0 "Более твёрдая рука"
 FRI_a_stronger_hand_desc:0 " "
 FRI_rethink_the_administration:0 "Переосмыслить администрацию"
 FRI_rethink_the_administration_desc:0 " "
 FRI_mass_executions:0 "Массовые казни"
 FRI_anti_independentist_terror:0 "Террор против сторонников независимости"
 FRI_anti_independentist_terror_desc:0 " "
 FRI_reward_the_loyalists:0 "Наградить лоялистов"
 FRI_reward_the_loyalists_desc:0 " "
 FRI_entrench_the_status_quo:0 "Укрепить статус-кво"
 FRI_entrench_the_status_quo_desc:0 " "
 FRI_a_common_constitution:0 "Общая конституция"
 FRI_a_common_constitution_desc:0 " "
 FRI_universal_suffrage:0 "Всеобщее избирательное право"
 FRI_universal_suffrage_desc:0 " "
