 FRI_colonial_army:0 "Колониальная армия"
 FRI_colonial_army_desc:0 "Несмотря на призыв части коренного населения, особенно в подразделения индокитайских стрелков, оборона [FRI.GetNameDef] по-прежнему во многом зависит от [FRA.GetNameDef]. Местный призыв остаётся сравнительно небольшим из-за колониального характера администрации и низкого мобилизационного потенциала, поскольку значительную часть населения составляют крестьяне."
 FRI_illiteracy:0 "Неграмотность"
 FRI_illiteracy_desc:0 "С начала французского присутствия в Индокитае предпринимались значительные усилия для расширения доступа к образованию. В 1907 году был основан Ханойский университет, а с 1917 года французский язык преподавался во всех франко-туземных школах. Несмотря на это, более 80% населения остаётся неграмотным, особенно в Лаосе и Камбодже, где образовательным программам уделялось гораздо меньше внимания и отсутствуют средние школы."
 FRI_unequal_economic_developement:0 "Неравномерное экономическое развитие"
 FRI_unequal_economic_developement_desc:0 "Несмотря на прозвище «Жемчужина империи», прибыль обычно приносит лишь вьетнамская часть Индокитая. Лаос и Камбоджа значительно отстают по уровню инфраструктуры и деловой активности, главным образом из-за более суровых природных условий и малочисленного населения. Это может оказаться опасным на фоне роста вьетнамских националистических движений, которые гораздо слабее представлены в двух других регионах."
 FRI_vietnamese_domined_economy:0 "Экономика под господством Вьетнама"
 FRI_growing_vietnamese_nationalism:0 "Рост вьетнамского национализма"
 FRI_growing_vietnamese_nationalism_desc:0 "С момента нашего прибытия в Кохинхину и до сегодняшнего дня движения за независимость Вьетнама не прекращали борьбу против французской администрации. Последним крупным примером стал организованный VNQDD мятеж в Йенбае в 1930 году."
 FRI_calmed_vietnamese_nationalism:0 "Ослабленный вьетнамский национализм"
 FRI_surete_generale_indochinoise:0 "Генеральная служба безопасности Индокитая"
 FRI_surete_generale_indochinoise_desc:0 "The \"Serete Generale Indochinoise\" Это репрессивный аппарат, созданный в 1917 году генерал-губернатором Альбертом Сарро. Задача последнего состояла в борьбе с вьетнамским национализмом. Несмотря на относительно небольшой штат, насчитывающий всего несколько сотен человек, в основном вьетнамцев, качество организации позволило ей успешно подавлять противников французского колониализма в регионе. Его \"Служба центральных переназначений и серете общего назначения\" (SRSG) имеет данные службы идентификации, охватывающие весь Индокитай."
 FRI_profits_from_opium:0 "Прибыль от опиума"
 FRI_illiteracy_2:0 "Неграмотность"
 FRI_illiteracy_2_desc:0 "С начала французского присутствия в Индокитае предпринимались значительные усилия для расширения доступа к образованию. В 1907 году был основан Ханойский университет, а с 1917 года французский язык преподавался во всех франко-туземных школах. Несмотря на это, более 80% населения остаётся неграмотным, особенно в Лаосе и Камбодже, где образовательным программам уделялось гораздо меньше внимания и отсутствуют средние школы."
