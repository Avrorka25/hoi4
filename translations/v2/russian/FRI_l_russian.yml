 FRI_surete_generale_indochinoise2_desc:0 "The \"Surete Generale Indochinoise\" Это репрессивный аппарат, созданный в 1917 году генерал-губернатором Альбертом Сарро. Задача последнего состояла в борьбе с вьетнамским национализмом. Несмотря на относительно небольшой штат, насчитывающий всего несколько сотен человек, в основном вьетнамцев, качество организации позволило ей успешно подавлять противников французского колониализма в регионе. Его \"Служба центральных переназначений и серете общего назначения\" (SRSG) имеет данные службы идентификации, охватывающие весь Индокитай."
