 r56_costa_rica_focus:0 "Национальные фокусы Коста-Рики"
 costa_rica.1.t:0 "Всеобщие выборы 1936 года"
 costa_rica.1.d:0 "После четырёх лет правления ПРН наконец наступили долгожданные всеобщие выборы 1936 года. Хотя многие близкие союзники президента Рикардо Хименеса Ореамуно советовали ему пренебречь конституцией и баллотироваться вновь, он неоднократно отказывался, не желая ставить под угрозу хрупкую политическую систему страны и понимая, что открытое пренебрежение демократическими ценностями навсегда запятнает даже убедительную победу. Поэтому Леон Кортес Кастро решил взять инициативу на себя и баллотироваться от Партиидо Републикано Насьональ, тогда как судья Октавио Беэче Аргуэльо был избран главным кандидатом оппозиции под знаменем Партиидо Насьональ.\n\nВся избирательная кампания воспринималась как историческая странность из-за ряда необычных событий, включая почти полный распад Партиидо Насьональ и неожиданный рост популярности Партиидо Комуниста де Коста-Рика. Однако институты [COS.GetNonIdeologyName] слишком стабильны, чтобы одни выборы могли серьёзно их потрясти."
 costa_rica.1.a:0 "Партиидо Републикано Насьональ добивается переизбрания!"
 costa_rica.1.b:0 "Неожиданная победа возрождённой Партиидо Насьональ!"
