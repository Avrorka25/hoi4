 r56rp_scripdip_1:0 "§YМы не вступили в войну с 2-мя полевыми командирами, пока нам не разрешили объявить войну.§!"
 r56rp_scripdip_2:0 "§YЦель объявления войны - военачальник.§!"
 r56rp_rules_alliance_over_points_tt:0 "§RУ Альянса должно быть достаточно свободных очков, чтобы вы могли присоединиться.§! имеет [?FROM.r56rp_rules_fp_faction_free|Y0] Свободные точки, потребности [?ROOT.r56rp_rules_fp_controlled|Y0]."
 r56rp_rules_alliance_over_points_2_tt:0 "§RАльянс должен иметь достаточно свободных очков для§! §Y[FROM.GetName]§! §RПрисоединиться.§! имеет [?ROOT.r56rp_rules_fp_faction_free|Y0] Свободные точки, потребности [?FROM.r56rp_rules_fp_controlled|Y0]."
 r56rp_rules_alliance_over_points_3_tt:0 "§RАльянс по пунктам, войну не объявишь.§!"
 r56rp_rules_2_majors_per_alliance_tt:0 "§RДопускается только 2 основные страны на альянс.§!"
 rp_rules_decision:0 "Оль Клики"
 rp_rules_decision_desc:0 "Ol' Clicky делает все, что угодно, но Ol' C clicky здесь, чтобы поддержать вас в самые темные дни."
 r56rp_rules_fp_controlled:0 "Текущие страновые точки"
 r56rp_rules_fp_set_4.tt:0 "§RПовысит рейтинг страны до 4 баллов§!"
 r56rp_rules:0 "Правила R56RP"
 r56rp_rules_desc:0 "§R- Внимание--§!\nКогда вам разрешено идти на войну, а также ваши текущие фракционные очки показаны ниже.\nЗдесь также будут появляться любые специальные миссии.\n§YЕсли ваши баллы были ниже 4 и вы формируете нацию, ваши текущие баллы должны рассматриваться как 4.§! \n§YЕсли ваша военная цель была приобретена фокусом, вам разрешено объявить войну в день «Фокусной военной декларации».§! \n\n Обыкновенная военная декларация [?ROOT.r56rp_rules_normalwargoaldeclaration.GetDateStringNoHourLong]§!\n §WФокусная военная декларация     [?r56rp_rules_focuswargoaldeclaration.GetDateStringNoHourLong]§!\n \n §O[ROOT.GetFlag][?ROOT.GetName|]§! §WФракционные точки - §![?THIS.r56rp_rules_fp_controlled|G0]§!\n Макс Фракцион Пойнтс - [?global.r56rp_rules_fp_maxallowed|G0]§!\n Текущие фракционные точки - [?THIS.r56rp_rules_fp_faction_summed|G0]§!\nСвободные фракционные точки - [?THIS.r56rp_rules_fp_faction_free|+0]§!"
 r56rp_peace_ita_eth:0 "Белый мир с Эфиопией"
 r56rp_peace_ita_eth_desc:0 "Не было войны с Эфиопией в 1937 году. Плачь мне реку."
 r56rp_SPR_remove_unplanned:0 "Устранение незапланированных наступлений"
 r56rp_SPR_remove_unplanned_desc:0 "Устраняет «незапланированные наступления» спустя 2 года после начала гражданской войны в Испании или после окончания войны."
 r56rp_disable_axis_armor_pack:0 "AXIS броня PACK DLC недоступны"
 r56rp_disable_axis_armor_pack_desc:0 "Axis броня Pack вызывает нестабильность во время многопользовательских игр. Скажи своему хозяину отключить его.\n\nЕсли вы играете в однопользовательскую игру, это можно игнорировать."
 r56rp_rules_event.1.t:0 "§RAXIS броня PACK DLC недоступны§!"
 r56rp_rules_event.1.d:0 "                                            §Rпредупреждение§!\nAxis броня Pack DLC включён. DLC вызывает нестабильность во время многопользовательских игр. Напомните хосту вашей игры отключить DLC.\n\nЕсли вы играете в однопользовательскую игру, это можно игнорировать."
 r56rp_rules_event.1.a:0 "§RУпс.§!"
 r56rp_show_terraform:0 "§OТерраформер видимый§!"
 r56rp_rule_fp_events.1.t:0 "Вы теперь город-государство"
 r56rp_rule_fp_events.1.desc:0 "Ваши фабрики находятся между 0 и 9.\n\nТочки вашей страны были изменены на 0.\nВы можете объявлять войну и защищать членов фракции в любое время."
 r56rp_rule_fp_events.2.a:0 "Понятно."
 r56rp_rule_fp_events.2.t:0 "Теперь ты маленькая сила."
 r56rp_rule_fp_events.2.desc:0 "Ваши фабрики находятся между 10 и 34.\n\nТочки вашей страны были изменены на 1.\nВы можете объявлять войну и защищать членов фракции в любое время."
 r56rp_rule_fp_events.3.a:0 "Понятно."
 r56rp_rule_fp_events.3.t:0 "Теперь вы региональная держава."
 r56rp_rule_fp_events.3.desc:0 "Ваши фабрики находятся между 35 и 54.\n\nТочки вашей страны были изменены на 2.\nВы можете объявить войну после июля 1937 года.\nВы можете объявить войну через Focus после января 1937 года.\nВы можете защищать членов фракции после июля 1936 года."
 r56rp_rule_fp_events.4.a:0 "Понятно."
 r56rp_rule_fp_events.4.t:0 "Теперь вы – средняя держава."
 r56rp_rule_fp_events.4.desc:0 "Ваши фабрики находятся между 55 и 74.\n\nТочки вашей страны были изменены на 3.\nВы можете объявить войну после июля 1938 года.\nВы можете объявить войну через Focus после января 1938 года.\nВы можете защищать членов фракции после июля 1937 года."
 r56rp_rule_fp_events.5.a:0 "Понятно."
 r56rp_rule_fp_events.5.t:0 "Теперь ты великая держава"
 r56rp_rule_fp_events.5.desc:0 "Ваши фабрики находятся между 75 и 104.\n\nТочки вашей страны были изменены на 4.\nВы можете объявить войну после июля 1939 года.\nВы можете объявить войну через Focus после января 1939 года.\nВы можете защищать членов фракции после июля 1938 года."
 r56rp_rule_fp_events.1.a:0 "Понятно."
 r56rp_rule_fp_events.6.t:0 "Теперь ты супердержава"
 r56rp_rule_fp_events.6.desc:0 "Ваши фабрики находятся между 105 и 124.\n\nВаши страновые баллы были изменены на 5.\n\nВы можете объявить войну после января 1940 года.\nВы можете объявить войну через Focus после июля 1939 года.\nВы можете защищать членов фракции после января 1939 года."
 r56rp_rule_fp_events.6.a:0 "Понятно."
 r56rp_rule_fp_events.7.t:0 "Теперь вы сверхдержава"
 r56rp_rule_fp_events.7.desc:0 "Ваши фабрики находятся между 125 и 145.\n\nТочки вашей страны были изменены на 6.\nВы можете объявить войну после января 1940 года.\nВы можете объявить войну через Focus после июля 1939 года.\nВы можете защищать членов фракции после января 1939 года."
 r56rp_rule_fp_events.7.a:0 "Понятно."
 r56rp_rule_fp_events.8.t:0 "Теперь вы — гипердержава."
 r56rp_rule_fp_events.8.desc:0 "Ваши фабрики находятся между 145 и 249.\n\nТочки вашей страны были изменены на 7.\n\nВы можете объявить войну после января 1940 года.\nВы можете объявить войну через Focus после июля 1939 года.\nВы можете защищать членов фракции после января 1939 года."
 r56rp_rule_fp_events.8.a:0 "Понятно."
 r56rp_rule_fp_events.9.t:0 "Теперь вы континентальная держава."
 r56rp_rule_fp_events.9.desc:0 "Ваши фабрики выше 250.\n\nТочки вашей страны были изменены на 10.\n\nВы можете объявить войну после января 1940 года.\nВы можете объявить войну через Focus после июля 1939 года.\nВы можете защищать членов фракции после января 1939 года."
 r56rp_rule_fp_events.9.a:0 "Понятно."
