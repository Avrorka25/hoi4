l_russian:
 germany.70.t:0 "Заговор Остера"
 germany.70.d:0 "Полагая, что Гитлер втянул Германию в войну, которую она не может выиграть, группа старших офицеров вермахта начала переворот! Похоже, что это было организовано полковником Хансом Остером из абвера, но генералы Бек, фон Браухич, Гальдер и адмирал Канарис также были подтверждены как причастные!\n\nТяжело вооруженные люди, лежавшие в ожидании в нескольких берлинских квартирах, собрались на рейхсканцлее с намерением ликвидировать Гитлера и его ближайших соратников. В настоящее время внутри здания бушует ожесточенная перестрелка."
 germany.70.a:0 "Защищайте фюрера любой ценой!"
 germany.70.b:0 "Возможно, его удаление было бы к лучшему..."
 germany.71.t:0 "Фюрер мертв."
 germany.71.d:0 "Войска СС и лояльные армейские подразделения, спешащие в Рейхсканзлей, успели убить или захватить всех коммандос-предателей, но не раньше, чем собакам удалось убить Гитлера! Фюрер был найден с несколькими десятками огнестрельных ранений, заваленных над его столом, который неустанно работал на Ватерланд до последнего вздоха. Его давняя уверенная в себе Ева Браун получила травму во время перестрелки, но, похоже, в свое время восстановится.\n\nВыжившие заговорщики предстанут перед судом за свое отвратительное преступление, но пока Германия находится в состоянии войны и нужен новый лидер. Кто будет следующим фюрером?"
 germany.71.a:0 "Господин Гиммлер приведет нас в будущее."
 germany.71.b:0 "Герр Геринг - логичный выбор."
 germany.71.c:0 "Ева Браун должна отомстить!"
 germany.72.t:0 "Заговор провалился"
 germany.72.d:0 "Войска СС и лояльные армейские подразделения, спешащие в Рейхсканзлей, сумели убить или захватить всех коммандос-предателей, а сам Гитлер руководил усилиями по очистке со своим доверенным Люгером. Чудесным образом фюрер вышел из боя с несколькими царапинами.\n\nОставшиеся в живых заговорщики заплатят высокую цену за свою нелояльность, и Гитлер теперь еще более привержен преследованию нынешней войны ради славной победы!"
 germany.72.a:0 "Да здравствует фюрер!"
 germany.73.t:0 "Заговоры увенчались успехом"
 germany.73.d:0 "Тяжелые бои в Рейхсканцлее превратили здание в горящую руину. Несмотря на большое количество солдат СС, спешащих на помощь Гитлеру, верные заговорщикам армейские части вступили в бой и оказались решающими. Фюрер был признан убитым, его давняя уверенная в себе Ева Браун тяжело ранена в перестрелке, и заговорщики успешно штурмовали все правительственные здания в Берлине.\n\nБольшая часть вермахта перешла на другую сторону, но многие офицеры по-прежнему лояльны НСДАП. Кто должен руководить ими?"
 germany.73.a:0 "Смерть национал-социализму!"
 germany.73.b:0 "Гиммлер перевернет это!"
 germany.73.c:0 "Геринг - наша единственная надежда на данный момент!"
 germany.73.e:0 "Ева Браун должна отомстить!"
