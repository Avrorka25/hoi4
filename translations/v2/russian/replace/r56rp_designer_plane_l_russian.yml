l_russian:
 aircraft_cannon_1_1x:0 "1-я пушка на драм-федре"
 aircraft_cannon_1_1x_desc:0 "Автоматическая пушка обеспечивает значительную огневую мощь против воздушных целей, но дополнительный вес делает самолёт медленнее и менее манёвренным."
 aircraft_cannon_1_2x:0 "2-кратная пушка Drum-Fed"
 aircraft_cannon_1_2x_desc:0 "Две автоматические пушки дают самолёту грозное курсовое вооружение против воздушных и небронированных наземных целей, но значительно увеличивают вес и снижают манёвренность."
 aircraft_cannon_2_1x:0 "1-я пушка Belt-Fed самолёт"
 aircraft_cannon_2_1x_desc:0 "Благодаря более крупному и мощному снаряду, чем у прежних автопушек, это оружие способно одним попаданием сбить даже крупный самолёт."
 aircraft_cannon_2_2x:0 "2-кратная пушка Belt-Fed самолёт"
 aircraft_cannon_2_2x_desc:0 "Две пушки придают самолёту значительную ударную мощь, а повышенная плотность огня облегчает нанесение критических повреждений."
 dive_brakes_small:0 "Аэродинамический тормоз"
 dive_brakes_small_desc:0 "Набор спойлеров вдоль задней кромки крыла разворачивается, когда самолет входит в погружение, уменьшая общую скорость и позволяя самолету вытягивать крутые погружения, не отрывая крылья. Это, в свою очередь, позволяет самолету атаковать с почти вертикального погружения, резко повышая точность."
 guided_anti_ship_missile:0 "Руководящая противокорабельная ракета"
 guided_anti_ship_missile_desc:0 "По сути это противокорабельная бомба с ракетным двигателем и радиоуправлением. Новое оружие представляет серьёзную угрозу для любого находящегося на плаву корабля."
 early_bombs:0 "Бомбы"
 early_bombs_desc:0 "С первых дней Великой войны самолёты всё чаще использовались для сбрасывания взрывчатки на вражеские цели. Со временем это превратилось в один из основополагающих элементов воздушной войны."
 photo_reconnaisance:0 "Фоторазведка"
 photo_reconnaisance_desc:0 "Первой очевидной военной задачей самолёта был поиск противника и передача его местоположения генералам на земле. Это и сегодня остаётся одной из самых распространённых задач военной авиации."
 aa_lmg:0 "Световой MG"
 aa_lmg_desc:0 "Пулемёты винтовочного калибра составляли основу вооружения класса «воздух — воздух» ещё со времён Великой войны."
 aa_hmg:0 "Тяжелый MG"
 aa_hmg_desc:0 "Современные самолёты способны выдерживать значительно больше повреждений, чем старые модели, а попасть по ним стало сложнее. Поэтому каждое попадание должно наносить максимальный урон, что требует патрона большего калибра."
 aa_cannon_1:0 "Пистолеты Drum-Fed самолёт"
 aa_cannon_1_desc:0 "Пушечный снаряд способен пробить даже самый прочный самолёт и при этом нести достаточно взрывчатки, чтобы при попадании нанести сокрушительный урон."
 aa_cannon_2:0 "Большие пушки"
 aa_cannon_2_desc:0 "Благодаря увеличенному калибру и более тяжёлому снаряду эти пушки могут сбить даже большой самолёт одним попаданием."
 aa_cannon_3:0 "Самолетные пушки Belt-Fed"
 aa_cannon_3_desc:0 "Благодаря увеличенному калибру и более тяжёлому снаряду эти пушки могут сбить даже большой самолёт одним попаданием."
 engines_1:0 "Базовая авиационная тяга"
 engines_1_desc:0 "Двигатели самолета должны быть мощными, но легкими и надежными."
 engines_2:0 "Двигатели II"
 engines_2_desc:0 "Стремительное развитие авиации требует соответствующего увеличения мощности двигателей."
 engines_3:0 "Двигатели III"
