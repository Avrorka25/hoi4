l_russian:
 r56.startup.event.01.title:0 "Добро пожаловать в Road to 56 RP!"
 r56.startup.event.01.description:0 "Приветствуем вас от команды 56!\n\nМод автоматически переключится в многопользовательский режим, если как минимум две страны находятся под управлением игроков. В этом режиме отключены некоторые несбалансированные элементы и внесены изменения для повышения производительности ИИ.\n\n§R--- ВАЖНО ---\n§!Официальные обновления мода выходят примерно 7–8 числа каждого месяца. Мы рекомендуем завершать игры и кампании до этих дат, поскольку наши обновления иногда могут нарушать совместимость сохранений. Спасибо за понимание. Также имейте в виду, что выход новых дополнений и обновлений игры обычно задерживает наши обновления.\n\nЕсли вы столкнулись с ошибками или проблемами, сначала убедитесь, что у вас нет конфликтующих модов; в противном случае подробно сообщите о проблеме в нашем Discord."
 r56.startup.event.01.option_auto:0 "Продолжить"
 r56.startup.event.01.option_tt:0 "Спасибо, что играете в наш мод, и хорошего вам дня!"
 r56.startup.event.02.title:0 "...погодите-ка!"
 r56.startup.event.02.description:0 "Похоже, у вас нет бесплатного DLC «Польша: Объединённые и готовые». Это а §Rтребование§! Для того, чтобы мод работал так, как задумано. Пожалуйста, перезапустите игру с включенным DLC; В противном случае появятся некоторые графические баги."
 r56.startup.event.02.option:0 "Я выйду из игры и сделаю, как вы сказали."
 r56.startup.event.02.option_tt:0 "И правильно..."
 r56.startup.event.03.title:0 "Вы не должны были это увидеть"
 r56.startup.event.03.description:0 ""
 r56.startup.event.03.option:0 "Перестаньте использовать консоль"
