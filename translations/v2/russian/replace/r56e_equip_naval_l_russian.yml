l_russian:
 ship_hull_light_5:0 "Современный эсминец"
 ship_hull_light_5_desc:0 "Чтобы действовать в быстро меняющейся и враждебной морской среде, современные проекты эсминцев получают полностью автоматические орудия главного калибра, усовершенствованные механизмы, улучшенное оборудование обнаружения и эффективное противолодочное вооружение."
 ship_hull_cruiser_5:0 "Современный крейсер"
 ship_hull_cruiser_5_desc:0 "Современные достижения морской войны сделали крейсеры крупнее и быстрее и позволили им нести больше боеприпасов, чем предыдущему поколению."
 ship_hull_heavy_5:0 "Современный тяжёлый корабль"
 ship_hull_heavy_5_desc:0 "Когда эпоха линкоров подходит к концу, эти громадные титаны всё чаще воспринимаются как символические реликвии разрушительной эпохи — достойные музеев или упрямо отказывающиеся принять бездействующую судьбу."
 ship_hull_carrier_4:0 "Современный авианосец"
 ship_hull_carrier_4_desc:0 "С превосходством авиации над крупнокалиберными орудиями эти послевоенные авианосцы несут больше современных самолётов, зенитных орудий и другого противовоздушного вооружения. Когда эти гиганты выходят в море, господство в небе над ним становится значительно проще."
 ship_hull_submarine_5:0 "Современная подводная лодка"
 ship_hull_submarine_5_desc:0 "Эти передовые дизель-электрические подводные лодки обладают улучшенной конструкцией корпуса. Более быстрые и точные торпеды делают их особенно эффективными в рейдах на конвои и морском перехвате, превращая в важнейший инструмент морской войны."
 carrier_ship_engine_nuclear_1:0 "Атомная энергетическая установка авианосца"
 carrier_ship_engine_nuclear_1_desc:0 "Как в комиксе Бака Дэнни «Тайна самолётов-призраков»."
 heavy_ship_engine_nuclear_1:0 "Атомная энергетическая установка линкора"
 heavy_ship_engine_nuclear_1_desc:0 "Есть причина, почему ядерный реактор лучше установить внутрь линкора, а не запускать им в гигантскую птицу размером с этот самый корабль."
 sub_ship_engine_nuclear_1:0 "Атомная энергетическая установка подводной лодки"
 sub_ship_engine_nuclear_1_desc:0 "Работает безупречно — как показано в фильме «К-19»."
