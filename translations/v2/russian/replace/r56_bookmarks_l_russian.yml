l_russian:
 AUS_GATHERING_STORM_DESC:2 "Первая республика пала. 20 мая 1933 года был принят закон о чрезвычайных полномочиях, пугающе похожий на тот, которым Адольф Гитлер воспользовался всего несколькими месяцами ранее, и канцлер Энгельберт Дольфус фактически распустил парламент. После короткой гражданской войны в феврале 1934 года и убийства Дольфуса нацистами Австрия оказалась под властью австрофашистского режима.\n\nТеперь канцлер Курт Шушниг пытается сохранить независимость страны, балансируя между итальянской защитой и всё более агрессивной Германией. Сможет ли Австрия пережить надвигающуюся бурю?"
 GRE_GATHERING_STORM_DESC:0 "Для Греции Великая война не закончилась в 1918 году. Катастрофическая война с Турцией и ужасные последствия национального раскола оставили много ран открытыми для греческой нации. Великая депрессия, безработица, социальная и политическая нестабильность и рост радикализма привели маленькую страну Греции на перекресток, чтобы решить свое будущее, преодолеть многие проблемы и смотреть вперед, как призывает ее наследие."
 HOL_GATHERING_STORM_DESC:0 "В настоящее время Нидерланды находятся в центре глубокого кризиса. Страна пострадала от Великой депрессии немного позже, чем другие, и, следовательно, в настоящее время страдает от ее худших последствий. Безработица находится на рекордно высоком уровне, и правительство пока не отреагировало, предпочитая придерживаться политики бюджетного баланса и веры в золотой стандарт. Хочется надеяться, что экономическая доктрина правительства в настоящее время меняется из-за давления улицы. Что еще хуже, Германия перевооружается, и правительство знает, что на этот раз будет чрезвычайно трудно оставаться нейтральным, если Европа снова сгорит."
 PER_GATHERING_STORM_DESC:0 "Из хаоса событий 1921 года, отмеченного социалистическим восстанием на севере и мятежом полковника Мохаммада Таки Пессиана, вышел новый Иран во главе с Реза-шахом, последний был коронован шахом в том же году после его государственного переворота. Несмотря на конституцию, правительство характеризуется сильной королевской и военной властью, первая постоянно обеспечивает лояльность последней, а также перспективой принудительной модернизации, светских реформ и промышленного развития."
 SIA_GATHERING_STORM_DESC:0 "В 1932 государственный переворот положил конец абсолютной монархии, первая конституция была установлена, и Хана Рацадон (Народная партия) взяла верх. Тем не менее, армия играла все большую роль на политической арене: вытесняя премьер-министра и заменяя его Прайей Фахонфонфонпхойюхасеной. По мере того, как призрак фашизма, воплощенный Плаеком Фибунсонгхрамом, кажется, получает поддержку в вооруженных силах, разделение между крыльями партии расширяется. Ранее братья, течения стали соперниками, и только одному будет позволено председательствовать над судьбой страны."
 TUR_GATHERING_STORM_DESC:0 "После того, как Великая война привела к падению Османской империи, будущее Турции выглядело мрачным. Но Турция восстала, как феникс, из огня турецкой войны за независимость. Во главе с Мустафой Кемалем Ататюрком и его кемалистской идеологией Турция выглядит сильной и безопасной. Но его народ устал и нуждается в мире. Потребуется еще одно значительное изменение, чтобы разбудить этого спящего льва."
 LUX_GATHERING_STORM_DESC:0 "Люксембург долго сохранял нейтралитет, однако Великая война потрясла страну до основания. Королевский скандал едва не привёл к падению монархии, а послевоенные годы заставили пересмотреть старые политические и экономические связи.\n\nТеперь маленькое государство вновь оказывается между великими державами. Германия стремительно вооружается, Франция ищет способы укрепить оборону, а Бельгия возвращается к нейтралитету. Люксембургу предстоит решить, сможет ли он снова пережить европейскую бурю."
 POR_GATHERING_STORM_DESC:0 "После двух десятилетий республики, отмеченных разорительным участием в Великой войне и вооружёнными восстаниями против многочисленных неудачных правительств, Португалия оказалась под властью военного переворота, который постепенно превратился в националистическую правую диктатуру.\n\nМолодой экономист Антониу де Оливейра Салазар, первоначально скромный, но влиятельный министр финансов Кармоны, провёл политику жёсткой экономии и противодействия Великой депрессии, объединив правых в корпоративистском «Эштаду Нову», где он занимает пост председателя Совета министров. Сможет ли его режим пережить надвигающуюся бурю на Пиренейском полуострове?"
 RAJ_GATHERING_STORM_DESC:0 "Британская Индия была конструкцией, часто обсуждаемой среди населения индийского субконтинента. Многие индийцы из так называемых \"Жемчужина Британской империи\" Они приняли участие в Великой войне и чувствовали себя преданными вопиющим пренебрежением к своим голосам после жертвоприношения десятков тысяч жизней. Тем не менее, возможно, самые бурные времена в индийской истории впереди. Будет ли преобладать демократическая воля коренного населения, или Индия останется непоколебимой под британским правлением?"
 BEL_GATHERING_STORM_DESC:0 "Бельгия может казаться незначительной территорией между Францией и Германией, однако это густо индустриализированная страна, извлекающая ценные ресурсы из своей колонии Конго. Правительство восстанавливается после Великой депрессии, инфраструктурные проекты идут полным ходом, а промышленная активность постепенно оживает. На политической сцене всё больше избирателей ищут ответы в экстремистских идеях. Леон Дегрель с каждым днём набирает популярность и может угрожать традиционным коалициям демократических партий. Тем временем активны и фламандские националисты, распространяющие недовольство среди младших чинов армии."
 BHU_GATHERING_STORM_DESC:0 "Изолированный в Гималаях, Бутан находится на пределе британской сферы влияния. Привязанная к Великобритании через договор Пунакха, страна отказалась от своих военных сил и полагается на британскую индийскую армию для своей защиты."
 BRA_GATHERING_STORM_DESC:0 "К 1936 году Бразилия сломлена. Переворот 1930 года разрушил наши традиции и демократические институты, а вскоре после этого гражданская война нанесла тяжёлый удар по промышленности и инфраструктуре важнейшего штата страны, сделав Бразилию хрупкой и нестабильной.\n\nТеперь, когда в стране установилось более прочное руководство, республика должна восстановиться, чтобы обеспечить своё будущее."
 COG_GATHERING_STORM_DESC:0 "Бельгийское Конго официально является бельгийской колонией, напрямую управляемой из Брюсселя. На практике генерал-губернатор Пьер Рикманс пользуется определённой автономией из-за удалённости от Европы. Как эксплуатационная колония, особенно включающая «геологический скандал» Катанги, Конго обладает огромными ресурсами. Естественно, их добыча станет одним из приоритетов колониальной администрации. Здесь имеются значительные запасы вольфрама, меди, каучука и, конечно же, доступ к богатейшему в мире месторождению урановой руды."
 CUB_GATHERING_STORM_DESC:0 "После восстания сержантов, свергнувшего президента Карлоса Мануэля де Сеспедеса-и-Кесаду, который сам лишь временно занял пост после падения диктатора Херардо Мачадо, одно временное правительство сменяло другое, всё ещё находясь под пристальным контролем Фульхенсио Батисты, теперь главы армии.\n\nМногие видят в январских всеобщих выборах возможность возвращения стабильного правительства, однако столь же легко Куба может вновь скатиться в спираль беспорядков."
 CZE_GATHERING_STORM_DESC:0 "Прошло почти 20 лет с тех пор, как Чехословакия обрела независимость от Австро-Венгерской империи, и небольшая страна теперь входит в число наиболее индустриализированных государств мира.\n\nПриход Гитлера к власти в Германии воодушевил немецкоязычное меньшинство в приграничных районах и усилил международное давление. Франция, традиционный союзник Чехословакии, переживает внутренний политический кризис, а дипломатическое влияние Малой Антанты постепенно ослабевает. Европа меняется."
 DEN_GATHERING_STORM_DESC:0 "После тяжёлого поражения в Наполеоновских войнах Дания неизменно придерживалась полного нейтралитета, оставшись в стороне даже от Великой войны. Однако быстро усиливающаяся и всё более агрессивная Германия на юге тревожит как датских руководителей, так и граждан. Её стремительное перевооружение может вынудить страну принять неприятные меры мобилизации. Теперь Торвальд Стаунинг должен сохранить Данию нейтральной и свободной."
 HON_GATHERING_STORM_DESC:0 "После того как Тибурсио Кариас Андино едва выиграл президентские выборы 1932 года, он подавил все формы политической оппозиции, одновременно поддерживая интересы United Fruit Company. Лидер BOC Мануэль Каликс Эррера был арестован и заключён на островах Баия после организации нескольких забастовок рабочих в том же году. Теперь Гондурас стоит на перепутье. Продолжит ли Кариас правление, свергнут ли его беспокойные кампесино или United Fruit Company попытается захватить страну?"
 ICE_GATHERING_STORM_DESC:0 "Датско-исландский Акт об унии, соглашение с Данией, подписанное 1 декабря 1918 года и рассчитанное на 25 лет, признал Исландию полностью суверенным и независимым государством в личной унии с Данией. Правительство Исландии открыло посольство в Копенгагене и поручило Дании вести от его имени отдельные вопросы обороны и внешней политики при условии консультаций с Альтингом."
 IRE_GATHERING_STORM_DESC:0 "Ирландия уже много лет находится в тяжёлом положении. После обретения независимости от Британии страна оказалась втянута в бесконечную торговую войну с Соединённым Королевством, а вопрос конституционного устройства всё ещё остаётся открытым."
 LAT_GATHERING_STORM_DESC:0 "Латвия стоит на перепутье. На востоке наш прежний властитель — Россия — преобразился в Советский Союз и жадно смотрит на запад. На западе возродившаяся Германия перестроилась и кажется как никогда готовой уничтожить страны Балтии. Следующие несколько лет станут для Латвии вопросом жизни и смерти. Присоединимся ли мы к одному из этих гигантов или выберем собственный путь? Ответ даст лишь время, но его остаётся всё меньше."
 SWI_GATHERING_STORM_DESC:0 "После Венского конгресса 1815 года, состоявшегося после поражения Наполеона, Швейцарская Конфедерация обязана сохранять нейтралитет в конфликтах между другими государствами. Однако с ростом фашистских режимов в Германии, Италии и даже Австрии сможет ли Швейцария и дальше придерживаться нейтралитета? Или ей придётся выбрать сторону в возможной будущей войне?"
 TIB_GATHERING_STORM_DESC:0 "Тибет может казаться очень стабильной изолированной полуфеодальной теократией, но это далеко от истины. Несколько лет назад коммунистические и демократические движения были жёстко подавлены правящей религиозной и светской аристократией. Стране необходимо реформировать армию, однако монастыри опасаются современной армии, способной бросить вызов их положению. Наконец, страной правит регент, а реинкарнацию Далай-ламы ещё предстоит найти и короновать, чтобы сохранить теократическую систему."
 VIN_GATHERING_STORM_DESC:0 "§RНе выбирайте Вьетнам на этом экране! Если хотите играть за него, выберите соответствующую ветку дерева Французского Индокитая.§!\n\nИзгнав французскую администрацию силой оружия, Вьетнам обрёл независимость и освободился от столетий колониального угнетения.\nУход Франции оставил страну с множеством нерешённых проблем: необразованной рабочей силой, политическими конфликтами и соседями, которые вполне могут оказаться враждебными."
 SAU_GATHERING_STORM_DESC:0 "После поражения шерифа Хусейна ибн Али, эмира Хиджаза, Абдулазиз ибн Абдуррахман ибн Фейсал ибн Фейсал ибн Турки ибн Абдаллах ибн Мухаммад Аль Сауд начал более пятнадцати лет войн за объединение значительной части Аравии под властью династии Саудитов. Этот процесс завершился в 1932 году созданием Королевства Саудовская Аравия.\n\nСаудовская экономика всё ещё крайне нестабильна, и значительная часть государственных доходов поступает от паломничества в священные города Мекку и Медину. Однако недра страны могут скрывать настоящее сокровище, которое навсегда изменит экономическое и геополитическое будущее Аравии."
 LIT_GATHERING_STORM_DESC:0 "Литва возникла после Великой войны в трудном положении. Её едва не включили в немецкий колониальный проект Обер Ост, а поляки сумели захватить Вильнюс и присоединить его к новому польскому государству. В отличие от большинства стран региона, обеспокоенных главным образом амбициями нацистов и возможным возвращением СССР, мы остаёмся страной без собственной официальной столицы, оккупированной теми, кто столетиями был нашим партнёром..."
 SWE_GATHERING_STORM_DESC:0 "Сохранив нейтралитет во время Великой войны, Швеция вышла из разорившего Европу конфликта невредимой и наблюдала падение империй по всему континенту.\n\nНе прошло и тридцати лет, а на горизонте уже собирается новая буря. Фашисты на юге готовятся к очередной войне, а на востоке пока дремлет русский медведь. Впереди тёмные времена, и путь Швеции снова становится неопределённым."
 r56_AFG_GATHERING_STORM_DESC:0 "Рождённый среди пепла кровопролитной Третьей англо-афганской войны, Афганистан на протяжении веков оставался полем битвы империй. Эта небольшая и хрупкая страна всё ещё страдает от последствий гражданской войны 1929 года, разорвавшей бедную нацию на части и вызвавшей резкий спад афганской экономики. \n\nПосле жестокого убийства Надир-шаха в 1933 году страной де-факто управляет Регентский совет, надзирающий за действиями юного Мухаммада Захир-шаха. Однако на горизонте сгущаются тёмные тучи, и будущее Афганистана остаётся неопределённым..."
 BUL_GATHERING_STORM_DESC:0 "После того как царь Борис сверг военный режим Кимона Георгиева, Болгария становилась всё более абсолютистской, всё дальше отходя от гарантий собственной конституции, принятой после обретения независимости. Окружённая бывшими врагами и значительно уменьшившаяся после последовательных поражений во Второй Балканской и Великой войнах, страна видит рост реваншистских идеологий. Они вполне могут снова привести Болгарию на путь войны."
 CHI_GATHERING_STORM_DESC:0 "Некогда самая могущественная страна на Земле, Китай был унижен почти столетием западного империализма и внутренних конфликтов.\n\nЧан Кайши и Гоминьдан, центральное правительство Китая, теперь сталкиваются с угрозами как со стороны Японской империи, уже аннексировавшей огромные территории Китая, так и со стороны коммунистов Мао, укрепившихся в горах Шэньси. Окружённый врагами со всех сторон, Чан готовит Китай к войне, подобной которой страна ещё не видела."
 CHL_GATHERING_STORM_DESC:0 "Недавняя история Чили отмечена переворотами, гражданскими конфликтами и властью политических сильных фигур. Однако многие политические круги надеются, что страна сможет вернуться к демократии и стабильности. Для демократической коалиции, называющей себя «Народным фронтом», задача будет непростой. Среди её противников — нынешний лидер и диктатор Чили Артуро Алессандри, желающий лишь гибели коалиции. Радикальные профсоюзы пытаются перехватить контроль над «Народным фронтом» и направить его по марксистскому пути. Тем временем фашистское движение нацистов с каждым днём привлекает всё больше сторонников."
 EGY_GATHERING_STORM_DESC:0 "Королевство Египет остаётся в тупиковом положении. Прошло почти 15 лет с одностороннего провозглашения независимости от Британской империи, но последняя по-прежнему твёрдо намерена сохранить страну в качестве постоянной военной базы для защиты своей глобальной империи. Всё более воинственная Италия на западе лишь укрепляет это стремление.\n\nГлавной целью Египта всегда было достижение полной независимости и превращение в доминирующую силу региона. Возможно, теперь настало время раз и навсегда осуществить эти мечты?"
 FRI_GATHERING_STORM_DESC:0 "Жемчужина французской колониальной империи, Индокитай является самой прибыльной французской колонией. Предназначенная прежде всего для экономической эксплуатации благодаря многочисленным сырьевым ресурсам, французская власть здесь сравнительно слаба. Администрация в основном опирается на поддержку местных элит и знаменитых индокитайских стрелков.\n\nФранцузское присутствие постоянно оспаривалось, а последним крупным выступлением стал мятеж в Йенбае в 1930 году. Экономическое опустошение, вызванное Великой депрессией, вполне может привести к новой волне протестов."
 GUA_GATHERING_STORM_DESC:0 "После победы на выборах, в которых он был единственным кандидатом, Хорхе Убико стал хозяином Гватемалы. Его правление характеризуется милитаризацией множества институтов, включая почтовую службу, назначением военных на высокие должности, всё более проамериканской политикой и укреплением United Fruit Company, контролирующей значительную часть земли, единственную железную дорогу и производство электроэнергии.\n\nОднако восхищение Наполеоном может подтолкнуть Убико пересмотреть проамериканский курс и политику сохранения статус-кво в пользу более националистического и панцентральноамериканского направления."
 INS_GATHERING_STORM_DESC:0 "Невнимательному наблюдателю Индонезия может показаться стабильной колонией, но для живущих там ситуация куда напряжённее. Колониальный режим держится на сочетании репрессий против местного населения и тесных связей с его аристократией. Однако с начала века появляются националистические организации, требующие большей автономии и прав. Наиболее радикальные из них добиваются конца колониального правления и ищут поддержку в революционных идеологиях."
 LIE_GATHERING_STORM_DESC:0 "Лихтенштейн тщательно управлял политикой нейтралитета с 1868 года, оставаясь вне Великой войны. Тем не менее, нация все еще сильно пострадала от эха, которое привело к скромной революции в 1918 году и введению новой конституции с политическим присоединением к Швейцарии.\n\nОднако угрозы для Лихтенштейна вновь возрастают как внутри страны, так и за ее пределами. Неспокойные времена могут представлять серьезную опасность для страны, и ей придется ездить по скользкому склону, чтобы не стать простой сноской в истории."
 MEN_GATHERING_STORM_DESC:0 "Когда барабаны войны стихли над холмами Маньчжурии, имперские амбиции Японии окончательно оформились, поставив под угрозу само существование любого китайского государства. Годы постоянных конфликтов и борьбы за влияние во Внутренней Монголии лишь усилили японскую хватку, а Квантунская армия стала главным орудием этого влияния.\n\nУже много лет страной управляют политическая анархия и беспорядок, порождая крайне непопулярные решения и нерешительность... Достаточно одной искры, чтобы Внутренняя Монголия вспыхнула..."
 MEX_GATHERING_STORM_DESC:0 "\n\nМексика переживает последние дни Максимато — периода, когда бывший президент Плутарко Элиас Кальес сохранял реальную власть, опираясь на правых сторонников в политике и армии. С 1934 года Ласаро Карденас дель Рио ведёт политическую борьбу за прекращение контроля Кальеса над страной и проведение собственных левых реформ. Пока мир готовится к войне, Мексика стоит на перепутье, а левые и правые борются за её будущее и место в грядущем новом мировом порядке."
 MON_GATHERING_STORM_DESC:0 "На перекрёстке миров Монголия обрела своё место после провозглашения независимости от империи Цин в 1911 году. Советская помощь превратила страну в Народную Республику, которая за последние годы пережила масштабные государственные и экономические преобразования. \n\nНо с новой угрозой на востоке, продолжающейся Гражданской войной в Китае на юге и ухудшающимися отношениями с СССР страна может превратиться в новый фронтир, если баланс сил качнётся не в ту сторону..."
 MPL_GATHERING_STORM_DESC:0 "С момента создания Британского мандата в Палестине в 1923 году нестабильность стала нормой. \nПосле массовой еврейской иммиграции вслед за Декларацией Бальфура несколько местных правительств с обеих сторон борются за контроль над регионом, имея собственные военизированные организации, которые значительно превосходят численностью небольшой британский гарнизон.\nПосле серии инцидентов напряжённость достигла предела. Вопрос остаётся открытым: смогут ли британцы удержаться? Погрузится ли регион в ещё более тяжёлые столкновения? Или появится неожиданное решение?"
 NIC_GATHERING_STORM_DESC:0 "Шрамы восстания Аугусто Сесара Сандино против правительства и американских оккупационных войск всё ещё заметны в никарагуанском обществе и политике, особенно после краха экономики, основанной главным образом на экспорте кофе, вследствие Великой депрессии.\n\nХуан Баутиста Сакаса, ставший президентом в 1933 году, наблюдал и отчасти способствовал возвышению главы Национальной гвардии Анастасио Сомосы Гарсии, организовавшего убийство Сандино в 1934 году.\n\nПохоже, падение Сакасы уже близко..."
 NOR_GATHERING_STORM_DESC:0 "Начало XX века стало для Норвегии почти золотым веком. Независимость, экономический рост, полярные исследования и развитие торгового флота укрепили национальную уверенность. Однако мировой экономический кризис ударил и по Норвегии, а политические противоречия усилились.\n\nТеперь, когда Европа вновь приближается к войне, стране предстоит решить, сможет ли она сохранить нейтралитет или будет вынуждена выбрать сторону."
 PRC_GATHERING_STORM_DESC:0 "Коммунистическая партия Китая находится на грани уничтожения. После неудавшейся революции армии коммунистов были разбиты Гоминьданом на всех фронтах, и они бежали с баз в Южном Китае в новый опорный район в Шэньси. Из этой катастрофы вышел новый лидер партии — Мао Цзэдун.\n\nМао принёс радикально новое видение коммунизма и новую стратегию выживания и расширения. Возможно, коммунисты сумеют объединиться с бывшими врагами против более опасного противника…"
 PRU_GATHERING_STORM_DESC:0 "После смерти националистического лидера Санчеса Серро в 1933 году Республика Перу погрузилась в глубокий внутренний и внешний политический кризис, и его место занял глава вооружённых сил Оскар Бенавидес.\nТяжёлый кризис внутри страны привёл экономику к невиданному застою и серьёзным трудностям накануне демократических выборов 1936 года, хотя в некоторых кругах ходят слухи, что Бенавидес намерен сохранить власть."
 r56_ROM_GATHERING_STORM_DESC:0 "После окончания Великой войны над Российской, Османской и Австро-Венгерской империями сгущались сумерки, а Румыния, сражавшаяся на стороне Антанты, стала безусловным гегемоном Балкан.\nОднако внутри страны далеко не всё благополучно. С самого начала правления короля Кароля хрупкая демократия борется с ним за власть, а Железная гвардия Кодряну ждёт удобного момента для удара.\nТеперь, когда возрождающаяся Германия стремится расширить своё влияние на Балканах, а новая коммунистическая угроза на востоке присматривается к бывшим территориям, Румынии придётся тщательно выбирать друзей, иначе в дверь постучится старый враг."
 SPR_GATHERING_STORM_DESC:0 "Испанской Республике всего пять лет, но она уже столкнулась с нестабильностью с обеих сторон политического спектра. Провал Астурийского восстания 1934 года оставил глубокий след в обществе, а коррупция правительства Алехандро Лерруса лишь усилила недоверие населения и его радикализацию.\n\nСлева находится Народный фронт, объединённый антифашизмом и стремлением реформировать республику, а справа CEDA всё сильнее склоняется к авторитаризму и корпоративизму, тогда как Фаланга становится всё более угрожающей."
 URG_GATHERING_STORM_DESC:0 "Хотя Уругвай был одной из самых стабильных стран Южной Америки, переворот Габриэля Терры стал потрясением для небольшого государства. Репрессии режима вынудили многих политиков и интеллектуалов бежать, прежде всего в Аргентину.\n\nОднако диктатура ещё далека от полной устойчивости: первая попытка революционного переворота произошла в 1935 году и вполне может оказаться не последней."
 VEN_GATHERING_STORM_DESC:0 "Смерть диктатора Хуана Висенте Гомеса в конце 1935 года вызвала беспрецедентную борьбу за власть и вопрос о том, кто станет его преемником; даже предстоящие выборы не дают ясного ответа.\n\nСтрана страдает от повсеместной коррупции и сильно зависит от экспорта нефти, поэтому Соединённым Штатам Венесуэлы может быть трудно найти своё место в мире, где напряжённость стремительно растёт."
 MEX_BLITZKRIEG_DESC:0 "\n\nМаксимато завершилось, Кальес ушёл, но борьба между левым и правым крылом продолжается. Экономические трудности, вызванные эмбарго против PEMEX, радикализировали правых, которые теперь фактически ведут политическую гражданскую войну за право выдвинуть своего кандидата на президентских выборах следующего года. Доминирующая PRI тем временем стоит перед выбором: поступиться принципами ради умеренного Камачо или удвоить ставку на левого кандидата Мухику."
 NOR_BLITZKRIEG_DESC:0 "Начало XX века стало для Норвегии почти золотым веком. Независимость, экономический рост, полярные исследования и развитие торгового флота укрепили национальную уверенность. Однако мировой экономический кризис ударил и по Норвегии, а политические противоречия усилились.\n\nТеперь, когда Европа вновь приближается к войне, стране предстоит решить, сможет ли она сохранить нейтралитет или будет вынуждена выбрать сторону."
