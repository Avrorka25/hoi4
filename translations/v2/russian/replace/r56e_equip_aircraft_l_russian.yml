 USA_scout_plane_equipment_1:0 "Локхид F-4"
 USA_scout_plane_equipment_1_desc:0 "Вариант P-38 «Лайтнинг», предназначенный для фоторазведки. Он обеспечивал воздушное наблюдение за перемещениями вражеских войск и развёртыванием флота с помощью камер, установленных на месте обычного вооружения самолёта. Эти машины могли летать на больших высотах, обладали большой дальностью и высокой скоростью, благодаря чему хорошо подходили для разведывательных задач."
 USA_scout_plane_equipment_1_short:0 "F4"
 USA_scout_plane_equipment_2:0 "Консолидейтед F-7"
 USA_scout_plane_equipment_2_desc:0 "Вариант B-24 «Либерейтор», оснащённый камерами для ведения воздушной фоторазведки. Благодаря увеличенным дальности и продолжительности полёта F-7 хорошо подходил для картографических задач. В носовой части размещалась триметрогонная камера, а в заднем бомбоотсеке — пара вертикальных камер, при этом стандартное оборонительное вооружение бомбардировщика сохранялось."
 USA_scout_plane_equipment_2_short:0 "F6"
 USA_transport_plane_equipment_1:0 "Дуглас DC-3"
 USA_transport_plane_equipment_1_short:0 "DC-2"
