 strat_maritime_equipment_3_short:0 "Тяжёлый морской бомбардировщик '44"
 strat_maritime_equipment_3_desc:0 "Тяжёлый бомбардировщик, модифицированный для морского патрулирования, наблюдения, борьбы с кораблями и подводными лодками."
 flying_boat:0 "Морская патрульная авиация"
 flying_boat_equipment:0 "Морская патрульная авиация"
 flying_boat_equipment_desc:0 "Морские патрульные самолёты выполняют задачи наблюдения, борьбы с кораблями и подводными лодками на больших расстояниях, защищая национальные морские зоны, торговые маршруты и операции союзного флота."
 flying_boat_equipment_0:0 "Морская патрульная авиация '30"
 flying_boat_equipment_0_short:0 "Морская патрульная авиация '30"
 flying_boat_equipment_0_desc:0 "Военная ценность гидросамолётов была хорошо известна, и к началу войны каждая страна, имевшая выход к воде, использовала их в военных целях. Они выполняли самые разные задачи — от противолодочного патрулирования до морских спасательных операций и корректировки артиллерийского огня линкоров."
 flying_boat_equipment_1:0 "Морская патрульная авиация '36"
 flying_boat_equipment_1_short:0 "Морская патрульная авиация '36"
 flying_boat_equipment_1_desc:0 "Развитие конструкции и производства авиационных двигателей позволило нам строить более крупные и тяжёлые самолёты с большей дальностью и боевой нагрузкой."
 flying_boat_equipment_2:0 "Морская патрульная авиация '40"
 flying_boat_equipment_2_short:0 "Морская патрульная авиация '40"
 flying_boat_equipment_2_desc:0 "Внедрив новые электронные технологии обнаружения, мы сможем повысить эффективность наших бомбардировщиков."
 flying_boat_equipment_3:0 "Морская патрульная авиация '44"
 flying_boat_equipment_3_short:0 "Морская патрульная авиация '44"
 flying_boat_equipment_3_desc:0 "Хотя возможность взлетать с любого крупного водоёма и садиться на него уже не столь необходима, как всего 6 лет назад, мы всё ещё можем использовать летающие лодки и амфибии, чтобы расширить радиус действий над океаном. Их большая дальность и длительное время патрулирования крайне важны для морского патрулирования и противолодочных операций."
 rocket_interceptor_equipment_desc:0 "Перехватчик малого радиуса действия с химическим ракетным двигателем."
 rocket_interceptor_equipment:0 "Реактивный перехватчик"
 rocket_interceptor_equipment_1:0 "Ракетный перехватчик 43"
 rocket_interceptor_equipment_1_short:0 "Ракетный перехватчик '43"
 rocket_interceptor_equipment_1_desc:0 "Экспериментальный перехватчик малого радиуса действия с ненадёжным химическим ракетным двигателем."
 rocket_interceptor_equipment_2:0 "Ракетный перехватчик '45"
 rocket_interceptor_equipment_2_short:0 "Ракетный перехватчик '45"
 rocket_interceptor_equipment_2_desc:0 "Перехватчик малого радиуса действия с несколько более надёжным химическим ракетным двигателем."
 rocket_interceptor_equipment_3:0 "Ракетный перехватчик 48"
 rocket_interceptor_equipment_3_short:0 "Ракетный перехватчик '48"
 rocket_interceptor_equipment_3_desc:0 "Наконец мы устранили большинство проблем ракетных двигателей, и теперь ракетный перехватчик стал надёжным средством ближней обороны важных объектов."
 jet_technology:0 "Реактивная авиация"
 jet_fighter:0 "Истребитель"
 jet_fighter_equipment_desc:0 "Истребители быстры и манёвренны и способны выполнять множество задач: от завоевания превосходства в воздухе и защиты наших бомбардировщиков до перехвата вражеских бомбардировщиков."
 jet_fighter_equipment_1:0 "Реактивный истребитель '45"
 jet_fighter_equipment_1_short:0 "Реактивный истребитель '45"
 jet_fighter_equipment_1_desc:0 "Прежние достижения в увеличении скорости меркнут на фоне появления первых реактивных истребителей. Нам ещё предстоит научиться создавать такие двигатели наилучшим образом, но обычные поршневые истребители уже не могут с ними соперничать."
 jet_fighter_equipment_2:0 "Реактивный истребитель '50"
 jet_fighter_equipment_2_short:0 "Реактивный истребитель '50"
 jet_fighter_equipment_2_desc:0 "Новые конструкции стреловидного крыла и применение более лёгких материалов позволят ещё сильнее увеличить дальность и скорость революционных реактивных истребителей."
 jet_fighter_equipment_x:0 "Реактивный истребитель '55"
 jet_fighter_equipment_x_short:0 "Реактивный истребитель '55"
 jet_fighter_equipment_x_desc:0 "Современный реактивный истребитель, созданный с применением новейших технологий."
 cv_jet_fighter:0 "Палубный реактивный истребитель"
 cv_jet_fighter_equipment:0 "Палубный реактивный истребитель"
 cv_jet_fighter_equipment_1:0 "Палубный реактивный истребитель '45"
 cv_jet_fighter_equipment_1_short:0 "Палубный реактивный истребитель '45"
 cv_jet_fighter_equipment_1_desc:0 "Ранний реактивный самолёт, модифицированный для взлёта с авианосцев и посадки на них."
 cv_jet_fighter_equipment_2:0 "Палубный реактивный истребитель '50"
 cv_jet_fighter_equipment_2_short:0 "Палубный реактивный истребитель '50"
 cv_jet_fighter_equipment_2_desc:0 "Улучшенный реактивный самолёт, модифицированный для взлёта с авианосцев и посадки на них."
 cv_jet_fighter_equipment_x:0 "Палубный реактивный истребитель '55"
 cv_jet_fighter_equipment_x_short:0 "Палубный реактивный истребитель '55"
 cv_jet_fighter_equipment_x_desc:0 "Современный реактивный самолёт, модифицированный для взлёта с авианосцев и посадки на них."
 jet_tac_bomber:0 "Реактивный тактический бомбардировщик"
 jet_tac_bomber_equipment:0 "Реактивный тактический бомбардировщик"
 jet_tac_bomber_equipment_desc:0 "Тактические бомбардировщики — это небольшие быстрые самолёты, способные поддерживать наземные войска и наносить удары по вражеским зданиям."
 jet_tac_bomber_equipment_1:0 "Реактивный тактический бомбардировщик '45"
 jet_tac_bomber_equipment_1_short:0 "Реактивный тактический бомбардировщик '45"
 jet_tac_bomber_equipment_1_desc:0 "Появление реактивных истребителей требует создания бомбардировщиков, способных сравняться с ними в скорости или превзойти их. Эту роль выполнят средние бомбардировщики и истребители-бомбардировщики первого поколения, оснащённые реактивными двигателями."
 jet_tac_bomber_equipment_2:0 "Реактивный тактический бомбардировщик '50"
 jet_tac_bomber_equipment_2_short:0 "Реактивный тактический бомбардировщик '50"
 jet_tac_bomber_equipment_2_desc:0 "Одной скорости уже недостаточно: будущие реактивные бомбардировщики будут ставить рекорды высоты и дальности, доставляя боевую нагрузку и выполняя разведку в межконтинентальных миссиях."
 jet_tac_bomber_equipment_x:0 "Реактивный тактический бомбардировщик '55"
 jet_tac_bomber_equipment_x_short:0 "Реактивный тактический бомбардировщик '55"
 jet_tac_bomber_equipment_x_desc:0 "Современный реактивный тактический бомбардировщик, созданный с применением новейших технологий."
 jet_strat_bomber:0 "Тяжёлый реактивный бомбардировщик"
 jet_strat_bomber_equipment:0 "Тяжёлый реактивный бомбардировщик"
 jet_strat_bomber_equipment_desc:0 "Тяжёлые бомбардировщики наносят удары по вражеским зданиям и инфраструктуре, лишая противника жизненно важных промышленных мощностей."
 jet_strat_bomber_equipment_1:0 "Тяжёлый реактивный бомбардировщик '50"
 jet_strat_bomber_equipment_1_short:0 "Тяжёлый реактивный бомбардировщик '50"
 jet_strat_bomber_equipment_1_desc:0 "Несколько реактивных двигателей обеспечивают новым конструкциям беспрецедентную скорость при сохранении большой боевой нагрузки и дальности. Эти самолёты создаются для новой эпохи оружия массового уничтожения."
 jet_strat_bomber_equipment_x:0 "Тяжёлый реактивный бомбардировщик '55"
