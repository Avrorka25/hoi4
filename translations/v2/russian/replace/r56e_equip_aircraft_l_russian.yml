 USA_CAS_equipment_0_short:0 "Фэлкон"
 USA_CAS_equipment_1:0 "Нортроп A-17"
 USA_CAS_equipment_1_desc:0 "Нортроп A-17 был двухместным одномоторным монопланом с неубираемым шасси, состоявшим на службе Воздушного корпуса армии США. Он оснащался перфорированными закрылками, внутренним фюзеляжным бомбоотсеком для осколочных бомб и внешними бомбодержателями. Самолёт показал себя надёжной машиной для пикирующего бомбометания и пользовался популярностью у экипажей."
 USA_CAS_equipment_1_short:0 "A-17"
 USA_CAS_equipment_2:1 "Дуглас A-20 Хэвок"
 USA_CAS_equipment_2_desc:1 "«Хэвок» создавался как штурмовик для Воздушного корпуса армии США и оснащался двигателями Пратт энд Уитни «Твин Уосп». Лётчики-испытатели хвалили самолёт за приятное управление и манёвренность, сравнимую с истребителем."
 USA_CAS_equipment_2_short:1 "Хэвок"
 USA_CAS_equipment_3:1 "Дуглас A-26 Инвейдер"
 USA_CAS_equipment_3_desc:1 "Быстрый A-26 «Инвейдер» был штурмовиком, способным нести значительную бомбовую нагрузку."
