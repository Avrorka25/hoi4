 HOL_flying_boat_equipment_1:0 "Фоккер T.IVa"
 HOL_flying_boat_equipment_1_short:0 "T.IVa"
 HOL_flying_boat_equipment_1_desc:0 "Фоккер T.IV был разработан в соответствии с требованиями Королевского военно-морского флота Нидерландов к морскому патрульному самолёту-торпедоносцу для применения в Голландской Ост-Индии. Самолёт мог нести либо одну торпеду, либо 800 кг бомб и имел оборонительное вооружение из трёх пулемётов, размещённых в носовой, верхней и нижней установках."
 HOL_flying_boat_equipment_2:0 "Фоккер T.VIII"
 HOL_flying_boat_equipment_2_short:0 "T.VIII"
 HOL_flying_boat_equipment_2_desc:0 "Фоккер T.VIII был нидерландским двухмоторным торпедоносцем и разведывательным гидросамолётом, состоявшим на службе в военно-воздушных силах Нидерландов, Великобритании и Германии. Изначально самолёт разрабатывался по запросу Авиационной службы ВМС Нидерландов для применения в территориальных водах и Голландской Ост-Индии."
