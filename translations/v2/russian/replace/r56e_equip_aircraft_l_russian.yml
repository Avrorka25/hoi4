 HOL_nav_bomber_equipment_3_desc:0 "Этот проект Кулховена представлял собой многоцелевой истребитель-бомбардировщик, предназначенный для выполнения задач морской авиации таких стран, как Португалия, Швеция и Норвегия. Заказов не последовало, а разработка была прекращена из-за операции «Фалль Гельб»."
