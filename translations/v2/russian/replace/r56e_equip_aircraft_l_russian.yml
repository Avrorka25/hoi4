l_russian:
 basic_iff:0 "Базовая система опознавания «свой-чужой»"
 basic_iff_desc:0 "Знание того, кто свой, а кто чужой, значительно повышает способность самолёта эффективно атаковать цели."
 improved_iff:0 "Улучшенная система опознавания «свой-чужой»"
 improved_iff_desc:0 "Знание того, кто свой, а кто чужой, значительно повышает способность самолёта эффективно атаковать цели."
 AA_rocket_rails:0 "Направляющие ракет «воздух-воздух»"
 AA_rocket_rails_desc:0 "Один удар — одна цель."
 guided_AA_rocket_rails:0 "Направляющие управляемых ракет «воздух-воздух»"
 guided_AA_rocket_rails_desc:0 "Траекторию управляемых ракет «воздух-воздух» можно корректировать в полёте, повышая их точность."
 improved_rocket_rails:0 "Улучшенные ракетные направляющие"
 improved_rocket_rails_desc:0 "Лучшие ракеты — для лучшей пиротехники."
 jet_engine_1x_2:0 "1x Реактивный двигатель II"
 jet_engine_1x_2_desc:0 "Улучшенный реактивный двигатель. Больше ничего сказать не могу, потому что я годами делал моды вместо того, чтобы пытаться получить инженерное образование."
 jet_engine_2x_2:0 "2x Реактивный двигатель II"
 jet_engine_2x_2_desc:0 "Знаете что, давайте поставим на этот планер два таких красавца... Да, должно сработать."
 jet_engine_3x_2:0 "3x Реактивный двигатель II"
 jet_engine_3x_2_desc:0 "Нет, я передумал, давайте поставим 3 двигателя. Знаю, это несбалансированно, но один можно воткнуть в фюзеляж или сверху — придумайте что-нибудь, я вам за это и плачу. Первый прототип жду через 3 недели."
 jet_engine_4x_2:0 "4x Реактивный двигатель II"
 jet_engine_4x_2_desc:0 "А нельзя ли заставить ещё более крупный планер взлететь с четырьмя двигателями?"
 jet_engine_6x_2:0 "6x Реактивный двигатель II"
 jet_engine_6x_2_desc:0 "Я люблю реактивные самолёты, люблю реактивные самолёты — тащите мне все реактивные двигатели, какие только найдёте."
 jet_engine_1x_3:0 "1x Реактивный двигатель III"
 jet_engine_1x_3_desc:0 "Лучший из доступных реактивных двигателей."
 jet_engine_2x_3:0 "2x Реактивный двигатель III"
 jet_engine_2x_3_desc:0 "Два двигателя — вдвое больше реактивной тяги"
 jet_engine_3x_3:0 "3x Реактивный двигатель III"
 jet_engine_3x_3_desc:0 "На 50% больше тяги, чем с 2 двигателями"
 jet_engine_4x_3:0 "4x Реактивный двигатель III"
 jet_engine_4x_3_desc:0 "Четыре современных реактивных двигателя"
 jet_engine_6x_3:0 "6x Реактивный двигатель III"
 jet_engine_6x_3_desc:0 "Максимальное количество лучших доступных двигателей. Ещё больше — и пришлось бы писать новостное событие о преодолении звукового барьера."
 early_fighter:0 "Лёгкая авиация"
 early_fighter_desc:0 "Воздушная война времён Великой войны показала странам важность тактических бомбардировок, воздушной разведки и превосходства в воздухе, определив будущее военной авиации."
 cv_early_fighter:0 "Лёгкая палубная авиация"
 cv_early_fighter_desc:0 "Страны осознали важнейшую роль палубной авиации: авианосцы стали мобильными авиабазами для разведки, защиты флота и нанесения ударов, коренным образом изменив стратегию войны на море."
 maritime:0 "Морская патрульная авиация"
 AIR_TITLE_TRANSPORT_PLANE:0 "Транспортные самолёты"
 transport_plane:0 "Транспортная авиация"
 transport_plane_equipment:0 "Транспортный самолет"
 transport_plane_equipment_desc:0 "Доставляет десантников к месту высадки."
 transport_plane_equipment_1:0 "Ранний транспортный самолёт"
 transport_plane_equipment_1_short:0 "Транспорт I"
 transport_plane_equipment_1_desc:0 "§LСамолёты, используемые для перевозки войск при воздушно-десантных операциях.§!"
 transport_plane_equipment_2:0 "Улучшенный транспортный самолёт"
 transport_plane_equipment_2_short:0 "Транспортный самолет II"
 transport_plane_equipment_2_desc:0 "§LСамолёты, используемые для перевозки войск при воздушно-десантных операциях.§!"
 transport_plane_equipment_3:0 "Современный транспортный самолет"
 transport_plane_equipment_3_short:0 "Транспортный самолет III"
 transport_plane_equipment_3_desc:0 "§LСамолёты, используемые для перевозки войск при воздушно-десантных операциях.§!"
 scout_plane:0 "Самолёт-разведчик"
 scout_plane_equipment_desc:0 "Самолёт, разработанный специально для фоторазведки. Ради выживания он полагается прежде всего на скорость и скрытность и проиграет в любом открытом бою."
 scout_plane_equipment:0 "Самолёты-разведчики"
 scout_plane_equipment_1:0 "Самолёт-разведчик I"
 scout_plane_equipment_1_desc:0 "С момента первого применения в Великой войне сбор сведений о перемещениях войск противника и передача данных о развёртывании его флота были одной из первоначальных задач авиации и до сих пор остаются крайне важными."
 scout_plane_equipment_2:0 "Самолёт-разведчик II"
 scout_plane_equipment_2_desc:0 "Разрабатывая специализированные самолёты для воздушного наблюдения и дальней разведки, мы сможем получать и сохранять точное представление о намерениях и возможностях противника."
 cas:1 "Непосредственная авиационная поддержка"
 CAS_equipment:0 "Штурмовик"
 CAS_equipment_desc:0 "Самолёты непосредственной авиационной поддержки предназначены для поддержки сухопутных войск в бою."
 CAS_equipment_0:0 "Штурмовик '30"
 CAS_equipment_0_short:0 "Штурмовик '30"
 CAS_equipment_0_desc:0 "Эти ранние штурмовики, хотя и уступали более поздним моделям, играли важную роль в поддержке наземных войск. Несмотря на ограниченную боевую нагрузку, они могли выполнять штурмовые заходы и простейшие задачи авиационной поддержки."
 CAS_equipment_1:0 "Штурмовик '36"
 CAS_equipment_1_short:0 "Штурмовик '36"
 CAS_equipment_1_desc:0 "Наша доктрина непосредственной авиационной поддержки требует самолёта, способного наносить точные удары по наземным целям. Хотя такие самолёты несут меньшую нагрузку, чем крупные тактические бомбардировщики, они могут атаковать и уничтожать небольшие подходящие цели пулемётно-пушечным огнём и бомбометанием с пикирования."
 CAS_equipment_2:0 "Штурмовик '40"
 CAS_equipment_2_short:0 "Штурмовик '40"
 CAS_equipment_2_desc:0 "Опыт первых лет войны показал, что для выживания штурмовиков под атаками вражеских истребителей и огнём с земли необходимы более высокая скорость, бронезащита и манёвренность. Следующее поколение ударной авиации также получит более крупные бомбы, пушки и пулемёты для нанесения большего урона целям."
 CAS_equipment_3:0 "Штурмовик '44"
 CAS_equipment_3_short:0 "Штурмовик '44"
 CAS_equipment_3_desc:0 "Постоянно растущая эффективность ПВО целей и вражеских перехватчиков требует дальнейшего развития нашей штурмовой авиации. Новый проект предусматривает более мощный двигатель, усовершенствованный планер для лучшего пикирования и защиты, а также ещё большую боевую нагрузку."
 cv_cas:1 "Палубная авиационная поддержка"
 cv_CAS_equipment:1 "Палубный штурмовик"
 cv_CAS_equipment_short:0 "Палуб. штурмовик"
 cv_CAS_equipment_desc:0 "Палубные самолёты непосредственной авиационной поддержки предназначены для атак надводных кораблей."
 cv_CAS_equipment_0:0 "Палубный штурмовик '30"
 cv_CAS_equipment_0_short:0 "Палубный штурмовик '30"
 cv_CAS_equipment_0_desc:0 "Ранний самолёт непосредственной авиационной поддержки, приспособленный для взлёта с авианосцев и посадки на них."
 cv_CAS_equipment_1:0 "Палубный штурмовик '36"
 cv_CAS_equipment_1_short:0 "Палубный штурмовик '36"
 cv_CAS_equipment_1_desc:0 "Ранний самолёт непосредственной авиационной поддержки, приспособленный для взлёта с авианосцев и посадки на них."
 cv_CAS_equipment_2:0 "Палубный штурмовик '40"
 cv_CAS_equipment_2_short:0 "Палубный штурмовик '40"
 cv_CAS_equipment_2_desc:0 "Улучшенный самолёт непосредственной авиационной поддержки, приспособленный для взлёта с авианосцев и посадки на них."
 cv_CAS_equipment_3:0 "Палубный штурмовик '44"
 cv_CAS_equipment_3_short:0 "Палубный штурмовик '44"
 cv_CAS_equipment_3_desc:0 "Усовершенствованный самолёт непосредственной авиационной поддержки, приспособленный для взлёта с авианосцев и посадки на них."
 fighter:0 "Истребитель"
 fighter_equipment:0 "Истребитель"
 fighter_equipment_desc:0 "Истребители быстры и манёвренны и способны выполнять множество задач: от завоевания превосходства в воздухе и прикрытия своих бомбардировщиков до перехвата бомбардировщиков противника."
 fighter_equipment_0:0 "Истребитель '30"
 fighter_equipment_0_short:0 "Истребитель '30"
 fighter_equipment_0_desc:0 "За время Великой войны истребительная авиация сильно изменилась, и схема биплана постепенно устаревает. Мы должны начать применять гражданские технологические достижения в военной сфере."
 fighter_equipment_1:0 "Истребитель '36"
 fighter_equipment_1_short:0 "Истребитель '36"
 fighter_equipment_1_desc:0 "Лёгкие планеры претерпели революционные изменения благодаря внедрению радиальных двигателей, схемы моноплана и цельнометаллической обшивки. Этот проект — наша попытка создать первый современный истребитель."
 fighter_equipment_2:0 "Истребитель '40"
 fighter_equipment_2_short:0 "Истребитель '40"
 fighter_equipment_2_desc:0 "Темпы развития истребительной авиации поражают, поэтому мы должны продолжать внедрять новые технологии и совершенствовать существующие концепции. Наш новый истребитель должен обладать высокой скоростью, отличными характеристиками на высоте и максимально возможной дальностью. Кроме того, он должен быть очень хорошо вооружён."
 fighter_equipment_3:0 "Истребитель '44"
 fighter_equipment_3_short:0 "Истребитель '44"
 fighter_equipment_3_desc:0 "Хотя предыдущие поколения наших истребителей доказали свою ценность, следует использовать любое преимущество, которое даст более совершенная конструкция. Этот самолёт станет вершиной развития поршневых истребителей, сочетая отличную мощность, высокую манёвренность, смертоносное вооружение и хорошую дальность."
 fighter_bomber:0 "Истребитель-бомбардировщик"
 fighter_bomber_equipment:0 "Истребитель-бомбардировщик"
 fighter_bomber_equipment_desc:0 "Истребители-бомбардировщики представляют собой варианты современных или устаревших фронтовых истребителей, оснащённые бомбовым вооружением, дополнительными точками подвески и некоторыми конструктивными изменениями для выполнения задач изоляции поля боя и непосредственной поддержки наземных войск."
 fighter_bomber_equipment_2:0 "Истребитель-бомбардировщик '40"
 fighter_bomber_equipment_2_short:0 "Истребитель-бомбардировщик '40"
 fighter_bomber_equipment_2_desc:0 "Ранний истребитель, переоборудованный для ударов по наземным целям."
 fighter_bomber_equipment_3:0 "Истребитель-бомбардировщик '44"
 fighter_bomber_equipment_3_short:0 "Истребитель-бомбардировщик '44"
 fighter_bomber_equipment_3_desc:0 "Ранний истребитель, переоборудованный для ударов по наземным целям."
 cv_fighter:0 "Палубный истребитель"
 cv_fighter_equipment:0 "Палубный истребитель"
 cv_fighter_equipment_short:0 "Палуб. истребитель"
 cv_fighter_equipment_desc:0 "Истребители быстры и манёвренны и способны выполнять множество задач: от завоевания превосходства в воздухе и прикрытия своих бомбардировщиков до перехвата бомбардировщиков противника."
 cv_fighter_equipment_0:0 "Палубный истребитель '30"
 cv_fighter_equipment_0_short:0 "Палубный истребитель '30"
 cv_fighter_equipment_0_desc:0 "Ранний истребитель, приспособленный для взлёта с авианосцев и посадки на них."
 cv_fighter_equipment_1:0 "Палубный истребитель '36"
 cv_fighter_equipment_1_short:0 "Палубный истребитель '36"
 cv_fighter_equipment_1_desc:0 "Ранний истребитель, приспособленный для взлёта с авианосцев и посадки на них."
 cv_fighter_equipment_2:0 "Палубный истребитель '40"
 cv_fighter_equipment_2_short:0 "Палубный истребитель '40"
 cv_fighter_equipment_2_desc:0 "Улучшенный истребитель, приспособленный для взлёта с авианосцев и посадки на них."
 cv_fighter_equipment_3:0 "Палубный истребитель '44"
 cv_fighter_equipment_3_short:0 "Палубный истребитель '44"
 cv_fighter_equipment_3_desc:0 "Усовершенствованный истребитель, приспособленный для взлёта с авианосцев и посадки на них."
 nav_bomber:0 "Морской бомбардировщик"
 nav_bomber_equipment:0 "Палубный бомбардировщик"
 nav_bomber_equipment_desc:0 "Морские бомбардировщики могут атаковать корабли противника."
 nav_bomber_equipment_0:0 "Морской бомбардировщик '30"
 nav_bomber_equipment_0_short:0 "Морской бомбардировщик '30"
 nav_bomber_equipment_0_desc:0 "Оснащённые примитивными средствами для морских бомбардировок и базовым разведывательным оборудованием, эти самолёты стали промежуточным этапом на пути к более совершенным технологиям морской авиации."
 nav_bomber_equipment_1:0 "Морской бомбардировщик '36"
 nav_bomber_equipment_1_short:0 "Морской бомбардировщик '36"
 nav_bomber_equipment_1_desc:0 "В грядущем десятилетии морская авиация будет жизненно важна для противодействия новым тенденциям морской войны, таким как растущая роль подводных лодок. Гидросамолёты, способные действовать как пикирующие бомбардировщики и разведчики, окажутся весьма полезны."
 nav_bomber_equipment_2:0 "Морской бомбардировщик '40"
 nav_bomber_equipment_2_short:0 "Морской бомбардировщик '40"
 nav_bomber_equipment_2_desc:0 "Новые технологии двигателей и более совершенная аэродинамика значительно повысят скорость морских самолётов и эффективность атак с пикирования."
 nav_bomber_equipment_3:0 "Морской бомбардировщик '44"
 nav_bomber_equipment_3_short:0 "Морской бомбардировщик '44"
 nav_bomber_equipment_3_desc:0 "Цельнометаллические конструкции и мощные воздушные тормоза позволяют применять более сложные приёмы морской авиации. Однако самолётам будущего потребуется больший экипаж для обслуживания этих передовых систем."
 cv_nav_bomber:0 "Палубный морской бомбардировщик"
 cv_nav_bomber_equipment:1 "Палубный бомбардировщик"
 cv_nav_bomber_equipment_short:0 "Палубный бомбардировщик"
 cv_nav_bomber_equipment_desc:0 "Морские бомбардировщики способны наносить удары по кораблям противника."
 cv_nav_bomber_equipment_0:0 "Палубный морской бомбардировщик '30"
 cv_nav_bomber_equipment_0_short:0 "Палубный морской бомбардировщик '30"
 cv_nav_bomber_equipment_0_desc:0 "Предварительная модель морского бомбардировщика, приспособленная для взлёта с авианосцев и посадки на них."
 cv_nav_bomber_equipment_1:0 "Палубный морской бомбардировщик '36"
 cv_nav_bomber_equipment_1_short:0 "Палубный морской бомбардировщик '36"
 cv_nav_bomber_equipment_1_desc:0 "Ранний морской бомбардировщик, приспособленный для взлёта с авианосцев и посадки на них."
 cv_nav_bomber_equipment_2:0 "Палубный морской бомбардировщик '40"
 cv_nav_bomber_equipment_2_short:0 "Палубный морской бомбардировщик '40"
 cv_nav_bomber_equipment_2_desc:0 "Улучшенный морской бомбардировщик, приспособленный для взлёта с авианосцев и посадки на них."
 cv_nav_bomber_equipment_3:0 "Палубный морской бомбардировщик '44"
 cv_nav_bomber_equipment_3_short:0 "Палубный морской бомбардировщик '44"
 cv_nav_bomber_equipment_3_desc:0 "Усовершенствованный морской бомбардировщик, приспособленный для взлёта с авианосцев и посадки на них."
 heavy_fighter:0 "Тяжёлый истребитель"
 heavy_fighter_equipment:0 "Тяжелый истребитель"
 heavy_fighter_equipment_desc:0 "Тяжёлые истребители обладают большой дальностью и мощным вооружением. Они подходят как для дальнего сопровождения бомбардировщиков, так и для перехвата вражеских бомбардировщиков. Однако из-за меньшей манёвренности им трудно противостоять обычным истребителям."
 heavy_fighter_equipment_1:0 "Тяжёлый истребитель '36"
 heavy_fighter_equipment_1_short:0 "Тяжёлый истребитель '36"
 heavy_fighter_equipment_1_desc:0 "Нашим бомбардировщикам требуется защита от вражеских истребителей по пути к целям и обратно. Для такого сопровождения нужно создать истребитель с дальностью полёта бомбардировщика. По необходимости эти самолёты будут крупнее, медленнее и менее манёвренны, чем лёгкие истребители, зато смогут нести мощное вооружение."
 heavy_fighter_equipment_2:0 "Тяжёлый истребитель '40"
 heavy_fighter_equipment_2_short:0 "Тяжёлый истребитель '40"
 heavy_fighter_equipment_2_desc:0 "Война показала, что наши тяжёлые истребители уязвимы перед более манёвренными машинами, зато благодаря мощному вооружению хорошо перехватывают вражеские бомбардировщики. Следующий проект повысит эффективность атак по самолётам противника и даже по наземным целям. Скорость и дальность также будут улучшены."
 heavy_fighter_equipment_3:0 "Тяжёлый истребитель '44"
 heavy_fighter_equipment_3_short:0 "Тяжёлый истребитель '44"
 heavy_fighter_equipment_3_desc:0 "Хотя наши тяжёлые истребители хорошо проявили себя в различных ролях, необходимо разработать новую конструкцию, которая повысит их эффективность против вражеских истребителей и позволит продолжать перехватывать всё более быстрые и лучше защищённые бомбардировщики противника."
 hfighter_bomber:0 "Тяжёлый истребитель-бомбардировщик"
 hfighter_bomber_equipment:0 "Тяжёлый истребитель-бомбардировщик"
 hfighter_bomber_equipment_desc:0 "Тяжёлые истребители-бомбардировщики представляют собой варианты современных или устаревших фронтовых истребителей, оснащённые бомбовым вооружением, дополнительными точками подвески и конструктивными изменениями для выполнения задач изоляции поля боя и непосредственной поддержки наземных войск."
 hfighter_bomber_equipment_1:0 "Тяжёлый истребитель-бомбардировщик '36"
 hfighter_bomber_equipment_1_short:0 "Тяжёлый истребитель-бомбардировщик '36"
 hfighter_bomber_equipment_1_desc:0 "Ранний тяжёлый истребитель, переоборудованный для ударов по наземным целям."
 hfighter_bomber_equipment_2:0 "Тяжёлый истребитель-бомбардировщик '40"
 hfighter_bomber_equipment_2_short:0 "Тяжёлый истребитель-бомбардировщик '40"
 hfighter_bomber_equipment_2_desc:0 "Ранний тяжёлый истребитель, переоборудованный для ударов по наземным целям."
 hfighter_bomber_equipment_3:0 "Тяжёлый истребитель-бомбардировщик '44"
 hfighter_bomber_equipment_3_short:0 "Тяжёлый истребитель-бомбардировщик '44"
 hfighter_bomber_equipment_3_desc:0 "Усовершенствованный тяжёлый истребитель, переоборудованный для ударов по наземным целям."
 tac_bomber:0 "Средний бомбардировщик"
 tac_bomber_equipment:0 "Средний бомбардировщик"
 tac_bomber_equipment_desc:0 "Средние бомбардировщики — быстрые самолёты, способные поддерживать наземные войска и наносить удары по вражеским сооружениям."
 tac_bomber_equipment_0:0 "Средний бомбардировщик '30"
 tac_bomber_equipment_0_short:0 "Средний бомбардировщик '30"
 tac_bomber_equipment_0_desc:0 "Широко распространено мнение, что следующая война будет выиграна исключительно уничтожением противника бомбардировками. Мы должны начать проектировать бомбардировщик, способный нести тяжёлую боевую нагрузку с приемлемой скоростью."
 tac_bomber_equipment_1:0 "Средний бомбардировщик '36"
 tac_bomber_equipment_1_short:0 "Средний бомбардировщик '36"
 tac_bomber_equipment_1_desc:0 "Средние бомбардировщики должны быть универсальными и быстрыми, способными выполнять различные задачи. Двухмоторная конструкция, оставаясь сравнительно лёгкой, сможет приносить пользу ещё долгие годы."
 tac_bomber_equipment_2:0 "Средний бомбардировщик '40"
 tac_bomber_equipment_2_short:0 "Средний бомбардировщик '40"
 tac_bomber_equipment_2_desc:0 "Более тяжёлые конструкции средних бомбардировщиков позволяют увеличить дальность, бомбовую нагрузку и скорость, сохраняя способность самолётов выполнять различные задачи."
 tac_bomber_equipment_3:0 "Средний бомбардировщик '44"
 tac_bomber_equipment_3_short:0 "Средний бомбардировщик '44"
 tac_bomber_equipment_3_desc:0 "Используя достижения истребительной авиации, необычные материалы и формы позволят новым проектам стать одними из самых быстрых и эффективных двухмоторных самолётов из когда-либо созданных."
 med_maritime:0 "Средний морской бомбардировщик"
 med_maritime_equipment:0 "Средняя морская авиация"
 med_maritime_equipment_desc:0 "Средние бомбардировщики, оборудованные для морского патрулирования, разведки, борьбы с кораблями и подводными лодками."
 med_maritime_equipment_1:0 "Средняя морская авиация '36"
 med_maritime_equipment_1_short:0 "Средняя морская авиация '36"
 med_maritime_equipment_1_desc:0 "Средний бомбардировщик, модифицированный для морского патрулирования, наблюдения, борьбы с кораблями и подводными лодками."
 med_maritime_equipment_2:0 "Средний морской бомбардировщик '40"
 med_maritime_equipment_2_short:0 "Средний морской бомбардировщик '40"
 med_maritime_equipment_2_desc:0 "Средний бомбардировщик, модифицированный для морского патрулирования, наблюдения, борьбы с кораблями и подводными лодками."
 med_maritime_equipment_3:0 "Средний морской бомбардировщик '44"
 med_maritime_equipment_3_short:0 "Средний морской бомбардировщик '44"
 med_maritime_equipment_3_desc:0 "Средний бомбардировщик, модифицированный для морского патрулирования, наблюдения, борьбы с кораблями и подводными лодками."
 strat_bomber:0 "Тяжёлый бомбардировщик"
 strat_bomber_equipment:0 "Тяжёлый бомбардировщик"
 strat_bomber_equipment_desc:0 "Тяжёлые бомбардировщики наносят удары по вражеским зданиям и инфраструктуре, лишая противника жизненно важных промышленных мощностей."
 strat_bomber_equipment_1:0 "Тяжёлый бомбардировщик '36"
 strat_bomber_equipment_1_short:0 "Тяжёлый бомбардировщик '36"
 strat_bomber_equipment_1_desc:0 "Опыт Великой войны и проведённые исследования показывают, что бомбардировки военных объектов и крупных городов противника помогут выиграть следующую войну. Как минимум, нам необходим бомбардировщик, способный наносить подобные разрушения. Он должен летать высоко и быстро и нести большую бомбовую нагрузку. Для этого потребуется крупный многомоторный планер, обладающий также определёнными возможностями самообороны."
 strat_bomber_equipment_2:0 "Тяжёлый бомбардировщик '40"
 strat_bomber_equipment_2_short:0 "Тяжёлый бомбардировщик '40"
 strat_bomber_equipment_2_desc:0 "Бомбардировки доказали свою эффективность в снижении способности противника вести войну. Усиление оборонительного вооружения и повышение скорости позволят новой конструкции лучше избегать уничтожения, а увеличение боевой нагрузки и дальности сделает её ещё эффективнее."
 strat_bomber_equipment_3:0 "Тяжёлый бомбардировщик '44"
 strat_bomber_equipment_3_short:0 "Тяжёлый бомбардировщик '44"
 strat_bomber_equipment_3_desc:0 "Наша следующая модель будет летать на большой высоте, чтобы сократить потери от вражеских истребителей и наземного огня. Она станет крупнее, чтобы нести огромную боевую нагрузку и больше топлива для увеличения дальности."
 strat_maritime:0 "Тяжёлый морской бомбардировщик"
 strat_maritime_equipment_desc:0 "Тяжёлые бомбардировщики, оснащённые для морского патрулирования, разведки, борьбы с кораблями и подводными лодками."
 strat_maritime_equipment:0 "Тяжёлый морской бомбардировщик"
