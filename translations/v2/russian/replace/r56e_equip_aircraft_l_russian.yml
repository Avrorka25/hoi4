 HOL_jet_fighter_equipment_2_short:0 "S.14"
 HOL_jet_fighter_equipment_2_desc:0 "Характерной внешней особенностью S.14 были короткие, широкие и слегка сужающиеся крылья, за которые самолёт получил прозвище «Доска». Однако все пилоты, летавшие на S.14, высоко оценивали его превосходные лётные характеристики"
