l_russian:
 oscillating_turret_unlock_tt:0 "The §0Колеблющаяся башня§! Позволяет легким танкам нести среднее вооружение, не жертвуя таким количеством брони, как надстройки и частично бронированные башни."
 radio_detection:0 "Радар"
 radio_detection_desc:0 "Разработка RADAR, Radio Detection and Ranging, позволяет использовать радиоволны для обнаружения физических объектов. Исследования очень скрытны, учитывая влияние этих изобретений на определение местоположения единиц."
 decimetric_radar:0 "Декаметрический радар"
 decimetric_radar_desc:0 "Многие агрегаты полагаются на элемент неожиданности для своей эффективности. Разработка дециметрического радара позволяет лишить их этого преимущества."
 improved_decimetric_radar:0 "Улучшенный десятиметровый радар"
 improved_decimetric_radar_desc:0 "Использование радара уже доказало свою важность, но наши дециметрические радиолокационные установки слишком малы, чтобы обеспечить хорошее покрытие. Подборка большего количества блоков с радаром позволит нам максимизировать наше технологическое преимущество."
 centimetric_radar:0 "Центиметрический радар"
 centimetric_radar_desc:0 "Благодаря изобретению магнетрона полости мы можем начать использовать более короткие микроволны для обнаружения объектов, улучшая разрешение наших радаров до беспрецедентных уровней."
 improved_centimetric_radar:0 "Улучшенный центриметрический радар"
 improved_centimetric_radar_desc:0 "Внедрение передовых радиолокационных технологий, таких как фазированные массивы в ключевых операциях, позволит обеспечить максимальную точность слежения."
 advanced_centimetric_radar:0 "Продвинутый центриметрический радар"
 advanced_centimetric_radar_desc:0 "Несмотря на наши усовершенствованные радары, у противника все еще есть способы избежать обнаружения. Новые разработки, такие как радар доплеровского сдвига, позволяют нам устранить многие из этих ограничений в нашем оборудовании."
 future_radar:0 "Ранний радар для отслеживания монополей"
 future_radar_desc:0 "Наш бортовой радиолокатор перехвата в настоящее время довольно сложный и может заметно повлиять на взаимодействие. Больше информации можно получить от одного хорошо закодированного импульса, чем от взрыва цели несвязанными волнами."
 future_radar_2:0 "Усовершенствованный радар для отслеживания монополей"
 future_radar_2_desc:0 "Дальнейшие достижения в области чувствительности и дальности наших систем позволили нам разработать еще более совершенные единицы для самолетов, которые менее ликли, чтобы быть забитыми вражескими системами."
 future_radar_3:0 "Пульс-доплеровский радар"
 future_radar_3_desc:0 "Пульсно-доплеровский метод позволяет РЛС различать движущиеся и статические цели, что позволяет эффективно использовать РЛС на малых высотах. Старые системы не видели различий между землей и самолетом противника, фактически бесполезны на более низких высотах."
 ship_hull_midget_submarine:0 "1936 Миджет Подводный Корпус"
 ship_hull_cruiser_submarine:0 "1936 Подводная лодка крейсер"
 ship_hull_super_heavy_1:0 "1936 Super Heavy корабль Халл"
 ship_hull_cruiser_panzerschiff:0 "Карманный линкор"
 ship_hull_cruiser_panzerschiff_desc:0 "В амбициозной попытке бросить вызов военно-морским конвенциям инженерам удалось установить оружие класса линкора на корпусе крейсера. Получившаяся конструкция превосходит любой известный крейсер, но имеет значительные компромиссы: высокие производственные затраты, ограниченную скорость и относительно легкую броню для его размера."
 GER_ship_hull_cruiser_panzerschiff:0 "Панцершифф"
