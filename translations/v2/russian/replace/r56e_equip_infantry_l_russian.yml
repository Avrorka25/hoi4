 support_weapons4_desc:0 "Расчётное вооружение пехоты уровня взвода или роты. Включает станковые пулемёты, средние миномёты и лёгкие миномёты/гранатомёты."
 support_weapons_a:0 "Средства поддержки '46"
 support_weapons_a_short:0 "Средства поддержки '46"
 support_weapons_a_desc:0 "Расчётное вооружение пехоты уровня взвода или роты. Включает станковые пулемёты, средние миномёты и лёгкие миномёты/гранатомёты."
 support_weapons_b:0 "Средства поддержки '50"
 support_weapons_b_short:0 "Средства поддержки '50"
 support_weapons_b_desc:0 "Расчётное вооружение пехоты уровня взвода или роты. Включает станковые пулемёты, тяжёлые миномёты и лёгкие миномёты/гранатомёты."
 support_weapons_c:0 "Средства поддержки '54"
 support_weapons_c_short:0 "Средства поддержки '54"
 support_weapons_c_desc:0 "Расчётное вооружение пехоты уровня взвода или роты. Включает станковые пулемёты, тяжёлые миномёты и лёгкие миномёты/гранатомёты."
