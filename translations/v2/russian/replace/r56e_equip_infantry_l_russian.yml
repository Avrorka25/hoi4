l_russian:
 infantry_equipment:0 "Пехотное снаряжение"
 infantry_equipment_short:0 "Пехотное снаряжение"
 infantry_equipment_desc:0 "Личное и расчётное вооружение пехоты, а также прочее снаряжение, необходимое солдату."
 infantry_equipment_0:0 "Стрелковое оружие '30"
 infantry_equipment_0_short:0 "Стрелковое оружие '30"
 infantry_equipment_0_desc:0 "Личное и расчётное вооружение пехоты, а также прочее снаряжение, необходимое солдату. Включает полевую форму образца 1930 года, штатные винтовки, ручные пулемёты, пистолеты, наступательные и оборонительные гранаты, а также винтовочные гранаты."
 infantry_equipment_1:0 "Стрелковое оружие '36"
 infantry_equipment_1_short:0 "Стрелковое оружие '36"
 infantry_equipment_1_desc:0 "Личное и расчётное вооружение пехоты, а также прочее снаряжение, необходимое солдату. Включает полевую форму образца 1936 года, штатные винтовки, пистолеты-пулемёты, ручные пулемёты, пистолеты, наступательные и оборонительные гранаты."
 infantry_equipment_2:0 "Стрелковое оружие '39"
 infantry_equipment_2_short:0 "Стрелковое оружие '39"
 infantry_equipment_2_desc:0 "Личное и расчётное вооружение пехоты, а также прочее снаряжение, необходимое солдату. Включает полевую форму образца 1939 года, штатные винтовки, пистолеты-пулемёты, ручные пулемёты, пистолеты, наступательные и оборонительные гранаты, а также противотанковые гранаты и заряды."
 infantry_equipment_3:0 "Стрелковое оружие '42"
 infantry_equipment_3_short:0 "Стрелковое оружие '42"
 infantry_equipment_3_desc:0 "Личное и расчётное вооружение пехоты, а также прочее снаряжение, необходимое солдату. Включает полевую форму образца 1942 года, штатные и самозарядные винтовки/карабины, пистолеты-пулемёты, ручные пулемёты, пистолеты, наступательные и оборонительные гранаты, а также противотанковые гранаты и средства."
 infantry_equipment_x:0 "Стрелковое оружие '45"
 infantry_equipment_x_short:0 "Стрелковое оружие '45"
 infantry_equipment_x_desc:0 "Личное и расчётное вооружение пехоты, а также прочее снаряжение, необходимое солдату. Включает полевую форму образца 1946 года, самозарядные винтовки/карабины, пистолеты-пулемёты, ручные пулемёты, пистолеты, наступательные и оборонительные гранаты, а также противотанковые гранаты и средства."
 infantry_equipment_x_2:0 "Стрелковое оружие '48"
 infantry_equipment_x_2_short:0 "Стрелковое оружие '48"
 infantry_equipment_x_2_desc:0 "Личное и расчётное вооружение пехоты, а также прочее снаряжение, необходимое солдату. Включает полевую форму образца 1948 года, штурмовые винтовки, ручные пулемёты, пистолеты, наступательные и оборонительные гранаты, а также противотанковые гранаты и средства."
 infantry_equipment_x_3:0 "Стрелковое оружие '52"
 infantry_equipment_x_3_short:0 "Стрелковое оружие '52"
 infantry_equipment_x_3_desc:0 "Личное и расчётное вооружение пехоты, а также прочее снаряжение, необходимое солдату. Включает полевую форму образца 1952 года, штурмовые винтовки, ручные пулемёты, пистолеты, наступательные и оборонительные гранаты, а также противотанковые гранаты и средства."
 infantry_weapons2:0 "Картриджи высокой мощности"
 infantry_weapons2_desc:0 "Эти патроны обеспечивают большую огневую мощь и дальность, повышая эффективность пехотного оружия."
 improved_infantry_weapons_2:0 "Мощные Картриджи"
 improved_infantry_weapons_2_desc:0 "Полноразмерные патроны представляют собой вершину развития боеприпасов и обеспечивают пехотному оружию максимальную мощность и эффективность в бою."
 advanced_infantry_weapons2:0 "Облегчённые патроны"
 advanced_infantry_weapons2_desc:0 "Благодаря современным инженерным решениям облегчённые патроны снижают переносимую пехотой массу, повышая мобильность без заметной потери огневой мощи."
 advanced_infantry_weapons_a:0 "Промежуточные патроны"
 advanced_infantry_weapons_a_desc:0 "Промежуточные патроны сочетают мощность и универсальность, обеспечивая пехотному оружию надёжные и гибкие боеприпасы для различных боевых условий."
 advanced_infantry_weapons_c:0 "Штурмовые патроны"
 advanced_infantry_weapons_c_desc:0 "Штурмовые патроны предназначены прежде всего для ближнего боя и обеспечивают высокое останавливающее действие в интенсивных столкновениях."
 advanced_infantry_weapons_d:0 "Универсальные патроны"
 advanced_infantry_weapons_d_desc:0 "Универсальные патроны совместимы с различными видами пехотного оружия, упрощая логистику и снабжение боеприпасами."
 anti_tank_infantry_weapons:0 "Переносное противотанковое оружие"
 r56_anti_tank_kit:0 "Полевой противотранспортный комплект"
 r56_anti_tank_kit_desc:0 "Добавив к пехотному комплекту отделения полевые инструкции и несколько вспомогательных предметов, солдаты смогут прямо на месте создавать импровизированные противотранспортные средства из имеющегося снаряжения, повышая эффективность против вражеской техники в критической ситуации. Однако такие меры не заменяют специализированного противотанкового вооружения."
 infantry_at:0 "Противотанковое ружьё"
 infantry_at_short:0 "ПТР"
 infantry_at_desc:0 "Расчётное вооружение пехоты, специализированное для борьбы с бронетехникой."
 infantry_at2:0 "Противотанковая ракета"
 infantry_at2_short:0 "ПТ-ракета"
 infantry_at2_desc:0 "Расчётное вооружение пехоты, специализированное для борьбы с бронетехникой."
 infantry_at_a:0 "Противотанковая ракета '47"
 infantry_at_a_short:0 "ПТ-ракета"
 infantry_at_a_desc:0 "Расчётное вооружение пехоты, специализированное для борьбы с бронетехникой."
 infantry_at_b:0 "Противотанковая ракета '50"
 infantry_at_b_short:0 "ПТ-ракета"
 infantry_at_b_desc:0 "Расчётное вооружение пехоты, специализированное для борьбы с бронетехникой."
 infantry_at_c:0 "Противотанковая ракета '53"
 infantry_at_c_short:0 "ПТ-ракета"
 infantry_at_c_desc:0 "Расчётное вооружение пехоты, специализированное для борьбы с бронетехникой."
