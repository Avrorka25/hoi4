 HOL_motorized_equipment_1_desc:0 "Подвеска «Традо» имела значительный коммерческий успех и применялась на множестве новых гражданских и военных грузовиков. Она представляла собой рессорную тележку с двумя ведущими колёсами, которую можно было относительно легко установить на заднюю ось обычного грузовика. Такая схема заметно повышала проходимость машины по пересечённой местности."
 HOL_mechanized_equipment_1:0 "Браат Овервалваген"
 HOL_mechanized_equipment_1_short:0 "Овервалваген"
 HOL_mechanized_equipment_1_desc:0 "Машина была разработана в 1940 году на базе бескапотного грузовика Chevrolet COE. Наклонная броня толщиной 20 мм во лбу и 12 мм по бортам и корме защищала от огня стрелкового оружия. Водитель имел бронированную откидную заслонку и боковую смотровую щель, а место командира располагалось в трёхгранной рубке с пулемётом «Браунинг» калибра .30 (7,62 мм) с воздушным охлаждением либо «Виккерс» .303 (7,7 мм) с жидкостным охлаждением."
