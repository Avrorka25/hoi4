 USA_motorized_equipment_1:0 "GMC CCKW"
 USA_mechanized_equipment_1:0 "Бронеавтомобиль М2"
 USA_mechanized_equipment_1_desc:0 "Полугусеничный M2, созданный под влиянием французских машин, первоначально предназначался для буксировки артиллерии, но обладал большим потенциалом как транспорт механизированной пехоты. Большинство этих машин выпустили компании White Motor Company и Autocar Company."
 USA_mechanized_equipment_1_short:0 "М2"
 USA_mechanized_equipment_2:0 "Бронеавтомобиль М3"
 USA_mechanized_equipment_2_desc:0 "M3 выпускали Autocar Company, Diamond T Motor Company и White Motor Company. Машина несла пулемёт M2 калибра .50 и несколько дополнительных шкворневых установок. Солдаты жаловались на слабую защиту бронепанелей и мрачно прозвали эти машины «коробками для Пурпурных сердец» — медалей, которыми обычно награждали раненых или погибших военнослужащих."
 USA_mechanized_equipment_2_short:0 "M3"
 USA_mechanized_equipment_3:0 "Бронеавтомобиль М5"
 USA_mechanized_equipment_3_desc:0 "Созданная на шасси M18 Hellcat машина AUV применялась в самых разных ролях: как бронетранспортёр, санитарная машина и перевозчик боеприпасов для самоходных гаубиц. Как и у предыдущих конструкций, тонкая броня и открытый верх делали экипаж уязвимым для вражеского огня."
 USA_mechanized_equipment_3_short:0 "M5"
 USA_mechanized_equipment_x:0 "M44 Armored Personal Carrier"
 USA_mechanized_equipment_x_desc:0 "Изучив канадский опыт переделки подбитых танков в бронетранспортёры, армия США поначалу сомневалась в целесообразности специализированных полностью гусеничных закрытых БТР из-за их ограниченной вместимости и универсальности. Вместе с тем жёсткая крыша решала проблему уязвимости пехоты перед осколками и воздушными разрывами артиллерийских снарядов."
 USA_mechanized_equipment_x_short:0 "БТР M44"
 USA_mechanized_equipment_x_2:0 "M75 Armored Personal Carrier"
 USA_mechanized_equipment_x_2_desc:0 "Развитие конструкций и доктрин бронетехники привело к созданию БТР M75, рассчитанного на 14 десантников помимо экипажа и вооружённого двумя пулемётами калибра .50. Улучшенная броня и полностью закрытый корпус позволяли безопаснее доставлять пехоту на поле боя, защищая её от стрелкового оружия и артиллерийского огня."
 USA_mechanized_equipment_x_2_short:0 "M75 APC"
 USA_amphibious_mechanized_equipment_1:0 "LVT-2"
 USA_amphibious_mechanized_equipment_1_desc:0 "Гусеничный десантный транспорт восходил к гражданскому спасательному судну «Аллигатор», предназначенному для работы в болотистой местности. КМП США заинтересовался идеей амфибийной машины, поэтому быстро появились проекты военного варианта. LVT-2 мог перевозить 24 полностью экипированных бойца или 4500 фунтов (2000 кг) груза и был вооружён двумя 7,62-мм пулемётами для лёгкой огневой поддержки."
 USA_amphibious_mechanized_equipment_1_short:0 "LVT-2"
 USA_amphibious_mechanized_equipment_2:0 "LVT-4 «Буффало»"
 USA_amphibious_mechanized_equipment_2_desc:0 "Большая кормовая аппарель позволила бойцам покидать машину с более безопасной задней стороны, а вместимость LVT выросла до 30 человек. Это нововведение также значительно упростило погрузку и выгрузку грузов, сделав морские десанты гораздо удобнее."
 USA_amphibious_mechanized_equipment_2_short:0 "LVT-4"
