 tech_trucks:0 "Грузовики"
 tech_trucks_desc:0 "Врум-врум"
 motorized_rocket_equipment:0 "Моторизованная реактивная артиллерия"
 motorized_rocket_equipment_short:0 "Моторизованная реактивная установка"
 motorized_rocket_equipment_desc:0 "Реактивные системы залпового огня способны быстрее обычной артиллерии накрывать цель большим количеством боеприпасов, но уступают ей в точности и требуют больше времени на перезарядку. Установка на грузовое шасси позволяет нанести удар и сменить позицию до того, как противник успеет открыть ответный огонь."
 motorized_rocket_equipment_1:0 "Моторизованная реактивная артиллерия"
 motorized_rocket_equipment_1_short:0 "Моторизованная реактивная установка"
 motorized_rocket_equipment_1_desc:0 "Реактивные системы залпового огня способны быстрее обычной артиллерии накрывать цель большим количеством боеприпасов, но уступают ей в точности и требуют больше времени на перезарядку. Установка на грузовое шасси позволяет нанести удар и сменить позицию до того, как противник успеет открыть ответный огонь."
 motorized_equipment:0 "Моторизованная пехота"
 motorized_equipment_desc:0 "Грузовики и другие автомобили, используемые для перевозки войск к полю боя и непосредственно в полевых условиях."
 motorized_equipment_1:0 "Моторизованная пехота"
 motorized_equipment_1_desc:0 "Моторизация пехоты — первый шаг к механизации армии. Гражданские грузовики легко приспосабливаются для перевозки солдат, буксировки орудий, а также транспортировки снаряжения и припасов. Это значительно повышает стратегическую мобильность пехотных частей, которым иначе пришлось бы передвигаться пешком."
 mechanized_equipment:0 "Бронетранспортёры"
 mechanized_equipment_short:0 "Бронетранспортёры"
 mechanized_equipment_desc:0 "Механизированная пехота оснащена бронетранспортёрами (БТР) или боевыми машинами пехоты (БМП), предназначенными как для перевозки, так и для ведения боя. От моторизованной пехоты она отличается тем, что её техника обеспечивает определённую защиту от вражеского огня, тогда как моторизованные части используют небронированные колёсные машины — грузовики и джипы."
 mechanized_equipment_1:0 "Бронетранспортёр '39"
 mechanized_equipment_1_short:0 "БТР '39"
 mechanized_equipment_1_desc:0 "Механизированная пехота оснащена бронетранспортёрами (БТР) или боевыми машинами пехоты (БМП), предназначенными как для перевозки, так и для ведения боя. От моторизованной пехоты она отличается тем, что её техника обеспечивает определённую защиту от вражеского огня, тогда как моторизованные части используют небронированные колёсные машины — грузовики и джипы."
 mechanized_equipment_2:0 "Бронетранспортёр '42"
 mechanized_equipment_2_short:0 "БТР '42"
 mechanized_equipment_2_desc:0 "Механизированная пехота оснащена бронетранспортёрами (БТР) или боевыми машинами пехоты (БМП), предназначенными как для перевозки, так и для ведения боя. От моторизованной пехоты она отличается тем, что её техника обеспечивает определённую защиту от вражеского огня, тогда как моторизованные части используют небронированные колёсные машины — грузовики и джипы."
 mechanized_equipment_3:0 "Бронетранспортёр '44"
 mechanized_equipment_3_short:0 "БТР '44"
 mechanized_equipment_3_desc:0 "Механизированная пехота оснащена бронетранспортёрами (БТР) или боевыми машинами пехоты (БМП), предназначенными как для перевозки, так и для ведения боя. От моторизованной пехоты она отличается тем, что её техника обеспечивает определённую защиту от вражеского огня, тогда как моторизованные части используют небронированные колёсные машины — грузовики и джипы."
 mechanized_equipment_x:0 "Бронетранспортёр '49"
 mechanized_equipment_x_short:0 "БТР '49"
 mechanized_equipment_x_desc:0 "Механизированная пехота оснащена бронетранспортёрами (БТР) или боевыми машинами пехоты (БМП), предназначенными как для перевозки, так и для ведения боя. От моторизованной пехоты она отличается тем, что её техника обеспечивает определённую защиту от вражеского огня, тогда как моторизованные части используют небронированные колёсные машины — грузовики и джипы."
 mechanized_equipment_x_2:0 "Бронетранспортёр '53"
 mechanized_equipment_x_2_short:0 "БТР '53"
 mechanized_equipment_x_2_desc:0 "Механизированная пехота оснащена бронетранспортёрами (БТР) или боевыми машинами пехоты (БМП), предназначенными как для перевозки, так и для ведения боя. От моторизованной пехоты она отличается тем, что её техника обеспечивает определённую защиту от вражеского огня, тогда как моторизованные части используют небронированные колёсные машины — грузовики и джипы."
 amphibious_mechanized_equipment:0 "Десантные машины-амфибии"
 amphibious_mechanized_equipment_short:0 "Амфибии"
 amphibious_mechanized_equipment_desc:0 "Плавающие транспортёры, или амтраки, позволяют морской пехоте высаживаться на берег под защитой брони. Цена такой защищённости — высокий расход топлива."
 amphibious_mechanized_equipment_1:0 "Плавающий транспортёр '41"
 amphibious_mechanized_equipment_1_short:0 "Амтрак '41"
 amphibious_mechanized_equipment_1_desc:0 "Плавающие транспортёры, или амтраки, позволяют морской пехоте высаживаться на берег под защитой брони. Цена такой защищённости — высокий расход топлива."
 amphibious_mechanized_equipment_2:0 "Плавающий транспортёр '43"
 amphibious_mechanized_equipment_2_short:0 "Амтрак '43"
 amphibious_mechanized_equipment_2_desc:0 "Эти амтраки получили ряд улучшений по сравнению с базовой моделью, включая кормовую аппарель, упрощающую высадку на берег."
 r56_gw_railway_gun_equipment:0 "Железнодорожное орудие Великой войны"
 r56_gw_railway_gun_equipment_short:0 "Ж/д орудие Великой войны"
 r56_gw_railway_gun_equipment_desc:0 "Разработано как средство борьбы с мощными укреплениями времён Великой войны. Огромное корабельное орудие было приспособлено для применения на суше и установлено на железнодорожную платформу, способную выдерживать его колоссальную отдачу."
 r56_railway_mortar_equipment:0 "Железнодорожный миномёт"
 r56_railway_mortar_equipment_short:0 "Ж/д миномёт"
 r56_railway_mortar_equipment_desc:0 "Промежуточный вариант между крупными железнодорожными орудиями и тяжёлой артиллерией. Меньшие размеры позволяют использовать его на путях, не рассчитанных на огромную массу более тяжёлых систем, и облегчают переброску. Однако меньший калибр заметно снижает эффективность при разрушении укреплений."
 train_equipment_4:0 "Военный упрощённый локомотив '42"
 train_equipment_4_short:0 "Военный упрощённый локомотив '42"
 train_equipment_4_desc:0 "Опыт проектирования предыдущих серий позволил нашим локомотивным заводам создать ещё более дешёвую конструкцию, которая при этом работает лучше ранних упрощённых военных локомотивов. Настоящее воплощение принципа «больше за меньшие средства»!"
 train_equipment_5:0 "Дизельный локомотив"
 train_equipment_5_short:0 "Дизельный локомотив"
 train_equipment_5_desc:0 "Развитие дизельных двигателей сделало дизельные локомотивы практичнее и проще в производстве, чем паровые. Однако для их выпуска требуются некоторые материалы и детали, которые могли бы пригодиться при производстве другой военной продукции."
 train_equipment_side_tanks:0 "Упрощённый военный танк-паровоз"
 train_equipment_side_tanks_desc:0 "Такие танк-паровозы меньше и дешевле других упрощённых военных локомотивов. Несмотря на меньшую силу тяги, они вполне способны выполнять многие задачи своих более крупных аналогов."
 armored_train:0 "Бронепоезд"
 supply_node_tech:0 "Технологии узлов снабжения"
 r56_combat_service:0 "Тыловое обеспечение"
 r56_combat_service_desc:0 "Надёжное тыловое и логистическое обеспечение армии — один из ключей к успеху на поле боя."
 r56_convoy_highways:0 "Тыловые склады"
 r56_convoy_highways_desc:0 "Тыловые склады играют важнейшую роль в военной логистике, обеспечивая безопасное и эффективное хранение необходимых припасов и оборудования."
 r56_convoy_highways_2:0 "Фронтовое снабжение"
 r56_convoy_highways_2_desc:0 "Фронтовое снабжение поддерживает войска, непосредственно ведущие боевые действия. Оно включает разветвлённую сеть логистических процессов и систем, обеспечивающих непрерывную доставку жизненно важных ресурсов прямо на передовую."
 r56_convoy_highways_3:0 "Тактическая логистика"
 r56_convoy_highways_3_desc:0 "Тактическая логистика — основа боевых операций, обеспечивающая передовые части всем необходимым. Она включает тщательное планирование и работу сложных цепочек снабжения, транспортных сетей и складов, чтобы ресурсы своевременно и бесперебойно поступали наступающим войскам."
 r56_convoy_highways_4:0 "Передовая оперативная база"
 r56_convoy_highways_4_desc:0 "Передовая оперативная база — стратегически расположенный военный объект, предназначенный для поддержки операций в определённом районе. Обычно её развёртывают неподалёку от линии фронта или в районах особой оперативной важности."
 r56_flexible_railnetwork:0 "Гибкие железнодорожные сети"
 r56_flexible_railnetwork_desc:0 "Специализированные железнодорожные сети могут быть удобнее в мирное время, но при перевозке военных грузов такая узкая специализация становится слабым местом. Ради национальной безопасности наша железнодорожная сеть должна быть способна гибко обслуживать различные виды перевозок."
 r56_military_railnetwork:0 "Военные железнодорожные сети"
 r56_military_railnetwork_desc:0 "Железные дороги, изначально рассчитанные на военное применение, дешевле в строительстве и лучше соответствуют особым потребностям армии."
 r56_modern_military_railnetwork:0 "Улучшенные военные железнодорожные сети"
 r56_modern_military_railnetwork_desc:0 "Опыт эксплуатации военных железных дорог позволил значительно повысить уровень логистического обеспечения армии."
 r56_modern_military_railnetwork_2:0 "Современные военные железнодорожные сети"
 r56_modern_military_railnetwork_2_desc:0 "Опыт эксплуатации военных железных дорог позволил добиться такого уровня логистического обеспечения, который ещё десять лет назад считался невозможным."
