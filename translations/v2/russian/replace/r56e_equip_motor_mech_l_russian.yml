 ENG_motorized_equipment_1:0 "Моррис Коммершл CD-SW 6x4"
 ENG_mechanized_equipment_1:0 "Полугусеничный бронетранспортёр 15-cwt"
 ENG_mechanized_equipment_1_short:0 "Полугусеничный 15-cwt"
 ENG_mechanized_equipment_2:0 "Стюарт Кенгуру"
 ENG_mechanized_equipment_2_short:0 "Стюарт Кенгуру"
 ENG_mechanized_equipment_2_desc:0 "Переоборудование устаревших M3/M5 «Стюарт» в более полезные машины поддержки — бронетранспортёры и другие варианты моторизованной техники. «Стюарт Кенгуру» неплохо служили британской армии в африканских кампаниях, однако недостаточная бронезащита и малая вместимость серьёзно ограничивали их возможности."
 ENG_mechanized_equipment_3:0 "Рэм Кенгуру"
 ENG_mechanized_equipment_3_short:0 "Рэм Кенгуру"
 ENG_mechanized_equipment_3_desc:0 "«Рэм Кенгуру» стали временным решением, разработанным полевыми инженерами по приказу канадского генерала Гая Симондса для срочного восполнения нехватки БТР. Их создавали из разоружённых САУ M7 «Прист», а также из устаревших и избыточных танков «Рэм» и «Шерман». Вооружённые пулемётами калибра .30 или .50, эти машины хорошо зарекомендовали себя как транспорт для доставки пехоты в зону боя."
 ENG_mechanized_equipment_x:0 "Хамбер Пиг"
 ENG_mechanized_equipment_x_short:0 "Пиг"
 ENG_mechanized_equipment_x_desc:0 "«Пиг» — лёгкобронированный грузовик британской армии. Он оснащался 6-цилиндровым двигателем «Роллс-Ройс» мощностью 150 л. с., полным приводом, крупными внедорожными колёсами и усиленной подвеской, благодаря чему уверенно действовал вне дорог."
 ENG_mechanized_equipment_x_2:0 "M75"
 ENG_mechanized_equipment_x_2_short:0 "M75"
 ENG_mechanized_equipment_x_2_desc:0 "БТР M75 представлял собой полностью гусеничный транспортёр с круговой броневой защитой, способный перевозить до 12 солдат. Помимо доставки пехоты, эти машины использовались для эвакуации раненых и в качестве носителей миномётов."
 ENG_amphibious_mechanized_equipment_1:0 "Террапин Mk. I"
 ENG_amphibious_mechanized_equipment_1_short:0 "Террапин Mk. I"
 ENG_amphibious_mechanized_equipment_1_desc:0 "Компания «Торникрофт» создала первый вариант «Террапина», чтобы удовлетворить потребность в плавающих машинах для переправы британской и канадской пехоты через реки. Было выпущено около 500 машин, применявшихся элитными штурмовыми подразделениями Королевских инженеров."
 ENG_amphibious_mechanized_equipment_2:0 "Террапин Mk. II"
 ENG_amphibious_mechanized_equipment_2_short:0 "Террапин Mk. II"
 ENG_amphibious_mechanized_equipment_2_desc:0 "Улучшенный преемник «Террапина» Mk. I был заметно длиннее предшественника и получил переднее расположение места водителя."
