 JAP_mechanized_equipment_1:0 "Тип 98 Сокохэйсяхоки Со-Да"
 JAP_mechanized_equipment_1_short:0 "Тип 98 Со-Да"
 JAP_mechanized_equipment_1_desc:0 "Тип 98 «Со-Да», созданный на шасси танкетки Тип 97, главным образом использовался для перевозки личного состава и боеприпасов в прифронтовой зоне. Эти открытые сверху и легкобронированные машины также применялись как тягачи для артиллерии."
 JAP_mechanized_equipment_2:0 "Тип 1 Сокохэйсяхоки Хо-Ки"
 JAP_mechanized_equipment_2_short:0 "Тип 1 Хо-Ки"
 JAP_mechanized_equipment_2_desc:0 "Универсальный БТР производства «Хино Моторс» с бронёй толщиной до 6 мм мог перевозить боеприпасы, пехоту и даже артиллерию, обеспечивая достаточную защиту от огня стрелкового оружия. Для усиления огневой мощи десанта на машину также могли устанавливаться пулемёты Тип 92."
 JAP_mechanized_equipment_3:0 "Тип 1 Сокохэйсяхоки Хо-Ха"
 JAP_mechanized_equipment_3_short:0 "Тип 1 Хо-Ха"
 JAP_mechanized_equipment_3_desc:0 "Созданные по мотивам германского Sd.Kfz. 251/1, эти машины имели пару управляемых колёс спереди и короткие гусеницы сзади. Броня толщиной до 8 мм позволяла перевозить на передовую до 13 полностью экипированных солдат."
 JAP_mechanized_equipment_x:0 "Тип 1 Сокохэйсяхоки Хо-Ха-Кай"
 JAP_mechanized_equipment_x_short:0 "Тип 1 Хо-Ха-Кай"
 JAP_mechanized_equipment_x_2:0 "Тип 4 Сокохэйсяхоки Ти-Со"
 JAP_mechanized_equipment_x_2_short:0 "Тип 4 Ти-Со"
 JAP_mechanized_equipment_x_2_desc:0 "Эти БТР, созданные на шасси избыточных танков Тип 4 «Ти-То», предназначались для перевозки большего количества бойцов и боеприпасов, чем предыдущие модели. В ограниченном количестве они использовались в джунглях Тихоокеанской войны для доставки войск к месту боя."
 JAP_amphibious_mechanized_equipment_1:0 "Тойота 4x4 Су-Ки"
 JAP_amphibious_mechanized_equipment_1_short:0 "Тойота Су-Ки"
 JAP_amphibious_mechanized_equipment_1_desc:0 "Плавающие грузовики «Тойота Су-Ки», выпускавшиеся компанией Toyota Motor Co., использовались японской армией на островах Тихого океана для доставки грузов непосредственно с транспортных и грузовых судов на береговые склады."
 JAP_amphibious_mechanized_equipment_2:0 "Тип 4 Ка-Цу"
 JAP_amphibious_mechanized_equipment_2_short:0 "Тип 4 Ка-Цу"
 JAP_amphibious_mechanized_equipment_2_desc:0 "Разработанные капитаном Хори Мотоёси на военно-морской верфи Куре, эти машины стали ответом на трудности снабжения японских войск на удалённых островах Тихого океана. Легкобронированные и полностью герметичные для спуска с подводных лодок, они практически не участвовали в серьёзных боевых действиях."
