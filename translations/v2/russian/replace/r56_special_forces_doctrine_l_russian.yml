l_russian:
 SHOCKTROOPS_DOCTRINE_LABEL:0 "Штурмовые войска"
 SHOCKTROOPS_DOCTRINE_DESC:0 "Чтобы избежать статичных боёв на истощение, подобных Великой войне, необходимо обучить специализированные войска прорывать вражеские линии."
 special_forces_shocktroops:0 "Повысить роль штурмовых войск"
 special_forces_shocktroops_desc:0 "Войска, снабжённые дополнительным снаряжением и поддержкой для прорыва вражеских линий и нанесения тяжёлых потерь, стали попыткой уйти от оборонительного характера Великой войны. Увеличение числа таких подразделений может вернуть войне манёвренность."
 shocktroop_level_1_a:0 "Группы зачистки городов"
 shocktroop_level_1_a_desc:0 "Города создают для наступающих особые трудности, требующие специальных решений, которые способны обеспечить войска, подготовленные к городскому бою."
 shocktroop_level_1_b:0 "Просачивание в оборону"
 shocktroop_level_1_b_desc:0 "Во время Великой войны штурмовые войска просачивались в оборонительные позиции противника и создавали бреши для продвижения основных сил. Несмотря на развитие военного дела, хорошо подготовленные к такой тактике войска по-прежнему крайне необходимы."
 shocktroop_keystone_1:0 "Армия штурмовых войск поддержки"
 shocktroop_keystone_1_desc:0 "Штурмовые войска больше не могут действовать самостоятельно без инженеров и огневой поддержки. Для выполнения поставленных задач они должны тесно взаимодействовать с подразделениями поддержки, чтобы прорвать оборону противника."
 shocktroop_level_2_a:0 "Затяжной бой"
 shocktroop_level_2_a_desc:0 "Штурмовые войска должны оставаться в бою как можно дольше и наносить противнику максимальный урон, чтобы ослабить его перед крупными наступательными операциями."
 shocktroop_level_2_b:0 "Разведка боем"
 shocktroop_level_2_b_desc:0 "Разведка боем позволит лучше выявлять слабые места в линиях противника."
 shocktroop_keystone_2:0 "Интегрированные инженерные части"
 shocktroop_keystone_2_desc:0 "Инженерная поддержка крайне важна для любых специальных операций. Более тесное взаимодействие с инженерами даст нашим войскам необходимые средства именно тогда, когда они понадобятся."
 shocktroop_level_3_a:0 "Штурмовая армия"
 shocktroop_level_3_a_desc:0 "Если цель — нанести противнику максимальный урон, ввод большего числа войск в зону боевых действий даёт свои преимущества."
 shocktroop_level_3_b:0 "Армия прорыва"
 shocktroop_level_3_b_desc:0 "Предоставление штурмовым войскам дополнительных средств для прорыва вражеских линий — ключ к тому, чтобы они выполняли своё основное предназначение: прорывали оборону противника."
