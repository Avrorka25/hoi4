l_russian:
 SWE_revoke_anti_militia_laws:0 "Отменить законы против ополчения"
 SWE_hemvarnet:0 "Hemvärnet"
 SWE_hemvarnet_desc:0 "Идею национальной гвардии, или Хемвернета, необходимо развивать. Если мы подвергнемся нападению, нам потребуется возможность быстро мобилизовать более крупную армию для отражения захватчиков."
 SWE_rationing:0 "Нормирование"
 SWE_rationing_desc:0 "Хотя перспектива нормировать пищу и воду не слишком привлекательна, жизненно важно, чтобы каждый умел правильно распределять запасы на случай нападения и прекращения внешней торговли."
 NORDIC_nuclear_research:0 "Ядерные исследования"
 ETH_african_central_bank_2_tt:0 "$MODIFIER_STABILITY_FACTOR$: §R-5%§! \n$modifier_production_speed_industrial_complex_factor$: §R-10%§! \n$modifier_production_speed_infrastructure_factor$: §R-10%§!"
 ITA_balkan_ambition:0 "Претензии на Югославию"
 ITA_setting_course:0 "Прокладывание курса"
 ITA_mafia_abroad:0 "Мафия за границей"
 ITA_liberate_the_workers_of_africa:0 "Освободить рабочих Африки"
 SWI_national_redoubt_desc:0 "Анри Гизан предлагает иной способ защиты [ROOT.GetName]. Вместо попыток защищать границы страны любой ценой мы можем стратегически уступить Швейцарское плато и отступить в Альпы, где оккупация обойдётся врагу гораздо дороже."
 SWI_adopt_romansh_desc:0 "[ROOT.GetName] — не страна, состоящая из [GER.GetAdjective], [FRA.GetAdjective] и [ITA.GetAdjective] регионов, которые наши жадные соседи могут по праву требовать. [ROOT.GetName] — единая и неделимая многонациональная нация. Принятие романшского языка, на котором говорят лишь в горах наших [ROOT.GetAdjective] Альп, покажет, что наша культура и ценности отличаются от их независимо от языка."
 SWI_ortswehren_desc:0 "Тотальная война означает, что каждый [ROOT.GetAdjective] гражданин должен быть готов защищать свой регион, но не все способны вступить в ополчение. Мы можем создать местную охрану, которая станет опорой для ополчения в защите [ROOT.GetNameDef]."
 SWI_citizen_supply_mandate_desc:0 "Мы не знаем, как будет происходить вторжение, и если мы сможем полагаться на централизованную сеть поставок, это несовместимо с нашей командной структурой. Именно поэтому каждый [ROOt.GetAdjective] Домохозяйства должны хранить не менее 2 месяцев в своих собственных домах, как для них, так и для их местных ополченцев."
 SWI_take_a_stance_desc:0 "Фашистская [?SWI_biggest_fascist.GetNonIdeologyName] обладает самым отвратительным и жалким политическим строем. [?SWI_biggest_fascist.GetNameDefCap] — смертельный враг новой [ROOT.GetName]; поэтому мы обязаны занять твёрдую позицию и защищать демократию всеми средствами."
 GRE_open_foreign_subsidized_factories_tt:0 "Один §YВоенная фабрика§! и один §YГражданская фабрика§! Для каждой из следующих стран, которые §YНе в гражданской войне§! и имеет §Yмнение§! из §YГреция§! больше, чем §G80§!: \n§Y[FRA.GetNameDef]§!, §Y[ENG.GetNameDef]§!, §Y[GER.GetNameDef]§!и §Y[SOV.GetNameDef]§!."
 GRE_bedrock_of_balkan_financial_stability_tt:0 "Мы получим по одной вне карты §Yфабрике§! за каждую стартовую страну в §YЗападных Балканах§!, §YВосточных Балканах§! и §YСеверных Балканах§!, которая имеет более §Y50§! §Yотношения§! к нам. Это также относится к §Y[AUS.GetNameDef]§!, §Y[CZE.GetNameDef]§! и §Y[TUR.GetNameDef]§!."
 SMB_navy_default:0 "Флот"
 CHL_expand_the_forestry_decision_tt:0 "Открывает решения §Y«Расширить лесную промышленность»§! в §Y[1063.GetName]§! и §Y[279.GetName]§!. \n"
 CHL_found_national_steelworks_tt:0 "Открывает решение §Y$CHL_expand_araucanian_steelworks_decision$§!, позволяющее получить больше §Yстали§! в §Y[1063.GetName]§!"
 CHL_propose_closer_cooperation_desc:0 "Коммунистические государства вокруг нас могут разделять нашу идеологию, но стратегически они разобщены и не координируют действия. Мы должны взять их под своё крыло и лучше направлять их."
 CHL_align_with_the_russian_soviet:0 "Сблизиться с [SOV.GetAdjective]"
 CHL_enforce_the_chilean_identity_tt:0 "Когда национальный дух §Y$CHL_ancestral_mapuche_resistance$§! будет удалён, вернуть национальную территорию в [1063.GetName]."
 BRA_anaue_tt:0 "Открывает решения по набору дивизий интегралистского ополчения в регионах после проведения там митингов. \nНанимает нового генерала с чертой §Y$militias_officer$§!: \n Защита ополчения §G+5%§! \n Скорость ополчения §G+5%§! \n Организация ополчения §G+5%§!"
 ARG_maintain_neutrality:0 "Сохранять нейтралитет"
 ARG_end_operation_bolivar_desc:0 "Мы обнаружили непрерывный поток шпионских операций, направляемых в страну из [GER.GetName]. Они с юмором назвали это «Операцией Боливар». Это неприемлемо, и мы должны немедленно прекратить все [GER.GetAdjective] операции в [ARG.GetName]."
 ARG_conquer_paraguay:0 "Завоевать [PAR.GetName]"
 ARG_reach_out_to_the_soviet_union:0 "Обратиться к [SOV.GetAdjective]"
 ARG_reach_out_to_the_soviet_union_tt:0 "Выбор этого фокуса откроет шаблон дивизии §YVanguardia Socialista§! после начала §Yгражданской войны§! и создаст §Yпять§! подразделений Vanguardia Socialista в §Y[1067.GetName]§!."
 ARG_unite_the_workers_of_argentina_desc:0 "Если мы хотим изменить [ARG.GetNameDef] к лучшему, необходимо убедить пролетариат страны, что радикальные перемены нужны для прекращения его страданий. Объединим рабочих всех профессий и покажем правительству, что статус-кво должен закончиться!"
 ARG_a_red_south_america:0 "Красная Южная Америка"
 ARG_unify_south_america:0 "Объединить Южную Америку"
 GUAY_rekindle_old_gripes_ARG_PAR_tt:0 "Если мы будем контролировать §Y[1069.GetName]§! в течение §Y365 дней§! после начала войны, [ARG.GetName] придётся заключить белый мир или столкнуться с катастрофическим падением боевого духа."
 GUAY_national_academy_of_sciences_3:0 "Университеты для всех по всему континенту"
 PAR_request_weapons:0 "Запросить [USA.GetAdjective] вооружение"
 PAR_purge_the_military_of_dissent:0 "Очистить армию от инакомыслия"
 URG_brou:0 "Банко де ла Република Ориенталь дель Уругвай"
 URG_pluna_desc:0 "Примерас Линеас Уругуаяс де Навегасьон Аэреа"
 URG_establish_the_german_uruguayan_cultural_center:0 "Расширить влияние [GER.GetAdjective]-[URG.GetAdjective] культурного центра"
 URG_break_diplomatic_relations_with_the_axis_desc:0 "Несмотря на провозглашённый нейтралитет, стало ясно, что Ось больше нельзя терпеть. Ветер войны явно дует в пользу Союзников, и нам не следует оставаться на стороне проигрывающих."
 URG_legacy_of_batlle_desc:0 "Тень президентства Хосе Батлье-и-Ордоньеса по-прежнему лежит над Уругваем и влияет как на внутреннюю, так и на внешнюю политику. Как архитектор масштабных социальных и экономических реформ, Батлье заложил основы современного государства всеобщего благосостояния, укрепляя культуру прогрессивизма и государственного вмешательства. Однако его наследие неоднозначно. Многие поддерживают его видение демократического и равноправного Уругвая, другие же считают его политику источником экономического застоя и политической нестабильности..."
 URG_statism_desc:0 "В наше время необходима сильная и ясная государственная власть с централизованным контролем над социальными и экономическими вопросами."
 MEX_focus_royal_dutch_shell_desc:0 "Royal Dutch Shell — британско-нидерландская компания, контролирующая 60% мексиканских нефтяных концессий. Пойдя на компромисс с иностранными нефтяными компаниями по трудовым спорам, мы сможем заключить соглашение, выгодное обеим сторонам."
 MEX_focus_purchase_belize_desc:0 "На эту небольшую территорию в колониальную эпоху долго претендовала испанская корона, хотя выходцы с Пиренейского полуострова там так и не поселились. После утраты Испанией колониальной империи во время Наполеоновских войн Британия постепенно укрепляла контроль над территорией, кульминацией чего стало создание колонии Британский Гондурас в 1862 году. В знак доброй воли территорию следует передать Мексике."
 MEX_focus_triumph_over_the_cristeros:0 "Победа над кристерос"
 MEX_focus_depoliticised_army_desc:0 "Генералы не имеют права на личную преданность солдат. Высшим источником легитимности является мексиканское государство. Мы должны пресечь мысли о мятеже, регулярно переводя генералов между провинциями, чтобы они не могли создавать сети покровительства или обеспечивать личную преданность войск."
 MEX_focus_the_gold_shirts_desc:0 "Генерал Николас Родригес Карраско создал «Золотые рубашки» в 1933 году для борьбы с коммунистическими предателями, действующими против правительства. Эта военизированная организация должна стать крылом правительства: её цель достойна, а методы необходимы."
 ENG_withdraw_from_contested_territories_desc:0 "Ряд территорий по всему миру, считающихся частью британских заморских владений, оспариваются соседними государствами. Это вызывает дипломатическую напряжённость, поэтому, возможно, стоит пересмотреть их статус как территорий под юрисдикцией Великобритании."
 ENG_bermuda_invasion_launch_point_desc:1 "Вторжение в Северную Америку будет непростой задачей. Нам необходимо развить владения на Бермудах, чтобы они могли принять силы вторжения на необходимое время, прежде чем их отправят нести Революцию непосредственно к американским берегам."
 HOL_finish_the_noordoostpolder_desc:0 "Начатый в 1936 году процесс осушения участка Эйсселмера рядом с провинцией Оверэйссел близок к завершению. Но даже после окончания работ это будет неосвоенная земля, которую предстоит заселить и использовать."
 HOL_pre_empt_venezuelan_aggression:0 "Упреждающий удар по Венесуэле"
 HOL_overturn_military_budget_cuts_desc:0 "Экономика начала удивительно быстро восстанавливаться после отказа от золотого стандарта... Теперь можно отменить сокращения военного бюджета, которые нам пришлось ввести, чтобы не допустить обесценивания гульдена."
 HOL_volk_en_vaderland:0 "Популяризировать «Volk en Vaderland»"
 HOL_de_jeugdstorm:0 "Начать набор в «Де Йёгдсторм»"
 HOL_placate_the_japanese:0 "Уступки [JAP.GetNameDef]"
 HOL_placate_the_japanese_desc:0 "Известно, что [JAP.GetAdjective] имеют виды на наши процветающие колонии на Востоке. Наши вооружённые силы не смогут отразить эту угрозу. Возможно, мы могли бы заключить выгодное соглашение."
 HOL_taking_back_french_flanders:0 "Вернуть [29.controller.GetAdjective] Фландрию"
 HOL_taking_back_french_flanders_desc:0 "Исторические Нижние Земли были разделены окружающими их великими державами. Из них [29.controller.GetNameDef] всё ещё удерживает значительный участок земли, считающийся частью исторической Фландрии. Теперь мы достаточно сильны, чтобы вернуть его, и должны это сделать."
 HOL_pre_empt_western_intervention:0 "Предотвращение вторжения с запада"
 HOL_oranje_boven:0 "Снова «Оранье бовен»!"
 HOL_go_with_britain:0 "На стороне Великобритании"
 HOL_de_vaarplicht:0 "Вновь ввести «Де Варплихт»"
 HOL_lead_the_minor_democracies_desc:0 "Поскольку великие державы нашего времени, похоже, одержимы новой войной, именно малым демократиям Европы предстоит не дать миру сгореть, словно толпе, разнимающей двух дерущихся. Мы возглавим остальных в создании нейтрального блока против поджигателей войны."
 china_warlord_focus:0 "Дерево фокусов китайских военных клик"
 china_nationalist_focus:0 "Национальные фокусы Китайской Республики"
 CHI_labor_reform_desc:1 "Методы и традиции труда в Китае формировались тысячелетиями. Пора привести их в соответствие с современной эпохой."
 CHI_complete_horgos_hami_road:0 "Завершить дорогу Хоргос — Хами"
 CHI_complete_horgos_hami_road_desc:0 "Промышленное развитие нашей страны тормозится слаборазвитой инфраструктурой. Соединение западных промышленных районов с отдалёнными областями Востока позволит товарам и людям свободно перемещаться по стране."
 CHI_give_falkenhausen_citizenship_desc:0 "Немецкие советники оказали выдающуюся помощь в восстановлении и модернизации нашей армии. Мы должны обеспечить им возможность оставаться здесь независимо от политических перемен."
 CHI_chinese_general_staff_desc:0 "Хорошо организованный Генеральный штаб — ключ к планированию сложных операций. Следует учиться на немецком примере и создать подобную организацию."
 CHI_experimental_mechanised_unit:0 "Экспериментальное механизированное подразделение"
 CHI_combined_arms_warfare_desc:0 "Для первых экспериментов в современной механизированной войне грузовиков достаточно, но слабая проходимость и отсутствие брони делают их непригодными для работы на передовой."
 CHI_elite_mountaineers_desc:0 "Война в горах совершенно отличается от боёв на равнинах. Мы должны обучить специализированные дивизии этому искусству, чтобы наилучшим образом использовать нашу местность."
 CHI_integrate_tibet_desc:0 "Эксперимент [TIV.GetAdjective] независимости окончен. Военное вторжение остаётся вариантом, но сначала стоит попытаться мирно вернуть их в наше государство."
 CHI_imperial_legacy_desc:0 "На протяжении тысячелетий Китай был доминирующей силой Востока, обеспечивая мир и стабильность в регионе. Пришло время вернуть прежнее положение."
 CHI_naval_aviation_desc:0 "Будущее морской войны принадлежит авианосцам. Нас никогда не будут считать настоящей морской державой, пока у нас не появятся собственные авианосцы."
 CHI_modern_submarines_desc:0 "Японцы не хотят давать нам технические знания, позволяющие бросить вызов их флоту в открытом бою, но считают подводную войну вспомогательным средством. Мы, разумеется, не обязаны разделять это мнение."
 CHI_coastal_patrol_planes_desc:0 "Нашу протяжённую береговую линию можно эффективно патрулировать только с воздуха. Современные морские бомбардировщики позволят защищать побережье, не расходуя слишком много ресурсов."
 CHI_refugee_resettlement_desc:0 "Миллионы отчаявшихся и бездомных беженцев, появившихся из-за войны, необходимо где-то расселить. Дав им убежище на нашей территории, мы сохраним их как резерв для армии и экономики."
 CHI_rural_schooling_desc:0 "Хорошо образованное население — ключ к модернизации страны. Нельзя полагаться лишь на небольшую группу образованных администраторов; дух знаний и науки нужно донести до каждой деревни."
 CHI_inter_party_coordination_council_desc:0 "Первым шагом к превращению страны в функционирующую многопартийную демократию и прекращению необходимой опеки над народом станет организация, которая позволит другим заинтересованным партиям участвовать в выработке политики."
 CHI_judicial_yuan_desc:0 "Доктор Сунь Ятсен представлял современную республику с разделением властей. Судебная система должна быть независимой от внешнего влияния и рассматривать дела исключительно на основе закона."
 CHI_control_yuan_desc:0 "Коррупция неизбежна в любом правительстве. Эффективное управление требует держать её под контролем. Мы создадим отдельную ветвь власти, равную законодательной, исполнительной и судебной."
 CHI_examination_yuan_desc:0 "Тысячелетиями китайских чиновников отбирали посредством строгих экзаменов. Хотя необходимые тексты могли измениться, сам принцип остаётся прежним."
 CHI_foreign_threats_desc:0 "Несколько лет назад японцы отторгли у нас Маньчжурию и создали там марионеточное государство. Они не остановятся, пока не подчинят весь Китай. Мы должны быть готовы противостоять им, даже если ради этого придётся договариваться с местными сильными правителями."
 CHI_unified_industrial_planning_desc:0 "Наша агрессивная программа индустриализации не должна задерживаться."
 CHI_expand_the_academica_sinica_desc:0 "На протяжении тысячелетий Китай лидировал в развитии искусств и наук. Увеличение финансирования университетов — лишь первый шаг к возвращению этого положения."
 PRC_strengthen_the_central_secretariat_desc:0 "После Великого похода мы должны реорганизовать нашу политическую структуру и создать государство, способное соперничать с националистами."
 PRC_soviet_economic_aid_desc:0 "Без внешней помощи последствия Великого похода пришлось бы преодолевать поколениями. Следует обратиться к Советам за экономической помощью."
 PRC_internationalism_desc:0 "Рабочие и крестьяне всего мира должны объединиться и сбросить оковы. Плечом к плечу мы построим лучшее будущее."
 PRC_agrarian_socialism_desc:0 "Китай не похож на индустриальные страны мира. Ожидать здесь коммунистической революции в том виде, как её представлял Маркс, значит не понимать положение нашей страны."
 PRC_socialism_with_chinese_characteristics:0 "Социализм с китайской спецификой"
