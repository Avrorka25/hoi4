 prc.54.t:0 "Предложение от государства [From.GetName]"
 prc.54.d:0 "Недавно поступило предложение от [From.GetLeader]Представитель. Заявляя, что они хотели бы заручиться нашей поддержкой для создания другого правительства в северо-западном регионе Китая и использовать нашу поддержку для борьбы против японцев и японских вооруженных сил. [CHI.GetRulingParty]."
 prc.54.a:0 "Передайте им, чтобы они вместо этого сотрудничали с партией [CHI.GetRulingParty]."
 prc.54.b:0 "Посмотрим, насколько хорошо они справятся."
 prc.54.c:0 "Этот регион совершенно беспорядочный. Мы официально их не поддержим."
