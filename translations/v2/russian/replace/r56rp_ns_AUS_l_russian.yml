 austria.104.t:0 "Хеймвер начинает переворот!"
 austria.104.d:0 "После того, как мы не смогли справиться с элементами Хаймвера, которые выступали против нашего правительства, Эрнст Рюдигер Стархемберг и остальные члены Хаймвер начали переворот против кайзера, стремясь восстановить правительство Австро-фашистского Фронта Отечества."
 austria.104.a:0 "Они будут разгромлены!"
 austria.104.b:0 "Кайзер в последний раз предал Австрию!"
