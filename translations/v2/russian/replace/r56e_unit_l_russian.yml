l_russian:
 category_light_armor:0 "Лёгкая бронетехника и её варианты"
 category_flying_boat:0 "Морские патрульные самолёты"
 category_medium_maritime:0 "Средние морские бомбардировщики"
 militia:0 "Ополчение"
 militia_desc:0 "Ополчение — неформальные сухопутные силы, которые можно быстро развернуть без требований, предъявляемых к обычным армейским подразделениям. Бойцам ополчения не нужна столь длительная подготовка и большое количество снаряжения, как полноценному пехотному батальону. Однако по боевой эффективности они не заменят обычную пехоту."
 r56_allow_militia_formation:0 "Формализовать формирование милиции"
 r56_allow_militia_formation_desc:0 "Наше правительство легализует формирование нерегулярных батальонов милиции, чтобы сражаться вместе с нашими традиционными армейскими подразделениями."
 r56_militia_tech:0 "Ополчение"
 r56_militia_tech_desc:0 "Ополчение — неформальные сухопутные силы, которые можно быстро развернуть без требований, предъявляемых к обычным армейским подразделениям. Бойцам ополчения не нужна столь длительная подготовка и большое количество снаряжения, как полноценному пехотному батальону. Однако по боевой эффективности они не заменят обычную пехоту."
 r56_militia_tt:0 "Открывает §Yополчение§!"
 mot_shocktroop:0 "Моторизованные штурмовые войска"
 mot_shocktroop_desc:0 "Моторизованные штурмовые войска способны пробивать вражеские линии и добиваться прорыва. Это почти обязательно для любой формы глубокого боя и может существенно дезорганизовать обороняющихся."
 mech_shocktroop:0 "Механизированные штурмовые войска"
 mech_shocktroop_desc:0 "Механизированные штурмовые войска используют мобильность и развитие успеха, быстро входят в прорыв, окружают часть сил противника и удерживают позиции, пока фронт продвигается и сжимает окружённую группировку."
 garrison:0 "Гарнизон"
 garrison_desc:0 "Гарнизонные части — войска второй линии, используемые для охраны важных объектов вдали от фронта. Им не хватает тяжёлого снаряжения и транспорта, поэтому они малоподвижны, за исключением стратегической передислокации. Их противотанковые возможности ограничены, но они позволяют высвободить более боеспособные войска и снаряжение для фронта."
