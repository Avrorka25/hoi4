 tactic_causeway_ambushes:0 "Кровавые засады на дамбах"
 mission_type_tactics:0 "Тактика по задаче"
 mission_type_tactics_desc:0 "Подчинённому командиру в значительной степени предоставляются инициатива в планировании и свобода исполнения, что обеспечивает высокую гибкость на оперативном и тактическом уровнях командования.\n\n"
 force_concentration:0 "Концентрация сил"
 force_concentration_desc:0 "Сосредоточение войск так, чтобы создать подавляющее превосходство против отдельной части сил противника, может многократно увеличить эффективность благодаря значительному локальному перевесу."
 tactical_command:0 "Тактическое командование"
 tactical_command_desc:0 "Полномочия, переданные командиру для постановки задач подчинённым силам ради выполнения миссии, поставленной вышестоящим командованием."
 ASYMMETRICAL_WARFARE_DOCTRINE:0 "Асимметричная война"
 ASYMMETRICAL_WARFARE_DOCTRINE_DESC:0 "Против превосходящих армий мы должны переиграть врага тактически и заставить его дорого платить за войну на нашей земле."
 cat_r56_guerilla_warfare:0 "Доктрина асимметричной войны"
 r56_guerilla_warfare:0 "Асимметричная война"
 r56_guerilla_warfare_desc:0 "Необходимо реформировать методы ведения операций вооружёнными силами. Потенциальные противники обладают значительным преимуществом, поэтому асимметричный подход к войне становится жизненно важным условием для достижения успеха или сохранения конкурентоспособности."
 r56_double_envelopment:0 "Внезапный охват"
 r56_double_envelopment_desc:0 "Охват — древняя военная тактика, которую можно применять, когда силы противника растянуты, а мы лучше знаем местность. Быстро окружая и уничтожая небольшие вражеские группы, мы не дадим им получить помощь и нарушим действия более крупных сил, получив тактическое преимущество."
 r56_elastic_defence:0 "Эластичная оборона"
 r56_elastic_defence_desc:0 "Вместо сосредоточения всех сил на передовой эластичная оборона предполагает создание более глубокой системы рубежей. Это даёт защитнику дополнительное время на реакцию и контратаки, тогда как наступающий рассеивается и увязает."
 r56_infiltration_assault:0 "Штурм через просачивание"
 r56_infiltration_assault_desc:0 "На начальных этапах атаки пехота должна выявлять и поражать уязвимые участки обороны противника. Обходя и изолируя слабые места, остальные атакующие силы смогут сосредоточиться на подавлении более укреплённых позиций."
 r56_infiltration_in_depth:0 "Глубокое просачивание"
 r56_infiltration_in_depth_desc:0 "Наши войска теперь обучены обходить и изолировать опорные пункты противника на гораздо большей глубине. В идеале штурмовые части не должны останавливаться, пока не достигнут тыла врага и полностью не отсекут его силы."
 r56_backhand_blow:0 "Обратный удар"
 r56_backhand_blow_desc:0 "Вместо борьбы за каждый клочок земли зачастую выгоднее избегать прямого столкновения с прорвавшимися силами врага. Пусть противник растянется, а когда зайдёт слишком далеко, можно нанести контрудар, отрезать его и уничтожить."
 R56_DEEP_INFILTRATION_LABEL:0 "ГЛУБОКОЕ ПРОСАЧИВАНИЕ"
 R56_MILITA_LABEL:0 "УСИЛЕННОЕ ОПОЛЧЕНИЕ"
 R56_MILITA_LABEL_TT:0 "§WУсилить наши нерегулярные части и мобилизовать всё население на борьбу§!"
 r56_milita_formation:0 "Усиленное ополчение"
 r56_milita_formation_desc:0 ""
 r56_nd_conscription:0 "Всеобщий призыв без исключений"
 r56_nd_conscription_desc:0 "Необходимо призывать людей с различными физическими ограничениями, включая инвалидов и увечных. В этих условиях понятия гражданского лица, отделённого от военной службы, не существует."
 r56_peoples_army:0 "Народная армия"
 r56_peoples_army_desc:0 "Народная армия ставит силу человеческой решимости выше передового вооружения, компенсируя технологические ограничения мотивацией. Такой подход пользуется широкой поддержкой гражданского населения.\n\n"
 r56_tactical_withdrawal:0 "Тактическое отступление"
 r56_tactical_withdrawal_desc:0 "Своевременное распознавание угрозы окружения и отход могут предотвратить уничтожение значительной части наших сил."
 r56_prepared_defense:0 "Подготовленная оборона"
 r56_prepared_defense_desc:0 "Развитые полевые укрепления значительно усиливают оборону подразделения, обеспечивая лучшую защиту и контроль над полем боя."
 R56_LAST_STAND_LABEL:0 "ПОСЛЕДНИЙ РУБЕЖ"
 R56_LAST_STAND_LABEL_TT:0 "§WМы окапываемся, единые и непоколебимые, готовясь к последнему бою, ведь нас невозможно сломить.§!"
 r56_pocket_defence:0 "Оборона в окружении"
 r56_pocket_defence_desc:0 "При обороне наши войска могут оказаться в окружении. В такой ситуации их главная задача — удерживать позиции до тех пор, пока неизбежная контратака не прорвётся к ним и не освободит их."
 r56_last_stand:0 "Последний рубеж"
 r56_last_stand_desc:0 "Когда все пути отхода исчерпаны, остаётся лишь прочно закрепиться и мужественно принять последний вызов, сделав свой непоколебимый последний рубеж."
 R56_BREAKOUT_LABEL:0 "ПРОРЫВ"
 R56_BREAKOUT_LABEL_TT:0 "§WКогда враг окончательно истощится о нашу оборону, мы сможем подготовить контратаку и прорыв.§!"
 r56_breakout:0 "Прорыв"
 r56_breakout_desc:0 "§WКогда враг израсходует свои ресурсы и силы, мы сможем спланировать контратаку и прорваться из укреплённой обороны.§!"
 r56_breakthrough_priority:0 "Приоритет прорыва"
 r56_breakthrough_priority_desc:0 "Необходимость сосредоточения сил для прорывов важнее любых требований фронта. Локальные поражения меркнут перед возможностью нанести решающий и мощный удар."
 r56_operational_concentration:0 "Локальная концентрация наступления"
 r56_operational_concentration_desc:0 "Достижение подавляющего локального превосходства имеет первостепенное значение в любой военной операции. Если невозможно обеспечить полное превосходство по всему фронту, необходимо сознательно ослабить отдельные участки и сосредоточить силы там, где они нужнее всего."
