 losing_soverignty_threatened_tt:0 "§RСуверенитет Финляндии под угрозой§!Потеря контроля над финским государством уменьшится £GFX_power_balance_texticon §YОбщественное доверие§!."
 FIN_personal_agenda_svinhufvud_tt:0 "§GИскоренить социализм§!Иметь меньше, чем §Y1%§! поддержка $communism$ Идеология будет расти £GFX_power_balance_texticon §YОбщественное доверие§!. \n  - §RО поддержке социалистов§!Иметь больше, чем §Y9%§! поддержка $communism$ Идеология будет снижаться £GFX_power_balance_texticon §YОбщественное доверие§!. \n  - $losing_soverignty_threatened_tt$"
 FIN_personal_agenda_kallio_tt:0 "§GИскоренение экстремистов§!Иметь меньше, чем §Y1%§! поддержка $fascism$ и $communism$ Идеология будет расти £GFX_power_balance_texticon §YОбщественное доверие§!. \n  - §RО поддержке экстремистов§!Иметь больше, чем §Y9%§! поддержка $fascism$ или $communism$ Идеология будет снижаться £GFX_power_balance_texticon §YОбщественное доверие§!. \n  - $losing_soverignty_threatened_tt$"
 FIN_personal_agenda_ryti_tt:0 "§GМечта о Великой Финляндии§!Оккупация основных финских государств, принадлежащих врагу, увеличится £GFX_power_balance_texticon §YОбщественное доверие§!. \n  - §RО поддержке социалистов§!Иметь больше, чем §Y9%§! поддержка $democratic$ или $communism$ Идеология будет снижаться £GFX_power_balance_texticon §YОбщественное доверие§!. \n  - $losing_soverignty_threatened_tt$"
 FIN_personal_agenda_mannerheim_tt:0 "§GНадежный лидер§!Быть на войне будет возрастать £GFX_power_balance_texticon §YОбщественное доверие§!. \n  - §RНазначенный регент§!Быть в мире будет уменьшаться £GFX_power_balance_texticon §YОбщественное доверие§!."
 FIN_personal_agenda_paasikivi_tt:0 "§GРеалистичный консерватор§!Иметь больше, чем §Y95%§! £GFX_stability_texticon $stability$ будет увеличиваться £GFX_power_balance_texticon §YОбщественное доверие§!. \n  - §Rсмотритель§!Иметь меньше, чем §Y60%§! £GFX_stability_texticon $stability$ будет уменьшаться £GFX_power_balance_texticon §YОбщественное доверие§!. \n  - $losing_soverignty_threatened_tt$"
 FIN_personal_agenda_annala_tt:0 "§GСильная нация§!Иметь больше, чем §Y300.000§! £GFX_manpower_texticon  $MANPOWER$ в поле и менее чем §Y5%§! Сдавайтесь, пока на войне будет расти прогресс £GFX_power_balance_texticon §YОбщественное доверие§!. \n  - §RО поддержке социалистов§!Иметь больше, чем §Y9%§! поддержка $democratic$ или $communism$ Идеология будет снижаться £GFX_power_balance_texticon §YОбщественное доверие§!. \n  - $losing_soverignty_threatened_tt$"
 FIN_personal_agenda_tanner_tt:0 "§GОрганизация Объединенных Наций§!: Контроль §YКарджала§! Каждый человек, владеющий чем-то большим, чем §Y95%§! поддержка $democratic$ Идеология будет расти £GFX_power_balance_texticon §YОбщественное доверие§!. \n  - §RО поддержке экстремистов§!Иметь больше, чем §Y9%§! поддержка $fascism$ или $communism$ Идеология будет снижаться £GFX_power_balance_texticon §YОбщественное доверие§!. \n  - $losing_soverignty_threatened_tt$"
 FIN_personal_agenda_aaltonen_tt:0 "§GАнтифашистский крестовый поход§!Иметь вклад более чем §Y10%§! Участие во всех активных войнах и меньше, чем §Y5%§! Сдавайтесь, прогресс, находясь в состоянии войны против фашистской страны, будет возрастать. £GFX_power_balance_texticon §YОбщественное доверие§!. \n  - §RРазделенный пролетариат§!Иметь меньше, чем §Y80%§! поддержка $communism$ Идеология будет снижаться £GFX_power_balance_texticon §YОбщественное доверие§!. \n  - $losing_soverignty_threatened_tt$"
 FIN_personal_agenda_leino_tt:0 "§GУничтоженный европейский фашизм§!Иметь меньше, чем §Y1%§! поддержка $fascism$ Идеология, в то время как Европа будет свободна от фашистских правительств, будет расти. £GFX_power_balance_texticon §YОбщественное доверие§!. \n  - §RРазделенный пролетариат§!Иметь меньше, чем §Y80%§! поддержка $communism$ Идеология будет снижаться £GFX_power_balance_texticon §YОбщественное доверие§!. \n  - $losing_soverignty_threatened_tt$"
 FIN_personal_agenda_kuusinen_tt:0 "§GСолнечная система организаций§!: Имея все §Yскандинавский§! и §YБалтийские ключевые государства§! Контролируемая Финляндией или ее союзником страна увеличится. £GFX_power_balance_texticon §YОбщественное доверие§!. \n  - §RЗабытые финно-карелийцы§!Не контролируя государства §YКарджала§!, §YКола§!, §YОнега§! и §YОлонец§! будет уменьшаться £GFX_power_balance_texticon §YОбщественное доверие§!. \n  - $losing_soverignty_threatened_tt$"
 FIN_personal_agenda_von_hesse_tt:0 "§GМечта о Великой Финляндии§!Оккупация основных финских государств, принадлежащих врагу, увеличится £GFX_power_balance_texticon §YОбщественное доверие§!. \n  - §RО поддержке социалистов§!Иметь больше, чем §Y9%§! поддержка $democratic$ или $communism$ Идеология будет снижаться £GFX_power_balance_texticon §YОбщественное доверие§!. \n  - $losing_soverignty_threatened_tt$"
