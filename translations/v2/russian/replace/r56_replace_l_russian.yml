 GRE_third_hellenic_civilization_desc:0 "Режим Метаксаса оказался самым успешным правительством в истории нашей страны. Некогда измученный и обедневший греческий народ теперь объединён общими целями и стремлениями."
 HOL_heavy_cruiser_1_desc:0 "Голландский крейсер «Сурабая», первоначально называвшийся «Де Зевен Провинсиен», был кораблём береговой обороны («панцершип»), построенным и введённым в строй в Нидерландах до Первой мировой войны. Его водоизмещение превышало 6500 тонн, а основное вооружение составляли два 280-мм и четыре 150-мм орудия. Корабль служил во Второй мировой войне, пока в 1942 году не был потоплен японскими бомбардировщиками."
