 bba_AFA_skilled_desert_warriors_desc:0 "[ROOT.GetAdjective] воины всегда славились мастерством боя в пустыне. Именно благодаря этому и суровому климату [ROOT.GetNameDef] так долго удавалось избегать подчинения иностранным державам."
 BEL_resist_and_bite_desc:0 "Арденнские стрелки — наша наиболее элитная часть и лучше всех способны защитить нас от вторжения с востока."
 BUL_prussia_of_the_balkans_desc:0 "Теперь, когда наша армия полностью модернизирована, мы наконец можем по праву претендовать на звание «Пруссии Балкан»."
 CZE_csd:0 "Československé Státní Dráhy"
 FRA_weapons_purchases_category:1 "Закупить [USA.GetAdjective] оружие"
 GER_mefo_bills_modifier:0 "Векселя MEFO"
 GER_mefo_bills_modifier_desc:0 "Векселя MEFO были долговыми обязательствами, созданными Ялмаром Шахтом для финансирования перевооружения через фиктивную компанию «Металлургише Форшунгсгезельшафт», чтобы скрыть эти расходы от Франции и Великобритании. Срок действия векселей необходимо продлевать каждые шесть месяцев, иначе при наступлении срока по ним придётся расплачиваться. \n\n§RВступление в войну устранит зависимость от векселей MEFO и отсрочит необходимость выплат до окончания войны.§!"
 GER_wolfpack_tactics:0 "Тактика волчьей стаи"
 GER_wolfpack_tactics_desc:0 "Разделив наш подводный флот на «стаи», мы обнаружили, что он стал ещё смертоноснее, чем мы могли представить."
 HOL_propose_benelux_unification_tt:0 "§RЧтобы бонусы вступили в силу, соглашение должны одобрить все участники.§!"
 LAT_aizsargi:0 "Милитаризовать Айзсарги"
 LAT_aizsargi_desc:0 "Созданная в 1919 году как военизированная организация во время [LAT.GetAdjective] войны за независимость по примеру финской охранной организации «Суоелускунта», Айзсарги сыграла важную роль во внутренней обороне. Айзсарги поддержала Карлиса Улманиса при его приходе к власти в результате переворота 1934 года. Расширение и продвижение этой организации даст государству множество потенциальных новобранцев. "
 POL_lithuanian_annexation_desc:0 "Стало очевидно, что старые союзы можно восстановить, если мы готовы проявить некоторую агрессию. Возможно, стоит намекнуть литовцам, что им было бы гораздо безопаснее жить в составе более крупного и сильного государства… например, Польши."
 POL_lithuanian_ultimatum:0 "Литовский ультиматум"
 POL_central_region_strategy:0 "Стратегия Центрального промышленного района"
 POL_central_region_strategy_desc:0 "Сосредоточив заводы вдали от границ, особенно в таких ключевых районах, как Кельце, Скаржиско, Радом, Стараховице и Островец, мы сможем увеличить производство и одновременно защитить предприятия от потенциальных завоевателей."
 SOV_comecon_desc:0 "Создание Совета экономической взаимопомощи (СЭВ) обеспечит огромные экономические и промышленные преимущества всем членам Коминформа и ещё теснее объединит трудящихся наших великих стран!"
 SOV_third_five_year_plan:0 "Завершить пятилетний план"
 SOV_third_five_year_plan_desc:0 "Вторая пятилетка на завершающем этапе показала себя весьма успешной. Последний шаг предусматривает дальнейшую индустриализацию и электрификацию перспективных регионов нашей великой страны."
 SOV_finish_the_five_year_plan:0 "Продолжить пятилетний план"
 SOV_finish_the_five_year_plan_desc:0 "Нельзя останавливать прогресс нашего великого государства! Мы должны продолжить индустриальные усилия!"
 SOV_socialism_in_one_country:0 "Социализм в отдельно взятой стране"
 SOV_socialism_in_one_country_desc:0 "После поражения мерзких троцкистов мы можем принять великий план генерального секретаря Иосифа Сталина: социализм в одной стране. Сначала мы построим собственную коммунистическую утопию, а затем покажем всему миру, как следовать нашему примеру!"
 SWE_folkhemmet_desc:0 "Фолькхеммет, также известный как «Народный дом», — это идея общества без привилегированных и обездоленных, любимчиков и нежелательных, без эксплуатации нуждающихся, общества, где господствуют равенство, доброта и сотрудничество."
 TUR_balkan_pact:0 "Балканский пакт"
 TUR_british_dockyards_in_turkey:0 "Иностранные верфи в Турции"
 TUR_british_dockyards_in_turkey_desc:0 "Иностранцы могут предоставить нам столь необходимый опыт."
