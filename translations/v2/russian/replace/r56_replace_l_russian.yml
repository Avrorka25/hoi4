 TUR_destroyer_2:0 "Тип «Коджатепе»"
 TUR_destroyer_2_desc:0 "Два эсминца типа «Коджатепе» были построены в Италии для турецкого флота в 1931 году на основе итальянского проекта «Фольгоре». Корабли имели водоизмещение 1250 тонн и были вооружены четырьмя 120-мм/50 орудиями «Ансальдо» образца 1926 года и шестью 533-мм торпедными аппаратами. Они также обладали хорошей скоростью и дальностью хода."
 USA_carrier_1:0 "Тип «Лэнгли»"
 USA_carrier_1_desc:0 "Авианосец типа «Лэнгли» появился в результате переоборудования угольщика типа «Юпитер». Это позволило уложиться в ограничения Вашингтонского морского договора. Он стал первым действующим авианосцем ВМС США и более десяти лет использовался для отработки авианосных операций."
