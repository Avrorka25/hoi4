 GER_anschluss_desc:0 "Аншлюс, то есть объединение с Австрией, давно является целью германского народа. Хотя Версальский договор запрещает его, наконец пришло время осуществить эту мечту. Предложим австрийцам разделить с нами славную судьбу!"
 GER_operation_isabella_desc:0 "Британцы давно обладают значительным влиянием в Средиземном море и прилегающих регионах. Захватив ключевые порты в Испании, Португалии и Гибралтаре, мы сможем ещё сильнее затянуть хватку вокруг [ENG.GetNameDef]."
