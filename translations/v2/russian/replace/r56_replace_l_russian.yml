 form_polynesia_category_desc:0 "Земли Океании были заселены более тысячи лет назад, ещё до изобретения письменности в древнем Шумере. Хотя Океания простирается на тысячи миль океана, её народы, как ни парадоксально, во многом похожи друг на друга как культурно, так и политически."
 vittoria_mutilata_desc:0 "§LНаши союзники предали Италию и ударили нас в спину, нарушив Лондонский пакт. Мы пролили столько крови на Изонцо ради их победы, а они отказали нам в том, что по праву принадлежало нам. Теперь Италия возьмёт свою судьбу в собственные руки и исправит эту несправедливость.§!"
