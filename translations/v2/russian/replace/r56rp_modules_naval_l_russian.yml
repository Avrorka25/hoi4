l_russian:
 ship_light_medium_battery_1:0 "Близнецы 14,5 см пушки"
 ship_light_medium_battery_1_short:0 "Легкая батарея Twin крейсер I"
 ship_light_medium_battery_1_desc:0 "Компромисс между скорострельностью и массой снарядов, эти орудия предназначены для использования в лёгких крейсерах для поражения более мелких кораблей."
 ship_light_medium_battery_2:0 "Близнецы 15 см пушки"
 ship_light_medium_battery_2_short:0 "Легкая батарея Twin крейсер II"
 ship_light_medium_battery_2_desc:0 "Эти пушки представляют собой логическую эволюцию от предыдущих моделей и предназначены для того, чтобы позволить легким крейсерам иметь комфортное преимущество в огневой мощи над эсминцами и более старыми крейсерами."
 ship_light_medium_battery_3:0 "Близнецы 15,5 см пушки"
 ship_light_medium_battery_3_short:0 "Легкая батарея Twin крейсер III"
 ship_light_medium_battery_3_desc:0 "Включая ряд новых технологий, эта легкобронированная установка еще больше увеличивает разрыв между основными батареями эсминцев и легких крейсеров."
 ship_light_medium_battery_4:0 "Твин 15,5 см Автозарядные пушки"
 ship_light_medium_battery_4_short:0 "Легкая батарея Twin крейсер Auto-loading"
 ship_light_medium_battery_4_desc:0 "Разработанная с нуля для высокой скорости огня, эта установка была создана, чтобы позволить легким крейсерам отключать еще более крупных врагов через множество ударов."
 ship_light_medium_battery_1:0 "Тройные 14,5 см пушки"
 ship_light_medium_battery_1_short:0 "Легкая трехместная батарея крейсер I"
 ship_light_medium_battery_1_desc:0 "Компромисс между скорострельностью и массой снарядов, эти орудия предназначены для использования в лёгких крейсерах для поражения более мелких кораблей."
 ship_light_medium_battery_2:0 "Тройные 15 см пушки"
 ship_light_medium_battery_2_short:0 "Легкая трехместная батарея крейсер II"
 ship_light_medium_battery_2_desc:0 "Эти пушки представляют собой логическую эволюцию от предыдущих моделей и предназначены для того, чтобы позволить легким крейсерам иметь комфортное преимущество в огневой мощи над эсминцами и более старыми крейсерами."
 ship_light_medium_battery_3:0 "Тройные 15,5 см пушки"
 ship_light_medium_battery_3_short:0 "Легкий тройной крейсер Батарея III"
 ship_light_medium_battery_3_desc:0 "Включая ряд новых технологий, эта легкобронированная установка еще больше увеличивает разрыв между основными батареями эсминцев и легких крейсеров."
 ship_light_medium_battery_4:0 "Тройные 15,5 см самозарядные пушки"
 ship_light_medium_battery_4_short:0 "Легкий Triplet крейсер Battery Автозагрузка"
 ship_light_medium_battery_4_desc:0 "Разработанная с нуля для высокой скорости огня, эта установка была создана, чтобы позволить легким крейсерам отключать еще более крупных врагов через множество ударов."
 ship_medium_battery_1:0 "Тройные 17 см пушки"
 ship_medium_battery_1_short:0 "Тяжелый крейсер тройной батареи I"
 ship_medium_battery_1_desc:0 "Не имея возможности нанести значительный ущерб линкорам, эти средние пушки позволяют тяжелому крейсеру уверенно взаимодействовать с более легкими кораблями и другими крейсерами."
 ship_medium_battery_2:0 "Тройные 19 см пушки"
 ship_medium_battery_2_short:0 "Тяжелый крейсер Triple Battery II"
 ship_medium_battery_2_desc:0 "Эволюция более ранней конструкции, эти пушки были сделаны, чтобы идти в ногу с увеличением брони и более длинными диапазонами, на которых ведутся морские сражения."
 ship_medium_battery_3:0 "Тройные 20,3 см пушки"
 ship_medium_battery_3_short:0 "Тяжелый крейсер Triple Battery III"
 ship_medium_battery_3_desc:0 "Хотя это не самое большое оружие, которое можно установить на крейсере, эта пушка обеспечивает наилучший баланс между весом вооружения и огневой мощью и может надежно победить крейсер-броню."
 ship_medium_battery_4:0 "Тройные 20,3 см самозарядные пушки"
 ship_medium_battery_4_short:0 "Тяжелый крейсер Triple Battery IV"
 ship_medium_battery_4_desc:0 "С калибром, ограниченным существующими боеприпасами и с прицелом на модернизацию старых кораблей, эти новые пушки оснащены передовой системой автоматической загрузки для резкого повышения скорости стрельбы."
 ship_heavy_battery_1:0 "Тройные 28 см пушки"
 ship_heavy_battery_1_short:0 "Тяжелая тройная батарея I"
 ship_heavy_battery_1_desc:0 "Тройная крупнокалиберная пушечная башня, датируемая до Великой войны."
 ship_heavy_battery_2:0 "Тройные 30,5 см пушки"
 ship_heavy_battery_2_short:0 "Тяжелая тройная батарея II"
 ship_heavy_battery_2_desc:0 "Набор крупнокалиберных пушек в сильно бронированной установке. Редизайн башни позволяет повысить высоту орудия, тем самым увеличивая дальность стрельбы."
 ship_heavy_battery_3:0 "Тройные 38 см пушки"
 ship_heavy_battery_3_short:0 "Тяжелая трехместная батарея III"
 ship_heavy_battery_3_desc:0 "Тяжело бронированная установка для тяжелых орудий, включающая ряд новых технологий для повышения точности и скорости стрельбы."
 ship_heavy_battery_4:0 "Тройные 40,6 см пушки"
 ship_heavy_battery_4_short:0 "Тяжелая трехместная батарея IV"
 ship_heavy_battery_4_desc:0 "Окончательная эволюция тяжелой огневой мощи, эта тяжелобронированная установка обеспечивает высокую степень точности на больших расстояниях."
 r56rp_ship_heavy_battery_twin_1:0 "28 см пушки"
 ship_super_heavy_battery_1:0 "Три 46 см пушки"
 ship_super_heavy_battery_1_short:0 "Супертяжелая тройная батарея"
 ship_super_heavy_battery_1_desc:0 "Самая большая пушка, когда-либо установленная на корабле, эти массивные пушки были предназначены для проникновения в любую возможную броню на любом расстоянии."
 ship_escort_deck_space:0 "Малый перевозчик Hangar"
