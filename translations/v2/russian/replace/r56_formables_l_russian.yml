 recreate_belgium_category:0 "Воссоздать Бельгию"
 recreate_belgium_category_desc:0 "Хотя противоречия между фламандцами и валлонами определяли историю Бельгии, многие считают, что в одиночку нам не выжить в Европе, разделённой идеологическими конфликтами. Несмотря на другой язык, многие по-прежнему считают наших бывших партнёров наиболее близкими нам по сравнению с протестантами-голландцами и немцами или всё более централизованной Францией."
