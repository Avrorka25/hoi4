 form_turkestan_category_desc:0 "На протяжении веков преимущественно мусульманские тюркские народы Центральной Азии мечтали о собственном государстве, которое все они могли бы назвать своим домом. Октябрьская революция разрушила эту мечту, однако идея страны, которую иногда называют «Туркестаном», всё ещё не покидает умы многих людей..."
