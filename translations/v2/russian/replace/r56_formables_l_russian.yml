 unite_the_levant_category_desc:0 "Поддержав нас в борьбе против турецких угнетателей, британцы и французы предали наш народ и разделили Левант между собой под видом так называемых мандатов. Чтобы утвердить свою власть, они заставили Фейсала распустить Арабское королевство Сирия, и с тех пор Левант остаётся раздробленным. Теперь у нас появилась возможность вновь объединить провинции, разделённые западными державами, и создать Великую Сирию."
