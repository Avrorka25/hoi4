 CEL_UNIFIED_wall_of_steel:0 "Обратиться к бардовским кругам"
 CEL_UNIFIED_wall_of_steel_desc:0 "Франсуа Жаффренну, более известный под выбранным им именем Талдир («Стальная стена»), является великим друидом Горседда Бретани и пользуется большой популярностью среди бретонских автономистов. Теперь, когда Кельтский союз создан, его способности могли бы быть очень полезны нашему правительству."
