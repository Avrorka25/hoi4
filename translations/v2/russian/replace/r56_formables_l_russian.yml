 celtic_unification_category:0 "Кельтское объединение"
 celtic_unification_category_desc:0 "Веками кельтские народы были вынуждены жить под английским и французским игом вследствие коварных династических наследований и завоеваний, подавлявших нашу культуру и наследие. Но теперь кельтские народы наконец могут объединиться и показать миру свою силу и музыку."
