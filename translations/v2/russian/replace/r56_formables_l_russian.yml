 CARIB_antilles_gold_deposits:0 "Золотые месторождения Антильских островов"
 CARIB_antilles_gold_deposits_desc:0 "Золото в Карибском регионе впервые было обнаружено столетия назад Колумбом во время исследований и контактов с местным населением. Это подтолкнуло испанцев к новой волне экспансии в поисках золота. Хотя большая часть запасов была добыта ещё в прошлом, некоторые месторождения сохранились. Их разработка могла бы немного укрепить нашу экономику."
