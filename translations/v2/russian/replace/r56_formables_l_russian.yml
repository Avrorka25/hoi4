 AH_invest_in_north_transylvanian_mining:0 "Инвестировать в добычу полезных ископаемых Северной Трансильвании"
 AH_invest_in_north_transylvanian_mining_desc:0 "Трансильвания обладает богатой историей горнодобывающей промышленности, уходящей корнями на многие столетия. Даже если добываемые здесь ресурсы не имеют прямого применения на военных заводах, разработка местных полезных ископаемых всё равно внесёт значительный вклад в экономику."
 GUYANA_UNIFIED_guianese_unification:0 "Гвианское объединение"
 GUYANA_UNIFIED_guianese_unification_desc:0 "На протяжении веков колонизаторы разделяли этот регион. Теперь у нас есть уникальная возможность построить новое будущее, свободное от иностранного угнетения."
 GUYANA_UNIFIED_connect_the_cities:0 "Соединить города"
 GUYANA_UNIFIED_connect_the_cities_desc:0 "Три иностранные державы строили местную инфраструктуру лишь для соединения портов с отдельными районами добычи ресурсов. Нам нужна новая инфраструктура, чтобы создать единое государство."
 GUYANA_UNIFIED_administrative_reorganization:0 "Административная реорганизация"
 GUYANA_UNIFIED_administrative_reorganization_desc:0 "Три раздельные администрации должны быть объединены в единое целое"
 GUYANA_UNIFIED_naval_buildup:0 "Развитие флота"
 GUYANA_UNIFIED_naval_buildup_desc:0 "Расширение военно-морского строительства даст нам средства для защиты наших берегов."
 GUYANA_UNIFIED_legacy_of_piracy:0 "Наследие пиратства"
 GUYANA_UNIFIED_legacy_of_piracy_desc:0 "Когда-то это побережье служило убежищем для каперов и пиратов. Возможно, в современную эпоху эту роль смогут выполнять подводные лодки."
 GUYANA_UNIFIED_develop_mining:0 "Развивать горнодобывающую промышленность"
 GUYANA_UNIFIED_develop_mining_desc:0 "Наш ресурсный потенциал поистине огромен — нужно лишь правильно его использовать."
 GUYANA_UNIFIED_guyanese_gold_deposits:0 "Разрабатывать гвианские месторождения золота"
 GUYANA_UNIFIED_guyanese_gold_deposits_desc:0 "Недра наших восточных территорий особенно богаты золотом."
 GUYANA_UNIFIED_domestic_steel_production:0 "Собственное производство стали"
 GUYANA_UNIFIED_domestic_steel_production_desc:0 "Собственное производство стали снизит нашу зависимость от иностранных поставок."
 GUYANA_UNIFIED_defend_the_new_union:0 "Защитить новый союз"
 GUYANA_UNIFIED_defend_the_new_union_desc:0 "Наш Союз — беспрецедентное событие в истории, и внешние силы не должны его расчленить."
