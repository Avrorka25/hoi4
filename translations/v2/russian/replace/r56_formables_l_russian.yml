 form_hispanoamerica_category:0 "Наше наследие"
 form_hispanoamerica_category_desc:0 "Понятие «Испанидад» всегда имело довольно расплывчатое определение. Его неизменными составляющими были общее наследие всех испаноязычных народов и идея «Ла Раса» — смешения испанцев и коренных народов как в культуре, так и в крови.\n\nДолгое время это представляло прежде всего академический интерес, но недавно идея пережила возрождение. Уже в 1920 году её провозглашали наднациональной идентичностью, а во время Гражданской войны в Испании термин получил широкое распространение. Теперь же благодаря нашим недавним успехам он может стать чем-то большим — настоящей нацией. Настало время испаноязычным народам восстать как единое целое и занять своё место среди мировых держав."
