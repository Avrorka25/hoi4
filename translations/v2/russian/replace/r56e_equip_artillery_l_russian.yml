l_russian:
 anti_air_equipment:0 "Буксируемая зенитная артиллерия"
 anti_air_equipment_short:0 "Зенитная артиллерия"
 anti_air_equipment_desc:0 "Зенитные орудия предназначены для борьбы с авиацией противника, хотя скорострельные пушки неплохо справляются и с наземными целями."
 anti_air_equipment_1:0 "Воздушное судно 36"
 anti_air_equipment_1_short:0 "АА '36"
 anti_air_equipment_1_desc:0 "Зенитные орудия предназначены для борьбы с авиацией противника, хотя скорострельные пушки неплохо справляются и с наземными целями."
 anti_air_equipment_2:0 "Противовоздушный 40-й"
 anti_air_equipment_2_short:0 "АА '40"
 anti_air_equipment_2_desc:0 "Зенитные орудия с длинными стволами и мощными снарядами, способные попадать в цели на большой высоте."
 anti_air_equipment_3:0 "Воздушное судно 43"
 anti_air_equipment_3_short:0 "АА '43"
 anti_air_equipment_3_desc:01 "Усовершенствованное мобильное зенитное орудие с повышенной дальностью и огневой мощью для борьбы даже с самыми быстрыми и высотными самолётами противника."
 anti_air_equipment_x:0 "Воздушное судно 48"
 anti_air_equipment_x_short:0 "АА '48"
 anti_air_equipment_x_desc:0 "Переработанная мобильная зенитная установка с автоматом заряжания и возможностью дальнейшей модернизации."
 anti_tank_equipment:0 "Противотанковая артиллерия"
 anti_tank_equipment_short:0 "AT"
 anti_tank_equipment_desc:0 "Артиллерия, предназначенная для поражения бронированных целей, таких как танки. Обычно ведёт огонь бронебойными снарядами."
 anti_tank_equipment_1:0 "Противотанковая артиллерия '36"
 anti_tank_equipment_1_short:0 "В 36-м"
 anti_tank_equipment_1_desc:0 "Артиллерия, предназначенная для поражения бронированных целей, таких как танки. Обычно ведёт огонь бронебойными снарядами."
 anti_tank_equipment_2:0 "Противотанковая артиллерия '40"
 anti_tank_equipment_2_short:0 "В 40-м"
 anti_tank_equipment_2_desc:0 "Крупнокалиберные орудия, способные пробивать толстую и наклонную броню тяжелых танков."
 anti_tank_equipment_3:0 "Противотанковая артиллерия '43"
 anti_tank_equipment_3_short:0 "В 43-м."
 anti_tank_equipment_3_desc:0 "Повышение скорости снаряда вместе с разработками новых типов боеприпасов позволяют справиться с любой броней, которая может встретиться в бою."
 anti_tank_equipment_x:0 "Противотанковая артиллерия '48"
 anti_tank_equipment_x_short:0 "В 48-м"
 anti_tank_equipment_x_desc:0 "Ранний противотанковый гранатомёт, способный уничтожить любой состоящий на вооружении танк."
 armored_cars_tech:0 "Технологии бронемашин"
 ARMOUR_TITLE_CAR:0 "БРОНЕМАШИНА"
 armored_car:0 "Бронемашина"
 armored_car_equipment:0 "Бронемашина"
 armored_car_equipment_desc:0 "Бронемашина для быстрой разведки и поддержки пехоты."
 gw_armored_car_equipment:0 "Бронемашина '30"
 gw_armored_car_equipment_short:0 "Бронемашина '30"
 gw_armored_car_equipment_desc:0 "Во многих странах мира бронемашины стали первым видом бронетехники. Они предшествовали танкам, но продолжали использоваться во время Второй мировой войны и после неё."
 armored_car_equipment_1:0 "Бронемашина '39"
 armored_car_equipment_1_short:0 "Бронемашина '39"
 armored_car_equipment_1_desc:0 "Бронемашины часто действовали совместно с пехотой, оказывая ей лёгкую огневую поддержку."
 armored_car_equipment_2:0 "Бронемашина '42"
 armored_car_equipment_2_short:0 "Бронемашина '42"
 armored_car_equipment_2_desc:0 "Бронемашины часто действовали совместно с пехотой, оказывая ей лёгкую огневую поддержку."
 armored_car_at_equipment:0 "Противотанковая бронемашина"
 armored_car_at_equipment_short:0 "Противотанковая бронемашина"
 armored_car_equipment_at_desc:0 "Бронеавтомобили часто применялись вместе с пехотой для непосредственной поддержки. Эта машина оснащена лёгким противотанковым орудием."
 artillery_equipment:0 "Полевая артиллерия"
 artillery_equipment_short:0 "искусство"
 artillery_equipment_desc:0 "Крупнокалиберные орудия, обслуживаемые орудийными расчетами, например пушки и гаубицы, способные отправлять снаряды на расстояние, значительно превышающее дальность стрелкового оружия."
 artillery_equipment_1:0 "Артиллерия 30 лет"
 artillery_equipment_1_short:0 "Искусство 30"
 artillery_equipment_1_desc:0 "Крупнокалиберные орудия, например пушки и гаубицы, обслуживаемые расчётами и способные поражать цели далеко за пределами эффективной дальности стрелкового оружия."
 artillery_equipment_2:0 "Полевая артиллерия '39"
 artillery_equipment_2_short:0 "Искусство 39"
 artillery_equipment_2_desc:0 "Новая конструкция гаубицы, использующая гидравлическое гашение отдачи и более длинный ствол."
 artillery_equipment_3:0 "Полевая артиллерия '42"
 artillery_equipment_3_short:0 "АРТ-42"
 artillery_equipment_3_desc:0 "Облегченная конструкция, предусматривающая разборку для транспортировки, что позволяет обеспечить огневой поддержкой труднодоступные места."
 artillery_equipment_x:0 "Полевая артиллерия '45"
 artillery_equipment_x_short:0 "АРТ 45"
 artillery_equipment_x_desc:0 "Несмотря на уменьшенные размеры, эти артиллерийские орудия способны наносить мощные удары, демонстрируя грозную огневую мощь на поле боя."
 rocket_artillery_equipment:0 "Реактивная артиллерия"
 rocket_artillery_equipment_short:0 "Р-АРТ"
 rocket_artillery_equipment_desc:0 "Реактивная артиллерия менее точна и скорострельна, чем традиционные орудия, однако все недостатки окупаются эффектом от попадания ракетного залпа в цель."
 rocket_artillery_equipment_1:0 "Ракетная артиллерия 41"
 rocket_artillery_equipment_1_short:0 "R-ART '41"
 rocket_artillery_equipment_1_desc:0 "Реактивная артиллерия менее точна и скорострельна, чем традиционные орудия, однако недостатки окупаются эффектом от одновременного попадания нескольких ракет в цель."
 rocket_artillery_equipment_2:0 "Реактивная артиллерия '43"
 rocket_artillery_equipment_2_short:0 "R-ART '43"
 rocket_artillery_equipment_2_desc:0 "Ракеты, стабилизируемые вращением, увеличивают дальность стрельбы лёгких артиллерийских батарей."
 rocket_artillery_equipment_x:0 "Реактивная артиллерия '48"
 rocket_artillery_equipment_x_short:0 "R-ART '48"
 rocket_artillery_equipment_x_desc:0 "Увеличенные дальность и мощность ракет повышают эффективность артиллерийских батарей и обеспечивают впечатляющую огневую мощь."
