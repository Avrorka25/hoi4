 r56_ENG_decision_support_percy_hobart:0 "Поддержать Перси Хобарта"
 r56_ENG_decision_support_percy_hobart_desc:0 "Перси Хобарт придерживается необычных взглядов на применение танков и из-за этого не слишком популярен среди других генералов. Однако его революционный подход к конструкции и использованию бронетехники может оказаться чрезвычайно полезным."
