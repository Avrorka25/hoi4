 GER_reichskommissariats:0 "Рейхскомиссариаты"
 GER_reichskommissariats_desc:0 "По мере расширения контролируемых нами земель управление ими из Берлина становится всё более затратным — как материально, так и для сил правопорядка, пытающихся удерживать порядок на местах. Создание более мелких административных единиц для управления частью новых владений и привлечение коллаборационистов к поддержанию порядка в их новом «государстве» может оказаться единственным устойчивым решением.\n\nКаждый созданный нами [ROOT.GetFlag]§Yрейхскомиссариат§! или [D10.GetFlag]§Yрейхспротекторат§! даст нам §G3§! вне карты §Yвоенные фабрики.§! [ROOT.GetFlag]§YРейхскомиссариаты§! также будут бороться с сопротивлением на подконтрольных им территориях. Однако передача борьбы с сопротивлением [ROOT.GetFlag]§Yрейхскомиссариатам§! со временем может привести к росту числа §Rвосстаний§! и §Rсопротивления§! в контролируемых ими регионах."
