 discredit_government_neutrality:0 "Дискредитировать правительство"
 r56_alone_faction_leader:0 "Найти союзников"
 r56_alone_faction_leader_desc:0 "Если нам не удастся найти союзников, наше дипломатическое положение станет нелепым и нам придётся искать новые дипломатические возможности."
 ENG_restore_the_UK:0 "Восстановить Соединённое Королевство"
 ENG_restore_the_UK_desc:0 "Мы должны положить конец разделению Британии, восстановить наш многовековой союз Англии, Шотландии, Уэльса и Северной Ирландии в составе Соединённого Королевства и вновь укрепить его, чтобы собрать силы и переосмыслить своё место на мировой арене."
 unite_britain:0 "Восстановить британское единство"
 reunite_germany:0 "Воссоединить Германию"
 reintegrate_lands_beyond_the_oder_neisse_line:0 "Реинтегрировать земли за линией Одер — Нейсе"
 reunite_italy:0 "Воссоединить Италию"
 unite_the_cossack_hosts:0 "Объединить казачьи войска"
 recruit_women_pilots:0 "Набрать женщин-пилотов"
 recruit_women_pilots_desc:0 "В этот судьбоносный для нашей страны час мы не можем позволить себе растрачивать чьи-либо таланты. Лётчицы поражали общественность своими достижениями в 1930-х годах. Их необходимо мобилизовать ради национального дела, чтобы они исполняли свой долг наравне с мужчинами."
 r56_collect_civilian_aluminium_utensils:0 "Собрать гражданские алюминиевые изделия"
 r56_collect_civilian_aluminium_utensils_desc:0 "Алюминий жизненно важен для военных нужд. В это трудное время необходимо организовать пункты сбора велосипедов, кастрюль и других предметов для повторного использования в военном производстве."
