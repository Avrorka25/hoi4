 r56_GER_decision_support_eugen_meindl:0 "Поддержать Ойгена Майндля"
 r56_GER_decision_support_eugen_meindl_desc:0 "Курт Штудент, возможно, самый известный сторонник воздушно-десантных войск среди армейских командиров, но в люфтваффе есть и много других талантливых военачальников."
 r56_GER_decision_support_richard_heidrich:0 "Поддержать Рихарда Хайдриха"
 r56_GER_decision_support_richard_heidrich_desc:0 "Курт Штудент, возможно, самый известный сторонник воздушно-десантных войск среди армейских командиров, но в люфтваффе есть и много других талантливых военачальников."
 r56_HUN_decision_support_bertalan_arpad:0 "Поддержать Арпада Берталана"
 r56_HUN_decision_support_bertalan_arpad_desc:0 "Арпад Берталан, герой Первой мировой войны, усердно работает над созданием элитного подразделения из лучших солдат Венгрии. Мы должны использовать его таланты."
 NOR_nortraship_category:0 "Нортрашип"
 NOR_nortraship_category_desc:0 "Нортрашип — компания, управляющая всеми норвежскими торговыми судами, не находящимися под контролем врага. Хотя ими управляют гражданские, эти корабли значительно помогут нашим союзникам и приблизят возвращение нашей свободы."
