 game_rules_reminder_category:0 "Напоминание о правилах игры"
 game_rules_reminder_category_desc:0 "Не забудьте проверить §YПользовательские правила игры§! Кнопка на карте стартовый экран! Он включает в себя множество вариантов, таких как §YВыбор дерева Focus§!, что позволяет обмениваться между базовой игрой и Road на 56 деревьев фокусировки для нескольких стран. Есть также §YИгрок Peace Control§!, §YЦвет предмета контроля§! и большой выбор изменений геймплея, таких как тогглинг §YНациональные персонажи§! Доступно!"
