 r56_ENG_decision_send_wavell_to_india:0 "Отправить Арчибальда Уэйвелла в Индию"
 r56_ENG_decision_send_wavell_to_india_desc:0 "Здесь способности Арчибальда Уэйвелла используются не в полной мере. Он мог бы принести гораздо больше пользы, усилив Британскую индийскую армию."
 r56_ENG_decision_recall_gilbert_stephenson:0 "Отозвать Гилберта Стивенсона"
 r56_ENG_decision_recall_gilbert_stephenson_desc:0 "Чтобы противостоять вновь возникшей подводной угрозе, необходимо опереться на опыт старших командиров, сражавшихся с немецкими подлодками во время Великой войны. Ветеран противолодочной борьбы Гилберт Стивенсон идеально подходит для подготовки нового поколения моряков."
