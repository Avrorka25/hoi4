l_russian:
 industrial_requisition_category:0 "Промышленная реквизиция"
 industrial_requisition_category_desc:0 "Риски, связанные с работой заводов на оккупированных территориях, можно снизить, перевезя станочное оборудование в нашу страну. Хотя это уменьшит угрозу саботажа, часть населения, вероятно, решит сопротивляться нам."
 seize_machine_toolings_in_state:0 "Изъять станочное оборудование в [FROM.GetName]"
