 light_tank_equipment_3_desc:0 "Лёгкие танки — небольшие и манёвренные машины, способные вести разведку и бороться со слабо бронированным противником."
 light_tank_equipment_x:0 "Лёгкий танк '45"
 light_tank_equipment_x_short:0 "Л. танк '45"
 light_tank_equipment_x_desc:0 "Хотя эти танки не способны выдерживать сильный огонь, они легки и предназначены для быстрых и решительных манёвров."
 light_tank_equipment_x_2:0 "Лёгкий танк '49"
 light_tank_equipment_x_2_short:0 "Л. танк '49"
 light_tank_equipment_x_2_desc:0 "Хотя эти танки не способны выдерживать сильный огонь, они легки и предназначены для быстрых и решительных манёвров."
 light_tank_chassis_4:0 "Шасси современного лёгкого танка"
 light_tank_destroyer_chassis_4:0 "Современный лёгкий истребитель танков"
 light_tank_aa_chassis_4:0 "Современная лёгкая ЗСУ"
 light_tank_artillery_chassis_4:0 "Современная лёгкая САУ"
 light_tank_artillery_equipment:0 "Легкая САУ"
 light_tank_artillery_equipment_desc:0 "Небольшое артиллерийское орудие на лёгком шасси. Лёгкая САУ уступает более тяжёлым аналогам по огневой мощи, но превосходит их в мобильности."
 light_tank_artillery_equipment_1:0 "Лёгкая САУ '34"
