 HAN_modern_tank_equipment_x_5_short:0 "Леопард"
 WGR_gw_tank_equipment:0 "Leichttraktor"
 WGR_gw_tank_equipment_desc:0 "«Leichttraktor» («легкий трактор») был экспериментальной немецкой разработкой. После Первой мировой войны Версальский договор ограничивал военное развитие Германии, поэтому разработка бронетехники и артиллерии шла в секрете."
 WGR_gw_tank_equipment_short:0 "Leichttraktor"
 WGR_heavy_tank_artillery_equipment_2:0 "Sturmtiger"
 WGR_heavy_tank_artillery_equipment_2_short:0 "Sturmtiger"
 WGR_heavy_tank_artillery_equipment_3:0 "Гешютцваген Тигр"
 WGR_heavy_tank_artillery_equipment_3_desc:0 "Машина на корпусе «Королевского тигра», на которую предполагалось установить 170-мм пушку K 72 L/50."
 WGR_heavy_tank_artillery_equipment_3_short:0 "GW Тигр"
 WGR_heavy_tank_destroyer_equipment_1:0 "Selbstfahrlafette auf VK3001(H) Sturer Emil"
 WGR_heavy_tank_destroyer_equipment_1_desc:0 "Selbstfahrlafette auf VK3001 (H) «Штурер Эмиль» («Упрямый Эмиль») — немецкое самоходное противотанковое орудие на основе шасси проекта VK3001 фирмы «Хеншель»."
 WGR_heavy_tank_destroyer_equipment_1_short:0 "Sturer Emil"
 WGR_heavy_tank_destroyer_equipment_2:0 "PanzerjäWGR Тигр (P)"
 WGR_heavy_tank_destroyer_equipment_2_desc:0 "«Элефант» (по-немецки «слон») — тяжёлый истребитель танков на шасси отменённого проекта танка «Тигр» компании Porsche, вооружённый 88-мм пушкой Panzerabwehrkanone 43/2."
 WGR_heavy_tank_destroyer_equipment_2_short:0 "Элефант"
 WGR_heavy_tank_destroyer_equipment_3:0 "PanzerjäWGR Тигр Ausf. B"
 WGR_heavy_tank_destroyer_equipment_3_desc:0 "«Ягдтигр» стал самым тяжелым танком, применявшимся на полях Второй мировой войны. Он был вооружен 128-мм пушкой PaK 44 L/55 и защищен толстейшей лобовой броней."
 WGR_heavy_tank_destroyer_equipment_3_short:0 "Ягдтигр"
 WGR_heavy_tank_equipment_1:0 "Grosstraktor"
 WGR_heavy_tank_equipment_1_desc:0 "«Grosstraktor» («большой трактор») — серия прототипов тяжелого танка, разработанная Германией. После Первой мировой войны Версальский договор ограничивал военное развитие Германии, поэтому разработка бронетехники и артиллерии шла в секрете."
 WGR_heavy_tank_equipment_1_short:0 "Grosstraktor"
 WGR_heavy_tank_equipment_2:0 "Панцеркампфваген VI Тигр"
 WGR_heavy_tank_equipment_2_desc:0 "«Тигр I» — немецкий тяжёлый танк, разработанный в 1942 году в ответ на неожиданно высокие качества советской бронетехники, с которой войска Оси столкнулись в первые месяцы вторжения в Советский Союз, прежде всего танков Т-34 и КВ-1."
 WGR_heavy_tank_equipment_2_short:0 "Тигр"
 WGR_heavy_tank_equipment_3:0 "Панцеркампфваген Тигр Ausf. B"
 WGR_heavy_tank_equipment_3_desc:0 "Неофициальное название Königstiger солдаты союзников часто переводили почти буквально как «Королевский тигр». Танк развивал концепцию «Тигра I», но должен был стать ещё более грозной машиной. «Тигр II» сочетал толстую броню «Тигра I» с наклонным расположением бронелистов, применённым на среднем танке «Пантера». Машина весила почти семьдесят метрических тонн, имела лобовую броню толщиной от 100 до 180 мм и была вооружена длинноствольной 8,8-см пушкой Kampfwagenkanone 43 L/71."
 WGR_heavy_tank_equipment_3_short:0 "King Тигр"
 WGR_light_tank_aa_equipment_1:0 "Флакпанцер I"
 WGR_light_tank_aa_equipment_1_desc:0 "Зенитная пушка, установленная на шасси танка Pz I."
 WGR_light_tank_aa_equipment_1_short:0 "FlakPz I"
 WGR_light_tank_aa_equipment_2:0 "Флакпанцер Лукс"
 WGR_light_tank_aa_equipment_2_desc:0 "Зенитная пушка, установленная на шасси танка Pz. II."
 WGR_light_tank_aa_equipment_2_short:0 "FlakPz Лукс"
 WGR_light_tank_aa_equipment_3:0 "Флакпанцер 2801"
 WGR_light_tank_aa_equipment_3_short:0 "FlakPz 2801"
 WGR_light_tank_aa_equipment_3_desc:0 "Зенитная пушка, установленная на шасси танка VK1602."
 WGR_light_tank_artillery_equipment_1:0 "Штурмпанцер I Bison"
 WGR_light_tank_artillery_equipment_1_desc:0 "Буксируемые орудия, которыми оснащались артиллерийские роты полков моторизированной пехоты, часто не успевали за танками во время боя. Самым простым решением проблемы стала установка орудия на шасси танка. В случае с САУ «Бизон» использовалось шасси Pz. I."
 WGR_light_tank_artillery_equipment_1_short:0 "Bison"
 WGR_light_tank_artillery_equipment_2:0 "Sd. Kfz. 124 Веспе"
 WGR_light_tank_artillery_equipment_2_desc:0 "Sd.Kfz. 124 «Веспе» (по-немецки «оса») — немецкая самоходная артиллерийская установка на модифицированном шасси Panzer II."
 WGR_light_tank_artillery_equipment_2_short:0 "Веспе"
 WGR_light_tank_artillery_equipment_3:0 "Waffentrager Леопард"
 WGR_light_tank_artillery_equipment_3_desc:0 "«Ваффентрагер Леопард» — проект самоходной артиллерийской установки на шасси разрабатывавшегося танка VK1602 «Леопард»."
 WGR_light_tank_artillery_equipment_3_short:0 "WT Леопард"
 WGR_light_tank_destroyer_equipment_1:0 "7.5 cm PaK 40 auf Fahrgestell Мардер II"
 WGR_light_tank_destroyer_equipment_1_desc:0 "«Мардер II» — немецкий истребитель танков на шасси Panzer II."
 WGR_light_tank_destroyer_equipment_1_short:0 "Мардер II"
 WGR_light_tank_destroyer_equipment_2:0 "Мардер III"
 WGR_light_tank_destroyer_equipment_2_short:0 "Мардер III"
 WGR_light_tank_destroyer_equipment_3:0 "Штурмовое орудие на базе «Леопарда»"
 WGR_light_tank_destroyer_equipment_3_desc:0 "«Ягдлеопард» — возможная модификация проектировавшегося лёгкого танка VK1602 «Леопард»."
 WGR_light_tank_destroyer_equipment_3_short:0 "Ягдлеопард"
 WGR_light_tank_equipment_1:0 "Панцеркампфваген I"
 WGR_light_tank_equipment_1_desc:0 "Panzerkampfwagen I — лёгкий танк, производившийся в Германии в 30-х годах. Разработка была начата в 1932-м, а массовое производство запущено в 1934-м. Изначально разрабатывался как учебный танк для знакомства армии с бронетехникой, но из-за отсутствия более современных танков активно использовался в боевых действиях."
 WGR_light_tank_equipment_1_short:0 "Panzer I"
 WGR_light_tank_equipment_2:0 "Панцеркампфваген II"
 WGR_light_tank_equipment_2_desc:0 "Pz.Kpfw. II создавался в качестве временной меры, пока велась разработка более современных образцов, однако принял активное участие в боевых действиях из-за нехватки достаточного количества более мощных танков."
 WGR_light_tank_equipment_2_short:0 "Panzer II"
 WGR_light_tank_equipment_3:0 "VK1602 Леопард"
 WGR_light_tank_equipment_3_desc:0 "VK1602 «Леопард» — проект немецкой разведывательной машины, разработанный в 1942 году. Первоначально её предполагалось вооружить 75-мм пушкой Kwk 41, но затем выбрали менее крупное 50-мм орудие. Под влиянием конструкции среднего танка «Пантера» VK1602 получил наклонную лобовую броню. Машина оснащалась гусеницами шириной 350 мм."
 WGR_light_tank_equipment_3_short:0 "Леопард"
 WGR_medium_tank_aa_equipment_1:0 "Флакпанцер 38(t)"
 WGR_medium_tank_aa_equipment_1_short:0 "Flakpz 38(t)"
 WGR_medium_tank_aa_equipment_1_desc:0 "«Флакпанцер 38(t)» на шасси PzKpfw 38(t) был вооружён 20-мм пушкой Flak 30 или Flak 38 L/112.5 с боекомплектом в 1040 выстрелов. Броневая защита была слабой. С ноября 1943 по февраль 1944 года выпустили всего 141 такую машину."
 WGR_medium_tank_aa_equipment_2:0 "Флакпанцер IV Оствинд"
 WGR_medium_tank_aa_equipment_2_desc:0 "«Флакпанцер IV Оствинд» (по-немецки «восточный ветер») — зенитная самоходная установка на базе танка Panzer IV. Её разработали в 1944 году в качестве преемницы более раннего «Флакпанцера IV». Башню Panzer IV заменили открытой сверху шестигранной башней с 3,7-см пушкой FlaK 43. Закрытая башня была бы предпочтительнее, но её применение оказалось невозможным из-за сильного задымления при стрельбе."
 WGR_medium_tank_aa_equipment_2_short:0 "Оствинд"
 WGR_medium_tank_aa_equipment_3:0 "Флакпанцер Coelian"
 WGR_medium_tank_aa_equipment_3_short:0 "Coelian"
 WGR_medium_tank_aa_equipment_3_desc:0 "«Флакпанцер Кёлиан» — проект зенитной самоходной установки, разработанный компанией Rheinmetall для немецких вооружённых сил во время Второй мировой войны. На шасси среднего танка «Пантера» предполагалось установить полностью закрытую вращающуюся башню с двумя 3,7-см пушками FlaK 43, но до окончания войны в Европе машину так и не построили."
 WGR_medium_tank_artillery_equipment_1:0 "Грилле"
 WGR_medium_tank_artillery_equipment_1_desc:0 "Sd.Kfz. 138/1 «Грилле» (по-немецки «сверчок») — самоходная артиллерийская установка, применявшаяся Германией во Второй мировой войне. Было выпущено около 490–500 машин. Они состояли на вооружении танковых дивизий, действовавших в Советском Союзе, а также частей в Польше и Франции. Эти установки использовались до 1945 года и также служили в Тунисе, где сражались с вражеской артиллерией и танками."
 WGR_medium_tank_artillery_equipment_1_short:0 "Грилле"
 WGR_medium_tank_artillery_equipment_2:0 "Хуммель"
 WGR_medium_tank_artillery_equipment_2_desc:0 "«Хуммель» (по-немецки «шмель») — самоходная артиллерийская установка на шасси Geschützwagen III/IV, вооружённая 15-см гаубицей. Вермахт применял её во Второй мировой войне с начала 1943 года до окончания боевых действий."
 WGR_medium_tank_artillery_equipment_2_short:0 "Хуммель"
 WGR_medium_tank_artillery_equipment_3:0 "Грилле 12"
 WGR_medium_tank_artillery_equipment_3_short:0 "Грилле 12"
 WGR_medium_tank_artillery_equipment_3_desc:0 "В 1944 году компания Krupp предложила проект самоходной артиллерийской установки с 12,8-см гаубицей на основе узлов танка «Пантера». Исторически он так и не вышел за стадию концепции."
 WGR_medium_tank_destroyer_equipment_1:0 "Штурмгешютц III"
 WGR_medium_tank_destroyer_equipment_1_desc:0 "Штурмовое орудие «Штурмгешюц III» стало самой массовой немецкой бронированной боевой машиной Второй мировой войны. Его строили на шасси проверенного танка Panzer III. Первоначально StuG задумывался как подвижное лёгкое орудие с броневой защитой для поддержки пехоты, но постоянно совершенствовался и широко применялся в качестве истребителя танков."
 WGR_medium_tank_destroyer_equipment_1_short:0 "StuG III"
 WGR_medium_tank_destroyer_equipment_2:0 "Ягдпанцер IV"
 WGR_medium_tank_destroyer_equipment_2_desc:0 "«Ягдпанцер IV» состоял на вооружении противотанковых подразделений танковых дивизий вермахта и СС. Эти машины сражались в Нормандии, Арденнах и на Восточном фронте. Они были весьма успешными истребителями танков, но, как и большинство машин этого класса, плохо справлялись с задачами танков или штурмовых орудий. Тем не менее на поздних этапах войны их всё чаще использовали вместо танков, поскольку другой техники зачастую не было."
 WGR_medium_tank_destroyer_equipment_2_short:0 "JagdPz IV"
 WGR_medium_tank_destroyer_equipment_3:0 "Ягдпантера"
 WGR_medium_tank_destroyer_equipment_3_desc:0 "«Ягдпантера» (по-немецки «охотящаяся пантера») — истребитель танков, созданный нацистской Германией во Второй мировой войне на шасси танка «Пантера». Он поступил на вооружение лишь в 1944 году и применялся на Восточном и Западном фронтах. «Ягдпантера» сочетала очень мощную 8,8-см пушку PaK 43 танка «Тигр II» с превосходной бронёй и подвеской шасси «Пантеры». Однако тяжёлое положение Германии в конце войны ограничивало производство, вызывало нехватку запасных частей и сказывалось на подготовке экипажей."
 WGR_medium_tank_destroyer_equipment_3_short:0 "Ягдпантера"
 WGR_medium_tank_equipment_1:0 "Панцеркампфваген III"
 WGR_medium_tank_equipment_1_desc:0 "Ещё в 1934–1935 годах генерал Гейнц Гудериан задумал два основных типа машин, которые должны были стать наиболее массовыми в будущих немецких танковых дивизиях. Первую машину предполагалось вооружить противотанковой пушкой и двумя пулемётами, а вторую сделать машиной поддержки с орудием более крупного калибра. Первая впоследствии получила название Panzerkampfwagen III и должна была стать стандартным танком трёх лёгких рот танкового батальона. Вторая стала известна как Panzerkampfwagen IV."
 WGR_medium_tank_equipment_1_short:0 "Panzer III"
 WGR_medium_tank_equipment_2:0 "Панцеркампфваген IV"
 WGR_medium_tank_equipment_2_desc:0 "Pz IV, разработанный как танк поддержки пехоты, не должен был встречаться с вражескими танками — эту функцию выполнял более легкий Panzer III. Однако изъяны изначальной довоенной доктрины становились все более очевидны. Появление танков T-34 заставило Pz IV взять на себя роль борца с танками, которые оказались не по зубам его стремительно устаревающему собрату. Pz IV стал наиболее массово производимым и применяемым немецким танком Второй мировой войны, а его конструкция легла в основу многих других боевых машин."
 WGR_medium_tank_equipment_2_short:0 "Panzer IV"
 WGR_medium_tank_equipment_3:0 "Панцеркампфваген V Пантера"
 WGR_medium_tank_equipment_3_desc:0 "«Пантера» — распространённое название среднего танка, применявшегося Германией во Второй мировой войне с середины 1943 года до окончания войны в Европе в 1945 году. Он создавался для противодействия советскому Т-34 и замены Panzer III и Panzer IV. Полностью вытеснить эти машины ему не удалось: «Пантера» служила вместе с ними и более тяжёлыми «Тиграми» до конца войны. Превосходное сочетание огневой мощи, подвижности и защиты стало ориентиром для поздних военных и послевоенных танков других стран. «Пантеру» считают одним из лучших танков Второй мировой войны."
 WGR_medium_tank_equipment_3_short:0 "Пантера"
 WGR_modern_tank_aa_equipment_1:0 "Флакпанцер E-50"
 WGR_modern_tank_aa_equipment_1_short:0 "FlakPz E-50"
 WGR_modern_tank_aa_equipment_1_desc:0 "«Флакпанцер E-50» — гипотетическая зенитная самоходная установка со спаренными 5,5-см зенитными пушками во вращающейся на полный круг башне на корпусе E-50. Предполагались экипаж из четырёх человек и боекомплект в 104 выстрела."
 WGR_modern_tank_destroyer_equipment_1:0 "E-25 Standardpanzer"
 WGR_modern_tank_destroyer_equipment_1_desc:0 "E-25, модернизированная версия Jagdpanzer IV, сочетает в себе маневренность и улучшенную броню."
 WGR_modern_tank_destroyer_equipment_1_short:0 "E-25"
 WGR_modern_tank_equipment_1:0 "E-50 Standardpanzer"
 WGR_modern_tank_equipment_1_desc:0 "Серия Entwicklung была попыткой Германии в конце войны создать унифицированное семейство танков. Планировались стандартные конструкции в шести весовых категориях. E-50 Standardpanzer должен был заменить танки серий «Пантера» и «Тигр», а также машины на их базе."
 WGR_modern_tank_equipment_1_short:0 "E-50"
 WGR_super_heavy_tank_aa_equipment_1:0 "Флакпанцер VIII Маус"
 WGR_super_heavy_tank_aa_equipment_1_desc:0 "Шасси танка «Маус» со спаренными 88-мм зенитными пушками."
 WGR_super_heavy_tank_aa_equipment_1_short:0 "FlakМаус"
 WGR_super_heavy_tank_artillery_equipment_1:0 "Гешютцваген E-100"
 WGR_super_heavy_tank_artillery_equipment_1_desc:0 "Самоходное 210-мм артиллерийское орудие, установленное на шасси сверхтяжелого танка и не уступавшее ряду пушек на железнодорожных платформах."
 WGR_super_heavy_tank_artillery_equipment_1_short:0 "GW E-100"
 WGR_super_heavy_tank_destroyer_equipment_1:0 "SturmGeschütz auf Fahrgestell Маус"
 WGR_super_heavy_tank_destroyer_equipment_1_desc:0 "Шасси танка «Маус» со 150-мм пушкой в неподвижной рубке."
 WGR_super_heavy_tank_destroyer_equipment_1_short:0 "Jagdmaus"
 WGR_super_heavy_tank_equipment_1:0 "Панцеркампфваген VIII Маус"
 WGR_super_heavy_tank_equipment_1_desc:0 "Panzerkampfwagen VIII «Маус» (по-немецки «мышь») — немецкий сверхтяжёлый танк времён Второй мировой войны, постройку которого завершили в конце 1944 года. Это самая тяжёлая из когда-либо построенных боевых машин с полностью закрытым броневым корпусом. Основным вооружением «Мауса» была 128-мм пушка KwK 44 L/55, дополненная спаренным 75-мм орудием."
 WGR_super_heavy_tank_equipment_1_short:0 "Маус"
 WGR_modern_tank_equipment_x:0 "M46 Patton"
 WGR_modern_tank_equipment_x_short:0 "M46 Patton"
 WGR_modern_tank_equipment_x_2:0 "M47 Patton"
 WGR_modern_tank_equipment_x_2_short:0 "M47 Patton"
 WGR_modern_tank_equipment_x_3:0 "M48 Patton"
 WGR_modern_tank_equipment_x_3_short:0 "M48 Patton"
