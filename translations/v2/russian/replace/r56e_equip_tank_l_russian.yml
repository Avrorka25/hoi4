 modern_tank_destroyer_equipment_x_3_short:1 "Совр. ИТ '51"
 modern_tank_destroyer_equipment_x_3_desc:0 "Эти машины используют усовершенствованные боеприпасы и отличаются превосходной скрытностью, компенсируя сравнительно невысокий урон исключительной бронепробиваемостью. Они созданы для уничтожения сверхтяжёлых танков."
 modern_tank_destroyer_equipment_x_4:1 "Современный истребитель танков '53"
 modern_tank_destroyer_equipment_x_4_short:1 "Совр. ИТ '53"
 modern_tank_destroyer_equipment_x_4_desc:0 "Эти машины используют усовершенствованные боеприпасы и отличаются превосходной скрытностью, компенсируя сравнительно невысокий урон исключительной бронепробиваемостью. Они созданы для уничтожения сверхтяжёлых танков."
 modern_tank_destroyer_equipment_x_5:1 "Современный истребитель танков '55"
 modern_tank_destroyer_equipment_x_5_short:1 "Совр. ИТ '55"
 modern_tank_destroyer_equipment_x_5_desc:0 "Эти машины используют усовершенствованные боеприпасы и отличаются превосходной скрытностью, компенсируя сравнительно невысокий урон исключительной бронепробиваемостью. Они созданы для уничтожения сверхтяжёлых танков."
 super_heavy_tank_equipment:0 "Сверхтяжелый танк"
 super_heavy_tank_equipment_desc:0 "Сверхтяжёлые танки развивают концепцию тяжёлых танков. Они крупнее, лучше вооружены и сильнее бронированы, но медленнее, испытывают серьёзные трудности на мягком грунте, а выдержать их массу способны лишь немногие мосты."
 super_heavy_tank_equipment_1:0 "Сверхтяжелый танк"
 super_heavy_tank_equipment_1_short:0 "Сверхтяж. танк '43"
 super_heavy_tank_equipment_1_desc:0 "Сверхтяжёлые танки развивают концепцию тяжёлых танков. Они крупнее, лучше вооружены и сильнее бронированы, но медленнее, испытывают серьёзные трудности на мягком грунте, а выдержать их массу способны лишь немногие мосты."
 super_heavy_tank_equipment_x:0 "Сверхтяжёлый танк 47"
 super_heavy_tank_equipment_x_short:0 "Сверхтяж. танк 47"
 super_heavy_tank_equipment_x_desc:0 "Эти танки — настоящие движущиеся чудовища с крупнокалиберными орудиями для разрушения укреплений и несколькими слоями усиленной брони. Но даже самые совершенные двигатели и сверхширокие двойные гусеницы не избавляют их от трудностей при преодолении болот и форсировании рек с помощью шноркеля."
 super_heavy_tank_equipment_x_2:0 "Сверхтяжёлый танк '51"
 super_heavy_tank_equipment_x_2_short:0 "Сверхтяж. танк '51"
 super_heavy_tank_equipment_x_2_desc:0 "Эти танки — настоящие движущиеся чудовища с крупнокалиберными орудиями для разрушения укреплений и несколькими слоями усиленной брони. Но даже самые совершенные двигатели и сверхширокие двойные гусеницы не избавляют их от трудностей при преодолении болот и форсировании рек с помощью шноркеля."
 super_heavy_tank_artillery_equipment:0 "Сверхтяж. САУ"
 super_heavy_tank_artillery_equipment_desc:0 "Массивные артиллерийские орудия, установленные на сверхтяжёлом шасси."
 super_heavy_tank_artillery_equipment_1:0 "Сверхтяжёлая САУ '43"
 super_heavy_tank_artillery_equipment_1_short:0 "Сверхтяж. САУ '43"
 super_heavy_tank_artillery_equipment_1_desc:0 "Массивные артиллерийские орудия, установленные на сверхтяжёлом шасси."
 super_heavy_tank_artillery_equipment_x:0 "Сверхтяжёлая САУ 47"
 super_heavy_tank_artillery_equipment_x_short:0 "Сверхтяж. САУ 47"
 super_heavy_tank_artillery_equipment_x_desc:0 "Следуя принципу «чем больше, тем лучше», эти артиллерийские установки способны остановить любого противника, но сталкиваются с проблемами снабжения боеприпасами, перезарядки и износа стволов."
 super_heavy_tank_artillery_equipment_x_2:0 "Сверхтяжёлая САУ '51"
 super_heavy_tank_artillery_equipment_x_2_short:0 "Сверхтяж. САУ '51"
 super_heavy_tank_artillery_equipment_x_2_desc:0 "Следуя принципу «чем больше, тем лучше», эти артиллерийские установки способны остановить любого противника, но сталкиваются с проблемами снабжения боеприпасами, перезарядки и износа стволов."
 super_heavy_tank_aa_equipment:0 "Сверхтяжелая ЗСУ"
 super_heavy_tank_aa_equipment_desc:0 "Сверхтяжёлое танковое шасси с зенитным вооружением."
 super_heavy_tank_aa_equipment_1:0 "Сверхтяжёлая ЗСУ '43"
 super_heavy_tank_aa_equipment_1_short:0 "Сверхтяж. ЗСУ '43"
 super_heavy_tank_aa_equipment_1_desc:0 "Сверхтяжёлое танковое шасси с зенитным вооружением."
 super_heavy_tank_aa_equipment_x:0 "Сверхтяжёлая ЗСУ 47"
 super_heavy_tank_aa_equipment_x_short:0 "Сверхтяж. ЗСУ 47"
 super_heavy_tank_aa_equipment_x_desc:0 "Необычная конструкция ракетной батареи, размещённой внутри бронированного корпуса, отлично проявляет себя в тылу поля боя, помогая контролировать воздушное пространство и выдерживая случайные попадания."
 super_heavy_tank_aa_equipment_x_2:0 "Сверхтяжёлая ЗСУ '51"
 super_heavy_tank_aa_equipment_x_2_short:0 "Сверхтяж. ЗСУ '51"
 super_heavy_tank_aa_equipment_x_2_desc:0 "Необычная конструкция ракетной батареи, размещённой внутри бронированного корпуса, отлично проявляет себя в тылу поля боя, помогая контролировать воздушное пространство и выдерживая случайные попадания."
 super_heavy_tank_destroyer_equipment:0 "Сверхтяжёлый истребитель танков"
 super_heavy_tank_destroyer_equipment_short:0 "Сверхтяж. ПТ-установка"
 super_heavy_tank_destroyer_equipment_desc:0 "Сверхтяжёлое танковое шасси с ещё более крупным орудием в неподвижной установке вместо башни."
 super_heavy_tank_destroyer_equipment_1:0 "Сверхтяжёлый истребитель танков '43"
 super_heavy_tank_destroyer_equipment_1_short:0 "Сверхтяж. ИТ '43"
 super_heavy_tank_destroyer_equipment_1_desc:0 "Сверхтяжёлое танковое шасси с ещё более крупным орудием в неподвижной установке вместо башни."
 super_heavy_tank_destroyer_equipment_x:0 "Сверхтяжёлый истребитель танков 47"
 super_heavy_tank_destroyer_equipment_x_short:0 "Сверхтяж. ИТ 47"
 super_heavy_tank_destroyer_equipment_x_desc:0 "Предельный ответ на любую бронетехнику: этим машинам не нужна скрытность. Их броня исключительно мощна, а орудия смертельно опасны, однако подвижность заметно страдает."
 super_heavy_tank_destroyer_equipment_x_2:0 "Сверхтяжёлый истребитель танков '51"
 super_heavy_tank_destroyer_equipment_x_2_short:0 "Сверхтяж. ИТ '51"
 super_heavy_tank_destroyer_equipment_x_2_desc:0 "Предельный ответ на любую бронетехнику: этим машинам не нужна скрытность. Их броня исключительно мощна, а орудия смертельно опасны, однако подвижность заметно страдает."
 plate_skirt:0 "Бортовые бронеэкраны"
 plate_skirt_desc:0 "Установка бортовых бронеэкранов на наши танки и полугусеничные машины повысит защиту от новых пехотных противотанковых средств ценой увеличения массы техники."
 bed_spring_skirt:0 "Решётчатые бронеэкраны"
 bed_spring_skirt_desc:0 "Мы улучшим защиту, заменив металлические листы сетчатой бронёй и тем самым избавившись от лишней массы предыдущей модернизации."
 plate_skirt_desc:0 "Установка бортовых бронеэкранов на наши танки и полугусеничные машины повысит защиту от новых пехотных противотанковых средств ценой увеличения массы техники."
