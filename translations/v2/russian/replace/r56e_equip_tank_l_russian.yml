 GER_gw_tank_equipment:0 "Leichttraktor"
 GER_gw_tank_equipment_desc:0 "«Leichttraktor» («легкий трактор») был экспериментальной немецкой разработкой. После Первой мировой войны Версальский договор ограничивал военное развитие Германии, поэтому разработка бронетехники и артиллерии шла в секрете."
 GER_gw_tank_equipment_short:0 "Leichttraktor"
 GER_heavy_tank_artillery_equipment_2:0 "«Штурмтигр»"
 GER_heavy_tank_artillery_equipment_2_short:0 "«Штурмтигр»"
 GER_heavy_tank_artillery_equipment_3:0 "Geschützwagen Tiger"
 GER_heavy_tank_artillery_equipment_3_desc:0 "Разработанная на шасси «Королевского тигра» САУ, вооруженная пушкой K.72 L/50 калибром 170 мм."
 GER_heavy_tank_artillery_equipment_3_short:0 "GW Tiger"
 GER_heavy_tank_destroyer_equipment_1:0 "Selbstfahrlafette auf VK3001(H) Sturer Emil"
 GER_heavy_tank_destroyer_equipment_1_desc:0 "Selbstfahrlafette auf VK3001 (H) «Штурер Эмиль» («Упрямый Эмиль») — немецкое самоходное противотанковое орудие на основе шасси проекта VK3001 фирмы «Хеншель»."
 GER_heavy_tank_destroyer_equipment_1_short:0 "«Штурер Эмиль»"
 GER_heavy_tank_destroyer_equipment_2:0 "Panzerjäger «Тигр (P)»"
 GER_heavy_tank_destroyer_equipment_2_desc:0 "«Элефант» («Слон») — тяжелый истребитель танков, построенный на шасси отклоненного проекта «Тигр» от «Порше» и вооруженный пушкой PaK 43/2 калибра 88 мм."
 GER_heavy_tank_destroyer_equipment_2_short:0 "«Элефант»"
 GER_heavy_tank_destroyer_equipment_3:0 "Panzerjäger Tiger Ausf. B"
 GER_heavy_tank_destroyer_equipment_3_desc:0 "«Ягдтигр» стал самым тяжелым танком, применявшимся на полях Второй мировой войны. Он был вооружен 128-мм пушкой PaK 44 L/55 и защищен толстейшей лобовой броней."
 GER_heavy_tank_destroyer_equipment_3_short:0 "«Ягдтигр»"
 GER_heavy_tank_equipment_1:0 "Grosstraktor"
 GER_heavy_tank_equipment_1_desc:0 "«Grosstraktor» («большой трактор») — серия прототипов тяжелого танка, разработанная Германией. После Первой мировой войны Версальский договор ограничивал военное развитие Германии, поэтому разработка бронетехники и артиллерии шла в секрете."
 GER_heavy_tank_equipment_1_short:0 "Grosstraktor"
 GER_heavy_tank_equipment_2:0 "Panzerkampfwagen VI «Тигр»"
 GER_heavy_tank_equipment_2_desc:0 "«Тигр I» — немецкий тяжелый танк, разработанный в 1942 году для борьбы с неожиданно мощной советской бронетехникой, с которой вермахт столкнулся в первые месяцы вторжения в Советский Союз — особенно с танками Т-34 и КВ-1."
 GER_heavy_tank_equipment_2_short:0 "«Тигр»"
 GER_heavy_tank_equipment_3:0 "Panzerkampfwagen IV Ausf. B"
 GER_heavy_tank_equipment_3_desc:0 "Этот известный под неофициальным названием «Королевский тигр» танк стал развитием идей, заложенных в первый «Тигр», являясь при этом еще более огромным. «Тигр II» объединил толстую броню «Тигра» с наклонной схемой, использованной на среднем танке «Пантера». Танк весил почти 70 тонн, был защищен 100-180 мм брони спереди и вооружен длинноствольным орудием KwK 43 L/71 калибра 88 мм."
 GER_heavy_tank_equipment_3_short:0 "«Королевский тигр»"
 GER_light_tank_aa_equipment_1:0 "Flakpanzer I"
 GER_light_tank_aa_equipment_1_desc:0 "Зенитная пушка, установленная на шасси танка Pz I."
 GER_light_tank_aa_equipment_1_short:0 "FlakPz I"
 GER_light_tank_aa_equipment_2:0 "Flakpanzer Luchs"
 GER_light_tank_aa_equipment_2_desc:0 "Зенитная пушка, установленная на шасси танка Pz. II."
 GER_light_tank_aa_equipment_2_short:0 "FlakPz Luchs"
 GER_light_tank_aa_equipment_3:0 "Флакпанцер 2801"
 GER_light_tank_aa_equipment_3_short:0 "FlakPz 1602"
 GER_light_tank_aa_equipment_3_desc:0 "Зенитная пушка, установленная на шасси танка VK1602."
 GER_light_tank_artillery_equipment_1:0 "Sturmpanzer I «Бизон»"
 GER_light_tank_artillery_equipment_1_desc:0 "Буксируемые орудия, которыми оснащались артиллерийские роты полков моторизированной пехоты, часто не успевали за танками во время боя. Самым простым решением проблемы стала установка орудия на шасси танка. В случае с САУ «Бизон» использовалось шасси Pz. I."
 GER_light_tank_artillery_equipment_1_short:0 "«Бизон»"
 GER_light_tank_artillery_equipment_2:0 "Sd. Kfz. 124 «Веспе»"
 GER_light_tank_artillery_equipment_2_desc:0 "Sd.Kfz. 124 «Веспе» (по-немецки «оса») — немецкая самоходная артиллерийская установка на модифицированном шасси Panzer II."
 GER_light_tank_artillery_equipment_2_short:0 "«Веспе»"
 GER_light_tank_artillery_equipment_3:0 "Waffentrager Леопард"
 GER_light_tank_artillery_equipment_3_desc:0 "«Ваффентрагер Леопард» — проект самоходной артиллерийской установки на шасси разрабатывавшегося танка VK1602 «Леопард»."
 GER_light_tank_artillery_equipment_3_short:0 "WT Leopard"
 GER_light_tank_destroyer_equipment_1:0 "Panzerjager I"
 GER_light_tank_destroyer_equipment_1_desc:0 "«Мардер II» — немецкий истребитель танков на шасси Panzer II."
 GER_light_tank_destroyer_equipment_1_short:0 "Pzjager I"
 GER_light_tank_destroyer_equipment_2:0 "Мардер III"
 GER_light_tank_destroyer_equipment_2_short:0 "«Мардер II»"
 GER_light_tank_destroyer_equipment_3:0 "Sturmgeschuetz auf Leopard"
 GER_light_tank_destroyer_equipment_3_desc:0 "«Ягдлеопард» — возможная модификация проектировавшегося лёгкого танка VK1602 «Леопард»."
 GER_light_tank_destroyer_equipment_3_short:0 "JagdLeopard"
 GER_light_tank_equipment_1:0 "Panzerkampfwagen I"
 GER_light_tank_equipment_1_desc:0 "Panzerkampfwagen I — лёгкий танк, производившийся в Германии в 30-х годах. Разработка была начата в 1932-м, а массовое производство запущено в 1934-м. Изначально разрабатывался как учебный танк для знакомства армии с бронетехникой, но из-за отсутствия более современных танков активно использовался в боевых действиях."
 GER_light_tank_equipment_1_short:0 "Panzer I"
 GER_light_tank_equipment_2:0 "Panzerkampfwagen II"
 GER_light_tank_equipment_2_desc:0 "Pz.Kpfw. II создавался в качестве временной меры, пока велась разработка более современных образцов, однако принял активное участие в боевых действиях из-за нехватки достаточного количества более мощных танков."
 GER_light_tank_equipment_2_short:0 "Pz.Kpfw. II"
 GER_light_tank_equipment_3:0 "VK1602 «Леопард»"
 GER_light_tank_equipment_3_desc:0 "VK1602 «Леопард» — проект немецкой разведывательной машины, разработанный в 1942 году. Первоначально её предполагалось вооружить 75-мм пушкой Kwk 41, но затем выбрали менее крупное 50-мм орудие. Под влиянием конструкции среднего танка «Пантера» VK1602 получил наклонную лобовую броню. Машина оснащалась гусеницами шириной 350 мм."
 GER_light_tank_equipment_3_short:0 "«Леопард»"
 GER_medium_tank_aa_equipment_1:0 "Флакпанцер 38(t)"
 GER_medium_tank_aa_equipment_1_short:0 "«Мёбельваген»"
 GER_medium_tank_aa_equipment_1_desc:0 "«Флакпанцер 38(t)» на шасси PzKpfw 38(t) был вооружён 20-мм пушкой Flak 30 или Flak 38 L/112.5 с боекомплектом в 1040 выстрелов. Броневая защита была слабой. С ноября 1943 по февраль 1944 года выпустили всего 141 такую машину."
 GER_medium_tank_aa_equipment_2:0 "Flakpanzer IV «Оствинд»"
 GER_medium_tank_aa_equipment_2_desc:0 "«Флакпанцер IV Оствинд» (по-немецки «восточный ветер») — зенитная самоходная установка на базе танка Panzer IV. Её разработали в 1944 году в качестве преемницы более раннего «Флакпанцера IV». Башню Panzer IV заменили открытой сверху шестигранной башней с 3,7-см пушкой FlaK 43. Закрытая башня была бы предпочтительнее, но её применение оказалось невозможным из-за сильного задымления при стрельбе."
 GER_medium_tank_aa_equipment_2_short:0 "«Оствинд»"
 GER_medium_tank_aa_equipment_3:0 "Флакпанцер Coelian"
 GER_medium_tank_aa_equipment_3_short:0 "«Коэлиан»"
 GER_medium_tank_aa_equipment_3_desc:0 "«Флакпанцер Кёлиан» — проект зенитной самоходной установки, разработанный компанией Rheinmetall для немецких вооружённых сил во время Второй мировой войны. На шасси среднего танка «Пантера» предполагалось установить полностью закрытую вращающуюся башню с двумя 3,7-см пушками FlaK 43, но до окончания войны в Европе машину так и не построили."
 GER_medium_tank_artillery_equipment_1:0 "«Грилле»"
 GER_medium_tank_artillery_equipment_1_desc:0 "Sd.Kfz. 138/1 «Грилле» (по-немецки «сверчок») — самоходная артиллерийская установка, применявшаяся Германией во Второй мировой войне. Было выпущено около 490–500 машин. Они состояли на вооружении танковых дивизий, действовавших в Советском Союзе, а также частей в Польше и Франции. Эти установки использовались до 1945 года и также служили в Тунисе, где сражались с вражеской артиллерией и танками."
 GER_medium_tank_artillery_equipment_1_short:0 "«Грилле»"
 GER_medium_tank_artillery_equipment_2:0 "«Хуммель»"
 GER_medium_tank_artillery_equipment_2_desc:0 "«Хуммель» (по-немецки «шмель») — самоходная артиллерийская установка на шасси Geschützwagen III/IV, вооружённая 15-см гаубицей. Вермахт применял её во Второй мировой войне с начала 1943 года до окончания боевых действий."
 GER_medium_tank_artillery_equipment_2_short:0 "«Хуммель»"
 GER_medium_tank_artillery_equipment_3:0 "Грилле 12"
 GER_medium_tank_artillery_equipment_3_short:0 "Грилле 12"
 GER_medium_tank_artillery_equipment_3_desc:0 "В 1944 году компания Krupp предложила проект самоходной артиллерийской установки с 12,8-см гаубицей на основе узлов танка «Пантера». Исторически он так и не вышел за стадию концепции."
 GER_medium_tank_destroyer_equipment_1:0 "Sturmgeschütz III"
 GER_medium_tank_destroyer_equipment_1_desc:0 "Штурмовое орудие «Штурмгешюц III» стало самой массовой немецкой бронированной боевой машиной Второй мировой войны. Его строили на шасси проверенного танка Panzer III. Первоначально StuG задумывался как подвижное лёгкое орудие с броневой защитой для поддержки пехоты, но постоянно совершенствовался и широко применялся в качестве истребителя танков."
 GER_medium_tank_destroyer_equipment_1_short:0 "StuG III"
 GER_medium_tank_destroyer_equipment_2:0 "Jagdpanzer IV"
 GER_medium_tank_destroyer_equipment_2_desc:0 "«Ягдпанцер IV» состоял на вооружении противотанковых подразделений танковых дивизий вермахта и СС. Эти машины сражались в Нормандии, Арденнах и на Восточном фронте. Они были весьма успешными истребителями танков, но, как и большинство машин этого класса, плохо справлялись с задачами танков или штурмовых орудий. Тем не менее на поздних этапах войны их всё чаще использовали вместо танков, поскольку другой техники зачастую не было."
 GER_medium_tank_destroyer_equipment_2_short:0 "JagdPz IV"
 GER_medium_tank_destroyer_equipment_3:0 "«Ягдпантера»"
 GER_medium_tank_destroyer_equipment_3_desc:0 "«Ягдпантера» (по-немецки «охотящаяся пантера») — истребитель танков, созданный нацистской Германией во Второй мировой войне на шасси танка «Пантера». Он поступил на вооружение лишь в 1944 году и применялся на Восточном и Западном фронтах. «Ягдпантера» сочетала очень мощную 8,8-см пушку PaK 43 танка «Тигр II» с превосходной бронёй и подвеской шасси «Пантеры». Однако тяжёлое положение Германии в конце войны ограничивало производство, вызывало нехватку запасных частей и сказывалось на подготовке экипажей."
 GER_medium_tank_destroyer_equipment_3_short:0 "«Ягдпантера»"
 GER_medium_tank_equipment_1:0 "Panzerkampfwagen III"
 GER_medium_tank_equipment_1_desc:0 "Ещё в 1934–1935 годах генерал Гейнц Гудериан задумал два основных типа машин, которые должны были стать наиболее массовыми в будущих немецких танковых дивизиях. Первую машину предполагалось вооружить противотанковой пушкой и двумя пулемётами, а вторую сделать машиной поддержки с орудием более крупного калибра. Первая впоследствии получила название Panzerkampfwagen III и должна была стать стандартным танком трёх лёгких рот танкового батальона. Вторая стала известна как Panzerkampfwagen IV."
 GER_medium_tank_equipment_1_short:0 "Pz.Kpfw. III"
 GER_medium_tank_equipment_2:0 "Panzerkampfwagen IV"
 GER_medium_tank_equipment_2_desc:0 "Pz IV, разработанный как танк поддержки пехоты, не должен был встречаться с вражескими танками — эту функцию выполнял более легкий Panzer III. Однако изъяны изначальной довоенной доктрины становились все более очевидны. Появление танков T-34 заставило Pz IV взять на себя роль борца с танками, которые оказались не по зубам его стремительно устаревающему собрату. Pz IV стал наиболее массово производимым и применяемым немецким танком Второй мировой войны, а его конструкция легла в основу многих других боевых машин."
 GER_medium_tank_equipment_2_short:0 "Pz.Kpfw. IV"
 GER_medium_tank_equipment_3:0 "Panzerkampfwagen V «Пантера»"
 GER_medium_tank_equipment_3_desc:0 "«Пантера» — распространённое название среднего танка, применявшегося Германией во Второй мировой войне с середины 1943 года до окончания войны в Европе в 1945 году. Он создавался для противодействия советскому Т-34 и замены Panzer III и Panzer IV. Полностью вытеснить эти машины ему не удалось: «Пантера» служила вместе с ними и более тяжёлыми «Тиграми» до конца войны. Превосходное сочетание огневой мощи, подвижности и защиты стало ориентиром для поздних военных и послевоенных танков других стран. «Пантеру» считают одним из лучших танков Второй мировой войны."
 GER_medium_tank_equipment_3_short:0 "«Пантера»"
 GER_modern_tank_aa_equipment_1:0 "Флакпанцер E-50"
 GER_modern_tank_aa_equipment_1_short:0 "Kugelblitz"
 GER_modern_tank_aa_equipment_1_desc:0 "«Флакпанцер E-50» — гипотетическая зенитная самоходная установка со спаренными 5,5-см зенитными пушками во вращающейся на полный круг башне на корпусе E-50. Предполагались экипаж из четырёх человек и боекомплект в 104 выстрела."
 GER_modern_tank_destroyer_equipment_1:0 "E-25 «Штандартпанцер»"
 GER_modern_tank_destroyer_equipment_1_desc:0 "E-25, модернизированная версия Jagdpanzer IV, сочетает в себе маневренность и улучшенную броню."
 GER_modern_tank_destroyer_equipment_1_short:0 "E-25"
 GER_modern_tank_equipment_1:0 "E-50 «Штандартпанцер»"
 GER_modern_tank_equipment_1_desc:0 "Серия Entwicklung была попыткой Германии в конце войны создать унифицированное семейство танков. Планировались стандартные конструкции в шести весовых категориях. E-50 Standardpanzer должен был заменить танки серий «Пантера» и «Тигр», а также машины на их базе."
 GER_modern_tank_equipment_1_short:0 "E-50"
 GER_super_heavy_tank_aa_equipment_1:0 "Flakpanzer VIII Maus"
 GER_super_heavy_tank_aa_equipment_1_desc:0 "Шасси танка «Маус» со спаренными 88-мм зенитными пушками."
 GER_super_heavy_tank_aa_equipment_1_short:0 "FlakMaus"
 GER_super_heavy_tank_artillery_equipment_1:0 "Geschützwagen E-100"
 GER_super_heavy_tank_artillery_equipment_1_desc:0 "Самоходное 210-мм артиллерийское орудие, установленное на шасси сверхтяжелого танка и не уступавшее ряду пушек на железнодорожных платформах."
 GER_super_heavy_tank_artillery_equipment_1_short:0 "GW E-100"
 GER_super_heavy_tank_destroyer_equipment_1:0 "Sturmgeschütz auf Fahrgestell Maus"
 GER_super_heavy_tank_destroyer_equipment_1_desc:0 "Шасси танка «Маус» со 150-мм пушкой в неподвижной рубке."
 GER_super_heavy_tank_destroyer_equipment_1_short:0 "«Ягдмаус»"
 GER_super_heavy_tank_equipment_1:0 "Panzerkampfwagen VIII «Маус»"
 GER_super_heavy_tank_equipment_1_desc:0 "Panzerkampfwagen VIII «Маус» (по-немецки «мышь») — немецкий сверхтяжёлый танк времён Второй мировой войны, постройку которого завершили в конце 1944 года. Это самая тяжёлая из когда-либо построенных боевых машин с полностью закрытым броневым корпусом. Основным вооружением «Мауса» была 128-мм пушка KwK 44 L/55, дополненная спаренным 75-мм орудием."
 GER_super_heavy_tank_equipment_1_short:0 "«Маус»"
