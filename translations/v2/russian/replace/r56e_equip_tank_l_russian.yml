 modern_tank_equipment_x_2_desc:0 "Разработка универсальных кумулятивных противотанковых боеприпасов сделала обычную стальную броню устаревшей. В ответ улучшенные мобильность, скрытность и системы наведения позволяют при грамотном применении танков лишить противника даже возможности открыть ответный огонь."
