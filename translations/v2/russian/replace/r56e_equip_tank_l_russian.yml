 modern_tank_equipment_x_short:1 "Совр. танк 47"
 modern_tank_equipment_x_desc:0 "Улучшенные высокоскоростные бронебойные снаряды и броня с большими углами наклона позволяют этим танкам наносить и выдерживать значительно больший урон, чем их предшественникам."
