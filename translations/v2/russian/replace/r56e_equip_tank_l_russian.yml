l_russian:
 advanced_main_battle_tank_chassis:0 "Современный танк 1950 года"
 advanced_modern_tank_chassis_desc:0 "Новая эпоха развития бронетехники позволяет, в отличие от прежних конструкций средних танков, сочетать высокую скорость и манёвренность с мощной бронёй и серьёзным вооружением. В результате получается надёжная машина, способная стать универсальной конструкцией и выполнять задачи на любых участках поля боя."
 modern_tank_chassis_2:0 "Шасси усовершенствованного современного танка"
 modern_tank_equipment_2:0 "Усовершенствованный современный танк"
 tank_designer_advanced_modern_tank_chassis:0 "Современный танк"
 engine_tech_5:0 "Усовершенствованный современный двигатель"
 engine_tech_5_desc:0 "Значительное усиление брони и вооружения требует разработки мощных двигателей, способных выдерживать возросшую массу и нагрузку на подвеску этих машин, одновременно сохраняя их скорость и манёвренность."
 engine_tech_5_tt:0 "Позволяет повышать уровень модернизации двигателя до 20 и выше."
 armor_tech_5:0 "Передовая современная защита брони "
 armor_tech_5_desc:0 "По мере роста мощности танкового вооружения и противотанковых средств броневая защита машин должна всё эффективнее защищать корпус и экипаж."
 armor_tech_5_tt:0 "Позволяет повышать уровень модернизации брони до 20 и выше."
 amphibious_tank_equipment:0 "Плавающие танки"
 amphibious_tank_equipment_short:0 "Плавающие танки"
 amphibious_tank_equipment_1:0 "Плавающий танк 40"
 amphibious_tank_equipment_2:0 "Плавающий танк 42"
 amphibious_tank_equipment_desc:0 "Танки, модифицированные для передвижения по воде. Они значительно лучше обычных танков подходят для морских десантов и форсирования рек, но расходуют больше топлива."
 amphibious_tank_equipment_1_desc:0 "По сути, это лёгкий танк, приспособленный к плаванию. Такая машина обеспечивает огневую поддержку подразделениям, закрепляющимся на плацдарме."
 amphibious_tank_equipment_2_desc:0 "Средний танк, приспособленный для движения по воде. Дополнительная универсальность и мобильность достигаются ценой повышенного расхода топлива."
 amphibious_tank_equipment_3:0 "Плавающий танк 44"
 amphibious_tank_equipment_4:0 "Плавающий танк 48"
 amphibious_tank_equipment_3_desc:0 "Улучшенный средний танк способен плавать благодаря вспомогательной силовой установке и гребным винтам."
 amphibious_tank_equipment_4_desc:0 "Современный танк, приспособленный к плаванию."
 r56_tank_front_plate_fixed_superstructure_turret:0 "Орудийный щит"
 r56_tank_front_plate_fixed_superstructure_turret_desc:0 "На выбранное основное вооружение устанавливается металлический броневой щит, защищающий расчёт от огня стрелкового оружия спереди. При этом борта остаются значительно хуже защищены, чем у полноценной неподвижной надстройки. Такое решение позволяет устанавливать на лёгкое шасси более крупное орудие, чем обычно возможно. Кроме того, производство щита обходится почти бесплатно по сравнению с другими вариантами."
 r56_tank_platform_mount_turret:0 "Орудийная платформа"
 r56_tank_platform_mount_turret_desc:0 "На шасси устанавливается платформа для полевого орудия. Во время стрельбы расчёт открыт для огня стрелкового оружия, из-за чего машина почти непригодна для традиционной роли танка. Зато на марше экипаж защищён лучше, чем у других моторизованных полевых орудий. Снижение потребности в бронелистах удешевляет производство и немного повышает скорость. Кроме того, на шасси можно установить более крупную пушку, чем обычно. Правда, внешне такая машина напоминает металлическую платформу с деревянными деталями на огромном тракторе."
 r56_tank_light_tankette_superstructure_turret:0 "Надстройка танкетки"
 r56_tank_light_tankette_superstructure_turret_desc:0 "Объединив лобовое бронирование танка с его надстройкой так, чтобы башня и экипаж располагались ниже на шасси, можно сделать машину быстрее и менее заметной. Однако по своим характеристикам такая конструкция несколько уступает более современным способам установки башни."
 r56_tank_anti_tank_rifle_gun:0 "Противотанковое ружьё"
 r56_tank_anti_tank_rifle_gun_desc:0 "Созданное на основе пехотных противотанковых ружей, это оружие представляет собой более крупнокалиберную самозарядную полуавтоматическую версию пехотного аналога. Оно обладает достаточной пробивной способностью против небронированных целей, однако даже умеренная бронезащита способна остановить его пулю, что серьёзно ограничивает противотанковую эффективность."
 r56_tank_light_oscillating_turret:0 "Качающаяся башня"
 r56_tank_light_oscillating_turret_desc:0 "Качающаяся башня заменяет подъём и опускание орудия внутри башни движением всей верхней части башни. Благодаря этому орудие занимает меньше места и может быть установлено выше, что, в свою очередь, позволяет разместить более мощное вооружение."
 oscillating_turret_unlock_tt:0 "§YКачающаяся башня§! позволяет лёгким танкам нести среднее вооружение без столь значительной потери брони, как при использовании надстроек и частично бронированных башен."
 r56_tank_anti_tank_rifle_gun_2:0 "Улучшенное противотанковое ружьё"
 r56_tank_anti_tank_rifle_gun_2_desc:0 "Улучшения боеприпасов и нарезки стволов повысили бронепробиваемость наших противотанковых ружей. Однако против техники с серьёзной бронезащитой они практически бесполезны. Тем не менее межвоенные модели танков теперь можно поражать заметно легче, чем оружием предыдущего поколения."
 r56_tank_heavy_cannon_4:0 "Современная тяжёлая пушка"
 r56_tank_heavy_cannon_4_desc:0 "Орудие, способное стрелять крупными снарядами. Оно обладает исключительной бронепробиваемостью и неплохой эффективностью против небронированных целей, но его главные недостатки — огромные размеры и стоимость, из-за которых оно слишком громоздко для большинства машин, не спроектированных специально под него."
 r56_tank_high_velocity_cannon_4:0 "Современная высокоскоростная пушка"
 r56_tank_high_velocity_cannon_4_desc:0 "Пушка, специально разработанная для достижения высокой начальной скорости снаряда. При использовании специализированных боеприпасов она обладает превосходными противотанковыми характеристиками, однако хуже действует по небронированным целям."
 r56_tank_medium_cannon_3:0 "Усовершенствованная средняя пушка"
 r56_tank_medium_cannon_3_desc:0 "Универсальное орудие, хорошо подходящее для широкого круга задач. Оно не превосходит специализированные системы ни в борьбе с пехотой, ни в противотанковой роли, зато придаёт машине большую универсальность."
 r56_tank_medium_cannon_4:0 "Современная средняя пушка"
 r56_tank_medium_cannon_4_desc:0 "Универсальное орудие, хорошо подходящее для широкого круга задач. Оно не превосходит специализированные системы ни в борьбе с пехотой, ни в противотанковой роли, зато придаёт машине большую универсальность."
 r56_tank_supercharger:0 "Нагнетатель"
 r56_tank_supercharger_desc:0 "Воздушный компрессор, обогащающий топливную смесь внутри камеры сгорания, повышающий мощность двигателя."
 r56_tank_hull_lmg:0 "Ручной пулемёт в корпусе"
 r56_tank_hull_lmg_desc:0 "Легкий пулемет, установленный внутри корпуса танка, позволяет экипажу атаковать вражескую пехоту из сафтея интерьера танка."
 r56_tank_optical_rangefinder:0 "Оптический дальномер"
 r56_tank_optical_rangefinder_desc:0 "По сути, большой набор биноклей с его апертурами, расположенными по бокам башни танка, что позволяет членам экипажа оценивать дальность полета противника с приличной точностью."
 r56_tank_advanced_rangefinder:0 "Продвинутый оптический дальномер"
 r56_tank_advanced_rangefinder_desc:0 "Улучшенные призмы, линзы и механические компоненты повышают точность измеренного диапазона."
 r56_tank_improved_optics:0 "Улучшенная оптика"
 r56_tank_improved_optics_desc:0 "Высокая оптика увеличения для наводчика и командира улучшает точность стрельбы и легкость разведывательных миссий."
 r56_tank_electro_mechanical_fire_control:0 "Электромеханическая система управления огнём"
 r56_tank_electro_mechanical_fire_control_desc:0 "Механический калькулятор, если он снабжен точным диапазоном и данными о ветре, обеспечит точное решение для стрельбы по любой цели."
 r56_tank_coaxial_support_cannon:0 "Спаренная вспомогательная пушка"
 r56_tank_coaxial_support_cannon_desc:0 "Гаубица, установленная рядом с основной пушкой танков."
 EQ_MOD_CAT_r56_tank_coaxial_support_cannon_category_TITLE:0 "Спаренная вспомогательная пушка"
 EQ_MOD_CAT_r56_tank_rangefinder_category_TITLE:0 "Дальномеры"
 gw_tank_equipment:0 "Лёгкий танк '30"
 gw_tank_equipment_short:0 "Л. танк '30"
 gw_tank_equipment_desc:0 "Во время Великой войны танки независимо и одновременно разрабатывались Великобританией и Францией, чтобы преодолеть тупик позиционной войны на Западном фронте. Британцы на раннем этапе разработки использовали название «танк» как меру секретности, скрывая истинное назначение машин. Первые танки вооружались пулемётами и малокалиберными пушками, двигались медленно и имели броню, достаточную лишь для защиты от стрелкового оружия."
 light_tank_equipment:0 "Легкий танк"
 light_tank_equipment_desc:0 "Лёгкие танки — небольшие и манёвренные машины, способные вести разведку и бороться со слабо бронированным противником."
 light_tank_equipment_1:0 "Лёгкий танк '34"
 light_tank_equipment_1_short:0 "Л. танк '34"
 light_tank_equipment_1_desc:0 "Лёгкие танки — небольшие и манёвренные машины, способные вести разведку и бороться со слабо бронированным противником."
 light_tank_equipment_2:0 "Лёгкий танк '36"
