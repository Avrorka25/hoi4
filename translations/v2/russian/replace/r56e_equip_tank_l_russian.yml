 modern_tank_aa_equipment_x_5_desc:0 "Крупнокалиберные автоматические пушки, наводимые с помощью недавно разработанных мобильных радиолокационных систем, превращают эти переоборудованные устаревшие средние танки в настоящие зенитные крепости."
 modern_tank_destroyer_equipment:0 "Современная ПТ-установка"
 modern_tank_destroyer_equipment_desc:0 "Современные истребители танков развивают идеи более ранних лёгких и средних машин, отдавая предпочтение мобильности и скрытности вместо тяжёлой брони."
 modern_tank_destroyer_equipment_1:0 "Современный истребитель танков '45"
 modern_tank_destroyer_equipment_1_short:0 "Совр. ИТ '45"
 modern_tank_destroyer_equipment_1_desc:0 "Современные истребители танков развивают идеи более ранних лёгких и средних машин, отдавая предпочтение мобильности и скрытности вместо тяжёлой брони."
 modern_tank_destroyer_equipment_x:0 "Современный истребитель танков 47"
 modern_tank_destroyer_equipment_x_short:0 "Совр. ИТ 47"
 modern_tank_destroyer_equipment_x_desc:0 "Эти машины используют усовершенствованные боеприпасы и отличаются превосходной скрытностью, компенсируя сравнительно невысокий урон исключительной бронепробиваемостью. Они созданы для уничтожения сверхтяжёлых танков."
 modern_tank_destroyer_equipment_x_2:0 "Современный истребитель танков '49"
 modern_tank_destroyer_equipment_x_2_short:0 "Совр. ИТ '49"
 modern_tank_destroyer_equipment_x_2_desc:0 "Эти машины используют усовершенствованные боеприпасы и отличаются превосходной скрытностью, компенсируя сравнительно невысокий урон исключительной бронепробиваемостью. Они созданы для уничтожения сверхтяжёлых танков."
