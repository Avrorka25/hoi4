 light_tank_artillery_equipment_3_desc:0 "Небольшое артиллерийское орудие на лёгком шасси. Лёгкая САУ уступает более тяжёлым аналогам по огневой мощи, но превосходит их в мобильности."
 light_tank_artillery_equipment_x:0 "Лёгкая САУ '45"
 light_tank_artillery_equipment_x_short:0 "Л. САУ '45"
 light_tank_artillery_equipment_x_desc:0 "Следуя принципу «чем больше, тем лучше», эти артиллерийские установки способны остановить любого противника, но сталкиваются с проблемами снабжения боеприпасами, перезарядки и износа стволов."
 light_tank_artillery_equipment_x_2:0 "Лёгкая САУ '49"
 light_tank_artillery_equipment_x_2_short:0 "Л. САУ '49"
 light_tank_artillery_equipment_x_2_desc:0 "Следуя принципу «чем больше, тем лучше», эти артиллерийские установки способны остановить любого противника, но сталкиваются с проблемами снабжения боеприпасами, перезарядки и износа стволов."
 light_tank_aa_equipment:0 "Легкая ЗСУ"
 light_tank_aa_equipment_desc:0 "Зенитная артиллерия прежде всего предназначена для уничтожения вражеских самолётов, хотя скорострельные пушки также эффективны против наземных целей. Эта модель установлена на шасси лёгкого танка."
 light_tank_aa_equipment_1:0 "Лёгкая ЗСУ '34"
 light_tank_aa_equipment_1_short:0 "Л. ЗСУ '34"
 light_tank_aa_equipment_1_desc:0 "Зенитная артиллерия прежде всего предназначена для уничтожения вражеских самолётов, хотя скорострельные пушки также эффективны против наземных целей. Эта модель установлена на шасси лёгкого танка."
 light_tank_aa_equipment_2:0 "Лёгкая ЗСУ '36"
 light_tank_aa_equipment_2_short:0 "Л. ЗСУ '36"
 light_tank_aa_equipment_2_desc:0 "Зенитная артиллерия прежде всего предназначена для уничтожения вражеских самолётов, хотя скорострельные пушки также эффективны против наземных целей. Эта модель установлена на шасси лёгкого танка."
 light_tank_aa_equipment_3:0 "Лёгкая ЗСУ '41"
 light_tank_aa_equipment_3_short:0 "Л. ЗСУ '41"
 light_tank_aa_equipment_3_desc:0 "Зенитная артиллерия прежде всего предназначена для уничтожения вражеских самолётов, хотя скорострельные пушки также эффективны против наземных целей. Эта модель установлена на шасси лёгкого танка."
 light_tank_aa_equipment_x:0 "Лёгкая ЗСУ '45"
 light_tank_aa_equipment_x_short:0 "Л. ЗСУ '45"
 light_tank_aa_equipment_x_desc:0 "Необычная конструкция ракетной батареи, размещённой внутри бронированного корпуса, отлично проявляет себя в тылу поля боя, помогая контролировать воздушное пространство и выдерживая случайные попадания."
 light_tank_aa_equipment_x_2:0 "Лёгкая ЗСУ '49"
 light_tank_aa_equipment_x_2_short:0 "Л. ЗСУ '49"
 light_tank_aa_equipment_x_2_desc:0 "Необычная конструкция ракетной батареи, размещённой внутри бронированного корпуса, отлично проявляет себя в тылу поля боя, помогая контролировать воздушное пространство и выдерживая случайные попадания."
 light_tank_destroyer_equipment:0 "Легкая ПТ-установка"
 light_tank_destroyer_equipment_short:0 "Легкая ПТ"
 light_tank_destroyer_equipment_desc:0 "Истребители танков — это машины с орудием большего, чем обычно, калибра, установленным неподвижно вместо башни. Лёгкие истребители танков создаются на шасси лёгких танков, поэтому достаточно мобильны, но несут менее мощные орудия, чем тяжёлые аналоги."
 light_tank_destroyer_equipment_1:0 "Лёгкий истребитель танков '34"
 light_tank_destroyer_equipment_1_short:0 "Л. ИТ '34"
 light_tank_destroyer_equipment_1_desc:0 "Истребители танков — это машины с орудием большего, чем обычно, калибра, установленным неподвижно вместо башни. Лёгкие истребители танков создаются на шасси лёгких танков, поэтому достаточно мобильны, но несут менее мощные орудия, чем тяжёлые аналоги."
 light_tank_destroyer_equipment_2:0 "Лёгкий истребитель танков '36"
 light_tank_destroyer_equipment_2_short:0 "Л. ИТ '36"
 light_tank_destroyer_equipment_2_desc:0 "Истребители танков — это машины с орудием большего, чем обычно, калибра, установленным неподвижно вместо башни. Лёгкие истребители танков создаются на шасси лёгких танков, поэтому достаточно мобильны, но несут менее мощные орудия, чем тяжёлые аналоги."
