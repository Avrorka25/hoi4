 USA_amphibious_tank_equipment_1:0 "LVT-1(A)"
 USA_amphibious_tank_equipment_1_desc:0 "Опыт десантных операций на Тихом океане показал, что армии необходима более мощная огневая поддержка при высадке. Эти машины с 37-мм пушкой M6 в башне на основе лёгкого танка M3 и двумя кормовыми пулемётами хорошо подходили для поддержки морской пехоты на первых этапах создания плацдарма."
 USA_amphibious_tank_equipment_2:0 "Шерман DD"
 USA_amphibious_tank_equipment_2_desc:0 "Эти модифицированные «Шерманы» получили прозвище «танки Дональд Дак». Поднимаемый вокруг корпуса водоизмещающий экран позволял машине держаться на плаву, а два гребных винта с приводом от танкового двигателя обеспечивали движение по воде."
 USA_gw_tank_equipment:0 "M1917"
 USA_gw_tank_equipment_desc:0 "После Первой мировой войны армия США стремилась оснастить свои войска танками. Шеститонный M1917 был почти точной лицензионной копией французского Renault FT, но имел несколько важных отличий, в том числе многогранную башню с 37-мм пушкой и пулемётом калибра .30. Однако ни одна из этих машин не участвовала в боях."
 USA_gw_tank_equipment_short:0 "M1917"
 USA_heavy_tank_artillery_equipment_3:0 "САУ T92"
 USA_heavy_tank_artillery_equipment_3_desc:0 "T92 — самоходная установка с 240-мм гаубицей M1 на шасси тяжёлого танка M26 «Першинг». Шасси пришлось удлинить, добавив по одному опорному катку с каждой стороны и доведя их число до семи на борт. Ведущее колесо также перенесли вперёд. Это было крупнейшее полевое артиллерийское орудие, использовавшееся армией США. Оно могло выпустить 160-кг фугасный снаряд на дальность до 23 000 метров. Установка предназначалась для поражения сильно укреплённых целей, подобных сооружениям немецкой линии Зигфрида."
 USA_heavy_tank_artillery_equipment_3_short:0 "T92"
 USA_heavy_tank_equipment_1:0 "T1 Тяжёлый танк"
 USA_heavy_tank_equipment_1_desc:0 "Тяжёлые танки T1 стали одной из первых попыток Артиллерийско-технической службы США создать тяжёлый танк после изучения успешного применения бронетехники в Европе и Азии. Пятидесятипятитонный T1 имел многобашенную компоновку, 76,2-мм основное орудие и спаренную с ним 37-мм пушку, а толщина лобовой брони башни достигала 127 мм."
 USA_heavy_tank_equipment_1_short:0 "ТТ T1"
 USA_heavy_tank_equipment_2:0 "M6A1 Тяжёлый танк"
 USA_heavy_tank_equipment_2_desc:0 "Тяжёлый танк M6A1 развивал конструкцию семейства T1: он сохранил прежнее вооружение, но получил сварной броневой корпус и двигатели Wright G-200. Предполагалось, что эти танки помогут преодолевать немецкие оборонительные рубежи."
 USA_heavy_tank_equipment_2_short:0 "M6A1"
 USA_heavy_tank_equipment_3:0 "M26 Першинг"
 USA_heavy_tank_equipment_3_desc:0 "M26 «Першинг» предназначался для замены танков M4 «Шерман», но затянувшаяся разработка привела к тому, что в боях в Европе участвовало лишь небольшое количество этих машин. Тяжёлый танк «Першинг» должен был на равных сражаться с немецкой тяжёлой бронетехникой благодаря 90-мм пушке M3, хорошо зарекомендовавшей себя против немецких тяжёлых танков в противотанковых частях. Максимальная толщина брони составляла 114 мм на вертикальной литой маске орудия."
 USA_heavy_tank_equipment_3_short:0 "«Першинг»"
 USA_heavy_tank_destroyer_equipment_2:0 "M6A2E1"
 USA_heavy_tank_destroyer_equipment_2_desc:0 "M6A2E1 представлял собой модификацию танков T1E1: существующее шасси тяжёлого танка получило усиленную броню и более новую 105-мм пушку с высокой начальной скоростью снаряда."
 USA_heavy_tank_destroyer_equipment_2_short:0 "M6A2E1"
 USA_heavy_tank_destroyer_equipment_3:0 "T23"
 USA_heavy_tank_destroyer_equipment_3_desc:0 "T23 был предшественником M26 «Першинг» и оснащался двигателем Ford GAN V8 с электрической трансмиссией. Машина отличалась высокой манёвренностью, но имела неудачное распределение массы и чрезмерное удельное давление на грунт."
 USA_heavy_tank_destroyer_equipment_3_short:0 "T23 90 mm"
 USA_light_tank_aa_equipment_2:0 "Спаренная самоходная пушка M13"
 USA_light_tank_aa_equipment_2_desc:0 "40-мм самоходная установка T65 была попыткой установить 40-мм зенитную пушку Bofors на модифицированное шасси M5 «Стюарт». Прототип оказался удачным, но к тому времени производство M5 уже сворачивалось."
 USA_light_tank_aa_equipment_2_short:0 "M13 MGMC"
 USA_light_tank_aa_equipment_3:0 "Спаренная 40-мм самоходная пушка M19"
 USA_light_tank_aa_equipment_3_desc:0 "40-мм самоходная установка M19 представляла собой зенитную машину со спаренными 40-мм пушками Bofors на модифицированном шасси M24 «Чаффи». Шасси удлинили и добавили третью двухкатковую тележку подвески. Двигатель разместили в середине корпуса, освободив место для боевого отделения в корме."
 USA_light_tank_aa_equipment_3_short:0 "M19 MGMC"
 USA_light_tank_artillery_equipment_1:0 "Самоходная гаубица T30"
 USA_light_tank_artillery_equipment_1_desc:0 "Самоходная гаубица T3 стала ранней попыткой установить 75-мм гаубицу M1 Pack Howitzer на шасси лёгкого танка M1. Слева от основного орудия в небольшой башенке размещался пулемёт. Управление полевой артиллерии армии США отвергло проект из-за тесноты. Бронетанковые войска некоторое время рассматривали его как штурмовое орудие, но в итоге также отказались от разработки."
 USA_light_tank_artillery_equipment_1_short:0 "САУ T30"
 USA_light_tank_artillery_equipment_3:0 "Самоходная гаубица М41"
 USA_light_tank_artillery_equipment_3_desc:0 "Самоходная гаубица M41, также известная как M41 «Горилла», была построена на удлинённом шасси танка M24 «Чаффи». Основным вооружением служила 155-мм гаубица M1, а в корме находился массивный сошник для поглощения отдачи. Орудие имело ограниченные углы горизонтального наведения и угол возвышения до 45 градусов. В машине размещались 22 выстрела. Она могла эффективно оказывать огневую поддержку и благодаря своей подвижности уходить из-под контрбатарейного огня."
 USA_light_tank_artillery_equipment_3_short:0 "M41"
 USA_light_tank_destroyer_equipment_1:0 "САУ M6 «Фарго»"
 USA_light_tank_destroyer_equipment_1_desc:0 "Самоходная пушка M5 была одним из первых американских истребителей танков: трёхдюймовое орудие устанавливалось в задней части машины за открытым бронещитом."
 USA_light_tank_destroyer_equipment_1_short:0 "M6 «Фарго»"
 USA_light_tank_destroyer_equipment_2:0 "САУ М3"
 USA_light_tank_destroyer_equipment_2_desc:0 "Самоходная установка T56 стала одной из попыток разместить 3-дюймовую пушку на шасси лёгкого танка M3. Из-за значительной массы орудие пришлось установить в корме, что привело к сравнительно низким боевым качествам машины."
 USA_light_tank_destroyer_equipment_2_short:0 "САУ М3"
 USA_light_tank_destroyer_equipment_3:0 "САУ T48"
 USA_light_tank_destroyer_equipment_3_desc:0 "M56 Scorpion стал одной из попыток армии США создать лёгкий истребитель танков. Вооружённая 90-мм пушкой M54 машина ограниченно применялась как средство непосредственной огневой поддержки."
 USA_light_tank_destroyer_equipment_3_short:0 "T48"
 USA_light_tank_equipment_1:0 "M2 Лёгкий танк"
 USA_light_tank_equipment_1_desc:0 "Лёгкий танк M2 применялся во Второй мировой войне лишь ограниченно. В корпусе размещалось до пяти пулемётов калибра .30, а основным вооружением служила 37-мм пушка M5. Вариант M2A4 позднее использовался Корпусом морской пехоты США в кампании на Гуадалканале."
 USA_light_tank_equipment_1_short:0 "ЛТ M2"
 USA_light_tank_equipment_2:0 "M3 Стюарт"
 USA_light_tank_equipment_2_desc:0 "Боевой опыт Европы и Азии побудил Артиллерийско-техническую службу усилить броню лёгких танков, изменить подвеску и улучшить противооткатные устройства. Чтобы сохранить минимальное давление на грунт и лучше распределить возросшую массу, лёгкие танки M3 получили опущенный на землю направляющий каток."
 USA_light_tank_equipment_2_short:0 "M3 «Стюарт»"
 USA_light_tank_equipment_3:0 "M24 Чаффи"
 USA_light_tank_equipment_3_desc:0 "Лёгкие танки M24 «Чаффи» были совместным проектом Управления вооружений и компании Cadillac, выпускавшей усовершенствованные варианты танков M3 и M5. Экипажи ценили установку той же 75-мм пушки, что и на средних танках M4, а также улучшенные проходимость и надёжность."
 USA_light_tank_equipment_3_short:0 "«Чаффи»"
 USA_medium_tank_aa_equipment_1:0 "Спаренная самоходная пушка M15"
 USA_medium_tank_aa_equipment_1_desc:0 "Самоходная установка T36 стала попыткой разместить 40-мм зенитную пушку Bofors на шасси среднего танка M3. Орудие находилось в литой броневой рубке толщиной два дюйма с почти треугольным профилем. Вычислитель T10 обеспечивал управление огнём для расчёта из трёх человек, определяя азимут и угол возвышения цели, которые затем вводились в систему дистанционного управления T9. Для наблюдения использовались прицелы T27 и T28."
 USA_medium_tank_aa_equipment_1_short:0 "M15 MGMC"
 USA_medium_tank_aa_equipment_2:0 "Спаренная самоходная пушка M16"
 USA_medium_tank_aa_equipment_2_desc:0 "Самоходная установка T53 проектировалась как зенитная машина с учётом успешного немецкого опыта применения знаменитой 88-мм пушки, использовавшейся и против танков. За основу взяли немного удлинённое шасси M4A4, двигатель переместили в центр корпуса, освободив место для крупного 90-мм зенитного орудия."
 USA_medium_tank_aa_equipment_2_short:0 "M16 MGMC"
 USA_medium_tank_artillery_equipment_1:0 "M7 Прист"
 USA_medium_tank_artillery_equipment_1_desc:0 "105-мм самоходная гаубица M7 была артиллерийской боевой машиной. Экипажи в Северной Африке прозвали её «Прист» («священник»): установка пулемёта калибра .50 в правой передней части корпуса напоминала церковную кафедру. Командиры ценили эту конструкцию, поскольку она позволяла сопровождать огнём первую волну танков, обрушивая мощный артиллерийский обстрел на вражескую технику и укрепления."
 USA_medium_tank_artillery_equipment_1_short:0 "M7 «Прист»"
 USA_medium_tank_artillery_equipment_2:0 "САУ M12"
 USA_medium_tank_artillery_equipment_2_desc:0 "Самоходная пушка M12 была разработана во время Второй мировой войны. Она несла 155-мм орудие, созданное на основе французской полевой пушки Canon de 155mm GPF."
 USA_medium_tank_artillery_equipment_2_short:0 "M12"
 USA_medium_tank_artillery_equipment_3:0 "САУ M40"
 USA_medium_tank_artillery_equipment_3_desc:0 "M40 — американская самоходная артиллерийская установка на расширенном и удлинённом шасси среднего танка M4A3, оснащённая двигателем Continental и подвеской HVSS с горизонтальными коническими пружинами."
 USA_medium_tank_artillery_equipment_3_short:0 "M40"
 USA_medium_tank_destroyer_equipment_1:0 "M10 Вулверин"
 USA_medium_tank_destroyer_equipment_1_desc:0 "M10 — американский истребитель танков времён Второй мировой войны на шасси M4 «Шерман». Он был вооружён 3-дюймовой пушкой, весьма эффективной при непосредственной огневой поддержке пехоты."
 USA_medium_tank_destroyer_equipment_1_short:0 "M10"
 USA_medium_tank_destroyer_equipment_2:0 "M18 Хеллкэт"
 USA_medium_tank_destroyer_equipment_2_desc:0 "M18 «Хеллкэт» был одной из самых быстрых американских бронированных боевых машин на дорогах. Он оснащался новой автоматической трансмиссией Torqmatic, а сравнительно лёгкая машина несла ту же 76-мм пушку, что и гораздо более крупный «Шерман». Литая башня и сварной корпус имели относительно тонкую броню: её наибольшая толщина, на маске орудия, составляла 25 мм."
 USA_medium_tank_destroyer_equipment_2_short:0 "M18"
 USA_medium_tank_destroyer_equipment_3:0 "M36 Джексон"
 USA_medium_tank_destroyer_equipment_3_desc:0 "M36 «Джексон» сочетал надёжное шасси M4 «Шерман» с наклонной бронёй и мощной 90-мм пушкой M3. Она была одним из немногих орудий истребителей танков, способных пробивать толстую броню поздних немецких танков на обычных боевых дистанциях."
 USA_medium_tank_destroyer_equipment_3_short:0 "M36"
 USA_medium_tank_equipment_1:0 "M3 «Ли»"
 USA_medium_tank_equipment_1_desc:0 "Чтобы противостоять немецкому Pz.Kpfw. IV, Комитет по вооружению и генерал Эдна Р. Чаффи-младший пришли к выводу о необходимости среднего танка с 75-мм пушкой. Для скорейшего выполнения этой задачи решили переработать прежние конструкции, установив 75-мм орудие в спонсоне с ограниченными углами наведения. Это было временное решение, пока Управление вооружений и гражданская промышленность не освоят проектирование и производство башни для столь крупной пушки."
 USA_medium_tank_equipment_1_short:0 "M3 «Ли»"
 USA_medium_tank_equipment_2:0 "M4 Шерман"
 USA_medium_tank_equipment_2_desc:0 "Ещё в августе 1941 года генерал Джейкоб Л. Деверс отверг американскую доктрину, согласно которой танки должны были развивать успех на поле боя, а не сражаться с другими танками. Он выступал за создание более совершенных машин с мощными двигателями и сыграл значительную роль в разработке M4 «Шерман». Конструкторы уделяли особое внимание механической надёжности, простоте производства и обслуживания, долговечности, унификации деталей и боеприпасов. Благодаря этому M4 «Шерман» стал самым массовым танком в американской истории периода Второй мировой войны."
 USA_medium_tank_equipment_2_short:0 "«Шерман»"
 USA_medium_tank_equipment_3:0 "T20 M27"
 USA_medium_tank_equipment_3_desc:0 "T20 — серия опытных средних танков, разработанных после принятия M4 «Шерман» в качестве стандартной модели. Некоторые варианты T20 оснащались 75-мм автоматической или 76-мм пушкой и подвеской с горизонтальными коническими пружинами. Кроме того, машина имела двигатель Ford GAN V8 и трансмиссию Torqmatic с гидротрансформатором."
 USA_medium_tank_equipment_3_short:0 "T20"
 USA_modern_tank_aa_equipment_1:0 "M42 «Дастер»"
 USA_modern_tank_aa_equipment_1_desc:0 "M42 Duster — американская бронированная зенитная установка на шасси лёгкого танка M41. Две автоматические 40-мм пушки M2A1 Bofors предназначались для борьбы с авиацией, но также оказались достаточно эффективны против небронированных наземных целей."
 USA_modern_tank_aa_equipment_1_short:0 "M42 «Дастер»"
 USA_modern_tank_artillery_equipment_1:0 "M53"
 USA_modern_tank_artillery_equipment_1_desc:0 "Самоходная установка M53 со 155-мм гаубицей предназначалась для точной дальней огневой поддержки механизированных соединений на пересечённой местности."
 USA_modern_tank_artillery_equipment_1_short:0 "M53"
 USA_modern_tank_destroyer_equipment_1:0 "M50 Ontos"
 USA_modern_tank_destroyer_equipment_1_desc:0 "M50 Ontos — лёгкая мобильная противотанковая система с шестью 106-мм безоткатными орудиями. Она была разработана в середине 1950-х годов для морских десантов. Необычная, но лёгкая и манёвренная машина хорошо показала себя в поддержке пехоты, обеспечивая мощный фронтальный огонь и защиту флангов."
 USA_modern_tank_destroyer_equipment_1_short:0 "Ontos"
 USA_modern_tank_equipment_1:0 "M26 Super Першинг"
 USA_modern_tank_equipment_1_desc:0 "Чтобы сравняться по огневой мощи с более мощной 88-мм пушкой KwK 43 «Королевского тигра», была разработана 90-мм пушка T15E1. Её установили на T26E1 — вариант стандартного «Першинга» с усиленной бронёй. Новое орудие было почти вдвое длиннее обычной 90-мм пушки M3 и могло пробивать броню почти всех немецких танков позднего периода войны."
 USA_modern_tank_equipment_1_short:0 "Super Першинг"
 USA_modern_tank_equipment_x:0 "M46 Patton"
 USA_modern_tank_equipment_x_desc:0 "Эта модель оснащалась двигателем Continental V12 воздушного охлаждения и трансмиссией Allison с поперечным приводом, призванными улучшить подвижность и увеличить невысокую скорость последних «Першингов». Вооружение состояло из 90-мм пушки, двух пулемётов калибра .30 и командирского пулемёта калибра .50."
 USA_modern_tank_equipment_x_short:0 "M46 Patton"
 USA_modern_tank_equipment_x_2:0 "M47 Patton"
 USA_modern_tank_equipment_x_2_desc:0 "M47 «Паттон» продолжал развитие прежних конструкций и переход к единому стандартному танку. Его башня заметно отличалась более острыми и угловатыми очертаниями. Машина сохранила 90-мм пушку M36, но получила оптический дальномер M12, предназначенный для повышения вероятности попадания первым выстрелом."
 USA_modern_tank_equipment_x_2_short:0 "M47 Patton"
 USA_modern_tank_equipment_x_3:0 "M48 Patton"
 USA_modern_tank_equipment_x_3_desc:0 "Основной боевой танк первого поколения армии США с полностью переработанными корпусом, башней и торсионной подвеской."
 USA_modern_tank_equipment_x_3_short:0 "M48 Patton"
 USA_modern_tank_equipment_x_4:0 "M48A2 Patton"
 USA_modern_tank_equipment_x_4_desc:0 "Дальнейшее развитие M48A2 включало переработанное моторное отделение, упрощённую подвеску и внешние топливные баки для увеличения запаса хода."
 USA_modern_tank_equipment_x_4_short:0 "M48A2 Patton"
 USA_modern_tank_equipment_x_5:0 "M60 Паттон"
 USA_modern_tank_equipment_x_5_desc:0 "Второе поколение основных боевых танков армии США получило более мощный дизельный двигатель и 105-мм пушку M68, обладавшую хорошей огневой мощью против современной бронетехники."
 USA_modern_tank_equipment_x_5_short:0 "M60 Паттон"
 USA_super_heavy_tank_destroyer_equipment_1:0 "T30"
 USA_super_heavy_tank_destroyer_equipment_1_desc:0 "Танк T30 создавался для борьбы с новой тяжёлой немецкой бронетехникой. Он получил массивную 155-мм пушку, для заряжания и крупной орудийной установки которой потребовалась высокая башня с закруглёнными бортами."
 USA_super_heavy_tank_destroyer_equipment_1_short:0 "T30"
 USA_super_heavy_tank_equipment_1:0 "Сверхтяжелый танк T95"
 USA_super_heavy_tank_equipment_1_desc:0 "Самоходная установка T95 была американской сверхтяжёлой машиной, предназначенной для прорыва немецкой линии Зигфрида. При массе почти 100 тонн она несла 105-мм пушку T5E1 в неподвижной казематной установке."
 USA_super_heavy_tank_equipment_1_short:0 "T95"
 USA_super_heavy_tank_equipment_x:0 "M103"
 USA_super_heavy_tank_equipment_x_desc:0 "Последний тяжёлый танк армии США M103 был вооружён 120-мм пушкой M58, позволявшей поражать советские тяжёлые танки с очень больших дистанций."
 USA_super_heavy_tank_equipment_x_short:0 "M103"
 USA_super_heavy_tank_equipment_x_2:0 "T110E3"
 USA_super_heavy_tank_equipment_x_2_desc:0 "Предлагавшийся на замену тяжёлому танку M103 проект T110E3 оснащался 120-мм нарезной противотанковой пушкой T123E1 и двигателем Continental Motors. По требованиям танк должен был проходить через узкие тоннели Бернских Альп, но ни один вариант проекта так и не удовлетворил этому условию."
 USA_super_heavy_tank_equipment_x_2_short:0 "T110E3"
 USA_light_tank_equipment_x:0 "M41 Walker Bulldog"
 USA_light_tank_equipment_x_desc:0 "Послевоенный лёгкий танк M41 Walker Bulldog задумывался как высокомобильная машина, использующая автомобильные узлы, уже распространённые в вооружённых силах США. Модульный корпус позволял переделывать его для различных специальных задач."
 USA_light_tank_equipment_x_short:0 "Walker Bulldog"
 USA_light_tank_equipment_x_2:0 "M551 Sheridan"
 USA_light_tank_equipment_x_2_desc:0 "Послевоенный лёгкий танк Sheridan создавался специально для бронетанковой разведки. Он получил передовую 152-мм пушку-пусковую установку M81E1, способную стрелять обычными боеприпасами и управляемыми противотанковыми ракетами."
 USA_light_tank_equipment_x_2_short:0 "Sheridan"
