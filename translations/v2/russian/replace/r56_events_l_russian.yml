 SEA_PRC_border_war_events.1.desc:0 "После пограничных стычек у [1124.GetName] [PRC.GetNameDef] удалось прорвать оборонительные линии и вытеснить противника. [PRC.GetNameDefCap] теперь объявляет регион своим."
