l_russian:
 germany.4.d:0 "Повторяющиеся восстания в [AUS.getNameDef] ясно показывают, что местный народ стремится к объединению с нашей нацией. Настало время действовать и позволить воле народа воплотиться в жизнь. \n\nТо, что было запрещено как Сен-Жерменским, так и Версальским договорами, теперь должно предстать перед всем миром как окончательная и неоспоримая воля обеих наших наций: союз [GER.getAdjective]-[AUS.getAdjective] должен быть завершён, став первым шагом к объединению всех германских народов в одном национальном государстве!"
 germany.4.a:0 "Как вообще можно утверждать, что Австрия не [GER.getAdjective]?!"
 germany.5.d:1 "Непрерывная риторика [GER.getNameDef] и его руководства о создании единого фронта против распространения красной угрозы достигла даже самых изолированных кабинетов нашего правительства. \n\nНаши чиновники уже получили множество восторженных предложений и несколько обеспокоенных запросов относительно такого сближения с [GER.getNameDef]. \n\nСегодня утром была доставлена секретная телеграмма, в которой [GER.getLeader] предлагает нам подписать пакт, направленный против стремления Коминтерна распространять коммунизм по всему миру путём подрывной деятельности и насилия. Подписав этот пакт, мы согласимся обмениваться разведданными о коммунистической угрозе и тесно сотрудничать в борьбе с ней. \n\nС другой стороны, предложение касается главным образом обмена разведданными и лишь вскользь упоминает возможность совместного военного союза или какой-либо взаимной обороны. Отказ от официального участия в пакте ухудшит наши отношения с [GER.getNameDef], но, возможно, убережёт нас от отчуждения и ответных мер со стороны [SOV.getNameDef]."
 germany.6.d:0 "Подписавшие стороны считают необходимым условием любого прочного мира предоставление всем народам мира подобающего им места и постановили поддерживать и сотрудничать друг с другом в своих усилиях в Великой Восточной Азии и в регионах Европы соответственно, где их главной целью является установление и поддержание нового порядка, призванного содействовать взаимному процветанию и благополучию заинтересованных народов."
 germany.11.d:0 "Министерство иностранных дел [GER.getAdjective] предложило заключить пакт о ненападении между нашими двумя странами. Этот договор значительно расширит взаимную торговлю и одновременно обеспечит исследовательские учреждения [SOV.getAdjective] недостающими специалистами и технологическими достижениями из [GER.getNameDef]. \nДополнительный секретный протокол предусматривает раздел Восточной Европы на сферы влияния [GER.getAdjective] и [SOV.getAdjective]. \n\nХотя [GER.GetRulingIdeology]ы в Берлине по очевидным причинам не заслуживают доверия, этот пакт позволит нам разобраться с [FIN.getNameDef], странами Балтии и [ROM.getNameDef] без опасений внешнего вмешательства. Восточные территории [POL.getNameDef] также достанутся нам в случае краха [POL.getAdjective]."
 germany.11.a.tt:0 "§RПока пакт действует, торговая политика «Закрытая экономика» будет недоступна.\nФокус «Война с Германией» будет недоступен в течение двух лет.§!\n"
 germany.11.b:0 "Никаких сделок с [GER.GetRulingIdeology]ами!"
 germany.12.d:0 "Официальный ответ представителей [SOV.getNameDef] был получен довольно поздно, учитывая объём и значимость предложенного нами соглашения: посол [SOV.getAdjective] в Берлине передал подписанную копию документа соответствующему дипломату [GER.getAdjective]. \n\nВ ноте говорилось, что [SOV.getNameDef] в лице [SOV.getLeader] согласился подписать наш пакт о ненападении и будет соблюдать положения договора до последней буквы и в соответствии со всеми официальными протоколами, указанными в документе. \n\nЭто означает, что мы можем действовать, не опасаясь вмешательства [SOV.getAdjective], а ресурсы [SOV.getAdjective] будут доступны нам, если мы начнём любую военную или гражданскую кампанию. \n\nК сожалению, некоторые из наших друзей теперь сомневаются в приверженности [GER.getNameDef] окончательному уничтожению коммунизма. Когда вопросы с [POL.getNameDef] и [FRA.getNameDef] будут решены, нам, возможно, придётся вновь вернуться к этому договору, но это разговор для другого времени..."
 germany.12.d:0 "Официальный ответ представителей [SOV.getNameDef] был получен довольно поздно, учитывая объём и значимость предложенного нами соглашения: посол [SOV.getAdjective] в Берлине передал подписанную копию документа соответствующему дипломату [GER.getAdjective]. \n\nВ ноте говорилось, что [SOV.getNameDef] в лице [SOV.getLeader] согласился подписать наш пакт о ненападении и будет соблюдать положения договора до последней буквы и в соответствии со всеми официальными протоколами, указанными в документе. \n\nЭто означает, что мы можем действовать, не опасаясь вмешательства [SOV.getAdjective], а ресурсы [SOV.getAdjective] будут доступны нам, если мы начнём любую военную или гражданскую кампанию. \n\nК сожалению, некоторые из наших друзей теперь сомневаются в приверженности [GER.getNameDef] окончательному уничтожению коммунизма. Когда вопросы с [POL.getNameDef] и [FRA.getNameDef] будут решены, нам, возможно, придётся вновь вернуться к этому договору, но это разговор для другого времени..."
 germany.13.d:0 "Недавнее сообщение наших шпионов из Москвы и её окрестностей говорит о том, что [SOV.getNameDef] отказался подписывать наш пакт о ненападении. \n\nБолее того, сегодня утром [SOV.getLeader] выступил с официальной речью перед населением страны, в которой назвал наше предложение мира и процветания в Восточной Европе «...жалкой попыткой ничтожного руководства [GER.getAdjective] завоевать доверие народа [SOV.getAdjective] лишь затем, чтобы предать нас, как только наша помощь перестанет быть нужна...» \n\nЧитая доклад, [GER.getLeader] побелел, его руки задрожали, и он пробормотал что-то вроде «Verräter... Verräter». \nЭто осложняет ситуацию, поскольку мы не можем решительно разобраться с [POL.getNameDef] или [FRA.getNameDef] без риска вмешательства [SOV.getAdjective]."
 germany.14.c:0 "[SOV.GetAdjective] получат компенсацию в виде Литвы."
 germany.14.d:0 "Мы будем придерживаться первоначальных условий договора."
 germany.15.t:0 "[GER.getNameDefCap] соблюдает пакт"
 germany.15.d:0 "В соответствии с пактом Молотова — Риббентропа силы [GER.GetAdjective] эвакуировались из Восточной Польши, а наши войска вошли на эту территорию."
 germany.16.t:0 "[GER.getNameDefCap] предаёт пакт"
 germany.16.d:0 "[GER.getNameDefCap] отказался разделить Польшу с нами, грубо нарушив пакт Молотова — Риббентропа! Это предательство делает наш договор с ними недействительным!"
 germany.16.a:0 "Мы были глупцами, доверившись [GER.GetRulingIdeology]ам!"
 germany.20.d:0 "Признавая, что в Европе установился новый порядок, [HUN.getNameDef] и [ROM.getNameDef] попросили нас выступить арбитром в территориальном споре между двумя странами. Трансильвания была отнята у [HUN.getNameDef] и включена в состав [ROM.getNameDef] в результате одного из многочисленных непродуманных решений, навязанных миру в Версале. Следует ли вернуть Северную Трансильванию под контроль [HUN.getAdjective]?"
 germany.20.a:0 "Передать [HUN.getNameDef] Северную Трансильванию."
 germany.20.b:0 "Передать [HUN.getNameDef] всю Трансильванию."
 germany.20.c:0 "Трансильвания останется в составе [ROM.getNameDef]."
 germany.21.t:0 "[ROM.getNameDefCap] отвергает наш вердикт"
 germany.21.d:0 "[ROM.getNameDefCap] отказался подчиниться решению, принятому нами в рамках Второго Венского арбитража! Их делегация отозвана в Бухарест, и ни одна территория не была передана [HUN.getNameDef]."
 germany.21.a:0 "Воля [GER.getNameDef] должна быть исполнена!"
 germany.22.t:0 "Мемель — [188.controller.getNameDef] уступает"
 germany.22.d:0 "Правительство [188.controller.getAdjective] согласилось с нашими требованиями, и Мемель вновь будет включён в состав Восточной Пруссии. Ещё одна незаконно отнятая провинция возвращена народу [GER.getAdjective]!"
 germany.23.t:0 "Мемель — [188.controller.GetNameDef] отклоняет требование"
 germany.23.d:0 "Правительство [188.controller.getAdjective] отказалось выполнять наши требования! Они прикрываются Клайпедской конвенцией и утверждают, что [GER.getNameDef] не имеет законных прав на территорию Мемеля. Придётся объяснить им нашу позицию иными средствами..."
 germany.24.t:0 "Военная миссия [GER.getNameDefCap] в Китай"
 germany.24.d:0 "[GER.getNameDefCap] поддерживает хорошие отношения с Китаем со времён окончания предыдущей Великой войны, несмотря на потерю наших китайских владений. Военная миссия [GER.getAdjective] уже несколько лет находится в Китае, а Александр фон Фалькенхаузен добился значительных успехов в реформировании частей армии Гоминьдана. \n\nЕстественно, это вызывает обеспокоенность у [JAP.getAdjective], учитывая их нынешнюю войну против Китая. Они требуют, чтобы [GER.getAdjective] немедленно прекратил любую поддержку [CHI.getAdjective]."
 germany.24.c:0 "Нет, наши советники останутся, как мы и обещали [CHI.getAdjective]."
 germany.28.t:0 "Аншлюс"
 germany.28.d:0 "Это произошло.\n\nНикто не сомневался, что этот момент настанет, но даже так по всей стране прокатилась волна потрясения.\n\nСегодня [GER.GetLeader] направил нашему правительству список требований, выполнение которых фактически означало бы аннексию нашей страны, пусть и не названную прямо. По всей стране вспыхнули беспорядки в поддержку аншлюса, а из армии началось дезертирство к нацистам.\n\nСрок ультиматума истекает, нацистские войска готовы войти на нашу территорию, и решение нужно принять прямо сейчас.\n\nЯвляется ли независимая Австрия лишь искусственным образованием — или чем-то большим?"
 germany.28.a:0 "Нас оставили одних..."
 germany.28.b:0 "Нас не растоптать так просто! Красно-бело-красный до самой смерти!"
 germany.28.c:0 "Нас не растоптать так просто! Чёрно-жёлтый до самой смерти!"
 germany.29.t:0 "[AUS.getNameDef] отказывается от аншлюса!"
 germany.29.b:0 "Возможно, лучше не идти дальше."
 germany.51.d:0 "Чехословакия — раковая опухоль в сердце Европы, и наконец немцы решили предпринять против неё решительные действия. Судетская область уже передана Германии, а теперь, вследствие Мюнхенского соглашения, чехословацкие территории, по праву принадлежащие Венгрии, должны быть возвращены нам."
 germany.70.d:0 "Считая, что Гитлер завёл Германию в положение, из которого она уже не сможет выбраться, группа старших офицеров вермахта подняла мятеж! По всей видимости, его организовал полковник Ганс Остер из абвера, однако подтверждено также участие генералов Бека, фон Браухича, Гальдера и адмирала Канариса!\n\nХорошо вооружённые люди, скрывавшиеся в нескольких берлинских квартирах, выдвинулись к ключевым правительственным зданиям и намерены свергнуть действующий режим. Сейчас идут ожесточённые перестрелки. Положение фюрера остаётся неизвестным, однако верные армейские части сражаются за контроль над Берлином."
 germany.71.d:0 "Войска СС и верные армейские части сумели уничтожить или захватить всех мятежных диверсантов и полностью взять ситуацию под контроль. Однако фюрер был найден мёртвым — его убили заговорщики!\n\nВыжившие участники заговора предстанут перед судом за своё чудовищное преступление, но сейчас стране нужен новый лидер. Кто станет следующим фюрером?"
 germany.72.d:0 "Войска СС и верные армейские части сумели уничтожить или захватить всех мятежных диверсантов, и ситуация считается полностью взятой под контроль. Гитлер лично руководил зачисткой, вооружившись своим верным «Люгером».\n\nВыжившие заговорщики дорого заплатят за свою нелояльность, а сам Гитлер теперь ещё решительнее намерен обеспечить успех Германии!"
 germany.73.d:0 "Тяжёлые бои в Берлине превратили столицу в пылающие руины. Несмотря на большое число солдат СС и верных армейских частей, к сражению присоединились войска, поддержавшие заговорщиков, и именно это оказалось решающим. Гибель фюрера подтверждена, а заговорщики успешно захватили все правительственные здания Берлина.\n\nЗначительная часть вермахта перешла на другую сторону, но многие офицеры всё ещё верны НСДАП. Кто должен возглавить их?"
 germany.75.t:0 "Договор [GER.GetAdjective]-[SOV.GetAdjective]"
 germany.76.t:0 "[SOV.GetLeader] принимает германо-[SOV.GetAdjective] договор"
 germany.77.t:0 "[SOV.GetLeader] отвергает германо-[SOV.GetAdjective] договор"
 germany.79.d:0 "Когда Греция оказалась под пятой Германии, [From.GetLeader] начал оказывать давление на наше правительство, требуя присоединиться к их лагерю. Союз [SOV.GetAdjective]-германск поставил нас в положение, где нейтралитет больше невозможен, а теперь из Берлина поступил ультиматум: мы должны уступить восточные территории их советским союзникам и вступить в тот самый пакт, которым нас и принуждают.\n\nХотя сохранить нейтралитет мы уже не можем, существуют и другие варианты. Один — искать поддержки Британии, другой — стоять на своём. Однако ни один из них не способен гарантировать будущее республики."
 china.101.d:0 "Недавние сообщения с северной границы между [CHI.GetAdjective] и [JAP.GetAdjective] указывают, что ожесточённый спор вокруг демилитаризованной зоны и территориальных прав обеих стран в районе Пекина перерос в открытый вооружённый конфликт. \n\nВ недавней речи [CHI.GetLeader] призвал всех граждан Китая, некогда входивших в пределы бывшей империи, объединиться в борьбе против вторгшихся японских войск. Если мы хотим сохранить будущее для Китая таким, каким он является сегодня, нам следует забыть мелкие распри и сражаться как сильный, единый Китай! \n\nЯпонцы, с другой стороны, утверждают, что именно [CHI.GetAdjective] спровоцировали и раздули инцидент. С их точки зрения, [CHI.GetName] непременно попытается уничтожить нас и наше пока ещё хрупкое государство, как только получит такую возможность. Мы можем не спешить и посмотреть, как будет развиваться ситуация. \n\nКакое решение примет [Root.GetLeader]? "
 china.101.c:0 "Пока что нам лучше оставаться самим по себе."
 china.103.d:0 "[From.GetNameDefCap] решил присоединиться к нам в борьбе против японцев. Вместе мы отбросим захватчика."
 china.104_PRC_SOV_reinforcements:0 "Получит 10 дивизий от [SOV.GetNameDef]."
 china.104.tt:0 "\nТеперь Северный Китай и Маньчжурию можно освободить от имени [Root.GetNameDef].\n"
 china.106.d:0 "[From.GetNameDefCap] вступил в [Root.GetFactionName] и готов сражаться."
 china.108.d:0 "Наша роль в борьбе против ненавистных японских псов принесла КПК большой престиж. Всё больше людей понимают, что именно мы — будущее Китая, особенно на фоне коррумпированного Гоминьдана. Партийные кадры уже организуют этих людей в новую армию, которая будет плавать в крестьянском море."
 china.111.d:0 "[Root.GetFactionName] выполнил своё предназначение. Больше нет врага, против которого нужно было сохранять единство. Мы разумно использовали это время, чтобы укрепить поддержку по всему Северному Китаю и Маньчжурии, и теперь настало время официально закрепить наш контроль над этим регионом."
 spain.10.d:0 "После того как лидер Испанской конфедерации автономных правых — главной правой партии, ранее сотрудничавшей с центристским правительством Алехандро Лерруса, — Хосе Мария Хиль-Роблес-и-Киньонес потребовал пост премьер-министра, что усилило бы контроль CEDA над испанским правительством, президент Нисето Алькала-Самора решил распустить кортесы, поскольку всегда враждебно относился к CEDA и её лидеру. Новые выборы назначены на февраль, а до тех пор Мануэль Портела останется премьер-министром."
 spain.4.a.tt:0 "[From.GetNameDefCap] будет благодарен, если во время войны мы организуем поставки по ленд-лизу."
 france.17.b:0 "[Root.GetNameDefCap] идёт своим путём."
 france.18.t:0 "[From.GetNameDefCap] вступает во французский альянс"
 france.19.t:0 "[From.GetNameDefCap] отказывается от французского союза"
 france.35.title:0 "Коммунисты доминируют в Народном фронте"
 france.35.desc:0 "Политический ландшафт [FRA.GetNameDef] существенно изменился после победы коммунистов на выборах. Ранее роль коммунистов в левом альянсе была ограниченной, и они не занимали правительственных постов, но теперь, после их усиления, это несомненно изменится."
 france.35.a:0 "Им лучше соблюдать правила."
 france.35.b:0 "Народ Франции сделал мудрый выбор."
 france.35.c:0 "Можем ли мы всё ещё им доверять?"
 soviet.4.t:0 "[78.controller.GetNameDefCap] уступает Бессарабию"
 soviet.4.d:0 "[78.controller.getAdjective] благоразумно уступили нашим требованиям: сегодня утром их посол в Москве передал нашим представителям ноту с извинениями за запоздалый ответ. \n\nНаши усиленные пограничные патрули сообщают об отводе сил [78.controller.getAdjective] по всей линии бессарабской границы. Некоторые предприимчивые солдаты уже заняли несколько застав за Днестром. \n\nМы включим эту территорию в состав [SOV.getNameDef], предоставив [MOL.getAdjective] желаемую автономию в рамках нашего государства. Буковина, как ожидается, будет вновь включена в [UKR.getAdjective] государство, чтобы её жители могли воспользоваться преимуществами объединения со своими братьями и сёстрами."
 soviet.5.t:0 "[78.Owner.getNameDefCap] отвергает наши требования"
 soviet.5.d:0 "[78.Owner.getAdjective] отказались уступить нашим требованиям! Похоже, нам придётся силой изгнать их оккупационные войска из Бессарабии."
 soviet.6.t:0 "[EST.getNameDefCap] подчиняется"
 soviet.6.d:0 "[EST.getNameDefCap] уступил нашим требованиям. Мы заменили упадочное правительство в Таллине на про-[SOV.getAdjective], которое единогласно проголосовало за обращение к представителям [SOV.getNameDef] с просьбой о повторном включении их государства в состав нашего. После «долгих» колебаний Верховный [SOV.getAdjective] решил удовлетворить эту просьбу."
 soviet.6.a:0 "Добро пожаловать обратно на Родину."
 soviet.7.t:0 "[EST.getNameDefCap] отвергает наше предложение"
 soviet.7.d:0 "[EST.getNameDefCap] возмутительным образом решил отвергнуть наше щедрое предложение о пакте взаимопомощи! Воинственное и мятежное руководство из Таллина вдобавок имело наглость потребовать, чтобы мы уважали территориальную целостность их страны!"
 soviet.7.a:0 "Мы должны защитить [EST.getAdjective] от них самих."
 soviet.8.t:0 "[LAT.getNameDefCap] подчиняется"
 soviet.8.d:0 "Правительство [LAT.getAdjective] в Риге согласилось с нашими требованиями, и мы заменили их коррумпированное правление на менее упрямое и более открытое к альтернативным предложениям. Этот орган единогласно проголосовал за просьбу о вступлении в наш великий союз в качестве неотъемлемой части нашего государства. Мы великодушно согласились удовлетворить эту просьбу."
 soviet.8.a:0 "Теперь вы в нашей сфере!"
 soviet.9.t:0 "[LAT.getNameDefCap] отвергает наше предложение"
 soviet.9.d:0 "Угнетатели и тираны, правящие [LAT.getNameDef], решили отбросить всякий здравый смысл. Они отвергли наш щедрый пакт взаимопомощи и требуют немедленного отвода всех сил [SOV.getAdjective], якобы «стягивающихся» к их границе."
 soviet.9.a:0 "Народ [LAT.getAdjective] должен быть освобождён."
 soviet.10.t:0 "[LIT.getNameDefCap] подчиняется"
 soviet.10.d:0 "Наша просьба о размещении военных баз в [LIT.getNameDef] была удовлетворена, но, к сожалению, их правительство распалось. Чтобы избежать анархии, мы создали новый парламент, который единогласно проголосовал за обращение к Верховному [SOV.getAdjective] с просьбой о вступлении в наш союз. Просьба удовлетворена."
 soviet.10.a:0 "Мы спасём вас от очередной политической катастрофы."
 soviet.11.t:0 "[LIT.getNameDefCap] отвергает наше предложение"
 soviet.11.d:0 "[LIT.getNameDefCap], похоже, одержим саморазрушением, а глупцы в их правительстве отказывают нашим войскам в доступе в страну. Неужели они думают, что под властью [GER.getAdjective] им будет лучше? Их эгоистичные лидеры совершают преступление против народа, не позволяя гражданам осуществить их истинную волю."
 soviet.11.a:0 "Народ [LIT.getAdjective] страдал достаточно."
 soviet.12.t:0 "[FROM.getNameDefCap] принимает наши требования"
 soviet.12.d:0 "Подавляющие силы, сосредоточенные нами вдоль их границ, убедили правительство [FROM.getAdjective] принять нашу скромную просьбу о пересмотре границ. Мы получили контроль над стратегическими районами, которые будут включены в административную область [KAR.getAdjective], а положение нашей северной границы теперь стало значительно безопаснее."
 soviet.13.t:0 "[FROM.getNameDefCap] отвергает наши требования"
 soviet.13.d:0 "Правительство [FROM.getAdjective] отвергло наши требования, но этого следовало ожидать. Если мы хотим Карелию, придётся взять её силой. Пора преподать упрямым глупцам урок, который они не забудут!"
 japan.3.t:0 "Пограничная стычка: победа [SOV.GetAdjective]"
 romania.1.t:1 "[FROM.GetNameDefCap] требует Бессарабию"
 baltic.5.a:0 "Наше будущее будет надёжнее всего, если мы действительно станем единым целым с Родиной."
 bulgaria.2.d:0 "Румынское правительство отказалось от нашего предложения положить конец всем спорам! Они заявляют, что Южная Добруджа теперь является неотъемлемой частью их страны и они никогда от неё не откажутся."
 italy.1.t:0 "[ALB.GetNameDefCap] уступает"
 italy.1.d:0 "Власти [ALB.getAdjective] согласились с нашими требованиями, а [ALB.GetLeader] был вынужден подписать прошение, которое официально включит [ALB.GetNameDef] в состав [ITA.GetNameDef] в качестве протектората. \n\nОтныне и до конца времён [ITA.GetNameDef] будет укреплять свои позиции на Адриатическом море!"
 italy.2.t:0 "[ALB.GetLeader] отвергает ультиматум"
 italy.2.d:0 "Непокорный до конца, [ALB.GetLeader] отверг наш ультиматум. Теперь он и его советники пытаются наскрести хоть какую-то жалкую оборону, которую способен выставить [ALB.GetNameDef]. Мы должны занять Тирану и положить конец этому фарсу!"
 italy.2.a:0 "Мы могли бы сделать это по-хорошему!"
 italy.3.t:0 "Ультиматум [ITA.getAdjective]"
 italy.3.d:0 "Дипломаты [ITA.getAdjective] предъявили нам ультиматум, требуя подчиниться их оккупации! [ALB.GetNameDefCap] должен управляться в личной унии под властью короля [ITA.getAdjective]!"
 italy.3.b:0 "Этому не бывать! Сплотимся вокруг [ALB.GetLeader]!"
 news.1.d:0 "Высокая напряжённость на границе между силами [JAP.getAdjective] и [CHI.getAdjective] привела к перестрелке после того, как один из солдат [JAP.getAdjective], как утверждается, не явился по вызову командира полка, а следственная группа потребовала разрешения обыскать крепость Ваньпин. После провала переговоров обе стороны вступили в безрезультатную стычку за стратегически важный мост Марко Поло к юго-западу от Пекина. \n\n[CHI.GetNameDefCap] отверг требования [JAP.GetNameDef] принести извинения и сделать территориальные уступки, заявив вместо этого, что достигнут «предел» японской агрессии. \n\nДипломаты опасаются, что нестабильная ситуация в любой момент может перерасти в войну."
 news.5.d:0 "Пользуясь слабостью [FRA.getAdjective] на фоне борьбы в Европе и их слабым контролем над колониальными владениями по всему миру, [JAP.GetNameDef] вынудил новое правительство уступить контроль над колонией в Индокитае! \n\nВойска [JAP.getAdjective] уже начали занимать все крупные базы в регионе, включая стратегические объекты в районе Тонкина и Сайгона. Из-за нарушения связи произошли стычки в районах Донг-Данга, Лангшона и Хайфона, продолжавшиеся несколько дней. \n\nЭксперты опасаются, что колония может стать плацдармом для будущих военных экспедиций."
 news.6.d:0 "Пытаясь воспользоваться слабостью Франции после её поражения в Европе, [JAP.GetNameDef] недавно потребовал от нового французского правительства полного доступа к их базам в Индокитае. \n\nФактически это означало бы передачу Японии контроля над всей колонией, на что французы не могли согласиться. После срыва переговоров обе стороны стягивают войска в этот район. Колониальная администрация [FRA.getAdjective] уже ввела военное положение и объявила всеобщую мобилизацию! \n\nЭксперты считают вероятным, что это решение приведёт к военным ответным мерам со стороны Японии."
 news.7.t:0 "Стычка [SOV.GetAdjective] — Япония"
 news.7.d:0 "Силы [SOV.GetAdjective] и Японии недавно столкнулись в крупной стычке на маньчжурской границе. \n\nЗначительный рейдовый отряд [SOV.GetAdjective], поддержанный монгольской кавалерией, по всей видимости, застал японцев врасплох и нанёс им тяжёлые потери. \n\nПо сообщениям, обстановка в Токио напряжённая, но пока слишком рано говорить, перерастёт ли конфликт в открытую войну."
 news.7.c:0 "Мы послали миру сигнал."
 news.8.d:0 "Силы [SOV.GetAdjective] и Японии недавно столкнулись в крупной стычке на маньчжурской границе. \n\nСогласно сообщениям с поля боя, японцы поймали советские силы в клещи, когда те перешли границу в наступление, заставив уцелевших в беспорядке отступить. \n\nПобудит ли этот инцидент Москву направить дополнительные силы на российский Дальний Восток?"
 news.9.t:0 "Отвод войск [SOV.GetAdjective]"
 news.9.d:0 "После наращивания японских сил в Маньчжурии [SOV.GetNameDef], по всей видимости, неожиданно отвёл части, размещённые непосредственно у границы. \n\nВозможно, Москва пытается избежать будущего столкновения с Японией, помня о болезненном поражении России в Русско-японской войне."
 news.10.t:0 "[SOV.GetNameDefCap] заявляет права на Бессарабию"
 news.10.d:0 "\nПосле сосредоточения войск вдоль румынской границы [SOV.GetNameDef] предъявил правительству в Бухаресте ультиматум с требованием немедленно передать Бессарабию под его контроль. \n\nВо время Гражданской войны в России местные власти объявили независимость и выразили желание войти в состав Румынии, однако [SOV.GetNameDef] считает это недостаточным правовым основанием и также заявляет, что «голоса украинского меньшинства не были учтены».\n\nРумыния объявила, что у неё нет выбора, кроме как уступить, и её войска были выведены из Бессарабии и Северной Буковины."
 news.11.t:0 "[78.controller.GetNameDefCap] отвергает требования [SOV.GetAdjective]"
 news.11.d:0 "[SOV.GetNameDefCap] сосредоточил значительные силы вдоль границы с [78.controller.GetNameDef], и сегодня Москва предъявила правительству [78.controller.GetAdjective] ультиматум, потребовав немедленной передачи Бессарабии под свой контроль. Когда-то этот регион принадлежал Российской империи, что [SOV.GetNameDef] считает достаточным правовым основанием для своих требований.\n\nПроявив неповиновение, местные власти решили отвергнуть все территориальные требования [SOV.GetAdjective] и объявили полную мобилизацию. \n\nМеждународные наблюдатели ожидают, что силы [SOV.GetAdjective] могут пересечь границу в любой момент."
 news.12.t:0 "[146.controller.GetNameDefCap] отвергает требования [SOV.GetAdjective]"
 news.12.d:0 "\nДипломаты [SOV.GetAdjective] предъявили правительству [146.controller.GetNameDef] ультиматум, потребовав изменения границы в Карелии, аренды полуострова Ханко на следующие 30 лет и передачи нескольких островов в Финском заливе в обмен на населённые пункты Репола и Пораярви в Восточной Карелии. \n\nНесмотря на значительное сосредоточение советских войск на границе, Хельсинки отверг эти требования, заявив, что «ни один фут финской земли не будет добровольно отдан русским агрессорам». \n\nМеждународные наблюдатели опасаются, что вторжение [SOV.GetAdjective] может быть неизбежным."
 news.13.t:0 "[FIN.GetNameDefCap] принимает требования [SOV.GetAdjective]"
 news.13.d:0 "После долгих дебатов правительство [FIN.GetNameDef] решило принять требования [SOV.GetAdjective] об изменении границы в Карелии. \n\n[SOV.GetNameDefCap] сослался на необходимость создать буферную зону для повышения безопасности Ленинграда, расположенного всего в 30 километрах от теперь уже бывшей финской границы. \n\nМногие наблюдатели опасались неминуемого полномасштабного советского вторжения в Финляндию, но это дипломатическое решение должно развеять эти опасения."
 news.14.d:0 "В опубликованном сегодня ранее пресс-релизе Москва объявила о формальной аннексии [TAN.GetNameDef] и включении её в состав СССР как Тувинской автономной области. \n\nВерховный [SOV.GetAdjective] согласился удовлетворить просьбу недавно реформированного Центрального комитета ТНРП о вступлении в СССР. \n\nНебольшая [TAN.GetName], официально признанная лишь [SOV.GetNameDef] и Монголией, в последние годы развивала всё более тесные административные, военные и экономические связи со своим большим братом [SOV.getAdjective]."
 news.19.d:0 "Когда германские войска у их границы приготовились к наступлению, [188.controller.GetNameDef] уступил ультиматуму [GER.GetAdjective], потребовавшему передачи старой прусской территории Мемеля.\n\nКогда-то Мемель принадлежал Восточной Пруссии и после Версальского договора стал мандатной территорией Лиги Наций, а в 1923 году был аннексирован Литвой после того, как клайпедские повстанцы захватили контроль над регионом. Объявлено, что приобретённая территория будет вновь включена в состав Восточной Пруссии. \n\nДостигли ли германские территориальные амбиции в Европе своего предела? Эксперты сомневаются..."
 news.20.t:0 "[188.controller.GetNameDefCap] отвергает германские требования"
 news.20.d:0 "\nДаже при германских войсках, выстроившихся вдоль границы, [188.controller.GetNameDef] отверг ультиматум Берлина с требованием вернуть территорию Мемеля. \n\nКогда-то Мемель принадлежал Восточной Пруссии, и [GER.GetAdjective] считают это законным основанием для своих требований. По словам [188.controller.GetLeader], необходимо было защитить целостность договора, когда правительство [188.controller.GetAdjective] объявило об отказе.\n\nТеперь международные наблюдатели ожидают, что Германия может попытаться захватить территорию силой..."
 news.22.t:0 "[ALB.getLeader] подчиняется Италии"
 news.22.d:0 "Правительству [ALB.getAdjective] несколько дней назад дипломаты [ITA.getAdjective] передали ультиматум с требованием подчиниться полной военной оккупации. \n\nСегодня утром все радиостанции [ALB.getAdjective] передавали сообщение, в котором [ALB.getLeader], осознав бесполезность сопротивления, приказал армии сложить оружие, поскольку теперь [ALB.getName] будет управляться в личной унии под властью [ITA.getLeader]. Самолёты [ITA.getAdjective] были замечены патрулирующими небо, а транспортные суда Реджиа Марина уже высаживают первых солдат [ITA.getAdjective] на землю [ALB.getAdjective]. \n\n[ITA.GetNameDefCap] обращает взор на Балканы..."
 news.22.a:0 "Ещё одна жертва амбиций [ITA.getLeader]."
 news.23.t:0 "[ALB.getLeader] проявляет непокорность"
 news.23.d:0 "Дипломаты [ITA.GetNameDef] предъявили [ALB.GetNameDef] ультиматум, потребовав включения страны в состав Великой Италии. \n\nПроявив мужество национального лидера, [ALB.getLeader] отказался уступать требованиям [ITA.getAdjective] и призвал народ [ALB.getAdjective] сопротивляться давлению со стороны [ITA.GetNameDef]. \n\nТем не менее иностранные военные эксперты сходятся во мнении, что у [ALB.GetNameDef] почти нет шансов отразить вторжение."
 news.23.c:0 "Да здравствует [ALB.getLeader]!"
 news.25.d:0 "Германия разместила 20 000 солдат вермахта в Рейнской области, недалеко от французской и бельгийской границ, что является явным нарушением Версальского и Локарнских договоров. \n\nМестное население приветствовало германских солдат, а по всей стране начались бурные празднования. На следующей неделе ожидается общегерманский референдум об одобрении ремилитаризации населением. \n\nДипломатическая реакция Франции и Британии пока остаётся сдержанной. «Это всего лишь немцы, зашедшие на собственный задний двор», — заметил один британский политический обозреватель."
 news.28.t:0 "Гиммлер принимает руководство!"
 news.28.d:0 "После смерти Адольфа Гитлера многие задавались вопросом, кто продолжит руководить страной после него. Теперь ответ получен: сегодня утром Генрих Гиммлер был приведён к присяге как новый фюрер Германского рейха. \n\nВ речи перед рейхстагом Гиммлер обвинил Британию и Францию в организации убийства Гитлера и заявил о безоговорочной решимости Германии полностью уничтожить обе страны."
 news.29.t:0 "Гёринг принимает руководство!"
 news.29.d:0 "После смерти Адольфа Гитлера многие задавались вопросом, кто продолжит руководить страной после него. Теперь ответ получен: сегодня утром Герман Гёринг был приведён к присяге как новый фюрер Германского рейха. \n\nВ речи перед рейхстагом Гёринг обвинил Британию и Францию в организации убийства Гитлера и заявил о безоговорочной решимости Германии полностью уничтожить обе страны."
 news.30.d:0 "Группа офицеров вермахта, выступавших против действующего режима, предприняла попытку переворота против Гитлера в Берлине. Неизвестная группа вооружённых людей штурмовала ключевые правительственные здания, однако бойцы СС и другие верные армейские части успешно отбили нападение.\nАгенты гестапо арестовали всех заговорщиков, среди которых оказались высокопоставленные офицеры Людвиг Бек и Вильгельм Канарис. \n\nВ речи перед рейхстагом Гитлер поклялся отомстить Франции и Британии за организацию этой «подлой попытки» покушения на его жизнь."
 news.31.d:0 "Группа офицеров вермахта, выступавших против нынешнего положения в [GER.GetNameDef], подняла в Берлине переворот против нацистов.\n\nЗаговорщикам удалось взять под контроль большую часть Берлина, и многие части вермахта перешли на их сторону. Силы, всё ещё верные нацистам, сплотились под новым руководством и поклялись очистить Германию от «коммунистических диссидентов и иностранных агентов, ныне оккупирующих Берлин»."
 news.33.t:0 "Вооружённые силы [SOV.GetAdjective] занимают Восточную Польшу"
 news.33.d:0 "Войска [SOV.GetAdjective] заняли Восточную Польшу, официально с целью защиты белорусского и украинского меньшинств от хаоса, последовавшего за крахом правительства [POL.GetAdjective]. \n\nСилы [GER.GetAdjective] организованно покинули эти районы, что фактически привело к разделу Польши между двумя державами. Многие эксперты поспешили назвать это «Четвёртым разделом Польши», выразив серьёзные сомнения в том, что независимое государство [POL.getAdjective] сохранится в ближайшем будущем. \n\nЛишь время покажет, как долго продержится этот новый мировой порядок..."
 news.37.d:0 "Лев Троцкий, некогда ближайший соратник и предполагаемый преемник Владимира Ильича Ленина, сегодня скончался в больнице Мехико. В собственном доме на него напал испанец, предположительно работавший на НКВД, и ударил ледорубом.\n\nПосле поражения в борьбе за власть с $SOV_iosif_stalin$ и его союзниками за контроль над Коммунистической партией Советского Союза Троцкий провёл тридцатые годы в изгнании, живя в Турции, Франции и Норвегии, прежде чем окончательно поселиться в Мексике. \n\nОн оставался непримиримым критиком Сталина и «выродившегося рабочего государства» Советского Союза."
 news.101.d:0 "Пока в других районах [FRA.GetNameDef] продолжаются бои, поступили сообщения о вступлении войск [ROOT.GetAdjective] в Париж. \n\nФранцузские войска объявили столицу открытым городом буквально за несколько мгновений до отхода последних частей. Несколько колонн германских войск повторили прусский парад победы 1871 года, пройдя по Елисейским Полям под ошеломлёнными взглядами парижан. \n\nВоенные эксперты считают, что крах [FRA.GetNameDef] неизбежен."
 news.101.a:0 "[ROOT.GetNameDefCap], похоже, не остановить!"
 news.103.d:0 "[195.GetCapitalVictoryPointName], родина Русской революции, пал под натиском наступающих германских войск. \n\nВ некоторых пригородах ещё слышна sporadic стрельба, но над остальной частью разрушенного города установилось странное спокойствие.\n\nСегодня ранее колонны германских солдат прошли мимо Исаакиевского собора, чей огромный купол инженеры Красной армии покрасили в серый цвет, чтобы он не привлекал внимания бомбардировщиков люфтваффе. \nНесмотря на эти усилия, он покрыт пулевыми отверстиями и следами осколков."
 news.113.d:0 "Ликующие итальянские солдаты сегодня вошли в Каир спустя несколько мгновений после отхода последних британских частей. \n\nСразу же был организован парад победы, а итальянские военнослужащие устремились к Великим пирамидам Гизы, чтобы сфотографироваться на фоне знаменитых достопримечательностей.\n\nТеперь, когда Каир находится под его контролем, [ITA.GetLeader] ещё на шаг приблизился к соединению Итальянской Восточной Африки с Итальянской Ливией и созданию непрерывной колонии в Африке."
 news.158.t:0 "[From.From.GetNamedefCap] вмешивается в войну [From.GetAdjective]"
 news.158.d:0 "Несколько дней назад [From.GetNamedef] объявил войну [From.From.From.GetNamedef]. Вскоре после этого [From.From.GetNameDef] предъявил ультиматум, заявив, что вступит в войну с [From.GetNameDef], если тот не прекратит агрессию и не подпишет мирное соглашение. [From.GetLeader] утверждает, что причины войны были справедливыми, однако решил демобилизоваться и согласиться на мир."
 news.159.t:0 "Рассвет [From.GetFactionName]"
 news.159.d_01:0 "[From.GetLeader] сегодня объявил, что [From.GetNamedef] выступил с инициативой создания нового союза. Страны, связанные [From.GetFactionName], публично заявили о намерении сотрудничать в случае войны.\n\nХотя крупные коалиции способны сдерживать агрессию, мы уже видели, к каким последствиям они приводят, когда конфликт всё же начинается. Намерения различных сторон, вступающих в этот новый союз, по-прежнему остаются спорными, а каким целям он в итоге будет служить, возможно, неизвестно даже его создателям."
 news.159.d_03:0 "Даже [From.GetNamedef], прославившийся верой в силу и превосходство своего народа и нации, не отказывается от союзов с теми, кого уважает. [From.GetLeader] сегодня объявил, что окончательные соглашения о [From.GetFactionName] достигнуты — это военная коалиция, в которой, как утверждается, есть место лишь достойным нациям, предназначенным для величия.\n\nБудет ли это величие достигнуто построением идеального общества в границах каждой страны или совместной экспансией за их пределы, мир, возможно, узнает лишь тогда, когда будет уже слишком поздно."
 news.185.t:0 "[From.GetNameDefCap] стремится заключить широкий военный пакт"
 news.185.a:0 "[From.GetNameDefCap] указывает путь!"
 news.187.a:0 "Несомненно, [GRE.GetName] разделяет наши интересы."
 news.188.t:0 "[ITA.GetNameDefCap] стремится к примирению с [TUR.GetName]"
 news.188.a:0 "Влияние [ITA.GetNameDefCap] растёт"
 news.194.t:0 "Восточная Польша передана [From.GetNameDef]"
 news.194.d:0 "\nВ результате неизвестных политических махинаций руководство [From.GetNameDef] уступило свои восточные области [From.GetName]. \n\nПока неизвестно, какие обещания или угрозы позволили [From.GetName] добиться этой политической победы. Возможно, мы никогда не узнаем, поскольку [Poland.GetLeader] пока не сказал ни слова сверх официального объявления о соглашении."
 news.194.a:0 "[From.GetNameDefCap] признаёт силу [From.GetFactionName]!"
 news.194.b:0 "[From.GetNameDefCap] поглощает всё на своём пути."
 news.194.c:0 "Вероятно, у [POL.GetNameDefCap] просто не оставалось выбора."
 news.195.t:0 "[From.GetNameDefCap] получает Восточную Германию"
 news.195.d:0 "После оккупации Германии силами [SOV.GetAdjective] государству [SOV.GetNameDef] была передана большая часть Восточной Германии, включая спорную территорию Восточной Пруссии.\nПохоже, это стало следствием секретного пункта советско-польского договора. Польша получает германские земли как компенсацию за территории, которые ей пришлось уступить [Soviet.GetName].\n\nПольша играла по-крупному: многое было потеряно, но теперь многое и приобретено."
 news.195.a:0 "[SOV.GetNameDefCap] соблюдает свои договоры."
 news.197.t:0 "[From.GetNameDefCap] уступает ультиматуму [Soviet.GetAdjective]"
 news.197.d:0 "[From.GetNameDefCap] уступил ультиматуму [Soviet.GetAdjective] и передал контроль над островами Эгейского моря [Soviet.GetNameDef].\n\nТем самым [Soviet.GetNameDef] укрепляет своё присутствие в Средиземном море и ещё сильнее утверждается как военно-морская сила региона."
 news.198.d:0 "[From.GetName] отверг требования ультиматума [SOV.GetAdjective] относительно островов Эгейского моря. По мере того как [SOV.GetNameDef] всё сильнее расширяет влияние в регионе, [From.GetLeader] заявил, что уступка хотя бы одного острова приведёт к захвату ими всего Средиземноморья.\n\nПосле отказа от ультиматума [From.GetName] оказался на грани войны и теперь может лишь ждать, когда [SOV.GetNameDef] нажмёт на спусковой крючок."
 news.199.t:0 "[bessarabia_ultimatum_victim.GetNameDefCap] уступает Бессарабию [From.GetNameDef]"
 news.199.d:0 "\n\n[bessarabia_ultimatum_victim.GetNameDef] был вынужден подчиниться ультиматуму [78.controller.GetNameDef]. Территории Бессарабии перешли под контроль [From.GetAdjective], а границы государства [bessarabia_ultimatum_victim.GetAdjective] сократились.\n\nЕщё предстоит увидеть, как [bessarabia_ultimatum_victim.GetAdjective] сможет избежать дальнейших потерь."
 news.199.c:0 "[bessarabia_ultimatum_victim.GetNameDefCap] оказался в незавидном положении."
 news.204.d:0 "Учитывая предъявленные требования, это казалось неизбежным. \n\n[From.GetNameDefCap] должен был уступить Данциг Германии, а польский полномочный представитель отправиться в Берлин для переговоров о дальнейших условиях. [From.GetLeader], указывая на недавние действия [GER.GetNameDef], заявил, что очевидно: одной передачей Данцига Германия не удовлетворится.\n\nГерманские и польские войска готовы к войне, и уже поступают сообщения о столкновениях на границе. В Европе вновь идёт война."
 news.249.d:0 "Сегодня утром политиков [USA.GetAdjective] разбудили тревожные новости: [CAN.GetNameDef] и [MEX.GetNameDef] объявили о новом оборонительном пакте, направленном на «противодействие и сдерживание непосредственных угроз дальнейшему суверенитету обеих наших стран». Плохо скрытая угроза почти не маскирует намерение препятствовать военным усилиям [USA.GetNameDef] на американском континенте и, возможно, за его пределами.\n\nПолитические обозреватели сравнивают ситуацию с Европой накануне Великой войны: две стороны, которым есть что терять, и ни одного способа снизить напряжённость. Вопрос уже не столько в том, кто кому угрожает сильнее, сколько в том, какая сторона первой нанесёт превентивный удар."
 news.254.d:0 "[AST.GetNameDefCap], заявив о полной независимости, начал распространять своё влияние в южной части Тихого океана. В рамках этой политики правительство [AST.GetAdjective] потребовало передать под его власть все бывшие колониальные владения Океании.\n\nЕстественно, находившиеся под сильным давлением правительства [ENG.GetAdjective] и Новой Зеландии сначала оказали дипломатическое сопротивление. Однако без базы, способной обеспечивать присутствие Империи в регионе — роль, которую прежде выполняла Австралия, — было лишь вопросом времени, когда [AST.GetNameDef] предъявит подкреплённый силой ультиматум.\nТеперь Новая Зеландия является самой восточной провинцией [AST.GetNameDef]."
 ace_promoted.1.d:0 "Мало кто рискует так же сильно, как отважные пилоты военно-воздушных сил [Root.GetAdjective]. [From.GetNameDefCap] [From.GetSurname], опытный пилот, известный под позывным [From.GetCallsign], отличился [From.GetHerselfHimself] тем, что не только вернулся живым с недавнего задания над [From.GetMissionRegion], но и одержал значительные победы во многих критических боях.\n\nПредставленный как яркий пример мужества [Root.GetAdjective], [From.GetName] после недавнего повышения получил широкую известность. И хотя народ видит в войне скорее ад, чем славу, многие рады тому, что у них всё ещё есть герои, вокруг которых можно сплотиться."
 ace_promoted.1.d_major:0 "Мало кто рискует так же сильно, как отважные пилоты военно-воздушных сил [Root.GetAdjective]. [From.GetNameDefCap] [From.GetSurname], опытный пилот, известный под позывным [From.GetCallsign], отличился [From.GetHerselfHimself] тем, что не только вернулся живым, но и с огромным мастерством пилотировал [From.GetHerHis] [From.GetWing]. Недавно [From.GetName] выполнял задание над [From.GetMissionRegion] и сыграл решающую роль в успехе этого важнейшего боя.\n\nПредставленный как яркий пример мужества [Root.GetAdjective], [From.GetName] после недавнего повышения получил широкую известность. И хотя народ видит в войне скорее ад, чем славу, многие рады тому, что у них всё ещё есть герои, вокруг которых можно сплотиться."
 ace_died.1.d:0 "Один из самых знаменитых представителей [From.Owner.GetNameDef] среди асов [From.GetAceType], [From.GetFullName], погиб при исполнении долга во время задания над [From.GetMissionRegion], сгорев вместе с машиной. К сожалению, поскольку [From.GetSheHe] уже давно является публичной фигурой, гибель [From.GetCallsign] сильно подрывает моральный дух множества людей, для которых [From.GetHerHim] был примером.\n\nКак бы нам ни хотелось скрыть случившееся от народа, отсутствие публичных появлений [From.GetName] вскоре вызвало бы подозрения. В конечном счёте смерть [From.GetHerHis] станет ещё одной частью легенды, которая, будем надеяться, переживёт наши нынешние беды."
 ace_died.1.d_major:0 "Один из самых знаменитых представителей [From.Owner.GetNameDef] среди асов [From.GetAceType], [From.GetFullName], погиб при исполнении долга. Вернувшиеся с задания пилоты сообщили, что видели, как [From.GetHerHis] [From.GetWingShort], получив сильный вражеский огонь над [From.GetMissionRegion], охватило пламя и машина пошла вниз. К сожалению, поскольку [From.GetSheHe] уже давно является публичной фигурой, гибель [From.GetCallsign] сильно подрывает моральный дух множества людей, для которых [From.GetHerHim] был примером.\n\nКак бы нам ни хотелось скрыть случившееся от народа, отсутствие публичных появлений [From.GetName] вскоре вызвало бы подозрения. В конечном счёте смерть [From.GetHerHis] станет ещё одной частью легенды, которая, будем надеяться, переживёт наши нынешние беды."
 election.3.d:0 "Продолжающаяся война, приближающаяся к нашим границам, омрачила предстоящие выборы: многие избиратели опасаются, что [Root.GetNameDef] не готов к втягиванию в этот конфликт или к его возможным последствиям. Они требуют усилить меры предосторожности и обеспечить готовность страны к войне. Хотя большинство всё ещё поддерживает [Root.GetRulingParty], мы можем потерять этих людей в пользу более радикальных сил, если не развеем их тревоги."
 election.4.d:1 "В [Root.GetNameDef] усилились агрессивно-националистические настроения, что привело к появлению нескольких партий, продвигающих фашистские идеалы: государство, утверждающее свою власть силой. Одна из них получила особенно заметную поддержку на нынешних выборах, и внутри партии [Root.GetRulingParty] начались обсуждения, стоит ли сотрудничать с ней при формировании правительства. Хотя они открыто отвергают демократические идеалы, лежащие в основе нашего государства, сам факт участия в выборах придаёт некоторую убедительность нашим взглядам, а признание их общественной поддержки может удержать их от насильственных действий."
 election.5.d:0 "Коммунистическое движение в [Root.GetNameDef], подпитываемое широким недовольством рабочего класса и радикальными настроениями среди интеллигенции, разрослось настолько, что возникло несколько партий. После того как одна из них получила значительную поддержку на нынешних выборах, политики из [Root.GetRulingParty] начали обсуждать, стоит ли заручиться её поддержкой при формировании правительства. Хотя коммунисты считают наши демократические институты не более чем буржуазной тиранией, похоже, они готовы добиваться желаемых перемен через сотрудничество с правительством, а не его свержение."
 election.6.d:0 "Политическая жизнь в [Root.GetNameDef] становится всё более радикализированной. Если раньше широкая поддержка доставалась партиям, отстаивающим демократические идеалы и представительные институты [Root.GetNameDef], то на этих выборах всё больше избирателей обратились к политическим крайностям. Партии центра, даже если отложат разногласия, больше не образуют большинства. Чтобы избежать слабого правительства меньшинства, нам придётся сотрудничать либо с фашистами, либо с коммунистами."
 election.6.a:0 "Мы будем сотрудничать с фашистами, чтобы укрепить [Root.GetNameDef]."
 election.8.b:0 "Этот путь ведёт к распаду самого [Root.GetNameDef]."
 election.11.a:0 "Для [Root.GetNameDef] это чёрный день, но народ сделал свой выбор."
 election.13.b:0 "Мы не можем полагаться на фашистов в деле развития и защиты [Root.GetNameDef]."
 election.14.d:0 "[Root.GetNameDefCap] находится в состоянии войны. Обычно в это время должны были бы состояться выборы, однако из-за важного продолжающегося конфликта многие утверждают, что мы не можем тратить время на политическую кампанию или возможную смену руководства. Другие же считают, что объявление войны достаточным основанием для отмены выборов — первый шаг к размыванию демократии [Root.GetAdjective]. В конце концов, если военные вопросы начнут ставиться выше влияния народа, это может оказаться опасным склоном."
 election.15.d:0 "В преддверии выборов люди начинают сомневаться в способности нынешней администрации вести продолжающуюся войну. [Root.GetNameDefCap] сильно пострадал, и общественное мнение отвернулось от тех, кто, как кажется, ведёт нашу страну к поражению. Хотя народ полон решимости довести войну до конца, он предпочёл бы, чтобы завершило её другое правительство."
 political.1.d:0 "«Пока рабочие по всему миру восстают против своих угнетателей, те, кто заявляет, будто достиг классового сознания в [Root.GetNameDef], бездействуют и ждут перемен изнутри настолько прогнившей политической системы, что спасти нас от неё может только революция!»\n\nТак говорят новые голоса в коммунистическом движении [Root.GetAdjective]. Называя власть [Root.GetRulingParty] диктатурой буржуазии, они начали призывать к её свержению любыми необходимыми средствами. Придут ли эти средства изнутри или извне, ещё предстоит увидеть."
 political.15.a:0 "Похоже, в отсутствие репрессий движение растёт естественным образом."
 britain.8.d:0 "[From.GetNameDefCap] отверг наше требование прекратить торговлю с Германией."
 germany.93.d:0 "Наше предложение о мирном решении [SLV.GetAdjective] вопроса предусматривало встречу с представителями [ENG.GetAdjective], [FRA.GetAdjective] и [ITA.GetAdjective]. И хотя [ITA.GetNameDef] в целом поддерживал идею обуздания агрессивной риторики и репрессивного правления правительства [YUG.GetAdjective], стало ясно, что державы-победительницы Великой войны не разделяют этого мнения. \n\nПриглашения, направленные в Париж и Лондон, были демонстративно отвергнуты чиновниками обеих стран, заявившими, что «целостность [YUG.GetNameDef] не будет ставиться под сомнение ни в Лиге Наций, ни в каких-либо частных переговорах — никем и никогда!». Обе страны отозвали свои делегации, ясно дав понять, что готовы к любым нашим действиям ради получения требуемой территории. \n\nВ открытом море замечены масштабные перемещения флота [ENG.GetAdjective], разведывательные самолёты [FRA.GetAdjective] нарушают воздушное пространство Рейнской области, а гарнизоны укреплений линии Мажино, похоже, усилены и готовы к тому, что выглядит как клещевой удар по нашим бункерам линии Зигфрида. \n\nВойна приближается, но остаётся ли у нас иной выбор в таких обстоятельствах?"
 germany.93.d_FRA_abandoned_yugoslavia:0 "Лондонскую конференцию можно было бы считать дипломатическим успехом, если бы не небольшая проблема, возникшая на второй день переговоров. После того как представители [FRA.GetAdjective] отказались от обязательств Малой Антанты перед [YUG.GetNameDef], делегация [ENG.GetAdjective] подняла вопрос о политике обороны Балкан. \n\nПредложенная ими новая политика Лиги Наций, похоже, предусматривает сохранение территориальной целостности Балкан под защитой [ENG.GetAdjective]. Оставленные [FRA.GetNameDef], власти [YUG.GetAdjective] с готовностью положились на недавно подписанный пакт взаимной защиты с [ENG.GetNameDef]. \n\nДипломатические проблемы легко решаются военными средствами, и мы воспользуемся своими преимуществами прежде, чем кто-либо ещё провозгласит себя «Защитником Балкан»."
 germany.94.d:0 "Блестящие дипломатические манёвры и пацифистская риторика нашей делегации убедили главных участников Лондонской конференции четырёх держав в том, что аннексия [AUS.GetNameDef] была не более чем проявлением свободной воли двух наших стран. Наша политическая программа по воссоединению с законными германскими территориями Крайны лишь укрепила это убеждение. \n\nПереговоры завершились сегодня утром тем, что [ENG.GetNameDef], [FRA.GetNameDef] и [ITA.GetNameDef] поддержали мирную интеграцию германской части Словении в [GER.GetNameDef]. \n\nПравительство [YUG.GetAdjective] во главе с [YUG.GetLeader] выступило с резким протестом, поскольку его пригласили на конференцию лишь для подписания новой резолюции. Войска [YUG.GetAdjective] уже покинули пограничные укрепления и отступили на территории [CRO.GetAdjective] своего государства. \n\nЕщё один триумф решительности и действия: Словения, которую вскоре переименуют в Крайну, возвращена в свой законный дом — [GER.GetNameDef]. Народ [SLV.GetAdjective] приветствовал наши войска, а в Любляне и Мариборе прошли торжества!"
 germany.94.a:0 "Интегрировать эти земли напрямую!"
 germany.94.b:0 "Отныне мы будем защищать Словению!"
 germany.95.t:0 "[YUG.GetNameDefCap] отказывается"
 germany.95.d:0 "Наши шпионы в [YUG.GetNameDef] сообщили, что правительственные чиновники накануне получили результаты Лондонской конференции четырёх держав вместе с нашим требованием уступить Словению. Вопрос [SLV.GetAdjective] должен был быть решён в течение 24 часов, иначе неповиновение втянуло бы обе наши страны в войну. \n\nЗа два часа до полуночи, когда истекал срок ультиматума, [YUG.GetLeader] выступил по всем радиостанциям страны с экстренным обращением, заявив, что «[YUG.GetNameDefCap] полностью осознаёт воинственные амбиции [GER.GetNameDef] и не потерпит столь агрессивного поведения руководства [GER.GetAdjective]». \n\nБыл объявлен всеобщий приказ о мобилизации, а армия [YUG.GetAdjective] получила прямое распоряжение открывать огонь по своему усмотрению. Несколько наших пограничных патрулей уже попали в засады, наблюдая за демаркационной линией между Австрией [GER.GetAdjective] и Словенией [YUG.GetAdjective]. \n\nНапряжённость растёт: авиация [YUG.GetAdjective] нарушает воздушное пространство [GER.GetAdjective], а новые части [YUG.GetAdjective] усиливают пограничные укрепления [SLV.GetAdjective]. \n\nВойна приближается, но готовы ли мы к ней?"
 germany.95.b:0 "Мы не поджигатели войны, оставим их в покое"
 germany.96.d:0 "Во время Лондонской конференции четырёх держав наши дипломаты с удовлетворением вели дружественные переговоры с делегациями [ENG.GetAdjective] и [FRA.GetAdjective], поскольку атмосфера переговоров, казалось, благоприятствовала мирному решению [SLV.GetAdjective] вопроса. \n\nОднако на третий день конференции наши дипломатические отношения с [ITA.GetNameDef] резко ухудшились: их министр иностранных дел оскорбил нашу делегацию и поставил вопрос, «остановятся ли балканские амбиции [GER.GetNameDef] в Словении или распространятся дальше на юг, угрожая территориальной целостности [ITA.GetNameDef]», после чего в зале воцарилась мёртвая тишина. \n\nНаши оскорблённые дипломаты покинули конференцию вместе с представителями [ENG.GetAdjective] и [FRA.GetAdjective], поскольку подобная провокация недопустима для любой уважающей себя страны. \n\nСледующим дипломатическим шагом [ITA.GetNameDef] и [YUG.GetNameDef] подписали договор о взаимной помощи и предъявили ультиматум, потребовав вывода наших войск из Тироля и демилитаризации Германской Австрии. \n\nТакое беспрецедентное поведение властей [ITA.GetAdjective] недопустимо любой ценой! Наш генеральный штаб уверяет, что эти назойливые [ITA.GetAdjective] в последний раз идут наперекор нашей воле."
 germany.97.d:0 "Наше вмешательство во внутренние дела [YUG.GetAdjective] встретило ожесточённое сопротивление со стороны чиновников [FRA.GetAdjective], которые ссылались на устаревшие соглашения Малой Антанты с балканскими странами как на краеугольный камень своей политики безопасности на Балканах. \n\nПредставители [ENG.GetAdjective] и [ITA.GetAdjective] уже осудили дипломатические манёвры [FRA.GetNameDef], назвав их «...имперскими амбициями, сравнимыми с амбициями Карла Великого или Наполеона». \n\nКонференция внезапно завершилась, когда стало очевидно, что власти [FRA.GetAdjective] пытаются тянуть время, чтобы их войска смогли укрепиться на линии Мажино, одновременно ведя за нашей спиной переговоры с генеральным штабом [YUG.GetAdjective] о совместном ударе по промышленным территориям Австрии [GER.GetAdjective] и нашей Рейнской области. \n\nПо всей стране объявлена всеобщая мобилизация, и все части приведены в полную готовность к надвигающейся буре, которая скоро охватит Европу. Неужели они действительно думают, что их пустые угрозы что-то для нас значат?"
 germany.98.d:1 "Мы всегда знали, что югославское государство, выкроенное из Габсбургской империи, — искусственное образование, которому не суждено было существовать долго. Тлеющая под поверхностью этническая вражда вырвалась наружу, и государство распадается. Мы должны вмешаться и исправить положение."
 germany.99.t:0 "Разделить Грецию"
 germany.99.d:0 "Поскольку наше влияние на Балканах растёт, мы можем передать Италии часть территорий, на которые она претендует в Греции, не начиная войны."
 germany.99.a:0 "Нам следует укрепить наше партнёрство"
 germany.99.b:0 "У нас другие планы на эти земли"
 germany.100.t:0 "Разделить Грецию"
 germany.101.t:0 "Разделить Грецию"
 germany.106.d_second_vienna_accepted_all:0 "После получения Венгрией Трансильвании Болгария напомнила нам о своём давнем пограничном споре с Румынией из-за Южной Добруджи, захваченной Румынией в 1913 году."
 war_justification.1.t:0 "[Root.GetLeader] выступает против [From.GetNameDef]"
 war_justification.1.d:0 "«Принадлежит ли [From.GetNameDef] народу [From.GetAdjective]? Лучше зададим другой вопрос: кому принадлежит будущее — [From.GetAdjective] или [ROOT.GetNameDef]?»\n\nСегодняшняя речь [ROOT.GetLeader] показала, что [ROOT.GetName] движется к войне. Политическая напряжённость росла весь последний месяц, и, похоже, народ [ROOT.GetAdjective] начинает принимать неизбежность войны."
 war_justification.1.a:0 "Будущее принадлежит [Root.GetNameDef]!"
 war_justification.2.a:0 "[Root.GetNameDefCap] сплочён под руководством [Root.GetLeader]."
 war_justification.4.t:0 "[Root.GetNameDefCap] готовится к великой борьбе"
 war_justification.5.t:0 "[ROOT.GetLeader] несёт революцию в [From.GetNameDefCap]"
 war_justification.5.d:0 "«Пока мы укрепили социалистическое общество в [ROOT.GetNameDefCap], многие народы всё ещё страдают под властью старых деспотов. Рабочие [From.GetNameDefCap] лишены голоса и возможности организоваться, а любые попытки установить социализм будут жестоко подавлены режимом [From.GetLeader]. Мы не можем ждать, пока колёса международной революции повернутся ради народа [From.GetAdjective]. Революцией мы доказали, что способны сокрушить капиталистических угнетателей здесь, и мы сокрушим угнетателей в [From.Capital.GetNameDefCap] тоже!»\n\n[ROOT.GetLeader] отказался от всякой дипломатической риторики в отношении контролируемого [From.GetRulingParty] государства [From.GetNameDefCap]. Задача уничтожения всех границ теперь строго сосредоточена на уничтожении их границ."
 war_justification.8.d:0 "«Есть ли общество, более отвратительное для будущего революции и более чуждое судьбе рабочего, чем фашистский режим [From.GetNameDef]? Призывая народ фанатично посвятить себя дряхлому институту национального государства, они переодели вековую жестокость в современный костюм и пытаются представить себя альтернативным будущим неизбежной международной победе рабочего класса. Лишь вопрос времени, когда они ударят по нам или нашим союзникам. Ударим первыми».\n\nНикто и не ожидал ничего, кроме взаимного презрения между нами и [From.GetAdjective], но в последнее время вражда усилилась. Теперь кажется, что конфликт вспыхнет скорее раньше, чем позже."
 war_justification.9.t:0 "Дипломатия с [From.GetNameDef] рушится"
 war_justification.9.d:0 "«Несмотря на наши попытки найти дипломатическое решение конфликта с [From.GetNameDef], переговоры вновь зашли в тупик, оставив нам мало вариантов. Авторитарный режим [From.GetLeader] продемонстрировал характерный для неподотчётных народу лидеров неразумный подход к этому вопросу. Если руководство [From.GetAdjective] полностью не изменит свою политику, у нас не останется иного выхода, кроме борьбы».\n\nВмешательство [ROOT.GetAdjective] в дела [From.GetName] стало острой темой: некоторые оппозиционные политики утверждают, что [ROOT.GetRulingParty] с самого начала проводила воинственную политику. Какими бы ни были первоначальные намерения, будущая война внезапно стала вполне реальной и неизбежной."
 war_justification.10.t:0 "[ROOT.GetLeader] призывает к интервенции в [From.GetNameDef]"
 war_justification.10.d:0 "«С тяжёлым сердцем мы должны признать реальность нашего положения: вторжение в [From.GetNameDef] может быть нашим единственным выходом. Его стратегическое значение слишком велико, чтобы в нынешней ситуации пытаться искать иное решение. Хотя мы уверены, что ни народ [ROOT.GetAdjective], ни народ [From.GetAdjective] не желают войны, история привела нас к этой точке, и наши варианты ограничены. Остаётся лишь надеяться, что, продемонстрировав военную силу, мы сможем избежать ещё большего кровопролития в будущем».\n\nХотя распространено мнение, что демократии не воюют друг с другом, последние события указывают на возможное вторжение [ROOT.GetAdjective] в [From.GetNameDef] в будущем. История ещё может нас удивить."
 war_justification.10.a:0 "[From.GetNameDef] и без того сомнительная демократия."
 war_justification.11.d:0 "«Без сомнения, коммунизм [From.GetNameDef] — одна из величайших угроз свободе и порядку в нашу эпоху. Неумолимый и беспощадный, он грозит уничтожить не только надежду народа [From.GetAdjective] на процветающее демократическое общество, но и надежды его соседей. Если мы не вмешаемся сейчас, первый костяшка домино может упасть слишком поздно, оставив за собой ещё больше провалившихся социальных экспериментов. Сколько ещё людей должно погибнуть, прежде чем мы вмешаемся?»\n\nУгроза подрывной деятельности, подтачивающей нашу демократию и подпитываемой амбициями [From.GetAdjective], в последнее время стала предметом жарких споров. Хотя представители оппозиции называют это «красной угрозой», используемой для подготовки войны с [From.GetNameDef], риторика [ROOT.GetRulingParty] пока оказывается весьма успешной."
 war_justification.12.d:0 "«В современной истории, а возможно и во всей истории, не было худшей тирании, чем железная хватка, в которой [From.GetRulingParty] держит [From.GetNameDef]. Некоторые могут говорить, что нам не следует провоцировать конфликт и что в будущем нужно доверять [From.GetLeader] соблюдать договоры и обещания, но они не понимают: договоры, заключённые при фашизме, ничего не стоят. Для этих бесчестных лжецов сила создаёт право, а бумага, на которой записано соглашение, горит так же легко, как книги их противников».\n\nТем, кто долго надеялся избежать прямого столкновения с [From.GetName], теперь решительно возражает [ROOT.GetLeader], утверждая в духе Макиавелли, что мы лишь откладываем войну к выгоде противника. При таком развитии событий первый удар, возможно, нанесём именно мы."
 war_justification.13.t:0 "[ROOT.GetLeader] призывает к войне против [From.GetNameDef]"
 war_justification.14.d:0 "«[From.GetNameDef] может считать себя современнее и развитее нас, но правда в том, что их нация не прошла тех испытаний, что выпали нам, и не готова к угрозам, которые уже ясно видны на горизонте. Своим презрением к нам и препятствованием тому, чтобы мы получили то, что принадлежит нам по праву, они сами сделали нас одной из таких угроз. Их слабая и раздробленная страна едва ли сможет противостоять нашим требованиям».\n\nПренебрежительное отношение к [From.GetNameDef], давно свойственное [ROOT.GetRulingParty], переросло из критики в открытую враждебность. Хотя считается, что народ [From.GetAdjective] хочет избежать войны, [ROOT.GetLeader] утверждает, что их избранные руководители сами спровоцировали её своей высокомерностью."
 war_justification.15.t:0 "[ROOT.GetLeader] хочет восстановить порядок в [From.GetNameDef]"
 war_justification.15.d:0 "«Национальный дух [ROOT.GetAdjective] силён, но не всем народам так повезло. [From.GetName] лишился своих традиций, а законные правители давно убиты и похоронены — всё во имя идеи великой марксистской революции. Наш долг — восстановить порядок в мире, сбитом с пути кровожадными узурпаторами, и противопоставить этой угрозе силу [ROOT.GetNameDef]».\n\nХотя [ROOT.GetRulingParty] всегда выступала против коммунизма, [From.GetNameDef] в последних речах стал объектом особенно яростных нападок. Реальна ли угроза нападения коммунистов на народ [ROOT.GetAdjective] или нет, превентивный удар по коммунизму [From.GetAdjective] уже готовится."
 war_justification.16.d:0 "«Мои противники хотят убедить вас, что моё правление подобно власти [From.GetRulingParty] в [From.GetNameDef]. Они глубоко ошибаются. Успехи [From.GetLeader] — результат недавней моды, разрушительного массового движения, стремящегося запугиванием подчинять другие страны, тогда как [ROOT.GetRulingParty] противостоит этому движению как сила, которая не покорится. Я готов сделать всё необходимое, чтобы устранить эту угрозу, даже если ради этого придётся начать войну».\n\nРежим [ROOT.GetLeader] занял враждебную позицию по отношению к нации [From.GetAdjective]. Как бы ни называли наших лидеров, слово «фашист» мы оставляем для своих врагов."
 war_justification.17.d:0 "«Кто определяет границы государства и как именно? Какими бы способами люди прежде ни оправдывали, где заканчивается [ROOT.GetNameDef] и начинается [From.GetNameDef], мы живём в новую эпоху. Стратегическое значение этой границы невозможно переоценить, и мы имеем полное право изменить её так, чтобы обеспечить долговременную безопасность нашего народа».\n\nСудя по недавним речам [ROOT.GetLeader], вторжение в [From.GetNameDef] кажется неизбежным. Несогласные голоса возражают, но общественная поддержка войны растёт."
 war_justification.18.t:0 "[ROOT.GetLeader] ставит под сомнение мотивы [From.GetNameDef]"
 war_justification.18.d:0 "«Нет сомнений, что [From.GetNameDef] готовится к войне. Изменения в экономической политике ясно показывают: [From.GetAdjective] — не мирный народ, а лишь ждёт подходящего момента, чтобы ударить по нам. Будем ли мы бездействовать и смотреть, как они вооружаются, пока [ROOT.GetName] остаётся беззащитным? Или обезоружим эту угрозу, прежде чем она перерастёт наши возможности?»\n\nЯстребы из [ROOT.GetRulingParty] обратили внимание на [From.GetName], утверждая, что нападение — лучшая защита. Их точка зрения набирает поддержку, и [ROOT.GetName] готовится к войне."
 war_justification.19.d:0 "«Те наивные граждане [ROOT.GetNameDef], которые считают [From.GetAdjective] мирным народом, совершенно оторваны от реальности. Живущие у нашей границы не могут позволить себе таких иллюзий, видя, как по ту сторону границы к нам стягиваются их войска. Эту угрозу нельзя оставить без ответа. С каждым днём [From.GetName] всё больше готовится к войне. Было бы безумием не делать того же».\n\nВоенное присутствие [From.GetAdjective] у наших границ вызывает всё большую тревогу, поскольку эта страна всё явственнее воспринимается как враг [ROOT.GetRulingParty]. Является ли это причиной или следствием их полемики — вопрос спорный."
 war_justification.20.t:0 "[ROOT.GetLeader] выступает за вторжение в [From.GetNameDef]"
 war_justification.20.d:0 "«Если мы хотим получить стратегическое преимущество в обозримой, если не сказать неизбежной, войне с [From.GetNameDef], медлить нельзя. Речь идёт о будущем наших детей и о том, чтобы [ROOT.GetName] сохранил своё место в завтрашнем мире. Это вопрос преданности нашему делу и идеалам, которые мы привыкли считать само собой разумеющимися. Пора действовать».\n\nСерия воодушевляющих речей лидеров [ROOT.GetRulingParty], прежде всего [ROOT.GetLeader], призывает общество поддержать вторжение в [From.GetName]. Геополитические мотивы вторжения в этой риторике уступают место патриотическим чувствам, однако кампания, похоже, весьма успешно убеждает общество в его необходимости."
 war_justification.201.t:0 "[From.GetLeader] выступает против [ROOT.GetNameDef]"
 war_justification.201.d:1 "«Принадлежит ли [ROOT.GetNameDef] народу [ROOT.GetAdjective]? Лучше зададим другой вопрос: кому принадлежит будущее — [ROOT.GetAdjective] или [From.GetName]?»\n\nСегодняшняя речь [From.GetLeader] показала, что [From.GetName] движется к войне. Политическая напряжённость росла весь последний месяц, и, похоже, народ [From.GetAdjective] уже принял неизбежность войны. [ROOT.GetName] тоже должен готовиться."
 war_justification.204.t:0 "[From.GetNameDefCap] готовится к великой борьбе"
 war_justification.205.t:0 "[From.GetLeader] несёт революцию в [ROOT.GetNameDef]"
 war_justification.205.d:0 "«Пока мы укрепили социалистическое общество в [From.GetNameDef], многие народы всё ещё страдают под властью старых деспотов. Рабочие [ROOT.GetNameDef] лишены голоса и возможности организоваться, а любые попытки установить социализм будут жестоко подавлены режимом [ROOT.GetLeader]. Мы не можем ждать, пока колёса международной революции повернутся ради народа [ROOT.GetAdjective]. Мы доказали, что способны сокрушить капиталистических угнетателей здесь, и сокрушим угнетателей в [ROOT.Capital.GetName] тоже!»\n\n[From.GetLeader] отказался от всех попыток дипломатии с нашим правительством. Коммунистическая задача уничтожения всех границ теперь строго сосредоточена на уничтожении наших границ."
 war_justification.208.d:0 "«Есть ли общество, более отвратительное для будущего революции и более чуждое судьбе рабочего, чем фашистский режим [ROOT.GetNameDef]? Призывая народ фанатично посвятить себя дряхлому институту национального государства, они переодели вековую жестокость в современный костюм и пытаются представить себя альтернативным будущим неизбежной международной победе рабочего класса. Лишь вопрос времени, когда они ударят по нам или нашим союзникам. Ударим первыми».\n\nНикто и не ожидал ничего, кроме взаимного презрения между нами и [ROOT.GetAdjective], но в последнее время вражда усилилась. Судя по словам [From.GetLeader], конфликт вспыхнет скорее раньше, чем позже."
 war_justification.209.t:0 "Дипломатия с [ROOT.GetNameDef] рушится"
 war_justification.209.d:0 "«Несмотря на наши попытки найти дипломатическое решение конфликта с [ROOT.GetNameDef], переговоры вновь зашли в тупик, оставив нам мало вариантов. Авторитарный режим [ROOT.GetLeader] продемонстрировал характерный для неподотчётных народу лидеров неразумный подход к этому вопросу. Если руководство [ROOT.GetAdjective] полностью не изменит свою политику, у нас не останется иного выхода, кроме борьбы».\n\nВмешательство [From.GetAdjective] в наши внутренние дела стало острой темой: некоторые оппозиционные политики утверждают, что [From.GetRulingParty] с самого начала проводила воинственную политику. Какими бы ни были их первоначальные намерения, будущая война внезапно стала вполне реальной и неизбежной."
 war_justification.210.t:0 "[From.GetLeader] призывает к интервенции в [ROOT.GetNameDef]"
 war_justification.210.d:0 "«С тяжёлым сердцем мы должны признать реальность нашего положения: вторжение в [ROOT.GetNameDef] может быть нашим единственным выходом. Его стратегическое значение слишком велико, чтобы в нынешней ситуации пытаться искать иное решение. Хотя мы уверены, что ни народ [From.GetAdjective], ни народ [ROOT.GetAdjective] не желают войны, история привела нас к этой точке, и наши варианты ограничены. Остаётся лишь надеяться, что, продемонстрировав военную силу, мы сможем избежать ещё большего кровопролития в будущем».\n\nХотя распространено мнение, что демократии не воюют друг с другом, последние события указывают на возможное вторжение [From.GetAdjective] в [ROOT.GetName] в будущем. История ещё может нас удивить."
 war_justification.210.a:0 "[From.GetNameDef] и без того сомнительная демократия, раз решается на столь агрессивные действия."
 war_justification.211.d:0 "«Без сомнения, коммунизм [ROOT.GetNameDef] — одна из величайших угроз свободе и порядку в нашу эпоху. Неумолимый и беспощадный, он грозит уничтожить не только надежду народа [ROOT.GetAdjective] на процветающее демократическое общество, но и надежды его соседей. Если мы не вмешаемся сейчас, первая костяшка домино может упасть слишком поздно, оставив за собой ещё больше провалившихся социальных экспериментов. Сколько ещё людей должно погибнуть, прежде чем мы вмешаемся?»\n\nЗарождающееся рабочее движение напугало лидеров [From.GetAdjective]. Хотя представители их оппозиции называют это «красной угрозой», используемой для подготовки войны с нами, риторика [From.GetRulingParty] пока оказывается весьма успешной."
 war_justification.212.d:0 "«В современной истории, а возможно и во всей истории, не было худшей тирании, чем железная хватка, в которой [ROOT.GetRulingParty] держит [ROOT.GetNameDef]. Некоторые могут говорить, что нам не следует провоцировать конфликт и что в будущем нужно доверять [ROOT.GetLeader] соблюдать договоры и обещания, но они не понимают: договоры, заключённые при фашизме, ничего не стоят. Для этих бесчестных лжецов сила создаёт право, а бумага, на которой записано соглашение, горит так же легко, как книги их противников».\n\nЗавидуя славному обществу, которое мы строим, и наследию, на котором оно основано, [From.GetAdjective], похоже, готовы начать войну, чтобы уничтожить его. Вот вам и их притязания на миролюбие."
 war_justification.213.t:0 "[From.GetLeader] призывает к войне против [ROOT.GetNameDef]"
 war_justification.214.d:0 "«[ROOT.GetNameDefCap] может считать себя современнее и развитее нас, но правда в том, что их нация не прошла тех испытаний, что выпали нам, и не готова к угрозам, которые уже ясно видны на горизонте. Своим презрением к нам и препятствованием тому, чтобы мы получили то, что принадлежит нам по праву, они сами сделали нас одной из таких угроз. Их слабая и раздробленная страна едва ли сможет противостоять нашим требованиям».\n\nПренебрежительное отношение к [ROOT.GetName], давно свойственное [From.GetRulingParty], переросло из критики в открытую враждебность. Хотя считается, что народ [ROOT.GetAdjective] хочет избежать войны, [From.GetLeader] утверждает, что наши избранные руководители сами спровоцировали её своей высокомерностью."
 war_justification.215.t:0 "[From.GetLeader] хочет восстановить порядок в [ROOT.GetNameDef]"
 war_justification.215.d:0 "«Национальный дух [From.GetAdjective] силён, но не всем народам так повезло. [ROOT.GetNameDefCap] лишился своих традиций, а законные правители давно убиты и похоронены — всё во имя идеи великой марксистской революции. Наш долг — восстановить порядок в мире, сбитом с пути кровожадными узурпаторами, и противопоставить этой угрозе силу [From.GetName]».\n\nХотя [From.GetRulingParty] всегда выступала против коммунизма, [ROOT.GetName] в последних речах стал объектом особенно яростных нападок. Опасаясь неизбежного перехода своей нации к следующему этапу истории, они уже готовят превентивный удар по коммунизму [ROOT.GetAdjective]."
 war_justification.216.d:0 "«Мои противники хотят убедить вас, что моё правление подобно власти [ROOT.GetRulingParty] в [ROOT.GetNameDef]. Они глубоко ошибаются. Успехи [ROOT.GetLeader] — результат недавней моды, разрушительного массового движения, стремящегося запугиванием подчинять другие страны, тогда как [From.GetRulingParty] противостоит этому движению как сила, которая не покорится. Я готов сделать всё необходимое, чтобы устранить эту угрозу, даже если ради этого придётся начать войну».\n\nРежим [From.GetLeader] занял враждебную позицию по отношению к нации [ROOT.GetAdjective]. Наши дальновидные планы будущего величия посрамили их страну, и неудивительно, что они чувствуют угрозу."
 war_justification.217.d:0 "«Кто определяет границы государства и как именно? Какими бы способами люди прежде ни оправдывали, где заканчивается [From.GetNameDef] и начинается [ROOT.GetName], мы живём в новую эпоху. Стратегическое значение этой границы невозможно переоценить, и мы имеем полное право изменить её так, чтобы обеспечить долговременную безопасность нашего народа».\n\nСудя по недавним речам [From.GetLeader], вторжение в [ROOT.GetName] кажется неизбежным. Несогласные голоса возражают, но общественная поддержка войны растёт."
 war_justification.218.t:0 "[From.GetLeader] ставит под сомнение мотивы [ROOT.GetNameDef]"
 war_justification.218.d:0 "«Нет сомнений, что [ROOT.GetNameDef] готовится к войне. Изменения в экономической политике ясно показывают: [ROOT.GetAdjective] — не мирный народ, а лишь ждёт подходящего момента, чтобы ударить по нам. Будем ли мы бездействовать и смотреть, как они вооружаются, пока [From.GetName] остаётся беззащитным? Или обезоружим эту угрозу, прежде чем она перерастёт наши возможности?»\n\nЯстребы из [From.GetRulingParty] обратили внимание на [ROOT.GetName], утверждая, что нападение — лучшая защита. Их точка зрения набирает поддержку, и [From.GetName] готовится к войне."
 war_justification.219.d:0 "«Те наивные граждане [From.GetNameDef], которые считают [ROOT.GetAdjective] мирным народом, совершенно оторваны от реальности. Живущие у нашей границы не могут позволить себе таких иллюзий, видя, как по ту сторону границы к нам стягиваются их войска. Эту угрозу нельзя оставить без ответа. С каждым днём [ROOT.GetName] всё больше готовится к войне. Было бы безумием не делать того же».\n\nНаше военное присутствие у территории [From.GetAdjective] вызвало растущую тревогу, поскольку они воспринимают перемещения наших войск как доказательство враждебных намерений. Похоже, они почти не задумываются о том, что именно их агрессивная риторика стала причиной наших оборонительных мер."
 war_justification.220.t:0 "[From.GetLeader] выступает за вторжение в [ROOT.GetNameDef]"
 war_justification.220.d:0 "«Если мы хотим получить стратегическое преимущество в обозримой, если не сказать неизбежной, войне с [ROOT.GetNameDef], медлить нельзя. Речь идёт о будущем наших детей и о том, чтобы [From.GetName] сохранил своё место в завтрашнем мире. Это вопрос преданности нашему делу и идеалам, которые мы привыкли считать само собой разумеющимися. Пора действовать».\n\nСерия воодушевляющих речей лидеров [From.GetRulingParty], прежде всего [From.GetLeader], призывает общество поддержать вторжение в [ROOT.GetName]. Геополитические мотивы вторжения в этой риторике уступают место патриотическим чувствам, однако кампания, похоже, весьма успешно убеждает общество в его необходимости."
 nuke_dropped.1.d:0 "Впервые и, будем надеяться, в последний раз в истории ядерная бомба была применена в [From.From.GetNameDef] в ходе международной войны, которую ведёт [?global.nukecountry.GetNameDef]. Беспрецедентные разрушения стали свидетельством чудовищной силы нового оружия, которого боятся не только из-за того, что оно способно сделать с целью, но и из-за последствий его применения для государства, использовавшего его, и для всего человечества.\n\nМир затаил дыхание в ожидании того, что будет дальше. Заставит ли это [From.From.Owner.GetNameDef] капитулировать, чтобы избежать новых ужасов, или лишь укрепит их решимость нанести ответный удар по тем, кто прибегает к таким средствам?"
 poland.10.t:0 "[From.GetNameDefCap] вступает в [Root.GetFactionName]!"
 poland.10.a:0 "[Root.GetNameDefCap] и [From.GetNameDef] сегодня стоят плечом к плечу как братья."
 poland.11.t:0 "[From.GetNameDefCap] отказывается вступать в [Root.GetFactionName]"
 generic.1.t:0 "[From.GetNameDefCap] влияет на нашу политику"
 country_capitulated.0.t:0 "[Root.GetNameDefCap] капитулировал"
 country_capitulated.0.d_positive_collab_diff_ideology:0 "\n[Root.GetNameDefCap] объявил о полной капитуляции перед [From.From.GetNameDef]. Силы [From.From.GetAdjective] вместе с рядом независимых [Root.GetAdjective] сторонников [From.From.GetRulingIdeology] вынудили [Root.GetLeader] и его правительство отправиться в изгнание, а для управления [Root.GetNameDef] в сотрудничестве с [From.From.GetNameDef] было создано новое правительство. [From.From.GetLeader] заявил, что это взаимное соглашение откроет для [Root.GetNameDef] новую эпоху процветания и сотрудничества.\n[Root.GetLeader] ответил, что даже в изгнании продолжит бороться за [Root.GetNameDef] и поддерживать все движения сопротивления на родине."
 country_capitulated.0.d_positive_collab_invaded_same_ideology:0 "\n[Root.GetNameDefCap] объявил о полной капитуляции перед [From.From.GetNameDef]. Ряд граждан [Root.GetAdjective], недовольных разновидностью [From.From.GetRulingIdeologyNoun], принесённой в [Root.GetNameDef] правлением [Root.GetLeader], присоединился к солдатам [From.From.GetAdjective], чтобы отстранить его от власти и сформировать новое правительство под руководством [From.From.GetNameDef]. [From.From.GetLeader] заявил, что это взаимное соглашение откроет для [From.From.GetNameDef] новую эпоху процветания и сотрудничества.\n[Root.GetLeader] ответил, что [From.From.GetLeader] — не настоящий [From.From.GetRulingIdeology] и что даже в изгнании продолжит бороться за [Root.GetNameDef] и поддерживать все движения сопротивления на родине."
 country_capitulated.0.d_negative_collab_diff_ideology:0 "\n[Root.GetNameDefCap] объявил о полной капитуляции перед [From.From.GetNameDef]. Очевидно, терпимость правительства [Root.GetAdjective] к внутренним сторонникам [From.From.GetRulingIdeology] стала одним из факторов падения [Root.GetName], поскольку [Root.GetFascistLeader] был приведён к власти, чтобы управлять страной от имени режима [From.From.GetLeader].\n[Root.GetLeader] утверждает, что это не конец суверенитета [Root.GetAdjective] и что правительство продолжит поддерживать все движения сопротивления даже в изгнании."
 generic.5.factionleader:0 "[FROM.GetFactionName]"
 generic.5.notinfaction:0 "их фракция"
 generic.5.t:0 "[From.GetNameDefCap] приглашает [Root.GetNameDef] в [r56_generic5_faction]"
 news.296.a:0 "Демократия восторжествовала!"
 news.301.t:0 "Трансильвания возвращена [155.Owner.GetName]"
 news.301.desc:0 "\nРумыния объявила, что примет требования [155.Owner.GetName] о возвращении Трансильвании. Таким образом, территория вновь объединена со страной, значительно увеличив её размеры и мощь. Маловероятно, что успех такого масштаба удержит [155.owner.GetAdjective] от новых требований вернуть остальные утраченные территории."
 news.302.t:0 "Румыния отвергает требования [155.Owner.GetNameDef]"
 news.302.desc:0 "Срок ультиматума истёк, но ответа от Румынии так и не последовало. Возмущённые представители [155.Owner.GetName] уже осудили румынское правительство, заявив, что оно «дестабилизирует регион», упорно придерживаясь «незаконных договоров». Обе страны, похоже, готовятся к войне, которая может вспыхнуть в любой день."
 news.310.t:0 "[From.GetNameDefCap] уступает Венгрии"
 news.320.e:0 "Неужели приближается война?"
 stability.38.desc:0 "«На рассвете его подвели к стене. Он отказался от последней сигареты, но согласился на повязку на глаза. Его последними словами были извинения перед матерью за то, что причинил ей столько боли. Расстрельная команда не промахнулась. Через несколько минут присутствовавший врач констатировал смерть».\n\nХотя властям не удалось поймать всех уклоняющихся от призыва, они сумели провести ряд арестов. Учитывая тяжёлое положение, в котором мы находимся, Военное министерство постановило судить этих людей по военным законам за неявку на службу. Уже вынесена первая серия смертных приговоров, и осуждённые были расстреляны. Эти меры явно возымели желаемый эффект. Похоже, большинство людей предпочли возможность погибнуть на поле боя гарантированной бесчестной смерти труса."
 strikes_event.7.desc:0 "Ночью войска собрались у городов, строго соблюдая световую и шумовую маскировку, чтобы сохранить эффект внезапности. Когда солнце поднялось над горизонтом, а рабочие на баррикадах у заводов ожидали смены дневной бригадой, штурмовые колонны двинулись вперёд. Уставшие рабочие медленно организовывали сопротивление и были быстро подавлены. Оставив небольшой отряд охранять пленных, войска прочесали город, арестовывая всех, кто значился в списках известных рабочих заводов. К полудню армия полностью контролировала города и ввела комендантский час. Дальнейшего сопротивления не ожидается. Большинство рабочих вскоре отпустят при условии возвращения к работе, а зачинщиков оставят под стражей и предадут суду. Ожидается вынесение смертных приговоров."
 strikes_event.8.desc:0 "Войска собрались у городов ночью, но плохая световая и шумовая дисциплина лишила их эффекта внезапности. Когда части пошли вперёд, рабочие уже были настороже и готовы к сопротивлению. Первая атака захлебнулась под градом камней. Вторую атаку с примкнутыми штыками отбили в жестокой рукопашной схватке, оставив на улицах десятки убитых и умирающих.\n\nКомандующие офицеры отвели силы назад для перегруппировки, тогда как рабочие расширяют укрепления и вооружаются оружием, оставленным при отступлении. Завтра ожидается второй день боёв, однако высшее военное командование больше не считает победу вероятной."
 mutiny_event.2.desc:0 "Попытки запугать мятежников и заставить их подчиниться обернулись полным провалом: солдаты почти не испугались частей, отправленных их подавлять. Используя навыки, отточенные на фронте, они быстро организовали оборону своих позиций, и любая попытка выбить их оттуда обойдётся очень дорого. \n\nОфицеры, командующие лояльными частями, отступили и ожидают дальнейших приказов, но этот небольшой успех, несомненно, укрепил решимость мятежников."
 mutiny_event.5.desc:0 "Военное министерство делает всё возможное, чтобы скрыть нынешний мятеж в армии от широкой общественности, но одной цензурой писем далеко не уйти. Солдаты, прибывающие в отпуск, быстро разносят слухи о том, что армия больше не желает бессмысленно истекать кровью в этой войне.\n\nПопытки правительства остановить распространение недовольства полностью провалились. Донесения тайной полиции показывают, что мятежники пользуются широкой поддержкой населения, поэтому изолировать и подавить их, скорее всего, не удастся."
 news.334.a:0 "Неужели [JAP.GetNameDef] не знает границ?"
 generic.19.t:0 "[From.GetNameDefCap] направляет промышленную помощь"
 usa.401.desc:0 "Премьер-министр Британии [From.GetLeader] сообщил о принятии условий соглашения «эсминцы в обмен на базы». Группа морских офицеров [From.GetAdjective] прибыла для осмотра эсминцев и контроля за их передачей.\n\n Очевидно, предстоит ещё немало работы: несколько офицеров [From.GetAdjective] выглядят несколько обеспокоенными огромным количеством и толщиной слоя гуано и ржавчины на передаваемых кораблях."
 BBA_ethiopia_industrial_financial_events.2.desc:0 "Ссылаясь на тот факт, что экономика [ROOT.GetName] и [FROM.GetName] Они настолько тесно переплетены, что большая часть промышленности [ROOT.GetName] уже контролируется [FROM.GetName], [FROM.GetLeader] Они требуют, чтобы пограничные станции между двумя странами были удалены. Контроль над всей внешней политикой должен быть поставлен под контроль. [FROM.Getname] Обеспечение максимальной защиты, координации и эффективности. По сути, это означало бы конец [ROOT.GetAdjective] Независимость.\n Все это будет сделано с учетом наилучших интересов обеих стран. [FROM.GetLeader] Это гарантирует."
 BBA_ethiopia_industrial_financial_events.4.a:0 "Это вполне можно организовать."
 BBA_ethiopia_communist_events.14.desc:0 "[ETH.GetNameDefCap] запросил нашей помощи в развитии собственных военно-воздушных сил. Их предложение предусматривает отправку добровольцев для совместной подготовки с нашими пилотами на старых самолётах из излишков. Это станет прекрасной возможностью для наших лётчиков получить дополнительный опыт и испытать наше оборудование против [ITA.GetAdjective]."
 BBA_ethiopia_communist_events.15.desc:0 "Генералы из [SOV.GetNameDef] сегодня прибыли в [ROOT.Capital.GetCapitalVictoryPointName]. Советников знакомят с нынешней структурой наших вооружённых сил и текущим положением в войне с [ITA.GetName]. Надеемся, они смогут помочь модернизировать наши силы."
 bba_news.8.desc:0 "Как, пожалуй, и следовало ожидать, [AFA.GetNameDef] принял требования [ITA.GetAdjective] о подчинении. Хотя правительство [AFA.GetAdjective] надеялось избежать оккупации, становилось всё очевиднее, что колониальные державы региона не придут ему на помощь, а соседняя [ETH.GetName] не сможет выделить военных для поддержки. При столь безнадёжном положении правительство уступило давлению [ITA.GetAdjective], чтобы уберечь население от ненужного кровопролития. \n\nСилы [ITA.GetAdjective] уже входят в небольшую страну и занимают новые позиции на границе с [ETH.GetNameDef]. Неясно, станет ли оккупация постоянной и как она повлияет на более широкий конфликт [ITA.GetAdjective] с [ETH.GetName]."
 BBA_african_union_events.6.desc:1 "[FROM.GetNameDefCap] согласился присоединиться к [ETH_GetCentralBankName] и уже начал приводить свою валюту в соответствие с нашей. Вскоре торговля между нашими странами станет намного проще."
 BBA_italy_naval_cooperation_programs.01.a:0 "Выгодная сделка!"
 ITA_losing_cores_tt:0 "Эффекты будут применяться каждый раз, когда [ROOT.GetName] теряет контроль над §Yнациональной территорией§! в пользу врага."
 ITA_losing_colonies_tt:0 "Эффекты будут применяться каждый раз, когда [ROOT.GetName] теряет контроль над §Yненациональной территорией§! в пользу врага."
 ITA_reclaiming_cores_tt:0 "Эффекты будут применяться каждый раз, когда [ROOT.GetName] возвращает контроль над §Yнациональной территорией§! у врага."
 BBA_italy_interaction_events.26.a:0 "Они понимают, что не могут с нами сравниться!"
 BBA_italy_interaction_events.40.desc:0 "Теперь, когда территориальные уступки согласованы, [ITA.GetName] начал процесс, который объединит Италию и Францию в военный союз под названием «Фронт Стрезы». Сейчас не время бездействовать: Франция должна действовать в собственных интересах и присоединиться к Италии против германской угрозы."
 BBA_italy_interaction_events.42.desc:0 "Государство [FROM.GetName] покорно приняло наше предложение о защите и склонилось перед законными властителями Средиземного моря. Сегодня над Иберией и [ITA.GetNameDef] засиял новый свет."
 bba_news.107.desc:1 "Папа Пий XI скончался после почти 20 лет руководства Католической церковью. За время своего понтификата Пий XI положил конец долгому конфликту между папством и итальянским правительством и сыграл ключевую роль в восстановлении Ватикана как независимого государства."
 bftb_turkey.134.j:0 "Исмет Инёню продолжит дело Ататюрка!"
 bftb_turkey.24.k:0 "Исмет Инёню продолжит дело Ататюрка!"
 turkey.1.b:0 "Благодаря силе маршал Чакмак поведёт республику вперёд!"
 bftb_turkey.24.l:0 "Благодаря силе маршал Чакмак поведёт республику вперёд!"
 bftb_turkey.134.k:0 "Благодаря силе маршал Чакмак поведёт республику вперёд!"
 nsb_news.301.t:0 "Объединение Северного Кавказа"
 nsb_news.301.d:0 "Следуя духу Тапы Чермоева, участники бывшей Горской республики вновь объединились под руководством [FROM.GetLeader].\nНа волне нового национального подъёма и сотрудничества между многочисленными народами Северного Кавказа правительство в изгнании первой Горской республики было включено в новое государство, провозгласившее защиту национального суверенитета при любых обстоятельствах.\nОжидается, что внешняя политика [FROM.GetNameDefCap] останется направленной против Москвы; государства и политические деятели, имеющие с ним общего врага, уже ясно выразили полную поддержку независимости Предкавказья."
 nsb_news.301.a:0 "Мы больше не разобщены!"
 nsb_news.301.b:0 "Добро пожаловать на мировую арену."
 nsb_news.302.t:0 "Закавказье снова объединяется"
 nsb_news.302.d:0 "После включения соседних территорий в законные владения [FROM.GetOldNameDef] [FROM.GetLeader] объявил о создании [FROM.GetNameDef]. Это уже третья попытка сформировать единое закавказское государство после Закавказской ДФР 1918 года и ЗСФСР 1922–1936 годов — очередная попытка преодолеть этническую раздробленность региона, погубившую прежние объединения.\nЩедрые расходы на торжественный марш по улицам [FROM.capital.GetCapitalVictoryPointName] должны были создать величественный образ политического объединения, несмотря на общее недоверие к идее Закавказья. Глава союза признал, что объединение ещё должно доказать свою ценность — возможно, через осуществление территориальных стремлений отдельных народов."
 nsb_news.302.a:0 "Наши распри заканчиваются здесь!"
 nsb_news.302.b:0 "Опять?"
 nsb_news.303.t:0 "Сибирь объединена"
 nsb_news.303.d:0 "После столетий под властью России Сибирь теперь является не просто регионом в составе чужой державы, а суверенным политическим образованием, выросшим из автономистских настроений времён Гражданской войны в России и превратившим их в совершенно отдельную многонациональную идентичность. Этого добилась армия [FROM.GetOldAdjective].\nОбещая равные права всем народам [FROM.GetAdjective] в новом [FROM.GetName], [FROM.GetLeader] гарантировал приверженность своего правительства этим принципам и готовность любой ценой бороться за права народа [FROM.GetAdjective]. Риторика из [FROM.capital.GetCapitalVictoryPointName] даёт понять, что правительство считает всю Сибирь своей законной сферой; многие обозреватели прогнозируют, что войны на этих землях будут продолжаться ещё долго."
 nsb_news.303.a:0 "Наконец-то Сибирь свободна от оков империализма!"
 nsb_news.303.b:0 "Власть России на востоке слабеет..."
 nsb_news.304.t:0 "Второе государство Идель-Урал"
 nsb_news.304.d:0 "После попытки Миллета Мяклесе объединить татар, башкиров и чувашей в Идель-Уральское государство в 1918 году было провозглашено новое государство с таким названием. [FROM.GetLeader]. Эта страна, охватывающая также национальности, не являющиеся преимущественно мусульманскими, существует как стойкий коллективный отказ от иностранного правления со стороны множества народов, составляющих ее.\n\nТот факт, что [FROM.GetNameDef] Расположение в таком изолированном положении ставит чрезвычайно тревожный вопрос о его дальнейшей жизнеспособности. Безусловно, существуют потенциальные союзники, которые могли бы помочь в обеспечении безопасности. [FROM.GetAdjective] суверенитета."
 nsb_news.304.a:0 "На этот раз оно не распадётся!"
 nsb_news.304.b:0 "Так, э-э... а где это вообще?"
 wtt_germany.641.t:0 "[GER.GetNameDefCap] реинтегрирует Эйпен-Мальмеди"
 wtt_germany.63.desc:0 "Правительство [GER.GetAdjective] приняло закон о реинтеграции Эльзаса-Лотарингии, Люксембурга и Эйпен-Мальмеди в состав [GER.GetNameDef]. Уже начался массовый призыв нашего населения."
 CHL_political_events.4.t:0 "[CHL.GetName] начинает оккупацию [1065.GetName]"
 CHL_political_events.4.desc:0 "Войска государства [CHL.GetAdjective] начали пересекать ранее установленные границы в [1065.GetName], а их авиация и флот уже мобилизованы. Похоже, они всерьёз намерены взять спорный остров под свой контроль, и неясно, сможем ли мы теперь остановить их дипломатическими средствами. Как нам следует поступить?"
 CHL_political_events.5.t:0 "[ARG.GetName] выводит войска из [1065.GetName]"
 CHL_political_events.5.desc:0 "[ARG.GetName] решил, что удерживать [1065.GetName] перед лицом нашей военной мощи не стоит потерь, и его войска уже замечены покидающими провинцию. Впервые спорная территория остаётся в наших руках, и кампанию по её интеграции можно начать немедленно."
 CHL_political_events.6.t:0 "[ARG.GetName] отказывается выводить войска из [1065.GetName]"
 CHL_political_events.52.t:0 "[CHL.GetName] требует передать нам [1061.GetName]"
 CHL_political_events.52.desc:0 "После недавней крупномасштабной мобилизации на нашей границе и недельных протестов народа [CHL.GetAdjective] [CHL.GetLeader] объявил, что [CHL.GetNameDef] давно пора вернуть контроль над территорией [1061.GetName], которую они уступили по Лимскому договору, теперь объявленному ими несправедливым, ничтожным и недействительным."
 CHL_political_events.53.desc:0 "Нынешнее правительство [FROM.GetNameDef] слабо, и мы все это знаем. Было ясно, что они не смогут оказать нам сопротивление, и теперь они сами это признали. С сегодняшнего дня подписано новое соглашение, официально передающее нам департамент [1061.GetName]!"
 CHL_political_events.54.desc:0 "Правительство [FROM.GetAdjective] упрямо цепляется за ложный Лимский договор и отказывается передать нам [1061.GetName]. Придётся продемонстрировать силу и забрать регион любыми необходимыми средствами..."
 CHL_political_events.55.t:0 "[CHL.GetName] требует уступить [1065.GetName]"
 CHL_political_events.55.desc:0 "После недавней крупномасштабной мобилизации на нашей границе и недельных протестов народа [CHL.GetAdjective] [CHL.GetLeader] объявил, что [CHL.GetNameDef] давно пора занять [1065.GetName]. Стоит ли нам пытаться им противостоять?"
 WW_hungary.8.t:0 "[HUN.GetNameDefCap] предлагает защиту в обмен на [1086.GetName]"
 WW_hungary.8.desc:0 "[HUN.GetLeader] из [HUN.GetNameDef] обратился к нам с интересным предложением. Он утверждает, что в обмен на возвращение [1086.GetName], или, как они называют этот регион, Лайтабаншаг, под контроль [HUN.GetAdjective] они готовы гарантировать нашу независимость и выступить на нашей стороне, если [GER.GetAdjective] придут за нами. Стоит ли принять это предложение?"
 WW_hungary.8.a:0 "Нам нужна любая помощь, которую мы можем получить..."
 WW_hungary.8.b:0 "И сколько именно стоит их гарантия?"
 WW_hungary.9.t:0 "[FROM.GetNameDefCap] передаёт [1086.GetName] в обмен на гарантии"
 WW_hungary.9.desc:0 "Мудрое руководство [FROM.GetNameDef] решило принять наше предложение и вскоре передаст нам контроль над регионом [1086.GetName] в обмен на гарантии независимости. Наше государство растёт, а дружба с [FROM.GetAdjective] вновь возрождается."
 WW_hungary.83.t:0 "[FROM.GetNameDefCap] предлагает купить [1086.GetName]"
 WW_hungary.83.desc:0 "Правительство [HUN.GetAdjective] по-прежнему считает [1086.GetName] неотъемлемой частью своих владений, заявляя, что во времена Империи регион принадлежал Венгрии и потому должен быть возвращён. Теперь они предложили выкупить его у нас за хорошую цену."
 WW_hungary.83.b:0 "[1086.GetName] — территория [ROOT.GetAdjective]!"
 WW_hungary.84.t:0 "[FROM.GetNameDefCap] продаёт нам [1086.GetName]"
 WW_hungary.84.desc:0 "Рассудительный [FROM.GetLeader] из [FROM.GetNameDef] согласился передать нам [1086.GetName] и получил обещанную плату. Сегодня великий день для народа [ROOT.GetAdjective]!"
 WW_hungary.85.desc:0 "Хотя это и не стало полной неожиданностью, глупец [FROM.GetLeader] из [FROM.GetNameDef] отверг нашу просьбу и направил посланника с заявлением, что в споре вокруг [1086.GetName] они не отступят ни на шаг."
 WW_hungary.86.t:0 "[FROM.GetNameDefCap] организует восстание в [1086.GetName]"
 WW_hungary.86.desc:0 "Повстанцы из военизированных организаций [FROM.GetAdjective] захватили ключевые здания в регионе [1086.GetName] и поспешно провели референдум о возвращении в состав [FROM.GetNameDef], результаты которого были очевидно сфальсифицированы в пользу присоединения. Наши войска находятся неподалёку в полной готовности и ждут приказа, следует ли вмешиваться."
 AAT_Sweden_flashpoints.33.t:0 "[GER.GetLeader] ставит под сомнение нейтралитет [SWE.GetAdjective]"
 mexico.32.desc:0 "Латиноамериканская молодёжь в экстравагантной одежде — «зут-костюмах» — стала объектом расовых беспорядков в приграничных городах на юге, вызванных сенсационными публикациями о смерти подростка в Лос-Анджелесе. Девять молодых мексикано-американцев были признаны виновными в убийстве по этому делу.\n\nРазведка собрала доклады, утверждающие, что носители зут-костюмов на самом деле являются фашистскими агентами, сотрудничающими с ультракатолическими синаркистами в Мексике ради поддержки японо-германского вторжения в Америку."
 mexico.33.desc:0 "Латиноамериканская молодёжь в экстравагантной одежде — «зут-костюмах» — стала объектом расовых беспорядков в приграничных городах к северу от нас, вызванных сенсационными публикациями о смерти подростка в Лос-Анджелесе. Девять молодых мексикано-американцев были признаны виновными в убийстве по этому делу.\n\nАмериканская разведка собрала доклады, утверждающие, что носители зут-костюмов на самом деле являются фашистскими агентами, сотрудничающими с ультракатолическими синаркистами в Мексике ради поддержки японо-германского вторжения в Америку."
 mexico.53.desc:1 "Мы долго верили, что нынешние лидеры распространяют истинное толкование идей Маркса, Энгельса и Ленина, но теперь их заставили пройти «самокритику» и публично признать, что троцкистское толкование Ленина — единственно верный путь к победе социализма. В результате мы внезапно оказались в изоляции. Наш союз распался, и перед нами стоит тяжёлая дилемма: признать правоту троцкистских взглядов или остаться в одиночестве и вступить в конфликт с [MEX.GetFactionName]."
 mexico.56.desc:0 "В высокомерном ответе, типичном для империалистических угнетателей, [From.GetNameDef] отверг наши требования ослабить свою жадную хватку на Карибах! Теперь их пролетариат должен увидеть противоречия собственного правительства и понять, что трудится на тиранов."
 mtg_usa_north_american_dominion.1.desc:1 "В рамках, по всей видимости, скоординированного дипломатического наступления по всей Северной Америке и Карибам посол [USA.GetAdjective] передал нам ноту президента [USA.GetLeader], уведомляющую, что его правительство ожидает от нас консультаций по всем будущим внешнеполитическим решениям «в интересах продолжения мира и доброй воли между нашими народами»."
 mtg_usa_pacific_pacification.1.t:1 "[USA.GetNameDefCap] требует колониальные владения"
 mtg_usa_pacific_pacification.2.t:1 "[From.GetNameDefCap] соглашается"
