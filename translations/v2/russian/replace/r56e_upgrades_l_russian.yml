 plane_transport_defense_upgrade:0 "Оборона"
 plane_transport_defense_upgrade_desc:0 "Улучшение задней оборонительной установки самолёта поможет отбиваться от возможных атакующих."
 ship_convoy_reliability:0 "Надёжность"
 ship_convoy_reliability_desc:0 "Повышенная надёжность конвойного судна помогает доставить груз к месту назначения без поломок."
 ship_convoy_surface_visibility:0 "Низкопрофильный корпус"
 ship_convoy_surface_visibility_desc:0 "Более низкий и короткий корпус конвойного судна снижает вероятность его обнаружения с большой дистанции вражескими кораблями и самолётами. Однако такая конструкция усложняет строительство."
 ship_convoy_anti_sub:0 "Противолодочный комплект"
 ship_convoy_anti_sub_desc:0 "Оснащение конвойных судов глубинными бомбами типа «Эшкэн» и гидрофонами даст конвоям шанс отбиться от подводных лодок. Однако эти меры не заменят полноценное сопровождение эсминцами."
 ship_convoy_gun:0 "Дополнительные палубные орудия"
 ship_convoy_gun_desc:0 "Простое увеличение числа зенитных и палубных орудий на конвойном судне может сыграть решающую роль как против рейдеров, так и против авиации."
 train_armor_upgrade:0 "Бортовые бронеплиты"
 train_armor_upgrade_desc:0 "Установив плоские бронеплиты вдоль бортов основного корпуса локомотива, мы обеспечим дополнительную защиту уязвимым частям поезда и его экипажу."
