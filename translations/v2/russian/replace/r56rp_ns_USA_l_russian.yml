l_russian:
 USA_population_migration_mission_0:0 "Миграция Север"
 USA_population_migration_mission_0_desc:0 "В то время как нынешние усилия по восстановлению экономики помогли многим. Были некоторые заметные недостатки. Наиболее серьезным недостатком нашей политики является ухудшение положения мелких сельских фермеров на юге, каждый из которых больше не может сводить концы с концами и вынужден выкорчевывать себя и переезжать туда, где есть работа. Которые на данный момент являются промышленными городами севера"
 USA_pass_a_new_civil_rights_bill_desc:0 "Поражение Юга в американской гражданской войне и самоощущение унижения, которое было навалено в эпоху Реконструкции, были слишком большими для класса плантаторов Юга. Они направили свое разочарование на недавнее политическое лишение власти и использовали его для сговора против вновь освобожденного афроамериканского населения. Политические интриги Юга завершились компромиссом 1877 года. Компрометированные видели формальный конец Реконструкции на Юге и видели защиту для афроамериканских сообществ и политиков на юге. Компромисс был функциональным предательством и отказом от южных афроамериканцев.\n \nС тех пор враждебные законодатели южных штатов, подталкиваемые еще более враждебным населением, приняли законы, которые маргинализируют афроамериканцев. Законы, которые отделяют афроамериканцев от остального населения Юга на основе расы в общественных местах и подавляют их право голоса. В то же время население этих штатов проводит свои собственные внесудебные кампании по запугиванию и пыткам афроамериканцев. Эти практики были названы «Джим Кроу».\n\nХотя в настоящее время у нас есть более насущные проблемы, мы не можем игнорировать тот факт, что практика Джима Кроу продолжает напрягать нашу страну. Страна, которая обещает «свободу и справедливость для всех»."
 USA_combating_jim_crow_map:0 "В этих штатах сейчас действуют законы «Джима Кроу»"
 USA_democratic_socialism_focus:0 "Демократический социализм"
 USA_democratic_socialism_focus_desc:0 "Ни один здравомыслящий человек не может отрицать, что социализм — это будущее человеческой цивилизации. В то же время ни один гордый и патриотичный гражданин этой республики не может поддерживать систему, в которой правительство больше не создается народом и народом. Как и наши гордые предки, мы создадим новую форму правления, которая объединит оба."
 USA_office_of_strategic_services_desc:0 "Создание отдельного отдела разведки для помощи зарубежным движениям сопротивления и внедрения во вражеские учреждения значительно укрепит наши позиции и поможет будущим операциям."
 USA_defense_contractors_desc:0 "Вовлечение государственных и частных производителей оружия в процесс приобретения военной техники является отличным способом обеспечить качество оружия для наших солдат по конкурентоспособным ценам."
 USA_us_war_economy_desc:0 "Гиганту больше нельзя засыпать. Наш народ готов и способен нести факел свободы за границу, и мы обеспечим его оснащение для этой задачи."
 USA_aquire_war_materiel_desc:0 "Мы должны быть готовы к любой возможной нехватке ресурсов."
 USA_military_rnd_desc:0 "Во время нашего сна мир прошел мимо нас в военной технике. Такое развитие событий недопустимо. Значительный грант будет предоставлен Массачусетскому технологическому институту для открытия нового военного ведомства."
 USA_over_there_desc:0 "Во время Великой войны мы отбили гуннов и восстановили свободу в Европе. С неурядицами на горизонте мы снова должны закалить себя против предстоящих испытаний, и, как и наши предки, мы не будем найдены в отсутствии."
 USA_gi_bill_desc:0 "Мы будем проталкивать в Конгресс щедрые гранты для наших солдат и ветеранов, многие из которых даже не могут начать пользоваться преимуществами высшего образования. Эти мужчины и женщины борются за наше будущее, справедливо только то, что мы боремся за их."
 USA_defense_contractors:0 "Оборонные подрядчики"
 USA_defense_contractors_desc:0 "Вовлечение государственных и частных производителей оружия в процесс приобретения военной техники является отличным способом обеспечить качество оружия для наших солдат по конкурентоспособным ценам."
 USA_us_war_economy:0 "Военная экономика США"
 USA_us_war_economy_desc:0 "Гиганту больше нельзя засыпать. Наш народ готов и способен нести факел свободы за границу, и мы обеспечим его оснащение для этой задачи."
 USA_aquire_war_materiel:0 "Приобрести военное имущество"
 USA_aquire_war_materiel_desc:0 "Мы должны быть готовы к любой возможной нехватке ресурсов."
 USA_military_rnd:0 "Военные исследования и разработки"
 USA_military_rnd_desc:0 "Во время нашего сна мир прошел мимо нас в военной технике. Такое развитие событий недопустимо. Значительный грант будет предоставлен Массачусетскому технологическому институту для открытия нового военного ведомства."
 USA_over_there:0 "Там, за океаном!"
 USA_over_there_desc:0 "Во время Великой войны мы отбили гуннов и восстановили свободу в Европе. С неурядицами на горизонте мы снова должны закалить себя против предстоящих испытаний, и, как и наши предки, мы не будем найдены в отсутствии."
 USA_gi_bill:0 "Солдатский билль"
 USA_gi_bill_desc:0 "Мы будем проталкивать в Конгресс щедрые гранты для наших солдат и ветеранов, многие из которых даже не могут начать пользоваться преимуществами высшего образования. Эти мужчины и женщины борются за наше будущее, справедливо только то, что мы боремся за их."
 USA_american_christian_identity:0 "Американская христианская идентичность"
 USA_american_christian_identity_desc:0 "Соединенные Штаты Америки были основаны христианами, спасающимися от угнетения. Мы должны быть готовы взять в руки оружие для нашей веры и защищать ее всем своим духом.\n Помоги нам Бог."
 USA_heirs_of_lafayette:0 "Наследники Лафайета"
 USA_heirs_of_lafayette_desc:0 "Вашингтон и Лафайет сражались бок о бок, чтобы освободить нас от рыжеволосых. В эти тревожные времена новый более сильный альянс мог бы связать нас с Парижем."
 USA_enforced_loyalty:0 "Принудительная лояльность"
 USA_enforced_loyalty_desc:0 "Включив членов Бунда или Серебряных рубашек в состав сил правопорядка, мы сможем обеспечить идеологическое единообразие при применении закона."
 r56_USA_the_alaskan_trap:0 "Аляскинская ловушка"
 r56_USA_the_alaskan_trap_desc:0 "Создав у наших восточных врагов впечатление, что Аляска является привлекательной целью для вторжения, и проведя там небольшие работы силами Инженерного корпуса армии США, мы сможем превратить её в смертельную ловушку для сил вторжения."
 r56_USA_join_the_mexican_revolutionaries:0 "Присоединиться к мексиканским революционерам"
 r56_USA_join_the_mexican_revolutionaries_desc:0 "Мексиканцы показывают нам, что революция может победить и в других частях Америки."
 USA_collaboration_with_the_mafia:0 "Коллаборационизм с мафией"
 USA_collaboration_with_the_mafia_desc:0 "Хотя мы выступаем против институтов, за которые живёт и сражается мафия, у нас, несомненно, есть общий враг. Пока что нам стоит заключить этот необычный союз и сотрудничать друг с другом."
 USA_collaboration_with_the_mafia_tt:0 "После начала гражданской войны в каждом контролируемом нами регионе, являющемся центром мафии, будет сформировано §Y5 дивизий мафии§!."
 USA_cult_of_washington:0 "Культ Вашингтона"
 USA_cult_of_washington_desc:0 "Основатель нашей страны должен быть примером для всех нас. Как сильный военный человек, обреченный на величие, он, очевидно, был первым фашистом, построившим республику для всех истинных американцев благодаря своему мастерству и своей воле."
 USA_bangalore_torpedo:0 "Бангалорская торпеда"
 USA_bangalore_torpedo_desc:0 "Основное использование торпеды — расчистка путей через проволочные препятствия и тяжелое подрастание. Он очистит путь шириной от 3 до 4 метров через проволочные препятствия."
 USA_bangalore_torpedo_tt:0 "Открывает §Hбангалорскую торпеду§!\n§HИнженерные роты\n    Бронебойная атака: §G+15%§!\n    Прорыв: §G+15%§!§!\n"
 USA_army_rangers:0 "Армейские рейнджеры"
 USA_army_rangers_desc:0 "Мы сформируем полки спецназа, способные к самостоятельным набегам глубоко за линией фронта противника, как британские коммандос."
 USA_army_rangers_tt:0 "Позволяет §HАрмейские рейнджеры§!\n§Hпехота\n    Жесткая атака: §G+25%§!\n    Прорыв: §G+25%§!§!\n§HМоториц\n    Жесткая атака: §G+25%§!\n    Прорыв: §G+25%§!§!\n§Hмеханизированный\n    Жесткая атака: §G+25%§!\n    Прорыв: §G+25%§!§!"
 USA_walkie_talkies:0 "Портативные радиостанции"
 USA_walkie_talkies_desc:0 "Снизив радиостанции до уровня легких переносных единиц, мы можем дать каждому отряду на поле возможность вызывать огневую поддержку, а также координировать действия с другими отрядами без необходимости использования тяжелой техники."
 USA_tuskegee_airmen:0 "Лётчики Таскиги"
 USA_tuskegee_airmen_desc:0 "У нас большое количество грамотных афроамериканских пилотов, мы должны их набирать для ВВС."
 USA_tank_experiments:0 "Эксперименты среднего танка"
 USA_tank_experiments_desc:0 "Америка испытывает острую нехватку в оружейном ведомстве. Требуется бронемашина, способная бороться с укреплениями противника, а также отправлять вражескую броню. Такое транспортное средство не может быть слишком тяжелым, чтобы облегчить транспортировку и перекрестные перевозки, и должно быть относительно простым в изготовлении."
 USA_tank_experiments_heavy:0 "Эксперименты с тяжёлыми танками"
 USA_tank_experiments_heavy_desc:0 "«Посредственный» автомобиль не преуспеет в каждой нише. При столкновении с более тяжелыми противниками в определенных театрах нам нужен тяжеловес. Мы покажем мощь американской мысли, создав бронированного монстра, способного справиться с любой угрозой."
 USA_enter_the_jet_age:0 "Вступить в реактивную эпоху"
 USA_enter_the_jet_age_desc:0 "Реактивный двигатель – это будущее.\nХотя у него есть свои недостатки, беспрецедентная скорость более чем компенсирует это."
 USA_90_division_gamble:0 "Ставка на 90 дивизий"
 USA_90_division_gamble_desc:0 "Для того, чтобы облегчить материально-техническое бремя, а также обеспечить максимально возможное качество войск, мы ограничим армию США 90 дивизиями."
 r56_USA_90_division_gamble_tt:0 "Этот национальный дух действует, только если у нас не более §H160 дивизий HOI4§!.\n"
 USA_victory_program:0 "Программа победы"
 USA_victory_program_desc:0 "Армия США должна быть готова противостоять тому, кто осмелится угрожать нам. Для этого необходимо выполнить квоту в 215 дивизий, насчитывающую 8,7 миллиона человек."
