 RULE_OPTION_CHINA_UNIFICATION_CHI_1912_CONCESSIONS_DESC:0 "Националистический Китай объединил все национальные территории Китая за исключением концессионных портов Гонконга, Макао и Гуанчжоуваня, а также контролируемых Японией Тайваня и Даляня, а также аннексировал заявленные территории Монголии и Танну-Тувы."
