 RULE_OPTION_CHINA_UNIFICATION_PRC_1912_DESC:0 "Коммунистический Китай объединил все национальные территории Китая, включая заявленные территории Монголии, Танну-Тувы и Аруначал-Прадеша."
 RULE_OPTION_CHINA_UNIFICATION_MAN_1912:0 "Границы 1912 года — Маньчжоу-го"
