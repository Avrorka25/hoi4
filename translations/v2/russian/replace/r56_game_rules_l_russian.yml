 SIA_AI_BEHAVIOR:0 "@SIA Сиам"
 RULE_OPTION_DEMOCRATIC_LIBERAL_SIA:0 "Демократия — либералы"
 RULE_OPTION_DEMOCRATIC_LIBERAL_SIA_AI_DESC:0 "ИИ Сиама сформирует либерально-демократическое правительство и попытается заключить союз с другой демократической страной, следуя соответствующей ветке национального дерева фокусов."
 RULE_OPTION_DEMOCRATIC_CONSERVATIVE_SIA:0 "Демократия — консерваторы"
 RULE_OPTION_DEMOCRATIC_CONSERVATIVE_SIA_AI_DESC:0 "ИИ Сиама сформирует консервативное демократическое правительство и попытается заключить союз с другой демократической страной по соответствующей ветке национального дерева фокусов."
 RULE_OPTION_COMMUNIST_SOVIET_SIA:0 "Коммунизм — советская модель"
 RULE_OPTION_COMMUNIST_SOVIET_SIA_AI_DESC:0 "ИИ Сиама установит коммунистический режим по советской модели и попытается вступить в Коминтерн по соответствующей ветке национального дерева фокусов."
 RULE_OPTION_COMMUNIST_PEASANT_SIA:0 "Коммунизм — крестьянский коммунизм"
 RULE_OPTION_COMMUNIST_PEASANT_SIA_AI_DESC:0 "ИИ Сиама установит коммунистический режим, строя социализм, рассчитанный на крестьянство, и попытается заключить союз с другими коммунистическими странами Азии."
 RULE_OPTION_FASCIST_HISTORICAL_SIA_AI_DESC:0 "ИИ Сиама укрепит Кхана Ратсадон, продолжит дрейф к фашизму и может вступить в союз с одной из держав Оси."
 RULE_OPTION_MONARCHIST_SIA_AI_DESC:0 "ИИ Сиама восстановит монархию, вернув Раму VII по соответствующей ветке национального дерева фокусов."
 RULE_OPTION_ANTI_CAPITALIST_DIPLOMACY:0 "Антикапиталистическая дипломатия"
 RULE_OPTION_ANTI_CAPITALIST_DIPLOMACY_SOV_AI_DESC:0 "Советский Союз проигнорирует фашистскую угрозу и будет подрывать капиталистические державы, одновременно проводя агрессивную экспансию в Китае и на Ближнем Востоке."
 RULE_OPTION_WORLD_REVOLUTION:0 "Троцкистская мировая революция"
 RULE_OPTION_ANTI_WORLD_REVOLUTION_SOV_AI_DESC:0 "Советский Союз попытается вернуть Троцкого и пойдёт по ветке мировой революции."
 RULE_OPTION_RETURN_OF_THE_TSAR:0 "Возвращение царя"
 RULE_OPTION_RETURN_OF_THE_TSAR_SOV_AI_DESC:0 "Романовы будут восстановлены на российском престоле."
 RULE_OPTION_RUSSIAN_FASCISM:0 "Русский фашизм"
 RULE_OPTION_RUSSIAN_FASCISM_SOV_AI_DESC:0 "Фашисты из Маньчжурии победят в борьбе за власть и возьмут страну под контроль."
 RULE_OPTION_RUSSIAN_REPUBLIC:0 "Новая республика"
 RULE_OPTION_RUSSIAN_REPUBLIC_SOV_AI_DESC:0 "Россия избавится от коммунизма и установит демократию."
 R56_SWE_AI_BEHAVIOR:0 "@SWE Швеция"
 RULE_OPTION_DEMOCRATIC_HISTORICAL_SWE_AI_DESC:0 "ИИ Швеции сосредоточится на нейтралитете и сохранит демократический курс."
 RULE_OPTION_DEMOCRATIC_AHISTORICAL:0 "Демократия: неисторический путь"
 RULE_OPTION_DEMOCRATIC_AHISTORICAL_SWE_AI_DESC:0 "Оставаясь верным принципам, которыми Швеция руководствуется с XVIII века, ИИ постарается сохранить демократический режим и при необходимости пойдёт на уступки."
 RULE_OPTION_COMMUNIST_COUP:0 "Коммунистический переворот"
 RULE_OPTION_COMMUNIST_COUP_SWE_AI_DESC:0 "Устав от нынешнего режима и королевской семьи, коммунистические силы устроят переворот и поведут Швецию в будущее под красным знаменем."
 RULE_OPTION_FASCIST_COUP:0 "Фашистский переворот"
 RULE_OPTION_FASCIST_COUP_SWE_AI_DESC:0 "ИИ Швеции отвергнет Аландскую конвенцию и перейдёт к фашизму."
 RULE_OPTION_MONARCHIST_TAKE_OVER:0 "Захват власти монархистами"
 RULE_OPTION_MONARCHIST_TAKE_OVER_SWE_AI_DESC:0 "Пока над Европой сгущаются тучи, шведская королевская семья вмешается и возьмёт власть, чтобы обеспечить безопасность страны перед надвигающейся бурей."
 TUR_AI_BEHAVIOR_R56:0 "@TUR Турция"
 RULE_OPTION_DEMOCRATIC_TUR_AI_DESC:0 "ИИ Турции будет следовать наследию Ататюрка, но на фоне растущей угрозы в Европе со временем повернёт к демократии и присоединится к Союзникам."
 RULE_OPTION_COMMUNIST_TUR_AI_DESC:0 "ИИ Турции вернёт Хюсню из изгнания, что приведёт к полноценной коммунистической революции, после которой страна либо начнёт сотрудничать с Советами, либо создаст собственную сферу влияния."
 RULE_OPTION_FASCIST_TUR_AI_DESC:0 "ИИ Турции поддержит фашистских офицеров, что приведёт к фашистской диктатуре, тесному сотрудничеству с Германией и возможному вступлению в Ось."
 RULE_OPTION_ATATURK_HISTORICAL:0 "Наследие Ататюрка — исторический путь"
 RULE_OPTION_ATATURK_HISTORICAL_TUR_AI_DESC:0 "ИИ Турции укрепит наследие Ататюрка и сосредоточится на нейтралитете, заключив несколько пактов с другими странами."
 RULE_OPTION_COMMUNIST_YUG_AI_DESC:0 "ИИ Югославии при Тито перейдёт к коммунизму и вступит в Коминтерн."
 RULE_GROUP_GAME_SETUP:0 "Настройки игры"
 RULE_GROUP_STARTING_CORES_SETUP:0 "Национальные территории освобождаемых стран"
 MINOR_RELEASABLES_STATUS:0 "Статус освобождаемых стран"
 RULE_OPTION_REMOVE_SOME_RELEASABLES_DEFAULT_DESC:0 "Национальные территории освобождаемых стран останутся без изменений."
 RULE_OPTION_REMOVE_SOME_RELEASABLES:0 "Убрать некоторые освобождаемые страны"
 RULE_OPTION_REMOVE_SOME_RELEASABLES_DESC:0 "Освобождаемые страны с ограниченной или отсутствующей националистической активностью в эту эпоху, чьи территории уже имеют другие национальные территории, будут удалены. §RСписок затронутых стран будет в некоторой степени условным, а это правило также может повлиять на другие настройки, изменяющие стартовые границы.§!"
 ENG_FRAGMENTATION_STATUS:0 "@ENG Статус фрагментации Великобритании"
 YUG_FRAGMENTATION_STATUS:0 "@YUG Статус фрагментации Югославии"
 SOV_FRAGMENTATION_STATUS:0 "@SOV Статус фрагментации Советского Союза"
 RAJ_FRAGMENTATION_STATUS:0 "@RAJ Статус фрагментации Индии"
 USA_FRAGMENTATION_STATUS:0 "@USA Статус фрагментации Соединённых Штатов"
 RULE_OPTION_YUG_FRAGMENTED_DESC:0 "В начале игры все освобождаемые составные страны Югославии становятся свободными и независимыми. Если выбрать Югославию, игра начнётся за Сербию."
 RULE_OPTION_YUG_FRAGMENTED_SERBIA:0 "Югославия фрагментирована — Сербия"
 RULE_OPTION_YUG_FRAGMENTED_SERBIA_DESC:0 "При выборе Югославии игра начнётся за Сербию."
 RULE_OPTION_YUG_FRAGMENTED_CROATIA:0 "Югославия фрагментирована — Хорватия"
 RULE_OPTION_YUG_FRAGMENTED_CROATIA_DESC:0 "При выборе Югославии игра начнётся за Хорватию."
 BEL_FRAGMENTATION_STATUS:0 "@BEL Статус фрагментации Бельгии"
 RULE_OPTION_BEL_FRAGMENTED:0 "Бельгия фрагментирована"
 RULE_OPTION_BEL_FRAGMENTED_DESC:0 "В начале игры все освобождаемые составные страны Бельгии становятся свободными и независимыми. При выборе Бельгии вы будете играть за Фландрию."
 RULE_OPTION_BEL_FRAGMENTED_GREATER_FLANDERS:0 "Великая Фландрия"
 RULE_OPTION_BEL_FRAGMENTED_GREATER_FLANDERS_DESC:0 "Разделить Бельгию между Фландрией и Валлонией; Фландрия получит регион Нор — Па-де-Кале. При выборе Бельгии вы будете играть за Фландрию."
 CZE_FRAGMENTATION_STATUS:0 "@CZE Статус фрагментации Чехословакии"
 RULE_OPTION_CZE_FRAGMENTED:0 "Чехословакия фрагментирована"
 RULE_OPTION_CZE_FRAGMENTED_DESC:0 "В начале игры все освобождаемые составные страны Чехословакии становятся свободными и независимыми."
 RULE_OPTION_CZE_DECENTRALIZED:0 "Чехословакия децентрализована"
 RULE_OPTION_CZE_DECENTRALIZED_DESC:0 "В начале игры все освобождаемые составные страны Чехословакии становятся марионетками."
 RULE_OPTION_ENG_FRAGMENTED_IRE_UNITED:0 "Объединённая Ирландия"
 RULE_OPTION_ENG_FRAGMENTED_IRE_UNITED_DESC:0 "Вместо освобождения Северной Ирландии и других стран, составляющих Великобританию, их территории будут контролироваться Эйре."
 RULE_OPTION_ENG_FRAGMENTED_CELTIC_UNION:0 "Кельтское объединение"
 RULE_OPTION_ENG_FRAGMENTED_CELTIC_UNION_DESC:0 "Все кельтские государства будут объединены под шотландским тегом. Чтобы играть за Кельтский союз, выберите §WИрландию§!."
 DEN_FRAGMENTATION_STATUS:0 "@DEN Статус фрагментации Дании"
 RULE_OPTION_DEN_FRAGMENTED:0 "Дания фрагментирована"
 RULE_OPTION_DEN_FRAGMENTED_DESC:0 "В начале игры все освобождаемые составные страны Дании становятся свободными и независимыми."
 RULE_OPTION_DEN_DECENTRALIZED:0 "Дания децентрализована"
 RULE_OPTION_DEN_DECENTRALIZED_DESC:0 "В начале игры все освобождаемые составные страны Дании становятся марионетками."
