 RULE_OPTION_MONARCHIST_HISTORICAL:0 "Монархизм — исторический путь"
 RULE_OPTION_DEMOCRATIC_ALTERNATE_AI_DESC:0 "Страна пойдёт по неисторическому демократическому пути."
 RULE_ALLOW_RELEASE_NATIONS_NOT_CSA_TOOLTIP:0 "§Y[ROOT.GetNameDefCap]§! не сможет распустить Союз и освободить эту страну."
