 RULE_OPTION_CHI_NEUTRALITY_HISTORICAL:0 "Нейтралитет — исторический путь"
 RULE_OPTION_CHI_NEUTRALITY_HISTORICAL_AI_DESC:0 "Китайская Республика создаст нестабильный союз с КНР, чтобы спасти Китай от японского империализма, а затем продолжит исторический путь по дереву фокусов."
 RULE_OPTION_CHI_NEUTRALITY_ALTERNATE:0 "Нейтралитет — Internal Security"
 RULE_OPTION_CHI_NEUTRALITY_ALTERNATE_AI_DESC:0 "Китай последует курсу Гоминьдана и сначала ударит по КНР и военным кликам, закрепляя своё господство на Центральной равнине."
 RULE_OPTION_CHI_DEMOCRATIC:0 "Наследие Сунь Ятсена"
 RULE_OPTION_CHI_DEMOCRATIC_AI_DESC:0 "Гоминьдан сделает ставку на гражданское крыло, стремясь стать первым оплотом демократии в Азии и потенциальным союзником других демократий мира."
 RULE_OPTION_CHI_FASCIST_GERMAN:0 "Приход синерубашечников к власти"
 RULE_OPTION_CHI_FASCIST_GERMAN_AI_DESC:0 "Китай последует политике движения синерубашечников, поддержит фашистское дело и Германию, начнёт возвращать территории, утраченные из-за империалистов, и противостоять распространению коммунизма в Центральной Азии."
 RULE_OPTION_CHI_FASCIST_JAPAN:0 "Великая восточноазиатская сфера сопроцветания"
 RULE_OPTION_CHI_FASCIST_JAPAN_AI_DESC:0 "Осознав угрозу стабильности Восточной Азии со стороны британского и французского империализма, Ван Цзинвэй создаст прояпонское коллаборационистское правительство, вступит в союз с Империей Восходящего Солнца и постарается очистить Азию как от военных клик, так и от европейских колонизаторов."
