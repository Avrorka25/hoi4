 RT56_AI_BEHAVIOR:0 "Поведение ИИ Road to 56"
 RULE_OPTION_DEFAULT_RT56_AI:0 "По умолчанию (рекомендуется)"
 RULE_OPTION_DEFAULT_RT56_AI_DESC:0 "Рекомендуемая настройка ИИ Road to 56. Включены скрипты и стратегии ИИ, предотвращающие сомнительные решения."
 RULE_OPTION_OLD_SCHOOL:0 "Старая школа"
 RULE_OPTION_OLD_SCHOOL_AI_DESC:0 "Скрипты и стратегии, удерживающие ИИ от сомнительных решений, отключены. ИИ будет вести себя примерно как в Road to 56 образца 2017 года, включая предательство фракций и союзников и неудачные объявления войн."
 ADR_AI_BEHAVIOR:0 "@ADR Андорра"
 RULE_OPTION_NEUTRALITY_ADR:0 "Нейтралитет §B(+)§!"
 RULE_OPTION_NEUTRALITY_ADR_AI_DESC:0 "ИИ Андорры продолжит курс на нейтралитет и будет избегать вмешательства в европейские конфликты.\n\n§B(+)§! Путь, близкий к историческому развитию Андорры."
 RULE_OPTION_NEUTRALITY_SPANISH_GUARANTEE_ADR:0 "Нейтралитет — испанские гарантии"
 RULE_OPTION_NEUTRALITY_SPANISH_GUARANTEE_ADR_AI_DESC:0 "ИИ Андорры продолжит курс на нейтралитет и постарается получить гарантии от правительства Испании."
 RULE_OPTION_FLEXIBLE_FOREIGN_POLICY_ADR:0 "Гибкая внешняя политика"
 RULE_OPTION_FLEXIBLE_FOREIGN_POLICY_ADR_AI_DESC:0 "ИИ Андорры откажется от курса на нейтралитет и сформирует новую внешнюю политику, поведя страну в ином направлении. §RУчтите: в итоге Андорра получит стандартное общее дерево фокусов и сможет стать сильнее обычного.§!"
 RULE_OPTION_FRENCH_PROTECTORATE_ADR:0 "Французский протекторат"
 RULE_OPTION_FRENCH_PROTECTORATE_ADR_AI_DESC:0 "ИИ Андорры откажется от нейтралитета и будет добиваться интеграции во Францию в качестве протектората."
 AFG_AI_BEHAVIOR:0 "@AFG Афганистан"
 RULE_OPTION_HASHIM_AFG:0 "@AFG Регентство — Хашим-хан"
 RULE_OPTION_HASHIM_AFG_AI_DESC:0 "Афганистан сохранит нейтралитет и регентство, одновременно стремясь к более тесным отношениям с Германией."
 RULE_OPTION_MAHMUD_AFG:0 "@AFG Регентство — Шах Махмуд"
 RULE_OPTION_MAHMUD_AFG_AI_DESC:0 "Афганистан начнёт переход к демократии при сохранении регентства и будет стремиться к сближению с Великобританией."
 RULE_OPTION_KINGS_PATH_AFG:0 "@AFG Правительство короля"
 RULE_OPTION_KINGS_PATH_AFG_AI_DESC:0 "Регентство будет упразднено, король Мухаммед Захир-шах возьмёт власть, а Афганистан будет стремиться к более тесным связям с Ближним Востоком."
 RULE_OPTION_PARCHAM_AFG:0 "£GFX_gamerules_AFG_parcham   Коммунизм — Парчам"
 RULE_OPTION_PARCHAM_AFG_AI_DESC:0 "Король будет свергнут движением «Вих Залмиан», а фракция «Парчам» займёт доминирующее положение среди коммунистов."
 RULE_OPTION_KHALQ_AFG:0 "£GFX_gamerules_AFG_khalq   Коммунизм — Хальк"
 RULE_OPTION_KHALQ_AFG_AI_DESC:0 "Король будет свергнут движением «Вих Залмиан», а фракция «Хальк» займёт доминирующее положение среди коммунистов."
 RULE_OPTION_GHULAM_AFG:0 "@AFG Демократия — Ватан"
 RULE_OPTION_GHULAM_AFG_AI_DESC:0 "После победы партии «Ватан» Афганистан постепенно перейдёт к демократии и будет искать сближения с западными державами."
 RULE_OPTION_MIRZALI_AFG:0 "£GFX_gamerules_AFG_mirzali   Фашизм — Золотой эмир"
 RULE_OPTION_MIRZALI_AFG_AI_DESC:0 "Король будет свергнут Лойя-джиргой, а Хаджи Мирзали-хан станет эмиром Афганистана."
 RULE_OPTION_MAUDUDI_AFG:0 "£GFX_gamerules_AFG_maududi   Фашизм — Джамаат-е Ислами"
 RULE_OPTION_MAUDUDI_AFG_AI_DESC:0 "Король будет свергнут Лойя-джиргой, а Абуль Ала Маудуди станет шейхом Афганистана."
 RULE_OPTION_DAOUD_AFG:0 "£GFX_gamerules_AFG_daoud   Авторитаризм — переворот генерала"
 RULE_OPTION_DAOUD_AFG_AI_DESC:0 "Король будет свергнут военными, Мухаммед Дауд-хан возглавит Афганистан. Страна начнёт стремиться к созданию Великого Афганистана."
 RULE_OPTION_AMANULLAH_AFG:0 "£GFX_gamerules_AFG_amanullah   Авторитаризм — изгнанный король"
 RULE_OPTION_AMANULLAH_AFG_AI_DESC:0 "Король будет свергнут военными, Аманулла-хан возглавит Афганистан. Страна будет стремиться к более тесным связям с Ближним Востоком."
 ALB_AI_BEHAVIOR:0 "@ALB Албания"
 RULE_OPTION_MONARCHIST_HISTORICAL_ALB_AI_DESC:0 "ИИ Албании поддержит короля и пойдёт к конституционной монархии по соответствующей ветке национального дерева фокусов."
 RULE_OPTION_ALB_DEMOCRATIC_AI_DESC:0 "Страна примет конституцию и со временем постарается присоединиться к демократической фракции."
 RULE_OPTION_ALB_FASCIST_AI_DESC:0 "Почувствовав перемену ветра, албанские фашисты начнут серию наступательных войн и других агрессивных действий."
 RULE_OPTION_ALB_COMMUNIST_AI_DESC:0 "Страна будет двигаться к коммунизму."
 RULE_OPTION_DEMOCRATIC_HISTORICAL_AST:0 "§GR§!§YS§! Демократия — верность §B(+)§!"
 RULE_OPTION_DEMOCRATIC_HISTORICAL_AST_AI_DESC:0 "ИИ Австралии будет придерживаться исторического курса и при возможности помогать Союзникам.\n\n§B(+)§! Путь, близкий к историческому развитию Австралии.\n\n§GR§! §GПолностью§! совместимо с выбранным деревом фокусов Road to 56.\n\n§YS§!"
 RULE_OPTION_DEMOCRATIC_ALTERNATE_AST:0 "§GR§!§YS§! Демократия — обрести свободу"
 RULE_OPTION_DEMOCRATIC_ALTERNATE_AST_AI_DESC:0 "ИИ Австралии постарается добиться полной независимости от Великобритании и стать значимой силой в своём регионе.\n\n§GR§! §GПолностью§! совместимо с выбранным деревом фокусов Road to 56.\n\n§YS§!"
 RULE_OPTION_COMMUNIST_AST:0 "§GR§!§YS§! Коммунизм"
 RULE_OPTION_COMMUNIST_AST_AI_DESC:0 "ИИ Австралии попытается привести коммунистов к власти и заключить союз с Коминтерном.\n\n§GR§! §GПолностью§! совместимо с выбранным деревом фокусов Road to 56.\n\n§YS§!"
 RULE_OPTION_FASCIST_AF_AST:0 "§GR§!§RS§! Фашизм — «Австралия прежде всего»"
 RULE_OPTION_FASCIST_AF_AST_AI_DESC:0 "ИИ Австралии позволит движению «Австралия прежде всего» прийти к власти и отделит Австралию от Великобритании.\n\n§GR§! §GПолностью§! совместимо с выбранным деревом фокусов Road to 56.\n\n§RS§! §RНесовместимо§! со стандартным деревом фокусов. Если оно выбрано, ИИ выберет случайный путь."
 RULE_OPTION_FASCIST_CTR_AST:0 "§GR§!§YS§! Фашизм — Центристская партия"
 RULE_OPTION_FASCIST_CTR_AST_AI_DESC:0 "ИИ Австралии приведёт Центристскую партию к власти и сохранит верность Великобритании (дерево Road to 56) либо добьётся независимости (стандартное дерево).\n\n§GR§! §GПолностью§! совместимо с выбранным деревом фокусов Road to 56.\n\n§YS§!"
 AUS_AI_BEHAVIOR_R56:0 "@AUS Австрия"
 RULE_OPTION_AUS_AUSTROFASCIST:0 "£GFX_gamerules_AUS_austrofascist  Австрофашистский эксперимент"
 RULE_OPTION_AUS_AUSTROFASCIST_AI_DESC:0 "Полагаясь на итальянцев, защитивших Австрию во время июльского путча, Курт Шушниг продолжит австрофашистский курс и попытается быстро разгромить сторонников нацизма, прежде чем они начнут гражданскую войну."
 RULE_OPTION_AUS_HEIMWEHR:0 "£GFX_gamerules_AUS_austrofascist  Путч Хеймвера"
 RULE_OPTION_AUS_HEIMWEHR_AI_DESC:0 "Курт Шушниг продолжит австрофашистский курс, но из-за умеренной позиции потеряет власть на фоне растущего влияния Хеймвера в Отечественном фронте, и более радикальный Эрнст Рюдигер фон Штаремберг придёт к власти."
 RULE_OPTION_AUS_LEOPOLD_NAZI:0 "£GFX_gamerules_AUS_nazi  Второй нацистский путч"
 RULE_OPTION_AUS_LEOPOLD_NAZI_AI_DESC:0 "Курт Шушниг не сумеет справиться с поддерживаемыми Германией нацистскими формированиями, что приведёт к третьей гражданской войне. В последующей борьбе за власть Йозеф Леопольд сможет сохранить независимость Австрии и укрепить своё правление."
 RULE_OPTION_AUS_INQUART_NAZI:0 "£GFX_gamerules_AUS_nazi  Удар Инкварта в спину"
 RULE_OPTION_AUS_INQUART_NAZI_AI_DESC:0 "Курт Шушниг не сумеет справиться с поддерживаемыми Германией нацистскими формированиями, что приведёт к третьей гражданской войне. В последующей борьбе за власть Артур Зейсс-Инкварт предаст сторонника независимости Йозефа Леопольда и приведёт страну в сферу нацистов."
 RULE_OPTION_AUS_DESTROY_COMPROMISE:0 "£GFX_gamerules_AUS_empire  Уничтожение компромисса"
 RULE_OPTION_AUS_DESTROY_COMPROMISE_AI_DESC:0 "В отчаянном шаге, чтобы спасти Австрию от неизбежного аншлюса, Курт Шушниг уйдет в отставку в пользу восстановления Отто фон Габсбурга, который после неудачной конференции с Венгрией отправит Австрию в путешествие, чтобы вернуть утраченную империю."
 RULE_OPTION_AUS_AUSTRIA_HUNGARY:0 "£GFX_gamerules_AUS_AUSHUN  Старые друзья не забыты"
 RULE_OPTION_AUS_AUSTRIA_HUNGARY_AI_DESC:0 "В отчаянном шаге, чтобы спасти Австрию от неизбежного аншлюса, Курт Шушниг подаст в отставку в пользу восстановления Отто фон Габсбурга, который после успешной конференции с Венгрией отправит две страны в путешествие, чтобы вернуть свою потерянную империю."
 RULE_OPTION_AUS_MODERATE_HABSBURG:0 "£GFX_gamerules_AUS_empire  Умеренная реставрация"
 RULE_OPTION_AUS_MODERATE_HABSBURG_AI_DESC:0 "Отчаянно пытаясь спасти Австрию от неизбежного аншлюса, Курт Шушниг будет искать защиты у западных союзников, предпочитая уйти в отставку в пользу умеренного восстановления Отто фон Габсбурга в качестве конституционного монарха."
 RULE_OPTION_AUS_SCHUSCHNIGG_REFORM:0 "£GFX_gamerules_AUS_austrofascist  Оттепель Шушнига"
 RULE_OPTION_AUS_SCHUSCHNIGG_REFORM_AI_DESC:0 "В отчаянной попытке спасти Австрию от неминуемого аншлюса Курт Шушниг обратится к западным союзникам за защитой и проведёт выборы, чтобы их успокоить, успешно сфальсифицировав результат незаметно для Союзников. Затем Шушниг проведёт символические реформы, пытаясь придать режиму более умеренный облик."
 RULE_OPTION_AUS_FIGL:0 "£GFX_gamerules_AUS_democratic  Реформы Леопольда Фигля"
 RULE_OPTION_AUS_FIGL_AI_DESC:0 "В отчаянной попытке спасти Австрию от неминуемого аншлюса Курт Шушниг обратится за защитой к западным союзникам и проведёт выборы, чтобы их задобрить. Он успешно сфальсифицирует результаты так, что союзники ничего не заметят. Однако реформистское крыло ХСП во главе с Леопольдом Фиглем свергнет Шушнига и наконец проведёт демократические реформы."
 RULE_OPTION_AUS_RENNER:0 "£GFX_gamerules_AUS_democratic  Правительство национального единства Реннера"
 RULE_OPTION_AUS_RENNER_AI_DESC:0 "В отчаянной попытке спасти Австрию от неминуемого аншлюса Курт Шушниг обратится за защитой к западным союзникам и проведёт выборы, чтобы их задобрить. Однако его план фальсификации выборов будет раскрыт, и СДРПА одержит убедительную победу. Карл Реннер сформирует правительство национального единства, чтобы подготовить Австрию к надвигающейся буре."
 RULE_OPTION_AUS_BAUER:0 "£GFX_gamerules_AUS_communism  Бауэр возвращается из изгнания"
 RULE_OPTION_AUS_BAUER_AI_DESC:0 "В отчаянной попытке спасти Австрию от неминуемого аншлюса Курт Шушниг обратится за защитой к западным союзникам и проведёт выборы, чтобы их задобрить. Однако его план фальсификации выборов будет раскрыт, и СДРПА одержит убедительную победу. Левое крыло Отто Бауэра выступит за пангерманское объединение, провозгласит соперничающее правительство и поставит целью объединить Германию под властью социалистов."
 ENG_AI_BEHAVIOR:0 "@ENG Великобритания"
 RULE_OPTION_VISIT_GERMANY:0 "Государственный визит в Германию"
 RULE_OPTION_VISIT_GERMANY_ENG_AI_DESC:0 "ИИ Великобритании организует государственный визит в Германию и приведёт страну к фашизму по соответствующей ветке дерева фокусов."
 RULE_OPTION_DEMOCRATIC_LITTLE_ENTENTE_FRA:0 "Демократия — Малая Антанта"
 RULE_OPTION_DEMOCRATIC_LITTLE_ENTENTE_FRA_AI_DESC:0 "ИИ Франции поддержит Блюма и создаст союз Малой Антанты по соответствующей ветке национального дерева фокусов."
 RULE_OPTION_DEMOCRATIC_HISTORICAL_FRA_AI_DESC:0 "ИИ Франции поддержит Даладье, сохранит статус-кво и присоединится к Союзникам по соответствующей ветке национального дерева фокусов."
 RULE_OPTION_COMMUNIST_HUMANITE_UNIE_FRA:0 "Коммунизм — Humanité Unie"
 RULE_OPTION_COMMUNIST_HUMANITE_UNIE_FRA_AI_DESC:0 "ИИ Франции радикализирует фронт, отвергнет власть Москвы и создаст собственный коммунистический союз по соответствующей ветке дерева фокусов."
 RULE_OPTION_COMMUNIST_COMINTERN_FRA:0 "Коммунизм — Коминтерн"
 RULE_OPTION_COMMUNIST_COMINTERN_FRA_AI_DESC:0 "ИИ Франции радикализирует фронт, сохранит верность Советам и со временем постарается вступить в Коминтерн по соответствующей ветке дерева фокусов."
 RULE_OPTION_FASCIST_FRONT_LIBERTE_FRA:0 "Фашизм — Front Liberté"
