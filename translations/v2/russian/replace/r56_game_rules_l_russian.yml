 DEN_AI_BEHAVIOR:0 "@DEN Дания"
 RULE_OPTION_DEN_SOCIAL_DEMOCRATIC:0 "Исторический путь — демократия"
 RULE_OPTION_DEN_SOCIAL_DEMOCRATIC_AI_DESC:0 "Социал-демократы сохранят власть и продолжат демократический курс."
 RULE_OPTION_DEN_REPUBLIC:0 "§GR§!§RS§!Демократия — социалисты"
 RULE_OPTION_DEN_REPUBLIC_AI_DESC:0 "Социал-демократы сформируют коалицию с коммунистами и в итоге упразднят монархию.\n\n§RS§! несовместимо с деревом DLC; если выбрать этот вариант вместе с ним, ИИ получит случайный путь."
 RULE_OPTION_DEN_CONSERVATIVE:0 "§GR§!§RS§!Демократия — консерваторы"
 RULE_OPTION_DEN_CONSERVATIVE_AI_DESC:0 "Консерваторы придут к власти и сохранят демократический курс.\n\n§RS§! несовместимо с деревом DLC; если выбрать этот вариант вместе с ним, ИИ получит случайный путь."
 RULE_OPTION_DEN_COMMUNIST:0 "§GR§!§RS§! Коммунизм"
 RULE_OPTION_DEN_COMMUNIST_AI_DESC:0 "ДКП насильственно свергнет существующий строй и установит коммунизм.\n\n§RS§! несовместимо с деревом DLC; если выбрать этот вариант вместе с ним, ИИ получит случайный путь."
 RULE_OPTION_DEMOCRATIC_GER:0 "§GR§!§YS§! демократический"
 RULE_OPTION_DEMOCRATIC_GER_AI_DESC:0 "Немецкий ИИ попытается восстановить демократический свет и стремится создать сильный оборонительный альянс по всей Европе.\n\n§GR§! это §Gполностью§! Совместимость с выбранным деревом фокусировки «Дорога к 56».\n\n§YS§! Требуется стандартное дерево фокусировки. Если требование не будет выполнено, ИИ выберет случайный путь, если все еще выбран."
 RULE_OPTION_COMMUNIST_COMINTERN_GER:0 "§GR§!§YS§! Коммунисты - союзники Советов"
 RULE_OPTION_COMMUNIST_COMINTERN_GER_AI_DESC:0 "Немецкий ИИ попытается разжечь красный огонь и перейти к коммунизму, что приведет к союзу с Советами для борьбы с фашистскими угрозами, нависшими над миром.\n\n§GR§! это §Gполностью§! Совместимость с выбранным деревом фокусировки «Дорога к 56».\n\n§YS§! Требуется стандартное дерево фокусировки. Если требование не будет выполнено, ИИ выберет случайный путь, если все еще выбран."
 RULE_OPTION_COMMUNIST_WORLD_REVOLUTION_GER:0 "§GR§!§YS§! Коммунистическая - Мировая революция"
 RULE_OPTION_COMMUNIST_WORLD_REVOLUTION_GER_AI_DESC:0 "Немецкий ИИ попытается разжечь красный огонь и перейти к коммунизму, а также создать немецкую сферу влияния, чтобы распространить революцию на всю Европу!\n\n§GR§! это §Gполностью§! Совместимость с выбранным деревом фокусировки «Дорога к 56».\n\n§YS§! Требуется стандартное дерево фокусировки. Если требование не будет выполнено, ИИ выберет случайный путь, если все еще выбран."
 RULE_OPTION_FASCIST_AGGRESSIVE_GER:0 "Фашист - агрессивное строительство §B(+)§!"
 RULE_OPTION_FASCIST_AGGRESSIVE_GER_AI_DESC:0 "Немецкий ИИ будет стремиться расширить немецкое влияние и территории в Европе, используя агрессивные методы, что в конечном итоге приведет к тотальной мировой войне.\n\n§B(+)§! Похожий путь Германия прошла исторически.\n\n§GR§! это §Gполностью§! Совместимость с выбранным деревом фокусировки «Дорога к 56».\n\n§GS§! это §Gполностью§! Совместимость с выбранным стандартным деревом фокусировки."
 RULE_OPTION_FASCIST_PASSIVE_GER:0 "§GR§!§GS§! Фашизм — пассивное усиление"
 RULE_OPTION_FASCIST_PASSIVE_GER_AI_DESC:0 "Немецкий ИИ будет использовать более пассивный и медленный подход для расширения немецкого влияния и власти в Европе. Однако это не означает, что войны можно избежать.\n\n§GR§! это §Gполностью§! Совместимость с выбранным деревом фокусировки «Дорога к 56».\n\n§GS§! это §Gполностью§! Совместимость с выбранным стандартным деревом фокусировки."
 RULE_OPTION_MONARCHIST_ALLIES_GER:0 "§YR§!§YS§! Монархист — союзник Великобритании"
 RULE_OPTION_MONARCHIST_ALLIES_GER_AI_DESC:0 "Германский ИИ попытается восстановить кайзера и вернуть немецкую империю, принять господство британского флота, а затем попытаться присоединиться к союзникам.\n\n§YR§! это §Yчастично§! Совместимость с выбранным деревом фокусировки «Дорога к 56». ИИ станет монархистом, но не сможет объединить Британию или кого-либо еще через дерево фокуса.\n\n§YS§! Требуется стандартное дерево фокусировки. Если требование не будет выполнено, ИИ выберет случайный путь, если все еще выбран."
 RULE_OPTION_MONARCHIST_CENTRAL_POWERS_GER:0 "§GR§!§YS§! Монархист - Центральные державы"
 RULE_OPTION_MONARCHIST_CENTRAL_POWERS_GER_AI_DESC:0 "Немецкий ИИ попытается восстановить Кайзера и вернуть Германскую империю, что приводит к знакомым союзам и территориальным экспансиям.\n\n§GR§! это §Gполностью§! Совместимость с выбранным деревом фокусировки «Дорога к 56».\n\n§YS§! Требуется стандартное дерево фокусировки. Если требование не будет выполнено, ИИ выберет случайный путь, если все еще выбран."
 RULE_OPTION_COMMUNIST_ALT:0 "Коммунистическая альтернатива"
 RULE_OPTION_COMMUNIST_ALT_HUN_AI_DESC:0 "Венгрия выберет коммунистический революционный совет и всё в таком духе — текст всё равно всегда примерно одинаковый. При определённых условиях лидером даже может стать Бела Кун, так что развлекайтесь."
 RULE_OPTION_FASCIST_HISTORICAL_ITA_AI_DESC:0 "ИИ Италии постарается победить в Эфиопии и продолжит постепенную военную экспансию в Европе, прежде чем в итоге заключить союз с Германией."
 RULE_OPTION_FASCIST_STRESA_FRONT:0 "Фашизм — возродить Стрезский фронт"
 RULE_OPTION_FASCIST_STRESA_FRONT_ITA_AI_DESC:0 "ИИ Италии попытается убедить Великобританию и Францию возродить Стрезский фронт в ответ на растущую агрессивность Германии и сосредоточиться на защите Европы."
 RULE_OPTION_FASCIST_ROME_PROTOCOLS:0 "Фашизм — милитаризовать Римские протоколы"
 RULE_OPTION_FASCIST_ROME_PROTOCOLS_ITA_AI_DESC:0 "ИИ Италии попытается превратить Римские протоколы с Австрией и Венгрией в военный союз. Затем последуют попытки территориальной экспансии в Европе и расширение блока латинских государств."
 RULE_OPTION_MONARCHIST_ITA_AI_DESC:0 "ИИ Италии развяжет гражданскую войну и, будем надеяться, победит в ней, передав власть Виктору Эммануилу III."
 MAN_AI_BEHAVIOR:0 "@MAN Маньчжурия"
 NOR_AI_BEHAVIOR:0 "@NOR Норвегия"
 RULE_OPTION_DEMOCRATIC_HISTORICAL_NOR_AI_DESC:0 "ИИ Норвегии сохранит демократический курс."
 RULE_OPTION_COMMUNIST_NOR_AI_DESC:0 "ИИ Норвегии отвергнет демократию и перейдёт к коммунизму."
 RULE_OPTION_FASCIST_NOR_AI_DESC:0 "ИИ Норвегии отвергнет демократию и перейдёт к фашизму."
 RULE_OPTION_MONARCHIST_NOR_AI_DESC:0 "Норвегия передаст всю полноту власти Хокону VII."
 MON_AI_BEHAVIOR:0 "@MON Монголия"
 RULE_OPTION_MON_COMMUNISM_HISTORICAL:0 "Коммунизм — исторический путь"
 RULE_OPTION_MON_COMMUNISM_HISTORICAL_AI_DESC:0 "ИИ Монголии последует сталинской доктрине и примет советскую модель государственного и партийного устройства, что приведёт к приходу Чойбалсана к власти и поздней реализации панмонгольской мечты."
 RULE_OPTION_MON_COMMUNISM_LEFTIST_TAKEOVER:0 "Коммунизм — захват власти левыми"
 RULE_OPTION_MON_COMMUNISM_LEFTIST_TAKEOVER_AI_DESC:0 "Левые элементы Монгольской народной партии попытаются захватить власть любыми средствами и продолжат процессы реорганизации государства начала 1930-х годов, что приведёт к созданию республики советского типа и экспорту коммунистической революции в Центральную равнину."
 RULE_OPTION_MON_COMMUNISM_SOCIALIST:0 "Коммунизм — социалисты"
 RULE_OPTION_MON_COMMUNISM_SOCIALIST_AI_DESC:0 "Монгольская Народная Республика поддержит осторожный и терпимый политический курс Анандына Амара, сформирует социалистическую республику и постарается остаться вне советской сферы влияния."
 RULE_OPTION_MON_DEMOCRATIC_RIGHTIST:0 "Демократия — правые"
 RULE_OPTION_MON_DEMOCRATIC_RIGHTIST_AI_DESC:0 "Следуя принципу «Сила в единстве», Монголия заложит основу коалиционного правительства и сформирует правый кабинет, который будет продвигать либерально-демократические ценности и стремиться к сближению с крупными демократиями мира."
 RULE_OPTION_MON_NEUTRALITY_GENDEN:0 "Авторитаризм — Гэндэн"
 RULE_OPTION_MON_NEUTRALITY_GENDEN_AI_DESC:0 "После первоначального дистанцирования от СССР Монголия сформирует кабинет худонцев во главе с Пэлжидийном Гэндэном, примет ряд коммунистических мер с монгольской спецификой, обратится к религиозному социализму и попытается восстановить старые связи с различными силами собственно Китая."
 RULE_OPTION_MON_ANCOM:0 "Анархо-коммунистическая Монголия"
 RULE_OPTION_MON_ANCOM_AI_DESC:0 "Устав от постоянных смен курса и правительственных интриг, народ Монголии восстанет, свергнет слабое правительство и установит анархо-коммунистическое общество, которое должно привести страну к процветанию."
 RULE_OPTION_FASCIST_R56:0 "Фашизм: Радикальный национальный блок"
 PHI_AI_BEHAVIOR:0 "@PHI Филиппины"
 RULE_OPTION_COMMUNIST_PHI_AI_DESC:0 "Повстанцы Хук захватят власть и приведут Филиппины к коммунизму."
 RULE_OPTION_FASCIST_PHI_AI_DESC:0 "Фашисты захватят власть на Филиппинах."
 RULE_OPTION_DEMOCRATIC_PHI_HISTORICAL:0 "Демократия — исторический путь"
 RULE_OPTION_DEMOCRATIC_PHI_HISTORICAL_AI_DESC:0 "Филиппины сохранят тесные отношения с США."
 RULE_OPTION_FASCIST_HISTORICAL:0 "Исторический путь — фашизм"
 RULE_OPTION_FASCIST_HISTORICAL_AI_DESC:0 "Со временем Румыния превратится в фашистский режим и присоединится к Оси."
 RULE_OPTION_DEMOCRATIC_CIVIL_WAR:0 "Демократия — гражданская война"
 RULE_OPTION_DEMOCRATIC_CIVIL_WAR_DESC:0 ""
 RULE_OPTION_COMMUNIST_CIVIL_WAR:0 "Коммунизм — гражданская война"
