 RULE_OPTION_CHINA_UNIFICATION_MAN_1912_CONCESSIONS:0 "Границы 1912 года + концессии MAN"
 RULE_OPTION_CHINA_UNIFICATION_MAN_1912_CONCESSIONS_DESC:0 "Маньчжоу-го объединил все национальные территории Китая за исключением концессионных портов Гонконга, Макао и Гуанчжоуваня, а также контролируемых Японией Тайваня и Даляня, а также аннексировал заявленные территории Монголии, Танну-Тувы и Аруначал-Прадеша с заранее завершёнными соответствующими фокусами."
