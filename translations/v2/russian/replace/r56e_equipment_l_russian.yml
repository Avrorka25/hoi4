 light_carrier_1:0 "Эскортный авианосец"
 light_carrier_2:0 "Лёгкий авианосец I"
 light_carrier_3:0 "Лёгкий авианосец II"
 light_carrier_1_desc:0 "Эскортные авианосцы малы, медленны и уязвимы, зато дёшевы в производстве. Они предназначены прежде всего для сопровождения конвоев и противолодочной обороны."
 light_carrier_2_desc:0 "Лёгкие авианосцы крупнее и эффективнее эскортных; они могут обеспечивать небольшие самостоятельные операции и поддерживать полноценные авианосцы."
 light_carrier_3_desc:0 "Значительное совершенствование существующих проектов лёгких авианосцев. Более дешёвая альтернатива полноценному флотскому авианосцу."
 cvl_tech:0 "Модели лёгких авианосцев"
 light_carrier:0 "Лёгкий авианосец"
 light_carrier_desc:0 "Менее мощный, но доступный вариант авианосца, созданный прежде всего для защиты конвоев и сопровождения более ценных боевых кораблей."
