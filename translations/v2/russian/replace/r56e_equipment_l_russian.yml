 coastal_defense_ship:0 "Корабль береговой обороны"
 coastal_defense_ship_desc:0 "Тип «Сверье» состоял из трёх кораблей береговой обороны, построенных для шведского флота до Первой мировой войны. По размерам (водоизмещение свыше 6800 тонн) и вооружению (четыре 283-мм/44 орудия K/45 M12) эти корабли больше напоминали тяжёлые крейсеры. Для крейсеров они были сравнительно медленными, зато обладали очень мощной бронёй. Все три корабля служили во время Второй мировой войны."
 coastal_defense_ship_1:0 "Тип «Сверье»"
 coastal_defense_ship_1_desc:0 "Тип «Сверье» состоял из трёх кораблей береговой обороны, построенных для шведского флота до Первой мировой войны. По размерам (водоизмещение свыше 6800 тонн) и вооружению (четыре 283-мм/44 орудия K/45 M12) эти корабли больше напоминали тяжёлые крейсеры. Для крейсеров они были сравнительно медленными, зато обладали очень мощной бронёй. Все три корабля служили во время Второй мировой войны."
