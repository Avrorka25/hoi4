l_russian:
 anarcho_capitalism:0 "Западный анархо-капитализм"
 anarcho_capitalism_desc:0 "§YАнархо-капитализм§! отвергает саму идею §Rцентрализованного государства§!, отдавая предпочтение §Gсамопринадлежности, частной собственности и свободному рынку§!."
 anarcho_capitalism_n:0 "Анархо-капитализм"
 anarcho_capitalism_n_desc:0 "§YАнархо-капитализм§! отвергает саму идею §Rцентрализованного государства§!, отдавая предпочтение §Gсамопринадлежности, частной собственности и свободному рынку§!."
 corporatism:0 "Корпоративизм"
 corporatism_desc:0 "Корпоративизм объединяет рабочих и работодателей в отраслевые и профессиональные корпорации, представляющие их интересы на государственном уровне. В системе существует базовая демократия, однако между населением и руководством страны лежит несколько уровней иерархии."
 centrism_democratic:0 "Демократический центризм"
 centrism_democratic_desc:0 "§YЦентризм§! — форма правления, стремящаяся находить §Yразумные решения§!, соответствующие нынешним и будущим потребностям, поддерживать §Hобщественное доверие§! и служить §Hобщему благу§! с учётом рисков и возможностей."
 absolute_monarchism:0 "Абсолютный монархизм"
 absolute_monarchism_desc:0 "§LС самого зарождения человеческой цивилизации большинство обществ имело чёткую иерархию, на вершине которой стояли монархи и аристократия. Однако с глобальным распространением либерализма, социализма и фашизма эпоха §Yабсолютного монархизма§!, похоже, подходит к концу.\n\nАбсолютный монархизм — одна из древнейших форм правления и пережиток старого мирового порядка. Современный монархизм не является строго определённой идеологией, но большинство сохранившихся абсолютных монархий устроено так, что значительная часть решений принимается советниками, §0лично назначенными королём§!, за которым сохраняется право вето на любое решение в стране.§!\n"
 constitutional_monarchy:0 "Полуконституционный монархизм"
 constitutional_monarchy_desc:0 "§LПо мере краха старого порядка абсолютных монархий некоторые монархи понимали, что не смогут вечно удерживать всю полноту власти. Пытаясь смягчить свой образ в глазах народа, они проводили ограниченные реформы, превращая старые режимы в §Yполуконституционный монархизм§!.\n\nКак и абсолютный монархизм, полуконституционный монархизм различается от страны к стране. Где-то реформы лишь §0поддерживают видимость демократии§!, а где-то действительно §3существенно ограничивают власть монарха§!.§!\n"
 clerical_fascism:0 "Клерикальный фашизм"
 clerical_fascism_desc:0 "§YКлерикальный фашизм§! объединяет идеи §Gнационализма§! и §Gмилитаризма§! с §Gклерикальной§! доктриной господствующей религии. Духовенство помогает укреплять поддержку правительства населением и играет вспомогательную либо ведущую роль в управлении."
 ultranationalism:0 "Ультранационализм"
 ultranationalism_desc:0 "§YУльтранационализм§! — широкая идеология, обычно определяемая режимом, продвигающим §gфанатичный национализм§! и тоталитарную политику посредством военного правления."
 oligarchic_democracy:0 "Олигархическая демократия"
 oligarchic_democracy_desc:0 "§YОлигархическая демократия§! сохраняет §Gверховенство закона§!, но управляется группой людей, установившей подавляющий контроль над институтами страны. Хотя правящие §Rолигархи§! всё ещё частично подотчётны этим институтам, система рискует превратиться в §Rавторитарную олигархию§!."
 monarchical_theocracy:0 "Теократическая монархия"
 monarchical_theocracy_desc:0 "§YТеократическая монархия§! — форма правления, при которой монарх обладает §Yвластью§! над §Gисполнительными функциями§!, а §Yдуховенство§! господствующей религии имеет значительную либо §Rабсолютную§! власть над законами, обычаями, внутренними делами и §Yсудебными функциями§!."
 islamic_democracy:0 "Исламская демократия"
 islamic_democracy_desc:0 "Отвергая радикализм и секуляризм, сторонники §Yисламской демократии§! выступают за государство, руководствующееся учениями §YКорана, хадисов и пророка Мухаммеда§!, а также мнением местных имамов, устазов и улемов, при §Yдемократически избираемом руководстве§! и §Yособом внимании к гражданским правам§!."
 islamism:0 "Радикальный исламизм"
 islamism_desc:0 "§YРадикальный исламизм§! выступает за возрождение §Gхалифата§! и нередко насильственно трактует §GКоран§! и §Gхадисы§! в соответствии с экспансионистской программой."
 pashtun_nationalism:0 "Пуштунский национализм"
 pashtun_nationalism_desc:0 "§YПуштунский национализм§! — §3правая§! идеология, сформированная Мохаммадом Дауд-ханом. Она утверждает, что все пуштуны должны жить в едином пуштунском государстве — Великом Афганистане. §YНационально-демократическая партия Афганистана§! объединяет широкий спектр сторонников этой идеи."
 moderate_islamism:0 "Умеренный исламизм"
 moderate_islamism_desc:0 "§YУмеренный исламизм§! предполагает участие §Gислама в общественной и политической жизни страны§!. Отвергая либеральный и светский подход, сторонники §Yисламизма§! выступают за §Gзамену обычного вестернизированного законодательства шариатом§! и уделяют большое внимание §Gрелигиозному образованию и богословию§!."
 islamic_nationalism:0 "Исламский национализм"
 islamic_nationalism_desc:0 "§YИсламский национализм§! основывается на гордости за свою религию и её последователей и подчёркивает §Yмилитаризацию§! общества. От §Yсветского национализма§! он отличается тем, что объединяет людей вокруг религии и благочестия, а не самой нации."
 islamic_socialism:0 "Исламский социализм"
 islamic_socialism_desc:0 "§YИсламский социализм§! — политическая философия, включающая §Rисламские принципы в социализм§!. Его сторонники считают, что учения Корана и Мухаммеда, особенно закят, совместимы с принципами социализма и поддерживают их."
 military_junta:0 "Военная хунта"
 military_junta_desc:0 "Военная хунта часто возникает после того, как вооружённые силы страны получают абсолютную власть, обычно насильственным путём. Для таких правительств характерно отсутствие чётких законов и произвольное подавление инакомыслящих военными."
 arab_communism:0 "Арабский коммунизм"
 arab_communism_desc:0 "§LХотя Великое арабское восстание против Османской империи стало началом панарабского национализма, это был лишь первый шаг. После предательства Хашимитов западными союзниками в Севре поддержка арабских монархий начала падать, а на смену ей пришёл §Yарабский социализм§!.\n\nСочетая национализм и социализм, арабский социализм утверждает, что §Rсоциализм§! и §Oнационализм§! могут быть примирены на §Rантиколониальной§! основе.§!\n"
 arab_socialism:0 "Арабский социализм"
 arab_socialism_desc:0 "§LХотя Великое арабское восстание против Османской империи стало началом панарабского национализма, это был лишь первый шаг. После предательства Хашимитов западными союзниками в Севре поддержка арабских монархий начала падать, а на смену ей пришёл §Yарабский социализм§!.\n\nСочетая национализм и социализм, арабский социализм утверждает, что §Rсоциализм§! и §Oнационализм§! могут быть примирены на §Rантиколониальной§! основе.§!\n"
 marhaenism:0 "Мархаэнизм"
 marhaenism_desc:0 "В начале 20-го века произошли многочисленные изменения в политической жизни Ост-Индии, когда Этише Политик создал новый класс индонезийских интеллигентов под названием Boemipoetras, а также усилия по поиску новой национальной идентичности, чтобы отличить себя от голландцев и предыдущих региональных националистов. Многие из них уже присутствовали, такие как исламизм и даже марксизм, но они были либо слишком радикальными в своей борьбе, которая отчуждает боемипоэтры, или слишком расплывчатыми по своей предпосылке.\n\nВ 1926 году молодой выпускник архитектора по имени Соекарно сформулировал свою собственную политическую теорию, которая синтезирует три основных идеологических потока светских «боэмипоэтр». §OНационализм§!, §GИслам§!и §Yмарксизм§! Все это оказало влияние на Сёкарно с юности, объединившись в единую идеологию индонезийцев, называемую §YМархаенство§!«Индонезийский социализм на практике»."
 imperialist_corporatism:0 "Империалистический корпоративизм"
 imperialist_corporatism_desc:0 "Истоки §Yкорпоративизма§! восходят к Средневековью и цеховой системе, объединявшей рабочих и ремесленников в ассоциации, регулирующие производство, условия труда и заработную плату. Эти гильдии служили посредниками между государством и человеком.\n\n§YИмпериалистический корпоративизм§!, являясь формой экономического империализма, прежде всего движим §Oстремлением к прибыли§!, §tэкономической эксплуатацией§! и §Rгосподством на рынке§!. Большое значение также придаётся §8защите корпоративных интересов§! средствами государства."
 juche:0 "Чучхе"
 juche_desc:0 "Первоначально вариация марксистско-ленинизма. §YЧутье.§! Это ультранационалистическая ветвь коммунизма, стремящаяся к §Yистинно социалистическое общество§! Полная экономическая и военная независимость."
 conservatism_n:0 "Национальный консерватизм"
 conservatism_n_desc:0 "§LКонсерватизм сформировался как реакция на революционные потрясения и новый либеральный порядок, постепенно оформившись в идеологию §Yконсерватизма§!.\n\nКак §9реакционная§! идеология, он обычно выступает за §3сохранение традиционных институтов§!, таких как §2организованная религия§!, §2национальное государство§! и §2традиционная семья§!.\n\n§YНациональный консерватизм§! разделяет большинство ценностей основного консерватизма, но также продвигает §8национализм§! и отличается большей милитаристской направленностью.§!\n"
 democratic_socialism:0 "Демократический социализм"
 democratic_socialism_desc:0 "§LПоскольку радикальная политика марксизма выпала из рук многих европейских социалистов, некоторые ведущие социалистические деятели, такие как Моисей Гесс и Эдуард Бернштейн, оторвались от агрессивной революционной позиции Маркса, консолидировав свой взгляд на социализм в новую идеологию, которую они назвали. §YДемократический социализм§!.\n\nВ отличие от марксизма, сторонники демократического социализма считали, что §Rсоциалистическая система§! может быть достигнута путем §3постепенная реформа§! О больных европейских монархиях. В их глазах, любая по своей сути революционная идеология не могла продолжаться, только подпитывая дальнейшую революцию, и как таковое, истинное равенство могло выжить только через функциональную демократическую систему.§!\n"
 general_zionism:0 "Общий сионизм"
 general_zionism_desc:0 "Общий сионизм, преемник политического сионизма Теодора Герцля, представляет собой широкую социал-либеральную ветвь сионизма. Он выступает за сильный средний класс и капиталистическую экономику при сохранении значительной системы социальной защиты."
 labour_zionism:0 "Лейбористский сионизм"
 labour_zionism_desc:0 "Вопреки политическому сионизму, основанному Теодором Герцлем, §YЛейбористский сионизм§! Он считает, что независимое еврейское государство не может быть сформировано без усилий еврейского рабочего класса, направляющего алию на землю Израиля. Он выступает за создание §RСоциалистическое еврейское общество§! с сельскими Кибуцимом и Мошавимом и городским Пролетариатом."
 revisionist_zionism:0 "Ревизионистский сионизм"
 revisionist_zionism_desc:0 "Разработан Зеевом Жаботинским, §Yревизионистский сионизм§! Образовалось как §3Правый пересмотр§! лейбористский сионизм Давида Бен-Гуриона. Ревизионистский сионизм отличается от лейбористского сионизма меньшей готовностью идти на компромисс с британским правлением в мандате. Она считает, что истинная Земля Израиля находится на обоих берегах реки Иордан и отвергает любой компромисс раздела земли."
 soviet_labour_zionism:0 "Советский трудовой сионизм"
 soviet_labour_zionism_desc:0 "Отличаясь от лейбористского сионизма Давида Бен-Гуриона, §YСоветский трудовой сионизм§! Такие учреждения, как здравоохранение и образование, должны §Rостается под контролем профсоюза работников§! Вместо того, чтобы быть национализированным. Он также имеет гораздо больше §Rпросоветский§! Позиция, полагая, что Советский Союз является лучшим союзником для сионистского государства, чем Запад."
 colonial_government:0 "Колониальное правительство"
 colonial_government_desc:0 "§YКолониальное правительство§! обычно не имеет чёткой идеологии, а его политика зависит от колонизатора: от стремления §9контролировать ценные местные ресурсы§! до желания §9держать местное сопротивление под контролем§!. Для такого режима характерно назначение иностранного военного офицера для управления регионом."
 syndicalism:0 "Синдикализм"
 syndicalism_desc:0 "Популяризовавшись французскими профсоюзами после Великой войны, §YСиндикализм§! Левая идеология, которая стремится к §RПрофсоюзы через забастовки§! с конечной целью получения контроля над средствами производства и экономикой в целом."
 national_bolshevism:0 "Национал-большевизм"
 national_bolshevism_desc:0 "Сочетая фашизм и коммунизм, §Yнационал-большевизм§! является маргинальной радикальной идеологией, выступающей за §Rкоммунистическую экономику§! в сочетании с §Oфанатичным национализмом§!."
 agrarian_socialism:0 "Аграрный социализм"
 agrarian_socialism_desc:0 "§LКогда идеи Маркса и Энгельса достигли аграрных стран, ещё не затронутых промышленной революцией, местное крестьянство адаптировало социалистические идеи к обществу, где большинство населения занималось сельским хозяйством. Так возник §Yаграрный социализм§!.\n\nОн выступает за §Rколлективизацию средств производства§!, подчёркивает §2сельский образ жизни и децентрализацию§! и часто сочетается с §8националистическими принципами§!, становясь основой для §Rкрестьянских восстаний§!.§!\n"
 anarchism:0 "Анархизм"
 anarchism_desc:0 "§YАнархизм§! отвергает сам принцип власти, предлагая вместо единого централизованного государства общество самоуправляемых и саморегулирующихся коллективов."
 neutrality:0 "авторитарный"
 neutrality_noun:0 "Ауторитарианисм"
 neutrality_desc:0 "Ауторитариан Региме"
 despotism:0 "Гражданская диктатура"
 despotism_desc:0 "§LКогда старый монархический порядок Европы уступил место республиканизму, автократия не исчезла: в некоторых странах прежние режимы были заменены §Yгражданскими диктатурами§!.\n\nОбычно такой диктатор опирается не на прямое применение армии, а на §gполномочия, предоставленные конституцией§!.§!"
 oligarchism:0 "Олигархизм"
 oligarchism_desc:0 "§LКто контролирует продовольствие, тот контролирует людей, и §Yолигархизм§! существует ещё со времён первых цивилизаций.\n\nОн не является строго определённой идеологией, но обычно характеризуется тем, что §gгруппа влиятельных фигур управляет государством с почти диктаторскими полномочиями§!.§!\n"
 conservatism:0 "Демократический консерватизм"
 conservatism_desc:0 "§LКонсерватизм сформировался как реакция на революционные потрясения и новый либеральный порядок, оформившись в идеологию §Yконсерватизма§!.\n\nКак §9реакционная§! идеология, он обычно выступает за §3сохранение традиционных институтов§!, таких как §2организованная религия§!, §2национальное государство§! и §2традиционная семья§!.§!\n"
 liberalism:0 "Либерализм"
 liberalism_desc:0 "§LЛиберализм возник из эпохи Просвещения и революций, оформившись в новую идеологию §Yлиберализма§!.\n\nОн утверждает, что задача государства — §3защищать свободы населения§!, а каждый человек обладает §Yестественными правами§! на §3жизнь§!, §3свободу§! и §3благополучие§!.§!\n"
 socialism:0 "Социал-демократия"
 socialism_desc:0 "§LПоскольку радикальная политика марксизма выпала из рук многих европейских социалистов, некоторые ведущие социалистические деятели, такие как Моисей Гесс и Эдуард Бернштейн, оторвались от агрессивной революционной позиции Маркса, консолидировав свой взгляд на социализм в новую идеологию, которую они назвали. §YСоциальная демократия§!.\n\nВ отличие от марксизма, сторонники социал-демократии считали, что §Rсоциалистическая система§! может быть достигнута путем §3постепенная реформа§! О больных европейских монархиях. В их глазах, любая по своей сути революционная идеология не могла продолжаться, только подпитывая дальнейшую революцию, и как таковое, истинное равенство могло выжить только через функциональную демократическую систему.§!\n"
 marxism:0 "Марксизм"
 marxism_desc:0 "§LВо время Весны народов Карл Маркс опубликовал «Манифест Коммунистической партии», изложив основы §Yмарксизма§!.\n\nМарксизм рассматривает историю через призму §Rклассовой борьбы§! и выступает за §Rреволюционное преобразование общества§! в систему §Rобщественной собственности на средства производства§!.§!\n"
 leninism:0 "Ленинизм"
 leninism_desc:0 "§LПосле революционных потрясений в России большевики Владимира Ленина установили однопартийную систему, оформив §Yленинизм§!.\n\nЛенинизм выступает за то, чтобы §Rреволюционным государством§! управляла §Rавангардная партия§!, устанавливающая §Rдиктатуру пролетариата§!.§!\n"
 stalinism:0 "Сталинизм"
 stalinism_desc:0 "§LПосле смерти Ленина Иосиф Сталин укрепил власть, сформировав систему, позднее названную §Yсталинизмом§!.\n\nСталинизм выступает за насильственное §8очищение общества от угроз государству§! посредством массовых арестов и показательных процессов, а также за §Rускоренную индустриализацию§! и §Rвоинствующий атеизм§!.§!\n"
 anti_revisionism:0 "Антиревизионизм"
 anti_revisionism_desc:0 "Возникший как реакция на многочисленные идеологии-преемники марксизма, §Yантиревизионизм§! выступает за сохранение ключевых положений исходной революционной теории и особенно против включения капиталистических элементов в социалистические государства."
 anarchist_communism:0 "Анархо-коммунизм"
 anarchist_communism_desc:0 "Идеология, принимающая идею коммунизма как §Rбезгосударственного общества§!, §Yанархо-коммунизм§! отвергает переходное социалистическое государство и предпочитает общество, основанное на §Yдобровольных объединениях§! и §Rвзаимопомощи§!."
 nazism:0 "Национал-социализм"
 nazism_desc:0 "§LПосле поражения Германии в Великой войне Адольф Гитлер превратил реваншистский национализм в §Yнационал-социализм§!.\n\nЭта идеология основана на §8крайнем национализме§! и §8расовом превосходстве§!, продвигает §8агрессивный экспансионизм§!, §8пангерманизм§! и §Rтоталитарное государство§! во главе с абсолютным лидером — §Wфюрером§!.§!\n"
 gen_nazism:0 "Национал-социализм"
 gen_nazism_desc:0 "§LОснованный на §8крайнем национализме§!, национал-социализм движим идеями §8расового превосходства§!. Он продвигает §8агрессивный экспансионизм§!, §8пангерманизм§! и §Rтоталитарное государство§!, в котором народ объединён под властью лидера с абсолютными полномочиями.§!\n"
 fascism_ideology:0 "Фашизм"
 fascism_ideology_desc:0 "§LКогда оружие замолчало на итальянском фронте Великой войны, многие националисты обвинили западных союзников в том, что они нанесли Италии удар в спину, поскольку страна не получила много территорий, за которые она боролась. Это привело бы к тому, что бывший социалист по имени Бенито Муссолини поднялся на видное место, выступая за новую ультраправую идеологию, которую он назвал. §YФашизм§!\n\nКак идеология, фашизм отвергает глобализацию мира, вместо этого рассматривая империализм и войну как средство для достижения цели. §8национальное омоложение§!. В результате этого крайнего поощрения §8авторитаризм и национализм§!Многие расколы фашизма также способствуют дискриминации и насилию в отношении определенных этнических групп, которые считаются «другими».§!\n"
 falangism:0 "Фалангизм"
 falangism_desc:0 "Авторитарная идеология с чертами фашизма и консерватизма, §Yфалангизм§! придаёт большое значение национальной и §Rкатолической идентичности§!."
 rexism:0 "Рексизм"
 rexism_desc:0 "Резко выступая против либеральных и коммунистических идей, §Yрексизм§! является §Yконсервативно-националистическим§! движением, поддерживающим §Gкорпоративистскую§! экономику и всё более авторитарную риторику."
 moderatism:1 "Национальный либерализм"
 moderatism_desc:1 "§LПо мере того, как Просвещение приобретало все большую популярность на Западе, таким образом заканчивались старые нормы наследственных привилегий, государственной религии и божественных монархов. Выходя из хаоса Американской и Французской революций, новая идеология §YЛиберализм§! Она распространилась по всей Европе, так как старые монархии были свергнуты одна за другой.\n\nПолагая, что целью государства было не служить продолжением монарха, а скорее §3Защита свобод населения§!Либерализм бросит вызов старому консервативному и авторитарному порядку в мире, установив, что каждый человек имеет право на существование. §Yестественные права§! то §3жизнь§!, §3свобода§!и §3процветание§!.\n\n§YНациональный либерализм§!, расширение либеральной идеологии, разделяет большинство ее ценностей с господствующим либерализмом, однако это также продвигает §8национализм§! Он более милитаристский, чем его коллега.§!\n"
 centrism:1 "Центризм"
 centrism_desc:1 "§YЦентризм§! — форма правления, стремящаяся находить §Yразумные решения§!, соответствующие текущим и будущим потребностям, поддерживать §Hобщественное доверие§! и служить §Hобщему благу§! с учётом рисков и возможностей."
 controlled_democracy:0 "Управляемая демократия"
 controlled_democracy_desc:0 "§LКогда революции свергли старый монархический порядок, молодые демократии оказались нестабильными, и влиятельные группы смогли постепенно закрепить авторитарные полномочия, создавая §Yуправляемые демократии§!.\n\nВ такой системе правящая партия обладает §gзначительным влиянием на СМИ§! и §gограничивает свободу слова§!, а выборы не способны существенно изменить правительство.§!\n"
 social_nationalism:0 "Социальный национализм"
 social_nationalism_desc:0 "§LПо мере того как республиканские революции 19-го века свергали старые монархии один за другим, некоторые национальные движения начали интегрировать работы Маркса и других социалистов в свою идеологию. Однако отказ Маркса от этнического национализма был бы исключен из этой новой идеологии, которая позже будет называться «национализмом». §YСоциальный национализм§!.\n\nСоединение многих левых и правых идеологий, социал-национализм поддерживает идею создания нового общества. §RСоциалистическая экономическая система§! и а §Oсильное обнажение национальной идентичности§!.§!"
 the_peoples_tutelage:0 "Народная опека"
 the_peoples_tutelage_desc:0 "§L§OНационализм§!, §3демократия§!, §Rнародное благосостояние§! — Три народных принципа Сунь Ятсена. Но молодая Китайская Республика ещё не могла перейти к полной демократии, поэтому наступал период §Yнародной опеки§!.\n\nПо плану Сунь Ятсена Гоминьдан должен был временно управлять Китаем как §gоднопартийным государством§!, подготавливая страну к демократии. После его смерти и прихода Чан Кайши Белый террор против оппозиции превратил эту систему в коррумпированную автократию.§!"
