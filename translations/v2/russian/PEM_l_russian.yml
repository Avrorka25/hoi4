l_russian:
 r56_portuguese_focus:0 "Национальные фокусы Португалии"
 portuguese_focus:0 "Стандартные национальные фокусы Португалии"
 POR_become_portugal:0 "Стать Португалией"
 POR_luso_imperial_and_royal_armies:0 "Королевские и имперские вооружённые силы"
 POR_luso_imperial_and_royal_armies_desc:0 "Наши войска разделены океаном, но это не значит, что мы не можем учиться друг у друга. Различия делают нас сильнее не меньше, чем общая приверженность португальским корням."
 POR_luso_monarchist_military_cooperation:0 "Королевская и имперская армии"
 POR_luso_monarchist_military_cooperation_desc:0 "Наши войска разделены океаном, но это не значит, что мы не можем учиться друг у друга. Различия делают нас сильнее не меньше, чем общая приверженность португальским корням."
 POR_luso_monarchist_cooperation:0 "Лузо-монархическое сотрудничество"
 POR_luso_monarchist_cooperation_desc:0 "Наш союз должен быть скреплён и торжественно отмечен по обе стороны океана."
 POR_remember_olivenca:0 "Отомстить за Оливенсу"
 POR_remember_olivenca_desc:0 "Вот уже два столетия Испания отказывает нам в суверенитете над Оливенсой. Сколько бы договоров мы ни подписывали, чтобы положить конец этой несправедливости, наши законные земли снова и снова остаются недоступными для нас. Но теперь мы вернём всё на своих условиях, а за их необоснованное упрямство пойдём ещё дальше и отвоюем наши земли в Галисии и Марокко!"
 POR_desenvolver_o_interior:0 "Развивать внутренние районы"
 POR_desenvolver_o_interior_desc:0 "Португальское правительство обеспечит промышленности необходимую поддержку, прежде всего хорошую инфраструктуру по всей стране."
 POR_construir_fabricas:0 "Строительство фабрик I"
 POR_construir_fabricas_desc:0 "Португальское правительство обещало увеличить производство в стране. Пришло время выполнить обещание."
 POR_construir_fabricas_2:0 "Строительство военных заводов I"
 POR_construir_fabricas_2_desc:0 "Если Португалия вновь хочет стать великой державой, мы должны производить больше вооружения. Так тому и быть."
 POR_acores:0 "Развивать Азорские острова"
 POR_acores_desc:0 "Азорские острова имеют стратегическое положение в Атлантике. Если мы хотим контролировать океан, их необходимо развивать."
 POR_acores_fort:0 "Укрепить Азорские острова"
 POR_acores_fort_desc:0 "Азорские острова имеют стратегическое положение в Атлантике. Если мы хотим контролировать океан, их необходимо укрепить."
 POR_madeira:0 "Развивать Мадейру"
 POR_madeira_desc:0 "Мадейра, возможно, не столь стратегически важна, как Азорские острова, но её также необходимо развивать. Она станет опорной базой в Атлантике."
 POR_extra_tech_slot:0 "Дополнительная ячейка исследований I"
 POR_extra_tech_slot_desc:0 "Исследования крайне важны, и о них нельзя забывать. Так мы сможем вывести технологии на невиданный прежде уровень."
 POR_extra_tech_slot2:0 "Дополнительная ячейка исследований II"
 POR_extra_tech_slot2_desc:0 "Исследования крайне важны, и о них нельзя забывать. Так мы сможем вывести технологии на невиданный прежде уровень."
 POR_minas_de_ferro:0 "Стальные рудники Алжуштрела"
 POR_minas_de_ferro_desc:0 "Стальные рудники Алжуштрела были важным горнодобывающим объектом во время Второй мировой войны. Они были основаны в 1847 году после обнаружения месторождения железной руды."
 POR_minas_de_cromio:0 "Хромовые рудники Грандолы"
 POR_minas_de_cromio_desc:0 "Хромовые рудники Грандолы были важным горнодобывающим объектом во время Второй мировой войны. Они были основаны в 1900 году после обнаружения месторождения хрома."
 POR_prospect_for_oil:0 "Ультрамар"
 POR_prospect_for_oil_desc:0 "Мы должны подготовиться и распространить политику развития на колониальные регионы. «Ультрамар» — обозначение португальских заморских владений, употреблявшееся и в период войны, начавшейся в португальских колониях в 1961 году в Анголе. Эта война завершилась революцией 1974 года."
 POR_angola_refineries:0 "Построить НПЗ в Анголе"
 POR_angola_refineries_desc:0 "Чтобы обеспечить империю новыми ресурсами, необходимо строить нефтеперерабатывающие заводы в нескольких регионах. Начнём с Анголы."
 POR_timor:0 "Развивать Восточный Тимор"
 POR_timor_desc:0 "Тимор — наш опорный пункт в Океании. Его развитие позволит нарастить военную мощь в регионе."
 POR_angola_fabricas:0 "Военные заводы Анголы"
 POR_angola_fabricas_desc:0 "Следует и дальше укреплять наш африканский бастион. Строительство военных заводов усилит наши вооружённые силы."
 POR_timor_2:0 "Каучук в Восточном Тиморе"
 POR_timor_2_desc:0 "В Восточном Тиморе обнаружены небольшие запасы каучука. Следует создать мощности для добычи этого ресурса."
 POR_army_primacy:0 "Португальская армия"
 POR_army_primacy_desc:0 "Сильная армия делает нацию грозной. Мы должны развивать сухопутные войска как технологически, так и за счёт увеличения производства военного снаряжения."
 POR_modernized_artillery:0 "Оружие поддержки"
 POR_modernized_artillery_desc:0 "Совершенствование артиллерии и противотанкового вооружения жизненно важно для нашей армии."
 POR_modernized_army:0 "Новая армейская тактика"
 POR_modernized_army_desc:0 "Необходимо уделять внимание сухопутным доктринам, а также разведывательным ротам."
 POR_special_forces:0 "Войска специального назначения"
 POR_special_forces_desc:0 "Нам нужны элитные войска; горные части и десантники должны стать приоритетом."
 POR_armored_effort:0 "Развитие бронетехники"
 POR_armored_effort_desc:0 "Применив опыт механизации пехоты, мы сможем улучшить и бронетехнику."
 POR_mare_nostrum:0 "Герои моря"
 POR_mare_nostrum_desc:0 "В прошлом мы создали могущественную империю благодаря завоеваниям в Новом Свете. Теперь мы вновь поднимемся."
 POR_carrier_effort:0 "Развитие авианосцев"
 POR_carrier_effort_desc:0 "Современные боевые флоты будут строиться вокруг авианосцев, а не линкоров. Превосходство авиации над кораблями американцы продемонстрировали ещё в 1921 году!"
 POR_capital_ships:0 "Развитие крупных кораблей"
 POR_capital_ships_desc:0 "Страна с наибольшим числом линкоров будет господствовать на морях. Мы не должны позволить Королевскому флоту превзойти нас огневой мощью в Средиземном море..."
 POR_bomber_effort:0 "Развитие бомбардировщиков"
 POR_bomber_effort_desc:0 "Эпоха, когда армии могли выигрывать войны, не обращая внимания на небо, прошла. Необходимо развивать тактические бомбардировщики, чтобы обеспечить солдат необходимой поддержкой с воздуха."
 POR_atlantic_fleet:0 "Атлантический флот"
 POR_atlantic_fleet_desc:0 "Как только мы вырвемся из британской клетки, нам придётся проецировать силу через океаны. Это должно стать первоочередной задачей."
 POR_marines_and_landing_craft:0 "Морская пехота и десантные суда"
 POR_marines_and_landing_craft_desc:0 "Войны выигрываются не одной лишь морской мощью; мы также должны уметь перевозить армии через море и безопасно высаживать их на берег..."
 POR_jet_engine_effort:0 "Развитие реактивных двигателей"
 POR_jet_engine_effort_desc:0 "Благодаря выдающейся работе Секондо Кампини Португалия должна оказаться в авангарде разработки реактивных двигателей. Следует предоставить ему все необходимые ресурсы для дальнейшего совершенствования проектов для Реджиа Аэронаутика."
 POR_light_ship_effort:0 "Развитие лёгких кораблей"
 POR_light_ship_effort_desc:0 "Конвои, идущие к нашим заморским территориям, нуждаются в защите. Необходимо развивать новые доктрины и более современные эсминцы."
 POR_escort_effort:0 "Развитие эскортных сил"
 POR_escort_effort_desc:0 "Нужно приложить дополнительные усилия для защиты уязвимых конвоев в Атлантике."
 POR_sea_wolves:0 "Морские волки"
 POR_sea_wolves_desc:0 "Наши германские союзники создали пугающе эффективные подводные лодки и доктрину «волчьих стай» для их применения. Нам следует перенять этот опыт."
 POR_air_innovation:0 "Авиационные инновации"
 POR_air_innovation_desc:0 "Современные войны невозможно выиграть без господства в небе. Мы должны сделать всё возможное для развития военно-воздушных сил!"
 POR_air_innovation_2:0 "Авиационные инновации II"
 POR_air_innovation_2_desc:0 "Любое преимущество в воздухе бесценно. Следует сосредоточить все усилия на развитии истребителей."
 POR_naval_air_effort:0 "Развитие морской авиации"
 POR_naval_air_effort_desc:0 "Американцы доказали эффективность авиаударов по морским целям ещё в 1921 году. Если мы намерены воевать с морской державой, нельзя пренебрегать этой отраслью военно-воздушных сил."
 POR_submarine_effort:0 "Строительство подводных лодок"
 POR_submarine_effort_desc:0 "Подводная война — самое захватывающее новшество на море со времён изобретения торпедного катера. Нам следует научиться как защищаться от подлодок, так и использовать их против вражеского судоходства."
 POR_salazar:0 "Политические игры"
 POR_salazar_desc:0 "Португалия всегда была ареной борьбы за власть. Попытаемся извлечь из этого политическую выгоду."
 POR_collectivist_ethos:0 "Португалия прежде всего"
 POR_collectivist_ethos_desc:0 "Наши враги могут разделять и покорять слабые страны, но наш народ останется един — один за всех и все за одного."
 POR_liberty_ethos:0 "Воспоминания о Первой республике"
 POR_liberty_ethos_desc:0 "Несмотря на нестабильность Первой республики, именно она стала первым опытом республиканской демократии для Португалии. Пора диктатуре Салазара пасть, чтобы из пепла Эстадо Ново возникла демократия, способная исправить ошибки, приведшие к падению Первой республики."
 POR_militarism:0 "Католический милитаризм"
 POR_militarism_desc:0 "Католическая идентичность — одна из важнейших идей Национал-синдикалистского движения. Необходимость защищать церковь с оружием в руках усилит военную активность в Португалии."
 POR_political_correctness:0 "Политическая корректность"
 POR_political_correctness_desc:0 "Люди, придерживающиеся слегка спорных или попросту неудобных взглядов, похоже, обеспокоены существованием всеобъемлющего заговора против них. Кажется, это превосходная идея."
 POR_neutrality_focus:0 "Международный нейтралитет"
 POR_neutrality_focus_desc:0 "Пусть другие утверждают, что для выбора стороны в мировом конфликте требуются храбрость и мудрость, мы знаем: ещё больше их нужно, чтобы отказаться выбирать."
 POR_interventionism_focus:0 "Интервенционизм"
 POR_interventionism_focus_desc:0 "Мы ценим свободу всех людей, а не только собственных граждан. Если для предотвращения тирании потребуется война — так тому и быть."
 POR_military_youth:0 "Молодёжь Салазара"
 POR_military_youth_desc:0 "Организации, прививающие молодёжи дисциплину и политические знания, с ранних лет воспитают преданность и готовность к самопожертвованию."
 POR_deterrence:0 "Министерство обороны"
 POR_deterrence_desc:0 "Действуя в одиночку, мы редко извлекаем пользу из войны. К счастью, нам известно: лучшая оборона — та, чья сила настолько очевидна, что применять её не приходится."
 POR_volunteer_corps:0 "Добровольческий корпус"
 POR_volunteer_corps_desc:0 "Принуждать людей умирать за идеалы свободы было бы иронично, но ничто не мешает создать возможности для тех, кто добровольно хочет помочь народам за рубежом."
 POR_paramilitarism:0 "Камизаш Азуйш"
 POR_paramilitarism_desc:0 "«Камизаш Азуйш», то есть «Синие рубашки», — военизированное крыло Национал-синдикалистского движения. Развитие этой организации позволит установить господство движения и одновременно укоренить милитаризм в сознании португальцев."
 POR_indoctrination_focus:0 "Идеологическая обработка"
 POR_indoctrination_focus_desc:0 "Мы установили, что наша идеология основана на истине, а значит, её можно преподавать как истину. Образование и средства массовой информации должны отражать этот урок."
 POR_foreign_expeditions:0 "Зарубежные экспедиции"
 POR_foreign_expeditions_desc:0 "Раз враги готовы вмешиваться в далёкие конфликты ради своих идеалов, мы должны быть готовы делать то же самое ради наших."
 POR_why_we_fight:0 "За что мы сражаемся"
 POR_why_we_fight_desc:0 "Мир становится всё опаснее. Наш народ должен увидеть зверства тех, кто жаждет власти. Мы объединим людей вокруг нашего дела и убедимся, что каждый готов сражаться за свободу."
 POR_political_commissars:0 "Политические комиссары"
 POR_political_commissars_desc:0 "Чтобы наша политика исполнялась и в военной сфере, мы введём в ряды вооружённых сил политически назначаемых должностных лиц."
 POR_internationalism_focus:0 "Подъём КПП"
 POR_internationalism_focus_desc:0 "Запрещённая после переворота 1926 года Коммунистическая партия Португалии была вынуждена реорганизоваться в подпольные ячейки под руководством Бенту Гонсалвеша, генерального секретаря партии с 1929 года. Мы должны воспользоваться глубокой раздробленностью противников Эстадо Ново и объединить их вокруг принципов марксизма-ленинизма, чтобы освободить Португалию от капиталистического гнёта Салазара."
 por_nationalism_focus2:0 "Поддержать НСД"
 por_nationalism_focus2_desc:0 "Национал-синдикалистское движение выступает за создание в Португалии тоталитарного корпоративистского государства, противостоящего как капитализму, так и коммунизму. Вдохновлённое главным образом итальянским фашизмом и испанской Фалангой, движение впервые попыталось свергнуть режим в 1935 году, но потерпело неудачу. При более широкой общественной поддержке вторая попытка захватить власть может увенчаться успехом."
 POR_nationalism_focus:0 "Укрепить Эстадо Ново"
 POR_nationalism_focus_desc:0 "Режим Антониу де Оливейры Салазара, известный как «Эстадо Ново», принёс Португалии немало пользы: положил конец нестабильности Первой республики и восстановил доверие населения, особенно религиозной его части."
 POR_ideological_fanaticism:0 "Идеологический фанатизм"
 POR_ideological_fanaticism_desc:0 "Наши политические ценности и цели заслуживают смерти за них не меньше любой древней веры. Каждый последователь должен быть готов встретить смерть, а отступникам тоже следует приготовиться к ней."
 POR_technology_sharing:0 "Обмен технологиями"
 POR_technology_sharing_desc:0 "Обмениваясь технологическими достижениями с союзниками, весь наш альянс сможет эффективнее проводить исследования и разработки военного времени."
 POR_deus_patria_familia:0 "Бог, Родина и семья"
 POR_deus_patria_familia_desc:0 "Наши политические ценности и цели заслуживают смерти за них не меньше любой древней веры. Каждый последователь должен быть готов встретить смерть, а отступникам тоже следует приготовиться к ней."
 POR_policia_estado:0 "ПВДЕ"
 POR_policia_estado_desc:0 "ПВДЕ, позднее Международная полиция защиты государства (Полисия Интернасьонал и де Дефеза ду Эстаду), была португальской службой безопасности, существовавшей при режиме Эстадо Ново Антониу де Оливейры Салазара. Формально основные функции ПИДЕ включали пограничный контроль, надзор за иммиграцией и эмиграцией, а также внутреннюю и внешнюю безопасность государства. Однако наибольшую известность она получила благодаря деятельности политической полиции."
 POR_befriend_spain:0 "Лиссабонский договор"
 POR_befriend_spain_desc:0 "Вместо ориентации на великие державы следует стремиться к союзу с испанскими соседями, чтобы защищать исключительно иберийские интересы и одновременно обезопасить сухопутную границу."
 POR_demand_ceuta:0 "Потребовать Сеуту у Испании"
 POR_demand_ceuta_desc:0 "Сеута была португальским владением ещё в 1415 году. Мы потеряли её, когда наш король Филипе II предал законного правителя Сеуты. Необходимо потребовать вернуть город под нашу власть."
 POR_demand_rhodesia:0 "Потребовать Родезию у Великобритании"
 POR_demand_rhodesia_desc:0 "Родезия была португальским владением ещё в прошлом столетии. Мы потеряли её из-за Испании, шантажировавшей нашего слабого короля Д. Карлуша I. Необходимо потребовать вернуть её под нашу власть."
 POR_demand_ceylon:0 "Потребовать Цейлон у Великобритании"
 POR_demand_ceylon_desc:0 "Цейлон был португальским владением ещё в прошлом столетии. Мы потеряли его из-за Испании, шантажировавшей нашего слабого короля Д. Карлуша I. Необходимо потребовать вернуть его под нашу власть."
 POR_ceuta:0 "Развивать Сеуту"
 POR_ceuta_desc:0 "Сеута — стратегический бастион в Северной Африке. Если мы хотим контролировать Африку, необходимо обеспечить её безопасность и развитие."
 POR_rhodesia:0 "Развивать Родезию"
 POR_rhodesia_desc:0 "Родезия — стратегический бастион в Африке. Если мы хотим контролировать Африку, необходимо обеспечить её безопасность и развитие."
 POR_ceylon:0 "Развивать Цейлон"
 POR_ceylon_desc:0 "Цейлон — стратегический бастион в Африке. Если мы хотим контролировать Африку, необходимо обеспечить его безопасность и развитие."
 POR_brazil:0 "Аннексировать Бразилию"
 POR_brazil_desc:0 "Бразильцы — наши братья. Нас объединяют общий язык и общая история. Пришло время объединиться в одну страну ради блага наших народов."
 POR_join_allies:0 "Англо-португальский союз"
 POR_join_allies_desc:0 "По мере ухудшения политической обстановки в Европе и приближения тени войны разумно заключить союз с Великобританией, чтобы обеспечить себе защиту."
 POR_join_allies2:0 "Англо-португальский союз"
 POR_join_allies2_desc:0 "По мере ухудшения политической обстановки в Европе и приближения тени войны разумно заключить союз с Великобританией, чтобы обеспечить себе защиту."
 POR_join_axis:0 "Вступить в Ось"
 POR_join_axis_desc:0 "Европейский порядок меняется, а недавно побеждённые страны становятся всё более опасными. В наших интересах присоединиться к Германии и обеспечить Португалии место в новой Европе."
 POR_join_comintern:0 "Вступить в Коминтерн"
 POR_join_comintern_desc:0 "Чтобы обеспечить выживание нового коммунистического режима, следует заключить союз с Советским Союзом, эффективность армии которого уже хорошо известна."
 POR_nationalist_spain:0 "Потребовать Сеуту у Испании"
 POR_nationalist_spain_desc:0 "Сеута была португальским владением ещё в 1415 году. Мы потеряли её, когда наш король Филипе II предал законного правителя Сеуты. Необходимо потребовать вернуть город под нашу власть."
 POR_nationalist_spain2:0 "Потребовать Сеуту у Испании"
 POR_nationalist_spain2_desc:0 "Сеута была португальским владением ещё в 1415 году. Мы потеряли её, когда наш король Филипе II предал законного правителя Сеуты. Необходимо потребовать вернуть город под нашу власть."
 POR_call_of_arms:0 "Призыв к оружию"
 POR_call_of_arms_desc:0 "Португалия была и останется уважаемой державой мира. Исполним же своё предназначение!"
 POR_befriend_brazil:0 "Договор Рио-де-Жанейро"
 POR_befriend_brazil_desc:0 "Наши отношения с Бразилией всегда были хорошими. В наших интересах пригласить её в союз."
 POR_progress_cult:0 "Культ прогресса"
 POR_progress_cult_desc:0 "Мы должны прославлять открытия выдающихся португальских учёных и поощрять правильную разновидность свободомыслия. СССР всегда будет впереди загнивающего Запада в самых смелых областях науки — достаточно взглянуть на выдающуюся работу товарища Мануэла!"
 POR_socialist_science:0 "Социалистическая наука"
 POR_socialist_science_desc:0 "Мир, как и разум, находится в постоянном движении. Природа пребывает в состоянии непрерывного прогресса — даже революции. Принципы диалектического материализма применимы как к естественным наукам, так и к общественным..."
 POR_transpolar_flights:0 "Культ авиации"
 POR_transpolar_flights_desc:0 "Португалия поразит мир выдающимися авиационными достижениями. Наши героические пилоты — рыцари Португалии, скачущие на воздушных конях."
 POR_women_pilots:0 "Женщины в авиации"
 POR_women_pilots_desc:0 "Товарищу Марии, нашей героической лётчице дальних перелётов, следует разрешить сформировать несколько полностью женских авиаполков в рамках программы «Авиационная группа 69»."
 POR_socialist_realism:0 "Социалистический реализм"
 POR_socialist_realism_desc:0 "Все произведения искусства в Португалии должны стремиться просвещать народ о целях и смысле коммунизма, изображая пролетариат в реалистичных и типичных сценах повседневной жизни. Португальские художники — инженеры человеческих душ!"
 POR_naval_aviation:0 "Морская авиация"
 POR_naval_aviation_desc:0 "Современные боевые флоты будут строиться вокруг авианосцев, а не линкоров. Превосходство авиации над кораблями американцы продемонстрировали ещё в 1921 году!"
 POR_silent_service:0 "Тихая служба"
 POR_silent_service_desc:0 "Подводная война — самое захватывающее новшество на море со времён изобретения торпедного катера. Нам следует научиться как защищаться от подлодок, так и использовать их против вражеского судоходства."
 POR_elastic_defense:0 "Эластичная оборона"
 POR_greedy:0 "Португальские требования"
 POR_propaganda:0 "Португальское влияние"
 POR_civil_war_surrender_debuff:0 "Разделённая метрополия"
 POR_civil_war_surrender_debuff_desc:0 "В этой войне мы не можем слишком сильно полагаться на Ультрамар. Именно Португалия станет местом, где решится всё."
 lisnave:0 "ЛисНаве — Эшталейруш Навайш де Лижбоа"
 nautiber:0 "НаутиБер"
 fbp:0 "ФБП — Фабрика де Брасу де Прата"
 cuf:0 "КУФ — Компания Униан Фабрил"
 eca:0 "ЕКА — Эмпреза ду Кобре де Ангола"
 lancia_p:0 "Лянча Португал — импортная компания"
 fiat_p:0 "ФИАТ Португал — автомобильная компания"
 omga:0 "ОМГА — Аэронаутика Португеза"
 junkers_p:0 "Юнкерс Португал — импортная компания"
 amiot_p:0 "ФАП — компания авиационных материалов"
 heinkel_p:0 "Хейнкель Португал — импортная компания"
 man_p:0 "МАН Португал — филиал германской компании"
 ana_p:0 "АНА — компания морской авиации"
 por_estado_novo:0 "Эстадо Ново"
 por_pvde:0 "Полисия де Вижилансия и Дефеза ду Эстаду"
 por_military_youth_focus:0 "Мосидаде Португеза"
 por_dpfamilia:0 "Бог, Родина и семья"
 portugal.1.t:0 "Португалия требует Сеуту"
 portugal.1.d:0 "Португалия предлагает подписать договор, по которому Сеута перейдёт под её власть! Они утверждают, что являются законными владельцами Сеуты. Как нам поступить?"
 portugal.1.a:0 "Принять неизбежное..."
 portugal.1.b:0 "Им придётся забрать нашу землю силой!"
 portugal.3.t:0 "Испания уступает Сеуту"
 portugal.3.d:0 "Нам удалось убедить Испанию в законности наших притязаний на Сеуту. Они согласились передать Сеуту под португальское управление. Если правильно разыграть эту карту, мы сможем использовать успех для усиления своего влияния на Африканском континенте."
 portugal.3.o:0 "Мы приветствуем Сеуту"
 portugal.2.t:0 "Испания отвергает требования Португалии"
 portugal.2.d:0 "Очевидно, Испания не признаёт справедливость наших законных притязаний. Когда мы обратились к ним, они, похоже, едва помнили, что ещё в XV веке Сеута находилась под нашей властью, и отказались её передать. Теперь мы окончательно убеждены, что Сеута должна перейти Португалии — при необходимости силой."
 portugal.2.o:0 "Мы должны освободить население Сеуты"
 news.700.t:0 "Испания передаёт Сеуту Португалии"
 news.700.d:0 "Осознав ошибочность прежней позиции, Испания решила передать Португалии контроль над Сеутой, о чём португальское правительство с удовлетворением объявило миру. Это событие стало большой неожиданностью для большинства стран. Иберийские газеты обсуждают португальские притязания и напоминают, что в прежние времена Сеута действительно находилась под властью Португалии."
 news.700.o:0 "Так тому и быть."
 news.701.t:0 "Испания отвергает требования Португалии"
 news.701.d:0 "Газеты по всему миру сообщают о заявленных Португалией законных притязаниях и её требовании к Испании передать Сеуту, чтобы город вновь оказался под португальской властью."
 news.701.o:0 "В Иберии может начаться война"
 portugal.4.t:0 "Португалия требует Родезию"
 portugal.4.d:0 "Португалия предлагает подписать договор, по которому Родезия перейдёт под её власть! Они утверждают, что являются законными владельцами Родезии. Как нам поступить?"
 portugal.4.a:0 "Принять неизбежное..."
 portugal.4.b:0 "Им придётся забрать нашу землю силой!"
 portugal.6.t:0 "Великобритания уступает Родезию"
 portugal.6.d:0 "Нам удалось убедить Великобританию в законности наших притязаний на Родезию. Они согласились передать Родезию под португальское управление. Если правильно разыграть эту карту, мы сможем использовать успех для усиления своего влияния на Африканском континенте."
 portugal.6.o:0 "Мы приветствуем Родезию"
 portugal.5.t:0 "Великобритания отвергает требования Португалии"
 portugal.5.d:0 "Очевидно, Великобритания не признаёт справедливость наших законных притязаний. Когда мы обратились к ним, они, похоже, едва помнили, что Родезия веками находилась под нашей властью, прежде чем её отняли. Теперь мы окончательно убеждены, что Родезия должна перейти Португалии — при необходимости силой."
 portugal.5.o:0 "Мы должны освободить население Родезии!"
 news.702.t:0 "Великобритания передаёт Родезию Португалии"
 news.702.d:0 "Осознав ошибочность прежней позиции, Великобритания решила передать Португалии контроль над Родезией, о чём португальское правительство с удовлетворением объявило миру. Это событие стало большой неожиданностью для большинства стран. Газеты по всему миру обсуждают португальские притязания и напоминают, что в прежние времена Родезия находилась под властью Португалии."
 news.702.o:0 "Так тому и быть."
 news.703.t:0 "Великобритания отвергает требования Португалии"
 news.703.d:0 "Газеты по всему миру сообщают о заявленных Португалией законных притязаниях и её требовании к Великобритании передать Родезию, чтобы она вновь оказалась под португальской властью."
 news.703.o:0 "В Африке может начаться война"
 portugal.40.t:0 "Португалия требует Цейлон"
 portugal.40.d:0 "Португалия предлагает подписать договор, по которому Цейлон перейдёт под её власть! Они утверждают, что являются законными владельцами Цейлона. Как нам поступить?"
 portugal.40.a:0 "Принять неизбежное..."
 portugal.40.b:0 "Им придётся забрать нашу землю силой!"
 portugal.41.t:0 "Великобритания уступает Цейлон"
 portugal.41.d:0 "Нам удалось убедить Великобританию в законности наших притязаний на Цейлон. Они согласились передать Цейлон под португальское управление. Если правильно разыграть эту карту, мы сможем использовать успех для усиления своего влияния на Африканском континенте."
 portugal.41.o:0 "Мы приветствуем Цейлон"
 portugal.42.t:0 "Великобритания отвергает требования Португалии"
 portugal.42.d:0 "Очевидно, Великобритания не признаёт справедливость наших законных притязаний. Когда мы обратились к ним, они, похоже, едва помнили, что Цейлон веками находился под нашей властью, прежде чем его отняли. Теперь мы окончательно убеждены, что Цейлон должен перейти Португалии — при необходимости силой."
 portugal.42.o:0 "Мы должны освободить население Цейлона!"
 news.711.t:0 "Великобритания передаёт Цейлон Португалии"
 news.711.d:0 "Осознав ошибочность прежней позиции, Великобритания решила передать Португалии контроль над Цейлоном, о чём португальское правительство с удовлетворением объявило миру. Это событие стало большой неожиданностью для большинства стран. Газеты по всему миру обсуждают португальские притязания и напоминают, что в прежние времена Цейлон находился под властью Португалии."
 news.711.o:0 "Так тому и быть."
 news.712.t:0 "Великобритания отвергает требования Португалии"
 news.712.d:0 "Газеты по всему миру сообщают о заявленных Португалией законных притязаниях и её требовании к Великобритании передать Цейлон, чтобы он вновь оказался под португальской властью."
 news.712.o:0 "В Азии может начаться война"
 portugal.30.t:0 "Португалия просит принять её в Союзники"
 portugal.30.d:0 "Сегодня, во время недавнего визита их посла, [FROM.GetNameDefCap] официально попросила принять её в Союзники. Учитывая, что сторона [POR.GetAdjective] является одним из самых давних и верных союзников Англии, что мы ответим нашим старым друзьям?"
 portugal.30.a:0 "Любому, кто способен внести вклад, найдётся место в нашем альянсе"
 portugal.30.b:0 "Нам было лучше, пока они сохраняли нейтралитет."
 portugal.32.t:0 "Британия принимает нашу просьбу"
 portugal.32.d:0 "Британия официально одобрила нашу просьбу о вступлении в Союзники. Наши давние друзья снова будут сражаться бок о бок с нами в грядущих конфликтах!"
 portugal.32.o:0 "Англо-португальский союз крепок как никогда!"
 portugal.31.t:0 "Британия отклоняет нашу заявку"
 portugal.31.d:0 "Британцы официально отклонили нашу просьбу о вступлении в Союзники. Учитывая, что они являются одними из наших самых давних друзей, остаётся лишь гадать, почему им не нужна наша поддержка."
 portugal.31.o:0 "Им ещё повезло, что мы вообще предложили помощь."
 news.704.t:0 "[POR.GetNameDefCap] вступает в Союзники"
 news.704.d:0 "Сегодня влияние Союзников усилилось после официального вступления Португалии в альянс. Лишь время покажет, что это означает для будущего мировой политики."
 news.704.o:0 "Португалия и Британия — союзники? Расскажите что-нибудь новое."
 news.705.t:0 "Союзники отклоняют вступление стороны [POR.GetAdjective]"
 news.705.d:0 "Нам стало известно, что Португалия попросила принять её в Союзники, но неожиданно получила отказ от своего давнего британского союзника. Британцы заявили, что отказ принять сторону [POR.GetAdjective] был продиктован стратегическими соображениями, назвав такое вступление «ошибкой» в нынешней ситуации."
 news.705.o:0 "Даже после стольких лет?"
 portugal.10.t:0 "Португалия хочет вступить в Ось"
 portugal.10.d:0 "Нас только что посетил португальский министр иностранных дел и сообщил, насколько сильно они хотели бы стать частью нашего славного альянса."
 portugal.10.a:0 "Любому, кто способен внести вклад, найдётся место в нашем альянсе."
 portugal.10.b:0 "Пусть рассчитывают только на себя."
 portugal.12.t:0 "Германия принимает заявку на вступление в Ось"
 portugal.12.d:0 "Наша просьба о вступлении в Ось принята! Этот день надолго запомнится Португалии. В грядущем конфликте мы будем рады видеть этих новых друзей на своей стороне."
 portugal.12.o:0 "Вместе мы сильны."
 portugal.11.t:0 "Германия отклоняет просьбу Португалии"
 portugal.11.d:0 "Нашим дипломатам не удалось убедить Германию принять Португалию в Ось. Очень жаль — кто знает, к чему мог бы привести такой союз?"
 portugal.11.o:0 "Что ж, тогда Ось не получит нашей поддержки."
 news.706.t:0 "Ось расширяется"
 news.706.d:0 "Сегодня влияние Оси усилилось после вступления Португалии в альянс. Пока нет единого мнения о том, какие последствия это будет иметь для долгосрочной геополитической стабильности."
 news.706.o:0 "Кто бы мог подумать?"
 news.707.t:0 "Германия отклоняет просьбу Португалии"
 news.707.d:0 "Нам стало известно, что Португалия хотела вступить в Ось. Однако Германия отклонила просьбу, заявив, что в нынешней ситуации это было бы неразумно для обеих сторон."
 news.707.o:0 "Возможно, так даже лучше."
 portugal.20.t:0 "Португалия хочет вступить в Коминтерн"
 portugal.20.d:0 "Нас только что посетил португальский министр иностранных дел и сообщил, насколько сильно они хотели бы стать частью нашего славного альянса."
 portugal.20.a:0 "Любому, кто способен внести вклад, найдётся место в нашем альянсе"
 portugal.20.b:0 "Пусть рассчитывают только на себя"
 portugal.22.t:0 "Советы принимают заявку на вступление в Коминтерн"
 portugal.22.d:0 "Наша просьба о вступлении в Коминтерн принята! Этот день надолго запомнится Португалии. В грядущем конфликте мы будем рады видеть этих новых друзей на своей стороне."
 portugal.22.o:0 "Вместе мы сильны."
 portugal.21.t:0 "Советы отклоняют просьбу Португалии"
 portugal.21.d:0 "Нашим дипломатам не удалось убедить Советы принять Португалию в свой альянс. Очень жаль — кто знает, к чему мог бы привести такой союз?"
 portugal.21.o:0 "Что ж, тогда шнапса они от нас не получат"
 news.708.t:0 "Коминтерн расширяется"
 news.708.d:0 "Сегодня влияние Коминтерна усилилось после вступления Португалии в альянс. Пока нет единого мнения о том, какие последствия это будет иметь для долгосрочной геополитической стабильности."
 news.708.o:0 "Кто бы мог подумать?"
 news.709.t:0 "Советы отклоняют просьбу Португалии"
 news.709.d:0 "Нам стало известно, что Португалия хотела вступить в Коминтерн. Однако Советы отклонили просьбу, заявив, что в нынешней ситуации это было бы неразумно для обеих сторон."
 news.709.o:0 "Возможно, так даже лучше."
 news.710.t:0 "Португальское внешнеполитическое ведомство в [SPR.GetName]"
 news.710.d:0 "Вместо того чтобы противостоять государству [SPR.GetName] из-за итальянского населения на далматинском побережье, [From.GetName] объявило о создании постоянной дипломатической миссии в государстве [YUG.GetName]. Согласно заявлению министерства иностранных дел стороны [From.GetAdjective], две страны имеют настолько богатую общую историю и столько общих интересов, что взаимопонимание куда важнее мелкого пограничного спора.\n\nНа фоне растущей напряжённости в Европе остаётся лишь надеяться, что этому примеру последуют и другие страны."
 news.710.a:0 "Наши народы стоят вместе как друзья."
 news.710.b:0 "В Иберии будет мир."
 news.710.c:0 "Будет интересно посмотреть, чем всё закончится."
 portugal.t1.t:0 "Территориальные требования: [POR.getAdjective]"
