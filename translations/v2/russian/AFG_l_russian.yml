 AFG_loya_jirga.1.t:0 "Начинается Лойя-джирга [GetYear] года"
 AFG_loya_jirga.1.desc:0 "На протяжении веков пуштунский социальный кодекс формировал культурные и социальные нормы как простых людей, так и элиты. Согласно этой традиции, лидеры страны вместе с племенными вождями проводят ежегодную Лойя-джиргу, чтобы наметить курс страны в периоды неопределенности.\n\nВ этом году Джирга сосредоточится на важнейших вопросах, включая социальный статус женщин, индустриализацию Кабула, недавно введенные образовательные реформы и внешнюю политику страны. Ожидается, что король вместе со своим кабинетом прибудет в ближайшее время. Тем не менее, напряженность растет, поскольку сообщения указывают на недовольство среди фермеров в Нимрузе и Фарахе из-за распределения поставок, а северяне из Тахара обеспокоены недавними рейдами Басмачи в их регионе. Кроме того, ожидается, что фракции в армии выразят недовольство продолжающимися усилиями по модернизации вооруженных сил.В отличие от этого, Кабул, как ожидается, продемонстрирует сильную поддержку, особенно после недавнего открытия первого университета страны.\n\nКоролю было рекомендовано занять твердую позицию по военным вопросам, но оставаться открытым для уступок, если дебаты станут слишком спорными. Мы должны избегать повторения ошибок Лойи Джирги 1928 года и тщательно уравновешивать страсти как модернизаторов, так и традиционалистов по мере нашего продвижения вперед."
 AFG_loya_jirga.1.a:0 "Мы обязательно на ней побываем."
 AFG_loya_jirga.2.t:0 "Путь к модернизации — вопрос государственного устройства"
 AFG_loya_jirga.2.desc:0 "[AFG.GetNonIdeologyName] остаётся крайне децентрализованным государством, где власть правительства почти не распространяется за пределы столицы, Кабула. Это привело к неэффективной экономике, слабой администрации и неразвитым вооружённым силам. \n\nМодернизаторы выступают за расширение прямого контроля Кабула над страной и централизацию государственной власти, что позволило бы упорядочить управление, сократить бюрократическую неэффективность и снизить расходы. \n\nОднако подобные перемены серьёзно повлияют на жизнь афганцев за пределами Кабула, не привыкших к столь пристальному государственному надзору. Поэтому это предложение, вероятно, встретит сопротивление традиционалистов..."
 AFG_loya_jirga.2.a:0 "[AFG.GetNonIdeologyName] должна следовать путём умеренной централизации."
 AFG_loya_jirga.2.b:0 "Крайне важно обеспечить сильное и единое управление по всей стране!"
 AFG_loya_jirga.3.t:0 "Путь к модернизации — положение женщин"
 AFG_loya_jirga.3.desc:0 "Пока [AFG.GetNonIdeologyName] преодолевает сложности модернизации, вопрос прав женщин стал одной из наиболее острых тем Лойя-джирги этого года. Глубокий раскол между традиционалистами, выступающими за сохранение культурных норм, и модернизаторами, стремящимися расширить права и возможности женщин, вызвал ожесточённые споры. \n\nС одной стороны, традиционалисты утверждают, что пуштунский общественный кодекс должен и далее определять роль женщин, подчёркивая важность семьи и культурных ценностей. Они опасаются, что расширение прав способно подорвать стабильность общества и привести к исчезновению обычаев, веками определявших жизнь афганцев. \n\nС другой стороны, модернизаторы требуют значительных реформ, предлагая расширить доступ к образованию, юридические права и участие женщин в общественной жизни. По их мнению, расширение возможностей женщин необходимо для прогресса страны и поможет создать более процветающее и справедливое общество."
 AFG_loya_jirga.3.a:0 "Мы должны сохранить существующий порядок..."
 AFG_loya_jirga.3.b:0 "Расширение прав женщин имеет решающее значение для будущего государства [AFG.GetNonIdeologyName]!"
 AFG_loya_jirga.4.t:0 "Путь к модернизации — вопрос ислама"
 AFG_loya_jirga.4.desc:0 "Многие ведущие модернизаторы уже долгое время спорят о том, совместим ли ислам с целями будущего государства [AFG.GetNonIdeologyName]. Этот принципиальный спор наконец достиг точки кипения, и нам пора занять позицию и решить, следует ли отделить ислам от государства. \n\nСторонники ислама утверждают, что самобытность страны неразрывно связана с её религиозными ценностями и что государственное управление должно отражать учение Корана. Они считают исламскую основу необходимой для сохранения общественного единства и нравственной целостности, а законы должны соответствовать убеждениям большинства. Для них секуляризм означает отказ от традиций и представляет потенциальную угрозу устоям афганского общества. \n\nСторонники светского государства, напротив, утверждают, что отделение религии от государства необходимо для прогресса и обеспечения равных прав всех граждан независимо от их вероисповедания. Они указывают на преимущества светского управления, включая расширение свободы слова, защиту прав меньшинств и продвижение гендерного равенства. Эта фракция считает, что принятие секуляризма позволит государству [AFG.GetNonIdeologyName] модернизироваться и конкурировать на мировой арене, сохраняя уважение к личным свободам."
 AFG_loya_jirga.4.a:0 "Мы должны вновь подтвердить приверженность исламским принципам."
 AFG_loya_jirga.4.b:0 "Отделение религии от государства необходимо!"
 AFG_loya_jirga.5.t:0 "Путь к модернизации — социальные реформы"
 AFG_loya_jirga.5.desc:0 "Проблема повсеместной неграмотности наконец оказалась в центре внимания Лойя-джирги этого года. Делегаты расходятся во мнениях о том, как лучше решить эту важнейшую проблему: одни выступают за всеобъемлющую программу ликвидации неграмотности, а другие предостерегают от слишком быстрых перемен, способных разгневать традиционалистов. \n\nСторонники масштабной образовательной программы утверждают, что для подъёма страны и обеспечения её будущего процветания необходимы немедленные действия. Они считают инвестиции в образование основой подготовки квалифицированной рабочей силы, расширения политического участия и стимулирования экономического роста. Этот амбициозный подход предполагает широкую кампанию по просвещению населения, особенно женщин, исторически лишённых равных возможностей для обучения. \n\nБолее осторожные голоса, напротив, выступают за постепенный подход, подчёркивая необходимость уважать культурные особенности и традиционный образ жизни. Они предупреждают, что резкое распространение массового образования может вызвать отпор традиционалистских сил, которые воспримут его как посягательство на свои обычаи и ценности. Эта фракция предлагает создавать местные программы на основе существующих общинных структур, обеспечивая более плавный переход к повышению грамотности и не отталкивая тех, кто опасается перемен."
 AFG_loya_jirga.5.a:0 "Постепенная ликвидация неграмотности жизненно необходима."
 AFG_loya_jirga.5.b:0 "Вздор, образование — опора стабильности!"
 AFG_loya_jirga.6.t:0 "Завершение Лойя-джирги [GetYear] года"
 AFG_loya_jirga.6.desc:0 "После того как все племенные вожди и ораторы высказали своё мнение, Лойя-джирга [GetYear] года подошла к концу.[GetLoyaJirgaEventDesc]. Теперь на нас лежит ответственность за воплощение предложений и пожеланий, выдвинутых членами джирги. У нас есть некоторое время для проведения этих изменений, однако слишком долгая задержка может вызвать гнев племенных вождей."
 AFG_loya_jirga.6.a:0 "Прекрасно."
 AFG_loya_jirga_good:0 "Во время джирги король и его правительство придерживались примирительного и дружелюбного подхода к её участникам, демонстрируя искреннее стремление к сотрудничеству и сохранению существующего порядка. Газета «Кабул Таймс» охарактеризовала джиргу этого года как демократичную и прозрачную"
 AFG_loya_jirga_bad:0 "Во время джирги король и его правительство заняли агрессивную и враждебную позицию по отношению к участникам собрания, стремясь немедленно провести радикальные реформы. Этот подход встретил серьёзное сопротивление делегатов и вызвал резкую критику со стороны газеты «Кабул Таймс» и множества других информационных агентств"
 AFG_loya_jirga.10.t:0 "Курс Лойя-джирги 1936 года"
 AFG_loya_jirga.10.d:0 "До начала Лойя-джирги остаётся совсем немного времени, и у нас есть краткая возможность повлиять на политическое направление собрания этого года. Регентство во главе с премьер-министром Мухаммадом Хашим-ханом и военным министром Шах Махмуд-ханом призвало короля продолжить курс постепенной централизации и модернизации, соблюдая хрупкое равновесие между требованиями модернизаторов и опасениями традиционалистов. В прошлом любые попытки быстрых реформ встречали решительное сопротивление племенного населения, выступавшего против перемен, которые оно считало угрозой пуштунвали — своему древнему кодексу жизни. \n\nЭти простые люди желают стабильности и уважения к своим культурным обычаям. Уступки и поиск компромиссов с традиционалистами в вопросах местной автономии и утверждения Хашт Нафари могут побудить их сотрудничать с правительством, обеспечив более мирное и единое государство [AFG.GetNonIdeologyName]."
 AFG_loya_jirga.10.a:0 "[AFG.GetNonIdeologyName] нельзя терять время — реформы необходимо провести как можно скорее!"
 AFG_loya_jirga.10.b:0 "Мы должны проводить реформы постепенно, чтобы не разгневать традиционалистов..."
 r56_afghanistan.1.t:0 "Племенные вожди предлагают помощь"
 r56_afghanistan.1.d:0 "В трудный для нас час одно из местных племён предложило свою военную помощь. Племя, известное свирепостью своих воинов и преданностью, готово предоставить солдат для пополнения рядов нашей армии.\n\nОднако это предложение может иметь последствия. Племя будет ожидать привилегированного отношения и может потребовать более значительной роли в наших военных операциях. Если согласиться, армия рискует оказаться сильнее зависимой от племён, что способно вызвать напряжённость с другими группировками внутри страны."
 r56_afghanistan.1.a:0 "Нам пригодится любая помощь."
 r56_afghanistan.1.b:0 "Мы не нуждаемся в подобной помощи."
 r56_afghanistan.2.t:0 "[AFG.GetNonIdeologyName] просит политической поддержки"
 r56_afghanistan.2.d:0 "[AFG.GetNonIdeologyName] Не хватает политических лидеров и революционеров, чтобы руководить народом и Хизб-э Халком, мы должны посылать таджикских советников в Таджикистан. [AFG.GetNonIdeologyName] - они культурно и лингвистически похожи на местных жителей, если мы не хотим оказывать им дипломатическую и политическую поддержку; [AFG.GetNonIdeologyName] Он может дистанцироваться от нас и следовать другим путем, отделенным от нас. [SOV.Capital.GetCapitalVictoryPointName]!"
 r56_afghanistan.2.a:0 "Отправить Нисара Мухаммада Юсуфзая, героя Третьей англо-афганской войны."
 r56_afghanistan.2.b:0 "Дмитрий Протопопов молод, но предан — он как раз подходит для этой задачи."
 r56_afghanistan.2.c:0 "Они не заслуживают нашего драгоценного времени!"
 r56_afghanistan.3.t:0 "Таджикистанский вопрос"
 r56_afghanistan.3.d:0 "Правительство государства [AFG.GetAdjective] обратилось к нам с любопытной просьбой: оно требует передать Афганистану контроль над регионом [742.GetName]. Однако это предложение не лишено оснований: таджики и пуштуны на протяжении веков жили в относительном мире в государстве [AFG.GetNonIdeologyName] и имеют немало общего. Было бы разумно пойти на эту уступку, поскольку афганские власти, вероятно, столкнутся с меньшим политическим сопротивлением со стороны таджиков."
 r56_afghanistan.3.a:0 "Мы вознаградим преданность государства [AFG.GetNonIdeologyName]..."
 r56_afghanistan.3.b:0 "Нелепость! Таджикистан — неотъемлемая часть государства [ROOT.GetNameDef]!"
 r56_afghanistan.4.t:0 "Государство [SOV.GetAdjective] принимает наше предложение"
 r56_afghanistan.4.d:0 "Получив наше письмо несколько дней назад, правительство в городе [SOV.Capital.GetCapitalVictoryPointName] согласилось с предложением: регион [742.GetName] будет включён в состав государства [AFG.GetNonIdeologyName]. Остаётся надеяться, что таджики не станут сопротивляться смене правительства и местной власти. Однако в будущем нам придётся тщательно соблюдать равновесие между таджикскими общинами и остальным населением государства [AFG.GetNonIdeologyName], ведь теперь [AFG.GetNonIdeologyName] также стала государством всех таджиков..."
 r56_afghanistan.4.a:0 "Таджики и пуштуны вновь живут в согласии!"
 r56_afghanistan.5.t:0 "[AFG.GetNonIdeologyName] предлагает вторжение в [PER.GetNonIdeologyName]"
 r56_afghanistan.5.d:0 "Мы получили интересное предложение от [AFG.GetAdjective]ого правительства: они предлагают совместно вторгнуться в [PER.GetNameDef], чтобы обезопасить южный фронт и не допустить проникновения нежелательного влияния в Персию. Это также поможет нам укрепить наши интересы на Ближнем Востоке, обеспечит доступ к новым нефтяным месторождениям и позволит защитить наши собственные месторождения в Баку."
 r56_afghanistan.5.a:0 "Блестяще! Подготовить войска к вторжению!"
 r56_afghanistan.5.b:0 "Сейчас это нас не касается..."
 r56_afghanistan.6.t:0 "[SOV.GetAdjective]ое правительство отклоняет наше предложение"
 r56_afghanistan.6.d:0 "Получив наше письмо несколько дней назад, власти в [SOV.Capital.GetCapitalVictoryPointName] решили отклонить нашу просьбу. Наше доверие к [SOV.GetAdjective]ому правительству подорвано. Хотя значительная часть [AFG.GetAdjective]ого населения этнически является таджиками, [AFG.GetNonIdeologyName] никогда не сможет объединить таджикские земли!"
 r56_afghanistan.6.a:0 "Плохой выбор, господин [SOV.GetLeader]!"
 r56_afghanistan.7.t:0 "Кочевники переселяются в [AFG_nomad_state.GetName]"
 r56_afghanistan.7.d:0 "Многие кочевники из соседних пустынь и долин решили поселиться в регионе [AFG_nomad_state.GetName], о чём сообщили губернаторы вилайета [AFG_nomad_state.GetName]. Это, разумеется, принесёт пользу нашей экономике, однако остаётся надеяться, что [AFG_nomad_state.GetName] сможет справиться со столь большим притоком кочевников за столь короткое время."
 r56_afghanistan.7.a:0 "Чем больше, тем веселее!"
 r56_afghanistan.12.t:0 "[AFG.GetAdjective]ий государственный визит в [GER.Capital.GetCapitalVictoryPointName]"
 r56_afghanistan.12.d:0 "Покинув Кабул много недель назад, королевская семья прибыла в [GER.Capital.GetCapitalVictoryPointName]. По прибытии её встретил лично [GER.GetLeader], обрадованный встречей с королевской семьёй государства [AFG.GetNonIdeologyName]. Во время визита сардар Мухаммед Хашим-хан проявил большой интерес к [GER.GetAdjective]ому образу жизни и [GER.GetAdjective]им традициям. На торжественном приёме в [GER.Capital.GetCapitalVictoryPointName], организованном лидером [GER.GetLeader], он заявил о своей заинтересованности в расширении экономического и военного сотрудничества с государством [GER.GetNameDef]."
 r56_afghanistan.12.a:0 "Возможно, [GER.GetNonIdeologyName] станет самым верным другом государства [AFG.GetNonIdeologyName]..."
 r56_afghanistan.13.t:0 "[SOV.GetAdjective]ое правительство отвергает вторжение в [PER.GetNonIdeologyName]"
 r56_afghanistan.13.d:0 "[SOV.GetAdjective]ое правительство отклонило наше предложение о вторжении в [PER.GetNameDef]. Оно заявило, что южный фронт не представляет для него особой важности, а [PER.GetNameDef] не угрожает бакинским нефтяным месторождениям."
 r56_afghanistan.13.a:0 "Какие же глупцы сидят в [SOV.Capital.GetCapitalVictoryPointName]..."
 r56_afghanistan.14.t:0 "[AFG.GetAdjective]ие выборы [GetYear] года"
 r56_afghanistan.14.d:0 "Путь к демократии в государстве [AFG.GetNonIdeologyName] был долгим и трудным. Но всё же мы его прошли. [AFG.GetAdjective]ие выборы [GetYear] года доказывают, что демократия в государстве [AFG.GetNonIdeologyName] возможна и достижима — по крайней мере, так говорят некоторые. [GetElectionWinner]"
 r56_afghanistan.14.a:0 "Вот что нам нравится: свободные и, главное, честные выборы!"
 r56_afghanistan.14.b:0 "Ещё один шаг к настоящей демократии!"
 r56_afghanistan.14.c:0 "Подтасовать голоса — мы не можем позволить себе проиграть выборы..."
 r56_afghanistan.15.t:0 "Подготовка к европейскому турне Амануллы"
 r56_afghanistan.15.d:0 "С момента своего недавнего возвращения в государство [AFG.GetNonIdeologyName] Аманулла планировал королевское турне по Европе. В прошлый раз, когда он решился на подобное путешествие, во время его отсутствия в государстве [AFG.GetNonIdeologyName] разгорелась гражданская война. В результате он вместе с остальными членами королевской семьи оказался в изгнании. На этот раз он намерен повторить маршрут 1928 года, посетив Каир, Рим, Париж, [ENG.Capital.GetCapitalVictoryPointName], [GER.Capital.GetCapitalVictoryPointName], Варшаву и, наконец, Стамбул. Если всё пойдёт по плану, путешествие Амануллы займёт около шести месяцев. Остаётся лишь надеяться, что обстановка на родине сохранит стабильность, а король благополучно вернётся."
 r56_afghanistan.15.a:0 "Пусть путешествие короля будет безопасным!"
 r56_afghanistan.16.t:0 "Нисар Мухаммад Юсуфзай прибывает из города [SOV.Capital.GetCapitalVictoryPointName]"
 r56_afghanistan.16.d:0 "Буквально несколько дней назад дошла информация, отправленная из Кабула. [SOV.Capital.GetCapitalVictoryPointName] И руки его, [SOV.GetLeader]. После получения известия, [SOV.GetLeader] Они призвали к собранию его самых преданных людей, а затем тщательно и обдуманно обсудили представленное предложение. После долгих часов жарких дебатов было принято решение, Нисар Мухаммад Юсафзай, один из основателей Таджикской АССР и герой Третьей англо-афганской войны, вместе с Виталием Примаковым, заместителем командующего Ленинградским военным округом, в ближайшее время прибудет в Кабул. Как и предполагалось, Нисар Мухаммад Юсуфзай также станет ведущей фигурой Халка."
 r56_afghanistan.16.a:0 "Товарищи, добро пожаловать в [AFG.Capital.GetCapitalVictoryPointName]!"
 r56_afghanistan.17.t:0 "Дмитрий Протопопов прибывает из города [SOV.Capital.GetCapitalVictoryPointName]"
 r56_afghanistan.17.d:0 "Буквально несколько дней назад дошла информация, отправленная из Кабула. [SOV.Capital.GetCapitalVictoryPointName] И руки его, [SOV.GetLeader]. После получения известия, [SOV.GetLeader] Они призвали к собранию его самых преданных людей, а затем тщательно и обдуманно обсудили представленное предложение. После долгих часов жарких дебатов было принято решение, Дмитрий Протопопов, видный и известный деятель таджикской политики, вместе с Виталием Примаковым, заместителем командующего Ленинградским военным округом, в ближайшее время прибудет в Кабул. Как и предполагалось, Протопопов также станет ведущей фигурой Халка и [AFG.GetAdjective] Нация."
 r56_afghanistan.17.a:0 "Товарищи, добро пожаловать в [AFG.Capital.GetCapitalVictoryPointName]!"
 r56_afghanistan.18.t:0 "[SOV.GetAdjective]ое правительство отклоняет нашу просьбу!"
 r56_afghanistan.18.d:0 "Буквально несколько дней назад дошла информация, отправленная из Кабула. [SOV.Capital.GetCapitalVictoryPointName] И руки его, [SOV.GetLeader]. После получения известия, [SOV.GetLeader] Они призвали к собранию его самых преданных людей, а затем тщательно и обдуманно обсудили представленное предложение. После долгих долгих часов жарких дебатов из-за существенных разногласий среди большевиков решение не было принято. Кажется, что [SOV.Capital.GetCapitalVictoryPointName] не имеет интереса к [AFG.GetNonIdeologyName]Мы можем только надеяться, что это не означает конца для [SOV.GetAdjective]-[AFG.GetAdjective] отношений."
 r56_afghanistan.18.a:0 "Как они смеют! Это неприемлемо!"
 r56_afghanistan.19.t:0 "Кризис Совета"
 r56_afghanistan.19.d:0 "Революционный совет слишком долго остаётся без председателя, и нельзя ожидать, что он продолжит нормально работать без надлежащего руководителя. Пришло время избрать председателя, поскольку [SOV.GetAdjective]ая сторона не смогла предоставить нам достаточно подходящих лидеров, способных возглавить Революционный совет. В партии необходимо сохранить стабильность и порядок!"
 r56_afghanistan.19.a:0 "Стабильность должна быть сохранена любой ценой!"
 r56_afghanistan.19.b:0 "Отдать предпочтение парчамистам..."
 r56_afghanistan.20.t:0 "Ежегодный туркменский спортивный фестиваль"
 r56_afghanistan.20.d:0 "Король государства [AFG.GetNonIdeologyName] Мухаммед Захир-шах посетил ежегодный туркменский спортивный фестиваль, проходящий в городке неподалёку от Кабула. Этот местный конный праздник помогает отвлечь народ государства [AFG.GetNonIdeologyName] от мира, который медленно погружается в огонь и пламя. К счастью, [AFG.GetAdjective]ому народу не о чем тревожиться, ведь иностранное вторжение в государство [AFG.GetNonIdeologyName] выглядит маловероятным... верно?"
 r56_afghanistan.20.a:0 "Пока король у власти, государство [AFG.GetNonIdeologyName] непобедимо!"
 r56_afghanistan.20.b:0 "Он развлекается, пока мир горит... Позор!"
 r56_afghanistan.21.t:0 "Арестован Маулана Киямуддин Хадим"
 r56_afghanistan.21.d:0 "Сегодня утром сотрудники ХАД провели обыск в доме Киямуддина. Его арестовали по подозрению в заговоре против правительства и партии Афганистана. Глава ХАД предложил три варианта дальнейших действий. Казнь вызовет гнев фракции Парчам, но одновременно устранит одного из её наиболее влиятельных, если не самого влиятельного лидера. Можно просто заключить его под стражу и отстранить от [AFG.GetAdjective]ой политики. Наконец, его можно освободить, однако это вызовет нестабильность и усилит Парчам."
 r56_afghanistan.21.a:0 "На виселицу его!"
 r56_afghanistan.21.b:0 "Арестовать предателя — его приговорят к пожизненному заключению."
 r56_afghanistan.21.c:0 "Освободить его. Мы должны искать сотрудничества с парчамистами..."
 r56_afghanistan.22.t:0 "Маулана Киямуддин Хадим умирает в тюрьме"
 r56_afghanistan.22.d:0 "Сегодня в тюрьме скончался лидер Парчама Маулана Киямуддин Хадим. С самого момента его ареста многие люди объявляли бойкоты и выходили на протесты, однако нам удавалось подавлять эти выступления. Теперь многие задаются вопросом, как Парчам продолжит существование без своего лидера."
 r56_afghanistan.22.a:0 "Где же проходит черта?"
 r56_afghanistan.23.t:0 "Завершение реформы образования"
 r56_afghanistan.23.d:0 "После многих лет и месяцев государство [AFG.GetNonIdeologyName] наконец завершило реформу образования. По всей стране в сельской местности открылось множество школ, призванных обучать население. Теперь почти все жители государства [AFG.GetNonIdeologyName], включая многих пожилых людей, полностью грамотны. Мы должны и дальше всеми силами улучшать нашу страну. Будем надеяться, что следующее поколение [AFG.GetAdjective]их мыслителей принесёт нашей нации заслуженные славу и уважение!"
 r56_afghanistan.23.a:0 "Будущее государства [AFG.GetNonIdeologyName] выглядит светлым!"
 r56_afghanistan.24.t:0 "Мухаммад Амин Бугра обращается к нам"
 r56_afghanistan.24.d:0 "За зелёным Ваханским коридором, в далёкой земле, разразилась война. Сегодня на рассвете около сорока всадников прибыли в Кабул. Похоже, они пришли с востока, из охваченного войной региона Алтишахр. Измученные многодневной дорогой, но имеющие многое сообщить, они немедленно потребовали встречи с лидером [AFG.GetLeader]. После того как личности этих людей были установлены, их просьбу удовлетворили. \n\nВо главе экспедиции стоял не кто иной, как Мухаммад Амин Бугра — изгнанный лидер Восточно-Туркестанской республики. Он и несколько его сторонников преодолели сотни миль, чтобы доставить в Кабул вести о Кашгарском восстании. Вместе с этим они запросили военную поддержку для государства [KHM.GetNameDef]. \n\nВыслушав их, многие генералы и старшие офицеры [AFG.GetAdjective]ой армии посоветовали лидеру [AFG.GetLeader] оказать помощь участникам экспедиции. Наша поддержка может значить для них очень многое, ведь другой у них нет."
 r56_afghanistan.24.a:0 "Вы получите нашу полную поддержку!"
 r56_afghanistan.24.b:0 "Просто... позволим отправиться самым рьяным добровольцам. Нам не нужны неприятности..."
 r56_afghanistan.24.c:0 "Государство [AFG.GetNonIdeologyName] не должно иметь дел с такими, как вы..."
 r56_afghanistan.25.t:0 "Полёт над Памирским горным хребтом"
 r56_afghanistan.25.d:0 "На рассвете 24 августа трое отважных и решительных мужчин взялись за чрезвычайно смелую задачу — пересечь Памир. После нескольких недель подготовки эти три [GER.GetAdjective]их пилота, работающие на Lufthansa, [GER.GetAdjective]ую авиакомпанию, решили, что сегодня настал день отправиться в полёт через Памир, рассчитывая благополучно преодолеть горы и пустыни. Если всё пройдёт хорошо, они вернутся не раньше чем через две недели."
 r56_afghanistan.25.a:0 "В какие удивительные времена мы живём. Пусть их путешествие будет безопасным!"
 r56_afghanistan.26.t:0 "Исчезновение памирского рейса"
 r56_afghanistan.26.d:0 "Прошло три недели, но никаких известий о памирском рейсе нет. По нашим расчётам, самолёт должен был прибыть ещё четыре дня назад, однако этого не произошло. Впрочем, надежда остаётся: возможно, наши расчёты ошибочны, и он может вернуться в любой момент — быть может, прямо сейчас садится в Кабуле. Будем молиться за благополучное возвращение экипажа."
 r56_afghanistan.26.a:0 "О Господи, что же случилось с этими несчастными?"
 r56_afghanistan.27.t:0 "Памирский рейс приземляется в [AFG.Capital.GetCapitalVictoryPointName]!"
 r56_afghanistan.27.d:0 "Спустя месяц с экипажем памирского рейса удалось установить связь и подтвердить, что все живы и здоровы. Через несколько дней после первого радиоконтакта самолёт приземлился в Кабуле, где его экипаж встретили как национальных героев. Сегодня совершено великое достижение — состоялся первый в истории полёт через Памир!"
 r56_afghanistan.27.a:0 "Фух... по крайней мере, теперь они в безопасности."
 r56_afghanistan.27.b:0 "Их провозгласят национальными героями государства [AFG.GetNonIdeologyName]!"
 r56_afghanistan.27.c:0 "Поистине историческое достижение! Возможно, они также смогут помочь нашим военно-воздушным силам..."
 r56_afghanistan.28.t:0 "Королевская семья захвачена"
 r56_afghanistan.28.d:0 "По мере того, как отголоски пушечного огня и ружейных выстрелов исчезают в тишине, поступают сообщения о том, что королевская семья [AFG.GetNonIdeologyName]Король Захир Шах был захвачен во время попытки побега. Якобы королевская семья намеревалась бежать из страны по воздуху, но непредвиденные обстоятельства привели к тому, что их планы были сорваны Красной Армией. [AFG.GetNonIdeologyName]. В конце концов, король столкнется с последствиями своих собственных действий."
 r56_afghanistan.28.a:0 "Приготовиться... Целься... Огонь!"
 r56_afghanistan.29.t:0 "Королевская семья государства [AFG.GetNonIdeologyName] просит убежища"
 r56_afghanistan.29.d:0 "После недавнего переворота в государстве [AFG.GetNameDefCap] и окончательного падения Королевства [AFG.GetNonIdeologyName] король Захир-шах и королевская семья государства [AFG.GetNonIdeologyName] были свергнуты. К счастью, им удалось вырваться из рук коммунистов и покинуть страну, после чего они обратились к нам с просьбой предоставить убежище."
 r56_afghanistan.29.a:0 "Мы с радостью их примем!"
 r56_afghanistan.29.b:0 "Пусть отправляются дальше — для них нет места в [ROOT.Capital.GetCapitalVictoryPointName]..."
 r56_afghanistan.30.t:0 "Установлен контакт с «Джамиат-и Ислами»"
 r56_afghanistan.30.d:0 "После того как Факир был привлечён к недавней борьбе против короля, стало очевидно, что монарх окончательно превратился в номинальную фигуру, а премьер-министр Мухаммед Хашим-хан проводит явно либеральную политику. Мы обратились к «Джамиат-и Ислами», и Маудуди, известный исламистский политический деятель, согласился издать фетву против Хашим-хана, объявив его «тагутом», то есть «тираном», против которого дозволено открытое восстание."
 r56_afghanistan.30.a:0 "Фетва будет обнародована! Мы больше не потерпим этой тирании!"
 r56_afghanistan.30.b:0 "Распространять фетву осторожно, лишь среди участников восстания, чтобы не спровоцировать конфликт..."
 r56_afghanistan.31.t:0 "Племенные вожди обещают поддержку"
 r56_afghanistan.31.d:0 "Следующим шагом в разжигании антиправительственных настроений в стране станет обращение к в значительной степени изолированным племенам, почти ничего не знающим о политике государства. Пообещав промышленное развитие и более заметное политическое представительство, мы сможем заручиться их поддержкой. Однако в будущем это может привести к последствиям: если мы попытаемся провести централизацию, в некоторых областях племена могут восстать."
 r56_afghanistan.31.a:0 "Отлично!"
 r56_afghanistan.32.t:0 "Прибывают подкрепления «Джамиат-и Ислами»"
 r56_afghanistan.32.d:0 "Организация «Джамиат-и Ислами», которой мы оказали значительную поддержку в составе нашего движения сопротивления, направила нам столь необходимые многочисленные подкрепления. Исламистские силы пересекли линию Дюранда и присоединились к своим товарищам в борьбе против тиранов в Кабуле!"
 r56_afghanistan.32.a:0 "Только объединившись, мы сможем сокрушить тиранов нашего народа!"
 r56_afghanistan.33.t:0 "Прибывают подкрепления «Джамиат-и Ислами»"
 r56_afghanistan.33.d:0 "Организация «Джамиат-и Ислами», которой мы оказали значительную поддержку в составе нашего движения сопротивления, направила нам столь необходимые многочисленные подкрепления. Исламистские силы пересекли линию Дюранда и присоединились к своим товарищам в борьбе против тиранов в Кабуле!"
 r56_afghanistan.33.a:0 "Только объединившись, мы сможем сокрушить тиранов нашего народа!"
 r56_afghanistan.34.t:0 "Прибывает поддержка племён"
 r56_afghanistan.34.d:0 "Племена выполнили обещание помочь и отправили нам большое количество оружия, которое наши моджахеды смогут использовать в джихаде против правительства. Оно может быть старым, но сейчас нам пригодится всё, что удастся получить."
 r56_afghanistan.34.a:0 "Прекрасно!"
 r56_afghanistan.35.t:0 "Конституция государства [AFG.GetNonIdeologyName] — вопрос шуры"
 r56_afghanistan.35.d:0 "Шура, или «совет» на пушту, представляет собой ранний исламский принцип, предусматривающий создание совещательного органа из приближённых советников правителя — короля или эмира. На ранних этапах истории ислама такие халифаты, как Праведный халифат, учреждали советы, члены которых в трудные времена помогали правителю решать государственные вопросы.\n\nОднако на протяжении столетий так и не был окончательно решён вопрос о том, кто именно должен назначать этих советников. Одни считают, что влиять на решения правителя должна лишь богатая и могущественная элита страны. Другие полагают, что правителю следует предоставить право самому избирать собственный совет. Между тем всё большую популярность приобретает более современный подход — демократия, при которой мужчины старше двадцати пяти лет получают право голосовать за членов совета."
 r56_afghanistan.35.a:0 "Только самые умные и богатые искренне желают стране добра!"
 r56_afghanistan.35.b:0 "Это дело эмира и только эмира!"
 r56_afghanistan.35.c:0 "Современный подход явно кажется народу весьма привлекательным..."
 r56_afghanistan.36.t:0 "Конституция государства [AFG.GetNonIdeologyName] — введение шариата"
 r56_afghanistan.36.d:0 "Шариат — это божественный закон, которому должно следовать и который должно воплощать любое исламское государство или халифат, как предписано в Коране посланником Аллаха, пророком Мухаммедом, мир ему. Он включает основные гражданские, финансовые и общественные нормы, которым обязан подчиняться каждый человек, иначе ему предстоит суд исламских учёных, называемых кадиями.\n\nВ прошлом существовало множество толкований и способов применения этих законов. Три главных из них — толкование эпохи Праведного халифата, ставящее верность правителю и военную службу превыше всего для каждого дееспособного мужчины; толкование эпохи Омейядов, сосредоточенное главным образом на стремительной территориальной экспансии, управлении новыми землями и распространении ислама; и, наконец, современное толкование Османской эпохи, стремившееся объединить достижения нового времени и современные технологии с исламским учением, одновременно защищая традиционные исламские ценности и обычаи."
 r56_afghanistan.36.a:0 "Государство [AFG.GetNonIdeologyName] будет столь же праведным, как Праведный халифат!"
 r56_afghanistan.36.b:0 "Новый золотой век ислама — вот цель государства [AFG.GetNonIdeologyName]!"
 r56_afghanistan.36.c:0 "Мы стремимся соединить современные технологии с учением ислама!"
 r56_afghanistan.37.t:0 "Конституция государства [AFG.GetNonIdeologyName] — роль улемов"
 r56_afghanistan.37.d:0 "Улемы, будучи самыми образованными и религиозными людьми общества, играют чрезвычайно важную роль в любой исламской стране: порой они становятся движущей силой реформ или ведут народ через тяжёлые времена. Однако государству, и особенно его правителю, крайне важно сохранять преданность и расположение улемов.\n\nУчитывая это, страна может использовать улемов множеством способов: они могут служить государственными чиновниками и администраторами, военными реформаторами, сторонниками модернизации и наставниками; работать в финансовой сфере, включая банки и казначейства; а также играть важную роль в образовании нации и её детей."
 r56_afghanistan.37.a:0 "Администрации не помешала бы помощь..."
 r56_afghanistan.37.b:0 "Сильной и могучей стране нужна сильная и могучая армия!"
 r56_afghanistan.37.c:0 "Дети нации будут учиться только у лучших."
 r56_afghanistan.38.t:0 "Конституция государства [AFG.GetNonIdeologyName] — вопрос закята"
 r56_afghanistan.38.d:0 "Закят — основополагающий принцип ислама, согласно которому каждый трудоспособный мужчина обязан отдавать небольшую часть, около 3%, своего заработка в помощь бедным и бездомным, которые, к сожалению, не способны обеспечить себя самостоятельно.\n\nОднако собирать и распределять закят можно по-разному. Государство может ввести его в качестве дополнительного налога или сбора. Его также можно организовать напрямую силами народа — это значительно упростит исполнение и позволит обойтись без бюрократии. Наконец, возможен третий вариант: государственная организация закята в непосредственном сотрудничестве с населением, объединяющая два предыдущих предложения."
 r56_afghanistan.38.a:0 "Только государство может гарантировать, что всё будет сделано правильно!"
 r56_afghanistan.38.b:0 "Прямо и просто — посредники здесь не нужны."
 r56_afghanistan.38.c:0 "Объединение двух предложений кажется наиболее привлекательным..."
 r56_afghanistan.39.t:0 "Конституция государства [AFG.GetNonIdeologyName] — основы джихада"
 r56_afghanistan.39.d:0 "Священная борьба, или по-арабски «джихад», является одним из важнейших, если не самым важным, принципом ислама. Джихад — главное оружие любого исламского государства, что бесчисленное множество раз подтверждалось на протяжении истории.\n\nДжихад может означать не только вооружённую и физическую борьбу с врагом, но также мирное и ненасильственное сопротивление оккупанту. То, что мы признаем основой джихада, определит, восторжествует ли государство [AFG.GetNonIdeologyName] или погибнет, подобно бесчисленным империям, павшим до него..."
 r56_afghanistan.39.a:0 "Лишь военными средствами можно достичь целей нашей нации и ислама!"
 r56_afghanistan.39.b:0 "Жизнь каждого человека станет его собственным джихадом!"
 r56_afghanistan.39.c:0 "Ислам выстоял столько веков благодаря своей стойкости и продолжит стоять впредь!"
 r56_afghanistan.40.t:0 "Конституция государства [AFG.GetNonIdeologyName] составлена!"
 r56_afghanistan.40.d:0 "После бесчисленных жарких обсуждений множества вопросов — административных, общественных и военных — печать государства [AFG.GetNonIdeologyName] наконец скрепила первую в истории государства [AFG.GetNonIdeologyName] исламскую конституцию. При поддержке Лойя-джирги, шуры, кадиев и шейхов Конституция [GetYear] года немедленно введена в действие. Пусть имя государства [AFG.GetNonIdeologyName] и [AFG.GetAdjective]ого народа процветает тысячу лет и ещё тысячу лет, иншаллах!"
 r56_afghanistan.40.a:0 "Да здравствует [AFG.GetNonIdeologyName]!"
 r56_afghanistan.41.t:0 "Мирный митинг в регионе [AFG_communist_state_target.GetName]"
 r56_afghanistan.41.d:0 "По сообщениям, последний митинг партии [PER.GetCommunistParty] в регионе [AFG_communist_state_target.GetName] прошёл мирно и без происшествий. Это заметно улучшит наш образ и привлечёт многих людей к нашему делу. Остаётся лишь надеяться, что так будет и дальше!"
 r56_afghanistan.41.a:0 "Прекрасно!"
 r56_afghanistan.42.t:0 "Социалистический митинг в регионе [AFG_communist_state_target.GetName]"
 r56_afghanistan.42.d:0 "По сообщениям, последний митинг партии [PER.GetCommunistParty] в регионе [AFG_communist_state_target.GetName] прошёл относительно мирно, хотя не обошлось без происшествий. Несколько коммунистических экстремистов вступили в столкновение с оппозицией, переросшее в драку. [PER.GetAdjective]ая полиция была вынуждена вмешаться, чтобы успокоить опасную ситуацию. Нам следует проявлять осторожность и не провоцировать ожесточённую реакцию."
 r56_afghanistan.42.a:0 "Мы должны быть осторожны."
 r56_afghanistan.43.t:0 "Жестокий митинг в регионе [AFG_communist_state_target.GetName]"
 r56_afghanistan.43.d:0 "По сообщениям, последний митинг партии [PER.GetCommunistParty] в регионе [AFG_communist_state_target.GetName] обернулся катастрофой. Многие участники с обеих сторон получили травмы, некоторые — тяжёлые ранения, после чего их доставили в ближайшую больницу. Мы должны сокрушить этот экстремизм! В противном случае гражданская война в государстве [PER.GetNameDef] станет ещё вероятнее."
 r56_afghanistan.43.a:0 "Ситуация становится довольно опасной..."
 r56_afghanistan.44.t:0 "[AFG.GetNonIdeologyName] предлагает прекращение огня"
 r56_afghanistan.44.d:0 "Поскольку [AFG.GetAdjective]ие войска удерживают земли в государстве [PAK.GetNonIdeologyName], а наша неспособность нанести по ним удар привела армию к истощению, возможно, лучшим решением будет уступить контролируемые ими территории. Эти регионы всегда приносили нам лишь неприятности и к тому же слабо развиты."
 r56_afghanistan.44.a:0 "Нет! Мы продолжим сражаться до самого конца!"
 r56_afghanistan.44.b:0 "Что бы ни было лучше для страны..."
 r56_afghanistan.45.t:0 "[AFG.GetNonIdeologyName] просит военной помощи"
 r56_afghanistan.45.d:0 "Ссылаясь на необходимость защитить свою страну и народ, находящихся в крайне важном стратегическом регионе, а также на то, что не имеющее выхода к морю [AFG.GetAdjective]ое государство окружено потенциальными противниками государства [GER.GetNonIdeologyName], его правительство попросило направить [GER.GetAdjective]ие войска на свою территорию, чтобы гарантировать суверенитет, оборону страны и защиту [GER.GetAdjective]их интересов."
 r56_afghanistan.45.a:0 "Мы не можем позволить себе потерять ещё одного союзника."
 r56_afghanistan.45.b:0 "Наши войска останутся дома — там, где им и место!"
 r56_afghanistan.46.t:0 "Прибывает [GER.GetAdjective]ая военная помощь"
 r56_afghanistan.46.d:0 "[GER.GetAdjective]ое правительство согласилось направить пять отрядов вермахта для содействия нашей армии в обороне территории. Оно заявило о необходимости защитить государство [AFG.GetNonIdeologyName], подчеркнув, что [AFG.GetNonIdeologyName] имеет стратегическое значение для его дела и может стать надёжным союзником [GER.GetAdjective]их сил в регионе."
 r56_afghanistan.46.a:0 "Превосходно!"
 r56_afghanistan.47.t:0 "[GER.GetAdjective]ая сторона отклоняет нашу просьбу"
 r56_afghanistan.47.d:0 "Ссылаясь прежде всего на необходимость сосредоточиться на защите [GER.GetAdjective]ой территории, [GER.GetAdjective]ая сторона отказалась направлять войска для обороны государства [AFG.GetNameDef] и оказывать нам военную помощь в какой бы то ни было форме. Неужели именно такого союзника государство [AFG.GetNonIdeologyName] желает видеть рядом с собой?"
 r56_afghanistan.47.a:0 "Жалкое оправдание для союзника!"
 r56_afghanistan.48.t:0 "Коммунисты штурмуют регион [266.GetName]!"
 r56_afghanistan.48.d:0 "Сегодня члены партии [PER.GetCommunistParty] взяли штурмом столицу и парламент государства [PER.GetNameDef], свергли действующее правительство и провозгласили Иранскую Социалистическую Республику. Партия [PER.GetCommunistParty] заручилась такой поддержкой, что сопротивление государственному перевороту оказалось минимальным. Для партии [PER.GetRulingParty] это конец пути, но для коммунизма в государстве [PER.GetNameDef] — лишь начало."
 r56_afghanistan.48.a:0 "Трагическое поражение!"
 r56_afghanistan.50.t:0 "[AFG.GetNonIdeologyName] добивается более тесного единства"
 r56_afghanistan.50.d:0 "В связи с постоянно растущим экономическим и политическим сотрудничеством с государством [AFG.GetNonIdeologyName] его руководство предложило объединить государство [ROOT.GetNameDef] с государством [AFG.GetNameDef], ссылаясь на необходимость собрать революционное пламя Ближнего Востока под одним знаменем. Однако именно нам предстоит решить, согласиться с их требованиями или отвергнуть их."
 r56_afghanistan.50.a:0 "Блестящая идея!"
 r56_afghanistan.50.b:0 "Ни в коем случае!"
 r56_afghanistan.51.t:0 "[AFG.GetNonIdeologyName] требует пуштунские земли!"
 r56_afghanistan.51.d:0 "[AFG.GetAdjective]ое правительство потребовало передать ему контроль над регионами [444.GetName], [442.GetName] и [445.GetName]. Оно обосновывает это историческими притязаниями государства [AFG.GetNonIdeologyName] на данные земли и тем, что сегодня там проживают многие миллионы пуштунов. Ради сохранения дружественных отношений с государством [AFG.GetNonIdeologyName] нам, возможно, стоит уступить этим требованиям."
 r56_afghanistan.51.a:0 "Удовлетворить их требования."
 r56_afghanistan.51.b:0 "«Пуштунские земли»? Какая нелепость!"
 r56_afghanistan.52.t:0 "Король Аманулла возвращается"
 r56_afghanistan.52.d:0 "Поскольку условия для его возвращения стали идеальными, Аманулла-хан был приглашён обратно в государство [AFG.GetNonIdeologyName]. Он с радостью принял приглашение, намереваясь улучшить положение государства [AFG.GetNonIdeologyName] и исправить прежние ошибки, допущенные им в бытность королём государства [AFG.GetNonIdeologyName], которые в итоге привели к восстанию саккавистов в 1929 году. Он выразил благодарность Хаджи Мирзали-хану за приглашение."
 r56_afghanistan.52.a:0 "Предложить ему важную административную должность..."
 r56_afghanistan.52.b:0 "Король наконец вернулся — а вместе с ним вернётся и королевство!"
 r56_afghanistan.53.t:0 "Вторая [AFG.GetAdjective]ая гражданская война"
 r56_afghanistan.53.d:0 "На протяжении последней недели многие племенные вожди государства [AFG.GetNonIdeologyName] открыто выступали против короля и регентства, состоящего главным образом из двух его дядей — Мухаммеда Хашим-хана и Шах Махмуд-хана. По их мнению, правительство государства [AFG.GetNonIdeologyName] стало слишком современным и слишком далеко отошло от традиционных ценностей и обычаев афганского народа. Поэтому они решили начать полномасштабное восстание с целью свержения режима. Многие предполагают, что к конфликту причастен и лидер «Джамиат-и Ислами» Абул Ала Маудуди, однако никаких доказательств этому пока не найдено."
 r56_afghanistan.53.a:0 "Всегда эти [AFG.GetAdjective]цы, не так ли?"
 r56_afghanistan.53.b:0 "Смерть тиранам! Смерть королю!"
 r56_afghanistan.54.t:0 "Военное вмешательство в государство [AFG.GetNonIdeologyName]?"
 r56_afghanistan.54.d:0 "Всего несколько месяцев назад в государстве [AFG.GetNonIdeologyName] разразилась гражданская война. Причиной стало недовольство усилением государственного контроля над населением и ускоренной модернизацией. Мятежники решили положить конец предполагаемой тирании действующего правительства, после чего по всему государству [AFG.GetNonIdeologyName] вспыхнули массовые восстания. Конфликт продолжается уже довольно долго, и мы могли бы воспользоваться этим, напав на государство [AFG.GetNonIdeologyName], пока оно ослаблено и расколото. Как нам поступить?"
 r56_afghanistan.54.a:0 "Пыль уляжется сама собой."
 r56_afghanistan.54.b:0 "Материальной поддержки будет достаточно."
 r56_afghanistan.54.c:0 "Мобилизовать Красную армию!"
 r56_afghanistan.55.t:0 "Сопротивление в государстве [PAK.GetNonIdeologyName]?"
 r56_afghanistan.55.d:0 "За последние несколько недель сопротивление в государстве [PAK.GetNonIdeologyName] достигло небывалого размаха. Причина этого неизвестна, однако нашим агентам удалось связать [AFG.GetAdjective]ое правительство с движениями сопротивления в государстве [PAK.GetNonIdeologyName]: во время обыска дома подозреваемого [PAK.GetAdjective]ого бойца сопротивления был обнаружен тайник с военным снаряжением. Нам удалось подтвердить, что это оружие действительно контрабандой доставляется из государства [AFG.GetNonIdeologyName]. Продолжится ли это — неизвестно."
 r56_afghanistan.55.a:0 "Мы должны сохранять бдительность..."
 r56_afghanistan.56.t:0 "Королевское турне прибывает в Каир"
 r56_afghanistan.56.d:0 "Отплыв из Кветты, участники королевского турне прибыли в Каир, где их встретил [EGY.GetLeader]. В столице состоялся военный парад, и Аманулла приветствовал [EGY.GetAdjective]их солдат. Затем [EGY.GetLeader] и Аманулла обсудили отношения между двумя странами. Проведя неделю в Каире, королевское турне вновь отправилось в путь — на этот раз в Рим."
 r56_afghanistan.56.a:0 "Наши страны очень похожи, разве нет?"
 r56_afghanistan.57.t:0 "Королевская семья прибывает в Рим"
 r56_afghanistan.57.d:0 "Проведя неделю в Каире, королевское турне отплыло в Рим. По прибытии его участников встретили военной церемонией и лично [ITA.GetLeader]. Во время предыдущего визита в Рим король государства [ITA.GetNonIdeologyName] наградил Амануллу Высшим орденом Святого Благовещения. Аманулла также встретился с папой римским Пием XI. Короля впечатлили промышленные и технологические достижения, увиденные им в Риме. Королевское турне задержалось там надолго, однако спустя несколько недель его участники отправились в Марсель."
 r56_afghanistan.57.a:0 "Похоже, у [ITA.GetAdjective]цев нам есть чему поучиться."
 r56_afghanistan.58.t:0 "Аманулла встречается с лидером [FRA.GetLeader]"
 r56_afghanistan.58.d:0 "Около месяца назад королевское турне отправилось в Марсель, после чего его участники сели на поезд до Парижа. В Париже их встретили военным парадом, а в честь короля Амануллы дали артиллерийский салют. [FRA.GetLeader] приветствовал королевскую чету и подарил ей новейший Peugeot 202. Проведя неделю в Париже и осмотрев оживлённый город, Аманулла отправился в [GER.Capital.GetCapitalVictoryPointName]."
 r56_afghanistan.58.a:0 "Ах, дорогие [FRA.GetAdjective]цы — как всегда, изысканный вкус, роскошь и щедрость!"
 r56_afghanistan.59.t:0 "Король посещает город [GER.Capital.GetCapitalVictoryPointName]"
 r56_afghanistan.59.d:0 "После отъезда из Парижа король-германофил сел на поезд, направлявшийся в Париж. [GER.Capital.GetCapitalVictoryPointName]. После того, как прошли несколько дней, Аманулла был принят на Парижской площади, где его приветствовали. [GER.GetLeader]. Король был впечатлен [GER.GetAdjective] Военный, настолько, что он запросил доставку [GER.GetAdjective] Штальхельмс [AFG.GetNonIdeologyName]. Амануллаху было разрешено выступать в рейхстаге, где его речь была встречена с поддержкой членов правительства. [GER.GetRulingParty] и [GER.GetLeader] себя. После того, как дивились [GER.GetAdjective] Архитектура и искусство, Аманулла решил снова уйти [GER.Capital.GetCapitalVictoryPointName] для [ENG.Capital.GetCapitalVictoryPointName]."
 r56_afghanistan.59.a:0 "[GER.GetNonIdeologyName] — истинный авангард технологий и современности!"
 r56_afghanistan.60.t:0 "Аманулла прибывает в город [ENG.Capital.GetCapitalVictoryPointName]"
 r56_afghanistan.60.d:0 "После отъезда [GER.Capital.GetCapitalVictoryPointName]Королевская пара отправилась в Дувр на борту «Орлеанской девы» СС. После этого они отправились в путь. [ENG.Capital.GetCapitalVictoryPointName] где они были встречены [ENG.GetLeader]. В честь Амануллы состоялась военная церемония. Амануллах отметил, что импровизация [ENG.GetNameDef] то [AFG.GetNonIdeologyName]Как военный, так и экономический партнер.[ENG.GetLeader] согласились и заявили, что [ENG.GetNameDef] Это улучшит сотрудничество между двумя странами. Проведя несколько недель в [ENG.Capital.GetCapitalVictoryPointName]Аманулла и Королевский тур отправились в Варшаву."
 r56_afghanistan.60.a:0 "Замечательно!"
 r56_afghanistan.61.t:0 "Королевское турне посещает Варшаву"
 r56_afghanistan.61.d:0 "После их визита в [ENG.Capital.GetCapitalVictoryPointName]Королевская пара отправилась в Варшаву, куда они прибыли несколько недель спустя. В Варшаве их приветствовали [POL.GetLeader]. В честь Амануллы состоялась военная церемония. Аманулла и [POL.GetLeader] Проехал по столице на машине, обсуждая европейскую политику. Король встретился с польскими министрами, которых он искренне приветствовал. Проведя мало времени в Варшаве, Королевский тур начал свое путешествие к своему конечному пункту назначения Стамбулу."
 r56_afghanistan.61.a:0 "Варшава... это действительно было необходимо?"
 r56_afghanistan.62.t:0 "Аманулла встречается с лидером [TUR.GetLeader]"
 r56_afghanistan.62.d:0 "С последующим визитом в Варшаву, где Королевская экскурсия не проводила много времени, Аманулла уехал из Польши в Турцию. Они прибыли в Стамбул через неделю, и по прибытии их приветствовали. [TUR.GetLeader] и [TUR.GetAdjective] Солдаты на марше в честь Амануллы.[TUR.GetLeader] Он подчеркнул важность сотрудничества на Ближнем Востоке и [TUR.GetAdjective] Амбиции для региона. Аманулла в значительной степени согласен с заявлениями, сделанными [TUR.GetLeader] и открыто выразил свою поддержку дальнейшему сотрудничеству между [TUR.GetNameDef] и [AFG.GetNonIdeologyName]. Поскольку это было конечное направление Королевского тура по Европе, в Стамбуле будет проведено большое количество времени. Таким образом, через две недели Аманулла покинул Стамбул на поезде, направлявшемся в сторону Кабула."
 r56_afghanistan.62.a:0 "Наверняка время прошло превосходно!"
 r56_afghanistan.63.t:0 "Королевское турне возвращается в город [AFG.Capital.GetCapitalVictoryPointName]"
 r56_afghanistan.63.d:0 "Наконец, после шести месяцев за границей, Аманулла-хан и королева Сорайя Тарзи прибыли в Кабул. На этом европейское королевское турне завершилось. Жители Кабула приветствовали Амануллу, после чего его сопроводили во дворец Дар-уль-Аман. Проведя немало времени за рубежом, Аманулла вернулся с новыми взглядами на внутреннюю и внешнюю политику. Он поклялся превратить государство [AFG.GetNonIdeologyName] из неразвитой глуши в современную западную страну."
 r56_afghanistan.63.a:0 "Наконец король вернулся... уже другим человеком..."
 r56_afghanistan.64.t:0 "Самоопределение для региона [442.GetName]?"
 r56_afghanistan.64.d:0 "Северные земли [442.GetName]На протяжении веков, также называемая пуштунхва или афгания, была населена пуштунами. [AFG.GetAdjective]Как и раньше. Они, конечно, очень отличаются от нашего народа, и это привело к их желанию независимости уже более десяти лет. Как таковой, [AFG.GetAdjective] Он обратился к нам с просьбой о проведении референдума, на котором пуштунский народ будет жить в стране. [442.GetName] У них была бы возможность выбрать свою судьбу, будь то их пребывание в нашей стране или присоединение к ним. [AFG.GetAdjective] Братья. Однако, если мы желаем [442.GetName] Чтобы остаться нашими, нам пришлось бы пойти на большие уступки этническим пуштунам, живущим в регионе."
 r56_afghanistan.64.a:0 "Возможно, стоит провести референдум..."
 r56_afghanistan.64.b:0 "Никогда! Это наша земля!"
 r56_afghanistan.66.t:0 "Пуштуны выступают за отделение"
 r56_afghanistan.66.d:0 "После долгого и трудного процесса обсуждений пуштуны наконец решили присоединиться к государству [AFG.GetNameDef]. Лидер «Худай Хидматгаран» Абдул Гаффар-хан заявил, что благодаря обещанным нами уступкам пуштунам региона [442.GetName] и нашему культурному сходству они проголосовали за объединение с государством [AFG.GetNonIdeologyName] и последующее отделение. По сообщениям, референдум завершился убедительной победой государства [AFG.GetNonIdeologyName]: за отделение проголосовало [?AFG_percentage]% участников."
 r56_afghanistan.66.a:0 "Ещё одна великая победа государства [AFG.GetNonIdeologyName]!"
 r56_afghanistan.67.t:0 "Пуштуны выступают за союз"
 r56_afghanistan.67.d:0 "После долгого и трудного процесса обсуждений пуштуны наконец решили сохранить союз с государством [AFG.GetNameDef]. Лидер «Худай Хидматгаран» Абдул Гаффар-хан заявил, что благодаря обещанным нами уступкам пуштунам региона [442.GetName] и готовности сотрудничать с ними они проголосовали за сохранение в составе нашей страны, но с расширенной автономией. По сообщениям, референдум завершился нашей убедительной победой: за союз проголосовало [?AFG.RAJ_PAK_percentage]% участников."
 r56_afghanistan.67.a:0 "Превосходно!"
 r56_afghanistan.67.b:0 "Низ и верх — единый Афганистан!"
 r56_afghanistan.68.t:0 "Государство [FROM.GetNameDefCap] отказывает"
 r56_afghanistan.68.d:0 "Государство [FROM.GetNameDefCap] отклонило предложение о проведении референдума в регионе [442.GetName], возможно, из-за политической нестабильности или общего роста напряжённости в мировой политике. «Худай Хидматгаран» и другие движения сопротивления в регионе [442.GetName] резко осудили этот отказ."
 r56_afghanistan.68.a:0 "Позор им!"
 r56_afghanistan.68.b:0 "Низ и верх — единый Афганистан!"
 r56_afghanistan.69.t:0 "Государство [FROM.GetNameDefCap] соглашается"
 r56_afghanistan.69.d:0 "Государство [FROM.GetNameDefCap] согласилось провести референдум в регионе [442.GetName]. Это замечательная новость: вопрос региона [442.GetName] будет решён свободно и демократически, а проживающие там этнические пуштуны вновь получат право на самоопределение. Решение провести референдум получило широкую поддержку «Худай Хидматгаран» и других движений сопротивления в регионе [442.GetName]."
 r56_afghanistan.69.a:0 "Превосходно!"
 r56_afghanistan.70.t:0 "[PER.GetAdjective]ая гражданская война"
 r56_afghanistan.70.d:0 "Наша страна слишком долго страдала от нестабильности, но, как у воды есть температура кипения, так и у государства существует предел — и, похоже, мы только что его достигли. Сегодня поступили сообщения, что вооружённые движения сопротивления по всей стране подняли оружие против нашего режима во имя социализма и марксизма. Это конец пути."
 r56_afghanistan.70.a:0 "Сражаться до последнего человека!"
 r56_afghanistan.71.t:0 "Прибывает поддержка племён"
 r56_afghanistan.71.d:0 "Племена выполнили обещание помочь и отправили нам большое количество оружия, которое наши моджахеды смогут использовать в джихаде против правительства. Оно может быть старым, но сейчас нам пригодится всё, что удастся получить."
 r56_afghanistan.71.a:0 "Замечательно!"
 r56_afghanistan.72.t:0 "Сближение с государством [AFG.GetNonIdeologyName]?"
 r56_afghanistan.72.d:0 "[AFG.GetAdjective]ое правительство обратилось к нам в надежде восстановить [GetRajAdjective]-[AFG.GetAdjective]ие дипломатические отношения. Оно заявило, что государство [AFG.GetNonIdeologyName] считает государство [RAJ.GetNameDef] не врагом, а другом в региональной политике. Нам предложены договор о дружбе и взаимный пакт о ненападении. Вопрос лишь в том, разделяем ли мы взгляды [AFG.GetAdjective]ой стороны?"
 r56_afghanistan.72.a:0 "Мы должны поддерживать дружественные отношения с государством [AFG.GetNonIdeologyName]."
 r56_afghanistan.72.b:0 "Не получится, старый друг."
 r56_afghanistan.73.t:0 "Государство [AFG_country_for_pakistan_press.GetNameDefCap] соглашается"
 r56_afghanistan.73.d:0 "[AFG_country_for_pakistan_press.GetAdjective]ое правительство приняло стратегическое решение передать нам контроль над регионами [444.GetName], [442.GetName] и [445.GetName]. Оно выразило желание продолжать сотрудничество с государством [AFG.GetNonIdeologyName] и заявило, что [AFG_country_for_pakistan_press.GetAdjective]ое правительство считает государство [AFG.GetNonIdeologyName] скорее союзником, чем врагом."
 r56_afghanistan.73.a:0 "Замечательно!"
 r56_afghanistan.74.t:0 "Государство [AFG_country_for_pakistan_press.GetNameDefCap] отказывает"
 r56_afghanistan.74.d:0 "[AFG_country_for_pakistan_press.GetAdjective]ое правительство сознательно отказалось передавать нам контроль над регионами [444.GetName], [442.GetName] и [445.GetName]. Оно заявило, что эти земли по праву принадлежат государству [AFG_country_for_pakistan_press.GetNameDef], но выразило надежду, что решение не повредит [AFG.GetAdjective]-[AFG_country_for_pakistan_press.GetAdjective]им отношениям."
 r56_afghanistan.74.a:0 "Плохой выбор."
 r56_afghanistan.75.t:0 "Прибывает [GER.GetAdjective]ая поддержка"
 r56_afghanistan.75.d:0 "Сегодня в государство [AFG.GetNonIdeologyName] из государства [GER.GetNonIdeologyName] прибыло несколько партий оружия и боеприпасов. Вместе с ними прибыли многочисленные солдаты вермахта и агенты [GER.GetAdjective]ого абвера, а также Карл Август фон Габленц — знаменитый [GER.GetAdjective]ий военный лётчик, прибывший в государство [AFG.GetNonIdeologyName]. Племенные воины уже приветствовали крайне необходимую помощь: они сообщают о нехватке снаряжения для продолжения войны и выражают благодарность [GER.GetAdjective]ой стороне."
 r56_afghanistan.75.a:0 "Это было крайне необходимо!"
 r56_afghanistan.76.t:0 "[PER.GetAdjective]ая гражданская война"
 r56_afghanistan.76.d:0 "В результате поразительного поворота событий Персия оказалась охвачена ожесточённой гражданской войной: коммунистические повстанцы вступили в столкновения с правительственными войсками. Конфликт, вспыхнувший несколько дней назад, ещё сильнее усложнил и без того хаотичную международную обстановку. Нам предстоит решить, вмешаться ли ради защиты своих интересов в регионе или остаться в стороне."
 r56_afghanistan.76.a:0 "Мобилизовать Красную армию!"
 r56_afghanistan.76.b:0 "Это их внутреннее дело."
 r56_afghanistan.77.t:0 "[SOV.GetAdjective]ие войска вступают в Персию"
 r56_afghanistan.77.d:0 "Совершив смелый и неожиданный шаг, [SOV.GetAdjective]ие войска вошли в северные регионы государства [PER.GetNameDef]. Вторжение, начавшееся несколько дней назад, потрясло дипломатические круги и вызвало опасения относительно геополитических последствий для региона. Государство [SOV.GetNameDefCap] объясняет операцию стратегическими причинами: необходимостью обезопасить жизненно важные пути снабжения, захватить крупные северные нефтяные месторождения и защитить собственные запасы нефти в Баку."
 r56_afghanistan.77.a:0 "Революция распространяется."
 r56_afghanistan.77.b:0 "Им просто приглянулась нефть!"
 r56_afghanistan.77.c:0 "Слава революции!"
 r56_afghanistan.78.t:0 "Государство [FROM.GetNameDefCap] соглашается"
 r56_afghanistan.78.d:0 "[FROM.GetAdjective]ое правительство приняло наше предложение о примирении в надежде улучшить [FROM.GetAdjective]-[AFG.GetAdjective]ие дипломатические отношения. Оно заявило, что государство [FROM.GetNameDef] считает государство [AFG.GetNonIdeologyName] не врагом, а другом в региональной политике. Нам предложены договор о дружбе и взаимный пакт о ненападении. Мир на линии Дюранда будет сохранён!"
 r56_afghanistan.78.a:0 "Замечательно."
 r56_afghanistan.79.t:0 "Государство [FROM.GetNameDefCap] отказывает"
 r56_afghanistan.79.d:0 "[FROM.GetAdjective]ое правительство отклонило наше предложение о примирении, возможно, из-за политической нестабильности или его нынешнего отношения к государству [AFG.GetNonIdeologyName]. Оно не дало ясного ответа относительно сотрудничества с государством [AFG.GetNonIdeologyName] и своих политических амбиций в регионе. Посмотрим, что принесёт будущее..."
 r56_afghanistan.79.a:0 "Следует сохранять осторожность!"
 r56_afghanistan.80.t:0 "Открыты школы в регионе [AFG_illiteracy_state.GetName]"
 r56_afghanistan.80.d:0 "После многих месяцев изнурительного труда завершилось строительство школ и образовательных учреждений в регионе [AFG_illiteracy_state.GetName]. Лидер [AFG.GetLeader] и министр образования господин Ахмед Али-хан сочли своим долгом посетить регион [AFG_illiteracy_state.GetName] и отметить это событие, лично открыв одну из главных школ — среднюю школу города [AFG_illiteracy_state.GetCapitalVictoryPointName]. Таким образом, государство [AFG.GetNonIdeologyName] стало ещё на шаг ближе к искоренению неграмотности."
 r56_afghanistan.80.a:0 "Прекрасные новости!"
 r56_afghanistan.81.t:0 "Субхас Чандра Бос исчезает"
 r56_afghanistan.81.d:0 "После недавнего освобождения из тюрьмы Субхас Чандра Бос больше ни разу не появлялся на публике. Когда [ROOT.GetAdjective]ая полиция посетила его дом, тот оказался пуст, а личные вещи Боса исчезли. Быть может, дом подвергся налёту, а самого Боса похитили? Или же это хитроумный план побега при содействии [GER.GetAdjective]ой стороны?"
 r56_afghanistan.81.a:0 "Вот мерзавец!"
 r56_afghanistan.82.t:0 "Побег Субхаса Чандры Боса"
 r56_afghanistan.82.d:0 "После его освобождения из тюрьмы не так давно мы получили информацию от [RAJ.GetNameDef] Суббхас Чандра Бозе сбежал и направляется к [GER.GetNonIdeologyName]. Последний раз его видели, когда он был в Калькутте, у себя дома.[GetRajAdjective] Власти сообщили нам, что Суббхас Чандра Бозе может попытаться сбежать через [AFG.GetNonIdeologyName] Для того, чтобы добраться до [GER.GetNonIdeologyName]. Говорят, что он замаскировал себя как член племени пуштунов и сопровождает его с помощью... [GER.GetAdjective] Абвер. Должны ли мы оставаться начеку у Бозе или закрывать глаза на ситуацию?"
 r56_afghanistan.82.a:0 "Закрыть глаза."
 r56_afghanistan.82.b:0 "Усилить полицейское присутствие — его необходимо арестовать!"
 r56_afghanistan.82.c:0 "Мы завербуем его."
 r56_afghanistan.83.t:0 "Субхас Чандра Бос прибывает в государство [ROOT.GetNameDef]"
 r56_afghanistan.83.d:0 "При поддержке наших тайных агентов и других связных [RAJ.GetAdjective]ий революционер Субхас Чандра Бос добрался до государства [ROOT.GetNameDef]. Он предложил помочь нам во вторжении в государство [RAJ.GetNameDef], поскольку желает освободить государство [RAJ.GetNonIdeologyName] под своим руководством. Вопрос лишь в том, стоит ли доверять Босу? В конце концов, он может оказаться [RAJ.GetAdjective]им шпионом, пытающимся проникнуть в наши ряды!"
 r56_afghanistan.83.a:0 "Мы рады его принять."
 r56_afghanistan.83.b:0 "Нам не нужна его помощь."
 r56_afghanistan.84.t:0 "Субхас Чандра Бос схвачен"
 r56_afghanistan.84.d:0 "При попытке бежать из государства [RAJ.GetNameDef] через государство [AFG.GetNonIdeologyName] Субхас Чандра Бос и сопровождавшие его люди были захвачены неподалёку от Мазари-Шарифа. [RAJ.GetAdjective]ий революционер направлялся в Европу, чтобы помочь врагам государства [RAJ.GetNameDef] в их борьбе. Теперь нам предстоит решить: передать Боса [GetRajAdjective]им властям или позволить ему продолжить путь, тем самым помогая ему и врагам [RAJ.GetAdjective]ой стороны?"
 r56_afghanistan.84.a:0 "Передать его [GetRajAdjective]им властям."
 r56_afghanistan.84.b:0 "Отпустить его."
 r56_afghanistan.85.t:0 "Субхас Чандра Бос захвачен [AFG.GetAdjective]ими властями"
 r56_afghanistan.85.d:0 "Во время путешествия через государство [AFG.GetNonIdeologyName] Субхас Чандра Бос был задержан [AFG.GetAdjective]ими властями. Они решили как можно скорее передать его [ROOT.GetAdjective]им властям. Мы должны быть благодарны за то, что [AFG.GetAdjective]ая полиция сохранила бдительность и успешно выполнила задачу по захвату Боса."
 r56_afghanistan.85.a:0 "Немедленно заключить его в тюрьму!"
 r56_afghanistan.86.t:0 "Субхас Чандра Бос прибывает в государство [FROM.GetNameDef]"
 r56_afghanistan.86.d:0 "Последние несколько месяцев Субхас Чандра Бос путешествовал, стремясь наконец добраться до государства [FROM.GetNameDef] и обратиться к нему за помощью. К сожалению, он достиг своей цели и теперь сотрудничает с [FROM.GetAdjective]ими военными и верховным командованием. Многие [RAJ.GetAdjective]ие политики уже заявили о поддержке Боса, и их число продолжает расти. Это серьёзно дестабилизировало страну: многие бегут и присоединяются к Босу и его Тигриному легиону!"
 r56_afghanistan.86.a:0 "Ладно..."
 r56_afghanistan.86.b:0 "Будь он проклят!"
 r56_afghanistan.87.t:0 "Внутренний кризис"
 r56_afghanistan.87.d:0 "С каждым днём положение в государстве [AFG.GetNonIdeologyName] становится всё тревожнее. По всей стране проходят протесты и публичные осуждения правительства и короля, а государство, похоже, движется по опасному пути войны и кровопролития. Многие племена, особенно хазарейцы, крайне недовольны тяжёлыми налогами и усиленной мобилизацией своих соплеменников. Похоже, именно это стало последней каплей. \n\nСможет ли государство [AFG.GetNonIdeologyName] оправиться и избежать ненужного кровопролития или история вновь повторится?"
 r56_afghanistan.87.a:0 "Собирается буря..."
 r56_afghanistan.88.t:0 "Вооружённые столкновения в регионе [1009.GetName]"
 r56_afghanistan.88.d:0 "Несколько дней назад несколько сотен хазарейских племенных воинов вступили в столкновение с местной полицией в регионе [1009.GetName]. Около 24 полицейских и военнослужащих погибли, ещё многие были ранены в бою с, по сообщениям, хорошо вооружёнными хазарейцами. Причина этих внезапных и жестоких столкновений пока неизвестна, однако вероятным поводом могли стать недавно введённые тяжёлые налоги, подтолкнувшие их к открытому сопротивлению режиму."
 r56_afghanistan.88.a:0 "Ветер стихает..."
 r56_afghanistan.89.t:0 "Грабительские набеги в Газни"
 r56_afghanistan.89.d:0 "Из-за усиленного и тяжёлого налогообложения местного населения Газни племена вазиров совершили несколько грабительских набегов на близлежащие города и поселения, разоряя [AFG.GetAdjective]ую сельскую местность. Во время их долгого и кровавого похода множество мирных жителей было хладнокровно убито, ограблено и оставлено гнить. Тяжёлые времена требуют тяжёлых решений и ещё более суровых мер..."
 r56_afghanistan.89.a:0 "Начинается дождь..."
 r56_afghanistan.90.t:0 "Возвращение короля Амануллы?"
 r56_afghanistan.90.d:0 "С учетом условий жизни и уровня жизни в [AFG.GetNonIdeologyName] Каждую секунду, и король несет прямую ответственность за это, народ нуждается в герое, спасителе! Таким образом, шепоты и слухи о возвращении царя Амануллы [AFG.GetNonIdeologyName] Несколько дней назад они распространились по всей стране как лесной пожар. Хотя это не подтверждено, возвращение Амануллы все еще очень вероятно и из-за племенного сопротивления и беспорядков, наложенных на страну, с некоторыми племенными лидерами, хотя парадоксально, выступающими за господство Амануллаха. [AFG.GetNonIdeologyName]."
 r56_afghanistan.90.a:0 "Луч света?"
 r56_afghanistan.91.t:0 "Верность Дауд-хана?"
 r56_afghanistan.91.d:0 "Поддержка короля ослабевает во всех политических сферах государства [AFG.GetNonIdeologyName]. Армия, некогда оплот Баракзаев, политизировалась и обрела значительную независимость от центрального правительства и короля. Поэтому возникает вопрос о её верности. Многие [AFG.GetAdjective]ие офицеры и генералы связаны с местным населением и племенами, а потому легко поддаются подкупу или убеждению. Ходят слухи, что Мухаммед Дауд-хан, губернатор Нангархара и генерал Королевской [AFG.GetAdjective]ой армии, планирует свергнуть правительство. Можно ли доверять армии?"
 r56_afghanistan.91.a:0 "Буря закончилась?"
 r56_afghanistan.92.t:0 "Союз с государством [PAK.GetNonIdeologyName]?"
 r56_afghanistan.92.d:0 "После недавнего создания государства [PAK.GetNameDef] и последовавшего начала Индо-[PAK.GetAdjective]ой войны лидер [PAK.GetLeader] обратился к государству [AFG.GetNameDef] с предложением военного союза для победы над [RAJ.GetAdjective]ой стороной. Следует ли нам объединиться с [PAK.GetAdjective]им правительством?"
 r56_afghanistan.92.a:0 "Едины как один!"
 r56_afghanistan.92.b:0 "В этом нет необходимости."
 r56_afghanistan.93.t:0 "Государство [FROM.GetNameDefCap] требует подчинения"
 r56_afghanistan.93.d:0 "Государство [FROM.GetNameDef] под руководством лидера [FROM.GetLeader] следует панисламистской доктрине и стремится объединить всех последователей слова Аллаха и его единственного посланника Мухаммеда под одним знаменем. Теперь государство [FROM.GetNameDef] официально потребовало нашего подчинения, оправдывая агрессивные действия общей верой и другими сходствами. Принять или отвергнуть требования — вот вопрос."
 r56_afghanistan.93.a:0 "Какие нелепые требования!"
 r56_afghanistan.93.b:0 "Сегодня братская кровь не прольётся."
 r56_afghanistan.94.t:0 "Государство [FROM.GetNameDefCap] отвергает подчинение"
 r56_afghanistan.94.d:0 "После нашего требования подчинить государство [FROM.GetNameDef] [FROM.GetAdjective]ое правительство отказалось и назвало наши условия нелепыми. Это вопиющий позор — мы должны немедленно действовать!"
 r56_afghanistan.94.a:0 "Пусть Аллах приведёт нас к победе!"
 r56_afghanistan.95.t:0 "Государство [FROM.GetNameDefCap] принимает подчинение"
 r56_afghanistan.95.d:0 "После нашего требования подчинить государство [FROM.GetNameDef] [FROM.GetAdjective]ое правительство согласилось, вероятно, из-за нашего военного превосходства или политического давления и влияния на его руководство. Это ещё одна победа мусульман всего мира."
 r56_afghanistan.95.a:0 "Под властью Аллаха мы объединимся!"
 r56_afghanistan.96.t:0 "Объединение исламского мира"
 r56_afghanistan.96.d:0 "Следуя панисламистской доктрине под руководством лидера [FROM.GetLeader] и стремясь объединить всех последователей слова Аллаха и его единственного посланника Мухаммеда под одним знаменем, государство [AFG.GetNonIdeologyName] заявило притязания на все области, населённые преимущественно мусульманами и некогда входившие в Праведный халифат! Аллах проведёт нас через битвы и борьбу с империалистами! Мы — истинные наследники Мухаммеда!"
 r56_afghanistan.96.a:0 "Аллаху акбар!"
 r56_afghanistan.97.t:0 "Восстановление [From.GetNameDef]"
 r56_afghanistan.97.d:0 "С этим [From.GetOldAdjective] После продолжающегося стремления правительства объединить всех мусульман, многие, включая правительственных чиновников, призывают к официальному восстановлению давно забытой империи. [From.GetNameDef]. Таким образом, [From.GetLeader]Прямым потомком Пророка Мухаммада (мир ему и благословение Аллаха) было принято решение поддаться давлению народа и официально провозгласило восстановление церкви. [From.GetNameDef] и его последующей интронизации в качестве своего халифа.[From.GetOldAdjective] Официальные лица подтвердили, что официальное название страны должно быть изменено на \".[From.GetNameDef]'."
 r56_afghanistan.97.a:0 "Мечта аль-Афгани осуществилась."
 r56_afghanistan.97.b:0 "Приведёт ли это к прочному миру в регионе?"
 r56_afghanistan.97.c:0 "Долго это не продлится!"
 r56_afghanistan.98.t:0 "Государство [FROM.GetNameDefCap] требует земли"
 r56_afghanistan.98.d:0 "Государство [FROM.GetNameDef] под руководством лидера [FROM.GetLeader] следует панисламистской доктрине и стремится объединить всех последователей слова Аллаха и его единственного посланника Мухаммеда под одним знаменем. Теперь государство [FROM.GetNameDef] официально потребовало вывода наших войск из Сирии и последующей передачи Сирии государству [FROM.GetNameDefCap]. Принять или отвергнуть требования — вот вопрос."
 r56_afghanistan.98.a:0 "Какие нелепые требования!"
 r56_afghanistan.98.b:0 "Нам придётся уступить..."
 r56_afghanistan.99.t:0 "Государство [FROM.GetNameDefCap] отвергает требования"
 r56_afghanistan.99.d:0 "После нашего требования передать мусульманские земли государства [FROM.GetNameDef] [FROM.GetAdjective]ое правительство отказалось. Это вопиющий позор — мы должны немедленно действовать и забрать эти земли самостоятельно!"
 r56_afghanistan.99.a:0 "Прискорбно..."
 r56_afghanistan.99.b:0 "Это означает войну!"
 r56_afghanistan.100.t:0 "Государство [FROM.GetNameDefCap] уступает требованиям"
 r56_afghanistan.100.d:0 "После нашего требования передать мусульманские земли государства [FROM.GetNameDef] [FROM.GetAdjective]ое правительство согласилось, вероятно, из-за нашего военного превосходства либо политического давления и влияния на его руководство. Это ещё одна победа мусульман всего мира."
 r56_afghanistan.100.a:0 "Под властью Аллаха мы объединимся!"
 r56_afghanistan.101.t:0 "Государство [FROM.GetNameDefCap] требует земли"
 r56_afghanistan.101.d:0 "Государство [FROM.GetNameDef] под руководством лидера [FROM.GetLeader] следует панисламистской доктрине и стремится объединить всех последователей слова Аллаха и его единственного посланника Мухаммеда под одним знаменем. Теперь государство [FROM.GetNameDef] официально потребовало вывода наших войск из Сирии и последующей передачи Сирии государству [FROM.GetNameDefCap]. Принять или отвергнуть требования — вот вопрос."
 r56_afghanistan.101.a:0 "Какие нелепые требования!"
 r56_afghanistan.101.b:0 "Нам придётся уступить..."
 r56_afghanistan.102.t:0 "Государство [FROM.GetNameDefCap] уступает требованиям"
 r56_afghanistan.102.d:0 "После нашего требования передать мусульманские земли государства [FROM.GetNameDef] [FROM.GetAdjective]ое правительство согласилось, вероятно, из-за нашего военного превосходства либо политического давления и влияния на его руководство. Это ещё одна победа мусульман всего мира."
 r56_afghanistan.102.a:0 "Под властью Аллаха мы объединимся!"
 r56_afghanistan.103.t:0 "Государство [FROM.GetNameDefCap] принимает мир"
 r56_afghanistan.103.d:0 "После того как наши требования о полном прекращении огня и постепенном переходе к миру между государствами [FROM.GetNameDefCap] и [ROOT.GetNameDefCap] достигли [FROM.GetAdjective]ого правительства, [FROM.GetAdjective]ое правительство решило согласиться, вероятно, из-за нашего военного превосходства и давления, которому подверглось его руководство. Это ещё одна победа государства [AFG.GetNonIdeologyName]!"
 r56_afghanistan.103.a:0 "Блаженны миротворцы!"
 r56_afghanistan.104.t:0 "Государство [FROM.GetNameDefCap] отвергает мир"
 r56_afghanistan.104.d:0 "После того как наши требования о полном прекращении огня и постепенном переходе к миру между государствами [FROM.GetNameDefCap] и [ROOT.GetNameDefCap] достигли [FROM.GetAdjective]ого правительства, [FROM.GetAdjective]ое правительство решило отказаться. Вероятно, оно считает свою армию сильнее нашей и потому не видит причин заключать мир."
 r56_afghanistan.104.a:0 "Мудро это или нет, выбор сделан."
 r56_afghanistan.105.t:0 "Вторая [AFG.GetAdjective]ая гражданская война"
 r56_afghanistan.105.a:0 "Всегда эти [AFG.GetAdjective]цы, не так ли?"
 r56_afghanistan.105.b:0 "Долой короля! Да здравствует пролетариат!"
 r56_afghanistan.105.d:0 "На протяжении последней недели военные лидеры государства [AFG.GetNonIdeologyName] открыто выступали против короля и регентства, состоящего главным образом из двух его дядей — Мухаммеда Хашим-хана и Шах Махмуд-хана. По их мнению, правительство государства [AFG.GetNonIdeologyName] стало слишком отсталым как политически, так и экономически и не планирует никакой модернизации. Поэтому они решили начать полномасштабную революцию, свергнуть режим и установить социалистическую республику. Многие подозревают, что [SOV.GetAdjective]ие силы участвовали в разжигании конфликта, однако доказательств пока не найдено."
 r56_afghanistan.106.t:0 "Прибывает [SOV.GetAdjective]ая поддержка"
 r56_afghanistan.106.a:0 "Мы у вас в долгу, товарищи!"
 r56_afghanistan.106.d:0 "Пока государство [AFG.GetNonIdeologyName] погружается в пламя, а вся страна мобилизована, чтобы сражаться и умирать за одну из сторон, [SOV.GetAdjective]ая сторона, как и было обещано, направила нам крайне ценную помощь, способную переломить ход Второй афганской гражданской войны! Среди поддержки — множество [SOV.GetAdjective]их добровольцев, присоединившихся к нашему делу, а также военное снаряжение для борьбы с лоялистами!"
 r56_afghanistan.107.t:0 "Нисар Мухаммад Юсуфзай присоединяется к нашему делу"
 r56_afghanistan.107.a:0 "Кто любит родину, тот будет сражаться за ДРА!"
 r56_afghanistan.107.d:0 "Пока государство [AFG.GetNonIdeologyName] погружается в пламя, а вся страна мобилизована, чтобы сражаться и умирать за одну из сторон, Нисар Мухаммад Юсуфзай — афганец, сражавшийся во Второй англо-афганской войне и посвятивший жизнь коммунизму и развитию Таджикистана, — решил присоединиться к нам и помочь в борьбе против лоялистов!"
 r56_afghanistan.108.t:0 "Формирование Национального фронта!"
 r56_afghanistan.108.a:0 "Великая угроза или великая возможность — кто знает?"
 r56_afghanistan.108.d:0 "После легализации профсоюзов Союз студентов Кабульского университета открыто поддержал партию [AFG.GetCommunistParty]. Это значительно укрепило партию [AFG.GetCommunistParty] и побудило Абдуррахмана Махмуди, лидера «халькистов», вступить в коалицию с партией [AFG.GetDemocraticParty], получившую название Национальный фронт. Его участники стремятся демократизировать страну и предоставить права меньшинствам государства [AFG.GetNonIdeologyName], включая таджиков и узбеков, чтобы по-настоящему объединить государство [AFG.GetNonIdeologyName]."
 r56_afghanistan.109.t:0 "Кризис вокруг линии Дюранда!"
 r56_afghanistan.109.a:0 "Это вызывает тревогу..."
 r56_afghanistan.109.d:0 "В течение последнего года напряжённость между мусульманским урдуязычным населением северо-западной Индии и индуистскими хиндиязычными регионами Индии постоянно возрастала. Она достигла предела после провозглашения независимости и создания к югу от государства [AFG.GetNonIdeologyName] нового государства под названием Пакистан. [RAJ.GetAdjective]ое правительство объявило декларацию независимости незаконной, после чего на Индийском субконтиненте началась открытая война. Миллионы людей были вынуждены покинуть дома: индуисты бегут через границу в Индию, а мусульмане с индуистской стороны — в обратном направлении.\n\nЭтот конфликт имеет решающее значение для будущего государства [AFG.GetNonIdeologyName], поскольку преимущественно пуштунские регионы [442.GetName] и, в некоторой степени, [445.GetName] составили значительную часть нового Пакистана. Война может предоставить государству [AFG.GetNonIdeologyName] шанс наконец объединить пуштунов в одном государстве и получить столь необходимый выход к морю, что упростит международную торговлю и принесёт огромную пользу [AFG.GetAdjective]ой экономике. Какую сторону должно занять государство [AFG.GetNonIdeologyName] в это хаотичное для региона время?"
 r56_afghanistan.200.t:0 "Послезавтрашний [GetYear] Гражданская война"
 r56_afghanistan.200.a:0 "Это вызывает тревогу..."
 r56_afghanistan.200.d:0 "После завершения гражданской войны [GetYear] года по всей стране начались празднования победы Красной армии над роялистами. Однако преждевременное ликование может оказаться опасным: эта победа знаменует не конец, а начало новой борьбы государства с собственным народом. Уже поступают сообщения о племенных силах, создающих очаги сопротивления по всему государству [AFG.GetNonIdeologyName]. Лишь время покажет, что ждёт нашу нацию..."
 AFG_first_loya_jirga:0 "Лойя-джирга [GetYear] года"
 AFG_first_loya_jirga_desc:0 "Лойя-джирга, что в дословном переводе с пушту означает «Великий совет», — древний и примитивный способ решения вопросов в государстве [AFG.GetNonIdeologyName]. Обычно Лойя-джиргу созывает глава государства, желающий заручиться поддержкой реформ или коронации. В ней участвуют племенные вожди со всего государства [AFG.GetNonIdeologyName], каждый из которых представляет своё племя и отстаивает собственные интересы..."
 AFG_handle_the_king:0 "Разобраться с королём"
 AFG_handle_the_king_desc:0 "С королём что-то не так... Чувствуется, что он изменился... Его больше нельзя назвать безразличным к политике королевства. Более того, он сам продвигает многие реформы, предложенные на Лойя-джирге. Возможно, его взгляды слишком современны, слишком амбициозны и слишком опасны для стабильности этой бедной страны. Нужно что-то предпринять..."
 AFG_power_to_the_king:0 "Власть королю"
 AFG_power_to_the_king_desc:0 "Проходят дни, месяцы и годы, а народу государства [AFG.GetNonIdeologyName] кажется, что ничего не меняется и не изменится, пока сами люди не захотят перемен. Перемены — мать всякого добра и зла, а значит, если ничего не меняется, никто не пострадает, верно? Так идёт время, а существующий порядок сохраняется..."
 AFG_begin_westernization:0 "Продолжить первый семилетний план"
 AFG_begin_westernization_desc:0 "Если [AFG.GetNonIdeologyName] не модернизирует свое сельское хозяйство и не индустриализируется, его экономика останется зависимой от других стран, что может, в свою очередь, поставить под угрозу [AFG.GetNonIdeologyName]Независимость. Индустриализация имеет решающее значение для выживания нашего государства и улучшения нашей экономики."
 AFG_start_the_second_seven_year_plan:0 "Начать второй семилетний план"
 AFG_start_the_second_seven_year_plan_desc:0 ""
 AFG_import_electronics:0 "Импорт электроники"
 AFG_import_electronics_desc:0 "[AFG.GetNameDefCap] Необходимо импортировать электронику из других стран, таких как США. [GER.GetName] или [SOV.GetName] Если мы хотим улучшить наши общественные работы и администрирование, а также учиться на технологиях, которые нам даны."
 AFG_rural_schools:0 "Улучшить сельское образование"
 AFG_rural_schools_desc:0 "Сельские районы, которые не связаны с Кабулом и центральной администрацией [AFG.GetNameDefCap] Они являются основными участниками проблемы неграмотности, которая [AFG.GetNameDefCap] В настоящее время мы должны улучшить наши методы обучения в сельской местности."
 AFG_develop_hydroelectric_power:0 "Развивать гидроэнергетику"
 AFG_develop_hydroelectric_power_desc:0 ""
 AFG_aquire_foreign_machinery:0 "Приобрести иностранное оборудование"
 AFG_aquire_foreign_machinery_desc:0 ""
 AFG_improve_national_infra:0 "Улучшить национальную инфраструктуру"
 AFG_improve_national_infra_desc:0 ""
 AFG_bolster_the_textile_industry:0 "Укрепить текстильную промышленность"
 AFG_bolster_the_textile_industry_desc:0 "[AFG.GetNonIdeologyName] До Гражданской войны 1929 года и падения Амануллы Хана существовала значительная текстильная промышленность. Возрождение и укрепление текстильной промышленности может оказаться жизненно важной связью с успехом в улучшении качества жизни. [AFG.GetAdjective] Экономика!"
 AFG_monopolize_the_karakul_trade:0 "Монополизировать торговлю каракулем"
 AFG_monopolize_the_karakul_trade_desc:0 ""
 AFG_railroad_development:0 "Связать страну"
 AFG_railroad_development_desc:0 "[AFG.GetNameDefCap] Мы должны работать над улучшением железнодорожной сети, если мы хотим сделать экономику более эффективной и сохранить поток товаров."
 AFG_expand_university:0 "Расширить Кабульский университет"
 AFG_expand_university_desc:0 "[AFG.GetNonIdeologyName]Кабульский университет открыт с 1932 года, в нем учатся многие студенты. В этой стране высокий спрос на образование, который мы должны удовлетворить. Расширение Университета Кабула - хорошее место для начала."
 AFG_expand_the_directorate_of_mines:0 "Расширить Горное управление"
 AFG_expand_the_directorate_of_mines_desc:0 "[AFG.GetNameDefCap] Мы очень богаты такими ресурсами, как сталь, нефть и хром, можем использовать это в своих интересах и приглашать иностранные компании приезжать на эти земли и добывать наши ресурсы, тем самым улучшая нашу экономику."
 AFG_explore_helmand_uranium_deposits:0 "Исследовать урановые залежи Гильменда"
 AFG_explore_helmand_uranium_deposits_desc:0 ""
 AFG_rejuvenate_the_gold_mines:0 "Возродить золотые рудники"
 AFG_rejuvenate_the_gold_mines_desc:0 ""
 AFG_intensify_copper_mining:0 "Усилить добычу меди"
 AFG_intensify_copper_mining_desc:0 ""
 AFG_womens_education:0 "Женское образование"
 AFG_womens_education_desc:0 "В настоящее время все афганские школы в стране принимают только мужчин, причем около 80-90% школ являются общемужскими школами. [AFG.GetNonIdeologyName] Тоже самое."
 AFG_afghanistan_bank:0 "Открыть Банк государства [AFG.GetNonIdeologyName]"
 AFG_afghanistan_bank_desc:0 "[AFG.GetNameDefCap]Банковский сектор не видел большого улучшения в течение многих лет в прошлом, с открытием «День» [AFG.GetNonIdeologyName] Банк, новый центральный банк страны, мы сможем улучшить наш банковский сектор и экономику."
 AFG_free_trade_focus:0 "Откройте рынки"
 AFG_free_trade_focus_desc:0 "[AFG.GetNameDefCap] На протяжении большей части своей истории она была очень изолированным государством, и пришло время изменить это. [AFG.GetNonIdeologyName] Мы должны открыть свои рынки для всего мира, если хотим привлечь больше инвесторов и людей."
 AFG_coffee_plantations:0 "Кофейные плантации"
 AFG_coffee_plantations_desc:0 "[AFG.GetNonIdeologyName] Это идеальное место для кофейных плантаций, и многие из них — это то, что нам нужно, мы должны использовать нашу землю в полной мере, если мы хотим улучшить нашу экономику."
 AFG_begin_rearmament:0 "Начать перевооружение"
 AFG_begin_rearmament_desc:0 ""
 AFG_establish_ammunition_factories:0 "Обновить заводы боеприпасов"
 AFG_establish_ammunition_factories_desc:0 ""
 AFG_kabul_arsenal:0 "Возродить Кабульский арсенал"
 AFG_kabul_arsenal_desc:0 "[AFG.GetNonIdeologyName] Не хватает квалифицированного персонала и ресурсов, необходимых для производства военной техники. Однако мы должны работать над улучшением наших военных производственных возможностей, поскольку это позволило бы нам получить большую автономию от иностранных держав, которые действовали как единственный источник оружия для военных целей. [AFG.GetNonIdeologyName]."
 AFG_the_nomad_population:0 "Интегрировать кочевое население"
 AFG_the_nomad_population_desc:0 "Есть много людей в [AFG.GetNonIdeologyName] Они отвергли современный образ жизни. Эти кочевники составляют большой процент населения, однако в экономике они не участвуют. [AFG.GetNonIdeologyName]. Таким образом, было бы разумно, наконец, включить большое количество кочевников в экономику, тем самым сделав ее сильнее."
 AFG_afghan_miracle:0 "[AFG.GetAdjective]ое чудо"
 AFG_afghan_miracle_desc:0 "После многих лет медленного инвестирования в нашу экономику и руководства ею в эти трудные времена. [AFG.GetNameDefCap] Он стал сильнее, чем когда-либо, с чем-то, чтобы показать это!"
 AFG_afghan_royal_army:0 "[GetAfghanArmyFocusName]"
 AFG_afghan_royal_army_desc:0 "[GetAfghanArmyFocusDesc]"
 AFG_afghan_royal_army_army:0 "Королевская [AFG.GetAdjective]ая армия"
 AFG_afghan_royal_army_army_desc:0 "Королевский [AFG.GetAdjective] Армия стара, как [AFG.GetNameDef] Сама она и была основана еще в 18 веке. Королевская армия [AFG.GetNonIdeologyName] В прошлом он сталкивался со многими проблемами. Он воевал и выиграл много войн, таких как Третья англо-афганская война. [AFG.GetNonIdeologyName] Он получил независимость и изгнал [ENG.GetAdjective]!"
 AFG_afghan_army_focus:0 "[AFG.GetAdjective]ие вооружённые силы"
 AFG_afghan_army_focus_desc:0 "The [AFG.GetAdjective] Вооруженные силы стары, как [AFG.GetNameDef] Сама она и была основана еще в 18 веке. The [AFG.GetAdjective] В прошлом вооруженные силы сталкивались со многими проблемами. Они воевали и выиграли много войн, таких как Третья англо-афганская война. [AFG.GetNonIdeologyName] Он получил независимость и изгнал [ENG.GetAdjective]!"
 AFG_army_modernization:0 "Продолжить модернизацию армии"
 AFG_army_modernization_desc:0 "The [GetAfghanArmyFocusName] имеет устаревшее оборудование, не имеет обученных солдат и в целом находится в тяжелом состоянии. Военная реформа необходима для развития [GetAfghanArmyFocusName] В современную армию, которая сможет взять на себя даже самые технологически продвинутые армии мира. Настало время модернизации!"
 AFG_army_status_quo:0 "Сохранить статус-кво"
 AFG_army_status_quo_desc:0 "Суровые и быстрые изменения в [AFG.GetNameDefCap] Было доказано, что это привело к множеству ужасных последствий, в которых погибло много людей и пострадала нация, мы не можем позволить себе рискнуть еще одной гражданской войной из-за таких изменений снова, статус-кво должен поддерживаться!"
 AFG_form_the_paratrooper_brigade:0 "Солдаты неба / Soldiers of the Sky"
 AFG_form_the_paratrooper_brigade_desc:0 "Поскольку мы уже обладаем некоторыми аэронавигационными знаниями после покупки самолетов у ВВС США. [ENG.GetAdjective] Не так давно мы должны создать специальный десантный отряд для того, чтобы улучшить наши военные возможности!"
 AFG_legacy_of_cavalrymen:0 "Наследие кавалеристов"
 AFG_legacy_of_cavalrymen_desc:0 "[AFG.GetNonIdeologyName]Наследие кавалерии и использование лошадей с военными корнями восходит к много тысяч лет назад. Наши предки были великими кавалеристами, мы будем идти по их стопам!"
 AFG_arms_purchase:0 "Покупка оборудования"
 AFG_arms_purchase_desc:0 "[AFG.GetNameDefCap] Есть возможность купить [ENG.GetAdjective] или [SOV.GetAdjective] Мы должны быть осторожны с тем, у кого мы покупаем, так как это может быть опасно привязывать себя к одному поставщику!"
 AFG_tank_purchase:0 "Импортировать иностранные танки"
 AFG_tank_purchase_desc:0 "импортировать [SOV.GetAdjective] Танки принесут большую пользу нации, и мы сможем изучить танки и начать их производство на наших собственных заводах."
 AFG_develop_domestic_designs:0 "Разработать собственные образцы"
 AFG_develop_domestic_designs_desc:0 "[AFG.GetNameDefCap] Мы не можем производить собственные винтовки и военную технику, но пришло время измениться, мы должны экономить местных производителей и начать производство собственного оружия, чтобы сделать нашу страну независимой от иностранного военного влияния."
 AFG_motorized_research:0 "Моторизовать армию"
 AFG_motorized_research_desc:0 "[AFG.GetNameDefCap] Полагаясь в основном на свою кавалерию для высокоскоростных атак и тяг, но также и для снабжения армии, моторизуя армию, мы можем добиться лучшего покрытия поставок и более быстрых тяг и атак, чтобы поймать противника врасплох!"
 AFG_improve_our_logistics:0 "Улучшить логистику"
 AFG_improve_our_logistics_desc:0 ""
 AFG_prussians_orient:0 "Пруссаки Востока"
 AFG_prussians_orient_desc:0 "[AFG.GetNameDefCap] Он значительно улучшил свои вооруженные силы, даже получив звание «Пруссиян Востока», которое было присвоено многими иностранцами. [AFG.GetNameDefCap] У нас впереди светлое военное будущее!"
 AFG_first_afghani_navy:0 "Первый [AFG.GetAdjective] Флот"
 AFG_first_afghani_navy_desc:0 "Государство [AFG.GetNameDefCap] получило выход к морю, и теперь пришло время освоить его и стать морской державой. Для этого мы должны сосредоточиться на строительстве военно-морских баз и верфей вдоль побережья!"
 AFG_build_convoys:0 "Расширить торговую флотилию"
 AFG_build_convoys_desc:0 "Теперь, когда мы получили морское побережье, можно сосредоточиться на морской торговле с иностранными державами, что позволит сэкономить немало средств. Однако без надёжной защиты на торговых судах может погибнуть множество людей."
 AFG_submarines:0 "Развивать подводный флот"
 AFG_submarines_desc:0 "Государству [AFG.GetNameDefCap] необходим подводный флот, способный перехватывать торговые суда и выполнять множество других скрытных операций."
 AFG_destroyers:0 "Развивать флот эсминцев"
 AFG_destroyers_desc:0 "Государству [AFG.GetNameDefCap] необходим флот эсминцев, пригодный для постановки мин и ближнего морского боя."
 AFG_cruisers:0 "Развивать крейсеры"
 AFG_cruisers_desc:0 "Государству [AFG.GetNameDefCap] необходим флот лёгких крейсеров, способный защищать другие корабли и участвовать в ближнем морском бою."
 AFG_battleships:0 "Развивать линкоры"
 AFG_battleships_desc:0 "Государству [AFG.GetNameDefCap] необходим флот линкоров, способный защищать другие корабли и вести бой на большой дистанции."
 AFG_naval_building:0 "Поощрять гражданское судостроение"
 AFG_naval_building_desc:0 "Поощрение судостроения поможет найти надёжных местных производителей, готовых сотрудничать с правительством государства [AFG.GetNameDefCap]."
 AFG_under_the_radar:0 "Действовать незаметно"
 AFG_under_the_radar_desc:0 "Для создания эффективного подводного соединения необходимо улучшить подготовку наших морских экипажей. Это позволит безопасно оставаться вне поля зрения вражеских кораблей и уничтожать их исподтишка!"
 AFG_protect_our_convoys:0 "Изучить противолодочную борьбу"
 AFG_protect_our_convoys_desc:0 "Мы должны сосредоточиться не на уничтожении вражеских кораблей, а на защите собственных конвоев и торговых судов. Это поможет нашей экономике и развитию морской торговли!"
 AFG_naval_defense_fund:0 "Учредить Фонд морской обороны"
 AFG_naval_defense_fund_desc:0 "Следует пересмотреть бюджет и создать Фонд морской обороны, из которого будет финансироваться судостроение. Для сохранения и даже увеличения нашего военно-морского присутствия и мощи необходимо принять серьёзные меры!"
 AFG_naval_bombers:0 "Улучшение координации военно-морских операций"
 AFG_naval_bombers_desc:0 "Чтобы получить преимущество в морских сражениях, необходимо сохранять господство в воздухе над полем боя. Поэтому мы должны создать собственные соединения морских бомбардировщиков и истребителей!"
 AFG_royal_air_force:0 "[GetAfghanAirFocusName]"
 AFG_royal_air_force_desc:0 "[GetAfghanAirFocusDesc]"
 AFG_royal_air_force_royal:0 "Королевские [AFG.GetAdjective]ие ВВС"
 AFG_royal_air_force_royal_desc:0 "Королевский [AFG.GetAdjective] Военно-воздушные силы были основаны в 1921 году и за последние пятнадцать лет накопили небольшое количество самолетов и иностранных техников и операторов. К сожалению, значительная часть [AFG.GetAdjective] Самолеты были сбиты или уничтожены из-за недавних войн. [AFG.GetAdjective] Гражданская война, которая произошла в 1929 году."
 AFG_air_force_focus:0 "[AFG.GetAdjective]ие военно-воздушные силы"
 AFG_air_force_focus_desc:0 "[AFG.GetAdjective]ие военно-воздушные силы были основаны в 1921 году и за последние пятнадцать лет накопили небольшое количество самолётов, иностранных техников и операторов. К сожалению, значительная часть [AFG.GetAdjective]их самолётов была сбита или списана из-за недавних войн, включая [AFG.GetAdjective]ую гражданскую войну 1929 года."
 AFG_train_our_personnel_abroad:0 "Обучать персонал за рубежом"
 AFG_train_our_personnel_abroad_desc:0 ""
 AFG_import_planes:0 "Закупить иностранные самолёты"
 AFG_import_planes_desc:0 ""
 AFG_invite_foreign_instructors:0 "Пригласить иностранных инструкторов"
 AFG_invite_foreign_instructors_desc:0 ""
 AFG_import_italian_fighters:0 "Истребители [ITA.GetAdjective]ого производства"
 AFG_import_italian_fighters_desc:0 "Во время соревнований с [ENG.GetNameDefCap] [ITA.GetNameDefCap] Предложила нам пакет [ITA.GetAdjective] CR.32 - истребители, а также многочисленные квалифицированные операторы и технические специалисты для расширения своих рынков сбыта. [AFG.GetNameDefCap]"
 AFG_import_british_fighters:0 "Бомбардировщики [ENG.GetAdjective]ого производства"
 AFG_import_british_fighters_desc:0 "Во время соревнований с [ITA.GetNameDefCap] [ENG.GetNameDefCap] Предложила нам пакет [ENG.GetAdjective] Fairey Gordon легкие бомбардировщики и несколько квалифицированных операторов и техников, чтобы расширить свои рынки сбыта. [AFG.GetNameDefCap], [AFG.GetNameDefCap] Купить из The [ENG.GetAdjective] В прошлом они были хорошими деловыми партнерами."
 AFG_kabul_air_college:0 "Открыть Кабульскую авиационную академию"
 AFG_kabul_air_college_desc:0 "[AFG.GetNameDefCap] Необходимо развивать собственных техников, чтобы не полагаться на иностранных, которые могут быть под влиянием и отозваны в любой момент времени, авиационная академия в Кабуле должна быть открыта!"
 AFG_purhcase_czech_weaponry:0 "Закупить [CZE.GetAdjective]ое оружие"
 AFG_purhcase_czech_weaponry_desc:0 ""
 AFG_redesign_military_curriculum:0 "Пересмотреть военную учебную программу"
 AFG_redesign_military_curriculum_desc:0 ""
 AFG_develop_the_tank_industry:0 "Развивать танковую промышленность"
 AFG_develop_the_tank_industry_desc:0 ""
 AFG_bolster_national_arms_manufacturing:0 "Укрепить национальное производство оружия"
 AFG_bolster_national_arms_manufacturing_desc:0 ""
 AFG_finance_army_mechanization:0 "Финансировать механизацию армии"
 AFG_finance_army_mechanization_desc:0 ""
 AFG_introduce_new_uniforms:0 "Ввести новую униформу"
 AFG_introduce_new_uniforms_desc:0 ""
 AFG_know_thy_enemy:0 "Знай своего врага"
 AFG_know_thy_enemy_desc:0 ""
 AFG_modernize_military_hospitals:0 "Модернизировать военные госпитали"
 AFG_modernize_military_hospitals_desc:0 ""
 AFG_study_the_blitzkrieg:0 "Изучить манёвренную войну"
 AFG_study_the_blitzkrieg_desc:0 ""
 AFG_victory_through_firepower:0 "Победа благодаря огневой мощи"
 AFG_victory_through_firepower_desc:0 ""
 AFG_expand_military_airports:0 "Расширить военные аэродромы"
 AFG_expand_military_airports_desc:0 ""
 AFG_the_242nd_parachute_battalion:0 "242-й парашютный батальон"
 AFG_the_242nd_parachute_battalion_desc:0 ""
 AFG_form_weekh_zalmian:0 "«Виш Залмиан»"
 AFG_form_weekh_zalmian_desc:0 "«Виш Залмиан» — социалистическое политическое движение в государстве [AFG.GetNonIdeologyName], возглавляемое известным поэтом Мауланой Киямуддином Хадимом и врачом доктором Абдуррахманом Махмуди. Движение выступает за масштабную модернизацию и расширение прав женщин и разделено на просоветскую и антисоветскую фракции — Хальк и Парчам. Первая поддерживает [SOV.GetAdjective]ую сторону, а вторая выступает против [SOV.GetAdjective]ого влияния."
 AFG_approach_the_soviets:0 "Сблизиться с [SOV.GetAdjective]ой стороной"
 AFG_approach_the_soviets_desc:0 "Подойди к делу. [SOV.GetAdjective]s является русичным для переворота против короля, только с помощью силы и иностранной поддержки мы можем свергнуть нынешнее правительство и заменить его нашим собственным."
 AFG_form_worker_communes:0 "Учредить профсоюзы"
 AFG_form_worker_communes_desc:0 "[AFG.GetAdjective]ий народ должен узнать о своих социальных и трудовых правах. Создав профсоюзы и рабочие кооперативы, мы откроем людям глаза на полное пренебрежение правительства к трудящимся государства [AFG.GetNonIdeologyName]."
 AFG_utilize_the_military:0 "Используйте военных"
 AFG_utilize_the_military_desc:0 ""
 AFG_depose_the_king:0 "Долой короля!"
 AFG_depose_the_king_desc:0 "Наконец настал день, когда авторитарный режим, установленный буржуазией, падёт, а пламя революции охватит государство [AFG.GetNonIdeologyName]. Власть перейдёт к революционному комитету во главе с Мауланой Киямуддином Хадимом!"
 AFG_national_front:0 "Национальный фронт"
 AFG_national_front_desc:0 "Фронт национального освобождения, сокращённо ФНО, — политическая коалиция, разделяющая многие взгляды фракции Парчам, возглавляемой Мауланой Киямуддином Хадимом, и Гуляма Мухаммада Губара из Народно-демократической партии государства [AFG.GetNonIdeologyName]."
 AFG_soviet_expedition:0 "Пригласить [SOV.GetAdjective]их посланников"
 AFG_soviet_expedition_desc:0 "[SOV.GetAdjective]ая сторона проявила большой интерес к недавнему коммунистическому перевороту в государстве [AFG.GetNonIdeologyName], свергнувшему буржуазию и возвысившему пролетариат. Она предложила военную, экономическую и политическую поддержку — возможно, стоит принять это предложение."
 AFG_purge_the_bourgeoisie:0 "Провести чистку буржуазии"
 AFG_purge_the_bourgeoisie_desc:0 "После переворота в государстве [AFG.GetNonIdeologyName] значительная часть трусливой буржуазии покинула страну, ища убежища в государстве [PAK.GetNonIdeologyName] и Иране и пытаясь сохранить свои богатства из страха перед новым режимом. Однако нам всё ещё предстоит разобраться с немалым числом тех, кто решил остаться."
 AFG_form_khad:0 "Учредить ХАД"
 AFG_form_khad_desc:0 "Каждому коммунистическому режиму необходим инструмент для контроля над теми, кто выходит за установленные рамки. Создание «Хадамат-и иттилоот-и давлатӣ» позволит нам добиться этого и обеспечить государственную безопасность."
 AFG_arrest_qiamuddin:0 "Провести чистку парчамистов"
 AFG_arrest_qiamuddin_desc:0 "Лидер Парчама Маулана Киямуддин Хадим может оказаться крайне опасным для нашего режима. Важнее всего любыми средствами устранить его с политической сцены. Это, разумеется, разозлит Парчам, но только так можно обеспечить место Халька в правительстве."
 AFG_socialist_education:0 "Объединить ислам и марксизм"
 AFG_socialist_education_desc:0 "Хотя ислам не отражает идеи и взгляды марксизма, он остаётся полезным нравственным ориентиром. Мы должны сохранить ислам и объединить его с нашей идеологией; сотрудничество с медресе несомненно поможет проложить этот путь."
 AFG_begin_colectivization:0 "Начать промышленную коллективизацию"
 AFG_begin_colectivization_desc:0 "Сельскохозяйственный и промышленный секторы государства [AFG.GetNameDefCap] остаются крайне примитивными и традиционными, используя старые инструменты и методы. Для процветания экономики необходимо модернизировать их, внедрив современное оборудование и способы производства."
 AFG_universal_suffarage:0 "Повысить положение женщин"
 AFG_universal_suffarage_desc:0 "В суровых горах государства [AFG.GetNonIdeologyName] группа решительных людей начала борьбу за наступление новой эпохи. Вопреки древним традициям они прокладывают путь ко всеобщему избирательному праву, при котором голос каждого афганца, подобно мощному порыву ветра, пронесётся по долинам и сформирует демократическую судьбу страны, стремящейся к всеобщему участию в управлении."
 AFG_give_hazara_rights:0 "Защитить права хазарейцев"
 AFG_give_hazara_rights_desc:0 "Хазарейцы, преимущественно проживающие в регионе [1009.GetName], были сильно изолированы от правительства. Поскольку государство [AFG.GetNonIdeologyName] является крайне труднодоступной страной, установить связь с каждым племенем непросто. Предоставив хазарейцам больше прав, мы надеемся донести до них революцию и марксистскую мысль."
 AFG_crush_hazara_nationalism:0 "Подавить хазарейский национализм"
 AFG_crush_hazara_nationalism_desc:0 "Хазарейские племена живут в чрезвычайно отдалённой части страны и почти не соприкасаются с другими племенами, не говоря уже о правительстве. Поэтому они сохранили племенной уклад и национализм и не полностью приняли революцию в государстве [AFG.GetNonIdeologyName]."
 AFG_marxist_thought:0 "Укрепить марксистскую мысль"
 AFG_marxist_thought_desc:0 "Чтобы воспитать новое поколение [AFG.GetAdjective]их свободомыслящих людей, мы должны закрепить марксистские идеи в сознании обычного [AFG.GetAdjective]ого человека. Только поощряя родителей обучать детей, мы сможем подготовить будущие поколения к тяжёлым временам, которые однажды непременно наступят!"
 AFG_socialist_constitution:0 "Официально утвердить новую конституцию"
 AFG_socialist_constitution_desc:0 "Из-за своей удалённости государство [AFG.GetNonIdeologyName] не располагает полноценной правовой системой и средствами для исполнения законов. Мы должны разработать новую, более социалистическую конституцию."
 AFG_invite_pakistani_military:0 "Пригласить [PAK.GetAdjective]их сторонников"
 AFG_invite_pakistani_military_desc:0 "Мы должны пригласить [PAK.GetAdjective]их генералов и офицеров-коммунистов присоединиться к нашему делу и помочь распространить революцию по всему Востоку. Вместе мы едины!"
 AFG_reform_the_education_system:0 "Реформировать систему образования"
 AFG_reform_the_education_system_desc:0 "Хотя государство [AFG.GetNonIdeologyName] и не предлагает лучшего образования, мы всё же можем сформировать политические взгляды следующих поколений, посеяв в их сознании семена революции. Тогда революция никогда не угаснет."
 AFG_persecute_believers:0 "Насаждать государственный атеизм"
 AFG_persecute_believers_desc:0 "Коммунизм и ислам не могут сосуществовать, поскольку один из них изначально порочен в стремлении контролировать людей и прогресс человечества. В конце концов, все религии были созданы буржуазией и для буржуазии."
 AFG_afghan_ssr:0 "Преклонить колено"
 AFG_afghan_ssr_desc:0 "Классовая борьба является главным источником разделения народов, и нет раскола глубже классового. Поэтому мы должны объединить революции в государствах [AFG.GetNonIdeologyName] и [SOV.GetNonIdeologyName]. Став Советской Социалистической Республикой, мы откажемся от свободы и автономии, но в конечном счёте укрепим революцию."
 AFG_incorporate_tajikistan:0 "Решить таджикский вопрос"
 AFG_incorporate_tajikistan_desc:0 "Таджикские и пуштунские племена веками сосуществовали как внутри, так и за пределами границ государства [AFG.GetNonIdeologyName]. После недавней интеграции Таджикской ССР в государство [AFG.GetNameDefCap] необходимо улучшить сотрудничество между нашими народами. Предоставив таджикам определённые уступки, мы заручимся их поддержкой — в отличие от прежнего режима в городе [SOV.Capital.GetCapitalVictoryPointName]."
 AFG_loyalty_to_moscow:0 "Верность городу [SOV.Capital.GetCapitalVictoryPointName]"
 AFG_loyalty_to_moscow_desc:0 "Государство [SOV.GetNameDefCap] проявило себя надёжным союзником [AFG.GetAdjective]ого народа, помогая сохранять режим в государстве [AFG.GetNonIdeologyName] и улучшать экономику нашей некогда бедной страны. Поэтому мы обязаны сдержать обещание народу и сохранить верность правительству в городе [SOV.Capital.GetCapitalVictoryPointName]."
 AFG_afghan_workers_program:0 "Начать программу обмена рабочими"
 AFG_afghan_workers_program_desc:0 "[SOV.GetAdjective]ая и [AFG.GetAdjective]ая стороны тесно связаны с тех пор, как государство [AFG.GetNonIdeologyName] обрело независимость в 1919 году после Третьей англо-[AFG.GetAdjective]ой войны. После присоединения нашей страны к союзу эти связи лишь укрепились. Обмен рабочими и их отправка за рубеж помогут ещё сильнее улучшить сотрудничество между двумя народами."
 AFG_our_own_path:0 "Создать [AFG.GetAdjective]ий социалистический фронт"
 AFG_our_own_path_desc:0 "Пришло время объединить революции под знаменем государства [AFG.GetNonIdeologyName]. Создав [AFG.GetAdjective]ий социалистический фронт, мы намерены распространять революцию в соседние страны, но не под знаменем [SOV.GetAdjective]ой стороны. Новое пламя вспыхнет по всему Ближнему Востоку и Центральной Азии, а огонь в городе [SOV.Capital.GetCapitalVictoryPointName] угаснет!"
 AFG_persian_socialism:0 "Возродить движение джангали"
 AFG_persian_socialism_desc:0 "Мы должны разжечь пламя революции в Персии и посеять семена социализма и коммунизма в плодородной почве [PER.GetAdjective]их сердец и умов. Наш долг — открыть глаза [PER.GetAdjective]ому народу!"
 AFG_soviet_menace:0 "Обнажить брюхо медведя"
 AFG_soviet_menace_desc:0 "Государство [AFG.GetNonIdeologyName] занимает чрезвычайно выгодное положение, из которого вторжение в государство [SOV.GetNameDef] станет сравнительно простым. Мы можем использовать географию в своих интересах и ударить по [SOV.GetAdjective]ой стороне туда, где ей будет больнее всего, — прямо в брюхо медведя!"
 AFG_revolution_through_belief:0 "Революция через мир!"
 AFG_revolution_through_belief_desc:0 "Коммунизм — не идеология войны и кровопролития, а учение, призывающее к миру, братству и равенству всех людей. Лишь экстремисты предлагают насильственно распространять коммунизм войной и проливать кровь наших братьев!"
 AFG_revolution_through_force:0 "Революция через кровь!"
 AFG_revolution_through_force_desc:0 "Коммунизм невозможно распространить иначе как силой. Некоторые коммунисты считают, что его следует нести миром, призывая к братству и единству всех людей, однако это заблуждение лишь приведёт коммунизм к окончательной гибели!"
 AFG_secure_the_corridor:0 "Обезопасить Ваханский коридор"
 AFG_secure_the_corridor_desc:0 "Ваханский коридор, соединяющий государство [AFG.GetNonIdeologyName] с Алтишахром, был передан государству [AFG.GetNonIdeologyName] в XIX веке, чтобы разделить [ENG.GetAdjective]ие колониальные владения в государстве [RAJ.GetNonIdeologyName] и российские территории Центральной Азии. Мы должны обезопасить этот коридор, расширив его ради сохранения региональной стабильности!"
 AFG_socialist_economic_union:0 "Улучшить экономическое сотрудничество"
 AFG_socialist_economic_union_desc:0 "Чтобы наши экономики росли ещё быстрее, необходимо снизить или полностью отменить пошлины на импорт и экспорт из братских социалистических стран. Это принесёт нашим экономикам огромную пользу."
 AFG_socialist_welfare:0 "Модернизировать [ROOT.GetAdjective]ое социальное государство"
 AFG_socialist_welfare_desc:0 "Даже в коммунистическом обществе всё ещё существуют классовые различия, поэтому крайне важно обеспечить поддержку низшим слоям — пролетариату. Все [AFG.GetAdjective]цы должны объединиться под одним знаменем в борьбе против капитализма!"
 AFG_the_perso_afghan_union:0 "Единство через веру!"
 AFG_the_perso_afghan_union_desc:0 "[AFG.GetAdjective]ий и [PER.GetAdjective]ий народы очень похожи — настолько, что наши страны практически напоминают единое государство, разделённое на федеральные области. Поэтому сделать последний шаг и окончательно объединить их будет не так сложно! Все [AFG.GetAdjective]цы и [PER.GetAdjective]цы — едины под одним знаменем, одной идеологией и одной верой!"
 AFG_land_redistribution:0 "Принять закон об аграрной реформе"
 AFG_land_redistribution_desc:0 "Значительная часть буржуазии, бежавшая в соседние капиталистические страны, оставила после себя огромные земельные владения. Мы можем передать их крестьянам и рабочим государства [AFG.GetNonIdeologyName], чтобы они возделывали землю и развивали сельское хозяйство страны. Однако следует помнить, что значительная часть этих земель неплодородна и непригодна для земледелия."
 AFG_into_pakistan:0 "Пересмотреть линию Дюранда"
 AFG_into_pakistan_desc:0 "Плодородные равнины и высокие горы государства [PAK.GetNonIdeologyName] тысячелетиями населяли пуштуны. Поэтому наш безусловный долг — присоединить эти преимущественно пуштунские земли к государству [AFG.GetNonIdeologyName], чтобы защитить наш народ от жестокого обращения и колониализма, которым он подвергался веками!"
 AFG_anti_fascist_league:0 "Антифашистский бастион"
 AFG_anti_fascist_league_desc:0 "Государство [AFG.GetNonIdeologyName] должно стать бастионом против фашизма на Востоке и за его пределами! Мы обязаны любой ценой остановить распространение фашизма, сколько бы жизней это ни стоило!"
 AFG_operation_coutenance:0 "[SOV.GetAdjective]-[AFG.GetAdjective]ое вторжение в государство [PER.GetNonIdeologyName]"
 AFG_operation_coutenance_desc:0 "Чтобы обезопасить южный фронт, необходимо прежде всего решить [PER.GetAdjective]ий вопрос. Помимо защиты жизненно важных путей снабжения и удобных оборонительных позиций, захват крупных нефтяных запасов на севере Персии может оказаться чрезвычайно полезным."
 AFG_five_year_plan:0 "Пятилетний план"
 AFG_five_year_plan_desc:0 "После привлечения экономических специалистов наконец пришло время первого пятилетнего плана в государстве [AFG.GetNonIdeologyName]. Он значительно укрепит нашу экономику и выведет государство [AFG.GetNonIdeologyName] на путь превращения в развитую и процветающую страну!"
 AFG_combined_training:0 "[SOV.GetAdjective]-[AFG.GetAdjective]ие военные учения"
 AFG_combined_training_desc:0 "[AFG.GetAdjective]ая армия состоит главным образом из необученных племенных воинов. Совместные учения с [SOV.GetAdjective]ой Красной армией дадут нашим солдатам столь необходимый боевой опыт и помогут военным командирам улучшить свои навыки."
 AFG_undermine_moscow:0 "Подорвать влияние города [SOV.Capital.GetCapitalVictoryPointName]"
 AFG_undermine_moscow_desc:0 "С момента подчинения государству [SOV.GetNameDef] государство [AFG.GetNonIdeologyName] постоянно оставалось без внимания и отодвигалось на второй план. Мы больше не станем это терпеть! Пришло время возвышения государства [AFG.GetNonIdeologyName] и последующего падения города [SOV.Capital.GetCapitalVictoryPointName]!"
 AFG_sabotage_soviet_railways:0 "Саботировать [SOV.GetAdjective]ие железные дороги"
 AFG_sabotage_soviet_railways_desc:0 "Для успешного вторжения против [SOV.GetAdjective]ой стороны необходимо нарушить её линии снабжения, устроив диверсии на железных дорогах. Мы направим подрывные и диверсионные группы, чтобы взрывать пути. Это значительно затруднит снабжение вражеских войск и позволит нам легко продвигаться по их территории."
 AFG_seize_gun_stockpiles:0 "Захватить [SOV.GetAdjective]ие оружейные склады"
 AFG_seize_gun_stockpiles_desc:0 "Каждой армии необходимо снаряжение для снабжения солдат, и наша не исключение. Так почему бы не захватить его у наших будущих врагов в государстве [SOV.GetNameDef]? Статус близких подданных [SOV.GetAdjective]ой стороны значительно облегчит эту задачу."
 AFG_end_soviet_rule:0 "Покончить с [SOV.GetAdjective]им правлением"
 AFG_end_soviet_rule_desc:0 "Завершив подготовку к вторжению в Центральную Азию, мы наконец можем призвать северных братьев поднять оружие против тирании государства [SOV.GetNameDef]! Братья, восстаньте ради свободы!"
 AFG_ministry_for_propogation_of_virtue:0 "Министерство поощрения добродетели"
 AFG_ministry_for_propogation_of_virtue_desc:0 "Пропаганда добродетели и предотвращение порока имеют важное значение для нашей религии, и если наше государство должно строиться на нашей религии, мы должны продемонстрировать это учение нашей религии в правительственном учреждении."
 AFG_the_regency:0 "Сохранить регентство"
 AFG_the_regency_desc:0 "Сохранение королевского регентства имеет первостепенное значение: король всё ещё слишком молод, чтобы заниматься внутренней политикой, не говоря уже о внешней. Это обеспечит стабильность страны в эти тёмные времена... верно?"
 AFG_appoint_hashim:0 "Продлить полномочия Хашим-хана"
 AFG_appoint_hashim_desc:0 "Сардар Мухаммед Хашим-хан — старший член королевского регентства, а значит, вероятно, самый мудрый. Он проведёт государство [AFG.GetNonIdeologyName] через бурные воды и сохранит порядок в стране!"
 AFG_appoint_mahmud:0 "Назначить Махмуд-хана министром"
 AFG_appoint_mahmud_desc:0 "В отличие от своего брата, сардар Шах Махмуд-хан придерживается более либеральных взглядов. В его руках государство [AFG.GetNonIdeologyName] будет преобразовано в современную западную страну с демократической системой и процветающей экономикой!"
 AFG_institutionalize_pashto:0 "Закрепить пушту как государственный язык"
 AFG_institutionalize_pashto_desc:0 "Многие жители государства [AFG.GetNonIdeologyName] всё ещё говорят на персидском, порой используя его для общения между различными племенами, и даже сегодня персидское влияние заметно в государстве [AFG.GetNonIdeologyName]. Если государство [AFG.GetNonIdeologyName] хочет выжить как нация, необходимо укрепить национальный язык — пушту — и обучать ему всех граждан!"
 AFG_treaty_of_saadabad_hist:0 "Саадабадский пакт"
 AFG_treaty_of_saadabad_hist_desc:0 "Страны Ближнего Востока имеют первостепенное значение для государства [AFG.GetNonIdeologyName], поскольку изменения в их политике могут сильно повлиять на нашу экономику, армию и внутренние дела. Мы должны обратиться к восточным соседям, возможно, предложив пакт о дружбе и ненападении."
 AFG_visit_berlin:0 "Государственный визит в город [GER.Capital.GetCapitalVictoryPointName]"
 AFG_visit_berlin_desc:0 "Государство [AFG.GetNonIdeologyName] оказалось между двух зол: на севере находится [SOV.GetAdjective]ая сторона, а на юге — [ENG.GetAdjective]ая. Чтобы сохранить равновесие сил, необходимо создать в государстве [AFG.GetNonIdeologyName] третье влиятельное направление. Поэтому мы должны обратиться к [GER.GetAdjective]ой стороне и запросить её поддержку."
 AFG_invite_wehrmacht_officers:0 "Пригласить офицеров вермахта"
 AFG_invite_wehrmacht_officers_desc:0 "[AFG.GetAdjective]ой армии не помешает иностранная поддержка, например со стороны государства [GER.GetNonIdeologyName]. Во время Первой мировой войны в государство [AFG.GetNonIdeologyName] была направлена [GER.GetAdjective]ая военная миссия в надежде установить дипломатические связи с государством [AFG.GetNonIdeologyName] и склонить его к вступлению в войну. Было бы разумно вновь пригласить главу той миссии — Вернера Отто фон Хентига."
 AFG_bolster_the_nationalists:0 "Укрепить националистов"
 AFG_bolster_the_nationalists_desc:0 ""
 AFG_purge_the_nationalists:0 "Оттеснить националистов"
 AFG_purge_the_nationalists_desc:0 ""
 AFG_acquire_german_radios:0 "Приобрести [GER.GetAdjective]ие радиостанции"
 AFG_acquire_german_radios_desc:0 ""
 AFG_invite_abwehr_agents:0 "Пригласить агентов абвера"
 AFG_invite_abwehr_agents_desc:0 "Если позволить [GER.Adjective]ому абверу создать передовую базу в государстве [AFG.GetNonIdeologyName], мы вместе с [GER.Adjective]ой разведкой сможем следить за [ENG.GetAdjective]ой стороной в государстве [RAJ.GetNameDef] и по всей Азии. Это также укрепит национальную безопасность и, вероятно, позволит заранее узнавать о любых готовящихся вторжениях."
 AFG_enact_censorship:0 "Ввести цензуру средств массовой информации"
 AFG_enact_censorship_desc:0 "Средства массовой информации — мощный инструмент, связывающий правительство и народ. Однако публиковать нужно далеко не всё, особенно если содержание может навредить правительству."
 AFG_build_up_roads:0 "Заключить сделку с организацией Тодта"
 AFG_build_up_roads_desc:0 "[GER.GetAdjective]ая сторона предложила выгодную промышленную сделку, по которой организация Тодта совместно с [AFG.GetAdjective]им правительством построит дорожную сеть по всему государству [AFG.GetNonIdeologyName]. Это значительно укрепит [AFG.GetAdjective]ую экономику и повысит уровень жизни [AFG.GetAdjective]ого народа."
 AFG_german_investments_program:0 "[GER.GetAdjective]ая инвестиционная программа"
 AFG_german_investments_program_desc:0 "[GER.GetAdjective]ие инвестиции в государство [AFG.GetNonIdeologyName] жизненно важны для экономического развития страны и роста инфраструктуры. Такое партнёрство приносит не только финансовую поддержку, но и ценный опыт и технологии, создавая для государства [AFG.GetNonIdeologyName] устойчивое и процветающее будущее благодаря взаимовыгодному сотрудничеству."
 AFG_fund_the_army:0 "Перенаправить средства армии"
 AFG_fund_the_army_desc:0 "Финансирование афганской армии имеет первостепенное значение для безопасности и стабильности страны. Каждый гражданин обязан вносить вклад в материальную поддержку вооружённых сил, чтобы они оставались хорошо оснащёнными и готовыми защищать наш суверенитет от любой угрозы."
 AFG_stabilize_the_currency:0 "Стабилизировать валюту"
 AFG_stabilize_the_currency_desc:0 "Стабильность валюты особенно важна для сохранения доверия инвесторов. Устойчивая валюта способствует развитию, привлекает иностранные вложения и укрепляет общее экономическое благополучие и социальное положение наших граждан."
 AFG_irrigation_scheme:0 "Подписать программу четырёх пунктов"
 AFG_irrigation_scheme_desc:0 "Фермеры на западе не пользуются теми же преимуществами, что некоторые земледельцы на востоке. Подобные различия в конечном счёте раскалывают страну и народ. Мы не должны этого допустить. Возможно, строительство современных оросительных систем для обделённых фермеров поможет заручиться их поддержкой."
 AFG_the_getyear_general_elections:0 "Всеобщие выборы [GetYear] года"
 AFG_the_getyear_general_elections_desc:0 "За всю свою историю государство [AFG.GetNonIdeologyName] никогда не имело ничего, даже отдалённо напоминающего демократическую систему. Сегодня это изменится. Впервые в истории государства [AFG.GetNonIdeologyName] пройдут свободные выборы, на которых весь народ сможет проголосовать и выразить своё мнение!"
 AFG_shah_mahmud_prevails:0 "Переизбрание консерваторов"
 AFG_shah_mahmud_prevails_desc:0 "Мы не должны слишком далеко отходить от нынешней системы. Необходимо сохранить основные ценности государства [AFG.GetNonIdeologyName]. Консервативная партия во главе с сардаром Шах Махмуд-ханом выглядит весьма подходящей для этой задачи."
 AFG_fatherland_party_triumph:0 "Победа Партии Отечества"
 AFG_fatherland_party_triumph_desc:0 "Демократию не должны ограничивать наша культура и отсталые представления о современном мире! Под руководством Партии Отечества во главе с Гулямом Мухаммадом Губаром государство [AFG.GetNonIdeologyName] превратится в маяк либеральной демократии на Востоке!"
 AFG_infrastructure_privatization:0 "Приватизировать национальную инфраструктуру"
 AFG_infrastructure_privatization_desc:0 "Приватизация инфраструктуры и автомагистралей необходима, чтобы правительство могло стимулировать экономический рост в общественном секторе. Поощряя участие частного бизнеса, мы стремимся обеспечить долговременную устойчивость транспортной сети."
 AFG_british_exchange_program:0 "[ENG.GetAdjective]ая программа обмена"
 AFG_british_exchange_program_desc:0 "Обмен военными технологиями и достижениями с государством [ENG.GetNameDef] имеет решающее значение для укрепления обороноспособности нашей армии. Мы также надеемся, что это улучшит отношения и сотрудничество с государством [ENG.GetNameDef]."
 AFG_liberal_constitution:0 "Принять либеральную конституцию"
 AFG_liberal_constitution_desc:0 "При короле Аманулле государство [AFG.GetNonIdeologyName] уже имело сравнительно либеральную конституцию, поддержанную Лойя-джиргой и населением. Следует восстановить схожий основной закон, сохранив многие прежние ценности, но переработав его в соответствии с современными требованиями."
 AFG_the_afghan_new_deal:0 "[AFG.GetAdjective]ий новый курс"
 AFG_the_afghan_new_deal_desc:0 "По примеру [USA.GetAdjective]ого «Нового курса», введённого [USA.GetAdjective]им президентом Франклином Д. Рузвельтом, государство [AFG.GetNonIdeologyName] планирует провести похожую серию экономических программ для борьбы с безработицей и другими проблемами, чтобы запустить рост [AFG.GetAdjective]ой экономики."
 AFG_form_watan_party:0 "Создать Партию Отечества"
 AFG_form_watan_party_desc:0 "Создание партии «Ватан» имеет решающее значение для государства [AFG.GetNonIdeologyName], поскольку подтверждает приверженность демократическим принципам и всеобщему участию в управлении. Эта политическая организация должна предоставить площадку всем голосам государства [AFG.GetNonIdeologyName], способствовать демократическому развитию и обеспечить правительство, представляющее стремления и интересы всей нации."
 AFG_economic_privatization:0 "Приватизировать промышленный сектор"
 AFG_economic_privatization_desc:0 "Приватизация промышленного сектора необходима, чтобы правительство стимулировало экономический рост и создало конкурентную экономику. Поощряя частную собственность и управление, мы стремимся построить самодостаточную экономику, основанную на частных компаниях и корпорациях."
 AFG_reapproachment_with_RAJ:0 "Восстановить отношения с Раджем"
 AFG_reapproachment_with_RAJ_desc:0 "Для сохранения региональной стабильности и мира крайне важно поддерживать сердечные отношения с государством [RAJ.GetNameDef]. Мы должны протянуть государству [RAJ.GetNameDef] оливковую ветвь ради блага государства [AFG.GetNonIdeologyName] и [AFG.GetAdjective]ого народа!"
 AFG_join_the_axis:0 "Присоединиться к Оси"
 AFG_join_the_axis_desc:0 "Державы Оси пообещали нам величие и безопасность в обмен на вступление в их союз. Времена зависимости государства [AFG.GetNonIdeologyName] от государств [ENG.GetNameDef] и [SOV.GetNameDef] закончились. Эпоха современного, развитого и политически независимого государства [AFG.GetNonIdeologyName] только начинается!"
 AFG_from_the_leopard_corps:0 "Сформировать Леопардовый корпус"
 AFG_from_the_leopard_corps_desc:0 "Добровольческий корпус «Снежный барс» поможет продвигать и защищать интересы государства [AFG.GetNonIdeologyName] в регионе."
 AFG_operation_tiger:0 "Операция «Тигр»"
 AFG_operation_tiger_desc:0 "Плодородные равнины и высокие горы государства [PAK.GetNonIdeologyName] тысячелетиями населяли пуштуны. Поэтому наш безусловный долг — присоединить эти преимущественно пуштунские земли к государству [AFG.GetNonIdeologyName], чтобы защитить наш народ от жестокого обращения и колониализма, которым он подвергался веками!"
 AFG_operation_blue_mosque:0 "Операция «Голубая мечеть»"
 AFG_operation_blue_mosque_desc:0 "Чтобы обезопасить западную границу, необходимо решить [PER.GetAdjective]ий вопрос. Помимо защиты жизненно важных путей снабжения и устранения нежелательного влияния в Персии, захват крупных нефтяных запасов на севере страны может оказаться чрезвычайно полезным."
 AFG_neutrality_reaffirmed:0 "Подтвердить нейтралитет"
 AFG_neutrality_reaffirmed_desc:0 "Государство [AFG.GetNonIdeologyName] сохраняет нейтралитет со времён войны 1919 года, когда в жестоком и кровавом конфликте завоевало независимость у крупнейшей и самой развитой империи того времени — Британской империи. Если всё работает, незачем это чинить."
 AFG_deterrence_focus:0 "Защитить Отечество"
 AFG_deterrence_focus_desc:0 "Сдерживание военных вторжений является важнейшей задачей афганского правительства ради сохранения суверенитета и безопасности страны. Укрепляя обороноспособность, мы создадим средство устрашения против внешних угроз и защитим благополучие граждан. За Отечество!"
 AFG_implement_autarky:0 "Ввести автаркию"
 AFG_implement_autarky_desc:0 "Мы должны ввести автаркию, чтобы добиться экономической самодостаточности и снизить зависимость от внешних ресурсов. Отдавая приоритет местному производству, мы стремимся укрепить устойчивость страны перед лицом мировой экономической неопределённости."
 AFG_combat_foreign_influence:0 "Дух нейтралитета"
 AFG_combat_foreign_influence_desc:0 "Сохранение духа нейтралитета необходимо афганскому правительству, чтобы защитить независимость страны от [SOV.GetAdjective]ого или [ENG.GetAdjective]ого влияния."
 AFG_fortify_the_durand_line:0 "Укрепить линию Дюранда"
 AFG_fortify_the_durand_line_desc:0 "Укрепление линии Дюранда, границы с государством [RAJ.GetNameDef], необходимо для обеспечения безопасности, контроля трансграничной деятельности и защиты южной границы государства [AFG.GetNonIdeologyName]. Создав укрепления, мы повысим боеготовность на случай начала конфликта с [GetRajAdjective]ими войсками."
 AFG_the_uneasey_border:0 "Укрепить беспокойную границу"
 AFG_the_uneasey_border_desc:0 "Укрепление [SOV.GetAdjective]-[AFG.GetAdjective]ой границы имеет первостепенное значение для сохранения территориальной целостности и защиты страны от внешних угроз. Усиление обороны границы повысит нашу боеготовность на случай конфликта с [SOV.GetAdjective]ой стороной."
 AFG_expand_the_welfare_state:0 "Расширить социальное государство"
 AFG_expand_the_welfare_state_desc:0 ""
 AFG_join_allies:0 "Присоединиться к Союзникам"
 AFG_join_allies_desc:0 "Союзники, символ стабильности, мира и, самое главное, демократии, уже давно обсуждаются среди [AFG.GetAdjective]их политиков. Однако общее мнение состоит в том, что государство [AFG.GetNonIdeologyName] разделяет многие взгляды и ценности стран Союзников. Поэтому государству [AFG.GetNonIdeologyName] следует присоединиться к ним!"
 AFG_press_for_pakistan:0 "Надавить на государство [PAK.GetNonIdeologyName]"
 AFG_press_for_pakistan_desc:0 "Плодородные равнины и высокие горы государства [PAK.GetNonIdeologyName] тысячелетиями населяли пуштуны. Поэтому наш безусловный долг — присоединить эти преимущественно пуштунские земли к государству [AFG.GetNonIdeologyName], чтобы защитить наш народ от жестокого обращения и колониализма, которым он подвергался веками!"
 AFG_aquire_british_ships:0 "Приобрести [ENG.GetAdjective]ие военные корабли"
 AFG_aquire_british_ships_desc:0 "Приобретение военных кораблей у государства [ENG.GetNameDef] необходимо для усиления возможностей [AFG.GetAdjective]ого флота по обеспечению безопасности на море. Однако это может обойтись в огромную сумму, которой сейчас у нас, вероятно, нет."
 AFG_operation_red_mosque:0 "Операция «Красная мечеть»"
 AFG_operation_red_mosque_desc:0 "Коммунизм — порочная идеология, несущая лишь смерть и разрушение повсюду, куда приходит, по крайней мере, мы так считаем. Наш долг — раз и навсегда покончить с коммунизмом и предотвратить дальнейшие страдания народов всего мира под его прикрытием. Мы должны ударить по [SOV.GetAdjective]ой угрозе на севере!"
 AFG_increase_school_funding:0 "Увеличить финансирование школ"
 AFG_increase_school_funding_desc:0 "Увеличение финансирования школ является главным приоритетом для обеспечения более светлого будущего страны. Направляя больше средств на образование, мы стремимся повысить качество школ и дать молодёжи знания и навыки, необходимые для социального и экономического развития государства [AFG.GetNonIdeologyName]."
 AFG_beacon_of_the_orient:0 "Маяк Востока"
 AFG_beacon_of_the_orient_desc:0 "Защита демократии на Востоке имеет первостепенное значение, поскольку символизирует нашу приверженность свободе и единству. Соблюдая демократические принципы, мы стремимся сохранять стабильность и содействовать распространению демократических ценностей на Востоке и за его пределами!"
 AFG_legacy_of_the_yellow_expedition:0 "Наследие Жёлтой экспедиции"
 AFG_legacy_of_the_yellow_expedition_desc:0 "Жёлтая экспедиция 1932 года, возглавляемая четырьмя представителями компании Citroën, прошла через государство [AFG.GetNonIdeologyName], рекламируя новую технику — P17 Kégresse. Возможность закупки этих полугусеничных машин никогда окончательно не исключалась, поэтому при желании мы всё ещё можем их приобрести."
 AFG_grant_land_concessions:0 "Предоставить земельные концессии"
 AFG_grant_land_concessions_desc:0 "Предоставление [USA.GetAdjective]им компаниям земельных концессий в нефтеносных регионах государства [AFG.GetNonIdeologyName] необходимо для ускорения экономического развития. Надеемся, это привлечёт иностранные инвестиции и улучшит экономическое сотрудничество с государством [USA.GetNameDef]."
 AFG_specialization_of_units_focus:0 "Специализированные части"
 AFG_specialization_of_units_focus_desc:0 "Хотя верно, что у нас может быть много пехотных дивизий и батальонов, которые плохо обучены и оснащены, это помогло бы, если бы мы могли разработать специализированные подразделения для борьбы на другой местности. С тех пор [AFG.GetNonIdeologyName]Местность в подавляющем большинстве гористая, имеет смысл специализироваться на горных боях и сражениях, не так ли?"
 AFG_ramp_up_military_production:0 "Нарастить военное производство"
 AFG_ramp_up_military_production_desc:0 "Военное производство государства [AFG.GetNonIdeologyName] практически отсутствует. Из-за зависимости от других стран в вопросах военного снаряжения защищать нацию от внешних угроз и влияния чрезвычайно трудно. Ради суверенитета и безопасности государство [AFG.GetNonIdeologyName] должно начать производить собственное оружие!"
 AFG_study_our_surroundings:0 "Приспособиться к местности"
 AFG_study_our_surroundings_desc:0 "Чтобы лучше защитить себя, мы должны изучить наше окружение и разработать тактику, которая даст нам значительное преимущество против иностранных захватчиков. Используя наш ландшафт, мы можем нанести много жертв нашему врагу, не понеся при этом больших потерь."
 AFG_mass_produce_equipment:0 "Массовое производство оборудования"
 AFG_mass_produce_equipment_desc:0 "Чтобы сохранить нашу военную мощь, мы должны сосредоточиться на количестве солдат, которые служат в армии, и вооружить каждого из них. Два человека с плохими винтовками всегда будут лучше, чем один человек с превосходной винтовкой."
 AFG_live_off_the_land:0 "Жить за счёт местности"
 AFG_live_off_the_land_desc:0 "Мы должны работать над тактикой, которая поможет нашим войскам пережить холодные и суровые зимы или в ситуациях, когда поставки трудно получить. Они должны быть обучены, чтобы выжить от того, что им дают!"
 AFG_terror_of_the_sea:0 "Ужас морей"
 AFG_terror_of_the_sea_desc:0 "«Ужас морей» — огромный корабль, несущий множество самолётов, которые обрушиваются на вражеские суда и наносят сокрушительные удары! Мы должны построить подобный корабль, ведь он наверняка обеспечит нам победу в любом морском сражении!"
 AFG_destroyer_of_worlds:0 "Разрушитель миров"
 AFG_destroyer_of_worlds_desc:0 "Каждый учёный мечтает однажды овладеть силой атома. Это колоссальное количество энергии способно полностью уничтожать целые города и регионы. Необходимо соблюдать осторожность, поскольку ядерная энергия может представлять для человечества большую угрозу, чем пользу."
 AFG_abolish_the_regency:0 "Упразднить регентство"
 AFG_abolish_the_regency_desc:0 "Король приведёт государство [AFG.GetNonIdeologyName] к славе и процветанию! Руководя Лойя-джиргой, он доказал, что способен управлять внешней и внутренней политикой государства [AFG.GetNonIdeologyName]. Остаётся лишь надеяться, что власть не вскружит ему голову."
 AFG_backtrack_on_reforms:0 "Отменить реформы Надир-шаха"
 AFG_backtrack_on_reforms_desc:0 "В прошлом правительство государства [AFG.GetNonIdeologyName] проявляло чрезмерную амбициозность в модернизации и реформах. Мы не должны позволить им вновь расколоть страну, как это произошло в 1929 году при короле Аманулле. Именно прогресс в конечном счёте разорвёт нашу нацию на части!"
 AFG_continute_nadir_shahs_reforms:0 "Продолжить реформы Надир-шаха"
 AFG_continute_nadir_shahs_reforms_desc:0 "Тише едешь — дальше будешь! Мы должны проводить медленные реформы, которые не слишком сильно затронут образ жизни простых [AFG.GetAdjective]их людей. Прогресс необходимо сохранять, и ярким примером служит правление покойного отца короля Мухаммеда Захир-шаха — короля Надир-шаха. Сын пойдёт по стопам отца!"
 AFG_construct_the_great_north_road:0 "Построить Великий северный тракт"
 AFG_construct_the_great_north_road_desc:0 "Регион [1011.GetName] слишком долго оставался неразвитым. Поэтому его необходимо урбанизировать и индустриализировать. А что может быть лучше строительства шоссе, соединяющего север с Кабулом?"
 AFG_foreign_economic_aid:0 "Привлечь иностранные инвестиции"
 AFG_foreign_economic_aid_desc:0 "Государство [AFG.GetNonIdeologyName] — бедная страна, и это следует признать. Однако оно не обязано оставаться таким навсегда! Ради экономического и общественного процветания народа крайне важно установить отношения с ведущими державами мира. Возможно, нас ждут значительные выгоды."
 AFG_centralize_the_bank_of_afg:0 "Централизовать Банк государства [AFG.GetNonIdeologyName]"
 AFG_centralize_the_bank_of_afg_desc:0 "[AFG.GetAdjective]ий банковский сектор сейчас крайне слабо развит. Причинами стали недостаток реформ и модернизации, а также отсутствие серьёзной потребности в банковской системе из-за нехватки капитала. Если государство [AFG.GetNonIdeologyName] хочет выйти на мировую арену и стать развитой страной, необходимо развивать банковский сектор."
 AFG_push_army_reforms:0 "Продолжить армейские реформы"
 AFG_push_army_reforms_desc:0 "Хотя племенные вожди и члены Лойя-джирги могут не одобрить это решение, необходимо провести ограниченные армейские реформы. Королевская [AFG.GetAdjective]ая армия слаба, и новые преобразования помогут её укрепить!"
 AFG_annul_the_hasht_nafari:0 "Отменить «Хашт Нафари»"
 AFG_annul_the_hasht_nafari_desc:0 "Много лет и десятилетий назад, во времена правления Абдур-Рахман-хана, великого эмира государства [AFG.GetNonIdeologyName], правительство заключило соглашение с племенными вождями. Оно получило название «Хашт Нафари», или «Восемь человек», и предписывало, чтобы каждый восьмой человек, выбранный племенными вождями, некоторое время служил в армии. Ради модернизации войск этот неписаный закон необходимо отменить!"
 AFG_introduce_new_taxes:0 "Ввести новые налоги"
 AFG_introduce_new_taxes_desc:0 "Где предел нашей власти? При короле Мухаммеде Захир-шахе государство [AFG.GetNonIdeologyName] превратилось в диктатуру. Похоже, когда страной руководит король, возможно всё. Остаётся надеяться, что история не повторится, иначе государство [AFG.GetNonIdeologyName] вновь окажется на пути к хаосу."
 AFG_amend_the_constitution:0 "Внести поправки в конституцию 1931 года"
 AFG_amend_the_constitution_desc:0 "Наконец пришло время королю Мухаммеду Захир-шаху стать тем правителем, каким его воспитывал отец! Лойя-джирга и регентство вскоре исчезнут, а король вновь будет управлять государством [AFG.GetNonIdeologyName] железной рукой. Одним росчерком пера он возвысится к славе!"
 AFG_the_generals_coup:0 "Переворот генерала"
 AFG_the_generals_coup_desc:0 "Государство [AFG.GetNonIdeologyName] глубоко расколото. Одни всё ещё преданно поддерживают короля, а другие с нетерпением ждут его падения. Увидев открывшееся окно возможностей, Дауд-хан начал тайно готовить переворот, скрываясь в тени..."
 AFG_the_exiled_king:0 "Король в изгнании"
 AFG_the_exiled_king_desc:0 "С учетом ситуации в [AFG.GetNonIdeologyName] Будучи страшным и ухудшающимся, кажется, что никто не может спасти его от когтей нестабильности и борьбы.[AFG.GetNonIdeologyName] Навсегда обречен на нестабильную судьбу! Тем не менее, распространяются слухи о том, что изгнанный король и эмир Аманулла Хан вступил в страну. [AFG.GetNonIdeologyName] И он собирается свергнуть короля! Если это действительно так, то только Бог может сказать."
 AFG_university_in_herat:0 "Основать Гератский университет"
 AFG_university_in_herat_desc:0 "Государство [AFG.GetNonIdeologyName] мало что может предложить в области образования, и наша задача — исправить это! Создав университет в густонаселённом западном регионе [415.GetName], мы надеемся повысить общий уровень образования и предоставить будущим студентам альтернативу Кабульскому университету!"
 AFG_adopt_constitutional_monarchy:0 "Подтвердить конституционную монархию"
 AFG_adopt_constitutional_monarchy_desc:0 "При короле Мухаммеде Захир-шахе государство [AFG.GetNonIdeologyName] перейдёт к конституционной монархии с выборами каждые четыре года. Хотя король сохранит большую часть полномочий, это станет значительным шагом к демократическому и свободному государству [AFG.GetNonIdeologyName]!"
 AFG_treaty_of_saadabad:0 "Саадабадский пакт"
 AFG_treaty_of_saadabad_desc:0 "Страны Ближнего Востока имеют первостепенное значение для государства [AFG.GetNonIdeologyName], поскольку изменения в их политике могут серьёзно повлиять на нашу экономику, армию и внутренние дела. Мы должны обратиться к восточным соседям, возможно, предложив пакт о дружбе и ненападении."
 AFG_nationalize_banks:0 "Национализировать [AFG.GetAdjective]ие банки"
 AFG_nationalize_banks_desc:0 "Хотя государство [AFG.GetNonIdeologyName] не располагает крупным банковским сектором, следует национализировать немногочисленные банки, работающие в государстве [AFG.GetNonIdeologyName]. Надеемся, прямое управление банковской системой позволит эффективнее развивать экономику."
 AFG_ban_political_parties:0 "Запретить политическую деятельность"
 AFG_ban_political_parties_desc:0 "В столь тяжёлое для государства [AFG.GetNonIdeologyName] время политический плюрализм ни к чему! Создание множества партий в государстве [AFG.GetNonIdeologyName] приведёт лишь к усилению нестабильности и расколу нации, а в конечном счёте — к очередной гражданской войне..."
 AFG_disband_the_jirga:0 "Распустить Лойя-джиргу"
 AFG_disband_the_jirga_desc:0 "Наше правительство пользуется полной поддержкой армии, что позволяет распустить Лойя-джиргу без серьёзного сопротивления племенных вождей. Этим решением мы надеемся укрепить стабильность страны и временно устранить влияние племён на правительство!"
 AFG_amanullahs_visit_to_europe:0 "Королевское турне по Европе"
 AFG_amanullahs_visit_to_europe_desc:0 "С момента своего недавнего возвращения в государство [AFG.GetNonIdeologyName] Аманулла планирует королевское турне по Европе. Предыдущая попытка отправиться туда привела во время его отсутствия к гражданской войне в государстве [AFG.GetNonIdeologyName]. Остаётся надеяться, что история не повторится!"
 AFG_restore_the_constitution:0 "Восстановление Конституции 1921 года"
 AFG_restore_the_constitution_desc:0 "Конституция 1921 года, первая либеральная конституция [AFG.GetNonIdeologyName]В ней говорилось, что каждый [AFG.GetAdjective] К ним следует относиться так же, как к поддерживаемому равенству. Важно сохранить эти ценности и в новой конституции!"
 AFG_establish_radio_kabul:0 "Учредить Радио Кабул"
 AFG_establish_radio_kabul_desc:0 "По мере развития технологий появляются более совершенные способы общения с народом. Изобретение радио позволяет создать станцию, которую сможет слушать всё государство [AFG.GetNonIdeologyName]! Она поможет распространять наши политические взгляды и важную информацию."
 AFG_export_based_economy:0 "Экспортно ориентированная экономика"
 AFG_export_based_economy_desc:0 "Хотя государство [AFG.GetNonIdeologyName] не располагает множеством природных ресурсов, у нас имеются значительные излишки механического оборудования и других фабричных товаров. Разумеется, их следует экспортировать ради прибыли. Чтобы развивать экономику, мы должны поощрять вывоз собственной продукции!"
 AFG_subvert_soviet_influence_focus:0 "Подорвать [SOV.GetAdjective]ое влияние"
 AFG_subvert_soviet_influence_focus_desc:0 "Мы не можем позволить [SOV.GetAdjective]ой стороне влиять на государство [AFG.GetNonIdeologyName], поскольку это может оказаться смертельно опасным для правительства и страны. Государство [AFG.GetNonIdeologyName] должно сохранить суверенитет и независимую внешнюю политику. Мы сами будем вершить свою судьбу!"
 AFG_army_reform:0 "Мобилизовать армию"
 AFG_army_reform_desc:0 "Чтобы удержать иностранные державы от вторжения в государство [AFG.GetNonIdeologyName], необходимо мобилизовать вооружённые силы и повысить готовность армии к возможным войнам."
 AFG_the_non_aligned_movement:0 "Движение неприсоединения"
 AFG_the_non_aligned_movement_desc:0 "Многие страны мира стоят в одиночестве, не имея союзников, оставаясь неприсоединившимися и нейтральными. Мы должны создать сообщество таких государств, чтобы в эти тяжёлые времена защищать друг друга! За мир и процветание!"
 AFG_turkish_subsidized_factories:0 "Фабрики при [TUR.GetAdjective]их субсидиях"
 AFG_turkish_subsidized_factories_desc:0 "Продолжая курс на расширение ближневосточного сотрудничества, следует пригласить [TUR.GetAdjective]их инвесторов и предпринимателей субсидировать фабрики в государстве [AFG.GetNonIdeologyName]. Это значительно укрепит экономическое сотрудничество между государствами [AFG.GetNonIdeologyName] и [TUR.GetNameDef]!"
 AFG_ally_with_the_young_afghans:0 "Заключить союз с младоафганцами"
 AFG_ally_with_the_young_afghans_desc:0 "Младоафганцы — политическая группа в государстве [AFG.GetNonIdeologyName], являющаяся главной движущей силой дальнейшей вестернизации и модернизации государства [AFG.GetNonIdeologyName]! Король Аманулла поддерживал тесные связи с этой организацией с момента коронации, но после гражданской войны 1929 года отношения ухудшились. Мы должны восстановить их!"
 AFG_secular_education:0 "Ввести светское образование"
 AFG_secular_education_desc:0 "Необходимо разделить религию и образование, поскольку их сочетание уже показало себя крайне опасным. Чтобы повысить качество обучения населения, мы должны убрать ислам из всех классов государства [AFG.GetNonIdeologyName]!"
 AFG_the_hazara_question:0 "Хазарейский вопрос"
 AFG_the_hazara_question_desc:0 "Религиозные различия в государстве [AFG.GetNonIdeologyName] всё ещё существуют. Хазарейцы преимущественно населяют регион [1009.GetName] и исповедуют шиизм. Чтобы предотвратить внутренние столкновения, необходимо объединить шиитскую и суннитскую общины государства [AFG.GetNonIdeologyName]. Ни одно исламское вероучение не является неполноценным!"
 AFG_implement_autarky_daoud:0 "Ввести автаркию"
 AFG_implement_autarky_daoud_desc:0 "Мы должны ввести автаркию, чтобы добиться экономической самодостаточности и снизить зависимость от внешних ресурсов. Развивая отечественную промышленность и отдавая приоритет местному производству, мы укрепим устойчивость страны перед лицом мировой экономической неопределённости."
 AFG_the_kabul_pact:0 "Кабульский пакт"
 AFG_the_kabul_pact_desc:0 "Сегодня мы приблизимся к важнейшей цели — объединению Ближнего Востока под одним знаменем и ради общей задачи! Подписав Кабульский пакт с Турцией, Ираком и Ираном, мы преодолеем существующие разногласия и вновь станем значительной силой в региональной политике!"
 AFG_self_determination_for_pakistan:0 "Самоопределение для региона [442.GetName]"
 AFG_self_determination_for_pakistan_desc:0 "Плодородные равнины и высокие горы государства [PAK.GetNonIdeologyName] тысячелетиями населяли пуштуны. Поэтому наш безусловный долг — попытаться присоединить эти земли. Возможно, потребовав от [GetRajAdjective]ой стороны провести референдум в регионе [442.GetName], мы сумеем добиться цели!"
 AFG_continue_railway_development:0 "Продолжить развитие железных дорог"
 AFG_continue_railway_development_desc:0 "[AFG.GetAdjective]ая железнодорожная сеть практически отсутствует, а немногочисленные линии в государстве [AFG.GetNonIdeologyName] плохо обслуживаются. Мы должны продолжить планы по объединению страны! Чем теснее связан народ, тем меньше между людьми разногласий!"
 AFG_attaturks_legacy:0 "Почтить наследие Ататюрка"
 AFG_attaturks_legacy_desc:0 "Покойный Мустафа Кемаль Ататюрк — революционер, генерал и отец Турции. Он сделал и принёс в жертву многое ради своей страны. Аманулла может лишь стремиться совершить для государства [AFG.GetNonIdeologyName] то, что Ататюрк уже сделал для Турции! Он продолжит его наследие!"
 AFG_deal_with_the_devil:0 "Сделка с дьяволом"
 AFG_deal_with_the_devil_desc:0 "Иногда ради достижения цели приходится заключать сделку с дьяволом. Чтобы вернуть утраченные земли в государстве [PAK.GetNonIdeologyName] и вновь сделать государство [AFG.GetNonIdeologyName] великим, необходимо объединиться с врагом нашего врага. В конце концов, враг моего врага — мой друг, верно?"
 AFG_maintain_neutrality_r56:0 "Сохранять нейтралитет"
 AFG_maintain_neutrality_r56_desc:0 "Государство [AFG.GetNonIdeologyName] сохраняет нейтралитет со времён войны 1919 года, когда в жестоком и кровавом конфликте завоевало независимость у крупнейшей и самой развитой империи того времени — Британской империи. Если всё работает, незачем это чинить."
 AFG_form_the_afghan_red_crescent:0 "Создать [AFG.GetAdjective]ий Красный Полумесяц"
 AFG_form_the_afghan_red_crescent_desc:0 "В эти тяжёлые времена мы должны оставаться людьми и помогать нуждающимся жителям государства [AFG.GetNonIdeologyName], которым необходима крыша над головой или медицинская помощь. Следует учредить Общество [AFG.GetAdjective]ого Красного Полумесяца! Через гуманность — к миру!"
 AFG_reclaim_our_land:0 "Вернуть наши земли"
 AFG_reclaim_our_land_desc:0 "Плодородные равнины и высокие горы государства [PAK.GetNonIdeologyName] тысячелетиями населяли пуштуны. Поэтому наш безусловный долг — присоединить эти преимущественно пуштунские земли к государству [AFG.GetNonIdeologyName], чтобы защитить наш народ от жестокого обращения и колониализма, которым он подвергался веками!"
 AFG_greater_afghanistan:0 "Великий Афганистан"
 AFG_greater_afghanistan_desc:0 "Наконец мечта о единой земле для всех [AFG.GetAdjective]цев осуществилась. Это наши земли, и пришло время сообщить миру, что мы будем сражаться и умирать за них. Слава Афганистану!"
 AFG_contact_faqir:0 "Наследие Хостского восстания"
 AFG_contact_faqir_desc:0 "За последние два десятилетия [AFG.GetAdjective]ой независимости от [ENG.GetAdjective]ой стороны государство [AFG.GetNonIdeologyName] пережило множество мятежей, восстаний и переворотов. Одним из них стало Хостское восстание 1924 года против радикальных реформ короля Амануллы. Хотя тогда восстание было подавлено, его дух продолжает жить."
 AFG_waaidu:0 "Ва-аиду!"
 AFG_waaidu_desc:0 "«Ва-аиду» — цитата из Корана, которую можно перевести как «Будьте готовы». Мы слишком долго ждали этого момента, и теперь он наконец настал: [AFG.GetAdjective]ий народ восстанет против диктатуры тиранов в Кабуле, а король больше не будет править! Аллаху акбар!"
 AFG_contact_tribes:0 "Обеспечить поддержку племён"
 AFG_contact_tribes_desc:0 "Изолированные племена почти не тревожатся о политике и мало что о ней знают, поскольку вся политическая жизнь сосредоточена главным образом в Кабуле. Они готовы поддержать нашу борьбу в обмен на обещания богатства, возвращения шариата и отмены радикальных реформ, проведённых регентством."
 AFG_invite_jamaat_islami:0 "Связаться с Абул Ала Маудуди"
 AFG_invite_jamaat_islami_desc:0 "Абул Ала Маудуди — широко известный богослов и исламский учёный в государстве [PAK.GetNonIdeologyName]. Он может оказаться чрезвычайно полезным в мобилизации народа и узаконивании нашего джихада против короля и его правительства."
 AFG_maududi_as_sheikhulislam:0 "Наставничество «Джамиат-и Ислами»"
 AFG_maududi_as_sheikhulislam_desc:0 "Если бы не Абул Ала Маудуди, искра восстания не вспыхнула бы, а народ государства [AFG.GetNonIdeologyName] навеки остался бы под властью тиранического режима. Именно его выдающиеся организаторские способности объединили нас в борьбе за веру и традиции! Он должен быть провозглашён шейхом!"
 AFG_mirzali_as_emir:0 "Золотой эмир"
 AFG_mirzali_as_emir_desc:0 "Хаджи Мирзали-хан доказал преданность народу государства [AFG.GetNonIdeologyName], храбро и страстно сражаясь против наших врагов. За это многие в наших рядах восхищаются им и почитают его! Единственная достойная награда за его вклад в борьбу и наше дело — провозгласить его эмиром Исламского Эмирата государства [AFG.GetNonIdeologyName]!"
 AFG_widen_perspective_of_religion:0 "Расширить религиозные взгляды"
 AFG_widen_perspective_of_religion_desc:0 "В своей последней проповеди Пророк объявил, что никто не превосходит другого, кроме как в вере. Хазарейцы-шииты так же, как и мы, поднимают знамя единобожия. Поэтому мы должны оставить разногласия позади и предоставить им равные права и возможности, особенно в военной службе."
 AFG_persecute_hazaras:0 "Исключить хазарейцев из военной службы"
 AFG_persecute_hazaras_desc:0 "Хазарейское шиитское население крайне ненадёжно: оно неоднократно предавало наше государство и придерживается более сектантских представлений об исламе. Поэтому разумнее не допускать хазарейцев к военной службе, иначе это может привести не только к падению боевого духа, но и к политическим проблемам в будущем."
 AFG_the_constitution_question:0 "Составить исламскую конституцию"
 AFG_the_constitution_question_desc:0 "Поначалу конституция может показаться странной для страны, где исламское учение призывает следовать шариату. Однако основной закон или иная форма законодательства необходимы для сохранения порядка и защиты прав людей. Тем не менее шариат останется высшим законом государства [AFG.GetNameDefCap]."
 AFG_tulaia_mutaharrika:0 "По стопам «Тулайя мутахаррика»"
 AFG_tulaia_mutaharrika_desc:0 "«Тулайя мутахаррика», или «Подвижная стража» по-арабски, представляла собой элитные подразделения раннего Праведного халифата. Чтобы сильнее распространять добродетель и прославлять служение Богу через борьбу, мы начнём набор и обучение подобных элитных сил."
 AFG_mix_sciences_with_religion:0 "Объединить религиозное и научное образование"
 AFG_mix_sciences_with_religion_desc:0 "Следуя примеру таких богословов, как Хасан аль-Банна, Саид Нурси и Шакиб Арслан, выступавших за учебную программу, объединяющую религию и науки и не считающую их взаимоисключающими, мы воплотим эти идеи и устраним разделение между медресе и школой. Однако это может оказаться невозможным, если мы уже передали полномочия в образовании наиболее непреклонным улемам."
 AFG_international_mujahideen:0 "Международные моджахеды"
 AFG_international_mujahideen_desc:0 "Чтобы усилить афганское влияние в регионе, мы начнём отправлять моджахедов за рубеж для поддержки наших братьев в других частях мира!"
 AFG_you_cannot_kill_a_believer:0 "Усилить религиозный фанатизм"
 AFG_you_cannot_kill_a_believer_desc:0 "Чтобы усилить наше влияние и власть над армией, а также сохранить храбрость и моральный дух, мы начнем кампании поощрения и индоктринации наших войск до тех пор, пока они не будут бояться поля боя!"
 AFG_utilize_the_sufis:0 "Использовать суфиев"
 AFG_utilize_the_sufis_desc:0 ""
 AFG_tunganistan:0 "Освободить восточных мусульман"
 AFG_tunganistan_desc:0 "Уйгурский народ долгие годы страдает под властью [CHI.GetAdjective]ого режима — довольно! Мы должны освободить братьев от угнетателей. Мы обязаны помочь нуждающимся, и однажды помощь вернётся к нам."
 AFG_request_german_reinforcements:0 "Запросить [GER.GetAdjective]ую военную поддержку"
 AFG_request_german_reinforcements_desc:0 "[AFG.GetAdjective]ую армию нельзя назвать современной или тем более сильной: она в основном состоит из плохо обученных и слабо вооружённых племенных наёмников и воинов. Однако, похоже, [GER.Adjective]ая сторона готова помочь нам улучшить вооружённые силы. Возможно, стоит запросить поддержку?"
 AFG_seize_royal_assets:0 "Конфисковать королевское имущество"
 AFG_seize_royal_assets_desc:0 "Трусливо бежав из страны, король оставил в государстве [AFG.GetNonIdeologyName] множество личных вещей и активов. Следует конфисковать и перераспределить их, ведь королю они явно больше не нужны."
 AFG_kabul_military_college:0 "Открыть Кабульское военное училище"
 AFG_kabul_military_college_desc:0 "[AFG.GetAdjective]ий генеральный штаб неопытен: многие его сотрудники не получили образования и не понимают даже основ ведения войны. Мы должны открыть военное училище, чтобы обучить и улучшить наш командный состав."
 AFG_german_equipment:0 "Закупить [GER.GetAdjective]ое снаряжение"
 AFG_german_equipment_desc:0 "Военная промышленность государства [AFG.GetNonIdeologyName] в основном неразвита и не способна удовлетворить потребности [AFG.GetAdjective]их вооружённых сил. Поэтому государство [AFG.GetNonIdeologyName] вынуждено закупать военное снаряжение за рубежом. Мы можем заключить выгодную оружейную сделку с [GER.GetAdjective]ой стороной."
 AFG_support_the_palestinians:0 "Поддержать палестинцев"
 AFG_support_the_palestinians_desc:0 ""
 AFG_invite_amin_al_husseini:0 "Пригласить Амина аль-Хусейни"
 AFG_invite_amin_al_husseini_desc:0 "Великий муфтий Иерусалима уже неоднократно посещал государство [AFG.GetNonIdeologyName]. Мы можем вновь пригласить его, на этот раз предложив остаться в государстве [AFG.GetNonIdeologyName] и руководить [PAL.GetAdjective]им сопротивлением из государства [AFG.GetNonIdeologyName], а возможно, также помогать [AFG.GetAdjective]ому правительству."
 AFG_approach_mubashir:0 "Обратиться к Мубаширу аль-Тарази"
 AFG_approach_mubashir_desc:0 "После изгнания из Казахстана в апреле 1930 года Мубашир аль-Тарази нашёл убежище в государстве [AFG.GetNonIdeologyName], откуда мог продолжать сопротивление [SOV.GetAdjective]ой стороне. Во времена Надир-шаха он занимал высокие должности и пользовался большим уважением. Крайне важно заручиться его поддержкой."
 AFG_form_the_turkestan_legion_r56:0 "Сформировать Туркестанский легион"
 AFG_form_the_turkestan_legion_r56_desc:0 "Тюркские народы Центральной Азии подвергаются угнетению [SOV.GetAdjective]ой стороны со времён Октябрьской революции. Их лишили права верить и исповедовать ислам. Мы должны вновь пробудить мятежный дух этих народов!"
 AFG_nationalize_spiznar:0 "Национализировать хлопковую промышленность"
 AFG_nationalize_spiznar_desc:0 "Компания «Ширкат-и Иттихадия-йи Вилаят-и Шомал» обеспечивает работой более 12 000 человек. Передача фабрики государству принесёт множество выгод как правительству, так и [AFG.GetAdjective]ому народу."
 AFG_cooperate_with_hazaras:0 "Сотрудничать с хазарейцами"
 AFG_cooperate_with_hazaras_desc:0 "Религиозные различия в государстве [AFG.GetNonIdeologyName] всё ещё существуют. Хазарейцы преимущественно населяют регион [1009.GetName] и исповедуют шиизм. Чтобы предотвратить внутренние столкновения, необходимо объединить шиитскую и суннитскую общины государства [AFG.GetNonIdeologyName]. Ни одно исламское вероучение не является неполноценным!"
 AFG_form_muslim_youth:0 "Создать «Мусульманскую молодёжь»"
 AFG_form_muslim_youth_desc:0 "Чтобы распространять ислам, необходимо посеять его семена в сознании молодёжи. Создание молодёжного крыла окажется чрезвычайно эффективным и полезным для этой цели."
 AFG_eradicate_communism:0 "Искоренить коммунизм"
 AFG_eradicate_communism_desc:0 "Действительно ли коммунизм — корень всего зла? Мы не знаем, но лучше не выяснять это на собственном горьком опыте: люди боятся того, чего не понимают. Поэтому ради человечества лучше уничтожить это порочное учение... верно?"
 AFG_revive_the_basmachi_movement:0 "Возродить движение басмачей"
 AFG_revive_the_basmachi_movement_desc:0 "Тюркские народы Центральной Азии подвергаются угнетению [SOV.GetAdjective]ой стороны со времён Октябрьской революции. Их лишили права верить и исповедовать ислам. Мы должны вновь пробудить мятежный дух этих народов! Восстаньте, братья!"
 AFG_end_the_revolution:0 "Покончить с революцией"
 AFG_end_the_revolution_desc:0 "Коммунизм — порочная идеология, несущая лишь смерть и разрушение повсюду, куда приходит, по крайней мере, мы так считаем. Наш долг — раз и навсегда покончить с коммунизмом и предотвратить дальнейшие страдания народов всего мира под его прикрытием. Мы должны ударить по [SOV.GetAdjective]ой угрозе на севере!"
 AFG_the_fate_of_imperialism:0 "Судьба империализма"
 AFG_the_fate_of_imperialism_desc:0 "В течение последнего столетия государство [AFG.GetNonIdeologyName] неоднократно подвергалось унижениям и вторжениям империалистов из городов [ENG.Capital.GetCapitalVictoryPointName] и [SOV.Capital.GetCapitalVictoryPointName]. Мы больше не преклоним колени перед этими имперскими державами — время мести настало!"
 AFG_proclaim_pashtunistan:0 "Продвигать пуштунизм"
 AFG_proclaim_pashtunistan_desc:0 "Наконец мечта о единой земле для всех пуштунов осуществилась. Это наши земли, и пришло время сообщить миру, что мы будем сражаться и умирать за них. Слава Пуштунистану!"
 AFG_pillars_of_islam:0 "Столпы ислама"
 AFG_pillars_of_islam_desc:0 "Мы должны сосредоточиться на основе нашей религии и на том, что отличает нас от других. Чтобы построить дом, нужен прочный фундамент. Для ислама это столь же верно."
 AFG_enforce_the_pashtunwali_r56:0 "Обеспечить соблюдение пуштунвали"
 AFG_enforce_the_pashtunwali_r56_desc:0 "Пуштунвали — свод правил и целостный образ жизни пуштунского народа. Он во многом согласуется с исламом, проповедуя справедливость и храбрость, но также включает множество других важных ценностей, составляющих пуштунскую культуру. Ради общественного порядка мы должны обеспечить соблюдение этих принципов."
 AFG_islamic_cooperation:0 "Улучшить межисламское сотрудничество"
 AFG_islamic_cooperation_desc:0 "В разобщённости мы слабы, в единстве — сильны. Чтобы ислам процветал, необходимо развивать экономическое сотрудничество между нашими союзниками, расширяя торговлю и инвестиции."
 AFG_the_ten_lost_tribes:0 "Месть за десять потерянных колен"
 AFG_the_ten_lost_tribes_desc:0 "Происхождение пуштунского народа неизвестно. Одни считают пуштунов потомками гуннов, другие — пактианцев. Однако веками сохраняется легенда о происхождении пуштунов от десяти потерянных колен Израиля. Если это действительно так, мы имеем право считать землю Израиля своей прародиной."
 AFG_return_of_the_king:0 "Возвращение короля"
 AFG_return_of_the_king_desc:0 "Король Аманулла находится в изгнании со времён гражданской войны с саккавистами в 1929 году. Пришло время вновь пригласить его в государство [AFG.GetNonIdeologyName]. Будем надеяться, что он усвоил урок."
 AFG_peace_through_islam:0 "Ислам в одной стране"
 AFG_peace_through_islam_desc:0 "Иного пути к миру во всём мире, кроме полного объединения всех людей под знаменем ислама, не существует. Только через Аллаха мы сможем достичь всеобщего мира и процветания человечества."
 AFG_approach_pakistani_resistance:0 "Связаться с [PAK.GetAdjective]им сопротивлением"
 AFG_approach_pakistani_resistance_desc:0 "Наши мусульманские братья на юге всё ещё находятся под властью империалистов! Мы должны пересечь линию Дюранда и освободить их от оков. Братья, восстаньте!"
 AFG_global_islamic_revolution:0 "Продолжить третью Вазиристанскую кампанию"
 AFG_global_islamic_revolution_desc:0 "Джихад против империалистов — единственный путь к объединению наших народов. В прошлом было проведено множество сражений, и ещё немало предстоит, прежде чем все пуштуны вновь объединятся. Сегодня мы будем сражаться и отдавать жизни во имя Его, а завтра будем процветать."
 AFG_german_junker_purchase:0 "Закупить [GER.GetAdjective]ие «Юнкерсы»"
 AFG_german_junker_purchase_desc:0 "[AFG.GetAdjective]ие военно-воздушные силы практически отсутствуют. Для их развития необходимо закупить иностранные самолёты, и, возможно, [GER.GetAdjective]ая сторона сможет нам помочь. В конце концов, в государстве [AFG.GetNonIdeologyName] уже работает множество [GER.GetAdjective]их авиатехников и пилотов."
 AFG_bury_the_hatchet:0 "Зарыть топор войны"
 AFG_bury_the_hatchet_desc:0 "Религиозные различия внутри ислама всё ещё существуют: персы преимущественно исповедуют шиизм. Чтобы предотвратить внутренние столкновения, необходимо объединить шиитскую и суннитскую общины Персии и государства [AFG.GetNonIdeologyName]. Ни одно исламское вероучение не является неполноценным!"
 AFG_in_alexanders_footsteps:0 "По стопам Александра"
 AFG_in_alexanders_footsteps_desc:0 "Почти две тысячи лет назад Александр Великий прошёл по этим землям со своими фалангами. Он ступал по ним, покоряя их, и его наследие оставило глубокий след в нашей культуре и истории."
 AFG_break_the_six_arrows:0 "Сломать шесть стрел кемализма"
 AFG_break_the_six_arrows_desc:0 "Секуляризм — позор для всего мира. Отделение государства от ислама одновременно нелепо и отвратительно. Мы должны вырвать эту идеологию с корнем, словно сорняк из сада!"
 AFG_reinstall_the_king:0 "Восстановить [AFG.GetAdjective]ого короля"
 AFG_invite_fakhri_pasha:0 "Пригласить Фахри-пашу"
 AFG_imprison_political_opponents:0 "Заключить политических противников в тюрьму"
 AFG_rescind_the_turkish_afghan_defense_treaty:0 "Расторгнуть [TUR.GetAdjective]-[AFG.GetAdjective]ий оборонный договор"
 AFG_for_what_was_taken_from_us:0 "За то, что у нас отняли..."
 AFG_for_what_was_taken_from_us_desc:0 "Культурные, религиозные и традиционные связи, объединяющие жителей плодородной долины Инда с государством [AFG.GetNonIdeologyName], неоспоримы и являются результатом многовекового единства этих земель. Единственное, что действительно разделяет наши народы, — воображаемые линии на воображаемых картах..."
 AFG_reintegrate_peshawar:0 "Реинтегрировать регион [442.GetName]"
 AFG_restore_pashtun_rule_in_quetta:0 "Восстановить пуштунское правление в регионе [445.GetName]"
 AFG_cooperate_with_the_balochis:0 "Сотрудничать с белуджскими сепаратистами"
 AFG_pashtunize_karachi:0 "Пуштунизировать регион [1093.GetName]"
 AFG_integrate_the_railway_network:0 "Объединить железнодорожную сеть"
 AFG_proclaim_pashtunsitan_decision:0 "Провозгласить Пуштунистан"
 AFG_foreign_aircraft_category:0 "Закупка иностранных самолётов"
 AFG_foreign_aircraft_category_desc:0 "После жестокой афганской гражданской войны 1929 года небольшие, но только начинавшие развиваться военно-воздушные силы, созданные при короле Аманулле, были полностью уничтожены. Теперь, когда стабильность восстановлена, государство [AFG.GetNonIdeologyName] наконец способно приобрести технику и создать новые современные ВВС."
 AFG_purchase_german_aircraft:0 "Закупить [GER.GetAdjective]ие самолёты"
 AFG_purchase_british_aircraft:0 "Закупить [ENG.GetAdjective]ие самолёты"
 AFG_purchase_italian_aircraft:0 "Закупить [ITA.GetAdjective]ие самолёты"
 AFG_electrify_kabulistan:0 "Электрифицировать регион [267.GetName]"
 AFG_improve_helmand_irrigation:0 "Расширить ирригационную сеть Гильменда"
 AFG_develop_faryab:0 "Разработать нефтяные месторождения региона [1008.GetName]"
 AFG_develop_bamyan:0 "Разработать железные рудники региона [1009.GetName]"
 AFG_develop_kabul:0 "Разработать залежи хрома в регионе [267.GetName]"
 AFG_develop_unlock_tt:0 "Открывает решения §YПоиск ресурсов§!."
 AFG_rural_schools_category:0 "Строительство сельских школ"
 AFG_rural_schools_category_desc:0 "Сельские регионы, оторванные от Кабула и центральной администрации государства [AFG.GetNonIdeologyName], являются главной причиной неграмотности, с которой сейчас сталкивается государство [AFG.GetNonIdeologyName]. Мы должны улучшить методы сельского образования и сделать его доступнее."
 AFG_illiteracy_decrease_75:0 "§YСтоимость§! решения §YСтроить сельские школы§! в политической власти будет §Gснижена§! на §Y30%§!, а §Yвремя§!, необходимое для §Yвыполнения§! решения, будет §Gсокращено§! до §Y75§! дней."
 AFG_illiteracy_decrease_50:0 "§YСтоимость§! решения §YСтроить сельские школы§! в политической власти будет §Gснижена§! на §Y60%§!, а §Yвремя§!, необходимое для §Yвыполнения§! решения, будет §Gсокращено§! до §Y60§! дней."
 AFG_open_schools:0 "Построить сельские школы в регионе [FROM.GetName]"
 AFG_inflitrate_pakistan_category:0 "Пуштунское сопротивление в государстве [PAK.GetNonIdeologyName]"
 AFG_inflitrate_pakistan_category_desc:0 "Плодородные равнины и крутые горы государства [PAK.GetNonIdeologyName] были колыбелью пуштунской цивилизации. Пуштунская культура и образ жизни зародились в этом регионе многие тысячелетия назад! Однако и сегодня наш народ страдает под властью чужеземных держав. Но не тревожьтесь — наше время наконец настало!"
 AFG_declare_war:0 "[GetWarName]"
 AFG_tajikistan_category:0 "Присоединение Таджикистана"
 AFG_tajikistan_category_desc:0 "Таджикские и пуштунские племена веками сосуществовали как внутри, так и за пределами границ государства [AFG.GetNonIdeologyName]. Однако недавняя интеграция Таджикской ССР в государство [AFG.GetNameDefCap] несколько нарушила региональное равновесие и стабильность, вызвав внезапный, хотя и медленный рост таджикского национализма и сепаратизма. Возможно, предоставив таджикам определённые уступки, мы заручимся их поддержкой — в отличие от прежнего режима в городе [SOV.Capital.GetCapitalVictoryPointName]."
 AFG_build_housing_districts:0 "Расширить строительную отрасль города [742.GetCapitalVictoryPointName]"
 AFG_implement_tajik_language:0 "Закрепить таджикский язык"
 AFG_agricultural_concessions:0 "Предоставить таджикам сельскохозяйственные уступки"
 AFG_integrate_tajikistan_decision:0 "Интегрировать Таджикскую ССР"
 AFG_create_tajikistan_brigade_tt:0 "Создаст §YНародную бригаду Тоджикистона§! в регионе §Y[742.GetName]§!."
 AFG_prepare_soviet_war:0 "Проникнуть на [SOV.GetAdjective]ую территорию"
 AFG_prepare_soviet_war_desc:0 "С течением времени между городами [AFG.Capital.GetCapitalVictoryPointName] и [SOV.Capital.GetCapitalVictoryPointName] разверзается огромная экономическая и политическая пропасть... Похоже, восстание назревает не только в государстве [AFG.GetNonIdeologyName], но и по всей [SOV.GetAdjective]ой Центральной Азии. Нет сомнений, что за ним стоит город [AFG.Capital.GetCapitalVictoryPointName], поддерживающий антибольшевистских басмачей."
 AFG_infiltrate_soviet_factories:0 "Проникнуть на [SOV.GetAdjective]ие фабрики"
 AFG_infiltrate_soviet_garissons:0 "Проникнуть в [SOV.GetAdjective]ие гарнизоны"
 AFG_persian_socialism_decision_category:0 "Возрождение движения джангали"
 AFG_persian_socialism_decision_category_desc:0 "В 1920-х годах коммунистическое движение в Персии, известное как «Движение джангали», возглавлял Мирза Кучек-хан. В Гиляне была создана Персидская ССР, которая, хотя и не получила международного признания, стала значительным достижением своего времени. Мы должны возродить революционный дух, всё ещё живущий в Персии!"
 AFG_propaganda_campaigns:0 "[PER.GetAdjective]ие социалистические пропагандистские кампании"
 AFG_support_armed_resistance:0 "Поддержать [PER.GetAdjective]их бойцов сопротивления"
 AFG_organize_protests:0 "Организовать митинг в регионе [FROM.GetName]"
 AFG_coalition_with_democrats:0 "Коалиция с партией [PER.GetDemocraticParty]"
 AFG_march_on_tehran:0 "Поход на регион [266.GetName]"
 AFG_ally_the_persian_uprising:0 "Заключить союз с [PER.GetAdjective]ими социалистами"
 AFG_civil_war:0 "Вторая [AFG.GetAdjective]ая гражданская война"
 AFG_civil_war_desc:0 "Наши моджахеды вновь восстали против тирании, на этот раз совместно со множеством племён государства [AFG.GetNonIdeologyName] и подпольной организацией «Джамиат-и Ислами». Хаджи Мирзали-хан сплотил нас против правительства — короля и его регентства. Мы обязаны продолжить праведную борьбу, однако сперва необходимо определить ключевые направления наступления."
