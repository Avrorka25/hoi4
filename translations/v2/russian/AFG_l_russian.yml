 AFG_revive_basmachi_decision_category_desc:0 "Народы [SOV.GetAdjective]ой Центральной Азии слишком долго страдали от угнетения режима. Их культура, религия и сам образ жизни оказались под угрозой со стороны [SOV.GetAdjective]ой власти! Пришло время восстать против угнетателей! За свою страну! За свою веру! За свою свободу!"
