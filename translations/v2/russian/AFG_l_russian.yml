 AFG_afghan_army:0 "[GetAfghanArmyFocusName]"
 AFG_afghan_army_desc:0 "Славный [GetAfghanArmyFocusName] Он может гордиться тем, что ему удалось достичь уровня глубокой славы во всем мире, за то, что его особенно трудно победить, и если нет, то самый опасный враг, с которым можно столкнуться на поле боя, не говоря уже о борьбе с терроризмом. [AFG.GetAdjective]на своей домашней территории. В мирное время, в [GetAfghanArmyFocusName] Он содержит от 70 до 80 тысяч солдат, которые всегда готовы к войне. Тем не менее, наши военные в значительной степени зависят от иностранной техники, а такие страны, как США и США. [ENG.GetNonIdeologyName], [SOV.GetNonIdeologyName] и [GER.GetNonIdeologyName] служит жизненно важными источниками современного оборудования и военной техники.\n\nВ [AFG.GetNonIdeologyName]Дни длинны, горы высоки, а битвы тяжелы."
