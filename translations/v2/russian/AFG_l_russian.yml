 AFG_bank_millie_afghan:0 "Банк-е Милли Афган"
 AFG_bank_millie_afghan_desc:0 "Bânk-e Millie Afghân была основана в 1932 году как акционерное общество, большая часть акций которого принадлежала правительству. Его возглавляет один из величайших афганских экономистов Абдул Маджид Забули, также симпатизирующий Адольфу Гитлеру. Банк функционирует как национальный банк [AFG.GetNonIdeologyName] В течение четырех лет она сохраняла монополию на государственную торговлю. Благодаря тесному сотрудничеству с правительством, инвестициям как в частный, так и в государственный сектор, а также виртуальной монополии на всю отрасль и импортно-экспортную торговлю внутри страны. [AFG.GetNonIdeologyName]Банк принёс огромную прибыль примерно двум тысячам акционеров, а также правительству."
 AFG_decentralized_economy:0 "Запущенная экономика"
 AFG_decentralized_economy_desc:0 "[AFG.GetNonIdeologyName]Экономика остается в значительной степени слаборазвитой, полагаясь в значительной степени на торговлю сырьевыми товарами, такими как хлопок, каракуль, табак и опиум, который играет значительную роль в торговле хлопком и опиом. [AFG.GetAdjective] экономики. Несмотря на свое важное географическое положение в качестве перекрестка между Европой и Азией, [AFG.GetNonIdeologyName] Он не смог в полной мере воспользоваться своим стратегическим положением, чему помешала изоляция и рудиментарная экономическая структура."
 AFG_decentralized_economy_1:0 "Запущенная экономика"
 AFG_decentralized_economy_1_desc:0 "[AFG.GetNonIdeologyName]Экономика остается в значительной степени слаборазвитой, полагаясь в значительной степени на торговлю сырьевыми товарами, такими как хлопок, каракуль, табак и опиум, который играет значительную роль в торговле хлопком и опиом. [AFG.GetAdjective] экономики. Несмотря на свое важное географическое положение в качестве перекрестка между Европой и Азией, [AFG.GetNonIdeologyName] Он не смог в полной мере воспользоваться своим стратегическим положением, чему помешала изоляция и рудиментарная экономическая структура."
 AFG_decentralized_economy_2:0 "Запущенная экономика"
 AFG_decentralized_economy_2_desc:0 "[AFG.GetNonIdeologyName]Экономика остается в значительной степени слаборазвитой, полагаясь в значительной степени на торговлю сырьевыми товарами, такими как хлопок, каракуль, табак и опиум, который играет значительную роль в торговле хлопком и опиом. [AFG.GetAdjective] экономики. Несмотря на свое важное географическое положение в качестве перекрестка между Европой и Азией, [AFG.GetNonIdeologyName] Он не смог в полной мере воспользоваться своим стратегическим положением, чему помешала изоляция и рудиментарная экономическая структура."
 AFG_decentralized_economy_3:0 "Экономический бум"
 AFG_decentralized_economy_3_desc:0 "Всего за несколько коротких лет, [AFG.GetNonIdeologyName] Она превратилась из слаборазвитой захолустья в быстро модернизирующуюся и процветающую страну. Это замечательное достижение является неоспоримым доказательством того, что прогресс, когда-то считавшийся невозможным, теперь находится в пределах нашей досягаемости!"
 AFG_bank:0 "Да. [AFG.GetNonIdeologyName] Банк"
 AFG_bank_improved:0 "Да. [AFG.GetNonIdeologyName] Банк"
 AFG_illiteracy:0 "Повсеместная неграмотность"
 AFG_illiteracy_desc:0 "The [AFG.GetAdjective] Население страдает от широко распространенной неграмотности, менее десяти процентов из которых умеют читать или писать, в основном из-за низкого качества жизни и плохого управления системой образования. Эта острая нехватка квалифицированных кадров оставила более высокие рабочие места и правительственные должности либо незаполненными, либо заполненными иностранцами, такими как турки и немцы. Даже недавно открытый Кабульский университет, основанный в 1931 году, столкнулся с задержками в приеме студентов из-за нехватки квалифицированного персонала."
