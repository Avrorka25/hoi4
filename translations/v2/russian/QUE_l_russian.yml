 QUE_independance_economical_shock_desc:0 "Экономика бывшей провинции Квебек всё ещё сильно зависела от федерального правительства в Оттаве. После обретения независимости местное хозяйство пострадало как от Великой депрессии в Северной Америке, так и от собственных проблем."
 QUE_independance_economical_shock1_desc:0 "Экономика бывшей провинции Квебек всё ещё сильно зависела от федерального правительства в Оттаве. После обретения независимости местное хозяйство пострадало как от Великой депрессии в Северной Америке, так и от собственных проблем."
