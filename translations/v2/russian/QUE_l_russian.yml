 QUE_bust_down_the_unions:0 "Разгромить профсоюзы"
 QUE_bust_down_the_unions_desc:0 "Что профсоюзы сделали для нас? Они лишь распространяли мерзкие коммунистические идеи и позволяли ленивым рабочим диктовать условия своим трудолюбивым законным хозяевам!"
 QUE_carry_on_the_work:0 "Продолжить прежний курс"
 QUE_carry_on_the_work_desc:0 "Наша партия проделала невероятную работу по улучшению Квебека! Было бы глупо разрушить всё из-за заблуждений."
 QUE_liberals_legacy_saved:0 "Наследие Либеральной партии спасено"
 QUE_liberals_legacy_saved_desc:0 "Мы сделали это! Мы спасли партию! Квебекский народ доверил нам ещё один срок, и мы сделали всё возможное!"
 QUE_universal_suffrage:0 "Всеобщее избирательное право"
 QUE_universal_suffrage_desc:0 "Осталась последняя избирательная реформа, после которой каждый взрослый житель Квебека сможет голосовать: всеобщее избирательное право! С нашим большинством в парламенте ничто не помешает принять его!"
 QUE_safeguard_the_rights_to_unionize:0 "Защитить право на создание профсоюзов"
