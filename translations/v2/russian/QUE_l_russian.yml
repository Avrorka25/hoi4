 QUE_wood_industry_desc:0 "Рубить деревья ради прибыли."
 QUE_northern_expansion:0 "Освоение севера"
 QUE_northern_expansion_desc:0 "Новые города на севере."
 QUE_forest_training:0 "Подготовка в лесах"
 QUE_forest_training_desc:0 "Подготовка в лесах"
 QUE_winter_equipment:0 "Зимнее снаряжение"
 QUE_winter_equipment_desc:0 "Зимой холодно — это общеизвестный факт. Учитывая особенно суровые зимы, было бы глупо не снабдить солдат соответствующим снаряжением."
 QUE_expand_mining:0 "Расширить добычу полезных ископаемых"
 QUE_expand_mining_desc:0 "Больше золота!"
 QUE_organize_the_militias:0 "Организовать ополчение"
 QUE_organize_the_militias_desc:0 "Организовать ополчение"
 QUE_quebec_arsenal:0 "Квебекский арсенал"
 QUE_quebec_arsenal_desc:0 "Один из важнейших производителей боеприпасов в регионе."
 QUE_small_arms_production:0 "Производство стрелкового оружия"
 QUE_small_arms_production_desc:0 "Подать боеприпасы!"
 QUE_modernized_support_equipment:0 "Современное вспомогательное снаряжение"
 QUE_modernized_support_equipment_desc:0 "Больше поддержки!"
 QUE_land_doctrine_reform:0 "Реформа сухопутной доктрины"
 QUE_land_doctrine_reform_desc:0 "Лучшая тактика для лучших сражений."
 QUE_quebecois_officer_corps:0 "Квебекский офицерский корпус"
 QUE_quebecois_officer_corps_desc:0 "Квебекский офицерский корпус"
 QUE_marine_industries:0 "Морская промышленность"
 QUE_marine_industries_desc:0 "Судостроение на реке Святого Лаврентия"
 QUE_industrial_planning:0 "Промышленное планирование"
 QUE_industrial_planning_desc:0 "Прежде чем расширять промышленные отрасли, следует спланировать их развитие и другие долгосрочные проекты."
 QUE_sorel_steel_and_foundry:0 "Сорельский металлургический и литейный завод"
 QUE_sorel_steel_and_foundry_desc:0 "Сорель станет сердцем нашего сталелитейного производства и будет тесно связан с расположенной рядом верфью и запланированным оружейным заводом."
 QUE_stimulate_the_economy:0 "Стимулировать экономику"
 QUE_stimulate_the_economy_desc:0 "Вливание средств в экономику может дать достаточно сильный импульс, чтобы она вновь пошла в рост!"
 QUE_locomotive_industry:0 "Локомотивная промышленность"
 QUE_locomotive_industry_desc:0 "Быстро перевозить большие объёмы грузов по суше можно только по железной дороге. Следует вложиться в неё!"
 QUE_bombardier_vehicles:0 "Транспорт Bombardier"
 QUE_bombardier_vehicles_desc:0 "Bombardier известна изобретением снегохода. Возможно, её гениальные идеи и промышленные методы помогут создавать наши боевые машины."
 QUE_tank_program:0 "Танковая программа"
 QUE_tank_program_desc:0 "Войны больше не выигрываются одной лишь пехотой и силой воли. Для победы нужны технологические достижения, и первым шагом станет запуск танковой программы."
 QUE_angus_shop_tank_production:0 "Производство танков в мастерских Ангус"
 QUE_angus_shop_tank_production_desc:0 "Мастерские CPR Angus в районе Монреаля являются крупным производителем различных локомотивов. Возможно, их заводы смогут послужить нашему военно-промышленному комплексу."
 QUE_sorel_industries:0 "Промышленность Сореля"
 QUE_sorel_industries_desc:0 "Удобное положение на реке Святого Лаврентия и близость сталелитейных заводов идеально подходят для производства тяжёлого военного снаряжения, например артиллерии."
 QUE_artillery_improvements:0 "Улучшение артиллерии"
 QUE_artillery_improvements_desc:0 "Артиллерия — основа армии, поэтому её совершенствование является логичным следующим шагом."
 QUE_naval_grade_steel:0 "Корабельная сталь"
 QUE_naval_artillery:0 "Морская артиллерия"
 QUE_shipbuilding_contacts:0 "Связи в судостроении"
 QUE_national_admiralty:0 "Национальное адмиралтейство"
 QUE_destroyer_focus:0 "Проектирование эсминцев"
 QUE_cruiser_focus:0 "Проектирование крейсеров"
