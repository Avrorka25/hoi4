 quebec.1.t:0 "Отставка [ROOT.GetLeader]"
 quebec.1.d:0 "Похоже, [ROOT.GetLeader] подал в отставку после недавнего скандала, выставившего его мошенником. Подробности всё ещё неясны, СМИ уже ухватились за эту возможность, но [ROOT.GetLeader] успел назначить преемника."
 quebec.1.a:0 "Это наверняка ударит по репутации правящей партии"
 quebec.2.t:0 "Квебек предлагает союз!"
 quebec.2.d:0 "С тех пор как новый режим на севере, в бывшей провинции Квебек, избрал новую форму правления, мы заметили определённые изменения в их культуре, призванные отвести нам место в их сердце в форме геральдической лилии! Однако их амбиции простираются дальше нынешних земель, и они предлагают союз на случай, если всё пойдёт плохо."
 quebec.2.a:0 "Мы с гордостью провозглашаем новую эпоху для обеих наших наций!"
 quebec.2.b:0 "Нас не интересуют их выходки."
 quebec.3.t:0 "Потрясающие новости!"
 quebec.3.d:0 "Наши французские друзья приняли справедливое предложение! Отныне мы официально состоим в союзе с их правительством!"
 quebec.3.a:0 "Вместе мы устремимся к победе! Ура!"
 quebec.4.t:0 "Предательство наших друзей"
 quebec.4.d:0 "Наши дипломаты вернулись из французской столицы с трагическими новостями! Нынешнее правительство не присоединится к нашему славному союзу."
 quebec.4.a:0 "Возможно, немцы были правы... Они и правда трусы!"
 quebec.5.t:0 "Пограничный вопрос"
 quebec.5.d:0 "Недавно [ROOT.GetLeader] созвал кабинет на чрезвычайное заседание по важному вопросу. Оказалось, что закрытие границ в панике после обретения независимости нанесло огромный ущерб экономике! [ROOT.GetLeader] предложил обсудить с правительством [CAN.GetName] взаимовыгодное решение.\n\nНекоторые, главным образом министры с антииммиграционными взглядами и [ROOT.GetAdjective] националисты, резко выступают против, опасаясь полного контроля администрации [CAN.GetName] над нашей политикой и экономикой. Увы, они не понимают, что в будущем такой сценарий может стать необходимостью."
 quebec.5.a:0 "Мы должны обратиться к канадским друзьям!"
 quebec.6.t:0 "Интересное предложение"
 quebec.6.d:0 "Сегодня [ROOT.GetLeader] был удивлён необычным письмом из [QUE.GetName]. В нём изложен план возможного будущего сотрудничества. Учитывая все наши инвестиции в их страну, говорится в письме, нам следует рассмотреть предложение. Однако некоторые разгневанные министры отвергают эти требования, заявляя, что [QUE.GetName] уже ушёл и должен заплатить за это."
 quebec.6.a:0 "Не вижу ничего плохого в помощи старому другу."
 quebec.6.b:0 "Нужно было не закрывать границы, глупцы!"
 quebec.7.t:0 "[CAN.GetNameDefCap] соглашается"
 quebec.7.d:0 "На недавнем заседании кабинета [CAN.GetLeader] сообщил замечательную новость: между [ROOT.GetNameDef] и [CAN.GetNameDef] больше не будет пограничных ограничений, и наши народы смогут свободно перемещаться! Это великий день в истории обеих наций!"
 quebec.7.a:0 "Потрясающе!"
 quebec.8.t:0 "[CAN.GetNameDefCap] отказывает"
 quebec.8.d:0 "В недавнем заявлении [CAN.GetNameDef] подтвердил наши худшие опасения. Дипломатические связи рухнули, а их правительство открыто раскритиковало нас, назвав «глупцами» и обвинив в бедах [CAN.GetNameDef]! Отношения между нашими странами окончательно разрушены..."
 quebec.8.a:0 "Это конец наших дружеских отношений..."
 quebec.9.t:0 "Последнее требование"
 quebec.9.d:0 "После смены курса премьер-министр [ROOT.GetLeader] из [ROOT.GetNameDef] и премьер-министр [CAN.GetLeader] из [CAN.GetNameDef] встретились сегодня в Оттаве ради последней просьбы [ROOT.GetLeader]. [ROOT.GetSheHe] спросил у уважаемого [CAN.GetLeader], согласится ли [CAN.GetSheHe] на особое предложение. [ROOT.GetNameDef] вновь присоединится к [CAN.GetNameDef], но в качестве автономной нации в составе Канады.\n\nФедеральное правительство получит контроль над некоторыми отраслями нашей страны, тогда как мы сохраним широкую автономию. Националисты и различные скептики уже выступают против сделки, не понимая её возможных преимуществ, а часть населения радуется перспективе вновь присоединиться к Канаде..."
 quebec.9.a:0 "Будем надеяться, что они сделают правильный выбор!"
 quebec.10.t:0 "Помощь имеет цену"
 quebec.10.d:0 "Для правящего правительства это была крайне напряжённая неделя, но [ROOT.GetLeader] наконец получил хорошие новости, отвлёкшие его от бесчисленных тревог о судьбе квебекской нации. Канада приняла наше предложение вступить в конфедерацию в качестве отдельной нации. Националисты возмущены, крича о «подчинении» и «предательстве», но [CAN.GetLeader] заверил население, что это было единственно верное решение."
 quebec.10.a:0 "По крайней мере, теперь мы в безопасности."
 quebec.11.t:0 "Предложение от Квебека"
 quebec.11.d:0 "Сегодня к нам обратились представители Квебека с заманчивым предложением. Они утверждают, что для борьбы против канадских империалистов им нужна наша помощь, и желают вступить в Коминтерн."
 quebec.11.a:0 "Мы принимаем их предложение!"
 quebec.11.b:0 "Зачем нам тратить ресурсы на Квебек?"
 quebec.12.t:0 "Вздох облегчения"
 quebec.12.d:0 "По всей провинции празднуют последние новости! По словам председателя Роуза, Советский Союз и наша славная социалистическая республика заключили официальный союз!"
 quebec.12.a:0 "Пусть этот новый союз окажется плодотворным!"
 quebec.13.t:0 "Катастрофа!"
 quebec.13.d:0 "Сегодня вечером правящий кабинет провёл чрезвычайное заседание по важнейшему вопросу. Ответ на письмо, отправленное Советскому Союзу, оказался отрицательным: они, похоже, отказали нам в защите!"
 quebec.13.a:0 "Значит, придётся обойтись без них."
 quebec.14.t:0 "Ой! Это баг! (простите)"
 quebec.14.d:0 "Я понятия не имею, как срабатывает это событие, а мой код непонятен. Если вы это видите — это баг :)"
 quebec.14.a:0 "Пойду сообщу об ошибке!"
 quebec.15.t:0 "Необычная просьба"
 quebec.15.d:0 "[QUE.GetNameDef] вновь прислала очередную просьбу. Однако на этот раз она потрясла премьер-министра [ROOT.GetLeader]. Согласно письму, [QUE.GetLeader] просит восстановить членство страны в конфедерации при одном условии: предоставить расширенную автономию, фактически превратив их в наших вассалов, а не обычную канадскую территорию. Большинство населения с радостью примет квебекцев обратно, но остаётся вопрос: стоит ли дать им ещё один шанс?"
 quebec.15.a:0 "Пусть наши квебекские друзья почувствуют, что им снова рады!"
 quebec.15.b:0 "Скажите им, что с нас довольно их нелепых просьб!"
 quebec.16.t:0 "От одного премьер-министра другому"
 quebec.16.d:0 "После обретения независимости мы поняли, что было бы глупо разрывать все связи с крупнейшим и важнейшим соседом. Поэтому многие депутаты предложили восстановить дипломатические отношения с [CAN.GetNameDef], и большинство согласилось: одни опасаются господства [USA.GetNameDef], другие руководствуются тем, что называют «здравым смыслом»."
 quebec.16.a:0 "Пусть [CAN.GetNameDef] поступит правильно."
 quebec.17.t:0 "[QUE.GetNameDefCap] желает восстановить дипломатические отношения"
 quebec.17.d:0 "Сегодня [QUE.GetNameDef] направила послание в совершенно ином тоне. Возможно, впервые со времени обретения независимости она хочет восстановить постоянные дипломатические контакты с нами! Многие уже назвали это очевидным последствием их отделения и нашей возможностью оставить их наедине с «последствиями собственных действий». Другие же считают, что восстановление связей станет первым шагом к квебекско-канадской дружбе."
 quebec.17.a:0 "Дипломатия может принести только хорошее!"
 quebec.17.b:0 "Нет, не думаю, что мы согласимся."
 quebec.18.t:0 "[CAN.GetNameDefCap] согласилась восстановить отношения!"
 quebec.18.d:0 "К счастью, [CAN.GetNameDef] приняла наше предложение, и вскоре прибудут послы!"
 quebec.18.a:0 "Ура франко-канадским отношениям!"
 quebec.19.t:0 "[CAN.GetNameDefCap] отказалась от любых контактов!"
 quebec.19.d:0 "К несчастью, [CAN.GetNameDef] в приступе самодовольной ярости отвергла наше дружеское предложение! Более того, нам велели разбираться с проблемами самостоятельно или снова вступить в конфедерацию!"
 quebec.19.a:0 "Будь они прокляты! Они нам не нужны!"
 quebec.20.t:0 "Квебек разрывает все связи!"
 quebec.20.d:0 "Неожиданно, премьер-министр [QUE.GetLeader] из [QUE.GetNameDef] как для своего национального населения, так и для международного сообщества, [QUE.GetNameDef] немедленно прервать любые дипломатические отношения, которые [QUE.GetNameDef] Держись с нами!"
 quebec.20.a:0 "Будь они прокляты! Они нам не нужны!"
 quebec.21.t:0 "Да здравствует свободный Квебек!"
 quebec.21.d:0 "Несмотря на все препятствия, наша нация наконец сформировалась и до сих пор преодолевала любые трудности! Премьер-министр [ROOT.GetLeader] прокомментировал исторический успех [ROOT.GetNameDef]!"
 quebec.21.a:0 "Новый рассвет для квебекской нации!"
 quebec.22.t:0 "Чудесное восстановление"
 quebec.22.d:0 "По всему Квебеку жизнь постепенно возвращается к новому нормальному состоянию. Число бездомных достигло минимума, массовая бедность почти осталась в прошлом, а люди тратят деньги направо и налево. Даже неспециалисту ясно, что квебекская экономика переживает подъём. Корпорации богатеют и могут всё больше инвестировать в нашу территорию!"
 quebec.22.a:0 "Мы пережили худшее — теперь нам всё по силам!"
 quebec.23.t:0 "Всеобщая забастовка!"
 quebec.23.d:0 "Сегодня рабочие и студенты независимо от происхождения вышли на улицы с одной целью — разорвать мнимые цепи. К концу дня правительство во главе с [QUE.GetLeader] утратило контроль над страной и передало всю власть руководителям всеобщей забастовки. Прогрессивная рабочая партия теперь у власти, а её лидер поведёт Квебек в новую эпоху."
 quebec.23.a:0 "Вставайте, проклятьем заклеймённые..!"
 quebec.24.t:0 "Первый националистический конгресс Квебека"
 quebec.24.d:0 "После долгих часов споров между различными крыльями [QUE.GetRulingPartyLong] организаторы решили, что настало время голосования. Воодушевлённая толпа начала выбирать между двумя кандидатами..."
 quebec.24.a:0 "...Мы хотим Поля Бушара!"
 quebec.24.b:0 "...Да здравствует католический Квебек! Лионель Гру приведёт нас к славе!"
 quebec.25.t:0 "Разобраться с оппозицией"
 quebec.25.d:0 "Всё готово: полиция ждёт приказа, а ополчение готово штурмовать убежища наших известных противников! Осталось только дать команду. Кого мы сделаем целью?"
 quebec.25.a:0 "Никому нельзя доверять! Провести чистку всех без исключения!"
 quebec.25.b:0 "Мы будем сотрудничать с другими авторитарными группами — сосредоточиться на продемократическом сопротивлении!"
 quebec.25.c:0 "Мы пригласим продемократические элементы, готовые поддержать наше дело, — сосредоточиться на коммунистах!"
 quebec_commie.1.t:0 "[QUE.GetNameDefCap] претендует на Ньюфаундленд!"
 quebec_commie.1.d:0 "Из [QUE.GetNameDef] поступило неожиданное сообщение. [QUE.GetLeader] выдвинул ультиматум: передать Ньюфаундленд, их так называемую «законную землю», иначе последуют дипломатические последствия. Теперь нам решать, как ответить."
 quebec_commie.1.a:0 "У нас нет выбора, кроме как согласиться."
 quebec_commie.1.b:0 "К чёрту их! Мы не отдадим ни пяди!"
 quebec_commie.12.t:0 "Аннексия Ньюфаундленда!"
 quebec_commie.12.d:0 "Мир снова победил! После отправки ультиматума население [QUE.GetNameDef] затаило дыхание, но [ROOT.GetNameDef] успокоила нас, вернув наши земли!"
 quebec_commie.12.a:0 "Ага! Победа!"
 quebec_commie.13.t:0 "[ROOT.GetNameDefCap] отказывает!"
 quebec_commie.13.d:0 "Несмотря на ясный ультиматум и мобилизацию, наши требования были проигнорированы! Теперь правительство расколото между сторонниками войны и мира: одни требуют вернуть законные квебекские земли, другие утверждают, что война станет катастрофой!"
 quebec_commie.13.a:0 "Мы их предупреждали."
 quebec_commie.13.b:0 "Не стоит начинать войну из-за Ньюфаундленда..."
 quebec_commie.2.t:0 "[QUE.GetNameDefCap] претендует на Нью-Брансуик!"
 quebec_commie.2.d:0 "[QUE.GetLeader] из [QUE.GetNameDefCap] настроил нацию против нас, заявляя, что мы владеем и угнетаем «по праву квебекских рабочих» и что «только они способны дать им настоящую свободу»."
 quebec_commie.2.a:0 "У нас нет выбора, кроме как согласиться."
 quebec_commie.2.b:0 "К чёрту их! Мы не отдадим ни пяди!"
 quebec_commie.22.t:0 "Аннексия Нью-Брансуика!"
 quebec_commie.22.d:0 "Войны удалось избежать! [ROOT.GetNameDef] вернула нашу территорию, а власти уже коллективизируют регион в соответствии с нашей экономической политикой!"
 quebec_commie.22.a:0 "Рабочие Квебека, объединяйтесь!"
 quebec_commie.23.t:0 "[ROOT.GetNameDefCap] отказывает!"
 quebec_commie.23.d:0 ""
 quebec_commie.23.a:0 "К войне!"
 quebec_commie.23.b:0 "Мы вернёмся за этим позже..."
 quebec_commie.24.t:0 "Вопрос о руководстве [QUE.GetCommunistParty]"
 quebec_commie.24.d:0 "Народ [ROOT.GetName] выбрал свой путь. Он избрал внутреннюю свободу от [CAN.GetNameDef] и освобождение от собственных цепей. После достижения внешней независимости возник вопрос политической свободы. Многие считают, что [ROOT.GetCommunistLeader] не способен выражать волю народа, и требуют смены руководства."
 quebec_commie.24.a:0 "Мы можем довериться Фреду Роузу и его политическому опыту."
 quebec_commie.24.b:0 "Коммунистическая революция должна быть также феминистской — нам нужна Леа Робак!"
 quebec_commie.24.c:0 "Нам нужна растущая популярность Анри Ганьона!"
 quebec_fascism.1.t:0 "[QUE.GetNameDefCap] претендует на Нью-Брансуик!"
 quebec_fascism.1.d:0 "Новый режим [QUE.GetNameDefCap] обратил взор на расширение, и многие в нашем кабинете опасаются худшего! Некоторые политики на западе утверждают, что уступка их требованиям избавит нас от ужасов войны, поскольку Нью-Брансуик не стоит вооружённого конфликта."
 quebec_fascism.1.a:0 "У нас нет выбора, кроме как согласиться."
 quebec_fascism.1.b:0 "К чёрту их! Мы не отдадим ни пяди!"
 quebec_fascism.12.t:0 "[ROOT.GetNameDefCap] передаёт Нью-Брансуик!"
 quebec_fascism.12.d:0 "[CAN.GetNameDefCap] прислушалась к разуму и без боя уступила Нью-Брансуик. Сегодня утром [ROOT.GetLeader] объявил об этом ликующей толпе, и это стало крупной победой нашего правительства!"
 quebec_fascism.12.a:0 "Их слабость играет нам на руку!"
 quebec_fascism.13.t:0 "[ROOT.GetNameDefCap] отказывает!"
 quebec_fascism.13.d:0 "[CAN.GetNameDefCap] отказалась немедленно передать Нью-Брансуик. Это вызвало волну возмущения среди нашего народа, а сторонники войны требуют немедленного военного ответа. Однако более рассудительные голоса считают иначе: [CAN.GetNameDef] отказала бы только в том случае, если уверена в способности дать отпор..."
 quebec_fascism.13.a:0 "К войне!"
 quebec_fascism.13.b:0 "Мы вернёмся за этим позже..."
 quebec_fascism.2.t:0 "Раздел Канады"
 quebec_fascism.2.d:0 "Победа над [CAN.GetNameDef] завершена, и вся её территория принадлежит нам. Однако не все эти земли когда-либо были нашими. Министры подготовили несколько планов решения «канадского вопроса»."
 quebec_fascism.2.a:0 "Распустить конфедерацию!"
 quebec_fascism.2.b:0 "Создать лояльную Канаду."
 quebec_fascism.2.c:0 "Достаточен только прямой контроль."
 quebec_fascism.3.t:0 "Судьба Америки"
 quebec_fascism.3.d:0 "После сокрушительного поражения в войне вопрос [USA.GetNameDef] всё ещё не решён. Нам предстоит определить судьбу [USA.GetOldNameDef]."
 quebec_fascism.3.a:0 "Разделить её на небольших лояльных субъектов."
 quebec_fascism.3.b:0 "Возродить Французскую Луизиану."
 quebec_fascism.3.c:0 "Аннексировать всё! Всё это принадлежит нам!"
 quebec_fascism.4.t:0 "Предложение [BCO.GetNameDefCap]"
 quebec_fascism.4.d:0 "После завоевания и раздела Америки правительства [BCO.GetAdjectiveCap] и [ACN.GetAdjectiveCap] потребовали территории, которые, по их словам, им «принадлежат»."
 quebec_fascism.4.a:0 "Не вижу в этом ничего плохого!"
 quebec_fascism.4.b:0 "Нет."
