 QUE_a_s_warfare:0 "Противолодочная борьба"
 QUE_increase_naval_production:0 "Увеличить производство кораблей"
 QUE_the_fleet_of_old:0 "Вдохновиться Королевским флотом"
 QUE_battleship_focus:0 "Линкоры"
 QUE_the_biggest_battleship:0 "Плавучая крепость"
 QUE_the_blocade_doctrine:0 "Доктрина блокады"
 QUE_silent_service:0 "Подводная служба"
 QUE_stealth_upgrades:0 "Улучшение скрытности"
 QUE_carrier_strikes:0 "Удары авианосцев"
 QUE_naval_air_groups:0 "Морские авиагруппы"
 QUE_lessons_for_the_air_force:0 "Уроки для военно-воздушных сил"
 QUE_saguenay_industries:0 "Промышленность Сагене"
 QUE_saguenay_industries_desc:0 ""
 QUE_mauricie_development:0 "Промышленное развитие Мориси"
 QUE_mauricie_development_desc:0 ""
 QUE_cote_nord_expansion:0 "Колонизация Кот-Нора"
 QUE_cote_nord_expansion_desc:0 ""
 QUE_army_effort:0 "Реорганизовать квебекские полки"
 QUE_army_effort_desc:0 "Несмотря на растущие возможности воздушной и морской войны, сухопутные сражения останутся важнейшей частью будущих конфликтов. Подготовившись, мы сможем избежать повторения окопного ада."
 QUE_equipment_effort:0 "Модернизировать снаряжение"
 QUE_equipment_effort_desc:0 "Пределы того, какое снаряжение способна нести пехота, постоянно расширяются. Мы сосредоточимся на обеспечении войск лучшими доступными средствами."
 QUE_motorization_effort:0 "Моторизованная поддержка"
 QUE_motorization_effort_desc:0 "Подвижность и защита жизненно важны для безопасной доставки пехоты на поле боя и её эвакуации. Развитие этих направлений позволит действовать быстрее."
 QUE_doctrine_effort:0 "Разработать новую тактику"
 QUE_doctrine_effort_desc:0 "Военные доктрины, определявшие сухопутные сражения Великой войны, устарели. Лучшие умы страны должны сформировать военную мысль завтрашнего дня."
 QUE_equipment_effort_2:0 "Продолжить реформу снаряжения"
 QUE_equipment_effort_2_desc:0 "Мы продолжим добиваться того, чтобы пехота и вспомогательные части были вооружены лучшим доступным снаряжением современности."
 QUE_mechanization_effort:0 "Механизированная пехота"
 QUE_mechanization_effort_desc:0 "Переосмыслив возможности моторизованной пехоты, мы сможем расширить пределы того, какие машины способны создавать сегодня."
 QUE_doctrine_effort_2:0 "Крупномасштабные учения"
 QUE_doctrine_effort_2_desc:0 "В межвоенные годы и последних конфликтах поле боя изменилось. Необходимо постоянно пересматривать доктрины с учётом новых условий."
 QUE_equipment_effort_3:0 "Завершить военную модернизацию"
 QUE_equipment_effort_3_desc:0 "Вместо копирования или закупки иностранного снаряжения мы должны стать мировым лидером в производстве пехотного оружия."
 QUE_armor_effort:0 "Разработать бронетехнику"
 QUE_armor_effort_desc:0 "Применяя опыт механизации пехоты, мы также можем улучшить бронетехнику."
 QUE_special_forces:0 "Войска специального назначения"
 QUE_special_forces_desc:0 "Нам нужны элитные войска. Приоритетом должны стать горные части и десантники."
 QUE_aviation_effort:0 "Основать Квебекскую авиационную школу"
 QUE_aviation_effort_tt:0 "Недостаточно ячеек для строительства §Yавиабазы§!"
 QUE_aviation_effort_desc:0 "Нигде технологический прогресс не идёт так быстро, как в воздушной войне. Авиация — область, которой обязана овладеть любая современная страна."
 QUE_fighter_development:0 "Эскадрилья «Жаворонок»"
 QUE_fighter_development_desc:0 "Воздушные бои Великой войны ещё не ушли в прошлое. Опережающее развитие истребителей даст нам преимущество в будущем."
 QUE_bomber_focus:0 "Упор на бомбардировщики"
 QUE_bomber_focus_desc:0 "Когда люди будущего будут говорить об ужасах нынешних войн, они наверняка вспомнят огонь, льющийся с небес. Мы сделаем всё, чтобы эти истории рассказывали наши враги."
 QUE_aviation_effort_2:0 "Изучить иностранную тактику"
 QUE_aviation_effort_2_desc:0 "Для полноценного взаимодействия военно-воздушных сил с другими родами войск потребуются дальнейшие достижения в авиации."
 QUE_CAS_effort:0 "Пикирующие бомбардировщики"
 QUE_CAS_effort_desc:0 "Современной армии требуется поддержка техники как на земле, так и в воздухе."
 QUE_rocket_effort:0 "Ракетные двигатели"
 QUE_rocket_effort_desc:0 "Ракетные и реактивные двигатели позволяют достигать невиданных скоростей как беспилотным, так и пилотируемым аппаратам. Освоив эти технологии первыми, мы сможем застать врага врасплох."
 QUE_NAV_effort:0 "Морские бомбардировщики"
 QUE_NAV_effort_desc:0 "Новая морская война идёт не только под поверхностью воды, но и в воздухе над ней."
 QUE_naval_effort:0 "Финансировать судостроение"
 QUE_naval_effort_tt:0 "Недостаточно ячеек для строительства §Yвоенно-морских верфей§!"
 QUE_naval_effort_desc:0 "Расширение флота должно стать приоритетом. Необходимо направить все доступные ресурсы на новые верфи и исследования лёгких надводных кораблей."
 QUE_flexible_navy:0 "Гибкий флот"
 QUE_flexible_navy_desc:0 "Переосмысление морской войны с учётом развития подводных технологий позволит эффективно наносить удары по вражеским конвоям."
 QUE_large_navy:0 "Большой флот"
 QUE_large_navy_desc:0 "Адаптация морских доктрин для крупных кораблей и обеспечение безопасности торговых конвоев многому научат нас в вопросе необходимых типов судов."
 QUE_submarine_effort:0 "Подводная война"
 QUE_submarine_effort_desc:0 "Подводная война — самое захватывающее развитие морского дела со времён появления торпедных катеров. Следует защищаться от субмарин и использовать их против вражеского судоходства."
 QUE_cruiser_effort:0 "Разработать крейсеры"
 QUE_cruiser_effort_desc:0 "Прежде чем переходить к передовым исследованиям линкоров, необходимо заменить устаревшие малые крейсеры."
 QUE_destroyer_effort:0 "Проектировать эсминцы"
 QUE_destroyer_effort_desc:0 "Изучая конструкцию и стратегическое применение подводных лодок, мы также научились противодействовать им. Эсминцы будут играть в этом ключевую роль."
 QUE_capital_ships_effort:0 "Интерес к крупным кораблям"
 QUE_capital_ships_effort_desc:0 "Страна с наибольшим числом линкоров будет править океанами. Линкоры и авианосцы представляют старое и новое морского превосходства."
 QUE_industrial_effort:0 "Промышленное развитие"
 QUE_industrial_effort_desc:0 "Сосредоточить все политические усилия на стремительном развитии гражданской промышленности."
 QUE_industrial_effort_2:0 "Промышленное развитие II"
 QUE_industrial_effort_2_desc:0 "Железной волей и неустанным трудом мы вновь мобилизуем народ на великий промышленный рывок."
 QUE_construction_effort_tt:0 "Недостаточно ячеек для строительства §Yфабрик§!"
 QUE_construction_effort:0 "Развивать промышленность Монреаля"
 QUE_construction_effort_desc:0 "."
 QUE_production_effort:0 "Построить военные мастерские"
 QUE_production_effort_tt:0 "Недостаточно ячеек для строительства §Yвоенного завода§!"
 QUE_production_effort_desc:0 "Если можно строить тракторы, можно строить и танки! Мы не должны допустить отставания военного производства."
 QUE_construction_effort_2:0 "Обновление портов"
 QUE_construction_effort_2_desc:0 "Продолжая расширять фабрики, мы ускорим производство товаров для торговли и дальнейшего строительства."
 QUE_production_effort_2:0 "Поддержать производство тяжёлой техники"
 QUE_production_effort_3:0 "Объединённая военная промышленность"
 QUE_production_effort_2_desc:0 "Квебек идеально расположен для развития промышленности, ориентированной на экспорт."
 QUE_production_effort_3_desc:0 "Необходимо продолжать расширение военных заводов, чтобы удовлетворить спрос на новое снаряжение."
 QUE_infrastructure_effort:0 "Обновить железные дороги"
 QUE_infrastructure_effort_desc:0 "Страна без надлежащей инфраструктуры не может осуществлять сложные проекты и строительство."
 QUE_infrastructure_effort_tt:0 "Недостаточно ячеек для строительства §Yинфраструктуры§!"
 QUE_synth_oil_effort_tt:0 "Недостаточно ячеек для строительства §Yзавода синтетического топлива§!"
 QUE_infrastructure_effort_2:0 "Обновить дороги"
 QUE_infrastructure_effort_2_desc:0 "Расширение инфраструктуры обеспечит транспорт и связь, необходимые для секретных высокотехнологичных проектов."
 QUE_construction_effort_3:0 "Лесозаготовительная промышленность севера"
 QUE_construction_effort_3_desc:0 "Расширение инфраструктурной сети значительно увеличило наши строительные возможности."
 QUE_nuclear_effort:0 "Проект «Монкальм»"
 QUE_nuclear_effort_desc:0 "Стоя на пороге открытия, способного изменить мир, мы не можем позволить другим зажечь огонь, который однажды может поглотить Землю."
 QUE_extra_tech_slot:0 "Исследовательские гранты"
 QUE_extra_tech_slot_desc:0 "Расширение промышленности и другие недавние достижения позволят вести больше исследований и разработок одновременно."
 QUE_extra_tech_slot_2:0 "Комитет координации инноваций"
 QUE_extra_tech_slot_2_desc:0 "Быстрая индустриализация открыла новые возможности в области исследований и разработок, которыми следует воспользоваться."
 QUE_technology_sharing:0 "Обмен технологиями"
 QUE_technology_sharing_desc:0 "Обмениваясь технологическими достижениями с союзниками, весь наш альянс сможет эффективнее проводить военные исследования и разработки."
 QUE_secret_weapons:0 "Секретное оружие"
 QUE_secret_weapons_desc:0 "Соблазнительно направить все дополнительные ресурсы на танки и самолёты, но секрет победы в войнах лежит в совершенно новых областях науки: электронике, ракетной технике и ядерных исследованиях."
 QUE_collectivist_ethos:0 "Усилить профсоюзы"
 QUE_collectivist_ethos_desc:0 "Наши враги могут разделять и покорять слабые страны, но наш народ останется единым: один за всех и все за одного."
 QUE_liberty_ethos:0 "Демократический консенсус"
 QUE_liberty_ethos_desc:0 "В эпоху идеологических фанатиков, стремящихся задушить человеческий дух, мы защитим личные свободы и права."
 QUE_militarism:0 "За Квебек!"
 QUE_militarism_desc:0 "Те, кто считает армию неизбежным злом, обречены колебаться перед лицом войны. Мы укореним милитаризм в культуре и станем народом солдат."
 QUE_political_correctness:0 "Политкорректность"
 QUE_political_correctness_desc:0 "Люди с умеренно спорными или просто неловкими взглядами, похоже, обеспокоены существованием масштабного заговора против них. Звучит как превосходная идея."
 QUE_neutrality_focus:0 "Курс на нейтралитет"
 QUE_neutrality_focus_desc:0 "Другие могут утверждать, что для выбора стороны в мировом конфликте нужны храбрость и мудрость, но мы знаем, что для отказа требуется ещё больше."
 QUE_interventionism_focus:0 "Курс на интервенционизм"
 QUE_interventionism_focus_desc:0 "Мы ценим свободу всех людей, а не только собственных граждан. Если для предотвращения тирании нужна война — пусть будет так."
 QUE_military_youth:0 "Военизированная молодёжь"
 QUE_military_youth_desc:0 "Организации, прививающие молодёжи дисциплину и политическое образование, с ранних лет укрепят верность и готовность к самопожертвованию."
 QUE_deterrence:0 "Сдерживание"
 QUE_deterrence_desc:0 "Оставаясь в одиночестве, мы редко получаем выгоду от войны. К счастью, лучшая оборона — та, о которой все знают и которую никогда не приходится применять."
 QUE_volunteer_corps:0 "Добровольческий корпус"
 QUE_volunteer_corps_desc:0 "Заставлять людей умирать за идеалы свободы было бы иронией, но создать возможности для тех, кто добровольно хочет помогать народам за рубежом, — нет."
 QUE_paramilitarism:0 "Интегрировать ополчение"
 QUE_paramilitarism_desc:0 "Военные принципы применимы и вне армии. Создание полувоенных частей в дополнение к вооружённым силам позволит большему числу людей получить военную подготовку."
 QUE_indoctrination_focus:0 "Идеологическая обработка"
 QUE_indoctrination_focus_desc:0 "Раз уж наша идеология основана на истине, её можно преподавать как истину. Образование и СМИ должны это отражать."
 QUE_foreign_expeditions:0 "Зарубежные экспедиции"
 QUE_foreign_expeditions_desc:0 "Пока враги готовы вмешиваться в далёкие конфликты ради своих идеалов, мы должны быть готовы делать то же самое ради наших."
 QUE_why_we_fight:0 "За что мы сражаемся"
 QUE_why_we_fight_effect:0 "Если у нас нет национального духа §Y«Нейтральная внешняя политика»§!, мы сможем создавать альянсы.\n"
 QUE_why_we_fight_desc:0 "Мир становится всё опаснее. Народ должен увидеть зверства тех, кто жаждет власти. Мы сплотим людей вокруг нашего дела и подготовим каждого к борьбе за свободу."
 QUE_political_commissars:0 "Политические комиссары"
 QUE_political_commissars_desc:0 "Чтобы обеспечить выполнение нашей политики в армии, мы введём в её ряды политически назначенных должностных лиц."
 QUE_internationalism_focus:0 "Курс на интернационализм"
 QUE_internationalism_focus_desc:0 "Идеология не знает границ. Другая страна может называть себя суверенной, но наши убеждения выше подобных притязаний."
 QUE_nationalism_focus:0 "Квебекская национальная партия"
 QUE_ultra_nationalism_focus:0 "Национальная память"
 QUE_nationalism_focus_desc:0 "Наша нация уникальна, и её политические достижения могли произойти только здесь. Мы должны защищать её любой ценой."
 QUE_ideological_fanaticism:0 "Идеологический фанатизм"
 QUE_ideological_fanaticism_desc:0 "Наши политические ценности и цели заслуживают смерти не меньше любой древней веры. Каждый сторонник должен быть готов погибнуть, а отступники — встретить смерть."
 QUE_conservatism_focus:0 "Католическое влияние"
 QUE_conservatism_focus_desc:0 "Католическое влияние."
 QUE_welfare_focus:0 "Социальные реформы"
 QUE_political_coalition_focus:0 "Политическая коалиция"
 QUE_political_coalition_focus_desc:0 "Политическая коалиция."
 QUE_support_steel_industry:0 "Поддержать сталелитейную промышленность"
 QUE_support_steel_industry_desc:0 "Наши земли богаты железной рудой, которую необходимо разрабатывать для увеличения производства стали."
 QUE_rearmement_agreement:0 "Соглашение о перевооружении"
 QUE_rearmement_agreement_desc:0 "В условиях растущей мировой напряжённости крайне важно улучшить военную организацию и гражданскую оборону."
 QUE_mobilize_the_rivers:0 "Мобилизовать реки"
 QUE_mobilize_the_rivers_desc:0 "Наши земли обладают огромным гидроэнергетическим потенциалом, который следует использовать для удовлетворения потребностей растущей промышленности."
 QUE_saguenay_aluminum:0 "Алюминий Сагене"
 QUE_saguenay_aluminum_desc:0 "Благодаря гидроэнергетике город Сагене стал важным центром производства алюминия."
 QUE_military_industrial_cooperation:0 "Военно-промышленное сотрудничество"
 QUE_military_industrial_cooperation_desc:0 "Армия не может существовать без инженеров и множества рабочих рук, создающих современное оружие."
 QUE_expanded_research_program:0 "Расширенная исследовательская программа"
 QUE_expanded_research_program_desc:0 "Расширение наших возможностей позволяет финансировать ещё больше программ вооружения."
 QUE_vive_le_quebec_libre:0 "§CДа здравствует свободный Квебек! §!"
 QUE_vive_le_quebec_libre_desc:0 ""
 QUE_a_standing_army:0 "Постоянная армия"
 QUE_a_standing_army_desc:0 "Хотя призыв крайне непопулярен в нашей провинции, часть высшего командования считает, что резкое, пусть и временное, увеличение военного финансирования поможет молодой стране создать полностью боеспособные вооружённые силы."
 QUE_political_effort:0 "Изучить политическую сцену Квебека "
 QUE_political_effort_desc:0 "Наша политическая система далека от совершенства и слишком подвержена коррупции. Мы обязаны искоренить продажных политиков!"
 QUE_political_effort_puppet:0 "Довериться сюзерену"
 QUE_political_effort_puppet_desc:0 ""
 QUE_trust_in_democracy:0 "Доверие к демократическому процессу"
 QUE_trust_in_democracy_desc:0 ""
 QUE_radical_changes:0 "Радикальные перемены"
 QUE_radical_changes_desc:0 ""
 QUE_accept_colonial_status:0 "Принять колониальный статус"
 QUE_accept_colonial_status_desc:0 ""
 QUE_storm_the_parliament:0 "Штурмовать парламент"
 QUE_storm_the_parliament_desc:0 ""
 QUE_communist_uprising:0 "Всеобщая забастовка"
 QUE_communist_uprising_desc:0 "Будь то английские империалисты или угнетающая буржуазия, квебекская нация больше не потерпит их тиранию и отнимет власть у некомпетентного буржуазного правительства, передав её пролетариату!"
 QUE_use_the_quebecois_nationalists:0 "Использовать националистов"
 QUE_use_the_quebecois_nationalists_desc:0 ""
 QUE_the_padlock_law:0 "Закон о навесном замке"
 QUE_the_padlock_law_desc:0 "Закон о навесном замке очищает наше великое общество от коммунистических элементов! Мы также можем распространить его на профсоюзы, которые лишь мешают расширению экономики."
 QUE_control_the_medias:0 "Контролировать СМИ"
 QUE_control_the_medias_desc:0 ""
 QUE_colonize_the_north:0 "Колонизация севера"
 QUE_colonize_the_north_desc:0 ""
 QUE_advatageous_foreign_trade_deal:0 "Расширяем торговлю с соседями"
 QUE_advatageous_foreign_trade_deal_desc:0 ""
 QUE_the_union_nationale_wins:0 "Победа Национального союза"
 QUE_the_union_nationale_wins_desc:0 ""
 QUE_liberal_in_charge:0 "Переизбрание либералов"
 QUE_liberal_in_charge_desc:0 ""
 QUE_quebec_on_the_worlds_stage:0 "Квебек на мировой арене"
 QUE_quebec_on_the_worlds_stage_desc:0 "После урегулирования внутренних дел мы наконец можем обратить внимание на напряжённый внешний мир и, возможно, навсегда обеспечить нашу независимость!"
 QUE_labor_laws:0 "Принять законы об охране труда"
 QUE_labor_laws_desc:0 "Некоторые члены правительства пытаются принять закон, ограничивающий деятельность профсоюзов и всё, что считается «большевистской пропагандой». Несмотря на важность защиты от коммунистической угрозы, необходимо обеспечить безопасность рабочих, чтобы они не обращались к крайним идеологиям."
 QUE_ally_with_french_state:0 "Союз с Французским государством"
 QUE_ally_with_french_state_desc:0 ""
 QUE_seize_foreign_assets:0 "Конфисковать иностранные активы"
 QUE_seize_foreign_assets_desc:0 ""
 QUE_officialize_our_ambitions_in_canada:0 "Официально объявить о канадских амбициях"
 QUE_officialize_our_ambitions_in_canada_desc:0 ""
 QUE_take_whats_rightfully_ours:0 "Вернуть то, что принадлежит нам по праву"
 QUE_take_whats_rightfully_ours_desc:0 ""
 QUE_all_power_to_the_leader:0 "Централизовать власть"
 QUE_all_power_to_the_leader_desc:0 ""
 QUE_political_nationalism:0 "Националистическая пропаганда"
 QUE_political_nationalism_desc:0 ""
 QUE_collectivism:0 "Сплотить рабочих"
 QUE_collectivism_desc:0 ""
 QUE_exploit_hydroelectricity:0 "Использовать гидроэнергию"
 QUE_exploit_hydroelectricity_desc:0 ""
 QUE_enforce_local_ressource_exploitation:0 "Обязательная эксплуатация местных ресурсов"
 QUE_enforce_local_ressource_exploitation_desc:0 ""
 QUE_remove_the_aristocracy:0 "Устранить аристократов"
 QUE_remove_the_aristocracy_desc:0 "Остатки старого порядка всё ещё сохраняют свои места. Хотя прежней огромной власти у них больше нет, они по-прежнему обладают опасным влиянием и без контроля сделают всё, чтобы подавить революцию! Наши меры §Rмогут быть крайними§!, но они необходимы ради §Gвсеобщего блага§!."
 QUE_the_quebec_red_army:0 "Красная армия Квебека"
 QUE_the_quebec_red_army_desc:0 "Революция победила, но для её сохранения нужна сильная армия. Несмотря на заблуждения некоторых товарищей, армия должна быть связана с государством! Великая Красная армия приведёт квебекский народ к победе!"
 QUE_communial_defense:0 "Стратегии общинной обороны"
 QUE_communial_defense_desc:0 "Пролетариат, победивший старого угнетателя и разорвавший собственные цепи, не должен сковывать себя новыми. Следует помнить о демократических корнях и применять их в вооружённых силах: армия народа, созданная для народа и свободная от тирании!"
 QUE_revolutionary_patriotism:0 "Революционный патриотизм"
 QUE_revolutionary_patriotism_desc:0 "Среди нас люди разного происхождения, но нас объединяют две вещи: мы квебекцы и прежде всего пролетарии — рабочие, которые освободят мир от цепей империализма и разлагающегося капитализма!"
 QUE_seize_the_royal_assets:0 "Конфисковать королевские активы"
 QUE_seize_the_royal_assets_desc:0 "Так называемая собственность короны, прежде всего прочно удерживаемые ею активы, будет отнята у тех, кто на протяжении всей истории пытался нас раздавить! Теперь их богатство послужит квебекскому народу, а не империалистическим «дарованным богом» правам!"
 QUE_collectivize_the_means_of_production:0 "Коллективизировать средства производства"
 QUE_collectivize_the_means_of_production_desc:0 "Согласно Марксу, революция приведёт к бесклассовому обществу. Чтобы действительно достичь этого, средства производства должны принадлежать всем, и все рабочие Квебека будут относиться к одному классу."
 QUE_redistribute_the_church_wealth:0 "Перераспределить богатства церкви"
 QUE_redistribute_the_church_wealth_desc:0 "Католическая церковь накопила слишком много богатств! Религия не должна принимать сектантские масштабы, а потраченные на неё средства можно вложить в народ."
 QUE_educate_the_masses:0 "Просвещать массы"
 QUE_educate_the_masses_desc:0 ""
 QUE_purge_the_anglophone:0 "Устранить двуязычие"
 QUE_purge_the_anglophone_desc:0 ""
 QUE_united_in_communism:0 "Единство в коммунизме"
 QUE_united_in_communism_desc:0 ""
 QUE_total_self_sufficiency:0 "Полная самодостаточность"
 QUE_total_self_sufficiency_desc:0 ""
 QUE_shatter_the_dream:0 "Разрушить мечту"
 QUE_shatter_the_dream_desc:0 ""
 QUE_free_the_canadian_workers:0 "Освободить канадских рабочих"
 QUE_free_the_canadian_workers_desc:0 ""
 QUE_establish_farmers_coops:0 "Создать фермерские кооперативы"
 QUE_establish_farmers_coops_desc:0 ""
 QUE_forced_industrialisation:0 "Принудительная индустриализация"
 QUE_forced_industrialisation_desc:0 ""
 QUE_soviet_tank_program:0 "Советская танковая программа"
 QUE_soviet_tank_program_desc:0 ""
 QUE_align_with_moscow:0 "Сблизиться с Москвой"
 QUE_align_with_moscow_desc:0 ""
 QUE_found_hydro_quebec:0 "Основать Hydro-Québec"
 QUE_found_hydro_quebec_desc:0 ""
 QUE_reform_the_party:0 "Реформировать партию"
 QUE_reform_the_party_desc:0 ""
 QUE_mandatory_minimum_wage:0 "Обязательная минимальная зарплата"
 QUE_mandatory_minimum_wage_desc:0 ""
 QUE_enforce_compulsory_education:0 "Ввести обязательное образование"
 QUE_enforce_compulsory_education_desc:0 ""
 QUE_enforce_religious_morality:0 "Добавить религиозную мораль в учебные программы"
 QUE_enforce_religious_morality_desc:0 ""
 QUE_found_the_conseil_superieur_du_travail:0 "Основать Высший совет труда"
 QUE_found_the_conseil_superieur_du_travail_desc:0 ""
 QUE_improve_agrarian_laws:0 "Улучшить аграрное законодательство"
 QUE_improve_agrarian_laws_desc:0 ""
 QUE_encourage_local_participation:0 "Поощрять местное участие"
 QUE_encourage_local_participation_desc:0 "В конце старого порядка участие масс в политической жизни было весьма ограниченным. Теперь следует создать больше местных комитетов, чтобы люди по всей стране могли участвовать в политике!"
 QUE_councilism:0 "Советизм"
 QUE_councilism_desc:0 "Чтобы оставаться сильными и едиными, необходимо изменить политическую структуру и сделать демократию неотъемлемой частью нашей идеологии."
 QUE_enforce_quotas:0 "Ввести квоты"
 QUE_enforce_quotas_desc:0 "Чтобы быть сильными, мы должны быть эффективными! Революция не совершится сама, пока все сидят без дела. Каждый пролетарий обязан трудиться ради революции, а отказавшиеся узнают, что бывает с контрреволюционерами!"
 QUE_provide_to_the_people:0 "Обеспечить народ"
 QUE_provide_to_the_people_desc:0 "Великая квебекская революция, без сомнения, победила. Теперь накопленное богатство необходимо направить всем, кто живёт под красным знаменем труда, чтобы социализм действительно служил народу."
 QUE_focus_on_family:0 "Сосредоточиться на семье"
 QUE_focus_on_family_desc:0 "Наше государство должно руководствоваться принципами «Труд, семья, отечество». Одним из этих столпов является семья, которая должна вновь занять центральное место в обществе Квебека!"
 QUE_contact_blueshirts:0 "Связаться с синерубашечниками"
 QUE_contact_blueshirts_desc:0 ""
 QUE_national_identity_propaganda:0 "Пропаганда национальной идентичности"
 QUE_national_identity_propaganda_desc:0 "Квебекский дух силён, а культура богата! Следует активнее распространять её среди населения."
 QUE_first_nationalist_congress:0 "Первый националистический конгресс"
 QUE_first_nationalist_congress_desc:0 "Наше движение добилось власти и начинает укреплять контроль над обществом Квебека, но внутри него сохраняется глубокий раскол. Возникли две основные фракции: сторонники ортодоксального фашизма Поля Бушара и последователи Лионеля Гру, одержимые католицизмом. Учредив конгресс, мы позволим народу выбрать будущего лидера!"
 QUE_abandon_ultramontanism:0 "Отказаться от ультрамонтанства"
 QUE_abandon_ultramontanism_desc:0 "Лионель Гру и его сторонники не увидели угрозы, которую сверхрелигиозное теократическое государство несёт нашему правлению! К счастью, придя к власти, мы можем устранить весь вред, нанесённый теократической скверной."
 QUE_glorify_clerical_past:0 "Прославлять клерикальное прошлое"
 QUE_glorify_clerical_past_desc:0 "Квебек и, шире, Новая Франция пережили страшные испытания за время своего существования. Теперь, когда у власти последователи Бога, мы докажем миру, что являемся богоизбранным народом!"
 QUE_disband_parlimentarism:0 "Упразднить парламентаризм"
 QUE_disband_parlimentarism_desc:0 "Что дала нам так называемая «демократия», кроме слабости, раскола и подчинения? Покончив с противниками, следует избавиться и от неё!"
 QUE_promote_interventionism:0 "Продвигать экономический интервенционизм"
 QUE_promote_interventionism_desc:0 "Позволять людям делать всё, что им вздумается, особенно в вопросах экономики, столь же глупо, как вручить им заряженное оружие! Только государство должно контролировать экономику."
 QUE_patriotic_education:0 "Патриотическое образование"
 QUE_patriotic_education_desc:0 "Первый шаг к воспитанию любви к великой нации лежит через образование! Мы изменим учебные программы в соответствии со своими взглядами, даже если придётся... подправить изложение истории."
 QUE_deal_with_opposition:0 "Разобраться с оппозицией"
 QUE_deal_with_opposition_desc:0 "Многие всё ещё выступают против нашего правления, прежде всего коммунисты и сторонники демократии. Эта печальная реальность заставляет сделать выбор: некоторых людей придётся устранить, §Rно сколько именно?§!"
 QUE_integrate_new_england:0 "Интегрировать Новую Англию"
 QUE_integrate_new_england_desc:0 ""
 QUE_secret_police:0 "Создать тайные службы"
 QUE_secret_police_desc:0 "Можем ли мы действительно доверять квебекскому пролетариату и надеяться, что он не поддастся вредным идеологиям? Необходимо усилить государственный надзор и арестовывать инакомыслящих!"
 QUE_a_bright_future_ahead:0 "Впереди светлое будущее"
 QUE_a_bright_future_ahead_desc:0 "Мы победили, социализм победил, и идея свободной квебекской нации победила! Теперь, когда народ живёт в единстве и социализме, пора устремить взгляд за границы!"
