 QUE_reclaim_our_cores_desc:0 "Семилетняя война и последовавший Парижский договор 1763 года положили конец французскому правлению в провинции. Эта смена власти лишила Новую Францию значительной части земель. До конфедерации Квебек владел лишь половиной нынешней территории. Хотя завоевания и договоры позволили вернуть некоторые земли, их следует вновь включить в состав Великого Квебека."
