l_russian:
 CW_EMBARGO_TITLE:0 "£embargo_texticon£ Имплантировать эмбарго"
 CW_EMBARGO_ACTION_DESC:0 "Наложите на эту страну эмбарго, которое не позволит ей покупать у нас ресурсы.\n\nЭто не помешает нам покупать у них ресурсы, если они не наложат на нас эмбарго.\n\n§YПримечание:§! Вы не можете использовать эту опцию в странах, которые имеют §YЗакрытая экономика§! Торговое право, поскольку эмбарго не будет иметь никакого воздействия на них."
 CW_EMBARGO_LOC:0 "Вы хотите ввести эмбарго на\n\n§Y[From.Getname]?§!\n\nЭто позволит им не покупать у нас ресурсы.\nОни могут отомстить и наложить на нас эмбарго в ответ."
 CW_EMBARGO_INITIATED_TITLE:0 "Эмбарго: [ROOT.GetAdjective]"
 CW_EMBARGO_INITIATED_DESC:0 "§Y[ROOT.GetName]§!\n\nМы решили ввести эмбарго против нашей страны.\n\nВ результате мы больше не можем покупать ресурсы у них, но они могут свободно покупать ресурсы у нас, если мы не введем эмбарго на них."
 CW_CANCEL_EMBARGO_TITLE:0 "£unembargo_texticon£ Отменить эмбарго"
 CW_CANCEL_EMBARGO_ACTION_DESC:0 "Снимите эмбарго, которое мы наложили на эту страну, это позволит им снова торговать с нами за ресурсы."
 CW_CANCEL_EMBARGO_LOC:0 "Хотели бы вы снять эмбарго, наложенное на\n\n§Y[From.Getname]?§!\n\nЭто позволит им свободно торговать с нами.[FROM.UNSC_SANCTIONS_WARNING]"
 CW_CANCEL_EMBARGO_INITIATED_TITLE:0 "Эмбарго снято: [ROOT.GetAdjective]"
 CW_CANCEL_EMBARGO_INITIATED_DESC:0 "Государство §Y[ROOT.GetName]§!\n\nотменило экономическое эмбарго против нас.\n\nЭто улучшит отношения и позволит нам покупать его ресурсы.[CW_CHECK_COUNTER_EMBARGO]"
 CW_WE_ARE_EMBARGO_THEM:0 "\n\n§RПримечание:§! Наше эмбарго против этой страны не отменяется автоматически!"
 CW_CHECK_IS_EMBARGOED_BY_US:0 "Под нашим эмбарго."
