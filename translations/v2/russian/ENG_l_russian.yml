l_russian:
 ENG_elizabeth_ii:0 "Елизавета II"
 ENG_charles_edward_of_albany:0 "Карл Эдуард Олбанский"
 ENG_r56_percy_hobart:0 "Перси Хобарт"
 ENG_anthony_eden:0 "Энтони Иден"
 ENG_william_birdwood:0 "Уильям Бёрдвуд"
 ENG_communism_sc:0 "Политика: коммунизм"
 ENG_fascism_sc:0 "Политика: фашизм"
 ENG_king_sc:0 "Политика: монархия"
 ENG_democracy_sc:0 "Политика: демократия"
 ENG_decolonize_sc:0 "Колонии: деколонизация"
 ENG_colonial_affairs_sc:0 "Колонии: империализм"
 ENG_rearmament_sc:0 "Перевооружение"
 ENG_establish_the_colony_of_aden:0 "Учредить колонию Аден"
 ENG_establish_the_colony_of_aden_desc:0 "Порт Аден — один из важнейших торговых узлов между Индией, Европой и Дальним Востоком. Закон об управлении Индией 1935 года предусматривал передачу контроля над ним непосредственно лондонскому правительству, тогда как ранее он управлялся как провинция главного комиссара. Последние приготовления к созданию отдельной колонии Аден завершены."
 uk_industrial_focus:0 "Расширить промышленность Северной Англии"
 uk_industrial_focus_desc:0 "Во время промышленной революции Северная Англия была полна быстро растущих городов. Теперь эта слава исчезает прямо у нас на глазах.\nПора остановить упадок!"
 uk_extra_tech_slot:0 "Поддержать исследования Оксфордского университета"
 uk_extra_tech_slot_desc:0 "Оксфордский университет — старейший и самый престижный университет страны. Поддержка его исследовательского отдела поможет укрепить национальную безопасность."
 uk_naval_gunnery:0 "Морская артиллерия"
 uk_naval_gunnery_desc:0 "Повысить эффективность корабельного вооружения, чтобы наносить более мощные удары и господствовать на морях."
 ENG_tube_alloys:0 "Трубные сплавы"
 ENG_tube_alloys_desc:0 "Физические расчёты показывают, что деление урана способно высвободить колоссальное количество энергии. Это потенциально может привести к созданию бомбы почти немыслимой мощности."
 ENG_admiralty_naval_staff_desc:0 "Военно-морской штаб Адмиралтейства — истинное ядро флота, способное координировать действия наших кораблей по всему миру и влиять на них."
 ENG_tank_variant_focus:0 "Разработать варианты танков"
 ENG_tank_variant_focus_desc:0 "Танки могут выполнять гораздо больше задач, чем непосредственный бой. Их можно сделать плавающими, оснастить артиллерией для разрушения вражеской обороны или превратить в зенитные платформы для защиты окружающих войск от авиации."
 ENG_agents_of_the_revolution:0 "Агенты революции"
 ENG_agents_of_the_revolution_desc:0 "Тайные операции необходимы для защиты революции."
 ENG_french_alliance:0 "Французский союз"
 ENG_french_alliance_desc:0 "Из старой Тройственной Антанты, после необратимых перемен в России, остались лишь [ROOT.GetNameDef] и [FRA.GetNameDef]. Если история обречена повториться, необходимо сохранить союз этих двух оплотов демократии и свободы в Европе."
 ENG_the_home_army:0 "Армия метрополии"
 ENG_the_home_army_desc:0 "Угроза конфликта на нашей земле становится всё очевиднее. Следует создать местное ополчение преимущественно из ветеранов Великой войны, чтобы задержать захватчиков и дать регулярным войскам время перегруппироваться и нанести ответный удар."
 ENG_special_operations_executive:0 "Управление специальных операций"
 ENG_special_operations_executive_desc:0 "Создание отдельного отдела разведки для помощи зарубежным движениям сопротивления и внедрения во вражеские учреждения значительно укрепит наши позиции и поможет будущим операциям."
 ENG_reconciliation_with_ussr:0 "Примирение с [SOV.GetAdjective]s"
 ENG_reconciliation_with_ussr_desc:0 "Несмотря на разногласия и взаимную неприязнь, [SOV.GetNameDef] является важнейшим партнёром в борьбе с более серьёзной угрозой мировому миру. Пока что мы должны отложить противоречия и научиться действовать вместе ради общей цели."
 ENG_permit_plane_leasement:0 "Разрешение [SOV.GetAdjective] Аренда самолёта"
 ENG_permit_plane_leasement_desc:0 "Передача самолётов [SOV.GetNameDef] поможет ей в общей борьбе против нашего врага."
 ENG_embargo_china:0 "Ввести эмбарго против Китая"
 ENG_embargo_china_desc:0 ""
 ENG_influence_japan:0 "Оказать влияние на Японию"
 ENG_influence_japan_desc:0 ""
 ENG_conquer_guanxi:0 "Завоевать Гуанси"
 ENG_conquer_guanxi_desc:0 ""
 ENG_war_with_china:0 "Война с Китаем"
 ENG_war_with_china_desc:0 ""
 ENG_cable_street:0 "Битва на Кейбл-стрит"
 ENG_cable_street_desc:0 "Битва на Кейбл-стрит показала, как меняются настроения в стране. Коммунистические движения и провалы правительства вызвали мощную ответную реакцию и рост националистических настроений. Нам следует сблизиться с этим движением."
 ENG_blackshirts:0 "Ура чёрнорубашечникам!"
 ENG_blackshirts_desc:0 "Пропаганда — поистине удивительный инструмент. Теперь, когда The Daily Mail полностью поддерживает это крайне правое националистическое движение, мы можем охватить большую часть населения и распространить своё послание."
 ENG_visit_italy:0 "Государственный визит в Италию"
 ENG_visit_italy_desc:0 "Мы многим обязаны итальянским фашистам: после Великой войны они стали одними из первопроходцев фашизма и национализма в Европе. Следует нанести государственный визит и выразить солидарность с итальянским народом."
 ENG_visit_germany:0 "Государственный визит в Германию"
 ENG_visit_germany_desc:0 "Немцы — сильный и гордый народ. Было глупо воевать с ними в Великой войне и вставать на сторону французов и русских. Вместе мы сможем добиться всего."
 ENG_right_wing_rhetoric:0 "Правая риторика"
 ENG_right_wing_rhetoric_desc:0 "Цель ясна: закрытые границы, сильная армия и британский народ, объединённый под властью сильного и харизматичного лидера. На Британских островах нет места слабости и всему, что мы сочтём нежелательным."
 ENG_join_germany:0 "Лондонский пакт"
 ENG_join_germany_desc:0 "Естественно, что интересы Британской империи совпадают с немецкими. Мы — гордый народ, и объединёнными нас будут бояться все."
 ENG_new_empire:0 "Новая империя"
 ENG_new_empire_desc:0 "Нам хотелось бы верить, что наша империя внушает страх, но это далеко не так. Из пепла старой Британской империи восстанет новая — прославленная и устрашающая."
 ENG_militarism_focus:0 "Милитаризм"
 ENG_militarism_focus_desc:0 "Чтобы казаться сильными, нужно быть сильными. Нельзя и дальше отодвигать армию на второй план ради других областей. Вооружённые силы всегда будут главным приоритетом."
 ENG_subjugate_colonials:0 "Подчинить колонии"
 ENG_subjugate_colonials_desc:0 "Наши важные колонии полны мужчин и женщин, которые должны быть готовы трудиться ради империи. Им следует помнить, кому они подчиняются."
 ENG_road_war:0 "Путь к войне"
 ENG_road_war_desc:0 "Хотят того другие или нет, война приближается и охватит мир пламенем. Остаётся лишь вопрос, будет ли Британия к ней готова."
 ENG_improved_screen_ships_two:0 "Улучшенные корабли охранения"
 ENG_improved_screen_ships_two_desc:0 "Без должного сопровождения боевые корабли крайне уязвимы. Современные эсминцы и крейсеры совершенно необходимы."
 ENG_convoy_tactics:0 "Тактика конвоев"
 ENG_convoy_tactics_desc:0 "Наша империя располагает множеством далёких колоний и зависит от их ресурсов, поэтому флот должен уметь защищать торговые пути."
 ENG_escort_focus:0 "Производство кораблей сопровождения"
 ENG_escort_focus_desc:0 "Следует сосредоточить производство на кораблях сопровождения для защиты боевых кораблей и линий снабжения."
 ENG_capital_focus:0 "Производство крупных кораблей"
 ENG_capital_focus_desc:0 "У нас есть современные крупные корабли, но темпы их производства недостаточны. Следует исправить положение."
 ENG_euro_focus:0 "Ставка на континент"
 ENG_euro_focus_desc:0 "Столетиями мы придерживались слабой политики европейского равновесия сил. Мы наблюдали, как расширялись могущественные французские, немецкие и русские империи, пока сами были вынуждены смотреть за пределы Европы. Теперь настала наша очередь править континентом."
 ENG_imperial_focus:0 "Имперские амбиции"
 ENG_imperial_focus_desc:0 "Хотя мы уже владеем огромной империей, этого недостаточно. И сильные, и слабые страны должны покориться нам."
 ENG_war_propaganda_two:0 "Военная пропаганда"
 ENG_war_propaganda_two_desc:0 "Очередняя тщательно подготовленная пропагандистская кампания, демонизирующая врага и поощряющая патриотизм, повысит поддержку войны и побудит молодых людей вступать в армию и сражаться за страну."
 ENG_western:0 "Западное направление"
 ENG_western_desc:0 "Западная Европа полна соперничающих стран с крупными колониальными империями и богатыми землями, готовыми к захвату. Следует начать планировать их падение."
 ENG_belgium_friend:0 "Подружиться с Бельгией"
 ENG_belgium_friend_desc:0 "Нидерланды всегда были занозой в нашем боку. Следует сблизиться с бельгийцами и изолировать голландцев."
 ENG_antagonize_holland:0 "Провоцировать Нидерланды"
 ENG_antagonize_holland_desc:0 "Бельгийцы попросили нас присоединиться к санкциям против Голландии. Мы охотно согласимся."
 ENG_holland_friend:0 "Подружиться с Нидерландами"
 ENG_holland_friend_desc:0 "Глупые бельгийцы получили страну, которой не заслуживают. Мы согласны, что эти земли лучше подошли бы Нидерландам или нам."
 ENG_antagonize_belgium:0 "Провоцировать Бельгию"
 ENG_antagonize_belgium_desc:0 "Голландцы готовы вместе с нами ввести санкции против Бельгии, как только мы дадим добро."
 ENG_ireland_friend:0 "Подружиться с Ирландией"
 ENG_ireland_friend_desc:0 "В долгом конфликте между нашими странами было пролито много крови — и ирландской, и британской. Примирение и убеждение ирландцев принять наш новый образ жизни кажется лучшим вариантом, чем война."
 ENG_demand_ireland:0 "Потребовать Ирландию"
 ENG_demand_ireland_desc:0 "В минуту слабости мы подарили ирландцам независимость, но теперь пора отозвать этот щедрый дар."
 ENG_burn_french:0 "Сжечь французские литературные произведения"
 ENG_burn_french_desc:0 "Более века французы разглагольствуют о свободе, а теперь ещё и сочувствуют коммунистам. Мы должны активно поощрять франкофобию в империи."
 ENG_war_france:0 "Война с Францией"
 ENG_war_france_desc:0 "Фашизм не смог укрепиться во Франции. Либеральные и коммунистические идеи слишком сильны, поэтому именно нам предстоит освободить французов от слабости."
 ENG_med:0 "Средиземноморское направление"
 ENG_med_desc:0 "Хотя мы контролируем вход и выход из Средиземного моря, наши позиции значительно ослабли из-за нежелания их укреплять. Отныне всё будет иначе."
 uk_rock_focus_two:0 "Укрепить Скалу"
 uk_rock_focus_two_desc:0 "Помимо контроля над входом в Средиземное море, Гибралтар является хорошо защищенной гаванью, откуда суда могут работать как в Атлантике, так и в Средиземном море. Поэтому крайне важно, чтобы она была строго охраняемой."
 uk_spain_focus_two:0 "Подружиться с Испанией"
 uk_spain_focus_two_desc:0 "Испанцы лучше многих знают мощь Королевского флота, но, возможно, им стоит напомнить..."
 ENG_war_spain:0 "Напасть на Испанию"
 ENG_war_spain_desc:0 "Испанцы не откликнулись на наши дипломатические усилия, поэтому другого выхода, кроме войны, мы не видим."
 ENG_ally_portugal:0 "Союз с Португалией"
 ENG_ally_portugal_desc:0 "Португальцы были нашими союзниками веками, и мы уверены, что сумеем привести их к светлому будущему."
 uk_malta_focus_two:0 "Укрепить Мальту"
 uk_malta_focus_two_desc:0 "Мальта занимает превосходное положение в центре Средиземного моря и служит важнейшим пунктом на пути через Египет и Суэцкий канал к Индии и Дальнему Востоку. Время, потраченное на её укрепление, никогда не будет потрачено впустую."
 ENG_turkey_friend:0 "Принудить Турцию к сотрудничеству"
 ENG_turkey_friend_desc:0 "Турция занимает важное стратегическое положение и может стать превосходным союзником против итальянцев и Советов."
 ENG_greece_friend:0 "Подружиться с Грецией"
 ENG_greece_friend_desc:0 "Греки были нашими союзниками в Великой войне и могут вновь пригодиться в будущем европейском конфликте."
 ENG_war_greece:0 "Война с Грецией"
 ENG_war_greece_desc:0 "Чтобы укрепить положение в Средиземном море, Турция и Греция должны войти в нашу сферу. Турция уже там, теперь Греции пора подчиниться."
 ENG_war_turkey:0 "Напасть на Турцию"
 ENG_war_turkey_desc:0 "В отличие от греков, турки показали себя неразумными и не желающими сотрудничать. Скоро они поймут свою ошибку."
 ENG_woo_italy:0 "Привлечь Италию"
 ENG_woo_italy_desc:0 "Итальянцы одними из первых приняли фашизм, и мы многим им обязаны. В эти неспокойные времена следует гордо встать рядом с итальянскими братьями и сёстрами."
 ENG_war_italy:0 "Обезопасить Италию"
 ENG_war_italy_desc:0 "Рано или поздно итальянцы предадут нас из-за безумных мечтаний о Средиземноморской империи. Они не понимают, что воплотить эту мечту можем мы — но для себя."
 ENG_army_innov:0 "Армейские нововведения"
 ENG_army_innov_desc:0 "В неспокойные времена и во время войны Британской империи нужна первоклассная армия. Ничто меньшее недопустимо."
 ENG_equipment_effort_two:0 "Развитие снаряжения"
 ENG_equipment_effort_two_desc:0 "Нашим солдатам нужно лучшее оружие. Слишком долго мы пользовались устаревшим снаряжением, которое на войне станет обузой."
 ENG_motorized_focus_two:0 "Моторизованная армия"
 ENG_motorized_focus_two_desc:0 "Недавно армия экспериментировала с полностью моторизованными пехотными частями. Пока ни одной полноценной моторизованной дивизии не создано, но правильное обращение к военному министру может быстро изменить ситуацию."
 ENG_tank_focus:0 "Королевский танковый полк"
 ENG_tank_focus_desc:0 "Британия изобрела танк, поэтому Королевский танковый полк должен иметь лучшие машины в мире, но сейчас это не так. Комитет по разработке специальных машин предлагает исследовать и создать современную модель, чтобы Британия оставалась впереди танкостроения."
 royal_ordinance_focus:0 "Королевские оружейные заводы"
 royal_ordinance_focus_desc:0 "Королевского арсенала в Вулвиче, к сожалению, недостаточно для производства всех необходимых нам боеприпасов и стрелкового оружия. Мы должны создать еще много заводов по всей стране, желательно в относительно безопасных районах."
 ENG_tank_focus_two:0 "Бронетанковые дивизии"
 ENG_tank_focus_two_desc:0 "Британия изобрела танк, поэтому Королевский танковый полк должен иметь лучшие машины в мире, но сейчас это не так. Комитет по разработке специальных машин предлагает исследовать и создать современную модель, чтобы Британия оставалась впереди танкостроения."
 ENG_special_forces_two:0 "Войска специального назначения"
 ENG_special_forces_two_desc:0 "Не все солдаты проходят одинаковую подготовку и равны по боевым качествам. Некоторые обладают специализацией и навыками для особых задач. Следует использовать это разнообразие."
 ENG_royal_marines:0 "Королевская морская пехота"
 ENG_royal_marines_desc:0 "Господство на морях прекрасно, но иногда приходится промочить ноги. Необходимо уделить особое внимание подготовке и оснащению Королевской морской пехоты."
 ENG_northern:0 "Северное направление"
 ENG_northern_desc:0 "Скандинавские страны не состоят в союзах и слабы. Следует включить их в нашу сферу, чтобы их базы не могли использоваться против нас."
 ENG_north_sea:0 "Морские учения в Северном море"
 ENG_north_sea_desc:0 "Самодовольство привело бы нас к гибели, если бы мы его не исправили. Нужно показать миру, что с нами следует считаться."
 ENG_north_fascism:0 "Поддержать фашистских революционеров"
 ENG_north_fascism_desc:0 "Нет необходимости воевать со скандинавскими странами. Им лишь нужен небольшой толчок в правильном направлении, чтобы их интересы совпали с нашими."
 ENG_north_war:0 "Поддержать открытую войну"
 ENG_north_war_desc:0 "Со скандинавскими странами невозможно договориться. Они заткнули уши и отказываются оставить демократический путь. Открытая война — единственный вариант."
 ENG_denmark_revolution:0 "Датская революция"
 ENG_denmark_revolution_desc:0 "Датский народ хорошо последовал нашему примеру. Теперь пора вернуть страну тем, кто спасёт её от внутреннего разрушения."
 ENG_norway_revolution:0 "Норвежская революция"
 ENG_norway_revolution_desc:0 "Наши норвежские братья готовы сражаться и установить в Норвегии фашистский режим. Мы должны оказать всю возможную поддержку."
 ENG_sweden_revolution:0 "Шведская революция"
 ENG_sweden_revolution_desc:0 "Шведы слишком долго страдали от слабости. Но теперь народ готов вновь стать сильным."
 ENG_war_denmark:0 "Война с Данией"
 ENG_war_denmark_desc:0 "Датчане досадно стойко сопротивлялись нашим дипломатическим усилиям, но едва ли будут столь же стойкими после объявления войны."
 ENG_war_norway:0 "Война с Норвегией"
 ENG_war_norway_desc:0 "Северные воды должны быть защищены от любой иностранной державы. Базы в Норвегии помогут сохранить превосходство."
 ENG_war_sweden:0 "Война со Швецией"
 ENG_war_sweden_desc:0 "Мы больше не можем позволять использовать шведские ресурсы для военных нужд наших врагов. Они быстро осознают ошибочность своего пути."
 ENG_war_finland:0 "Война с Финляндией"
 ENG_war_finland_desc:0 "Хотя финны не любят коммунизм, они отказались сотрудничать с нами. Другого выхода, кроме принуждения к вступлению в нашу сферу, нет."
 ENG_war_soviets:0 "Удар по Коминтерну"
 ENG_war_soviets_desc:0 "Назвать Советы просто заблуждающимися было бы слишком мягко. Коминтерн безумен, и мы с радостью возглавим мир в окончательном уничтожении коммунизма."
 ENG_eastern:0 "Восточное направление"
 ENG_eastern_desc:0 "Странам Восточной Европы нужна наша помощь в борьбе с идеями коммунизма и демократии! Они должны гордиться своими нациями и тесно сотрудничать с нами."
 ENG_draw_germany:0 "Сблизиться с Германией"
 ENG_draw_germany_desc:0 "Немцы — наши естественные союзники против всех, кто желает нам зла. Мы должны показать, что останемся с ними до конца."
 ENG_draw_poland:0 "Сблизиться с Польшей"
 ENG_draw_poland_desc:0 "История показала, что немцы — наши естественные враги. Даже если мы разделяем одни идеалы, доверять им нельзя. Польша — сильная страна, которая может стать полезным союзником против немецкой угрозы."
 ENG_axis_help:0 "Военное сотрудничество с Германией"
 ENG_axis_help_desc:0 "Немцы уже давно готовятся к войне, и их генеральный штаб способен многому нас научить."
 ENG_woo_poland:0 "Союз с Польшей"
 ENG_woo_poland_desc:0 "Вести войну на два фронта трудно. Чтобы победить Германию, необходимо открыть второй фронт. К счастью, поляки готовы вступить в союз."
 ENG_war_poland:0 "Война с Польшей"
 ENG_war_poland_desc:0 "Мы согласны с немцами, что поляки не заслуживают собственной страны. Эти земли лучше послужат под нашим влиянием."
 ENG_war_germany:0 "Война с Германией"
 ENG_war_germany_desc:0 "Главная угроза Британской империи — Германия. С каждой потраченной секундой она становится сильнее. Необходимо уничтожить её как можно скорее."
 ENG_belgium_war:0 "Напасть на Бельгию"
 ENG_belgium_war_desc:0 "Завоевание Бельгии даст нам плацдарм в континентальной Европе. Очевидно, что между Британской империей и бельгийцами нет любви, поэтому оправдать это будет легко."
 ENG_dutch_war:0 "Напасть на Нидерланды"
 ENG_dutch_war_desc:0 "Нидерланды слишком долго были занозой в нашем боку. Хотят они того или нет, им придётся покориться нашей превосходящей мощи."
 uk_protect_suez_two:0 "Укрепить позиции в Египте"
 uk_protect_suez_two_desc:0 "Контроль над Суэцким каналом — одна из основ господства Британской империи на море. Потеря региона станет катастрофой. Необходимо принять меры по его укреплению."
 ENG_pressure_iraq:0 "Оказать давление на Ирак"
 ENG_pressure_iraq_desc:0 "Ирак постепенно отдаляется от нас, и больше нельзя это позволять. Его интересы должны совпадать с нашими."
 ENG_pressure_iran:0 "Оказать давление на Иран"
 ENG_pressure_iran_desc:0 "Иран постепенно отдаляется от нас, и больше нельзя это позволять. Его интересы должны совпадать с нашими."
 singapore_focus_two:0 "Укрепить Сингапур"
 singapore_focus_two_desc:0 "Сингапур должен оставаться нашей главной военно-морской базой на Востоке. Гонконг может пасть перед японцами, но Сингапур обязан оставаться неприступным до прибытия главного флота, который решительно разгромит врага."
 hongkong_focus_two:0 "Укрепить Гонконг"
 hongkong_focus_two_desc:0 "Наш план должен быть смелее и опираться на базу гораздо ближе к Японии. При достаточных укреплениях и инфраструктуре Гонконг подойдёт идеально!"
 ENG_war_japan:0 "Ударить по Японии"
 ENG_war_japan_desc:0 "Японская империя продолжает угрожать нашим колониальным владениям на Дальнем Востоке. Мы больше не позволим ей усиливаться за наш счёт."
 ENG_woo_japan:0 "Привлечь Японию"
 ENG_woo_japan_desc:0 "Королевский флот в одиночку может не справиться с ВМС США, но если возобновить англо-японский союз..."
 ENG_mexico_fascism:0 "Поддержать Мексиканский синархистский союз"
 ENG_mexico_fascism_desc:0 "В прошлом мы тесно сотрудничали с Мексикой, а теперь ей пора принять националистическую риторику и объединиться с нами против Соединённых Штатов."
 ENG_mexico_revolution:0 "Мексиканская революция"
 ENG_mexico_revolution_desc:0 "Час настал! Мы должны поддержать Национальный синархистский союз в революции против всех, кто стремится контролировать Мексику!"
 ENG_war_USA:0 "Напасть на американцев"
 ENG_war_USA_desc:0 "Наша бывшая колония вскоре может стать сильнейшей страной в истории. Великая депрессия ослабила её, но с каждым днём она восстанавливается. Необходимо ударить как можно скорее, иначе она навсегда остановит наше продвижение."
 ENG_ally_venezuela:0 "Союз с Венесуэлой"
 ENG_ally_venezuela_desc:0 "Капиталисты США и коммунисты Советского Союза контролируют значительную часть нефти, необходимой нашей армии. Союз с Венесуэлой обеспечит доступ к её нефти."
 ENG_workers_brigades:0 "Рабочие бригады"
 ENG_workers_brigades_desc:0 "Рабочие составляют авангард классово сознательного пролетариата. Их необходимо организовать в ополчения, чтобы при необходимости защищать орудия своего труда."
 r56_ENG_decision_support_percy_hobart_recruited:0 "§YПерси Хобарт§! уже получил поддержку."
 ENG_crypto_bomb_idea_lar:0 "Криптологическая бомба"
 ENG_admiralty_naval_staff:0 "Военно-морской штаб Адмиралтейства"
 ENG_royal_family_remnants:0 "Остатки королевской семьи"
 ENG_royal_family_remnants_desc:0 "Хотя большинство членов королевской семьи казнили коммунистические демоны, всегда остаётся наследник, готовый избавиться от нового урезанного парламента и восстановить британский престол."
 ENG_mi6_ns:0 "МИ-6"
 englandmod.99.t:0 "Арчибальд Уэйвелл направляется в Индию"
 englandmod.99.d:0 "Генерал Арчибальд Уэйвелл недавно получил повышение и назначен командующим Британской индийской армией. Он прибудет через несколько дней."
 englandmod.99.a:0 "Понятно."
 britain.25.t:0 "The [ENG.GetName] Предлагает союз"
 britain.25.d:0 "По мере роста мировой напряжённости мир становится всё опаснее, а [ENG.GetAdjective] и [FRA.GetAdjective] стороны остаются одними из немногих оплотов демократии в Европе. Теперь [ENG.GetNameDef] предлагает заключить союз между нашими странами.\n\nКак нам ответить?"
 britain.25.a:0 "В единстве наша сила."
 britain.25.b:0 "Нам не нужно это. [ENG.GetAdjective]."
 britain.26.t:0 "The [FRA.GetName] Принять наш союз"
 britain.26.d:0 "История показала, как много может быть достигнуто, когда наши великие нации стоят бок о бок. В духе Кордиаля Антанты мы с гордостью приветствуем вас не только как друзей, но и как союзников. Вместе мы будем сияющим маяком свободы в мире, посягнутом на тьму угнетения!\n\nНаша просьба присоединиться к [FRA.GetAdjective] был принят. Мы можем рассчитывать на их полную поддержку в предстоящие неспокойные времена."
 britain.26.a:0 "Вместе мы удержим рубеж!"
 britain.27.t:0 "The [FRA.GetName] Мы отказываемся от нашего союза."
 britain.27.d:0 "«Хотя в прошлом у нас были хорошие отношения, мы не можем рисковать эскалацией между нами и немцами на нашей границе, если мы окажемся в другом конфликте, это приведет к еще одной разрушительной войне, которую мы можем себе позволить», — сказал он. Мир всегда должен быть целью любой демократической нации.\n\nНаша просьба присоединиться к [FRA.GetAdjective] Ему было отказано. The [FRA.GetAdjective] Правительство не хочет враждовать [GER.GetNonIdeologyName] Это не поставит под угрозу нынешний мир."
 britain.27.a:0 "Их «мир» — лишь другое слово для «капитуляции»."
 britain.28.t:0 "[ENG.GetNameDefCap] Стремление к дипломатическому примирению"
 britain.28.d:0 "[ENG.GetNameDefCap], несмотря на взаимную неприязнь, предложила нам пакт о примирении. [ENG.GetAdjective] сторона заявляет, что перед лицом общего врага жизненно важно научиться сотрудничать, заключить пакт о ненападении и хотя бы временно отложить разногласия."
 britain.28.a:0 "Если это необходимо."
 britain.28.b:0 "Нас такие сделки не интересуют."
 britain.29.t:0 "[SOV.GetNameDefCap] Примирение дипломатическое"
 britain.29.d:0 "[SOV.GetNameDefCap] приняла наше предложение о пакте примирения, согласившись, что общий враг важнее прежней взаимной неприязни. Она готова сотрудничать с нами в связанных с ним вопросах и обещает, что пока между странами не будет враждебности."
 britain.29.a:0 "Пока нам придётся работать вместе."
 britain.30.t:0 "[SOV.GetNameDefCap] Отказ от дипломатического примирения"
 britain.30.d:0 "[SOV.GetNameDefCap] отвергла наше предложение о пакте примирения, заявив, что взаимная неприязнь не позволит добросовестно сотрудничать. [SOV.GetAdjective] сторона также не заинтересована в обещании избегать враждебности между нашими странами."
 britain.30.a:0 "Они именно так плохи, как мы и думали."
 ENG_weapons_purchases_category:1 "Закупить [USA.GetAdjective] оружие"
 ENG_weapons_purchases_category_desc:0 "Наша промышленность всё ещё отстаёт, поэтому закупки современного оружия за рубежом могут стать единственным способом довести вооружённые силы до современных стандартов."
 ENG_order_weapons_in_USA:0 "Заказать стрелковое оружие"
 ENG_order_support_equipment_in_USA:0 "Заказать вспомогательное снаряжение"
 ENG_order_artillery_in_USA:0 "Заказать артиллерию"
 ENG_order_tanks_in_USA:0 "Заказать танки"
 ENG_order_fighters_in_USA:0 "Заказать истребители"
 ENG_order_bombers_in_USA:0 "Заказать бомбардировщики"
 ENG_promote_jack_churchill:0 "Повысить «Безумного» Джека Черчилля"
 var_ENG_count_blackshirt_marches:0 "Количество организованных §Yмаршей чёрнорубашечников§!"
 ENG_harold_harmsworth_tt:0 "Количество организованных §Yмаршей чёрнорубашечников§! > §Y4§!"
 ENG_embrace_royal_german_heritage:0 "Принять [GER.GetAdjective] наследие королевского дома"
 ENG_embrace_royal_german_heritage_desc:0 "Слишком долго мы отвергали наши королевские корни. [GER.GetNameDef]Теперь пришло время снять маску и вернуться к оригинальному и единственному настоящему имени нашего королевского дома."
 ENG_speech_against_war:0 "Речь против войны"
 ENG_speech_against_war_desc:0 "Кровь нашей лучшей молодёжи не будет напрасно пролита из-за чужих распрей. Британия должна сохранить мир, чтобы выстоять. Наш голос должен звучать на каждой улице. Мы требуем мира! Но будем готовы защищать свою землю и вооружимся против иностранных захватчиков. Тем, кто обвиняет нас в желании сеять беспорядки и войны, мы отвечаем единым голосом: Британия живёт и идёт вперёд — в мире!"
 ENG_john_dill:0 "Джон Дилл"
 ENG_harold_harmsworth:0 "Гарольд Хармсворт"
 ENG_willie_gallacher:0 "Уилли Галлахер"
 ENG_thornycroft_ltd:0 "Thornycroft Ltd."
 ENG_guest_keen_baldwins:0 "Guest Keen Baldwins"
 ENG_barrow_hematite_steel_company:0 "Barrow Hematite Steel Company"
 ENG_chatham_dockyard:0 "Верфь Чатема"
 ENG_hawthorn_leslie_and_company:0 "Hawthorn Leslie and Company"
 ENG_london_aircraft_production_group:0 "Лондонская группа производства самолётов"
 ENG_vauxhall_tanks:0 "Vauxhall"
 ENG_blackburn_aircraft:0 "Blackburn Aircraft"
 ENG_general_aircraft_limited:0 "General Aircraft Limited"
 ENG_bristol:0 "Bristol Aeroplane Company"
 ENG_gloster_aircraft:0 "Gloster Aircraft"
 ENG_ROF_nottingham:0 "ROF Nottingham"
 ENG_london_midland_and_scottish_railway:0 "Лондонская, Мидлендская и Шотландская железная дорога"
 ENG_john_laing_building_company:0 "John Laing Building Company"
 british_alternate_focus:0 "Дерево фокусов Британской империи"
 british_alternate_focus_tt:0 "§RПосле завершения этого фокуса загрузится другое дерево, содержащее все фашистские фокусы Road to 56. Обратного пути не будет! Выбирайте с умом.§!"
 ENG_anti_communist_commanders_exile_tt:0 "§RАристократические командующие исчезнут или отправятся в изгнание.§!"
 revolutionary_scientific_congress_name:0 "Революционный научный конгресс"
 r56_eng.1.t:0 "Только фашизм способен сохранить мир!"
 r56_eng.1.desc:0 "Фашизм означает мир, потому что лишь он борется с истинной причиной войн. Сильная автаркическая политика позволит избежать безнадёжной конкуренции за рынки, породившей столько конфликтов. Поэтому мир и империя совместимы: вместе они обеспечивают экономическую независимость!"
 r56_eng.1.a:0 "Мы предотвратим войну!"
 r56_eng.2.t:0 "О зарубежных войнах"
 r56_eng.2.desc:0 "Британцы должны сражаться только за Британию! Картина сынов Британии, покидающих берега ради смерти в чужих распрях, должна остаться лишь страницей учебника истории. Британцы обязаны воевать только за Британию и защиту империи."
 r56_eng.2.a:0 "Мы не умрём на чужих берегах!"
 r56_eng.3.t:0 "Британские военные изгнанники просят убежища"
 r56_eng.3.desc:0 "Бывшие военнослужащие Британии, бегущие от коммунистов, прибыли к нам и просят убежища. На деле они вполне могут послужить нашим вооружённым силам."
 r56_eng.3.a:0 "Опытные кадры всегда нужны!"
 r56_eng.4.t:0 "Выжившие члены королевской семьи находят убежище в нашей стране"
 r56_eng.4.desc:0 "Спасаясь от трагических событий, уничтоживших большую часть королевской семьи, выжившие попросили разрешения поселиться у нас в надежде однажды восстановить монархию в Британии."
 r56_eng.4.a:0 "Это не Вестминстер, но мы сделаем всё возможное."
 r56_eng.7.t:0 "Выборы [GetYear] года"
 r56_eng.7.d:0 "С последних выборов прошло пять лет, и народ [ENG.GetNameDef] вновь должен выбрать правительство.\n\nВ последние годы Лейбористская партия резко критиковала поддержку политики умиротворения консерваторами, тогда как те оправдывались тем, что [ENG.GetNameDef] тогда не была готова к войне. В остальном партии ведут привычные кампании: социал-демократическая программа лейбористов противостоит более правой политике консерваторов.\n\nКого [ENG.GetAdjective] народ сочтёт достойным руководить страной?"
 r56_eng.7.a:0 "Консерваторы знают, что делают."
 r56_eng.7.b:0 "Лейбористы поведут [ENG.GetNameDef] в будущее!"
 r56_eng.8.t:0 "Выборы во время войны?"
 r56_eng.8.d:0 "С последних выборов прошло пять лет, и пришло время голосовать. Однако [ENG.GetNameDef] ведёт войну с великой державой, и многие считают, что выборы сейчас лишь дестабилизируют страну в её самый мрачный час.\n\nЧто следует сделать?"
 r56_eng.8.a:0 "Народ имеет право быть услышанным."
 r56_eng.8.b:0 "Это может подождать до победы."
 r56_eng.9.t:0 "[ENG.GetLeader] побеждает на [ENG.GetAdjective] выборах"
 r56_eng.9.d.a:0 "Прошло 5 лет с момента последнего [ENG.GetAdjective] Выборы, а вчера [ENG.GetAdjective] Люди снова пошли на выборы, чтобы определить будущее своего правительства.\n\nПо мере подсчета бюллетеней, похоже, что Лейбористская партия при Клементе Атли получила власть, обещая противостоять умиротворению и продвигать социальные реформы в стране. [ENG.GetAdjective] общества.\n\nВремя покажет, будет ли новый [ENG.GetAdjective] Правительство может держаться."
 r56_eng.9.d.b:0 "С последних [ENG.GetAdjective] выборов прошло пять лет, и вчера [ENG.GetAdjective] народ снова пришёл к урнам, чтобы определить будущее правительства.\n\nПосле подсчёта голосов выяснилось, что Консервативная партия под руководством [ENG.GetLeader] получила власть, построив кампанию на продолжении протекционизма и сохранении империи.\n\nВремя покажет, сумеет ли новое [ENG.GetAdjective] правительство удержаться."
 r56_eng.9.a:0 "Прекрасное представление."
 r56_eng.9.b:0 "Будет ли он отличаться от прежней администрации?"
 r56_eng.11.t:0 "Эвакуировать правительство?"
 r56_eng.11.d:0 "После падения Лондона под натиском [126.controller.GetAdjective] войск и приближения капитуляции необходимо решить, эвакуируются ли правительство и армия в доминионы или будут сражаться до конца."
 r56_eng.11.a:0 "Они выживут, чтобы продолжить борьбу."
 r56_eng.11.b:0 "Мы вернёмся. (Играть за Канаду)"
 r56_eng.11.c:0 "Мы будем сражаться до конца!"
 r56_eng.12.t:0 "Британские изгнанники прибывают в [Capital.GetCapitalVictoryPointName]"
 r56_eng.12.d:0 "После краха британской метрополии королевская семья и изгнанники из правительства отступили в нашу страну, чтобы продолжить борьбу. Однако оставшиеся армии покидают Европу, а антивоенные протесты становятся всё громче и парализуют страну."
 r56_eng.12.a:0 "Мы продолжим борьбу!"
 r56_eng.12.b:0 "Возможно, пора признать поражение."
 r56_eng.13.t:0 "Крах британской метрополии"
 r56_eng.13.d:0 "После падения Лондона и отступления королевской семьи империи в привычном виде пришёл конец. Мы взяли под контроль соседние британские территории и ожидаем решения [faction_leader.GetNameDef] о продолжении войны."
 r56_eng.13.a:0 "Конец эпохи."
 r56_eng.14.t:0 "Крах британской метрополии"
 r56_eng.14.d:0 "После падения Лондона и отступления королевской семьи империи в привычном виде пришёл конец. Мы взяли под контроль соседние британские территории, но большинство населения требует оставить рушащуюся империю и провозгласить независимость."
 r56_eng.14.a:0 "Мы останемся с верными союзниками."
 r56_eng.14.b:0 "Индия наконец свободна!"
 r56_eng.15.t:0 "Крах британской метрополии"
 r56_eng.15.d:0 "После падения Лондона и отступления королевской семьи империи в привычном виде пришёл конец. Мы взяли под контроль соседние британские территории, но большинство населения требует оставить рушащуюся империю и провозгласить независимость."
 r56_eng.15.a:0 "Мы останемся с верными союзниками."
 r56_eng.15.b:0 "Нет смысла продолжать проигранную войну."
 r56_eng.16.t:0 "Захватить Мальвинские острова?"
 r56_eng.16.d:0 "После падения Лондона и отступления королевской семьи заморские владения Британской империи готовы к захвату. Мы можем воспользоваться случаем и занять Мальвинские острова и Южную Георгию. Канадцы, возможно, даже не станут сопротивляться, хотя операция всё же несёт риск ответного удара."
 r56_eng.16.a:0 "Мальвинские острова принадлежат Аргентине!"
 r56_eng.16.b:0 "Не будем начинать войну, которую не сможем выиграть."
 r56_eng.17.t:0 "[ARG.GetNameDefCap] захватывает Фолклендские острова"
 r56_eng.17.d:0 "Увидев нашу слабость, [ARG.GetLeader] начал военную операцию по захвату Фолклендских островов. Возможно, разумнее не отвечать, поскольку недавние события вызвали серьёзную нестабильность."
 r56_eng.17.a:0 "Мы докажем, что они ошибаются!"
 r56_eng.17.b:0 "К сожалению, их расчёт оказался верным."
 r56_eng.18.t:0 "Крах Британской империи"
 r56_eng.18.d:0 "После падения Лондона и неизбежной капитуляции метрополии правительство, армия и королевская семья Соединённого Королевства решили эвакуироваться.\n\nХотя король из [ENG_commonwealth_successor.Capital.GetCapitalVictoryPointName] заявил, что империя продолжит борьбу до освобождения метрополии, многие считают это концом Британской империи в привычном виде."
 r56_eng.18.a:0 "Солнце наконец зашло."
 r56_eng.19.t:0 "$ENG_winston_churchill$ уходит в отставку"
 r56_eng.19.d:0 "После того, как здоровье ухудшилось, сэр. $ENG_winston_churchill$ Ушел в отставку с поста главы Консервативной партии. $ENG_anthony_eden$ взять на себя его обязанности. Позволить $ENG_winston_churchill$ Отставка в пользу $ENG_anthony_eden$ Этот вопрос рассматривался ранее, однако последний сам страдал от проблем со здоровьем."
 r56_eng.19.a:0 "Нам будет его не хватать."
 ENG_collapse_of_the_empire_tt:0 "§YПравительство и королевская семья отступят в крупнейший доминион, а заморские территории и часть армии и флота будут захвачены другими странами империи, которые получат независимость§!."
 ENG_got_territories_from_collapse:0 "§YМы возьмём под контроль соседние территории империи§!."
 ENG_opposition_to_the_national_government:0 "Оппозиция национальному правительству"
 ENG_opposition_to_the_national_government_desc:0 "Национальное правительство проигнорировало требования народа. Пора заставить его услышать наш голос!"
 ENG_united_front_strategy:0 "Стратегия единого фронта"
 ENG_united_front_strategy_desc:0 "Стратегия единого фронта"
 ENG_expel_the_old_oppressors:0 "Изгнать старых угнетателей"
 ENG_expel_the_old_oppressors_desc:0 "Изгнать старых угнетателей"
 ENG_redistribution_of_wealth:0 "Перераспределение богатства"
 ENG_redistribution_of_wealth_desc:0 "Перераспределение богатства"
 ENG_heavy_industry_investment:0 "Развивать тяжёлую промышленность"
 ENG_heavy_industry_investment_desc:0 "Развивать тяжёлую промышленность"
 ENG_promote_new_officers:0 "Продвигать новых офицеров"
 ENG_promote_new_officers_desc:0 "Продвигать новых офицеров"
 ENG_the_peoples_duty:0 "Долг народа"
 ENG_the_peoples_duty_desc:0 "Долг народа"
 ENG_alliance_with_the_canadian_workers:0 "Союз с канадскими рабочими"
 ENG_alliance_with_the_canadian_workers_desc:0 "Союз с канадскими рабочими"
 ENG_spanish_civil_war_involvement:0 "Участие в гражданской войне в Испании"
 ENG_spanish_civil_war_involvement_desc:0 "Участие в гражданской войне в Испании"
 ENG_the_necessity_of_ideological_struggle:0 "Необходимость идеологической борьбы"
 ENG_the_necessity_of_ideological_struggle_desc:0 "Необходимость идеологической борьбы"
 ENG_awakening_from_pacifism:0 "Пробуждение от пацифизма"
 ENG_awakening_from_pacifism_desc:0 "Пробуждение от пацифизма"
 ENG_ally_with_the_spanish_republic:0 "Союз с Испанской республикой"
 ENG_ally_with_the_spanish_republic_desc:0 "Союз с Испанской республикой"
 ENG_enforced_economic_reorganization:0 "Экономическая реорганизация"
 ENG_enforced_economic_reorganization_desc:0 "Экономическая реорганизация"
 ENG_challenge_stalinism:0 "Бросить вызов сталинизму"
 ENG_challenge_stalinism_desc:0 "Доктрина Сталина — тирания под красной завесой!"
 ENG_dont_challenge_party_line:0 "Не противоречить линии партии"
 ENG_dont_challenge_party_line_desc:0 "Партия всегда права! Интернационал приведёт нас к мировой революции!"
 ENG_revolutionary_scientific_congress:0 "Революционный научный конгресс"
 ENG_revolutionary_scientific_congress_desc:0 "Революция предоставляет уникальную возможность учёным и рабочим всего мира обмениваться знаниями и искоренить реакционную науку, именуемую генетикой."
 ENG_retake_the_african_jewel:0 "Вернуть африканскую жемчужину"
 ENG_retake_the_african_jewel_desc:0 "Независимый Египет представляет слишком большую угрозу нашим интересам в Азии и Африке. Он вновь будет поставлен под наш контроль."
 uk_egypt_focus:0 "Развитие Египта"
 uk_egypt_focus_desc:0 "Египет находится в самом центре наших интересов в Африке и Средиземноморье. Нам выгодно обеспечить ему собственные оборонительные возможности и сохранить хорошие отношения на случай будущего конфликта."
 ENG_take_the_reactionaries_out_of_their_nest:0 "Выгнать реакционеров из их гнезда"
 ENG_take_the_reactionaries_out_of_their_nest_desc:0 "Выгнать реакционеров из их гнезда"
 ENG_anti_american_rhetoric:0 "Антиамериканская риторика"
 ENG_anti_american_rhetoric_desc:0 "Антиамериканская риторика"
 ENG_liberate_the_american_workers:0 "Освободить американских рабочих"
 ENG_welcome_british_exiles:0 "Принять британских изгнанников"
 ENG_welcome_british_exiles_desc:0 "Они раздавлены событиями, потрясающими Британию, и зачастую потеряли всё, кроме своих талантов..."
 ENG_recruit_volunteers:0 "Вербовать добровольцев"
 ENG_recruit_volunteers_desc:0 "Приток британских беженцев привёл множество людей, готовых сражаться за возвращение земли своего детства, а не жить за океаном."
 ENG_british_agents:0 "Британские агенты"
 ENG_british_agents_desc:0 "Некоторые из беженцев могут стать способными тайными агентами."
 ENG_landing_exercices:0 "Учения по высадке"
 ENG_landing_exercices_desc:0 "Вторжение через бескрайнее море — непростая задача. Мы должны убедиться, что готовы к ней технологически, логистически и морально."
 ENG_reclaim_the_british_isles_exile:0 "Вернуть [ENG.GetAdjective] острова"
 ENG_reclaim_the_british_isles_exile_desc:0 "Революционеры осквернили монархию и парламент, приведя тиранию и нищету к власти. [ENG.GetAdjective] людей. Наш долг как члена Содружества – бороться за восстановление Британии. Ходят слухи, что сам король заявил, что он жаждет «возвратить свое первородство»."
 ENG_northern_ireland_for_assistance:0 "[119.GetName] в обмен на помощь"
 ENG_northern_ireland_for_assistance_desc:0 "Перед лицом мировых угроз нам невыгодно продолжать пограничный спор с [IRE.GetNameDef]. Возможно, следует предложить [IRE.GetAdjective] стороне спорную территорию в обмен на полную поддержку наших усилий."
 ENG_secure_ireland:0 "Обезопасить [IRE.GetNonIdeologyName]"
 ENG_secure_ireland_desc:0 "[IRE.GetNonIdeologyName], находящаяся под враждебным контролем или влиянием, станет идеальным плацдармом для нападения через наши сухопутные границы, что совершенно недопустимо. Мы даровали [IRE.GetAdjective] народу независимость, но столь же легко можем её отнять."
 ENG_the_wartime_cabinet_committee:0 "Комитет военного кабинета"
 ENG_the_wartime_cabinet_committee_desc:0 "Настали тяжёлые времена. Необходимо принять все меры, чтобы наши войска были как можно лучше организованы и должным образом управляемы."
 ENG_evacuate_colonial_assets:0 "Эвакуировать колониальные активы"
 ENG_evacuate_colonial_assets_desc:0 "Теперь, когда бывшие колонии уходят от нас, пора вернуть вложенные в них средства."
 ENG_unify_the_isles:0 "Объединить острова"
 ENG_unify_the_isles_desc:0 "[ROOT.GetNonIdeologyName] будет едина! Прямое правление из Лондона!"
 ENG_edward_viii:0 "Эдуард VIII"
 ENG_elisabeth_ii:0 "Елизавета II"
 r56_eng.5.t:0 "Смерть Георга VI"
 r56_eng.5.desc:0 "Георг VI трагически скончался, погрузив страну в глубокую скорбь. Британский народ с теплотой будет помнить того, кто вёл нас через тяжёлые годы. Теперь принцессе Елизавете предстоит принять наследство и надеть Имперскую государственную корону. Будем надеяться, что она проявит те же способности, что Елизавета и Виктория. Да здравствует королева!"
 r56_eng.5.a:0 "Да здравствует королева!"
 r56_eng.6.t:0 "Будущее Ньюфаундленда под вопросом"
 r56_eng.6.desc:0 "С восстановлением экономической активности в [NFL.GetNonIdeologyName] вопрос о её будущем вновь вышел на первый план. В начале 1930-х Великая депрессия тяжело ударила по стране, и она попросила вернуть прямое британское управление в обмен на финансовую помощь. Это положило конец эпохе так называемого «ответственного правительства». Прерванные войной споры теперь возобновились. Территория стоит на распутье: она может стать самостоятельным доминионом или войти в федерацию с Канадой, что на практике будет аннексией под другим названием."
 r56_eng.6.a:0 "Территорией должна управлять Канада."
 r56_eng.6.b:0 "Восстановить [NFL.getAdjective] доминион."
 r56_eng.10.t:0 "Гилберт Стивенсон"
 r56_eng.10.d:0 "Когда Гилберт Стивенсон в 1929 году вышел в отставку из Королевского флота в звании контр-адмирала, он был одним из ведущих специалистов по противолодочной войне. С началом новой войны его вернули на службу. Несмотря на возраст — он родился в 1878 году, — он оставался крепким, здоровым и энергичным и мог применять острый ум к любой задаче Адмиралтейства.\n\nИсторически его главным вкладом стало руководство учебным центром сопровождения в Тобермори, где он и его команда провели 911 кораблей через 1132 учебных курса. Он также участвовал в координации эвакуации из Дюнкерка в 1940 году и в начале войны служил коммодором нескольких конвоев.\n\nПод руководством Стивенсона Тобермори сыграл важную роль в битве за Атлантику, быстро выпуская в море хорошо подготовленные корабли сопровождения. Его новаторские, но суровые методы повлияли на послевоенную систему подготовки Королевского флота и принесли ему прозвище «Ужас Тобермори»."
 r56_eng.10.a:0 "Поручить Стивенсону организовать Тобермори."
 r56_eng.10.b:0 "Дать Стивенсону командование в море."
 ENG_for_the_good_of_the_revolution_idea:1 "Во благо революции"
 ENG_for_the_good_of_the_revolution_idea_desc:1 "Каждый должен быть готов пожертвовать удобствами ради страны. [ROOT.getAdjective] народ будет высоко держать голову перед лицом нормирования, уверенный, что оно обеспечит окончательную победу."
 newsmod.3.t:0 "Германия принимает Британскую империю в Ось"
 newsmod.3.d:0 "За последний год ультранационалистические фашистские движения стремительно распространились в Британии. Демократический образ жизни оказался в меньшинстве, а страна приняла фашизм. Более того, британцы решили вступить в союз с Гитлером и Германским рейхом, угрожая стабильности Европы. Доминионы также были вынуждены вступить в Ось, но делают это неохотно и считают, что пора отдалиться от Британии..."
 newsmod.3.a:0 "Подлинный поворотный момент нашей истории!"
 newsmod.3.b:0 "Мы приветствуем британских друзей!"
 newsmod.3.c:0 "Мы с этим не согласны!"
 newsmod.3.e:0 "Тревожно."
 englandmod.1.t:0 "Англия просит принять её в Ось"
 englandmod.1.d:0 "Только что прибыл представитель [ENG.GetName]. В [ENG.GetName] недавно развернулось мощное ультранационалистическое движение, и теперь страна желает вступить в Рейх и Ось, чтобы вместе определять будущее мира."
 englandmod.1.a:0 "Принять."
 englandmod.1.b:0 "Отказать."
 englandmod.5.t:0 "Британцы требуют нашей аннексии"
 englandmod.5.d:0 "Сегодня утром в Дублин прибыл британский делегат. Ультранационалистическое движение в Британии наконец добралось до нас: Лондон требует немедленной аннексии. Мы не знаем, придут ли Франция или США на помощь, и должны принять тяжёлое решение."
 englandmod.5.a:0 "Уступить их требованиям."
 englandmod.5.b:0 "Ещё чего."
 englandmod.6.t:0 "Ирландия уступает!"
 englandmod.6.d:0 "Наш делегат из Дублина вернулся с прекрасными новостями! Слабые ирландцы приняли требование о немедленной аннексии. Теперь можно переходить к следующему этапу плана."
 englandmod.6.a:0 "Они сделали разумный выбор."
 englandmod.7.t:0 "Ирландия отвергает наши требования!"
 englandmod.7.d:0 "В жалкой последней попытке проявить храбрость глупое ирландское правительство отказалось от аннексии. Более того, оно решило мобилизовать вооружённые силы на случай британского нападения."
 englandmod.7.a:0 "Они что, самоубийцы?"
 englandmod.8.t:0 "Британцы предлагают союз"
 englandmod.8.d:0 "Сегодня утром в Лиссабон прибыл британский делегат. Если их вмешательство в испанскую политику было недостаточно очевидным, теперь они стремятся повлиять и на нашу, предлагая союз."
 englandmod.8.a:0 "Мы согласны!"
 englandmod.8.b:0 "Мы не станем в этом участвовать."
 englandmod.9.t:0 "Португалия соглашается!"
 englandmod.9.d:0 "Португалия приняла наше предложение о союзе! Португальцы и британцы вновь стоят плечом к плечу против врагов!"
 englandmod.9.a:0 "Ура!"
 englandmod.10.t:0 "Португалия отказывается!"
 englandmod.10.d:0 "Португалия отклонила наше предложение о союзе! Она доказала свою бесполезность!"
 englandmod.10.a:0 "Кто не с нами, тот против нас."
 englandmod.11.t:0 "Британцы предлагают союз"
 englandmod.11.d:0 "Сегодня утром в Рим прибыл британский делегат. Британия всё больше сосредотачивается на Средиземноморье и предлагает союз. Мы не хотим её провоцировать, но соглашение может подорвать часть наших притязаний..."
 englandmod.11.a:0 "Мы согласны!"
 englandmod.11.b:0 "Ни за что."
 englandmod.12.t:0 "Италия соглашается!"
 englandmod.12.d:0 "Италия приняла предложение о союзе! Вместе мы разделим гегемонию!"
 englandmod.12.a:0 "Ура!"
 englandmod.13.t:0 "Италия отказывается!"
 englandmod.13.d:0 "Италия отклонила наше предложение о союзе! Она доказала свою бесполезность!"
 englandmod.13.a:0 "Кто не с нами, тот против нас."
 englandmod.14.t:0 "Британцы предлагают союз"
 englandmod.14.d:0 "Сегодня утром в Варшаву прибыл британский делегат. Британцы ожидают, что Германия рано или поздно объявит войну одному из соседей, и полагают, что целью станем мы. Они предлагают союз для сдерживания Германии, но у нас есть ощущение, что в конечном счёте они поведут нас по мрачному пути..."
 englandmod.14.a:0 "Мы согласны!"
 englandmod.14.b:0 "Ни за что."
 englandmod.15.t:0 "Польша соглашается!"
 englandmod.15.d:0 "Польша приняла наше предложение о союзе! Вместе мы победим немцев!"
 englandmod.15.a:0 "Ура!"
 englandmod.16.t:0 "Польша отказывается!"
 englandmod.16.d:0 "Польша отклонила наше предложение о союзе! Она доказала свою бесполезность!"
 englandmod.16.a:0 "Кто не с нами, тот против нас."
 englandmod.17.t:0 "Предложение британского союза"
 englandmod.17.d:0 "Вчера в Токио прибыл британский делегат. Похоже, Британия считает, что возобновление англо-японского союза будет выгодно обеим странам. Возможно, она также рассматривает войну с Соединёнными Штатами?"
 englandmod.17.a:0 "Мы согласны возобновить союз."
 englandmod.17.b:0 "Они нам не нужны."
 englandmod.18.t:0 "Япония соглашается!"
 englandmod.18.d:0 "Хорошие новости! Япония приняла наше предложение о союзе! Объединёнными силами мы наверняка победим американцев!"
 englandmod.18.a:0 "Ура!"
 englandmod.19.t:0 "Япония отказывается!"
 englandmod.19.d:0 "Плохие новости! Япония отклонила наше предложение о союзе. Неужели она не понимает, что спящий гигант скоро проснётся?"
 englandmod.19.a:0 "Это их похороны."
 englandmod.20.t:0 "Предложение британского союза"
 englandmod.20.d:0 "Вчера в Каракас прибыл британский делегат. Похоже, Британия считает военный союз между нашими странами взаимовыгодным. Возможно, она также рассматривает войну с Соединёнными Штатами?"
 englandmod.20.a:0 "Мы согласны вступить!"
 englandmod.20.b:0 "Нет, спасибо."
 englandmod.21.t:0 "Венесуэла соглашается!"
 englandmod.21.d:0 "Хорошие новости! Венесуэла приняла наше предложение о союзе! Она станет полезной базой для ударов по Западному полушарию."
 englandmod.21.a:0 "Ура!"
 englandmod.22.t:0 "Венесуэла отказывается!"
 englandmod.22.d:0 "Плохие новости! Венесуэла отклонила наше предложение о союзе. Неужели она не понимает, что спящий гигант скоро проснётся?"
 englandmod.22.a:0 "Неважно."
 englandmod.23.t:0 "Положение английского фашизма"
 englandmod.23.d:0 "Хотя прежние английские хозяева пытались навязать нашей стране фашизм, мы больше не обязаны терпеть такое вмешательство. Следует ли избавиться от фашистского влияния, которое британцы принесли в нашу страну?"
 englandmod.23.a:0 "Да, пора избавиться от этой нелепой идеологии."
 englandmod.23.b:0 "Нет, спасибо. Мне нравится фашизм."
