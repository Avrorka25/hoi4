 cityfall.37.t:0 "Падение Москвы"
 cityfall.37.d:0 "Сегодня наша славная [BHU.GetNameDef] сокрушила жалких [SOV.GetAdjective] защитников Москвы. После нескольких часов боёв наши штурмовики гордо маршируют по изуродованным остаткам города.\n\nУ [SOV.GetAdjective] солдат почти не было средств противостоять превосходству [BHU.GetAdjective] армии, и уже насчитано почти полмиллиона пленных. Друк-Юл выпотрошил медведя, и хотя остатки [SOV.GetAdjective] правительства всё ещё бахвалятся будущим сопротивлением, теперь никто не сомневается в нашем неоспоримом господстве над европейской частью России."
 cityfall.37.a:0 "Можно ли остановить [BHU.GetAdjective] угрозу?"
 cityfall.37.b:0 "[BHU.GetAdjective] народ пройдёт от моря до моря!"
 cityfall.37.c:0 "[SOV.GetNameDef] больше никогда не попадёт под восточное ярмо!"
 cityfall.38.t:0 "Падение Вашингтона"
 cityfall.38.d:0 "Несмотря на многочисленные попытки [USA.GetAdjective] силы, чтобы удержать или хотя бы отсрочить атаку [SPR.GetAdjective] войска, [USA.GetAdjective]Он призвал к общему отступлению сегодня после [SPR.GetAdjective] Солдаты прорвались в парк Рок-Крик.\n\nThe [SPR.GetAdjective] Окончательное сопротивление было подавлено [USA.GetAdjective] Силы в Капитолийском холме и Форт-Мейер после того, как их силы попали в засаду [USA.GetAdjective] Защитники поднимают спецназ на Потомак.\n\nТеперь, с самой столицей [USA.GetNameDef] Под большим пальцем кажется маловероятным, что [SPR.GetAdjective] будет вытеснен с западного побережья, и [SPR.GetLeader] Он уже высадился в разрушенной столице, чтобы поговорить с войсками."
 cityfall.38.a:0 "Неужели это конец свободы?"
 cityfall.38.b:0 "Слава Испании превзойдёт всё!"
 cityfall.38.c:0 "Мы сбросим их обратно в море!"
 cityfall.39.t:0 "Падение Вашингтона"
 cityfall.39.d:0 "Британские солдаты сожгли Вашингтон во второй раз в истории. Хотя эта попытка принесла гораздо больше смертей и разрушений обеим армиям, с многочисленными [ENG.GetAdjective] Корабли, разбитые вдоль побережья [USA.GetAdjective] форты и тысячи убитых или пропавших без вести в отчаянной битве за [USA.GetAdjective] Столица, [ENG.GetAdjective] Доминирование в регионе прочно утвердилось.\n\n[USA.GetAdjective] Газеты отреагировали с ужасом, осуждая, что Союз может быть окончательно разбит своими самыми старыми врагами. The [ENG.GetAdjective] Провозглашать то же самое, хотя и в гораздо более позитивном свете."
 cityfall.39.a:0 "Они вернули свои колонии."
 cityfall.39.b:0 "Мерзкие мятежники наконец получили по заслугам."
 cityfall.39.c:0 "ГРЯЗНЫЕ КРАСНЫЕ МУНДИРЫ, УБИРАЙТЕСЬ ДОМОЙ."
 cityfall.40.t:0 "Падение Вашингтона"
 cityfall.40.d:0 "[POL.GetAdjective] Солдаты окончательно одолели защитников... [USA.GetAdjective] Столица сегодня после удивительно быстрой битвы за центр города. Хотя и [POL.GetAdjective] Столкнувшись с ожесточенным сопротивлением, когда они продвигались через Бетесду и Форт-Мид, сама столица упала относительно быстро благодаря выходкам города. [POL.GetAdjective] специальных служб.\n\nПробираясь через старую канализацию города, команда сумела проникнуть в Белый дом и, думая, что битва уже закончена благодаря временному затишью в боях и случайному отсутствию [USA.GetAdjective] Защитники в здании, поднятые [POL.GetAdjective] Флаг сверху.[USA.GetAdjective] Силы, мыслящие [POL.GetAdjective] После этого они начали сдаваться, и вскоре после этого [POL.GetAdjective] Теперь у них есть полный контроль над бывшими. [USA.GetAdjective] Столица."
 cityfall.40.a:0 "[POL.GetAdjective] солдаты всегда находят способ."
 cityfall.40.b:0 "Элитная [POL.GetAdjective] армия вновь перехитрила врага!"
