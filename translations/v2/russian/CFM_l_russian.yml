 cityfall.1.t:0 "Падение Лондона"
 cityfall.1.d:0 "После ожесточённых боёв, продолжавшихся большую часть дня, победоносные [USA.GetAdjective] солдаты маршируют по улицам Лондона. Хотя во время битвы им удалось сохранить большинство городских памятников, Тауэрский мост был разрушен после того, как отступавшие [ENG.GetAdjective] войска попытались прорваться по нему через Темзу, а [USA.GetAdjective] авиаудары уничтожили центральную часть моста прежде, чем они смогли достичь другого берега.\n\nЗвёздно-полосатый флаг теперь сменил Юнион Джек, а [USA.GetLeader] вскоре выступит с речью на месте, где прежде стоял Букингемский дворец. Одна империя угасает, пока другая восходит."
 cityfall.1.a:0 "Каков отец, таков и сын."
 cityfall.1.b:0 "Ещё один шаг на пути к истинной свободе."
 cityfall.1.c:0 "Проклятые янки!"
 cityfall.2.t:0 "Падение Лондона"
 cityfall.2.d:0 "По мнению всех хороших британцев, худший сценарий постиг великую нацию. Защитники Лондона сражались почти с мужчиной против надвигающегося... [FRA.GetAdjective] Легионы, но после ожесточенных боев и разгрома храбрых отрядов Хоум-Гвардии Лондон пал. Даже сейчас по всему городу до сих пор слышны выстрелы, поскольку отважные лондонцы продолжают сопротивляться армиям своего величайшего врага.\n\nНесмотря на попытки [ENG.GetAdjective] Однако армия и жители Лондона... [FRA.GetAdjective] Силы контролируют достаточно улиц, которые никто не может по-настоящему игнорировать. [FRA.GetAdjective] контроль над городом. Триколор теперь летит над руинами Букингемского дворца, и впервые за тысячелетие [FRA.GetAdjective] В настоящее время является лингва франка Лондона."
 cityfall.2.a:0 "История не повторяется, но часто рифмуется."
 cityfall.2.b:0 "Сгинь, вероломный Альбион!"
 cityfall.2.c:0 "Британцы никогда, никогда, никогда не будут рабами!"
 cityfall.3.t:0 "Падение Лондона"
 cityfall.3.d:0 "В ходе событий, потрясших народы всего мира, [POL.GetAdjective] солдаты захватили Лондон. После дерзкого налёта [POL.GetAdjective] кавалерии, уничтожившей большую часть запасов боеприпасов местных защитников, [POL.GetAdjective] войска воспользовались лондонским метро и старой канализацией, чтобы проникнуть в тыл врага. Прежде чем обороняющиеся успели контратаковать, несколько [POL.GetAdjective] эскадронов уже появились в черте города, а значительная часть гарнизона капитулировала всего за несколько часов.\n\nНекоторые защитники сумели припрятать боеприпасы и теперь сопротивляются [POL.GetAdjective] захватчикам в отдельных районах. Возле Букингемского дворца и Лондонского Тауэра всё ещё слышны выстрелы, но [POL.GetAdjective] ударные части уже подавляют последние очаги сопротивления."
 cityfall.3.a:0 "Разве теперь кто-то усомнится в могуществе [POL.GetNameDef]?"
 cityfall.3.b:0 "Теперь никто не сможет отрицать могущество [POL.GetNameDef]!"
 cityfall.3.c:0 "Проклятые поляки!"
 cityfall.4.t:0 "Падение Лондона"
 cityfall.4.d:0 "Пока Восходящее солнце поднимается всё выше, другое солнце, возможно, наконец закатывается над Британскими островами. Хиномару уже развевается над каждым аббатством и каждой башней Лондона, переименованного в Дайсёри, а [JAP.GetAdjective] чиновники уже создали переходную администрацию для управления новым завоеванием.\nИнакомыслящих уже собирают и увозят среди ночи, а капитулировавшие [ENG.GetAdjective] части начали марш к новым лагерям, строящимся для них в сельской местности. Нескольким местным [ENG.GetAdjective] руководителям предложили совершить сэппуку, чтобы искупить свою неудачу, и из-за опасений, что вокруг них может сплотиться сопротивление, это предложение не было добровольным. Букингемский дворец уже выбран для перестройки в одну из новых сезонных резиденций императора после окончания войны."
 cityfall.4.a:0 "Похоже, Восток пришёл на Запад."
 cityfall.4.b:0 "Лишь одно солнце никогда не зайдёт."
 cityfall.4.c:0 "Они думают, что победили, но мы ещё вернёмся!"
 cityfall.5.t:0 "Падение Лондона"
 cityfall.5.d:0 "На фоне горящего Лондона, [SPR.GetAdjective] Войска сейчас поднимают [SPR.GetNameDef]Красный и золотой флаг над городом. Гавань сгорела в жестоком развороте сожжения [SPR.GetAdjective] Армада в 1588 году. Бой был ожесточенным по всему городу. [SPR.GetAdjective] Войска сталкиваются с жестким сопротивлением улица за улицей, но в конце концов [SPR.GetAdjective] Захватчики наконец-то сломили последний из [ENG.GetAdjective] Линии и теперь сталкиваются только с редким сопротивлением вокруг внешних границ города.\n\n[SPR.GetLeader] Сам он был вывезен в Лондон на своем частном самолете и будет выступать с речью перед различными людьми. [SPR.GetAdjective] В течение часа солдаты проявляют храбрость. После этого он обратится к жителям Лондона с вопросом о том, что ожидается от них в ближайшие дни."
 cityfall.5.a:0 "Похоже, ход истории изменился."
 cityfall.5.b:0 "Наконец исправлена давняя ошибка."
 cityfall.5.c:0 "Битва за Лондон окончена, но война за Британию ещё не проиграна!"
 cityfall.6.t:0 "Падение Берлина"
 cityfall.6.d:0 "Сегодня падение рейхсканцелярии ознаменовало конец эпической битвы на искалеченных войной улицах Берлина. [JAP.GetAdjective] солдаты водрузили Хиномару над разрушенным зданием; тела защитников усеяли саму канцелярию и дороги вокруг неё, но погибших [JAP.GetAdjective] бойцов оказалось вдвое больше.\n\nБитва за Рейхстаг была сравнительно короткой: [GER.GetAdjective] самолёт потерял управление и врезался в здание, а взрыв его топливных баков уничтожил большую часть укреплённой обороны. После падения рейхсканцелярии лишь несколько [GER.GetAdjective] частей продолжают держаться в Концертхаусе на Жандарменмаркте. Однако [JAP.GetAdjective] войска уже ворвались во внешние помещения здания."
 cityfall.6.a:0 "Вот вам и «Тысячелетний рейх»."
 cityfall.6.b:0 "Ни один орёл не сравнится с мощью Восходящего солнца!"
 cityfall.6.c:0 "Враг будет сокрушён любой ценой!"
 cityfall.7.t:0 "Падение Берлина"
 cityfall.7.d:0 "Хотя ожесточенное танковое сражение все еще происходит по всей Акерштрассе, в остальной части города, [GER.GetAdjective] Солдаты начали либо отступать, либо делать свой последний бой перед лицом победоносных сил. [SPR.GetAdjective] Войска.\n\nБитва, в которой большая часть старого города была разрушена и большая часть дороги города непригодна для использования, была выиграна после концентрированных усилий. [SPR.GetAdjective] Для того, чтобы взять на себя U-Bahn, с [GER.GetAdjective] Защитники были застигнуты врасплох [SPR.GetAdjective] Подталкивай под землю.\n\nТеперь, когда последняя из организованных защит истреблена, кажется, что [GER.GetNameDef] Он стоит на последних ногах."
 cityfall.7.a:0 "Кто мог такое предвидеть?"
 cityfall.7.b:0 "Плюс ультра!"
 cityfall.7.c:0 "Мы не сдадимся, пока не падёт наш последний солдат!"
 cityfall.8.t:0 "Падение Берлина"
 cityfall.8.d:0 "[YUG.GetAdjective] власти уже планируют грандиозную церемонию на Курфюрстендамме после завершения боёв в городе. [GER.GetAdjective] войска часами держались в любом здании, которое можно было превратить в крепость, включая зенитную башню в Зоологическом саду. Но в итоге всё оказалось напрасно, и флаг [YUG.GetNameDef] уже виден на уцелевших достопримечательностях по всему городу.\n\nЧто это означает для [GER.GetNameDef], пока неизвестно, однако большинство наблюдателей ожидают завершения войны победой [YUG.GetNameDef]."
 cityfall.8.a:0 "Теперь на [GER.GetAdjective] плечи легло славянское ярмо."
 cityfall.8.b:0 "Исторический день для всех народов [YUG.GetNameDef]!"
 cityfall.8.c:0 "Мы никогда не преклоним колени перед славянами!"
 cityfall.9.t:0 "Падение Берлина"
 cityfall.9.d:0 "После взрывного завершения дня боёв [CZE.GetAdjective] правительство объявило, что вооружённые силы страны установили полный контроль над столицей — Берлином.\n\nПосле целого дня сражений, уничтоживших многие достопримечательности города, включая Колонну Победы, под землёй всё ещё сохраняется ожесточённое сопротивление: [GER.GetAdjective] ополченцы и регулярные части продолжают держаться. Однако [CZE.GetAdjective] войска взрывают переборки под Ландвер-каналом, надеясь затопить последних защитников, отказывающихся сдаться."
 cityfall.9.a:0 "Говорили, «Тысячелетний рейх»?"
 cityfall.9.b:0 "Вперёд, братья, победа будет за нами!"
 cityfall.9.c:0 "Мы никогда не сдадимся — все на передовую!"
 cityfall.10.t:0 "Падение Берлина"
 cityfall.10.d:0 "Возможно, сегодня был забит последний гвоздь в гроб [GER.GetNameDef]: измученные, но неумолимо решительные [ITA.GetAdjective] войска наконец добрались до крыши Рейхстага. Вскоре над ним подняли Триколор, а [ITA.GetAdjective] части начали зачищать последние опорные пункты [GER.GetAdjective] сопротивления в городе.\n\nПоезда с пленными уже отправились по железным дорогам в лагеря для военнопленных в пригородах, а [ITA.GetAdjective] солдаты развернули по всему городу полевые кухни и посты, положив начало долгому восстановлению Берлина."
 cityfall.10.a:0 "Месть, которой ждали тысячу лет."
 cityfall.10.b:0 "Пришёл, увидел, победил."
 cityfall.10.c:0 "Рим никогда не будет править Германией!"
 cityfall.11.t:0 "Падение Стокгольма"
 cityfall.11.d:0 "Стокгольм, столица [SWE.GetNameDef]Он падает после тяжелых боев в течение большей части дня. Местный [SWE.GetAdjective] Силы превратили остров Стадшолмен в крепость и яростно сражались, чтобы удержать город. [GER.GetAdjective]Вышел. Тем не менее, они были вынуждены отступить после того, как массированный артиллерийский обстрел опустошил их линии.\n\nХотя [SWE.GetAdjective] Войска надеялись задержать их дальше, сносные заряды на Васаброне не смогли взорваться, и войска не смогли остановить их. [GER.GetAdjective]Вскоре после этого он сумел одолеть последнего из защитников. The [GER.GetAdjective]s устранил последние очаги сопротивления сегодня, и [GER.GetAdjective] Флаг теперь развевается над зданием Розенбада."
 cityfall.11.a:0 "Неужели никто не в безопасности?"
 cityfall.11.b:0 "Скандинавия ощутит нашу мощь!"
 cityfall.11.c:0 "Храбрые шведы, продолжайте борьбу!"
 cityfall.12.t:0 "Падение Стокгольма"
 cityfall.12.d:0 "Красная армия с боями прошла по Свеавегену и ворвалась в центр Стокгольма, захватив город после сражения, продолжавшегося большую часть дня. [SWE.GetAdjective] ополчение всё ещё сопротивляется на окраинах, а оставшиеся регулярные части укрепились в Стокгольмском дворце, но в остальном битва за город завершена.\n\nРуководство страны успело бежать после первых выстрелов, однако [SWE.GetNameDef] потрясена до основания, а Красное знамя теперь вывешено на каждом важном здании. Сторонники новых властей уже вышли из подполья, пока отряды Красной армии оказывают поддержку их ополчению."
 cityfall.12.a:0 "Тень коммунизма нависла над Скандинавией."
 cityfall.12.b:0 "Рабочие Швеции с нами — вперёд, товарищи!"
 cityfall.12.c:0 "Пока мы сражаемся, мы не падём!"
 cityfall.13.t:0 "Падение Берлина"
 cityfall.13.d:0 "Под оглушительный грохот артиллерии фельдмаршал, командовавший армией, окончательно захватившей Берлин, выступил с речью среди руин Бранденбургских ворот. После ожесточённой битвы, охватывавшей город ещё несколько часов назад и всё ещё продолжающейся на окраинах и в метро, [CHI.GetAdjective] войска успешно штурмовали Рейхстаг.\n\nКогда весть о его падении распространилась по городу, деморализованные [GER.GetAdjective] силы начали массово сдаваться. Теперь, когда последние бастионы неповиновения гаснут один за другим, число капитулирующих лишь растёт.\n\nСтанет ли это окончательным поражением [GER.GetNameDef]?"
 cityfall.13.a:0 "Неожиданный поворот."
 cityfall.13.b:0 "Наша победа неизбежна!"
 cityfall.13.c:0 "Они выиграли битву, но не выиграют войну!"
 cityfall.14.t:0 "Падение Берлина"
 cityfall.14.d:0 "Славные силы королевской семьи [BHU.GetAdjective] Армия недавно опустошила странный город Берлин и его защитников. Какая бы жалкая защита ни была [GER.GetAdjective]s удалось организовать рухнувший в течение нескольких часов под нападками героических [BHU.GetAdjective] Штурмовики.\n\n[GER.GetAdjective] Силы сдались человеку человеком после [BHU.GetAdjective] Ворвался в рейхстаг, захватив здание после получасового боя, в результате чего один из них был разрушен. [BHU.GetAdjective] Солдат ранен и двести жалких [GER.GetAdjective] Солдаты мертвы.\n\nГраждане Берлина празднуют свое освобождение от руки героического героя. [BHU.GetAdjective] Войска. Многие статуи и изображения старого режима начали сносить, чтобы освободить место для скульптур, достойных того, чтобы их увидели те из нашего славного царства!"
 cityfall.14.a:0 "Господи Боже!"
 cityfall.14.b:0 "Никакие грязные варвары не остановят наши ведомые свыше армии!"
 cityfall.14.c:0 "Э-это ещё не конец, мы победим... когда-нибудь!"
 cityfall.15.t:0 "Падение Лондона"
 cityfall.15.d:0 "Сегодня поступили неожиданные новости: подразделения [IRE.GetAdjective] армии после большей части дня боёв успешно захватили [ENG.GetAdjective] столицу — Лондон. Однако во многих районах города сопротивление всё ещё остаётся ожесточённым: [ENG.GetAdjective] части удерживают Илинг и Ислингтон, а [ENG.GetAdjective] ополчение вместе с полицией продолжает оборонять Скотленд-Ярд.\n\nНо это лишь последние примечания к уже завершившейся битве: большинство важных достопримечательностей занято [IRE.GetAdjective] частями, а боевые группы [IRE.GetAdjective] коммандос готовятся подавить последние очаги сопротивления."
 cityfall.15.a:0 "Может ли кто сомневаться в [IRE.GetAdjective] Сейчас?"
 cityfall.15.b:0 "Празднуйте, гордые ирландцы: Вечный англичанин обезглавлен!"
 cityfall.15.c:0 "Надо было покончить с ними давным-давно, чёрт побери!"
 cityfall.16.t:0 "Падение Лондона"
 cityfall.16.d:0 "Очередная неизбежная победа на длинном пути [BHU.GetAdjective] Завоевание произошло сегодня. The [BHU.GetAdjective] Королевская армия успешно выкорчевала защитников Лондона после того, как они отчаянно не смогли даже вставить хлам в элитные легионы Громового Дракона.\n\nThe [ENG.GetAdjective]Теперь, живя при нашем вечно справедливом и славном режиме, мы уже начинаем процесс интеграции в наше царство.\n\nМестный военачальник приказал трусливо отступить после первого [BHU.GetAdjective] Солдаты вошли в город. Несколько его людей пытались сопротивляться приказу, но их неповиновение оказалось напрасным перед лицом начальника. [BHU.GetAdjective] цифры.\n\nЖители Лондона уже вышли из своих домов, празднуя вход своих освободителей!"
 cityfall.16.a:0 "Громовой дракон летит на север."
 cityfall.16.b:0 "Трусливый [ENG.GetAdjective] лев не сравнится с могучим Друк-Юлом!"
 cityfall.16.c:0 "Где бы мы ни были, будем сражаться до последнего человека!"
 cityfall.17.t:0 "Падение Лондона"
 cityfall.17.d:0 "[CHI.GetAdjective] Сегодня войска подняли свой флаг над шпилями Вестминстерского аббатства. Историческая достопримечательность была последним бастионом сопротивления. [CHI.GetAdjective] сил, с [ENG.GetAdjective] Силы в Скотланд-Ярде и Кингстоне на Темзе наконец сдались.\n\nЗавоевание Лондона, одно из многих достижений [CHI.GetAdjective] Вооруженные силы в последнее время отмечают значительный подъем в [CHI.GetAdjective] кампания против [ENG.GetNameDef]Который, кажется, уже почти закончился."
 cityfall.17.a:0 "The [CHI.GetAdjective] Наконец-то вышли на вершину."
 cityfall.17.b:0 "Смерть империалистам!"
 cityfall.17.c:0 "Для [ENG.GetNameDef] настали тёмные времена."
 cityfall.18.t:0 "Падение Вашингтона"
 cityfall.18.d:0 "«История показывает, что непобедимых армий нет». — Иосиф Сталин\n\nНесмотря на отчаянный последний бой множества сил — от Корпуса морской пехоты США и подразделений Национальной гвардии более чем двадцати штатов до Секретной службы и местной полиции, — Вашингтон пал перед [SOV.GetAdjective] войсками.\n\nПоследние выстрелы всё ещё звучат: местные бойцы сопротивления храбро противостоят [SOV.GetAdjective] натиску, даже когда город горит вокруг них. Но в целом битва уже окончена. [SOV.GetAdjective] танки неподвижно стоят на Южной лужайке, а над монументом Вашингтона победно развевается Красное знамя."
 cityfall.18.a:0 "Неужели это последний вздох свободы?"
 cityfall.18.b:0 "Рабочие [USA.GetNameDef] будут свободны!"
 cityfall.18.c:0 "Мы сбросим этих красных ублюдков обратно в море!"
 cityfall.19.t:0 "Падение Вашингтона"
 cityfall.19.d:0 "После тяжёлых боёв, продолжавшихся большую часть дня, Вашингтон — столица [USA.GetNameDef] — пал перед армиями Восходящего солнца. После многочисленных попыток удержать врага на другом берегу Потомака [JAP.GetAdjective] войска окружили город и разгромили местную оборону вдоль кольцевой дороги. Преодолев оба рубежа, [JAP.GetAdjective] солдаты методично захватывали здание за зданием, попутно уничтожая большинство исторических достопримечательностей.\n\nАмериканский эксперимент, возможно, окончательно провалился: монумент Вашингтона лежит в руинах на Национальной аллее, а Белый дом охвачен пламенем."
 cityfall.19.a:0 "Чёрный день для всех свободных народов мира."
 cityfall.19.b:0 "Восходящее солнце низвергло гордого орла."
 cityfall.19.c:0 "The [JAP.GetAdjective] Их нужно остановить любой ценой!"
 cityfall.20.t:0 "Падение Вашингтона"
 cityfall.20.d:0 "[ITA.GetLeader] Он был доставлен в Вашингтон, округ Колумбия. Сегодня мы поговорим о развалинах бывшей [USA.GetAdjective] Столица. Яростно сражаясь в течение нескольких дней, битва там закончилась после отступления войск. [USA.GetAdjective] Были призваны войска. The [USA.GetAdjective]Они сражались до тех пор, пока Триколор не был поднят над Белым домом, и когда они увидели здание столицы, они, наконец, отказались от борьбы.\n\nПадение Вашингтона, округ Колумбия. является одним из многих знаков, обозначающих [ITA.GetNameDef] Как зарождающаяся сверхдержава мира, нечто [ITA.GetLeader]Речь, скорее всего, затронет."
 cityfall.20.a:0 "[USA.GetAdjective] империя? Пф."
 cityfall.20.b:0 "Маре Нострум? Мария Ностра!"
 cityfall.20.c:0 "Храбрые народы свободного мира никогда не сдадутся!"
 cityfall.21.t:0 "Падение Вашингтона"
 cityfall.21.d:0 "После яростной битвы, оставившей большую часть Вашингтона в огне, [MEX.GetAdjective] войска объявили о победе в своей кампании на восточном побережье Америки.\n\nХотя [MEX.GetAdjective] солдатам ещё предстоит подавить отдельные очаги сопротивления, битва за Вашингтон, возможно, стала последним гвоздём в гроб [USA.GetAdjective] военных усилий. После ошеломительной [MEX.GetAdjective] победы их силы охвачены смятением. Сражение, в котором погибли тысячи [USA.GetAdjective] и [MEX.GetAdjective] солдат, возможно, стало заключительным актом конфликта, длившегося целый век."
 cityfall.21.a:0 "Похоже, в Америке появилась новая держава."
 cityfall.21.b:0 "Вива Мехико!"
 cityfall.21.c:0 "Надо было построить стену!"
 cityfall.22.t:0 "Падение Вашингтона"
 cityfall.22.d:0 "Во время войны 1812 года британские войска под командованием генерал-майора Роберта Росса успешно захватили и сожгли большую часть Вашингтона, включая Белый дом. Многие ошибочно приписывают победу канадским войскам, а популярная легенда гласит, что канадцы сожгли Белый дом дотла.\n\nНо это уже не легенда, так как [CAN.GetAdjective] Войска доказали, что они также могут уничтожать [USA.GetAdjective] Капитал раз и навсегда. После боя на улицах, [CAN.GetAdjective] Солдаты разграбили и сожгли здание Капитолия. Горький след на продолжающемся падении [USA.GetNameDef]."
 cityfall.22.a:0 "Вот это да."
 cityfall.22.b:0 "Разумеется, мы сделали это уже во второй раз!"
 cityfall.22.c:0 "Это ещё не конец!"
 cityfall.23.t:0 "Падение Белграда"
 cityfall.23.d:0 "Сегодня силы Вермахта объявили о победе после отступления [YUG.GetAdjective] войск из Белграда. Город, сильно пострадавший за несколько часов боёв, пал после решительного [GER.GetAdjective] окружения, отрезавшего [YUG.GetAdjective] подкрепления и эшелоны снабжения. Видя, как сужается путь к отступлению, оставшиеся [YUG.GetAdjective] силы приняли последний бой против [GER.GetAdjective] врага.\n\nПадение Белграда знаменует потрясающий конец [YUG.GetNameDef] — страны, которая среди многих других в одиночку поддерживала мечту об объединённом южнославянском народе под своей властью и общей защитой. Но даже мечта не способна устоять перед [GER.GetAdjective] молотом."
 cityfall.23.a:0 "Блицкриг продолжается."
 cityfall.23.b:0 "Восточные, западные или южные — все одинаковы!"
 cityfall.23.c:0 "Пусть мы падём едиными, как и жили."
 cityfall.24.t:0 "Падение Белграда"
 cityfall.24.d:0 "Несмотря на ожесточённое сопротивление объединённых сил [YUG.GetAdjective] армии, [ITA.GetAdjective] войска после долгого сражения захватили Белград, оставив большую часть города в руинах. [ITA.GetAdjective] солдаты всё ещё уничтожают последние местные отряды сопротивления. Однако многие [YUG.GetAdjective] бойцы сбросили форму и присоединились к растущему партизанскому движению против [ITA.GetAdjective] захватчиков.\n\nПобеда стала огромным подарком для [ITA.GetAdjective] пропаганды, уже изображающей битву как важнейшую ступень к установлению [ITA.GetAdjective] господства над Балканами."
 cityfall.24.a:0 "[ITA.GetLeader] стал ещё на шаг ближе к своей мечте."
 cityfall.24.b:0 "Мы триумфально вернули Иллирик!"
 cityfall.24.c:0 "Храбрые [YUG.GetAdjective] бойцы, продолжайте сражаться!"
 cityfall.25.t:0 "Падение Белграда"
 cityfall.25.d:0 "Хотя греки когда-то правили землями, которые сейчас находятся под властью греков. [YUG.GetNameDef]Во времена Византийской империи этот район всегда был ограниченным и на протяжении почти тысячелетия находился под контролем императора.\n\nНесмотря на то, что древние империи давно мертвы, [GRE.GetAdjective]Теперь они вернулись в город Белград, который недавно был взят после решающего решения. [GRE.GetAdjective] Наступательно. Хотя [GRE.GetAdjective] Войска теперь сталкиваются с ожесточенным сопротивлением, особенно в Аде Циганлия и Фонтане, сине-белые были подняты над Национальным собранием. Последние надлежащие воинские части в этом районе сдались."
 cityfall.25.a:0 "[GRE.GetAdjective] войска вернулись."
 cityfall.25.b:0 "Мы вернулись!"
 cityfall.25.c:0 "Мы уже однажды вырвались на свободу и сделаем это снова!"
 cityfall.26.t:0 "Падение Белграда"
 cityfall.26.d:0 "Красная армия недавно объявила о победе в битве за Белград. Сражение завершилось после капитуляции последних [YUG.GetAdjective] сил на берегах острова Велико-Ратно, теперь переименованного в Остров Народного Освобождения.\n\nХотя для внешних наблюдателей это событие не стало неожиданностью, народ [YUG.GetNameDef] всё равно был потрясён. Люди наблюдают, как страна рушится вокруг них, и сталкиваются с реальностью [SOV.GetAdjective] режима, уже вводящего суровые законы и оккупационные меры, призванные задушить любое возможное сопротивление."
 cityfall.26.a:0 "Возможно, непобедимых армий и не бывает, но Красная армия близка к этому."
 cityfall.26.b:0 "День ликования для рабочих Югославии!"
 cityfall.26.c:0 "Мы никогда не склонимся перед красными тиранами с востока — сопротивляйтесь и сражайтесь!"
 cityfall.27.t:0 "Падение Нью-Йорка"
 cityfall.27.d:0 "Пожары бушуют по всему тому, что когда-то было одним из величайших городов мира, поскольку Нью-Йорк падает перед мощью Красной Армии. После ожесточенных боев, [SOV.GetAdjective]s воевали через город и линию за линией сочетания надлежащих войск и ополченцев.\n\nНесмотря на многочисленные попытки [USA.GetAdjective] Силы, чтобы предотвратить [SOV.GetAdjective]s, подавляющее число Красной Армии в конечном счете выиграло день, и, наконец, Красное Знамя было поднято над, удивительно близко неповрежденной, Статуей Свободы, переименованной в Статую Равенства.\n\nСопротивление становится все более ожесточенным во многих районах города, и [SOV.GetAdjective]Скорее всего, они будут бороться с повстанцами в городе в течение многих лет."
 cityfall.27.a:0 "Свет леди Свободы погас."
 cityfall.27.b:0 "Ещё одна славная победа Красной армии!"
 cityfall.27.c:0 "Вместе мы выстоим, вместе мы падём."
 cityfall.28.t:0 "Падение Дублина"
 cityfall.28.d:0 "[USA.GetAdjective] Сегодня войска вошли в Дублин и успешно захватили город после нескольких часов боевых действий. [IRE.GetAdjective] Силы. Сражение было трудным, но [USA.GetAdjective] Победа была неизбежна, так как подавляющее число [USA.GetAdjective] Армия спустилась на землю [IRE.GetAdjective] Столица.\n\nThe [IRE.GetAdjective] Продолжайте бороться, и [USA.GetAdjective] Оккупационные подразделения уже начали сталкиваться с неумолимыми повстанцами, а именно в сельской местности. The [USA.GetAdjective] У войск впереди долгая работа, так как повстанцы с каждой минутой становятся все больше и больше."
 cityfall.28.a:0 "Не станет ли это плацдармом на пути в Британию?"
 cityfall.28.b:0 "Новый Свет победоносно вступает в Старый."
 cityfall.28.c:0 "Наш день ещё придёт."
 cityfall.29.t:0 "Падение Дублина"
 cityfall.29.d:0 "Сегодня [GER.GetAdjective] командующий вторжением в Ирландию объявил о формальной капитуляции городского гарнизона. Оставшиеся [IRE.GetAdjective] силы, сосредоточенные главным образом в Тринити-колледже и тюрьме Килмэйнхем, несколько часов подвергались массированным ударам [GER.GetAdjective] артиллерии и авиации.\n\nБитва положила конец организованному сопротивлению в Дублине. Хотя отдельные [IRE.GetAdjective] воинские части уцелели и продолжают сражаться в других местах, без центральной власти в Дублине им больше почти не за что держаться. Многие уже сбрасывают форму и переходят к подпольной борьбе против [GER.GetAdjective] захватчиков."
 cityfall.29.a:0 "Ла-Манш больше не сдерживает [GER.GetAdjective] угрозу."
 cityfall.29.b:0 "Легионы Германии не остановит никто!"
 cityfall.29.c:0 "Англичане не смогли навечно прижать нас к земле — не смогут и [GER.GetAdjective] войска!"
 cityfall.30.t:0 "Падение Дублина"
 cityfall.30.d:0 "С тех пор как в 1920-х годах Ирландия сбросила оковы британского господства, здесь не исчезал страх, что однажды [ENG.GetAdjective] войска вернутся. Теперь эти опасения воплотились в жизнь: после тяжёлых боёв [ENG.GetAdjective] силы разгромили [IRE.GetAdjective] защитников и подняли Юнион Джек над Дублином.\n\n[IRE.GetAdjective] бойцы продолжают яростно сопротивляться, взрывая [ENG.GetAdjective] военную технику и убивая местных военных чиновников. Народ сплачивается вокруг своей тысячелетней борьбы за независимость от [ENG.GetNameDef], но пока кажется, что Ирландия вновь пала."
 cityfall.30.a:0 "Империя восстаёт вновь."
 cityfall.30.b:0 "Мы лишь пришли забрать то, что принадлежит нам."
 cityfall.30.c:0 "Англия, убирайся прочь!"
 cityfall.31.t:0 "Падение Москвы"
 cityfall.31.d:0 "Более ста лет назад французская армия уже маршировала по улицам Москвы — теперь это произошло вновь. После ожесточённых боёв за каждый дом [FRA.GetAdjective] войска достигли Красной площади. Армейские сапёры пробили восточную стену Кремля, позволив [FRA.GetAdjective] солдатам смять оставшихся защитников и поднять Триколор над Большим Кремлёвским дворцом.\n\nОднако отступающие [SOV.GetAdjective] силы подорвали по всему городу множество зажигательных зарядов. Огонь пожирает то немногое, что осталось от [SOV.GetAdjective] столицы. История повторяется в Москве, но [FRA.GetNameDef] заверяет народ, что отступление Наполеона больше не повторится."
 cityfall.31.a:0 "Синий прилив продолжает наступать."
 cityfall.31.b:0 "Вперёд!"
 cityfall.31.c:0 "Они заплатят за всё, что у нас отняли!"
 cityfall.32.t:0 "Падение Москвы"
 cityfall.32.d:0 "После нескольких дней тяжёлых бомбардировок, превративших большую часть внешних укреплений города в руины, вчера утром [ITA.GetAdjective] войска начали последний штурм. В кровавом сражении мощь [ITA.GetAdjective] армии столкнулась с основными силами [SOV.GetAdjective] войск и почти всем населением Москвы. Число погибших и раненых, как полагают, приблизилось к миллиону.\n\nНесмотря на самоотверженное сопротивление москвичей — женщин, детей и стариков, которые превратили подступы к Москве в огромное поле смерти, устанавливали пулемёты и заряжали миномёты, — над городом теперь поднят Триколор, а [SOV.GetAdjective] войска отступают к Уралу."
 cityfall.32.a:0 "Третий Рим пал перед Первым."
 cityfall.32.b:0 "От Москвы до Парижа все снова склонятся перед Римом."
 cityfall.32.c:0 "Мы вернёмся из-за гор!"
 cityfall.33.t:0 "Падение Москвы"
 cityfall.33.d:0 "[JAP.GetAdjective] Силы провели большую часть дня, окружая население Москвы на Красной площади, где они были установлены на грузовики и загнаны глубже в город. [JAP.GetAdjective]оккупировала Россию. Точная причина неизвестна, но большинство депортированных включают в себя: [SOV.GetAdjective] солдаты и местные политические деятели, которые, возможно, выступали против [JAP.GetNameDef].\n\nБитва, заключительная фаза которой заняла большую часть более чем дня боевых действий, оставила большую часть города в руинах, а Красная площадь является одним из немногих районов с дорогами, которые не полностью обветшали. Улицы, или то, что от них осталось, завалены остатками [JAP.GetAdjective] и [SOV.GetAdjective] Танки и трупы были сложены на десятки футов в высоту. The [JAP.GetAdjective] Теперь владыка над трупом [SOV.GetNameDef]."
 cityfall.33.a:0 "Солнце восходит на севере."
 cityfall.33.b:0 "[SOV.GetAdjective] люди больше никогда не будут смотреть на нас свысока."
 cityfall.33.c:0 "Они думают, что борьба окончена, но народ никогда не сдастся!"
 cityfall.34.t:0 "Падение Москвы"
 cityfall.34.d:0 "The [SPR.GetAdjective] Правительство объявило сегодня, что силы [SPR.GetAdjective] Армия успешно приняла [SOV.GetAdjective] Столица после ожесточенных уличных боев, которые покинули большую часть города. Когда-то гордо называвшийся Третьим Римом, ныне тлеющий развалин трупов и танковой шелухи.\n\nИзображения уже начали циркулировать в [SPR.GetAdjective] документы [SPR.GetAdjective] Солдаты поднимают Красный венец над остатками Кремля. The [SPR.GetAdjective] Это было последнее препятствие после боя. Хотя многие [SOV.GetAdjective]s все еще сопротивляются во внутренних округах города, большинство сдалось, и [SPR.GetAdjective] Они уже установили контрольно-пропускные пункты и столовые для супа, чтобы попытаться справиться с массовым гуманитарным кризисом, который оставила битва."
 cityfall.34.a:0 "С запада до востока [SPR.GetNameDef] одолела всех."
 cityfall.34.b:0 "Буэнос диас, советикос!"
 cityfall.34.c:0 "[SPR.GetAdjective] тираны будут отброшены!"
 cityfall.35.t:0 "Падение Москвы"
 cityfall.35.d:0 "Фотографии начали циркулировать в прессе [YUG.GetAdjective] Солдаты гордо позируют на вершине Памятника Минину и Пожарскому. На снимке изображены семь солдат, пять сверху с руками на плечах друг друга, и еще двое с винтовками, стоящими перед ними. Все мужчины явно грязные, двое ранены, и один из мужчин, стоящий впереди, 17-летний призывник по имени Тома Лекович, дает знак «V» рукой, усталой улыбкой на его удивительно чистом и молодом лице. потрепанный [SOV.GetAdjective] Между ними проходит знамя.\n\nСегодня, когда последние выстрелы звенят по Арбату и вниз по залам ГУМа, все семь человек, кроме одного, который сильно пострадал от взрыва осколков, лежат мертвыми. Хотя город был взят, потери были огромными, но их имена будут отмечены. [YUG.GetAdjective] История."
 cityfall.35.a:0 "Кто теперь способен предсказать будущее?"
 cityfall.35.b:0 "Имя Лековича и служивших рядом с ним будут помнить вечно."
