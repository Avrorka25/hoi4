 cityfall.36.t:0 "Падение Москвы"
 cityfall.36.d:0 "После ожесточенных боев, которые оставили большую часть прежних [SOV.GetAdjective] Капитал, поглощённый пламенем, [CHI.GetAdjective] Сегодня войска подняли свой флаг над потрепанными останками Кремля.\n\n[SOV.GetAdjective] Войска теперь отступают в сельскую местность после того, как местный командующий объявил о капитуляции. [SOV.GetAdjective] Войска для своих людей, и кажется, что оставшиеся [SOV.GetAdjective] Войска уже участвуют в партизанской кампании против [CHI.GetAdjective] оккупанты.\n\nThe [CHI.GetAdjective] Они превозносили это как великую, окончательную победу над одним из своих величайших соперников, и многие опасаются, что это их первый шаг к завоеванию самой Европы."
 cityfall.36.a:0 "Сможем ли мы их остановить?"
