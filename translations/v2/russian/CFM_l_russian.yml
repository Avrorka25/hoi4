 cityfall.41.t:0 "Падение Вашингтона"
 cityfall.41.d:0 "У французов была долгая история дружбы с Соединенными Штатами Америки до того, как она была основана. Однако, [FRA.GetAdjective] Может быть, наконец разорвали эти связи сегодня после того, как Вашингтон, округ Колумбия, был более или менее выровнен вторжением. [FRA.GetAdjective] Силы.\n\nНесмотря на многочисленные попытки [USA.GetAdjective] вооруженных сил для отражения [FRA.GetAdjective] захватчиков, а затем вытеснить их из столицы, [USA.GetAdjective] Войска, наконец, были вынуждены отступить, так как силы [FRA.GetAdjective] Иностранный легион успешно контратаковал и вытеснял [USA.GetAdjective] Армейские позиции в Арлингтоне, фактически лишающие надежды [USA.GetAdjective] контратака. В честь этой победы массивный Триколор был развёрнут с Монумента Вашингтона, теперь Монумент Наполеона."
 cityfall.41.a:0 "Старые друзья падают тяжело."
 cityfall.41.b:0 "[FRA.GetAdjective] войска превзошли всех."
 cityfall.41.c:0 "Сегодня у нас на ужин будут лягушатники!"
 cityfall.42.t:0 "Падение Вашингтона"
 cityfall.42.d:0 "После кровопролитного сражения, унёсшего тысячи жизней с обеих сторон, [CHI.GetAdjective] войска наконец одолели [USA.GetAdjective] защитников Вашингтона. [USA.GetAdjective] силы, потратившие большую часть последнего месяца на укрепление города, считали, что способны сдерживать [CHI.GetAdjective] наступление бесконечно долго, однако [CHI.GetAdjective] армия буквально завалила оборону телами своих солдат.\n\nХотя [USA.GetAdjective] укрепления были колоссальными, орудиям не хватило боеприпасов, чтобы остановить волны [CHI.GetAdjective] бойцов. После нескольких дней кровавой бойни [CHI.GetAdjective] войска наконец вышли к Потомаку."
 cityfall.42.a:0 "[CHI.GetAdjective] войска не остановятся ни перед чем."
 cityfall.42.b:0 "Дракон пожирает орла!"
 cityfall.42.c:0 "Жёлтая угроза ещё будет побеждена!"
 cityfall.43.t:0 "Падение Вашингтона"
 cityfall.43.d:0 "Элитные и непобедимые легионы [BHU.GetAdjective] армии сегодня сравняли Вашингтон с землёй; во время этой «битвы» погибло лишь трое [BHU.GetAdjective] солдат.\n\nХотя [USA.GetAdjective] силы подготовили огромные укрепления, чтобы не позволить [BHU.GetAdjective] войскам захватить оплот [USA.GetAdjective] могущества, [BHU.GetAdjective] командование предпочло просто уничтожить город. Нескончаемые артиллерийские обстрелы, ковровые бомбардировки и удары с моря почти полностью стёрли его с лица земли, а вода хлынула на улицы и поглотила значительную часть развалин. [BHU.GetAdjective] солдаты прошли по обломкам, практически ничего не обнаружив. Жалкая [USA.GetAdjective] армия не смогла устоять перед их славным огнём."
 cityfall.43.a:0 "Проклятые янки, старайтесь лучше!"
