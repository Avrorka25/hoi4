 cityfall.43.c:0 "Может, ещё не поздно сдаться?"
 cityfall.44.t:0 "Падение Нью-Йорка"
 cityfall.44.d:0 "[ITA.GetLeader] Сегодня победа объявлена как [USA.GetAdjective] Войска были вывезены из Нью-Йорка. Несмотря на то, что большая часть организованного сопротивления была подавлена, [ITA.GetAdjective]Столкнувшись с большим повстанческим движением, с частыми бомбежками и стрельбой, сохраняющими [ITA.GetAdjective] силы на их пальцах ног.\n\nОккупация затронула не больше, чем местные итальянские общины. The [ITA.GetAdjective] Оккупанты нашли как наибольшее количество своих сторонников, так и наибольшее количество повстанцев в этом районе, и местная община сильно разделена из-за своей лояльности. Для [ITA.GetAdjective]Со своей стороны, многие солдаты начали злоупотреблять местными жителями, утверждая, что они сбежали из Италии в ее время нужды. Будущее здесь кажется неопределенным."
 cityfall.44.a:0 "Амбиции [ITA.GetLeader] не знают границ."
 cityfall.44.b:0 "Настоящие итальянцы приветствуют нас!"
 cityfall.44.c:0 "Настоящие [USA.GetAdjective] патриоты продолжают борьбу!"
 cityfall.45.t:0 "Падение Нью-Йорка"
 cityfall.45.d:0 "[JAP.GetAdjective] Силы разгромили и уничтожили последних защитников Нью-Йорка сегодня после того, как они были убиты. [JAP.GetAdjective] Сапёры спрятались в туннелях метро города, убив последнего [USA.GetAdjective] Солдаты, которые ушли под землю, а также где-то от нескольких сотен до нескольких тысяч мирных жителей, которые ушли в подземелье для укрытия.\n\nПоследней из них [USA.GetAdjective] Военные в городе стерты с лица земли, никому не остается сражаться за [JAP.GetAdjective] Местные силы сопротивления города, состоящие из [USA.GetAdjective] Дезертиры, бывшие полицейские и местное вооруженное население. Однако, [JAP.GetAdjective] Они уже начали расправляться с ними, сотни людей были задержаны и изгнаны из города, а их семьи уже взяты."
 cityfall.45.a:0 "Сможем ли мы остановить эту угрозу?"
 cityfall.45.b:0 "Восходящее солнце испепеляет глупцов."
 cityfall.45.c:0 "Даже в самый тёмный час [USA.GetNameDef] никогда не падёт."
 cityfall.46.t:0 "Падение Нью-Йорка"
 cityfall.46.d:0 "Бумаги по всему миру изобилуют фотографиями [SPR.GetAdjective] Солдаты машут статуей свободы. Солдаты, гордые и размахивающие перед оператором, позируют с того, что когда-то было смотровой площадкой на голове статуи. Половину его сдуло, дав им открытый вид на город, а на заднем плане виден расплавленный пень того, что когда-то было факелом.\n\nСтатуя была лишь одной из многих достопримечательностей, попавших под перекрестный огонь. Хотя и [USA.GetAdjective]s утверждает, что [SPR.GetAdjective] Погубил когда-то прекрасный город, [SPR.GetAdjective] Они заявили, что вторжение было попыткой освобождения.[SPR.GetAdjective] Документы утверждают тысячи [USA.GetAdjective] праздновать [SPR.GetAdjective] «Прибытие» на улицы."
 cityfall.46.a:0 "Никакого уважения у этих [SPR.GetAdjective] солдат."
 cityfall.46.b:0 "Вива ла Эспанья!"
 cityfall.46.c:0 "Однажды мы превратим Барселону в новый Нью-Йорк."
 cityfall.47.t:0 "Падение Нью-Йорка"
 cityfall.47.d:0 "Британские войска сохраняли присутствие в Нью-Йорке до 1783 года, когда эвакуировали город после поражения в Войне за независимость от американской Континентальной армии Джорджа Вашингтона, которой помогали французы, голландцы и испанцы.\n\nСегодня история была исправлена: [ENG.GetAdjective] армия вновь марширует по улицам Нью-Йорка. Теперь солдаты носят хаки вместо красных мундиров и вооружены винтовками вместо кремнёвых ружей, но [ENG.GetAdjective] войска всё же вернулись. Первоначально планировалось устроить огромный парад через Таймс-сквер и по главным улицам города. Однако после взрыва среди собравшихся солдат, унёсшего двенадцать жизней, все дальнейшие шествия отменили, а [ENG.GetAdjective] части приступили к репрессиям против местного населения."
 cityfall.47.a:0 "История повторяется."
 cityfall.47.b:0 "Историческая ошибка исправлена."
 cityfall.47.c:0 "Мы уже однажды выгнали их и сделаем это снова!"
 cityfall.48.t:0 "Падение Нью-Йорка"
 cityfall.48.d:0 "Когда северные города [USA.GetNameDef] один за другим начали падать перед [CAN.GetAdjective] армией, многие понимали, что захват Нью-Йорка — лишь вопрос времени. Теперь мрачное ожидание сбылось: [CAN.GetAdjective] войска прорвали внешние рубежи города и уничтожили остатки [USA.GetAdjective] гарнизона.\n\nУцелевшие [USA.GetAdjective] бойцы ушли в подполье, пользуясь поддержкой местных жителей. Они продолжают войну из тени, нападая на изолированные колонны и одиноких [CAN.GetAdjective] солдат при любой возможности. Тем не менее город прочно находится в руках северян."
 cityfall.48.a:0 "Эти безумные канадцы!"
 cityfall.48.b:0 "Янки достаточно скоро склонятся."
 cityfall.48.c:0 "Мы сокрушим нашего великого северного врага!"
 cityfall.49.t:0 "Падение Нью-Йорка"
 cityfall.49.d:0 "В событии, которое многие считают концом изнурительной войны между [USA.GetNameDef] и [MEX.GetNameDef], [MEX.GetAdjective] солдаты наконец одолели защитников Нью-Йорка. Несмотря на отчаянные попытки [USA.GetAdjective] сил остановить южных захватчиков, [MEX.GetAdjective] войска подавили последнее сопротивление, устроившее свой финальный бой на Таймс-сквер.\n\nРазрушения абсолютны: некогда знаменитая площадь превратилась в груду обломков, как и большая часть города. Избитые уцелевшие бродят по улицам в поисках родственников и еды.\n\nХотя в других местах война продолжается, возможно, это был последний вздох сопротивления на северо-востоке Америки."
 cityfall.49.a:0 "Прощай, Америка. Прощай."
 cityfall.49.b:0 "Вива ла Мехико!"
 cityfall.49.c:0 "Сражайтесь, храбрые сыновья и дочери Вашингтона! Сражайтесь!"
 cityfall.50.t:0 "Падение Нью-Йорка"
 cityfall.50.d:0 "Хотя многие ожидали войны между [USA.GetNameDef] и [POL.GetNameDef] Чтобы добраться до континентальной [USA.GetName]Мало кто ожидал [POL.GetAdjective] Солдаты берут наиболее значительные [USA.GetAdjective] Город.\n\n[POL.GetAdjective] Силы, которые осаждали город, нашли способ войти после того, как [POL.GetAdjective] Истребитель, предположительно из-за огня противника, врезался в [USA.GetAdjective] Пикет открыл дыру в обороне города.\n\nПеред тем как [USA.GetAdjective]s может адекватно заполнить пробел, [POL.GetAdjective] Штурмовики заполонили. После боёв в течение большей части дня, они переполнили местных защитников и с тех пор вынудили их покинуть свои дома. [USA.GetAdjective]Вылетает на трассе.\n\n[POL.GetAdjective] В настоящее время силы удерживают город, свесив красно-белое знамя с одной руки Статуи Свободы."
 cityfall.50.a:0 "Куда [POL.GetAdjective] войска отправятся дальше?"
 cityfall.50.b:0 "Мы назовём её Американьски."
 cityfall.50.c:0 "Польша?! ПОЛЬША?!"
 cityfall.51.t:0 "Падение Нью-Йорка"
 cityfall.51.d:0 "После жаркой битвы с местными [USA.GetAdjective] армейские подразделения, [FRA.GetAdjective] Силам удалось захватить Нью-Йорк. Битва, примечательная своими жестокими уличными боями как [USA.GetAdjective]s bled the invading (вторжение) [FRA.GetAdjective] Войска на каждый дюйм земли были урегулированы с большими потерями для обеих сторон, особенно в отношении военных. [FRA.GetAdjective] нападавших, но полностью в их пользу.\n\n[USA.GetAdjective] Больше всего пострадали гражданские лица. Большая часть города теперь является дымящейся руиной. [USA.GetAdjective] Армия использовала каждое здание, канализацию и метро в качестве базы для сдерживания военных действий. [FRA.GetAdjective] Силы.\n\nТолько половина прежнего населения остается в городе через бегство или смерть, но для всех намерений и целей, это теперь. [FRA.GetAdjective]."
 cityfall.51.a:0 "Наполеон гордился бы."
 cityfall.51.b:0 "Прощай, Америка!"
 cityfall.51.c:0 "Сражайтесь! Сражайтесь и никогда не сдавайтесь!"
 cityfall.52.t:0 "Падение Нью-Йорка"
 cityfall.52.d:0 "Продолжая долгую и изнурительную кампанию по континентальной территории [USA.GetName], [CHI.GetAdjective] войска подняли своё знамя над покосившимися остатками Эмпайр-стейт-билдинг. Это лишь одна из множества [USA.GetAdjective] крепостей, павших перед медленным продвижением [CHI.GetAdjective] армии.\n\n[CHI.GetAdjective] танки теперь свободно движутся по улицам Нью-Йорка. Местные партизаны по возможности атакуют линии снабжения, но организованное сопротивление в основном подавлено. Руины некогда величайшего города мира превратились в дымящееся кладбище, а [CHI.GetAdjective] солдаты уже грабят музеи и другие культурные учреждения в поисках трофеев."
 cityfall.52.a:0 "От Токио до Нью-Йорка."
 cityfall.52.b:0 "Славный день для нашей великой страны."
 cityfall.52.c:0 "Мы отбросим [CHI.GetAdjective] войска назад!"
 cityfall.53.t:0 "Падение Нью-Йорка"
 cityfall.53.d:0 "Славные Королевские военно-воздушные силы Великой [BHU.GetAdjective] Свободы превратили жалких защитников Нью-Йорка в фарш, позволив [BHU.GetAdjective] армии спокойно войти в город, где из каждого окна свисают белые флаги.\n\nЖалкий дух [USA.GetAdjective] народа — граждан несуществующей страны, созданной в тщетной попытке отсрочить неизбежное [BHU.GetAdjective] завоевание мира, — окончательно сломлен. [BHU.GetAdjective] штурмовики уже следят, чтобы в городе не осталось никакого сопротивления."
 cityfall.53.a:0 "[BHU.GetNameDefCap] не остановить."
 cityfall.53.b:0 "СЛАВНЫЕ БУТАНСКИЕ ДРАКОНЫ ПОЖИРАЮТ ЖАЛКОЕ ЯБЛОКО."
 cityfall.53.c:0 "Как вы вообще могли это допустить?"
 cityfall.54.t:0 "Падение Стокгольма"
 cityfall.54.d:0 "Сегодня Стокгольм пал перед [USA.GetAdjective] вторжением после того, как [USA.GetAdjective] войска уничтожили последние очаги сопротивления на городских улицах. Последние [SWE.GetAdjective] защитники удерживали несколько позиций, включая Стаден-меллан-бруарна, музей Васа и линию траншей на Юргордене. Дольше всех продержались части в Стокгольмском дворце.\n\nОказавшись запертыми внутри, пока [USA.GetAdjective] войска отказывались обстреливать культурную достопримечательность, защитники капитулировали лишь после того, как отряд [USA.GetAdjective] коммандос проник на нижний этаж и уничтожил находившихся там бойцов.\n\nТеперь, когда [SWE.GetAdjective] сопротивление окончательно подавлено, [USA.GetAdjective] военная машина движется дальше, и многие задаются вопросом, куда именно."
 cityfall.54.a:0 "[USA.GetAdjective] войска ведь не остановятся на этом?"
 cityfall.54.b:0 "Хорошая битва, но лишь разминка."
 cityfall.54.c:0 "[SWE.GetAdjective] народ никогда не сдастся!"
 cityfall.55.t:0 "Падение Стокгольма"
 cityfall.55.d:0 "Хотя и [SWE.GetAdjective] ожесточенное сопротивление против [ITA.GetAdjective] Захватчики, The [SWE.GetAdjective] Военные были вынуждены уступить поле после того, как [ITA.GetAdjective] Силы, обойдя стороной [SWE.GetAdjective] Это стало главной силой и послужило причиной прокладки маршрута через улицы Стокгольма.\n\nМногие защитники остались, горько защищая свой дом и обеспечивая эвакуацию королевской семьи на север. Несмотря на то, что они были успешными, [ITA.GetAdjective]Тем не менее, они преодолели их после нескольких часов согласованных боев.\n\nОстальные члены [SWE.GetAdjective] Военные отказываются сдаваться, но народ устал, а падение столицы - это массовый удар по моральному духу нации."
 cityfall.55.a:0 "Неужели это был последний бой [SWE.GetNameDef]?"
 cityfall.55.b:0 "Славная Италия зайдёт дальше, чем могли мечтать римляне."
 cityfall.55.c:0 "[SWE.GetNameDefCap] никогда не падёт перед таким отребьем."
 cityfall.56.t:0 "Падение Стокгольма"
 cityfall.56.d:0 "[JAP.GetAdjective] Сегодня вооруженные силы разгромили избитых защитников Стокгольма. После нескольких часов непрекращающихся бомбардировок, оставляя большую часть городских памятников и достопримечательностей всего лишь грудами обломков на улицах, [JAP.GetAdjective] Силы вошли в город. Они брутально косили каждый дом и улицу, пока город не стал ясным.\n\n[SWE.GetAdjective] Защитники использовали любую оборону, будь то оставшиеся несколько сооружений или груды обломков, которые теперь доминировали в их когда-то прекрасном городе.\n\nНо время и цифры были на [JAP.GetAdjective] сторона и [SWE.GetAdjective] Они были вынуждены отступить из города или подвергнуться полному уничтожению."
 cityfall.56.a:0 "Восходящее солнце сжигает всё."
 cityfall.56.b:0 "Жалко, что они вообще попытались сопротивляться Восходящему солнцу."
 cityfall.56.c:0 "Храбрые шведы, объединяйтесь, сражайтесь и побеждайте!"
 cityfall.57.t:0 "Падение Стокгольма"
 cityfall.57.d:0 "Несмотря на то, что борьба была ожесточенной вокруг [SWE.GetAdjective] Капитал на лучшую часть недели [SPR.GetAdjective] В конце концов, войска объявили о победе над останками города после того, как ожесточенная битва уничтожила его улицы и большую часть города.\n\nИспуганные члены местного населения были вывезены из своих домов в Сторторгет, где местный командующий [SPR.GetAdjective] Силы выступили с речью о своем новом положении в условиях [SPR.GetAdjective] Правило."
 cityfall.57.a:0 "Кто бы мог подумать, что [SPR.GetAdjective] войска зайдут так далеко."
 cityfall.57.b:0 "Эспанья никогда не остановится!"
 cityfall.57.c:0 "[SWE.GetNameDefCap] не падёт, пока мы отказываемся это признать."
 cityfall.58.t:0 "Падение Стокгольма"
 cityfall.58.d:0 "Несмотря на упорную борьбу с [SWE.GetAdjective] защитников, [ENG.GetAdjective] Силы сумели подавить [SWE.GetAdjective] В Стокгольме и взять город.\n\nХотя сопротивление было ожесточенным в [SWE.GetAdjective] пикеты по всему городу, а [ENG.GetAdjective] Военно-морское вторжение с морскими пехотинцами, принимающими [SWE.GetAdjective] Застигнутые врасплох с моря сумели выбить многих защитников и окончательно разгромить противника. [SWE.GetAdjective] в городе.\n\nс [SWE.GetNameDef] Уходя, остальная часть Скандинавии кажется открытой для [ENG.GetAdjective]И новая база дает [ENG.GetAdjective] Широкий контроль над Балтийским морем. Что это значит для их врагов, еще предстоит выяснить."
 cityfall.58.a:0 "Север пал."
 cityfall.58.b:0 "На восток и только вперёд, сыны Альбиона!"
 cityfall.58.c:0 "Они думают, что с нами покончено, но мы никогда не сдадимся!"
 cityfall.59.t:0 "Падение Стокгольма"
 cityfall.59.d:0 "Хотя шведы и норвежцы в последний раз шли на войну в 1814 году, война оставалась далеко от шведских земель и закончилась тем, что норвежское правительство сдалось шведскому королю Карлу XIV Иоанну.\n\nИстория изменилась теперь, когда [NOR.GetAdjective] Военные успешно преодолели [SWE.GetAdjective] Защитники в Стокгольме взяли город за [NOR.GetNameDef]. Несмотря на то, что борьба была жестокой, [SWE.GetAdjective] Городские власти начали складывать оружие, и [NOR.GetAdjective]Сейчас они работают над тем, чтобы восстановить то, что они могут из поврежденного капитала.\n\nСейчас контролируя крупнейший город Скандинавии, [NOR.GetAdjective]Похоже, что они прочно закрепились в качестве хозяев региона."
 cityfall.59.a:0 "Они только и делают, что воюют друг с другом!"
 cityfall.59.b:0 "Ну и кто теперь король?"
 cityfall.59.c:0 "Проклятые норвежцы!"
 cityfall.60.t:0 "Падение Стокгольма"
 cityfall.60.d:0 "Хотя Швеция много раз воевала за Финляндию, она никогда не воевала против своих восточных братьев. Война между двумя странами сейчас заканчивается в руках народа. [FIN.GetAdjective]которые успешно приняли Стокгольм, несмотря на все попытки [SWE.GetAdjective] Силы.\n\nПо суше и над Аландами, [FIN.GetAdjective] Силы преодолели горечь [SWE.GetAdjective] Защитники, которые прятались в Королевском дворце и через Вальгаллаваген и Оксенстьернсгатан.\n\nХотя гражданские и военные потери были ошеломляющими, флаг Голубого Креста теперь летит из Королевского дворца. [FIN.GetAdjective] Они собираются сделать это со своим новым городом."
 cityfall.60.a:0 "Неожиданный поворот."
 cityfall.60.b:0 "Кто теперь великая нация?"
 cityfall.60.c:0 "Эти вероломные ублюдки!"
 cityfall.61.t:0 "Падение Стокгольма"
 cityfall.61.d:0 "Хотя последняя война между Швецией и Данией закончилась в 1814 году, и в последний раз датчанам удалось выиграть войну против шведов в 1660 году, история идет под откос для Дании с 1523 года, когда Королевство Швеция отделилось от Кальмарского союза и продолжило борьбу с Королевством Дания непрестанно за большую территорию и власть.\n\nЭто было отменено, и впервые за пятьсот лет [DEN.GetAdjective] Успешно вывел город Стокгольм из своего [SWE.GetAdjective] Защитники. Хотя многие ожидали второй Стокгольмской кровавой бани, вторжение было несколько сердечным. [DEN.GetAdjective] Стараясь изо всех сил не вызвать восстание против нового правила. Однако, что [DEN.GetAdjective] Завоевание Скандинавии еще предстоит увидеть."
 cityfall.61.a:0 "Возвращение к Кальмару?"
 cityfall.61.b:0 "Возвращение к Кальмару!"
 cityfall.61.c:0 "Возвращение к Кальмару."
 cityfall.62.t:0 "Падение Стокгольма"
 cityfall.62.d:0 "Поляки и шведы исторически были непримиримыми соперниками, сражавшимися за порты Балтийского моря и господство над прибрежными землями. Королевство Швеция сыграло ключевую роль в уничтожении Речи Посполитой. С того рокового момента различные державы обращались с Польшей не более чем как с фигурой на шахматной доске.\n\nОднако теперь всё иначе: [POL.GetAdjective] войска преодолели оборону Стокгольма и захватили город.\n\n[SWE.GetAdjective] сопротивление остаётся сильным, но [POL.GetAdjective] власти создали суровую оккупационную администрацию, которая железной рукой подавляет любое неповиновение по всему городу."
 cityfall.62.a:0 "[POL.GetNameDefCap] обретает своё истинное предназначение."
 cityfall.62.b:0 "Старые враги, новые подданные."
 cityfall.62.c:0 "Проклятые ляхи!"
 cityfall.63.t:0 "Падение Стокгольма"
 cityfall.63.d:0 "славный [BHU.GetName] Он поднял свой флаг на Стокгольме в своем последнем завоевании. [SWE.GetNameDef].\n\nХотя и [SWE.GetAdjective] готовилась долгая оборона, защитники мало что могли сделать против превосходящих сил противника. [BHU.GetAdjective] Армия, а также [SWE.GetAdjective] Они сдали город.\n\nДаже не потрудившись занять город, [BHU.GetAdjective] Вся территория, старый район и все остальное, вымощены и разрушены, фактически стирая с карты то, что когда-то называлось «Северной Венецией».\n\nХотя резня вызвала широкое осуждение, большинство из них слишком боятся этого. [BHU.GetAdjective] Марш на запад, чтобы сделать многое."
 cityfall.63.a:0 "Какой ужас!"
 cityfall.63.b:0 "БУТАНУ НЕТ ДЕЛА ДО ЖАЛКОЙ СЕВЕРНОЙ ГРУДЫ КАМНЕЙ."
 cityfall.63.c:0 "Эти ублюдки будут уничтожены!"
 cityfall.64.t:0 "Падение Осло"
 cityfall.64.d:0 "Хотя и [NOR.GetAdjective]Пытались сделать хороший показ в защиту своего капитала, калечащие проблемы с поставками и отказ в связи оставили после себя [NOR.GetAdjective] ВВС плохо подготовлены к бою. И только с размахом [GER.GetAdjective] Потери для города аэродром Форнебу был быстро подавлен из-за отсутствия боеприпасов, а после этого и сам Осло.\n\nИз-за [GER.GetAdjective] задержки, то есть [NOR.GetAdjective] Правительству едва удалось эвакуировать королевскую семью, парламент и казну, но в остальном ситуация выглядит мрачной.[NOR.GetAdjective] Силы поклялись вернуть город, но военные только совершили незначительные стычки в попытке противостоять. [NOR.GetAdjective] Военные были проверены."
 cityfall.64.a:0 "Ещё один пример злодеяний [GER.GetNameDef]."
 cityfall.64.b:0 "Ещё один шаг на пути к славе."
 cityfall.64.c:0 "Север выстоит!"
 cityfall.65.t:0 "Падение Осло"
 cityfall.65.d:0 "Швеция вновь сокрушила защитников Норвегии и снова поставила их под свой сапог. Силы [SWE.GetAdjective] армии отбили Осло у [NOR.GetAdjective] защитников.\n\nХотя дороги через восточную Норвегию были хорошо укреплены, сам Осло остался почти беззащитным: перед лицом нарастающего [SWE.GetAdjective] вторжения [NOR.GetAdjective] войска эвакуировали город.\n\nКоролевская семья успела спастись, но вся страна стремительно рушится под натиском [SWE.GetAdjective] армии."
 cityfall.65.a:0 "Война поглотила север."
 cityfall.65.b:0 "Скандинавия вновь станет единой!"
 cityfall.65.c:0 "Мы уже сражались с ними однажды и сделаем это снова."
 cityfall.66.t:0 "Падение Осло"
 cityfall.66.d:0 "Никогда прежде финская армия не уходила так далеко на запад, но... [FIN.GetAdjective] История создавалась как [NOR.GetAdjective] Флаг был сброшен со зданий Осло, и его защитники сдали оружие в руки противника. [FIN.GetAdjective] Нападавшие в массовом порядке.\n\nМало кто ожидал, что [FIN.GetAdjective] Но мало кто сомневается в их растущем доминировании над Скандинавией сейчас. [NOR.GetNameDef] и оттеснен в ее столицу."
 cityfall.66.a:0 "Куда они направятся дальше?"
 cityfall.66.b:0 "[FIN.GetNameDefCap] не знает границ!"
 cityfall.66.c:0 "Мы сражались со [SWE.GetAdjective] войсками и будем сражаться с [FIN.GetAdjective]!"
 cityfall.67.t:0 "Падение Осло"
 cityfall.67.d:0 "Датчане не держали никакой гегемонии над Норвегией в течение сотен лет, но это может измениться сейчас. [DEN.GetAdjective] Солдаты разгромили защитников в Осло во время совместного вторжения на морскую землю.\n\nХотя и [NOR.GetAdjective] Военно-воздушные силы устроили демонстрацию, удерживая [DEN.GetAdjective] Сокращение запасов боеприпасов и топлива означало, что они не могли остановить [DEN.GetAdjective] Посадки и [NOR.GetAdjective] Вскоре после этого сухопутные войска эвакуировали столицу.\n\nЭто возвращение к Кальмарскому союзу?"
 cityfall.67.a:0 "[DEN.GetAdjective] войска лишь возвращают своё."
 cityfall.67.b:0 "Мы вернулись на земли, принадлежащие нам по праву."
 cityfall.67.c:0 "Смерть [DEN.GetAdjective] захватчикам!"
 cityfall.68.t:0 "Падение Ленинграда"
 cityfall.68.d:0 "Ленинград, бывшая столица Российской империи, был оккупирован [FIN.GetAdjective] Силы. С более чем тремя миллионами жителей город имеет почти столько же жителей, сколько и жители. [FIN.GetNameDef]Но этот факт не сдерживает [FIN.GetAdjective] Войска.\n\nЕсть некоторые споры о том, должен ли город быть интегрирован. [FIN.GetNameDef] Ингерманландские финны составляют значительное меньшинство в регионах за пределами города. Это, конечно, предполагает, что Красная Армия не сможет отбить город в контрнаступлении."
 cityfall.68.a:0 "Значительное событие."
 cityfall.68.b:0 "Наша судьба свершилась: [SOV.GetAdjective] медведь дрожит перед мощью [FIN.GetAdjective] армии!"
 cityfall.68.c:0 "Мы победили их в 1809 году и сделаем это снова!"
 cityfall.69.t:0 "Падение Лондона"
 cityfall.69.desc:0 "Когда-то сердце Британской империи, гордый город Лондон теперь опустошён огнем. [new_controller.GetAdjective] Подразделения берут под контроль оставшиеся мосты над Темзой.[old_controller.GetAdjective] Войска яростно защищали город. Однако фланговый маневр и вызванное огнем отвлечение дестабилизировали их позиции, сделав ситуацию для них несостоятельной, и им пришлось отступить.\n\nЛондон сейчас находится в [new_controller.GetAdjective] Руки и их флаг можно увидеть над различными городскими памятниками."
 cityfall.69.a:0 "Борьба ещё не окончена!"
 cityfall.69.b:0 "Великая победа!"
 cityfall.69.c:0 "Война принимает неожиданный оборот."
 cityfall.70.t:0 "Падение Оттавы"
 cityfall.70.desc:0 "В Новом Свете происходят перемены: Оттава, некогда политический центр Канады, захвачена авангардом [new_controller.GetAdjective] армии. Спустя несколько часов в город начали прибывать подкрепления, и вскоре он был полностью оккупирован.\n\n[old_controller.GetAdjective] войска эвакуировались, надеясь перегруппироваться и подготовить контратаку."
 cityfall.70.a:0 "Борьба ещё не окончена!"
 cityfall.70.b:0 "Великая победа!"
 cityfall.70.c:0 "Война принимает неожиданный оборот."
 cityfall.71.t:0 "Падение Берлина"
 cityfall.71.desc:0 "Симпатизирующие [old_controller.GetRulingParty] Они остаются безмолвными, так как весть о падении Берлина распространяется по всему миру. The [new_controller.GetAdjective] Артиллерия организовала колоссальный залп, в то время как другие части постепенно окружали город. Один за другим Потсдам, Панков, Марзан, Мариендорф и другие пригороды начали подпадать под [new_controller.GetAdjective] Контроль.\n\nСцепления наступавших войск все больше и больше оказывали давление на центр города. [new_controller.GetAdjective] Силы продвинулись вдоль главных проспектов города, таких как Унтер-дер-Линден и Курфюрстендамм. Наконец, [old_controller.GetAdjective] Сопротивление лопнуло, и [new_controller.GetAdjective] Он взял под свой контроль рейхсканцелярию и оперу Кролла."
 cityfall.71.a:0 "Борьба ещё не окончена!"
 cityfall.71.b:0 "Великая победа!"
 cityfall.71.c:0 "Война принимает неожиданный оборот."
 cityfall.72.t:0 "[new_controller.GetAdjective] войска входят в Рио-де-Жанейро!"
 cityfall.72.desc:0 "\nБелый песок знаменитого пляжа Копакабана был испорчен красным из-за тяжелых боев в Рио-де-Жанейро. The [new_controller.GetAdjective] Наступление было сосредоточено на городе и имело целью захватить оба входа в Гуанабарский залив. Это объясняет, почему боевые действия были особенно ожесточенными вокруг Нитероя.\n\nThe [old_controller.GetAdjective] Защитники постепенно отступали, пока все бои не прекратились, и город считался полностью контролируемым войсками. [new_controller.GetAdjective] вооруженных сил."
 cityfall.72.a:0 "Борьба ещё не окончена!"
 cityfall.72.b:0 "Великая победа!"
 cityfall.72.c:0 "Война принимает неожиданный оборот."
 cityfall.73.t:0 "[new_controller.GetAdjective] войска входят в Буэнос-Айрес!"
 cityfall.73.desc:0 "\nВопреки своему названию воздух Буэнос-Айреса теперь наполнен запахом пепла, крови, горелого дерева и нефти. Недавнее [new_controller.GetAdjective] наступление завершилось захватом города и устья Рио-де-ла-Платы.\n\n[old_controller.GetAdjective] командующий поклялся однажды вернуться и смыть позор кровью врагов. Однако сейчас именно [new_controller.GetAdjective] солдаты празднуют достигнутый успех и получают немного заслуженного отдыха."
 cityfall.73.a:0 "Борьба ещё не окончена!"
 cityfall.73.b:0 "Великая победа!"
 cityfall.73.c:0 "Война принимает неожиданный оборот."
 cityfall.74.t:0 "[new_controller.GetAdjective] вооружённые силы входят в Мехико!"
 cityfall.74.desc:0 "\n[old_controller.getNameDefCap] Теперь он находится на заднем сиденье, как [new_controller.GetAdjective] Войска охраняли Мехико. Как и [old_controller.GetAdjective] Силы не могли удерживать свои позиции перед возрастающим давлением противника. [new_controller.GetAdjective] Подразделения отступили, чтобы занять новые позиции в горах.\n\n[old_controller.GetLeader] Он заявил, что война не закончилась и что борьба за независимость [MEX.GetNameDef] Это должно продолжаться."
 cityfall.74.a:0 "Борьба ещё не окончена!"
 cityfall.74.b:0 "Великая победа!"
 cityfall.74.c:0 "Война принимает неожиданный оборот."
 cityfall.75.t:0 "[new_controller.GetAdjective] части входят в Дели"
 cityfall.75.desc:0 "\nЖемчужина Индостана, Дели, пала перед наступающими силами [new_controller.GetNameDef].\n\nНе в силах сдержать продвижение врага, солдаты [old_controller.GetNameDef] отступили. Однако городская инфраструктура резко отличалась от окружающей сельской местности, и множество раненых пришлось оставить. Они попали в плен к [new_controller.GetAdjective] частям."
 cityfall.75.a:0 "Борьба ещё не окончена!"
 cityfall.75.b:0 "Великая победа!"
 cityfall.75.c:0 "Война принимает неожиданный оборот."
 cityfall.76.t:0 "[new_controller.GetNameDefCap] захватывает Панамский канал"
 cityfall.76.desc:0 "\n\nВ дерзком рейде, [new_controller.GetAdjective] Силам удалось занять Панамский канал. Ранее в [old_controller.GetAdjective] Контроль, операция разозлила [old_controller.GetLeader]. Это событие также окажет огромное влияние на циркуляцию судов между Атлантическим и Тихим океанами.\n\nЕсть еще риск контратаки, и если она не сможет обеспечить свое завоевание, [new_controller.GetNameDef] Он может взорвать ворота канала и сделать их бесполезными."
 cityfall.76.a:0 "Борьба ещё не окончена!"
 cityfall.76.b:0 "Великая победа!"
 cityfall.76.c:0 "Война принимает неожиданный оборот."
 cityfall.77.t:0 "[new_controller.GetAdjective] вооружённые силы входят в регион [797.GetName]"
 cityfall.77.desc:0 "\nВорота Востока находятся под [new_controller.GetAdjective] Контроль как армия [new_controller.GetLeader] взял под свой контроль город [797.GetName].\n\nЭто колоссальный удар для правительства. [old_controller.GetLeader]. Тем не менее, [old_controller.GetAdjective] В коммюнике поражение было определено как «временная неудача», добавив, что сопротивление захватчику должно продолжаться. Падение города также может иметь более серьезные последствия, поскольку это позволит [new_controller.GetNameDef] Контроль доступа к Черному морю. В настоящее время, [new_controller.GetAdjective] Солдаты могут отпраздновать свое завоевание, посетив величественную Софию. Надеемся, что его архитектура не пострадала от боевых действий."
 cityfall.77.a:0 "Борьба ещё не окончена!"
 cityfall.77.b:0 "Великая победа!"
 cityfall.77.c:0 "Война принимает неожиданный оборот."
 cityfall.78.t:0 "[new_controller.GetAdjective] вооружённые силы входят в Токио"
 cityfall.78.desc:0 "\n«Восточная столица», сердце Японии, находится под угрозой исчезновения. [new_controller.GetAdjective] Контроль. Необходимо было приложить значительные усилия для обеспечения безопасности города. [old_controller.GetAdjective] Стрелок.\n\nThe [new_controller.GetAdjective] Правительство объявило, что каждый гражданин обязан праздновать эту победу над своими врагами.\n\nМежду тем, [old_controller.GetAdjective] Правительство пообещало освободить город от иностранного гнета и уничтожить его. [new_controller.GetAdjective] Захватчики."
 cityfall.78.a:0 "Борьба ещё не окончена!"
 cityfall.78.b:0 "Великая победа!"
 cityfall.78.c:0 "Война принимает неожиданный оборот."
 cityfall.79.t:0 "Москва пала перед [new_controller.GetAdjective] войсками"
 cityfall.79.desc:0 "\n[new_controller.GetAdjective] армия кажется неудержимой: подобно Наполеону в своё время, она вошла в Москву. На окраинах сопротивление было ожесточённым, а отдельные районы пришлось брать улицу за улицей. Тем не менее решительный штурм позволил [new_controller.GetAdjective] войскам захватить Кремль. В ходе боёв были обнаружены тайные тоннели, доказывающие, что [old_controller.GetAdjective] власти готовились к возможному бегству уже недели, если не месяцы.\n\nХотя для [new_controller.GetLeader] это значительный трофей, Россия необъятна, и некоторые задаются вопросом, не повторится ли унизительное отступление, подобное кампании 1812 года."
 cityfall.79.a:0 "Борьба ещё не окончена!"
 cityfall.79.b:0 "Великая победа!"
 cityfall.79.c:0 "Война принимает неожиданный оборот."
 cityfall.80.t:0 "Рим пал перед [new_controller.GetAdjective] войсками"
 cityfall.80.desc:0 "\nThe [new_controller.GetAdjective] Армия побеждает, когда они входят в вечный город. The [old_controller.GetAdjective]Они установили оборонительные линии, известные под кодовыми именами Цезарь С и Рим Свитч за пределами города, чтобы избежать повреждения огромного культурного наследия столицы. Таким образом, быстрое продвижение [new_controller.GetAdjective] Войска обогнали их раньше. [old_controller.GetAdjective] Резервы могли бы укрепить свои позиции. Небольшая группа [old_controller.GetAdjective] Защитники довели борьбу до горького конца внутри Витториано и министерства авиации. Кроме того, [new_controller.GetNameDef] Также было получено официальное письмо о капитуляции от чиновников Ватикана.\n\nКогда боевые действия, наконец, прекращаются, по всему городу возвращается тишина."
 cityfall.80.a:0 "Борьба ещё не окончена!"
 cityfall.80.b:0 "Великая победа!"
 cityfall.80.c:0 "Война принимает неожиданный оборот."
 cityfall.81.t:0 "[new_controller.GetAdjective] части входят в Будапешт"
 cityfall.81.desc:0 "\nГолубой Дунай меняет цвет, поскольку жестокая битва разрушает город-близнец Будапешт. Буда и Пешт были разделены, так как мосты на Дунае были разрушены. [old_controller.GetAdjective] Защитники. The [new_controller.GetAdjective] Победа очевидна, но ущерб, нанесенный городу, потребует времени на ремонт."
 cityfall.81.a:0 "Борьба ещё не окончена!"
 cityfall.81.b:0 "Великая победа!"
 cityfall.81.c:0 "Война принимает неожиданный оборот."
 cityfall.82.t:0 "Падение Претории"
 cityfall.82.desc:0 "\nРазруха войны достигает вершины Африки, как [new_controller.GetAdjective] Вооруженные силы обеспечили безопасность города Претория. Критическая проблема в [old_controller.GetAdjective] Защитники утверждают, что вельд не предлагал никаких природных особенностей, облегчающих создание оборонительного периметра. Вместо этого они были поражены [new_controller.GetAdjective] Наступление и оставление города."
 cityfall.82.a:0 "Борьба ещё не окончена!"
 cityfall.82.b:0 "Великая победа!"
 cityfall.82.c:0 "Война принимает неожиданный оборот."
 cityfall.83.t:0 "Падение Афин"
 cityfall.83.desc:0 "\nРазруха войны достигла Афин как [new_controller.GetAdjective] Подразделения охраняли город и изгоняли [old_controller.GetAdjective] Защитники. Длинные стены прошлого не помогли бы [old_controller.GetAdjective] Мрамор и камень не защитят от современных бомб и снарядов. Загнанные в угол наступлением противника и не желающие во второй раз рискнуть уничтожить Парфенон в отчаянном бою, последние карманы защитников рассеялись или сдались противнику."
 cityfall.83.a:0 "Борьба ещё не окончена!"
 cityfall.83.b:0 "Великая победа!"
 cityfall.83.c:0 "Война принимает неожиданный оборот."
 cityfall.84.t:0 "Падение Парижа"
 cityfall.84.desc:0 "Некогда считавшийся центром европейской культуры и моды, Париж теперь поглощён войной. Ожесточённые бои в городской черте нанесли серьёзный ущерб множеству исторических памятников, включая Пале-Рояль и собор Парижской Богоматери: [new_controller.GetAdjective] войска широко применяли артиллерию в отчаянной попытке захватить город.\n\nХотя Париж уже находится в руках врага и [new_controller.GetAdjective] части маршируют среди обгоревших руин Елисейских Полей, многим [old_controller.GetAdjective] защитникам удалось скрыться в катакомбах. Сейчас они берегут скудные запасы для продолжения партизанской борьбы."
 cityfall.84.a:0 "Борьба ещё не окончена!"
 cityfall.84.b:0 "Великая победа!"
 cityfall.84.c:0 "Война принимает неожиданный оборот."
 cityfall.85.t:0 "[new_controller.GetAdjective] части входят в Бангкок"
 cityfall.85.desc:0 "Противоречивые слухи, давно ходившие среди [old_controller.GetAdjective] жителей Бангкока, наконец подтвердились: городская радиостанция официально сообщила о падении столицы [old_controller.GetNameDef].\n\nПо словам очевидцев, защитники Большого дворца были вынуждены отступить под сокрушительным огнём [new_controller.GetAdjective] солдат, которые также захватили здания местной администрации и полицейские участки. Это серьёзно подорвало боевой дух и активность оставшихся в городе [old_controller.GetAdjective] частей. Неужели это конец [old_controller.GetNameDef]?"
 cityfall.85.a:0 "Борьба ещё не окончена!"
 cityfall.85.b:0 "Великая победа!"
 cityfall.85.c:0 "Война принимает неожиданный оборот."
 cityfall.86.t:0 "[new_controller.GetAdjective] части входят в Стокгольм"
 cityfall.86.desc:0 "\n[old_controller.GetAdjective] граждане охвачены смятением: Стокгольм захвачен вторгшимися [new_controller.GetAdjective] солдатами. Некоторые батальоны, защищавшие остров Старого города, оказывали упорное сопротивление, взрывая мосты и возводя баррикады, однако захват Слуссена сделал положение защитников всё более безнадёжным.\n\nБитва за Стокгольм завершена, и [new_controller.GetLeader], несомненно, празднует успех операции."
 cityfall.86.a:0 "Борьба ещё не окончена!"
 cityfall.86.b:0 "Великая победа!"
 cityfall.86.c:0 "Война принимает неожиданный оборот."
 cityfall.87.t:0 "[new_controller.GetAdjective] части входят в Осло"
 cityfall.87.desc:0 "\n[old_controller.GetAdjective] армия отступает, оставляя жителей Осло без защиты, пока [new_controller.GetAdjective] солдаты закрепляются в городе. Когда орудия умолкли, город накрыла странная пелена тишины и страха. Хотя [old_controller.GetAdjective] правительство обещает сражаться с захватчиками до самого конца, потеря города стала тяжелейшим ударом для [old_controller.GetNameDef].\n\nБои пока продолжаются, но всё больше людей задаются одним вопросом: «Надолго ли?»"
 cityfall.87.a:0 "Борьба ещё не окончена!"
 cityfall.87.b:0 "Великая победа!"
 cityfall.87.c:0 "Война принимает неожиданный оборот."
 cityfall.88.t:0 "[new_controller.GetAdjective] части входят в Боготу"
 cityfall.88.desc:0 "\n[old_controller.GetAdjective] армия, казалось, находилась на грани полного разгрома, когда отступила из Боготы и оставила город наступающим [new_controller.GetAdjective] войскам. Это поражение подорвало авторитет [old_controller.GetLeader], однако [old_controller.GetAdjective] правительство всё же обещает продолжать сопротивление до самого конца. Несмотря на это заявление, очевидно, что [old_controller.GetNameDef] оказалась в тяжёлом положении."
 cityfall.88.a:0 "Борьба ещё не окончена!"
 cityfall.88.b:0 "Великая победа!"
 cityfall.88.c:0 "Война принимает неожиданный оборот."
 cityfall.89.t:0 "Дублин пал перед [new_controller.GetAdjective] войсками"
 cityfall.89.desc:0 "\n[old_controller.GetAdjective] армия, казалось, находилась на грани полного разгрома, когда отступила из Дублина и оставила город наступающим [new_controller.GetAdjective] войскам. Это поражение подорвало авторитет [old_controller.GetLeader]. Однако [old_controller.GetAdjective] правительство всё же обещает продолжать сопротивление до самого конца, заявляя, что не откажется от независимости, завоёванной после столетий иностранной оккупации. Несмотря на это заявление, очевидно, что [old_controller.GetNameDef] оказалась в тяжёлом положении."
 cityfall.89.a:0 "Борьба ещё не окончена!"
 cityfall.89.b:0 "Великая победа!"
 cityfall.89.c:0 "Война принимает неожиданный оборот."
 cityfall.90.t:0 "Падение Каракаса"
 cityfall.90.desc:0 "Каракас, в последние годы широко известный как столица нефтяного экспорта, пал перед [new_controller.GetAdjective] войсками. В городе развернулись жестокие бои за каждый дом, но после продолжительного сражения [old_controller.GetLeader] был вынужден приказать отступить.\n\nЭто поражение, несомненно, поставило [old_controller.GetNameDef] в отчаянное положение. Однако [old_controller.GetLeader] ясно дал понять, что намерен сопротивляться до самого конца, какой бы ни оказалась цена."
 cityfall.91.t:0 "Падение Баку"
 cityfall.91.desc:0 "Баку, один из крупнейших центров нефтедобычи в мире, пал перед [new_controller.GetAdjective] войсками. Отчаянно пытаясь защитить этот важнейший ресурс, [old_controller.GetAdjective] солдаты сражались до последнего человека.\n\nЛишившись обильных запасов чёрного золота, [old_controller.GetNameDef] будет гораздо труднее продолжать войну."
 cityfall.92.t:0 "Падение региона [217.GetName]"
 cityfall.92.desc:0 "С захватом региона [217.GetName] наступающие [new_controller.GetAdjective] силы овладели крупным промышленным центром. Несмотря на ожесточённые бои, особенно за железнодорожный вокзал и тракторный завод, город наконец оказался под полным контролем.\n\nПотеря важнейшего железнодорожного узла и возможности безопасно использовать Волгу может предвещать скорое падение [old_controller.GetNameDef]."
 cityfall.93.t:0 "Падение региона [195.GetName]"
 cityfall.93.desc:0 "Нева была запятнана кровью из-за жестоких боев, охвативших город. [195.GetName]. Победитель [new_controller.GetAdjective] Теперь подразделения должны очистить баррикады, возведенные отчаявшимися. [old_controller.GetAdjective] Защитники. Многие из них [old_controller.GetAdjective] Силы отступили, но некоторые пытались продолжить борьбу изнутри штаба армии, адмиралтейства и Петропавловской крепости. Однако, несмотря на взаимную поддержку этих позиций, они не были предназначены для противостояния современному оружию.\n\nНовый день и новый флаг теперь летят над городом, флаг, изношенный в боях, показывает [new_controller.GetAdjective] господство над городом."
 cityfall.94.t:0 "Падение Лос-Анджелеса"
 cityfall.94.desc:0 "Ворота рая открылись для многих жителей Лос-Анджелеса, поскольку Золотой штат кажется краснее, чем когда-либо. Жестокая осада, наложенная [new_controller.GetAdjective] Вооруженные силы нанесли огромный ущерб по всему заливу, и несколько районов города и его пригородов были уничтожены огнем. Если [old_controller.GetAdjective] Войска сильно пострадали, новые хозяева города унаследовали факел разорения; Они должны проверить, смогут ли они сохранить и отремонтировать участок."
 cityfall.95.t:0 "Падение Тегерана"
 cityfall.95.desc:0 "Ожесточённые бои и уличная война опустошили крупнейший город Ближнего Востока — Тегеран. Над руинами дворцового комплекса Саадабад поднимается дым: артиллерия разрушила его после того, как оставшиеся [old_controller.GetAdjective] защитники отказались сдаться силам [new_controller.GetNameDef].\n\nХотя в районе Тегеранского базара и вокруг него всё ещё слышны выстрелы, [new_controller.GetAdjective] чиновники уже объявили о победе в битве за город. Над дворцом Голестан развеваются [new_controller.GetAdjective] флаги, знаменуя наступление нового порядка в регионе."
 cityfall.96.t:0 "Падение Севастополя"
 cityfall.96.desc:0 "Ожесточённые бои и уличная война опустошили крупнейший город Крыма и военно-морскую базу Севастополь. Над всем заливом поднимается дым. Массированные артиллерийские обстрелы разрушили укрепления, а взрыв склада боеприпасов заставил самых упорных [old_controller.GetAdjective] защитников сложить оружие и сдаться победоносным силам [new_controller.GetNameDef].\n\nХотя кое-где всё ещё слышны отдельные выстрелы, [new_controller.GetAdjective] чиновники уже объявили о захвате города. Над остатками укреплений развеваются [new_controller.GetAdjective] флаги, ясно показывая уцелевшим жителям, кто теперь здесь хозяин."
 cityfall.97.t:0 "Падение Гибралтара"
 cityfall.97.desc:0 "Ситуация в Средиземном море вот-вот радикально изменится, так как скала Гибралтара находится сейчас под контролем государства. [new_controller.GetAdjective] вооруженных сил. Теперь, контролируя ситуацию, артиллерия была немедленно настроена на огонь по потенциально враждебным кораблям, проходящим через пролив, блокируя доступ для нежелательного флота, за исключением, возможно, подводных лодок. С другой стороны, [old_controller.GetAdjective] Военно-морской флот потерял жизненно важное положение при входе в Средиземное море."
 cityfall.98.t:0 "Падение Сиднея"
 cityfall.98.desc:0 "После захвата региона [285.GetName] [new_controller.GetAdjective] силы прочно закрепились на австралийской земле. Густой чёрный дым от горящего топлива накрыл залив и медленно распространяется по городу. Последует ли вскоре за ним вся Австралия, или [old_controller.GetAdjective] армия сумеет перейти в контрнаступление и сбросить захватчиков обратно в море?"
 cityfall.99.t:0 "Мадрид пал!"
 cityfall.99.desc:0 "Уже пострадавший от гражданской войны регион [41.GetName] вновь оказался под военным контролем после того, как [new_controller.GetAdjective] силы захватили город. [old_controller.GetAdjective] войска разгромлены и эвакуируются, оставляя подготовленные позиции в парке Оэсте.\n\nОставшиеся пожарные пытаются потушить пылающие разрушенные кварталы."
 cityfall.101.t:0 "[new_controller.GetAdjective] части захватили Вену!"
 cityfall.101.desc:0 "[new_controller.GetAdjective] власти с гордостью объявили всему миру, что их вооружённые силы успешно захватили Вену. Новая администрация разместилась в уцелевшем крыле дворца Шёнбрунн, откуда открывается вид на остатки садов, вырубленных местными жителями за последние месяцы борьбы.\n\nОставшиеся защитники [old_controller.GetNameDef] забаррикадировались в подвалах ратуши, а в районах Леопольдштадт и Зиммеринг продолжаются ожесточённые уличные бои. [old_controller.GetLeader] выступил по радио, подчеркнув, что битва за город ещё не окончена и её исход остаётся неопределённым."
 cityfall.102.t:0 "Падение Пекина"
 cityfall.102.d:0 "После неудачного налёта на японский штаб у линии фронта китайцы понесли огромные потери. Чтобы избежать новых жертв, китайский командующий приказал войскам отступить из Пекина. Позднее японская армия вошла в город, встретив лишь незначительное сопротивление.\n\nСообщается, что японцы вывезли из Запретного города некоторые артефакты. К счастью, большую их часть ещё в 1933 году эвакуировали на юг, поэтому японцам достались лишь несколько больших бронзовых чанов и несколько пушек."
 cityfall.103.t:0 "[new_controller.GetAdjective] части входят в Улан-Батор"
 cityfall.103.desc:0 "\nСогласно коммюнике, [new_controller.GetAdjective] Вооружённые силы, солдаты обеспечили безопасность главного города Монголии Улан-Батаара. Потерпев поражение, он [old_controller.GetAdjective] Правительство эвакуировало свое гражданское присутствие в превентивном порядке и, несмотря на эту неудачу, оно было вынуждено покинуть свои дома. [old_controller.GetLeader] Они, конечно же, хотят вернуться в город."
 cityfall.105.t:0 "[new_controller.GetAdjective] части захватили Иерусалим"
 cityfall.105.desc:0 "Согласно сообщениям из [new_controller.GetAdjective] Генералы, солдаты [new_controller.GetAdjective] Армия захватила большую часть Иерусалима, в том числе исторический Старый город.\n\nБоевые действия вблизи святых мест Старого города были сведены к минимуму обеими сторонами. [new_controller.GetAdjective] Войска прошли через Дамасские ворота, [old_controller.GetAdjective] Генералы призвали к полному отступлению из города.\n\n[old_controller.GetLeader] В эфире национального радио было объявлено, что борьба еще не закончена и что стратегический Священный город снова будет в их руках."
 cityfall.106.t:0 "[new_controller.GetAdjective] части захватили Боготу"
 cityfall.106.desc:0 "Согласно сообщениям из [new_controller.GetAdjective] Военные, войска из [new_controller.GetAdjective] Армия вошла в Богоду, взяв под свой контроль весь город.\n\nСпорадические снайперы вызывали возмущение в течение нескольких часов после ликвидации последнего бастиона [old_controller.GetAdjective] Сопротивление вокруг площади Боливар."
