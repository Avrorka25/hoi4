 linguist_trait_chance_factor:0 "Шанс завербовать оперативника с чертой §HЛингвист§!"
 upgrade_linguistic_training:0 "Лингвистическая подготовка"
 linguistic_training_enabled_tt:0 "Шанс завербовать оперативника с чертой §YЛингвист§!: §G+100%§!\nШанс оперативника с чертой §YЛингвист§! получить новую национальность после успешной миссии: §G+50%§!\nОперативник с чертой §YЛингвист§! начнёт со случайной национальностью великой державы, соседней страны или страны, находящейся с вами в состоянии войны."
