l_russian:
 operative_skill_3:0 "Специальный агент"
 operative_skill_4:0 "Совершенно секретный агент"
 r56_spying_event.1.t:0 "Иностранные агенты присоединяются к нам"
 r56_spying_event.1.desc:0 "Правительства рушатся, а шпионы остаются. Желая служить прежнему делу, они решили присоединиться к нам и теперь готовы приступить к работе."
 r56_spying_event.1.a:0 "Ещё один день в тени."
 r56_spying_event.2.t:0 "[ROOT.GetAgency] рекомендует необычного кандидата"
 r56_spying_event.2.desc:0 "\nНаше разведывательное агентство заметило потенциально интересного кандидата. Хотя особыми навыками он не отличается, его прошлое может сделать его ценным активом. Он служил офицером в австро-венгерской армии, работал в Бразилии в 1920-х и начале 1930-х годов, а затем вернулся в Германию."
 r56_spying_event.2.a:0 "Нанять его."
 r56_spying_event.2.b:0 "Предпочтительнее был бы более умелый кандидат."
 r56_spying_event.3.t:0 "Семён Семёнов окончил MIT"
 r56_spying_event.3.desc:0 "После нескольких лет учёбы в Соединённых Штатах агент Семёнов стал «бобром», окончив MIT — так там называют бывших студентов. Теперь он готов действовать в стране под видом инженера. Во время учёбы он завязал связи в научных кругах и должен суметь проникнуть в тайны новейших американских разработок."
 r56_spying_event.3.a:0 "Отлично, товарищ!"
 r56_spying_event.4.t:0 "Илие Кэтэрэу возвращается"
 r56_spying_event.4.desc:0 "После многих лет странствий по миру, во время которых он, по собственным словам, даже стал королём полинезийского племени, Илие Кэтэрэу вернулся в страну. Уже участвовавший в некоторых операциях в Венгрии в 1914 году, он отказался присягать Молдове после провозглашения её независимости. Этот человек с чрезвычайно насыщенной биографией, возможно, ещё добавит к ней не одну главу..."
 r56_spying_event.4.a:0 "Отлично!"
 r56_spying_event.5.t:0 "Завербованы коммунистические агенты"
 r56_spying_event.5.desc:0 "Верные делу революции новые рекруты готовы служить в тени."
 r56_spying_event.6.t:0 "Завербованы коммунистические агенты"
 r56_spying_event.6.desc:0 "Верные делу революции новые рекруты готовы служить в тени."
 r56_spying_event.7.t:0 "Атакованы [ROOT.getAdjective] офицеры!"
 r56_spying_event.7.desc:0 "Офицеры, близкие к одному из наших командиров, пострадали в результате скоординированной террористической атаки. Страна желает выжившим скорейшего выздоровления. Тем временем местному офицерскому штабу придётся продолжать работу без нескольких ключевых сотрудников, пока им не найдут замену."
 lar_operative_event.7.t:0 "Секретная миссия завершена"
 lar_operative_event.7.desc:0 "Наши оперативники завершили миссию. Контакты с кураторами установлены, отчёты составляются. Агенты будут готовы приступить к новым операциям в кратчайшие сроки."
 lar_operative_event.7.a:0 "Засекретить эту папку."
 lar_operative_event.8.t:0 "Спасательная миссия завершена"
 lar_operative_event.8.desc:0 "Наши оперативники завершили миссию по спасению пленённого союзного агента. Контакты с кураторами установлены, отчёты составляются. Агенты будут готовы приступить к новым операциям в кратчайшие сроки."
 lar_operative_event.9.t:0 "Миссия завершена: администрация внедрена"
 lar_operative_event.9.desc:0 "\nУстановив связи с готовыми к сотрудничеству служащими, наши агенты из [ROOT.GetAgency] сумели создать сеть контактов внутри иностранного бюрократического аппарата."
 lar_operative_event.10.t:0 "Секретная миссия завершена: внедрение в иностранные вооружённые силы"
 lar_operative_event.10.desc:0 "\nУстановив связи с легко поддающимися влиянию солдатами и офицерами, наши агенты из [ROOT.GetAgency] сумели проникнуть в структуру иностранного военного командования."
 lar_operative_event.11.t:0 "Секретная миссия завершена: внедрение в иностранный флот"
 lar_operative_event.11.desc:0 "\nУстановив связи с легко поддающимися влиянию моряками и офицерами, наши агенты из [ROOT.GetAgency] сумели проникнуть в командную структуру иностранного флота."
 lar_operative_event.12.t:0 "Секретная миссия завершена: внедрение в иностранные ВВС"
 lar_operative_event.12.desc:0 "\nУстановив связи с легко поддающимися влиянию пилотами и механиками, наши агенты из [ROOT.GetAgency] сумели проникнуть в командную структуру иностранных военно-воздушных сил."
 lar_operative_event.13.t:0 "Секретная миссия завершена: сторонники усилены"
 lar_operative_event.13.desc:0 "\nНаши оперативники завершили миссию. Были установлены связи с сочувствующими и склонёнными на нашу сторону чиновниками. Им переданы оружие и деньги, чтобы обеспечить политическое влияние, когда наступит час расплаты. Это ещё один успех [ROOT.GetAgency]."
 lar_operative_event.14.t:0 "Секретная миссия завершена: шифр захвачен"
 lar_operative_event.14.desc:0 "\nПоследний проект [ROOT.GetAgency] по захвату иностранных шифров завершён. Полученные данные анализируются с целью взлома их криптографических систем."
 lar_operative_event.15.t:0 "Секретная миссия завершена: подброшены ложные сведения"
 lar_operative_event.15.desc:0 "\nПоследний проект [ROOT.GetAgency] по введению противника в заблуждение с помощью ложной разведывательной информации завершён."
 lar_operative_event.16.t:0 "Секретная миссия завершена: начат переворот"
 lar_operative_event.16.desc:0 "\nАгенты [ROOT.GetAgency] сумели спровоцировать идеологически мотивированное восстание среди иностранных сторонников [ROOT.GetRulingIdeologyNoun]."
 lar_operative_event.17.t:0 "Секретная миссия завершена: бойцы сопротивления снабжены"
 lar_operative_event.17.desc:0 "\n[ROOT.GetAgency] снабдило партизан стрелковым оружием и взрывчаткой, чтобы активизировать их действия и по возможности спровоцировать всеобщее восстание."
 lar_operative_event.18.t:0 "Секретная миссия завершена: установлены связи с группами сопротивления"
 lar_operative_event.18.desc:0 "\nСтремясь усилить деятельность партизан за рубежом, [ROOT.GetAgency] связалось с руководителями сопротивления для координации совместных действий."
 lar_operative_event.19.t:0 "Секретная миссия завершена: спланирован скоординированный удар"
 lar_operative_event.19.desc:0 "\n[ROOT.GetAgency] совместно с нашими вооружёнными силами задокументировало позиции противника, чтобы внезапная атака на его объекты нанесла максимальный ущерб."
 lar_operative_event.20.t:0 "Секретная миссия завершена: получена инновационная технология"
 lar_operative_event.20.desc:0 "\nНаши агенты вернулись с хорошими новостями: [ROOT.GetAgency] удалось через зарубежные сети получить элементы важнейшей инновационной технологии."
 lar_operative_event.21.t:0 "Секретная миссия завершена: завод саботирован"
 lar_operative_event.21.desc:0 "\nЧтобы ослабить экономический потенциал врага, оперативники [ROOT.GetAgency] заложили взрывчатку на ключевом заводе и нанесли ему значительный ущерб."
 lar_operative_event.22.t:0 "Секретная миссия завершена: добыча ресурсов саботирована"
 lar_operative_event.22.desc:0 "\nЧтобы ослабить экономический потенциал врага, оперативники [ROOT.GetAgency] повредили его мощности по добыче ресурсов."
 lar_operative_event.23.t:0 "Секретная миссия завершена: военная технология похищена"
 lar_operative_event.23.desc:0 "\nВоенные инновации способны дать решающее преимущество на поле боя, сохранить множество наших жизней и заставить врага терять свои. Поэтому [ROOT.GetAgency] внедрилось в иностранные военно-промышленные компании, чтобы получить техническую информацию об их новейшем экспериментальном вооружении."
 lar_operative_event.24.t:0 "Секретная миссия завершена: военно-морская технология похищена"
 lar_operative_event.24.desc:0 "\nВоенные инновации способны дать решающее преимущество в борьбе на морях. Верное своей миссии служить [ROOT.GetNameDef], [ROOT.GetAgency] внедрилось в иностранный флот, чтобы получить информацию из первых рук о закупках военно-морского вооружения."
 lar_operative_event.25.t:0 "Секретная миссия завершена: получена авиационная технология"
 lar_operative_event.25.desc:0 "\nАвиационные инновации способны дать решающее преимущество, перенося смертоносность прошлых войн в небо. Верное своей миссии служить [ROOT.GetNameDef], [ROOT.GetAgency] внедрилось в иностранную военную авиацию, чтобы получить информацию из первых рук о развитии авиационных закупок."
 lar_operative_event.26.t:0 "Секретная миссия завершена: инфраструктура саботирована"
 lar_operative_event.26.desc:0 "\nЧтобы ослабить экономический потенциал врага, оперативники [ROOT.GetAgency] повредили его коммуникационную инфраструктуру."
 r56_spying_event.9.t:0 "Умелый рекрут"
 r56_spying_event.9.desc:0 "Кандидата рекомендовали инструкторы [ROOT.GetAgency]. Его навыки проникновения были описаны как «почти магические», а перед тем как яростно наброситься на своего инструктора во время, хочется надеяться, учебной атаки, он продемонстрировал некоторые актёрские способности. В его досье указано, что сначала он пытался стать пилотом, но не смог из-за повреждения одного глаза. Прочитав это, вербовщик, как сообщается, сказал: «Летать тебе не дано, глупец!» Инструкторы также заметили одну странность: перед нападением на кого-либо он часто кричит «Ан гард!», чем сильно раздражает товарищей."
 r56_spying_event.9.a:0 "Хорошо, сохраним это в тайне."
 r56_spying_event.10.t:0 "[GER.getAdjective] планы на Америки"
 r56_spying_event.10.desc:0 "Были найдены документы, предположительно забытые немецким дипломатом. Среди бумаг ограниченной ценности оказалась карта, показывающая немецкие планы по перекройке границ Южной Америки. Это показывает, насколько далеко готовы зайти [GER.getLeader] и [GER.getNameDef]. Кроме того, это явная угроза нашим интересам в Южной Америке."
 r56_spying_event.10.a:0 "Возмутительно!"
 r56_spying_event.11.t:0 "Созданы разведывательные сети сопротивления"
 r56_spying_event.11.desc:0 "Национальное сопротивление постепенно разрастается и становится всё организованнее. Ему удалось создать сложные разведывательные сети. Это значительно увеличило потенциал наших разведывательных служб."
 r56_spying_event.11.a:0 "Мы победим оккупантов!"
 upgrade_expanded_departments:0 "Расширенные отделы"
 upgrade_r56_home_guard:0 "Гражданская внутренняя гвардия"
 upgrade_r56_home_guard_desc:0 "§LВнутренняя гвардия может стать важным инструментом нашего отдела контрразведки. Патриотично настроенные граждане способны затруднить сбор информации вражескими агентами и сообщать о подозрительных лицах.\n \n «Если видишь что-то подозрительное — сообщи»§!"
 upgrade_r56_civilian_signal_corp:0 "Гражданский корпус наблюдения"
 upgrade_r56_civilian_signal_corp_desc:0 "§LМы можем привлекать гражданских пилотов и рыбаков, чтобы закрывать пробелы в отечественном морском и воздушном патрулировании, помогая обнаруживать и, возможно, отпугивать вражеские разведывательные миссии до того, как они получат полезные сведения.§!"
