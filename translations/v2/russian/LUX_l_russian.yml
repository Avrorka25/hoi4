l_russian:
 luxembourg_tree:0 "Люксембургское древо национальных фокусов"
 LUX_support_arbed:0 "Поддержать ARBED"
 LUX_support_arbed_desc:0 "ARBED — относительно молодая компания, но она уже подаёт большие надежды. Поддержка столь перспективного предприятия наверняка окупится в долгосрочной перспективе."
 LUX_nationalise_railway_companies:0 "Национализировать железнодорожные компании"
 LUX_nationalise_railway_companies_desc:0 "Наша железнодорожная сеть почти полностью находится в частной собственности. Это очевидная угроза безопасности, поскольку в случае войны государство не сможет контролировать жизненно важную транспортную отрасль."
 LUX_establish_national_labour_council:0 "[GetStrikeFocusName]"
 LUX_establish_national_labour_council_desc:0 "Вопрос социальной справедливости стоит в Люксембурге особенно остро. Рабочие известны своими левыми взглядами, и уступки их требованиям могут наконец успокоить недовольство. Однако тем самым мы пойдём навстречу социалистам и коммунистам."
 LUX_focus_autocompletion_tt:0 "Этот фокус будет §Hавтоматически пропущен в начале 1937 года§!.\n"
 strike_demands_accepted_tt:0 "Будет принят закон о §HНациональном совете труда§!.\n\nЭто повлияет на нашу §Hбудущую политику§!."
 delayed_nlc_tt:0 "Принятие закона о §HНациональном совете труда§! будет вновь отложено.\n\nЭто повлияет на нашу §Hбудущую политику§!."
 LUX_revert_worker_immigration:0 "Вернуть ограничения на трудовую иммиграцию"
 LUX_revert_worker_immigration_desc:0 "Великая депрессия ударила по Люксембургу слабее, чем по другим странам, главным образом благодаря политике приоритетного найма люксембургских граждан и даже возвращения иностранных рабочих в страны происхождения. Продолжение этого курса поможет Люксембургу удержаться на плаву в мире, который лишь начинает восстанавливаться после Великой депрессии."
 LUX_strengthen_agricultural_industry:0 "Укрепить сельское хозяйство"
 LUX_strengthen_agricultural_industry_desc:0 "Несмотря на индустриализацию страны за последнее столетие, значительная часть Люксембурга всё ещё зависит от сельского хозяйства и создаваемых им рабочих мест. Поэтому укрепление первичного сектора экономики несомненно необходимо."
 LUX_repair_belgian_relations:0 "Восстановление бельгийских отношений"
 LUX_repair_belgian_relations_desc:0 "Исторически Люксембург был наиболее близок к Нидерландам, тогда как отношения с соседней Бельгией оставались напряжёнными. Бельгийско-Люксембургский экономический союз несколько улучшил положение, но мы способны развить это партнёрство ещё сильнее."
 LUX_begin_election_preparations:0 "Начать предвыборный сезон"
 LUX_begin_election_preparations_tt:0 "Чем раньше фокус будет завершён, тем §Hбольше времени§! останется в §HПалате депутатов§!."
 LUX_begin_election_preparations_desc:0 "Следующие выборы назначены на июнь 1937 года. Стабильность страны, избирательная система и важность нынешнего момента позволяют политикам начать кампании заранее."
 LUX_unlock_chamberofdeputies_tt:0 "Открывает §HПалату депутатов§!"
 LUX_the_maulkuerfgesetz:0 "Закон Маулькорфгезетц"
 LUX_the_maulkuerfgesetz_tt:0 "Этот фокус будет §Hавтоматически пропущен§! после §Hзавершения выборов§!.\nПринятие §Hзакона Маулькорфгезетц§! §Rзначительно усилит фашистские силы§! в стране."
 LUX_the_maulkuerfgesetz_desc:0 "Джозеф Бех пытался ограничить влияние коммунистов с самого начала своей победы на выборах. Новейшим из этих усилий является закон Maulkuerfgesetz, направленный на запрещение любой партии, которая стремится насильственно изменить конституцию. Если этот закон будет принят, он фактически запретит КПЛ, Коммунистическую партию Люксембурга."
 LUX_maulkuerfgesetz_passed_tt:0 "§HЗакон Маулькорфгезетц§! будет §Gпринят§!."
 LUX_maulkuerfgesetz_didnt_pass_tt:0 "На референдуме §Hзакон Маулькорфгезетц§! §Rне будет принят§!."
 LUX_maulkuerfgesetz_passed:0 "Закон Маулькорфгезетц принят"
 LUX_elections_over:0 "Выборы завершены"
 LUX_appoint_new_prime_minister:0 "Назначить нового премьер-министра"
 LUX_appoint_new_prime_minister_desc:0 "Выборы завершены, победитель объявлен. Новому правительству предстоит управлять страной несколько лет, поэтому переход власти должен пройти как можно спокойнее."
 LUX_the_dupong_ministry:0 "Кабинет Дюпона"
 LUX_the_dupong_ministry_desc:0 "После отставки Жозефа Беша перед новым кабинетом во главе с Пьером Дюпоном стоит сложная задача сохранить стабильность последних десятилетий. Пожелаем им удачи!"
 LUX_elections_PD_winner:0 "§HPD§! победила на выборах"
 LUX_liberal_victory:0 "Либеральный факел сияет ярко"
 LUX_liberal_victory_desc:0 "Либеральные партии всегда играли заметную роль в политике Люксембурга. Они входили в состав правительств, включая последнее, но никогда не получали большинства. Сегодня всё изменилось! ПРЛ станет превосходной правящей партией."
 LUX_elections_PRL_winner:0 "§HPRL§! победила на выборах"
 LUX_first_social_democratic_government:0 "Первое социал-демократическое правительство"
 LUX_first_social_democratic_government_desc:0 "ЛСАП — старая партия, однако она всегда оставалась в оппозиции, даже получая более четверти всех голосов. После недавнего успеха на выборах партия наконец смогла возглавить правительство."
 LUX_elections_LSAP_winner:0 "§HLSAP§! победила на выборах"
 LUX_begin_workers_revolution:0 "Начать рабочую революцию"
 LUX_begin_workers_revolution_desc:0 "Наконец ожидание окончено! Все попытки подавить волю народа оказались напрасны — социализм торжествует в Люксембурге! Мы избавимся от пережитков прошлого и поведём страну к светлому социалистическому будущему."
 LUX_elections_KPL_winner:0 "§HKPL§! победила на выборах"
 LUX_invalidate_election:0 "Аннулировать выборы"
 LUX_invalidate_election_desc:0 "Выборы обернулись катастрофой. Конституция позволяет великой герцогине аннулировать их результаты и самостоятельно определить выход из кризиса. Мы должны воспользоваться этим и позволить нашей любимой герцогине решить, что лучше для Люксембурга."
 LUX_invalidate_election_trigger_tt:0 "Явка избирателей ниже §H20,0%§!"
 LUX_contest_election_results:0 "Оспорить результаты выборов"
 LUX_elections_indecisive:0 "Результаты выборов не дали победителя"
 LUX_contest_election_results_desc:0 "Люксембург — немецкая земля, и его народ это знает! Следовательно, очевидно, что выборы были сфальсифицированы ради сохранения видимости «демократии». Мы должны захватить власть и наконец заставить даже последнего жителя осознать свою принадлежность к германскому миру!"
 LUX_maintain_status_quo:0 "Сохранить статус-кво"
 LUX_maintain_status_quo_desc:0 "Многие политические эксперты ожидали иного исхода выборов, однако консерваторы и либералы удержали позиции. Будем надеяться на спокойную передачу власти и быстрое формирование правительства, чтобы Люксембург как можно скорее вновь оказался в надёжных руках знакомого кабинета."
 LUX_socialist_victory:0 "Победа социалистов"
 LUX_socialist_victory_desc:0 "Провал закона Маулькорфгезетц и блестящая избирательная кампания социалистов принесли им заслуженную победу. Для Люксембурга действительно начинается новая эпоха!"
 LUX_finalise_government_formation:0 "Завершить формирование правительства"
 LUX_finalise_government_formation_desc:0 "Правительство сформировано, а передача власти завершена. Пришло время официально объявить избирательный период оконченным."
 LUX_finalise_government_formation_tt:0 "Закрывает решения §HМинистерств§!."
 LUX_expand_farm_subsidies:0 "Расширить сельскохозяйственные субсидии"
 LUX_expand_farm_subsidies_desc:0 "Сельское хозяйство всегда было жизненно важной отраслью Люксембурга, особенно на севере страны. Поддержка фермеров субсидиями вполне разумна, поэтому её следует расширить."
 LUX_strengthen_rural_communities:0 "Укрепить сельские общины"
 LUX_strengthen_rural_communities_desc:0 "Урбанизация XIX века привела многие сельские общины к бедности и долгам. Мы должны остановить этот процесс и вновь уделить внимание деревням, оставленным позади индустриализацией."
 LUX_invigorate_mining:0 "Оживить горнодобывающую промышленность"
 LUX_invigorate_mining_desc:0 "К сожалению, Люксембург зависит от импорта железа и Бельгийско-Люксембургского экономического союза для снабжения отечественной промышленности, особенно сталелитейной. Поэтому нам необходима собственная горнодобывающая отрасль."
 LUX_another_declaration_of_neutrality:0 "Подтвердить нейтралитет"
 LUX_another_declaration_of_neutrality_desc:0 "Поскольку мир находится в ненадежном состоянии, мы должны идти по пути и поддерживать то, что наиболее выгодно для нашей дальнейшей независимости."
 LUX_reaffirm_treaty_of_london:0 "Подтвердить Лондонский договор"
 LUX_reaffirm_treaty_of_london_desc:0 "Лондонский договор 1867 года принёс нашей стране немалую пользу. Мы должны добиться, чтобы все подписавшие стороны продолжали его соблюдать!"
 LUX_renegotiate_trade_agreements:0 "Пересмотреть торговые соглашения"
 LUX_renegotiate_trade_agreements_desc:0 "Чтобы снизить нашу экономическую зависимость от других стран, мы должны начать инициативу по пересмотру наших торговых соглашений с нашими соседями."
 LUX_science_funding:0 "Увеличить финансирование науки"
 LUX_science_funding_desc:0 "Вложения в науку — это вложения в будущее. Увеличение финансирования повысит эффективность исследований и приведёт государство [ROOT.GetNonIdeologyName] к прогрессу."
 LUX_policy_of_free_hands:0 "Политика свободных рук"
 LUX_policy_of_free_hands_desc:0 "Мы должны любой ценой сохранять независимость, даже если ради этого придётся заключать сделки с фашистами или коммунистами."
 LUX_ban_international_aid:0 "Запретить международную помощь"
 LUX_ban_international_aid_desc:0 "Наш полный нейтралитет должен оставаться нерушимым. Если мы позволим вмешиваться в дела других стран, это покажет отсутствие приверженности нейтралитету. Поэтому подобную помощь необходимо запретить заранее."
 LUX_increase_border_security:0 "Усилить охрану границ"
 LUX_increase_border_security_desc:0 "Мы должны предотвращать любые действия, которые могут быть расценены как агрессивные. Это включает запрет охоты в приграничных районах и общее усиление пограничного патрулирования."
 LUX_control_radio_transmissions:0 "Контролировать все радиопередачи"
 LUX_control_radio_transmissions_desc:0 "Запрет гражданских радиопередач упростит координацию армии. Кроме того, это повысит безопасность, поскольку иностранные державы не смогут использовать радио для пропаганды или военных действий."
 LUX_oust_socialists_trigger_tt:0 "В правительстве нет §Hсоциалистов§!."
 LUX_demonstrate_our_will:0 "Продемонстрировать нашу волю"
 LUX_demonstrate_our_will_desc:0 "Наша страна имеет долгую историю сопротивления и упорства. Мы пережили попытки культурной ассимиляции и сохранили гордую национальную идентичность. Позаботимся о том, чтобы так было и впредь!"
 LUX_oust_socialists:0 "Изгнать социалистов"
 LUX_oust_socialists_desc:0 "Закон Маулькорфгезетц расколол общество. Социалисты активно распространяют свою программу и подрывают национальное единство. Этому необходимо как можно скорее положить конец."
 LUX_commemorate_independence:0 "Отпраздновать независимость"
 LUX_commemorate_independence_desc:0 "Мы — гордый народ с великой историей. Если что-то и объединяет страну, то это общее стремление оставаться свободными от иностранного господства."
 LUX_continue_the_fight:0 "Продолжить борьбу"
 LUX_continue_the_fight_desc:0 "Мы потерпели поражение, но борьба ещё не окончена. Мы обязаны любой ценой освободить свою землю!"
 LUX_peace_in_our_times:0 "Мир в наше время"
 LUX_peace_in_our_times_desc:0 "Мир царит уже долгое время, и непосредственной угрозы нашей прекрасной стране, похоже, нет. Теперь можно ослабить оборонительные меры."
 LUX_future_of_europe:0 "Будущее Европы"
 LUX_future_of_europe_desc:0 "Европа сильнее всего, когда едина. Как сердце континента, именно мы должны стать источником этого объединения."
 LUX_privatisation_drive:0 "Чем свободнее экономика..."
 LUX_privatisation_drive_desc:0 "Приход либерального правительства наконец позволил проводить реформы, расширяющие свободу рынка и граждан. Ведь чем свободнее рынок, тем свободнее люди."
 LUX_open_border_agreements:0 "Заключить соглашения об открытых границах"
 LUX_open_border_agreements_desc:0 "Зависимость от других стран слишком долго преследовала государство [ROOT.GetNameDef]. Мы должны воспользоваться возможностью и заключить новые торговые соглашения на более выгодных условиях импорта и экспорта."
 LUX_lower_taxes:0 "Снизить налоги"
 LUX_lower_taxes_desc:0 "Никто не станет спорить, что снижение налогов полезно для людей. Оно ускоряет экономический рост и сокращает бедность — несомненная победа для народа!"
 LUX_academy_of_science:0 "Основать академию наук"
 LUX_academy_of_science_desc:0 "Чтобы сохранять научное превосходство, необходимо вкладываться в исследования и разработки. Новая академия поможет нам в этом."
 LUX_abandon_neutrality:0 "Отказаться от нейтралитета"
 LUX_abandon_neutrality_desc:0 "Состояние мира ясно показывает, что государство [ROOT.GetNonIdeologyName] больше не может оставаться нейтральным. Мы должны как можно скорее начать перевооружение."
 LUX_seek_protection:0 "Искать защиты"
 LUX_seek_protection_desc:0 "Любая угроза государству [ROOT.GetNonIdeologyName] быстро подавит нашу армию. Крайне важно заручиться поддержкой другой страны, способной нас защитить!"
 LUX_begin_rearmament:0 "Начать перевооружение"
 LUX_begin_rearmament_desc:0 "Если мы хотим пережить надвигающуюся бурю, необходимо обратить вспять десятилетия разоружения."
 LUX_research_cooperation:0 "Научное сотрудничество"
 LUX_research_cooperation_desc:0 "Исследовательские партнёрства заметно ускоряют инновации. Объединив усилия, мы добьёмся настоящих чудес науки и инженерии."
 LUX_join_allies:0 "Вступить в Союзники"
 LUX_join_allies_desc:0 "Государство [ROOT.GetNameDef] слишком долго оставалось в одиночестве. Теперь мы присоединимся к европейским демократиям и поможем им в борьбе против фашизма и коммунизма."
 LUX_extend_maginot:0 "Продлить линию Мажино"
 LUX_extend_maginot_desc:0 "Будучи крупнейшей системой укреплений Европы, линия Мажино обеспечит нам защиту от угроз с востока."
 LUX_british_funding:0 "Британское военное финансирование"
 LUX_british_funding_desc:0 "Британская армия относится к числу самых современных в мире. Заручившись её поддержкой, мы несомненно повысим свои шансы на победу."
 LUX_arms_purchases:0 "Закупить вооружение"
 LUX_arms_purchases_desc:0 "Из-за демобилизованной промышленности у нас не было времени произвести необходимое оружие. К счастью, союзники готовы помочь."
 LUX_preventive_intervention:0 "Превентивное вмешательство"
 LUX_preventive_intervention_desc:0 "Мы знаем, к чему приводят экстремистские идеологии. Необходимо действовать сейчас, прежде чем они успеют нанести удар первыми."
 LUX_benelux_alliance:0 "Альянс Бенилюкса"
 LUX_benelux_alliance_desc:0 "Мы станем сильнее, заключив союз с ближайшими партнёрами в Нижних Землях. Вместе мы сможем противостоять вторжению, не попадая под влияние западных великих держав."
 LUX_decentralised_alliance:0 "Децентрализовать альянс"
 LUX_decentralised_alliance_desc:0 "Каждая страна сильна в чём-то своём. Мы можем воспользоваться этими различиями и специализировать каждого участника Бенилюкса."
 LUX_unified_command:0 "Создать единое командование"
 LUX_unified_command_desc:0 "Поскольку оборона отвечает интересам всех союзников, нам придётся тесно сотрудничать в этом вопросе."
 LUX_liberate_lowlands:0 "Освободить Нижние Земли"
 LUX_liberate_lowlands_desc:0 "Наше стремление объединить Нижние Земли ещё не осуществлено. Пришло время завершить объединение."
 LUX_expand_the_customs_union:0 "Расширить таможенный союз"
 LUX_expand_the_customs_union_desc:0 "Бельгийско-Люксембургский экономический союз оказался выгоден всем сторонам. Следует заключить подобное соглашение внутри альянса Бенилюкса."
 LUX_joint_economic_development:0 "Совместное экономическое развитие"
 LUX_joint_economic_development_desc:0 "Объединённая промышленность обладает огромной мощью, но мы редко извлекаем выгоду из предприятий других стран. Совместная инвестиционная программа исправит это."
 LUX_united_and_ready:0 "Едины и готовы"
 LUX_united_and_ready_desc:0 "Вместе мы сильнее, вместе мы готовы ко всему!"
 LUX_strike_the_german_threat:0 "Забастовка [GER.GetAdjectiveCap] Угроза"
 LUX_strike_the_german_threat_desc:0 "Государство [GER.GetNameDefCap] слишком долго угрожало Нижним Землям. Мы нанесём удар первыми и навсегда избавимся от угрозы вторжения."
 LUX_resisted_federalisation:0 "Сопротивлялось федерализации"
 LUX_regional_development:0 "Региональное развитие"
 LUX_regional_development_desc:0 "Мы столкнулись с первыми ограничениями экономики: развитых земель для строительства заводов попросту недостаточно. Теперь освоение таких территорий станет приоритетом."
 LUX_dreams_of_federation:0 "Мечты о федерации"
 LUX_dreams_of_federation_desc:0 "Выйдя из относительной безвестности, мы получили шанс совершить нечто поистине великое — объединить Нижние Земли в одно государство!"
 LUX_merge_industries:0 "Объединить промышленность"
 LUX_merge_industries_desc:0 "Земли нового государства слишком долго были разделены. Необходимо вновь объединить их промышленность, чтобы страна действительно стала единым целым."
 LUX_fortify_border_regions:0 "Укрепить приграничные регионы"
 LUX_fortify_border_regions_desc:0 "Нас окружают потенциальные угрозы. На всякий случай следует подготовиться к вторжению."
 LUX_establish_free_university:0 "Бесплатное начальное образование"
 LUX_establish_free_university_desc:0 "Новый масштаб экономики позволяет обеспечить бесплатное начальное образование для всех."
 LUX_agressive_stance:0 "Агрессивная внешняя политика"
 LUX_agressive_stance_desc:0 "Хотя основные государства Нижних Земель объединены, за пределами наших границ всё ещё живёт немало людей, желающих присоединиться к новой стране. Их необходимо вновь собрать вместе."
 LUX_establish_european_claims:0 "Заявить европейские притязания"
 LUX_establish_european_claims_desc:0 "Мы — европейская нация, а многие наши соплеменники в Европе находятся под властью иностранных держав. Мы освободим их и присоединим к новому государству."
 LUX_announce_colonial_claims:0 "Объявить колониальные притязания"
 LUX_announce_colonial_claims_desc:0 "Нидерланды и Бельгия долго оставались в тени великих держав. Теперь, когда мы сами можем претендовать на этот статус, следует распространить влияние за океан."
 LUX_greater_benelux:0 "Великая федерация Бенилюкса"
 LUX_restore_neutrality:0 "Восстановить нейтралитет"
 LUX_restore_neutrality_desc:0 "Мы добились желаемого и теперь можем вернуться к нейтралитету, зная, что способны защитить себя."
 LUX_total_neutrality:0 "Установить полный нейтралитет"
 LUX_total_neutrality_desc:0 "Если мы действительно привержены нейтралитету, нельзя ограничиваться полумерами. Следует объявить полный нейтралитет, чтобы избежать нападения."
 LUX_fair_economy:0 "Справедливая экономика"
 LUX_fair_economy_desc:0 "Исход выборов определили многие обездоленные граждане. Мы должны учитывать их интересы и сделать экономику справедливее, чтобы сохранить поддержку избирателей и просто поступить правильно."
 LUX_promote_small_businesses:0 "Поддержать малый бизнес"
 LUX_promote_small_businesses_desc:0 "Крупные корпорации не нуждаются в нашей помощи. Поэтому следует сосредоточиться на небольших предприятиях и помочь им удержаться на плаву."
 LUX_expand_social_net:0 "Расширить систему социальной защиты"
 LUX_expand_social_net_desc:0 "Помощь нуждающимся не только возвращает больше людей в экономику, но и пользуется широкой поддержкой."
 LUX_ensure_minimum_wage:0 "Гарантировать минимальную зарплату"
 LUX_ensure_minimum_wage_desc:0 "Минимальная заработная плата обеспечивает людям уверенность в доходах, стабилизирует экономический рост и помогает всему обществу."
 LUX_legislative_reforms:0 "Законодательные реформы"
 LUX_legislative_reforms_desc:0 "Наконец-то у нас есть возможность изменить конституцию в пользу пролетариата, чтобы они получили возможность формировать будущее. [ROOT.GetNonIdeologyName]."
 LUX_abolish_monarchy:0 "Упразднить монархию"
 LUX_abolish_monarchy_desc:0 "Призраки прошлого слишком долго преследовали страну. Монархия была одним из главных препятствий на пути к истинному равенству, и теперь мы от неё избавимся."
 LUX_erase_monarchist_legacy:0 "Стереть монархическое прошлое"
 LUX_erase_monarchist_legacy_desc:0 "Монархии всегда угнетали пролетариат и воплощают всё, против чего мы выступаем. Пришло время окончательно уничтожить их наследие."
 LUX_grant_citizenship:0 "Даровать членам династии гражданство"
 LUX_grant_citizenship_desc:0 "Хотя они тысячелетиями несправедливо правили страной, им следует дать шанс интегрироваться в социалистическое общество."
 LUX_socialist_volunteers:0 "Социалистические добровольцы"
 LUX_socialist_volunteers_desc:0 "Социализм — не просто национальное движение: наши идеи охватывают континенты и все классы. Вместе нас не остановить."
 LUX_lessons_from_spain:0 "Поддержать испанское дело"
 LUX_lessons_from_spain_desc:0 "Мы достойно сражались в гражданской войне в Испании и теперь можем использовать накопленный опыт для защиты собственной страны."
 LUX_begin_collective_ownership_campaign_tt:0 "Через §H2 года§! этот национальный дух будет §Hулучшен§! до:"
 LUX_find_new_trade_partners_tt:0 "Этот национальный дух будет §Hудалён§!, когда у нас будет §G15§! §Hфабрик§!."
 LUX_find_new_trade_partners_autarky_tt:0 "Через §H1 год§! этот национальный дух будет §Hзаменён§! на:"
 LUX_oust_capitalists:0 "Изгнать капиталистов"
 LUX_oust_capitalists_desc:0 "Капитализм угнетает рабочих, укрепляет автократию и порождает классовые конфликты. Мы должны положить этому конец."
 LUX_elevate_trade_unions:0 "Возвысить профсоюзы"
 LUX_elevate_trade_unions_desc:0 "Профсоюзы государства [ROOT.GetNameDef] долго боролись за права рабочих. Их вклад в революцию должен быть признан и вознаграждён."
 LUX_begin_collective_ownership_campaign:0 "Начать коллективизацию"
 LUX_begin_collective_ownership_campaign_desc:0 "Как говорил сам Маркс, средства производства должны перейти в руки пролетариата. Теперь, когда пролетариат управляет страной, он должен взять под контроль и экономику."
 LUX_struggle_for_equality:0 "Борьба за равенство"
 LUX_struggle_for_equality_desc:0 "Ни одна победа не даётся легко. То же касается и стремления к подлинному равенству. Ради достижения этой цели нам придётся упорно бороться!"
 LUX_find_new_trade_partners:0 "[GetCommunistTradePartnerFocusName]"
 LUX_find_new_trade_partners_desc:0 "Чтобы раз и навсегда избавиться от экономической зависимости, мы должны найти способы самостоятельно производить сырьё или заключить более выгодные торговые соглашения."
 LUX_peoples_university:0 "Основать Народный университет"
 LUX_peoples_university_desc:0 "Образование долгое время оставалось сферой, где господствовала буржуазия. Мы исправим это, создав академию для народа и силами самого народа."
 LUX_unite_the_country:0 "Объединить страну"
 LUX_unite_the_country_desc:0 "Благодаря политике последних лет мы наконец можем назвать страну единой. Теперь народ сплочён социалистической рабочей революцией!"
 LUX_abandon_the_foolish_policy:0 "Отказаться от глупой политики"
 LUX_abandon_the_foolish_policy_desc:0 "Нейтралитет совершенно неуместен в мире конфликтов и классовой борьбы. Эта политика прошлого лишь помешает процветанию государства [ROOT.GetNameDef] и его народа."
 LUX_european_revolution:0 "Продвигать европейскую революцию"
 LUX_european_revolution_desc:0 "Мы находимся в сердце Европы, а теперь станем и сердцем европейской революции."
 LUX_follow_moscow_line:0 "Следовать московской линии"
 LUX_follow_moscow_line_desc:0 "Истинный социализм достижим лишь в сотрудничестве с Интернационалом. Мы должны ориентироваться на [SOV.capital.GetCapitalVictoryPointName], чтобы воплотить социализм."
 LUX_expand_conscription_tt:0 "Изменяет §HПолитизированную армию§! или §H[ROOT.GetAdjectiveCap]ую Красную армию§!:\nВоеннообязанное население: §H+1,50%§!"
 LUX_revolutionise_army:0 "Революционизировать армию"
 LUX_revolutionise_army_desc:0 "Чтобы надёжно удерживать армию под контролем, необходимо встроить её в нашу идеологическую систему."
 LUX_incorporate_political_comissars:0 "Ввести политических комиссаров"
 LUX_incorporate_political_comissars_desc:0 "Как часть государственного аппарата армия также должна служить социализму. Её верность обеспечат политические комиссары на должностях в вооружённых силах."
 LUX_true_red_army:0 "Настоящая Красная армия"
 LUX_true_red_army_desc:0 "Главная задача армии — защищать народ, социализм и международную революцию."
 LUX_expand_conscription:0 "Расширить призыв"
 LUX_expand_conscription_desc:0 "Революция должна уметь защищать себя, а для этого ей нужно больше людей. Ради общего дела стоит призвать часть рабочей силы."
 LUX_expand_benelux_trigger_tt:0 "Является §HСоциалистическим союзом Бенилюкса§!"
 LUX_found_secret_service:0 "Основать тайную службу"
 LUX_found_secret_service_desc:0 "Следуя примеру великого союзника — государства [SOV.GetNameDef], — мы создадим собственную тайную полицию, чтобы обеспечить долговечность революции."
 LUX_expand_via_capabilities:0 "Расширить возможности VIA"
 LUX_expand_via_capabilities_desc:0 "Необходимо дать VIA достаточно средств, чтобы она могла надёжно нейтрализовать угрозы международной революции."
 LUX_invade_benelux:0 "Вторгнуться в Бенилюкс"
 LUX_invade_benelux_desc:0 "Будучи малой страной, мы не сумеем защитить себя, если не расширимся и не создадим наднациональное образование."
 LUX_bring_revolution_south:0 "Принести революцию на юг"
 LUX_bring_revolution_south_desc:0 "Государство [FRA.GetNameDef] постоянно угрожает нашей независимости. Теперь оно будет сокрушено и приведено в Интернационал."
 LUX_head_east:0 "Двинуться на восток"
 LUX_head_east_desc:0 "Государство [GER.GetNameDefCap] будет освобождено от угнетающего правительства, чтобы его народ наконец обрёл свободу."
 LUX_expand_benelux:0 "Расширить наш союз"
 LUX_expand_benelux_desc:0 "Государство, рождённое из многообразия, естественным образом способно включать новые земли. Мы интегрируем некоторые завоёванные территории."
 LUX_socialist_science:0 "Стать первопроходцами социалистической науки"
 LUX_socialist_science_desc:0 "Наука станет новым рубежом, ведущим народ к светлому социалистическому будущему. Капиталистическое прошлое должно остаться позади."
 LUX_comintern_research_exchange:0 "Научный обмен Коминтерна"
 LUX_comintern_research_exchange_desc:0 "Коммунизм — международная идеология, и его сторонники вместе создают нечто большее, чем способен каждый по отдельности. Для учёных это особенно полезно."
 LUX_adopt_soviet_policies:0 "Усыновить [SOV.GetAdjectiveCap] Политика"
 LUX_adopt_soviet_policies_desc:0 "Прежний председатель партии препятствовал сближению с Коминтерном и принятию его курса. При новом председателе это изменится."
 LUX_follow_destalinisation:0 "Следовать десталинизации"
 LUX_follow_destalinisation_desc:0 "Новый курс очевиден: необходимо отказаться от всей сталинской политики прошлого. После смерти Сталина государство [ROOT.GetNameDef] также примет это изменение."
 LUX_establish_personality_cult:0 "Создать культ личности"
 LUX_establish_personality_cult_desc:0 "Великий лидер [ROOT.GetNonIdeologyName] Они будут гордиться тем, что они сделали с этим великим народом."
 LUX_increase_defense_production:0 "Увеличить оборонное производство"
 LUX_increase_defense_production_desc:0 "Поскольку страна почти беззащитна, для нашего дальнейшего существования жизненно важно развивать оборонную инфраструктуру."
 LUX_bastion_of_antifascism:0 "Бастион антифашизма"
 LUX_bastion_of_antifascism_desc:0 "Государство [ROOT.GetNameDefCap] всегда было местом смешения разных идеологий и политических движений. Мы пойдём дальше и открыто призовём антифашистских добровольцев прибыть в государство [ROOT.GetNonIdeologyName] и помочь нашим вооружённым силам."
 LUX_lead_the_opposition:0 "Возглавить оппозицию"
 LUX_lead_the_opposition_desc:0 "То, чего нам не хватает в объединении, мы компенсируем решимостью! Международная оппозиция против [SOV.capital.GetCapitalVictoryPointName] Теперь мы объединимся, чтобы свергнуть [SOV.GetAdjectiveCap] Гегемония."
 LUX_destroy_stalinism:0 "Уничтожить сталинизм"
 LUX_destroy_stalinism_desc:0 "Сталин — фашист, и обращаться с ним следует соответственно. Мы должны объединиться и устранить угрозу, которую сталинизм представляет для международного социалистического движения."
 LUX_attack_alliance_francaise:0 "Атаковать «Альянс Франсез»"
 LUX_attack_alliance_francaise_desc:0 "Альянс Франсез - это инструмент, который подрывает нашу [GER.GetAdjectiveCap] Язык и родословная. Его нужно остановить."
 LUX_raid_french_stores:0 "Разгромить французские магазины"
 LUX_raid_french_stores_desc:0 "Этой страной управляют аристократы, которых поддерживают. [FRA.GetNameDef]. Если мы уничтожим их базу власти, [FRA.GetAdjectiveCap] Мы также можем ожидать, что магазины и предприятия подорвут власть слабого правительства."
 LUX_rejuvenate_the_luxembourgish_identity:0 "Возродить национальную идентичность"
 LUX_rejuvenate_the_luxembourgish_identity_desc:0 "Если [LUX.GetNameDef] Чтобы сохраниться и жить дальше, мы должны возродить [LUX.GetAdjective] национальное самосознание, как без четкого [LUX.GetAdjective] национальной идентичности, не было бы [LUX.GetNonIdeologyName] И то и другое!"
 LUX_rejuvenate_the_luxembourgish_identity_tt:0 "Изменяет §HАнтифранцузские настроения§! или §HОбщелюксембургские общества§!:\nСтабильность: §G+5,00%§!\nЕжедневная поддержка демократии: §R-0,02§!\n\n"
 LUX_fully_counter_french_influence:0 "Полностью Counter [FRA.GetAdjectiveCap] влияние"
 LUX_fully_counter_french_influence_desc:0 "Чтобы сохранить наш народ, [FRA.GetAdjectiveCap] Влияние не приветствуется, поскольку оно подрывает идентичность нашей страны в целом.[LUX.GetNonIdeologyName] это [GER.GetAdjectiveCap]!"
 LUX_integrate_french_organisations:0 "интегрировать [FRA.GetAdjectiveCap] Организации"
 LUX_integrate_french_organisations_desc:0 "Несмотря на то, что эти организации являются инструментом [FRA.GetAdjectiveCap]Эта страна должна признать важность того, что [FRA.GetAdjectiveCap] Язык был в нашей истории и культуре."
 LUX_found_lnp:0 "Основать LNP"
 LUX_found_lnp_desc:0 "Чтобы заручиться политической поддержкой и признанием, движению необходимо политическое крыло. Создание партии поможет добиться этих целей."
 LUX_request_german_funding:0 "Просьба [GER.GetAdjectiveCap] Финансирование"
 LUX_request_german_funding_desc:0 "Поскольку вскоре мы станем частью государства [GER.GetNameDef], получение средств поможет ускорить объединение."
 LUX_utilise_lvj:0 "Поддержать LVJ"
 LUX_utilise_lvj_desc:0 "Luxemburger Volksjugend или просто Volksjugentd — это клуб следующего поколения добрых людей. [GER.GetAdjectiveCap] Дети, готовые сделать шаг вперед ради своего народа. В прошлом у них были большие успехи, тем больше оснований их поддерживать."
 LUX_utilise_dennemeyer:0 "Использовать Деннемейера"
 LUX_utilise_dennemeyer_desc:0 "Камилла Деннемейер — гений пропаганды. Он может сплотить массы и привести их в соответствие. Его опыт жизненно важен для объединения страны под единым руководством. [GER.GetAdjectiveCap] Флаг."
 LUX_subvert_armed_forces:0 "Подчинить вооружённые силы"
 LUX_subvert_armed_forces_desc:0 "Любому правительству нужна поддержка армии. Нам тоже, поэтому следует заранее привлечь военных на свою сторону, чтобы позднее не потерять контроль."
 LUX_organise_street_rallies:0 "Организовать уличные митинги"
 LUX_organise_street_rallies_desc:0 "В демократическом обществе протесты и митинги имеют большое влияние. Мы можем использовать это и сплотить людей под флагом [GER.GetAdjectiveCap] людей."
 LUX_replace_the_government:0 "Сменить слабое правительство"
 LUX_replace_the_government_desc:0 "Прежнее правительство слабо и не сделало ничего, кроме своих собственных целей, что привело к тому, что люди остались позади и лишились своей идентичности. Теперь это надо менять!"
 LUX_politicise_army_tt:0 "Два случайных генерала получают:\n§H   Политические связи§!\n - Прирост опыта командира: §R-10,0%§!\n - Стоимость повышения: §G-50,0%§!"
 LUX_kratzenbergs_luxemburg:0 "Люксембург Кратценберга"
 LUX_kratzenbergs_luxemburg_desc:0 "Дамиан Кратценберг привёл народ государства [ROOT.GetNameDef] в новую эпоху — эпоху германской идентичности. Он идеально подходит для дальнейшего руководства государством [ROOT.GetNameDef]."
 LUX_complete_integration:0 "Завершить интеграцию"
 LUX_complete_integration_desc:0 "Несмотря на то, что у нас была история независимости, будущее [ROOT.GetNameDef] находится в [GER.GetNameDef]. Мы должны быть интегрированы как можно скорее, чтобы приблизиться к общему результату. [GER.GetAdjectiveCap] Объединение и господство."
 LUX_expand_the_gau:0 "Расширить гау"
 LUX_expand_the_gau_desc:0 "Наше законное место в [GER.GetNameDef]Тем не менее, мы остаемся несколько автономными. Таким образом, мы можем объединиться с другими. [GER.GetAdjectiveCap]К западу от Рейна, чтобы получить большую промышленную основу."
 LUX_request_further_expansion:0 "Потребовать дальнейшего расширения"
 LUX_request_further_expansion_desc:0 "Как гау Мозелланд мы уже контролируем значительную часть региона, но сможем стать ещё влиятельнее, если получим северные земли у Рейна."
 LUX_annex_conquered_lands:0 "Аннексировать завоёванные земли"
 LUX_annex_conquered_lands_desc:0 "Война идет хорошо, как соседняя сущность, это наша ответственность, чтобы объединиться с нами. [GER.GetAdjectiveCap] на западе."
 LUX_industrialise_west_rhine:0 "Индустриализировать западный берег Рейна"
 LUX_industrialise_west_rhine_desc:0 "Леса к западу от Рейна оставили множество неосвоенных земель. Мы используем их для расширения промышленности и производства вооружений."
 LUX_german_intellect:0 "Использовать германский интеллект"
 LUX_german_intellect_desc:0 "Мы, [GER.GetAdjective]ий народ, стоим на вершине интеллектуального развития. Наши учёные способны достичь того, о чём другие могут лишь мечтать. Пора использовать это и расширить исследовательские лаборатории."
 LUX_aid_the_warmachine:0 "Поддержать военную машину"
 LUX_aid_the_warmachine_desc:0 "Пока идёт война, необходимо перейти к военному производству. Выполняя свой долг в защите Отечества и расширении государства [GER.GetNonIdeologyName], мы заслужим одобрение фюрера."
 LUX_establish_ss:0 "Учредить СС"
 LUX_establish_ss_desc:0 "СС является ключевой частью государственного аппарата государства [GER.GetNameDef]. Её влияние следует распространить на государство [ROOT.GetNameDef], чтобы уничтожить наших врагов."
 LUX_professionalise_army:0 "Профессионализировать армию"
 LUX_professionalise_army_desc:0 "Пруссия близка к профессионализму. Наша история формируется великими солдатами, сражающимися за свое отечество. Это наследие должно быть почитаемым и продолженным."
 LUX_politicise_army:0 "Политизировать армию"
 LUX_politicise_army_desc:0 "Мы, национал-социалисты, должны рассматривать армию как продолжение государства, а не отдельную организацию."
 LUX_maneuver_warfare:0 "Манёвренная война"
 LUX_maneuver_warfare_desc:0 "Будущее войны — за скоростью и бронетехникой. Для победы необходимо укрепить именно эти стороны армии."
 LUX_unbeaten_in_battle:0 "Непобеждённые в бою"
 LUX_unbeaten_in_battle_desc:0 "Мы [GER.GetAdjectiveCap]Они ни разу не проиграли ни одной битвы. Эта традиция будет сохранена, чтобы мы могли добиться окончательной победы."
 LUX_arrest_dennemeyer:0 "Арестовать Деннемейера"
 LUX_arrest_dennemeyer_desc:0 "Хотя он поддерживает национал-социализм, у него слишком много последователей, а значит он представляет опасность и должен быть устранён."
 LUX_kratzenbergs_luxemburg_tt:0 "§RЗапрещает повышать автономию выше уровня§! §Hрейхспротектората§!§R.§!"
 LUX_invalidate_election_unfinished_tt:0 "§RЭта часть древа фокусов не завершена и пока недоступна. Она будет добавлена в одном из будущих обновлений.§!"
