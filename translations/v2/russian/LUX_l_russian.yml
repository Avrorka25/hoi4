 luxembourg.1.t:0 "Приглашение в Бенилюкс"
 luxembourg.1.d:0 "Несмотря на небольшой рост, Люксембург в последние годы стал довольно активным политически из-за все более воинственного характера своих соседей. Премьер-министр Джозеф Бех заявил, что страны низменности должны объединиться, прежде чем наша судьба решится за нас."
 luxembourg.1.a:0 "Поднимем бокалы за союз Бенилюкса!"
 luxembourg.1.b:0 "Альянс? Нелепость!"
 luxembourg.2.t:0 "Государство [From.GetName] вступает в Бенилюкс"
 luxembourg.2.d:0 "Лидер [From.GetLeader] согласился вступить в союз. Наш альянс становится сильнее!"
 luxembourg.2.a:0 "Отпразднуем!"
 luxembourg.3.t:0 "Государство [From.GetName] отклоняет наше предложение"
 luxembourg.3.d:0 "Наши дипломаты вернулись из государства [From.GetName] с печальными новостями: несмотря на все усилия, союз заключён не будет."
 luxembourg.3.a:0 "Тогда пусть погибают в одиночку."
 luxembourg.10.t:0 "Люксембург желает вступить в наш альянс"
 luxembourg.10.d:0 "Дамиан Кратценберг направил дипломатов в Берлин, чтобы обсудить возможное вступление Люксембурга в страны Оси. Несмотря на крошечные размеры страны, они проявляют большое рвение."
 luxembourg.10.a:0 "Ещё один союзник в борьбе за германский национализм!"
 luxembourg.10.b:0 "За защиту придётся заплатить."
 luxembourg.10.c:0 "Люксем... что?"
 luxembourg.11.t:0 "Германия согласна!"
 luxembourg.11.d:0 "Посланники из Берлина прибыли в город Люксембург, чтобы обсудить союз страны с державами Оси. Сегодня великий день!"
 luxembourg.11.a:0 "Слава фюреру!"
 luxembourg.12.t:0 "Германия согласна..."
 luxembourg.12.d:0 "Посланники из Берлина прибыли в город Люксембург, чтобы обсудить частичную интеграцию страны в Германский рейх. Похоже, условия сделки изменились."
 luxembourg.12.a:0 "Небольшая цена за защиту."
 luxembourg.13.t:0 "Германия отказывает"
 luxembourg.13.d:0 "Наши письма остаются без ответа, а дипломатов отвергают. Похоже, у нацистов есть дела важнее судьбы нашей страны."
 luxembourg.13.a:0 "Будь они прокляты."
 luxembourg.14.t:0 "Выборы 1937 года"
 luxembourg.14.d:0 "Несмотря на сгущающиеся над миром тучи, политическая жизнь Люксембурга продолжается. На выборах 1937 года ожидается высокая явка сторонников Партии права и социал-демократов. Однако предложенный консерваторами Маулькорфгезетц, призванный подавить растущую популярность и влияние КПЛ, оказался менее популярен, чем ожидалось. Лидер [ROOT.GetLeader] поставил судьбу закона на референдум. Ожидается, что итог голосования будет крайне близким."
 luxembourg.14.d.alt:0 "Несмотря на сгущающиеся над миром тучи, политическая жизнь Люксембурга продолжается. На выборах 1937 года ожидается высокая явка сторонников Партии права и социал-демократов. После недавнего принятия Партией права закона Маулькорфгезетц ожидается, что лидер [ROOT.GetLeader] сохранит власть при поддержке одной из малых правых партий."
 luxembourg.14.a:0 "Референдум провален."
 luxembourg.14.b:0 "Референдум успешен."
 luxembourg.14.c:0 "Политика — забавная игра."
 luxembourg.200.t:0 "Профсоюзы организуются"
 luxembourg.200.d:0 "После того как в декабре прошлого года принятие закона о Национальном совете труда было отложено, правительство столкнулось с сильным недовольством оппозиции и населения. Теперь профсоюзы организовали забастовку. Этот вопрос также объединил христианские и социалистические профсоюзы, что привело к крупному протесту численностью 40 000 человек.\n\nОни требуют немедленно отменить отсрочку. Это приведёт к созданию Национального совета труда и арбитражного органа, юридическому признанию профсоюзов, а также общему повышению заработной платы."
 luxembourg.200.a:0 "В их словах есть смысл."
 luxembourg.200.b:0 "Нас не заставят подчиниться давлением."
 luxembourg.201.t:0 "Референдум по Маулькорфгезетцу"
 luxembourg.201.d:0 "Коммунизм угрожает Люксембургу! Премьер-министр наблюдает его усиление ещё со времён Великой войны. На выборах 1934 года КПЛ впервые добилась успеха, получив одно место в Палате депутатов. Премьер-министру Бешу это надоело, и он аннулировал результат.\n\nПытаясь окончательно избавить люксембургскую политику от коммунистов, Жозеф Беш продвинул новый закон — Маулькорфгезетц. Палата депутатов приняла его, но премьер-министр решил провести референдум и позволить народу определить судьбу закона. Неожиданно референдум был провален с минимальным перевесом, закон остановлен, а КПЛ сохранила легальный статус.\n\nЖозеф Беш объявил, что уйдёт в отставку после новых выборов. Для консерваторов это стало огромной неудачей."
 luxembourg.201.a:0 "Народ высказался."
 luxembourg.202.t:0 "Маулькорфгезетц"
 luxembourg.202.d:0 "Коммунизм представляет угрозу для Люксембурга. Премьер-министр видел его рост со времен Великой войны. КПЛ добилась первого успеха на выборах 1934 года, когда ей удалось получить одно место в Палате депутатов. Премьер-министру Бечу хватило и недействительный результат.\n\nСегодня Йозеф Бех снова пытается ослабить коммунизм в Люксембурге. Его правительство предложило закон, Maulkuerfgesetz, который запретит любую партию, которая пытается подорвать конституцию, фактически запрещая KPL. Палата депутатов проголосовала за закон, и он был принят. Но мы все еще можем провести референдум, чтобы определить, хотят ли этого люди."
 luxembourg.202.a:0 "Он должен пройти, к чёрту демократию!"
 luxembourg.202.b:0 "Нужно спросить народ — подготовим референдум."
 luxembourg.210.t:0 "Предстоящие выборы"
 luxembourg.210.d:0 "Выборы 1937 года приближаются. Говорят, что они определят будущее Люксембурга сильнее любых предыдущих. Континент далёк от мира, и стране, возможно, придётся отказаться от нейтралитета.\n\nНа выборах распределяются места в Палате депутатов — парламенте государства [ROOT.GetNonIdeologyName]. Участвуют консервативная PD, которая сейчас правит страной, социал-либеральная PRL, также входящая в правительство, социалистическая и социал-демократическая LSAP и коммунистическая KPL. Все эти партии могут получать государственную поддержку для ведения кампании. Однако необходимо также сохранять явку и доверие избирателей, иначе выборы могут быть аннулированы, что откроет путь более радикальным идеологиям к власти в государстве [ROOT.GetNonIdeologyName].\n\nТем временем политики разных партий начинают кампании и ездят по стране. Посмотрим, чем закончатся выборы."
 luxembourg.210.a:0 "Подготовить избирательные участки."
 luxembourg.211.t:0 "Партия права побеждает на выборах!"
 luxembourg.211.d:0 "Господство Партии права продолжается. Теперь она может добавить к своим достижениям ещё одну победу на выборах.\nЕдинственной небольшой неудачей стали провал Маулькорфгезетца и последующая отставка Жозефа Беша.\n\nТем не менее новое правительство, теперь возглавляемое Пьером Дюпоном, может рассчитывать на спокойную передачу власти."
 luxembourg.211.a:0 "Ещё один консервативный срок."
 luxembourg.212.t:0 "Радикально-либеральная партия побеждает на выборах!"
 luxembourg.212.d:0 "Благодаря этой победе ПРЛ наконец станет ведущей партией правительства, тогда как прежде она была лишь младшим партнёром в кабинетах, подобных прежнему правительству Беша.\nПартию возглавляет социал-либерал Гастон Дидерих, зарекомендовавший себя способным лидером с тех пор, как его направление одержало верх над более классическими либеральными течениями.\n\nНо прежде он отпразднует победу вместе с партией, а в ближайшие недели вступит в должность премьер-министра."
 luxembourg.212.a:0 "Усилия партии наконец вознаграждены."
 luxembourg.213.t:0 "ЛСАП побеждает на выборах!"
 luxembourg.213.d:0 "Несмотря на прежние электоральные успехи, социал-демократы Люксембурга ещё никогда не возглавляли правительство и даже не входили в его состав. Сегодня всё изменилось: ЛСАП впервые получила большинство на выборах.\nРуководство партии уже пообещало выполнить предвыборные обещания. Если это произойдёт, будущее Люксембурга выглядит светлым!"
 luxembourg.213.a:0 "Для страны начинается новая эпоха!"
 luxembourg.214.t:0 "КПЛ побеждает на выборах!"
 luxembourg.214.d:0 "Коммунистическая партия одержала совершенно неожиданную победу на недавних выборах! Поскольку такого исхода не предсказывали даже эксперты, многие, особенно представители высших классов, либо покинули страну, либо вывезли свои капиталы за границу.\nНеясно, каким будет будущее страны при Шарле Марксе, открыто выступающем против монархии."
 luxembourg.214.a:0 "Народ действительно высказался."
 luxembourg.215.t:0 "Результаты выборов не дали победителя"
 luxembourg.215.d:0 "После выборов многие ставят под сомнение результаты выборов. Мы не уверены, что они являются представителями народа Люксембурга. Сейчас лишь немногие могут что-то сделать, мы могли бы продолжать бизнес как обычно, но это приведет к большой общественной реакции. Однако мы могли бы также позволить Великой княгине вмешаться и взять на себя управление на некоторое время в качестве переходного правительства. Или наши крупные соседи могли бы вмешаться и воспользоваться нашей ситуацией."
 luxembourg.215.a:0 "Кто-то должен вмешаться!"
 luxembourg.216.t:0 "Объявить досрочные выборы?"
 luxembourg.216.d:0 "После запрета КПЛ критика правительства продолжает усиливаться. Многие называют Маулькорфгезетц «недемократичным» или «неконституционным». Очевидно, необходимо что-то предпринять.\n\nТеперь в правительстве начинает оформляться новая идея. [ROOT.GetLeader] может объявить досрочные выборы, оставив другим партиям минимум времени на подготовку. ПД, являясь крупнейшей политической партией государства [ROOT.GetNameDef], почти гарантированно победит на таких выборах. Нам придётся придумать объяснение своему решению, но осуществить это возможно."
 luxembourg.216.a:0 "Это единственный шанс сохранить государство [ROOT.GetNonIdeologyName] таким, каким мы его знаем."
 luxembourg.216.b:0 "Нельзя полагаться на столь грязные уловки."
 LUX_elections_PD_winner_tt:0 "§2Партия права§! победила на выборах!"
 LUX_elections_PRL_winner_tt:0 "§YРадикально-либеральная партия§! победила на выборах!"
 LUX_elections_LSAP_winner_tt:0 "§0Люксембургская социалистическая рабочая партия§! победила на выборах!"
 LUX_elections_KPL_winner_tt:0 "§tКоммунистическая партия Люксембурга§! победила на выборах!"
 luxembourg.220.t:0 "Государство [LUX.GetNameDefCap] хочет подтвердить Лондонский договор"
 luxembourg.220.d:0 "На фоне постоянного роста международной напряжённости государство [LUX.GetNameDef] приложило значительные усилия для сохранения нейтралитета. Теперь оно обратилось к нам с просьбой подтвердить Лондонский договор 1867 года, гарантировавший нейтралитет и независимость страны всеми подписавшими сторонами.\n\nМы можем согласиться с их просьбой и сохранить мир в государстве [LUX.GetNonIdeologyName], однако в случае войны нам придётся защищать эту страну."
 LUX_reaffirm_treaty_of_london_accept_tt:0 "Мы §Hгарантируем§! независимость Люксембурга и §Hзащитим его§! в случае §Rвойны§!."
 luxembourg.220.a:0 "Разумеется, мы согласимся."
 luxembourg.220.b:0 "Пока мы не готовы брать на себя такие обязательства."
 luxembourg.221.t:0 "Государство [FROM.GetNameDefCap] приняло наше предложение"
 luxembourg.221.d:0 "Через телеграф, через [FROM.GetAdjectiveCap] Министерство иностранных дел сообщило нам важную новость: мы получили поддержку от правительства. [FROM.GetNameDefCap]! Отличный шаг к нашей конечной цели!"
 luxembourg.221.a:0 "Великолепно."
 luxembourg.222.t:0 "Государство [FROM.GetNameDefCap] отклонило наше предложение"
 luxembourg.222.d:0 "В министерство иностранных дел поступили печальные новости: государство [FROM.GetNameDef] не поддержит наше предложение подтвердить Лондонский договор.\n\nПоскольку для легитимности инициативы нам требовалась поддержка всех прежних подписантов, теперь она не будет осуществлена."
 luxembourg.222.a:0 "Проклятые глупцы!"
 luxembourg.223.t:0 "Подтверждение Лондонского договора"
 luxembourg.223.d:0 "Наша инициатива увенчалась успехом: мы собрали всех первоначальных подписантов Лондонского договора 1867 года, чтобы вновь подтвердить соглашение и гарантировать вечную независимость государства [ROOT.GetNonIdeologyName].\n\nПоскольку государство [GER.GetNameDef] не подписывало договор, с ним придётся заключить отдельное соглашение."
 luxembourg.223.a:0 "И всё же это великий день для государства [ROOT.GetNonIdeologyName]!"
 luxembourg.224.t:0 "Провал подтверждения договора"
 luxembourg.224.d:0 "Мы были близки, но недостаточно: переговоры о подтверждении Лондонского договора провалились, поскольку некоторые прежние подписанты отказались поддержать наше предложение.\n\nТеперь остаётся надеяться, что государству [ROOT.GetNonIdeologyName] повезёт в отношениях с нашей величайшей нынешней угрозой — государством [GER.GetNameDef]."
 luxembourg.224.a:0 "Мы были так близки."
 luxembourg.225.t:0 "Подтверждение Лондонского договора"
 luxembourg.225.d:0 "Государство [LUX.GetNonIdeologyName] только что объявило об успешном подтверждении Лондонского договора, первоначально подписанного в 1867 году, и гарантировании вечного нейтралитета этой небольшой страны. Теперь, когда её защищают несколько великих держав, это несомненно поможет ей сохранить независимость.\n\nМногие надеются, что данное событие станет началом возвращения Европы к более мирному состоянию. Безусловно, другие страны возьмут его за пример для собственной дипломатии.\n\nЭтот день принадлежит государству [LUX.GetNonIdeologyName], и его жители будут праздновать обретённую безопасность."
 luxembourg.225.a:0 "Великий шаг для государства [LUX.GetNonIdeologyName] и всей Европы."
 luxembourg.225.b:0 "Необходимый шаг ради мира."
 luxembourg.226.t:0 "Провал нового Лондонского договора"
 luxembourg.226.d:0 "Нас пригласили на [LUX.capital.GetCapitalVictoryPointName] Обсудить возможное подтверждение Лондонского договора 1867 года. Теперь, [LUX.GetAdjectiveCap] Министр иностранных дел сказал нам, что договор не будет иметь успеха, поскольку некоторые потенциальные подписавшие его стороны отказались его подписать.\n\nТеперь мы свободны, чтобы вернуться в [ROOT.capital.GetCapitalVictoryPointName]. Этот поворот событий является признаком будущего Европы, поскольку потенциальная отправная точка для успокоения напряженности теперь уже недоступна."
 luxembourg.226.a:0 "Поистине печальный день для всей Европы."
 luxembourg.226.b:0 "Государство [LUX.GetNonIdeologyName] всё равно не заслуживает защиты."
 luxembourg.228.t:0 "Государство [LUX.GetNameDefCap] подверглось нападению"
 luxembourg.228.d:0 "После нападения на государство [LUX.GetNameDef] мы должны решить, станем ли его защищать. Как подписанты Лондонского договора мы обязаны прийти ему на помощь и сохранить его независимость. Однако это может втянуть нас в войну, которую мы не способны вести. Отказ от вмешательства также создаст нам репутацию ненадёжного союзника и повредит международным перспективам."
 luxembourg.228.a:0 "Государство [LUX.GetNonIdeologyName] будет защищено!"
 luxembourg.228.b:0 "Это нас не касается."
 luxembourg.250.t:0 "Плоды нашего труда"
 luxembourg.250.d:0 "Мы знали, что переключить нашу экономическую политику на коллективизированную будет сложно. Мы знали, что людям потребуется время для адаптации. Мы знали, что будет буржуазное сопротивление захвату средств производства.\n\nНо мы, пролетариат [ROOT.GetNonIdeologyName]Настойчивые и проталкиваемые. Благодаря нашему тяжелому труду, благодаря работе тысяч талантливых рабочих, интеллектуалов и планировщиков мы можем назвать революционную экономику завершенной."
 luxembourg.250.a:0 "Мы существуем в контексте всего, что нас окружает, и всего, что было до нас."
 luxembourg.270.t:0 "Новая внешнеполитическая доктрина"
 luxembourg.270.d:0 "В связи с провалом наших переговоров о возможном подтверждении Лондонского договора наша страна находится в очень уязвимом положении. Несомненно, существуют зарубежные планы по дестабилизации или завоеванию. [ROOT.GetNonIdeologyName].\n\nСтремясь решить этот вопрос, наш министр иностранных дел обратился к премьер-министру и предложил новый курс действий. Это означает, что вы должны обратиться к обоим [GER.GetNameDef] и [FRA.GetNameDef]Наши самые могущественные соседи, заручившись их поддержкой нейтральных и независимых государств. [ROOT.GetNameDef].\n\nОднако это предложение не лишено своих рисков. Еще одна неудача заметно ослабит нас на мировой арене, в то время как успех все еще может быть истолкован как нарушение нашего полного нейтралитета."
 luxembourg.270.a:0 "Попытаемся осуществить этот план."
 luxembourg.270.b:0 "Это не стоит затраченных усилий."
 luxembourg.271.t:0 "Государство [FROM.GetNameDefCap] просит гарантий"
 luxembourg.271.d:0 "После недавнего провала подтверждения Лондонского договора 1867 года государство [LUX.GetNameDef], похоже, не сидело без дела.\n\nОно обратилось к нам с просьбой гарантировать его независимость. Само по себе это было бы просто, однако предложение также включает государство [GER.GetNameDef]. Нам следует осторожно поддерживать баланс сил в регионе и одновременно отстаивать собственные интересы."
 luxembourg.271.a:0 "Это заслуживает нашей поддержки."
 luxembourg.271.b:0 "В качестве компенсации потребуем право прохода войск."
 luxembourg.271.c:0 "Государство [ROOT.GetNonIdeologyName] не станет защищать государство [FROM.GetNonIdeologyName]."
 luxembourg.272.t:0 "Государство [FROM.GetNameDefCap] просит гарантий"
 luxembourg.272.d:0 "После недавнего провала подтверждения Лондонского договора 1867 года государство [LUX.GetNameDef], похоже, не сидело без дела.\n\nОно обратилось к нам с просьбой гарантировать его независимость. Вместе с нами приглашено государство [FRA.GetNameDefCap]. Чтобы и мы получили выгоду, можно потребовать определённую компенсацию, хотя другая сторона может отказаться."
 luxembourg.272.a:0 "Да, как угодно."
 luxembourg.272.b:0 "Следует убедиться, что это выгодно и нам."
 luxembourg.272.c:0 "Мы не станем связывать себя обязательствами ради независимости другой страны."
 luxembourg.273.t:0 "Государство [FROM.GetNameDefCap] согласилось без условий"
 luxembourg.273.d:0 "Похоже, государство [FROM.GetNameDef] не бросило нас и приняло просьбу, не выдвинув собственных требований. Многие дипломаты облегчённо вздохнули, поскольку считали, что убедить государство [FROM.GetNonIdeologyName] подписать пакт будет труднее всего."
 luxembourg.273.a:0 "Прекрасные новости."
 luxembourg.274.t:0 "Государство [FROM.GetNonIdeologyName] выдвигает требования"
 luxembourg.274.d:0 "Худшие опасения сбылись: государство [FROM.GetNonIdeologyName] не отказалось защищать нас напрямую, но потребовало разрешить размещение войск в государстве [ROOT.GetNonIdeologyName]. В министерстве иностранных дел уже звучат призывы прекратить переговоры, однако многие предупреждают, что это наш последний шанс на выживание."
 luxembourg.274.a:0 "Мы должны уступить их требованиям."
 luxembourg.274.b:0 "Нельзя поступаться нейтралитетом."
 luxembourg.275.t:0 "Государство [FROM.GetNameDefCap] отказалось защищать нас"
 luxembourg.275.d:0 "За последние часы стало ясно, что государство [FROM.GetNonIdeologyName] не заинтересовано в защите нашей малой страны. Без двустороннего соглашения любые гарантии государства [GER.GetNameDef] потеряют значение."
 luxembourg.275.a:0 "Теперь мы можем исчезнуть из истории."
 luxembourg.276.t:0 "Государство [FROM.GetNameDefCap] не выдвинуло требований"
 luxembourg.276.d:0 "Наши дипломаты в городе [FROM.capital.GetCapitalVictoryPointName] передали неожиданные новости. Государство [FROM.GetNameDefCap] согласилось защищать государство [ROOT.GetNameDef], не выдвинув собственных требований. Это стало неожиданностью, но весьма полезной."
 luxembourg.276.a:0 "Неожиданно, но приятно."
 luxembourg.277.t:0 "Государство [FROM.GetNameDefCap] требует солдат"
 luxembourg.277.d:0 "При обсуждении условий [FROM.GetAdjectiveCap] Они потребовали 2000 человек, чтобы служить в их армии. Для них это может показаться небольшим числом, но для нас оно большое. Кроме того, это еще больше привяжет нас к их будущей политике, поскольку наши граждане будут служить в их армии."
 luxembourg.277.a:0 "Необходимое зло ради нашего дальнейшего существования."
 luxembourg.277.b:0 "Мы не можем уступить таким требованиям."
 luxembourg.277.c:0 "У нас попросту нет столько людей."
 luxembourg.278.t:0 "Государство [FROM.GetNameDefCap] не станет нас защищать"
 luxembourg.278.d:0 "К сожалению, государство [FROM.GetNameDef] объявило, что не станет нас защищать. Мы ожидали подобного исхода переговоров и подготовились к нему, но альтернативы у нас всё равно нет. Остаётся лишь быть готовыми к дальнейшим событиям."
 luxembourg.278.a:0 "Ожидаемый исход."
 luxembourg.279.t:0 "Успех переговоров"
 luxembourg.279.d:0 "Мы, а точнее наши дипломаты, добились успеха. Они убедили государства [GER.GetNameDef] и [FRA.GetNameDef] гарантировать нашу независимость и защищать нас в случае войны!\n\nЭто уже укрепило стабильность государства [ROOT.GetNonIdeologyName], а будущие дипломатические перспективы особенно выиграют от такого результата. Министр иностранных дел неофициально объявил о праздновании успеха, а премьер-министр готовится выступить в Палате депутатов.\n\nВ целом можно уверенно сказать: провал переговоров по Лондонскому договору временно причинил нам боль, но мы проявили стойкость и нашли новое решение."
 luxembourg.279.a:0 "Будущее государства [ROOT.GetNameDef] выглядит светлым!"
 luxembourg.280.t:0 "Провал переговоров"
 luxembourg.280.d:0 "На счету нашего министерства иностранных дел появился ещё один провал переговоров. Вероятно, самое важное соглашение последних лет войдёт в историю как последний гвоздь в крышку нашего гроба.\n\nОднако мы обязаны двигаться дальше и подготовиться ко всему, что нас ждёт. В конце концов, Mir wëlle bleiwe wat mir sinn."
 luxembourg.280.a:0 "Мрачный день для государства [ROOT.GetNonIdeologyName]."
 luxembourg.281.t:0 "Успешные переговоры с государством [FROM.GetNonIdeologyName]"
 luxembourg.281.d:0 "В нашу столицу поступили новости из города [FROM.capital.GetCapitalVictoryPointName]: переговоры о защите государства [FROM.GetNameDef] прошли успешно, и были подписаны различные соглашения, определяющие будущее наших отношений.\n\nХотя переговоры были рискованными, они объединили государства [GER.GetNameDef] и [FRA.GetNameDef] в деле защиты малой страны. Пока неизвестно, принесёт ли это пользу всем подписантам или будущие события склонят баланс сил в одну из сторон."
 luxembourg.281.a:0 "Желательный исход."
 luxembourg.282.t:0 "Провал переговоров с государством [FROM.GetNonIdeologyName]"
 luxembourg.282.d:0 "Переговоры завершены, но ничего не подписано. [FROM.GetNameDef] Они будут оставаться незащищенными еще некоторое время. После провалившихся переговоров по Лондонскому договору это станет еще одной неудачей для Лондона. [FROM.GetNameDef].\n\nПока неясно, как это повлияет на будущее континента."
 luxembourg.282.a:0 "Ничего не потеряно и ничего не приобретено."
 LUX_will_fail_negotiations_tt:0 "§RЭто приведёт к провалу переговоров.§!"
 luxembourg.230.t:0 "Государство [FROM.GetNameDefCap] просит гарантий"
 luxembourg.230.d:0 "[FROM.GetNameDefCap] Недавно они отказались от своего нейтралитета, поскольку новое правительство смогло победить на выборах. Очевидно, что они не могут защитить себя самостоятельно, то есть рано или поздно они будут искать защиты.\n\nКажется, что этот день наступил, как [FROM.GetAdjectiveCap] Дипломат по запросу [ROOT.GetAdjectiveCap] защиты от угроз их независимости и суверенитету."
 luxembourg.230.a:0 "Мы защитим их."
 luxembourg.230.b:0 "Государство [ROOT.GetNameDefCap] не готово брать на себя такие обязательства."
 luxembourg.231.t:0 "Государство [FROM.GetNameDefCap] согласилось защищать нас"
 luxembourg.231.d:0 "Вернувшийся дипломат сообщил, что государство [FROM.GetNameDef] согласилось защищать нас.\n\nЭти прекрасные новости уже расходятся по стране и, как ожидается, завтра появятся на первых полосах газет."
 luxembourg.231.a:0 "Какое облегчение."
 luxembourg.232.t:0 "Государство [FROM.GetNameDefCap] не станет нас защищать"
 luxembourg.232.d:0 "По телеграфу поступило дипломатическое заявление: государство [FROM.GetNameDef] сообщило, что не будет нас защищать, поскольку пока не готово связывать себя подобными соглашениями."
 luxembourg.232.a:0 "Прискорбно."
 luxembourg.240.t:0 "Государство [FROM.GetNameDefCap] хочет федерализировать Бенилюкс"
 luxembourg.240.d:0 "Идея витала вокруг в течение многих лет, но на нее никогда не действовали. После формирования Бенилюкса, [FROM.GetAdjectiveCap] Похоже, наконец-то было принято решение о объединении низменностей.\n\nПринятие такого предложения положило бы конец существованию [ROOT.GetNameDef] Но это может привести к усилению низменности в целом.\nВ любом случае, мы должны внимательно рассмотреть этот вопрос, будущее Низин здесь поставлено на карту."
 luxembourg.240.a:0 "Сила в единстве!"
 luxembourg.240.b:0 "Мы не откажемся от независимости."
 luxembourg.241.t:0 "Государство [FROM.GetNameDefCap] согласилось на федерализацию"
 luxembourg.241.d:0 "Наконец настал великий день объединения: делегаты государства [FROM.GetNameDef] сообщили премьер-министру, что готовы объединиться в Федерацию Бенилюкса.\n\nХотя основная законодательная работа уже выполнена, остаются нерешённые вопросы, включая судьбу монархии."
 luxembourg.241.a:0 "Великий день для всех нас."
 luxemourg.242.t:0 "Государство [FROM.GetNameDefCap] не вступит в союз"
 luxembourg.242.d:0 "Несмотря на нашу агитацию, государство [FROM.GetNameDef] отказалось вступить в Федерацию Бенилюкса. Мы почти ничего не можем сделать и лишь надеемся, что это решение не навредит ни им, ни нам.\n\nНадежда на защиту Нижних Земель всё ещё остаётся, и мы должны выстоять любой ценой!"
 luxembourg.242.a:0 "Прискорбно."
 luxembourg.243.t:0 "Федерация Бенилюкса"
 luxembourg.243.d:0 "После долгих переговоров с союзниками мы наконец добились столь необходимого прорыва. Решение принято, подготовка уже началась, и Федерация Бенилюкса наконец создана.\n\nЭтот день, имеющий огромное значение для будущего Нижних Земель и всей Европы, войдёт в историю как символ радости и политического сотрудничества. Пусть мы сумеем построить хороший мир для наших преемников!"
 luxembourg.243.a:0 "«Федерация Бенилюкса». Да, мне нравится, как это звучит."
 luxembourg.244.t:0 "Несостоявшаяся федерация"
 luxembourg.244.d:0 "Измученные дипломаты вернулись с переговоров об объединении и уже сообщили премьер-министру о провале.\n\nГосударство [ROOT.GetNonIdeologyName] так и останется государством [ROOT.GetNameDef], а не чем-то большим. Теперь необходимо пересмотреть внешнюю политику, поскольку наша важнейшая цель не была достигнута."
 luxembourg.244.a:0 "Мы потерпели неудачу."
 luxembourg.350.t:0 "Нацистский переворот в государстве [LUX.GetNonIdeologyName]"
 luxembourg.350.d:0 "Из государства [LUX.GetOldNameDef] пришли новости о том, что немецкие нацисты штурмом взяли великогерцогский дворец. Они смогли осуществить это лишь потому, что в последние месяцы движение получило значительную поддержку. Пока неизвестно, сумеет ли новое правительство удержать страну под контролем.\n\nГосударство [GER.GetNameDefCap] уже разместило войска в новом вассальном государстве, которое намерено тесно интегрировать. Лишь время покажет, насколько это изменит баланс сил в Европе и останется ли государство [LUX.GetNonIdeologyName] самостоятельной страной через несколько лет."
 luxembourg.350.a:0 "Желаем им всего наилучшего."
 luxembourg.350.b:0 "Тревожно."
 luxembourg.260.t:0 "Государство [FROM.GetNameDefCap] просит вторгнуться в государство [PREV.GetNameDef]"
 luxembourg.260.d:0 ""
 luxembourg.260.a:0 "Всё ради революции."
 luxembourg.260.b:0 "Это вторжение не будет разрешено."
 luxembourg.261.t:0 "Государство [FROM.GetNameDefCap] согласилось на вторжение"
 luxembourg.261.d:0 ""
 luxembourg.261.a:0 "Да здравствует революция!"
 luxembourg.262.t:0 "Государство [FROM.GetNameDefCap] не хочет, чтобы мы вторгались"
 luxembourg.262.d:0 ""
 luxembourg.262.a:0 "Мы ничего не можем сделать."
 luxembourg.263.t:0 "Государство [FROM.GetNameDefCap] хочет вторгнуться в Бенилюкс"
 luxembourg.263.d:0 ""
 luxembourg.400.t:0 "Государство [FROM.GetNameDefCap] хочет управлять дополнительными землями"
 luxembourg.400.d:0 ""
 luxembourg.400.a:0 "Всё ради наших [ROOT.GetAdjectiveCap]их братьев."
 luxembourg.400.b:0 "Это ослабит [ROOT.GetAdjectiveCap]ий народ."
 luxembourg.401.t:0 "Государство [FROM.GetNameDefCap] приняло наше предложение"
 luxembourg.401.d:0 ""
 luxembourg.401.a:0 "Тогда приступим к работе."
 luxembourg.402.t:0 "Государство [FROM.GetNameDefCap] отклонило наше предложение"
 luxembourg.402.d:0 ""
 luxembourg.402.a:0 "Настоящий удар по гау."
 luxembourg.405.t:0 "Государство [FROM.GetNameDefCap] хочет расшириться ещё сильнее"
 luxembourg.405.d:0 ""
 luxembourg.405.a:0 "Всё ради наших [ROOT.GetAdjectiveCap]их братьев."
 luxembourg.405.b:0 "Это ослабит [ROOT.GetAdjectiveCap]ий народ."
 luxembourg.406.t:0 "Государство [FROM.GetNameDefCap] приняло наше предложение"
 luxembourg.406.d:0 ""
 luxembourg.406.a:0 "Тогда приступим к работе."
 luxembourg.407.t:0 "Государство [FROM.GetNameDefCap] отклонило наше предложение"
 luxembourg.407.d:0 ""
 luxembourg.407.a:0 "Настоящий удар по гау."
 luxembourg.410.t:0 "Государство [FROM.GetNameDefCap] просит передать оккупацию региона [965.GetName]"
 luxembourg.410.d:0 ""
 luxembourg.410.a:0 "Переложим это бремя на них."
 luxembourg.410.b:0 "Государству [ROOT.GetNameDefCap] нужны все оккупированные земли."
 luxembourg.411.t:0 "Государство [FROM.GetNameDefCap] передало регион [965.GetName]"
 luxembourg.411.d:0 ""
 luxembourg.411.a:0 "Ещё один шаг к [ROOT.GetAdjectiveCap]ому господству."
 luxembourg.412.t:0 "Государство [FROM.GetNameDefCap] не передаст регион [965.GetName]"
 luxembourg.412.d:0 ""
 luxembourg.412.a:0 "Небольшая неудача."
 luxembourg.415.t:0 "Государство [FROM.GetNameDefCap] просит передать нашу оккупацию [BEL.GetAdjectiveCap]их земель"
 luxembourg.415.d:0 ""
 luxembourg.415.a:0 "Мы не можем отказать им в том, что принадлежит им."
 luxembourg.415.b:0 "[BEL.GetAdjectiveCap]ие земли по праву являются [ROOT.GetAdjectiveCap]ими."
 luxembourg.416.t:0 "Государство [FROM.GetNameDefCap] передало свои [BEL.GetAdjectiveCap]ие земли"
 luxembourg.416.d:0 ""
 luxembourg.416.a:0 "Они сделали мудрый выбор."
 luxembourg.417.t:0 "Государство [FROM.GetNameDefCap] не выведет войска из государства [BEL.GetNonIdeologyName]"
 luxembourg.417.d:0 ""
 luxembourg.417.a:0 "Будь они прокляты!"
 luxembourg.420.t:0 "Государство [FROM.GetNameDefCap] хочет оккупировать [HOL.GetAdjectiveCap]ие земли"
 luxembourg.420.d:0 ""
 luxembourg.420.a:0 "Исполним их желание."
 luxembourg.420.b:0 "Мы не откажемся от завоёванных земель."
 luxembourg.421.t:0 "Государство [FROM.GetNameDefCap] передало свои [HOL.GetAdjectiveCap]ие земли"
 luxembourg.421.d:0 ""
 luxembourg.421.a:0 "Превосходно!"
 luxembourg.422.t:0 "Государство [FROM.GetNameDefCap] отклонило нашу просьбу"
 luxembourg.422.d:0 ""
 luxembourg.422.a:0 "Прискорбно."
 luxembourg.425.t:0 "Государство [FROM.GetNameDef] потребовало [FRA.GetAdjectiveCap]ие земли"
 luxembourg.425.d:0 ""
 luxembourg.425.a:0 "Эти земли нам всё равно не нужны."
 luxembourg.425.b:0 "Они становятся слишком могущественными!"
 luxembourg.426.t:0 "Государство [FROM.GetNameDefCap] уступило нашей просьбе"
 luxembourg.426.d:0 ""
 luxembourg.426.a:0 "Новые земли укрепят страну."
 luxembourg.427.t:0 "Государство [FROM.GetNameDefCap] проигнорировало нашу просьбу"
 luxembourg.427.d:0 ""
 luxembourg.427.a:0 "Жаль, мы получим их другим способом."
 LUX_charlotte_desc:0 "После принятия конституции 1919 года власть герцогини стала преимущественно церемониальной. Несмотря на это, великая герцогиня Шарлотта остаётся популярным символом демократии и продолжающейся независимости государства [ROOT.GetNameDef]."
 r56_LUX_charles_marx:0 "Шарль Маркс"
 LUX_camille_dennemeyer:0 "Камиль Деннемейер"
 LUX_prince_jean:0 "Принц Жан"
 r56_LUX_evacuate_the_treasury:0 "Эвакуированная казна"
 LUX_formalize_our_resistance:0 "Люксембургское сопротивление"
 r56_LUX_operation_bastogne:0 "Операция «Бастонь»"
 r56_LUX_royalist_militarism:0 "Королевский милитаризм"
 r56_LUX_creative_military_solutions:0 "Доктрина воздушного десанта"
 r56_LUX_our_own_destiny:0 "Собственная судьба"
 r56_LUX_embrace_autarky:0 "Люксембургская автаркия"
 r56_LUX_favor_the_royalist:0 "Укрепление роялистов"
 r56_LUX_favor_the_fasicts:0 "Интегрированные молодёжные организации"
 r56_legacy_of_luxembourg_crisis:0 "Наследие Люксембургского кризиса"
 r56_legacy_of_luxembourg_crisis_desc:0 "С Люксембургского кризиса 1867 года государство придерживается политики нейтралитета. Однако немецкая оккупация нашей страны в годы Великой войны и недавнее перевооружение Германии подорвали поддержку этого курса."
 r56_lux_stand_agaisnt_authoritarianism:0 "Противостоять авторитаризму"
 r56_LUX_politcal_safe_heaven:0 "Политическое убежище"
 r56_LUX_coaltition_with_kpl:0 "Возвышенные профсоюзы"
 r56_LUX_strengthen_rietspartei_position:0 "Возвышенные технократы"
 r56_LUX_armed_republic:0 "Закон о национальной обороне"
 r56_LUX_export_our_doctrine:0 "Люксембургские политические агенты"
 r56_LUX_export_our_doctrine_native:0 "Экспорт нашей доктрины"
 r56_LUX_export_our_doctrine_native_LaR:0 "Экспорт нашей доктрины"
 lux_victor_idea:0 "Lux Victor!"
 lux_victor_idea_desc:0 "Нас взвесили, измерили и не нашли недостатков. Да здравствуют герцогиня и Люксембург!"
 auxiliaries_idea:0 "Вспомогательные части"
 auxiliaries_idea_desc:0 "Накануне войны каждый желающий гражданин должен быть готов сражаться. Усилив нынешние войска вспомогательными частями, мы, возможно, выстоим в грядущем конфликте."
 gendarmerie_idea:0 "Великогерцогская жандармерия"
 gendarmerie_idea_desc:0 "Правоохранительная бригада обеспечит безопасность улиц и при необходимости встанет на защиту страны."
 volunteer_army_idea:0 "Добровольцы"
 volunteer_army_idea_desc:0 "Каждый гражданин обязан внести свой вклад."
 quality_over_quantity_idea:0 "Качество важнее количества"
 quality_over_quantity_idea_desc:0 "Пусть нам не хватает пространства, мастерство Люксембурга может стать легендарным: каждая пуля — мазок кисти, а каждая винтовка — произведение искусства."
 foreign_experts_idea:0 "Иностранные специалисты"
 foreign_experts_idea_desc:0 "Пригласив в наши залы лучших и самых ярких людей, мы сможем добиться больших успехов в технологиях, которые намного превосходят наших более крупных соседей."
 LUX_communism_idea:0 "Коммунистическое влияние"
 LUX_communism_idea_desc:0 "Банкиры и предприниматели из элиты слишком долго угнетали народ Люксембурга. Теперь мы вернём себе страну!"
 LUX_fascism_idea:0 "Фашистское влияние"
 LUX_fascism_idea_desc:0 "Наша нация загнала себя в угол демократическими договорами и демонтажем, которые превратили нашу великую страну в посмешище. Только националистическим рвением мы можем вернуть себе честь нашей нации."
 LUX_democratic_idea:0 "Демократическое влияние"
 LUX_democratic_idea_desc:0 "Будущее Люксембурга связано с демократией. Жозеф Беш и Rietspartei до сих пор направляли страну и пользуются полной поддержкой народа."
 LUX_neutrality_idea:0 "Роялистское влияние"
 LUX_neutrality_idea_desc:0 "Нейтралитет давно стал путём Люксембурга и приносил переменный успех. На этот раз мы остаёмся в стороне от грядущих конфликтов не по желанию, а по необходимости."
 communist_neighbours:0 "коммунистические соседи"
 communist_neighbours_desc:0 "Присутствие поблизости коммунистического государства сделало и эту страну более восприимчивой к коммунизму."
 LUX_armed_deterrence:0 "Вооружённое сдерживание"
 LUX_armed_deterrence_desc:0 "Испытайте свои армии у стен Люксембурга — капитуляции не будет."
 BEL_defense_of_the_benelux:0 "Оборона Бенилюкса"
 LUX_steel_mills:0 "Aciéries Réunies de Burbach-Eich-Dudelange"
 LUX_steel_mills_desc:0 "Aciéries Réunies de Burbach-Eich-Dudelange, сокращённо ARBED, — сталелитейный конгломерат, созданный в начале этого века. Он быстро стал крупным производителем и теперь действует во многих странах, не ограничиваясь Европой."
 LUX_sola:0 "Société Luxembourgeoise d'Armes"
 LUX_atelier_de_petange:0 "Les Ateliers de Pétange"
 LUX_hadir:0 "Hauts-Furneaux et Aciéries de Differdange, St-Ingbert, Rumelange"
 LUX_esch_archette_aerodrome:0 "S.A. pour l'Aménagement et l'Exploitation de l'Aérodrome d'Esch/Alzette"
 LUX_luxair:0 "Luxair"
 LUX_radio_luxembourg:0 "Compagnie Luxembourgeoise de Radiodiffusion"
 LUX_radio_luxembourg_desc:0 "С постепенным распространением радио вскоре появилось полулегальное вещание. Из таких предприятий возникла Compagnie Luxembourgeoise de Radiodiffusion, сокращённо CLR. Её предшественники были крупными новаторами многоязычного вещания, поэтому недавно основанную CLR ждёт многообещающее будущее."
 LUX_train_manufacturer:0 "Société Nationale des Chemins de Fer Luxembourgeois"
 LUX_train_manufacturer_desc:0 "Эта государственная компания появилась после национализации и объединения нескольких частных железнодорожных предприятий в Société Nationale des Chemins de Fer Luxembourgeois."
 LUX_construction_company:0 "Karp-Kneip Luxembourg"
 LUX_construction_company_desc:0 "Основанная Корнеем Карп-Кнайпом в 1898 году строительная фирма получила репутацию надёжного делового партнёра, особенно в дорожном строительстве."
 LUX_lou_hemmer:0 "Лу Хеммер"
 LUX_henri_stein:0 "Анри Штайн"
 LUX_edouard_kremmer:0 "Эдуар Креммер"
 BEL_LUX_customs_union:0 "Бельгийско-Люксембургский экономический союз"
 LUX_prepareforwar:0 "Подготовиться к войне"
 LUX_prepareforwar_desc:0 "Война, которая должна была положить конец всем войнам, ничего не закончила. Великие державы по обе стороны от нас вновь мобилизуются, и Люксембург должен быть готов защищать свой народ."
 LUX_boostindustry:0 "Развивать промышленность"
 LUX_boostindustry_desc:0 "Страна без процветающей промышленности обречена рухнуть под собственным весом. На пороге войны Люксембургу жизненно важно иметь средства для самостоятельного обеспечения обороны."
 LUX_radioluxembourg:0 "Радио Люксембург"
 LUX_radioluxembourg_desc:0 "Радио Люксембург, расположенное в нашей великой столице, позволяет вещателям охватывать аудиторию по всей Европе, разрушать монополию Британской вещательной корпорации и возвращать коммерческое радио в Великобританию и Ирландию."
 LUX_feierwon:0 "Feierwon"
 LUX_feierwon_desc:0 "«Приходите сюда из Франции, Бельгии, Пруссии,\nмы покажем вам нашу родину,\nспросите во все стороны:\nмы хотим остаться теми, кто мы есть»."
 LUX_realism:0 "Реализм"
 LUX_realism_desc:0 "Хотя дух Люксембурга силён, страна не может позволить себе агрессивную позицию в войне. Мы будем действовать с величайшей заботой о народе и нейтралитете."
 LUX_idealism:0 "Идеализм"
 LUX_idealism_desc:0 "В нынешние времена пассивность равна смерти. Если мы не начнём действовать первыми, нас сметёт одна из надвигающихся держав. Под руководством Эмиля Спеллера Люксембург больше не будут недооценивать."
 LUX_lucilinburhuc:0 " Lucilinburhuc"
 LUX_lucilinburhuc_desc:0 "Люксембургская крепость веками служила краеугольным камнем нашей страны. Договоры вынудили нас демонтировать большую часть укреплений, но сейчас безопасность великой крепости важнее, чем когда-либо."
 LUX_luxvictor:0 "Lux Victor"
 LUX_luxvictor_desc:0 "Нас взвесили, измерили и не нашли недостатков. Да здравствуют герцогиня и Люксембург!"
 LUX_joseph_schusterline:0 "Линия Шустера"
 LUX_joseph_schusterline_desc:0 "Враждебность с востока необходимо остановить. Жозеф Шустер разработал оборонительную линию вдоль восточной границы, чтобы не допустить вражеских солдат на нашу территорию и сохранить суверенитет."
 LUX_grandducalgendarmerie:0 "Великогерцогская жандармерия"
 LUX_grandducalgendarmerie_desc:0 "Правоохранительная бригада обеспечит безопасность улиц и при необходимости встанет на защиту страны."
 LUX_restoretheauxiliaries:0 "Восстановить вспомогательные части"
 LUX_restoretheauxiliaries_desc:0 "Накануне войны каждый желающий гражданин должен быть готов сражаться. Усилив нынешние войска вспомогательными частями, мы, возможно, выстоим в грядущем конфликте."
 LUX_volunteerarmy:0 "Добровольческая армия"
 LUX_volunteerarmy_desc:0 "Сейчас как никогда Люксембург зависит от храбрых граждан, готовых исполнить долг и защищать страну от внешних угроз."
 LUX_expandthesteelworks:0 "Расширить сталелитейные заводы"
 LUX_expandthesteelworks_desc:0 "Наши земли давно славятся качественной сталью. Пусть ресурсы ограничены, расширение сталелитейного производства позволит Люксембургу сохранить конкурентоспособность на мировом рынке."
 LUX_modernizetherails:0 "Модернизировать железные дороги"
 LUX_modernizetherails_desc:0 "Национальная идентичность тесно связана с железными дорогами, соединяющими нас с обеими великими державами. В ближайшие годы модернизация сети отвечает нашим интересам."
 LUX_sandweilerairport:0 "Поддержать авиашоу"
 LUX_sandweilerairport_desc:0 "Пусть Люксембург мал и пока располагает лишь одной взлётной полосой, организация авиашоу способна пробудить интерес к авиации."
 LUX_war:0 "Готовы к войне"
 LUX_war_desc:0 "Да спасёт нас всех Бог."
 LUX_arcelormittal:0 "ARBED"
 LUX_arcelormittal_desc:0 "Национализировав сталелитейные предприятия ARBED, наша крошечная страна станет предметом зависти всего промышленного мира."
 LUX_beneluxair:0 "Поддержать местных производителей"
 LUX_beneluxair_desc:0 "Единственная надежда создать собственные самолёты — опереться на немногочисленных талантливых изобретателей, способных копировать и улучшать иностранные проекты."
 LUX_princehenrinetwork:0 "Сеть Принца Анри"
 LUX_princehenrinetwork_desc:0 "Последнее столетие сеть Принца Анри хорошо служила народу. Однако в последние годы прибыль снизилась, а конкуренция усилилась. Национализация железных дорог позволит сохранить необходимую современной эпохе эффективность."
 LUX_maximiseefficiency:0 "Максимизировать эффективность"
 LUX_maximiseefficiency_desc:0 "Эффективность необходима для удовлетворения растущих потребностей страны. От патронов до бинтов — наши фабрики будут безупречны."
 LUX_qualityoverquantity:0 "«Качество важнее количества»"
 LUX_qualityoverquantity_desc:0 "Пусть нам не хватает пространства, мастерство Люксембурга может стать легендарным: каждая пуля — мазок кисти, а каждая винтовка — произведение искусства."
 LUX_militaryfocus:0 "Военный приоритет"
 LUX_militaryfocus_desc:0 "Если мы не создадим военную промышленность, от страны ничего не останется. Все усилия должны быть направлены на люксембургскую военную машину."
 LUX_civilianfocus:0 "Гражданский приоритет"
 LUX_civilianfocus_desc:0 "Народ важнее военных приготовлений. Сильная гражданская промышленность обеспечит населению жизнь, пусть даже не свободу."
 LUX_foreignexperts:0 "Иностранные специалисты"
 LUX_foreignexperts_desc:0 "Пригласив в наши залы лучших и самых ярких людей, мы сможем добиться больших успехов в технологиях, которые намного превосходят наших более крупных соседей."
 LUX_universititvultzebuerg:0 "Universitéit vu Lëtzebuerg"
 LUX_universititvultzebuerg_desc:0 "Предложено создать университет, который соберёт величайшие умы страны. Мы способны воплотить эту идею."
 LUX_luxembourgcanintospace:0 "Люксембург может в космос"
 LUX_luxembourgcanintospace_desc:0 "Раз мы зашли так далеко, пути назад уже нет."
 LUX_rietspartei:0 "Rietspartei"
 LUX_rietspartei_desc:0 "Будущее Люксембурга связано с демократией. Жозеф Беш и Rietspartei до сих пор направляли страну и пользуются полной поддержкой народа."
 LUX_strengthenties:0 "Укрепить связи"
 LUX_strengthenties_desc:0 "Демократия не способна процветать в одиночестве. Чтобы быть свободной и оставаться свободной страной, мы должны мудро выбирать союзников."
 LUX_benelux:0 "Бенилюкс"
 LUX_benelux_desc:0 "Друзья познаются в беде..."
 LUX_protectorsofliberte:0 "Защитники свободы"
 LUX_protectorsofliberte_desc:0 "Союзники — наши друзья и защитники. Союз с ними является единственным способом сохранить суверенитет."
 LUX_friendsnear:0 "Близкие друзья"
 LUX_friendsnear_desc:0 "Страны Нижних Земель — наши ближайшие союзники, разделяющие культуру и тревоги. Более тесные отношения будут взаимовыгодными."
 LUX_friendsafar:0 "Далёкие друзья"
 LUX_friendsafar_desc:0 "В прошлой войне мы сохраняли нейтралитет, но Германия нарушила наш суверенитет, а свободу вернули лишь союзники. На этот раз мы сделаем правильный выбор."
 LUX_bastion_of_democracy:0 "Бастион демократии"
 LUX_bastion_of_democracy_desc:0 "Террор Гитлера угрожает всем нам! Весь Люксембург един в стремлении положить конец фашистской угрозе в Европе."
 LUX_luxembourgneutrality:0 "Люксембургский нейтралитет"
 LUX_luxembourgneutrality_desc:0 "Нейтралитет давно стал путём Люксембурга и приносил переменный успех. На этот раз мы остаёмся в стороне от грядущих конфликтов не по желанию, а по необходимости."
 LUX_luxembourgianrevanchism:0 "Люксембургский реваншизм"
 LUX_luxembourgianrevanchism_desc:0 "Пусть сегодня это кажется фарсом, когда-то Люксембург был значительной страной Европы. В столь странные времена разве не может он стать ею снова?"
 LUX_theduchess:0 "Герцогиня"
 LUX_theduchess_desc:0 "Решение лишить монарха власти было ошибкой. В эти тревожные времена единственным истинным лидером Люксембурга остаётся наша герцогиня — Fir Gott an Duchesse!"
 LUX_easternwinds:0 "Восточные ветры"
 LUX_easternwinds_desc:0 "Банкиры и предприниматели из элиты слишком долго угнетали народ Люксембурга. Теперь мы вернём себе страну!"
 LUX_supporttheright:0 "Поддержать правых"
 LUX_supporttheright_desc:0 "Наша нация загнала себя в угол демократическими договорами и демонтажем, которые превратили нашу великую страну в посмешище. Только националистическим рвением мы можем вернуть себе честь нашей нации."
 LUX_deterrence:0 "Сдерживание"
 LUX_deterrence_desc:0 "В прошлых войнах мы дорого заплатили за свои усилия. Люксембург усвоил урок: отныне мы сражаемся только за себя."
 LUX_armeddeterrence:0 "Вооружённое сдерживание"
 LUX_armeddeterrence_desc:0 "Германия не собирается уважать наш нейтралитет, а Франция давно стремится отнять наши земли. Если никто не желает считаться с нейтралитетом, мы заставим их."
 LUX_kommunisteschparteiltzebuerg:0 "Kommunistesch Partei Lëtzebuerg"
 LUX_kommunisteschparteiltzebuerg_desc:0 "Москва слишком далеко и ничего нам не даст. Люксембург и только Люксембург принесёт революцию в Европу."
 LUX_frenchinsurrectionists:0 "Французские повстанцы"
 LUX_frenchinsurrectionists_desc:0 "Дух революции силён среди наших французских братьев. Взаимная поддержка КПЛ и Французской коммуны несомненно послужит общему делу."
 LUX_spreadtherevolution:0 "Распространить революцию"
 LUX_spreadtherevolution_desc:0 "Слышите, бельгийский брат и голландская сестра? Это звук революции!"
 LUX_friendsveryafar:0 "ОЧЕНЬ далёкие друзья"
 LUX_friendsveryafar_desc:0 "Москва — родина коммунизма, могущественный союзник и достойный товарищ. Наши страны далеки друг от друга, но близки духом!"
 LUX_rexluxembourg:0 "Regina Luxembourg"
 LUX_rexluxembourg_desc:0 "Наша герцогиня не склонится ни перед одним диктатором! Славное правление Люксембурга наконец началось."
 LUX_volksdeutschebewegung:0 "Volksdeutsche Bewegung"
 LUX_volksdeutschebewegung_desc:0 "Переговоры проведены, планы подготовлены. Ради безопасности страны мы должны объединиться с Гитлером — на равных или нет."
 LUX_retakebitburg:0 "Вернуть Битбург"
 LUX_retakebitburg_desc:0 "Наша храбрая страна не боится немецкой военной машины. Мы вернём земли, украденные пруссаками, или погибнем в попытке!"
 LUX_retakemoselle:0 "Вернуть Мозель"
 LUX_retakemoselle_desc:0 "Французы слишком долго удерживали украденные у нас земли. Почти четыреста лет спустя Люксембург исправит эту несправедливость."
 LUX_retakeareleland:0 "Вернуть Арелерланд"
 LUX_retakeareleland_desc:0 "Самая жестокая потеря от рук бельгийских революционеров не забыта. Пусть Бенилюкс связывает нас вместе, эту несправедливость нельзя оставить без ответа."
 LUX_military:0 "Военные усилия"
 LUX_military_desc:0 "Теперь промышленность и инфраструктура готовы, и можно сосредоточиться на подготовке Люксембурга к искусству современной войны."
 LUX_tank:0 "Теоретические проекты танков"
 LUX_tank_desc:0 "Преимущество наличия таких милитаристских соседей заключается в том, что можно наблюдать последние технологические ужасы."
 LUX_navy:0 "Развитие флота"
 LUX_navy_desc:0 "Люксембург никогда не имел выхода к морю, не говоря уже о морской мощи. Сегодня мы исправим это."
 LUX_destroyer:0 "Эсминцы"
 LUX_destroyer_desc:0 "Как бы заманчиво ни было сразу создать морских гигантов, наводящих ужас на моря, начнём с малого."
 LUX_benelux_military_cooperation:0 "Военное сотрудничество Бенилюкса"
 LUX_benelux_military_cooperation_desc:0 "Поскольку мы зависим от военной поддержки наших соседей, мы должны создать совместный офицерский штаб, специализирующийся на защите от наших соседей, которые также являются нашими вероятными врагами."
 r56_LUX_cut_back_workers_rights:0 "Сокращение прав трудящихся"
 r56_LUX_strengthened_agriculture:0 "Укреплённое сельское хозяйство"
 r56_LUX_ministry_of_economics_i:0 "Министерство экономики"
 r56_LUX_ministry_of_labour_i:0 "Министерство труда"
 r56_LUX_ministry_of_interior_i:0 "Министерство внутренних дел"
 r56_LUX_ministry_of_foreign_affairs_i:0 "Министерство иностранных дел"
 r56_LUX_ministry_of_army_i:0 "Министерство армии"
 r56_LUX_economic_dependence:0 "Экономическая зависимость"
 r56_LUX_economic_dependence_desc:0 "Промышленность Люксембурга недостаточно велика, чтобы обеспечивать себя самостоятельно, поэтому она зависит от импорта железа из Франции и экспорта стали в Германию."
 r56_LUX_polarized_society:0 "Поляризованное общество"
 r56_LUX_polarized_society_desc:0 "После референдума по Маулькорфгезетцу страна расколота между сторонниками запрета КПЛ и противниками подобных действий. Чтобы устранить возникший разрыв, потребуются огромные усилия."
 r56_LUX_farm_subsidies:0 "Сельскохозяйственные субсидии"
 r56_LUX_farm_subsidies_desc:0 "Фермеры как основа любой страны заслуживают признания и средств для получения стабильного дохода. Эти субсидии обеспечивают такую возможность."
 r56_LUX_strengthened_rural_communities:0 "Укреплённые сельские общины"
 r56_LUX_policy_of_free_hands:0 "Политика свободных рук"
 r56_LUX_policy_of_free_hands_desc:0 "Чтобы сохранить нейтралитет, необходимо заключать сделки со всеми и не позволять идеологическим различиям мешать защите независимости."
 r56_LUX_defensive_focus:0 "Оборонительный приоритет"
 r56_LUX_defensive_focus_desc:0 "У нас нет возможностей для наступления в случае войны, поэтому все усилия необходимо сосредоточить на защите страны."
 r56_LUX_focused_radio_efforts:0 "Сосредоточенные усилия в области РЛС и радио"
 r56_LUX_focused_radio_efforts_desc:0 "Мы прекратили большую часть гражданского радиовещания, чтобы вооружённым силам было проще защищать страну."
 r56_LUX_banned_aid:0 "Запрещена международная помощь"
 r56_LUX_banned_aid_desc:0 "Чтобы показать, насколько мы привержены нашему нейтралитету, мы запретили международную помощь. [ROOT.GetAdjectiveCap] Оружейная земля в руках воюющих стран."
 r56_LUX_union_against_extremism:0 "Союз против экстремизма"
 r56_LUX_union_against_extremism_desc:0 "Социалисты поляризовали страну, угрожают государству [ROOT.GetNameDef] и не должны обладать влиянием."
 r56_LUX_motto:0 "Mir Wëlle Bleiwe Wat Mir Sinn"
 r56_LUX_motto_desc:0 "Национальный девиз государства [ROOT.GetName] восходит к 1859 году и приблизительно переводится как «Мы хотим остаться теми, кто мы есть»."
 r56_LUX_continuing_the_fight:0 "Продолжение борьбы"
 r56_LUX_continuing_the_fight_desc:0 "Хотя мы капитулировали, но не сдались. Государство [ROOT.GetNameDefCap] выстоит и однажды освободит свои земли от оккупации!"
 r56_LUX_peace_in_our_times:0 "Мир в наше время"
 r56_LUX_peace_in_our_times_desc:0 "Годы нейтралитета окупились. Государство [ROOT.GetNonIdeologyName] сохранило мир и обеспечило его долговечность."
 r56_LUX_capital_of_europe:0 "Столица Европы"
 r56_LUX_capital_of_europe_desc:0 "Государство [ROOT.GetNameDefCap] находится в сердце Европы, имеет три официальных языка и сыграло ключевую роль в европейской дипломатии и Лиге Наций."
 r56_LUX_privatising_industry:0 "Приватизация промышленности"
 r56_LUX_privatising_industry_desc:0 "Новое либеральное правительство наконец получило возможность продвигать приватизацию и частную собственность."
 r56_LUX_lowered_taxes:0 "Низкая налоговая ставка"
 r56_LUX_lowered_taxes_desc:0 "Низкие налоги облегчают положение населения и увеличивают движение капитала, что в конечном счёте ведёт к экономическому росту."
 r56_LUX_initial_rearmament:0 "Начальное перевооружение"
 r56_LUX_initial_rearmament_desc:0 "Для защиты государства [ROOT.GetNameDef] необходима хорошая армия. Десятилетия разоружения привели к почти полному исчезновению вооружённых сил. Этот процесс необходимо обратить вспять."
 r56_LUX_benelux_customs_union:0 "Экономический союз Бенилюкса"
 r56_LUX_benelux_customs_union_desc:0 "После установления [ROOT.GetFactionName]Члены организации приняли решение отменить пограничный контроль между собой в пользу свободной торговли."
 r56_LUX_unified_command:0 "Единая структура командования"
 r56_LUX_unified_command_desc:0 "Хорошая командная структура действует максимально слаженно. Мы этого добились, и теперь нас ничто не остановит."
 r56_LUX_united_and_ready:0 "Едины и готовы"
 r56_LUX_united_and_ready_desc:0 "Нижние Земли гордо противостоят любому противнику. Вместе мы выстоим и добьёмся процветания."
 r56_LUX_beating_the_giant:0 "Победа над гигантом"
 r56_LUX_beating_the_giant_desc:0 "Поодиночке мы бессильны против государства [GER.GetNameDef]. Но вместе сможем победить и наконец устранить восточную угрозу."
 r56_LUX_benelux_alliance:0 "Участник Бенилюкса"
 r56_LUX_benelux_alliance_desc:0 "Эта страна присоединилась к Бенилюксу, чтобы защищать себя и свои интересы."
 r56_LUX_increased_education_budget:0 "Увеличенный бюджет образования"
 r56_LUX_increased_education_budget_desc:0 "Как инвестиция в следующее поколение образование является важнейшей обязанностью государства."
 r56_LUX_agressive_benelux:0 "Агрессивная внешняя политика"
 r56_LUX_agressive_benelux_desc:0 "Мы объединились, но ещё не собрали под одним знаменем всех мужчин и женщин, считающих себя жителями Бенилюкса."
 r56_LUX_fair_economy:0 "Справедливая экономика"
 r56_LUX_fair_economy_desc:0 "Не люди должны служить экономике, а экономика — людям."
 r56_LUX_abolished_monarchy:0 "Монархия упразднена"
 r56_LUX_abolished_monarchy_desc:0 "Мы наконец освободились от тирании монархии. Прошлое осталось позади, и теперь перед нами открыто будущее."
 r56_LUX_socialist_future:0 "Социалистическое будущее"
 r56_LUX_socialist_future_desc:0 "Цепи прошлого сброшены, и пролетариат теперь свободен самостоятельно создавать своё будущее!"
 r56_LUX_republican_humanism:0 "Республиканский гуманизм"
 r56_LUX_republican_humanism_desc:0 "Хотя монархия несправедливо правила государством [ROOT.GetNonIdeologyName], её представители всё равно являются людьми и заслуживают уважения и прав, как и любой другой человек."
 r56_LUX_socialist_constitution:0 "Социалистическая конституция"
 r56_LUX_socialist_constitution_desc:0 "Для того чтобы лучше подтолкнуть рабочую революцию, необходимо было изменить конституцию в пользу социалистов и пролетариата."
 r56_LUX_volunteers:0 "[ROOT.GetAdjectiveCap]ий добровольческий корпус"
 r56_LUX_volunteers_desc:0 "Для защиты наших интересов за рубежом и помощи союзникам необходимо быть готовыми отправить войска в любой возникающий конфликт."
 r56_LUX_nationalised_companies:0 "Национализированные компании"
 r56_LUX_nationalised_companies_desc:0 "Многие крупные компании эксплуатировали рабочих ради накопления капитала. Теперь их прежним владельцам придётся влиться в ряды пролетариата, поскольку предприятия им больше не принадлежат."
 r56_LUX_struggle_for_equality:0 "Борьба за равенство"
 r56_LUX_struggle_for_equality_desc:0 "Равенство — не постоянное состояние, а процесс, который необходимо непрерывно поддерживать. И всё же усилия того стоят."
 r56_LUX_collectivized_economy:0 "Коллективизированная экономика"
 r56_LUX_collectivized_economy_desc:0 "Чтобы каждый трудящийся мужчина и каждая женщина получали пользу от экономики, фабрики и фермы должны принадлежать им."
 r56_LUX_soviet_dominated_trade:0 "Торговля под влиянием Советов"
 r56_LUX_soviet_dominated_trade_desc:0 "Поскольку государство [SOV.GetNameDef] является нашим идеологическим союзником, нам удалось заключить с ним выгодные торговые соглашения."
 r56_LUX_developing_autarkic_economy:0 "Развитие автаркической экономики"
 r56_LUX_developing_autarkic_economy_desc:0 "Мы будем стремиться к автаркии, чтобы обрести беспрецедентную независимость."
 r56_LUX_autarkic_economy:0 "Автаркическая экономика"
 r56_LUX_autarkic_economy_desc:0 "Чтобы сохранить экономическую, а следовательно и политическую независимость, мы приняли автаркическую модель экономики."
 r56_LUX_socialist_society:0 "Социалистическое общество"
 r56_LUX_socialist_society_desc:0 "Мы наконец перешли от капиталистического общества к социалистическому — естественному этапу развития на пути к коммунистическому обществу и государству."
 r56_LUX_via:0 "VIA"
 r56_LUX_via_desc:0 "VIA, или Volkskommissariat für innere Angelegenheiten, — тайная полиция государства [ROOT.GetNameDef], известная и внушающая страх во всём мире."
 r56_LUX_socialist_science:0 "Социалистическая наука"
 r56_LUX_socialist_science_desc:0 "В современном мире наука решает всё. Но и она ничего не значит без идеологической основы социализма."
 r56_LUX_patriotic_constitution:0 "Патриотическая конституция"
 r56_LUX_patriotic_constitution_desc:0 "Чтобы надёжно закрепить коммунизм в стране, конституция должна усиливать государственный контроль."
 r56_LUX_antifascist_volunteers:0 "Антифашистские добровольцы"
 r56_LUX_antifascist_volunteers_desc:0 "Важнейшая борьба современности — борьба с фашизмом. Он угрожает странам, народам и равенству каждого мужчины и каждой женщины."
 r56_LUX_agitated_youth:0 "Агитированная молодёжь"
 r56_LUX_agitated_youth_desc:0 "Luxemburger Volksjugend — организация, подобная Гитлерюгенду в государстве [GER.GetNameDef]. Она распространяет фашистские идеи и обеспечивает поддержку со стороны следующего поколения."
 r56_LUX_dennemeyers_propaganda:0 "Пропаганда Деннемейера"
 r56_LUX_dennemeyers_propaganda_desc:0 "Камиль Деннемейер — гений пропаганды, умеющий убеждать людей и воздействовать на их эмоции, что крайне полезно для распространения фашизма."
 r56_LUX_political_support:0 "Политическая поддержка"
 r56_LUX_political_support_desc:0 "Создав новую партию, мы получили возможность выйти на политическую арену и заручиться поддержкой как народа, так и правительства."
 r56_LUX_german_funding:0 "Немецкая финансовая"
 r56_LUX_german_funding_desc:0 "Более развитый [GER.GetAdjectiveCap] Наша отрасль может помочь нам, что также увеличивает [GER.GetAdjectiveCap] популярность среди них [ROOT.GetAdjectiveCap] людей."
 r56_LUX_anti_french_sentiments:0 "Антифранцузские настроения"
 r56_LUX_anti_french_sentiments_desc:0 "Франция повлияла на историю [ROOT.GetNameDef]Это ясно. Кроме того, становится все более очевидным для народа, что это влияние разрушает нацию. [GER.GetAdjectiveCap] Идентичность и корни."
 r56_LUX_fascist_army:0 "Вербовка в фашистскую армию"
 r56_LUX_fascist_army_desc:0 "В армию проникли фашисты, которые теперь в основном вербуют единомышленников."
 r56_LUX_all_luxembourgish_societies:0 "Общелюксембургские общества"
 r56_LUX_all_luxembourgish_societies_desc:0 "Мы наблюдаем возрождение националистических обществ, поклявшихся любой ценой защищать нацию и её идентичность."
 r56_LUX_professional_army:0 "Профессиональная армия"
 r56_LUX_professional_army_desc:0 "Профессиональная армия государства [GER.GetNonIdeologyName] внушает страх в бою и почти не имеет равных по уровню подготовки."
 r56_LUX_political_army:0 "Политизированная армия"
 r56_LUX_political_army_desc:0 "Сильной нации нужна сильная армия, безоговорочно верная правительству и исполняющая его волю."
 r56_LUX_unbeaten_in_battle:0 "Непобеждённые в бою"
 r56_LUX_unbeaten_in_battle_desc:0 "«Im Felde Unbesiegt» или «Unbeaten in Battle» — девиз для всех, кто не участвовал в боях. [ROOT.GetAdjectiveCap] Вооруженные силы, демонстрирующие нашу подавляющую мощь и силу воли."
 r56_LUX_taxes_germany:0 "Налоги государству [GER.GetNameDef]"
 r56_LUX_taxes_germany_desc:0 "Как неотъемлемая часть государства [GER.GetNameDef], мы обязаны платить налоги центральному правительству. Однако рост экономического производства способен смягчить их последствия."
 r56_LUX_german_manpower:0 "[GER.GetAdjectiveCap]ие людские ресурсы"
 r56_LUX_german_manpower_desc:0 "Чтобы сохранить контроль над страной, государство [GER.GetNameDef] направляет нам людей для поддержки сил безопасности."
 r56_LUX_treaty_of_london_signatory:0 "Подписант Лондонского договора"
 r56_LUX_treaty_of_london_signatory_desc:0 "Эта страна обязалась поддерживать государство [LUX.GetNameDef] и должна будет защитить его в случае нападения."
 r56_LUX_treaty_of_london_signatory_tt:0 "§RЕсли государство [LUX.GetNameDef] подвергнется нападению, нам придётся защитить его, иначе мы получим репутацию ненадёжного союзника.§!"
 r56_LUX_untrustworthy_ally:0 "Ненадёжный союзник"
 r56_LUX_untrustworthy_ally_desc:0 "Государство [ROOT.GetNameDefCap] известно своей ненадёжностью, поскольку не защитило государство [LUX.GetNameDef], хотя было обязано это сделать."
 r56_LUX_restored_neutrality:0 "Восстановленный нейтралитет"
 r56_LUX_restored_neutrality_desc:0 "Создав способную к обороне страну, государство [ROOT.GetNameDef] восстановило нейтралитет и стало стойкой нацией."
 r56_LUX_total_neutrality:0 "Полный нейтралитет"
 r56_LUX_total_neutrality_desc:0 "Как гарант мира, мы объявили полный нейтралитет."
 LUX_looming_strikes:0 "Надвигающиеся забастовки"
 LUX_looming_strikes_desc:0 "Положение в Люксембурге остаётся напряжённым. Правительство не сумело должным образом решить вопросы социальной справедливости. Народ наконец требует действий, и забастовка, похоже, стала неизбежной."
 LUX_chamberofdeputies:0 "Палата депутатов"
 LUX_ministries:0 "Министерства"
 LUX_form_government_mission:0 "Сформировать правительство"
 LUX_ally_socialists_tt:0 "Открывает §Hкоммунистических§! и §Hсоциал-демократических министров§!."
 LUX_maintain_governmental_positions_tt:0 "Открывает §Hлиберальных§! и §Hконсервативных министров§!."
 LUX_ally_socialists:0 "Заключить союз с другими социалистами"
 LUX_allied_socialists:0 "§HДругие социалисты стали союзниками§!"
 LUX_maintain_governmental_positions:0 "Сохранить правительственные должности"
 LUX_maintained_governmental_positions:0 "§HПравительственные должности сохранены§!"
 LUX_start_talks_with_left:0 "Начать переговоры с левыми"
 LUX_started_talks_with_left:0 "§HПереговоры с левыми начаты§!"
 LUX_negotiate_with_former_ministers:0 "Провести переговоры с бывшими министрами"
 LUX_negotiated_with_former_ministers:0 "§HПереговоры с бывшими министрами проведены§!"
 LUX_form_government_mission_trigger:0 "Нанято §H5 министров§!"
 LUX_gain_new_iron_sources:0 "Получить новые источники железа"
 LUX_gain_new_iron_sources_desc:0 "Железо является опорой нашей промышленности, особенно сталелитейной. Необходимо обеспечить стабильное снабжение этим ценным ресурсом."
 LUX_find_new_export_partners:0 "Найти новых экспортных партнёров"
 LUX_find_new_export_partners_desc:0 "Наше партнёрство с Германией имеет долгую историю, но больше не может оставаться единственным. Следует диверсифицировать экспорт, чтобы сохранить экономическую независимость."
 LUX_import_belgian_raw_materials:0 "Импортировать сырьё из Бельгии"
 LUX_import_belgian_raw_materials_desc:0 "Бельгийско-Люксембургский экономический союз открыл эпоху сотрудничества между нашими странами. Следующим шагом станет использование бельгийского железа на люксембургских предприятиях."
 LUX_neutrality_balance_convert_factories:0 "Переоборудовать военные заводы"
 LUX_neutrality_balance_convert_factories_desc:0 "Как нейтральная страна, мы можем сосредоточиться на гражданском населении, не опасаясь военного вмешательства. Поэтому часть военных заводов следует переоборудовать в гражданские."
 LUX_neutrality_balance_continue_disarmament:0 "Продолжить разоружение"
 LUX_neutrality_balance_continue_disarmament_desc:0 "Армия нам не нужна, поскольку нейтралитет якобы исключает вторжение. Вернув солдат в экономику, мы получим дополнительных рабочих."
 LUX_neutrality_balance_promise_peace:0 "Пообещать мир"
 LUX_neutrality_balance_promise_peace_desc:0 "Чтобы жители государства [ROOT.GetNonIdeologyName] поддержали нейтралитет, необходимо убедить их в отсутствии опасности."
 LUX_neutrality_balance_strengthen_foreign_office:0 "Укрепить министерство иностранных дел"
 LUX_neutrality_balance_strengthen_foreign_office_desc:0 "Лучший способ победить в войне — не допустить её начала. Дипломатия является подходящим инструментом и лучшей подготовкой к конфликту."
 LUX_neutrality_balance_convert_civilian_factory:0 "Переоборудовать гражданские фабрики"
 LUX_neutrality_balance_convert_civilian_factory_desc:0 "Под угрозой иностранных держав мы не можем позволить себе роскошь гражданского производства. Фабрики должны сосредоточиться на выпуске вооружений ради независимости страны!"
 LUX_neutrality_balance_divert_workers:0 "Направить рабочих в армию"
 LUX_neutrality_balance_divert_workers_desc:0 "Многие рабочие государства [ROOT.GetNameDef] заняты в отраслях, у которых не будет будущего после вторжения. Их необходимо призвать в армию ради блага всех жителей страны."
 LUX_neutrality_balance_prepare_defenses:0 "Подготовить оборону"
 LUX_neutrality_balance_prepare_defenses_desc:0 "Государство [ROOT.GetNameDefCap] удобно для обороны, но остаётся уязвимым из-за малочисленного населения и слабой армии. Строительство соответствующих укреплений упростит защиту."
 LUX_neutrality_balance_prepare_for_war:0 "Подготовиться к войне"
 LUX_neutrality_balance_prepare_for_war_desc:0 "Пусть правительство готово перевооружаться и защищать страну, многие жители всё ещё сомневаются в новом курсе. Необходимо убедить их, что перевооружение отвечает общим интересам."
 LUX_open_border_agreement_france:0 "Соглашение об открытой границе с государством [FRA.GetNonIdeologyName]"
 LUX_open_border_agreement_france_desc:0 "Государства [ROOT.GetNonIdeologyName] и [FRA.GetNonIdeologyName] долгие годы поддерживали выгодное партнёрство. Новые торговые соглашения помогут снизить зависимость от их железа."
 LUX_open_border_agreement_belgium:0 "Соглашение об открытой границе с государством [BEL.GetNonIdeologyName]"
 LUX_open_border_agreement_belgium_desc:0 "Государство [BEL.GetNonIdeologyName] давно является нашим партнёром. Пришло время заключить новые сделки, чтобы дешевле импортировать его железо."
 LUX_open_border_agreement_netherlands:0 "Соглашение об открытой границе с государством [HOL.GetNonIdeologyName]"
 LUX_open_border_agreement_netherlands_desc:0 "Хотя государство [HOL.GetNameDef] долгие годы управляло государством [ROOT.GetNonIdeologyName], наши страны по-прежнему поддерживают хорошие отношения — идеальную основу для углубления торговли."
 LUX_currently_developing:0 "Сейчас развитие не ведётся"
 LUX_regional_development_decision:0 "Региональное развитие в регионе [FROM.GetName]"
 LUX_regional_development_decision_desc:0 "Необходимо обеспечить населению приемлемый уровень жизни. Для этого можно инвестировать в развитие различных регионов."
 r56_LUX_revolutionary_army:0 "Революционная армия"
 r56_LUX_revolutionary_army_desc:0 "Армию можно использовать как средство политического переустройства. Так мы обеспечим её верность правительству и революции."
 r56_LUX_politicised_army:0 "Политизированная армия"
 r56_LUX_politicised_army_desc:0 "Мы должны рассматривать армию как продолжение государства, проводящее социализм и защищающее революцию."
 r56_LUX_red_army:0 "[ROOT.GetAdjectiveCap]ая Красная армия"
 r56_LUX_red_army_desc:0 "По мере укрепления власти социалистов армия превращается в Красную армию, воплощающую социалистические идеалы нации."
 LUX_integrate_western_lands:0 "Интегрировать западные земли"
 LUX_integrate_western_lands_desc:0 "Соседние государства на западе являются культурными. [ROOT.GetAdjectiveCap]. Они должны быть интегрированы [GER.GetNameDef]."
 LUX_fascist_balance_fascist_propaganda:0 "Распространять фашистскую пропаганду"
 LUX_fascist_balance_fascist_propaganda_desc:0 "Наш пропагандистский аппарат прекрасно распространяет идеи и эффективно убеждает других сражаться за них."
 LUX_fascist_balance_fascist_propaganda_tt:0 "Ежедневное изменение баланса сил в сторону §Hгерманской идентичности§!: £BoP_right_texticon §H0,30%§!"
 LUX_fascist_balance_continued_army_infiltration:0 "Продолжить проникновение в армию"
 LUX_fascist_balance_continued_army_infiltration_desc:0 "Без поддержки каждого военнослужащего существует реальная вероятность провала. Поэтому верность армии жизненно важна."
 LUX_fascist_balance_additional_funding:0 "Получить дополнительное финансирование"
 LUX_fascist_balance_additional_funding_desc:0 "Хотя большую часть расходов оплатило государство [GER.GetNameDef], некоторые небольшие мероприятия организации остаются без средств. Дополнительное финансирование НСДАП исправит положение."
 LUX_fascist_balance_import_nazis:0 "Тайно переправить немцев через границу"
 LUX_fascist_balance_import_nazis_desc:0 "Требуется квалифицированный персонал, чтобы изменить общественное мнение в пользу [GER.GetNameDef]. Имея опыт работы [GER.GetAdjectiveCap] Членам НСДАП такой процесс становится легким."
 LUX_fascist_balance_bind_army_to_country:0 "Обеспечить верность армии государству [ROOT.GetNonIdeologyName]"
 LUX_fascist_balance_bind_army_to_country_desc:0 "Чтобы остановить иностранное влияние на любимую страну, армия должна оставаться верной ей любой ценой."
 LUX_fascist_balance_show_national_unity:0 "Продемонстрировать национальное единство"
 LUX_fascist_balance_show_national_unity_desc:0 "Наша страна далека от национальной однородности, но мы остаёмся единым народом. Это должны понять как жители, так и противники."
 LUX_fascist_balance_lobby_for_political_support:0 "Лоббировать политическую поддержку"
 LUX_fascist_balance_lobby_for_political_support_desc:0 "Политическое представительство жизненно важно для наших усилий. Без него мы обречены, поэтому необходимо приложить значительные усилия для получения влияния."
 LUX_fascist_balance_romanticise_past:0 "Романтизировать прошлое"
 LUX_fascist_balance_romanticise_past_desc:0 "Так называемые историки неоднократно пытались развеять мифы о нашем славном прошлом и распространяли о нём ложь. Пришло время вернуть утраченное."
