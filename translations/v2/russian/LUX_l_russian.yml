 LUX_chamberofdeputies_gov_support_trigger_tt:0 "Получена поддержка правительства"
 LUX_ministries_desc_text:0 "Правительство государства [ROOT.GetNameDef] состоит из нескольких министерств. Каждый министр имеет собственные обязанности, отражённые в его должности.\n\nВыбрать подходящего министра бывает непросто, но полезно учитывать §Gнавыки каждого кандидата§!, поскольку от них зависит, чего он сможет добиться. Кроме того, важную роль играет §Hпартийная принадлежность§!. Если министр состоит в определённой партии, она будет считаться частью правительства. В зависимости от §Hпремьер-министра§! назначение представителей некоторых партий §Rтребует дополнительных переговоров§!. У отдельных министров есть собственные планы. Например, многие кандидаты на должность министра экономики §Hследуют партийной линии§!, поэтому следует учитывать, как их назначение повлияет на §Hбудущий курс страны§!."
