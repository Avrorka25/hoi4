 PNG_assimilate_west_papua:0 "Интеграция Западного Папуа"
 PNG_assimilate_west_papua_desc:0 "Остров Папуа никогда не был полностью объединен под одним режимом. Но теперь, когда мы контролируем весь остров, мы можем объединить его раз и навсегда."
 r56.news_event.1121.t:0 "Извержение в Рабауле"
 r56.news_event.1121.desc:0 "«Вулкан Рабаул — один из самых активных и опасных вулканов Папуа — Новой Гвинеи» — известное утверждение многих вулканологов теперь подтвердилось: Вулкан и Тавурвур изверглись одновременно, убив 507 человек и уничтожив весь город Рабаул. Небо заполнил вулканический дым, на несколько часов закрывший солнце, а Рабаул превратился в руины. Правительство мандатной территории было перенесено в более безопасный портовый город Лаэ, находящийся далеко от вулканически активных районов. Пока нет сообщений о том, какие дальнейшие шаги предпримет австралийское правительство, но, похоже, Рабаул почти наверняка никогда полностью не оправится от этой гигантской катастрофы."
 r56.news_event.1121.a:0 "Полная катастрофа. Мир их душам."
 r56.news_event.1121.b:0 "Катастрофа."
