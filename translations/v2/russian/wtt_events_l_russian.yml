l_russian:
 generic.8.t:0 "Повелители атома"
 generic.8.d:0 "Мы применили первое в мире ядерное оружие, прочно заняв лидирующее положение в нынешней гонке вооружений. Наши колоссальные усилия окупились, и теперь миру не остаётся ничего иного, кроме как восхищаться нашей мощью. Возможно, однажды они сравняются с нами, но мы позаботились о том, чтобы им никогда нас не превзойти."
 generic.8.a:0 "Сотрём наших врагов в порошок!"
 generic.9.t:0 "В чужой тени"
 generic.9.d:0 "Другие применили первое в мире ядерное оружие, прочно заняв лидирующее положение в нынешней гонке вооружений. Несмотря на все наши усилия, мы остались без защиты и без средств возмездия. Мы безнадёжно отстаём, и нам не остаётся ничего иного, кроме как удвоить усилия и сократить разрыв, прежде чем они смогут обрушить на мир ещё больше подобных разрушений."
 generic.9.a:0 "Программа должна получить всё, что мы можем выделить."
 generic.10.t:0 "Могущественные друзья"
 generic.10.d:0 "Наши союзники применили первое в мире ядерное оружие, прочно выведя наш альянс вперёд в нынешней гонке вооружений. Хотя нас и превзошли, оружием овладел наш союзник, что гарантирует нам возможность ответного удара, если какой-либо враг тоже покорит атом."
 generic.10.a:0 "Приемлемый исход."
 wtt_denmark.1.t:0 "[ICE.GetAdjective] независимость"
 wtt_denmark.1.d:0 "После вторжения связь была прервана, и [ICE.GetAdjective] парламент взял под контроль внешнюю политику страны. Предполагается, что это временная мера, которая будет действовать до окончания оккупации."
 wtt_denmark.1.a:0 "Пожелаем им удачи."
 news.331.t:0 "[ICE.GetNameDefCap] берёт внешнюю политику под свой контроль"
 news.331.desc:0 "\nПосле капитуляции Дании, партнёра по унии, [ICE.GetAdjective] парламент взял под контроль внешнюю политику страны и тем самым фактически превратил её в полностью независимое государство. Недавно избранный временный губернатор уже провозгласил [ICE.GetAdjective] нейтралитет в нынешнем конфликте, несмотря на вторжение в страну-покровителя."
 news.331.a:0 "Нейтралитет не спас Данию."
 wtt_britain.24.t:0 "Предложение Макдональда"
 wtt_britain.24.d:0 "Нынешняя война создаёт огромную нагрузку на [ENG.GetAdjective] конвои, и наши восточные соседи всё настойчивее стремятся получить доступ к нашим воздушным и военно-морским базам, чтобы расширить зону прикрытия своих конвойных маршрутов. [ENG.GetAdjective] посланник Малкольм Макдональд прибыл с предложением вернуть Северную Ирландию под суверенный [IRE.GetAdjective] контроль в обмен на наше немедленное вступление в войну на стороне государства [ENG.GetNameDef]."
 wtt_britain.24.a:0 "Превосходная идея."
 wtt_britain.24.b:0 "Награда не стоит такой цены."
 wtt_britain.25.t:0 "[ENG.GetAdjective] требование передать французский флот"
 wtt_britain.25.d:0 "[ENG.GetAdjective] корабли появились у основных гаваней нашего флота, и мы получили ультиматум с требованием немедленно передать им наш военно-морской флот. Если мы тотчас не отправим корабли в [ENG.GetAdjective] порты, [ENG.GetAdjective] адмирал угрожает открыть огонь."
 wtt_britain.25.a:0 "У нас нет иного выбора..."
 wtt_britain.25.b:0 "Мы никогда не позволим другой державе забрать наш флот!"
 wtt_britain.26.t:0 "Франция передаёт флот"
 wtt_britain.26.d:0 "Французы приняли мудрое решение и направили свои корабли в наши порты. Теперь французский флот полностью находится под нашим контролем."
 wtt_britain.26.a:0 "По крайней мере, он не достался [GER.GetAdjective]ой стороне."
 wtt_britain.27.t:0 "Франция отвергает ультиматум"
 wtt_britain.27.d:0 "Французы отвергли наши требования. Теперь нам предстоит незавидный выбор: отступить или обратить оружие против недавних союзников."
 wtt_britain.27.a:0 "Мы не можем позволить французскому флоту служить [GER.GetAdjective]им интересам!"
 wtt_britain.27.b:0 "Это слишком неприемлемо. Мы должны отступить."
 news.332.t:0 "Франция передаёт флот"
 news.332.desc:0 "Вчера, [ENG.GetAdjective] Военно-морские подразделения блокировали своих французских коллег на критически важных военно-морских базах в Северной Африке, выдав ультиматум французам отплыть в Северную Африку. [ENG.GetAdjective] порты немедленно и сдать контроль над своим флотом или [ENG.GetAdjective] Они открыли огонь по своему бывшему союзнику. Столкнувшись с превосходящей огневой мощью, французы приняли ультиматум, и их флот оказался под угрозой. [ENG.GetAdjective] Контроль."
 news.332.a:0 "Мудрое решение."
 news.332.b:0 "К счастью, кровопролития удалось избежать."
 news.332.c:0 "Как они посмели?!"
 news.332.d:0 "У нас не было выбора."
 news.332.e:0 "Они продолжат борьбу под [ENG.GetAdjective]им командованием."
 news.333.t:0 "[ENG.GetAdjective] атака у Мерс-эль-Кебира"
 news.333.desc:0 "Вчера, [ENG.GetAdjective] Военно-морские подразделения блокировали своих французских коллег на критически важных военно-морских базах в Северной Африке, выдав ультиматум французам отплыть в Северную Африку. [ENG.GetAdjective] порты немедленно и сдать контроль над своим флотом или [ENG.GetAdjective] Они открыли огонь по своему бывшему союзнику. После того, как французы отказались от [ENG.GetAdjective] В результате перестрелки затонул по крайней мере один французский линкор и серьезно повредил значительную часть французского флота."
 news.333.a:0 "Мы сделали то, что должны были."
 news.333.b:0 "Это возмутительно!"
 news.333.c:0 "Похоже, мы их недооценили."
 news.333.d:0 "Мы ещё долго не забудем это предательство!"
 news.333.e:0 "Они доказали свою решимость."
 wtt_britain.28.t:0 "[IRE.GetNameDefCap] принимает предложение Макдональда"
 wtt_britain.28.d:0 "[IRE.GetAdjective] правительство приняло наше предложение и присоединилось к нашей борьбе в обмен на Северную Ирландию."
 wtt_britain.29.t:0 "[IRE.GetNameDefCap] отвергает предложение Макдональда"
 wtt_britain.29.d:0 "[IRE.GetAdjective] правительство отвергло наше предложение и отказалось присоединиться к нашей борьбе за демократию."
 wtt_britain.29.a:0 "Кто поможет им, когда за ними придут [GER.GetAdjective]ие войска?"
 wtt_britain.30.t:0 "[USA.GetAdjective] экстренные поставки оружия"
 wtt_britain.30.d:0 "При щедрой поддержке [USA.GetAdjective] комитета обороны [ENG.GetAdjective] домов [USA.GetAdjective] правительство направило нам экстренную партию старых винтовок, снаряжения и нескольких артиллерийских орудий. Этот набор слишком разнороден, чтобы пригодиться нашей армии, но он, несомненно, поможет спешно вооружить гарнизоны местной обороны."
 wtt_britain.30.a:0 "Они спасли нас от вторжения!"
 wtt_germany.1.t:0 "Офицеры вермахта бросают вызов Гитлеру"
 wtt_germany.1.d:0 "Копившееся недовольство правлением Гитлера достигло предела из-за кризиса, вызванного решением правительства ремилитаризовать Рейнскую область. Несколько генералов вермахта сплотились вокруг известного фельдмаршала Августа фон Макензена, который привёл в действие планы по свержению Гитлера и устранению нацистской партии от власти в Германии.\n\nРаскол германского верховного командования стал очевиден даже за рубежом, и иностранные державы предпочли не протестовать против ремилитаризации, будучи куда сильнее обеспокоены нарастающей внутренней нестабильностью Германии. Престарелый фельдмаршал действовал быстро и уже сформировал временное правительство, к которому примкнули многие противники нацистского режима.\n\nВоенный переворот уже идёт полным ходом."
 wtt_germany.1.a:0 "Очистим нашу землю от нацистской мрази!"
 wtt_germany.2.t:0 "Немецкие эмигранты присоединяются к нашей борьбе"
 wtt_germany.2.d:0 "Многие изгнанные немецкие товарищи устремились к нам после недавних жестоких преследований и принудительной высылки с родины. Из этих рвущихся в бой добровольцев мы сформировали несколько дивизий с собственным командованием, и теперь они готовы сражаться с нашими врагами!"
 wtt_germany.3.t:0 "Германия отменяет изгнание Вильгельма II"
 wtt_germany.3.d:0 "Германия пригласила Вильгельма II вернуться на родину в качестве кайзера. После недавних бурных событий это может помочь немцам восстановить мир и стабильность в стране. Взоры всего мира обращены на нас, ведь многие ещё не забыли ужасающий конфликт, в который старый кайзер вверг нас всего два десятилетия назад."
 wtt_germany.3.a:0 "Мы должны позволить ему вернуться и возглавить свой народ."
 wtt_germany.3.b:0 "Мы должны остановить его — нельзя рисковать новой Великой войной."
 wtt_germany.4.t:0 "Кайзер возвращается в Германию"
 wtt_germany.4.d:0 "Среди всеобщего ликования Вильгельм II вернулся в Германскую империю в качестве кайзера! Государство [HOL.GetNameDefCap] заслуживает нашей благодарности за то, что все эти десятилетия предоставляло ему надёжное убежище и неоднократно отказывалось выдать его нашим бывшим врагам. Хотя страна сильно пострадала в недавней гражданской войне, есть надежда, что возвращение кайзера принесёт ей стабильность и единство."
 wtt_germany.4.a:0 "Он, несомненно, будет достойно править страной."
 wtt_germany.5.t:0 "[HOL.GetNameDefCap] препятствует возвращению кайзера"
 wtt_germany.5.d:0 "Столь долго благородно предоставлявшее Вильгельму II убежище, вероломное государство [HOL.GetName] теперь не позволило кайзеру пересечь границу Германии и сопроводило его обратно в резиденцию Хёйс-Дорн. [HOL.GetAdjective] власти объясняют отказ позволить кайзеру вернуться на германский престол опасениями за стабильность континента."
 wtt_germany.5.a:0 "Мы дадим им более насущный повод для беспокойства!"
 wtt_germany.5.b:1 "Возможно, в этом есть смысл... У нас есть другие кандидаты."
 wtt_germany.5_tt:0 "Старый кайзер вполне может помочь сыну в правлении.\n"
 wtt_germany.6.t:0 "Вильгельм II освобождён"
 wtt_germany.6.d:0 "Очистив окрестности Хёйс-Дорна от [HOL.GetAdjective]их войск, наши силы обнаружили кайзера в добром здравии и доставили его в Германию автомобильной колонной. Всего несколько часов назад Вильгельм II триумфально пересёк границу, а по прибытии в Берлин торжественно принял обязанности кайзера Германской империи."
 wtt_germany.6.a:0 "Никто нас не остановит."
 GER_fascism_civil_war_tt:0 "Сторонники фашизма начинают гражданскую войну.\n"
 wtt_germany.7.t:0 "Неконтролируемая экономическая зависимость от государства [From.GetNameDef]"
 wtt_germany.7.d:0 "По мере постепенного втягивания в сферу влияния государства [From.GetNameDef] наша экономика становилась всё более зависимой от союзника. Сегодня [GER.GetAdjective]ая сторона наконец предприняла шаги для усиления контроля над нашей экономикой, и мы не смогли ей помешать. В результате [GER.GetAdjective] контроль над нашей внешней политикой достиг беспрецедентного уровня."
 wtt_germany.7.a:0 "Придётся смириться с положением дел... Пока что."
 wtt_germany.8.t:0 "[GER.GetNameDefCap] предлагает поддержку монархического переворота"
 wtt_germany.8.d:0 "Государство [From.GetNameDefCap] обратилось к монархическим и антифашистским силам в [ITA.GetAdjective]ом правительстве и подполье с планом убийства лидера [ITA.GetLeader] и провозглашения Виктора Эммануила III главой государства. [GER.GetAdjective]ая сторона заверяет, что возьмёт убийство на себя; от нас требуется лишь подтвердить готовность сформировать новое правительство и пообещать в будущем оказывать военную поддержку [GER.GetAdjective]им начинаниям."
 wtt_germany.8.a:0 "В грядущие времена мы должны обратиться к монархии."
 wtt_germany.8.b:0 "Нелепость! Мы никогда не откажемся от своего пути!"
 wtt_germany.9.t:0 "[ITA.GetAdjective]ая сторона принимает предложение о перевороте"
 wtt_germany.9.d:0 "Представители [ITA.GetAdjective]ого правительства и подполья приняли наше предложение о перевороте. Они готовятся быстро передать власть королю сразу после совершения убийства."
 wtt_germany.9.a:0 "Можно приводить наш план в действие."
 wtt_germany.10.t:0 "[ITA.GetAdjective]ая сторона отвергает предложение о перевороте"
 wtt_germany.10.d:0 "Представители [ITA.GetAdjective]ого правительства и подполья, с которыми мы связались, в весьма резкой форме сообщили, что наше предложение о перевороте их не интересует. Они пригрозили раскрыть наши планы [ITA.GetAdjective]ому правительству, если мы осмелимся вновь обратиться с таким предложением."
 wtt_germany.10.a:0 "Как прискорбно."
 wtt_germany.11.t:0 "[GER.GetAdjective]ое покушение на Муссолини"
 wtt_germany.11.d:0 "[GER.GetAdjective] план приведён в действие, и сегодня Муссолини был застрелен в своей машине на улицах Рима. Король Виктор Эммануил III взял бразды правления в свои руки и пообещал вместе с государством [From.GetNameDef] присоединиться к Центральным державам."
 wtt_germany.11.a:0 "Мы должны выразить свою признательность."
 wtt_germany.12.t:0 "Покушение на Муссолини удалось"
 wtt_germany.12.d:0 "Наш план был исполнен безупречно, и Виктор Эммануил III принял на себя руководство страной. Первым его шагом стало подписание договора, гарантирующего вступление Италии в союз Центральных держав."
 wtt_germany.12.a:0 "Монархии восстанут вновь!"
 wtt_germany.13.t:0 "Воссоединение Австро-Венгрии"
 wtt_germany.13.d:0 "При нашей поддержке государство [From.GetOldName] возглавило воссоединение Австро-Венгерской империи. Сегодня утром стороны подписали соответствующие договоры, положив конец двум десятилетиям сепаратистских настроений. Новое объединённое правительство немедленно пообещало поддержать нашу борьбу военной силой и вступило в Центральные державы."
 wtt_germany.13.a:0 "Наш старый союзник вновь с нами."
 wtt_germany.14.t:0 "[GER.GetNameDefCap] предлагает гарантии территориальной целостности"
 wtt_germany.14.d:0 "Государство [From.GetNameDefCap] обратилось к нам с предложением, которое, по их словам, выгодно обеим сторонам. Учитывая нынешнюю политическую обстановку и угрозу на нашей восточной границе, [GER.GetAdjective]ая сторона предлагает гарантировать нам военную помощь в случае войны с государством [SOV.GetNameDef]. Взамен они требуют лишь вернуть утраченные территории Данцига и Познани."
 wtt_germany.14.a:0 "Их военная мощь ценнее для нас, чем земля."
 wtt_germany.14.b:0 "Мы никогда не отдадим свои земли!"
 wtt_germany.15.t:0 "[POL.GetNameDefCap] принимает предложение"
 wtt_germany.15.d:0 "Государство [POL.GetNameDefCap] решило принять наше предложение и начало подготовку к передаче нам своих приграничных провинций. Оно доверилось нам и призвало быть готовыми к возможной [SOV.GetAdjective]ой агрессии."
 wtt_germany.15.a:0 "Наконец-то это наследие Версаля уничтожено!"
 wtt_germany.16.t:0 "[POL.GetNameDefCap] отвергает предложение"
 wtt_germany.16.d:0 "Государство [POL.GetNameDefCap] решило отвергнуть наше предложение. В решительных выражениях оно заявило, что никогда добровольно не откажется от своих территорий и скорее в одиночку встретит любого врага, чем заплатит такую цену за помощь."
 wtt_germany.16.a:0 "Мы никогда не откажемся от своих притязаний!"
 wtt_germany.16.b:0 "Возможно, нам придётся с этим смириться."
 wtt_germany.17.t:0 "[GER.GetAdjective]ие коммунисты бегут в государство [FRA.GetNameDef]"
 wtt_germany.17.d:0 "[GER.GetAdjective]ое правительство начало преследование коммунистов и изгнало их за границу. В результате к нам хлынул большой поток коммунистических идеологов из соседней страны."
 wtt_germany.17.a:0 "Лишь бы это не слишком дестабилизировало страну."
 wtt_germany.18.t:0 "Нацистское руководство захвачено"
 wtt_germany.18.d:1 "Наконец-то мы освободили страну от власти врагов, и верные граждане, поднявшиеся на поддержку нашего дела, теперь могут вернуться домой. Нас ждёт долгий и трудный путь восстановления государства. Руководство страны, в свою очередь, может начать задумываться о будущем: демократии или возвращении старой монархии.\n\nОднако осталось решить последний вопрос. После окончания гражданской войны наши войска захватили большую группу нацистских руководителей. Теперь нам предстоит определить, что делать с этой неприглядной частью нашей недавней истории."
 wtt_germany.18.a:0 "Повесить их!"
 wtt_germany.18.b:0 "Пожизненное заключение. Возможно, в будущем они ещё пригодятся."
 wtt_germany.19.t:0 "[GER.GetNameDefCap] выступает против государства [SOV.GetNameDef]"
 wtt_germany.19.d:0 "Недавняя [GER.GetAdjective]ая риторика, направленная против нас, наносит всё больший ущерб нашей репутации в Европе. Клеветнические обвинения в якобы проявляемой нами «агрессии» начинают вызывать страх и непонимание наших намерений."
 wtt_germany.19.a:0 "Начать серию военных учений, чтобы запугать их всех!"
 GER_soviet_military_exercises:0 "Военные учения"
 wtt_germany.19.b:1 "Мы должны спасти свою репутацию и улучшить отношения."
 GER_soviet_smoothes_relationships:0 "Улучшение отношений"
 wtt_germany.19.c:0 "Неужели они думают, что нам есть дело до их слов?"
 wtt_germany.20.t:0 "[GER.GetNameDefCap] создаёт Центральноевропейский альянс"
 wtt_germany.20.d:0 "Продолжая клеветническую кампанию против нас, [GER.GetAdjective]ая сторона объявила о создании нового альянса. Нет сомнений, что он направлен против нас и призван вмешаться в нашу сферу влияния."
 wtt_germany.20.a:0 "Им лучше держаться подальше от нашей сферы влияния!"
 GER_soviet_reiterated_claims:0 "Подтверждённые притязания"
 wtt_germany.20.b:0 "Нельзя давать им повод для дальнейшей эскалации."
 wtt_germany.21.t:0 "[GER.GetAdjective]ая сторона приглашает страны Балтии"
 wtt_germany.22.t:0 "[GER.GetAdjective]ая сторона приглашает государство [POL.GetNameDef]"
 wtt_germany.23.t:0 "[GER.GetAdjective]ая сторона приглашает государство [FIN.GetNameDef]"
 wtt_germany.21.d:0 "[GER.GetAdjective]ая сторона предложила членство государству, находящемуся в нашей непосредственной сфере влияния. Угроза родине очевидна!"
 wtt_germany.21.a:0 "Мы должны нанести удар, чтобы обезопасить остальные земли!"
 GER_soviet_securing_sphere:0 "Защита сферы влияния"
 wtt_germany.21.b:0 "Мы не можем позволить себе провоцировать Запад."
 wtt_germany.24.t:0 "Великая красная угроза"
 wtt_germany.24.d:0 "По официальным и неофициальным каналам [GER.GetAdjective]ая сторона ясно дала понять, что государство [SOV.GetNameDef] с самого своего появления два десятилетия назад было и остаётся величайшей угрозой стабильности Европы. Они призвали нас помнить, что мы не одиноки перед лицом коммунистической угрозы и что, объединив континент, сможем сокрушить Медведя."
 wtt_germany.24.a:0 "Будем надеяться, что они правы."
 wtt_germany.25.t:0 "[SOV.GetNameDefCap] улучшает отношения"
 wtt_germany.25.d:0 "Государство [SOV.GetNameDefCap] предприняло согласованные усилия, чтобы развеять опасения европейских стран. В публичном заявлении его представители объявили об отсутствии враждебных намерений и выразили надежду, что сдержанная реакция на воинственную [GER.GetAdjective]ую риторику скажет сама за себя."
 wtt_germany.25.a:0 "Это ещё предстоит выяснить."
 wtt_germany.26.t:0 "Вильгельм II умирает"
 wtt_germany.26.d:0 "Прошлой ночью Вильгельм II, наш любимый кайзер, мирно скончался во сне. Несмотря на долгое изгнание, провидение позволило ему вернуться на родину задолго до смерти, и с тех пор он достойно руководил нашей страной. Теперь бразды правления принял его сын Фридрих Вильгельм, который после коронации станет известен как Вильгельм III."
 wtt_germany.26.a:0 "Да здравствует кайзер!"
 wtt_germany.27.t:0 "Август фон Макензен умирает"
 wtt_germany.27.d:0 "Прошлой ночью Август фон Макензен, наш глубоко почитаемый фельдмаршал, мирно скончался во сне. Мы ещё долго будем помнить его прославленные подвиги в Великой войне и изгнание фашистского угнетателя с нашей родины. Сын изгнанного кайзера, Фридрих Вильгельм, заполнил образовавшийся вакуум власти и после коронации станет известен как Вильгельм III, первый кайзер империи после отречения его отца в 1918 году."
 wtt_germany.28.t:0 "[GER.GetNameDefCap] отменяет изгнание Вильгельма II"
 wtt_germany.28.d:0 "Государство [GER.GetNameDefCap] отменило изгнание Вильгельма II и обратилось к государству [HOL.GetNameDef] с просьбой вернуть старого кайзера. Похоже, несмотря на многочисленные требования о его выдаче [HOL.GetAdjective]ому правительству для привлечения к ответственности за развязывание Великой войны, этот поджигатель войны вновь встанет во главе государства [GER.GetNameDef]."
 wtt_germany.28.d.2:0 "Государство [GER.GetNameDefCap] отменило изгнание Вильгельма II и обратилось к государству [HOL.GetNameDef] с просьбой вернуть старого кайзера. После отказа [HOL.GetAdjective]ой стороны разрешить его возвращение дело переросло в военный конфликт!"
 germany.60.c:0 "Они не останутся одни! Поднимем [ENG.GetAdjective]ий народ на войну!"
 wtt_germany.29.d:0 "Государство [GER.GetNameDefCap] отменило изгнание Вильгельма II и обратилось к государству [HOL.GetNameDef] с просьбой вернуть старого кайзера. Похоже, несмотря на многочисленные требования о его выдаче [HOL.GetAdjective]ому правительству для привлечения к ответственности за развязывание Великой войны, этот поджигатель войны вновь встанет во главе государства [GER.GetNameDef].\n\n[FRA.GetAdjective]ая сторона уже решила, что это неприемлемо, и намерена предъявить ультиматум, подкреплённый военной силой. Общественное мнение в государстве [ENG.GetNameDef] выступает против войны, но отказ поддержать [FRA.GetAdjective]ую сторону приведёт к распаду нашего альянса."
 wtt_germany.29.d.2:0 "Государство [GER.GetNameDefCap] отменило изгнание Вильгельма II и обратилось к государству [HOL.GetNameDef] с просьбой вернуть старого кайзера. После отказа [HOL.GetAdjective]ой стороны разрешить его возвращение дело переросло в военный конфликт!\n\n[FRA.GetAdjective]ая сторона уже решила, что это неприемлемо, и намерена предъявить ультиматум, подкреплённый военной силой. Общественное мнение в государстве [ENG.GetNameDef] выступает против войны, но отказ поддержать [FRA.GetAdjective]ую сторону приведёт к распаду нашего альянса."
 germany.61.c:0 "Мы должны прийти на помощь голландцам!"
 wtt_germany.30.d:0 "Государство [GER.GetNameDefCap] отменило изгнание Вильгельма II и обратилось к государству [HOL.GetNameDef] с просьбой вернуть старого кайзера. Похоже, несмотря на многочисленные требования о его выдаче [HOL.GetAdjective]ому правительству для привлечения к ответственности за развязывание Великой войны, этот поджигатель войны вновь встанет во главе государства [GER.GetNameDef].\n\n[FRA.GetAdjective]ая сторона, судя по всему, готова ограничить свою реакцию на это возмутительное событие дипломатическими протестами, а общественное мнение в государстве [ENG.GetNameDef] решительно выступает против войны."
 wtt_germany.31.d:0 "[ENG.GetAdjective]ая сторона отказывается поддержать нас против государства [GER.GetNameDef], утверждая, что вопрос [GER.GetAdjective]ой монархии является внутренним делом страны. Если мы начнём войну с [GER.GetAdjective]ой стороной, нам, похоже, придётся сражаться в одиночку.\n\nОбщественное мнение в государстве [FRA.GetNameDef] выступает против войны, однако государство [GER.GetNameDef] будет лишь набирать силу, а возвращение кайзера вполне может вновь пробудить империалистические настроения. Без поддержки государства [ENG.GetNameDef] наш ультиматум будет выглядеть менее убедительно. Стоит ли нам выступить против них в одиночку?"
 wtt_germany.32.d:0 "Хотя война не пользуется поддержкой населения государства [ENG.GetNameDef], [ENG.GetAdjective]ое правительство признало угрозу, исходящую от [GER.GetAdjective]ой стороны, и предложило нам полную поддержку. Мы предъявим государству [GER.GetNameDef] последний ультиматум, чтобы не допустить возвращения кайзера-поджигателя войны. В случае отказа нашим войскам придётся глубоко вторгнуться в государство [GER.GetNameDef] и положить конец его тираническому режиму!"
 wtt_germany.33.d:0 "[ENG.GetAdjective]ая и [FRA.GetAdjective]ая стороны отказались признать возвращение нашего кайзера, назвав «возмутительным» то, что предполагаемому виновнику Великой войны позволили вновь занять престол. Они мобилизуют силы против нас и предъявили ультиматум: наши войска должны немедленно отступить, а кайзер — вернуться в изгнание, иначе между нашими странами начнётся война."
 wtt_germany.33.a:0 "Мы не отступим! Да здравствует кайзер!"
 wtt_germany.34.d:0 "[ENG.GetAdjective]ая сторона проявила благоразумие и признала возвращение кайзера, но обезумевшая [FRA.GetAdjective]ая сторона отказывается отступать! Утверждая, что этот инцидент представляет прямую угрозу безопасности страны, они мобилизуют войска и могут в любой момент перейти границу! Мы в состоянии войны!"
 wtt_germany.35.d:0 "Несмотря на наше разъяснение, что возвращение Вильгельма II на [GER.GetAdjective]ий престол будет расценено как акт войны, государство [GER.GetNameDef] отказалось отступить и вновь отправить кайзера в изгнание, проигнорировав предупреждение. Это означает, что, несмотря на все наши попытки сохранить мир, в Европе снова началась война."
 wtt_germany.38.t:0 "[GER.GetAdjective]ая сторона требует вернуть Циндао"
 wtt_germany.38.desc:0 "В последнее время государство [GER.GetNameDefCap] всё громче призывает вернуться к колониализму. Теперь по дипломатическим каналам оно потребовало вернуть свой прежний анклав в Циндао. Возможно, мы сумеем заключить на этом выгодную сделку."
 wtt_germany.38.a:0 "Взамен потребовать продолжения миссии фон Фалькенхаузена."
 wtt_germany.38.b:0 "Возможно, их присутствие в регионе окажется полезным."
 wtt_germany.38.c:0 "Мы больше никогда не отдадим свою суверенную территорию!"
 wtt_germany.39.t:0 "Китай предлагает сделку по Циндао"
 wtt_germany.39.desc:0 "Китайские официальные лица связались с нами и предложили возможную сделку, которая, по их словам, удовлетворит обе стороны. Они предлагают вернуть Циндао законным [GER.GetAdjective]им владельцам в обмен на гарантию того, что мы не отзовём миссию фон Фалькенхаузена."
 wtt_germany.39.a:0 "Мы можем на это согласиться."
 wtt_germany.39.b:0 "Нет, мы должны сохранить свободу действий."
 wtt_germany.40.t:0 "[From.GetNameDefCap] отвергает требование по Циндао"
 wtt_germany.40.desc:0 "Государство [From.GetNameDefCap] категорически отвергло наше требование вернуть Циндао. Нам остаётся лишь попытаться вернуть его позднее."
 wtt_germany.40.a:0 "Мы умеем ждать."
 wtt_germany.41.t:0 "[GER.GetNameDefCap] принимает сделку по Циндао"
 wtt_germany.41.desc:0 "Государство [GER.GetNameDefCap] приняло наше предложение о сделке по Циндао. Оно гарантировало дальнейшую поддержку фон Фалькенхаузена."
 wtt_germany.42.t:0 "[GER.GetNameDefCap] отвергает сделку по Циндао"
 wtt_germany.42.desc:0 "Государство [GER.GetNameDefCap] отвергло наше предложение о сделке по Циндао. Видимо, этот анклав был нужен ему не так уж сильно."
 wtt_germany.43.t:0 "[GER.GetAdjective]ая сторона требует вернуть Циндао"
 wtt_germany.43.desc:0 "В последнее время государство [GER.GetNameDefCap] всё громче призывает вернуться к колониализму. Несмотря на обстоятельства утраты Циндао — наш захват города в 1914 году, — [GER.GetAdjective]ая сторона решила начать дипломатические переговоры и потребовала вернуть свой прежний анклав. Возможно, мы сумеем заключить на этом выгодную сделку."
 wtt_germany.43.a:0 "Взамен потребовать от [GER.GetAdjective]ой стороны отозвать фон Фалькенхаузена."
 wtt_germany.43.b:0 "Они больше никогда не ступят на Дальний Восток!"
 wtt_germany.44.t:0 "[JAP.GetNameDefCap] предлагает сделку по Циндао"
 wtt_germany.44.desc:0 "[JAP.GetAdjective]ие официальные лица связались с нами и предложили возможную сделку, которая, по их словам, удовлетворит обе стороны. Они предлагают вернуть Циндао законным [GER.GetAdjective]им владельцам в обмен на немедленный отзыв миссии фон Фалькенхаузена из Китая."
 wtt_germany.46.desc:0 "Государство [GER.GetNameDefCap] приняло наше предложение о сделке по Циндао и немедленно отозвало миссию фон Фалькенхаузена из Китая."
 wtt_germany.48.t:0 "[From.GetNameDefCap] принимает требования"
 wtt_germany.48.desc:0 "Государство [From.GetNameDefCap] приняло наши требования и организовало немедленное возвращение Циндао под [GER.GetAdjective]ий контроль!"
 wtt_germany.49.t:0 "Изгнание нацистов наносит тяжёлый ущерб региону [nazi_state_withdrawn.GetName]"
 wtt_germany.49.desc:0 "Нам наконец удалось установить контроль над регионом [nazi_state_withdrawn.GetName], но бои были ожесточёнными. По мере нашего продвижения нацисты становятся всё фанатичнее и отчаяннее, нередко сражаясь до тех пор, пока окружающая местность не превращается в руины. Поступают также сообщения о применении тактики выжженной земли в соответствии с гитлеровским «приказом Нерона».\n\nНесомненно, подобные разрушения будут продолжаться, пока мы не положим конец этой войне."
 wtt_germany.49.a:0 "Невеликая цена за избавление родины от них."
 wtt_germany.50.t:0 "[ger_cw_old_fascist_leader.GetName] найден мёртвым"
 wtt_germany.50.desc:0 "После захвата Берлина наши войска обнаружили в городском бункере тело нацистского фюрера [ger_cw_old_fascist_leader.GetName]. Предпочтя смерть перспективе увидеть, как антифашистские силы берут страну под контроль, лидер покончил с собой, чтобы не попасть в плен.\n\nТеперь руководство нацистами принял [ger_cw_new_fascist_leader.GetName], уже заявивший, что правительство не ослабит борьбу против «антигерманского предательства»."
 wtt_germany.50.a:0 "Для нацистов это начало конца."
 wtt_germany.51.t:0 "Вернуть захваченное нацистское руководство?"
 wtt_germany.51.desc:0 "Война настолько затянулась и стала столь разрушительной, что к службе призваны все взрослые немцы. Хотя захваченные нацистские руководители не разделяют наших идеологических взглядов, они обладают навыками, которые могут оказаться полезными в этот трудный час.\n\nМы могли бы предложить им свободу после войны в обмен на применение их способностей ради нашего дела уже сейчас."
 wtt_germany.51.a:0 "Да, частично вернуть нацистское руководство."
 reinstate_nazi_leadership_TT:0 "Советники, доступные только фашистам, вновь могут поступить на службу.\n"
 wtt_germany.51.b:0 "Нет, им и там хорошо."
 wtt_germany.51.c:0 "Нельзя допустить, чтобы при неудачном ходе войны они вышли на свободу. Повесить их!"
 wtt_germany.52.t:0 "Демократическая гражданская война в государстве [From.From.GetName]"
 wtt_germany.52.desc:0 "Демократические силы в государстве [From.From.GetNameDef] начали гражданскую войну, чтобы восстановить свободные выборы и вернуть власть народу. Им может потребоваться наша помощь, а их победа обеспечит нам будущего союзника."
 wtt_germany.52.a:0 "Мы поддержим демократию!"
 wtt_germany.52.b:0 "Им придётся решать свои проблемы самостоятельно."
 wtt_germany.53.t:0 "[AUS.GetAdjective] Про-[GER.GetAdjective] Чувство взлетает"
 wtt_germany.53.desc:0 "[GER.GetAdjective] Настроения нашего южного соседа Австрии заметно возросли, поскольку мы уже некоторое время являемся союзниками. Не исключено, что референдум, призывающий к объединению с Германией, встретит [AUS.GetAdjective] одобрение людей. Стоит ли призывать к [AUS.GetAdjective] Правительство задержало одного?"
 wtt_germany.53.a:0 "Да, малогерманское решение было ошибкой."
 wtt_germany.53.b:0 "Нет, великогерманское решение стало бы ошибкой."
 wtt_germany.54.t:0 "[GER.GetAdjective]ое правительство призывает провести референдум об объединении"
 wtt_germany.54.desc:0 "[GER.GetAdjective]ое правительство обратилось к нам с предложением об объединении, если того пожелает австрийский народ. Оно призывает провести референдум и выяснить его волю."
 wtt_germany.54.a:0 "Провести кампанию в поддержку объединения."
 wtt_germany.54.b:0 "Провести кампанию против объединения."
 wtt_germany.55.t:0 "[AUS.GetAdjective]ий народ голосует за объединение"
 wtt_germany.55.desc:0 "[AUS.GetAdjective]ий народ проголосовал за объединение со своими северными братьями. Интеграция австрийских земель и вооружённых сил начнётся немедленно."
 wtt_germany.55.a:0 "Великий день для германского вопроса!"
 wtt_germany.56.t:0 "[GER.GetAdjective]ие территории"
 wtt_germany.56.desc:0 "Наша война с государством [SOV.GetNameDef] складывается неудачно, и мы рискуем потерять всё. К западу от нас государство [GER.GetNameDef] за последние годы пережило стремительные перемены, но теперь стало стойким защитником демократических ценностей. Быстрая передача прежних [GER.GetAdjective]их территорий Данцига и Познани несомненно спасёт миллионы людей от угнетения под [SOV.GetAdjective]им сапогом."
 wtt_germany.56.a:0 "Лучше государство [GER.GetNameDef], чем [SOV.GetAdjective]ая сторона!"
 wtt_germany.56.b:0 "Никогда! Всё [POL.GetAdjective]ое останется [POL.GetAdjective]им до конца!"
 wtt_germany.57.t:0 "[POL.GetNameDefCap] предлагает вернуть [GER.GetAdjective]ие территории"
 wtt_germany.57.desc:0 "Поскольку [POL.GetAdjective]ая война с государством [SOV.GetNameDef] складывается неудачно, правительство по тайным каналам предложило нам быстро вернуть прежние территории Данцига и Познани. Оно утверждает, что населению будет несомненно лучше под демократическим [GER.GetAdjective]им управлением, чем под гнётом [SOV.GetAdjective]ой стороны."
 wtt_germany.57.a:0 "Какая хитрость! Мы обеспечим им безопасность."
 wtt_germany.57.b:0 "Нет, мы не можем рисковать [SOV.GetAdjective]им возмездием."
 wtt_germany.58.t:0 "[AUS.GetAdjective]ий народ отвергает объединение"
 wtt_germany.58.desc:0 "[AUS.GetAdjective]ий народ отверг наши призывы к объединению, предпочтя сохранить [AUS.GetAdjective]ую независимость хотя бы ещё на некоторое время."
 wtt_germany.58.a:0 "Мы должны уважать их волю."
 wtt_germany.59.t:0 "[GER.GetNameDefCap] принимает Данциг и Познань"
 wtt_germany.59.desc:0 "[GER.GetAdjective]ое правительство решило принять свои прежние территории и торжественно поклялось защищать [POL.GetAdjective]их жителей региона."
 wtt_germany.59.a:0 "По крайней мере, они будут в безопасности."
 wtt_germany.60.t:0 "[GER.GetNameDefCap] отвергает Данциг и Познань"
 wtt_germany.60.desc:0 "[GER.GetAdjective]ое правительство сообщило, что не может принять наше предложение. Оно опасается [SOV.GetAdjective]ого возмездия и потому считает риск неприемлемым."
 wtt_germany.60.a:0 "Кто поможет им, когда все падут перед красными?"
 wtt_germany.62.t:0 "Компании требуют выплат по векселям МЕФО"
 wtt_germany.62.desc:0 "После окончания недавней войны компании, которым мы выдали векселя МЕФО, требуют произвести выплаты. По их словам, больше нет необходимости задерживать их «ради блага отечества»."
 wtt_germany.62.a:0 "Хорошо."
 wtt_germany.63.t:0 "[GER.GetName] реинтегрирует Эльзас-Лотарингию"
 wtt_germany.63.desc:0 "[GER.GetAdjective]ое правительство приняло закон о реинтеграции Эльзаса-Лотарингии и Люксембурга в государство [GER.GetNameDef]. Массовый призыв нашего населения уже начался."
 wtt_germany.63.a:0 "Ублюдки! Это ещё не конец!"
 wtt_germany.64.t:0 "[GER.GetName] реинтегрирует Люксембург"
 wtt_germany.64.a:0 "Что мы можем сделать?"
 wtt_germany.65.t:0 "[From.GetNameDefCap] требует участия в войне"
 wtt_germany.65.desc:0 "Государство [From.GetNameDefCap] сообщило, что ему необходимо пройти через наши земли, чтобы направить войска против [SOV.GetAdjective]ого врага. Оно напоминает, что защищает нас от коммунистов и потому мы обязаны помочь ему в нынешней войне."
 wtt_germany.65.a:0 "Они правы — мы вступим в их войну."
 wtt_germany.65.b:0 "Кем они себя возомнили? Никогда!"
 wtt_germany.66.t:0 "[From.GetNameDefCap] принимает требования"
 wtt_germany.66.desc:0 "Государство [From.GetNameDefCap] решило присоединиться к нашей войне против государства [SOV.GetNameDef], что также позволит нашим войскам пройти через его территорию."
 wtt_germany.67.t:0 "[From.GetName] отвергает требования"
 wtt_germany.67.desc:0 "Государство [From.GetNameDefCap] отвергло наше требование вступить в войну и продолжает держать границы закрытыми для наших войск. Если поляки не желают пропускать наши силы, нам придётся пройти по ним."
 wtt_germany.67.a:0 "Они сами навлекли это на себя."
 wtt_germany.68.t:0 "[From.GetName] предлагает восстановить империю"
 wtt_germany.68.desc:0 "[From.GetAdjective]ое правительство обратилось к нам с предложением восстановить старую Австро-Венгерскую империю. Поскольку проимперские настроения в наших странах относительно сильны, оно утверждает, что объединение государств отвечает интересам всех сторон."
 wtt_germany.68.a:0 "Превосходная идея! Мы согласны."
 wtt_germany.68.b:0 "Добровольно присоединиться к ним? Никогда!"
 wtt_germany.69.t:0 "[From.GetName] принимает интеграцию"
 wtt_germany.69.desc:0 "[From.GetAdjective]ое правительство ответило на наше предложение восстановить старую Австро-Венгерскую империю. Оно признаёт преимущества этого шага и заявляет о готовности объединить свою страну с нашей, если все стороны согласятся."
 wtt_germany.70.t:0 "[From.GetName] отвергает интеграцию"
 wtt_germany.70.desc:0 "[From.GetAdjective]ое правительство ответило на наше предложение восстановить старую Австро-Венгерскую империю. Оно заявило, что никогда добровольно не признает наше руководство в подобном начинании."
 wtt_germany.71.t:0 "Восстановление Австро-Венгерской империи"
 wtt_germany.71.desc:0 "Соседние государства — преемники Австро-Венгрии приняли предложение о возвращении своих земель в состав нашей страны, тем самым восстановив Австро-Венгерскую империю. Ликующие толпы приветствовали подписание договора о воссоединении на улицах, а [GER.GetAdjective]ое правительство с готовностью приняло нас обратно в свой альянс."
 wtt_germany.71.a:0 "Наступает новая эпоха Австро-Венгрии."
 wtt_germany.72.t:0 "[From.GetNameDefCap] предлагает экономическую интеграцию"
 wtt_germany.72.desc:0 "Поскольку мы уже состоим в тесном союзе, государство [From.GetNameDef] предложило расширить нашу военную экономику путём более глубокой интеграции наших хозяйств. Это значительно ускорит рост нашей военной мощи, но одновременно поставит нашу внешнюю политику в зависимость от них."
 wtt_germany.72.a:0 "Отличная идея — наши судьбы неразрывно связаны."
 wtt_germany.72_tt:0 "§RМы потеряем контроль над всеми своими субъектами.§!\n"
 wtt_germany.72.b:0 "Пожалуй, нет. Наш суверенитет слишком ценен."
 wtt_germany.73.t:0 "[From.GetNameDefCap] принимает экономическую интеграцию"
 wtt_germany.73.desc:0 "The [From.GetAdjective] Правительство информирует нас о том, что они принимают наше предложение по интеграции наших военных экономик. Они с нетерпением ждут нашего руководства, чтобы смоделировать свои военные на нашем шаблоне успеха."
 wtt_germany.73.a:0 "Под нашей опекой их армии разрастутся."
 wtt_germany.74.t:0 "[From.GetNameDefCap] отвергает экономическую интеграцию"
 wtt_germany.74.desc:0 "The [From.GetAdjective] Правительство информирует нас о том, что они отвергают наше предложение по интеграции наших военных экономик. Они ценят свой суверенитет больше, чем полезность своих армий."
 wtt_germany.74.a:0 "Они отвергают само величие!"
 wtt_germany.999.t:0 "[From.GetLeader] просит восстановить королевские титулы"
 wtt_germany.999.desc:0 "От имени Кайзера [From.GetLeader], [From.GetAdjective] Правительство потребовало, чтобы мы вернули лишение британских пэрств и королевских титулов от немецких королевских и княжеских семей, как это разрешено Законом о лишении титулов 1917 года. Они утверждают, что это показало бы миру, как британские и немецкие королевские и княжеские семьи уже вернулись к своим прекрасным довоенным отношениям, и таким образом это послужило бы символом будущей англо-германской дружбы."
 wtt_germany.999.a:0 "Превосходная идея!"
 wtt_germany.999.b:0 "Пожалуй, нет."
 wtt_germany.1000.t:0 "[From.GetAdjective] Правительство приняло запрос"
 wtt_germany.1000.desc:0 "The [From.GetAdjective] Правительство решило поддержать нашу просьбу восстановить британские пэрства и королевские титулы для немецких королевских и княжеских семей. Они предлагают грандиозную «королевскую церемонию века». Всем германским королевским особам предлагается лично вернуть титулы, которые были неправомерно отобраны у них два десятилетия назад.\n\nИмперские советники предлагают, чтобы вся расширенная королевская семья сделала большой вход, используя самую вершину немецкой технологии. Современный дирижабль Гинденбурга идеально подойдет для этого случая."
 wtt_germany.1000.a:0 "Превосходная идея! Мы заранее отправим представителя."
 wtt_germany.1000.a_tt:1 "Принцесса Виктория Луиза заранее отправится помогать в подготовке этой грандиозной церемонии. Это несколько обременит ресурсы нашего правительства.\n"
 wtt_germany.1000.b:0 "Превосходная идея! Мы отправимся все вместе."
 wtt_germany.1000.b_tt:0 "Вся многочисленная королевская семья отправится на церемонию на борту «Гинденбурга». Это повысит престиж императорского дома в глазах союзников и народа, укрепив положение нашего правительства.\n"
 wtt_germany.1001.t:0 "«Гинденбург» в огне над Лондоном"
 wtt_germany.1001.desc:1 "Сегодня при попытке причалить в Лондоне дирижабль «Гинденбург» трагически погиб. По пока не установленным причинам воздушное судно охватило пламя, после чего оно рухнуло на землю. Погибли все пассажиры и члены экипажа, включая почти всех представителей многочисленной германской императорской семьи.\n\nЕдинственной выжившей стала принцесса Виктория Луиза, заранее отправленная помогать в подготовке церемонии. Принцесса, третья носительница имени Виктория после своей бабушки, германской императрицы Виктории, и прабабушки, королевы Виктории, стала единственной оставшейся наследницей престола. Всё ещё потрясённая потерей семьи, она взошла на престол как кайзерин Виктория I Германской империи."
 wtt_germany.1001.a:0 "Кайзер мёртв. Да здравствует кайзерин!"
 wtt_germany.1002.desc:0 "Сегодня при попытке причалить в Лондоне дирижабль «Гинденбург» трагически погиб. По пока не установленным причинам воздушное судно охватило пламя, после чего оно рухнуло на землю. Погибли все пассажиры и члены экипажа, включая всех представителей многочисленной германской императорской семьи.\n\nПосле полного уничтожения императорского дома правительство взяло власть непосредственно в свои руки, однако в ближайшем будущем возвращение демократии кажется маловероятным."
 wtt_germany.1002.a:0 "Какая трагедия!"
 wtt_germany.1003.t:0 "[From.GetAdjective] Правительство отклонило запрос"
 wtt_germany.1003.desc:0 "После длительной сессии в парламенте [From.GetAdjective] Правительство решило отклонить нашу просьбу о восстановлении британских пэрств и королевских титулов для немецких королевских и княжеских семей."
 wtt_germany.1003.a:0 "Крайне прискорбно."
 wtt_news.1000.desc:0 "Сегодня при попытке причалить в Лондоне дирижабль «Гинденбург» трагически погиб. По пока не установленным причинам воздушное судно охватило пламя, после чего оно рухнуло на землю. Погибли все пассажиры и члены экипажа, включая почти всех представителей многочисленной германской императорской семьи.\n\nЕдинственной выжившей стала принцесса Виктория Луиза, заранее отправленная помогать в подготовке церемонии. Принцесса, третья королевская особа с именем Виктория после своей бабушки, германской императрицы Виктории, и прабабушки, королевы Виктории, стала единственной оставшейся наследницей престола. Всё ещё потрясённая потерей семьи, она взошла на престол как кайзерин Виктория I Германской империи."
 wtt_news.1000.a:0 "Ужасная трагедия с неожиданными последствиями."
 wtt_news.1001.desc:0 "Сегодня при попытке причалить в Лондоне дирижабль «Гинденбург» трагически погиб. По пока не установленным причинам воздушное судно охватило пламя, после чего оно рухнуло на землю. Погибли все пассажиры и члены экипажа, включая всех представителей многочисленной германской императорской семьи.\n\nПосле полного уничтожения императорского дома правительство взяло власть непосредственно в свои руки, однако в ближайшем будущем возвращение демократии кажется маловероятным."
 wtt_news.1001.a:0 "Какая страшная трагедия!"
 wtt_news.1.t:0 "Германия охвачена гражданской войной"
 wtt_news.1.desc:0 "Сегодня рано утром внезапный переворот вермахта под руководством прославленного фельдмаршала Августа фон Макензена спровоцировал гражданскую войну в Германии. Коммунисты, монархисты и демократы взялись за оружие против вчерашних соотечественников, а воинские части были сняты с границ для борьбы с внутренней угрозой.\n\nФашисты, выполняя приказ Гитлера, уже поклялись скорее уничтожить страну, чем позволить ей достаться «германским предателям»."
 wtt_news.1.a:0 "Пути назад больше нет."
 wtt_news.1.b:0 "Военные предали нас! Мы не можем допустить подобного у себя."
 wtt_news.1.c:0 "Будем надеяться, что мир вскоре вернётся в Европу."
 wtt_news.2.t:0 "[From.GetNameDefCap] препятствует возвращению Вильгельма II"
 wtt_news.2.desc:0 "\nВскоре после [GER.GetNameDef] Сняли изгнание Вильгельма II в неожиданном объявлении вчера утром. [HOL.GetAdjective] Власти заблокировали старый кортеж Кайзера, прежде чем он прошел через [GER.GetAdjective] Граница и заставила его вернуться в свою резиденцию Хюис Дорн.\n\nОфициальный [HOL.GetAdjective] В коммюнике говорится о том, что необходимо дестабилизировать ситуацию на континенте, если Вильгельм II вновь займет немецкий трон. Следовательно, [HOL.GetAdjective] Правительство взяло на себя обязательство поместить старого кайзера под домашний арест.\n\nА. [GER.GetAdjective] Реакция на кризис еще не была сделана, но общественный резонанс включал требование о применении военной силы для возвращения кайзера.\n"
 wtt_news.2.a:0 "Как они смеют?"
 wtt_news.2.b:0 "Надеюсь, они понимают, что делают."
 wtt_news.2.c:0 "Кто-то должен был занять твёрдую позицию."
 wtt_news.3.t:0 "Вильгельм II возвращается в государство [GER.GetNameDef]"
 wtt_news.3.desc:0 "Вчера утром [GER.GetAdjective]ое правительство неожиданно объявило об официальной отмене изгнания Вильгельма II. Позднее в тот же день кортеж старого кайзера пересёк [HOL.GetAdjective]-[GER.GetAdjective]ую границу, а после возвращения в Берлин он был торжественно восстановлен на престоле кайзера Германской империи.\n\nКайзер уже поклялся вернуть государству [GER.GetNameDef] былое величие, однако пока неизвестно, какое направление примет внешняя политика страны."
 wtt_news.3.a:0 "Да здравствует кайзер!"
 wtt_news.3.b:0 "Возвращение к началу века?"
 wtt_news.3.c:0 "Мы выполнили свой долг и обеспечили ему безопасность."
 wtt_news.3.d:0 "Нужно было сильнее давить на [HOL.GetAdjective]ую сторону и добиться его выдачи!"
 wtt_news.4.t:0 "Вильгельм II освобождён из-под [HOL.GetAdjective]ого домашнего ареста"
 wtt_news.4.desc:0 "Несмотря на тщетные попытки [HOL.GetAdjective]ой стороны сдержать [GER.GetAdjective]ое наступление, правительство было вынуждено капитулировать перед подавляющей [GER.GetAdjective]ой мощью. [GER.GetAdjective]ие войска освободили старого кайзера из-под домашнего ареста в Хёйс-Дорне, а после возвращения в Берлин он был торжественно восстановлен на престоле кайзера Германской империи.\n\nКайзер уже поклялся вернуть государству [GER.GetNameDef] былое величие, однако пока неизвестно, какое направление примет внешняя политика страны."
 wtt_news.4.a:0 "Никто не остановит государство [GER.GetNameDef]!"
 wtt_news.4.b:0 "Со стороны [HOL.GetAdjective]их властей это был глупый жест."
 wtt_news.4.c:0 "Возможно, это всё же была не лучшая идея."
 wtt_news.5.t:0 "Муссолини убит"
 wtt_news.5.desc:0 "По сообщениям из Рима, сегодня среди бела дня на одной из городских улиц был застрелен и убит дуче. Одновременно с этим представители правительства начали захватывать власть у итальянских фашистов. Прошла волна арестов, воинские части оцепили правительственные здания и улицы, а в городе был введён комендантский час.\n\nПредставители правительства переворота заявили о верности Виктору Эммануилу III. Первым действием короля в качестве главы государства [ITA.GetNameDef] стало подписание союзного договора с государством [GER.GetNameDef]."
 wtt_news.5.a:0 "Всё прошло безупречно."
 wtt_news.5.b:0 "Да здравствует король!"
 wtt_news.5.c:0 "Без [GER.GetAdjective]ого участия здесь явно не обошлось."
 wtt_news.6.t:0 "Австро-Венгрия восстановлена"
 wtt_news.6.desc:1 "Дунайские государства-преемники Австро-Венгерской империи в последнее время претерпели волну проимперских настроений и, под руководством [From.GetOldNameDef]Теперь они решили снова объединить свои страны в Австро-Венгрию.\n\nНовое австро-венгерское правительство немедленно приняло меры, чтобы подписать официальный договор о союзе с Австро-Венгрией. [GER.GetNameDef]Открыто оказывая поддержку [GER.GetAdjective] анти-[ENG.GetAdjective] и анти-[FRA.GetAdjective] внешней политики."
 wtt_news.6.a:0 "И нам не пришлось сделать ни единого выстрела."
 wtt_news.6.b:0 "Мы вновь едины!"
 wtt_news.6.c:0 "Новый силовой блок в Европе? Тревожно."
 wtt_news.7.t:0 "[POL.GetNameDefCap] возвращает Данциг"
 wtt_news.7.desc:0 "[POL.GetAdjective]ое правительство приняло [GER.GetAdjective]ое предложение вернуть Данциг в обмен на военные гарантии. Составлен договор, заверяющий поляков, что [GER.GetAdjective]ая сторона придёт им на помощь в случае любой агрессии против них.\n\nЦена оказалась высокой, ведь Польша вновь полностью отрезана от моря, однако перед лицом коммунистической угрозы с востока она вполне могла оказаться оправданной."
 wtt_news.7.a:0 "«Данциг или война»? Ха! Дипломатия вновь победила."
 wtt_news.7.b:0 "Будем надеяться, что цена того стоила."
 wtt_news.7.c:0 "[GER.GetAdjective]ая сторона вмешивается в нашу сферу влияния."
 wtt_news.7.d:0 "Выгодная сделка для обеих сторон? Посмотрим."
 wtt_news.8.t:0 "Гражданская война в Германии окончена"
 wtt_news.8.desc:0 "Гражданская война, терзавшая Германию, наконец завершилась. Бои отличались невероятным ожесточением, а фанатичное сопротивление нацистов привело к разрушениям, сопоставимым с Великой войной.\n\nПо всей видимости, Гитлер мёртв, а нацистское руководство заключено в тюрьму или казнено. Временное правительство объявило, что прежде любых конституционных реформ необходимо закрепить контроль над государством и вернуть стране стабильность."
 wtt_news.8.a:0 "Пора начинать восстановление."
 wtt_news.8.b:0 "Будем надеяться, новый режим окажется сговорчивее."
 wtt_news.9.t:0 "[SOV.GetAdjective]ая сторона объявляет масштабные учения"
 wtt_news.9.desc:0 "В ответ на то, что они называют «всё более враждебной [GER.GetAdjective]ой риторикой», [SOV.GetAdjective]ие вооружённые силы объявили о серии масштабных военных учений, которые пройдут в этом году.\n\nПо словам представителей [SOV.GetAdjective]ого правительства, повышенная боеготовность должна заставить [GER.GetAdjective]ую сторону отказаться от «продолжения клеветнической кампании»."
 wtt_news.9.a:0 "Они сыграли нам прямо на руку!"
 wtt_news.9.b:0 "Это наверняка заставит их задуматься."
 wtt_news.9.c:0 "Будем надеяться, [GER.GetAdjective]ая сторона нас не подведёт."
 wtt_news.9.d:0 "Так они точно не помогут разрядить обстановку."
 wtt_news.10.t:0 "[SOV.GetAdjective]ая сторона ускоряет наращивание вооружений"
 wtt_news.10.desc:0 "В ответ на недавнее [GER.GetAdjective]ое объявление о создании Центральноевропейского альянса против [SOV.GetAdjective]ой агрессии [SOV.GetAdjective]ое правительство приняло меры по резкому ускорению военного производства.\n\nПредставитель Кремля недвусмысленно заявил, что государство [SOV.GetNameDef] не может безучастно наблюдать, как у его границ возникает подобная угроза. Меры противодействия были приняты незамедлительно."
 wtt_news.10.a:0 "Они сами того не понимая продолжают помогать нашему делу!"
 wtt_news.10.b:0 "Теперь они не посмеют совершить ещё большую глупость!"
 wtt_news.10.c:0 "По крайней мере, альянс уже создан."
 wtt_news.10.d:0 "Эскалация идёт стремительно."
 wtt_news.11.t:0 "[SOV.GetAdjective]ая сторона укрепляет свою сферу влияния"
 wtt_news.11.desc:0 "После приглашения одного из приграничных государств в альянс [GER.GetFactionName] советское правительство предельно ясно предостерегло от дальнейшего вмешательства в дела «своей сферы влияния».\n\nПо неподтверждённым сведениям, советские вооружённые силы начали мобилизацию и, возможно, готовятся к войне."
 wtt_news.11.a:0 "Неужели мы наконец зашли достаточно далеко?"
 wtt_news.11.b:0 "Мы должны обезопасить свои границы!"
 wtt_news.11.c:0 "Вместе мы сумеем им противостоять!"
 wtt_news.11.d:0 "Неужели это та самая искра?"
 wtt_news.11.e:0 "Мы должны готовиться к войне!"
 wtt_news.12.t:0 "Протест против кайзера приводит к войне"
 wtt_news.12.desc:0 "В ответ на решение [GER.GetAdjective]ой стороны разрешить возвращение Вильгельма II государства [FRA.GetNameDef] и [ENG.GetNameDef] объявили войну государству [GER.GetNameDef]. [FRA.GetAdjective]ая и [ENG.GetAdjective]ая стороны называют причиной эскалации «вопиющее [GER.GetAdjective]ое упрямство», позволившее «известному военному преступнику» вновь стать главой государства.\n\nПредставители обоих правительств утверждают, что позволить «главному зачинщику» Великой войны вновь принять германскую корону совершенно безнравственно, а германское правительство проигнорировало все предупреждения. «У нас не было иного выбора»."
 wtt_news.12.a:0 "Они смеют указывать нам, кто может быть нашим правителем?"
 wtt_news.12.b:0 "Они вынудили нас действовать!"
 wtt_news.12.c:0 "И вот мы вновь оказались в 1914 году."
 wtt_news.13.t:0 "Компромисс с Вильгельмом III"
 wtt_news.13.desc:0 "В ответ на яростное англо-французское сопротивление возвращению Вильгельма II на престол кайзера [GER.GetAdjective]ое правительство предложило компромисс: Вильгельм II продолжит жить в изгнании, но германский престол займёт его сын под именем Вильгельма III.\n\nГосударства [ENG.GetNameDef] и [FRA.GetNameDef] приняли это решение, и теперь остаётся надеяться, что оно обеспечит прочный мир между великими европейскими державами."
 wtt_news.13.a:0 "У нас не было иного выбора."
 wtt_news.13.b:0 "К счастью, [GER.GetAdjective]ая сторона образумилась."
 wtt_news.13.c:0 "Мир удалось сохранить."
 wtt_news.14.desc:0 "В ответ на решение [GER.GetAdjective]ой стороны разрешить возвращение Вильгельма II и несмотря на отсутствие поддержки со стороны [ENG.GetAdjective]ой стороны государство [FRA.GetNameDef] объявило войну государству [GER.GetNameDef]. [FRA.GetAdjective]ая сторона назвала причиной этой эскалации «вопиющее [GER.GetAdjective]ое упрямство», позволившее «известному военному преступнику» вновь стать главой государства.\n\nПредставители [FRA.GetAdjective]ого правительства заявили, что позволить «главному зачинщику» Великой войны вновь принять германскую корону совершенно безнравственно. [GER.GetAdjective]ое правительство проигнорировало все предупреждения. «У нас не было иного выбора»."
 wtt_news.14.c:0 "Глупые, упрямые французы!"
 wtt_news.14.d:0 "Но что предпримет [ENG.GetAdjective]ая сторона?"
 wtt_news.15.desc:0 "В ответ на яростное противодействие [FRA.GetAdjective]ой стороны возвращению Вильгельма II в качестве кайзера [GER.GetAdjective]ое правительство предложило компромисс: Вильгельм II останется в изгнании, однако [GER.GetAdjective]ий престол под именем Вильгельма III займёт его сын.\n\nГосударство [FRA.GetNameDef] приняло это предложение, и теперь есть надежда, что оно обеспечит прочный мир между великими державами континентальной Европы."
 wtt_news.15.c:0 "К счастью, [GER.GetAdjective]ая сторона оказалась благоразумнее [FRA.GetAdjective]ой."
 wtt_news.16.t:0 "Китай восстанавливает германское правление в Циндао"
 wtt_news.16.desc:0 "Китайское правительство решило присоединиться к недавнему соглашению [GER.GetAdjective] Они требуют вернуть свой старый анклав в Циндао.\n\nДействует немедленно, [GER.GetAdjective] контроль был восстановлен в пределах города, и [GER.GetAdjective] Правительство переименовало его в свой старый [GER.GetAdjective] Имя Цинтао."
 wtt_news.16.a:0 "Мы ещё вернём себе колониальное величие."
 wtt_news.16.b:0 "Это была лишь небольшая цена."
 wtt_news.16.c:0 "Мы уже отбирали его у них и сможем сделать это снова!"
 wtt_news.16.d:0 "[GER.GetAdjective]ий колониализм возвращается?"
 wtt_news.17.t:0 "[JAP.GetNameDefCap] восстанавливает [GER.GetAdjective]ое правление в Циндао"
 wtt_news.17.desc:0 "\nThe [JAP.GetAdjective] Правительство решило присоединиться к недавнему [GER.GetAdjective] Они требуют вернуть свой старый анклав в Циндао.\n\nДействует немедленно, [GER.GetAdjective] контроль был восстановлен в пределах города, и [GER.GetAdjective] Правительство переименовало его в свой старый [GER.GetAdjective] Имя Цинтао."
 wtt_news.17.b:0 "Как они посмели отдать нашу территорию?"
 wtt_news.17.c:0 "Будем считать, что за 1914 год мы в расчёте."
 wtt_news.18.t:0 "Австрия голосует за присоединение к Германии"
 wtt_news.18.desc:0 "С начала тесного союзнического сотрудничества между государствами [AUS.GetNameDef] и [GER.GetNameDef] стремление к объединению в Австрии резко усилилось. На вчерашнем плебисците австрийский народ подавляющим большинством проголосовал за объединение с северным соседом.\n\nИнтеграция [AUS.GetAdjective]ого государства началась незамедлительно, а сегодня утром государство [GER.GetNameDef] упразднило прежнюю государственность."
 wtt_news.18.a:0 "За Великую Германию."
 wtt_news.18.b:0 "Такова была их воля."
 wtt_news.19.t:0 "[POL.GetNameDefCap] возвращает Данциг и Познань"
 wtt_news.19.desc:0 "Перед лицом продолжающегося [SOV.GetAdjective] натиск, то есть [POL.GetAdjective] Сегодня утром правительство объявило о немедленном возвращении старых немецких территорий Данцига и Познани. [GER.GetNameDef].\n\nНесмотря на полное молчание [POL.GetAdjective] или [GER.GetAdjective] Эксперты сходятся во мнении, что это, скорее всего, попытка удержать эти территории от [SOV.GetAdjective] руки перед лицом неизбежного [POL.GetAdjective] военный крах."
 wtt_news.19.a:0 "Мы защитим их ценой своей жизни."
 wtt_news.19.b:0 "Это был лучший вариант."
 wtt_news.19.c:0 "Коварные и бесчестные дипломатические уловки!"
 wtt_news.19.d:0 "Поразительно хитроумная дипломатическая сделка."
 wtt_news.20.t:0 "[GER.GetNameDefCap] объявляет об анти-[SOV.GetAdjective]ом пакте"
 wtt_news.20.desc:0 "На фоне усилившихся опасений перед [SOV.GetAdjective]ой агрессией государство [GER.GetNameDef] предложило «странам, находящимся под непосредственной угрозой коммунизма» объединиться против государства [SOV.GetNameDef]. Каждая страна альянса обязуется вступить в войну против государства [SOV.GetNameDef], если нападению подвергнется один из его членов."
 wtt_news.21.t:0 "[From.GetNameDefCap] выступает против государства [SOV.GetNameDef]"
 wtt_news.21.desc:0 "[GER.GetAdjective]ое правительство усилило риторику против государства [SOV.GetNameDef], предупреждая, что восточный сосед Европы представляет собой «великую красную угрозу», нависшую над континентом. Является ли это запугиванием или имеет под собой реальные основания — вопрос спорный, но очевидно, что [GER.GetAdjective]ая сторона стремится объединить континент против Востока."
 wtt_news.21.a:0 "Мир должен узнать о [SOV.GetAdjective]ой угрозе!"
 wtt_news.21.b:0 "Как они смеют так нас клеветать?!"
 wtt_news.21.d:0 "Посмотрим, как на это отреагирует [SOV.GetAdjective]ая сторона."
 wtt_news.22.t:0 "[From.GetNameDefCap] объявляет о создании Центральноевропейского альянса"
 wtt_news.22.desc:1 "\nГосударство [GER.GetNameDefCap] продолжило недавнюю анти-[SOV.GetAdjective]ую риторику и разработало конкретный план по сдерживанию [SOV.GetAdjective]ого влияния на остальной части континента. Был создан новый союз — Центральноевропейский альянс, который со временем, как надеются его основатели, сможет защитить своих участников от того, что [GER.GetAdjective]ая сторона называет «необузданной [SOV.GetAdjective]ой агрессией»."
 wtt_news.22.a:0 "Мы возглавим свободную Европу в борьбе с угрозой коммунизма!"
 wtt_news.22.b:0 "Они всё сильнее угрожают нашим позициям."
 wtt_news.22.c:0 "Наконец-то [GER.GetAdjective]ая сторона начала действовать."
 wtt_news.22.d:0 "Вряд ли [SOV.GetAdjective]ая сторона оставит это без ответа."
 wtt_news.23.t:0 "Вишистская Франция аннексирована"
 wtt_news.23.desc:0 "[GER.GetAdjective]ая операция по аннексии Вишистской Франции, начатая ранее на этой неделе, успешно завершена. [GER.GetAdjective]ие войска успели взять под контроль военно-морскую базу в Тулоне до отправки приказа о затоплении французского флота. Весь французский флот в целости попал в [GER.GetAdjective]ие руки."
 wtt_news.23.a:0 "Великий успех!"
 wtt_news.23.b:0 "Они не исполнили свой долг."
 wtt_news.23.c:0 "[GER.GetAdjective]ая сторона беспощадна."
 wtt_news.24.t:0 "Французы затапливают флот"
 wtt_news.24.desc:0 "[GER.GetAdjective]ая операция по аннексии Вишистской Франции, начатая ранее на этой неделе, успешно завершена. Однако [GER.GetAdjective]ие войска не успели взять под контроль военно-морскую базу в Тулоне до отправки приказа о затоплении французского флота. В результате весь французский флот был затоплен, чтобы не допустить его попадания в [GER.GetAdjective]ие руки."
 wtt_news.24.a:0 "Досадно, но это не имеет значения."
 wtt_news.24.b:0 "Они сдержали слово до конца."
 wtt_news.24.c:0 "Последний акт французского неповиновения."
 wtt_burma_road.1.t:0 "Бирманская дорога перекрыта"
 wtt_burma_road.1.desc:0 "Войска государства [occupying_country.GetAdjective], наступающие на регион [state_occupied.GetName], достигли Бирманской дороги и перерезали её в нескольких местах. По этому маршруту к нам больше не смогут поступать припасы."
 wtt_burma_road.1.a:0 "Легче от этого не станет."
 wtt_burma_road.2.desc:0 "Правительство государства [From.GetAdjective] решило прекратить движение по Бирманской дороге. Все колонны на маршруте остановлены и получили приказ вернуться. По этому пути к нам больше не смогут поступать припасы."
 wtt_burma_road.2.desc_war_with_from:0 "Войска государства [From.GetAdjective] стремительно продвинулись по Бирманской дороге и захватили несколько важнейших мостов и переправ. Теперь дорога закрыта для любого движения, и по этому маршруту к нам больше не смогут поступать припасы."
 wtt_burma_road.3.t:0 "[From.GetNameDefCap] вновь открывает часть Бирманской дороги"
 wtt_burma_road.3.desc:0 "После успешного возвращения под контроль значительной части Бирманской дороги власти государства [From.GetAdjective] разрешили возобновить движение. Хотя остатки вражеских сил делают путь ещё опаснее, чем прежде, поставки вновь начали поступать."
 wtt_burma_road.3.a:0 "Хороший первый шаг."
 wtt_burma_road.4.t:0 "[From.GetNameDefCap] вновь открывает Бирманскую дорогу"
 wtt_burma_road.4.desc:0 "Сегодня в Юньнань прибыла первая колонна снабжения по вновь открытой Бирманской дороге. Хотя для полного восстановления движения потребуется время, припасы снова поступают."
 wtt_burma_road.4.a:0 "Долгожданное облегчение."
 wtt_ledo_road.1.t:0 "Дорога Ледо перекрыта"
 wtt_ledo_road.1.desc:0 "Войска государства [occupying_country.GetAdjective], наступающие на регион [state_occupied.GetName], достигли дороги Ледо и перерезали её в нескольких местах. По этому маршруту к нам больше не смогут поступать припасы."
 wtt_ledo_road.2.desc:0 "Правительство государства [From.GetAdjective] решило прекратить движение по дороге Ледо. Все колонны на маршруте остановлены и получили приказ вернуться. По этому пути к нам больше не смогут поступать припасы."
 wtt_ledo_road.2.desc_war_with_from:0 "Войска государства [From.GetAdjective] стремительно продвинулись по дороге Ледо и захватили несколько важнейших мостов и переправ. Теперь дорога закрыта для любого движения, и по этому маршруту к нам больше не смогут поступать припасы."
 wtt_ledo_road.3.t:0 "[From.GetNameDefCap] вновь открывает часть дороги Ледо"
 wtt_ledo_road.3.desc:0 "После успешного возвращения под контроль значительной части дороги Ледо власти государства [From.GetAdjective] разрешили возобновить движение. Хотя остатки вражеских сил делают путь ещё опаснее, чем прежде, поставки вновь начали поступать."
 wtt_ledo_road.3.a:0 "Хороший первый шаг."
 wtt_ledo_road.4.t:0 "[From.GetNameDefCap] вновь открывает дорогу Ледо"
 wtt_ledo_road.4.desc:0 "Сегодня в Юньнань прибыла первая колонна снабжения по вновь открытой дороге Ледо. Хотя для полного восстановления движения потребуется время, припасы снова поступают."
 wtt_ledo_road.4.a:0 "Отличные новости!"
 wtt_the_hump.1.t:0 "Воздушный мост через Горб приостановлен"
 wtt_the_hump.1.desc:0 "Войска государства [occupying_country.GetAdjective] захватили несколько аэродромов в регионе [state_occupied.GetName], вынудив местные транспортные авиакрылья, обслуживавшие маршрут через Гималаи, эвакуироваться. Из-за растущей угрозы со стороны вражеских истребителей и увеличившейся дальности, не позволяющей достичь цели на одной заправке, воздушный мост был приостановлен. По этому маршруту к нам больше не смогут поступать припасы."
 wtt_the_hump.2.desc:0 "Правительство государства [From.GetAdjective] распорядилось немедленно прекратить все полёты через Гималаи. Несмотря на незамедлительные протесты, оно не проявило никакой готовности пересмотреть это решение."
 wtt_the_hump.2.desc_war_with_from:0 "Войска государства [From.GetAdjective] захватили аэродромы, использовавшиеся воздушным мостом через Горб, из-за чего снабжение по воздуху стало невозможным. По этому маршруту больше не стоит ожидать поставок."
 wtt_the_hump.3.t:0 "[From.GetNameDefCap] возобновляет воздушный мост через Горб"
 wtt_the_hump.3.desc:0 "Первые самолёты государства [From.GetAdjective] прибыли, доставив жизненно важные припасы через Гималаи. Хотя вражеские действия по-прежнему угрожают авиации, поставки вновь начали поступать."
 wtt_the_hump.3.a:0 "Хороший первый шаг."
 wtt_the_hump.4.t:0 "[From.GetNameDefCap] возобновляет воздушный мост через Горб"
 wtt_the_hump.4.desc:0 "Воздушный мост через Гималаи снова работает на полную мощность: строго контролируемое расписание ежедневных рейсов обеспечивает доставку большого количества крайне необходимых припасов."
 wtt_the_hump.4.a:0 "Дары с небес!"
 wtt_hanoi_route.1.t:0 "Ханойский маршрут перекрыт"
 wtt_hanoi_route.1.desc:0 "Грузовые суда с припасами для нашей армии получили отказ во входе в гавань Ханоя, поскольку маршрут на север к китайской границе был перекрыт государством [GetVietnamOwner]. \n\nПо этому пути больше невозможно доставлять припасы."
 wtt_hanoi_route.2.desc:0 "Местные власти государства [From.GetAdjective] получили приказ прекратить разгрузку военных материалов в Ханое для дальнейшей перевозки к китайской границе. На причалах выставлена вооружённая охрана, чтобы экипажи не смогли прорвать блокаду. Береговая охрана государства [From.GetAdjective] разворачивает все суда, ещё находящиеся в море.\n\nПо этому каналу больше не стоит ожидать поставок."
 wtt_hanoi_route.2.desc_war_with_from:0 "Войска государства [From.GetAdjective], оккупировавшие Ханой, захватили несколько грузовых судов с предназначенными для нас припасами. Суда, ещё находящиеся в море, развернулись и направляются в нейтральные гавани."
 CHI_vietnam_JAP:0 "[JAP.GetAdjective]ая армия"
 CHI_vietnam_FRA:0 "[FRA.GetAdjective]ие власти"
 wtt_china.1.t:0 "Китай требует подчинения"
 wtt_china.1.desc:0 "Похоже, [From.GetLeader] решил распространить свою власть на отдалённые районы Китая. Прибыл представитель центрального правительства с требованием исполнять приказы лидера [From.GetLeader], иначе наше правительство заменят более послушным."
 wtt_china.1.a:0 "Вместе мы выстоим!"
 wtt_china.1.b:0 "Пусть попробует."
 wtt_china.2.t:0 "[From.GetLeader] подчиняется"
 wtt_china.2.desc:0 "[From.GetLeader] отправил посланника обратно с личной запиской, в которой обещает выполнять наши распоряжения и координировать действия со своим правительством."
 wtt_china.2.a:0 "Хороший человек."
 wtt_china.3.t:0 "[From.GetLeader] отказывается"
 wtt_china.3.desc:0 "[From.GetLeader] вернул нашу записку, заявив, что центральное правительство не имеет законных полномочий смещать губернатора провинции. К ответу прилагался подробный отчёт о боеготовности его войск."
 wtt_china.3.a:0 "Это мы ещё посмотрим."
 wtt_china.10.t:0 "Китай требует подчинения"
 wtt_china.10.desc:0 "Правительство лидера [From.GetLeader] направило резкое послание, указав на несколько принятых нами за последние месяцы политических решений, которые оно считает противоречащими национальным интересам государства [From.GetNameDef]. Если мы не приведём свою политику в большее соответствие с курсом [From.GetAdjective]ого правительства, оно примет «такие меры, какие сочтёт необходимыми»."
 wtt_china.10.a:0 "У нас нет выбора."
 wtt_china.10.b:0 "Мы будем сражаться!"
 wtt_china.11.t:0 "[From.GetNameDefCap] подчиняется"
 wtt_china.11.desc:0 "[From.GetAdjective]ое правительство ответило на нашу ноту и пообещало советоваться с нами при принятии всех дальнейших решений. Наш посол в государстве [From.GetNameDef] получил должность специального представителя и поручение следить, чтобы [From.GetAdjective]ая сторона не слишком отклонялась от курса."
 wtt_china.11.a:0 "Отлично!"
 wtt_china.12.t:0 "[From.GetNameDefCap] проявляет неповиновение"
 wtt_china.12.desc:0 "Наша дипломатическая нота государству [From.GetNameDef] просочилась в прессу и вызвала бурю возмущения. Даже международные газеты опубликовали крайне неблагоприятные редакционные статьи, назвав наши разумные требования о консультациях «вмешательством во внутренние дела», «опасным прецедентом» и даже «неприкрытым империализмом».\n\n[From.GetAdjective]ое правительство отказалось продолжать обсуждение и дало понять, что повторное поднятие этого вопроса приведёт к полному разрыву дипломатических контактов."
 wtt_china.12.a:0 "Придётся принять меры."
 wtt_infiltration.1.t:0 "Операция против проникновения"
 wtt_infiltration.2.t:0 "В регионе [infiltrated_state.GetName] обнаружена коммунистическая ячейка"
 wtt_infiltration.2.desc:0 "Расследование наших властей выявило коммунистическую базу в регионе [infiltrated_state.GetName]. Необходимо как можно скорее обрушить на этих бандитов всю мощь нашей армии. Любая задержка позволит им расширить район действий и значительно осложнит их искоренение."
 wtt_infiltration.2.a:0 "Послать войска."
 wtt_infiltration.3.t:0 "Коммунисты сдержаны"
 wtt_infiltration.3.desc:0 "Последние рейды наших агентов по известным убежищам коммунистов не принесли результатов. Мы знаем, что коммунистические агенты всё ещё действуют в стране, но, судя по всему, неизвестных нам ячеек пока нет."
 wtt_infiltration.3.a:0 "Уничтожим уже найденные ячейки!"
 wtt_infiltration.4.t:0 "Коммунистическое проникновение побеждено?"
 wtt_infiltration.4.desc:0 "Сообщения о широкомасштабном коммунистическом проникновении, похоже, были сильно преувеличены. Рейды по нескольким известным убежищам и местам пребывания коммунистических активистов ничего не выявили. Это означает либо то, что коммунисты не смогли организовать ячейки, либо то, что нам удалось уничтожить уже созданные ими структуры. Однако необходимо сохранять бдительность: они наверняка попытаются усыпить наше внимание, прежде чем возобновить свои действия."
 wtt_infiltration.4.a:0 "Будем надеяться, что мы избавились от них всех."
 wtt_infiltration.5.t:0 "Обнаружена база в регионе [infiltrated_state.GetName]"
 wtt_infiltration.5.desc:0 "Патрули националистов приблизились к нашей базе в регионе [infiltrated_state.GetName]. Если они решат выделить необходимые ресурсы, то смогут уничтожить её в ходе согласованной военной операции."
 wtt_infiltration.5.a:0 "Будем надеяться, до этого не дойдёт."
 wtt_infiltration.6.t:0 "База в регионе [infiltrated_state.GetName] атакована"
 wtt_infiltration.6.desc:1 "Вражеские силы начали наступление на нашу базу в регионе [infiltrated_state.GetName]. От товарищей в регионе не поступило ни одного сообщения, а вражеская пресса уже объявляет о завершении «кампании по окружению и уничтожению в регионе [infiltrated_state.GetName]». Следует готовиться к худшему."
 wtt_infiltration.6.a:0 "Революция потерпела неудачу."
 wtt_infiltration.10.t:0 "Коммунистическое восстание"
 wtt_infiltration.10.desc:0 "В Коммунистической партии что-то происходит. Наши разведслужбы перехватили нескольких курьеров, перемещавшихся между базовыми районами и перевозивших секретные приказы о подготовке «революционного контрудара» на подпольных базах по всей стране. Для крупной операции — возможно, даже общенационального восстания — собираются солдаты и припасы. Мы должны немедленно подготовиться."
 wtt_infiltration.10.a:0 "Готовиться к борьбе за Китай!"
 wtt_infiltration.21.t:0 "В регионе [infiltrated_state.GetName] обнаружена коммунистическая ячейка"
 wtt_infiltration.21.desc:0 "Действуя по сведениям разведслужбы, наши патрули обнаружили крупную коммунистическую базу. Мы должны нанести удар немедленно, пока противник не успел лучше организоваться и оказать сопротивление нашим попыткам его уничтожить."
 wtt_infiltration.21.a:0 "Скорость имеет решающее значение."
 wtt_infiltration.23.t:0 "Коммунистическая угроза отступает?"
 wtt_infiltration.23.desc:0 "Серия рейдов по известным коммунистическим убежищам почти не дала новых сведений о масштабах проникновения. Тщательные допросы арестованных коммунистов не выявили ничего, чего бы мы уже не знали.\n\nПохоже, наша разведслужба довольно хорошо контролирует ситуацию."
 wtt_infiltration.23.a:0 "Нужно зачистить немногие известные нам ячейки."
 wtt_infiltration.24.a:0 "Будем надеяться, что мы избавились от них всех."
 wtt_infiltration.24.t:0 "Коммунистическая угроза устранена"
 wtt_infiltration.24.desc:0 "Похоже, за последние месяцы коммунисты понесли тяжёлые потери и потерпели серьёзные неудачи. Наши агенты перехватывают всё больше сообщений из штаба Коммунистической партии, в которых местных руководителей спрашивают об их положении — нередко уже после того, как мы арестовали этих руководителей и устроили засаду на курьеров. Сейчас коммунисты, судя по всему, отступают, а их организация на уровне регионов нарушена настолько, что практически утратила эффективность.\n\nМы должны сохранять бдительность: пока Коммунистическая партия существует хотя бы в какой-либо форме, она может вновь попытаться активизироваться."
 CHI_xian_warlords_upset:0 "Это возмутит военачальников. Они могут покинуть вашу фракцию, отказаться от попыток подчинить их и в будущем припомнят вам это оскорбление."
 wtt_xian_incident.1.t:0 "Приглашение от лидера [From.GetLeader]"
 wtt_xian_incident.1.desc:0 "[From.GetLeader] направил лидеру [CHI.GetLeader] официальное приглашение встретиться в Сиане, чтобы обсудить нынешнее положение и дальнейшие шаги в борьбе с коммунистами.\n\nОтказ будет воспринят лидером [From.GetLeader] как личное оскорбление и, несомненно, привлечёт внимание других военачальников."
 wtt_xian_incident.1.a:0 "Поехать."
 wtt_xian_incident.1.b:0 "Не ехать."
 wtt_xian_incident.2.t:0 "[From.GetLeader] прибывает в Сиань"
 wtt_xian_incident.2.desc:0 "В сопровождении лишь небольшого эскорта лидер [From.GetLeader] прибыл в Сиань, чтобы обсудить с нами положение дел. Он, несомненно, ожидает, что мы подтвердим решимость уничтожить коммунистов. Однако, когда [JAP.GetAdjective]ая армия уже стоит у нашего порога, нам придётся ясно изложить свою позицию."
 wtt_xian_incident.2.a:0 "Предложить ему союз с коммунистами."
 wtt_xian_incident.3.t:0 "[From.GetLeader] отказывается от встречи"
 wtt_xian_incident.3.desc:0 "Сославшись на тяжёлую простуду, [CHI.GetLeader] «с сожалением» отклонил наше приглашение. Означает ли это, что в ближайшем будущем он намерен напрямую взять наши земли под контроль, или кто-то раскрыл ему наши планы, пока неизвестно."
 wtt_xian_incident.3.a:0 "Может, он и правда простудился?"
 wtt_xian_incident.4.t:0 "[From.GetLeader] предлагает союз с коммунистами"
 wtt_xian_incident.4.desc:0 "На встрече в Сиане лидер [From.GetLeader] выступил с неожиданным предложением: он считает, что перед лицом [JAP.GetAdjective]ой угрозы мы должны объединиться с коммунистами в единый фронт."
 wtt_xian_incident.4.a:0 "Возможно, он прав."
 wtt_xian_incident.4.b:0 "Мы ещё помним, чем закончилась предыдущая попытка."
 wtt_xian_incident.5.t:0 "[CHI.GetLeader] предлагает союз"
 wtt_xian_incident.5.desc:0 "Похоже, националистическому лагерю наконец надоели попытки стереть нас с лица земли. На встрече в Сиане [CHI.GetLeader] согласился рассмотреть возможность союза с нами против [JAP.GetAdjective]ой стороны.\n\nНам следует тщательно взвесить все варианты."
 wtt_xian_incident.5.a:0 "[JAP.GetAdjective]ая сторона представляет большую угрозу."
 wtt_xian_incident.5.b:0 "Никаких сделок с националистами!"
 wtt_xian_incident.6.t:0 "[From.GetLeader] отказывается вступать в союз с коммунистами"
 wtt_xian_incident.6.desc:0 "Несмотря на наши доводы и требования прекратить эту бессмысленную войну, [From.GetLeader] отказался даже рассматривать идею Единого фронта с коммунистами. Придётся принять более решительные меры. Арестовать его и передать коммунистам?"
 wtt_xian_incident.6.a:0 "Это наш единственный выход."
 wtt_xian_incident.6.b:0 "Ситуация может легко выйти из-под контроля."
 wtt_xian_incident.7.t:0 "[CHI.GetLeader] арестован в государстве [CHI_xian_instigator.GetNameDef]!"
 wtt_xian_incident.7.desc_a:1 "[CHI_xian_instigator.GetLeader] прислал сообщение о том, что арестовал лидера [CHI.GetLeader] и готов передать его нам. \n\nВозможно, это лучший шанс казнить этого врага народа!"
 wtt_xian_incident.7.desc_b:0 "[From.GetLeader] отверг наше предложение казнить лидера [CHI.GetLeader]. Вместо этого нам предлагается заключить союз с националистами, поскольку мы якобы ещё не готовы одновременно возглавить революцию и защититься от японцев."
 wtt_xian_incident.7.a:0 "Запросить одобрение [SOV.GetAdjective]ой стороны."
 wtt_xian_incident.7.b:0 "Отрубить ему голову!"
 wtt_xian_incident.7.c:0 "Следует объединиться с ним против [JAP.GetAdjective]ой стороны."
 wtt_xian_incident.7.d:0 "Его убийство сейчас приведёт к войне, которую нам не выиграть. Отпустить его."
 wtt_xian_incident.8.t:0 "[From.GetLeader] арестовал лидера [CHI.GetLeader]!"
 wtt_xian_incident.8.desc:0 "Мы перехватили сообщение от лидера [From.GetLeader], в котором говорится, что [CHI.GetLeader] находится под стражей и будет передан коммунистам. Учитывая степень ненависти к нему, вряд ли он долго проживёт.\n\nЧтобы не допустить показательного суда над лидером [CHI.GetLeader], устроенного [PRC.GetLeader], и его последующей казни, мы должны действовать быстро и решительно!"
 wtt_xian_incident.8.a:0 "Ввести войска!"
 wtt_xian_incident.8.b:0 "Они не причинят ему вреда. Подождём."
 wtt_xian_incident.9.t:0 "[CHI.GetLeader] арестован в государстве [CHI_xian_instigator.GetNameDef]!"
 wtt_xian_incident.9.desc:0 "[PRC.GetLeader] сообщил, что коммунисты получили уникальную возможность судить лидера [CHI.GetLeader] за преступления против народа и революции. Его казнь станет огромной победой коммунистической партии в борьбе за руководство Китаем.\n\nОднако это также ослабит националистов в критический момент и, возможно, позволит [JAP.GetAdjective]ой стороне добиться новых успехов в Китае."
 wtt_xian_incident.9.a:0 "Ещё один буржуазный враг встретит свой конец."
 wtt_xian_incident.9.b:0 "Он нам ещё нужен."
 wtt_xian_incident.10.t:0 "[PRC.GetLeader] предлагает союз"
 wtt_xian_incident.10.desc:0 "Вместо ожидаемого показательного суда и последующей казни коммунисты дали понять, что предпочитают заключить официальный союз против [JAP.GetAdjective]ой стороны.\n\nОни тянут время, понимая, что ещё один мощный удар полностью их уничтожит. Если бы они хотели смерти лидера [CHI.GetLeader], его уже казнили бы.\n\nОднако некоторые члены нашего правительства задаются вопросом, почему коммунисты предлагают союз именно сейчас. Возможно, им известно нечто, чего не знаем мы?"
 wtt_xian_incident.10.a:0 "Пока они подчиняются нашим приказам."
 wtt_xian_incident.10.b:0 "Никаких сделок с коммунистами!"
 wtt_china_shared.1.t:0 "[From.GetNameDefCap] предлагает поддержку"
 wtt_china_shared.1.desc:0 "[From.GetLeader] прибыл в нашу столицу, чтобы обсудить положение страны. На встрече с борцами за независимость и представителями правительства он заявил, что наша независимость жизненно важна для национальных интересов государства [From.GetNameDef] и оно готово поддержать любые попытки добиться большей самостоятельности."
 wtt_china_shared.1.a:0 "Их помощь будет как нельзя кстати."
 wtt_china_shared.1.b:0 "Нынешнее положение нас вполне устраивает."
 wtt_china_shared.2.t:0 "[From.GetNameDefCap] принимает нашу поддержку"
 wtt_china_shared.2.desc:0 "В частной беседе представители правительства государства [From.GetNameDef] проявили большой интерес к тому, как мы можем поддержать создание независимого государства. Группы, выступающие за расширение независимости, уже получили финансирование, а мы начали создавать «Временное свободное [From.GetAdjective]ое правительство в изгнании»."
 wtt_china_shared.2.a:0 "Их борьба — наша борьба."
 wtt_china_shared.3.t:0 "[From.GetNameDefCap] отвергает нашу поддержку"
 wtt_china_shared.3.desc:0 "В строгой записке, [From.GetLeader] Он сообщил нам, что его правительство не потерпит никакого вмешательства во внутренние дела. [From.GetAdjective] Это важно. Дипломатический протокол запрещает объявлять [From.From.GetLeader] Личность нон грата и запрет на его въезд, но практически всей нашей делегации запретили возвращаться в страну. [From.GetNameDef] Вместо этого."
 wtt_china_shared.3.a:0 "Позор."
 wtt_china_shared.4.t:0 "Движение за независимость в государстве [From.GetNameDef] набирает силу"
 wtt_china_shared.4.desc:0 "Похоже, недавний визит лидера [From.From.GetLeader] в государство [From.GetNameDef] не ограничился обменом любезностями за чашкой чая. Ранее разобщённые и раздробленные движения за независимость страны стали действовать гораздо слаженнее. Кажется, кто-то помогает им организоваться из-за рубежа."
 wtt_china_shared.4.a:0 "Тревожно."
 wtt_china_shared.10.t:0 "Летающие тигры"
 wtt_china_shared.10.desc_a:0 "Сун Мэйлин, жена Чан Кайши и одна из его самых доверенных советников, прибыла в Вашингтон, чтобы добиться расширения поддержки государства [CHI.GetNameDef] в борьбе против государства [JAP.GetNameDef]. [CHI.GetAdjective]им ВВС отчаянно не хватает современных самолётов и опытных пилотов.\n\nПризыв Сун нашёл отклик у общественности, и ряд наших лётчиков уволились со службы, чтобы поступить в [CHI.GetAdjective]ую компанию и заниматься «обучением и инструктажем» [CHI.GetAdjective]их пилотов.\n\nПосле решения вопроса с пилотами Сун Мэйлин попросила нас разрешить передачу примерно 150 новейших истребителей для перевооружения [CHI.GetAdjective]их ВВС."
 wtt_china_shared.10.desc_b:0 "Война в Китае тяжело сказалась на китайских ВВС. Уступая противнику числом и вооружением, они отважно боролись за небо над Китаем.\n\nНесмотря на храбрость пилотов, [From.GetAdjective]ие ВВС отчаянно нуждаются в новых самолётах и лётчиках для восполнения потерь. Делегация, направленная лидером [From.GetLeader], прибыла в Вашингтон, чтобы договориться о передаче примерно 150 современных истребителей и разрешении такому же числу пилотов отправиться в Китай для управления этими машинами."
 wtt_china_shared.10.a:0 "Мы должны поддержать их всеми возможными средствами."
 wtt_china_shared.10.b:0 "Нельзя позволить втянуть нас в этот конфликт."
 wtt_china_shared.11.t:0 "[SOV.GetAdjective]ая добровольческая группа"
 wtt_china_shared.11.desc_a:0 "Продолжающиеся бои в Китае требуют обеспечить воздушную поддержку нашим товарищам из [From.GetAdjective]ой Красной армии. [From.GetLeader] обратился к нам с просьбой направить добровольческую группу пилотов и самолётов: около 50 бомбардировщиков и 100 истребителей сопровождения.\n\nЭто позволит нашим пилотам приобрести полезный опыт и испытать новейшие разработки в боевых условиях."
 wtt_china_shared.11.desc_b:0 "Пока война в Китае продолжается, [From.GetAdjective]ие ВВС из последних сил защищают воздушное пространство государства [From.GetNameDef] и поддерживают наземные войска. [From.GetLeader] лично обратился к лидеру [SOV.GetLeader] с просьбой направить объединённую группу примерно из 50 средних бомбардировщиков и 100 истребителей.\n\nЭто может стать ценной возможностью испытать нашу новейшую технику в боевых условиях."
 wtt_china_shared.11.a:0 "Мы должны поддержать их всеми возможными средствами."
 wtt_china_shared.11.b:0 "Им придётся обойтись тем, что есть."
 wtt_china_shared.12.t:0 "Новый генерал для государства [From.GetNameDef]"
 wtt_china_shared.12.desc:0 "[From.GetLeader] направил письмо лидеру [USA.GetLeader] с предложением отправить одного из наших генералов на должность начальника штаба [From.GetAdjective]ой армии.\n\nЭто заслужит личную благодарность лидера [From.GetLeader], даст нашему генералу ценный опыт и поможет войскам [From.GetLeader] победить в войне.\n\nКого из генералов отправить?"
 wtt_china_shared.12.a:0 "Отправить Джозефа Стилуэлла."
 wtt_china_shared.12.b:0 "Им придётся справляться самостоятельно."
 wtt_china_shared.12.c:0 "Отправить Дугласа Макартура."
 wtt_china_shared.12.d:0 "Отправить Дуайта Эйзенхауэра."
 wtt_china_shared.13.t:0 "[CHI_USA_General.GetName] прибывает в Китай"
 wtt_china_shared.13.desc:0 "[From.GetLeader] удовлетворил нашу просьбу о помощи и приказал генералу [CHI_USA_General.GetName] как можно скорее прибыть на службу в Китай.\n\nГенерал должен стать не просто советником лидера [Root.GetLeader], а командовать войсками на поле боя, приобретая непосредственный опыт современной войны."
 wtt_china_shared.13.a:0 "Ценное пополнение."
 wtt_china_shared.14.t:0 "Государство [From.GetNameDef] отказывает в помощи"
 wtt_china_shared.14.desc:0 "Наша просьба к лидеру [From.GetLeader] осталась без ответа. Хотя несколько высокопоставленных офицеров армии США выразили готовность принять назначение, военный министр и президент [From.GetLeader] наложили вето, назвав эту идею непрактичной и не отвечающей национальным интересам."
 wtt_china_shared.14.a:0 "Они трусы, глупцы или и то и другое?"
 wtt_prc.1.t:0 "[From.GetLeader] предлагает союз"
 wtt_prc.1.desc:0 "После долгих лет безрезультатной борьбы и на фоне растущей угрозы со стороны Японии коммунисты предложили создать совместное правительство. Наши армии будут сражаться бок о бок, а политические действия — координироваться.\n\nПричины такой внезапной перемены в позиции коммунистов менее ясны, и некоторые члены правительства считают это лишь первым этапом плана по захвату страны."
 wtt_prc.1.a:0 "Мы должны объединиться против врагов."
 wtt_prc.1.b:0 "Мы не попадёмся на этот дешёвый трюк."
 wtt_prc.2.t:0 "[From.GetLeader] отказывается от союза"
 wtt_prc.2.desc:0 "После долгих раздумий [From.GetLeader] решил отвергнуть нашу делегацию. Источники в правительстве сообщают, что он повсюду видит коммунистические заговоры и считает, будто мы пытаемся захватить власть и отнять у него страну."
 wtt_prc.2.a:0 "Какая паранойя."
 wtt_prc.10.t:0 "[From.GetNameDefCap] требует нашего сотрудничества"
 wtt_prc.10.desc:0 "После создания Правительства национальной обороны [From.GetLeader] ясно дал понять, что не потерпит «чрезмерной независимости и неповиновения». Поскольку война с государством [JAP.GetNameDef] становится всё вероятнее, любой, кто не поддерживает Правительство национальной обороны, будет считаться потенциальным врагом. [From.GetLeader] открыто заявил, что не станет ждать начала войны, прежде чем выступить против военачальников, отказывающихся преклонить колено."
 wtt_prc.10.a:0 "Рискнём и поддержим правительство."
 wtt_prc.10.b:0 "Этот напыщенный болван блефует."
 wtt_prc.11.t:0 "[From.GetNameDefCap] присоединяется к Правительству национальной обороны"
 wtt_prc.11.desc:0 "[From.GetLeader] внял голосу разума и решил вступить в наш альянс. Его войска поддержат нас в грядущих сражениях."
 wtt_prc.12.t:0 "[From.GetNameDefCap] отказывается"
 wtt_prc.12.desc:0 "По совершенно непостижимым причинам [From.GetLeader] отказался сотрудничать с нами даже по самым важным вопросам. Он заявил, что мы всего лишь шайка бандитов, которую он вскоре уничтожит, и призвал остальных военачальников выступить против нас."
 wtt_prc.12.a:0 "Мы заставим его подчиниться."
 PRC_provoke_japan_korea:0 "Корея"
 PRC_provoke_japan_manchuria:0 "Маньчжурия"
 wtt_prc.20.t:0 "Китайская провокация"
 wtt_prc.20.desc:0 "Появились новые сведения о последнем нападении на нашей территории. Пока ни один из преступников не пойман, однако доказательства указывают на преднамеренную провокацию со стороны Китая.\n\nКитайское правительство подозрительно медлит с осуждением атаки, а китайские газеты восхваляют её как героический акт неповиновения «[JAP.GetAdjective]ому империализму».\n\nКабинет министров собрался, чтобы обсудить ситуацию и предложить меры в ответ на это вопиющее нападение."
 wtt_prc.20.a:0 "Потребовать извинений."
 wtt_prc.20.b:0 "Мобилизовать войска и готовиться к войне."
 wtt_prc.21.t:0 "Диверсия на оружейном заводе"
 wtt_prc.21.desc:0 "С одного из наших заводов в государстве [JAP.GetManchuriaPuppet] поступили сообщения о крупном пожаре, начавшемся прошлой ночью. Местные пожарные всё ещё борются с огнём, но уверены, что возьмут его под контроль к концу дня. Заводу нанесён серьёзный ущерб: по-видимому, пожар начался на складе легковоспламеняющихся химикатов.\n\nВоенная разведка начала тщательное расследование причин пожара, несмотря на строжайшие меры безопасности. Первые данные указывают на вероятный поджог."
 wtt_prc.21.a:0 "Кто мог такое сделать?"
 wtt_prc.22.t:0 "Диверсия на гражданской фабрике"
 wtt_prc.23.t:0 "Взорван мост"
 wtt_prc.23.desc:0 "Прошлой ночью важный железнодорожный мост в государстве [JAP.GetManchuriaPuppet] обрушился под тяжестью поезда с боеприпасами. Спасательные и восстановительные работы осложняются вторичными взрывами. Экипаж поезда всё ещё не найден и считается погибшим.\n\nВоенная разведка направила группу для обследования места происшествия, как только это станет безопасно, чтобы выяснить, почему прочный мост рухнул без каких-либо предупреждающих признаков.\n\nМестные жители сообщают, что за день до катастрофы видели небольшую группу людей в долине под мостом. Их местонахождение неизвестно."
 wtt_prc.24.t:0 "Патруль попал в засаду"
 wtt_prc.24.desc:0 "Один из наших патрулей в государстве [JAP.GetManchuriaPuppet] не вышел на связь. Поисковая группа обнаружила на его маршруте место боя: судя по всему, патруль был застигнут врасплох и уничтожен в жестокой рукопашной схватке.\n\nПонесли ли нападавшие потери, неизвестно, но все найденные тела принадлежат солдатам [JAP.GetAdjective]ой армии.\n\nПохоже, их намеренно оставили на месте — возможно, в качестве послания."
 wtt_japan.1.t:0 "[From.GetNameDefCap] получает предложение передать наши колонии"
 wtt_japan.1.desc:1 "Пользуясь нашей слабостью, [From.GetAdjective]ая сторона предложила «помочь» нам «поддерживать порядок» в колониях. Они утверждают, что после падения метрополии мы больше не способны сохранять над ними контроль.\n\nЭто лишь уловка, чтобы отнять у нас колонии, но разве у нас есть выбор?"
 wtt_japan.1.a:0 "Пора признать [JAP.GetAdjective]ое господство на Востоке."
 wtt_japan.1.b:0 "Пусть попробуют забрать их силой!"
 wtt_japan.2.t:0 "[From.GetNameDefCap] передаёт контроль над колониями"
 wtt_japan.2.desc:0 "Государство [From.GetNameDefCap] тщательно рассмотрело наше предложение «поддерживать порядок» в его колониях и решило согласиться. Фактически оно передало нам полный контроль."
 wtt_japan.2.a:0 "Мудрое решение."
 wtt_japan.3.t:0 "[From.GetNameDefCap] отказывается передать контроль над колониями"
 wtt_japan.3.desc:0 "Государство [From.GetNameDefCap] тщательно рассмотрело наше предложение «поддерживать порядок» в его колониях и решило отказаться."
 wtt_japan.3.a:0 "Посмотрим, к чему это их приведёт."
 wtt_japan.11.t:0 "Пакт о ненападении с государством [From.GetNameDef]"
 wtt_japan.11.desc:0 "Несмотря на напряженность между [From.GetAdjective] и [Root.GetNameDef] До недавнего времени увеличиваясь, [From.GetAdjective] Мы начали переговоры по пакту о ненападении. Преимущества для нас очевидны, но что должно нас беспокоить, так это его преимущества для нашей страны. [From.GetAdjective] Будем ли мы жить, чтобы сожалеть об этом шаге?"
 wtt_japan.11.a:0 "Нам нужен мир. Пока что."
 wtt_japan.11.b:0 "Важнее не дать им никаких преимуществ!"
 wtt_japan.12.t:0 "[From.GetNameDefCap] принимает пакт о ненападении"
 wtt_japan.12.desc:0 "Государство [From.GetNameDefCap] официально приняло наше предложение заключить пакт о ненападении."
 wtt_japan.12.a:0 "Они играют нам на руку."
 wtt_japan.13.t:0 "[From.GetNameDefCap] отвергает пакт о ненападении"
 wtt_japan.13.desc:0 "По неизвестной причине государство [From.GetNameDef] отвергло наше предложение заключить пакт о ненападении."
 wtt_japan.13.a:0 "Они что-то замышляют против нас?"
 wtt_japan.21.t:0 "Обмен [From.GetAdjective]ими генералами"
 wtt_japan.21.desc:0 "[From.GetAdjective]ая сторона решила отозвать своих левых чиновников и генералов, а вместо них отправила к нам правых генералов и государственных служащих в неофициальную ссылку."
 wtt_japan.21.a:0 "Похоже, в государстве [From.GetNameDef] что-то происходит."
 wtt_japan.22.t:0 "Обмен [Root.GetAdjective]ими генералами завершён"
 wtt_japan.22.desc:0 "Обмен наших правых генералов и чиновников на левых, ранее отправленных нами в неофициальную ссылку в государство [From.GetNameDef], завершён."
 wtt_japan.22.a:0 "Это укрепит нашу власть над государством [Root.GetNameDef]."
 wtt_japan.31.t:0 "Судьба императорской семьи"
 wtt_japan.31.desc:0 "Пришло время решить судьбу императора и его семьи. В Японии, которую мы строим, нет места наследственному общественному положению. Что с ними сделать?"
 wtt_japan.31.a:0 "Изгнать их!"
 wtt_japan.31.b:0 "Отрубить им головы!"
 wtt_japan.32.t:0 "Императорская семья в изгнании"
 wtt_japan.32.desc:0 "Государство [From.GetNameDefCap] изгнало императорскую семью, оказав нам тем самым огромную услугу! Император прибыл в государство [Root.GetNameDef], и, несмотря на изгнание, всё ещё пользуется значительным влиянием среди народа и войск."
 wtt_japan.32.a:0 "Мы должны стать достойным домом для него!"
 wtt_japan.101.t:0 "Воссоединение Маньчжурии"
 wtt_japan.101.desc:0 "После недавней победы над государством [MAN.GetNameDef] [JAP.GetAdjective]ое правительство признало исторические связи Китая с регионом и немедленно передало нам полный контроль. Этим жестом доброй воли оно также предлагает заключить союз."
 wtt_japan.101.a:0 "Возможно, с [JAP.GetAdjective]ой стороной и правда можно договориться."
 wtt_japan.101.b:0 "Мы примем Маньчжурию, но не их дружбу."
 wtt_japan.102.desc:0 "Государство [From.GetNameDefCap] благодарит нас за возвращение Маньчжурии и принимает предложение о союзе."
 wtt_japan.103.desc:0 "Государство [From.GetNameDefCap] благодарит нас за возвращение Маньчжурии, но отвергает предложение о союзе."
 wtt_japan.104.t:0 "[PHI.GetAdjective]ий суверенитет"
 wtt_japan.104.desc:0 "Государство [From.GetNameDefCap] открыто и публично заявило, что «больше не может безучастно наблюдать», как страна в сфере его интересов остаётся под западным сапогом. Теперь оно требует ускорить процесс деколонизации и немедленно предоставить государству [PHI.GetNameDef] полный суверенитет."
 wtt_japan.104.a:0 "Они правы. Филиппинцы заслуживают свободы."
 wtt_japan.104.b:0 "[PHI.GetNameDefCap] останется [USA.GetAdjective]ой территорией!"
 wtt_japan.105.desc:0 "Государство [From.GetNameDefCap] ответило на наши требования о полной [PHI.GetAdjective]ой независимости, и [USA.GetAdjective]ое правительство немедленно начало подготовку к предоставлению своему тихоокеанскому владению полного суверенитета."
 wtt_japan.105.a:0 "По крайней мере, они проявили благоразумие."
 wtt_japan.106.desc:0 "Государство [From.GetNameDefCap] ответило на наши требования о полной [PHI.GetAdjective]ой независимости, вновь сославшись на «жизненно важные [USA.GetAdjective]ие интересы», которые представляет для него государство [PHI.GetNameDef] в этом регионе."
 wtt_japan.106.a:0 "И они ещё называют себя «защитниками свободы»?"
 wtt_japan.107.desc:0 "Государство [From.GetNameDefCap] ответило на [JAP.GetAdjective]ие требования о нашей полной независимости, и [USA.GetAdjective]ое правительство немедленно начало подготовку к предоставлению нам полного суверенитета!"
 wtt_japan.107.a:0 "Слава [JAP.GetAdjective]ой стороне!"
 wtt_japan.108.t:0 "Переворот молодых офицеров"
 wtt_japan.108.desc:0 "Группа молодых офицеров успешно убила ряд правительственных чиновников и премьер-министра. Они заняли Токио и установили контроль над Императорским дворцом, объявив о намерении очистить правительство от «коррумпированных чиновников» и «идеологических угроз», вернув императору единоличную власть над страной.\n\nИх действия неожиданно получили широкую поддержку в армии, где намеченные контрмеры были сорваны массовыми арестами и убийствами сторонников прежнего правительства. Столкнувшись с внезапностью и огромным размахом событий, а также контролем мятежников над дворцом, император не предпринял никаких попыток осудить восстание.\n\nОрганизованное сопротивление правительства, похоже, вот-вот рухнет, и ожидается, что мятежники в любой момент объявят о переходе всей внутренней, внешней и военной политики под полный императорский контроль."
 wtt_japan.108.a:0 "Тэнно хэйка банзай!"
 wtt_japan.109.t:0 "[JAP.GetNameDefCap] предлагает заключить Тройственный пакт"
 wtt_japan.109.desc:0 "Государство [From.GetNameDefCap] осторожно выяснило, заинтересованы ли мы в заключении трёхстороннего пакта между нами, [JAP_initiator.GetAdjective]ой стороной и [ITA_fascism.GetAdjective]ой стороной. [JAP_initiator.GetAdjective]ая сторона утверждает, что мы должны поддерживать друг друга из-за всё более враждебного отношения мирового сообщества к нашим действиям."
 wtt_japan.109.a:0 "Превосходная идея. Мы подпишем пакт."
 wtt_japan.109.b:0 "Нет, мы не должны рисковать и настраивать против себя весь мир."
 wtt_japan.110.desc:0 "Государство [JAP_initiator.GetNameDefCap] осторожно выяснило, заинтересованы ли мы в заключении трёхстороннего пакта между нами, [JAP_initiator.GetAdjective]ой стороной и [GER_fascism.GetAdjective]ой стороной. [JAP_initiator.GetAdjective]ая сторона утверждает, что мы должны поддерживать друг друга из-за всё более враждебного отношения мирового сообщества к нашим действиям."
 wtt_japan.111.t:0 "Тройственный пакт подписан"
 wtt_japan.111.desc:0 "[GER_fascism.GetAdjective]ое и [ITA_fascism.GetAdjective]ое правительства согласились подписать предложенный Тройственный пакт, пообещав выступить на нашей стороне в случае войны."
 wtt_japan.112.t:0 "[From.GetNameDefCap] отвергает Тройственный пакт"
 wtt_japan.112.desc:0 "[From.GetAdjective]ое правительство отвергло предложенный Тройственный пакт, предпочтя продолжить действовать в одиночку."
 wtt_japan.113.t:0 "[From.GetNameDefCap] подписывает Тройственный пакт"
 wtt_japan.113.desc:0 "[ITA_fascism.GetAdjective]ое правительство согласилось подписать предложенный Тройственный пакт, пообещав выступить на нашей стороне в случае войны."
 wtt_japan.114.t:0 "Демократические силы устраивают переворот"
 wtt_japan.114.desc:0 "Демократические силы в правительстве внезапно захватили власть после того, как военные вновь пригрозили ограничить с таким трудом завоёванные демократические права народа. С неожиданной быстротой значительная часть армии взялась за оружие, чтобы защитить народ и его право на свободу.\n\nРаскол в вооружённых силах позволил народным представителям захватить власть в законодательных и исполнительных органах. Хотя боевые действия только начались, маловероятно, что им удастся легко свергнуть нынешнее правительство."
 wtt_japan.114.a:0 "Военные больше никогда не будут нами править!"
 wtt_japan.115.t:0 "[From.GetNameDefCap] нападает на государство [SOV.GetNameDef]"
 wtt_japan.115.desc:0 "Государство [From.GetNameDefCap] в одностороннем порядке напало на государство [SOV.GetNameDef], несмотря на наш пакт о ненападении. Нам остаётся либо выполнить союзнические обязательства и поддержать [From.GetAdjective]ое нападение, либо соблюсти пакт о ненападении с [SOV.GetAdjective]ой стороной и осудить агрессию."
 wtt_japan.115.a:0 "Мы присоединимся к союзникам!"
 wtt_japan.115.b:0 "Наши соглашения нельзя нарушать. Пока что."
 wtt_japan.116.t:0 "[From.GetNameDefCap] вступает в войну"
 wtt_japan.116.desc:0 "Государство [From.GetNameDefCap] решило присоединиться к нашей войне против [SOV.GetAdjective]ой стороны, несмотря на ранее заключённый пакт о ненападении."
 wtt_japan.116.a:0 "Так и должно быть."
 wtt_japan.117.t:0 "[From.GetNameDef] осуждает нашу войну"
 wtt_japan.117.desc:0 "Несмотря на союзнические обязательства перед нами, государство [From.GetNameDefCap] решило соблюсти пакт о ненападении с [SOV.GetAdjective]ой стороной. Оно осудило нашу агрессию, по-видимому пытаясь спасти дипломатические отношения с другим участником пакта."
 wtt_japan.117.a:0 "Крайне прискорбно."
 wtt_japan.118.t:0 "[From.GetNameDefCap] просит о помощи"
 wtt_japan.118.desc:0 "Государство [From.GetNameDefCap] охвачено разрушительной гражданской войной и с трудом противостоит военной мощи противника. Его временное правительство предложило обменять Южный Сахалин на столь необходимую военную помощь.\n\nТак мы сможем быстро получить территорию в обмен на добровольческие дивизии."
 wtt_japan.118.a:0 "Превосходная идея!"
 wtt_japan_118_TT:0 "Эти добровольцы вернутся в резерв людских ресурсов, если государство §Y[From.GetName]§! победит в гражданской войне."
 wtt_japan.118.b:0 "Для нас это невыгодная сделка."
 wtt_japan.119.t:0 "[From.GetNameDefCap] принимает сделку"
 wtt_japan.119.desc:0 "Государство [From.GetNameDefCap] приняло наше предложение обменять Южный Сахалин на военную поддержку. Оно направило несколько дивизий «добровольцев», чтобы помочь нам в борьбе!"
 wtt_japan.119.a:0 "Они нам очень пригодятся!"
 wtt_japan.119.TT:0 "Получить 8 частей с §Y12 пехотными§! и §Y3 вспомогательными§! батальонами."
 wtt_japan.120.t:0 "[From.GetNameDefCap] отвергает сделку"
 wtt_japan.120.desc:0 "Государство [From.GetNameDefCap] сообщило, что отвергает наше предложение обменять Южный Сахалин на военную поддержку."
 wtt_japan.120.a:0 "Мы остались одни."
 wtt_japan.121.t:0 "[From.GetNameDefCap] захватывает Токио"
 wtt_japan.121.desc:0 "Государство [From.GetNameDefCap] захватило [JAP.GetAdjective]ую столицу, и фашистское [From.From.GetAdjective]ое правительство пало. Если мы хотим действовать, то должны сделать это немедленно. Необходимо быстро установить контроль над отдалёнными японскими островами и возглавить оставшиеся фашистские силы, чтобы сдержать коммунистическую угрозу."
 wtt_japan.121.a:0 "Привести план в исполнение."
 wtt_japan.121.b:0 "Сейчас нас это не интересует."
 wtt_japan.122.t:0 "Фашисты бегут в Маньчжурию"
 wtt_japan.122.desc:0 "После захвата Токио фашистское правительство пало, а оставшиеся сторонники и воинские части бежали в государство [MAN.GetNameDef], которое установило контроль над отдалёнными островами, Кореей и китайскими владениями.\n\nГражданская война фактически завершена, но перемирие в лучшем случае непрочно, поскольку фашисты не были окончательно разгромлены."
 wtt_japan.122.a:0 "Мы разберёмся с ними позднее."
 wtt_japan.123.t:0 "Сопротивление фашистов сломлено"
 wtt_japan.123.desc:0 "После захвата Токио фашистское правительство полностью развалилось. Оставшимся сторонникам и воинским частям не вокруг кого сплотиться, и они начали расходиться, что позволило без труда занять оставшиеся отдалённые территории."
 wtt_japan.123.a:0 "Война выиграна."
 wtt_japan.124.t:0 "Добровольцы возвращаются домой"
 wtt_japan.124.desc:0 "После победы коммунистов в Японии уцелевшие добровольцы вернулись домой."
 wtt_japan.125.t:0 "[SOV.GetAdjective]ая сторона возвращает Маньчжурию"
 wtt_japan.125.desc:0 "Освободив Маньчжурию от [JAP.GetAdjective]ой стороны и изгнав свергнутого цинского императора, государство [From.GetNameDef] предложило вернуть нам эту землю, заявив, что она должна вновь перейти в законные [Root.GetAdjective]ие руки."
 wtt_japan.126.t:0 "[From.GetNameDefCap] предлагает мир"
 wtt_japan.126.desc:1 "[From.GetAdjective]ие представители обратились к нам с мирным предложением. Они полностью покинут континент в обмен на немедленное прекращение боевых действий."
 wtt_japan.126.a:0 "Война выиграна."
 wtt_japan.126.b:0 "Нас удовлетворит только полная победа!"
 wtt_japan.127.t:0 "[From.GetNameDefCap] принимает мир"
 wtt_japan.127.desc:0 "Государство [From.GetNameDefCap] приняло наше мирное предложение и прекратило боевые действия в обмен на наши континентальные владения."
 wtt_japan.127.a:0 "Они одолели нас. Пока что."
 wtt_japan.128.t:0 "[From.GetNameDefCap] отвергает мир"
 wtt_japan.128.desc:0 "Государство [From.GetNameDefCap] отвергло наше мирное предложение и поклялось продолжать войну до нашей безоговорочной капитуляции."
 wtt_japan.128.a:0 "Тогда будем сражаться до последнего!"
 wtt_japan.40.t:0 "[From.GetLeader] требует вернуть Маньчжурию"
 wtt_japan.40.desc:0 "Несколько дней назад правительство государства [From.GetNameDef] начало оказывать на нас согласованное давление. Передовицы газет потребовали вернуть Маньчжурию под [From.GetAdjective]ий контроль. Это не просто пропагандистский ход для внутренней аудитории: представители лидера [From.GetLeader] по тайным дипломатическим каналам пытались договориться о будущем маньчжурских территорий.\n\nСегодня сам [From.GetLeader] вмешался в дело, потребовав как можно скорее полностью вернуть Маньчжурию государству [From.GetNameDef]. В противном случае его правительство будет вынуждено пересмотреть нынешнее сотрудничество."
 wtt_japan.40.a:0 "Она принадлежит им."
 wtt_japan.40.b:0 "Они ещё не готовы управлять собой."
 wtt_japan.41.t:0 "Военная помощь от государства [From.GetNameDef]"
 wtt_japan.41.desc:0 "Императорская ставка Японии решила коренным образом изменить стратегические взгляды. На совещании с императором военный министр представил новый план, исходивший из скорого начала войны с государством [SOV.GetNameDef]. Для подготовки к ней Императорская армия Японии решила поручить нашим войскам оборону части фронта. С этой целью нам передано большое количество лишь немного устаревшего снаряжения."
 wtt_japan.41.a:0 "Как любезно с их стороны."
 wtt_news.25.t:0 "[JAP.GetNameDefCap] устанавливает контроль над [From.GetAdjective]ими колониями"
 wtt_news.25.desc:0 "В свете [From.GetNameDef]Нынешняя слабость, возможно, не удивительно, что [JAP.GetAdjective] Повышенное давление над [From.GetAdjective] Восточноазиатские холдинги. Сегодня утром, однако, официальные лица [From.GetAdjective] Правительство сделало неожиданное заявление о том, что контроль над [From.GetAdjective] колонии будут переданы в [JAP.GetNameDef]Действует немедленно."
 wtt_news.25.a:0 "Азия — для азиатов!"
 wtt_news.25.b:0 "Печальный день для Европы."
 wtt_news.25.c:0 "Неужели это конец колониализма?"
 wtt_news.26.t:0 "[PHI.GetAdjective]ая независимость"
 wtt_news.26.desc:0 "В результате чего [JAP.GetAdjective] давление, [From.GetAdjective] Правительство объявило о немедленном прекращении [From.GetAdjective] Колониальное правление архипелага. На сегодняшний день полный суверенитет предоставлен [PHI.GetNameDef]."
 wtt_news.26.b:0 "Мы всё равно собирались провести деколонизацию."
 wtt_news.26.c:0 "Радостный день!"
 wtt_news.27.t:0 "Переворот молодых [JAP.GetAdjective]их офицеров"
 wtt_news.27.desc:0 "Группа молодых офицеров сумела свергнуть правительство и восстановить императора в качестве верховного правителя [JAP.GetAdjective]ой нации. Судя по всему, это стало реакцией на предполагаемую повсеместную коррупцию в правительстве и деятельность сторонников враждебных идеологий.\n\nОфицеры, всё чаще называющие страну империей, уже объявили, что чистки продолжатся до тех пор, пока «все неблагонадёжные элементы не будут удалены из армии и правительства». Сам император Хирохито выступил с кратким заявлением, приняв предложенное мятежниками руководство страной, и недвусмысленно призвал к примирению с Китаем и западными колониальными державами в Тихом океане."
 wtt_news.27.a:0 "Банзай!"
 wtt_news.27.b:0 "Тревожные новости. Нам они таких предложений не делали."
 wtt_news.27.c:0 "Гарантирует ли это мир на Тихом океане?"
 wtt_news.27.d:0 "Неожиданный поворот событий."
 wtt_news.30.t:0 "Чан Кайши казнён"
 wtt_news.30.desc:0 "Как сообщается, после ареста лидером [CHI_xian_instigator.GetLeader] Чан Кайши был сегодня утром расстрелян коммунистами. После скорого суда за преступления против народа и партии лидер [PRC.GetLeader] вынес Чан Кайши смертный приговор. Даже прямое вмешательство представителя советского правительства не спасло ему жизнь.\n\nПо сообщениям, [SOV.GetLeader] пришёл в ярость из-за «предательства» лидера [PRC.GetLeader] и приказал арестовать китайскую делегацию Коминтерна.\n\nНовый лидер националистов [CHI.GetLeader] поклялся отомстить за смерть Чана и «истребить» коммунистов."
 wtt_news.30.a:0 "Он получил по заслугам."
 wtt_news.30.b:0 "Они совершили убийство и назвали его правосудием!"
 wtt_news.30.c:0 "Это будет иметь последствия."
 wtt_news.30.d:0 "Китай станет ещё нестабильнее."
 wtt_news.31.t:0 "Чан Кайши казнён"
 wtt_news.31.desc:0 "Как сообщается, после ареста лидером [CHI_xian_instigator.GetLeader] Чан Кайши был сегодня утром расстрелян коммунистами. После скорого суда за преступления против народа и партии, государственную измену и контрреволюционную деятельность лидер [PRC.GetLeader] вынес Чан Кайши смертный приговор. [SOV.GetAdjective]ий представитель выступил обвинителем на процессе, породив слухи, что [SOV.GetLeader] тайно одобрил это решение.\nНовый лидер националистов [CHI.GetLeader] поклялся отомстить за смерть Чана и «истребить» коммунистов."
 wtt_news.31.c:0 "Мы приняли правильное решение."
 wtt_news.32.t:0 "Чан Кайши освобождён из-под домашнего ареста"
 wtt_news.32.desc:0 "После ареста лидером [CHI_xian_instigator.GetLeader] и передачи коммунистам [CHI.GetLeader], как сообщается, вернулся домой по итогам продолжительных переговоров. Сведения всё ещё отрывочны, но похоже, что [PRC.GetLeader] предложил создать союз против [JAP.GetAdjective]ой стороны. Обе стороны отвергли эти слухи: [PRC.GetLeader] заявил, что скорее увидит страну сожжённой дотла, чем объединится с националистами, а [CHI.GetLeader] незамедлительно ответил тем же."
 wtt_news.32.a:0 "Что они замышляют против нас?"
 wtt_news.32.c:0 "Словно ссорящиеся дети."
 wtt_news.32.d:0 "[JAP.GetNameDefCap] воспользуется этим."
 wtt_news.32.e:0 "Мы могли бы этим воспользоваться."
 wtt_news.33.t:0 "[PRC.GetLeader] осуждает предательство националистов"
 wtt_news.33.desc:0 "После встречи лидеров [CHI.GetLeader] и [PRC.GetLeader] последний осудил то, что назвал «наглой и прозрачной попыткой использовать Красную армию в националистических и контрреволюционных целях». [CHI.GetLeader] отказался комментировать этот вопрос, заявив лишь, что армии националистов готовы защищать Китай от любого агрессора.\n\nПо сообщениям, два лидера обсуждали возможность создания Единого фронта против государства [JAP.GetNameDef].\n\nПриведёт ли провал переговоров к возобновлению конфликта между двумя партиями, пока неизвестно."
 wtt_news.33.b:0 "Почему мы вообще решили, что они изменятся?"
 wtt_news.34.t:0 "Созданы «Летающие тигры»"
 wtt_news.34.desc:0 "После призыва Китая к [USA.GetAdjective]им пилотам и механикам вступить в добровольческое подразделение президент США [USA.GetLeader] официально одобрил передачу китайским ВВС более сотни современных истребителей. Пилотам армии, флота и корпуса морской пехоты США также разрешено взять отпуск и присоединиться к этому подразделению.\n\nПервые корабли с новыми истребителями должны выйти в море, как только будет собрано необходимое оборудование. Руководители Конгресса выразили опасения, что подобное балансирование на грани международного права вызовет ответные меры."
 wtt_news.34.a:0 "Удачной охоты!"
 wtt_news.34.b:0 "Мы им очень рады."
 wtt_news.34.c:0 "Добровольцы? Скорее наёмники!"
 wtt_news.34.d:0 "Конец изоляционизма США?"
 wtt_news.35.t:0 "Шанхайский инцидент"
 wtt_news.35.desc:1 "Напряжённость между Китаем и государством [JAP.GetNameDef] резко возросла после столкновения в Шанхае прошлой ночью.\n\nПо сообщениям западных наблюдателей, между китайскими полицейскими и группой [JAP.GetAdjective]их моряков произошла драка, в которой обе стороны получили ранения. Когда [JAP.GetAdjective]ий патруль прибыл для расследования, подразделения китайской армии уже перекрыли все подходы к месту происшествия и арестовали [JAP.GetAdjective]их моряков, обвинив их в покушении на убийство.\n\n[JAP.GetAdjective]ое правительство выступило с резким предупреждением: если моряков немедленно не освободят, оно примет меры для их вызволения."
 wtt_news.35.a:0 "Возмутительно!"
 wtt_news.35.b:0 "Всё идёт по плану."
 wtt_news.35.c:0 "В воздухе пахнет войной."
 wtt_news.35.d:0 "Похоже, это было спланировано заранее."
 wtt_news.36.t:0 "Чан Кайши погибает в авиакатастрофе"
 wtt_news.36.desc:0 "Сегодня государство [CHI.GetNameDef] постигла трагедия: самолёт с Чан Кайши на борту взорвался в воздухе через несколько мгновений после взлёта. Спасатели всё ещё прочёсывают обломки, но мало кто надеется найти выживших среди экипажа и пассажиров.\n\nГенералиссимус и его супруга считаются погибшими.\n\nНовый лидер Китая [CHI.GetLeader] пообещал провести полное расследование причин катастрофы. Ходят многочисленные слухи о заговоре с целью убить генералиссимуса, которого многие считали препятствием на пути к объединению различных китайских группировок."
 wtt_news.36.a:0 "Одной проблемой меньше."
 wtt_news.36.b:0 "Это не было случайностью."
 wtt_news.36.d:0 "Трагедия."
 wtt_news.37.t:0 "Провозглашена Китайская Народная Республика"
 wtt_news.37.desc:0 "В триумфальной речи [PRC.GetLeader] объявил, что «китайский народ поднялся», и привёл коммунистов к победе в гражданской войне в Китае. Националисты отступают по всему фронту, а Коммунистическая партия наконец добилась победы после десятилетий борьбы. Отныне прежде небольшая группа повстанцев, скрывавшаяся в отдалённых горных деревнях, станет полноценным правительством Китайской Народной Республики."
 wtt_news.37.a:0 "Великий день."
 wtt_news.37.b:0 "Простая формальность."
 wtt_news.37.d:0 "Они никогда ничего не добьются."
 wtt_news.38.t:0 "[PRC.GetLeader] побеждает во внутрипартийной борьбе"
 wtt_news.38.desc:0 "Борьба между внутренними фракциями Коммунистической партии Китая, похоже, утихла, и [PRC.GetLeader] стал её бесспорным лидером. Мао Цзэдун и более умеренные фракции потеряли значительную часть влияния, поскольку поддерживаемый [SOV.GetAdjective]ой стороной [PRC.GetLeader] сумел переиграть их. Какую роль в этих событиях сыграл [SOV.GetLeader], остаётся предметом многочисленных предположений."
 wtt_news.38.a:0 "Пусть он приведёт нас к победе!"
 wtt_news.38.b:0 "Не имеет значения."
 wtt_news.38.c:0 "Полезный союзник."
 wtt_news.38.d:0 "Он унаследовал трудное положение."
 wtt_news.39.t:0 "Кампания по умиротворению Китая"
 wtt_news.39.desc:0 "После серии инцидентов, названных «вопиющими провокациями», [JAP.GetAdjective]ое правительство объявило, что в Китае существует состояние «вооружённого конфликта». Оно утверждает, что центральное правительство лидера [CHI.GetLeader] не желает или не способно должным образом наказать виновных. В связи с этим оно объявило об отправке в страну «миротворческих» [JAP.GetAdjective]их войск для восстановления порядка и предотвращения дальнейших нападений."
 wtt_news.39.a:0 "Как и было задумано."
 wtt_news.39.b:0 "Кто это сделал?"
 wtt_news.39.c:0 "Что мы такого сделали?"
 wtt_news.39.d:0 "Очевидная отговорка."
 wtt_news.39.e:0 "Они осознают свою ошибку."
 wtt_warlord.1.t:0 "[From.GetNameDefCap] предлагает подчиниться"
 wtt_warlord.1.desc:0 "Поскольку центральное правительство Китая совершенно неспособно защитить население от бандитов и коммунистов, [From.GetLeader] наконец осознал своё положение и обратился к нам, пытаясь обеспечить своё будущее. Он готов полностью сотрудничать и разрешить нашим войскам свободный проход. Взамен он просит лишь разместить несколько частей для защиты его территории и не забыть о его вкладе после завершения реорганизации Китая."
 wtt_warlord.1.a:0 "Наконец-то кто-то разумный!"
 wtt_warlord.1.b:0 "В наших планах для них нет места."
 wtt_warlord.2.t:0 "[From.GetNameDefCap] соглашается"
 wtt_warlord.2.desc:0 "[From.GetAdjective]ое правительство приняло наше предложение. В обмен на защиту мы должны «всерьёз учитывать» получаемые советы по ведению наших дел. Для координации политики уже прибыл [From.GetAdjective]ий правительственный чиновник."
 wtt_warlord.2.a:0 "Небольшая цена за наше выживание."
 wtt_warlord.3.t:0 "[From.GetNameDefCap] отказывается"
 wtt_warlord.3.desc:0 "[From.GetAdjective]ое правительство вернуло нашу ноту с категорическим отказом обсуждать её, заявив, что у нас нет полномочий вести переговоры с полноценным национальным правительством."
 wtt_warlord.3.a:0 "Мы станем сильнее и покажем им."
 wtt_britain_lease_azores.1.t:0 "[From.GetNameDefCap] просит передать Азорские острова в аренду"
 wtt_britain_lease_azores.1.desc:0 "[From.GetAdjective]ая сторона обратилась к нам с просьбой передать Азорские острова в аренду на время войны. Их стратегическое положение делает архипелаг важнейшей базой для защиты морских путей через Атлантику. После окончания боевых действий [From.GetAdjective]ая сторона вернёт острова."
 wtt_britain_lease_azores.1.a:0 "Это лучше, чем быть втянутыми в войну."
 wtt_britain_lease_azores.1.b:0 "А какая выгода нам?"
 wtt_britain_lease_azores.2.t:0 "[From.GetNameDefCap] соглашается"
 wtt_britain_lease_azores.2.desc:0 "[From.GetAdjective]ое правительство одобрило нашу просьбу и передало нам полный контроль над Азорскими островами, понимая, что теперь именно мы отвечаем за их защиту от любого нападения. На острова уже прибыла небольшая передовая группа для создания оперативной базы."
 wtt_britain_lease_azores.2.a:0 "Это нам пригодится."
 wtt_britain_lease_azores.3.t:0 "[From.GetNameDefCap] отказывается"
 wtt_britain_lease_azores.3.desc:0 "Сославшись на провозглашённый нейтралитет и законы войны, правительство лидера [From.GetLeader] отказало нам в праве использовать базы на Азорских островах. Пока мы не найдём способ втянуть их в войну на нашей стороне, острова останутся для нас закрыты."
 wtt_britain_lease_azores.3.a:0 "Мы это запомним."
 wtt_britain_lease_azores.4.t:0 "Срок аренды Азорских островов истёк"
 wtt_britain_lease_azores.4.desc:0 "После окончания боевых действий в Европе [POR.GetAdjective]ое правительство напомнило нам, что Азорские острова были переданы в аренду лишь на время войны. Пора вернуть им контроль над архипелагом."
 wtt_britain_lease_azores.4.a:0 "[ENG.GetAdjective]ая сторона всегда возвращает долги."
 wtt_britain_lease_azores.5.t:0 "[ENG.GetNameDefCap] покидает Азорские острова"
 wtt_britain_lease_azores.5.desc:0 "После окончания войны в Европе государство [From.GetNameDef] выполнило соглашение и вернуло нам Азорские острова. Мы уже направили туда группу администраторов, чтобы восстановить контроль."
 wtt_britain_lease_azores.5.a:0 "Наилучший возможный исход."
 wtt_soviet_hold_city_t_success:0 "Регион [state.GetName] выстоял"
 wtt_soviet_hold_city_d_success:0 "Несмотря на натиск врага, защитники региона [state.GetName] проявили стойкость и удержали противника. Захватчики обескровили себя о наши укрепления, заплатив огромную цену за каждый сантиметр занятой земли. Подвиги героев региона [state.GetName] будут помнить многие поколения!"
 wtt_soviet_hold_city_o_success:0 "Регион [state.GetName] останется нашим!"
 wtt_soviet_hold_city_t_fail:0 "Регион [state.GetName] пал"
 wtt_soviet_hold_city_d_fail:0 "Собрав все доступные силы, [controller.GetAdjective]ие захватчики прорвали нашу оборону на подступах к региону [state.GetName]. [controller.GetAdjective]ие войска вошли в город. Наши защитники ведут с врагом ожесточённые уличные бои, но ожидается, что город падёт в течение нескольких дней."
 decisions.1.t:0 "Лояльность младшего армейского командования"
 decisions.1.desc:0 "Некоторые офицеры младшего звена вооружённых сил высказывают «альтернативные» взгляды на руководство страны. Чтобы не вызвать подозрений, нам следует обратиться лишь к одному потенциальному стороннику и не жалеть средств на приобретение его лояльности."
 decisions.1.a:0 "Подойдёт кто угодно: нам нужен человек, способный возглавить армию."
 decisions.1.b:0 "Нужен хотя бы тот, кто понимает, что делает."
 decisions.1.c:0 "Качество важнее всего — экономить нельзя."
 decisions.1.d:0 "Подойдёт только лучший из лучших."
 decisions.2.t:0 "Лояльность высшего армейского командования"
 decisions.2.desc:0 "Некоторые офицеры высшего звена вооружённых сил высказывают «альтернативные» взгляды на руководство страны. Чтобы не вызвать подозрений, нам следует обратиться лишь к одному потенциальному стороннику и не жалеть средств на приобретение его лояльности."
 wtt_soviet_hold_city_o_fail:0 "Небольшая неудача."
 wtt_news.40.t:0 "Суэцкий канал взорван"
 wtt_news.40.desc_eng:0 "Поскольку вражеские силы приближались к Суэцкому каналу и возникла угроза потерять эту жизненно важную торговую артерию, государство [From.GetNameDef] решило взорвать канал, чтобы враг не смог им воспользоваться. Затопленные суда, подрывные заряды и мины нанесли настолько серьёзные разрушения, что на восстановление, вероятно, уйдут месяцы напряжённой промышленной работы."
 wtt_news.40.desc_not_eng:0 "В ходе операции, которую можно назвать лишь дерзкой и блестящей, государству [From.GetNameDef] удалось перерезать жизненно важную торговую артерию — Суэцкий канал. Затопленные суда, подрывные заряды и мины нанесли настолько серьёзные разрушения, что на восстановление, вероятно, уйдут месяцы напряжённой промышленной работы."
 wtt_news.40.a:0 "Катастрофа!"
 wtt_news.40.b:0 "Мы не могли позволить врагу им воспользоваться."
 wtt_news.40.c:0 "Мы больше не станем недооценивать их решимость."
 wtt_news.40.d:0 "Мы перерезали связь с их империей!"
 wtt_news.40.e:0 "Великолепный удар по [ENG.GetAdjective]ой стороне!"
 wtt_news.40.f:0 "Они приняли верное решение."
 wtt_news.40.g:0 "Серьёзный удар по нашему союзнику."
 wtt_news.40.h:0 "Последствия ощутит весь мир."
 wtt_news.41.t:0 "Панамский канал взорван"
 wtt_news.41.desc_usa:0 "Поскольку государство [From.GetNameDef] не могло защитить Панамский канал и рисковало уступить врагу эту жизненно важную артерию военных коммуникаций, оно решило взорвать канал, чтобы противник не смог им воспользоваться. Затопленные суда, подрывные заряды и мины нанесли настолько серьёзные разрушения, что на восстановление, вероятно, уйдут месяцы напряжённой промышленной работы."
 wtt_news.41.desc_not_usa:0 "В ходе операции, которую можно назвать лишь дерзкой и блестящей, государству [From.GetNameDef] удалось перерезать жизненно важную артерию военных коммуникаций — Панамский канал. Затопленные суда, подрывные заряды и мины нанесли настолько серьёзные разрушения, что на восстановление, вероятно, уйдут месяцы напряжённой промышленной работы."
 wtt_news.41.a:0 "Катастрофа!"
 wtt_news.41.b:0 "Мы не могли позволить врагу им воспользоваться."
 wtt_news.41.c:0 "Мы больше не станем недооценивать их решимость."
 wtt_news.41.d:0 "Их флот отрезан по другую сторону!"
 wtt_news.41.e:0 "Великолепный удар по [USA.GetAdjective]ой стороне!"
 wtt_news.41.f:0 "Они приняли верное решение."
 wtt_news.41.g:0 "Серьёзный удар по нашему союзнику."
 wtt_news.41.h:0 "Тихий и Атлантический океаны вновь разделены."
 wtt_news.42.t:0 "Суэцкий канал восстановлен"
 wtt_news.42.desc:0 "Ценой колоссальных промышленных усилий государство [From.GetNameDef] восстановило Суэцкий канал. Сегодня утром эта жизненно важная торговая артерия вновь открылась для прохода в Средиземное море после более чем полугода напряжённых ремонтных работ."
 wtt_news.42.a:0 "Мы восстановили связь со своей империей."
 wtt_news.42.b:0 "Необходимое вложение в будущее страны."
 wtt_news.42.c:0 "Это значительно поможет нашим усилиям."
 wtt_news.42.d:0 "Они устранили последствия неудачи."
 wtt_news.42.e:0 "Последствия ощутят все."
 wtt_news.43.t:0 "Панамский канал восстановлен"
 wtt_news.43.desc:0 "Ценой колоссальных промышленных усилий государство [From.GetNameDef] восстановило Панамский канал. Сегодня утром эта жизненно важная военная артерия вновь связала Атлантический и Тихий океаны после более чем года напряжённых ремонтных работ."
 wtt_news.43.a:0 "Мы восстановили жизненно важную связь между океанами."
 wtt_news.43.b:0 "Теперь мы снова можем переходить из Тихого океана в Атлантический."
 wtt_news.43.c:0 "Это значительно поможет нашим усилиям."
 wtt_news.43.d:0 "Они устранили последствия неудачи."
 wtt_news.43.e:0 "Последствия ощутят все."
 wtt_news.44.t:0 "[MAN.GetLeader] провозглашает Небесный мандат"
 wtt_news.44.desc:0 "Облачённый в богато украшенные одежды, подобающие императору Китая, [MAN.GetLeader] — Сын Неба, Повелитель десяти тысяч лет и император Великой династии Цин — взошёл на Драконий трон во время необычной второй коронации и теперь живёт в Запретном городе, как некогда его предки. Ссылаясь на древние обычаи, [MAN.GetLeader] утверждает, что победа его войск в гражданской войне в Китае доказывает наличие у него Небесного мандата на правление страной.\n\nНамерен ли он распространить свою власть на «всё Поднебесное», как заявляли прежние императоры, ещё предстоит выяснить."
 wtt_news.44.a:0 "Сын Неба вернулся."
 wtt_news.44.b:0 "Историческая несправедливость исправлена."
 wtt_news.44.c:0 "Кем он себя возомнил?"
 wtt_news.44.d:0 "Впечатляющее возвращение."
 wtt_news.44.e:0 "Нелепость!"
 wtt_news.45.t:0 "[new_leader.GetLeader] становится национальным лидером Китая"
 wtt_news.45.desc:1 "После длительной борьбы между [old_leader.GetLeader] и [new_leader.GetLeader]Первый, наконец, признал поражение и встретился с [new_leader.GetLeader] в своей резиденции. После двух часов переговоров, [old_leader.GetLeader] принял предложение о передаче власти [new_leader.GetLeader] Уйти с поста премьер-министра республики.\n\nГруппы сторонников двух лидеров ранее собирались за пределами дома, что вызывало опасения насильственных столкновений между двумя сторонами в зависимости от исхода.\n\nОднако о насилии не сообщалось, и представляется, что переход власти был относительно плавным."
 wtt_news.45.a:0 "Политика. Политика никогда не меняется."
 wtt_news.45.b:0 "Ошеломительный успех."
 wtt_news.45.c:0 "Это лучше насилия."
 wtt_news.45.d:0 "Возможно, им удалось предотвратить гражданскую войну."
 wtt_news.46.t:0 "[From.GetLeader] провозглашает политику единого Китая"
 wtt_news.46.desc:0 "Выступая перед сторонниками, [From.GetLeader] сегодня объявил о значительном изменении курса правительства. Ранее [From.GetLeader] мирился с тем, что некоторые части Китая фактически независимы, но теперь этому пришёл конец. Отныне государство [From.GetNameDef] как единственное правительство Китая считает всю страну зоной своей ответственности. Любой, кто откажется выполнять приказы единственного законного китайского правительства, будет признан мятежником или предателем и понесёт соответствующее наказание.\n\nОднако ещё предстоит выяснить, сумеет ли правительство лидера [From.GetLeader] выполнить эту угрозу или всё ограничится пропагандистским жестом для укрепления поддержки населения."
 wtt_news.46.a:0 "Прямая угроза."
 wtt_news.46.b:0 "Мы объединим весь Китай!"
 wtt_news.46.d:0 "Не удалось и более достойным людям."
 wtt_news.47.t:0 "[From.GetNameDefCap] предъявляет притязания на Индокитай"
 wtt_news.47.desc:0 "Правительство лидера [From.GetLeader] заявило, что нынешнее положение в Индокитае представляет явную и непосредственную угрозу [From.GetAdjective]ой безопасности. В официальном заявлении говорилось, что ни одно правительство мира не потерпит направленного прямо в его незащищённое подбрюшье кинжала. Пока регион не будет умиротворён или [671.Controller.GetAdjective]ие власти не заменят губернаторы, более склонные сотрудничать с государством [From.GetNameDef], угроза [From.GetAdjective]им интересам сохранится.\n\nПредставитель лидера [From.GetLeader] подчеркнул, что [From.GetAdjective]ое правительство постарается найти мирное решение, но не исключил и военный вариант."
 wtt_news.47.a:0 "Кто-то должен был это сделать."
 wtt_news.47.b:0 "Пусть приходят и забирают!"
 wtt_news.47.c:0 "Разумеется, ничем плохим это не закончится."
 wtt_news.47.d:0 "Не вынуждайте нас прийти к вам!"
 wtt_news.48.t:0 "Маньчжурская война за независимость"
 wtt_news.48.desc:0 "После периода внутренней борьбы за власть между [JAP.GetAdjective]ими администраторами и правительством лидера [MAN.GetLeader] противостояние за господство в Маньчжурии наконец достигло точки кипения.\n\nКак сообщается, поводом стал инцидент при императорском дворе, во время которого [JAP.GetAdjective]ий генерал якобы оскорбил императора Маньчжоу-го, потребовав, чтобы тот поклонился.\n\nВозмущённый [MAN.GetLeader] ответил: «Сын Неба не кланяется», ударил генерала тростью и приказал армии изгнать всех [JAP.GetAdjective]их солдат с китайской земли."
 wtt_news.48.a:0 "Щенок зарычал?"
 wtt_news.48.b:0 "Мы исполним своё предназначение!"
 wtt_news.48.c:0 "Маленький предатель!"
 wtt_news.48.d:0 "Неужели Дракон осмелился ударить Солнце?"
 wtt_news.50.t:0 "Гитлер убит"
 wtt_news.50.desc:0 "Сегодня германское радио сообщило, что изменнические элементы в армии предприняли попытку переворота. После взрыва в ставке фюрера, убившего Гитлера и ранившего нескольких человек, армейские подразделения атаковали ряд учреждений и отрядов СС.\n\nХотя [GER.GetLeader] утверждает, что полностью контролирует страну и вооружённые силы, со всей Германии продолжают поступать сообщения о перестрелках между лоялистами и мятежниками.\n\nХодят слухи, что другие видные члены нацистской партии намерены воспользоваться хаосом и захватить власть."
 wtt_news.50.a:0 "Подлое предательство!"
 wtt_news.50.b:0 "Положение не улучшилось."
 wtt_news.50.c:0 "Туда ему и дорога!"
 wtt_news.50.d:0 "Он зашёл слишком далеко."
 wtt_news.51.t:0 "Покушение на лидера [GER.GetLeader]"
 wtt_news.51.desc:0 "Сегодня германское радио сообщило, что изменнические элементы в армии предприняли попытку переворота. После взрыва в ставке фюрера, лишь чудом слегка ранившего лидера [GER.GetLeader] и ранившего ещё нескольких человек, армейские подразделения попытались захватить ряд правительственных учреждений в Берлине.\n\nВесть о том, что [GER.GetLeader] выжил, быстро распространилась, и с тех пор большинство частей под контролем путчистов вернулось в казармы.\n\nНекоторые высокопоставленные [GER.GetAdjective]ие офицеры после провала покончили с собой, предпочтя смерть унижению суда в печально известной «Народной судебной палате»."
 wtt_news.51.c:0 "Начало конца?"
 wtt_news.52.desc:0 "[GER.GetAdjective]ое радио сообщило сегодня, что [GER.GetLeader] взял власть в свои руки. После перестрелки в фюрербункере, во время которой фюрер получил смертельное ранение, подразделения СС быстро заняли все основные дороги и железнодорожные узлы, ведущие из Берлина. Тем временем, по сообщениям, частям люфтваффе и сухопутных войск приказано двигаться к Берлину для восстановления порядка."
 wtt_news.53.t:0 "Объединение Скандинавии"
 wtt_news.53.desc:0 "Силой оружия государство [From.GetOldName] объединило скандинавские народы под своей властью, и теперь его правительство интегрирует недавно завоёванные территории. Стремясь сплотить население вокруг государства, власти развернули масштабную паннационалистическую пропаганду.\n\nСторонники объединения Скандинавии уже начали проводить исторические параллели и утверждать, что нынешнее положение — лишь естественное продолжение прежних попыток объединить регион. [From.GetOldAdjective]ое правительство охотно поддержало эти идеи и официально объявило о «восстановлении Кальмарской унии», переименовав страну в «[From.GetNameDef]»."
 wtt_news.53.a:0 "Славный день для всех скандинавов!"
 wtt_news.53.b:0 "Вместе Скандинавия сильнее."
 wtt_news.53.c:0 "Это продлится недолго!"
 wtt_news.54.t:0 "Объединение стран Севера"
 wtt_news.54.desc:0 "После покорения всех государств Северной Европы [From.GetOldAdjective]ое правительство усилило интеграцию недавно завоёванных территорий. Стремясь сплотить население вокруг государства, власти развернули масштабную паннационалистическую пропаганду.\n\nОдин [From.GetOldAdjective]ий чиновник заявил: «Страны Севера всегда ощущали тесное родство друг с другом. Вполне естественно, что они должны объединиться, а наши народы — сосуществовать бок о бок как единое целое». Похоже, правительство решило использовать это родство для объединения населения и теперь провозгласило «истинное единство Севера», переименовав страну в «[From.GetNameDef]»."
 wtt_news.54.a:0 "Объединённый Север будет стоять непоколебимо!"
 wtt_news.54.b:0 "Север ещё может доставить соседям немало проблем."
 wtt_news.55.t:0 "Возрождение государства [From.GetNameDef]"
 wtt_news.55.desc:0 "Вернув все земли старой Великой Колумбии, [From.GetOldAdjective]ое правительство усилило интеграцию недавно завоёванных территорий. Стремясь сплотить население вокруг государства, власти развернули масштабную паннационалистическую пропаганду.\n\n[From.GetOldAdjective]ие чиновники неоднократно заявляли, что вся северная часть Южной Америки должна обратиться к общей истории и сделать это родство основой единого государства. Теперь [From.GetOldAdjective]ое правительство пошло ещё дальше и провозгласило «возрождение наследия Боливара», переименовав страну в «[From.GetNameDef]»."
 wtt_news.55.a:1 "Мечта об объединённой Латинской Америке ждёт воплощения!"
 wtt_news.55.b:0 "Рождение новой американской сверхдержавы?"
 wtt_news.56.t:0 "Возрождение государства [From.GetNameDef]"
 wtt_news.56.desc:0 "Установив контроль над всеми землями Австро-Венгерской империи, [From.GetOldAdjective]ое правительство как представитель последнего сохранившегося государства-преемника начало реинтеграцию этих территорий. Поддерживаемая властями пропаганда восхваляет «славные времена империи», стремясь сплотить население вокруг масштабных национальных реформ и возвращения к имперским порядкам.\n\nВ рамках этих преобразований [From.GetOldAdjective]ое правительство объявило о восстановлении государства [From.GetNameDef] и соответствующим образом изменило официальное название страны."
 wtt_news.56.a:0 "Неразделимо и неразрывно!"
 wtt_news.56.b:0 "Дуалистическая монархия восстала вновь."
 wtt_news.57.t:0 "Возрождение государства [From.GetNameDef]"
 wtt_news.57.desc:0 "После того как Польша и Литва вновь оказались под властью одного государства, польское правительство обратилось к истории, чтобы с помощью пропаганды сплотить население вокруг своей политики. «Исторические эксперты» непрерывно рассказывают о том, как единые Польша и Литва способны противостоять угрозам на своих границах, и вспоминают времена наивысшего могущества Речи Посполитой. Такой подход, похоже, помогает перенаправить народное возмущение и сосредоточить мысли людей на былой славе.\n\nСегодня [From.GetOldAdjective]ое правительство пошло ещё дальше, провозгласило восстановление Речи Посполитой и переименовало страну в «[From.GetNameDef]»."
 wtt_news.57.a:0 "Если с нами Бог, то кто против нас?"
 wtt_news.57.b:0 "Сумеет ли она на этот раз избежать раздела?"
 wtt_news.58.t:0 "Воссоединение Нижних Земель"
 wtt_news.58.desc:0 "После того как [From.GetOldAdjective]ая сторона покорила остальные государства Нижних Земель, её правительство стало громко оправдывать свои действия. Теперь оно объявляет себя непосредственным и законным преемником Объединённого королевства Нидерландов. Лондонский договор 1839 года был отвергнут на том основании, что в своё время его преступным образом навязали правительству внешние силы. Следовательно, поскольку государство якобы никогда не прекращало существования, [From.GetOldNameDef] лишь восстановило контроль над землями, которые и так ему принадлежали.\n\nПодкрепляя слова делом, [From.GetOldAdjective]ое правительство переименовало страну в «[From.GetNameDef]» и уже развернуло масштабную пропагандистскую кампанию, призванную объединить население перед лицом нынешних мировых кризисов."
 wtt_news.58.a:0 "Снова едины, как и задумывалось в 1815 году."
 wtt_news.58.b:0 "Да. Всё это действительно похоже на внутреннее дело."
 wtt_news.59.t:0 "Возрождение государства [From.GetNameDef]"
 wtt_news.59.desc:0 "После того как [From.GetOldAdjective]ая сторона покорила остальные государства Центральной Америки, её правительство стало громко оправдывать свои действия на международной арене. Считая себя законным преемником Федеративной Республики Центральной Америки, оно объявило государства, отделившиеся в конце 1830-х годов, незаконными сепаратистскими режимами и неизменно называло недавние боевые действия разумной попыткой «восстановить контроль» над этими территориями.\n\nПодкрепляя слова делом, [From.GetOldAdjective]ое правительство переименовало страну в «[From.GetNameDef]» и уже развернуло масштабную пропагандистскую кампанию, призванную объединить население перед лицом нынешних мировых кризисов."
 wtt_news.59.a:0 "Необходимый первый шаг к выходу на мировую арену."
 wtt_news.59.b:0 "Возникают ещё одни Соединённые Штаты Америки."
 wtt_news.60.t:0 "Объединение стран Балтии"
 wtt_news.60.desc:0 "После покорения всех земель балтийских государств [From.GetOldAdjective]ое правительство усилило интеграцию недавно завоёванных территорий. Стремясь сплотить население вокруг государства, власти развернули масштабную паннационалистическую пропаганду.\n\nОдин [From.GetOldAdjective]ий чиновник заявил: «Страны Балтии всегда ощущали тесное родство друг с другом. Вполне естественно, что они должны объединиться, особенно перед лицом угроз на наших границах. Лишь держась вместе, наши народы смогут сохранить независимость и свободу». Поэтому правительство провозгласило «истинное единство Балтии» и переименовало страну в «[From.GetNameDef]»."
 wtt_news.60.a:0 "Это необходимо для нашего выживания."
 wtt_news.60.b:0 "Но будет ли новое государство достаточно сильным?"
 wtt_news.61.t:0 "Возрождение государства [From.GetNameDef]"
 wtt_news.61.desc:0 "Установив контроль над всеми довоенными землями Османской империи, [From.GetOldAdjective]ое правительство как представитель государства-преемника османов начало реинтеграцию этих территорий. Поддерживаемая властями пропаганда осуждает разделы, проведённые союзниками после Великой войны, и восхваляет «славные времена империи», стремясь сплотить население недавно завоёванных земель вокруг масштабных национальных реформ и возвращения к имперским порядкам.\n\nВ рамках этих преобразований [From.GetOldAdjective]ое правительство объявило о восстановлении государства [From.GetNameDef] и соответствующим образом изменило официальное название страны."
 wtt_news.61.a:0 "Наконец-то мы отменили последствия раздела!"
 wtt_news.61.b:0 "Вечное государство восстало вновь."
 wtt_news.62.t:0 "Объединение Европы"
 wtt_news.62.desc:0 "Ведущие державы континентальной Европы лежат поверженными перед государством [From.GetOldNameDef], и впервые недавние мечты об объединённой Европе кажутся достижимыми. Различные «эксперты», предположительно состоящие на содержании правительства, уже начали утверждать, что нынешняя политическая система — единственный способ «предотвратить будущие европейские конфликты».\n\nСтремясь создать образ «государства для всех европейцев», власти с впечатляющей скоростью проводят реформы на национальном и местном уровнях. В рамках этих преобразований сегодня было объявлено, что отныне страна будет называться «[From.GetNameDef]», чтобы «каждый европеец мог чувствовать себя в ней желанным гостем»."
 wtt_news.62.a:0 "Неужели это конец всем европейским войнам?"
 wtt_news.62.b:0 "Посмотрим, сумеют ли они довести дело до конца."
 wtt_news.63.t:0 "Возвышение государства [From.GetNameDef]"
 wtt_news.63.desc:0 "Как и [From.GetOldAdjective] Нация растет в своих соседей, попытки правительства создать историческую преемственность стали более очевидными, очевидно, чтобы объединить народ. Достижения Великой зимбабвийской империи были сильно романтизированы, но непрекращающаяся пропаганда, кажется, влияет на общественное мнение.\n\nСегодня, [From.GetOldAdjective] Правительство сделало еще один шаг вперед и переименовало страну в «Голос Америки».[From.GetNameDef]Объявление приветствовалось буйными толпами на улицах крупных городов."
 wtt_news.63.a:0 "Африка — для африканцев!"
 wtt_news.63.b:0 "Неужели колониальной Африке пришёл конец?"
 wtt_news.64.t:0 "Возвышение государства [From.GetNameDef]"
 wtt_news.64.desc:0 "[From.GetOldAdjective]ое военное наступление кажется совершенно неудержимым. Идея, над которой многие насмехались, — новая Римская империя — теперь выглядит вполне достижимой для итальянцев. Большинство континентальных европейских держав, способных им противостоять, фактически уничтожены, и теперь итальянцы могут беспрепятственно навязывать свою волю покорённым народам.\n\nПомимо начала интеграции земель, уже названных «отвоёванными римскими территориями», [From.GetOldAdjective]ое правительство объявило о возрождении Римской империи и переименовало страну в «[From.GetNameDef]»."
 wtt_news.64.a:0 "Непобедимый Рим!"
 wtt_news.64.b:0 "Они ведь не всерьёз!"
 wtt_news.65.t:0 "Возвышение государства [From.GetNameDef]"
 wtt_news.65.desc:0 "По мере продолжения [From.GetOldAdjective]ого наступления исторические параллели не ускользнули от знатоков персидской истории. Известные общественные деятели уже сравнивают нынешнюю экспансию с эпохой Кира Великого, а национальная гордость растёт во всём [From.GetOldAdjective]ом обществе.\n\nРасширяя контроль над новыми территориями и пользуясь волной общественного одобрения, власти подтвердили, что государство официально переименуют в «[From.GetNameDef]»."
 wtt_news.65.a:0 "Наша мощь продолжает расти!"
 wtt_news.65.b:0 "Принесёт ли это региону мир и стабильность?"
 wtt_news.66.t:0 "Возвышение государства [From.GetNameDef]"
 wtt_news.66.desc:0 "[From.GetOldAdjectiveCap]ое возвышение озадачило многих военных экспертов по всему миру, но результаты говорят сами за себя. За несколько лет греки полностью подчинили Балканы, отвоевали Стамбул и сокрушили организованное турецкое сопротивление в Анатолии. Похоже, многовековой греко-турецкий конфликт наконец подошёл к окончательной развязке.\n\n[From.GetOldAdjectiveCap]ое правительство использовало историческую преемственность, представив свои военные успехи как «византийскую реконкисту против тюркских захватчиков», чтобы ещё сильнее укрепить национальную гордость. В рамках этой пропаганды на пышном параде в недавно переименованном Константинополе было объявлено, что государство [From.GetOldNameDef] официально сменило название на «[From.GetNameDef]»."
 wtt_news.66.a:0 "Да начнётся отвоевание."
 wtt_news.66.b:0 "Чудесный поворот судьбы."
 wtt_news.67.t:0 "Объединение Аравии"
 wtt_news.67.desc:0 "С этим [From.GetOldAdjective] Захватив большую часть арабского мира, правительство ухватилось за новую волну панарабизма, распространяющуюся по всему региону. Поскольку международные разногласия были «решены» путем прямого устранения упрямых иностранных правительств с помощью военных средств, арабское объединение оказалось в пределах легкой досягаемости. [From.GetOldAdjective] Правительство уже продемонстрировало свою готовность к достижению этой цели.\n\nБудь то просто «пересечь волну» этой общественной доброй воли, призвать всех арабов в качестве дома или просто способствовать региональной интеграции. [From.GetOldAdjective] Официальные лица подтвердили, что официальное название страны должно быть изменено на \".[From.GetNameDef]'."
 wtt_news.67.a:0 "Мечта Зайдана осуществилась."
 wtt_news.67.b:0 "Приведёт ли это к прочному миру в регионе?"
 wtt_news.68.t:0 "Возвышение государства [From.GetNameDef]"
 wtt_news.68.desc:0 "Как и [From.GetOldAdjective] Нация растет в своих соседей, попытки правительства создать историческую преемственность стали более очевидными, очевидно, чтобы объединить народ. Достижения империи Маджапахит были сильно романтизированы, но непрекращающаяся пропаганда, похоже, оказывает влияние на общественное мнение.\n\nСегодня, [From.GetOldAdjective] Правительство сделало еще один шаг вперед и переименовало страну в «Голос Америки».[From.GetNameDef]В знак уважения к истории, надеясь, что все в регионе могут относиться к ней."
 wtt_news.68.a:0 "Колониализму в Азии пришёл конец!"
 wtt_news.68.b:0 "Они сами избрали свою судьбу."
 wtt_news.69.t:0 "Возрождение государства [From.GetNameDef]"
 wtt_news.69.desc:0 "Как и [From.GetOldAdjective] Нация растет в своих соседей, правительство переоценило свой уход от имени Раттанакосин. По мере того, как нынешние границы королевства все больше и больше напоминают границы исторического центра, достижения Раттанакосинского царства все чаще используются для влияния на общественное мнение.\n\nСегодня, [From.GetOldAdjective] Правительство сделало еще один шаг вперед и официально переименовало страну.[From.GetNameDef]В попытке извлечь легитимность из истории."
 wtt_news.69.a:0 "Мы вновь утвердили свою гегемонию."
 wtt_news.69.b:0 "Неужели колониальные империи рушатся?"
 wtt_news.70.t:0 "Возрождение государства [From.GetNameDef]"
 wtt_news.70.desc:0 "Под властью лидера [FROM.GetLeader] государство [From.GetOldNameDef] резко расширило границы, превзойдя даже прежнюю Священную Римскую империю. Все континентальные враги, способные оспорить его господство, были поставлены на колени [From.GetOldAdjective]ой военной машиной, и теперь ничто не мешает дальнейшему осуществлению его политики.\n\nТеперь [FROM.GetLeader] распорядился воспользоваться сложившейся возможностью и превратить страну в духовного преемника Священной Римской империи. В знак этого государство официально переименовано. Таким образом наконец достигнуто политическое объединение региона, которое веками ускользало от императоров."
 wtt_news.70.a:0 "Орёл, избранный Юпитером, побеждает всё!"
 wtt_news.70.b:0 "Нельзя отрицать её великолепие и славу!"
 wtt_warlord_vs_prc.1.t:0 "[warlord.GetLeader] просит о поддержке"
 wtt_warlord_vs_prc.1.desc:0 "Делегация лидера [warlord.GetLeader] прибыла в Москву, чтобы выяснить возможность нашей поддержки во внутрипартийной борьбе за власть. Делегаты утверждают, что [communist_china.GetLeader] недостаточно предан делу коммунизма, а возможно, и вовсе придерживается реакционных взглядов и готов предать революцию на самом критическом этапе.\n\n[warlord.GetLeader] предлагает поддержать его, обещая вечную и нерушимую верность коммунистическому делу в целом и лично лидеру [SOV.GetLeader]."
 wtt_warlord_vs_prc.1.a:0 "Верная марионетка может оказаться полезной."
 wtt_warlord_vs_prc.1.a_tooltip:0 "Если они откажутся, это приведёт к войне с государством §H[communist_china.GetNameDef]§!.\n"
 wtt_warlord_vs_prc.1.b:0 "Нам ни к чему столь откровенный оппортунист."
 wtt_warlord_vs_prc.2.t:0 "Послание лидера [soviet.GetLeader]"
 wtt_warlord_vs_prc.2.desc:0 "Представитель [SOV.GetAdjective]ого правительства сообщил, что у лидера [SOV.GetLeader] возникли серьёзные сомнения в правильности толкования марксизма лидером [communist_china.GetLeader]. На этом критическом этапе классовой борьбы в Китае нельзя отклоняться от правильного применения марксистско-ленинского учения. Похоже, Москва считает, что [warlord.GetLeader] лучше понимает, что необходимо для продвижения дела коммунизма в Китае. По мнению Москвы, партии следует признать лидера [warlord.GetLeader] новым председателем, иначе она навлечёт на себя недовольство лидера [SOV.GetLeader]."
 wtt_warlord_vs_prc.2.a:0 "Отправить лидера [communist_china.GetLeader] в Москву, чтобы всё уладить."
 wtt_warlord_vs_prc.2.b:0 "Мы никогда не склонимся перед предателями!"
 wtt_warlord_vs_prc.3.t:0 "[SOV.GetLeader] отказывает"
 wtt_warlord_vs_prc.3.desc:0 "По сообщениям, [SOV.GetLeader] по-прежнему не убеждён в нашей верности и способности руководить. [SOV.GetAdjective]ое правительство продолжает поддерживать лидера [communist_china.GetLeader] на посту председателя Коммунистической партии Китая."
 wtt_warlord_vs_prc.3.a:0 "Пусть это останется между нами."
 wtt_warlord_vs_prc.4.t:0 "Государство [communist_china.GetNameDefCap] подчиняется"
 wtt_warlord_vs_prc.4.desc:0 "Отчаянные обращения лидера [communist_china.GetLeader] к лидеру [SOV.GetLeader] почти не повлияли на решение [SOV.GetAdjective]ой стороны. Признав борьбу проигранной, [communist_china.GetLeader] публично признал свои ошибки и пообещал сотрудничать с нами ради победы революции."
 wtt_warlord_vs_prc.4.a:0 "Хорошо."
 wtt_warlord_vs_prc.10.t:0 "Присоединяйтесь или умрите"
 wtt_warlord_vs_prc.10.desc:0 "Столкнувшись с выбором между отказом от власти и проверкой [SOV.GetAdjective]ой угрозы, [communist_china.GetLeader] выбрал последнее. К несчастью, [SOV.GetLeader], похоже, не блефовал, и начались боевые действия. Учитывая наше шаткое положение, обе стороны оказывают на нас сильнейшее давление, а [SOV.GetAdjective]ая сторона требует помочь ей свергнуть предателя.\n\nПо их словам, отказ будет равносилен поддержке лидера [communist_china.GetLeader]."
 wtt_warlord_vs_prc.10.a:0 "Не стоит умирать за лидера [communist_china.GetLeader]."
 wtt_warlord_vs_prc.10.b:0 "Мы не станем в этом участвовать."
 wtt_warlord_vs_prc.21.t:0 "[From.GetLeader] требует нашей поддержки"
 wtt_warlord_vs_prc.21.desc:0 "Прибыло послание от лидера [From.GetLeader] с требованием увеличить объём ранее согласованной экономической помощи."
 wtt_warlord_vs_prc.21.a:0 "Такова цена, которую мы платим."
 wtt_warlord_vs_prc.21.b:0 "Это грабёж!"
 wtt_warlord_vs_prc.22.t:0 "Государство [From.GetNameDefCap] соглашается"
 wtt_warlord_vs_prc.22.desc:0 "Несмотря на привычные протесты лидера [From.GetLeader], он согласился увеличить темп выплат, как мы и требовали."
 wtt_warlord_vs_prc.22.a:0 "Пусть молится, чтобы мы не изменили условия ещё сильнее."
 wtt_warlord_vs_prc.23.t:0 "Государство [From.GetNameDefCap] отказывается"
 wtt_warlord_vs_prc.23.desc:0 "Лидер [From.GetLeader] ответил категорическим отказом на наше требование о дополнительной поддержке, заявив, что его страна совершенно не способна производить требуемые нами «абсурдные» выплаты."
 wtt_warlord_vs_prc.23.a:0 "Он обещал, и мы получим причитающееся!"
 wtt_warlord_vs_prc.23.b:0 "На этот раз оставим без последствий."
 wtt_warlord_vs_prc.31.t:0 "[From.GetLeader] требует более тесного сотрудничества"
 wtt_warlord_vs_prc.31.desc:0 "Прибыло послание от лидера [From.GetLeader], в котором говорится, что нынешний этап нашей революционной борьбы особенно уязвим и может легко пасть жертвой контрреволюции. Его особому представителю поручено внимательно следить за событиями в нашей стране и давать советы о том, как добиться победы в классовой борьбе.\n\nВ ноте также сказано, что любое отклонение от его «рекомендаций» будет расценено как признак захвата нашего правительства реакционными элементами, после чего будут приняты необходимые меры."
 wtt_warlord_vs_prc.31.a:0 "Мы рады возможности учиться."
 wtt_warlord_vs_prc.31.b:0 "Нам не нужны чужие указания."
 wtt_warlord_vs_prc.32.t:0 "Государство [From.GetNameDefCap] соглашается"
 wtt_warlord_vs_prc.32.desc:0 "Лидер [From.GetLeader] тепло принял нашего особого представителя и назначил его личным советником. Теперь мы обладаем значительным контролем над внутренней и внешней политикой страны."
 wtt_warlord_vs_prc.32.a:0 "Он прислушался к голосу разума."
 wtt_warlord_vs_prc.33.t:0 "Государство [From.GetNameDefCap] отказывается"
 wtt_warlord_vs_prc.33.desc:0 "Хотя лидер [From.GetLeader] благосклонно отнёсся к идее, он вежливо, но твёрдо отклонил наше требование о более прямом влиянии на политику страны. По его словам, мы «незнакомы» с местными условиями и должны доверить применение марксистского учения местным специалистам."
 wtt_warlord_vs_prc.33.a:0 "Возможно, стоит повторить требование более убедительно."
 wtt_warlord_vs_prc.34.t:0 "Государство [From.GetNameDefCap] отказывается платить"
 wtt_warlord_vs_prc.34.desc:0 "Лидер [From.GetLeader] игнорирует всё более жёсткие требования перечислить ранее согласованные выплаты. Даже просьба приехать в Москву и объясниться осталась без ответа."
 wtt_warlord_vs_prc.34.a:0 "Он решил испытать наше терпение?"
 wtt_warlord_vs_prc.35.t:0 "[From.GetAdjective]ий альянс"
 wtt_warlord_vs_prc.35.desc:0 "Государство [From.GetNameDefCap] предложило китайским коммунистам объединиться в единый Народный фронт, чтобы под одним знаменем разгромить националистов, реакционеров и иностранных захватчиков."
 wtt_warlord_vs_prc.35.a:0 "Теперь народ — настоящий герой!"
 wtt_warlord_vs_prc.35.b:0 "Это противоречит [Root.GetAdjective]им интересам."
 wtt_warlord_vs_prc.36.t:0 "[From.GetLeader] отвергает альянс"
 wtt_warlord_vs_prc.36.desc:0 "Государство [From.GetNameDefCap] отказалось от очевидно выгодного пути создания Народного фронта против националистов, реакционеров и иностранных захватчиков, заявив, что наш союз будет «противоречить [From.GetAdjective]им интересам»."
 wtt_warlord_vs_prc.36.a:0 "Значит, придётся действовать самостоятельно."
 wtt_warlord_vs_prc.36.b:0 "Тогда можно вовсе распустить Единый фронт."
 wtt_manchukou.1.t:0 "Государство [From.GetNameDefCap] требует подчинения"
 wtt_manchukou.1.desc:0 "Похоже, [From.GetLeader] наконец решил распространить свою власть на отдалённые области Китая. Представитель [From.GetAdjective]ого правительства прибыл с требованием склониться перед единственным истинным императором Китая, Сыном Неба — лидером [From.GetLeader]. Он добавил, что отказ будет наказан как государственная измена высшей степени."
 wtt_manchukou.1.a:0 "Эта затея с республикой всё равно была обречена."
 wtt_manchukou.1.b:0 "Пусть попробует."
 wtt_manchukou.2.t:0 "[From.GetLeader] подчиняется"
 wtt_manchukou.2.desc:0 "Лидер [From.GetLeader] отправил посланника обратно с личной запиской, обещая беспрекословное повиновение и признавая лидера [MAN.GetLeader] истинным правителем Китая."
 wtt_manchukou.2.a:0 "Он знает своё место."
 wtt_manchukou.3.t:0 "[From.GetLeader] отказывается"
 wtt_manchukou.3.desc:0 "Лидер [From.GetLeader] ответил на наше великодушное предложение потоком оскорблений и проклятий, высказавшись о происхождении и личных качествах императора [MAN.GetLeader] крайне неточно и весьма оскорбительно."
 wtt_manchukou.3.a:0 "Мы научим его хорошим манерам."
 wtt_manchukou.11.t:0 "Пятилетний план"
 wtt_manchukou.11.desc:0 "Новый пятилетний план, подробно описывающий ожидаемый правительством рост экономики в ближайшие годы, постепенно обретает форму. Однако между ведомствами сохраняются серьёзные разногласия по поводу главного направления развития.\n\nВсе согласны, что целью должно стать расширение тяжёлой промышленности, но вопрос о продукции новых предприятий всё ещё обсуждается.\n\nЧтобы выйти из тупика, необходимо принять решение."
 wtt_manchukou.11.a:0 "Развивать авиационную промышленность."
 wtt_manchukou.11.b:0 "Инвестировать в автомобильную промышленность."
 wtt_manchukou.11.c:0 "Провести общую программу индустриализации."
 wtt_manchukou_bandit_sabotage.21.t:0 "Диверсия на оружейном заводе"
 wtt_manchukou_bandit_sabotage.21.desc:0 "С одного из наших заводов в регионе [state.GetName] поступило сообщение о крупном пожаре, вспыхнувшем прошлой ночью. Местные пожарные всё ещё борются с огнём, но уверены, что к концу дня возьмут его под контроль. Заводу, по всей видимости, нанесён значительный ущерб, поскольку пожар начался на складе легковоспламеняющихся химикатов.\n\nВоенная разведка начала тщательное расследование причин пожара, произошедшего несмотря на строжайшие меры безопасности. Первые улики указывают на вероятный поджог."
 wtt_manchukou_bandit_sabotage.21.a:0 "Этих террористов нужно выследить!"
 wtt_manchukou_bandit_sabotage.22.t:0 "Диверсия на гражданской фабрике"
 wtt_manchukou_bandit_sabotage.23.t:0 "Мост взорван"
 wtt_manchukou_bandit_sabotage.23.desc:0 "Прошлой ночью важный железнодорожный мост в регионе [state.GetName] рухнул под тяжестью проходившего поезда с боеприпасами. Спасательные и восстановительные работы осложняются вторичными взрывами боеприпасов. Экипаж поезда до сих пор не найден и считается погибшим.\n\nВоенная разведка направила группу для осмотра места происшествия, как только это станет безопасно, чтобы выяснить, почему прочный мост рухнул без каких-либо предупреждающих признаков.\n\nМестные жители сообщают, что за день до обрушения видели небольшую группу людей в долине под мостом. Их нынешнее местонахождение неизвестно."
 generic.11.t:0 "Гражданская война окончена"
 generic.11.d:0 "Война, раздиравшая нашу страну, наконец завершилась. Теперь можно приступить к объединению народа и восстановлению разрушенного."
 generic.11.a:0 "Вместе мы построим лучшее будущее!"
 generic.12.t:0 "[From.GetAdjective]ая сторона пытается разрушить Суэцкий канал"
 generic.12.d:0 "Военная разведка сообщает, что [From.GetAdjective]ая сторона намерена применить масштабные подрывы и затопить суда, чтобы вывести Суэцкий канал из строя. Если мы хотим её остановить, времени осталось мало."
 generic.12.a:0 "Мы не можем этого допустить!"
 generic.13.t:0 "[From.GetAdjective]ая сторона пытается разрушить Панамский канал"
 generic.13.d:0 "Военная разведка сообщает, что [From.GetAdjective]ая сторона намерена применить масштабные подрывы и затопить суда, чтобы вывести Панамский канал из строя. Если мы хотим её остановить, времени осталось мало."
 generic.14.t:0 "Государство [From.GetNameDefCap] заявляет дипломатический протест"
 generic.14.d:0 "[From.GetAdjective]ие посланники заявили нашему правительству решительный дипломатический протест из-за присутствия наших атташе в странах, с которыми они сейчас воюют. Они требуют немедленно отозвать нашу военную миссию."
 generic.14.a:0 "Разумное требование."
 generic.14.b:0 "Мы сами решим, куда направлять своих атташе."
 attache_political_power_tt:1 "С учётом соотношения сил и нашего §Yмнения§! о них это приведёт к следующим последствиям:\n"
 attache_fascism_tt:0 "С учётом уровня поддержки §Yфашизма§! в нашей стране это приведёт к следующим последствиям:\n"
 attache_communism_tt:0 "С учётом уровня поддержки §Yкоммунизма§! в нашей стране это приведёт к следующим последствиям:\n"
 attache_democratic_tt:0 "С учётом уровня поддержки §Yдемократии§! в нашей стране это приведёт к следующим последствиям:\n"
 attache_neutrality_tt:0 "С учётом уровня поддержки §Yнейтралитета§! в нашей стране это приведёт к следующим последствиям:\n"
 generic.15.t:0 "Государство [From.GetNameDefCap] отзывает атташе"
 generic.15.d:0 "В ответ на наши требования государство [From.GetNameDef] отозвало военную миссию от наших врагов."
 generic.16.t:0 "Государство [From.GetNameDefCap] сохраняет атташе"
 generic.16.d:0 "Несмотря на наши требования, государство [From.GetNameDef] отказалось отозвать военную миссию от наших врагов, заявив, что «мы не вправе вмешиваться во внутренние [From.GetAdjective]ие дела»."
 generic.16.a:0 "Это мы ещё посмотрим."
 canals_tt:0 "Захватите берега канала в течение следующего месяца, чтобы сорвать план врага."
 generic.17.t:0 "[From.GetName] заболевает"
 generic.17.d:0 "в [From.GetHerHis] служение [From.From.GetNameDef]Кажется, [From.GetRank] [From.GetName] толкать [From.GetHerselfHimself] Слишком далеко. В результате паршивого климата в их операционной зоне, [From.GetRank] Сейчас он заболел и, вероятно, потребуется некоторое время, чтобы восстановиться.[From.GetSheHeCap] не будет выполняться в [From.GetHerHis] обычного уровня до [From.GetSheHe] Выздоровеет."
 generic.18.t:0 "[From.GetName] ранен"
 generic.18.d:0 "Когда битва завершается успешно, кажется, [From.GetRank] [From.GetName] поставить [From.GetHerselfHimself] Слишком большой риск, пока вы ведете [From.GetHerHis] мужчины.[From.GetSheHeCap] Он был ранен, и, вероятно, потребуется некоторое время, чтобы раны полностью зажили. [From.GetRank] Не будет выступать в [From.GetHerHis] Обычный уровень."
 japan_border_conflict.1.t:0 "[JAP.GetAdjective]ая провокация на нашей границе"
 japan_border_conflict.1.desc:0 "Для проверки демаркационных знаков у озера Хасан к границе между нами и государством [JAP.GetNameDef] была направлена рабочая группа. При приближении к границе по ней открыл огонь местный [JAP.GetAdjective]ий пограничный пост.\n\nМы заявили официальный дипломатический протест, однако [JAP.GetAdjective]ий посол утверждает, что рабочая группа собиралась передвинуть знаки, чтобы позволить нам предъявить притязания на дополнительную территорию.\n\n[JAP.GetAdjective]ая сторона заверила нас, что будет соблюдать границу, но не допустит никакого «вмешательства» в нынешнюю демаркацию и ответит силой на любые подобные попытки.\n\nФактически это означает, что мы больше не можем свободно перемещаться по собственной территории в этом районе."
 japan_border_conflict.1.a:0 "Неприемлемо."
 japan_border_conflict.2.t:0 "[JAP.GetAdjective]ая победа у озера Хасан"
 japan_border_conflict.2.desc:0 "После столкновения [SOV.GetAdjective]их и [JAP.GetAdjective]их войск в приграничном районе озера Хасан [SOV.GetAdjective]ие части, по сообщениям, полностью отступают. [JAP.GetAdjective]ие подразделения заняли несколько стратегически важных высот и начали укреплять позиции.\n\nВ ходе сражения [JAP.GetAdjective]ая сторона захватила несколько [SOV.GetAdjective]их танков и отправила их в Токио для изучения."
 japan_border_conflict.2.a:0 "Мы достойно разрешили этот вопрос."
 japan_border_conflict.2.b:0 "Необходимо подготовить соответствующий ответ."
 japan_border_conflict.3.t:0 "[JAP.GetAdjective]ое поражение у озера Хасан"
 japan_border_conflict.3.desc:0 "После столкновения [SOV.GetAdjective]их и [JAP.GetAdjective]их войск в приграничном районе озера Хасан [JAP.GetAdjective]ий посол в Москве запросил прекращение огня.\n\nНесколько [JAP.GetAdjective]их атак на [SOV.GetAdjective]ие позиции закончились неудачей и тяжёлыми потерями, что вызвало в [JAP.GetAdjective]их военных кругах сомнения в боеспособности собственных сил."
 japan_border_conflict.3.a:0 "Лучше с честью потерпеть неудачу, чем вовсе не попытаться."
 japan_border_conflict.3.b:0 "Наши войска проявили себя достойно."
 japan_border_conflict.4.t:0 "Тупик у озера Хасан"
 japan_border_conflict.4.desc:0 "Бои между [JAP.GetAdjective]ими и [SOV.GetAdjective]ими войсками у озера Хасан стихли после того, как обе стороны отошли из спорного района для перегруппировки и пополнения запасов. Признав бесперспективность дальнейшего наступления, [JAP.GetAdjective]ое командование запросило прекращение огня и переговоры об уточнении границы."
 japan_border_conflict.4.a:0 "Мы получили ценный опыт."
 japan_border_conflict.5.t:0 "Эскалация у озера Хасан"
 japan_border_conflict.5.desc:0 "Бои между [JAP.GetAdjective]ими и [SOV.GetAdjective]ими войсками у озера Хасан продолжаются. [JAP.GetAdjective]ие части на других направлениях также начали атаковать [SOV.GetAdjective]ие силы в этом секторе, пытаясь выйти из тупика. По данным разведки, [JAP.GetAdjective]ая сторона вскоре может усилить наступление свежими войсками, переброшенными из других частей империи."
 japan_border_conflict.5.a:0 "Мы должны удержать рубеж."
 JAP_kalkin_gol:0 "[SOV.GetAdjective]ая сторона испытана"
 wtt_prc.30.t:0 "Провокация удалась"
 wtt_prc.30.desc:0 "Под покровом ночи наши товарищи в государстве [JAP.GetManchuriaPuppet] совершили диверсию на [JAP.GetAdjective]ом заводе. Подробностей об ущербе мало, поскольку империалисты объявили весь район закрытой зоной.\n\nУже одно это говорит о точности нашего удара. Осталось узнать, подтолкнёт ли он [JAP.GetAdjective]ую сторону к действиям."
 wtt_prc.30.a:0 "Мы разворошили осиное гнездо."
 wtt_prc.31.desc:0 "Под покровом ночи наши товарищи в государстве [JAP.GetManchuriaPuppet] сумели разрушить важный мост. Небольшой диверсионный отряд сообщает, что мост полностью уничтожен и при обрушении увлёк за собой поезд с боеприпасами.\n\nОни намеренно показались местным жителям, чтобы никто не сомневался, что это была диверсия. Осталось узнать, подтолкнёт ли она [JAP.GetAdjective]ую сторону к действиям."
 wtt_prc.32.desc:0 "Мы успешно устроили засаду и уничтожили [JAP.GetAdjective]ий патруль в государстве [JAP.GetManchuriaPuppet]. Тела оставили на месте, чтобы империалисты правильно поняли послание. \n\nВремя покажет, сочтут ли они это достаточным поводом для войны."
 wtt_prc.20.c:0 "Нам следует полностью уйти с континента."
 wtt_germany.1006.t:0 "Кайзер готовит переворот!"
 wtt_germany.1006.desc:0 "Служба военной информации сообщила о подозрительной активности в монархических кругах. Похоже, некоторые из тех, кто верен только королю, недавно вступили в контакт с иностранными агентами — причём немецкими. Судя по всему, монархистов вербуют и объединяют для выступления против нашего великого лидера, но ещё не всё потеряно. Мы можем послать банды, чтобы разобраться с ними и подавить заговор, пока ещё есть возможность. Как нам поступить?"
 wtt_germany.1006.a:0 "С ними разберётся банда Карита."
