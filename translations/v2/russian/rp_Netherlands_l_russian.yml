l_russian:
 restoring_the_greater_netherlands_desc:0 "На протяжении веков Нидерланды контролировали множество территорий в Нижних землях и за морем, слишком многие из которых со временем были утрачены. Теперь у нас появился шанс исправить последствия революций, войн и иных территориальных передач, чрезмерно ослабивших нашу империю."
 restoring_the_greater_netherlands:0 "Нидерландский реваншизм"
 flanders_ours:0 "Фландрия снова наша!"
 flanders_ours_desc:0 "Бельгийское восстание 1830 года, закреплённое Лондонским договором девять лет спустя, разрушило нашу власть над исторической нидерландоязычной провинцией Фландрия. Вместе с ними мы можем объединить их и еще раз продемонстрировать миру волю объединенных Нидерландов!"
 disavow_anglo_dutch_treaty:0 "Откажитесь от англо-голландских договоров 1870-1871 годов!"
 disavow_anglo_dutch_treaty_desc:0 "Англо-нидерландские договоры 1871 года, помимо прочего, вынудили нас уступить важнейший западноафриканский торговый форпост Золотого Берега. Мы отвергнем этот неравноправный удар по нашей империи!"
 undo_the_mistakes_of_1830:0 "Зуид Недерланд Хероверен!"
 undo_the_mistakes_of_1830_desc:0 "За исключением недолговечного Соединенного Королевства Нидерландов, то, что осталось от низменностей, долгое время было разделено. Теперь пришло время исправить ошибки прошлого и вернуть себе роль буферного состояния, которым мы должны были быть!"
 unshackle_the_boers:0 "Освободить буров!"
 unshackle_the_boers_desc:0 "Много веков назад Нидерландская Ост-Индская компания основала несколько колоний у мыса Доброй Надежды и со временем расширила их. Хотя значительная часть нашего контроля была косвенной, многие нидерландские поселенцы теперь живут под чужой властью. Мы освободим своих братьев!"
 bring_noord_pas_de_calais_into_the_fold:0 "Освободите французскую Фландрию!"
 reclaim_east_indies_possessions:0 "Возвращение бывших ост-индских владений!"
 reclaim_east_indies_possessions_desc:0 "Нидерландская Ост-Индская компания некогда контролировала несколько ключевых торговых пунктов и островов по всей Азии, которые со временем перешли под иностранную власть. Мы больше не станем мириться с потерей законных территорий!"
 bring_noord_pas_de_calais_into_the_fold:0 "Возвратить французскую Фландрию!"
 bring_noord_pas_de_calais_into_the_fold_desc:0 "Большая часть французской провинции Нор-Па-де-Кале была исторической частью графства Фландрия, где сегодня проживает значительное меньшинство говорящих по-голландски. Мы снова подведем наших братьев под наше правление!"
 expand_guiana_possessions:0 "Расширьте владения Гвианы!"
 expand_guiana_possessions_desc:0 "В течение большей части 17-го и 18-го веков голландцы в значительной степени контролировали всю Гвиану, прежде чем в конечном итоге уступить большую часть ее британцам и французам. Мы возьмем наши прежние владения!"
 Fully_controls_Vlaanderen_tt:0 "Полностью контролирует §YВлаандерен§!."
 Fully_controls_vlaanderen_and_wallonia_tt:0 "Полностью контролирует §YВлаандерен§! и §YВаллони§!."
 hol_adds_decisions_tt:0 "§GРазблокирует новые решения, предоставляя ядра и претензии на исторически голландские территории.§!"
 hol_adds_coring_decisions_tt:0 "§GОн получит решения по основной Валлонии и Люксембургу, когда-то принадлежавшие игроку.§!"
 core_lux:0 "Интеграция Люксембурга"
 core_wll:0 "Интеграция Валлонии"
