l_russian:
 sp_r56rp_supercarrier_unique_reward_1:0 "Укрепление ледового авианосца"
 sp_r56rp_supercarrier_unique_reward_1_desc:0 "Инвестируя огромное количество времени в строительство этого гигантского носителя, мы должны быть уверены, что даем ему наилучшую защиту. Что нас больше всего беспокоит?"
 sp_r56rp_supercarrier_unique_reward_1_a:0 "Силы природы"
 sp_r56rp_supercarrier_unique_reward_1_b:0 "Вражеские силы"
 sp_r56rp_naval_panzerschiff:0 "Карманный линкор"
 sp_r56rp_naval_panzerschiff_desc:0 "Способность проецировать военно-морскую мощь на мировой арене, будь то для наступательных действий или для защиты нашей торговли, имеет решающее значение в наши дни. Некоторые из наших инженеров, увидев проекты, выходящие из Германии, считают, что, специализируясь на корпусе крейсера в стиле, похожем на «карманный линкор», мы могли бы обеспечить дальнобойную работу с респектабельной огневой мощью."
 sp_r56rp_naval_coastal_ships:0 "Корабль береговой обороны"
 sp_r56rp_naval_coastal_ships_desc:0 "Некоторые военнослужащие считают, что наши прибрежные воды слишком слабо защищены, и поэтому они выдвинули несколько концепций, все из которых подпадают под аналогичные параметры. Построенный на существующих легких крейсерах, корабль будет обстрелян, чтобы представлять угрозу для кораблей 20-х и 30-х годов, что способствует низкой стоимости строительства над операциями с голубой водой."
 sp_r56rp_naval_super_sub:0 "Проект A.L.I.C.O.R.N."
 sp_r56rp_naval_super_sub_desc:0 "С удачей наших подводных палубных орудий, подводных лодок и пониманием морских самолетов на авианосцах. Некоторые из наших более неуравновешенных ученых выдвинули откровенно безумный проект. Названный «Продвинутым проектом комплексных боевых операций дальнего радиуса действия Разведывательное морское», корабль выглядит как большой, хорошо вооруженный, подводный военный корабль. Проекты зашли так далеко, что предложили установить объект для работы ракетных снарядов. Этот проект честолюбив, возможно, по своей вине, и большинство наших исследователей излагают проблемы с учетом существующих технологий, однако, если программа будет создана. Мы могли бы иметь в нашем распоряжении надлежащие военные корабли, обладающие огневой мощью."
 sp_r56rp_air_revolving_cannon:0 "Револьверная пушка"
 sp_r56rp_air_revolving_cannon_desc:0 "Поскольку самолеты становятся все быстрее и быстрее, наше оружие должно идти в ногу со временем. Окно возможностей для нанесения ударов по вражеским самолетам теперь измеряется в десятых долях секунды, и старое вооружение не может идти в ногу со временем. Используя несколько камер для загрузки одного ствола, мы можем резко увеличить огневую мощь наших пушек."
 GER_sp_r56rp_air_revolving_cannon:0 "MG 213"
 ENG_sp_r56rp_air_revolving_cannon:0 "Аден"
 ENG_sp_r56rp_air_revolving_cannon:0 "Дефа"
 USA_sp_r56rp_air_revolving_cannon:0 "M39"
 SOV_sp_r56rp_air_revolving_cannon:0 "Р-23"
 SWE_sp_r56rp_air_revolving_cannon:0 "Эерликон ККА"
 SWI_sp_r56rp_air_revolving_cannon:0 "Эерликон ККА"
 sp_r56rp_air_afterburning_jet_engine:0 "Подогреваемые реактивные двигатели"
 sp_r56rp_air_afterburning_jet_engine_desc:0 "Путем сброса топлива в выхлопные газы перегретого двигателя мы можем увеличить тягу двигателя, для минимального веса и увеличения стоимости. К сожалению, этот метод крайне неэффективен, что резко увеличивает использование боевого топлива."
 sp_r56rp_automatic_gun_laying_turret:0 "Автоматическая стрелковая башня"
 sp_r56rp_automatic_gun_laying_turret_desc:0 "Недавний прогресс в области радиолокационных технологий породил предложение от инженерной команды. Они предлагают интегрировать компактный радар, установленный на башню самолета. Это позволит легче обнаруживать вражеские цели, особенно во время ночных миссий, и потенциально может позволить башне автономно поражать цели."
 ENG_sp_r56rp_automatic_gun_laying_turret:0 "Фрейзер-Наш FN121"
 sp_r56rp_tank_autoloader:0 "Автозагрузчик Tank"
 sp_r56rp_tank_autoloader_desc:0 "Мы изучим пути внедрения автоматизированных механизмов загрузки наших танков."
 sp_r56rp_tank_oscillating_turret:0 "Колеблющаяся танковая башня"
 sp_r56rp_tank_oscillating_turret_desc:0 "Была предложена радикально новая конструкция танковой башни. Мы могли бы попытаться поднять всю башню, а не только сам пистолет. Это упростит установку автозагрузчика, а также уменьшит общие размеры башни, но будет дорогостоящим."
 sp_r56rp_nuclear_aa_missile:0 "Ядерные ракеты класса «воздух-воздух»"
 sp_r56rp_nuclear_aa_missile_desc:0 "Еще одна уменьшенная ядерная боеголовка может быть способна поместиться внутри ракеты, перевозимой самолетом, для противовоздушного использования. Целые группы бомбардировщиков могут быть уничтожены в одно мгновение."
 USA_sp_r56rp_nuclear_aa_missile:0 "AIR-2 Джин"
 sp_r56rp_nuclear_aa_missile_bonus:0 "Ядерные ракеты класса «воздух-воздух»"
 sp_r56rp_nuclear_depth_charge:0 "Обвинения в ядерной глубине"
 sp_r56rp_nuclear_depth_charge_desc:0 "Дальнейшая уменьшенная ядерная боеголовка может быть использована вместо обычной полезной нагрузки, резко увеличивая град глубинного заряда. Ударная волна такого масштаба наверняка выбьет любую подводную лодку за один удар."
 USA_sp_r56rp_nuclear_depth_charge:0 "Mk 101 Лулу"
