 r56_greenland.1.t:0 "Соглашение Халл-Кауффмана"
 r56_greenland.1.d:0 "[DEN.GetADjective] правительство недавно пало под натиском фашистских армий, однако колониальная территория Гренландии остаётся свободной от фашистского вмешательства. Как нельзя кстати к нам недавно обратился [DEN.GetADjective] дипломат Хенрик Кауфман по поводу ситуации в Гренландии. Он действует «от имени короля» и от имени недавно изгнанного [DEN.GetADjective] правительства.\n\nВласти Нуука связались с Кауфманом с этой просьбой, поскольку предпочли бы [USA.GetADjective] оккупацию возможной оккупации со стороны [ENG.GetNameDef] или [CAN.GetNameDef]. Или, что ещё хуже, фашистской державы. С точки зрения международного права это соглашение может быть юридически сомнительным... Но на нас лежит ответственность защищать все земли и народы Нового Света от фашистских угроз, включая Гренландию.\n\nКак нам следует поступить?"
 r56_greenland.1.a:0 "Немедленно установить прямой контроль над Гренландией."
 r56_greenland.1.b:0 "Пусть власть перейдёт к местному правительству в Нууке. Однако нам придётся обеспечить их безопасность."
 r56_greenland.1.c:0 "Не будем вмешиваться."
