 GRN_the_carrier_which_came_in_from_the_cold:0 "Авианосец, пришедший с холода"
 GRN_the_carrier_which_came_in_from_the_cold_desc:0 "Наше географическое положение позволяет создать гигантский авианосец на ледяной основе. Он позволит нам господствовать везде, где сияет северное сияние, и поддерживать высадку, чтобы добраться до кухни, где некоторые из них прячутся."
