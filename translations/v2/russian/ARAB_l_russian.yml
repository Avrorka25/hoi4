l_russian:
 ARAB_tribal_warrior_traditions:0 "Племенные воинские традиции"
 ARAB_tribal_warrior_traditions_desc:0 "На протяжении многих лет наши воины доказывали свою силу в боях с врагами, и мы ещё покажем им свой боевой дух."
 ARAB_rely_on_tribal_levies:0 "Опора на племенное ополчение"
 ARAB_rely_on_tribal_levies_desc:0 "Мы должны набрать ополченцев, преданных нашему делу."
 ARAB_warm_climate_training_desc:0 "Нужно использовать родной климат в своих интересах."
 ARAB_the_holy_war:0 "Священная война"
 ARAB_the_holy_war_desc:0 "После того как палестинским арабам не удалось справиться с сионистскими силами, мы вынуждены вторгнуться и уничтожить их раз и навсегда."
 ARAB_war_infrastructure:0 "Военная инфраструктура"
 ARAB_war_infrastructure_desc:0 "Наша страна долго оставалась без должного внимания. Чтобы вести современную войну, необходимо улучшить инфраструктуру."
 ARAB_arms_shipments:0 "Поставки оружия"
 ARAB_arms_shipments_desc:0 "Чтобы укрепить армию, необходимо закупать оружие на зарубежных рынках."
 ARAB_army_assessments:0 "Оценить нашу армию"
 ARAB_army_assessments_desc:0 "Наша армия погрязла в кумовстве и коррупции, что серьёзно угрожает её боеспособности. Нужно решить, как с этим бороться."
 ARAB_get_rid_of_nepotism:0 "Бороться с кумовством в армии"
 ARAB_get_rid_of_nepotism_desc:0 "Если мы хотим вести современную войну, необходимо избавиться от кумовства в армии."
 ARAB_keep_nepotism:0 "Использовать армейское кумовство"
 ARAB_keep_nepotism_desc:0 "Мы можем использовать кумовство в армии для усиления своего влияния."
 ARAB_keep_after_war:0 "Этот национальный дух сохранится после войны с Израилем."
 ISR_ARAB_army_nepotism_1:0 "Повсеместное кумовство в армии"
 ISR_ARAB_army_nepotism_1_desc:0 "Нынешняя война с [ISR.GetNameDef] особенно ярко показала чудовищное кумовство, пронизывающее нашу армию. Если мы хотим быть способными вести ещё одну войну, придётся либо решить эти проблемы, либо использовать их в своих интересах..."
 ISR_ARAB_army_nepotism_2:0 "Армейское кумовство ограничено"
 ISR_ARAB_army_nepotism_3:0 "Повсеместное кумовство в армии"
 r56_arab_focus:0 "Общее древо фокусов малых арабских стран"
