 POR_artur_varela_cid:0 "Artur Varela Cid"
 POR_lackluster_armed_forces:0 "Слабые вооружённые силы"
 POR_lackluster_armed_forces_desc:0 "Катастрофическое участие в Великой войне и сокращение расходов в рамках политики жёсткой экономии лишили вооружённые силы Португалии способности защищать страну. Время идёт, а конфликты по всему миру разгораются всё сильнее. Мы должны либо устранить недостатки армии, либо сделать всё возможное, чтобы не допустить её участия в боевых действиях."
 POR_slowly_modernizing_armed_forces:0 "Медленно модернизирующиеся вооружённые силы"
 POR_slowly_modernizing_armed_forces_desc:0 "Катастрофическое участие в Великой войне и сокращение расходов в рамках политики жёсткой экономии лишили вооружённые силы Португалии способности защищать страну. Мы добились заметного прогресса в подготовке армии, однако она всё ещё едва ли готова к защите [POR.GetAdjective]ой территории."
 POR_towards_a_modern_european_army:0 "На пути к современной европейской армии"
 POR_towards_a_modern_european_army_desc:0 "Катастрофическое участие в Великой войне и сокращение расходов в рамках политики жёсткой экономии нанесли вооружённым силам Португалии огромный ущерб, однако мы добились впечатляющего прогресса в их модернизации. Совсем скоро нас вновь будут считать профессиональной европейской военной силой!"
 POR_disgruntled_republicans:0 "Недовольные республиканцы"
 POR_disgruntled_republicans_desc:0 "Либералы и социалисты по всей Португалии ясно дали понять, что не желают сотрудничать с нашими планами. Хотя сейчас они далеко не единственная проблема, возвращение стабильности зависит от уничтожения этих революционных сил прежде, чем они успеют погубить нас."
 POR_austerity_measures:0 "Меры жёсткой экономии"
 POR_austerity_measures_desc:0 "Несмотря на Великую депрессию, финансовая политика Салазара не позволила Португалии оказаться в долговой зависимости от британцев или американцев, хотя и нанесла ущерб уровню жизни и многим государственным службам. Эта политика несомненно принесла успех, но вскоре нам придётся решить, следует ли продолжать её."
 POR_harrowing_illiteracy:0 "Ужасающая неграмотность"
 POR_harrowing_illiteracy_desc:0 "Несмотря на историческое положение западноевропейской мировой державы, значительно больше половины [POR.GetAdjective]ого населения остаётся частично или полностью неграмотным. Для устранения этого препятствия национальному развитию центральному правительству придётся действовать решительно."
 POR_illiteracy:0 "Неграмотность"
 POR_illiteracy_desc:0 "Несмотря на историческое положение западноевропейской мировой державы, значительно больше половины [POR.GetAdjective]ого населения остаётся частично или полностью неграмотным. Для устранения этого препятствия национальному развитию центральному правительству придётся действовать решительно."
 POR_lingering_illiteracy:0 "Сохраняющаяся неграмотность"
 POR_lingering_illiteracy_desc:0 "Несмотря на историческое положение западноевропейской мировой державы, значительная часть [POR.GetAdjective]ого населения остаётся частично или полностью неграмотной. Центральное правительство уже принимает решительные меры, но для появления полноценных результатов потребуется время."
 POR_towards_a_greater_portugal:0 "К Великой Португалии"
 POR_towards_a_greater_portugal_desc:0 "Несмотря на века имперского упадка, достижения португальских исследователей оставили невероятный след в истории мира. На фоне постоянных перемен в международных делах именно сейчас может появиться лучшая возможность восстановить влияние Лиссабона!"
 POR_unshackle_galicia:0 "Освободить Галисию"
 POR_unshackle_galicia_desc:0 "Несмотря на века господства Мадрида, историческая Галисия значительно ближе к Португалии по языку и культуре. Безумие Испании зашло слишком далеко и в последний раз поставило под угрозу безопасность и жизни наших братьев!"
 POR_integrate_galicia:0 "Интегрировать Галисию"
 POR_integrate_galicia_desc:0 "Мы показали населению Галисии, что мудрое руководство нашей страны отвечает его интересам. Нельзя больше откладывать интеграцию провинции в [ROOT.GetAdjective]ую родину!"
 POR_restore_the_iberian_union:0 "Восстановить Иберийскую унию"
 POR_restore_the_iberian_union_desc:0 "Прошло много веков с тех пор, как португальский народ находился под жестокой властью Мадрида. После победы революции в нашей стране настал лучший момент для объединения с иберийскими братьями, с которыми у нас так много общего."
 POR_gains_claims_on_all_spanish_states_in_europe_tt:0 "Получает претензии на все §Yиспанские§! регионы в Европе."
 POR_restore_the_iberian_union_tt:0 "Открывает решения §YИнтеграция внутренних областей Испании§!."
 POR_relocate_the_capital_to_madrid:0 "Перенести столицу в Мадрид"
 POR_relocate_the_capital_to_madrid_desc:0 "Мадрид, бывшая столица Испании, находится в самом сердце кастильских земель и в центре нового союза. Поэтому он является логичным местом для новой административной столицы."
 POR_restore_basque_regional_autonomy:0 "Восстановить автономию Страны Басков"
 POR_restore_basque_regional_autonomy_desc:0 "Несмотря на длительное господство Мадрида, баскские регионы Испании стойко сопротивлялись ассимиляции. Предоставление баскам желанной автономии значительно ускорит их интеграцию в подлинно общеиберийскую страну."
 POR_restore_catalan_regional_autonomy:0 "Восстановить автономию Каталонии"
 POR_restore_catalan_regional_autonomy_desc:0 "Несмотря на множество сходств с испанцами и португальцами, каталонцы обладают сильной собственной идентичностью и опасаются очередного централизованного государства, которое будет подавлять их культуру и историю. Мы победили не для того, чтобы оттолкнуть братьев по полуострову!"
 POR_reorganize_the_spanish_administration:0 "Реорганизовать испанскую администрацию"
 POR_reorganize_the_spanish_administration_desc:0 "Теперь, когда стабильность на полуострове восстановлена, настало время подавить остаточное сопротивление и окончательно включить местную администрацию в нашу!"
 POR_reorganize_the_spanish_administration_tt:0 "Контролирует все материковые §Yиспанские§! регионы, где подчинение составляет не менее 30%"
 POR_organize_elections_in_the_hispanic_regions:0 "Организовать выборы в испаноязычных регионах"
 POR_organize_elections_in_the_hispanic_regions_desc:0 "Для сохранения контроля над испанскими землями не обязательно прибегать к жестокой силе. Мы пригласим испанских братьев в нашу великую возрождённую демократию!"
 POR_organize_elections_in_the_hispanic_regions_tt:0 "Контролирует все материковые §Yиспанские§! регионы, где подчинение составляет не менее 25%"
 POR_repudiate_the_1890_british_ultimatum:0 "Отвергнуть британский ультиматум 1890 года"
 POR_repudiate_the_1890_british_ultimatum_desc:0 "Британский ультиматум 1890 года стал национальной трагедией для всей нашей межконтинентальной империи. Теперь у нас наконец появился шанс вновь соединить африканские владения!"
 POR_continue_the_naval_expansion:0 "Продолжить расширение флота"
 POR_continue_the_naval_expansion_desc:0 "После Великой войны [ROOT.GetAdjective]ий флот расширялся, но из-за последствий Великой депрессии эти усилия были значительно сокращены. Теперь, когда экономика в основном восстановилась, следует продолжать строительство португальского флота, пока он не сможет защищать наши интересы."
 POR_protect_the_strategic_ports_r56:0 "Защитить стратегические порты"
 POR_protect_the_strategic_ports_r56_desc:0 "Европа и Азия с каждым месяцем становятся всё менее мирными, поэтому необходимо укреплять национальную оборону. Усиление заморских баз, включая Мадейру и Азорские острова, значительно повысит наши шансы в новом трансатлантическом конфликте."
 POR_expand_naval_production:0 "Расширить военно-морское производство"
 POR_expand_naval_production_desc:0 "Несмотря на многовековую историю заметной морской державы, [ROOT.GetAdjective]ий флот уступает многим потенциальным противникам в численности и вооружении. Следует выделить средства на восстановление португальской судостроительной промышленности!"
 POR_expand_the_alfeite_shipyard:0 "Расширить верфь Алфейти"
 POR_expand_the_alfeite_shipyard_desc:0 "Верфь Алфейти является одним из ведущих судостроительных предприятий Португалии. Дальнейшее расширение производства должно включать укрепление этой важнейшей верфи."
 POR_expand_northern_repair_facilities:0 "Расширить северные ремонтные мощности"
 POR_expand_northern_repair_facilities_desc:0 "В северных провинциях Португалии находятся военно-морские ремонтные предприятия, которые будут крайне важны в случае войны с участием флота. Следует расширить их возможности."
 POR_modernize_lisbons_naval_academy:0 "Модернизировать Лиссабонскую военно-морскую академию"
 POR_modernize_lisbons_naval_academy_desc:0 "Чтобы вновь стать морской державой, необходимо развить военно-морскую инженерию до уровня, недоступного другим странам. Лиссабон снова станет символом престижа и морской гордости!"
 has_researched_at_least_3_naval_doctrine_tt:0 "Исследовано не менее §Y3§! технологий §Yморской доктрины§!"
 POR_experiment_with_radar:0 "Эксперименты с радаром"
 POR_experiment_with_radar_desc:0 "Несмотря на раннюю стадию развития, радар уже демонстрирует огромный потенциал в гражданской и военной сферах. Пока мир вновь накаляется, эта технология несомненно поможет защитить Португалию от любых угроз."
 POR_expand_the_merchant_fleet:0 "Расширить торговый флот"
 POR_expand_the_merchant_fleet_desc:0 "Великая война наглядно показала, какой огромный ущерб подводная война способна нанести международной торговле. Необходимо подготовить [ROOT.GetAdjective]ий торговый флот к противодействию подобным угрозам."
 POR_anti_submarine_weaponry:0 "Противолодочное вооружение"
 POR_anti_submarine_weaponry_desc:0 "Со времён Великой войны противолодочные технологии ушли далеко вперёд. Необходимо модернизировать флот с учётом этих достижений."
 POR_study_italian_submarines:0 "Изучить итальянские подводные лодки"
 POR_study_italian_submarines_desc:0 "Италия добилась значительных успехов в военно-морском развитии, несмотря на экономику, уступающую германской и британской. Возможно, её подход принесёт аналогичные результаты и нам."
 POR_the_future_of_naval_deterrence:0 "Будущее морского сдерживания"
 POR_the_future_of_naval_deterrence_desc:0 "По численности наш флот не способен противостоять угрозам со стороны более крупного соседа. Новые технологии, особенно морское минирование, несомненно помогут защитить страну."
 POR_restore_our_high_seas_presence:0 "Восстановить присутствие в открытом море"
 POR_restore_our_high_seas_presence_desc:0 "Португалия является державой с владениями по всему миру и сталкивается с угрозами в разных его уголках. Наше имперское наследие необходимо защищать, а для этого требуется сильный океанский флот!"
 POR_restoring_the_portuguese_high_seas_armada_r56:0 "Восстановить нашу океанскую армаду"
 POR_restoring_the_portuguese_high_seas_armada_r56_desc:0 "Португалия является державой с владениями по всему миру и сталкивается с угрозами в разных его уголках. Наше имперское наследие необходимо защищать, а для этого требуется сильный океанский флот!"
 POR_advancing_our_tactics:0 "Развивать нашу тактику"
 POR_advancing_our_tactics_desc:0 "Чтобы вновь стать великой морской державой, необходимо следовать достижениям таких стран, как Великобритания, Япония и Соединённые Штаты. Флот должен быть модернизирован любой ценой!"
 POR_study_amphibious_operations:0 "Изучить десантные операции"
 POR_study_amphibious_operations_desc:0 "Морские десанты не являются ни новым явлением, ни незнакомым Португалии видом войны. Тем не менее опыт операций времён Великой войны содержит уроки, которые следует изучить для совершенствования собственной стратегии."
 POR_restore_the_naval_guard:0 "Восстановить морскую гвардию"
 POR_restore_the_naval_guard_desc:0 "В мире всё более профессиональных армий специализация войск является важной частью современной войны. Следует восстановить [ROOT.GetAdjective]ую морскую гвардию, чтобы она сопровождала нас в самых дальних операциях!"
 POR_focus_on_submarine_production:0 "Сосредоточиться на производстве подводных лодок"
 POR_focus_on_submarine_production_desc:0 "Германия доказала, что подводные лодки являются решающим средством сдерживания более крупного флота за счёт экономического разорения. Необходимо начать масштабное приобретение этих важных кораблей."
 POR_towards_a_portuguese_raiding_armada_r56:0 "К [POR.GetAdjective]ой рейдерской армаде"
 POR_towards_a_portuguese_raiding_armada_r56_desc:0 "Германия доказала, что подводные лодки являются решающим средством сдерживания более крупного флота за счёт экономического разорения. Необходимо начать масштабное приобретение этих важных кораблей."
 POR_guide_the_future_of_naval_warfare:0 "Определить будущее морской войны"
 POR_guide_the_future_of_naval_warfare_desc:0 "Реформы военно-морских сил стремительно возвращают нам статус морской державы. Необходимо подготовить Португалию ко всему, что за этим последует!"
 POR_complete_the_military_restructuring:0 "Завершить военную реорганизацию"
 POR_complete_the_military_restructuring_desc:0 "Пока часы европейского мира отсчитывают последние минуты, необходимо убедиться, что вооружённые силы способны защитить как политическую стабильность, так и страну в целом от всех угроз, стремящихся её уничтожить."
 POR_institute_of_higher_military_studies:0 "Институт высших военных исследований"
 POR_institute_of_higher_military_studies_desc:0 "Если Португалия хочет вновь стать военной державой, пора реорганизовать военную академию в полноценный институт, который будет готовить поколения храбрых бойцов, способных вести страну вперёд!"
 has_at_least_100_mastery_in_any_land_subdoctrine_tt:0 "Имеет не менее £doctrine_mastery §Y100 мастерства§! в любой §Yсухопутной субдоктрине§!."
 has_at_least_200_mastery_in_any_land_subdoctrine_tt:0 "Имеет не менее £doctrine_mastery §Y200 мастерства§! в любой §Yсухопутной субдоктрине§!."
 has_at_least_200_mastery_in_any_naval_subdoctrine_tt:0 "Имеет не менее £doctrine_mastery §Y200 мастерства§! в любой §Yморской субдоктрине§!."
 has_at_least_200_mastery_in_any_air_subdoctrine_tt:0 "Имеет не менее £doctrine_mastery §Y200 мастерства§! в любой §Yвоздушной субдоктрине§!."
 POR_plan_for_a_defense_of_the_interior:0 "Разработать план обороны внутренних районов"
 POR_plan_for_a_defense_of_the_interior_desc:0 "По мере разгорания конфликтов по всему миру может наступить момент, когда Португалия станет ареной невообразимых разрушений. Мы обязаны быть готовы."
 POR_prepare_for_a_war_of_logistics:0 "Подготовиться к войне логистики"
 POR_prepare_for_a_war_of_logistics_desc:0 "Как страна, исторически владевшая территориями на четырёх континентах, мы лучше многих понимаем важность прагматичной логистики. Необходимо провести стандартизацию, чтобы храбрые солдаты всегда получали всё нужное для победы на современном поле боя."
 POR_study_flexible_defense_plans:0 "Изучить гибкие планы обороны"
 POR_study_flexible_defense_plans_desc:0 "Шведский лейтенант Аксель Оскар Раппе совместно с финскими военными инженерами работает над созданием гибкой оборонительной линии на границе с гораздо более сильным российским соседом. Если у нас нет средств на собственную линию Мажино, меньшие оборонительные проекты такого рода могут стать решающим средством сдерживания врагов!"
 POR_modernize_our_infantry:0 "Модернизировать пехоту"
 POR_modernize_our_infantry_desc:0 "Несмотря на все изменения в военном деле, пехота остаётся царицей полей. Чтобы выстоять в грядущих войнах, необходимо повысить её наступательные и оборонительные возможности."
 POR_utilize_the_inland_terrain:0 "Использовать рельеф внутренних районов"
 POR_utilize_the_inland_terrain_desc:0 "Даже если Лиссабон, Порту и Бежа падут под натиском соседей, любой враг Португалии столкнётся с трудностями при продвижении через восточные горы. Специализированные горные части несомненно сыграют решающую роль в защите этих естественных крепостей."
 POR_modernize_our_artillery_systems:0 "Модернизировать артиллерийские системы"
 POR_modernize_our_artillery_systems_desc:0 "На поле боя появляются новые виды вооружения, но не менее важно модернизировать стремительно устаревающую артиллерию, необходимую для обстрела врагов сухопутных войск!"
 POR_contenders_on_the_world_stage:0 "Соперники на мировой арене"
 POR_contenders_on_the_world_stage_desc:0 "The [ROOT.GetAdjective] Армия снова может называться профессиональной европейской сухопутной армией. Пока еще предстоит проделать работу, мы являемся силой, которой следует опасаться на современном поле боя!"
 POR_due_to_a_bastion_of_combined_arms_warfare_not_being_completed_tt:0 "Поскольку фокус §YОплот общевойсковой войны§! не завершён, мы получим следующие эффекты:"
 POR_study_the_spanish_conflict:0 "Изучить испанский конфликт"
 POR_study_the_spanish_conflict_desc:0 "Гражданская война в Испании стала испытательным полигоном для бесчисленных новшеств современной войны. Модернизация вооружённых сил должна опираться на тщательное изучение этого фронта."
 POR_studying_the_spanish_civil_war:0 "Изучение гражданской войны в Испании"
 POR_studying_the_spanish_civil_war_desc:0 "Гражданская война в Испании стала испытательным полигоном для бесчисленных новшеств современной войны. Модернизация вооружённых сил должна опираться на тщательное изучение этого фронта."
 POR_learn_from_guerrilla_operations:0 "Извлечь уроки из партизанских операций"
 POR_learn_from_guerrilla_operations_desc:0 "Недавние асимметричные конфликты, прежде всего Испано-рифская и Ирландская войны, показали, что более слабая армия способна нанести огромный ущерб даже великой державе. Чтобы Португалия оставалась свободной, необходимо учиться на этих примерах самоотверженности и храбрости!"
 POR_adapting_to_the_modern_battlefield:0 "Адаптация к современному полю боя"
 POR_adapting_to_the_modern_battlefield_desc:0 "Последние три десятилетия принесли миру невероятные средства ведения войны. Чтобы быть готовыми к современному конфликту, необходимо разработать собственные меры противодействия как бронетанковым, так и воздушным атакам."
 POR_continue_the_fight_underground:0 "Продолжить подпольную борьбу"
 POR_continue_the_fight_underground_desc:0 "Немыслимое приближается к Португалии, но мы ещё не побеждены! При поддержке друзей страны мы вернём великий материк, а пока обеспечим движения сопротивления средствами для продолжения борьбы в тылу врага!"
 POR_funding_underground_resistance_groups:0 "Финансирование подпольных групп сопротивления"
 POR_funding_underground_resistance_groups_desc:0 "Немыслимое приближается к Португалии, но мы ещё не побеждены! При поддержке друзей страны мы вернём великий материк, а пока обеспечим движения сопротивления средствами для продолжения борьбы в тылу врага!"
 POR_study_mechanized_warfare:0 "Изучить механизированную войну"
 POR_study_mechanized_warfare_desc:0 "Такие страны, как Германия и Великобритания, стремительно развивают мобильные боевые машины. Следует изучить их применение на поле боя!"
 POR_towards_a_mobile_army:0 "К мобильной армии"
 POR_towards_a_mobile_army_desc:0 "Главный урок продолжающегося испанского конфликта заключается в том, что современную войну выигрывают решительными и гибкими манёврами. Если наши советники в Испании уже сейчас отмечают эту тенденцию, со временем она лишь усилится."
 POR_subsidize_OGME:0 "Субсидировать OGME"
 POR_subsidize_OGME_desc:0 "Самообеспечение в производстве транспорта — достойная цель. Финансирование таких компаний, как OGME, несомненно поможет её достичь."
 POR_specialized_auxiliary_tanks:0 "Специализированные вспомогательные танки"
 POR_specialized_auxiliary_tanks_desc:0 "Танки не являются и не станут центральным элементом поля боя. Великая война наглядно показала, как их можно использовать в качестве вспомогательных подразделений при пехотных батальонах, что превратит нашу армию в грозную силу!"
 POR_experiment_with_amphibious_vehicles:0 "Эксперименты с плавающей техникой"
 POR_experiment_with_amphibious_vehicles_desc:0 "Настало время многоцелевым машинам дебютировать на поле боя. Необходимо направить ресурсы на их приобретение."
 POR_a_bastion_of_combined_arms_warfare:0 "Оплот общевойсковой войны"
 POR_a_bastion_of_combined_arms_warfare_desc:0 "Последние достижения направили [ROOT.GetAdjective]ие вооружённые силы к превращению в сильную, мобильную и гибкую армию Иберии. Мы создадим новое наследие этого национального института!"
 POR_due_to_contenders_on_the_world_stage_not_being_completed_tt:0 "Поскольку фокус §YСоперники на мировой арене§! не завершён, мы получим следующие эффекты:"
 POR_import_foreign_bombers:0 "Импортировать иностранные бомбардировщики"
 POR_import_foreign_bombers_desc:0 "Бомбардировочная авиация доказала свою решающую роль в нарушении деятельности армий и гражданского населения враждебных стран. Следует импортировать самолёты из таких государств, как Великобритания и Италия, для изучения и внедрения."
 POR_study_british_fighters:0 "Изучить британские истребители"
 POR_study_british_fighters_desc:0 "Независимо от того, стремимся ли мы господствовать в небе или лишь защищаться от ужасов бомбардировок, изучение доступных британских самолётов поможет развитию собственной авиации."
 POR_experiment_with_torpedo_bombers:0 "Эксперименты с торпедоносцами"
 POR_experiment_with_torpedo_bombers_desc:0 "Морская авиация — новая, но крайне перспективная область для таких стран, как наша, неспособных содержать крупную судостроительную промышленность. Небольшой флот торпедоносцев может стать серьёзным средством сдерживания применения силы против нас на море."
 POR_modern_engines:0 "Современные двигатели"
 POR_modern_engines_desc:0 "Надёжные и быстрые двигатели являются основой любого истребителя. Следует сосредоточить исследования и разработки в этой области."
 POR_experiment_with_heavy_fighters:0 "Эксперименты с тяжёлыми истребителями"
 POR_experiment_with_heavy_fighters_desc:0 "Тяжёлые истребители важны для любого воздушного флота, стремящегося защитить ценные бомбардировщики. Следует приобрести такие самолёты для их сопровождения."
 POR_grant_autonomy_to_the_air_force:0 "Предоставить автономию военно-воздушным силам"
 POR_grant_autonomy_to_the_air_force_desc:0 "Подчинение военно-воздушных сил армии ограничивает их способность к самостоятельным действиям. Следует последовать примеру других западных стран и предоставить этому важнейшему роду войск больше автономии!"
 POR_experiment_with_airborne_divisions:0 "Эксперименты с воздушно-десантными дивизиями"
 POR_experiment_with_airborne_divisions_desc:0 "Высадка с воздуха высокомотивированной и хорошо обученной армии является чрезвычайно экспериментальным способом проведения современных общевойсковых операций. Страх, который это способно вызвать у врагов страны, невероятен!"
 POR_air_land_battle:0 "Воздушно-наземная операция"
 POR_air_land_battle_desc:0 "Взаимодействие бомбардировщиков с сухопутными и военно-морскими силами станет важной частью современной войны. Следует продолжить модернизацию этой авиации."
 POR_modernize_the_fighter_arsenal:0 "Модернизировать истребительный арсенал"
 POR_modernize_the_fighter_arsenal_desc:0 "Самолёты не могут быть слишком хорошо приспособлены к угрозам в небе."
 POR_complete_the_separation:0 "Завершить отделение"
 POR_complete_the_separation_desc:0 "Настало время создать отдельные и независимые [ROOT.GetAdjective]ие военно-воздушные силы, которые приведут нас к победе в небе."
 POR_portuguese_air_force_r56:0 "[ROOT.GetAdjective]ие ВВС"
 POR_portuguese_air_force_r56_desc:0 "The [POR.GetAdjective] Военно-воздушные силы являются кульминацией многолетней независимости от остальной части армии. Пока она еще молода, она уже зарекомендовала себя как профессиональная, современная сила."
 POR_continue_the_public_works_r56:0 "Продолжить общественные работы"
 POR_continue_the_public_works_r56_desc:0 "Проекты общественных работ являются разумным вложением в страну и будут долгие годы поддерживать растущую Португалию. Расширение существующих и создание новых проектов принесёт пользу экономике и покажет, что мы служим стабилизирующей силой для всей страны."
 POR_support_continued_educational_expansion:0 "Поддержать дальнейшее расширение образования"
 POR_support_continued_educational_expansion_desc:0 "Пока большая часть западного мира продолжала совершенствовать начальное образование, Португалия значительно отставала. Теперь, когда положение стабилизировалось, необходимо устранить этот позор страны."
 POR_subsidize_rolling_stock_production:0 "Субсидировать производство подвижного состава"
 POR_subsidize_rolling_stock_production_desc:0 "[ROOT.GetAdjective] Производство подвижного состава является важным компонентом, необходимым для обеспечения наших амбициозных общественных работ. Мы должны продолжать субсидировать эту важную отрасль."
 POR_finish_the_santa_luzia_dam:0 "Завершить плотину Санта-Лузия"
 POR_finish_the_santa_luzia_dam_desc:0 "Гидроэнергетика в Португалии уже продемонстрировала огромный потенциал. Плотина Санта-Лузия станет следующим шагом к энергетической независимости, и настало время завершить этот амбициозный проект!"
 POR_modernize_the_national_rail_network:0 "Модернизировать национальную железнодорожную сеть"
 POR_modernize_the_national_rail_network_desc:0 "Национальная железнодорожная сеть с центром в Лиссабоне является важным узлом, связывающим Иберийский полуостров с морем. Необходимо выделить дополнительные средства на модернизацию этой части инфраструктуры."
 POR_modernize_the_rural_regions:0 "Модернизировать сельские районы"
 POR_modernize_the_rural_regions_desc:0 "Городская и сельская Португалия во многих отношениях едва ли являются одной страной. Необходимо приблизить уровень развития деревни к крупнейшим городским центрам."
 POR_continue_the_national_electrification:0 "Продолжить электрификацию страны"
 POR_continue_the_national_electrification_desc:0 "Распространение электричества на как можно большую часть страны необходимо для превращения в одну из процветающих экономик Европы."
 POR_expand_the_mining_industry:0 "Расширить горнодобывающую промышленность"
 POR_expand_the_mining_industry_desc:0 "География страны наградила нас множеством природных ресурсов, прежде всего вольфрамом. Дальнейшие инвестиции в [ROOT.GetAdjective]ую добывающую промышленность явно разумны как с точки зрения национальной безопасности, так и развития экономики."
 POR_import_foreign_machinery:0 "Импортировать иностранное оборудование"
 POR_import_foreign_machinery_desc:0 "Португалия не располагает всеми инструментами, необходимыми для модернизации и индустриализации. Следует обратиться к Германии, Великобритании и Соединённым Штатам в поисках оборудования для развития промышленной базы."
 POR_develop_portuguese_textiles:0 "Развивать [ROOT.GetAdjective]ую текстильную промышленность"
 POR_develop_portuguese_textiles_desc:0 "Независимо от того, продолжим ли мы путь автаркии или вновь станем взаимозависимы с миром, текстиль остаётся важнейшей отраслью как для армии, так и для гражданского сектора. Необходимо увеличить инвестиции в это направление."
 POR_never_another_la_lys:0 "Больше никакого Ла-Лис"
 POR_never_another_la_lys_desc:0 "Европейский континент стремительно отходит от мира и порядка, ради которых столько людей пролили кровь в Версале. Когда десятилетия международного успокоения подходят к концу, мы должны подготовиться, чтобы не повторить пережитое Португалией. Конфликт больше никогда не поглотит страну!"
 POR_never_another_la_lys_tt:0 "Завершает фокус §YБольше никакого Лис§!, который даёт:"
 due_to_civilian_economy_being_active_we_will_receive_the_following_effects_tt:0 "Поскольку действует закон §YГражданская экономика§!, мы получим следующие эффекты:"
 due_to_early_mobilization_being_active_we_will_receive_the_following_effects_tt:0 "Поскольку действует закон §YРанняя мобилизация§!, мы получим следующие эффекты:"
 POR_the_resource_war:0 "Война за ресурсы"
 POR_the_resource_war_desc:0 "Португалия богата природными ресурсами, прежде всего вольфрамом. Пока военные машины Европы требуют всё больше сырья, наша экономика должна быть готова!"
 POR_prepare_wartime_heavy_industry:0 "Подготовить тяжёлую промышленность военного времени"
 POR_prepare_wartime_heavy_industry_desc:0 "Ужасы войны породили по всей Европе новый спрос на тяжёлую промышленность. Необходимо воспользоваться этим и превратить Португалию в стремительно индустриализирующуюся экономику!"
 POR_support_an_aerial_expansion:0 "Поддержать расширение авиации"
 POR_support_an_aerial_expansion_desc:0 "Недавние конфликты показали разрушительную мощь авиации как на поле боя, так и на море. Значительное расширение авиапроизводства — лучший способ обеспечить будущее страны!"
 POR_rejuvenate_the_land_forces:0 "Обновить сухопутные войска"
 POR_rejuvenate_the_land_forces_desc:0 "Даже в эпоху невероятного технологического прогресса пехота остаётся центральной силой на поле боя. Прежде чем принимать новые и непроверенные изобретения, необходимо довести до совершенства обеспечение рядового солдата."
 POR_rejuvenating_the_land_forces:0 "Обновление сухопутных войск"
 POR_rejuvenating_the_land_forces_desc:0 "Даже в эпоху невероятного технологического прогресса пехота остаётся центральной силой на поле боя. Прежде чем принимать новые и непроверенные изобретения, необходимо довести до совершенства обеспечение рядового солдата."
 POR_renew_the_portuguese_armada:0 "Обновить [ROOT.GetAdjective]ую армаду"
 POR_renew_the_portuguese_armada_desc:0 "Для страны, владения которой расположены на нескольких континентах, сильный и способный флот всегда будет важнейшей основой национальной безопасности. Мы обязаны сделать всё возможное, чтобы восстановить могущество на море!"
 POR_renewing_the_portuguese_armada:0 "Обновление [ROOT.GetAdjective]ой армады"
 POR_renewing_the_portuguese_armada_desc:0 "Для страны, владения которой расположены на нескольких континентах, сильный и способный флот всегда будет важнейшей основой национальной безопасности. Мы обязаны сделать всё возможное, чтобы восстановить могущество на море!"
 POR_strengthen_the_colonial_administration:0 "Укрепить колониальную администрацию"
 POR_strengthen_the_colonial_administration_desc:0 "Более половины населения проживает на многочисленных заморских территориях, и со временем эта доля будет лишь расти. Пока другие западные страны движутся к автономии и независимости колоний, мы должны и дальше превращать их в источник экономического роста и национального престижа."
 POR_strengthen_the_colonial_administration_tt:0 "Открывает оккупационный закон во всех §Yнеевропейских§! регионах:"
 POR_strengthen_the_colonial_administration_trigger:0 "Завершён фокус §YВопрос наших колоний§! без §Rухода§! из них"
 POR_develop_the_angolan_interior:0 "Развивать внутренние районы Анголы"
 POR_develop_the_angolan_interior_desc:0 "Ангола, как и многие наши колонии, остаётся крайне бедной. Если мы хотим сохранить контроль над этой огромной землёй, необходимо приблизить её экономику к уровню материковой Португалии."
 POR_develop_mozambique_r56:0 "Развивать Мозамбик"
 POR_develop_mozambique_r56_desc:0 "Мозамбик — самая населённая из наших колоний и остаётся крайне бедным, несмотря на доходы, которые приносит стране. Инвестиции в местную экономику принесут пользу всей стране и повысят лояльность нашему правлению."
 POR_mozambique_cash_crop_imports:0 "Импорт товарных культур из Мозамбика"
 POR_mozambique_cash_crop_imports_desc:0 "В [POR.GetAdjective]ом Мозамбике в изобилии выращивают товарные культуры, прежде всего хлопок, необходимый для производства текстиля военного и гражданского назначения. Импорт продовольствия из этой заморской территории также страхует нас от нехватки собственного урожая."
 POR_expand_overseas_recruitment:0 "Расширить набор в заморских территориях"
 POR_expand_overseas_recruitment_desc:0 "Заморские провинции, где проживает большая часть населения империи, могут стать основой национальной армии. Необходимо немедленно расширить набор местных жителей!"
 POR_bolster_the_colonial_garrison:0 "Усилить колониальные гарнизоны"
 POR_bolster_the_colonial_garrison_desc:0 "Нельзя позволить иностранным интриганам или местным восстаниям уничтожить наше мировое влияние. Колониальные гарнизоны должны оставаться профессиональной силой, использующей как местных, так и европейских солдат для сохранения глобального присутствия!"
 POR_unite_against_salazar:0 "Объединиться против Салазара"
 POR_unite_against_salazar_desc:0 "Режим Нового государства Салазара превратил все обещания Португальской республики в воплощение деспотизма и отсталости. Дальнейшее развитие Португалии возможно лишь после окончания его правления."
 POR_unite_against_salazar_tt:0 "Открывает решения §YВместе против Салазара§!"
 POR_together_against_salazar:0 "Вместе против Салазара!"
 POR_battle_nationalist_paramilitaries:0 "Бороться с националистическими военизированными формированиями"
 POR_battle_nationalist_paramilitaries_desc:0 "[POR.GetAdjective] Националистические полувоенные формирования представляют угрозу для всего, за что выступают наши обычные люди. Сокрушительные силы жестокости, которые хотят отправить Португалию назад, несомненно, окажут поддержку нашему делу!"
 POR_distribute_propaganda_pamphlets:0 "Распространять агитационные листовки"
 POR_distribute_propaganda_pamphlets_desc:0 "Даже слепому видны ужасы Нового государства, но необходимо ясно показать народу, что у нас есть решения. Следует покончить с монополией министерства пропаганды на агитацию."
 POR_call_for_general_strike:0 "Призвать к всеобщей забастовке"
 POR_call_for_general_strike_desc:0 "Настало время продемонстрировать силу против Салазара. Объединённые рабочие несомненно смогут свергнуть его правительство!"
 POR_seek_international_support:0 "Искать международную поддержку"
 POR_seek_international_support_desc:0 "Мы не одиноки в недовольстве Салазаром и его режимом. Необходимо сделать всё возможное, чтобы привлечь иностранные интересы на нашу сторону!"
 unlocks_decision_join_forces_with_the_spanish_popular_front_which_grants_tt:0 "Открывает решение §YОбъединить силы с Испанским народным фронтом§!, которое даёт:"
 POR_join_forces_with_the_spanish_popular_front:0 "Объединить силы с Испанским народным фронтом"
 POR_join_forces_with_the_spanish_popular_front_desc:0 "Испанское общество пожирает себя в ужасах гражданской войны, и у нас есть возможность вмешаться. Республика является законным и легитимным правительством Испании, и мы окажем ей помощь, необходимую для перелома хода войны!"
 POR_join_forces_with_the_spanish_popular_front_tt:0 "Если при завершении фокуса §YШтурмовать Национальное собрание§! в §YИспании§! идёт гражданская война, мы объединим с ней силы и получим следующие эффекты:"
 POR_join_forces_with_the_spanish_popular_front2_tt:0 "После завершения фокуса §YОбратиться к новой Испании§! мы получим возможность потребовать §Yаннексии Испании§!"
 unlocks_decision_request_soviet_assistance_which_grants_tt:0 "Открывает решение §YЗапросить советскую помощь§!, которое даёт:"
 POR_request_soviet_assistance:0 "Запросить советскую помощь"
 POR_request_soviet_assistance_tt:0 "Если §YСоветский Союз§! находится в состоянии мира, он будет склонен отправить §Yдобровольцев§! на нашу сторону в случае начала гражданской войны."
 portugal.46.t:0 "Португальские социалисты запрашивают советскую поддержку"
 portugal.46.d:0 "В последние дни представители нескольких португальских социалистических групп прибыли в Москву, чтобы договориться о советской поддержке их деятельности. Поддержка их режима укрепит влияние Москвы, но действительно ли их борьба заслуживает нашего участия?"
 portugal.46.a:0 "Когда придёт время, они получат нашу поддержку."
 POR_NKVD_activity:0 "Деятельность НКВД"
 POR_NKVD_activity_desc:0 "Агенты [SOV.GetAdjective]ого НКВД, несомненно, действуют в стране. Хотя они борются с врагами коммунизма, одновременно они угрожают нашему идеологическому единству и самой идее Народного фронта. Следует как можно скорее ограничить влияние НКВД."
 portugal.46.b:0 "У нас есть более важные заботы."
 POR_ally_anti_colonial_resistance:0 "Заключить союз с антиколониальным сопротивлением"
 POR_ally_anti_colonial_resistance_desc:0 "Наша многоконтинентальная империя созрела для национально-освободительной борьбы. Координация действий с колониальными повстанцами несомненно поможет сокрушить власть Салазара над Португалией."
 POR_ally_anti_colonial_resistance_tt:0 "Если начнётся §Yгражданская война§!, сопротивление значительно возрастёт во всех колониях и помешает противнику развернуть несколько дивизий."
 POR_storm_the_national_assembly:0 "Штурмовать Национальное собрание"
 POR_storm_the_national_assembly_desc:0 "Наконец мы можем свергнуть человека, ответственного за столько лет утраченного прогресса! Мы немедленно штурмуем Лиссабон, низложим Салазара и его реакционных союзников и построим Португалию будущего, которого заслуживаем!"
 POR_if_authoritarian_popularity_is_above_30_or_if_decision_join_forces_with_the_spanish_popular_front_has_been_completed_tt:0 "Если поддержка §gавторитаризма§! выше 30% или выполнено решение §YОбъединить силы с Испанским народным фронтом§!:"
 POR_storm_the_national_assembly_tt:0 "§RНачнётся гражданская война!§! Доля подразделений под нашим командованием будет зависеть от поддержки правящего правительства."
 portugal.45.t:0 "Штурм Национального собрания"
 portugal.45.d:0 "Сегодня для Португалии начинается новая эпоха. Португалия больше не будет захолустьем Западной Европы! Салазар больше не будет угнетать наш народ. Великому португальскому рабочему классу:"
 portugal.45.a:0 "Время вернуть нашу страну пришло!"
 portugal.81.a:0 "Мир и справедливость восторжествуют в стране!"
 POR_reactionary_resistance:0 "Реакционное сопротивление"
 POR_reactionary_resistance_desc:0 "Успехи на поле боя не могут полностью завоевать сердца народа. Реакционеры, прежде всего в сельской местности, по-прежнему глубоко презирают наше правление. Для устранения этой угрозы стабильности потребуются меры по развитию деревни или более жёсткие средства подавления."
 POR_divided_revolution:0 "Расколотая революция"
 POR_divided_revolution_desc:0 "Созданный нами Народный фронт глубоко расколот относительно будущего страны. Мы стоим на великом перепутье и должны действовать решительно, чтобы вернуть населению уверенность."
 POR_jose_mendes_dos_reis:0 "Жозе Мендеш душ Рейш"
 POR_armando_pereira_de_castro_agatao_lanca:0 "Арманду Перейра ди Каштру Агатан Ланса"
 POR_maintaining_the_fire:0 "Поддерживать пламя!"
 POR_maintaining_the_fire_desc:0 "Исчезновение Салазара из Португалии никогда не было единственной целью нашего дела. Теперь необходимо смотреть вперёд и действовать решительно, чтобы закрепить революционную власть над страной!"
 POR_answer_the_question_of_our_colonies:0 "Ответить на вопрос о колониях"
 POR_answer_the_question_of_our_colonies_desc:0 "Наша революция завершилась триумфом, и материк находится под контролем. Теперь необходимо заняться внутренними вопросами, главным из которых остаются колониальные владения в Африке и Азии. Следует ли покинуть эти давно удерживаемые территории?"
 POR_align_the_british_communist_alternative:0 "Поддержать британскую коммунистическую альтернативу"
 POR_align_the_british_communist_alternative_desc:0 "Британцы долгое время были нашими защитниками, а теперь и сами стремятся к истинным социалистическим идеалам. Вновь объединившись, Португалия и Британия никогда не будут разлучены!"
 POR_align_with_moscow:0 "Сблизиться с Москвой"
 POR_align_with_moscow_desc:0 "Несмотря на серьёзные разногласия по ряду ключевых вопросов, Советский Союз остаётся главной социалистической державой Европы. Будущее наших идеалов в Западной Европе зависит от укрепления связей с Москвой."
 POR_support_the_spanish_republic_r56:0 "Поддержать Испанскую республику"
 POR_support_the_spanish_republic_r56_desc:0 "Испанская республика ведёт борьбу за выживание против реакции и фашизма и нуждается в нашей помощи. Республика является законным правительством Испании, и мы будем сражаться на её стороне до конца!"
 iberian_pact:0 "Иберийский пакт"
 POR_support_the_spanish_republic_tt:0 "Открывает отправку добровольцев в любую §Yреспубликанскую Испанию§!, являющуюся §Yдемократической§! или §Yкоммунистической§!."
 POR_end_the_popular_front:0 "Распустить Народный фронт"
 POR_end_the_popular_front_desc:0 "После падения власти Салазара необходимо избежать фракционной борьбы, неизбежной в столь широком Народном фронте. Мы никогда не забудем вклад товарищей, но очевидно, что союз столь разных идеологий больше не может существовать."
 POR_grant_womens_suffrage:0 "Предоставить женщинам избирательное право"
 POR_grant_womens_suffrage_desc:0 "Столь крупное расширение электората может вызвать небольшую политическую нестабильность, но женщины страны являются огромной опорой, способной обеспечить народную поддержку!"
 POR_loosen_censorship_policies:0 "Ослабить цензуру"
 POR_loosen_censorship_policies_desc:0 "Авторитарные коммунисты в революционном комитете, подобно салазаристам, пытаются подорвать либеральные институты страны. Необходимо защитить политическую терпимость!"
 POR_the_question_of_our_colonies:0 "Вопрос о наших колониях"
 POR_the_question_of_our_colonies_desc:0 "Наша революция завершилась триумфом, и материк находится под контролем. Теперь необходимо заняться внутренними вопросами, главным из которых остаются колониальные владения в Африке и Азии. Следует ли покинуть эти давно удерживаемые территории?"
 portugal.47.t:0 "Вопрос о наших колониях"
 portugal.47.desc:0 "На протяжении нескольких столетий Португалия создавала обширную многоконтинентальную империю. После победы революции на родине мы должны ответить народу, намерены ли отказаться от огромных исторических владений."
 portugal.47.a:0 "Наше дело едино!"
 portugal.47.a_tt:0 "Если соответствующие регионы находятся под нашим контролем, §Rвсе начальные африканские колонии будут освобождены как независимые коммунистические страны§!."
 portugal.47.b:0 "Возможно, достаточно некоторой автономии?"
 portugal.47.b_tt:0 "Если соответствующие регионы находятся под нашим контролем, §Y[ANG.GetNameDef]§!, §Y[MZB.GetNameDef]§! и §Y[GNB.GetNameDef]§! станут нашими §Yпротекторатами§!."
 portugal.47.c:0 "Насчёт этого..."
 portugal.47.d:0 "Хм... нет."
 portugal.48.t:0 "Португалия покидает Макао"
 portugal.48.desc:0 "После вооружённого восстания по всей стране португальские колониальные войска покинули несколько разбросанных по миру портовых колоний. Как нам воспользоваться этой возможностью?"
 portugal.48.a:0 "Глупцы. Тогда мы войдём туда!"
 portugal.49.t:0 "Португалия покидает Гоа"
 portugal.50.t:0 "Португалия покидает Восточный Тимор"
 portugal.50.b:0 "Они нас не интересуют!"
 POR_address_the_new_spain:0 "Определить отношение к новой Испании"
 POR_address_the_new_spain_desc:0 "Испания, подобно нам, пережила ужасы войны и десятилетия внутренней борьбы за освобождение. Испанцам понадобятся годы на восстановление, а наша революция победила. Необходимо решить, как поступить с гораздо более крупным соседом."
 portugal.51.desc:0 "Испания, подобно нам, пережила ужасы войны и десятилетия внутренней борьбы ради ценностей, которые мы не разделяем. Испанцам понадобятся годы на восстановление, а наша власть укреплена. Необходимо решить, как поступить с гораздо более крупным соседом."
 portugal.51.t:0 "Вопрос новой Испании"
 portugal.51.a:0 "Вместе мы проявили невероятную решимость! Наш путь — общеиберийское единство!"
 portugal.51.b:0 "Следует развить уже построенную дружбу!"
 portugal.51.c:0 "Несмотря на разногласия, обеим сторонам выгодна нормализация отношений."
 portugal.51.d:0 "Эта «новая Испания» угрожает всему, за что мы боремся!"
 POR_annexes_and_gains_cores_on_all_spanish_states:0 "Аннексирует и получает национальные территории на всех §Y[SPR.GetAdjective]их§! регионах."
 portugal.52.t:0 "Португалия предлагает договор о дружбе и ненападении"
 portugal.52.d:0 "К нашему послу в Мадриде обратился его [POR.GetAdjective]ий коллега, сообщивший о желании страны заключить официальный договор о ненападении и взаимной обороне. Пока обстановка в Европе мрачнеет, что ответить давним друзьям из Лиссабона?"
 POR_pan_iberian_trade_r56:0 "Общеиберийская торговля"
 POR_pan_iberian_trade_r56_desc:0 "В интересах взаимного сотрудничества, [POR.GetAdjective] и [SPR.GetAdjective] Страны объединились во имя укрепления более тесных политических и экономических связей. Поскольку большая часть Европы движется к войне, у этих двух стран есть другие планы для своего региона."
 POR_pan_iberian_cooperation_r56:0 "Общеиберийское сотрудничество"
 POR_pan_iberian_cooperation_r56_desc:0 "В интересах взаимного сотрудничества, [POR.GetAdjective] и [SPR.GetAdjective] Страны объединились во имя укрепления более тесных политических и экономических связей. Поскольку большая часть Европы движется к войне, у этих двух стран есть другие планы для своего региона."
 portugal.52.a:0 "Разумеется! Закрепим уже построенную дружбу!"
 portugal.52.b:0 "Нас не интересуют их дела!"
 portugal.53.t:0 "Испанцы согласились на тесное сотрудничество!"
 portugal.53.d:0 "Испанский посол ответил на нашу просьбу и согласился, что взаимное сотрудничество на полуострове принесёт пользу обеим странам. Сегодня хороший день для мира."
 portugal.54.t:0 "Испанцы отказались!"
 portugal.54.d:0 "Испанский посол отклонил нашу просьбу о более тесном сотрудничестве. Это несомненно разочаровывает всех нас."
 portugal.55.t:0 "Португалия предлагает пакт о ненападении"
 portugal.55.d:0 "Португальский посол недавно обратился к своему коллеге в Мадриде с официальным предложением заключить пакт о ненападении и полностью нормализовать португало-испанские отношения. Что ответить братьям по полуострову?"
 portugal.55.a:0 "Разумеется! Избежать войны на полуострове отвечает интересам всех!"
 portugal.55.b:0 "Нас не интересуют их дела!"
 portugal.56.t:0 "Испанцы согласились!"
 portugal.56.a:0 "Прекрасные новости!"
 portugal.57.t:0 "Испанцы отказались!"
 portugal.57.a:0 "Прискорбно."
 portugal.74.title:0 "Португалия предлагает объединить полуостров"
 portugal.74.desc:0 "И мы, и Португалия победили в нашей борьбе за выживание против фашизма, призывы к единству между нашей нацией усилились. The [POR.GetAdjective] Иностранный посол при поддержке национального правительства предложил планы создания объединенного иберийского правительства. Который может противостоять фашизму во всем мире.\n\nЧто мы должны сказать нашим друзьям в Лиссабоне?"
 portugal.74.a:0 "После всего пережитого разве можем мы отказать боевым товарищам?"
 portugal.74.b:0 "Сейчас не время для союза, но мы расширим сотрудничество!"
 portugal.74.c:0 "Вы правда думаете, что всё контролируете?"
 portugal.75.title:0 "Государство [POR.GetNameDefCap] предлагает расширить оборонное сотрудничество"
 portugal.75.desc:0 "The [POR.GetAdjective] Недавно посол иностранных дел обратился к своему современнику в Мадриде с официальной просьбой расширить военное сотрудничество между нашими странами.\n\nПо мере того, как Европа становится все более кровавой за неделю, что мы должны сказать нашим друзьям в Лиссабоне?"
 portugal.75.a:0 "Подпишем полноценный союз! Враг одного станет врагом обоих!"
 portugal.75.b:0 "Пакт о взаимной обороне отвечает интересам обеих стран!"
 portugal.75.c:0 "Эти [POR.GetAdjective]ие амбиции не отвечают интересам Испании."
 portugal.76.title:0 "Государство [FROM.GetNameDefCap] соглашается"
 portugal.76.desc:0 "Государство [FROM.GetNameDefCap] официально ответило и обязалось полностью поддержать нас в военном отношении. Это прекрасный день для обеих стран."
 portugal.77.title:0 "Государство [FROM.GetNameDefCap] соглашается на более тесное сотрудничество"
 portugal.77.desc:0 "Государство [FROM.GetNameDefCap] официально ответило, что пока не готово к наступательному союзу, но поддерживает договор о взаимной обороне и тесное военное сотрудничество."
 POR_consolidate_the_revolution:0 "Укрепить революцию"
 POR_consolidate_the_revolution_desc:0 "Реакционные силы отбросили Португалию на десятилетия назад. Несмотря на победы, революция не восторжествует, пока мы навсегда не устраним любую угрозу реакции!"
 POR_reopen_the_national_propaganda_secretariat:0 "Вновь открыть Национальный секретариат пропаганды"
 POR_reopen_the_national_propaganda_secretariat_desc:0 "Даже после победы революции на поле боя необходимо сохранять бдительность, ведь угроза контрреволюции всё ещё существует!"
 POR_direcao_geral_de_seguranca:0 "Главное управление безопасности"
 POR_repurposing_the_spn:0 "Перепрофилирование SPN"
 POR_covert_return_to_the_world_stage:0 "Скрытно вернуться на мировую арену"
 POR_covert_return_to_the_world_stage_desc:0 "Находясь на западной оконечности Европы, мы можем стать оплотом коммунизма на континенте. Нельзя идти на компромисс в борьбе с тремя великими пороками Европы: империализмом, капитализмом и фашизмом!"
 POR_seek_an_alliance_with_spain_r56:0 "Заключить союз с Испанией"
 POR_seek_an_alliance_with_spain_r56_desc:0 "В последнее время португало-испанские отношения вновь процветают. Несомненно, мы можем пойти ещё дальше и расширить сотрудничество!"
 POR_diplomatic_pragmatism:0 "Дипломатический прагматизм"
 POR_diplomatic_pragmatism_desc:0 "Страна всё ещё восстанавливается после ужасов войны, поэтому необходимо осторожно относиться к иностранным делам, не отвечающим интересам государства [ROOT.GetNameDef]."
 POR_join_the_global_fight_against_fascism:0 "Присоединиться к мировой борьбе с фашизмом"
 POR_join_the_global_fight_against_fascism_desc:0 "Нельзя бездействовать, пока фашизм укореняется на континенте. До подходящего момента буржуазная демократия является необходимым злом и возможным союзником в борьбе против фашистской угрозы Европе!"
 POR_the_global_fight_against_fascism_r56:0 "Мировая борьба с фашизмом"
 POR_the_global_fight_against_fascism_r56_desc:0 "Нельзя бездействовать, пока фашизм укореняется на континенте. Пока это зло не будет уничтожено, мы станем сражаться до конца ради его полного искоренения!"
 POR_the_red_army_of_the_west:0 "Красная армия Запада"
 POR_the_red_army_of_the_west_desc:0 "Чтобы вновь занять место на мировой арене, необходимо превратить революционные бригады в современную централизованную армию. Красная армия показала убедительный пример."
 POR_the_red_army_of_the_west_tt:0 "Решения §YУсилить социалистические организации§! будут §Gулучшать§! этот национальный дух"
 POR_integrating_socialist_militias:0 "Интеграция социалистических ополчений"
 POR_integrating_socialist_militias_desc:0 "Мы интегрируем социалистические ополчения в свои силы. Процесс займёт время, но позволит создать армию, способную защищать новые социалистические ценности!"
 POR_protectors_of_the_revolution:0 "Защитники революции"
 POR_protectors_of_the_revolution_desc:0 "Вооружённые силы республики сильны, дисциплинированны и объединены под нашим идеологическим знаменем! Реакционеры и фашисты должны нас бояться, а народ видит в нас орудие своего освобождения!"
 POR_the_iberian_social_revolution:0 "Иберийская социальная революция"
 POR_the_iberian_social_revolution_desc:0 "Ещё до ужасного правления Нового государства Салазара Португалия на десятилетия отставала от других стран Западной Европы. Необходимо разрушить несправедливый порядок, уничтожить символы угнетения и пробудить новый революционный пыл в великом пролетариате!"
 unlocks_decision_promote_revolutionary_artwork_which_grants_tt:0 "Открывает решение §YПродвигать революционное искусство§!, которое даёт:"
 POR_promote_revolutionary_artwork:0 "Продвигать революционное искусство"
 POR_promote_revolutionary_artwork_desc:0 "Реакционеры полуострова всегда ненавидели всё, что бросает вызов ложному величию католицизма и колониализма. Новый Ренессанс охватит Европу, когда мы покажем миру истинные ценности нашей страны!"
 unlocks_decision_suppress_symbols_of_portuguese_aristocracy_which_grants_tt:0 "Открывает решение §YУничтожить символы [ROOT.GetAdjective]ой аристократии§!, которое даёт:"
 POR_suppress_symbols_of_portuguese_aristocracy:0 "Уничтожить символы [ROOT.GetAdjective]ой аристократии"
 POR_suppress_symbols_of_portuguese_aristocracy_desc:0 "Довольно! Народ больше никогда не будет скован символами реакционного прошлого. Мы начнём решительную кампанию против любых проявлений реакции."
 POR_crush_reactionary_impedance:0 "Сокрушить реакционное сопротивление"
 POR_crush_reactionary_impedance_desc:0 "[ROOT.GetAdjective] Демократы ничему не научились из недостатков и вялости демократии в Первой республике. Их планы в отношении Португалии являются обманом, который разрушит надежды на процветание, которые должна принести новая революция. Они и оставшиеся салазаристы должны быть отрезаны от нации любой ценой!"
 POR_empower_socialist_organizations:0 "Усилить социалистические организации"
 POR_empower_socialist_organizations_desc:0 "Молодежные движения являются основой для бесчисленных идеологий и правительств 20-го века.[ROOT.GetAdjective] Социалистические движения находятся далеко и близко от всех уголков Португалии. Они будут иметь поддержку, необходимую для того, чтобы наши идеи господствовали над нацией."
 unlocks_decision_tap_aligned_laborer_organizations_which_grants_tt:0 "Открывает решение §YИспользовать дружественные рабочие организации§!, которое даёт:"
 POR_tap_aligned_laborer_organizations:0 "Использовать дружественные рабочие организации"
 POR_tap_aligned_laborer_organizations_desc:0 "Организованные рабочие твёрдо поддерживают правительство. Использование этой опоры даст ресурсы, необходимые для укрепления власти."
 unlocks_decision_arm_anti_fascist_militias_which_grants_tt:0 "Открывает решение §YВооружить антифашистские ополчения§!, которое даёт:"
 POR_arm_anti_fascist_militias:0 "Вооружить антифашистские ополчения"
 POR_arm_anti_fascist_militias_desc:0 "Наша победа не заканчивается бегством или смертью Салазара. Пока существует угроза фашизма и реакции, антифашистские ополчения сохранят решимость. Мы обеспечим их всем необходимым для борьбы с врагами!"
 POR_arm_anti_fascist_militias_tt:0 "§GУбирает§! всю оставшуюся поддержку §Yавторитаризма§! и §Yфашизма§!"
 POR_towards_institutional_atheism:0 "К государственному атеизму"
 POR_towards_institutional_atheism_desc:0 "Положение церкви в политике государства [ROOT.GetName] неприемлемо. Необходимо положить конец её власти над рабочими!"
 POR_appropriate_church_riches:0 "Изъять богатства церкви"
 POR_appropriate_church_riches_desc:0 "Церковь не заслуживает экономических привилегий, которые государство предоставляло ей веками. Мы исправим эту несправедливость, лишив её богатств и направив их на укрепление страны!"
 unlocks_decision_stamp_out_clergy_influence_which_grants_tt:0 "Открывает решение §YИскоренить влияние духовенства§!, которое даёт:"
 POR_stamp_out_clergy_influence:0 "Искоренить влияние духовенства"
 POR_stamp_out_clergy_influence_desc:0 "Влияние организованной религии в [ROOT.GetAdjective]ом обществе угрожает сознанию народа. Мы примем решительные меры против клерикальной власти, веками подавлявшей рабочее общество!"
 POR_portugals_path_to_marxism_leninism:0 "Путь Португалии к марксизму-ленинизму"
 POR_portugals_path_to_marxism_leninism_desc:0 "Менее чем за двадцать лет Владимир Ленин превратил Россию из одной из самых отсталых стран Европы в оплот революции, которого боится Запад. Мы должны изучить и повторить его невероятные достижения."
 POR_portugals_path_to_socialism:0 "Путь Португалии к социализму"
 POR_solidify_the_economic_reforms:0 "Закрепить экономические реформы"
 POR_solidify_the_economic_reforms_desc:0 "Экономическая политика направила рабочих к процветанию и равенству. Пора поставить стабилизацию экономики на первое место и сформировать единый курс."
 POR_our_path_to_economic_development_decisions_taken_6_or_greater_tt:0 "Выполнено не менее §Y6§! решений §YНаш путь к экономическому развитию§! (Текущий прогресс: §Y[?POR_our_path_to_economic_development_decisions_taken]/6§!)"
 POR_socialist_market_economy:0 "Социалистическая рыночная экономика"
 POR_socialist_market_economy_desc:0 "Мы видели последствия жёсткой коллективизации и никогда не должны повторять их в нашей стране. Рыночная экономика пока является достаточной системой для развития инноваций и промышленного преобразования; было бы цинично считать, что в её рамках невозможно продвигать социалистические ценности."
 POR_the_portuguese_new_economic_policy:0 "Новая экономическая политика Португалии"
 POR_the_portuguese_new_economic_policy_desc:0 "Переход Советского Союза от военного коммунизма к ленинской новой экономической политике обеспечил поддержку аграрного общества России, необходимую для победы в гражданской войне. Нам ещё многое предстоит сделать для развития экономики, но НЭП уже доказала, что является прекрасной основой для будущего!"
 POR_the_red_industrial_revolution:0 "Красная промышленная революция"
 POR_the_red_industrial_revolution_desc:0 "Умеренной экономической политики недостаточно для стремительной индустриализации, необходимой в грядущей борьбе. Для создания социалистической промышленной экономики, нужной рабочим, требуется сильное централизованное планирование."
 POR_pave_the_path_to_progress:0 "Проложить путь к прогрессу"
 POR_pave_the_path_to_progress_desc:0 "Наше дело никогда не восторжествует окончательно, если сегодняшние победы станут очередным неизменным завтра. Мы должны обеспечить непрерывное движение Португалии вперёд!"
 POR_advance_the_cause_for_equality:0 "Продвигать дело равенства"
 POR_advance_the_cause_for_equality_desc:0 "Наши общественные взгляды позволяют заручиться широкой поддержкой [ROOT.GetAdjective]их женщин, особенно в городах. Следует воспользоваться этим и добиться подлинного прогресса на пути к равенству!"
 POR_forge_portugals_own_five_year_plan:0 "Создать собственный пятилетний план Португалии"
 POR_forge_portugals_own_five_year_plan_desc:0 "Века неудачной политики развития и тупая одержимость Салазара жёсткой экономией создали в португальской экономике условия, требующие решительного государственного вмешательства. Мы должны составить план, который обеспечит рабочим страны настоящее процветание!"
 POR_forge_portugals_own_five_year_plan_tt:0 "Открывает решения §YВопрос национализации§!"
 POR_the_question_of_nationalization:0 "Вопрос национализации"
 POR_the_question_of_nationalization_desc:0 "Мы много говорили о будущем экономическом преобразовании, но ещё не показали, какой именно будет наша политика. Чтобы завоевать народную поддержку, вскоре необходимо представить конкретные меры!"
 POR_transitioning_to_a_mixed_economy:0 "Переход к смешанной экономике"
 POR_transitioning_to_a_mixed_economy_desc:0 "Смешанная экономическая модель, поощряющая свободную хозяйственную деятельность и одновременно защищающая права народа, доказала свою эффективность и будет стимулировать инновации на всех уровнях."
 POR_slow_collectivization:0 "Постепенная коллективизация"
 POR_slow_collectivization_desc:0 "Умеренное вмешательство в экономику ради промышленного роста позволит быстро добиться прогресса, избежав потрясений, наблюдавшихся в других странах."
 POR_heavy_handed_central_planning:0 "Жёсткое централизованное планирование"
 POR_heavy_handed_central_planning_desc:0 "Жёсткое централизованное планирование позволит провести быстрые перемены, необходимые для индустриализации и укрепления прав рабочих. Несмотря на риск экономической нестабильности и кратковременного падения уровня жизни, в конечном счёте это окупится."
 POR_looming_economic_disaster:0 "Надвигающаяся экономическая катастрофа"
 POR_looming_economic_disaster_desc:0 "Наша экономическая политика зашла слишком далеко и серьёзно подрывает стабильность страны. Чтобы избежать краха правительства, необходимо отказаться от агрессивной коллективизации."
 POR_our_path_to_economic_development:0 "Наш путь к экономическому развитию"
 POR_our_path_to_economic_development_desc:0 "Проекты общественных работ являются разумным вложением, которое будет поддерживать растущую Португалию долгие годы. Расширение существующих и создание новых проектов принесёт пользу экономике и покажет, что мы являемся стабилизирующей силой для всей страны."
 POR_sell_off_seized_assets:0 "Продать конфискованные активы"
 POR_sell_off_seized_assets_desc:0 "Возможно, изъятие капиталистических активов зашло слишком далеко и нанесло ущерб экономической стабильности. Следует продать часть конфискованного имущества и направить средства на восстановление экономики."
 POR_support_private_collectives:0 "Поддержать частные коллективы"
 POR_support_private_collectives_desc:0 "Частные коллективы важны для экономического роста и обеспечения достойных условий труда. Следует поддержать дальнейшее создание подобных организаций."
 POR_land_redistribution:0 "Перераспределение земли"
 POR_land_redistribution_desc:0 "Землевладение в государстве [ROOT.GetNameDef] давно отличается вопиющим неравенством. Чтобы исправить эту несправедливость, необходимо принять радикальные меры по уравниванию земельной собственности в новой республике!"
 POR_restore_the_social_state:0 "Восстановить социальное государство"
 POR_restore_the_social_state_desc:0 "Салазар и его экономическая политика под предлогом жёсткой экономии уничтожили систему социальной защиты Португалии, угрожая уровню жизни всего населения. Необходимо немедленно обратить этот процесс!"
 POR_subsidize_rural_farming:0 "Субсидировать сельское хозяйство"
 POR_subsidize_rural_farming_desc:0 "Фермеры являются основой [ROOT.GetAdjective]ой экономики и нуждаются в нашей поддержке. Мы должны предоставить им ресурсы для модернизации хозяйств и повышения урожайности!"
 POR_invest_in_public_education:0 "Инвестировать в государственное образование"
 POR_invest_in_public_education_desc:0 "Ради будущего страны необходимо продолжить финансирование образования молодёжи государства [ROOT.GetNameDef]. Даже небольшие вложения ради практически полного искоренения неграмотности являются благородной целью."
 POR_end_the_educational_abyss:0 "Покончить с образовательной пропастью"
 POR_end_the_educational_abyss_desc:0 "Мы больше не можем мириться с тем, что Португалия остаётся одной из самых неграмотных стран Европы. Инвестиции в государственное образование необходимы, если мы хотим присоединиться к другим странам западного мира."
 POR_escalate_the_industrialization:0 "Ускорить индустриализацию"
 POR_escalate_the_industrialization_desc:0 "Позорно, что, несмотря на разграбление мира и прежний статус континентальной державы, мы всё ещё на столетие отстаём от Британии и Германии в промышленном развитии. Мы никогда не станем современной страной, если продолжим терпеть эту отсталость!"
 POR_factory_recruitment_drive:0 "Кампания по набору фабричных рабочих"
 POR_factory_recruitment_drive_desc:0 "Фабрики военной промышленности остро нуждаются в рабочих. Мы развернём масштабную кампанию по набору персонала и обеспечим оружейные предприятия людьми, необходимыми для увеличения производства!"
 unlocks_decision_direct_farmland_to_industrial_projects_which_grants_tt:0 "Открывает решение §YПередать сельскохозяйственные земли промышленным проектам§!, которое даёт:"
 POR_direct_farmland_to_industrial_projects:0 "Передать сельскохозяйственные земли промышленным проектам"
 POR_direct_farmland_to_industrial_projects_desc:0 "Суровая правда заключается в том, что сельское хозяйство как главный источник дохода осталось в прошлом. Чтобы стать по-настоящему развитой индустриальной страной, необходимо ограничить использование жизненно важных земель ради ускорения промышленного роста."
 POR_prepare_for_a_war_of_annihilation:0 "Подготовиться к войне на уничтожение"
 POR_prepare_for_a_war_of_annihilation_desc:0 "Нет сомнений, что западные державы замышляют наше уничтожение. Мы должны подготовить страну к защите революционных ценностей!"
 POR_restore_civil_liberties:0 "Восстановить гражданские свободы"
 POR_restore_civil_liberties_desc:0 "Мы не свергали Салазара в кровавой революции ради новой тирании. Необходимо дать рабочим великой страны то, чего они действительно заслуживают: свободу и справедливость!"
 POR_portugals_road_to_democracy:0 "Путь Португалии к демократии"
 POR_portugals_road_to_democracy_desc:0 "Было бы недопустимой трагедией, если борьба против тирании Салазара завершится созданием нового жестокого режима. Мы должны построить правительство, действительно принадлежащее народу, который так упорно боролся за наше дело!"
 POR_restore_civil_liberties_tt:0 "Открывает решения §YВосстановление гражданских свобод§!"
 unlocks_decision_foment_peace_with_the_church_which_grants_tt:0 "Открывает решение §YДобиться примирения с церковью§!, которое даёт:"
 POR_foment_peace_with_the_church:0 "Добиться примирения с церковью"
 POR_foment_peace_with_the_church_desc:0 "Отношения между католической церковью и [ROOT.GetAdjective]ими республиканскими правительствами редко были плодотворными. Сейчас лучший момент для урегулирования разногласий и предоставления каждому человеку права самостоятельно определять роль религии в своей жизни."
 POR_foment_peace_with_the_church_flag:0 "Выполнено решение §YДобиться примирения с церковью§!"
 POR_curb_political_militias:0 "Ограничить политические ополчения"
 POR_curb_political_militias_desc:0 "Деятельность политических ополчений угрожала и продолжит угрожать стабильности страны, пока мы не положим ей конец. После победы революции на родине настало время действовать."
 POR_unity_and_reconciliation:0 "Единство и примирение"
 POR_unity_and_reconciliation_desc:0 "Нельзя позволить расколам Первой республики вновь разорвать страну. Необходимо продвигать солидарность и единство и немедленно уничтожить противоречия, взращённые Салазаром!"
 POR_end_the_political_trials:0 "Прекратить политические процессы"
 POR_end_the_political_trials_desc:0 "Продолжение политических процессов лишь усиливает раскол между революционерами и теми, чьи обоснованные жалобы когда-то способствовали возвышению Салазара. Чтобы положить конец поляризации общества, необходимо прекратить суды, настраивающие народ друг против друга."
 unlocks_decision_call_for_reconciliation_which_grants_tt:0 "Открывает решение §YПризвать к примирению§!, которое даёт:"
 POR_call_for_reconciliation:0 "Призвать к примирению"
 POR_call_for_reconciliation_desc:0 "Чтобы восстановить гражданские свободы и положить конец политическому насилию, необходимо выступить против всех сторон, призывающих к мести и расправе. Мир — лучший путь вперёд, и народ должен узнать эту истину!"
 POR_hold_fair_elections:0 "Провести честные выборы"
 POR_hold_fair_elections_desc:0 "Наконец настало время вернуть Португалию к демократии. Мы больше не можем откладывать предоставление народу заслуженных прав!"
 POR_loosen_censorship_policies_flag:0 "Выполнено решение §YОслабить цензуру§!"
 POR_end_the_political_trials_flag:0 "Выполнено решение §YПрекратить политические процессы§!"
 portugal.58.t:0 "Всеобщие [ROOT.GetAdjective]ие выборы [GetYear] года"
 portugal.58.d:0 "После более чем десятилетия диктатуры и ещё более долгих лет политического хаоса и неопределённости сомнений быть не может: сегодня настало время принести народу Португалии настоящую свободу. Главными кандидатами на пост премьер-министра являются:\n\nЖозе Нортон ди Матуш — бывший военный министр и верховный комиссар Анголы. Он является политическим умеренным, который поставит на первое место либерализм и верховенство закона, в основном отказавшись от социалистической экономической политики.\n\nЖозе Домингеш душ Сантуш — бывший премьер-министр времён Первой республики, занимавший множество других высоких должностей в республиканских правительствах. Подобно Матушу, он будет укреплять демократические институты, но также сохранит сильное социальное государство и трудовые реформы, отказавшись от принудительной национализации и других радикальных мер.\n\nБенту Антониу Гонсалвеш — действующий генеральный секретарь Коммунистической партии, сыгравший важную роль в свержении Салазара. Несмотря на многолетнюю поддержку авторитарного социализма, на волне демократических реформ он показал готовность проводить преобразования через такую систему. Его экономический курс, вероятно, в основном сохранится, однако политический баланс и скорость социалистического перехода остаются неопределёнными.\n\nОтвет должен дать народ Португалии. Кто поведёт нас в новый золотой век?"
 portugal.58.a:0 "Матуш и его непоколебимая преданность стране создадут светлое будущее!"
 portugal.58.b:0 "Опыт прекрасного управления Сантуша поведёт Португалию вперёд!"
 portugal.58.c:0 "Красная демократия Гонсалвеша создаст народу светлое будущее!"
 POR_restore_economic_stability:0 "Восстановить экономическую стабильность"
 POR_restore_economic_stability_desc:0 "Пора отказаться от радикальных и дестабилизирующих реформ. Наш путь вперёд — построение действительно справедливой экономики, улучшающей положение рабочих!"
 POR_our_path_to_economic_development_decisions_taken_4_or_greater_tt:0 "Выполнено не менее §Y4§! решений §YНаш путь к экономическому развитию§! (Текущий прогресс: §Y[?POR_our_path_to_economic_development_decisions_taken]/4§!)"
 POR_upgrades_the_effects_of_all_our_path_to_economic_development_decisions_tt:0 "§GУлучшает§! эффекты всех решений §YНаш путь к экономическому развитию§!."
 POR_portuguese_mixed_economy:0 "Португальская смешанная экономика"
 POR_portuguese_mixed_economy_desc:0 "Хотя экономика Нового государства не служила интересам рабочих, необходимо признать области, в которых режим добился успеха. Стабильная экономика, предоставляющая определённое вознаграждение наиболее продуктивным, важна для национального развития."
 POR_democratic_collectivization:0 "Демократическая коллективизация"
 POR_democratic_collectivization_desc:0 "Хотя многие революционные товарищи действуют слишком жёстко, очевидно, что для вывода государства [ROOT.GetNameDef] на жизнеспособный экономический путь требуются решительные меры. Сильная централизованно планируемая экономика необходима для достижения промышленных целей и защиты прав рабочих."
 POR_accommodate_europes_balance_of_power:0 "Учитывать европейский баланс сил"
 POR_accommodate_europes_balance_of_power_desc:0 "Несмотря на работу, проделанную в Версале, реваншистский экспансионизм стал внешней политикой слишком многих стран. Любой порядок на континенте, каким бы хрупким он ни был, необходимо защищать любой ценой."
 POR_merit_above_ideology:0 "Заслуги выше идеологии"
 POR_merit_above_ideology_desc:0 "Мир стремительно покидает Европу, и Португалия должна быть готова. Хотим мы того или нет, защита страны важнее дальнейшей политизации вооружённых сил."
 POR_restoring_the_portuguese_armed_forces:0 "Восстановление [ROOT.GetAdjective]их вооружённых сил"
 unlocks_decision_expand_civil_amnesty_which_grants_tt:0 "Открывает решение §YРасширить гражданскую амнистию§!, которое даёт:"
 POR_expand_civil_amnesty:0 "Расширить гражданскую амнистию"
 unlocks_decision_reintegrate_former_officers_which_grants_tt:0 "Открывает решение §YВернуть бывших офицеров на службу§!, которое даёт:"
 POR_reintegrate_former_officers:0 "Вернуть бывших офицеров на службу"
 POR_reintegrate_former_officers_flag:0 "Выполнено решение §YВернуть бывших офицеров на службу§!"
 POR_depoliticized_military:0 "Деполитизированная армия"
 POR_western_europes_model_democracy:0 "Образцовая демократия Западной Европы"
 POR_western_europes_model_democracy_desc:0 "Всего за несколько лет мы превратили государство [Root.GetNameDef] из захолустья Западной Европы в современную демократию, защищающую гражданские свободы и баланс сил. Мы стали сияющим светом среди тьмы континента!"
 POR_red_tinted_democracy:0 "Красная демократия"
 POR_red_tinted_democracy_desc:0 "Всего за несколько лет мы превратили государство [Root.GetNameDef] из захолустья Западной Европы в современную демократию, защищающую простого человека. Мы станем примером для всех, кто страдает под властью реакционных диктатур!"
 POR_rehabilitate_the_armed_forces:0 "Реабилитировать вооружённые силы"
 POR_rehabilitate_the_armed_forces_desc:0 "Укрепление революции не должно сорваться из-за слабого контроля над офицерским корпусом. Мы не остановимся, пока все угрожающие нашим идеалам не будут отстранены от власти!"
 POR_protectors_of_portuguese_democracy:0 "Защитники [ROOT.GetAdjective]ой демократии"
 POR_protectors_of_portuguese_democracy_desc:0 "The [ROOT.GetAdjective] Вооруженные силы должны стать в значительной степени аполитичной силой, которая будет вмешиваться только в государство для защиты наших демократических ценностей. Антидемократические действия сил любой идеологии не могут быть успешными до тех пор, пока знамёна наших вооружённых сил пролетают сквозь наше небо!"
 unlocks_decision_demand_oaths_of_loyalty_which_grants_tt:0 "Открывает решение §YПотребовать клятвы верности§!, которое даёт:"
 POR_demand_oaths_of_loyalty:0 "Потребовать клятвы верности"
 POR_demand_oaths_of_loyalty_desc:0 "Реакционеры в вооружённых силах мешают их работе. Необходимо обеспечить распространение революционных идеалов в военных учреждениях. Все, кто способен угрожать революции, должны немедленно принести клятву верности."
 unlocks_decision_demand_oaths_of_loyalty_which_grants_tt:0 "Открывает решение §YПодавить контрреволюционное инакомыслие§!, которое даёт:"
 POR_clamp_down_on_anti_revolutionary_dissent:0 "Подавить контрреволюционное инакомыслие"
 POR_clamp_down_on_anti_revolutionary_dissent_desc:0 "Среди вооружённых сил всё ещё широко распространено недовольство революцией. Необходимо приложить больше усилий для укрепления контроля над этими важнейшими институтами национальной обороны."
 unlocks_decision_clamp_down_on_anti_democratic_leftists_which_grants_tt:0 "Открывает решение §YПодавить антидемократических левых§!, которое даёт:"
 POR_clamp_down_on_anti_democratic_leftists:0 "Подавить антидемократических левых"
 POR_clamp_down_on_anti_democratic_leftists_desc:0 "Инакомыслие в армии может серьёзно угрожать стабильности страны, поскольку различные антидемократические силы захватывают отдельные части вооружённых сил. Необходимо обеспечить поддержку верховенства закона и либерализма в армии."
 POR_army_of_the_revolution:0 "Армия революции"
 POR_army_of_the_revolution_desc:0 "Вооружённые силы страны превратились в стойких защитников народной революции. Пока над нами развеваются армейские знамёна, реакционеры и фашисты больше никогда не смогут развязать успешную гражданскую войну!"
 POR_modernize_the_junta_institutions:0 "Модернизировать институты хунты"
 POR_modernize_the_junta_institutions_desc:0 "Чтобы восстановить положение среди европейских стран, необходимо продолжить переход к свободному гражданскому правительству."
 unlocks_decision_a_new_status_for_the_colonies_which_grants_tt:0 "Открывает решение §YНовый статус колоний§!, которое даёт:"
 POR_a_new_status_for_the_colonies:0 "Новый статус колоний"
 POR_a_new_status_for_the_colonies_desc:0 "Хотя мы добились впечатляющей языковой интеграции и создали в колониях многочисленное цивилизованное население метисов, необходимо признать провалы цивилизаторской миссии. Переход к подлинной автономии колоний, по крайней мере временно, является единственным способом сохранить власть над этими отдалёнными и густонаселёнными заморскими провинциями."
 POR_organize_guinean_provincial_elections:0 "Организовать провинциальные выборы в Гвинее"
 POR_organize_mozambican_provincial_elections:0 "Организовать провинциальные выборы в Мозамбике"
 POR_organize_angolan_provincial_elections:0 "Организовать провинциальные выборы в Анголе"
 POR_create_a_constitutional_judiciary:0 "Создать конституционную судебную систему"
 POR_create_a_constitutional_judiciary_desc:0 "После укрепления революции необходимо обеспечить сохранность либеральных институтов. Аполитичный суд, занимающийся толкованием законов, поможет разрешать споры, которые иначе поглотили бы Национальное собрание."
 POR_continue_popular_reform:0 "Продолжить народные реформы"
 POR_continue_popular_reform_desc:0 "Укрепление нашей власти и, что важнее, [ROOT.GetAdjective]ой демократии не должно осуществляться под дулом пистолета. Подлинная поддержка народа — лучший путь вперёд!"
 POR_fortify_portuguese_democracy:0 "Укрепить [ROOT.GetAdjective]ую демократию"
 POR_fortify_portuguese_democracy_desc:0 "Наша революционная демократия не первая в истории Португалии. Необходимо продолжать защищать новые ценности."
 POR_continue_salazars_policies:0 "Продолжить политику Салазара"
 POR_continue_salazars_policies_desc:0 "Несмотря на десятилетия нестабильности и ужасные последствия Великой депрессии, Новое государство Салазара принесло стране политические и экономические успехи. Нам ещё многое предстоит сделать, но Салазар уже доказал, что под его мудрым руководством страна процветает лучше всего!"
 POR_deus_patria_e_familia:0 "Deus, Pátria e Família"
 POR_deus_patria_e_familia_desc:0 "Несмотря на десятилетия нестабильности и ужасные последствия Великой депрессии, Новое государство Салазара принесло стране политические и экономические успехи. Нам ещё многое предстоит сделать, но Салазар уже доказал, что под его мудрым руководством страна процветает лучше всего!"
 unlocks_decision_support_the_spanish_nationalists_which_grants_tt:0 "Открывает решение §YПоддержать испанских националистов§!, которое даёт:"
 POR_support_the_spanish_nationalists_aut:0 "Поддержать испанских националистов"
 POR_support_the_spanish_nationalists_aut_desc:0 "Испанское общество с каждым днём всё глубже погружается в хаос. Возникновение социалистического государства на Иберийском полуострове недопустимо, и чем дольше мы бездействуем, тем реальнее становится эта угроза. Помощь националистам в их справедливой борьбе прагматична и логична!"
 POR_support_the_spanish_nationalists_tt:0 "Открывает отправку добровольцев в любую §Yнационалистическую Испанию§!, являющуюся §Yавторитарной§! или §Yфашистской§!."
 POR_found_the_portuguese_legion:0 "Основать Португальский легион"
 POR_found_the_portuguese_legion_desc:0 "Долгая нестабильность [ROOT.GetAdjective]ой политики показала необходимость государственной организации для самых преданных сторонников режима. При нашей поддержке Португалия получит собственный фрайкор против красной угрозы!"
 POR_the_portuguese_legion:0 "Португальский легион"
 POR_the_portuguese_legion_desc:0 "Португальский легион — военизированная организация, созданная Новым государством Салазара для защиты духовного наследия нации и борьбы с левым насилием, угрожающим народу. Тесно сотрудничая с тайной полицией, он является одним из главных оплотов власти Салазара над страной."
 POR_employ_the_propaganda_secretariat:0 "Задействовать Секретариат пропаганды"
 POR_employ_the_propaganda_secretariat_desc:0 "Национальный секретариат пропаганды Португалии способен стать решающей силой против всех врагов режима. Следует предоставить ему ресурсы, необходимые для успеха."
 unlocks_decision_incite_fearmongering_which_grants_tt:0 "Открывает решение §YРазжигать страх§!, которое даёт:"
 POR_incite_fearmongering:0 "Разжигать страх"
 POR_incite_fearmongering_desc:0 "Прячьте детей и семьи, ибо предатели стоят на пути к нашему процветанию! Только преданность делу способна остановить большевистскую угрозу всем ценностям, за которые мы боремся!"
 POR_propagandize_success_by_the_regime:0 "Пропагандировать успехи режима"
 POR_propagandize_success_by_the_regime_desc:0 "Всего за несколько лет государство [ROOT.GetNameDef] превратилось из нестабильной и глубоко задолжавшей страны в образец превосходного и умеренного управления. Народ должен узнать об этих победах!"
 POR_extend_PVDE_security_duties:0 "Расширить полномочия PVDE"
 POR_extend_PVDE_security_duties_desc:0 "Либералы, синдикалисты и небольшие монархические группировки ясно показали нежелание сотрудничать с нашими планами. Прежде чем политическая ситуация вновь погрузится в безумие, PVDE должна решительно действовать против этих сил нестабильности."
 POR_cooperation_with_the_armed_forces:0 "Сотрудничество с вооружёнными силами"
 POR_cooperation_with_the_armed_forces_desc:0 "Продолжающаяся реорганизация принесла успех и обеспечила верность вооружённых сил. С ними и бдительными руководителями PVDE на нашей стороне у врагов Нового государства нет шансов!"
 unlocks_decision_send_in_the_army_which_grants_tt:0 "Открывает решение §YВвести армию§!, которое даёт:"
 POR_send_in_the_army:0 "Ввести армию"
 POR_send_in_the_army_desc:0 "Революционные ополчения отравляют повседневную жизнь народа и угрожают стране. При необходимости армию можно призвать для разгона организаций, прибегающих к насилию."
 POR_silence_militant_revolutionaries:0 "Заставить воинствующих революционеров замолчать"
 POR_silence_militant_revolutionaries_desc:0 "Ситуация складывается в нашу пользу, поэтому следует усилить применение силы против синдикалистов, иностранных марионеток и всех прочих угроз стабильности режима!"
 POR_ligering_republican_unrest:0 "Сохраняющееся республиканское недовольство"
 POR_ligering_republican_unrest_desc:0 "Хотя их влияние всё ещё ощущается в обществе, нестабильность и угроза режиму со стороны недовольных социалистов значительно ослабли. Наконец можно провозгласить восстановление стабильности."
 POR_utilize_the_budget_surplus:0 "Использовать профицит бюджета"
 POR_utilize_the_budget_surplus_desc:0 "Благодаря мудрой финансовой политике мы создали профицит бюджета, который можно вложить в процветание Португалии. Следует вознаградить верных граждан за все наши достижения!"
 POR_fight_price_instability:0 "Бороться с нестабильностью цен"
 POR_fight_price_instability_desc:0 "Чтобы сохранять популярность среди различных классов общества, необходимо продолжить решительные меры против угрозы ценовой нестабильности."
 POR_push_forward_modest_social_benefits:0 "Ввести умеренные социальные пособия"
 POR_push_forward_modest_social_benefits_desc:0 "Часть финансового профицита следует вложить в скромное социальное государство, продвигающее ценности режима."
 POR_support_for_portuguese_landowners:0 "Поддержать [ROOT.GetAdjective]их землевладельцев"
 POR_support_for_portuguese_landowners_desc:0 "Португальская аристократия давно остаётся верной режиму и служит источником доходов для масштабных общественных работ. Следует вознаградить её лояльность, подтвердив, что мы не намерены нарушать выгодный статус-кво."
 POR_limited_economic_populism:0 "Ограниченный экономический популизм"
 POR_limited_economic_populism_desc:0 "Чтобы режим сохранял народную поддержку на фоне распространения социалистических идей на Иберийском полуострове, необходимо исполнить часть обещаний рабочему классу. Мы не станем разрушать основы экономики, но можем предоставить больше благ верным и стойким гражданам."
 POR_expand_ministerial_control:0 "Расширить министерский контроль"
 POR_expand_ministerial_control_desc:0 "Наше мудрое правление принесло Португалии стабильность, невиданную со времён республики. Даже если это вызовет внутреннее сопротивление, необходимо немедленно расширить влияние, чтобы вознаграждать верных и сокрушать всех предателей Португалии."
 POR_tighten_the_regime:0 "Ужесточить режим"
 POR_tighten_the_regime_desc:0 "Используя открывшуюся возможность, следует укрепить власть и сокрушить оставшуюся оппозицию."
 unlocks_decision_crush_lingering_leftist_opposition_which_grants_tt:0 "Открывает решение §YСокрушить оставшуюся левую оппозицию§!, которое даёт:"
 unlocks_decision_make_examples_of_the_opposition_which_grants_tt:0 "Открывает решение §YПоказательно наказать оппозицию§!, которое даёт:"
 POR_make_examples_of_the_opposition:0 "Показательно наказать оппозицию"
 POR_make_examples_of_the_opposition_desc:0 "Междоусобицы, призывы к насилию и свержению порядка, который мы с таким трудом установили, — разве за это должен бороться наш народ? Для процветания стране нужны лишь умеренность и стабильность!"
 POR_crush_lingering_leftist_opposition_AUT:0 "Сокрушить оставшуюся левую оппозицию"
 POR_crush_lingering_leftist_opposition_AUT_desc:0 "Угроза [ROOT.GetAdjective]ому народу со стороны социализма с каждым днём ослабевает, но это не значит, что её можно терпеть. Победа близка, и необходимо удвоить усилия, прежде чем эти глупцы успеют перегруппироваться!"
 POR_modernize_our_security_apparatus:0 "Модернизировать аппарат безопасности"
 POR_modernize_our_security_apparatus_desc:0 "Будь то MI6, НКВД или антиколониальные повстанческие организации, для такой страны, как наша, всё важнее иметь инфраструктуру безопасности, способную выявлять и уничтожать угрозы национальной безопасности."
 POR_strengthen_the_portuguese_youth:0 "Укрепить Португальскую молодёжь"
 POR_strengthen_the_portuguese_youth_desc:0 "Португальская молодёжь является важным ответвлением Португальского легиона и помогает воспитывать культуру верности и преданности стране. Следует укрепить организацию и уменьшить её сходство с иностранными образцами."
 POR_francisco_jose_nobre_guedes:0 "Francisco José Nobre Guedes"
 POR_secretariat_of_national_information:0 "Секретариат национальной информации"
 POR_secretariat_of_national_information_desc:0 "На фоне роста пропаганды как инструмента подрыва независимости стран нам необходим собственный институт, готовый защищать достижения Нового государства."
 POR_government_of_national_consensus:0 "Правительство национального согласия"
 POR_government_of_national_consensus_desc:0 "Благодаря решительным действиям и приверженности политике согласия мы добились народной поддержки, необходимой для окончательного закрепления нашей справедливой власти над Португалией."
 POR_does_not_have_national_spirit_disgruntled_republicans_tt:0 "Нет национального духа §YНедовольные республиканцы§!"
 POR_solidify_popular_support:0 "Закрепить народную поддержку"
 POR_solidify_popular_support_desc:0 "Мы пользуемся большой верностью вооружённых сил и внутренних группировок, но должны продолжать политику, укрепляющую народную поддержку по всей Португалии."
 POR_promote_national_catholicism:0 "Продвигать национальный католицизм"
 POR_promote_national_catholicism_desc:0 "Католическая идентичность Португалии важна для простого народа. Пока атеистические режимы разрушают руководящие принципы своих обществ, мы останемся верны ценностям, направляющим наших граждан!"
 unlocks_decision_seek_concordat_with_the_holy_see_which_grants_tt:0 "Открывает решение §YЗаключить конкордат со Святым престолом§!, которое даёт:"
 POR_seek_concordat_with_the_holy_see:0 "Заключить конкордат со Святым престолом"
 POR_seek_concordat_with_the_holy_see_desc:0 "Католицизм остаётся чрезвычайно важным в жизни [ROOT.GetAdjective]ого народа. Присоединившись к таким странам, как Италия, Югославия и Австрия, заключившим конкордат с Ватиканом, мы значительно укрепим легитимность режима."
 unlocks_decision_embrace_pluricontinentalism_which_grants_tt:0 "Открывает решение §YПринять плюриконтинентализм§!, которое даёт:"
 POR_embrace_pluricontinentalism_aut:0 "Принять плюриконтинентализм"
 POR_embrace_pluricontinentalism_aut_desc:0 "Африканские колонии давно имеют жизненно важное значение для [ROOT.GetAdjective]ой экономики, а наша цивилизаторская миссия добилась больших успехов в распространении португальского языка и других символов исключительной культуры. Чтобы сохранить эти источники невероятного престижа, следует принять плюриконтинентальную идентичность и продвигать идею, что жители африканских колоний способны стать такими же [ROOT.GetAdjective]ими гражданами."
 POR_long_term_economic_planning:0 "Долгосрочное экономическое планирование"
 POR_long_term_economic_planning_desc:0 "Великая депрессия в основном завершилась, а стабильность в Португалии восстановлена. Теперь необходимо проводить политику, которая выведет страну вперёд и даст народу заслуженное вознаграждение за неизменную стойкость."
 POR_tackle_demands_from_urban_centers:0 "Удовлетворить требования городских центров"
 POR_tackle_demands_from_urban_centers_desc:0 "Чтобы сохранять приемлемую поддержку городов, следует предоставить им необходимое для успеха и престижа страны."
 POR_protectors_of_the_countryside:0 "Защитники сельской местности"
 POR_protectors_of_the_countryside_desc:0 "Величайшим преступлением ранней Португальской республики было оставление скромных фермеров на произвол хаотичной политики, сосредоточенной на городах, и нежелательной секуляризации. Мы поставим интересы великого сельского класса во главу экономической политики!"
 POR_protectors_of_the_countryside_tt:0 "§GУлучшает§! эффекты §YСубсидировать сельское хозяйство§! и §YМатеринская социальная помощь§!"
 POR_plan_for_popular_education:0 "План народного образования"
 POR_plan_for_popular_education_desc:0 "Нет разумной причины, по которой бывшая великая держава и богатая страна Западной Европы должна иметь уровень грамотности, на столетие отстающий от Британии или Германии. Необходимо принять разумный, но решительный план, чтобы обеспечить всей Португалии базовый уровень образования и грамотности!"
 POR_evaluate_the_changing_global_order:0 "Оценить меняющийся мировой порядок"
 POR_evaluate_the_changing_global_order_desc:0 "Мировой порядок стремительно распадается под влиянием радикализма и экспансионизма. Чтобы Португалия была готова к грядущим испытаниям, необходимо сохранять осторожность и прагматизм."
 POR_evaluate_the_changing_global_order_tt:0 "Открывает решения §YОпределить отношение к новой Испании§!"
 unlocks_decision_come_to_britains_aid_which_grants_tt:0 "Открывает решение §YПрийти на помощь Британии!§!, которое даёт:"
 POR_come_to_britains_aid:0 "Прийти на помощь Британии!"
 POR_come_to_britains_aid_desc:0 "Британцы долгое время были нашими защитниками и будут нуждаться в помощи в грядущих испытаниях. Мы сделаем всё возможное для поддержки давних друзей!"
 POR_come_to_britains_aid_dem_desc:0 "Британцы долгое время были нашими защитниками и являются величайшими защитниками наших ценностей. Давние друзья получат безоговорочную поддержку против волны радикализма, поглощающей континент!"
 unlocks_decision_contain_JAP_which_grants_tt:0 "Открывает решение §YСдержать государство [JAP.GetNameDef]!§!, которое даёт:"
 POR_contain_JAP:0 "Сдержать государство [JAP.GetNameDef]"
 POR_contain_JAP_desc:0 "Японский экспансионизм в Восточной Азии становится серьёзной угрозой региональному миру и выживанию нашего заморского присутствия. Необходимо принять ключевые меры для сдерживания этой угрозы."
 POR_expand_military_cooperation_with_the_spanish_r56:0 "Расширить военное сотрудничество с [SPA.GetAdjective]"
 POR_expand_military_cooperation_with_the_spanish_r56_desc:0 "В последнее время португало-испанские отношения вновь процветают. Несомненно, мы можем пойти ещё дальше и расширить сотрудничество!"
 POR_portugal_first:0 "Португалия превыше всего!"
 POR_portugal_first_desc:0 "Величайшей ошибкой Португалии в XX веке стало катастрофическое вступление в Великую войну, приведшее к невообразимой нестабильности и падению гражданского правительства Кошты. Новое государство не умрёт как собака!"
 POR_expand_the_resource_trade:0 "Расширить торговлю ресурсами"
 POR_expand_the_resource_trade_desc:0 "Мы можем получить огромную выгоду от военных потребностей различных европейских держав. Следует сохранить экономику открытой для стран, отчаянно нуждающихся в наших ресурсах."
 POR_embrace_the_capital_of_espionage:0 "Принять роль столицы шпионажа"
 POR_embrace_the_capital_of_espionage_desc:0 "Лиссабон стал домом для множества агентов иностранных держав, которых дела других стран интересуют больше португальских. Пока их деятельность не угрожает национальной безопасности, следует терпеть иностранное присутствие и извлекать из него уроки."
 POR_reenter_international_affairs:0 "Вернуться в международные дела"
 POR_reenter_international_affairs_desc:0 "Величайшей ошибкой Португалии во время Великой войны была слабая дипломатия правительства, завершившаяся неподготовленным вступлением в конфликт. Необходимо быть готовыми и немедленно вернуться на мировую арену!"
 POR_integrate_with_the_western_economies:0 "Интегрироваться с западными экономиками"
 POR_integrate_with_the_western_economies_desc:0 "Наши союзники в Западной Европе обладают огромным потенциалом как торговые партнёры Португалии. Следует поощрять экономическую взаимосвязь ради общего блага."
 POR_economic_interdependency:0 "Экономическая взаимозависимость"
 POR_economic_interdependency_desc:0 "Понимая, что торговля между союзниками приносит взаимную пользу военным усилиям, мы принимаем экономическую политику, поощряющую взаимозависимость."
 POR_allied_intelligence_cooperation:0 "Разведывательное сотрудничество союзников"
 POR_allied_intelligence_cooperation_desc:0 "Мы и союзники можем многое получить от технологического сотрудничества. Его необходимо расширить как можно скорее."
 POR_international_and_state_defense_force:0 "Международная служба государственной обороны"
 POR_international_and_state_defense_force_desc:0 "Современная Португалия является по-настоящему плюриконтинентальной страной, которой угрожает бесчисленное множество опасностей для фактической независимости. Возникшие потребности приведут к созданию высшей организации, обеспечивающей наши разведывательные нужды."
 POR_restore_valiance_to_the_nation:0 "Вернуть стране доблесть"
 POR_restore_valiance_to_the_nation_desc:0 "Несмотря на стабильность, принесённую Португалии Новым государством, умеренность Салазара душит потенциал страны как великой державы, способной противостоять коммунистической угрозе по всему миру. Используя открывшуюся возможность, мы создадим новую Португалию — маяк фашизма на Иберийском полуострове!"
 POR_the_battle_for_the_nation:0 "Битва за нацию"
 POR_restore_valiance_to_the_nation_category:0 "Возвращение доблести Португалии"
 POR_restore_valiance_to_the_nation_category_desc:0 "Несмотря на стабильность, принесённую Португалии Новым государством, умеренность Салазара душит потенциал страны как великой державы, способной противостоять коммунистической угрозе по всему миру. Используя открывшуюся возможность, мы создадим новую Португалию — маяк фашизма на Иберийском полуострове!"
 POR_one_revolution_to_end_them_all:0 "Одна революция, чтобы покончить со всеми"
 POR_one_revolution_to_end_them_all_desc:0 "С каждым месяцем господства Салазара классовый конфликт в Португалии лишь усиливается, а страна продолжает стагнировать. Очевидно, что должно произойти: правление Салазара необходимо завершить насильственно, быстрыми и решительными действиями!"
 POR_one_revolution_to_end_them_all_tt:0 "После завершения фокуса §YПоход на Лиссабон§! §Rначнётся гражданская война!§!"
 POR_utilize_fascist_labor_organizations:0 "Использовать фашистские рабочие организации"
 POR_utilize_fascist_labor_organizations_desc:0 "XX век вывел новые политические методы в основное русло многих стран. Молодёжные движения, политизированные профсоюзы и другие общественные организации могут стать основой для привлечения наших соотечественников."
 POR_arm_fascist_trade_unions:0 "Вооружить фашистские профсоюзы"
 POR_arm_fascist_trade_unions_desc:0 "Фашистские рабочие организации по всей Португалии — лучший союзник против обвинений в том, что мы служим кому-то, кроме простого народа. Пока Салазар использует любую возможность сокрушить организованный труд, мы ударим со всей решимостью!"
 unlocks_decision_sway_leftist_factory_workers_which_grants_tt:0 "Открывает решение §YПереманить левых фабричных рабочих§!, которое даёт:"
 POR_sway_leftist_factory_workers:0 "Переманить левых фабричных рабочих"
 POR_sway_leftist_factory_workers_desc:0 "Хотя коммунизм несомненно является порочной идеологией, у промышленных рабочих существует множество обоснованных претензий к последствиям капитализма в Португалии. Мы должны с первого дня объявить план неустанной работы ради процветания храбрых людей, поддерживающих нашу промышленность."
 POR_mobilize_countryside_support:0 "Мобилизовать поддержку сельской местности"
 POR_mobilize_countryside_support_desc:0 "Несмотря на твёрдую поддержку нынешнего режима в [ROOT.GetAdjective]их сельских районах, политика в их социальных и экономических интересах несомненно поможет привлечь их на нашу сторону."
 POR_affirm_support_for_land_reform:0 "Подтвердить поддержку земельной реформы"
 POR_affirm_support_for_land_reform_desc:0 "The [ROOT.GetAdjective] Сельская местность по-прежнему бедна, несмотря на то, что последствия депрессии в основном закончились. Это все доказательства, которые нужны нашим великим рабочим, чтобы показать, что Эстадо Ново Салазара заботится не об их состоянии! Мы объявим о широком плане земельной реформы для нации, сломав любое потенциальное коммунистическое влияние, которое должно уничтожить нашу нацию, одновременно увеличивая поддержку нашего дела!"
 POR_radicalize_salazars_allies:0 "Радикализировать союзников Салазара"
 POR_radicalize_salazars_allies_desc:0 "Новое государство объединяет множество идеологий, которые Салазар слишком некомпетентен удерживать вместе. Возможно, единство правых удастся создать, воспользовавшись его слабой или вовсе отсутствующей поддержкой монархии."
 POR_center_stage_against_communism:0 "Возглавить борьбу с коммунизмом"
 POR_center_stage_against_communism_desc:0 "Португальские правые едины в одном: социализм является величайшей угрозой нашему образу жизни и самой идее португальской нации. Только мы способны защищать интересы классов, сохраняя национальное единство!"
 POR_antagonize_socialist_organizations:0 "Провоцировать социалистические организации"
 POR_antagonize_socialist_organizations_desc:0 "Именно коммунисты и либералы, а не национал-синдикалисты, являются величайшей угрозой нашему образу жизни. Даже мирного марша по улицам достаточно, чтобы вызвать ярость этих красных дьяволов, что принесёт нам сочувствие, пока мы стираем их жалкую идеологию с полуострова."
 POR_integrate_the_monarchist_opposition:0 "Интегрировать монархическую оппозицию"
 POR_integrate_the_monarchist_opposition_desc:0 "Сопротивление Салазару усиливается даже внутри Нового государства. Последний шаг к свержению его слабого и раздробленного союза — объединить всех вокруг трёх принципов: Бог, Отечество и Король! Долой республику!"
 POR_tap_monarchist_organizations:0 "Использовать монархические организации"
 POR_tap_monarchist_organizations_desc:0 "Салазар демонстрирует тревожное отсутствие поддержки законного короля государства [ROOT.GetNameDef]. Подчеркнув верность этому делу, мы сможем получить материальную и политическую помощь, необходимую для укрепления идеологической поддержки."
 POR_march_on_lisbon:0 "Поход на Лиссабон"
 POR_march_on_lisbon_desc:0 "Поддержка Салазара в стране стремительно рушится. Используя представившийся шанс, мы должны штурмовать Лиссабон и положить конец эпохе слабости и компромиссов!"
 POR_half_of_current_authoritarian_support_is_applied_as_a_stability_penalty_tt:1 "Половина текущей поддержки §Yавторитаризма§! применяется как штраф к §Rстабильности§!:\n"
 POR_march_on_lisbon_tt:0 "Если завершён фокус §YОдна революция, чтобы покончить со всеми§!:"
 portugal.43.t:0 "Синие рубашки штурмуют Национальное собрание"
 portugal.43.d:0 "Власть Салазара стремительно рушилась, а социалистические и фашистские организации вышли на улицы Лиссабона. Салазар воспользовался ситуацией и призвал национальную армию, пытаясь сокрушить наше справедливое дело. После долгих часов хаотичных боёв значительная часть армии перешла на нашу сторону, что позволило окончательно уничтожить коммунистическую угрозу!"
 portugal.43.a:0 "Сегодня лишь начинается новый золотой век Португалии!"
 portugal.44.d:0 "Власть Салазара стремительно рушилась, а социалистические и фашистские организации вышли на улицы Лиссабона. Салазар воспользовался ситуацией и призвал национальную армию, чтобы сокрушить различные военизированные формирования, сражавшиеся за судьбу страны. Мир больше не может существовать в нашей Португалии; сегодняшняя реальность ясно показала одно:"
 POR_economic_shocks:0 "Экономические потрясения"
 POR_economic_shocks_desc:0 "Политический хаос и недавняя отмена устоявшейся финансовой политики Салазара вызывают серьёзные проблемы в [ROOT.GetAdjective]ой экономике. Чтобы привести страну к успеху, необходимо определить для Португалии новый экономический курс."
 POR_brawling_in_urban_centers:0 "Столкновения в городских центрах"
 POR_brawling_in_urban_centers_desc:0 "Несмотря на растущий контроль над страной, воинствующие, преимущественно социалистические группы ведут борьбу по всей территории, стремясь расколоть народ. Эти предатели должны быть уничтожены любой ценой!"
 POR_faltering_rural_support:0 "Ослабевающая поддержка в сельской местности"
 POR_faltering_rural_support_desc:0 "The [ROOT.GetAdjective] Сельская местность в значительной степени не заинтересована в национальной синдикалистской политике. Нам нужно будет их одержать верх, если мы хотим избежать разрушительного конфликта во внутренних регионах."
 POR_apathy_throughout_rural_regions:0 "Апатия в сельских районах"
 POR_growing_rural_support:0 "Растущая поддержка в сельской местности"
 POR_unifier_of_the_countryside:0 "Объединитель сельской местности"
 POR_march_on_lisbon_category:0 "Возвращение доблести стране"
 POR_march_on_lisbon_category_desc:0 "Исчезновение Салазара из Португалии — лишь начало наших великих замыслов. Коммунистическая угроза сохраняется, а внутреннее недовольство растёт, поэтому необходимо действовать быстро и вернуть Португалии доблесть!"
 POR_all_against_the_bolshevik_threat:0 "Все против большевистской угрозы"
 POR_all_against_the_bolshevik_threat_desc:0 "Несмотря на успехи на фронте, дьявол большевизма всё ещё скрывается по всей стране. Мы должны немедленно обратить внимание на эту угрозу!"
 POR_embark_upon_the_european_continent:0 "Выйти на европейский континент"
 POR_embark_upon_the_european_continent_desc:0 "Когда испанский конфликт завершён, а величие страны восстановлено, необходимо обратиться к событиям, поглощающим континент."
 unlocks_decision_refuse_the_naval_blockade_which_grants_tt:0 "Открывает решение §YОтказаться от морской блокады§!, которое даёт:"
 POR_refuse_the_naval_blockade_decision_tt:0 "Когда это решение доступно, страны, воюющие с §Y[ENG.GetNameDef]§!, смогут использовать наши конвои для увеличения §Yподдержки войны§! в обмен на внемаповые §Yфабрики§! для гражданской промышленности."
 portugal.62.t:0 "Решение галисийского вопроса"
 portugal.62.d:0 "После окончания гражданской войны в Испании настало время определить долгосрочные отношения с новым правительством в Мадриде. Прежде всего необходимо решить галисийский вопрос: как поступить с нашими северными братьями, столь долго находившимися под властью Мадрида?"
 portugal.62.a:0 "Забудем об этом. Новый режим в Мадриде может стать важным союзником в грядущие времена!"
 portugal.62.b:0 "В обмен на Галисию они получат нашу дружбу!"
 portugal.62.c:0 "Мы немедленно потребуем эту законную землю!"
 portugal.63.t:0 "Португалия требует Галисию!"
 portugal.63.d:0 "Несмотря на наши давние и законные права на эту территорию, [FROM.GetAdjective]ое правительство предъявило нашему послу ультиматум, потребовав полного ухода из Галисии. Как ответить на это нелепое требование?"
 portugal.64.t:0 "Государство [FROM.GetName] отказывается передать Галисию"
 portugal.64.d:0 "Хотя эта земля по праву принадлежит нам, правительство государства [FROM.GetName] отказалось передать Галисию под наш суверенитет. Как поступить?"
 portugal.64.a:0 "Они знают о последствиях."
 portugal.64.b:0 "Забудем об этом. Крошечная провинция не стоит нашей независимости."
 portugal.65.t:0 "Государство [FROM.GetName] передаёт нам Галисию"
 portugal.65.d:0 "Сегодня прекрасный день для всей Португалии: государство [FROM.GetName] официально согласилось на наши требования о полном уходе из Галисии."
 portugal.65.a:0 "Наши северные братья наконец вернулись домой!"
 portugal.78.title:0 "Государство [POR.GetNameDefCap] предлагает сотрудничество в обмен на Галисию"
 portugal.78.desc:0 "После недавней победы в гражданской войне государство [POR.GetNameDefCap] сделало интересное предложение относительно нашей провинции Галисия:\n\nВ обмен на полный уход в его пользу [POR.GetAdjective]ая сторона предлагает экономическое сотрудничество и туманно обещает поддержать возможные [SPA.GetAdjective]ие ирредентистские претензии по всему миру. Что ответить нашим братьям в Лиссабоне?"
 POR_peace_with_the_salazaristas:0 "Мир с салазаристами"
 POR_peace_with_the_salazaristas_desc:0 "Установив контроль над страной, мы уже добились невероятного успеха для нашей великой идеологии. Раскалывать государство ради полного контроля не стоит продолжения борьбы."
 POR_forcefully_nationalize_the_blueshirts:0 "Принудительно национализировать синие рубашки"
 POR_forcefully_nationalize_the_blueshirts_desc:0 "Хотя синие рубашки сыграли важную роль в нашем успехе, их дальнейшая деятельность дестабилизирует страну. Для восстановления порядка необходимо подавить независимую активность военизированных организаций."
 unlocks_decision_restore_the_portuguese_legion_in_our_image_which_grants_tt:0 "Открывает решение §YВосстановить Португальский легион по нашему образцу§!, которое даёт:"
 POR_restore_the_portuguese_legion_in_our_image:0 "Восстановить Португальский легион по нашему образцу"
 POR_restore_the_portuguese_legion_in_our_image_desc:0 "Португальский легион является многообещающей организацией, способствующей национальному единству и объединяющей [ROOT.GetAdjective]ий народ всех классов! Продвижение наших идеалов в его рядах поможет укрепить государственный контроль."
 POR_crush_moderate_defiance:0 "Сокрушить сопротивление умеренных"
 POR_crush_moderate_defiance_desc:0 "Марионетки Салазара даже перед лицом коммунистической угрозы продолжают ослаблять Португалию. Необходимо покончить с их неповиновением, прежде чем их бесхребетность погубит нас."
 unlocks_decision_harass_reactionary_corporatists_which_grants_tt:0 "Открывает решение §YПреследовать реакционных корпоративистов§!, которое даёт:"
 POR_harass_reactionary_corporatists:0 "Преследовать реакционных корпоративистов"
 POR_harass_reactionary_corporatists_desc:0 "Реакционеры Нового государства — зараза, которую необходимо искоренить ради достижения национальных целей. Этих глупцов следует считать ничем не лучше большевиков!"
 POR_sponsor_blueshirt_activity:0 "Поддержать деятельность синих рубашек"
 POR_sponsor_blueshirt_activity_desc:0 "Синие рубашки являются главным источником политической силы нашей идеологии в борьбе против реакции и социализма. Логично расширить их набор и финансирование, чтобы они стали силой, способной защищать страну!"
 POR_cement_the_dictatorship:0 "Закрепить диктатуру"
 POR_cement_the_dictatorship_desc:0 "Необходимо ясно показать всей Португалии, что диктатура Прету является силой добра и сохранится до полного выполнения его миссии. Любая дальнейшая оппозиция внутри или вне правительства будет уничтожена."
 POR_strengthen_the_secret_police:0 "Укрепить тайную полицию"
 POR_strengthen_the_secret_police_desc:0 "Тайная полиция — одно из главных средств борьбы с социалистическими, реакционными и либеральными агитаторами. Следует предоставить ей ресурсы для продолжения репрессий против любых угроз внутренней стабильности."
 unlocks_decision_utilize_the_propaganda_ministry_which_grants_tt:0 "Открывает решение §YЗадействовать министерство пропаганды§!, которое даёт:"
 POR_utilize_the_propaganda_ministry:0 "Задействовать министерство пропаганды"
 POR_utilize_the_propaganda_ministry_desc:0 "Прежний режим активно использовал пропаганду. Следует перенять успешный опыт Салазара: работа министерства пропаганды поможет создать широкую народную поддержку нашего дела!"
 POR_western_europes_anti_communist_baston:0 "Антикоммунистический бастион Западной Европы"
 POR_western_europes_anti_communist_baston_desc:0 "Мы, [ROOT.GetAdjective]ий народ, являемся одними из главных мировых защитников от большевистской чумы, угрожающей жизни каждого. Весь мир узнает и ощутит нашу праведную борьбу!"
 POR_forge_a_cult_of_personality:0 "Создать культ личности"
 POR_forge_a_cult_of_personality_desc:0 "Каждый подданный великой империи должен признать Прету выдающимся и волевым человеком. Великий упадок Португалии остановлен и будет обращён вспять под его бескомпромиссным правлением!"
 charismatic_dictator:0 "Харизматичный диктатор"
 POR_reorientate_the_economy:0 "Переориентировать экономику"
 POR_reorientate_the_economy_desc:0 "Правление Салазара сопровождалось огромным сокращением финансирования как социального государства, так и славных вооружённых сил Португалии. Возрождающаяся страна больше не может быть задушена этой некомпетентной финансовой политикой!"
 POR_draft_portugals_own_labor_charter:0 "Разработать собственную трудовую хартию Португалии"
 POR_draft_portugals_own_labor_charter_desc:0 "Пора показать сильному городскому рабочему классу, что по мере укрепления власти мы намерены ставить его потребности на первое место. Под нашим мудрым руководством Португалия станет страной будущего!"
 POR_towards_a_national_syndicalist_state:0 "К национал-синдикалистскому государству"
 POR_support_fascist_labor_organizations:0 "Поддержать фашистские рабочие организации"
 POR_support_fascist_labor_organizations_desc:0 "Поддерживаемые партией рабочие организации являются символом силы и престижа великих ценностей режима. Следует обеспечить им поддержку, необходимую для расширения влияния правительства среди народа."
 POR_completion_of_these_decisions_reduces_the_lingering_effects_of_economic_shocks_tt:0 "Выполнение этих §Yрешений§! §Gуменьшает§! сохраняющиеся последствия §Yэкономических потрясений§!"
 POR_nationalize_struggling_industries:0 "Национализировать проблемные отрасли"
 POR_nationalize_struggling_industries_desc:0 "Многие [ROOT.GetAdjective]ие организации пострадали от недавней нестабильности. Следует использовать эту возможность, вмешаться и укрепить контроль над экономикой!"
 POR_syndicalize_the_vital_sectors:0 "Синдикализировать ключевые отрасли"
 POR_syndicalize_the_vital_sectors_desc:0 "The [ROOT.GetAdjective] Рабочий в последний раз находился в жалком состоянии эксплуатации. Мы должны работать над синдикализацией областей экономики, которые направляют нашу нацию, чтобы наши великие рабочие могли пользоваться правами, которых они заслуживают, в то время как мы предлагаем нашу поддержку, пока они находятся в наших интересах."
 POR_syndicalization_of_national_industry:0 "Синдикализация национальной промышленности"
 POR_syndicalize_the_vital_sectors_tt:0 "§GОбъединяет§! эффекты §YСиндикализировать ключевые отрасли§! и §YК национал-синдикалистскому государству§! в более сильный национальный дух"
 POR_prioritize_economic_stability:0 "Поставить экономическую стабильность на первое место"
 POR_prioritize_economic_stability_desc:0 "Под нашим сильным правлением Португалия никуда не исчезнет. Мы можем продвигать интересы рабочего класса, не разрушая существующий экономический порядок, как делали прежние режимы."
 POR_prioritizing_economic_stability:0 "Приоритет экономической стабильности"
 POR_prioritize_economic_stability_tt:0 "§GОбъединяет§! эффекты §YПриоритет экономической стабильности§! и §YК национал-синдикалистскому государству§! в более сильный национальный дух"
 POR_revanchist_rearmament:0 "Реваншистское перевооружение"
 POR_revanchist_rearmament_desc:0 "Стремительно отказываясь от Версальского мира, Европа вновь движется вперёд! Чтобы государство [ROOT.GetNameDef] присоединилось к этому ускорению, необходимо смело и быстро укрепить вооружённые силы и покончить с эпохой мира и слабости!"
 POR_catholicism_over_class_struggle_r56:0 "Католицизм выше классовой борьбы"
 POR_catholicism_over_class_struggle_r56_desc:0 "Инвестиции в образование сельской местности — не только право, которого заслуживает народ, но и прагматичный способ принести инновации в этот давно отстающий регион Португалии."
 POR_maternalistic_welfare:0 "Материнская социальная помощь"
 POR_maternalistic_welfare_desc:0 "Как мы можем называть себя защитниками народа, если пренебрегаем потребностями самой основы страны? Каждая мать в государстве [ROOT.GetNameDef] получит всё необходимое для воспитания многочисленного и процветающего молодого поколения!"
 POR_restore_prosperity_to_the_nation_r56:0 "Вернуть стране процветание"
 POR_restore_prosperity_to_the_nation_r56_desc:0 "Как мы могли бы называть себя спасителями [ROOT.GetAdjective]ого рабочего класса, если бы всё время игнорировали условия жизни народа, как это делал Салазар? Экономические реформы принесли стране большие успехи и ознаменуют новый золотой век обновлённой [POR.GetAdjective]ой экономики!"
 POR_restore_the_empire:0 "Восстановить империю"
 POR_restore_the_empire_desc:0 "Главное дело — искупление Португалии — зависит от возвращения Брагансской династии к власти! С Богом, Отечеством и Королём Португалия вновь выйдет на мировую арену!"
 POR_joao_de_almeida:0 "João de Almeida"
 POR_request_axis_membership:0 "Запросить членство в Оси"
 POR_request_axis_membership_desc:0 "Давняя дружба с британцами принесла нам немало пользы, но теперь прямо противоречит нашим интересам. Германия стремится установить на континенте новый порядок, частью которого станет новая Португалия!"
 POR_align_with_rome:0 "Сблизиться с Римом"
 POR_align_with_rome_desc:0 "Хотя давняя дружба с британцами принесла нам немало пользы, всё очевиднее, что они не способны учитывать потребности Португалии. Итальянцы упорно расширяют влияние в Средиземноморье, и подобное соглашение явно отвечает [ROOT.GetAdjective]им интересам!"
 POR_avenge_our_overseas_losses:0 "Отомстить за заморские потери"
 POR_avenge_our_overseas_losses_desc:0 "Португалии пора обратить взор за пределы страны и больше не мириться с жалким состоянием империи. Необходимо немедленно начать агрессивную ремилитаризацию и укрепление великого имперского наследия!"
 portugal.66.t:0 "Вопрос Розовой карты"
 portugal.66.desc:0 "Британия приходит в упадок, а наша великая страна вновь поднимается. Несомненно, настало время вернуться к давним африканским колониальным претензиям. Следует ли вновь добиваться земель, соединяющих Мозамбик и Анголу?"
 POR_forge_a_new_luso_spanish_order_r56:0 "Создать новый лузо-испанский порядок"
 POR_forge_a_new_luso_spanish_order_r56_desc:0 "Во многих отношениях, [POR.GetAdjective] и [SPR.GetAdjective] Мы разделяли историю, к сожалению, в первую очередь с нашими потерями влияния на вооруженные восстания и иностранное вмешательство. Даже если остальной мир будет против нас, Португалия и Испания сделают все возможное, чтобы уничтожить врагов нашего суверенитета, как мы делали это дважды!"
 portugal.66.a:0 "Война с Лондоном уничтожит нас. Сейчас нельзя добиваться этих земель."
 portugal.66.b:0 "Положение Лондона шаткое. Возможно, мы сможем этим воспользоваться..."
 portugal.66.c:0 "Мы не первые, кто унизит британцев, и не последние!"
 portugal.66.d:0 "Британская власть в регионе слабеет. Выждем подходящего момента."
 portugal.66.e:0 "Теперь, когда Британия ушла из региона, кто сможет нас остановить?"
 portugal.67.t:0 "Португалия предлагает дружбу в обмен на исторические колониальные земли"
 portugal.67.d:0 "Пока хаос поглощает многие бывшие владения, нас неожиданно посетил португальский министр иностранных дел. В обмен на возвращение африканских территорий, на которые Португалия претендовала в XIX веке, нам предлагают полноценный союз в мировых делах. Это могло бы помочь в борьбе за восстановление остальной части империи. Что ответить давним друзьям?"
 portugal.67.a:0 "Англо-португальский союз будет укреплён!"
 portugal.67.b:0 "Это нелепо, разумеется, мы откажем!"
 portugal.80.title:0 "Государство [POR.GetNameDefCap] предлагает союз"
 portugal.80.desc:0 "После недавнего улучшения лузо-испанских отношений [POR.GetAdjective]ий посол официально обратился к своему коллеге в Мадриде с предложением взаимного сотрудничества. Насколько нам известно, Португалия ищет союзника для реализации мировых амбиций и предлагает нам место в желаемом порядке.\n\nОбе империи, [POR.GetAdjective]ая и [SPR.GetAdjective]ая, давно находятся в упадке. Что ответить на предложение Лиссабона?"
 portugal.80.b:0 "Союз не отвечает нашим интересам, но мы готовы к сотрудничеству."
 POR_expand_strategic_production_r56:0 "Расширить стратегическое производство"
 POR_expand_strategic_production_r56_desc:0 "Поскольку война за правое дело приближается, необходимо сделать всё возможное для сохранения экономической независимости перед угрозой блокады и захвата заморских владений. Мы никогда не падём!"
 POR_prepare_the_african_theater:0 "Подготовить африканский театр"
 POR_prepare_the_african_theater_desc:0 "У нас есть решимость и сила вернуть утраченные земли, но остро не хватает инфраструктуры. Чтобы когда-нибудь соединить колонии, необходимо провести в них масштабное военное строительство!"
 POR_abandoned_african_colonial_claims_flag:0 " §RОтказались§! от исторических претензий на эти земли или уже получили их"
 POR_submit_an_ultimatum_to_britain:0 "Предъявить Британии ультиматум"
 POR_submit_an_ultimatum_to_britain_desc:0 "Возможность вернуть законные колонии непременно появится, но сначала следует попытаться сделать это мирным путём. Мы предъявим Лондону ультиматум с ясными требованиями: полностью уйти из наших законных колоний и признать справедливую власть над новыми заморскими провинциями!"
 POR_conquer_rhodesia:0 "Завоевать Родезию"
 POR_conquer_rhodesia_desc:0 "Существование полностью независимого [ZIM.GetAdjective]ого государства явно угрожает нашему заморскому присутствию. Мы предъявим этим глупцам ультиматум и потребуем полного подчинения великой [ROOT.GetAdjective]ой империи!"
 POR_subjugate_malawi:0 "Подчинить Малави"
 POR_subjugate_malawi_desc:0 "Недавно обретшие независимость земли государства [MLI.GetNameDef], имеющие доступ к одному из крупнейших мировых источников пресной воды, станут прекрасным дополнением к империи! Что теперь мешает воспользоваться историческими правами на эти земли?"
 POR_end_zambian_independence:0 "Покончить с [ZAM.GetAdjective]ой независимостью"
 POR_end_zambian_independence_desc:0 "The [ZAM.GetAdjective] Земли являются главным препятствием для сухопутной связи наших важнейших африканских колоний. Теперь, когда они независимы, мы должны дать ясно понять управляющей власти этих земель: вы подчинитесь нашему правлению!"
 POR_prepare_the_african_theater_tt:0 "Открывает решения с §Rтребованиями§! контроля над §YЗамбией§!, §YРодезией§! и §YМалави§!"
 r56_logistical_buildup:0 "Развитие логистики"
 portugal.68.t:0 "Португалия требует уступок в Африке"
 portugal.68.d:0 "The [POR.GetAdjective] Иностранный посол официально выдвинул ультиматум [ENG.GetLeader]Это «дружественное предложение» о том, что мы должны отказаться от колониального гарнизона в исторически заявляемых португальских колониальных землях на юге Африки. С обнаружением португальской мобилизации, что мы можем сказать об угрозе войны?"
 portugal.68.a:0 "Эти глупцы считают, что способны противостоять нам?"
 portugal.68.b:0 "При нынешнем положении у нас нет выбора."
 portugal.69.t:0 "Британия ушла с территорий, на которые мы претендуем!"
 portugal.69.d:0 "Сегодня Британия официально покинула спорные земли в Африке, сославшись на «бремя» для национальной безопасности."
 portugal.69.a:0 "Великий триумф нашей страны!"
 portugal.70.t:0 "Британия отказывается уходить!"
 portugal.70.d:0 "Британия направила официальный дипломатический ответ, ясно заявив, что ни при каких условиях не уйдёт со спорных территорий в Южной Африке."
 portugal.71.b:0 "Мы сражались за независимость не для того, чтобы вновь стать рабами!"
 portugal.72.t:0 "Государство [FROM.GetName] подчиняется нашей власти!"
 portugal.72.d:0 "Сегодня государство [FROM.GetName] официально капитулировало перед требованием полного подчинения португальской короне. Это несомненно великая победа нашей страны!"
 portugal.73.t:0 "Государство [FROM.GetName] отказалось!"
 portugal.73.d:0 "Слабая и жалкая страна [FROM.GetName] официально отклонила ультиматум о подчинении. Эти глупцы заплатят высшую цену за неповиновение."
 POR_destabilize_brazil:0 "Дестабилизировать Бразилию"
 POR_destabilize_brazil_desc:0 "В Бразилии существует множество движений и этнических групп, которые, хотя и не расположены к Лиссабону, могут ослабить нынешний режим и сделать возможной аннексию этой гораздо более крупной территории."
 r56_gains_claim_on_all_brazilian_states_and_all_states_owned_by_them_tt:0 "Получает претензии на все национальные территории §Y[BRA.GetAdjective]§! и §Y[URG.GetAdjective]§!, а также принадлежащие им регионы"
 portugal.59.t:0 "Португалия заявляет права короны на Бразилию!"
 portugal.59.d:0 "В провокационной речи перед толпой в Лиссабоне лидер Португалии [POR.GetLeader] заявил, что Бразилия «как плод португальской цивилизации» не имеет права сохранять самоопределение. Всё очевиднее, что новая воинственная Португалия становится угрозой мировой стабильности."
 portugal.59.a:0 "А я-то думал, что мои шутки плохи."
 unlocks_decision_host_a_royal_wedding_in_brazil_which_grants_tt:0 "Открывает решение §YПровести королевскую свадьбу в Бразилии§!, которое даёт:"
 POR_host_a_royal_wedding_in_brazil:0 "Провести королевскую свадьбу в Бразилии"
 POR_host_a_royal_wedding_in_brazil_desc:0 "Хотя в современной Бразилии монархическое дело пользуется ограниченной поддержкой, возвращение Бразилии остаётся нашей величайшей возможностью вновь стать имперской державой. Королевская свадьба между правящим Дуарти Брагансским и законной бразильской претенденткой Марией Франсишкой значительно укрепит поддержку в традиционалистских кругах!"
 POR_host_a_royal_wedding_in_brazil_tt:0 "После завершения фокуса §YОтомстить за катастрофу 1821 года§! в Бразилии начнётся §Rгражданская война§!"
 portugal.60.a:0 "Мы защитим отечество любой ценой!"
 POR_avenge_the_1821_disaster:0 "Отомстить за катастрофу 1821 года!"
 POR_avenge_the_1821_disaster_desc:0 "XIX век превратил Португалию из угасающей державы в умирающую. Несмотря на великое унижение, стремительное возвращение бразильских земель покажет миру, кем мы ещё способны стать!"
 POR_avenge_the_1821_disaster_tt:0 "В §YБразилии§! начнётся промонархическая гражданская война, §Rв которую будем втянуты и мы!§!"
 POR_avenge_the_1821_disaster_2_tt:0 "Если выполнено решение §YПровести королевскую свадьбу в Бразилии§!, в §YБразилии§! начнётся промонархическая гражданская война, §Rв которую будем втянуты и мы!§!"
 POR_proclaim_porto_brazilian_reunification:0 "Провозгласить португало-бразильское воссоединение"
 POR_proclaim_porto_brazilian_reunification_desc:0 "После сокрушительной победы над недавно отделившейся Бразилией настало время провозгласить наше достижение: жемчужина короны вновь находится в наших руках!"
 portugal.61.t:0 "Португалия требует прямой интеграции"
 portugal.61.a:0 "У нас нет выбора, кроме как подчиниться."
 POR_integrate_the_brazilian_administration:0 "Интегрировать бразильскую администрацию"
 POR_integrate_the_brazilian_administration_desc:0 "По мере роста покорности Бразилии нашей власти, возможно, настало время окончательно объединить эти давно разделённые земли. С Богом, Отечеством и Королём наши народы вновь едины!"
 POR_integrate_the_brazilian_administration_tt:0 "Контролирует все прибрежные §Yбразильские§! регионы, где подчинение составляет не менее 40%"
 unlocks_decision_proclaim_the_fifth_empire_which_grants_tt:0 "Открывает решение §YПровозгласить Пятую империю§!, которое даёт:"
 POR_proclaim_the_fifth_empire:0 "Провозгласить Пятую империю"
 POR_proclaim_the_fifth_empire_desc:0 "Будучи оплотом цивилизации на всех континентах, мы способны духовно, культурно и лингвистически привести великую португальскую нацию к мировой гегемонии. Подобно грекам и римлянам до нас, мы оставим собственное наследие в этом мире!"
 POR_has_completed_decision_proclaim_porto_brazilian_reunification_tt:0 "Выполнено решение §YПровозгласить португало-бразильское воссоединение§!"
 POR_repudiate_the_1890_british_ultimatum_flag:0 "Выполнено решение §YОтвергнуть британский ультиматум 1890 года§!"
 POR_the_fifth_empirer56:0 "Пятая империя"
 POR_the_fifth_empirer56_desc:0 "Будучи оплотом цивилизации на всех континентах, мы способны духовно, культурно и лингвистически привести великую португальскую нацию к мировой гегемонии. Подобно грекам и римлянам до нас, мы оставим собственное наследие в этом мире!"
 POR_gains_claim_on_all_INS_states_tt:0 "Получает претензии на все §Y[INS.GetAdjective]ие§! регионы"
 POR_gains_claim_on_singapore_brunei_and_all_MAL_states_tt:0 "Получает претензии на §YСингапур§!, §YБруней§! и все §Y[MAL.GetAdjective]ие§! регионы"
 POR_soares_da_costa:0 "Soares da Costa"
