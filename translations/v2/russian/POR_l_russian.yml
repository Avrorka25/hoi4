 POR_antonio_de_oliveira_salazar_desc_r56:0 "Антонио де Оливейра Салазар родился 28 апреля 1889 года в скромной жизни в деревне Вимиейро. Когда монархии было всего 11 лет, Салазар выстроил многие свои взгляды, наблюдая и испытывая сельское презрение к хаотичной, антиклерикальной турбулентности, которая определила раннюю португальскую республику.\n\nПродолжая практику своей веры и стремление к образованию, Салазар стал уважаемым профессором экономики в Университете Коимбры. Его уважаемый академический профиль в конечном счете привел к тому, что 28 мая 1926 года, после военного переворота, президент Антониу Оскар Кармона предоставил ему жесткий контроль над экономической политикой Португалии, где он успешно создал профицит бюджета для страны, несмотря на тяжелые экономические потрясения.\n\nБыстрый успех Салазара привел к тому, что президент Кармона делегировал большую часть своих полномочий влиятельному, но скромному министру, который теперь является президентом Совета министров, что сделало его вторым самым влиятельным и самым влиятельным членом правительства."
 POR_bento_goncalves_desc_r56:0 "Бенту Антониу Гонсалвеш родился 2 марта 1902 года в муниципалитете Монталегри и ещё в молодости стал токарем-механиком, работая в различных гражданских и военно-морских отраслях.\n\nОн начал приобретать известность в 1924 году во время пребывания в Португальской Анголе, где выступал в поддержку организованного труда на предприятиях, обслуживавших Луандскую железную дорогу.\n\nПозднее, после работы в Союзе военно-морских рабочих и памятной поездки в Москву на десятилетие Октябрьской революции, он был избран генеральным секретарём Португальской коммунистической партии. Он сохранял эту должность во время заключения в 1930 году и второй поездки в Советский Союз.\n\nК 1935 году многие всё более отчаявшиеся члены Португальской коммунистической партии призывают создать Народный фронт, который возглавит вооружённое восстание против Нового государства. Сумеет ли это новое левое единство сохраниться теперь, когда Гонсалвеш пришёл к власти?"
 POR_jose_norton_de_matos_desc_r56:0 "Жозе Нортон ди Матуш родился 23 марта 1867 года в Понти-ди-Лима. Первые годы образования он провёл в Лиссабоне, затем изучал математику в Коимбре и в конце концов поступил в военное училище.\n\nЕго государственная служба началась в 1898 году в колониальной администрации Португальской Индии. После нескольких лет службы он вернулся на родину и продолжил карьеру в вооружённых силах, а в 1915 году стал генерал-губернатором Португальской Анголы.\n\nВо время Великой войны Матуш занимал пост военного министра Португалии в правительствах Жозе ди Каштру, Антониу Алмейды и Афонсу Кошты, а после переворота Сидониу Паиша в декабре 1917 года отправился в изгнание в Лондон. Когда правление Паиша завершилось, Матуш вернулся в качестве португальского делегата на Парижской мирной конференции, после чего вновь отошёл к спокойной жизни на различных дипломатических и государственных должностях.\n\nПосле недавних национальных выборов Жозе Нортон ди Матуш готов выступить представителем старой гвардии и провести страну через переход к демократии, ставя Португалию превыше всего!"
 POR_jose_domingues_dos_santos_desc_r56:0 "Жозе Домингеш душ Сантуш родился 8 мая 1887 года в деревне Лавра в скромной рабочей семье. Во время свержения монархии в 1910 году он завершал обучение праву в Коимбрском университете, а затем связал свою жизнь с либерально-республиканской политикой.\n\nЗанимая должность министра труда и социального обеспечения, Сантуш предпринимал умеренные меры в поддержку португальского рабочего класса, а в 1924 году ненадолго стал председателем Совета министров. Затем он продолжил деятельность в левой Республиканской партии демократических левых, но после военного переворота Гомеша да Кошты в 1926 году был вынужден бежать в изгнание.\n\nВернувшись в Португалию, Сантуш намерен бороться за демократические принципы и поддержку организованного труда. Пережив тяжёлые времена недавней истории, Жозе Домингеш душ Сантуш уверен, что готов проложить стране путь к процветанию."
 POR_rolao_preto_desc_r56:0 "Франсишку ди Барселуш Ролан Прету родился 12 февраля 1893 года в деревне Гавиан. После свержения монархии в 1910 году он посвятил всю жизнь борьбе за реставрацию, из-за чего в 1912 году впервые оказался в заключении. Впоследствии ему удалось бежать в Бельгию.\n\nВ эмиграции Прету работал в журнале Alma Portuguesa, развивая монархическое, социально-традиционалистское и интегралистское учение, известное как лузитанский интегрализм. После всеобщей амнистии 1917 года он вернулся в Португалию, стал редактором газеты A Monarquia, выступал за экономический синдикализм и участвовал в нескольких попытках свержения республики. Успех пришёл после военного переворота Гомеша да Кошты в 1926 году, который позднее возглавил Ошкар Кармона. Однако при нём влияние Прету значительно ослабло, а Салазар впоследствии занял враждебную позицию к синдикализму.\n\nВновь оказавшись в изгнании в 1934 году, Прету жил вместе с печально известным деятелем Испанской республики Хосе Антонио Примо де Риверой и помогал ему формулировать 27 пунктов. Теперь, снова вернувшись в Португалию, Прету поклялся энергично бороться в поддержку организованного труда и твёрдого социального традиционализма. Сможет ли он привести Португалию к новому золотому веку?"
 POR_dom_duarte_nuno:0 "Дом Дуарти Нуну"
 POR_king_duarte_nuno:0 "Король Дуарти Нуну"
 POR_king_duarte_nuno_desc:0 "Дуарти Нуну Брагансский родился 23 сентября 1907 года в австрийском Зебенштайне, поэтому ему было всего три года, когда португальские революционеры свергли недолго правившего Мануэла II. После неожиданной смерти Мануэла II в 1932 году его троюродный брат Дуарти Нуну получил наиболее весомые права на престол и объединил монархическое движение как законный претендент на португальскую корону.\n\nС возвращением Брагансской династии на престол Дуарти Нуну готов бороться за восстановление стабильности и национальной гордости!"
