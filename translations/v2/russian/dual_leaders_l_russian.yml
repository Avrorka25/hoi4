 sl_governor_desc:0 "\n§LДо 1920-х годов генерал-губернаторы были британскими подданными, назначаемыми по совету британского правительства, которые действовали как агенты британского правительства в каждом доминионе, а также были представителями монарха. В качестве таковых они номинально обладали прерогативными полномочиями монарха, а также обладали исполнительной властью страны, к которой они были отнесены. Генерал-губернатор может быть проинструктирован колониальным секретарем об осуществлении некоторых его функций и обязанностей, таких как использование или удержание королевского согласия от законодательства; История показывает много примеров того, как генерал-губернаторы использовали свои прерогативы и исполнительную власть. Монарх или имперское правительство могли отклонить любого генерал-губернатора, хотя это часто могло быть громоздким, из-за удаленности территорий от Лондона.Генеральный губернатор также обычно был главнокомандующим вооруженных сил на его или ее территории и, благодаря контролю генерал-губернатором военных, пост был таким же военным назначением, как гражданский. Генерал-губернаторы имеют право носить уникальную униформу, которую сегодня обычно не носят. Если они были генерал-майора, равноценного или выше, они имели право носить военную форму."
 sl_king:0 "§WКороль§!"
 sl_governor:0 "§Wгубернатор§!"
 governorss:0 "§GГенерал-губернатор§!"
 governorss_desc:0 "В современном употреблении термин генерал-губернатор возник в тех британских колониях, которые стали самоуправляющимися в пределах Британской империи. До Первой мировой войны титул использовался только в федеративных колониях, в которых его избиратели имели губернаторов до федерации, а именно Канада, Австралия и Союз Южной Африки. В этих случаях представитель Короны в федеративном Доминионе получил высший титул генерал-губернатора. Первым исключением из этого правила была Новая Зеландия, которой был предоставлен статус Доминиона в 1907 году, но только 28 июня 1917 года Артур Фольямбе, 2-й граф Ливерпуля, был назначен первым генерал-губернатором Новой Зеландии.С 1950-х годов титул генерал-губернатора был присвоен всем представителям суверена в независимых королевствах Содружества. В этих случаях прежняя должность колониального губернатора была изменена (иногда для того же самого действующего), чтобы стать генерал-губернатором после независимости, поскольку характер офиса стал полностью независимым конституционным представителем монарха, а не символом предыдущего колониального правления. В этих странах генерал-губернатор выступает представителем монарха, выполняя церемониальные и конституционные функции главы государства."
 kingandgovernors.3.t:0 "Смерть Джона Букана"
 kingandgovernors.3.d:0 "6 февраля 1940 года Джон Букан получил тяжелую травму головы после инсульта в Ридо-Холле. Две операции доктора Уайлдера Пенфилда из Монреальского неврологического института были недостаточны, чтобы спасти его, и его смерть 11 февраля нарисовала радио-ревью Маккензи Кинга: «В кончине Его Превосходительства народ Канады потерял одного из величайших и наиболее почитаемых своих генерал-губернаторов и друга, который со дня своего прибытия в эту страну посвятил свою жизнь их службе». Генерал-губернатор сформировал сильную связь со своим премьер-министром, даже если это могло быть построено больше на политическом восхищении, чем дружбе: Маккензи Король оценил «стерлинговую прямоту и бескорыстную цель Бьюкена.После того, как он лежал в сенатской палате на Парламентском холме, Бьюкену дали государственные похороны в Сент-Джеймс. Пресвитерианская церковь Андрея в Оттаве. Его прах был возвращен в Великобританию на борту крейсера HMS Orion для окончательного захоронения в Элсфилде, деревне, где он жил в Оксфордшире."
 kingandgovernors.3.a:0 "Никогда не будет забыт..."
 kingandgovernors.4.t:0 "Смерть Джорджа Монктона"
 kingandgovernors.4.d:0 "Виконт Голуэй был генерал-губернатором Новой Зеландии с 12 апреля 1935 года по 3 февраля 1941 года. Его военное прошлое произвело впечатление на министров кабинета того времени. Его срок был дважды продлен из-за Второй мировой войны. Виконт Голуэй и его жена получили многочисленные подарки во время его пребывания на посту генерал-губернатора. Некоторые из них были возвращены в Новую Зеландию примерно во время продажи семейного дома Serlby Hall и были пожертвованы Музею Новой Зеландии Те Папа Тонгарева в 1980 году. Голуэй был масоном. Во время своего пребывания на посту генерал-губернатора он также был Великим Магистром Великой Ложи Новой Зеландии. В 1937 году был назначен членом Тайного совета. По возвращении в Англию Голуэй занимал почётный пост заместителя лорда-лейтенанта Ноттингемшира при 7-м герцоге Портлендском. Умер 27 марта 1943 года в Блит."
 kingandgovernors.4.a:0 "Покойся с миром..."
