 SWI_special_conscription:0 "Швейцарская система призыва"
 SWI_special_conscription_desc:0 "Эта страна полагается на систему ополчения, позволяющую в случае необходимости призвать граждан на службу. Однако это не позволяет содержать крупную постоянную армию.\n§W--------------- \nМы можем завершить фокус §Y«Отказаться от опоры на ополчение»§!, чтобы §Rснизить§! зависимость от нынешней системы призыва и перейти к постоянной армии."
 SWI_special_conscription_1:0 "Базовый призыв"
 SWI_special_conscription_1_desc:0 "Эта страна использует методы призыва, восходящие ещё к Великой войне.\n§W--------------- \nЗавершите фокус §Y«Расширенный призыв»§!, чтобы улучшить методы мобилизации и §Gувеличить§! число людей, которых можно призвать через систему ополчения. Также можно §Rснизить§! зависимость от ополчения, завершив фокус §Y«Отказаться от опоры на ополчение»§!."
 SWI_special_conscription_2:0 "Расширенный призыв"
 SWI_special_conscription_2_desc:0 "Эта страна использует новые методы призыва, обеспечивающие высокую эффективность.\n§W--------------- \nЗавершите фокус §Y«Улучшенная подготовка ополчения»§!, чтобы усовершенствовать систему и §Gповысить§! общее качество создаваемых частей ополчения."
 SWI_special_conscription_3:0 "Отличная система призыва"
 SWI_special_conscription_3_desc:0 "Эта страна не только использует современные методы призыва, но и заранее обеспечивает хорошую подготовку всех резервистов.\n§W--------------- \nЗавершите фокус §Y«Швейцария едина и готова»§!, чтобы усовершенствовать систему призыва и §Gдовести§! качество частей ополчения до максимальной мощности и эффективности."
 SWI_special_conscription_4:0 "Исключительная система призыва"
 SWI_special_conscription_4_desc:0 "Эта страна в совершенстве овладела искусством призыва и использования ополчения."
 SWI_swiss_neutral:0 "Швейцарский нейтралитет"
 SWI_swiss_neutral_desc:0 "Нейтралитет Швейцарии известен всему миру. Она не вступит ни в один альянс, если только её не вынудит к этому война. Зная это, другие страны охотнее заключают сделки со швейцарцами."
 SWI_swiss_neutral_2:0 "Швейцарский нейтралитет"
 SWI_swiss_neutral_2_desc:0 "Нейтралитет Швейцарии известен всему миру. Она не вступит ни в один альянс, если только её не вынудит к этому война. Зная это, другие страны охотнее заключают сделки со швейцарцами."
 SWI_fortifications_idea:0 "Упор на укрепления"
 SWI_fortifications_idea_desc:0 "Эта страна сосредоточилась на укреплениях и оборонительных мерах — как нынешних, так и будущих."
 SWI_socialization:0 "Социализация"
 SWI_socialization_desc:0 "Эта страна полностью приняла социализм и все его преимущества."
