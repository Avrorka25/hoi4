 SWI_anti_communism_idea:0 "Антикоммунистические идеалы"
 SWI_anti_tot:0 "Антитоталитаризм"
 SWI_business_incentives:0 "Льготы для бизнеса"
 SWI_helvetia_idea:0 "«Про Гельвеция»"
 SWI_helvetia_idea_desc:0 "Эта страна крайне серьёзно относится к своей культуре и народу. Любой, кто попытается навязать ей свою волю, столкнётся с ожесточённым сопротивлением."
 SWI_trading_idea:0 "Внешняя торговля"
 SWI_trading_idea_desc:0 "Эта страна заслужила репутацию честного торгового партнёра."
 SWI_good_trade:0 "Внешняя торговля"
 SWI_good_trade_desc:0 "Эта страна заслужила репутацию честного торгового партнёра."
 SWI_best_trade:0 "Внешняя торговля"
 SWI_best_trade_desc:0 "Эта страна заслужила репутацию честного торгового партнёра."
 SWI_corporatism_idea:0 "Корпоративизм"
 SWI_banking:0 "Швейцарское банковское дело"
 SWI_banking_desc:0 "Как страна, известная своей непричастностью к мировым конфликтам, Швейцария естественным образом стала местом, где состоятельные люди со всего мира хранят деньги. Это приносит ей множество преимуществ."
 SWI_temp_banking:0 "Банковская деятельность приостановлена"
 SWI_temp_banking_desc:0 "Хотя эта страна известна нейтралитетом, её втянули в оборонительную войну. К счастью, репутация сохранилась, но война неизбежно отпугивает клиентов. После её окончания дела, возможно, вернутся к норме."
 SWI_lost_banking:0 "Банковская репутация утрачена"
 SWI_lost_banking_desc:0 "Когда-то эта страна славилась нейтралитетом и широко использовалась для хранения средств. Однако участие в наступательной войне, независимо от причин, необратимо разрушило её репутацию безопасного банковского центра."
 SWI_flexible_foreign_policy:0 "Гибкая внешняя политика"
 SWI_flexible_foreign_policy_2:0 "Гибкая внешняя политика"
 SWI_internalism:0 "Внутренний курс"
 SWI_internalism_desc:0 "Эта страна решила сосредоточиться на внутренних делах, а не на внешних."
 SWI_standing_army:0 "Переход к постоянной армии"
 SWI_standing_army_desc:0 "Эта страна начала отходить от системы ополчения в пользу полноценной постоянной армии.\n§W--------------- \nЗавершите фокус §Y«Ввести воинскую повинность»§!, чтобы начать первый крупный призыв и §Gувеличить§! кадровый потенциал."
 SWI_standing_army_2:0 "Переход к постоянной армии"
 SWI_standing_army_2_desc:0 "Эта страна отказалась от системы ополчения и перешла к полноценной постоянной армии.\n§W--------------- \nЗавершите фокус §Y«Постоянная армия»§!, чтобы изменить §Yзакон о призыве§! на §Y«Ограниченный призыв»§!. Это станет последним шагом к созданию полноценной швейцарской армии!"
 SWI_standing_army_3:0 "Постоянная армия"
 SWI_standing_army_3_desc:0 "Эта страна успешно создала постоянную армию, применив методы, унаследованные от системы ополчения."
