 EYE_swiss.1.tt:0 "Вильгельм Густлофф погибает!\n"
 EYE_swiss.2.tt:0 "Фриц Платтен погибает!\n"
 EYE_swiss.12.tt:0 "Эта страна больше не сможет завершить фокус §R«Швейцарское банковское дело»§!."
 EYE_swiss.1:0 "ОШИБКА"
 EYE_swiss.1.a:0 "ПОЖАЛУЙСТА, СООБЩИТЕ ОБ ЭТОМ"
 EYE_swiss.1000:0 "Вильгельм Густлофф пережил покушение"
 EYE_swiss.1000.t:0 "Вильгельм Густлофф пережил покушение"
 EYE_swiss.1000.desc:0 "Вильгельм Густлофф, лидер швейцарской нацистской партии, едва избежал смерти на этой неделе, когда югославский еврей Давид Франкфуртер попытался убить его в доме в Давосе. Его спасла жена Хедвиг, заметившая странное поведение Франкфуртера и спросившая, зачем он хочет видеть её мужа. Запаниковав, Франкфуртер случайно показал спрятанный под курткой пистолет. Хедвиг набросилась на него и позвала мужа, после чего они вдвоём обезвредили нападавшего. Прибывшая полиция увела Франкфуртера. Он утверждает, что действовал в ответ на законы, принятые нацистской партией Германии в прошлом году. Дата суда пока не назначена."
 EYE_swiss.1000.a:0 "Кому вообще это было нужно?"
 EYE_swiss.1100:0 "Вильгельм Густлофф пережил покушение"
 EYE_swiss.1100.t:0 "Вильгельм Густлофф пережил покушение"
 EYE_swiss.1100.desc:0 "Вильгельм Густлофф, лидер швейцарской нацистской партии, едва избежал смерти на этой неделе, когда югославский еврей Давид Франкфуртер попытался убить его в доме в Давосе. Его спасла жена Хедвиг, заметившая странное поведение Франкфуртера и спросившая, зачем он хочет видеть её мужа. Запаниковав, Франкфуртер случайно показал спрятанный под курткой пистолет. Хедвиг набросилась на него и позвала мужа, после чего они вдвоём обезвредили нападавшего. Прибывшая полиция увела Франкфуртера. Он утверждает, что действовал в ответ на законы, принятые нацистской партией Германии в прошлом году. Дата суда пока не назначена."
 EYE_swiss.1100.a:0 "Национал-социализм так просто не победить!"
 EYE_swiss.1100.b:0 "Как... удачно."
 EYE_swiss.1100.c:0 "Франкфуртер нас не представляет!"
 EYE_swiss.1200:0 "Вильгельм Густлофф убит"
 EYE_swiss.1200.t:0 "Вильгельм Густлофф убит"
 EYE_swiss.1200.desc:0 "Вильгельм Густлофф, лидер швейцарской нацистской партии, был убит на этой неделе в своём доме в Давосе. Двадцатишестилетний югославский еврей Давид Франкфуртер пять раз выстрелил ему в голову, шею и грудь. Сообщается, что его впустила жена Вильгельма Хедвиг, не имевшая причин подозревать гостя. Франкфуртер сразу сдался полиции и признался в убийстве. Он утверждает, что действовал в ответ на законы, принятые в Германии в прошлом году. Суд пока не назначен, но большинство наблюдателей считает, что его признают виновным."
 EYE_swiss.1200.a:0 "Кому вообще это было нужно?"
 EYE_swiss.1300:0 "Вильгельм Густлофф убит"
 EYE_swiss.1300.t:0 "Вильгельм Густлофф убит"
 EYE_swiss.1300.desc:0 "Вильгельм Густлофф, лидер швейцарской нацистской партии, был убит на этой неделе в своём доме в Давосе. Двадцатишестилетний югославский еврей Давид Франкфуртер пять раз выстрелил ему в голову, шею и грудь. Сообщается, что его впустила жена Вильгельма Хедвиг, не имевшая причин подозревать гостя. Франкфуртер сразу сдался полиции и признался в убийстве. Он утверждает, что действовал в ответ на законы, принятые в Германии в прошлом году. Суд пока не назначен, но большинство наблюдателей считает, что его признают виновным."
 EYE_swiss.1300.a:0 "Ещё один храбрый мученик Нового порядка."
 EYE_swiss.1300.b:0 "Ещё больше пропаганды для фашистов."
 EYE_swiss.1300.c:0 "От нас нельзя требовать следить за каждым радикалом!"
 EYE_swiss.2:0 "Фриц Платтен арестован"
 EYE_swiss.2.t:0 "Фриц Платтен арестован"
 EYE_swiss.2.desc:0 "Фриц Платтен, лидер КПШ, был арестован в Советском Союзе. Известный тем, что когда-то спас Ленина от покушения, теперь он обвиняется в неуточнённых преступлениях против СССР, где работал учителем и научным сотрудником. Это стало ударом для швейцарских коммунистов, считавших Платтена героем. Они требуют раскрыть подробности предполагаемых преступлений, но информации нет, а сторонние наблюдатели считают, что он, вероятно, стал жертвой сталинских чисток. В отсутствие Платтена руководство швейцарским коммунистическим движением принял Леон Николь, переименовавший партию в Партию труда."
 EYE_swiss.2.a:0 "Ещё одна жертва безумия Сталина."
 EYE_swiss.3:0 "СКРЫТО"
 EYE_swiss.3.a:0 "КАК ВЫ ЭТО ВООБЩЕ ВИДИТЕ?!"
 EYE_swiss.4:0 "Французские припасы"
 EYE_swiss.4.t:0 "Французские припасы"
 EYE_swiss.4.desc:0 "Франция пала перед Рейхом, но многие французы прибыли к нашим границам, предпочтя бежать на нашу территорию, а не сдаваться немцам. Ради сохранения нейтралитета мы не можем официально предоставить им убежище. Однако ничто не мешает воспользоваться припасами, которые совершенно случайно оказались в нашей стране. В случае войны несколько дополнительных добровольцев тоже не помешают..."
 EYE_swiss.4.a:0 "Теперь осталось понять, как объяснить это немцам..."
 EYE_swiss.5:0 "Речь Пиле-Гола"
 EYE_swiss.5.t:0 "Речь Пиле-Гола"
 EYE_swiss.5.desc:0 "Сегодня произошло важнейшее событие с далеко идущими и непредсказуемыми последствиями. Франция только что заключила перемирие с Германией и Италией. Британская империя заявляет о решимости продолжать борьбу на суше, на море и в воздухе. Было бы опасно предаваться иллюзиям беззаботного счастья: пережитое настоящее слишком сильно определяет наше будущее, чтобы мы могли вернуться в прошлое. Прежде чем вновь начать развиваться, Европа должна обрести новое равновесие, несомненно сильно отличающееся от прежнего и основанное на иных средствах, чем безуспешные принципы Лиги Наций. События развиваются быстро — мы должны принять их темп. Братья мои, достойные прошлого, смело двинемся навстречу будущему."
 EYE_swiss.5.a:0 "Разве мы побеждённая нация?"
 EYE_swiss.51:0 "Речь на Рютли"
 EYE_swiss.51.t:0 "Речь на Рютли"
 EYE_swiss.51.desc:0 "Генерал Анри Гизан собрал всех офицеров швейцарской армии на Рютли, родине [Root.GetAdjective] нации. После падения Франции в воздухе царила меланхолия, но с началом речи Гизана её сменила стальная решимость. Его слова разнеслись по округе: «Пока в Европе существуют миллионы вооружённых людей и пока значительные силы могут в любой момент напасть на нас, армия должна оставаться на своих постах... Именно это должен понять наш народ, и именно это заставит возможного противника колебаться... Уверенный в себе человек не будет бояться ни десантника, ни пятой колонны... Единственная наша защита — готовность обороняться до конца». Речь, известная лишь по отдельным фрагментам, уже распространилась среди населения, которое теперь твёрдо намерено защищать страну."
 EYE_swiss.51.a:0 "Передать этот приказ войскам!"
 EYE_swiss.6:0 "Будущее коммунистического руководства"
 EYE_swiss.6.t:0 "Будущее коммунистического руководства"
 EYE_swiss.6.desc:0 "По мере роста коммунизма в нашей стране естественно возникают споры о том, кто должен возглавить движение. Теперь, когда оно достигло критической точки, пора решить, как будет управляться страна. Многие склоняются к простой перестройке существующей политической системы и созданию конгресса, управляемого народом ради народа. Меньшинство предпочитает более тоталитарный путь, показанный Лениным и Сталиным. Какое направление выберет партия?"
 EYE_swiss.6.a:0 "Товарищи, вы можете принять неверное решение — и где мы тогда окажемся?"
 EYE_swiss.6.b:0 "Когда все вместе движутся вперёд, успех приходит сам."
 EYE_swiss.7:0 "Будущее коммунистического руководства поставлено под вопрос"
 EYE_swiss.7.t:0 "Будущее коммунистического руководства поставлено под вопрос"
 EYE_swiss.7.desc:0 "После смерти Фрица Платтена вновь остро встал вопрос о руководстве Коммунистической партией. Главным претендентом остаётся Леон Николь, более близкий к Сталину. Однако сторонники Рабочего конгресса воспользовались моментом, чтобы вновь продвинуть коллективное руководство. Решение необходимо принять снова."
 EYE_swiss.7.a:0 "Товарищ Николь поведёт нас в будущее!"
 EYE_swiss.7.b:0 "Протестующие правы: мы партия народа."
 EYE_swiss.8:0 "[From.GetNameDef] Требуется Тироль"
 EYE_swiss.8.t:0 "[From.GetNameDef] Требуется Тироль"
 EYE_swiss.8.desc:0 "Наш сосед [From.GetNameDef] В последнее время все больше и больше становится ирредентистов, и, хотя мы следим за ситуацией, мы были шокированы вчера, когда правительство США приняло меры по борьбе с коррупцией. [Root.GetNameDef] Мы выдвинули ультиматум. Они потребовали, чтобы мы дали им Ворарльберга, а в качестве компенсации за пропущенное время - остальную часть Тироля! Очевидно, что это требование безумно, и большинство ожидает, что мы от него откажемся, но можем ли мы действительно бороться? [Root.GetNameDef]Или мы просто теряем жизни?"
 EYE_swiss.8.a:0 "Мы принимаем эти... требования."
 EYE_swiss.8.b:0 "Мы можем дать им Тироль в обмен на их будущее сотрудничество."
 EYE_swiss.8.c:0 "Уступить [Root.GetNameDef]? Никогда!"
 EYE_swiss.9:0 "[From.GetName] уступает"
 EYE_swiss.9.t:0 "[From.GetName] уступает"
 EYE_swiss.9.desc:0 "[From.GetNameDef] согласилась с нашими требованиями! Признаемся, мы немного удивлены, но точно не разочарованы. Несправедливость прошлого наконец исправлена!"
 EYE_swiss.9.a:0 "Гельвеция навеки!"
 EYE_swiss.10:0 "[From.GetName] предлагает сделку"
 EYE_swiss.10.t:0 "[From.GetName] предлагает сделку"
 EYE_swiss.10.desc:0 "[From.GetNameDef] ответила на наш ультиматум предложением. Если мы вступим в [From.GetFactionName], они передадут нам требуемую территорию. При этом они недвусмысленно дали понять, что иначе не согласятся."
 EYE_swiss.10.a:0 "Сделка состоится."
 EYE_swiss.10.b:0 "Неужели [From.GetLeader] не знает, что такое\n*ультиматум*?"
 EYE_swiss.11:0 "[From.GetName] отвергает ультиматум"
 EYE_swiss.11.t:0 "[From.GetName] отвергает ультиматум"
 EYE_swiss.11.desc:0 "[From.GetNameDef] отвергла наши справедливые требования! Мы не удивлены, лишь разочарованы. Похоже, в этом мире получить заслуженное можно только силой."
 EYE_swiss.11.a:0 "Мы научим их воевать!"
 EYE_swiss.12:0 "Банковская репутация утрачена!"
 EYE_swiss.12.t:0 "Банковская репутация утрачена!"
 EYE_swiss.12.desc:0 "Наше участие в наступательной войне, независимо от причин, серьёзно подорвало международную репутацию безопасного банковского центра. После войны на восстановление уйдут годы, если оно вообще возможно. К счастью, в стране всё ещё остаётся множество активов, которые нельзя быстро вывести, но прежнего банковского престижа мы, вероятно, уже не вернём."
 EYE_swiss.12.a:0 "Нет! Не забирайте золото!"
 EYE_swiss.12.b:0 "Только не наши банки, они нам нужны!"
 EYE_swiss.13:0 "Банковская деятельность приостановлена!"
 EYE_swiss.13.t:0 "Банковская деятельность приостановлена!"
 EYE_swiss.13.desc:0 "Участие в войне, даже оборонительной, временно нарушило обычную работу банков. Поскольку мы защищаемся, после окончания войны репутацию, вероятно, удастся восстановить."
 EYE_swiss.13.a:0 "Как раздражает."
 EYE_swiss.14:0 "Банковская репутация восстановлена"
 EYE_swiss.14.t:0 "Банковская репутация восстановлена"
 EYE_swiss.14.desc:0 "После окончания войны мы смогли возобновить банковские операции. Это займёт некоторое время, но мы должны вернуть славу безопасного и надёжного банковского центра."
 EYE_swiss.14.a:0 "Превосходно."
 EYE_swiss.15:0 "[From.GetName] просит гарантий"
 EYE_swiss.15.t:0 "[From.GetName] просит гарантий"
 EYE_swiss.15.desc:0 "[From.GetName] тайно встретилась с нами, чтобы обсудить возможное совместное развёртывание войск в случае нападения со стороны [SWI_ger_or_fra]. Хотя это не было сказано прямо, мы подозреваем, что [From.GetNameDef] также подготовила планы с [SWI_ger_or_fra] на случай НАШЕГО нападения. Отказ от возможности заранее подготовиться к попытке [SWI_ger_or_fra] обойти нас с фланга может дорого обойтись. Заключим это не такое уж тайное соглашение?"
 EYE_swiss.15.a:0 "Пока что мы обеспечим их безопасность."
 EYE_swiss.15.b:0 "Мы не дадим таких обещаний!"
 EYE_swiss.16:0 "[From.GetName] обещает помощь"
 EYE_swiss.16.t:0 "[From.GetName] обещает помощь"
 EYE_swiss.16.desc:0 "[From.GetNameDef] пообещала прийти нам на помощь, если другая страна посягнёт на наш суверенитет! Мы уже составили планы на случай нападения [From.SWI_ger_or_fra]."
 EYE_swiss.16.a:0 "Мы знали, что [From.GetNameDef] — наш друг."
 EYE_swiss.17:0 "[From.GetName] отказывает в помощи"
 EYE_swiss.17.t:0 "[From.GetName] отказывает в помощи"
 EYE_swiss.17.desc:0 "[From.GetNameDef] отвергла наше предложение подготовить совместные планы на случай нападения третьей державы, сославшись на нераскрываемые соображения внутренней безопасности. Возможно, пора готовиться к худшему?"
 EYE_swiss.17.a:0 "Что же они замышляют?"
 EYE_swiss.18:0 "Выбор направления флота"
 EYE_swiss.18.t:0 "Выбор направления флота"
 EYE_swiss.18.desc:0 "К удивлению всех, нам удалось получить и сохранить выход к морю. Мы воспользовались этим и разработали полноценную военно-морскую доктрину. Теперь необходимо выбрать главное направление. Мы можем получить чертежи почти любого типа кораблей, но ресурсы ограничены. На каких проектах сосредоточиться?"
 EYE_swiss.18.a:0 "Мы должны массово производить лёгкие корабли."
 EYE_swiss.18.b:0 "Средние корабли — удачное сочетание размеров и мощи."
 EYE_swiss.18.c:0 "Только самые крупные корабли способны править морями."
 EYE_swiss.18.d:0 "Мы не можем соперничать на поверхности, поэтому уйдём в глубины — подводные лодки."
 EYE_swiss.19:0 "Назначение генерала"
 EYE_swiss.19.t:0 "Назначение генерала"
 EYE_swiss.19.desc:0 "В обычных условиях швейцарские вооружённые силы подчиняются непосредственно Федеральному совету, а высшим званием является командир корпуса. Но нынешние времена далеки от обычных. Европа вновь погрузилась в кровавый океан войны. Настало время снова назначить генерала вооружённых сил — человека, который мудро воспользуется широкими полномочиями и сохранит свободу Швейцарии. Кто поведёт нас в эти тяжёлые времена?"
 EYE_swiss.19.a:0 "Анри Гизан подаёт надежды."
 EYE_swiss.19.b:0 "Непоколебимый Жюль Борель."
 EYE_swiss.19.c:0 "Ульрих Вилле-младший, сын героя войны."
 EYE_swiss.20:0 "Население против мобилизации"
 EYE_swiss.20.t:0 "Население против мобилизации"
 EYE_swiss.20.desc:0 "Население ясно выразило недовольство нынешней мобилизацией. Люди считают, что войны пока не видно на горизонте, а потому не следует отрывать столь значительную часть граждан от домов. Отдать приказ о демобилизации?"
 EYE_swiss.20.a:0 "Мы не можем это поддерживать."
 EYE_swiss.20.b:0 "Неужели мы должны быть Кассандрой?!"
 EYE_swiss.20.tt:0 "Ополчение нельзя призвать, пока действует §Y«Вынужденная демобилизация»§!."
 EYE_swiss.21:0 "Население недовольно мобилизацией"
 EYE_swiss.21.t:0 "Население недовольно мобилизацией"
 EYE_swiss.21.desc:0 "В прошлый раз значительная часть населения была готова поверить нам на слово, когда мы призвали войска. Теперь большинство требует вернуть солдат домой, а сами военные проявляют беспокойство, и их мораль падает. Отдать приказ о демобилизации?"
 EYE_swiss.22:0 "Население возмущено мобилизацией"
 EYE_swiss.22.t:0 "Население возмущено мобилизацией"
 EYE_swiss.22.desc:0 "Продолжение мобилизации теперь поддерживают лишь самые убеждённые сторонники войны. По всей стране гражданские выражают недовольство. Большинство протестов остаются мирными, но атмосфера становится всё более напряжённой. Многие солдаты были наказаны за попытки дезертирства, неповиновение и неисполнение обязанностей. Отдать приказ о демобилизации?"
 EYE_swiss.23:0 "Население в ярости из-за мобилизации"
 EYE_swiss.23.t:0 "Население в ярости из-за мобилизации"
 EYE_swiss.23.desc:0 "Если кто-то ещё поддерживает мобилизацию, то не говорит об этом публично из страха возмездия. Правительство стало синонимом грубой некомпетентности. Офицеры больше не контролируют войска, многие солдаты просто отказываются выполнять приказы. В некоторых районах протесты переросли в насилие. Не пора ли наконец демобилизовать армию?"
 EYE_swiss.103:0 "Принудительная демобилизация"
 EYE_swiss.103.t:0 "Принудительная демобилизация"
 EYE_swiss.103.desc:0 "Гнев народа больше невозможно сдерживать. Из-за отправки стольких мужчин на фронт экономика остановилась, а отказ провести демобилизацию в отсутствие войны разгневал и солдат, и гражданских. Вчера почти все военнослужащие сложили оружие и разошлись по домам. Не имея армии, чтобы наказать собственную армию, мы были вынуждены уступить."
 EYE_swiss.103.a:0 "Предательские кретины!"
 SWI_gw_tank_equipment:0 "Renault FT-17 «Москито»"
 SWI_gw_tank_equipment_short:0 "FT-17 «Москито»"
 SWI_gw_tank_equipment_desc:0 "Чтобы поддерживать армию в современном состоянии, Швейцария в 1922 году приобрела у Франции несколько Renault FT-17, назвав их «Москито», то есть «комары»."
 SWI_light_tank_equipment_1:0 "Panzer 39 LTH"
 SWI_light_tank_equipment_1_short:0 "Panzer 39"
 SWI_light_tank_equipment_1_desc:0 "Швейцария приобрела 24 чехословацких танка Panzer 38(t) LTH и оснастила их 24-мм пушками Oerlikon."
 SWI_light_tank_aa_equipment_1:0 "34 Pz. K. 41"
 SWI_light_tank_aa_equipment_1_short:0 "34 Pz."
 SWI_light_tank_destroyer_equipment_1:0 "75 Pz. K. 41"
 SWI_light_tank_destroyer_equipment_1_short:0 "75 Pz."
 SWI_light_tank_equipment_2:0 "Renault R-35"
 SWI_light_tank_equipment_2_short:0 "Renault R-35"
 SWI_light_tank_equipment_2_desc:0 "После падения Франции в 1940 году 12 танков Renault R-35 пересекли границу со Швейцарией, чтобы не сдаваться немцам. Швейцарцы использовали их до конца войны. Несмотря на устаревшую конструкцию, этот танк служил не только в Швейцарии, но и по всему миру, став самым массовым французским танком Второй мировой войны."
 SWI_light_tank_destroyer_equipment_2:0 "Jagdpanzer G-13 Hetzer"
 SWI_light_tank_destroyer_equipment_2_short:0 "G-13 Hetzer"
 SWI_light_tank_equipment_3:0 "Laupen Panzer 14t"
 SWI_light_tank_equipment_3_short:0 "Laupen 14t"
 SWI_light_tank_equipment_3_desc:0 "Laupen 14t был одним из двух экспериментальных проектов лёгкого танка, созданных в Швейцарии в 1950 году. Оба должны были превосходить более крупные универсальные танки в скорости, сохраняя возможность пробивать их броню. Вероятно, они стали ответом на характеристики советского ИС-3 и попыткой обновить устаревающие бронетанковые силы Швейцарии."
 SWI_light_tank_destroyer_equipment_3:0 "Nahkampfkanone 1"
 SWI_light_tank_destroyer_equipment_3_short:0 "Nahkampfkanone 1"
 SWI_light_tank_destroyer_equipment_3_desc:0 "Nahkampfkanone 1, построенная на шасси бронеавтомобилей и Panzer 38(t), была единственным швейцарским лёгким истребителем танков военного времени. Машину создали в 1943 году, вооружили 75-мм пушкой, а её масса составляла 12,5 тонны."
 SWI_light_tank_artillery_equipment_3:0 "Nahkampfkanone 10.5"
 SWI_light_tank_artillery_equipment_3_short:0 "Nahkampfkanone 10.5"
 SWI_light_tank_artillery_equipment_3_desc:0 "После службы в роли истребителя танков швейцарские военные решили, что Nahkampfkanone 1 лучше оснастить 10,5-см гаубицей вместо прежней 75-мм пушки. Так они и сделали."
 SWI_medium_tank_equipment_1:0 "Panzer 1939"
 SWI_medium_tank_equipment_1_short:0 "Panzer 1939"
 SWI_medium_tank_equipment_2:0 "Panzer 41"
 SWI_medium_tank_equipment_2_short:0 "Panzer 41"
 SWI_medium_tank_equipment_3:0 "Panzer 43"
 SWI_medium_tank_equipment_3_short:0 "Panzer 43"
 SWI_modern_tank_equipment_1:0 "Panzer 58"
 SWI_modern_tank_equipment_1_short:0 "Panzer 58"
 SWI_modern_tank_equipment_1_desc:0 "Разработанный в 1953 году Panzer 58 предназначался для модернизации устаревающих бронетанковых сил Швейцарии, всё ещё в основном использовавших технику времён Второй мировой войны. Опыт его создания оказался бесценным и позднее лёг в основу более успешного Panzer 61."
 SWI_modern_tank_destroyer_equipment_1:0 "Nahkampfkanone 2"
 SWI_modern_tank_destroyer_equipment_1_short:0 "Nahkampfkanone 2"
 SWI_modern_tank_destroyer_equipment_1_desc:0 "Прототип Nahkampfkanone 2 был построен в 1946 году, вооружён 75-мм пушкой и задумывался как более тяжёлая и усовершенствованная версия Nahkampfkanone 1. Испытания продолжались до 1947 года, после чего разработку прекратили."
 SWI_heavy_tank_equipment_1:0 "Panzer Char B-1"
 SWI_heavy_tank_equipment_1_short:0 "Panzer B-1"
 SWI_heavy_tank_equipment_2:0 "Panzer 1941"
 SWI_heavy_tank_equipment_2_short:0 "Panzer 1941"
 SWI_heavy_tank_equipment_3:0 "Panzer 44"
 SWI_heavy_tank_equipment_3_short:0 "Panzer 44"
 SWI_super_heavy_tank_equipment_1:0 "Überpanzer 44"
 SWI_super_heavy_tank_equipment_1_short:0 "Überpanzer 44"
 SWI_submarine_1:0 "Класс «Женева»"
 SWI_submarine_2:0 "Класс «Тун»"
 SWI_submarine_3:0 "Класс «Бриенц»"
 SWI_submarine_4:0 "Класс «Люцерн»"
 SWI_carrier_1:0 "Класс «Лаупен»"
 SWI_carrier_2:0 "Класс «Джорнико»"
 SWI_carrier_3:0 "Класс «Дорнах»"
 SWI_carrier_4:0 "Класс «Земпах»"
 SWI_battleship_1:0 "Класс «Санкт-Галлен»"
 SWI_battleship_2:0 "Класс «Винкельрид»"
 SWI_battleship_3:0 "Класс «Ули Ротах»"
 SWI_battleship_4:0 "Класс «Вильгельм Телль»"
 SWI_SH_battleship_1:0 "Класс «Мельхталь»"
 SWI_SH_battleship_2:0 "Класс «Гельвеция»"
 SWI_battle_cruiser_1:0 "Класс «Лидия»"
 SWI_battle_cruiser_2:0 "Класс «Цвингер»"
 SWI_heavy_cruiser_1:0 "Класс «Герцог»"
 SWI_heavy_cruiser_2:0 "Класс «Дюфур»"
 SWI_heavy_cruiser_3:0 "Класс «Вилле»"
