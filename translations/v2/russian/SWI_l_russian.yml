 SWI_load_conscription_tt:0 "Призвать ополчение к оружию.\n"
 SWI_upgrade_conscription_tt:0 "Создаёт новые улучшенные части. Старые части будут расформированы через §R14 дней§! после создания новых."
 SWI_demobilize_tt:0 "Все мобилизованные части вернутся домой, а резервисты будут распущены."
 SWI_marcel_speech_tt:0 "Была произнесена пораженческая речь."
 SWI_has_guisan_tt:0 "Анри Гизан является генералом (фельдмаршалом)."
 EYE_form_alamannia_category:0 "Вернуть наше древнее наследие"
 EYE_form_alamannia_category_desc:0 "Мы не просто обычный германский народ. Мы — потомки самих верхнегерманцев! Алеманны, бич Рима, великие предки великой Германии! Прошли века, но неизбежное наконец свершилось, и наши законные земли вновь оказались в наших руках. Пора сбросить оковы прошлого, вернуть утраченное и возродить Алеманнию!"
 SWI_form_alamannia:0 "Возродить Алеманнию"
 SWI_mobilize_category:0 "Мобилизация"
 SWI_mobilize_category_desc:0 "Швейцария не располагает обычной армией. Вместо неё страна полагается на ополчение, состоящее из призывников, которых вызывают на службу в случае необходимости."
 SWI_mobilize_decision:0 "Мобилизовать швейцарское ополчение"
 SWI_upgrade_units:0 "Улучшить ополчение"
 SWI_demobilize_units:0 "Демобилизовать швейцарское ополчение"
 SWI_angry_civilians:0 "Противодействие мобилизации"
 SWI_deal_with_populace:0 "Разобраться с населением"
 SWI_choose_general_category:0 "Назначить генерала"
 SWI_choose_general_category_desc:0 "Обычно командир корпуса — высшее звание в швейцарской армии. Однако, когда страна оказывается в непосредственной опасности, правительство может назначить генерала вооружённых сил с широкими военными и политическими полномочиями."
 SWI_choose_general:0 "Выбрать генерала"
 SWI_destroy_mine_infrastructure:0 "Уничтожить шахты и инфраструктуру"
 SWI_destroy_mine_infrastructure_desc:0 "Враг у наших ворот. Мы должны отступить в самые отдалённые районы страны и уничтожить шахты и инфраструктуру, чтобы замедлить и отвлечь противника."
 SWI_fix_mine_infrastructure:0 "Восстановить шахты и инфраструктуру"
 SWI_fix_mine_infrastructure_desc:0 "Мы были вынуждены уничтожить собственные шахты и инфраструктуру, чтобы помешать врагу, но теперь наконец наступил мир. У нас появилась возможность восстановить разрушенное."
 SWI_redo_mine_infrastructure:0 "Начать восстановление швейцарских шахт и инфраструктуры"
 SWI_redo_mine_infrastructure_desc:0 "Швейцария пала, но перед этим уничтожила свою инфраструктуру и шахты. Чтобы использовать эту страну, придётся начать восстановительные работы."
 SWI_redo_mine_infrastructure2:0 "Завершить восстановление швейцарских шахт и инфраструктуры"
 SWI_redo_mine_infrastructure2_desc:0 "Мы почти полностью восстановили шахты и инфраструктуру Швейцарии до рабочего состояния. Осталось лишь вернуть их к довоенному уровню."
 SWI_give_speech:0 "Произнести воодушевляющую речь"
 SWI_give_speech_desc:0 "Речь Марселя Пиле-Гола наполнила страну пораженчеством и отчаянием, затронув даже офицеров. Генерал Гизан предложил собрать всех швейцарских офицеров на Рютли, месте основания нашей нации. Возможно, он сможет объяснить важность продолжения борьбы."
 r56_SWI_swiss_fortifications:0 "Швейцарские укрепления"
