 SWI_angry_civilians_1:0 "Разгневанное население"
 SWI_angry_civilians_1_desc:0 "Население этой страны требует демобилизовать войска и вернуть их домой."
 SWI_angry_civilians_2:0 "Возмущённое население"
 SWI_angry_pcivilians_2_desc:0 "Население этой страны разгневано отказом правительства демобилизовать армию."
 SWI_angry_civilians_3:0 "Разъярённое население"
 SWI_angry_civilians_3_desc:0 "Население этой страны открыто восстало против правительства из-за его отказа демобилизовать армию."
 SWI_pressured_demobilization:0 "Вынужденная демобилизация"
 SWI_pressured_demobilization_desc:0 "Население заставило правительство этой страны демобилизовать армию против его воли."
