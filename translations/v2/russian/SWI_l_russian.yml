l_russian:
 EYE_enough_production_tt:0 "Достаточно ячеек строительства для §Yвоенного завода§!."
 EYE_construction_effort_tt:0 "Достаточно ячеек строительства для §Yфабрики§!."
 EYE_overlord_neutral_tt:0 "Метрополия придерживается нейтралитета"
 EYE_overlord_democratic_tt:0 "Метрополия является демократической"
 EYE_overlord_fascist_tt:0 "Метрополия является фашистской"
 EYE_overlord_communist_tt:0 "Метрополия является коммунистической"
 SWI_reliance_on_militia:0 " Опора на систему ополчения"
 SWI_choose_cons_tt:0 "Увеличивает число людей, которых можно призвать через систему ополчения.\n"
 SWI_choose_cons_2_tt:0 "Повышает качество создаваемых частей ополчения.\n"
 SWI_choose_cons_3_tt:0 "Наши части ополчения достигнут максимальной мощи и эффективности.\n"
 henne_dead_tt:0 "Рольф Хенне погибает!\n"
 SWI_no_offensive_wars_tt:0 "Никогда не участвовала в наступательной войне."
 SWI_red_cross_tt:0 "Активирует §HМеждународный комитет Красного Креста§!.\n§HПолевые госпитали§!:\n    §HВозврат в строй§!: §G+10%§!\n    §HПотери опыта§!: §G-5%§!"
 ICE_no_six:0 "§RВы не получите шестую ячейку исследований, если у вас уже есть пять.§!\n"
 SWI_back_the_national_front:0 "Поддержать Национальный фронт"
 SWI_back_the_national_front_desc:0 "Национальный фронт — ведущая фашистская партия в [ROOT.GetNonIdeologyName]. Если кто-то и способен прийти к власти в этой склоняющейся к демократии стране, то именно они. Некоторые высокопоставленные члены уже имеют тесные связи с [GER.GetNameDef], что может обеспечить нам определённую защиту с их стороны, если или когда начнётся война."
 SWI_geistige:0 "Продвигать «Духовную оборону страны»"
 SWI_geistige_desc:0 "В 1935 году член совета Фриц Хаузер начал изучать способы защиты духовной независимости нашей страны от фашистов и коммунистов. Результатом стало предложение о «Духовной обороне страны», призывающее к свободе, демократии, самоопределению и сбалансированному правительству. Следует принять его без промедления."
 SWI_richtlinienbewegung:0 "Поддержать движение «Рихтлиниенбевегунг»"
 SWI_richtlinienbewegung_desc:0 "Элиты разорили страну и после краха 1929 года так и не смогли решить наши многочисленные проблемы. Теперь стервятники с крайне левого и крайне правого флангов кружат над нами, готовясь утащить страну в свои когти! Хватит. Мы должны создать новый союз, направленный на помощь народу, но не ценой нашей свободы!"
 SWI_burger:0 "Поддержать «Бюргерблок»"
 SWI_burger_desc:0 "Мы не можем стать жертвой зла социализма! Вместо этого следует заключить союз с консерваторами и фермерами, чтобы продолжить путь к восстановлению. Нельзя допустить радикализации правительства."
 SWI_rise_of_front:0 "Подъём Фронта"
 SWI_rise_of_front_desc:0 "Неспособность правительства прийти к какому-либо соглашению привела к росту насилия, и люди всё чаще тянутся к движениям, ещё недавно считавшимся маргинальными."
 SWI_helvetia:0 "«Про Гельвеция»"
 SWI_helvetia_desc:0 "Хотя вооружённая защита страны, а также её подготовка и организация являются исключительной обязанностью государства — более того, его первейшим долгом, — духовную оборону нации мы хотим прежде всего оставить в руках граждан. Государство должно располагать необходимыми средствами и сохранять право контролировать их использование."
 SWI_fortress:0 "Оперативный приказ № 12"
 SWI_heer:0 "«Армия и дом»"
 SWI_heer_desc:0 "Необходимо чётко разделять серьёзные лекции, требующие постоянного внимания, и чисто развлекательные мероприятия. Первые относятся к рабочему времени, вторые — к досугу. Оба вида важны: иногда нужно учиться, иногда — отдыхать. Учить — не значит навязывать теории, а значит побуждать к размышлениям и бросать вызов мышлению."
 SWI_go_left:0 "Прыжок влево"
 SWI_go_left_desc:0 "В 1935 году Социал-демократическая партия окончательно отказалась от призыва к диктатуре пролетариата и разорвала последние связи с истинным коммунизмом. Но теперь, когда её влияние вновь возросло, возможно, пора переосмыслить некоторые старые идеалы? В конце концов, это всего лишь прыжок влево, а при необходимости всегда можно сделать шаг вправо."
 SWI_fortress_desc:0 "Мы будем сражаться с ними на самых высоких горах, и наша страна никогда не падёт. Даже если придётся отдать врагу три четверти территории, последняя четверть будет бороться, пока не останется ни одного мужчины, женщины или ребёнка!"
 SWI_fortifications:0 "Общая программа укреплений"
 SWI_fortifications_desc:0 "Швейцария со всех сторон окружена странами, которые далеко не всегда желают нам добра. Нельзя позволить им воспользоваться нашей слабостью. Мы должны подготовиться к возможному нарушению нашего суверенитета."
 SWI_planning:0 "Предварительное планирование"
 SWI_planning_desc:0 "Мы не можем полагаться на планы, составленные в горячке момента. Следует заранее заключить тайные соглашения с соседями на случай нападения другой страны. Мы должны подготовиться к тому дню, когда одна из сторон нарушит наш мир."
 SWI_first_line:0 "Линия"
 SWI_first_line_desc:0 "Швейцария не уступит ни пяди территории ради великих замыслов фашистов и не позволит французам использовать себя в стратегических целях. Мы самостоятельный народ и не позволим врагу перейти нашу границу!"
 SWI_extended_army:0 "Расширенная армейская позиция"
 SWI_extended_army_desc:0 "Как бы хороша ни была наша первая линия, было бы глупо не подготовить вторую на случай прорыва. Враг может прорвать первую, но никогда не преодолеет вторую!"
 SWI_aa:0 "Защита швейцарского воздушного пространства"
 SWI_aa_desc:0 "Теперь, когда мы начали вкладываться в противовоздушную оборону, пора развернуть её в полном объёме. Ни одна страна не посмеет нарушить наше воздушное пространство, а тот, кто осмелится, быстро об этом пожалеет!"
 SWI_redoubt:0 "Национальный редут"
 SWI_redoubt_desc:0 "Швейцария не должна пасть, а если это всё же случится, враг заплатит за каждый дюйм полями крови. В качестве последнего средства следует создать грандиозную оборонительную систему в самых высоких горах для последнего рубежа. Мы, швейцарцы, будем сражаться до самого горького конца!"
 SWI_three_layer:0 "Трёхуровневая оборона"
 SWI_three_layer_desc:0 "Швейцария не может позволить себе потерять ни пяди земли! Мы должны укрепить линии и приготовиться сражаться за каждый участок. Смерть каждому, кто осмелится вступить на нашу землю!"
 SWI_trade:0 "Пересмотреть экономику"
 SWI_trade_desc:0 "После ужасного краха 1929 года экономика наконец начала восстанавливаться. Следует определить, что ещё требует улучшения, а что уже работает хорошо, особенно в сфере торговли."
 SWI_renegotiate:0 "Пересмотреть торговые соглашения"
 SWI_renegotiate_desc:0 "Швейцария находится в незавидном положении, сильно завися от импорта продовольствия и сырья. Раз уж это неизбежно, необходимо добиться максимально справедливых торговых соглашений."
 SWI_railroads:0 "Расширить электрические железные дороги"
 SWI_railroads_desc:0 "Чтобы снизить зависимость от угля, мы серьёзно вложились в электрические железные дороги. Следует удвоить усилия и заменить оставшиеся старые угольные линии новыми электрическими."
 SWI_prepare:0 "Подготовиться к войне"
 SWI_prepare_desc:0 "Война приближается, и все это понимают. Нельзя ждать неизбежного: подготовку нужно начать уже сейчас, чтобы встретить конфликт во всеоружии."
 SWI_stock:0 "Обязательные запасы"
 SWI_stock_desc:0 "Отныне все компании в Швейцарии обязаны хранить запас продукции минимум на шесть месяцев, иначе их импортные лицензии будут отозваны. Это должно обеспечить нас хотя бы некоторыми припасами к началу войны."
 SWI_wahlen:0 "План Валена"
 SWI_wahlen_desc:0 "В Швейцарии мало пахотной земли, и значительная её часть тратится на скотоводство, занимающее слишком много ценного пространства. Мы должны осушить болота, расчистить леса и превратить пастбища в поля пшеницы и картофеля."
 SWI_shadow:0 "Теневая организация"
 SWI_shadow_desc:0 "Швейцария не готова к войне, в которой не сможет импортировать необходимое. Эту проблему нужно решить как можно скорее. Мы создали Теневую организацию — группу представителей федерального и кантональных правительств, которая поможет подготовить экономику к военному времени."
 SWI_modern_mil_facs:0 "Современные артиллерийские заводы"
 SWI_modern_mil_facs_desc:0 "Военная инфраструктура Швейцарии устарела. Если мы действительно хотим иметь оружие для сопротивления, необходимо модернизировать производство артиллерии."
 SWI_light_naval_guns:0 "Лёгкие корабельные орудия"
 SWI_light_naval_guns_desc:0 "Компания Oerlikon успешно производит лёгкие корабельные орудия на экспорт, и нам следует воспользоваться её опытом."
 SWI_modern_at_weapons:0 "Современные противотанковые средства"
 SWI_modern_at_weapons_desc:0 "Ещё в начале 1930-х годов мы разработали противотанковые ружья. Теперь пора повысить их скорострельность или увеличить калибр снарядов для лучшего пробития брони."
 SWI_stop_export:0 "Прекратить торговлю металлоломом"
 SWI_stop_export_desc:0 "Долгое время Швейцария поставляла другим странам качественный металлолом для переплавки. Однако теперь эта сталь нужна нам самим. За исключением Ватикана, мы прекратим всю торговлю металлическим ломом."
 SWI_agri:0 "Развитие сельского хозяйства"
 SWI_agri_desc:0 "Будучи горной страной, мы приложили немало изобретательности, чтобы стать хотя бы частично самодостаточными. Это естественным образом привело к развитию производственных и сельскохозяйственных технологий, многие из которых можно применять и в других областях."
 SWI_shadow_seize:0 "Конфисковать заводы"
 SWI_shadow_seize_desc:0 "Война вновь пришла в Европу, и мы не можем позволить компаниям продавать всё оружие за рубеж — оно нужно нам самим. Для тех, кто откажется подчиниться, уже подготовлено новое руководство."
 SWI_convoys:0 "Швейцарское судоходство"
 SWI_convoys_desc:0 "Швейцария не имеет выхода к морю, но торгует со многими заморскими партнёрами. Пора приобрести корабли, которые будут ходить под швейцарским флагом."
 SWI_mines:0 "Вновь открыть рудники Гонцена"
 SWI_mines_desc:0 "В заброшенной шахте в горах Гонцена обнаружен марганец — важный элемент в электрохимических процессах. Следует как можно скорее вновь открыть рудник!"
 SWI_international:0 "Международные отношения"
 SWI_international_desc:0 "Несмотря на небольшую территорию и население, Швейцария играет заметную роль в мировых делах. У нас находится Красный Крест, мы известны надёжным нейтралитетом, а наши банки знамениты во всём мире. Было бы глупо этим не воспользоваться."
 SWI_chemical:0 "Химический завод в Граубюндене"
 SWI_chemical_desc:0 "Благодаря углублённому пониманию природы мы сделали важные открытия в области создания заменителей топлива, значительно снижающих зависимость от импорта нефти. Необходимо наладить производство как можно большего количества синтетических материалов, и у нас уже есть подходящее место для завода."
 SWI_fuel_ration:0 "Нормирование топлива"
 SWI_fuel_ration_desc:0 "Всем гражданам, чьи поездки не являются необходимыми, отныне запрещено пользоваться автомобилями. Запасы топлива должны накапливаться, а отопление по возможности переводиться на древесину. Мы полностью зависим от импорта нефти и обязаны сохранить имеющееся топливо только для жизненно важных нужд, пока ищем альтернативы."
 SWI_bicycle_infantry:0 "Велосипедная пехота"
 SWI_bicycle_infantry_desc:0 "Чтобы избежать расхода топлива, использование велосипедов даст войскам определённую мобильность. Мы уже применяли их для буксировки противотанкового оружия, поэтому серьёзная реформа не потребуется — достаточно обеспечить необходимое количество велосипедов."
 SWI_banks:0 "Швейцарское банковское дело"
 SWI_banks_desc:0 "Наши банки славятся безопасностью и надёжностью. Следует сделать так, чтобы другие страны об этом не забывали."
 SWI_red_cross:0 "Родина Красного Креста"
 SWI_red_cross_desc:0 "Как твёрдо нейтральная страна, мы размещаем штаб-квартиру Красного Креста и часто выступаем нейтральными наблюдателями в иностранных тюрьмах и лагерях военнопленных. Это достойная репутация!"
 SWI_kill_henne:0 "Убить [SWI_fascist_leader]"
 SWI_kill_henne_desc:0 "[SWI_fascist_leader] извратил Национальный фронт. Мы самостоятельный народ, а не цепные псы немцев! Этот шут должен умереть."
 SWI_corporatism:0 "Подъём корпоративизма"
 SWI_corporatism_desc:0 "Швейцария превратилась в жалкое государство, неспособное заботиться о народе. Причина этой слабости — слабость правительства. Его необходимо уничтожить и заменить более организованной системой, способной эффективно удовлетворять нужды народа и страны."
 SWI_go_ita:0 "Дружба с Италией"
 SWI_go_ita_desc:0 "Италия и Муссолини служат прекрасным примером чрезвычайно успешного фашистского государства. Швейцарию связывает с Италией множество культурных уз, и нам следует этим воспользоваться."
 SWI_old_confederation:0 "Возродить Старую конфедерацию"
 SWI_old_confederation_desc:0 "Общественная поддержка наконец достигла уровня, позволяющего пересмотреть конституцию. Мы останемся верны наследию и вернёмся к корням. Страна сохранит республиканский строй, но управляться будет непосредственно избранными представителями кантонов! Процесс управления станет эффективнее, а армия получит полное финансирование. Швейцарская конфедерация вернулась!"
 SWI_irredentism:0 "Швейцарский ирредентизм"
 SWI_irredentism_desc:0 "В 1919 году жители Форарльберга проголосовали за объединение со своими братьями. Однако капиталисты и наши слабые лидеры не позволили этому случиться! Так больше продолжаться не может: эти люди — наши! Мы заберём принадлежащее нам, а возможно, и немного больше в качестве компенсации за упущенное время!"
 SWI_new_mil:0 "Постоянная армия"
 SWI_new_mil_desc:0 "Наша армия реорганизована, солдаты подготовлены, а экономика перестроена для наступательной войны. Теперь мы стоим в одном ряду с другими странами мира. Швейцария сделает то, чего не делала тысячу лет, — пойдёт войной!"
 SWI_one_man:0 "Новый государственный порядок"
 SWI_one_man_desc:0 "Швейцарская республика окончательно ушла в прошлое. Пора закрепить это и принять новую корпоративную систему. Никогда больше нас не будет терзать болезнь демократии!"
 SWI_go_ger:0 "Связи с Германией"
 SWI_go_ger_desc:0 "Мы отличаемся от немцев, но всё же связаны с ними множеством культурных и исторических уз. Следует укреплять эти связи и сблизиться с соседом."
 SWI_go_fra:0 "Солидарность с Францией"
 SWI_go_fra_desc:0 "Наши добрые отношения с французами насчитывают много лет. Нет причин отказываться от них сейчас, особенно когда подобные чувства становятся всё более редкими в мире."
 SWI_recognize_ussr:0 "Открыть посольство в Москве"
 SWI_recognize_ussr_desc:0 "Хотя СССР существует уже много лет, мы до сих пор отказываемся устанавливать с ним официальные дипломатические отношения. В последнее время такая политика выглядит всё более нелепой."
 SWI_end_neutral:0 "Гибкая внешняя политика"
 SWI_end_neutral_desc:0 "Много лет Швейцария упорно сохраняла нейтралитет, и это хорошо служило стране. Однако современная эпоха не столь благосклонно относится к продолжению такого курса. Возможно, пора рассмотреть альтернативы."
 SWI_saty_neutral:0 "Укрепить нейтралитет"
 SWI_saty_neutral_desc:0 "Швейцария сохраняла своё положение в мире, не принимая ничью сторону. Нельзя рисковать этой хрупкой позицией и портить репутацию. Политика нейтралитета остаётся в силе и только укрепляется."
 SWI_fascist_diplo:0 "Фашистская дипломатия"
 SWI_fascist_diplo_desc:0 "Возможно, на наших глазах формируется новый мировой порядок, и мы находимся в самом его центре. Чтобы не остаться позади, необходимо с распростёртыми объятиями обратиться к соседям, независимо от их убеждений."
 SWI_democratic_diplo:0 "Поворот к интервенционизму"
 SWI_democratic_diplo_desc:0 "Демократия — неотъемлемое право, которое необходимо защищать любой ценой. Мы должны сотрудничать с теми, кто стремится её сохранить, а не уничтожить."
 SWI_stay_neutral:0 "Продолжить политику нейтралитета"
 SWI_stay_neutral_desc:0 "Швейцарская нация и её народ поколениями избегали войны благодаря сочетанию дипломатии и готовности к обороне. Нет причин менять эту систему сейчас."
 SWI_join_cominterm:0 "Коммунистический интернационал"
 SWI_join_cominterm_desc:0 "Коминтерн действует во благо рабочих всего мира. Мы добровольно вступаем в него, чтобы принести миру новую революцию, которая навсегда освободит трудящихся от страданий. За Единый фронт!"
 SWI_join_italy:0 "Римское объединение"
 SWI_join_italy_desc:0 "Несмотря на все связи с немцами, с итальянцами нас объединяет почти столько же, а их политика не столь... предосудительна. Рейх Гитлера обречён рухнуть под тяжестью собственной пропаганды, но Муссолини показал истинную силу фашизма. Вместе с ним и новой Римской империей мы будем стоять гордо. Roma Invicta!"
 SWI_join_germany:0 "Склониться перед Рейхом"
 SWI_join_germany_desc:0 "Германия готова установить в Европе новый порядок, в котором нашей старой политике нейтралитета не будет места. Нас связывает с немцами многое, и вместе, а не порознь, мы создадим этот новый порядок."
 SWI_sov_tech:0 "Советские технологии"
 SWI_sov_tech_desc:0 "Советский Союз добился больших успехов во многих областях — от военного дела до философии. Теперь, когда мы объединили усилия, было бы глупо не воспользоваться этими знаниями."
 SWI_italian_tech:0 "Итальянские исследования"
 SWI_italian_tech_desc:0 "После прихода к власти национал-социализма в Италии исследовательский процесс был значительно упорядочен, что позволило увеличить поток новых идей. Мы можем учиться у итальянских братьев и применять их достижения у себя!"
 SWI_ger_tech:0 "Немецкая наука"
 SWI_ger_tech_desc:0 "Немцы действительно превзошли себя в исследованиях и разработках, создав отлаженную военную машину, которую уважают даже их величайшие враги. Немецкая наука — лучшая в мире, и нам стоит перенять их методы."
 SWI_join_allies:0 "Официальный союз с Францией"
 SWI_join_allies_desc:0 "Исторически у нас складывались очень хорошие отношения с французами, и мы даже разрабатывали совместные планы на случай нападения на нашу страну. Однако новые обстоятельства заставляют задуматься, не будет ли нам выгоднее заключить официальный союз с Францией."
 SWI_french_tech:0 "Французское технологическое сотрудничество"
 SWI_french_tech_desc:0 "Французы выиграли Великую войну не просто благодаря удаче. На их стороне были учёные и исследователи. И британцы, и французы создавали танки для преодоления траншей, но именно французская конструкция стала образцом для множества танков, производимых и сегодня. Объединив наших учёных, мы сможем защититься от будущих вторжений благодаря технологическому превосходству."
 SWI_extend_maginot:0 "Швейцарское продолжение линии Мажино"
 SWI_extend_maginot_desc:0 "Заключив официальный союз с Францией, мы сможем соединить наши укрепления с их оборонительной системой и с помощью французских технологий создать неприступную линию от Бельгии до Австрии!"
 SWI_air_inno:0 "Иностранные авиационные новшества"
 SWI_air_inno_desc:0 "Швейцарские самолёты всегда были достойными, но их нельзя назвать передовыми. Самолёты наших соседей превосходят их по конструкции и качеству. Чтобы развивать собственную авиацию, мы должны учиться у них."
 SWI_sov_weapons:0 "Советское вооружение"
 SWI_sov_weapons_desc:0 "Кто-то может насмехаться над Советским Союзом, но лишь глупцы и пропагандисты сомневаются в смертоносности его оружия. Теперь, когда мы стоим плечом к плечу как братья и сёстры по оружию, мы можем воспользоваться этими технологиями."
 SWI_internal_focus:0 "Сосредоточиться на Швейцарии"
 SWI_internal_focus_desc:0 "Внутренние дела Швейцарии важнее любой внешней дипломатии. О швейцарском народе необходимо заботиться так же, как это делалось веками. Нельзя позволить нынешней геополитической обстановке заставить нас забыть об этом."
 SWI_expand_uni:0 "Расширить университеты"
 SWI_expand_uni_desc:0 "В Швейцарии много прекрасных университетов, включая учреждения Цюриха, Берна и Фрибурга. По мере роста населения и распространения образования число студентов увеличилось. Чтобы лучшие таланты оставались в Швейцарии, необходимо расширить наши возможности и не дать людям причин уезжать."
 SWI_army:0 "Пересмотреть состояние армии"
 SWI_army_desc:0 "В Европе вновь назревает война. Во время Великой войны нам удалось сохранить полный нейтралитет, но это вовсе не гарантирует его в грядущем конфликте. Необходимо проверить войска и убедиться, что они готовы к бою."
 SWI_update_army:0 "Модернизировать армию"
 SWI_update_army_desc:0 "Наша армия оказалась крайне слабой, а части плохо организованными. В случае войны нас просто перебьют. Необходимо реорганизовать и перевооружить войска!"
 SWI_modern_arty:0 "Тяжёлые орудия"
 SWI_modern_arty_desc:0 "Наши силы не готовы сражаться с танками или многочисленным противником. Нужно подготовиться к неизбежному: вернуть в строй старые орудия, построить минные поля и привести в готовность противотанковые пушки. Мы должны быть способны остановить врага в любой момент!"
 SWI_choose_cons:0 "Расширенный призыв"
 SWI_choose_cons_desc:0 "Основная армия Швейцарии никогда не была особенно сильной и вместо этого полагалась на резервистов, которых можно быстро призвать. Эта система хорошо служила нам в прошлом и продолжит служить в будущем!"
 SWI_end_con:0 "Отказаться от опоры на ополчение"
 SWI_end_con_desc:0 "До сих пор призыв хорошо служил стране, но времена изменились, и этот метод больше не работает. Мы должны двигаться к современной профессиональной армии. Для этого придётся подготовить значительную часть населения призывного возраста, но мы справимся."
 SWI_con_to_army:0 "Ввести воинскую повинность"
 SWI_con_to_army_desc:0 "Чтобы создать постоянную армию, прежде всего нужны люди, которые будут в ней служить. У нас уже есть списки тех, кто готов к службе. Теперь пришло их время."
 SWI_improve_con:0 "Улучшенная подготовка ополчения"
 SWI_improve_con_desc:0 "Армия полностью зависит от ополчения, и мы не можем позволить ему быть чем-то меньшим, чем лучшим. Подготовка должна охватывать все возможные ситуации, чтобы наши люди могли сражаться где угодно и когда угодно."
 SWI_ready_for_all:0 "Швейцария едина и готова"
 SWI_ready_for_all_desc:0 "Мы подготовили народ настолько хорошо, насколько могли. Оборона укреплена, люди обучены. Нам остаётся только ждать и, когда наступит момент, доказать свою готовность."
 SWI_review_af:0 "Реорганизовать военно-воздушные силы"
 SWI_reorganise_af:0 "Перестроить авиацию"
 SWI_reorganise_af_desc:0 "В 1929 году мы решили значительно расширить военно-воздушные силы. Теперь у нас наконец достаточно людей и самолётов, чтобы создать отдельный самостоятельный род войск, полностью посвящённый воздушной войне."
 SWI_home_air:0 "Самолёты собственного производства"
 SWI_home_air_desc:0 "Мы не можем полностью зависеть от импортных самолётов. Чтобы сохранить суверенитет и самодостаточность, необходимо научиться производить качественные машины прямо в Швейцарии."
 SWI_foreign_air:0 "Иностранные лицензии"
 SWI_foreign_air_desc:0 "Швейцария успешно использовала иностранные самолёты в прошлом и продолжит это делать. Необходимо следить, чтобы лицензии оставались актуальными и приобретались по справедливой цене."
 SWI_fighter_focus:0 "Защитники неба"
 SWI_fighter_focus_desc:0 "Главная задача военно-воздушных сил — защищать наше небо от тех, кто посмеет нарушить воздушное пространство. Истребители должны быть готовы встретить любого врага, желательно с запасом."
 SWI_focus_home_air:0 "Сосредоточиться на отечественных моделях"
 SWI_focus_home_air_desc:0 "Швейцарскую авиационную промышленность необходимо расширить! Нельзя вечно полагаться на иностранные модели для защиты страны — мы должны разрабатывать собственные самолёты."
 SWI_focus_foreign_air:0 "Сосредоточиться на лицензионном производстве"
 SWI_focus_foreign_air_desc:0 "Швейцарии просто не хватает промышленности для массовой разработки собственных самолётов. Следует сосредоточиться на закупках иностранных машин и лицензий!"
 SWI_defend_homeskies:0 "Методы воздушной обороны"
 SWI_defend_homeskies_desc:0 "Швейцария может выделить лишь ограниченное число самолётов. Мы не можем позволить себе поражение в воздухе, поэтому должны научиться эффективно сражаться и побеждать врага даже в меньшинстве."
 SWI_interceptors:0 "Перехватчики"
 SWI_interceptors_desc:0 "Освоив ракетные технологии, мы поняли ценность самолёта, способного быстро взлететь и вступить в бой. Небольшой радиус действия нас не беспокоит: его задача — защищать швейцарскую землю от любого нарушителя."
 SWI_other_air:0 "Альтернативные типы самолётов"
 SWI_other_air_desc:0 "Швейцария уделяла огромное внимание истребителям, и в целом это правильно. Однако существуют и другие типы самолётов, и стоит изучить их хотя бы для выявления слабых сторон."
 SWI_naval_doc:0 "Создать военно-морскую доктрину"
 SWI_naval_doc_desc:0 "Не имея выхода к морю и даже крупных озёр, мы никогда не нуждались в военно-морской доктрине. Теперь обстоятельства изменились, и необходимо быстро наверстать упущенное."
 SWI_build_docks:0 "Создать швейцарскую судостроительную промышленность"
 SWI_build_docks_desc:0 "Раньше у нас не было выхода к морю, но теперь он есть! Хотя у нас нет предварительных планов, нельзя упускать эту возможность. Мы не получим морского опыта без кораблей, а корабли невозможно получить без мощностей для их строительства!"
 SWI_reform_flotilla:0 "Реформировать озёрную флотилию"
 SWI_reform_flotilla_desc:0 "До сих пор вся швейцарская военно-морская мысль ограничивалась небольшими судами для защиты озёр и рек. Теперь всё изменилось, и морской род войск стал необходимостью. Следует использовать опыт имеющихся экипажей и приступить к созданию собственного океанского флота!"
 SWI_naval_catchup:0 "Иностранные военно-морские технологии"
 SWI_naval_catchup_desc:0 "Нельзя обманывать себя: мы не готовились к появлению собственного побережья. Мы не умеем строить корабли и тем более современные боевые суда. Чтобы конкурировать на море, придётся привлечь иностранные таланты и идеи хотя бы для того, чтобы держаться на плаву!"
 SWI_expand_docks:0 "Расширить верфи"
 SWI_expand_docks_desc:0 "Теперь, когда мы создали собственную судостроительную промышленность, пора резко расширить её и раскрыть всю мощь швейцарской инженерной школы."
 SWI_fast_build_navy:0 "Острая потребность в кораблях"
 SWI_fast_build_navy_desc:0 "Мы годами не имели ни единой военно-морской идеи, лишь торговые представления о мореплавании. У нас даже нет истории морских исследований. Но теперь мы вышли к побережью и создали собственный флот. Нам придётся догонять остальной мир, но будь мы прокляты, если хотя бы не попытаемся стать силой, с которой будут считаться на море!"
 SWI_naval_air:0 "Морская авиация"
 SWI_naval_air_desc:0 "С появлением побережья и выхода к морю возникла новая проблема — необходимость самолётов для действий над открытой водой. Мы должны решить её напрямую и создать машины, способные справиться с этой особой задачей."
 SWI_compromise:0 "Компромисс с рабочими"
 SWI_compromise_desc:0 "Теперь, когда народ высказался, пора выполнить его требования. Нужно предоставить людям заслуженную защиту."
 SWI_pro_company:0 "Льготы для бизнеса"
 SWI_pro_company_desc:0 "Восстановление после депрессии идёт медленно. Нашим предприятиям нужна помощь, чтобы расти и вернуть прежнюю силу. Мы предоставим им всё необходимое для возвращения Швейцарии к процветанию."
 SWI_radical_left:0 "Программа социализации"
 SWI_radical_left_desc:0 "Получив явное большинство, мы наконец можем начать осуществлять обещанную политику. Грядут великие перемены, и мы будем стоять во главе их."
 SWI_end_neutral_left:0 "Вступить в международное сообщество"
 SWI_end_neutral_left_desc:0 "Слишком долго наша страна не могла присоединиться к борьбе за права низших классов, оставаясь связанной устаревшими идеями нейтралитета. Пора обновить внешнюю политику."
 SWI_continue_neutral:0 "Поддержать статус-кво"
 SWI_continue_neutral_desc:0 "Нейтралитет и невмешательство во внешние дела лишь укрепляли безопасность страны. Сейчас мы не можем позволить себе её потерять."
 SWI_pro_allies:0 "Риторика сдерживания"
 SWI_pro_allies_desc:0 "Времена изменились, и многие страны использовали массовую политику, чтобы обманом направить людей по ложному пути радикализма. Пока мир приближается к войне, мы должны выступить против тех, кто навязывает свою волю другим. Мы поддержим всех, кто достаточно смел, чтобы вместе с нами противостоять тирании!"
 SWI_support_friends:0 "Поддержать антифашизм"
 SWI_support_friends_desc:0 "Фашизм — нравственно отвратительная идеология, достойная лишь худших представителей человечества. Мы должны бороться с ним всеми силами. Любой лучше фашиста, и мы окажем этой борьбе всю возможную поддержку."
 SWI_anti_communism:0 "Поддержать антикоммунизм"
 SWI_anti_communism_desc:0 "Коммунизм — опиум для невежественных масс, не понимающих того, что они проповедуют. Нельзя позволить этой опасной идеологии распространяться дальше. Мы должны любой ценой поддержать тех, кто борется против неё."
 SWI_foreign_trade:0 "Инвестиции во внешнюю торговлю"
 SWI_foreign_trade_desc:0 "Как нейтральной стране нам доверяют множество дел: торговые операции, банковское дело, Красный Крест. Мы можем использовать это в своих интересах, сталкивая врагов друг с другом и добиваясь лучших торговых соглашений для страны."
 SWI_secret_wunderwaffe:0 "Создать ШКA"
 SWI_secret_wunderwaffe_desc:0 "Учёные сообщили, что стало возможным использовать силу самого созидания — атома — для создания бомбы, подобной которой мир ещё не видел. Следует поспешить и начать исследования такого оружия, учредив Schweizerische Studienkommission für Atomenergie — Швейцарскую исследовательскую комиссию по атомной энергии."
 SWI_liechtenstein_defence_plan:0 "План обороны [LIE.GetNonIdeologyName]"
 SWI_liechtenstein_defence_plan_desc:0 "Небольшая страна [LIE.GetNameDef] находится у нашей границы и столь же, если не более, уязвима для вторжения. Чтобы лучше защитить и себя, и её, разумно включить её в наши национальные оборонные планы."
 LIE_remained_neutral:0 "Сохраняет нейтралитет"
 SWI_support_the_liechtensteiner_army:0 "Поддержать [LIE.GetAdjective] армию"
 SWI_support_the_liechtensteiner_army_desc:0 "После восстановления армии [LIE.GetNameDef] спустя почти два столетия в наших интересах помочь её развитию, чтобы в будущем иметь более сильного партнёра в сфере безопасности."
 LIE_agreed_to_cooperation:0 "Согласились на дальнейшее сотрудничество"
 SWI_intervention_in_liechtenstein:0 "Вмешательство в [LIE.GetNonIdeologyName]"
 SWI_intervention_in_liechtenstein_desc:0 "Поскольку политическая ситуация в [LIE.GetNonIdeologyName] продолжает ухудшаться, необходимо принять меры, чтобы экстремистские партии не укрепились в соседнем княжестве. Растущее влияние радикальных фракций в Лихтенштейне представляет серьёзную угрозу региональной стабильности и безопасности нашей страны."
 SWI_border_war_liechtenstein_category:0 "Вмешательство в [LIE.GetNonIdeologyName]"
 SWI_border_war_liechtenstein_category_desc:0 "Поскольку политическая ситуация в [LIE.GetNonIdeologyName] продолжает ухудшаться, необходимо принять меры, чтобы экстремистские партии не укрепились в соседнем княжестве. Растущее влияние радикальных фракций в Лихтенштейне представляет серьёзную угрозу региональной стабильности и безопасности нашей страны."
 SWI_prepare_border_war_liechtenstein:0 "Подготовиться к вмешательству в [LIE.GetNonIdeologyName]"
 SWI_border_war_liechtenstein:0 "Неизбежное вмешательство в [LIE.GetNonIdeologyName]"
 lie_popularities_tt:0 "Совокупная поддержка UEK и VDBL превышает §Y40%§!."
 SWI_red_cross_tech:0 "Международный комитет Красного Креста"
 SWI_red_cross_tech_desc:0 "Международный комитет Красного Креста — одна из крупнейших и самых уважаемых организаций мира. Он занимается лечением раненых и обеспечением гуманного обращения с военнопленными. МККК располагается в Швейцарии и даже использует флаг, напоминающий швейцарский. Правительство и армия Швейцарии получили огромную пользу от присутствия такой организации."
