l_russian:
 PER_restoring_the_lions_might:0 "Возрождение львиной мощи"
 PER_easier_integration_tt:0 "Все решения §Y«Возрождение львиной мощи»§! становятся доступны при более низком уровне подчинения"
 PER_restoring_the_lions_might_desc:0 "Когда-то персидский лев проложил себе путь к господству во всей Западной Азии, но наша слава угасла в пучине гражданской войны и иностранного вмешательства. Теперь, когда Иран вновь обрёл сильное руководство, мы проложим новый путь вперёд и вернёмся на мировую арену!"
 PER_rescind_the_azerbaijan_concession:0 "Отменить уступку Азербайджана"
 PER_rescind_the_azerbaijan_concession_desc:0 "Среди множества утраченных нами исторических территорий падение Азербайджана под натиском русских было, пожалуй, самой предотвратимой и трагичной потерей. Азербайджанцы севера столь же иранцы, как и жители наших северо-западных провинций. Мы больше не потерпим их оккупацию!"
 PER_rescind_the_azerbaijan_concession_tt:0 "Открывает решение: §Y«Реинтегрировать Азербайджан»§!"
 PER_reintegrate_azerbaijan:0 "Реинтегрировать Азербайджан"
 PER_claim_iraqi_kurdistan:0 "Претендовать на Иракский Курдистан"
 PER_claim_iraqi_kurdistan_desc:0 "Курдские повстанческие группировки на севере Ирака десятилетиями сражались за создание собственного государства на иракских землях, но раз за разом терпели неудачу. Курдский народ — наши братья, наследие имперского величия Персии. Курды обретут долгожданное освобождение через вхождение в состав нового Ирана!"
 PER_claim_iraqi_kurdistan1_tt:0 "Открывает решение: §Y«Реинтегрировать восточную дельту Тигра»§!"
 PER_claim_iraqi_kurdistan2_tt:0 "Открывает решение: §Y«Реинтегрировать Мосул»§!"
 PER_integrate_the_eastern_tigris_delta:0 "Интегрировать восточную дельту Тигра"
 PER_reintegrate_mosul:0 "Реинтегрировать Мосул"
 PER_claim_the_anatolian_far_east:0 "Претендовать на дальний восток Анатолии"
 PER_claim_the_anatolian_far_east_desc:0 "Курдские повстанческие группировки по всей Анатолии прошли через ад во имя создания курдского государства, но, несмотря на все усилия, так ничего и не добились. Курды обретут долгожданное освобождение через вхождение в состав нового Ирана!"
 PER_claim_the_anatolian_far_east1_tt:0 "Открывает решение: §Y«Реинтегрировать Ван»§!"
 PER_claim_the_anatolian_far_east2_tt:0 "Открывает решение: §Y«Реинтегрировать Хаккяри»§!"
 PER_reintegrate_hakkari:0 "Реинтегрировать Хаккяри"
 PER_reintegrate_van:0 "Реинтегрировать Ван"
 PER_reclaim_our_caucasian_holdings:0 "Вернуть наши владения на Кавказе"
 PER_reclaim_our_caucasian_holdings_desc:0 "Кавказ обеспечивает нам законный выход к Чёрному морю и не раз служил надёжным рубежом против иноземных вторжений. Мы немедленно вернём эти земли по праву!"
 PER_solidify_dominance_over_the_persian_gulf:0 "Закрепить господство в Персидском заливе"
 PER_solidify_dominance_over_the_persian_gulf_desc:0 "Персидский залив — это наш задний двор и связь с миром. Мы должны ясно дать понять миру, что это наше, и что так будет всегда!"
 PER_paniranism:0 "Паниранизм"
 PER_reza_shah_modernizer_new:0 "Поверхностный модернизатор"
 PER_shah_of_iran_trait:0 "Шах Ирана"
 PER_reza_shah_cavalry_officer:0 "Ветеран казачьих войск"
 PER_reza_shah_cav_officer_tt:0 "  - Стоимость всего военного командования: §G-15%§!"
 PER_SHIP_NAMES_CITIES:0 "Города"
 PER_SHIP_NAMES_MOUNTAINS:0 "Горы"
 PER_SHIP_NAMES_PROVINCES:0 "Провинции"
 PER_SHIP_NAMES_ANIMALS:0 "Животные"
 PER_SHIP_NAMES_MONARCHS:0 "Монархи"
 PER_SHIP_NAMES_SYMBOLS:0 "Культурные символы"
 PER_SHIP_NAMES_NUMERICAL_I:0 "Нумерованные (I)"
 PER_SHIP_NAMES_NUMERICAL_T:0 "Нумерованные (T)"
 PER_anglo_iranian_oil_company:0 "Англо-персидская нефтяная компания"
 PER_anglo_iranian_oil_company_desc:1 "После открытия нефти в Месджеде-Солеймане была создана Англо-персидская нефтяная компания. Она получила монополию на нашу нефть и серьёзно препятствует развитию экономики. Теперь перед нами выбор: склониться перед британским превосходством или погибнуть в борьбе с ним."
 PER_continue_modernisation_of_the_army:0 "Продолжить модернизацию армии"
 PER_continue_modernisation_of_the_army_desc:0 ""
 PER_adopt_western_style_military_bureaucracy:0 "Перенять западную военную бюрократию"
 PER_adopt_western_style_military_bureaucracy_desc:0 "Бывшая династия Каджаров пренебрегала созданием постоянной иранской армии вплоть до своего падения в 1925 году. Хотя мы быстро выделили дополнительные средства вооружённым силам Ирана, они по-прежнему находятся в плачевном состоянии: молодые некомпетентные офицеры и дезорганизованное командование родами войск подрывают их эффективность. Заимствование иностранной структуры командования и военной иерархии повысит боеспособность постоянной армии. "
 PER_continue_sending_cadets_abroad:0 "Продолжить отправку курсантов за границу"
 PER_continue_sending_cadets_abroad_desc:0 "Современный генеральный штаб держится на компетентных офицерах и командирах. Их можно обучать за рубежом, благодаря чему правительство получит знания о новых военных тактиках и технологиях."
 PER_invite_foreign_officers:0 "Пригласить иностранных офицеров"
 PER_invite_foreign_officers_desc:0 "Наши солдаты не могут годами ждать, пока за границей подготовят надёжных иранских офицеров. Если мы хотим как можно скорее создать постоянную армию, квалифицированные иностранные специалисты должны уже сейчас руководить подготовкой наших сухопутных войск и наблюдать за ней! "
 PER_continue_using_western_doctrines:0 "Продолжить следовать западным доктринам"
 PER_continue_using_western_doctrines_desc:0 "Британское и французское влияние ощущается во всех областях нашей внутренней и внешней политики: промышленности, добыче ресурсов, экономическом сотрудничестве, экспорте и импорте, а теперь ещё и в армии. Тщательно спланированная оборона и надлежащее укрепление позиций принесут пользу не только вооружённым силам, но и нашему режиму. "
 PER_adopt_german_doctrines:0 "Перенять германские доктрины"
 PER_adopt_german_doctrines_desc:0 "Германия успешно оправилась от последствий Версальского договора, и её армии сильны как никогда. Мы последуем её примеру и примем доктрины, отдающие предпочтение танкам и моторизованной технике. Хотя каучука у нас немного, нефти более чем достаточно для снабжения крупных бронетанковых сил. "
 PER_rely_on_artillery_firepower:0 "Положиться на огневую мощь артиллерии"
 PER_rely_on_artillery_firepower_desc:0 "Великая война показала, что пехота должна идти в прямую атаку лишь после массированной артиллерийской подготовки. При наших ограниченных природных и людских ресурсах улучшение взаимодействия артиллерии и пехоты может стать лучшим решением для сухопутных войск."
 PER_adopt_soviet_tactics:0 "Перенять советскую тактику"
 PER_adopt_soviet_tactics_desc:0 "Наш крупный северный сосед и исторический противник с середины XVII века усовершенствовал свою доктрину с учётом огромных людских резервов. Трагедия последних русско-персидских войн не повторится, если мы последуем тем же доктринальным путём."
 PER_adopt_guerilla_tactics:0 "Перенять партизанскую тактику"
 PER_adopt_guerilla_tactics_desc:0 "Высокие горы, узкие долины и бескрайние пустыни образуют естественные оборонительные рубежи нашей страны. Если враги пересекут наши границы, их встретят упорное сопротивление вооружённых сил, широкая партизанская деятельность в тылу и борьба до последней пули за каждый метр нашей земли!"
 PER_revise_universal_drafting_law:0 "Пересмотреть закон о всеобщем призыве"
 PER_revise_universal_drafting_law_desc:0 "Многие представители интеллигенции и квалифицированные рабочие принесут куда больше пользы в армии в качестве специалистов или служащих гражданских ведомств. Положение закона о призыве, согласно которому служить должен «лишь один мужчина из десяти», по-видимому, значительно повысит эффективность армии."
 PER_maintain_universal_drafting:0 "Сохранить всеобщий призыв"
 PER_maintain_universal_drafting_desc:0 "Закон о всеобщей воинской повинности 1925 года гласит, что «каждый мужчина, независимо от региона или племени, достигший 21 года, обязан отслужить два года». Однако закон можно слегка изменить, чтобы резко увеличить число призывников в армии."
 PER_rifles_modernisation:0 "Модернизация винтовок"
 PER_rifles_modernisation_desc:0 "Наши войска полагаются на устаревшее пехотное снаряжение, часть которого относится ещё ко временам Великой войны или даже прошлого столетия. Если иранским солдатам предстоит сражаться за страну, им понадобится лучшее оружие, которым мы можем их обеспечить."
 PER_terrain_specialization:0 "Специализация по типам местности"
 PER_terrain_specialization_desc:0 "Разнообразный климат и рельеф нашей страны означают, что сухопутным войскам придётся сражаться в суровых условиях, серьёзно ограничивающих их максимальную эффективность. Для решения этой проблемы можно профинансировать создание специализированных частей, способных действовать в труднопроходимой местности."
 PER_develop_logistic_bataillons:0 "Развить батальоны обеспечения"
 PER_develop_logistic_bataillons_desc:0 "Эффективность сухопутных войск можно значительно повысить, включив в структуру существующих дивизий разведывательные и инженерные батальоны для ведения разведки и возведения укреплений."
 PER_motorize_the_cavalry:0 "Модернизировать кавалерию"
 PER_motorize_the_cavalry_desc:0 "С изобретением пулемёта кавалерия утратила прежнее значение как фронтовой род войск. Гражданская война в России и государственный переворот 1921 года давно остались в прошлом. Нам следует стремиться к вооружённым грузовикам, сочетающим подвижность, организованность и автономность."
 PER_import_tanks_designs:0 "Импортировать проекты танков"
 PER_import_tanks_designs_desc:0 "Танки олицетворяют будущее современной войны, и наши специалисты это ясно понимают. К сожалению, у нас нет ни достаточной научной, ни промышленной базы для крупных танковых программ уровня великих держав, однако мы можем приобрести несколько их моделей и изучить их на своих предприятиях. Возможно, это принесёт достойные результаты."
 PER_modernise_our_artillery:0 "Модернизировать нашу артиллерию"
 PER_modernise_our_artillery_desc:0 "Сухопутная пехота значительно выиграет от более мощных, компактных и простых в обращении артиллерийских систем. Средства уже выделены и готовы поддержать соответствующие исследовательские группы."
 PER_counter_enemy_armor:0 "Противостоять вражеской бронетехнике"
 PER_counter_enemy_armor_desc:0 "Наши враги могут использовать танки для прорыва обороны на равнинных территориях запада и севера. Новейшие противотанковые орудия сведут эти попытки на нет."
 PER_counter_enemy_bombers:0 "Противостоять вражеским бомбардировщикам"
 PER_counter_enemy_bombers_desc:0 "Если у противника не окажется танков, он может попытаться нанести ущерб нашим войскам с воздуха, применяя пикирующие, тактические или даже стратегические бомбардировщики. Фронтовые батальоны, оснащённые зенитными орудиями, положат конец этой угрозе."
 PER_local_fighters_development:0 "Разработка отечественных истребителей"
 PER_local_fighters_development_desc:0 "Нынешние международные отношения могут позволить нам закупать истребители и их проекты у великих держав, однако в случае вооружённого конфликта у наших границ мы окажемся зависимы исключительно от отечественных производителей. Укрепление государственного контроля и расширение поддержки собственной отрасли лёгкой авиации принесут стране огромную пользу."
 PER_separate_the_air_force:0 "Выделить ВВС в отдельный вид войск"
 PER_separate_the_air_force_desc:0 "Как бы ни было заманчиво сохранить прежний порядок, нам следует разделить сухопутные и воздушные силы на самостоятельные виды войск, ограничив тем самым власть военачальников и их контроль над всей армейской системой. Чрезмерная власть армии никогда не приводила ни к чему хорошему, о чём свидетельствуют многочисленные революции и восстания последних лет."
 PER_maintain_air_land_links:0 "Сохранить взаимодействие авиации и сухопутных войск"
 PER_maintain_air_land_links_desc:0 "Лучшие результаты достигаются благодаря сотрудничеству, и наши вооружённые силы должны служить тому примером. Авиация прикрывает и поддерживает наземные войска, а те, в свою очередь, защищают её зенитным вооружением."
 PER_air_officers_academy:0 "Техническая офицерская академия ИИВВС"
 PER_air_officers_academy_desc:0 "Императорские иранские военно-воздушные силы (ИИВВС) были созданы в 1920 году и до сих пор получали лишь ограниченное финансирование. Чтобы сохранить господство в небе в случае вооружённого конфликта, необходимо построить новую офицерскую академию, которая обеспечит нас квалифицированными пилотами и авиационными командирами."
 PER_independent_bombers_bataillons:0 "Независимые бомбардировочные батальоны"
 PER_independent_bombers_bataillons_desc:0 "Огромные воздушные пространства Ближнего Востока и Персидского залива смогут находиться под контролем наших бомбардировочных экипажей, если мы создадим в каждом регионе несколько независимых бомбардировочных батальонов. Правительство выделило дополнительные денежные резервы для поддержки их роста и развития."
 PER_cas_troops_assistance:0 "Поддержка войск штурмовой авиацией"
 PER_cas_troops_assistance_desc:0 "Поддержка сухопутных войск является главной задачей нынешних полков пикирующих бомбардировщиков. Однако многие модели устарели и во время учений подвергают опасности жизни наших лётчиков и наземных военнослужащих. Чтобы решить эту проблему, мы должны быть готовы вложиться в более новые и совершенные проекты самолётов непосредственной авиационной поддержки."
 PER_ghale_morghi_air_bases:0 "Авиабазы Гале-Морги"
 PER_ghale_morghi_air_bases_desc:0 "Расширение авиабазы Гале-Морги за пределами Тегерана создаст дополнительный плацдарм для подготовки и проведения операций Восточного командования ИИВВС."
 PER_anti_aircraft_defense:0 "Противовоздушная оборона"
 PER_anti_aircraft_defense_desc:0 "Мы не можем допустить, чтобы в случае внезапного нападения противника наши авиационные эскадрильи были уничтожены ещё до взлёта. Необходимо расширить наземную противовоздушную оборону и укрепить аэродромы до того, как война достигнет наших границ и воздушного пространства!"
 PER_separate_the_navy:0 "Выделить флот в отдельный вид войск"
 PER_separate_the_navy_desc:0 "Каждый вид наших вооружённых сил должен иметь собственное верховное командование, деятельность которого правительство сможет ясно контролировать. Сосредоточение власти в одних руках может привести страну к катастрофическим последствиям."
 PER_maintain_navy_land_links:0 "Сохранить взаимодействие флота и сухопутных войск"
 PER_maintain_navy_land_links_desc:0 "Наши территориальные воды защищены слабо: британские и французские корабли постоянно заходят в наши воды Персидского залива, а российские военно-морские силы господствуют на Каспии. Защита территориальных вод и побережья потребует тесного взаимодействия флота и сухопутных войск, которое мы сейчас и поощряем."
 PER_ensure_commercial_protection:0 "Обеспечить защиту торговли"
 PER_ensure_commercial_protection_desc:0 "Торговые пути Персидского залива и Аравийского моря могут потребовать дополнительной защиты, которую способны обеспечить наши новые военно-морские силы и усовершенствованные доктрины."
 PER_dominate_the_persian_gulf:0 "Господствовать в Персидском заливе"
 PER_dominate_the_persian_gulf_desc:0 "Среди всех независимых стран Востока, имеющих выход к Персидскому заливу, именно мы обладаем самым протяжённым побережьем и крупнейшим флотом, что лишь подтверждает идею иранского господства в заливе. "
 PER_expand_shipbuilding_capacities:0 "Расширить судостроительные мощности"
 PER_expand_shipbuilding_capacities_desc:0 "Наш крупнейший порт, военно-морская база и оперативный центр в Бендер-Аббасе нуждаются в расширении, если мы хотим создать флот, способный защищать наши морские интересы в заливе и по всему миру.  "
 PER_hunt_the_submarines:0 "Охотиться на подводные лодки"
 PER_hunt_the_submarines_desc:0 "Во время Великой войны Германия перешла к неограниченной подводной войне. Новейшие модели субмарин с постоянно растущей дальностью действия, а также усиливающаяся напряжённость во всём мире заставляют нас уделить особое внимание защите торговых судов и морских путей от этой угрозы. "
 PER_submarines_experimentations:0 "Эксперименты с подводными лодками"
 PER_submarines_experimentations_desc:0 "Одного господства в заливе недостаточно. Если мы хотим распространить влияние дальше в открытое море, нам потребуется экономичное, манёвренное и мощное средство. Подводные лодки отвечают всем требованиям, и мы должны вложиться в их разработку."
 PER_carrier_development:0 "Разработка авианосцев"
 PER_carrier_development_desc:0 "Авианосцы, по всей видимости, играют важную роль во всех морских операциях великих держав. Нам следует попытаться найти средства для разработки и совершенствования этих плавучих аэродромов."
 PER_corrupted_bureaucracy:0 "Коррумпированная бюрократия"
 PER_trial_of_the_fifty_three_idea:0 "Репрессии против социализма"
 PER_trial_of_the_fifty_three_idea_desc:0 "Многие сторонники коммунистической революции и партии «Туде» Ирана охотно использовали своё образование, уважаемое положение в обществе и иностранные связи, чтобы влиять на мировоззрение нашего народа и отвратить его от нас. Пятьдесят три сторонника были арестованы и теперь предстанут перед справедливым судом в рамках одного из самых громких политических процессов в истории Ирана."
 PER_maintain_the_armys_privileges:0 "Главное"
 PER_continue_governmental_purges:0 "Продолжить правительственные чистки"
 PER_continue_government_purges:0 "Продолжить правительственные чистки"
 PER_continue_government_purges_desc:0 "Чем дольше мы позволяем политику укрепляться на своём посту, тем выше вероятность, что он попытается освободиться от королевского влияния. Чтобы этого не произошло, потребуется прибегнуть к принудительным отставкам."
 PER_increase_funds_for_the_army:0 "Увеличить финансирование армии"
 PER_increase_funds_for_the_army_desc:0 "Армия является одной из главных опор власти шаха. Офицеры получают намного больше других служащих. Увеличив военный бюджет, мы обеспечим сохранение её верности."
 PER_diplomatic_balance:0 "Дипломатическое равновесие"
 PER_diplomatic_balance_desc:0 "Нынешняя международная обстановка и давление со всех сторон не оставляют нам иного выбора, кроме как сосредоточиться на внутренней политике и провозгласить нейтральный внешнеполитический курс в надежде сохранить суверенитет."
 PER_reaffirm_friendship_with_turkey:0 "Подтвердить дружбу с Турцией"
 PER_reaffirm_friendship_with_turkey_desc:0 "Сходное прошлое наших стран, а также продолжающаяся тюркизация и персизация меньшинств позволяют нам увидеть общую цель — создание сильных и единых стран на Ближнем Востоке. Многочисленные дипломатические визиты восстановили дружественные отношения между нашим и турецким правительствами.  "
 PER_between_giants:0 "Между гигантами"
 PER_between_giants_desc:0 "Наша крупная, но хрупкая страна расположена на перекрёстке мира: с севера нас окружают силы [SOV.GetAdjective], а с юга — [ENG.GetAdjective]. Великие державы пристально следят за политикой нашей страны и устойчивостью режима. Возможно, это особое положение удастся обратить себе на пользу?"
 PER_forced_secularization_r56:0 "Принудительная секуляризация"
 PER_forced_secularization_r56_desc:0 "Первым шагом перехода от устаревшего средневекового общества к современному индустриальному должна стать ясная и заметная граница между религией и государственным аппаратом. Ислам глубоко укоренён в культуре нашего народа, но для успешного выхода на мировую арену нам придётся приспособиться к её требованиям, невзирая на цену и жертвы."
 PER_trial_of_the_fifty_three:0 "Процесс пятидесяти трёх"
 PER_trial_of_the_fifty_three_desc:0 "Многие сторонники коммунистической революции и партии «Туде» Ирана охотно использовали своё образование, уважаемое положение в обществе и иностранные связи, чтобы влиять на мировоззрение нашего народа и отвратить его от нас. Пятьдесят три сторонника были арестованы и теперь предстанут перед справедливым судом в рамках одного из самых громких политических процессов в истории Ирана."
 PER_secular_nationalism:0 "Светский национализм"
 PER_secular_nationalism_desc:0 "Религиозная вера всё ещё может жить в умах и сердцах наших солдат и офицеров. Мы должны напомнить войскам, что истинные ценности заключены не в вере, а в стране, её руководстве, внутренней и внешней политике. Они сражаются за наш народ и только за него."
 PER_encourage_german_trade:0 "Поощрять торговлю с Германией"
 PER_encourage_german_trade_desc:0 "Многие годы мы укрепляли дипломатические и экономические связи с германскими друзьями, поскольку Германия была единственной европейской державой без империалистических притязаний на Ближнем Востоке. Иранские и германские инженеры, проектировщики и строители трудятся плечом к плечу, совершенствуя нашу страну и приводя слаборазвитую промышленность к современным стандартам."
 PER_pro_german_diplomacy:0 "Прогерманская дипломатия"
 PER_pro_german_diplomacy_desc:0 "У русских и британцев есть собственные планы на нашу страну в их новой Большой игре. Чтобы обеспечить независимость, господство в Персидском заливе и, возможно, на всём Ближнем Востоке, нам нужна поддержка ещё одной великой державы. Потребность Германии в нефти и поддержка нашей страны в её политической программе создают прекрасную основу для взаимовыгодного союза."
 PER_steel_deals:0 "Сделки по стали"
 PER_steel_deals_desc:0 "Отдаление от Британии и поддержка германских интересов в регионе могут навредить нашей экономике в краткосрочной перспективе, но долговременная выгода того стоит. Недостаток нефти и избыток стали в Германии хорошо известны, поэтому мы заключим соглашение и получим свою долю торговли как равные партнёры."
 PER_restore_constitutionalism:0 "Восстановить конституционализм"
 PER_restore_constitutionalism_desc:0 "Абсолютизм привёл лишь к повсеместной коррупции в администрации и глубокому расколу общества [ROOT.GetAdjective]. Если [ROOT.GetNonIdeologyName] желает добиться настоящего прогресса, власть необходимо вернуть народу."
 PER_prime_minister_foroughi:0 "Премьер-министр Форуги"
 PER_prime_minister_foroughi_desc:0 "Светская прогрессивная Партия возрождения Ирана, также известная как Хезб-е Таджаддод, сформирует новое коалиционное правительство, а один из её ветеранов, Мохаммад-Али Форуги, займёт пост премьер-министра на переходный период."
 PER_declare_the_shah_a_traitor:0 "Объявить шаха предателем"
 PER_declare_the_shah_a_traitor_desc:0 ""
 PER_align_the_army:0 "Привлечь армию на свою сторону"
 PER_align_the_army_desc:0 "Одним из пунктов программы Партии возрождения было создание сильной и модернизированной иранской армии. Но прежде чем проводить реформы, необходимо разобраться с многочисленными соперничающими генералами, своевольными командирами и мятежными солдатами."
 PER_increase_education_funds:0 "Увеличить расходы на образование"
 PER_increase_education_funds_desc:0 "Высокая неграмотность в сельской местности мешает превращению нашей страны в современное прогрессивное общество. Решением станет направление дополнительных средств в систему образования."
 PER_reform_the_tax_system:0 "Реформировать налоговую систему"
 PER_reform_the_tax_system_desc:0 "Чтобы избавиться от остатков коррумпированного бюрократического аппарата шаха, необходимо вновь ввести ряд налогов для богатых, одновременно снизив их для бедных земледельцев, рыбаков и промышленных рабочих."
 PER_align_with_britain:0 "Сблизиться с Британией"
 PER_align_with_britain_desc:0 "Теперь мы разделяем веру западных держав в демократические ценности. Для сохранения недавно созданных демократических институтов нам нужны сильные союзники. Британия или Франция наверняка примут нас с распростёртыми объятиями."
 PER_renegociate_oil_agreements:0 "Пересмотреть нефтяные соглашения"
 PER_renegociate_oil_agreements_desc:0 "Наши солдаты сражаются плечом к плечу, а дипломаты обсуждают внешнюю политику за одним столом. Британцы заручились нашей поддержкой, но бремя Англо-персидской нефтяной компании серьёзно вредит престижу и образу правительства в глазах мира. Мы созданы равными, а значит, наш народ должен получать справедливую долю нефтяных прибылей. Переговоры уже идут..."
 PER_rally_around_mosaddegh:0 "Сплотиться вокруг Мосаддыка"
 PER_rally_around_mosaddegh_desc:0 "После захвата власти Резой-шахом Пехлеви в 1925 году один из поборников иранской светской демократии, Мохаммад Мосаддык, отошёл от политики. Недавнее распространение демократических ценностей и развитие демократических институтов позволяют создать новый «Национальный фронт» — коалицию либеральных демократов, националистов и даже социалистов во главе с Мохаммадом Мосаддыком. "
 PER_de_militarize_politics:0 "Демилитаризовать политику"
 PER_de_militarize_politics_desc:0 "Слишком долго армию и правительство считали единым неразделимым целым. Чтобы продемонстрировать мирные намерения и готовность к переговорам, необходимо исключить любое вмешательство военных во внутреннюю политику."
 PER_nationalize_aioc:0 "Национализировать АПНК"
 PER_nationalize_aioc_desc:0 "Последняя речь Мохаммада Мосаддыка была встречена в Европе мёртвой тишиной. «За счёт доходов АПНК мы могли бы покрыть весь бюджет и бороться с бедностью, болезнями и отсталостью народа. ... Иран намерен изгнать иностранных нефтяных специалистов, а затем закрыть нефтяные объекты»."
 PER_land_reform_act:0 "Закон о земельной реформе"
 PER_land_reform_act_desc:0 "Средства, высвободившиеся после сокращения военного бюджета, можно использовать для более справедливого распределения богатства и земли между населением и предприятиями."
 PER_reform_the_administration:0 "Реформировать администрацию"
 PER_reform_the_administration_desc:0 "Бюрократический аппарат бывшего шаха по-прежнему глубоко укоренён в нашей административной системе. Мы должны направить все силы и ресурсы на искоренение его остатков."
 PER_anti_imperialist_position:0 "Антиимпериалистическая позиция"
 PER_anti_imperialist_position_desc:0 "Демократические принципы нынешнего иранского правительства лишь внешне напоминают западные. Однако мы не скрываем имперские и колониальные амбиции за маской «защиты демократии». Мы должны стать щитом против любого угнетения со стороны Запада!"
 PER_the_sadabat_pact:0 "Саадабадский пакт"
 PER_the_sadabat_pact_desc:0 "Многие народы Ближнего Востока разделяют нашу веру в самоопределение и самоуправление. Закрепление связей договором о ненападении улучшит наше дипломатическое положение во всём регионе."
 PER_lead_the_way:0 "Указать путь"
 PER_lead_the_way_desc:0 "Раз уж демократические правила приходится утверждать силой, так тому и быть: мы заложим основу независимой панарабской конфедерации, способной защитить каждый угнетённый или униженный народ."
 PER_appoint_zahedi:0 "Назначить Захеди"
 PER_appoint_zahedi_desc:0 "Фазлолла Захеди, глава национальной полиции, обладает значительным влиянием в армии и политике. Он также поддерживает связи с несколькими радикальными и националистическими иранскими организациями. Назначив его премьер-министром, мы сможем привлечь эти организации в правительство и открыть путь к возрождению иранского общества."
 PER_halt_religious_persecutions:0 "Прекратить религиозные преследования"
 PER_halt_religious_persecutions_desc:0 "Нынешнее правление шаха отмечено жёсткой политикой секуляризации, уже вынудившей многих талантливых и умелых людей отправиться в изгнание или скрываться. Помощь простым людям позволит стабилизировать положение и, возможно, приобрести могущественного союзника."
 PER_religious_militarism:0 "Религиозный милитаризм"
 PER_religious_militarism_desc:0 "На протяжении веков религия и власть были неразделимы в персидском и арабском мирах. Нашу особую веру и её исламские ценности можно эффективно использовать в армии и военных кампаниях."
 PER_embrace_persian_identity:0 "Принять персидскую идентичность"
 PER_embrace_persian_identity_desc:0 "Подлинная идентичность нашей страны восходит к Персидской империи, принёсшей цивилизацию и прогресс на огромные пространства Ближнего Востока, Малой Азии и Балкан. Мы были колыбелью одной из величайших империй всех времён, и теперь пора явить миру нашу истинную сущность!"
 PER_crush_religious_resistance:0 "Сокрушить религиозное сопротивление"
 PER_crush_religious_resistance_desc:0 "Персидская империя объединяла людей общей экономической политикой, социальной справедливостью, технологической модернизацией, равенством и протодемократическими ценностями, а не верой в высшие силы. Если мы хотим вернуть заслуженные славу и признание, необходимо покончить с религиозным экстремизмом по всей стране."
 PER_strategic_nationalizations:0 "Стратегическая национализация"
 PER_strategic_nationalizations_desc:0 "Британские махинации на мировом рынке вывели Англо-персидскую нефтяную компанию из-под контроля нашего правительства. Единственный способ построить сильный Иран — национализировать компанию и направить её ресурсы на развитие местной экономики. Британцы этого не потерпят, но кто дал им право решать за нас?"
 PER_reorganization_of_the_state:0 "Реорганизация страны"
 PER_reorganization_of_the_state_desc:0 "По мере роста популярности Фазлоллы Захеди в правительстве и поддержки его программы среди населения становится ясно, откуда исходят приказы и где находится настоящее руководство. Номинальная фигура шаха больше не нужна, и Фазлолла Захеди наконец может возглавить правительство."
 PER_diplomatic_independence:0 "Дипломатическая независимость"
 PER_diplomatic_independence_desc:0 "Союз с другими европейскими фашистскими державами может показаться выгодным, но он наверняка помешает освобождению Ближнего Востока от колонизаторов. Наша страна сама проложит путь к региональному и мировому господству."
 PER_heroic_sacrifice:0 "Героические жертвы"
 PER_heroic_sacrifice_desc:0 "Мы никогда не забудем героев, отдавших жизни за наше дело. Их имена и свершения послужат продвижению нашей программы и убедят каждого быть готовым умереть за страну."
 PER_agressive_pan_iranism:0 "Агрессивный паниранизм"
 PER_agressive_pan_iranism_desc:0 "Многие земли давно исчезнувшей Персидской империи в Центральной Азии можно вернуть, пообещав им светлое и процветающее будущее под нашей властью."
 PER_retake_afghanistan:0 "Вернуть Афганистан"
 PER_retake_afghanistan_desc:0 "Сто лет назад династия Каджаров пыталась захватить афганскую крепость Герат во время Большой игры в Центральной Азии, но потерпела неудачу. С модернизированной армией, поддержкой авиации и верой народа в наше дело на этот раз мы не проиграем."
 PER_reclaim_iraq:0 "Вернуть Ирак"
 PER_reclaim_iraq_desc:0 "Несправедливое распределение доходов от Арвандруда, преследование шиитского меньшинства и рост иракского национализма не оставляют нам иного выбора, кроме восстановления законной власти над этой страной."
 PER_our_central_asian_brothers:0 "Наши братья в Центральной Азии"
 PER_our_central_asian_brothers_desc:0 "Центральная Азия больше не будет склоняться перед русским, китайским или британским сапогом. Тюркские народы, восстаньте против угнетателей и сбросьте оковы колониализма!"
 PER_revive_the_jungle_movement:0 "Возродить Джангали"
 PER_revive_the_jungle_movement_desc:0 "Движение Джангали, также известное как Гилянское движение, остаётся важнейшим примером борьбы за коммунистическое дело в нашей стране. Люди из разных мест и регионов объединились, чтобы свергнуть династию Каджаров. Мы должны возродить дух единения под Красным знаменем, низложить нынешнюю монархию и создать социалистический Иран."
 PER_acquire_soviet_support:0 "Заручиться советской поддержкой"
 PER_acquire_soviet_support_desc:0 "Союз Советских Социалистических Республик, наш северный сосед, играет решающую роль в обеспечении успеха нашей революции. Мы нуждаемся в материальной помощи Советов, чтобы добиться успеха в формировании коммунистической утопии на Ближнем Востоке."
 PER_assemble_the_tudeh_party:0 "Собрать партию «Туде»"
 PER_assemble_the_tudeh_party_desc:0 "Партия «Туде» Ирана является главной коммунистической силой страны. Пришло время вновь собрать её сторонников, положить конец монархии и вернуть дух рабочего движения."
 PER_recreate_the_persian_socialist_soviet_republic:0 "Воссоздать Персидскую ССР"
 PER_recreate_the_persian_socialist_soviet_republic_desc:0 "Час настал. При поддержке Советского Союза и партии «Туде» пришло время свергнуть династию Пехлеви. Рабочие и крестьяне достаточно натерпелись от монархии. Пора отомстить. Вперёд, товарищи!"
 PER_nationalize_the_means_of_production:0 "Национализировать средства производства"
 PER_nationalize_the_means_of_production_desc:0 "Национализация превращает частную собственность буржуазии в общественные активы, доступные каждому. Чтобы полностью воплотить коммунистический дух и не допустить захвата средств производства буржуазией, мы должны национализировать их."
 PER_land_reforms:0 "Земельные реформы"
 PER_land_reforms_desc:0 "Нет ничего хуже крестьянина без земли или рабочего без места у станка. Недавно приобретённые средства производства следует реорганизовать и поровну распределить среди населения. Власть народу!"
 PER_federalize_the_nation:0 "Федерализировать страну"
 PER_federalize_the_nation_desc:0 "Федерализм доказал свою эффективность во многих странах мира. Нам тоже пора принять эту систему, разделив страну на полуавтономные субъекты с представительством в парламенте."
 PER_islamic_socialism_focus:0 "Исламский социализм"
 PER_islamic_socialism_focus_desc:0 "Хотя для построения подлинно коммунистического общества необходим атеизм, ислам глубоко укоренён среди народа Персии. Чтобы сохранить доверие населения к новому режиму, мы должны соединить социалистическую политику с исламом."
 PER_promote_atheism:0 "Продвигать атеизм"
 PER_promote_atheism_desc:0 "Необходимо хранить верность коммунистическим принципам. Все люди созданы равными, и над ними нет высшего существа. Чтобы следовать пути Маркса, мы должны насаждать поддерживаемый государством атеизм независимо от желания народа."
 PER_align_with_the_soviets:0 "Сблизиться с Советами"
 PER_align_with_the_soviets_desc:0 "Хотя наши идеалы не во всём совпадают с советскими, их революция вдохновила нашу. Было бы противно коммунистическому духу не поддержать более крупную и сильную коммунистическую страну в её стремлении распространить революцию по всему миру."
 PER_persian_way_to_socialism:0 "Персидский путь к социализму"
 PER_persian_way_to_socialism_desc:0 "Да, Советы помогли нам создать славный союз. Да, они заслуживают вознаграждения. Но получат ли они его? Нет! Наш коммунизм отличается от кровавого коллективистского общества. Он стремится объединить народ мирным путём и не имеет ничего общего с ужасами коллективизации."
 PER_soviet_economic_help:0 "Советская экономическая помощь"
 PER_soviet_economic_help_desc:0 "После создания Персидской СФСР и укрепления связей с большевистскими братьями на севере пора заняться экономикой. Советские займы и инвестиции помогут восстановить её и вновь сделать величайшей на Ближнем Востоке!"
 PER_control_the_strait:0 "Контролировать пролив"
 PER_control_the_strait_desc:0 "Босфорские проливы имеют критическое стратегическое значение. Тот, кто контролирует Босфор, определяет торговые пути Румынии, Болгарии и Советского Союза. Захват проливов обеспечит нам монополию на босфорскую торговлю и одновременно поможет северным союзникам."
 PER_liberation_of_arabia:0 "Освобождение Аравии"
 PER_liberation_of_arabia_desc:0 "Арабские монархии слишком долго угнетали свой народ — женщин, мужчин, детей и рабочих. Пора освободить людей от власти монархий Саудовской Аравии, Омана и Ирака. Наши товарищи по оружию на западе нуждаются в нас — бросимся же им на помощь всеми силами!"
 PER_finish_the_trans_iranian_railway:0 "Завершить Трансиранскую железную дорогу"
 PER_finish_the_trans_iranian_railway_desc:0 "Любое развитие Ирана начинается с совершенствования путей сообщения. Проект Трансиранской железной дороги был запущен в 1927 году исключительно на отечественный капитал. Завершив его, мы лучше свяжем Тегеран с торговыми путями, особенно с южными портами."
 PER_foreign_exchange_controls:0 "Валютный контроль"
 PER_foreign_exchange_controls_desc:0 "Рост международной торговли должен сопровождаться государственным регулированием, чтобы она и дальше приносила стране пользу."
 PER_increase_machines_import:0 "Увеличить импорт станков"
 PER_increase_machines_import_desc:0 "Для расширения промышленного производства потребуются новые станки. Пока мы не способны выпускать их самостоятельно, поэтому договорились об увеличении импорта."
 PER_increase_textile_production:0 "Увеличить производство текстиля"
 PER_increase_textile_production_desc:0 "Текстильная промышленность развивалась главным образом в районах Тебриза и Исфахана, а государство уже запланировало строительство множества новых фабрик."
 PER_secure_weapon_deals:0 "Заключить оружейные сделки"
 PER_secure_weapon_deals_desc:0 "В снабжении армии мы пока сильно зависим от импортного снаряжения. Если хотим расширить вооружённые силы, придётся увеличить военный импорт."
 PER_expand_tehran_university:0 "Расширить Тегеранский университет"
 PER_expand_tehran_university_desc:0 "Тегеранский университет, официально открытый в 1934 году, стал огромным шагом вперёд в развитии образования и превращении Тегерана в настоящую столицу мирового уровня. Он олицетворяет будущее Ирана и заслуживает всей возможной поддержки."
 PER_sugar_exports:0 "Экспорт сахара"
 PER_sugar_exports_desc:0 "В рамках реформы аграрного сектора в Иране появились новые культуры, прежде всего сахарная свёкла. Затем было построено множество сахарных заводов, которые уже производят свыше 40 000 тонн сахара в год."
 PER_shift_toward_heavy_industry:0 "Тегеранские заводы винтовок и пулемётов"
 PER_shift_toward_heavy_industry_desc:0 "Будучи наиболее развитым промышленным районом страны, Тегеран идеально подходит для создания организованного производства винтовок.  "
 PER_electronic_development:0 "Развитие электроники"
 PER_electronic_development_desc:0 "Рост промышленности и спроса на электричество уже привёл к созданию более 120 электростанций по всей стране. Многие учёные предлагают смелый переход от ручного к автоматическому управлению генераторами и производственными объектами. Однако для этого потребуются дополнительные вложения в современную электронику. "
 PER_study_nuclear_power:0 "Изучить ядерную энергию"
 PER_study_nuclear_power_desc:0 "«Бомба такой мощности способна с лёгкостью уничтожить порт и окружающие его города». Так Альберт Эйнштейн, великий германский учёный, написал американскому президенту Франклину Рузвельту. Описанная им сила поражает воображение. Если мы сумеем подчинить эту энергию, то не только добьёмся признания на международной арене, но и удержим империалистов на расстоянии."
 PER_manufacture_planes:0 "Производить самолёты"
 PER_manufacture_planes_desc:0 "Наши военно-воздушные силы сильно зависят от импорта иностранных самолётов. Однако эти машины можно успешно производить дома, укрепляя отечественную экономику и поддерживая местных изготовителей."
 PER_increase_research_funds:0 "Увеличить финансирование исследований"
 PER_increase_research_funds_desc:0 "Учёные и интеллектуалы [PER.GetAdjective] заслуживают большего, чем нынешние остатки бюджета. Увеличение расходов на образование и исследования значительно ускорит технологическое развитие. "
 PER_taslihat_e_artesh:0 "Таслихат-е Артеш"
 PER_generic_light_aircraft_manufacturer:0 "Завод Дошан-Таппе"
 PER_generic_medium_aircraft_manufacturer:0 "Буширская мастерская"
 r56_persia.1.t:0 "Смерть шаха"
 r56_persia.1.desc:0 "Реза-шах Пехлеви, олицетворявший монархию Пехлеви, умер естественной смертью. Пока его сын занимает место во главе монархии, [ROOT.GetNameDef] вспоминает годы его модернизаторского правления."
 r56_persia.1.a:0 "Прискорбно"
