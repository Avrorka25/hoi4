 SAN_the_eternal_republic_desc:0 "Согласно легенде, Сан-Марино было основано в 301 году н. э., во времена императора Диоклетиана, и с тех пор не прекращало своего существования. Эта маленькая, но вечная страна и её народ пережили многое, ведь Сан-Марино считается старейшей непрерывно существующей республикой в мире. Лишь благодаря невероятной удаче и великолепным дипломатическим манёврам Сан-Марино удалось сохранить суверенитет во времена Папской области, Наполеоновских войн и объединения Италии..."
