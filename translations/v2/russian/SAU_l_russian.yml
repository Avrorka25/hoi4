 SAU_volunteer_corps:0 "Саудовский добровольческий корпус"
 SAU_legacy_of_1934:0 "Наследие 1934 года"
 SAU_legacy_of_1934_desc:0 "Саудовско-йеменская война 1934 года наглядно показала нынешние возможности наших вооружённых сил — точнее, их недостаток. Чтобы подготовиться к возможному будущему конфликту, необходимо тщательно изучить и исправить ошибки, определившие ход войны 1934 года."
 SAU_legacy_of_1934_2_desc:0 "Саудовско-йеменская война 1934 года наглядно показала нынешние возможности наших вооружённых сил — точнее, их недостаток. Чтобы лучше подготовиться к следующей войне, необходимо тщательно изучить и исправить ошибки, определившие ход войны 1934 года."
 SAU_legacy_of_1934_3_desc:0 "Саудовско-йеменская война 1934 года наглядно показала нынешние возможности наших вооружённых сил — точнее, их недостаток. Чтобы лучше подготовиться к следующей войне, необходимо тщательно изучить и исправить ошибки, определившие ход войны 1934 года."
 SAU_legacy_of_1934_4_desc:0 "Саудовско-йеменская война 1934 года наглядно показала нынешние возможности наших вооружённых сил — точнее, их недостаток. Чтобы лучше подготовиться к следующей войне, необходимо тщательно изучить и исправить ошибки, определившие ход войны 1934 года."
