l_russian:
 saudi_focus:0 "Дерево фокусов Саудовской Аравии"
 SAU_solve_the_jafurah_dispute:0 "Разрешить спор о Джафуре"
 SAU_solve_the_jafurah_dispute_desc:0 "После Англо-османской конвенции 1913 года и окончания Великой войны англо-саудовская граница на юго-востоке так и не была окончательно размечена. Переговоры начались в последние месяцы 1935 года, но ни к чему не привели: Ибн Сауд не желал уступать. Ради собственных интересов мы должны наконец сосредоточиться на разрешении спора о Джафуре и оставить позади хотя бы одну проблему."
 SAU_reject_the_riyadh_line:0 "Отвергнуть Эр-Риядскую линию"
 SAU_reject_the_riyadh_line_desc:0 "После Англо-османской конвенции 1913 года и окончания Великой войны англо-саудовская граница на юго-востоке так и не была окончательно размечена. Переговоры начались в последние месяцы 1935 года, однако британцы предложили лишь небольшие уступки, получившие название «Эр-Риядская линия». Ради нашего народа мы не можем принять «Эр-Риядскую линию» и позволить британцам диктовать нам границы!"
 SAU_improve_our_infrastructure:0 "Улучшить инфраструктуру"
 SAU_improve_our_infrastructure_desc:0 "Наша страна покрыта как пустынями, так и высокими скалистыми горами. Но это не должно мешать интеграции сельских районов и удалённых областей: улучшение инфраструктуры поможет связать страну и её народ воедино."
 SAU_invite_foreign_investors:0 "Пригласить иностранных инвесторов"
 SAU_liberalize_the_market:0 "Либерализовать рынок"
 SAU_liberalize_the_market_desc:0 "Чем свободнее рынок, тем свободнее народ — по крайней мере, так говорят. Чтобы сблизиться с Западом, нам следует освободить рынок и сделать его привлекательнее для инвестиций крупных компаний, таких как АРАМКО."
 SAU_placate_the_tribes:0 "Умиротворить племена"
 SAU_placate_the_tribes_desc:0 "Мы никогда не должны забывать, что происходит с нашим народом и через что он прошел в эти трудные времена, но мы также не можем забывать, кто держит ключи от этой нации, которая является племенными лидерами. Чтобы стабилизировать нацию и остаться у власти, мы должны их соответствующим образом успокоить."
 SAU_diplomacy_in_the_sand:0 "Дипломатия в песках"
 SAU_continue_hakimovs_legacy:0 "Предложение Хакимова"
 SAU_continue_hakimovs_legacy_desc:0 "Карим Хакимов, личный друг короля Саудовской Аравии и дипломат СССР, имеет большое политическое и социальное влияние в Саудовской Аравии. [ROOT.GetNameDef]. Таким образом, он предлагает сделку, союз с Советским Союзом и новую идеологию, слияние нашей нынешней системы со сталинизмом."
 SAU_seek_german_arms:0 "Искать оружие [GER.GetAdjective]"
 SAU_seek_german_arms_desc:0 "Чтобы сохранить нынешний нейтралитет, мы должны как можно лучше перевооружиться: никто не станет уважать наш нейтралитет, если за ним не стоит военная сила. Поэтому разумно поискать оружие в государстве [GER.GetNameDef]; в будущем они могут оказаться полезными союзниками..."
 SAU_introduce_the_constitution:0 "Ввести конституцию [GetYear] года"
 SAU_introduce_the_constitution_desc:0 "Конституционное движение на протяжении всей истории существования государства [ROOT.GetNameDef] оставалось довольно слабым. Однако в последние месяцы оно словно обрело второе дыхание, и всё больше людей требуют разработать конституцию."
 SAU_expand_the_riyadh_university:0 "Расширить Эр-Риядский университет"
 SAU_expand_the_riyadh_university_desc:0 "Образованное население — продуктивное население. Улучшение и расширение Эр-Риядского университета поможет нам добиться успехов в борьбе с неграмотностью."
 SAU_enocurage_the_hajj:0 "Поощрять хадж"
 SAU_enocurage_the_hajj_desc:0 "Государство [ROOT.GetNameDefCap], контролирующее два величайших священных города ислама, получает большую выгоду от ежегодного притока мусульман со всего мира, совершающих священный хадж. Поэтому было бы разумно поощрять паломничество или даже обложить его налогом: больше паломников — больше денег."
 SAU_democraticize_the_administration:0 "Демократизировать управление"
 SAU_democraticize_the_administration_desc:0 "Хотя [ROOT.GetLeader] неохотно идёт на реформы, он доверяет своему народу, а народ доверяет ему. Он всегда будет стремиться делать то, что лучше для людей! Поэтому в государстве [ROOT.GetNameDef] будет введена демократическая форма правления во главе с [ROOT.GetLeader]!"
 SAU_enforce_the_zakat:0 "Обеспечить соблюдение закята"
 SAU_enforce_the_zakat_desc:0 "Закят — важнейшая часть ислама: каждый, кто способен помочь, обязан вносить вклад в поддержку бедных и беспомощных. Если задуматься, это вполне социалистическая и коммунистическая идея. Так почему бы не обеспечить её соблюдение?"
 SAU_reform_the_tax_system:0 "Реформировать налоговую систему"
 SAU_reform_the_tax_system_desc:0 "Налоговая система сильно устарела и крайне неэффективна. Ради пользы страны и народа стоит реформировать и модернизировать её."
 SAU_influence_the_king:0 "Повлиять на короля"
 SAU_influence_the_king_desc:0 "Под влиянием Карима Хакимова и других агентов [SOV.GetAdjective] в государстве [ROOT.GetNameDef] мы можем превратить [ROOT.GetLeader] в настоящего социалиста и революционера — разумеется, с его собственными принципами."
 SAU_enact_censorship:0 "Ввести цензуру СМИ"
 SAU_enact_censorship_desc:0 "Мы должны взращивать культ личности короля. Подавление и цензура антиправительственной и антимонархической прессы могут помочь превратить государство [ROOT.GetNameDef] в по-настоящему реакционную и консервативную страну."
 SAU_five_year_plan:0 "Пятилетний план"
 SAU_five_year_plan_desc:0 "Плановая экономика может принести государству [ROOT.GetNameDef] пользу, а может оказаться бесполезной и неприменимой. Но мы не сможем сказать, что попытались, если даже не попробуем, верно?"
 SAU_form_a_volunteer_force:0 "Сформировать добровольческие силы"
 SAU_form_a_volunteer_force_desc:0 "Пусть официально мы нейтральны и не примыкаем ни к одному блоку, мы ведь не можем запретить собственным гражданам уезжать и участвовать в зарубежных конфликтах, верно?"
 SAU_autonomy_for_south_arabia:0 "Автономия для Южной Аравии"
 SAU_autonomy_for_south_arabia_desc:0 "Крайне важно предоставить ограниченную автономию жителям Южной Аравии: так они охотнее будут сотрудничать с нами в будущем, а их интеграция в государство [ROOT.GetNameDef] пройдёт намного легче."
 SAU_crush_the_golden_square:0 "Сокрушить «Золотой квадрат»"
 SAU_crush_the_golden_square_desc:0 "Фашистов из «Золотого квадрата» на севере необходимо сокрушить ради нашей безопасности и благополучия, а также ради всего Ближнего Востока!"
 SAU_develop_anti_tank_capabilities:0 "Развить противотанковые возможности"
 SAU_develop_anti_tank_capabilities_desc:0 "Противодействие вражеской бронетехнике собственными противотанковыми орудиями имеет решающее значение для обороны наших земель."
 SAU_concessions_to_standard_oil:0 "Концессии «Стандард Ойл оф Калифорния»"
 SAU_concessions_to_standard_oil_desc:0 "Ранее мы уже заключали со «Стандард Ойл оф Калифорния» концессионные соглашения на разведку нефти. Теперь, когда обнаружены крупные запасы, эти соглашения можно расширить и на их эксплуатацию."
 SAU_deal_with_bp:0 "Сделка с «Бритиш Петролеум»"
 SAU_deal_with_bp_desc:0 "Ранее мы заключали со «Стандард Ойл оф Калифорния» концессионные соглашения на разведку нефти. Теперь, когда обнаружены крупные запасы, возможно, стоит пригласить «Бритиш Петролеум» заняться их эксплуатацией."
 SAU_force_tribes_to_settle:0 "Принудить племена к оседлости"
 SAU_force_tribes_to_settle_desc:0 "Кочевой образ жизни уходит в прошлое. Следует заставить кочующие племена осесть в городах и поселениях, что упростит управление и расширит промышленный потенциал."
 SAU_invite_brabag:0 "Пригласить «Брабаг»"
 SAU_invite_brabag_desc:0 "Ранее мы заключали со «Стандард Ойл оф Калифорния» концессионные соглашения на разведку нефти. Теперь, когда обнаружены крупные запасы, нам может быть выгодно пригласить германскую «Браунколе Бензин АГ» заняться эксплуатацией нефтяных месторождений."
 SAU_request_german_reinforcements:0 "Запросить германские подкрепления"
 SAU_request_german_reinforcements_desc:0 "Пригласив германские нефтяные компании разрабатывать наши новые залежи нефти, мы сделали себя мишенью. Можно запросить у Германии подкрепления для защиты активов обеих стран."
 SAU_provide_shelter_for_fritz_gobba:0 "Предоставить убежище Фрицу Гроббе"
 SAU_provide_shelter_for_fritz_gobba_desc:0 "Фриц Гробба был изгнан из Ирака после попытки разжечь в стране антибританские настроения. Его причастность к нападению на британский нефтепровод вынудила его отправиться в изгнание. Здесь ему будут рады."
 SAU_move_toward_german_alignment:0 "Сблизиться с Осью"
 SAU_move_toward_german_alignment_desc:0 "Британцы слишком долго вмешивались в дела Ближнего Востока. Пора это изменить. Нам следует сблизиться с Германией в надежде изгнать захватчиков из арабского мира."
 SAU_support_from_loyal_tribes:0 "Поддержка лояльных племён"
 SAU_support_from_loyal_tribes_desc:0 "Предоставляя земельные наделы верным племенам, мы обеспечим их долговременную лояльность."
 SAU_western_alignment:0 "Ориентация на Запад"
 SAU_western_alignment_desc:0 "Британцы были нашими союзниками в Великой войне и помогли изгнать османов из Аравии. Мы вновь объединим силы против общего врага."
 SAU_the_unifier:0 "Объединитель"
 SAU_the_unifier_desc:0 "Ибн Сауд завершил более чем трёхсотлетнюю историю завоеваний своего рода: от возвращения родного Эр-Рияда до объединения значительной части Аравии под своей властью и рождения третьего саудовского государства — Королевства Саудовская Аравия."
 SAU_our_rightful_domain:0 "Наши законные владения"
 SAU_our_rightful_domain_desc:0 "Страх перед великой Британской империей вынудил нас мириться с её унизительным присутствием во многих землях, которые мы мечтали включить в свои владения. Настало время исправить эту несправедливость."
 SAU_request_german_guns:0 "Запросить поддержку [GER.GetAdjective]"
 SAU_request_german_guns_desc:0 "Запросив германское снаряжение и технический опыт, мы сможем повысить свои возможности в ходе конфликта."
 SAU_increase_oil_exports_to_the_allies:0 "Экспорт нефти Союзникам"
 SAU_increase_oil_exportations_to_the_allies:0 "Экспортировать нефть Союзникам"
 SAU_increase_oil_exportations_to_the_allies_desc:0 "Растущая потребность Союзников в нефти открывает перед нами выгодную возможность. Увеличение добычи для удовлетворения спроса принесёт нам значительную финансовую выгоду в долгосрочной перспективе."
 SAU_USS_quincy_meeting:0 "Встреча на USS «Куинси»"
 SAU_USS_quincy_meeting_desc:0 "Мы пригласили американских военно-морских и военных советников, чтобы они помогли модернизировать наши вооружённые силы."
 SAU_maintain_international_neutrality:0 "Сохранять международный нейтралитет"
 SAU_maintain_international_neutrality_desc:0 "Аравии лучше самостоятельно действовать на мировой арене. Нам следует избегать участия в конфликтах, которые нас не касаются."
 saudi.1.t:0 "Саудовская Аравия запрашивает войска"
 saudi.1.d:0 "Ссылаясь на необходимость защищать нефтяные концессии и на то, что саудовское правительство окружено потенциальными врагами Германии, Саудовская Аравия попросила направить германские войска на её территорию, чтобы гарантировать суверенитет страны, её оборону и защиту германских интересов."
 saudi.1.a:0 "Мы не можем позволить себе потерять эту нефть"
 saudi.1.b:0 "Наши войска останутся дома"
 saudi.2.t:0 "Германия согласна направить войска"
 saudi.2.d:0 "Германское правительство согласилось направить пять дивизий для поддержки нашей армии в защите территории страны."
 saudi.2.a:0 "Превосходно"
 saudi.3.t:0 "Германия отказывается направить войска"
 saudi.3.d:0 "Сославшись прежде всего на приоритет обороны собственной территории, Германия отказалась направлять войска для защиты Саудовской Аравии."
 saudi.3.a:0 "Придётся защищаться самостоятельно"
 SAU_army_focus_1:0 "Саудовская армия"
 SAU_army_focus_1_desc:0 "Пора начать программы и выделить ресурсы на совершенствование армейских технологий и повышение общей боеспособности сухопутных войск."
 SAU_army_infantry:0 "Улучшить наше вооружение"
 SAU_army_infantry_desc:0 "Пехотное снаряжение необходимо модернизировать для повышения боевой эффективности. Следует направить усилия на разработку новых образцов оружия."
 SAU_army_infantry_desert:0 "Снаряжение для пустыни"
 SAU_army_infantry_desert_desc:0 "Саудовская армия должна быть хорошо подготовлена к боям в естественных условиях Аравии — пустыне. Необходимо обеспечить солдат всем необходимым снаряжением для выполнения этой задачи."
 SAU_artillery:0 "Усилить огневую мощь"
 SAU_artillery_desc:0 "Нашим войскам необходима современная артиллерия, чтобы не отставать от других стран мира."
 SAU_land_doctrine1:0 "Новая тактика"
 SAU_land_doctrine1_desc:0 "Нам следует уделить внимание разработке новых военных тактик, чтобы повысить общую эффективность саудовской армии."
 SAU_desert_buff:0 "Саудовская специализация в пустыне"
 SAU_desert_buff_desc:0 "Следует уделить ещё больше внимания тщательной подготовке саудовской армии к боям в естественных условиях Аравии."
 SAU_yemen_lessons:0 "Изучить войну 1934 года"
 SAU_yemen_lessons_desc:0 "Мы должны помнить опыт войны с Йеменом 1934 года и предпринять конкретные шаги для разработки новых тактик, которые лучше подготовят нас к повторению подобного конфликта."
 SAU_strengthen_weakness:0 "Наши неудачи в Йемене"
 SAU_strengthen_weakness_desc:0 "Одним из немногих преимуществ йеменцев в войне 1934 года был опыт их войск в горной войне. Следует целенаправленно подготовить наших солдат к действиям в такой местности."
 SAU_romanticize_army:0 "Романтизировать военную службу"
 SAU_romanticize_army_desc:0 "Следует представить военную службу как славное начинание и настоящее приключение. Это привлечёт в армию всё больше добровольцев."
 SAU_military_academies:0 "Создать военные академии"
 SAU_military_academies_desc:0 "Воинское мастерство и храбрость наших предков давно утрачены. Нам следует попытаться вернуть арабские традиции военного планирования и тактического искусства."
 SAU_cavalry_focus:0 "Старая кавалерия"
 SAU_cavalry_focus_desc:0 "Арабская кавалерия и лошади по-прежнему широко используются, а новые доктрины уступают место старым традициям. Необходимо предпринять шаги для модернизации кавалерии."
 SAU_incorporate_nomad_tactics:0 "Внедрить тактику кочевой кавалерии"
 SAU_incorporate_nomad_tactics_desc:0 "Тактика арабских кочевых племён может оказаться полезной, если разработать способы её применения в современных военных доктринах."
 SAU_special_forces_focus:0 "Саудовские войска специального назначения"
 SAU_special_forces_focus_desc:0 "Следует уделить особое внимание подготовке бойцов, способных выйти за привычные рамки войны, — людей, которых будут бояться другие страны. Наш спецназ должен стать одним из лучших в мире."
 SAU_motorization:0 "Моторизировать армию"
 SAU_motorization_desc:0 "Необходимо начать моторизацию саудовской армии, чтобы она могла соперничать с другими державами, включая европейские."
 SAU_tank_focus:0 "Сталь под солнцем"
 SAU_tank_focus_desc:0 "Следует вложиться в создание новых проектов танков, способных соперничать с машинами европейских держав."
 SAU_tank_innovations:0 "Танковые инновации"
 SAU_tank_innovations_desc:0 "Поскольку у нас нет таких же производственных возможностей и промышленной базы, как у европейских держав, необходимо разработать способы выпускать надёжные, но более дешёвые танки."
 SAU_general_army_buff:0 "Возрождённая саудовская армия"
 SAU_general_army_buff_desc:0 "Мы почти завершили создание обновлённой и мощной саудовской армии благодаря всем усилиям, вложенным в развитие доктрин и технологий."
 SAU_desert_buff1:0 "Саудовская специализация в пустыне"
 SAU_desert_buff1_desc:0 "Саудовская армия отлично подготовлена к боям в условиях пустыни."
 SAU_romanticize_army1:0 "Романтизированная военная служба"
 SAU_romanticize_army1_desc:0 "Жители Саудовской Аравии воспринимают службу и участие в боях как романтическое и прекрасное начинание."
 SAU_tank_innovations1:0 "Танковые инновации"
 SAU_tank_innovations1_desc:0 "Мы разработали новые и более дешёвые методы производства танков."
 SAU_general_army_buff1:0 "Возрождённая саудовская армия"
 SAU_general_army_buff1_desc:0 "Благодаря нашим усилиям в развитии технологий и доктрин саудовские вооружённые силы превратились в обновлённую и мощную боевую силу."
 SAU_incorporate_nomad_tactics1:0 "Внедрённая кочевая тактика"
 SAU_incorporate_nomad_tactics1_desc:0 "Мы включили элементы военного искусства арабских кочевников в современную военную доктрину."
 SAU_encourage_general_creativity:0 "Поощрять новые пехотные тактики"
 SAU_encourage_general_creativity_desc:0 "Изменившийся характер войны требует предоставить генералам больше свободы вместо слепого следования старым арабским тактикам."
 SAU_creative_generals:0 "Творческие генералы"
 SAU_creative_generals_desc:0 "Наши генералы получили больше свободы в выборе правильного курса действий."
 SAU_support_companies:0 "Роты поддержки"
 SAU_support_companies_desc:0 "Следует приложить усилия для внедрения рот поддержки в структуру наших вооружённых сил."
 SAU_radio_innovations:0 "Инновации в радиосвязи"
 SAU_radio_innovations_desc:0 "Мы уже понимаем важность и силу радиосвязи в современной войне. Теперь следует направить усилия на улучшение её применения в саудовской армии."
 SAU_radio_innovations1:0 "Инновации в радиосвязи"
 SAU_radio_innovations1_desc:0 "Мы приложили усилия для совершенствования применения радиосвязи в саудовской армии."
 SAU_2_Invite_the_Soviet_oil_barons:0 "Пригласить советские нефтяные компании"
 SAU_2_Invite_the_Soviet_oil_barons_desc:0 "Нам необходимо изменить нынешний курс. Советы смогут помочь с индустриализацией страны."
 SAU_change_law:0 "Экономическая мобилизация"
 SAU_change_law_desc:0 "Пора выйти из изоляции и обратить взор на внешний мир."
 SAU_request_soviet_investment:0 "Запросить советские инвестиции"
 SAU_request_soviet_investment_desc:0 "Наши советские союзники должны суметь помочь нам в модернизации."
 SAU_communmism_001:0 "Продолжить дело Карима Хакимова"
 SAU_communmism_001_desc:0 ""
 SAU_arabian_spring:0 "Собственный путь"
 SAU_arabian_spring_desc:0 "Наша дипломатическая независимость превыше всего!"
 SAU_restore_constitutionalism:0 "Аравийская конституция"
 SAU_restore_constitutionalism_desc:0 "Расширение Совета шуры оказалось большим успехом. Возможно, следует рассмотреть переход к конституционной монархии."
 SAU_restore_the_caliphate:0 "Дух ихванов"
 SAU_restore_the_caliphate_desc:0 "Халифат был упразднён Мустафой Кемалем Ататюрком после войны Турции за независимость. Возможно, нам не удастся восстановить его напрямую, но мы можем возродить движение ихванов, вернуть своё господство и завоевать поддержку мусульманского мира."
 SAU_invite_western_advisors:0 "Пригласить западных советников"
 SAU_invite_western_advisors_desc:0 "Пригласить западных советников."
 SAU_join_the_comintern:0 "Вступить в Коминтерн"
 SAU_join_the_comintern_desc:0 "Следует обратиться к Советам с просьбой принять нас в Коминтерн."
 SAU_political_correctness:0 "Политические комиссары"
 SAU_political_correctness_desc:0 "Введение военной и политической структуры по образцу [SOV.GetAdjective], несомненно, станет разумным шагом и обеспечит стабильность, а также лучшую организацию политики и вооружённых сил."
 SAU_ussr_four_year_plan:0 "Четырёхлетний план"
 SAU_ussr_four_year_plan_desc:0 "Необходимо разработать новый план, чтобы ускорить индустриализацию страны."
 SAU_deterrence:0 "Сдерживание"
 SAU_deterrence_desc:0 "Нейтралитет можно сохранить лишь на острие меча. Мы должны подготовиться к защите своих границ. Форты и бункеры заставят любого врага дважды подумать, прежде чем объявлять нам войну."
 SAU_spread_islam_force:0 "Распространять исламизм"
 SAU_spread_islam_force_desc:0 "Следует распространять ислам среди наших подданных. Увидев истину, они с большей готовностью примут нашу власть."
 SAU_destabilize_the_east:0 "Дестабилизировать Ближний Восток"
 SAU_destabilize_the_east_desc:0 "Соглашение Сайкса — Пико разделило Ближний Восток между британцами и французами. Пора положить этому конец! "
 SAU_ask_british_colonies:0 "Потребовать аравийские колонии"
 SAU_ask_british_colonies_desc:0 "Британия удерживает несколько владений на Аравийском полуострове. Следует потребовать вернуть их нам по праву."
 SAU_awoken_generation:0 "Пробудившееся поколение"
 SAU_awoken_generation_desc:0 "В Аравии пробуждается новое поколение — поколение прогрессивных мыслителей и либералов. Дни автократического и деспотического правления уходят в прошлое."
 SAU_old_traditions:0 "Восстановить старые традиции"
 SAU_old_traditions_desc:0 "Традиции важны, особенно для арабов. Мы должны всеми силами сохранять свои обычаи и культуру."
 SAU_war_with_yemen_and_oman:0 "Объединить Аравию"
 SAU_war_with_yemen_and_oman_desc:0 "Наши самоуверенные соседи считают, что смогут сохранить независимость. Они ошибаются. Ни один мелкий племенной вождь не встанет на пути мечты об объединённом Аравийском полуострове."
 SAU_attack_iran:0 "Через Персидский залив"
 SAU_attack_iran_desc:0 "Иранцы постоянно угрожают нам. Следует ударить первыми и уничтожить угрозу, пока они не стали слишком сильны."
 SAU_attack_turkey:0 "Подчинить Анатолию"
 SAU_attack_turkey_desc:0 "Когда-то османы владели большей частью аравийского побережья. Пришло время отомстить!"
 SAU_claim_the_sinai:0 "Потребовать Синай"
 SAU_claim_the_sinai_desc:0 "Британцы обладают монополией на Суэцкий канал. Мы можем потребовать Синайский полуостров, чтобы получить частичный контроль над каналом. Скорее всего, они откажутся, но тогда у нас появится повод для войны."
 SAU_establish_labor_camps:0 "Создать трудовые лагеря"
 SAU_establish_labor_camps_desc:0 "Создание трудовых лагерей с гражданами, предоставляющими расширенные услуги промышленности, обеспечит нам промышленный потенциал для разжигания нашей страны и наших войн."
 SAU_integrate_yemen:0 "Интегрировать [YEM.GetNonIdeologyName]"
 SAU_integrate_aden:0 "Интегрировать [659.GetName]"
 SAU_integrate_oman:0 "Интегрировать [OMA.GetNonIdeologyName]"
 SAU_integrate_syria:0 "Интегрировать [SYR.GetNonIdeologyName]"
 SAU_integrate_palestine:0 "Интегрировать [PAL.GetNonIdeologyName]"
 SAU_integrate_jordan:0 "Интегрировать [JOR.GetNonIdeologyName]"
 SAU_integrate_qatar:0 "Интегрировать [QAT.GetNonIdeologyName]"
 SAU_integrate_bahrain:0 "Интегрировать [BHR.GetNonIdeologyName]"
 SAU_integrate_dubai:0 "Интегрировать [UAE.GetNonIdeologyName] в [JOR.GetNonIdeologyName]"
 SAU_claim:0 "Саудовский экспансионизм"
 SAU_camelry_expertise:0 "Опыт применения верблюжьей кавалерии"
 SAU_camelry_expertise_desc:0 "Арабы веками путешествуют по пустыне и столь же долго сражаются бок о бок со своими верными верблюдами."
 ARAB_unlock_camelry_expertise_effect_tt:0 "Боевые возможности §Yверблюжьей кавалерии§! будут увеличены."
 ARAB_under_the_sun:0 "Под солнцем"
 ARAB_under_the_sun_desc:0 "Нашим армиям приходится сражаться под палящим солнцем."
 ARAB_warm_climate_training:0 "Подготовка к жаркому климату"
 ARAB_desert_expertise:0 "Опыт войны в пустыне"
 ARAB_desert_expertise_desc:0 "Пустыня — наш дом и естественное поле боя."
 ARAB_camelry_expertise:0 "Опыт применения верблюжьей кавалерии"
 ARAB_camelry_expertise_desc:0 "Арабы веками путешествуют по пустыне и столь же долго сражаются бок о бок со своими верными верблюдами."
 ARAB_organize_army_structure:0 "Организовать структуру армии"
 ARAB_organize_army_structure_desc:0 "Организация цепочки командования является необходимым шагом для создания эффективных вооружённых сил."
 ARAB_expand_the_recruitment_pool:0 "Расширить кадровый резерв"
 ARAB_expand_the_recruitment_pool_desc:0 "Если мы хотим получить преимущество и выйти победителями, возможно, придётся снизить требования к поступающим на военную службу."
 arabia.1.t:0 "Аравия требует наши колонии"
 arabia.1.d:0 "Сегодня саудовско-аравийский дипломат Ахмут аль-Паша передал нам предложение своего короля. Они предлагают передать под их контроль наши колонии на Аравийском полуострове. После недавнего открытия нефти в этом регионе отказ будет означать прекращение поставок необходимой нам нефти. Как нам поступить?"
 arabia.1.a:0 "Принять предложение"
 arabia.1.b:0 "Как они смеют!"
 arabia.2.t:0 "[FROM.GetName] уступает нашим требованиям"
 arabia.2.d:0 "После дружественных переговоров [FROM.GetNameDef] решила уступить нам свои колонии на Аравийском полуострове в обмен на право экспортировать и добывать нефть в нашем регионе."
 arabia.2.a:0 "Аравия вновь едина!"
 arabia.3.t:0 "[FROM.GetName] отклоняет наши требования"
 arabia.3.d:0 "[FROM.GetNameDefCap] отвергла наши требования, не оставив нам иного выбора, кроме прекращения торговли нефтью и захвата земель силой."
 arabia.3.a:0 "Мы возьмём то, что принадлежит нам!"
 arabia.4.t:0 "Обнаружены промышленные запасы нефти"
 arabia.4.d:0 "После пяти лет безрезультатного бурения скважина № 7 наконец дала нефть 3 марта 1938 года. Это открытие станет лишь первым из многих и в конечном итоге выявит крупнейший источник сырой нефти в мире. Оно навсегда изменит политические отношения на Ближнем Востоке."
 arabia.4.a:0 "Интересно"
 arabia.4.b:0 "Это чёрное золото!"
 arabia.6.t:0 "Приглашение из Аравии"
 arabia.6.d:0 "Сегодня дипломат Аравийского халифата Мехмет аль-Паша передал нам предложение. Он предлагает создать оборонительный союз между нашими исламскими странами."
 arabia.6.a:0 "Мы согласны!"
 arabia.6.b:0 "Мы будем стоять в одиночку!"
 arabia.7.t:0 "[PER.GetNameDef] вступает в наш пакт"
 arabia.7.d:0 "В столь непредсказуемые времена разумно искать союзников. Мы, сыновья Мухаммеда, должны держаться вместе и распространять исламское учение по всему миру."
 arabia.7.a:0 "Добро пожаловать!"
 arabia.8.t:0 "[PER.GetNameDef] отвергает наш пакт"
 arabia.8.d:0 "Иран отклонил наше предложение о пакте."
 arabia.8.a:0 "Глупцы"
 arabia.9.t:0 "Подписано соглашение о нефтяной концессии"
 arabia.9.d:0 "Сегодня, после подписания соглашения о нефтяной концессии между Саудовской Аравией и компанией «Стандард Ойл», два американских геолога высадились в небольшом порту Джубайль. Они прибыли, чтобы начать поиски нефти на Аравийском полуострове, возобновить работу старых буровых установок и предоставить рабочие места многим нашим гражданам."
 arabia.9.a:0 "Это соглашение выгодно обеим сторонам"
 arabia.11.t:0 "Аравия приглашает нас"
 arabia.11.d:0 "Сегодня дипломат Аравийского халифата Мехмет аль-Паша передал нам предложение. Он предлагает создать оборонительный союз между нашими исламскими странами."
 arabia.11.a:0 "Мы согласны!"
 arabia.11.b:0 "Мы будем стоять в одиночку!"
 arabia.12.t:0 "[TUR.GetNameDef] вступает в наш пакт"
 arabia.12.d:0 "Получив наше предложение, Турция согласилась принять приглашение."
 arabia.12.a:0 "Добро пожаловать, братья!"
 arabia.13.t:0 "[TUR.GetNameDef] отвергает наш пакт"
 arabia.13.d:0 "Турция отклонила наше предложение о пакте."
 arabia.13.a:0 "Глупцы"
 arabia.17.t:0 "Аравия требует Синай"
 arabia.17.d:0 "Сегодня саудовско-аравийский дипломат Ахмут аль-Паша передал нам требование своего короля. Они хотят, чтобы мы передали им контроль над Синайским полуостровом. Очевидно, что они стремятся усилить влияние на Суэцкий канал. Как нам поступить?"
 arabia.17.a:0 "Это позволит избежать конфликта."
 arabia.17.b:0 "Ни в коем случае!"
 arabia.18.t:0 "Британцы уступили нашим требованиям"
 arabia.18.d:0 "После напряжённых переговоров Британия решила уступить нам Синайский полуостров в обмен на пакт о ненападении."
 arabia.18.a:0 "Превосходно!"
 arabia.19.t:0 "Британия отклоняет наши требования"
 arabia.19.d:0 "Британцы отвергли наши требования, не оставив нам иного выбора, кроме захвата этих земель силой."
 arabia.19.a:0 "Мы возьмём то, что принадлежит нам!"
 arabia.20.t:0 "Спор о Джафуре"
 arabia.20.d:0 "[FROM.GetLeader] Недавно он подал иск на земли Джафуры, даже зайдя так далеко, что заявил, что часть Катара принадлежит к его территории. [FROM.GetNameDef] Они были предположительно переданы шейхом Катара некоторое время назад. Однако шейх Катара отказался [FROM.GetLeader]Притязания. Земля, которая является [SAU.GetAdjective]s seeks — бесплодная пустошь с непоследовательным населением. Возможно, в наших интересах уступить их требованиям и, возможно, в свое время, [FROM.GetNameDef] Вернут услугу обратно."
 arabia.20.a:0 "На этот раз мы уступим..."
 arabia.20.b:0 "Эр-Риядская линия — соглашайтесь или уходите!"
 arabia.21.t:0 "Сторона [ENG.GetAdjective] идёт на уступки"
 arabia.21.d:0 "После тщательных и напряжённых переговоров, продолживших обсуждения 1935 года, спор о Джафуре был урегулирован: [FROM.GetNameDef] уступила и признала за государством [ROOT.GetNameDef] законное право владения пустыней Джафура. Великая стратегическая победа для [ROOT.GetLeader]."
 arabia.21.a:0 "Аравия становится ещё ближе к объединению..."
 arabia.22.t:0 "Сторона [ENG.GetAdjective] отказывается уступать"
 arabia.22.d:0 "После тщательных и напряжённых переговоров, продолживших обсуждения 1935 года, спор о Джафуре лишь затянулся: [FROM.GetLeader] заявил, что не пойдёт ни на какие уступки сверх Эр-Риядской линии."
 arabia.22.a:0 "Ублюдки!"
 arabia.23.t:0 "Нефть обнаружена в регионе [859.GetName]"
 arabia.23.d:0 "Нам сообщили, что всего несколько дней назад скважина № 7 в регионе [859.GetName] дала нефть. По сообщениям, АРАМКО, нефтяная компания, владеющая концессией на эти земли, объявила: «Прямо у нас под ногами обнаружены огромные запасы нефти», заявив, что это одно из крупнейших, если не крупнейшее месторождение региона. Открытие принесёт экономические и социальные выгоды не только региону [859.GetName], но и всему государству [ROOT.GetNameDef]. Будем надеяться, что благодаря этому [ROOT.GetNameDef] сможет выйти на мировой рынок и стать влиятельной державой Ближнего Востока."
 arabia.23.a:0 "Поистине великий день для страны!"
