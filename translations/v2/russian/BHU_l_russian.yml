 BHU_jigme_wangchuck:0 "Джигме Вангчук"
 BHU_tsarong_wangyal:0 "Царонг Вангьял"
 BHU_gendun_rinpoche:0 "Гендун Ринпоче"
 BHU_andruk_tashi:0 "Андрук Таши"
 BHU_bachu_phugyal:0 "Бачу Пхугьял"
 BHU_ugyen_tanghi:0 "Уйген Тангхи"
 BHU_rin_singh_dorji:0 "Рин Сингх Дорджи"
 BHU_sonam_tobgay_dorji2:0 "Сонам Тобгай Дорджи"
 BHU_mayeum_choying_wangmo_dorji:0 "Майеум Чойинг Вангмо Дорджи"
 BHU_jigmi_y_thinley:0 "Джигми Й. Тинлей"
 bhutan_focus:0 "Национальный фокус Бутана"
 BHU_democratic_party:0 "Джай Горкха"
 BHU_democratic_party_long:0 "Джай Горкха"
 BHU_no_army:0 "Беззащитная страна"
 BHU_no_army_desc:0 "С момента заключения Пунакхского договора 1910 года мы пользуемся преимуществами ограниченной независимости под британским правлением. Опора на военных специалистов [RAJ.GetAdjective] и [ENG.GetAdjective] позволяет нам перераспределять бюджет страны на другие нужды. Однако из-за этого наша страна остаётся совершенно беззащитной перед лицом надвигающейся угрозы во всём мире."
 BHU_fledgling_army:0 "Зарождающаяся армия"
 BHU_treaty_with_britain:0 "Договоры с [ENG.GetNameDef]"
 BHU_treaty_with_britain_desc:0 "Договоры с [ENG.GetNameDef] поставили нас под их защиту и в сферу их влияния. Хотя мы теряем часть самостоятельности во внутренних делах, мы получим значительную выгоду от «защиты» [ENG.GetNameDef].\n§W--------------\n§!§WЧтобы обрести§! §Gнезависимость§! §Wот [ENG.GetNameDef], нам необходимо добиться значительной поддержки партии, которая не поддерживает династию Вангчук.§! §WЭто откроет§! §Yрешение§!§W, позволяющее положить конец нашей £autonomy_texticon  §Rподчинённости§!."
 BHU_first_inspection_idea:0 "Инспекция армии"
 BHU_first_inspection_idea_desc:0 "Проводится инспекция."
 BHU_1921_modernization_roadmap_idea:0 "План модернизации"
 BHU_1921_modernization_roadmap_idea_desc:0 "Теперь у нас появилась возможность осуществить этот план."
 BHU_can_decline_effect:0 "§WУстановить правило: £trigger_yes Можно отказаться от призыва к войне§!"
 idea_BHU_dragons_storm:0 "Буря дракона"
 idea_BHU_new_ideas:0 "Критика монархии"
 idea_BHU_new_ideas_desc:0 "Если мы хотим вступить в современную эпоху как суверенная и единая нация, нам необходимо открыть глаза на преимущества новых идеологий. Наш народ скован оковами старого монархического режима."
 BHU_backward_economy:0 "Отсталая экономика"
 BHU_backward_economy_desc:0 "Наша экономика чрезвычайно зависит от местного производства и иностранных специалистов и лишена прочной основы. Открытие ограниченных рынков нашей страны обернётся инфляцией, долгами перед иностранцами и бедностью нашего народа."
 idea_BHU_unthinkable_offensive:0 "Немыслимое наступление"
 idea_BHU_maintain_the_monarchy:0 "Сохранить монархию"
 idea_BHU_reinforce_the_throne:0 "Укрепить трон"
 idea_BHU_aristocratic_regime:0 "Аристократический режим"
 idea_BHU_the_quiet_strength:0 "Тихая сила"
 BHU_agriculatural_reform:0 "Аграрная реформа"
 BHU_decentralized_administration:0 "Децентрализованная администрация"
 BHU_severe_economic_isolationism:0 "Жёсткий экономический изоляционизм"
 BHU_severe_economic_isolationism_desc:0 "Наша экономика чрезвычайно зависит от местного производства и иностранных специалистов и лишена прочной основы. Открытие ограниченных рынков нашей страны обернётся инфляцией, долгами перед иностранцами и бедностью нашего народа."
 BHU_moderate_economic_isolationism:0 "Умеренный экономический изоляционизм"
 BHU_moderate_economic_isolationism_desc:0 "Наша экономика зависит от местного производства и иностранных специалистов и лишена прочной основы. Открытие ограниченных рынков нашей страны обернётся инфляцией, долгами перед иностранцами и бедностью нашего народа."
 BHU_slight_economic_isolationism:0 "Слабый экономический изоляционизм"
 BHU_slight_economic_isolationism_desc:0 "Наша экономика несколько зависит от местного производства и иностранных специалистов и лишена прочной основы. Открытие ограниченных рынков нашей страны обернётся инфляцией, долгами перед иностранцами и бедностью нашего народа."
 BHU_army_establishment:0 "Создание армии"
 BHU_army_establishment_desc:0 "Многие годы мы полагались на иностранную защиту. Королевские телохранители, вооружённые мечами и облачённые в доспехи, были нашими единственными военными силами, хотя и выполняли в основном церемониальные функции. Это должно измениться! Пришло время создать национальную армию Бутана."
 BHU_denounce_the_treaty_of_punakha:0 "Денонсировать Пунакхский договор"
 BHU_improve_military_standards:0 "Повысить военные стандарты"
 BHU_mountain_warfare_courses:0 "Курсы горной войны"
 BHU_the_winter_soldiers:0 "Зимние солдаты"
 BHU_india_relations:0 "Отношения с [RAJ.GetNameDef]"
 BHU_india_relations_desc:0 "На протяжении веков наша история была связана с Сиккимом. В эти переменчивые времена наше будущее окончательно связано с судьбой [RAJ.GetNameDef] — к лучшему или к худшему."
 BHU_bhutan_diplomacy:0 "Дипломатия [BHU.GetAdjective]"
 BHU_bhutan_diplomacy_desc:0 "В этом меняющемся мире мы не можем полагаться на устаревшие тридцатилетние договоры с [ENG.GetNameDef]. Их поддержка нам больше не нужна; отныне [BHU.GetNameDef] будет искать помощи у новых союзников, которые охотнее помогут нам создать боеспособные вооружённые силы."
 BHU_improve_relations:0 "Улучшить отношения с [From.GetNameDef]"
 BHU_improve_relations_tt:0 "Открывает решение: §YУлучшить отношения с [THIS.GetNameDef]§!"
 BHU_establish_an_army_under_foreign_supervision:0 "Создать армию под надзором [From.GetAdjective]"
 denounced_punakha_treaty:0 "Пунакхский договор денонсирован"
 bhutan_improved_military_standards:0 "§YВоенные стандарты§! были улучшены."
 army_establishment_decision:0 "Создание армии в процессе"
 BHU_aftermath_of_the_visit_to_india:0 "Воспоминания о Калькутте"
 BHU_aftermath_of_the_visit_to_india_desc:0 "Впервые за многие годы король посетил [RAJ.GetNameDef]. Это событие укрепило курс на модернизацию страны и одновременно подтвердило политическое положение королевства."
 BHU_peace_will_reign:0 "Будет царить мир"
 BHU_peace_will_reign_desc:0 "У нас нет армии, нам никто не угрожает, всё в порядке."
 BHU_blissful_isolation:0 "Блаженная изоляция"
 BHU_blissful_isolation_desc:0 "Зачем беспокоиться о мире, когда можно медитировать в монастыре одной из самых труднодоступных стран на планете?"
 BHU_create_an_army:0 "Создать армию"
 BHU_create_an_army_desc:0 "С тех пор как мы отдали себя под защиту [ENG.GetAdjective], мы отказались от любых военных амбиций, сохранив лишь королевскую гвардию для церемониальных целей. Теперь, когда опасность войны уже стучится в нашу дверь, пришло время создать национальную армию."
 BHU_arms_deliveries:0 "Поставки оружия"
 BHU_arms_deliveries_desc:0 "Поскольку мы не можем производить оружие самостоятельно, нам приходится ввозить его из-за границы. К счастью, хорошие отношения с [ENG.GetNameDef] и [RAJ.GetNameDef] позволяют нам выделить в этом году часть бюджета на строительство оружейных мастерских по всей стране."
 BHU_first_inspection:0 "Первая инспекция"
 BHU_first_inspection_desc:0 "Чтобы организовать нашу армию, мы должны пригласить иностранных специалистов для оценки достигнутого прогресса. Инспекция должна повысить эффективность наших неопытных войск и помочь восполнить пробелы в подготовке офицеров и командиров."
 BHU_officers_training:0 "Подготовка офицеров"
 BHU_officers_training_desc:0 "Мы сможем добиться эффективности на поле боя лишь в том случае, если солдатами будут правильно командовать."
 BHU_formalize_military_doctrine:0 "Оформить военную доктрину"
 BHU_formalize_military_doctrine_desc:0 "Без надлежащего военного планирования наши вооружённые силы не смогут действовать на оперативном уровне."
 BHU_elite_mountain_troops:0 "Элитные горные войска"
 BHU_elite_mountain_troops_desc:0 "Наши земли находятся почти на вершине мира, и мы не можем планировать военные операции без создания специализированных войск, способных действовать в самых сложных районах."
 BHU_small_arms_workshop:0 "Оружейные мастерские"
 BHU_small_arms_workshop_desc:0 "В отсутствие полноценных заводов производство оружия необходимо распределить между несколькими мастерскими. Строительство нескольких предприятий в крупнейших городах и обеспечение быстрой перевозки материалов и деталей между ними повысят военный потенциал нашей страны."
 BHU_small_arms_technology:0 "Технологии стрелкового оружия"
 BHU_small_arms_technology_desc:0 "Опыт, накопленный мастерскими, позволил нам разработать более эффективное снаряжение. Новейшие прототипы уже прошли испытания на стрельбищах, а их точность и огневая мощь на дальних дистанциях поразили присутствовавшую там военную комиссию. Нашим специалистам поручено как можно скорее начать производство этого нового вооружения."
 BHU_ammunitions:0 "Производство боеприпасов"
 BHU_ammunitions_desc:0 "Создание постоянной армии потребует гораздо больше людей и вооружения, чем у нас есть сейчас. Новобранцы ежедневно прибывают в учебные центры и сталкиваются с нашей неспособностью обеспечить их подходящим военным снаряжением. Был принят новый законопроект об увеличении государственного финансирования новых оружейных мастерских."
 BHU_artillery:0 "Огненное дыхание"
 BHU_artillery_desc:0 "Артиллерия — единственный способ прорвать укреплённые позиции наших врагов, и если мы хотим посеять среди них смятение, то должны дать ей соответствующее имя. Согласно древним текстам, «огненное дыхание» позволяло добиться нужного эффекта. Улучшим же жар и дальность такого огня."
 BHU_mountain_guns:0 "Горные орудия"
 BHU_mountain_guns_desc:0 "Преобладание горной местности в нашей стране означает, что любое используемое нами снаряжение необходимо приспосабливать к природным и погодным условиям нашей территории. Идея «Огненного дыхания», способного эффективно поражать врагов в такой обстановке, несомненно заслуживает вложений."
 BHU_upscaled_mechanical_dragon:0 "Драконы из стали"
 BHU_upscaled_mechanical_dragon_desc:0 "Хотя сама концепция может ужасать обычных людей, наши военные специалисты считают, что нам необходимо танковое подразделение, способное сражаться в горах. Проект, безусловно, дорогой, но он принесёт немало сопутствующих выгод."
 BHU_follow_the_1921_modernization_roadmap:0 "План модернизации 1921 года"
 BHU_follow_the_1921_modernization_roadmap_desc:0 "В 1921 году мы разработали план модернизации страны. Тогда нам не хватало навыков для его осуществления, но после того, как в течение последнего десятилетия мы отправили нескольких отобранных людей учиться в британские школы, мы, наконец, можем приступить к его реализации."
 BHU_education_reform:0 "Реформа образования"
 BHU_education_reform_desc:0 "Знания жизненно важны для обеспечения будущего нашей нации. Ранее образовательные стандарты нашей страны опирались на принципы буддизма и в основном устанавливались и поддерживались монахами в монастырях. Для современной страны это неприемлемо, поэтому нам следует перенять западные системы образования и их методы обучения."
 BHU_train_more_doctors:0 "Развитие здравоохранения"
 BHU_train_more_doctors_desc:0 "В последние годы население пострадало от множества смертельно опасных заболеваний. Продолжая готовить новых специалистов, мы также можем заложить основу для Департамента общественного здравоохранения, который будет организовывать исследования и проводить медицинскую экспертизу по всей стране. Такое учреждение может показаться дорогим, но оно спасёт тысячи жизней!"
 BHU_improve_agriculture:0 "Улучшить методы земледелия"
 BHU_improve_agriculture_desc:0 "Традиционные методы земледелия совершенно устарели: старое оборудование, сильная зависимость от гужевого транспорта, двухпольный севооборот и многое другое. Нам следует изменить это, чтобы высвободить мужчин и женщин для других видов экономической деятельности."
 BHU_improve_the_roads:0 "Улучшить дороги"
 BHU_improve_the_roads_desc:0 "Статус одной из самых труднодоступных стран мира имеет огромное значение для нашей обороны. Однако наши сухопутные войска страдают в столь суровых условиях: грунтовые дороги, узкие стальные мосты и нехватка автомобильного транспорта серьёзно ограничивают мобильность и боевые возможности армии. Мы наконец прислушались к её требованиям и начали государственную программу модернизации дорог."
 BHU_the_dragon_trains:0 "Драконьи поезда"
 BHU_the_dragon_trains_desc:0 "Мы не можем отставать от технологического прогресса других стран! Нашему народу нужны достойные средства передвижения, и государство готово поддержать это начинание. Такой проект, несомненно, сопряжён с опасностями, но долгосрочные выгоды окупят затраты. Как говорят в деревнях: «Дракон не только извергает огонь, он ещё и выпускает дым», — так пусть наши мужчины и женщины увидят железного дракона, пересекающего горы!"
 BHU_mineral_survey:0 "Геологическая разведка"
 BHU_mineral_survey_desc:0 "Стабильный рост местных производственных предприятий и недавние торговые соглашения с нашими партнёрами заставили задуматься о дополнительных залежах природных ресурсов в пределах наших границ. Следует собрать команду самых опытных геологов и провести масштабную геологическую разведку, чтобы обнаружить крупные месторождения природных ресурсов."
 BHU_exploit_the_findings:0 "Разработать найденные месторождения"
 BHU_exploit_the_findings_desc:0 "Несомненный успех геологической разведки был подтверждён обнаружением крупных залежей ферросилиция на юго-западе нашей страны, неподалёку от города Пхунчолинг. Команда просит дополнительное финансирование, чтобы обеспечить добычу руды из месторождения и её использование исключительно местными компаниями."
 BHU_new_weaving_techniques:0 "Новые методы ткачества"
 BHU_new_weaving_techniques_desc:0 "Экспорт нашей страны в основном состоит из цемента, доломита и полуфабрикатов из железа. Хотя сырьё пользуется спросом у иностранных покупателей, тканые изделия остаются одним из основных товаров местного производства. Внедрение новых методов ткачества имеет для нас большое значение, поскольку может стать полезным инструментом для улучшения экономического положения."
 BHU_reform_the_taxation_system:0 "Реформировать налоговую систему"
 BHU_reform_the_taxation_system_desc:0 "Хотя нгултрум [BHU.GetAdjective] является официальной валютой страны, многие религиозные учреждения, большинство крестьян и различные группы шерпов предпочитают вносить многочисленные платежи в государственный бюджет не деньгами, а товарами. Недавние экономические трудности вынудили правительство принять указ, согласно которому все налоги должны уплачиваться деньгами."
 BHU_organize_the_land:0 "Организовать использование земель"
 BHU_organize_the_land_desc:0 "Сельские районы нашей страны используются далеко не в полную силу. Нет необходимости конфисковывать или отбирать эти земли у нашего народа — достаточно обеспечить крестьян и рабочих помощью и инструментами. Правительство также готово выделить дополнительные средства на покупку обычно неиспользуемых земель, чтобы создавать там мастерские."
 BHU_traders_of_the_himalaya:0 "Торговцы Гималаев"
 BHU_traders_of_the_himalaya_desc:0 "В закрытых землях Гималаев мало кто способен заниматься торговлей."
 BHU_fledgeling_industry:0 "Зарождающаяся промышленность"
 BHU_fledgeling_industry_desc:0 "Наша промышленность пока находится в младенческом состоянии, но она уже развивается, и за ней нужно тщательно ухаживать, чтобы обеспечить устойчивый рост. Благодаря осторожным и постоянным государственным инвестициям в сочетании с экономической поддержкой наша нация сможет войти в современную эпоху как промышленно развитая страна."
 BHU_defense_policy:0 "Оборонная политика"
 BHU_defense_policy_desc:0 "Создание долгосрочной оборонной политики необходимо для обеспечения нашей безопасности."
 BHU_industrial_modernization:0 "Промышленная модернизация"
 BHU_industrial_modernization_desc:0 "Мир стремительно движется к новейшим технологическим достижениям, и каждая страна старается получить самое современное оборудование. Мы не исключение, однако, в отличие от других, ценим каждый имеющийся у нас инструмент и каждую машину. Малые средства налагают большую ответственность."
 BHU_technological_progress:0 "Технологический прогресс"
 BHU_technological_progress_desc:0 "Реформа образования — лишь первый шаг на пути к бесплатному среднему образованию для всех, независимо от пола, цвета кожи, ориентации или любых других устаревших разделений консервативных обществ. Образование и технологии — в массы, любой ценой!"
 BHU_industry_enlightened_by_science:0 "Промышленность, просвещённая наукой"
 BHU_industry_enlightened_by_science_desc:0 "Доказано, что научное развитие требует меньше времени и ресурсов, если учёные располагают современными научными приборами и инструментами. Имея всё это в своём распоряжении и опираясь на прочную промышленную базу, мы сможем вкусить сладкие плоды прогресса!"
 BHU_utilize_our_forests:0 "Использовать наши леса"
 BHU_utilize_our_forests_desc:0 "Наши деревья росли годами; это сокровище, которым мы ещё никогда не пользовались. Пока что."
 BHU_german_arms_shipments:0 "Поставки оружия [GER.GetAdjective]"
 BHU_german_arms_shipments_desc:0 "Бутан с трудом способен обеспечивать себя в военном отношении, поэтому, возможно, стоит попросить [GER.GetAdjective] о поставках оружия, а заодно и о более низкой цене..."
 BHU_build_air_strip:0 "Построить взлётно-посадочную полосу"
 BHU_build_air_strip_desc:0 "Не каждый самолёт способен долететь до Тибета, поэтому строительство надёжной взлётно-посадочной полосы необходимо, чтобы объединить высотные полёты и непосредственную авиационную поддержку в одну дисциплину: пилотирование над Тибетом. Кроме того, придётся разработать специальные самолёты, ведь на такой высоте уже сам взлёт является достижением."
 BHU_small_airframes:0 "Малые планеры"
 BHU_small_airframes_desc:0 "Учитывая, что для помощи наземным войскам нам потребуется лишь локальное превосходство в воздухе, более дешёвые и небольшие самолёты будут попросту лучшим выбором."
 BHU_large_airframes:0 "Большие планеры"
 BHU_large_airframes_desc:0 "Учитывая размеры страны и сложность полётов среди высоких гор, лучше иметь самолёты, способные летать дальше и выше гор, чем лавировать вокруг нетронутых вершин мира."
 BHU_the_dragon_flies:0 "Дракон летит"
 BHU_the_dragon_flies_desc:0 "Мы будем властвовать в небесах, словно драконы, и извергать огонь на наших врагов."
 BHU_naval_effort:0 "Финансировать кораблестроение"
 BHU_naval_effort_tt:0 "Недостаточно ячеек строительства для §Yвоенно-морских верфей§!"
 BHU_naval_effort_desc:0 "Расширение нашего флота должно стать нашим приоритетом. Следует направить все доступные ресурсы на строительство новых верфей и исследования лёгких надводных кораблей."
 BHU_flexible_navy:0 "Гибкий флот"
 BHU_flexible_navy_desc:0 "Переосмысление морской войны с учётом достижений в области подводных лодок позволит нам эффективно наносить удары по вражеским конвоям."
 BHU_large_navy:0 "Большой флот"
 BHU_large_navy_desc:0 "Адаптация наших военно-морских доктрин к использованию крупных кораблей и обеспечение безопасности торговых конвоев многому научат нас в вопросе того, какие именно корабли нам нужны."
 BHU_submarine_effort:0 "Подводная война"
 BHU_submarine_effort_desc:0 "Подводная война — самое захватывающее направление развития флота со времён изобретения торпедного катера. Нам следует научиться защищаться от подлодок и использовать их против вражеского судоходства."
 BHU_cruiser_effort:0 "Разработать крейсеры"
 BHU_cruiser_effort_desc:0 "Прежде чем углубляться в исследования передовых линкоров, необходимо заменить более лёгкие крейсеры."
 BHU_destroyer_effort:0 "Спроектировать эсминцы"
 BHU_destroyer_effort_desc:0 "Изучая устройство подводных лодок и их стратегическое применение, мы также узнали, как противостоять этим стратегиям. Эсминцы будут играть в этом решающую роль."
 BHU_capital_ships_effort:0 "Интерес к крупным кораблям"
 BHU_capital_ships_effort_desc:0 "Страна с наибольшим числом линкоров будет править океанами. Линкоры и авианосцы олицетворяют старое и новое в военно-морском превосходстве."
 BHU_unthinkable_offensive:0 "Немыслимое наступление"
 BHU_unthinkable_offensive_desc:0 "За бескрайними горами морей лежит наша судьба. За этими движущимися вершинами ждёт наша слава. Драконов будут бояться по всему миру!"
 BHU_new_ideas:0 "Внедрить новые идеи"
 BHU_new_ideas_desc:0 "Внешний мир приносит нам новые представления о том, каким может быть наше правительство. Демократия, коммунизм, фашизм — эти идеологии представляют собой альтернативы."
 BHU_our_own_way:0 "Наш путь"
 BHU_our_own_way_desc:0 "Мы уже показали миру, на что способны, но можем добиться ещё большего."
 BHU_constitutional_parlementarism:0 "Конституционный парламентаризм"
 BHU_constitutional_parlementarism_desc:0 "Чтобы найти равновесие между требованиями народа и сохранить направляющую роль короля, [BHU.GetLeader] согласился подписать конституцию и поклялся соблюдать её перед всем Цонгду (Национальным собранием)."
 BHU_share_power:0 "Реформировать Цонгду"
 BHU_share_power_desc:0 "Собрание необходимо реформировать, чтобы сделать возможным создание демократических институтов."
 BHU_open_the_country:0 "Открыть страну"
 BHU_open_the_country_desc:0 "На протяжении многих лет наша экономика была самодостаточной, но вместе с тем мы отказывались от возможностей, приходящих из-за рубежа. Это должно измениться. Подобно другим азиатским державам прошлого века, страна должна открыться миру."
 BHU_economic_developments:0 "Экономическое развитие"
 BHU_economic_developments_desc:0 "Социальные реформы создают новые возможности. Этот благотворный цикл, в свою очередь, укрепляет нашу экономику."
 BHU_denounce_the_aristocracy:0 "Осудить аристократию"
 BHU_denounce_the_aristocracy_desc:0 "Аристократию следует разоблачить такой, какова она есть: пережитком крепостничества, смешавшимся с нарождающейся буржуазией. Монархисты не подозревают о растущем у них за спиной коммунистическом движении. Мы не станем спешить и дождёмся подходящего момента, чтобы заявить о себе."
 BHU_overthrow_the_feudals:0 "Покончить с крепостничеством"
 BHU_overthrow_the_feudals_desc:0 "Поддержка Коммунистической партии Бутана по всей стране стала настолько подавляющей, что устаревший король и его министры-марионетки больше не нужны для того, чтобы вести нашу страну к светлому коммунистическому будущему. Время нанести удар пришло! Пусть король узнает волю народа!"
 BHU_land_redistribution:0 "Перераспределение земли"
 BHU_land_redistribution_desc:0 "Крепостничество поколениями отнимало земли, принадлежавшие нашим бедным крестьянам! Мы не сможем двигаться дальше, пока нужды крестьян и рабочих не будут полностью удовлетворены, а социальное обеспечение не придёт в каждый дом!"
 BHU_mobilization_of_the_masses:0 "Мобилизовать массы"
 BHU_mobilization_of_the_masses_desc:0 "Коммунизм сам по себе — это идеология и образ мышления, впервые сформулированные великими Марксом и Энгельсом, а позднее воплощённые Лениным и Сталиным в России. Поэтому очевидно, что человек, искренне верящий в марксизм, возьмёт в руки оружие, чтобы защитить оказавшиеся под угрозой ценности, которые мы все разделяем."
 BHU_indoctrination_focus:0 "Идеологическая обработка"
 BHU_indoctrination_focus_desc:0 ""
 BHU_contact_chinese_communists:0 "Связаться с [PRC.GetNameDef]"
 BHU_contact_chinese_communists_desc:0 "У нас с [PRC.GetAdjective] много общего, и одна из таких черт — решительное противостояние националистическим и капиталистическим угнетателям. [PRC.GetLeader] и его люди хорошо известны своими навыками партизанской войны и действий в тылу врага. Возможно, некоторым из них удастся обойти пограничные патрули [TIB.GetAdjective] и [CHI.GetAdjective], добраться до нашей страны и поддержать наших командиров?"
 BHU_contact_the_soviets:0 "Связи с [SOV.GetAdjective]"
 BHU_contact_the_soviets_desc:0 "Будучи родиной коммунистических идеалов, [SOV.GetNameDef], несомненно, стремится расширить своё влияние по всему миру. Общность наших целей позволит нам обратиться за отправкой крупной военной экспедиции [SOV.GetAdjective], которая поможет в военных приготовлениях."
 BHU_forced_indusrial_progress:0 "Форсированный промышленный прогресс"
 BHU_forced_indusrial_progress_desc:0 "Промышленность принесёт прогресс; ничто не остановит ход истории."
 BHU_proletarization:0 "Пролетаризация"
 BHU_proletarization_desc:0 "Уничтожение классовых врагов — уже не просто утопия. Государство, созданное пролетариатом и для пролетариата, теперь ближе, чем когда-либо."
 BHU_embrace_radical_nationalism:0 "Принять радикальный национализм"
 BHU_embrace_radical_nationalism_desc:0 "Бутан изолирован, но у него есть предназначение; великий Громовой дракон избрал его, чтобы создать сильную державу."
 BHU_spread_aggressive_attitude:0 "Распространять агрессивные настроения"
 BHU_spread_aggressive_attitude_desc:0 "Мир — это иллюзия, призванная отдалить людей от их естественного состояния, в котором они доказывают своё превосходство в бою."
 BHU_mass_conscription:0 "Массовый призыв"
 BHU_mass_conscription_desc:0 "Народ должен быть мобилизован и исполнить свой долг, чтобы осуществить своё великое предназначение!"
 BHU_armement_program:0 "Начать перевооружение"
 BHU_armement_program_desc:0 "Наша страна шла сквозь историю словно во сне из-за влияния таких по своей сути слабых понятий, как мир и сострадание. Хороших солдат не создать, если не превозносить агрессивность и борьбу как образ жизни и торжество над смертью."
 BHU_dragons_storm:0 "Буря Дракона"
 BHU_dragons_storm_desc:0 "Громовая буря сокрушит всех наших врагов!"
 BHU_reclamation_of_the_lost_lands_desc:0 "Британцы уменьшили территорию нашей страны в XIX веке своим давлением. Наконец настал час нашей мести."
 BHU_reclamation_of_the_lost_lands:0 "Возвращение утраченных земель"
 BHU_attack_the_plateau:0 "Атаковать плато"
 BHU_attack_the_plateau_desc:0 "Независимости нашего недавно созданного государства угрожают со всех сторон. Если мы попытаемся двинуться на юг, нас наверняка раздавят, зато наша северная граница с [TIB.GetNameDef], похоже, защищена слабо. При правильном планировании и выборе момента мы сможем быстро нанести удар и установить свою власть над землями, которые по праву принадлежат нам!"
 BHU_swallow_the_white_sun:0 "Поглотить Белое Солнце"
 BHU_swallow_the_white_sun_desc:0 "Столетия правления [CHI.GetAdjective] оставили глубокие шрамы на лице и теле нашего общества. Народ [BHU.GetAdjective] восстанет против иностранной оккупации, империализма и продажных правительств, разбросанных по Центральной равнине. Пусть Восток содрогнётся от страха, наблюдая за возвышением [BHU.GetNamedef]!"
 BHU_extinguish_the_red_sun:0 "Погасить Красное Солнце"
 BHU_extinguish_the_red_sun_desc:0 "[JAP.GetAdjective] делают вид, будто им самой судьбой предназначено принести мир и процветание всей Азии. Но мы все знаем, что это лишь прикрытие их империалистических и воинственных амбиций. Покажем им, насколько они заблуждаются, установив над ними законную власть под нашей прямой юрисдикцией!"
 BHU_maintain_monarchic_regime:0 "Сохранить монархию"
 BHU_maintain_monarchic_regime_desc:0 "Король-Дракон — глава и основа нашей страны."
 BHU_reinforce_the_throne:0 "Укрепить трон"
 BHU_reinforce_the_throne_desc:0 "Да здравствует король!"
 BHU_the_quiet_strength:0 "Тихая сила"
 BHU_the_quiet_strength_desc:0 "Король-Дракон — наш проводник, и он укажет нам путь."
 BHU_delegate_to_the_tslzogdu:0 "Передать полномочия Цонгду"
 BHU_delegate_to_the_tslzogdu_desc:0 "Король не может править в одиночку; ему следует передать часть своих полномочий собранию."
 BHU_aristocratic_regime:0 "Аристократический режим"
 BHU_aristocratic_regime_desc:0 "Великие семьи необходимы для обеспечения стабильности наших институтов."
 BHU_forced_industrial_progress:0 "Форсированный промышленный прогресс"
 BHU_forced_industrial_progress_desc:0 "Монархисты, демократы и фашисты не смогли обеспечить нашей стране желаемое промышленное процветание и экономическую независимость. Только коммунизм с его программами индустриализации приведёт народ [BHU.GetAdjective] к освобождению пролетариата."
 BHU_no_army_tt:0 "\n§RНельзя ужесточать закон о призыве или объявлять войны.\nНельзя обучать или расформировывать дивизии, а также редактировать шаблоны дивизий.§!"
 himalaya_bhutan.2.t:0 "Последствия визита в Калькутту"
 himalaya_bhutan.2.desc:0 "Впервые за многие годы король посетил [RAJ.GetNameDef]. Эта поездка подтвердила ранее утверждённый план модернизации страны и одновременно прояснила политическое положение королевства. Это может означать, что в ближайшие годы королевство ждут масштабные перемены."
 himalaya_bhutan.2.a:0 "А теперь вернёмся к более насущным делам."
