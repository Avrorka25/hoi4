l_russian:
 estonian_focus:0 "Национальные фокусы Эстонии"
 EST_a_tale_of_leningrad:0 "Повесть о Ленинграде"
 EST_a_tale_of_leningrad_desc:0 "После ошеломительной победы эстонских войск, подобной которой история ещё не знала, пришло время уничтожить последние остатки большевистского наследия в Европе. Северная колыбель коммунизма должна быть очищена!"
 EST_support_estonian_latvian_brotherhood:0 "Поддержать [EST.getAdjective]-[LAT.getAdjective] братство"
 EST_support_estonian_latvian_brotherhood_desc:0 "Мы завоевали всю бывшую территорию Латвии и получили уникальную возможность ещё больше расширить нашу империю! Следуя путём наших предков, мы, возможно, сможем объединить под нашим знаменем все земли бывшего Ливонского ордена!"
 est.11.t:0 "[From.GetName] просит [Root.GetAdjective] участия в Балтийской Антанте"
 est.11.d:0 "После подписания договора о дружбе между нашими народами [From.GetName] предлагает [Root.GetName] присоединиться к их [From.GetFactionName], чтобы объединиться против растущих угроз, окружающих наши страны. Будь то коммунисты или фашисты, [From.GetName] обещает защищать [Root.GetAdjective] интересы."
 est.11.a:0 "[Root.GetName] стоит плечом к плечу со своими братьями."
 est.11.b:0 "[Root.GetName] сможет выжить только самостоятельно."
 est.12.t:0 "[From.GetName] присоединяется к [Root.GetFactionName]!"
 est.12.d:0 "Признав необходимость единства перед лицом угроз, окружающих наши страны со всех сторон, [From.GetLeader] сегодня объявил всему миру, что [From.GetName] заключила договор с [Root.GetName] ради нашей общей безопасности."
 est.12.a:0 "[Root.GetName] и [From.GetName] сегодня стоят как братья."
 est.13.t:0 "[From.GetName] отказывается присоединиться к [Root.GetFactionName]"
 est.13.d:0 "В безрассудной попытке мнимого самосохранения [From.GetLeader] сегодня объявил, что [From.GetName] воздержится от любых дипломатических действий, которые могут быть восприняты как угроза её могущественным соседям. Поэтому наша просьба присоединиться к [Root.GetFactionName] была отклонена."
 est.13.a:0 "Безопасность возможна только вместе."
 est.14.t:0 "Выборы в Национальное собрание 1936 года"
 est.14.d:0 "Сейчас проходит конституционный референдум, основанный на утверждении, что предыдущая конституция была слишком авторитарной. Все партии, кроме Патриотической лиги, были запрещены, так что судьба конституции практически предрешена."
 est.14.a:0 "В эти времена Эстонии нужен сильный лидер."
 est.15.t:0 "Советско-эстонский договор о взаимопомощи"
 est.15.d:0 "Правительство Эстонии предложило нам доступ к своим военным базам, если мы в ответ гарантируем ей защиту от любых вторжений и угроз. Согласие может оказаться выгодным, поскольку ещё сильнее втянет её в нашу сферу влияния."
 est.15.a:0 "Это принесёт нам огромную пользу."
 est.15.b:0 "Это лишь пустая трата нашего времени и ресурсов."
 est.16.t:0 "Советы принимают предложение"
 est.16.d:0 "Советские войска уже начали размещаться на базах, а советские власти заявили, что приняли наше предложение и будут защищать нас от внешних угроз."
 est.16.a:0 "Так будет лучше."
 est.17.t:0 "Советы отклоняют предложение"
 est.17.d:0 "Советский режим проигнорировал все попытки установить контакт и отказался вести переговоры с нашими дипломатами."
 est.17.a:0 "Досадная неудача."
 est.18.t:0 "Разрешённые партии участвуют в выборах"
 est.18.d:0 "Из-за массового бойкота выборов гражданами Константин Пятс был вынужден пойти на уступки. Многие требуют восстановления демократии, тогда как более радикальные избиратели хотят сближения с Германией и Советским Союзом. Эти выборы могут завершиться как угодно."
 est.18.a:0 "Возвращение к демократии — наша лучшая надежда."
 est.18.b:0 "Тесные связи с Германией — лучший путь."
 est.18.c:0 "Союз трудового народа Эстонии укажет нам путь."
 EST_the_four_year_plan:0 "Четырёхлетний план"
 EST_the_four_year_plan_desc:0 "Наша промышленность и сельское хозяйство всё ещё отстают от уровня производства, который был до Великой депрессии. Начнём исправлять это с помощью Четырёхлетнего плана."
 EST_tallinn_tartu_highways:0 "Шоссе Таллин—Тарту"
 EST_tallinn_tartu_highways_desc:0 "Инфраструктура важна для передвижения. Она позволяет нашим войскам двигаться быстрее и перевозить больше снаряжения. Мы должны последовать примеру немцев и построить собственные автобаны."
 EST_develop_our_railroads:0 "Развивать железные дороги"
 EST_develop_our_railroads_desc:0 "Наша железнодорожная сеть всё ещё довольно слабо развита — войска в нашей стране не могут позволить себе застревать в пути. Мы должны отремонтировать и расширить старые железные дороги."
 EST_build_better_capital:0 "Улучшить столицу"
 EST_build_better_capital_desc:0 "Наша столица Таллин полна старых и непривлекательных деревянных домов. Старый город сильно изменился с прежних времён и нуждается в восстановлении."
 EST_invest_in_the_military:0 "Инвестировать в вооружённые силы"
 EST_invest_in_the_military_desc:0 "Приспосабливать гражданские фабрики для выпуска военного снаряжения неэффективно. Нам следует уже сейчас сосредоточиться на подготовке военного производства."
 EST_more_civilian_factories:0 "Экспортировать молочную продукцию"
 EST_more_civilian_factories_desc:0 "Мы можем использовать запасы мяса, рыбы и молочных продуктов, чтобы влиять на торговые соглашения."
 EST_start_central_industrial_region:0 "Создать Центральный промышленный район"
 EST_start_central_industrial_region_desc:0 "Заложим основы нашей централизованной оружейной промышленности."
 EST_the_bombe:0 "Бомба"
 EST_the_bombe_desc:0 "Наши инженеры разрабатывают блестящую машину, которую они называют «криптологической бомбой» и которая способна взламывать вражеские шифры. У нас есть ресурсы, чтобы продолжить её разработку на нашем объекте в Тарту."
 EST_protect_against_the_red_army:0 "Защититься от Красной армии"
 EST_protect_against_the_red_army_desc:0 "Укрепив ключевые районы, мы станем менее уязвимыми, если война снова придёт к нашим берегам и границам."
 EST_tartu_university_studies:0 "Исследования Тартуского университета"
 EST_tartu_university_studies_desc:0 "Наши учёные хорошо работают, открывая новые возможности в исследованиях и разработках, которыми следует воспользоваться. Имея передовой технический университет в самом сердце страны, мы сможем проводить больше исследований."
 EST_additional_research_slot:0 "Таллинский технический институт"
 EST_additional_research_slot_desc:0 "Века оккупации серьёзно затормозили наше развитие, но теперь, когда мы свободны, мы можем догнать современные технологии."
 EST_foreign_cooperation:0 "Иностранное сотрудничество"
 EST_foreign_cooperation_desc:0 "Эстония во многом зависит от стран, готовых помочь ей в борьбе против [SOV.getNameDef]."
 EST_expand_port_paldiski:0 "Расширить порт Палдиски"
 EST_expand_port_paldiski_desc:0 "Палдиски — наш главный выход к Балтийскому морю; он расположен близко к нашей столице и Финскому заливу. Если мы хотим обеспечить стабильный приток ресурсов по морю, необходимо улучшить этот порт."
 EST_prepare_for_war:0 "Готовиться к войне"
 EST_prepare_for_war_desc:0 "Великая война за независимость могла быть лишь первой в своём роде. Мы должны подготовиться к постоянно меняющемуся полю боя."
 EST_foundation_of_kumu:0 "Основание Куму"
 EST_foundation_of_kumu_desc:0 "Куму — эстонский музей, основанный в 1938 году. Построим его, чтобы наши будущие внуки могли увидеть, какие великие дела совершали их деды в прошлом."
 EST_invest_in_the_military_II:0 "Переоборудовать велосипедные фабрики"
 EST_invest_in_the_military_II_desc:0 "Наши генералы утверждают, что у нас достаточно возможностей для создания новых оружейных заводов, прежде всего на базе старых велосипедных мастерских. Похоже, найдутся и желающие инвесторы. Расширим наши военно-промышленные мощности."
 EST_more_civilian_factories_II:0 "Переориентировать кустарную промышленность"
 EST_more_civilian_factories_II_desc:0 "Переориентация наших предприятий позволит ускорить производство товаров для торговли и дальнейшего строительства."
 EST_heavy_industry:0 "Тяжёлая промышленность"
 EST_heavy_industry_desc:0 "Наши фабрики не должны зависеть от зарубежного сырья. Расширив производство металлов, мы сможем освободиться от зависимости от импорта."
 EST_standardization_of_equipment:0 "Стандартизация снаряжения"
 EST_standardization_of_equipment_desc:0 "Стандартизируя снаряжение наших солдат, мы закладываем основу современной системы снабжения."
 EST_escort_effort:0 "Развитие эскортных кораблей"
 EST_escort_effort_desc:0 "Подводные лодки представляют угрозу для наших торговых конвоев. Сосредоточившись на разработке новых моделей эсминцев, мы сможем эффективно вести противолодочную борьбу."
 EST_navy_tactics:0 "Тактика флота"
 EST_navy_tactics_desc:0 "Сосредоточившись на контрмерах против наших наиболее вероятных противников, мы сохраним преимущество в бою."
 EST_destroyer_focus:0 "Ставка на эсминцы"
 EST_destroyer_focus_desc:0 "Современные линкоры поражают воображение, но нельзя забывать о важнейшей роли скромного эсминца в защите наших конвоев."
 EST_army_modernisation:0 "Модернизация армии"
 EST_army_modernisation_desc:0 "Современное оружие для современных солдат!"
 EST_strengthen_the_government:0 "Укрепить правительство"
 EST_strengthen_the_government_desc:0 "Мы не можем позволить себе оставаться разобщёнными. Наша способность проводить преобразования напрямую зависит от единства как в сенате, так и в кабинете министров."
 EST_nobody_expects:0 "Никто не ожидает"
 EST_nobody_expects_desc:0 "Мы не должны упустить шанс первыми открыть способ обуздать первобытный огонь ядерного деления."
 EST_create_our_own_faction:0 "Создать собственный альянс"
 EST_create_our_own_faction_desc:0 "Хотя Германия сейчас является главной силой фашизма в мире, Эстония способна расширяться самостоятельно. Нам не нужно вступать в их альянс и подчиняться их командованию. Создадим собственную судьбу!"
 EST_study_foreign_tanks:0 "Изучать иностранные танки"
 EST_study_foreign_tanks_desc:0 "Эти «танки» станут важнейшей частью современных вооружённых конфликтов, и мы должны любыми необходимыми средствами не отставать от наших соседей."
 EST_invite_german_experts:0 "Пригласить немецких специалистов"
 EST_invite_german_experts_desc:0 "У нас было недостаточно времени, чтобы разработать собственные танки. Следует пригласить инженеров поработать с иностранными машинами, изучить их сильные и слабые стороны и создать ещё более совершенные образцы."
 EST_build_paldiski_port:0 "Построить порт Палдиски"
 EST_build_paldiski_port_desc:0 "Расширение нашего флота должно стать одним из главных приоритетов. Направим все доступные ресурсы на строительство новых верфей на уже существующей военно-морской базе Палдиски."
 EST_finish_central_industrial_region:0 "Завершить Центральный промышленный район"
 EST_finish_central_industrial_region_desc:0 "Завершим создание нашей централизованной оружейной промышленности."
 EST_planned_expansion:0 "Плановое расширение"
 EST_planned_expansion_desc:0 "Чтобы стимулировать внутренний строительный рынок и расширить промышленность, правительство может инвестировать в государственные строительные компании."
 EST_start_fundraising:0 "Увеличить сбор средств"
 EST_start_fundraising_desc:0 "Эстонские дети недоедают, пока наши промышленные мощности работают на войну. Наши союзные друзья вдали от линии фронта, однако, не сталкиваются с подобной бедой. Мы должны попросить их поделиться частью своих запасов, чтобы наш народ смог выстоять."
 EST_gender_equality:0 "Гендерное равенство"
 EST_gender_equality_desc:0 "Статистика показывает, что мужчины при одинаковом объёме работы получают больше женщин и имеют лучшие возможности для карьерного роста. Это бессмыслица, и мы должны положить ей конец. Женщины также должны иметь равные права!"
 EST_motorized_focus:0 "Ставка на моторизацию"
 EST_motorized_focus_desc:0 "Если мы собираемся проводить наступательные операции, нам нужна хотя бы частично моторизованная армия."
 EST_Livonian_bridgehead_strategy:0 "Ливонский плацдарм"
 EST_Livonian_bridgehead_strategy_desc:0 "Если ход войны обернётся против нас, у нас должны быть планы эффективной перегруппировки и ответного удара совместно с друзьями и союзниками."
 EST_kohta_jarve_oil_sources:0 "Нефтяные месторождения Кохтла-Ярве"
 EST_kohta_jarve_oil_sources_desc:0 "Мы только что обнаружили первые следы коммерчески выгодных нефтяных месторождений в Кохтла-Ярве. Наши учёные утверждают, что нефти там настолько много, что её хватит нашей промышленности на сотни лет! Пора начинать бурение."
 EST_artillery_modernisation:0 "Модернизация артиллерии"
 EST_artillery_modernisation_desc:0 "Мы не должны пренебрегать улучшением и модернизацией средств поддержки, необходимых нашим солдатам для эффективных действий."
 EST_anti_tank_guns:0 "Противотанковые орудия"
 EST_anti_tank_guns_desc:0 "Любой враг наверняка бросит против нас танки, особенно Советы. Мы должны быть готовы устроить им тёплый приём."
 EST_air_base_expansion:0 "Расширение авиабаз"
 EST_air_base_expansion_desc:0 "Авиабазы так же необходимы для воздушной поддержки, как сама воздушная поддержка — для современной войны."
 EST_fighter_modernisation:0 "Модернизация истребителей"
 EST_fighter_modernisation_desc:0 "Истребители — основа любых ВВС, и нельзя допустить их устаревания. По мере развития остальных сил авиации должны совершенствоваться и они."
 EST_air_innovations:0 "Авиационные инновации"
 EST_air_innovations_desc:0 "В области воздушной стратегии и тактики нам ещё многое предстоит сделать."
 EST_heavy_fighter_concept:0 "Концепция тяжёлого истребителя"
 EST_heavy_fighter_concept_desc:0 "Если нам придётся перейти в наступление, понадобится новый тип истребителя, способный долго действовать в глубине вражеской территории."
 EST_naval_bomber_experiments:0 "Эксперименты с морскими бомбардировщиками"
 EST_naval_bomber_experiments_desc:0 "Господство в воздухе столь же важно на море, как и на суше. Специализированная авиация для морской войны поможет достичь этой цели."
 EST_medium_bomber_focus:0 "Ставка на средние бомбардировщики"
 EST_medium_bomber_focus_desc:0 "Развитие концепции точного бомбометания с увеличенной дальностью для выполнения задач поддержки."
 EST_light_bomber_focus:0 "Ставка на лёгкие бомбардировщики"
 EST_light_bomber_focus_desc:0 "Не следует недооценивать ценность пикирующих бомбардировщиков для непосредственной авиационной поддержки."
 EST_air_modernisations_programme:0 "Программа модернизации авиации"
 EST_air_modernisations_programme_desc:0 "Теория авиации не менее важна, чем технологии. Новые тактические приёмы для наших пилотов ещё только предстоит открыть."
 EST_special_marine_forces:0 "Специальные морские силы"
 EST_special_marine_forces_desc:0 "Любые наступательные операции в Прибалтике потребуют десантных сил. Мы должны восстановить Мередессантпатальон."
 EST_protect_our_borders:0 "Защитить наши границы"
 EST_protect_our_borders_desc:0 "Построив наземные укрепления, мы покажем Советам, что намерены защищаться от любой внешней угрозы, а не только от них."
 EST_deterrence:0 "Сдерживание"
 EST_deterrence_desc:0 "Растущая угроза европейского фашизма ясно показывает, что одних заявлений о нейтралитете недостаточно. Мы должны вооружаться, чтобы защитить свой статус."
 EST_reform_government:0 "Реформировать правительство"
 EST_reform_government_desc:0 "Работая сообща, мы сможем обеспечить выживание нашей страны в грядущие мрачные времена. Чтобы добиться успеха, необходимо очистить правительство от фашистской и коммунистической идеологии и запретить эти партии в нашей стране."
 POL_rocket_development_x:0 "Развитие ракетной техники"
 POL_rocket_development_x_desc:0 "Сосредоточим усилия на разработке собственной ракетной техники. Получив возможность наносить удары без предупреждения, наши силы станут неуязвимыми!"
 EST_national_assembly_election:0 "Выборы в Национальное собрание"
 EST_national_assembly_election_desc:0 "Сейчас проходит конституционный референдум, основанный на утверждении, что предыдущая конституция была слишком авторитарной. Все партии, кроме Патриотической лиги, были запрещены, так что судьба конституции практически предрешена."
 EST_adopt_the_third_constiution:0 "Принять третью конституцию"
 EST_adopt_the_third_constiution_desc:0 "Принятие новой конституции наконец положит конец гражданским волнениям, связанным с полномочиями, закреплёнными предыдущей."
 EST_bypass_the_riigikogu:0 "Обойти Рийгикогу"
 EST_bypass_the_riigikogu_desc:0 "Рийгикогу — не более чем стена между нами и реформами. Проведение законов в обход парламента — лучший способ достичь наших целей."
 EST_disband_student_councils:0 "Распустить студенческие движения"
 EST_disband_student_councils_desc:0 "Студенческие протесты по поводу гражданских свобод вышли из-под контроля. Их необходимо немедленно распустить."
 EST_amnesty_for_opponents:0 "Амнистия для политических противников"
 EST_amnesty_for_opponents_desc:0 "Поскольку оппозиция побеждена, мы можем объявить амнистию, чтобы стабилизировать страну."
 EST_economic_stimulous:0 "Программы развития"
 EST_economic_stimulous_desc:0 "Экономика Эстонии, возможно, не так сильна, как у некоторых других стран, но с помощью программ развития мы можем вывести её на новый уровень."
 EST_under_representation:0 "Ограничить представительство оппозиции"
 EST_under_representation_desc:0 "Обществу незачем слушать ложь радикальных реформаторов. И сами реформаторы не заслуживают места в нашем правительстве."
 EST_appoint_fredrich_karl_akel:0 "Назначить немецких министров иностранных дел"
 EST_appoint_fredrich_karl_akel_desc:0 "Нам следует попытаться умиротворить двух гигантов у наших границ, даже если для этого придётся предложить им место в нашей стране."
 EST_soviet_estonian_treaty:0 "Советско-эстонский договор о взаимопомощи"
 EST_soviet_estonian_treaty_desc:0 "Эстония, как и весь Балтийский регион, окружена превосходящими противниками. Если нам удастся сотрудничать хотя бы с одним из них, у нас появится шанс выжить."
 EST_election_boycotts:0 "Подчеркнуть бойкот выборов"
 EST_election_boycotts_desc:0 "Выборы — не более чем подтасованная система, позволяющая Константину Пятсу проводить свою повестку. Мы можем вынудить власть пойти на уступки и добиться по-настоящему свободных выборов."
 EST_jaan_tonison:0 "Возвращение к республиканизму"
 EST_jaan_tonison_desc:0 "Яан Тыниссон давно призывает вернуться к более демократической системе. После его победы на выборах мы наконец сможем провести необходимые реформы."
 EST_remove_soviet_sympathizers:0 "Изгнать сторонников Советов"
 EST_remove_soviet_sympathizers_desc:0 "Коммунисты и советские коллаборационисты не должны иметь права голоса в нашей стране. Мы должны избавиться от них, прежде чем они приобретут слишком большое влияние."
 EST_agriculture_coopoeratives:0 "Развивать сельскохозяйственные кооперативы"
 EST_agriculture_coopoeratives_desc:0 "Сельскохозяйственные кооперативы позволят нашей промышленности сосредоточиться на более масштабной индустриализации."
 EST_estonianization:0 "Эстонизация"
 EST_estonianization_desc:0 "Эстония не должна поддаваться никакому иностранному влиянию. Осознание этого может поднять боевой дух."
 EST_baltic_entente:0 "Укрепить Балтийскую Антанту"
 EST_baltic_entente_desc:0 "Эстония в одиночку не сможет защитить себя от всех угроз. Нам следует привлечь союзников для защиты нашей свободы."
 EST_protect_trade:0 "Отделить торговлю от дипломатии"
 EST_protect_trade_desc:0 "Нам следует принять меры и ограничить влияние наших дипломатических действий на торговлю, чтобы способствовать росту экономики."
 EST_constitutional_referendumm:0 "Провести конституционный референдум"
 EST_constitutional_referendumm_desc:0 "Установление режима, который расширит полномочия владельцев предприятий и будет сотрудничать с Германским рейхом, — лучший выбор для будущего."
 EST_land_ownership:0 "Расширить полномочия землевладельцев"
 EST_land_ownership_desc:0 "Землевладельцы являются движущей силой нашей экономики. Расширение их влияния в правительстве вряд ли принесёт вред."
 EST_departmentalization:0 "Департаментализация"
 EST_departmentalization_desc:0 "Децентрализация нашей администрации — простой способ повысить производительность и эффективность."
 EST_german_admiration:0 "Вырваться из советской сферы"
 EST_german_admiration_desc:0 "Многие считают Эстонию частью российской сферы влияния. Однако, заключив союз с врагами России, мы сможем по-настоящему утвердить свою независимость."
 EST_military_assistance:0 "Германо-эстонские совместные учения"
 EST_military_assistance_desc:0 "Германская армия служит для нас образцом, на основе которого мы можем обучать собственные вооружённые силы."
 EST_estonian_volunteer_regiment:0 "Эстонский добровольческий полк"
 EST_estonian_volunteer_regiment_desc:0 "Мы могли бы отправить часть своих дивизий на поддержку союзников, не вмешиваясь напрямую. Это лишь принесёт нам дополнительный боевой опыт."
 EST_communist_victory:0 "Триумф организации фронта"
 EST_communist_victory_desc:0 "Необходимо провести масштабные социальные реформы, чтобы обеспечить модернизацию Эстонии."
 EST_free_education:0 "Ввести бесплатное образование"
 EST_free_education_desc:0 "Образование — базовое право человека, необходимое любой развитой стране."
 EST_social_security:0 "Уделить приоритет социальной защите"
 EST_social_security_desc:0 "Многие процветающие страны добились больших успехов благодаря мерам социальной защиты. Нам следует последовать их примеру."
 EST_combat_unemployment:0 "Учредить программы занятости"
 EST_combat_unemployment_desc:0 "Безработица по-прежнему остаётся проблемой. Пришло время наконец предпринять против неё реальные меры."
 EST_salary_raise:0 "Повысить базовые зарплаты"
 EST_salary_raise_desc:0 "Повышение зарплат может улучшить условия жизни многих рабочих."
 EST_reorganize_taxation:0 "Реорганизовать налогообложение"
 EST_reorganize_taxation_desc:0 "Большую часть налоговых поступлений следует направлять на стимулирование экономики и развитие дорожной сети."
 EST_democratization_of_the_army:0 "Демократизация армии"
 EST_democratization_of_the_army_desc:0 "Любой современной стране необходима соответствующая времени армия. Новая тактика и реорганизация могут доказать свою эффективность на поле боя."
 EST_demmand_friendship:0 "Потребовать верности Советскому Союзу"
 EST_demmand_friendship_desc:0 "Советский Союз — единственная страна, способная помочь нам защитить наши идеалы. Необходимость установления тесных связей с ним даже не должна ставиться под сомнение."
 EST_student_protests:0 "Студенческие протесты"
 EST_student_protests_desc:0 "В последнее время вспыхнула волна протестов, возглавляемых студентами, выступающими за гражданские свободы и против режима Константина Пятса."
