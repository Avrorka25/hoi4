 NK_desc:0 "Связанные с Союзом обороны организации в общей сложности объединяют более 21 000 добровольцев. В их число входят женский корпус Союза обороны Эстонии «Найскодукайтсе», юношеский корпус «Нооред Коткад» и девичий корпус «Кодутютред»."
