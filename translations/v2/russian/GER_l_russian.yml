 r56.kill_hitler.1.t:0 "Гитлер погиб при взрыве"
 r56.kill_hitler.1.desc:0 "[GER.GetNameDefCap] Похоже, что его потрясла попытка переворота, когда группе офицеров вермахта удалось убить Гитлера. Во время выставки новейшего оружия, произведенного в Рейхе, офицер, руководящий Фюрером, нес бомбу и использовал ее для убийства солдат. [GER.GetADjective] Канцлер и двое его телохранителей.\n\nЧто будет дальше, еще предстоит выяснить, но в ближайшие несколько часов ожидается принесение присяги новому фюреру."
 r56.kill_hitler.1.a:0 "Переворот?"
 r56.kill_hitler.1.b:0 "Предатели!"
 r56.kill_hitler.2.t:0 "[GER.GetADjective] канцлер расстрелян!"
 r56.kill_hitler.2.desc:0 "Во время выступления на одном из обычных митингов канцлер государства [GER.GetNameDef] Адольф Гитлер подвергся нападению группы убийц с пистолетами-пулемётами. За считаные секунды они изрешетили трибуну градом пуль и скрылись из зала, убив и ранив нескольких охранников СС.\n\nЧто произойдёт дальше, пока неизвестно, но ожидается, что новый фюрер принесёт присягу в ближайшие часы."
 r56.kill_hitler.2.a:0 "Переворот?"
 r56.kill_hitler.2.b:0 "Предатели!"
 r56.kill_hitler.3.t:0 "Гитлер погиб в схватке с мастером боевых искусств!"
 r56.kill_hitler.3.desc:0 "Посетители вчерашнего митинга в Берлине были ошеломлены, когда неизвестный мужчина вышел на сцену и вызвал фюрера на бой. Гитлер остановил телохранителей и заявил, что он Кунг-фюрер и всегда знал, что однажды мастер кунг-фу бросит ему вызов. Таинственный человек представился Брандсоном Ли и обрушился на [GER.GetADjective] канцлера с яростью тигра. Поединок длился несколько минут. Удары были столь быстрыми, что уследить за ними было невозможно, но внезапно незнакомец вонзил ладонь в грудь фюрера. Тот лишь раз ахнул и рухнул на землю. СС открыла огонь, однако убийца уклонился от нескольких пуль, другие остановил голыми руками, а затем скрылся через боковую дверь, рубя караульных направо и налево. Что будет дальше, пока неизвестно..."
 r56.kill_hitler.3.a:0 "*Выплёвывает кофе*"
 r56.kill_hitler.3.b:0 "*Выплёвывает чай*"
 r56.kill_hitler.3.c:0 "*Выплёвывает водку*"
 r56.kill_hitler.3.d:0 "*Выплёвывает пиво*"
 r56.kill_hitler.3.e:0 "*Выплёвывает сливовицу*"
 r56.kill_hitler.3.f:0 "*Выплёвывает пинар*"
 r56.kill_hitler.3.g:0 "*Выплёвывает виски*"
 r56.kill_hitler.3.h:0 "*Выплёвывает саке*"
 r56.kill_hitler.3.i:0 "*Выплёвывает снюс*"
 r56.kill_hitler.3.j:0 "*Выплёвывает сироп*"
 r56.kill_hitler.3.k:0 "*Выплёвывает шнапс*"
 r56.kill_hitler.3.l:0 "*Выплёвывает текилу*"
 r56.kill_hitler.3.m:0 "*Выплёвывает инка-колу*"
 r56.kill_hitler.3.n:0 "*Выплёвывает эму*"
 r56.kill_hitler.3.o:0 "*Выплёвывает женевер*"
 r56.kill_hitler.3.p:0 "*Выплёвывает риоху*"
 r56.kill_hitler.3.q:0 "*Выплёвывает понтикку*"
 r56.kill_hitler.4.t:0 "Самолёт Гитлера разбился!"
 r56.kill_hitler.4.desc:0 "Официальный доклад подтвердил, что обломки самолёта, разбившегося вскоре после взлёта из аэропорта Темпельхоф, действительно принадлежат личному самолёту фюрера, находившегося на борту. Заговорщики-офицеры тайно пронесли бомбу, в то время как весь рейх, похоже, охватил общий мятеж.\n\nЧто произойдёт дальше, пока неизвестно, но ожидается, что новый фюрер принесёт присягу в ближайшие часы."
 r56.kill_hitler.4.a:0 "Переворот?"
 r56.kill_hitler.4.b:0 "Предатели!"
 r56.kill_hitler.5.t:0 "Рейхсканцелярия разрушена взрывом!"
 r56.kill_hitler.5.desc:0 "Вчера вечером громкий грохот и мощный взрыв уничтожили стол Адольфа Гитлера в Рейхсканцелярии в Берлине. Телохранители ничего не смогли сделать и лишь увидели обрывки мундира и Железный крест, блестящий среди дымящегося пепла.\n\nЧто произойдёт дальше, пока неизвестно, но ожидается, что новый фюрер принесёт присягу в ближайшие часы."
 r56.kill_hitler.5.a:0 "Переворот?"
 r56.kill_hitler.5.b:0 "Предатели!"
 r56.kill_hitler.6.t:0 "Гитлер убит Хитменом в Оберзатльцберге!"
 r56.kill_hitler.6.desc:0 "Неожиданное коммюнике подтвердило слухи о том, что наёмный убийца застрелил [GER.GetADjective] канцлера Адольфа Гитлера во время отдыха на альпийской вилле. Единственная пуля попала ему в голову с большого расстояния, что говорит о высокой меткости убийцы и, вероятно, военной подготовке.\n\nЧто произойдёт дальше, пока неизвестно, но ожидается, что новый фюрер принесёт присягу в ближайшие часы."
 r56.kill_hitler.6.a:0 "Переворот?"
 r56.kill_hitler.6.b:0 "Предатели!"
 r56.kill_hitler.7.t:0 "Гитлер застрелен!"
 r56.kill_hitler.7.desc:0 "Сегодня государство [GER.GetNameDef] охватил хаос: несколько сообщений утверждают, что Адольф Гитлер был застрелен в собственном, считавшемся безопасным доме. Об нападавшем известно немного, но ходят слухи, что стрелок был ветераном Великой войны и представителем батальона самого фюрера в 1919 году при Баварской республике советов. Пока нет никаких сведений о местонахождении виновного и о том, как ему удалось так легко обойти охрану. Мотив остаётся ещё большей загадкой.\n\nЧто произойдёт дальше, пока неизвестно, но ожидается, что новый фюрер принесёт присягу в ближайшие часы."
 r56.kill_hitler.7.a:0 "Переворот?"
 r56.kill_hitler.7.b:0 "Предатели!"
 r56.kill_hitler.8.t:0 "Фюрер зарезан!"
 r56.kill_hitler.8.desc:0 "[GER.GetNameDefCap] Он был потрясен известием об убийстве своего фюрера Адольфа Гитлера. Похоже, что немецкий канцлер пропал на несколько часов, начав поднимать тревогу среди своего окружения. После дня исследований его тело было наконец обнаружено спрятанным под бочкой топлива рядом с нефтяным складом недалеко от пригорода Берлина Марзан. Тело канцлера имело явные следы проникновения пронзительного оружия. В предварительном отчете он был определен как боевой нож. Затем тело перенесли и, наконец, спрятали на месте его обнаружения. Излишне говорить, что берлинский гарнизон находился в состоянии повышенной готовности в течение двух дней, и начинают циркулировать слухи о потенциальном убийце наряду с вопросом о преемственности между НСДАП."
 r56.kill_hitler.8.a:0 "Переворот?"
 r56.kill_hitler.8.b:0 "Предатели!"
 r56.kill_hitler.9.t:0 "Гитлер погиб в бою!"
 r56.kill_hitler.9.desc:0 "\nПосле отступления войск государства [SOV.GetAdjective] из Севастополя тело Гитлера было найдено в траншее рядом с товарищами. Семён Гитлер, украинский еврей, отважно сражался против захватчиков. Получив ранение в бою, он всё же вернулся в строй, проявив мужество, которое пристыдило бы одноимённого баварского связного времён Первой мировой войны."
 r56.kill_hitler.9.a:0 "Погодите, это не тот!"
 r56.kill_hitler.9.b:0 "Найн! Майн фюр..."
 r56.kill_hitler.10.t:0 "Гитлер совершает самоубийство"
 r56.kill_hitler.10.desc:0 "\nПоскольку поражение государства [GER.GetNameDef] кажется неизбежным, Адольф Гитлер, по сообщениям, совершил самоубийство в командном бункере в [GER.GetAdjective] столице, предпочтя смерть плену.\n\nВ завещании новым [GER.Adjective] президентом назначен адмирал Карл Дёниц, принявший командование остатками [GER.GetAdjective] войск. Хотя Дёниц заявил о намерении «добиться наиболее благоприятного мира», так называемый «Тысячелетний рейх» подходит к концу."
 r56.kill_hitler.10.a:0 "Интересно."
 r56.kill_hitler.10.b:0 "Скатертью дорога."
 r56.kill_hitler.10.c:0 "Катастрофа!"
 r56.kill_hitler.10.d:0 "Государство [GER.GetNameDef] победит!"
 GER_cede_884_to_HUN:0 "Передать Прекмурье Венгрии"
 GER_cede_853_to_ITA:0 "Передать Любляну Италии"
 r56_italy_ljubljana_annexation.1.t:0 "Германия передаёт Любляну"
 r56_italy_ljubljana_annexation.1.d:0 "Государство [FROM.GetNameDefCap] передало нам регион Любляна для укрепления дружественных отношений."
 r56_italy_ljubljana_annexation.1.a:0 "Превосходно."
 r56_hungary_prekmurje_annexation.1.t:0 "Государство [From.GetName] передаёт Прекмурье"
 r56_hungary_prekmurje_annexation.1.d:0 "Государство [FROM.GetNameDefCap] передало нам регион Прекмурье для укрепления дружественных отношений."
 r56_hungary_prekmurje_annexation.1.a:0 "Превосходно."
 PRE_call_other_german_states:0 "Призвать другие германские государства"
 GER_naval_gunnery_r56:0 "Морская артиллерия"
 GER_naval_gunnery_r56_desc:0 "Нашему надводному флоту понадобятся крупнейшие орудия."
 GER_naval_effort_r56:0 "Отказаться от морского договора"
 GER_naval_effort_r56_desc:0 "Морской договор 1935 года между государствами [ENG.GetAdjective] и [GER.GetAdjective] — лишь очередная уловка, призванная не дать нашей стране достичь величия и позволить государству [ENG.GetNameDef] господствовать над нами. Мы больше не можем склоняться и пренебрегать силой флота."
 r56_GER_decision_promote_hans_von_luck:0 "Повысить Ханса фон Люка"
 r56.ger.1.t:0 "Окончательная победа"
 r56.ger.1.desc:0 "Наши военные усилия столкнулись с множеством неудач, а враги глубоко проникли в сердце Отечества. Но мы сильнее их и, в отличие от них, способны вынести огромные страдания и продолжать борьбу до победы. Мы сплотим всех доступных граждан великой нации, чтобы достичь победы или погибнуть в попытке."
 r56.ger.1.a:0 "Окончательная победа близка. Нужно лишь продолжать наступать."
 r56_endsieg_idea:0 "Окончательная победа"
 r56_endsieg_idea_desc:0 "Окончательная победа близка."
 r56_GER_endsieg_tt:0 "§WСоздать§! части §Yфольксштурма§! §Wи§! §Yэрзацхеера§! §Wв§! §Yнекоторых полностью контролируемых национальных регионах§!."
 r56.ger.2.t:0 "Ближе к окончательной победе"
 r56.ger.2.desc:0 "Казалось, Отечество уже потеряно, но стойкость страны в наших испытаниях оказалась не напрасной. Мы вытеснили врагов из родной земли и заставили их отступать. До выстраданной победы ещё далеко, однако теперь она кажется гораздо ближе."
 r56.ger.2.a:0 "Окончательная победа ближе, чем когда-либо!"
 r56_GER_endsieg_2_tt:0 "§RРасформировать§! §YВолкстурм§! §Wи§! §YЭрсацхеир§! §Wединицы§!"
 r56.ger.4.t:0 "Смерть Вильгельма III"
 r56.ger.4.desc:0 "Кайзер Вильгельм III скончался от старости. Трон перешёл к его сыну Вильгельму IV, который оставляет большинство обязанностей политикам."
 r56.ger.4.a:0 "Король и император умер — да здравствует король и император."
 r56.ger.6.t:0 "Государство [GER.GetNameDefCap] предлагает фронт против фашизма"
 r56.ger.6.d:0 "[GER.GetAdjective] лидер [GER.GetLeader] направил предложение забыть разногласия и создать единый фронт против надвигающейся «фашистской угрозы» в Европе."
 r56.ger.6.a:0 "В единстве наша сила."
 r56.ger.6.b:0 "Лучше смерть, чем красные!"
 r56.ger.7.t:0 "[GER.GetAdjective] ультиматум"
 r56.ger.7.d:0 "Государство [GER.GetNameDefCap], очевидно настроенное крайне враждебно, направило жёсткий ультиматум с требованием немедленно капитулировать перед ним ради защиты от «фашистской угрозы» в Европе.\n\nГосударство [GER.GetNameDefCap] угрожает «уничтожить нас любой ценой», если мы не подчинимся. Требования возмутительны, но, возможно, у нас нет сил сопротивляться."
 r56.ger.7.a:0 "Мы должны уступить."
 r56.ger.7.b:0 "Мы не сдадимся этим красным дьяволам!"
 r56.ger.8.t:0 "Государство [AUS.GetNameDefCap] капитулирует"
 r56.ger.8.d:0 "Не имея других вариантов, государство [AUS.GetNameDefCap] согласилось с нашими условиями и полностью капитулировало.\n\nМы одержали ещё одну победу над фашистами."
 r56.ger.8.a:0 "Превосходно."
 r56.ger.9.t:0 "Государство [AUS.GetNameDefCap] отказывается"
 r56.ger.9.d:0 "Государство [AUS.GetNameDefCap] проявило упрямство и высокомерно отвергло наши условия защиты от фашистской угрозы.\n\nОно доказало, что является ещё одним тираном Европы, и мы должны уничтожить его любой ценой."
 r56.ger.9.a:0 "Тогда война."
 r56.ger.10.t:0 "Государство [FRA.GetNAmeDefCap] принимает наше предложение"
 r56.ger.10.d:0 "Государство [FRA.GetNAmeDefCap] с радостью приняло предложение и согласилось прекратить всю вражду между нашими странами ради борьбы с фашистской угрозой в Европе."
 r56.ger.10.a:0 "В единстве наша сила."
 r56.ger.11.t:0 "Государство [FRA.GetNameDefCap] отклоняет наше предложение"
 r56.ger.11.d:0 "Государство [FRA.GetNameDefCap] возмутительным образом отказалось забыть разногласия. Враждебные отношения продолжатся, несмотря на фашистскую угрозу в Европе."
 r56.ger.11.a:0 "Высокомерные глупцы."
 r56.ger.15.t:0 "Первый Венский арбитраж"
 r56.ger.15.d:0 "Венгры были среди народов, сильнее всего пострадавших после Великой войны. При разделе Австро-Венгерской империи многие из них оказались на чужой земле, где их предки жили веками. Мы можем значительно улучшить отношения с государством [HUN.GetNameDef], передав ему часть территорий государства [CZE.GetNameDef]."
 r56.ger.15.a:0 "Передать им [664.getName] и [996.getName]!"
 r56.ger.15.b:0 "Эта территория наша!"
 r56.ger.15.c:0 "Словакия заслуживает сохранить её."
 r56.ger.34.t:0 "Государство [FROM.GetName] предлагает интеграцию"
 r56.ger.34.d:0 "Государство [FROM.GetNameDefCap] становится всё более важным партнёром государства [ROOT.GetNameDef] и теперь стремится углубить сотрудничество посредством экономической и политической интеграции."
 r56.ger.34.a:0 "Более тесное сотрудничество будет выгодно."
 r56.ger.34.b:0 "Им нельзя доверять."
 r56.ger.34.c:0 "Мы должны устранить их влияние."
 r56.ger.35.t:0 "Государство [FROM.GetName] принимает интеграцию"
 r56.ger.35.desc:0 "[FROM.GetAdjective] посол сообщил, что правительство государства [FROM.GetNameDef] заинтересовано в нашем предложении дальнейшей интеграции. Укрепление экономических связей обещает положительно повлиять на обе страны."
 r56.ger.35.a:0 "Прекрасно."
 r56.ger.36.t:0 "Государство [FROM.GetName] отказывается от интеграции"
 r56.ger.36.desc:0 "Представители [FROM.GetAdjective] правительства сообщили, что не намерены выполнять действия, изложенные в нашем предложении об интеграции. Они заверяют, что хотят продолжать торговые отношения, но отказываются позволить нам расширять политическое влияние."
 r56.ger.36.a:0 "Увы, ничего не поделать."
 r56.ger.36.b:0 "Посмотрим, как они справятся без нас."
 r56.ger.36.c:0 "Это не вариант."
 r56.ger.39.t:0 "Государство [FROM.GetName] свергает правительство"
 r56.ger.39.d:0 ""
 r56.ger.39.a:0 "Их влияние было в основном положительным."
 r56.ger.39.b:0 "Мы должны сопротивляться!"
 r56.ger.40.t:0 "Поддерживаемые государством [FROM.GetAdjective] силы провалили переворот"
 r56.ger.40.d:0 "Поддерживаемые государством [FROM.GetAdjective] корпоративисты сегодня попытались установить дружественное правительство, но полиция и сторонники властей остановили их. Эта крайняя эскалация позволила нам провести чистку наиболее заметных сторонников движения, однако она серьёзно скажется на отношениях с государством [GER.GetNameDef]."
 r56.ger.40.a:0 ""
 r56.ger.41.t:0 "В государстве [FROM.GetName] сформировано дружественное государству [ROOT.GetAdjective] правительство"
 r56.ger.42.t:0 "Переворот в государстве [FROM.GetName] провалился"
 r56.ger.42.d:0 "Поддерживаемые государством [ROOT.GetAdjective] силы столкнулись в государстве [FROM.GetNameDef] с неожиданно ожесточённым сопротивлением. Полиция не позволила военизированным формированиям занять ключевые позиции, что привело к многочисленным смертям и громким арестам. Похоже, такой возможности больше не представится."
 r56.ger.42.a:0 "Уничтожить улики"
 news.339.title:0 "Союзная оккупация Германии"
 news.339.desc:0 "После окончания Второй мировой войны в Европе союзники установили полный контроль над Германией и разделили её на четыре зоны оккупации: [ENG.GetAdjective] и [FRA.GetAdjective] на западе, [USA.GetAdjective] и [SOV.GetAdjective] на востоке. Сколько времени потребуется для восстановления и денацификации этих земель, неизвестно."
 news.339.a:0 "Никогда снова."
 r56_yalta_occupation_tt:0 "Если государства [FRA.GetNameDef], [ENG.GetNameDef] и [USA.GetNameDef] присутствовали на Ялтинской конференции, они разделят государство [GER.GetNameDef] на зоны оккупации."
 r56_yalta_decisions_available_tt:0 "Станут доступны решения по восстановлению государств в оккупационных зонах Германии и Австрии."
 r56_yalta_decisions_available_2_tt:0 "Станут доступны решения по созданию новых государств в Германии и Австрии, если эти территории превращены в области прямого управления и оккупации."
 ger.renegotiate_versailles.1.t:0 "Государство [GER.GetNameDefCap] предлагает пересмотреть Версальский договор"
 ger.renegotiate_versailles.1.d:0 "Государство [GER.GetNameDefCap] обратилось к нам с интересным предложением. Чтобы предотвратить возобновление вражды между нашими странами из-за событий внутри него, оно предлагает пересмотреть Версальский договор. Государство [GER.GetAdjective] больше не будет выплачивать репарации, а оккупация территорий [GER.GetNonIdeologyName] прекратится.\n\nВзамен оно обещает соблюдать ограничения на авиацию, армию и флот и признать изменение границ [GER.GetNonIdeologyName]. Однако оно настаивает, что мы должны предоставить государству [GER.GetNameDef] гарантии безопасности, поскольку у него не будет сильной регулярной армии.\n\nГосударство [GER.GetNameDefCap] твёрдо убеждено, что этот пересмотр — единственный путь сохранить мир в наше время. Стоит ли верить его словам?"
 ger.renegotiate_versailles.1.a:0 "Ради мира в наше время."
 ger.renegotiate_versailles.1.b:0 "Старые договоры нас не интересуют."
 ger.renegotiate_versailles.2.t:0 "Государство [FROM.GetNameDefCap] соглашается пересмотреть Версальский договор"
 ger.renegotiate_versailles.2.d:0 "Государство [FROM.GetNameDefCap] любезно согласилось пересмотреть с нами Версальский договор, признав, что это необходимо для сохранения мира.\n\nУсловия договора уже вступили в силу. Мы больше не сможем использовать значительную часть вооружённых сил, но государство [FROM.GetNameDef] согласилось защищать нас от иностранной агрессии."
 ger.renegotiate_versailles.2.a:0 "Мир в наше время."
 ger.renegotiate_versailles.3.t:0 "Государство [FROM.GetNameDefCap] отказывается пересматривать Версальский договор"
 ger.renegotiate_versailles.3.d:0 "Государство [FROM.GetNameDefCap] отклонило наше предложение пересмотреть Версальский договор, заявив, что не заинтересовано в пересмотре старых соглашений. На первый взгляд это может быть хорошей новостью, но возникает вопрос об истинных мотивах государства [FROM.GetNameDef]."
 ger.renegotiate_versailles.3.a:0 "Благословение или проклятие?"
 ger_abided_by_versailles:0 "Соблюдение Версальского договора"
 GER_develop_the_heer:0 "Развивать сухопутные войска"
 GER_develop_the_heer_desc:0 "Хайнц Гудериан и другие радикальные теоретики продвигают смелые новые доктрины, основанные на связи, выявлении «Schwerpunkt» и локальной концентрации объединённых родов войск. Предоставление им свободы действий поможет избежать мясорубки Великой войны."
 GER_luftwaffe_innovations:0 "Нововведения люфтваффе"
 GER_luftwaffe_innovations_desc:0 "Современные войны невозможно выиграть без господства в воздухе. Мы должны сделать всё возможное для развития ВВС!"
 GER_afghanistan_friend_vanilla:0 "Подружиться с Афганистаном"
 GER_afghanistan_friend_vanilla_desc:0 "Государство [AFG.GetName] быстро модернизируется и в последние годы выстроило устойчивые отношения с [GER.GetAdjective] правительством. Если привлечь его на нашу сторону, оно станет удобным путём в остальную Центральную Азию."
 GER_technocrats_idea:0 "Технократическая промышленность"
 GER_autarky_idea_standard:0 "Автаркическая промышленность"
 ger_anti_colonial:0 "Антиколониализм"
 ger_anti_colonial2:0 "Антиколониализм"
 GER_protector_of_peace:0 "Защитник мира"
 GER_flak_towers:0 "Проект зенитных башен"
 GER_tank_quantity:0 "Ускоренное производство танков"
 GER_tank_quality:0 "Высококачественные танки"
 WIP_flag:0 "Эта часть дерева находится в разработке, открыть её можно только консольными командами."
 formable_cored_states_tt:0 "Получает §Yнациональные территории§! во §Yвсех требуемых регионах§!."
 GER_civil_war_tt:0 "Между §9фашистскими§!, §3консервативными§! и §tсоциалистическими§! силами начнётся §Hгражданская война§!."
 GER_help_SOV_revolutionaries:0 "Вмешаться в советскую гражданскую войну"
 GER_help_SOV_revolutionaries_desc:0 "Поддержка революционной борьбы против остатков сталинского режима может избавить мир от коммунизма!"
 GER_inter_communist_fighting_tt:0 "Получает цели войны против §HЕвропейской оппозиции§!."
 kpd_gets_opposition:0 "§RСформируется Правая оппозиция.§!"
 r56_german_cw_ongoing:0 "Государство [GER.GetNameDefCap] находится в состоянии гражданской войны."
 GER_recruit_officers_com_tt:0 "\nМы завербуем §Hсоветников§! и §Hкомандующих§! с побеждённой §Hдемократической§! стороны. Однако §Hсопротивление§! нашему делу сохранится."
 GER_AUS_wont_get_annexed_tt:0 "§RСобытие присоединения Австрии после её вступления в ваш альянс будет заблокировано.§!"
 GER_dem_ITA_pact_tt:0 "§HДемократическая§! или §Hмонархическая Италия§! вступит в ваш альянс. Если §HИталия§! §Hфашистская§!, а §HЮгославия§! §Hкоммунистическая§!, вы сможете совместно сражаться против них.\n\n"
 kill_advisor_tt:0 "§Y[THIS.GetName]§! погибает."
 GER_forts_unavailable:0 "§Rукрепления не будут построены, поскольку территория либо демилитаризована, либо не находится под нашим контролем.§!\n"
 GER_improved_battleship_hull_research_tt:0 "\nПосле исследования технологии §Yкорпуса тяжёлого корабля 1940 года§!:\n"
 GER_recruit_officers_com:0 "Завербовать побеждённых офицеров"
 GER_anti_expansionism:0 "Антиэкспансионизм"
 GER_anti_expansionism_desc:0 "Осуждая агрессивную экспансию, мы сможем привлечь региональные государства, которые не планируют её сами или находятся под угрозой."
 GER_expansionism_light:0 "Наследие Штреземана"
 GER_expansionism_light_desc:0 "Хотя нам не следует повторять ошибки Веймарской республики, нельзя отрицать, что её напористая дипломатия под руководством таких людей, как Густав Штреземан, сделала бы страну сильнее, если бы не Великая депрессия."
 GER_renegotiate_versailles:0 "Пересмотреть Версальский договор"
 GER_renegotiate_versailles_desc:0 "Последние два десятилетия Версальский договор обвиняли во всех бедах [GER.GetAdjective] народа, хотя на деле он лишь результат слабых переговоров. Чтобы обеспечить мир, мы должны научиться искать компромисс с теми, кто навязал нам договор, чтобы он приносил пользу обеим сторонам."
 GER_legacy_of_gluckliche_zwanziger_jahre:0 "Наследие счастливых двадцатых"
 GER_legacy_of_gluckliche_zwanziger_jahre_desc:0 "«Glückliche Zwanziger Jahre», или «Счастливые двадцатые», стали временем значительного восстановления и роста экономики Веймарской республики. Это показало потенциал [GER.GetAdjective] народа при мирной демократической системе. Теперь, когда у нас есть необходимые средства, мы наконец можем полностью реализовать этот потенциал."
 GER_german_scientific_haven:0 "[GER.GetAdjective] научная гавань"
 GER_german_scientific_haven_desc:0 "Великая утечка умов завершилась, и таланты людей больше не пропадают из-за отправки в армию или на войну. Они могут полностью сосредоточиться на образовании и работе. Этот рост привёл к появлению огромного числа новых учёных, которые значительно ускорят технологическое развитие страны."
 GER_join_allies:0 "Вступить в союзники"
 GER_join_allies_desc:0 "Союз с британцами даст нам беспрецедентное влияние на мир."
 GER_lead_democracies:0 "Возглавить малые демократии"
 GER_lead_democracies_desc:0 "Только возрождённая [GER.GetAdjective] нация обладает волей стать истинным защитником Европы."
 GER_lead_communists:0 "Новый образец коммунизма"
 GER_lead_communists_desc:0 "Государство [SOV.GetNameDefCap] слабо и не представляет истинный коммунизм! Только государство [Root.GetNameDef] может гарантировать безопасность и процветание европейских социалистических стран."
 GER_inter_communist_fighting:0 "Бороться с нелегитимным коммунизмом"
 GER_inter_communist_fighting_desc:0 "Страны, где рабочие не освобождены, не понимают, что существуют разные коммунистические идеологии. Мы должны защитить свою и укрепить позиции — буржуазные государства не станут вмешиваться."
 GER_anti_colonialism:0 "Антиимпериалистическая позиция"
 GER_anti_colonialism_desc:0 "С тех пор, как наши колонии были захвачены, многое изменилось, и мы должны признать колонизацию за зло, которое она есть, кроме того, это принесет нам некоторую пользу с несколькими восходящими сверхдержавами."
 GER_ally_benelux:0 "Союз Бенилюкса"
 GER_ally_benelux_desc:0 "Хотя страны Бенилюкса невелики, они обладают высокой концентрацией промышленности и обеспечат нашему альянсу стратегический доступ к трём зарубежным континентам."
 GER_western_communist:0 "Победить западный коммунизм"
 GER_western_communist_desc:0 "Чтобы противостоять восточной угрозе, сначала необходимо обезопасить собственную сферу."
 GER_dem_anschluss_prep:0 "Разжечь прогерманские настроения в Австрии"
 GER_dem_anschluss_prep_desc:0 "Граждане Австрии не знают, что думать о слабой независимой стране. Усилив уже существующие призывы к объединению с Германией, мы сможем добиться референдума."
 GER_dem_anschluss:0 "Референдум об объединении"
 GER_dem_anschluss_desc:0 ""
 GER_aus_ally:0 "Братья по оружию"
 GER_aus_ally_desc:0 "Мы хотели бы объединиться с австрийскими германскими братьями, но, возможно, эффективнее позволить им самостоятельно управлять своими делами."
 GER_dem_italy_attack:0 "Южная угроза"
 GER_dem_italy_attack_desc:0 "Государство [ITA.GetNameDefCap] представляет серьёзную угрозу с юга, и нельзя позволить ему ударить по нам в случае нового конфликта."
 GER_request_danzig:0 "Потребовать контроль над Вольным городом"
 GER_request_danzig_desc:0 "После смены руководства, независимо от политической ориентации, мы можем потребовать возвращения сильно прогерманского Данцига его законному владельцу."
 GER_dem_polish_corridor_trade:0 "Верхняя Силезия в обмен на Гдыню"
 GER_dem_polish_corridor_trade_desc:0 "Мы можем договориться с Польшей и устранить разрыв с Восточной Пруссией, поскольку обе стороны контролируют территории, жители которых хотят перейти к другому государству."
 GER_dem_polish_corridor_deal:0 "Литва в обмен на прогерманские территории"
 GER_dem_polish_corridor_deal_desc:0 "Поскольку мы контролируем литовские земли, можно договориться с поляками, которые могут пожелать возродить польско-литовскую идею, и обменять их на населённые немцами районы Гдыни и Катовице."
 GER_colonies_for_support:0 "Колонии в обмен на поддержку"
 GER_colonies_for_support_desc:0 "Особенно британцы могут согласиться вернуть часть нашей колониальной империи в обмен на поддержку в нынешнем конфликте. Пусть это не самые ценные владения, но такой шаг станет историческим восстановлением."
 GER_soviet_support:0 "Сотрудничество с [GetRussiansDemonym]"
 GER_soviet_support_desc:0 "Государство [SOV.GetNameDefCap] станет хорошим партнёром для восстановления нашей военной мощи."
 GER_ally_eastern_europe:0 "Дунайский альянс"
 GER_ally_eastern_europe_desc:0 "Несмотря на слабую промышленность Балкан, их положение в Европе, несомненно, крайне важно."
 GER_ally_czechoslovakia:0 "Заключить союз с государством [CZE.GetNameDef]"
 GER_ally_czechoslovakia_desc:0 "Государство [CZE.GetNameDefCap] после нас является промышленным ядром Центральной Европы и станет отличным дополнением к альянсу."
 GER_counter_soviet_agression:0 "Противодействовать [SOV.GetAdjective] агрессии"
 GER_counter_soviet_agression_desc:0 "Мы должны быстро противостоять [SOV.GetAdjective] угрозе, расширяя альянс и готовясь к упреждающему удару."
 GER_anti_bolshevist_bloc:0 "Сотрудничать с Антибольшевистским блоком"
 GER_anti_bolshevist_bloc_desc:0 "В странах Восточной Европы, находящихся под советской угрозой или оккупацией, возникли антикоммунистические организации, влияющие на политику и сопротивляющиеся коммунистам. Сотрудничество с ними может убедить их страны забыть идеологические разногласия и объединиться против коммунизма."
 GER_anti_soviet_friend_poland:0 "Пригласить Польшу"
 GER_anti_soviet_friend_poland_desc:0 "Немногие народы пострадали от советского колониализма так сильно, как [POL.GetAdjective] народ во время войны за независимость и последующих сталинских репрессий на советской территории. Стратегическое положение, военная сила и отношение к бывшему угнетателю делают Польшу грозным союзником."
 GER_dem_anti_commie_bloc_hungary:0 "Пригласить Венгрию"
 GER_dem_anti_commie_bloc_hungary_desc:0 "Венгрия, демократическая или нет, разделяет наши антисоветские взгляды и может заинтересоваться преимуществами нашей защиты."
 GER_dem_italy_alliance:0 "Итальянский пакт"
 GER_dem_italy_alliance_desc:0 "[ITA.GetLeader] — оппортунист и, несмотря на идеологические разногласия, может заинтересоваться борьбой с коммунистическим влиянием у своих границ или хотя бы расширением [ITA.GetAdjective] влияния."
 GER_anti_soviet_friend_baltics:0 "Защитить Прибалтику"
 GER_anti_soviet_friend_baltics_desc:0 "Мы поддержали прибалтийские народы в обретении независимости, и теперь они могут заинтересоваться нашей помощью в её сохранении."
 GER_anti_soviet_friend_finland:0 "Пригласить Финляндию"
 GER_anti_soviet_friend_finland_desc:0 ""
 GER_realise_ukrainian_statehood:0 "Воплотить украинскую государственность"
 GER_realise_ukrainian_statehood_desc:0 "Народ Украины уже отважно сражался за независимость, но потерпел неудачу. Освободившись от советского угнетения, он сможет вновь попытаться обрести её под нашей защитой."
 GER_realise_belarusian_statehood:0 "Воплотить белорусскую государственность"
 GER_realise_belarusian_statehood_desc:0 "Белоруссия, одна из советских республик, наиболее пострадавших от сталинского террора, должна стать одной из главных целей освобождения."
 GER_safeguard_neutrality:0 "Гарантировать нейтралитет"
 GER_safeguard_neutrality_desc:0 "Находясь в центре Европы и вскоре став её средоточием, государство [Root.GetNameDef] занимает уникальное положение, позволяющее действительно гарантировать безопасность нейтральных партнёров. Если же конфликт всё-таки начнётся, мы несомненно победим и станем только сильнее."
 GER_cooperate_with_nordics:0 "Сотрудничать со странами Севера"
 GER_cooperate_with_nordics_desc:0 "После упадка северных империй и обретения Финляндией независимости эти страны традиционно сохраняли нейтралитет. Но когда у их порога [GetRussiansDemonym] ведут агрессивные войны, они не смогут отказаться от участия в защите Европы."
 GER_anti_soviet_war:0 "Сражаться с [GetRussiansDemonym]"
 GER_anti_soviet_war_desc:0 "Только государство [Root.GetNameDef] способно спасти Европу от [SOV.GetAdjective] тирании."
 GER_mon_peaceful:0 "Более надёжные союзники"
 GER_mon_peaceful_desc:0 "Несмотря на нашу силу, мы не можем вновь сражаться со всем миром. Поиск менее агрессивных партнёров позволит расширить рейх, не оказавшись снова в войне на два фронта."
 GER_mon_FRA_alliance:0 "Союз с монархической Францией"
 GER_mon_FRA_alliance_desc:0 "Сильные правительства Франции и Германии должны сотрудничать ради господства в Европе."
 GER_alliance_with_gustaf:0 "Союз с Густавом"
 GER_alliance_with_gustaf_desc:0 "Король государства [SWE.GetNonIdeologyName] Густав наверняка примет наш образ жизни, когда осознает общность наших взглядов и родство наших народов."
 GER_sway_spain:0 "Склонить государство [SPB.GetNameDef] на нашу сторону"
 GER_sway_spain_desc:0 "Монархии государств [ROOT.GetNonIdeologyName] и [SPR.GetNonIdeologyName] имеют долгую и плодотворную общую историю, поэтому естественно вновь объединиться."
 GER_destabilize_france:0 "Дестабилизировать Францию"
 GER_destabilize_france_desc:0 "Французская политика стоит на грани хаоса, ей нужен лишь небольшой толчок. Может быть, нашим коммунистам захочется провести отпуск в Париже?"
 GER_mon_allies_alliance:0 "Признать британское морское господство"
 GER_mon_allies_alliance_desc:0 "У нас нет шансов против флота Британской империи. Перенаправление средств с кораблестроения поможет нашим начинаниям в континентальной Европе."
 GER_mon_anti_commie_france:0 "Объединиться против французского коммунизма"
 GER_mon_anti_commie_france_desc:0 "Когда Франция, одна из сильнейших мировых империй, разваливается, британцы могут согласиться помочь нам, прежде чем ситуация ухудшится и коммунистические настроения распространятся на их империю."
 GER_restore_the_central_powers:0 "Восстановить Центральные державы"
 GER_restore_the_central_powers_desc:0 "Униженные потерей территорий старые союзники охотно вступят в наш альянс, если мы дадим им шанс вернуть былое величие."
 GER_asia_department:0 "Азиатский департамент"
 GER_asia_department_tt:0 "После выбора фокуса §Y«Убить Гитлера»§! этот фокус станет необходимым условием для §Y«Подружиться с Японией»§! и §Y«Подружиться с Китаем»§!."
 poland_special_dominion_tt:0 "Мы предложим Польше защиту в обмен на прежние территории и политическое влияние, превратив её в особый вид доминиона."
 intervene_soviet_civil_war_tt:0 "Существует некоммунистическая антисталинская сторона гражданской войны, с которой можно заключить союз."
 has_neutrality_idea_tt:0 "Есть идея §Yнейтральной внешней политики§!."
 fascist_neutrality_alliance_tt:0 "Европейские §Yфашистские§! и §Yнеприсоединившиеся§! страны станут охотнее вступать в демократический альянс государства [Root.GetNameDef]."
 GER_rhineland_decision_tt:0 "§RЕсли Франция станет коммунистической или нашим союзником, мы не создадим мировую напряжённость.§!"
 GER_central_powers_tt:0 "§YВсе исторические союзники с неприсоединившейся идеологией будут приглашены в нашу фракцию.§!"
 GER_middle_east_diplo_tt:0 "Эти решения позволят влиять на §Yближневосточные§! страны и их политику, а со временем приглашать их в нашу фракцию."
 GER_will_strengthen_right_opposition:0 "§RУсилит Правую оппозицию§!"
 GER_heinrich_brandler_will_lead_country_tt:0 "Если §YГенрих Брандлер§! работает §Yсоветником§!, он сможет стать §Yлидером страны§!."
 GER_remilitarize_rhineland:0 "Ремилитаризовать Рейнскую область"
 not_too_much_soviet_influence_tt:0 "Менее 4 очков советского влияния"
 GER_commie_request_soviet_guns:0 "Запросить советское вооружение"
 GER_soviet_industrial_aid:0 "Запросить советскую промышленную помощь"
 GER_soviet_officers:0 "Пригласить советских офицеров"
 GER_civil_war_category:0 "Участие в иностранных гражданских войнах"
 GER_soviet_influence_increase_1:0 "§YСоветские точки влияния §!§Rувеличится на 1, который в настоящее время имеет [?GER_commie_soviet_influence|-G0].§!\n"
 GER_soviet_influence_increase_2:0 "§YСоветские точки влияния §!§Rувеличится на 2, в настоящее время [?GER_commie_soviet_influence|-G0].§!\n"
 GER_middle_eastern_diplomacy_category:0 "Ближневосточная дипломатия"
 GER_middle_eastern_diplomacy_category_desc:0 "Пока в Европе бушуют войны, а будущее Германии остаётся неясным, мы должны заручиться поддержкой стран Ближнего Востока, таких как Афганистан и Персия. Они могут оказаться крайне важны политически и стратегически, поскольку граничат со многими нашими врагами и обладают большими запасами нефти."
 GER_middle_eastern_diplomacy:0 "Ближневосточная дипломатия"
 GER_pro_german_propaganda:0 "Про-[GER.GetAdjective] пропаганда"
 GER_spread_pro_german_propaganda:0 "Распространять пропаганду в государстве [FROM.GetName]"
 GER_send_german_advisors:0 "Отправить военных советников в государство [FROM.GetName]"
 GER_military_advisors:0 "[GER.GetAdjective] военные советники"
 GER_invite_FROM_to_faction:0 "Пригласить государство [FROM.GetName] во фракцию [ROOT.GetFactionName]"
 GER_middle_eastern_diplomacy_desc:0 "Пока в Европе бушуют войны, а будущее Германии остаётся неясным, мы должны заручиться поддержкой стран Ближнего Востока, таких как Афганистан и Персия. Они могут оказаться крайне важны политически и стратегически, поскольку граничат со многими нашими врагами и обладают большими запасами нефти."
 form_country_czechia_required_states_tt:0 "Контролирует все §Yчешские§! регионы."
 r56.ger.17.t:0 "Германия предлагает защиту в обмен на уступки"
 r56.ger.17.d:0 "Германское имперское правительство предложило соглашение: мы вернём ему утраченные территории, а взамен получим безопасность под его влиянием как доминион с особым статусом."
 r56.ger.17.a:0 "Ради нашей безопасности."
 r56.ger.17.b:0 "Они нам не нужны!"
 r56.ger.18.t:0 "Польша отказывается от защиты"
 r56.ger.18.d:0 "Сегодня польское правительство объявило, что не уступит территории в обмен на защиту. После такого решения защита может понадобиться ему ещё сильнее, чем прежде."
 r56.ger.18.a:0 "Будь они прокляты!"
 r56.ger.19.t:0 "Польша принимает условия"
 r56.ger.19.d:0 "Ощущая серьёзную угрозу, польское правительство согласилось на наши условия и уступило восточные территории."
 r56.ger.19.a:0 "Хорошо."
 r56.ger.20.t:0 "Германия предлагает объединение"
 r56.ger.20.d:0 "Германия предлагает объединение"
 r56.ger.20.d2:0 "Германия предлагает объединение"
 r56.ger.20.a:0 "Пусть народ выскажется."
 r56.ger.20.b:0 "Судьба Австрии лежит в другом направлении."
 r56.ger.21.t:0 "Австрия отказывается от объединения!"
 r56.ger.21.d1:0 "Сегодня австрийское правительство объявило, что не допустит референдума об объединении Австрии с Германией. Несмотря на народную поддержку и общественное возмущение, сторонники независимости в правительстве определили курс страны."
 r56.ger.21.d2:0 "Сегодня народ Австрии, охваченный фашистскими настроениями в пользу независимости, проголосовал против объединения с Германией."
 r56.ger.21.a:0 "Предательство демократии."
 r56.ger.21.b:0 "Нужно следить за ними."
 r56.ger.22.t:0 "Германия предлагает обмен территориями"
 r56.ger.22.d:0 "Сегодня германский посол объявил о желании своей страны изменить германо-польскую границу якобы к выгоде обеих сторон. Польская Гдыня перейдёт Германии в обмен на германскую Верхнюю Силезию, соединяя основную часть Германии с Восточной Пруссией. Хотя Верхняя Силезия промышленно слабее Гдыни и мы потеряем там выход к морю, мы получим местные запасы стали и алюминия, значительно улучшим отношения с германским правительством, увеличим население и ослабим этническую напряжённость в обоих регионах."
 r56.ger.22.a:0 "Выгодно всем!"
 r56.ger.22.b:0 "Гдыня слишком важна для нас."
 r56.ger.23.t1:0 "Польша одобряет изменение границы"
 r56.ger.23.d1:0 "Польское правительство согласилось с германским предложением изменить границу. Войска, не связанные с регионом, начали покидать Гдыню, а жители почти не сопротивляются. Теперь наша очередь сделать то же самое."
 r56.ger.23.a:0 "Вопрос решён."
 r56.ger.23.t2:0 "Польша отказывается от соглашения"
 r56.ger.23.d2:0 "Польское правительство заявило, что не станет обмениваться территориями с Германией — официально из-за польского меньшинства, но скорее из-за стратегического значения для флота или промышленности."
 r56.ger.23.b:0 "Мы ещё посмотрим."
 r56.ger.24.t:0 "Германия предлагает Литву в обмен на территории с германским большинством"
 r56.ger.24.d:0 "Германское правительство, установив контроль над литовскими землями, предлагает обмен: мы получим большую часть Литвы в обмен на преимущественно прогерманские территории Катовице и Гдыни. Мы потеряем крупный морской узел и запасы металлов, но получим литовскую промышленность или то, что от неё осталось, а также сможем заявить о наследии Речи Посполитой."
 r56.ger.24.a:0 "Убить двух зайцев."
 r56.ger.24.b:0 "Литовцы должны жить самостоятельно."
 r56.ger.25.d:0 "После убийства Гитлера и падения популярности нацистское правительство окончательно рухнуло. По всей стране поднялись антинацистские силы. В промышленном центре и благодаря сепаратистской политике Баварии сформировано новое консервативно-демократическое движение. В коммунистических опорных пунктах, включая Берлин, также вспыхнули восстания, хотя сами города пока удерживают нацистские гарнизоны.\n Теперь нам предстоит решить, кого поддержать."
 r56.ger.25.a:0 "Поддержка консерваторов — безопасный вариант."
 r56.ger.25.b:0 "Коммунисты принесут народу настоящие перемены."
 GER_communists_are_pretty_hard_tt:0 "\n§RШансы на победу будут не в нашу пользу!§!"
 GER_communists_are_pretty_hard_tt_tip:0 "\n\n§HСовет:§! Хотя вы могли бы сосредоточиться на нацистах и получить некоторые государства или даже капитулировать над ними, вы могли бы сделать это. §HКонсервативная сторона§! Скорее всего, §Hбить тебя§! после.\n\nСобрав в себе §HМалый мобильный дивизион§!Вы можете быть в состоянии §Hспешить§! Консерваторы §HРешающие города§! Пока они сражаются с нацистами."
 r56.ger.26.d:0 "Австрия проголосовала на референдуме за объединение с Германией. Слабая национальная идентичность и общие прогерманские настроения вызвали крупный сдвиг в Европе. Ещё предстоит увидеть, как великие державы отреагируют на это демократическое нарушение Версальского договора."
 r56.ger.26.b:0 "Я люблю демократию."
 r56.ger.27.t:0 "Германия предлагает торговую сделку"
 r56.ger.27.d:0 "Государство [FROM.GetNameDefCap] предложило договор о сотрудничестве: мы получим денежную компенсацию и морские технологии в обмен на права на одно из небольших нефтяных месторождений."
 r56.ger.27.a:0 "Их помощь нам пригодится."
 r56.ger.27.b:0 "Мы им не доверяем."
 r56.ger.28.t:0 "Германия предлагает устранить [YUG.GetAdjective] угрозу"
 r56.ger.28.d:0 "В рамках борьбы с коммунистической угрозой Германия предложила совместно вторгнуться в Югославию. Она готова позволить нам удовлетворить территориальные притязания, пока сама свергает коммунистическое правительство."
 r56.ger.28.a:0 "Подготовить силы!"
 r56.ger.28.b:0 "Не сейчас!"
 r56.ger.29.t:0 "Государство [FROM.GetName] просит вернуть старые колонии в обмен на поддержку"
 r56.ger.29.d:0 "Реформированная германская нация запросила несколько небольших исторических владений в обмен на поддержку в наших нынешних войнах."
 r56.ger.29.a:0 "Это было бы полезно!"
 r56.ger.29.b:0 "Они нам не нужны."
 r56.ger.30.t:0 "Скрытые симпатии Эриха Людендорфа"
 r56.ger.30.d:0 "Эрих Людендорф, убеждённый консерватор и генерал-квартирмейстер времён Великой войны, остаётся популярным военным героем среди [ROOT.GetAdjective] народа. Известно, что поначалу он активно поддерживал NSDAP, но в последние годы отдалился от партии и втайне возненавидел самого [GER.GetLeader].\n\nЕго популярность неоспорима, а военные способности доказаны. Возможно, после некоторых уговоров он поддержит наше дело. Его участие значительно усилит нас и повысит легитимность."
 r56.ger.30.a:0 "Будем надеяться, что он нас поддержит."
 r56.ger.31.t:0 "Ухудшение здоровья Эриха Людендорфа"
 r56.ger.31.d:0 "Хотя Людендорф недавно присоединился к нашей борьбе против нацистов, его здоровье вновь начало ухудшаться. Осложнения рака печени заставляют большинство людей считать, что болезнь вскоре возьмёт своё.\n\nМы можем позволить ему достойно уйти в отставку и провести оставшееся время по своему желанию либо найти лучшее лечение и дать ему продолжить службу."
 r56.ger.31.a:0 "Он хорошо нам послужил. Пусть уйдёт в отставку."
 r56.ger.31.b:0 "Найти ему лучшее лечение!"
 r56.ger.32.t:0 "Людендорф умирает"
 r56.ger.32.d:0 "Эрих Людендорф, оказавший нашему делу огромную помощь, скончался от осложнений рака печени. Мы долго пытались лечить его и сохранять здоровье, но он до последнего вздоха оставался полон решимости служить государству [GER.GetNameDef]."
 r56.ger.32.a:0 "Истинный солдат до самого конца."
 r56.ger.33.t:0 "Людендорф умирает"
 r56.ger.33.d:0 "Эрих Людендорф, оказавший нашему делу огромную помощь, скончался от осложнений рака печени. Даже после отставки он стремился служить государству [GER.GetNameDef] на гражданском поприще до последнего вздоха."
 r56.ger.33.a:0 "Нам будет его не хватать."
 r56.ger.37.t:0 "Военные захватывают власть"
 r56.ger.37.d:0 "Сегодня утром в ходе, как сообщается, бескровного переворота многочисленные части вооружённых сил быстро окружили императорский дворец [GER.GetLeader] и осадили его. В результате кайзера заставили отказаться от значительной части полномочий и передать управление страной военной диктатуре во главе с Куртом фон Хаммерштейном-Эквордом, самому став лишь номинальной фигурой.\n\nВ государстве [GER.GetNameDef] это событие вызвало неоднозначную реакцию. Лишь время покажет его долгосрочные последствия."
 r56.ger.37.a:0 "Интересное развитие событий."
 r56.ger.38.t:0 "Кайзер берёт правительство под контроль"
 r56.ger.38.d:0 "После роста монархического влияния в государстве [GER.GetNameDef] кайзер сегодня объявил об отмене многих ограничительных законов, навязанных ему после действий военных, и восстановлении своего контроля над правительством и армией.\n\nХотя радикальная элита может быть недовольна, очевидно, что кайзер обладает народной поддержкой и силой для столь амбициозного возвращения власти."
 r56.ger.38.a:0 "Будет ли восстановлен порядок?"
 r56.ger.43.t:0 "Государство [FROM.GetNameDefCap] просит отправить военных советников"
 r56.ger.43.d:0 "[GER.GetAdjective] военные советники прибыли сегодня в столицу после долгих переговоров с государством [GER.GetNameDef] о возможном военном сотрудничестве. Похоже, государство [GER.GetNameDef] готово инвестировать в нашу армию и промышленность ради нашей поддержки. Получит ли оно её — решать нам."
 r56.ger.43.a:0 "Добро пожаловать."
 r56.ger.43.b:0 "Извините, нет."
 r56.ger.44.t:0 "Государство [FROM.GetNameDefCap] отказывает"
 r56.ger.44.d:0 "После нашего предложения направить военного атташе в государство [FROM.GetNameDefCap] [FROM.GetAdjective] сторона всё обдумала и решила отказать. Возможно, её желаемая политическая ориентация связана не с Германией, а с кем-то другим..."
 r56.ger.44.a:0 "Что ж, они сами проиграли."
 r56.ger.45.t:0 "Англо-германское морское соглашение"
 r56.ger.45.d:0 "С момента подписания Англо-германского морского соглашения в 1935 году размер нашего флота был ограничен соотношением 35:100, на котором настаивали британцы. Однако будущее Европы неопределённо, и нам следует пересмотреть отношение к соглашению, хотя это может повлечь последствия в отношениях с Британией."
 r56.ger.45.a:0 "К чёрту соглашение."
 r56.ger.45.b:0 "Лучше их не злить..."
 wtt_germany.83.t:0 "Вильгельм III умирает"
 wtt_germany.83.d:0 "Прошлой ночью наш любимый кайзер Вильгельм III скончался от сердечного приступа. Несмотря на короткое правление, провидение позволило ему взойти на престол задолго до смерти, и с тех пор он достойно руководил страной. Его сын Вильгельм Фридрих теперь принял бразды правления и после коронации станет известен как Вильгельм IV."
 ger.civil_war.2.t:0 "Государство [FROM.GetNameDefCap] запрашивает военных советников"
 ger.civil_war.2.desc:0 "Государство [FROM.GetNameDefCap] оказалось в тяжёлом положении и не получило достаточной поддержки вермахта в гражданской войне. Испытывая нехватку квалифицированных кадров, оно просит временно направить нескольких командиров среднего звена."
 ger.civil_war.2.a:0 "Возможность получить влияние и опыт!"
 ger.civil_war.2.b:0 "Это безнадёжное дело."
 character_changes_country_tt:0 "[THIS.GetName] переходит в государство [FROM.GetNameDef]."
 ger_brest_litovsk.1.t:0 "Государство [GER.GetNameDefCap] предлагает мир!"
 ger_brest_litovsk.1.d:0 "Государству [SOV.GetNameDefCap] предложен договор о завершении [GER.GetAdjective]-[SOV.GetAdjective] войны на Востоке. Он предусматривает передачу нескольких западных территорий, оккупированных государством [SOV.GetAdjective], стороне [GER.GetAdjective] в обмен на мир. Условия напоминают Брест-Литовский договор, завершивший германо-советский конфликт во время Великой войны."
 ger_brest_litovsk.1.a:0 "Отклонить условия!"
 ger_brest_litovsk.1.b:0 "Принять условия."
