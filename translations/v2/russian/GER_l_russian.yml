l_russian:
 GER_kill_hitler_shortcut:0 "$GER_kill_hitler$"
 GER_bernhard_rogge:0 "Бернхард Рогге"
 GER_helmuth_walter:0 "Хельмут Вальтер"
 GER_deutsche_forschungsanstalt_fur_segelflug:0 "DFS"
 GER_deutsche_forschungsanstalt_fur_segelflug_desc:0 "Deutsche Forschungsanstalt für Segelflug"
 GER_erma_werke:0 "Erma Werke"
 GER_erma_werke_desc:0 "Maschinenfabrik Geipel"
 GER_hanomag:0 "Hanomag"
 GER_hanomag_desc:0 "Hannoversche Maschinenbau"
 GER_mio_trait_mechanized_simplification:0 "Упрощение конструкции"
 GER_mio_trait_mg34:0 "Пулемёты MG 34"
 GER_porsche_improved_tt:0 "§GДоступен§! как §Yучёный§!: §YФердинанд Порше§!."
 GER_central_powers_faction:0 "Центральные державы"
 GER_franco_german_pact_faction:0 "Франко-германский пакт"
 GER_european_alliance_faction:0 "Европейский альянс"
 GER_international_right_opposition_faction:0 "Международная правая оппозиция"
 GER_leninist_pact_faction:0 "Ленинский пакт"
 GER_begin_depression_recovery:0 "Начать восстановление после депрессии"
 GER_begin_depression_recovery_desc:0 "Действия Веймарской республики во время Великой депрессии лишь ухудшили экономику. Мы должны начать устранять ущерб, нанесённый врагами государства [GER.GetNameDef]."
 GER_begin_reinhardt:0 "Начать программу Рейнхардта"
 GER_begin_reinhardt_desc:0 "Первый шаг к восстановлению экономики — поддержка роста бизнеса. Косвенные стимулы, такие как снижение налогов, ускорят развитие частной промышленности."
 GER_finish_reinhardt:0 "Завершить программу Рейнхардта"
 GER_finish_reinhardt_desc:0 "Прямые инвестиции программы Рейнхардта в инфраструктуру принесут отличные результаты."
 GER_privatize_reichsbahn:0 "Приватизировать Рейхсбан"
 GER_privatize_reichsbahn_desc:0 "Первым шагом к восстановлению инфраструктуры станет оживление железнодорожной системы посредством приватизации."
 GER_privatize_stahlwerke:0 "Приватизировать Vereinigte Stahlwerke"
 GER_privatize_stahlwerke_desc:0 "Чтобы вернуть мощь армии к довоенным версальским стандартам, необходимо повысить эффективность сталелитейных предприятий."
 GER_synth_oil_research:0 "Исследовать синтетическую нефть"
 GER_synth_oil_research_desc:0 "Поскольку у государства [GER.GetNameDef] мало природных источников нефти и каучука, мы должны наладить производство синтетического топлива, чтобы пополнить запасы этих ценных ресурсов."
 GER_oil_refinery_development:0 "Строить нефтеперерабатывающие заводы"
 GER_oil_refinery_development_desc:0 "Улучшение технологий синтетического топлива позволяет нам строить более современные нефтеперерабатывающие заводы."
 GER_establish_peenmunde:0 "Основать лабораторию в Пенемюнде"
 GER_establish_peenmunde_desc:0 "Создание новой центральной лаборатории поднимет наши научные знания и исследования на новый уровень."
 GER_establish_SS:0 "Создать СС"
 GER_establish_SS_desc:0 "Защитить руководство государства [GER.GetNameDef] от внешних угроз сможет лишь элитная охрана. СС обеспечит бесперебойную работу правительства и устранит тех, кто захочет причинить ему вред."
 GER_aux_police_SS:0 "Использовать СС как вспомогательную полицию"
 GER_aux_police_SS_desc:0 "Роль СС естественным образом может распространиться на гражданскую сферу как в Великой Германии, так и на оккупированных территориях. Возможно, они смогут справиться с партизанами и террористами, нападающими на части вермахта."
 GER_elite_soldiers_SS:0 "Использовать СС на передовой"
 GER_elite_soldiers_SS_desc:0 "Особая подготовка и идеологическое воспитание бойцов СС делают их значительно эффективнее обычных частей в задачах, требующих преданности и верности Отечеству."
 GER_combine_SS_gestapo:0 "Объединить СС и гестапо"
 GER_combine_SS_gestapo_desc:0 "Объединение СС и гестапо даст нам силу, способную проводить военные, полицейские и антитеррористические операции."
 GER_purge_political_opponents:0 "Провести чистку политических противников"
 GER_purge_political_opponents_desc:0 "Единственный способ избавиться от сильного влияния других партий — полностью устранить их. Лишь тогда мы укрепим национальное единство и приведём государство [GER.GetNameDef] к победе."
 GER_strengthen_german_state:0 "Перенаправить усилия полиции"
 GER_strengthen_german_state_desc:0 "Теперь, когда политическая ситуация внутри страны безопасна, следует направить военную полицию на другие задачи, одновременно сокращая её влияние."
 GER_operation_ikarus:0 "Операция «Икарус»"
 GER_operation_ikarus_desc:0 "Исландия слишком важна как база для судоходства в Северной Атлантике, чтобы оставлять её незанятой. Мы должны немедленно захватить её!"
 GER_sweden_war:0 "Война с государством [SWE.GetNameDef]"
 GER_sweden_war_desc:0 "Мы годами импортировали из Швеции вольфрам и железо. Угроза государству [SWE.GetNameDef] угрожает также армии и экспансии государства [GER.GetNameDef]. Мы должны обезопасить [SWE.GetNameDef], чтобы эти жизненно важные ресурсы не достались врагу."
 GER_finland_friend:0 "Подружиться с государством [FIN.GetNameDef]"
 GER_finland_friend_desc:0 "Государство [FIN.GetNameDefCap] давно враждует с государством [SOV.GetNameDef] и может стать важнейшим звеном Северного фронта и всей Скандинавии."
 GER_finland_war:0 "Война с государством [FIN.GetNameDef]"
 GER_finland_war_desc:0 "Влияние государства [FIN.GetNameDefCap] на государство [SOV.GetNameDef] и Скандинавию делает его жизненно важным для дальнейшей экспансии государства [GER.GetNameDef]. Захват этого опорного пункта станет тяжёлым ударом для врагов."
 GER_prepare_france_invasion:0 "Подготовить западный театр военных действий"
 GER_prepare_france_invasion_desc:0 "Франция противостояла нашей политической и военной экспансии и была одним из авторов проклятого Версальского договора. Мы должны быть готовы к столкновению с ней в любой момент."
 GER_core_lorraine:0 "Интегрировать Эльзас-Лотарингию"
 GER_core_lorraine_desc:0 "Эльзас-Лотарингия давно является домом для немецкоязычного населения. Франция украла эту землю у Германии, и теперь пора вернуть её навсегда."
 GER_mobile_warfare:0 "Война объединённых родов войск"
 GER_mobile_warfare_desc:0 "Наши технологические достижения в воздухе и на земле можно объединить, избежав медленной и кровавой позиционной войны. Государство [FRA.GetNameDefCap] станет полигоном для новой армии, и мы откроем новую эпоху войны."
 GER_build_panzer_army:0 "Развивать танковую армию"
 GER_build_panzer_army_desc:0 "Прежде чем начинать вторжения, необходимо убедиться, что бронетанковые дивизии современны и полностью обеспечены танками."
 GER_build_panzer_quality:0 "Любимое качество"
 GER_build_panzer_quality_desc:0 " "
 GER_build_panzer_quantity:0 "Количество благоприятствующих"
 GER_build_panzer_quantity_desc:0 " "
 GER_captured_heavy_weapons:0 "Повторно использовать захваченное тяжёлое вооружение"
 GER_captured_heavy_weapons_desc:0 "Несмотря на превосходство нашего производства, нельзя пренебрегать возможностями, которые даёт трофейное вражеское снаряжение."
 GER_superior_firepower:0 "Современная армия"
 GER_superior_firepower_desc:0 "Государство [GER.GetNameDefCap] должно первым показать, насколько эффективно хорошо организованное обеспечение подразделений."
 GER_elite_units:0 "Специализированные части"
 GER_elite_units_desc:0 "В теории универсальный солдат звучит хорошо, но на практике подготовить бойцов ко всем типам местности и сценариям невозможно. Нам нужны специализированные части для выполнения самых сложных задач."
 GER_mechanization_of_the_army:0 "Механизировать армию"
 GER_mechanization_of_the_army_desc:0 "Для тех, кто смотрит дальше пропаганды, не секрет, что наша армия всё ещё зависит от лошадей и поездов. Одной из главных целей должно стать расширение использования моторизованной и бронепехоты."
 GER_prevent_aerial_hegemony:0 "Защититься от воздушных атак"
 GER_prevent_aerial_hegemony_desc:0 "Надёжная противовоздушная оборона освободит самолёты для наступательных действий и защитит войска на земле."
 GER_above_maginot:0 "Над линией Мажино"
 GER_above_maginot_desc:0 "Некоторые представители высшего командования предлагают полностью использовать мощь авиации, чтобы обойти бои на линии Мажино. Для этого необходимо вложиться в технологии масштабных воздушно-десантных операций."
 GER_plan_sealion:0 "Подготовить операцию «Морской лев»"
 GER_plan_sealion_desc:0 "Государство [ENG.GetNameDefCap] давно является занозой в нашем боку. Единственный способ избавиться от неё — пересечь Ла-Манш и уничтожить силой."
 GER_landing_craft:0 "Исследовать десантные суда"
 GER_landing_craft_desc:0 "Крупное морское вторжение возможно лишь с новыми десантными судами."
 GER_air_superiority_english_channel:0 "Господствовать в небе"
 GER_air_superiority_english_channel_desc:0 "Защитить родину и обеспечить подавляющую поддержку наземных войск можно только благодаря господству в воздухе."
 GER_train_paratroopers:0 "Подготовить фальширмъегеров"
 GER_train_paratroopers_desc:0 "Дивизии фальширмъегеров, нашей воздушно-десантной пехоты, позволят захватывать цели в тылу врага и в недоступных по суше районах."
 GER_naval_superiority_english_channel:0 "Гибкая доктрина"
 GER_naval_superiority_english_channel_desc:0 "Защитить морские вторжения и торговлю можно лишь грамотным применением флота, даже против более сильных морских держав."
 GER_enact_sealion:0 "Начать операцию «Морской лев»"
 GER_enact_sealion_desc:0 "Наконец настало время осуществить план вторжения в Британию и избавиться от занозы, которая так долго нас мучила."
 GER_alliance_with_italy:0 "Союз с государством [ITA.GetNameDef]"
 GER_alliance_with_italy_desc:0 "Итальянцы могут быть ненадежными, как они доказали в Великой войне, но Муссолини и его фашистское движение показали, что есть надежда на то, что это произойдет. [ITA.GetNameDef] пока.[Ger.GetNameDefCap] Только выигрывает от союзничества [ITA.GetNameDef]."
 GER_prepare_italian_invasion:0 "Подготовить южный театр военных действий"
 GER_prepare_italian_invasion_desc:0 "Пока мы не знаем, на нашей ли стороне швейцарцы и итальянцы, необходимо подготовить южную границу к войне с ними."
 GER_core_south_tyrol:0 "Заявить права на Южный Тироль"
 GER_core_south_tyrol_desc:0 "Как Данциг и Эльзас-Лотарингия, Южный Тироль является регионом с крупным немецкоязычным населением. Мы должны вернуть изгнанных соотечественников под защиту государства [GER.GetAdjective]."
 GER_war_with_italy:0 "Война с государством [ITA.GetNameDef]"
 GER_war_with_italy_desc:0 "Подготовка завершена, и время пришло: мы должны вторгнуться в земли бывшего союзника."
 GER_prepare_poland_invasion:0 "Подготовить восточный театр военных действий"
 GER_prepare_poland_invasion_desc:0 "После Первой мировой войны Польша отняла у нас порт Данциг. Кроме того, она лежит на пути в Восточную Европу. Мы должны усилить инфраструктуру вдоль [POL.GetAdjective] границы."
 GER_modernize_CAS:0 "Модернизировать авиационную поддержку"
 GER_modernize_CAS_desc:0 "Наземные войска модернизированы, и теперь им нужна современная авиация непосредственной поддержки."
 GER_schwerepunkt_tactics:0 "Тактика Schwerpunkt"
 GER_schwerepunkt_tactics_desc:0 "Сосредоточение мобильных сил, включая танковые и моторизованные дивизии, в ключевых точках позволит прорвать даже самые мощные оборонительные линии."
 GER_soviet_friend:0 "Подружиться с государством [SOV.GetNameDef]"
 GER_soviet_friend_desc:0 "Дружба с государством [SOV.GetNameDef] поможет обезопасить восточный фланг. После устранения государства [POL.GetNameDef] наш Восток будет защищён, и мы сможем сосредоточиться на других направлениях."
 GER_unholy_alliance_tt_1:0 "Это распустит альянс §H[ROOT.GetFactionName]§! и создаст §Hось Берлин—Москва§!."
 GER_unholy_alliance_tt_2:0 "Это создаст §Hось Берлин—Москва§!."
 GER_poland_friend_r56:0 "Подружиться с государством [POL.GetNameDef]"
 GER_poland_friend_r56_desc:0 "Многие в нашем правительстве считают государство [POL.getNameDef] прямым врагом и идеологическим противником нынешнего [GER.getAdjective] государства. На фоне роста мировой напряжённости, возможно, ради общего блага стоит забыть старые обиды и вместе идти к процветанию — при подходящих условиях, конечно."
 GER_war_with_poland:0 "Война с государством [POL.GetNameDef]"
 GER_war_with_poland_desc:0 "The [POL.GetAdjective] В последнее время они проявляют большую враждебность по отношению к нам, где они пересекли нашу границу и несколько раз нападали на наших людей. Мы должны вести оборонительную войну против [POL.GetAdjective]! По крайней мере, такова история."
 GER_romania_friend:0 "Подружиться с государством [ROM.GetNameDef]"
 GER_romania_friend_desc:0 "Союз с государством [ROM.GetNameDef] поможет сдерживать [SOV.GetAdjective] агрессию и усилит нашу армию."
 GER_romania_war:0 "Война с государством [ROM.GetNameDef]"
 GER_romania_war_desc:0 "Мы должны обезопасить государство [ROM.GetNameDef]: оно непредсказуемо и легко может стать маршрутом нападения врагов с юга и востока."
 GER_soviet_invasion:0 "Вторгнуться в земли государства [SOV.GetAdjective]"
 GER_soviet_invasion_desc:0 "Мы давно соперничаем с государством [SOV.GetAdjective] за господство в Европе. Единственный способ устранить эту угрозу — полностью стереть её с карты."
 GER_train_panzergrenadiers:0 "Подготовить панцергренадеров"
 GER_train_panzergrenadiers_desc:0 "Большая часть обычной пехоты недостаточно обучена и оснащена, чтобы поспевать за бронетехникой. Следует преобразовать часть дивизий в элитные панцергренадерские соединения."
 GER_counter_sloped_armor:0 "Противодействовать наклонной броне"
 GER_counter_sloped_armor_desc:0 "Наклонная броня и другие достижения почти сделали простые противотанковые ружья бесполезными. Для борьбы с новейшими танками нужны более мощные противотанковые средства."
 GER_seige_fortified_towns:0 "Осаждать укреплённые города"
 GER_seige_fortified_towns_desc:0 "[SOV.GetAdjective] силы усилили оборону Ленинграда, Москвы и других городов. Для их взятия необходимо окружить их и обрушить максимально возможную огневую мощь."
 GER_counter_anti_tank:0 "Стратегия штурмовых орудий"
 GER_counter_anti_tank_desc:0 "Обычная артиллерия является удобной целью для вражеского огня. Сделав её мобильной, бронированной и, возможно, более крупнокалиберной, мы буквально и образно переиграем вражеские орудия."
 GER_encirclement_doctrine_desc:0 "У государства [SOV.GetADjective] на несколько миллионов солдат больше. Чтобы компенсировать это, мы должны окружать и уничтожать его армии, не позволяя им отвечать."
 GER_train_marines:0 "Подготовить морские батальоны"
 GER_train_marines_desc:0 "Морские батальоны дадут нам преимущество при морских вторжениях благодаря подготовке к высадке на вражеское побережье."
 GER_invade_switzerland:0 "Операция «Танненбаум»"
 GER_invade_switzerland_desc:0 "[SWI.GetAdjective] народ тесно связан с немцами, и многие говорят на нашем языке. Мы должны воссоединить наши народы и обеспечить им надёжную защиту."
 GER_the_blitz:0 "Блиц"
 GER_the_blitz_desc:0 "Лучший способ сломить мораль [ENG.GetAdjective] населения — превратить его города в пепел и руины. Новые инвестиции в бомбардировщики расширят наши возможности."
 GER_turkey_friend:0 "Подружиться с государством [TUR.GetNameDef]"
 GER_turkey_friend_desc:0 "Дружба с государством [TUR.GetNameDef] усилит наше влияние на Ближнем Востоке и в Африке."
 GER_turkey_war:0 "Война с государством [TUR.GetNameDef]"
 GER_turkey_war_desc:0 "Контроль над землями государства [TUR.GetNameDef] откроет путь на Ближний Восток и в Африку, что важно для захвата [ENG.GetAdjective] и [FRA.GetAdjective] колоний. Кроме того, индейка — вкусная еда."
 GER_war_with_spain:0 "Война с Испанией"
 GER_war_with_spain_desc:0 "Захват Испании даст нам стратегическую позицию в Средиземном море, упростит овладение Гибралтаром и откроет быстрый путь в Африку."
 GER_foreign_volunteers:0 "Принимать иностранных добровольцев"
 GER_support_military_research:0 "Поддержать военные исследования"
 GER_support_military_research_desc:0 "Технологии принесут нам окончательную победу."
 GER_foreign_volunteers_desc:0 "Многие иностранцы разделяют наши взгляды настолько, что готовы сражаться за нас. Раньше мы бы не приняли их, но на данном этапе войны дополнительная живая сила нам пригодится."
 GER_political_sphere:0 "Открыть [GER.GetAdjective] политическую сферу"
 GER_political_sphere_desc:0 "После избрания Гитлера и консолидации власти NSDAP настало время открыть политическую сферу переменам. Мы либо продолжим путь фюрера, либо найдём новую дорогу."
 GER_kill_hitler:0 "Избавиться от Гитлера"
 GER_kill_hitler_desc:0 "Гитлер уже несколько лет является лицом Германии и её политики. Отсутствие сильных преемников в NSDAP делает его главной целью для тех, кто хочет остановить германский фашизм."
 GER_political_turmoil:0 "Использовать политический хаос"
 GER_political_turmoil_desc:0 "Теперь, когда Гитлер мёртв, разжечь нестабильность в государстве [GER.GetNameDef] будет значительно проще."
 GER_denounce_versailles:0 "Осудить Версальский договор"
 GER_denounce_versailles_desc:0 "Официальное осуждение Версальского договора ясно покажет миру нашу политическую позицию и усилит поддержку нашего дела среди гражданского населения."
 GER_military_industrial_complex:0 "Расширить военную промышленность"
 GER_military_industrial_complex_desc:0 "Военная промышленность на основе подрядчиков и масштабного государственного финансирования выведет наш промышленный комплекс на новый уровень."
 GER_restore_weimar:0 "Приступить к восстановлению Веймарского правительства"
 GER_restore_weimar_desc:0 "Демократическая система Веймарского правительства была лучшим способом управления Германией. Приход Гитлера нарушил мирный путь страны. Мы должны исправить нанесённый им ущерб, пока не поздно."
 GER_establish_bundesrepublik:0 "Создать Федеративную Республику"
 GER_establish_bundesrepublik_desc:0 "Поддержка нового демократического правительства быстро растёт. Теперь, пользуясь народным доверием, пора начать контрреволюцию против фашистов."
 GER_post_fascism_recovery:0 "Восстановиться после фашизма"
 GER_post_fascism_recovery_desc:0 "Годы фашизма нанесли огромный ущерб экономике и культуре. Мы должны начать общественные программы по его устранению."
 GER_marshall_plan:0 "Укрепить связи с США"
 GER_marshall_plan_desc:0 "Финансирование с Запада, особенно от государства [USA.GetNameDef], значительно поможет нашей экономике и восстановлению после фашизма, а также снизит восприимчивость народа к коммунизму."
 GER_replace_reichsmark:0 "Заменить рейхсмарку"
 GER_replace_reichsmark_desc:0 "Хаос после смерти Гитлера и демократическая контрреволюция вызвали огромную инфляцию рейхсмарки. Чтобы справиться с этим, необходимо заменить её новой валютой."
 GER_economic_miracle:0 "[GER.GetAdjective] экономическое чудо"
 GER_economic_miracle_desc:0 "Поддержка других демократий и новая система свободного рынка вызвали мощный экономический подъём."
 GER_post_war_economics:0 "Экономика мирного времени"
 GER_post_war_economics_desc:0 "Теперь, когда экономика больше не работает в военном режиме, мы можем сосредоточиться на гражданах и их благосостоянии."
 GER_civilian_infrastructure:0 "Гражданская инфраструктура"
 GER_civilian_infrastructure_desc:0 "Продолжая переход к послевоенной экономике, мы улучшим инфраструктуру, необходимую для процветания гражданской промышленности и бизнеса."
 GER_establish_bundeswehr:0 "Создать бундесвер"
 GER_establish_bundeswehr_desc:0 "Хотя Германия больше не фашистская, внешние угрозы никуда не исчезли. Мы должны создать новую армию — бундесвер — для защиты страны."
 GER_defense_and_deterence:0 "Оборона и сдерживание"
 GER_defense_and_deterence_desc:0 "Чтобы усилить защиту от внешних угроз, следует принять политику обороны и сдерживания, обеспечивающую безопасность страны и народа."
 GER_western_science_funding:0 "Западное финансирование науки"
 GER_western_science_funding_desc:0 "В развитие прежней поддержки западные демократии могут предоставить финансирование и нашей науке."
 GER_repeal_reichstag_fire_decree:0 "Отменить указ о пожаре в рейхстаге"
 GER_repeal_reichstag_fire_decree_desc:0 "Указ о пожаре в рейхстаге, фактически запрещающий коммунизм, следует отменить, чтобы естественно склонный влево народ мог выражать свои интересы ради блага страны."
 GER_fuse_the_parties:0 "Объединить партии"
 GER_fuse_the_parties_desc:0 "Последние десятилетия показали, что кайзер не способен удержать страну вместе, а республике нельзя доверить стабильность. Остаётся один путь: сильная коалиция [GER.getAdjective] левых партий. Пора слиться воедино и наконец создать Германию, которой всегда суждено было стать."
 GER_alliance_with_soviets:0 "Основать Коминформ"
 GER_alliance_with_soviets_desc:0 "Государство [SOV.GetNameDefCap] — сильнейшая коммунистическая держава мира. Союз с ним создаст новую мировую сверхдержаву."
 GER_world_revolution:0 "Установить [GER.GetAdjectiveCap] социализм"
 GER_world_revolution_desc:0 "Хотя государство [SOV.GetAdjective] могущественно, его форма социализма коррумпирована и противоречит целям коммунизма. Мы должны показать миру, как построить правильный коммунизм, ставящий народ во главу угла."
 GER_spread_the_revolution:0 "Распространять революцию"
 GER_spread_the_revolution_desc:0 "Чтобы выжить в будущем, жизненно важно окружить себя друзьями, а не врагами. Этого можно добиться искусной дипломатией или грубой силой — так или иначе, революция должна жить!"
 GER_increase_influence_over_balkans:0 "Расширить влияние на Балканах"
 GER_increase_influence_over_balkans_desc:0 ""
 GER_increase_influence_over_eastern_europe:0 "Расширить влияние в Восточной Европе"
 GER_increase_influence_over_eastern_europe_desc:0 ""
 GER_increase_influence_over_benelux:0 "Расширить влияние в Бенилюксе"
 GER_increase_influence_over_benelux_desc:0 ""
 GER_old_nemensis:0 "Наш старый враг"
 GER_old_nemensis_desc:0 ""
 GER_end_british_imperial_hegemony:0 "Положить конец [ENG.GetAdjective] имперской гегемонии"
 GER_end_british_imperial_hegemony_desc:0 ""
 GER_focus_on_fascist_threat:0 "Сосредоточиться на фашистской угрозе"
 GER_focus_on_fascist_threat_desc:0 "Хотя мы презираем капиталистов и империалистов всего мира, фашисты, несомненно, представляют более серьёзную угрозу. Мы должны отложить разногласия и уничтожить то, что так долго угнетало нашу страну."
 GER_pressure_austria:0 "Оказать давление на государство [AUS.GetNameDef]"
 GER_pressure_austria_desc:0 "К югу от нас находится ещё один фашистский тиран. Чтобы остановить фашистскую угрозу в Европе, прежде всего необходимо освободить наших немецкоязычных братьев."
 GER_decrease_fascist_influence:0 "Снизить влияние фашистов"
 GER_decrease_fascist_influence_desc:0 "Мы больше не можем позволять фашизму распространяться. Он слишком долго угнетал нас и другие народы, и мы не позволим этому повториться где-либо ещё."
 GER_deal_with_the_devil:0 "Сделка с дьяволом"
 GER_deal_with_the_devil_desc:0 "Хотя у нас и нашего исторического врага было множество разногласий, государство [FRA.GetNameDef] может разделять нашу цель уничтожения фашизма в Европе. Возможно, ради этого стоит забыть старую вражду."
 GER_the_source_of_fascism:0 "Источник фашизма"
 GER_the_source_of_fascism_desc:0 "Сама идея фашизма зародилась в глубинах Италии. Чтобы покончить с ним раз и навсегда, эту страну необходимо усмирить и освободить."
 GER_bodenreform_projects:0 "Проекты земельной реформы"
 GER_bodenreform_projects_desc:0 "Проекты Bodenreform, основанные на идеях Адольфа Дамашке, направлены на земельную реформу, которая обеспечит каждому базовое жильё и удовлетворение трудовых потребностей государством — один из главных элементов коммунистического общества."
 GER_hanza_steelworks:0 "Сталелитейные заводы Ганзы"
 GER_hanza_steelworks_desc:0 "В последние годы сталелитейная промышленность Ганзы оставалась без внимания. Чтобы обеспечить рабочих занятостью и получить необходимые ресурсы, мы должны вложить значительные средства в этот регион."
 GER_progress_cult:0 "Культ прогресса"
 GER_progress_cult_desc:0 "Хорошо обученные элитные учёные, финансируемые государством, помогут вывести нашу науку на новый уровень."
 GER_soviet_scientists:0 "Пригласить [SOV.GetAdjective] учёных"
 GER_soviet_scientists_desc:0 "Перемещение учёных из государства [SOV.GetNameDef] в государство [GER.GetNameDef], законным путём или нет, ещё сильнее ускорит наш научный прогресс."
 GER_establish_stasi:0 "Создать Штази"
 GER_establish_stasi_desc:0 "Чтобы контрреволюционеры не свергли правительство изнутри, нам необходимо ведомство, занимающееся расследованием подобных угроз."
 GER_recruit_grenztruppen:0 "Добровольцы-антифашисты"
 GER_recruit_grenztruppen_desc:0 "Всё большая часть населения готова силой остановить фашистскую агрессию."
 GER_rehabilitate_military:0 "Реабилитировать армию"
 GER_rehabilitate_military_desc:0 "Фашисты превратили германскую армию в отсталую и коррумпированную бюрократию. В новой армии мы должны исправить эти проблемы."
 GER_establish_NVA:0 "[GetNVAFocusName]"
 GER_establish_NVA_desc:0 "Создание Национальной народной армии как новой призывной и хорошо обученной силы даст нам значительное преимущество над врагами."
 GER_production_effort:0 "Усилия по индустриализации"
 GER_production_effort_desc:0 "После ущерба, нанесённого промышленности прежним фашистским правительством, необходимо расширить производственные мощности и исправить последствия его политики."
 GER_collectivize_industry:0 "Обобществить промышленность"
 GER_collectivize_industry_desc:0 "В продолжение индустриализации следует постепенно коллективизировать промышленность, чтобы обеспечить её максимальную эффективность."
 GER_total_war:0 "Тотальная война"
 GER_total_war_desc:0 "Хотите ли вы тотальной войны? Если потребуется, хотите ли вы войны ещё более тотальной и радикальной, чем всё, что мы способны представить?"
 GER_case_anton_desc:0 "План «Антон», предусматривающий вторжение и включение нашего французского марионеточного государства в состав [GER.GetNameDef], должен быть осуществлён, чтобы обезопасить оставшуюся часть Франции."
 GER_appoint_economic_positions:0 "Назначить руководителей экономики"
 GER_appoint_economic_positions_desc:0 "Полностью оправиться от Великой депрессии государство [GER.GetNameDef] сможет только при единой экономической политике. Для этого назначим президента Рейхсбанка и министра экономики."
 GER_appoint_economic_positions_tooltip:0 "Вы сможете выбрать одного из следующих советников:"
 GER_two_side_economics:0 "Два подхода к экономике"
 GER_two_side_economics_desc:0 "В [GER.GetAdjective] правительстве за власть борются две группы. Технократы считают, что назначение специалистов и приоритет промышленности над армией обеспечат наибольший успех. Автаркисты же стремятся к полностью самодостаточному и военно могущественному государству [GER.GetName]."
 GER_support_technocrats_I:0 "Поддержать технократов"
 GER_support_technocrats_I_desc:0 "Если мы хотим сделать государство [GER.GetName] экономически сильным, необходимо поддержать технократов."
 GER_support_technocrats_II:0 "Предоставить технократам места в правительстве"
 GER_support_technocrats_II_desc:0 "Места в правительстве позволят технократам эффективнее проводить свою политику."
 GER_exploit_trade_dependence:0 "Использовать торговую зависимость"
 GER_exploit_trade_dependence_desc:0 ""
 GER_support_autarks_I:0 "Поддержать автаркистов"
 GER_support_autarks_I_desc:0 "Если мы хотим сделать государство [GER.GetName] экономически сильным, необходимо поддержать автаркистов."
 GER_support_autarks_II:0 "Предоставить автаркистам места в правительстве"
 GER_support_autarks_II_desc:0 "Места в правительстве позволят автаркистам эффективнее проводить свою политику."
 GER_jet_research:0 "Финансировать реактивные исследования"
 GER_jet_research_desc:0 "Реактивный двигатель откроет новую эпоху войны, позволяя с невероятной точностью бомбить врагов и господствовать в небе над государством [GER.GetNameDef] — по крайней мере, так утверждают учёные."
 GER_volksgemeinschaft:0 "Поддержать Народное сообщество"
 GER_volksgemeinschaft_desc:0 "Volksgemeinschaft, или «Народное сообщество», поможет объединить и усилить германские народы Европы и мира."
 GER_deutsche_arbeitsfront:0 "Создать Германский трудовой фронт"
 GER_deutsche_arbeitsfront_desc:0 "Заменить все из [GER.GetAdjective] Профсоюзы рабочих с одним союзом, контролируемым правительством, позволят нам обеспечить оптимальную эффективность работы профсоюзов. [GER.GetAdjective] Промышленный комплекс, облегчающий проведение промышленных и экономических реформ."
 GER_volkswagen:0 "Основать Volkswagen"
 GER_volkswagen_desc:0 "Массовое производство «народного автомобиля» повысит мораль и стимулирует инвестиции в гражданскую инфраструктуру и промышленность. К тому же кто не любит хороший Kübelwagen?"
 GER_steelworks_issues:0 "Проблемы сталелитейной промышленности"
 GER_steelworks_issues_desc:0 "Vereinigte Stahlwerke AG давно является главным производителем стали в Германии, но почти не контролируется государством. Чтобы обеспечить достаточное снабжение сталью, правительство должно вмешаться в добычу стратегических ресурсов, даже если ради военной экономики придётся пренебречь прибыльностью."
 GER_nationalize_resource_industries:0 "Сжижение угля"
 GER_nationalize_resource_industries_desc:0 "Германии не хватает нефти, поэтому необходимо удвоить усилия в области синтетического топлива."
 GER_nationalize_aviation_industry:1 "Стандартизировать производство самолётов"
 GER_nationalize_aviation_industry_desc:1 "Стандартизация и распределение производства военных самолётов между компаниями крайне важны для устранения неэффективности мирного времени."
 GER_reform_uranprojekt:0 "Возродить Урановый проект"
 GER_reform_uranprojekt_desc:0 "Урановый проект, также известный как «Урановый клуб», фактически прекратил существование после вторжения в Польшу и призыва учёных в армию. Возрождение программы и возвращение исследователей из вооружённых сил может значительно повысить научную отдачу."
 GER_rally_the_monarchists:0 "Сплотить монархистов"
 GER_rally_the_monarchists_desc:0 "Провалы Веймарского правительства и коррупция NSDAP резко контрастируют со славным имперским прошлым Германии. Мы должны вернуть стране прежнюю имперскую славу и место мировой державы."
 GER_return_of_conservative_exiles:0 "Возвращение консервативных изгнанников"
 GER_return_of_conservative_exiles_desc:0 ""
 GER_return_of_conservative_exiles_tt:0 "После начала §YГражданской войны§!:"
 GER_contact_ludendorff:0 "Связаться с Людендорфом"
 GER_contact_ludendorff_desc:0 "Эрих Людендорф, убеждённый консерватор и генерал-квартирмейстер времён Великой войны, остаётся популярным военным героем среди [ROOT.GetAdjective] народа. Хотя известно, что поначалу он поддерживал NSDAP, в последние годы он отдалился от партии. Его поддержка значительно повысит нашу легитимность."
 GER_ludendorff_will_join:0 "§YЭрих Людендорф§! присоединится к нам как §Yфельдмаршал§! после начала §RГражданской войны§!."
 GER_a_new_reich:0 "Свергнуть нацистов"
 GER_a_new_reich_desc:0 "Сплотив монархистов и другие прокайзеровские силы, мы наконец готовы захватить власть в Германии и вернуть Кайзеррейху былую славу!"
 GER_consolidate_new_reich:0 "Укрепить Кайзеррейх"
 GER_consolidate_new_reich_desc:0 "Мы захватили Рейхстаг и создали более-менее временное правительство во главе с новым кайзером. Теперь необходимо укрепить Германию как Четвёртый рейх."
 GER_restore_the_empire:0 "Восстановить империю"
 GER_restore_the_empire_desc:0 "После поражения Второго рейха в Великой войне и подписания Версальского договора многие по праву германские территории были отняты. Мы должны начать долгий и трудный процесс их возвращения."
 GER_european_claims:0 "Восстановить наши европейские территории"
 GER_european_claims_desc:0 "Прежде всего необходимо вернуть основные земли Германского рейха, особенно ставший [FRA.GetAdjective] Эльзас-Лотарингию и [POL.GetAdjective] город Данциг."
 GER_african_claims:0 "Восстановить наши африканские колонии"
 GER_african_claims_desc:0 "[ENG.GetAdjective] и [FRA.GetAdjective] державы использовали Версальский договор для оправдания захвата влияния над африканскими странами и колониями, демонстрируя порочность западного империализма. Возвращение колоний восстановит [GER.GetAdjective] могущество в регионе и создаст противовес [ENG.GetAdjective] и [FRA.GetAdjective] экспансионизму."
 GER_fufill_the_clay_of_mittelafrika:0 "Заполните глину Миттелафрики"
 GER_fufill_the_clay_of_mittelafrika_desc:0 "Слишком долго государство [ROOT.GetNameDef] мечтало о великой африканской колонии от [CHA.GetNonIdeologyName] до [ZAM.GetNonIdeologyName], названной «Миттельафрика». Пора воплотить мечту и закрепить наше положение признанной колониальной державы."
 GER_asian_claims:0 "Восстановить наши азиатские колонии"
 GER_asian_claims_desc:0 "Как и в Африке, бывшие союзники использовали Версальский договор для оправдания империалистических устремлений и грабежа германского народа. Теперь необходимо начать долгий путь восстановления бывших колоний в Азии и Тихом океане."
 GER_reclaiming_our_colonies:0 "Восстановить имперские владения"
 GER_reclaiming_our_colonies_desc:0 "Версальский договор заставил нас отказаться от суверенитета над имперскими территориями, которыми Германия владела до Великой войны. Это превратило мировую сверхдержаву в обычную региональную силу.\nНо теперь кайзер снова у власти, и, возможно, настало время вернуть империю раз и навсегда!"
 GER_interest_in_the_carribean:0 "Интерес к Карибам"
 GER_interest_in_the_carribean_desc:0 "Наш флот давно рассматривал возможность создания баз на Карибских островах, но этому препятствовал сам Отто фон Бисмарк. Теперь, когда он больше не стоит на пути, мы можем наконец осуществить эти амбиции."
 GER_restore_klein_venedig:0 "Восстановить Малую Венецию"
 GER_restore_klein_venedig_desc:0 "Малая Венеция была важнейшим владением [GER.GetAdjective] колонизации Америки, пока прежние колониальные державы не отняли её у нас. Пора вернуть притязания и воссоединиться с нашими [GER.GetAdjective] соотечественниками на юге!"
 GER_establish_imperial_german_army:0 "Вновь создать Германскую армию"
 GER_establish_imperial_german_army_desc:0 "Возрождение Германской армии по образцу нацистского вермахта, несомненно, даст Четвёртому рейху одну из сильнейших и эффективнейших вооружённых сил мира."
 GER_support_landwehr:0 "Поддержать ландвер"
 GER_support_landwehr_desc:0 "Поддержка ландвера сделает армию более профессиональной и эффективной, хотя и сократит её численность."
 GER_galvanize_german_militarism:0 "Разжечь [GER.GetAdjective] милитаризм"
 GER_galvanize_german_militarism_desc:0 "Милитаризм государства [GER.GetNameDef] — важнейшая часть национальной идентичности и нашего места среди наций. Естественно использовать его для подъёма духа."
 GER_support_freikorps:0 "Поддержать фрайкор"
 GER_support_freikorps_desc:0 "Поддержка фрайкора расширит общественную опору армии и облегчит набор гражданских. Однако поддерживать профессиональные стандарты станет сложнее."
 GER_support_freikorps_tt:0 "3 §YДивизии фрайкора§! Присоединяйтесь к нам, §YГражданская война§! Начни."
 GER_gott_mit_uns:0 "С нами Бог"
 GER_gott_mit_uns_desc:0 "Имперский девиз, выражающий [ROOT.GetAdjective] религиозное, политическое и этническое единство. Союз алтаря, трона и народа."
 GER_alliance_with_austria_hungary:0 "Союз с Австро-Венгрией"
 GER_alliance_with_austria_hungary_desc:0 "Мы должны восстановить великий союз, связывавший нас с Габсбургами."
 GER_alliance_with_the_ottomans:0 "Союз с Османской империей"
 GER_alliance_with_the_ottomans_desc:0 "Как и мы, османы подверглись несправедливому обращению Антанты после Мировой войны. Пора вместе вернуть своё место в мире."
 GER_draft_new_constitution:0 "Подготовить новую конституцию"
 GER_draft_new_constitution_desc:0 "Чтобы обеспечить национальное единство и не допустить экстремистов к власти, монархия должна быть подотчётной конституции и демократии. Лишь тогда Четвёртый рейх станет маяком для всего мира."
 GER_prioritize_infrastructure:0 "Отдать приоритет инфраструктуре"
 GER_prioritize_infrastructure_desc:0 "Современная инфраструктура позволит промышленной машине эффективнее работать во всех отраслях."
 GER_prioritize_civilian_industry:0 "Отдать приоритет гражданской промышленности"
 GER_prioritize_civilian_industry_desc:0 "Сильная гражданская промышленность повысит качество жизни народа и ускорит развитие других отраслей."
 GER_prioritize_military_industry:0 "Отдать приоритет военной промышленности"
 GER_prioritize_military_industry_desc:0 "Сильная армия невозможна без мощной военной промышленности. Её развитие откроет новые возможности для военной экспансии."
 GER_prioritize_defensive_construction:0 "Отдать приоритет оборонительному строительству"
 GER_prioritize_defensive_construction_desc:0 "В эти неспокойные политические времена государство [GER.GetNameDefCap] особенно уязвимо для внешнего вторжения. Ради стабильности и безопасности [GER.GetAdjective] народа необходимо отдать приоритет оборонительным сооружениям."
 GER_kaiser_wilhelm_society:0 "Возродить Общество кайзера Вильгельма"
 GER_kaiser_wilhelm_society_desc:0 "Из-за призыва и антиеврейских Нюрнбергских законов научной базе государства [GER.GetNameDef] стало крайне трудно вести эффективные исследования. Возрождение Общества кайзера Вильгельма поднимет военную и гражданскую науку на новую высоту."
 GER_return_scientists:0 "Освободить учёных от военной службы"
 GER_return_scientists_desc:0 "Многие бывшие учёные оказались в армии из-за призыва и других обязательных систем. Освободив их, мы сократим людские резервы, но обеспечим передовой уровень исследований."
 GER_enigma:0 "Улучшить «Энигму»"
 GER_enigma_desc:0 "Дальнейшие исследования методов шифрования «Энигмы» могут дать впечатляющие результаты и ещё надёжнее скрыть стратегические сообщения от врага."
 GER_volkssturm:0 "Создать фольксштурм"
 GER_volkssturm_desc:0 "Хотя ход войны начинает складываться не в нашу пользу, шанс ещё есть, если мы, [GER.GetAdjective] граждане, объединимся и встретим захватчика лицом к лицу! Это последний элемент тотальной войны, и с фольксштурмом государство [GER.GetNameDef] никогда не будет побеждено!"
 GER_iraq_friend:0 "Подружиться с государством [IRQ.GetNameDef]"
 GER_iraq_friend_desc:0 "Государство [IRQ.GetNameDefCap] занимает выгодное стратегическое положение на Ближнем Востоке и обладает ресурсами, необходимыми [GER.GetAdjective] военной машине. Дружба с ним может стать мудрым решением и не потребует отвлекать армию на новый фронт."
 GER_iraq_war:0 "Вторгнуться в государство [IRQ.GetNameDef]"
 GER_iraq_war_desc:0 "Государство [IRQ.GetNameDefCap] занимает выгодное стратегическое положение на Ближнем Востоке и обладает ресурсами, необходимыми [GER.GetAdjective] военной машине. Вторжение позволит удержать этот важный район и полностью использовать его ресурсы."
 GER_iran_friend:0 "Подружиться с государством [PER.GetNameDef]"
 GER_iran_friend_desc:0 "Государство [PER.GetNameDefCap] имеет протяжённую границу с государством [SOV.GetNameDef] и стратегическое положение у ворот Азии. Дружба с ним станет выгодным вложением и не отвлечёт ресурсы от основной кампании."
 GER_iran_war:0 "Вторгнуться в государство [PER.GetNameDef]"
 GER_iran_war_desc:0 "Государство [PER.GetNameDefCap] имеет протяжённую границу с государством [SOV.GetNameDef] и стратегическое положение у ворот Азии. Вторжение позволит оказывать давление по всему континенту и открыть новый фронт на юге России."
 GER_influence_brazil:0 "Оказать влияние на государство [BRA.GetNameDef]"
 GER_influence_brazil_desc:0 "Помимо природных ресурсов, государство [BRA.GetNameDef] занимает важное стратегическое положение в Америке. Союзник рядом с уязвимыми странами Южной Америки и в пределах удара по государству [USA.GetNameDef] заслуживает внимания."
 GER_revive_brest_litovsk:0 "Возродить Брест-Литовский договор"
 GER_revive_brest_litovsk_desc:0 "На данный момент наша война с [SOV.GetAdjective]Успешно, но наши военные нужны на других фронтах. Возрождение Брест-Литовского договора позволит нам заключить мир с Россией. [SOV.GetAdjective]s и достичь желаемых нами территориальных завоеваний."
 GER_5_factor:0 "Пятифакторная «Энигма»"
 GER_5_factor_desc:0 "Переход к пяти факторам значительно улучшит наше шифрование."
 GER_8_factor:0 "Восьмифакторная «Энигма»"
 GER_8_factor_desc:0 "Переход к восьми факторам наверняка сделает наше шифрование невзламываемым!"
 GER_demand_northern_schleswig:0 "Потребовать Северный Шлезвиг"
 GER_demand_northern_schleswig_desc:0 "Северный Шлезвиг был отнят у нас и передан датчанам по Версальскому договору. Мы должны потребовать возвращения этой земли!"
 GER_resolve_the_balkan_flank:0 "Обезопасить балканский фланг"
 GER_resolve_the_balkan_flank_desc:0 "Одно дело беспокоиться о государстве [ITA.getnamedef] к югу от нас, и совсем другое — одновременно иметь дело с непредсказуемой внешней политикой государства [YUG.getnamedef]. Пора навсегда привлечь его на нашу сторону."
 GER_emphasize_mine_warfare:0 "Сделать упор на минную войну"
 GER_emphasize_mine_warfare_desc:0 "Обширные побережья нашей страны чрезвычайно трудно защищать без огромного надводного флота. Недавно Департамент военно-морских инноваций и разработок предложил государственные инвестиции в технологии постановки мин, что позволит эффективнее защищать побережье, не распыляя наши ограниченные морские силы."
 GER_ally_greece_vanilla:0 "Заключить союз с государством [GRE.GetNameDef]"
 GER_ally_greece_vanilla_desc:0 "По мере роста нашего влияния в регионе крайне важно заручиться верностью заметной державы на юге. Её поддержка поможет давить на великие державы Ближнего Востока и позволит Кригсмарине свободнее действовать в Эгейском и Чёрном морях."
 GER_air_innovation_3:0 "Усилить люфтваффе"
 GER_air_innovation_3_desc:0 "Наши отважные асы и профессиональные команды механиков получат дополнительную поддержку и будут теснее сотрудничать с исследовательскими объединениями, чтобы тактика и техника оставались современными."
 GER_extra_tech_slot:0 "Расширить финансирование учёных"
 GER_extra_tech_slot_desc:0 "Мы можем значительно расширить исследовательскую сеть в соответствии с растущими потребностями экономики и политики. Будем поощрять молодых мужчин и женщин работать в новых учреждениях по всей процветающей стране."
 GER_train_colonial_troops:0 "Подготовить колониальные войска"
 GER_train_colonial_troops_desc:0 "Для защиты заморских владений необходимо подготовить специалистов по колониальной службе."
 GER_the_breitspurbahn:0 "Ширококолейная железная дорога"
 GER_the_breitspurbahn_desc:0 "Вскоре гигантская железнодорожная сеть покроет всю Европу, укрепляя [GER.GetAdjective] гегемонию."
 GER_the_breitspurbah_railways_tt:0 "Построить железную дорогу §Y1-го§! уровня от §YБерлина§! до §Yстолицы каждого субъекта§!, доступной по суше."
 GER_the_anglo_german_naval_agreement:0 "Англо-германское морское соглашение"
 GER_the_anglo_german_naval_agreement_desc:0 "В июне 1935 года мы подписали Англо-германское морское соглашение, разрешившее строительство ограниченного флота. Пора вновь пересмотреть его условия..."
 GER_adhere_to_the_agreement:0 "Соблюдать соглашение"
 GER_adhere_to_the_agreement_desc:0 "Лучше не злить британцев. Если в Европе начнётся война, мы не можем позволить себе испытывать их терпение и вновь оказаться под блокадой. Соблюдение соглашения позволит направить ресурсы на другие цели."
 GER_denounce_the_agreement:0 "Отказаться от соглашения"
 GER_denounce_the_agreement_desc:0 "Мы никогда всерьёз не собирались сохранять статус-кво, которого требовала Британия. Амбиции Германии не будут ограничены!"
 GER_scale_down_naval_projects:0 "Сократить военно-морские проекты"
 GER_scale_down_naval_projects_desc:0 "Объявив о крупном сокращении морских проектов, мы высвободим ресурсы для промышленности и сосредоточимся на европейских планах, вместо того чтобы тратить кровь, пот и сталь на хрупкие корабли."
 GER_reopen_wilhelmshaven_shipyards:0 "Вновь открыть верфи Вильгельмсхафена"
 GER_reopen_wilhelmshaven_shipyards_desc:0 "Верфи Вильгельмсхафена были закрыты после Великой войны. Возможно, пора открыть их вновь и расширить строительство конвоев."
 GER_expand_blohm_voss_shipyards:0 "Расширить верфи Blohm+Voss"
 GER_expand_blohm_voss_shipyards_desc:0 "Blohm+Voss доказала своё мастерство в кораблестроении. Небольшие государственные инвестиции позволят полностью использовать её возможности."
 GER_naval_plan_z:0 "Морской план Z"
 GER_naval_plan_z_desc:0 "Когда-то Германская империя обладала одним из лучших флотов мира. Великая война положила этому конец, а Версальский договор не позволил его возродить. Но благодаря плану Z наш флот вновь сможет соперничать даже с британским."
 GER_naval_aviation_patrols:0 "Патрули морской авиации"
 GER_naval_aviation_patrols_desc:0 "Вместо использования кораблей для защиты побережья можно усовершенствовать морскую авиацию и сделать её средством сдерживания. В конце концов, один самолёт дешевле одного корабля."
 GER_simplify_convoy_construction:0 "Упростить строительство конвоев"
 GER_simplify_convoy_construction_desc:0 "Сокращение удобств на конвойных судах и их стандартизация позволят выпускать больше кораблей и облегчат торговые перевозки."
 GER_the_bismarck_class:0 "Класс «Бисмарк»"
 GER_the_bismarck_class_desc:0 "После Великой войны наши бывшие враги связали себя новыми договорами, ограничивающими размеры кораблей. Мы не связаны этими условиями и знаем, что нужно построить, чтобы превзойти их."
 GER_fortify_the_coast:0 "Укрепить побережье"
 GER_fortify_the_coast_desc:0 "Создание береговых укреплений и зенитных установок вдоль побережья Северного моря обеспечит ожесточённое сопротивление любой высадке с моря или воздуха."
 GER_emergency_naval_program:0 "Чрезвычайная военно-морская программа"
 GER_emergency_naval_program_desc:0 "Война пришла в Германию, и того, что должно было нас защитить, оказалось недостаточно. Придётся отказаться от соглашения. Крупный надводный флот нам не построить, поэтому сделаем ставку на подводные лодки."
 GER_the_o_class:0 "Класс «O»"
 GER_the_o_class_desc:0 "«Бисмарк» и «Тирпиц» станут жемчужинами Атлантического флота, но им нужны достойные корабли сопровождения. Класс «O» создан именно для этого, и вместе они составят ядро нашего флота."
 GER_abandon_plan_z:0 "Отказаться от плана Z"
 GER_abandon_plan_z_desc:0 "В нынешних обстоятельствах мы не можем позволить себе продолжать план Z: корабли слишком дороги и строятся слишком долго. Сосредоточившись на подводном флоте, мы всё ещё сможем господствовать в Атлантике."
 GER_rule_the_naval_skies:0 "Господствовать в морском небе"
 GER_rule_the_naval_skies_desc:0 "Великая война показала, что авиация — следующий театр господства, и море не исключение. Мы должны обеспечить крупным кораблям необходимое сопровождение, включая воздушное."
 GER_scout_cruisers:0 "Крейсеры-разведчики"
 GER_scout_cruisers_desc:0 "Хотя основной флот способен топить конвои, крейсеры и линкоры, нам нужны корабли, которые смогут эффективно охотиться на вражеские конвои и избегать боя."
 GER_the_m_class:0 "Класс «M»"
 GER_the_m_class_desc:0 "В отличие от крейсеров-разведчиков, корабли класса «M» будут действовать вместе с основным флотом, прикрывать линкоры и бороться с крейсерами и эсминцами, пытающимися навязать нам бой."
 GER_trade_route_interdiction:0 "Перехват торговых маршрутов"
 GER_trade_route_interdiction_desc:0 "Невидимый клинок смертельнее всего. Удары из-под воды позволят топить конвой за конвоем, лишая врагов снабжения и подкреплений."
 GER_modular_submarine_construction:0 "Модульное строительство подводных лодок"
 GER_modular_submarine_construction_desc:0 "Упростив строительство подлодок, мы сможем выпускать их больше и быстрее, безнаказанно рассредоточивая бесшумных охотников по всей Атлантике."
 GER_the_h_class:0 "Класс «H»"
 GER_the_h_class_desc:0 "Следующий этап развития класса «Бисмарк» — класс «H» — должен проецировать германскую мощь не только в Атлантику, но и за её пределы!"
 GER_reach_across_the_atlantic:0 "Протянуть руку через Атлантику"
 GER_reach_across_the_atlantic_desc:0 "Настало время германским боевым кораблям пересечь Атлантику и продемонстрировать силу, затмив американский и британский флоты."
