 r56_ger_naval_treaty:0 "[ENG.GetAdjective]-[GER.GetAdjective] морской договор"
 r56_ger_naval_treaty_desc:0 "Недавние переговоры с государством [ENG.GetNameDef] значительно ослабили морские ограничения Версальского договора и позволили резко расширить флот. Однако ограничения на производство кораблей всё ещё действуют и сохранятся, пока мы окончательно не освободим флот от договора."
 r56_GER_four_year_plan:0 "Четырёхлетний план"
 r56_GER_four_year_plan_upgrade:0 "Бессрочный четырёхлетний план"
 r56_GER_four_year_plan_desc:0 "§WВступление в§! §Rнаступательную войну§! §Wс§! §Yвеликой державой§! §Rудаляет§! §Wэтот§! §Yнациональный дух§!\n"
 GER_coerce_the_technocrats:0 "Принудить технократов"
 r56_GER_four_year_plan_upgrade_tt:0 "§YНациональный дух $r56_GER_four_year_plan$§! станет постоянным и больше не будет удаляться при §Rвступлении в наступательную войну§!§W.§!"
 GER_coerce_the_technocrats_desc:0 "Многие предприниматели и их партнёры из так называемого технократического класса ненавидят вести дела и исследования при нынешнем правительстве. Эту потенциальную пятую колонну необходимо уничтожить прежде, чем она разрушит нас изнутри. Технократы подчинятся нашей воле и помогут развивать страну — так или иначе."
 r56_GER_coerce_the_technocrats_idea:0 "Принуждённые технократы"
 r56_GER_coerce_the_technocrats_idea_desc:0 "Предпринимательский и технократический классы подчинятся нашей воле. Выбора у них не будет!"
 GER_coerce_the_technocrats_tt:0 "Когда фокус §Y$GER_institute_price_controls$§! будет §Yзавершён:§!"
 r56_GER_economic_uncertainty:0 "Экономическая неопределённость"
 r56_GER_economic_uncertainty_desc:0 "Промышленники обеспокоены экономическим выбором правительства. Решение сохранить или отменить схему векселей MEFO в пользу другой программы роста снизит тревожность рынков внутри страны и за рубежом."
 r56_ger_ersatz_idea_1:0 "Эрзац-материалы"
 r56_ger_ersatz_idea_1_desc:0 "Экономика не получает всех необходимых материалов через международную торговлю. Мы должны использовать имеющееся и создавать заменители."
 GER_enigma_machine0:0 "Шифровальная машина «Энигма»"
 GER_enigma_machine1:0 "Улучшенная шифровальная машина «Энигма»"
 GER_enigma_machine2:0 "Пятироторная шифровальная машина «Энигма»"
 GER_enigma_machine3:0 "Восьмироторная шифровальная машина «Энигма»"
 GER_establishing_the_reichskommissar:0 "Создание рейхскомиссариата"
 GER_eastern_campaign:0 "Восточная кампания"
 GER_eastern_campaign_desc:0 "Финансируемые государством пропагандистские кампании убедили даже самых стойких противников войны на Востоке, что условия победы будут продиктованы [GER.getAdjective] стороной, а никакие переговоры не помешают достижениям вермахта. \n\n§HЭтот национальный дух будет удалён, если нанесённые государством [SOV.getAdjective] потери государства [GER.getAdjective] достигнут 4 миллионов человек или если любой контролируемый национальный регион государства [SOV.getAdjective] будет иметь более 50% подчинения.§!"
 erwache.1.t:0 "Назначение руководителей экономики"
 erwache.1.desc:0 "На должности президента Рейхсбанка и министра экономики есть два основных кандидата. Ялмар Шахт прекрасно умеет работать с компаниями государства [GER.GetNameDef] и развивать гражданскую инфраструктуру. Однако недостаточная преданность NSDAP и неприязнь к военным расходам делают его тревожным выбором. Второй кандидат, Вальтер Функ, очень верен NSDAP и активно поддерживает крупные военные расходы. Чтобы добиться заметного восстановления государства [GER.GetADjective], мы должны выбрать одного из них руководителем экономики."
 erwache.1.a:0 "Ялмар Шахт."
 erwache.1.b:0 "Вальтер Функ."
 erwache.1.c:0 "Андреас Гермес."
 erwache.1.d:0 "Фриц Шеффер."
 erwache.1.e:0 "Франц Далем."
 erwache.1.f:0 "Вальтер Ульбрихт."
 erwache.1.g:0 "Франц Якоб."
 erwache.1.h:0 "Карл Фридрих Гёрделер."
 erwache.1.i:0 "Пауль Лежён-Юнг."
 erwache.5.t:0 "[GER.GetAdjective] гражданская война"
 erwache.7.t:0 "Государство [GER.GetNameDefCap] предлагает мир!"
 erwache.7.d:0 "Государству [SOV.GetNameDefCap] предложен договор о завершении [GER.GetAdjective]-[SOV.GetAdjective] войны на Востоке. Он предусматривает передачу нескольких западных территорий, оккупированных государством [SOV.GetAdjective], стороне [GER.GetAdjective] в обмен на мир. Условия напоминают Брест-Литовский договор, завершивший германо-советский конфликт во время Великой войны."
 erwache.7.a:0 "Отклонить условия!"
 erwache.7.b:0 "Принять условия."
 r56_GER_first_vienna_award_tt:0 "§RВ зависимости от выбора Первый Венский арбитраж произойдёт, если государство [HUN.GetNameDef] не владеет регионами [664.getName] и [996.getName].§!"
 r56_GER_first_vienna_award_II_tt:0 "§RЭтот выбор немедленно запустит Первый Венский арбитраж, если государство [HUN.GetNameDef] не владеет регионами [664.getName] и [996.getName].§!"
 erwache_news.2.t:0 "Государство [SOV.GetnameDefCap] отказывается от мира с государством [GER.GetnameDef]!"
 erwache_news.2.d:0 "\nГосударство [SOV.GetNameDefCap] отклонило договор о завершении [GER.GetAdjective]-[SOV.GetAdjective] войны на Востоке. Он предусматривал передачу нескольких западных территорий, оккупированных государством [SOV.GetADjective], стороне [GER.GetADjective] в обмен на мир. Условия напоминали Брест-Литовский договор, завершивший германо-советский конфликт во время Первой мировой войны."
 erwache_news.2.a:0 "Тогда нам придётся присоединить [SOV.GetAdjective] земли силой."
 erwache_news.2.b:0 "Мы будем сражаться за каждую пядь!"
 erwache_news.2.c:0 "Интересно."
 stubborn:0 "Упрямый"
 restoring_monarchist:0 "Старый кайзер"
 new_monarchist:0 "Новый кайзер"
 GER_blohm_und_voss_aviation:0 "Blohm & Voss"
 GER_poland_war:0 "Война с Польшей"
 GER_poland_war_desc:0 "Польша когда-то была частью Германии и вновь ею станет!"
 GER_hungary_friend:0 "Привлечь государство [HUN.getnamedef] на нашу сторону"
 GER_hungary_friend_desc:0 "Мы должны убедиться, что государство [HUN.getnamedef] находится на нашей стороне."
 GER_war_with_hungary:0 "Война с государством [HUN.getnamedef]"
 GER_war_with_hungary_desc:0 "Государство [HUN.getnamedef] занимает критически важный южный фланг нашей страны, который необходимо обезопасить — при необходимости силой."
 GER_city_besiegement:0 "Осадная артиллерия"
 siege_artillery:0 "Осадная артиллерия"
 GER_city_besiegement_desc:0 "Поскольку массивные укрепления вновь появляются на современном поле боя, необходимо модернизировать полевые орудия, чтобы эффективнее прорывать оборону крепостей и городов."
 GER_city_besiegement_tt:0 "§WОткрывает:§! §Yосадную артиллерию§!, §Wкоторая даёт§!\n§WАртиллерия:§!\n§YГород§!\n§WАтака:§! §G+5%§!\n§YУкрепления§!\n§WАтака:§! §G+5%§!\n\n§WМоторизованная артиллерия:§!\n§YГород§!\n§WАтака:§! §G+5%§!\n§YУкрепления§!\n§WАтака:§! §G+5%§!\n\n"
 GER_shock_troops_tech_bonus:0 "Бонус к исследованию штурмовых частей"
 GER_pocket_liqudation:0 "Тактика ликвидации котлов"
 GER_pocket_liqudation_desc:0 "Окружив вражеские силы, мы должны применять улучшенную тактику и специализированные части, чтобы быстро уничтожать попавшие в котёл войска и возвращать солдат к выполнению основных задач."
 GER_pocket_liqudation_idea:0 "Тактика ликвидации котлов"
 GER_counter_deep_battle:0 "Контрудары по прорывам"
 GER_counter_deep_battle_desc:0 "Враги эффективно используют собственные бронетанковые клинья, поэтому нам нужны более совершенные методы, не позволяющие прорывам обрушить фронт. Удерживать каждую пядь земли против стремительных наступлений невозможно. Мы должны отступать, создавать новые рубежи обороны и контратаковать открывшиеся фланги врага."
 GER_reuse_capture_weapons:0 "Повторно использовать трофейное оружие"
 GER_reuse_capture_weapons_desc:0 "Несмотря на огромную промышленность, мы не можем постоянно полностью снабжать каждое отделение на передовой. Следует разрешить частям использовать захваченное стрелковое оружие и другое снаряжение для восполнения недостатка снабжения."
 GER_reuse_capture_weapons_random_generals_tt:0 "§YОдин§! случайно выбранный командующий армией получит черту §YСобиратель§!§W:\n— коэффициент захвата снаряжения:§! §G+3%§!\n\n"
 GER_captured_weapons:0 "Повторно использовать трофейное оружие"
 GER_frontline_hospitals:0 "Прифронтовые госпитали"
 GER_frontline_hospitals_desc:0 "Полевые госпитали помогают сохранять боеспособность частей, но безопасное размещение далеко за фронтом замедляет возвращение выздоровевших солдат. Приближение госпиталей к передовой рискованно, однако ускоряет лечение, спасает жизни и быстрее возвращает бойцов в строй."
 GER_streamline_logistics:0 "Оптимизировать тыловую логистику"
 GER_streamline_logistics_desc:0 "Не следует забывать о логистике тыла. Хотя она уже оптимизирована, дополнительные вложения помогут сохранить бесперебойную работу. Улучшения процессов в тылу могут также повысить эффективность снабжения фронта."
 GER_desperate_measures:0 "Отчаянные меры"
 GER_desperate_measures_desc:0 "Война наносит стране немыслимый ущерб, поэтому мы должны прибегнуть к мерам, которые ещё несколько лет назад казались немыслимыми."
 GER_greater_collaborator_conscription:0 "Расширить призыв коллаборационистов"
 GER_greater_collaborator_conscription_desc:0 "Коллаборационисты значительно помогли управлять оккупированными территориями, но теперь им придётся удвоить усилия и начать служить в нашей армии. От этого зависит военная кампания."
 GER_found_the_volkssturm:0 "Создать фольксштурм"
 GER_found_the_volkssturm_desc:0 "Стало ясно, что необходимо распространить призыв на ранее непригодные категории населения. Из этих людей можно сформировать части фольксштурма, освободить гарнизонные войска для фронта или пополнить недоукомплектованные дивизии."
 GER_found_the_volkssturm_stockpile_tt:0 "§Y1,00 тыс.§! единиц §Yстрелкового оружия фольксштурма§! будет добавлено на национальные склады."
 GER_front_line_cities:0 "Прифронтовые города"
 GER_front_line_cities_desc:0 "Поскольку война может приблизиться к нашим землям, необходимо подготовить города к превращению в крепости."
 GER_front_line_cities_tt:0 "Добавить §G1§! §Yназемное укрепление§! в каждой провинции региона, содержащей £victory_points£ §Yпобедные очки§!."
 GER_werewolves:0 "Вервольф"
 GER_werewolves_desc:0 "Мы должны обучить людей сопротивляться захватчикам при любой возможности."
 r56_ger_theater_prep:0 "Подготовка театра военных действий"
 r56_ger_theater_prep_desc:0 "Сейчас мы готовим возможный театр военных действий."
 r56_GER_poland_war_threat:0 "Обоснование войны с Польшей"
 r56_GER_anti_comitern_pact:0 "Завершён фокус §Y«Антикоминтерновский пакт»§!."
 r56_GER_anti_comitern_pact_days_tt:0 "Текущее количество дней: [?r56_GER_anti_comitern_pact:days|Y0]."
 GER_a_world_in_flames:0 "Мир в огне"
 GER_a_world_in_flames_desc:0 "Враги приближаются, но мы откажемся капитулировать. Возможно, нас победят и уничтожат. Но тогда мы утянем врагов и весь мир за собой. Мир в огне."
