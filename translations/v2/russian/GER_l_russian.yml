 GER_bop_rally_in_honour_of_the_kaiser:0 "Акция в честь кайзера"
 GER_strong_arm_the_industrialists:0 "Принудить промышленников"
 GER_strong_arm_the_industrialists_desc:0 "Мы можем «предложить» промышленникам брать займы в форме векселей MEFO вместо обращения в Рейхсбанк. Так мы скроем объём средств, выдаваемых Рейхсбанком для инвестиций в тяжёлую промышленность, и одновременно получим политические рычаги воздействия на промышленников. Превращение частных займов в векселя MEFO создаёт риск подорвать собственную экономику, но эти опасения ведь беспочвенны, верно?"
 GER_rally_the_technocrats:0 "Сплотить технократов"
 GER_rally_the_technocrats_desc:0 "Поддержка технократов имеет ключевое значение для наших будущих военных усилий."
 r56_GER_rally_the_technocrats_idea:0 "Сплочение технократов"
 GER_core_south_tyrol_threat:0 "Заявлены права на Южный Тироль"
 GER_trade_influence_decisions:0 "Торговые наступления"
 GER_trade_influence_decisions_explain_tt:0 "Они позволят превращать сильно зависимые государства в марионеток."
 GER_influence_nation:0 "Использовать влияние на государство [FROM.GetName]"
 GER_protect_interests_nation:0 "Защитить [ROOT.GetAdjective] интересы в государстве [FROM.GetNameDEf]"
 GER_coup_nation:0 "Про-[ROOT.GetAdjective] переворот в государстве [FROM.GetName]"
 GER_target_for_hostile_trade_influence:0 "Может стать целью враждебных решений."
 GER_used_original_MR:0 "Разделена Польша с Советским Союзом без уступки Литвы."
 GER_cut_german_trade_ties:0 "Разорвать торговые связи с Германией"
 GER_hostile_trade_decisions_tt:0 "§YРазблокирует решения о создании варгола на [FROM.GetNameDef] или использовать наше влияние для создания более благоприятного правительства.§!"
 GER_cannot_influence_us_anymore_tt:0 "§YГосударство [FROM.GetName] больше не сможет влиять на нас и использовать своё влияние для смены нашего правительства.§!"
 GER_pressure_LIT:0 "Оказать давление на государство [LIT.GetName]"
 GER_pressure_LIT_desc:0 "После утраты порта Клайпеда государство [LIT.GetNameDefCap] стало сильно зависеть от торговли продовольствием с государством [ROOT.GetName]. Угроза перекрыть этот торговый путь даёт нам значительные рычаги давления."
 GER_HOL_free_influence_tt:0 "Даёт 15 очков торгового влияния §Y«Ворота в Европу»§! над государством [HOL.GetNameDef]."
 RULE_ALLOW_RELEASE_NATIONS_NOT_GER_KINGDOMS_TOOLTIP:0 "Германские королевства сейчас нельзя освободить."
 GERK_revitalize_old_traditions:0 "Возродить старые [ROOT.GetAdjective] традиции"
 GERK_revitalize_old_traditions_desc:0 "Военные традиции государства [ROOT.GetNameDef] насчитывают столетия. Именно они являются определяющей чертой, объединяющей государство, правительство и общую основу [ROOT.GetAdjective] народа."
 GERK_root_militarism:0 "[ROOT.GetAdjective] милитаризм"
 GERK_root_militarism_desc:0 "Милитаризм всегда был опорой государства [ROOT.GetNameDef], и нет причин отказываться от этой традиции и наследия."
 GERK_factory_of_europe:0 "Фабрика Европы"
 GERK_factory_of_europe_desc:0 "Государство [ROOT.GetNameDefCap] имеет долгую и славную историю непревзойдённого промышленного производства, и мы намерены сохранить её."
 GERK_army_with_a_state:0 "Армия, обладающая государством"
 GERK_army_with_a_state_desc:0 "«Армия, обладающая государством» — уникальное [ROOT.GetAdjective] выражение, подчёркивающее силу и господство армии в [ROOT.GetAdjective] обществе."
 GERK_move_towards_german_reunification:0 "Двигаться к [GER.GetAdjective] воссоединению"
 GERK_move_towards_german_reunification_desc:0 "The [GER.GetAdjective] Говорившему миру всегда было суждено объединиться под единым государством, мы не должны больше позволять, чтобы эта судьба от нас скрывалась."
 GERK_continue_motorization:0 "Продолжить моторизацию армии"
 GERK_continue_motorization_desc:0 "Эпоха пешего солдата подходит к концу, и мы должны приспособиться, чтобы оставаться впереди. Моторизованные части должны быть готовы возглавить наступление и обеспечить быструю решительную победу."
 GERK_field_piece_research:0 "Подавляющая огневая мощь"
 GERK_field_piece_research_desc:0 "Пехота — основа армии, и для успеха ей необходима надлежащая поддержка. Мы должны вложить значительные средства в артиллерию, чтобы пехота могла развивать любое преимущество и уничтожать любого врага."
 global_reunited_germany:0 "Германия воссоединена"
 GERK_legacy_of_the_zollverein:0 "Наследие Таможенного союза"
 GERK_legacy_of_the_zollverein_desc:0 "Возможно, [GER.GetAdjective] Говорившему миру не суждено было быть единым, но, по крайней мере, способным работать вместе ради общего дела. Zollverein намеревался сделать это точно, теперь пришло время снова сформировать его, чтобы мы могли быть сильнее вместе."
 GER_zollverein_faction:0 "Таможенный союз"
 WGR_establish_a_provisional_capital:0 "Создать временную столицу"
 WGR_establish_a_provisional_capital_desc:0 "Чтобы правительство начало действовать, необходимо создать временную столицу за пределами Берлина, пока не появятся условия для переноса туда. Ни в коем случае нельзя создавать впечатление, будто это решение постоянно, иначе оно станет серьёзным признаком нашей слабости."
 r56_on_action_event.1.t:0 "Государство [GER.GetNameDefCap] меняет политический курс!"
 r56_on_action_event.1.d:0 "Изменения в политическом ландшафте [GER.GetNameDef] Это привело к формированию новой государственной системы, которая направлена на проведение значительно отличающейся от своих предшественников внутренней политики, где предпринимаются усилия по разрешению социальных споров и обеспечению порядка в новом государстве.\n\nИх дипломаты уже заявили, что внешняя повестка дня [GER.GetAdjective] Также серьезно пострадают государства, включая пересмотр прежних экономических соглашений, пересмотр договоров и упрек дипломатических союзов на различных уровнях власти.\n\nГолоса в нашей администрации постоянно задаются вопросом о том, [ROOT.getLeader] может перестроиться [ROOT.GetHerHis] мнение в отношении [GER.GetNameDef] или будет [ROOT.GetSheHe] Но, скорее, сохраняйте его до тех пор, пока ситуация остается неясной."
 r56_on_action_event.1.a:0 "Мы откажемся от прежней позиции по отношению к ним."
 r56_on_action_event.1.b:0 "Смена режима ничего не значит, если сердца людей развращены!"
 wtt_germany.80.t:0 "Государство [GER.GetNameDefCap] требует Южную Ютландию"
 wtt_germany.80.desc:0 "Германское правительство предъявило ультиматум с требованием вернуть ему Южную Ютландию. Германия потеряла эту землю в 1860-х годах, а по Версальскому договору она была возвращена нам. Многим живущим там этническим датчанам не понравится, что их отдают."
 wtt_germany.80.a:0 "Ради защиты страны мы должны согласиться."
 wtt_germany.80.b:0 "Мы не откажемся от суверенной земли."
 wtt_germany.81.t:0 "Государство [FROM.GetNameDefCap] возвращает Северный Шлезвиг"
 wtt_germany.81.d:0 "Государство [FROM.GetNameDefCap] согласилось вернуть нам Северный Шлезвиг. Сегодня утром последние [FROM.GetAdjective] гарнизоны и чиновники поспешно покинули территорию, за ними потянулся поток беженцев, стремящихся пересечь новую границу до её окончательного закрытия."
 wtt_germany.81.a:0 "Наконец северная граница восстановлена!"
 wtt_germany.82.t:0 "Государство [FROM.GetNameDefCap] отклоняет наш ультиматум"
 wtt_germany.82.d:0 "Государство [FROM.GetNameDefCap] ясно дало понять, что не вернёт Северный Шлезвиг, а любая попытка забрать его будет считаться объявлением войны."
 wtt_germany.82.a:0 "Тогда война."
 r56.ger.46.t:0 "Партия требует выборов руководства"
 r56.ger.46.desc:0 "Генрих Брандлер был неоценим в Гражданской войне, возглавив большую часть сопротивления против фашистов. Он показал, что он все еще прирожденный лидер. Сейчас он начал кампанию, пытаясь стать новым председателем КПД. Он уже получил большое количество последователей в партии.\n\nРеволюции удалось добиться [ROOT.GetNonIdeologyName]. Сейчас многие члены КПГ начали сомневаться в авторитете Москвы. Нынешний председатель КПГ Эрнст Тяльманн является убежденным сталинистом и долгое время был лидером левого крыла партии. У него есть поддержка Москвы и политическое влияние, чтобы остаться председателем. В противовес левому крылу Генрих Брандлер делает потенциальное возвращение к председательству, представляя правое крыло КПГ. То, что ему не хватает влияния, он компенсирует опытом, уже будучи председателем с 1920 по 1923 год. Кроме того, Москва объявила Эрнста Тяльмана своим фаворитом. Являясь родиной коммунизма, [ROOT.GetNonIdeologyName] представляет большой интерес для [SOV.GetNameDef]. Если бы они вмешались, они могли бы добиться результата, который принесет им пользу."
 r56.ger.46.a:0 "Генрих Брандлер добивается успеха!"
 r56.ger.46.b:0 "Тельман сохраняет пост."
 r56.ger.46.c:0 "Москва вмешивается, и Эрнст Тельман остаётся у власти."
 r56.ger.47.t:0 "Генрих Брандлер возвращается из изгнания"
 r56.ger.47.desc:0 "Генрих Брандлер — ветеран левой политики. Он был одним из основателей KPD и возглавлял её с 1920 по 1923 год во время Мартовского выступления и сорвавшегося восстания 1923 года, ответственность за которое возложили на него.\n\nОн впал в немилость Советского Союза и KPD после отмены революционного выступления 1923 года. Проведя несколько лет в СССР, он вернулся в государство [GER.GetNonIdeologyName] и основал KPD(O), выступавшую против руководства KPD, защищаемого Москвой. Он также создал Международную правую оппозицию как организацию, противостоящую Коминтерну. После прихода Гитлера к власти Брандлер отправился в изгнание в Париж, где продолжил бороться против московской коммунистической линии.\n\nТеперь этот опытный политик и профсоюзный деятель вернулся и будет сражаться за революцию!"
 r56.ger.47.a:0 "Он станет ценным участником борьбы с фашизмом."
 r56.ger.48.t:0 "Эрнст Тельман меняет курс партии"
 r56.ger.48.desc:0 "Революция победила! Государство [GER.GetNonIdeologyName] теперь является социалистическим государством во главе с Эрнстом Тельманом. Многие погибли, но всё было не напрасно.\n\nТеперь Эрнст Тельман созвал чрезвычайное заседание руководства партии, желая изменить политический курс. Москва больше не будет указывать KPD, что делать! Поэтому Тельман призвал руководство отказаться от привнесённых Сталиным идей и вновь сосредоточиться на учении Ленина."
 r56.ger.48.a:0 "Для государства [ROOT.GetNonIdeologyName] открывается новый путь."
 r56.ger.49.t:0 "[GER.GetAdjectiveCap] коммунисты избирают Тельмана"
 r56.ger.49.desc:0 "Известия [GER.GetNonIdeologyName] Только что, после 2 дней дебатов, комитет руководства КПГ избрал нового лидера: Эрнста Тяльмана. Ветеран КПГ, Тяльманн был давним другом Коминтерна и любимым кандидатом на пост президента. [SOV.GetNameDef].\n\nОднако, чтобы [SOV.GetLeader]4 часа спустя Эрнст Талманн объявил о выходе КПГ из Коминтерна, что стало неожиданностью для многих, включая его собственную партию.\n\n\"Революция в [GER.GetNonIdeologyName] Не будет контролироваться иностранными державами. Мы, немцы, можем и будем сами решать свое будущее, свое социалистическое общество! - Эрнст Тяльман в своей речи"
 r56.ger.49.a:0 "Интересное развитие событий."
 r56.ger.49.b:0 "Они предали революцию!"
 r56.ger.50.t:0 "[GER.GetAdjectiveCap] коммунисты избирают Брандлера"
 r56.ger.50.desc:0 "Борьба за руководство в государстве [GER.GetNonIdeologyName] завершена. Новым председателем KPD и, следовательно, высшим должностным лицом государства [GER.GetNonIdeologyName] стал Генрих Брандлер, один из основателей партии. Вернувшись на этот пост после более чем десятилетнего изгнания, Брандлер остаётся известным противником Коминтерна и основателем Международной правой оппозиции.\n\nБрандлер также подписал новую конституцию государства [GER.GetNonIdeologyName], направленную на расширение общественной собственности и устранение классовых различий, а также переименовал страну в [GER.GetNameDef]. Москва пока молчит, но ожидается, что новый [GER.GetAdjectiveCap] лидер будет осуждён."
 r56.ger.50.a:0 "Интересное развитие событий."
 r56.ger.50.b:0 "Они предали революцию!"
 r56.ger.51.t:0 "Создание Коминформа"
 r56.ger.51.desc:0 "Сегодня советская и [GER.GetAdjectiveCap] делегации подписали документы о роспуске Коминтерна и его замене Коминформом, членом которого станет государство [GER.GetNonIdeologyName]. Отношения двух стран прежде были плохими, но изменились после победы коммунистов в [GER.GetAdjectiveCap] гражданской войне.\n\nДля государства [GER.GetNonIdeologyName] это укрепит положение Эрнста Тельмана как генерального секретаря, поскольку он давно поддерживает тесные связи с идеологическими союзниками в Москве. Государство [SOV.GetNameDefCap], в свою очередь, получит значительные рычаги давления на государство [GER.GetNonIdeologyName]. Хотя на бумаге страны равны, многие эксперты подозревают советское вмешательство в [GER.GetAdjectiveCap] политику."
 r56.ger.51.a:0 "Интересное, хотя и ожидаемое развитие событий."
 r56.ger.51.b:0 "Ещё один шаг в неверном направлении."
 r56.ger.52.t:0 "Государство [SOV.GetNameDefCap] принимает наше предложение"
 r56.ger.52.desc:0 "Мы предложили государству [SOV.GetNameDef] заключить союз, предусматривающий дипломатическое, экономическое и военное сотрудничество. Теперь государство [SOV.GetNameDef] приняло наше предложение!\n\nВ рамках соглашения Коминтерн был распущен и заменён Коминформом, чтобы лучше координировать объединённую мощь наших экономик и армий."
 r56.ger.52.a:0 "Наше партнёрство будет славным!"
 r56.ger.53.t:0 "Государство [GER.GetNonIdeologyName] предлагает союз"
 r56.ger.53.desc:0 "[GER.GetAdjectiveCap] министерство иностранных дел выступило с интересным предложением. Оно хочет создать союз между нашими странами. Эрнст Тельман, лидер KPD, давно сотрудничает с Коминтерном.\nЭто масштабное дипломатическое, экономическое и военное начинание. Поэтому государство [GER.GetNameDef] предложило преобразовать Коминтерн в Коминформ и разработать новые правила плодотворного союза."
 r56.ger.53.a:0 "Объединим наши усилия."
 r56.ger.53.b:0 "Они ложные коммунисты!"
 r56.ger.54.t:0 "Государство [GER.GetNameDefCap] предлагает совместные военные учения"
 r56.ger.54.desc:0 "Будучи членом фракции [THIS.GetFactionName], государство [GER.GetNameDef] предложило провести совместные военные учения. Объединение усилий наверняка поможет нашим армиям лучше координироваться и разработать новые тактики и доктрины.\n\nОднако это обойдётся нам дорого и поставит в серьёзно невыгодное положение в случае войны."
 r56.ger.54.a:0 "Такие учения стоят выделения войск."
 r56.ger.54.b:0 "Мы не можем позволить себе отводить войска от границ."
 r56.ger.55.t:0 "Наше предложение о совместных учениях принято"
 r56.ger.55.desc:0 "Наш запрос на совместные военные учения был принят. Несколько дивизий уже направляются в неразглашаемое место их проведения. Мы надеемся лучше изучить местность региона и продолжить работу над получением преимущества над врагами."
 r56.ger.55.a:0 "Удачи нашим войскам."
 r56.ger.56.t:0 "Наше предложение о совместных учениях отклонено"
 r56.ger.56.desc:0 "Наш запрос на совместные военные учения был отклонён. Мы не получим ожидаемого опыта и должны будем повышать боеготовность самостоятельно. Возможно, это даже к лучшему, поскольку такие учения отвлекли бы значительные ресурсы от потенциального фронта."
 r56.ger.56.a:0 "Жаль, но заставить их мы не можем."
 cominform:0 "Коминформ"
 cominform_denied:0 "Отказ от союза"
 cominform_tt:0 "Заменяет §HКоминтерн§! на §HКоминформ§! и добавляет государство §H[GER.GetName]§! во фракцию."
 ger_cominform_tt:0 "Заменяет §HКоминтерн§! на §HКоминформ§! и добавляет §Hнас§! во фракцию."
 GER_nva_idea_brandler:0 "Народная оборона"
 GER_nva_idea_soviet:0 "Национальная народная армия"
 GER_nva_idea_thalmann:0 "Народная армия"
 GER_establish_NVA_idea_desc:0 "The [GetNVAIdeaName] Гордая революционная армия [ROOT.GetNameDef] Защита революции, рабочих и фермеров."
 GER_establish_nva_brandler:0 "Создать НО"
 GER_establish_nva_soviet:0 "Создать ННА"
 GER_establish_nva_thalmann:0 "Создать НА"
 GER_nva_joint_military_exercise_idea:0 "Идущие совместные военные учения"
 GER_nva_joint_military_exercise_idea_desc:0 "Военные учения в наши дни стали обычным явлением. Государство [ROOT.GetNameDefCap] сейчас проводит совместные учения с союзником."
 GER_NVA_category:0 "The [GetNVAIdeaName]"
 GER_NVA_category_desc:0 "The [GetNVAIdeaName] Она была создана после нашей победы в гражданской войне и защищает эту страну, ее народ и интересы пролетариата. Это маяк социалистического мира в Восточной и Центральной Европе. Если мы хотим, чтобы революция была защищена или даже расширена, мы должны будем справиться с этим. [GetNVAIdeaName] С большим вниманием, но и с приоритетом."
 GER_nva_institute_equal_service:0 "Установить равные условия службы"
 GER_nva_institute_equal_service_desc:0 "Революция победила и должна одинаково охватывать всех немцев. Поэтому мы больше не можем запрещать женщинам служить в армии."
 GER_nva_military_exercise:0 "Приказать провести военные учения"
 GER_nva_military_exercise_desc:0 "Хотя у нас есть сильная регулярная армия, ещё предстоит выяснить её эффективность в полевых условиях. Следует провести крупномасштабные учения для оценки боеготовности."
 GER_nva_military_exercise_modifier_tt:0 "Ежедневные затраты политической власти: §R+0.25§!\nЕжедневный прирост командного ресурса: §R-0.50§!\nИстощение: §R+4.00%§!\nВремя подготовки: §G-15.00%§!\nПрирост опыта армии: §G+20.0%§!\nПрирост опыта авиации: §G+10.0%§!\nПрирост опыта флота: §G+5.0%§!"
 GER_nva_joint_military_exercise_idea_modifier_tt:0 "Затраты политической власти: §R0.25§!\nПрирост командного ресурса: §R-0.50§!\nИстощение: §R+4.00%§!\nПрирост опыта армии: §G25.0%§!\nПрирост опыта авиации: §G25.0%§!"
 GER_nva_joint_military_exercise:0 "Предложить совместные учения"
 GER_nva_joint_military_exercise_desc:0 "У нас есть способные союзники, с которыми можно отработать тактику и улучшить взаимодействие на поле боя."
 GER_otto_wels:0 "Отто Вельс"
 GER_election_comission:0 "Избирательная комиссия"
 r56.ger.60.t:0 "День выборов!"
 r56.ger.60.desc:0 "Демократическая страна нуждается в своих выборах, чтобы функционировать, сегодня эти выборы будут проведены, и победитель возглавит правительство и, следовательно, получит должность президента.\n\nЕсть две основные партии, которые имеют шанс на победу на выборах. На сегодняшний день самой популярной партией является СДПГ, которая оказала значительное влияние на [ROOT.GetAdjectiveCap] Политика в большинстве своем существует. Они представляют социал-демократические взгляды, благоприятствуя низшим классам рабочих путем укрепления профсоюзов и установления социализма.\nИх главным конкурентом является «Зентрум», несколько более старая и центристская партия. Их основными избирателями являются католики из Южной Германии. Партия более консервативна в своей культурной и экономической политике, но не уклоняется от увеличения льгот для рабочих.\n\nТеперь все голоса подсчитаны, и результаты следующие:"
 r56.ger.60.a:0 "Zentrum одерживает решительную победу!"
 r56.ger.60.b:0 "SPD одерживает решительную победу!"
 r56.ger.60.c:0 "Zentrum побеждает с небольшим перевесом и формирует коалицию."
 r56.ger.60.d:0 "SPD побеждает с небольшим перевесом и формирует коалицию."
 r56.ger.60.e:0 "Нынешнее правительство получает ещё четыре года без соперников!"
 r56.ger.61.t:0 "Отто Вельс умирает в возрасте 66 лет"
 r56.ger.61.desc:0 "Отто Вельс, один из последних оплотов, павших перед фашизмом, скончался в возрасте 66 лет. Он двадцать лет возглавлял SPD и руководил страной с момента падения фашизма в гражданской войне.\n\nЗначение этой личности для [ROOT.GetAdjectiveCap] политики невозможно переоценить. Немногие смогут соответствовать его наследию. Его преемник Ханс Фогель отныне будет руководить страной. Будем надеяться, что его президентство окажется достойным Вельса.\n\nВ ближайшие дни Отто Вельса похоронят, пока страна продолжает скорбеть. На надгробии высекут цитату из его последней речи 1933 года, произнесённой перед принятием закона о чрезвычайных полномочиях:"
 r56.ger.61.a:0 "«Вы можете отнять у нас свободу и жизнь, но никогда не отнимете достоинство!»"
 r56.ger.63.t:0 "Ханс Фогель умирает в возрасте 58 лет"
 r56.ger.63.desc:0 "Президент умер. Он мирно скончался во сне в возрасте 58 лет. Хотя он был сравнительно молод, его жизнь была насыщенной и посвящённой Германии и её процветанию.\n\nС юных лет он участвовал в профсоюзной политике и несколько десятилетий оставался важной фигурой германской политики. В 1931 году он стал сопредседателем SPD вместе с Отто Вельсом и Артуром Криспиеном. После смерти Вельса в 1939 году он сам стал президентом и повёл Германию к светлому будущему.\n\nЕго преемник Курт Шумахер официально вступит в должность в ближайшие дни, когда бывшего президента похоронят на берлинском кладбище."
 r56.ger.63.a:0 "Покойся с миром. Шумахер станет достойным преемником."
 r56.ger.65.t:0 "Гитлер совершает самоубийство"
 r56.ger.65.desc:0 "Поскольку наше поражение кажется неизбежным, Адольф Гитлер предпочёл смерть плену и совершил самоубийство в командном бункере.\n\nВ завещании новым [GER.Adjective] президентом назначен адмирал Карл Дёниц, принявший командование остатками наших сил. Хотя Дёниц заявил о намерении «добиться наиболее благоприятного мира», это вряд ли существенно поможет в нашем уже отчаянном положении."
 r56.ger.65.a:0 "Государство [GER.GetNameDef] победит!"
