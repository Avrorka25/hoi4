 HOL_form_the_benelux_fla_tt:0 "Получает событие «§YНидерланды приглашают [FLA.GetName] в Объединённые Нидерланды§!».\n"
 HOL_form_the_benelux_wll_tt:0 "Получает событие «§YНидерланды приглашают [WLL.GetName] в Объединённые Нидерланды§!».\n"
 HOL_democratic_tt:0 "Мы должны либо уступить демократическому влиянию, либо сохранить нейтралитет в торговой политике."
 HOL_monarchist_tt:0 "Мы должны либо уступить монархическому влиянию, либо выбрать иной тип правительства, чем у наших покровителей, чтобы сохранить нейтральный курс."
 HOL_fascist_tt:0 "Мы должны либо уступить фашистскому влиянию, либо выбрать иной тип правительства, чем у наших покровителей, чтобы сохранить нейтральный курс."
 HOL_communist_tt:0 "Мы должны либо уступить коммунистическому влиянию, либо выбрать иной тип правительства, чем у наших покровителей, чтобы сохранить нейтральный курс."
 HOL_can_ENG_or_GER_influence_tt:0 "В настоящее время мы не переходим к другому типу правительства."
 HOL_is_placated_changing_gov_tt:0 "В настоящее время не происходит смена режима."
 HOL_the_new_ideal_MTG_desc:0 "[GER.GetNameDefCap] причинила миру и особенно нам слишком много вреда. Теперь она должна заплатить, отодвинув свои границы на восток."
 HOL_base_game_tree_check_fail_tt:0 "Использование дерева non-DLC."
 HOL_base_game_tree_check_pass_tt:0 "Использование дерева DLC."
 HOL_anti_pacifist_propaganda_long:0 "Масштабная кампания антипасифистской пропаганды"
 mtg_netherlands.80.t:0 "[FROM.GetNameDefCap] предлагает союз"
 mtg_netherlands.80.d:0 "[FROM.GetNameDefCap] предложила союз между нашими странами. Такое соглашение обеспечит дружественный контроль над стратегически важной Ост-Индией и почти гарантирует доступ к её нефти и каучуку без риска крупного конфликта."
 mtg_netherlands.80.a:0 "Это будет выгодно."
 mtg_netherlands.80.b:0 "Мы могли бы распоряжаться этими ресурсами лучше."
 HOL_JAP_new_faction:0 "Возрождённый нидерландско-японский союз"
 HOL_restore_naval_cooperation:0 "Восстановить военно-морское сотрудничество"
 HOL_restore_naval_cooperation_desc:0 "Нидерландцы помогли создать японский флот; теперь положение изменилось, и мы отстаём в военно-морском развитии. Сотрудничество с Японией в подобных вопросах поможет укрепить наши морские силы."
 HOL_jap_research_name:0 "Нидерландско-японский обмен технологиями"
 HOL_jap_research_desc:0 "Сокращает время исследования технологий, уже изученных другими участниками альянса"
 mtg_netherlands.14.b:0 "Пусть правит оппозиционер Виллем Альбарда."
 mtg_netherlands.14.c:0 "Продвигать либеральные ценности вместе с Питером Аудом."
 mtg_netherlands.11.c:0 "Нам следует сотрудничать."
 HOL_dutch_revanchism:0 "Нидерландский реваншизм"
 HOL_dutch_revanchism_desc:0 "На протяжении веков Нидерланды контролировали множество территорий в Нижних землях и за морем, слишком многие из которых со временем были утрачены. Теперь у нас появился шанс исправить последствия революций, войн и иных территориальных передач, чрезмерно ослабивших нашу империю."
 HOL_vlaanderen_opnieuw_van_ons:0 "Фландрия снова наша!"
 HOL_vlaanderen_opnieuw_van_ons_desc:0 "Бельгийское восстание 1830 года, окончательно закреплённое Лондонским договором девять лет спустя, лишило нас нидерландоязычной Фландрии. Теперь, когда она вновь под нашим контролем, мы можем реинтегрировать её и показать миру волю объединённых Нидерландов!"
 HOL_reintegrate_wallonia:0 "Реинтегрировать Валлонию"
 HOL_reintegrate_luxembourg:0 "Реинтегрировать Люксембург"
 HOL_unshackle_the_boers:0 "Освободить буров!"
 HOL_unshackle_the_boers_desc:0 "Много веков назад Нидерландская Ост-Индская компания основала несколько колоний у мыса Доброй Надежды и со временем расширила их. Хотя значительная часть нашего контроля была косвенной, многие нидерландские поселенцы теперь живут под чужой властью. Мы освободим своих братьев!"
 HOL_liberate_french_flanders:0 "Освободить Французскую Фландрию"
 HOL_disavow_the_anglo_dutch_treaty_of_1870_1871:0 "Отвергнуть англо-нидерландский договор 1870–1871 годов"
 HOL_disavow_the_anglo_dutch_treaty_of_1870_1871_desc:0 "Англо-нидерландские договоры 1871 года, помимо прочего, вынудили нас уступить важнейший западноафриканский торговый форпост Золотого Берега. Мы отвергнем этот неравноправный удар по нашей империи!"
 HOL_claim_former_east_indies_possessions:0 "Заявить права на бывшие владения в Ост-Индии"
 HOL_claim_former_east_indies_possessions_desc:0 "Нидерландская Ост-Индская компания некогда контролировала несколько ключевых торговых пунктов и островов по всей Азии, которые со временем перешли под иностранную власть. Мы больше не станем мириться с потерей законных территорий!"
 hol_expand_the_guianas_possession:0 "Расширить владения в Гвианах"
 no_shell_shocked_spectator_tt:0 "Не имеет национального духа §YПотрясённый войной наблюдатель Великой войны§!"
 hol_unlocks_integration_decisions_tt:0 "§GОткрывает§! решения по интеграции или предъявлению претензий на несколько исторических §Yнидерландских§! территорий."
 walloon_partisans:0 "Валлонские партизаны"
 HOL_mio_trait_van_trappen_suspension:0 "Подвеска Van Trappen"
 HOL_reclaim_the_crown_jewel:0 "Вернуть коронную жемчужину"
 HOL_reclaim_the_crown_jewel_desc:0 "Колония — коронная жемчужина слишком важна, чтобы позволить ей ускользнуть из наших рук, даже если ради этого придётся подавить открытое восстание."
 HOL_sunda_islands_staging_area:0 "Плацдарм на Зондских островах"
 HOL_sunda_islands_staging_area_desc:0 "Для управления развёртыванием сил в [INS.GetNameDef] необходимо построить инфраструктуру, которая позволит эффективно вести боевые действия в регионе."
 HOL_jungle_rangers:0 "Егеря джунглей"
 HOL_jungle_rangers_desc:0 "Значительная часть территории [INS.GetNameDef] покрыта густыми джунглями. Чтобы эффективно воевать в регионе, необходимо подготовить специализированные части, приспособленные к этим суровым условиям."
 HOL_anti_partisan_effort:0 "Борьба с партизанами"
 HOL_anti_partisan_effort_desc:0 "Партизаны в наших колониях мешают действиям войск. Мы должны приложить больше усилий для их уничтожения."
 HOL_evacuate_colonial_assets:0 "Эвакуировать колониальные активы"
 HOL_evacuate_colonial_assets_desc:0 "Поскольку колонии потеряны или охвачены открытым восстанием, пора вернуть сделанные там инвестиции и использовать их в собственных интересах."
