 HOL_heirs_of_ruyter:0 "Наследники Рюйтера"
 HOL_heirs_of_ruyter_desc:0 "Хоу зее!"
 HOL_air_industry_contacts:0 "Связи в авиационной промышленности"
 HOL_nsb_influence:0 "Влияние NSB"
 HOL_working_duty:0 "[HOL.GetAdjective] Служба по работе"
 HOL_control_indonesian_nationalists:0 "Индонезийские националисты"
 HOL_economic_recovery:0 "Экономическое восстановление"
 HOL_economic_recovery_desc:0 "Великая депрессия глубоко ранила нас. Безработица затронула более 40% активного населения. Наша ситуация тяжелая, поэтому мы должны попытаться что-то сделать, чтобы перезапустить нашу экономику."
 HOL_technological_modernization:0 "Технологическая модернизация"
 HOL_technological_modernization_desc:0 "Чтобы наша отрасль оставалась конкурентоспособной в следующем десятилетии, мы должны модернизировать станки и внедрить новые методы производства."
 HOL_electronic_innovations:0 "Электронные инновации"
 HOL_electronic_innovations_desc:0 "Наша радиоиндустрия не только обеспечит эффективную связь наших войск, но и электронные компоненты, несомненно, будут играть жизненно важную роль в некоторых передовых технологиях."
 HOL_research_breakthrough:0 "Прорыв в исследованиях"
 HOL_research_breakthrough_desc:0 "С восстановлением нашей экономики изо дня в день мы можем извлечь выгоду из самых инновационных элементов нашей отрасли, чтобы обеспечить наше развитие."
 HOL_civilian_production:0 "Гражданское производство"
 HOL_civilian_production_desc:0 "Мы должны перезапустить гражданскую экономику, чтобы выйти из экономического спада. Избранные меры в пользу инвестиций позволят фабрикам снова производить больше товаров и, следовательно, частично снизить безработицу."
 HOL_expand_the_curacao_refineries:0 "Расширить НПЗ Кюрасао"
 HOL_expand_the_curacao_refineries_desc:0 "Из-за отсутствия возможностей по переработке в Венесуэле и трудностей с транспортировкой нефти с болот северо-запада страны на другой нефтеперерабатывающий завод, Caribbean Petroleum (дочерняя компания Royal Dutch Shell) построила НПЗ на острове Кюрасао. Остров может быть использован в качестве заправочной станции для судов, идущих к Панамскому каналу."
 HOL_fishing_industry:0 "Развитие рыбной промышленности"
 HOL_fishing_industry_desc:0 "Мы всегда с нетерпением ждали моря, которое должно стать частью нашего экономического развития. Увеличение нашего рыболовного флота будет одним из наших многочисленных способов создания процветания."
 HOL_conservative_government:0 "Консервативное правительство"
 HOL_conservative_government_desc:0 "Антиреволюционная партия Хендрикуса Колейна одержала победу на выборах и будет вести переговоры о формировании нового коалиционного правительства во главе с консерваторами."
 HOL_maintain_neutrality:0 "Сохранять нейтралитет"
 HOL_maintain_neutrality_desc:0 "Чтобы избежать темных облаков, сгущающихся над небом Европы, мы должны быть как остров, защищенный нашими каналами. Мы хотим избежать любого европейского конфликта. Тем не менее, некоторые военные аналитики предупредили наше правительство о том, что угроза возможного [ENG.GetAdjective] Вмешательство может заставить [GER.GetAdjective]Упреждающее вмешательство."
 HOL_deterrence:0 "Военная подготовка"
 HOL_deterrence_desc:0 "Даже если мы не хотим участвовать в войне, мы должны применять старую поговорку: дела сильнее слов. Поэтому мы должны быть готовы к любой иностранной угрозе, если мы хотим отговорить их от нападения на нас."
 HOL_anti_revolutionary_measures:0 "Антиреволюционные меры"
 HOL_anti_revolutionary_measures_desc:0 "Если и существует четкая политическая цель для антиреволюционной партии, то вполне логично предотвратить наступление революции в стране. [HOL.GetNameDef]. Борясь с экстремизмом как коммунистов, так и фашистов, гражданское общество избегает ослабления авторитарными идеологиями. Одной из главных мер является исключение членов этих партий из армии. Во-вторых, секретная служба должна контролировать критически настроенных членов этих организаций, чтобы они не были агентами иностранных держав."
 HOL_mobilization_propaganda:0 "Мобилизационная пропаганда"
 HOL_mobilization_propaganda_desc:0 "Чтобы поднять моральный дух нашего населения и дать ему понять, что мы живем в трудное время, мы должны создать мобилизационную пропагандистскую программу. Эта программа проходит через различные носители: плакаты, статьи в прессе и песни, которые бы гарантировали, что мобилизованные солдаты не забудут свой долг даже в моменты удовольствия."
 HOL_control_indonesian_intellectuals:0 "Контроль индонезийских интеллектуалов"
 HOL_control_indonesian_intellectuals_desc:0 "Агитация индонезийских националистов представляет собой значительную угрозу целостности нашего колониального владения. В это время кризиса такой риск становится потенциальной экзистенциальной угрозой. Поэтому мы должны направить четкие меры в Департамент политической разведки в Ост-Индии, чтобы контролировать этих беспокойных людей."
 HOL_join_belgo_luxembourgian_customs_union:0 "Вступить в таможенный союз"
 HOL_join_belgo_luxembourgian_customs_union_desc:0 "Чтобы укрепить экономику, следует обратиться к южным соседям и договориться о вступлении в [BEL.GetAdjective]-[LUX.GetAdjective] таможенный союз, превратив его в Таможенный союз Бенилюкса."
 HOL_diplomatic_cooperation:0 "Дипломатическое сотрудничество"
 HOL_diplomatic_cooperation_desc:0 "Избегание войны является нашей главной целью, и для этого мы должны укрепить нашу дипломатическую ситуацию. Если этот план будет успешным, мы могли бы даже попытаться договориться о компромиссе и избежать уничтожения нового поколения на полях Европы."
 HOL_foreign_guarantees:0 "Иностранные гарантии"
 HOL_foreign_guarantees_desc:0 "Дипломатия может попытаться предотвратить войну, но мы всё равно должны быть готовы к провалу посредничества. Поэтому необходимо попросить иностранные державы гарантировать нашу независимость."
 HOL_british_alliance:0 "Присоединяйся [ENG.GetAdjective]"
 HOL_british_alliance_desc:0 "Чтобы защитить наши демократические институты от внешних угроз, мы должны наращивать наше военное сотрудничество с другими странами. [ENG.GetNameDef]Как в Северном море, так и в Восточной Азии."
 HOL_british_naval_cooperation:0 "Сотрудничество с [ENG.Getadjective] Флот"
 HOL_british_naval_cooperation_desc:0 "Наш флот может оказаться недостаточным для того, чтобы противостоять нашим врагам в одиночку, но при поддержке наших союзников. [ENG.GetAdjective] Военно-морской флот, мы должны быть в состоянии взять верх где угодно на семи морях."
 HOL_the_new_ideal:0 "Новый идеал"
 HOL_the_new_ideal_desc:0 "[GER.GetNameDefCap] причинила миру и особенно нам слишком много вреда. Теперь она должна заплатить, отодвинув свои границы на восток."
 HOL_support_trade:0 "Поддержать торговлю"
 HOL_support_trade_desc:0 "Вопреки фашистской вере в автаркическое однородное государство, наша история показывает, что торговля необходима для оказания влияния. Мы должны поддерживать наши торговые возможности и укреплять нашу экономику до того, что было до кризиса."
 HOL_industrial_cooperation:0 "Промышленное сотрудничество"
 HOL_industrial_cooperation_desc:0 "Промышленное сотрудничество"
 HOL_technology_sharing:0 "Обмен технологиями"
 HOL_technology_sharing_desc:0 "Мы не сможем победить наших врагов в одиночку, и мы должны собрать всю возможную помощь от наших союзников."
 HOL_form_benelux:0 "Военный альянс Бенилюкса"
 HOL_form_benelux_desc:0 "С нашим включением в таможенный союз мы можем сосредоточиться на нашей дипломатической позиции в случае, если [FRA.GetAdjective]-[GER.GetAdjective] Конфликт. Сотрудничество стран Таможенного союза позволит нам вместе защищать нашу позицию и координировать нашу военную подготовку."
 HOL_benelux_scientific_commission:0 "Научная комиссия Бенилюкса"
 HOL_benelux_scientific_commission_desc:0 "После создания экономического и оборонного сотрудничества логичным следующим шагом станет координация военных исследований."
 HOL_communist_electoral_success:0 "Коммунистический избирательный успех"
 HOL_communist_electoral_success_desc:0 "Народ призывал к уничтожению коррумпированной тирании буржуазной элиты. Безработица и нищета должны закончиться, а революция торжествует, чтобы обеспечить светлое будущее, в котором больше не будет классов, — будущее истинной индивидуальной свободы."
 HOL_communism_east_indies:0 "Распространение коммунизма в Ост-Индии"
 HOL_communism_east_indies_desc:0 "Корпоратократические империалистические силы угнетали Ост-Индию с тех пор, как Голландская Ост-индская компания захватила острова в 17 веке. Настало время индонезийцам понять их эксплуатацию, как это показал Маркс, и освободиться от колониального господства."
 HOL_autonomy_for_the_east_indies:0 "Автономия для Ост-Индии"
 HOL_autonomy_for_the_east_indies_desc:0 "Даже если мы положим конец колониальному правлению в Ост-Индии, ясно, что индонезийское общество не является индустриальным обществом, готовым к настоящей революции, как это предполагали Маркс, Энгельс и Ленин. Поэтому мы должны сохранять присутствие в регионе, по-прежнему предоставляя автономию на местном уровне, но направляя процесс их индустриализации."
 HOL_independence_for_the_east_indies:0 "Независимость для Ост-Индии"
 HOL_independence_for_the_east_indies_desc:0 "Мы должны как можно скорее после установления коммунистического правительства применить лозунг предыдущих политических кампаний. Мы должны предоставить свободу Индонезии и положить конец западному империалистическому правлению в регионе."
 HOL_social_reforms:0 "Социальные реформы"
 HOL_social_reforms_desc:0 "Чтобы обеспечить счастье рабочих и их поддержку новому коммунистическому режиму, мы должны провести глубокие реформы, чтобы дать работу безработным и повысить условия жизни указанных работников."
 HOL_nationalization:0 "Национализация"
 HOL_nationalization_desc:0 "Капиталисты не в состоянии управлять фабриками, не подавляя стремления рабочих и не выкачивая прибыли для себя во имя бесстыдной жадности и чистой моральной порочности."
 HOL_railroad_investments:0 "Железнодорожные инвестиции"
 HOL_railroad_investments_desc:0 "Инфраструктура является важным элементом для повышения производительности и перемещения неожиданных производственных записей туда, где они будут наиболее полезными."
 HOL_invest_heavy_industry:0 "Инвестируйте в тяжелую промышленность"
 HOL_invest_heavy_industry_desc:0 "Только увеличение производства стали позволит нам продвинуться вперед и ускорить наступление настоящего бесклассового коммунизма."
 HOL_rearmement_program:0 "Программа перевооружения"
 HOL_rearmement_program_desc:0 "Мы не хотим воевать, но мы должны любой ценой защищать свободу рабочих и власть партии от союза фашистов и капиталистов."
 HOL_align_the_military:0 "Выравнивать военных"
 HOL_align_the_military_desc:0 "Слишком долго армия была орудием буржуазной элиты в подавлении пролетариата. С появлением на первый план мы не должны забывать, что призывники являются эманацией пролетариата и должны быть базой новой армии, сражающейся не против нее, а за народ."
 HOL_state_security:0 "Организовать Службу безопасности"
 HOL_state_security_desc:0 "Поскольку защита партии и пролетариата необходима для успеха революции, жизненно важно вкладывать средства в нашу службу безопасности, чтобы гарантировать, что потенциальные враги народа не замышляют контрреволюцию."
 HOL_join_comintern:0 "Коммунистический военный пакт"
 HOL_join_comintern_desc:0 "Революция должна защищаться от врагов. Это время, несомненно, будет отмечено войной, и только великий союз всех защитников пролетариата позволит нашему классу одержать победу над буржуазными угнетателями."
 HOL_soviet_military_mission:0 "[SOV.GetAdjective] военная миссия"
 HOL_soviet_military_mission_desc:0 "Модернизация нашей армии — это длительный и сложный процесс. Таким образом, иностранная помощь от наших союзников станет долгожданным дополнением к обогащению нашей программы."
 HOL_NSB_electoral_success:0 "Избирательная победа НСБ"
 HOL_NSB_electoral_success_desc:0 "Пришло время возрождения нашего национального единства. Народ призвал НСБ и Антона Муссерта править Нидерландами и спасти нацию от большевистских вредителей."
 HOL_reinforce_grasp_on_the_colonies:0 "Укрепляем наш дух в колониях"
 HOL_reinforce_grasp_on_the_colonies_desc:0 "Слишком долго слабое демократическое правительство терпело агитацию местных проблемных элементов под влиянием Москвы. Мы должны принять эффективные меры безопасности, чтобы арестовать их и прекратить распространение их гнусного идеологического яда."
 HOL_mussert_guard:0 "Охрана Мусерт"
 HOL_mussert_guard_desc:0 "Как элита нашего движения, гвардия муссертов должна быть главным агентом воли лидера. Авангард нашего движения должен быть ярким примером светлого будущего, которое принесет наше национальное возрождение."
 HOL_military_youth:0 "Национальный бунт"
 HOL_military_youth_desc:0 "Наш лидер Антон Муссерт верит в молодежь, потому что она - наше будущее. Это будет первое поколение, очищенное от паразитов разума, которые [ENG.GetAdjective] Либеральный капитализм и [SOV.GetAdjective] Интернационалистский большевизм."
 HOL_influence_the_army:0 "Влияние на армию"
 HOL_influence_the_army_desc:0 "Мы должны обеспечить поддержку офицерского класса, если хотим реализовать наш проект и нашли Дитсленд."
 HOL_prepare_population_for_war:0 "Подготовьте население к войне"
 HOL_prepare_population_for_war_desc:0 "Наши идеологические враги ежедневно угрожают нам безнаказанностью. Мы должны ответить на эту угрозу и мобилизовать наш народ, чтобы укрепить его волю к борьбе и уничтожению врагов нашей национальной революции."
 HOL_unite_dietschland:0 "Объединяем Диетланд"
 HOL_unite_dietschland_desc:0 "Единство Дитсленда должно быть целью каждого. [HOL.GetAdjective] Человек! Нидерланды были разбиты, потому что мы не могли удержать свои позиции в Брюсселе и Антверпене во время борьбы с испанцами. Когда в 1815 году единство было восстановлено, франкоязычный буржуа предал нас и через несколько лет восстал. При этом они угнетали нас более века. Мы должны освободить Фландрию! Мы должны восстановить единство! Хоу-зи!"
 HOL_invade_luxembourg:0 "Оккупировать Люксембург"
 HOL_invade_luxembourg_desc:0 "Оккупировать Люксембург"
 HOL_fate_of_wallonia:0 "Судьба Валлонии"
 HOL_fate_of_wallonia_desc:0 "Судьба Валлонии"
 HOL_support_diets_fascists:0 "Соглашение с фашистами диет"
 HOL_support_diets_fascists_desc:0 "Если бы мы могли договориться с Вердинасо, партией, готовой объединить равнины так же, как и мы, мы могли бы без единого выстрела основать вторую по величине колониальную империю на Земле."
 HOL_armement_investments:0 "Инвестиции в вооружение"
 HOL_armement_investments_desc:0 "Только сильная военная промышленность позволит нам создать еще более сильную армию."
 HOL_nederlandse_arbeidsdienst:0 "Nederlandse Arbeidsdienst"
 HOL_nederlandse_arbeidsdienst_desc:0 "Мы должны мобилизовать рабочие секции против их воли, чтобы обеспечить продолжение производства, несмотря на ущерб, причиненный войной."
 HOL_defense_of_the_fatherland:0 "Защита Отечества"
 HOL_defense_of_the_fatherland_desc:0 "Ваша страна нуждается в вас!"
 HOL_claim_heritage_of_ruyter:0 "Утверждать наследие де Рюйтера"
 HOL_claim_heritage_of_ruyter_desc:0 "Адмирал Михиль де Рюйтер уничтожил британский флот во время голландского Золотого Века. Опять же, тот [ENG.GetAdjective] Нам угрожают, и пришло время новому великому адмиралу освободить море тирании Альбиона."
 HOL_join_axis:0 "Объединяйтесь с нацистами"
 HOL_join_axis_desc:0 "[GER.GetNameDefCap] Мы показали нам нашу идеологическую модель, поскольку наш народ тоже является частью германской семьи. Наши этнические и политические интересы совпадают с [GER.GetAdjective] Мы должны стремиться к полному сотрудничеству."
 HOL_german_military_coop:0 "Военное сотрудничество с государством [GER.GetNameDef]"
 HOL_german_military_coop_desc:0 "Чтобы обеспечить торжество нашего союза, мы должны просить о помощи. [GER.GetAdjective] специалистов для облегчения процесса модернизации."
 HOL_requirements_of_the_land_troops:0 "Требования сухопутных войск"
 HOL_requirements_of_the_land_troops_desc:0 "Много изменений нужно внести, чтобы наши войска были доведены до уровня наших соседей, так как оборонный бюджет с 1916 года был ниже армейских рекомендаций. Теперь, когда мы наконец-то можем заняться программой модернизации, мы должны оценить самые насущные потребности наших войск и соответствующим образом распределить наше финансирование."
 HOL_modernize_military_tactics:0 "Модернизация военной тактики"
 HOL_modernize_military_tactics_desc:0 "Несмотря на то, что многие виды оружия очень похожи на те, которые использовались во время Великой войны, эволюция некоторых видов вооружений, таких как самолеты и легкие танки, открыла новый тактический потенциал, который мы должны понять, если мы хотим эффективно действовать против этих потенциальных угроз."
 HOL_modernize_the_field_artillery:0 "Модернизация полевой артиллерии"
 HOL_modernize_the_field_artillery_desc:0 "Чтобы обеспечить достаточную огневую мощь, мы должны разработать более совершенные артиллерийские конструкции. Как единственный [HOL.GetAdjective] Производитель артиллерии, H.I.H. Логично, что он будет в авангарде этой программы."
 HOL_AT_guns:0 "Приобретение противотанковых пушек"
 HOL_AT_guns_desc:0 "Танки сыграли значительную роль в последних наступлениях 1918 года и постоянно модернизировались в последние годы. Поскольку призывник не может много сделать против брони с помощью простой винтовки, очень важно поддерживать нашу пехоту легкими артиллерийскими орудиями, предназначенными для прокалывания брони."
 HOL_modernize_the_infantry:0 "Модернизировать пехоту"
 HOL_modernize_the_infantry_desc:0 "Если мы хотим повысить боевую эффективность наших призывников, мы должны не только улучшить их подготовку, но и обеспечить их соответствующей техникой."
 HOL_bicycle_infantry:0 "Велосипедная пехота"
 HOL_bicycle_infantry_desc:0 "Велосипеды — наш любимый вид транспорта, который обеспечит пехоте столь необходимую мобильность."
 HOL_infantry_motorization:0 "Моторизация пехоты"
 HOL_infantry_motorization_desc:0 "Моторизация является важным шагом в модернизации вооруженных сил, поскольку она обеспечивает быстрое продвижение на территорию противника или быстрое развертывание, когда появляются пробелы на нашей или вражеской линии фронта."
 HOL_new_weapons_new_tactics:0 "Новое оружие, новая тактика"
 HOL_new_weapons_new_tactics_desc:0 "В последнее время появилось много новых видов техники, и мы должны адаптировать наши военные доктрины, чтобы использовать это новое оружие в полной мере."
 HOL_tanks:0 "бронетанковый корпус"
 HOL_tanks_desc:0 "В течение многих лет броня демонстрировала свою ценность как опорная платформа для пехоты или как копье в авангарде наземного наступления. Настало время развивать наш танковый корпус, чтобы довести столь необходимую дополнительную огневую мощь до линии фронта."
 HOL_convert_werkspoor_train_factory:0 "Переоборудовать железнодорожный завод Werkspoor"
 HOL_convert_werkspoor_train_factory_desc:0 "По всей Европе многие производители поездов были переоборудованы для выпуска бронетехники. Это неудивительно: ещё до переориентации они строили сложные стальные машины. Мы должны последовать их примеру и превратить завод Werkspoor в основу нашей программы танкостроения."
 HOL_thomassen_motor_factory:0 "Томассен Моторс Фабрика"
 HOL_thomassen_motor_factory_desc:0 "Расположенный недалеко от Арнема в Гелдерленде, мы должны мобилизовать завод Thomassen Motors для производства двигателей для наших грузовиков, танков и самолетов."
 HOL_ammunitions_production:0 "Производство боеприпасов"
 HOL_ammunitions_production_desc:0 "Наше производство оружия может быть ограничено, но мы все еще можем быстро производить дополнительные боеприпасы для снабжения наших войск."
 HOL_AA_needs:0 "Защита от воздушной угрозы"
 HOL_AA_needs_desc:0 "Страх полного уничтожения в результате интенсивных бомбардировок — это страх нашего времени. Массивные эскадрильи бомбардировщиков, вероятно, могли бы уничтожить армии и города. Мы должны вооружиться средствами для борьбы."
 HOL_private_support_of_AA_defenses:0 "Частная поддержка противовоздушной обороны"
 HOL_private_support_of_AA_defenses_desc:0 "Чтобы усилить нашу противовоздушную оборону, мы должны обратиться за поддержкой к частным компаниям, чтобы они могли внести свой вклад в приобретение зенитных батарей."
 HOL_coastal_defensive_line:0 "Береговая оборонительная линия"
 HOL_coastal_defensive_line_desc:0 "Чтобы защитить себя от угрозы [ENG.GetAdjective] Вторжение, мы должны создать оборону вдоль нашего побережья и подготовиться к встрече с врагом на наших пляжах, на наших дамбах и в наших портах."
 HOL_water_defensive_line:0 "Наш худший враг - наша лучшая защита."
 HOL_water_defensive_line_desc:0 "Вода – наш враг. Нам нужны дамбы, чтобы избежать разрушительных наводнений и вернуть больше земель с моря. Но в случае необходимости он также может стать нашим союзником. Мы можем создать прочную оборонительную линию, затопив критические районы страны и установив подготовленную оборону."
 HOL_military_modernization:0 "Военная модернизация"
 HOL_military_modernization_desc:0 "Мы должны поощрять сотрудничество между производителями и объединить наши промышленные возможности для изучения новых проектов и новых областей знаний. В результате технологического прорыва мы сможем значительно улучшить качество нашего оружия и, следовательно, наших военных."
 HOL_aviation_buildup:0 "Авиационная сборка"
 HOL_aviation_buildup_desc:0 "С угрозой новой войны, надвигающейся на горизонте, должны быть созданы современные военно-воздушные силы, чтобы гарантировать, что наше небо останется голубым. Надеемся, что мы сможем рассчитывать на то, что наши производители самолетов помогут нам в этом."
 HOL_small_airframes:0 "Малые планеры"
 HOL_small_airframes_desc:0 "Для защиты неба нашей страны мы должны сосредоточиться на разработке небольших планеров. Эти конструкции позволят создать небольшие маневренные самолеты для оснащения наших истребителей."
 HOL_large_airframes:0 "Большие планеры"
 HOL_large_airframes_desc:0 "Приоритетировав более крупные планеры, мы сможем разрабатывать самолеты с большей дальностью полета. Эта характеристика необходима, если мы хотим контролировать обширность нашей колониальной территории."
 HOL_develop_different_plane_types:0 "Дополнить предыдущие модели"
 HOL_develop_different_plane_types_desc:0 "Дополнить предыдущие модели."
 HOL_buy_planes_abroad:0 "Купить самолеты за границей"
 HOL_buy_planes_abroad_desc:0 "Поскольку наше производство ограничено, мы должны связаться с иностранными производителями, чтобы приобрести современные самолеты."
 HOL_licensed_planes:0 "Лицензированные самолеты"
 HOL_licensed_planes_desc:0 "Благодаря налаженным контактам с зарубежными производителями мы сможем получить более крупные лицензионные контракты, чтобы освободиться от необходимости непосредственно разрабатывать новые самолеты."
 HOL_aviation_industry:0 "Развивать авиационную промышленность"
 HOL_aviation_industry_desc:0 "Наши производители самолетов должны любой ценой повысить свою производительность, если мы хотим поставить достаточно самолетов в небо, чтобы противостоять вражеским угрозам."
 HOL_dogfight_competitions:0 "Конкурсы Dogfight"
 HOL_dogfight_competitions_desc:0 "В качестве способа обучения пилоты должны «подавлять» друг друга и участвовать в акробатических маневрах для победы. Они без колебаний будут использовать рискованную акробатику, чтобы победить в воздушном бою."
 HOL_standardize_the_designs:0 "Стандартизировать дизайн"
 HOL_standardize_the_designs_desc:0 "Стандартизировать дизайн"
 HOL_radar:0 "радар"
 HOL_radar_desc:0 "Знание – это форма власти. Зная, где находятся вражеские самолеты, вы не сможете сбить их, но знание того, где стрелять, значительно облегчит процесс."
 HOL_modern_air_doctrine:0 "Современная воздушная доктрина"
 HOL_modern_air_doctrine_desc:0 "Чтобы идти в ногу с новым революционным развитием в управлении авиаэскадроном и тактическом использовании авиации, мы должны переосмыслить наши представления о воздушной войне, чтобы превзойти наших противников."
 HOL_aviolanda_de_schelde_flyingboats:0 "Летающие катера De Schelde и De Aviolanda"
 HOL_aviolanda_de_schelde_flyingboats_desc:0 "Производитель самолетов Aviolanda и верфь De Schelde должны сотрудничать, чтобы строить самолеты, способные приземляться и взлетать на море, контролировать обширную территорию моря и передавать информацию военно-морскому флоту."
 HOL_naval_rearmement:0 "Перевооружение флота"
 HOL_naval_rearmement_desc:0 "Поскольку наш оборонный бюджет был сокращен за последние 20 лет, потребуются значительные усилия и сотрудничество крупнейших верфей страны для разработки новых классов кораблей и развертывания сил, готовых защищать нашу безопасность при использовании нашего истинного врага, моря."
 HOL_O19_class:0 "Развивайте O 19"
 HOL_O19_class_desc:0 "Чтобы дополнить наш подводный флот, мы должны добавить новый класс минных погружных аппаратов."
 HOL_O21_class:0 "Подводная лодка следующего поколения"
 HOL_O21_class_desc:0 "Подводная лодка следующего поколения"
 HOL_new_light_cruiser_class:0 "Модернизация дизайна легких крейсеров"
 HOL_new_light_cruiser_class_desc:0 "Модернизация дизайна легких крейсеров"
 HOL_new_destroyer_class:0 "Обсуждение эсминцы Blueprints"
 HOL_new_destroyer_class_desc:0 "Обсуждение эсминцы Blueprints"
 HOL_naval_doctrine:0 "Формирование военно-морской доктрины"
 HOL_naval_doctrine_desc:0 "Чтобы обеспечить координацию флота, мы должны убедиться, что все офицеры понимают доктрину, лежащую в основе наших военно-морских операций."
 HOL_replace_the_soerabaja:0 "Заменить Soerabaja"
 HOL_replace_the_soerabaja_desc:0 "На протяжении многих лет Soerabaja был флагманом Восточно-индийского флота. Но после мятежа 1930 года он потерял часть своего престижа, и по сегодняшним меркам он также стал устаревшим кораблем."
 HOL_modern_naval_tactics:0 "Современная морская тактика"
 HOL_modern_naval_tactics_desc:0 "Наша способность сражаться на море напрямую связана с возможностями наших капитанов. Поэтому они должны быть в курсе последних нововведений и прекрасно координировать свои действия."
 HOL_our_own_carrier:0 "Собственный перевозчик"
 HOL_our_own_carrier_desc:0 "Мы должны экспериментировать с авианосцами, чтобы привезти нашу авиацию с нашим флотом, не полагаясь на летающие лодки. Может быть, нам стоит начать программу, построив плоскую палубу на нефтяном танкере и переоборудовав ее в небольшой авианосец."
 HOL_increase_shipyards_production:0 "Увеличение производства судов"
 HOL_increase_shipyards_production_desc:0 "Чтобы обеспечить победу на море, необходимы дальнейшие инвестиции в наши верфи."
 HOL_marine_infantry:0 "Морская пехота"
 HOL_marine_infantry_desc:0 "Влияние военно-морского флота на море бесполезно, если его нельзя спроецировать вглубь страны. Поэтому отобранные люди должны быть отобраны и обучены для выполнения десантных вторжений и сопротивления до прибытия подкрепления."
 indonesian_nationalism_suppressed:0 "Подавление индонезийского национализма"
 netherlands.1.t:0 "У премьер-министра роман с немкой!"
 netherlands.1.desc:0 "В сегодняшнем выпуске газета заявила, что сам премьер-министр состоит в отношениях с немкой по имени Хелла Шульц. По словам источника, их видели вместе за ужином в Ницце, а несколько месяцев спустя они остановились в одном отеле в Лондоне. Кроме того, нидерландская служба государственной безопасности полагает, что, несмотря на официальную высылку из Германии, она может быть немецким агентом."
 netherlands.1.a:0 "Это было личное дело, и я помог ей уладить его в Аргентине."
 netherlands.1.b:0 "Всё отрицать!"
 netherlands.2.t:0 "Премьер-министр отказывается от коалиции с католиками"
 netherlands.2.desc:0 "В результате неожиданного поворота премьер-министр Хендрикус Колейн объявил, что не смог договориться с католической партией. Теперь правительство осталось в меньшинстве, и если в ближайшие дни переговоры не возобновятся, нынешний кабинет, вероятно, уйдёт в отставку."
 netherlands.2.a:0 "Продолжить переговоры."
 netherlands.2.b:0 "Мы не предадим своих избирателей."
 netherlands.3.t:0 "Премьер-министр высказывает пораженческие взгляды"
 netherlands.3.desc:0 "Сегодня Дирк Ян де Гер признался королеве, что считает страну обречённой. Правительство находится в изгнании, а шансы на победу в этой войне в лучшем случае ничтожны."
 netherlands.3.a:0 "Освобождение Нидерландов — наша единственная цель."
 netherlands.4.t:0 "Конкурс истребителей"
 netherlands.4.desc:0 "Недавнее исследование современного воздушного боя показало критическую слабость наших ВВС. Наши бойцы сильно отстают от событий в других странах. Министерство авиации инициировало программу крушения, чтобы как можно скорее приобрести современный истребитель. Так как отечественное развитие заняло бы недопустимое количество времени, было принято решение о приобретении лицензии за рубежом. Утвержден дополнительный бюджет.\n\nЭксперты расходятся во мнениях, какой тип самолета лучше всего подходит для модернизации наших крыльев истребителей."
 netherlands.4.a:0 "Легкий перехватчик, который будет построен Fokker или Koolhoven"
 netherlands.4.b:0 "Большой, тяжелый истребитель, который будет построен компанией Fokker."
 netherlands.5.t:0 "Конкурс лёгких истребителей"
 netherlands.5.desc_light_fighter:0 "Министерство обороны ищет новый лёгкий истребитель, который позволит защитить наше воздушное пространство. Министерство иностранных дел не возражает против проекта, но предлагает учитывать при выборе страны-поставщика также политические и дипломатические соображения."
 netherlands.5.desc_light_fighter_refused:0 "Сославшись на соображения национальной безопасности, [From.GetAdjective] правительство отказалось предоставить производственную лицензию. Возможно, в другой стране нам повезёт больше, либо в качестве временной меры можно попытаться модернизировать имеющиеся самолёты."
 netherlands.5.a:0 "Подход [GER.GetNameDef]."
 netherlands.5.b:0 "Обратиться к государству [ITA.GetNameDef]."
 netherlands.5.c:0 "Подход [FRA.GetNameDef]."
 netherlands.5.d:0 "Подход [ENG.GetNameDef]."
 netherlands.5.e:0 "Подход [USA.GetNameDef]."
 netherlands.5.f:0 "Использовать опыт конкурса для улучшения собственных самолётов."
 netherlands.6.t:0 "Конкурс тяжёлых истребителей"
 netherlands.6.desc_heavy_fighter:0 "Министерство авиации намерено приобрести новый тяжёлый истребитель для дальнего перехвата и сопровождения бомбардировщиков, однако Министерство иностранных дел предлагает учитывать при выборе страны-поставщика также политические и дипломатические соображения."
 netherlands.6.desc_heavy_fighter_refused:0 "Сославшись на соображения национальной безопасности, [From.GetAdjective] правительство отказалось предоставить производственную лицензию. Возможно, в другой стране нам повезёт больше, либо в качестве временной меры можно попытаться модернизировать имеющиеся самолёты."
 netherlands.7.t:0 "[From.GetAdjective] конкурс истребителей"
 netherlands.7.desc:0 "[From.GetAdjective] ВВС в настоящее время проводят испытания нового лёгкого истребителя. По словам нашего авиационного атташе, последняя модель нашей страны имеет все шансы победить. В ближайшее время ожидается официальный запрос от [From.GetAdjective] правительства. \n\nПредставители производителя решительно поддерживают продажу, однако существуют опасения за национальную безопасность, связанные с передачей самой современной техники иностранному государству. Следует ли разрешить эту сделку?"
 netherlands.7.a:0 "Безусловно."
 netherlands.7.b:0 "Мы не можем рисковать утечками."
 netherlands.8.desc:0 "[From.GetAdjective] ВВС в настоящее время проводят испытания нового тяжёлого истребителя. По словам нашего авиационного атташе, последняя модель нашей страны имеет все шансы победить. В ближайшее время ожидается официальный запрос от [From.GetAdjective] правительства. \n\nПредставители производителя решительно поддерживают продажу, однако существуют опасения за национальную безопасность, связанные с передачей самой современной техники иностранному государству. Следует ли разрешить эту сделку?"
 netherlands.9.t:0 "Конкурс истребителей завершён"
 netherlands.9.desc:0 "После переговоров с производителем и государственными чиновниками мы успешно получили лицензию на производство нового истребителя. Пример самолета уже прибыл для обучения механики по его обслуживанию, и в ближайшее время ожидается полный комплект чертежей и чертежей. Производство может начаться в любое время."
 netherlands.9.a:0 "Отлично."
 netherlands.10.t:0 "Конкурс бомбардировщиков"
 netherlands.10.desc:0 "Исследование, проведенное министерством авиации, показало, что наши ВВС плохо оснащены для поддержки армии. Удары с большой дальности и поддержка с близкого расстояния были определены как ключевые области, в которых мы испытываем критический дефицит. Правительство выделило деньги на программу крушения, чтобы приобрести современный бомбардировщик, но мы должны принять решение о том, какой самолет мы должны закупить."
 netherlands.10.a:0 "Небольшой бомбардировщик для непосредственной поддержки."
 netherlands.10.b:0 "Более крупный самолет с большей дальностью полета."
 netherlands.11.t:0 "Конкурс лёгких бомбардировщиков"
 netherlands.11.desc_cas:0 "Министерство авиации планирует приобрести новый легкий бомбардировщик для поддержки сухопутных войск, но министерство иностранных дел предложило, чтобы политические и дипломатические проблемы также сыграли свою роль в принятии решения о том, какую страну покупать."
 netherlands.11.desc_cas_refused:0 "Сославшись на соображения национальной безопасности, [From.GetAdjective] правительство отказалось предоставить производственную лицензию. Возможно, в другой стране нам повезёт больше, либо в качестве временной меры можно попытаться модернизировать имеющиеся самолёты."
 netherlands.11.a:0 "Подход [GER.GetNameDef]."
 netherlands.11.b:0 "Обратиться к государству [ITA.GetNameDef]."
 netherlands.11.c:0 "Подход [FRA.GetNameDef]."
 netherlands.11.d:0 "Подход [ENG.GetNameDef]."
 netherlands.11.e:0 "Подход [USA.GetNameDef]."
 netherlands.12.t:0 "Конкурс средних бомбардировщиков"
 netherlands.12.desc_tac:0 "Министерство авиации намерено приобрести новый средний бомбардировщик для дальнего воспрещения и тактических воздушных ударов, однако Министерство иностранных дел предлагает учитывать при выборе страны-поставщика также политические и дипломатические соображения."
 netherlands.12.desc_tac_refused:0 "Сославшись на соображения национальной безопасности, [From.GetAdjective] правительство отказалось предоставить производственную лицензию. Возможно, в другой стране нам повезёт больше, либо в качестве временной меры можно попытаться модернизировать имеющиеся самолёты."
 netherlands.12.a:0 "Подход [GER.GetNameDef]."
 netherlands.12.b:0 "Обратиться к государству [ITA.GetNameDef]."
 netherlands.12.c:0 "Подход [FRA.GetNameDef]."
 netherlands.12.d:0 "Подход [ENG.GetNameDef]."
 netherlands.12.e:0 "Подход [USA.GetNameDef]."
 netherlands.13.t:0 "[From.GetAdjective] конкурс бомбардировщиков"
 netherlands.13.desc:0 "[From.GetAdjective] ВВС в настоящее время проводят испытания нового лёгкого бомбардировщика. По словам нашего авиационного атташе, последняя модель нашей страны имеет все шансы победить. В ближайшее время ожидается официальный запрос от [From.GetAdjective] правительства.\n\nПредставители производителя решительно поддерживают продажу, однако существуют опасения за национальную безопасность, связанные с передачей самой современной техники иностранному государству. Следует ли разрешить эту сделку?"
 netherlands.13.a:0 "Покажем им наши проекты."
 netherlands.13.b:0 "Нас это не интересует."
 netherlands.14.t:0 "[From.GetAdjective] конкурс бомбардировщиков"
 netherlands.14.desc:0 "[From.GetAdjective] ВВС в настоящее время проводят испытания нового среднего бомбардировщика. По словам нашего авиационного атташе, последняя модель нашей страны имеет все шансы победить. В ближайшее время ожидается официальный запрос от [From.GetAdjective] правительства.\n\nПредставители производителя решительно поддерживают продажу, однако существуют опасения за национальную безопасность, связанные с передачей самой современной техники иностранному государству. Следует ли разрешить эту сделку?"
 netherlands.14.a:0 "Покажем им наши проекты."
 netherlands.14.b:0 "Нас это не интересует."
 netherlands.15.t:0 "Конкурс бомбардировщиков завершён"
 netherlands.15.desc:0 "После переговоров с производителем и государственными чиновниками мы успешно получили лицензию на производство нового бомбардировщика. Пример самолета уже прибыл для подготовки механиков по его обслуживанию, и в ближайшее время ожидается полный комплект чертежей и чертежей. Производство может начаться в любое время."
 netherlands.15.a:0 "Отлично."
 netherlands.16.t:0 "[HOL.GetNameDefCap] требует нашей защиты"
 netherlands.16.desc:0 "Представители [ENG.GetNameDef] связались с нашей дипломатической службой, чтобы выяснить, готовы ли мы встретиться и публично гарантировать их границы. Так мы ясно заявим о намерении защищать право малых стран от иностранных идеологических угроз."
 netherlands.16.a:0 "Это защитит свободу и торговлю с ценным партнёром."
 netherlands.16.b:0 "Нельзя давать пустых обещаний."
 netherlands.17.t:0 "[ENG.GetAdjective] правительство принимает наше предложение"
 netherlands.17.desc:0 "Переговоры между [ENG.GetAdjective] и [HOL.GetADjective] министрами иностранных дел успешно завершились подписанием официальной декларации, гарантирующей границы нашей страны. Этот документ закрепил нынешний нейтралитет как священный принцип."
 netherlands.17.a:0 "[ENG.GetNameDefCap] стоит с нами."
 netherlands.18.t:0 "[ENG.GetAdjective] правительство отказывается гарантировать нашу безопасность!"
 netherlands.18.desc:0 "Вчера в Лондоне состоялся саммит между [HOL.GetAdjective] и [ENG.GetAdjective] представителями, посвящённый возможной [ENG.GetAdjective] гарантии для [HOL.GetNameDef]. Надежды на готовность [ENG.GetAdjective] стороны защищать малые страны Европы и свободу их народов сменились разочарованием: встреча завершилась без ясной позиции [ENG.GetAdjective] правительства."
 netherlands.18.a:0 "Огромное разочарование."
 netherlands.19.t:0 "[HOL.GetNameDEfCap] требует нашей защиты"
 netherlands.19.desc:0 "Представители [HOL.GetNameDef] связались с нашей дипломатической службой, чтобы выяснить, готовы ли мы встретиться и публично гарантировать их границы. Так мы ясно заявим о намерении защищать право малых стран от иностранных идеологических угроз."
 netherlands.19.a:0 "Мы должны защищать права малых стран."
 netherlands.19.b:0 "Нельзя давать пустых обещаний."
 netherlands.20.t:0 "[FRA.GetNameDefCap] гарантирует наши границы"
 netherlands.20.desc:0 "Переговоры между [FRA.GetAdjective] и [HOL.GetAdjective] представителями успешно завершились подписанием официальной декларации, гарантирующей границы нашей страны."
 netherlands.20.a:0 "[FRA.GetNameDefCap] стоит рядом с нами."
 netherlands.21.t:0 "[FRA.GetAdjective] правительство отказывается гарантировать нашу безопасность!"
 netherlands.21.desc:0 "Вчера в Амстердаме состоялся саммит между [HOL.GetAdjective] и [FRA.GetAdjective] представителями, на котором обсуждались возможные гарантии. Однако соглашения достичь не удалось: [FRA.GetAdjective] посол ограничился расплывчатыми обещаниями."
 netherlands.21.a:0 "Огромное разочарование."
 netherlands.22.t:0 "[HOL.GetNameDefCap] хочет вступить в Таможенный союз Бенилюкса"
 netherlands.22.desc:0 "Пострадавшая от Великой депрессии сильнее соседей, [HOL.GetNameDef] рассматривает возможность укрепления связей с нами и преобразования [BEL.GetAdjective]-[LUX.GetAdjective] таможенного союза в Таможенный союз Бенилюкса."
 netherlands.22.a:0 "Это принесёт пользу всем!"
 netherlands.22.b:0 "Нам это не нужно."
 netherlands.23.t:0 "[BEL.GetAdjective] правительство одобряет наше предложение о свободной торговле!"
 netherlands.23.desc:0 "Стремясь улучшить экономическое положение после многолетних финансовых трудностей, [BEL.GetAdjective] правительство одобрило соглашение, превращающее таможенный союз между [BEL.GetNameDef] и [LUX.GetNameDef], созданный в 1921 году, в трёхсторонний торговый союз."
 netherlands.23.a:0 "Историческая возможность."
 netherlands.24.t:0 "[HOL.GetNameDefCap] вступает в наш таможенный союз с [BEL.GetNameDef]"
 netherlands.24.desc:0 "После переговоров с [BEL.GetAdjective] правительством [HOL.GetADjective] представители присоединились к нашему таможенному союзу с [BEL.GetNameDef] и сформировали Таможенный союз Бенилюкса."
 netherlands.24.a:0 "Это принесёт пользу всем!"
 netherlands.25.t:0 "[BEL.GetAdjective] правительство отвергает наше предложение о свободной торговле!"
 netherlands.25.desc:0 "Несмотря на все усилия и потенциальную выгоду для всех участников, [BEL.GetAdjective] правительство отказалось отменить пошлины на товары, пересекающие нашу границу."
 netherlands.25.a:0 "Позор."
 netherlands.26.t:0 "[HOL.GetAdjective] правительство обсуждает новую внешнюю политику!"
 netherlands.26.desc:0 "После провала переговоров с [BEL.GetNameDef] и [LUX.GetNameDef] стало ясно, что будущее [HOL.GetNameDEf] не связано с дальнейшим сближением с [BEL.GetNameDef]. Оказавшись в дипломатическом тупике, правительство должно искать новые возможности и переориентировать внешнюю политику."
 netherlands.26.a:0 "Мы должны полагаться на себя."
 netherlands.26.b:0 "Нужно попытаться заключить союз с [ENG.GetNameDef]."
 netherlands.27.t:0 "Королева реагирует на приход коммунистов к власти"
 netherlands.27.desc:0 "Хорошо известно, что рост коммунизма в стране глубоко тревожит королеву. Она справедливо считает эту идеологию несовместимой с наследственной властью дома Оранских-Нассау. Поэтому неудивительно, что распространяются слухи о её всё более серьёзных намерениях покинуть страну."
 netherlands.27.a:0 "Посмотрим."
 netherlands.27.b:0 "Установить за ней наблюдение."
 netherlands.28.t:0 "Королева отправляется в изгнание"
 netherlands.28.desc:0 "Королевы больше нет во дворце. Опасаясь разгневанных коммунистических толп, она тайно покинула страну при помощи реакционных сообщников."
 netherlands.28.a:0 "Монархия — последний пережиток феодализма."
 netherlands.29.t:0 "Вильгельмина арестована!"
 netherlands.29.desc:0 "При попытке покинуть страну Вильгельмина Оранская-Нассау была схвачена агентами, верными коммунистической партии. Её быстро арестовали и заключили в тюрьму как главного лидера прежнего коррумпированного капиталистического режима."
 netherlands.29.a:0 "Да здравствует революция!"
 netherlands.30.t:0 "Бригада Зварте присоединяется к борьбе!"
 netherlands.30.desc:0 "Фламандские фашисты, готовые поддержать нашу борьбу, поднялись в Антверпене и Генте. Ходят слухи, что наши партизаны уже закрепили центральную станцию и пытаются обезопасить весь центр города. Мы надеемся, что они быстро защитят казармы. Тем временем в Генте на рассвете была атакована ратуша, и в недавнем докладе было объявлено, что флаг Вердинасо и наш флаг летают вместе на вершине замка графов Фландрии."
 netherlands.30.a:0 "Хоу зее!"
 netherlands.31.t:0 "Бригада Зварте восстает в Генте и Антверпене!"
 netherlands.31.desc:0 "Фламандские предатели, готовые объединить Фландрию и Нидерланды для формирования так называемой «Дитландии», организовали вооруженное восстание в Антверпене и Генте. Ходят слухи, что они уже закрепили центральную станцию и что чернокожие ополченцы пытаются взять под контроль весь центр города. Еще более тревожно, что мы не смогли пообщаться с гарнизоном фортов, окружающих город. Тем временем в Генте они заняли ратушу и множество других жизненно важных мест."
 netherlands.31.a:0 "Эти предатели будут уничтожены!"
 netherlands.32.t:0 "Судьба Валлонии"
 netherlands.32.desc:0 "Мы наконец установили контроль над Нижними землями, но это господство лишь внешнее. Валлоны опасаются за право говорить на своём языке. Если их политики откажутся поддержать объединение Нижних земель под нашей властью, это может вновь создать условия для бельгийского восстания, подобного событиям 1830 года."
 netherlands.32.a:0 "Поставим в брюссельской опере «Марию Бургундскую»."
 netherlands.32.b:0 "Предоставить валлонам некоторую автономию."
 netherlands.33.t:0 "[HOL.GetNameDef] просит передать ей Фландрию"
 netherlands.33.desc:0 "Стремясь воплотить идею великого нидерландского единства, [HOL.GetLeader] официально потребовал передать контроль над бывшей бельгийской территорией Фландрии, которую считает неотъемлемой частью своей страны."
 netherlands.33.a:0 "Раз они этого хотят."
 netherlands.33.b:0 "Нет! Она наша."
 netherlands.34.t:0 "Фландрия возвращена!"
 netherlands.34.desc:0 "Наше непревзойдённое дипломатическое мастерство привело к освобождению Фландрии, веками угнетавшейся испанцами, австрийцами, французами и бельгийцами."
 netherlands.34.a:0 "Хоу зее!"
 netherlands.35.t:0 "Упущенная возможность"
 netherlands.35.desc:0 "Несмотря на все усилия, наши попытки добиться возвращения Фландрии и наконец дипломатически объединить Дитсланд были отвергнуты."
 netherlands.35.a:0 "История докажет нашу правоту!"
 netherlands.36.t:0 "[HOL.GetLeader] Предлагает пакт"
 netherlands.36.desc:0 "Признав превосходство наших танковых проектов, [From.GetNameDef] предложила поделиться ими, чтобы стать оплотом коммунизма в Западной Европе."
 netherlands.36.a:0 "Принять."
 netherlands.36.b:0 "Откажитесь."
 tdlra.1.t:0 "[From.GetNameDefCap] хочет, чтобы мы вступили в Бенилюкс"
 tdlra.1.d:0 "[From.GetNameDefCap] стремится укрепить свой альянс, пригласив нас присоединиться."
 tdlra.1.a:0 "Принять."
 tdlra.1.b:0 "Отказаться."
 tdlra.2.t:0 "[From.GetNameDefCap] отказывается"
 tdlra.2.d:0 "К сожалению, [From.GetNameDefCap] отвергла наше предложение о союзе."
 tdlra.2.a:0 "Они должны вступить, так или иначе!"
 tdlra.3.t:0 "[From.GetNameDefCap] принимает предложение!"
 tdlra.3.d:0 "[From.GetNameDefCap] приняла наше предложение о союзе и теперь входит в [Root.GetFactionName]."
 tdlra.3.a:0 "Отличные новости."
 tdlra.4.t:0 "[From.GetNameDefCap] предлагает пакт"
 tdlra.4.d:0 "Признав превосходство наших танковых проектов, [From.GetNameDef] предложила поделиться ими, чтобы стать оплотом коммунизма в Западной Европе."
 tdlra.4.a:0 "Принять."
 tdlra.4.b:0 "Отказаться."
 tdlra.5.t:0 "[From.GetNameDefCap] принимает предложенный нами пакт"
 tdlra.5.d:0 "Признав наше стратегическое значение в центре Западной Европы, [From.GetNameDef] передала нам технологически более совершенные проекты танков для защиты от внешнего вмешательства."
 tdlra.5.a:0 "Приступить к работе над новыми проектами."
 tdlra.6.t:0 "[From.GetNameDefCap] отвергает предложенный нами пакт!"
 tdlra.6.d:0 "[From.GetNameDefCap] не подписала предложенный пакт, который усилил бы наши бронетанковые возможности. Придётся справляться самостоятельно!"
 tdlra.6.a:0 "Да будет так."
 tdlra.8.t:0 "Нидерланды хотят вступить в [Root.GetFactionName]"
 tdlra.8.d:0 "Понимая, что они не смогут сдержать [GER.GetAdjective] агрессию, [From.GetNameDef] опасается скорого вторжения и просит нашей защиты."
 tdlra.8.a:0 "Принять."
 tdlra.8.b:0 "Отказаться."
 tdlra.9.t:0 "[From.GetNameDefCap] принимает предложение"
 tdlra.9.d:0 "[ENG.GetAdjective] правительство, понимая стратегическое значение Бенилюкса в войне против [GER.GetNameDef], решило распространить защиту на нашу страну."
 tdlra.9.a:0 "Отличные новости!"
 tdlra.10.t:0 "[From.GetNameDefCap] отказывается"
 tdlra.10.d:0 "[ENG.GetAdjective] сторона не считает Бенилюкс необходимым и не собирается защищать нас от вражеского вторжения."
 tdlra.10.a:0 "Проклятые британцы!"
 tdlra.11.t:0 "Начать процесс депилларизации"
 tdlra.11.d:0 "В столь бурные времена нам не нужна разделённая на столпы общественная система. Разрушение этих столпов необходимо для укрепления государства."
 tdlra.11.a:0 "Начать процесс."
 HOL_develop_different_plane_types_tooltip:0 "Эффект зависит от предыдущего фокуса. Если вы выбрали для приоритета небольшие планеры, вы будете вознаграждены. §G- 50% технологическое сокращение§!  то  §YТяжелые истребители§!  и §G-25%-ное сокращение технологий§!  то §YБомбардировщики ближней воздушной поддержки§! . С другой стороны, если вы решили расставить приоритеты в больших планерах, вы будете вознаграждены.  §G- 50% технологическое сокращение§!  для  §Yбойцы§!  и §G-25%-ное сокращение технологий§!  для  §YМорские бомбардировщики§! ."
 HOL_fietsinfanterie_tooltip:0 "Получить небольшое подразделение велосипедной пехоты\n"
 FLA_fascist_rebels_tooltip:0 "В случае успеха решение позволит приказать §Yфламандским фашистам§! поднять восстание после §Yобъявления войны§! за 30£command_power."
 HOL_infantry_equipment_0:0 "Манлихер обр. 1895"
 HOL_infantry_equipment_0_short:0 "Манлихер обр. 1895"
 HOL_gw_tank_equipment:0 "Carden Loyd Mk.VI"
 HOL_gw_tank_equipment_short:0 "V-CL Mk.VI"
 HOL_gw_tank_equipment_desc:0 "Королевская армия Нидерландов располагала лишь горсткой устаревших или изношенных бронеавтомобилей, двенадцатью отличными шестиколёсными бронемашинами DAF M39 и пятью танкетками Carden Loyd Mark VI, названными Lynx, Poema, Jaguar, Panter и Luipaard."
 HOL_light_tank_equipment_1:0 "Pantservoertuig 1"
 HOL_light_tank_equipment_1_short:0 "PVT-1"
 HOL_light_tank_equipment_1_desc:0 "Королевская армия Нидерландской Ост-Индии использовала всего 22 лёгких танка Vickers Mk.IV."
 HOL_light_tank_destroyer_equipment_2:0 "Tankjager 2"
 HOL_light_tank_destroyer_equipment_2_short:0 "TJ-2"
 HOL_light_tank_destroyer_equipment_2_desc:0 "Для своего времени DAF M39 был современным проектом с цельносварным несущим корпусом и широким применением наклонной брони. Башня с довольно мощной 37-мм пушкой производилась шведской компанией Landsverk. Машина была легко бронирована, сравнительно быстра и обладала хорошей проходимостью."
 HOL_light_tank_equipment_2:0 "Pantservoertuig 2"
 HOL_light_tank_equipment_2_short:0 "PVT-2"
 HOL_light_tank_equipment_2_desc:0 "Компания Marmon-Herrington начала проект CTMS-1TB1 для создания трёхместного лёгкого танка для нидерландской армии. Машина вооружалась 37-мм автоматической пушкой и спаренным пулемётом M1919. Изначально планировалось отправить 600 танков в Нидерландскую Ост-Индию, но кампания завершилась слишком рано, и даже прототипы не успели доставить."
 HOL_light_tank_aa_equipment_3:0 "Braat AA"
 HOL_light_tank_aa_equipment_3_short:0 "Braat AA"
 HOL_light_tank_aa_equipment_3_desc:0 "Зенитная пушка, установленная на шасси Braat Overvalwagen."
 HOL_medium_tank_equipment_1:0 "Gevechtstank 3"
 HOL_medium_tank_equipment_1_short:0 "GVT-3"
 HOL_medium_tank_equipment_1_desc:0 "Проект MTLS-1G14 начался одновременно с CTMS-1TB1 и предусматривал четырёхместный средний танк для нидерландской армии. Он вооружался двумя 37-мм автоматическими пушками и пятью пулемётами M1919: три размещались в корпусе, один был спаренным, ещё один — на крыше башни. Броня крепилась болтами и имела толщину 13–38 мм."
 HOL_CAS_equipment_1:0 "Фоккер C.X"
 HOL_CAS_equipment_1_short:0 "Фоккер C.X"
 HOL_CAS_equipment_1_desc:0 "Fokker C.X изначально создавался для Королевской армии Нидерландской Ост-Индии как замена Fokker C.V. Как и все самолёты Fokker того времени, он имел смешанную конструкцию: деревянный силовой набор крыла, сварную раму из стальных труб, алюминиевую обшивку носовой части и полотняную — хвостовой. Прототип 1934 года оснащался двигателем Rolls-Royce Kestrel V."
 HOL_CAS_equipment_2:0 "Дуглас 8А-3Н"
 HOL_CAS_equipment_2_short:0 "8А-3Н"
 HOL_CAS_equipment_2_desc:0 "Из-за нехватки вооружения во время немецкого вторжения эти самолёты использовались как истребители. Они понесли ужасные потери, а немецкая воздушно-десантная операция, охватившая одну из их баз — Окенбург, — привела к полной потере всех 8A-3N."
 HOL_cv_CAS_equipment_1:0 "Fokker C.X-cv"
 HOL_cv_CAS_equipment_1_short:0 "Fokker C.X-cv"
 HOL_fighter_equipment_0:0 "Фоккер D.XVII"
 HOL_fighter_equipment_0_short:0 "Фоккер D.XVII"
 HOL_fighter_equipment_0_desc:0 "Большинство F.K.51 использовалось в Нидерландах как учебные самолёты начальной подготовки или служило в разведке Королевских ВВС Нидерландской Ост-Индии. Несмотря на нидерландское эмбарго на продажу оружия обеим сторонам гражданской войны в Испании, двадцать восемь машин тайно продали республиканскому правительству."
 HOL_fighter_equipment_1:0 "Фоккер D.XXI"
 HOL_fighter_equipment_1_short:0 "Фоккер D.XXI"
 HOL_fighter_equipment_1_desc:0 "При поступлении на вооружение D.XXI стал огромным шагом вперёд для армейской авиации Нидерландов, чьи истребительные силы состояли из устаревших бипланов с открытыми кабинами. Новый Fokker быстро показал исключительную прочность и мог развивать до 700 км/ч в пикировании. Несколько финских D.XXI заявили почти двести воздушных побед над советской авиацией в двух советско-финских войнах."
 HOL_fighter_equipment_2:0 "Кулховен F.K.58"
 HOL_fighter_equipment_2_short:0 "F.K. 58"
 HOL_fighter_equipment_2_desc:0 "Koolhoven F.K.58 был одномоторным истребителем-перехватчиком, разработанным и в основном производившимся компанией NV Koolhoven в Нидерландах по французскому заказу. Предназначенный для Armée de l'Air, F.K.58 ограниченно применялся в битве за Францию."
 HOL_fighter_equipment_3:0 "«Фоккер» D.XXX"
 HOL_fighter_equipment_3_short:0 "«Фоккер» D.XXX"
 HOL_fighter_equipment_3_desc:0 "Последний проект Koolhoven представлял собой многоцелевой истребитель-бомбардировщик для морской авиации таких стран, как Португалия, Швеция и Норвегия. Заказов не последовало, а разработку прервала операция «Гельб»."
 HOL_cv_fighter_equipment_0:0 "Fokker D.XVII"
 HOL_cv_fighter_equipment_0_short:0 "Fokker D.XVII"
 HOL_cv_fighter_equipment_0_desc:0 "D.XVII был нидерландским бипланом компании Fokker. Прототип оснащался безнаддувным двигателем Curtiss Conqueror мощностью свыше 500 л. с. Более позднюю модель оборудовали Rolls-Royce Kestrel мощностью 600 л. с., также планировался вариант с Hispano-Suiza Xbre. 18 января 1935 года самолёт установил нидерландский рекорд высоты."
 HOL_cv_fighter_equipment_1:0 "Fokker D.XXI-cv"
 HOL_cv_fighter_equipment_1_short:0 "Fokker D.XXI-cv"
 HOL_cv_fighter_equipment_2:0 "Кулховен F.K.58C"
 HOL_cv_fighter_equipment_2_short:0 "F.K.58C"
 HOL_cv_fighter_equipment_3:0 "Buffalo 339-23"
 HOL_cv_fighter_equipment_3_short:0 "B-339-23"
 HOL_cv_fighter_equipment_3_desc:0 "Самолёты Brewster B-339, использовавшиеся ML-KNIL, были легче модифицированных B-339E Brewster Mark I других ВВС Союзников, поэтому могли успешно сражаться с японцами. В одном крупном бою восемь нидерландских Brewster перехватили около 35 японских бомбардировщиков под прикрытием примерно 20 Zero. Они уничтожили 11 японских самолётов, потеряв четыре машины и двух пилотов."
 HOL_jet_fighter_equipment_1:0 "Глостер Метеор F.4"
 HOL_jet_fighter_equipment_1_short:0 "Метеор F.4"
 HOL_jet_fighter_equipment_2:0 "Fokker S.14"
 HOL_jet_fighter_equipment_2_short:0 "Fokker S.14"
 HOL_jet_fighter_equipment_2_desc:0 "S.14 отличался коротким широким фюзеляжем и слегка сужающимися крыльями, за что быстро получил прозвище «Доска». Однако все пилоты хвалили его превосходные лётные характеристики."
 HOL_nav_bomber_equipment_1:0 "Фоккер T.IVa"
 HOL_nav_bomber_equipment_1_short:0 "Фоккер T.IVa"
 HOL_nav_bomber_equipment_1_desc:0 "Fokker T.IV разработали по требованиям Королевского флота Нидерландов как морской патрульный самолёт и торпедоносец для Нидерландской Ост-Индии. Он мог нести торпеду или 800 кг бомб и имел оборонительное вооружение из трёх пулемётов в носовой, верхней и нижней установках."
 HOL_nav_bomber_equipment_2:0 "Фоккер T.VIII"
 HOL_nav_bomber_equipment_2_short:0 "Фоккер T.VIII"
 HOL_nav_bomber_equipment_2_desc:0 "Fokker C.XI был разведывательным гидросамолётом для эксплуатации с военных кораблей. После успешных испытаний катапультного запуска его заказали для крейсеров HNLMS Tromp и HNLMS De Ruyter в европейских водах, но большинство самолётов отправили в Нидерландскую Ост-Индию."
 HOL_nav_bomber_equipment_3:0 "«Кольховен» F.K.65"
 HOL_nav_bomber_equipment_3_short:0 "«Кольховен» F.K.65"
 HOL_nav_bomber_equipment_3_desc:0 "Fokker T.VIII был нидерландским двухмоторным торпедоносцем и разведывательным поплавковым самолётом, служившим в нидерландских, британских и немецких ВВС. Его разработали по запросу нидерландской морской авиации для действий в домашних водах и Нидерландской Ост-Индии."
 HOL_cv_nav_bomber_equipment_1:0 "Koolhoven F.K.52C"
 HOL_cv_nav_bomber_equipment_1_short:0 "F.K.52C"
 HOL_cv_nav_bomber_equipment_1_desc:0 "Во время Зимней войны шведский граф Карл Густав фон Розен приобрёл два F.K.52 и передал их финским ВВС. Самолёты прибыли в Финляндию 18 января 1940 года, а через два месяца бомбили и обстреливали советские войска, наступавшие по льду к Виролахти. Нидерландское правительство в Лондоне заказало F.K.52 для ВВС Ост-Индии; машины отправили в США, но до колонии они так и не дошли."
 HOL_cv_nav_bomber_equipment_2:0 "Fokker C.XI"
 HOL_cv_nav_bomber_equipment_2_short:0 "Fokker C.XI"
 HOL_cv_nav_bomber_equipment_3:0 "Fokker T.VIII"
 HOL_cv_nav_bomber_equipment_3_short:0 "Fokker T.VIII"
 HOL_heavy_fighter_equipment_1:0 "Фоккер G.1"
 HOL_heavy_fighter_equipment_1_short:0 "Фоккер G.1"
 HOL_heavy_fighter_equipment_1_desc:0 "Fokker G.1 был тяжёлым двухмоторным истребителем революционной конструкции: двухбалочный фюзеляж и восемь носовых пулемётов. Помимо нидерландских ВВС, им заинтересовались несколько иностранных государств как истребителем и пикирующим бомбардировщиком. Прототип получил гидравлические воздушные тормоза под крыльями для проверки в роли пикировщика. Испытания показали, что G.1 способен пикировать со скоростью свыше 644 км/ч."
 HOL_heavy_fighter_equipment_2:0 "Фоккер D.XXIII"
 HOL_heavy_fighter_equipment_2_short:0 "Фоккер D.XXIII"
 HOL_heavy_fighter_equipment_2_desc:0 "Fokker D.XXIII проектировался как двухмоторный одноместный самолёт. Чтобы избежать проблем асимметричного полёта, он получил тянущий двигатель спереди и толкающий сзади. Это был свободнонесущий моноплан с двухкилевым оперением на балках. Закрытая кабина пилота находилась между двигателями, а шасси было убираемым трёхопорным."
 HOL_heavy_fighter_equipment_3:0 "Фоккер G.3"
 HOL_heavy_fighter_equipment_3_short:0 "Фоккер G.3"
 HOL_heavy_fighter_equipment_3_desc:0 "Об этом проекте и первоначальном G.2 известно мало, поскольку разработку прервало вторжение в Нидерланды."
 HOL_tac_bomber_equipment_0:0 "Фоккер C.V D/E"
 HOL_tac_bomber_equipment_0_short:0 "Фоккер C.V D/E"
 HOL_tac_bomber_equipment_0_desc:0 "Fokker C.V был нидерландским лёгким разведывательным бипланом-бомбардировщиком производства Fokker. Он выпускался в различных вариантах: заказчик мог выбрать одну из пяти конструкций крыла с разным размахом. Радиальные двигатели развивали 336–723 кВт, или 451–970 л. с., а колёсное шасси можно было заменить поплавками."
 HOL_tac_bomber_equipment_1:0 "Фоккер T.V"
 HOL_tac_bomber_equipment_1_short:0 "Фоккер T.V"
 HOL_tac_bomber_equipment_1_desc:0 "Самолёт создавался как многоцелевой «luchtkruiser» — воздушный крейсер, предназначенный прежде всего для перехвата и уничтожения соединений вражеских бомбардировщиков, а во вторую очередь — для дальних бомбардировок. Из-за отсутствия протектированных топливных баков T.V быстро загорался при попаданиях."
 HOL_tac_bomber_equipment_2:0 "Фоккер T.IX"
 HOL_tac_bomber_equipment_2_short:0 "Фоккер T.IX"
 HOL_tac_bomber_equipment_2_desc:0 "Fokker T.IX был нидерландским двухмоторным бомбардировщиком, разработанным компанией Fokker для ВВС Королевской армии Нидерландской Ост-Индии как замена устаревшим бомбардировщикам Martin. Немецкое вторжение в Нидерланды остановило дальнейшую разработку."
 HOL_strat_bomber_equipment_1:0 "Фоккер Т.В."
 HOL_strat_bomber_equipment_1_short:0 "Фоккер Т.В."
 HOL_strat_bomber_equipment_1_desc:0 "С августа 1934 по февраль 1935 года велась работа над «Ontwerp 115» — проектом дальнего тяжёлого бомбардировщика, получившего обозначение T.VI. Неясно, для кого он предназначался. Нейтральным Нидерландам подобный самолёт едва ли был нужен. Проект так и не построили."
 HOL_transport_plane_equipment_1:0 "Fokker F.XX"
 HOL_transport_plane_equipment_1_short:0 "Fokker F.XX"
 HOL_carrier_1:0 "Класс Rapana"
