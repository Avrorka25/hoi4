 HOL_abandon_the_gold_standard_not_MTG:0 "Откажитесь от золотого стандарта"
 HOL_abandon_the_gold_standard_not_MTG_desc:0 "Нидерланды были одной из последних стран, сохранивших золотой стандарт. Несмотря на то, что она избежала инфляции, отсутствие денежной массы задушило экономику и в сочетании с экономическим кризисом вызвало рекордный уровень безработицы."
 HOL_finish_the_noordoostpolder_not_MTG:0 "Завершить Noordoostpolder"
 HOL_finish_the_noordoostpolder_not_MTG_desc:0 "Начавшийся в 1936 году процесс полдеризации района Июссельмера рядом с провинцией Оверэйссел, наконец, близок к завершению. Но даже если процесс будет завершен, это все равно будут неиспользуемые земли, которые нужно осваивать и эксплуатировать."
 HOL_finish_the_twentekanaal:0 "Завершить канал Твенте"
 HOL_finish_the_twentekanaal_desc:0 "Завершение канала Твенте необходимо для соединения частей Гелдерланда с Оверэйсселом. Этот проект расширит торговлю между жизненно важными регионами нашей страны."
 r56_HOL_daf_pantrado:0 "DAF Pantrado 3"
 r56_HOL_daf_pantrado_desc:0 "Pantrado 3, основанный на конструкции подвески грузовика Trado, станет современным бронеавтомобилем и заменит наши машины иностранного производства."
 r56_HOL_reorganize_the_engineer_regiment:0 "Реорганизовать инженерный полк"
 r56_HOL_reorganize_the_engineer_regiment_desc:0 "Реорганизация инженерного полка позволит лучше подготовить его к будущим боям в следующей войне."
 r56_HOL_van_kinsbergen:0 "Заказать проект Van Kinsbergen"
 r56_HOL_van_kinsbergen_desc:0 "Van Kinsbergen — уникальный шлюп, построенный для защиты наших конвоев от подводных лодок враждебных стран."
