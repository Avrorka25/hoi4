 HOL_dutch_plane_requirements_list:0 "Список требований к [HOL.GetAdjective] самолётам"
 HOL_red_volunteers:0 "Красные добровольцы"
 HOL_red_volunteers_desc:0 "Чтобы способствовать делу мировой революции и пролетарского интернационализма, мы должны быть готовы помочь всем коммунистическим движениям по всему миру. Создание самоотверженных добровольческих сил для развертывания и борьбы за рабочий класс в чужих странах было бы хорошим шагом."
