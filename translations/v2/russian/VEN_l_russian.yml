 VEN_order_bombers_in_ENG:0 "Заказать [ENG.GetAdjective] бомбардировщики"
 VEN_national_development_category:0 "Национальное развитие"
 VEN_national_development_category_desc:0 "[VEN.GetAdjective] экономика уже долго находится в плохом состоянии. Финансируемая правительством комиссия определит наиболее нуждающиеся отрасли и распределит средства, заложив основу роста промышленного потенциала."
