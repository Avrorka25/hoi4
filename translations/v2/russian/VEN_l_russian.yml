 VEN_fuerzas_venezolanas_del_interior:0 "ВВС"
 VEN_fuerzas_venezolanas_del_interior_2:0 "Преследование коллаборационистов"
 VEN_GNB_idea:0 "НБГ"
 VEN_GNB_idea_desc:0 "НБГ — национальная гвардия [ROOT.GetNameDef], играющая ключевую роль в гражданской обороне. При необходимости она также служит резервной пехотой."
 VEN_abc_islands_desc:0 "Острова АБК лежат у наших берегов и по всем признакам должны принадлежать нам. Их географическая близость делает это естественным, а кроме того, почти вся наша нефть перерабатывается именно там, что делает острова крайне важными для экономики."
 VEN_border_conflicts:0 "Северные операции"
 VEN_border_conflicts_desc:0 "Острова у наших берегов по всем признакам должны принадлежать нам и имеют огромное политическое и экономическое значение. На фоне растущей мировой напряжённости, возможно, настало время вновь подкрепить наши притязания..."
 VEN_claim_curacao_decision:0 "Усилить притязания на Кюрасао"
 VEN_claim_trinidad_decision:0 "Усилить притязания на Тринидад"
 VEN_curacao_border_war_start:0 "Операция «Гома»"
 VEN_trinidad_border_war_start:0 "Операция «Энсендедор»"
 VEN_curacao_core:0 "Предоставить Кюрасао статус штата"
 VEN_curacao_core_timer:0 "Предоставить Кюрасао статус штата"
 VEN_weapons_purchases_category:1 "Закупка вооружения"
 VEN_weapons_purchases_category_desc:0 "Пока наша промышленность пытается наверстать отставание, закупки современного оружия за рубежом могут быть единственным способом привести вооружённые силы к современным стандартам."
 VEN_order_weapons_in_CZE:0 "Заказать [CZE.GetAdjective] стрелковое оружие"
 VEN_order_support_equipment_in_CZE:0 "Заказать [CZE.GetAdjective] вспомогательное снаряжение"
 VEN_order_artillery_in_CZE:0 "Заказать [CZE.GetAdjective] артиллерию"
