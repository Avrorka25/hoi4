 VEN_paramilitarism_buff2:0 "[VEN.GetAdjective] парамилитаризм"
 VEN_military_disloyalty:0 "Нелояльность военных"
 VEN_military_disloyalty_desc:0 "Значительная часть генерального штаба по-прежнему верна старым порядкам Хуана Гомеса, и обещания возвращения к демократии поддерживают далеко не все."
 VEN_military_disloyalty2:0 "Обеспеченная верность военных"
