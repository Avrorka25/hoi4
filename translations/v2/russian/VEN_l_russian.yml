 POLITICS_ELEAZAR_LOPEZ_CONTRERAS_DESC:0 "Элеасар Лопес Контрерас родился 5 мая 1883 года в Кеникее. Его первым наставником был дядя, священник Фернандо Мария Контрерас. Когда Элеасару было три месяца, его отец умер в Кукуте от жёлтой лихорадки, и Фернандо Контрерас взял семью под опеку. В пятнадцать лет Элеасар получил степень бакалавра философии и словесности в колледже Святейшего Сердца Иисуса. Изначально он собирался изучать медицину, но вместо этого занялся политикой и в итоге поддержал переворот 1899 года под руководством Хуана Висенте Гомеса.\n\nВ 1919 году его назначили директором военного управления Министерства войны и флота, где он заслужил похвалу за административные и организаторские способности. В 1923 году он получил звание бригадного генерала и должность начальника гарнизона Каракаса. В 1928 году Элеасару поручили подавить восстание Альварадо, возглавленное левыми активистами и студентами. После разгрома мятежников и возвращения в Каракас Хуан Висенте Гомес лично назначил его временным начальником Генерального штаба.\n\nХуан Висенте Гомес умер 17 декабря 1935 года, после чего Элеасару поручили исполнять обязанности президента Республики. В последующие дни он сумел подавить кратковременное восстание родственников Гомеса."
 VEN_AI_BEHAVIOR:0 "@VEN Венесуэла"
 RULE_OPTION_NEUTRALITY_VEN_HISTORICAL:0 "Нейтральный Контрерас — исторический"
 RULE_OPTION_NEUTRALITY_HISTORICAL_VEN_AI_DESC:0 "Историческое поведение Венесуэлы. Элеазар Лопес Контрерас будет избран президентом Венесуэлы и будет проводить политику нейтралитета."
 RULE_OPTION_NEUTRALITY_VEN_ALTERNATE:0 "Нейтральный Ангарита"
 RULE_OPTION_NEUTRALITY_ALTERNATE_VEN_AI_DESC:0 "Исайас Медина Ангарита будет избран президентом и станет придерживаться политики нейтралитета."
 RULE_OPTION_DEMOCRATIC_VEN_AI_DESC:0 "Ромуло Гальегос будет избран президентом Венесуэлы и попытается вступить в Союзники."
 RULE_OPTION_FASCIST_VEN_AI_DESC:0 "Маркос Перес Хименес совершит переворот, станет президентом Венесуэлы, попытается вступить в Ось и возродить Великую Колумбию."
 RULE_OPTION_COMMUNIST_VEN_AI_DESC:0 "АРДИ будет реорганизована и начнёт Второе восстание Альварадо, которое приведёт к приходу коммунистов к власти и попытке заключить союз с Советским Союзом."
 RULE_DEMOCRATIC_ALTERNATE_VEN_AI_DESC:0 "АРДИ будет реорганизована и начнёт Второе восстание Альварадо, после чего будет испытана боливарианская социалистическая теория и проведены социал-демократические реформы."
 RULE_OPTION_VEN_ANCAPISTAN:0 "Креольский анархо-капитализм"
 RULE_OPTION_ANCAPISTAN_VEN_AI_DESC:0 "АРДИ будет реорганизована и начнёт Второе восстание Альварадо, которое приведёт к силовому захвату власти креолами и установлению анархо-капиталистической модели."
