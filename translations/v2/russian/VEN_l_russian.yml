 venezuela.1.t:0 "[VEN.GetNameDefCap] усиливает притязания на Кюрасао"
 venezuela.1.d:0 "Сегодня [VEN.GetAdjective] лидер [VEN.GetLeader] ясно заявил, что остров Кюрасао, расположенный всего в 60 км от побережья Венесуэлы, по праву является частью страны и должен быть возвращён, даже силой.\n\nЭто может стать оправданием вторжения на остров, поэтому необходимо готовиться к худшему."
 venezuela.1.a:0 "Нужно что-то предпринять."
 venezuela.2.t:0 "Победа [VEN.GetName] на Кюрасао"
 venezuela.2.d:0 "После ожесточённых боёв [VEN.GetAdjective] войска успешно высадились на Кюрасао и разгромили [695.Owner.getAdjective] защитников, а затем захватили столицу Виллемстад.\n\nХотя это может привести к более крупному региональному конфликту, остров теперь прочно находится в руках Венесуэлы."
 venezuela.2.a:0 "Хорошо."
 venezuela.3.t:0 "Победа [695.Owner.GetName] на Кюрасао"
 venezuela.3.d:0 "Защитники Кюрасао успешно отбили [VEN.GetAdjective] высадку и не позволили создать плацдарм. [VEN.GetAdjective] войска были вынуждены отступить, и остров по-прежнему прочно остаётся в руках [695.Owner.GetNameDef]."
 venezuela.3.a:0 "Хорошо."
 venezuela.4.t:0 "[VEN.GetAdjective] выборы 1935 года"
 venezuela.4.d:0 "После смерти Хуана Висенте Гомеса в конце 1935 года в [VEN.GetAdjective] политике развернулась ожесточённая борьба за достойного преемника. Ранее Гомес правил железной рукой, укрепляя свою власть и авторитет.\n\nПосле его смерти власть перешла к Элеасару Лопесу Контрерасу, соратнику и близкому другу Гомеса. Однако даже при прежнем режиме Контрерас резко критиковал его политику и намерен реформировать и модернизировать страну.\n\nВ Венесуэле также есть политические лидеры вроде Ромуло Гальегоса и Исайаса Медины Ангариты, считающие, что страна должна стать свободной демократией западного образца. Но более крайние силы, такие как генерал Маркос Перес Хименес, полностью поддерживают курс Гомеса и хотят его продолжить. Ранее Хименеса не допускали к серьёзному политическому влиянию, но нынешняя борьба за власть может стать для него идеальной возможностью захватить власть."
 venezuela.4.a:0 "Элеасар Контрерас реформирует и модернизирует Венесуэлу."
 venezuela.4.b:0 "Исайас Ангарита — консервативный реформатор, именно такой и нужен Венесуэле."
 venezuela.4.c:0 "Ромуло Гальегос знает, что лучше для [VEN.GetAdjective] народа."
 venezuela.4.e:0 "Маркос Хименес даст Венесуэле твёрдую руку."
 venezuela.5.t:0 "[VEN.GetName] предлагает объединение"
 venezuela.5.d:0 "Спустя более чем десять лет Венесуэла вновь желает объединиться с нами и создать великий союз. Что нам делать?"
 venezuela.5.a:0 "Вместе мы возродим наследие Боливара."
 venezuela.5.b:0 "Эта слава осталась в прошлом."
 venezuela.6.t:0 "[COL.GetName] принимает объединение"
 venezuela.6.d:0 "После ста лет разделения наши колумбийские братья с радостью соглашаются вновь стать частью Великой Колумбии."
 venezuela.6.a:0 "Вместе мы будем процветать."
 venezuela.7.t:0 "[COL.GetName] отвергает объединение"
 venezuela.7.d:0 "Колумбийцы оказались достаточно неразумны, чтобы отвергнуть наше предложение и ничего не предпринять. Придётся прибегнуть к военным действиям."
 venezuela.7.a:0 "Мы пытались решить всё мирно..."
 venezuela.8.t:0 "[VEN.GetName] требует Гайану"
 venezuela.8.d:0 "[VEN.GetAdjective] дипломаты направили ультиматум: вернуть Венесуэле территорию Гайаны, на которую она претендует с 1895 года, или столкнуться с военными действиями.\n\nКак нам ответить на эту угрозу?"
 venezuela.8.a:0 "У нас нет выбора."
 venezuela.8.b:0 "Нелепые притязания!"
 venezuela.9.t:0 "[687.Owner.GetNameDefCap] уступает"
 venezuela.9.d:0 "Столкнувшись с угрозой военных действий, [687.Owner.GetNameDefCap] согласилась выполнить наши требования, и территория Гайаны будет возвращена Венесуэле."
 venezuela.9.a:0 "Так и должно быть."
 venezuela.10.t:0 "[687.Owner.GetNameDefCap] отказывается уступить Гайану"
 venezuela.10.d:0 "[687.Owner.GetNameDefCap] проявила достаточно высокомерия, чтобы отвергнуть наши требования и не признать притязания, даже назвав их нелепыми!\n\nОднако в возможном конфликте они могут оказаться нам ровней, поэтому, возможно, стоит отступить."
 venezuela.10.a:0 "Лучше отступить."
 venezuela.10.b:0 "Эта земля принадлежит нам, нравится им это или нет."
 venezuela.11.t:0 "[VEN.Getname] запрашивает советников"
 venezuela.11.d:0 "Венесуэла просит направить военных советников для подготовки и модернизации её армии. Это может стать возможностью получить более широкий доступ к венесуэльскому нефтяному экспорту."
 venezuela.11.a:0 "Это хорошая возможность."
 venezuela.11.b:0 "Нас не интересует [VEN.GetAdjective] сторона."
 venezuela.12.t:0 "[GER.GetName] соглашается"
 venezuela.12.d:0 "[GER.GetName] удовлетворила нашу просьбу и направила на помощь генерала Вильгельма фон Фаупеля, главу Иберо-американского института."
 venezuela.12.a:0 "Прекрасная новость."
 venezuela.13.t:0 "[GER.GetName] отказывает"
 venezuela.13.d:0 "[GER.GetName] высокомерно отклонила просьбу и никого к нам не направит."
 venezuela.13.a:0 "Их потеря."
 venezuela.15.t:0 "Забастовки в Каракасе!"
 venezuela.15.d:0 "В последнее время в столице Каракасе вспыхнули многочисленные беспорядки и протесты, в основном подпитываемые крестьянским населением, недовольным условиями жизни и заработной платой. Большинство из них расположены вокруг дворца Мирафлорес, федерального правительственного учреждения Венесуэлы.\n\nМногие протестующие требовали реформ в сфере труда, налогов и повышения уровня жизни. Однако некоторые радикальные члены призвали к полному свержению правительства, ситуацию необходимо взять под контроль."
 venezuela.15.a:0 "Нужно что-то предпринять!"
 venezuela.15.b:0 "Возможно, это можно использовать в своих интересах."
 venezuela.16.t:0 "Инаугурация Элеасара Контрераса"
 venezuela.16.d:0 "Сегодня официально объявлено, что Элеасар Лопес Контрерас одержал убедительную победу на выборах благодаря широкой популярности среди правительства и народа.\n\nПозднее сегодня он будет приведён к присяге как 45-й президент Венесуэлы перед Конгрессом в Федеральном законодательном дворце.\n\nОбещания Контрераса модернизировать здравоохранение, инфраструктуру и вооружённые силы, одновременно постепенно возвращаясь к демократии, заставляют многих [VEN.GetAdjective] граждан видеть в этом событии начало новой эпохи."
 venezuela.16.a:0 "Герой [VEN.GetNameDef]."
 venezuela.17.t:0 "[VEN.GetName] предлагает пакт о ненападении"
 venezuela.17.d:0 "[VEN.GetName] предложила заключить пакт о ненападении между нашими странами, чтобы сохранить хорошие отношения и обеспечить мир в Боливарианской Америке."
 venezuela.17.a:0 "Разумеется!"
 venezuela.17.b:0 "У нас другие планы на [VEN.GetAdjective] сторону."
 venezuela.18.t:0 "Колумбия подписывает пакт"
 venezuela.18.d:0 "[COL.GetName] с радостью приняла наше предложение. Между нашими странами не будет военных действий."
 venezuela.18.a:0 "Мир для нашего времени."
 venezuela.19.t:0 "Колумбия отвергает пакт"
 venezuela.19.d:0 "[COL.GetName] высокомерно отвергла предложение прекратить вражду. Очевидно, колумбийцы нам не друзья."
 venezuela.19.a:0 "Это тревожно."
 venezuela.20.t:0 "Маркос Хименес захватывает власть"
 venezuela.20.d:0 "Сегодня страну потрясли события: молодой генерал Маркос Перес Хименес при поддержке армии штурмовал Национальное собрание и Федеральный законодательный дворец. Он вынудил Конгресс принять вотум недоверия и сместить действующее правительство, утвердившись диктатором Венесуэлы.\n\nХименес обещает восстановить венесуэльскую экономику и вернуть страну «на правильный путь» на международной арене.\n\nОднако многие граждане и даже часть военных считают его неопытным и деспотичным правителем, который лишь приведёт Венесуэлу к краху."
 venezuela.20.a:0 "Хименес принесёт Венесуэле славу."
 venezuela.21.t:0 "Инаугурация Исайаса Ангариты"
 venezuela.21.d:0 "Консервативный демократический лидер и генерал Исайяс Медина Ангарита едва сумел получить всенародное голосование и в рамках конгресса, однако ему удалось укрепить свою позицию, и теперь было объявлено, что он одержал победу на выборах.\n\nОн должен быть назначен 45-м президентом Венесуэлы перед Конгрессом Федерального законодательного дворца Союза.\n\nВопреки ожиданиям его недоброжелателей, у Медины есть планы по широкому демократическому открытию, допускающему противостояние различных идеологий и выражения. Он также пообещал улучшить трудовое законодательство, сделав много вещей, таких как расширение услуг культуры работников, повышение заработной платы рабочих и даже отмена ночного труда в некоторых отраслях промышленности. Много рабочего класса [VEN.GetAdjective]Они рады видеть предстоящие реформы в своей трудовой жизни, но некоторые сомневаются, что это может быть слишком амбициозным."
 venezuela.21.a:0 "Прекрасный исход!"
 venezuela.22.t:0 "Неожиданная победа Ромуло Гальегоса"
 venezuela.22.d:0 "Несмотря на поддержку среди крестьянского и рабочего населения, никто не ожидал, что Ромуло Гальегос получит какое-либо признание широкой общественности во время выборов из-за его непопулярности и пренебрежения со стороны правительства. Тем не менее, он воспользовался недавней коррупцией и нестабильностью и сплотил народ под одним простым лозунгом: «Демократия — Венесуэла», требуя реформ в области налогов, труда и избирательных прав.\n\nПри поддержке низшего класса населения Гальегосу удалось одержать решительную победу на выборах, и сегодня он должен быть назначен 45-м президентом Венесуэлы перед Конгрессом Федерального законодательного дворца Союза."
 venezuela.22.a:0 "Народ высказался."
 venezuela.23.t:0 "Судьба Маркоса Хименеса"
 venezuela.23.d:0 "Генерал Маркос Перес Хименес в последнее время создаёт проблемы [VEN.GetAdjective] правительству, подрывая верность армии в пользу старой диктаторской политики Хуана Висенте Гомеса. Страна разделилась: одни видят в Хименесе талантливого генерала и сильного лидера, другие — некомпетентного политика, отчаянно цепляющегося за устаревшие порядки.\n\nВ последнее время многие политики обсуждают, какую роль Хименес должен играть в армии и правительстве. Оставить его на службе и позволить стать политической угрозой? Или лишить звания и навсегда устранить опасность?"
 venezuela.23.a:0 "Оставить его — он всего лишь пешка."
 venezuela.23.b:0 "Он опасен и должен уйти."
 venezuela.24.t:0 "[VEN.GetName] захватывает Тринидад"
 venezuela.24.d:0 "[VEN.GetAdjective] войска провели морскую высадку на Тринидаде, успешно закрепились на берегу, быстро разгромили небольшой гарнизон и затем захватили столицу Порт-оф-Спейн.\n\nПозднее на пресс-конференции [VEN.GetAdjective] лидер [VEN.GetLeader] заявил, что Тринидад и Тобаго по праву принадлежат Венесуэле и что он намерен изгнать всех империалистов из Карибского региона. Разумеется, это абсурд, но остаётся решить, как реагировать: одни призывают к войне с [VEN.GetNonIdeologyName], другие сомневаются, стоит ли жертвовать жизнями ради двух небольших островов."
 venezuela.24.a:0 "Мы не позволим так с собой обращаться!"
 venezuela.24.b:0 "Это всего лишь два маленьких острова. Оставить их."
 venezuela.25.t:0 "Смерть Исайаса Ангариты"
 venezuela.25.d:0 "Прошлой ночью президент Исайас Ангарита перенёс тяжёлый тромбоз и умер во сне в возрасте 55 лет. Сегодня утром новость была обнародована, и в знак уважения объявлен двухдневный национальный траур.\n\nНет сомнений, что Ангарита достойно руководил Венесуэлой и многие будут по нему скучать. Его место займёт Герман Суарес Фламерич, которого позднее сегодня приведут к присяге как 46-го президента Венесуэлы перед Конгрессом в Федеральном законодательном дворце."
 venezuela.25.a:0 "Печальный день для Венесуэлы."
 venezuela.26.t:0 "[VEN.GetNameDefCap] усиливает притязания на Тринидад"
 venezuela.26.d:0 "Сегодня [VEN.GetAdjective] лидер [VEN.GetLeader] ясно заявил, что остров Тринидад, расположенный всего в 11 км от побережья Венесуэлы, по праву является частью страны и должен быть возвращён, даже силой.\n\nЭто может стать оправданием вторжения на остров, поэтому необходимо готовиться к худшему."
 venezuela.26.a:0 "Нужно что-то предпринять."
 venezuela.27.t:0 "Победа [VEN.GetName] на Тринидаде"
 venezuela.27.d:0 "После ожесточённых боёв [VEN.GetAdjective] войска успешно высадились на Тринидаде и разгромили [695.Owner.getAdjective] защитников, а затем захватили столицу Порт-оф-Спейн.\n\nХотя это может привести к более крупному региональному конфликту, остров теперь прочно находится в руках Венесуэлы."
 venezuela.27.a:0 "Хорошо."
 venezuela.28.t:0 "Победа [691.Owner.GetName] на Тринидаде"
 venezuela.28.d:0 "Защитники Тринидада успешно отбили [VEN.GetAdjective] высадку и не позволили создать плацдарм. [VEN.GetAdjective] войска были вынуждены отступить, и остров по-прежнему прочно остаётся в руках [691.Owner.GetNameDef]."
 venezuela.28.a:0 "Хорошо."
 venezuela.29.t:0 "Тупик на Тринидаде"
 venezuela.29.d:0 "Первая атака [VEN.getAdjective] вооружённых сил была отбита храбрыми защитниками Порт-оф-Спейна, а первая волна нападавших уничтожена в ближнем бою. Оставшиеся защитники перенесли раненых в городские укрепления, а погибших сожгли, чтобы предотвратить болезни в осаждённом городе.\n\nНаступающие войска сумели захватить несколько плацдармов у Мансанильи, Майаро и Матуры, создав местные про-[VEN.getAdjective] администрации в противовес законной власти островов.\n\nВ разных частях островов всё ещё слышны артиллерийские залпы и выстрелы, но при нынешних обстоятельствах ясно: конфликт не удастся решить вооружённой силой, потребуется дипломатия.\n\nНекоторые политики уже обсуждают условия официального прекращения огня между странами."
 venezuela.29.a:0 "Мы не позволим так с собой обращаться!"
 venezuela.29.b:0 "Оставить их. Эти острова не имеют значения."
 venezuela.30.t:0 "Президентские выборы 1941 года"
 venezuela.30.d:0 "Первый президентский срок [VEN.GetLeader] подходит к концу, и вскоре состоятся новые выборы. [VEN.GetLeader] намерен переизбраться, но ему противостоит молодой, опытный и перспективный офицер генерал Ауделино Морено, заявляющий о намерении продолжить курс предшественника.\n\nКого выберет народ?"
 venezuela.30.a:0 "Контрерас до сих пор хорошо служил стране."
 venezuela.30.b:0 "Ауделино Морено — достойный кандидат."
 venezuela.31.t:0 "Президентские выборы 1941 года"
 venezuela.31.d:0 "Первый президентский срок [VEN.GetLeader] подходит к концу, и вскоре состоятся новые выборы. [VEN.GetLeader] намерен переизбраться, но ему противостоит юрист и дипломат Герман Суарес Фламерич, обладающий значительным политическим влиянием и намеренный продолжить курс предшественника.\n\nКого выберет народ?"
 venezuela.31.a:0 "Ангарита до сих пор хорошо служил стране."
 venezuela.31.b:0 "Герман Фламерич — достойный кандидат."
 venezuela.32.t:0 "Поколение 28-го года"
 venezuela.32.d:0 "«Поколение 28-го года» было университетской активистской группой, объединявшей многих видных социал-демократов, коммунистов и независимых политиков, выступавших против режима Хуана Висенте Гомеса. После неудачного восстания Альварадо 1928 года многие участники были арестованы, а группа распущена.\n\nТеперь, после смерти Гомеса в декабре 1935 года, многие из этих политиков освобождены. Настало время восстановить группу и ударить, пока правительство отвлечено, чтобы покончить с тиранией."
 venezuela.32.a:0 "Мы раз и навсегда покончим с тиранией."
 venezuela.33.t:0 "Войска АРДИ восстают"
 venezuela.33.d:0 "Силы АРДИ подняли жестокое восстание в крупнейших городах страны и захватили множество ключевых позиций, вынудив местные гарнизоны отступить.\n\nПосле столь унизительного поражения Элеасар Лопес Контрерас оказался вынужден уйти с поста. Его заменил молодой офицер генерал Ауделино Морено, придерживающийся более... радикального подхода к подавлению восстания.\n\nНесмотря на преимущество АРДИ, очевидно, что страна стоит на пороге полномасштабной гражданской войны."
 venezuela.33.a:0 "Конец тирании!"
 venezuela.34.t:0 "КПВ захватывает власть"
 venezuela.34.d:0 "КПВ, пользующаяся огромной поддержкой крестьян и рабочих, сумела успешно вытеснить социал-демократов и других политиков, получив подавляющее большинство в АРДИ и фактически установив контроль над страной.\n\nЭто стало возможным благодаря широкой поддержке внутри страны. Многие считают происходящее новым рассветом Венесуэлы и концом капиталистической тирании. Однако за рубежом это вызвало резкое осуждение, поскольку КПВ ясно заявила о намерении национализировать нефтяные запасы и направить доходы на внутреннее развитие."
 venezuela.34.a:0 "Теперь Венесуэлой управляют рабочие."
 venezuela.35.t:0 "ДД укрепляет власть"
 venezuela.35.d:0 "«Демократическое действие», пользуясь большей поддержкой рабочих и широкого политического спектра, сумело получить подавляющее большинство в АРДИ и фактически взять страну под контроль.\n\nВнутри страны реакция неоднозначна. Для многих очевидно, что ДД стремится построить демократию американского образца в рамках социалистической системы. Однако другие, особенно крайне правые, считают ДД слишком тесно связанным с коммунистами и не доверяют его обещаниям.\n\nТолько время покажет."
 venezuela.35.a:0 "Лучше социалисты, чем коммунисты."
 venezuela.36.t:0 "Наследие президента Бетанкура"
 venezuela.36.d:0 "Всего за короткий срок президент Бетанкур полностью преобразил [VEN.GetAdjective] экономику и значительно повысил благосостояние и уровень жизни народа. Очевидно, что план Барранкильи увенчался успехом, а сам Бетанкур теперь считается героем.\n\nОсталась лишь девятая статья плана — реорганизация вооружённых сил, которую президент вновь возглавит лично."
 venezuela.36.a:0 "Венесуэла едина общей целью."
 venezuela.37.t:0 "[VEN.GetNameDef] просит вступить в [SOV.GetNameDef]"
 venezuela.37.d:0 "Новый [VEN.GetAdjective] коммунистический режим КПВ сегодня направил официальную просьбу о вступлении в СССР и предложил нам безоговорочную поддержку по любому вопросу.\n\nПредложение заманчиво, но географическое и стратегическое положение Венесуэлы может создать трудности."
 venezuela.37.a:0 "Всё ради наших товарищей."
 venezuela.37.b:0 "[VEN.GetNameDefCap]? Хорошая шутка."
 venezuela.38.t:0 "[SOV.GetNameDefCap] одобряет наше вступление"
 venezuela.38.d:0 "Советский лидер [SOV.GetLeader] с распростёртыми объятиями принял наше предложение и официально включил нас в состав СССР.\n\nВместе коммунизм силён."
 venezuela.38.a:0 "Мы польщены, товарищи."
 venezuela.39.t:0 "[SOV.GetNameDefCap] отклоняет наше вступление"
 venezuela.39.d:0 "Советский Союз возмутительным образом отклонил предложение вступить в СССР и даже заявил, что не заинтересован в распространении влияния на Латинскую Америку.\n\nПохоже, «родина революции» — не более чем ложь."
 venezuela.39.a:0 "Предатели."
 venezuela.40.t:0 "Креольские анархисты совершают переворот"
 venezuela.40.d:0 "[VEN.GetAdjective] анархистские группы, связанные с «Креоль Петролеум», подняли жестокое восстание, полностью распустили и разоружили АРДИ и погрузили столицу в хаос.\n\nСтрана охвачена неопределённостью и страхом."
 venezuela.40.a:0 "Что, чёрт возьми, происходит?"
