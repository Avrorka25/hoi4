l_russian:
 VEN_CARIBBEAN_fascism:0 "Венесуэльско-Карибская империя"
 VEN_CARIBBEAN_democratic:0 "Венесуэльско-Карибская федерация"
 VEN_CARIBBEAN_communism:0 "Союз Социалистических Латиноамериканских Республик"
 VEN_CARIBBEAN_neutrality:0 "Венесуэльско-Карибский союз"
 VEN_CARIBBEAN_fascism_DEF:0 "Венесуэльско-Карибская империя"
 VEN_CARIBBEAN_democratic_DEF:0 "Венесуэльско-Карибская федерация"
 VEN_CARIBBEAN_communism_DEF:0 "Союз Социалистических Латиноамериканских Республик"
 VEN_CARIBBEAN_neutrality_DEF:0 "Венесуэльско-Карибский союз"
 VEN_communist_faction_name:0 "Рабочий конгресс Латинской Америки"
 VEN_congress:0 "Обратиться к Конгрессу"
 VEN_congress_desc:0 "Диктатура Хуана Висенте Гомеса, продолжавшаяся с 1908 по 1935 год, наконец завершилась. Его противоречивое правление во многом изменило нашу формально демократическую республику. Настало время обсудить возникший вакуум власти в Национальном конгрессе в Каракасе."
 VEN_1935_elections:0 "Завершить выборы 1935 года"
 VEN_1935_elections_desc:0 "В последние годы Хуан Висенте Гомес отдалился от общества и проводил большую часть времени в личной резиденции в Маракае. Его внезапная и загадочная смерть заставила многих задуматься, кто поведёт [ROOT.getNameDef] к процветанию. Подсчёт голосов на выборах 1935 года всё ещё продолжается. Кто победил в борьбе за власть?"
 VEN_eleazar_contreras:0 "Провести инаугурацию Контрераса"
 VEN_eleazar_contreras_desc:0 "Бывший военный министр Элеасар Лопес Контрерас временно принял управление страной, пока «не будет найден более достойный кандидат». Теперь очевидно, что именно он лучше всего подходит для этой должности, поскольку большинство [ROOT.getAdjective] граждан проголосовало за него. Инаугурацию следует провести как можно скорее!"
 VEN_health_and_social_assistance:0 "Учредить Министерство здравоохранения"
 VEN_health_and_social_assistance_desc:0 "Высокую детскую смертность от многочисленных инфекционных заболеваний можно эффективнее сократить, если создать Министерство здравоохранения. Новые медицинские учреждения по всей стране также принесут большую пользу взрослому населению."
 VEN_jewish_asylum:0 "Предоставить убежище евреям"
 VEN_jewish_asylum_desc:0 "Видя борьбу еврейского народа Европы и Азии за свои права, Контрерас издал секретную директиву о предоставлении убежища всем еврейским беглецам и беженцам на [ROOT.getAdjective] земле. Их благодарность наверняка принесёт пользу и нашей стране."
 VEN_arnoldo_gabaldon:0 "Финансировать исследования Арнольдо Габальдона"
 VEN_arnoldo_gabaldon_desc:0 "За последние годы малярия унесла слишком много жизней. Новому Министерству здравоохранения требуется особое подразделение для широкомасштабной борьбы с болезнью. К счастью, уже успешно разработаны планы создания Специального управления маляриологии под руководством молодого учёного Арнольдо Габальдона."
 VEN_central_university:0 "Расширить Центральный университет"
 VEN_central_university_desc:0 "Центральный университет Венесуэлы был основан в 1721 году и считается одним из старейших, если не самым старым университетом Западного полушария. Дополнительное государственное финансирование повысит качество образования и откроет новые исследовательские возможности."
 VEN_miraflores_concessions:0 "Уступки протестующим у Мирафлореса"
 VEN_miraflores_concessions_desc:0 "Многие молодые люди выступают против авторитарного правления Гомеса и повсеместной коррупции чиновников. Самые радикальные требуют либерализации и демократизации государственного аппарата. Мы не можем уступить всем их требованиям, но, возможно, государственная реформа необходима ради светлого и благополучного будущего."
 VEN_presidential_amendment:0 "Реформировать президентские поправки"
 VEN_presidential_amendment_desc:0 "Мало кто осознаёт, насколько сильно президент способен изменить политический климат в высших эшелонах власти. Пусть [ROOT.getLeader] покажет народу, что он за лидер, добавив несколько поправок о национальной защите в то, что можно назвать конституцией [ROOT.getNameDef]."
 VEN_DSN:0 "Создать УНБ"
 VEN_DSN_desc:0 "Демократическая природа нашего хрупкого строя постоянно находится под угрозой изнутри и извне. Необходимо создать Управление национальной безопасности для выявления и подавления любых угроз действующим государственным институтам."
 VEN_reshuffle_of_general_staff:0 "Устранить убеждённых сторонников Гомеса"
 VEN_reshuffle_of_general_staff_desc:0 "Гомес и его клика привязали к себе многих мятежных генералов и командиров, позволив им обогащаться за счёт простого народа. Чтобы создать современное государство с организованными вооружёнными силами, необходимо избавиться от устаревших структур, поддерживающих каудильо."
 VEN_institute_1936_constitution:0 "Принять Конституцию 1936 года"
 VEN_institute_1936_constitution_desc:0 "Конституция [ROOT.getNameDef], являясь высшим законом страны, имеет множество недостатков. Президентский срок плохо регулируется, основные избирательные права недоступны значительной части населения, тогда как предпринимателям предоставлены чрезмерные привилегии. Ради народа это неравенство необходимо устранить!"
 VEN_german_relations:0 "Отношения с Германией"
 VEN_german_relations_desc:0 "Официальные дипломатические отношения между [ROOT.getNameDef] и [GER.getNameDef] восходят к 1871 году, когда в Каракасе открылось [GER.getAdjective] посольство, а соответствующие представительства появились во Франкфурте и Гамбурге. Дополнительные дипломатические миссии наверняка улучшат наши отношения."
 VEN_german_advisors:0 "Запросить германских советников"
 VEN_german_advisors_desc:0 "[GER.getAdjective] генеральный штаб имеет собственный военный отдел, отвечающий за сотрудничество и военную помощь «бывшим боливарианским странам Южной Америки». Следует направить официальный запрос на получение ценных специалистов, которые оценят подготовку и боевые возможности наших сил."
 VEN_german_oil_deal:0 "Германо-венесуэльская нефтяная компания"
 VEN_german_oil_deal_desc:0 "Борьба за нашу нефть идёт по всему миру: две ведущие державы, [GER.getNameDef] и [USA.getNameDef], стремятся обеспечить свои интересы. Сотрудничество с [GER.getAdjective] стороной станет ещё выгоднее, если создать новую нефтяную компанию для защиты наших нефтяных интересов."
 VEN_join_axis:0 "Оформить союз с Германией"
 VEN_join_axis_desc:0 "Разведка сообщает, что наше сближение с [GER.getNameDef] привлекло внимание банкиров из [USA.getAdjective] и [ENG.getAdjective] стран. Поступают сведения о возможной военной интервенции или попытке государственного переворота. Единственный выход — определиться и присоединиться к единому фронту против внешней угрозы."
 VEN_oil_reforms:0 "Расширить иностранные нефтяные концессии"
 VEN_isaias_angarita:0 "Сформировать умеренный кабинет"
 VEN_isaias_angarita_desc:0 "Недоверие народа к милитаристам и националистам проявилось яснее, чем когда-либо: Исайас Медина Ангарита, занявший наиболее либеральную и демократическую позицию, получил большинство голосов. Его обещание новой Венесуэлы станет ещё понятнее массам после сегодняшней инаугурационной речи."
 VEN_legalize_communism:0 "Легализовать КПВ"
 VEN_legalize_communism_desc:0 "Хотя Коммунистическая партия Венесуэлы долго оставалась бельмом на глазу правительства, она по-прежнему сохраняет поддержку среди сельского населения. Снижение напряжённости и поиск компромисса будут непростыми, но это единственный путь к желаемому будущему."
 VEN_promote_political_cooperation:0 "Продвигать политическое сотрудничество"
 VEN_promote_political_cooperation_desc:0 "Нерешительность и отсутствие взаимодействия между партиями наносят тяжёлый удар по демократическим институтам. Чтобы Конгресс работал в полную силу, а законы не оставались на бумаге, в будущем необходимо активно поощрять политическое сотрудничество."
 VEN_fate_of_jimenez:0 "Судьба Хименеса"
 VEN_fate_of_jimenez_desc:0 "Споры вокруг Маркоса Хименеса имеют огромное значение для нового демократического правительства. Военные способности и популярность среди солдат делают его идеальным кандидатом на руководство в случае захвата власти армией, однако его политические взгляды и программа крайне непопулярны в правительстве."
 VEN_protect_workers_rights:0 "Защитить права рабочих"
 VEN_protect_workers_rights_desc:0 "Прежний государственный аппарат слишком долго пренебрегал рабочими и их правами. Необходимо обеспечить простому человеку достойную зарплату, медицинское страхование и представительство через профсоюзы, как бы социалистически это ни звучало."
 VEN_nationalize_the_banking_sector:0 "Национализировать Центральный банк"
 VEN_nationalize_the_banking_sector_desc:0 "Руководство Центрального банка пошло по коррумпированному пути Гомеса и его клики, разместив многие ценные активы на личных счетах. Часть законных [VEN.getAdjective] доходов от экспорта нефти была обнаружена на [USA.getAdjective] рынках Уолл-стрит! Очевидно, у Центрального банка собственные планы на нас, и мы должны ударить первыми."
 VEN_housing_act:0 "Национальный закон о жилье"
 VEN_housing_act_desc:0 "Наши либеральные реформы наверняка получат поддержку беднейших и наиболее уязвимых граждан, если правительство обеспечит их жильём и рабочими местами. Общественная поддержка ещё сильнее склонится на нашу сторону!"
 VEN_constitute_womens_rights:0 "Закрепить права женщин"
 VEN_constitute_womens_rights_desc:0 "Завершая создание современного общества, мы должны обратиться к половине населения, с самого основания страны лишённой своих прав, — к женщинам! Мы станем первой страной Южной Америки, обеспечившей равные возможности всем [VEN.getAdjective] гражданам!"
 VEN_western_agreements:0 "Торговые соглашения с Западом"
 VEN_western_agreements_desc:0 "Приверженность демократическим принципам открывает уникальные возможности для заключения взаимовыгодных экономических соглашений с гигантами Запада."
 VEN_american_student_exchange:0 "Пригласить иностранных студентов"
 VEN_american_student_exchange_desc:0 "Многие считают это необходимостью, а мы видим прекрасную возможность: гранты западных стран позволят лучшим студентам учиться за рубежом и затем усилить национальные исследовательские группы."
 VEN_marcos_jimenez:0 "Передать власть Хименесу"
 VEN_marcos_jimenez_desc:0 "Результаты выборов должны быть объявлены в Национальном конгрессе через несколько недель, однако некоторые сторонники Маркоса Хименеса опасаются, что новый кандидат приведёт [VEN.getNameDef] к краху. Несколько групп уже разработали план, как «правильно подсчитать голоса»..."
 VEN_paramilitarism:0 "Создать военизированные отряды"
 VEN_paramilitarism_desc:0 "Многие из тех, кто помог нам прийти к власти, всё ещё не имеют официальных обязанностей перед государством. Эти верные мужчины и женщины могут служить силами поддержания порядка."
 VEN_enforce_army_loyalty:0 "Обеспечить верность армии"
 VEN_enforce_army_loyalty_desc:0 "Временное правление Контрераса уже показало, что местным каудильо требуется некоторая «экономическая помощь», чтобы сохранять верность нашему делу. К счастью, некоторые фермеры и предприниматели готовы добровольно использовать свои средства, чтобы заручиться поддержкой открытых к сотрудничеству генералов."
 VEN_reorganize_the_government:0 "Обеспечить верность военных"
 VEN_reorganize_the_government_desc:0 "Служба Гомесу мало отличается от службы Хименесу, и каждый предприимчивый каудильо должен это понимать. Если кто-то не подчинится, у нас найдётся несколько способов обеспечить послушание."
 VEN_military_youth:0 "Создать «Военную молодёжь»"
 VEN_military_youth_desc:0 "«Военная молодёжь», также известная как военизированная молодёжь, укрепит основу новых сил ополчения. Многие молодые рекруты охотно откликнутся на призыв страны."
 VEN_cult_of_personality:0 "Наследие Хуана Гомеса"
 VEN_cult_of_personality_desc:0 "Укрепив контроль над государством, Маркос Хименес последует по пути, который избрал для страны отец современной Венесуэлы Хуан Гомес! Пусть народ узнает волю нового Эль Бенемерито — «Достойного»!"
 VEN_crush_communists:0 "Разгромить КПВ"
 VEN_crush_communists_desc:0 "Как и её предшественница, Венесуэльская революционная партия, КПВ сделает всё возможное, чтобы прийти к власти. Остановить её — долг Хименеса, какой бы ни была цена!"
 VEN_spanish_civil_war_involvement:0 "Помочь испанским братьям"
 VEN_spanish_civil_war_involvement_desc:0 "На Испанском полуострове разразилась невиданная прежде война. Пусть они знают: наше испаноязычное братство едино против красной угрозы и прислужников капитализма!"
 VEN_suspend_elections:0 "Приостановить выборы"
 VEN_suspend_elections_desc:0 "Ради безопасности государства президентские выборы необходимо приостановить. Постоянная смена руководства лишь мешает последовательному развитию страны."
 VEN_military_colleges:0 "Военные училища"
 VEN_military_colleges_desc:0 "Верные режиму не должны забывать, что каждый каудильо обязан быть умным и сильным, как сам Хименес! Многие с юных лет последуют по стопам лидера, поступая в военные училища."
 VEN_privatize_oil:0 "Приватизировать ИФЕ"
 VEN_privatize_oil_desc:0 "Государственное управление железных дорог отвечает за доставку товаров населению. Его зависимость от иностранных инвестиций опасна для экономики и политической независимости. Быстрая национализация обеспечит государству дополнительные средства."
 VEN_nationalist_education:0 "Националистическое образование"
 VEN_nationalist_education_desc:0 "Необходимо реформировать систему образования, подчёркивая величие нации и укрепляя верность молодёжи режиму."
 VEN_new_republic:0 "Три года власти «Адеко»"
 VEN_new_republic_desc:0 "Избирательные комиссии неожиданно сообщают, что кандидат-«паршивая овца» от демократической оппозиции Ромуло Гальегос, вероятно, одержит убедительную победу. Столь стремительные политические перемены наверняка разозлят каудильо, радикальных националистов и коррумпированных чиновников, но очевидно, что для страны начинается новая эпоха."
 VEN_labour_reforms:0 "Трудовые реформы"
 VEN_labour_reforms_desc:0 "Устаревшее оборудование, нерегулируемый рабочий день и отсутствие социальной защиты уже унесли слишком много жизней рабочих. Необходимо провести реформы для улучшения состояния промышленности."
 VEN_liberalize_oil_trade:0 "Нефтяной закон «50 на 50»"
 VEN_liberalize_oil_trade_desc:0 "Иностранные компании владеют значительной долей активов и природных ресурсов страны. Недавние перемены в правительстве позволяют заключить с западными державами несколько справедливых торговых соглашений."
 VEN_depoliticize_the_army:0 "Деполитизировать армию"
 VEN_depoliticize_the_army_desc:0 "Военные уже показали, что их мнению по политическим вопросам нельзя доверять. Пусть генералы занимаются своим делом, а политики — своим. Только так можно сохранить режим."
 VEN_abolish_death_penalty:0 "Отменить смертную казнь"
 VEN_abolish_death_penalty_desc:0 "Ни один свободный человек не должен быть схвачен, заключён в тюрьму или уничтожен иным образом без законного решения равных ему. Если мы хотим полностью посвятить себя демократии, наше правосудие должно исключить и смертную казнь."
 VEN_tax_reforms:0 "Налоговые реформы"
 VEN_tax_reforms_desc:0 "Государственная налоговая система остаётся коррумпированной и опирается на устаревшие нормы. В Конгрессе уже рассматривается несколько проектов по её справедливому и гуманному пересмотру. Новый президентский указ поможет их продвижению и принятию."
 VEN_allow_new_elections:0 "Разрешить новые выборы"
 VEN_allow_new_elections_desc:0 "Государственный аппарат успешно модернизирован и укреплён новым поколением талантливых и преданных чиновников. Страна может начать полный переход к настоящей демократии."
 VEN_reorganize_the_PCV:0 "Реорганизовать КПВ"
 VEN_reorganize_the_PCV_desc:0 ""
 VEN_reorganize_the_ARDI:0 "Реорганизовать АРДИ"
 VEN_reorganize_the_ARDI_desc:0 "АРДИ была коалицией марксистов, социал-демократов, республиканцев и других независимых политиков, созданной в 1928 году с целью свергнуть режим Хуана Висенте Гомеса и «покончить с капиталистической тиранией». После неудачного восстания позднее в том же году она распалась, но нынешняя борьба за власть даёт идеальную возможность восстановить организацию и ударить, пока правительство отвлечено!"
 VEN_generation_of_28:0 "Поколение 28-го года"
 VEN_generation_of_28_desc:0 ""
 VEN_barranquilla_plan:0 "Продолжить план Барранкильи"
 VEN_barranquilla_plan_desc:0 ""
 VEN_soviet_support:0 "Искать помощи у Советов"
 VEN_soviet_support_desc:0 ""
 VEN_rebellion:0 "Начать Второе восстание Альварадо"
 VEN_rebellion_desc:0 "Первое восстание Альварадо 1928 года, возможно, и провалилось, но теперь, заручившись поддержкой народа и части военных, мы наверняка сможем раз и навсегда покончить и с военной, и с капиталистической тиранией!"
 VEN_enpower_the_pcv:0 "Усилить КПВ"
 VEN_enpower_the_pcv_desc:0 "Коррумпированные чиновники обвиняли КПВ во всех бедах страны. Разумеется, некоторые её действия были спорными, радикальными и порой бесчеловечными, поэтому для улучшения образа партии в глазах народа необходимо обновить руководство и скорректировать курс."
 VEN_purge_disloyal_officers:0 "Провести чистку среди офицеров-националистов"
 VEN_purge_disloyal_officers_desc:0 "В нашем идеальном венесуэльском коммунистическом обществе нет места недальновидным офицерам-националистам, способным снова поставить страну на колени. Они должны уйти."
 VEN_form_CPAI:0 "Создать КНВД"
 VEN_form_CPAI_desc:0 "Народный комиссариат внутренних дел, сокращённо КНВД, станет тайной полицией и разведывательной службой КПВ, созданной по образцу НКВД. Он необходим для защиты нашей революции."
 VEN_communist_reforms:0 "Радикализировать план Барранкильи"
 VEN_communist_reforms_desc:0 "План Барранкильи по своей сути социал-демократический, но его поддержали и подписали КПВ и наши товарищи-марксисты. Пятая статья плана призвана защитить народ от капиталистической тирании, и половинчатыми мерами этого никогда не добиться."
 VEN_concessions_to_oil_unions:0 "Уступки нефтяным профсоюзам"
 VEN_concessions_to_oil_unions_desc:0 "Экономика Венесуэлы стала столь коррумпированной прежде всего из-за отсутствия представительства нефтяных профсоюзов. Чтобы построить более сильную экономику, мы должны научиться сотрудничать с ними."
 VEN_redistribution_of_wealth:0 "Перераспределение богатства"
 VEN_redistribution_of_wealth_desc:0 "В Венесуэле, которую мы хотим построить, богатые нефтяные олигархи не должны оказывать огромное влияние на экономику. Мы изымем их средства и распределим их между рабочими, одновременно защищая народ от капиталистической тирании."
 VEN_peoples_university_of_venezuela:0 "Народный университет Венесуэлы"
 VEN_peoples_university_of_venezuela_desc:0 "Шестая и седьмая статьи плана Барранкильи предусматривают масштабные программы ликвидации неграмотности среди крестьян и рабочих, а также расширение автономии университетов. Мы воплотим это в жизнь. Ради народа."
 VEN_reorganization_of_congress:0 "Реорганизовать Конгресс"
 VEN_reorganization_of_congress_desc:0 ""
 VEN_under_soviet_dominion:0 "Следовать партийной линии"
 VEN_under_soviet_dominion_desc:0 "КПВ окружена врагами, поэтому очевидно, что необходимо укрепить отношения с родиной революции, чтобы защитить нашу собственную революцию."
 VEN_soviet_tank_factories:0 "Советские танковые заводы"
 VEN_soviet_tank_factories_desc:0 ""
 VEN_invite_soviet_officers:0 "Пригласить советских офицеров"
 VEN_invite_soviet_officers_desc:0 ""
 VEN_introduce_political_commissars:0 "Ввести политических комиссаров"
 VEN_introduce_political_commissars_desc:0 "Введение политических комиссаров в армии будет напоминать бойцам о великом деле, за которое они сражаются."
 VEN_venezuelan_way_of_communism:0 "Венесуэльская революция"
 VEN_venezuelan_way_of_communism_desc:0 ""
